  s\u00f5ngd neb\u00e3 to-to w\u00e3. Woto k\u0269tame t\u0269 mam da rat n wa lebg
  zall so-pakda. Mam s\u1ebdn wa n be be w\u00e3 me, m ma l\u028b\u0269\u0269 b\u00e3ag
