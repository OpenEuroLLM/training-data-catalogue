  y s\u1ebdn tar\u00e3?\\n3 K\u1ebder tara b\u00f5n-naands b\u0269 yimaas r\u00e3mb
  b\u0269 r\u028bbs la t\u1ebdn-kug b zags\u1ebd s\u1ebdn na maan y\u028b\u028bm n
