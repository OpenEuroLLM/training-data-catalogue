  Retrieved 2020-05-24.\"", "\"B K\u00d5O kiris-neb\u00e3 noor t\u0269 b maan a Zezi
  Kirist k\u0169um\u00e3 T\u1ebdegre, b s\u1ebdn boond me t\u0269 \u2018Soaala r\u0269\u0269b\u00e3.\u2019
  (1 Kor\u1ebdnt d\u00e3mba 11:20, Sebr S\u00f5ngo) B\u00f5e n k\u0269t t\u2019a v\u00f5or\u00e3
  tagem w\u028bsgo? Wakat b\u028bgo, la w\u00e3n to la b segd n maan-a?\\nA Zezi Kirist
  lugla t\u1ebdeg-k\u00e3ng Z\u028b\u0269f r\u00e3mb\u00e3 Pak y\u028bngo, y\u028b\u028bmd
  33 w\u00e3. Pak\u00e3 ra yaa kibs b s\u1ebdn da maand vugr bal y\u028b\u028bmd f\u00e3a,
  Z\u028b\u0269f r\u00e3mb\u00e3 kiuug ning b s\u1ebdn boond t\u0269 Niz\u00e3 w\u00e3
  rasem 14 daare. S\u1ebdn na y\u0269l n mag wakat k\u00e3ng\u00e3, Z\u028b\u0269f
  r\u00e3mb\u00e3 ra g\u0169uda raar ninga w\u0129ntooga s\u1ebdn kaoosd s\u1ebdn
  zems l\u025b\u025br 12, t\u0269 y\u028bng\u00e3 me kaoosd l\u025b\u025br 12 w\u00e3.
  R\u0169nd\u00e3-r\u0169nd\u00e3 a zemsa ne t\u028b\u028blg kiuug\u00e3 rasem 21
  w\u00e3. Ki-paalg ning b s\u1ebdn na n y\u00e3 s\u1ebdn deng t\u028b\u028blg kiuug
  rasem 21 b\u0269 a poor\u00e3 wilgda Niz\u00e3 kiuug\u00e3 pipi daare. B ra maanda
  Pak\u00e3 rasem 14 poore, w\u0129ndg\u00e3 k\u00f5om poore.\\nA Zezi maana Pak\u00e3
  ne a t\u028bm-t\u028bmdb\u00e3, n yiis a Zida Iskariot, n yaool n lugl Soaal\u00e3
  k\u0169um T\u1ebdegre. R\u0269-k\u00e3ng n ledg Z\u028b\u0269f r\u00e3mb\u00e3 Pak\u00e3,
  la yaa r\u1ebd n so t\u0269 b segd n t\u1ebdeg-a vugr bal y\u028b\u028bmd f\u00e3a.\\nA
  Mat\u0269e Ev\u00e3nzill\u00e3 wilga woto: \u201cA Zezi r\u0269ka buri n ning barka
  n kao n k\u00f5 b karen-biis\u00e3 n yeele: \u2018B\u0269 y reeg n d\u0269, y\u00f5w\u00e3
  yaa mam y\u0129nga.\u2019 B\u00e3mb yaool n d\u0269ka b\u00f5n-y\u0169udla, la b\u00e3mb
  s\u1ebdn ning barka, b\u00e3mb k\u00f5o b\u00e3mba n yeele: \u2018B\u0269 y\u00e3mb
  f\u00e3a y\u0169. T\u0269 b\u00f5e, y\u00f5w\u00e3 yaa mam z\u0269\u0269m s\u1ebdn
  yaa k\u00e3ab paalg z\u0269\u0269m s\u1ebdn daag neb w\u028bsg yel-w\u1ebdna sugr
  y\u0129nga.\u2019\u201d\u2014Mat\u0269e 26:26-28.\\nNeb k\u1ebder t\u1ebdedame t\u2019a
  Zezi toeema bur\u00e3 t\u0269 s\u0269d lebg a nemd la a toeem div\u1ebd w\u00e3
  t\u0269 lebg a z\u0269\u0269m. La b\u0169mb ba a yembr da pa y\u00e3k a Zezi y\u0129ng\u1ebd
  w\u00e3, a s\u1ebdn da wa n k\u00f5t-b bur\u00e3 sasa ye. A Zezi t\u028bm-t\u028bmdb\u00e3
  s\u0269d ra r\u0269ta a y\u0129ng\u00e3 la b ra y\u0169ud a z\u0269\u0269m\u00e3
  b\u0269? Ayo, bala woto ra na n y\u0269\u0269 ninsaal nemd w\u00e3br la W\u1ebdnnaam
  noor\u00e3 k\u0269\u0269sgo. (S\u0269ngre 9:3, 4; Maank\u028b\u028bre 17:10) S\u00e3
  n yaa ne Luk 22:20 (K\u00e3ab-paalg\u00e3 Koe-noogo) a Zezi yeelame: \u201cB\u00f5n-y\u0169udl
  k\u00e3ng\u00e3 yaa k\u00e3ab paalga, mam z\u0269\u0269m\u00e3 s\u1ebdn daag y\u00e3mb
  y\u0129ng\u00e3 maasem y\u0129nga.\u201d Yaa b\u00f5n-y\u0169udl k\u00e3ng\u00e3
  n s\u0269d lebg \u2018k\u00e3ab paalg\u00e3\u2019 b\u0269? Ra pa t\u00f5e n y\u0269
  woto ye, bala k\u00e3abg b\u0269 kaool yaa zems taaba, la pa b\u0169mb b s\u1ebdn
  t\u00f5e n y\u00e3 ne nif b\u0269 n s\u0269\u0269s ye.\\nWoto y\u0129nga, bur\u00e3
  ne div\u1ebd w\u00e3 f\u00e3a ra yaa b\u00f5n-makds bala. Bur\u00e3 makda Kirist
  y\u0129ng\u00e3 s\u1ebdn zems z\u00e3ng\u00e3. A Zezi kell n d\u0269ka Pak\u00e3
  r\u0269\u0269b bur s\u1ebdn kell\u00e3 a yembre. Yaa bur s\u1ebdn pa ning rab\u0269lle.
  (Yikri 12:8) Biibl\u00e3 r\u0269kda rab\u0269ll n makd yel-w\u1ebdn b\u0269 s\u00e3oongo.
  Woto y\u0129nga, bur\u00e3 makda a Zezi y\u0129ng\u00e3 s\u1ebdn zems z\u00e3ng
  a s\u1ebdn d\u0269k n maan maoong\u00e3. Ra yaa y\u0129ng s\u1ebdn pa tar yel-w\u1ebdnde.\u2014Mat\u0269e
  16:11, 12; 1 Kor\u1ebdnt d\u00e3mba 5:6, 7; 1 P\u0269\u025b\u025br 2:22; 1 Z\u00e3
  2:1, 2.\\nDiv\u1ebd miuug\u00e3 makda a Zezi z\u0269\u0269m\u00e3. Z\u0269-k\u00e3ng
  k\u0269tdame t\u0269 kaool paalg\u00e3 lebg yel-s\u0269d s\u1ebdn tar y\u00f5odo.
  A Zezi yeelame t\u0269 b raaga a z\u0269\u0269m\u00e3 \u201cyel-w\u1ebdna sugr y\u0129nga.\u201d
  Woto, \u00e3dem-biis\u00e3 t\u00f5e n y\u0269\u0269 y\u0269lem W\u1ebdnnaam nif\u1ebd
  n t\u00f5e n k\u1ebd kaool paalg\u00e3 p\u028bg\u1ebd ne a Zeova. (Hebre d\u00e3mba
  9:14; 10:16, 17) Kaool k\u00e3ng maasem y\u0129nga, kiris-neb 144000 s\u1ebdn yaa
  sakdb n t\u00f5e n k\u1ebdng saas\u1ebd. Been\u1ebd b na n y\u0269\u0269 r\u0129m
  d\u00e3mb la maan-k\u028b\u028bdb \u00e3dem-biis\u00e3 f\u00e3a bark y\u0129nga.\u2014S\u0269ngre
  22:18; Zeremi 31:31-33; 1 P\u0269\u025b\u025br 2:9; Wilgri 5:9, 10; 14:1-3.\\n\u00c3nda
  r\u00e3mb n segd n w\u00e3b bur\u00e3 la b y\u0169 div\u1ebd w\u00e3? Wa s\u1ebdn
  zemse, yaa neb nins bal s\u1ebdn be kaool paalg\u00e3 p\u028bg\u1ebd w\u00e3, s\u1ebdn
  dat n yeel t\u0269 yaa neb nins s\u1ebdn tar saagr n na n k\u1ebdng saas\u1ebd w\u00e3
  n segd n w\u00e3b bur\u00e3 la b y\u0169 div\u1ebd w\u00e3. W\u1ebdnnaam v\u028b\u028bsem
  s\u00f5ng\u00e3 k\u0269tdame t\u0269 nin-k\u00e3ens\u00e3 b\u00e3ng v\u1ebdeneg
  t\u0269 b t\u0169us-b lame t\u0269 b na n y\u0269 r\u0129m d\u00e3mb saas\u1ebd.
  (Rom d\u00e3mba 8:16) A Zezi leb n maana kaool ne b\u00e3mba, R\u0129ung y\u0129nga.\u2014Luk
  22:29.\\nYaa w\u00e3n to y\u1ebd ne neb nins s\u1ebdn tar saagr n na n v\u0269\u0269md
  wakat s\u1ebdn k\u00f5n sa t\u1ebdng zug Arz\u00e3n\u00e3 p\u028bg\u1ebd w\u00e3?
  B sakda a Zezi s\u1ebdn da k\u00f5 noor\u00e3 n k\u1ebdngd Soaal\u00e3 k\u0169um
  T\u1ebdegr\u1ebd. La b wata be n kelgd ne waoogre, la b pa w\u00e3bd bur\u00e3,
  b pa y\u0169ud div\u1ebd w\u00e3 me. Vugr y\u028b\u028bmd f\u00e3a, Niz\u00e3 rasem
  14, w\u0129ndg k\u00f5om poore, a Zeova Kaset r\u00e3mb\u00e3 maanda Soaal\u00e3
  k\u0169um T\u1ebdegre. Baa ne s\u1ebdn yaa neb tus a w\u00e3n bal n ket s\u1ebdn
  yet t\u0269 b tara saas\u1ebd v\u0269\u0269m\u00e3 saagr\u00e3, t\u1ebdeg-k\u00e3ng\u00e3
  tara y\u00f5od w\u028bsg ne kiris-neb\u00e3 f\u00e3a. Yaa sasa neb\u00e3 f\u00e3a
  s\u1ebdn t\u00f5e n tags W\u1ebdnnaam a Zeova la a Zezi Kirist nonglm\u00e3 s\u1ebdn
  ka mak-n-taag\u00e3 zugu.\u2014Z\u00e3 3:16.\"", "\"Karemdb\u00e3 sogsgo\\nBiig
  s\u1ebdn dog k\u0269\u0269ng t\u00f5e n wa v\u028b\u028bgame b\u0269?\\nT\u00f5e
  n y\u0269\u0269 toog ne roagdb nins s\u1ebdn z\u0269 n paam yel-k\u00e3ng\u00e3
  w\u00e3 t\u0269 b w\u028bm a s\u1ebdn namsd ned to-to w\u00e3. Yel-k\u00e3ng\u00e3
  namsda roagdb k\u1ebder hal w\u028bsgo. Pag a ye doga kamb a nu t\u0269 yaa woto.
  Kaoosg poore, kom-dibli a yi la a rog t\u0269 b tar laaf\u0269. La baa ne r\u1ebd
  f\u00e3a, a ket n t\u1ebdra kamb a nu w\u00e3 f\u00e3a a s\u1ebdn dog t\u0269 y\u0269
  k\u0269\u0269ms\u00e3 yelle. Hal n t\u00e3ag a y\u00f5ore, a ra ket n t\u1ebdra
  a kamb nins f\u00e3a s\u1ebdn ki w\u00e3 y\u028b\u028bma b s\u00e3 n da pa maan
  kaalem. R\u1ebd y\u0129nga kiris-neb\u00e3 t\u00f5e n tika W\u1ebdnnaam noy\u00e3
  zug n yeel t\u0269 b kamb nins s\u1ebdn ki woto w\u00e3 na n wa v\u028b\u028bgame
  b\u0269?\\nKo\u025b\u025bg-ko\u025b\u025bga d pa mi ye. Biibl\u00e3 pa wilgd v\u1ebdeneg
  b s\u00e3 n na n wa v\u028b\u028bga kom-k\u00e3ens\u00e3 b\u0269 b pa na n v\u028b\u028bg-b
  ye. La W\u1ebdnnaam Gomd\u00e3 tara noy b\u0269 kibay s\u1ebdn t\u00f5e n s\u00f5ng-d
  la bels-do.\\nB\u0269 d leok sogsg a yiib nins s\u1ebdn p\u028bgd\u00e3. Pipi, s\u00e3
  n yaa ne a Zeova, ninsaal v\u0269\u0269m s\u0269ngda a s\u1ebdn wat n be a ma p\u028bg\u1ebd
  w\u00e3 b\u0269, b\u0269 a rogm\u00e3 sasa? Yiib-n-soaba, r\u1ebd y\u0129nga a Zeova
  geta b r\u00e3mb nins s\u1ebdn ket n be b ma r\u00e3mb p\u028bs\u1ebd w\u00e3 wa
  ninsaalb b\u0269, b\u0269 z\u0269-p\u025bl bala? Biibl\u00e3 noy t\u00f5e n s\u00f5ng-d
  lame t\u0269 d b\u00e3ng sogs-k\u00e3ens\u00e3 leoore.\\nA Moiiz t\u00f5og\u00e3
  wilga v\u1ebdeneg t\u0269 ninsaal v\u0269\u0269m pa s\u0269ngd a rogem sasa ye.
  A v\u0269\u0269m\u00e3 s\u0269ngda a s\u1ebdn wat n be a ma p\u028bg\u1ebd w\u00e3.
  B\u00f5e y\u0129ng t\u0269 d yet woto? Bala t\u00f5og\u00e3 wilgame t\u0269 ned
  s\u00e3 n maan t\u0269 pag p\u028bg s\u00e3ame, b segd n k\u028b\u028b a soab\u00e3
  n lebs r\u1ebd y\u0129nga. Ges-y no-k\u00e3ng\u00e3: \u201cNeda na n yao a v\u0269\u0269m,
  v\u0269\u0269m y\u0129nga.\u201d * (Yik. 21:22, 23) D\u1ebdnd s\u1ebdn be-a pag\u00e3
  p\u028bg\u1ebd w\u00e3 v\u0269\u0269me, la a yaa ninsaala. Neb mily\u00f5 r\u00e3mb
  s\u1ebdn b\u00e3ng woto w\u00e3 k\u0269tame t\u0269 b pa yiisd p\u028bse, la t\u0269
  b s\u00e3 n maan d\u1ebd b beega W\u1ebdnnaam.\\nLa w\u00e3n to la a Zeova get biig
  s\u1ebdn nan ket n be a ma p\u028bg\u1ebd? Wala t\u00f5og\u00e3 s\u1ebdn wilg\u00e3,
  ned s\u00e3 n da maan t\u0269 pag p\u028bg s\u00e3ame, b segd n k\u028b\u028b a
  soab\u00e3 n lebse. D\u1ebdnd woto wilgda v\u1ebdeneg t\u0269 pag s\u00e3 n t\u028bt\u1ebd,
  s\u1ebdn be-a a p\u028bg\u1ebd w\u00e3 tara y\u00f5od w\u028bsg W\u1ebdnnaam nif\u1ebd.
  Biibl\u00e3 verse r\u00e3mb a taab wilgdame t\u2019a Zeova getame t\u0269 y\u1ebd
  me yaa ninsaala. Wala makre, r\u0129m a Dav\u0269\u0269d ra goma a Zeova yell woto:
  \u201cY\u00e3mb n yag maam m ma p\u028bg\u1ebd. . . . Y\u00e3mb nin da nee maam
  wakat ninga mam s\u1ebdn ket n yaa b\u00f5n-naandg\u00e3. Mam dasem t\u025bk g\u028blsa
  y\u00e3mb sebr\u1ebd, t\u0269 b\u00e3mb daar ba a ye nan ka be\u1ebd ye.\u201d\u2014Y\u0269\u0269l
  139:13-16; Zoob 31:14, 15.\\nA Zeova leb n mii kamb nins s\u1ebdn be b ma p\u028bs\u1ebd
  w\u00e3 s\u1ebdn yaa neb ninsi, la b s\u1ebdn t\u00f5e n wa maan b\u0169mb nins
  beoog daare. A Izaak pag a Rebeka s\u1ebdn wa n tar a kinkirs\u00e3 p\u028bg\u00e3,
  a Zeova togsa b\u00e3ngr-gomd kamb\u00e3 s\u1ebdn wa n maood taab b ma p\u028bg\u1ebd
  w\u00e3 zugu. Woto wilgdame t\u2019a ra zoe n mii b s\u1ebdn yaa neb ninsi, la b
  s\u1ebdn na n wa maan b\u0169mb nins neb\u00e3 y\u0129ng beoog daar\u00e3.\u2014S\u0269ng.
  25:22, 23; Rom 9:10-13.\\nA Z\u00e3mbatiis me s\u1ebdn wa n be a ma p\u028bg\u1ebd,
  Biibl\u00e3 yeela woto: \u201cA Elizab\u025bt s\u1ebdn w\u028bm a Maari p\u028b\u028bsg\u00e3,
  biiga s\u1ebdn be y\u1ebd p\u028bg\u1ebd w\u00e3 lebgame, la a Elizab\u025bt pida
  ne S\u0269\u0269g S\u00f5ngo.\u201d (Luk 1:41) Logtor a Luk s\u1ebdn wa n gomd kiba-k\u00e3ng\u00e3
  yell\u00e3, g\u025brk gom-bil ning a s\u1ebdn t\u0169nug ne n wilg kibar\u00e3 t\u00f5e
  n yaa biig s\u1ebdn nan ket a ma p\u028bg\u1ebd, b\u0269 biig s\u1ebdn doge. Yaa
  gom-bi-k\u00e3ng\u00e3 me la a t\u0169nug ne n gom a Zezi yell b s\u1ebdn wa sagl-a
  r\u0169ms\u00e3 koglg\u00e3 p\u028bg\u1ebd w\u00e3.\u2014Luk 2:12, 16; 18:15.\\nWa
  d s\u1ebdn y\u00e3 w\u00e3, r\u1ebd y\u0129nga d t\u00f5e n tika Biibl\u00e3 zug
  n yeel t\u0269 s\u1ebdn nan ket b ma r\u00e3mb\u00e3 p\u028bs\u1ebd w\u00e3 ne kom-peels\u00e3
  yaa toor-toor b\u0269? Ayo d ka t\u00f5e ye. Woto zemsa ne b\u00e3ngdb\u00e3 s\u1ebdn
  vaees n y\u00e3 b\u0169mb nins r\u0169nd\u00e3-r\u0169nd\u00e3 w\u00e3. Wala makre,
  b wilgame t\u0269 biig s\u1ebdn nan ket n be a ma p\u028bg\u1ebd t\u00f5e n b\u00e3nga
  b\u0169mb nins s\u1ebdn maand y\u0269ng\u00e3, la b\u00f5n-k\u00e3ens t\u00f5e n
  y\u0269-a-la noog b\u0269 n y\u025b\u025bs-a. Woto k\u0269tame t\u0269 pag s\u1ebdn
  t\u028bt s\u1ebdn mi a biig s\u00f5ma w\u00e3 pa lingr ne t\u00f5nd ye.\\nKamb\u00e3
  rogem wakat pa yembr ye. S\u00e3nda kaoosdame n yaool n doge, t\u0269 k\u1ebder
  me pa kaoosd\u1ebd ye. Wala makre, pag t\u00f5e n doga biig t\u0269 kiis a w\u025b
  w\u00e3 pa ta, t\u0269 biig\u00e3 ki rasem a w\u00e3n poor bala. A to me t\u00f5e
  n tall p\u028bg hal t\u0269 kiis a w\u025b w\u00e3 ta, t\u2019a rog-a k\u0269\u0269nga.
  R\u1ebd y\u0129nga pipi soab\u00e3 na n saagdame t\u2019a s\u1ebdn paam n dog\u00e3
  y\u0129ng bala biig\u00e3 na n wa v\u028b\u028bgame t\u0269 yiib-n-soab\u00e3 yaool
  n pa tar saagr b\u0269?\\nKo\u025b\u025bg-ko\u025b\u025bga, Biibl\u00e3 wilgdame
  t\u0269 ninsaal v\u0269\u0269m s\u0269ngda a s\u1ebdn wat n be a ma p\u028bg\u1ebd,
  la t\u2019a Zeova getame t\u0269 y\u1ebd me yaa ninsaala, la a tara y\u00f5od w\u028bsgo.
  Neb k\u1ebder t\u00f5e n tika Biibl\u00e3 s\u1ebdn wilg\u00e3 zug n yeel t\u0269
  pag s\u00e3 n dog k\u0269\u0269nga, b\u0269 a p\u028bg s\u00e3 n s\u00e3am t\u0269
  f yeel t\u2019a biig\u00e3 pa na wa v\u028b\u028bge, f k\u0269\u0269sa Biibl\u00e3.
  B t\u00f5e n tagsdame t\u0269 f s\u00e3 n yeel woto, t\u00f5e n k\u0269tame t\u0269
  neb\u00e3 maand s\u00e3mb-s\u00e3mb p\u028bs\u00e3 yiisg w\u025b\u025bng\u1ebd.
  La Biibl\u00e3 no-k\u00e3ens\u00e3 yaool n wilgdame t\u0269 W\u1ebdnnaam kisa p\u028bs\u00e3
  yiisgu.\\nP\u0129nd\u00e3, G\u0169usg Gasg\u00e3 ra maan\u00e3 sogsg la a wilg kamb
  nins s\u1ebdn dog k\u0269\u0269ms\u00e3 k\u0169um v\u028b\u028bgr\u00e3 w\u025b\u025bng\u1ebd,
  t\u0269 ra k\u0269t t\u0269 neb\u00e3 maand s\u00e3mb-s\u00e3mb ne r\u1ebd. Wala
  makre, b ra soka woto: Pag p\u028bg s\u00e3 n da s\u00e3amame, r\u1ebd y\u0129nga
  arz\u00e3n\u00e3 p\u028bg\u1ebd W\u1ebdnnaam na n k\u0269tame t\u2019a lebs n d\u0269k
  p\u028b-k\u00e3ng b\u0269? La Siglg\u00e3 taoor l\u028b\u0269tb Sull\u00e3 p\u028b\u028bsa
  W\u1ebdnnaam n maan vaeesg la a b\u028bgs yell\u00e3 zug neere, n mik t\u0269 sogs-k\u00e3ens\u00e3
  pa tar y\u00f5od k\u0169um v\u028b\u028bgr\u00e3 w\u025b\u025bng\u1ebd ye. Bala
  a Zezi yeelame t\u0269 \u201cW\u1ebdnnaam t\u00f5ee b\u0169mb f\u00e3a.\u201d (Mark
  10:27) W\u1ebdnnaam s\u1ebdn d\u0269k a Zezi v\u0269\u0269m\u00e3 saas\u1ebd n wa
  ning a Maari s\u1ebdn da nan pa mi rao p\u028bg\u1ebd w\u00e3 wilgdame t\u0269 W\u1ebdnnaam
  s\u0269d t\u00f5ee b\u0169mb f\u00e3a. La ninsaalb nif\u1ebd, woto yaa b\u0169mb
  s\u1ebdn pa t\u00f5e.\\nR\u1ebd y\u0129nga woto f\u00e3a rat n yeelame t\u0269 Biibl\u00e3
  wilgdame t\u0269 pag p\u028bg s\u00e3 n s\u00e3am b\u0269 a biig\u00e3 s\u00e3 n
  dog k\u0269\u0269nga, biig\u00e3 na n wa v\u028b\u028bgame b\u0269? D segd n b\u00e3ngame
  t\u0269 Biibl\u00e3 pa leokd sok-k\u00e3ng\u00e3 v\u1ebdeneg-v\u1ebdeneg ye. D\u1ebdnd
  b\u0169mb kae d s\u1ebdn t\u00f5e n tik n yeel v\u1ebdeneg t\u0269 kom-k\u00e3ens\u00e3
  na n wa v\u028b\u028bgame ye. Sok-k\u00e3ng\u00e3 t\u00f5e n le waa ne sogs a taaba.
  D\u1ebdnd y\u0269ta s\u00f5ma t\u0269 d ra bao n na n w\u1ebd no-ko\u025b\u025bm
  sok-k\u00e3ng\u00e3 zug ye. D s\u1ebdn mi bal yaa t\u2019a Zeova yaa W\u1ebdnnaam
  s\u1ebdn yaa nonglem la nimb\u00e3an-zoet\u00e3, la a mii a s\u1ebdn na n wa maan
  b\u0169mb ninga. (Y\u0269\u0269l 86:15) S\u00e3mbg s\u1ebdn ka be, a rata ne a s\u0169ur
  f\u00e3a n v\u028b\u028bg s\u1ebdn ki-b\u00e3 t\u0269 k\u0169um meneme. (Zoob 14:14,
  15) D segd n talla bas-yard t\u0269 W\u1ebdnnaam maanda t\u0269rg wakat f\u00e3a,
  la a na n k\u0269tame t\u2019a bi-ribl\u00e3 \u201cs\u00e3am S\u028b\u0269t\u00e3ana
  t\u028b\u028bm\u00e3,\u201d t\u0269 zu-loees nins f\u00e3a t\u00f5nd s\u1ebdn tar
  d\u0169ni-w\u1ebdng k\u00e3ng\u00e3 p\u028bg\u1ebd w\u00e3 sa.\u20141 Z\u00e3 3:8.\\n[T\u1ebdngr
  note]\\n^ sull 6 Biibl d\u00e3mb w\u028bsg p\u028bs\u1ebd, b s\u1ebdn lebg verse
  k\u00e3ng\u00e3 to-to w\u00e3 wilgdame t\u0269 yaa ma w\u00e3 s\u00e3 n ki bal la
  b segd n lebs v\u0269\u0269m, v\u0269\u0269m y\u0129nga. La ne hebre, verse w\u00e3
  wilgame t\u0269 pa pag\u00e3 v\u0269\u0269m bal la b segd n lebs ye. Biig\u00e3
  me s\u00e3 n ki, b segd n lebsa v\u0269\u0269m, v\u0269\u0269m y\u0129nga.\\n[Foto,
  seb-neng 23]\\nA Zeova na n wa k\u0269tame t\u0269 s\u0169-s\u00e3ams\u00e3 f\u00e3a
  sa\"", "\"Sak-y-y\u00e3 a Zeova kiblg\u00e3 wakat f\u00e3a\\n\u2018Ra paoog a Zeova
  [kiblg] ye.\u2019\u2014YELB\u0168NA 3:11.\\n1. B\u00f5e y\u0129ng t\u0269 d segd
  n sak W\u1ebdnnaam kiblg\u00e3?\\nP\u0128ND w\u1ebdnd\u1ebd Isra\u025bll r\u0129m
  a Salomo wilgda t\u00f5nd ned kam f\u00e3a s\u1ebdn segd n sak W\u1ebdnnaam kiblg\u00e3
  v\u00f5ore. A yeela woto: \u201cM biiga, ra paoog Zusoaba [kiblg] ye, la ra zoe
  b t\u00e3sga ye. T\u0269 b\u00f5e, Zusoaba s\u0269bgda b s\u1ebdn nong a soab wa
  ned s\u1ebdn s\u0269bgd a bi-nongre.\u201d (Yelb\u0169na 3:11, 12) S\u0269d-s\u0269da,
  t\u00f5nd saas\u1ebd Ba w\u00e3 s\u00e3 n kibind neda, yaa a s\u1ebdn nong-a y\u0129nga.\\n2.
  Kiblg yaa b\u00f5e, la w\u00e3n-w\u00e3n la b t\u00f5e n kibl-du?\\n2 Kibl ned rat
  n yeelame t\u0269 rems-a b\u0269 s\u0269bg-a a neer y\u0129nga. Leb n dat n yeelame
  t\u0269 wub ned b\u0269 wilg neda. T\u028bm-t\u028bmd a Poll g\u028blsa woto: \u201cYaa
  s\u0269d t\u0269 s\u0269bgr f\u00e3a wakate, w\u1ebdnda toogo la s\u0169-s\u00e3oongo,
  la baoosgo, a yaool n wata ne t\u0269rlem la laaf\u0269 neb nins s\u1ebdn sakda
  y\u0129nga.\u201d (Hebre d\u00e3mba 12:11) Ned s\u00e3 n sak t\u0269 W\u1ebdnnaam
  a Zeova kibl-a, a na n t\u0169 a noy\u00e3 t\u0269 r\u1ebd k\u0269t t\u2019a paam
  n p\u1ebdneg a Zeova s\u1ebdn yaa s\u00f5ng\u00e3. (Y\u0269\u0269l S\u00f5amy\u00e3
  99:5) W\u1ebdnnaam t\u00f5e n t\u0169nuga ne t\u00f5nd t\u1ebded-n-taas\u00e3 n
  kibl-du. A leb n t\u00f5e n kibl-d-la ne tigiss\u00e3 maasem, ne d Biibl\u00e3 z\u00e3msg
  la \u201ct\u028bm-t\u028bmd s\u1ebdn t\u0169ud s\u0269d\u00e3\u201d s\u1ebdn yiisd
  s\u025bb nins\u00e3 kareng maasem. (Luk 12:42-44) Ad b s\u00e3 n wa s\u00f5ng-d
  t\u0269 d b\u00e3ng b\u0169mb d s\u1ebdn segd n demse, d s\u0169ur segd n y\u0269\u0269
  noogo! La ned s\u00e3 n maan yel-w\u1ebdn-k\u00e3senga, kibl-b\u028bg buud la a
  t\u00f5e n paame?\\nB s\u1ebdn yiisd neb k\u1ebder tiging\u00e3 p\u028bg\u1ebd w\u00e3
  v\u00f5ore\\n3. B\u00f5e y\u0129ng la b yiisd ned tiging\u00e3 p\u028bg\u1ebd?\\n3
  Kiris-neb\u00e3 s\u1ebdn yaa W\u1ebdnnaam s\u00f5gen d\u00e3mb\u00e3 z\u00e3msda
  Biibl\u00e3 la s\u025bb a taab b s\u1ebdn yiisd b y\u0129nga. B z\u00e3msda a Zeova
  noy\u00e3 b tigiss\u1ebd w\u00e3 la b tigis-k\u00e3sems\u1ebd w\u00e3. R\u1ebd k\u0269tame
  t\u0269 kiris-neb\u00e3 mi a Zeova s\u1ebdn dat t\u0269 b maan b\u0169mb nins\u00e3.
  Yaa tiging\u00e3 ned s\u00e3 n wa maan yel-w\u1ebdn-k\u00e3seng n pa rat n tek yam
  n kos sugr bal la b yiisd-a tiging\u00e3 p\u028bg\u1ebd.\\n4, 5. Biibl\u00e3 kiba-b\u028bg
  s\u1ebdn wilgd ned b s\u1ebdn yiis tiging p\u028bg\u1ebd yell la b gomd ka, la b\u00f5e
  y\u0129ng t\u0269 b wa sagl tiging\u00e3 neb t\u0269 b lebs n deeg-a?\\n4 D vaees
  Biibl\u00e3 kibar a ye s\u1ebdn gomd kiris-ned b s\u1ebdn da yiis yelle. Kor\u1ebdnt
  kiris-neb\u00e3 ra basa ned s\u1ebdn yo yoob buud s\u1ebdn z\u0269 n z\u0129nd neb
  nins s\u1ebdn da pa p\u028b\u028bsd W\u1ebdnnaam\u00e3 meng s\u028bk t\u2019a be
  tiging\u00e3 p\u028bg\u1ebd. Nin-k\u00e3ng\u00e3 \u2018ra tara a ba paga.\u2019
  A Poll sagla Kor\u1ebdnt tiging\u00e3 neb t\u0269 b \u201cbas-a S\u028b\u0269t\u00e3ana
  nug\u1ebd, t\u2019a y\u0129nga ratem s\u00e3am t\u2019a s\u0269\u0269ga paam f\u00e3agre.\u201d
  (1 Kor\u1ebdnt d\u00e3mba 5:1-5) B s\u1ebdn yiis s\u1ebdn maan-a yel-w\u1ebdnd\u00e3
  n bas-a a S\u028b\u0269t\u00e3an nug\u1ebd w\u00e3, a ra ye lebga a S\u028b\u0269t\u00e3an
  d\u0169niy\u00e3 neda. (1 Z\u00e3 5:19) B s\u1ebdn yiis nin-w\u1ebdn-k\u00e3ng tiging\u00e3
  p\u028bg\u1ebd w\u00e3, k\u0269tame t\u0269 tiging\u00e3 neb a taab\u00e3 ket n
  tat a yam.\u20141 Kor\u1ebdnt d\u00e3mba 5:11-13.\\n5 R\u1ebd poore, pa kaoos la
  t\u028bm-t\u028bmd a Poll sagl Kor\u1ebdnt kiris-neb\u00e3 t\u0269 b lebs n deeg
  s\u1ebdn da maan-a yel-w\u1ebdnd\u00e3 tiging\u00e3 p\u028bg\u1ebd ye. B\u00f5e
  y\u0129nga? A Poll yeelame t\u0269 yaa s\u1ebdn na y\u0269l t\u2019a \u2018S\u028b\u0269t\u00e3an
  da t\u00f5og-b ye.\u2019 V\u1ebdenega, nin-k\u00e3ng\u00e3 ra teka yam n kos sugr
  la a toeem a v\u0269\u0269m\u00e3. (2 Kor\u1ebdnt d\u00e3mba 2:8-11) Kor\u1ebdnt
  tiging\u00e3 neb s\u00e3 n da pa sak n lebs n deeg nin-k\u00e3ng\u00e3, b ra na
  n l\u028b\u0269ya a S\u028b\u0269t\u00e3an b\u1ebddg\u1ebd, bala b ra na n y\u0269\u0269
  neb s\u1ebdn pa k\u00f5t b taab sugri. Yaa v\u1ebdeneg t\u0269 pa kaoos la b sak
  n \u2018k\u00f5-a sugr la b bels-a\u2019 ye.\u20142 Kor\u1ebdnt d\u00e3mba 2:5-7.\\n6.
  Ned s\u1ebdn maan yel-w\u1ebdnd yiisg tiging\u00e3 p\u028bg\u1ebd y\u00f5od yaa
  b\u00f5e?\\n6 Ned s\u1ebdn maan yel-w\u1ebdnd yiisg tiging\u00e3 p\u028bg\u1ebd
  y\u00f5od yaa b\u00f5e? B s\u00e3 n yiis ned a woto tiging\u00e3 p\u028bg\u1ebd,
  k\u0269tdame t\u2019a Zeova y\u028b-s\u00f5ng\u00e3 ra s\u00e3ame, t\u2019a nin-buiid\u00e3
  y\u028b\u028br me ra s\u00e3am ye. (1 P\u0269\u025b\u025br 1:14-16) B s\u00e3 n
  yiis ned s\u1ebdn maan yel-w\u1ebdnd n pa rat n tek yam n kos sugr tiging\u00e3
  p\u028bg\u1ebd, wilgdame t\u0269 b s\u0269d nonga W\u1ebdnnaam noy\u00e3 w\u028bsgo,
  la k\u0269td\u1ebd t\u0269 r\u1ebdgd ra z\u0129nd tiging\u00e3 p\u028bg\u1ebd ye.
  Leb n t\u00f5e n k\u0269tame t\u0269 s\u1ebdn maan-a yel-w\u1ebdnd\u00e3 b\u00e3ng
  t\u0269 b\u0169mb ning a s\u1ebdn maan\u00e3 s\u0269d yaa w\u1ebdng w\u028bsgo.\\nNed
  s\u1ebdn maan yel-w\u1ebdnd segd n deng n kosa sugri\\n7. A Dav\u0269\u0269d s\u1ebdn
  da wa n nan pa v\u1ebdneg a yel-w\u1ebdn\u00e3 n togs\u00e3, b\u00f5e n maan-a?\\n7
  Neb w\u028bsg s\u1ebdn maan yel-w\u1ebdn-k\u00e3sems sak n teka yam ne b s\u0169y
  f\u00e3a n kos sugr t\u0269 b pa yiis-b tiging\u00e3 p\u028bg\u1ebd ye. Yaa s\u0269d
  t\u0269 pa nana ne neb k\u1ebder t\u0269 b sak n deeg t\u0269 b kongame la b kos
  sugr ye. D ges Isra\u025bll r\u0129m a Dav\u0269\u0269d s\u1ebdn g\u028bls Y\u0269\u0269l
  32 soab\u00e3 makre. Y\u0269\u0269l k\u00e3ng\u00e3 wilgdame t\u2019a Dav\u0269\u0269d
  s\u1ebdn da wa n yo ne a Batseba la a maan yel-w\u1ebdn-k\u00e3sems a taab r\u1ebd
  sasa w\u00e3, a pa v\u1ebdneg n togs tao-tao ye. R\u1ebd k\u0269tame t\u2019a s\u0169ur\u00e3
  ra s\u00e3am hal t\u2019a p\u00e3ng\u00e3 sa z\u00e3ng wa t\u028b\u028blg s\u1ebdn
  k\u028b\u0269\u0269sd t\u0269\u0269ga. A ra namsda w\u028bsgo, la a s\u1ebdn wa
  n v\u1ebdneg a yel-w\u1ebdn\u00e3 n togs\u00e3, a Zeova k\u00f5-a-la sugri. (Y\u0269\u0269l
  S\u00f5amy\u00e3 32:3-5) R\u1ebd k\u0269tame t\u2019a Dav\u0269\u0269d y\u0269\u0269l
  woto: \u201cBark bee ned ninga zugu, Zusoaba s\u1ebdn ka geelgd a yel-w\u1ebdna
  ye.\u201d (Y\u0269\u0269l S\u00f5amy\u00e3 32:1, 2) Ad a Dav\u0269\u0269d s\u0169ur
  s\u0269d y\u0269\u0269 noog a s\u1ebdn wa n paam t\u0269 W\u1ebdnnaam k\u00f5-a
  sugr\u00e3!\\n8, 9. W\u00e3n-w\u00e3n la ned b s\u1ebdn yiis tiging\u00e3 p\u028bg\u1ebd
  wilgd t\u2019a teka yam n kot sugri, la r\u1ebd maaneg y\u00f5od yaa b\u00f5e?\\n8
  D\u1ebdnd v\u1ebdenega, ned s\u1ebdn maan yel-w\u1ebdnd s\u00e3 n dat t\u0269 b
  k\u00f5-a sugri, a segd n teka yam. La pa a soab\u00e3 s\u00e3 n zoet y\u00e3nde,
  pa r\u1ebd b\u0269 a yaeesd ned na n wa b\u00e3ng a s\u1ebdn maan\u00e3, la wilgd
  t\u2019a teka yam ye. Ned teka yam, a s\u00e3 n sakame n toeem z\u028bgo, a s\u0169ur
  s\u1ebdn s\u00e3am yel-w\u1ebdnd ning a s\u1ebdn maan\u00e3 y\u0129nga, la a wilgd\u1ebd
  t\u2019a ratame t\u0269 yell\u00e3 yi a zugu.\u2014Y\u0269\u0269l S\u00f5amy\u00e3
  51:19; 2 Kor\u1ebdnt d\u00e3mba 7:11.\\n9 Kiris-ned s\u1ebdn maan yel-w\u1ebdnd
  s\u00e3 n dat t\u0269 b lebs n deeg-a tiging\u00e3 p\u028bg\u1ebd, pipi r\u1ebdndame
  t\u2019a kos sugri. La pa r\u1ebd y\u0129ng la b segd n lebs n deeg koangd\u00e3
  t\u0269lae t\u0269 bala b s\u1ebdn yiis-a w\u00e3 kaoosame ye. Nand t\u0269 b lebs
  n deeg-a, a segd n teka yam fas\u0269. A segd n b\u00e3ngame t\u0269 b\u0169mb ning
  a s\u1ebdn maan n s\u00e3am a Zeova y\u028b\u028br la tiging\u00e3 y\u028b\u028br\u00e3
  s\u0269d yaa w\u1ebdng w\u028bsgo. S\u1ebdn maan-a yel-w\u1ebdnd\u00e3 segd n teka
  yam la a p\u028b\u028bs ne a s\u0169ur f\u00e3a n kos sugri, la a sak n t\u0169ud
  W\u1ebdnnaam noy\u00e3 s\u1ebdn yaa t\u0269rs\u00e3. A s\u00e3 n dat t\u0269 b lebs
  n deeg-a tiging\u00e3 p\u028bg\u1ebd, a segd n wilga v\u1ebdeneg t\u2019a teka yam,
  la a t\u028bmd s\u1ebdn \u201czems yam tekr t\u028b\u028bma.\u201d\u2014T\u028b\u028bma
  26:20.\\nB\u00f5e y\u0129ng t\u0269 ned segd n v\u1ebdneg a yel-w\u1ebdnd n togse?\\n10,
  11. B\u00f5e y\u0129ng t\u0269 d pa segd n solg yel-w\u1ebdnd d s\u1ebdn maane?\\n10
  Neb k\u1ebder s\u1ebdn maan yel-w\u1ebdnd t\u00f5e n yeta b mens woto: \u2018Mam
  s\u00e3 n togs ned m yel-w\u1ebdnd\u00e3, na n waa ne sogs-toogo, la t\u00f5e t\u0269
  b yiis-m tiging\u00e3 p\u028bg\u1ebd menga. La m s\u00e3 n s\u0129nd n pa togse,
  sogsg k\u00f5n z\u0129ndi, b k\u00f5n yiis-ma, tiging\u00e3 ned me k\u00f5n b\u00e3nge.\u2019
  La ned s\u00e3 n tagsd woto, a y\u0129mda b\u0169mb k\u1ebder s\u1ebdn tar y\u00f5od
  w\u028bsgo. B\u00f5n-k\u00e3ens la b\u028bse?\\n11 A Zeova yaa \u2018W\u1ebdnnaam
  s\u1ebdn yaa nimb\u00e3an-zo\u025bt la bark k\u00f5ata. A s\u0169ur ka yikd tao-tao
  ye, la a nonglm\u00e3 yaa w\u028bsgo. A yaa s\u0269d soaba, s\u1ebdn maand nonglem
  hal t\u0269 ta z\u00e3maan tusri, n k\u00f5t neb sugr b yel-w\u1ebdna ne b k\u0269\u0269sga
  la b kongra f\u00e3a y\u0129nga.\u2019 La baasg z\u00e3nga, a s\u0269bgda a nin-buiid\u00e3
  ne t\u0269rlem. (Yikri 34:6, 7; Zeremi 30:11) Ned s\u00e3 n maan yel-w\u1ebdn-k\u00e3seng
  n solgd\u1ebd, W\u1ebdnnaam pa t\u00f5e n k\u00f5-a sugr ye. A Zeova mii b\u0169mb
  ning a s\u1ebdn maan\u00e3, la a pa get w\u1ebdng maaneg wa yel-bil ye.\u2014Yelb\u0169na
  15:3; Habakuk 1:13.\\n12, 13. Ned s\u00e3 n bao n na n solg a yel-w\u1ebdnde, b\u00f5e
  n t\u00f5e n maane?\\n12 F s\u00e3 n maan yel-w\u1ebdn-k\u00e3seng n v\u1ebdneg
  n togse, s\u00f5ngd-f lame t\u0269 f lebs n paam s\u0169ur kaset s\u1ebdn yaa s\u00f5ma.
  (1 T\u0269mote 1:18-20) La ned s\u00e3 n solg a yel-w\u1ebdnde, t\u00f5e n kenga
  a s\u0169ur t\u2019a wa sak n maan yel-w\u1ebdn a taaba. D pa segd n tags t\u0269
  d s\u00e3 n maan yel-w\u1ebdnde, d beega ned wall tiging\u00e3 bal ye. Yaa W\u1ebdnnaam
  la d beeg-y\u00e3. Y\u0269\u0269l-g\u028blsd\u00e3 y\u0269\u0269la woto: \u201cZusoaba
  bee b\u00e3mb do-s\u00f5nga p\u028bg\u1ebd. Zusoaba naam geer bee saas\u1ebd. B\u00e3mb
  nin getame, la b\u00e3mb nin-pagd nee ninsaalba f\u00e3a. Zusoaba feesda nin-t\u0269rg
  ne nin-w\u1ebdng f\u00e3a.\u201d\u2014Y\u0269\u0269l S\u00f5amy\u00e3 11:4, 5.\\n13
  Tiging\u00e3 s\u1ebdn yaa s\u00f5ng\u00e3 y\u0129nga, a Zeova pa na n ning ned s\u1ebdn
  maan yel-w\u1ebdn-k\u00e3seng la a solgd n dat n pa a p\u028bg\u1ebd bark ye. (Zak
  4:6) Woto y\u0129nga, ned s\u00e3 n maan yel-w\u1ebdnd la a rat n maan s\u1ebdn
  tat W\u1ebdnnaam daabo, a pa tog n zoe rabeem ye. A segd n pelga a p\u028bg n v\u1ebdneg
  n togse. S\u00e3 n pa r\u1ebd, a s\u0169ur kaset\u00e3 na n ningd-a-la taale, s\u1ebdn
  y\u0269\u0269d f\u00e3a, a s\u00e3 n wa karem wall a w\u028bm saglg s\u1ebdn tik
  b\u0169mb ning a s\u1ebdn maan\u00e3 zugu. A Zeova t\u00f5e n wa reega a v\u028b\u028bsem
  s\u00f5ng\u00e3 n bas a soaba wa r\u0129m a Sayull neng\u1ebd w\u00e3. (1 S\u00e3mw\u025bll
  16:14) La W\u1ebdnnaam s\u00e3 n deeg a v\u028b\u028bsem s\u00f5ng\u00e3 n bas neda,
  t\u00f5e n k\u0269tame t\u2019a soab maan yel-w\u1ebdn-k\u00e3sems a taaba.\\nD
  k\u0269s k\u00e3sem d\u00e3mb\u00e3 s\u0269da\\n14. B\u00f5e y\u0129ng t\u0269 ned
  s\u1ebdn maan yel-w\u1ebdnd segd n t\u0169 saglg ning s\u1ebdn be Zak 5:14, 15 w\u00e3?\\n14
  R\u1ebdnd b\u00f5e la ned s\u1ebdn maan yel-w\u1ebdnd n dat n tek yam n kos sugr
  segd n maane? \u201cB\u0269 a bool W\u1ebdnnaam t\u1ebdedba k\u00e3sem d\u00e3mba,
  la b\u0269 b\u00e3mb tik a soab ne kaam ne Zusoaba y\u028b\u028bre n p\u028b\u028bsd
  W\u1ebdnnaam a y\u0129nga. T\u1ebdeb p\u028b\u028bsg na maag b\u00e3ad\u00e3, la
  Zusoaba na yik-a t\u2019a paam laaf\u0269.\u201d (Zak 5:14, 15) B\u0169mb a ye ned
  s\u1ebdn dat n t\u028bm t\u028b\u028bm s\u00f5ma n wilg t\u2019a teka yam n kot
  sugr s\u1ebdn segd n maane, yaa t\u0269 wilg k\u00e3sem d\u00e3mb\u00e3 a kongr\u00e3.
  (Mat\u0269e 3:8) K\u00e3sem d\u00e3mb\u00e3 s\u1ebdn tar t\u1ebdeb s\u00f5ma la
  b nong saam-biis\u00e3 na n \u2018tika a soab ne kaam ne a Zeova y\u028b\u028br
  n p\u028b\u028bs W\u1ebdnnaam a y\u0129nga.\u2019 Ned\u00e3 s\u00e3 n s\u0269d teka
  yam ne a s\u0169ur f\u00e3a n kot sugri, k\u00e3sem d\u00e3mb\u00e3 sagls s\u1ebdn
  yit Biibl\u00e3 p\u028bg\u1ebd na n b\u028bka a s\u0169ur wa kaam s\u1ebdn b\u028bkd
  y\u0129ng\u00e3.\u2014Zeremi 8:22.\\n15, 16. W\u00e3n-w\u00e3n la tiging\u00e3 k\u00e3sem
  d\u00e3mb t\u0169ud makr ning W\u1ebdnnaam s\u1ebdn k\u00f5 t\u0269 be Ezek\u0269\u025bll
  34:15, 16 p\u028bg\u1ebd w\u00e3?\\n15 T\u00f5nd Pek\u0269\u0269m a Zeova s\u1ebdn
  yiis Z\u028b\u0269f r\u00e3mb\u00e3 Babilon yembd\u1ebd w\u00e3 y\u028b\u028bmd
  537 s\u1ebdn deng a Zezi rogm\u00e3, la a s\u1ebdn f\u00e3ag t\u1ebdeb Isra\u025bll\u00e3
  \u201cBabilon k\u00e3seng\u00e3\u201d nug\u1ebd y\u028b\u028bmd 1919 p\u028bg\u1ebd
  w\u00e3, a s\u0269d k\u00f5-d-la mak-s\u00f5ngo. (Wilgri 17:3-5; Galat d\u00e3mba
  6:16) A s\u1ebdn maan woto w\u00e3, a pidsa b\u0169mb a s\u1ebdn da k\u00e3abe.
  A ra yeela woto: \u201cM na n k\u0269\u0269ma m piis\u00e3 m toore. Mam na k\u0269tame
  t\u0269 b v\u028b\u028bse. . . . Piis k\u1ebder s\u00e3 n menem, mam na n bao-b
  lame, b s\u00e3 n lake, mam na n le waa ne-ba. Mam na n peka s\u1ebdn pogl-b\u00e3
  noda la m t\u0269p s\u1ebdn b\u1ebded-b\u00e3.\u201d\u2014Ezek\u0269\u025bll 34:15,
  16.\\n16 A Zeova geta a neb\u00e3 yell wa pe-k\u0269\u0269m s\u1ebdn get a piis
  yell to-to w\u00e3. A kogend-b lame la a baood s\u1ebdn menem-b\u00e3. Woto me,
  tiging\u00e3 k\u00e3sem d\u00e3mb modgdame t\u0269 W\u1ebdnnaam nin-buiid\u00e3
  paamd t\u1ebdeb\u00e3 r\u0269\u0269b t\u0269 sekd-b la b kogend-ba. K\u00e3sem d\u00e3mb\u00e3
  baooda neb nins s\u1ebdn bas kiris-neb tiging\u00e3 me. Yel-g\u025btb\u00e3 \u2018t\u0269pda
  s\u1ebdn pogl-b\u00e3\u2019 wa W\u1ebdnnaam s\u1ebdn pekd a piis nins s\u1ebdn pogl\u00e3
  nod\u00e3. Nod-k\u00e3ens t\u00f5e n t\u0169u ne b mens t\u028b\u028bma, wall t\u0169u
  ne ned no-goama. K\u00e3sem d\u00e3mb\u00e3 r\u0269kda W\u1ebdnnaam togs-n-taar
  n s\u00f5ngd s\u1ebdn b\u1ebded-b t\u1ebdeb\u00e3 w\u025b\u025bng\u1ebd t\u0269
  t\u00f5e t\u0269 yaa b r\u00e3mb\u00e3 mens yel-w\u1ebdn y\u0129ng\u00e3.\\nPe-k\u0269\u0269mb\u00e3
  s\u1ebdn s\u00f5ng t\u00f5nd to-to\\n17. B\u00f5e y\u0129ng t\u0269 d pa segd n
  zoe rabeem ne d t\u0269 kos k\u00e3sem d\u00e3mb\u00e3 s\u00f5ngre?\\n17 K\u00e3sem
  d\u00e3mb\u00e3 t\u0169uda saglg ning s\u1ebdn p\u028bgd\u00e3 ne s\u0169-noogo.
  B sagl-b-la woto: \u201cB\u0269 y zoe b\u00e3mb nimb\u00e3anega, la y zoe rabeem.\u201d
  (Ziid 23) Kiris-neb k\u1ebder maana yel-w\u1ebdn-k\u00e3semse, b s\u1ebdn yo la
  b t\u028bm daglem y\u0129nga. La b s\u00e3 n tek yam ne b s\u0169y f\u00e3a n kos
  sugri, b t\u00f5e n paamame t\u0269 k\u00e3sem d\u00e3mb\u00e3 s\u1ebdn nong-b la
  b t\u028bll n s\u00f5ng-b ne b s\u0169y f\u00e3a w\u00e3 zoe b nimb\u00e3anega.
  A Poll yeelame t\u0269 y\u1ebd ne k\u00e3sem d\u00e3mb a taab\u00e3 pa baood n na
  n maan b t\u1ebded-n-taas\u00e3 p\u00e3nga, la t\u0269 b\u00e3mb s\u00f5ngd-b-la
  b s\u0169-noog y\u0129nga. (2 Kor\u1ebdnt d\u00e3mba 1:24) Woto y\u0129ng b\u0269
  d ra tol n zoe rabeem ne d t\u0269 kos t\u0269 b s\u00f5ng-d ye.\\n18. W\u00e3n-w\u00e3n
  la k\u00e3sem d\u00e3mb\u00e3 s\u00f5ngd tiging\u00e3 neb nins s\u1ebdn b\u028bdg\u00e3?\\n18
  Ned s\u00e3 n maana yel-w\u1ebdn-k\u00e3senga, b\u00f5e y\u0129ng t\u2019a segd
  n k\u0269s s\u0269d t\u0269 tiging\u00e3 k\u00e3sem d\u00e3mb t\u00f5e n s\u00f5ng-a
  lame? Yaa t\u0269 pipi, b yaa W\u1ebdnnaam b\u00e3gr\u00e3 pe-k\u0269\u0269mba.
  (1 P\u0269\u025b\u025br 5:1-4) Pe-k\u0269\u0269m s\u1ebdn nong a pesg pa na n p\u00e3b-a
  a s\u1ebdn maan n pogl a meng y\u0129ng ye. Woto me, k\u00e3sem d\u00e3mb\u00e3
  s\u00e3 n na n s\u00f5ng tiging\u00e3 ned s\u1ebdn maan yel-w\u1ebdnde, b s\u1ebdn
  baood\u00e3 pa b b\u00e3ng b s\u1ebdn na n s\u0269bg-a to-to ye. Yaa s\u1ebdn na
  y\u0269l n b\u00e3ng b s\u1ebdn t\u00f5e n s\u00f5ng-a to-to t\u2019a bas a yel-w\u1ebdnd\u00e3
  la a lebs n paam zood ne W\u1ebdnnaam, t\u0269 s\u00e3 n t\u00f5ey\u00e3. (Zak 5:13-20)
  K\u00e3sem d\u00e3mb\u00e3 segd n kaoa b\u00e3gr\u00e3 neb b\u028b\u028bd t\u0269rga,
  la ne b\u028bgsem. (T\u028b\u028bma 20:29, 30; Ezai 32:1, 2) W\u1ebdnnaam baoodame
  t\u0269 k\u00e3sem d\u00e3mb\u00e3 la kiris-neb a taab\u00e3 f\u00e3a y\u0269 t\u0269rse,
  t\u0269 b nong b taab\u00e3 la b y\u0269 sik-m-mens r\u00e3mba. (Miise 6:8) K\u00e3sem
  d\u00e3mb\u00e3 s\u00e3 n na n kao tiging\u00e3 ned s\u1ebdn maan yel-w\u1ebdnd
  b\u028b\u028bdo, b segd n talla z\u028bg s\u00f5ma k\u00e3ens\u00e3. Bala yaa y\u00f5or
  yelle, la ned\u00e3 me yaa \u2018a Zeova pesg\u2019 s\u1ebdn t\u028bmd a t\u028b\u028bm\u00e3.\u2014Y\u0269\u0269l
  S\u00f5amy\u00e3 100:3.\\n19. Tiging\u00e3 ned s\u00e3 n beege, w\u00e3n-w\u00e3na
  la k\u00e3sem d\u00e3mb\u00e3 segd n kibl-a?\\n19 Yaa ne v\u028b\u028bsem s\u00f5ng\u00e3
  s\u00f5ngr la b y\u00e3kd tiging\u00e3 k\u00e3sem d\u00e3mb\u00e3. La k\u00e3sem
  d\u00e3mb\u00e3 baoodame me t\u2019a wilg-b sore. \u2018Ned s\u00e3 n beeg [n pa
  b\u00e3nge, NW]\u2019 k\u00e3sem d\u00e3mb\u00e3 segd n \u2018sagl-a-la ne s\u0169-maasem
  t\u2019a y\u0269 t\u0269rga.\u2019 (Galat d\u00e3mba 6:1; T\u028b\u028bma 20:28)
  Yaa s\u0269d t\u0269 k\u00e3sem d\u00e3mb\u00e3 segd n sagl-a-la ne b\u028bgsem,
  la b segd n t\u0169u W\u1ebdnnaam noy\u00e3 me. B segd n s\u00f5nga a soab\u00e3
  n welg yell\u00e3, la b segd n maan r\u1ebd wa b s\u1ebdn t\u0269pd ned s\u1ebdn
  pogl to-to s\u1ebdn na y\u0269l n da wa paas a toog zaalm\u00e3. (Kolos r\u00e3mba
  3:12) K\u00e3sem d\u00e3mb\u00e3 s\u1ebdn na n kibl a soab\u00e3 to-to w\u00e3 na
  n zemsa ne a Zeova s\u1ebdn get yell\u00e3 to-to w\u00e3, bala b na n deng n p\u028b\u028bsame
  la b tik G\u028blsg S\u00f5amy\u00e3 n b\u00e3ng n maan r\u1ebd.\u2014Mat\u0269e
  18:18.\\n20. Wakat b\u028bg la tiging\u00e3 k\u00e3sem d\u00e3mb segd n yiis ko\u025b\u025bg
  n wilg tiging\u00e3 neb t\u0269 b kibla neda?\\n20 Tiging\u00e3 ned s\u00e3 n maan
  yel-w\u1ebdnd t\u0269 neb\u00e3 f\u00e3a mi\u1ebd, pa r\u1ebd b\u0269 yaa v\u1ebdeneg
  t\u0269 na n wa v\u1ebdnegame, s\u1ebdn na y\u0269l n kogl tiging\u00e3 y\u028b-noogo,
  y\u0269ta s\u00f5ma t\u0269 b yiis ko\u025b\u025bg n wilg neb\u00e3 t\u0269 b kibla
  a soab\u00e3. La baa pa r\u1ebd, tiging\u00e3 neb s\u00e3 n segd n b\u00e3ngame
  t\u0269 b kibla neda, b segd n togs-b lame. Sasa k\u00e3nga, ned ning b s\u1ebdn
  kibl\u00e3 s\u0269nga s\u00e3oogr t\u1ebdeb\u00e3 w\u025b\u025bng\u1ebd. D t\u00f5e
  n mak-a-la ne ned s\u1ebdn paam s\u00e3mpogr t\u0269 nan pa maage, t\u0269 k\u0269t
  t\u2019a pa t\u00f5e n t\u028bm t\u028b\u028bm k\u1ebder nand ye. Y\u0269ta s\u00f5ma
  t\u0269 tigiss\u00e3 sasa b\u0269 a s\u0129nd n kelgd s\u00f5ss\u00e3 bal la a ra
  k\u00f5t leoor ye. T\u00f5e t\u0269 k\u00e3sem d\u00e3mb\u00e3 na n baoa ned t\u2019a
  t\u0269 z\u00e3ms Biibl\u00e3 ne-a s\u1ebdn na y\u0269l n s\u00f5ng-a t\u2019a rems
  z\u0129is nins a s\u1ebdn kongd p\u00e3ng\u00e3, t\u2019a t\u1ebdeb\u00e3 lebs n
  \u201ck\u0269 y\u1ebdgna.\u201d (T\u0269t 2:2, Sebr S\u00f5ngo) B maanda woto f\u00e3a
  nonglem y\u0129nga, pa s\u1ebdn na y\u0269l n s\u0269bg s\u1ebdn maan-a yel-w\u1ebdnd\u00e3
  ye.\\n21. W\u00e3n-w\u00e3n la k\u00e3sem d\u00e3mb\u00e3 t\u00f5e n ges yel-w\u1ebdn
  k\u1ebder yelle?\\n21 K\u00e3sem d\u00e3mb\u00e3 t\u00f5e n s\u00f5nga ned ne manesem
  to\u025by-to\u025by t\u1ebdeb\u00e3 w\u025b\u025bng\u1ebd. D r\u0269k makr wa saam-biig
  s\u1ebdn da nong n y\u0169ud r\u00e3am t\u0269 loogd\u1ebd s\u00e3 n le wa yik n
  y\u0169 vugr b\u0269 naoor a yi t\u0269 looge, a s\u1ebdn wa n be yir a yembre.
  Wall wa saam-biig s\u1ebdn da bas s\u0269gaar y\u0169ub hal s\u1ebdn kaoos s\u00e3
  n wa yik n y\u0169 s\u0269gaar vugr b\u0269 naoor a yiib t\u0269 ned pa b\u00e3ng
  ye. Baa a s\u00e3 n p\u028b\u028bsame n t\u1ebded t\u0269 W\u1ebdnnaam k\u00f5-a-la
  sugri, a segd n t\u0269 kosa k\u00e3sem d\u00e3mb\u00e3 s\u00f5ngr s\u1ebdn na y\u0269l
  n da ket n maand yel-w\u1ebdn-k\u00e3ng ye. K\u00e3sem soab a ye b\u0269 b yiib
  t\u00f5e n welga yell\u00e3. La s\u1ebdn mik t\u0269 y\u025bl a taab b s\u1ebdn
  pa mi n t\u00f5e n be s\u028bk\u00e3, b segd n togsa tiging\u00e3 k\u00e3sem d\u00e3mb
  taoor-l\u028b\u0269t\u00e3.\\nD ket n sakd W\u1ebdnnaam kiblg\u00e3\\n22, 23. B\u00f5e
  y\u0129ng t\u0269 d segd n ket n sakd W\u1ebdnnaam kiblg\u00e3?\\n22 S\u1ebdn na
  y\u0269l n ta a Zeova yam, kiris-ned f\u00e3a segd n saka a kiblg\u00e3. (1 T\u0269mote
  5:20) Woto y\u0129ng b\u0269 d t\u0169ud sagls nins d s\u1ebdn paamd\u00e3 ne d
  s\u0169y f\u00e3a. D paamda sagl-k\u00e3ens d s\u1ebdn wat n karemd Biibl\u00e3,
  pa r\u1ebd b\u0269 s\u025bb nins siglg\u00e3 s\u1ebdn yiis\u00e3, la d tigiss\u00e3
  ne d tigis-k\u00e3sems\u1ebd w\u00e3. D kell n g\u0169us d mens n t\u0169 a Zeova
  raab\u00e3. Woto, W\u1ebdnnaam kiblg\u00e3 na n s\u00f5ng-d lame t\u0269 d t\u1ebdeb\u00e3
  y\u0269 k\u00e3n-k\u00e3e wakat f\u00e3a n t\u00f5og n da l\u028b\u0269t yel-w\u1ebdn\u00e3
  p\u028bg\u1ebd ye.\\n23 Ned s\u00e3 n sakd W\u1ebdnnaam kiblg\u00e3, a na n t\u00f5og
  n paa W\u1ebdnnaam nonglm\u00e3 p\u028bg\u1ebd. Yaa s\u0269d t\u0269 b yiisa kiris-neb
  k\u1ebder tiging\u00e3 p\u028bg\u1ebd, la d s\u00e3 n kogl d s\u0169ur\u00e3 la
  d k\u1ebdnd wa yam soaba, b pa na n yiis-d ye. (Yelb\u0169na 4:23; Ef\u025b\u025bz
  r\u00e3mba 5:15) La s\u00e3 n mik t\u0269 b zoe n yiisa neda, a t\u00f5e n baoome
  t\u0269 b lebs n deeg-a. W\u1ebdnnaam datame t\u0269 neb nins s\u1ebdn d\u0269k
  b mens n k\u00f5-a w\u00e3 balm-a ne k\u0269s-s\u0269da, la ne \u201cs\u0169-noogo.\u201d
  (T\u00f5odo 28:47) D s\u00e3 n sak a Zeova kiblg\u00e3, d na n t\u00f5og n balm-a-la
  woto wakat f\u00e3a.\u2014Y\u0269\u0269l S\u00f5amy\u00e3 100:2.\\nW\u00e3n-w\u00e3n
  la y na n leoke?\\n\u2022 B\u00f5e y\u0129ng t\u0269 b yiis kiris-neb k\u1ebder
  tiging\u00e3 p\u028bg\u1ebd?\\n\u2022 Tek yam n kos sugr ne f s\u0169ur f\u00e3a
  w\u00e3 baooda b\u00f5e maanego?\\n\u2022 B\u00f5e y\u0129ng t\u0269 ned s\u1ebdn
  maan yel-w\u1ebdn-k\u00e3seng segd n v\u1ebdneg n togse?\\n\u2022 Ned s\u00e3 n
  maan yel-w\u1ebdnd n tek yam n kos sugri, w\u00e3n-w\u00e3n la tiging\u00e3 k\u00e3sem
  d\u00e3mb s\u00f5ngd a soaba?\\n[Z\u00e3msg\u00e3 sogsg\u00e3]\\n[Foto, seb-neng
  13]\\nB\u00f5e y\u0129ng t\u0269 t\u028bm-t\u028bmd a Poll g\u028bls Kor\u1ebdnt
  kiris-neb\u00e3 n sagl-b t\u0269 b yiis ned tiging\u00e3 p\u028bg\u1ebd?\\n[Foto,
  seb-neng 16]\\nK\u00e3sem d\u00e3mb\u00e3 t\u0269pda W\u1ebdnnaam piis nins s\u1ebdn
  pogl\u00e3 wa p\u0129nd w\u1ebdnd\u1ebd pe-k\u0269\u0269mb\u00e3 s\u1ebdn da t\u0269pd
  b piis\u00e3 to-to w\u00e3\"", "\"H\u0131d\u0131rellez b\u0269 H\u0131drellez (turk:
  H\u0131d\u0131rellez b\u0269 H\u0131drellez; azerbay\u00e3an: X\u0131d\u0131r \u0130lyas
  b\u0269 X\u0131d\u0131r N\u0259bi; Crimean Tatar: H\u0131d\u0131rlez; Romani language:
  Ederlezi) yaa nin-buiid kibs b s\u1ebdn maand daar ning no-r\u025b\u025bsdb a Al-Khidr
  (H\u0131z\u0131r) la a Eli (\u0130lyas) s\u1ebdn seg taab t\u1ebdng zug\u00e3.[1]
  H\u0131d\u0131rellez s\u0269nga sigr kiuug rasem a 5 y\u028bngo n na n baas sigr
  kiuug rasem a 6 Gregori kalend\u025b\u025br\u00e3 p\u028bg\u1ebd. A Z\u028brg raar\u00e3
  yaa kiris-neb\u00e3 y\u0129nga) ne a Zuliyus kalend\u025b\u025br\u00e3. B maand-a-la
  Turke, Crime, Gagauzia, Siri, Ir\u00e3, Kavkaz la Balkans la b maand-a lame n dat
  n wilg t\u0269 sig-noy\u00e3 taame.[2]\\nKhidr (Araab: \u0671\u0644\u0652\u062e\u064e\u0636\u0650\u0631,
  romanized: al-Kha\u1e0dir), b leb n g\u028bls-a lame t\u0269 al-Khadir, Khader,
  Khizr, al-Khidr, Khazer, Khadr, Khedher, Khizir, la Khizar, yaa ned b s\u1ebdn bilg
  la b pa gom a y\u028b\u028br zug Quran p\u028bg\u1ebd wa W\u1ebdnnaam s\u00f5gen
  s\u1ebdn yaa nin-t\u0269rga s\u1ebdn tar yam k\u00e3seng b\u0269 b\u00e3ngr s\u1ebdn
  yaa yel-solemde. Z\u0129is a taab s\u1ebdn yaa Isl\u00e3m r\u00e3mb\u00e3 la s\u1ebdn
  pa Isl\u00e3m r\u00e3mb\u00e3 p\u028bs\u1ebd, b bilga a Khidr wa ned s\u1ebdn yaa
  koe-moonda, no-r\u025b\u025bsa, ned s\u1ebdn yaa ned a to zu-soaba, yamb b\u0269
  mal\u025bk s\u1ebdn get mogr\u00e3 yelle, n z\u00e3msd neb\u00e3 yel-soalm\u00e3,
  la a s\u00f5ngd neb nins s\u1ebdn be toog p\u028bg\u1ebd w\u00e3. A s\u1ebdn yaa
  mal\u025bk ning s\u1ebdn kogend neb\u00e3 y\u0129nga, a yaa mal\u025bk ning s\u1ebdn
  kogend Isl\u00e3m nin-s\u00f5ng\u00e3 a Ibn Arabi w\u00e3. A Al-Kidri ra yaa nin-k\u1ebdem
  a ye. Y\u028b\u028bmd 2017 soab\u00e3 p\u028bg\u1ebd, b g\u028bls-a-la UNESCO s\u1ebdn
  boond t\u0269 Patrimoine culturel immat\u00e9riel w\u00e3 p\u028bg\u1ebd.[3]\\nB
  geta H\u0131d\u0131rellez wa kibs s\u1ebdn tar y\u00f5od n y\u0269\u0269d Turke
  la t\u1ebdns a taab s\u1ebdn be Moyen-Orient soolm\u1ebd w\u00e3. B boond-a lame
  t\u0269 H\u0131z\u0131r raare (Ruz-\u0131 H\u0131z\u0131r) Turke, la b maanda H\u0131d\u0131rellez
  wa daar ning no-r\u025b\u025bsdb a H\u0131z\u0131r (Al-Khdir) la \u0130lyas (Elijah)
  s\u1ebdn seg taab t\u1ebdng\u00e3 zugu.[3] Gom-biis nins s\u1ebdn yaa H\u0131z\u0131r
  la \u0130lyas n naag taab n naan gom-bil ning s\u1ebdn be r\u0169nd\u00e3-r\u0169nd\u00e3
  w\u00e3. A H\u0131d\u0131rellez raar\u00e3 taa sigr kiuug rasem a 6 ne Grigori kalend\u025b\u025br\u00e3,
  la t\u028b\u028bl-nif kiuug rasem 23 ne Zuli kalend\u025b\u025br\u00e3. T\u1ebdns
  a taab p\u028bs\u1ebd, yaa pagb\u00e3 la a Z\u028brg Z\u028brg\u00e3 t\u0169udum
  la b ra nong n p\u028bt ne. [1]\\nGomd ning s\u1ebdn boond t\u0269 H\u0131d\u0131rellez
  w\u00e3 yaa H\u0131z\u0131r ne \u0130lyas gom-biis s\u1ebdn naag taaba, t\u0269
  b get-b wa neb a yiibu. S\u00e3 n yaa ne t\u0169udm\u00e3 s\u025bba, b gomda a Ilyas
  yell w\u028bsgo; la b pa gomd a H\u0131z\u0131r yell bilf ye. B s\u1ebdn get a H\u0131z\u0131r
  ne a \u0130lyas wa neb s\u1ebdn yaa a ye w\u00e3, yaa s\u1ebdn t\u0169 ne a \u0130lyas
  s\u1ebdn yaa ned s\u1ebdn pa tar y\u00f5od w\u028bsg Tasavvuf (sufiism) la nin-buiid
  t\u1ebdebo, b s\u00e3 n mak-a ne a H\u0131z\u0131r, la kibay w\u028bsg n be a H\u0131z\u0131r
  zugu, t\u0269 b yaool n pa mi a \u0130lyas w\u028bsg ye. S\u1ebdn paase, makams
  w\u028bsg n be H\u0131z\u0131r zugu, la makams a w\u00e3n bal n be a \u0130lyas
  y\u0129nga. A Ali s\u1ebdn yaa Kalif a naas soab\u00e3 yaa wa a H\u0131z\u0131r
  s\u1ebdn be Alevi-Bekta\u015fi t\u1ebdeba p\u028bg\u1ebd.\\nSt. A George yaa ned
  ning s\u1ebdn zems ne H\u0131z\u0131r kiris-nedemd\u00e3 p\u028bg\u1ebd. S\u1ebdn
  paase, b ra tara zood ne a St. A George, H\u0131z\u0131r la a \u0130lyas Horasani,
  a St. A Teodore ne a St. A Sergios. St. B t\u1ebdedame t''a George yaa wa a H\u0131z\u0131r,
  la b t\u1ebdedame t''a George me yaa wa nin-s\u00f5amy k\u1ebder s\u1ebdn yaa z\u028b\u0269f-r\u00e3mba.
  A George yaa Torbal\u0131 Sultan la Cafer Baba s\u1ebdn be Tesali w\u00e3, Karaca
  Ahmet Sultan s\u1ebdn be Skopje w\u00e3, s\u1ebdn yaa kaset s\u1ebdn paasd a St.
  A George ne a H\u0131z\u0131r k\u0269tame t''a St. A George raar\u00e3 la a Hydrellez
  raar\u00e3.\\nB boond-a lame me t\u0269 \\\"H\u0131drellez, H\u0131z\u0131r-ilyas,
  Ederlez, Tepre\u015f, Haftamal, E\u011frice\\\", la \\\"Kakava\\\"[4] Rom r\u00e3mb
  s\u1ebdn be Edirne la K\u0131rklareli s\u028bka. Azerbaydjan, b boond-a lame t\u0269
  X\u0131z\u0131r N\u0259bi bayram\u0131, t\u0269 Azeri r\u00e3mb s\u1ebdn be Z\u0129g\u025b\u025brzi
  w\u00e3 boond-a bal t\u0269 X\u0131dr Nabe. B leb n boond-a lame t\u0269 \\\" Tepre\u015f
  \\\" ne Crimeen Tatars s\u1ebdn be Dobruja (Romani) r\u0269tgo. Dita e Sh\u00ebngjergjit
  (Albani), Gergyovden (Bulgari), Djurdjevdan (Serbi) Sh\u00ebngjergji, Gjurgjovden,
  Erdelezi, Agiu Giorgi, H\u0131derles (Nord Masedoan), Khider-Elyas (Irak), khidr-Elyas,
  Mar Elyas, Mar Georgeos (Siiri).\\nYaa neb w\u028bsg n mi\u1ebd t\u0269 buud toor-toor
  s\u1ebdn yaa Turke r\u00e3mb buud w\u028bsg s\u1ebdn be \u00c3si sentraal soolm\u1ebd
  w\u00e3 maanda b\u0169mb toor-toor s\u1ebdn na y\u0269l n wilg t\u0269 sig-noy\u00e3
  b\u0269 b\u00f5n-b\u0269\u028b\u028bng\u00e3 taame. Hal s\u1ebdn ta z\u0129-y\u025bng
  menga, d b\u00e3ngame t\u0269 yakuts r\u00e3mb\u00e3 s\u0269ng n maanda b\u00f5n-k\u00e3ense.
  B ra maanda r\u1ebd n na n waoog Tengri (saas\u1ebd b s\u1ebdn boond t\u0269 W\u1ebdnnaam
  ning s\u1ebdn so \u00e3nd\u0169niy\u00e3 f\u00e3a). T\u1ebdng\u00e3 s\u1ebdn wa
  n lebg v\u00e3ada, b ra tigimda taab t\u0269\u0269s t\u1ebdngre, n k\u028b wiidi
  wall nag-bi n waoog W\u1ebdnnaam, t\u0269 r\u1ebd poor b\u0269 b tigim taab n naan
  kumis (s\u1ebdn yaa Azi yaanga la yaanga r\u00e3am b s\u1ebdn maand ne ko-moos b\u0269
  y\u028bgemd b s\u1ebdn ning koom\u1ebd w\u00e3 - b leb n boond-a lame me t\u0269
  koumiss). Kibs-k\u00e3ens\u00e3 y\u0269\u0269 y\u028b\u028bmd a 4 soab\u00e3 p\u028bg\u1ebd.
  Tungus neb\u00e3 ra maanda maand-k\u00e3ens\u00e3 y\u028b\u028bmd a 5 soab\u00e3
  p\u028bg\u1ebd, la wakat k\u00e3ng t\u0269 b ra maand maand n k\u00f5t t\u1ebdng\u00e3
  la saas\u1ebd w\u00e3 wa b s\u1ebdn da maand b\u00f5n-p\u0269gs\u00e3. B miime t\u0269
  mongol d\u00e3mba, kalmyks r\u00e3mb\u00e3 la Buryat r\u00e3mb\u00e3 ra maanda maand-n-taase,
  sigr kiuug\u00e3 la sig-noy kiuug\u00e3 sasa. B kell n t\u0169uda rog-n-migs k\u00e3ens
  hal s\u1ebdn na maan y\u028b\u028bm kobse. D t\u00f5e n yeelame t\u0269 s\u1ebdn
  deng t\u0269 b yik n k\u1ebdng \u1ebcnd soolm\u1ebd w\u00e3 (Turquie la Balkans),
  b ra mii b\u0169mb w\u028bsg s\u1ebdn t\u0269 loe ne b t\u1ebdebo, b minim la b
  v\u0269\u0269m s\u1ebdn da yaa to-to Azi t\u1ebdn-s\u028bk\u1ebd w\u00e3. B s\u1ebdn
  lebg z\u028b\u0269f-r\u00e3mb\u00e3 poore, b k\u1ebdesa tigr ning b s\u1ebdn boond
  t\u0269 Z\u0129-soabr\u00e3 ne a H\u0131z\u0131r s\u1ebdn yaa b\u00f5n-naandg ning
  b s\u1ebdn get wa b\u00f5n-naandg s\u1ebdn be y\u0129ngri, n be ne pemsm\u00e3,
  t\u0269\u0269s\u00e3 la koom\u00e3 p\u028bg\u1ebd w\u00e3. La yaa s\u00f5ma t\u0269
  d b\u00e3ng t\u0269 H\u0131d\u0131rellez ka tar lagem-n-taar ne Isl\u00e3 ye, la
  yaa ninsabls t\u1ebdnsa t\u028b\u028bmde. B s\u1ebdn wa n k\u1ebded Turke w\u00e3,
  b ra maanda kibs-k\u00e3sems s\u1ebdn da yit Anatolie t\u1ebdn-k\u028bdemd\u00e3
  p\u028bg\u1ebd, b s\u1ebdn da maand yibeoog b\u0269 b\u00f5n-b\u0269\u028b\u028bng
  wakate, la b s\u1ebdn da t\u0169ud kiris-neb t\u0169udm\u00e3. B\u00f5n-k\u00e3ens\u00e3
  s\u028bka, a St. A Z\u028brg\u00e3 t\u0169udum, b s\u1ebdn da mi w\u028bsg kiris-neb\u00e3
  wakat\u1ebd Turkii w\u00e3. Baa ne kiris-nedemd\u00e3 s\u1ebdn da yaa t\u0169udum
  ning s\u1ebdn da tar p\u00e3ng n y\u0269\u0269d Turkii w\u00e3, b yeelame t\u0269
  w\u1ebdn-t\u0169udb w\u028bsg s\u1ebdn da be wakat k\u00e3nga ra yaa nin-s\u00f5amy,
  la b leb n yeelame t\u0269 k\u1ebder yaa neb s\u1ebdn pa s\u0269d n da be\u1ebd
  ye. R\u1ebd w\u025b\u025bng\u1ebd, a St. A Z\u0129gz\u00f5 s\u1ebdn da t\u0169ud
  a Zeova w\u00e3 k\u0269tame t\u0269 b t\u00f5og n lugl t\u0169udum ning b s\u1ebdn
  boond t\u0269 H\u0131z\u0131r w\u00e3 Turke la Balkans soolm\u1ebd w\u00e3. St.
  A Zorg kibs\u00e3, b s\u1ebdn da maand y\u028b\u028bmd f\u00e3a t\u028b\u028bl-nif
  kiuug rasem a 6-8 kiris-neb\u00e3 s\u028bka, Turke, Moyen-Orient la Balkans t\u1ebdns\u1ebd
  w\u00e3, s\u1ebdn s\u0269ng ne r\u1ebd t\u025bka.\\nA H\u0131d\u0131rellez b\u0269
  a St. A Zana e \u00c7ermenik\u00ebs s\u1ebdn yaa we-r\u0169ng\u00e3 la we-r\u0169ng\u00e3
  w\u1ebdn-poaka, la b s\u1ebdn boond t\u0269 Zana e \u00c7ermenik\u00ebs\u00e3 me
  reega a Dita Ver\u00ebs y\u028b\u028br Albani. B maanda kibs-k\u00e3ng t\u028b\u028blg
  kiuug rasem 14 la a makda waood\u00e3 saab la sig-noy\u00e3 la t\u028b\u028blg s\u0269ngre.
  La Albani t\u1ebdns a taab me p\u028bs\u1ebd, b maanda tigr a ye n boond t\u0269
  Dita e Sh\u00ebngjergjit, St. A George Day s\u1ebdn yaa Mai rasem a 6 w\u00e3.\\nH\u0131d\u0131rellez
  yaa kibs s\u1ebdn tar p\u00e3ng Siri t\u1ebdns w\u028bsg p\u028bs\u1ebd, la s\u1ebdn
  y\u0269\u0269d f\u00e3a yaa t\u1ebdn-k\u0269rems\u00e3 p\u028bs\u1ebd. T\u00f5nd
  tara kibay s\u1ebdn wilgd kibs\u00e3 kibs s\u1ebdn s\u0269ng hal p\u0129nd w\u1ebdnd\u1ebd
  w\u00e3 yelle. B s\u1ebdn maand woto w\u00e3 wilgdame t\u0269 b maanda kibs\u00e3
  n na n wilg t\u0269 sig-noy la t\u028b\u028blg taame. S\u1ebdn paase, b s\u1ebdn
  boond t\u0269 Al-Khidr no-r\u025b\u025bs\u00e3 s\u1ebdn yaa b\u00f5n-v\u1ebdenem
  la s\u1ebdn wat wakat f\u00e3a w\u00e3 makda b\u00f5n-v\u1ebdenem la v\u0269\u0269m
  v\u028b\u028bgre. Y\u028b\u028bmd f\u00e3a, b maand-a-la y\u028b\u028bmd f\u00e3a
  t\u028b\u028bl-nif kiuug rasem a 6 daare. Neb\u00e3, s\u1ebdn t\u0169ud-b z\u028b\u0269f-r\u00e3mb\u00e3
  la kiris-neb\u00e3, baa b t\u0169udm\u00e3 s\u1ebdn yaa to-to f\u00e3a, maand n
  waoogda Alhidr no-r\u025b\u025bs ning s\u1ebdn v\u0269 w\u00e3 s\u1ebdn yaa a St.
  A George b\u0269 a Mar Georgeos. B ra maanda w\u1ebdnd-doog n waoogd a Zezi. A George
  paama p\u00e3n-tusdg Eid Alkhidr s\u1ebdn be Siri w\u00e3 me zugu. B y\u028by a
  yiib\u00e3 zemsa taaba. Neb\u00e3 k\u1ebdngda z\u0129-k\u00e3sems\u00e3 n na n maan
  pikniiki, n maand kibs\u00e3 kibs\u00e3, n y\u0269\u0269nd la b saood buud toor-toor
  y\u0269\u0269la. Wala makre, Zabadani soolm\u1ebd w\u00e3, neb\u00e3 ra tigimdame
  n g\u0169bg t\u0269\u0269g s\u1ebdn tar y\u028b\u028bm 800 s\u1ebdn makd Alkhidr
  s\u1ebdn wat wakat f\u00e3a w\u00e3.\\nB s\u1ebdn yeel t\u0269 H\u0131z\u0131r la
  H\u0131d\u0131rellez yita z\u0129ig ning\u00e3 w\u025b\u025bng\u1ebd, b tara tags-b\u025bd
  toor-toore. Neb n da maand w\u1ebdnd-naands to\u025by-to\u025by\u00e3 la b maand
  maand-b b\u0169mb toor-toore, b s\u00e3 n wa y\u00e3 t\u0269 b\u00f5n-b\u0269\u028b\u028bng
  b\u0269 b\u00f5n-b\u0269\u028b\u028bng watame, Mezopotami, Anatole, Ir\u00e3 la
  Mediterane t\u1ebdns a taab p\u028bs\u1ebd hal p\u0129nd w\u1ebdnd\u1ebd.\\nNeb
  w\u028bsg t\u1ebdedame t''a H\u0131z\u0131r s\u1ebdn y\u0169 v\u0269\u0269m koom\u00e3,
  a paama v\u0269\u0269m s\u1ebdn pa sat\u00e3. A nong n k\u1ebdnda t\u1ebdng\u00e3
  zugu, s\u1ebdn y\u0269\u0269d f\u00e3a sigr kiuug\u00e3 sasa, n s\u00f5ngd neb nins
  s\u1ebdn be toog p\u028bg\u1ebd w\u00e3. Neb\u00e3 getame t''a yaa k\u0169un la
  laaf\u0269 y\u1ebdgre, bala kibs\u00e3 maanda sig-noy\u1ebd w\u00e3, s\u1ebdn yaa
  v\u0269\u0269m paalg\u00e3 wakate. Hal t\u0269 ta mas\u00e3, b maanda b\u0169mb
  toor-toore n waoogd sig-noy\u00e3 b\u0269 b\u00f5n-v\u0269\u0269s\u00e3 f\u00e3a
  s\u1ebdn wat\u1ebd w\u00e3, s\u1ebdn dat n yeel t\u0269 b t\u1ebdegd t\u0269 b\u00f5n-v\u0269\u0269s\u00e3
  f\u00e3a v\u028b\u028bgame b\u0269 t\u0269 waood\u00e3 saame. Z\u0129-likr makda
  k\u0169um, t\u0269 sig-noy makd v\u028b\u028bgre, b\u0269 v\u0269\u0269m\u00e3 lebgr.
  Woto, daar ning s\u1ebdn pid ne saagre, laaf\u0269, s\u0169-noogo, la t\u00f5ogre
  taame. Woto y\u0129nga, H\u0131d\u0131rellez daar\u00e3 tara y\u00f5od w\u028bsgo,
  bala b t\u1ebdedame t''a yaa daar ning a H\u0131z\u0131r ne a \u0130lyas s\u1ebdn
  seg taab t\u1ebdng\u00e3 zug\u00e3, t\u0269 b sak n deeg t\u0269 yaa b\u00f5n-b\u0269\u028b\u028bng
  b\u0269 b\u00f5n-b\u0269\u028b\u028bng waoongo.\\nT\u028brk soolm\u1ebd w\u00e3,
  b t\u1ebdedame t\u0269 H\u0131z\u0131r yaa no-r\u025b\u025bs ning s\u1ebdn na n
  wa k\u0269t t\u0269 ninsaal rog n pa le tar bi-bees\u00e3, n lebgd t\u1ebdng\u00e3
  zugu. S\u1ebdn na y\u0269l n pids b t\u028b\u028bm k\u1ebder, no-r\u025b\u025bsdb\u00e3
  yiiba k\u1ebdnda t\u1ebdng\u00e3 ne ko-k\u00e3seng\u00e3 p\u028bg\u1ebd y\u028b\u028bmd
  f\u00e3a, n tigim taab y\u028b\u028bmd f\u00e3a, t''a maan maan maan-k\u1ebdem kiuug
  rasem a 6 w\u00e3. Yaa t\u1ebdn-k\u00e3nga la koom s\u1ebdn na n naag taab n naag
