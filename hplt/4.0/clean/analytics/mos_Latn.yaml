  ba-biisi, t\u00f5nd sagenda y\u00e3mb ne Zu-soab a Zezi Kirist y\u028b\u028br t\u0269
  y welg y\u00e3mb mens ne ba-biig ning k\u1ebdnd s\u1ebdn ka zemse.\u201d R\u1ebd
  poore, a goma neb s\u1ebdn \u2018ka rat n t\u028bm\u2019 yelle. (2 Tes. 3:6, 10)
  B s\u00e3 n da segd n laka b mens ne k\u028b\u0269\u0269mb\u00e3, s\u1ebdn s\u0269ng-b
  s\u0269d\u00e3 k\u0269\u0269sg\u00e3 la b segd n lak b mens ne n y\u0269\u0269da.
  S\u0269d me, b ra segd n g\u0169usa ne neb a woto t\u0169ud-n-taare, n da wa paam
  yell ye. R\u0169nd\u00e3-r\u0169nd\u00e3 me yaa woto.\u2014Yel. 13:20.\\n9. B\u00f5e
  y\u0129ng t\u0269 d segd n g\u0169us ne s\u1ebdn w\u1ebded-b no-ko\u025b\u025bm
  wall s\u1ebdn w\u0269t-b a Zeova Kaset r\u00e3mb\u00e3?\\n9 To-k\u00e3seng\u00e3
  s\u0269ngr ne d\u0169ni-k\u00e3ng\u00e3 s\u00e3oong\u00e3 kolgdame. R\u1ebdnd sagls
  nins a Zeova s\u1ebdn k\u00f5 pipi kiris-neb\u00e3 tara y\u00f5od w\u028bsg ne t\u00f5ndo.
  D pa tol n dat n \u2018bas bark ninga d s\u1ebdn deeg W\u1ebdnnaam neng\u1ebd w\u00e3
  t\u0269 y\u0269 zaalem,\u2019 rat n yeel t\u0269 n kong v\u0269\u0269m s\u1ebdn
  k\u00f5n sa w\u00e3 saas\u1ebd wall t\u1ebdng\u00e3 zug ye. (2 Kor. 6:1, K\u00e3ab-paalg\u00e3
  Koe-noogo) R\u1ebd n so t\u0269 ned s\u1ebdn wat tigiss\u00e3 s\u00e3 n wa rat n
  w\u1ebd no-ko\u025b\u025bm ne t\u00f5nd b\u0169mb Biibl\u00e3 s\u1ebdn pa wilg v\u1ebdeneg
  w\u025b\u025bng\u1ebd, wall a s\u00e3 n w\u0269t d t\u1ebded-n-taas\u00e3, d segd
  n g\u0169usa w\u028bsg ne a soab\u00e3.\u20142 Tes. 3:13-15.\\n\u2018TALL-Y B\u0168MB
  NINS T\u00d5ND S\u1ebcN Z\u00c3MS Y\u00c3MB\u00d2\\n10. A Poll sagla Tesalonik kiris-neb\u00e3
  t\u0269 b maan b\u00f5e?\\n10 T\u028bm-t\u028bmd a Poll sagla a t\u1ebded-n-taas\u00e3
  s\u1ebdn da be Tesalonik\u00e3 t\u0269 b \u201cyals k\u00e3n-k\u00e3e,\u201d la
  b tall b\u0169mb nins b s\u1ebdn z\u00e3ms\u00e3. (Karm-y 2 Tesalonik r\u00e3mb
  2:15.) Z\u00e3ms-b\u028bs yell la a Poll s\u1ebdn gomd\u00e3? Yaa v\u1ebdeneg t\u0269
  pa b\u0169mb nins ziri t\u0169udm\u00e3 r\u00e3mb s\u1ebdn z\u00e3msd neb\u00e3
  n yet\u1ebd t\u0269 r\u1ebd ne Biibl\u00e3 s\u1ebdn yet\u00e3 f\u00e3a zema taab\u00e3
  ye. Yaa z\u00e3msg ning y\u1ebd ne neb a taab s\u1ebdn paam a Zezi neng\u1ebd w\u00e3,
  la b r\u00e3mb nins W\u1ebdnnaam s\u1ebdn t\u0169nug ne t\u028bm-t\u028bmdb\u00e3
  n taas\u00e3. Z\u00e3ms-k\u00e3ens bee Biibl\u00e3 p\u028bg\u1ebd mas\u00e3. A Poll
  p\u1ebdga Kor\u1ebdnt kiris-neb\u00e3 n yeel t\u0269 b t\u1ebdegda y\u1ebd yell
  ne b\u0169mb f\u00e3a, la t\u0269 b \u2018sakda b\u0169mb nins y\u1ebd s\u1ebdn
  da togs-b\u00e3.\u2019 (1 Kor. 11:2) S\u1ebdn mik t\u0269 z\u00e3ms-k\u00e3ens yita
  a Zeova ne a Bi-ribl\u00e3 neng\u1ebd w\u00e3, pipi kiris-neb\u00e3 s\u0269d ra
  t\u00f5e n k\u0269sa s\u0269d ne-ba.\\n11. Kiris-ned s\u00e3 n bas t\u0269 b belg-a,
  b\u00f5e n t\u00f5e n paam-a?\\n11 T\u028bm-t\u028bmd a Poll g\u028blsa kiris-neb
  nins s\u1ebdn gomd hebre w\u00e3, n wilg manesem a yiib s\u1ebdn t\u00f5e n k\u0269t
  t\u0269 kiris-ned t\u1ebdeb s\u00e3am t\u2019a bas a Zeova t\u0169ubu. (Karm-y Hebre
  d\u00e3mb 2:1; 3:12.) A goma ned s\u1ebdn na n \u2018z\u00e3ag\u2019 ne W\u1ebdnnaam,
  la ned s\u1ebdn na n \u2018bas\u2019 W\u1ebdnnaam yelle. Ad makr s\u1ebdn t\u00f5e
  n s\u00f5ng-d t\u0269 d w\u028bm a gomd\u00e3 v\u00f5ore. Ko-p\u025bm t\u00f5e n
  k\u0269tame t\u0269 koom-koglg z\u00e3ag ne k\u028b\u0269l-koak\u00e3 bilf-bilfu.
  S\u0269ngr\u1ebd w\u00e3, koglg\u00e3 soab t\u00f5eeme n pa mi\u1ebd ye. Makr a
  to yaa koglg\u00e3 soab s\u1ebdn na n y\u00e3k yam n tus a koglg\u00e3 n looge.
  Makr a yiib\u00e3 f\u00e3a bilgda b\u0169mb s\u1ebdn t\u00f5e n paam ned s\u1ebdn
  bas t\u0269 b belg-a t\u2019a t\u1ebdeb\u00e3 p\u00e3ng booge.\\n12. R\u0169nd\u00e3-r\u0169nd\u00e3,
  b\u00f5e n t\u00f5e n s\u00e3am t\u00f5nd ne a Zeova zood\u00e3?\\n12 T\u00f5e t\u0269
  Tesalonik kiris-neb k\u1ebder ra basame t\u0269 s\u0269d\u00e3 k\u0269\u0269sdb
  belg-ba. La yaa w\u00e3n to y\u1ebd r\u0169nd\u00e3-r\u0169nd\u00e3? B\u0169mb w\u028bsg
  beeme n s\u00e3amd s\u1ebdka. Wala makre, ned t\u00f5e n s\u00e3amda a s\u1ebdk
  ne reem, wall a t\u00f5gd \u1ebdnt\u025brnet\u00e3 n toond a zo-r\u00e3mb mesaaz-r\u00e3mba.
  K\u1ebder me s\u00e3amda b s\u1ebdka, n maand b s\u1ebdn t\u00f5e f\u00e3a n baood
  \u025bspoor\u00e3 kibay. B\u00f5n-k\u00e3ens\u00e3 f\u00e3a t\u00f5e n tiisa kiris-neda,
  n k\u0269t t\u2019a y\u1ebdesm\u00e3 booge. T\u00f5e n k\u0269tame t\u2019a pa le
  pelgd a p\u028bg n p\u028b\u028bsd\u1ebd, n pa le karemd W\u1ebdnnaam Gomd\u00e3
  s\u00f5ma, n pa le k\u1ebdnd tigiss\u00e3 f\u00e3a, n pa le yit koe-mooneg\u00e3
  s\u00f5ma me ye. La b\u00f5e la d t\u00f5e n maan t\u0269 s\u00f5ng-d t\u0269 d
  yam da wa yuus nana?\\nD MODG T\u0196 D YAM\u00c3 RA YUUS YE\\n13. Wa Biibl\u00e3
  s\u1ebdn p\u0129nd n togs\u00e3, neb w\u028bsg manesem yaa w\u00e3n r\u0169nd\u00e3-r\u0169nd\u00e3,
  la b\u00f5e la d t\u00f5e n maan t\u0269 d t\u1ebdeb\u00e3 kell n tall p\u00e3nga?\\n13
  D segd n ninga d yam\u1ebd t\u2019a S\u028b\u0269t\u00e3an d\u0169niy\u00e3 s\u00e3oong
  ta n saame, la t\u0269 d s\u00e3 n t\u0169ud neb s\u1ebdn pa k\u0269s s\u0269d t\u0269
  t\u00f5nd v\u0269\u0269 \u2018yaoolem wakat\u00e3\u2019 p\u028bg\u1ebd, t\u00f5e
  n waa ne yelle. T\u028bm-t\u028bmd a P\u0269\u025b\u025br goma t\u00f5nd wakat\u00e3
  yell n yeel woto: \u201cNeb s\u1ebdn laad neb\u00e3, la neb s\u1ebdn sakd b\u00e3mb
  mens w\u1ebdng ratm\u00e3 na n z\u0129ndame. La b\u00e3mb na n yeelame: \u2018B\u00e3mb
  waoong k\u00e3abg\u00e3 bee y\u025b? T\u0269 b\u00f5e, hal t\u00f5nd yaab-r\u00e3mb\u00e3
  s\u1ebdn ki t\u0269 ta mas\u00e3, b\u0169mb f\u00e3a ket n yaa wa d\u0169niy\u00e3
  naaneg wakate.\u2019 \u201d (2 P\u0269\u025b. 3:3, 4) D s\u00e3 n karemd W\u1ebdnnaam
  Gomd\u00e3 daar f\u00e3a la d z\u00e3msd-a n pa vaand\u1ebd, na n t\u1ebdegd-d lame
  t\u0269 d\u0169ni-k\u00e3ng\u00e3 bee a \u2018yaoolem wakat\u00e3\u2019 p\u028bg\u1ebd.
  Wa Biibl\u00e3 s\u1ebdn p\u0129nd n togs\u00e3, s\u0269d\u00e3 k\u0269\u0269sg s\u0269nga
  hal s\u1ebdn kaoose, n ket n tar p\u00e3nga. \u2018Yel-w\u1ebdn\u00e3 rao\u2019
  ket n beeme, n k\u0269\u0269sd W\u1ebdnnaam nin-buiid\u00e3. Woto f\u00e3a k\u0269tame
  t\u0269 d pa segd n y\u0129m t\u2019a Zeova daar\u00e3 ta n saame ye.\u2014Sof.
  1:7.\\n14. D s\u00e3 n moond ko\u025b\u025bg\u00e3 ne y\u1ebdesem, w\u00e3n to la
  nafd t\u00f5ndo?\\n14 B\u0169mb a to s\u1ebdn t\u00f5e n s\u00f5ng-d t\u0269 d yam\u00e3
  ra yuus yaa d s\u1ebdn na n moond ko\u025b\u025bg\u00e3 n pa vaand\u1ebd. R\u1ebdnd
  a Zezi Kirist s\u1ebdn yaa tiging\u00e3 Zu-soab\u00e3 s\u1ebdn wa n yeel a karen-biis\u00e3
  t\u0269 b k\u1ebdng n maan neb\u00e3 buud f\u00e3a t\u0269 b y\u0269 y\u1ebd karen-biisi,
  la b z\u00e3ms-b t\u0269 b sak b\u0169mb nins f\u00e3a y\u1ebd s\u1ebdn da togs-b\u00e3,
  a ra k\u00f5t-b-la saglg s\u1ebdn na n kogl-ba. (Mat. 28:19, 20) Yaa d s\u1ebdn
  na n moond ko\u025b\u025bg\u00e3 ne y\u1ebdesem la d wilgd t\u0269 d t\u0169uda
  a saglg\u00e3. D t\u00f5e n k\u0269sa s\u0269d t\u0269 Tesalonik kiris-neb\u00e3
  ra pa moond ko\u025b\u025bg\u00e3 la b z\u00e3msd neb\u00e3 b s\u1ebdn segd n maan
  d\u1ebd w\u00e3 y\u0129ng bal ye. T\u1ebdeg-y t\u2019a Poll yeel-b-la woto: \u201cB\u0269
  y ra kiis S\u0269\u0269g S\u00f5ng ye. B\u0269 y ra paoog b\u00e3ngr-goam ye.\u201d
  (1 Tes. 5:19, 20) S\u0269d me, b\u00e3ngr-goam nins t\u00f5nd s\u1ebdn z\u00e3msd
  la d wilgd neb\u00e3 bee yamleoogo.\\n15. D zak p\u028bg\u1ebd Biibl z\u00e3msg\u00e3
  sasa, b\u00f5e yell la d t\u00f5e n gome?\\n15 T\u00f5nd f\u00e3a ratame n s\u00f5ng
  d zags\u00e3 r\u00e3mb t\u0269 b paas b mooneg\u00e3 minim. R\u1ebd n so t\u0269
  saam-biis la saam-bi-pogs w\u028bsg mi n gomd koe-mooneg\u00e3 yell b zak p\u028bg\u1ebd
  Biibl z\u00e3msg\u00e3 sasa. T\u00f5e t\u0269 y na n segla y s\u1ebdn t\u00f5e n
  lebg n t\u0269 ges ned n s\u00f5s to-to t\u0269 y\u0269 s\u00f5ma. Wala makre, b\u00f5e
  yell la y na n t\u0269 gome? B\u00f5e la y t\u00f5e n yeel t\u0269 k\u0269t t\u2019a
  soab\u00e3 ket n dat n kelg ko\u025b\u025bg\u00e3? Wakat b\u028bg la y t\u00f5e
  n k\u1ebdng t\u0269 zemse? K\u1ebder me s\u00e3 n wa maand b zak p\u028bg\u1ebd
  Biibl z\u00e3msg\u00e3, b wae n naagda taab n segend tigiss\u00e3. R\u1ebd y\u0129nga,
  y\u00e3mb zak\u00e3 r\u00e3mb t\u00f5e n maanda woto b\u0269? Y s\u00e3 n k\u00f5t
  leoor tigiss\u00e3 sasa, na n paasa y t\u1ebdeb\u00e3 p\u00e3nga, la s\u00f5ng-y
  t\u0269 y yam da yuus ye. (Y\u0269\u0269l 35:18) Y s\u00e3 n maand zak p\u028bg\u1ebd
  Biibl z\u00e3msg\u00e3 s\u00f5ma, na n s\u00f5nga y\u00e3mb ne y zak\u00e3 r\u00e3mb
  t\u0269 y ra wa tall tags-k\u025bga, n bas t\u0269 y yam yuus ye.\\n16. B\u00f5e
  n s\u00f5ngd s\u1ebdn paam-b zaeeb\u00e3 t\u0269 b yam pa yuusd\u1ebd?\\n16 Y\u028b\u028bm
  w\u028bsg p\u028bg\u1ebd, a Zeova s\u00f5nga a nin-buiid\u00e3 t\u0269 b w\u028bm
  Biibl\u00e3 b\u00e3ngr-goam v\u00f5or n paase. D s\u00e3 n tags r\u1ebd yelle, k\u0269tdame
  t\u0269 d maneg n k\u0269s s\u0269d t\u2019a na n wa k\u00f5-d-la b\u00f5n-s\u00f5ma
  w\u028bsgo. S\u1ebdn paam-b zaeeb\u00e3 g\u0169uda wakat ning b s\u1ebdn na n wa
  t\u0269 naag Kirist\u00e3 n d\u0269 naam saas\u1ebd w\u00e3. Yaa v\u1ebdeneg t\u0269
  b s\u00e3 n b\u028bgs r\u1ebd zugu, na n k\u0269tame t\u0269 b modg t\u0269 b yam
  da yuus ye. R\u1ebd n so t\u2019a Poll yeel Tesalonik kiris-neb\u00e3 me s\u1ebdn
  da paam v\u028b\u028bsem s\u00f5ng zaeeb\u00e3 woto: \u201cM ba-biis s\u1ebdn yaa
  Zu-soab\u00e3 nin-nongdse, a zemsame t\u0269 t\u00f5nd p\u028b\u028bs W\u1ebdnnaam
  bark y\u00e3mb y\u0129ng wakat f\u00e3a, t\u0269 b\u00f5e, W\u1ebdnnaam y\u00e3ka
  y\u00e3mb . . . t\u0269 y paam f\u00e3agre, S\u0269\u0269g S\u00f5ng s\u1ebdn welg
  y\u00e3mb t\u0269 y z\u0129nd p\u028b-peelem, la y\u00e3mb s\u1ebdn t\u1ebd s\u0269d
  ko\u025b\u025bg\u00e3 y\u0129nga.\u201d\u20142 Tes. 2:13.\\n17. W\u00e3n to la 2
  Tesalonik r\u00e3mb 3:1-5 goam\u00e3 k\u00f5t y\u00e3mb raoodo?\\n17 S\u1ebdn na
  n wa v\u0269\u0269md-b t\u1ebdng\u00e3 zug wakat s\u1ebdn k\u00f5n sa w\u00e3 me
  segd n modgame t\u0269 b yam da yuus nana ye. Y\u00e3mb me s\u00e3 n saagdame n
  na n wa v\u0269\u0269md t\u1ebdng\u00e3 zugu, b\u0269 y ra y\u0129m goam nins a
  Poll s\u1ebdn yeel Tesalonik kiris-neb\u00e3 s\u1ebdn paam v\u028b\u028bsem s\u00f5ng
  zaeeb\u00e3 ye. (Karm-y 2 Tesalonik r\u00e3mb 3:1-5.) Gom-k\u00e3ens\u00e3 pa kengd
  d raood s\u0269da? V\u1ebdenega, l\u025bta nins a Poll s\u1ebdn tool Tesalonik kiris-neb\u00e3
  p\u028bs\u1ebd, d paamda sagls s\u1ebdn t\u00f5e n s\u00f5ng-d t\u0269 d ra tall
  tags-k\u025bga, n bas t\u0269 d yam yuus ye. D s\u1ebdn mi t\u0269 saab\u00e3 ta
  n saame w\u00e3, sagl-k\u00e3ens s\u0269d noom-d-la w\u028bsgo.\\n[T\u1ebdngr note]\\n^
  sull 6 A Poll wilga T\u028b\u028bm 20:29, 30 p\u028bg\u1ebd w\u00e3 t\u0269 \u201cneb
  na n yika [kiris-neb\u00e3] s\u028bk n z\u00e3ms neb\u00e3 s\u1ebdn ka s\u0269da,
  n belg karen-biis\u00e3 t\u0269 b t\u0169 b\u00e3mba.\u201d Kaoosg zug\u1ebd, kiris-neb\u00e3
  wa n getame t\u0269 tiging\u00e3 taoor l\u028b\u0269tb\u00e3 y\u0269\u0269da neb
  a taab\u00e3. Y\u028b\u028bmd 200 w\u00e3 loogr poore, wa n lebga v\u1ebdeneg t\u0269
  yaa kiris-neb ne y\u028b\u028br\u00e3 taoor-d\u00e3mb\u00e3 s\u1ebdn naag taab la
  \u201cyel-w\u1ebdn\u00e3 rao\u00e3.\u201d\u2014Ges-y y\u028b\u028bmd 1990 wao-fugdg
  kiuug pipi daar G\u0169usg Gasg\u00e3 neng 10-14.\\n[Z\u00e3msg\u00e3 sogsg\u00e3]\\n[Foto
  seb-neng a 8]\\n[Foto seb-neng a 9]\\nA Poll l\u025bta w\u00e3 p\u028bs\u1ebd, a
  k\u00f5o kiris-neb\u00e3 sagls s\u1ebdn zems b wakate (Ges-y sull a 4, 5)\\n[Foto
  seb-neng 12]\\nD s\u00e3 n segl koe-mooneg\u00e3 s\u00f5ma n yaool n yi, s\u00f5ngdame
  t\u0269 d yam da yuus ye (Ges-y sull 14, 15)\"", "\"Daar a ye, m baaba yeela m ma
  yaa: \u201cFo s\u00e3 n deeg lisgu, m na n bas-f lame!\u201d Y\u0269\u0269 y\u028b\u028bmd
  1941. Baa m baaba s\u1ebdn yeel woto n na n bugs m ma w\u00e3, a pa koms raood ye.
  A reega lisgu, n na n wilg t\u2019a r\u0269ka a meng n k\u00f5 a Zeova. M baaba
  maana a s\u1ebdn da yeel\u00e3. A s\u0269d loogame n bas t\u00f5ndo. R\u1ebd t\u0269
  m tara y\u028b\u028bm a nii bala.\\nS\u1ebcN deng wakat k\u00e3ng meng t\u0269 mam
  da zoe n nonga Biibl\u00e3 goam\u00e3. M ma ra paamda siglg\u00e3 s\u025bba, t\u0269
  m da nong seb-k\u00e3ense, s\u1ebdn y\u0269\u0269d f\u00e3a fot-r\u00e3mb\u00e3.
  M baaba ra pa rat t\u0269 m ma wilg maam a s\u1ebdn da z\u00e3msd Biibl\u00e3 p\u028bg\u1ebd
  w\u00e3 ye. La m da sokda sogsg w\u028bsgo. R\u1ebd n so t\u0269 m ma ra z\u00e3msd
  maam Biibl\u00e3, m baaba s\u00e3 n wa pa be zak\u1ebd. K\u0269tame t\u0269 ma-me
  wa y\u00e3k yam n na n d\u0269k m meng n k\u00f5 a Zeova. M deega lisg y\u028b\u028bmd
  1943 w\u00e3, Balakpull, \u00c3ngelet\u025b\u025br soolm\u1ebd w\u00e3. M da tara
  y\u028b\u028bm piiga.\\nMAM K\u1ebcESA M MENG A ZEOVA T\u01b2\u01b2MD\u00c3 P\u01b2G\u1ebc\\nM
  lisg\u00e3 t\u025bka, maam ne m ma ra t\u0169uda taab n moond ko\u025b\u025bg\u00e3
  wakat f\u00e3a. Wakat k\u00e3ng t\u0269 yaa fonograf-r\u00e3mb la d ra tar n taasd
  neb\u00e3 ko\u025b\u025bg\u00e3. Fonograf f\u00e3a ra yaa bedre, n z\u0269sa, t\u2019a
  z\u0269slm\u00e3 t\u00f5e n ta kilo a naas la p\u028b\u0269-s\u028bka. Mams-y n
  ges-y y\u028b\u028bm piig la zak biig s\u1ebdn z\u00e3ad b\u0169mb s\u1ebdn z\u0269s
  woto.\\nMam s\u1ebdn wa n tar y\u028b\u028bm 14, m t\u028blg n na n lebga so-pakda.
  La m ma yeela maam t\u0269 m segd n deng n goma ne tigims sull yel-g\u025bt\u00e3
  n\\ngese. Yel-g\u025bt\u00e3 sagla maam t\u0269 m deng n z\u00e3ms nug-t\u028b\u028bmde,
  t\u0269 m s\u00e3 n wa s\u0269ng so-pakr\u00e3, b\u0269 m t\u00f5og n get m meng
  yelle. M t\u028bma y\u028b\u028bm a yiibu. R\u1ebd poore, m togsa tigims sull yel-g\u025bt
  a to t\u0269 m dat n lebga so-pakda, t\u2019a yeel yaa: \u201cYaa s\u00f5ma. S\u0269nge!\u201dWoto
  w\u00e3, y\u028b\u028bmd 1949 t\u028b\u028bl-nif kiuug\u00e3, maam ne m ma koosa
  d roog\u00e3 teed k\u1ebdere, n d\u0269k s\u00e3nda n k\u00f5, la d yik n k\u1ebdng
  Midollton s\u1ebdn p\u1ebd Mans\u025bst\u025b\u025br\u00e3, n t\u0269 s\u0269ng
  so-pakr\u00e3. Kiis a naas poore, maam ne saam-biig n zems taab n na n y\u0269 t\u0169ud-n-taas
  so-pakr\u00e3 t\u028b\u028bmd p\u028bg\u1ebd. Filiyall\u00e3 kosa t\u00f5nd t\u0269
  d t\u0269 s\u00f5ng Irlam tiging a ye s\u1ebdn nan lugl paalem. M ma ra bee tiging
  a to, t\u0269 y\u1ebd ne saam-bi-poak s\u1ebdn yaa so-pakd me t\u0169ud taab n moond\u1ebd.\\nBaa
  m s\u1ebdn da tar y\u028b\u028bm 17 bal\u00e3, b y\u00e3ka maam ne m t\u0169ud-n-taag\u00e3
  t\u0269 d ra l\u028b\u0269t taoor n w\u025bgsd s\u00f5ss tigiss\u00e3 sasa, bala
  saam-biis s\u1ebdn tar minim da pa waoog ye. B wa n kosa maam t\u0269 m t\u0269
  s\u00f5ng Bogston tiging\u00e3, bala be koe-moondb\u00e3 ra paooda w\u028bsgo. Mam
  getame t\u0269 t\u028b\u028bm nins f\u00e3a b s\u1ebdn k\u00f5 maam m so-pakr\u00e3
  s\u0269ngr\u1ebd w\u00e3 k\u0269tame t\u0269 m paam minim s\u1ebdn s\u00f5ng-ma,
  b s\u1ebdn wa n k\u00f5-m t\u028b\u028bm a taab\u00e3.\\nY\u028b\u028bmd 1951 w\u00e3,
  mam kosame n na n k\u1ebdng Gileyaad lekoll\u00e3. La 1952 y\u028b\u028bm-sar kiuug\u00e3,
  b boola maam sodaar\u00e3. M yeela sodaar\u00e3 yell b\u028b-kaoodb\u00e3 t\u0269
  mam yaa wakat f\u00e3a koe-moonda, s\u1ebdn na y\u0269l t\u0269 b sak t\u0269 m
  da k\u1ebd sodaar\u00e3 ye. B z\u00e3gsame, n yeel t\u0269 b k\u1ebdes maam b\u00e3ens\\nroog
  kiis a yoobe. M s\u1ebdn wa n ket b\u00e3ens\u00e3 roog\u00e3, b g\u028blsa maam
  l\u025btre, n bool-m t\u0269 m wa Gileyaad lekoll 22 soab\u00e3. Y\u028b\u028bmd
  1953 s\u1ebdoog kiuug\u00e3, mam k\u1ebde batayo b s\u1ebdn boond t\u0269 Georgic
  n na n k\u1ebdng Niuyorke.Mam s\u1ebdn ta w\u00e3, m paam n k\u1ebdnga y\u028b\u028bmd
  1953 tigis-k\u00e3seng\u00e3. A gom-zug\u00e3 y\u0269\u0269 \u201c La soci\u00e9t\u00e9
  du monde nouveau. \u201d R\u1ebd poore, mam k\u1ebde t\u1ebdr n na n k\u1ebdng Safl\u00e3ns\u0129ng
  s\u1ebdn be Niuyork\u00e3, bala lekoll\u00e3 ra bee be. M s\u1ebdn da nan yi b\u00e3ens
  roog\u00e3, m da pa tar ligd w\u028bsg ye. T\u1ebdr\u00e3 s\u1ebdn ta gaar\u1ebd
  w\u00e3, m da segd n k\u1ebde biis n paam n ta Safl\u00e3ns\u0129ng. M kong n penga
  so-toagd a ye ligd bilf n na n yao biis\u00e3 ligdi.\\nB T\u01b2MA MAAM T\u1ebcN-Z\u1ebcNGA\\nGileyaad
  lekoll\u00e3 s\u00f5nga t\u00f5nd t\u0269 d paam minim, s\u1ebdn na y\u0269l t\u0269
  misioneeremd\u00e3 p\u028bg\u1ebd b\u0269 d t\u00f5og n \u201cy\u0269 b\u0169mb\u00e3
  f\u00e3a, neb\u00e3 f\u00e3a y\u0129nga.\u201d (1 Kor. 9:22). Lekoll\u00e3 poore,
  b t\u028bma maam ne a Paul Bruun la a Raymond Leach Filipin soolm\u1ebd w\u00e3.
  D g\u0169u kiis a w\u00e3n n yaool n na n t\u00f5og n paam d so-toak\u00e3 s\u025bba.
  R\u1ebd poore, t\u00f5nd k\u1ebde batayo n pasg Rot\u025brdam, Mediterane mogr\u00e3,
  Kanalldes\u028b\u025b\u025bz, Osey\u00e3 \u1ebdndiy\u1ebd w\u00e3, Mal\u025bzi la
  H\u00f5ng K\u00f5ng. Y\u0269\u0269 rasem 47 la d maan mogr\u00e3 zugu. Y\u028b\u028bmd
  1954 s\u0269paolg rasem 19 la d ta Maniy s\u1ebdn yaa Filipin na-t\u1ebdng\u00e3.\\nD
  ra segdame mas\u00e3 n minim t\u1ebdng a to p\u028bg\u1ebd v\u0269\u0269m, n minim
  a neb\u00e3, la d z\u00e3ms b buud-gomd\u00e3. La b reng n k\u0269tame t\u0269 t\u00f5nd
  d t\u00e3ab\u00e3 k\u1ebdng Kezon tiging a ye p\u028bg\u1ebd. T\u1ebdn-k\u00e3ng
  neb\u00e3 w\u028bsg ra gomda \u00e3ngilind\u00e3. R\u1ebd n so t\u0269 kiis a yoob
  poore, t\u00f5nd s\u1ebdn t\u00f5og n z\u00e3ms yaa tagaloog\u00e3 gom-biis a w\u00e3n
  bala. La b wa n k\u00f5o t\u00f5nd t\u028b\u028bmd a to, t\u0269 r\u1ebd s\u00f5ng-d
  t\u0269 d z\u00e3ms buud-gomd\u00e3 s\u00f5ma.\\nY\u028b\u028bmd 1955 sig-noy kiuug\u00e3,
  t\u00f5nd yii koe-mooneg\u00e3 daar a ye n lebg n wa, n mik l\u025bta b s\u1ebdn
  tool maam ne saam-biig a Leach. B yeela l\u025bta w\u00e3 p\u028bg\u1ebd t\u0269
  b y\u00e3ka t\u00f5nd t\u0269 d na n y\u0269 tigims sul yel-g\u025btba. M da tara
  y\u028b\u028bm 22 bala, la t\u028b\u028bm-k\u00e3nga paka sor t\u0269 m na n le
  maan b\u0169mb a taaba, n kell n \u201cy\u0269 b\u0169mb\u00e3 f\u00e3a, neb\u00e3
  f\u00e3a y\u0129nga.\u201d\\nWala makre, mam s\u1ebdn lebg tigims sull yel-g\u025bt\u00e3,
  mam pipi z\u00e3ma taoor s\u00f5sg y\u0269\u0269 z\u0129-v\u0269\u028b\u028bg\u1ebd,
  t\u1ebdn-bil a ye butik noore. M wa n b\u00e3ngame t\u0269 wakat k\u00e3nga, Filipin
  saam-biis\u00e3 ra tagsdame t\u0269 s\u1ebdn na y\u0269l t\u0269 s\u00f5sg s\u0269d
  y\u0269 z\u00e3ma taoor s\u00f5sga, r\u1ebdnda y\u0269 z\u0129-v\u0269\u028b\u028bg\u1ebd.
  M s\u1ebdn wa n gilgd n kaagd tigims\u00e3, m da w\u025bgsda s\u00f5ss z\u00e3n
  t\u1ebdngre, raas\u1ebd, meeri-r\u00e3mb noy, bask\u025btboll t\u00e3oob z\u0129is\u1ebd,
  zard\u1ebd-r\u00e3mb\u1ebd, la naoor w\u028bsg menga, soay\u00e3 k\u0269remse. Daar
  a ye, S\u00e3npablo t\u1ebdng\u1ebd w\u00e3, saag n k\u0269t t\u0269 m da pa t\u00f5e
  n w\u025bgs m s\u00f5sg raag\u1ebd ye. Mam yeela k\u00e3sem-d\u00e3mb\u00e3 t\u0269
  d t\u00f5e n k\u1ebdnga R\u0129ung\u00e3 roog\u1ebd. S\u00f5sg\u00e3 poore, saam-biis\u00e3
  soka maam t\u0269 s\u1ebdn pa y\u0269 z\u0129-v\u0269\u028b\u028bg\u1ebd w\u00e3,
  r\u1ebd y\u0129nga yaa z\u00e3ma taoor s\u00f5sg s\u0269da?\\nWakat f\u00e3a mam
  da sigda saam-biis\u00e3 zags\u1ebd. Baa b rot\u00e3 s\u1ebdn da pa ro-b\u025bd\u00e3,
  ra yaa y\u0269lma. Mam g\u00e3ag\u00e3 z\u0129ig wae n yaa p\u0129ir b s\u1ebdn
  t\u0269\u028b t\u1ebdn-lamd\u00e3 s\u1ebdn lud ne ra-p\u025bgd\u00e3 zugu. Ko-sols\u00e3
  ra pa g\u0169bg ye. Mam-me ra maanda wa neb\u00e3, n sood y\u0269ng ne futu. Mam
  s\u00e3 n da na n tog sore, m da k\u1ebdeda kaar b\u0269 biisi. La m s\u1ebdn dabd\u1ebd
  w\u00e3 s\u00e3 n yaa koom s\u028bk t\u1ebdnga, m k\u1ebdeda batayo. Mam s\u1ebdn
  k\u1ebdes m meng z\u00e3ng a Zeova t\u028b\u028bmd\u00e3 p\u028bg\u1ebd w\u00e3
  t\u025bka, m z\u0269 n paam m toor mobill ye.\\nKoe-mooneg\u00e3 la tigims\u00e3
  kaagr s\u00f5nga maam t\u0269 m z\u00e3ms tagaloog\u00e3. Mam pa tol n paam t\u0269
  b z\u00e3ms maam buud-gomd\u00e3 woto ye. Yaa m s\u1ebdn da kelgd m t\u1ebded-n-taas\u00e3
  koe-mooneg\u00e3 sasa la tigiss\u00e3 sasa w\u00e3 n s\u00f5ng-m t\u0269 m z\u00e3mse.
  M t\u1ebded-n-taas\u00e3 ra rata ne b s\u0169ur f\u00e3a n s\u00f5ng-m t\u0269 m
  b\u00e3ng b buud-gomd\u00e3. M p\u028b\u028bsd-b-la bark b s\u1ebdn s\u00f5ng maam
  ne s\u0169-mar la ne p\u028b-peelm\u00e3.\\nB wa n k\u00f5o maam t\u028b\u028bm
  a taaba, t\u0269 k\u0269t t\u0269 m le sak n toeem b\u0169mb k\u1ebdere. Y\u028b\u028bmd
  1956, tigis-k\u00e3seng n z\u0129nd Filipin soolm\u00e3 t\u00f5r y\u0129nga,\\nt\u0269
  saam-biig a Nathan Knorr wa. B y\u00e3ka maam t\u0269 m segd n ges t\u0269 neb\u00e3
  paam kibay tigs-k\u00e3seng\u00e3 zugu. Mam da pa tar t\u028b\u028bmd\u00e3 minim
  ye. La neb a taab n sak n s\u00f5ng-ma. S\u1ebdn pa y\u00e3 n ta y\u028b\u028bmde,
  tigis-k\u00e3seng a to n le z\u0129nd t\u1ebdng\u00e3 t\u00f5r y\u0129nga. So-k\u00e3nga,
  y\u0269\u0269 saam-biig a Frederick Franz s\u1ebdn da t\u028bmd t\u00f5nd biru-k\u00e3seng\u1ebd
  w\u00e3 n wa. Maam n da yaa tigis-k\u00e3seng\u00e3 yel-g\u025bta. M paam n d\u0269ka
  yam saam-biig a Franz neng\u1ebd. A ra mi n sakd n toeemda a s\u1ebdn maand\u00e3
  t\u0269 zemsd ne neb\u00e3 minimdu. Saam-biig a Franz yeelga tagaloog-r\u00e3mb\u00e3
  fuug n w\u025bgs a z\u00e3ma taoor s\u00f5sg\u00e3. R\u1ebd s\u0269d y\u0269\u0269
  saam-biis\u00e3 noogo.B wa n y\u00e3ka maam t\u0269 m lebg distrik yel-g\u025bta.
  K\u0269tame t\u0269 m da segd n sak n toeem b\u0169mb k\u1ebder y\u025bsa. Wakat
  k\u00e3nga, t\u00f5nd da wilgda neb\u00e3 filim ning gom-zug s\u1ebdn yaa \u201c
  Le bonheur de la soci\u00e9t\u00e9 du Monde Nouveau \u201d w\u00e3. La wae n yaa
  z\u0129-v\u0269\u028b\u028bg\u1ebd. Sasa ninga, b\u00f5n-y\u0269gds\u00e3 namsda
  t\u00f5ndo. Yaa mas\u0129n ning d s\u1ebdn da tar n ningd film\u00e3 bugum n boond-ba.
  B p\u028bd n k\u1ebdeda mas\u0129n\u00e3 p\u028bg\u1ebd. Film\u00e3 poore, y\u0269l
  n yiis-b mas\u0129n\u00e3 p\u028bg\u1ebd yaa t\u028b\u028bm-saalg menga! Y\u0269l
  n sigl b\u0169mba f\u00e3a n t\u00f5og n ning film\u00e3 t\u0269 neb\u00e3 ges\u00e3
  pa nana ye. La d s\u00e3 n da ne g\u025btb\u00e3 s\u0169y s\u1ebdn noom to-to, b
  s\u1ebdn b\u00e3ng t\u2019a Zeova nin-buiid\u00e3 bee d\u0169niy\u00e3 gill zug\u00e3,
  d y\u0129mda d naong\u00e3.\\nKatolik\u00e3 taoor d\u00e3mb ra t\u00f5gda t\u1ebdng\u00e3
  taoor d\u00e3mb k\u1ebder s\u1ebdn na y\u0269l t\u0269 b ra k\u00f5 t\u00f5nd sor
  t\u0269 d maan d tigis-k\u00e3sems\u00e3, wall s\u00e3 n mik\\nt\u0269 tigis-k\u00e3seng\u00e3
  z\u0129ig p\u1ebde b w\u1ebdnd-doogo, b w\u1ebdeda lombr\u00e3 n tiisd tigsg\u00e3.
  Baasgo, a Zeova t\u028b\u028bmd\u00e3 k\u1ebdnga taoore. R\u0169nd\u00e3-r\u0169nd\u00e3,
  z\u0129-k\u00e3ens neb\u00e3 w\u028bsg yaa a Zeova Kaset r\u00e3mba.T\u01b2\u01b2M
  S\u1ebcN K\u0196T T\u0196 M LE SAK N TOEEM B\u0168MB K\u1ebcERE\\nY\u028b\u028bmd
  1959 soab\u00e3 p\u028bg\u1ebd, b g\u028blsa maam l\u025btr n yeel t\u0269 b ratame
  t\u0269 m t\u0269 t\u028bm filiyall\u1ebd w\u00e3. Been\u1ebd, m paam n z\u00e3msa
  b\u0169mb a taaba. B wa n kosa maam t\u0269 m gilgd n kaagd t\u1ebdns a taab filiyall-d\u00e3mba.
  Filiyall a ye kaagr sasa, mam b\u00e3nga Tayl\u00e3nd misioneer-poak y\u028b\u028br
  s\u1ebdn boond t\u2019a Janet Dumond. R\u1ebd t\u025bka, d ra g\u028blsda taab l\u025bta.
  Tar\u1ebd-n-tar\u1ebd, d wa n k\u1ebde k\u00e3adem. Y\u028b\u028bm 51 la woto d
  s\u1ebdn naag taab n t\u028bmd a Zeova t\u028b\u028bmd\u00e3 hal t\u0269 k\u00f5t-d
  s\u0169-noogo.\\nA Zeova Kaset r\u00e3mb s\u1ebdn be t\u1ebdns 33 p\u028bg\u1ebd
  la m gilg n kaage. M s\u0169ur nooma ne t\u028b\u028bm nins b s\u1ebdn k\u00f5-m
  m so-pakr\u00e3 s\u0269ngr\u1ebd w\u00e3, bala s\u00f5nga maam t\u0269 m paam minim,
  t\u0269 r\u1ebd naf-ma, m s\u1ebdn wa n gilgd n kaagd filiyall-d\u00e3mba, n da
  segd n t\u028bm ne neb buud toor-toor\u00e3. Filiyall-d\u00e3mb\u00e3 kaagr k\u0269tame
  t\u0269 m b\u00e3ng buud a taab minimdu, la k\u0269t me t\u0269 m s\u0269d ne\u1ebd
  t\u2019a Zeova nonga neb buud f\u00e3a.\u2014T\u028b\u028b. 10:34, 35.\\nM KET N
  SAKD N TOEEMDA B\u0168MB K\u1ebcERE\\nT\u00f5nd s\u1ebdn be Filipin soolm\u1ebd
  w\u00e3, n naag d t\u1ebded-n-taas\u00e3 n t\u028bmd a Zeova t\u028b\u028bmd\u00e3
  nooma t\u00f5nd w\u028bsgo! R\u0169nd\u00e3-r\u0169nd\u00e3, koe-moondb\u00e3 s\u00f5or
  y\u0269\u0269da m s\u1ebdn wa n wa paalm\u00e3 naoor piiga. Maam ne a Janet ket
  n t\u028bmda Filipin filiyall\u1ebd w\u00e3. Filiyall\u00e3 bee Kezon. Y\u028b\u028bm
  60 la zak la m s\u1ebdn be t\u1ebdn-z\u1ebdng n t\u028bmd a Zeova t\u028b\u028bmd\u00e3.
  La m ket n neeme t\u0269 yaa t\u0269l\u025b t\u0269 m sakd n toeemd b\u0169mb k\u1ebder
  s\u1ebdn na y\u0269l n maan a Zeova s\u1ebdn dat f\u00e3a. B\u0169mb nins b s\u1ebdn
  toeem siglg\u00e3 p\u028bg\u1ebd s\u1ebdn nan pa kaoos\u00e3 k\u0269tame t\u0269
  yaa t\u0269l\u025b t\u0269 d ket n sakd n toeemd b\u0169mb k\u1ebdere, n t\u00f5og
  n t\u028bm a Zeova t\u028b\u028bmd\u00e3, n s\u00f5ng d saam-biis\u00e3.\\nT\u00f5nd
  maanda d s\u1ebdn t\u00f5e, n sakd b\u0169mb ning f\u00e3a d s\u1ebdn mi t\u0269
  yaa a Zeova raabo. Woto k\u0269tdame t\u0269 ned v\u0269\u0269m tall barka. T\u00f5nd
  maoome me n toeem b\u0169mb k\u1ebdere, n t\u00f5og n t\u028bm n s\u00f5ng d t\u1ebded-n-taas\u00e3
  s\u00f5ma. A Zeova s\u00e3 n sake, d na n ket n maooda ne d s\u0169y f\u00e3a n
  lebgd \u201cb\u0169mb\u00e3 f\u00e3a, neb\u00e3 f\u00e3a y\u0129nga.\u201d\"", "\"Kwaku
  Agyemang-Manu (A rogem daare yaa y\u028b\u028bmd 1955 B\u00f5n-b\u0269\u028b\u028bng
  Kiuug dahem a yoob daare) yaa Ghana politik neda. A yaa Dormaa Central depite ned
  la a me yaa Laaf\u0269-Ministr Taoor Soaba (Anglindi: Minister for Health). A ya
  Chartered Management Accountant la da pam a Economics Bachelor of Arts la a Statistics
  University of Ghana y\u028b\u028bmd 1989.\\n[edit | edit source]\\nAgyeman-Manu
  dag roga Dormaa Ahenkro p\u028bge m''be Brong Ahafo Region m pa ya Bono Region w\u00e3.A
  paama''a G.C.E Ordinary Level y\u028bm 1973 la''a G.C.E Advanced Level y\u028bm
  1975.A ya Chartered Management Accountant la Associate ned y\u028bm 1990. La paam
  a Bachelor of Arts Economics p\u028bge la Statistics University of Ghana y\u028bm
  1979.A leb sa Management Accountantancy b\u00e3ngre London School of Accountantancy.\\n[edit
  | edit source]\\nA dag ya Ghamot Compaby Limited'' finace taoor soaba la Toyota
  Ghana Company Limited. A leb n y\u0269\u0269 Deputy Accountant MIM Timber Company
  Limited p\u028bg\u1ebd.\\nA Politik T\u028b\u028bma Agyeman-Manu ya New Patriotic
  Part\u0269 neda la Dormaa Central Consituency m''be Brong Ahafo region Gana p\u028bge.
  A dag yi Public Accountant Committee taoor soaba ne depite r\u00e3mb soog looga
  la leb dag ya National Health Authority kasma y\u028bm 2006,n leb dag ya ned m p\u028bgde
  Minister of Finance la Economic Planning prizda Kufuor wakat (y\u028bm 2001 diki
  k\u1ebdng y\u028bm 2008). Gofneema kanga naam p\u028bge,a yi Deputy Minister of
  State ne ministr y\u028bi m p\u028bgda: leebgo la lozind t\u028b\u028bma, Finace,goama
