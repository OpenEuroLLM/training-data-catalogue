  nanda, m doagdb\u00e3 s\u0169ur na n wa sigame ye.\\nMam s\u0269nga so-pakr\u00e3
  yaoolem y\u028b\u028bmd ning m s\u1ebdn z\u0129nd kol\u025b\u025bs\u1ebd w\u00e3.
  Mam s\u1ebdn s\u0269ng so-pakr\u00e3 poor bilfu, m y\u00e3ka yam n dat n t\u0269
  s\u00f5ng z\u0129ig koe-moondb\u00e3 s\u1ebdn pa waooge. La m ma ne m baaba ra pa
  rat t\u0269 m yi zak\u1ebd w\u00e3 ye. R\u1ebd n so t\u0269 mam g\u0169 n wa ta
