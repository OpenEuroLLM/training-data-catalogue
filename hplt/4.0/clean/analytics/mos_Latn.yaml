  y\u0129nga, a Zeova g\u0269dga Isra\u025bll neb\u00e3 t\u0269 b ra bao n gom ne
  s\u1ebdn ki-b\u00e3 b\u0269 n maan t\u0269\u0269m buud baa a yembr ye.\u2014T\u00f5odo
  18:10-12.\\n5. B\u00f5e la y t\u00f5e n maane, tall b\u00f5n-naands b\u0269 yimaas
  r\u00e3mb n p\u028b\u028bs\u00e3, b\u0269 yaab r\u00e3mb\u00e3 s\u1ebdn ki w\u00e3
  baleng s\u00e3 n da bee y\u00e3mb p\u0129nd t\u0169udm\u00e3 p\u028bg\u1ebd?\\n5
  Tall b\u00f5n-naands b\u0269 yimaas r\u00e3mb\u00e3 n p\u028b\u028bse, b\u0269 yaab
  r\u00e3mba s\u1ebdn ki w\u00e3 baleng s\u00e3 n da bee y\u00e3mb p\u0129nd t\u0169udm\u00e3
  p\u028bg\u1ebd, yaa b\u00f5e la y t\u00f5e n maane? Karm-y Biibl\u00e3 verse r\u00e3mb
  nins s\u1ebdn wilgd W\u1ebdnnaam s\u1ebdn get b\u00f5n-k\u00e3ens to-to w\u00e3,
  la y tags b zugu. P\u028b\u028bs-y-y\u00e3 a Zeova daar f\u00e3a la y wilg t\u0269
  y t\u028bll n saka s\u0269d t\u0169udm\u00e3, la y kos-a t\u2019a s\u00f5ng-y t\u0269
  y tagsg\u00e3 zems ne y\u1ebd r\u1ebdnd\u00e3.\u2014Ezai 55:9.\\nPIPI KIRIS-NEB\u00c3
  RA PA MAAND NOW\u0190LL\u00c3 YE\\n6, 7. a) Neb\u00e3 tagsdame t\u0269 Now\u025bll\u00e3
  t\u1ebdegda b\u00f5e, la a Zezi pipi karen-biis\u00e3 maan-a lame b\u0269? b) A
  Zezi pipi karen-biis\u00e3 s\u1ebdn da be t\u1ebdng zug\u00e3 sasa, rogem daar t\u1ebdegr
  kibs r\u00e3mb\u00e3 ra t\u0269 loee ne b\u00f5e?\\n6 Ziri t\u0169udm\u00e3 tig\u00e3
  t\u00f5e n k\u0269tame t\u0269 ned s\u1ebdn balemd W\u1ebdnnaam\u00e3 to-to w\u00e3
  r\u1ebdgem. D r\u0269k makr ne Now\u025bll\u00e3. B tagsdame t\u0269 Now\u025bll\u00e3
  t\u1ebdegda a Zezi Kirist rogm\u00e3, la s\u1ebdn yet-b t\u0269 b yaa kiris-neb\u00e3
  f\u00e3a la bal maanda tig-k\u00e3ng\u00e3. La b\u0169mb pa wilgd t\u2019a Zezi
  pipi karen-biis\u00e3 ra maanda Now\u025bll\u00e3 ye. Sebr a yembr (Sacred Origins
  of Profound Things) yetame: \u201cY\u028b\u028bm kobs-yi Kirist rogm\u00e3 poore,
  ned baa a ye da pa mi a s\u1ebdn dog wakat ning\u00e3 tak\u0269 ye. La neb w\u028bsg
  toog ra kae ne r\u1ebd meng ye.\u201d\\n7 Baa a Zezi karen-biis\u00e3 s\u00e3 n
  da b\u00e3nga a rogm\u00e3 daar me, b ra pa na n d\u0269k-a n maan tigr daar ye.
  B\u00f5e y\u0129nga? Wala sebr a yembr (The World Book Encyclopedia) s\u1ebdn yeel\u00e3,
  pipi kiris-neb\u00e3 \u201cra geta ned buud f\u00e3a rogem t\u1ebdegr kibs maaneg
  wa ziri t\u0169udum minungu.\u201d Biibl\u00e3 p\u028bg\u1ebd, yaa nanambs a yiib
  s\u1ebdn da pa a Zeova s\u00f5gen d\u00e3mb rogem t\u1ebdegr kibs yell bal la b
  gomda. (S\u0269ngre 40:20; Mark 6:21) B ra maanda rogem t\u1ebdegr kibs r\u00e3mb\u00e3
  me ziri t\u0169udm\u00e3 w\u1ebdnnaam d\u00e3mb y\u0129nga. Wala makre, sig-noy
  kiuug rasem 24, Rom d\u00e3mb\u00e3 ra maanda w\u1ebdn-poak a Dian rogem daar t\u1ebdegr
  kibsa. La v\u1ebdk-n-beoog\u00e3, b ra maanda b w\u0129ntoog w\u1ebdnnaam a Apol\u00f5
  rogem t\u1ebdegr kibsa. Woto, d neeme t\u0269 rogem daar t\u1ebdegr kibs r\u00e3mb\u00e3
  ra t\u0269 loee ne ziri t\u0169udm\u00e3, la pa ne kiris-neb t\u0169udm\u00e3 ye.\\n8.
  Wilg-y loees ning s\u1ebdn be rogem daar t\u1ebdegr kibs r\u00e3mb\u00e3 ne t\u1ebdeb
  ziri w\u00e3 s\u028bk\u00e3.\\n8 B\u028b\u028bm a to n k\u0269t t\u0269 pipi kiris-neb\u00e3
  ra pa maand a Zezi rogm\u00e3 daar t\u1ebdegr kibs ye. W\u00f5nda a karen-biis\u00e3
  ra miime t\u0269 tig-k\u00e3ens\u00e3 ra tara loees ne t\u1ebdeb ziri w\u00e3. Wala
  makre, p\u0129nd w\u1ebdnd\u1ebd G\u025brk r\u00e3mb\u00e3 la Rom d\u00e3mb\u00e3
  ra t\u1ebdedame t\u0269 kinkirg n da wat ninsaal f\u00e3a rogm\u1ebd n kogend-a
  a y\u00f5or t\u025bka. Sebr a yembr (Les traditions des anniversaires [\u00e3ngl.])
  yeta woto: \u201cKinkir k\u00e3ng\u00e3 ra tara loees s\u1ebdn yaa yel-solemd ne
  w\u1ebdnd ning rogem daar s\u1ebdn zems ne ned\u00e3 rogem daar\u00e3.\u201d S\u0269d-s\u0269da,
  a Zeova s\u0169ur pa noom ne minung baa a yembr s\u1ebdn d\u0269kd a Zezi n t\u0269
  loe ne t\u1ebdeb ziri ye. (Ezai 65:11, 12) Woto w\u00e3, s\u0269ngame t\u0269 w\u00e3n
  mas\u00e3 t\u0269 neb w\u028bsg wa maand Now\u025bll\u00e3?\\nNOW\u0190LL\u00c3
  S\u0196NGRE\\n9. B\u00f5e n k\u0269t t\u0269 b wa get y\u028b\u028bm-sar kiuug rasem
  25 wa a Zezi rogem daare?\\n9 Yaa y\u028b\u028bm kobs a Zezi s\u1ebdn z\u0129nd
  t\u1ebdng zug\u00e3 loogr poor la neb\u00e3 s\u0269ng a rogm\u00e3 t\u1ebdegr kibs
  maanego, n maand-a y\u028b\u028bm-sar kiuug rasem 25 w\u00e3 daare. La pa y\u0269
  a Zezi rogem daar la woto ye, bala y\u025bl n be n wilgd\u1ebd t\u2019a Zezi roga
  z\u0129-likr kiuugu. * La b\u00f5e y\u0129ng t\u0269 b y\u00e3k y\u028b\u028bm-sar
  kiuug rasem 25 w\u00e3 daare? Kaoosg poore, w\u00f5nda neb k\u1ebder s\u1ebdn yeel
  t\u0269 b yaa kiris-neb \u201cra ratame t\u0269 wakat k\u00e3ng zems ne Rom rog-n-mik
  t\u0169udm\u00e3 tigr\u201d b s\u1ebdn da maand n t\u1ebdegd w\u0129ntoog\u00e3
  rogem daar\u00e3. (The New Encyclop\u00e6dia Britannica) Waood\u00e3 w\u1ebdnde,
  w\u0129ntoog\u00e3 p\u00e3ng woogdame t\u0269 yaa wa a rat n menema z\u00e3nga.
  Rog-n-mik t\u0169udm\u00e3 r\u00e3mb ra t\u1ebdedame t\u2019a toga sore, n da maand
  yel-maand\u0269 s\u1ebdn na y\u0269l t\u0269 w\u0129ntoog\u00e3 s\u1ebdn k\u00f5t
  t\u028b\u028blem la v\u1ebdenem\u00e3 lebg n wa. B ra tagsdame t\u0269 yaa y\u028b\u028bm-sar
  kiuug rasem 25 w\u00e3 la daar ning w\u0129ntoog\u00e3 s\u1ebdn lebgd n wat\u1ebd
  w\u00e3. Kiris-neb ne y\u028b\u028br t\u0169udm\u00e3 taoor d\u00e3mb s\u1ebdn da
  maood n na n tuub rog-n-mik t\u0169udm\u00e3 neb\u00e3 y\u0129nga, b saka tig-k\u00e3ng\u00e3
  n w\u1ebdnems-a t\u2019a w\u00f5neg \u201ckiris-neb\u201d tigri. *\\n10. B\u00f5e
  y\u0129ng t\u0269 neb k\u1ebder da pa maand Now\u025bll\u00e3?\\n10 Hal s\u1ebdn
  kaoose, neba sak n deegame t\u0269 Now\u025bll\u00e3 yita ziri t\u0169udm\u00e3
  p\u028bg\u1ebd. Wala makre, Now\u025bll\u00e3 s\u1ebdn pa tik Biibl\u00e3 zug\u00e3
  y\u0129nga, b g\u0269dga a maaneg \u00c3ngelet\u025b\u025br la t\u1ebdns s\u00e3nda
  a s\u1ebdn da so Amerik p\u028bg\u1ebd w\u00e3 y\u028b\u028bmd 1600 n t\u0269 ta
  y\u028b\u028bmd 1700 sasa. Ned ning f\u00e3a s\u1ebdn da pa k\u1ebdng t\u028b\u028bm
  Now\u025bll daar meng beegame, n da segd n yao ligd r\u1ebd y\u0129nga. La pa y\u00e3
  n kaoos la Now\u025bll\u00e3 lebg minung wa p\u0129nd\u00e3 y\u025bsa, t\u0269 b
  paas-a yel-maand\u0269 a taab ye. A wa n lebga tig-k\u00e3seng y\u025bsa, la a ket
  n yaa woto t\u1ebdns w\u028bsg p\u028bs\u1ebd. La Now\u025bll\u00e3 s\u1ebdn yit
  ziri t\u0169udm\u00e3 p\u028bg\u1ebd w\u00e3 y\u0129nga, neb nins s\u1ebdn dat n
  ta W\u1ebdnnaam yam\u00e3 pa maand-a ye. Yaa woto me ne tigr ning f\u00e3a s\u1ebdn
  yit ziri t\u0169udm\u00e3 p\u028bg\u1ebd. *\\nBAO N B\u00c3NG TIG\u00c3 S\u1ebcN
  S\u0196NG TO-TO W\u00c3 S\u0196D TARA Y\u00d5OD B\u0196?\\n11. B\u00f5e y\u0129ng
  t\u0269 neb k\u1ebder maand tig\u00e3, la b\u0169mb ning s\u1ebdn segd n pak t\u00f5nd
  n y\u0269\u0269d\u00e3 yaa b\u00f5e?\\n11 Neb k\u1ebder sak n deegame t\u0269 tig
  wala Now\u025bll\u00e3 yita ziri t\u0169udm\u00e3 p\u028bg\u1ebd, la b ket n t\u1ebdedame
  t\u0269 tig-k\u00e3ens maaneg pa w\u1ebdng ye. Neb w\u028bsg meng s\u00e3 n maand
  tig\u00e3, b p\u028bd n pa tagsd ziri t\u0169udum yell ye. S\u1ebdn paase, sasa
  k\u00e3ens leb n p\u1ebdnegda zak\u00e3 neb ne taaba. Yaa woto ne y\u00e3mb me b\u0269?
  S\u00e3 n yaa woto, r\u1ebdnd yaa y s\u1ebdn nong y zak\u00e3 neb\u00e3, la pa y
  s\u1ebdn nong ziri t\u0169udm\u00e3 n k\u0269t t\u0269 yaa toog ne-y t\u0269 y wilg
  v\u1ebdeneg t\u0269 y saka s\u0269d t\u0169udm\u00e3 ye. B\u00e3ng-y v\u1ebdeneg
  t\u2019a Zeova s\u1ebdn yaa zak lugend\u00e3 ratame t\u0269 y moor\u00e3 y\u0269
  noog ne y buud\u00e3 neba. (Ef\u025b\u025bz r\u00e3mba 3:14, 15) La b\u00e3ng-y
  me t\u0269 y t\u00f5e n k\u0269tame t\u0269 y moor\u00e3 ne-b y\u0269 noog n paas
  ne manesem a taab s\u1ebdn tat W\u1ebdnnaam yam. T\u028bm-t\u028bmd a Poll wilga
  b\u0169mb ning s\u1ebdn segd n pak t\u00f5nd n y\u0269\u0269d\u00e3. A g\u028blsa
  woto: \u201cB\u0269 y mak n b\u00e3ng s\u1ebdn tat Zusoaba yam.\u201d\u2014Ef\u025b\u025bz
  r\u00e3mba 5:10.\\n12. R\u0269k-y makr s\u1ebdn wilgd b\u0169mb ning s\u1ebdn k\u0269t
  t\u0269 d segd n lak d mens ne rog-n-migs la tig nins s\u1ebdn yit ziri t\u0169udm\u00e3
  p\u028bg\u1ebd w\u00e3.\\n12 T\u00f5e t\u0269 y tagsdame t\u0269 tig\u00e3 s\u0269ngr
  pa tar loees ne b s\u1ebdn maand-b to-to r\u0169nd\u00e3-r\u0169nd\u00e3 w\u00e3
  ye. La bao n b\u00e3ng b s\u1ebdn s\u0269ng to-to w\u00e3 s\u0269d tara y\u00f5od
  b\u0269? N-ye! D r\u0269k makr ne y\u00e3mb s\u1ebdn na n y\u00e3 bombom s\u1ebdn
  d\u0269g r\u1ebdgd p\u028bg\u1ebd. Y\u00e3mb na sak n d\u0269k bombom k\u00e3ng\u00e3
  n mog s\u0269da? Ayo! A yaa r\u1ebdgdo. Wala bombom k\u00e3ng\u00e3, kibs r\u00e3mb\u00e3
  maaneg t\u00f5e n noomame, la b s\u1ebdn yit\u1ebd w\u00e3 yaa r\u1ebdgd z\u0129is\u1ebd.
  T\u00f5nd s\u00e3 n dat n sak t\u0169udum hak\u0269k\u00e3, d segd n tagsa wa no-r\u025b\u025bs
  a Ezai s\u1ebdn da yeel w\u1ebdn-t\u0169udb hak\u0269k\u00e3 t\u0269: \u201cRa s\u0269\u0269s-y
  b\u00f5n-d\u1ebdgd ye.\u201d\u2014Ezai 52:11.\\nD TALL YAM, D YEL-MANESM\u00c3 NE
  NEB A TAAB\u00c3 P\u01b2G\u1ebc\\n13. D s\u00e3 n pa maand tig\u00e3, t\u00f5e n
  waa ne zu-loe-b\u028bse?\\n13 Y s\u00e3 n y\u00e3k yam n pa na n maan tig\u00e3,
  t\u00f5e n waa ne zu-loeese. Wala makre, y t\u028bmd-n-taas\u00e3 t\u00f5e n sok-y-la
  b\u0169mb ning s\u1ebdn k\u0269t t\u0269 y\u00e3mb pa k\u1ebdesd y meng tig k\u1ebder
  p\u028bs\u1ebd y t\u028b\u028bm\u00e3 z\u0129ig\u1ebd w\u00e3. Yaa w\u00e3n to y\u1ebd,
  b s\u00e3 n k\u00f5 y\u00e3mb k\u0169un Now\u025bll\u00e3 tigr y\u0129nga? Yaa w\u1ebdng
  t\u0269 y sak-a b\u0269? La y\u00e3mb ne y k\u1ebded-n-taag\u00e3 t\u0169udum s\u00e3
  n pa yembre? Yaa w\u00e3n to me la y t\u00f5e n maan t\u0269 y kamb\u00e3 ra t\u1ebd
  t\u0269 b mongd-b-la b\u0169mbu, b s\u1ebdn pa maand tig\u00e3 y\u0129nga?\\n14,
  15. B\u00f5e la y t\u00f5e n maane, b s\u00e3 n p\u028b\u028bs-y ne y taab tigr
  daare, b\u0269 ned s\u00e3 n dat n k\u00f5 y\u00e3mb k\u0169un baraare?\\n14 R\u1ebdnda
  d tall yam n b\u00e3ng d s\u1ebdn na n maaneg yel-k\u00e3ens\u00e3 f\u00e3a p\u028bs\u1ebd.
  B s\u00e3 n p\u028b\u028bs y\u00e3mb ne y taab tigr daare, y t\u00f5eeme bal n p\u028b\u028bs
  a soab\u00e3 barka. La s\u00e3 n yaa ned y s\u1ebdn y\u00e3t wakat f\u00e3a b\u0269
  y t\u028bmd-n-taag n p\u028b\u028bs-y woto? S\u00e3 n yaa woto, y t\u00f5e n yeela
  s\u1ebdn y\u0269\u0269d bark\u00e3 p\u028b\u028bsgo. S\u1ebdn yaa to-to f\u00e3a,
  b\u0269 y gom ne g\u0169usgu. Biibl\u00e3 sagenda woto: \u201cB\u0269 y k\u0269t
  t\u0269 y\u00e3mb goama z\u0129nd bark wakat f\u00e3a n paam yamsem noom, la y b\u00e3ng
  s\u1ebdn zemse, n leok ned kam f\u00e3a.\u201d (Kolos r\u00e3mba 4:6) G\u0169us-y
  n da wa paoog neb a taaba ye. Wilg-y y\u00e3mb s\u1ebdn tagsd\u00e3 ne waoogre.
  Wilg-y v\u1ebdeneg t\u0269 y pa kis k\u0169uni, la tigim taab n d\u0269 ye, la t\u0269
  y nong\u1ebd-la r\u1ebd maaneg sasa a taaba.\\n15 La y na n maana w\u00e3n to, ned
  s\u00e3 n dat n k\u00f5 y\u00e3mb k\u0169uni? R\u1ebd f\u00e3a bee ne y\u025bl\u00e3
  s\u1ebdn yaa to-to. K\u00f5t\u00e3 t\u00f5e n yeelame: \u201cMam miime t\u0269 fo
  pa maand tigr\u00e3 ye. Ne r\u1ebd f\u00e3a, m dat n k\u00f5-f-la k\u0169un k\u00e3ng\u00e3.\u201d
  S\u00e3 n yaa woto, t\u00f5e t\u0269 y na n y\u00e3ka yam n sak k\u0169un\u00e3
  n get\u1ebd t\u0269 r\u1ebd yaa toor ne k\u1ebdes y meng tigr p\u028bg\u1ebd. La
  k\u00f5t\u00e3 s\u00e3 n pa mi y\u00e3mb t\u1ebdeb\u00e3, y t\u00f5eeme n kell n
  togs-a t\u0269 y\u00e3mb pa maand tig-k\u00e3ng\u00e3 ye. R\u1ebd na n s\u00f5ng-a
  lame t\u2019a b\u00e3ng b\u0169mb ning s\u1ebdn k\u0269t t\u0269 y sak n deeg k\u0169un\u00e3,
  la y yaool n pa k\u00f5t k\u0169un tigr daar\u00e3. La yaa yam b\u0169mb t\u0269
  y z\u00e3gs k\u0169un deegre, b s\u00e3 n k\u00f5 k\u0169un\u00e3, n dat n wilg
  v\u1ebdeneg t\u0269 y\u00e3mb pa g\u00e3d y t\u1ebdeb\u00e3, b\u0269 t\u0269 y\u00e3mb
  na n sak n k\u0269\u0269sa y t\u1ebdeb\u00e3 s\u1ebdn na y\u0269l n paam k\u0169uni.\\nMANESEM
  B\u01b2G LA Y NA N TALL NE Y ZAK\u00c3 NEBA?\\n16. W\u00e3n to la d t\u00f5e n tall
  yam la d maan g\u0169usg tig\u00e3 y\u025bl p\u028bg\u1ebd?\\n16 B\u00f5e la y t\u00f5e
  n maane, y zak\u00e3 neb s\u00e3 n pa tar t\u1ebdeb a yembr ne y\u00e3mba? Ka me
  b\u0269 y maan g\u0169usg ne y goam\u00e3. Pa tar y\u00f5od t\u0269 y w\u1ebd no-koeemd
  minung b\u0269 tigr f\u00e3a y\u00e3mb roagdb\u00e3 s\u1ebdn dat n maan poor\u1ebd
  ye. Ned f\u00e3a ne a tagsgo. Tall-y waoogr ne b\u00e3mb tagsg\u00e3 wa y s\u1ebdn
  dat t\u0269 b\u00e3mb me tall waoogr ne y\u00e3mb r\u1ebdnd\u00e3. (Mat\u0269e 7:12)
  Lak-y y meng ne t\u028b\u028bm buud f\u00e3a s\u1ebdn naagd y\u00e3mb tigr\u00e3
  p\u028bg\u1ebd. La s\u00e3 n yaa ne y\u025bl s\u1ebdn pa t\u0269 loe ne tigr\u00e3
  maaneg meng-menga, b\u0269 y ra y\u0269 dem-dem ye. B\u0169mb s\u1ebdn be, yaa t\u0269
  wakat f\u00e3a y na n g\u0169usame n tall manesem s\u1ebdn na n k\u0269t t\u0269
  y kell n tall s\u0169ur-kaset s\u1ebdn yaa s\u00f5ma.\u20141 T\u0269mote 1:18, 19.\\n17.
  W\u00e3n to la y t\u00f5e n s\u00f5ng y kamb\u00e3 t\u0269 b ra tags t\u0269 y mongd-b-la
  b\u0169mbu, b s\u1ebdn ne neb a taab\u00e3 t\u0269 b maand tig\u00e3 y\u0129nga?\\n17
  W\u00e3n to la y t\u00f5e n s\u00f5ng y kamb\u00e3 t\u0269 b ra wa tags t\u0269
  b mongd-b-la b\u0169mbu, b s\u1ebdn pa maand tigr s\u1ebdn k\u0269\u0269sd Biibl\u00e3
  y\u0129nga? Bee ne y\u00e3mb s\u1ebdn maand b\u0169mb ning y\u028b\u028bmd\u00e3
  sasa a taab\u00e3 me. Roagdb k\u1ebder y\u00e3kda sasa n k\u00f5t b kamb\u00e3 k\u0169uni.
  K\u0169un nins s\u1ebdn yaa s\u00f5ma n y\u0269\u0269d y\u00e3mb s\u1ebdn t\u00f5e
  n k\u00f5 y kamb\u00e3 a yembr yaa y s\u1ebdn na n d\u0269k y s\u1ebdk\u00e3 n ges
  b yell ne nonglem.\\nT\u0168-Y S\u0196D T\u0168UDM\u00c3\\n18. W\u00e3n to la kiris-neb
  tigiss\u1ebd w\u00e3 k\u1ebdnd t\u00f5e n s\u00f5ng-y t\u0269 y wilg v\u1ebdeneg
  t\u0269 y saka s\u0269d t\u0169udm\u00e3?\\n18 S\u1ebdn na y\u0269l n ta W\u1ebdnnaam
  yam, y segd n z\u00e3gsa ziri t\u0169udm\u00e3 la y sak s\u0269d t\u0169udm\u00e3.
  Woto baooda b\u00f5e maaneg me? Biibl\u00e3 yetame: \u201cB\u0269 t\u00f5nd t\u1ebdeg
  taab yelle la d yik taab ratem t\u0269 maan nonglem la t\u028b\u028bm s\u00f5ama.
  B\u0269 d da bas taab tiging wa neb k\u1ebder s\u1ebdn maanda ye. La b\u0269 d sagl
  taaba, la b\u0269 d sagl n y\u0269\u0269da t\u00f5nd s\u1ebdn y\u00e3 t\u0269 daar
  kolgdame w\u00e3 y\u0129nga.\u201d (Hebre d\u00e3mba 10:24, 25) Kiris-neb tigiss\u00e3
  yaa s\u0169-noog sasa n k\u00f5 y\u00e3mb t\u0269 y na n balem W\u1ebdnnaam wa a
  s\u1ebdn dat\u00e3. (Y\u0269\u0269l S\u00f5amy\u00e3 22:23; 122:1) Tigis-k\u00e3ens
  sasa, kiris-neb hak\u0269k\u00e3 paamda raood b t\u1ebded-n-taasa neng\u1ebd.\u2014Rom
  d\u00e3mba 1:12.\\n19. B\u00f5e y\u0129ng t\u0269 tar y\u00f5od t\u0269 y togs neb
  a taab\u00e3 y\u025bl nins y s\u1ebdn z\u00e3ms Biibl\u00e3 p\u028bg\u1ebd w\u00e3?\\n19
  B\u0169mb a to y s\u1ebdn t\u00f5e n maan n wilg v\u1ebdeneg t\u0269 y saka s\u0269d
  t\u0169udm\u00e3 yaa y s\u1ebdn na n togs neb a taab\u00e3 y\u00e3mb s\u1ebdn b\u00e3ng
  b\u0169mb nins Biibl\u00e3 p\u028bg\u1ebd a Zeova Kaset r\u00e3mb\u00e3 s\u1ebdn
  z\u00e3ms y\u00e3mb\u00e3. Neb w\u028bsg s\u0269d \u2018w\u00f5osdame n y\u00e3bd\u2019
  b\u00f5n-w\u1ebdns nins s\u1ebdn maand d\u0169niy\u00e3 zug r\u0169nd\u00e3-r\u0169nd\u00e3
  w\u00e3 y\u0129nga. (Ezek\u0269\u025bll 9:4) T\u00f5e t\u0269 y mii neb k\u1ebder
  s\u1ebdn w\u00f5osd n y\u00e3bd woto. B\u00f5e y\u0129ng t\u0269 y pa na n togs-b
  y saagr\u00e3 s\u1ebdn tik Biibl\u00e3 zug\u00e3? Y s\u00e3 n lagemd ne kiris-neb
  hak\u0269k\u00e3 la y togsd neb a taab\u00e3 s\u0269d k\u00e3sems nins y s\u1ebdn
  z\u00e3ms Biibl\u00e3 p\u028bg\u1ebd w\u00e3, bilf-bilfu y na n y\u00e3ame t\u0269
  y pa leb n dat n maan ziri t\u0169udm\u00e3 y\u025bl ye. B\u00e3ng-y t\u0269 y s\u00e3
  n wilg v\u1ebdeneg t\u0269 y saka s\u0269d t\u0169udm\u00e3, y na n paama s\u0169-noog
  la bark w\u028bsgo.\u2014Malaki 3:10.\\n^ sull 9 B\u0169mb a to me n k\u0269t t\u0269
  b y\u00e3k y\u028b\u028bm-sar kiuug rasem 25 w\u00e3. Yaa tigr s\u1ebdn boond t\u0269
  Saturnall\u00e3 Rom d\u00e3mb\u00e3 s\u1ebdn da maand y\u028b\u028bm-sar kiuug rasem
  17 n t\u0269 ta 24, n na n waoog b koob w\u1ebdnnaam\u00e3. Saturnall\u00e3 ra yaa
  r\u0269-b\u025bda, y\u00f5-noogre, la k\u00f5 taab k\u0169uni.\"", "\"Minist\u025b\u025br
  ning s\u1ebdn get kaoreng\u00e3 la buud\u00e3 goam taoor na k\u1ebdng yell sigla
