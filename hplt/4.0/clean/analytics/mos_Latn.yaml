  y\u025bl\u00e3 v\u00f5or s\u00f5ma, la m b\u00e3ng m s\u1ebdn da segd n maanega.
  Mam s\u1ebdn da moond ko\u025b\u025bg\u00e3 w\u028bsg\u00e3 k\u0269tame t\u0269
  m yam\u00e3 maneg n k\u1ebd koe-mooneg\u00e3. M wa n y\u00e3ka yam n dat n lebg
