  l\u028b\u0269tb t\u028b\u028bm Ghana Institute of Management and Public Administration
  (GIMPA) la a paama a dipl\u00f4me s\u1ebdn k\u1ebded ne kareng\u00e3 s\u1ebdn k\u1ebded
  n na n paam a dipl\u00f4me y\u028b\u028bmde 2016 Valley View University, Oyibi.[1][2][3]\\nA
  Tijani yaa karen-saamb ne a t\u028b\u028bmde. A yaa karen-saamb Yendi Sek\u00f5or
  s\u1ebdn be y\u028b\u028bmde 1995 n t\u00e3ag 1997. la a z\u0129nda Ghana kar\u1ebdn-biis\u00e3
