  B\u0269 d ges makr a w\u00e3na.\\nYIMAAS R\u00c3MB\u00c3 B\u0196 B\u00d5N-NAANDS\u00c3
  P\u01b2\u01b2SGO, LA YAAB R\u00c3MB\u00c3 S\u1ebcN KI W\u00c3 BALENGO\\n3. a) B\u00f5e
  la Biibl\u00e3 yet t\u0169nug ne b\u00f5n-naands n p\u028b\u028bs\u00e3 w\u025b\u025bng\u1ebd,
