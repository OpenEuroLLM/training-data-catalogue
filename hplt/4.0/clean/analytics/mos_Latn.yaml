  k\u0269t t\u0269 d w\u00f5nd taaba. D f\u00e3a s\u1ebdn dat yaa kell n y\u0269 so-pakdba,
  la d maan d s\u1ebdn t\u00f5e f\u00e3a W\u1ebdnnaam t\u028b\u028bmd\u00e3 p\u028bg\u1ebd.
  D wa n k\u1ebde k\u00e3adem. M ma ne m baaba, la d roagdb a taab n wa t\u00f5nd
  k\u00e3adm\u00e3 kibs\u1ebd, hal t\u0269 m s\u0169ur y\u0269 noogo.\\nT\u00f5nd
  k\u00e3adm\u00e3 poore, d naaga taab n y\u0269 wakat f\u00e3a so-pakdba. La r\u1ebd
