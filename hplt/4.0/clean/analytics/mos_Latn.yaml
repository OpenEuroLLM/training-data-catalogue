sample: '["\"L\u0269slaoong\u00e3. Toagsg s\u1ebdn k\u028b\u028bg koeega s\u1ebdn
  wilgd L\u0269slaoong\u00e3 weeng\u1ebd, wala a s\u1ebdn wa Alk\u028br\u00e3an wagell\u00e3
  la Nabiyaam\u00e3 s\u0169nn\u00e3h p\u028bga\\nAuteur :\\nNe W\u1ebdnd Y\u028b\u028br\u00e3
  Albarka, s\u1ebdn ya \u0251 D\u0169ni yols z\u00e3ng naab\u00e3, n leb ya \u0251
  S\u0269d-k\u00f5atb\u00e3 welg n yols naab\u00e3\\nL\u0269slaoong\u00e3.\\nToagsg
  s\u1ebdn k\u028b\u028bg koeega s\u1ebdn wilgd L\u0269slaoong\u00e3 weeng\u1ebd,
  wala a s\u1ebdn wa Alk\u028br\u00e3an wagell\u00e3 la Nabiyaam\u00e3 s\u0169nn\u00e3h
  p\u028bga\\n( yiisg (Kop\u0269) b s\u1ebdn n y\u00e3k daliil-r\u00e3mb\u00e3 n\u0251se
  )\\nYaa gaf s\u1ebdn be s\u028bka, a g\u0169bg\u0251 w\u0129nig-r\u00e3mb\u0251
  s\u1ebdn k\u028b\u028bg keoog\u0251 n w\u0129ngd L\u0269sl\u0251oong\u00e3 s\u1ebdn
  y\u0251\u0251 \u0251 so\u0251ba, n v\u1ebdnegd a y\u1ebdg nins s\u1ebdn t\u028bg
  n pak n y\u0269\u0269da, la a s\u0251gls\u00e3, l\u0251 \u0251 s\u00f5mblem\u00e3,
  n y\u00f5nged n yit a tigsg nins s\u1ebdn yaa y\u1ebdg\u00e3, y\u1ebdnd\u0251 me
  la Alk\u028br\u00e3an wagell\u00e3 la Nabiyaam\u00e3 S\u0169nnah, la gaf\u00e3 a
  togend\u0251 \u0160ari t\u028b\u028bma s\u1ebdn zao b r\u00e3mb f\u00e3a gilli (B\u0251\u0251ligs\u00e3)
  s\u1ebdn yaa b l\u0269slaamba la s\u1ebdn ka b l\u0269slaamba, ne b\u00e3mb\u00e3
  buud\u00e3 goam, b s\u1ebdn be z\u0129ig ning f\u00e3a la z\u00e3maan ning f\u00e3a,
  b yel\u00e3 l\u0251 b \u0251lh\u0251\u0251l\u00e3 s\u1ebdn t\u028bg n y\u00f5s taab
  f\u00e3a gilli.\\n1- L\u0269slaoong\u00e3 yaa W\u1ebdnd t\u1ebdn-t\u028bmde n t\u028bg
  neb\u00e3 f\u00e3a gill neng\u1ebd, r\u1ebdnd y\u1ebdnda la W\u1ebdnd t\u1ebdn-t\u028bmd
  ning\u00e3 s\u1ebdn duumd\u00e3.\\n2-La l\u0269slaoong\u00e3 ka d\u0129in s\u1ebdn
  welge n k\u00f5 buud toore maa neb toor ye, ad a yaa W\u1ebdnd d\u0129in n k\u00f5
  neb\u00e3 f\u00e3a gill kiap.\\n3- L\u0269slaoong\u00e3 la W\u1ebdnd t\u1ebdn-t\u028bmd
  ning\u00e3 s\u1ebdn wa n pids nabiyaam-r\u00e3mb\u00e3 la t\u1ebdn-t\u028b\u028bmb\u00e3
  s\u1ebdn reng taoore t\u1ebdn-t\u028bm\u00e3, t\u0269 t\u028bg b neb\u1ebd w\u00e3
  p\u028b\u028bsg la t\u0269lgr be b y\u0129nga.\\n4-Nabiyaam-r\u00e3mb\u00e3, -t\u0269lgr
  be b y\u0129nga- b d\u0129in\u00e3 yaa a yembr t\u00e3a la b t\u0169udm\u00e3 soya
  y\u00f5sa taaba.\\n5-L\u0269slaoong\u00e3 boondame n t\u028bgd\u1ebd wala nabiyaam-r\u00e3mb\u00e3
  f\u00e3a s\u1ebdn bool\u00e3, a Nuuh la a \u026dbraah\u0269\u0269m la a Musa la
  a S\u028blaymaan la a Daaw\u028b\u028bd la a Isa -t\u0269lgr be b zugu- n t\u028bgd
  s\u0269d-k\u0169uni (l\u0269\u0269maoongo) t\u0269 ad Soab\u00e3, y\u1ebdnd\u00e3
  la W\u1ebdnde, s\u1ebdn ya\u0251 Naand\u00e3, n ya\u0251 R\u0269lgd\u00e3, s\u1ebdn
  v\u0269\u0269msd\u0251 la A k\u028b\u028bd\u00e3, s\u1ebdn ya\u0251 Naam\u00e3 Soaad\u00e3,
  Y\u1ebdnd\u00e3 me n r\u0251bsd yel\u00e3, Y\u1ebd me ya\u0251 nimb\u00e3an-Zoata,
  n ya a Yolsda.\\n6- W\u1ebdnde, A Naam y\u0269lgame, Y\u1ebdnda la Naand\u00e3,
  Y\u1ebd n s\u00f5mb ne t\u0169udm\u00e3 Y\u1ebd a yembr t\u00e3a, la b ra t\u028bg
  n t\u0169 n lagem-A z\u1ebdng s\u1ebdn ka Y\u1ebd ye.\\n7- W\u1ebdnd la Naanda b\u0169mb
  ning\u0251 s\u1ebdn be d\u0169ni w\u00e3 f\u00e3\u0251 p\u028bg\u1ebd, t\u00f5nd
  s\u1ebdn ne la d s\u1ebdn pa ne w\u00e3, la z\u1ebdng s\u1ebdn ka Y\u1ebd f\u00e3\u0251
  yaa b\u00f5n-naandega s\u1ebdn be A b\u00f5n-naands\u00e3 p\u028bg\u1ebd, l\u0251
  W\u1ebdnd n\u0251\u0251n\u0251 saas\u00e3 la t\u1ebdng\u00e3 rasem a yoob p\u028bg\u1ebd.\\n8-
  La W\u1ebdnde, A Naam y\u0269lgame n z\u1ebdke, A ka tar lagem-n-taaga A Naam\u1ebd
  w\u00e3 maa A naaneg\u1ebd w\u00e3 ye, maa A rabsdg\u1ebd w\u00e3 maa A t\u0169udm\u1ebd
  w\u00e3.\\n9- La W\u1ebdnde, A Naam y\u0269lgame, A ka roge, b ka rog-A, A ka tar
  mams-n-taaga, A ka tar bils-n-taaga.\\n10- La W\u1ebdnde, A Naam y\u0269lgame n
  z\u1ebdke, A ka sigd b\u0169mb p\u028bg\u1ebd ye, A ka lebd b\u0169mb me n r\u0269k
  \u0251 y\u0129ng ye, s\u1ebdn y\u0251\u0251 b\u0169mb ning f\u00e3\u0251 s\u1ebdn
  be A b\u00f5n-n\u0251\u0251nds\u1ebd w\u00e3:\\n11- W\u1ebdnde, A Naam y\u0269lgame
  n z\u1ebdke, A yaa nimb\u00e3an-Zoeta n yaa Yoalsda ne A yembs\u00e3, r\u1ebd n
  k\u0269t t''A t\u028bm t\u1ebdn-t\u028b\u028bmb\u00e3, la A sik Gaf-r\u00e3mb\u00e3.\\n12-
  W\u1ebdnd la \u0251 Soab\u00e3 s\u1ebdn yaa Yolsd\u00e3, Y\u1ebdnd A Yembr t\u00e3a
  n na n geel yembs\u00e3 D\u0169ni w\u00e3 yikr raar\u00e3, wakat ning A s\u1ebdn
  na n yik-b f\u00e3a b yaad\u1ebd w\u00e3, n rol ned f\u00e3a a s\u1ebdn t\u028bm\u00e3,
  s\u00f5ma la w\u1ebdnga. R\u1ebdnd ned ning s\u1ebdn t\u028bma t\u028b\u028bm s\u00f5me
  t''\u0251 yaa s\u0269d-k\u00f5ta r\u1ebdnd y\u1ebd soab tara neema s\u1ebdn duumd\u00e3,
  la ned ning s\u1ebdn k\u0269fla la a t\u028bm w\u1ebdnga, y\u1ebd tara n\u0251ng
  s\u1ebdn yaa bedre, yaoolem raar\u00e3.\\n13- W\u1ebdnde, A Naam y\u0269lgame n
  z\u1ebdke, A naana a Adama ne tom, n maan \u0251 koamb\u00e3 t\u0269 b f\u0269\u0269gd\u1ebd
  r\u1ebd loogr poor\u1ebd, r\u1ebdnd neb\u00e3 f\u00e3a gilli, b y\u1ebdgr\u00e3
  yaa yembre, y\u0269\u0269dlem ka be ne buudu, buud a to zug ye, ka be ne neb me,
  neb a taab zugu, s\u00e3 n ka ne W\u1ebdn-zoeeg bala.\\n14- La biig f\u00e3a rogda
  F\u0269tr\u00e3 w\u00e3 (d\u0129in\u00e3) zugu.\\n15- La ned ka be ninsaalb\u00e3
  p\u028bg\u1ebd n rogd\u1ebd t''a yaa tudgda, maa a r\u0269k a to tudgdr faad ye:\\n16-
  La neb\u00e3 naaneg\u00e3 v\u00f5or yaa: W\u1ebdnd t\u0169ud\u0169m y\u0129ng\u0251
  Y\u1ebd A Yembre:\\n17- L\u0269slaoong\u00e3 waooga ninsaala- b raopa la pagba-
  la a leb k\u00f5-a a hake-r\u00e3mb gilli, la a maan-a t\u0269 b na n sok-a a s\u1ebdn
  t\u0169us yel nins\u00e3 f\u00e3a gilli la a t\u028b\u028bm\u00e3 f\u00e3a gilli
  la a m\u0251nesm\u00e3 f\u00e3\u0251, l\u0251 sokd-a t\u028b\u028bm ning f\u00e3\u0251
  s\u1ebdn namsd a meng\u00e3, maa s\u1ebdn namsd neb a taab\u00e3.\\n18- La L\u0269slaoong\u00e3
  maana raoa la pag\u0251 t\u0269 b yaa yembre, s\u00e3 n yaa ne t\u028b\u028bm\u00e3
  weeng\u1ebd, la rolb\u00e3 la yel-s\u00f5md\u00e3 weeng\u1ebd\\n19- L\u0269slaoong\u00e3
  waooga paga, la a maan t\u0269 pagb\u00e3 b yaa raopa bo\u0251g\u0251, la a rogl
  rao\u00e3 t''a r\u0269lg-\u0251 t''a s\u00e3 n yaa t\u00f5oda, r\u1ebdnd bi-pugl
  r\u0269lgre y\u0251\u0251 t\u0269l\u0251e n zao a ba w\u00e3, t\u0269 ma w\u00e3
  r\u0269lgr zao a biig\u00e3 t''a s\u00e3 n yaa k\u00e3sma n tar t\u00f5ogo, t\u0269
  pag r\u0269lgr zao a s\u0269d\u00e3.\\n20- La k\u0169um\u00e3 ka y\u1ebdnda la seeb
  ning s\u1ebdn duumd\u0251 ye, \u0251yo ad a yaa tedgre, n na n yi t\u028b\u028bm
  zak\u1ebd n k\u1ebdng rolb zak\u1ebd, la k\u0169um\u00e3 a r\u0269kda y\u0129ng\u00e3
  la y\u00f5or\u00e3 f\u00e3a, la y\u00f5or\u00e3 k\u0169um yaa a s\u1ebdn na wa welg
  n bas y\u0129ng\u00e3, r\u1ebd poor\u1ebd t''\u0251 lebgd n wa \u0251 y\u0129ng\u1ebd
  w\u00e3 b s\u1ebdn wat n yik neb\u00e3 poore d\u0169ni yikr raar\u00e3, l\u0251
  y\u00f5or\u00e3 p\u0251 toemd k\u0169um\u0251 poore n long y\u0129ng \u0251 to ye,
  \u0251 leb n p\u0251 k\u1ebded y\u0129ng \u0251 to ye.\\n21-L\u0269slaoong\u00e3
  boondame n t\u028bg t\u0269 b k\u00f5 s\u0269da ne l\u0269\u0269maoong\u00e3 (k\u00f5-s\u0269d\u00e3)
  y\u1ebdga s\u1ebdn yaa bed-beda, b\u00e3mb me la k\u00f5-s\u0269d ne W\u1ebdnde
  la malegs\u00e3 la W\u1ebdnd Gaf-r\u00e3mb\u00e3, wala Tawraat\u00e3 la Lingiil\u00e3
  la Zab\u028b\u028br\u00e3 - taoor t\u0269 b na n ka toeem-ba - la Alk\u028br\u00e3an\u00e3,
  la k\u00f5 s\u0269da ne Nabiyaam-r\u00e3mb\u00e3 f\u00e3a la T\u1ebdn-t\u028b\u028bmb\u00e3,
  t\u0269lgr be b y\u0129nga, la \u0251 leb n k\u00f5 s\u0269da ne b Pidsda, y\u1ebd
  me l\u0251 a M\u028bhammad s\u1ebdn yaa W\u1ebdnd T\u1ebdn-t\u028b\u028bm\u00e3,
  s\u1ebdn yaa Nabiyaam-r\u00e3mb\u00e3 la t\u1ebdn-t\u028b\u028bmb\u00e3 Pidsda.
  La \u0251 k\u00f5 s\u0269d ne Yaoolem raar\u00e3. La d b\u00e3ng t\u0269 ad d\u0169ni
  v\u0269\u0269m\u00e3, s\u00e3 n da yaa y\u1ebd la teka; mikdame t\u0269 v\u0269\u0269m\u00e3
  la belm\u00e3 yaa b\u0169mb s\u1ebdn yaa reem bala. La d leb n k\u00f5 s\u0269da
  ne B\u028b\u028bd\u00e3 la P\u028bleng\u00e3.\\n22- La nabiyaam-r\u00e3mb\u00e3
  -t\u0269lgr be b y\u0129nga- b g\u0169-b lame n yi tudgri b\u0169mb ning f\u00e3a
  b s\u1ebdn taasd\u00e3 p\u028bg\u1ebd t\u0269 yi W\u1ebdnd neng\u1ebd w\u00e3, b
  leb n g\u0169-b lame n yi tudgri s\u1ebdn k\u1ebded ne b\u0169mb f\u00e3a s\u1ebdn
  y\u00f5sg yam maa z\u028bg-s\u00f5ngo, la nabiyaam-r\u00e3mb\u00e3, b rogl-b lame
  t\u0269 b taas W\u1ebdnd sagls\u00e3 A yembs\u1ebd w\u00e3. La nabiyaam-r\u00e3mb\u00e3
  b ka tar baa f\u028b\u0269 s\u1ebdn yaa wala R\u028bb\u028b\u028bb\u0269ya ( W\u1ebdndlem)
  maa \u01b2l\u028b\u028bh\u0269ya ( Sobendem). Ka woto ye, b\u00e3mb yaa y\u0129ng
  r\u00e3mb bala, n w\u00f5nd neb\u00e3 f\u00e3a gilli, t\u0269 W\u1ebdnd t\u028bmsd
  t\u0269 k\u1ebdngd b neng\u1ebd ne A t\u1ebdn-t\u028bm\u00e3.\\n23-La l\u0269slaoong\u00e3
  boondame n t\u028bgd W\u1ebdnd t\u0169ubu, A Yembre, ne t\u0169ud-r\u00e3mb\u0251
  y\u1ebdg s\u1ebdn yaa b bed\u00e3, b\u00e3mb me: la P\u028b\u028bsg\u00e3, s\u1ebdn
  yaa yasgo, la surbu (Ruku), la suguudu la W\u1ebdnd Y\u028b\u028br t\u1ebdegre,
  la A p\u1ebdgbo la kosgo, ninsaal p\u028b\u028bsd-a la raar f\u00e3a noor a nu,
  t\u0269 y\u0269\u0269d-taab\u00e3 f\u00e3a se a p\u028bg\u1ebd, r\u1ebdnd rak\u00e3agre
  la talga la naaba la s\u1ebdn ka naaba, f\u00e3a bee rulg a yembr zugu P\u028b\u028bsg\u00e3
  p\u028bg\u1ebd. La Zaka, y\u1ebd me yaa s\u00f5or s\u1ebdn yaa bilfu s\u1ebdn yi
  arzek\u1ebd w\u00e3, n zems ne sart-r\u00e3mba, la s\u00f5or ning\u00e3 W\u1ebdnd
  s\u1ebdn y\u00e3ke, t\u0269 yaa t\u0269lae n be rak\u00e3agb\u00e3 arzegs\u1ebd,
  t\u0269 b yiisd n k\u00f5t talse la z\u1ebdng s\u1ebdn ka b\u00e3mb\u00e3. Yaa vugr
  t\u00e3a y\u028b\u028bm p\u028bg\u1ebd. La No-loeer\u00e3, y\u1ebd me la y\u00f5k-m-menga
  n yi b\u00f5n-kaood\u0269 Ramadaan\u00e3 kiuug w\u0129ntoog\u00e3 p\u028bg\u1ebd,
  t\u0269 yaa b\u0169mb s\u1ebdn wubd y\u00f5or\u00e3 ne raabo la sugri. La Hagiimd\u00e3,
  y\u1ebd me la W\u1ebdnd Roog\u00e3 toglgo, s\u1ebdn be Mak t\u1ebdn-wagell\u00e3
  p\u028bg\u1ebd, vugri y\u00f5or\u00e3 woglem p\u028bg\u1ebd, t\u0269 rog s\u1ebdn
  yaa t\u00f5ogda, n t\u00f5e n k\u1ebdnge, la hagiimd\u00e3 p\u028bg\u1ebd, neb\u00e3
  f\u00e3a zemsda taaba togle n t\u028bg Naand\u00e3 neng\u1ebd w\u00e3 -A Naam y\u0269lgame-
  t\u0269 y\u0269\u0269dlem\u00e3 s\u1ebdn welgd neb\u0251 ne t\u0251\u0251b\u0251
  la y\u1ebdg\u00e3 f\u00e3a menemda been\u1ebd n lebg b\u0169mb a yembre.\\n24-La
  b\u0169mb s\u1ebdn yaa z\u0269sg n y\u0269\u0269d s\u1ebdn welgd t\u0169ud-r\u00e3mb\u00e3
  l\u0269slaoong\u00e3 p\u028bg\u1ebd t''\u0251 y\u0269\u0269d \u0251 t\u0251\u0251b\u0251,
  yaa t''a yal\u1ebd w\u00e3 la a wakat-r\u00e3mb\u00e3 la sart-r\u00e3mb\u00e3, y\u0251\u0251
  W\u1ebdnd n maan-ba, A Naam y\u0269lgame n z\u1ebdke, la A s\u1ebdn taas A T\u1ebdn-t\u028b\u028bm\u00e3,
  W\u1ebdnd p\u028b\u028bsg la A t\u0269lgr be a y\u0129nga, t\u0269 ninsaalb\u00e3
  ka k\u1ebdes b toaag a p\u028bg\u1ebd, zem t\u0269 yaa paasgo maa boogre, n wa t\u00e3ag
  r\u0169nda, la t\u0169ud-k\u00e3ens\u00e3 f\u00e3a gill s\u1ebdn yaa bed-beda, t\u1ebdn-t\u028b\u028bmb\u00e3
  f\u00e3a boolame n t\u028bg-a, t\u0269lgr be b y\u0129nga.\\n25-L\u0269slaoong\u00e3
  T\u1ebdn-t\u028b\u028bm\u00e3, y\u1ebd la a M\u028bhammad s\u1ebdn yaa a Abd\u028bllaah
  biiga, n yi a \u026dsmaa''\u02bf\u0269\u0269l s\u1ebdn yaa a \u026dbraah\u0269\u0269m
  biig\u00e3 pend\u1ebd, p\u028b\u028bsg la t\u0269lgr be b y\u0129nga, a roga Maka,
  y\u028b\u028bm 571, nabi Iisa rogm\u00e3 poor\u1ebd, b t\u028bms-a lame t''a be
  Maka, t''a yik r\u1ebd poor\u1ebd n k\u1ebdng Madiina, la a ka lagem a neb\u00e3
  r\u028bbs\u00e3 t\u0169ub yel\u1ebd ye, la a rag n y\u0269\u0269me n lagemd-ba t\u028b\u028bm
  s\u00f5mbs a taaba s\u1ebdn yaa wagl\u00e3 p\u028bg\u1ebd, a rag n y\u0269\u0269me
  n be z\u028bgd s\u1ebdn yaa z\u0269sd p\u028bg\u1ebd, taoor t\u0269 b na n ka t\u028bms-a
  ye. La a neb\u00e3 rag n y\u0269\u0269me n da boond-a t''a amiin (bas-m-yam soaba).
  W\u1ebdnd t\u028bms-a lame a s\u1ebdn wa n ta y\u028b\u028bm pis naase (40). La
  W\u1ebdnd kenga a booll\u00e3 ne tagmas-r\u00e3mba (yel soalem-r\u00e3mba) s\u1ebdn
  yaa z\u0269sdo, la s\u1ebdn t\u028bg n y\u0269\u0269da yaa Alk\u028br\u00e3an wagell\u00e3,
  y\u1ebd me la nabiyaam-r\u00e3mba tagmas-r\u00e3mb z\u0269slem s\u1ebdn t\u028bg
  n y\u0269\u0269da, y\u1ebd me la tagmas nins s\u1ebdn pa, s\u1ebdn yi nabiyaam-r\u00e3mb\u00e3
  tagmas-r\u00e3mb\u1ebd, n na n t\u028bg n t\u00e3ag r\u0169nda. La W\u1ebdnd s\u1ebdn
  wa n t\u028bg n pids d\u0129in\u00e3 n k\u00f5-a w\u00e3, t\u0269 N\u0251biy\u0251\u0251m\u00e3
  t\u0251\u0251s-\u0251 t\u0251\u0251sg tek\u00e3, \u0251 m\u0251\u0251n\u0251 k\u0251\u0251lem
  t''\u0251 y\u028b\u028bm\u0251 y\u0251\u0251 pis-yoob l\u0251 \u0251 t\u00e3\u0251bo,
  l\u0251 b mu-m\u0251 l\u0251 M\u0251diin s\u1ebdn y\u0251\u0251 N\u0251biy\u0251\u0251m\u00e3
  t\u1ebdng\u00e3, l\u0251 T\u1ebdn-t\u028b\u028bm\u0251 \u0251 M\u028bh\u0251mm\u0251d
  p\u028b\u028bsg l\u0251 t\u0269lgr be \u0251 y\u0129ng\u0251 y\u1ebd l\u0251 n\u0251biy\u0251\u0251m-d\u00e3mb\u0251
  l\u0251 t\u1ebdn-t\u028b\u028bmb\u00e3 Pidsd\u0251, W\u1ebdnd t\u028bms-\u0251 l\u0251
  ne k\u00e3ndgre l\u0251 s\u0269d d\u0129in\u00e3 b\u028bl y\u0129ng t''\u0251 yiis
  neb\u00e3 r\u028bbs\u00e3 l\u0251 k\u0269flm\u00e3 l\u0251 z\u0269\u0269lm\u00e3
  ligs\u00e3, n t\u028bg W\u1ebdnd-yembg\u00e3 l\u0251 s\u0269d-k\u0169un\u0251 v\u1ebdenem,
  l\u0251 W\u1ebdnd m\u0251\u0251n\u0251 k\u0251set t\u0269 \u0251d A t\u028bms-\u0251
  l\u0251me t''\u0251 y\u0251\u0251 boond\u0251 n t\u028bg A neng\u1ebd ne Y\u1ebd
  t\u00f5ogo.\\n26-La l\u0269slaoong\u00e3 \u0160ari w\u00e3 T\u1ebdn-t\u028b\u028bm
  a M\u028bhammad W\u1ebdnd p\u028b\u028bsg la A t\u0269lgr be a y\u0129nga s\u1ebdn
  w\u0251 ne-\u0251 w\u00e3, yaa y\u1ebdnd n pidsd W\u1ebdnd t\u1ebdn-t\u028bm\u00e3
  l\u0251 A \u0160ari-r\u00e3mba, y\u1ebd me l\u0251 \u0160ari s\u1ebdn pidi, neb\u00e3
  d\u0129in\u00e3 la b d\u0169ni w\u00e3 me manegr be a p\u028bg\u1ebd, y\u1ebd me
  g\u0169usda: neb\u00e3 b d\u0129in-r\u00e3mba la b z\u0269-r\u00e3mba la b arzegs\u00e3
  la b yam\u00e3 la b koamb\u00e3, y\u1ebd me n y\u1ebdes \u0160ari f\u00e3a s\u1ebdn
  reng taoore, wala \u0160ari-r\u00e3mb nins me s\u1ebdn da reng taoor\u00e3 s\u1ebdn
  y\u1ebdes taab\u00e3.\\n27- La W\u1ebdnde, A Naam y\u0269lgame n z\u1ebdke, a ka
  reegd d\u0129in s\u00e3 n ka l\u0269slaoong\u00e3 d\u0129in ye, ning T\u1ebdn-t\u028b\u028bm\u00e3
  a M\u028bhammad W\u1ebdnd p\u028b\u028bsg la A t\u0269lgr be a y\u0129nga, s\u1ebdn
  wa ne w\u00e3. La ned ning s\u1ebdn wa n t\u028bg n k\u1ebd z\u1ebdng s\u1ebdn ka
  l\u0269slaoong\u00e3, A ka na n tol n reeg a y\u0129ng ye.\\n28- Alk\u028br\u00e3an
  wagell\u00e3, y\u1ebdnda la gaf ning W\u1ebdnd s\u1ebdn t\u028bms-a n t\u028bg T\u1ebdn-t\u028b\u028bm\u00e3
  \u0251 M\u028bh\u0251mm\u0251d neng\u1ebd w\u00e3 p\u028b\u028bsg l\u0251 t\u0269lgr
  be \u0251 y\u0129ng\u0251, y\u1ebdnda me yaa bon-naands Naaba goama, W\u1ebdnd geesa
  ninsaalb\u00e3 la z\u0129n-r\u00e3mba t\u0269 b wa ne a buudu, maa S\u028b\u028bra
  s\u1ebdn w\u00f5nd a s\u028b\u028br\u0251-r\u00e3mb\u0251 buud bala, la geesg\u00e3
  ka bak n ket n be n t\u00e3ag r\u0169nda, la b ka t\u00f5og n wa ne-a ye. La Alk\u028br\u00e3an
  wagell\u00e3, a loegsda sogsg w\u028bsgo, s\u1ebdn yirb neb tus-k\u1ebdems w\u028bsgo.
  La Alk\u028br\u00e3an wagell\u00e3, y\u1ebdnda yaa W\u1ebdnd s\u1ebdn g\u0169 n
  yi toeeng buudu, n t\u028bg n wa t\u00e3ag r\u0169nda, ne Laarabiimd ning\u00e3
  a s\u1ebdn sig ne w\u00e3. Baa gom-bil a yembr ka boog been\u1ebd ye, yaa b\u0169mb
  me s\u1ebdn w\u1ebd n yiisi t''\u0251 s\u00e3eege, yaa gaf s\u1ebdn yaa bedre n
  ka tar to, t\u0269 s\u00f5mb t\u0269 b karem-a, m\u0251\u0251 b k\u0251rem \u0251
  maan\u0251 w\u00e3 s\u1ebdn lebg ne buud \u0251 t\u0251\u0251b\u0251 goam\u00e3,
  wala T\u1ebdn-t\u028b\u028bm\u00e3 a M\u028bhammade, W\u1ebdnd p\u028b\u028bsg la
  A t\u0269lgr be a y\u0129nga Sunn\u00e3 me, la a s\u1ebdn wilg yel nins\u00e3 la
  a v\u0269\u0269m\u00e3 yell\u00e3, y\u1ebd me yaa b\u0169mb b s\u1ebdn g\u0169usi
  n tall-a n t\u0251\u0251s s\u1ebdn t\u0169 ne R\u028bwaat (toagsdb) n yaa b s\u1ebdn
  maan-b r\u00e3mb bas-m-yam hal\u0269 t\u0269 wa t\u028bg n ta t\u00f5ndo, y\u1ebd
  me yaa b\u0169mb b s\u1ebdn w\u1ebd n yiis ne Laarabiimd ning -T\u1ebdn-t\u028b\u028bm\u00e3
  W\u1ebdnd p\u028b\u028bsg la A t\u0269lgr be \u0251 y\u0129ng\u0251- s\u1ebdn goam
  \u0251 so\u0251b\u00e3, yaa b\u0169mb b s\u1ebdn lebg ne buud goam w\u028bsgo. La
  Alk\u028br\u00e3an wagell\u00e3 ne T\u1ebdn-t\u028b\u028bm\u00e3 Sunn\u00e3- W\u1ebdnd
  p\u028b\u028bsg la A t\u0269lgr be a y\u0129nga- yaa b\u00e3mb\u00e3 b yiib\u00e3
  la y\u1ebdgr a yembr t\u00e3a b s\u1ebdn y\u00e3kd l\u0269slaoong\u00e3 B\u028b\u028bd\u00e3
  la a \u0160ari-r\u00e3mb\u00e3 \u0251 p\u028bg\u1ebd, r\u1ebdnd l\u0269slaoong\u00e3,
  b ka reegd-\u0251 neb nins s\u1ebdn yet t\u0269 b yaa l\u0269slaamb\u00e3 manesm\u00e3
  p\u028bg\u1ebd ye; la ad b reegd-\u0251 l\u0251me n yi W\u1ebdnd wah\u0269\u1ebd
  w\u00e3: Alk\u028br\u00e3an wagell\u1ebd w\u00e3 la Nabiyaam\u00e3 Sunn\u1ebd w\u00e3.\\n29-
  La l\u0269slaoong\u00e3 sagenda ne manegre n t\u028bg roagdb a yiib\u00e3, baa t\u0269
  b s\u00e3 n y\u0269\u0269me n ka moeemba, a leb n sagendame t\u0269 b r\u0269k na-k\u1ebdng
  s\u00f5ngo ne koamb\u00e3.\\n30- L\u0269slaoong\u00e3 sagenda ne t\u1ebdeg-t\u0269rga
  goam la t\u028b\u028bm p\u028bg\u1ebd, hal n t\u028bg n t\u00e3ag ne beeb\u00e3.\\n31-La
  l\u0269slaoong\u00e3 sagenda ne manegre n t\u028bg b\u00f5n-naands\u00e3 gilli,
  n leb n boond\u1ebd n t\u028bgd z\u028bg wagla la t\u028b\u028bm s\u00f5mbse\\n32-La
  l\u0269slaamd\u00e3 sagenda ne z\u028bg s\u00f5mbse, wala s\u0269da la bas-m-yam
  la boabl lebsgo la y\u00f5k-m-menga la y\u00e3n-zoeega la raoodo la k\u0169uni la
  k\u00f5-yalengo, la t\u028blsem-r\u00e3mb\u00e3 s\u00f5ngre la pakr s\u1ebdn pak-b
  r\u00e3mb f\u00e3agre, la kom soab r\u0269lgre, la yak-n-taar manegre, l\u0251 rogem
  t\u00f5kre, la maan b\u028bg-b\u028bg ne r\u0169ms\u00e3.\\n33-L\u0269slaoong\u00e3
  k\u00f5o sor t\u0269 b r\u0269 r\u0269-y\u0269lm\u00e3 f\u00e3a, s\u1ebdn yaa r\u0269\u0269bo
  la b\u00f5n-y\u0169ud\u0269, la a sagle t\u0269 b y\u0269lg s\u0169y\u00e3 la y\u0129nga,
  la zaka, r\u1ebd n k\u0269te t''a k\u00f5 sor ne fur loeega, wala nabiyaam-r\u00e3mb\u00e3
  me s\u1ebdn sagl ne r\u1ebdnda, t\u0269lgr be b y\u0129nga, bala b sagenda ne b\u0169mb
  f\u00e3a s\u1ebdn yaa y\u0269lenga\\n34- La l\u0269slaoong\u00e3 g\u0269dga haraam-d\u00e3mb\u0251
  y\u1ebdg\u00e3, w\u0251 la lagem-n-taar ne W\u1ebdnde, la k\u0269f\u1ebdndo, la
  r\u028bbs\u00e3 t\u0169ubu, la yeel W\u1ebdnd zugu t\u0269 ka t\u0169 ne b\u00e3ngr
  ye, la koam k\u028b\u028bbo, la k\u028b y\u00f5or ninga \u0160ari w\u00e3 s\u1ebdn
  ka k\u00f5 sore t\u0269 b k\u028b, la s\u00e3oong t\u1ebdng\u00e3 p\u028bga, la
  t\u0269\u0269m soobo, la yel-beedo s\u1ebdn v\u1ebdneg la s\u1ebdn solge, la yoobo
  la raop k\u1ebded-n-taar ne taaba, l\u0251 \u0251 g\u0269dg R\u0269b\u0251''a, la
  \u0251 g\u0269dg g\u0269f w\u00e3bre, la b\u0169mb ning b s\u1ebdn kodge r\u028bbs\u00e3
  y\u0129nga, la a g\u0269dg kukur nemd w\u00e3bre, la r\u1ebdgd-r\u00e3mb\u00e3 f\u00e3a
  gilli, la a g\u0269dg k\u0269\u0269b arzek r\u0269\u0269bo, la boogre vugb\u1ebd
  w\u00e3 la magb\u1ebd w\u00e3, la a g\u0269dg rogem w\u00e3agre. L\u0251 Nabiyaam-r\u00e3mb\u00e3
  f\u00e3a gill zemsa taaba ne haraam-k\u00e3ens\u00e3 g\u0269dgre.\\n35- L\u0269slaoong\u00e3
  g\u0269dgda z\u028bg-w\u1ebdnse, wala z\u0129ri-beedo la z\u00e3mbo, la p\u028b-lika
  la belgre la s\u0169-kiiri la rab-w\u1ebdnse la wagdem la maan-n-z\u028b\u028bk\u0251
  la w\u1ebdgdo, la a g\u0269dgda z\u028bg-w\u1ebdng buud\u00e3 f\u00e3a gilli.\\n36-
  L\u0269slaoong\u00e3 g\u0269dgda ligda t\u028bm-n-taar ning r\u0269baag s\u1ebdn
  be a p\u028bg\u1ebd, maa namsgo, maa belgre, maa w\u1ebdgdo, maa z\u00e3mbo, maa
  a y\u0269ta sabab n wa ne s\u00e3anga la namsgo n g\u0169bgd ne z\u00e3m\u00e3 w\u00e3
  la neb\u00e3 yembr-yembre.\\n37-L\u0269slaoong\u00e3 waame n g\u0169us yam\u00e3,
  la a g\u0269dg b\u0169mb f\u00e3a s\u1ebdn s\u00e3amd-\u0251 wala r\u00e3am y\u0169ubu,
  la L\u0269sl\u0251oong\u00e3 z\u1ebdk\u0251 yam\u00e3 yelle, n maan t\u0269 yaa
  y\u1ebdnda la t\u028b\u028bm\u00e3 roglg z\u0129iga, n yidg-a n yi rog-m-mik\u00e3
  la k\u0269f\u1ebdnd\u00e3 b\u00e3ense, la ka be l\u0269slaamd\u00e3 p\u028bga, s\u1ebdn
  y\u0251\u0251 yel-soaand\u0269 maa yaa b\u028b\u028bdo n welg ne neb \u0251 t\u0251\u0251b\u0251
  t\u0269 p\u0251 t\u0169 ne \u0251 t\u0251\u0251b\u0251, ad a B\u028b\u028bd-r\u00e3mb\u00e3
  f\u00e3a la a \u0160ari-r\u00e3mb\u00e3 f\u00e3a yaa s\u1ebdn zems ne yam s\u00f5mbs\u00e3,
  y\u1ebd me y\u0251\u0251 b\u0169mb s\u1ebdn zems ne t\u1ebdeg t\u0269rg\u00e3 la
  yam-bedr\u00e3.\\n38- La d\u0129in yood\u00e3, b p\u028bgdb\u00e3 s\u00e3 n ka b\u00e3ng
  b\u0169mb ning s\u1ebdn be a p\u028bg\u1ebd s\u1ebdn k\u0269\u0269sd taab\u00e3,
  la yel nins s\u1ebdn ka k\u1ebded yam\u00e3: la d\u0129in\u00e3 taoor-r\u00e3mb
  s\u1ebdn liibd p\u028bgdb\u00e3 n yet\u1ebd: t\u0269 ad d\u0129in\u00e3 a y\u0269\u0269da
  yam tagsgo, l\u0251 yam ka tar z\u0129ig\u0251 d\u0129in\u00e3 fas\u1ebdng p\u028bg\u1ebd
  ye. La s\u00e3 n y\u0251\u0251 l\u0269slaoong\u00e3, a r\u0269ka d\u0129in\u00e3
  t\u0269 yaa v\u1ebdenem n w\u00f5ond yam\u00e3 t''a r\u0269kd a sor\u00e3, r\u1ebdnd
  d\u0129in yood\u00e3 r\u00e3mba, b ratame t\u0269 ninsaal bas a yam\u00e3 la a p\u028bg
  b\u00e3mba, la l\u0269slaoong\u00e3, a ratame t\u0269 ninsaal nek a yam\u00e3 s\u1ebdn
  na y\u0269l n b\u00e3ng yel\u00e3 meng hak\u0269\u0269k\u00e3 wala b s\u1ebdn s\u0269d
  yaa to-to w\u00e3.\\n39- L\u0269slaoong\u00e3 z\u0269sgda b\u00e3ng s\u00f5ngo,
  la a leb n pirsd b\u00e3ngr p\u1ebdesgo, p\u1ebdesg ning s\u1ebdn lak n yi y\u00f5or
  y\u0251mleoog\u00e3, la a boond\u1ebd n t\u028bgd tags-n-gesga la tagsgo t\u00f5nd
  meng\u00e3 p\u028bg\u1ebd, la b\u00f5n-naands\u00e3 s\u1ebdn be t\u00f5nd k\u0269reng\u00e3,
  la b\u00e3ng s\u00f5ng ning s\u1ebdn zemsd ne l\u0269slaoong\u00e3.\\n40- La ad
  W\u1ebdnd ka reegd t\u028b\u028bmde, A leb n ka k\u00f5t yel-s\u00f5md a p\u028bg\u1ebd
  yaoolem raar\u00e3 s\u00e3 n ka mikame t\u0269 yaa ned s\u1ebdn k\u00f5 s\u0269d
  ne W\u1ebdnde la a t\u0169-A la a k\u00f5 s\u0269d ne A t\u1ebdn-t\u028b\u028bmb\u00e3
  -p\u028b\u028bsg la t\u0269lgr be b y\u0129nga- A leb n ka reegd t\u0169ud-r\u00e3mb\u00e3
  s\u00e3 n ka b\u0169mb ninga A s\u1ebdn tuk n k\u00f5-ba ye. R\u1ebdnd na n y\u0269\u0269
  w\u00e3n-w\u00e3n\u0251 t\u0269 ninsaala k\u0269fl ne W\u1ebdnde la a t\u1ebded
  t''A na n k\u00f5-a la keoore? La a ka reegd ned baa a yembr s\u0269d-k\u0169uni
  s\u00e3 n ka mikame t''a k\u00f5o s\u0269d ne nabiyaam-r\u00e3mb\u00e3 f\u00e3a
  gill ye -p\u028b\u028bsg la t\u0269lgr be b y\u0129nga- la a k\u00f5 s\u0269d ne
  a M\u028bhammad t\u1ebdn-t\u028bmd\u00e3, W\u1ebdnd p\u028b\u028bsg la A t\u0269lgr
  be a y\u0129nga.\\n41-Ad W\u1ebdnd t\u1ebdn-t\u028bm\u00e3 f\u00e3a gilli, b raab\u00e3
  yaa: t\u0269 d\u0129in s\u0269d\u00e3 z\u1ebdk ninsaala t''a y\u0269 yamba s\u1ebdn
  welg toore ne W\u1ebdnd A Yembre s\u1ebdn yaa b\u00f5n-naands Naab\u00e3, la b yidg-a
  n yi ninsaalb\u0251 yembdo, maa arzeka maa rog-n-mik yembdo, r\u1ebdnd l\u0269slaoong\u00e3
  yaa wala fo s\u1ebdn ne w\u00e3, a ka y\u0269lgd neb n z\u1ebdk-ba n y\u0269\u0269g
  b z\u0129ig\u1ebd w\u00e3 ye, a ka maand-ba t\u0269 b yaa w\u1ebdnd-r\u00e3mb\u0251
  la soab-r\u00e3mb ye.\\n42-W\u1ebdnd tuka tuubg\u00e3 sore l\u0269slaoong\u00e3
  p\u028bg\u1ebd, y\u1ebdnda me la ninsaal s\u1ebdn na n lebs a menga a Soab\u00e3
  neng\u1ebd la a bas zunuuba maanego, la l\u0269slaoong\u00e3 a wurda b\u0169mb ning
  s\u1ebdn renga taoor\u00e3 f\u00e3a s\u1ebdn yaa zunuub-r\u00e3mba, la tuubg\u00e3
  s\u0169kda b\u0169mb s\u1ebdn rag n reng a taoor\u00e3, s\u1ebdn yaa zunuub-r\u00e3mb\u00e3,
  r\u1ebdnd ninsaal ka tar t\u028blsem n na n reeg a zug\u1ebd ne y\u1ebd t\u028b\u028bm
  tuuti w\u00e3 ninsaalb taoor ye.\\n43- R\u1ebdnd yaa l\u0269slaoong\u00e3 p\u028bga
  la t\u00f5k-n-taar\u00e3 y\u0269t\u0251 ninsaal ne a Soab\u00e3 s\u028bka t\u0269rga,
  t\u0269 ka tar t\u028blsem t\u0269 ned baa a yembr z\u0129nd y\u1ebd ne a Soab\u00e3
  s\u028bk ye, r\u1ebdnd l\u0269slaoong\u00e3 g\u0269dgdame t\u0269 b wa t\u028bg
