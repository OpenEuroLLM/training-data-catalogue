  Pa y\u00e3 n kaoos la d paam bark a taab ye. B k\u0269tame t\u0269 d lebg zall so-pakdba.
  S\u1ebdn y\u0269 bilfu, m s\u0269d\u00e3 lebga tigims sull yel-g\u025bta. T\u00f5nd
