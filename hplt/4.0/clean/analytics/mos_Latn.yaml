  Tijani rogame y\u028b\u028bmde 1965 t\u028b\u028blg kiuug rasem pii-la yoobu (16).
  A yita Yendi s\u00e9n b\u00e9 Ghana r\u0269tg baobgo North constituency soolm\u1ebd
