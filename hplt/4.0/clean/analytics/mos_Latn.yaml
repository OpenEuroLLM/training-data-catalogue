  t\u0169udm\u00e3 noy\u00e3 ket n segd n maana y\u0269\u0269r ne b s\u1ebdn lebsd
  t\u0169udm\u00e3 noy poor\u1ebd w\u00e3.\u201d\\nBas-yard kaalem r\u0169nd\u00e3-r\u0169nd\u00e3
