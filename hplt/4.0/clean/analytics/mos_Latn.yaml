  ki w\u00e3 s\u0169y\u00e3. La wa y s\u1ebdn y\u00e3 seb-k\u00e3ng\u00e3 sak a 6
  p\u028bg\u1ebd w\u00e3, s\u1ebdn ki-b\u00e3 pa mi baa f\u0269. R\u1ebdnd pa tar
  y\u00f5od t\u0269 y na n mak n gom ne-b ye. Y s\u00e3 n w\u028bm koees buud f\u00e3a
