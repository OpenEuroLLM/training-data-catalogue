  noy\u00e3 wa nen-k\u025bglem noy\u00e3.\u201d\\nA Jonathan Glover g\u028blsa a sebr
  a yembr (Humanity\u2014A Moral History of the Twentieth Century) p\u028bg\u1ebd
  woto: \u201cB\u0169mb a ye s\u1ebdn k\u0269t t\u0269 t\u00f5nd wakat\u00e3 yaa toor
