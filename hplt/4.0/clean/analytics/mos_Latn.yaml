  luglg .Yendi w\u00e3 p\u028bg-peelm\u00e3 la kom-b\u0269\u0269s\u00e3 b\u00e3ag
  b\u00e3ag b\u00e3aga\\n. lekoll\u00e3 g\u00e3ag Yendi t\u1ebdnga p\u028bga Yendi
  t\u1ebdnga p\u028bg\u1ebd\\n.Yendi t\u1ebdnga g\u00e3ag\u00e3 p\u028bg\u1ebd[4]\\nA
  k\u1ebde k\u00e3adem n tar kamb a naase. A yeelame t''a yaa Mizulman.[1][2][3]\"",
