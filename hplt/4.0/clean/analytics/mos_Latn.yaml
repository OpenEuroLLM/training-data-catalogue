  a yembre?\\n4 Yaab r\u00e3mb nins s\u1ebdn ki w\u00e3 baleng\u00e3 me yaa b\u0169mb
  s\u1ebdn wae ziri t\u0169udum w\u028bsg p\u028bs\u1ebd. Nand t\u0269 neb k\u1ebder
