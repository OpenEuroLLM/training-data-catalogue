  t\u2019a Atsushi t\u0269 y\u0269 tigims sull yel-g\u025bta, n da rat n b\u00e3ng
  d s\u00e3 n na n sakame.\\nMam da y\u025b\u025bsda m roagdb\u00e3 s\u1ebdn na n
  yeel b\u0169mb ninga, b s\u00e3 n wa b\u00e3ng t\u0269 t\u00f5nd debda t\u1ebdn-z\u00e3rg\u1ebd.
