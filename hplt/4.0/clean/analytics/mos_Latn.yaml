  get-b to-to r\u0169nd\u00e3-r\u0169nd\u00e3 w\u00e3. \u201cY\u028b\u028bmd 1914-18
  zab-k\u00e3seng\u00e3 yaa wa z\u0129ig b s\u1ebdn y\u00f5og n maan welgr r\u1ebd
