  noonu !\\nSenegal ak Adduna \u0148akk\\nLu yagg te w\u00ebr tey \u0148ak\\nKu sax
  ci xol yi ak xel yi\\nLii moo waral rongo\u0148 yi di xelli\\n\u0147ayu xare weetal
  na Xelxom\\nGooru Yalla mi ittewoo Koom koom\\nCey! Suma m\u00ebnoon dellu tuut
