  sunuy t\u00e9ereb ci biir k\u00ebr gu \u00f1uy s\u00e0mm, te soxlawul a set ak njari\u00f1.\\nTe
  itam \u00f1uy wax ci biir k\u00ebr gu \u00f1uy wax ci biir k\u00ebr gu \u00f1uy
  wax ci biir k\u00ebr gu \u00f1uy wax ci biir k\u00ebr gu \u00f1uy wax ci biir k\u00ebr
  gu \u00f1uy wax ci biir k\u00ebr gu \u00f1uy wax. L\u00e9egi nag, g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3or-g\u00f3orlu.\\nRottan
  bu \u00f1uy wax k\u00e0ttan\\n\u00d1oom-\u00f1ett bu y\u00e0gg, tey x\u00f3ot bu
  y\u00e0gg.\\nD\u00ebkk yi:\\n\u00abL tur: mesh bu \u00f1uy wax kable bu rafet.\u00bb\\nPattern:
  diamond.\\nL Cable material: stel bu amul njari\u00f1 AISI 304, 304L, 316 walla
  316L.\\nL Cable konstruk: 7 \u00d7 7 (1.5 mm, 2 mm walla 2.5 mm), 7 \u00d7 19 (3
  mm, 4 mm)\\nL Cable diameter: 1/8\\\", 3/32\\\", 5/64\\\", 1/16\\\" ak 3/64.\\nL
  Mesh ubbi nattu: 1\\\" \u00d7 1\\\", 1-1/2\\\" \u00d7 1-1/2\\\", 2\\\" \u00d7 2\\\",
  3\\\" \u00d7 3\\\" and 4\\\" \u00d7 4.\\nL aaxal bu standard mesh: 90\u00b0.\\nL
  Mesh: W: 20 mm ba 120 mm; H: 20 mm ba 120 mm.\\nSpesifik:\"", "\"S\u00ebri\u00f1
  Tuubaa nee na \u00bb Ca gaal ga la ma Y\u00e0lla xamalee ne kuy ligg\u00e9eyal Yonent
  bi laa. Foofu it laa taggee Yonent bi tagg wuy sax di ko fekk fa mu ne \u00bb .\\n\u00ab
  Fa Conakry, Y\u00e0lla setal na ma ci l\u00e9pp luy j\u00ebme ci lu \u00f1aaw, fegal
  ma ko. Tagg naa fa Yonent bi it (Alayhi Salaam), te moom gindi na ma ba duma r\u00e9er
  bi izni Laahi \u00bb.\\n\u00ab Ca Grand-Bassam la ma Y\u00e0lla d\u00e0qalee samab
  noon, gindi ma fa ci tag gi may tag Yonent bi (Alayhi Salaam) fegal ma fa ag faatu
  ci atum 1313 \u00bb\\n\u00ab Tagg gi ma doon tagg Yonent bi (Alayhi Salaam) fa Libreville,
  Y\u00e0lla defal na ma ci lu wenn Waaliyu amul, te Waaliyu wu nekk b\u00ebgg ko
  \u00bb.\\n\u00bb \u00c0gg naa ci Y\u00e0lla fa d\u00ebkkub Galwaa* yi, mu fegal
  ma l\u00e9pp luy y\u00f3bbe balaa. Nekk gi na nekk ligg\u00e9eykatu Yonenti bi ma
  fegal balaa, tiis na saytane foofu, lool lool \u00bb.___*Galwaa, wala Galoa aw xeet
  la niti Gabon, Lambar\u00e9n\u00e9 mooy seen d\u00ebkk.\\nAl-Habdul Xadiim\\n24/09/2021.\"",
  "\"P\u00f3litig ci Senegaal du j\u00f3g di jur mbetteel ci askan wi. Mu mel ni,
  lu kenn dul foog, mooy w\u00eblbatiku di \u00ebl\u00ebm nit \u00f1i. Waaye, la bettut
  kenn mooy daan bi \u00f1u daan njiitul Pasteef lii di Usmaan Sonko. \u00d1u gis
  ne gal-gal bi y\u00e0gg na lool, waaye la ca mujj bettut kenn. La Yoon dogal ci
  moom te jeexital la nekk lu koy g\u00e0llankoor ci p\u00f3litig, mooy t\u00e0ggale
  kook \u00e0q ak yelleefi maxejjam. Loolu, di wund ne, njiitul Pastef li du m\u00ebn
  a bokk ci wotey njiitu r\u00e9ew yii \u00f1u d\u00ebgmal.\\nCa geneen wet ga, \u00f1u
  seetlu ne jafe-jafe yi da\u00f1uy toppalante. Mu mel ni yuuxu jib na fa \u00f1u
  ko foogeewut. Nde, l\u00ebkkatoo YAW, ci tas la j\u00ebm. Mu nekkoon lu \u00f1enn
  ci \u00f1i seen xam-xam m\u00e0cc ci w\u00e0ll woowu doon junj. Muy lu \u00f1u miis
  ci p\u00f3litigu r\u00e9ew mi, rawatina bu ay wote jubsee. Waaye, g\u00e9nnug B\u00e0rtelemi
  Jaas gi l\u00ebnd\u00ebmal na xel yi. Mu bokk ci waa Yewwi askan wi, taxawaayam
  doon lu r\u00e0\u00f1\u00f1eeku ci kujje gi. \u00d1u y\u00e0gg koo gis ci wetu Xalifa
  S\u00e0ll ak Usmaan Sonko, seen \u00e0nd boobu \u00f1u m\u00ebn leen a tudde \u00f1atti
  doomi Penda Naar. Laaj biy s\u00e0mpu mooy lu xew ? Lan moo war a jur \u00f1\u00e0kk
  a d\u00e9ggoo ci seen biir ? Mbaadu YAW dafa nar a soppiku MAN ?\\nBu \u00f1u sukkandikoo
  ci ay k\u00e0ddoom, moom B\u00e0rt, dafa mel ni kuy \u014b\u00e0\u00f1\u00f1 taxawaayu
  Usmaan Sonko ci yenn mbir yi, rawatina waxtaan wi. Ndax, ma ngay wax naan : \u201cKenn
  m\u00ebnut a b\u00ebgg lee, b\u00ebgg la ca des\u201d.\\nMu mel ni B\u00e0rt, ndaanaan
  la niki ni mu koy waxe. Ndaxte, fitam, d\u00ebggoom ak fullaam tax na ba kenn du
  ko yab. Mu mel ni ku nekk ci ab t\u00e9esante, doonte ne tuddewu ko noonu, waaye
  \u00ab yaa ma ne \u00bb ak \u00ab moo ne ma \u00bb bariwoon na ca.\\nD\u00e9ggees
  na ci ne la sooke coow li, woote waxtaan wa B\u00e0rtelemi Jaas sumboon ca la. \u00d1u
  gis ne, joxe bopp, rocci l\u00e0mmi\u00f1 am na ca. Ndax ag d\u00e9ggoo ca amoon
  waaye ay t\u00ebkkoo ca mujj.\"", "\"Yonent bi (YYJSM) neena nit ki bu faatoo dana
  woote junniy (1000) woote naan y\u00e9en sama doom yi, y\u00e9en sama mbok yi y\u00e9en
  sama xarit yi sarax\u00e9ell\u00e9enma donte benn tibbu la wala wenn sagar wala
  genn \u00f1aan ndax yalla y\u00ebr\u00ebm maci. \u00d1oogi duggu ci pax mu x\u00f3ot
  ta xat kon d\u00e9gl\u00e9en li\u00f1 l\u00e9endi wax bala g\u00e9eni \u00f1\u00ebw
  fii. Xanaa xamul\u00e9en loolu g\u00e9en yor yoroon na\u00f1u ko s\u00e0gganeko
  ba \u00f1\u00ebw fii jari\u00f1u \u00f1u darra.\\nAl Yaddaaliyu (YYDG) neena ci
  Xaatimatu Tasauffi \u00f1i faatu li\u00f1 ng\u00ebna b\u00ebgg\u00eb mooy dellu
  adduna donte benn waxtu la\u00f1 fay am. Ndax \u00f1u m\u00ebn\u00eb j\u00ebff lubaax
  lu l\u00e9endi jari\u00f1 bu\u00f1u delloo. Kon yaw miy dundu war ngaa gaawee sak
  dundu bala moo faat.\\nTa ngay s\u00e0mmoonteek sa biir tay wattu say c\u00ebr ak
  say noyyi. Ndax noyyi gune daa melni wurus woo xamni m\u00ebn ga cee ame koom mudul
  jeex ba fawwu.\\nTa nga xamni bayyi sa noyyi mu dem ci ludul toppu yalla sunu borom
  wala nga bayyiko mu dem ci ak mooy loolu pert gu r\u00ebyla \u00ebll\u00ebk.\\nNa
  ngay dund\u00ebl say waxtu ginaaw farata yi ci ay naafila guddi ak saraxe ak koor
  ci b\u00ebs yi\u00f1 soppu kuci woor ak wird ak sikkar ak xalaat ginaaw boo xamee
  ba noppi.\\nTa l\u00e9ep looy def nga ciy y\u00e9ene aw yiiw, ak di b\u00e9eg\u00ebl
  jullit yi di l\u00e9en defal aw yiiw, ta ngay wut\u00ebl sa boppu dok boo xamni
  dankoy saxal, ta diko seelal, ta diko n\u00ebbbu nit\u00f1i.\\nNdax lu nit\u00f1i
  xam, lici \u00ebpp du b\u00ebri njari\u00f1 \u00ebll\u00ebk.\\nBooy zi\u00e0rre
  ku faatu da ngay taxaw ci kanamam xawa tollook ay tankam wax lii :\\nAs-salaamu
  h''aleykum diyaara xawmin muuminiina wa innaa in chaa-allaahu bikum laahixuuna.
  Yarhamul laahu al mustaxdimiina minkum wal mustaaxiriina minnaa. Antum lanaa faratun
  wa nahnu lakum tabah''un. Annasal laahu wax-chatakum wa ammana rawh''atakum wa jah''alal
  jannata mih''aadan baynanaa wa baynakum. Allahuma rabba haazihil ajsaadil baaliyati
  wal h''izaamil naxiratil l\u00ebtii xarajat min dunyaa wa hiya bika muuminatu. Adhil
  h''alayhaa rawhan minka wa salaaman minnii. Allaahuma innaka tah''lamu h''adadahum
  wa rahmatuka awsah''u minhum faq''fir lanaa walahum.\\nAllahuma iq''fir l\u00ebhum
  wa arhamhum wah''fu h''anhum. Soo noppee nga j\u00e0ng saaru ixlass fukki yoonak
  benn (11) ak saaru inna ah''taynaakal kawsara benn yoon (1) ak ayaatul kursiyu benn
  yoon (1).\\nSoo noppee nga y\u00e9ene ko yool bi.\\nSudee nak ki faatu da ngaa yaakar
  ci moom barke da ngay dem f\u00e9et\u00e9 ko ginnaaw, jublu penku, \u00f1aan yalla
  sunu boroom ci barkeem mu fac say aajo. Ginnaaw bi nak nga \u00f1aanal ko nj\u00e9eng\u00ebl
  ak y\u00ebr\u00ebmande ak ng\u00ebr\u00ebmul sunu boroom.\\n\u00d1u b\u00ebri ci
  boroom xam xam yi neena \u00f1u kuy zi\u00e0rre xabru nit ku baax boo waxe \u00f1aan
  gii loo \u00f1aan yalla danako nangu:\\nAllaahuma inniya as-aluka bijaahi nabiiyika
  muhammadin sallaa laahu h''aleyhi wa sallama wa anbiyaa-ika wa as-fi-yaa-ika wa
  suh\u00ebybin wa h''ammaarin ibni yaassirin wa h''imraana ibn husayrin wa tayfuurin
  ibn h''iisaa wa h''abdil laahi ibnil mubaaraki wa bi h\u00e0qqi waliyi h\u00eb\u00ebzaa
  dariihi an tusallii h''alaa s\u00ebydina muhammadin wa h''alaa aalihii wa sahbihii
  wa tusallima.\\nBoo demee ci b\u00e0mmeel nak war na ga teewlu bu baax ba\u00f1a
  def ci sa xol leneen.\\nKu dem ci armeel wax lii sunu boroom danako bind\u00ebl
  limup \u00f1afa neek ciy tuyaaba.\\nMigi nii : Allaahuma rabba haazihil arwaahi
  wal ajsaadil baaliyati wal h''izaamil naxiratil l\u00ebtii xarajat mina dunnyaa
  wa hiy\u00eb bika muuminatun. Adhil h''aleyhaa rawhaan minka wa salaaman minnii.\\nAmna
  nettili yu waxni boo waxee \u00f1aan googu, b\u00e9ep jullit bu sunu boroom m\u00ebs\u00eb
  bind danala j\u00e9eglul. Batay amna nettili yu waxni boo waxee \u00f1aan googu,
  dana\u00f1 ko bind\u00ebl limup \u00f1i m\u00ebs\u00eb faatu ak \u00f1iy b\u00ebg\u00eb
  faatu ciw yiw.\\nAl Imaamul Q''azaaliyu (YYDG) neena ci Tibrul Masbuuk, H''abdullaahi
  Ibnu H''omar (YYDG) ak \u00f1u b\u00ebri ci ay mbokkam amna\u00f1 fukki at ak \u00f1aar
  (12) di \u00f1aan yalla wann leen H''omar Ibnul Qatt\u00e0b ci ay nelaw ginaaw bamu
  faatoo.\\nBa\u00f1 ko gisee, mu melni ku sangu ba g\u00e9nn, g\u00e0ccoo ap morso,
  \u00f1u laac ko :\\n-Nusa boroom defak yaw ?\\n-Munil\u00e9en ba\u00f1u jug\u00e9e
  ci y\u00e9en ak l\u00e9egi \u00f1aata at la ?\\n-\u00d1uniko fukkak \u00f1aar (12
  ans).\\n-Munil\u00e9en booba ba l\u00e9egi maagici hisaab. Xaw tuuti ma alku buma
  sunu boroom j\u00e9egalutoon.\\nExtrait de Majmah''u nuurayni fii fawaa-i-di daarayni\\nCheikh
  Ahmadou Bamba Mback\u00e9\\nTranscription : Serigne Moustapha L\u00f4 Kholl\"",
  "\"Ka yoroo keesu k\u00ebr gii di CMS (Cr\u00e9dit Mutuel du S\u00e9n\u00e9gal)
  moo luubal ay koppar ci nafag benn kiliyaan. Maanaam, dafa j\u00eble ca nafag kiliyaanu
  CMS bi lu tollu ci fanweeri miliyo\u014b. Kiliya\u014b boobu mu s\u00e0cc nag, nee
  \u00f1u toog na \u00f1aari at yu mu \u00f1\u00ebwul ndax wopp ju ko t\u00ebral.\\nAs
  ndaw lees jii\u00f1 ag c\u00e0cc ca CMS. Ndaw si, keesiyeer la fa, di wuyoo ci turu
  A. Gasama. Y\u00e9enekaay \u00ab Lib\u00e9ration \u00bb moo siiwal xibaar bi. Nee
  \u00f1u, 30i tamndaret (miliyo\u014b) ci sunuy koppar. Kilifay g\u00ebr ga, ginnaaw
  caytu gi\u00f1 amal, \u00f1oo dem ba gis ne am na kuy tibb ci nafag kiliyaan boobee
  nekk Siwis ci sababu feebar. Ndeke, jamono ju muy faju bitim-r\u00e9ew, am kuy rawale
  xaalisam ci suuf. Bi \u00f1u saytoo nafag kiliyaan boobii la\u00f1u xam ne am na
  lu des, \u00f1u daldi n\u00e0nd. Ginnaaw bi \u00f1u lu\u00f1\u00f1utoo, ca la\u00f1
  ko j\u00e0pp, laaj ko, muy miim ak a weddi, \u00f1u j\u00e9bbal ko takk-deri \u00ab
  S\u00fbret\u00e9 urbaine \u00bb bu Ndakaaru. \u00d1u daldi koy y\u00f3bbu seen m\u00e0kkaan
  ngir amal ak moom laaj-tont. Foofa, ca p\u00f3lis ba, la nangoo ne moo s\u00e0cc
  xaalis bi. Ndeke, \u00f1aari at \u00f1oo ngii, muy tibb ci xaalisu j\u00e0mbur di
  lekk. T\u00ebs !\"", "\"Ci \u00e0jjuma jee weesu, magum j\u00ebwri\u00f1 yi, Usmaan
  Sonko \u00e0ddu woon na ci t\u00e9ere bi doomu r\u00e9ewum Far\u00e3s, Sewerin Awenengoo
  Dalberto, dib g\u00ebstukat ci mboor, bind ci jonnug Kaasam\u00e3s. Fekk mu doon
  amal ab miti\u014b fa Sigicoor. Ci k\u00e0ddoom yooyu nag, wone na taxawaayu kilifay
  r\u00e9ew mi ci ni t\u00e9ere boobu du g\u00e9nne fi r\u00e9ew mi te kenn du ko
  fi jaaye.\\nGinnaaw k\u00e0ddoom yooyu, p\u00e0ccu MFDC bii di M\u00e0ngukuro, f\u00e9ete
  ci Abdu Elinkin Jaata, g\u00e9nn na ba wax. Waaye rafetluwu\u00f1u tere bi \u00f1u
  tere t\u00e9ere boobu g\u00e9nn. Ba tax \u00f1uy laaj \u00ab lu tax \u00f1uy ba\u00f1
  waa kaasam\u00e3s xam seen mboor \u00bb (Aamidu Jibaa mi yor seen k\u00e0ddu). Dem
  na sax bay jam baaraam Jag S\u00e0rpi mi Usmaan Sonko def delluwaayam : \u00ab warees
  na xamal Usmaan Sonko ni Jag S\u00e0rpi mi muy junj nettali na l\u00e9pp ba mu des
  mbooru Kaasam\u00e3s. \u00bb\\n\u00d1oo ngi rafetlu j\u00e9ego yi Nguur gi di teg
  ngir dundalaat koom-koom gi ci diggante Sigicoor, S\u00e9eju ak Koldaa. Xamle na\u00f1u
  itam ni noppi na\u00f1u ngir toog waxtaan ci ni mu g\u00ebnee jekk. Waaye itam,
  \u00f1oo ngi s\u00e0kku ci magum j\u00ebwri\u00f1 yi mu def nd\u00e0nk, \u00e0nd
  ak dal te moytoo topp boroom xel yiy dunde dereetu waa kaasam\u00e3s.\"", "\"Ancos
  ci Siri\\nAncos, ca jamono Injiil, p\u00e9eyu diiwaanu nguuru Room bu tudd Siri
  la woon. Dafa nekkoon ca wetu joor gu naat ca dex gu yaatu gu tudd Oront (fleuve
  Oronte), 32 kilomet ca kaw b\u00eblu dex ga, maanaam fu dex ga dugg g\u00e9ej ga.
  Teeru Ancos moo doon ca d\u00ebkku Selusi, bu nekkoon ca G\u00e9ej gu Mag 8 kilomet
  ca noru b\u00eblu dexu Oront ba. Selusi nekkoon na 26 kilomet ca sowu Ancos.\\nCa
  at bu Pool demoon fa, daanaka atu 43 g.K. d\u00ebkk bi xumb na. Nu ngi doon tabax
  di beesal d\u00ebkk ba, gannaaw \u00f1aari y\u00ebngu-y\u00ebngu suuf yu y\u00e0qoon
  lu bare. Ay fukki junni Yawut ya d\u00ebkkoon Ancos te \u00f1oom woomle na\u00f1u,
  te seen j\u00e0ngu rafet na\u00f1u. Gereg yu bare \u00f1i ngi doon \u00f1\u00ebw
  ca seen diine. Ancos moo doon d\u00ebkk bu neex a d\u00ebkk te rafet. Waaye d\u00ebkk
  ba dafa siiwoon itam ndax seeni noos, seen \u00f1aawteef ak seen njaaloo ak doxaanu
  y\u00e0qute. B\u00e0nneexu \u00e0ddina si rekk la waa Ancos doon wut.\\nD\u00ebkku
  Gereg bu am solo la woon bu nekkoon \u00f1etteelu d\u00ebkk bu g\u00ebna mag ci
  nguuru Room gannaaw d\u00ebkki Room ak Alegs\u00e0ndiri. Buuru nguuru Maseduwan
  \u00f1oo ko sampoon daanaka 300 at lu jiitu jamono Kirist. Naka noonu \u00f1a fa
  j\u00ebkk a d\u00ebkk \u00f1oo doon ay xarekatu Maseduwan ak waa Aten. Waaye yeneen
  Gereg ya toppoon na\u00f1u ca \u00f1oom. Tamit buuru Geres dafa xiirtal Yawut ya
  \u00f1u \u00f1\u00ebw d\u00ebkk fa, te may na leen \u00f1u nekk jaamburu d\u00ebkk
  ba. Waa Room nangu na\u00f1u diiwaanu Siri ca atu 64 j.K. Naka noonu ca jamono Injiil
  d\u00ebkk bi dafa boole waa Maseduwan, waa Geres, waa Room, waa Siri ak Yawut ya.
  Waaye amoon na ay jafe-jafe diggante Yawut ya ak \u00f1i des ca waa Ancos ba dem
  sax ba am jamono waa d\u00ebkk ba b\u00ebggoon na\u00f1u rey Yawut ya fa d\u00ebkk.\\nCa
  suufu nguuru Room diiwaanu Siri dafa j\u00ebm kanam bu baax. Waa Room \u00f1oo defoon
  Ancos seen p\u00e9ey ak m\u00e0kkaanu xare ci diiwaanu Siri. Waaye ba tey waa Room
  may na d\u00ebkk ba mu yilif boppam. Ndegam Siri dafa nekkoon ca digu nguuru Room
  te mu f\u00e9ete waa P\u00e0rt, beneen nguur bu xeex ak nguuru Room, Siri nekkoon
  ca suufu buuru Room ba moom ci boppam. Buur ba, Sesaar, moo faloon benn jawri\u00f1
  ngir toogal ko \u00f1etti at ba jur\u00f3omi at yu nekk, mu nekk Boroom r\u00e9ewu
  Siri. Boroom r\u00e9ewu Siri moo sutoon Boroom r\u00e9ewu Yude, di ko yilif. Amoon
  na \u00f1eenti mbooloom xare bu tudd ''l\u00e9jiyo\u014b'' ca Siri, bu nekk bu am
  6.000 xarekat ya. Amoon na itam ay gaalu xare ca Selusi.\\nYaakaar na\u00f1u ne
  daanaka 200.000 nit \u00f1a fa d\u00ebkkoon ca jamono Injiil. Benn boroom xam-xam
  dafa yaakaar ne benn c\u00e9r ca jur\u00f3om-\u00f1aar ca niti d\u00ebkk ba Yawut
  la woon te Yawut ya d\u00ebkkoon ca \u00f1etti gox ya. Yawut ya amoon na\u00f1u
  alal te seen dundin x\u00ebcc na yu dul Yawut yu bare \u00f1\u00ebw bokk ca seen
  diine.\\nKoom-koomu Ancos amoon na doole lool ndax k\u00e0ttan gu mu am ci biir
  nguuru Room, tamit ndax yoonu jaaykat yi am solo ya jaaroon Ancos ak ndax lu \u00f1u
  fa defaroon ca d\u00ebkk ba. Ancos dafa siiwoon ndax d\u00e0llu der yu rafet, latkolo\u00f1,
  saf-saf yi ak nd\u00e0bb lu xee\u00f1, piis yi, g\u00e0njar ya ak takkaay ya, t\u00e9ere
  ya, ak li t\u00ebggu xaalis ak wurus defare.\\nYoonu jaaykat ya j\u00f3ge ca penku,
  maanaam Babilon, Asiri ak Iraak jaar na Ancos, te dafa tiim yoon wu dem nor ak sudd
  wu boole Palestiin, Siri ak Asi Min\u00ebr. Naka noonu amoon na wenn yoonu jaaykat
  wu jaar ca tund ya ca xunt bu tudd ''Buntu Siri'' ba noppi dem Tars. Yoon mu j\u00f3ge
  Tars wu tudd ''Yoonu E\u014baca'' (Via Egnatia) dafa j\u00e0ll Asi Min\u00ebr ba
  d\u00ebkku Efes. Tamit gaal ya m\u00ebnoon na\u00f1u dox ca dexu Oront diggante
  g\u00e9ej ga ak d\u00ebkk ba.\\nD\u00ebkk ba, moom, rafet na lool. Nguuru Geres
  def na\u00f1u yoon ya ca kaw t\u00ebralinu damyee ngir yoon yu mag ya j\u00e0pp
  ngelaw lu f\u00e9ex lu j\u00f3ge g\u00e9ej ga. Amoon na benn miir bu mel ni tata
  bu w\u00ebr d\u00ebkk ba l\u00e9pp. Buuru Room bu nekk t\u00e0mbali ak Pompey ca
  atu 64 j.K., dugg na xaalisu nguuru Room yu bare ci tabax ya ak rafetaayu d\u00ebkk
  ba. Ni b\u00e9pp d\u00ebkk bi Gereg ya walla waa Room tabaxoon amoon na ay powukaay
  ak amfiteyat\u00ebr\u00eb, ay m\u00e0ggalukaayu y\u00e0llay x\u00ebr\u00ebm yu bare,
  ak ay k\u00ebru sanguwaay ya. Feesoon na dell ak ay p\u00e9nc fu xale ya doon fo,
  waxkat ya indi seen wax, jaaykat ya jaay, te reetaanlukat ya b\u00e9gloo mbooloo
  ya. Def na\u00f1u ay robine ca kaarfuur mbedd ya ngir jig\u00e9en ya m\u00ebnoon
  na\u00f1u root, ndox moo xam ne mu j\u00f3ge ca dex ga walla ca ay b\u00ebtu ndox
  ya amoon ca d\u00ebkk ba. Tamit Yulyus Sesaar tabax na benn ''akwadakk'', maanaam
  pom bu indi ndox, ngir dimbali gox yoo xam ne amu\u00f1u woon ndox.\\nErodd bu Mag
  ba tabax na wenn yoon wu j\u00e0ll diggu d\u00ebkk bi diggante buntu miiru d\u00ebkk
  ba ca penku-kaw, ak buntu miir ca sowu-suuf. Yaatuwaayu yoon wu mag woowu 10 meetar
  la woon. Dem na 4 kilomet, te l\u00e9pp tali doj wu d\u00ebg\u00ebr wu j\u00f3ge
  Misra, walla marbar. Dafa dem ca p\u00e9nc bu r\u00e9y ca diggu d\u00ebkk ba. Ca
  p\u00e9nc moomu amoon na benn nataalu Buuru Room Tibeer Sesaar bu r\u00e9y bi \u00f1u
  defare x\u00e0njar. Ca wetu yoon wa ca \u00f1aari bor, fukki meetar yu nekk, amoon
  na ay kenu doj yi \u00f1u taaral. Dafa meloon ni mbaar ba tax \u00f1i dox \u00f1a
  m\u00ebnoon na\u00f1u dox ca wetu yoon wa guddaayam l\u00e9pp te ba\u00f1 g\u00e9nne
  ca naaj wa walla taw ba. Yu g\u00ebn a bare ca kenu ya amoon na ay nataal yi \u00f1u
  yett walla defar ca x\u00e0njar. Diggante kenu ya amoon na bunt ngir dugg ca k\u00ebr
  ya, bitik ya ak biro ya. Yoon ya amoon na sax l\u00e0mp ya t\u00e0kk guddi.\\nAmoon
  na benn dun ca biir dex ga fu dex ga jaar ci biir gox yu nekk ca noru d\u00ebkk
  ba. Guddaayam ak yaatuwaayam 3 kilomet la. Foofu la\u00f1u tabax k\u00ebri buur
  yi, ak benn estaad ngir rawante fas ak sareet ya. Guddaayu estaad ba 500 meetar
  la woon ba moo wara tax mu bokk ca ya g\u00ebn a r\u00e9y ca \u00e0ddina si.\\nAncos
  amoon na itam ay m\u00e0ggalukaay ca y\u00e0llay Gereg ak Room, ak ay powukaay.
  Y\u00e0llay Ancos moo doon S\u00ebs.\\nJur\u00f3om-\u00f1etti kilomet ca suddu miiru
  d\u00ebkk ba amoon na benn gox bu tudd Daf\u00ebne. Ca wetu yoon wa dem Daf\u00ebne
  amoon na ay tool fu \u00f1u bey lawtanu r\u00e9se\u00f1 ngir defare bii\u00f1 ak
  t\u00f3or-t\u00f3or yi \u00f1u defare latkolo\u00f1. Dafa nekkoon ca kaw benn d\u00e9ndu
  tund, maanaam ''palato''. Yaatuwaay ak guddaayu palato ba bu ne 1800 meetar ya la,
  te mu nekk 90 meetar lu g\u00ebn a kawe niwo Ancos. Amoon na m\u00e0ggalukaay ca
  y\u00e0llay x\u00ebr\u00ebm ju jig\u00e9en ju tudd itam Daf\u00ebne. Waa Ancos g\u00ebm
  na\u00f1u woon ne Daf\u00ebne nit la woon, ki Apolo, benn y\u00e0llay Gereg, soppoon.
  Apolo dafa ko d\u00e0qe di d\u00e0qe ba ci mujj Daf\u00ebne dafa soppiku nekk as
  ngarab bu tudd ''loriye''. Goxu Daf\u00ebne amoon na benn sardin walla park bi \u00f1u
  defaroon ngir b\u00e0nneex rekk bu am w\u00ebraayu 16 kilomet. Ca biir m\u00e0ggalukaayu
  Daf\u00ebne amoon na ay s\u00ebri\u00f1 yu jig\u00e9en yu nekk g\u00e0nc yu bare.
  Guddi gu nekk ci seen turu diine \u00f1u defaat li amoon ca nettali ba, maanaam
  jaamukat ya doon na\u00f1u d\u00e0qe s\u00ebri\u00f1 yu jig\u00e9en ya ci biir garabu
  loriye yi ci biir sardin ba, ba j\u00e0pp leen di s\u00e9y ak \u00f1oom.\\nBuuru
  Room Ogust Sesaar samp na benn po ''olimpik'' (Jeux D\u2019olympique). \u00d1eenti
  at yu nekk po boobu indi na ay jo\u014bantekat yu bare ngir rawante ci diiru 30
  fan ci daw, t\u00ebb, s\u00e0nni xeej ak fitt, rawante fas ak sareet, b\u00ebre
  ak \u00f1oom seen. Amoon na itam rawante ca misik ak ci tari nettali.\\nGis na\u00f1u
  ne ay at gannaaw deewu Kirist, mbooloo \u00f1i g\u00ebm ca Yerusalem fal na\u00f1u
  benn waa Ancos bu tudd Nikolas ngir mu bokk ca jur\u00f3om \u00f1aar yi doon toppatoo
  y\u00ebfu mbooloo \u00f1i g\u00ebm (J\u00ebf 6:5). Xebaar bu baax bi egg na Ancos
  gannaaw deewu Ecen daanaka atu 40 g.K. (J\u00ebf 11:19-21). \u00d1i ko indi ay Yawut
  yi l\u00e0kk Gereg la\u00f1u woon, yi j\u00f3ge dunu Sipar ak d\u00ebkku Siren ca
  Libi. \u00d1oom def na\u00f1u lu bees. May na\u00f1u Gereg yi topp Yeesu ci lu s\u00ebsul
  ca xaraf walla yeneen aada Yawut. Mbooloo bu mag g\u00ebm na Boroom bi. Foofu la\u00f1u
  j\u00ebkk tudd taalibe Kirist ''Gaayi Kirist'' (J\u00ebf 11:26). Ci bu j\u00ebkk
  tur boobu turu foontoo la woon. Waa Ancos da\u00f1u doon siiw ndax ni \u00f1u doon
  foontoo nit. Daanaka fukki at gannaaw ga, amoon na ca \u00f1a g\u00ebm ca Yawut
  ya ca Yerusalem, \u00f1a jaaxle ndax yu dul Yawut yu topp Yeesu te kenn xarafalu
  leen. Werante wu r\u00e9y amoon na ba tax \u00f1u def genn g\u00e9ew ca Yerusalem,
  650 kilomet fu sore Ancos, ngir waxtaan ci.\\nAm-ami \u00f1i g\u00ebm may na leen
  \u00f1u m\u00ebnoon a y\u00f3nni ndimbal ca \u00f1a g\u00ebm ca Yerusalem (J\u00ebf
  11:27-30). Tamit ca mbooloo \u00f1i g\u00ebm ca Ancos la Pool j\u00f3ge ngir tas
  xebaar bu baax ba ci biir yu dul Yawut ya, te ca Ancos la dellusi yoon bu nekk \u2013
  maanaam Ancos dafa nekkoon mel ni m\u00e0kkaanam. \u00d1etti tukkeem y\u00e9pp dafa
  t\u00e0mbali Ancos. Ca jamonoom, mbooloom \u00f1i g\u00ebm ca Ancos moo g\u00ebn
  a am taxawaay b\u00e9pp mbooloo ci mbiru ni mbooloom yi ca \u00e0ddina s\u00e9pp
  doxe, x\u00ebyna bu dul mbooloom ca Yerusalem.\\nTey jii d\u00ebkk bu \u00f1\u00e0kk
  solo la bu tudd Antakya ci Tirki (Turquie). Am na 35.000 nit kese, ay toppkatu eg\u00ebliis
  gereg yi des ci biir am r\u00e9ewu jullit yi.\\nAncos ca Siri fee\u00f1 na ca J\u00ebf
  6:5; 11:19-27; 13:1; 14:26-15:3; 15:22,23,30-33,35; 18:22-23; Gal 2:11\"", "\"s\u00e0qum
