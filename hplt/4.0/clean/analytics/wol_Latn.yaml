  k\u00ebr gu \u00f1uy wax ci biir k\u00ebr gu \u00f1uy wax ci biir k\u00ebr gu \u00f1uy
  wax k\u00e0ttan.\\nLLi g\u00ebn a kaw\\nLN\u00e0ggal gu raw\\nGannaaw loolu, \u00f1uy
