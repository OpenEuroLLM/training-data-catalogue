  ko ci ast.wikipedia.org\\nWone nj\u00ebfandikoo gu daj gu bii dencukaay.\"", "\"Sunu
  Baay, bi ci asamaan, na sa tur sell, na sa nguur dikk, loo b\u00ebgg, na am ci suuf
  naka ca asamaan. May nu tey sunu dundu b\u00e9s bu nekk, te baal nu sunuy too\u00f1,
  naka nuy baale \u00f1a nu too\u00f1. Tc bu nu b\u00e0yyi nu t\u00e0bbi ci b\u00ebliis,
  w\u00e0nte musal nu ci lu bon. Amiin.\\nZdr\u00e1vas Maria ve wolof\u0161tin\u011b:\\nNuyu
  naa la, Maryaama, fees nga ak yiw, borom baa ngi ak yow, barkeel nga ci jig\u00e9en
  \u00f1i yepp, te Y\u00e9esu, sa doomu biir, barkeel na. Maryaama mu sell mi, Ndeyu
  Y\u00e0lla, \u00f1aanal \u00f1u, \u00f1un b\u00e0kkaarkat yi, l\u00e9egi ak ci su\u00f1u
  waxtu dee. Amiin.\\nSl\u00e1va Otci ve wolof\u0161tin\u011b:\\nTeranga \u00f1ell
  na Baay bi, Doom ji, ak Xel mu Sell mi, naka la woon ca cosan la tey ak mos ba ca
  mos a mos. Amiin.\"", "\"Ngomblaan gi, walla P\u00e9ncum ndawi r\u00e9ew mi (ni
  ko \u00f1enn \u00f1iy wowee), benn la ci \u00f1atti firgaat yu mag yiy joow Gaal
  gi. Gaal gu yaatu gii di Senegaal, fees dell ak i g\u00e0njar. Nu bokk l\u00e9pp
  te m\u00ebnunu cee seddoo dara. Gaal gi nu m\u00ebs a boole ba nu faf doon benn
  bopp bu kenn warul a xar \u00f1aar.\\nDayob Ngomblaan googu tax na, j\u00e0mbur
  ya koy s\u00e9q, ku dul doomu r\u00e9ew mi, doo ca bokk. Waaye it, doomi r\u00e9ew
  mi \u00f1oo leen di t\u00e0nnal seen bopp. Te, \u00ebll\u00ebg ak j\u00e0mm, ci
  dib\u00e9er ji, 17i fani now\u00e0mbar 2024, yemoo ak 13i fani rakkaati g\u00e0mmu
  1446, lanu leen war a fal.\\n\u00d1oom \u00f1oo\u00f1u war noo teewal ca P\u00e9nc
  ma, \u00f1u ngi leen war a seppi ci biir 7 294i lawax yu y\u00e9kkati seen i loxo
  ngir b\u00ebgg ku leen tabb. Lawax yooyu, \u00f1u ngi bootu ci 41i toftale yu samp
  seen i nd\u00ebnd. Toftale yooyu nag, daanaka \u00f1etti ayu-b\u00e9s a ngi nii
  \u00f1u doon w\u00ebr reew mi ngir dagaan baatu askan wi.\\nDef na\u00f1u ay nj\u00ebgg
  yu mag, amal na\u00f1u ay ndaje yu r\u00e9y, doxantu na\u00f1u it ci gox yu bari
  ngir yey fere yi, \u00f1u s\u00e0ndil leen seen i xob bu \u00ebll\u00ebgee. Pexe
  mu \u00f1u amoon rekk, def na\u00f1u ko ngir dagaan sunuy baat nun \u00f1i war a
  t\u00e0nn \u00f1u nu y\u00f3nni.\\nFi mu nekk nii nag, nun \u00f1ii di t\u00e0nnkat
  yi noo ci des. Nanu daas sunuy k\u00ebyitu w\u00e9ttkat fanaanal. \u00d1i nekk ci
  biir r\u00e9ew mi te jotagu\u00f1u seen i yos, war na\u00f1u daw gaaw j\u00ebli
  leen tay ci gaawu gi. \u00d1i nekk bitim-r\u00e9ew moom, suba sax, ci dib\u00e9er
  ji, m\u00ebn nanu koo j\u00ebli. Bu ci kenn tayal waay !\\nBu nu x\u00ebyee, dem
  defi sunu wareef. Waaye itam, j\u00ebli li nu moom. Ndax kat, w\u00e9tt, wareef
  la ci b\u00e9pp ma-r\u00e9ew ; waaye it, \u00e0q la ci moom. Kon boog, nanu dem
  nun \u00f1\u00e9pp ci anam yi mu g\u00ebn a rafetee, m\u00e0ggal b\u00e9s bi (tuutiwul
  nag !). Te, bu nu defee sunu wareef ba noppi, nu dellu ak j\u00e0mm sunuy k\u00ebr
  walla ci sunuy yitte xaar njureef yi.\\nGinnaaw bi lawax yi wonee seen i feem y\u00e9pp,
  nun \u00f1ii noo ci des. Nde, noo yore k\u00e0ddu gu mujj gi. Te, bu \u00ebll\u00ebgee,
  l\u00e9pp dina leer bu soobee Y\u00e0lla. Lu waay doon jaay, mu t\u00eb a jar ba
  l\u00e9egi sii, bu moytuwul dina lamb. Ndax kat, wure wa dem na k\u00eb\u014b\u014b
  !\"", "\"Mboolaay\\nMboolaay baat la bu dage ci \\\"mbooloo\\\", moom nag di ci
  wu faraas \\\"soci\u00e9t\u00e9\\\" mooy dundiinu mbooloo mi aw nekkiinam tey ag
  nosteem ak aw nosuwiinam, maanaam ni muy nose biiram ak aw dundiinam ak l\u00ebkkaloo
  gu ay c\u00e9ram (ses membres)akug r\u00f3ofoom. Moom nag dina taxawe baat niki:\\n-
  Mboolaay (soci\u00e9t\u00e9):Kureelu mbootaayu xeet yi de, ak li mu def l\u00e9pp
  ci ligg\u00e9ey yu j\u00ebm ci saxal j\u00e0mm ci \u00e0dduna bi ci biir fukki at
  yu nj\u00ebkk yi, ak li mu fi def ci ligg\u00e9ey yu am njari\u00f1 ci w\u00e0llug
  mboolaay\\nwalla aji melal (adjective)niki:\\n- Mboolaay (social):Jataayub koom-koom
  ak mboolaay\\nMbind mu duuf\"", "\"Seex Ahmadu Nd\u00f9mb\u00e9 Mb\u00e0kke mi ngi
  gann\u00e9 adduna 1859 ci d\u00ebkk bu\u00f1u naan Nja feet\u00e9 Mb\u00e0kke Baol,
  doomi S\u00ebri\u00f1 Zayd Mb\u00e0kke la, moom Sa\u00ebr Soxna Bus\u00f3 moom Maam
  Mahram. Mi ngi yaroo ci kepparu wayjuram, and naak mom woot\u00e9 M\u00e0ba Jaxu
  Ba ca Saalum nekk Poroxan.\\nGinaaw ba wayjuram wa n\u00e9law\u00e9 la dem Mb\u00e0kke
  Kajj\u00f3or fekki fa Seri\u00f1 Tuuba, aggal\u00e9 fa\u2019b njaggam, taqqoo\u2019k
  moom, ba ni miy dem\u00e9 Mb\u00e0kke Baol. D\u00ebkko joxon leeppam, masta des
  ginaaw ci dara. Moo tax Se\u00f1 Mus\u00e0 Ka naan ko \u300aba mu \u00f1\u00ebwee
  Mb\u00e0kke kajj\u00f3or feek na alarabaa\u2019ki dib\u00e9er len x\u00e9waloon
  mu daal di buur s\u00f3obu y\u00f3onu ajjanah jeebal Seri\u00f1 bi ap nosam def
  gumba jox kop tumam, fum tool s\u00e0kkuy ng\u00ebram laajal Seri\u00f1 Daam Feek\u00e9
  naa, kerok ba tey m\u00ebsla taayi, m\u00ebsla yaag ci\u2019g jotaay, m\u00ebsla
  teggi laxasaay, m\u00ebsla wax ne soonu naa, m\u00ebsla x\u00e9y deelu ginaaw, ta
  lu\u00f1 ko sant mu ne waaw, ta duko won kanam gu \u00f1aaw, m\u00ebsla wax ne jambu
  naa.\u300b\\nBa S\u00ebri\u00f1 bi demee ca g\u00e9ej gi, dafa y\u00e9esalaat laxas\u00e0yam,
  so\u00f1\u00f1i waat murid yi ci ligg\u00e9ey bi ni ko Se\u00f1 Basiiru waxe ca
  t\u00e9erem ba ji Minanul B\u00e0qil xadim ak ni ko Se\u00f1 Muhamad lamin J\u00f3ob
  dagana andee ci Nubzatut taariqi wa nafsatul haamiya Ahmalu ahmaalihi.\\nGinaaw
  ga la sanc d\u00ebkk bu\u00f1u naan k\u00ebr Mag\u00e9y Ndaw attum 1896: \u300a
  Jur\u00f3om \u00f1aari at yi Se\u00f1 bi am ci g\u00e9ej la am fa k\u00ebr Mag\u00e9y
  di g\u00e9ej\u300b. Lumu fa masa bey j\u00e9ebal nako S\u00ebri\u00f1am, ba ci xoolitu
  geert\u00e9 yi, daan nako ko y\u00f3obul. Ba S\u00ebri\u00f1 bi nibi s\u00e9 ba
  mu am at la sanc Xaab\u00e0n. Diggant\u00e9 1914 ak 1925 nak sanc na fi d\u00ebkk
  yu bari ngir jangal\u00e9 ak yar\u00e9.\\nDiiru lu Se\u00f1 bi nek ci g\u00e9ej
  gi nak Borom Daaru la t\u00f3opon. Batey ba fi Se\u00f1 bi b\u00e0yyi ko, bok na
  ci ni nj\u00ebkk t\u00f3op S\u00ebri\u00f1 Muhamadu Mustafa. Borom jikko yu refet
  la won, doonon ku r\u00e9y koolar\u00e9, tabb\u00e9, \u00f1am\u00e9 lool jox\u00e9
  \u00e0ddiyah\\nCi attum 1933 la wuyu ji boromam!\\nLii \u00f1u bind Se\u00f1 M\u00f3odu
  Daara Faal moo \u00f1uko xamal ginnaaw bimuko xamee ci Se\u00f1 Maxtaar Puy. Yalna
  len y\u00e0lla subhanahu wa tahala defal yiiwu adduna ak alaaxira bakep se\u00f1
  Ahmadu Mb\u00e0kke.\\nAl-Habdul Xadiim\\nGrenoble, 07/12/2019.\"", "\"Elimaanu j\u00ebwri\u00f1
  yi, Usmaan Sonko, ma nga woon d\u00e9mb ca ndajem nj\u00e0ppale Palestin ma \u00f1u
  doon amalee fa Espalaanaatu Jumaay Ndakaaru ju mag ji. Kur\u00e9l gees duppee Alliance
  nationale pour la cause palestinienne a ko doon amal. Kur\u00e9l googu, ci k\u00e0llaamay
  Kocc, mooy D\u00e9ggoob way-r\u00e9ew mi ngir j\u00e0ppale Palestin. Mbooloom junniy
  junni nit wuyusi woon na\u00f1u woote bi. R\u00e0\u00f1\u00f1ees na fay raayay Palestin
  ak Senegaal yu ndaw, am \u00f1u sol i tiset yees bind ci \u00ab Palestine libre
  \u00bb (Palestin dafa war a moom boppam).\\nCi k\u00e0dduy elimaanu j\u00ebwri\u00f1
  yi, C\u00e0mmug Senegaal b\u00ebggatu\u00f1oo yem kepp ciy wax. \u00d1oom, C\u00e0mmug
  Basiiru Jomaay Fay gi, dafa b\u00ebgg yokk taxawaayam ci wetu Palestin, \u00e0nd
  ak moom ci xeex bi muy xeex ngir afal boppam. Usmaan Sonko a ko xamle ca ndaje ma
  :\\n\u201cNguur gu bees gi, ci kilifteefu Njiitu r\u00e9ew mi, Njiitu r\u00e9ew
  mi, dafa j\u00ebl ndogalu j\u00e9ggi wax yeek j\u00e9ego yi Mbootaayu Xeex yiy j\u00ebl,
  waaye dafa taxaw ci sunu mbokki Palestin yi ngir xeexle neen.\u201d\\nSenegaal moo
  jiite Komite biy wattu \u00e0qi askanu Palestin li ko dale atum 1975 ba tey. Boobaak
  l\u00e9egi, seqi nay j\u00e9ego yu bari ngir taxawu Palestin. Elimaanu j\u00ebwri\u00f1
  yi f\u00e0ttali na d\u00e9mb bi ci mujj, mooy ca atum 2016, bi Senegaal defee pexe
  ba \u00f1u wote d\u00e9ggoo buy daan Israayel ci li muy w\u00e9y di s\u00e0cc suufi
  Palestin yi. Waaye, bees sukkandikoo ci k\u00e0dduy Usmaan Sonko, r\u00e9ewum Afrig-dii-Sidd
  moo g\u00ebn a sori xeexal Palestin. Ndax, Njiiti Afrig-dii-Sidd yi dem na\u00f1
  ba dog seen i j\u00ebflante ak Israayel, dippee leen r\u00e9ew muy j\u00ebf i pekk
  \u00f1eel nit (crimes contre l\u2019humanit\u00e9). Moom, Usmaan Sonko, j\u00e0pp
  na ni r\u00e9ew yiy j\u00e0ppale Palestin da\u00f1u war a booloo, bennoo ngir g\u00ebn
  a m\u00ebn a taxawu Palestin, dakkal nooteel ak too\u00f1aangey Israayel yi \u00f1eel
  Palestin. Ngir loolu m\u00ebn a \u00e0ntu, Usmaan Sonko dafa gis ne f\u00e0ww r\u00e9ewi
  jullit \u00f1i booloo ngir m\u00ebn a j\u00e0mmaarlook seen i noon. Daf ne :\\n\u201cDanu
  war a r\u00e0\u00f1\u00f1atle mbirum diine ji ak mbirum p\u00f3litig ngir booloo
  ngir def wenn say, m\u00ebn a aar sunu bopp.\u201d\\nUsmaan Sonko \u014b\u00e0\u00f1\u00f1
  na tamit taxawaayu r\u00e9ew yiy wootewoo demokaraasi te i seetaan Israayel miy
  fitnaal Palestin. Ciy waxam, mbir mi dafa mel ni \u00ab Kumba am ndey, Kumba amul
  ndey \u00bb. Ndax, ba tey ciy waxam, danu nekk ci \u00ab \u00e0dduna su m\u00e0ndoodi
  sos, \u00f1iy wootewoo demokaraasi ak a taafantoo \u00e0qi doom-aadama \u00f1ooy
  j\u00e0ppale Israayel \u00bb.\\nKi jiite kur\u00e9l gi woote ndaje mi, Mustafaa
  Se\u00f1aan, j\u00ebl na fa k\u00e0ddu gi, di woo Saa-Senegaal y\u00e9pp, ak lu
  \u00f1u m\u00ebn di g\u00ebm, \u00f1u bennoo ngir Palestin m\u00ebn a moom boppam.\\n\u00c0mbaasad\u00eberu
  Palestin bi nekk Ndakaaru, Naseer Jaddalaa, rafetlu na farle bi askanu Senegaal
  farle wow Palestin, rawatina ci jamono jii nga xam ne, Israayel dafa def \u00ab
  blocus \u00bb p\u00e0qu ((\u00f1u ba\u00f1 ko jaawale ak baatu p\u00e0kk). Gaza
  bi. Rafetlu na tamit teewaayu elimaanu j\u00ebwri\u00f1 yi ci ndaje mi. Ndax, ci
  li mu wax, wii yoon mooy gul\u00e9et ci mboorum Senegaal ag kilifa gu bokk ci C\u00e0mm
  gi di fekkee ndaje mu ni mel.\\nCig p\u00e0ttali, atum 1947 la Mbootaayu Xeet yi,
  ci coobarey boppam, r\u00e0ccal Israayel ag mberaay biir mberaayu Palestin. Diggante
  1949 j\u00e0pp 1967, Israayel, ci ndimbalu saa-amerig yi ak yenn r\u00e9ewi tugal
  yi, jaay doole waa Palestin, nangu p\u00e0cc bu bari ci seen suuf. Noonu la ko yawuudi
  siyonist yi j\u00e0ppe ba jonni-Y\u00e0lla-tey jii nga xam ne, Palestin, dara desatu
  ci lu dul ab p\u00e0q. Keroog gaawu 7 oktoobar 2023 nag, yemook b\u00e9s bi Israayel
  di m\u00e0ggal Yom Kippour, Hamas dafa songoon Israayel, rey fa \u00f1u bari. Israayel
  daldi fayu ci anam bu j\u00e9ggi dayo te, boobaak l\u00e9egi, mi ngi w\u00e9y di
  xoqatal Palestin.\"", "\"Njiitu r\u00e9ew mi Maki S\u00e0ll woote na am ndajeem
  j\u00ebwrin yi ci altine tey ji. Ginnaaw aksida\u014b bu metti bi am ca diwaanu
  Kafrin la j\u00ebl ndogal li. Aamadu Ba, magum j\u00ebwrin yi moo koy jiite. Fukk
  ak jur\u00f3om-\u00f1aari j\u00ebwrin ak yeneen i kilifa \u00f1oo koy teewe ngir
  j\u00ebl i ndogal yu leer \u00f1eel dem beek dikk bi.\\nW\u00c9R-GI-YARAM\\n\u00c0nd
  G\u00ebs\u00ebm (kur\u00e9li doktoor yi) ajandi na \u00f1etti fanu \u00f1axtu yi
  mu nammoon a amal (10, 11 ak 12 sa\u014bwiyee 2023) ba ci fani 17, 18 ak 19 sa\u014bwiyee.
  Ci y\u00ebgleem bi mu g\u00e9nne, ma ngay \u00f1aax askan wi mu dem mayeji dereet
  ca Kafrin ngir xettali way-loru yi ci aksida\u014b bi ak di s\u00e0kku ci j\u00ebwrin
  ji mu s\u00e0mmoonteek dige yi.\\nMBIRI PAAP AALE \u00d1A\u014a\\nBa tey ci seen
  xeex ngir \u00f1u b\u00e0yyi Paap Aale \u00d1a\u014b, \u00f1ii di waa CAP (Coordination
  des Associations de Presse) a nga woon ca Tuubaa. Xalifa ba, S\u00ebri\u00f1 Muntahaa
  Mb\u00e0kke moo leen doon dalal. Waaye fii mu nekk, taskati xibaar yaa nga cay joxo\u00f1
  takk-der yi. \u00d1a nga leen di tuumal ni da\u00f1 fa buruxlu, doon coytu seen
  ub waxtaan ak kilifa gi.\\nXEW-XEWI JAMONO\\nJamono yii nag, Senegaal g\u00e9pp
  a nekk ci tiis ndax aksida\u014b bu mettee metti bi am ca Kafrin. \u00d1aari biis
  yu yab i nit ba fees \u00f1oo mb\u00ebkkante ba lu \u00ebpp 50i nit \u00f1\u00e0kk
  ci seen i bakkan. Jamono yii nag, Njiitu r\u00e9ew mi Maki S\u00e0ll dekerete na
  \u00f1etti faniy d\u00ebj (9, 10 ak 11 sa\u014bwiyee 2022) ci r\u00e9ew mi.\"",
