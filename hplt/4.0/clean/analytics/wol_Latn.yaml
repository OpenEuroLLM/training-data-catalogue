  s- : k\u00ebrwet b-. dafay jayaale ay sippax.\\nsippi : b\u00e0yyi l\u00e9pp lu
  bon li nga doon def. moo fi d\u00e0qoon a m\u00e0ndi w\u00e0nte sippi na l\u00e9egi.\\nsipp
