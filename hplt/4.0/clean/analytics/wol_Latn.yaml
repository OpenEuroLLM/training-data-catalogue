  wax tamit goowe g-. (seetal goowe)\\ngox b- : ko\u00f1u d\u00ebkku tax b-. seen
  gox bi amul ay l\u00e0mpi mbedd.\"", "\"Kur\u00e9l gu mag guy saytu wote yi fi Senegaal,
  Direction g\u00e9n\u00e9rale des \u00e9lections (DGE), siiwal na toftale yiy jo\u014bante
  ci wotey Ngomblaan yees randalsi, \u00f1u war a am keroog 17i pani now\u00e0mbar
  2024.\\nCa nj\u00eblbeen ga, 48i toftale yu ay l\u00ebkkatooy l\u00e0ngi p\u00f3litig
  ak i lawax yuy demal seen bopp la DGE jotoon. Ginnaaw bi leen kur\u00e9l gi saytoo,
  41i la ci j\u00e0ppagum, d\u00e0qandi ci jur\u00f3om-\u00f1aar (7). \u00d1oo\u00f1ii
  \u00f1u g\u00e0ntalagum seen i toftale, mayees na leen wenn fan (24i waxtu) ngir
  \u00f1u j\u00e9bbal ag dabu (recours) fa m\u00e0kkaanu Ndajem ndeyu s\u00e0rtu r\u00e9ew
  mi. Bees ci tegee jur\u00f3om-\u00f1aari fan, Ndajem ndeyu s\u00e0rtu r\u00e9ew
  mi dina siiwal toftale yi war a bokk ci wotey d\u00e9pite yees d\u00ebgmal.\\nToftale
  yii nuy limsi la DGE j\u00e0pp. Li ci biir lonk yi nag, ay beqi la \u00f1eel mbindum
  tur yi ci wolof walla pulaar :\\n1. And liguey sunu rew [\u00c0nd ligg\u00e9ey sunu
  r\u00e9ew]\\n2. Senegaal kese\\n3. Rv naatangue [naataange]\\n4. Union des groupes
  patriotiques\\n5. Coalition Pole alternatif kiraay ak natangue [kiiraay ak naataange]
  3\u00e8me voie\\n6. Coalition Xaal yoon [X\u00e0ll yoon]\\n7. Union citoyenne bunt-bi\\n8.
  Jubanti S\u00e9n\u00e9gal [Jubbanti Senegaal]\\n9. And ci koolute nguir S\u00e9n\u00e9gal
  (aks) [\u00c0nd ci k\u00f3olute ngir Senegaal]\\n10. Alsar\\n11. Coalition Nafoore
  S\u00e9n\u00e9gal [Senegaal]\\n12. Union nationale pour l\u2019int\u00e9gration,
  le travail et l\u2019\u00e9quit\u00e9 (U.N.I.T.E)\\n13. Samm sa gafaka-samm sa elleg
  acsif [S\u00e0mm sa gafaka-s\u00e0mm sa \u00ebll\u00ebg]\\n14. Coalition Wareef\\n15.
  Coalition Actions\\n16. Union Naatall kaaw-gui (u.n.k) [Naatal kow gi]\\n17. Coalition
  Dundu\\n18. La marche des territoires andu-nawle [\u00e0ndu-nawle]\\n19. Les nationalistes
  jel linu moom [j\u00ebl li nu moom]\\n20. Coalition Mankoo liggeeyal Senegaal (MLS)
  [M\u00e0nkoo ligg\u00e9eyal Senegaal]\\n21. Coalition Dekkal Teranga [Dekkal Teraanga]\\n22.
