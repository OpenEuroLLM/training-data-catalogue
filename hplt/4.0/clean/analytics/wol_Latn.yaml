  gor la, du laal mukk lu mu moomul.\\ngoro bu g\u00f3or b- : sama goro bu g\u00f3or
  laay seeti.\\ngoro bu jigeen b- : goro bu jigeen lay y\u00f3nne xaalis.\\ngoro b-
