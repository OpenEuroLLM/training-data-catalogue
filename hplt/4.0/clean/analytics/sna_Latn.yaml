  kutendeukira kuna Mwari,+\\n20 asi kuti tivanyorere kuti varege zvinhu zvakasvibiswa
  nezvidhori,+ ufeve,+ zvinhu zvakadzipwa+ uye ropa.+\\n21 Nokuti kubvira munguva
  yekare Zvakanyorwa naMosesi zvave zviine vanozviparidza muguta neguta, nokuti zvinoverengwa
  zvinonzwika musinagogi pamasabata ose.\u201d+\\n22 Vaapostora nevarume vakuru neungano
  yose vakabva vasarudza kutuma varume vakasarudzwa pakati pavo kuti vaende kuAndiyoki
  vaina Pauro naBhanabhasi, vanoti, Judhasi ainzi Bhasabhasi+ naSirasi, varume vaitungamirira
  pakati pehama;\\n23 uye vakanyora noruoko rwavo kuti:\u201cVaapostora nevarume vakuru,
  hama dzenyu, kuhama dziri kuAndiyoki+ neSiriya neKirikiya+ dzinobva kune mamwe marudzi:
  Kwaziwai!\\n24 Zvatakanzwa kuti vamwe vakabva kwatiri vakakunetsai nokutaura kwavo,+
  vachiedza kuvhiringidza mweya yenyu, kunyange tisina kuvapa chero mirayiridzo ipi
  zvayo,+\\n25 tabvumirana nomwoyo mumwe+ uye tasarudza varume vokukutumirai pamwe
  chete nevanodiwa vedu, Bhanabhasi naPauro,+\\n26 varume vakaisa mweya yavo pangozi
  nokuda kwezita raShe wedu Jesu Kristu.+\\n27 Naizvozvo tiri kutuma Judhasi naSirasi,+
  kuti ivowo vakuudzei zvinhu izvozvo neshoko romuromo.+\\n28 Nokuti mudzimu mutsvene+
  nesu tasarudza kusawedzera mumwe mutoro+ kwamuri, kunze kwezvinhu izvi zvakakodzera,\\n29
  kuti murambe muchirega zvinhu zvakabayirwa zvidhori,+ ropa,+ zvinhu zvakadzipwa+
  uye ufeve.+ Kana mukanyatsozvidzivirira pazvinhu izvi,+ muchabudirira. Sarai zvakanaka!\u201d\\n30
  Naizvozvo, varume ava pavakaregwa kuti vaende, vakaburukira kuAndiyoki, vakaunganidza
  vanhu vaya vazhinji, vakavatambidza tsamba yacho.+\\n31 Pashure pokuiverenga, vakafara
  nokukurudzira kwacho.+\\n32 Judhasi naSirasi, ivo zvavaivawo vaprofita,+ vakakurudzira
  hama nehurukuro zhinji, vakadzisimbisa.+\\n33 Naizvozvo, pavakapedza nguva yakati,
  hama dzakavarega vachienda norugare+ kune vaya vakanga vavatuma.\\n34 \u2014\u2014\\n35
  Zvisinei, Pauro naBhanabhasi vakaramba vari muAndiyoki+ kwenguva yakati vachidzidzisa
  nokuzivisa mashoko akanaka eshoko raJehovha,+ nevamwewo vazhinji.\\n36 Zvino pashure
  pemazuva akati Pauro akati kuna Bhanabhasi: \u201cKupfuura zvinhu zvose, ngatidzokere,
  tishanyire hama muguta rimwe nerimwe matakazivisa shoko raJehovha tione kuti dzakadini.\u201d+\\n37
  Kana ari Bhanabhasi, akanga akatsunga kuti aendewo naJohani, ainzi Mako.+\\n38 Asi
  Pauro haana kufunga kuti zvakanga zvakakodzera kuti vaende naiyeyu, zvaakanga avasiya
  kuPamfiriya+ uye akanga asina kuenda navo kubasa.\\n39 Vakabva vatsamwirana kwazvo,
  zvokuti vakabva vaparadzana; Bhanabhasi+ akaenda naMako nechikepe kuKupro.+\\n40
  Pauro akasarudza Sirasi,+ akaenda pashure pokunge agamuchidzwa nehama kumutsa usina
  kukodzera kuwanwa waJehovha.+\\n41 Asi akapfuura nokuSiriya nokuKirikiya, achisimbisa
  ungano.+\"", "\"Umambo hwekudenga inzvimbo yemufaro nekunakidzwa kusingaperi, isina
