sample: '["\"SHANGHAI, Nov 19 (SMM) - China yakatanga kushandisa magetsi ekugadzirisa
  kubva pakupera kwaSeptember, iyo yakagara kusvika kutanga kwaNovember.Mitengo yemagetsi
  negasi rechisikigo mumatunhu akasiyana siyana yakwira kusvika pakati pemwedzi waGumiguru
  pakati pesimba rekupa.\\nMaererano nekuongorora kweSMM, mitengo yemagetsi emagetsi
  uye gasi muZhejiang, Anhui, Shandong, Jiangsu nemamwe mapurovhinzi yakakwira nepamusoro
  pe20% ne40%.Izvi zvakasimudza zvakanyanya mutengo wekugadzira wemhangura semis indasitiri
  uye yakadzika pasi pekugadzirisa indasitiri yemhangura tsvimbo.\\nCopper cathode
  tsvimbo: Mutengo wegasi rechisikigo muindasitiri yemhangura cathode rod inoita 30-40%
  yemutengo wakazara wekugadzira.Mitengo yegasi yemusango muShandong, Jiangsu, Jiangxi
  nedzimwe nzvimbo yakawedzera kubva muna Gumiguru, nemutengo unowanikwa pakati pe40-60%/m3.Mari
  yekugadzira pa mt yekubuda kumabhizinesi ichawedzera ne20-30 yuan/mt.Izvi, pamwe
  chete nekuwedzera kwemitengo yevashandi, manejimendi uye kutakura zvinhu, zvakasimudza
  mutengo wakazara ne80-100 yuan/mt gore negore.\\nMaererano nekuongorora kweSMM,
  nhamba shoma yemhangura yemhangura yemiti yekugadzira mari yakasimudzwa zvishoma
  ne 10-20 yuan / mt munaOctober, asi kugamuchirwa nekudzika kwe enamelled wire uye
  tambo dzetambo dzakaderera.Uye mitengo chaiyo yakatengeswa yakanga isiri yakakwirira.Mari
  yekugadzira waya yemhangura yakakwira kune mamwe makambani madiki aishaya simba
  rekutaurirana pamusoro pemitengo.Pamiti yemhangura yemhangura, mitengo yemirairo
  yakareba yemhangura cathode inogona kukwira.Vazhinji vanogadzira copper cathode
  rod vanoronga kukwidza mari yegore rekugadzirisa pasi pezvibvumirano zvenguva refu
  ne20-50 yuan/mt.\\nMhangura ndiro/shizha uye tambo: Iyo nzira yekugadzira yemhangura
  ndiro / shiti uye mutsara unosanganisira kutonhora kukunguruka uye kupisa kupisa.Iyo
  inotonhora yekukungurusa inongoshandisa magetsi, inoverengera 20-25% yemutengo wekugadzira,
  nepo kupisa kukungurutsa maitiro kunonyanya kushandisa gasi rechisikigo uye shoma
  shoma yemagetsi, inoverengera inosvika gumi muzana yemutengo wakazara.Mushure mekukwira
  kwemitengo yemagetsi, mutengo wemt imwe yechando-yakakungurutswa ndiro / shiti uye
  tambo kubuda yakasimuka 200-300 yuan/mt.Kuwana mumitengo yegasi chaiyo kwakasimudza
  mutengo wendiro/shizha rinopisa-rakakungurutswa uye zvirimwa zvekubvisa ne30-50
  yuan/mt.Sekunzwisisa kwainzwisiswa neSMM, ingori nhamba diki yendiro yemhangura
  / pepa uye zvidyarwa zvemitsetse zvakakwidza muripo wekugadzirisa zvishoma kune
  vakati wandei kuzasi kwevatengi, nepo zvidyarwa zvakawanda zvakaona purofiti yakaderera
  pakati pemirairo isina simba kubva kumagetsi, zvivakwa uye misika yekunze.\\nCopper
  chubhu:Mutengo wekugadzira magetsi muindasitiri yemhangura chubhu unosvika makumi
  matatu muzana emutengo wakakwana wekugadzira.Mushure mekuwedzera kwemitengo yemagetsi,
  mutengo wakakwira kune vazhinji vevagadziri.Makuru epamba emhangura machubhu zvidyarwa
  zvakakwidza mari yavo yekugadzirisa ne200-300 yuan/mt.Nekuda kwemusika wepamusoro
  wemakambani makuru, maindasitiri epasi akamanikidzwa kubvuma mari dzepamusoro dzekugadzirisa.\\nCopper
  foil:Mutengo wemagetsi unosvika makumi mana muzana emutengo wakakwana wekugadzira
  muindasitiri yecopper cathode foil.Zvizhinji zvemhangura foil zvidyarwa zvakataura
  kuti avhareji mutengo wemagetsi wepeak uye off-peak nguva gore rino yakawedzera
  ne10-15% kubva panguva yakafanana gore rapfuura.Mari yekugadzira yemhangura foil
  zvidyarwa zvine hukama zvakanyanya nekudzika kwemvura kudiwa.\\nMuhafu yekutanga
  yegore, kudiwa kwaive kwakasimba kubva kumagetsi matsva nemagetsi emagetsi, uye
  mari yekugadzira yemiti yemhangura yemhangura yakakwira zvakanyanya.Sezvo kukura
  kwekudzika kwemvura kwakadzikira muchikamu chechitatu, mari yekugadzira yemhangura
  foil inoshandiswa mumaseketi emagetsi haina kuchinja zvakanyanya.Vagadziri veLithium
  bhatiri yemhangura yemhangura vakagadzirisa mari dzekugadzirisa kune mamwe makambani
  ebhatiri aida hupamhi hwefoil.\\nWaya netambo:Mutengo wemagetsi muwaya uye tambo
  indasitiri inokwana 10-15% yemutengo wakakwana wekugadzira.Hwose hwekubatanidza
  reshiyo yeChina waya uye tambo indasitiri yakaderera, uye kune yakanyanya kuwandisa.Mari
  yekugadzira inoramba iri pa10% yemitengo yese yechigadzirwa gore rese.Kunyangwe
  kana mutengo wevashandi, zvinhu, manejimendi uye zvinhu zvichikwira zvakanyanya,
  zvakaoma kuti mitengo yewaya uye zvigadzirwa zvetambo zvitevedzere.Saka nekudaro,
  purofiti kumabhizinesi inoparara.\\nNyaya dzakatevedzana dzakaitika muindasitiri
  yezvivakwa gore rino, uye njodzi yekushomeka kwemari yakawedzera.Mazhinji makambani
  ewaya netambo anongwarira pakutambira zvivakwa, uye anorega kubvuma mirairo kubva
  kumusika wezvivakwa nenguva refu uye njodzi huru yekubhadhara.Zvichakadaro, kudiwa
  muindasitiri yezvivakwa kwakaderera, izvo zvinozokanganisawo maitiro ekushanda kwemhangura
  cathode rod plants.\\nEnamelled waya:Kushandiswa kwemagetsi kwezvakakura enamelled
  waya zvinomera zvinoshandisa mhangura cathode kugadzira zvakapedzwa zvigadzirwa
  zvinoverengera 20-30% yemutengo wakazara wekugadzira, nepo mutengo wemagetsi we
  enamelled waya zvinomera zvinoshandisa zvakananga nyaya dzemhangura waya kwechikamu
  chidiki.Sekunzwisisa kweSMM, insulating varnish account ye40% yemutengo wakazara
  wekugadzira, uye kushanduka kwemutengo kune kukanganisa kukuru pamutengo wekugadzira
  waya enamelled.Mitengo yevarnish yekuisa insulating yakakwira zvakanyanya gore rino,
  asi makambani mazhinji muindasitiri yewaya enamelled haana kukwira mitengo yakatarisana
  nekukwira kwemitengo yevarnish inodzivirira.Kuwedzerwa kwekupa uye kushomeka kushoma
  kwakaganhurira mari yekugadzirisa waya enamelled kubva pakukwira.\\nNguva yekutumira:
  Nov-23-2021\"", "\"Zita reChigadzirwa: Standard Decorative Receptacle\\nMucherechedzo:
  Fahint\\nSector Sector: Yekugara / Yekutengesa\\nStandard: cULus UL Yakanyorwa\\nNyika
  Yekwakabva: China\\nWarranty: 2-Makore Yakaganhurirwa Warranty\\nProduct Width:
  1.30 mu 33.1mm\\nProduct Height: 4.17 mu 106.0mm\\nProduct Kudzika: 0.93 mu 23.6mm\\nVoltage:
  125V\\nAmpere: 20A\\nKwete-Tamper-Resistant\\nPasi: Kuzvigadzika\\nWire: Side uye
  kumashure waya inogamuchira #12- #14 AWG yakasimba\\n(Push-In Quick wire inogamuchira
  #14 AWG yakasimba copper waya chete)\\nBasa: Standard Duplex Style Outlet\\nWiring
  Type: Kuseri uye Side Wire\\nMamiriro Ezvakatipoteredza: 95% Humidity, UL 94 V2\\nNhamba
  yeNhamba: D20\\nTsanangudzo: 20 Amp, 125 Volt, Decorative Receptacle\\nIsiri-Tamper
  Resistant uye Yekugara & Yekutengesa giredhi Receptacle, UL Yakanyorwa\\nKuzvigadzika
  neAuto Copper Grounding Clip.\\nFast uye Nyore Kuiswa.\\nYakakwirira-inodzivirira-inodzivirira
  thermoplastic kuvaka inobvisa kutyora uye inowedzera hupenyu hwesevhisi\\nKusvikika
  kuri nyore kupatsanura wedunhu kutyora-kure tebhu inopa yakaparadzana wiring kumusoro
  uye kuzasi kwekubuda\\nTerminal screws akatsigirwa kunze uye akagadzirira waya:
  side wire terminals screw #12 - #14 AWG yakasimba waya;\\nkusunda-muwaya zviteshi
  zvinogamuchira #14 AWG yakasimba cooper waya chete;\\nRuvara rwakafanana nemadziro
  mahwendefa akabatanidzwa, 2-year warranty;\\nFireproof poly-carbonate imba inoderedza
  zvakanyanya njodzi yemoto. Chigadzirwa chine UL certification;\\nZvese zvekushongedza
  zvigadziro zvakagadzirirwa ne thermoplastic kuvaka uye inoratidzira isina kudzika
  yekuvaka kune yakanyanya wiring imba.\\nTamper resistant grounded Duplex receptacle
  inosangana ne2008 NEC zvinodiwa.\\nIyo Shutter meshini mukati mechibatiso inovhara
  kupinda kune vanobatika kunze kwekunge 2 prong plug yakaiswa,\\nkubatsira kuona
  hairpins, kiyi, nezvimwewo, zvichavharirwa kunze. Waya yekukurumidza inosaidzira
  mukati kana parutivi materminal waya.\\nKuvaka basa rinorema rinopa hurefu, husina
  matambudziko hupenyu hwesevhisi.\\nShutter meshini mukati memudziyo unovharira kupinda
  kune vanobatika kunze kwekunge maviri-prong plug akaiswa, achibatsira kuona hairpins,
  makiyi, nezvimwewo, anozovharirwa kunze.\\nChiratidzo cheTR pane zvigadziro zvekugara
  chinovimbisa kuti vanosangana nezvinodiwa neNEC ye2008\\nUltrasonic inorema-basa
  yekuvaka inopa hurefu, husina matambudziko hupenyu hwesevhisi\\nHeavy-gauge, simbi
  isingasviki simbi inokwirisa tambo\\nShallow dhizaini kune yakanyanya wiring imba\\nWallplate
  inotengeswa zvakasiyana\"", "\"Kereke yeUnited Methodist Church inoti yava kubvumidza
  nekutambira mukereke mayo vafundisi vanoita zvechingochani.\\nKwemakore makumi mana,
  kereke iyi yanga isingatambiri ngochani.\\nMumusangano wakaitwa nemusi weChitatu
  mudunhu reNorth Carolina, muAmerica, vakuru veKereke iyi vakavhota 692 \u2013 51
  vachibvuma kubvisa mitemo yekereke yavo yakadzikwa makore anopfuura makumi mana
  adarika inorambidza hungochani ne vafundisi vanoita zveungochani.\\nMufundisi Gladman
  Kapfumvute, veUnited Methodist Church yemu Maryland, muno muAmerica, vaudza Studio
  7 kuti nyaya iyi ihombe zvekuti kana kereke yeUnited Methodist muAmerica ikada kumanikidza
  vatendi vayo kwese kwese kuti vatambire ngochani, kereke iyi ichatsemuka nepakati
  sezvaida kuitwa nenhengo dzekereke iyi dziri muAfrica.\\nVati munyika dzakawanda
  muAfrica dzakaita seUganda kune mitemo inototongera rufu vanoita zvehungochani.\\nHuwandu
  hwevatendi vekereke iyi muAmerica vari kuramba vachidzikira asi muAfrica mune vatendi
  vakawanda.\\nForum\"", "\"1-10 Inch Supreme Wet Pro Threaded Diamond Core Drill
  Bits\\n1-10 Inch Supreme Quality Wet Pro Yakarukwa Diamond Core Drill Bits\\n1.
  Diamond Core Drill Bits Tsanangudzo\\nDhaimondi musimboti mabhiti ane matipi ekucheka
  madhaimani anowanzo shandiswa pakuchera makomba mumidziyo yakaita sekongiri, dombo,
  uye asphalt;yaishandiswawo sekugadzira maburi Mumhando dzakasiyana-siyana dzakaoma
  kucheka zvinhu.\\nInoshanda neakona grinder, core drill machine, kana standard drill.Mazhinji
  edhaimondi core drill bits anogadzirirwa kuoma / kunyorova kushandiswa, general
  chinangwa kuchera pane akasiyana zvidhinha, kongiri, block.Diamond core drill bits
  ane mhango pakati uye anoboora nekucheka gomba kunze kwechinhu chiri kucherwa, anoburitsawo
  \\\"plug\\\" imwechete, inova denderedzwa rayakacheka.\\nVTCB ndeyemhando yepamusoro
  yakatyisidzirwa core bits, general chinangwa application, laser welded, ine 10mm
  zvikamu kureba uye 12 \\\"core kureba uye mamwe arrel kureba anowanikwa mu12\\\",
  24\\\", 36\\\" uye 48\\\" .\\n2. Specificationiton yeVTCB Core Bits Series\\n3.
  Hunhu\\n- Laser welded, yepamusoro giredhi mhando pro core bits\\n- Inobvumira kuwedzera
  huwandu hwekuchera kudzika nekuenderera mberi kwechubhu yakarukwa mabhiti nemadhiramu.\\n-
  Kuwedzera kureba kwembiru kunogona kuwedzerwa paunenge uchichera zvakadzika, zvakafanana
  nekuchera mafuta.\\n- Standard threaded bits core kureba i12\\\" uye mamwe kureba
  kwembiru anowanikwa mu12\\\", 24\\\", 36\\\" uye 48\\\".\\n4. Zvishandiso Zvinokurudzirwa\\nYakakura
  kune akasiyana kongiri, zvidhinha, block, dombo, asphalt\\n5. Kushanda Pamberi\\nYekushandisa
  pane akaiswa core rigs.\\n6. Chinangwa Mutengi\\nZvekushandisa pro kontrakta\\n7.
  Zvimwe Zvinyorwa\\n- Imwe dhayamita inogona kupihwa pakukumbira.\\n- Hub yekubatanidza
  inogona kugadzirwa;\\n- Hurefu hwechubhu hunogona kugadzirwa.\\n- Paint ruvara inogona
  kugadziriswa;\\n- Prviate label inogona kupihwa;\\n- Package inogona kugadzirwa.\"",
  "\"Nei zvakakodzera kushanda nesu?\\nIsu tiri kambani inoshandira mukutengesa nekuparadzira
  kushambadzira uye zvipfeko zvebasa. Isu tinopa kuisa kwete chete zvipfeko, asiwo
  machira anoshandisa nzira kombasi yemakomputa uye kudhinda kwemuchira\\nVashandi
  vedu vanokwanisa vane makore mazhinji eruzivo vanofara kubatsira uye kuraira mukugadzirwa
  uye kusarudzwa kwemaitiro akanakisisa ekumaka. Tine ruzivo rwakakura mukusona, kucheka
  nekugadzira masimendi ekushambadzira uye mhando dzakakurumbira.\\nKubva 2003, tanga
  tichirovera kusona, kucheka, kusona nekunyora mabhebhi masevhisi. Tine yedu yekusona
  imba uye muchina paki yekumonera. Tine zvigadzirwa zvakasiyana-siyana - anopfuura
  zviuru zvitanhatu zvigadzirwa, zvekupfeka zvekushambadzira uye zvipfeko zvekushambadzira
  kubva kune vagadziri vanozivikanwa pamitengo inoratidzika chaizvo. Unogona kutenga
  zvese zvipfeko uye kunyora sevhisi masevhisi (tapota taura nesu kumberi kuti uwane
  zvinodiwa kuti utore pfungwa) pane yedu webhusaiti. www.pm.com.pl kana muchitoro
  chedu paAllegro \\\"PRODUCER-BHP\\\".\\nImba yedu yekusona inova nechokwadi chekuti
  zvigadzirwa zvatinogadzira zvakagadzirwa neyemhando yepamusoro machira ane zvakanaka
  zvinoshanda zvinoshanda uye yakanyanya kufaya dhayeti uye kupedzisa matekinoroji.
  Isu tinokwanisa kusangana nemakontrakta anonyanya kudiwa kuburikidza nekushandisa
  zvinobudirira kwemidziyo iripo isu.\\nIsu tinoshanduka-tinogamuchira nekukurumidza
  kune zvinodiwa nevatengi - mune zvese mukugadzira uye zvinhu zvakarongeka. Isu tinopa
  iyo yekushongedza embroidery uye Screen kudhinda zvese pane zvigadzirwa zvakatengwa
  mudura redu uye zvinounzwa nemutengi. Uyezve, nekunyoresa pane yedu webhusaiti,
  paunenge uchigadzira kutenga, unogona kuwana imwe yekudzikisira kubva kune yechipiri
  kuraira.\\nIsu tinouya kune yega yega kurongeka, tichitarisa maitirwo azvo pamatanho
  ese. Isu tinovaka kuvimbika kwedu pakukurukurirana pachena nevatengi uye nyanzvi
  yekutarisira kwakachengeteka.\\nKugadzirwa kwemhando dzakasiyana dzezvipfeko - kusanganisira
  zvipfeko zvehunyanzvi - chinongova chikamu cheatinopihwa. Sechikamu chekubatana,
  vatengi vedu vanogashirawo mukana wekushandisa mamwe mabasa mazhinji. Isu tinoshandawo
  zvine simba seye embroidery semusangano, icho chimwe chezvikonzero zvedu zvikuru
  zvekuzvikudza.\\nComputer embroidery ndiyo yakanakisa mhando, yakajeka uye yakasimba
  nzira yekuraina zvipfeko. Tichishandisa zvivakwa zvehunyanzvi zvehunyanzvi, isu
  tinokwanisa kugadzira chero ipi, kunyangwe yakanyatsojeka nzira yehukuru chero pane
  zvipfeko zvehukuru chero hupi. Isu tinogadzira embroidery kunyorera pane akawanda
  mhando dzezvipfeko (polo shira, T-shirts, zvipfeko zvebasa, apuroni, matai, mashanga).
  Hatigumiswe nerudzi rwezvipfeko chero - fekitori yedu ine nyanzvi yekusona uye yekucheka
  kamuri, saka isu tine zvakakwana zvekudzora pamusoro pehunhu hwezvatinokugadzirira
  iwe. Iko mukana unopihwa nekombiyuta embroidery semusangano ndeye mukana mukuru
  wekambani inoshanda iyo yePoland musika wekushambadzira uye kushambadzira.\\n- Helukabel\\n-
  Mercedes-Benz\\n- Grimbergen\\n- Purina ProPlant\\n- Kupurura\\n- Honda\\n- Heineken\\n-
  Orlen\\n- 1minute Jacobs\\n- Bosch\\n- Bridgestone\\n- Muchengetedzo weStock\\n-
  Warka\\n- \u017bywiec\\nnezvimwe zvakawanda. Zvizhinji kuti uone mune edu shopu.
