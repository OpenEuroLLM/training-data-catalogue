  \u0115lsan \u0103lx\u0103rir \u0161\u0103ddij\u0103n m\u0103ll\u0103n, \u0103sim\u0103\u0263m\u0103\u0263\u0103n,
  \u0115jbas\u0103n s-tim\u0115nt\u0115kawen n-or\u0103\u0263. 7Ikfa iyy\u0103n d\u0103\u0263
