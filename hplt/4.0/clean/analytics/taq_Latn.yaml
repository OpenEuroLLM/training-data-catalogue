  n-\u0103lxurm\u0103t n-M\u0103ssin\u0103\u0263 d-t\u0103rna-net, \u0103bas \u0103ddoob\u0103t
  \u0103wad\u0115m w\u0103l'' iyy\u0103n uj\u0115\u0161 n-eh\u0103n n-\u0103mudd wa
