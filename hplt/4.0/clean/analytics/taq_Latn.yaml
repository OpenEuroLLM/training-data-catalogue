  49I\u1e93\u1e93\u0103l \u0103fuss d\u0103\u0263-tan\u0103mh\u0103la n-in\u0115\u1e6d\u1e6dulab-net
  t\u0115zzar, inn\u0103: \\\"\u018enh\u0115yw\u0103t-t\u0103n-ak, anna-nin d-ay\u0115tma-\u0263!
