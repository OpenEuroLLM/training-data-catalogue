  dihen, ad-udab\u0103t ter\u0103\u1e93\u1e93e n-eh\u0103n, aw\u0115y a-wa t-ih\u0103n.
  30Ere hi-w\u0103r\u0103n irha-d\u0103\u0263, a-di, a\u0161\u0103njo-nin; ere da\u0263
