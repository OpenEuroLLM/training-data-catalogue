  m\u0103\u0161an, \u0103ssof\u0103\u0263 ad-t\u0115jr\u0115w\u0103m t\u0103dabit
  n-ad-hin-sasaw\u0103\u1e0d\u0103m \u0103ddin\u0103t m\u0103jr\u0103d f\u0103lla-w\u0103n
