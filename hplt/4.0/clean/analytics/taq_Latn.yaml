  awal\u0103n w\u0103ren \u0103tw\u0103ssan, ma s-mad-inf\u0115w a-wen? W\u0103dden
  ufa ad-k\u0103w\u0103n-s\u0115fh\u0115m\u0103\u0263 a hi-dd-\u0103sin\u0103fal\u0103l
