  i Yaqub: \u00ab\u018fqq\u0259l akal \u0259n marawan nak, \u0263ur a\u0263aywan n
  abba nnak, \u0259\u1e63\u1e63ana da\u0263 ak.\u00bb\\n4\\nI\u0263ra ddu Yaqub Raxil
  \u0259d Leyya s \u0259\u1e63uf wa iha \u0259nta d aharay-net wa \u0259n\u1e0d\u0259rran.\\n5\\nI\u1e47\u1e47
  asnat: \u00ab\u018fgr\u0259\u0263 in as \u0161i\u1e43\u0259t\u0259kw\u0259yen n
  abba nnakmat w\u0259r di \u0259\u1e47fenat \u0161ilat n anin, mi\u0161an M\u0259\u0161\u0161ina
  n abba nin illa \u0263ur-i.\\n6\\nT\u0259\u1e63\u1e63anmat i\u1e43an nakmat as w\u0259r
  din \u0259glema da\u0263 t\u0259\u0263urad in wala, y \u0259\u0161\u0161\u0259\u0263\u0259l
  n abba nnakmat.\\n7\\nMi\u0161an iyy\u0259wan i t\u0259kaddilt, iyy\u0259wan \u0259s\u0259\u1e43\u1e43\u0259tt\u0259y
  n alxaqq in. Mi\u0161an w\u0259r t''ikfa M\u0259\u0161\u0161ina turagat n a di agu
  \u0259\u0161\u0161ur.\\n8\\nS \u0259mm\u0259k en da kud a i\u1e47\u1e47a win \u0161a\u0263arnen
  a \u0259\u1e43osnen alxaqq in, ket-nasnat t\u0259ntawen erawnat du ik\u0259rwatan
  \u0161a\u0263arnen, kude\u0263 i\u1e47\u1e47a win gol\u0259nditan a i\u1e43osan
  alxaqq in \u0259nta da t\u0259ntawen erawnat du ik\u0259rwatan \u0259ganen igol\u0259nditan.\\n9\\nM\u0259\u0161\u0161ina
  i\u1e43an-net as di ikfa da\u0263 aharay n abba nnakmat\\n10\\nDa\u0263 tamert ta
  n sabdar \u0259n t\u0259menesen ad \u0259naya da\u0263 t\u0259rg\u0259t isawalan
  \u0259ganen \u0259gol\u0259nditan \u0259d wiyyad \u0161a\u0263arnen \u0259d wiyyad
  farfoznen, as \u0259zagan t\u0259ntawen n aharay a.\\n11\\nI\u1e47\u1e47''i angalos
  \u0259n M\u0259\u0161\u0161ina da\u0263 t\u0259rg\u0259t \\\"Yaqub\\\" \u018f\u1e47\u1e47e\u0263-as
  \\\"hun\\\".\\n12\\nI\u1e47\u1e47''i: \\\"\u018fdk\u0259l a\u1e63awad nak, ad tagga
  isawalan win \u0259zagnen t\u0259ntawen n aharay \u0259gan \u0259gol\u0259nditan,
  \u0161a\u0263era made\u0263 farfoza. Adi w\u0259r t id''eway ar as \u0259naya a
  wa dak iga Laban.\\n13\\nNak M\u0259\u0161\u0161ina \u0259n Betel wa dak d''inafalalan
  \u0263ur Betel edag wa da\u0263 t\u0259n\u0263ala widi f\u0259l t\u0259hunt, edag
  wa da\u0263 i t\u0259dkala arkawal. \u018fm\u0259r\u0259dda, \u0259\u1e47k\u0259r,\u0259g\u0323m\u0259d
  akal a, \u0259qq\u0259l akal \u0259n marwan nak.\u00bb\\n14\\nT\u0259\u1e47\u1e47a
  Raxil \u0259d Leyya i Yaqub: \u00abW\u0259r n\u0259la tadagart \u0259n t\u0259kasit
  da\u0263 abba nnana.\\n15\\nIdkal ana \u0161ilat \u0259n t\u0259magaren id inazzan
  dana\u0263 in iga, in\u0263a azr\u0259f wa din n\u0259nza, awalla za ar in\u0263
  ay, azr\u0259f wa as imm\u0259kkan a tu nilu.\\n16\\nDa\u0263 adi t\u0259g\u0259rgist
  kul ta dd''ibaz M\u0259\u0161\u0161ina da\u0263 abba nnana \u0161in maddan-n\u0259na.
  \u018fm\u0259r\u0259dda agu a w''as dak i\u1e47\u1e47a M\u0259\u0161\u0161ina.\u00bb\\n17\\nIsammatag
  Yaqub i t\u0259zrek, iss\u0259wan maddan-\u0259s \u0259d t\u0259\u1e0doden-net olaman,\\n18\\nizz\u0259rgaz
  ih\u0259rwan-net, eway \u0259rr\u0259z\u0259\u0263an kul win s\u0259r-\u0259s \u0259ggaznen
  da\u0263 Mesofotami, ikk'' akal wa n Kanan \u0263ur Isxaq abba nnet.\\n19\\nIkka
  Laban edagg \u0259n talazay \u0259n t\u0259\u1e0duft n aharay nnet, tokar du Raxil
  a\u1e63\u1e63\u0259na\u1e43an-net d\u0259ff\u0259r-\u0259s.\\n20\\nIkk\u0259rras
  Yaqub Laban wa n aw Aram s as i\u1e0d\u1e0d\u0259ggag d\u0259ff\u0259r-\u0259s w\u0259r
  das imel.\\n21\\nI\u1e0d\u1e0d\u0259ggag d a wa ila kul, i\u0263ras agarew wa n
  F\u0259rat, inn\u0259mad ikallan n \u0259d\u0263a\u0263an win Gilhad.\\n22\\n\u018fz\u0259l
  wa n karad igraw Laban isalan n \u0259\u1e0d\u0259gg\u0259g \u0259n Yaqub.\\n23\\nIlkam
  as \u0259nta \u0259d meddan \u0259n \u0161\u0259qqa\u0263an-net ewadan tu d\u0259ff\u0259r
  \u0259\u1e63\u1e63'' a\u1e0dan n \u0259\u0161ik\u0259l da\u0263 \u0259d\u0263a\u0263an
  win Gilhad.\\n24\\nAs ig'' ahad inafalal M\u0259\u0161\u0161ina i Laban da\u0263
  t\u0259rg\u0259t i\u1e47\u1e47''as: \u00ab\u018fnk\u0259d y ad taga arat i Yaqub
  g\u0259r ola\u0263 wala ibrar.\u00bb\\n25\\nAs ewad Laban Yaqub ikras ahaket-net
  da\u0263 akal wa n \u0259d\u0263a\u0263an \u0259n Gilhad. Iga Laban \u0259d meddan-net
  a wen da.\\n26\\nI\u1e47\u1e47a Laban i Yaqub: \u00abMa t\u0259ge da? T\u0259kk\u0259rrasa\u0263
  i, tewaya \u0161ibararen in as ta\u1e47\u1e47a \u0161im\u0259skasa n \u0259m\u0259g\u0259r?\\n27\\nMa
  f\u0259l du t\u0259\u1e0d\u0259ggaga da\u0263 \u0259ssir? Mas di t\u0259kk\u0259rrasa
  sas di w\u0259r t\u0259mela? \u018fnnar di t\u0259mala ayyaq qay tagla du da\u0263
  t\u0259d\u0259wit d a\u1e63ak daw maslan \u0259n tandiwen d \u0259\u1e47zadan.\\n28\\nW\u0259r
  di toyye\u0263 ad \u0259z\u0259l\u0259mme\u0263 ihayawan in \u0259d t\u0259bararen
  in, aga\u0263 asan \u0161iwa\u1e6driwen. T\u0259ge\u0263 t\u0259\u1e43\u0259t\u0259kw\u0259yt
  n \u0259mesk\u0259l!\\n29\\n\u018fle\u0263 f\u0259rregat n ad awan \u0259\u0263\u0161ada.
  Mi\u0161an \u0259n\u1e0dod imm\u0259grad s\u0259r-i M\u0259\u0161\u0161ina n abba
  nnak, i\u1e47\u1e47''i: \\\"\u018fnk\u0259d y ad taga\u0263 arat i Yaqub g\u0259r
  ola\u0263 wala ibrar.\\\"\\n30\\n\u018fgre\u0263 teklay nak f\u0259las \u0259\u1e63uf
  a kay iggazan n a\u0263aywan nawan mi\u0161an ma f\u0259l tokara du a\u1e63\u1e63anaman
  in?\u00bb\\n31\\nI\u1e47\u1e47a Yaqub i Laban: \u00abAwalla, t\u0259ks\u0259da a
  \u0259ge\u0263 as a da\u0263 i tab\u0259za a\u0161\u0161-ek \u0259s t\u0259\u0263urad.\\n32\\nDa\u0263
  batu n a\u1e63\u1e63anaman nak i \u0263ur tan du t\u0259grawa ad a\u1e43\u1e43at!
  S\u0259ff\u0259t\u0259kt\u0259k a wa \u0259le t\u0259dk\u0259la a wa t\u0259le dat
  t\u0259giyyawen n aytedan nana!\u00bb W\u0259r i\u1e63\u1e63en Yaqub as Raxil a
  du tokarat a\u1e63\u1e63anaman.\\n33\\nIgla Laban isaffataktak ehan wa n Yaqub d
  ahan wa n Leyya \u0259d wa n t\u0259wahayen-net an \u1e63anatat, w\u0259r igrew
  wala. \u0194ur ag\u0323amad-net ehan wa n Leyya iggaz wa n Raxil. \u018fnta Raxil
  a t\u0259dkalat a\u1e63\u1e63anaman t\u0259\u0263bar tan da\u0263 t\u0259xawit-net,
  t\u0259qqim da\u0263-as. Adi da f\u0259l t\u0259\u1e47\u1e47a y abba-net assa\u0263a
  wa d''iggaz \u0161in \u0259s\u0259ff\u0259t\u0259kt\u0259k n ahaket-net: \u00abAd
  w\u0259r t\u0259\u0161\u0161\u0259ka abba nin as w\u0259r \u0259bdeda \u0263ur iguz
  nak f\u0259las al\u0263adat a di t\u0259grawat.\u00bb Isaffataktak Laban ahaket-net
  kul mi\u0161an w\u0259r igrew a\u1e63\u1e63anaman-net.\\n36\\nIggaz alham Yaqub
  t\u0259zzar imm\u0259\u1e63tan \u0259d Laban i\u1e47\u1e47a: \u00abM\u0259ni a wa
  \u0259\u0263\u0161ada? Ma i\u1e43os abakkad in as di t\u0259hhore?\\n37\\nDa\u0263
  adi \u0259m\u0259r\u0259dda ad t\u0259saffataktaka ilalan nin kul ma du t\u0259grawa
  t\u0259leq qu? Sakn''ay y aytedan in \u0259d win nak ad aggayen f\u0259l a wa illan
  gar-ena!\\n38\\n\u018fm\u0259r\u0259dda \u1e63anatat t\u0259\u1e43\u0259rwen n awatay
  a \u0259ge \u0259lle \u0263ur-\u0259k. W\u0259r kala \u0259garnat ayf\u0259d nak
  wala w\u0259lli nnak, w\u0259r kala \u0259t\u0161e\u0263 ij\u0259\u0263al n \u0259s\u0259g\u0259n
  nak.\\n39\\nTe\u0263say nak \u0259t\u0161an w\u0259xsan w\u0259r dak du tiw\u0259ya
  il\u0259zgan-net, nak tat irazzaman da\u0263 t\u0259\u0263urad in id t\u0259\u1e0dgaza\u0263
  i g\u0259r t\u0259mmit\u0161a ehad wala ezal.\\n40\\nNak a t\u0259kaggay t\u0259fuk
  s azal, in\u0263''i asamed s ahad, a\u1e43aran faw i\u1e43\u1e43okar e\u1e6d\u0259s
  in.\\n41\\n\u018fmm\u0259k en da as da\u0263 \u1e63anatat t\u0259\u1e43\u0259rwen
  n awatay \u0161in \u0259ge \u0263ur-\u0259k: Maraw elan d \u0259kkoz taggalt \u0259n
  t\u0259bararen nak \u1e63anatat, \u1e63\u0259dis elan f\u0259l aharay-nnak, t\u0259yy\u0259wana\u0263
  \u0259s\u0259\u1e43\u1e43\u0259tt\u0259y n alxaqq in.\\n42\\nKundab'' as M\u0259\u0161\u0161ina
  n abba nin Ibrahin, wa iksud abba nin Isxaq as \u0259he\u0263 ta\u0263lift-net,
  illikan as \u0259m\u0259r\u0259dda t\u0259sta\u0263a\u0263 i da \u0259qquran fassan
  nin. Mi\u0161an M\u0259\u0161\u0161ina ogga arka\u1e47ay nin d iket n \u0259\u0161\u0161\u0259\u0263\u0259l
  i\u1e63\u1e63ohen wa dak \u0259ge, adi da f\u0259las \u0259\u1e47dod, immigrad da\u0263
  batu nin.\u00bb\\n43\\nI\u1e47\u1e47a Laban i Yaqub: \u00ab\u0160ibararen a \u0161i
  nnu, bararan a i nnu, eharay a i nnu, a wa t\u0259ha\u1e47\u1e47aya da kul i nnu.
  Mi\u0161an, \u0259m\u0259r\u0259dda, w\u0259r \u0259le batu f\u0259l t\u0259bararen
  in \u0259d bararan nasnat.\\n44\\n\u00abDa\u0263 a di \u0259m\u0259r\u0259dda n\u0259n\u0259m\u0259tk\u0259let
  arkawal \u0259n tassaq ad iqqal t\u0259giyya gar-i d\u0259r-\u0259k.\\n45\\nT\u0259zzar
  itkal Yaqub t\u0259hunt iss\u0259\u0263t-et \u0259s t\u0259zz\u0259gr\u0259t-net,
  t\u0259qqal t\u0259\u1e43\u0259tirt.\\n46\\nT\u0259zzar i\u1e47\u1e47a Yaqub y aytedan-net:
  \u00abAm\u0259dat-du \u0161ihun!\u00bb \u018fgan-tanat sakfaw, \u0259t\u0161an fall-as.\\n47\\nIga
  Laban i sakfaw wen e\u1e63\u0259m Y\u0259gar-Sahaduta (alma\u0263na sakfaw wa n
  t\u0259giyya), da\u0263 awal-net, ig-as Yaqub e\u1e63\u0259m \u0259ntada Galed (alma\u0263na
  sakfaw wa n t\u0259giyya).\\n48\\nI\u1e47\u1e47a Laban i Yaqub: \u00abSakfaw a \u0259n
  t\u0259hun a da \u0259nta i\u1e43osan t\u0259giyya gar-i d\u0259r-\u0259k azalada\u00bb,
  a di da f\u0259l iga e\u1e63\u0259m Galed.\\n49\\nIga e\u1e63\u0259m tolas Mitsfa
  (alma\u0263na edag n ag\u0323g\u0323az), id Laban i\u1e47\u1e47a tolas: \u00abAglet
  \u018fm\u0259li i\u0161i\u0161awalana a n\u0259ga da\u0263 \u0259n\u0259m\u0259ggag.\\n50\\n\u00abAs
  t\u0259jajjargana \u0161ibararen-in made\u0263 t\u0259zlafa \u0161iyyad \u0161i\u1e0doden,
  akt\u0259w i\u1e43an-nak as kud \u0263ur-na w\u0259r illa awedan da M\u0259\u0161\u0161ina
  a i\u1e43osan t\u0259giyya n arkawal wa n\u0259namatkal!\u00bb T\u0259zzar i\u1e47\u1e47a
  Laban i Yaqub: \u00abT\u0259hunt ta \u0259ss\u0259\u0263ta da \u0259s t\u0259zz\u0259gr\u0259t-net
  \u0259d sakfaw wa,\u0259ss\u0259bdadaq-qan gar-i d\u0259r-\u0259k, ad aggayyen as
  w\u0259r ana z-igg\u0259z i tan z-ak\u0259yan \u0259han tu arak \u1e43an.\\n53\\n\u00abM\u0259\u0161\u0161ina
  n Ibrahim d \u018fm\u0259li \u0259n Naxor \u0259l\u0259kanet-ana!\u00bb D\u0259ff\u0259r
  a wen ihad Yaqub \u0259s M\u0259\u0161\u0161ina wa iksud abba-nnet Isxaq ar ad-i\u1e6d\u1e6d\u0259f
  arkawal.\\n54\\nT\u0259zzar iga Yaqub takutay f\u0259l ad\u0263a\u0263, i\u0161\u0161edaw
  du s\u0259r-\u0259s i\u0161\u0161\u0259qqa\u0263an-net. \u018fdrawan-tat, \u0259nama\u1e47san
  ahad w\u0259 di f\u0259l ad\u0263a\u0263.\"", "\"Yaxya\\nYaxya 1\\nAwal wa imosan
  \u0259nnur \u0259d t\u0259m\u0259ddurt\\n2 Awal \u0259stizarat illa \u0263ur M\u0259\u0161\u0161ina.
  3-4 M\u0259\u0161\u0161ina ixlak-du s\u0259r-\u0259s arat kul; w\u0259r t-illa arat
  da\u0263 \u0259dd\u0259net wa s\u0259r- \u0259s du-w\u0259r-n\u0259xlek f\u0259las
  Awal \u0259nta a ihakkin t\u0259m\u0259ddurt ta t\u0259mosat \u0259nnur y aytedan.
  5 \u018fnnur imilawlaw da\u0263 \u0161iyyay eges indar-asnat ad t-an\u0263inat.
  6 Osa-dd'' al\u0259s iyyan igan es\u0259m Yaxya, a d-izimazal M\u0259\u0161\u0161ina;
  7 imos t\u0259g\u0259yya f\u0259l ad ammagrad s \u0259nnur wa, \u0259zz\u0259gz\u0259nan
  aytedan kul s aratan win igannu. 8 \u018fnta iman-net w\u0259r imos \u0259nnur,
  \u0259t\u0259w\u0259s\u0259gla \u0263as a d-iga imos t\u0259g\u0259yya f\u0259l
  ad ammagrad s \u0259nnur wa. 9 Awal wa \u0259nta a imosan \u0259nnur wa n tid\u0259t,
  wa d-ikkan \u0259dd\u0259net isim\u0259lul\u0259w aytedan kul. 10 \u018fnta a ihan
  \u0259dd\u0259net, ixlak-kat-du M\u0259\u0161\u0161ina s\u0259r-\u0259s, eges \u0259dd\u0259net
  w\u0259r tu-t\u0259qbel. 11 Osa-dd'' akal-net eges w\u0259r t-\u0259qbelan aytedan-net.
  12 Mi\u0161an win t-\u0259qbalnen kul, \u0259zz\u0259gzanan s\u0259r-\u0259s, win
  di ikf-en almaqam \u0259n ti\u0161it \u0259n bararan \u0259n M\u0259\u0161\u0161ina.
  13 W\u0259r \u0259qqelan bararan \u0259n M\u0259\u0161\u0161ina s \u0259mm\u0259k
  was garrawan aytedan bararan, kala kalar \u0259mosan-tan \u0259s t\u0259nna \u0259n
  M\u0259\u0161\u0161ina. 14 Wa imosan Awal, iqqal awedan ixsar \u0263ur-na, ikna
  t\u0259la n \u0259lxurma, imos m\u0259\u0161\u0161is \u0259n tid\u0259t. N\u0259sinagra
  \u0259t\u0259w\u0259s\u0259\u0263mar-net, sa\u0263mar wa igarraw Barar a n iyyanda
  \u0263ur Abba-net. 15 Igg\u0259yyat as Yaxya, i\u0161\u0161ewal s afalla ad igannu:
  \\\"Wa da\u0263 as \u0259he batu-net, assa\u0263a wa dawan-ganna: ''A dd-asu d\u0259ff\u0259r-i
  mi\u0161an ogar-i, f\u0259las dat-i da ill-ay''\\\". 16 Awalla ketnana n\u0259graw
  albaraka w\u0259r n\u0259la \u0259ddukad s \u0259lxurma-net ikmalan. 17 F\u0259las
  M\u0259\u0161\u0161ina ikf-ana\u0263 \u0259lqanun da\u0263 \u0259fus \u0259n Musa,
  \u0259lxurma \u0259d tid\u0259t osa-ddu d\u0259r-san \u0194aysa \u018flm\u0259six.
  18 W\u0259r t-illa awedan inayan M\u0259\u0161\u0161ina, mi\u0161an Barar a n iyyanda
  imosan M\u0259\u0161\u0161ina, illa \u0263ur Abba, \u0259nta a danaq-q-issosanan.\\n\u018f\u0161\u0161\u0259\u0263\u0259l
  wa iga \u0194aysa dat aytedan kul\\nT\u0259g\u0259yya \u0259n Yaxya wa isalma\u0263an
  da\u0263 aman\\n19 \u018fnta da t\u0259g\u0259yya ta iga Yaxya y arat da\u0263 limaman
  \u0259d K\u0259l-Lebi win d-\u0259falnen Yerusalam assa\u0263a wa tan-du-zammazalan
  muzaran \u0259n K\u0259l-\u018fly\u0259hud y ad t-\u0259ss\u0259st\u0259nan d awa
  imos. 20 W\u0259r ugay s a dasan-ajjawwab. Kala kalar idkal \u0259m\u0259sli-net
  s afalla inn-asan: \\\"Nak w\u0259r \u0259mosa\u0263 \u018flm\u0259six.\\\" 21 \u018fnnan-as:
  \\\"Ma t\u0259mosa za? Ilyas a t\u0259mosa?\\\" \\\"kala kala\\\" inn-asan, \\\"w\u0259r
  t-\u0259mosa.\\\" \\\"\u018fnn\u0259bi wa itt\u0259malan a t\u0259mosa?\\\" \\\"kala
  kala\\\" inn-asan, \\\"w\u0259r t-\u0259mosa.\\\" 22 T\u0259zzar \u0259nnan-as:
  \\\"Da\u0263 adi ma t\u0259mosa? Ihor a din-nasu aytedan win dana-d-\u0259ss\u0259glanen
  neway-asan aljawab n awa t\u0259mosa. Da\u0263 adi \u0259m\u0259l-ana\u0263 iman-nak.\\\"
  23 Inn-asan arat wa inna \u0259nn\u0259bi Isayas ir\u0259w: \\\"Nak, \u0259m\u0259sli
  a mosa n al\u0259s a d-isa\u0263aren da\u0263 \u0259suf igannu: ''Z\u0259zz\u0259lul\u0259\u0263at
  tarrayt y \u018fm\u0259li.''\\\" 24 Aytedan win \u0259hanen \u0259tt\u0259riqat
  \u0259n Farisaytan \u0259ntanay a du-zammazalnen \u0259s Yaxya. 25 \u018fss\u0259stanan-tu
  nammazalan win \u0259nnan-as: \\\"Ma f\u0259l t\u0259salma\u0263a\u0263 aytedan
  da\u0263 aman, kay t\u0259nne w\u0259r t\u0259mosa\u0263 \u018flm\u0259six, w\u0259r
  t\u0259mosa\u0263 \u0259nn\u0259bi wa itt\u0259malan?\\\" 26 Inn-asan: \\\"Nak \u0259salma\u0263a\u0263
  aytedan da\u0263 aman, mi\u0161an illa gar-ewan awedan w\u0259r t\u0259zdayam. 27
  \u018fnta du-z-asin d\u0259ff\u0259r-i, amaran awa di-iga da\u0263 \u0161igrat,
  arra \u0259n t\u0259m\u0259rkest \u0259n \u0263ateman-net, da w\u0259r t-eweda.\\\"
  28 Aratan win kul taggan da\u0263 amadal \u0259n Betani f\u0259l tagadamayt ta hadat
  t\u0259s\u0259ss\u0259ng\u0259yt \u0259n Yordan dad isalma\u0263 Yaxya aytedan.
  29 As iga \u0259z\u0259l wa hadan ogga Yaxya \u0194aysa izay-t-idu, t\u0259zzar
  inna: \\\"\u018fnta den aja\u0263ol \u0259n M\u0259\u0161\u0161ina wa itakkasan
  ibakkadan da\u0263 \u0259dd\u0259net. 30 \u018fnta as \u0259he batu-net as dawan-ganna:
  \\\"Al\u0259s iyyan ad d-asu d\u0259ff\u0259r-i, mi\u0161an ogar-i f\u0259las dat-i
  da ill-ay. 31 Nak iman-in w\u0259r t-\u0259zdaya mi\u0161an \u0259gle-du ad salma\u0263a\u0263
  aytedan da\u0263 aman, f\u0259l ad d-in\u0259fil\u0259l i K\u0259l-\u018fly\u0259hud.\\\"
  32 Igg\u0259yyat Yaxya tolas inna: \\\"\u018fswada da\u0263 Infas wa Z\u0259ddigan
  imos zun t\u0259dabert as d-izz\u0259bbat da\u0263 j\u0259nnawan iwar-tu. 33 Eges
  w\u0259r \u0259ssena harwa awa imos, mi\u0161an \u0259ssana\u0263 as imal-i M\u0259\u0161\u0161ina,
  s \u0259nta di-d-iss\u0259glan y ad \u0259salma\u0263a\u0263 aytedan da\u0263 aman,
  as: ''Ad t\u0259n\u0259ya\u0263 Infas wa Z\u0259ddigan as du-z-azzabbat i\u0263s\u0259r
  f\u0259l al\u0259s iyyan, al\u0259s w\u0259di \u0259nta a z-isalma\u0263an aytedan
  da\u0263 Infas wa Z\u0259ddigan.'' 34 \u018fm\u0259r\u0259dda arat wa \u0259nayaq-qu
  \u0259s \u0161ittawen-in; amaran \u0259gg\u0259yye silakana\u0263 as al\u0259s wa
  \u0259nta Barar \u0259n M\u0259\u0161\u0161ina.\\\"\\nInalkiman win azzarnen\\n35
  As iga \u0259z\u0259l wa hadan, iha Yaxya edag wa harwa da, \u0259nta \u0259d nalkiman-net
  \u0259\u0161\u0161in. 36 Ogga \u0194aysa as dagma-nasan d-illam, inna: \\\"\u018fnta
  den, aja\u0263ol \u0259n M\u0259\u0161\u0161ina.\\\" 37 \u018fslan nalkiman win
  \u0259\u0161\u0161in a i batu ta iga da, t\u0259zzar \u0259lkaman i \u0194aysa.
  38 Iswad-in \u0194aysa d\u0259ff\u0259r-\u0259s ogg-en \u0259lkaman-as, inn-asan:
  \\\"Mas t\u0259saggadam?\\\" \u018fnnan-as \\\"M\u0259nid t\u0259\u0263sara \u018f\u0161\u0161ix?\\\"
  39 Inn-asan \\\"Agliwat-du a tu-t\u0259n\u0259yam\\\". Itagg''awen tak\u0259st zagret,
  \u0259glan \u0259ddewan d\u0259r-\u0259s, \u0259nayan dad illa, t\u0259zzar \u0259ss\u0259ndan
  \u0263ur-\u0259s \u0259z\u0259l. 40 Meddan win \u0259\u0161\u0161in \u0259lkamnen
  i \u0194aysa d\u0259ff\u0259r tasalay ta gan y awal \u0259n Yaxya, iyyan da\u0263-san
  es\u0259m-net Andraw\u0259s, amadray \u0259n Sim\u0263on Butros. 41 Imm\u0259nay
  Andraw\u0259s d \u0259m\u0259qqar-net Sim\u0263on \u0259stizarat, t\u0259zzar inn-as:
  \\\"Nakkanay n\u0259mminay d \u018flm\u0259six.\\\" (alma\u0263na Kristos) 42 Amaran
  ilway-tu \u0259s \u0194aysa. Iswad \u0194aysa da\u0263 Sim\u0263on \u0263as inn-as:
  \\\"Kay Sim\u0263on, rur-es \u0259n Yaxya, ad taga\u0263 es\u0259m Kefas\\\" (es\u0259m
  wa ola \u0259d wa n Butros, alma\u0263na-net t\u0259hunt.) 43 As affaw ira \u0194aysa
  iki n amadal \u0259n Galilaya. Imm\u0259nay \u0259d Filibbus inn-as: \\\"\u018flk\u0259m-i.\\\"
  44 (Filibbus d Andraw\u0259s \u0259d Butros a\u0263r\u0259m-nasan iyyanda, es\u0259m-net
  Betsayda.) 45 Imm\u0259nay Filibbus \u0259d Natan\u0259yel inn-as: \\\"Nakkanay
  n\u0259mminay \u0259d was imm\u0259grad \u0259nn\u0259bi Musa da\u0263 \u018fttawret,
  \u0259mmigradan s\u0259r-\u0259s da k\u0259tban n \u0259nn\u0259bitan, a t-imosan
  \u0194aysa wa n ag Yus\u0259f wa n \u0259\u0263r\u0259m \u0259n Nazaret.\\\" 46
  T\u0259zzar inn-as Natan\u0259yel: \\\"Immikkan a\u0263r\u0259m wa n Nazaret a t-id-\u0259gm\u0259d
  arat ihossayan?\\\" Inn-as Filibbus: \\\"Ayaw t\u0259n\u0259ya.\\\" 47 Ogga \u0194aysa
  Natan\u0259yel izay-t-idu, inna: \\\"\u018fnta den awedan n Israyil wa n tid\u0259t,
  wa w\u0259r n\u0259t\u0259gg\u0259z ar tarrayt t\u0259zilala\u0263at.\\\" 48 Inn-as
  Natan\u0259yel: \\\"Mas di-t\u0259zdaya?\\\" Ijj\u0259wwab-as \u0194aysa inn-as:
  \\\"Harwa-kay-du w\u0259r i\u0263ra Filibbus, assa\u0263a wad t\u0259lle daw a\u0161\u0259k
  wa n t\u0259hena, da \u0259hannayaq-qay.\\\" 49 Inn-as Natan\u0259yel: \\\"\u018f\u0161\u0161ix,
  kay a imosan Barar \u0259n M\u0259\u0161\u0161ina, t\u0259mosa\u0263 \u0259m\u0259nokal
  n Israyil.\\\" 50 Inn-as \u0194aysa: \\\"T\u0259zz\u0259gzana f\u0259l as dak-\u0259nne\u0263
  \u0259hannayaq-qay daw a\u0161\u0259k \u0259n t\u0259hena; ad t\u0259n\u0259ya\u0263
  aratan wiyyad zawwarnen ogarnen wa.\\\" 51 T\u0259zzar inn-as: \\\"\u018fgg\u0259yye\u0263
  \u0259silakana\u0263-awan as d\u0259ff\u0259r awa ad t\u0259n\u0259yam ij\u0259nnawan
  \u0259nnolaman tagazzayan-tan angalosan, tazabben-du f\u0259l Barar n Awedan.\\\"\\nYaxya
  2\\nTakr\u0259st ta t\u0259gat da\u0263 \u0259\u0263r\u0259m \u0259n Kana\\n2 t\u0259zzar
  itawa\u0263rad-du \u0194aysa \u0259nta da, iddew-du \u0259d nalkiman-net \u0259s
  t\u0259kr\u0259st. 3 As ab-as d-iqqim wala da\u0263 esmad, t\u0259nna anna \u0259n
  \u0194aysa y as: \\\"Esmad i\u0263rad.\\\" 4 Inn-as \u0194aysa: \\\"Anna, t\u0259di
  a kam-w\u0259r-t\u0259dg\u0259z. Alwaq-in w\u0259r d-ewed.\\\" 5 T\u0259nna mas
  i ma\u0161\u0161a\u0263alan: \\\"Agat awa as dawan-inna kul.\\\" 6 \u018fskaran
  \u0259ddi s\u0259dis t\u0259kan taggazan aman as taggin K\u0259l-\u018fly\u0259hud
  \u0259z\u0259zd\u0259g wa imosan al\u0263adat-nasan. \u018fkkulu n iyyan itaggaz-t''
  \u0259ddukad \u0259n tameday \u0259n lit\u0259r. 7 Inn-asan \u0194aysa: \\\"\u018fdn\u0259yat
  it\u0259kan di aman.\\\" \u018fntanay de\u0263 \u0259dnayan-tan har fayyan. 8 Inn-asan
  amaran: \\\"\u018flk\u0259wat da\u0263-san \u0259m\u0259r\u0259dda y \u0259maway
  \u0259n saksas.\\\" \u018fgan awa dasan-inna. 9 As iram \u0259maway \u0259n saksas
  aman win \u0259mm\u0259ttaynen da, \u0259qqalan esmad, as w\u0259r issen iguz wa
  d-iga, mi\u0161an ima\u0161a\u0263alan win tan-d-\u0259lkawnen \u0259ss\u00e2nan,
  i\u0263ra \u0259m\u0259rmu\u0161, 10 inn-as: \\\"Im\u0259ss\u0259ksas kul esmad
  wa izodan a garrawan, amaran d\u0259ff\u0259r as filawasan \u0259gr\u0259wan wa
  isammakkanan. Eges kay t\u0259\u0263bara wa izodan har \u0259m\u0259r\u0259dda!\\\"
  11 \u018fnta \u0259ddi t\u0259lm\u0259\u0263jujat t\u0259mosat al\u0263alamat ta
  tazzarat immozal \u0194aysa. Ig-et da\u0263 \u0259\u0263r\u0259m \u0259n Kana ta
  n Galilaya. Isannafalal s\u0259r-\u0259s tarna-net, t\u0259zzar \u0259zz\u0259gzanan
  s\u0259r-\u0259s nalkiman-net. 12 D\u0259ff\u0259r awen iras a\u0263r\u0259m \u0259n
  Kafarnahum, \u0259nta \u0259d ma\u1e63, \u0259d m\u0259drayan-net, \u0259d nalkiman-net.
  W\u0259r da\u0263-as \u0259gen ar arat n adan.\\nAssa \u0259n \u0194aysa Ehan \u0259n
  M\u0259\u0161\u0161ina\\n13 As d-ihoz \u0259mud wa n Akkay imosan amud maqqaran
  \u0259n K\u0259l-\u018fly\u0259hud, igg\u0259zzay \u0194aysa \u0259s Yerusalam.
  14 Ogaz-in \u0194aysa da\u0263 afarag wa i\u0263layan Ehan \u0259n M\u0259\u0161\u0161ina,
  imassatagan \u0259n z\u0259gran, d ayf\u0259d, \u0259d t\u0259d\u0259bren, \u0259d
  t\u0259\u0263imiten \u0259n k\u0259l sanji. 15 ig'' \u0259l\u0259kkud \u0259s \u0263unan
  istaq-qan da\u0263 afarag w\u0259di ketnasan, \u0259ntanay d ayf\u0259d, \u0259d
  z\u0259gran, infaz da\u0263 amadal iz\u0259rfan \u0259n k\u0259l sanji, isabbambay
  t\u0259ss\u0259wen-nasan. 16 Imassatagan \u0259n t\u0259d\u0259bren \u0259ntanay
  inn-asan: \\\"\u018fkk\u0259sat awa da\u0263 adag a, ad w\u0259r tagim ehan n Abba-nin
  asammanay n \u0259ssuk.\\\" 17 \u018fktan-du nalkiman akatab \u0259n Daw\u0259d
  wa innan: \\\"Tara-nin ehan-nak t\u0259r\u0263a da\u0263-i \u0161ila \u0259n tamsay.\\\"
  18 \u018fss\u0259stanan-tu muzaran \u0259n K\u0259l-\u018fly\u0259hud \u0259nnan-as:
  \\\"M\u0259ni t\u0259lm\u0259\u0263jujat t\u0259mosat al\u0263alamat tas t\u0259fraga
  danaq-qat taga t\u0259sitaddat as t\u0259le\u0263 almaqam n ad taga\u0263 \u0259mazal
  di?\\\" 19 Ijj\u0259wwab-asan \u0194aysa inn-asan: \\\"Dagdagat Ehan \u0259n M\u0259\u0161\u0161ina
  di, a tid \u0259ss\u0259bd\u0259da da\u0263 karad adan.\\\" 20 \u018fnnan-as: \\\"Ehan
  \u0259n M\u0259\u0161\u0161ina di \u0259kkozat t\u0259m\u0259rwen n awatay \u0259d
  s\u0259dis a f\u0259l itawakras. Kay mas tu-za-t\u0259ss\u0259bd\u0259da da\u0263
  karad adan?\\\" 21 As inna Ehan \u0259n M\u0259\u0161\u0161ina da, \u0259nta ta\u0263\u0259ssa-net
  as igannu. 22 As d-inkar da\u0263 t\u0259mattant \u0259ktan-du nalkiman-net t\u0259nna
  ta iga adi. \u018fzz\u0259gzanan \u0259s K\u0259tban, d awal wa iga \u0194aysa.
  23 Aytedan aggotnen \u0259zzigzanan \u0259s \u0194aysa \u0263ur anay \u0259n t\u0259lm\u0259\u0263jujaten
  \u0161in as immozal da\u0263 adan win iga da\u0263 Yerusalam \u0263ur \u0259mud
  wa n Akkay. 24 Mi\u0161an ya \u0194aysa w\u0259r tan-ifles f\u0259las izday-tan
  ketnasan, \u0259nta 25 w\u0259r idd\u0259rar s i das-igan isalan n awedan id w\u0259r
  das-i\u0263ber awa ihan \u0259w\u0259l-net.\\nYaxya 3\\n\u0194aysa \u0259d Nikodemos\\n2
  Osa-ddu \u0194aysa ahad iyyan inn-as: \\\"\u018f\u0161\u0161ix-in, nakkanay n\u0259ssan
  as M\u0259\u0161\u0161ina kay d-izammazalan s\u0259r-na, a dana-t\u0259sassa\u0263ra,
  id w\u0259r t-illa i z-agin t\u0259lm\u0259\u0263jujaten \u0161in t\u0259ge, ar
  \u0259s t\u0259dh\u0259lt-net.\\\" 3 \u0194aysa de\u0263 inn-as: \\\"\u018fgg\u0259yye\u0263
  \u0259silakana\u0263-ak as: W\u0259r t-ill'' awedan ifragan anay \u0259n ta\u0263mar
  \u0259n M\u0259\u0161\u0161ina ar s ad ilas t\u0259hut. 4 Iss\u0259stan-tu Nikodemos
  inn-as: \\\"Mas du-z-il\u0259s awedan wa\u0161\u0161aran t\u0259hut? \u0160i t\u0259gat
  da w\u0259r ifreg ad il\u0259s tewa\u0263lay \u0259n t\u0259dist \u0259n mas.\\\"
  5 Inn-as \u0194aysa: \\\"\u018fgg\u0259yye\u0263 \u0259silakana\u0263-ak as: awedan
  w\u0259r ifreg iguz \u0259n ta\u0263mar \u0259n M\u0259\u0161\u0161ina ar s ad ihu
  s aman d Infas wa Z\u0259ddigan. 6 \u018fl\u0259s\u0259l n aggad\u0259m iyyan aggad\u0259m,
  amaran wa d-igmadan Infas wa Z\u0259ddigan, Infas wa Z\u0259ddigan a da\u0263-as
  innodan. 7 Da\u0263 adi a dak-w\u0259r-iqq\u0259n e\u0263af as dak-\u0259nne\u0263:
  Iwar-kawan ad t\u0259l\u0259sam t\u0259hut. 8 Adu igg\u00e2r sas ira, kay t\u0259salla
  y \u0259m\u0259sli-net, mi\u0161an w\u0259r t\u0259ssena sas d-iha wala sas idag.
  Samal di da a iha wa ihuwan s Infas wa Z\u0259ddigan.\\\" 9 Iss\u0259stan-tu Nikodemos
  inn-as: \\\"M\u0259ni tat t\u0259m\u0259wit tas z-agin aratan win? 10 Ijj\u0259wwab-as
  \u0194aysa inn-as: \\\"T\u0259mosa\u0263 \u0259musan z\u0259ww\u0259ran da\u0263
  Israyil eges w\u0259r t\u0259ssena\u0263 aratan win! 11 \u018fgg\u0259yye\u0263
  \u0259silakana\u0263-ak as: \\\"N\u0259tamagrad s awa n\u0259ssan, n\u0259tagayyat
  da f\u0259l awa n\u0259nay, eges tugayam s-ad t\u0259qb\u0259lam t\u0259g\u0259yya-nana.
  12 Dad w\u0259r t\u0259zz\u0259gzanam s awa dawan-ganna s \u0259dd\u0259net mas
  za t\u0259zz\u0259gz\u0259nam awa dawan ganna s alaxirat? 13 W\u0259r t-illa is
  kala inay ij\u0259nnawan, ar Agg Awedan wa tan-d-igmadan. 14 \u018fmm\u0259k was
  isaddakal Musa a\u0161\u0161ol \u0259n daro\u0263 \u0259s t\u0259g\u0259ttawt da\u0263
  taneray, \u0259mm\u0259k di da\u0263 as z it\u0259w\u0259s\u0259duk\u0259l Agg Awedan,
  15 f\u0259l ad iqq\u0259l as i s\u0259r-\u0259s izz\u0259gzanan, ad igr\u0259w t\u0259m\u0259ddurt
  ta t\u0259\u0263lalat. 16 Awalla, M\u0259\u0161\u0161ina ikna tara n \u0259dd\u0259net
  har as ikfad-du Barar-net a n iyyanda f\u0259l ad iqq\u0259l as i s\u0259r-\u0259s
  izz\u0259gzanan w\u0259r z'' ihl\u0259k, kalar ad igr\u0259w t\u0259m\u0259ddurt
  ta t\u0259\u0263lalat. 17 M\u0259\u0161\u0161ina w\u0259r d-issoka Barar-net \u0259dd\u0259net
  f\u0259l a tat-ihl\u0259k kalar issokas-tat-du f\u0259l a s\u0259r-\u0259s tafsu.
  18 I s\u0259r-\u0259s izz\u0259gzanan w\u0259r ihlek, mi\u0161an wa s\u0259r-\u0259s
  w\u0259r n\u0259zz\u0259gzan ihlak f\u0259las w\u0259r izz\u0259gzan s es\u0259m
  \u0259n Barar \u0259n M\u0259\u0161\u0161ina a n iyyanda. 19 \u018fnta \u0259ddi
  da iguz wa d-iga \u0259hluk: \u018fnnur osad-du \u0259dd\u0259net, mi\u0161an aytedan
  \u0259ssofan \u0161iyyay y \u0259nnur id taggin arak mazalan. 20 Amaran i itaggan
  a\u0263\u0161ud oglaf \u0259nnur, w\u0259r t-id-z-akku f\u0259las iksud ad n\u0259fil\u0259lan
  arak mazalan-net ezal a mallan. 21 Mi\u0161an wa itaggan arat wa imosan tid\u0259t,
  itakka-du \u0259nnur, f\u0259l ad it\u0259w\u0259n\u0259y, as \u0259mazal-net issind-ay
  da\u0263 l\u0259kkum i M\u0259\u0161\u0161ina.\\n\u0194aysa \u0259d Yaxya wa isalma\u0263an
  da\u0263 aman\\n22 D\u0259ff\u0259r awen ikka \u0194aysa \u0259d nalkiman-net amadal
  \u0259n Yahud\u0259ya. Iqqim da\u0263-as har iga arat n azzaman \u0259nta d\u0259r-san,
  amaran isalma\u0263 \u0194aysa aytedan da\u0263 aman. 23 Yaxya \u0259nta da isalma\u0263
  da\u0263 aman, da\u0263 Aynon, dagma \u0259n Salim, f\u0259las \u0259llan-t'' aman
  aggotnen den. Amaran tasin-t-id'' aytedan isalmaq-qan. 24 Arat wa as itaggu Yaxya
  harwa da w\u0259r iggez kasaw. 25 T\u0259nkar t\u0259mazaq g\u0259r nalkiman \u0259n
  Yaxya d iyyan da\u0263 K\u0259l-\u018fly\u0259hud, da\u0263 batu \u0259n t\u0259m\u0259witen
  \u0161in as itag zazdag. 26 \u018fkkan Yaxya \u0259nnan-as: \\\"\u018f\u0161\u0161ik-nana,
  t\u0259kitt\u0259wa al\u0259s wa d\u0259r t\u0259ddewa f\u0259l afay \u0259n Yordan
  wen sen, al\u0259s w\u0259di as dana t\u0259mm\u0259grada \u0259ddi? Tahannaya!
  Isalma\u0263 aytedan da\u0263 aman \u0259m\u0259r\u0259dda amaran kul takkin-tu!\\\"
  27 Ijj\u0259wwab-asan \u0194aysa: \\\"Awedan w\u0259r z-igr\u0259w ar awa t-ikfa
  M\u0259\u0161\u0161ina. 28 Kawanay iman-nawan t\u0259gg\u0259yyem-i as \u0259nne\u0263:
  ''W\u0259r \u0259mosa\u0263 \u018flm\u0259six, mi\u0161an tiwazamazala-du dat-\u0259s.''
  29 \u018fm\u0259rmu\u0161 \u0259nta \u0259ddi ilan t\u0259m\u0259rmu\u0161t, mi\u0161an
  \u0259midi n \u0259m\u0259rmu\u0161t, mi\u0161an \u0259midi n \u0259m\u0259rmu\u0161
  inkad dagma-net, issisam-as, ikna t\u0259d\u0259wit as isla y \u0259m\u0259sli-net.
  T\u0259d\u0259wit di za \u0161in-in, amaran \u0259m\u0259r\u0259dda t\u0259nda.
  30 \u018fnta a ihoran ad it\u0259w\u0259s\u0259\u0263m\u0259r nak \u0259m\u0259la
  daw-\u0259s. 31 Wa d-igmadan afalla, \u0259nta a ihhoken f\u0259l awedan kul, wa
  ihan \u0259dd\u0259net i n \u0259dd\u0259net. Wa d-igmadan ij\u0259nnawan, ihhokat
  f\u0259l awedan kul, 32 Igg\u0259yyat s awa inay d awa as isla mi\u0161an waliyyan
  iqbalan t\u0259g\u0259yya-net. 33 Wa iqbalan t\u0259g\u0259yya-net, isilakan awa
  inna M\u0259\u0161\u0161ina. 35 Abba ira Barar-net ig-as aratan kul da\u0263 \u0259fus.
  36 Wa izz\u0259gzanan \u0259s Barar \u0259n M\u0259\u0161\u0161ina igraw t\u0259m\u0259ddurt
  t\u0259\u0263l\u00e2lat, wa ugayan s a s\u0259r-\u0259s izz\u0259gz\u0259n amaran
  alham \u0259n M\u0259\u0161\u0161ina iha d\u0259r-\u0259s is\u0259lsa.\\\"\\nYaxya
  4\\n\u0194aysa \u0259d t\u0259ntut \u0259n K\u0259l Samar\u0259ya\\n1-3 \u018fslan
  Farisaytan as itawannu \u0194aysa igarraw inalkiman ogarnen win n Yaxya isalmaq-qan
  da\u0263 aman. (Arat wa imosan tid\u0259t as \u0194aysa iman-net w\u0259r is\u0259lmi\u0263
  awedan waliyyan da\u0263 aman, inalkiman-net a salma\u0263nen da\u0263 aman.) As
  isla \u0194aysa y awa itaqqalan, igmad amadal wa n Yahud\u0259ya, iqqal Galilaya.
  4 Dad t-ilzam imur n amadal \u0259n Samar\u0259ya, 5 os-in dagma \u0259n \u0160ixar,
  imosan a\u0263r\u0259m \u0259n Samar\u0259ya ihozan tawagost ta ikfa Yaqub i rures
  Yus\u0259f. 6 Edag wen \u0259nta a iha \u0259\u0263arus \u0259n Yaqub. As d-osa
  \u0194aysa edag wen ammasnazal, iddaz \u0259\u0161ik\u0259l, iqqim f\u0259l anu.
  7-8 As \u0259kkan nalkiman-net a\u0263r\u0259m y a dd-azzanzin te\u1e6d\u1e6day,
  t\u0259war-du t\u0259ntut \u0259n K\u0259l Samar\u0259ya du-t\u0259zragat anu en.
  Inn-as \u0194aysa: \\\"\u0160a\u0161w-i-d''.\\\" 9 T\u0259nn-as: \\\"Kay t\u0259mosa\u0263
  iyyan da\u0263 K\u0259l-\u018fly\u0259hud t\u0259gammaya da\u0263-i aman, nak t\u0259mosat
  iyyat da\u0263 K\u0259l Samar\u0259ya?\\\" 10 Inn-as \u0194aysa: \\\"\u018fnnar
  t\u0259ssana\u0263 arat wa ihakku M\u0259\u0161\u0161ina, amaran t\u0259ssana\u0263
  awa \u0259mosa nak wa kam itansayan aman \u0259n tassay, tansiya\u0263-i-tan kam,
  akfa\u0263-am-tan de\u0263 \u0259mosan win sidurnen. 11 T\u0259nn-as t\u0259ntut:
  \\\"\u018f\u0161\u0161ix-in, anu i zagren amaran kay w\u0259r t\u0259le\u0263 aga,
  da\u0263 adi m\u0259ni du-za-t\u0259gr\u0259wa\u0263 aman win di sidurnen di? 12
  \u0160igrat a t\u0259ge\u0263 \u0259maraw-nana Yaqub a dana\u0263-ikfan anu a, i\u0161wa
  aman-net, \u0259\u0161wan-tan maddan\u0259s d aharay-net?\\\" 13 Ijj\u0259wwab-as
  \u0194aysa: \\\"I i\u0161wan aman di, ad t-il\u0259s fad iguz, 14 mi\u0161an i i\u0161wan
  aman win tu-z-akfa, immizzay \u0259d fad, f\u0259las a da\u0263-as \u0259qq\u0259lan
  adri ingayan s aman win tu-hakkinen t\u0259m\u0259ddurt ta t\u0259\u0263lalat.\\\"
  15 T\u0259nn-as t\u0259ntut: \\\"Akf-i da\u0263 aman win di, f\u0259l a di-igm\u0259d
  fad, a du w\u0259r \u0259l\u0259sa\u0263 azarog n anu a da.\\\" 16 \\\"Aglu\\\"
  Inn-as \u0194aysa \\\"A\u0263rad-du al\u0259s-nam t\u0259qq\u0259la\u0263-i-du da
  da.\\\" 17 T\u0259nn-as: \\\"W\u0259r \u0259le\u0263 al\u0259s.\\\" Inn-as \u0194aysa:
  \\\"Tid\u0259t-nam as t\u0259nne w\u0259r t\u0259le\u0263 al\u0259s, 18 f\u0259las
  s\u0259mmos as kala tan-t\u0259le, amaran wa \u0263ur t\u0259lle\u0263 \u0259m\u0259r\u0259dda
  w\u0259rge\u0263 al\u0259s-nam. Tid\u0259t a di-t\u0259ge.\\\" 19 T\u0259zzar t\u0259nn-as:
  \\\"\u018fhannaya\u0263 as kay \u0259nn\u0259bi a t\u0259mosa. 20 Imarwan-nana ad\u0263a\u0263
  a da a f\u0259l \u0259\u0263badan M\u0259\u0161\u0161ina, mi\u0161an kawanay K\u0259l-\u018fly\u0259hud
  t\u0259nnam edag wa da\u0263 itawa\u0263bad M\u0259\u0161\u0161ina w\u0259di iha
  Yerusalam.\\\" 21 \\\"Tantut\\\" inn-as \u0194aysa, \\\"Z\u0259gz\u0259n-i, alwaq
  izay-du a da\u0263 w\u0259r za t\u0259\u0263abbadam Abba g\u0259r za f\u0259l \u0259d\u0263a\u0263
  wa, wala da\u0263 Yerusalam. 22 Kawanay K\u0259l Samar\u0259ya wa t\u0259\u0263badam
  w\u0259r tu-t\u0259zdayam, nakkanay K\u0259l-\u018fly\u0259hud wa n\u0259\u0263bad
  n\u0259zday-tu f\u0259las efsan iguz wa n K\u0259l-\u018fly\u0259hud a d-\u0259gan.
  23 Mi\u0161an alwaq izay-du --amaran osa-ddu-- was ina\u0263bidan win tid\u0259t
  ad \u0259\u0263b\u0259dan Abba s Infas wa Z\u0259ddigan \u0259d tid\u0259t, f\u0259las
  Abba ina\u0263bidan win t-\u0259\u0263badnen \u0259s t\u0259m\u0259wit ta, \u0259ntanay
  a ira. 24 M\u0259\u0161\u0161ina Infas wa Z\u0259ddigan a imos, amaran ina\u0263bidan-net
  ihor ad t-\u0259\u0263b\u0259dan s Infas wa Z\u0259ddigan \u0259d tid\u0259t.\\\"
  25 T\u0259nn-as t\u0259ntut: \\\"\u018fssana\u0263 as \u018flm\u0259six, itawann-as
  Kristos, a d-asu. As d-osa a dana\u0263-isassagru aratan kul.\\\" 26 Inn-as \u0194aysa:
  \\\"Nak a t-imosan, nak wa dam-i\u0161\u0161ewalan da.\\\" 27 Assa\u0263at ten \u0259nta
  a d-\u0259qqalan nalkiman, iqqan-asan e\u0263af im\u0259\u0161awal wa iga \u0259d
  t\u0259ntut. Mi\u0161an w\u0259r tan-iha i ihalan ad t-iss\u0259st\u0259n, ann-as:
  \\\"Ma da\u0263 as tare?\\\" made\u0263 \\\"Mafel t\u0259tim\u0259\u0161iwila d\u0259r-\u0259s?\\\"
  28 T\u0259zzar toya-ddu t\u0259ntut t\u0259t\u0259kint-net t\u0259qqal a\u0263r\u0259m
  t\u0259nna y aytedan: 29 \\\"Ayewat ad t\u0259n\u0259yam awedan a di-im\u00e2lan
  arat kul was kala ad t-\u0259ge, ifr\u00e2g as \u0259nta a imosan \u018flm\u0259six!\\\"
  30 T\u0259zzar \u0259gmadan-du a\u0263r\u0259m \u0259kkan \u0194aysa. 31 As itagg''
  awen inalkiman gammayan da\u0263 \u0194aysa ad at\u0161u, gannan-as: \\\"\u018f\u0161\u0161ix,
  at\u0161'' arat iyyan.\\\" 32 Inn-asan: \\\"Imensewan win z at\u0161a w\u0259r tan-t\u0259zdayam.\\\"
  33 Ad t\u0259n\u0259m\u0259nnin nalkiman gar-essan: \\\"\u018fng\u0259m \u0263as
  w\u0259rge\u0263 awedan a das-d-ewayan imensewan?\\\" 24 Inn-asan \u0194aysa: \\\"Imensewan-in
  w\u0259r tan-imos ar ad ammazala tara \u0259n wa di-d-izammazalan, \u0259\u0263r\u0259da\u0263
  \u0259\u0161\u0161\u0259\u0263\u0259l wa da\u0263-i iga. 35 Kawanay w\u0259r t\u0259g\u0259nnim:
  ''\u018fqqimnat-in \u0259kkozat t\u0259lil y ad tagu \u0263arat?'' Mi\u0161an nak
  \u0259nne\u0263-awan \u0259sw\u0259dat w\u0259llen da\u0263 t\u0259w\u0259gas ad
  t\u0259n\u0259yam \u0161i\u0263a\u0263anen \u0259\u014b\u014banat, w\u0259r \u0259renat
  ar \u0259mil\u0259y. 36 Awedan wa italayan, w\u0259di igraw \u0259rruzmatan-net,
  i\u0161adaw \u0161i\u0263a\u0263anen \u0161in t\u0259m\u0259ddurt ta t\u0259\u0263lalat.
  A di da a f\u0259las wa inabbalan \u0259d wa italayan, ketnasan \u0259dd\u0259wen.
  37 F\u0259las tid\u0259t \u0259n t\u0259maj\u0259q ta t\u0259gannat: ''Al\u0259s
  iyyan inabbal, iyyan italay.'' 38 \u018fss\u0259glaq-qawan f\u0259l ad tal\u0259yam
  tawagost da\u0263 w\u0259r t\u0259\u0161\u0263elam, aytedan wiyyad a da\u0263-as
  \u0259\u0161\u0263alnen, mi\u0161an t\u0259grawam t\u0259nfa da\u0263 \u0259\u0161\u0161\u0259\u0263\u0259l
  wa \u0259gan da.\\\" 39 Aytedan aggotnen \u0259n K\u0259l Samar\u0259ya \u0259zz\u0259gzanan
  \u0259s \u0194aysa f\u0259las tantut a dasan-t\u0259nnat: \\\"Imal-i aratan win
  as kala tan-\u0259ge.\\\" 40 A di da a f\u0259las as t-id-osan \u0259gmayan da\u0263-as
  a \u0263ur-san aqqam, t\u0259zzar iqqim \u0263ur-san \u0194aysa har iga \u0259\u0161\u0161in
  adan. 41 Wiyyad aggotnen \u0259zz\u0259gzanan s\u0259r-\u0259s f\u0259l as \u0259slan
  y awal-net \u0259nta iman-net. 42 T\u0259zzar \u0259nnan i t\u0259ntut: \\\"Nakkanay
  s\u0259ket n\u0259kna \u0259z\u0259gzan f\u0259las \u0259stizarat kam \u0263as a
  dana\u0263-igan isalan, \u0259m\u0259r\u0259dda iman-nana as das-n\u0259sla, amaran
  n\u0259ss\u00e2n as tid\u0259t as \u0259nta a imosan \u018fn\u0259ssefsi n \u0259dd\u0259net.\\nT\u0259m\u0259zz\u0259yt
  \u0259n barar n ama\u0161\u0161a\u0263al n \u0259m\u0259nokal \u0259n Kafarnahum\\n43
  D\u0259ff\u0259r \u0259\u0161\u0161in adan win di, ikka \u0194aysa amadal \u0259n
  Galilaya, 44 f\u0259las \u0259nta iman-net as inna, \u0259nn\u0259bi w\u0259r it\u0259w\u0259s\u0259\u0263mir
  da\u0263 akal-net. 45 As din-osa Galilaya \u0259qbalan-tu K\u0259l Galilaya id \u0259n\u00e2yan
  imazalan kul win iga da\u0263 Yerusalam \u0263ur \u0259mud wa n Akkay f\u0259las
  \u0259ntanay da os\u00e2n-t-in. 46 Ilas-du assa \u0259n Kana ta n Galilaya, ta da\u0263
  isammattay aman ig-en esmad. A\u0263r\u0259m \u0259n Kafarnahum ih-ay al\u0259s
  imosan ama\u0161\u0161a\u0263al n \u0259m\u0259nokal. Al\u0259s wen ila rures irinan.
  47 As isla as \u0194aysa igm\u00e2d-du amadal \u0259n Yahud\u0259ya iha Galilaya,
  os-ay-du onsay-tu ad idawan, das-izzuz\u0259y rures \u0263ur t\u0259lla t\u0259mattant.
  48 Inn-as \u0194aysa: \\\"As w\u0259rge\u0263 ad t\u0259nayam t\u0259lm\u0259\u0263jujaten,
  d al\u0263alamaten \u0259mmittaynen, w\u0259r za t\u0259zz\u0259gz\u0259nam fadda.\\\"
  49 Inn-as ama\u0161\u0161a\u0263al n \u0259m\u0259nokal: \\\"M\u0259\u0161\u0161-i,
  \u0259r\u0259s-ana\u0263 \u0259s Kafarnahum harwa ad w\u0259r aba barar-in.\\\"
  50 Inn-as \u0194aysa: \\\"Aglu, rurek izzay.\\\" Al\u0259s de\u0263 izz\u0259gzan
  s awal \u0259n \u0194aysa, igla. 51 Iha tarrayt iqq\u00e2l as imm\u0259nay \u0259d
  ma\u0161\u0161a\u0263alan-net das-d-\u0259lkamnen. \u018fnnan-as: \\\"Bara-nak izzay.\\\"
  52 Iss\u0259stan-tan inn-asan: \\\"Ma imos alwaq wa da\u0263 igraw iman-net?\\\"
  \u018fnnan-as: \\\"\u018fndaz\u0259l iggi \u0259n tazzar a fall-as t\u0259wat tanaday.\\\"
  53 Al\u0259s de\u0263 ikta-ddu as alwaq wen da iman-net \u0263ur das-inna \u0194aysa:
  \\\"Rurek izzay.\\\" Izz\u0259gzan s\u0259r-\u0259s \u0259nta d a\u0263aywan-net
  kul. 54 \u018fnta da da t\u0259lm\u0259\u0263jujat ta t\u0259mosat al\u0263alamat
  ta n sanatat as immozal \u0194aysa da\u0263 Galilaya d\u0259ff\u0259r agamad-net
  Yahud\u0259ya.\\nYaxya 5\\nT\u0259m\u0259zz\u0259yt n anabdon\\n2 A\u0263r\u0259m
  wa n Yerusalam t\u0259h-ay t\u0259\u0263azart t\u0259hozat edag was itawannu t\u0259s\u0259h\u0259rt
  ta n Ayf\u0259d. T\u0259\u0263azart ta es\u0259m-net Betesda, da\u0263 t\u0259l\u0263abranit,
  amaran t\u0259lla g\u0259r s\u0259mmosat taliwen. 3 Taliwen \u0161in \u0259sradan
  daw-\u0259snat miranan \u0259mosnen im\u0259dd\u0259r\u0263al, \u0259d m\u0259ggudal,
  \u0259d n\u0259bdan. \u018fssigadan y ad \u0259gg\u0259zan aman \u0161in \u0259m\u0259t\u0259kw\u0259y,
  4 f\u0259las \u0259llan-tu mazayan da\u0263 d-itazabbat angalos iyyan n \u018fm\u0259li
  ad ijin\u0259j\u0259rw\u0259y aman \u0259n t\u0259\u0263azart ten. \u018fmiran kul
  wa azzaran iguz-net d\u0259ff\u0259r \u0259n\u0259j\u0259rway wa t\u0259ga da, w\u0259di
  ad izz\u0259y da\u0263 t\u0259w\u0259rna ta tu-t\u0259grawat, a t\u0259qqal.\\n5
  \u018fnta edag wen ih-ay al\u0259s igan karadat t\u0259m\u0259rwen n awatay d \u0259ttam
  irin. 6 Ogg-ay \u0194aysa israd, \u0259nta issan as iga t\u0259w\u0259rna t\u0259r\u0259wat,
  t\u0259zzar iss\u0259stan-tu inn-as: \\\"Awak t\u0259re t\u0259m\u0259zz\u0259yt?\\\"
  7 Inn-as \u0259miran wa: \\\"\u018f\u0161\u0161ix, nak w\u0259r \u0259le\u0263 awedan
  a di-igan da\u0263 t\u0259\u0263azart ta da\u0263 amazay wa da\u0263 tin\u0259j\u0259rw\u0259yan
  aman-net, amaran id \u0259gmaya d iguz-net, a di-izar s\u0259r-\u0259s awedan iyyan.\\\"
  8 Inn-as \u0194aysa: \\\"\u018fbd\u0259d, t\u0259dk\u0259la t\u0259salat-nak t\u0259j\u0259w\u0259nke\\\"
  9 Amazay wen da da\u0263 izzay al\u0259s en den, t\u0259zzar idkal t\u0259salat-net
  ijawankat. \u018fnta arat wa itaggu da\u0263 \u0259z\u0259l \u0259n t\u0259sanfawt
  \u0259n K\u0259l-\u018fly\u0259hud. 10 \u018fnnan muzaran \u0259n K\u0259l-\u018fly\u0259hud
  y al\u0259s wa izzayan da: \\\"Awa \u0259z\u0259l \u0259n t\u0259sanfawt-nana, w\u0259r
  da\u0263-as t\u0259le turagat n aggay \u0259n t\u0259salat-nak.\\\" 11 Eges ya inn-asan
  al\u0259s wen: \\\"Al\u0259s wa di-izzozayan, \u0259nta di-innan: ''\u018fdk\u0259l
  t\u0259salat-nak t\u0259j\u0259w\u0259nke''.\\\" 12 \u018fnnan-as: \\\"Ma imos za
  al\u0259s wa dak-innan: ''\u018fdk\u0259l t\u0259salat-nak t\u0259j\u0259w\u0259nke''?\\\"
  13 Mi\u0161an ya, al\u0259s wa izzayan da, w\u0259r t''\u0259hen salan n awa imos
  awedan wa, f\u0259las aytedan \u0259knanen ig\u0259t a \u0259hanen edag wa daq-q-izzozay
  den, iras-tan \u0194aysa, ijawankat. 14 D\u0259ff\u0259r awen ogaz-t-in \u0194aysa
  da\u0263 Ahan \u0259n M\u0259\u0161\u0161ina inn-as: \\\"S\u0259s\u0259m. Kay da
  izzayan da \u0259m\u0259r\u0259dda. \u018f\u0263r\u0259d d igi \u0259n bakkadan,
  a kay w\u0259r igr\u0259w arat ogaran wa tallab\u0259st.\\\" 15 Ijawankat al\u0259s
  wen t\u0259zzar imal i muzaran \u0259n K\u0259l-\u018fly\u0259hud as \u0194aysa
  a t-izzozayan. 16 Arat wa eway-du s\u0259r-san as \u0259knan gezzar \u0259n \u0194aysa
  f\u0259las \u0259z\u0259l \u0259n t\u0259sanfawt da\u0263 ig'' awen. 17 Mi\u0161an
  inn-asan \u0194aysa: \\\"Abba-nin faw da i\u0161\u0263\u00e2l, da\u0263 adi nak
  da \u0259\u0161\u0263\u00e2la.\\\" 18 Batu ta, teway-du \u0259s muzaran \u0259n
  K\u0259l-\u018fly\u0259hud as \u0259\u0161\u0161otan da\u0263 agamay \u0259n tana\u0263ay
  \u0259n \u0194aysa, f\u0259las w\u0259rge\u0263 \u0259lqanun n \u0259z\u0259l \u0259n
  t\u0259sanfawt \u0263as a imm\u0259zray, kalar i\u0161\u0161ota-du fall-as as inn''
  imos M\u0259\u0161\u0161ina abba-net. Da\u0263 adi i\u0161a\u0161\u0161agda iman-net
  \u0259d M\u0259\u0161\u0161ina.\\nTanaya \u0259n \u0194aysa\\n19 Inn-asan \u0194aysa:
  \\\"\u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan as Barar w\u0259r ifreg igi
  n arat waliyyan gar-es \u0259d man-net. W\u0259r it\u0259ggu ar arat was ihannay
  Abba-net itagg-ay. Amaran arat kul wa itaggu Abba, Barar da itagg-ay s asaway wen
  da. 20 F\u0259las Abba ira Barar, amaran isakn-ay arat kul wa itaggu; ad t-assaknu
  aratan ogarnen win da t\u0259la n alma\u0263na y a tan-agu, f\u0259l ad taj\u0259bam.
  21 \u018fmm\u0259k wa da\u0263-as d-isankar Abba in\u0259mm\u0259ttan itaggu da\u0263-san
  iman, \u0259mm\u0259k wa da as ihakku Barar \u0259nta da t\u0259m\u0259ddurt i was
  tat-ira. 22 \u018fnta Abba w\u0259r ix\u0259kk\u0259m y awedan waliyyan, inkar s
  \u0259\u0161\u0161\u0259ri\u0263a kul ig-ay da\u0263 \u0259fus \u0259n Barar 23
  f\u0259l ad \u0259zz\u0259zw\u0259ran aytedan kul Barar s \u0259mm\u0259k was \u0259zz\u0259zwaran
  Abba. Awedan kul wa w\u0259r n\u0259zz\u0259zwar Barar, w\u0259di w\u0259r izz\u0259zwar
  Abba wa t-id-izammazalan. 24 \\\"\u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan
  as awedan kul wa iss\u0259saman i batuten-in, izz\u0259gzan \u0259s wa di-d-izammazalan,
  w\u0259di igraw t\u0259m\u0259ddurt ta t\u0259\u0263lalat. W\u0259r z'' awwaddab,
  kalar t\u0259mattant a d-igmad \u0259s t\u0259m\u0259ddurt. 25 \u018fgg\u0259yye\u0263
  \u0259silakana\u0263-awan as izay-du alwaq -- s \u0259nta da da n\u0259ha da \u0259m\u0259r\u0259dda
  -- alwaq w\u0259di, aytedan win s\u0259r-i w\u0259r n\u0259zz\u0259gzan ad aslin
  y \u0259m\u0259sli \u0259n Barar \u0259n M\u0259\u0161\u0161ina, amaran win das-\u0259slanen
  \u0259kk\u0259wanan-as ad \u0259gr\u0259wan t\u0259m\u0259ddurt ta t\u0259\u0263lalat.
  26 F\u0259las \u0259mm\u0259k wa da\u0263 as ihakku Abba t\u0259m\u0259ddurt, \u0259mm\u0259k
  w\u0259di da\u0263 as ikfa Barar f\u0259rregat n a tat-ihakku \u0259nta da. 27 Amaran
  ikfa Barar turagat n \u0259\u0161\u0161\u0259ri\u0263a, f\u0259las imos Agg awedan.
  28 Ad w\u0259r \u0259qq\u0259nan \u0263afawan-nawan y arat wa: ilkam a d-aw\u0259d
  alwaq as in\u0259mm\u0259ttan kul win \u0259hanen iz\u0259kwan, ad aslin y \u0259m\u0259sli
  n Agg awedan 29 \u0259ddi da du-z-\u0259gm\u0259dan iz\u0259kwan-nasan. Win da\u0263-san
  \u0259ganen aratan ola\u0263nen, a d-\u0259gm\u0259dan iz\u0259kwan y a d'' \u0259nk\u0259ran
  da\u0263 t\u0259mattant \u0259gr\u0259wan t\u0259m\u0259ddurt, win \u0259ganen t\u0259kma
  amaran a d-\u0259gm\u0259dan iz\u0259kwan y ad awwaddaban. 30 W\u0259r t-illa arat
  as \u0259fraga\u0263 igi-net g\u0259r-i \u0259d man-in. \u018f\u0161\u0161\u0259ri\u0263a
  wa tagga, \u0259lkama da\u0263-as y awa di-igannu M\u0259\u0161\u0161ina, amaran
  \u0259\u0161\u0161\u0259ri\u0263a-nin o\u0263\u00e2d, f\u0259las w\u0259r \u0259lkema
  y arat wa \u0259re nak iman-in, kalar arat wa ira wa di-d-izammazalan \u0259nta
  as \u0259lkama.\\n\u0160ig\u0259yyawen \u0259n \u0194aysa\\n31 \\\"As imos as nak
  \u0263as-in as \u0259gg\u0259yye\u0263 i man-in, w\u0259di t\u0259g\u0259yya-nin
  w\u0259r t\u0259mos tid\u0259t. 32 Illat-tu wa di imosan t\u0259g\u0259yya iyyat,
  amaran \u0259ssana\u0263 as arat wa igannu da\u0263 tal\u0263a-nin, imos tid\u0259t.
  33 T\u0259ss\u0259glam inammazalan \u0259s Yaxya, t\u0259zzar igg\u0259yyat-asan
  f\u0259l arat wa imosan tid\u0259t. 34 Nak w\u0259r \u0259dd\u0259rara\u0263 \u0259s
  t\u0259g\u0259yya n awedan. Arat wa w\u0259r tu-g\u0259nna\u0263 ar f\u0259l ad
  t\u0259gr\u0259wam t\u0259sureft. 35 Yaxya imos zun f\u0259t\u0259la t\u0259r\u0263at
  t\u0259bilazlaz, amaran t\u0259qbalam ad tagim arat n assa\u0263at \u0259n t\u0259d\u0259wit
  da\u0263 \u0259nnur-net. 36 Mi\u0161an nak \u0259le t\u0259g\u0259yya togarat ta
  n Yaxya assahat: \u018f\u0161\u0161\u0259\u0263\u0259lan win tagga, tan-imosan win
  as di-iss\u0259war Abba amaknaw-nasan, \u0259ntanay a \u0259mosnen t\u0259g\u0259yya-nin,
  sitaddan as Abba di-d-izammazalan. 37 Abba iman-net wa di-d-izammazalan, \u0259nta
  da iggiyyat-i. W\u0259r kala ad t\u0259slam y \u0259m\u0259sli-net wala t\u0259nayam
  azzat-net. 38 Amaran awal-net w\u0259r iha iwallan-nawan, arat w\u0259di isitadd-ay
  iba n\u0259z\u0259gzan-nawan \u0259s wa d-izammazal. 39 T\u0259taggam i k\u0259tban
  te\u0263aray t\u0259gat s \u0259nn\u0259z\u0259r f\u0259las t\u0259\u0263ilam s\u0259r-san
  t\u0259gr\u0259wam t\u0259m\u0259ddurt ta t\u0259\u0263lalat. Ik\u0259tban win t\u0259\u0263arrim
  da, \u0259ntanay iman-nasan as fall-i \u0259gg\u0259yyen. 40 Eges w\u0259r t\u0259rem
  a di-du-takkim y ad t\u0259gr\u0259wam t\u0259m\u0259ddurt. 41 Nak w\u0259r g\u0259mm\u0259ya\u0263
  \u0259t\u0259w\u0259z\u0259zwar \u0263ur aytedan. 42 \u018fzdayaq-qawan: \u0259ssana\u0263
  as iman-nawan w\u0259r tan-t\u0259ha tara i M\u0259\u0161\u0161ina. 43 Nak Abba-nin
  a di-d-iss\u0259glan mi\u0161an w\u0259r t\u0259rem \u0259lq\u0259bulat-in. Amaran
  as kawan d-osa awedan iyyan a d-iglan gar-es \u0259d man-net, a tu-t\u0259qb\u0259lam!
  44 T\u0259ram ad t\u0259tin\u0259m\u0259s\u0259\u0263miram gar-ewwan, eges w\u0259r
  t\u0259rem sa\u0263mar wa d-ifalan M\u0259\u0161\u0161ina di n iyyan. Da\u0263 adi
  man\u0259mm\u0259k as za t\u0259zz\u0259gz\u0259nam? 45 Ad w\u0259r t\u0259\u0263ilam
  a kawan-\u0259ss\u0259w\u0259ra lahan \u0263ur Abba-nin. \u018fnn\u0259bi Musa \u0259nta
  kawan z-iss\u0259w\u0259ran lahan, \u0259nta wa da\u0263 t\u0259gam attama-nawan.
  46 \u018fnnar t\u0259zzigzanam \u0259s Musa, t\u0259zz\u0259gz\u0259nam s\u0259r-i
  nak da, f\u0259las immigrad fall-i da\u0263 k\u0259tban-net. 47 Mi\u0161an dad imos
  as w\u0259r t\u0259zz\u0259gzanam \u0259s k\u0259tban-net, man\u0259mm\u0259k as
  za t\u0259zz\u0259gz\u0259nam awa ganna?\\\"\\nYaxya 6\\n\u018f\u0161\u0259t\u0161i
  wa iga \u0194aysa i s\u0259mmos gim n al\u0259s\\n2 T\u0259lkam-as tiddawat tagget,
  f\u0259las aytedan \u0259hannayan al\u0263alamaten \u0161in as immozal \u0259mosnen
  \u0259mm\u0259k was izzozay imiranan. 3 Igg\u0259zzay \u0194aysa ad\u0263a\u0263,
  t\u0259zzar iqqim den da \u0259nta \u0259d nalkiman-net. 4 As itagg'' awen da amud
  wa n Akkay ihoz-du.\\n5 Iswad \u0194aysa ogga aytedan \u0259knanen ig\u0259t \u0259zayan-t-idu,
  inna i Filibbus: \\\"M\u0259ni du-za-nazzanzu tag\u0259lla \u0259t\u0161an aytedan
  en kul?\\\" 6 \u018fs\u0259stan wa as t-iga \u0194aysa da iss\u00e2n arat was otas
  igi-net. A ira \u0263as ad iss\u0259n awa das z-annu Filibbus. 7 Inna Filibbus i
  \u0194aysa: \\\"kud du-n\u0259zz\u0259nza tag\u0259lla n \u0259zr\u0259f \u0259n
  sanatat t\u0259mad n \u0259z\u0259l n \u0259\u0161\u0161\u0259\u0263\u0259l da w\u0259r
  dasan-za-taw\u0259d wala arat \u0259n tattay.\\\" 8 Inn-as \u0259nalkim-net iyyan
  wa igan Andraw\u0259s wa n amadray \u0259n Sim\u0263on Butros: 9 \\\"Illa arat \u0259n
  barar da il\u00e2n s\u0259mmosat t\u0259g\u0259lwen n \u0259\u0161\u0161\u0259\u0263ir
  d \u0259\u0161\u0161in kifitan, mi\u0161an ya ma za aknin y aytedan ogd\u00e2nen
  d awa?\\\" 10 Inna \u0194aysa: \\\"Sa\u0263\u0263amiwat aytedan kul.\\\" T\u0259zzar
  \u0259qqiman aytedan kul \u0259han-tan amadal \u0259n s\u0259mmos gim n al\u0259s.
  Edag wen idnay yel. 11 Obaz-du \u0194aysa \u0161ig\u0259lwen \u0161in den. As i\u0263rad
  igi \u0259n godan i M\u0259\u0161\u0161ina t\u0259zzar izun-tanat y aytedan kul
  win \u0259qqimnen den. Ikf-en \u0259nta da awa \u0259ran da\u0263 kifitan. 12 As
  \u0259yy\u0259wanan aytedan inna \u0194aysa i nalkiman-net: \\\"\u0160id\u0259wat-du
  awa d-\u0259glazan, f\u0259l a da\u0263-as w\u0259r ix\u0161\u0259d wala.\\\" 13
  \u018f\u0263radan-tan-du \u0259k\u0259mmi t\u0259zzar \u0259dnayan maraw \u0259zmaman
  d \u0259\u0161\u0161in da\u0263 karammutan \u0259n s\u0259mmosat t\u0259g\u0259lwen
  \u0161inad n \u0259\u0161\u0161\u0259\u0263ir a da d\u0259ff\u0259r as da\u0263-asnat
  \u0259yy\u0259wanan aytedan. 14 As \u0259nayan aytedan win al\u0263alamat tas immozal
  \u0194aysa da, t\u0259zzar ad gannin: \\\"Igmad a\u0161\u0161ak as al\u0259s wa
  \u0259nta a imosan \u0259nn\u0259bi wa du-z-asin \u0259dd\u0259net!\\\" 15 Issan
  \u0194aysa as aytedan win ad t-ab\u0259zan \u0161\u0259hh\u0259\u0161\u0259lan-tu
  ti\u0161it n \u0259m\u0259nokal, t\u0259zzar ilas-tan efel, ikk'' edag iyyan da\u0263
  \u0259d\u0263a\u0263 en da, \u0263as-net.\\n\u018fj\u0259w\u0259nki wa iga \u0194aysa
  f\u0259l aman\\n16 As t\u0259ga tak\u0259st zagadayan nalkiman-net s agaraw, 17
  \u0259ggazan ta\u0263lalt t\u0259zzar \u0259ss\u0259walan agaraw y ad \u0259\u0263r\u0259san
  \u0259s Kafarnahum. Ehad ig\u00e2, amaran \u0194aysa w\u0259r tan-in-ewed harwa
  da. 18 Igar-du adu issohen t\u0259zzar ad tanastaban aman n agaraw. 19 As \u0259gan
  nalkiman \u0259n \u0194aysa edag \u0259n s\u0259mmos kilawtan made\u0263 s\u0259dis
  n \u0259\u0161ik\u0259l, oggan \u0194aysa da\u0263 ih\u0259z ijiwankat-du f\u0259l
  aman izay-du ta\u0263lalt ta han, t\u0259zzar t\u0259ggaz-tan tasa. 20 Mi\u0161an
  inn-asan: \\\"A kawan w\u0259r t\u0259gg\u0259z tasa, awa nakku!\\\" 21 Gammayan
  d a t-id-\u0259zzug\u0259zan ta\u0263lalt den da, wal'' a ihogan tewad d\u0259r-san
  edag wa \u0259kkan.\\nAmensay wa ihakkin t\u0259m\u0259ddurt w\u0259r t-imos ar
  \u0194aysa.\\n22 As \u0259z\u0259l wa hadan t\u0259gr-in tiddawat ta t\u0259warat
  efay n agaraw wa wen sen as ta\u0263lalt iyyadda \u0263as a t\u0259llat den \u0259ndaz\u0259l,
  amaran \u0259ssanan as \u0194aysa w\u0259r inamaggaz ta\u0263lalt ta \u0259d nalkiman-net.
  \u018fssanan \u0259nta da as inalkiman-net \u0263as-nasan as \u0259glan. 23 \u018fnzaynat-du
  \u0161iyyad a d-\u0259falnen a\u0263r\u0259m wa n Tiber\u0259yad. Osanat-du dagma
  n adag wa da\u0263 t\u0259t\u0161a tiddawat tag\u0259lla d\u0259ff\u0259r godan
  win iga \u0194aysa y \u018fm\u0259li. 24 As din-t\u0259gra tiddawat as \u0194aysa
  w\u0259r illa den \u0259nta wala inalkiman-net, t\u0259ggaz \u0161i\u0263lalen \u0161in
  den y ad t\u0259s\u0259ss\u0259gg\u0259l \u0194aysa \u0259s t\u0259\u0263r\u0259mt
  ta n Kafarnahum. 25 \u018fgrawan-tu f\u0259l afay n agaraw wa hadan t\u0259zzar
  \u0259nnan-as: \\\"\u018fmmay du-tose da, ya \u018f\u0161\u0161ix?\\\" 26 Ig-asan
  \u0194aysa aljawab wa: \\\"\u018fgg\u0259yye silakana\u0263-awan as w\u0259r di-t\u0259s\u0259gg\u0259dam
  ar f\u0259l as t\u0259t\u0161am tag\u0259lla har da\u0263-as t\u0259yy\u0259wanam,
  w\u0259rge\u0263 a\u0161\u0161addat n \u0259g\u0259rri n alma\u0263na n al\u0263alamaten
  \u0161in as \u0259mmozala a f\u0259l di-t\u0259lkamam. 27 Ayyat \u0259\u0161\u0161\u0259\u0263\u0259l
  da\u0263 agamay \u0259n mensewan win \u0263a\u0161\u0161adnen, gammayat imensewan
  win tahaginen, hakkin t\u0259m\u0259ddurt ta t\u0259\u0263lalat. Imensewan win Ag
  Awedan dawan-tan-z-akfin f\u0259las \u0259nta a iss\u0259war M\u0259\u0161\u0161ina
  di n Abba ejwal wa n ta\u0263mar-net. 28 \u018fss\u0259stanan-tu \u0259nnan-as:
  \\\"M\u0259ni za arat was ihor a tu-nagu f\u0259l ad naknu \u0259\u0161\u0161\u0259\u0263\u0259lan
  win ira M\u0259\u0161\u0161ina?\\\" 29 Ijj\u0259wwab-asan \u0194aysa inn-asan: \\\"\u018f\u0161\u0161\u0259\u0263\u0259l
  wa da\u0263-wan ira M\u0259\u0161\u0161ina, w\u0259r t-imos ar ad t\u0259zz\u0259gz\u0259nam
  \u0259s wa d-iss\u0259gla.\\\" 30 \u018flasan-tu \u0259s\u0259stan \u0259nnan-as:
  \\\"Ma t\u0259mos za al\u0263alamat tas dana-za-tammazala f\u0259l a s\u0259r-\u0259k
  n\u0259zz\u0259gz\u0259n? M\u0259ni awa za taga?\\\" 31 Imarawan-nana\u0263 \u0259t\u0161an
  da\u0263 taneray amensay wa n Manna. Arat da wa iktaban da\u0263 batu t\u0259di:
  \\\"I\u0161\u0161\u0259t\u0161-en amensay wa d-ifalan ij\u0259nnawan.\\\"\\n32 T\u0259zzar
  ijj\u0259wwab-asan \u0194aysa inn-asan: \\\"\u018fgg\u0259yye\u0263 silakana\u0263-awan
  as w\u0259rge Musa kawan-ikfan amensay wa d-ifalan ij\u0259nnawan. Abba-nin \u0259nta
  kawan ihakkin amensay wa d-ifalan ij\u0259nnawan, imos amensay wa n tid\u0259t.
  33 \\\"F\u0259las amensay wa d-igmadan ij\u0259nnawan, \u0259nta a d-ifalan M\u0259\u0161\u0161ina,
  amaran \u0259nta a ihakkin t\u0259m\u0259ddurt y \u0259dd\u0259net.\\\" 34 \u018fnnan-as:
  \\\"\u018fm\u0259li, hakk-ana amensay w\u0259di faw.\\\" 35 Inn-asan \u0194aysa:
  \\\"Nak a imosan amensay wa ihakkin tam\u0259ddurt ta t\u0259\u0263lalat. Wa di-d-ikkan
  w\u0259r da-as ilkem ad t-iggaz g\u0259l\u0259k, amaran wa s\u0259r-i izz\u0259gzanan
  w\u0259r da\u0263-as ilkem ad t-iggaz fad. 36 Mi\u0161an \u0259mala\u0263-awan arat
  wa: t\u0259nayam-i eges w\u0259r t\u0259zz\u0259gzanam. 37 Awedan kul wa di-ikfa
  Abba a di-d-asu, w\u0259r ilkem ad \u0259sta\u0263a\u0263 i di-d-ikkan; 38 f\u0259las
  \u0259z\u0259bbi a d-\u0259ge\u0263 da\u0263 ij\u0259nnawan f\u0259l ad ammazala
  s arat wa ira wa di-d-iss\u0259glan, w\u0259rge\u0263 arat wa \u0259re nak iman-in.
  39 \u018fnta wa di-d-izammazalan w\u0259r ira ad ixr\u0259k waliyyan da\u0263 win
  di-ikfa, kalar a ira a tan-d-\u0259ss\u0259nk\u0259ra da\u0263 t\u0259mattant \u0259z\u0259l
  a ilkaman. 40 Awalla, \u0259nta da tara n Abba-nin: Aytedan kul win di-\u0259naynen
  nak wa n Barar, \u0259zz\u0259gzanan s\u0259r-i, \u0259ntanay a z-\u0259gr\u0259wnen
  t\u0259m\u0259ddurt ta t\u0259\u0263lalat, \u0259ss\u0259nk\u0259raq-qan-du da\u0263
  t\u0259mattant, \u0259z\u0259l a ilkaman. 41 T\u0259zzar ad tig\u0259t\u0259ntinan
  K\u0259l-\u018fly\u0259hud \u0259han batu-net f\u0259l as inna: \\\"Nak a imosan
  amensay wa d-izz\u0259bben da\u0263 j\u0259nnawan.\\\" 42 Gannin: \\\"Awak awen
  w\u0259rge \u0194aysa wa n ag Yus\u0259f, n\u0259kna t\u0259m\u0259zd\u0259yt n
  abba-net d anna-net, m\u0259ni \u0259mm\u0259k was du-z-ink\u0259r \u0259m\u0259r\u0259dda
  ad igannu ij\u0259nnawan da\u0263 d-izz\u0259bbat?\\\" 43 Ijj\u0259wwab-asan \u0194aysa
  inn-asan: \\\"Ayyiwat \u0259g\u0259t\u0259nt\u0259n gar-ewan. 44 W\u0259r t-illa
  i di-du-z-akkin ar s a t-id-ilway s\u0259r-i Abba wa di-d-iss\u0259glan. Nak amaran
  \u0259s\u0259nk\u0259r a t-idu-z-aga da\u0263 t\u0259mattant da\u0263 \u0259z\u0259l
  a ilkaman. 45 Ik\u0259tban n \u0259nn\u0259bitan ih-en as: ''Ketnasan a tan-isassa\u0263ru
  M\u0259\u0161\u0161ina''. Awedan kul wa islan awa d-ifalan Abba, t\u0259zzar irda
  s awa isassa\u0263ra w\u0259di a di-d-akku. 46 W\u0259r t-illa is kala ad inay M\u0259\u0161\u0161ina
  di n Abba ar wa t-id-ifalan. W\u0259di inay Abba. 47 \\\"\u018fgg\u0259yye\u0263
  \u0259silakana\u0263-awan as i izz\u0259gzanan ad igr\u0259w t\u0259m\u0259ddurt
  ta t\u0259\u0263lalat. 48 Nak a imosan amensay wa ihakkin t\u0259m\u0259ddurt. 49
  Imarawan-nawan \u0259t\u0161an Manna da\u0263 taneray mi\u0161an w\u0259r dasan-igdel
  awen t\u0259mattant. 50 As ig'' awen amensay was ganna nak, ij\u0259nnawan a da\u0263
  d-izz\u0259bbat y as i t-it\u0161an w\u0259r tu-z-iba. 51 Nak a imosan amensay wa
  d-izzebben da\u0263 j\u0259nnawan ihakku tam\u0259ddurt. Awedan kul wa it\u0161an
  amensay wa, w\u0259di ad idd\u0259r har faw. Amaran isan-in a mosnen imensewan win
  z'' akfa f\u0259l ad t\u0259gr\u0259w \u0259dd\u0259net t\u0259m\u0259ddurt.\\\"
  52 Ad tamastanan K\u0259l-\u018fly\u0259hud gar-essan gannan: \\\"Man\u0259mm\u0259k
  as dana-z-akfu awedan wa isan-net nat\u0161-en?\\\" 53 T\u0259zzar inn-asan \u0194aysa:
  \\\"Awalla, \u0259gg\u0259yye\u0263 \u0259silakana\u0263-awan \u00e2s as w\u0259r
  t\u0259t\u0161em isan \u0259n Barar n Awedan, ta\u0161win \u0259nta da azni-net,
  w\u0259r dawan-tu-t\u0259lla t\u0259m\u0259ddurt. 54 Awedan wa it\u0161an isan-in
  i\u0161wa \u0259nta da azni-nin, w\u0259di igr\u00e2w t\u0259m\u0259ddurt ta t\u0259\u0263lalat,
  amaran a t-id-\u0259ss\u0259nk\u0259ra da\u0263 t\u0259mattant \u0263ur \u0259z\u0259l
  a ilkaman. 55 F\u0259las isan-in \u0259mosan amensay wa n tid\u0259t, azni-nin da
  imos aman \u0259n tassay win tid\u0259t. 56 Awedan wa it\u0161an isan-in, i\u0161wa
  azni-nin, w\u0259di irtay d\u0259r-i, nak de\u0263 \u0259he\u0263 \u0259w\u0259l-net.
  57 \u018fmm\u0259k was Abba wa di-d-iss\u0259glan \u0259nta a ihakkin t\u0259m\u0259ddurt,
  amaran \u0259nta a di-issodaran, \u0259mm\u0259k di da\u0263 as wa it\u0161an isan-in
  a s\u0259r-i idd\u0259r. 58 Amensay wa ij\u0259nnawan da\u0263 d-izz\u0259bbat.
  W\u0259r ola \u0259d wa \u0259t\u0161an marawan-nawan f\u0259las w\u0259r dasan-igdel
  adi tamattant. Awedan wa it\u0161an amensay wa, w\u0259di ad igr\u0259w t\u0259m\u0259ddurt
  t\u0259\u0263l\u00e2lat.\\\" 59 Arat da da wa inna \u0194aysa assa\u0263a wa ad
  isassa\u0263ra da\u0263 ahan n \u0259l\u0263ibada \u0259n K\u0259l-\u018fly\u0259hud
  da\u0263 \u0259\u0263r\u0259m wa n Kafarnahum.\\nEfel wa \u0259gan aytedan w\u0259yyad
  d\u0259ff\u0259r \u0194aysa, \u0259lkaman-as wiyyad\\n60 As \u0259slan nalkiman-net
  aggotnen y \u0259s\u0259ss\u0259\u0263ri wa itaggu da \u0259nnan: \\\"Batu ta \u0161i
  labasat, izz\u0259wat \u0259z\u0259gzan-net. Ma ifragan \u0259lq\u0259bulat-net?\\\"
  61 \u0194aysa issan da\u0263 man-net as inalkiman-net gitantanan gar-essan da\u0263
  tal\u0263a ten, t\u0259zzar inn-asan: \\\"\u018fng\u0259m \u0259z\u0259gzan-nawan
  a t\u0259das batu ta?\\\" 62 Ma za tagim za as toggam Barar n Awedan itagazzay s
  adag wa iha \u0259stizarat? 63 Infas wa Z\u0259ddigan a isiduran. Awedan iman-net,
  w\u0259r imos wala. Awalan win dawan-\u0259ge\u0263, hakkan Infas wa Z\u0259ddigan
  \u0259d t\u0259m\u0259ddurt. 64 Mi\u0161an \u0259han-kawan wiyyad w\u0259r n\u0259zz\u0259gzan.\\\"
  \u0194aysa harwa \u0263ur tizarat da issan win w\u0259r n\u0259zz\u0259gzan, issan
  \u0259nta da wa tu-z-agin da\u0263 fassan. 65 Inn-asan tolas: \\\"Adi da a f\u0259l
  dawan-\u0259nne: ''W\u0259r t-illa i ifragan a di-d-akku ar s ad t-ikfa Abba f\u0259rregat
  n adi.\\\" 66 Den da d\u0259ff\u0259r-\u0259s ifal a \u0259ggen da\u0263 nalkiman-net,
  \u0259\u0263radan \u0259d tidawt-net. 67 T\u0259zzar inna \u0194aysa i nalkiman
  win maraw d \u0259\u0161\u0161in: \\\"Meqqal kawanay da t\u0259ram teklay?\\\" 68
  Ijj\u0259wwab-as Sim\u0263on Butros inn-as: \\\"\u018fm\u0259li, ma imos wa za nakku?
  Kay a itaggan awalan win \u0259hakkanen t\u0259m\u0259ddurt ta t\u0259\u0263lalat.
  69 Nakkanay n\u0259zzigzan s\u0259r-\u0259k, n\u0259ssan as kay \u018fmizdag a d-ifalan
  M\u0259\u0161\u0161ina.\\\" 70 Inn-asan \u0194aysa: \\\"Ak w\u0259rge\u0263 \u0259s\u0259nn\u0259fr\u0259n
  a kawan-\u0259ge ketnawan, f\u0259l maraw-ewwan d \u0259\u0161\u0161in? As iga awen
  da iyyan da\u0263-wan imos a\u0161\u0161ayatin.\\\" 71 Batu ta Yahuza wa n ag Sim\u0263on
  Isxar\u0259yuti a f\u0259l tat-iga \u0194aysa. F\u0259las Yahuza tu z-agin da\u0263
  fassan da imos iyyan da\u0263 nalkiman a n maraw d \u0259\u0161\u0161in.\\n\u018flm\u0259six
  iha tarrayt \u0259s Yerusalam\\nYaxya 7\\n2 As ig'' awen ihoz-du \u0259mud \u0259n
  K\u0259l-\u018fly\u0259hud was itawannu wa n t\u0259karbanen. 3 \u018fnnan-as m\u0259drayan-net:
  \\\"\u018ff\u0259l da takka akal wa n Yahud\u0259ya f\u0259l ad \u0259n\u0259yan
  nalkiman-nak \u0259\u0161\u0161\u0259\u0263\u0259lan win t\u0259tagga. 4 Awedan
  as ira fall-as tagu masnat w\u0259r i\u0161\u0259qq\u0259l da\u0263 \u0259ssir.
  Dad zama as t\u0259tagga\u0263 aratan ogdanen d awa, w\u0259di agu t\u0259m\u0259wit
  ta f\u0259l tan-z-in\u0259y awedan kul.\\\" 5 \u018fnta im\u0259drayan \u0259n \u0194aysa
  iman-nasan da w\u0259r s\u0259r-\u0259s \u0259zz\u0259gzanan. 6 Inn-asan \u0194aysa:
  \\\"Assa\u0263at ta-nin harwada w\u0259r du-tewed. Kawanay amaran w\u0259r t\u0259zlayam
  assa\u0263aten. 7 W\u0259r t-illa \u0259dd\u0259lil f\u0259l kawan-za-t\u0259gz\u0259r
  \u0259dd\u0259net. Nak amaran \u0259dd\u0259net t\u0259gzar-i f\u0259las \u0259mosa
  t\u0259g\u0259yya y arak mazalan win da\u0263-as tagginen. 8 Akkiwat amud wen kawanay.
  Nak w\u0259r t-\u0259kke f\u0259las assa\u0263at-in harwada w\u0259r du-tewed.\\\"
  9 As dasan-i\u0263rad t\u0259nna n aratan win, t\u0259zzar iqqim-du da\u0263 Galilaya.\\n10
  D\u0259r iga awen da ya as \u0259kkan m\u0259drayan-net amud, ikk-ay \u0259nta da,
  eges iki wa zun as iga da\u0263 \u0259ssir, f\u0259las w\u0259r iss\u0259kna iman-net
  y aytedan. 11 Itaggu \u0259mud den da sasaggalan-tu muzaran \u0259n K\u0259l-\u018fly\u0259hud
  gannan: \\\"Ma iga al\u0259s a?\\\" 12 As iga awen t\u0259nk\u00e2r t\u0259mazaq
  g\u0259r aytedan da\u0263 tal\u0263a \u0259n \u0194aysa. Wiyyad za gannan: \\\"Al\u0259s
  di ol\u00e2\u0263.\\\" Wiyyad amaran gannan: \\\"Kalar \u0259s\u0259xr\u0259k fadda
  a itaggu tamattay.\\\" 13 Mi\u0161an w\u0259r t-illa awedan ihalan amagrad dat aytedan
  da\u0263 tal\u0263a-net, f\u0259l t\u0259ks\u0259da \u0259n muzaran \u0259n K\u0259l-\u018fly\u0259hud.\\nAssa
  \u0259n \u0194aysa Ehan \u0259n M\u0259\u0161\u0161ina\\n14 As isaggaraygaray \u0259mud
  igg\u0259zzay \u0194aysa s Ahan \u0259n M\u0259\u0161\u0161ina ad isasa\u0263ru
  aytedan. 15 Arat wa iqqan i\u0263afawan \u0259n K\u0259l-\u018fly\u0259hud w\u0259llen
  har \u0259qqiman gannin: \\\"M\u0259ni esaway was issan awedan wa aratan win, \u0259nta
  w\u0259r i\u0263ra?\\\" 16 Inn-asan \u0194aysa: \\\"\u018fs\u0259ss\u0259\u0263ri-nin
  w\u0259rge nak a d-ifal, kalar wa di-d-izammazalan a d-ifal. 17 Awedan kul wa iran
  ad ammazal tara \u0259n M\u0259\u0161\u0161ina, w\u0259di ad iss\u0259n kud \u0259s\u0259ss\u0259\u0263ri
  wa \u0259nta a d-ifal wala de\u0263 nak t-id-iktan g\u0259r-i \u0259d man-in. 18
  Awedan wa i\u0161\u0161ewalan s es\u0259m-net \u0259nta \u0263as, w\u0259di iman-net
  as igammay \u0259t\u0259w\u0259s\u0259\u0263mar. Mi\u0161an awedan wa i\u0161\u0263alan
  da\u0263 \u0259s\u0259nn\u0259fil\u0259l \u0259n tarna \u0259n wa t-id-iss\u0259glan,
  w\u0259di tid\u0259t a immal, w\u0259r da\u0263-as t-illa a imosan lahan. 19 Musa
  w\u0259rge\u0263 ikf-iwan \u0259lqanun? Eges \u0259lqanun wa w\u0259r kawan-iha
  i das-ilkaman. Mafel as t\u0259ram a di-tan\u0263im?\\\" 20 T\u0259nn-as tamattay:
  \\\"Kay agg\u0259suf a kay-izda\u0263an. Ma imos wa iran tena\u0263ay-nak?\\\" 21
  Inn-asan \u0194aysa: \\\"Nak t\u0259lm\u0259\u0263jujat iyyadda \u0263as a \u0259mmozala,
  mi\u0161an \u0259qqanan-as \u0263afawan-nawan. 22 Musa omar-kawan s \u0259s\u0259mm\u0259nk\u0259d
  \u0259n bararan-nawan, (as ig'' awen da imarawan-nana a t-id-\u0259ss\u0259ntanen,
  w\u0259rge Musa), amaran w\u0259r fall-awan imos lahan ad t\u0259s\u0259mm\u0259nk\u0259dam
  barar da\u0263 \u0259z\u0259l wa n t\u0259sanfawt-nawan. 23 \u018fn\u0259yat za,
  dad imos as itawasamankad barar da\u0263 \u0259z\u0259l \u0259n t\u0259sanfawt f\u0259l
  l\u0259kkum y \u018flqanun wa n Musa, mafel as kawan-iha alham-in f\u0259l\u0227s
  \u0259ge\u0263 y awedan \u0259zuz\u0259y ikm\u00e2lan da\u0263 \u0259z\u0259l \u0259n
  t\u0259sanfawt? 24 Ayyiwat axakam n aratan s awa t\u0259hannayam da\u0263 azzahir.
  Kalar xakkamat-tan \u0259s t\u0259m\u0259wit t\u0259zilala\u0263at.\\\" 25 As t-oggan
  arat da\u0263 aytedan win Yerusalam ad gannin: \\\"Al\u0259s wen w\u0259rge\u0263
  \u0259nta as \u0259ran muzaran-nana tena\u0263ay-net? 26 Amaran \u0259nta da \u0259m\u0259r\u0259dda
  i\u0161\u0161ewalan da dat awedan kul, w\u0259r t-illa i das-igannin wala! Ak immikkan
  imuzaran-nana\u0263 a sallakannen as \u0259nta a imosan \u018flm\u0259six? 27 Mi\u0161an
  ya al\u0259s wa n\u0259ssan akal wa d-ifal, as ig'' awen \u018flm\u0259six assa\u0263a
  wa du-z-asu, w\u0259r t-illa awedan a z-iss\u0259nan da du-z-if\u0259l.\\\" 28 \u0194aysa
  harwa da isasa\u0263ru da\u0263 Ahan \u0259n M\u0259\u0161\u0161ina, idkal \u0259m\u0259sli-net
  w\u0259llen inna: \\\"T\u0259zdayam-i t\u0259ssanam sas d-\u0259he! As ig'' awen
  da w\u0259r d-ose g\u0259r-i \u0259d man-in: mi\u0161an wa di-d-iss\u0259glan tid\u0259t
  a imos amaran w\u0259r tu-t\u0259zdayam. 29 Nak \u0259zdayaq-qu, f\u0259las \u0259nta
  s\u0259r-wan d-\u0259fala, amaran \u0259nta di-d-izammazalan.\\\" 30 T\u0259zzar
  \u0259gmayan d abbaz-net mi\u0161an w\u0259r tan-iha i t-idasan, f\u0259las alwaq-net
  a du-w\u0259r-newed harwada. 31 As ig''awen da ya izzigzan s\u0259r-\u0259s a aggen
  da\u0263 tiddawat ten, gannin: \\\"Tordam as kud d-osa \u018flm\u0259six ifrag igi
  n al\u0263alamaten ogarnen \u0161in iga al\u0259s wa?\\\" 32 Arat wa sim\u0259t\u0259ktikan
  aytedan da\u0263 tiddawat ta, \u0259slan-tu Farisaytan. \u018fnkaran limaman win
  zawwarnen, \u0259d Farisaytan \u0259ss\u0259glan-du imagazan n Ahan \u0259n M\u0259\u0161\u0161ina
  y ad ab\u0259zan \u0194aysa. 33 Inn-asan \u0194aysa: \\\"Nak harwa da \u0259ddewa
  d\u0259r-wan har arat \u0259n tamert, d\u0259ff\u0259r adi ad akka wa di-d-izammazalan.
  34 A di-t\u0259sasaggalam mi\u0161an w\u0259r di-za-t\u0259gr\u0259wam f\u0259las
  edag wa z''akka w\u0259r t\u0259fregam iki-net.\\\" 35 Ad tin\u0259m\u0259s\u0259stinan
  K\u0259l-\u018fly\u0259hud, gannin: \\\"Ma imos adag wa z''akku daq-qu w\u0259r
  za n\u0259gr\u0259w? Meqqal K\u0259l-\u018fly\u0259hud win wazawaznen da\u0263 kallan
  win tama a z-akku igg\u0259z-tan amaran ad isasa\u0263ru aytedan win w\u0259r n\u0259mos
  K\u0259l-\u018fly\u0259hud? 36 Ma imos alma\u0263na \u0259n batu ta iga da, as inna:
  ''A di-t\u0259sasaggalam mi\u0161an w\u0259r di-za-t\u0259gr\u0259wam, f\u0259las
  w\u0259r t\u0259fregam iki n adag wa \u0259he''?\\\"\\nAman win sidurnen\\n37 As
  d-ewad \u0259z\u0259l wa ilkaman, s \u0259nta a imosan \u0259z\u0259l wa z\u0259wwaran
  da\u0263 \u0259mud, ibdad \u0194aysa dat tiddawat iqq\u0259rra s \u0259m\u0259sli
  idk\u00e2lan inna: \\\"Awedan kul wa iffudan akkiwet-i-du ad a\u0161\u0259w. 38
  Awedan kul wa s\u0259r-i izz\u0259gzanan ''ad \u0259ng\u0259yan g\u0259rwan n aman
  win sidurnen da\u0263 \u0259w\u0259l-net'', s \u0259mm\u0259k wa imal Akatab.\\\"
  39 Infas wa Z\u0259ddigan f\u0259l imm\u0259grad \u0194aysa den, s \u0259nta a z''\u0259gr\u0259wan
  aytedan win s\u0259r-\u0259s \u0259zz\u0259gzannen. Azzaman en Infas wa Z\u0259ddigan
  w\u0259r itawagraw f\u0259las \u0194aysa harwada w\u0259r igrew adkul.\\n\u018fm\u0259zz\u0259y
  g\u0259r aytedan\\n40 Edes n aytedan \u0259n tiddawat ten, as \u0259slan i batuten
  \u0161in iga \u0194aysa da \u0259nnan: \\\"Illikan as al\u0259s wa \u0259nta a imosan
  \u018fnn\u0259bi wa itt\u0259malan!\\\" 41 \u018fnnan w\u0259yyad: \\\"\u018flm\u0259six
  awa!\\\" \u018fnnan-asan w\u0259yyad: \\\"Man\u0259mm\u0259k as du-z-igm\u0259d
  \u018flm\u0259six Galilaya? 42 Akatab w\u0259rge\u0263 a inna: ''\u018fzzurr\u0259yya
  \u0259n Daw\u0259d, \u0259d t\u0259\u0263r\u0259mt \u0259n Betlexem s \u0259nta
  as kala da\u0263-as i\u0263sar Daw\u0259d, a du-z-igm\u0259d \u018flm\u0259six''.\\\"\\n43
  \u018fmm\u0259k wen da\u0263 as t\u0259zun tiddawat da\u0263 tal\u0263a \u0259n
  \u0194aysa. 44 Wiyyad da\u0263-san \u0259ran abbaz-net, mi\u0161an w\u0259r tan-iha
  is t-idas \u0259fus-net. 45 T\u0259zzar \u0259glan magazan n Ahan \u0259n M\u0259\u0161\u0161ina
  \u0259qqalan ilimaman win zawwarnen, \u0259d Farisaytan. Osan-in \u0263as \u0259nnan-asan:
  \\\"Mafel w\u0259r t-idu-tewayam?\\\" 46 \u018fnnan-asan magazan: \\\"W\u0259r kala
  itawanay awedan igan awal olan \u0259d wa iga al\u0259s en.\\\" 47 \u018fnnan-asan
  Farisaytan: \\\"Da\u0263 adi kawanay da toyyam iman-nawan t\u0259tawasaxrakam? 48
  \u018fss\u0259nat ill-ay i s\u0259r-\u0259s izzigzanan da\u0263-na? 49 W\u0259r
  s\u0259r-\u0259s izz\u0259gzan ar tiddawat n aljahilan w\u0259r n\u0259ssen wala
  da\u0263 Attawrit, as ketnasan t\u0259war-tan tul\u0263ant.\\\" 50 Iss\u0259stan-tan
  Nikodemos imosan iyyan da\u0263 Farisaytan s \u0259nta din-osan \u0194aysa dat awen,
  inn-asan: 51 \\\"\u018f\u0161\u0161\u0259ri\u0263a-nana w\u0259r t-iha ad it\u0259w\u0259xk\u0259m
  awedan iket w\u0259r i\u0161\u0161ewal, it\u0259w\u0259ss\u0259n awa da\u0263 i\u0161\u0161okal.\\\"
  52 \u018fnnan-as: \\\"Galilaya kay t\u0259lat kay da? A\u0263ru Ikataban ad t\u0259n\u0259ya
  kay iman-nak as w\u0259r t-illa \u0259nn\u0259bi du-z-igm\u0259dan Galilaya.\\\"
  53 D\u0259ff\u0259r awen iff\u0259zzat \u0259m\u0259n\u0259y, ikk''awedan kul ehan-net.\\nYaxya
  8\\nTantut ta t\u0259gat \u0259zz\u0259na\\n2 As affaw a\u0263\u00f3ra iqqal Ehan
  \u0259n M\u0259\u0161\u0161ina t\u0259zzar t\u0259hoz-t-in tiddawat ketnet. Iqqim
  a tan-isasa\u0263ru. 3 I\u0161\u0161ewal den da as d-osan musanan n \u018fttawrit
  \u0259d Farisaytan ewayan tantut a d-\u0259\u0263daran t\u0259taggu \u0259zz\u0259na.
  \u018fss\u0259bdadan-tat dat awedan kul, 4 \u0259nnan i \u0194aysa: \\\"Ya \u0259\u0161\u0161ix-nana,
  tantut a \u0259zz\u0259na a t\u0259ga, amaran t\u0259tiwa\u0263ayyan t\u0259tagg-ay.
  5 Da\u0263 \u018fttawrit za a inna Musa: ''tantut \u0259n zun ta, ilzam a tat-\u0259ggaran
  aytedan \u0259s t\u0259hun har tat-iba''. Amaran kay ma t\u0259nne?\\\"\\n6 Arat
  wa imos t\u0259m\u0259rkest das-\u0259gan f\u0259l ad t-\u0259ss\u0259w\u0259ran
  lahan. Edag an a dasan-ajjawwab \u0194aysa, inaz ad ikattab s adad-net f\u0259l
  a\u1e43adal. 7 \u018fqqiman \u0259dgazan da\u0263 \u0259s\u0259stan-net, as ihog
  ibdad-du inn-asan: \\\"Ink\u0259ret-du da\u0263-wan was kala w\u0259r iga abakkad,
  izaret \u0259s t\u0259m\u0259girt-net.\\\" 8 Ilas enez ad ikattab s adad-net f\u0259l
  a\u1e43adal. 9 As \u0259slan i batu ta, t\u0259zzar mazazaran \u0259glan, azzaran-asan
  win wa\u0161\u0161arnen. Iqqim-du \u0194aysa \u0263as-net \u0259nta \u0259d t\u0259ntut
  ta nad, t\u0259bd\u00e2d dat-\u0259s harwa da. 10 T\u0259zzar ibdad-du inn-as: \\\"Tantut,
  ma \u0259gan za? W\u0259r tan-iha i kam-iwwiddaban?\\\" 11 T\u0259nn-as: \\\"Waliyyan
  da\u0263-san, \u018fm\u0259li-nin\\\". Inn-as \u0194aysa: \\\"Nak da za w\u0259r
  kam-z-awaddaba. Aglu t\u0259j\u0259w\u0259nke, mi\u0161an ad w\u0259r t\u0259l\u0259sa\u0263
  igi \u0259n bakkadan.\\\"\\n\u0194aysa wa imosan \u0259nnur n \u0259dd\u0259net\\n12
  Ilas \u0194aysa awal i tiddawat inna: \\\"Nak a imosan \u0259nnur n \u0259dd\u0259net.
  Da\u0263 adi wa di-ilkaman ad igr\u0259w \u0259nnur wa isiduran amaran w\u0259r
  das-ilkem ad ijiwankat da\u0263 \u0161iyyay. 13 \u018fnnan-as Farisaytan: \\\"T\u0259g\u0259yya
  \u0259n man-nak a t\u0259mosa, arat wa t\u0259ganna\u0263 \u0259ddi irkam w\u0259llen.\\\"
  14 Inn-asan \u0194aysa: \\\"Kud imos as t\u0259g\u0259yya \u0259n man-in a mosa
  da t\u0259g\u0259yya-nin t\u0259mos tid\u0259t f\u0259las \u0259ssana sas d-\u0259he\u0263,
  \u0259d sas \u0259daga. Mi\u0161an kawanay w\u0259r t\u0259ssenam sas d-\u0259he,
  wala sas \u0259daga. 15 Kawanay azzahir as t\u0259\u0161arra\u0263am aytedan, nak
  amaran w\u0259r \u0161\u0259rr\u0259\u0263a waliyyan. 16 As ig''awen da as fall-i
  d-osa adi, ad \u0161arra\u0263a, amaran \u0259\u0161\u0161\u0259ri\u0263a-nin issohat,
  f\u0259las iddew d\u0259r-i Abba wa di-d-iss\u0259glan. 17 \u018flqanun-nawan iktab
  da\u0263-as \u00e2s t\u0259g\u0259yya n \u0259\u0161\u0161in meddan a t\u0259mosat
  tid\u0259t. 18 Nak za t\u0259g\u0259yya iyyadda a mosa\u0263 i man-in, t\u0259g\u0259yya-nin
  ta n sanatat amaran Abba s \u0259nta di-d-iss\u0259glan a tat-imosan.\\\" 19 T\u0259zzar
  \u0259nnan-as: \\\"M\u0259nid illa Abba-nak?\\\" Inn-asan \u0194aysa: \\\"W\u0259rmad
  di-t\u0259zdayam za w\u0259r t\u0259zdayam Abba-nin. \u018fnnar di-t\u0259zdayam
  t\u0259zd\u0259yam Abba-nin \u0259ntada.\\\" 20 Batuten \u0161in itagg-enat \u0194aysa
  assa\u0263a wa da\u0263 isasa\u0263ru da\u0263 Ahan \u0259n M\u0259\u0161\u0161ina
  \u0263ur adag wa da\u0263 tiddawan \u0259rr\u0259z\u0259\u0263an. Mi\u0161an w\u0259r
  t-illa i igmayan d a t-ab\u0259z f\u0259las alwaq-net a du-w\u0259r-newed harwada.\\nW\u0259r
  t\u0259fregam iki \u0259n dad \u0259kke\\n21 Ilas \u0194aysa inn-asan: \\\"Teklay
  a z-aga, amaran a di-t\u0259s\u0259ss\u0259gg\u0259lam, mi\u0161an a kawan-iba da\u0263
  ti\u0161it \u0259n nasbakkadan. W\u0259r t\u0259fregam a di-in-t\u0259lk\u0259mam
  s adag wa \u0259kke.\\\" 22 Ad tin\u0259m\u0259nnin arat da\u0263 K\u0259l-\u018fly\u0259hud
  gar-essan: \\\"Meqqal iman-net a z-an\u0263u, f\u0259las a inna w\u0259r n\u0259freg
  a das-n\u0259lk\u0259m s adag wa ikka.\\\" 23 Inn-asan \u0194aysa: \\\"Kawanay aytedan
  n ares a t\u0259mosam, nak in afalla. Kawanay k\u0259l \u0259dd\u0259net a da a
  t\u0259mosam, nak w\u0259r di-t\u0259la \u0259dd\u0259net a. 24 A di da f\u0259l
  dawan-\u0259nne a kawan-iba da\u0263 ti\u0161it \u0259n nasbakkadan. As w\u0259r
  t\u0259zz\u0259gzanam as \u0259mosa ''Wa Illan da'', \u0259lasa\u0263-awan emel
  n as a kawan-iba da\u0263 igi \u0259n bakkadan.\\\" 25 \\\"Ma t\u0259mosa\u0263?\\\"
  \u0259nnan-as. Inn-asan \u0194aysa: \\\"Awa dawan-\u0259mmala \u0263ur tizarat har
  harwa a mosa.\\\" 26 \u018fllan-tu aratan aggotnen as \u0259fraga\u0263 a tan-anna
  da\u0263 tal\u0263a-nawan, \u0259llan-awan-tu attadiban aggotnen. Mi\u0161an wa
  di-d-iss\u0259glan M\u0259\u0161\u0161is \u0259n tid\u0259t a imos, amaran arat
  wa di-d-inna, a \u0259mmala y \u0259dd\u0259net.\\\" 27 W\u0259r \u0259gren as Abba
  f\u0259l dasan-imm\u0259grad. 28 T\u0259zzar inn-asan \u0194aysa: \\\"As t\u0259gam
  iman n Ag Awedan s \u0259s\u0259hhuki wa das-za-tagim f\u0259l t\u0259g\u0259ttawt,
  ad t\u0259ss\u0259nam as nak \u0259mosa ''Wa Illan da''. Ad t\u0259ss\u0259nam as
  w\u0259r t-illa a tagga g\u0259r-i \u0259d man-in, arat wa di-isassa\u0263ra Abba
  \u0263as a ganna. 29 Wa di-d-izammazalan iddew d\u0259r-i. W\u0259r di-oyya \u0263as-in
  f\u0259las faw da arat wa das-igrazan \u0263as a tagga.\\\" 30 Amazay wa da\u0263
  inna \u0194aysa arat wa, \u0259zz\u0259gzanan s\u0259r-\u0259s aytedan aggotnen.\\nWin
  \u0259mosnen \u0259zzurr\u0259ya n Ibrahim \u0259s tid\u0259t\\n31 T\u0259zzar inna
  \u0194aysa i K\u0259l-\u018fly\u0259hud win s\u0259r-\u0259s \u0259zz\u0259gzanen:
  \\\"As t\u0259bb\u0259rdagam y awa kawan-sassa\u0263ra, \u0259ddi t\u0259mosam inalkiman-in
  win tid\u0259t, 32 t\u0259ss\u0259nam tid\u0259t, tid\u0259t amaran \u0259nta kawan-za-t\u0259s\u0259ll\u0259llet.\\\"
  33 \u018fnnan-as: \\\"Nakkanay ya \u0259zzurr\u0259yya n \u0259nn\u0259bi Ibrahim
  a n\u0259mos, w\u0259r kala da\u0263 \u0259dd\u0259net ad n\u0259qqal eklan \u0259n
  waliyyan, mafel as t\u0259ganna: ''Ad tallallem''?\\\" 34 Inn-asan \u0194aysa: \\\"\u018fgg\u0259ye\u0263
  \u0259silakana\u0263-awan as awedan kul wa itaggin ibakkadan, w\u0259di akli \u0259n
  bakkadan a imos. 35 \u018fnta akli w\u0259r das-t-illa adag \u0259n faw da\u0263
  a\u0263aywan, mi\u0161an Barar wa eraw a\u0263aywan w\u0259di edag-net ill-ay har
  faw. 36 Da\u0263 adi as kawan-isaddarfat Barar, w\u0259di ad tallallem \u0259s tid\u0259t.
  37 \u018fssana\u0263 as \u0259zzurr\u0259yya n Ibrahim a t\u0259mosam, mi\u0161an
  t\u0259gammayam d ad tagim iman-in f\u0259las awal-in w\u0259r ides iwallan-nawan.
  38 Nak arat wa \u0259naya \u0263ur Abba-nin a \u0259mmala, amaran kawanay t\u0259taggim
  awa as t\u0259slam \u0263ur abba-nawan Iblis.\\\" 39 \u018fnnan-as: \\\"Abba-nana
  ya Ibrahim a t-imosan.\\\" Inn-asan \u0194aysa: \\\"\u018fnnar tid\u0259t \u00e2s
  t\u0259mosam bararan n Ibrahim ad t\u0259taggim imazalan win iga Ibrahim. 40 Kawanay
  amaran \u0259m\u0259r\u0259dda t\u0259gammayam \u0259d tana\u0263ay-nin, nak imosan
  awedan dawan-immalan tid\u0259t s \u0259mm\u0259k was di-tat-d-inna M\u0259\u0161\u0161ina.
  Arat w\u0259di w\u0259r t-iga Ibrahim. 41 Imazalan win iga abba-nawan a t\u0259taggam.\\\"
  \u018fnnan-as: \\\"Nakkanay w\u0259r n\u0259mos iniba; w\u0259r n\u0259la ar abba
  iyyanda a t-imosan M\u0259\u0161\u0161ina.\\\" 42 Inn-asan \u0194aysa: \\\"\u018fnnar
  M\u0259\u0161\u0161ina a imosan Abba-nawan tarim-i, f\u0259las M\u0259\u0161\u0161ina
  a d-\u0259gmada, \u0259nta a d-\u0259fala, w\u0259rge g\u0259r-i \u0259d man-in
  as d-ose, kalar \u0259nta di-d-izammazalan. 43 Mafel w\u0259r t\u0259grem t\u0259maj\u0259q-in?
  W\u0259r dawan-igdel \u0259g\u0259rri-net ar as w\u0259r t\u0259fregam \u0259s\u0259s\u0259m
  y awal-in. 44 W\u0259r t\u0259lem da\u0263 abbatan ar A\u0161\u0161aytan, amaran
  t\u0259ram ad tassandim deranan n abba-nawan. Harwa \u0263ur \u0259n\u0259tti ad
  iqqal \u0259ljani, amaran w\u0259r ibded da\u0263 tid\u0259t, f\u0259las w\u0259r
  t\u0259ha tid\u0259t \u0259w\u0259l-net. Igi \u0259n bahu a imosan \u0259tt\u0259bi\u0263at-net
  f\u0259las anasbahu a imos n abba \u0259n bahu. 45 Mi\u0161an nak tid\u0259t as
  tamagrada. Adi da f\u0259l di-w\u0259r-t\u0259zz\u0259gzanam. 46 Ma da\u0263-wan
  imos wa z-isattaddin as \u0259ge\u0263 ibakkadan? Kud tid\u0259t a \u0259mmala mafel
  w\u0259r di-t\u0259zz\u0259gzanam? 47 Awedan imosan arat da\u0263 tamattay \u0259n
  M\u0259\u0161\u0161ina, \u0259s\u0259s\u0259m a itaggu y awal \u0259n M\u0259\u0161\u0161ina.
  Kawanay amaran w\u0259r t\u0259s\u0259simam, f\u0259las w\u0259r t\u0259mosam tamattay
  \u0259n M\u0259\u0161\u0161ina.\\\"\\n\u0194aysa d Ibrahim\\n48 T\u0259zzar \u0259nnan
  K\u0259l-\u018fly\u0259hud i \u0194aysa: \\\"W\u0259rge\u0263 kala n\u0259nna kay
  iyyan da\u0263 K\u0259l Samar\u0259ya a t\u0259mosa\u0263 amaran izdaq-qay agg\u0259suf?\\\"
  49 Inn-asan \u0194aysa: \\\"W\u0259r di-izde\u0263 agg\u0259suf, Abba-nin \u0263as
  a \u0259ss\u0259\u0263mara, kawanay amaran w\u0259r di-t\u0259ss\u0259\u0263maram.
  50 W\u0259r g\u0259mm\u0259ya adkul i man-in. Ill-ay wa di-igammayan adkul, amaran
  \u0259nta a ixakkaman. 51 \u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan as awedan
  wa ittafan awal-in, w\u0259r ilkem ad inay t\u0259mattant.\\\" 52 \u018fnnan-as
  arat da\u0263 K\u0259l-\u018fly\u0259hud: \\\"\u018fm\u0259r\u0259dda ad n\u0259kkas
  a\u0161\u0161ak as izdaq-qay agg\u0259suf! Ibrahim da aba-tu \u0259nta harkid \u0259nn\u0259bitan
  kul, kay amaran t\u0259ganna: ''Awedan kul wa ittafan awal-in w\u0259r ilkem ad
  t-aba.'' 53 Abba-nana\u0263 Ibrahim da aba-tu: torde\u0263 as togaraq-qu almaqam?
  \u018fnn\u0259bitan da aba-tan. Kay ma t\u0259xsaba\u0263 iman-nak?\\\" 54 Inn-asan
  \u0194aysa: \\\"As imos as iman-in f\u0259l sanamala, w\u0259di w\u0259r \u0259le\u0263
  adkul waliyyan. Abba-nin a di-ihakkan adkul, \u0259nta as t\u0259gannim: ''Imos
  \u018fm\u0259li-nana'', 55 amaran w\u0259r tu-t\u0259zdayam, mi\u0161an nak \u0259zdayaq-qu.
  As \u0259nne w\u0259r t-\u0259zdaya, w\u0259di ad \u0259qq\u0259la\u0263 anasbahu
  \u0259n \u0161ilat-nawan. Kalar \u0259zdayaq-qu, amaran \u0259ttafa\u0263 awal-net.
  56 Abba-nawan Ibrahim im\u00e2l-tu \u0259d t\u0259d\u0259wit f\u0259l as das-igmad
  a\u0161\u0161ak as ad in\u0259y assa-nin, amaran inay-tu, ikna t\u0259falawist y
  awen.\\\" 57 \u018fnnan-as K\u0259l-\u018fly\u0259hud: \\\"Kay w\u0259r teweda wala
  s\u0259mmosat t\u0259m\u0259rwen n awatay eges t\u0259nne t\u0259naya\u0263 Ibrahim?\\\"
  58 Inn-asan: \\\"\u018fgg\u0259yye silakana\u0263-awan as dat t\u0259hut n Ibrahim
  da nak \u0259mosa ''Wa Illan da''.\\\" 59 T\u0259zzar ad takammen \u0161ihun y a
  das-agin zabaw, mi\u0161an ya il\u0263as-asan, igmad afarag n Ahan \u0259n M\u0259\u0161\u0161ina.\\nYaxya
  9\\n\u018fzuz\u0259y wa iga \u0194aysa y awedan a d-ih\u0259wan \u0259d taddar\u0263alt\\n2
  \u018fss\u0259stanan-tu nalkiman-net \u0259nnan-as: \\\"\u018f\u0161\u0161ix, mafel
  ih\u0259w-d'' al\u0259s a imos \u0259m\u0259dder\u0263\u0259l? Ak \u0259dd\u0259lil
  n abakkad-net, me\u0263 ak abakkad \u0259n marwan-net?\\\" 3 Inn-asan \u0194aysa:
  \\\"W\u0259rmad iddir\u0263al f\u0259l \u0259dd\u0259lil n abakkad-net, wala de\u0263
  abakkad \u0259n marwan-net. W\u0259r idd\u0259r\u0263al ar y a fall-as t\u0259t\u0259w\u0259n\u0259y
  tarna \u0259n M\u0259\u0161\u0161ina. 4 Iwar-ana\u0263 ad naknu \u0259\u0161\u0161\u0259\u0263\u0259lan
  \u0259n wa di-d-iss\u0259glan iket di ad ig''azal, f\u0259las ehad izay-du, amaran
  w\u0259r t-illa i da\u0263-as ifragan \u0259\u0161\u0161\u0259\u0263\u0259l. 5 Iket
  \u0259he\u0263 \u0259dd\u0259net \u0259mosa\u0263 \u0259nnur n \u0259dd\u0259net.\\\"\\n6
  As iga batu ta, issotaf da\u0263 amadal, ig'' arat \u0259n talaq \u0259s t\u0259sutaf-net,
  iss\u0259lal-tat i \u0161ittawen n \u0259m\u0259dder\u0263\u0259l, 7 inn-as: \\\"Aglu
  \u0161ir\u0259d ud\u0259m-nak da\u0263 t\u0259\u0263azart ta n Siloxam (es\u0259m
  wa alma\u0263na-net anammazal.) Igla \u0259m\u0259dder\u0263\u0259l i\u0161\u0161orad
  ud\u0259m-net, as d-iqqal da ihannay. 8 Ad gannin naragan-net, d aytedan win t-\u0259naynen
  imos \u0259mansay dat awen: \\\"Ak awa w\u0259rge\u0263 \u0259m\u0259dder\u0263\u0259l
  was faw iqqim itansay?\\\" 9 Wiyyad gannin: \\\"\u018fnta da\u0263 awen.\\\", wiyyad
  \u0259nta da gannin: \\\"Kala, tulat \u0263as d\u0259r-\u0259s iga.\\\" \u018fnta
  amaran igannu: \\\"Nak da\u0263 awa.\\\" 10 A tu-sastanan gannan-as: \\\"M\u0259ni
  esaway was t\u0259grawa\u0263 asawad-nak?\\\" 11 Inn-asan: \\\"Al\u0259s as gannin
  \u0194aysa, a igan arat \u0259n talaq, t\u0259zzar iss\u0259lal-tat i \u0161ittawen-in,
  inn-i ad agla\u0263 \u0259\u0161\u0161ir\u0259da\u0263 ud\u0259m-in da\u0263 t\u0259\u0263azart
  ta n Siloxam. \u018fgle\u0263 \u0259\u0161\u0161oradaq-qu \u0263as, \u0259grawa\u0263
  asawad-in.\\\" 12 \u018fnnan-as: \\\"Ma iga za al\u0259s w\u0259di?\\\" Inn-asan:
  \\\"W\u0259r \u0259ssena\\\". 13 \u018flwayan aytedan win al\u0259s was kala ad
  imos \u0259m\u0259dder\u0263\u0259l, har d\u0259r-\u0259s osan Farisaytan. 14 \u018fnta
  \u0259z\u0259l \u0259n t\u0259sanfawt \u0259n K\u0259l-\u018fly\u0259hud a da\u0263
  iga \u0194aysa talaq, iss\u0259swad \u0259m\u0259dder\u0263\u0259l wen. 15 A tu-sastanan
  Farisaytan \u0259ntanay da d asaway was igraw asawad-net. Inn-asan al\u0259s wa:
  \\\"Arat \u0259n talaq a iga f\u0259l \u0161ittawen-in, \u0259\u0161\u0161orada\u0263
  ud\u0259m-in, amaran \u0259m\u0259r\u0259dda \u0259hannaya.\\\" 16 Ad gannin arat
  da\u0263 Farisaytan: \\\"Al\u0259s wa igan arat wa, w\u0259r d-ifel M\u0259\u0161\u0161ina
  f\u0259las w\u0259r isassahat \u0259z\u0259l \u0259n t\u0259sanfawt-nana.\\\" \u018fnnan
  wiyyad: \\\"Al\u0263alamaten \u0161in, man\u0259mm\u0259k as tanat-z-ag'' awedan
  imosan anasbakkad?\\\" T\u0259zzar \u0259mm\u0259zrayan da\u0263 tal\u0263a ten.
  17 T\u0259zzar \u0259lasan \u0259s\u0259stan n al\u0259s was kala ad idd\u0259r\u0263al
  \u0259nnan-as: \\\"Kay a innan izzozay-kay al\u0259s da\u0263 taddar\u0263alt, \u0259m\u0259l-ana\u0263
  aw''as torde\u0263 as imos-tu.\\\" Inn-asan: \\\"\u018fnn\u0259bi a imos.\\\" 18
  \u018fglan Farisaytan w\u0259r \u0259zz\u0259gzanan as al\u0259s wa kala ad idd\u0259r\u0263al
  har du-sassa\u0263ran imarwan-net. 19 \u018fnnan-asan: \\\"\u018fnta da da barar-nawan
  was t\u0259nnam as d-ih\u0259w da iddir\u0263al? M\u0259ni t\u0259m\u0259wit tas
  igraw asawad-net \u0259m\u0259r\u0259dda?\\\" 20 \u018fnnan-asan marwan n al\u0259s:
  \\\"N\u0259ssan as barar-nana\u0263 a imos, n\u0259ssan \u0259ntada as as d-ih\u0259w
  da iddir\u0263al, 21 mi\u0161an w\u0259rmad n\u0259ssan t\u0259m\u0259wit tas igraw
  asawad-net, za wala de\u0263 awedan wa t-iss\u0259swadan. S\u0259st\u0259nat-tu
  iman-net, f\u0259las al\u0259s wa\u0161\u0161aran a imos ifragan ad ammagrad da\u0263
  tal\u0263a ta tu-t\u0259qqalat.\\\" 22 Batu ta w\u0259r tat-\u0259gen marwan-net
  ar f\u0259l t\u0259ks\u0259da \u0259n muzaran \u0259n K\u0259l-\u018fly\u0259hud
  f\u0259las t\u0259nna a gan awedan kul wa igg\u0259yyen as \u0194aysa a imosan \u018flm\u0259six,
  w\u0259di ad t-\u0259kk\u0259san da\u0263 tiddawat \u0259n t\u0259m\u0259zg\u0259dda
  \u0259n K\u0259l-\u018fly\u0259hud. 23 Awen da f\u0259l \u0259nnan marwan-net: \\\"Tu\u0161aray-net
  t\u0259\u0161i\u0161awad-tu dawan ammagrad da\u0263 tal\u0263a ta tu-t\u0259qqalat,
  s\u0259st\u0259nat-tu.\\\" 24 \u018flasan-du Farisaytan te\u0263aray n al\u0259s
  was kala ad imos \u0259m\u0259dder\u0263\u0259l \u0259nnan-as: \\\"Iksad M\u0259\u0161\u0161ina
  t\u0259m\u0259la tid\u0259t. Nakkanay n\u0259ssan as al\u0259s di anasbakkad.\\\"
  25 Inn-asan al\u0259s wa: \\\"Nak w\u0259r \u0259ssena kud anasbakkad a imos wala.
  Arat iyyanda \u0263as da\u0263 \u0259ssana: as kala ad \u0259mosa\u0263 \u0259m\u0259dder\u0263\u0259l,
  \u0259m\u0259r\u0259dda amaran \u0259hannaya.\\\" 26 D\u0259ff\u0259r awen \u0259nnan-as:
  \\\"Ma imos arat wa dak-iga? M\u0259ni esaway was kay iss\u0259swad?\\\" 27 Inn-asan:
  \\\"Arat w\u0259di ya \u0259mala\u0263-awan-tu mi\u0161an w\u0259r di-t\u0259ss\u0259samam.
  Mafel as t\u0259ram a dawan-t-\u0259l\u0259sa\u0263 emel? Meqqal ak kawanay da a
  t\u0259ram ad t\u0259qq\u0259lam inalkiman-net ketnawan?\\\" 28 \u018frbadan-tu
  \u0259nnan-as: \\\"Kay a imosan \u0259nalkim-net, nakkanay inalkiman \u0259n Musa
  a n\u0259mos. 29 Musa n\u0259ssan as i\u0161\u0161ewal-as M\u0259\u0161\u0161ina,
  amaran al\u0259s w\u0259di w\u0259r n\u0259ssen sas d-iha fadda.\\\" 30 Inn-asan:
  \\\"Al\u0259s wa w\u0259r t\u0259ssenam wala sas d-iha mi\u0161an izzozay-i da\u0263
  taddar\u0263alt! Arat ya wa \u0259nta a isammaklalan w\u0259llen!\\\" 31 T\u0259ssanam
  as M\u0259\u0161\u0161ina w\u0259r iq\u0259bb\u0259l \u0161iwatriwen \u0259n nasbakkadan.
  As das-ibb\u0259rdag awedan, itamazal tara-net, \u0259ddi ad iqqabbal \u0161iwatriwen-net.
  32 W\u0259r kala ad itawasla awedan issiswadan i d-ih\u0259wan \u0259d taddar\u0263alt.
  33 \u018fnnar imos as al\u0259s di w\u0259r d-ifel M\u0259\u0161\u0161ina, w\u0259r
  z'' ifr\u0259g igi \u0259n wala.\\\" 34 Hara\u0161\u0161en-tu \u0259nnan-as: \\\"Ko!
  Adis kay was as du-t\u0259huwa da t\u0259mosa t\u0259b\u0259lul\u0259q n abakkad,
  kay a iran a dana-takfa\u0263 alfaydaten?\\\" T\u0259zzar \u0259sta\u0263an-tu da\u0263
  adag wen.\\nAytedan win \u0259dd\u0259r\u0263alnen da\u0263 \u0259ddin\\n35 As isla
  \u0194aysa \u0259mazal wa igan da, t\u0259zzar iswad y al\u0259s wen har t-igraw
  inn-as: \\\"Kay ak t\u0259zzigzana s Ag Awedan?\\\" 36 Inn'' al\u0259s i \u0194aysa:
  \\\"\u018fm\u0259l-i a wa imos, \u018fm\u0259li-nin, f\u0259las are\u0263 a s\u0259r-\u0259s
  \u0259zz\u0259gz\u0259na.\\\" 37 Inn-as \u0194aysa: \\\"T\u0259nayaq-qu, amaran
  \u0259nta dada dak-imm\u0259gradan da.\\\" 38 Inn-as al\u0259s: \\\"Ayew, \u018fm\u0259li-nin,
  \u0259zzigzana\u0263.\\\" T\u0259zzar iss\u0259jad-as. 39 Amaran inna \u0194aysa:
  \\\"Nak assa a d-\u0259ge\u0263 \u0259dd\u0259net f\u0259l ad agu \u0259\u0161\u0161\u0259ri\u0263a,
  y ad \u0259sw\u0259dan win w\u0259r n\u0259h\u0259nn\u0259y, addar\u0263alan win
  hannaynen.\\\" 40 \u018fslan arat da\u0263 Farisaytan win d\u0259r iddew y awa inna
  da \u0259nnan-as: \\\"Da\u0263 adi nakkanay da im\u0259dd\u0259r\u0263al a n\u0259mos?\\\"
  41 Inn-asan \u0194aysa: \\\"\u018fnnar t\u0259mosam im\u0259dd\u0259r\u0263al w\u0259r
  za tilem lahan, mi\u0161an dad imos as t\u0259gannim: ''Nakkanay n\u0259hannay'',
  w\u0259di kawanay t\u0259llam-tu \u0259d lahan.\\\"\\n\u0194aysa \u0259nta a imosan
  amadan wa ola\u0263an\\nYaxya 10\\n2 Amaran wa d-iggazan s \u0259mi n afarag, w\u0259di
  \u0259nta a imosan amadan n ayf\u0259d. 3 \u018fna\u0263lif n afarag a z'' al\u0259man
  imi, \u0259ss\u0259s\u0259mnat ayf\u0259d y \u0259m\u0259sli n amadan, ad i\u0263arru
  \u0161in-net s esmawan-nasnat isardaq-qanat afarag. 4 As d-i\u0263rad ikus \u0259n
  \u0161in-net, a dasnat-izar, t\u0259zzar \u0259lk\u0259mnat-as, f\u0259las \u0259zdaynat
  \u0259m\u0259sli-net. 5 As ig''awen awedan wa dasnat-imosan \u0259nafta\u0263, w\u0259r
  das-z-\u0259lk\u0259mnat, ewef fadda tu-z-aginat f\u0259las w\u0259r \u0259zdaynat
  \u0259m\u0259sli-net.\\\" 6 \u018flmital wa da dasan-iga \u0194aysa, mi\u0161an
  w\u0259r \u0259gren alma\u0263na n awa da\u0263 imm\u0259grad da.\\n7 Ilas \u0194aysa
  inn-asan: \\\"\u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan as nak a imosan
  imi w''as radda\u0263nat ayf\u0259d. 8 Win dat-i d-osanen kul ibaydagan \u0259n
  jujab \u0259n z\u0259nga a mosan amaran w\u0259r dasan-\u0259ss\u0259samnat ayf\u0259d.
  9 Nak a imosan imi. Wa s\u0259r-i d-iggazan ad afsu. Ifrag ad itaggaz iradda\u0263,
  igr\u0259w \u0259ntada imensewan-net. 10 Abaydag w\u0259r d-itisu ar f\u0259l \u0161ikra,
  d igi \u0259n man d \u0259hluk. Nak amaran ose-du f\u0259l ad \u0259gr\u0259wan
  aytedan t\u0259m\u0259ddurt, \u0259gr\u0259wan-tat da za \u0259s t\u0259m\u0259wit
  w\u0259r n\u0259la \u0259ddukad. 11 Nak a imosan amadan wa ola\u0263an. Amadan wa
  ola\u0263an iman-net a isamalkaw f\u0259l ayf\u0259d-net. 12 Mi\u0161an awedan was
  \u0259t\u0259w\u0259\u0263far a iga f\u0259l ad id\u0259n ayf\u0259d, w\u0259r tanat-ila,
  w\u0259di as ogga \u0259ridal izay-tanat-du, ad addaggag ayy-enat-in, t\u0259zzar
  ab\u0259z da\u0263-asnat \u0259ridal awa ira, iz\u0259ww\u0259ziw\u0259z-tanat.
  13 Arat wa itagg-ay al\u0259s wa f\u0259las \u0259t\u0259w\u0259\u0263far a iga
  y \u0259\u0161\u0161\u0259\u0263\u0259l wa, w\u0259r izlay a \u0259ganat ayf\u0259d.
  14 Nak a imosan amadan wa ola\u0263an. \u018fzdaya\u0263 ayf\u0259d-in, ayf\u0259d-in
  de\u0263 \u0259zdaynat-i, 15 zun \u0259mm\u0259k was di-izday Abba-nin, d \u0259mm\u0259k
  was t-\u0259zdaya nak da. Iman-in simalkawaq-qan f\u0259l ayf\u0259d-in. 16 \u018fle\u0263
  ayf\u0259d \u0161iyyad \u0259ntada w\u0259r n\u0259ha afarag wa. \u018fntanatay
  da kundaba azzara\u0263-asnat. Ad aslinat y \u0259m\u0259sli-nin, \u0259qq\u0259lnat
  \u0259s\u0259g\u0259n iyyanda ilan amadan iyyanda. 17 Abba ir-i f\u0259las iman-in
  a sammalkawa f\u0259l a tan-\u0259l\u0259sa\u0263 agaraw. 18 W\u0259r t-illa i da\u0263-i
  z''ab\u0259zan iman, kalar iman-in a sammalkawa\u0263 \u0259s t\u0259radawt-in.
  \u018fle\u0263 f\u0259rregat n \u0259s\u0259mm\u0259lk\u0259w-nasan, \u0259le\u0263
  da f\u0259rregat n agaraw-nasan tolas. \u018fnta da da\u0263 arat was di-omar Abba-nin
  s igi-net.\\\" 19 Ilas ades \u0259n K\u0259l-\u018fly\u0259hud \u0259m\u0259zr\u0259y
  da\u0263 tal\u0263a n aratan win igannu da. 20 A da\u0263-san aggen gannin: \\\"Al\u0259s
  wa agg\u0259suf a t-izda\u0263an! Awa \u0259meskel! Mafel t\u0259ssisamam-as?\\\"
  21 Wiyyad gannin: \\\"Awedan izda\u0263 agg\u0259suf w\u0259r it\u0259ggu awal olan
  d awa. Tordam as ill-ay agg\u0259suf ifragan \u0259s\u0259sw\u0259d \u0259n m\u0259dd\u0259r\u0263al?\\\"\\n\u0194aysa
  \u0259nta a imosan \u018flm\u0259six, imos Barar \u0259n M\u0259\u0161\u0161ina\\n22
  Azzaman en tagr\u0259st, ewad-du \u0259mud \u0259n saktan n \u0259t\u0259w\u0259z\u0259zdag
  n Ahan \u0259n M\u0259\u0161\u0161ina da\u0263 Yerusalam. 23 Itij\u0259w\u0259nkit
  \u0194aysa da\u0263 Ahan \u0259n M\u0259\u0161\u0161ina da\u0263 tarrayt t\u0259falat
  as itawannu \\\"ta n Suliman.\\\" 24 \u0194ilay\u0263alayan-tu K\u0259l-\u018fly\u0259hud
  win \u0259llanen den gannin-as: \\\"Kay ak har \u0259mmay w\u0259r dana-tore da\u0263
  a\u0263af? Kud kay \u018flm\u0259six a t\u0259mosa, t\u0259z\u0259lul\u0259\u0263a-du
  tanna\u0263-anaq-qu.\\\" 25 Inn-asan \u0194aysa: \\\"\u018fnne\u0263-awan-tu, mi\u0161an
  w\u0259r di-t\u0259zz\u0259gzanam. Imazalan win \u0259ge s es\u0259m n Abba-nin,
  \u0259gg\u0259yyen-i. 26 Mi\u0161an w\u0259r di-t\u0259zz\u0259gzanam f\u0259las
  w\u0259r t\u0259tabaqqem da\u0263 ayf\u0259d-in. 27 Ayf\u0259d-in \u0259sallinat
  y \u0259m\u0259sli-nin, \u0259zdayaq-qanat, amaran \u0259lkamnat-i. 28 \u018fkfeq-qanat
  t\u0259m\u0259ddurt t\u0259\u0263lalat, w\u0259r ilkem ad oxsaynat, amaran w\u0259r
  t-illa i tanat-z-irk\u0259ban da\u0263 \u0259fus-in. 29 Abba-nin wa di-tanat-ikfan,
  ogar i t-illan kul t\u0259zz\u0259w\u0259rt. Amaran w\u0259r t-illa i tanat-z-irk\u0259ban
  da\u0263 \u0259fus n Abba. 30 Nak d Abba arat iyyanda a n\u0259mos.\\\" 31 \u018flasan-du
  s\u0259r-\u0259s adakal \u0259n t\u0259hun y ad t-an\u0263in. 32 Ilas \u0194aysa
  inn-asan: \\\"\u018fssiknaq-qawan imazalan aggotnen ola\u0263nen a d-\u0259falnen
  Abba. M\u0259ni da\u0263-san wa f\u0259l taram a di-tan\u0263im?\\\" 33 \u018fnnan-as:
  \\\"Nakkanay w\u0259r n\u0259ra tena\u0263ay-nak f\u0259l as t\u0259ge\u0263 \u0259mazal
  ola\u0263an, kalar \u0259madraw wa t\u0259ge\u0263 \u0259ddi a f\u0259l kay za nan\u0263u.
  Kay w\u0259r t\u0259mosa\u0263 ar aggad\u0259m amaran tare\u0263 ad taga\u0263 iman-nak
  M\u0259\u0161\u0161ina.\\\" 34 Inn-asan \u0194aysa: \\\"Ak \u0259lqanun-nawan w\u0259rge\u0263
  ikt\u00e2b da\u0263-as as inna M\u0259\u0161\u0161ina: ''kawanay t\u0259mosam m\u0259\u0161\u0161inatan''?\\n35
  W\u0259r n\u0259freg a din-n\u0259g\u0259r arat wa ihan Ik\u0259tban. Es\u0259m
  wa n m\u0259\u0161\u0161inatan, i\u0263ra s\u0259r-\u0259s M\u0259\u0161\u0161ina
  aytedan win t\u0259kka batu ta iga da. 36 Nak M\u0259\u0161\u0161ina di-isannafranan
  izammazal-i-du s \u0259dd\u0259net. Man\u0259mm\u0259k da\u0263 adi as za tannim
  tagga\u0263 \u0259madraw f\u0259l as \u0259nne: ''\u018fmosa Barar \u0259n M\u0259\u0161\u0161ina''?
  37 As imos as w\u0259r t\u0259gga\u0263 imazalan win as di-d-iss\u0259gla Abba-nin
  y a tan-aga, a di-w\u0259r-t\u0259zz\u0259gz\u0259nam. 38 Mi\u0161an dad imos as
  taggaq-qan, w\u0259di kud s\u0259r-i w\u0259r t\u0259zz\u0259gzanam da, z\u0259gz\u0259nat
  kudde\u0263 \u0259s mazalan win tagga, f\u0259l ad t\u0259ss\u0259nam, tassantim
  \u0259ntada \u0259g\u0259rri n as Abba irtay d\u0259r-i, nak de\u0263 \u0259rtaya
  d Abba.\\\" 39 \u018flasan agamay d abbaz-net, mi\u0161an ya igmad-tan. 40 Ilas
  \u0194aysa iki \u0259n t\u0259gadamayt ta hadat \u0259n Yordan, da\u0263 adag wa
  da\u0263 iss\u0259nta Yaxya \u0259s\u0259lm\u0259\u0263 n aytedan da\u0263 aman,
  t\u0259zzar iqqim den da. 41 Osan-t-in aytedan aggotnen, gannin: \\\"Yaxya w\u0259r
  iga al\u0263alamat waliyyat, mi\u0161an aratan kul win dana\u0263-inna s al\u0259s
  wa, \u0259mosan tid\u0259t.\\\" 42 Den da\u0263 ad \u0259zz\u0259gzanan aytedan
  aggotnen \u0259s \u0194aysa.\\nYaxya 11\\nIba \u0259n Lazar\u0259s\\n2 Maryama \u0259nt''a
  t\u0259zwayat alwardi y \u018fm\u0259li \u0194aysa, t\u0259zzar t\u0259mas-as idaran-net
  \u0259s j\u0259kkad-net. Amaran amadray-net Lazar\u0259s a irinan den. 3 Sassawaynat
  t\u0259m\u0259drayen-net \u0259mazal i \u0194aysa as: \\\"\u018fm\u0259li, \u0259m\u0259ri-nak
  irin.\\\"\\n4 Assa\u0263a wad isla \u0194aysa i salan win den, inna: \\\"T\u0259s\u0259lkamt
  \u0259n t\u0259w\u0259rna ten, w\u0259r t\u0259mos t\u0259mattant \u0259n Lazar\u0259s,
  arat a t\u0259mos a z'' assaknin atkul \u0259n M\u0259\u0161\u0161ina, is\u0259nn\u0259fil\u0259l-du
  \u0259ntada atkul wa ila Barar \u0259n M\u0259\u0161\u0161ina.\\\" 5 \u018fnta \u0194aysa
  ira Marta w\u0259llen, \u0259nta \u0259d t\u0259madrayt-net, \u0259d Lazar\u0259s.
  6 Isla as irin, mi\u0161an iga d\u0259ff\u0259r awen \u0259\u0161\u0161in adan w\u0259r
  igmed edag wa iha. 7 D\u0259ff\u0259r adi inna i nalkiman-net: \\\"\u018fndawat
  ad n\u0259qq\u0259l Yahud\u0259ya.\\\" 8 \u018fnnan-as nalkiman-net: \\\"\u018f\u0161\u0161ix-nana,
  imuzaran-nana w\u0259rge edes-nasan s\u0259ket dada da gammayan \u0259d tana\u0263ay-nak,
  kay amaran tare\u0263 tewa\u0263lay n akal wen?\\\" 9 Inn-asan \u0194aysa: \\\"\u018fz\u0259l
  w\u0259rge\u0263 maraw alwaqan d \u0259\u0161\u0161in a imos? As ijiwankat awedan
  da\u0263 azal, w\u0259r z'' itin\u0259b\u0259tut\u0259w, f\u0259las ihannay \u0259nnur
  n \u0259dd\u0259net. 10 Mi\u0161an as ijawankat awedan da\u0263 ahad, ad itin\u0259b\u0259tut\u0259w,
  f\u0259las w\u0259r t-iha \u0259nnur.\\\" 11 D\u0259ff\u0259r as iga batu ta inna
  tolas: \\\"\u018fmidi-nana Lazar\u0259s ins\u00e2, ad agla\u0263 a t-id-\u0259ss\u0259nk\u0259ra.\\\"
  12 \u018fnnan-as nalkiman-net: \\\"\u018fm\u0259li, dad zamas ins\u00e2, w\u0259di
  \u0259ng\u0259m ad izz\u0259y.\\\" 13 \u018fnta \u0194aysa t\u0259mattant \u0259n
  Lazar\u0259s f\u0259l dasan-imm\u0259grad den, mi\u0161an \u0259ntanay a \u0263ilan
  et\u0259s wa n al\u0263adat as igannu. 14 T\u0259zzar izalala\u0263-du inn-asan:
  \\\"Lazar\u0259s aba-tu. 15 Amaran isidawat-i as w\u0259r \u0259lle sen da\u0263
  alwaq w\u0259di, f\u0259las arat wa \u0259nta s\u0259r-wan du-z-aw\u0259yan a s\u0259r-i
  t\u0259zz\u0259gz\u0259nam. Mi\u0161an \u0259m\u0259r\u0259dda \u0259ndawatanaq-qu.\\\"
  16 Inkar Tuma was gannin Eknay, inna i nalkiman win hadatnen: \\\"\u018fndawat nakkanay
  da dana\u0263-iba n\u0259ddew d\u0259r-\u0259s.\\\"\\n\u0194aysa \u0259nta a imosan
  tanakra da\u0263 t\u0259mattant, imos t\u0259m\u0259ddurt\\n17 As din-osa \u0194aysa
  itt\u0259mal-as as Lazar\u0259s iga \u0259kkoz adan da\u0263 \u0259z\u0259kka. 18
  Betan\u0259y toray-du karad kilawtan \u0259s Yerusalam, 19 osan-in K\u0259l-\u018fly\u0259hud
  aggotnen Marta \u0259d Maryama f\u0259l a dasnat-in-\u0161\u0259ww\u0259\u0161k\u0259nan
  da\u0263 adag n amadray-nasnat. 20 As t\u0259sla Marta as \u0194aysa ihoz-du a\u0263r\u0259m,
  t\u0259ss\u0259lkad-as. Maryama \u0259nta t\u0259qqim-du da\u0263 a\u0263aywan.
  21 T\u0259nna Marta i \u0194aysa: \\\"\u018fm\u0259li, \u0259nnar t\u0259lle da,
  w\u0259r z'' iba amadray-nin. 22 Mi\u0161an \u0259m\u0259r\u0259dda da \u0259ssana\u0263
  as arat kul wa t\u0259gmaya da\u0263 M\u0259\u0161\u0161ina a dak-k-agu.\\\" 23
  Inn-as \u0194aysa: \\\"Amadray-nam a d-ink\u0259r da\u0263 t\u0259mattant.\\\" 24
  T\u0259nn-as Marta: \\\"\u018fssana\u0263 as amadray-nin a d-ink\u0259r \u0263ur
  tanakra n aytedan \u0259z\u0259l a ilkaman.\\\" 25 Inn-as \u0194aysa: \\\"Nak a
  imosan wa d-isankaran da\u0263 t\u0259mattant, \u0259mosa t\u0259m\u0259ddurt. Awedan
  wa s\u0259r-i izz\u0259gzanan, w\u0259di kud t-aba da a d-idd\u0259r. 26 Amaran
  awedan kul wa iddaran izzigzan s\u0259r-i, w\u0259di w\u0259r ilkem ad t-aba. T\u0259zzigzana\u0263
  arat w\u0259di?\\\" 27 \\\"Awalla\\\" t\u0259nn-as, \\\"\u018fm\u0259li, \u0259zzigzana\u0263
  as kay a imosan \u018flm\u0259six, t\u0259mosa Barar \u0259n M\u0259\u0161\u0161ina,
  barar was \u0259malan k\u0259tban as a d-as'' \u0259dd\u0259net.\\\"\\nTanakra \u0259n
  Lazar\u0259s da\u0263 t\u0259mattant\\n28 As t\u0259ga Marta batu ta, t\u0259kka
  t\u0259madrayt-net Maryama, t\u0259wat-tat s ahal t\u0259nn-as: \\\"\u018f\u0161\u0161ix
  illa-da, isastan d\u0259r-\u0259m.\\\" 29 As t\u0259graw Maryama isalan win, t\u0259ggad-du,
  t\u0259ss\u0259lkad i \u0194aysa. 30 As itagg''awen harwa da w\u0259r d-iggez a\u0263r\u0259m,
  w\u0259r igmed edag wa daq-q-in-tosa Marta. 31 K\u0259l-\u018fly\u0259hud win \u0259hanen
  ehan wen \u0259llan \u0263ur Maryama gammayan d \u0259s\u0259sm\u0259d-net, oggan-tat
  as du-t\u0259ggad tarmad t\u0259qqab, t\u0259zzar \u0259lkaman-as \u0259\u0263ilan
  \u0259z\u0259kka a t\u0259kka y a fall-as t\u0259hallu. 32 As din-tosa Maryama edag
  wa iha \u0194aysa togg-ay, t\u0259zzar t\u0259fataqqat \u0263ur daran-net, t\u0259nn-as:
  \\\"\u018fm\u0259li, \u0259nnar t\u0259lle da, w\u0259r z-iba amadray-nin.\\\" 33
  As tat-inay \u0194aysa t\u0259hallu, inay K\u0259l-\u018fly\u0259hud win d\u0259r-\u0259s
  d-\u0259ddewnen \u0259ntanay da \u0259hallin, t\u0259zzar ikna t\u0259r\u0259mmeq,
  \u0259\u0263\u0161adan man-net. 34 Inn-asan: \\\"M\u0259ni tu-t\u0259gam?\\\" \\\"\u018fm\u0259li\\\"
  \u0259nnan-as, \\\"Ayaw \u0259n\u0259y.\\\" 35 Ad ihallu \u0194aysa. 36 \u018fnnan
  aytedan: \\\"\u018fnawat awa d\u0259r togda tara ta iga y al\u0259s-wa.\\\" 37 Mi\u0161an
  \u0259nnan wiyyad da\u0263-san: \\\"Al\u0259s wa iss\u0259swadan \u0259m\u0259dder\u0263\u0259l,
  w\u0259rge\u0263 ifr\u00e2g a ad igd\u0259l i Lazar\u0259s t\u0259mattant?\\\" 38
  Ikna \u0194aysa t\u0259r\u0259mmeq tolas, t\u0259zzar ikk'' \u0259z\u0259kka. Awa
  \u0259z\u0259kka imosan \u0259zz\u0259n\u0259f n akazam, amaran t\u0259dbaq-qu t\u0259hunt
  z\u0259ww\u0259rat. 39 Inna \u0194aysa: \\\"\u018fkk\u0259sat-du t\u0259hunt!\\\"
  T\u0259nn-as Marta ta n tamadrayt n al\u0259s w'' aba: \\\"\u018fm\u0259li, al\u0259s
  di \u0259m\u0259r\u0259dda il''adu, f\u0259las \u0259z\u0259l-net wa n \u0259kkoz
  awa d anabal.\\\" 40 Inn-as \u0194aysa: \\\"W\u0259rge\u0263 \u0259nne\u0263-am
  as t\u0259zz\u0259gzana ad t\u0259n\u0259ya\u0263 tarna \u0259n M\u0259\u0161\u0161ina?\\\"
  41 T\u0259zzar t\u0259tawakkas-du t\u0259hunt. Iswad \u0194aysa da\u0263 j\u0259nnawan
  inna: \\\"Abba, \u0259ggodaya\u0263-ak as di-t\u0259qbala t\u0259watray-nin. 42
  Nak iman-in \u0259ssana\u0263 as faw da t\u0259qqabbala \u0161iwatriwen-in. Mi\u0161an
  \u0259\u0161\u0161ewala\u0263 f\u0259l \u0259dd\u0259lil \u0259n tiddawat ta di-t\u0259\u0263alay\u0263alayat
  da, f\u0259l ad \u0259zz\u0259gz\u0259nan as kay a di-d-izammazalan.\\\" 43 D\u0259ff\u0259r
  as iga batu ta, idkal \u0259m\u0259sli-net inna: \\\"Lazar\u0259s, \u0259gm\u0259d-du!\\\"
  44 Igmad-du \u0259n\u0259mmett\u0259n wa nad, \u0259ttalan fassan-net \u0259d daran-net
  da\u0263 t\u0259s\u0259wad, t\u0259lsa t\u0259bdoq ud\u0259m-net \u0259ntada. Inn-asan
  \u0194aysa: \\\"\u018fkk\u0259sat-as itul tayyim-tu ad ij\u0259w\u0259nk\u0259t.\\\"\\n\u0160im\u0259rkas
  \u0161in tana\u0263ay \u0259n \u0194aysa\\n45 K\u0259l \u018fly\u0259hud aggotnen
  a d-osanen Maryama \u0259nayan arat wa, \u0259zz\u0259gzanan \u0259s \u0194aysa.
  46 Mi\u0161an \u0259glan wiyyad da\u0263-san \u0259kkan Farisaytan \u0259malan-asan
  arat wa iga \u0194aysa da. 47 T\u0259zzar sassagan limaman win zawwarnen, \u0259d
  Farisaytan \u0259m\u0259ni \u0259n muzaran \u0259nnan: \\\"Ma za nagu? Al\u0259s
  wa itaggu al\u0263alamaten aggotnen.\\\" 48 As tu-noyya itaggu aratan win, a s\u0259r-\u0259s
  \u0259zz\u0259gz\u0259nan aytedan kul, t\u0259zzar asin-du K\u0259l-\u018frrum addagdagan
  Ehan \u0259n M\u0259\u0161\u0161ina, \u0259z\u0259dan a\u0263r\u0259f-nana. 49 Inkar-du
  iyyan da\u0263-san igan es\u0259m Kayif, imosan \u0259limam wa z\u0259wwaran da\u0263
  awatay wen, inn-asan: \\\"Kawanay w\u0259r t\u0259grem wala. 50 W\u0259r din t\u0259grem
  as ofa ad ammat awedan iyyanda da\u0263 adag \u0259n tamattay f\u0259l ad w\u0259r
  immut \u0259\u0263r\u0259f ketnet?\\\" 51 Batu ta iga da w\u0259r tat-iga gar-es
  \u0259d man-net, kalar ti\u0161it-net \u0259limam wa z\u0259wwaran da\u0263 awatay
  wen, a f\u0259l igraw \u0259lw\u0259layat n as \u0194aysa kundaba immut f\u0259l
  \u0259dd\u0259lil n \u0259\u0263r\u0259f ketnet. 52 Amaran w\u0259rge a\u0263r\u0259f
  wen \u0263as a f\u0259l tu-z-iba, kalar bararan \u0259n M\u0259\u0161\u0161ina kul
  win wazawaznen a du-z-i\u0161\u0161id\u0259w ag-en zun t\u0259\u0263\u0259ssa iyyadda.
  53 \u018fz\u0259l wen da da\u0263 \u0259gan muzaran \u0259n K\u0259l-\u018fly\u0259hud
  tanat ta n tana\u0263ay-net. 54 Awen da f\u0259las ab-as itallam \u0194aysa dad
  ira da\u0263 K\u0259l-\u018fly\u0259hud. Igmad akal wen, ikka iyyan akal iyyan inimahazan
  \u0259d taneray, da\u0263 \u0259\u0263r\u0259m igan es\u0259m Efray\u0259m, iqqim
  da\u0263-as den da \u0259nta \u0259d nalkiman-net. 55 Azzaman en amud \u0259n K\u0259l-\u018fly\u0259hud
  wa n Akkay ihoz-du. A du-tagazzayan aytedan aggotnen n akal wen kul, takkin-du Yerusalam,
  f\u0259l ad \u0259zz\u0259zd\u0259gan dat \u0259mud. 56 Saggadan i \u0194aysa tin\u0259m\u0259nnin
  gar-essan da\u0263 Ahan \u0259n M\u0259\u0161\u0161ina: \\\"Kawanay ak ma t\u0259nnam,
  tordam as w\u0259r du-z-asu amud wa fadda?\\\" 57 \u018fnta ilimaman win zawwarnen
  \u0259d Farisaytan omaran aytedan as i issanan edag wa iha \u0194aysa isaffagg-ay
  f\u0259l ad attarmas.\\nYaxya 12\\n\u018ft\u0259w\u0259zway \u0259n \u0194aysa da\u0263
  Betan\u0259y\\n2 As din-osa \u0194aysa tawaggan-as m\u0259gura ola\u0263nen; t\u0259taway-du
  Marta imensewan amaran Lazar\u0259s iha aytedan win na\u0263amanen \u0259d \u0194aysa
  \u0259drawan d\u0259r-\u0259s. 3 T\u0259zzar tobaz-du Maryama aganna \u0259n lit\u0259r
  n alwardi iyyan ilan almaqam, izz\u0259wat w\u0259llen, t\u0259n\u0263al-tu f\u0259l
  daran \u0259n \u0194aysa t\u0259zway-asan-tu, t\u0259zzar t\u0259mas-tan \u0259s
  j\u0259kkad-net, idnay ahan wa adu n alwardi. 4 Inkar Yahuza Isxar\u0259yuti wa
  n iyyan da\u0263 nalkiman \u0259n \u0194aysa was \u0259nta tu-z-agin da\u0263 fassan
  inna: 5 \\\"Mafel w\u0259r din n\u0259zz\u0259nza alwardi wa nab\u0259z-du da\u0263-as
  azr\u0259f \u0259n karadat t\u0259mad n \u0259z\u0259l n \u0259\u0161\u0161\u0259\u0263\u0259l
  nakf-ay i t\u0259l\u0259qqawen?\\\" 6 Arat wa w\u0259r t-inna f\u0259l t\u0259hanint
  \u0259n t\u0259l\u0259qqawen, kalar abaydag a imos, amaran \u0259nta a ittafan \u0259s\u0259gr\u0259s
  wa itaggaz \u0259zr\u0259f, idakkal awa t-ihan. 7 Eges ya inna \u0194aysa: \\\"Ayy-et!
  Alwardi wa kala da togaz-tu y \u0259z\u0259l wa n \u0259t\u0259w\u0259nbal-in. 8
  \u0160il\u0259qqawen faw da t\u0259ddewam d\u0259r-\u0259snat, nak amaran w\u0259rge\u0263
  faw \u0259lle \u0263ur-wan.\\\"\\nAssa \u0259n \u0194aysa a\u0263r\u0259m \u0259n
  Yerusalam\\n9 T\u0259sla tiddawat tagget \u0259n K\u0259l-\u018fly\u0259hud as illa
  \u0194aysa den t\u0259zzar osan-in ehan wen, mi\u0161an w\u0259rge \u0194aysa \u0263as
  din-\u0259kkan, kalar awnaf a tan-ihan \u0259n Lazar\u0259s wa d-iss\u0259nkar da\u0263
  n\u0259m\u0259ttan. 10 T\u0259zzar \u0259ss\u0259rda\u0263an-du limaman win zawwarnen
  tanat n ad an\u0263in Lazar\u0259s \u0259nta da, 11 f\u0259las \u0259dd\u0259lil-net
  a f\u0259l d\u0259ff\u0259r-san \u0259falan K\u0259l-\u018fly\u0259hud aggotnen
  \u0259zz\u0259gzanan \u0259s \u0194aysa. 12 As affaw \u0259slan aytedan aggotnen
  a d-\u0259kkanen amud, as \u0194aysa iggaz-du a\u0263r\u0259m wa n Yerusalam. 13
  \u018fdkalan-du iz\u0259lan \u0259n t\u0259lazdaq t\u0259zzar \u0259glan \u0259lkadan-as
  sa\u0263aren gannin: \\\"Hosanna! T\u0259gr\u0259wa\u0263et albaraka, kay a d-osan
  s es\u0259m n \u018fm\u0259li,\\nkay \u0259m\u0259nokal n Israyil!\\\"\\n14 Igraw
  \u0194aysa \u0259hulel, iwan-tu, s asaway was iha awen Akatab wa innan: 15 \\\"Ad
  w\u0259r t\u0259\u0161\u0161\u0259w\u0259\u0161a ya w\u0259l\u0259t Syon*, \u0259m\u0259nokal-nam
  \u0259ddi a din-izayan \u0259ddi, iwan \u0259hulel.\\\" 16 Inalkiman-net w\u0259r
  \u0259gren arat wa da\u0263 tizarat, mi\u0161an assa\u0263a wad igraw \u0194aysa
  adkul-net, \u0259ktan-du as Akatab imal aratan win, amaran arat wa imal kul itiwag-as.\\\"
  17 Tamattay ta t\u0259mm\u0259gnet assa\u0263a wa da\u0263 d-i\u0263ra \u0194aysa
  Lazar\u0259s da\u0263 t\u0259saskawt iss\u0259nkar-t-idu da\u0263 t\u0259mattant,
  t\u0259gg\u0259yyat-as. 18 Awen da f\u0259l das-du-t\u0259ss\u0259lkad tiddawat,
  f\u0259las \u0259slan as iga al\u0263alamat ta. 19 T\u0259zzar ad tin\u0259m\u0259nnin
  Farisaytan gar-essan: \\\"Toggam-tu? Indar-awan a d\u0259r t-in t\u0259kkam, har
  as aytedan kul \u0259lkaman-as.\\\"\\nEmel wa iga \u0194aysa t\u0259mattant-net\\n20
  \u018fllan-tu arat da\u0263 K\u0259l T\u0259g\u0259rekt \u0259hanen aytedan win
  d-\u0259gg\u0259zzaynen \u0259s Yerusalam y ad \u0259\u0263b\u0259dan da\u0263 azzaman
  n \u0259mud. 21 \u018fkkan iyyan da\u0263 nalkiman \u0259n \u0194aysa igan Filibbus
  wa n t\u0259\u0263r\u0259mt \u0259n Betsayda ta n akal \u0259n Galilaya, \u0259nnan-as:
  \\\"N\u0259gmay da\u0263-ak ad n\u0259n\u0259y \u0194aysa.\\\" 22 Igla Filibbus
  imal y Andraw\u0259s, d\u0259ff\u0259r adi iddew Andraw\u0259s \u0259d Filibbus
  \u0259malan arat wa i \u0194aysa. 23 Inn-asan \u0194aysa: \\\"Alwaq ewad-du \u0259m\u0259r\u0259dda
  wa da\u0263 z-igr\u0259w Ag Awedan adkul-net. 24 \u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan
  as tablalt n alkama as w\u0259r t\u0259rtek da\u0263 amadal t\u0259mmut, ad taglu
  t\u0259mos \u0263as-net, mi\u0161an as t\u0259mmut, ad tag''ara aggen. 25 I iran
  iman-net ad t-\u0259gm\u0259dan. Amaran awedan wa iksanan iman-net da\u0263 \u0259dd\u0259net
  ta, w\u0259di w\u0259r tu-z-\u0259gm\u0259dan kundaba \u0259qqalan-as t\u0259m\u0259ddurt
  t\u0259\u0263lalat. 26 Awedan kul wa iran a di-i\u0161\u0263\u0259l, ilk\u0259met-i,
  as iga adi edag wa \u0259he\u0263 \u0259nta a z-igg\u0259z, akf-ay de\u0263 Abba-nin
  almaqam. 27 \\\"\u018fm\u0259r\u0259dda \u0259\u0263\u0161adan man-in. Ma z-anna?
  Ak ad anna: ''Abba safs-i da\u0263 assa\u0263at ta? Mi\u0161an w\u0259r d-eweda\u0263
  alwaq wa ar f\u0259l a fall-i agu. 28 Abba, s\u0259nn\u0259fil\u0259l t\u0259la-nak
  adkul.\\\" T\u0259zzar igmad-du \u0259m\u0259sli ij\u0259nnawan inna: \\\"T\u0259la-nin
  adkul \u0259sinafalalaq-qat, amaran a tat-\u0259l\u0259sa\u0263 \u0259s\u0259nn\u0259fil\u0259l.\\\"
  29 Tamattay ta t\u0259llat den, t\u0259sla y \u0259m\u0259sli wa, a t\u0259\u0263il
  eggag. Ad \u0259gannin wiyyad: \\\"Angalos das-i\u0161\u0161ewalan da n \u0259m\u0259r\u0259dda.\\\"
  30 Inn-asan \u0194aysa: \\\"\u018fm\u0259sli wa w\u0259rge\u0263 \u0259dd\u0259lil-in
  a f\u0259l d-iga, kalar \u0259dd\u0259lil-nawan kawanay. 31 \u018fm\u0259r\u0259dda
  ad za t\u0259t\u0259w\u0259xk\u0259m \u0259dd\u0259net-ta. \u018fm\u0259r\u0259dda
  din z-it\u0259w\u0259g\u0259r \u0259muzar n \u0259dd\u0259net ta. 32 Amaran nak
  as tawasahake f\u0259l amadal \u0259wara t\u0259g\u0259ttawt, a d-\u0259lw\u0259ya\u0263
  aytedan kul \u0259s man-in.\\\" 33 Batu ta isidagan s\u0259r-\u0259s esaway was
  tu-z-iba. 34 T\u0259nn-as tamattay: \\\"N\u0259nay da\u0263 \u018fttawrit as \u018flm\u0259six
  ad agu t\u0259m\u0259ddurt t\u0259\u0263lalat. Man\u0259mm\u0259k amaran as dana-za-tanna\u0263
  Ag Awedan ad it\u0259w\u0259s\u0259huk\u0259t f\u0259l amadal? Ma imos Ag Awedan
  was t\u0259ganna\u0263 \u0259ddi?\\\" 35 T\u0259zzar inn-asan \u0194aysa: \\\"\u018fnnur
  harwa da illa \u0263ur-wan, har agin arat n azzaman, j\u0259w\u0259nk\u0259tat iket
  di ad t-illa \u0259nnur f\u0259l a kawan w\u0259r \u0259\u0263d\u0259rnat \u0161iyyay,
  f\u0259las wa ijawanken da\u0263 \u0161iyyay, adi w\u0259r issen sas idag. 36 Iket
  t\u0259lam \u0259nnur, z\u0259gz\u0259nat s\u0259r-\u0259s f\u0259l ad t\u0259qq\u0259lam
  bararan n \u0259nnur.\\\" As i\u0263rad \u0194aysa igi \u0259n batu ta, igla il\u0263as-asan
  da\u0263 adag a iggugan.\\nT\u0259z\u0259r\u0259st n \u0259\u0161\u0161\u0259\u0263\u0259l
  wa iga \u0194aysa dat awedan kul\\n37 Al\u0263alamaten aggotnen \u0161in iga \u0194aysa
  dat-san, w\u0259r s\u0259r-san d ewaynat as s\u0259r-\u0259s \u0259zz\u0259gz\u0259nan,
  38 f\u0259l ad t\u0259kmal batu ta iga \u0259nn\u0259bi Isayas as inna: \\\"\u018fm\u0259li,
  ma imos wa izz\u0259gzanan s arat wa n\u0259mal? Ma imos was t\u0259nafalal tarna
  n \u018fm\u0259li?\\\"\\n39 \u018fdd\u0259lil wa f\u0259l w\u0259r \u0259fregan
  ad \u0259zz\u0259gzanan \u0259ntada imal-tu \u0259nn\u0259bi Isayas as inna: 40
  M\u0259\u0161\u0161ina a tan-isaddar\u0263alan, iss\u0259\u0263ar iwallan-nasan,\\nf\u0259l
  ad ib-as hannaynat \u0161ittawen-nasan, ib-as garrin wallan-nasan,\\nf\u0259l a
  s\u0259r-\u0259s w\u0259r m\u0259l\u0259ll\u0259yan izzuz\u0259y-tan.\\\"\\n41 Isayas
  inna aratan win f\u0259las inay adkul \u0259n \u0194aysa, amaran immigrad fall-as.
  42 As ig''awen da imuzaran iman-nasan da a da\u0263-san aggen \u0259zzigzanan s\u0259r-\u0259s,
  mi\u0161an f\u0259l t\u0259ks\u0259da \u0259n Farisaytan, w\u0259r \u0259helan emel
  n awen, f\u0259las w\u0259r \u0259ren ad t\u0259w\u0259kk\u0259san da\u0263 t\u0259m\u0259zg\u0259dda-nasan,
  43 amaran \u0259ssofan sa\u0263mar wa n aytedan y \u0259dkul wa ihakku M\u0259\u0161\u0161ina.
  44 Idkal \u0194aysa \u0259m\u0259sli-net inna: \\\"Awedan wa s\u0259r-i izz\u0259gzanan,
  w\u0259rge nak \u0263as as izz\u0259gzan, kalar wa di-d-izammazalan da izzigzan
  s\u0259r-\u0259s. 45 Amaran wa da\u0263-i iswadan, adi wa di-d-izammazalan a da\u0263
  iswad. 46 Nak zun \u0259nnur a mosa, \u0259kke-du \u0259dd\u0259net yas i s\u0259r-i
  izz\u0259gzanan w\u0259r z'' aqqam da\u0263 \u0161iyyay. 47 As isla awedan i batuten-in
  iqqim w\u0259r tanat-ittef, w\u0259rge nak a tu-z-awwaddaban, f\u0259las nak efsan
  n aytedan a d-\u0259kke s \u0259dd\u0259net, w\u0259rge\u0263 attadib-nasan. 48
  Da\u0263 adi awedan kul wa di-olkan, iqqim w\u0259r iga tembay da\u0263 batuten-in,
  w\u0259di illa-tu wa tu-z-awwaddaban. Awal wa da \u0259ge da iman-net a das-z-i\u0161r\u0259\u0263an
  \u0259z\u0259l a ilkaman. 49 F\u0259las batuten-in w\u0259rge g\u0259r-i \u0259d
  man-in as tanat-\u0259ge, kalar Abba wa di-d-iss\u0259glan iman-net as di-omar s
  arat was ihor ad t-anna, \u0259d was ihor a fall-as ammagrada. 50 \u018fssana\u0263
  as arat was omar \u0259nta a itawayan \u0259s t\u0259m\u0259ddurt ta t\u0259\u0263lalat.
  Da\u0263 adi, arat wa f\u0259l \u0259mm\u0259grada, \u0259mm\u0259k wa da\u0263
  as di-t-imal Abba \u0259nta as s\u0259r-\u0259s \u0259mm\u0259grada.\\\"\\nYaxya
  13\\nIba \u0259n \u0194aysa \u0259d tanakra-net da\u0263 t\u0259mattant\\n\u018f\u0161ir\u0259d
  wa iga \u0194aysa idaran \u0259n nalkiman-net\\n2 Itamansaw \u0194aysa \u0259d nalkiman-net
  ehad. As itag''awen da Iblis ig\u00e2 da\u0263 \u0259w\u0259l \u0259n Yahuza wa
  n ag Sim\u0263on Isxar\u0259yuti t\u0259kaddilt \u0259n \u0194aysa. 3 \u0194aysa
  iss\u00e2n as M\u0259\u0161\u0161ina di n Abba ig\u00e2 arat kul da\u0263 \u0259fus-net,
  iss\u00e2n tolas as igm\u00e2d-du M\u0259\u0161\u0161ina harwa ad t-iqq\u0259l.
  4 Ibdad f\u0259l mensewan, t\u0259zzar ikkas takatkat-net ta n afalla, idkal af\u0259r
  igbas-tu, 5 t\u0259zzar iga aman da\u0263 a\u0263lal, ad i\u0161arad idaran \u0259n
  nalkiman-net, immas-tan s \u0259f\u0259r wa igbas da. 6 As d-ewad \u0194aysa Sim\u0263on
  Butros inn-as: \\\"\u018fm\u0259li, kay, a z-i\u0161\u0161ir\u0259dan idaran-nin?\\\"
  7 Inn-as \u0194aysa: \\\"Awa tagga da w\u0259r t\u0259frega \u0259g\u0259rri-net
  \u0259m\u0259r\u0259dda mi\u0161an a tu-tagra d\u0259ff\u0259r awa.\\\" 8 Inn-as
  Butros: \\\"Kay, ad t\u0259\u0161\u0161ir\u0259da idaran-in? Wala \u0259n\u0259mihaz!\\\"
  Inn-as \u0194aysa: \\\"As dak-tan- w\u0259r -\u0259\u0161\u0161orada nak d\u0259r-\u0259k
  n\u0259mmizzay.\\\" 9 Inn-as Sim\u0263on Butros: \\\"Da\u0263 adi \u018fm\u0259li,
  w\u0259rge idaran-nin \u0263as, \u0161ired harkid fassan d a\u0263af.\\\" 10 Inn-as
  \u0194aysa: \\\"Awedan i\u0161\u0161oradan, w\u0259r iddarar ar \u0259\u0161ir\u0259d
  \u0259n daran y ad izdag ketnet, amaran kawanay, t\u0259z\u0259ddigam, mi\u0161an
  w\u0259rge ketnawan.\\\" 11 \u0194aysa iss\u00e2n wa tu-z-akkaddalan; adi a f\u0259l
  inna: \\\"W\u0259r t\u0259z\u0259ddigam ketnawan.\\\"\\n12 As i\u0263rad \u0194aysa
  \u0259\u0161ir\u0259d \u0259n daran-nasan, izlag takatkat-net, iqqal edag-net, t\u0259zzar
  inn-asan: \\\"Awak t\u0259gr\u00e2m awa dawan-\u0259ge da? 13 T\u0259gannim-i ''Am\u0259s\u0259sse\u0263ri''
  d ''\u018fm\u0259li'', t\u0259gannim a olaghan, f\u0259las \u0259mosaq-q. 14 Da\u0263
  adi kud nak, imosan \u018fm\u0259li d \u018fm\u0259s\u0259sse\u0263ri, \u0259\u0161\u0161orada
  idaran-nawan, iwar-kawan, kawanay da, da\u0263 ilkam wa, ad t\u0259tima\u0161iridam
  idaran. 15 \u018fs\u0259knaq-qawan arat wen f\u0259l a tu-t\u0259taggim kawanay
  da s \u0259mm\u0259k was dawan-t-\u0259ge. 16 \u018fgg\u0259yye\u0263 silakana\u0263-awan
  as, akli w\u0259r oger m\u0259\u0161\u0161is, wala da ogar anammazal wa t-id-izammazalan.
  17 Amaran dad t\u0259ssanam aratan win, iket t\u0259falawist a tat-tagim kudis t\u0259tamazalam-tan.
  18 W\u0259r dawan-g\u0259nna ketnawan; win sannafrana kul \u0259zd\u00e2yaq-qan
  mi\u0161an kundaba inda awa \u0259malan \u0259lk\u0259ttaban as \u0259nnan: ''Wa
  d\u0259r \u0259drawa, iqqal amaksan-in''. 19 \u018fnne\u0263 adi \u0259m\u0259r\u0259dda
  harwa w\u0259r iga, y ad t\u0259zz\u0259gz\u0259nam, as iga, as nak \u0259mosa wa
  illan da. 20 \u018fgg\u0259yye\u0263 silakana\u0263-awan as wa iqbalan \u0259yyan
  da\u0263 n\u0259mmuzal-in, nak iman-in a iqbal. Harwa wa di-iqbalan, wa di-d-izammazalan
  a iqbal\\\"\\nEmel wa iga \u0194aysa i t\u0259kaddilt ta tu-z-agu Yahuza\\n21 As
  inna \u0194aysa awen, \u0259\u0263\u0161adan man-net, t\u0259zzar inna: \\\"\u018fgg\u0259yye\u0263
  silakana\u0263-awan as iyyan da\u0263-wan a di-akkaddal.\\\" 22 Ad tin\u0259m\u0259swidan
  nalkiman-net, \u0259qq\u00e2nan \u0263afawan-nasan i was igannu. 23 Iyyan da\u0263
  nalkiman-net, wa isannahal \u0194aysa tara, isi\u0263amar da\u0263 ih\u0259z n \u0259dmaran
  \u0259n \u0194aysa. 24 Isaddagan-as Sim\u0263on Butros ad iss\u0259st\u0259n \u0194aysa
  \u0259d was igannu. 25 T\u0259zzar inaz-in analkim wen f\u0259l \u0259dmaran \u0259n
  \u0194aysa, inn-as: \\\"\u018fm\u0259li, ma z-iqq\u0259l?\\\" 26 Ij\u0259wwab-as
  \u0194aysa: \\\"Wa \u0259kfe akarammu \u0259n tag\u0259lla wa z-\u0259ss\u0259lm\u0259\u0263a
  da\u0263 \u0259dr\u0259z a.\\\" T\u0259zzar iss\u0259lma\u0263 akarammu \u0259n
  t\u0259g\u0259lla ikfay i Yahuza ag Sim\u0263on Isxar\u0259yuti. 27 D\u0259ff\u0259r
  as igr\u00e2w Yahuza akarammu \u0259n t\u0259g\u0259lla wen, iggaz-tu Iblis. T\u0259zzar
  inn-as \u0194aysa: \\\"Taga\u0263et tarmad awa kay iwaran.\\\" 28 Mi\u0161an w\u0259l\u0259yyan
  da\u0263 win d\u0259r-\u0259s \u0259drawnen w\u0259r igra awa f\u0259l das-inn''awen.
  29 W\u0259yyad ord\u00e2n as, iduf wa iga Yahuza azr\u0259f \u0259n nalkiman a f\u0259l
  das-inna \u0194aysa: \\\"zanzad-du arat was za naddarar y \u0259mud; made\u0263
  akfu \u0161il\u0259qqawen arat iyyan.\\\" 30 Ibaz Yahuza akarammu \u0259n tag\u0259lla,
  igmad tarmad, as itag''awen da ehad ig\u00e2.\\nAlwajib wa aynayan\\n31 As igmad
  Yahuza, inna \u0194aysa: \\\"\u018fm\u0259r\u0259dda tarna \u0259n Barar n Awedan
  t\u0259n\u00eefalal, tolas tarna \u0259n M\u0259\u0161\u0161ina t\u0259nifalal da\u0263-as.
  32 Kud tarna \u0259n M\u0259\u0161\u0161ina t\u0259nifalal da\u0263-as, M\u0259\u0161\u0161ina
  \u0259nta da ad is\u0259nn\u0259fil\u0259l da\u0263 man-net tarna \u0259n Barar
  n Awedan da\u0263 alwaq ihozan w\u0259llen. 33 Imaran-in, alwaq w\u0259r n\u0259gg\u0259t
  a \u0263ur-wan z-aga. A di-t\u0259gmiyam mi\u0161an edag wa \u0259kke\u0263 w\u0259r
  t\u0259fregam a t-in-taw\u0259dam. Kala \u0259nne\u0263 adi i K\u0259l \u018fly\u0259hud
  amaran, kawanay da \u0259nne\u0263-awan-tu \u0259m\u0259r\u0259dda. 34 A dawan-aga
  alwajib aynayan: namariwat. Namariwat kawanay da s \u0259mm\u0259k was kawan-are.
  35 Kud tan\u00eemaram, adi a z-issus\u0259nan aytedan kul as kawanay inalkiman-in.\\\"\\n\u0194aysa
  \u0259d Butros\\n36 Inn-as Sim\u0263on Butros: \\\"\u018fm\u0259li, m\u0259nid t\u0259kke.\\\"
  Inn-as \u0194aysa: \\\"Edag wa \u0259kke, w\u0259r t\u0259frega a di s\u0259r-\u0259s
  t\u0259lk\u0259ma \u0259m\u0259r\u0259dda, eges a din-t\u0259lk\u0259ma d\u0259ff\u0259r
  awa.\\\" 37 Inn-as Sim\u0263on Butros: \\\"\u018fm\u0259li, mafel as w\u0259r \u0259frega
  a dak s\u0259r-\u0259s \u0259lk\u0259ma \u0259m\u0259r\u0259dda. \u018fgara\u0263
  iri y a fall-ak akfa iman-nin.\\\" 38 Inn-as \u0194aysa: \\\"Adis a fall-i takfa\u0263
  iman-nak? \u018fgg\u0259yye\u0263 silakana\u0263-ak as w\u0259r z-a\u0263ru \u0259k\u0259ji
  a\u0263ora w\u0259r di-t\u0259nkura har karadat t\u0227klaten.\\\"\\nYaxya 14\\n\u0194aysa
  \u0259nta a imosan tarrayt\\n2 Ehan n Abba-nin ah\u00e2n-tu daggan aggotnen \u0259n
  t\u0259m\u0259xsurt. Awak \u0259nnar w\u0259r iga adi man\u0259mm\u0259k as dawan-z-anna
  ad agla s\u0259mmut\u0259ga\u0263-awan edag t\u0259zda\u0263am? 3 As tu-sammataga,
  ad \u0259qqala, idawa\u0263-in d\u0259r-wan f\u0259l ad t\u0259gg\u0259zam edag
  wa \u0259he. 4 Edag wa \u0259kke t\u0259ss\u00e2nam tarrayt-net.\\\" 5 Inn-as Tuma:
  \\\"\u018fm\u0259li w\u0259r n\u0259ssen dad t\u0259kke, man\u0259mm\u0259k as za
  n\u0259ss\u0259n tarrayt-net?\\\" 6 Inn-as \u0194aysa: \\\"Nak a imosan tarrayt
  f\u0259las \u0259mosa tid\u0259t \u0259mosa \u0259ntada wa ihakkan t\u0259m\u0259ddurt.
  Awedan w\u0259l\u0259yyan w\u0259r in-z-aw\u0259d Abba, ar s a di-d-imm\u00e2r.
  7 \u018fnnar di-t\u0259zdayam, t\u0259zd\u0259yam Abba-nin \u0259nta da. Amaran
  \u0259m\u0259r\u0259dda t\u0259zdayam-tu, tolas t\u0259nayam-tu.\\\" 8 Inn-as Filif:
  \\\"\u018fm\u0259li, sus\u0259n-ana\u0263 Abba, adi igd-ana.\\\" 9 Inn-as \u0194aysa:
  \\\"Filibbus, \u0259ruwa\u0263 as d\u0259r-wan \u0259ddewa, eges harwada w\u0259r
  di-t\u0259zdaya? W\u0259r t\u0259ssena\u0263 as wa di-inayan, \u0161ilat n as in\u00e2y
  Abba! Da\u0263 adi man\u0259mm\u0259k as t\u0259ganna: ''Sus\u0259n-ana\u0263 Abba?''
  10 W\u0259r t\u0259zz\u0259gzana\u0263 as, nak d Abba n\u0259mos arat iyyanda? Batuten
  \u0161in dawan-\u0259mmala da, w\u0259rge nak ad d-\u0259gmadnat, kalar Abba d\u0259r
  \u0259mosa\u0263 arat iyyanda s\u0259r-i isandan imazalan-net. 11 Z\u0259gzanat-i,
  nak d Abba arat iyyanda a n\u0259mos; kud w\u0259r t\u0259zz\u0259gzanam s awa \u0259nne,
  z\u0259gz\u0259nat f\u0259l \u0259dd\u0259lil \u0259n mazalan win as di-t\u0259nayam
  taggaq-qan. 12 \u018fgg\u0259yye\u0263 \u0259silakana\u0263-awan as wa s\u0259r-i
  izz\u0259gzanan, \u0259ntada ad agu imazalan \u0161ilat \u0259n win tagga. Fadda
  ad agu win tan-ogarnen, f\u0259las nak ad akka\u0263 Abba. 13 Amaran a iqqal arat
  wa t\u0259gmayam s es\u0259m-in a tt-aga, f\u0259l ad t\u0259t\u0259w\u0259n\u0259y
  tarna n Abba da\u0263 Barar. 14 As da\u0263-i t\u0259gmayam arat a iqqal s es\u0259m-in,
  a tt-aga.\\n15 \\\"Kud tara a di-t\u0259gam, t\u0259tt\u0259fam alwajiban-in. 16
  Amaran ad \u0259gm\u0259ya da\u0263 Abba a kawan-akfu iyyan \u0259m\u0259ggi \u0259n
  t\u0259lxutbat a \u0263ur-wan z'' im\u0259lan har faw. 17 \u018fnta a imosan Infas
  wa isin\u0259fililan tid\u0259t, was w\u0259r t\u0259freg \u0259dd\u0259net \u0259lq\u0259bulat-net,
  f\u0259las w\u0259r tu-t\u0259h\u0259nn\u0259y wala da t\u0259zday-tu; eges kawanay
  t\u0259zd\u00e2yam-tu f\u0259las ihhirag d\u0259r-wan amaran ad igg\u0259z iwallan-nawan.
  18 W\u0259r kawan-z-ayya da\u0263 \u0259ddenet t\u0259mosam \u0161ilat \u0259n gugelan,
  a kawan-d-\u0259qq\u0259la. 19 D\u0259ff\u0259r alwaq w\u0259r n\u0259gg\u0259t,
  \u0259dd\u0259net w\u0259r di-za-t\u0259l\u0259s anay; eges kawanay a di-t\u0259l\u0259sam
  anay f\u0259las \u0259dd\u00e2ra, amaran kawanay da ad t\u0259dd\u0259ram. 20 Alwaq
  w\u0259di ad t\u0259ss\u0259nam as nak d Abba-nin arat iyyanda a n\u0259mos, t\u0259ss\u0259nam
  \u0259ntada as t\u0259ham \u0259w\u0259l-in nak da ahe\u0263 win-nawan. 21 Wa ittafan
  alwajiban-in, \u0259nta a di-iran. Wa di-iran at-t-iru Abba-nin, araq-qu nak da,
  t\u0259zzar \u0259ssus\u0259naq-qu iman-in.\\\" 22 Inn-as Yahuza wa w\u0259r n\u0259mos
  ag Isxar\u0259yuti: \\\"\u018fm\u0259li, man\u0259mm\u0259k as dana-za-t\u0259ssus\u0259na\u0263
  iman-nak nakkanay \u0263as, w\u0259r tan-t\u0259ssosana y \u0259dd\u0259net?\\\"
  23 Inn-as \u0194aysa: \\\"Awedan wa di-iran, ad itt\u0259f awa \u0259nne, ir-ay
  Abba-nin, nas-ay-du n\u0259m\u0259l \u0263ur-\u0259s. 24 Wa di-w\u0259r-n\u0259ra,
  w\u0259di w\u0259r \u0259ttef batuten-in; amaran batu tas t\u0259sallim da, w\u0259rge
  nak a tat-igan kala ar \u0161in Abba s \u0259nta a di-d-izammazalan. 25 \\\"\u018fge\u0263-awan-tat
  harwa kawan-\u0259he. 26 Amaran Am\u0259ggi \u0259n t\u0259lxutbat imosan Infas
  wa Z\u0259ddigan wa dawan-du-z-assaglu Abba s \u0259s\u0259m-in, a kawan-isassa\u0263ru
  aratan kul, assakt-iwan-du arat kul wa dawan-\u0259nne nak iman-in. 27 Oyye\u0263-awan-d
  alxer, \u0259kfeq-qawan alxer wa-nin; nak, w\u0259r dawan-t-\u0259kfe\u0263 \u0259s
  t\u0259m\u0259wit tas t-illa da\u0263 \u0259dd\u0259net; ad w\u0259r t\u0259\u0161\u0161\u0259w\u0259\u0161am
  wala t\u0259gg\u0259z-kawan tasa. 28 T\u0259sl\u00e2m as dawan-\u0259\u1e47\u1e47e:
  ''Teklay a \u0259ge\u0263'', \u0259nne\u0263 harwa ''a kawan-d-\u0259qq\u0259la''.
  \u018fnnar ixs\u00e2l as di-t\u0259r\u00e2m, t\u0259s\u0259dd\u0259w\u0259t-kawan
  t\u0259nna ta \u0259ge\u0263: ''\u018fqqala\u0263 Abba'', f\u0259las Abba ogar-i.
  29 Amaran aratan win \u0259mala\u0263-awan-tan \u0259m\u0259r\u0259dda harwa w\u0259r
  \u0259gen, f\u0259l a s\u0259r-i t\u0259zz\u0259gz\u0259nam alwaq wa ad z-agin.
  30 W\u0259r d\u0259r-wan z-\u0259l\u0259sa igi \u0259n batu tagget, f\u0259las anaxkim
  n \u0259dd\u0259net izay-du. W\u0259r di-in-ikka d arat, 31 mi\u0161an kundaba \u0259ge\u0263
  awa as di-omar Abba, t\u0259ss\u0259n \u0259dd\u0259net \u0259ntada as are\u0263
  Abba.\\\" As i\u0263rad batu inn-asan: \\\"\u018fnk\u0259rat \u0259gm\u0259datana
  edag a.\\\"\\nYaxya 15\\n\u0194aysa \u0259nta a imosa esab n \u0259zz\u0259bib wa
  n tid\u0259t\\n2 Al\u0259dlid-in kul wa w\u0259r n\u0259tir\u0259w ad t-ixt\u0259s,
  wa itarawan ad t-ifn\u0259z f\u0259l ad d-inz\u0259r agu ara aggen. 3 Zund adi da,
  kawanay da eway-du s\u0259r-wan awal-in tazdak; 4 agiwat d\u0259r-i tart\u0259yt
  \u0161ilat \u0259n ta d\u0259r-wan \u0259ge, zund as az\u0259l w\u0259r z ar\u0259w
  \u0263as-net as d-iqq\u0259tas da\u0263 a\u0161\u0259k; kawanay da \u0259lmital
  di da a t\u0259ham as d\u0259r-i w\u0259r t\u0259rtayam.\\n5 \\\"Nak a imosan esab
  n \u0259zz\u0259bib, kawanay il\u0259dlad-net. Wa d\u0259r-i igan tart\u0259yt ta
  d\u0259r-\u0259s \u0259ge, a t-idu-t\u0259gm\u0259d t\u0259nfa tagget f\u0259las
  as da\u0263-i in-t\u0259qq\u0259tasam w\u0259r t\u0259fregam wala. 6 Wa d\u0259r-i
  w\u0259r n\u0259rtay, a din-it\u0259w\u0259g\u0259r \u0161ilat n \u0259l\u0259dlid
  iqqitasan, aqqar, it\u0259w\u0259k\u0259mm\u0259d-du, it\u0259w\u0259g\u0259r da\u0263
  t\u0259mse, ib\u0259l\u0259gl\u0259g. 7 As d\u0259r-i t\u0259rtayam, t\u0259ttafam
  batuten-in, \u0259gmiyat da\u0263 M\u0259\u0161\u0161ina di n Abba arat kul wa t\u0259ram,
  a tu-t\u0259grawam. 8 \u018fnta da awa as t\u0259tawanay tarna n Abba-nin: a du
  tar\u0259wam t\u0259nfa tagget, assaknu adi as t\u0259mosam inalkiman-in. 9 Tara
  ta di-iga Abba, \u0259nta a dawan \u0259ge; a tat-w\u0259r-t\u0259gm\u0259dam. 10
  Kud t\u0259ttafam alwajiban-in, w\u0259di t\u0259ham tara-nin zund \u0259mm\u0259k
  as nak da \u0259ttafa win Abba, \u0259he tara-nnet. 11 \\\"\u018fnne\u0263-awan
  adi f\u0259l at tagim t\u0259d\u0259wit ta-nin, amaran da, at tandu t\u0259d\u0259wit-nawan.
  12 \u018fnta da alwajib wa-nin: ''Namariwat s \u0259mm\u0259k was kawan-are.'' 13
  W\u0259r tu-t\u0259lla tara togarat ad akfu awedan iman-net f\u0259l midawan-net.
  14 Kud t\u0259taggam awa as kawan-omara, w\u0259di kawanay imidawan-in. 15 W\u0259r
  dawan-ganna\u0263 eklan, f\u0259las akli w\u0259r it\u0259ss\u0259n arat wa itag
  m\u0259\u0161\u0161is. Kala kalar \u0259ge\u0263-awan es\u0259m imidawan-in, f\u0259las
  awa as \u0259sle\u0263 \u0263ur Abba-nin kul \u0259ssosana\u0263-awan-tu. 16 W\u0259r
  di-tasannafranam, eges kawanay, nak a kawan-isannafranan; \u0259siwaraq-qawan at
  taglim, tar\u0259wam-du t\u0259nfa tagget a za tahagit. \u018fddi a t\u0259gmayam
  da\u0263 Abba s \u0259s\u0259m-in a dawan-t-agu. 17 Omaraq-qawan s ad t\u0259n\u0259m\u0259rim.
  18 \\\"Kud gezzar a kawan-t\u0259ga \u0259dd\u0259net, \u0259ss\u0259nat as t\u0259gz\u00e2r-i
  dat-wan. 19 Kud kawanay \u0259dd\u0259net kawan t\u0259lat, w\u0259di \u0259dd\u0259net
  tara wa t\u0259la; mi\u0161an w\u0259r kawan t\u0259la, f\u0259las nak kawan da\u0263-as
  d-isannafranan, adi a f\u0259l kawan t\u0259gzar. 20 Aktiwat-du awa dawan-\u0259nne\u0263,
  as: ''Akli w\u0259r oger m\u0259\u0161\u0161is''; kud \u0259ss\u0259knan-i al\u0263azab,
  a dawan-t-assaknin kawanay da; kud \u0259ttafan awal-in, kawanay da, ad \u0259tt\u0259fan
  wa-nawan. 21 Eges adi kul, \u0259dd\u0259lil-in a f\u0259l dawan-tu-z-agin; f\u0259las
  w\u0259r \u0259ssenan wa di-d-izammazalan. 22 \\\"\u018fnnar du-w\u0259r-ose, \u0259\u0161\u0161ewala\u0263-asan,
  w\u0259r z'' attarmasan \u0259s bakkadan-nasan, eges \u0259m\u0259r\u0259dda w\u0259r
  t-illa \u0259saru w\u0259l\u0259yyan a dasan-z-igd\u0259lan a s\u0259r-san attarmasan.
  23 Wa di-igzaran, igz\u00e2r Abba-nin \u0259nta da. 24 \u018fnnar w\u0259r \u0259ge
  gar-essan imazalan \u0259s w\u0259r t-illa awedan as kala tan-iga, w\u0259r z''
  attarmasan \u0259s bakkadan-nasan. \u018fnayan-tan \u0259m\u0259r\u0259dda eges
  \u0259glan, \u0259gzaran-ana nak d Abba-nin. 25 Mi\u0161an adi iga f\u0259l at tandu
  batu ta t\u0259nnat da\u0263 \u018flk\u0259ttaban n \u018fnn\u0259bitan: ''\u018fgzaran-i
  bannan.'' 26 As d-osa \u018fm\u0259ggi \u0259n t\u0259lxutbat wa dawan-du-z-assagla
  \u0263ur Abba, imosan Infas wa isin\u0259fililan tid\u0259t a s\u0259r-wan-du-z-igm\u0259dan
  Abba, a fall-i aggayyat. 27 Kawanay da, a fall-i taggayyem, f\u0259las t\u0259ddewam
  d\u0259r-i harwa da\u0263 tizarat.\\\"\\nYaxya 16\\n2 Ad t\u0259t\u0259w\u0259kk\u0259sam
  da\u0263 t\u0259m\u0259zg\u0259ddawen \u0259n K\u0259l-\u018fly\u0259hud, fadda
  ilk\u00e2m alwaq da\u0263-as wa da\u0263-wan ikkasan iman, illa \u0263ur-\u0259s
  as M\u0259\u0161\u0161ina as iga tara-net. 3 Adi a dawan-z-agin aytedan f\u0259las
  w\u0259rmad a di-\u0259zdayan wala \u0259ss\u00e2nan Abba. 4 \u018fmala\u0263-awan
  aratan di \u0259m\u0259r\u0259dda, f\u0259l a tan-du-taktim as d-ewad alwaq wa da\u0263
  z'' agin aytedan tara-nasan. Aratan win w\u0259r dawan-tan-\u0259mela da\u0263 tizarat
  n \u0259\u0161\u0161\u0259\u0263\u0259l-in \u0263ur-wan, f\u0259las alwaq w\u0259di
  harwada \u0259ddewa d\u0259r-wan.\\n\u018f\u0161\u0161\u0259\u0263\u0259l n Infas
  wa z\u0259ddigan\\n5 \\\"\u018fm\u0259r\u0259dda ad \u0259qq\u0259la wa di-d-izammazalan,
  mi\u0161an w\u0259r kawan iha i di-iss\u0259stanan \u0259d dad \u0259kke. 6 Eges
  \u0259knan man-nawan ax\u0161ud f\u0259las dawan-\u0259nne adi. 7 D\u0259r iga adi
  da, a dawan-\u0259m\u0259la tid\u0259t: of-awan ad agla, f\u0259las as w\u0259r
  \u0259gle w\u0259r kawan-du-z-asu \u018fm\u0259ggi \u0259n t\u0259lxutbat, mi\u0161an
  as \u0259gle a dawan-t-id-assagla. 8 As d-osa ad assaknu aytedan n \u0259dd\u0259net
  as \u0259xr\u00e2kan da\u0263 batu n awa imosan abakkad, d awa imosan al\u0263adala
  \u0259n M\u0259\u0161\u0161ina d \u0259\u0161\u0161\u0259ri\u0263a-net. 9 \u018fxr\u00e2kan
  da\u0263 batu n awa imos abakkad f\u0259las tug\u0259yt s a \u0259gan a s\u0259r-i
  \u0259zz\u0259gz\u0259nan; 10 \u0259xr\u00e2kan da\u0263 batu n awa imosan al\u0263adala
  f\u0259las tewa\u0263lay a \u0259ge\u0263 Abba amaran w\u0259r i-za-t\u0259l\u0259sam
  anay; 11 \u0259xr\u00e2kan da\u0263 batu n awa imosan \u0259\u0161\u0161\u0259ri\u0263a
  \u0259n M\u0259\u0161\u0161ina f\u0259las anaxkim n \u0259dd\u0259net, a t-imosan
  Iblis, ib\u00e2z-tu \u0259\u0161\u0161\u0259ri\u0263a. 12 \\\"Harwada \u0259le batuten
  aggotnen as are a dawan-tanat-aga eges w\u0259r asnat-t\u0259zmeram \u0259m\u0259r\u0259dda.
  13 As d-osa Infas wa isinifililan tid\u0259t, a kawan-iss\u0259lk\u0259m i tid\u0259t
  kul ta du-t\u0259falat M\u0259\u0161\u0161ina f\u0259las batuten-net w\u0259r t-idu-z-\u0259gm\u0259dnat,
  awa as z-aslu \u0263as a da\u0263 dawan-z-i\u0161\u0161iw\u0259l ketnet, im\u0259l-awan
  aratan win d-\u0259zaynen, 14 iz\u0259zw\u0259r-i f\u0259las isalan-in win z-igr\u0259w
  \u0263as a dawan-z-im\u0259l. 15 Awa iqqalan Abba ketnet iqqal-i nak da; adi a f\u0259l
  \u0259nne, isalan-in win z''igr\u0259w Infas wa Z\u0259ddigan a dawan-z-im\u0259l.\\nT\u0259kenzert
  \u0259n nalkiman t\u0259qqal t\u0259d\u0259wit\\n16 \\\"A dawan-\u0259gm\u0259da\u0263
  anay d\u0259ff\u0259r alwaq w\u0259r n\u0259gg\u0259t, mi\u0161an a di-t\u0259l\u0259sam
  anay da\u0263 adan w\u0259r n\u0259gg\u0259t d\u0259ff\u0259r adi.\\\" 17 T\u0259zzar
  namannan w\u0259yyad da\u0263 nalkiman-net: \\\"Ma imos alma\u0263na n awa dana\u0263-inna
  da? ''A dawan-\u0259gm\u0259da\u0263 anay d\u0259ff\u0259r alwaq w\u0259r n\u0259gg\u0259t,
  mi\u0161an a di-t\u0259l\u0259sam anay da\u0263 adan w\u0259r n\u0259gg\u0259t d\u0259ff\u0259r
  adi ?'' \u018fnta da ma imos alma\u0263na n ''Abba a \u0259kke''? 18 Ma imos alma\u0263na
  \u0259n ''da\u0263 alwaq w\u0259r n\u0259gg\u0259t'' wa immal da? W\u0259r n\u0259ssen
  awa as iha batu-net\\\" 19 Issan \u0194aysa as \u0259r\u00e2n at-t-\u0259s\u0259stanan.
  Inn-asan: \\\"T\u0259tinamas\u0259stinam f\u0259las \u0259nne: ''A dawan-\u0259gm\u0259da\u0263
  anay d\u0259ff\u0259r alwaq w\u0259r n\u0259gg\u0259t, mi\u0161an a di-t\u0259l\u0259sam
  anay da\u0263 adan w\u0259r n\u0259gg\u0259t d\u0259ff\u0259r adi'' 20 \u018fgg\u0259yye\u0263
  silakana\u0263-awan as at-talim, t\u0259s\u0259kk\u0259l\u0259lam mi\u0161an as
  itag adi aytedan n \u0259dd\u0259net \u0259ntanay \u0259dd\u0259wen. Ad \u0259x\u0161\u0259dan
  man-nawan eges ax\u0161ud di a tu-t\u0259zr\u0259y t\u0259d\u0259wit. 21 Tantut
  as iqqal t\u0259taggaz amadal, ad \u0259x\u0161\u0259dan man-net f\u0259l aggad
  wa du-t\u0259ga alwaq-net; mi\u0161an as d-ihu barar-net, at-tammazzay d \u0259s\u0259mm\u0259dr\u0259n
  da\u0263 arkanay wa t\u0259nay, is\u0259dd\u0259wat-tat as du-t\u0259gga awedan
  da\u0263 \u0259dd\u0259net. 22 Kawanay da zund adi da, \u0259m\u0259r\u0259dda \u0259x\u0161\u00e2dan
  man-nawan, mi\u0161an a kawan-\u0259l\u0259sa\u0263 anay, \u0259z\u0259l w\u0259di
  at tagim t\u0259d\u0259wit as tu-w\u0259r-illa i da\u0263-wan tat-z-ikk\u0259san.
  23 W\u0259r-i-za-t\u0259ss\u0259stanam d arat w\u0259l\u0259yyan \u0259z\u0259l
  w\u0259di. \u018fgg\u0259yye\u0263 silakana\u0263-awan as, a t\u0259gmayam da\u0263
  Abba s es\u0259m-in a dawan-t-agu. 24 Harwada w\u0259r t-illa a t\u0259gm\u00e2yam
  s-es\u0259m-in. \u018fgmiyat at t\u0259gr\u0259wam f\u0259l at tagim t\u0259d\u0259wit
  t\u0259km\u00e2lat\\\"\\n\u0194aysa irza \u0259dd\u0259net\\n25 \\\"\u018fm\u00e2la\u0263-awan
  adi \u0259s \u0161a\u0161\u0161elan, mi\u0161an ilk\u00e2m alwaq da\u0263 awan-w\u0259r-z-\u0259lasa\u0263
  emel n arat w\u0259l\u0259yyan wa iqqalan Abba \u0259s \u0161a\u0161\u0161elan,
  a dawan t-\u0259m\u0259la s awa imos. 26 \u018fz\u0259l w\u0259di at t\u0259gm\u0259yam
  da\u0263 Abba s es\u0259m-in. W\u0259r awan-\u0259nne a dawan da\u0263-as \u0259gmiya,
  27 f\u0259las Abba iman-net ir-iwan f\u0259las di-t\u0259ram, \u0259nta da t\u0259zzigzanam
  as \u0263ur-\u0259s d-\u0259gm\u00e2da. 28 Abba a \u0263ur d-\u0259gmada, ose-du
  \u0259dd\u0259net amaran \u0259m\u0259r\u0259dda a tat-\u0259gm\u0259da \u0259qq\u0259laq-q.\\\"
  29 T\u0259zzar \u0259nnan-as nalkiman-net: \\\"\u018fn\u0259y, \u0259m\u0259r\u0259dda
  t\u0259mmala\u0263-ana\u0263 aratan s awa mosan, w\u0259rge \u0259s \u0161a\u0161\u0161elan.
  30 \u018fm\u0259r\u0259dda n\u0259ssan as t\u0259ss\u00e2na\u0263 da\u0263 arat
  kul, w\u0259r t-illa arat a iqqal a dak-i\u0263baran; adi da a f\u0259l n\u0259zz\u0259gzan
  as Abba a \u0263ur du-t\u0259gmada.\\\" 31 Inn-asan \u0194aysa: \\\"Adis \u0259m\u0259r\u0259dda
  t\u0259zz\u0259gzanam?\\\" 32 \u018fn\u0259yat, alwaq ihoz, fadda iga, wa da\u0263
  za t\u0259t\u0259ww\u0259ziw\u0259zam, akkiyyan akku a\u0263aywan-net, tayyim-i-d
  \u0263as-in; mi\u0161an ya w\u0259r \u0259mosa \u0263as-in f\u0259las illa \u0263ur-i
  Abba. 33 \u018fmala\u0263-awan arat wa f\u0259l at t\u0259gr\u0259wam alxer da\u0263
  t\u0259rt\u0259yt ta d\u0259r-i t\u0259gam. At t\u0259niyam arkanay da\u0263 \u0259dd\u0259net,
  mi\u0161an iliwat \u0259w\u0259l, f\u0259las \u0259rze\u0263 \u0259dd\u0259net.\\\"\\nYaxya
  17\\nT\u0259watray \u0259n \u0194aysa i nalkiman-net\\n2 id t\u0259zzozaraq-qu y
  aytedan kul f\u0259l ad akfu t\u0259m\u0259ddurt ta t\u0259\u0263lalat i win tu-t\u0259kfe.
  3 Amaran \u0259nta t\u0259m\u0259ddurt ta t\u0259\u0263lalat awa tat-imosan, ad
  in\u0259fil\u0259l y aytedan awa t\u0259mosa, kay \u0263as M\u0259\u0161\u0161ina
  wa n tid\u0259t; in\u0259fil\u0259l-asan \u0259ntada as \u0194aysa \u018flm\u0259six
  a du-t\u0259zammazala. 4 \u018fssikna tarna-nak f\u0259l ama\u1e0dal s \u0259s\u0259ndi
  wa \u0259ge \u0259\u0161\u0161\u0259\u0263\u0259l was di-t\u0259ss\u0259wara\u0263
  \u0259zuk-net. 5 Amaran \u0259m\u0259r\u0259dda kay Abba, akf-i \u0263ur man-nak
  tarna ta \u0263ur-\u0259k \u0259le\u0263 harwa dat \u0259xluk n \u0259dd\u0259net.
  6 Sinafalala awa t\u0259mosa y aytedan win du-t\u0259sannafrana t\u0259skataq-qan-du
  da\u0263 \u0259dd\u0259net, t\u0259geq-qan da\u0263 \u0259fus-in t\u0259zzar \u0259ttafan
  awal-nak. 7 \u018fm\u0259r\u0259dda \u0259ssanan as arat kul wa di-t\u0259kfe, kay
  a \u0263ur d igmad. 8 F\u0259las \u0259mala\u0263-asan awa di-t\u0259nne, \u0259qbalan-tu,
  amaran silakanan as kay a \u0263ur d-\u0259gmada, \u0259zzigzanan de\u0263 as di-du-t\u0259zimazala.
  9 W\u0259r kay tins\u0259ya y aytedan win \u0259dd\u0259net, kala ar win di-t\u0259kfe
  a f\u0259l kay tansaya\u0263 f\u0259las \u0259mosan i-nak. 10 A wa \u0259le kul
  i-nak, kay da a wa t\u0259le kul i-nu; amaran tarna-nin t\u0259tiwanay da\u0263-san.
  11 Nak, ab-as ahe\u0263 \u0259dd\u0259net, kay a din-\u0259kke, mi\u0161an \u0259ntanay
  \u0259han-tat. Ya Abba di z\u0259ddigan, ag\u0259z-tan s es\u0259m-nak, a di-t\u0259kf\u00ea,
  f\u0259l ad \u0259qq\u0259lan arat iyyanda \u0161ilat \u0259n wa d\u0259r-\u0259k
  \u0259mosa. 12 Harwa tan-\u0259he, og\u00e2zaq-qan s es\u0259m-nak, a di t\u0259kf\u00ea,
  w\u0259r da\u0263-san ixrek waliyyan ar wa ixrakan f\u0259l ad andu awa \u0259nnan
  K\u0259tban. 13 \u018fm\u0259r\u0259dda kay a din-\u0259kke, ganna awa harwa \u0259he\u0263
  \u0259dd\u0259net f\u0259l ad agin t\u0259d\u0259wit t\u0259nd\u00e2t \u0161ilat
  \u0259n ta \u0259ge. 14 \u018fmala\u0263-asan awal-nak t\u0259zzar t\u0259gzar-tan
  \u0259dd\u0259net f\u0259las w\u0259r tan-t\u0259la zund as nak iman-in w\u0259r
  di-t\u0259la. 15 W\u0259r da\u0263-ak \u0259gmaya a tan-t\u0259kk\u0259sa da\u0263
  \u0259dd\u0259net, mi\u0161an \u0259gmaya da\u0263-ak a tan-tag\u0259za da\u0263
  Iblis. 16 W\u0259r tan-t\u0259la \u0259dd\u0259net, zund as nak iman-in w\u0259r
  di-t\u0259la. 17 Z\u0259zd\u0259g iwallan-nasan s awal-nak imosan tid\u0259t. 18
  \u018fz\u0259mmiz\u0259l wa di-du-t\u0259ge s \u0259dd\u0259net, \u0259nta a tan
  s\u0259r-\u0259s \u0259ge nak da. 19 Amaran \u0259kfeq-qay iman-in f\u0259l \u0259dd\u0259lil-nasan
  f\u0259l ad akfin win-nasan \u0259ntanay da \u0259s tid\u0259t. 20 W\u0259rge inalkiman-in
  \u0263as as kay tansaya, kalar tansayaq-qay \u0259ntada y aytedan win s\u0259r-i
  z'' \u0259zz\u0259gz\u0259nnen f\u0259l as \u0259slan y awal-nasan. 21 \u018fgmaya
  da\u0263-ak a tan-igan ket-nasan arat iyyanda s \u0259mm\u0259k was d\u0259r-\u0259k
  t-\u0259mosa; n\u0259qq\u0259l-tu d\u0259r-san nakkanay da f\u0259l ad t\u0259zz\u0259gz\u0259n
  \u0259dd\u0259net as kay a di-d-izammazalan. 22 \u018fkfeq-qan tarna ta di-t\u0259kfe,
  f\u0259l ad \u0259qq\u0259lan arat iyyanda zun awa n\u0259mos nak d\u0259r-\u0259k,
  23 nak \u0259rt\u00e2ya d\u0259r-san, kay t\u0259rt\u00e2ya d\u0259r-i, f\u0259l
  ad \u0259qq\u0259lan arat iyyanda \u0259s t\u0259m\u0259wit t\u0259nd\u00e2t t\u0259zzar
  t\u0259ss\u0259n \u0259dd\u0259net as kay a di-d-izammazalan harwa t\u0259ge\u0263-asan
  tara ta di-t\u0259ge. 24 Abba, a \u0259re as win di t\u0259kfe ad \u0259gg\u0259zan
  \u0259ntanay da edag wa \u0259he f\u0259l ad \u0259hannayan tarna ta di-t\u0259kfe
  f\u0259las di-tare harwa dat \u0259xluk n \u0259dd\u0259net. 25 Abba, m\u0259\u0161\u0161is
  n al\u0263adala, \u0259dd\u0259net w\u0259r kay-t\u0259ssen eges nak \u0259ssanaq-qay
  amaran inalkiman-in, \u0259ss\u00e2nan as kay a di-d-izammazalan. 26 \u018fssosanaq-qan
  awa t\u0259mosa amaran w\u0259r z''ammazzaya d adi, f\u0259l a tan-t\u0259gg\u0259z
  tara ta di-t\u0259ge, \u0259rt\u0259ya d\u0259r-san.\\nYaxya 18\\n\u018ft\u0259rm\u0259s
  \u0259n \u0194aysa\\n2 Yahuza Isxar\u0259yuti wa z''akkaddalan \u0194aysa issan
  edag wen, f\u0259las iyy\u0259wan da\u0263-as \u0194aysa \u0259m\u0259n\u0259y \u0259nta
  \u0259d nalkiman-net. 3 T\u0259zzar iddew Yahuza \u0259d taqqamt tagget \u0259n
  sojitan \u0259n K\u0259l-\u018frrum, \u0259d magazan n Ahan \u0259n M\u0259\u0161\u0161ina
  win d-\u0259ss\u0259glan limaman win zawwarnen, \u0259d Farisaytan, ewayan f\u0259t\u0259laten,
  \u0259d belan, \u0259d t\u0259zoli-nasan. 4 Ihoz-tan-in \u0194aysa, f\u0259las iss\u00e2n
  da\u0263 arat kul wa tu-z-igr\u0259wan, iss\u0259stan-tan inn-asan: \\\"Ma imos
  was t\u0259saggadam?\\\" 5 \u018fnnan-as: \\\"\u0194aysa wa n Nazaret as n\u0259saggad.\\\"
  Inn-asan: \\\"Nak da da.\\\" Ibdad gar-essan Yahuza wa t-ikk\u0259ddalan. 6 Amazay
  wa da da\u0263 dasan-inna \u0194aysa: \\\"Nak da da\\\" \u0259nta da\u0263 \u0259hagan
  \u0259qqalan d\u0259ff\u0259r-san har udan. 7 Ilas \u0194aysa inn-asan: \\\"Ma imos
  was t\u0259saggadam?\\\" \u018fnnan-as: \\\"\u0194aysa wa n Nazaret as n\u0259saggad.\\\"
  8 Inn-asan: \\\"W\u0259rge\u0263 \u0259nne\u0263-awan nak da da. Da\u0263 adi kud
  nak as t\u0259saggadam, tayyim aytedan win ad j\u0259w\u0259nken. 9 \u018fmm\u0259k
  wen da as inda awal wa iga dat awen as inna: \\\"W\u0259r da\u0263-i ixrek waliyyan
  da\u0263 win di-t\u0259kfe.\\\" 10 Ila Sim\u0263on Butros takoba, t\u0259zzar ilbay-tat-du
  iwat s\u0259r-\u0259s akli n \u018flimam wa Z\u0259wwaran, ifras-du t\u0259m\u0259zzuk-net
  ta n \u0259\u0263il. Akli wa es\u0259m-net Malxus. 11 Inna \u0194aysa i Butros:
  \\\"Su\u0263\u0259l takoba-nak t\u0259t\u0259rut! Ak ad aqqama w\u0259r \u0259ge\u0263
  al\u0263azab wa di-otas Abba?\\\"\\n\u018ft\u0259w\u0259s\u0259bdad \u0259n \u0194aysa
  dat limaman\\n12 T\u0259zzar obazan \u0194aysa \u0259kradan-tu. \u018fmosan taqqamt
  \u0259n sojitan \u0259n K\u0259l-\u018frrum d \u0259muzar-nasan, \u0259d magazan
  n Ahan \u0259n M\u0259\u0161\u0161ina win d-\u0259ss\u0259glan muzaran \u0259n K\u0259l-\u018fly\u0259hud.
  13 Ewayan-tu \u0259stizarat s ahan \u0259n X\u00e2nan wa n \u0259daggal \u0259n
  Kayif wa imosan \u018flimam wa Z\u0259wwaran da\u0263 awatay wen. 14 Amaran Kayif
  \u0259nta a igan i muzaran \u0259n K\u0259l-\u018fly\u0259hud tanat ta n as ofa
  ad ammat awedan iyyanda da\u0263 adag \u0259n tamattay. 15 Ilkam Sim\u0263on Butros
  i \u0194aysa \u0259nta d \u0259nalkim iyyan. \u018fnalkim wa izday \u018flimam wa
  Z\u0259wwaran iman-net, t\u0259zzar iggaz afarag wa i\u0263layan a\u0263aywan n
  \u018flimam wa Z\u0259wwaran da\u0263 amazay wa da daq-q''iggaz \u0194aysa. 16 Butros
  \u0259nta iqqim-du dat ahan, \u0263ur \u0259mi n afarag. Irda\u0263-du \u0259nalkim
  wen, igraw \u0263ur t\u0259ntut ta togazat t\u0259s\u0259h\u0259rt ad tayyu Butros
  s iguz n a\u0263aywan. 17 T\u0259zzar t\u0259nna t\u0259ma\u0161\u0161a\u0263alt
  ta togazat imi n ahan i Butros: \\\"W\u0259rge kay da iyyan da\u0263 nalkiman n
  al\u0259s wa a t\u0259mosa?\\\" Inn-as: \\\"W\u0259r t-\u0259mosa.\\\" 18 Asamed
  iga. \u0194ilay\u0263alayan eklan \u0259d magazan n Ahan \u0259n M\u0259\u0161\u0161ina
  temsay \u0259n t\u0259makaten \u0259sukusan s\u0259r-\u0259s. Ik-en-in Butros \u0259nta
  da ad isukus. 19 Iss\u0259stan \u018flimam wa Z\u0259wwaran \u0194aysa da\u0263
  tal\u0263a \u0259n nalkiman-net, d \u0259s\u0259ss\u0259\u0263ri wa itaggu. 20 Inn-as
  \u0194aysa: \\\"Awal wa \u0259ge y \u0259dd\u0259net, w\u0259r imos arat i\u0263baran.
  Faw da inan \u0259n ta\u0263aray d Ahan \u0259n M\u0259\u0161\u0161ina da\u0263
  sassa\u0263ra dad \u0259ddewan K\u0259l-\u018fly\u0259hud kul, amaran w\u0259r t-illa
  awal \u0259ge da\u0263 \u0259ssir. 21 Mafel as di-t\u0259sastana? S\u0259st\u0259n
  aytedan win di-\u0259slanen d arat wa f\u0259l dasan-\u0259mm\u0259grada; \u0259ntanay
  \u0259ssanan da\u0263 arat wa \u0259nne.\\\" 22 As inna \u0194aysa arat wa, iqqas-as
  iyyan da\u0263 magazan n Ahan \u0259n M\u0259\u0161\u0161ina ibd\u00e2dan den, inn-as:
  \\\"Esaway wa da as t\u0259tajawwaba y \u018flimam wa Z\u0259wwaran?\\\" 23 Ijj\u0259wwab-as
  \u0194aysa inn-as: \\\"Kud arak batu a \u0259ge, \u0259m\u0259l-i edag wa daq-qat-\u0259ge.
  Kud amaran \u0259ge\u0263 batu tola\u0263at, m\u0259ni \u0259dd\u0259lil wa f\u0259l
  di-t\u0259ggata?\\\" 24 Iss\u0259rdaq-qu X\u00e2nan, da ikrad, issok-ay Kayif wa
  n \u018flimam wa Z\u0259wwaran. 25 Assa\u0263at ten, Sim\u0263on Butros illa den
  da isukus \u0259s tamsay. Itawann-as: \\\"W\u0259rge kay da arat da\u0263 nalkiman
  n al\u0259s wa a t\u0259mosa?\\\" Inn-asan Butros: \\\"Kala kala w\u0259r t-\u0259mosa.\\\"
  26 Inkar-du iyyan da\u0263 eklan n \u018flimam wa Z\u0259wwaran, imosan \u0259\u0161\u0259qqa\u0263
  n al\u0259s was d-ifras Butros t\u0259m\u0259zzuk-net, inn-as: \\\"W\u0259rge\u0263
  \u0259nayaq-qay t\u0259ddewa d\u0259r-\u0259s da\u0263 \u0259goras?\\\" 27 Ilas
  Butros \u0259nnukra n arat wen. Amazay wen da da\u0263 i\u0263ra \u0259k\u0259ji
  a\u0263ora.\\n\u018ft\u0259w\u0259s\u0259bdad \u0259n \u0194aysa dat Bilat\u0259s\\n28
  Immeway \u0194aysa \u0263ur Kayif s a\u0263aywan n \u0259muzar n akal. Arat wa itaggu
  \u0263ur \u0259f\u0259rir\u0259y n anay. Win d\u0259r-\u0259s d-\u0259ddewnen w\u0259r
  \u0259ggezan ehan wa n \u0259muzar n akal, f\u0259l ad \u0259tt\u0259fan tazdak-nasan
  y ad at\u0161in amensay wa n Akkay. 29 Awen da f\u0259l d-igmad Bilat\u0259s wa
  n \u0259muzar n akal ehan-net, ikk-en-du inn-asan: \\\"Ma imos lahan wa f\u0259l
  t\u0259bazam al\u0259s wa?\\\" 30 \u018fnnan-as: \\\"\u018fnnar w\u0259r imos aw
  t\u0259kma, w\u0259r dak-k-idu-za-naw\u0259y\\\" 31 Inn-asan Bilat\u0259s: \\\"Aw\u0259yat-tu
  t\u0259xk\u0259mam-as s \u0259lqanun wa-nawan.\\\" \u018fnnan-as K\u0259l-\u018fly\u0259hud:
  \\\"Nakkanay w\u0259r n\u0259la turagat \u0259n tana\u0263ay n awedan.\\\" 32 Arat
  wa itaggu f\u0259l ad andu awal wa iga \u0194aysa assa\u0263a wa ad imal \u0259nnu\u0263
  \u0259n t\u0259mattant ta z-agu. 33 T\u0259zzar iqqal Bilat\u0259s ehan-net i\u0263ra
  \u0194aysa iss\u0259stan-tu inn-as: \\\"Kay a imosan \u0259m\u0259nokal \u0259n
  K\u0259l-\u018fly\u0259hud?\\\" 34 Inn-as \u0194aysa: \\\"Arat wa kay iman-nak as
  tu-t\u0259nne, me\u0263 ak aytedan wiyyad a dak-k-\u0259nnanen s\u0259r-i?\\\" 35
  Inn-as Bilat\u0259s: \\\"Un nak iyyan da\u0263 K\u0259l-\u018fly\u0259hud a mosa?
  Tamattay-nak, \u0259d limaman win zawwarnen a kay d-ewaynen s\u0259r-i, ma imos
  arat wa t\u0259x\u0161ada?\\\" 36 Ijj\u0259wwab-as \u0194aysa inn-as: \\\"Ta\u0263mar-in
  w\u0259r tat-t\u0259la \u0259dd\u0259net ta da. \u018fnnar ta\u0263mar-in \u0161in
  \u0259dd\u0259net ta da, \u0259nk\u0259rnat-du t\u0259\u0263urad-in \u0259kn\u0259snat
  f\u0259l ad w\u0259r \u0259ggeza\u0263 ifassan \u0259n K\u0259l-\u018fly\u0259hud.
  Kala kala, igmad a\u0161\u0161ak as ta\u0263mar-in w\u0259r tat-t\u0259la \u0259dd\u0259net
  ta da.\\\" 37 Inn-as Bilat\u0259s: \\\"Da\u0263 adi kay \u0259m\u0259nokal?\\\"
  Ijj\u0259wwab-as \u0194aysa inn-as: \\\"Kay iman-nak a innan: Nak \u0259mosa\u0263
  \u0259m\u0259nokal. Arat da wa f\u0259l d-\u0259h\u0259wa amaran \u0259nta f\u0259l
  d-\u0259ggaza\u0263 \u0259dd\u0259net: assa a d-\u0259ge y ad aggayye\u0263 \u0259s
  tid\u0259t. I imosan aw tid\u0259t, kul issisam y awal-in.\\\" 38 Inn-as Bilat\u0259s:
  \\\"Ma t\u0259mos za tid\u0259t?\\\" D\u0259ff\u0259r adi iqqal Bilat\u0259s K\u0259l-\u018fly\u0259hud
  inn-asan: \\\"F\u0259l aganna wa di-iqqalan za, nak w\u0259r \u0259h\u0259nn\u0259ya
  lahan waliyyan da\u0263 al\u0259s wa. 39 Mi\u0161an ya, da\u0263 arat wa imosan
  al\u0263adat-nawan as faw da as d-ewad \u0259mud wa n Akkay a dawan-d-\u0259kk\u0259sa\u0263
  iyyan da\u0263 m\u0259sk\u0259sa-nawan. T\u0259ram a dawan-d-\u0259kk\u0259sa\u0263
  \u0259m\u0259nokal \u0259n K\u0259l-\u018fly\u0259hud?\\\" 40 Sa\u0263\u0263aren-du
  ket-nasan \u0259nnan-as: \\\"Kala, kala, w\u0259rge\u0263 \u0259nta! Barabbas as
  n\u0259ra danaq-q-idu-t\u0259kk\u0259sa.\\\" Barabbas wa \u0259jaj\u0259b n anasgafa
  a imos.\\nYaxya 19\\n2 \u018fzd\u0227n sojitan t\u0259k\u0259bbut t\u0259gat \u0259s
  \u0161\u0259nnanan \u0259ss\u0259waran-tat e\u0263af-net, \u0259zz\u0259zlagan-tu
  \u0259ntada \u0259b\u0259rnuz zagga\u0263an. 3 Tihazan-t-in gannan-as: \\\"Oyyik!
  \u018fm\u0259nokal \u0259n K\u0259l-\u018fly\u0259hud!\\\" Taggan-as \u0161iqqas.
  4 Ilas Bilat\u0259s irda\u0263-du, inna i K\u0259l-\u018fly\u0259hud: \\\"\u018fnawat!
  A dawan-t-id \u0259ss\u0259rd\u0259\u0263a, ad t\u0259ss\u0259nam as w\u0259r fall-as
  \u0259naya lahan waliyyan f\u0259l iww\u0259ddab.\\\" 5 T\u0259zzar irda\u0263-du
  \u0194aysa t\u0259war-tu t\u0259k\u0259bbut \u0259n \u0161\u0259nnanan, izlag \u0259b\u0259rnuz
  zagga\u0263an, inn-asan Bilat\u0259s: \\\"\u018fnta da al\u0259s.\\\" 6 As t-oggan
  limaman win zawwarnen \u0259d magazan n Ahan \u0259n M\u0259\u0161\u0161ina, ad
  sa\u0263aren gannin: \\\"Taytay-tu f\u0259l \u0161il\u0259lt! Taytay-tu f\u0259l
  \u0161il\u0259lt!\\\" inn-asan Bilat\u0259s: \\\"Ab\u0259zat-tu kawanay iman-nawan
  tattaytayam-tu, nak w\u0259r h\u0259nn\u0259ya\u0263 \u0259dd\u0259lil waliyyan
  f\u0259l t-\u0259ww\u0259ddaba.\\\" 7 \u018fnnan-as muzaran \u0259n K\u0259l-\u018fly\u0259hud:
  \\\"Nakkanay n\u0259la \u0259\u0161\u0161\u0259ri\u0263a, amaran \u0259\u0161\u0161\u0259ri\u0263a
  wa, ih-ay as al\u0259s wa ihor \u0259d t\u0259mattant, f\u0259las a inna \u0259nta
  Barar \u0259n M\u0259\u0161\u0161ina a imos.\\\"\\n8 Batu ta t\u0259\u0161\u0161ota
  tasa da\u0263 Bilat\u0259s, 9 t\u0259zzar ilas iguz n adag wa n \u0259\u0161\u0161\u0259ri\u0263a,
  inna i \u0194aysa: \\\"M\u0259nis du t\u0259he?\\\" Mi\u0161an w\u0259r das-iga
  \u0194aysa aljawab waliyyan. 10 Amazay wen da das-inna Bilat\u0259s: \\\"Nak as
  tugaya s a di-t\u0259\u0161\u0161iw\u0259la? W\u0259r t\u0259ssena\u0263 as \u0259le
  f\u0259rregat n a kay-ayya, \u0259le\u0263 \u0259ntada f\u0259rregat n a kay-attaytaya
  f\u0259l \u0161il\u0259lt?\\\" 11 Inn-as \u0194aysa: \\\"W\u0259r fall-i t\u0259le
  tarna waliyyat ar ta s\u0259r-\u0259k du-t\u0259falat M\u0259\u0161\u0161ina. A
  di da f\u0259las awedan wa di-igan g\u0259r fassan-nak, ogar-kay igi n abakkad.\\\"
  12 Amazay wen da da\u0263 iggaz Bilat\u0259s \u0161in agamay n asaway was z''ayyu
  \u0194aysa. Mi\u0161an \u0259nkaran-du K\u0259l-\u018fly\u0259hud ad sa\u0263aren
  gannin-as: \\\"As toyye\u0263 al\u0259s w\u0259di, adi za w\u0259r t\u0259mosa\u0263
  \u0259midi \u0259n Kisra, \u0259m\u0259nokal \u0259n K\u0259l-\u018frrum, f\u0259las
  awedan wa innan imos \u0259m\u0259nokal, w\u0259di azangaw \u0259n Kisra a imos!\\\"
  13 As isla Bilat\u0259s i batuten \u0161in, iss\u0259rda\u0263-du \u0194aysa, t\u0259zzar
  iqqim da\u0263 t\u0259xawit ta n adag n \u0259\u0161\u0161\u0259ri\u0263a. Edag
  w\u0259di es\u0259m-net \\\"A\u0263ar\u0263ar ils\u00e2n t\u0259s\u0259lit\\\" itawann-as
  da\u0263 t\u0259l\u0263ibranit \\\"Gabbata\\\". 14 Imos awen \u0259z\u0259l wa oggan
  amud wa n Akkay, ammasnazal, amaran taggin mutag. Inna Bilat\u0259s i K\u0259l-\u018fly\u0259hud:
  \\\"\u018fm\u0259nokal-nawan \u0259ddi!\\\" 15 Eges \u0259ggazan \u0161in t\u0259\u0263araten
  ad gannin: \\\"An\u0263-ay! An\u0263-ay! Taytay-tu f\u0259l \u0161il\u0259lt!\\\"
  Inn-asan Bilat\u0259s: \\\"Da\u0263 adi ad attaytaya\u0263 \u0259m\u0259nokal-nawan
  f\u0259l \u0161il\u0259lt?\\\" \u018fnnan-as limaman win zawwarnen: \\\"\u018fm\u0259nokal-nana
  w\u0259r t-imos ar Kisra.\\\" 16 T\u0259zzar iss\u0259llam i sojitan \u0194aysa
  y ad t-attaytayan f\u0259l \u0161il\u0259lt.\\n\u018ft\u0259w\u0259t\u0259ytay \u0259n
  \u0194aysa f\u0259l \u0161il\u0259lt\\nT\u0259zzar \u0259zz\u0259rgazan sojitan
  \u0194aysa. 17 Igmad a\u0263r\u0259m eway \u0259nta iman-net \u0161il\u0259lt ta
  f\u0259l z-attaytay. Ikka t\u0259ka\u0161wart tas itawannu \\\"T\u0259k\u0259yya\\\",
  itawann-as da\u0263 t\u0259l\u0263ibranit \\\"Golgota\\\". 18 Den da ad \u0259tt\u0259ytayan
  sojitan \u0194aysa f\u0259l \u0161il\u0259lt. \u018ftt\u0259ytayan \u0259\u0161\u0161in
  meddan wiyyad \u0259ntanay da f\u0259l \u0161il\u0259len, iyyan iggaz a\u0263il
  \u0259n \u0194aysa, wa hadan iggaz zalgat-net. 19 Omar Bilat\u0259s s ad ammatkal
  \u0259s\u0259llum it\u0259w\u0259kt\u0259b fall-as \\\"\u0194aysa wa n Nazaret,
  \u0259m\u0259nokal \u0259n K\u0259l-\u018fly\u0259hud\\\", it\u0259w\u0259s\u0259lt\u0259\u0263
  i \u0161il\u0259lt. Itawagg'' awen da. 20 K\u0259l-\u018fly\u0259hud aggotnen \u0259\u0263ran
  \u0259s\u0259llum wa. \u018fnta edag wa da\u0263 itt\u0259ytay \u0194aysa f\u0259l
  \u0161il\u0259lt ihoz a\u0263r\u0259m, amaran \u0259s\u0259llum wa iktab da\u0263
  awalan win t\u0259l\u0263ibranit, \u0259d t\u0259latint \u0259d t\u0259g\u0259rekt.
  21 \u018fnnan limaman win zawwarnen \u0259n K\u0259l-\u018fly\u0259hud i Bilat\u0259s:
  \\\"Ad w\u0259r t\u0259kt\u0259ba f\u0259l \u0161il\u0259lt as: ''Al\u0259s wa \u0259m\u0259nokal
  \u0259n K\u0259l \u018fly\u0259hud'', kalar \u0259kt\u0259b fall-as as: ''al\u0259s
  da wa innan \u0259nta a imosan \u0259m\u0259nokal \u0259n K\u0259l-\u018fly\u0259hud.''
  22 Inn-asan Bilat\u0259s: \\\"Arat wa \u0259ktaba, w\u0259r-tu-za-s\u0259mm\u0259tt\u0259ya.\\\"
  23 Assa\u0263a wad \u0259ttitayan sojitan \u0194aysa f\u0259l \u0161il\u0259lt,
  \u0259dkalan is\u0259lsa-net, \u0259gan-asan \u0259kkozat t\u0259zunen, \u0259kkullu
  n iyyan da\u0263-san igraw iyyat. \u018fdkalan \u0259ntada t\u0259katkat-net ta
  z\u0259wwarat, t\u0259gat da\u0263 t\u0259bdoq w\u0259r iha a imosan azamay, tosa\u0263-du
  \u0263ur afalla har eres. 24 \u018fnnan gar-essan: Ad w\u0259r n\u0259z\u0259zz\u0259rr\u0259t
  t\u0259katkat ta, ofa ad nagu \u0161i\u0161a\u0263eren f\u0259l wa tat-z-ilen. Arat
  wa \u0259nnan-tu f\u0259l ad andu awal ihan Ik\u0259tban n \u018fnn\u0259bitan.
  Awal wa inna: \\\"\u018fzunan tabdoq-in, t\u0259zzar \u0259gan \u0161i\u0161a\u0263eren
  f\u0259l t\u0259katkat-in\\\"\\nArat wen \u0259nta iman-net a \u0259gan sojitan.
  25 T\u0259g\u0259ttawt ta f\u0259l itt\u0259ytay \u0194aysa, \u0259bdadnat dagma-net
  t\u0259doden \u0259mosnen anna-net, \u0259d tamadrayt n anna-net, \u0259d Maryama
  ta n t\u0259ntut \u0259n Klobas, \u0259d Maryama ta n Magdala. 26 Ogga \u0194aysa
  anna-net, inay \u0259nalkim-net wa n \u0259m\u0259ri-net ibdad dagma n anna-net,
  inn-as: \\\"Anna, barar-nam \u0259ddi\\\". 27 T\u0259zzar inna y \u0259nalkim-net
  wen: \\\"Anna-nak \u0259ddi\\\". Amazay wen da da\u0263 d\u0259r-\u0259s iddew \u0259nalkim
  wen s a\u0263aywan-net issan da\u0263-as. 28 D\u0259ff\u0259r awen inna \u0194aysa:
  \\\"Ih-i fad\\\", f\u0259las issan as arat kul ikmal, amaran batu ta w\u0259r tat-iga
  ar f\u0259l ad andu awal ihan Ik\u0259tban n \u018fnn\u0259bitan. 29 Edag wa insa
  da\u0263-as \u0259\u0263\u0259zu iha esmad k\u0259zb\u0259ran w\u0259llen, t\u0259mm\u0259tkal
  \u0161ik\u0259st t\u0259ttal d \u0259mi n alawag n \u0259zz\u0259n\u0259f n \u0259nni\u0263na\u0263
  iyyan idw\u00e2lan as itawannu Xisob, itawasalma\u0263-du da\u0263 esmad wa, t\u0259zzar
  itawazzal-in s \u0259mi-net. 30 As izannalmaz \u0194aysa esmad wa k\u0259zb\u0259ran
  a, inna: \\\"Arat kul ikmal.\\\" T\u0259zzar iss\u0259ras e\u0263af-net, \u0259gmadan-tu
  man.\\n\u018ft\u0259w\u0259gga \u0259n \u0194aysa da\u0263 t\u0259saskawt\\n31 \u018fz\u0259l
  wen taggin mutag n \u0259mud wa n Akkay. K\u0259l \u018fly\u0259hud w\u0259r \u0259ren
  ad aqqaminat alzanazaten n aytedan \u0259warnat \u0161il\u0259len da\u0263 \u0259z\u0259l
  wa n t\u0259sanfat-nasan. \u018fnta \u0259z\u0259l wen, w\u0259r ogda \u0259d win
  hadatnen t\u0259zz\u0259ww\u0259rt. T\u0259zzar \u0259glan \u0259ss\u0259stanan
  Bilat\u0259s \u0259nnan-as: \\\"Am\u0259r s ad tawarzin daran-nasan, f\u0259l a
  tan-iba tarmad, t\u0259ssuk\u0259sa-du alzanazaten!\\\" 32 \u018fkkan-du sojitan
  meddan win tawataytaynen dagma \u0259n \u0194aysa. \u018frzan idaran \u0259n wa
  azzaran, okayan \u0259s wa n \u0259\u0161\u0161in \u0259gan-as awen da. 33 As d-ewadan
  \u0194aysa \u0259nayan as as d-osan da aba-tu. T\u0259zzar \u0259qqiman da w\u0259r
  \u0259rzen idaran-net. 34 Mi\u0161an idag iyyan da\u0263 sojitan win tasaga \u0259n
  \u0194aysa, isaxarabbat-tat s alla\u0263-net. Amazay wen da da\u0263-as d-iffay
  \u0259zni d aman. 35 Awedan wa igan isalan win, inay-tan \u0259s \u0161ittawen-net,
  amaran t\u0259g\u0259yya-net tid\u0259t a t\u0259mos. Issan as tid\u0259t ta t\u0259zdarat
  as i\u0161\u0161ewal da, f\u0259l ad t\u0259zz\u0259gz\u0259nam kawanay da. 36 \u018fnta
  aratan win kul w\u0259r \u0259gen ar f\u0259l ad andu awal ihan Ik\u0259tban n \u018fnn\u0259bitan.
  Awal wa inna: \\\"W\u0259r z-arraz waliyyan da\u0263 \u0263asan-net.\\\"\\n37 Awal
  wa ihan Ik\u0259tban n \u018fnn\u0259bitan ih-ay \u0259ntada as: \\\"Ad \u0259ss\u0259d\u0259gan
  isawadan-nasan sa s\u0259r wa saxxarabben.\\\"\\n38 D\u0259ff\u0259r adi osad-du
  Yus\u0259f wa n \u0259\u0263r\u0259m n Arimatay, imosan iyyan da\u0263 nalkiman
  \u0259n \u0194aysa, eges da\u0263 \u0259ssir, f\u0259las iksud K\u0259l-\u018fly\u0259hud.
  Ikka Bilat\u0259s igmay da\u0263-as ad aw\u0259y alzanazat \u0259n \u0194aysa. Ikf-ay
  Bilat\u0259s turagat n awen, t\u0259zzar igla eway alzanazat. 39 Osa-ddu Nikodemos
  \u0259nta da, s \u0259nta as kala din-osa \u0194aysa ahad iyyan dat awen. Eway-du
  amadal \u0259n karadat t\u0259m\u0259rwen \u0259n kilaw \u0259n t\u0259far\u0161it
  da\u0263 \u0259n\u0263alan alwarditan. 40 Idkal-du Yus\u0259f \u0259d Nikodemos
  alzanazat \u0259n \u0194aysa \u0259gan-tat da\u0263 \u0161ifit t\u0259gat da\u0263
  t\u0259s\u0259wad, \u0259ss\u0259lalan-tat adutan \u0259zodnen. Arat wa imos al\u0263adat
  \u0259n K\u0259l-\u018fly\u0259hud da\u0263 anabal \u0259n n\u0259mm\u0259ttan.
  41 Edag wa da\u0263 itawataytay \u0194aysa f\u0259l t\u0259g\u0259ttawt ih-ay afarag.
  Amaran afarag wen t\u0259h-ay t\u0259saskawt taynayat as w\u0259r kala tat-iggaz
  \u0259n\u0259mmett\u0259n. 42 \u018fz\u0259l wen \u0259nta da\u0263 simutugan K\u0259l-\u018fly\u0259hud
  y \u0259z\u0259l-nasan wa n t\u0259sanfawt, awen da f\u0259l iga Yus\u0259f \u0259d
  Nikodemos \u0194aysa da\u0263 t\u0259saskawt ta, f\u0259las \u0259nta a t\u0259hozat.\\nYaxya
  20\\nTanakra \u0259n \u0194aysa da\u0263 t\u0259mattant\\n2 Tozal t\u0259kka Sim\u0263on
  Butros d \u0259nalkim wa isannahal \u0194aysa tara t\u0259nn-asan: \\\"\u018fm\u0259li
  itawakkas da\u0263 t\u0259saskawt amaran w\u0259r n\u0259ssen edag wa daq q-\u0259gan.\\\"\\n3
  Irda\u0263-du Butros d \u0259nalkim wa hadan \u0259kkan t\u0259saskawt. 4 Ozalan
  f\u0259l \u0259\u0161\u0161in-essan, t\u0259zzar azzar-in \u0259nalkim wa hadan
  f\u0259las orna Butros da\u0263 azzal, 5 i\u0161\u0161\u0259gga inay \u0161is\u0259wad
  \u0161in \u0161ifit \u0259nsanat den, mi\u0161an w\u0259r iggez. 6 Sim\u0263on Butros
  wa das-d-ilkaman \u0259nta da ewad-du. Iggaz t\u0259saskawt, inay \u0259ntada \u0161is\u0259wad
  \u0161in \u0259nsanat den. 7 Inay asalsaw wa iwaran e\u0263af \u0259n \u0194aysa
  w\u0259r irtay \u0259d \u0161ifit, ittal insa s aganna, iha edag-net. 8 T\u0259zzar
  iggaz-du \u0259nalkim wa hadan, s \u0259nta a d-ewadan \u0259stizarat, inay arat
  wa izz\u0259gzan-tu. 9 \u018fnta harwa da w\u0259r \u0259gren Ik\u0259tban n \u0259nn\u0259bitan
  win \u0259nnanen \u0194aysa kundaba inkar-du da\u0263 n\u0259mm\u0259ttan. 10 T\u0259zzar
  \u0259qqalan nalkiman win a\u0263aywan-nasan.\\n\u018fn\u0259filal \u0259n \u0194aysa
  i Maryama ta n Magdala\\n11 Maryama t\u0259lla dat t\u0259saskawt da\u0263 ih\u0259z
  t\u0259hallu. T\u0259\u0161\u0161\u0259gga da\u0263 amazay wa da\u0263 t\u0259hallu
  den, 12 t\u0259nay \u0259\u0161\u0161in angalosan \u0259ssimlalnen, \u0259qqiman
  da\u0263 adag was kala a tu-t\u0259ha alzanazat \u0259n \u0194aysa. Iyyan illa \u0263ur
  anamod n a\u0263af-net, wa hadan illa \u0263ur daran-net. 13 T\u0259zzar \u0259nnan-as:
  \\\"Ma kam is\u00e2lan, tantut?\\\" T\u0259nn-asan: \\\"W\u0259r di-is\u0259lu ar
  imiw\u0259y wa iga \u018fm\u0259li-nin, amaran w\u0259r \u0259ssena dad itawagga.\\\"
  14 As t\u0259nna arat wa, t\u0259swad d\u0259ff\u0259r-\u0259s, togga \u0194aysa
  ibdad. Mi\u0161an w\u0259r t\u0259ssen as \u0259nta awen. 15 Inn-as \u0194aysa:
  \\\"Ma kam-is\u00e2lan tantut? Ma imos was t\u0259saggada?\\\" T\u0259nn-as Maryama:
  \\\"Ya al\u0259s wa, kud kay a t-ewayan, t\u0259m\u0259la\u0263-i dad illa f\u0259l
  a t-id-aw\u0259ya.\\\" Arat wa, as das-tu-t\u0259nna a t\u0259\u0263il \u0259magyak
  n afarag wa t\u0259ha t\u0259saskawt a das-i\u0161\u0161ewalan. 16 Inn-as \u0194aysa:
  \\\"Maryama!\\\", t\u0259zzar t\u0259malallay-t-in t\u0259nn-as da\u0263 awal wa
  n t\u0259l\u0263ibranit: \\\"Rabbuni!\\\" (alma\u0263na n awen \u018f\u0161\u0161ix-in.)
  17 Inn-as \u0194aysa: \\\"A di-w\u0259r-t\u0259gd\u0259la teklay, f\u0259las harwa
  da w\u0259r \u0259gg\u0259zzaya s Abba; kalar aglu \u0259m\u0259l i m\u0259drayan-in
  as nak ad aggazzaya s Abba-nin, s \u0259nta a imosan Abba-nawan kawanay da, aggazzaya
  s \u018fm\u0259li-nin s \u0259nta a imosan \u018fm\u0259li-nawan kawanay da.\\\"
  18 T\u0259gla Maryama t\u0259mal i nalkiman as t\u0259nay \u018fm\u0259li, t\u0259mal-asan
  aratan win f\u0259l das-imm\u0259grad.\\nAwa d-izdaran da\u0263 \u018flk\u0259ttab
  wa\\n\u018fn\u0259filal \u0259n \u0194aysa i nalkiman-net\\n19 Tadwit n alxad wen
  iman-net, \u0259ddewan nalkiman, \u0259\u0263falan-du ehan f\u0259l man-nasan, f\u0259las
  \u0259ksudan imuzaran \u0259n K\u0259l-\u018fly\u0259hud. Osa-ddu \u0194aysa ibdad
  gar-essan inn-asan: \\\"Ig-awan M\u0259\u0161\u0161ina alxer!\\\" 20 D\u0259ff\u0259r
  as dasan-inna awen iss\u0259kn-en ifassan-net, \u0259d tasaga-net. \u018fknan nalkiman
  t\u0259d\u0259wit f\u0259l anay wa \u0259gan y \u018fm\u0259li. 21 Ilas inn-asan:
  \\\"Ig-awan M\u0259\u0161\u0161ina alxer! \u018fzimazalaq-qawan s asaway was di-d-izammazal
  Abba.\\\" 22 D\u0259ff\u0259r as dasan-iga batu ta, iss\u0259wad-du fall-asan s
  \u0259mi-net, inn-asan: \\\"T\u0259gr\u0259wamet Infas wa Z\u0259ddigan! 23 Win
  as t\u0259ssorafam ibakkadan-nasan za, dasan-t\u0259w\u0259sur\u0259fan, amaran
  win as tan-w\u0259r-t\u0259ssorafam, w\u0259r z'' \u0259gr\u0259wan t\u0259sureft-nasan.\\\"\\n\u018fn\u0259filal
  \u0259n \u0194aysa i Tuma\\n24 Tuma was t\u0259s\u0259mmad\u0259q-net Eknay, w\u0259r
  iha inalkiman win maraw d \u0259\u0161\u0161in assa\u0263a wa tan-d-osa \u0194aysa.
  25 As \u0259nnan nalkiman win i Tuma: \\\"N\u0259nay \u018fm\u0259li!\\\", inn-asan:
  \\\"W\u0259r z-\u0259zz\u0259gz\u0259na\u0263 iket w\u0259r \u0259naya \u0161imijar
  \u0259n n\u0259smar da\u0263 fassan-net, \u0259d\u0259sa\u0263 idaggan-nasan s adad-in,
  \u0259d\u0259sa tasaga-net s \u0259fus-in.\\\" 26 As \u0259gan \u0259ttam adan d\u0259ff\u0259r
  awen, \u0259ddewan-du nalkiman \u0259n \u0194aysa da\u0263 ahan iyyan amaran ih-en
  Tuma da\u0263 taklat ten. Iggaz-du fall-asan \u0194aysa da \u0259harnat t\u0259s\u0259har
  n ahan, ibdad gar-essan, inn-asan: \\\"Ig-awan M\u0259\u0161\u0161ina alxer!\\\"
  27 D\u0259ff\u0259r adi inn'' i Tuma: \\\"Agu adad-nak da, t\u0259sw\u0259da da\u0263
  fassan-in, t\u0259d\u0259sa tasaga-nin s \u0259fus-nak, t\u0259zz\u0259gz\u0259na
  taqqama da w\u0259r t\u0259qqela\u0263 \u0259kaf\u0259r!\\\" 28 Inn-as Tuma: \\\"Ya
  M\u0259\u0161\u0161ina di n \u018fm\u0259li-nin!\\\" 29 Inn-as \u0194aysa: \\\"Kay
  w\u0259r t\u0259zz\u0259gzana har di-t\u0259naya. Iket t\u0259falawist \u0259llan-tu
  d\u0259r-\u0259s win s\u0259r-i \u0259zz\u0259gzannen da w\u0259r di-\u0259nayan!\\\"\\n\u018flm\u0259xsud
  n \u018flk\u0259ttab wa\\n30 Immozal \u0194aysa al\u0263alamaten \u0161iyyad aggotnen
  dat nalkiman-net, mi\u0161an ya w\u0259r s\u0259r-\u0259snat imm\u0259grad \u0259lk\u0259ttab
  wa. 31 Eges arat wa t-ihan, itiwaktab f\u0259l ad t\u0259zz\u0259gz\u0259nam as
  \u0194aysa \u0259nta a imosan \u018flm\u0259six, imos Barar \u0259n M\u0259\u0161\u0161ina,
  t\u0259ss\u0259nam \u0259ntada \u00e2s, as s\u0259r-\u0259s t\u0259zz\u0259gzanam
  ad t\u0259gr\u0259wam t\u0259m\u0259ddurt s es\u0259m-net.\\nYaxya 21\\nAwa d-izdaran
  da\u0263 \u0259lk\u0259ttab wa\\n\u018fn\u0259filal \u0259n \u0194aysa i nalkiman-net
  \u0263ur tama n agaraw\\n2 Sim\u0263on Butros, \u0259d Tuma was t\u0259s\u0259mmad\u0259q-net
  Eknay, \u0259d Natanayel wa n Kana da\u0263 amadal \u0259n Galilaya, \u0259d bararan
  \u0259n Zebeday, d \u0259\u0161\u0161in nalkiman wiyyad, ket-nasan \u0259ddewan.
  3 Inn-asan Sim\u0263on Butros: \\\"Nak ad akka\u0263 edag n abbaz \u0259n kifitan.\\\"
  \u018fnnan-as: \\\"Nakkanay da n\u0259ddew d\u0259r-\u0259k.\\\" \u018fglan, \u0259ggazan
  ta\u0263lalt. Ahad wen w\u0259r da\u0263-as obezan wala.\\n4 As affaw iwar-in \u0194aysa
  t\u0259gadamayt n agaraw, mi\u0161an w\u0259r \u0259ssenan nalkiman-net as \u0259nt''
  awen. 5 Inn-asan \u0194aysa: \\\"Imaran-in, ak abbaz a w\u0259r t\u0259gem wala
  da\u0263 kifitan?\\\" \u018fnnan-as: \\\"Kala\\\". 6 Inn-asan: \\\"\u018fg\u0259rat
  \u0259m\u0259zzezd\u0259r-nawan wa n abbaz \u0259n kifitan f\u0259l aganna wa n
  \u0259\u0263il \u0259n t\u0259\u0263lalt, a tan-t\u0259gr\u0259wam.\\\" \u018fgaran
  \u0259m\u0259zzezd\u0259r-nasan da\u0263 agaraw, t\u0259zzar indar-asan a t-id-\u0259dk\u0259lan,
  f\u0259l awa \u0259gan kifitan win t-\u0259hanen da\u0263 ig\u0259t. 7 T\u0259zzar
  inkar \u0259nalkim wa isannahal \u0194aysa tara inn'' i Butros: \\\"\u018fm\u0259li
  awa!\\\" Da da\u0263 ad isla Sim\u0263on Butros as \u018fm\u0259li awen, \u0259nta
  ad iqqan asalsaw-net wa n afalla, f\u0259las izzaf, t\u0259zzar itaraggat da\u0263
  agaraw. 8 Ama\u1e0dal \u0259n sanatat t\u0259mad n \u0259\u0263il \u0263as a \u0259llanen
  gar-essan \u0259d t\u0259gadamayt n agaraw. \u018fqqiman-du nalkiman win hadatnen
  da\u0263 t\u0259\u0263lalt \u0259rkaban-du d\u0259ff\u0259r-san \u0259m\u0259zzezd\u0259r-nasan,
  idnay kifitan.\\\" 9 \u018fzz\u0259bben-du \u0263as oggan temsay \u0259n t\u0259makaten
  f\u0259l na\u014b\u014bin kifitan, t\u0259nsa t\u0259g\u0259lla den \u0259ntada.
  10 Inn-asan \u0194aysa: \\\"Aw\u0259yat-du arat da\u0263 kifitan win du-tobazam
  \u0259m\u0259r\u0259dda.\\\" 11 Igmad-du Sim\u0263on Butros aman illil-asan s arakab
  n \u0259m\u0259zzezd\u0259r wa \u0259han kifitan. Temeday \u0259d s\u0259mmosat
  t\u0259m\u0259rwen \u0259n kifi \u0259d karad \u0259s kul win zawwarnen a t-\u0259hanen
  mi\u0161an w\u0259r izz\u0259rrat. 12 Inn-asan \u0194aysa: \\\"Ayewat tat\u0161im.\\\"
  Inalkiman w\u0259r tan-iha i ihalan ad iss\u0259st\u0259n \u0194aysa ann-as: \\\"Ma
  t\u0259mosa?\\\" f\u0259las \u0259ssanan as \u018fm\u0259li awen. 13 Ihoz-tan-in
  \u0194aysa, obaz-du tag\u0259lla ikf-asan-tat, ikf-en \u0259ntada kifitan. 14 Taklat
  ta \u0259nta a t\u0259mosat \u0259n\u0259filal wa n karad a d-iga \u0194aysa i nalkiman-net
  wa n a d-inkar da\u0263 n\u0259mm\u0259ttan.\\n\u0194aysa \u0259d Butros\\n15 D\u0259ff\u0259r
  as \u0259t\u0161an inna \u0194aysa i Sim\u0263on Butros: \\\"Sim\u0263on wa n ag
  Yaxya, ak tid\u0259t da a imos as tara ta di-t\u0259ge togar ta di-\u0259gan nalkiman
  win hadatnen?\\\" Inn-as Sim\u0263on: \\\"Ayew \u018fm\u0259li, t\u0259ssana da\u0263
  tara ta dak-\u0259ge.\\\" Inn-as \u0194aysa: \\\"Ag\u0259z ijamaran-in.\\\" 16 Ig-as
  y \u0259s\u0259stan wa igi wa n \u0259\u0161\u0161in inn-as: \\\"Sim\u0263on wa
  n ag Yaxya, ak t\u0259re\u0263-i?\\\" Inn-as Butros: \\\"Ayew \u018fm\u0259li, t\u0259ssana
  da\u0263 tara ta dak-\u0259ge.\\\" Inn-as \u0194aysa: \\\"\u018fqq\u0259l amadan
  n ayf\u0259d-in.\\\" 17 Ig-as y \u0259s\u0259stan wa igi wa n karad tolas inn-as:
  \\\"Sim\u0263on wa n ag Yaxya, ak t\u0259re\u0263-i?\\\" \u018fx\u0161adan man \u0259n
  Sim\u0263on Butros f\u0259las karad igitan das-iga \u0194aysa y \u0259s\u0259stan
  wa. Inn-as: \\\"\u018fm\u0259li, kay a issanan da\u0263 arat kul, t\u0259ssana\u0263
  as \u0259req-qay.\\\" Inn-as \u0194aysa: \\\"\u018fss\u0259n da\u0263 ayf\u0259d-in.
  18 \u018fgg\u0259yye\u0263 \u0259silakana\u0263-ak as harwa t\u0259m\u0259dr\u0259ya\u0263,
  iman-nak as t\u0259lassa tabdoq-nak, t\u0259takka\u0263 edag was tare, mi\u0161an
  \u0259z\u0259l wa da\u0263 za t\u0259qq\u0259la\u0263 a\u0263mar, ad t\u0259zz\u0259la\u0263
  ifassan-nak, assals-ik awedan tabdoq-nak, aw\u0259y-kay s adag as w\u0259r tare\u0263
  iki-net.\\\" 19 Batu ta issoka s\u0259r-\u0259s \u0194aysa \u0259nnu\u0263 \u0259n
  t\u0259mattant ta z-agu Butros s \u0259nta as z'' assaknu adkul wa \u0263ur-\u0259s
  iga M\u0259\u0161\u0161ina. D\u0259ff\u0259r as iga batu ta inna tolas: \\\"\u018flk\u0259m-i\\\"
  20 Iswad-in Butros d\u0259ff\u0259r-\u0259s ogga \u0259nalkim wa isannahal \u0194aysa
  tara ilkam-asan-du. \u018fnalkim wa \u0259nta a isa\u0263\u0263amaran da\u0263 ih\u0259z
  n \u0259dmaran \u0259n \u0194aysa ahad wad tattin imensewan n \u0259mud wa n Akkay.
  Amaran \u0259nta harwa da as kala ad iss\u0259stanan \u0194aysa inn-as: \\\"\u018fm\u0259li,
  ma imos wa kay z'' akkaddalan.\\\" 21 As t-ogga Butros iss\u0259stan \u0194aysa
  inn-as: \\\"\u018fnta za \u018fm\u0259li, m\u0259ni ta\u0263ara-net?\\\" 22 Inn-as
  \u0194aysa: \\\"Kud imos as are\u0263 ad idd\u0259r har d-\u0259qq\u0259la da t\u0259di
  w\u0259r kay-t\u0259qqel. Kay \u0259lk\u0259m-i \u0263as!\\\" 23 Wazawazan salan
  da\u0263 m\u0259zz\u0259gzan \u0259s \u0194aysa as \u0259nalkim wa w\u0259r tu-z-iba.
  \u018fnta \u0194aysa w\u0259rge\u0263 a inna w\u0259r tu-z-iba, t\u0259nna \u0263as
  a iga: \\\"Kud imos as are\u0263 ad idd\u0259r har d-\u0259qq\u0259la da t\u0259di
  w\u0259r-kay t\u0259qqel.\\\"\\nZagzal da\u0263 batu ta t\u0259mosat \u0259lm\u0259xsud
  n \u0259lk\u0259ttab wa\\n24 \u018fnalkim wa \u0259nta iman-net as igg\u0259yyat
  f\u0259l igitan win, iktab-tan. N\u0259ssan as t\u0259g\u0259yya-net tid\u0259t
  a t\u0259mos. 25 \u0194aysa iga aratan wiyyad aggotnen. As igmay awedan d a s\u0259r-san
  ammagrad s iyyan-iyyan, orde\u0263 as \u0259dd\u0259net kul da w\u0259r za taw\u0259y
  \u0259lk\u0259ttaban win z-ikt\u0259b da\u0263 tal\u0263a ta.\"", "\"Nak Simon Ager,
  izaghagh bangor dagh Akal wann Annassara. Tamoudrenin idjrawakate dagh site tad
  anha. Alasasaline in akal wan Lancariche dagh tedj\u00e9 tan afala dagh ataram N''Angleterre.
  kala hegh France, Jersey, Taiwan id japon. Agregh tafransist id Talmant dagh lycee.
  Idjrawagh teghar\u00e9 nin tatazarat dagh chine djegh dagh tas sanatat dagh universit\u00e9
  wan Leeds dagh japon.\\nDagh azal n''awatay was asin IdjarawAagh takard\u00e9 n''alhak
  an taghare nin, Assakayigh sadis oran n''Awal wan Mandarin dagh Taipei, Sadis oran
  iyad djekan almoud an tajapont dagh Osaka, awahin akiman ekal tabouchak djer Chine
  id Hong Kong.\\nDarat adjaraw n''alhak an teghar\u00e9 tatichrayat, adjrawagh assiwad
  an taghare tan tachinoite dagh Taipei, darat awen aghdamagh akoz ellan dagh British
  council. Akhalagh Royaume-Uni dagh wityan n 1998. Ataragh asibdad n mamala dagh
  tadabitin tan mousnat n''afasar an djer awalan, waren deghsel har sihen dagh site,
  darat tekelt ten eghsalahid achagal Nasilmad n''awalan dagh n''akal an Brigton.\\nAwatay
  wan 2008 Atwastagagh dagh achaghal wanin. Tamayit legh ahi asodaran machan waden
  dagh akal an Brigton. Anegh adich awad alwak wan tamotayt yadadjagh edag n''etilam
  achagal koudagh assisaghar waladagh asabouyan an madjrad d awal megh faw akalagh
  wan satsa. inegh koud asewadagh dagh mousnatin dagh Bangor tizar akegh ghor dihend.
  Tamadjradagh Anglais, tafransit tagalwat, tamandarit, tirlandite.\\nAdobegh ad sasikiyagh
  milghaw n''awal wan talmant wan tajapont, wan ecossait, wan Espagnol id manx har
  Esperanto. Itaragh almoud an Taiwan, wan Taruissit, breton, taholondit. Dagh mouziatine,
  timdad tarhanine ghor iswat. Sagdalagh y''issouhagh adjotnen ad timakrasst. Kattabagh
  tissiway an souhagh touwatagh dagh maddan.\\nAfal tarham dagh mouziyate n''aghewanine
  amoss Ager. Izdjarad issim wan saxon \u0112adg\u0101r.\\nTuareg (Tamasheq) translation
  by Zeina Walet on behalf of Parliament tutors\\nInformation about Tuareg | Tower
  of Babel in Tamasheq\\nAbout this site | Omniglot - a potted history | About me
