  oj\u0103r wa isawal\u0103n awal\u0103n w\u0103ren atw\u0103ssan hullan af\u0103l
  w\u0103r-\u0103ddob\u0103t wa isawal\u0103n awal\u0103n-en, ad-\u0103ff\u0103ss\u0103r
