  d''oreya, d''oy\u00edu\\nde padre y muy se\u00f1or m\u00edo: que mete mieu, que
  fai fumu, que fiede''l mocu\\nde puntillas: en puntes, de puntes, en puntera, en
  punteres, de punteres\\nde rechupete, de chuparse los dedos: de rellambese, pa rellambese,
  de llambese los deos\\nde refil\u00f3n: de raspi\u00f3n\\nde reojo: de reg\u00fceyu\\nde
  repente, de golpe: de sutrucu, de s\u00f3pitu, de sopet\u00f3n, de sutaque, de sutevalute,
  d''esmenu, de refundiu, de refundi\u00f3n, de golpe, de baramentu, de baramenta,
  de baramonte, de cal\u00f3n, de trebol\u00e9n, ensembre, de repente,\\nde soslayo:
  al revisgu, de revisgu\\nde tal palo, tal astilla: f\u00edu de cabra, cabra o cabritu\\nde
  tapadillo: a lo roncha, a escondidielles, a les callaes\\nde tiempo en tiempo, de
  tarde en tarde: de ralo en ralo, de tiempu en tiempu\\nde vez en cuando: de xemes
  en cuando, dacuando, alcuando, dacuando en vez, de vez en vez\\nde v\u00eda estrecha,
  de poca monta, de medio pelo: probetayu, de caleya, de poques pretensiones, de curties
  mires, de pocu aquel, de pocu valir, d''a perrona\\ndentro de una semana: de g\u00fcei
  n''ocho d\u00edes, dientro d''una selmana, d''equ\u00ed a una selmana\\ndesempe\u00f1ar
  (un cargo, una funci\u00f3n, un papel): desendolcar, desenvolver, exercer, desempe\u00f1ar,
  facer de\\ndesternillarse de risa: esfarayugase de risa, escostellase de risa, esmorecese
  de risa, estampanase de risa, espa\u00f1ar de risa, mexase de risa, esfacese de
  risa\\ndicho sea de paso: por cierto, pa dicilo too, pa dicilo de verd\u00e1, merez
  la pena dicilo, d\u00edgolo de pasu\\ndichosos los ojos que te ven: c\u00f3mo me
  presta vete, pr\u00e9stame pola vida vete, qu\u00e9 prestoso vete\\ndiente de ajo:
  seruga, seruya, xeruya, diente d''ayu\\ndisparar el flash: chiscar el flax\\ndormido
  como un tronco: atronc\u00e1u\\nechar una bronca: echar el perru, echar un rebroncu,
  echar un repasatu, echar una resma, echar una re\u00f1a, poner pingando\\nechar
