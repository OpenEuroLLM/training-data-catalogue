sample: '["\"D\u00eda del \u00c1rbol\\nEl D\u00eda del \u00c1rbol o Fiesta del \u00c1rbol
  ye un recordatoriu de la importancia de protexer les superficies arbolaes. Los \u00e1rboles,
  ente otros munchos beneficios, tresformen el di\u00f3xidu de carbonu, responsable
  del efeutu invernaderu, en biomasa, embriven los riesgos de hinchente, eviten la
  erosi\u00f3n,...\\nCelebrar en distintes feches, seg\u00fan el pa\u00eds escueye
  un d\u00eda que seya aparente por que los \u00e1rboles enraigonen, seg\u00fan les
  sos condiciones naturales.\\nHistoria[editar | editar la fonte]\\nLa primer vegada
  que se celebr\u00f3 la fiesta del \u00e1rbol nel mundu foi nel a\u00f1u 1805 na
  peque\u00f1a llocalid\u00e1 estreme\u00f1a de Villanueva de la Sierra (C\u00e1ceres),
  una iniciativa promovida pol p\u00e1rrocu del llugar col sofitu entusiasta de tola
  poblaci\u00f3n.[1]\\nEl 30 d''abril de 1899 celebrar nel Parque de Barcelona la
  primera Fiesta del \u00c1rbol entamada pola Socied\u00e1 Amigos de la Fiesta del
  \u00c1rbol (Societat Amics de la Festa de l''Arbre), fundada pol inxenieru de montes
  Rafael Puig i Valls, precursor de la defensa del mediu natural en Calatu\u00f1a.
  Esta socied\u00e1 cre\u00f3 una publicaci\u00f3n, Cr\u00f3nica de la Fiesta del
  \u00c1rbol, que recoy\u00eda les cr\u00f3niques de toles fiestes del \u00e1rbol
  que se celebraben mientres l''a\u00f1u. La primer publicaci\u00f3n del a\u00f1u
  1900 y\u00e1 recueye la referencia d''una ventena de conceyos Catalanes que celebraron
  la fiesta. Con esta celebraci\u00f3n quer\u00eda espublizase la importancia de los
  \u00e1rboles como reguladores del ciclu de l''agua, proteutores contra la erosi\u00f3n,
  y moduladores del paisaxe. A la fiesta asistieron 1500 ne\u00f1os y ne\u00f1es,
  y llant\u00e1ronse 400 pinos. El discursu de Rafael Puig incidi\u00f3 na necesid\u00e1
  de fomentar la riqueza forestal. Tami\u00e9n intervieno l''alcalde Dr Robert qu''allab\u00f3''l
  calter d''utilid\u00e1 y rexeneraci\u00f3n represent\u00e1u nesa fiesta.\\nEl 5
  de xineru de 1915 instaurar en tol territoriu Espa\u00f1ol la Fiesta del \u00c1rbol,
  per aciu Real Orde del Ministeriu de la Gobernaci\u00f3n,,[2] y una Real Orde del
  Ministeriu de Fomentu, obligando a cada conceyu a afitar el d\u00eda de celebraci\u00f3n
  per aciu sesi\u00f3n ordinaria del plenu municipal.[3]\\nEl D\u00eda Internacional
  de los Montes, el D\u00eda Mundial del \u00c1rbol y tami\u00e9n llam\u00e1u enantes
  el D\u00eda Forestal Mundial foi primeramente un encamientu del Congresu Forestal
  Mundial que se celebr\u00f3 en Roma en 1969. Esti encamientu foi aceptada pola Organizaci\u00f3n
  de Naciones Xun\u00edes pa l''Agricultura y l''Alimentaci\u00f3n (FAO) en 1971.
  El d\u00eda escoy\u00edu foi''l 21 de marzu que coincide cola entrada de la primavera
  nel Hemisferiu Boreal y cola del seronda nel Austral.\\nD\u00eda en que se celebra
  seg\u00fan el pa\u00eds[editar | editar la fonte]\\nCada pa\u00eds celebra''l d\u00eda
  del \u00e1rbol seg\u00fan les sos condiciones naturales, cuando terminen los fr\u00edos
  o nel Caribe, qu''apenes hai diferencies de temperatura ente''l branu y l''iviernu,
  escu\u00e9yese l''entamu del branu porque y\u00e1 empez\u00f3 la temporada d''ag\u00fces
  y eso facilita qu''enraigonen los \u00e1rboles reci\u00e9n plantaos.\\n- N''Arxentina
  cel\u00e9brase''l 29 d''agostu. Esta celebraci\u00f3n realizar por primer vegada
  en 1901, depu\u00e9s de qu''el Conseyu Nacional d''Educaci\u00f3n establecer el
  29 d''agostu de 1900, gracies a la iniciativa d''Estanislao Zeballos. Dende''l sieglu
  XIX promoviose l''activid\u00e1 forestal, siendo''l so principal impulsor Domingo
  Faustino Sarmiento (presidente de 1868 a 1874), quien manifest\u00f3:\\n- \u00abEl
  cultivu de los \u00e1rboles convien a un pa\u00eds pastoril como''l nuesu, non y\u00e1
  porque la arboricultura x\u00fanese perfectamente a la ganader\u00eda, sin\u00f3n
  que tien de considerase como''l so complementu indispensable. La Pampa ye como la
  nuesa Rep\u00fablica, balta rasa. Ye la tela na qu''hai de bordarse una naci\u00f3n.
  Ye necesariu escribir sobre ella: \u00a1\u00c1rboles! \u00a1Llanten \u00e1rboles!\u00bb.[4]\\n-
  En Bolivia cel\u00e9brase''l 1\u00b0 d''ochobre, y nes instituciones ambientales
  tantu como nos colexos realicen campa\u00f1es. Na ciud\u00e1 de Santa Cruz de la
  Sierra, cuntar con una Secretaria Departamental de Mediu Ambiente y Desarrollu Sostenible,
  que cunta con una \u00e1rea dedicada a la educaci\u00f3n ambiental, que ye''l Centru
  d''Educaci\u00f3n Ambiental (C.Y.A.).\\n- En Chile cel\u00e9brase''l 6 de xunetu.\\n-
  En Cuba cel\u00e9brase''l 21 de xunu.\\n- N''Hondures cel\u00e9brase''l 30 de mayu.\\n-
  En China, el d\u00eda del \u00e1rbol celebra''l 12 de marzu y nes escueles faen
  campa\u00f1es por que los estudiantes llanten \u00e1rboles esti d\u00eda.\\n- En
  Colombia tami\u00e9n se celebra''l d\u00eda del \u00e1rbol el 29 d''abril por un
  decretu del a\u00f1u 1941.\\n- En Costa Rica cel\u00e9brase''l 15 de xunu. El d\u00eda
  crear el presidente Alfredo Gonz\u00e1lez Flores, per aciu el Decretu Executivu
  N\u00b0 14 del 25 de mayu de 1915, polo cual consid\u00e9rase como una de les primeres
  lleis de calter ambientalista del pa\u00eds.[5]\\n- N''Ecuador cel\u00e9brase''l
  22 de mayu.\\n- En El Salvador cel\u00e9brase''l 28 de xunu.\\n- N''Espa\u00f1a
  suelse celebrar al empar qu''el D\u00eda Internacional de los Montes, el 21 de marzu,
  anque fiel al esp\u00edritu del decretu de 1915 qu''oblig\u00f3 a celebrar la Fiesta
  del \u00c1rbol en toa Espa\u00f1a, cada conceyu y colectivu entama''l so D\u00eda
  del \u00c1rbol dende febreru hasta principios de mayu. En Villanueva de la Sierra
  (C\u00e1ceres), llugar onde se celebr\u00f3 la primer Fiesta del \u00c1rbol, sigue
  celebr\u00e1ndose, como naquella ocasi\u00f3n, el martes d''Antroxu y ye un d\u00eda
  grande nel calendariu festivu villanovense.\\nComo exemplu de compromisu cola naturaleza,
  el peque\u00f1u pueblu de Pescueza, de tan solo 180 habitantes, entama toles primaveres
  una gran plant\u00edu de encinas, lo que llamen el Festivalino promovido pol so
  conceyu, la Fundaci\u00f3n M\u00e1s \u00c1rboles y la participaci\u00f3n ciudadana,
  onde se xunten dellos miles de persones pa repoblar zones que s''atopen desnudes
  y que y\u00e1 t\u00e1n reponiendo la vida. Tou ello envueltu nun ambiente l\u00fadico
  de fiesta, d''allegr\u00eda, de m\u00fasica y d''anuevo.[6] - En Guatemala cel\u00e9brase''l
  22 de mayu. El decretu 30-2003 contempla que''l Ministeriu d''Educaci\u00f3n, en
