  cristianu\\nel otro d\u00eda: esti d\u00eda, l''otru d\u00eda\\nempezar la casa
  por el tejado: poner el carru delantre los g\u00fces\\nen com\u00fan: en comu\u00f1a,
  a comu\u00f1a, de mancom\u00fan\\nen conjunto: en xunto, en conxuntu\\nen cueros,
  en pelotas: en porreta, en pures, en cueros, en cueros vivos, en pelota, en porrica,
  en porriques, en pulguina, coritu\\nen el fondo: no fondero, fonderamente, nel fonduen
  hilera, en fila, en l\u00ednea: en filera, en fila, en ringla, en ringlera, en llinia,
  enfil\u00e1u, enfiler\u00e1u, afiler\u00e1u, arringl\u00e1u, arringler\u00e1u, enringl\u00e1u,
  enringler\u00e1u, allini\u00e1u\"", "\"You are currently browsing the category archive
  for the \u2018Llu\u00eds Portal\u2019 category.\\nLlu\u00eds Portal y la Guerra
  Civil\\n\u00abEN \u201cOH 36!\u201d FALO DE LA CONDUCTA HUMANA SOMETIDA A PRESI\u00d3N,
  DEL HORROR, DEL ERROR QUE YE TOA GUERRA\u00bb\\nXos\u00e9 Llu\u00eds Campal Fern\u00e1ndez\\nRIDEA\\nL\u2019escritor
  maliayu Llu\u00eds Portal Hevia (Villaviciosa, 1964) cultiva dende cuantay\u00e1
  la prosa period\u00edstica y la narrativa de ficci\u00f3n con especial curi\u00e1u
  y un enfotu dignificador mui poco reconoc\u00edu nos estamentos \u2018oficiosos\u2019
  del asturianismu. Periodista nel diariu La Voz de Asturias, Portal ye autor d\u2019un
  valoratible llibru de cuentos entitul\u00e1u Tr\u00f3fimo y Radam\u00e9s (Villaviciosa,
  Caveda y Nava, 1991), asina como del document\u00e1u ensayu bio-bibliogr\u00e1ficu
  Francisco Balb\u00edn de Villaverde (Xiqu\u00edn de Villaviciosa) (Villaviciosa,
  Cubera, 1995) y del trabayu etnogr\u00e1ficu Secretos de Pandenes (Uvi\u00e9u, Trabe,
  2006). Collaborador con poemes y proses creatives en revistes como Lletres Asturianes
  o Albentestate, ye autor de m\u00e1s de mediu millar d\u2019art\u00edculos d\u2019opini\u00f3n.
  Agora debuta nel tarr\u00e9n teatral al ganar el premiu \u201cUvi\u00e9u\u201d,
  na estaya dram\u00e1tica, cola pieza Oh 36!\\nPregunta. \u00bfQu\u00e9 quixo cuntar
  nesta primer obra teatral de s\u00f3?\\nRespuesta. Falo de les esperiencies viv\u00edes
  por una familia asturiana metanos de la guerra civil. Falo de la conducta humana
  sometida a presi\u00f3n. Del horror. Del error que representa tou conflictu b\u00e9licu.
  De los aspectos cotidianos que suceden durante\u2019l trescursu d\u2019una guerra:
  porque la vida sigue baxo les bombes y demientres la muerte. Tami\u00e9n l\u2019humor.
  De lo irreal de determinaos episodios que tienen llugar durante una guerra. De los
  tintes subrealistes de la propia esistencia.\\nP. \u00bfEl pesu hest\u00f3ricu nun
  ye una ll\u00e1bana pal discursu lliterariu, y m\u00e1s si lo que ta decidi\u00e9ndose
  ye\u2019l sent\u00edu d\u2019una guerra civil?\\nR. Entiendo que non. Nun cuento
  la guerra, sin\u00f3n daqu\u00e9 que pasa durante esa guerra, que ye diferente.
  La conducta humana sometida a presi\u00f3n aporta un material perinteresante dende\u2019l
  puntu de vista lliterariu. Nun se trata d\u2019una obra panfletaria. Nun pretende
  ideoloxizar. Nun pretende resolver inc\u00f3gnites hest\u00f3riques, nin esclariar
  qu\u00e9 bandu yera\u2019l bonu nin cu\u00e1lu\u2019l malu.\\nP. \u00bfQu\u00e9
  materiales privilex\u00f3 nel procesu de documentaci\u00f3n y nel posterior d\u2019escritura?\\nR.
  La obra insp\u00edrase na esperiencia del m\u00e9dicu y escritor billing\u00fce
  Carlos de la Concha (Villaviciosa, 1877 \u2013 Xix\u00f3n, 1965). \u00c9sti construy\u00f3
  un furacu na so propia casa pa escondese cuando diba a buscalu\u2019l so enemigu
  pol\u00edticu, el dirixente anarquista Crist\u00f3bal Cano. Supi de los detalles
  d\u2019esta hestoria gracies a un diariu escritu pol propiu De la Concha \u2013pariente,
  por ciertu, del actual director de la RAE, V\u00edctor Garc\u00eda de la Concha\u2013
  al que tuvi parcialmente accesu. Tami\u00e9n consult\u00e9 llibros sobre la guerra
  civil y a persones que la vivieron en primer persona o de forma diferida.\\nP. \u00bfCu\u00e1nto
  dur\u00f3 tola fase de conceici\u00f3n?\\nR. Varios meses, ya que llegu\u00e9 a
  escribila dos veces. La primera versi\u00f3n yera un testu ensin munchos anclaxes
  cola realid\u00e1, la segunda y definitiva arriquezse con abondos detalles y an\u00e9cdotes
  reales estra\u00edos del diariu y los testimonios concretos antes citaos.\\nP. \u00bfAtop\u00f3se
  con torgues de dalg\u00fan tipu na construcci\u00f3n del testu?\\nR. Preocup\u00e1benme
  dos cuestiones: una, atopar un llinguaxe estrem\u00e1u que ficiera creyible la esistencia
  de personaxes de mui diferente estractu social. La otra, consiguir que les pincelaes
  d\u2019humor qu\u2019incluyo nun tapecieran el drama sobre la que xira la obra.
  Espero habelo llograo.\\nP. \u00bfQu\u00e9 se pue facer en teatru que non se puea
  facer en poes\u00eda, narrativa y ensayu?\\nR. La posibilid\u00e1 de representalu.
  El teatru sigue teniendo un atractivu evidente pal p\u00fablicu: hai una catarvada
  de grupos y obres en cartel, y ello porque esiste un p\u00fablicu que aprecia\u2019l
  llinguaxe lliterariu y la cercan\u00eda de la representaci\u00f3n. Eso nun lo tienen
  los otros x\u00e9neros.\\nP. \u00bfPiensa na representaci\u00f3n cuando escribe
  pa la escena?\\nR. S\u00ed, claro, y \u00e9si ye \u00fan de los elementos que valor\u00f3\u2019l
  xur\u00e1u del premiu \u201cUvi\u00e9u\u201d, la facilid\u00e1 pa poner n\u2019escena
  Oh 36! Tienes que pensar nello porque la representaci\u00f3n ye l\u2019oxetivu \u00faltimu
  de cualquier autor teatral. Nun s\u2019escribe teatru pa publicar, sin\u00f3n pa
  representar.\\nP. \u00bfC\u00f3mo querr\u00eda que fuera\u2019l montaxe?\\nR. Prestar\u00edame
  que cayera en manes d\u2019un grupu avez\u00e1u a facer drama, pero creo que nun
  habr\u00e1 problema porque hai abondes compa\u00f1\u00edes que puen facer una bona
  puesta n\u2019escena.\\nP. \u00bfCu\u00e1los ser\u00eden los referentes dramat\u00farxicos
  de Llu\u00eds Portal como espeutador y como escritor de teatru?\\nR. Tengo que reconocer
  que me presta m\u00e1s ver que lleer teatru, quici\u00e1s pola raz\u00f3n qu\u2019apuntaba
  anantes, magar qu\u2019hai llectures que resulten obligaes pa quien escribe. Per
  otra parte, prefiero una triba de teatru qu\u2019apueste por f\u00f3rmules cl\u00e1siques,
  nun me gusten en xeneral los proyectos escesivamente vanguardistes. Tampocu soi
  fan del teatru costumista asturianu, y observo los proyectos de revitalizaci\u00f3n
  o modernizaci\u00f3n con inter\u00e9s pero con ciertu escepticismu.\\nP. \u00bfYe
  la guerra civil esa met\u00e1fora may\u00fascula, espeyu d\u2019una identid\u00e1
  y les sos xabaces contradicciones, o ye nam\u00e1i un paisaxe pa la traxedia nacional?\\nR.
  Nun me preocupa tanto la guerra como los comportamientos humanos. Utilizo\u2019l
  conflictu como un tel\u00f3n de fondo sobre\u2019l que poder enfrentar al ser humanu
  coles sos propies miseries. S\u00ed, la guerra ye la met\u00e1fora d\u2019un mundu
  interior en conflictu y d\u2019unos equilibrios sociales qu\u2019esgarallen ante
  la tensi\u00f3n que xenera.\\nP. \u00bfTeatru realista, teatru simbolista o teatru
  d\u2019idees pa sopelexar la conciencia?\\nR. Pretendo tocar la conciencia de la
  xente ensin facer proselitismu ideol\u00f3xicu. Esta obra tien abondo de simb\u00f3lico
  ya que la realid\u00e1 pres\u00e9ntase como un simple decor\u00e1u.\\nAvisu a navegantes:\\nEl
  programa \u201cPieces\u201d, magazine cultural de la TPA entrevist\u00f3 a Llu\u00eds
  Portal acerca de la so \u00faltima obra de teatru, Poison. La entrevista va emitise
  el pr\u00f3simu s\u00e1badu, 24 de xunetu, a les 12:15 (hora d\u2019emisi\u00f3n
  del programa).\"", "\"Configuraci\u00f3n electr\u00f3nica\\nN\u00f3mase configuraci\u00f3n
  electr\u00f3nica, en f\u00edsica at\u00f3mica y qu\u00edmica cu\u00e1ntica, a la
  distribuci\u00f3n de los electrones d''un \u00e1tomu o mol\u00e9cula (o otra estructura
  f\u00edsica) n''orbitales at\u00f3micos o moleculares[1].\\nLes configuraciones
  electr\u00f3niques describen a cada electr\u00f3n como si se moviera de forma independiente
  n\u00fan orbital, n\u00fan campu mediu cre\u00e1u por tolos otros orbitales. Les
  configuraciones descr\u00edbense, en t\u00e9rminos matem\u00e1ticos, por determinantes
  de Slater o funciones d''est\u00e1u de configuraci\u00f3n.\\nAcordies coles lleis
  de la mec\u00e1nica cu\u00e1ntica, nos sistemes con un \u00fanicu electr\u00f3n
  hai una enerx\u00eda asociada con cada configuraci\u00f3n electr\u00f3nica. Am\u00e1s,
  si se dan determinaes condiciones, los electrones son capaces de movese d''una configuraci\u00f3n
  a otra emitiendo o absorbiendo un cuantu d''enerx\u00eda en forma de fot\u00f3n.\\nEl
  conocimientu de la configuraci\u00f3n electr\u00f3nica de los diferentes \u00e1tomos
  ye \u00fatil pa entender la estructura de la tabla peri\u00f3dica d''elementos,
  y tami\u00e9n pa describir les xuniones qu\u00edmicas que mantienen los \u00e1tomos
  xun\u00edos. Ye \u00fatil, finalmente, p''axudar a desplicar les propiedaes de los
  l\u00e1seres y los semiconductores.\\n\u00cdndiz\\nCapes y subcapes electr\u00f3niques[editar
  | editar la fonte]\\nLa configuraci\u00f3n electr\u00f3nica foi concebida dientru
  del modelu te\u00f3ricu d''estructura del \u00e1tomu de Bohr, y, magar los avances
  na comprensi\u00f3n de la naturaleza cu\u00e1ntica de los electrones, ent\u00e1
  ye habitual falar de capes y subcapes orbitales.\\nUna capa electr\u00f3nica ye''l
  conxuntu d''estaos cu\u00e1nticos posibles que comparten el mesmu n\u00famberu cu\u00e1nticu
  principal, n (el n\u00famberu que va delantre de la lletra na notaci\u00f3n orbital)
  que puede ser ocupado por electrones. Cualisquier capa con un n\u00famberu n puede
  agospiar 2n2 electrones. Esto ye, na primer capa pueden acomodase dos, na segunda
  8 y na tercera 18. L''aumentu del factor de 2 debese a que los estaos cu\u00e1nticos
  posibles d\u00f3blense pola esistencia del esp\u00edn: cada orbital at\u00f3micu
  almite dos electrones id\u00e9nticos que tengan un esp\u00edn opuestu, \u00fan con
  un esp\u00edn +1/2 (represent\u00e1u xeneralmente como una flecha qu''apunta p''arriba)
  y otru con un esp\u00edn -1/2 (represent\u00e1u por una flecha qu''apunta p''abaxu).\\nUna
  subcapa electr\u00f3nica ye''l conxuntu d''estaos cu\u00e1nticos posibles que comparten,
  dientro d''una capa, el mesmu n\u00famberu cu\u00e1nticu azimutal. Los valores \u2113
  = 0, 1, 2, 3 correspuenden, respectivamente, a los niveles s, p, d, and f labels.
  Asina, por exemplu, la subcapa 3d tien n = 3 y \u2113 = 2. El n\u00famberu m\u00e1ximu
  d''electrones que pueden asitiase nuna capa def\u00ednelu la espresi\u00f3n 2(2\u2113+1).
  Acordies con ella, habr\u00e1 dos electrones nuna subcapa s , seis nuna subcapa
  p , 10 nuna subcapa d y 14 nuna subcapa f .\\nEl n\u00famberu d''electrones que
  pueden ocupar cada capa y subcapa obti\u00e9nense a partir de les ecuaciones de
  la mec\u00e1nica cu\u00e1ntica; en particular del principiu d''exclusi\u00f3n de
  Pauli, qu''establez que ye imposible que dos electrones del mesmu \u00e1tomu tengan
  los mesmos valores de los cuatro n\u00famberos cu\u00e1nticos[2].\\nEnerx\u00eda.
  Est\u00e1u estacionariu y est\u00e1u escit\u00e1u[editar | editar la fonte]\\nLa
  enerx\u00eda asociada a un electr\u00f3n ye la que tien nel so orbital. La enerx\u00eda
  d''una configuraci\u00f3n tien, a menudu, un valor aprosim\u00e1u al sumatoriu de
  la enerx\u00eda de cada electr\u00f3n, descart\u00e1ndose nel c\u00e1lculu les interacciones
  ente electrones. La configuraci\u00f3n que correspuende al nivel m\u00e1s baxu d''enerx\u00eda
  ll\u00e1mase est\u00e1u estacionariu del \u00e1tomu; cualisquier otra configuraci\u00f3n
  ye un est\u00e1u escit\u00e1u. Asina, por exemplu, l''est\u00e1u estacionariu del
  \u00e1tomu de sodiu ye la configuraci\u00f3n 1s22s22p63s1, como puede deducise f\u00e1cilmente
  de l''aplicaci\u00f3n del principiu d''Aufbau. El primer est\u00e1u escit\u00e1u
  obti\u00e9nse llevando un electr\u00f3n del orbital 3s al 3p pa obtener la configuraci\u00f3n
  1s22s22p63p, conocida abreviadamente como nivel 3p del \u00e1tomu de sodiu. Los
  \u00e1tomos pueden pasar d''una configuraci\u00f3n a otra emitiendo o absorbiendo
  enerx\u00eda. Nuna ll\u00e1mpara de vapor de sodiu, por exemplu, los \u00e1tomos
  de sodiu son escitaos al so nivel 3p por una descarga el\u00e9ctrica, y vuelven
  a la so configuraci\u00f3n estacionaria emitiendo lluz mariella con una llonxit\u00fa
  d''onda de 589 nm.\\nPor regla xeneral, la escitaci\u00f3n d''electrones de valencia
  (como''l 3s del sodiu) rellaci\u00f3nase con enerx\u00eda en forma de fotones de
  lluz visible o ultraviola. Ye posible tami\u00e9n escitar los electrones centrales,
  pero fai falta muncha m\u00e1s enerx\u00eda, xeneralmente correspondientes a fotones
  de rayos X. Con ellos podr\u00edase, nel exemplu cit\u00e1u, escitar un electr\u00f3n
  2p al nivel 3s pa formar la configuraci\u00f3n 1s22s22p53s2.\\nNel restu d''esti
  art\u00edculu falaremos, sacante que se diga lo contrariu, del est\u00e1u estacionariu
  de los \u00e1tomos o mol\u00e9cules, consider\u00e1u xeneralmente como \\\"la\\\"
  so configuraci\u00f3n habitual.\\nNotaci\u00f3n[editar | editar la fonte]\\nF\u00edsicos
  y qu\u00edmicos empleguen una notaci\u00f3n est\u00e1ndar pa se\u00f1alar les configuraciones
  electr\u00f3niques de los \u00e1tomos y les mol\u00e9cules. Nel casu de los \u00e1tomos,
  la notaci\u00f3n consiste nuna secuencia de les diverses subcapes at\u00f3miques
  (por exemplu, al f\u00f3sforu correspu\u00e9nde-y la secuencia 1s, 2s, 2p, 3s, 3p)
  na qu''el n\u00famberu d''electrones asign\u00e1u a cada subcapa aparez indic\u00e1u
  en forma de super\u00edndiz. Asina, l''hidr\u00f3xenu tien un electr\u00f3n nel
  orbital s de la primer capa; poro, la so configuraci\u00f3n escr\u00edbese 1s1.
  El litiu, pela so banda, tien dos electrones na subcapa 1s y \u00fan na 2s, y la
  so configuraci\u00f3n escr\u00edbese 1s2 2s1 . El f\u00f3sforu, nesta notaci\u00f3n,
  escr\u00edbese asina: 1s2 2s2 2p6 3s2 3p3.\\nEsti sistema ye abegosu pa emplegalu
  pa notar \u00e1tomos con munchos electrones, lo que llev\u00f3 a la creaci\u00f3n
  d''un sistema de notaci\u00f3n abreviada. La configuraci\u00f3n electr\u00f3nica
  espresase como la xuni\u00f3n de los electrones centrales, equivalentes a los del
  gas noble del periodu precedente, y los electrones de valencia, una y bones los
  elementos d''un mesmu periodu difer\u00e9nciense nam\u00e1i nel n\u00famberu d''electrones
  de les \u00faltimes subcapes. El f\u00f3sforu, por exemplu, ta nel tercer periodu,
  y difer\u00e9nciase del ne\u00f3n, el gas noble del segundu periodu, de configuraci\u00f3n
  1s2 2s2 2p6, nam\u00e1i pola presencia d''una tercer capa. La parte de la so configuraci\u00f3n
  igual a la del ne\u00f3n abreviase como [Ne], y eso permite que pueda notase''l
  f\u00f3sforu como [Ne] 3s2 3p3 en cuenta de facelo per estensu. Esta convenci\u00f3n
  ye \u00fatil, una y bones son los electrones de la capa m\u00e1s esterna los que
  m\u00e1s influin nes caracter\u00edstiques qu\u00edmiques d''un elementu.\\nSicas\u00ed,
  l''orde d''escritura de los orbitales nun ta completamente afit\u00e1u, porque nam\u00e1i
  les ocupaciones orbitales tienen significaci\u00f3n f\u00edsica. Por exemplu, la
  configuraci\u00f3n electr\u00f3nica del titaniu n''est\u00e1u basal puede escribise
  [Ar] 4s2 3d2 o [Ar] 3d2 4s2. La primer notaci\u00f3n sigue l''orde, bas\u00e1u na
  regla de Madelung pa la configuraci\u00f3n de los \u00e1tomos neutros: 4s enll\u00e9nase
  enantes de 3d na secuencia Ar, K, Ca, Sc, Ti. La segunda notaci\u00f3n axunta tolos
  orbitales col mesmu valor de n'', y correspuende al orde espectrosc\u00f3picu de
  les enerx\u00edes orbitales, que representa el contrariu del orde nel que los electrones
  son arrancaos d''un \u00e1tomu determin\u00e1u pa formar iones positivos: 3d enll\u00e9nase
  enantes de 4s na secuencia Ti4+, Ti3+, Ti2+, Ti+, Ti.\\nTampoco ye obligatorio escribir
  1 nel super\u00edndiz d''una subcapa ocupada nam\u00e1i por un electr\u00f3n; asina,
  l''aluminiu puede escribise [Ne] 3s2 3p1 o [Ne] 3s2 3p. Ye habitual, tami\u00e9n,
  ver les lletres de los niveles orbitales (s, p, d, f) escritos en lletra it\u00e1lica
  o cursiva, magar que la Uni\u00f3n Internacional de Qu\u00edmica Pura y Aplicada
  recomienda un tipu de lletra normal. L''orixe de les lletres utilizaes alcu\u00e9ntrase
  n\u00fan sistema, angua\u00f1o desanici\u00e1u por obsoletu, de categorizaci\u00f3n
  de les ll\u00ednies espectrales como aguda (sharp), principal (principal), difusa
  (diffuse) y fundamental (fine) a partir de la estructura que presenten a la observaci\u00f3n.
  El so usu modernu indica orbitales con un n\u00famberu cu\u00e1nticu azimutal, l,
  de 0, 1, 2 y 3 respeutivamente. Tres de la \\\"f\\\" la secuencia contin\u00faase
  alfab\u00e9ticamente, cola \\\"g\\\", \\\"h\\\", \\\"i\\\"... (l = 4, 5, 6...).
  Magar que ye poco frecuente, porque los orbitales de l 7 son poco utilizaos, caso
  de necesitar escribise s\u00e1ltase la lletra \\\"j\\\"[3][4].\\nLa configuraci\u00f3n
  electr\u00f3nica de les mol\u00e9cules escr\u00edbese de forma asemeyada, cola \u00fanica
  diferencia de qu''en cuenta de los niveles orbitales at\u00f3micos \u00fasense los
  niveles orbitales moleculares.\\nAplicaciones[editar | editar la fonte]\\nLa utilid\u00e1
  m\u00e1s estendida de les configuraciones electr\u00f3niques ye que permite la racionalizaci\u00f3n
  de les propiedaes qu\u00edmicas, neto en qu\u00edmica org\u00e1nica que na inorg\u00e1nica.
  Dafechamente, les configuraciones electr\u00f3niques, xunto con una forma simplificada
  de la teor\u00eda orbital molecular, tienen convert\u00edose nel equivalente modernu
  del conceptu de valencia, y \u00fasense pa describir el n\u00famberu y tipo de les
  xuniones qu\u00edmiques qu''un \u00e1tomu puede formar.\\nEsti enfoque ye llev\u00e1u
  un pasu m\u00e1s all\u00e1 na qu\u00edmica computacional, que tenta siempre de facer
  estimaciones cuantitatives de les propiedaes qu\u00edmiques. Demientres munchos
  a\u00f1os la mayor\u00eda d''esos c\u00e1lculos usaben una aprosimaci\u00f3n LCAO
  (sigles de \\\"combinaci\u00f3n lineal d''orbitales at\u00f3micos\\\"), usando un
  conxuntu de bases d''orbitales at\u00f3micos grande y complexu como puntu de partida.
  L''\u00faltimu pasu nesos c\u00e1lculos ye l''asignaci\u00f3n d''electrones a los
  diversos orbitales moleculares acordies col principiu d''Aufbau. Nostante, non toos
  los m\u00e9todos de la qu\u00edmica computacional t\u00e1n basaos na configuraci\u00f3n
  electr\u00f3nica; la teor\u00eda de la densid\u00e1 funcional, por exemplu, nun
  la utiliza.\\nNos \u00e1tomos o mol\u00e9cules con m\u00e1s d''un electr\u00f3n
  el movimientu de los electrones correlaci\u00f3nase el\u00e9ctricamente, polo que
  la configuraci\u00f3n electr\u00f3nica nun ye exacta: neces\u00edtense un n\u00famberu
  munchu mayor de configuraciones electr\u00f3niques pa describir esactamente cualisquier
  sistema con m\u00e1s d''un electr\u00f3n, y nun puede asociase deng\u00fan nivel
  d''enerx\u00eda con una \u00fanica configuraci\u00f3n. Sicas\u00ed, la funci\u00f3n
  de les ondes electr\u00f3niques suele correspondese con un n\u00famberu perpeque\u00f1u
  de configuraciones, polo qu''el conceptu de configuraci\u00f3n electr\u00f3nica
  sigue siendo b\u00e1sicu pa conocer los sistemes con varios electrones.\\nOtra aplicaci\u00f3n
  fundamental de la configuraci\u00f3n electr\u00f3nica ye la intepretaci\u00f3n del
  espectru d''emisi\u00f3n. Pa esti fin ye necesario complementar la configuraci\u00f3n
  electr\u00f3nica con \u00fan o m\u00e1s s\u00edmbolos de t\u00e9rminu, que describen
  los diferentes niveles d''enerx\u00eda disponibles pa cada \u00e1tomu. Los s\u00edmbolos
  de t\u00e9rminu pueden ser calculaos pa cada configuraci\u00f3n electr\u00f3nica,
  y non nam\u00e1i pa los estaos estacionarios o basales qu''aparecen llistaos en
  tables, magar que non se pueden ver, na pr\u00e1ctica, tolos niveles d''enerx\u00eda.
  Foi al travi\u00e9s del an\u00e1lisis del espectru d''emisi\u00f3n como se determin\u00f3
  experimentalmente la configuraci\u00f3n electr\u00f3nica de los elementos nel so
  est\u00e1u estacionariu.\\nReferencies[editar | editar la fonte]\\n- \\\"Configuraci\u00f3n
  electr\u00f3nica\\\" nel Compendium of Chemical Terminology (the \\\"Gold Book\\\"),
  IUPAC (2\u00aa ed. de 1997, revisada en 2006).\\n- \\\"Principiu d''exclusi\u00f3n
