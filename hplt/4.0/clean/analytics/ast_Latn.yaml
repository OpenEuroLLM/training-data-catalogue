  1. INTRODUCCI\u00d3N Uno de los aspectos relevantes para la mejora del sistema ...
  Siguir lliendo \u00bb\"", "\"Nes \u00faltimes dos selmanes hebo tres sucesos d\u2019importancia
  mui distinta y tami\u00e9n d\u2019estremada naturaleza: nuevos casos de corrupci\u00f3n,
  l\u2019apaici\u00f3n estelar d\u2019una muyer moza nun congresu de la internacional
  socialista y la ceremonia de los premios Goya. Con una cenciella g\u00fceyada nun
  paecen tener muncha rellaci\u00f3n pero, si lo analizamos con procuru, non como
  custiones pol\u00edtiques o econ\u00f3miques, sinon embaxo a un anal\u00eds que
  podr\u00edamos nomar \u201csociol\u00f3xicu\u201d, algamaremos pescanciar dellos
  rasgos de la socied\u00e1 na que vivimos.\\nYe bien interesante siguir les opiniones
  de la xente te\u00f3ricamente m\u00e1s informao d\u2019estos tres asuntos, esto
  ye, los principales peri\u00f3dicos y programes d\u2019opini\u00f3n, d\u2019una
  banda, ya\u2019l ruxirrux de les dos o tres principales redes sociales d\u2019otra,
  atendiendo pa los principales grupos d\u2019alderique y pa los blogues de persones
  significaes.\\nEl primer asuntu podemos asitialu nel \u201ccasu B\u00e1rcenas\u201d
  y nel \u201ccasu Urdangar\u00edn\u201d. Nun ye mester desplicalos muncho: el saqu\u00e9u
  de les arques p\u00fabliques nun casu y la rede de comisiones privaes y contrataciones
  tami\u00e9n p\u00fabliques nel otru. Pertr\u00e1s, la situaci\u00f3n de la monarqu\u00eda
  y la financiaci\u00f3n de dirixentes del Partido Popular. Y siguin los asuntos de
  los espedientes de regulaci\u00f3n d\u2019emplegu andaluces, la cueva d\u2019Al\u00ed
  Bab\u00e1 valenciana, les cuentes catalano-suices, la marea asturiana ya unos cuantos
  m\u00e1s, pero son los dos aquellos los que me van permitir facer la reflex\u00f3n
  que pretendo.\\nEl segundu asuntu ye l\u2019aparatosa entrada na opini\u00f3n p\u00fablica
  d\u2019una rapaza de nome Beatriz Talag\u00f3n, secretaria internacional de les
  mocedaes socialistes. Xubi\u00f3 a la tarima del congresu de Cascais p\u2019afe\u00e1-ys
  a los m\u00e1s altos dirixentes de la internacional socialista les sos contradicciones,
  entrug\u00e1ndo c\u00f3mo yera posible recrear la revoluci\u00f3n dende un hotel
  de cincu estrelles. A los pocos d\u00edes present\u00e1rase na manifestaci\u00f3n
  de Madrid contra los desahucios del brazu de L\u00f3pez Aguilar, que fora ministru
  de xusticia con Rodr\u00edguez Zapatero. Un grupu importante de manifestantes ech\u00e1ralos
  d\u2019ell\u00ed, marchando protex\u00edos pola polic\u00eda nacional ente glay\u00edos
  ya insultos. Dempu\u00e9s d\u2019eso saliera en delles cadenes de televisi\u00f3n
  y fuera particularmente violenta una discusi\u00f3n que caltuvo cola portavoz de
  los convocantes de la manifestaci\u00f3n, delantre d\u2019unos cuantos contertulios.\\nYa\u2019l
  tercer asuntu ye\u2019l discutiniu al rodiu les intervenciones revindicatives que
  diez o doce actores fixeran na ceremonia d\u2019entrega de los premios Goya a les
  pel\u00edcules espa\u00f1oles del 2012.\\nEstes tres situaciones tienen una cosa
  en com\u00fan que sopelexa c\u00f3mo funciona la nuesa socied\u00e1. Vamos per estayes.
  Los correos ellectr\u00f3nicos qu\u2019inculpen al secretariu Garc\u00eda Revenga,
  a la infanta Cristina y, nos \u00faltimos d\u00edes, al mesmu rei, son vistos de
  dos maneres. Pa una parte los opinantes los correos son verd\u00e1 y preben la esistencia
  d\u2019una rede tex\u00eda a la solombra de la corona. Pero pa otra parte, el fechu
  de que Diego Torres, el sociu d\u2019Urdangar\u00edn qu\u2019agora pon en marcha\u2019l
  ventilador, seya un delincuente, dexa n\u2019entedicho les sos revelaciones al xuez.
  Dalgunos van m\u00e1s all\u00f3: t\u00f3o ye una conspiraci\u00f3n contra la monarqu\u00eda,
  unos dicen que pa obligar al rei a abdicar nel f\u00edu y otros que pa desestabilizar
  el r\u00e9xime dafechamente. Por embargo lo importante ye que\u2019l xuez trabaye
  con cancallu y aciertu y que llame a testificar a quien seya mester, perteneza a
  la familia que perteneza. El fechu de que Diego Torres seya un chorizu nun invalida
  la veracid\u00e1 de los datos, si ye qu\u2019esos datos son ciertos. Ye m\u00e1s,
  sedr\u00eda un chorizu espublizando les comunicaciones d''otru chorizu del que yera
  c\u00f3mplice.\\nNel \u201ccasu B\u00e1rcenas\u201d tamos no mesmo. Unos nun tienen
  la m\u00ednima duldia de que tolos dichosos apuntes son ciertos na so totalid\u00e1
  y que Rajoy y los suyos tan de cucho hasta les ceyes. Pa otros, como B\u00e1rcena
  tami\u00e9n ye un chorizu, los sos datos nun pueden ser ciertos. Y tami\u00e9n equ\u00ed
  dalgunos van m\u00e1s all\u00f3: t\u00f3o ye una confabulaci\u00f3n contra\u2019l
  PP, pa unos pa quitar a Rajoy y aupar a Aguirre y pa otros pa fundir al part\u00edu
  gobernante dafechamente. Los paralelismos col casu anterior son evidentes. Pero,
  lo mesmo qu\u2019enantes, lo b\u00e1sico ye que los xueces trabayen, qu\u2019interroguen
  a quien seya o que lleguen a decretar prisi\u00f3n preventiva si ye mester. De la
  mesma forma, la custi\u00f3n nun ta na persona, en si B\u00e1rcenas ye simp\u00e1ticu
  o non o si pensamos qu\u2019Arenas ye incapaz de vendese o mui capaz de facelo.
  En paralelo, el fechu de que Rajoy espublizara la so declaraci\u00f3n de la renta
  ye preba de la so tresparencia, mientres que pa otros ye la evidencia de que ye
  un mentirosu, porque nun detalla determinaos ep\u00edgrafes, al nun ser obligatorios
  dende hai unos a\u00f1os. Pero lo importante ye qu\u2019esa declaraci\u00f3n nun
  preba nada, nin lo uno nin lo otro, anque tea bien fecha, porque les declaraciones
  de IRPF, evidentemente, nun recueyen les perres en negro. Y son los pagos de caxa
  B lo que ta, precisamente, investig\u00e1ndose.\\nL\u2019asuntu de la secretaria
  socialista \u00fafremos la mesma situaci\u00f3n. Pa unos ye una ne\u00f1a idealista
  que pretende rexenerar la organizaci\u00f3n cola que s\u2019identifica ideol\u00f3xicamente.
  Pa otros ye una ne\u00f1ata oportunista que fae l\u2019apueste d\u2019esguilar pel
  palu\u2019l poder cuando, dientro d\u2019unos a\u00f1os, el ciclu pol\u00edticu
  cambie ya\u2019l PSOE vuelva al gobiernu. Pero eso tampoco ye lo importante. A min
  igual me da que seya una inxenua o una oportunista sinon si lo que diz tien valor
  o non. Esi ye\u2019l discutiniu, nel que soi de la idega de que la so opini\u00f3n
  val bien poco cuando se fae dende\u2019l somatu d\u2019un part\u00edu como\u2019l
  PSOE, tan culpiable como\u2019l PP de tolo que ta pasando. Lo mesmo podemos dicir
  de la so presencia na manifestaci\u00f3n. Unos afirmen el so drechu a la llibert\u00e1
  de manifestaci\u00f3n, los mesmos que, notres circunstancies, negar\u00eden esi
  drechu si a un votante d\u2019Amaiur se-y ocurriere dir a una concentraci\u00f3n
  en favor de les v\u00edctimes del terrorismu. A la contra, pa otros ye un exerciciu
  d\u2019hipocres\u00eda y remembren que trabayaba en Bruxelles con un sueldu altu.
  Y tampoco equ\u00ed ye eso lo importante. Lo fundamental ye si unos manifestantes
  tienen drechu a increpar a dos altos dirixentes d\u2019una organizaci\u00f3n que
  gobern\u00f3 cuasi trenta a\u00f1os, nun modific\u00f3 una llei hipotecaria del
  XIX, desregul\u00f3 la econom\u00eda, modific\u00f3 sin contar colos ciudadanos
  la constituci\u00f3n, bax\u00f3\u2019l salariu a los funcionarios, reduci\u00f3
  les pensiones y milenta coses m\u00e1s. Ya yo creyo qu\u2019esos manifestantes tan
  cargaos de razones pa nun querer marchar con eses dos persones. Y tampoco ye fundamental
  saber que trabayaba en Bruxelles, sinon qu\u00e9 ye lo que fac\u00eda y c\u00f3mo
  lo fac\u00eda.\\nNo que cinca a la ceremonia de los Goya, alcontramos lo mesmo.
  Los contertulios, blogueros y periodistes div\u00eddense, evidentemente, del mesmu
  mou que vien pasando dende hai varios a\u00f1os. Hailos que dicen que son peones
  del PSOE y que nam\u00e1s que se manifiesten cuando gobierna\u2019l PP. Hai otres
  opiniones contraries. Pero equ\u00ed, cosa que nun ye tan visible nos casos anteriores,
  apaez una allianza ente dos posiciones pol\u00edtiques al rodiu d\u2019un argumentu:
  que son una pandiella ricos. D\u2019un ll\u00e1u alcontramos a una drecha qu\u2019entruga
  que c\u00f3mo protesten persones que tienen munches perres y viven de la subvenci\u00f3n,
  cosa perduldiosa la primer afirmaci\u00f3n \u2013sacantes los pocos qu\u2019anden
  per Hollywood- y mentira la segunda por cuanto\u2019l cine nun ye de lo m\u00e1s
  subvencionao y, al empar, hasta la zucre del caf\u00e9 arrecibe subvenci\u00f3n.
  Al empar, hai una estrema esquierda qu\u2019afirma que son unos hip\u00f3crites
  \u201cprogres\u201d, mientres que definen al \u201cprogre\u201d como un \u201cburgu\u00e9s
  con mala conciencia\u201d. Otra vuelta no mesmo. Lo importante nun ye la conciencia
  del qu\u2019opina nin les razones \u00faltimes de les sos acciones. Lo importante
  ye lo que diz y si ye \u00fatil pa una causa que creyemos xusta. Supongo que los
  que caltienen esta opini\u00f3n odiar\u00e1n a Kropotkin, un pr\u00edncipe, o a
  Marx, un burgu\u00e9s que nun trabay\u00f3 enxam\u00e1s y viviera siempres a costa
  d\u2019un amigu. Pos non: lo importante son \u201cCampos, fabriques y talleres\u201d
  y \u201cContribuci\u00f3n a la cr\u00edtica de la econom\u00eda pol\u00edtica\u201d.
  Perbaxo esto hai un posu de catolicismu cotrosu nel qu\u2019esta socied\u00e1 ta
  educada. Cuando yo voi al m\u00e9licu nun-y entrugo si estudi\u00f3 melicina pa
  ganar m\u00e1s perres o par dir al Sahara. Lo importante ye que sea un bon m\u00e9licu,
  ya seya nun hospital p\u00fablicu que nun priv\u00e1u o que nos campos de refuxaos
  d\u2019Arxelia.\\nT\u00f3o esto ye una de les herencies de la transici\u00f3n. L\u2019argumentatio
  ad hominem\u201d como recursu, la permisivid\u00e1 colos lladrones si son de la
  mio banda, el xuiciu de valor non sobro\u2019l fechu sinon sobro la conciencia del
  exerciente, la divisi\u00f3n perfecha de la socied\u00e1. Cuando asistimos a tertulies
  observamos c\u00f3mo los que tan contra\u2019l drechu al albuertu nun creyen nel
  cambiu clim\u00e1ticu, tampoco quieren \u201ceducaci\u00f3n pa la ciudadan\u00eda\u201d,
  odien a los Bardem o a Maribel Verd\u00fa, tan a la contra de les autonom\u00edes,
  nun creyen la versi\u00f3n del 15-M, tienen antipat\u00eda a los ecoloxistes\u2026
  Y al rev\u00e9s lo mesmo\u2026 \u00bfYe que nun puede haber un contrariu al albuertu
  que creya la versi\u00f3n del 15-M o un enemigu de los Bardem pero que reconoza
  que ta produci\u00e9ndose un cambiu clim\u00e1ticu\u2026?\\nLa incultura pol\u00edtica,
  el moralismu d\u2019embudu \u2013siempre guetando la raz\u00f3n \u00faltima de conciencia
  pero siempres enancha pa los m\u00edos y estrecha pa los otros-, el nun saber nin
  discutir y nun ser quien a reconocer dalguna qu\u2019otra raz\u00f3n del otru, toes
  eses coses son los s\u00edntomas de la cris m\u00e1s grave d\u2019esti r\u00e9xime
  de la segunda restauraci\u00f3n. \u00bfNun ye daqu\u00e9 significativo qu\u2019hasta
  l\u2019esquierdista m\u00e1s encament\u00e1u tien una cierta envidia cuando ve les
  elleiciones, los debates y les compareciencies que se desendolquen nos Estaos Un\u00edos?
  \u00bfNun ye una se\u00f1al mui reveladora?\\nComentarios\\nPublicar un comentario\"",
  "\"\u00dan de Grao\\n- M\u00fasica\\nFecha:\\nHora:\\nPreciu:\\nLlugar:\\nConceyu:\\n-
  Oviedo/Uvi\u00e9u\\n\u00dan de Grao ye\u2019l proyeutu personal de Jos\u00e9 Mart\u00ednez
  \u00c1lvarez, guitarrista y cantante mosc\u00f3n afinc\u00e1u en Xix\u00f3n, y que
  lleva dellos a\u00f1os dedic\u00e1u a la m\u00fasica tradicional asturiana, participando
  en dellos grupos como Cuchu, Corzobeyos, Duerna, La Bandina''l Bache qu''acompa\u00f1a
  a H\u00e9ctor Braga, Dega\u00f1an''s o Dobra, formaci\u00f3n del maestru gaiteru
  Xuacu Amieva. Esti nuevu cam\u00edn pretende dar una visi\u00f3n personal de les
  estremaes formes d''evoluci\u00f3n que pudiera tener la tonada y por estensi\u00f3n,
  cualesquier palu dientro la m\u00fasica tradicional asturiana.\\nCalteniendo\u2019l
  respetu poles estructures y patrones tradicionales, esti mosc\u00f3n intenta echar
  un gabitu nel trabayu de xuntar o amestar la tonada y la m\u00fasica tradicional
  asturiana a otres corrientes, otros estilos, otres visiones...; abrise a otres influencies
  y asina dexar que''l nuestru patrimoniu cultural vaya evolucionando y adapt\u00e1ndose
  a los tiempos d''angua\u00f1o.\"", "\"Sabela Woodville\\nIsabel Woodville (1437
  - 7/8 de xunu 1492 en Grafton Regis, Northamptonshire, Inglaterra) foi la reina
  consorte d''Eduardo IV d''Inglaterra dende 1464 hasta 1483.\\nConten\u00edu\\nPrimeros
  a\u00f1os[editar | editar la fonte]\\nIsabel Woodville naci\u00f3 en Grafton Regis
  como la primera de los dolce f\u00edos d''un matrimoniu desigual. El so padre, sir
  Ricardo Woodville, chambel\u00e1n del pr\u00edncipe Juan de Lancaster, cas\u00e1rase
  de callao cola vilba del so se\u00f1or, Jacquetta de Luxemburgu, ensin el permisu
  del rei Enrique VI polo que fueron multaos. Sicas\u00ed, la so madre caltuvo''l
  so rangu ya ingresos como miembru de la familia real y el so padre foi cre\u00e1u
  bar\u00f3n Rivers en 1448.\\nPrimer matrimoniu y descendencia[editar | editar la
  fonte]\\n#Casar en 1452 con Juan Grey de Groby, 7\u00b0 bar\u00f3n de Ferrers. El
  so mar\u00edu morri\u00f3 na Segunda Batalla de San Albanu (17 de febreru de 1460),
  engarrando nel bandu de los L\u00e1ncaster.\\nDescendencia[editar | editar la fonte]\\n-
  Thomas Grey, primer Marqu\u00e9s de Dorset, Cond\u00e9 de Huntingdon y Lord Ferrers
  de Groby.\\n- Ricardo Grey.\\nSegundu matrimoniu[editar | editar la fonte]\\nEl
  rei Eduardo IV ten\u00eda nesi ent\u00f3s delles amigues, #pero Isabel nun taba
  conforme con ser una de tantes. Aportun\u00f3 en casase col rei. El matrimoniu ente
  Eduardo ya Isabel #celebrar en Grafton Regis, propied\u00e1 de la familia Woodville,
  el 1 de mayu de 1464. L''enllaz foi desconoc\u00edu pola opini\u00f3n p\u00fablica.
  Pa esi ent\u00f3s, el conseyeru d''Eduardo, Ricardo Neville, conde de Warwick, axust\u00f3
  una alianza nupcial con Francia. Cuando la uni\u00f3n ente''l rei ya Isabel #facer
  de conocencia p\u00fablica caus\u00f3 la considerable rens\u00eda de Warwick que,
  al ver que los parientes d''Isabel (especialmente''l so hermanu, el conde Rivers)
  empezaron a ser favorec\u00edos nel so llugar, #camudar al bandu de los L\u00e1ncaster.\\nColos
  favores que llograben los parientes de la reina, nun yera Warwick l''\u00fanicu
  que se resent\u00eda. En 1480, por casu, cuando''l mar\u00edu de la so hermana Leonor
  Woodville, sir Anthony Grey morri\u00f3, foi soterr\u00e1u na catedral de St. Albans
  con un brazalete d''oru que andaba a la tema col qu''usaba l''arzobispu m\u00e1s
  grande d''esa abad\u00eda. Eso nun yera nada compar\u00e1u a les uniones que la
  reina igu\u00f3 pa la so familia, siendo la m\u00e1s indignante cuando''l so nuevu
  hermanu Juan Woodville, de 20 a\u00f1os d''ed\u00e1, #casar con Catalina Neville,
  duquesa viuda de Norfolk. Catalina yera viuda tr\u00e9s vegaes y cuntaba con 64
  a\u00f1os d''ed\u00e1, pero ent\u00e1 yera bien brengosa. La reina tami\u00e9n cas\u00f3
  a la so hermana, Catalina Woodville, de 9 a\u00f1os, con Enrique Stafford, 2\u00b0
  duque de Buckingham, de 12 a\u00f1os.\\nDescendencia y viudez[editar | editar la
  fonte]\\nIsabel Woodville #casar en Grafton Regis, el 1 de mayu de 1464, con Eduardo
  IV d''Inglaterra (Wydeville). D''esti matrimoniu nacieron diez f\u00edos, nam\u00e1i
  siete #sobrevivir:\\n- Isabel (n. Palaciu de Westminster, 11 febreru 1466 - m. Torre
  de Londres, 11 febreru 1503), que se cas\u00f3 con Enrique VII Tudor. Por esti matrimoniu
  termin\u00f3 la Guerra de les Dos Roses.\\n- Mar\u00eda (n. Windsor, 11 agostu 1467
  - palaciu de Westminster, m. 23 mayu 1482).\\n- Cecilia (n. palaciu de Westminster,
  20 marzu 1469 - m. abad\u00eda de Quarr, Isla de Wight, 24 agostu 1507), casada
  primero con John, vizconde Welles y depu\u00e9s con Tomes Kyme.\\n- Eduardo V (n.
  palaciu de Westminster 4 payares 1470 - m. asesin\u00e1u, Torre de Londres, \u00bfxunetu?
  1483), socesor del so padre nel tronu.\\n- Margarita (n. palaciu de Westminster,
  10 abril 1472 - m. palaciu de Westminster, 11 avientu 1472).\\n- Ricardo (n. Shrewsbury,
  17 agostu 1473 - m. asesin\u00e1u, Torre de Londres, \u00bfxunetu? 1483), duque
  de York, probablemente asesin\u00e1u al pie de el so hermanu. #Casar en 1478 -a
  los 6 a\u00f1os d''ed\u00e1-, con Ana Mowbray (n.1472 - m. 1481).\\n- Ana (n. palaciu
  de Westminster, 2 payares 1475 - m. Framlingham, Suffolk, 22 payares 1511), casada
  con Tomes Howard, duque de Norfolk.\\n- Jorge (n. castiellu de Windsor, marzu 1477
  - m. castiellu de Windsor, marzu 1479), duque de Bedford.\\n- Catalina (n. palaciu
  de Eltham, 14 agostu 1479 - m. Tiverton, 15 payares 1529), casada con Guillermo
  Courtenay, conde de Devon.\\n- Brig\u00edda (n. palaciu de Eltham, 10 payares 1480
  - m. Dartford, 1517), foi monxa.\\nLa uni\u00f3n ente Isabel y Eduardo IV dio diez
  f\u00edos, incluy\u00edos dos varones que viv\u00eden nel momentu de la muerte repentina
  del rei, el 9 d''abril de 1483. El mayor de los dos, Eduardo, naciera na abad\u00eda
  de Westminster en 1470, onde Isabel s''abelug\u00f3 depu\u00e9s de la curtia restauraci\u00f3n
  nel tronu d''Enrique VI.\\nAl morrer el rei Eduardo IV, el so f\u00edu #convertir
  nel nuevu rei col nome d''Eduardo V, y qued\u00f3 al cargu del so t\u00edu Ricardo
  de Gloucester, nom\u00e1u Lord Protector. Tarreciendo que los Woodville intentaren
  monopolizar el poder, Gloucester maniobr\u00f3 pa faese col control del nuevu rei
  y orden\u00f3 l''arrestu d''Antonio Woodville, conde de Rivers, y de Ricardo Grey,
  f\u00edu del primer matrimoniu d''Isabel. El nuevu rei foi tresllad\u00e1u a la
  Torre de Londres ya Isabel volvi\u00f3 acoyese a sagr\u00e1u na abad\u00eda de Westminster
  col so f\u00edu menor y les sos f\u00edes. Lord Hastings, que fuera''l principal
  sofitu del difuntu rei en Londres, sofit\u00f3 en principiu les aiciones de Gloucester,
  pero foi acus\u00e1u per este de conspirar con Isabel nel so contra, y tres un xuiciu
  sumariu foi execut\u00e1u. Gloucester tami\u00e9n acus\u00f3 a Isabel de conspirar
  p''asesinalo y destruyilo dafechu\u00bb.\\nEl 25 de xunu de 1483, la so uni\u00f3n
  col difuntu monarca foi declarada nula pol #Parllamentu nel actu \\\"Titulus Regius\\\".
  L''anulaci\u00f3n #facer sol argumentu de que, primeramente, Eduardo IV comprometi\u00e9rase
  en matrimoniu con Lady Leonor Talbot y de qu''esist\u00eda un contratu nupcial robl\u00e1u,
  v\u00e1lidu ante la llei, nel que se-y prohib\u00eda al monarca contraer otru matrimoniu,
  pos se convertir\u00eda en b\u00edgamu. Esta informaci\u00f3n #dar a conocer cuando
  un sacerdote (posiblemente Roberto Stillington, obispu de Bath y de Wells), atestigu\u00f3
  qu''\u00e9l realizara la ceremonia.\\nCon esta evidencia, tolos f\u00edos qu''Isabel
  tuvo con Eduardo IV, incluyendo al nuevu rei Eduardo V, fueron declaraos ilex\u00edtimos.
  Por esto, el so cu\u00f1\u00e1u, Ricardo III, acept\u00f3 la corona y caltuvo a
  los pr\u00edncipes Eduardo V y Ricardo na Torre de Londres, onde los agospiaren
  p''aguardar la coronaci\u00f3n. El dest\u00edn de los Pr\u00edncipes de la Torre\\\"
  ye desconoc\u00edu. Isabel perdi\u00f3''l t\u00edtulu de reina madre y foi-y confer\u00edu''l
  de Lady Isabel Grey. Ella y los sos cinco f\u00edes, tarreciendo pola so segurid\u00e1,
  pidieron abelugu pa protexese de los celosos cortesanos que taben detr\u00e1s de
  too na cayida de la cla de los Woodville.\\nCuando''l duque de Buckingham, antiguu
  ali\u00e1u del nuevu Ricardo III, d\u00edxo-y que los sos f\u00edos fueren asesinaos,
  dambos ali\u00e1ronse a la casa de Lancaster y sofitaron les pretensiones del f\u00edu
  de Lady Margarita Beaufort, Enrique Tudor. Pa reforzar la so alianza Isabel y Margarita
  decidieron comprometer a los sos f\u00edos Enrique ya Isabel de York.\\nDempu\u00e9s
  de qu''Enrique aport\u00f3 al tronu, en 1485, la uni\u00f3n d''Isabel Woodville
  con Eduardo IV foi declarada v\u00e1lida y los sos f\u00edos fueron legitimados
  nuevamente. El rei respondi\u00f3 por esta llexitimaci\u00f3n porque quer\u00eda
  que la so esposa fuera la heredera de la casa de York y, d''esta forma, tener un
  derechu ent\u00e1 m\u00e1s s\u00f3lidu al tronu. Ent\u00f3s, a Isabel foi-y alcord\u00e1u''l
  t\u00edtulu de reina viuda.\\nMuerte[editar | editar la fonte]\\nIsabel morri\u00f3''l
  8 de xunu de 1492, a los 55 a\u00f1os d''ed\u00e1, na abad\u00eda de Bermondsey
  en Londres. Foi soterrada''l d\u00eda 12 d''esi mes na capiya de San Jorge, nel
  castiellu de Windsor, al llau del so home Eduardo IV.\\nAncestros[editar | editar
  la fonte]\"", "\"Jes\u00fas Iglesias fai d\u2019univesitariu alm\u00f3ndiga\\nEl
  protagonismu, la raz\u00f3n de ser d\u2019estes pel\u00edcules ta nos personaxes
  de la \u00faltima categor\u00eda: ensin ellos nun hai historia, son el motor de
  los acontecimientos. Enti\u00e9ndese, ent\u00f3s, que\u2019tis papel de muncha responsabilid\u00e1,
  del que se pue sentir \u00fan orgullosu. Yo propongo, pa \u00e9l, al coordinador
  d\u2019Izquierda Unida d\u2019Asturies, Jes\u00fas Iglesias. Dir\u00e1nme algunos
  que ta un poco mayucu pa la empresa, m\u00e1s cercanu al tiempu del proct\u00f3logu
  qu\u2019al de la fimosis. Y yo cont\u00e9sto-yos qu\u2019una etapa universitaria
  prolongada \u2019tain\u2019t circunstancia escepcional ente la clase pol\u00edtica
  asturiana, y que la moced\u00e1\u2019tis un est\u00e1u del esp\u00edritu, y que
  la cara de Jes\u00fas Iglesias tresmite una impresi\u00f3n xuvenil, toi por decir
  qu\u2019adolescente, que lu capacita pa representar, a la perfeci\u00f3n, al alm\u00f3ndiga
  de la cinematograf\u00eda asturiana. Eso s\u00ed: hai qu\u2019afeita-y el cercu
  rid\u00edculu de pelu que dex\u00f3 crecer\u2019round la boca, cola intenci\u00f3n,
  evidente y fracasada, d\u2019endurecer unos rasgos llandios, asustadizos. Les gafes,
  en cambiu, respet\u00e1mosles y aplaud\u00edmosles. L\u2019universitariu pring\u00e1u
  can\u00f3nicu gasta gafes: nun vamos paranos equ\u00ed a estudiar qu\u00e9 tipu
  de prexuicios imponen esti t\u00f3picu. Les d\u2019Iglesias son de lentes poderoses,
  vese na refraci\u00f3n brutal que delaten les semeyes: la cuenta. La perrerina rala
  cayendo pa enriba la frente convi\u00e9n tami\u00e9n al personaxe, da-y un aire
  primaveral, revoltosucu pero inocent\u00f3n, lo mesmo qu\u2019esos dos paletos cuniculares
  que quieren asomar detr\u00e1s del llabiu superior. En cambiu, tien que facer por
  nun subir la ceya izquierda, como suel:\u2019tis un xestu falt\u00f3n que desdiz
  col conxuntu humilde. Vamos pone-y braquets, que son aparatu traumatizante y disuasor
  de besos. De talla, Iglesias ta niquel\u00e1u:\u2019tis menud\u00edn, de raci\u00f3n,
  xusto lo que nos fai falta: nun queremos un h\u00e9rcules pa esti papel. Y lo m\u00e1s
  probable\u2019tis que podamos aprovecha-y bona parte del armariu (la cinematograf\u00eda
  asturiana nun ta pa tirar perres), que m\u00e1s d\u2019una d\u2019eses chaquetes
  que gasta, de manga arrogante que-y envuelve la met\u00e1 de la mano, seguro que
  contribuyen a da-y al nuestru alm\u00f3ndiga un aire de perdedor mui satisfactoriu.
  Polo dem\u00e1s, los andares arreblagaos v\u00e1lennos siempre que los esplote nes
  secuencies nes que tenga qu\u2019escapar de situaciones humillantes.\\nPero ya us\u00e9
  dos veces el t\u00e9rminu \u00abalm\u00f3ndiga\u00bb (\u00a1cu\u00e1nto m\u00e1s
  rica con esa eme que cola be!) ensin considerar si ust\u00e9 lu conoz o non. Da
  t\u00edtulu a una trilox\u00eda infame de los setenta y ochenta. L\u2019orixinal
  ingl\u00e9s\u2019tis meatball: una bola carne irracional que rueda, ciega, pa onde
  la emburrien, rebotando d\u2019accidente n\u2019accidente ensin ser a parar quieta.
  Eso\u2019tis lo que-y pasa al personaxe de Jes\u00fas Iglesias na posible pel\u00edcula
  qu\u2019imaxinamos. Los fardones del college, toos xugadores de rugby, curiosos,
  altos, cuadraos, trunfadores, m\u00e9xense de la risa vi\u00e9ndolu naguar poles
  animadores del equipu qu\u2019ellos se reparten y, na secuencia que tien que lu
  inmortalizar, emborr\u00e1chenlu, con enga\u00f1os miserables,\u2019til la inconsciencia.\\nCuando
  Iglesias despierta de la merluza, atontolin\u00e1u, alcu\u00e9ntrase tir\u00e1u
  nel verde, ente una mata d\u2019\u00e1rboles, na negrura de la noche y coles gafes
  como atuendu \u00fanicu. \u00bfPue ser peor la situaci\u00f3n? S\u00ed: al mover
  la mano derecha, descubre que la tien apegada, con alg\u00fan productu industrial
  d\u2019efectivid\u00e1 insuperable, a la izquierda d\u2019una mu\u00f1eca hinchable,
  que-y saca un palmu, vestida con gales de fulana: pelucona roxa, top arrat\u00e1u,
  shorts \u00f1algueros esfelpeyaos y zapatu de tac\u00f3n altu. Asust\u00e1u, ponse
  de pies y la mu\u00f1eca con \u00e9l. P\u00e9ga-y tirones pa soltala, pero la mu\u00f1eca
  mueve violentamente la cabeza neg\u00e1ndose. Dec\u00e1tase Iglesias, ent\u00f3s,
  d\u2019una m\u00fasiquina ambiental. Guard\u00e1u tres de los \u00e1rboles, saltando
  d\u2019\u00fan pal otru, ac\u00e9rcase a la llende de la mata y descubre, espant\u00e1u,
  que ta nel interior de los muros de la residencia femenina: unos metros delantre
  d\u2019\u00e9l, xunto la piscina descubierta, les universitaries celebren una fiesta
  de la fraternid\u00e1 Tau Beta Sigma bailando en bikini y consumiendo alcohol de
  colores en copes decoraes con sombrillines xaponenes. Del sustu, aquello que nun
  decimos m\u00e9ngua-y a Iglesias (la escena \u2019tain\u2019t espl\u00edcita, pero
  deduc\u00edmoslo vi\u00e9ndolu protexer la entepierna con tres manes: dos propies
  y la de la mu\u00f1eca). De punteres, recula buscando la protecci\u00f3n del interior
  de la viescuca, pero\u2019l so movimientu nun pas\u00f3 desapercib\u00edu: una ne\u00f1a
  acolumbr\u00f3-y casualmente la sombra movi\u00e9ndose y agora, con otres cuantes,
  ac\u00e9rcase callandino a investigar.\\nA too esto, al nuestru alm\u00f3ndiga,
  pueser que pol mieu o pola inxesta de licores, entr\u00e1ron-y les ganes de mexar,
  y asina\u2019tis como lu descubren les miembres: d\u2019espaldes, sescudiendo la
  pirula depu\u00e9s del actu. Pero lleven una falsa impresi\u00f3n favorecida pola
  escurid\u00e1: paez que la que-y la sescude, cola zurda,\u2019tis una rapaza enclinada
  al llau. Escandal\u00edcense y arrevienten a pegar gritos. Iglesias y la mu\u00f1eca
  dan la vuelta, asust\u00e1u \u00e9l, descarada ella. Abr\u00e1zala pa tapase los
  atributos, ella d\u00e9xase, y asina, zapicando torpemente, fuxen ente los \u00e1rboles.
  La indignaci\u00f3n de les Tau Beta Sigma nun consiente: agora tola fiesta se xunt\u00f3
  a escazobellar pela mata, formando una filera de cazadores semidesnudes y rabioses.
  Pero l\u2019alm\u00f3ndiga Iglesias tuvo suerte: dio con un cavornu, el tueru afurac\u00e1u
  d\u2019un \u00e1rbol muertu, y guard\u00f3se dientro, apret\u00e1u \u00edntimamente
  cola mu\u00f1eca. Col coraz\u00f3n balti\u00e9ndo-y azot\u00e1u, siente a les cazadores
  acercase arrenegando, amenazando con mutilaciones espantibles. Nun lu alcuentren,
  pasen de llargo. Iglesias respira: paez que va salvase y salir indemne. Xusto ent\u00f3s,
  suena un tel\u00e9fonu m\u00f3vil nel interior del cavornu denunci\u00e1ndolu. Les
  universitaries dan la vuelta al momentu. Desesper\u00e1u, Iglesias salta pa fuera
  l\u2019\u00e1rbol y cuerre cola pareya a rastres. Con \u00e9l va tami\u00e9n el
  politonu d\u2019Abba delator. Si ta en pulguina, evidentemente, el tel\u00e9fonu
  ll\u00e9valu la mu\u00f1eca, pero, \u00bf\u00f3nde? Escapar asina, con m\u00fasica
  llamando a la xaur\u00eda, nun tien sent\u00edu. P\u00e1rase y arr\u00ednca-y el
  top a la mu\u00f1eca: nada. Qu\u00edta-y los shorts: tampoco. Ent\u00f3s, \u00bf\u00f3nde
  lu guardaron aquellos cabrones? Nam\u00e1s puede tar\u2026\\nLleguen les furies
  Tau Beta Sigma\u2019til\u2019l claru onde Iglesias xorrasca con dos deos ente les
  piernes de la mu\u00f1eca. Caen enriba d\u2019\u00e9l, rabiaes. Equ\u00ed, l\u2019actor
  tien que poner en xuegu tola so capacid\u00e1 espresiva pa tresmitinos la indefensi\u00f3n
  y l\u2019angustia m\u00e1s absolutes. Ente palos, Iglesias\u2019tis quien a safase,
  pero perdi\u00f3 les gafes y sal corriendo ciegu. Llega al borde de la piscina y
  cai pal agua. La mu\u00f1eca flota y ag\u00e1rrase a ella: una condici\u00f3n de
  cualquier alm\u00f3ndiga\u2019tis nun saber nadar. Les bikineres gr\u00edten-y escandalosamente
  dende\u2019l borde formando un cercu atemorizador. El cuerpu de la mu\u00f1eca resbaria
  y Iglesias fai esfuerzos pa que nun se-y escape d\u2019ente les manes, arrepega
  per ella. N\u00fan d\u2019esos movimientos violentos, eng\u00e1ncha-y un pez\u00f3n
  colos braquets: la mu\u00f1eca pincha, empieza a desinflar. Iglesias funde seliquino
  pal fondu. Al travi\u00e9s del agua, arriba, ve\u2019l cercu borrosu de moces abuche\u00e1ndolu
  y lo \u00fanico que quier\u2019tis nun volver a salir nunca a la superficie, que
  la muerte cumpla r\u00e1pido la so misi\u00f3n.\\nLa Nueva Espa\u00f1a, 20 d\u2019ochobre,
  2009\"", "\"El Conseyu d\u2019Europa refierta a la Xunta de Castiella y Lli\u00f3n
  la falta de protecci\u00f3n del llion\u00e9s\\n29/11/12\\n26/11/12\\nNas nueites
  de resultaos electorales hai pouco que me preste m\u00e1s que ver las noticias,
  debates, etc. de los medios del r\u00e9xime. G\u00fcei cen\u00e9i viendo El Gato
  al Agua d''Intereconom\u00eda, foi un exerciciu de vanid\u00e1. Enc\u00e1ntame ascuitar
  las mentiras que sueltan cumo si nada y detectalas a\u00edna, pa min ye un xuegu
  que fai que me sienta llibre. El mensaxe repetidu durgante toda la emisi\u00f3n
  foi''l mesmu que''l de cuasimente t\u00f3dolos medios estatales: La innecesaria
  convocatoria d''elecciones y l''apocal\u00edpticu fracasu de Mas acompa\u00f1\u00e1u
  de cansinas frases feitas: que si Mas ye menos, que si la fola soberanista afog\u00f3u
  al president, bla, bla, bla.\\n\u00bfYeran daveras necesarias estas elecciones?
  You cuido que s\u00ed y voi intentar desplicar el porqu\u00e9 procurando deixar
  de llau la simpat\u00eda que tengo por Artur Mas, porque si bien nun me presta''l
  sou partidu y nun lu votar\u00eda... s\u00ed que me presta la sua imaxe cumo pol\u00edticu,
  el sou xeitu, el sou comportamientu calmu y dialogante polo menos n''apariencia.
  Pa entendenos, que you soi de los que lu valorar\u00eda bien nesas encuestas acerca
  de lo que s''opina de los candidatos al marxe''l partidu al que representan.\\nEn
  dalguna entrada anterior ment\u00e9i las dificultaes que tien el ciudadanu espa\u00f1ol
  mediu pa estremar ente nacionalismu ya independentismu, dous t\u00e9rminos que xeneralmente
  van xuntos pero que nun son lo mesmo. CiU ye una coalici\u00f3n nacionalista pero
  que siempres refug\u00f3u l''independentismu dientro de los sous postulaos y programas
  pol\u00edticos, de feitu nestas \u00faltimas elecciones la sua propaganda tov\u00eda
  falaba de la defensa del dreitu a decidir, de la importancia voz del pueblu, pero
  la palabra independencia naide nun yera quien a atopala por neng\u00fan llau. Sicas\u00ed,
  la situaci\u00f3n esta vez yera bien diferente, dende l''once de Setiembre en qu''un
  venti por cientu de los catalanes salieron a la cai nuna \u00fanica manifestaci\u00f3n
  pidiendo la independencia pa Catalu\u00f1a, CiU sigu\u00edu ensin falar abiertamente
  d''ella pero decid\u00edu garrar el touru polos cuernos ya intentar sacar alantre
  una consulta popular acerca de si''l pueblu catal\u00e1n quier ou non un est\u00e1u
  propiu pa s\u00ed mesmu, acompa\u00f1andola d''un proyectu de pa\u00eds dientro
  d''Europa por parte de la propia coalici\u00f3n y con una clara volunt\u00e1 d''avanzar
  p''hacia esi est\u00e1u. La cuesti\u00f3n ent\u00f3s yera, si CiU cuntaba y\u00e1
  con mayor\u00eda absoluta y hab\u00eda m\u00e1s fuerzas dientro del Parlament que
  sofitar\u00edan esi referendum, \u00bfcual ser\u00eda l''aquel de convocar unas
  nuevas elecciones cuando tov\u00eda restan dous a\u00f1os pal cabu la llexislatura?
  Ye eiqu\u00ed n''onde cobra importancia esa diferencia ente nacionalismu ya independentismu,
  ente''l votu coyuntural y el compromisu de dar un pasu p''hacia dalgo que nun tendr\u00eda
  vuelta atr\u00e1s. CiU en todu momentu defend\u00edeu que pa que se diera esa consulta
  yera necesaria una ampla mayor\u00eda que la respaldara, en definitiva, Mas nun
  quer\u00eda celebrar esi referendum ensin saber cual yera''l porcentaxe del elector\u00e1u
  que lu encontar\u00eda agora que s\u00ed apostar\u00eda pol futuru de Catalu\u00f1a
  al marxe d''Espa\u00f1a, agora que s\u00ed apostar\u00eda pola independencia onque
  por unas cousas ou outras nun acabara de presta-ye l''usu d''esi t\u00e9rminu. Mas
  b\u00e1sicamente quer\u00eda saber cuantos de los sous votantes yeran independentistas
  am\u00e1s de nacionalistas. Angua\u00f1o y polas pol\u00edticas del PP f\u00e1lase
  muito de la democracia participativa, de que si un partidu vai facer dalgo que nun
  est\u00e1 no sou programa electoral ou que lu contradiz deber\u00eda consultar al
  pueblu, pueis bien, el President quixo saber cuantos de los sous votantes estar\u00edan
  a favor d''esa consulta pol est\u00e1u propiu que nun se planteaba dous a\u00f1os
  atr\u00e1s cuando l''oxetivu yera''l pactu fiscal y non outras cousas. You si fuera
  votante de CiU sentir\u00edame arguyosu del sentidu de la democracia amos\u00e1u
  nesta ocasi\u00f3n.\\nG\u00fcei, llunes de resaca electoral, la coalici\u00f3n nacionalista
  quedan con cincuenta esca\u00f1os, doce menos qu''en 2010, y los medios falan de
  fracasu. Que si Catalu\u00f1a refuga''l separatismu, que si los catalanes aman Espa\u00f1a,
  que si Mas debe dimitir. Supongo que ye una llectura muito m\u00e1s c\u00f3moda
  pa los qu''est\u00e1n a favor de la defensa del esp\u00edritu nacional qu''encalcar
  el feitu de que la suma de t\u00f3dolos esca\u00f1os de las formaciones pol\u00edticas
  que nun apuestan pola independencia da un result\u00e1u inferior al n\u00famaru
  d''esca\u00f1os arrecadaos por CiU, y que t\u00f3dolos partidos que s\u00ed apuestan
  abiertamente por ella anantoron notablemente la sua representaci\u00f3n.\\nNun hai
  cegueira m\u00e1s rid\u00edcula que la selectiva.\"", "\"Antoni Mart\u00ed\\nAntoni
  Mart\u00ed Petit (Escaldes-Engordany, 10 de payares de 1963) ye un pol\u00edticu
  andorranon y actual presidente del Gobiernu d''Andorra dende''l 12 de mayu de 2011,
  cuando gan\u00f3 les eleiciones la coalici\u00f3n de centru-derecha que lideraba,
  Dem\u00f3crates per Andorra.[1]\\nBiograf\u00eda[editar | editar la fonte]\\nMart\u00ed
  Petit naci\u00f3 nel conceyu d''Escaldes-Engordany el 10 de payares de 1963. Curs\u00f3
  los estudios d''Arquiteutura na Universid\u00e1 de Toulouse, en Francia. La so implicaci\u00f3n
  na pol\u00edtica empieza en 1994 col Part\u00edu Lliberal d''Andorra (PLA), siendo
  unu de los sos fundadores, primero como parllamentariu, tomando decisiones revesoses
  como''l votu en contra de la Constituci\u00f3n y darr\u00e9u como \\\"conseller
  xeneral\\\" hasta 1997, siendo reelex\u00edu pa ocupar el cargu de nuevu en 2001.
  Ocupa esti cargu hasta 2003, cuando decide presentase a les eleiciones comunales,
  nes cualos ye escoy\u00edu C\u00f3nsul Mayor d''Escaldes-Engordany.\\nAl mandu de
  la coalici\u00f3n de centru-derecha Dem\u00f3crates per Andorra (DA) gan\u00f3 les
  eleiciones de 2011 col 55% de los votos, y el 12 de mayu del mesmu a\u00f1u convertir
  en Xefe de Gobiernu del princip\u00e1u pirenaicu. En marzu de 2015 presentar a les
  eleiciones llogrando solo''l 37% de los votos, resultando reelex\u00edu y ent\u00e1
  asina sigue gobernando en mayor\u00eda nuevamente con 15 de los 28 Consellers Generals,
