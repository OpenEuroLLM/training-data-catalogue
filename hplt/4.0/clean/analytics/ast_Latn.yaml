  sieglu]\\nVer tami\u00e9n[editar | editar la fonte]\\nReferencies[editar | editar
  la fonte]\\nEnllaces esternos[editar | editar la fonte]\"", "\"Glay\u00edu.org entrev\u00edstanos
  con motivu del reportaxe \u201cCuarenta a\u00f1os de reivindicaci\u00f3n lling\u00fc\u00edstica:
  ente l\u2019apat\u00eda y la frustraci\u00f3n\u201d. Equ\u00ed pod\u00e9is lleer
  el reportaxe:\\nCuarenta a\u00f1os de reivindicaci\u00f3n lling\u00fc\u00edstica.
  \u00bfEnte l\u2019apat\u00eda y la frustraci\u00f3n?\\nAVER\u00c1MONOS A LES INICIATIVES
  QUE NUN SE RINDEN A QUE L\u2019ASTURIANU DESAPAEZA\\nEl movimiento de recuperaci\u00f3n
  lling\u00fc\u00edstica del asturianu tien casi cuarenta a\u00f1os. La selmana pasada
  Vital y Ram\u00f3n d\u2019Andr\u00e9s, y Vicente \u00c1lvarez Men\u00e9ndez, ex
  directores de Pol\u00edtica Ll\u00edng\u00fc\u00edstica del Princip\u00e1u los dos
  \u00faltimos, fac\u00eden p\u00fablicu una reflex\u00f3n personal sobre por qu\u00e9
  la llingua asturiana taba perdiendo puxu na nuestra socied\u00e1. Les conclusiones
  que se pod\u00eden sacar ye que, am\u00e1s de pola falta de pol\u00edtiques afechisques
  que defendieran la vitalid\u00e1 del asturianu, el retrocesu del billing\u00fcismu
  n\u2019Asturies taba ocurriendo pola apat\u00eda de la propia socied\u00e1 asturiana
  ente la desapaicion de la so llingua tradicional, y la frustraci\u00f3n de la minor\u00eda
  militante que nun yera a facer valir los sos argumentos nel conxuntu la poblaci\u00f3n
  asturiana. P\u2019afondar g\u00fcei nesti alderique aver\u00e1monos a tres iniciatives
  que tienen l\u2019asturianu como llingua d\u2019espresi\u00f3n.\\nDesque nel a\u00f1u
  74 naciera Conceyu Bable, primera de les organizaciones que reclamaron un estatus
  dignu pa la llingua asturiana, fueron munches les iniciatives que puxaron por revitalizar
  l\u2019usu del asturianu na nuestra socied\u00e1. Nel so escritu \u2018La socied\u00e1
  ante la llingua: compromisu y futuru\u2019 los hermanos d\u2019Andr\u00e9s y \u00c1lvarez
  Fern\u00e1ndez pon\u00eden el pesu de la culpa de la perda de presencia del asturianu
  na propia socied\u00e1 que lo ten\u00eda qu\u2019emplegar como llingua vehicular.\\nXunta
  pola defensa de la Llingua asturiana\\nCarlos Pulgar ye voceru de la organizaci\u00f3n
  m\u00e1s veterana na reivindicaci\u00f3n lling\u00fc\u00edstica, la Xunta pola defensa
  de la Llingua asturiana, fundada en 1984. Entrug\u00e1mos-y pa entamar qu\u00e9
  ye lo que cambi\u00f3 alrodiu l\u2019asturianu nestos casi treinta a\u00f1os de
  vida de la Xunta pola. \u201cLo que cambi\u00f3 foi lo mesmo que fue cambiando na
  socied\u00e1 asturiana nestes d\u00e9cades. Creo que nel principiu del movimientu,
  nel \u00faltimu cuartu del sieglu XX, l\u2019asturianu entra en peores condiciones
  sociolling\u00fc\u00edstiques qu\u2019otres de les lling\u00fces llamaes minorizaes
  del nuestru entornu. A pesar de llegar m\u00e1s afogadinos que les otres fueron
  d\u00e1ndose pasinos na puesta en marcha de la reivindicaci\u00f3n, y no que yera
  fundamental, na visi\u00f3n que la propia socied\u00e1 ten\u00eda de la llingua
  asturiana. El ciudadanu y la ciudadana media ten\u00eda daquella una visi\u00f3n
  perpocu formada, poca conciencia lling\u00fc\u00edstica, poca capacid\u00e1 de pensar
  nes posibilidaes que ten\u00eda l\u2019asturianu como llingua, incluso dud\u00e1base
  de la so propia entid\u00e1 en comparaci\u00f3n con otres. Lo qu\u2019empez\u00f3
  con el movimientu de recuperaci\u00f3n foi tou esi trabayu de zapa, esi llabor de
  dir valtando \u00fan per \u00fan toos esos prexuicios que ven\u00eden acumul\u00e1ndose
  dende fac\u00eda sieglos. El trabayu b\u00e1sicu de la Xunta foi dir presentando
  a la socied\u00e1 toles posibilidaes de la llingua. L\u2019avance na concepci\u00f3n
  social del idioma parezme que ye innegable que se dio. Lo que nun se movi\u00f3
  muncho foi l\u2019otra pata del asuntu, el terr\u00e9n de los derechos, del marcu
  llegal, el \u00e1mbitu pol\u00edticu, que ta nuna v\u00eda muerta\u201d.\\nSicas\u00ed,
  parez bien palpable que nestes \u00faltimes d\u00e9cades tami\u00e9n avanz\u00f3
  la castellanizaci\u00f3n de la socied\u00e1 asturiana nel so conxuntu. L\u2019amest\u00e1u,
  esi rexistru lling\u00fc\u00edsticu que mec\u00eda una gram\u00e1tica, sintaxis
  y l\u00e9xicu asturianos con una fon\u00e9tica castellana en graos mui diversos,
  y que yera lo xeneralizao na inmensa mayor\u00eda de la socied\u00e1 asturiana,
  pierde terr\u00e9n frente al avance d\u2019un \u201ccastellanu total\u201d que parez
  imparable. \u201cYe evidente cuando se reclama el marcu d\u2019oficialid\u00e1 nun
  ye un mantra que se repite ensin xac\u00edu, sinon que se pid\u00eda y siguir\u00e1
  pidi\u00e9ndose porque creemos que ye\u2019l marcu necesariu pa garantizar los derechos
  de los falantes y pa tener posibilidaes realmente de que la llingua sobreviva, que
  ye l\u2019oxetivu final. Nestos treinta a\u00f1os el trabayu de revitalizaci\u00f3n
  de la llingua nun se fizo y ent\u00f3s, tol tiempu que nun faes lo que tienes que
  facer, ta pasando lo que nun tien que pasar. Y eso ta teniendo consecuencies sobre
  la situaci\u00f3n socioll\u00edng\u00fc\u00edstica del asturianu.\\n\u201cCola falta
  d\u2019usu xeneraliz\u00e1u nel sistema educativu y nos medios de comunicaci\u00f3n,
  la llingua va perdiendo presencia y prestixu na socied\u00e1, va perdiendo la sensaci\u00f3n
  d\u2019utilid\u00e1\u201d.\\nEvidentemente enfrent\u00e1monos a un problema doble:
  cola falta de derechos d\u2019oficialid\u00e1 y d\u2019usu xeneraliz\u00e1u nel
  sistema educativu y nos medios de comunicaci\u00f3n, la llingua va perdiendo presencia
  y prestixu na socied\u00e1, va perdiendo la sensaci\u00f3n d\u2019utilid\u00e1,
  lo que fae que la tentaci\u00f3n de frayar la tresmisi\u00f3n lling\u00fc\u00edstica
  tradicional seya mui grande, y vemos qu\u2019eso ye lo que ta pasando. Por eso dic\u00eda
  enantes qu\u2019esi procesu de ruptura nun ye una cuesti\u00f3n que venga porque
  s\u00ed, sinon que vien por un procesu de deterioru de la situaci\u00f3n del asturianu
  na socied\u00e1 y porque esisten unes pol\u00edtiques que, por acci\u00f3n o por
  omisi\u00f3n, faen que nun seya \u00fatil na vida moderna l\u2019usu de la llingua.
  Pa que l\u2019asturianu tenga futuru hai que cambiar eses pol\u00edtiques\u201d.\\nN\u00e1
  ye ayeno a la esistencia d\u2019una llingua, y m\u00e1s nel casu d\u2019Asturies,
  con un poblaci\u00f3n menguante y avieyada na que cada vez nacen menos cr\u00edos.
  \u201cNun ye nam\u00e1s una cuesti\u00f3n pol\u00edtica, tami\u00e9n ye infraestructural
  y demogr\u00e1fica; nun ye qu\u2019haya menos ne\u00f1os falantes d\u2019asturianu,
  ye qu\u2019hai menos ne\u00f1os en xeneral. El porcentaxe ye cada vez m\u00e1s peque\u00f1u
  dientru d\u2019unos grupos d\u2019ed\u00e1 cada vegada m\u00e1s mermaos. Poro, el
  trabayu de normalizaci\u00f3n ha ser el doble\u201d.\\n- Manifestaci\u00f3n del
  Pautu pol Autogobiernu y la Oficialid\u00e1\\nL\u2019escritu qu\u2019espublizaron
  la selmana pasada los hermano d\u2019Andr\u00e9s y Alfredo \u00c1lvarez Men\u00e9ndez
  reflexonando sobre la responsabilid\u00e1 de la propia socied\u00e1 asturiana nel
  retrocesu del usu de la llingua llevant\u00f3 polvareda. \u00bfPodemos falar d\u2019apat\u00eda
  de la socied\u00e1 pa cola llingua y de frustraci\u00f3n del movimientu de recuperaci\u00f3n
  lling\u00fc\u00edstica?\\n\u201cLa frustraci\u00f3n que puede sentir toa persona
  precupada pol futuru del asturianu nun tien que servir d\u2019escusa pa facer un
  centrifug\u00e1u de culpes que les reparta a toos en xeneral y naide en particular.
  Ram\u00f3n y Vital d\u2019Andr\u00e9s y \u00c1lvarez Men\u00e9ndez ficieron una
  reflex\u00f3n personal con un tonu pesimista y con cierta falta de propuestes. Nun
  mos parez que dende un puntu de vista sociolling\u00fc\u00edsticu se pueda obviar
  los problemes que tien toa llingua minorizada, eses llabanones que tien enriba y
  que faen que nun se puedan valorar les sos opciones \u2019llibremente\u2019. N\u00f3s
  dicimos qu\u2019esa situaci\u00f3n de llibert\u00e1 nin se dio nin se da n\u2019Asturies.
  Cuando esista realmente una iguald\u00e1 de derechos ente los falantes, unos marcos
  llegales iguales, unes pol\u00edtiques d\u2019educaci\u00f3n y promoci\u00f3n iguales,
  nesi momentu s\u00ed que podr\u00e1s dicir qu\u2019esa persona escoy\u00f3 llibremente
  esa llingua. Pero pareznos que\u2019l debate que plantearon rompe les regles de
  la propia sociolling\u00fc\u00edstica\u201d.\\nEl s\u00e1badu pas\u00e1u la Xunta
  pola entregaba los Premios cr\u00edticos de les Lletres asturianes al quedar fuera
  de los galardones qu\u2019entrega l\u2019Asociaci\u00f3n d\u2019escritores d\u2019Asturies
  les obres escrites n\u2019asturianu y eonaviego.\\nLa mid\u00eda de l\u2019Asociaci\u00f3n
  d\u2019escritores fue una bona simplificaci\u00f3n de los tiempos que cuerren n\u2019Asturies.
  Ven\u00eden convocando de manera a\u00f1al unos premios nes categor\u00edes pal
  asturianu. Esti a\u00f1u de manera unillateral decidi\u00f3 quitalos y dio unes
  argumentaciones. Analiz\u00e1ndoles vimos que cada raz\u00f3n yera m\u00e1s tramposa
  que l\u2019anterior, porque falaba de falta de producci\u00f3n lliteraria y de recursos
  econ\u00f3micos, pero la Xunta dio prebes de qu\u2019hab\u00eda producci\u00f3n
  abondo y que los fondos econ\u00f3micos sigu\u00eden esistiendo. Pareznos m\u00e1s
  bien que ye una xustificaci\u00f3n de la so propia postura antrox\u00e1ndola de
  trampa conceptual. N\u00f3s lo que ficimos fue convocar unos premios, con xuraos
  de muncho prestixu, y entregalos esti s\u00e1badu. Otra cosa que mos enllaza bastante
  col tiempu d\u2019angua\u00f1u ye que, de la que d\u00edbemos conociendo los nomes
  de los premiaos, vimos qu\u2019unu vive n\u2019Alemania, otru en Breta\u00f1a, otru
  en Madr\u00ed. Bona parte de la moced\u00e1 que ta nun momentu de mayor producci\u00f3n
  cultural tien que tar fuera de les nuestres fronteres pa poder trabayar. Da pa reflexonar
  sobre la situaci\u00f3n de la moced\u00e1 asturiana y de la xente que quier siguir
  faciendo cultura n\u2019asturiano.\\nRadio Sele: la precaried\u00e1 de la llingua
  nos medios\\nRadio Sele entam\u00f3 a emitir en febreru de 1986 con una programaci\u00f3n
  dafechu n\u2019asturianu. Dende ent\u00f3s fueron munches les persones y programes
  que pasaron per ell\u00ed, algunes d\u2019elles angua\u00f1o conoc\u00edes en toa
  Asturies polos programas que faen na RPA.\\nIncluso Glay\u00edu en 2005 fizo un
  bolet\u00edn contrainformativu selmanal de media hora qu\u2019esbillaben los compa\u00f1eros
  Mar\u00eda, Anxel\u00f3n y Teo. Radio Sele pas\u00f3 per munchos momentos tatexantes:
  en 1998 ganaron en p\u00fablicu concursu la concesi\u00f3n d\u2019una llicencia
  comercial, y unos a\u00f1os m\u00e1s tarde el gobiernu del PSOE arrambl\u00f3 con
  ella pa entrega-yla a un empresariu af\u00edn. Tuvieron que recurrir a los tribunales
  y en 2005 fallaron a favor de la radio declarando\u2019l camb\u00e9u del concursu
  como illegal y obligando a la devoluci\u00f3n de la llicencia al so axudicatariu
  orixinal. Sentencia que\u2019l gobiernu asturianu nun cumpli\u00f3, obligando a
  Radio Sele a camudar delles vegaes la frecuencia d\u2019emisi\u00f3n, hasta llegar
  a l\u2019actual la 106.1 de FM. Fae pocu sofrieron l\u2019acosu, xunto con Radiu
  QK, del xefe provincial de Telecomunicaciones d\u2019Asturies. Nuna carta qu\u2019unvi\u00f3
  a les comunidaes de vecinos onde tan les antenes de les radios desix\u00eda que
  retiraren les infraestructures de difusi\u00f3n, so riesgu de sufrir sanciones bien
  ellevaes. Poro, Radio Sele tuvo de cesar la emisi\u00f3n temporalmente.\\nEstos
  d\u00edes venimos sintiendo que Radio Sele pasa per un nuevu bache, asina que falamos
  con Xuanxo Mari\u00f1o, que nos cuenta la situaci\u00f3n del mediu radiof\u00f3nicu.\\n-
  Programa en directo dende los estudios de Radio Sele\\nHubo una temporada que la
  radio solo sent\u00edase n\u2019Uvi\u00e9u, otra que cubr\u00eda muncha parte d\u2019Asturies.
  \u00bfQu\u00e9 radio d\u2019emisi\u00f3n cubren angua\u00f1o les vueses emisiones?\\nAgora
  nam\u00e1s emitimos per internet. Na FM fai unos meses que non emitimos porque dempu\u00e9s
  de la menaza de Telecomunicaciones los vecinos nun mos dexen tener l\u2019antena
  puesta nel teyau.\\n\u00bfAngua\u00f1o c\u00f3mo ta la parrilla de programaci\u00f3n
  de la Sele?\\nCon pocos programes, porque al non emitir per FM la xente desan\u00edmase.\\nHai
  tiempu, la radio baill\u00f3 nel alderique de si radio llibre o radio comercial.
  \u00bfCu\u00e1l ye\u2019l planteamientu actual? \u00bfY llegalmente c\u00f3mo s\u2019atopa?\\nYe
  radio llibre desde\u2019l so aniciu, y ye una emisora allegal.\\n\u00bfResolvi\u00f3se
  finalmente l\u2019ataque que sufristis l\u2019a\u00f1u pasau per parte de la Xefatura
  de Telecomunicaciones xuntu con Radio QK?\\nNon, desde ent\u00f3s emitimos per internet.\\nFae
  pocos d\u00edes venimos sintiendo que la radio pasa per un nuevo bache, \u00bfCu\u00e1l
  ye la vuestra situaci\u00f3n angua\u00f1o?\\nPues ye la de muchos colectivos: los
  gastos d\u2019una emisora son mui altos y los ingresos cada vegada menores, pero
  tamos tratando de igualo.\\n\u00bfHai dalguna forma de sofitar el proyectu o ten\u00e9is
  pensao facer alg\u00fan actu pa recaldar fondos?\\nHabr\u00e1 un conciertu con fecha
  por determinar y van ponese unes urnes nel campu del Real Oviedo. Tami\u00e9n buscamos
  persones que quieran collaborar con una aportaci\u00f3n trimestral o a\u00f1al,
  na cuenta de l\u2019Asociacion Cultural Secha en Caxa Rural n\u00famberu 3059 0001
  18 2366328629.\\nReciella. N\u2019asturianu dende los primeros pasinos\\nEl pas\u00e1u
  branu un grupu de families y docentes decidi\u00f3 entamar un proyectu de tresmisi\u00f3n
  interxeneracional de la llingua asturiana. Reciella. Families pol asturianu f\u00f3rmenla
  persones pa les que ye importante que los sus f\u00edos tengan l\u2019asturianu
  como llingua materna. Falamos con David Guardado, \u00fan de los promotores de la
  idea y p\u00e1 d\u2019una ne\u00f1a de doce meses pa que mos desplique la iniciativa:
  \u201cLo que facemos ye entamar actividaes l\u00fadiques y pedag\u00f3xiques nes
  que l\u2019asturianu ye la llingua de comunicaci\u00f3n. M\u00fasica, xuegos, cuentacuentos,
  manualidaes, tradiciones asturianes como\u2019l mag\u00fcestu, etc. Depu\u00e9s
  los pas y mas aconceyamos pa ver c\u00f3mo podemos consiguir que los ne\u00f1os
  y ne\u00f1es puedan falar y rellacionase n\u2019asturiano. Ab\u00faltanos qu\u2019agora
  mesmo a nivel de la socied\u00e1 asturiana en xeneral esto ye poco menos qu\u2019una
  utop\u00eda, asina que pel momentu centr\u00e1monos en dir cre\u00e1ndo-yos peque\u00f1os
  espacios onde puedan tener vida n\u2019asturianu y dir medrando y aumentando esos
  \u00e1mbitos hasta onde podamos llegar\u201d.\\nQu\u2019esos ne\u00f1os y ne\u00f1es
  puedan tener de grandes una vida dafechu n\u2019asturiano ye l\u2019oxetu final
  d\u2019esti proyectu a llargu plazu, pero la iniciativa val tami\u00e9n pa los pas
  y m\u00e1s: \u201cNes families hai xente que nun sabe falar n\u2019asturianu, o
  que tienen un rexistru d\u2019asturianu bastante baxo, pero que tien inter\u00e9s
  porque los sos f\u00edos s\u00ed lo aprendan. Reciella val tami\u00e9n pa que nosotros
  y nosotres mantengamos el pulsu de la llingua, pa que sigamos aprendiendo, y pa
  tresmitilo. S\u00edrvenos incluso de recordatoriu\u201d.\\n- Activid\u00e1 de los
  m\u00e1s peque\u00f1os de Reciella\\nMagar que\u2019l movimientu de recuperaci\u00f3n
  lling\u00fc\u00edstica del asturianu tien casi cuarenta a\u00f1os, nun hubo hasta
  agora un proyectu propiu de les families pa espardir l\u2019usu de la llingua ente
  los m\u00e1s peque\u00f1os. L\u2019amarraza siempre tuvo en consiguir que\u2019l
  bable tuviera nes escueles como parte del curr\u00edculum. \u201cEsa yera una entruga
  interesante pa los m\u00e1s veteranos del movimientu que tuvieron f\u00edos nes
  \u00faltimes d\u00e9cades. N\u00f3s fac\u00e9moslo agora porque ye angua\u00f1o
  cuando somos pas. Quiciabes esto si se ficiera primero diba funcionar perfectamente,
  pero nun sali\u00f3 d\u2019ellos. Igual porque-yos paeci\u00f3 m\u00e1s prioritariu
  centrase n\u2019otres fasteres. Lo que s\u00ed ta claro ye que g\u00fcei hai mozos
  de treinta a\u00f1os que falen asturianu porque en casa falaben asturianu\u201d.\\n\u201cLa
  tresmisi\u00f3n xeneracional ye la base de la llealt\u00e1 lling\u00fc\u00edstica,
  y la llealt\u00e1 lling\u00fc\u00edstica ye la base d\u2019un procesu de recuperaci\u00f3n\u201d\\nDavid
  Guardado ye fil\u00f3logu, y sabe desplicar de manera cenciella los mecanismos sociales
  que tan detr\u00e1s del funcionamientu d\u2019un idioma como ferramienta de comunicaci\u00f3n:
  \u201cLa tresmisi\u00f3n xeneracional ye la base de la llealt\u00e1 lling\u00fc\u00edstica,
  y la llealt\u00e1 lling\u00fc\u00edstica ye la base d\u2019un procesu de recuperaci\u00f3n.
  Un procesu de recuperaci\u00f3n nam\u00e1s tien sent\u00edu real si parte de los
  derechos y los intereses d\u2019unes persones que tienen esa llingua como daqu\u00e9
  propio. Nun ye lo mesmo la reivindicaci\u00f3n de los derechos de les muyeres fecha
  por paisanos que poles propies muyeres, anque seya perimportante tami\u00e9n la
  participaci\u00f3n de los homes. Ta perbi\u00e9n defender la tresmisi\u00f3n de
  la llingua asturiana, pero si la llingua nun se fala, diba ser too una gran mentira.
  Y esi ye \u00fan de los peligros que tenemos agora, que se corte la tresmisi\u00f3n
  xeneracional. Lo qu\u2019hai que facer ye que l\u2019asturianu se fale, y d\u2019eh\u00ed
  ye d\u2019onde parte la llealt\u00e1 lling\u00fc\u00edstica\u201d.\\nP\u2019acabar,
  Guardado fae la reflex\u00f3n que sintetiza la raz\u00f3n de ser de Reciella, y
  con ello, la de la mayor parte de la socied\u00e1 asturiana que tien inter\u00e9s
  en que la llingua tradicional d\u2019esta tierra nun se pierda:\u201cHai qu\u2019asumir
  que somos una minor\u00eda nun entornu pocu propiciu, que nun cuenta colos mecanismos
  afayaizos pa llograr una educaci\u00f3n billing\u00fce. Hai qu\u2019asumir que nun
  los tenemos y que mientres siguimos lluchando por tenelos, hai qu\u2019actuar nel
  d\u00eda a d\u00eda. Y nel d\u00eda a d\u00eda lo que tenemos ye esto, nenos con
  un a\u00f1u, dos o tres que tenemos que consiguir que falen asturianu. Y ye a lo
  que tamos\u201d.\"", "\"Gobernador de Xibraltar\\nEl gobernador de Xibraltar (n''ingl\u00e9s:
  Governor of Xibraltar) ye''l representante del la Corona brit\u00e1nica nel territoriu
  Brit\u00e1nicu d''Ultramar de Xibraltar. El gobernador ye nom\u00e1u pol monarca
  a propuesta del Gobiernu del Reinu Xun\u00edu. Act\u00faa de facto como un xefe
  d''Est\u00e1u y ye el responsable del nomamientu formal del ministru principal de
  Xibraltar, seg\u00fan del restu de los miembros del gobiernu gibraltare\u00f1o una
  vegada celebraes les eleiciones. Tien la responsabilid\u00e1 nel territoriu sobre
  segurid\u00e1 y defensa.\\nEl gobernador dende 2013 ye sir James Dutton, quien asocedi\u00f3
  al vicealmirante sir Adrian James Johns.\\nGobernadores de Xibraltar[editar | editar
