  teng\u00e1is un bon 2007!\\n-\\nBon a\u00f1u pa toos!!!\\n15.2\u00baC agora y cielu
  engorrionau\\nTa Llueu :drink:\"", "\"Bilordios Filol\u00f3xicos, por Ram\u00f3n
  d''Andr\u00e9s\\nEntemez d''espresiones idiom\u00e1tiques (III) (16/06/03)\\nNesta
