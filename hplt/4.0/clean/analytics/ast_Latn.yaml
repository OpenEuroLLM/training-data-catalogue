  atenci\u00f3n primaria, POLA sal\u00fa mental !!\"", "\"Noticias\\n-\\nLes grabaciones
  de los coros d''aull\u00edes de llobos dexen determinar la presencia de cachorros
  nes menaes\\n18 de Mayu 2016\\nL''estudiu, nel que particip\u00f3 la Universid\u00e1
  d''Uvi\u00e9u, ufierta una ferramienta d''utilid\u00e1 p''analizar el estatus reproductivu
  de les menaes\\nLes menaes de llobos emiten vocalizaciones conoc\u00edes como coros
  d''aull\u00edes. Los sos son\u00edos pueden revelar la esistencia de cachorros mientres
  la d\u00f3mina de reproducci\u00f3n y, poro, son d''utilid\u00e1 pa determinar el
  estatus reproductivu de les menaes. La estructura ac\u00fastica d''estos coros ye,
  sicas\u00ed, complexa y discriminar la presencia de cachorros al travi\u00e9s de
  les sos aull\u00edes ye dif\u00edcil inclusive pa observadores esperimentaos.\\nUn
  estudiu llev\u00e1u a cabu por investigadores de la Unid\u00e1 Mista d''Investigaci\u00f3n
  en Biodiversid\u00e1 y el Departamentu de Matem\u00e1tiques, dambos de la Universid\u00e1
  d''Uvi\u00e9u, l''Institutu Cavanilles de Biodiversid\u00e1 y Biolox\u00eda Evolutiva,
  de la Universid\u00e1 de Valencia, y l''empresa ARENA S.L. evalu\u00f3 la utilid\u00e1
  del anal\u00eds de les grabaciones de coros d''aull\u00edes pa identificar la presencia
  de cachorros. El trabayu foi public\u00e1u na revista PLOS ONE.\\nVicente Palacios,
  del Institutu Cavanilles de Biodiversid\u00e1 y Biolox\u00eda Evolutiva, esplica
  que pa llegar a estes conclusiones analiz\u00e1ronse 110 coros d''aull\u00edes emit\u00edes
  por llobos ib\u00e9ricos nos que se conoc\u00eda la composici\u00f3n del grupu,
  incluyida la presencia o ausencia de cachorros. L''estudiu revel\u00f3 que la distribuci\u00f3n
  de la enerx\u00eda ac\u00fastica de los coros concentrar a frecuencies m\u00e1s
  altes cuando los cachorros participen nellos. Asina, por aciu la creaci\u00f3n de
  modelos matem\u00e1ticos, llogr\u00f3se predicir con \u00e9situ la presencia de
  cachorros nun coru nel 94% de los casos analizaos.\\nL''investigador Jos\u00e9 V.
  L\u00f3pez-Bao, de la Unid\u00e1 Mista d''Investigaci\u00f3n en Biodiversid\u00e1
  de la Universid\u00e1 d''Uvi\u00e9u, a\u00f1ede que l''anal\u00eds cuantitativu
  de los coros d''aull\u00edes ye un m\u00e9todu oxetivu, precisu, de f\u00e1cil implementaci\u00f3n
  ya independiente de la esperiencia del observador. \\\"Toes estes ventayes son especialmente
  relevantes nel casu de siguimientos de poblaciones de llobu a gran escala o cuando
  hai munchos observadores arreyaos\\\", comenta. Ello ye que esta metodolox\u00eda
  y\u00e1 s''implement\u00f3 apocay\u00e1 nos siguimientos de poblaciones de llobu
  llevaos a cabu nel Parque Nacional de los Picos d''Europa, la comunid\u00e1 aut\u00f3noma
  de Galicia y na estimaci\u00f3n nacional de menaes de llobu realizada nel periodu
  2012-2014, promovida y coordinada pol Ministeriu d''Agricultura, Alimentaci\u00f3n
  y Mediu Ambiente.\\nReferencia:\\nDecoding Group Vocalizations: The Acoustic Energy
  Distribution of Chorus Howls Is Useful to Determine Wolf Reproduction. PLOS ONE.
  4 de mayu de 2016.\\nVicente Palacios, Jos\u00e9 Vicente L\u00f3pez-Bao, Luis Llaneza,
  Carlos Fern\u00e1ndez, Enrique Font.\\nSemeya de portada: vencida pol investigador
  Juan Carlos Blanco.\"", "\"Villarmentero de Campos\\nVillarmentero de Campos ye
