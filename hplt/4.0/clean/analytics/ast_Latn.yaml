  Legal | Pol\u00edtica de privacidad | Pol\u00edtica de cookies | Consentimiento
  de cookies | RSS | Sobre RTPA | Entidad adherida a AUTOCONTROL\"", "\"Formaci\u00f3n
  estelar\\nLa formaci\u00f3n estelar ye''l procesu pol cual grandes mases de gas
  que s''atopen en galaxes formando estenses nubes moleculares nel mediu interestelar,
  dacuando denominaes como \\\"guarder\u00edes estelares\\\" o \\\"rexones de formaci\u00f3n
  estelar\\\", colapsen pa formar estrelles. Como ca\u00f1a de l''astronom\u00eda,
  la formaci\u00f3n estelar abarca l''estudiu del mediu interestelar y de les nubes
  moleculares xigantes como precursores pal procesu de formaci\u00f3n de les estrelles,
  l''estudiu de protoestrellas, oxetos estelares mozos y seg\u00fan los sos productos
  inmediatos. Ta estrechamente rellacionada cola formaci\u00f3n planetaria, otra ca\u00f1a
  de l''astronom\u00eda. La teor\u00eda de la formaci\u00f3n estelar, seg\u00fan la
  contabilid\u00e1 pa la formaci\u00f3n d''una sola estrella, debe tami\u00e9n tener
  en cuenta les estad\u00edstiques de les estrelles binaries y la funci\u00f3n de
  la masa inicial.\\nEn xunu del 2005 los astr\u00f3nomos apurrieron evidencies pa
  estrelles de la Poblaci\u00f3n III na galaxa Cosmos Redshift 7 en z = 6.60. Ye probable
  que tales estrelles esistieren nel universu primixeniu (esto ye, con alta fana escontra''l
  collor\u00e1u), y pueden empezar la producci\u00f3n d''elementos qu\u00edmicos m\u00e1s
  pesaos qu''el hidr\u00f3xenu que son necesarios pa la posterior formaci\u00f3n de
  planetes y vida tal como la conocemos.\\nNube molecularEditar\\nLa teor\u00eda actual
  sobre la formaci\u00f3n estelar, sostien que la formaci\u00f3n estelar dar nes nubes
  moleculares xigantes. Estes nubes contienen, b\u00e1sicamente, hidr\u00f3xenu molecular
  H2 (90%) y heliu (9%), ente que la bayura d''otros elementos depende fundamentalmente
  de la hestoria de nube, como por casu la esplosi\u00f3n de dalguna supernova nes
  cercan\u00edes de la nube. Son rexones fr\u00edes (10-30 K) y trupes (10\u00b3-10\u2074
  part\u00edcules/cm3) con dimensiones que varien ente 10 y 100 parsecs. Les nubes
  moleculares nun son estructures uniformes y el gas y el polvu dientro d''elles distrib\u00fayese
  a lo llargo d''estructures filamentosas bien complexes con zones d''alta densid\u00e1
  que se correspuenden con rexones de formaci\u00f3n estelar. La mayor fonte d''informaci\u00f3n
  alrodiu de les nubes moleculares provien del anal\u00eds de llinies d''emisi\u00f3n
  de mol\u00e9cules como''l CO, CS o NH3, a pesar de que''l mayor constituyente de
  les nubes s\u00eda''l H2. Esto debe a les altes temperatures necesaries pa escitar
  esta molecular (~ 510K), ente que les nubes son bien fr\u00edes.\\nCuanto m\u00e1s
  grande ye la nube molecular m\u00e1s curtia ye la so vida. Esto debe a que nel interior
  de les nubes moleculares m\u00e1s grandes f\u00f3rmase estrelles de tipu O y B qu''emiten
  fotones d''alta enerx\u00eda que destr\u00fain les mol\u00e9cules.\\nPuede describise
  aprosimao la complexa estructura de les nubes moleculares en t\u00e9rminos de nubes,
  clumps y nucleos (cores) protoestelares. Los clumps representen les estructures
  dientro de les cualos f\u00f3rmense los cumulos estelares, ente que los cores protoestelares
  representen les estructures m\u00e1s peque\u00f1es dientro de les cualos f\u00f3rmense
  estrelles individuales o grupos d''estrelles. Estes \u00faltimes estructures formar
  pola fragmentaci\u00f3n de los clumps.\\nEnt\u00e1 angua\u00f1o nun s''entiende
  dafechu c\u00f3mo se formen les estrelles deb\u00edu al colapsu de trupos nucleos
  de gas. [ensin referencies]\\nPor cuenta de dalguna clase de desencadenante, estos
  nucleos vu\u00e9lvense inestables gravitacionalmente, estaz\u00e1ndose y colapsando.
  Los fragmentos pueden dir dende decenes hasta centenares de mases solares. La causa
  de la inestabilid\u00e1 suel ser el frente de choque de dalguna esplosi\u00f3n de
  supernova o''l pasu de la nube por una rex\u00f3n trupa, como los brazos espirales.
  Tami\u00e9n puede asoceder qu''una nube abondo masiva y fr\u00eda colapse por sigo
  mesma. Seya como quier, la resultancia siempres ye una rex\u00f3n colapsante en
  cayida llibre. Dicha rex\u00f3n ye primeramente tresparente a la radiaci\u00f3n
  polo que la so compresi\u00f3n va ser pr\u00e1uticamente isoterma. Tola enerx\u00eda
  gravitatoria va emitir en forma de radiaci\u00f3n infrarroxo. Per otra parte, el
  centru de la rex\u00f3n va contraese m\u00e1s apriesa que''l gas circundante por
  tener el primeru mayor densid\u00e1. Asina, va estremase un nucleu m\u00e1s trupu
  llam\u00e1u protoestrella.\\nInestabilid\u00e1 de JeansEditar\\nLa teor\u00eda de
  la fragmentaci\u00f3n y colapsu gravitatoriu de nubes moleculares pola so propia
  graved\u00e1 foi desenvuelta por James Jeans alredor del a\u00f1u 1902 y anque na
  actualid\u00e1 los procesos de formaci\u00f3n estelar conocer con muncha mayor precisi\u00f3n[ensin
  referencies] la teor\u00eda de Jeans constit\u00fai una bona primer aproximamientu.\\nJeans
  calcul\u00f3 que so determinaes condiciones una nube molecular pod\u00eda contraer
  por atracci\u00f3n gravitatoria. Solo fa\u00eda falta que fuera lo suficientemente
  masiva y fr\u00eda. Una nube estable, si estr\u00fayese, aumenta''l so presi\u00f3n
  m\u00e1s r\u00e1pido que la so graved\u00e1 y retorna bonalmente al so est\u00e1u
  orixinal. Pero si la nube supera cierta masa cr\u00edtico ent\u00f3s se inestabilizar\u00e1
  toa y va colapsar en tol so volume. \u00c9sti ye''l motivu pol cual les inestabilidaes
  suelen producise nes nubes m\u00e1s grandes dando llugar a biltos intensos de formaci\u00f3n
  estelar.\\nNesti escenariu cl\u00e1sicu, ent\u00f3s, una nube empieza a colapsar
  cuando la enerx\u00eda gravitacional de la nube ye m\u00e1s grande que la so enerx\u00eda
  t\u00e9rmica:\\nPal casu d''una nube homox\u00e9neo y esf\u00e9rico con masa M,
  temperatura T y radio R, esta condici\u00f3n puede espresase como:\\nonde, G ye
  la constante de gravitaci\u00f3n universal, k ye la constante de Boltzmann, ye''l
  pesu molecular mediu y ye''l pesu del \u00e1tomu d''hidr\u00f3xenu. Esta desiguald\u00e1
  espr\u00e9sase de normal en funci\u00f3n de la llamada masa de Jeans, seg\u00fan
  la cual el colapsu gravitacional empieza cuando:\\nonde ye la densid\u00e1 del gas
  y ye la densid\u00e1 numb\u00e9rica.\\nN''ausencia d''un soporte por presi\u00f3n,
  el colapsu por graved\u00e1 dar nun tiempu de cayida llibre:\\nPa los valores t\u00edpicos
  atopaos nes nubes moleculares ( , ), at\u00f3pense valores t\u00edpicos pa la masa
  de Jeans de y del tiempu de cayida llibre de .\\nEl tama\u00f1u de la nube en colapsu
  llograr por aciu el radiu de Jeans: . Asina, cuando dientro d''una nube molecular
  esiste llocalmente una rex\u00f3n de ciertu tama\u00f1u con una masa abondo alzada
  de gas, el colapsu gravitatoriu d''esa rex\u00f3n de la nube va ser inevitable.
  Sicas\u00ed, esisten otros mecanismos capaces de frenar el colapsu de la nube y
  aumentar la masa de Jeans. Ente ellos, el principal ye la presi\u00f3n t\u00e9rmica
  del gas (y\u00e1 que la nube nun s''atopa a densid\u00e1 o temperatura constante),
  anque esisten otros como los movimientos sistem\u00e1ticos na nube (la rotaci\u00f3n
  exercer\u00eda una fuercia centr\u00edfuga qu''espandir\u00eda''l gas), o la turbulencia.\\nProtoestrellaEditar\\nLa
  masa, primeramente homox\u00e9nea, acaba per formar una esfera de gas nel centru.
  Dicha esfera contr\u00e1ise m\u00e1s apriesa estrem\u00e1ndose del restu de la nube.
  Esta estructura ye l''embri\u00f3n estelar denomin\u00e1u protoestrella. A pesar
  de la compresi\u00f3n del gas la so densid\u00e1 ye, ent\u00e1, demasi\u00e1u baxa
  y la radiaci\u00f3n sigue escapando llibremente. Por ello, la esfera apenes aumenta
  la so temperatura hasta al cabu d''unos cientos de miles d''a\u00f1os. El cuerpu
  ent\u00f3s t\u00f3rnase opacu a la radiaci\u00f3n y empieza a calecer mientres se
  contraer. Ello ye que la met\u00e1 de la enerx\u00eda gravitatoria perdida nel colapsu
  sigue radi\u00e1ndose pero la otra met\u00e1 y\u00e1 s''invierte en calecer la protoestrella.
  La temperatura aumenta hasta que la presi\u00f3n de la esfera compensa l''atracci\u00f3n
  gravitatoria d''\u00e9sta. Estabil\u00edzase, asina, un nucleu convectivo del tama\u00f1u
  de X\u00fapiter, aprosimao, al cual v\u00e1se-y amestando m\u00e1s y m\u00e1s materia
  procedente de la nube circundante que cai m\u00e1s amodo. Al a\u00f1edir m\u00e1s
  masa''l nucleu compensar amacer\u00e1ndose ent\u00e1 m\u00e1s. N\u00e9l el tresporte
  t\u00e9rmicu por radiaci\u00f3n ent\u00e1 nun ye eficiente una y bones el cuerpu
  ta form\u00e1u por material escasamente ionizado que detien a los fotones.\\nEl
  procesu prosigue hasta llegar a unos 2.000 grado momento nel cual les mol\u00e9cules
  de hidr\u00f3xenu se disocian nel nucleu. Agora la creciente enerx\u00eda gravitatoria
  invertir en tresformar el gas molecular nun gas form\u00e1u por \u00e1tomos llibres.
  El nucleu amac\u00e9rase cada vez m\u00e1s y la so radiaci\u00f3n cada vez m\u00e1s
  intensa escita''l trupu gas de la envoltura que cai sobre \u00e9l. Agora''l mediu
  y\u00e1 nun ye tresparente a la radiaci\u00f3n y solo apr\u00e9ciase''l gas qu''arrodia
  a la protoestrella. Esti gas foi conformando, pasu ente pasu, un discu de acrecimiento
  por cuenta de la rotaci\u00f3n inicial de la nube orixinaria (ver formaci\u00f3n
  de discos de acrecimiento). L''acreci\u00f3n de materia prosigue, per mediu d''un
  discu circunestelar. En dichu discu pueden aniciase planetes y asteroides si la
  metalicid\u00e1 ye lo suficientemente alta. La materia a\u00f1edida a la protoestrella
  aumenta la masa y, poro, la so graved\u00e1, polo qu''\u00e9sta reacciona estruy\u00e9ndose
  m\u00e1s, aumentando asina la so temperatura. Cuando cay\u00f3 gran parte del gas
  el mediu vu\u00e9lvese tresparente a la lluz de la protoestrella qu''empieza, ent\u00f3s,
  a ser visible.\\nEl nucleu de la protoestrella non solo acaba por ionizar los sos
  elementos si non que cuando les temperatures son lo suficientemente altes, empieza
  la fusi\u00f3n del deuteriu. La presi\u00f3n de radiaci\u00f3n resultante fai m\u00e1s
  lentu''l colapsu del material restante pero nun lu detien. El so nucleu sigue estruy\u00e9ndose
  m\u00e1s y la protoestrella sigue acretando masa. Nesta etapa prod\u00facense fluxos
  bipolares, un efeutu que se debe, probablemente, al momentu angular del material
  que cai. El procesu sigue asina hasta que s''empecipia, finalmente, la ignici\u00f3n
  del hidr\u00f3xenu en redol a los 10 millones de graos. Ent\u00f3s la presi\u00f3n
  aumenta dr\u00e1sticamente xenerando fuertes vientos estelares en forma de fluxos
  bipolares (remexos protoestelares, jets protoestelares) que barren y espulsen el
  restu del material envolvente. La nueva estrella estabilizar en equilibriu hidrost\u00e1ticu
  y entra na secuencia principal na que va trescurrir la mayor parte de la so vida.\\nPero
  si''l cuerpu ta per debaxo de les 0,08 mases solares el procesu va albortase mui
  a tiempu fren\u00e1u pola presi\u00f3n de los electrones dexeneraos ensin llegar
  ent\u00e1 a encender l''hidr\u00f3xenu. L''oxetu va detener la so contraici\u00f3n
  y va esfrecese nun tiempu de Kelvin, unos pocos millones d''a\u00f1os pa convertise,
  finalmente, nuna nana marr\u00f3n.\\nFormaci\u00f3n d''estrelles supermasivasEditar\\nLes
  etapes del procesu t\u00e1n bien defin\u00edes pa estrelles que la so masa ye aprosimao
  igual o menor que la masa del Sol. Pa mases mayores, la duraci\u00f3n del procesu
  de formaci\u00f3n estelar ye comparable a les otres esguiles de tiempu de la so
  evoluci\u00f3n, muncho m\u00e1s curties, y el procesu nun ta tan bien defin\u00edu.
  De dalguna manera cr\u00e9ese que la ignici\u00f3n del hidr\u00f3xenu empezar\u00eda
  abondo primero que la estrella llegara a amestar la so masa total. Otra gran parte
  de la masa m\u00e1s esterior ser\u00eda non solo barrida ya impulsada escontra l''espaciu
  interestelar sin\u00f3n tami\u00e9n fotoionizada pola so intensa radiaci\u00f3n
  dando llugar a les rexones HII. Seya como quier la vida d''estes estrelles ye tan
  curtia, del orde de cientos o inclusive decenes de millones d''a\u00f1os, qu''en
  tiempos cosmol\u00f3xicos nin siquier esisten. La so formaci\u00f3n, vida y destrucci\u00f3n
  son procesos bien dram\u00e1ticos nos qu''apenes si hai descansu.\\nS\u00e1bese
  que la opacid\u00e1 aumenta cola metalicid\u00e1 una y bones los elementos cuanto
  m\u00e1s pesaos absuerben m\u00e1s los fotones. Esto traduzse nun mayor emburrie
  per parte de los vientos estelares de les estrelles supermasivas que, coles metalicidaes
  actuales de la galaxa, nun llogren concentrar m\u00e1s de 120-200 MSol. Esti emburrie
  torga, a partir de ciertu puntu, que la estrella siga acretando masa, por eso, les
  estrelles m\u00e1s probes en metales pueden llegar a mases mayores. Cr\u00e9ese
  que les primeres estrelles del universu, bien probes en metales, podr\u00eden habese
  form\u00e1u con mases de dellos cientos de mases solares d''hidr\u00f3xenu y heliu.\"",
  "\"Enciclopedia Espasa\\nEnciclopedia Espasa, tami\u00e9n conocida como Enciclopedia
  Espasa-Calpe, que''l so nome orixinal ye Enciclopedia universal ilustrada europ\u00e9u-americana,
  ye la gran enciclopedia espa\u00f1ola del sieglu XX, continuadora d''anteriores
  proyeutos, como la Enciclopedia del editor Francisco de Paula Mellado Enciclopedia
  moderna: Diccionariu universal de lliteratura, ciencies, artes, agricultura, industria
  y comerciu de 29 tomos, con ap\u00e9ndices posteriores hasta llegar a los 39 tomos,
  o la primer enciclopedia moderna en m\u00faltiples volumes publicada en llingua
  espa\u00f1ola, el Diccionariu Enciclop\u00e9dicu Hispanu-Americanu de la Editorial
  Montaner y Sim\u00f3n, public\u00e1u en 26 volumes ente 1887 y 1899.\\nConten\u00edu\\nHistoria[editar
  | editar la fonte]\\nLa Enciclopedia Espasa foi''l proyeutu m\u00e1s ambiciosu de
  la Editorial Espasa (fundada por Jos\u00e9 Espasa Anguera en 1860), que se fundi\u00f3
  en 1926 cola Editorial Calpe, de Nicol\u00e1s Mar\u00eda de Urgoiti, y y\u00e1 como
  Editorial Espasa-Calpe, integrar en 1991 nel Grupu Planeta. L''oxetivu yera publicar
  una obra de consulta enciclop\u00e9dica en llingua espa\u00f1ola, qu''am\u00e1s
  de cubrir les conocencies y meyores cient\u00edfiques, art\u00edstiques y teunol\u00f3xicos,
  coles mesmes incluyera la hestoria, biograf\u00edes, xeograf\u00eda, artes, lliteratura
  d''Espa\u00f1a y Hispanoam\u00e9rica. Les sos principales novedaes respeuto de les
  enciclopedies decimon\u00f3niques espa\u00f1oles y estranxeres fueron l''amenorgamientu
  del tama\u00f1u de los sos volumes y l''incorporaci\u00f3n intensiva de fotograf\u00edes
  ya ilustraciones en blancu y negru, seg\u00fan ll\u00e1mines en color.\\nLa decisi\u00f3n
  de la so publicaci\u00f3n tomar nel a\u00f1u 1905. La obra principal publicar ente
  1908 y 1930, compuesta por 70 volumes en 72 tomos (los volumes 18 y 28 contienen
  dos tomos cada unu, denominaos primer parte y segunda parte). A la cual ami\u00e9stase-y
  ente 1930 y 1933 un Ap\u00e9ndiz de 10 volumes como una forma d''actualizaci\u00f3n
  de los volumes anteriores. L''actualizaci\u00f3n peri\u00f3dica de la obra realizar
  por mediu de Suplementos, dende 1934 y xeneralmente bia\u00f1ales, que correspuenden
  a actualizaciones de la obra principal y de los Ap\u00e9ndices. Estos a la fecha
  son 37 volumes (38 tomos). El m\u00e1s reci\u00e9n ye''l Suplementu 2011-2012, public\u00e1u
  en 2013; el cuartu volume, tres el Suplementu 2003-2004, ye alfab\u00e9ticu en cuenta
  de tem\u00e1ticu.\\nEn 1983 publicar el Index 1934-1980, volume que ye l''\u00edndiz
  de conten\u00edos incluy\u00edu nos suplementos ente 1934 y 1980, actualiz\u00e1u
  en 1997 col Ap\u00e9ndiz A-Z, nun volume, y reemplaz\u00e1u en 1998 pol Index 1934-1996.\\nEn
  total, nel a\u00f1u 2012, la Enciclopedia Espasa cuenta con 119 volumes -122 tomos-
  (escluyendo''l Index 1934-1980 por redundante), y seg\u00fan c\u00e1lculos realizaos
  polos sos editores, m\u00e1s de 180.000 p\u00e1xines, 210 millones de pallabres,
  197.000 ilustraciones en negru, 4.500 ll\u00e1mines en color, 5.000.000 cites bibliogr\u00e1fiques
  y 100.000 biograf\u00edes.\\nEn 2005 public\u00f3 por motivos comerciales un segundu
  Ap\u00e9ndiz 1934-2004, calidable deficiente -una y bones actualizaba nam\u00e1i
  parcialmente''l Ap\u00e9ndiz 1934-2002, public\u00e1u un par d''a\u00f1os antes-,
  llam\u00e1u Complementu Enciclop\u00e9dicu, en 8 volumes, present\u00e1u pola editorial
  como formando parte d''una \u00abnueva\u00bb Enciclopedia Espasa, que nun tar\u00eda
  y\u00e1 formada por 126 tomos (tolos publicaos hasta 2005, menos el Index 1934-1980),
  sin\u00f3n nam\u00e1i por 90 (pos a efeutos editoriales prefieren prescindir agora
  de los 34 tomos de Suplementos 1934-2004, m\u00e1s el Index y l''Ap\u00e9ndiz A-Z,
  y reconstruyir la obra como formada polos 72+10 tomos hist\u00f3ricos y los 8 nuevos).\\nSup\u00f3n,
  poro, una noved\u00e1 qu''una editorial, cuasi cien a\u00f1os dempu\u00e9s de la
  so publicaci\u00f3n, siga ufiertando nel merc\u00e1u una enciclopedia en 90 tomos,
  la mayor parte de los cualos t\u00e1n redactaos y publicaos primeramente nes primeres
  d\u00e9cades del sieglu pas\u00e1u. Anque los cambeos err\u00e1ticos de los \u00faltimos
  a\u00f1os provocaron un notable desconciertu ente los propietarios y usuarios de
  la enciclopedia, ent\u00e1 non estenu, al desconocese la pol\u00edtica editorial
  que va siguir Espasa-Calpe nel futuru.\\nEl sieglu de la Espasa[editar | editar
  la fonte]\\nEn 2005, con motivu del centenariu del entamu de la so ellaboraci\u00f3n,
  formando parte del Suplementu 2003-2004, public\u00f3se un volume conmemorativo
  titul\u00e1u El Sieglu de la Espasa, qu''incl\u00fai la hestoria de la Enciclopedia
  y una antolox\u00eda d''art\u00edculos. Edit\u00f3se una nueva Gran Espasa Universal:
  Enciclopedia Multimedia, adaptaci\u00f3n de la Enciclopedia Espasa-Calpe al Sieglu
  XXI, qu''incl\u00fai material editao, correx\u00edo y actualizao de la Enciclopedia
  orixinal del sieglu XX m\u00e1s informaci\u00f3n nueva del presente sieglu, consistente
  en 24 Volumes m\u00e1s 1 DVD (o 10 CD-ROM, dependiendo de la opci\u00f3n que se
  prefiera) con m\u00e1s de 160.000 entraes, 10.000 ilustraciones y 1.500 dossieres
  tem\u00e1ticos, seg\u00fan archivos de videu, son\u00edu, animaciones 3D y otra
  serie de conten\u00edos nel DVD; y un Portal de Conocencia n''internet qu''apurre
  un serviciu d''atenci\u00f3n personaliz\u00e1u por aciu consultes similar al corr\u00e9u
  electr\u00f3nicu, posibilid\u00e1 de realizar consultes en tiempu real, accesu a
  consultes a 9 diccionarios Espasa, una cronolox\u00eda universal tem\u00e1tica,
  una seici\u00f3n d''aprendizaxe en llinia y un serviciu d''actualizaci\u00f3n permanente
  de los art\u00edculos enciclop\u00e9dicos y de los conten\u00edos acad\u00e9micos.\\nAdicionalmente,
  public\u00f3se la que ser\u00eda la \u00faltima reimpresi\u00f3n de los 72 volumes
  orixinales de la Enciclopedia, la Edici\u00f3n Conmemorativa pa Coleccionistes,
  presentando''l nuevu conxuntu global de la obra como compuestu por 90 volumes: los
  72 orixinales del primer terciu del sieglu XX, los 10 del primer ap\u00e9ndiz y
  m\u00e1s 8 tomos d''un nuevu ap\u00e9ndiz dispuestos nos alboreceres del sieglu
  XXI, el Ap\u00e9ndiz 1934-2004. Esti nuevu complementu busca enllazar direutamente
  cola obra que qued\u00f3 rematada nos primeros a\u00f1os de la Rep\u00fablica, onde
  los miles y miles de p\u00e1xines de los suplementos publicaos mientres les d\u00e9cades
  del Franquismu y los tr\u00e9s primeres de la Restauraci\u00f3n Borb\u00f3nica queden
  reemplazaos por ella, siguiendo onde la hab\u00eda dex\u00e1u atayada la Rep\u00fablica.
  D''esta edici\u00f3n conmemorativa public\u00e1ronse solamente 999 colecciones,
  numberaes, acompa\u00f1ando los 90 tomos con Memorabilia Especial consistente nun
  conxuntu de 10 ll\u00e1mines (reproducciones d''una selecci\u00f3n d''obres publicitaries
  del fondu art\u00edsticu de la editorial Espasa amestaes a la hestoria de la enciclopedia);
  una Plancha d''Impresi\u00f3n de les utilizaes pa la producci\u00f3n d''el so primeres
  999 p\u00e1xines; una Escultura ba\u00f1ada en bronce (6 tomos de la enciclopedia
  recostados sobre una base con una lleenda sobre la edici\u00f3n conmemorativa) realizada
  como homenaxe a esti finxu de la cultura universal, tami\u00e9n numberada y que''l
  so molde foi destruy\u00edu; y el DVD Historia de la Espasa, un Mitu de la Cultura
  Universal, sobre la hestoria de la Enciclopedia, realiz\u00e1u con filmaciones y
  semeyes in\u00e9dites, de gran valor hist\u00f3ricu, rescataes de los archivos de
  la editorial, presentaos nun elegante estoxu dise\u00f1\u00e1u siguiendo la cl\u00e1sica
  imaxe de los volumes de la Espasa, de llombu negru y lletres doraes.\\nVolumes[editar
