  comments\\nVous devez \u00eatre connect\u00e9(e) pour r\u00e9diger un commentaire.\"",
  "\"Bayyinaama \u00f1alnde talaata 20 abril wonde \u00ab Idiriis Deebi Itnoo, gonnoo\u0257o
  hooreejo leydi Caad sankiima caggal nde gaa\u00f1ii e hare nde ardinoo feewde e
  murtu\u0253e ummorii\u0253e to leydi Libi \u00bb. Nde wonde Idiriis Debi Itnoo (IDI)
  ina aadorii kala nde leydi mum yanaa (Caad ina heewi buklet baklet) o dadoo haa
  tii\u0257a, o ardoo konu, o faloyoo a\u00f1\u0253e, sabu e ko o heewi wiyde \u00ab
  tawde ko o soofa e nder konu, ko o deennaa\u0257o leydi, so tawii woodi ko jeemii
  ndi, woodani mo ko falaade \u0257um \u00bb. Kono ngol laawol ko heen o heddii.\\nJubbande
  see\u0257a e daartol politik Caad.\\nLeydi Caad, no yoga e ley\u0257eele men, jeyanoo
  ko e tiimaandi kolo\u00f1aal Farayse gila e hitaande 1900 caggal pel\u0253ondiral
  hakkunde kolo\u00f1aal Farayse e harbiyanke Sudaannaajo daraninoo\u0257o tiimde
  leydi ndii e nokku biyetee\u0257o Kuseeri sara wuro Njamenaa hannde ngoo. E\u0257en
  poti teskaade noon e oon yonta ko wiyetee hannde Caad koo, feccitinoo ko e laamuyon
  njonkon e gardagol lawakoo\u0253e, ma a taw nii ko \u0257um saabii ca\u0257eele
  \u0257e leydi ndii hawri e poo\u0257ondire politik yontaa\u0253e nokku oo e pollugol
  laamuuji. Leydi ndii he\u0253i jeytaare mum ko \u00f1alnde 11 ut 1960, caggal nde
  nanondiri \u0257um e leydi Farayse. Adii ardaade leydi ndii ko Faransuwaa TOMBALBAYE
  haa hitaande 1975.\\nKo e maayir\u0257e 1965 ca\u0257eele Caad pu\u0257\u0257ii,
  sabu ko ndeen hare \u0253esngu fu\u0257\u0257ii e cosgol fedde wiyeteende FROLINAT
  siforteende no murto le\u01b4\u01b4i rewankooji aarabee\u0253e (sabu hiisaade \u0253e
  wonde ko le\u01b4\u01b4i worgankooji \u0257ii njoo\u0257ii e jappeere laamu nguu
  e ballal leydi Farayse). Law Tommbalbaay hawri e ca\u0257eele ummoraade e murtooji
  le\u01b4\u01b4i rewo \u0257ii, tee\u014bti noon e le\u00f1ol Tubu en e gardagol
  Hisen Haabere, ko e nder nduun i\u00f1curu woodi pel\u0253ondiral joli e nder konu
  Caad, laamu Tommbabaay follaa, o waraa e hitaande 1975, lomtiimo ko Seneraal FELIX
  MAALUM, oon ne \u0253ooyaani heen, sabu e hitaande 1979 o woppiri Hisseyni Habre
  laamu, gollodii\u0257o Gukkunii Wedey hay so wonaa e belaa\u0257e makko, murto rewankoo\u0253e
  doolnii no feewi, \u0257um ko e wolde adannde e nder Njamenaa.\\nE ballal leydi
  Libi e yarahmu Muammaar Kaddaafi, e hitaande 1980, e nder wolde \u0257immere e nder
  Njamenaa Gukkuni Wedey, folli laamu Hisen Haabere, fooli jaadii\u0257o mum, lomtii
  kono e hitaande 1982 maa Hisen Haabere rutto e laamu caggal nde riddi Gukkuni e
  ballal konu Farayse. Caggal nde laamu Libi ronki dentingol leydi Libi e Caad, ngu
  etiima jiimde Caad, kono \u0257um laataaki sabu \u01b4aa\u00f1gol konu Farayse haa
  addani konu Caad riiwtude konu Kaddaafi haa e lefol lollirngol AOUZOU, \u0253e la\u014bki
  \u0253e calii yaltude.\\nKo e hitaande 1990 Idiris Debi ne lomi yolnde caggal nde
  ummini wolde, riddi Hisen Haabere. Laamu Habre e dumunna mum woyaama no feewi sabu
  ceddugol mum, daranii\u0253e hakkeeji aadee limtanii mo bonanndeeji keew\u0257i
  : le\u0253te ; warkoyeeji, porlugol jawdi \u0253esngu, kasooji tee\u014bti noon
  wonande luulndii\u0253e laamu makko. O wattindi ko dogde (o nawori dimle jawdi,
  kaalis e cibooji) o mooloyii Kameruun caggal \u0257uum to Senegaal. Ko toon \u00f1aawirde
  bonaandeeji adunankoore (C.P.I.) rullini mo, o \u00f1aawaa, o ta\u01b4anaa kaso
  kaa\u0257di nguurndam.\\nIdiriis Debii e laamu mum\\nDuu\u0253i capan\u0257e tati
  hikka ko o laamii ma a taw ko manndaa jeego\u0253o mo o hebornoo fiileede oo, woni
  mo jigaani mo, sabu ko caggal bal\u0257e \u0257i\u0257i laaw\u0257ingol poolgu makko
  e woote hooreleydaagu \u0253ennu\u0257o oo, o hawri e lajal to o yahnoo faloyaade
  murto wo\u0257ngo. Laamu Idiriis Debii seertaani no feewi e laamu Hisen Haabere,
  ngu maantorii ko lankugol e laamu, le\u0253tugol luulndii\u0253e e boomde \u0257um
  en, wuuranaade le\u00f1ol mum e \u0253esngu mum e moo\u0253de jawdi ko aldaa e happu.
  E ngu joofaa no feewi e baasgol hormaade jojjan\u0257i aadee.\\nMartaba IDI \u0253uri
  mawnude ko e nder ley\u0257eele Afrik, tee\u014bti noon e\u0257e Saahel \u0257ee,
  sabu o hiisaa hannde ko o kanndal wonande \u0257een ley\u0257eele, baaw\u0257o falaade
  musibbaaji beeyooji e mum en : o da\u0257ndii Mali e bonannde jihadiya\u014bkoo\u0253e,
  o helii ger\u00f1e Bokku Haraam to Niijeriyaa, o faddiima jihadiya\u014bkoo\u0253e
  to Niseer, jiidaani noon o eeraama e ley\u0257eele keew\u0257e (Santarafrik, Konngo
  ekn) yo o ar o walla laamuuji mum en no nda\u0257iri. So tawii ko goonga, Caad ina
  jogii konu tigi rigi, yim\u0253e suus\u0253e, harbiya\u014bkoo\u0253e, jogitii\u0253e.
  Ina walliti \u0257um iwdi le\u01b4\u01b4i \u0257ii e golwole \u0257e \u0253e nguuri
  gila leydi ndii he\u0253i jeytaare mum, ina rokki \u0253e tigi rigi humpito hare
  e karallaagal njogitaaje. Leydi Farayse ka\u00f1um woni \u01b4aa\u00f1gal tii\u0257ngal
  wonande laamu IDI walla nii mbiyen ndi mee\u0257aa ittude junngo mayri e fiyakuuji
  leydi Caad gila ndi he\u0253i \u00ab jeytaare \u00bb mayri sabu teski-\u0257en ko
  kala dille ummii toon, maa en nan heen Farayse so tawi nii wonaa kayri sakkii. E\u0257en
  teskii kadi ley\u0257eele keed\u0257e ndi rewo \u0257ee (Libi e Sudaan) ina mba\u0257ti
  e mayri hakkille, tee\u014bti noon e Libi e jamaanu laamu Kaddaafi, tawde endi etoo
  nii diwde keerol ngam fawde e mayri junngo (lefol Aouzou).\\nPoo\u0257ondiral hakkunde
  \u0257ee ley\u0257eele \u0257i\u0257i battinii tigi rigi e nguurndam Caad, ha\u0257ii
  ndi dee\u01b4re etee saabii \u0257um fof ko ngaluuji pee\u00f1\u0257i, maa \u0257aminaa\u0257e
  ina kebori aggiteede e nder leydi. So tawii Farayse ina faami \u0257um gila nde
  tiimi nokku oo, Kaddaafi ina tiimi nii leydi ngal\u0257undi, kono sabu mum yi\u0257de
  hoonaade e nokku hee e nder Afrik kala, mawmawu mum ina diwti aadi. Ko \u0257um
  wa\u0257i en teskaade laaminoo\u0253e Caad kala ndeftii ko gooto e laam\u0253e maa
  Libi walla Farayse tee\u014bti noon e Farayse haa yettani maa battindii\u0257o oo,
  hono IDI.\\nSaahal, Caad e Farayse\\nSahaal ko nokku mo leydi Farayse wa\u0257ti
  hakkille mum tigi rigi, gaagaa wonde \u0257um \u01b4a\u014borgol da\u0253\u0253ol
  hakkunde tiimaale mum ley\u0257e Magreb e ley\u0257e Afrik bannge worgo, ko nokku
  oogir\u0257e mooftu\u0257e oogaa\u0257e katojinaa\u0257e hannde e aduna oo tee\u014bti,
  kala paw\u0257o heen junngo mum maa hoono e nder aduna oo, tee\u014bti noon e nder
  ley\u0257e hirnaange \u0257ee. Ko \u0257um wa\u0257i deeyre ko e ngo\u01b4a dowrowa
  hannde leydi Farayse e nder nokku hee sabu faggudu \u01b4ellitaako \u0257o deeyre
  alaa, kono kadi dawrugol leydi Farayse e kitaale 2011 feewde e Libi e warngo Kaddaafi
  addii pusgu Libi gonnoo\u0257o \u00ab saare korndolli \u00bb jihadiya\u014bkoo\u0253e
  walla mbiyaa terorist en, \u0253e nda\u00f1aano \u01b4uu\u00f1de koye e laamu makko.
  Nguun pusgu sari ka\u0253ir\u0257e bon\u0257e e yoga e ley\u0257eele sawndooji nokku
  oo haa yettoyii e won nokkuuji pooccii\u0257i e nder Afrik bannge worgo (Libi ko
  leydi \u0253urnoondi faggaade ka\u0253ir\u0257e toos\u0257e), \u01b4aa\u00f1gol
  leydi Farayse IDI e Caad ko joo\u0257toraade ko nguun konu tan waawi falaade ownoo\u0253e,
  da\u0257nda Saahal.\\nMaayde IDI e kapan\u0257e Caad\\nWiya wonde \u00ab IDI sa\u014bkii
  ko caggal gaa\u00f1an\u0257e \u0257e he\u0253noo e hare nde da\u00f1dunoo e murto
  ummorinoongo libi (FACT : Maalde ngam lomlomtondiral e Kawral to Caad) e nder diwaan
  Kanem \u00bb. Ngoon murto noon ngo Mahamat Mahdi Ali ardii (jeyaa ko e le\u00f1ol
  Hisen Haabere en) ina tuumaa ko Khalifa Haftaar (mo leydi Farayse ngemmbi) gardii\u0257o
  murto to leydi Libi \u01b4aa\u00f1i ngo, en tawii \u0257oo kadi \u0253arakke Farayse
  no aadorinoo e luure e nder leydi Caad, so ngemmbude kala mo \u0257aminii \u0253uri
  waawde heedannde \u0257um e nafooje mum e nokku hee.\\nSo tawii \u0257um laatiima,
  hol ko aldi Farayse e IDI ? Hollitaama gila e hitaande 2017, IDI ko caltii\u0257o
  wonde kuutorgal ma\u0253\u0253e e nder dawru\u0257i mayri e nokku hee, ko \u0257um
  wa\u0257i o ja\u0253aani wallitde pollugol laamu Justin Tuedra to Santarafrik (ngu
  laamu Farayse itodtaako) haa oon nii fiiltanaa lefol go\u0257ngol e manndaa mum
  \u0257immo. IDI \u00f1i\u014bii no feewi fedde OTAN (ley\u0257eele Erop kuuf\u0257e
  geec atlantik) nde o tuumi ko kam \u201cfusi leydi libi, wari Muammaar Kaddaafi\u201d
  (so malol sa\u00f1tii jubol tiinde\u2026) etee e miijo makko, ko \u0257uum saabii
  i\u00f1curu hannde e nder sahaal e koonagol jihadiya\u014bkoo\u0253e. \u018aum addani
  heew\u0253e wiyde wonde ko wa\u0257i Caad koo, ko kuudetaa. Ine nanndi heen tawde
  doosgal leydi yowaama, mo doosgal ngal rokkunoo mbaawka so hooreejo leydi nattii
  he\u0253aade, ko hooreejo Asammbele lomtotoo \u0257um haa wooteeji nju\u0253\u0253inee,
  kono oon jo\u00f1aama, sukku\u0253e mo miijaaka, militeer en tafii goomu mum en
  \u201cyo ardo laamu nguu e cabbagol wooteeji pot\u0257i yu\u0253\u0253ineede \u0257oo
  e lebbi 18\u201d, \u0253e ngardini nguun goomu ko \u0253iyum IDI, Seneraal Mahamat
  Debi. Ko haawnii koo kay, ko Farayse e wo\u01b4eede yo \u201cDoosgal leydi horme,
  kuudetaaji karmine\u201d dillaani, diwii \u0257oon nii wii \u201cina teskii wonde
  laamu sabbordu ndu no fu\u0257\u0257orii ina feewi\u201d ina \u0257aminii \u201c\u0253ooyataa
  siwil en ke\u0253ta laamu e juu\u0257e militeer en\u201d. \u201cfeew\u0253e juu\u0257e\u201d
  ina mbiya IDI waraaka e nder wolde, ko soldatee\u0253e mum mbari \u0257um etee Farayse
  humpaaka \u0257um, so tawii kay \u0253e cakkaaki les (\u0257um ko miijo am). \u018aum
  ina \u0257e\u0253a siftinde en warngo Kabila to Konngo, \u0253iyum lomtii \u0257um
  e jappeere.\\nMaayde IDI jibinii faayre e nder Caad e diwaan Saahal kala sabu amo
  wa\u0257anoo yaakaare mawnde ngam falaade jihaadiya\u014bkoo\u0253e re\u0253oo\u0253e
  ina telloo \u0253ee, murto Mahamat Mahdi wiinoo\u0253e ina \u0253uu\u0253na see\u0257a,
  ina keblanii haaldeede njaltii e \u0257uum tawde \u0253e mbii \u201cko Debi go\u0257\u0257o
  ari\u201d, luulndo leydi ndii inan ha\u0253oo ko \u0253e kiisii ko \u201ckuudetaa\u201d
  koo, \u0257uum fof firti tan ko leydi Caad ina hulanaa nde ruttotoo e aadaaji mum
  pel\u0253ondiral \u0253esngu mum e i\u00f1curu mawndu e duu\u0253i paa\u0257i.\\nMaamuudu
  H. Joob\"", "\"Ardiido Lesdi America Joe Biden mani tiinaaje Ardiido Lesdi Naajeeriya
  Muhammadu Buhari dow ko Laarani shaanu siyaasa haa Lesde Africa.\\nArdiido on suuditi
  haalakan wakkati be wadanno giidal mabbe jee Ardiibe Lesde Africa ko hewtani 6 subaabe
  marde cubi 2023 garooji haa Lesdi America.\\nBiden wi O larti noka waari iga 2015
  cubi warki jotta on wadi O mani ardiido Lesdi Naajeeriya.kadima O tefri ummaatoore
  Lesdi Naajeeriya bee Ardiido on besda waduki ko haandi ngam Laamu dimocradiyya tabita
  haa giifakan.\\nArdiido on Lamsika bee wiiki Giidal mabbe wadaama bee Ardiibe ben
  bana mo Democratic Republic of the Congo, Gabon, Liberia, Madagascar, enanta Sierra
  Leone ngam be meta dowko laarani haala Cubi gadeteedi haa Lesde Mabbe.\\nSADIQ ALFA\"",
  "\"[Giza] (/ \u02c8\u0261i\u02d0z\u0259/ ; Wonnde wakkitire no winndira Gizah ,
  Geeza; misrankoore Arabic: \ufe9f\ufef4\ufeb0\ufe93 el-G\u012bza , misrankoore Arabic
  noddirte: [el \u02c8gi\u02d0ze] ) un de \u0257ii\u0257awre gallure mawde \u0257er
  leydi Misra \u0253aawoo Cairo e nayiire \u0257er galluje mawde \u0257er Afrik \u0253aawo
  [Kinshasa],l[Lagos]],e [Cairo] . \u018ain \u0257e kapital \u0257un [Giza] hukumaare
  hauti e \u0257uu\u0257irka yimm\u0253e fittugo haa no \u0257un 9.2 miliyanji ede
  2021. E\u0257um \u0257i jottori e ta \u0257e [Nile]3mi fombina cakare [Cairo]e un
  a \u0253ann\u0257u \u0257un mau\u0257um \u0257e [Cairo] ge\u0253\u0253al. Giza jottori
  less \u0257e 30km (18.64mi) woyla \u0257um memphis(menefer) latti\u0257e kapital
  artungal dun [Egypt diiwe gada nyal\u0257e \u0257un \u0257e artuude pharaoh Narmer\\nAppearance\"",
  "\"Ngomnati Lesdi Germany wii kuude hurguti gannudi hijirbe dum hunnde on jee kawtal
  koppi ngam non Lesdi Germany enanta Naajeeriya hhudan.\\nHaalakan wurti haa hunnduo
  hooreejo Lesdi Germany, Olaf Scholz bawti giidal maako bee ardiido Lesdi Naajeeriya
  Tinubu,.\\nScholz besdika bee wiiki ndini haa giidal bananiido hebaama hakkunde
  Lesde den woodi laabka ko tammi tokkuki baawo.\\nadded that debates were ongoing
  on the migration and very soon the gray areas will be addressed.\\nScholz Kadima
  wi kampaniiji haa Lesdi Germany kewdum yidi wada rufayontaaku ha Lesdi Naajeeriya
  hedi ko laarani shaanu nyibaali musamman kuude Laabi laanaaje lesdi.\\nNon ardiido
  Lesdi Naajeeriya Bola Ahmed Tinubu anndimo down der ardungal maako do hebbini bee
  gidaadi kuude Luumooku ko waddata jahargal yeeso Lesdi Naajeeriya.\\nArdiibe ben
  meti duudka ko waddata jahargal yeeso hakkunde Lesde den 2.\\nSADIQ ALFA\""]'
