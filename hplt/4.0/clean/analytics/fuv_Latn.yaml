  lattati\u0257un ba \u0257iyam jemma kautu\u0257an gelle dari un wolde komoye e komoye
  e gelle Kabul den bo e \u0253urdun \u0257uu\u0257uki e gattuti woyla e woyla faaro
  hirna lesdi \u0257un. Nanoo\u0253e bolle dari \u0257un ko \u0253ene lasgi e \u0257un
  noddira\u0253e forsiwan.\\nPashto kanuun woni bolle Pashtu \u0257un usl haidan \u0257ud\u0253e
  eder ma\u0253\u0253e e \u0253e ekkito bolle Pashto. Hai dai fuu enon Pashtus \u0253e
  lattake \u0253e \u0253urgo \u0257uu\u0257uki e siyasawal Afganistan \u0257uu\u0253i
  aru, aru. Dari lattake wolde \u0257e \u0257un \u0253uri yi\u0257uuki wolwiro\u0253e
  bolle dari \u0253e nyaari 78% \u0257un yim\u0253e leydi \u0257in (Litlz) e wiigo
  CIA World Factbook yim\u0253e \u0253e \u0257un hoo\u2019ata e jonde wolde leydi
  \u0257un enon bo wolde \u0253e e wolde dari \u0253e nyaari 78% \u0257un yim\u0253e
  lesdi \u0257in \u0257en ham\u0253e \u0257uri hooshi e dau bolle leydi \u0257un \u0257enbo
