  nyau COVID-19 e 17 Ogos 2021 to Dar es Salaam e duu\u0253i 81 wakkati nyau COVID-19
  nder Tanzania.\"", "\"Afganistan\\n''Afganistan ko \u0253ia Daulaji Jul\u0253e \u0257un
  Afganistan un lesdi e in\u0257e hakku\u0257e e fombina ge\u0253al Aasiya. E \u0257un
