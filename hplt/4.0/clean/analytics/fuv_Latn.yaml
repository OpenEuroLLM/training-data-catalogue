  Template:Election box end\"", "\"Spain\\nSpain wujodu jeyaa\u0257o nji\u0257o kawru\u0257o
  to Europe, to gaziyaa\u0257o Iberia. Ko tadii cuu\u0257i ko\u0257ini ko teema Andorra
  e France to dow e Portugal to kelle. Spain wujodu ngol bonnude kahoonandi mum, wiyde
  Felipe VI e bonnere mum. Adunaire ma\u0253\u0253e mbi\u0257aa a Spain ko Kastilan,
  e maayre jeyde ko Madrid. Spain wujodu kesal bonnude 47 miliyo\u014beeba ndee, kod\\nNguurndam\\nAs
  maabu hay sohore mum Spain woto yafemeende, wonde haalaaji tolow leydiingu. Tuufre
  temperatuur fu Madrid, leydiingo fandude, ngalawani 5-10 graduNgal toppito\\n- Bayugol
  kala woni hammee jom Fulah, hannde majaade ama kareti. Baanagol njoyta\u0253ol yi\u0257de
  kataa denee ko Fulannde. Bayyagol yi\u0257de si\u0257iyankoo ko mosntaara baanagol
  yi\u0257de i manndi, ko mooftinfu\u0257e wo insaaniwo. Njogii paainde haa naamnii:\\n-
  Ja\u0253\u0253orgo garowol\u0257o mba\u0257o Donkij\u0257o, eteeje newaare tiindan\u0257e,
  finndu\u0257e, new\u0257i, nde \u0253ennii wo cakkiti mbojji ye\u00f1ataa finndu\u0257i-\u0257i\\n-
  Ja\u0253\u0253orgo siinin \u0257o jim\u0257iree dakka cayor maa \u0257oo ko new\u0253eekoppen
  mbe\u0257u woto etee\u0253e e nguu Ful\u0253e mbe\u0257u maa. Mbeedti haa-alaa jogaade
  majaade to ma\u0253\u0253e mbe\u0257u rewaade e gaada ndi\\n- Ja\u0253\u0253orgo
  Ba\u0257aagaa, to woni new\u0253e-laare mooftii\u0257o Jaabaaru maa, wonataa eteeje
  wa\u0257de UNESCO\\n- Mandanka to \u0257ee njegumaa paainde maa, duka Jantoo maritoo
  laatii maa galle si\u0257o, wonataa Costa del Sol tawa Barseloo\\n- Ja\u0253\u0253orgo
  \u0253\u00f6\u0253\u0253e hono cayor \u0257o maa mo\u01b4\u01b4irtaade Mbarate ndi,
  jogaade tammbereetu ndi eteeje ko won\u0253e jim\u0253eere wo \u00f1ippere daa\u0253tunde
  maa\\n- Ja\u0253\u0253orgo \u0257oo\u0257oo Garayndaafamiliaa, hono kaddu\u0257u
  kala Barcelona, jahdi heew\u0253e Gaudi usnde\\n- Mohi halgande to ma\u0253\u0253e
  maa, hono paella wo laajo\u00f1aaji, wooti\u0253e tapas (rekke mbeestee\u0257e)\\n-
  Ko natee, paainde maa hiraa lollintee\u0257e haa baanee. Ko mooftinfu\u0257e wo
  ani a\u0257a ndo \u00f1emtote woni etee\u0253e, jimre maa e cimo, walla baddante
  mo\u01b4\u01b4aandi so\u0257\u0257itaade haa ji\u0257iree jaaba nde m\u0257i.\"",
  "\"Hikka kadi, Fedde \u0181amtaare Pulaar he Muritani mawninii, \u0257o jo\u0257nde
  mum \u0257oo, \u00d1alawma winndereejo \u018aemngal neeniwal, \u00f1alnde alet 21
  feebariyee 2021. Hade \u0257uum, \u00f1alnde aset 20, nulaa\u0253e cate jeegom (6)
  F\u0181PM gon\u0257o he Nuwaasoot, kam e yonaa\u0253e pelle \u0257i\u0257i (2) janngunoo\u0253e
  e du\u0257e \u01b4eewndor\u0257e Du\u0257al \u018aem\u0257e ngenndiije, ndentii
  ngam heblaade ko faati e Dallinannde pelle pinal \u0257ee, e heblude \u00d1alngu
  nguu. Cofte tati e\u0253\u0253anoo heen : wejo defte, gaafgol tappir\u0257e Pulaar
  e kollitgol dallinannde ndee.\\nHuunde e hooree\u0253e teddungal fedde ndee, ko
  wayi no Sammba Joom Bah, Hammadi Sukki Mbooc, Mammadu Siley Bah, Umaar Idiriisa
  Saawo, e Aamadu Umar Jah, kam e hoohoo\u0253e wo\u0257\u0253e, ko wayi no Doktoor
  Alasan Jah \u0257em\u0257iyanke, e yim\u0253e heew\u0253e wo\u0257\u0253e, nootiima
  e kewu nguu. Udditi \u00f1alngu nguu ko konngol hooreejo F\u0181PM, hono Bookara
  Aamadu Bah, \u0257o o siftini daartol \u00d1alngu nguu, kam e nafoore wonnde e janngingol
  sukaa\u0253e he nder \u0257em\u0257e mum en neeniije gila e fu\u0257\u0257oode,
  e himme maw\u0257o mo UNICEF rokki \u0257uum, Caggal \u0257uum, hooree\u0253e teddungal
  kam e hooree\u0253e pelle wo\u0257\u0253e e jagge tawtoranoo\u0257e \u0257ee, kam
  e almud\u0253e janngunoo\u0253e he du\u0257e \u01b4eewndor\u0257e yu\u0253\u0253u\u0253e
  e nder fedde Belaa e fedde almu\u0253\u0253e Umar Demmba Jallo, mbaawii seedtaade
  nafoore ja\u014bde \u0257emngal neeniwal. E\u0257en mbaawi wiyde kadi nafoore mawnde
  he\u0253aama e \u00f1alawma hee sibu heew\u0253e ngaafanaama tappir\u0257e Pulaar
  e telefo\u014baaji mum en e ordinateruuji mum en, tee \u0257uum maa wallit cargol
  binndol \u0257emngal ngal.\\nHe kitaale \u0253ennu\u0257e cakkitii\u0257e \u0257ee,
  ko pelle pinal Pulaar, Sooninke e Wolof keewnoo mawnininde \u00f1alawma oo, kono
  hikka, sabu ha\u0257de woodnde ndee, sabu \u00f1awu covid-19, fedde fof yu\u0253\u0253ini
  pottital ko to jo\u0257nde mum tan, kono kam \u0257e mbaa\u0257ii yaltinde bayyinaango
  ngam tee\u014btinde \u0257a\u0253\u0253aande laaw\u0257ingol \u0257em\u0257e Pulaar,
  Soninke e Wolof, kam e naattingol mum en nder Tippudi Nehdi e Ja\u014bde leydi ndii.\\nKonngol
  hooreejo F\u0181PM\\nMusi\u0253\u0253e bismaa\u0253e, hooree\u0253e teddungal, banndiraa\u0253e
  teddu\u0253e,\\nHono no nganndir-\u0257on nii, Dowlaaji \u0257ii kam e Unesco ine
  mawnina hitaande kala \u00d1alawma winndereejo \u0257emngal neeniwal mo UNESCO laaw\u0257innoo
  \u00f1alnde 21 feebariyee hitaande 2000.\\nHono no aduna oo fof nii, Pelle pinal
  ngenndiije, hono ARPRIM, AMPLCS, APROLAWO ine mawnina hitaande kala, duu\u0253i
  keew\u0257i jooni, oo \u00d1alawma ngam semmbinde laamu Muritani waylude Tippudi
  Nehdi e Ja\u014bde leydi ndii, haa tuugnoo he ja\u014bde denndaangal \u0257em\u0257e
  men ngenndiije.\\nMawningol oo \u00d1alawma ummorii ko Bangladesh nde polis e konu
  Dowla Pakistaan jiimnoo\u0257o oon sahaa Bangladesh, pelli yim\u0253e haaloo\u0253e
  \u0257emngal Bengali seppantunoo\u0253e hakkeeji mum en to bannge \u0257emngal,
  to Daka. \u00d1alnde kewu ngadanu nju\u0253\u0253inanoongu, Koolaa\u0257o Kuu\u0253al
  Ngenndiije dentu\u0257e oon sahaa, hono Kofi Anan, wiyiino wonde oo \u00f1alawma
  ine foti addande \u0253esnguuji kala finande faayiida coomii\u0257o he \u0257em\u0257e.
  O wasiyii yim\u0253e fof yo \u0253eydu darnde ngam hisnude \u0257em\u0257e sabu
  mum en wonde ndonaandi/ngalu winndere ndenndaandi.\\n\u00d1alngu nguu mawniniraa
  hikka ko tiitoonde \u00ab Semmbinde keewal \u0257em\u0257e ngam naatnugol he nder
  ja\u014bde e renndo \u00bb. Ngu hawri ko e ca\u0257eele tee\u014btu\u0257e \u0257e
  \u00f1awu Covid-19 kuu\u0253todinngu addi he winndere ndee, naatni jii\u0253ru bonndu
  nder tippule ja\u014b\u0257eele \u0257ee, tee\u014btini jo\u00f1gol dente renndo
  keew\u0257e, \u0253eydi \u0253urondire.\\nMusi\u0253\u0253e teddu\u0253e, e miijo
  UNESCO, Nehdi e ja\u014bde tuugiindi he \u0257emngal gadanal walla \u0257emngal
  muuynangal foti fu\u0257\u0257oraade ko gila e gaggaa\u0253e, sibu ko ndeenka kam
  e nehdi e ja\u014bde gaggaa\u0253e woni ngooroondi ja\u014bde. E nder \u0257uum,
  UNESCO hollitii dalillaaji keew\u0257i tee\u014btinooji ja\u014bde tuugiinde he
  \u0257emngal neeniwal/nokkuwal. E\u0257en mbaawi limtude heen :\\n\u2013 Denndaangal
  humpitooji e wi\u0257tooji ba\u0257aa\u0257i, jowitii\u0257i he ja\u014bde tuugiinde
  e \u0257emngal neeniwal, ine kollita wonde sukaa\u0253e \u0253uri yaawde janngude
  ko e \u0257em\u0257e mum en neeniije. Ko \u0257uum addani UNESCO semmbinde, gila
  1953, ja\u014bde \u0257emngal neeniwal he tolno ja\u014bde leslesre. Unesco limtii
  humpitooji ba\u0257aa\u0257i he nder winndere ndee, haa tee\u014bti noon to Mali,
  to Papouasie Nouvelle Guin\u00e9e, to Peru, to Dental Dowlaaji Amerik (humpitooji
  \u0257i Unesco joganii duttor\u0257e), walla he nokkuuji go\u0257\u0257i he winndere
  ndee, to Gatemala, Burkina Faso, Ecopi, Filipiin, Afrik worgo, Kamaruun, RDC, Ruwannda\u2026
  E tonngol humpitooji da\u00f1aa\u0257i he nder ley\u0257e nay gadane limtaa\u0257e
  dow \u0257ee, ine wiyaa heen : \u00ab ko teskaa heen koo ine laa\u0253ti : ja\u014bde
  \u0257em\u0257i\u0257iire, tuugiinde he \u0257emngal neeniwal ine yuumtina no feewi
  je\u00f1tudi ja\u014bde almu\u0253\u0253e jeyaa\u0253e he dente \u0253uraa\u0257e
  keeweendi \u0257ee\u2026 Kadi \u00ab \u018aeen golle no mbaawi sa\u0257tude fof,
  humpitooji nay kaalaa\u0257i \u0257ii ine kollita wonde, so tawii ine yahdi e pellital
  e nju\u0253\u0253udi mo\u01b4\u01b4iri, ley\u0257eele \u0257ee kala ine mbaawi,
  so cu\u0253iima huutoraade ja\u014bde \u0257em\u0257i\u0257iire he nder \u0257emngal
  neeniwal, yenaneede gaddanaade almu\u0253\u0253e mum haaloo\u0253e \u0257em\u0257e
  \u0253uraa\u0257e keeweendi, nje\u00f1tudi ja\u014bde \u0253urndi mo\u01b4\u01b4ude
  fofof. \u00bb\\n\u2013 Hannde, golloo\u0253e ko faati he ja\u014bde fof ine kawri
  wonde \u00ab politikaaji kuutoragol \u0257em\u0257e nder ja\u014bde, lelnanoo\u0257i
  ko \u0253ooyi, \u0257o tuuganoo ngam wallitde \u0253amataare faggudu e renndo, \u0257iin
  politikaaji ngallii. \u00bb\\n\u2013 Ngenndiije aduna oo kuniima daranaade paandaale
  Ja\u014bde wonande yim\u0253e fof, kono e\u0257e nanndi e ca\u0257tu\u0257e, walla
  nii \u0257e ngaa\u0253notaako yetteede \u0257oo e hitaande 2030. Harallee\u0253e
  ke\u0253tinii wonde ko yahraa yeeso feewde e paandaale EPT ngam mo\u01b4\u01b4ingol
  ja\u014bde e jaajtingol kattan\u0257e ja\u014bde wonande goomuuji jo\u00f1aa\u0257i,
  \u0253uraa\u0257i \u00ab njonaani tee njaawaani ngam waawde \u0257oftaade lajal
  dottangal ngal, haa tee\u014bti wonande ley\u0257e Afrik worgo Saharaa kam e dowlaaji
  Arab. \u00bb Nii woni, huunde e harallee\u0253e ja\u014bde mbiyi wonde ley\u0257e
  jogoytoo\u0257e farta\u014b\u014be yettaade paandaale EPT ko ley\u0257e \u0257e
  ja\u014bde mum en tuugnii he \u0257emngal neeniwal janngoowo oo, tan.\\n\u2013 Yim\u0253e
  ine \u0253eydoo \u00f1alnde kala yeneneede faayiida keewal \u0257em\u0257e e pine
  he nder renndo, haa tee\u014bti noon e sahaa \u0257o pine e \u0257em\u0257e kulanaa\u0257e
  majjude \u0253eydotoo heewde \u00f1alnde kala. Ja\u014bde he nder \u0257emngal neeniwal
  ko huunde waawnde wallitde hisnude pine kulanaa\u0257e majjude, tee ine rokka mo
  woni kala feere ngam tee\u014btinde, \u01b4ellitde, yuumtinde ne\u0257\u0257aagal
  mum.\\nMusi\u0257\u0253e teddu\u0253e, Humpito wo\u0257ngo ine woodi, \u0253urngo
  nii ma a taw \u0257ii humpitooji kaalaa\u0257i, yuumtude. So humpito da\u00f1anoongo
  he Muritani hakkunde 1979 e 1990 rewrude he Du\u0257al \u0257em\u0257e ngenndiije.
  Seede mum ko \u0253etooji \u0257i\u0257i \u0257i Breida kam e jaagordu ja\u014bde
  leydi ndii mba\u0257noo. Ngoo humpito ine yaajnaa no feewi he nder dallinannde pelle
  pinal, hono F\u0181PM, AMPLCS e APROLAWO. \u0181urii duu\u0253i 10 jooni ko \u0257ee
  pelle ceeraani e \u0257a\u0253\u0253ude hono ko UNESCO \u0257a\u0253\u0253ata gila
  1953 koo, so \u00ab naatnugol tabitngol \u0257em\u0257e neeniije nder Tippudi nehdi
  e ja\u014bde leydi ndii. \u00bb Wa\u0257i noon ko hannde, wi\u0257to hollitii haa
  laa\u0253ti cer wonde \u201c kuutoragol \u0257emngal neeniwal janngoowo ko huunde
  wa\u0257\u0257iinde ngam ekko yuumtungo \u201d. Noon fedde ndee wagginiri kadi \u00ab
  cu\u0253agol e dewgol tippudi ja\u014bde keew\u0257em\u0257iiri sibu julyultondiral
  kam e muuyaa\u0257e demokaraasi \u0257a\u0253\u0253ude he almu\u0253\u0253e \u0253ee
  margol mo\u01b4\u01b4ol, ko idii fof, \u0257em\u0257e mum en \u0257e muuyni \u0257ee
  tawo, kono kadi, margol \u0257em\u0257e maw\u0257e winndereeje e diiwaneeje ngam
  waawde yettaade renndo \u0253urngo yaajde e waawde jeytoreede no haanirta nii he
  aduna mo nguuri oo. \u00bb\\nOn njaaraama\"", "\"\u00d1alnde Talaata 21 Faabiriyee
  \u0253ennunde ndee, hooreejo ndenndaandi Tuunus Kayis Sayed yaltinii haala mawka
  sanne. O artiri konngol makko ko he ko o woowi so hollirde yim\u0253e fof ngoni
  ko he moojde ngam li\u0253de mo, o joopii uujankoo\u0253e won\u0253e nder Tuunus
  haa tee\u014bti he ummii\u0253e \u0253aleeri Afirik.\\nLeydi Tuunus ko ndenndaani
  ngonndi rewo Afirik, lommbiindi nder lompoodu hakkunde Alseri bannge hirnaange,
  e Libi bannge fu\u0257naage-worgo, e Maayo Mediteraane heedi rewo e fu\u0257naange
  (\u01b4eewee kartal ngal). Leydi ndii wiyetee ko Tuunus, laamorgo ngoo ne ko Tuunus
  inniraa. Gure mayri \u0253ur\u0257e lollude ko Biserta, takko mayo haa\u0257ngo.
  Ina heen kadi Kayruwaan mee\u0257noongo wonde wuro ngo \u0181alee\u0253e umminoo\u0253e
  Misra tuddinnoo. E\u0257en teskoo kadi ko he ngoo wuro Abdallahi ibn Yaasiin mo
  Maraabat en jeyaa. Wuro lollungo kadi ko Siidi Busid, \u0257o suka gorko Tunusnaajo
  hu\u0253\u0253unoo hoore ngam salaade baasal e kii\u0257al ngal laamu Ben Aali fawnoo
  he ma\u0253\u0253e haa jibini waklitere demminaare aarabee\u0253e.\\nEn njiyii he
  kartal hee Siidi Busid woni ko nehaande Tuunus. \u00d1alnde 17 desambar 2010, nder
  wuro Siidi Busid, Muhammad Busisi, jahroowo he duu\u0253i 26 tan, ina jogii taabel
  ina yeeya \u0253i\u0253\u0253e le\u0257\u0257e. Sahaa fof noon alkatee\u0253e ngara
  nawa taabel makko. Ko o calii\u0257o rokkude \u0253e ceede mbuu\u00f1aari. Heen
  gootol \u0253e ngari kadi \u0253e ndufi taabel makko, \u0253e nik\u00f1i njeeygu
  makko haa boni. \u018auum metti mo sanne, kono o alanaa \u0257um safaara. O soodi
  isaas e almet, o fayi joo\u0257ore tunndu (perfee), o yuppi e hoore makko isaas,
  o hu\u0253\u0253i jayngol, \u0253anndu makko nanngondiri wonti ooyre wootere. Jayngol
  \u00f1ifaa o fayraa safrirde, kono o sankii \u00f1alnde 4 saawiyee 2011. Ko \u0257oo
  demminaare Aarabee\u0253e fu\u0257\u0257ii, waklitere \u0253esngu haa yoo\u0253ii
  lammu Ben Aali e laamuuji aarabee\u0253e keddii\u0257i hono Misra e Siriya e Iraak.
  Leydi Tuunus wa\u0257i ko Aarbee\u0253e e \u0253e ngonaa Aarbee\u0253e, adii\u0253e
  \u0257oon joo\u0257aade hade mum en uujde ngabbii worgo. \u0181een goni \u0181alee\u0253e
  ar\u0253e gila he uujooji Misra haa yettii dahngooji ley\u0257e \u0181alee\u0253e
  worgo keerol peccol. Ina heen kadi Berbeer en adii\u0253e \u0257oon Aarabee\u0253e.
  Ina tawee he mayri iwdi Ruumnaa\u0253e e Turkinaa\u0253e gila nde diiwal ngal woni
  les njiimaandi ma\u0253\u0253e.\\nCiftinen he wiyde Sekene Moodi Siisoko, daartiya\u014bke
  \u014banaa mo leydi Mali, helemere \u201cafrik\u201d ndee ko leydi Tuunus hannde
  ndii wiyetenoo noon nde rewo Afrik ngoo fof woni he njiimaandi Ruumnaa\u0253e. O
  wiyi ko ruggiyanke Aarabe biyetee\u0257o \u201cFirikisha\u201d naati Magreb, hirnaange-rewo
  duunde Afrik hedde teeminannde 6\u0253ere caggal Annebi Iisaa. O ha\u0253i \u0257oon
  e Berbeer en ngam yi\u0257de halfude \u0253e. Kono o foolaa, o dogi o woppi yoga
  e jagge konu makko he juu\u0257e Berbeer en. \u018aum wa\u0257noo ko he diiwaan
  leydi Tuunus hannde ndii. Gila ndeen, ho\u0257\u0253e \u0257oon mbiyaa \u00ab Ifirikiyin
  \u00bb (yim\u0253e Ifirikisha). Leydi ndii inniraa \u00ab Ifirikiya \u00bb. Ndeke,
  ko diiwaan leydi Tuunus ndii wiyetenoo \u00ab Ifirikiya \u00bb. Ko nde Rumnaa\u0253e
  ngari njiimi rewo Afrik fof, gila Moretani (hedde Maruk e Alseri hannde), haa Tiripoliteen
  (hedde Libiya hannde), \u0253e inniri do\u014bre ndee fof \u00ab Ifirikiya \u00bb
  haa wontoyi Afrik.\\nCogge-cooge ujjankoo\u0253e\\nE wiyde Kayis Sayed, ko \u00ab
  cogge-cogge ujjankoo\u0253e suu\u0257ii\u0253e \u00bb caabii ca\u0257eele nder leydi
  Tuunus. A\u0253e mba\u0257a \u00ab golle kaantare \u00bb, ge\u0257e \u00ab baylooje
  mbaydi le\u00f1ol Aarabee\u0253e e diine Islaam \u00bb. O jokki o wiyi gonal ma\u0253\u0253e
  Tuunus ko \u00ab moojobere anniyiinde waylude ngonka le\u00f1ol Aarabee\u0253e e
  keeweendi mum nder leydi Tuunus \u00bb. Ndee haalannde bonnde nde Kayis Sayed \u01b4eesti
  yer\u0253inii yim\u0253e heew\u0253e haa arti e pelle \u0257e ngonaa laamuyankooje
  (ONG) nder Tuunus e hoore mum haa he caggal mum.\\nHayso \u0257ee kelme mettinii
  \u0253er\u0257e heew\u0253e, \u201c \u00f1aamankoo\u0253e \u201d ley\u0257e Orop
  mbeltiima heen. Hono hooreejo leydi Itali maa luulndiyanke bay\u0257o no Eric Semuur
  mo Farayse, daranii\u0257o miijannde moojobere nde \u0253e inniri \u201c grand remplacement
  \u201d woni \u201c lomto yaajngo \u201d. E wiyde ma\u0253\u0253e, uujoyankoo\u0253e
  nganniyii ko lomtaade \u0253esnguuji \u201c jeyi-leydi en \u201d ngam keewal mum
  en, mba\u0257ta \u0257um leydi \u0181alee\u0253e.\\nKayis Sayed holliti miijo ngoo
  ko he batu Diiso Kisal ngenndiwal. Ina yahdi e jeeyngal jaajngal a\u00f1amle\u00f1aagu
  nder geese renndo enternet e jaay\u0257e leydi Tuunus. Gila lewru siilo 2023, jogii\u0257o
  konngol laamu Tuunus, Kalifa Shibani, hollitiino nder yeewtere rajo heeriingo \u201c
  \u0253ee Afirikinaa\u0253e \u0253alee\u0253e inan pu\u0257\u0257oo heewde nder wuro
  Esfaksa \u201d. Ko adii \u0257uum jaamburee\u0253e, fotde 300 \u0181alee\u0253e
  Afiriknaa\u0253e njaggaama nder yontere wootere, cokaa sibu woytoraandu \u0253e
  ngalaa kaayitaaji jamirooji \u0253e joo\u0257aade he leydi hee. Moo\u0253e ONG keew\u0257e
  caaktii hare fotnde huccaneede he kaa \u201c haala nga\u00f1gu nguru \u0253anndu
  \u201d ka Kayis Sayed \u0253amti he innde mum.\\nRenndoyanke faraysenaajo Wincent
  Geisser, karallo ngonka ley\u0257e Magreb hollitii \u201c haala nga\u00f1amtumaagu
  feewde he uujoyankoo\u0253e e \u0181alee\u0253e Tunusnaa\u0253e\u201d ina woodnoo
  ko adii hannde. Ko gila ko \u0253ooyi. Hes\u0257i ngol laawol ko \u201c hooreejo
  leydi Tuunus e hoore mum fuybiima he \u0257ee bempe\u01b4\u01b4e nga\u00f1gu, wa\u0257ti
  \u0257e miijooji laamu ngam kisal e faa\u0257eende le\u00f1ol \u201d.\\nGorko biyetee\u0257o
  Kensa ben Asuus ko Tunusnaajo wi\u0257tiyannke renndo Tuunus, karallo le\u00f1amle\u00f1amaagu
  nder Tuunus, winndi wiyi \u00ab ge\u0257e a\u00f1amnguraagu ina teskanoo ko \u0253ooyi
  nder dingire dawrugol kono hooreejo leydi \u0253amtude \u0257e ko huunde hesere
  nder Tinus \u00bb.\\nNgonka mettuka\\nKamaruunaajo dilloowo he naatnaattondiral
  uuj\u0253e won\u0253e wuro Esfaksa to Tuunus, won ko haali nder geece renndo. O
  wiyi \u201c so en pawiima he ko pelle \u0257e ngonaa laamuyankooje (ONG) kaali,
  ko ina \u0253ura 30 haa 50 ujune ummii\u0253e \u0253aleeri Afrik ina tawee nder
  leydi Tuunus, kono alaa ko \u0253e ngoni so wonaa tata\u0253al uuj\u0253e \u0253ee
  fof tolnoytoo\u0253e he 0,5 % \u0253esngu Tuunus fof no woorunoo \u201d.\\nWa\u0257de
  noon yillii\u0253e won\u0253e Tuunus ina ngo\u0257\u0257i waawde \u00ab lomtaade
  \u00bb \u0253esngu Tuunus, helmere nde a\u00f1amnguree\u0253e kuutortoo to ley\u0257e
  Orop haa arti he Farayse. Nde fu\u0257\u0257ii fee\u00f1de nder Tuunus ko he \u0257ii
  duu\u0253i sappo \u0253ennu\u0257i.\\nHaa he kitaale 2000, Tuunus ko yawtirde tan
  wonnoo fayde Orop, kono hannde ina he uuj\u0253e joo\u0257ii\u0253e \u0257oon sabi
  yottaade Orop inan tan \u0253eydoo sa\u0257tude.\\nE wiyde Tunusnaajo Kensa ben
  Asuus, \u00ab \u0253uri heewde he wo\u0257\u0253e yillii\u0253e Tuunus ko janngoo\u0253e
  e gollotoo\u0253e golle muus\u0257e, kala ko Tuunus naftortoo to faggudu e to pinal.
  Kono jamirooje sariya e nju\u0253\u0253udi laamu u\u0253\u0253ii \u0253e, \u0253e
  mba\u0257ti lee\u0253teede he kala ge\u0257e bon\u0257e hono cangarte rew\u0253e
  mba\u0257taa kuutor\u0257e \u00bb.\\nHaalannde hooreejo leydi Tuunus fu\u0257\u0257iima
  jibinde ge\u0257e \u0257e mo\u01b4\u01b4aani sibu wonii heen gollatnoo\u0253e ko
  \u0253ooyi ndiiwaama tawa aldaa he ndaamordi. Wo\u0257\u0253e njaltinaama galleeji
  kasnoo he yamiroore \u00ab polis \u00bb. Ko he kaa ngonka mettuka \u0253alee\u0253e
  Afriknaa\u0253e ngoni nder leydi Tuunus.\\nGaagaa ge\u0257e jowitii\u0257e he uujan\u0253e
  Tuunus, pelle \u0257e ngonaa laamuyankooje tee\u014btinii to\u0257\u0257aa tan ko
  \u0253alee\u0253e. \u0181een \u0253alee\u0253e noon ko uuj\u0253e yamiraa\u0253e
  e suu\u0257ii\u0253e \u0253ee, janngoo\u0253e, hay nih \u0253alee\u0253e Tunusnaa\u0253e.
  Tunusnaa\u0253e njoobotoo ko \u0253alee\u0253e e kuu\u0253al, njotondiral ma\u0253\u0253e
  he ca\u0257eele kisal nder leydi ndii. So \u01b4eewaama bannge worgo leydi ndii,
  \u0253alee\u0253e Tuunusnaa\u0253e ina kii\u0257aa toon no feewi, \u0253e njaggiraaka
  nih ko he leydi hee \u0253e njeyaa. Ko teskaade Aarabee\u0253e ummii\u0253e ley\u0257e
  go\u0257\u0257e inan toon, hono Libiyaa e Misra e Lubnaan e Siriya e Iraak. Kono
  Kayis Sayed haalaani \u0253een.\\n\u201cMoojobere\u201d nde gasataa\\nHe fil\u00f1itere
  2011, leydi Tuunus yahriino tigi yeeso nder hare feewde e a\u00f1amle\u00f1amaagu
  e ndoolndoolaagu he waawnere. Ge\u0257e \u00ab banndiyaagal \u00bb keewiino haa
  walliti a\u00f1amle\u00f1amee\u0253e, ko wayi no Konngonaa\u0253e \u0257i\u0257o
  waranoo\u0253e he 2016, yanti e sar\u0257iyankoo\u0253e \u0257i\u0257o cakkiti sariya
  ka\u0253oowo e a\u00f1amle\u00f1amaagu, e nga\u00f1gu, e ceerundal. \u018auum fof
  e woodde addanaani ngonka kaa waylaade. Ko noon Hatem Nafti wiyi nde o holliri heerto
  (lannda) dawrugol bonngol gollortoo : heerto ngenndiiwo Tuunus he\u0253tinaama gila
  he hitaande 2018. Ko ngoo heerto ruttukeeciiwo caroowo miijooji nawtooji caggal
  e yiyde moojobbe he kala dille, caroowo miijooji \u00ab grand remplacement \u00bb.\\nHaalannde
  Kaysi Sayed haawnaaki\\nYim\u0253e fof ina ceedii leydi Tuunus woni ko he ii\u00f1curu
  mawndu, tee\u014bti to bannge faggudu e to renndo e to dawrugol. Ndeke Kayis Sayed
  won miijooji jogitii \u0257i o haalaani. O wa\u0257i uujiyankoo\u0253e ko woytoraarndu
  ca\u0257eele \u0257e leydi ndii jookii he nder mum. \u018aum wee\u0253anii mo, so
  joopaade ho\u0253\u0253e leydi, wonaa kay etaade \u00f1awndude sa\u0257\u0257a \u0253esngu,
  sompa mbaylaandi ittoori Tunusnaa\u0253e he heege e \u0257omka, naatna \u0257um
  en demokarasi.\\nIna he ca\u0257eele Tunusnaa\u0253e hannde yo\u0253de \u00f1amaale
  Kayes Sayed, \u0253eydagol njaru \u00f1ameele hono kosam e gawri e conndi mba\u0257irteendi
  mburu. Njaru ceede Tuunus (dinaar) ustiima ko ina tolnoo he 10% : firti ko kala
  ko jaratnoo 100 dinaar, jarata jooni ko 110. Siftorde Covid-19 e kareeli hakkunde
  Riisi e Ukreen ko woytoraandu tan. Kaa ngonka jeyi dallillaaji haalannde hooreejo
  Tuunus ngam suu\u0257de ca\u0257eele nderndere \u0257e \u0253e muti he nder mum
  en.\\nHeen sahaaji o joopotoo ko julankoo\u0253e tokos\u0253e \u0253e o wiyata ina
  moofta njeeygu mum en mbele \u0253esngu ina hey\u0257a, murta. Sahaaji go\u0257\u0257i
  ko jaayndiyankoo\u0253e, maa dente dawrugol maa pelle \u0257e ngonaa laamuyankooje
  \u0257e o wiyi ndaranii ko ley\u0257e janane.\\nHedde 9 lewu mbooy, o jokkondirii
  e Umar Siisoko Mbaalo gardii\u0257o fedde faggudu CEDEAO. O holliti mo haala makko
  ko ko waylaa, wa\u0257taa ko o haalaani. O wiyi ko o \u201cAfriknaajo etee omo faarnorii
  \u0257um\u201d. Kaa haala dow \u00f1ii\u01b4e ko haa wela \u0181alee\u0253e Afrik,
  kono o haalii o wa\u0257ii ko woni miijo makko.\\nKo he ndeen yontere o \u01b4etti
  sariya firtude diisnetee\u0253e ngalluuje (meeriiji), jooni ko kanko to\u0257\u0257otoo
  fotoo\u0253e ardaade ngalluuje nder Tuunus. \u018aum ko ke\u0253e gila he waklitere
  2011 nde \u0253esngu Tinusnaa\u0253e sompunoo. Ko woni yeeso da\u0257aani gite sibu
  ko nih Ben Aali fu\u0257\u0257orinoo hade mum riiweede.\\nKo ina tolnoo jooni e
  duu\u0253i \u0257i\u0257i, loowdi kala nde o haali ko wiyde won \u00f1ukkintoo\u0253e
  ngam yoolde Tuunus, doole ummii\u0257e caggal leydi. Hay sinno e\u0257en njenanaa
  \u0253ee uujiyankoo\u0253e ko woytoraandu tan, \u0253uri yaajde he haala makko ko
  sikkude yim\u0253e fof njiylotoo ko tel\u0253inde leydi Tuunus, ellee ko kam woni
  nehaande winndere. Laa\u0253ii noon Sayid Kayis (hayso innde makko ko hitowol Berbeer)
  anndaa daartol leydi Tuunus.\\nHoli KAYIS SEYID, Hooreejo leydi Tuunus ?\\nKayis
  Seyid, jibinaa ko 22 Colte (feebariyee) 1958 nder wuro Tunis. Iwdi galle ma\u0253\u0253e
  ko Beni Kiyaar en to diiwal Nabili fu\u0257naange-worgo wuro Tuunus. O resi ko biyetee\u0257o
  Ishraf Shebil, jeyaa\u0257o wuro Monastiir, \u0253e nda\u00f1dii sukaa\u0253e tato,
  rew\u0253e \u0257i\u0257o e gorko. Kayis Sayid janngii nder leydi Tuunus haa o he\u0253i
  ceedante toow\u0257e to bannge \u00f1aawooje. O jannginii haa 1999 nder du\u0257e
  toow\u0257e to Tuunus. Kono kadi o ardiima goomuuji keerii\u0257i to kuu\u0253al
  Maalde Aarabee\u0253e.\\nO winndii defte keew\u0257e jowitii\u0257e he \u00f1aawooje.
  O tawtoraama batuuji keew\u0257i nder Tuunus e boowal mum haa arti nde Maalde Aarabee\u0253e
  joo\u0257ii Nuwaasoot he 1997.\\nO fu\u0257\u0257ii naatde he \u201cwooteeji\u201d
  hooreleydaadal ko he 2019. Hay heerto dawrugol wooto o jeyanooka. Nde wonnoo omo
  teskoranoo nuun\u0257al, o yahdi hoore boowal ko Nabil Karawi mo o fooli nde o da\u00f1i
  to\u0253\u0253e 73 %. Caggal \u00f1abbu Covid-19, o rokki hoore makko mbaawka hooreejo
  leydi timmuka he 2021. O riiwi jaagor\u0257e laamu fof, o dartini golle suudu sar\u0257iyeeji
  hade makko mumtude \u0257um. Luulndii\u0253e e fanniyankoo\u0253e dawrugol njaggiri
  \u0257um ko follo laamu (kudetaa).\\nHe 2022, o winnditii doos\u0257e leydi kese
  teskoraa\u0257e wa\u0257tude mbaawka fof he juu\u0257e makko. O wa\u0257ti heen
  fayndaare nju\u0253\u0253udi leydi Tuunus fawii ko he diine Lislaam. Luulndii\u0253e
  \u0253ee noon ko salii\u0253e \u0257uum. E\u0257en ciftora gila he Habib Burgiba,
  Tuunus ko leydi caliinoondi renndinde diine e dawrugol, \u0257o debbo wellitaa sanne.
  Kayis Sayid firtii fof. Fanniyankko\u0253e kollii Kayis Sayid jeyaa ko he miijan\u0257e
  \u201c ngenndiyankaagal Arab \u201d, o fu\u0257\u0257ii tabitinde \u201cjeytaare\u201d
  leydi ley\u0257e aarabee\u0253e haa o wiyi \u201ckala jotondiral he leydi Israayiil
  foti jaggireede ko jamfa maw\u0257o\u201d. O holliri leydi Tuunus ko leydi aarabee\u0253e,
  kala mo wonaa Aarabe jaggiraaka ko Tunusnaajo alaa kay ko haali jillii\u0257o \u0257oon.\\nKo
  he 2023 o wiyi : \u201cujjujooji Afirknaa\u0253e \u0181alee\u0253e ko moojobere
  \u01b4ii\u01b4iire nder \u0257ee daror\u0257e teeminannde 21\u0253iire, \u0257i
  fayndaare mum laatii waylude ngonka renndo \u0253esngu Tuunus, ngam wa\u0257tude
