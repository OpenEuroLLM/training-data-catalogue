  hee\u0253a yi\u0257ago gada nduungu 2000 wo\u0253\u0253e \u0253e Afganistan e\u0253e
  \u0253awii bolle Ruslankar e \u0257un ekkito\u0253e \u0257un gongirla ngomnati eder
