  e Uzbekistan gada woyla Tajiskistan, gada woyla faaro fuuna hai bo \u0257en China,
  gada woyla faaro fuuna \u0257en e ta fuuna. E \u0257i maari jairii \u0257i jajirka
  kiloomita 652,864 (252,072sq mi) leydi \u0257in e\u0257i woodi nyoole \u0257u\u0257\u0257e
  \u0257eri bo \u0257i \u0253ure \u0257u\u0257irka jairi e ta wuttudu woyla e \u0257embo
  fombina faaro hirna, e \u0257en nyolde Hindu kush \u0257un hen\u0257i hakku\u0257e
  maajun e ko yaari 2021. \u018au\u0257irka ummatore maari yaari miliyan 40.2 \u0257en
  e\u0257un ma\u0253\u0253odi e lasgi maw\u0257i lesdi \u0257un Baano \u0253e pashtuns,
  Tajik, Hazaras e Uzbek, Kabul kanje ke gelle \u0253ur\u0257e mawgu lesdi \u0257in
  \u0257enbo kanje gooni jonde gelle maw\u0257e laamu lesdi \u0257un.\\n\u018aemle
  e lasgi[ta\u01b4to | ta\u01b4to \u0257a\u0257i wiki]\\nYim\u0253e Afganistan e \u0257en
  maari \u0257emle e lasgi \u0257u\u0257\u0257i. Pushtuns man\u0253e goni lasgol \u0253urgol
  mawgu latti kam\u0253e ngon 39% \u0257un \u0257uu\u0257irka ummatore lesdi \u0257in
  (les wiigo liuutuugo laanyowo ngo 2019 \u0257un horeeji Asiya) Hai Tajik (ko forsiwans)
  latti \u0253e koochi 37% \u0257un ummatore lesdi \u0257in luttu\u0257e \u0257en
  maw\u0257i lasgi tati tokku\u0253e ga\u0257a ham\u0253e ngoni Tajik, Hadaras e Uzbek.
  E woodi \u0253eddago lasgi kanji sappo e han\u0253e ma e\u0253a \u0257er \u0257emle
  arduje \u0257embo ko \u0257eye \u0257un inni in\u0257e maa\u0253e eder mantinare
