sample: '["\"Hamida Ahmad bey qizi Javanshir (Azerbaijan: H\u0259mid\u0259 Cavan\u015fir
  ; 19 lewru Yarkomaa 1873 \u2013 6 lewru Feebariyee 1955) ko daranii\u0257o Azerbaijaan,
  gooto e rew\u0253e Azerbaijaan adan\u0253e, daartiyanke tropist , firoore, tergal
  fedde winndoo\u0253e Azerbaijaan.\\nNdee feccere tuugii ko e lowre wootere no feewi
  walla fof. (feebariyee 2024)\\nHamida Javanshir jibinaa ko e nder galle maamiraa\u0253e
  makko to wuro Kahrizli, o woni \u0253iy maw\u0257o Ahmad bey Javanshir (1828-1903),
  daartoowo Azeri, firoore e ofisee konu laamu Riisi,[1] e debbo makko Mulkijahan.
  Ko kanko woni mawniiko mawniiko Ibraahiima Khalil Khan, laam\u0257o cakkitii\u0257o
  e nder leydi Karabakh.[citation needed] Hamida e mi\u00f1i mum gorko ina njanngi
  e galle; nde o he\u0253i duu\u0253i jeenay, galle jannginoo\u0253e Riisi ari ho\u0257dude
  e ma\u0253\u0253e ngam ardude e ja\u014bde ma\u0253\u0253e. Nde o he\u0253i duu\u0253i
  14, o anndi binndol Orop e lislaam, omo haalda kadi \u0257emngal Riisi e Farayse
  no feewi.[citation needed]\\nE hitaande 1889, Hamida Javanshir resi debbo gooto
  jeyaa\u0257o to Barda, hono lietnaa kolonel Ibraahiima bey Davatdarov. \u0181e ko\u0257i
  to Brest-Litovsk (Brest hannde oo, Bielorussi). \u0181ooytaani \u0253i\u0253\u0253e
  ma\u0253\u0253e \u0257i\u0257o, Mina e Muzaffar njibinaa. Javanshir \u01b4ettii
  ja\u014bde jim\u0257i, o janngi Almaa\u00f1 e Polo\u00f1. E hitaande 1900, \u0253esngu
  nguu ummii Kars, \u0257o Davatdarov to\u0257\u0257aa gardii\u0257o safrirde konu.
  Hitaande caggal \u0257uum, o maayi, paandaale Hamida ngam janngude safaara to Moscow
  ina nanndi e ko wa\u0257aani.[1]\\n\u0181i\u0257\u0257o Hamida Javanshir biyetee\u0257o
  Mina Davatdarova ko jannginoowo ganndo, ballitoo\u0257o e du\u0257al Kahrizli haa
  o sankii e hitaande 1923\\nO ronii jeyi Kahrizli e juu\u0257e baaba makko, o jokki
  e golle makko cotton \u0257e o he\u0253i. E fawaade e yi\u0257de makko, o \u01b4etti
  binndol deftere makko daartol wiyeteende \u00ab On des affaires politiques de l\u2019affaires
  politiques de l\u2019arm\u00e9e Karabakh \u00bb e hitaande 1747\u20131805, o fayi
  \u0257um to Tiflis (Tbilisi hannde, Georgia) ngam he\u0253de nde yaltinde \u0257um
  to galle bayyinoowo Geyrat. Ko \u0257oon e lewru oktoobar 1905 o hawri e Jalil Mammadguluzadeh,
  oon sahaa wonnoo ko winndiyanke jaaynde wiyeteende Sharg-i rus e \u0257emngal Azeri.
  E hitaande 1907, \u0253e resndi (Mammadguluzadeh ko debbo jom suudu laabi \u0257i\u0257i
  e oon sahaa)[2], \u0253e nguuri Tiflis haa hitaande 1920. \u0181e nda\u00f1i \u0253i\u0253\u0253e
  wor\u0253e \u0257i\u0257o \u2013 Midhat, jibinaa\u0257o e hitaande 1908, e Anvar,
  jibinaa\u0257o e hitaande 1911.[3] O gollodiima e Mammadguluzadeh ngam muulde molla
  Nasraddin, jaaynde satiriire.[4][5]\\nE nder heege Karabakh e hitaande 1907, Javanshir
  renndini kosam e njuumri e wuro heege, kadi o woniino hakkunde Armeni en e Azeris
  en caggal duu\u0253i \u0257i\u0257i warngooji ba\u0257noo\u0257i.[1] E hitaande
  1908, o sosi du\u0257al coeducational to wuro makko Kahrizli, ngal wonti du\u0257al
  Azeri gadanal \u0257o sukaa\u0253e wor\u0253e e rew\u0253e mbaawi janngude e nder
  suudu janngirdu wooturu. E hitaande 1910, Javanshir, e wondude e rew\u0253e jeyaa\u0253e
  e laam\u0253e Azeri wuro ngoo, cosi fedde mo\u01b4\u01b4ere rew\u0253e juul\u0253e
  Caucasian.[1] E nder rafi mboros e jamaanu Sowiyet,[nde?] o soodi \u00f1awbuuli,
  o rokki yim\u0253e Kahrizli \u00f1awbuuli.[6][7]\\nE hitaande 1921, caggal nde o
  ho\u0257i Tabriz fotde hitaande, \u0253esngu nguu ummii to Baku, o winndi toon ciimtol,
  o firti golle jom suudu makko. O yaltinii deftere e kitaale 1930, Awake: Deftere
  debbo juul\u0257o see\u0257a e nguurndam mum e gollondiral mum e gardii\u0257o Molla
  Nasreddin, jaaynde \u0253urnde waawde satiriik e nder Kaukasus e Iraan, 1907\u20131931,
  yaltinaa ko caggal maayde makko e hitaande 1977 Engele ko Hasan Jawadi e Willem
  Floor winndi.[8] O firti kadi yimre Riisi.[4] O \u0253uri \u0253i\u0253\u0253e makko
  \u0257i\u0257o wuurde: Mina e hitaande 1923 e Midhat e hitaande 1935.[3] O sankii
  ko Baku e hitaande 1955. Ina woodi musee nguurndam makko e golle makko to Kahrizli.\\nPewnugol
  koton e nder leydi Azerbaijaan\\n^ Juppu haa: a b c d (e \u0257emngal Aserbaijaan)
  Megastar e Annoore mum. Yeewtere e taaniiko Hamida Javanshir Doktoor Mina Davatdarova.
  Jinnaa\u0257o-az.org\\n^ (e \u0257emngal Riisi) Goonga mo Nasreddin ganndo oo haali
  Arsiif 2007-09-28 to masi\u014b Wayback. Nash vek. #21 (260). 28 lewru Mbooy 2004.
  \u01b3eewtaa ko 1 Duujal 2007\\n^ Jump up to: a b (e \u0257emngal Riisi) Manngu
  men: Jalil Mammadguluzadeh. Leydi Azerbaijaan. 4 lewru Yarkomaa 2007. \u01b3eewtaa
  ko 1 Duujal 2007\\n^ Juppude haa: a b Yolasan, Serkan (lewru Yarkomaa 2019). \\\"Resooji
  Azeri rewrude e teddungal e \u0253uu\u0253ngal: politik Asii hirnaange ummoraade
  e gite diaspora\\\". Jaaynde ganndal Orop. 10 (1): 40. Dowlaaji 10.1177/1879366518814936.
  ISSN 1879-3665.\\n^ Ameri, Anan (1999). Hermeneutik e teddungal: Kaaldigal nokku
  \\\"public\\\" debbo e nder renndooji lislaam/ate. CMES Havard. p. 100. ISBN 978-0-932885-21-0.\\n\u2191
  Heyat, Faride (5 mars 2014). Rew\u0253e Azerbaijan e nder mbayliigu: Rew\u0253e
  e nder Azerbaijaan Sowiyet e caggal Sowiyet. Rootledge. 68-69. ISBN 978-1-136-87177-1.\\n^
  \\\"Hamide Khanum Javanshir 1873-1955\\\" Debbo-hood (6 mars 2019).\\n^ Javanshir,
  Hamide Kanum (2016). Awake : deftere debbo juul\u0257o see\u0257a, ko fayti e nguurndam
  mum e gollondiral mum e gardii\u0257o Molla Nasreddin, jaaynde \u0253urnde maantinde
  e nder Kaukasus e Iraan, 1907-1931. Javadi, Hasan, Floor, Wilem M. Wasinton DC.
  ISBN 978-1-933823-87-4. OCLC 960719559.\"", "\"Hannde Njeslaare malla Alarba, deental
  kollitoo\u0253e to janngille jaami\u2019a ngal ASUU, darnii tikkere nde ngal fu\u0257\u0257unoo
  nder lewru Mbooyi malla Maarisru, hitaande nde\u2019e nde 2020. Hooreejo deental
  ngal Biodun Ogunyemi, anndinii jaayndiyankoo\u0253e ka darnuki tikkere nden ton
  to laamorde lesdi ndi\u2019i nde Abuja.\\nDeental ngal darnii tikkere nden nde lebbi
  joweenayi, \u0253aawo ngal narridii e laamu lesdi ndi\u2019i. Nihi wa\u0257i tikkere
  nden darnaa. \u0181aawo \u0253e nee\u0253ii no \u0253e njo\u0257doo ammaa narral
  he\u0253aaka hakkunde ma\u0253\u0253e naaki jooni. Non kam\u0253e maa fukaraa\u0253e
  \u0253en e kadi deente \u0257uu\u0257\u0257e nee\u0253i e nodda laamu lesdi e maa
  deental ngal dow \u0253e narrinndira hakkunde ma\u0253\u0253e ngam he\u0253a \u0253e
  co\u201dee janngille ma\u0253\u0253e.\\nMinistaajo Kuu\u0257e Chris Ngige han ardii
  narral ngal wa\u0257aa. Haa laamu lesdi ndin yerdii e \u0257a\u0253\u0253ere deental
  ASUU ngal. Deental ngal ni, tefii laamu lesdi, rokka ceede wo\u201ditinki jaami\u2019aaje,
  e kadi yo\u0253uki-\u0253e ngeenaari ma\u0253\u0253e, nden kadi \u0253e ittee nder
  noone njo\u0253di IPPIS, e maa kadi, \u0253e njo\u0253ee nyamaande nde \u0253e tokkata
  laamu lesdi ndin. Jooni ni, ngomnati ja\u0253i ko deental ngal ra\u0253\u0253iti
  wa\u0257ee.\"", "\"Purushottama Bilimoria ko filisaafo Ameriknaajo e Australiyaani
  e jannginoowo O.P. Jindal  Global University .\\nO janngii to du\u0257al jaa\u0253i-haa\u0257tirde
  Auckland (BA) e du\u0257al jaa\u0253i-haa\u0257tirde Otago (PGDiplArts), to Nuwel
  Selannde, o he\u0253i doktoraa makko e hitaande 1983 to du\u0257al jaa\u0253i-haa\u0257tirde
  La Trobe to Ostarali. Hannde, o to\u0257\u0257aama hooreejo nokku wi\u0257to Purushottama
  ngam filosofi e pinal leydi Indiya, kadi o wonii ganndo to du\u0257al jaa\u0253i
  haa\u0257tirde sehilaagal le\u01b4\u01b4i leydi Riisi, to Mosku, leydi Riisi. Ko
  kanko kadi woni Fedde mawnde e Du\u0257al Ja\u014bde Filosof e Daartol e Fedde mawnde
  e wi\u0257to e nder Du\u0257al Ostarali Inndo Institute o woppi golle e lewru marse
  2022, kam\u0253e \u0257i\u0257o fof e nder Du\u0257al Jaa\u0253i-haa\u0257tirde
  Melbourne, Ostarali.\\nIna jeyaa e golle makko ja\u014bde cakkitii\u0257e \u0257ee
  : Fulbright-Nehru teddu\u0257o e jannginoowo njillu to du\u0257al jaa\u0253i haa\u0257tirde
  Ashoka to Delhi, to leydi Inndo (Fall 2019); ko maw\u0257o duumotoo\u0257o e nokku
  Oxford ngam janngude Hindu, Du\u0257al jaa\u0253i haa\u0257tirde Oxford ; jannginoowo
  teddu\u0257o e wi\u0257toowo maw\u0257o e filosofi Inndo e ko adii \u0257uum ko
  doktoraa maw\u0257o to Du\u0257al Diineeji (Union Theologique) to Berkeley ; Ganndo
  kanselor, jannginoowo e jannginoowo njillu to du\u0257al jaa\u0253i haa\u0257tirde
  Kaliforni, to Berkeley ; ganndo njillu to Du\u0257al Janngir\u0257e Asii Fu\u0257naange,
  Du\u0257al Jaa\u0253i-haa\u0257tirde Kaliforni to Berkeley]]; e porfeseer teddu\u0257o
  to du\u0257al jaa\u0253i haa\u0257tirde Deakin. Ganndo njillu to du\u0257al jaa\u0253i-haa\u0257tirde
  Ljubljana (Programme en filosofi e Indologie indienne), e du\u0257al jaa\u0253i-haa\u0257tirde
  Ko\u00e7 (Istanbul).\\nMo \u0257on ha\u0253\u0253ita dow kawtal lesdi Australiya
  ngam anndal Asiya e anndal hakkiilo. [ta\u01b4to ko haani], o woni ko''o\u0257o
  jaayndiyanke''en ''Sophia'' (joornaal caa\u0257ngal nder Falsafaaji e Tradisiyonji,
  e Springer, nder ja\u014bde Melbourne) e ''Journal of Dharma Studies'' (Springer),
  e jaayndiyaajo (jo Amy Rayner) nder Routledge History of Indian Philosophy (2018).
  O woni boo mo dental e mo dental hawrugol Sophia Studies in Cross-Cultural Philosophy
  of Traditions and Culture (ko jooni e 30 \u0257erewol; e Springer).\\n- \u018auum
  je \u0257on ha\u0253\u0253ii e ha\u0253\u0253iiji nder diisiplinji e diisiplinje
  (ko''o ha\u0253\u0253ii bee Rita Sherma, Springer 2021)\\n- Cee\u0257al dow ko''e
  ma\u0253\u0253e e Hinduism (ko''e Rita Sherma, Routkedge 2020)\\n- Routledge History
  of Indian Philosophy (2018)\\n- Sabda Pramana: Wolde e anndal/Wolde nder anndal
  Indiyan (Springer 1988; Delhi 2008)\\n- Ngam \u0257ume walaa ko woodi sey ko woodi?
  (Sophia (2013)\\n- Indiyanko''en \u0253e \u0257on njoo\u0257ana Indiyanko\u0253e
  e Sikh''en nder Australia (1996; 2015)\\n- The Self & its Other in Hindu Thought
  (2005)\\n- Filosofiya jamanu e J.L. Shaw (ed.) (2006)\\n- Essays in Indian Philosophy:
  Traditional and Modern (1995) (e J. Mohanty)\\n- Laawol feere: NGO''s e Feminist
  Perspectives from South and East Asia (1998) (e R. Sharma).\\n- \\\"Emotions in
  Indian-Thought System\\\" (2015 e Aleksander Wenta)\\n- \\\"Filoosofiya Filosofiya
  Postkolonial\\\" (2009 e Andrew Irvine)\\n- \\\"J L Shaw e Falsafaaku Fuu\u0257uki\\\"
  (e Michael Hemmingsen, 2016)\\n- \\\"Hindiaani Ethics vol I Classical and Contemporary
  Changes (e J Prabhu e Renuka Sharma 2017 Routledge Paperback)\\n- \\\" Indian Ethics
  vol II Jindeeji e Hakkilol (e hawti e Prabhu, Sharma e Amy Rayner) (Springer 2018)\\n-
  \\\"Handeeji to Theory of Empathy and Practice in Psychotherapy\\\" nder Renuka
  Sharma (2014)\\n- \\\"Globalization, Transnationalism, Gender and Ecological Engagement\\\"
  (e Amy Rayner, 2012)\"", "\"He keblungal mawninde duu\u0253i teemedere ko na\u0253akayanke
  Senegaalnaajo o, Usmaan Semmben jibinanoo, jaagor\u0257o toppitii\u0257o Pinal e
  Ngaluuji daartolyankeeji, Pr Aliw Sow habrii maa Senegaal sos\u2026\\nFedde San\u0257aa\u0253e
  Ful\u0253e to jaa\u0253i haa\u0257tirde Gaston Berger mo Sannaar (St. Louis), ene
  ngoowi wa\u0257de \u00f1alawmaaji pinal. Hikka ne \u0253e luutnaani aadi ma\u0253\u0253e
  e mawninde\u2026\\n\u00d1alnde Talaata jawtu\u0257o o, Ceerno Alasan Sall hooreejo
  landa la Republique des Valeurs, ariino tawtoreede Daaka wonndude e maw\u0253e lannda
  makko heew\u0253e. O naati Madiina\u2026\\nUniversit\u00e9 num\u00e9rique Cheikh
  Hamidou Kane, hollirii maande mum hesere hanki, Njeslaare (Alarba) 8/03/2023. \u201cPee\u00f1ingol
  ndeen maande (logo) hesere ene timmina ciinugol pellital hooreejo leydi o\u2026\\nCaggal
  defte makko Binndan\u0257e Hiisankooje (2016) e Gannde Hiisiwe (2019) Dr Muhammadu
  Faalil Sih yaltinii deftere mum tati\u0253ere he Hiisiwal (math\u00e9matiques).
  \u00d1oggannde Silo Hiisiwo, ko\u2026\\nNuwaksoot, reenoo\u0253e dummbirde wonnoo\u0253e
  he golle mum he damal dummbirde mawnde Nuwaksoot, \u0257o wa\u0257bonyankoo\u0253e
  salafiyankoo\u0253e cokanoo, mbaraama hanki jamma 5 Mbooy 2023. Wiyaama \u0253e
  ke\u0253ti\u2026\\n\u201cPodoor Diwal am\u201d ko dillal (mouvement) ummaniingal
  ha\u0253aneede mbele falnde Podoor ene wa\u0257tee diiwal. Ngam tabitinde ndeen
  hare, e\u0253e pi\u0253noo wa\u0257de seppo hannde Hoore-biir, 4/03/23\u2026\\nGine,
  hooreejo laamu hakkundeewu, Mamadi Dummbuya yahii hanki boowal laa\u0257e diwooje
  Ahmadu Seyku Tuure to Konakiri ngam ja\u0253\u0253oyaade \u0253iy\u0253e leydi Gine
  ummitii\u0253e toTunis. He haalannde\u2026\\nJaagor\u0257o Senegaal kalfinaa\u0257o
  ge\u0257e jokkondiral caggal leydi e Senegaalnaa\u0253e won\u0253e caggal leydi,
  Aysata Taal Sal, yaltii he de\u01b4\u01b4ere mum. Caggal haalaluuji coof\u0257i
  \u0257i hooreejo leydi\u2026\"", "\"Ilejemeje woni nokkuure laamu lesdi haa lesdi
  Ekiti, lesdi Naajeeriya, nde mari gure jowee\u0257i\u0257i. Joo\u0257orde mayre
  woni ko e wuro wiyeteengo Eda Oniyo.\\nWertallo mayri ko 95 km2, e binnditagol 2006
  ngol ko 43 530 ne\u0257\u0257o. Kod posto mayre ko 372.[1]\\nIlejemeje LGA ina jogii
  njaajeendi 95 kiloomeeteer kaaree, nguleeki mum tolniima e 28 \u00b0C. Hakindo henndu
  LGA ko 10 km/h, zum wonnoo ko 63 %.\\nKoolondiral ge\u0257e leydi ko 7,958367 e
  5,23734.[2]\\nE nder gese keewze ndema e nder LGA Ilejemeje, ina heen pepper, njuumri,
  njuumri, e kakawo, ndema ko golle faggudu mawze wonande yimve nokku oo. E nder luumooji
  ceertu\u0257i e nder LGA \u0257o marsandiisuuji keew\u0257i coodetee e yeeyde, njulaagu
