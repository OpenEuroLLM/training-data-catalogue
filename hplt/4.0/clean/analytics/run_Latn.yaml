  kwubahiriza ivyonavabwiyevyose muzocamubona itandukaniro ryiguhe mutaribwavyubahirize.\\nTwebwe
  tuhaba ntitukivuga, ubwanwa bwarafutse umunwa !!\\nKomine kanyosha harico yononeye
  leta ?nibarabe bayigarukireko.ahandi......\"", "\"Amasanganya yabaye ndanse mu mabarabara
  yo mu Cibitoke\\nKubera amasanganya yo mw\u2019ibarabara, abantu 25 barapfuye, 40
  barakomereka cane mu gihe ca mezi 3. Abajejwe intwaro n\u2019igiporisi bategekanya
  izindi ngingo.-Vyanditswe na Bahati Jagisoni\\nKubw\u2019abiyunguruza mu miduga
  mu Cibitoke amasanganya ni menshi kw\u2019ibarabara Rugombo-Bujumbura na Rugombo
  Kayanza. Ayo masanganya aguma yiyongera yarateye umutima uhagaze abiyunguruza mu
  miduga barondera ubuzima mu guca muri ayo mabarabara. Abadandaza bamwe bamenyesha
  ko batakimanuka i Bujumbura ku gutinya amasanganya.\\nIngingo zarategekanijwe\\nKugira
  hatorwe umuti w\u2019ingorane, abajejwe intwaro bafatanije n\u2019abakuru mu gipolisi
