  ndwi iza (Imin. 3)\\nUruririmbo rwa 11 n\u2019isengesho\"", "\"Uwahoze ari umukuru
  w\u2019umugambwe CNDD FDD, akaba ariwe mukuru w\u2019inama nshingamateka y\u2019Uburundi,
