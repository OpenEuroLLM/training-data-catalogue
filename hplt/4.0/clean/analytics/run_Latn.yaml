  aronka kuko amaze imyaka 20 mu Muziki ariko ataco araronka.\"", "\"Ambasaderi wa
  Reta zunze ubumwe z\u2019Amerika ivy\u2019imfatakibanza muri ONU yongeye gushimangira
  ko reta ya Joe Biden ihagaze ku mugambi wa reta zibiri za Isirayeli na Palestina
  nk\u2019inyishu y\u2019amahoro mu karere ko mu buseruko bwo hagati. Yavuze ko reta
  ifise icizere c\u2019uko buke buke izo mpanze zibiri zizokwizigiranirana.\\nAmbasaderi
  Richard Mills, yabwiye akanama ka ONU kajejwe amahoro n\u2019umutekano kuri uyu
  wa kabiri ko Amerika ishigikiye inyishu ya reta zibiri zumvikanyweko, aho Isirayeli
  izoba mu mahoro n\u2019umutekano haruhande ya reta ya Palestina.\\nMu mwaka uheze,
  reta ya Trump yarashize ahabona umugambi wayo w\u2019amahoro muri ako karere. Abanyepalestina
  barawamiriye kure, bavuga ko uhengamiye kuri Isirayeki kandi bo ata bwigenge bahabwa.\\nAmbasaderi
  Mills, yagabishije izo mpande ko zikwiye kwegeza inyuma ico cose coza gutuma uwo
  mugambi udashikwako, nko kwigarurira ubutaka, gusambura amazu y\u2019abanyepalestina,
  kugumurira abanyagihugu mu migumuko n\u2019ibindi.\\nReta ya Tump kandi yarafashije
  mu kunagura imigenderanire hagati ya Isirayeli na Bahrain, Emirat z\u2019Abarabu
  zunze ubumwe, Maroke, na Sudani. Mills yavuze ko reta nshasha ihamagarira ibindi
  bihugu gukurikiza ako karorero, ariko ko ayo masezerano atari yo aza asubirira amahoro
  hagati ya Isirayeli na Palestina.\\nFacebook Forum\"", "\"Kuva taliki 16 kugeza
  20 Mutarama 2023 muri Congo Brazzaville habereye imikino y\u2019Afurika \u201cIHF
  Trophy Continental Phase-Africa 2023\u201d mu cyiciro cy\u2019abatarengeje imyaka
  20 ndetse n\u2019abatarengeje imyaka 18 mu bahungu aho ikipe ya Guinea na Nigeria
  zegukanye igikombe. Imikino yabereye muri Gymnase Nicole-Oba mu mujyi wa Brazzaville.\\nMu
  batarengeje imyaka 20 hari hitabiriye amakipe 6 yabonye itike binyuze muri Zone
  ari yo Congo Brazzaville (Zone 4), Zimbabwe (Zone 6), u Rwanda ( Zone 5), Guin\u00e9a
  (Zone 2), Nigeria (Zone 3) na Madagascar (Zone 7).\\nMu batarengeje imyaka 18 hitabiriye
  amakipe 5 na yo yabonye itike binyuze muri Zone. Aya ni Zambia (Zone 6), Congo Brazzaville
  (Zone 4), Burundi (Zone 5), Guinea (Zone 2) na Nigeria (Zone 3).\\nMuri buri cyiciro
  amakipe yakinnye hagati yayo nyuma habarwa amanota kugira ngo ikipe yitwaye neza
  abe ari yo yegukana igikombe.\\nTaliki 20 Mutarama 2023, ni bwo habaye imikino ya
  nyuma aho mu batarengeje imyaka 20, ikipe y\u2019u Rwanda yatsinze Zimbabwe ibitego
  74 kuri 17, Guinea itsinda Madagascar ibitego 52 kuri 32 naho ikipe ya Nigeria itsinda
  Congo Brazzaville ibitego 37 kuri 18.\\nMuri iki cyiciro ikipe ya Guinea ni yo yegukanye
  igikombe aho yasoje ifite amanota 8 inganya na Nigeria ku mwanya wa kabiri. Ikipe
  y\u2019u Rwanda yasoreje ku mwanya wa gatatu n\u2019amanota 6 inganya na Congo Brazzaville
  yasoreje ku mwanya wa 4. Ikipe ya Madagascar yasoreje ku mwanya wa 5 n\u2019amanota
  2 naho Zimbabwe isoreza ku mwanya wa nyuma wa 6 ifite ubu (0).\\nMu batarengeje
  imyaka 18, imikino yabaye, ikipe ya Nigeria yatsinze Guinea ibitego 37 kuri 36 na
  ho ikipe ya Congo Brazzaville itsinda u Burundi ibitego 46 kuri 37.\\nMuri iki cyiciro,
  ikipe ya Nigeria yegukanye igikombe aho yasoreje ku mwanya wa mbere n\u2019amanota
  8, yakurikiwe na Guinea (4), Congo Brazzaville (4), Burundi (4) na Zambia (0).\\nIkipe
  ya Guinea mu batarengeje imyaka 20 na Nigeria mu batarengeje imyaka 18 zabonye itike
  yo kuzahagararira Afurika imikino yo ku rwego rw\u2019Isi \u00abIHF Inter-Continental
  Trophy 2023 \u00bb izabera muri Costa Rica taliki 14 kugeza 18 Werurwe 2023.\\nMuri
  iyi mikino amakipe yavuye ku migabane yose azahura mu batarengeje imyaka 20 hanyuma
  ikipe ya mbere izabone itike yo kuzitabira imikino y\u2019igikombe cy\u2019Isi mu
  batarengeje imyaka 21 \u201cIHF Men\u2019s Junior World Championship 2023\u201d
  izabera mu Budage no mu Bugereki kuva taliki 20 Kamena kugeza 02 Nyakanga 2023.\\nAmakipe
  azitabira iyi mikino y\u2019igikombe cy\u2019Isi akaba yaramaze kumenyekana aho
  yashyizwe no mu matsinda. Amakipe yaserukiye Afurika harimo Algeria, Angola, Misiri
  na Tunisia aho yabonye itike mu mikino y\u2019Afurika yabereye mu Rwanda muri Kanama
  2022.\\nAmakipe 32 ni yo azitabira muri rusange aho yashyizwe mu matsinda 8, itsinda
  A rigizwe na France, Poland, Croatia na USA. Itsinda B rigizwe na Algeria, Germany,
  Tunizia na Libya. Itsinda C rigizwe na Portugal, Brazil, Kuwait na Costa Rica. Itsinda
  D ririmo Spain, Faroe Islands, Japan na Angola. Itsinda E ririmo Hungary, Denmark,
  Argentine n\u2019ikipe izabona itike muri Oceanian. Itsinda F rigizwe na Sweden,
  Slovenia, Bahrain n\u2019ikipe izabona itike muri Costa Rica (izegukana IHF Inter-Continental
  Trophy 2023). Itsinda G rigizwe na Serbia, Maroc, Chile na Iceland naho itsinda
  H rigizwe na Misiri, Greece, Cuba na Saudi Arabia.\\nMu batarengeje imyaka 18 na
  ho amakipe azahura iya mbere ibone itike y\u2019igikombe cy\u2019Isi mu batarengeje
  imyaka 19 \u201cIHF Men\u2019s Youth World Championship 2023\u201d imikino izabera
  muri Croatia taliki 02 kugeza 13 Kanama 2023. Amakipe azaserukira Afurika arimo
  u Burundi, Misiri, Maroc n\u2019u Rwanda. Aya makipe akaba yarabonye itike mu mikino
  y\u2019Afurika yabereye mu Rwanda muri Nzeri 2022.\"", "\"Umutoza mushya wa Manchester
  United, Ole Gunnar Solskjaer yemerewe guhabwa agahimbazamusyi k\u2019agera kuri
  Miliyari 2 z\u2019u Rwanda mu gihe Manchester United izaba irangije shampiyona y\u2019Abongereza
  iri mu makipe ane ya mbere, ibonye ticket ya Champions League.\\nMu minsi ishize
  ni bwo uyu mutoza yahawe inshingano zo gutoza ikipe ya Manchester United nyuma y\u2019uko
  iyi kipe yari imaze gusezerera Jose Mourinho wari umaze amasaha make atsinzwe 3-1
  na Liverpool.\\nMagingo aya Manchester United iri ku mwanya wa gatandatu ku rutonde
  rwa shampiyona y\u2019Abongereza n\u2019amanota umunani na Chelsea iza ku mwanya
  wa kane.\\nIkinyamakuru the Mirror cyo mu Bwongereza cyanditse ko mu gihe Manchester
  United yaba ibuze itike ya UEFA Champions league, byayitera guhomba angina na miliyoni
  40 z\u2019ama Euros.\\nKubura muri iyi mikino kandi byatuma Manchester United igabanyirizwa
  amafaranga n\u2019abaterankunga cyo kimwe n\u2019uduhimbazamusyi tumwe na tumwe.
  Cyakora cyo mu gihe umutoza Solskjaer yaba ashyize Manchester United mu makipe ane
  ya mbere izi mbogamizi zose zavaho.\\nAmakuru avuga ko Ed Woodward usanzwe ari umuyobozi
  wungirije wa Manchester United yemereye uyu mutoza Ole Gunnar Solskjaer miliyoni
  ebyiri z\u2019ama Euro nk\u2019agahimbazamusyi mu gihe iyi kipe yaba ibonye itike
  ya UEFA Champions league.\\nIyi tike kandi iha uyu mutoza amahirwe yo kugirwa burundu
  umutoza wa Manchester United.\\nKu bw\u2019uyu Solskjaer ukomoka muri Norvege, ngo
  Manchester United ikenewe n\u2019abatoza benshi na we arimo, akaba ari yo mpamvu
  agomba gukoresha amahirwe yahawe akabyaza umuso amahirwe yahaweshobora kumugira
  umutoza wa Manchester United burundu.\\nIREBERE VIDEO NHYA YA EESAM YISE WOWE GUSA:\\n[\u2026]
  umaze gufasha Manchester United gutsinda imikino 6 yikurikiranya,yavuze ko imitoreze
  ye yari ku rwego rwo [\u2026]\"", "\"21 MUNYONYO 2014\\nUKRAINE\\nI LVIV muri Ukraine:
  Ivyabona vya Yehova barabandanya gufasha abo basangiye ukwemera bahunze intambara
  yabiciye bigacika mu buseruko bwa Ukraine.\\nMu Vyabona hafi 7.500 bahunze, abashika
  4.000 bariko bitwararikwa n\u2019amakomite indwi ajejwe gutabara abashikiwe n\u2019ivyago
  yashizweho n\u2019ibiro vy\u2019ishami vy\u2019Ivyabona vya Yehova vy\u2019i Lviv.
  Abasigaye bahawe indaro n\u2019incuti zabo hamwe n\u2019abo basangiye ukwemera bo
  muri Ukraine no mu Burusiya. Ayandi makomite atandatu ajejwe gutabara abashikiwe
  n\u2019ivyago ariko aritwararika Ivyabona barenga 17.500 bagumye muri ako karere
  kateyemwo intambara.\\nIbiro vy\u2019ishami vy\u2019i Lviv vyavuze ko Ivyabona batandatu
  ari bo bahitanywe n\u2019iyo ntambara. Icabona umwe w\u2019i Kramatorsk yapfuye
  ku wa 17 Ruheshi 2014 ahitanywe n\u2019ikibombe caturikiye hafi y\u2019imodoka yarimwo.
  Amabombe yarahitanye ibindi Vyabona batanu baba i Donetsk, i Sloviansk, i Rozkishne,
  n\u2019i Luhansk.\\nIbiro vy\u2019ishami biriko birahagarikira kandi ibikorwa vyo
  gusubira kwubaka ibibanza Ivyabona basengeramwo hamwe n\u2019amazu yabo.\\nAbajejwe
  amakuru:\\nKu rwego mpuzamakungu: J. R. Brown, wo mu Biro bijejwe amakuru, t\u00e9l.
  +1 718 560 5000\\nUkraine: Vasyl Kobel, t\u00e9l. +38 032 240 9323\"", "\"Amabarabara
  yo mri komine ya Kanyosha ageze aho umwansi ashaka, ivyo bigatuma n\u2019imiduga
  yunguruza abantu ija muri iyo komine igonanwa.\\nIbarabara riva mu kinanira ca Musaga
  rigaca ku kiraro c\u2019uruzi Kanyosha hamwe n\u2019ayandi mabarabara atandukanye,
  ageze aho umwansi ashaka. Ibinogo binini mu mabarabara hagati, hamwe n\u2019amazi
  ahatega mu gihe c\u2019imvura bikaba biraje ishinga abanyagihugu, aho bavuga ko
  bashobora n\u2019ukwandura indwara zitandukanye nka malariya n\u2019izindi, kubera
  ibiziba bitega muri ivyo binogo.\\nAyo mabarabara mabi rero, akaba atuma bafise
  imiduga batinya kuyacamwo, abagendesha imiduga nayo yunguruza abantu, bagahitamwo
  kuja gukorera mu zindi karitiye z\u2019igisagara ca Bujumbura. Umwe mu badereva
  asanzwe agendesha umuduga wunguruza abantu, akaba yabariye ikinyamakuru IGIHE.bi
  ko atoshobora gukorera muri komine ya Kanyosha, kubera hari amabarabara mabi, akavuga
  ko akorera ku Musaga gusa. Yatubwiye ko imiduga ikorera muri komine Kanyosha ipfa
  ningoga kubera ayo mabarabara mabi.\\nAbanyagihugu bo muri iyo komine ya Kanyosha,
  bagasaba ko nabone bokorerwa amabarabara nk\u2019uko vyabaye mu yandi maratiye,
  ndetse bakizera ko amatora yotangura, ibikorwa vyo gukora ayo mabarabara navyo vyatanguye.\\nmwiriwe
  ndababajwe Niko a anti bisamburiraho nki mpene ibarabara iyorihari nabantu baribaho
  ikindi Niki Niko bari bungabunga iyo bataribungabunze murashaka leta ikore iki nuwobaha
  kaburimbo mwozica uwutunga ahera kuribike\\nNon reta ibivuga kwik ?\\nAbantu muherereye
  kwayomabarabara mukabamukuze kandimugifise utuguvu mushobora kubamwarasamaye canke
  mwaragize urwangara rwokwitwararika ayomabarabara, abakuze kugiruruhara mukwononekara
  mukwononekara kwayo mabarabara nuwowese atakwiyarara igishishwa cumuhwi, igitiritori
  cikigori, ibisigazwa vyibikaju, amashashe mwasumishije, ibishishwa vyibitoke nivyibigori,
  ibikaritokarito, nibindi. Ivyovyose imvura iguye iravyegeraniriza ahantuhamwe mumufurege
  wagenewe amazi mazebimaze kubavyishi bikabana muriwanufurege noneho vyabiziba bigacavyironderera
  iyindinzira iyoyibdinzirarero niyomubina ngahimwibarabara ryinburutse ikindigihe
  ivyobizuba bizodushavurira vyinjire nomumazuyacu kutubaza icatumye dukomezaguta
