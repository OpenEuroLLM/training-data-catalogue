  CNDD-FDD na Reta yawo nabo nyene barongeye kwemeza ko ata ngabo za ONU bashaka mu
  gihugu cabo, kuko imigambi yinyegeje inyuma ari iyo gusenyura ubutegetsi bwa CNDD-FDD
  na Reta yawo. Baboneyeho gusaba ko Ibihugu bizogenderwa n\u2019abo bantu babiri
  twavuze, bitohirahira ngo vyemere ko ONU irungika ingabo muri kano Karere na cane
  cane mu Burundi. Rom\u00e9o Dallaire na Louise Arbour ni inkwezi z\u2019amarere
  ;\\n7. Ingingo ya 17 yinjijwe mu cemezo c\u2019Akanama kajejwe umutekano kw\u2019Isi
  ka ONU inomero 2303 itihwejwe neza kuko yerekanye ico ako kanama gashaka gushikako
  ariko katashaka kwerekana ; karabacorotse kuko kaciye kerekana amarementanya bariko
  barakorera Uburundi nk\u2019amwe yakorerwa Urwanda. Haradendekanijwe ko ngo Urwanda
  ari rutoya rutokwakira impunzi kugirango babone aho bahera kugira basenyure ubutegetsi
  bwari buhari. Muri Iraq Saddam Hussein yagirijwe ngo afise ibirwanisho ruhonyanganda
  vyo kumara abantu kandi atari vyo, bahemutse bamugandaguye, Muri Libiya Muammar
