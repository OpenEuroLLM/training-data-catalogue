  bwomw\u2019Ijuru !? Iconsrinzi nuko mugusenga arivyoturonkeramwo inyishu !? Ndibuka
  Ko Yezu umwemubantubarikumwenawe yabonye abantu batanguye gusunanguza Yezu acakura
  inkota murwubati ubwonyene abaraciye ugutwi umwe murabobariko barasunanguza Yezu,
  ariko Yezu yavuze ngo rekaguhangana mbere acasubizako ugutwi kuwokwarikwaciweko.
  Bisiguriki ? Bisigurako uwushaka kunezereza Imana canke ashaka kuzinjira mubwamibwayo
  ntiyigera ahangana nababantu bumubiri namaraso bakoresheje inguvu zuwumubiri, gusega
  nivyobifise inyishu nziza gusa kuruwowese yitwa Ko ashaka kunezera Imana yukuri
  imweyavugango tureme isini Juru bigacabibaho imweyavugango tureme umuntu mwishushoyacu
  atasenatwe.\\nAha nashaka kubanza gushimira uwo mwigeme Zebiya ,yatumye haba ikanguka
  mubantu ,kuvyerekeye ukwemera .Eka nabamukurikira bari munzira Imana yabateguriye
  kugira baze bashobore gutahura ivyayo . Ico bomenya nuko Imana yonyene nsa , ariyo
  ishobora guhindura ubuzima bwacu,nkuko yahinduye ubwa Bikira-Maria akibaruka Yezu.Muvyo
  natohoje ndatahuzwa , mumigenzo y\u2019\u2019abantu umushumba canke umukozi wo munzu
  ,aca kuri inarugo ashaka gusaba ikintu serugo . Ivy\u2019\u2019Imana suko vyifashe
  . Murasenga Imana yonyene nsa muyikunde kurusha ibindi vyose.\\nBana b\u2019Imana
  , ntimufate uko ibintu bitari kubera mwunvise ngo vyanditswe muri Bibiliya,Amadini
  arakunda kwitwaza Bibiliya iyo ariko aravuka . Nico gituma mwohagabira kuko twese
  duhiga kumenya ingene twomenya , twoshobora kubona Imana ,gushika mubwami bwayo
  , duhiga ingene twosaba ikigorwe Imana ikadusubiza muri Paradizo. Nico gituma nobakebura
  mugatangura gusoma Bibiliya muhereye kuntango naho woba warayihejeje kuyisoma, hama
  wicishe bugufi , usabe Imana gutahura ivyahishijwe muri iyo Bibiliya , ikurungikire
  mutima mweranda kugira akurinde ntusubire inyuma mukwemera kwawe. Tega amatwi uwo
  wese aje afise ico avuga ku Mana ,nturindire gusa ngo Padili , Pastor , Sheh , Temoin
  de Jehovan nibo bashobora kuzana ubutumwa bw\u2019\u2019Imana gusa. Kuko Imana nuko
  ivugisha ivyo yaremye ,ntuze uyitege ukundi, kuko ubwami bwayo ntibuza,hamwe ushobora
  kuvuga ngo buteye hariya canke ngaha.Umaze gutegura umutima wawe mutima mweranda
  arakugendera ,ukabona gutahurirwa kubibazo vyose warufise kuri Bibiliya. Noshimako
  twoguma twigishanya ,umwe wese ivyo amaze guhishurirwa . Uwuvyifuza yokwandika kuri
  facebook ,kuwufise guhindura ibi vyanditswe mururimi rw\u2019Ikirundi muzindi ndimi
  ,arashobora kubikora ,message yacu igashikira nabatumva Ikirundi naho Imana ifise
  abo yahaye ubwo butumwa bamwe bamwe mubihugu vyose.Ntimwibagireko dutegerezwa guhinduka
  mumitima yacu mukugira tuze dutahure ivy\u2019\u2019Imana yari yaraduteguriye igihe
  yaturema.\\nNdakeneye intererano y\u2019\u2019ivyiyumviro vyanyu imbere yo kubandanya
  kuvuga , ibikenewe kugira duhinduke. Abemera baciye mumadini, amatagira amadini
  ,baratumiwe . Intererano zabo zirakenewe.\\nReka nishure gato kuwabajije ivyahishijwe
  mubuzima bwokuba kuri iyi si.\\nMwavyumvise kenshi mumashengero,mumisigiti,muvyanditswe,kubazanye
  ubutumwa kumunwa ; kwata ku jugeant (ne juger point),ntimugace imanza mais biragoye
  ngaha kwisi kubera imigenzo yabantu bigize incabwenge yogutandukanya ikibi niciza.Bitwaza
  ngo vyanditswe muri Bibiliya, nashaka gukebura aha abifuza kumenya , iyo wumvise
  inkuru ,ntukayijuger ngo nimbi canke ninziza ,rindira ikivamwo hama ufate neza ikizovamwo
  cose.Iyo niyo ngendo dukwiye gufata,niho tuzoba twaratahuye igicumuro cinyanduruko.
  Guhiga kuba nk\u2019Imana(kumenya ikibi n\u2019iciza),ico nico catumye duhanwa.\\nImana
  imaze kutuvuma urazi ivyakurikiye , ubuzima bwo ngaha kwisi.Nzoza ndababwira mpereye
  ingene vyatanguye naho biteye ubu ,kuko abantu benshi baraciruka inyuma yivyanditswe
  muri Bibiliya bibazako vyose ari ibizobashikana kumana .Bataramenya gutandukanya
  Umuvumo n\u2019\u2019Umugisha , twebwe rero ngaha kwisi twacaguye kw\u2019\u2019ibera
  mumuvumo kukutamenya ,kubera imigenzo yabakera yatuzingamitse kubera benshi batatahura.\\nReka
  ngeze aha uno munsi nzobandanya hanyuma ikibazo cawe.\\nKumenya ibimenyetso vy\u2019ibihe
  birakomeye bane b\u2019Imana nico Bibiliya itwiganira.Abantu barakunda kwitwaza
  Bibiliya nkikirwanisho ,nguyemera ,uyigendana ngo ntagicumuro urwamwo, nta shetani
  mushobora guhura ngo kuko ari igitabo c\u2019Imana.\\nBibiliya.Mais aha urakeneye
  kumenya ico Yezu yaje gukora aha kwisi neza .Mumajambo make, Yezu ntaco yaje guhindura
  kuvyo Imana yari yaduteguriye ikiturema ,kandi ntiyaje guhindura imitima yabadashaka
  ,kandi nkuko yongeyeko ,ntiyazanye amahoro kw\u2019isi , yazanye inkota (ijambo
  ryiwe) rizotuma imiryango icanamwo,aho abo munzu bacanamwo ,umugore agacanamwo,numugabo
  wiwe , agacanamwo n\u2019\u2019umukobwa wiwe,se agacanamwo n\u2019\u2019umuhungu
  wiwe. Aha sinzi ko wumva ico yashatse kuvuga ?\\nImana iradukunda nico gituma iguma
  igerageza ingene twotahura, tugahinduka , tugasaba ikigorwe ,ikadusubiza muri Pardizo.
  Nico gituma imaze kuduhana c.a.d guhana abo dukomokako Adam\"", "\"Ikipe ya Westham
  United ifite abakinnyi umunani bose bari mu kato, nyuma yo kugaragaza ibimenyetso
  by\u2019indwara ya coronavirus nk\u2019uko byatangajwe na visi perezida w\u2019iyi
  kipe witwa Kerren Brady.\\nKuri ubu abakinnyi b\u2019ikipe ya West ham bari mu myitozo
  mu ngo z\u2019abo, mu gihe iyi kipe itegereje ko basubukura shampiyona, bagakina
  nk\u2019uko bisanzwe mu gihe Ubwongereza bwatangaje ko abaturage bagomba kuguma
  mu ngo zabo kugeza ku itariki ya 13 Mata.\\nShampiyona y\u2019Ubwongereza yarahagaritswe
  kugeza byibura tariki 30, Mata 2020, nyuma bakazafata umwanzuro niba bazongeera
  igihe cyo kuyisubukura cyangwa bazayiharika burundu.\\nUmutoza w\u2019ikipe ya Arsenal
  Mikel Arteta, Hudson-Odoi n\u2019abandi bakinnyi batagararajwe amazina yabo b\u2019ikipe
  ya Leicester City ni bamwe mubanduye icyorezo cya Covid-19, gusa kuri ubu bo bakaba
  barorohewe.\\nDUKUNDANE Ildephonse/Igicumbi News\"", "\"\u201cUbwirizwa kumenya
  ingene umukuku wawe umeze.\u201d\\n1, 2. (a) Amwamwe mu mabanga umwungere wo muri
  Isirayeli yari ajejwe ni ayahe? (b) Ni gute abavyeyi bameze nk\u2019abungere?\\nABUNGERE
  bo muri Isirayeli ya kera bari bafise ubuzima butoroshe. Uretse ko babwirizwa kwihanganira
  ubushuhe n\u2019imbeho, babwirizwa no gukingira imikuku yabo ngo ibikoko n\u2019abantu
  ntibiyigeramire. Abungere bama basuzuma intama zabo maze bakitwararika izaba zirwaye
  canke zakomeretse. Baritwararika mu buryo budasanzwe imyagazi kubera ko ata nguvu
  yaba ifise nk\u2019intama zikuze.\\n2 Abavyeyi bakirisu bategerezwa kugaragaza kamere
  z\u2019agaciro nk\u2019iz\u2019abungere. Bajejwe ibanga ryo kurera abana babo \u201cmu
  kubatoza indero no mu kuyobora ivyiyumviro vyabo nk\u2019uko Yehova yashinze.\u201d
  (Ef. 6:4) Ico none coba ari igikorwa coroshe? Eka data! Abana barageramirwa n\u2019ivyiyumviro
  indiri biva kuri Shetani hamwe n\u2019ivyipfuzo vyabo biranga agasembwa. (2 Tim.
  2:22; 1 Yoh. 2:16) Nimba ufise abana, woshobora gute kubafasha? Nimuze turimbure
  ibintu bitatu wokora kugira uragire abana bawe, na vyo bikaba ari ukubamenya, ukubagaburira
  n\u2019ukubayobora.\\nNUMENYE ABANA BAWE\\n3. Abavyeyi bashobora gute \u2018kumenya
  ingene abana babo bameze\u2019?\\n3 Umwungere mwiza arasuzuma yitonze intama imwimwe
  kugira yiyemeze ko ifise amagara meza. Mu buryo bw\u2019ikigereranyo, urashobora
  kubigenza gutyo ku bana bawe. Bibiliya ivuga ko ubwirizwa \u201ckumenya ingene umukuku
  wawe umeze.\u201d (Imig. 27:23) Kugira ubimenye, urakeneye kwihweza ivyo abana bawe
  bakora, ivyo biyumvira be n\u2019ukuntu biyumva. None ivyo wobishikako gute? Bumwe
  mu buryo bwiza kuruta ubundi ni ukwama uyaga n\u2019abana bawe.\\n4, 5. (a) Ni ivyiyumviro
  ngirakamaro ibihe vyotuma abana baserurira abavyeyi babo iryo bagona? (Raba ishusho
  itangura.) (b) Ni igiki wakoze kugira abana bawe barushirize kworoherwa no kukuyagira?\\n4
  Abavyeyi bamwebamwe basanze bibagora cane kuyaga n\u2019abana babo igihe bageze
  mu buyabaga kuko boshobora gutangura kwigunga no kwumva isoni zo guserura ivyo biyumvira
  be n\u2019ukuntu biyumva. Nimba abana bawe ari ukwo bameze, wokora iki? Aho guhata
  umwana wawe ngo mumare umwanya muremure muyaga ata gufyina, nugerageze gukoresha
  uturyo twizanye. (Gus. 6:6, 7) Hari aho wosanga ukeneye kugira utwigoro twiyongereye
  kugira muze murakorera ibintu hamwe. Mwoshobora kujana na bo gutembera n\u2019amaguru
  canke n\u2019umuduga, mugakina agakino kanaka canke mugafatanya gusukura iruhande
  y\u2019inzu. Ibiringo nk\u2019ivyo vyoshobora gutuma abana b\u2019imiyabaga bisanzura,
  bakarushiriza guserura akari ku mutima.\\n5 Bite ho mu gihe umwana wawe yoguma asa
  n\u2019uwugonanwa guserura iryo agona? Woshobora guca ukoresha ubundi buryo. Nk\u2019akarorero,
  aho kubaza umukobwa wawe ukuntu yiriwe, womubwira ukuntu wewe wiriwe. Na we yoshobora
  guca akubwira ukuntu yiriwe. Canke na ho kugira umenye ico uwo mwana wawe yiyumvira
  ku kintu kanaka, nko gukundana n\u2019abahungu, numubaze ibibazo biterekeza kuri
  we. Woshobora kumubaza ukuntu umwe mu bagenzi biwe abona ico kintu. Woshobora rero
  guca umubaza impanuro yoha uwo mugenzi wiwe.\\n6. Kuba umuntu aronkeka kandi yegereka
  bisobanura iki?\\n6 Ariko ntiwumve, kugira abana bawe baguserurire akari ku mutima,
  barakeneye kubona ko uri umuntu aronkeka kandi yegereka. Igihe abavyeyi bama basa
  n\u2019abafatiriwe cane ku buryo bataronka akanya ko kuyaga, abakiri bato mu muryango
  boshobora kwigumizamwo ingorane zabo. Tuvuge iki ho ku bijanye no kuba uwegereka?
  Birimwo n\u2019ibindi uretse kuvuga gusa ngo \u201curashobora kunyitura umwanya
  uwo ari wo wose.\u201d Abana b\u2019imiyabaga barakeneye kwiyumvamwo ko utazokengera
  ingorane zabo canke ngo uce utwarwa n\u2019agashavu bazikubwiye. Abavyeyi benshi
  baratanga akarorero keza muri ivyo. Uwitwa Kayla w\u2019imyaka cumi n\u2019icenda,
  avuga ati: \u201cNdashobora kubwira dawe ikintu cose. Ntanciramwo, kandi ntantora
  amahinyu; ico akora arantega yompi. Yama rero ampa impanuro nziza kuruta izindi
  zose.\u201d\\n7. (a) Ni uburimbane ubuhe abavyeyi bokoresha igihe bayaga n\u2019abana
  babo ibijanye n\u2019ukureshanya? (b) Abavyeyi boshobora gute kuratsa batabiciye
  n\u2019ikanda abana babo?\\n7 Mbere n\u2019igihe uyaga n\u2019abana bawe ku bintu
  vy\u2019inkoramutima, nk\u2019akarorero kureshanya, uraba maso ntuhave ushimika
  cane ku vyo kubagabisha ku buryo wibagira kubigisha uburyo bwiza bwo kuvyifatamwo
  neza. Tubitangire akarorero: Dufate ko ugiye mw\u2019iresitora ugasanga ku bifungurwa
  vyose bafise bakugabisha gusa ku bijanye n\u2019ubumara. Birashoboka ko woca uva
  muri iyo resitora ukaja kurondera iyindi. Abana bawe boshobora kubigenza gutyo nyene
  igihe baje kugusaba impanuro mugabo ivyo ubabwira vyose bikaba birimwo ingabisho
  zikabije. (Soma Abakolosayi 3:21.) Aho kubigenza gutyo, nukoreshe uburimbane. Mushiki
  wacu akiri muto yitwa Emily avuga ati: \u201cIgihe abavyeyi banje bambwira ibijanye
  n\u2019ukureshanya, ntibatuma biboneka ko ari bibi. Barashimika ku munezero ugira
  igihe umenye umuntu n\u2019igihe uronse uwo mwubakana. Ivyo vyatumye ntitinya kubayagira
  ku bijanye n\u2019ico kibazo. Nkako, nipfuza kubabwira ibijanye n\u2019umuhungu
  wese ashaka ko dukundana aho kubibahisha.\u201d\\n8, 9. (a) Ni ivyiza ibihe biva
  ku gutega yompi abana utabaciramwo? (b) Gutega yompi abana bawe vyavuyemwo ivyiza
  ibihe?\\n8 Nk\u2019uko nyene Kayla yabivuze, urashobora kwerekana ko wegereka mu
  kwumviriza abana bawe wihanganye. (Soma Yakobo 1:19.) Inabibondo umwe yireranye
  abana yitwa Katia, avuga ati: \u201cKera sinihanganira na gato umukobwa wanje. Naca
  ndamuciramwo ariko aravuga. Naba ndushe cane ku buryo ntashobora kumwumviriza canke
  nkaba gusa ntashaka uwungora. Kubera ko ubu nahinduye inyifato, umukobwa wanje na
  we nyene yarahinduye. Asigaye anserurira akari ku mutima atitinya.\u201d\\n9 Sebibondo
  umwe yitwa Ronald ni ko yabigenjeje ku bijanye n\u2019umukobwa wiwe w\u2019umuyabaga.
  Avuga ati: \u201cIgihe yambarira ko afise umuhungu bakundana kw\u2019ishure, mu
  ntango vyarambabaje cane. Mugabo igihe nazirikana ukuntu Yehova yihanganira abasavyi
  biwe kandi agira ibitegereka, narabonye ko vyorushiriza kuba vyiza mpaye umukobwa
  wanje akaryo ko guserura ukuntu yiyumva imbere yo kugerageza kumukosora. Ndahimbawe
  kubona narabigize! Ryari ryo rya mbere ntahura inyiyumvo z\u2019umukobwa wanje.
  Ahejeje kunyagira, vyararushirije kunyorohera kumuvugisha mu buryo buranga urukundo.
  Naratangajwe n\u2019ukuntu yakiriye neza cane impanuro namuhaye. Yarerekanye ko
  yipfuza vy\u2019ukuri guhindura inyifato.\u201d Kwama uyaga n\u2019abana bawe biragufasha
  kurushiriza kumenya ivyo biyumvira be n\u2019ukuntu biyumva. Ivyo biraheza bikagufasha
  kugira ikintu kinini uterereye ku ngingo bafata mu buzima. *\\nNUGABURIRE ABANA
  BAWE\\n10, 11. Ushobora gute gufasha abana bawe kutagenda akayombekere?\\n10 Umwungere
  mwiza arazi yuko iyo ari yo yose mu ntama ziwe ishobora kuja kure y\u2019umukuku.
  Hari aho ikurikira ubwatsi buri hirya gato mu nyuma na ho ikaja kure kandi gato,
  gutyo ikitandukanya n\u2019umukuku. Muri ubwo buryo nyene, umwana yoshobora kugenda
  buhorobuhoro agana mu nzira iteye akaga mu vy\u2019impwemu, yohejwe n\u2019abagenzi
  babi canke uburyo bwo kwisamaza bwononekaye. (Imig. 13:20) Ushobora gute none kubuza
  ico kintu ngo ntikibe?\\n11 Igihe uriko urigisha abana bawe, nugire ico ukoze udatebaganye
  ubonye ibintu bishobora gutuma bagoyagoya. Niwihatire gukomeza kamere za gikirisu
  bafise ariko zikaba zikeneye kuryohorwa. (2 Pet. 1:5-8) Ikiringo c\u2019ugusenga
  kwo mu muryango ni co gihe ciza cane co kubigira. Mu gushimika kuri iyo ntunganyo,
  Igikorwa dukorera Ubwami co muri Gitugutu 2008 cavuze giti: \u201cAbahagarariye
  imiryango baremeshwa kurangura ibanga Yehova yabajeje rijanye no kwiyemeza neza
  yuko umuryango wabo ugira inyigisho ya Bibiliya y\u2019umuryango idahorereza kandi
  ko uyigira mu buryo ngirakamaro.\u201d Woba uriko urakoresha bimwe bishitse iyo
  ntunganyo iranga urukundo yo kuragira abana bawe? Niwizigire yuko abana bawe bazoshima
  cane ukuntu witwararika kubaronsa ivyo bakeneye mu vy\u2019impwemu.\\n12. (a) Abakiri
  bato bungukiye gute ku gusenga kwo mu muryango kudahorereza? (Nushiremwo ibiri mu
  ruzitiro ruvuga ngo \u201cBarakenguruka.\u201d) (b) Wewe ubwawe wungukiye gute ku
  gusenga kwo mu muryango?\\n12 Rimbura ivyo umuyabaga umwe yitwa Carissa yavuze ku
  bijanye n\u2019ukuntu Ugusenga kwo mu muryango kwafashije umuryango wabo. Yagize
  ati. \u201cNdahimbarwa n\u2019uko twese dushobora kwicara hamwe tukayaga. Igihe
  ivyo tubigize, turarushiriza gukundana no gutuma haba ibintu vyiza tutazokwibagira.
  Dawe ntiyigera asivya Ugusenga kwo mu muryango. Biraremesha kubona ukuntu agufatana
  uburemere, bikaba bituma nanje nipfuza kugufatana uburemere. Biratuma kandi ndushiriza
  kugira imvo yo kumwubaha kuko ari dawe akaba n\u2019uwutuyobora mu vy\u2019impwemu.\u201d
  Mushiki wacu umwe akiri muto yitwa Brittney yavuze ati: \u201cUgusenga kwo mu muryango
  kwaratumye ndushiriza kwiyegereza abavyeyi banje. Kuranyereka ko bipfuza kwumva
  ingorane zanje be n\u2019uko banyitwararika vy\u2019ukuri. Kuradufasha kuba umuryango
  ukomeye kandi wunze ubumwe.\u201d Biragaragara ko kugaburira abana bawe mu vy\u2019impwemu,
  na canecane biciye ku gusenga kwo mu muryango, ari bwo buryo nyamukuru bugufasha
  kuba umwungere mwiza. *\\nNUYOBORE ABANA BAWE\\n13. Umwana ashobora gute kuvyurirwa
  umutima wo gukorera Yehova?\\n13 Umwungere mwiza arakoresha inkoni mu kuyobora no
  mu gukingira umukuku wiwe. Imwe mu ntumbero ziwe nyamukuru ni ukuyobora intama ziwe
  azijana \u201cmu buragiriro bwiza.\u201d (Ezk. 34:13, 14) Kubera ko uri umuvyeyi,
  ufise intumbero nk\u2019iyo nyene mu vy\u2019impwemu. Wipfuza kuyobora abana bawe
  kugira bakorere Yehova. Wipfuza ko abana bawe biyumva nk\u2019umwanditsi w\u2019amazaburi,
  uwanditse ati: \u201cGukora ukugomba kwawe, ewe Mana yanje, ni vyo vyampimbaye,
  kandi itegeko ryawe riri imbere muri jewe.\u201d (Zab. 40:8) Igihe abakiri bato
  biyumva gutyo, bariyegurira Yehova maze bakabatizwa. Birumvikana ko bakwiye gutera
  iyo ntambwe igihe baba bahumuye bihagije ku buryo bafata iyo ngingo kandi bakaba
  bipfuza vy\u2019ukuri gukorera Yehova.\\n14, 15. (a) Abavyeyi bakirisu bakwiye kuba
  bafise intumbero iyihe? (b) Ni ibiki vyoshobora gutuma umwana w\u2019umuyabaga akekeranya
  ku gusenga kw\u2019ukuri?\\n14 Bite ho mu gihe abana bawe basa n\u2019abatagomba
  gutera imbere mu vy\u2019impwemu, kumbure mbere bakaba bafise amakenga ku vyo bizera?
  Niwihatire gushimangira mu bana bawe ugukunda Yehova Imana be n\u2019ugukenguruka
  ivyo yakoze vyose. (Ivyah. 4:11) Igihe rero bazoba biteguye, bazoba bashobora kwifatira
  ingingo yo gusenga Imana.\\n15 Ariko none vyogenda gute mu gihe abana bawe batanguye
  gukekeranya batarafata iyo ngingo? Ushobora gute kubaragira no kabafasha kubona
  ko gukorera Yehova ari bwo buryo bwiza kuruta ubundi vy\u2019ukuri bwo kubaho be
  n\u2019uko bizotuma bagira agahimbare karamba? Nugerageze kumenya imvo nyamukuru
  ituma bakekeranya. Nk\u2019akarorero, umuhungu wawe yoba vy\u2019ukuri atemera inyigisho
  zo muri Bibiliya; canke yoba gusa atinya kuburanira izo nyigisho imbere y\u2019urunganwe
  rwiwe? Umukobwa wawe yoba vy\u2019ukuri adatahura ubukerebutsi buri mu ngingo mfatirwako
  z\u2019Imana, canke yoba gusa yumva irungu kibure akabona ko abandi bohava bamuharira
  ivomo?\\n16, 17. Abavyeyi bofasha abana babo kugira ukuri ukwabo mu buryo butandukanye
  ubuhe?\\n16 Naho umwana wawe yoba abiterwa n\u2019iki, urashobora kumufasha gutsinda
  ikintu ico ari co cose gituma akekeranya mu vy\u2019impwemu. Uti gute? Iciyumviro
  kimwe abavyeyi benshi babonye ko ari ngirakamaro ni ugutuma umwana wabo aserura
  iryo agona mu kumubaza bati: \u201cKuba uri umukirisu ubibona gute? Wewe ubwawe
  ubona bikumariye iki? Ni ingorane izihe bisaba ko wihanganira? Woba ubona ko izo
  ngorane ataho zisa zisana n\u2019ivyiza vyinshi twironkera ubu be n\u2019ivyo dusezeranirwa
  kuzoronka muri kazoza? Mu buryo ubuhe?\u201d Ariko ntiwumve, ukwiye kumubaza ivyo
  bibazo mu majambo yawe bwite kandi mu buryo buranga ubuntu kandi bushimishije, atari
  nk\u2019aho woba uriko uramusambisha. Igihe muriko murayaga, mwoshobora kwihweza
  ibivugwa muri Mariko 10:29, 30. Hari abakiri bato bohitamwo kwandika ivyiyumviro
  vyabo bakoresheje igicapo c\u2019inkingi zibiri, imwe bakayandikamwo ivyo babwirizwa
  kwihanganira, iyindi na yo bakayandikamwo ivyiza bironkera. Kwihweza ivyo bintu
  ku rupapuro vyoshobora gutuma babona ingorane bafise izo ari zo maze bikabafasha
  kuzitorera umuti. Nimba bikenewe ko twigisha abashimishijwe igitabu Ivyo Bibiliya
  yigisha be n\u2019igitabu \u201cUrukundo rw\u2019Imana\u201d, ese ukuntu birushiriza
  gukenerwa ko tuvyigisha abana bacu! Woba uriko urabigira?\\n17 Impera n\u2019imperuka,
  abana bawe bazobwirizwa kwihitiramwo uwo bazokorera. Ntiwiyumvire yuko bazopfa kwemera
  ukwizera kwawe nk\u2019aho umengo birizana. Ukuri bategerezwa kukugira ukwabo. (Imig.
  3:1, 2) Nimba umwana bisa n\u2019ibimugora, ubona gute usubiye ku bintu vy\u2019ishimikiro?
  Numufashe kuzirikana ku bibazo nk\u2019ibi: \u201cNi igiki kinyemeza yuko Imana
  ibaho? Ni igiki kinjijura ko Yehova Imana ampa agaciro vy\u2019ukuri? Kubera iki
  nemera ko ingingo mfatirwako za Yehova zihari ku bw\u2019ineza yanje vy\u2019ukuri?\u201d
  Niwerekane ko uri umwungere mwiza mu kuyobora umwana wawe canke abana bawe wihanganye,
  ubereke ko gukorera Yehova ari bwo buryo bwiza kuruta ubundi bwose bwo kubaho. *\u2014Rom.
  12:2.\\n18. Abavyeyi bokwigana gute Yehova we Mwungere Ruheta?\\n18 Abakirisu b\u2019ukuri
  bose baripfuza kwigana wa Mwungere Ruheta. (Ef. 5:1; 1 Pet. 2:25) Abavyeyi ni bo
  canecane bategerezwa kumenya ingene umukuku wabo umeze, ni ukuvuga abana babo bikundira,
  no gukora ivyo bashoboye vyose kugira babayobore babashikane ku mihezagiro Yehova
  ababikiye. Uko bishoboka kwose rero, nuragire abana bawe mu kubandanya ubarera mu
  nzira y\u2019ukuri!\\n^ ing. 9 Wipfuza ibindi vyiyumviro, raba Umunara w\u2019Inderetsi
  wo ku wa 1 Myandagaro 2008, urupapuro rwa 10-12.\\n^ ing. 12 Wipfuza kumenya n\u2019ibindi,
  raba ikiganiro kivuga ngo \u201cUgusenga kwo mu muryango\"", "\"Bavukanyi, uyu musi
  dusenga dusaba Umukama ngo atwigishe gusaba, kandi duhozako kandi tutarambirwa.
  Kuva aho ama t\u00e9l\u00e9phones akwiragiriye mu bantu hamwe n\u2019ubundi buryo
  nk\u2019ubwo bunyarutsa uguhanahana amakuru, hari vyinshi vyiza vyahindutse. Ariko
  kandi hari n\u2019ibindi bitari bike vyatanguye kutugora. Uyu musi turashobora kubona
  ko bitugora gutenyenya na bukebuke. Ariko kandi twokwibaza no ku vyo dusaba, kuvyo
  tuba twiteze ko Imana itugirira canke abo dusangiye ibi canke biriya.\\nUgusaba
  ni uguhozako\\n\u00ab Amaboko yiwe araguma gushika izuba rirenge \u00bb(igisomwa
  ca mbere). Nk\u2019uko twavyumvise, ngo Musa ntiyigeze arambirwa, ahubwo batevye
  bamushigikira kuko bamugumye hafi. Ng\u2019uwo rero amaze umusi wose asabira igihugu
  c\u2019Imana. Ni navyo twumvise mu Nkuru Nziza aho urya mupfakazi atahengeshanije
  gutakamba asaba ngo bamutunganirize.\\nIri jambo ridufashe iki mu buzima?\\n1. Twumvise
  ko Musa yihebeye ico gikorwa c\u2019ugusaba n\u2019ugusabira abana b\u2019Israeli
  ngo baronke ubwigeng\u00e9 batekane, bishire bizane, bikureko abashaka kubakandamiza.
  Ukwo nakwo kwari ukuronka aho baba ngo bubahwe, bo n\u2019amatungo yabo, babanje
  kwirukana abanyakabi, abapagani (abatamenye Imana, Abamaleki). No mu Nkuru Nziza
  nyene uguhozako mu gusaba bije imbere.\\nMbega twebwe twitangira gute abo tujejwe?
  Ni twaba turi abatware, umwe wese ku rwego rwiwe, ico gikorwa kiraturaza ishinga
  ngo\\nNtitwihiroshe rero ikinyamutwe, ngo twihe pole duti: nta mwanya mfise, birumvikana
  ko ntoja gusenga. Twohava tuba ibitimbayi, tukamenyera akabi kurya kw\u2019impuzu
  yashimye umucafu iteba igata ibara yaguranwe.\\n2. Batubwiye ko Musa yagumye asabira
  igihugu ciwe umusi wose. Ngo Aroni na Huri baraje kumushigikira: \u00ab bagumya
  amaboko yiwe. \u00bb\\nBavukanyi, iri jambo ritwigishe gufashanya gusaba, gusabiranira,
  gushigikirana kuko ari ko karanga kacu nk\u2019abakristu. Isangira ry\u2019aberanda
  tuvuga muri ndemeye riratubwira ubumwe buri hagati y\u2019Ekleziya ikigwana (twebwe
  turiho), Ekleziya ibabara (mw\u2019ipurgatori) hamwe na Ekleziya imaze gutsinda.
  Ubwo turategera neza akamaro k\u2019ugusabiranira? Iyo tubonye ibintu bitugendera
  neza ubwo turibaza ko hari n\u2019abandi badushigikije udusabisho twabo?\\nMusa,
  Aroni na Huri batubere akarorero mu kwitwararika ko abandi bogira iteka n\u2019itekane,
  gutyo tugire umutima wagutse, umutima w\u2019aba-gatorika nyene.\\nIgisabisho ciza
  ni ikijanye n\u2019ivyo Imana idushakako\\nBavukanyi, iyi Nkuru Nziza y\u2019uyu
  muwi iratangaje, mbere nogira nti irashobora n\u2019ukudutirimutsa. Twibuke ko turiko
  duherekeza Yezu mu rugendo ruja i Yeruzalemu aho araririwe n\u2019urubanza rudatunganye.
  Twibuke ko yafashwe mw\u2019ijoro ariko ku mutaga bari bageze no muri gasamburamanza,
  aciriwe urwo gupfa.\\nNone uyu musi agize ati :Imana irarasana ku bayo bayitakambira.
  Yongeyeko ko ishobora n\u2019ukubatevya! Ibwo iyo dusavye ntiduce twumvirwa ntiduca
  twihebura, tukagira duti: mbona vyose ari co kimwe? None haba habuze iki?\\nYezu
  ati: \u00ab Umwana w\u2019Umuntu aho azogarukira, mbe azosanga ukwemera kw\u2019isi?
  \u00bb\\nErega bavukanyi, ukwemera ni kwo guha intumbero vyose. Ni kwo kudushoboza
  kwinjira mw\u2019ishaka ry\u2019Imana. Iyo tutinjiye muri iryo shaka ry\u2019Imana
  yipfuriza bose ineza, umwidegemvyo n\u2019amahoro nyakuri, duca dusaba nabi.\\n\u00ab
  Wa wundi Imana yabwira ko ico ashaka cose akironka ariko yemeye ko uwo badacana
  uwaka aca aronka incuro zibiri ivyo aronse, uno nawe agaca asaba ko Imana yomunogobora
  ijisho rimwe gutyo uwo wundi acike impumyi mu kubura yose \u00bb, ng\u2019uko uko
  rimwe na rimwe igisabisho cacu kimeze!!! Bavukanyi, uyu musi twige kwinjira mu mugambi
  w\u2019Imana mu kwama tuyitega amatwi ngo itumenyeshe ivyo ishaka.\\nTuriko duherekeza
  Yezu. Turazi ko amaganya yamwishe aho yagira ati : \u00ab Dawe, ni vyaba bishoboka,
  nkiza iyi kalisi. \u00bb\\nMbega yarumviwe?\\nEgome cane, yarumviwe, ariko yumviwe
  ukundi. Imana yaramuninahaje mw\u2019izuka, maze itwereka y\u2019uko amagorwa, n\u2019aho
  rwoba urupfu nyene, adafise ijambo rya nyuma ku bemera Imana. Igisabisho cacu rero
  kiraronka inyishu, kiretse ko hari igihe turonka inyishu tutari twiteze, gutyo ntitubone
  ko Umakama yatwishuye. Hari igihe rero turondera umuhori tuwufise mu kwaha. Imana
  iramutse idutebeje naho, hari n\u2019aho iba irindiriye ko twotyorora ico gisabisho
  cacu kuko ku vy\u2019ukuri irumva, irabona ivyo dukeneye kuruta n\u2019ukwo twebwe
  nyene tubibona. Ugusaba rero si ugutsindikira Imana ku vyo dushaka. Ni ukwinjira
  mu mugmbi w\u2019Imana ishakira ineza bose, na twebwe nyene turimwo.\\nKugira tubishikeko,
  Pawulo Mweranda yaduhanuye kwama twisunga Inambo ry\u2019Imana ati: urazigama ivyo
  bakwigishije, wame umenya ibitabu vyeranda kuko icanditswe cose cohejwe n\u2019Imana
  kandi gifise akamaro mu kwigisha, kugorora no mu kurera mu butungane \u00bb\\nIvyo
  rero bidukomereze ukwemera. Twumvise ko ari naco kibazo gisozera Inkuru Nziza. Imana
  irashima kururindiriza kugira ngo ukwelera kwacu gukomere, ibisabisho vyacu bityororwe
  kugira twige kwakira ivy\u2019Imana itugabiye kuko ari vyo biba bitubereye. Tugire
  urunani mu gusaba n\u2019ugusabiranira twebwe abemera ngo ishaka ry\u2019Imana riranguke.\"",
  "\"Abayobozi bo mu burengerazuba bw\u2019isi baravuga ko hari ibimenyetso bigaragaza
  ko habayeho kwibeshya ku ndege, misile ya Iran ariyo yarashe igahanura indege y\u2019abagenzi
  mu kirere cya Tehran.\\nAbategetsi ba Canada n\u2019Ubwongereza basabye ko hakorwa
  iperereza ryimbitse ku byabaye kuri iyi ndege yaguyemo abantu 176 bose bari bayirimo.\\nIran
  yahakanye ko misile y\u2019igisirikare cyayo ariyo yahanuye iyi ndege.\\nGuhanuka
  kw\u2019iyi ndege kwabaye kuwa gatatu hashize amasaha gusa Iran irashe za misile
  ku birindiro bibiri birimo ingabo za Amerika biri muri Iraq.\\nHari ibitangazamakuru
  muri Amerika bivuga ko iyi ndege y\u2019ubucuruzi yaba yararashwe habayeho kwibeshya
  ko ari indege y\u2019intambara ya Amerika ije kwihimura kuri ibyo bitero bya Iran.\\nIgitangazamakuru
  CBS kivuga ko amakuru gikesha inzego z\u2019ubutasi ari uko ibyogajuru byafashe
  ibishashi bya misile ebyiri zihaguruka bigakurikirwa no guturika.\\nIkinyamakuru
  Newsweek cyo muri Amerika cyo kivuga ko amakuru gikesha abo muri Pentagon n\u2019abo
  mu butasi bwa Iraq avuga ko iyi ndege yari ivuye muri Ukraine yarashwe na misile
  ikorerwa mu Burusiya.\\nPerezida wa Amerika Donald Trump ejo kuwa kane yavuze ko
  yari afite \u2019amakenga\u2019 ku byabaye kuri iriya ndege.\\nHaracyari kare kwanzura\\nMinisitiri
  w\u2019intebe wa Canada Justin Trudeau yavuze ko yabonye amakuru y\u2019ubutasi
  butandukanye yemeza ko iriya ndege yahanuwe na misile zirasiwe ku butaka bwa Iran.\\nYongeraho
  ko bishoboka ko byabayemo kwibeshya.\\nAti: \\\"Ibi bisobanura ko hakenewe iperereza
  ryimbitse, Abanyacanada bafite ibibazo kandi bagomba guhabwa ibisubizo.\\\"\\nBwana
  Trudeau yavuze ko hakiri kare kwanzura ku byabaye, yanga kuvuga ibirambuye ku bimenyetso
  avuga ko yabonye.\\nAbanyacanada 63 bari muri iyi ndege yari ivuye i Kyiv igana
  i Toronto.\\nMinisitiri w\u2019intebe w\u2019Ubwongereza Boris Johnson yashimangiye
  ibyavuzwe na Bwana Trudeau, yemeza ko bari gufatanya na Canada n\u2019abandi bagizweho
  ingaruka n\u2019iyi ndege.\\nIran irahakana kurasa iyi ndege\\nMu kiganiro n\u2019abanyamakuru
  uyu munsi kuwa gatanu umuyobozi w\u2019ikigo cy\u2019indege za gisiviri cya Iran
  Ali Abedzadeh yasubiyemo ko misile atari yo yahanuye indege.\\nYabwiye abanyamakuru
  ati: \\\"Ikintu tuzi neza kandi twavuga tudashidikanya ni uko iyi ndege itahanuwe
  na misile.\\nNk\u2019uko nabivuze ejo, iyi ndege mu gihe kirenga umunota n\u2019igice
  yari yafashwe n\u2019umuriro iri mu kirere kandi aho yari iri hagaragaza ko umupilote
  yariho agerageza kugaruka.\\\"\\nEjo kuwa kane, umuvugizi wa leta Ali Rabiei yashinje
  Amerika n\u2019inshuti zayo \\\"kubeshya no gushoza intambara yo gushyushya imitwe\\\"
  bakwiza impuha ku cyateye iyi mpanuka.\\nUmwe mu bategetsi ba Iran yabwiye BBC uyu
  munsi ko hari inyandiko igaragaza ko iyi ndege yari ifite ikibazo cya mekanike mbere
  yo guhaguruka.\\nUyu avuga ko iyi ndege yari yabujijwe guhaguruka ariko abashinzwe
  iby\u2019indege muri Ukraine babirengaho.\\nNi inde uzakora iperereza?\\nMu gihe
  hakomeje umwuka mubi nyuma y\u2019uko Amerika yishe umunya-Iran general Qasem Soleimani
  ku itariki ya 03 uku kwezi, Iran yabanje kuvuga ko itazatanga ibisigazwa by\u2019iyi
  ndege ya Boeing, ikorerwa muri Amerika, ngo bisuzumwe.\\nGusa nyuma umwe mu bayobozi
  muri Iran yabwiye Reuters ko batumiye Amerika ngo ize mu iperereza kandi yohereje
  umuntu mu bagomba gukora iperereza.\\nIkigo gishinzwe iby\u2019ingendo zo mu kirere
  cya Canada nacyo cyatumiwe i Tehran mu iperereza ku hantu iyi ndege yaguye.\\nMu
  mategeko mpuzamahanga y\u2019iby\u2019indege za gisiviri Iran ifite uburenganzira
  bwo kuyobora iperereza, ariko uwakoze indege nawe akabigiramo uruhare.\\nInkuru
  ya BBC\"", "\"Inararibonye mu muziki w\u2019Uburundi Justin Baransananikiye aherutse
  kugirana umubonano n\u2019abaririmvyi bo mu ntara ya Gitega, intumbero kwari kurabira
  hamwe ibijanye n\u2019uruganda rwo kubigisha ibijanye n\u2019umuziki nyawo w\u2019Uburundi.\\nUmubonano
  wari witabwe n\u2019abaririmvyi b\u2019i Gitega atari bake barimwo n\u2019abigeme,
  wabereye mu Kigo Alliance Fran\u00e7aise c\u2019i Gitega. Abo baririmvyi bashaka
  kuyaga na Musenyeri Justin BARANSANANIKIYE ibijanye n\u2019uruganda rwateguwe rwo
  kubigisha ubuhinga nyabwo bwo kwongera gusubiza akanovera umuziki w\u2019Uburundi.\\nMusenyeri
  Justin Baransananikiye yabaciriye ku mayange ukuntu mu gihe ciwe ca kera, batanguye
  guteza imbere umuziki w\u2019Igihugu cacu muri Orchestre National ya mbere mu mwaka
  w\u20191977. Yabwiye abaririmvyi b\u2019i Gitega ko ubu bigaragara ko umurongo bo
  bakorerako kera atariwo abaririmvyi bo mu Burundi ba kino gihe bakorerako, kuko
  baguma babura amajwi y\u2019indirimbo zabo ku zo mu bindi bihugu, bigatuma akaranga
  k\u2019Uburundi katakigaragara, n\u2019ururimi rwacu rukononekara.\\nMusenyeri Justin
  yabaciriye agace ku kuntu bobo mu gihe cabo kera, bagenda mu misozi, bakegera abavuza
  inanga n\u2019amakembe n\u2019imiduri, n\u2019abavyina imvyino, bakabumviriza bitonze,
  bagaheza bakababurako amajwi n\u2019amajambo ari mu kirundi kiryohoye, bagatako
  bakikora ku nararibonye z\u2019abakurambere zizi Ikirundi neza zikabakosora, bagaca
  baja kuyahinguramwo indirimbo ziteye igomwe zakunzwe cane, nka INDEGE IRAHINDA,
  IMVUMERO YAWE NI YO NGOMANGOMA, IYO MANZI WARARAYE, AGACACA KARANTEZE, NKANDIRA,
  n\u2019izindi nyinshi.\\nYababwiye kandi abo baririmvyi ko bakora amakosa menshi
  cane mu gushaka kwitwa abanditsi b\u2019amajambo y\u2019indirimbo, bakongera bakaba
  kandi n\u2019abahingura amajwi. Musenyeri Justin yavuze ko, ivyo bikorwa bibiri
  bidasa, kuko umwanditsi w\u2019amajambo atagerezwa kuba ari umuntu yize neza akanonosora
  ivy\u2019indimi, mu gihe uwuhingura amajwi y\u2019indirimbo ategerezwa kuba uwuzi
  neza ivy\u2019amategeko n\u2019ubuhinga bw\u2019umuziki.\\nKu kibazo c\u2019uko
  abaririmvyi batoririmba mu Kirundi gusa kandi bari mw\u2019ishirahamwe rya Afrika
  y\u2019Ubuseruko bavuga indimi nyinshi, Justin yabahaye akarorero ka Youssou N\u2019dour
  wo muri Senegal n\u2019umuhisi Miriam Makeba wo muri Afrika y\u2019epfo, ukuntu
  bagizwe rurangiranwa n\u2019indirimbo baririmvye mu ndimi zabo kavukire, ariko zari
  zifise akanovera gashasha zizanye ku rubuga rw\u2019umuziki mpuzamakungu.\\nMama,
  sinzi ukuntu nogushimira ku mwitwaririko nk\u2019uyu ufise kubwo kwigisha abana
  b\u2019Uburundi icigwa c\u2019Umuziki cazimanganye mu giguhu cacu. Imana iguhezagire
  cane. Ishure rimaze kwitwa gurtyo, ivyaryo bivugirwa ku mugaragaro. Rero, INSTITUT
  DE MUSICOLOGIE DE GITEGA ifise ibisata bibiri bikurikira :\\n1.IGISATA CIGISHA UMUZIKI
  KUMARA IMYAKA ITATU 3 : gitanga Ivyigwa vy\u2019Umuziki mu nzego zawo zose. Abarangije
  ico Gisata, bashobora kuba abigisha babunyoye b\u2019Icigwa c\u2019umuziki mu mashure
  mato n\u2019ayisumbuye, canke bagashinga imirwi yabo y\u2019umuziki yaba ama orchestres
  canke Chorales, canke bakaba abahinga bitumwako bakorana na za studio zisohora ama
  albums y\u2019indirimbo mu kuba ababafasha guhinyanyura neza amajwi y\u2019abaririmvyi
  n\u2019ay\u2019ibicurarangisho. Bashobora kandi kuba abanditsi b\u2019ibitabo vy\u2019amajwi
  y\u2019indirimbo izo ari zo zose nk\u2019uko turiko turabikora ubu kugira indirimbo
  zitandukanye zo mu Burundi ntizize zizimangane kandi zizoshobore kuririmbwa ata
  kosa naho hoba mu myaka igihumbi izoza. Barashobora no kuba abashakashatsi b\u2019abahinga
  mu guhinyanyura indirimbo nziza zabuwe mu muziki kavukire uwo ari wo wose. Bazohabwa
  DIPLOME yemeza ko ari ABAHINGA B\u2019UMUZIKI.\\nMu kwinjira muri ico Gisata c\u2019imyaka
  itatu 3, twasavye ko umuntu aba yarahejeje n\u2019imiburiburi umwaka w\u2019icumi
  w\u2019amashure yisumbuye, ariko n\u2019uwuyirenza arashobora kuza kuko nk\u2019uko
  wabiduhanuye, birashobora kuzomuha akazi ko kwigisha umuziki. Ukwiyandikisha ni
  amafranga IBIHUMBI MIRONGWITANU 50.000 FBU y\u2019ishure, minerval, ku mwaka, hakongerwako
  ayandi IBIHUMBI CUMI 10.000 FBU vyo kwiyandikisha. Umunyeshure wese arimenya kuvy\u2019indaro.
  Ivyigwa bizotangurira co kimwe n\u2019ayandi mashure mu kwezi kw\u2019icenda. Mu
  vyo biga, harimwo kandi Igifaransa, Icongereza, Ikirundi, Igiswahili, Ibiharuro,
  Informatique, Comptabilite, Entrepreneuriat, bizobafasha gutunganya akazi kabo bahejeje.
  Aba mbere nibasohoka, tuzoba twuguruye KAMINUZA Y\u2019UMUZIKI IMARA IYINDI MYAKA
  IBIRI 2, ikurira iri Shure, kugira ngo abifuza kurushirizaho rwooose kunonosora
  ivy\u2019umuziki bashobore kubishikako, kuko burya umuziki naho bawukengera, ufise
  ibisata vyagutse cane biwugize. Abazosohoka muri iyo Kaminuza y\u2019Umuziki na
  bo, bazoshobora kuba abagenduzi b\u2019Ivyigwa vy\u2019Umuziki mu mashure, canke
  bashinge ayandi mashure y\u2019Umuziki mu zindi ntara z\u2019igihugu cacu canke
  mu makungu, babe abanditsi\\nb\u2019ibitabo vy\u2019umuziki, canke bazohabwe akazi
  ko gutegura no gutunganya ama programmes yo kurushirizaho kwigisha Umuziki neza,
  n\u2019ibindi.\\n2. Dufise n\u2019IGISATA KIJEJWE GUTEGURA AMA SEMINAIRES N\u2019AMA
  RECYCLAGES Y\u2019UMUZIKI amara igihe gito, kigakora cisunze ivyo tuba tubonye ko
  abaririmvyi canke abacuraranzi baba bakenye kunagurwamwo canke gukosorwako. Mu kwinjira
  muri iki Gisata, nta mashure umuntu yize turaba. Apfa kuba yerekanye ko yifuza kunagurwa
  mu vyo tuba dutumbereye kwigishako. Nk\u2019akarorero, iki Gisata ni co giteguye
  rwa RUGANDA NKARISHABWENGE RW\u2019ABARIRIMVYI B\u2019I GITEGA, ruzoba guhera ejo
  itariki 7 Mukakaro gushika itariki 27 Myandagaro, rukazobera harya muri ALLIANCE
  FRANCAISE i Gitega. Uwifuza kuja mu Nganda bene izo, atanga amafranga IBIHUMBI BITANU
  5000 FBU yo kwiyandikisha, hanyuma akigurira ibitabo dutegura kubigishirizamwo.
  Abanagurwa muri aya ma Seminaires tubaha ATTESTATION yemeza ko banaguwe muri ivyo
  tuba twabigishije.\\nIki Gisata nyene ni co categuye Ivyigwa vyo kunagura Abigisha
  ba Shure Shingiro cisunze programmes z\u2019Umuziki bafise zo mu myaka y\u2019indwi
