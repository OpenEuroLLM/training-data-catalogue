  c\u2019Urwanda. Umushingamateka Pascal NYABENDA avuga ko yatahuwe ukutari kwo, n\u2019abantu
  bamwe bamwe bafata insiguro zitarizo ku vyashikirijwe.\\nMw\u2019itangazo inama
  nshingamateka y\u2019Uburundi yasohoye kuri uwu wa gatatu, bamenyesheje ko itangazo
  rya CNDD FDD ryo kuwa 16 Myandagaro 2016 ryateweko umukono na Pasacal Nyabenda ryakiriwe
  ukutariko, kuko umushingamateka Pascal NYABENDA atigeze ahakana ko ihonyabwoko ritabaye
  mu gihugu c\u2019Urwanda mu mwaka w\u20191994.\\nUmukuru w\u2019inama nshingamateka
  y\u2019Uburundi yibutsa ko ibikorwa vy\u2019ihonyabwoko uko bisa n\u2019aho biturutse
  hose avyamirira kure. Pascal Nyabenda ahamagarira abantu ko bomenyera gutandukanya
  ibintu umuntu ashikirije ku giti ciwe n\u2019ivyo avuga nk\u2019uwuserukira urundi
  rwego.\\n- Pascal NYABENDA yahoze ari umukuru w\u2019umugambwe CNDD FDD\\nItangazo
  rya CNDD FDD ryazanye impari\\nITANGAZO NO 016/2016 RY\u2019UMUGAMBWE CNDD-FDD RYO
  KU WA 16 MYANDAGARO 2016\\nMu gihe ONU itegekanya abaporisi 228 barungikwa mu Burundi
  ku nguvu, Rom\u00e9o Dallaire na Louise Arbour bariko batega imitego mu Karere Uburundi
  buherereyemwo.\\n1. Kw\u2019igenekerezo rya 29 Mukakaro 2016, Akanama k\u2019umutekano
  kw\u2019Isi ka ONU karafashe icemezo giteye isoni inomero 2303 ku majwi 11 mu gihe
  ayandi 4 ataco yabivuzeko. Ico cemezo cashitsweko mu kajagari ntangere. Ico cemezo
  caje kivuguruza icemezo inomero 2248 co ku wa 12 Munyonyo 2015 be n\u2019icemezo
  inimero 2279 co ku wa 1 Ndamukiza 2016 mu bijanye no kwubahiriza Ubwigenge bw\u2019igihugu,
  ukwikukira kw\u2019Igihugu, imbibe zaco n\u2019Ubumwe bw\u2019Abarundi. Ico cemezo
  cafashwe Reta y\u2019Uburundi itagishijwe inama nk\u2019uko womengo Uburundi ntiburongowe
  n\u2019inzego zitorewe n\u2019Abenegihugu ;\\n2.Ako kajagari kibonekeje mu Kanama
  k\u2019umutekano kw\u2019Isi ka ONU, igihe bariko barafata ingingo zininahaza ibikorwa
  vy\u2019abashatse gutembagaza inzego zitorewe n\u2019abenegihugu kw\u2019itariki
  ya 13 Rusama 2015, kaherekejwe n\u2019amakuru amenyesha ko umunyakanada Rom\u00e9o
  Dallaire yahoze arongoye za ngabo za MINUAR zari mu Rwanda kugira ngo zishikane
  FPR-Inkotanyi ku butegetsi mu 1994 be n\u2019umunyakanadakazi Louise Arbour yahoze
  ari umushikirizamanza mukuru muri ya sentare y\u2019i Arusha (TPIR) mu gihugu ca
  Tanzaniya yari ijejwe kwemeza ihonyabwoko no gucira urubanza abatsinzwe ku butegetsi
  mu Rwanda, bariko baragendera ibihugu bimwe vya Afrika. Ayo makuru yasohotse mu
  kinyamakuru ngurukanabumenyi http: www.rcinet.ca co ku wa 8 Myandagaro 2016 kimenyesha
  ko abo banyakanada baje muri Afrika kugira baronderere isoko ingabo zabo mu bikorwa
  vyo kugarukana amahoro. Abo bantu babiri b\u2019abanyakanada, kubona basubira kuvugwa
  mu Karere k\u2019Ibiyaga binini no mu buseruko bwa Afrika si impanuka canke si ivyashitse
  giturumbuka, ahubwo bari ku bikorwa vy\u2019iperereza no kurondera ababashigikira
  kugira ngo ingabo za ONU zize muri kimwe mu bihugu vyo muri kano karere, na cane
  cane mu Burundi ;\\n3. Ibikorwa bibi abakunzi ba demokarasi bibukirako Rom\u00e9o
  Dallaire ni ivyo kuba yararongoye MINUAR mu Rwanda, agafasha FPR-Inkotanyi mu kuyishigikira
  no gushira mu ngiro vya vyiyumviro vy\u2019ihonyabwoko Paul Kagame yagenderako,
  no mu kuyifasha mu vya gisirikare. Nk\u2019uko vyagiye biravurwa no kwandikwa bikandikwa
  n\u2019abantu batari bake, uwo mugabo Rom\u00e9o Dallaire na MINUAR yategeka mu
  Rwanda, niwe yinjije Inkotanyi mu muji wa Kigali azikuye aho bita ku Murindi akazishikana
  mu nama nshingamateka bita CND. Izo nkotanyi Rom\u00e9o Dallaire yagenda azikura
  ku Murindi be n\u2019ibirwanisho, akavuga ko bagiye gusenya inkwi MINUAR ikoresha
  n\u2019izo Nkotanyi nkeya zababa amajana atanu (500) zari zemejwe n\u2019amasezerano
  ya Arusha hagati ya Juvenal Habyarimana na Paul Kagame, ariko mu mwanya mutoya izo
  nkotanyi zahavuye zirenga kure n\u2019iyo 2000 zifise n\u2019ibirwanisho bikomakomeye
  zahabwa na MINUAR. Ikindi cavuzwe ni uko uwo Rom\u00e9o Dallaire ahantu hose yashize
  ikirenge mu muji wa Kigali yagiye ahashinga ibikoho vya muzinga bikomakomeye, akaba
  yabisigiye inkotanyi za FPR igihe yiruka asubira iwabo, avuga ko ubutumwa (mission
  ) bwaheze, intambara ibaye. Ukugenda kwiwe rero na MINUAR kwerekana ko ubutumwa
  yari yahawe bwari buheze kuko ivyari bikenewe vyose kugira FPR-Inkotanyi ifate ubutegetsi
  vyari vyahejeje gushirwa mu ngiro. Bikumvikana rero ko, iyo hataba ugufashwa kwa
  FPR-Inkotanyi na Rom\u00e9o Dallaire wa MINUAR, FPR-Inkotanyi itopfuye ifashe ubutegetsi
  mu Rwanda. Amarementanya y\u2019ihonyabwoko ryategerezwa gusukwa kuri Reta yitwa
  ko yari iy\u2019aba \u00ab Bantoue \u00bb b\u2019abahutu yari yaramaze gutegekanywa
  no kwubakwa neza, hakaba hari hasigaye kuyashira mu ngiro. Paul Kagame rero, mu
  gutera Urwanda yisunze ihonyabwoko, yari azi y\u2019uko abantu biwe bazopfa kuko
  yababwira ko batitanze ; bagahwera ata ntsinzi bazoronka n\u2019aho bamwe mu biwe
  bamubaza, barira bariragurika ingene bizogenda kuri ayo mahano bateje mu Rwanda
  no kw\u2019Isi ;\\n4. Hariho umunyakanadakazi yitwa Louise Arbour yari umushikirizamanza
  mukuru muri ya sentare mpanavyaha y\u2019i Arusha (TPIR) yari yateguriwe kwemeza
  ihonyabwoko abatsinzwe, gutyo bakazoboneraho kwica uwo wese Paul Kagame abona ko
  ari intambamyi ku gihugu ciwe. Birababaje rero kubona abo bantu babiri bongera kuvugwa
  mu Karere kabereyemwo ibara, bikaboneka ko bazanywe no kwuzuza umugambi wo gutembagaza
  ubutegetsi badashaka mu gihugu iki canke kiriya mu Karere na cane cane mu Burundi
  ;\\n5. N\u2019ikimenyamenya mu gihe bariko baratembera mu Karere, Komiseri Mukuru
  ajejwe ivyo agateka ka zina muntu muri ONU Zeid Ra\u2019ad Al Hussein ariko arakokeza
  ngo Umugambwe CNDD-FDD na Reta yawo ngo bariko barica abantu urubozo, kandi ngo
  harabafatwa bagapfungira ubusa ku banyeporitike, emama ! ngo abantu bariko baranyuruzwa,
  ngo Imbonerakure ziriko zirafata ku nguvu abakenyezi n\u2019abigeme, n\u2019ayandi
  mabi menshi. Ivyo vyose bikaba biri muri wa mugambi mubi w\u2019amarementanya begeka
  ku ndongozi z\u2019Uburundi kugirango baronke aho bahera, baheze barungike ingabo
  zo gutera Uburundi no gutembagaze ubutegetsi badashaka nk\u2019uko babikoze muri
  Libiya, Siriya, Iraq n\u2019ahandi. Ni muri iyo nzira abo bahinga b\u2019amarementanya
  n\u2019amahonyabwoko agamije gutembagaza inzego zitorewe n\u2019Abenegihugu barungitswe
  na ONU kugira baze kuraba neza ingene ivyabaye mu Rwanda arivyo vyokorwa mu Burundi
  canke n\u2019ahandi hose bipfuza gutembagaza ubutegetsi mu karere. Umunyakanadakazi
  Louise Arbour, bica vyumvikana ko ajejwe kuba arategura amarementanya azosuka ku
  ndongozi z\u2019Uburundi kugira baze bazijane muri ya sentare y\u2019i Lahaye canke
  mu yindi sentare ;\\n6. Iki ciyumviro ntabwo ari indoto mbi kuko categuwe cane kugeza
  muri ONU. Muri ca cemezo c\u2019Akanama k\u2019umutekano kw\u2019Isi ka ONU inomero
  2303 yo ku wa 29 Mukakaro 2016 ku ngingo yaco ya 17 ivuga ibi bikurikira : \u00ab
  Gasaba Amareta yo mu karere kureka abakozi n\u2019abaporisi barungitswe na ONU mu
  Burundi bakishira bakizana hagati y\u2019Ibihugu mu kwinjira no mu kuva mu Burundi
  mu gihe bazoba bagiye kurondera ibikoresho, ivyo kurya n\u2019ibindi vya nkenerwa
  bazoba bakeneye kandi bigakorwa bidatevye \u00bb. Iyo ngingo iha uburenganzira budasanzwe
  izo ngabo ni nk\u2019imwe Rom\u00e9o Dallaire yakorerako muri MINUAR, igihe yaza
  arakura Inkotanyi ku Murindi azijana i Kigali. Biraboneka rero y\u2019uko amayeri
  ariko arashaka gukoreshwa mu kuzana abaporisi 228 ba ONU i Bujumbura mu Burundi
  afise aho afatira kuko ariyo yakoreshejwe mu gushikana Paul Kagame na FPR yiwe ku
  butegetsi ibihugu vy\u2019 Ububirigi, Ubufaransa, Ubuhorande, Amerika bikaba vyarafashije
