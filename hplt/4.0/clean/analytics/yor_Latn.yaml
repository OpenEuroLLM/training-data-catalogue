  sii ni aidaniloju ju eyiti o kere pup\u1ecd l\u1ecd Argo itan, sugbon to ni a m\u1ecd
  nipa w\u1ecdn lati da a \u00ecgb\u00e9s\u1eb9 it\u1ecdju. Aw\u1ecdn olukopa ninu
  1953 coup ati ni 1979-81 aaw\u1ecd idil\u1ecdw\u1ecd ti \u1e63apejuwe aw\u1ecdn
  i\u1e63\u1eb9l\u1eb9 ni aw\u1ecdn alaye ti o to lati \u1e63e atil\u1eb9yin iwe af\u1ecdw\u1ecdk\u1ecd
  fiimu ti o lagbara. Nitoot\u1ecd, Miles Copeland, o\u1e63i\u1e63\u1eb9 CIA kan ti
  o \u1e63i\u1e63\u1eb9 lori ifipabanilopo 1953 paapaa tun pada fun ifarahan cameo
  kan ninu aw\u1ecdn i\u1e63\u1eb9 Republikani ni ayika aw\u1ecdn idunadura idinam\u1ecd
  Carter ni \u1ecddun 1980. [Wo Robert Parry''s Iroyin ji ti Am\u1eb9rika.]\\nMo m\u1ecd
  pe Hollywood ni ko nipataki nife ninu jij\u1eb9 oye laarin adversarial oril\u1eb9-ede.
  \u1e62ugb\u1ecdn boya fiimu kan nipa ifipabanilopo 1953 tabi \u1ecdkan ti o l\u1ecd
  l\u1eb9hin-aw\u1ecdn oju i\u1e63\u1eb9l\u1eb9 ti aaw\u1ecd igbelew\u1ecdn 1979-81
  le \u1e63e iranl\u1ecdw\u1ecd fun aw\u1ecdn eniyan Am\u1eb9rika nipa ibatan eka
  ti o ti wa laarin Am\u1eb9rika ati Iran. O ni ko kan ti o dara eniyan vs. buburu
  eniyan.\\nNitorib\u1eb9\u1eb9, iy\u1eb9n le j\u1eb9 idi pataki ti Hollywood rii
  di\u1eb9-m\u1ecd Argo itanj\u1eb9 \u1ecdranyan ati aw\u1ecdn itan nla miiran lati
  j\u1eb9 ti kii \u1e63e aw\u1ecdn ib\u1eb9r\u1eb9. Argo ni ibebe fa itan r\u1eb9
  ni dudu ati funfun, p\u1eb9lu aw\u1ecdn ikede ikede ti o lagbara, ifunni sinu ikorira
  l\u1ecdw\u1ecdl\u1ecdw\u1ecd laarin Am\u1eb9rika ati Iran lori eto iparun r\u1eb9.\\nLaibikita
