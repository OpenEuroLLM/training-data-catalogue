  ati Ile-\u1eb9k\u1ecd giga le tiju lati fifun Oscars ni oju ariyanjiyan.\\n\u1e62ugb\u1ecdn
  boya ninu aw\u1ecdn itan bookend ni ayika Argo yoo gba si aw\u1ecdn otit\u1ecd pataki
  di\u1eb9 sii ju ti Aworan Ti o dara jul\u1ecd ti \u1ecddun yii l\u1ecd. Aw\u1ecdn
  itan meji naa yoo fihan bi Am\u1eb9rika ti \u1e63e af\u1ecdw\u1ecdyi i\u1e63elu
  ni okeere ati bii i\u1e63e y\u1eb9n \u1e63e ti wa si ile lati dide.\\n[Fun akoko
  to lopin, o le ra m\u1eb9tal\u1ecdl\u1ecd m\u1eb9ta Robert Parry lori idile Bush,
  eyiti o p\u1eb9lu aw\u1ecdn ak\u1ecd\u1ecdl\u1eb9 alaye ti aw\u1ecdn itan itanj\u1eb9
  eke w\u1ecdnyi, fun $34 nikan. Fun alaye, kiliki ibi.]\\nOnirohin oniwadi Robert
  Parry f\u1ecd \u1ecdp\u1ecdl\u1ecdp\u1ecd aw\u1ecdn itan Iran-Contra fun The Associated
  Press ati Newsweek ni aw\u1ecdn \u1ecddun 1980. O le ra iwe titun r\u1eb9, Iroyin
  Ara Ilu Ilu Am\u1eb9rika, boya ninu t\u1eb9 nibi tabi bi iwe e-iwe (lati Amazon
  ati barnesandnoble.com).\\n\u1e62aaju ki Mo to s\u1ecd ero mi nibi Emi yoo f\u1eb9
  lati daruk\u1ecd pe \u1ecdm\u1ecd Iran kan ni mi, alaigbagb\u1ecd ti ko tii wo fiimu
