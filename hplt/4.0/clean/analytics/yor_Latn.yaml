  k\u1ecd \u1eb9k\u1ecd pup\u1ecd di\u1eb9 sii ti Affleck ba ti yan igbim\u1ecd CIA
  ni \u1ecddun 1953 tabi chicanery Republikani ni \u1ecddun 1980, Robert Parry s\u1ecd.\\nNipa
  Robert Parry\\nNi di\u1eb9 ninu aw\u1ecdn \u1ecdna ti o j\u1eb9 iwuri pe \u1ecdp\u1ecdl\u1ecdp\u1ecd
  aw\u1ecdn yiyan Aworan Ti o dara jul\u1ecd ni aw\u1ecdn akori itan, boya w\u1ecdn
