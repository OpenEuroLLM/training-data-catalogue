  i\u1e63\u1eb9l\u1eb9 ak\u1ecdk\u1ecd 2 tan kaakiri agbaye ti o j\u1eb9 \u1eb9bi
  lori Am\u1eb9rika mejeeji.\\n1. G\u1eb9g\u1eb9bi a ti m\u1eb9nuba r\u1eb9 ninu nkan
  naa, l\u1eb9hin if\u1eb9nukonu Am\u1eb9rika ti 1953 ni Iran, Shah t\u1eb9 gbogbo
  aw\u1ecdn \u1eb9gb\u1eb9 oselu ni Iran (fun ap\u1eb9\u1eb9r\u1eb9 Komunisiti, Nationalist)
