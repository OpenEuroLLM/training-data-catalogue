  America, Japan, Korea , Hong Kong ati Taiwan.\\nIle-i\u1e63\u1eb9 wa ti o t\u1eb9le
  ilana \u201corisun iduro\u1e63in\u1e63in, didara i\u1e63\u1eb9 ni ak\u1ecdk\u1ecd\u201d,
  ti ni idagbasoke ni a\u1e63ey\u1ecdri \u1ecdp\u1ecdl\u1ecdp\u1ecd aw\u1ecdn alaba\u1e63i\u1e63\u1eb9p\u1ecd
  ile ati ajeji.A yoo \u1e63e ipa wa ti o tobi jul\u1ecd si gbogbo aw\u1ecdn alabara
  ati gbogbo aw\u1ecdn \u1ecdja, t\u1eb9siwaju lati yipo di\u1eb9 sii ati aw\u1ecdn
  \u1ecdja to dara jul\u1ecd lati \u1e63e atil\u1eb9yin fun gbogbo aw\u1ecdn alabara
  lati \u1e63e idagbasoke \u1ecdja nla kan.\"", "\"By World BEYOND War, Aw\u1ecdn
  ohun Juu Juu olominira, Just Advocates, ati Institute Foreign Foreign Institute,
  May 21, 2021\\nToronto, Ontario - Loni aw\u1ecdn \u1ecdm\u1ecd \u1eb9gb\u1eb9 ti
  agbegbe Juu ati aw\u1ecdn alam\u1ecdde fi ifiran\u1e63\u1eb9 ti o han gbangba han
  ni igbim\u1ecd Israeli ni ilu Toronto nipa \u1eb9j\u1eb9 \u1eb9j\u1eb9 lati iwa-ipa
  Israeli ni Gasa ati k\u1ecdja Palestine itan.\\nRabbi David Mivasair, \u1ecdm\u1ecd
  \u1eb9gb\u1eb9 ti Independent Jewish Voices, s\u1ecd pe, \u201cKo le j\u1eb9 i\u1e63owo
  bi deede ni aw\u1ecdn igbim\u1ecd Israeli ni Canada. Iku ati iparun ti Israeli \u1e63e
  ni Gasa, ati iwa-ipa giga nipas\u1eb9 Israeli k\u1ecdja Palestine, ko le w\u1eb9.
  Ija-ija yii j\u1eb9 tuntun jul\u1ecd ninu i\u1e63\u1eb9 akan\u1e63e ibinu 73-\u1ecddun
  isom\u1ecdto atipo ti o nl\u1ecd l\u1ecdw\u1ecd nipas\u1eb9 Israeli k\u1ecdja Palestine
  itan. Idaduro naa ko pari ai\u1e63ododo ati ir\u1eb9j\u1eb9. \u201d\\nLati O\u1e63u
  Karun \u1ecdj\u1ecd 10, o kere ju aw\u1ecdn Palestinians 232 ni a pa ni ibakal\u1eb9
  Israeli ti Gasa, ni ibamu si aw\u1ecdn ala\u1e63\u1eb9 ilera, p\u1eb9lu aw\u1ecdn
  \u1ecdm\u1ecd 65. Ju aw\u1ecdn eniyan 1900 ti gb\u1ecdgb\u1eb9.\\nRachel Small,
  olu\u1e63eto p\u1eb9lu World BEYOND War, \u1e63alaye, \u201cA n \u1e63e iwa-ipa
  ti i\u1e63\u1eb9 ika buruju ti Israeli, aw\u1ecdn ik\u1ecdlu ologun, ati \u1e63i\u1e63e
  af\u1ecdm\u1ecd \u1eb9da ni o han nihin nibi \u1eb9nu-\u1ecdna igbim\u1ecd. A n
  j\u1eb9 ki ko \u1e63ee \u1e63e fun \u1eb9nik\u1eb9ni lati w\u1ecdle ki o jade kuro
  ni aw\u1ecdn \u1ecdfiisi ij\u1ecdba ti Israel nihin laisi titako taara iwa-ipa ati
  itaj\u1eb9 sil\u1eb9 ti w\u1ecdn j\u1eb9 alaj\u1ecd\u1e63ep\u1ecd ninu.\\nRabbi
  Mivasair s\u1ecd ninu Iwe Genesisi pe, \u201c''Oh\u00f9n \u1eb9j\u1eb9 arakunrin
  r\u1eb9 kigbe si mi lati il\u1eb9.'' Aw\u1ecdn Ju ara ilu Kanada ati aw\u1ecdn miiran
  darap\u1ecd m\u1ecd loni lati rii daju pe a gb\u1ecd igbe paapaa ti \u1eb9j\u1eb9
  ba d\u1eb9kun didi tuntun. \u1e62i\u1e63an pupa ti n\u1e63an lati igbim\u1ecd Israeli
  si ita ita ni Toronto duro fun \u1eb9j\u1eb9 ti aw\u1ecdn alagbada iwode alail\u1eb9gb\u1eb9
  ti a pa, \u1eb9j\u1eb9 ni \u1ecdw\u1ecd Israeli. G\u1eb9g\u1eb9bi aw\u1ecdn ara
  ilu Kanada, a beere pe ij\u1ecdba wa j\u1eb9 ki Israeli jiyin fun aw\u1ecdn odaran
  ogun ati daw\u1ecd i\u1e63owo Canada-Israel.\\n\u201cIbanuj\u1eb9 ati ibinu bori
  aw\u1ecdn Ju ni aw\u1ecdn agbegbe wa ni Ilu Kanada. \u1eccp\u1ecdl\u1ecdp\u1ecd
  wa duro ni i\u1e63\u1ecdkan p\u1eb9lu aw\u1ecdn arakunrin arakunrin Palestine. A
  s\u1ecd ni ariwo ati kedere, ''kii \u1e63e ni oruk\u1ecd wa.'' Israeli ko le t\u1eb9siwaju
  lati \u1e63e aw\u1ecdn ika ika w\u1ecdnyi ni oruk\u1ecd eniyan Juu. \u201d\\nLati
  \u1ecddun 2015, Ilu Kanada ti gbe aw\u1ecdn ohun ija ti o t\u1ecd si $ 57 million
  si Israeli, p\u1eb9lu $ 16 million ni aw\u1ecdn paati bombu. Laip\u1eb9 Kanada fowo
  si iwe adehun lati ra aw\u1ecdn drones lati \u1ecdd\u1ecd olu\u1e63e ohun ija nla
  jul\u1ecd ni Israeli, Elbit Systems, eyiti o pese 85% ti aw\u1ecdn drones ti ologun
  Israeli lo lati \u1e63e at\u1eb9le ati kolu aw\u1ecdn Palestinians ni West Bank
  ati Gasa.\\nK\u1ecdja Ilu Kanada, \u1eb9gb\u1eb9\u1eb9gb\u1eb9\u1eb9gb\u1eb9run
  eniyan ni \u1ecdp\u1ecdl\u1ecdp\u1ecd aw\u1ecdn ilu ti wa lori aw\u1ecdn igboro
  lati kil\u1ecd fun aw\u1ecdn ik\u1ecdlu iwa-ipa Israeli. Ij\u1ecdba Kanada gba o
  kere ju aw\u1ecdn l\u1eb9ta 150,000 laarin aw\u1ecdn \u1ecdj\u1ecd l\u1eb9hin aw\u1ecdn
  ik\u1ecdlu Israeli lori Al-Aqsa ati Gasa. W\u1ecdn pe si Ilu Kanada lati mu Israeli
  \u1e63e idaj\u1ecd fun aw\u1ecdn irufin r\u1eb9 ti aw\u1ecdn \u1eb9t\u1ecd eniyan
  ati ofin kariaye, ati lati gbe aw\u1ecdn ij\u1eb9niniya le l\u1eb9s\u1eb9k\u1eb9s\u1eb9
  lori Israeli.\\nJohn Philpot ti Just Peace Advocates s\u1ecd pe, \u201cIgbim\u1ecd
  Israeli ni Ilu Toronto ti polowo ni \u1ecdp\u1ecdl\u1ecdp\u1ecd aw\u1ecdn igba a\u1e63oju
  Israel Forces (IDF) wa fun aw\u1ecdn ipinnu lati pade ti ara \u1eb9ni fun aw\u1ecdn
  ti o f\u1eb9 lati darap\u1ecd m\u1ecd IDF, kii \u1e63e aw\u1ecdn ti o nilo lati
  \u1e63e i\u1e63\u1eb9 dandan. Ofin iforuk\u1ecdsil\u1eb9 Ajeji ti Canada j\u1eb9
  ki o j\u1eb9 arufin lati fa tabi gba\u1e63\u1eb9 fun ologun ajeji ati aw\u1ecdn
  it\u1ecds\u1ecdna Ile-i\u1e63\u1eb9 Wiw\u1ecdle Owo-wiw\u1ecdle ti Canada s\u1ecd
  pe \u2018atil\u1eb9yin aw\u1ecdn ologun ti oril\u1eb9-ede miiran kii \u1e63e i\u1e63\u1eb9
