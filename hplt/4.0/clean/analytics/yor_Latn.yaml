  Osama bin Ladini ati aw\u1ecdn onijagidijagan al-Qaeda r\u1eb9.\\nbi o til\u1eb9
  Ogun Charlie Wilson kikopa Tom Hanks j\u1eb9 \u201cfiimu kan kan,\u201d o j\u1eb9ri
  itan-ak\u1ecd\u1ecdl\u1eb9 eke ni \u1ecdkan Am\u1eb9rika eyiti o ti t\u1ecdka leralera
