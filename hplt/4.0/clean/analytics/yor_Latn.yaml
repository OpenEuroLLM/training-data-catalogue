  I\u1e63\u1eb9 to dara, Bob\u2026 o \u1e63eun fun iw\u1ecdn lilo ilera miiran ti
  irisi itan ti o \u1e63eto i\u1e63\u1eb9 r\u1eb9 yat\u1ecd si ti aw\u1ecdn ak\u1ecdwe
  kekere.\\nboya kii \u1e63e gbogbo eniyan yoo gba eyi lati rii argo \u1e63ugb\u1ecdn
  Mo ro pe aw\u1ecdn i\u1e63\u1eb9ju di\u1eb9 ak\u1ecdk\u1ecd fi \u1eb9bi fun aaw\u1ecd
  naa ni deede lori Am\u1eb9rika.\\nNib\u1eb9 ni nigbagbogbo siwaju sii lati a itan,
  o ni kan ni aanu nib\u1eb9 ni ko si ohun akiyesi fiimu debunking aw\u1ecdn Bernays
  atil\u1eb9yin ete ti gba Oscars.\\nOhun ti o fo jade y\u1eb9 ki o j\u1eb9 aw\u1ecdn
  eroja rogue ti o \u1e63\u1eb9 ofin Am\u1eb9rika, Iran-Contra le ni idagbasoke ati
  ki o j\u1eb9 \u1eb9ran ara daradara, eyi le paapaa \u1e63ii il\u1eb9kun lati d\u1ecdgbad\u1ecdgba
  wiwo ibi ni \u1eb9gb\u1eb9 mejeeji ni otit\u1ecd (fun ap\u1eb9\u1eb9r\u1eb9 lis\u1ecd
  aw\u1ecdn obinrin ni okuta pa fun ilepa ara-\u1eb9ni- ipinnu), sib\u1eb9sib\u1eb9
  funni ni ibi ni Iran ti ni iwuri pup\u1ecd nipas\u1eb9 ati pe o ti j\u1eb9 ifarapa
  si, aw\u1ecdn i\u1e63e ipil\u1eb9\u1e63\u1eb9 Am\u1eb9rika. Mo ti m\u1ecd p\u1eb9lu
