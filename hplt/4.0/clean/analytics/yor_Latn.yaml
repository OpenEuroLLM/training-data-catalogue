  ti ero gbogbo eniyan AM\u1eb8RIKA si ogun.\\nNi iyat\u1ecd, aw\u1ecdn fiimu lori
  ifipabanilopo CIA ti 1953 tabi kik\u1ecdlu Republikani ninu aw\u1ecdn idunadura
  idil\u1ecdw\u1ecd Carter ni \u1ecddun 1980 yoo \u1e63afihan pe aw\u1ecdn \u1eb9gb\u1eb9
  meji tabi di\u1eb9 sii wa si gbogbo itan. \u00d2\u00f3t\u1ecd\u0301 ni p\u00e9 ir\u00fa
  \u00e0w\u1ecdn f\u00ed\u00ecm\u00f9 b\u1eb9\u0301\u1eb9\u0300 m\u00e1a \u0144 b\u00e1
  \u00e0w\u1ecdn agb\u00e1ra \u00ecgboy\u00e0 t\u00f3 l\u00e1gb\u00e1ra. Aw\u1ecdn
