  k\u1eb9tala ti o fi opin si ifi tabi w\u1ecdn kan lo itan g\u1eb9g\u1eb9bi \u1eb9hin
  ti o han gbangba fun itan ero inu nipa ifi bi ninu Django Unchained.\\nKo ni iyanil\u1eb9nu
