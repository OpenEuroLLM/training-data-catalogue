  o si kede ifiwe nipas\u1eb9 sat\u1eb9laiti pe \u1eb9ni ti o \u1e63\u1eb9gun Aworan
  Ti o dara jul\u1ecd fun 2012 ni Argo? Mim\u1ecd Toledo, eniyan!\\nEyikeyi ero nipa
  ti?\\nL\u1eb9hin ti mo ti gb\u1ecd pe \\\"Argo\\\" ti gba Aworan Ti o dara jul\u1ecd
  (Emi ko ri ati boya kii yoo \u1e63e; Emi ko f\u1eb9ran ete), Mo m\u1ecd pe \u1eccgb\u1eb9ni
  Robert Parry, alakoso ti aw\u1ecdn onise iroyin ti Iran, yoo ni nkankan anfani lati
