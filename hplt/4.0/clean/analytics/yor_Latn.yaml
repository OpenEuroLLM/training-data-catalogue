  im\u1ecdran ipil\u1eb9 w\u1ecdn kal\u1eb9 laarin iran \u1ecdd\u1ecd. Abajade j\u1eb9
  \u1eb9gb\u1eb9 Islam ti o lagbara ti o t\u1eb9 gbogbo aw\u1ecdn \u1eb9gb\u1eb9 miiran
  l\u1eb9hin iyipada 1978 ati pe o ti mu ibanuj\u1eb9 ati \u1eb9ru kii \u1e63e si
  aw\u1ecdn ara ilu Iran nikan \u1e63ugb\u1ecdn tun si gbogbo aw\u1ecdn ibaj\u1eb9
  miiran, aw\u1ecdn ipinl\u1eb9 ti ko ni ij\u1ecdba ati aw\u1ecdn \u1eb9gb\u1eb9 ni
  Aarin Ila-oorun.\\n2. Fun \u1ecddun di\u1eb9 l\u1eb9hin aw\u1ecdn Soviets ti l\u1ecd
  kuro ni Afiganisitani, AM\u1eb8RIKA \u1e63e atil\u1eb9yin Taliban lati \u1e63e iranl\u1ecdw\u1ecd
  fun w\u1ecdn lati gba Afiganisitani. W\u1ecdn ja gbogbo aw\u1ecdn \u1eb9ya ti o
  kere ju ni Ariwa Afiganisitani (fun ap\u1eb9\u1eb9r\u1eb9 Hezareh &\u2026) titi
  o fi gba oril\u1eb9-ede naa. L\u1eb9\u0301y\u00ecn n\u00e1\u00e0 ni w\u1ecd\u0301n
  b\u1eb9\u0300r\u1eb9\u0300 s\u00ed k\u00f3 \u00ecd\u00e0r\u00fad\u00e0p\u1ecd\u0300
  \u00e0ti \u00ecb\u00e0n\u00faj\u1eb9\u0301 j\u00e1de l\u1ecd s\u00ed \u00e0w\u1ecdn
  ap\u00e1 ib\u00f2m\u00edr\u00e0n l\u00e1gb\u00e0\u00e1y\u00e9 (f\u00fan \u00e0p\u1eb9\u1eb9r\u1eb9
  Taliban hal\u1eb9\u0300 l\u00e1ti k\u1ecdlu Iran n\u00ed \u1ecdd\u00fan kan \u1e63\u00e1\u00e1j\u00fa
  1/9 & dajudaju 11/9.)\\nJ\u1eb9 ki nikan aw\u1ecdn idi aiduro fun ogun keji ni Iraq.\\nKii
  se fun mi sugbon gbogbo eyin elesin kaakiri agbaye, e gbadura fun Amerika, Omiran
