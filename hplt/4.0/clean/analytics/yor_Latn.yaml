  kan t\u00ed \u00f3 l\u00e9wu l\u00e9wu n\u00edpa ogun Soviets n\u00ed Afiganisitani.
  Botil\u1eb9j\u1eb9pe \u201cfiimu kan,\u201d Charlie Wilson k\u00e1 Ogun itan itan
  ti di nkan ti ipil\u1eb9\u1e63\u1eb9 fun oye Am\u1eb9rika ti aw\u1ecdn italaya itan
  ni Afiganisitani.\\nOgun Charlie Wilson \u1e63e afihan aw\u1ecdn jihadists Afiganisitani
  ti CIA ti \u1e63e atil\u1eb9yin (tabi mujahedeen) bi aw\u1ecdn onija ominira \u1ecdl\u1ecdla
  ati aw\u1ecdn awak\u1ecd Soviet ati aw\u1ecdn \u1ecdm\u1ecd-ogun ti n gbiyanju lati
  daabobo ij\u1ecdba Komunisiti kan ni Kabul bi aw\u1ecdn \u1ecddar\u00e0n ogun ti
  ko ni idiw\u1ecd ati aw\u1ecdn aderubaniyan. Aw\u1ecdn nuances won gbogbo s\u1ecdnu.\\nFun
  ap\u1eb9\u1eb9r\u1eb9, ij\u1ecdba Komunisiti fun gbogbo aw\u1ecdn a\u1e63i\u1e63e
  r\u1eb9 mu iw\u1ecdn di\u1eb9 ti igbalode wa si Afiganisitani. Aw\u1ecdn \u1eb9t\u1ecd
  obinrin ni a b\u1ecdw\u1ecd fun. W\u1ecd\u0301n gba \u00e0w\u1ecdn \u1ecdm\u1ecdd\u00e9b\u00ecnrin
  l\u00e1y\u00e8 l\u00e1ti l\u1ecd s\u00ed il\u00e9 \u1eb9\u0300k\u1ecd\u0301, \u00e0w\u1ecdn
  \u00f2fin t\u00ed \u00f3 gb\u00e1m\u00fa\u1e63\u00e9 t\u00ed \u0144 b\u00e9\u00e8r\u00e8
  p\u00e9 k\u00ed w\u1ecd\u0301n p\u00edny\u00e0 n\u00edpa \u00ecb\u00e1l\u00f2p\u1ecd\u0300
  j\u1eb9\u0301 \u00ectura. Loot\u1ecd, ninu itan-ak\u1ecd\u1ecdl\u1eb9 gidi, aw\u1ecdn
  jihadists ti o \u1e63e atil\u1eb9yin CIA ni iwuri ni apakan nla nipas\u1eb9 ibinu
  w\u1ecdn lori aw\u1ecdn atun\u1e63e w\u1ecdnyi ni aw\u1ecdn \u1eb9t\u1ecd aw\u1ecdn
  obinrin.\\nNi aw\u1ecdn \u1ecdr\u1ecd miiran, aw\u1ecdn jihadists ti CIA \u1e63e
  atil\u1eb9yin kii \u1e63e aw\u1ecdn \u1ecdl\u1ecdla \u201caw\u1ecdn onija-ominira\u201d
  bi w\u1ecdn ti \u1e63e afihan ninu fiimu naa. W\u1ecdn n j\u00e0 fun it\u1eb9riba
  ika ti aw\u1ecdn obinrin Afiganisitani. Ati aw\u1ecdn jihadists j\u1eb9 akikanju
  lainidi, ijiya ati pipa aw\u1ecdn \u1ecdm\u1ecd ogun ij\u1ecdba Soviet ati Afiganisitani.\\nBib\u1eb9\u1eb9k\u1ecd,
  iwa ika y\u1eb9n ko \u1e63e afihan ninu Ogun Charlie Wilson, tabi ko \u1e63e afihan
  r\u1eb9 bi ikuna eto imulo pataki ti akitiyan ogun AM\u1eb8RIKA. G\u1eb9g\u1eb9bi
  fiimu naa, a\u1e63i\u1e63e AM\u1eb8RIKA nla j\u1eb9 ikuna ti o y\u1eb9 lati rii
  i\u1e63\u1eb9 akan\u1e63e Afiganisitani titi de opin, \u1eb9sun ik\u1ecdsil\u1eb9
  ti Afiganisitani ni kete ti aw\u1ecdn \u1ecdm\u1ecd ogun Soviet l\u1ecd kuro ni
  ib\u1eb9r\u1eb9 \u1ecddun 1989.\\nNinu fiimu naa, A\u1e63oju Charlie Wilson, D-Texas,
  \u1eb9niti o j\u1eb9ri p\u1eb9lu siseto atil\u1eb9yin AM\u1eb8RIKA fun \u201caw\u1ecdn
  onija-ominira\u201d ti Afiganisitani, fihan pe o \u1e63agbe lai\u1e63ey\u1ecdri
  fun owo di\u1eb9 sii l\u1eb9hin ti aw\u1ecdn Soviets l\u1ecd.\\nAw\u1ecdn gidi itan
  j\u1eb9 bosipo o yat\u1ecd. Ni ipari 1988 ati ni kutukutu 1989, igbakeji oludari
  CIA Robert Gates ati aw\u1ecdn o\u1e63i\u1e63\u1eb9 pataki miiran fun i\u1e63akoso
  ti nw\u1ecdle ti Alakoso George HW Bush k\u1ecdlu aw\u1ecdn ipil\u1eb9\u1e63\u1eb9
  alafia lati \u1ecdd\u1ecd Alakoso Soviet Mikhail Gorbachev ti o f\u1eb9 ij\u1ecdba
  isokan kan ti yoo mu ogun abele si opin ati \u1e63e idiw\u1ecd kan. ipadab\u1ecd
  osunwon ti Afiganisitani si aw\u1ecdn ogoro dudu.\\nDipo, i\u1e63akoso Bush-41 wa
  i\u1e63\u1eb9gun ijagun fun aw\u1ecdn jihadists ati CIA. Nitorinaa, ni ilodi si
