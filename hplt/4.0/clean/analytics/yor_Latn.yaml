  jul\u1ecd Argo, eyi ti lakoko ti o da lori aw\u1ecdn i\u1e63\u1eb9l\u1eb9 gidi \u1e63e
  afihan ifarabal\u1eb9 Hollywood nipa gbigbe aw\u1ecdn i\u1e63\u1eb9l\u1eb9 pataki
  di\u1eb9 sii ati aw\u1ecdn ariyanjiyan ni \u1eb9gb\u1eb9 mejeeji ti fiimu Ben Affleck
  nipa \u1ecdna abay\u1ecd ti CIA ti aw\u1ecdn o\u1e63i\u1e63\u1eb9 m\u1eb9fa lati
  Ile-i\u1e63\u1eb9 Am\u1eb9rika ni Iran ni \u1ecddun 1979.\\nNi ipari kan ti itan-ak\u1ecd\u1ecdl\u1eb9
  y\u1eb9n ni CIA-orchestrated bibipasil\u1eb9 ti Prime Minister Iranian Mohammad
  Mossadegh ni \u1ecddun 1953, itan-ak\u1ecd\u1ecdl\u1eb9 kan ti o kan aros\u1ecd
