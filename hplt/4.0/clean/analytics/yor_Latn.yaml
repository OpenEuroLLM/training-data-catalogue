  Lori aw\u1ecdn miiran apa ti aw\u1ecdn Argo Aw\u1ecdn i\u1e63\u1eb9l\u1eb9 j\u1eb9
  ohun ijinl\u1eb9 ti kik\u1ecdlu ij\u1ecdba olominira ni aw\u1ecdn akitiyan ainireti
  ti Alakoso Jimmy Carter lati gba aw\u1ecdn o\u1e63i\u1e63\u1eb9 ile-i\u1e63\u1eb9
  a\u1e63oju 52 sil\u1eb9 ti o gba ni \u1ecddun 1979 ati waye fun aw\u1ecdn \u1ecdj\u1ecd
