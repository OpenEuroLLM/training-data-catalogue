  \u025bn deri ba\u014b k\u025b kuic l\u00e4t ni.\\nK\u00e4 t\u00e4 lu\u00e4\u00e4k
  ti k\u0254 kiwn thin?\\nMin d\u0254\u014b di\u025bn \u025bn \u025b k\u025bn\u025b
  l\u00e4t tin t\u00e4 k\u00e4 \u0263\u0254n d\u00e4r, l\u00e4t Victoria k\u00e4m
  k\u025bn l\u00e4\u00e4t dial jak\u025bn k\u025b k\u00e4 r\u00f6m k\u025bn\u025b
  n\u025by tin th\u00f6p l\u00e4t.\\nL\u00e4t Victoria (JVEN) \u025b du\u014b d\u025b
  min l\u00e4t d\u025b \u025bl\u0254\u014b k\u00e4 kum\u025b min lu\u00e4k n\u025by
  tin ci l\u00e4t mala j\u00e4k. La k\u00e4m k\u025b k\u025bk\u025b \u025b n\u025by
  tin \u014b\u00e4c th\u00f6p ni l\u00e4t ni. Tin l\u00e4t k\u025bl k\u025b n\u025by
  tin ku naath muoc l\u00e4\u00e4t k\u00e4 tin ku ba\u014b l\u00e4t ni th\u00f6p k\u00e4
  jak k\u025bn n\u025by tin gor k\u00e4 \u0263\u00f6\u00f6 bi k\u025b r\u0254 riali
  k\u00e4 k\u025b kuic l\u00e4t ni t\u0254t\u0254.\\nL\u00e4t Victoria k\u025bn\u025b
  n\u025by tin l\u00e4t k\u025b k\u0254 k\u025bl bi k\u025b ji lu\u00e4k k\u025b gor
  lat a thi\u025bl mi bi yu\u0254r piny bi n\u025by:\\n- bak\u0254 l\u00e4t k\u025b
  ji k\u025bl k\u025b \u0263\u00f6\u00f6 bi l\u00e4t \u014b\u00e4c k\u025bn\u025b
  min bi mi wiw\u00e4 jany l\u00e4t\\n- k\u00e4 mi n\u025by tin r\u0254\u014b k\u025b
  \u0263\u00f6\u00f6 bi lat \u025bm\u025b lut \u014b\u00e4c\\n- bi n\u025by tin gor
  lat lu\u00e4k k\u025b rial i di\u025bn k\u025b r\u0254 k\u00e4 b\u025b t\u0254t\u0254
  mat \u014bic ni k\u025b \u014b\u00e4c lat, rep \u014b\u00e4c di\u025bn k\u025b lat
  k\u025bn\u025b \u014b\u00e4c ni di\u025bn k\u025b tin dial tin gor k\u025bn k\u025b.\\nK\u00e4
  bi naath dial tin pay lat j\u00e4k ni\u025b min ci k\u025b lat j\u00e4k, k\u025b
  \u0263\u00f6\u00f6 bi k\u025bn kul\u025b t\u00e4k\u025b \u014b\u00e4c k\u025b gu\u00e4th
  lat.\\nGor n\u025by mi gori \u014b\u00e4c k\u00e4 ti \u014buan k\u025bn\u025b kuic
  \u025bn d\u00e4 n\u025by \u025b lu\u00e4k ji k\u025b kuic lat du.\\nK\u00e4 deri
  lat j\u00e4k b\u0254 k\u00e4 gor l\u00e4t ni Victoriar tin l\u00e4t gu\u00e4th \u025bn
  cie\u014b e thina.\"", "\"Collected and written by Michael Thilyang Gatkek With
  special thanks to Fr Christian Carlassare and pastoral team of Holy Trinity Parish
  (Old Fangak) (for English translation see their great book: Nuer Folktales, Proverbs
  and Riddles)\\nM\u00eb\u00ebdan t\u025b k\u025b gat mi c\u0254ali Gai Nyal\u0254r\u00e4.
  Cie\u014b\u025b k\u025b\u025bl k\u025bn\u025b mand\u0254\u014bd\u025b. Gai c\u025b
  pith a g\u0254aa. \u0190\\ndh\u0254l mi p\u025bl p\u025bl \u025bl\u0254\u0320\u014b.
  K\u00e4 \u014b\u00e4c\u025b \u014b\u0254akni diaal. Nh\u0254k\u025b \u0263\u00f6\u00f6
  b\u025b naath la\u0320t ruacni d\u0254ali. K\u00e4 Gai t\u025b k\u025b\\nk\u025bl
  mi ji\u00e4k k\u00e4 j\u025b: lo\u0320k\u025b la\u0320t. K\u025b c\u00e4\u014b k\u025bl
  cu mand\u0254\u014bd\u025b k\u0254a\u014b bim. K\u00e4 Gai nh\u0254k\u025b k\u0254a\u014b.
  Min t\u025b\\nmu\u0254\u014b\u00e4 cu mand\u0254\u014bd\u025b j\u025b ji\u00f6k
  i, gat nyaad\u00e4, bi \u0263\u00e4 na\u014b thok yieer ban pi w\u00e4 n\u00f6\u00f6\u014b.
  Cu Gai \u025b\\nlo\u0320k. \u0220\u00e4c\u025b ni \u0263\u00f6\u00f6 ba k\u0254a\u014b
  math j\u0254wd\u025b mi w\u025b w\u00e4 thok yieer. Cu\u025b \u014bot lat\u025b
  ni ruacni d\u0254ali. M\u00eb\u00eb\\nci mand\u0254\u014bd\u025b cuuc k\u025b liepd\u025b,
  cu\u025b dh\u0254l mi d\u0254di\u025bn ji\u00f6k i, gatd\u00e4 na\u014bni \u0263\u00e4
  yieer. Cuk\u025b w\u00e4 yieer\\nk\u025b\u025bl. Cu mand\u0254\u014b l\u0254cd\u025b
  t\u025b\u025bth \u025bl\u0254\u0320\u014b k\u025b j\u025b. M\u00eb\u00eb cik\u025b
  luny j\u0254k cu\u025b dh\u0254l \u025bm\u0254 moc k\u0254a\u014b. Cu dh\u0254l\\nk\u0254a\u014bd\u025b
  math. K\u00e4 Gai t\u025b l\u0254r\u00e4 a thil k\u0254a\u014b. Cu\u025b liep \u014b\u00e4c\u025b
  ni \u0263\u00f6\u00f6 ba moc k\u0254a\u014b. Min ci Gai \u025b n\u025bn\\n\u025bn
  \u0263\u00f6\u00f6 ci naath diaal math k\u025b k\u0254a\u014b k\u00e4 t\u025b l\u0254r\u00e4
  cu\u025b wee i, \u0263\u0254\u0320\u0254\u0320n \u025bn pual thar leeny\u025b p\u025b\u0308l
  thu\u0254k.\\nCa \u0263\u00e4 leny \u025b dh\u0254l \u025bm\u025b k\u025b \u0263\u00f6\u00f6
  ci thar\u025b pual. P\u025b\u0308l thu\u0254kd\u00e4 \u025b l\u0254ar. \u0190 j\u025bn
  laa naath a wee i pual\\nthar leny\u025b p\u025bl thok.\"", "\"Collected and written
  by Michael Thilyang Gatkek With special thanks to Fr Christian Carlassare and pastoral
  team of Holy Trinity Parish (Old Fangak) (for English translation see their great
  book: Nuer Folktales, Proverbs and Riddles)\\nK\u025b run tee ci w\u00e4 guak k\u025bn\u025b
  nyigol te k\u025b cie\u014bdi\u025bn. Ni cia\u014b la w\u00e4 k\u025b may k\u025b
  r\u025bc, mi cik\u025b r\u025bc n\u00e4k bi guak k\u025b thal. B\u025b r\u025bc
  ti g\u0254w moc \u014b\u025b\u0308th, b\u025b ti ji\u00e4k moc thiir. Mi ci nyigol
  ben b\u025b ji\u00f6k i bi cam ni ti g\u0254w ki\u025b bi cam ni ti ji\u00e4k? Bi
  nyigol wee i ba cam ni ti g\u0254w. Bik\u025b mith. Cuk\u025b tee thin k\u025b gua\u0320a\u0320th
  mi b\u00e4\u00e4r \u025bl\u0254\u0320\u014b, k\u00e4 \u014bot\u025b /ca j\u025b
  \u014b\u00e4c \u025b nyigol. K\u025b c\u00e4\u014b k\u025bl cu nya\u014blew ben
  ci\u025b\u014b k\u025b\u025bl k\u025b k\u025b. K\u00e4 nya\u014blew \u014b\u00e4c\u025b
  p\u025b\u0308l in te k\u025b guak. M\u00eb\u00eb cik\u025b w\u00e4 may cuk\u025b
  r\u025bcki\u025bn n\u00f6\u00f6\u014b, cu guak r\u025bcki\u025bn thal. Cu\u025b
  j\u025b la\u0320t cetk\u025b ta\u0320a\u0320 ee la l\u00e4t\u025b k\u00e4 nyigol,
  cu\u025b r\u025bc tin g\u0254w moc \u014b\u025b\u0308th k\u00e4 cu\u025b r\u025bc
  tin ji\u00e4k moc thiir. M\u00eb\u00eb ci nya\u014blew ben, cu\u025b j\u025b ji\u00f6k
  i bi cam ni r\u025bc ti g\u0254w \u025b ti, ki\u025b bi cam ni r\u025bc ti ji\u00e4k
  \u025b ti? Cu nya\u014blew wee i b\u00e4 cam ni r\u025bc ti ji\u00e4k ti. Cu guak
  \u025b mir i ca p\u025bl\u00e4 \u014ba\u0320c \u025b nya\u014blew. Cu\u025b tok
  d\u0254l, cu\u025b wee i \u025b lew \u025b lew, \u0263\u0254\u0320\u0254\u0320 kuan
  mith. Cuk\u025b mith. K\u025b c\u00e4\u014b in d\u0254di\u025bn, cu\u025b r\u025bc
  thal k\u00e4 cu\u025b tha\u0320\u014bki\u025bn w\u00e4 t\u0254\u0320w thar thu\u0254\u0320y,
  k\u00e4 kuic\u025b j\u025b i tee nya\u014blew \u025bn wan\u0254. Cu\u025b luoc c\u00e4\u014b,
  cu\u025b r\u025bc tin k\u0254ki\u025bn w\u00e4 thal, k\u00e4 l\u00e4t\u025b k\u025b
  cetk\u025b ta\u0320a\u0320 in cia\u014b. Cu nya\u014blew r\u025bc cam k\u025bn diaal.
  K\u025b k\u0254r\u025b cu\u025b ben, cuk\u025b ben mi\u0320th k\u025bn\u025b guak.
  K\u025b k\u0254r\u025b cuk\u025b w\u00e4 \u014bar r\u025by kueer k\u025b walee,
  walee \u025b jiath mi ca la\u0320t mi la dua\u0320c k\u025b k\u025b\u025bt, mi ci
  guak walee y\u0254\u0320t, b\u025b wee i tee tut k\u025b ma\u014b\u00e4dh, bi nya\u014blew
  \u025b loc i ma\u014b\u00e4dh ee ci ria\u0320r. B\u025b li\u014b ni ruac \u025bm\u0254
  b\u025b wak, bi nya\u014blew \u025b thiec i \u025b \u014bu? B\u025b wee i tiim\u00e4
  ni cie\u014b maari tee ci liw. Bi nya\u014blew \u025b ji\u00f6k i /ci lo\u0320k
  ni \u0263\u00f6\u00f6 c\u00e4 p\u025blu \u014ba\u0320c? Cu\u025b wee i \u025b lew
  \u025b lew gat nyimaar g\u0254a ni p\u025bl. Min c\u025b \u014ba\u0320c in\u0254
  \u025bn guak, cu l\u0254cd\u025b t\u025b\u025bth k\u025b nya\u014blew. K\u00e4 /ken
  \u025b ca\u0320p l\u025b ny\u0254k k\u025b l\u00e4tni, k\u025b \u0263\u00f6\u00f6
  ca p\u025b\u0308l\u025b \u014ba\u0320c \u025b guak.\"", "\"Tu\u0254k C\u00e4k\u00e4
  \u0194\u0254aa\\nCio\u0332o\u0332k 1\\n1 Ni tok\u00e4d\u025b Kuoth c\u025b nhial
  k\u025bn\u025b piny cak.\\n2 \u0194\u0254w thil\u025b j\u025b piny. Wi\u0332c pi\u0332i\u0332ni
  \u025b day, te\\nni muth thi\u0332n, k\u00e4 Yi\u00eb\u00eb Ku\u0254th in r\u025bl
  r\u0254 t\u00eb\u00eb\\nju\u00e4\u00e4t ju\u00e4\u00e4t wi\u0332c pi\u0332i\u0332ni.\\n3
  Cu Kuoth wee, \\\"A buay te wan\u0254.\\\" Cu\u025b cuaa\\nbuay. 4 Cu Kuoth buay
  n\u025bn, c\u025b g\u0254aa. Cu\u025b\\nbuay k\u025bn\u025b muth da\u0332a\u0332k.
  5 Cu Ku\u0254th buay c\u0254l i\\nC\u00e4\u014b D\u00e4\u00e4r, k\u00e4 cu\u025b
  muth c\u0254l i W\u00e4\u00e4r. Cu\u025b te k\u025b\\nthia\u014b k\u025bn\u025b
  runwa\u014b, k\u025b c\u00e4\u014b in jio\u0332l.\\n6 K\u00e4 cu Kuoth wee, \\\"A
  pi baa kamki\u025bn guay.\\nA pi bi kamki\u025bn te k\u025b d\u00e4\u00e4k.\\\"
  7 Kuoth cu\u025b\\nkam \u025bm\u0254 guay. Cu\u025b kam pi\u0332i\u0332ni pi\u025bny
  da\u0332a\u0332k k\u025bn\u025b\\npi nhial, k\u00e4 cu\u025b cuaa j\u025bn. 8 Cu
  Kuoth kam\\nnhial c\u0254l i Nhial. Cu\u025b te k\u025b thia\u014b k\u025bn\u025b\\nrunwa\u014b,
  k\u025b c\u00e4\u014b in r\u025bwd\u025b.\\n9 K\u00e4 cu Kuoth wee, \\\"A pi ti
  te piny baa ma\u0332a\u0332t\\ngu\u00e4th k\u025bl\\\", k\u00e4 cu\u025b cuaa jen.
  10 Cu Kuoth\\nmun mi k\u00f6\u00f6t c\u0254l i Piny, k\u00e4 cu\u025b pi ti caa\\nma\u0332a\u0332t
  c\u0254l i Bapdiitni. Cu Kuoth \u025b n\u025bn, c\u025b\\ng\u0254aa.\\n(Page 1)\\n11
  K\u00e4 cu Kuoth \u025b lar, \\\"A piny ku do\u0332ny k\u025b\\njuaac ti camk\u025b,
  ke wal ti \u014bu\u0254l k\u025b d\u025by, k\u025b\\nji\u025bn ti kui\u0332r k\u025b
  kuay ti te k\u025b d\u025by g\u00f6\u00f6li.\\\"\\n12 Cu piny coo do\u0332ny k\u025b\u025b
  juaac k\u025bn\u025b wal ti\\ncamk\u025b, k\u00e4 kui\u0332rk\u025b k\u025b kuayki\u025bn
  g\u00f6\u00f6li. M\u00e4ni\\nji\u025bn b\u00e4 ti te k\u025b d\u025by g\u00f6\u00f6li
  cuk\u025b kuer, k\u00e4\\nKuoth cu\u025b n\u0254m\u0254 n\u025bn, c\u025b g\u0254aa.
  13 Cu\u025b coo te\\nk\u025b thia\u014b k\u025bn\u025b runwa\u014b ke c\u00e4\u014b
  in di\u0254\u0332\u0254\u0332di\u025bn.\\n14 K\u00e4 cu Kuoth wee, \\\"A nhial te
  k\u025b m\u00e4c k\u025b\\n\u0264\u00f6\u00f6 bik\u025b c\u00e4\u014b da\u0332a\u0332k
  k\u025bn\u025b w\u00e4\u00e4r, bikaa nyuuthni.\\nBik\u025b ni\u0332n a nyu\u0254thk\u025b
  k\u025b run, k\u025b m\u00e4y, k\u025bn\u025b\\nt\u0254\u0332t, k\u025b ruel k\u025bn
  ji\u0254m. 15 Bikaa buay nhial\\nk\u025b \u0264\u00f6\u00f6 bik\u025b piny riaw.\\\"
  Cu\u025b cuaa j\u025bn. 16\\nCu Kuoth m\u00e4c r\u025bw ti di\u0332t ti te k\u025b
  buay la\u0332t.\\nCu\u025b min di\u0332t ni buayd\u025b la\u0332t k\u025b \u0264\u00f6\u00f6
  b\u025b c\u00e4n d\u00e4\u00e4r\\nyien, k\u00e4 cu\u025b min kuiy ni buayd\u025b
  la\u0332t ke \u0264\u00f6\u00f6\\nb\u025b w\u00e4\u00e4r yien. Cu\u025b ku\u025bl
  jak k\u00e4 te wan\u0254 b\u00e4.\\n17 Cu Kuoth M\u00e4c da\u0332\u014b r\u025bw
  t\u0254t\u0254 k\u025bn\u025b ku\u025bl la\u0332t\\nnhial k\u025b \u0264\u00f6\u00f6
  bi piny te k\u025b buay, 18 k\u025b \u0264\u00f6\u00f6\\nbik\u025b c\u00e4n k\u025bn\u025b
  w\u00e4\u00e4r yien, m\u00e4ni \u0264\u00f6\u00f6 bik\u025b buay\\nk\u025bn\u025b
  muth da\u0332a\u0332k. Cu Kuoth \u025b n\u025bn, c\u025b g\u0254aa.\\n(Page 2)\\n19
  Cu\u025b coo te k\u025b thia\u014b k\u025bn\u025b runwa\u014b, k\u025b c\u00e4\u014b\\nin
  \u014buaandi\u025bn.\\n20 K\u00e4 cu Kuoth wee, \\\"A ley ti bi cie\u014b r\u025by\\npi\u0332i\u0332ni
  te wan\u0254, a k\u025b matk\u025b ro thi\u0332n, k\u00e4\u0308 a \u0264\u0254w\\nbi
  te k\u025b diit ti ri\u014b nhial.\\\" 21 Cu\u025b cuaa\\nj\u025bn \u025bn\u0254.
  Kuoth cu\u025b ley bapdiit ti di\u0332t cak,\\na m\u00e4ni \u014b\u0254ak k\u0254ki\u025bn
  ti t\u00ebk ti j\u00e4l r\u025by pi\u0332i\u0332ni,\\ncu\u025b k\u025b jak k\u00e4
  di\u00ebthk\u025b ro k\u025b c\u00e4tki\u025bn g\u00f6\u00f6li.\\nM\u00e4ni diit
  nhial cu\u025b k\u025b jak k\u00e4 di\u00ebthk\u025b ro k\u025b\\nc\u00e4tki\u025bn
  g\u00f6\u00f6li. Cu Kuoth \u025b n\u025bn, c\u025b g\u0254aa. 22\\nCu Kuoth k\u025b
  poth, cu\u025b wee, \\\"Y\u025bn di\u00ebth\u025b ro,\\nbaa \u014buan, baa b\u00e4pdiitni
  thi\u00e4\u014b \u025b d\u025bykun a\\nm\u00e4ni diit nhial b\u00e4. A k\u025b di\u00ebthk\u025b
  ro wi\u0332c\\nmu\u0254\u0332\u0254\u0332n.\\\" 23 Cu\u025b coo te k\u025b thia\u014b
  k\u025bn\u025b runwa\u014b,\\nk\u025b c\u00e4\u014b in dhieecdi\u025bn.\\n24 K\u00e4
  cu Kuoth wee, \\\"A wi\u0332c mu\u0254\u0332\u0254\u0332n te k\u025b ley\\nti baa
  ro dieth ti te k\u025b dieth g\u00f6\u00f6li. \u0194\u0254\u0332k,\\nk\u025b ley
  tin laa mol piny, k\u025b ley k\u0254ki\u025bn\\ng\u00f6\u00f6li wi\u0332c mu\u0254\u0332\u0254\u0332n
  ke c\u00e4tdi\u025bn.\\\" Cu\u025b cuaa jen.\\n25 Cu Kuoth ley diaal cak k\u025b
  c\u00e4tdi\u025bn g\u00f6\u00f6li\\nwi\u0332c mu\u0254\u0332\u0254\u0332n. Cu\u025b
  \u0264\u0254\u0332k cak k\u025b c\u00e4tdi\u025bn, k\u00e4 cu\u025b\\n\u014b\u0254ak
  tin laa mol piny cak k\u025b c\u00e4tdien g\u00f6\u00f6li.\\n(Page 3)\\nCu Kuoth
  \u025b n\u025bn, c\u025b g\u0254aa.\\n26 K\u00e4 cu Kuoth wee, \\\"Kuan\u025b raan
  cak k\u025b\\nc\u00e4tdan, ban\u025b j\u025b cal k\u025b c\u00e4tdan, k\u00e4 j\u025bn
  b\u025b\\n\u014b\u0254ak diaal ti cie\u014b wi\u0332c mu\u0254\u0332\u0254\u0332n
  yien. R\u025bc\\nyi\u00eb\u00ebr, diit nhial, \u0264\u0254\u0332k, mu\u0254\u0254l
  pi\u025bny a m\u00e4ni\\npiny k\u025b\u025bliw b\u025b\u025b yien.\\\" 27 Cu Kuoth
  raan\\ncak k\u025b c\u00e4td\u025b pa\u0332ny. C\u00e4t Ku\u0254th cu Kuoth raan\\ncak
  ni k\u025b j\u025b. Cu\u025b tuut cak k\u025bn\u025b \u014bu\u0254\u0332\u0254\u0332t.
  28\\nCu Kuoth k\u025b poth, cu\u025b k\u025b ji\u00f6k, cu\u025b wee, \\\"Y\u025bn\\ndi\u00ebth\u025b
  ro baa \u014buan, bia piny thi\u00e4\u014b, bi y\u025bn\\npiny yien, biaa kua\u0332r
  pi\u025bny. Bi y\u025bn r\u025bc ni\\nyien r\u025by yi\u00ebri, a m\u00e4ni diit
  nhial, k\u025b ley\\ndiaal ti t\u00ebk ti j\u00e4l wi\u0332c mu\u0254\u0332\u0254\u0332n.\\\"
  29 K\u00e4 cu\\nKuoth wee, \\\"Y\u025bn li\u025b\u014b\u025b j\u025b, \u0264\u00e4n
  c\u00e4 y\u025b ka\u0332m \u014b\u0254ak\\ndiaal ti do\u0332ny piny ti laa kui\u0332r
  k\u025b d\u025by w\u00ef\u0332c\\nmu\u0254\u0332\u0254\u0332n k\u025b\u025bliw.
  A m\u00e4ni ji\u025bn diaal ti di\u00ebth k\u025b\\nd\u025by ti ck \u0264\u00e4n
  k\u025b cak, c\u00e4 k\u025b ka\u0332m y\u025b a la\\nmi\u0332thkun. 30 A m\u00e4ni
  ley diaal ti t\u00ebk ti cie\u014b\\nwi\u0332c mu\u0254\u0332\u0254\u0332n, m\u00e4ni
  diit nhial diaal, k\u025b\u025b mu\u0254\u0254l\\npi\u025bny diaal tin t\u00ebk
  \u025b ny\u0254\u0254t ny\u0254\u0254t wi\u0332c mu\u0254\u0332\u0254\u0332n,\\nc\u00e4
  k\u025b ka\u0332m juaac diaal k\u025bn\u025b ji\u025bn diaal ti\\nt\u0254\u0332\u0254\u0332c
  a la mi\u0332thiki\u025bn.\\\"\\n(Page 4)\\n31 Cu Kuoth \u014b\u0254ak diaal t\u00eb\u00eb
  c\u025b la\u0332t ku guic,\\ncu\u025b k\u025b guic g\u0254wk\u025b \u025blo\u0332\u014b.
  Cu\u025b te k\u025b thia\u014b\\nk\u025bn\u025b runwa\u014b, k\u025b c\u00e4\u014b
  in b\u00e4k\u025bli\u025bn.\"", "\"Cio\u0332o\u0332k 20\\n1 Cu Ab\u025braam \u0264\u00f6th
  gu\u00e4th \u025b\u025b t\u025b\u025b thi\u0332n, w\u00eb\u00eb\\nlot k\u00e4 taar
  g\u025b\u0308w k\u00e4 N\u025bk\u025bp. Cu\u025b cie\u014b kam\\nK\u025byd\u025bc
  k\u025bn\u025b\u025b Cur gu\u00e4th mi c\u0254al i G\u025brar. 2\\nCu Ab\u025braam
  ruac k\u025b kui\u0332c ci\u00ebkd\u025b ni Th\u025byr\u00e4 i\\n\u025b nyimaar.
  Cu Abim\u025bl\u025bk ku\u00e4\u00e4r G\u025brar raan ja\u0332k\\nmi bi Th\u025byr\u00e4
  ben na\u014b. 3 K\u00e4 cu Kuoth ben\\nruac k\u025b la\u0332k k\u025b w\u00e4\u00e4r
  k\u025b Abimelek, Cu\u025b j\u025b ji\u00f6k,\\n\\\"N\u025bn \u025b, \u025b ji\u0332n
  ram mi ci li\u0332w k\u025b kui\u0332c ci\u00ebk \u025b ci\\nji\u0332n \u025b ka\u0332n\u025b
  k\u025b \u0264\u00f6\u00f6 \u025b ciek wut\u00e4 mi d\u0254di\u025bn.\\\" 4\\nT\u00e4\u00e4m\u025b
  Abim\u025bl\u025bk \u014bot\u025b ''ken\u025b ni ni\u025b\u025bn k\u025b j\u025b,
  k\u025b\\nkui\u0332c \u025bm\u0254 cu\u025b lar, \\\"Ku\u00e4\u00e4r, bi n\u025by
  ti thil duer\\nn\u00e4k? 5 ''Ken wut \u025bm\u0254 j\u025b lar pu\u0254\u0332nyd\u025b
  i \u025b\\nnyimaar? K\u00e4 ci ciek pu\u0254\u0332nyd\u025b j\u025b lar i \u025b\\nd\u00e4maar?
  Ci \u0264\u00e4n ciek \u025bm\u025b ka\u0332n k\u025b thu\u0254\u0332k l\u0254aacd\u00e4\\nmin
  thil duer mi ci \u0264\u00e4n \u025b la\u0332t k\u025bn\u025b tetk\u00e4 tin\\nthil
  mi ji\u00e4\u00e4k mi ci \u0264\u00e4n \u025b l\u00e4t ni k\u025b.\\\" 6 K\u00e4\\ncu
  Kuoth ruac k\u025b j\u025b k\u025b la\u0332k \u025bm\u0254, \\\"\u0194\u0254\u0332\u0254\u0332n,
  \u0194\u00e4n\\n\u014ba\u0332c\u00e4 j\u025b i ci ji\u0332n n\u025bm\u025b la\u0332t
  k\u025b l\u0254c mi thu\u0254\u0332k mi\\nthil duer mi te thi\u0332n, k\u00e4 \u025b
  \u0194\u00e4n ga\u014b ji m\u0254 k\u00e4\\nduer mi dee ji\u0332n \u025b l\u00e4t
  k\u00e4 \u0194\u00e4. K\u025b kui\u0332c \u025bm\u0254\\n\u0194\u00e4n ''ka\u0332n
  i jak k\u00e4 gueeri j\u025b.\\n(Page 65)\\n7 T\u00e4\u00e4m\u025b ku\u025b\u025b
  li\u014b, locni ciek \u025bm\u0254 k\u00e4 c\u0254wd\u025b\\nk\u025b \u0264\u00f6\u00f6
  \u025b g\u00f6k, b\u025b la\u0332\u014b k\u025b kui\u0332cdu, bi t\u00ebk. K\u00e4\\nmi
  ''ci ji\u0332n \u025b bi lu\u0254\u0332c c\u0254wd\u025b, \u014b\u00e4cni \u025b\u025b
  i bi\\nli\u0332w \u025bpuc, ji\u0332n y\u025bn\u025b n\u025b\u025bku diaal \u025bwic.\\\"
  8 Cu\\nAbim\u025bl\u025bk coo keer k\u025b runwa\u014b \u025blo\u0332\u014b, k\u00e4
  cu\u025b ji\\nla\u0332td\u025b jiaal c\u0254l, cu\u025b k\u025b la\u0332r \u014b\u0254ak
  diaal titi.\\nCu wutni t\u0254t\u0254 dual \u025blo\u0332\u014b. 9 T\u00e4\u00e4m\u025b\\nAbim\u025bl\u025bk
  cu\u025b Ab\u025braam c\u0254l, cu\u025b j\u025b thiec, \\\"E\\n\u014bu \u025bn
  \u025b ci l\u00e4t k\u00e4 k\u0254 m\u025b? C\u00e4 ji duer duer i\\ndi m\u0254
  cui duer \u025b di\u0332i\u0332t \u025bm\u025b n\u00f6\u00f6\u014b wi\u0332cd\u00e4
  m\u0254 k\u0254n\u025b\\nn\u025b\u025bk\u00e4 ti ruaac\u00e4? Ci ji\u0332n \u0264\u00e4
  l\u00e4t k\u00e4 du\u0254\u0332\u0254\u0332r mi\\n''caa dee met l\u00e4t k\u00e4
  raan.\\\" 10 K\u00e4 cu\\nAbim\u025bl\u025bk Ab\u025braam l\u025b ni ji\u00f6k,
  \\\"Caari ni \u014bu m\u0254\\ncui m\u025bm\u025b l\u00e4 t k\u00e4 \u0264\u00e4
  m\u0254?\\\" 11 Cu Ab\u025braam wee,\\n\\\"C\u00e4 j\u025b la\u0332t k\u025b \u0264\u00f6\u00f6
  \u025b \u0264\u00e4n i d\u0254\u0254 thil\u025b luth\\nKu\u0254th mi t\u0254\u0332t
  wan\u025bm\u025b a cuaa coo wee d\u0254\u0254 bi k\u025bn\\n\u0264\u00e4 n\u00e4k
  k\u025b kui\u0332c ci\u00ebkd\u00e4. 12 K\u00e4 \u025b\\nni nyimaar \u025blo\u0332\u014b,
  \u025b nyaa gua\u0332a\u0332r, ''ci \u025b\u025b nyaa\\nmaar, k\u00e4 cuaa ciekd\u00e4.
  13 M\u00eb\u00eb ci Kuoth \u0264\u00e4\\njak k\u00e4 ji\u025bn dueel gua\u0332a\u0332r
  a b\u00e4 ben tee wi\u025bl\\nwi\u025bl cuaa j\u025b ji\u00f6k, \\\"N\u025bm\u025b
  \u025b mal l\u0254aacdu mi bi\\nl\u00e4t k\u00e4 \u0264\u00e4, lapni j\u025b a laari
  i \u025b d\u00e4maar.\\\"\\n(Page 66)\\n14 T\u00e4\u00e4m\u025b Abim\u025bl\u025bk
  cu\u025b det k\u025bn\u025b th\u00e4\u00e4k, k\u025b\\nwutni ja\u0332a\u0332ni,
  k\u025b nyier ja\u0332a\u0332ni ka\u0332n cu\u025b k\u025b ka\u0332m\\nAb\u025braam,
  k\u00e4 cu\u025b ciekd\u025b ni Th\u025byr\u00e4 lu\u0254\u0332c j\u025b.\\n15 Cu
  Abim\u025bl\u025bk wee, \\\"N\u025bn \u025b, mund\u00e4 a nhiamdu,\\ncie\u014bni
  gua\u0332a\u0332th mi go\u0332o\u0332r l\u0254cdu j\u025b.\\\" 16 K\u00e4 cu\u025b\\nTh\u025byr\u00e4
  ji\u00f6k, \\\"N\u025bn \u025b, c\u00e4 d\u00e4mu\u0254\u0254r moc k\u025b yio\u0332w\\nti
  kur w\u00e4l. E nyuuth i thil\u025b ji duer nhiam\\nn\u025b\u025bni diaal ti te
  nhiamdu, k\u00e4 caa ji moc\\ncu\u0254\u0332c\u014b nhiam n\u025b\u025bni diaal.\\\"
  17 T\u00e4\u00e4m\u025b Ab\u025braam\\nCu\u025b Kuoth ku l\u00e4\u014b, k\u00e4
  cu Kuoth Abim\u025bl\u025bk pu\u0254\u0332nyd\u025b\\ncoo jak k\u00e4 g\u0254aa
  a m\u00e4ni pu\u0254\u0332ny ci\u00ebkd\u025b k\u025bn\u025b\\nnyier ja\u0332ani
  a cuk\u025b gaat dieth. 18 K\u025b \u0264\u00f6\u00f6\\nci Jaopa m\u00e4n g\u0254aal
  Abim\u025bl\u025bk diaal ka\u0332p cu\u0254\u0332\u014b\\nk\u025b kui\u0332c Th\u025byr\u00e4
  ciek Ab\u025braam.\\n(Page 67)\""]'
