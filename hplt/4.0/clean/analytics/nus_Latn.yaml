  K\u00e4 cu k\u025bn \u025b lar, \\\"Kuan\u025b ro l\u00e4t k\u00e4\\nwec mi di\u0332i\u0332t,
  k\u025bn\u025b duel mi bi wi\u0332cd\u025b\\nr\u00e4th ni pu\u0254\u0332\u0254\u0332r\u00e4,
  k\u00e4 ban\u025b ro\\nmoc mi baa k\u025bk k\u0254n, tu\u014b b\u025b m\u00e4\u00e4
  mi\\nban\u025b ro d\u00e4k k\u00e4 piny t\u0254.\\\"\\n- K\u00e4 cu Jaopa ben piny,
  b\u025b wec k\u025bn\u025b duel\\nt\u00eb\u00eb caa la\u0332t \u025b gaat nath ben
  n\u025bn.\\n- Cu Jaopa j\u025b lar, \\\"N\u025b\u0308n\u025b j\u025b,\\nn\u025by
  titi cikaa do\u0332r k\u025bl , k\u00e4 ci thoodi\u025bn\\na k\u025bl. K\u00e4 n\u025bm\u025b
  \u025b ni j\u025bn in nhiam\\nin k\u0254n k\u025bn \u025b tok k\u025b l\u00e4tni,
  k\u00e4\\nthil\u025b d\u0254di\u025bn mi bi k\u025bn \u025b car i bi k\u025bn\\n\u025b
  la\u0332t mi bi k\u025b l\u025b dhal.\\n- B\u025b\u0308\u025b\u0308, wan\u025b piny,
  ban\u025b thoodi\u025bn\\nw\u00e4 nyon k\u025b \u0264\u00f6\u00f6 ''ci ram\u0254
  thok raam\u0254\\nbi l\u025b li\u014b.\\\"\\n- K\u00e4 m\u00eb\u00eb w\u00eb\u00eb
  tey in\u025b cu Jaopa k\u025b\\nd\u00e4k k\u00e4 piny wi\u0332c mu\u0254\u0332\u0254\u0332n\\nk\u025b\u025bliw,
  k\u00e4 cuk\u025b la\u0332t wec ba\u0332ny piny.\\n- K\u025b kui\u0332c \u025bm\u0254
  cu\u0254 ci\u00f6td\u025b c\u0254l\\ni B\u025bybol k\u025b \u0264\u00f6\u00f6 ci
  Jaopa thok k\u025bl\\n\u00eb\u00eb te k\u025b naath r\u025by \u0264\u0254aa k\u025b\u025bliw\\nnyon
  \u025bn gu\u00e4th \u025bm\u0254. Cu Jaopa k\u025b coo d\u00e4k\\nk\u00e4 piny.\"",
  "\"Collected and written by Michael Thilyang Gatkek With special thanks to Fr Christian
  Carlassare and pastoral team of Holy Trinity Parish (Old Fangak) (for English translation
  see their great book: Nuer Folktales, Proverbs and Riddles)\\nNyala\u014b j\u025bn
  \u025b nyal k\u00e4 Gaaw\u00e4\u00e4r r\u025by nu\u00e4ri thok duel cie\u014b d\u0254\u0320\u0254\u0320l.
  J\u025bn t\u025b k\u025b\u025bl k\u025b gaatman. J\u025bn b\u00e4\\n/c\u025b p\u025bl
  \u025b d\u00e4y d\u00e4y. Mi tee naath r\u025by mu\u0254\u014b\u00e4 b\u025b wee
  i c\u00e4\u014b k\u025bl bi naath ri\u0320\u014bd\u00e4 cam. Bi naath \u025b\\nd\u0254l
  k\u00e4 c\u0254alk\u025b j\u025b i gua\u0320n kac\u00e4. K\u025b ru\u0254\u0320n
  k\u025bl ci \u0263\u0254w te k\u025b bu\u0254th mi diit. K\u025b ruel cu nhiaal
  d\u025bm k\u025b\\nw\u00e4\u00e4r. Cu luakdi\u025bn wa\u014b k\u00e4 te nyala\u014b
  r\u025by luak k\u025b\u025bl k\u025b det. M\u00eb\u00eb ci \u0263\u0254w baak k\u025b
  runwa\u014b cu\\nnaath w\u00e4 k\u025b \u0263\u00f6\u00f6 ba det w\u00e4 w\u00e4t
  r\u025by luaak. Cuk\u025b k\u025b jek a cik\u025b tuak k\u025bn diaal. Cuk\u025b
  det wa\u0320t\\nk\u00e4 camk\u025b k\u025b. K\u00e4 thil\u025b ram mi caar j\u025b
  i ci nyala\u014b wa\u014b k\u025b\u025bl k\u025b det am\u00e4ni m\u00eb\u00eb ci
  luak thu\u0254\u0320k k\u025b\\nwa\u0320t. K\u025b k\u0254r\u025b cuk\u025b r\u0254
  thiec i k\u00e4 Nyala\u014b t\u025b ni m\u025b /ker\u025b j\u0254\u0254c \u025b
  ni thiaa\u014b am\u00e4ni wa\u0320l\u025b? Ni\u025b wan\u0254\\ncu k\u025bn \u025b
  \u014ba\u0320c i ca Nyala\u014b cam \u025b k\u025bn. Cuk\u025b ruac ee la lat\u025b
  tim i k\u025b c\u00e4\u014b k\u025bl bi naaath \u0263\u00e4 cam.\\nCu naath ru\u0254\u0320n
  \u025bm\u0254 c\u0254l i ru\u0254\u0320n Nyala\u014b k\u00e4 nu\u00e4ri diaal am\u00e4ni
  wa\u0320l\u025b.\"", "\"Cu\u014b ku k\u00e4 au\u025btralia.\\nK\u0254k \u014b\u0254aani
  thukdueeli lot\u025b ni \u014bu?\\nK\u0254k ni \u014b\u0254aani thukdueeli lot\u025b
  ni \u0263\u00f6 de naath ki\u025b ran ben ce\u014b k\u00e4 \u0263\u0254n\u025b \u0263\u00f6:\\n-
  k\u00f6k\u025b ji nyin ce\u014b\\n- de k\u025b mi ci ji\u00e4k dh\u0254ru rialik\u00e4\\n-
  de k\u025b ji thieec I g\u025br mukt\u00e4p ga\u0331th, karaba, t\u025bl\u025bp\u0254n
  ki\u025b int\u025brn\u025bt min l\u00e4t k\u025b.\\n\u0190 n\u025by de rami k\u0254k
  \u014b\u0254aak ben dh\u0254r\u00e4 m\u0254?\\nRami k\u0254k \u014b\u0254aak der\u025b
  ben dh\u0254ru k\u025b gua\u0331th mi cet:\\n- 9:00am k\u025bn\u025b 6:00pm c\u00e4\u014b
  k\u00e4 k\u025bl \u025b we k\u00e4 c\u00e4\u014b k\u00e4 dhi\u00eb\u00ebc\\n- 9:00am
  k\u025bn\u025b 5:00pm k\u025b c\u00e4\u014b k\u00e4 ba\u0331 k\u025bl.\\nCi k\u025b
  de ben k\u025b c\u00e4\u014b kuoth ki\u025b c\u00e4\u014b l\u0254\u014b k\u00e4
  wec k\u025b liw.\\nDu\u014b d\u025b \u0263\u00f6 n\u025by tin l\u00e4t \u014b\u0254aak
  ki\u025b ji mukt\u00e4pk\u00e4 de k\u025b ben ce\u014b k\u025b gua\u0331th in lot
  r\u0254 mi ci yi\u025bn\u025b mat.\\nK\u025b \u014but tin tith de gu\u0254r t\u0254
  \u025b rami k\u0254k \u014b\u0254aak?\\nMi ci gua\u0331n k\u00f6k\u00e4 be thoduelu,
  b\u025b ji dhil la\u0331r:\\n- Lot k\u00e4 min be k\u025b j\u025b\\n- Ci\u00f6t
  d\u025b k\u025bn\u025b mukt\u00e4p la\u0331t d\u025b\\n- \u0194\u00f6 der\u025b
  ji\u025bn mi ci\u025b \u0263\u00ebr. K\u00e4 mi ci gua\u0331n k\u00f6k\u00e4 ji\u00f6k
  I j\u025by ni, c\u025b ji de ny\u0254k k\u025b ci\u00f6t \u025b ny\u0254k k\u025b
  k\u0254r nini ti j\u025bn di\u0254k (30 days)\\n- Cu\u014b ku am\u00e4ni \u0263\u00f6
  deri min cia mat d\u00e4k am\u00e4ni ta\u0331 in de da\u0331k ni min ci y\u025bn\u025b
  mat\\n- L\u00e4th ni lu\u0254\u0254t ni ku dial r\u025by wargak\u00e4 min ci yi\u025bn
  \u025b mat k\u00e4 ci yi\u025bn thany thin k\u025b ci\u00f6t n\u025bni tin n\u00f6\u014b
  \u014b\u0254aak\\n- \u0190 ji ka\u0331m k\u025b thur\u025b wargak\u00e4 mi ca g\u0254r
  (written) k\u00e4 ci yi\u025bn mat thin \u025b \u014bot k\u00e4n i ni thany\\n-
  Thi\u025bl\u025b yi\u00f6w ti ba thi\u00eb\u00ebc k\u025b k\u0254r nini da\u0331\u014b
  w\u00e4l (10) tin l\u00e4t k\u025b naath ki\u025b thany k\u025b wargak \u025bm\u025b
  k\u025b j\u025b\\n- Cu pek mi g\u0254a nyoth mi l\u00e4ny yi\u00f6w ti $500 k\u025b
  k\u0254r nini da\u0331\u014b w\u00e4l tin l\u00e4t k\u025b naath ki\u025b thany
  k\u025b wargak \u025bm\u025b k\u025b j\u025b\\n- A thi\u025bl mi la\u0331t k\u025b
  k\u025b k\u0254r nini da\u0331\u014b w\u00e4l tin thany k\u025b wargak k\u025b j\u025b.\\nThi\u025bl\u025b
  mi nh\u0254ak\u00e4 k\u00e4 min lat k\u025b \u025b ram in k\u0254k \u014b\u0254aak
  - \u025b \u014bu b\u00e4 l\u025bl\u0254?\\n- Lar\u025b \u2018c\u00e4n \u025b g\u00f6r\u2019\\n-
  Cu r\u0254 kok \u025b l\u00f6\u014b I bi du\u0254r k\u0254k k\u00e4 rami k\u0254k
  \u014b\u0254aak mi ci ben dh\u0254ru.\\nNi cia\u014b lar\u025b \u2018c\u00e4 l\u00f6k\u2019
  mi ci rami k\u0254k \u014b\u0254aak ji:\\n- Ka\u0331m du\u0254r mi ci g\u0254a \u025bl\u00f6\u014b
  k\u00e4 d\u0254\u014b der\u025b thu\u0254k\\n- Thi\u00eb\u00ebc k\u025b yi\u00f6w
  \u025b \u014bot ka\u0331n du\u0254r ni la\u0331t\\n- Jak ji k\u00e4 dual k\u025b
  ta\u0331 d\u025b.\\nNaath p\u025bl k\u025bn r\u00f6 I bek\u025b k\u00e4 kum\u025b\\n-
  Mi ci ran ben thoduelu k\u00e4 lar\u025b j\u025b be k\u00e4 mukt\u00e4p kum\u025b,
  cet k\u025b mukt\u00e4p thob\u00f6k\u00e4 ka au\u025btralia ki\u025b th\u00e4nt\u025brli\u014b
  (Centrelink).\\n- Thi\u00eb\u00ebc k\u025b ji k\u025b gua\u0331th t\u0254w k\u00e4
  yi\u00f6wni ku ki\u025b lu\u0254\u0254t ni ku, cet k\u025b \u0263\u00f6 bi yi\u00f6w
  th\u00f6b\u00f6k\u00e4 yorpiny, ki\u025b ba yi\u00f6w tin lua\u0331k k\u025b ji
  rep k\u00e4 th\u00e4nt\u025brli\u014b.\\n- Mi ci k\u025b lu\u0254\u0254t ni ku na\u014b,
  de k\u025b yiow ku k\u025bn\u025b tin nyoth ji kual.\\nTitt\u025b (remember): guic
  \u025bg\u0254a, mic I ran ben dh\u0254ru ka\u0331 lar\u025b j\u025b be k\u00e4 kum\u025b.
  Ni cia\u014b thi\u00eb\u00ebc wargak mi nyoth j\u025b \u025b \u014ba. La\u0331t
  kum\u025b ci k\u025b de ben k\u025b ben \u025b m\u025b.\\n\u0194\u00e4n dh\u0254ak\u00e4
  min lat k\u025b \u025b ram in k\u0254k \u014b\u0254aak - \u0190\u014bu b\u00e4 l\u025bl\u0254?\\nMi
  ci\u025b dh\u0254k I k\u0254ki du\u0254r k\u00e4 rami k\u0254k \u014b a ji thi\u00eb\u00ebc
  k\u025b \u0263\u00f6 bia du\u0254r mat. M\u025b cia mat\u0254 ba:\\n- Dhil g\u0254rpiny
  \u025bg\u0254a k\u025b ruac mi thia\u0331k\\n- Ri\u00e4\u00e4t dial mat thin\\n-
  Pek yi\u00f6wni dial, ki\u025b ta\u0331 in mat k\u025b ni yiow nyoth\\n- Mat thin
  am\u00e4ni yi\u00f6w tin ja\u0331k\u025b ni \u014b\u0254ak\\n- Ci\u00f6t k\u025bn\u025b
  lu\u0254\u0254t ni ram in k\u0254k \u014b\u0254ak la\u0331t thin\\n- Luoni ram in
  l\u00e4t/j\u00e4k \u014b\u0254ak ciet k\u025b gua\u0331th l\u00e4t d\u025b k\u025bn\u025b
  t\u025bl\u025bp\u0254nd\u025b\\n- Thany \u025b jin yi\u025bn\u025b ram in k\u0254k
  \u014b\u0254aak\\n- G\u0254r \u025b g\u0254a k\u00e4 ba thur (mi c\u00e4\u014b te
  k\u025b mi ca g\u025br k\u025b gala\u0331m k\u00e4 ca thany)\\n- B\u025b te mi lar
  \u0263\u00f6 deri mi cia mat d\u00e4k\\n- Mi we l\u0254c du \u025b thia\u0331k\\n-
  Ka\u0331m ji k\u025bl k\u025b wargak mi lat cu\u0254\u014b du mi ci wicdu g\u025br.\\nTitt\u025b
  (remember): mi kuici thok li\u014blith (English) \u025b g\u0254a, ce g\u0254a \u025bn
  \u0263\u00f6 bi ram I k\u0254k \u014b\u0254aak gatdu thi\u00eb\u00ebc I b\u025b
  thok lu\u0254c ji k\u025b \u0263\u00f6 bi du\u0254r kul\u025b nh\u0254k. \u0190
  \u014bot th\u025bl\u025b mi ci thany, thi\u00eb\u00ebc thur\u025b wargak\u00e4 min
  cia mat k\u025b thodun.\\nC\u00e4 du\u0254r nh\u0254k k\u00e4 ca wicd\u00e4 g\u025br
  - \u025b \u014bu b\u00e4 l\u025bl\u0254?\\nMi ci\u025b nh\u0254k I k\u0254k I du\u0254r
  mi g\u0254a mi na\u014b yi\u00f6w ti l\u00e4ny yi\u00f6w $100 k\u00e4 n\u025by tin
  k\u0254k \u014b\u0254aak cee\u014bni, k\u025b k\u0254r nini da\u0331\u014b w\u00e4l
  tin l\u00e4t k\u025b naath (10 business days), deri ca\u0331ru g\u025br k\u00e4
  min cia mat. \u0190 n\u025bm\u025b c\u0254al j\u025b \u2018mi ci ca\u0331ru g\u025br\u2019
  (cooling\u2013off period). Mi, k\u025b gua\u0331th \u025bm\u025b ci\u025b lar I
  c\u025b g\u0254a \u025bn min cia mat, deri k\u00f6 d\u00e4k k\u00e4 thi\u025bl\u025b
  mi de ka\u0331n k\u00e4 ji.\\n\u0190\u014but k\u00e4n I j\u025b ni nh\u0254k, de
  gua\u0331n k\u00f6k\u00e4 ji la\u0331t cu\u014b ku. Mi ci ca\u0331ru g\u025br k\u025b
  gua\u0331th in de ran ca\u0331r\u025b g\u025br k\u025b j\u025b, thi\u025bl\u025b
  ram in n\u00f6\u014b du\u0254r ki\u025b k\u0254k \u014b\u0254aak lua\u0331\u014b
  k\u025b \u0263\u00f6 b\u025b ji:\\n- thi\u00eb\u00ebc i p\u00e4l\u025b, \u2018cu
  ca\u0331ru g\u025br\u2019\\n- ji\u00f6k I thany ni du\u0254r k\u025b bu\u0254m\\n-
  ji\u00f6k I yori yi\u00f6w ti k\u0254\u014b piny k\u025b \u0263\u00f6 ci\u025b l\u00f6k.\\nDeri
  mi ci nh\u0254k da\u0331k k\u025b ruac ki\u025b deri wargak g\u0254r.\\nMi ci ran
  ben dh\u0254ru k\u00e4 thi\u00eb\u00ebc \u025b ji nh\u0254k I j\u025b de ga\u0331th
  ki\u025b karaba dh\u0254aru g\u025br\\n- Lar\u025b j\u025b mukt\u00e4p di\u025bn
  b\u025b ji moc mi g\u0254a k\u00e4 bi yi\u00f6w ti \u014buaan t\u0254w.\\n- Gua\u0331
  k\u00f6k\u00e4 g\u00f6r\u025b \u0263\u00f6 bi du\u0254r mal nh\u0254k k\u025b p\u025bth.\\n-
  Ca ji ci\u025b\u014b \u025b yu\u00e4t yu\u00e4t k\u00e4 ci cu thany.\\n- K\u025b
  c\u00e4\u014b in d\u0254\u014b ci j\u025b lar I ci min ci k\u0254k g\u00f6r.\\nTitt\u025b
  (remember):\\n- Cur\u0254 ja cia\u014b k\u025b yu\u00e4t yu\u00e4t k\u00e4 bi du\u0254r
  cu thany, thi\u00eb\u00eb ram in k\u0254k \u014b\u0254aak k\u025b \u0263\u00f6 der\u025b
  ji ba\u0331ny wargak ni ti bi l\u0254 ku\u025bn\\n- Mi ci du\u0254r thany k\u00e4
  \u2018ci ca\u0331ru g\u025br\u2019, ti k\u025b gua\u0331th k\u025b \u0263\u00f6
  bi ca\u0331r we ka\u0331n\\n- C\u0254l ji thuk\u00e4 k\u025b k\u0254r nini da\u0331\u014b
  w\u00e4l (10) ti l\u00e4t k\u025b naath, ji\u00f6k ni k\u025b ci ca\u0331ru g\u025br\\n-
  Thi\u025bl\u025b yi\u00f6w ti bi ka\u0331m ji thuk\u00e4 k\u025b \u0263\u00f6 ci
  ca\u0331ru g\u025br.\\nMi g\u00f6ri \u014b\u00e4c lu\u0254\u0254t ni k\u00f6k\u00e4
  \u014b\u0254aani thukdueeli tin ci g\u0254a \u025b l\u00f6\u014b, guil gua\u0331th
  in guic k\u025b n\u025by ti lat k\u025b ji\u00e4k thin (SCAM watch website).\"",
  "\"Collected and written by Michael Thilyang Gatkek With special thanks to Fr Christian
  Carlassare and pastoral team of Holy Trinity Parish (Old Fangak) (for English translation
  see their great book: Nuer Folktales, Proverbs and Riddles)\\nGatguub \u025b l\u025bt
  mi la cam naath r\u025by Nu\u00e4ri k\u00e4 Fangak k\u025bn\u025b Bentiu (Bitim).
  K\u025b c\u00e4\u014b k\u025bl t\u025b k\u025b\\nnyam mi c\u0254ali Nyan\u00e4r\u00e4
  Ga\u0320l k\u00e4 Fangak. Cu\u025b ji\u025bn r\u025by r\u025b\u0308\u025b\u0308k
  kuer jio\u0320kni (Juaibor) w\u025b\u025b cie\u014bd\u025b.\\nCuk\u025b r\u00f6m
  k\u025bn\u025b Gatguub. Cu\u025b Nyan\u00e4r\u00e4 Ga\u0320l ji\u00f6k i L\u0254\u014bni.
  Cu nyam \u025bm\u0254 l\u0254\u0320\u0254\u0320\u014b. K\u00e4 cu\u025b ji\u00f6k
  i\\nth\u0254l pii. K\u025b gua\u0320a\u0320th mi t\u0254\u0320t cu d\u00e4man ben
  k\u0254r, k\u025b \u0263\u00f6\u00f6 dual\u025b i ba cam \u025b Gatguub, min c\u025b
  cop\\ndh\u0254r Gatguub, cu\u025b nyiman jek nyuur\u00e4. Cu\u025b j\u025b thiec
  i \u025b \u014bu ti nyuur\u00e4 wan\u025b m\u025b? Cu Gatguub\\n\u025b loc i gaac\u00e4
  cetnik\u025b ji Gatga\u0320l. Min c\u025b guic cu\u025b k\u025b ji\u00f6k i w\u025b\u0308\u025b\u0308k\u025b.
  Cu nyan\u00e4r\u00e4 w\u00e4 k\u025bn\u025b d\u00e4man.\\nMi ci \u0263\u0254w a
  ruel, mi ci nhial d\u025bm, bi naath w\u00e4 may k\u025b w\u00e4\u00e4r k\u025b
  baak. Bi Gatguub w\u00e4 b\u00e4, mi\\nc\u025b raan cam b\u025b mua\u0320c b\u025b
  wee i th\u00e4k r\u0254\u0320a\u0320l\u00e4 Gatguub i Gatguub a r\u0254\u0320l.
  Mi ci raan \u025b ji\u00f6k i can\\ntee ta\u014b. B\u025b wee i c\u025b duth ruup.
