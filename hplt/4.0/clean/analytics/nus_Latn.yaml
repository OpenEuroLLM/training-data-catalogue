sample: '["\"Mi di\u025bri, c\u0254l la\u0331a\u0331t tin lua\u0331k k\u025b naath
  k\u025b kui coronavirus 1800 675 398 l\u00ebpk\u025b k\u025b c\u00e4\u014b k\u025bn\u025b
  w\u00e4\u00e4r.\\nMi g\u00f6ri \u0263\u00f6\u00f6 ba ji lu\u0254c thok, c\u0254l
  la\u0331a\u0331t k\u00e4 TIS National 131 450.\\nC\u0254l 000 mi tee k\u025b mi
  diit mi ci tu\u0254k k\u00e4 ji k\u025b p\u025b\u0308th.\\nTin bi dhil tit\\n- L\u00e4thni
  kuum nhiam mi r\u00f6\u014b nhiam mi kum wumdu k\u025bn\u025b thokdu mi ji\u025bni
  ci\u00eb\u014bdu, p\u00ebk\u025b k\u025b gua\u0331th\u0254 cie\u014bi thin\u0254.\\n-
  Tit\u025b g\u0254aa \u025bn \u0263\u00f6\u00f6 bi r\u0254 n\u0254an k\u025b kam
  k\u00e4th mi 1.5 mitiri ki\u025b kaath di\u0254k k\u00e4 n\u025by tin k\u0254ki\u025bn\\n-
  Lak t\u00ebtkun ni cia\u014b\\n- Mi j\u00ebki r\u0254 i ti k\u025b ju\u00eby, t\u00ebni
  ci\u00eb\u014b, /cu w\u00eb l\u00e4t\\n- Ki\u025bli ki\u025b thiami k\u00e4 puut\u025b
  ki\u025b ci\u00e4lu\\n- Mi t\u00eb k\u025b mi nyoth j\u025b i ti k\u025b coronavirus
  (COVID-19), w\u00ebrk\u025b \u025b ji wa th\u025bm\\n- Coronavirus th\u025bm k\u025b
  j\u025b baa\u014b k\u00e4 n\u025by diaal. N\u025bm\u025b matd\u025b n\u025by diaal
  tin thi\u025bl Medicare Card ki\u025b ja\u0331a\u0331l tin b\u00e4 kuic ki\u025br,
  n\u025by tin b\u00e4 k\u025b la\u0331t ki\u025b n\u025by ti g\u00f6\u00f6r \u0263\u00f6\u00f6
  bi ci\u00eb\u014b wic\\n\u0190n gua\u0331th \u025bm\u025b\\nP\u00ebk K\u00e4tha
  guk\u00e4 Bik-t\u00f6-ria tin pay tu\u0254k\\nCa\u0331p k\u025b kuic k\u00e4p guk\u00e4
  cu\u0254\u014b k\u025bn\u025b ka\u0331a\u0331th tin de Bik-t\u00f6-ria jak\u00e4
  COVID Normal ca k\u025b la\u0331th raar \u025b j\u0254c k\u00e4 Coronavirus (COVID-19)
  roadmap to re-opening.\\nT\u00ebk\u025b Ca\u0331p k\u025bl mi ca rialik\u00e4 k\u025b
  kuic Melbourne k\u025bn\u025b k\u025bl r\u025by ci\u00eb\u014b Bik-t\u00f6-ria\\nKu\u00e4r
  pu\u0254l\u00e4 P\u0254a\u0331ny (The Chief Health Officer) b\u025b guk g\u025br
  mi cia\u014b r\u0254d\u025b g\u025br\\nR\u025by ci\u00eb\u014b Melbourne\\nK\u00e4th
  in r\u025bwd\u025b\u0331 \u025bt\u025bm\u025b ni k\u025b c\u00e4\u014b k\u00e4 28
  k\u00e4 pay B\u00e4\u014buan 2020 r\u025by ci\u00eb\u014b Melbourne\\nThil\u025b
  ram mi ba l\u025b p\u00ebn ja\u0331l r\u025by ci\u00eb\u014b Melbourne \u025bt\u025bm\u025b
  ni thaak 5am dhieec k\u025b runwa\u014b k\u025b c\u00e4\u014b k\u00e4 28 k\u00e4
  pay Ba\u014buan 2020\\nBi ji\u025bn cie\u014bdu k\u025b gua\u0331th \u025b g\u00f6\u00f6ri
  m\u0254 k\u025b k\u025bl k\u00e4 lu\u0254tni da\u0331\u014b \u014buan titi\u0331\\n-
  W\u00eb k\u0254k mi\u0331thni k\u025bn\u025b ti g\u00f6rk\u025b ci\u00eb\u014b\\n-
  Ri\u00e4ny ci\u00f6kni ki\u025b wi pu\u0254nydu l\u00ebth rar ca jak\u00e4 kui\\n-
  Wargak la\u0331t ki\u025b nh\u00f6k la\u0331t\\n- Mi th\u00f6pi lu\u00e4k, k\u025b
  kui ram mi cuc ki\u025b wi duel wa\u0331l\\nRi\u00e4ny ci\u00f6kni ki\u025b wi pu\u0254nydu
  l\u00ebth k\u025bn\u025b w\u00eb k\u0254k k\u025b tin g\u00f6rk\u025b cie\u014b,
  bi dhil p\u00ebk gua\u0331th mi t\u00eb k\u025b kil\u025b mitiri da\u0331\u014b
  5 dhiec k\u025b dh\u0254ru.\\n\u0190 t\u025bm\u025b ni\u025b gua\u0331th \u025bm\u025b\\n-
  \u0190w\u00eb k\u00e4 n\u025b thi\u00ebc k\u00e4 dh\u00f6r da\u0331\u014b r\u025bw
  nh\u00f6k\u025b k\u025b \u0263\u00f6\u00f6 d\u00ebk\u025b w\u00eb ji\u00ebk rar\\n-
  B\u025b te k\u025b k\u00e4th bi ba kuany k\u025b \u0263\u00f6\u00f6 mi dhooli luoc
  duel g\u0254r\u00e4 k\u00e4 (Prep to Grade 6),VCE/VCAL k\u025bn\u025b duelg\u0254r\u00e4
  tin k\u0254\u014b k\u025b w\u00e4di\u025bn k\u00e4 k\u00e4th in 4 \u014buandi\u025bn
  k\u025b l\u025bp duelg\u0254r\u00e4.\\n- Ba gu\u00e4th \u014biic\u00e4 gan ti t\u0254ani
  l\u025bp\\n- Ba gu\u00e4th l\u00e4tni ti \u014buaan l\u025bp\\n- Ba pu\u0254l k\u00ebt
  tin la \u014baark\u025b rar l\u025bp, n\u025by tin \u014bi\u00e4c k\u025b d\u00eb
  k\u025b cop k\u00e4 n\u025by da\u0331\u014b r\u025bw k\u025b \u014biic k\u025bl\\n-
  Pali ji \u014b\u00e4th\u00e4 ca nh\u0254k \u025bn \u0263\u00f6\u00f6 de n\u025by
  ti co\u0254pk\u025b n\u025by da\u0331\u014b dhiec r\u0254 dol gua\u0331th k\u025bl
  raar k\u025bn\u025b b\u00f6th pal\u00e4di\u025bn k\u025bl\\n- Ca ku\u00ebn nh\u00f6k
  \u025bn \u0263\u00f6\u00f6 bak\u025b la\u0331t raar \u025b n\u025by ti cu\u0254pk\u025b
  dhieec(Tee n\u025by tin ku\u00ebn k\u025bn\u025b n\u00eb\u00ebn da\u0331\u014b r\u025bw
  r\u025bydi\u025bn)\\n- Ba ji moc karaam \u025b Bik-t\u00f6ria Poli\u0331th k\u025b
  yi\u00f6w ti copk\u025b $4,957 mi ci w\u00e4 ja\u0331l r\u025by ci\u00eb\u014b Bik-t\u00f6-ria
  \u025b thil luot mi g\u0254aa. Ba ji moc karaam b\u00e4 mi ci m\u00e4athdu k\u025bn\u025b
  wa\u0331a\u0331tdu w\u00e4 guil mi cia cie\u014b k\u025b\u025bl k\u00e4 d\u0254\u014b
  \u025b y\u025bn bu\u0254n mi diit bi p\u00e4l n\u025by da\u0331\u014b dhieec raar.
  Ba\u0331 ji moc karaam mi ci ma\u0331a\u0331thdu k\u025bn\u025b wa\u0331a\u0331tdu
  ji guil dh\u0254\u0254ru \u025b thil luot mi g\u0254aa, ki\u025b k\u025b ram mi
  tiitdi.\\nK\u00e4th in di\u0254di\u025bn: mi ci cia\u014b paar c\u025b n\u025by
  ti ca dhieec cop (r\u025by wec k\u025b\u025bliw) k\u025b k\u0254r ni\u0331ni\u0331
  d\u00e4 14 W\u00e4l B\u00e4\u014buan tee ci w\u00e4 k\u025bn\u025b \u0263\u00f6\u00f6
  ca mat \u025b Ku\u00e4\u00e4r Pu\u0254l\u00e4 Puany.\\n\u0190 t\u025bm\u025b ni\u025b
  gua\u0331th \u025bm\u025b\\n- B\u025b cu thi\u025bl ram mi ba pen ja\u0331l k\u025b
  w\u00e4r, b\u025b cu thi\u025bl guk mi p\u00ebni ji\u025bn dh\u0254ru ki\u025b p\u00ebni
  w\u00eb ja\u0331l mi te k\u025b gua\u0331th mi Wii\u0331 ja\u0331l thin.\\n- \u0190w\u00eb
  k\u00e4 n\u025by ti cu\u0254pk\u025b n\u025by da\u0331\u014b 10 w\u00e4l bik\u025b
  nyuur raar gua\u0331th k\u025bl\\n- D\u00eb ji guil dh\u0254ru \u025b ja\u0331a\u0331l
  ti co\u0254pk\u025b n\u025by da\u0331\u014b dhiec ti b\u00e4 dh\u0254r mi d\u0254di\u025bn.
  K\u00e4 bi k\u025bn diaal dhil b\u00ebn dh\u0254r k\u025bl\\n- Dhooli duel g\u0254r\u00e4
  tin tee k\u00e4 book 7 am\u00e4ni Book 10 bak\u025b nh\u0254k \u0263\u00f6\u00f6
  bik\u025b luoc deuelg\u0254r\u00e4 mi ci juey k\u00e4pd\u025b ku\u025b\u0331\u0308\u025b\u0331\u0308
  mi ca mat Kua\u0331r \u014a\u00e4c\u00e4 Pu\u0254l\u00e4 Puany\\n- Thukni k\u025bn\u025b
  gua\u0331th ta\u0331k mi\u00e4m bak\u025b l\u025bp\\n- Gua\u0331th mi\u0331thni\u0331
  k\u025bn\u025b cayni ba k\u025b l\u025bp k\u00e4 bi naath nyuur raar ka\u0331 bi
  bu\u0254n nath \u025b n\u025by da\u0331\u014b 10 w\u00e4l\\n- K\u00e4th luoc\u00e4
  \u014baari tin la \u014bark\u025b raar k\u00e4 ci naath r\u0254 thiek k\u025b kur\u025bn\u025b
  n\u025b\u025bni tin del, \u014baari kur\u025bni raar bak\u025b tuk k\u025b n\u025by
  tin ci runki\u025bn piny runi da\u0331\u014b 18 (derk\u025b r\u0254 thiek k\u00e4
  /ca r\u0254 de thiek)\\nK\u00e4th in j\u0254ak: K\u025b luek in ba laar \u025b Ku\u00e4\u00e4r
  Pu\u0254l\u00e4 Puany mi thil\u025b juey mi ci j\u0254c k\u025b k\u0254r nini da\u0331\u014b
  14 tee ci w\u00e4 k\u025bn\u025b luek in ba laar \u025b Ku\u00e4\u00e4r Pu\u0254l\u00e4
  Puany\\n\u0190 t\u025bm\u025b ni\u025b gua\u0331th \u025bm\u025b\\n- Ba n\u025by
  ti copk\u025b 50 nh\u00f6k \u0263\u00f6\u00f6 bik\u025b r\u0254 dol gua\u0331th
