  \u0434\u043e\u043b\u0433\u0438\u043c \u0438 \u0442\u0440\u0443\u0434\u043d\u044b\u043c.\\nT\u00fcrkmen
  h\u00e4kimi\u00fdetleri \u00f6zlerini hel\u00e4k\u00e7ilige alyp bar\u00fdarmy?\\nTebigy
  ba\u00fdlyklara ba\u00fd T\u00fcrkmenistan halkara arenasynda \u00e7ynlaka\u00fd
  abra\u00fd krizisini ba\u015fdan ge\u00e7ir\u00fd\u00e4r. \u00d6z\u00fcni g\u00fcll\u00e4p
  \u00f6s\u00fd\u00e4n we durnukly \u00fdurt h\u00f6km\u00fcnde g\u00f6rkezmek synany\u015fyklaryna
  garamazdan, \u00fdurdu\u0148 i\u00e7ind\u00e4ki repressiw \u00e7\u00e4reler we azatlyklara
  \u00e7\u00e4klendirmeler halkara jemgy\u00fdet\u00e7iligini\u0148 \u00f6\u0148\u00fcnde
  abra\u00fdyny ga\u00e7yr\u00fdar. Ilata has berk g\u00f6zeg\u00e7ilik we senzurany\u0148
  \u00fdokarlanmagy t\u00fcrkmen h\u00e4kimi\u00fdetlerini\u0148 ba\u015fga\u00e7a
  pikirleri basyp \u00fdatyrmak we da\u015fary \u00fdurtlarda negatiw maglumatlary\u0148
  \u00fda\u00fdramagyny\u0148 \u00f6\u0148\u00fcni almak \u00fc\u00e7in esasy gural
  boldy.\\nSo\u0148ky a\u00fdlarda T\u00fcrkmenistan h\u00e4kimi\u00fdetleri repressiw
  \u00e7\u00e4releri ep-esli g\u00fc\u00fd\u00e7lendirdi. Sosial medi\u00fdada \u00f6z
  pikirlerini a\u00fdtmaga \u00fda-da \u00fdurdu\u0148 da\u015fyndaky protestlere
  gatna\u015fmaga het edip bil\u00fd\u00e4n ra\u00fdatlar rehimsiz yzarlan\u00fdar.
  Sorag \u00fc\u00e7in \u00e7agyryl\u00fdar, gorkuzyl\u00fdar we tussag edil\u00fd\u00e4r,
  aktiwistleri\u0148 ma\u015fgalalaryna basy\u015f we howp aban\u00fdar. Bu, ilaty\u0148
  arasynda barha depressi\u00fda we ygty\u00fdarsyzlyk du\u00fd\u00fdan n\u00e4gileligi\u0148
  artmagyna seb\u00e4p boldy.\\nT\u00fcrkmen h\u00e4kimi\u00fdetleri hem internete
  we metbugata g\u00f6zeg\u00e7iligi g\u00fc\u00fd\u00e7lendirdi. Gara\u015fsyz journalistsurnalistler
  we bloggerler yzarlan\u00fdar we maglumata el\u00fdeterlilik berk g\u00f6zeg\u00e7ilikde
  saklan\u00fdar. Bu, h\u00f6k\u00fcmeti islendik tankyt etmegi\u0148 \u00e7ynlaka\u00fd
  netijelere getirip biljek gorky atmosferasyny d\u00f6red\u00fd\u00e4r. Mundan ba\u015fga-da,
  T\u00fcrkmenistan \u00e7ynlaka\u00fd ykdysady krizis bilen \u00fd\u00fczbe-\u00fd\u00fcz
  bol\u00fdar. Uzaga \u00e7eken \u00e7\u00f6kg\u00fcnlik, m\u00f6h\u00fcm harytlary\u0148
  bahasyny\u0148 \u00fdokarlanmagy we k\u00f6p\u00e7\u00fclikle\u00fdin i\u015fsizlik
  bilen utga\u015f\u00fdar. Residentserli \u00fda\u015fa\u00fdjylary\u0148 pikiri\u00e7e,
  \u00e7ilimi\u0148 we azyk \u00f6n\u00fcmlerini\u0148 bahasy ep-esli \u00fdokarlandy,
  bu bolsa ra\u00fdatlary\u0148 kyn \u00fdagda\u00fdyny hasam erbetle\u015fdir\u00fd\u00e4r.
  Ykdysady meseleler korrupsi\u00fda we dolandyry\u015fy\u0148 erbetligi bilen hasam
  g\u00fc\u00fd\u00e7len\u00fd\u00e4r we ilaty\u0148 arasynda n\u00e4gileligi\u0148
  artmagyna seb\u00e4p bol\u00fdar. Gaz we nebit \u00fdaly tebigy ba\u00fdlyklara
  garamazdan, t\u00fcrkmen ykdysady\u00fdeti gow\u015fak we durnuksyz bolup gal\u00fdar
  we adamlary da\u015fary \u00fdurtlarda i\u015f g\u00f6zlem\u00e4ge mejbur ed\u00fd\u00e4r.\\nBu
  faktorlary\u0148 hemmesi T\u00fcrkmenistany\u0148 halkara abra\u00fdyny\u0148 \u00fdaramazla\u015fmagyna
  k\u00f6mek ed\u00fd\u00e4r. Internationalurt halkara guramalary we adam hukuklary
  aktiwistleri tarapyndan adam hukuklaryny\u0148 bozulmagy we azatlyklary\u0148 \u00e7\u00e4klendirilmegi
  \u00fc\u00e7in tankyt edildi. Mu\u0148a garamazdan, t\u00fcrkmen h\u00e4kimi\u00fdetleri
  reforma we a\u00e7-a\u00e7anlyk \u00e7agyry\u015flaryny \u00e4sgermezlik ed\u00fd\u00e4rler.
  Halkara jemgy\u00fdet\u00e7iligi T\u00fcrkmenistany adam hukuklaryna we erkin maglumat
  aly\u015f-\u00e7al\u015fyna hormat go\u00fdmaga \u00e7agyr\u00fdar. \u015ee\u00fdle-de
  bolsa, \u015fu wagta \u00e7enli g\u00f6r\u00fcn\u00fd\u00e4n netijeler \u00fdok,
  seb\u00e4bi \u00fdurdu\u0148 h\u00e4kimi\u00fdetleri \u00fdurdy bir bur\u00e7a \u00f6w\u00fcr\u00fd\u00e4n
  we d\u00fcn\u00fd\u00e4 arenasyndaky pozisi\u00fdasyny kynla\u015fdyr\u00fdan repressi\u00fdalary
  we senzurany g\u00fc\u00fd\u00e7lendirmegi dowam etdir\u00fd\u00e4rler.\\nT\u00fcrkmenistanda
  \u00fdagda\u00fdy gowula\u015fdyrmagy\u0148 geljegi d\u00fc\u015fn\u00fcksiz bolup
  gal\u00fdar. \u00c7ynlaka\u00fd \u00f6zgertmeler we halkara hyzmatda\u015flyga a\u00e7yklyk
  bolmazdan, \u00fdurt ykdysady we sy\u00fdasy \u00f6s\u00fc\u015fine \u00fdaramaz
  t\u00e4sir edip biljek izol\u00fdasi\u00fda galmak howpuny d\u00f6red\u00fd\u00e4r.
  Halkara syn\u00e7ylar \u00fc\u00fdtge\u015fm\u00e4 umyt ed\u00fd\u00e4rler, \u00fd\u00f6ne
  hakykat \u00fc\u00fdtgemegi\u0148 \u00fdoluny\u0148 uzyn we kyn boljakdygyny g\u00f6rkez\u00fd\u00e4r.\"",
