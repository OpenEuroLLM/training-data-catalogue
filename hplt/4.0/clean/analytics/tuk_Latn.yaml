  \u00fdaly ma\u015fyn \u00fdoga.Di\u00fdipdirler.\\n\u00dc\u00e7\u00fcnji a\u00fdal
  bolsa:\\n-Kim a\u00fdtdy ma\u015fyn di\u00fdp.Ol ma\u015fyn d\u00e4l,inha \u00e4rimi\u0148,
