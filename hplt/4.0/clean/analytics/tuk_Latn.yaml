  \u043f\u0440\u043e\u0444\u0438\u043b\u044c\"", "\"2268\\nT\u00fcrkmenistany\u0148
  Ermenistan Respublikasyndaky il\u00e7isi M.A\u00fdazow \u00dderewan d\u00f6wlet
  uniwersitetini\u0148 rektory Ogannes Ogannis\u00fdan bilen du\u015fu\u015fdy. 24-nji
  i\u00fdulda bolan du\u015fu\u015fykda taraplar ylym we bilim pudagynda Magtymguly
  adyndaky T\u00fcrkmen d\u00f6wlet uniwersiteti bilen \u00dderewan d\u00f6wlet uniwersitetini\u0148
  arasynda hyzmatda\u015flyk etmek hakyndaky Ylala\u015fygy\u0148 \u00e7\u00e4klerinde
  \u00f6zara gatna\u015fyklary\u0148 meselelerini ara alyp maslahatla\u015fdylar.
  Bu barada T\u00fcrkmenistany\u0148 DIM-ni\u0148 resmi sa\u00fdtynda habar beril\u00fd\u00e4r.\\nDu\u015fu\u015fygy\u0148
  dowamynda taraplar Ermenistanda t\u00fcrkmen dili, edebi\u00fdaty we medeni\u00fdeti
  bilen tany\u015fdyrmak we \u00fda\u00fdratmak baradaky mesel\u00e4ni\u0148 \u00fcst\u00fcnde
  durup ge\u00e7diler. Rektor O.Ogannis\u00fdan t\u00fcrkmen akyldar \u015fahyry Magtymguly
  Pyragyny\u0148 edebi mirasyny gi\u0148den wagyz etmek maksady bilen, t\u00e4ze 2023-2024-nji
  okuw \u00fdylynda uniwersitetde Pyragyny\u0148 \u00f6mr\u00fcne we d\u00f6redijiligine
  bagy\u015flanan birn\u00e4\u00e7e umumy sapaklary\u0148 ge\u00e7irilmegini\u0148
  me\u00fdille\u015fdiril\u00fd\u00e4ndigini habar berdi. Bu sapaklar t\u00fcrkmen
  halkyny\u0148 be\u00fdik ogly Magtymguly Pyragyny\u0148 300 \u015fanly \u00fdyllyk
  senesine bagy\u015flanar.\\n\u015eunu\u0148 bilen baglylykda, iki hyzmatda\u015f
  \u00fdokary okuw mekdeplerini\u0148 professor-mugallymlaryny\u0148 we talyplaryny\u0148
  arasynda tejribe aly\u015fmak baradaky mesel\u00e4ni gozgamak bilen, il\u00e7i t\u00e4ze
  okuw \u00fdylynda umumy sapaklary ge\u00e7irmek \u00fc\u00e7in Magtymguly adyndaky
  T\u00fcrkmen d\u00f6wlet uniwersitetinden mugallymlary \u00e7agyrmagy teklip etdi.\\nErmeni
  tarapy Magtymguly Pyragyny\u0148 300 \u00fdyllyk \u015fanly senesi mynasybetli Ermenistany\u0148
  ylmy \u017eurnallarynda Magtymguly Pyragy barada d\u00fcrli ylmy makalalary ne\u015fir
  etmegi, \u015fe\u00fdle hem nusgawy \u015fahyra bagy\u015flanan halkara maslahaty
  ge\u00e7irmegi teklip etdi.\"", "\"Wela\u00fdat ba\u015f bilim m\u00fcdirligini\u0148
  \u00fdanyndaky d\u00f6wlet umumybilim edaralaryny\u0148 mugallymlaryny\u0148 we
  mekdebe \u00e7enli \u00e7agalar edaralaryny\u0148 terbi\u00fde\u00e7ilerini\u0148
  h\u00fcn\u00e4r derejelerini \u00fdokarlandyry\u015f merkezinde nobatdaky usuly-amaly
  okuwlar ge\u00e7irildi.\\nO\u0148a wela\u00fdatdaky orta mekdepleri\u0148 T\u00fcrkmenistany\u0148
  medeni mirasy, d\u00fcn\u00fd\u00e4 medeni\u00fdeti, \u00f6z\u00fc\u0148i alyp barmagy\u0148
  medeni\u00fdeti okuw derslerini\u0148 mugallymlary gatna\u015fdylar.\\nOnu\u0148
  bar\u015fynda merkezi\u0148 h\u00fcn\u00e4rmeni Ogulgerek Huda\u00fdberdi\u00fdewa
  \u00e7yky\u015f edip, bilim ulgamyna t\u00e4ze tehnologi\u00fdalary\u0148, \u00f6\u0148debaryjy
  i\u015f tejribelerini\u0148 netijeli orna\u015fdyryl\u00fdandygy barada gi\u0148den
  durup ge\u00e7di. So\u0148ra T\u00fcrkmenabat \u015f\u00e4herind\u00e4ki \u00fd\u00f6ritele\u015fdirilen
  2-nji, 26-njy, 29-njy orta mekdepleri\u0148 mugallymlary Oguljeren Sadykowa, Aida
  Wepa\u00fdewa, A\u00fdg\u00fcl Gurbannazarowa we be\u00fdlekiler \u00f6zlerini\u0148
  uzak \u00fdyllary\u0148 dowamynda toplan i\u015f tejribelerini bizi\u0148 bilen
  pa\u00fdla\u015fdylar.\"", "\"\u00abT\u00fcrkmenistan \u2014 Bitaraplygy\u0148 mekany\u00bb
  \u00fdylynda belleniljek hemi\u015felik Bitaraplygymyzy\u0148 \u015fanly ba\u00fdramy
  berkarar T\u00fcrkmen d\u00f6wletini\u0148 parahat\u00e7ylyk s\u00f6\u00fd\u00fcji
  ynsanperwer sy\u00fdasatyny\u0148 halkara derejesinde dabaralanmasydyr. Bu ba\u00fdram
  umumadamzat \u00fda\u015fa\u00fd\u015fyny\u0148 asuda geljegine ynamy\u0148 ba\u00fdramydyr,
  gapma-gar\u015fylyklary di\u0148e geple\u015fikler arkaly \u00e7\u00f6zm\u00e4ge,
  ynany\u015fmaga we hyzmatda\u015flyga \u00e7agyr\u00fdan, \u00e7u\u0148 pa\u00fdhasy
  \u015f\u00f6hratlandyr\u00fdan ba\u00fdramdyr.\\nD\u00fcn\u00fd\u00e4 halklaryny\u0148
  ylala\u015fykly \u00fda\u015famakda, \u00e4hlumumy \u00f6s\u00fc\u015fi \u00fcpj\u00fcn
  etmekde tagallalary birle\u015fdirmek \u00fdaly, umumy maksatlaryna go\u015fant
  go\u015fmakda hemi\u015felik Bitarap T\u00fcrkmenistany\u0148 alyp bar\u00fdan da\u015fary
  sy\u00fdasat ugry bu g\u00fcnki g\u00fcn hormatly Prezidentimizi\u0148 parahat\u00e7ylyga
  g\u00f6n\u00fckdirilen adalatly ide\u00fdalaryny\u0148 \u00e4hmi\u00fdetini we esasy
  maksadyny halkara jemgy\u00fdet\u00e7iligine gi\u0148den a\u00fdan ed\u00fd\u00e4r.\\nM\u00e4hriban
  Arkadagymyzy\u0148 parahat\u00e7ylyk s\u00f6\u00fd\u00fcji d\u00f6wlet sy\u00fdasatyny\u0148
  d\u00fc\u00fdp mazmunynda pederlerini\u0148 hakydasy, ruhy bilen kalbyna ornan ynsanperwerligi
  g\u00f6rmek bol\u00fdar. Pederinden e\u015fiden, \u00fda\u015flykdan a\u0148yna
  orna\u015fan, \u00fd\u00fcregini\u0148 \u00fcst\u00fcnden ge\u00e7en 1941\u20141945-nji
  \u00fdyllary\u0148 ur\u015fy baradaky \u00fdatlamalar m\u00e4hriban Arkadagymyzy\u0148
  kalbynda hemi\u015felik orun alyp, adam \u00f6mr\u00fcni\u0148, halky\u0148 ykbalyny\u0148
  belli-belli pursatlaryny pajygalary\u0148 j\u00fcmm\u00fc\u015fine tarap sowan uru\u015f
  \u00fdyllaryny\u0148 \u00fde\u0148il bolmadyk durmu\u015f \u00fdollary, je\u0148bazlygy\u0148
  gar\u015fysyna \u00e7yk\u00fdan \u00fdag\u015fy p\u00e4l, \u00e7yl\u015fyrymly d\u00f6w\u00fcrde
  adamy\u0148 ahlagyny\u0148, terbi\u00fdesini\u0148, adam\u00e7ylyk derejesini\u0148
  tut\u00fdan orny, halky\u0148 ruhuny\u0148 birle\u015fmeginden, adamlary\u0148 bir-birege
  ra\u00fdda\u015flygyny\u0148 has a\u00fddy\u0148 \u00fd\u00fcze \u00e7ykmagyndan
  b\u00fctin jemgy\u00fdetde d\u00f6re\u00fd\u00e4n umyt, ga\u00fdrat baradaky \u00e7u\u0148\u0148ur
  gara\u00fd\u015fy kemala getirendigini a\u00fdan ed\u00fd\u00e4n \u00fdagda\u00fdlary\u0148
  bizi\u0148 \u015fu g\u00fcnki bagty\u00fdar durmu\u015fymyzy\u0148 bin\u00fdady
  bolup dur\u00fdandygyna d\u00fc\u015f\u00fcnmek kyn d\u00e4l. \u015eo\u0148a g\u00f6r\u00e4-de,
  m\u00e4hriban Arkadagymyzy\u0148 alyp bar\u00fdan sy\u00fdasaty her bir adama d\u00fc\u015fn\u00fckli,
  has \u00fdakyndyr.\\n1941 \u2014 1945-nji \u00fdyllary\u0148 Be\u00fdik Watan\u00e7ylyk
  ur\u015funy\u0148 agyr \u00fd\u00fck\u00fcni \u00e7ekmedik ma\u015fgala \u00fdok
  bolsa gerek. Uzaklarda, je\u0148 me\u00fddanynda galan hossarlaryny\u0148, ogullaryny\u0148,
  doganlaryny\u0148, \u00fdan\u00fdolda\u015flaryny\u0148 hasratyny \u00fd\u00fcreginde
  g\u00f6teren, t\u00e4 \u00f6mr\u00fcni\u0148 ahyryna \u00e7enli olary\u0148 \u00fdoluna
  g\u00f6z diken pederler, ene mamalar h\u00e4zir bizi\u0148 aramyzda se\u00fdrekledi.
  \u00c7\u00fcnki ur\u015fu\u0148 \u00fde\u0148i\u015f bilen tamamlananyna 75 \u00fdyl
  dol\u00fdar. \u015eun\u00e7a \u00fdyllar ara d\u00fc\u015fse-de, ur\u015fu\u0148
  salan \u00fdarasy nesilleri\u0148 a\u0148yndan gitme\u00fd\u00e4r. Hakydalarda,
  \u00fdatlamalarda, kitaplarda, kinofilmlerde, suratlarda, \u00fda\u015fululary\u0148
  g\u00fcrr\u00fc\u0148lerinde ur\u015fu\u0148 adamzady\u0148 ba\u015fyndan inderen
  k\u00fclpetlerini\u0148 halklary\u0148 \u00fda\u015fa\u00fd\u015fyny i\u0148 agyr,
  i\u0148 howply pursatlara \u00f6w\u00fcr\u00fd\u00e4ndigi be\u00fdan edil\u00fd\u00e4r.
  \u015eol seb\u00e4pli pederlerimizi\u0148, ene-mamalarymyzy\u0148 uru\u015f \u00fdyllarynda
  \u00e7eken jepasyny, g\u00f6ren horlugyny unutmak bolma\u00fdar. Uru\u015f \u00fdyllaryny\u0148
  \u00fdatlamalary parahat\\ndurmu\u015fy\u0148 gadyryny bilm\u00e4ge, asudalygy goramakda
  borju\u0148a d\u00fc\u015f\u00fcnm\u00e4ge, eziz Watany\u0148, m\u00e4hriban halky\u0148
  g\u00fcll\u00e4p \u00f6smegine go\u015fant go\u015fmak maksady bilen, \u00fda\u015famaga,
  i\u015flem\u00e4ge g\u00fc\u00fd\u00e7-ga\u00fdrat ber\u00fd\u00e4r. Peder \u00fdollary
  watans\u00f6\u00fd\u00fcjiligi\u0148, ga\u00fdratlylygy\u0148 be\u00fdik nusgasydyr.\\nHormatly
  Prezidentimiz \u00abD\u00f6wlet gu\u015fy\u00bb romanynda \u015fe\u00fdle \u00fdaz\u00fdar:
  \u00abRomanda \u00e7agalygy 1941 \u2014 1945-nji \u00fdyllary\u0148 Be\u00fdik Watan\u00e7ylyk
  ur\u015funa gabat gelen m\u00e4hriban kyblamy\u0148 \u00f6mr\u00fcni\u0148 di\u0148e
  bir \u00fdarym \u00fdyly \u2014 ur\u015fa giden kakasyndan ma\u015fgala garamatyny
  \u2014 iner \u00fd\u00fck\u00fcni gerdenine alyp galan we ol \u00fd\u00fcki \u015firin
  janyna d\u00f6z gelip, gije-g\u00fcndiz \u00fdatman \u00e7eken, oba adamlaryna-da
  \u00fdadawsyz, yhlasly k\u00f6mek eden d\u00f6wri...\\nMen \u00e7agalykda m\u00e4hriban
  kakamy\u0148 \u015fol agyr ge\u00e7en \u00fdyllar hakdaky g\u00fcrr\u00fc\u0148lerini
  k\u00e4n di\u0148ledim. Ol \u00fdyllar kakama taplany\u015f, k\u00e4millik mekdebi
  bolupdyr. \u015ee\u00fdle agyr \u015fatylara merdi-merdanalyk bilen d\u00f6z gelip,
  oba adamlaryna goldaw hema\u00fdat beren, be\u00fdik gahryman\u00e7ylyk g\u00f6rkezen
  kakama men \u00e7\u00e4ksiz guwan\u00fdaryn, bu\u00fdsan\u00fdaryn. Kalbyma dolan
  \u015fol guwan\u00e7, bu\u00fdsan\u00e7 du\u00fdgularyny durmu\u015fa, Watana, il-ulsuma
  \u00e7\u00e4ksiz s\u00f6\u00fdgi, mertlik, tutan\u00fderlilik, ga\u00fdratlylyk,
  ruhubelentlik, ynsanperwerlik mekdebi bolup, meni \u00fcst\u00fcnliklerden \u00fcst\u00fcnliklere
  atardy, bagta elt\u00fd\u00e4n \u00e7elgi boldy, her hili \u00e7ykgynsyz pursatlarda,
  her bir \u00e4dimde ma\u0148a hema\u00fdat-goldaw berdi\u00bb.\\nIne, \u015fe\u00fdle
  pikir-d\u00fc\u015f\u00fcnjeler bilen kemala gelen, terbi\u00fdelenen, t\u00fcrkmen
  halkyny\u0148, T\u00fcrkmen d\u00f6wletini\u0148 \u015fu g\u00fcnki hem-de geljekki
  ykbalyny\u0148 aladalaryny merdanalyk bilen \u00f6m\u00fcr \u00fdoluna \u00f6wren
  Gahryman Arkadagymyzy\u0148 parahat\u00e7ylyga gara\u00fd\u015fyny\u0148 \u00f6r\u00e4n
  \u00e7u\u0148dugyna we \u00f6r\u00e4n a\u00fddy\u0148dygyna g\u00f6z \u00fdetirmek
  kyn d\u00e4l.\\nUru\u015f we parahat\u00e7ylyk, bu iki d\u00fc\u015f\u00fcnje bir-birine
  doly gapma-gar\u015fy bolany \u00fc\u00e7in, olary\u0148 adamzady\u0148 durmu\u015fyna,
  jemgy\u00fdetleri\u0148 \u00f6s\u00fc\u015fine ed\u00fd\u00e4n t\u00e4siri-de b\u00fctinle\u00fd
  tapawutlydyr. Ur\u015fu\u0148 apatlaryny sanap ge\u00e7m\u00e4n, o\u0148a derek
  parahat\u00e7ylygy\u0148 d\u00f6red\u00fd\u00e4n \u00f6s\u00fc\u015flerini agzamak
  has \u00fdakymlydyr hem-de bu\u00fdsan\u00e7lydyr. Hormatly Prezidentimiz t\u00fcrkmen
  halkyna parahat\u00e7ylyga bu\u00fdsanyp \u00fda\u015famak bagtyny, bagty\u00fdar
  durmu\u015fy bagy\u015f etdi.\\nT\u00fcrkmenistany\u0148 jemgy\u00fdet\u00e7ilik-sy\u00fdasy
  ulgamda, halkara gatna\u015fyklarynda, halky\u0148 \u00fda\u015fa\u00fdy\u015f durmu\u015fyny
  \u00f6sd\u00fcrmekde, ykdysady\u00fdetde, medeni\u00fdetde, ylym-bilim, saglygy
  gora\u00fdy\u015f, sport ulgamlarynda \u00fdeten belent derejesi milli Liderimizi\u0148
  parahat\u00e7ylyga g\u00f6n\u00fckdirilen sy\u00fdasatyny\u0148 g\u00f6s-g\u00f6ni
  netijesidir. Hyzmatda\u015flygy we gatna\u015fyklary hemmetarapla\u00fdyn dogry
  guramagy ba\u015farandygyny\u0148 aja\u00fdyp miwesidir.\\n\u00d6z wagtynda, \u00e7alt
  depginde d\u00f6redilen ykdysady \u00f6n\u00fcm\u00e7ilik d\u00fcz\u00fcmleri, amala
  a\u015fyrylan \u00e4girt uly halkara derejeli ykdysady taslamalar bir hakykaty anyk
  \u00fd\u00fcze \u00e7ykar\u00fdar, hormatly Prezidentimizi\u0148 h\u00e4zirki d\u00f6wr\u00fc\u0148
  d\u00f6wlet Ba\u015ftutany h\u00f6km\u00fcnd\u00e4ki taryhy ornuny\u0148 ha\u00fdsy
  tarapdan alany\u0148da-da bim\u00f6\u00e7ber uludygyny a\u00fdan ed\u00fd\u00e4r.
  \u00ddurdu\u0148 Prezidenti h\u00f6km\u00fcnde \u00f6s\u00fc\u015fleri \u00fcpj\u00fcn
  etmekden, durmu\u015f-ykdysady meseleleri \u00e7\u00f6zmekden ba\u015fga-da, halky\u0148
  we d\u00fcn\u00fd\u00e4 jemgy\u00fdet\u00e7iligini\u0148 \u00f6\u0148\u00fcnde il
  b\u00e4hbitli belent maksatlar, d\u00fcn\u00fd\u00e4 \u00e4hmi\u00fdetli ba\u015flangy\u00e7lar
  babatda o\u0148yn gara\u00fdy\u015flary\u0148 d\u00f6remegini, goldawa e\u00fde
  bolmagyny gazanmak \u00fc\u00e7in uly zehini\u0148, \u00e7u\u0148 pa\u00fdhasy\u0148,
  sabyr takatlylygy\u0148 we gi\u0148 d\u00fcn\u00fd\u00e4gara\u00fd\u015fy\u0148
  zerurlygyny d\u00f6w\u00fcr \u00f6r\u00e4n takyk g\u00f6rkez\u00fd\u00e4r. \u00c7\u00fcnki
  h\u00e4zirki d\u00f6w\u00fcrde d\u00fcn\u00fd\u00e4 \u00fdagda\u00fdlary \u00e7yl\u015fyrymly
  bolmagynda gal\u00fdar. Halkara gi\u0148i\u015fliginde b\u00e4hbit aramak me\u00fdilleri
  de\u0148hukukly, \u00f6zara b\u00e4hbitli gatna\u015fyklary guramakda \u00e7\u00f6zmesi
  a\u0148sat bolmadyk meseleleri \u00fd\u00fcze \u00e7ykar\u00fdar. Ykdysady integrasi\u00fdany\u0148
  g\u00fc\u00fd\u00e7lenmegi, \u00fdurtlary\u0148 durmu\u015f-ykdysady, mali\u00fde,
  ma\u00fdago\u00fdumlar babatda bir-birine baglylygyny\u0148 artmagy netijesinde,
  \u00f6s\u00fc\u015f meselelerini \u00e7\u00f6zmek, global ykdysady\u00fdeti\u0148
  durnuklylygyny saklamak \u00fdaly wajyp wezipelerde tagallalary\u0148 umumyla\u015fmagy
  d\u00f6wr\u00fc\u0148 talaby bolup orta \u00e7yk\u00fdar. \u015ee\u00fdle talaplary
  g\u00f6z \u00f6\u0148\u00fcnde tutup, d\u00fcn\u00fd\u00e4ni\u0148 ykdysady gatna\u015fyklaryny\u0148
  hatarynda \u00fdurdumyzy\u0148 \u00e4hlumumy \u00f6s\u00fc\u015fi\u0148 meselelerini
  \u00e7\u00f6zm\u00e4ge gatna\u015fmagy babatda umumadamzat b\u00e4hbitli ba\u015flangy\u00e7lar
  bilen \u00e7yky\u015f ed\u00fd\u00e4n, bu ugurda \u00e4girt uly maksatnamalary durmu\u015fa
  ge\u00e7ir\u00fd\u00e4n milli Liderimizi\u0148 g\u00f6rn\u00fckli sy\u00fdasat\u00e7y,
  \u00f6\u0148deng\u00f6r\u00fcji d\u00f6wlet Ba\u015ftutany h\u00f6km\u00fcnd\u00e4ki
  orny g\u00fcrr\u00fc\u0148siz uludyr.\\nHormatly Prezidentimiz \u00f6z\u00fcni\u0148
  \u00abT\u00fcrkmenistan durnukly \u00f6s\u00fc\u015fi\u0148 maksatlaryna \u00fdetmegi\u0148
  \u00fdolunda\u00bb atly kitabynda \u00fdurdu\u0148 ykdysady\u00fdetini\u0148 durnukly
  \u00f6s\u00fc\u015fini we onu\u0148 gurlu\u015fynda hil ta\u00fddan \u00f6\u0148e
  ilerlemegi, \u015fe\u00fdle hem t\u00fcrkmenistanlylary\u0148 \u00fda\u015fa\u00fdy\u015f-durmu\u015fyny
  d\u00fc\u00fdpli \u00f6zgertmegi, ony \u00f6l\u00e7\u00e4p bolmajak has \u00fdokary
  derej\u00e4 \u00e7ykarmagy \u00fcpj\u00fcn etm\u00e4ge \u00fdardam berjek iri milli
  taslamalary\u0148 \u00fcst\u00fcnlikli durmu\u015fa ge\u00e7irilendigini bell\u00e4p
  ge\u00e7\u00fd\u00e4r. Olary\u0148 hatarynda \u00abAwaza\u00bb milli sy\u00fdahat\u00e7ylyk
  zolagyny \u00fdokary derejede \u00f6sd\u00fcrmek, Gazagystan \u2014 T\u00fcrkmenistan
  \u2014 E\u00fdran transmilli demir \u00fdol magistraly, Serhetabat \u2014 Turgundy
  demir \u00fdoly, Amyder\u00fdany\u0148 \u00fcst\u00fcnden ge\u00e7\u00fd\u00e4n
  awtomobil we demir \u00fdol k\u00f6pr\u00fcleri, A\u015fgabat, T\u00fcrkmenba\u015fy,
  T\u00fcrkmenabat \u015f\u00e4herlerind\u00e4ki halkara howa menzilleri, T\u00fcrkmenba\u015fy
  Halkara de\u0148iz porty, T\u00fcrkmenistan \u2014 \u00d6zbegistan \u2014 Gazagystan
  \u2014 Hyta\u00fd, T\u00fcrkmenistan\u2014E\u00fdran, G\u00fcndogar \u2014 G\u00fcnbatar
  gaz ge\u00e7irijileri, Mary \u015f\u00e4herind\u00e4ki karbamid zawody, Owadandeped\u00e4ki
  a\u00fdna kombinaty bar. So\u0148ky bir-iki \u00fdylda Garabogaz \u015f\u00e4herind\u00e4ki
  karbamid zawody, Gy\u00fdanlydaky gaz himi\u00fda toplumy, Ahaldaky gazdan benzin
  \u00f6nd\u00fcr\u00fd\u00e4n\\nd\u00fcn\u00fd\u00e4de ilkinji zawod bu desgalary\u0148
  \u00fcst\u00fcni \u00fdetirdi.\\nTeleke\u00e7iligi \u00f6sd\u00fcrmekde, ykdysady\u00fdeti
  senagatla\u015fdyrmakda, sanly ykdysady\u00fdete ge\u00e7mekde h\u00e4zirki d\u00f6w\u00fcrde
  durmu\u015fa ge\u00e7iril\u00fd\u00e4n \u00f6zgertmeler parahat\u00e7ylykly \u00f6s\u00fc\u015fi\u0148
  bizi\u0148 durmu\u015fymyzy hil ta\u00fddan d\u00fc\u00fdpli t\u00e4zele\u00fd\u00e4n,
  \u00f6r\u00e4n derwa\u00fdys maksatnamalardyr. \u00ddurdumyzdaky \u00f6zgeri\u015fler
  asuda \u00f6s\u00fc\u015fi\u0148 ke\u015fbidir. D\u00f6wleti\u0148 we jemgy\u00fdeti\u0148
  \u00e4hli m\u00fcmkin\u00e7iliklerini\u0148 parahat\u00e7ylykly \u00f6s\u00fc\u015fe
  g\u00f6n\u00fckdiril\u00fd\u00e4ndigini\u0148 alamatydyr. Ha\u00fdsy bir ugry alsa\u0148,
  her bir i\u015fi\u0148 \u00f6zeninde d\u00f6wlet sy\u00fdasatyny\u0148 ba\u015f
  ugry bolan parahatlyk s\u00f6\u00fd\u00fcji, ynsanperwer maksatlar hemi\u015felik
  Bitarap T\u00fcrkmenistany\u0148 sa\u00fdlap alan \u00fdoluny\u0148 many-mazmunyny
  \u015f\u00f6hlelendirip a\u00fdyl-sa\u00fdyl bolup durandyr. Bizi\u0148 \u00fdurdumyzda
  \u00f6nd\u00fcril\u00fd\u00e4n \u00f6n\u00fcmleri\u0148 hemmesi di\u00fden \u00fdaly
  parahat\u00e7ylykly \u00fda\u015fa\u00fd\u015fy\u0148 seri\u015fdeleridir. Gurul\u00fdan
  \u00e4hli desgalar parahat\u00e7ylykly maksatlara hyzmat etm\u00e4ge ni\u00fdetlenendir.
  \u00ddollarymyz asuda, dostlukly gatna\u015fyklary\u0148 \u00fdoludyr. Asmanymyz
  parahat\u00e7ylykly u\u00e7u\u015flara \u00fdol ber\u00fd\u00e4n gi\u0148i\u015flikdir.
  Munu\u0148 \u00f6zi hemi\u015felik Bitarap T\u00fcrkmenistany\u0148 tut\u00fdan
  \u00fdoludyr, hormatly Prezidentimizi\u0148 \u00fd\u00f6red\u00fd\u00e4n sy\u00fdasatyny\u0148
  \u00fc\u00fdtgewsiz ugrudyr.\\nD\u00f6wlet, jemgy\u00fdet, halk barada pikir edeni\u0148de,
  bu d\u00fc\u015f\u00fcnjeleri bitew\u00fcle\u015fdir\u00fd\u00e4n, jebisle\u015fdir\u00fd\u00e4n
  sy\u00fdasy \u00fd\u00f6relgeleri kemala getirmegi\u0148, d\u00f6wleti\u0148 sy\u00fdasy
  hukuk bin\u00fdatlaryny berkitmegi\u0148 esasy wezipe bolup \u00f6\u0148e \u00e7yk\u00fdandygy
  hakda o\u00fdlan\u00fdarsy\u0148. E\u00fdsem, m\u00e4hriban Arkadagymyzy\u0148 \u00f6zgertmeleri
  yzygiderli amala a\u015fyrmak arkaly has \u00f6sd\u00fcren, berkiden, k\u00e4mille\u015fdiren
  milli demokratik \u00fd\u00f6relgelerini\u0148 a\u00fdratynlygy n\u00e4mede? Bu
  sowaly\u0148 jogabyny T\u00fcrkmenistany\u0148 sy\u00fdasy jemgy\u00fdet\u00e7ilik
  durmu\u015fyny\u0148, halky\u0148 \u00fda\u015fa\u00fd\u015fyny\u0148, ra\u00fdat
  jemgy\u00fdetini\u0148, d\u00f6wletimizi\u0148 \u00f6s\u00fc\u015fini\u0148 her
  bir ugrunda g\u00f6rmek m\u00fcmkindir. \u00ddurtda i\u015fje\u0148 hereket ed\u00fd\u00e4n
  demokratik \u00fd\u00f6relgeler, d\u00f6wlet sy\u00fdasatyny\u0148 \u00e4hli maksatlary,
  jemgy\u00fdet\u00e7ilik a\u0148yna t\u00e4sir etm\u00e4ge g\u00f6n\u00fckdiril\u00fd\u00e4n
  wagyz-nesihat, medeni-k\u00f6p\u00e7\u00fclik i\u015fleri esasy maksada \u2014 \u00abD\u00f6wlet
  adam \u00fc\u00e7indir!\u00bb di\u00fden maksatnamala\u00fdyn \u00fd\u00f6relg\u00e4
  hyzmat ed\u00fd\u00e4r. Tagallalary bir maksada g\u00f6n\u00fckdirip, umumyhalk
  b\u00e4hbitlerini g\u00f6z \u00f6\u0148\u00fcnde tut\u00fdan demokratik ulgamy d\u00f6retmek
  h\u00e4zirki d\u00f6w\u00fcrde asla \u00fde\u0148il wezipe d\u00e4l. \u00c7\u00fcnki
  jemgy\u00fdet bir galypdan ybarat d\u00fc\u015f\u00fcnjeleri\u0148 \u00e7ygrynda
  hereket etmekden has \u00e7yl\u015fyrymla\u015fdy. Aragatna\u015fyk tehnologi\u00fdasyny\u0148
  \u00f6sen derejesinde, adamlary\u0148 habarlylygyny\u0148 artmagy, jemgy\u00fdet\u00e7ilik
  gatna\u015fyklarynda d\u00fcrli \u00f6s\u00fc\u015f \u00fd\u00f6relgeleri (mysal
  \u00fc\u00e7in, hususy i\u015few\u00fcrlik) netijesinde \u00fd\u00fcze \u00e7yk\u00fdan
  \u00f6zgeri\u015fler jemgy\u00fdeti\u0148 a\u0148y\u00fdet \u00f6s\u00fc\u015fine
  t\u00e4sir ed\u00fd\u00e4r. D\u00fcrli pikirler, d\u00fcrli gara\u00fdy\u015flar
  jemgy\u00fdet\u00e7ilik a\u0148yny\u0148 k\u00f6ptaraplylygyna getir\u00fd\u00e4r.
  \u015eol k\u00f6ptaraplylygy d\u00f6wleti\u0148, halky\u0148 b\u00e4hbitlerine,
  \u00fdurdu\u0148 geljegine g\u00f6n\u00fckdirmek bilen, hormatly Prezidentimiz d\u00fcrli
  gara\u00fdy\u015flary\u0148 bir akabada, \u00fdagny d\u00f6wletimizi\u0148 halky\u0148
  bagty\u00fdar durmu\u015fyny \u00fcpj\u00fcn etmegi nazarla\u00fdan \u00e4girt uly
  \u00f6s\u00fc\u015f maksatnamalaryny\u0148 da\u015fynda jebisle\u015fdirmek \u00fdoly
  bilen, milli demokrati\u00fdany\u0148 d\u00f6wrebap nusgasyny kemala getirmegi ba\u015fardy.
  Ine, bu bolsa t\u00fcrkmen jemgy\u00fdetini\u0148 geljege tarap hereketini\u0148
  ynamly bir ugry bolup orta \u00e7yk\u00fdar. D\u00f6wleti\u0148 demokratik, sy\u00fdasy
  hukuk ulgamy berkararlygy\u0148, d\u00f6wleti\u0148 mizemezligini\u0148 esasy s\u00fct\u00fcnleridir.
  Esasy zat, \u00fdurtda asuda durmu\u015fy, parahat\u00e7ylykly \u00f6s\u00fc\u015fi
  \u00fcpj\u00fcn etmegi\u0148 zerur \u015fertlerini\u0148 biridir. Halkara derejesinde
  ykrar edilen hemi\u015felik Bitaraplygymyzy\u0148 esasy \u00fcst\u00fcnliklerini\u0148
  biri \u00fdurtda sy\u00fdasy durnuklylygy\u0148 gazanylmagydyr. Milli demokrati\u00fdamyz
  durnuklylygy\u0148 nusgasydyr.\\nM\u00e4hriban Arkadagymyzy\u0148 \u00f6\u0148deng\u00f6r\u00fcjilik
  bilen alyp bar\u00fdan sy\u00fdasatyny\u0148 umumadamzat b\u00e4hbitli \u00e7u\u0148\u0148ur
  manysyny wagt barha \u00e4\u015fg\u00e4r we a\u00fddy\u0148 \u00fd\u00fcze \u00e7ykar\u00fdar.
  T\u00fcrkmen d\u00f6wletini\u0148 parahat\u00e7ylykly \u00f6s\u00fc\u015fe g\u00f6n\u00fckdirilen
  Bitaraplyk sy\u00fdasatyny\u0148 d\u00f6w\u00fcr \u00fc\u00e7in \u00e4hmi\u00fdeti
  \u00e7yl\u015fyrymly pursatlarda k\u00f6p \u00fdagda\u00fdlara d\u00fc\u00fdpli
  d\u00fc\u015f\u00fcnm\u00e4ge m\u00fcmkin\u00e7ilik ber\u00fd\u00e4r. Hormatly Prezidentimiz:
  \u00abMen \u00fdag\u015fy ni\u00fdeti\u0148 \u00e4girt uly g\u00fc\u00fd\u00e7d\u00fcgine
  ynan\u00fdaryn\u00bb di\u00fdip, \u00abParahat\u00e7ylyk sazy, dostluk, doganlyk
  sazy\u00bb atly kitabynda \u00fdaz\u00fdar. M\u00e4hriban Arkadagymyz d\u00fcn\u00fd\u00e4
  \u00fc\u00e7in \u00fdag\u015fy ni\u00fdeti\u0148 i\u0148 uly zerurlykdygyna \u00f6\u0148deng\u00f6r\u00fcjilik
  bilen \u00e7u\u0148 g\u00f6z \u00fdetiren g\u00f6rn\u00fckli sy\u00fdasat\u00e7ydyr.
  Milli Liderimiz: \u00abAdamzat h\u00e4zir \u00f6r\u00e4n uly howpu\u0148 \u00f6\u0148\u00fcnde
  dur. \u00ddary\u015fyp alynjak gala \u00fdok. Ilkiba\u015fda \u015fe\u00fdle \u00e7yl\u015fyrymly
  hem-de bula\u015fyk bolmadyk, \u00fd\u00f6ne so\u0148ra ugry idelmedik gapma-gar\u015fylyklary
  \u00e7\u00f6zmek \u00fc\u00e7in geple\u015fikleri ge\u00e7irmegi\u0148 wagty \u00fdetip
  geldi.\\nBizi\u0148 ylymly-bilimli, \u00fdokary tehnologi\u00fdaly d\u00f6wr\u00fcmizde
  adamzat durmu\u015fyny\u0148 agyr nogsanlyklaryna \u00f6wr\u00fclen garyplygy\u0148
  we a\u00e7lygy\u0148 \u00fdoguna \u00e7ykmak \u00fc\u00e7in birle\u015fmegi\u0148
  wagty \u00fdetip geldi.\\nEkologi\u00fda hel\u00e4k\u00e7iliklerini\u0148 we keselleri\u0148
  \u00fda\u00fdramagyny\u0148 \u00f6\u0148\u00fcni almagy\u0148 \u00fdollaryny bilelikde
  g\u00f6zlemegi\u0148 wagty \u00fdetip geldi\u00bb di\u00fdip bell\u00e4p ge\u00e7di.
  D\u00fcn\u00fd\u00e4de \u00fd\u00fcze \u00e7ykan h\u00e4zirki \u00fdagda\u00fdlar,
  k\u00f6p \u00fdurda \u00fda\u00fdran \u00fdokan\u00e7 kesel we kesel bilen bagly
  d\u00fcn\u00fd\u00e4 ykdysady\u00fdetini\u0148 pese d\u00fc\u015fmegi m\u00e4hriban
  Arkadagymyzy\u0148 j\u00f6wher pa\u00fdhasy bilen \u00fdazan bu pikirlerini\u0148
  n\u00e4hili derejede hakykaty a\u00fdan ed\u00fd\u00e4ndigini g\u00f6rkez\u00fd\u00e4r.
  H\u00e4zirki d\u00f6w\u00fcr \u00e4hli halklary\u0148 abadan geljek ugrunda, nesilleri\u0148
  bagty\u00fdarlygyny\u0148 hatyrasyna birle\u015fmegini\u0148, arkala\u015fmagyny\u0148,
  \u00fdakyndan hyzmatda\u015flyk etmegini\u0148 \u00f6r\u00e4n m\u00f6h\u00fcmdigini,
  derwa\u00fdysdygyny, wajypdygyny \u00e4\u015fg\u00e4r ed\u00fd\u00e4r. D\u00fcn\u00fd\u00e4ni
  halas etjegi\u0148 \u00fdag\u015fy ni\u00fdet bolup dur\u00fdanlygyny subut ed\u00fd\u00e4r.\\n\u015eu
  \u00fdyl hemi\u015felik Bitaraplygymyzy\u0148 25 \u00fdyllyk ba\u00fdramyny\u0148
  bellenmegi \u00fdurdumyzda parahat\u00e7ylygy\u0148, ynsanperwerligi\u0148 dabaralanmagydyr.
  Hemi\u015felik Bitaraplyk gapma-gar\u015fylyklary, uru\u015flary ret ed\u00fd\u00e4n,
  d\u00fcn\u00fd\u00e4ni\u0148 geljegini\u0148 ynany\u015fmakdadygyny, dost-doganlykdadygyny
  b\u00fctin adamzada \u00fcnde\u00fd\u00e4n mukaddes d\u00fc\u015f\u00fcnjedir. Hemi\u015felik
  Bitaraplyk berkarar T\u00fcrkmen d\u00f6wletini\u0148, m\u00e4hriban Arkadagymyzy\u0148
  alyp bar\u00fdan d\u00fcn\u00fd\u00e4 \u00e4hmi\u00fdetli sy\u00fdasy \u00fdoludyr.\\n\u00d6z
  halkyna ruhubelentligi\u0148, mertligi\u0148, ga\u00fdratlylygy\u0148 nusgasyny
  g\u00f6rkezip, geljege be\u00fdik ynam bilen gara\u00fdan Gahryman Arkadagymyza
  hemi\u015fe \u015fowlulyklary\u0148 \u00fdar bolmagyny, r\u00f6w\u015fen \u00f6mr\u00fcni\u0148
  uzak, belent ba\u015fyny\u0148 aman bolmagyny ak \u00fd\u00fcrekden arzuw ed\u00fd\u00e4ris.\\nAta
  SERDAROW,\\nT\u00fcrkmenistany\u0148 Demokratik parti\u00fdasyny\u0148 ba\u015flygy.\\nMejlisi\u0148
  deputaty.\"", "\"Halyq Qaharmany, general-le\u0131tenant Baqytjan Ertaev t\u00e1\u00fdelsiz
  elimizdi\u0144 Qar\u00fdly K\u00fashterini\u0144 qalyptas\u00fdyna qomaqty \u00fales
  qosyp keledi. B\u00faginde Parlament M\u00e1jilisini\u0144 dep\u00fdtaty bolyp qyzmet
  etetin el a\u01f5asymen mereke qarsa\u0144ynda qazirgi qazaq arm\u0131\u0131asyny\u0144
  \u00e1le\u00fdeti j\u00f3ninde \u00e1\u0144gimelesken edik.\\n\u2013 B\u0131yl Qazaqstan
  Qar\u00fdly K\u00fashterini\u0144 quryl\u01f5anyna 28 jyl tolyp otyr. Osy \u00fdaqyt
  araly\u01f5ynda qazaq arm\u0131\u0131asyny\u0144 \u00e1le\u00fdeti qanshalyqty k\u00fashe\u0131di?\\n\u2013
  Bizdi\u0144 b\u00fdyn Qazaqstanny\u0144 Qar\u00fdly K\u00fashterin qur\u00fd j\u00e1ne
  a\u0131a\u01f5ynan nyq tur\u01f5yz\u00fd ba\u01f5ytynda atqaryl\u01f5an orasan jumysqa
  k\u00fd\u00e1 boldy j\u00e1ne osy ja\u00fdapty proseske tikele\u0131 aralasty. K\u00f3ptegen
  m\u00e1sele tez arada shesh\u00fddi j\u00e1ne reformala\u00fddy talap etti. A\u0131talyq
  Qar\u00fdly K\u00fashterdi\u0144 qurylymyn anyqta\u00fd, \u00e1skerlerdi tehn\u0131kalyq
  jaraqtandyr\u00fd, \u00e1sker\u0131 bilim ber\u00fd j\u00fa\u0131esin qur\u00fd,
  \u00e1sker\u0131 qyzmetshini\u0144 berik \u00e1le\u00fdmettik paketin qalyptastyr\u00fd,
  \u00e1sker\u0131 \u01f5ylym men jeke tehnolog\u0131\u0131alardy damyt\u00fd, halyqaralyq
  \u00e1sker\u0131 yntymaqtastyq j\u00e1ne basqa da m\u00e1seleler.\\nElimiz t\u00e1\u00fdelsizdik
  al\u01f5annan bergi keze\u0144de k\u00e1sib\u0131 \u00e1sker\u0131 kadrlarmen, zamana\u00fd\u0131
  qar\u00fd-jaraqpen j\u00e1ne \u00e1sker\u0131 tehn\u0131kamen jabdyqtal\u01f5an,
  mob\u0131ldi b\u00f3limsheleri qalyptasqan, tolyqqandy, ja\u00fdyngerlik qabiletti
  arm\u0131\u0131a qur\u00fd \u2013 \u00f3te \u00falken e\u0144bek. B\u00faginde b\u00fakil
  \u00e1lemde bizdi\u0144 eldi tabysty j\u00e1ne qarqyndy damyp kele jatqan memleket
  retinde biledi. Qazaqstan \u00e1skeri de tola\u01f5a\u0131 tabystar\u01f5a qol jetkizdi.
  Bul \u2013 Qazaqstanny\u0144 Tu\u0144\u01f5ysh Prez\u0131dentini\u0144 k\u00f3regen
  sheshimderi men qazirgi \u00e1sker\u0131-sa\u0131as\u0131 basshylyq jumysyny\u0144
  n\u00e1t\u0131jesi.\\nBizdi\u0144 arm\u0131\u0131any\u0144 aldynda tur\u01f5an mindetter
  tolyq k\u00f3lemde oryndalyp, ja\u00fdyngerlik da\u0131arlyq pen eldi\u0144 qor\u01f5anysy
  qajetti de\u0144ge\u0131de qamtamasyz etildi. Bizdi\u0144 b\u00f3limsheler BUU-ny\u0144
  L\u0131vanda\u01f5y bitimgershilik m\u0131ss\u0131\u0131asyna, el ishindegi j\u00e1ne
  basqa da memleketterdi\u0144 a\u00fdma\u01f5ynda\u01f5y halyqaralyq \u00e1sker\u0131
  manevrlerge qatysyp keledi. Qar\u00fdly K\u00fashterdi\u0144 dam\u00fdy turalap
  qal\u01f5an emes. \u00c1skerlerdi\u0144 k\u00fandelikti qyzmetine birtindep ja\u0144a
  tehnolog\u0131\u0131alardy engizip jatyr. Geoaqparattyq tehnolog\u0131\u0131alar,
  robottehn\u0131ka, k\u0131berqa\u00fdipsizdik, avtomattandyryl\u01f5an basqar\u00fd
  j\u00fa\u0131esi j\u00e1ne ushqyshsyz av\u0131as\u0131\u0131a s\u0131\u0131aqty
  ja\u0144ashyldyq t\u00e1\u00fdelsizdikti\u0144 al\u01f5ashqy jyldary arman edi.
  Al qazir muny\u0144 b\u00e1ri \u2013 b\u00fagingi arm\u0131\u0131amyzdy\u0144 bir
  ereksheligi. Jyl sa\u0131yn \u00e1sker\u0131-tehn\u0131kalyq \u00e1le\u00fdetti
  arttyr\u00fd, \u00e1sker\u0131 qyzmetshiler men olardy\u0144 otbasy m\u00fashelerini\u0144
  \u00e1le\u00fdmettik-turmystyq j\u00e1ne tur\u01f5yn \u00fa\u0131 ja\u01f5da\u0131laryn
  jaqsart\u00fd, \u00e1sker\u0131 qalashyqtar men garn\u0131zondardy\u0144 \u0131nfraqurylymyn
  damyt\u00fd j\u00f3nindegi m\u00e1selelerdi shesh\u00fdge \u00e1jept\u00e1\u00fdir
  qarjy b\u00f3linedi.\\n\u2013 \u00c1lem elderini\u0144 \u00e1sker\u0131 q\u00fdatyn
  ba\u01f5amda\u0131tyn Global FirePower-di\u0144 2020 jyl\u01f5y re\u0131t\u0131nginde
  Qazaqstan 138 memleketti\u0144 ishinen 63-orynnan k\u00f3rindi. Byltyr 54-oryn\u01f5a
  turaqta\u01f5an edik. Bul k\u00f3rsetkish nege t\u00f3mendedi dep o\u0131la\u0131syz?\\n\u2013
  Global Fire Power re\u0131t\u0131ngin t\u00fazgen sarapshylar memleketterdi\u0144
  \u00e1sker\u0131 q\u00fdatyn salystyr\u00fd \u00fashin 50 t\u00farli faktor bo\u0131ynsha
  ba\u01f5ala\u00fd \u00e1distemesin pa\u0131dalanady. Re\u0131t\u0131ng qorytyndysyn
  shy\u01f5ararda qor\u01f5anys b\u0131\u00fddjeti, \u00e1sker sany, \u00e1sker\u0131
  tehn\u0131ka men qar\u00fd-jaraq k\u00f3lemi, \u00e1sker t\u00farleri, memleketti\u0144
  geograf\u0131\u0131alyq erekshelikteri eskeriledi.\\nMunda\u0131 re\u0131t\u0131ngter
  t\u00fdraly \u00e1rt\u00farli pikirler kezdesedi. Birinshi kezekte aqparat k\u00f3zini\u0144
  obekt\u0131vtiligi men shyna\u0131yly\u01f5y suraq t\u00fddyrady. K\u00f3binese
  olar \u0131nternette jar\u0131\u0131alan\u01f5an mater\u0131aldar men ashyq derekk\u00f3zderdi
  pa\u0131dalanady. Sondyqtan re\u0131t\u0131ng jasa\u01f5anda negizdelgen derekter
  tolyq bolma\u00fdy m\u00famkin. \u00c1sker\u0131 iste sarapshylar munda\u0131 qorytyndylar\u01f5a
  s\u00fa\u0131enbe\u0131di. Bastysy, bizdi\u0144 arm\u0131\u0131amyz jospar\u01f5a
  s\u00e1\u0131kes turaqty damyp kele jatyr, elimizdi qapysyz qor\u01f5a\u00fd\u01f5a
  qashanda da\u0131yn.\\n\u2013 Arysta\u01f5y arsenaldy\u0144 jaryl\u00fdynan qanda\u0131
  sabaq aldyq? Alda osynda\u0131 t\u00f3tenshe oq\u0131\u01f5alardy boldyrma\u00fd
  \u00fashin qanda\u0131 shar\u00fda atqarylyp jatyr?\\n\u2013 Arys qalasynda\u01f5y
  apatqa bir jyl\u01f5a j\u00fdyq \u00fdaqyt boldy. B\u00faginge de\u0131in t\u00f3tenshe
  ja\u01f5da\u0131 saldaryn jo\u0131\u00fd bo\u0131ynsha qurama jasaq jumysyn jal\u01f5astyr\u00fdda.
  \u00c1sker\u0131 qyzmetshiler a\u00fdmaqqa zertte\u00fd j\u00fargizip, qo\u0131ma
  ma\u0144a\u0131ynda\u01f5y fragmentterdi izdestirip jatyr. Metall synyqtaryn tazala\u00fd,
  surypta\u00fd j\u00e1ne arna\u0131y jabdyqtal\u01f5an ala\u0144\u01f5a shy\u01f5ar\u00fd,
  tehn\u0131kalyq a\u00fdmaqty tazala\u00fd, \u0131njenerlik oq-d\u00e1rilerdi t\u00fagende\u00fd
  jumystary j\u00fargizil\u00fdde. Jergilikti tur\u01f5yndardy\u0144 \u00f3tinishterine
  ja\u00fdap beretin mob\u0131ldik top buryn\u01f5ysynsha kezekshilik etedi.\\nOsynda\u0131
  t\u00e1\u00fdekelderdi barynsha aza\u0131t\u00fddy\u0144 ma\u0144yzdy b\u00f3ligi
  \u2013 oq-d\u00e1rilerdi shy\u01f5ar\u00fd j\u00e1ne basqa qo\u0131malarda birkelki
  ornalastyr\u00fd. Bu\u01f5an \u00f3tken jyldy\u0144 ma\u00fdsym a\u0131ynan bastap
  basymdyq berilip, arna\u0131y k\u00fash jumyldyryldy.\\n\u2013 Indet qa\u00fdpi
  t\u00f3nip tur\u01f5an shaqta Qar\u00fdly K\u00fashterdi\u0144 Bas shtabynda \u00abRad\u0131as\u0131\u0131alyq,
  h\u0131m\u0131\u0131alyq, b\u0131olog\u0131\u0131alyq qor\u01f5anys j\u00e1ne ekolog\u0131\u0131alyq
  qa\u00fdipsizdik departamenti\u00bb de\u0131tin ja\u0144a qurylym jasaqtaldy. Bul
  bastamany\u0144 t\u0131imdi tustaryn a\u0131typ bere alasyz ba?\\n\u2013 Koronav\u0131r\u00fds
  pandem\u0131\u0131asy rad\u0131as\u0131\u0131alyq, h\u0131m\u0131\u0131alyq j\u00e1ne
  b\u0131olog\u0131\u0131alyq qor\u01f5a\u00fd b\u00f3limshelerini\u0144 qanda\u0131
  ma\u0144yzy bar ekenin k\u00f3rsetti. Osy rette Qar\u00fdly K\u00fashterde ja\u0144a
  departament qur\u00fd t\u00fdraly sheshim qabyldandy. Bul \u2013 qazirgi zaman\u01f5y
  qa\u00fdip-qaterlerdi, \u00e1skerlerdi\u0144 m\u00famkindikterin j\u00e1ne \u00e1lemni\u0144
  jetekshi elderini\u0144 qor\u01f5anys-\u00f3nerk\u00e1siptik keshenini\u0144 dam\u00fd
  \u00fardisterin eskere otyryp, rad\u0131as\u0131\u0131alyq, h\u0131m\u0131\u0131alyq,
  b\u0131olog\u0131\u0131alyq qor\u01f5a\u00fd mindetteri j\u00fakteletin jeke, ja\u0144a
  qurylymdyq b\u00f3limshe.\\nV\u0131r\u00fdsty\u0144 taral\u00fdyna qarsy k\u00fareske
  \u00e1sker\u0131 b\u00f3limsheler al\u01f5ashqy k\u00fannen bastap kiristi. Qar\u00fdly
  K\u00fashterdi\u0144 arna\u0131y otr\u0131adtary 22 eldi mekende jalpy k\u00f3lemi
  43 mln sharshy metrden asatyn obektiler men joldardy zararsyzdandyrdy. Bu\u01f5an
  qosa \u00e1rt\u00farli b\u00f3limsheler \u00f3z \u00e1sker\u0131 qyzmetini\u0144
  ba\u01f5ytyna qaramastan qo\u01f5amdyq t\u00e1rtipti qamtamasyz et\u00fdmen a\u0131nalys\u00fdda,
  \u00e1sker\u0131 av\u0131as\u0131\u0131a shetelden otandastarymyzdy evak\u00fdas\u0131\u0131alady,
  \u00e1sker\u0131 med\u0131s\u0131na halyqty\u0144 densa\u00fdly\u01f5yn qor\u01f5a\u00fd\u01f5a
  atsalysyp jatyr.\\n\u2013 Memleket basshysy halyqqa Jolda\u00fdynda tege\u00fdrindi
  \u00e1sker qalyptastyr\u00fd mindetine basymdyq berdi. Bul rette qanda\u0131 jumys
  qol\u01f5a alyndy j\u00e1ne Parlamentte arna\u0131y ba\u01f5darlamalyq qujattar
  qaralyp jatyr ma?\\n\u2013 Prez\u0131dent Qasym-Jomart Toqaev arm\u0131\u0131any
  t\u0131imdi j\u00e1ne b\u00e1sekege qabiletti qar\u00fd-jaraqpen qamtamasyz et\u00fddi,
  \u00e1sker\u0131 bilim ber\u00fd sapasyn arttyr\u00fddy j\u00e1ne halyqaralyq \u00e1sker\u0131-tehn\u0131kalyq
  yntymaqtastyqty ny\u01f5a\u0131t\u00fddy tapsyrdy. Sonda\u0131-aq oq-d\u00e1rilerdi
  saqta\u00fd \u0131nfraqurylymyn jetildir\u00fdge nazar a\u00fddar\u00fd qajet ekenin
  atap \u00f3tti.\\n\u00c1skerdi qa\u0131ta jaraqtandyr\u00fd \u2013 bul k\u00fardeli
  j\u00e1ne \u00e1jept\u00e1\u00fdir uzaq prosess. Bul \u00e1skerdi\u0144 qajetine
  j\u00e1ne eldi\u0144 ekonom\u0131kalyq \u00e1le\u00fdetine qara\u0131 iske asady.
  So\u0144\u01f5y jyldary Qar\u00fdly K\u00fashterge zamana\u00fd\u0131 k\u00f3pf\u00fdnks\u0131onaldy
  jo\u0131\u01f5yshtar, tikushaqtar, ushqyshsyz ush\u00fd apparattary, ja\u00fdyngerlik
  kemeler \u00e1kelinip jatyr. \u00c1\u00fde k\u00f3likterin toptastyr\u00fd a\u0131tarlyqta\u0131
  k\u00fashe\u0131tildi. Bul el a\u00fdma\u01f5yny\u0144 a\u00fddanyn eskere otyryp,
  \u00e1skerlerdi batystan shy\u01f5ysqa j\u00e1ne ta\u01f5y basqa ba\u01f5ytta jedel
  k\u00f3shir\u00fd qajet bol\u01f5an kezde ma\u0144yzdy r\u00f3l atqarady. \u041e\u0301miri
  men densa\u00fdly\u01f5yna qa\u00fdipti mindetterdi orynda\u0131tyn \u00e1sker\u0131
  qyzmetshilerdi\u0144 qa\u00fdipsizdigin qamtamasyz et\u00fdge septesetin robototehn\u0131kalyq
  keshender dam\u00fdda.\\nSonda\u0131-aq otandyq k\u00e1siporyndar arqyly qolda bar
  tehn\u0131kany k\u00fardeli j\u00f3nde\u00fd j\u00e1ne ja\u0144\u01f5yrt\u00fd jumystary
  j\u00fargiziledi.\\n\u2013 Qazirgi kezde halyqaralyq \u00e1sker\u0131 yntymaqtastyqty
  damyt\u00fd bo\u0131ynsha qanda\u0131 jumys j\u00fargizil\u00fdde?\\n\u2013 Halyqaralyq
  \u00e1sker\u0131 yntymaqtastyqty\u0144 maqsaty \u2013 memleketti\u0144 \u00e1sker\u0131
  qa\u00fdipsizdigin qamtamasyz et\u00fd j\u00e1ne ony\u0144 ulttyq m\u00faddelerin
  qor\u01f5a\u00fd \u00fashin qajetti ja\u01f5da\u0131lar jasa\u00fd, sonda\u0131-aq
  halyqaralyq j\u00e1ne ulttyq qa\u00fdipsizdikti qamtamasyz et\u00fd \u00fashin basqa
  eldermen \u00f3zara is-q\u0131myldy ny\u01f5a\u0131t\u00fd. Qazaqstan bul yntymaqtastyqty
  ekijaqty qarym-qatynastar konteksinde j\u00e1ne BUU, EQYU, A\u041e\u0301SShK, UQShU,
  ShYU, TMD, NATO s\u0131\u0131aqty halyqaralyq j\u00e1ne \u00f3\u0144irlik u\u0131ymdar\u01f5a
  qatys\u00fd arqyly j\u00fazege asyrady. Memleketti\u0144 \u00e1sker\u0131 qa\u00fdipsizdigin
  qamtamasyz et\u00fd mindetterin orynda\u00fd \u00fashin k\u00f3pvektorly syrtqy
  sa\u0131asat, pragmat\u0131zm, syrtqy sa\u0131as\u0131 j\u00e1ne ekonom\u0131kalyq
  maqsat qa\u01f5\u0131dattaryn saqta\u00fd ma\u0144yzdy.\\nUQShU formatynda\u01f5y
  negizgi ba\u01f5yttar \u2013 jedel den qo\u0131\u00fddy\u0144 ujymdyq k\u00fashterin
  damyt\u00fd, kadrlar da\u0131arla\u00fd j\u00e1ne \u00e1sker\u0131-tehn\u0131kalyq
  yntymaqtastyq. Al TMD formatynda bizdi\u0144 Qar\u00fdly K\u00fashter qyzy\u01f5\u00fdshylyq
  tanytqan salalarda\u01f5y k\u00f3pjaqty \u00e1sker\u0131 yntymaqtastyqqa m\u00e1n
  berilse, Shanha\u0131 Yntymaqtastyq U\u0131ymymen yntymaqtastyqta jalpy \u00e1sker\u0131-sa\u0131as\u0131
  basymdyqtar men birlesken terror\u0131zmge qarsy da\u0131arlyq m\u00e1seleleri nazar\u01f5a
  alynady.\\nE\u00fdropada\u01f5y qa\u00fdipsizdik j\u00e1ne yntymaqtastyq u\u0131ymymen
  \u00f3zara is-q\u0131myl birqatar halyqaralyq qujattar men kelisimder she\u0144berinde
  j\u00fazege asyrylady. Bul \u2013 2011 jyl\u01f5y Vena qujaty j\u00e1ne E\u00fdropada\u01f5y
  \u00e1dettegi Qar\u00fdly K\u00fashter t\u00fdraly shart bo\u0131ynsha jyl sa\u0131yn\u01f5y
  \u00e1sker\u0131 aqparatpen almas\u00fd, EQYU-ny\u0144 je\u0144il j\u00e1ne atys
  qar\u00fdy t\u00fdraly qujaty, qa\u00fdipsizdikti\u0144 \u00e1sker\u0131-sa\u0131as\u0131
  aspektilerine qatysty minez-qulyq kodeksi, EQYU-ny\u0144 kedergige qarsy m\u0131nalar
  bo\u0131ynsha sura\u01f5y j\u00e1ne basqalar. Turaqty t\u00farde u\u0131ym\u01f5a
  qatys\u00fdshy elder \u00f3zara \u0131nspeks\u0131\u0131alar j\u00fargizedi.\\nNATO-men
  yntymaqtastyq she\u0144berinde Qazaqstan \u00abBe\u0131bitshilik jolynda\u01f5y
  \u00e1riptestik\u00bb ba\u01f5darlamasyny\u0144 qatys\u00fdshysy bolyp tabylady.
  Bul birlesken oq\u00fd-jatty\u01f5\u00fdlar\u01f5a qatys\u00fd, be\u0131bitshilikti
  qolda\u00fd j\u00f3nindegi operas\u0131\u0131alardy j\u00fargiz\u00fdde t\u00e1jir\u0131be
  almas\u00fd s\u0131\u0131aqty is-sharalar arqyly ulttyq bitimgershilik \u00e1le\u00fdetin
  damyt\u00fd\u01f5a qyzmet etedi. Ulttyq bitimgershilik \u00e1le\u00fdetin damyt\u00fd
  Qazaqstanny\u0144 BUU Qa\u00fdipsizdik Ke\u0144esine turaqty emes m\u00fasheligi
  she\u0144berinde j\u00fazege asyrylady. Sonymen qatar Halyqaralyq \u00e1sker\u0131
  yntymaqtastyq ekijaqty negizde Rese\u0131men, Qyta\u0131men, Ortalyq Az\u0131\u0131a
  a\u0131ma\u01f5y elderimen, AQSh-pen, EO j\u00e1ne NATO elderimen j\u00fargiziledi.\\n\u2013
  \u00c1\u0144gime\u0144izge rahmet, a\u01f5a. Mereke\u0144iz qutty bolsyn! Qazaq
  arm\u0131\u0131asyny\u0144 a\u0131byny asa bersin!\\n\u2013 S\u00f3z so\u0144ynda
  t\u00e1\u00fdelsiz Qazaqstanny\u0144 shekarasy b\u00fatin, shebi berik bol\u00fdy
  \u00fashin qaltqysyz qyzmet et\u00fdge qashanda da\u0131yn Otan qor\u01f5a\u00fdshylardy
  merekesimen quttyqta\u0131myn. Azamattardy\u0144 otbasyna sa\u00fdlyq, baq-bereke
  tile\u0131min. Elimiz aman, jurtymyz tynysh bolsyn!\\n\u00c1\u0144gimelesken\\nOrynbek
  \u041e\u0301TEMURAT,\\n\u00abEgemen Qazaqstan\u00bb\\nUqsas ja\u0144alyqtar\"",
  "\"SO\u0147KY HABARLAR\\n\u0412 \u0411\u0435\u0440\u043b\u0438\u043d\u0435 \u0441\u043e\u0441\u0442\u043e\u044f\u043b\u043e\u0441\u044c
