  emma bizi\u0148kini bu gezegem unutdylar\u2019 di\u00fdendigini habar berdi. Azatlyk
  mundan la\u00fdyk b\u00e4\u015f \u00fdyl ozal, dini a\u00fdyplamalar esasynda k\u00f6p\u00e7\u00fclikle\u00fdin
  t\u00fcrm\u00e4 basylan adamlar barada ilki aprel a\u00fdynda habar beren bolsa,
  so\u0148 \u00fdapyk \u00fdurdu\u0148 t\u00fcrmesinde \u00fditendigi a\u00fddyl\u00fdan
  adamlar barada her gezek t\u00e4ze maglumat pe\u00fdda bolanda habar berdi, emma
  h\u00e4kimi\u00fdetler ol tussaglary\u0148 k\u00e4birini\u0148 saglyk, \u00f6l\u00fcm
  habarlary barada \u00e7ykan maglumatlary hem ne tassyklady, ne-de ink\u00e4r etdi.\\nT\u00fcrkmenistanda
  din bilen bagly a\u00fdyplamalar di\u00fdlende, t\u00fcrkmen jemgy\u00fdetind\u00e4ki
  \u00fdapyklyk, metbugaty\u0148 bu meselelere a\u00e7yk d\u00fc\u015f\u00fcndiri\u015f
  bermezligi, kazy\u00fdet h\u00f6k\u00fcmlerini\u0148 a\u00fdan edilmezligi zerarly,
  g\u00fcm\u00fcrtik gal\u00fdan \u00fdagda\u00fdlar hem k\u00e4n di\u00fdip, syn\u00e7ylar
  belle\u00fd\u00e4r. Olary\u0148 pikiri\u00e7e, G\u00fclen hereketine simpati\u00fda
  bildirmekde \u00fda onu\u0148 bilen ilte\u015fikli bolmakda g\u00fcman edilen adamlar
  uzyn sakgal go\u00fdberip, merhumy\u0148 \u00fc\u00e7\u00fcni, \u00fdedisini, be\u00fdleki
  belli g\u00fcnlerini bellemeli d\u00e4l di\u00fdip, ozal t\u00fcrkmen jemgy\u00fdetinde
  bolmadyk dini talaplary \u00f6\u0148e s\u00fcr\u00fcp \u00fd\u00f6ren dindarlar
  bilen gary\u015fdyrylma\u00fdar, olar ''d\u00f6wrebap, sowatly, gi\u0148 d\u00fc\u015f\u00fcnjeli,
  jemgy\u00fdetde \u00f6\u0148egidi\u015flige itergi bermek isle\u00fd\u00e4n adamlar''
  hasaplan\u00fdar.\\nAzatlyk radiosy T\u00fcrkmenistanda t\u00fcrk ruhanysy Fethullah
  G\u00fcleni\u0148 hereketi bilen ilte\u015fikli bolmakda g\u00fcman edil\u00fd\u00e4n
  teleke\u00e7ileri\u0148, mugallymlary\u0148 sud edilip, uzak m\u00f6hletle\u00fdin
  t\u00fcrme tussaglygyna h\u00f6k\u00fcm edilendigini ba\u015fda 2017-nji \u00fdyly\u0148
  4-nji aprelinde habar berdi.\\n\u015eonda redaksi\u00fda A\u015fgabady\u0148 \u015f\u00e4her
  kazy\u00fdetini\u0148 h\u00f6k\u00fcmini\u0148 g\u00f6\u00e7\u00fcrmesidigi a\u00fddyl\u00fdan
  dokument gelip gowu\u015fdy we onda i\u015fine seredilen 18 adamy\u0148 jemi 333
  \u00fdyl t\u00fcrme tussaglygyna h\u00f6k\u00fcm edilendigini g\u00f6rse bol\u00fdar.\\n\u201c2017-nji
  \u00fdyly\u0148 fewralynda bu tussaglary\u0148 18 sanysyna jemi 333 \u00fdyl i\u015f
  kesildi, olar \u201csosial, milli, etniki, jynsy we dini du\u015fman\u00e7ylygy
  \u00f6j\u00fckdirmekde\u201d, \u201cjena\u00fdat\u00e7y gurama d\u00f6retmekde we
  onu\u0148 i\u015fine gatna\u015fmakda\u201d a\u00fdyplandy\u201d di\u00fdip, bu
  maglumaty \u00f6z wagtynda \u201cThe Diplomat\u201d ne\u015firi hem tassyklady.\\nT\u00fcrkmenistandaky
  \u00fdanamalary\u0148 \u00e7\u00e4ginde tussag edilen adamlary\u0148 ykbaly gola\u00fdda,
  AB\u015e-ny\u0148 Halkara din azatlygy komissi\u00fdasyny\u0148 t\u00e4ze \u00e7ap
  eden hasabatynda hem \u00fdatlanyldy.\\nT\u00e4ze hasabat T\u00fcrkmenistany \u00fdene
  \\\"a\u00fdratyn alada d\u00f6red\u00fd\u00e4n\\\" \u00fdurtlary\u0148 arasynda
  galdyrmalydygyny a\u00fdd\u00fdar we amerikan h\u00f6k\u00fcmetine \u00f6z nobatdaky
  rekomendasi\u00fdalaryny, \u015fol sanda dini \u00fdanamalarda jogapk\u00e4r tapylan
  t\u00fcrkmen resmilerine gar\u015fy sanksi\u00fda girizmek teklibini h\u00f6d\u00fcrle\u00fd\u00e4r\\nT\u00fcrki\u00fd\u00e4ni\u0148
  \\\"G\u00fclen\u00e7iler\\\" meselesini\u0148 T\u00fcrkmenistandaky pidalary\\nAzatlyk
  radiosyny\u0148 mundan \u00f6\u0148em en\u00e7eme gezek habar ber\u015fi \u00fdaly,
  2016-njy \u00fdyly\u0148 tomsunda T\u00fcrki\u00fdede bolan d\u00f6wlet agdaryly\u015fygy
  synany\u015fygyny gurnamakda a\u00fdyplanan t\u00fcrk ruhanysy Fethullah G\u00fcleni\u0148
  hereketi bilen gatna\u015fyk saklamakda g\u00fcman edilen t\u00fcrkmenistanlylary\u0148
  onlar\u00e7asy soraga \u00e7ekilip, her d\u00fcrli gynamalar astynda uzak m\u00f6hletli
  t\u00fcrme tussaglygyna h\u00f6k\u00fcm edildi.\\nBellemeli \u00fderi, T\u00fcrkmenistanda
  dini \u00fdanamalar esasynda t\u00fcrm\u00e4 basylan adamlar barada alada bildirilende,
  di\u0148e G\u00fclen hereketi bilen bagly d\u00e4l, e\u00fdsem t\u00fcrkmen h\u00f6k\u00fcmetini\u0148
  g\u00f6z\u00fcne gelme\u00fd\u00e4n ba\u015fga dini akymlar, \u015fol sanda uzyn
  sakgal go\u00fdberip, h\u00e4kimi\u00fdetler tarapyndan ''wahhabist'' bolmakda g\u00fcman
  edil\u00fd\u00e4n we, urlup-\u00fdenjilmekden ba\u015fga, arak i\u00e7m\u00e4ge
  mejbur edilmek \u00fdaly \u00fdowuz synaglara sezewar edil\u00fd\u00e4ndigi a\u00fddyl\u00fdan
  dindarlar barada hem alada bildiril\u00fd\u00e4r.\\nEmma ''g\u00fclen\u00e7i'' di\u00fdil\u00fd\u00e4nler
  \u00fda-da G\u00fclen hereketine simpati\u00fda bildir\u00fd\u00e4nler has d\u00f6wrebap,
  sowatly, gi\u0148 d\u00fc\u015f\u00fcnjeli adamlar hasaplan\u00fdar.\\nEger \u00fdatlatsak,
  2018-nji \u00fdyly\u0148 tomsunda, BMG-ni\u0148 Eden-etdilikli tussag edilmeler
  bo\u00fdun\u00e7a I\u015f\u00e7i toparyny\u0148 80-nji sessi\u00fdasyny\u0148 dowamynda
  AB\u015e-da \u00fda\u015fa\u00fdan t\u00fcrk ruhanysy Fethulla G\u00fcleni\u0148
  \u201cHyzmat\u201d hereketi bilen gatna\u015fyk saklamakda g\u00fcman edilen 18
  ra\u00fdaty\u0148 \u201ceden-etdilikli\u201d \u00fdagda\u00fdda uzak-m\u00f6hletle\u00fdin
  t\u00fcrme tussaglygyna h\u00f6k\u00fcm edilendigi a\u00fddyldy.\\n\u201c2021-nji
  \u00fdylda T\u00fcrkmenistandaky din azatlygyny\u0148 \u00fdagda\u00fdy d\u00fcn\u00fd\u00e4d\u00e4ki
  i\u0148 \u00fdaramaz \u00fdagda\u00fdlary\u0148 biri bolmagynda gal\u00fdar\u201d
  di\u00fdip, hasabaty\u0148 T\u00fcrkmenistan b\u00f6l\u00fcminde a\u00fddyl\u00fdar.\\n\u201c\u00ddurtda
  din berk d\u00f6wlet g\u00f6zeg\u00e7iligi astynda saklanyl\u00fdar, h\u00e4kimi\u00fdetler
  musulman ruhanylaryny belle\u00fd\u00e4r, dini ybadatlary\u0148 berja\u00fd edili\u015fine
  berk g\u00f6zeg\u00e7ilik ed\u00fd\u00e4r we adaty bolmadyk dini akymlara e\u00fder\u00fd\u00e4nleri
  t\u00fcrme tussaglygy, gynamalar we \u00fdamalar bilen jezalandyr\u00fdar\u201d
  di\u00fdip, hasabatda \u00fdurtdaky \u00fdapyklyk zerarly, dini azatly babatyndaky
  d\u00fczg\u00fcn bozmalary hasaba almagy\u0148 kyndygy, \u00fd\u00f6ne olary\u0148
  az sanly \u00e7e\u015fmelerde g\u00f6rkezili\u015finden has k\u00e4ndigi hem bellenip
  ge\u00e7il\u00fd\u00e4r.\\n\u015eol bir wagtda, hasabatda \u2018hatda el\u00fdeterli
  bolan maglumatlary\u0148 hem juda ga\u00fdgyly \u00fdagda\u00fdy g\u00f6rkez\u00fd\u00e4ndigi\u201d
  a\u00fddyl\u00fdar.\\nH\u00f6k\u00fcmet \u00fdurt i\u00e7ind\u00e4ki we onu\u0148
  \u00e7\u00e4ginden da\u015fardaky gara\u015fsyz dini i\u015fje\u0148lik barada maglumat
  ber\u00fd\u00e4n adamlary\u0148 uly toparyny sakla\u00fdar; dini jena\u00fdat seb\u00e4pli
  a\u00fdyplan\u00fdan adamlary\u0148 kazy\u00fdet seljermeleri k\u00f6plen\u00e7
  \u00fdapyk gapylary\u0148 arkasynda ge\u00e7iril\u00fd\u00e4r, h\u00f6k\u00fcm bolsa
  a\u00e7yk yglan edilme\u00fd\u00e4r; \u00fdazgarylanlar k\u00f6plen\u00e7 t\u00fcrmelerde
  \u00fditirim bol\u00fdar we da\u015farky d\u00fcn\u00fd\u00e4den doly \u00fcz\u0148elikde
  saklanyl\u00fdar di\u00fdip, hasabatda bellenil\u00fd\u00e4r.\\n\u00ddurtdaky din
  azatlygy meselesinde bir o\u0148yn \u00fdagda\u00fdy\u0148 hem bolandygy, Gurbanguly
  Berdimuhamedowy\u0148 2021-nji \u00fdyly\u0148 ma\u00fdynda dini ynanjy seb\u00e4pli
  harby gullukdan bo\u00fdun ga\u00e7yrandygy \u00fc\u00e7in t\u00fcrme tussaglygyna
  h\u00f6k\u00fcm edilen Iogowa \u015fa\u00fdatlaryny\u0148 \u00e4hlisini, jemi 16
  tussagy azat edendigi bellenil\u00fd\u00e4r.\\nEmma mu\u0148a garamazdan, \u00fdurtda
  girizilen saglyk \u00e7\u00e4klendirmeleri seb\u00e4pli \u00fdapylan metjitleri\u0148,
  \u00fd\u00f6neke\u00fd ra\u00fdatlar \u00fc\u00e7in hemi\u015fe \u00fdapyk galandygyna
  garamazdan, prezidenti\u0148 \u00fdogalan kakasyny hatyralamak \u00fc\u00e7in a\u00e7yk
  bolandygy a\u00fddyl\u00fdar.\\n\u015ee\u00fdle-de hasabatda, \u201cOlary diri g\u00f6rkezi\u0148\u201d
  kampani\u00fdasyny\u0148 maglumatyna g\u00f6r\u00e4, t\u00fcrkmen t\u00fcrmelerinde
  diri \u00fditen hasaplanyl\u00fdan 162 tussagy\u0148 58 sanysyny\u0148 \u201cyslam
  ekstremizmi\u201d a\u00fdyplamasynda azatlykdan mahrum edilendigi a\u00fddyl\u00fdar.\\nAB\u015e-ny\u0148
  Halkara din azatlygy komissi\u00fdasyny\u0148 T\u00fcrkmenistandaky hukuk bozulmalar
  bilen baglylykda amerikan h\u00f6k\u00fcmetine beren rekomendasi\u00fdalaryna ge\u00e7mezden
  \u00f6\u0148, \u2018g\u00fclen\u00e7iler\u2019 di\u00fdlen tagma bilen t\u00fcrm\u00e4
  basylan ra\u00fdatlara \u00fdene bir gezek nazar a\u00fdlaly\u0148.\\nBu mesel\u00e4
  en\u00e7eme gezek \u00fd\u00fczlenendiklerine garamazdan, Azatlygy\u0148 habar\u00e7ylaryna
  T\u00fcrkmenistanda G\u00fclen hereketi bilen bagly t\u00fcrme tussaglygyna h\u00f6k\u00fcm
  edilen adamlary\u0148 anyk sany belli bolman gal\u00fdar. \u00dd\u00f6ne \u00e7e\u015fmeler
  2016-njy \u00fdyly\u0148 okt\u00fdabryndan b\u00e4ri t\u00fcrk oppozisioneri bilen
  m\u00fcmkin bolan gatna\u015fykda a\u00fdyplanyp tussag edilenleri\u0148 sanyny\u0148
  onlar\u00e7adygyny we olary\u0148 uzak m\u00f6hletle\u00fdin t\u00fcrme tussaglygyna
  h\u00f6k\u00fcm edilendigini a\u00fdd\u00fdarlar.\\nAzatlyga gow\u015fan sud dokumentlerinden
  belli bol\u015funa g\u00f6r\u00e4, 2017-nji \u00fdyly\u0148 8-nji fewralynda \u00e7ykarylan
  h\u00f6k\u00fcmde ady ge\u00e7\u00fd\u00e4n ra\u00fdatlary\u0148 \u00e4hlisine T\u00fcrkmenistany\u0148
  Jena\u00fdat Kodeksini\u0148 177-nji maddasyny\u0148 (Durmu\u015f, milli \u00fda-da
  dini du\u015fman\u00e7ylygy d\u00f6retmek) 3-nji b\u00f6legine; 275-nji maddany\u0148
  (Jena\u00fdat\u00e7ylykly d\u00fcz\u00fcmleri\u0148 mali\u00fdele\u015fdirilmek)
  3-nji b\u00f6legine la\u00fdyklykda a\u00fdyp bildirilipdir.\\nBu kazy\u00fdet i\u015finde
  mugallym bolup i\u015fle\u00fd\u00e4n ra\u00fdatlary\u0148 en\u00e7emesine 12 \u00fdyldan
  i\u015f kesilen bolsa, \u00fdene bir topar teleke\u00e7\u00e4 25 \u00fdyldan i\u015f
  kesildi we olary\u0148 der\u0148ew mahalynda urlup-\u00fdenjilendigi, \u00fd\u00fcklen\u00fd\u00e4n
  g\u00fcn\u00e4ni bo\u00fdun almaklary we be\u00fdlekilere gar\u015fy g\u00f6rkezme
  bermekleri \u00fc\u00e7in gynalandygy barada resmi ta\u00fddan tassyklap bolma\u00fdan
  maglumatlar \u00fda\u00fdrady.\\n\u015eonda Azatlyk bilen anonimlik \u015fertinde
  g\u00fcrle\u015fen we biri-birinden habarsyz, emma \u00fdyl kesilen ra\u00fdatlary
  \u00fdakyndan tana\u00fdan, olar bilen bile okan \u00fda i\u015fl\u00e4n t\u00fcrkmenistanlylary\u0148
  en\u00e7emesini\u0148 tassyklamagyna g\u00f6r\u00e4, \u201cdini ekstremizm\u201d
  di\u00fdil\u00fd\u00e4nde a\u00fdyplananlary\u0148 tas hemmesi di\u00fden \u00fdaly
  il i\u00e7inde sylan\u00fdan, arassa, il-g\u00fcne pe\u00fddaly, sahawat\u00e7ylyk
  edip, m\u00e4t\u00e4je k\u00f6mek bermekde tanalan ra\u00fdatlar bolupdyr.\\n\u201cOlar
  gaty halal oglanlar, dine ba\u00fdlyk \u00fda \u00fde\u0148il durmu\u015f \u00fc\u00e7in
  u\u00fd\u00fdan adamlar d\u00e4l, \u00fd\u00fcrekden huda\u00fda ynanyp, il-g\u00fcne
  \u00fdag\u015fylyk etjek bol\u00fdan, o d\u00fcn\u00fd\u00e4sini alada ed\u00fd\u00e4n
  adamlar\u201d di\u00fdip, a\u015fgabatly di\u0148le\u00fdjimiz a\u00fdtdy. Onu\u0148
  pikirine g\u00f6r\u00e4, \u201cbu \u00fderde bir \u00fdal\u0148y\u015flyk boldy
  we h\u00e4kimi\u00fdetler bu \u00fdal\u0148y\u015fy d\u00fczetmeli bolar, seb\u00e4bi
  adamlar olara \u00e7ykarylan agyr h\u00f6k\u00fcmleri gaty ge\u0148 g\u00f6rd\u00fcler\u201d
  di\u00fddi.\\n\u015eondan so\u0148ky \u00fdyl, 2018-nji \u00fdyly\u0148 ma\u00fdyna
  d\u00fc\u015fen Gadyr gijesini\u0148 \u00f6\u0148\u00fcnden \u2018g\u00fclen\u00e7iler\u2019
  di\u00fdil\u00fd\u00e4nleri\u0148 g\u00fcn\u00e4 ge\u00e7i\u015fe d\u00fc\u015fjekdigi
  hakynda birn\u00e4\u00e7e \u00e7e\u015fme maglumat berdi, emma bu maglumat g\u00fcn\u00e4
  ge\u00e7i\u015f bolanda tassyklanmady, \u00fdalan bolup \u00e7ykdy.\\nAzatlygy\u0148
  T\u00fcrki\u00fded\u00e4ki di\u0148le\u00fdjilerini\u0148 we okyjylaryny\u0148 birn\u00e4\u00e7esini\u0148
  biri-birinden bihabar tassyklamagyna g\u00f6r\u00e4, aslynda \u2018g\u00fclen\u00e7iler\u2019
  i\u015fi T\u00fcrkmenistany\u0148 d\u00e4l-de, T\u00fcrki\u00fd\u00e4ni\u0148 meselesi
  bolup, bu \u00fdurtdaky h\u00f6k\u00fcmet korrupsi\u00fdasyndan \u00fcnsi sowmak
  \u00fc\u00e7in toslanyp tapyldy we T\u00fcrki\u00fd\u00e4ni\u0148 d\u00f6wlet ba\u015ftutanyny\u0148
  sy\u00fdasy gar\u015fyda\u015flaryndan dynmak \u00fc\u00e7in ulanyldy.\\n\u201cT\u00fcrkmen
  t\u00fcrmelerinde dini a\u00fdyplamalar esasynda \u00fditirim edilen adamlary\u0148
  k\u00f6p\u00fcsi bir tarapdan T\u00fcrki\u00fd\u00e4d\u00e4ki h\u00f6k\u00fcmet
  korrupsi\u00fdasyny\u0148 pidasy bolsa, ikinji tarapdan T\u00fcrkmenistandaky h\u00f6k\u00fcmet
  korrupsi\u00fdasyny\u0148, adalat, kanun ulgamyndaky eden-etdilikleri\u0148 pidasy
  boldy, olary\u0148 eml\u00e4kleri tala\u0148a d\u00fc\u015fdi, \u00e7ykarjak di\u00fdseler,
  karza \u00e7\u00fcm\u00fcp, uly m\u00f6\u00e7berde para beren ma\u015fgalalar hem
  bar\u201d di\u00fdip, adyny\u0148 a\u00fddylmazlygyny soran a\u015fgabatly \u00fda\u015fa\u00fdjy
  Azatlyga \u00fdatdy.\\nMegerem \u015fu \u00fdagda\u00fdlar bilen baglylykda, AB\u015e-ny\u0148
  Halkara din azatlygy komissi\u00fdasy T\u00fcrkmenistany\u0148, ra\u00fdatlaryny\u0148
  dine u\u00fdmak hukugyny g\u00f6dek we yzygiderli boz\u00fdandygy \u00fc\u00e7in,
  \u201ca\u00fdratyn alada d\u00f6red\u00fd\u00e4n\u201d \u00fdurtlary\u0148 hatarynda
  galmalydygyny a\u00fdd\u00fdar.\\n\u201cDine u\u00fdmak azatlyklaryny\u0148 i\u0148
  erbet bozulmlary seb\u00e4pli \u00fdurda beril\u00fd\u00e4n howpsuzlyk goldawyny
  \u00e7\u00e4klendirmeli; ra\u00fdatlary\u0148 din azatlygy hukuklaryny\u0148 i\u0148
  erbet bozulmalaryna jogapk\u00e4r bolan h\u00f6k\u00fcmet resmilerine gar\u015fy
  anyk sanksi\u00fdalary girizmeli, olary\u0148 AB\u015e-ny\u0148 \u00e7\u00e4gine
  girmegini \u00e7\u00e4klendirmeli, eml\u00e4klerini do\u0148durmaly\u201d di\u00fdip,
  komissi\u00fdany\u0148 amerikan h\u00f6k\u00fcmetine beren rekomendasi\u00fdlarynda
  a\u00fddyl\u00fdar.\\nGadyrly okyjy, siz Telegram we WhatsApp tilsimlerini\u0148
  messenjerleri arkaly Azatlyk Radiosy bilen howpsuz \u00fdagda\u00fdda habarla\u015fyp
  bilersi\u0148iz. Telefon belgileri: +420 724 168 989 we +420 773 797 383.\\nT\u00fcrkmenistanda
  VPN ulgamlary arkaly i\u015fle\u00fd\u00e4r. Siz \u015fu me\u00fdl: azathabar@derweze.net
