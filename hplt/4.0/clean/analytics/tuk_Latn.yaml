  iki tarapam biri-birine manysyz s\u00f6z aty\u015fyp ba\u015fla\u00fdar we netijede
  hi\u00e7 bir mesele-de \u00e7\u00f6z\u00fclme\u00fd\u00e4r.\\nSagadat asyrynda Pygamberimiz
  (sallallahu ale\u00fdhi wesellem) iki gezek \u00e7eki\u015fm\u00e4 go\u015fulmaly
  bolupdyr. Ol (sallallahu ale\u00fdhi wesellem) \u015fe\u00fddip, gar\u015fydaky
