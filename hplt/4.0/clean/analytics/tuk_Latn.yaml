  88-nji ja\u00fdy.\\nTel:+993 12 92 71 69, Faks: +993 12 92 72 44\"", "\"\u00dcst\u00fcnden
  Be\u00fdik \u00dd\u00fcpek \u00fdoly ge\u00e7en \u00fdurtlary\u0148 \u00f6s\u00fc\u015fi
  be\u00fdlekilerden di\u00fdse\u0148 tapawutlan\u00fdar. Taryhy\u0148 \u00e4hli d\u00f6w\u00fcrlerinde
  Be\u00fdik \u00dd\u00fcpek \u00fdoluny\u0148 \u015fahalary, \u00fdollary, d\u00fcn\u00fd\u00e4ni\u0148
  \u00e7ar tarapyndan ene Zemini\u0148 \u00fd\u00fcregi bolan T\u00fcrkmenistany\u0148
  go\u00fdnuna gel\u00fd\u00e4r. Mukaddes topragymyzdan g\u00f6zba\u015f al\u00fdan
  dost-doganlyk, hyzmatda\u015flyk \u00fdollary t\u00e4ze taryhy d\u00f6wr\u00fcmizde
  has-da berke\u00fd\u00e4r.\\nHalkara gatna\u015fyklary\u0148 ba\u015flangyjy, o\u0148a
  i\u015fje\u0148 gatna\u015fmak \u00fd\u00fcreklere \u00fdol \u00e7ekmekden, d\u00fcn\u00fd\u00e4
  bar\u00fdan \u00fdollary k\u00e4mille\u015fdirmekden, di\u00fdmek, d\u00fcn\u00fd\u00e4
  \u00fdurtlary bilen gatna\u015fyklary \u00fdokary derejelere \u00e7ykarmakdan ba\u015flan\u00fdar.
  \u00ddollar doganlyk-dostluk go\u0148\u015fu\u00e7ylygyny, dostlugy, hyzmatda\u015flygy
  \u00fdakynla\u015fdyr\u00fdar. Bar harydy\u0148y be\u00fdlekilere \u00fdetirm\u00e4ge,
  zerur halatynda d\u00fcn\u00fd\u00e4 \u00fdurtlaryndan harytlary getirm\u00e4ge
  m\u00fcmkin\u00e7ilik ber\u00fd\u00e4r. Has takygy s\u00f6wda-ykdysady we be\u00fdleki
  ugurlarda i\u015fje\u0148 hyzmatda\u015flygy \u00fdokarlandyrmak \u00fc\u00e7in
  zerur \u015fertleri d\u00f6red\u00fd\u00e4r.\\nBe\u00fdik \u00dd\u00fcpek \u00fdoluny
  ga\u00fdtadan dikeltmegi\u0148 g\u00f6zba\u015fynda duran T\u00fcrkmen halkyny\u0148
  Milli Lideri Gahryman Arkadagymyz d\u00f6wlet ba\u015fyna ge\u00e7en ilkinji g\u00fcnlerinden
  ba\u015flap \u201cA\u00e7yk gapylar\u201d sy\u00fdasatyny alyp bar\u00fdar. Gahryman
  Arkadagymyz ulag ulgamyny\u0148 hem berk bin\u00fdadyny kemala getirdi. Milli Liderimizi\u0148
  tagallalary bilen \u00fdurdumyzda ulag pudagyny\u0148 maddy-enjamla\u00fdyn bin\u00fdadyny
  pugtalandyrmaga, ozal hereket ed\u00fd\u00e4n ulag-aragatna\u015fyk ulgamlaryny
  gi\u0148eltm\u00e4ge we t\u00e4zelerini d\u00f6retm\u00e4ge g\u00f6n\u00fckdirilen
  uzak m\u00f6hletli milli maksatnamalar i\u015flenip ta\u00fd\u00fdarlanyldy we ol
  \u00fcst\u00fcnlikli durmu\u015fa ge\u00e7irildi, bu maksatnamalar halkara ykdysady
  we s\u00f6wda hyzmatda\u015flygyny hil ta\u00fddan t\u00e4ze derej\u00e4 g\u00f6term\u00e4ge
  \u00fdardam berdi. Bu T\u00fcrkmenistany\u0148 ulag ulgamyny\u0148 halkara gatna\u015fyk
  duz\u00fcmlerine i\u015fje\u0148 go\u015fuly\u015fmagyna, iri logistika merkezlerini\u0148
  d\u00f6redilmegine, sebit intermodal \u00fd\u00fckleri da\u015famagy\u0148 utga\u015fdyrylmagyny
  \u00fcpj\u00fcn etm\u00e4ge hyzmat etdi.\\nUlag ulgamyny \u00f6sd\u00fcrmegi\u0148
  ilkinji wajyp meselelerini\u0148 biri onu\u0148 d\u00fcz\u00fcm we institusional
  esaslaryny \u00f6zgertmek bolup dur\u00fdar. H\u00e4zirki d\u00f6w\u00fcrde ulagy\u0148
  t\u00e4ze hakykatlara, durmu\u015f-ykdysady \u015fertlere jogap ber\u00fd\u00e4n
  hukuk bin\u00fdadyny\u0148 esaslary d\u00f6redildi. Bazar ykdysady \u015fertlerinde
  i\u015fl\u00e4p, hyzmat edip biljek ulag i\u015fini d\u00f6wlet tarapyndan kadala\u015fdyrmagy\u0148
  ulgamy kemala getirildi. Ulagy\u0148 ulgam emele getiriji orny has-da \u00fdokarlandy
  we ony \u00f6sd\u00fcrmek bilen bagly wezipeleri\u0148 durmu\u015f-ykdysady \u00f6zgertmeler
  bilen \u00f6zara baglany\u015fygy pugtalandy. T\u00fcrkmenistany\u0148 S\u00f6wda
  de\u0148iz gatnawyny\u0148 kodeksi,T\u00fcrkmenistany\u0148 Howa kodeksi we be\u00fdleki
  degi\u015fli hukuknamalary kabul edildi.\\nSo\u0148ky \u00fdyllarda T\u00fcrkmenistanda
  i\u0148 \u00f6\u0148debaryjy tehnologi\u00fdalar bo\u00fdun\u00e7a bina edil\u00fd\u00e4n
  demir \u00fdol we awtoulag k\u00f6pr\u00fcleri ulanmaga beril\u00fd\u00e4r. Olar
  Demirgazyk\u2013G\u00fcnorta, G\u00fcndogar\u2013G\u00fcnbatar ugry bo\u00fdun\u00e7a
  \u00fdurdumyzy\u0148 \u00e7\u00e4ginden ge\u00e7\u00fd\u00e4n sebit we sebitara
  ulag ugurlaryny\u0148 emele gelmegine \u015fert d\u00f6red\u00fd\u00e4r. T\u00fcrkmenistanda
  ulag \u00fdollaryny\u0148 doly d\u00f6wrebapla\u015fdyrylmagyna, t\u00e4ze k\u00f6pr\u00fcleri\u0148,
  \u00e4hli zerur d\u00fcz\u00fcmi bolan \u00fdokary tizlikli awtobanlary\u0148 gurulmagyna
  di\u00fdse\u0148 uly \u00fcns beril\u00fd\u00e4r. \u015eunda transmilli awtomobil
  \u00fdollaryny\u0148 gurlu\u015fygynda halkara \u00fcl\u0148\u00fclerini\u0148 berja\u00fd
  edilmegi m\u00f6h\u00fcm talap bolup dur\u00fdar. Netijede, h\u00e4zirki d\u00f6w\u00fcrde
  \u00fdurdumyzy\u0148 awtomobil, demir, howa we de\u0148iz \u00fdollaryna degi\u015fli
  d\u00fcz\u00fcmler milli ykdysady\u00fdetimizi \u00f6sd\u00fcrmek, onu\u0148 eksport
  m\u00fcmkin\u00e7iliklerini amala a\u015fyrmak halkara derejesind\u00e4ki gatna\u015fyklary
  i\u015fje\u0148le\u015fdirmek \u00fc\u00e7in zerur bolan durmu\u015f ykdysady \u015fertleri\u0148
  d\u00f6redilmegini \u00fcpj\u00fcn ed\u00fd\u00e4r.\\n2017-nji \u00fdylda pa\u00fdtagtymyzda
  RECCA VII forumyny\u0148 \u00e7\u00e4klerinde \u00dcsta\u015fyr we ulag hyzmatda\u015flygy
  hakynda Ylala\u015fyga gol \u00e7ekilmegi sebiti\u0148 ykdysady \u00fdakynla\u015fmagyny
  \u00fdokarlandyrmaga g\u00f6n\u00fckdirilen taryhy waka \u00f6wr\u00fcldi. \u00dda\u0148y-\u00fdakynda
  T\u00fcrkmenistany\u0148 TRA\u00c7E\u00c7A Ylala\u015fygyna go\u015fulmagy \u00ddewropa,
  Kawkaz, Gara de\u0148iz we Hazar de\u0148zi sebitlerinde, Azi\u00fda yklymynda ykdysady
  hyzmatda\u015flygy, s\u00f6wda, ulag ugurly gatna\u015fyklary \u00f6sd\u00fcrmekde,
  harytlary\u0148 halkara gatnawyny i\u015fje\u0148le\u015fdirmekde we \u00fde\u0148ille\u015fdirmekde,
  hereketleri\u0148 howpsuzlygyny \u00fcpj\u00fcn etmekde, ulag sy\u00fdasatyny sazla\u015fdyrmakda,
  ulagy\u0148 d\u00fcrli g\u00f6rn\u00fc\u015flerini\u0148 arasynda b\u00e4sde\u015flik
  \u00fc\u00e7in de\u0148 \u015fertleri d\u00f6retmekde m\u00f6h\u00fcm orny e\u00fdel\u00e4r.
  Munu\u0148 \u00f6zi Be\u00fdik \u00dd\u00fcpek \u00fdoluny\u0148 k\u00f6pugurly
  ulgamyny dikeltmegi\u0148 \u00fdolunda m\u00f6h\u00fcm \u00e4hmi\u00fdetli \u00e4dimlerdir.
  Gazagystan\u2013T\u00fcrkmenistan\u2013E\u00fdran halkara demir \u00fdol ge\u00e7elgesi,
  Kerki\u2013Ymamnazar\u2013Akina ugruny\u0148 aja\u00fdyp taslamalaryny\u0148 amala
  a\u015fyrylmagy, wela\u00fdatlary\u0148 we pa\u00fdtagtymyzy\u0148 t\u00e4ze Halkara
  howa menzilini\u0148, T\u00fcrkmenba\u015fy Halkara de\u0148iz portuny\u0148 ulanylmaga
  berilmegi, \u015fe\u00fdle hem A\u015fgabat \u2013 T\u00fcrkmenabat awtobanyny\u0148
  gurlu\u015fygy ulaglar ulgamyndaky halkara ba\u015flangy\u00e7lary\u0148 belent
  \u00fcst\u00fcnliklere beslen\u00fd\u00e4ndigine \u015fa\u00fdatlyk ed\u00fd\u00e4r.\\nGahryman
  Arkadagymyzy\u0148 ba\u015fda durmagynda T\u00fcrkmenistany\u0148 ba\u015flangyjy
  bilen ulag ulgamy bo\u00fdun\u00e7a birn\u00e4\u00e7e halkara resminamalar kabul
  edildi. \u00ddagny, 2014-nji \u00fdylda BMG-ni\u0148 Ba\u015f Assamble\u00fdasy
  \u00abDurnukly \u00f6s\u00fc\u015f \u00fc\u00e7in halkara hyzmatda\u015flygyny \u00fcpj\u00fcn
  etmekde ulag-\u00fcsta\u015fyr ge\u00e7elgelerini\u0148 orny\u00bb atly Rezol\u00fdusi\u00fdany
  kabul etdi. Kararnamany\u0148 esasy a\u00fdratynlygy bu taryhy resminamany\u0148
  logistika merkezleri we gury\u00fder portlary arkaly awtomobil, demir \u00fdol,
  de\u0148iz hem-de howa \u00fdollaryny\u0148 utga\u015f\u00fdan ulag ulgamlaryny\u0148
  bin\u00fdadyny go\u00fd\u00fdandygyndan ybaratdyr. Bu T\u00fcrkmenistany\u0148 ba\u015flangyjydy.
  Bu, elbetde, ata Watanymyzy\u0148 \u00fdyl \u00fdazgysyna ulag d\u00fcz\u00fcmlerini
  d\u00fc\u00fdpli we toplumla\u00fdyn d\u00f6wrebapla\u015fdyrmak hem-de \u00f6sd\u00fcrmek
  bo\u00fdun\u00e7a iri m\u00f6\u00e7berli taslamalary\u0148 durmu\u015fa ge\u00e7irilen
  \u00fdyly h\u00f6km\u00fcnde girdi.\\n2015-nji \u00fdyly\u0148 22-nji dekabrynda
  ikinji gezek \u00abDurnukly k\u00f6pugurly ulag-\u00fcsta\u015fyr ge\u00e7elgelerini\u0148
  d\u00f6redilmegine \u00fdardam bermek maksady bilen ulaglary\u0148 \u00e4hli g\u00f6rn\u00fc\u015flerini\u0148
  arasynda hemmetarapla\u00fdyn hyzmatda\u015flygy\u0148 \u00fcpj\u00fcn edilmegi
  ugrunda\u00bb 85 d\u00f6wleti\u0148 awtorda\u015flygynda Kararnama kabul edildi.Taryhy
  Kararnamalary\u0148 kabul edilmegi netijesinde, 2016-njy \u00fdyly\u0148 26-njy
  no\u00fdabrynda A\u015fgabatda Birle\u015fen Milletler Guramasyny\u0148 Durnukly
  ulag ulgamy bo\u00fdun\u00e7a birinji \u00e4hlumumy maslahaty ge\u00e7irildi. BMG-ni\u0148
  Ba\u015f Assamble\u00fdasyny\u0148 her \u00fdyly\u0148 26-njy no\u00fdabryny \u00abB\u00fctind\u00fcn\u00fd\u00e4
  durnukly ulag g\u00fcni\u00bb di\u00fdip yglan etmeginde T\u00fcrkmenistany\u0148
  ba\u015flangyjy esasynda ilkinji gezek guralan \u00e4hlumumy maslahaty\u0148 ge\u00e7irilen
  senesini\u0148 sa\u00fdlanyp alynmagynda \u00e7u\u0148\u0148ur many bar. Munu\u0148
  \u00f6zi t\u00fcrkmen halkyny\u0148 Milli Lideri, T\u00fcrkmenistany\u0148 Halk
  Maslahatyny\u0148 Ba\u015flygy Gurbanguly Berdimuhamedowy\u0148 \u00f6\u0148e s\u00fcr\u00fd\u00e4n
  tutu\u015f d\u00fcn\u00fd\u00e4 \u00e4hmi\u00fdetli ba\u015flangy\u00e7laryny\u0148
  Milletler Bilele\u015figi tarapyndan ykrar edil\u00fd\u00e4ndigini\u0148 nobatdaky
  be\u00fdanydyr. Bu bolsa Gara\u015fsyz, Bitarap Watanymyzy\u0148 halkara gi\u0148i\u015fligind\u00e4ki
  abra\u00fdyny\u0148 has-da \u00fdokarlanmagyny \u00fcpj\u00fcn ed\u00fd\u00e4r.\\n2017-nji
  \u00fdyly\u0148 20-nji dekabrynda nobatdaky gezek \u00abDurnukly \u00f6s\u00fc\u015f
  maksatlaryny amala a\u015fyrmak bilen baglylykda ulaglary\u0148 \u00e4hli g\u00f6rn\u00fc\u015flerini\u0148
  arabaglany\u015fygyny berkitmek atly \u00fc\u00e7\u00fcnji gezek 74 d\u00f6wleti\u0148
  awtorda\u015flygynda Kararnama kabul edildi. 2021-nji \u00fdyly\u0148 29-njy i\u00fdulynda
  bolsa, Birle\u015fen Milletler Guramasyny\u0148 Ba\u015f Assamble\u00fdasyny\u0148
  75-nji mejlisinde \u00abKoronawirus keselini\u0148 (COVID-19) pandemi\u00fdasy we
  ondan so\u0148ky d\u00f6w\u00fcrde durnukly \u00f6s\u00fc\u015f \u00fc\u00e7in \u00fczn\u00fcksiz
  we ygtybarly halkara \u00fd\u00fck da\u015famalary \u00fcpj\u00fcn etmek maksady
  bilen, ulagy\u0148 \u00e4hli g\u00f6rn\u00fc\u015flerini\u0148 arabaglany\u015fygyny
  berkitmek\u00bb atly Rezalusi\u00fda kabul edildi we 48 d\u00f6wlet awtorda\u015f
  bolup \u00e7yky\u015f etdi. \u015ee\u00fdlelikde, kabul edilen Kararnamalar hyzmatda\u015flygy\u0148
  \u00fdoluny kesgitledi we bu ugurdaky m\u00f6h\u00fcm resminama bolup \u00e7yky\u015f
  ed\u00fd\u00e4r.\\nT\u00e4ze taryhy d\u00f6wr\u00fcmizde kabul edilen \u00abBerkarar
  d\u00f6wleti\u0148 t\u00e4ze e\u00fd\u00fdamyny\u0148 Galkyny\u015fy d\u00f6wri:
  T\u00fcrkmenistany 2022-2052-nji \u00fdyllarda durmu\u015f-ykdysady ta\u00fddan
  \u00f6sd\u00fcrmegi\u0148 Milli maksatnamasynda\u00bb ulag-aragatna\u015fyk ulgamynda
  esasy ma\u00fda go\u00fdum awtomobil, howa, demir \u00fdol, der\u00fda we de\u0148iz
  gatnawlaryny \u00f6sd\u00fcrm\u00e4ge, awtomobil \u00fdollaryny gurmaga, telekommunikasi\u00fda,
