  100 qadam\"", "\"Adamy tanamak we o\u0148a d\u00fc\u015f\u00fcnmek\\na) Adamyny
  tanamak\\nDin wagyz\u00e7ysy dini kime d\u00fc\u015f\u00fcndirjek bolsa, \u015fol
  adam bilen \u00fdakyndan gyzyklanmaly we onu\u0148 kem\u00e7iliklerini bagy\u015flamagy
  ba\u015farmalydyr. Musulman musulmana hemi\u015fe \u00fdag\u015fylyk etmelidir.
  Musulman kapyrlara, azgynlara gar\u015fy g\u00f6re\u015fende, \u00f6\u0148deng\u00f6r\u00fcjilige,
  a\u0148-zehine, ukypdyr ba\u015farnyga e\u00fde bolmalydyr. Ol, ine, \u015fulary
  ulanyp, adamlary\u0148 k\u00f6\u0148\u00fcl tagtyny e\u00fdel\u00e4p biler. \u015eonda,
  adamlar olary\u0148 d\u00fc\u015f\u00fcndirjek bol\u00fdan meselelerini kabul ederler.\\nHawa,
  ir\u015fad bilen teblig wezipesini \u00fderine \u00fdetir\u00fd\u00e4n adam hakykaty
  kime d\u00fc\u015f\u00fcndir\u00fd\u00e4n bolsa, ol adamy \u00fdakyndan tanamalydyr.
  Ol adamlary da\u015fla\u015fdyryjy, \u00fdigrendiriji gylyk-h\u00e4si\u00fdetlerden
  m\u00fcmkingadar \u00e4g\u00e4 bolmalydyr. Teblig\u00e7i halka mukaddes d\u00fc\u015f\u00fcnjeleri
  wagyz ed\u00fd\u00e4r. Allaha, Pygamberimize (sallallahu ale\u00fdhi wesellem),
  Kurany Kerime we ahyrete bolan s\u00f6\u00fdgini ynsanlary\u0148 \u00fd\u00fcregine
  gu\u00fd\u00fdan adam, elbetde, \u00f6z wezipesini\u0148 mukaddesligini bilmelidir
  we gylyk-h\u00e4si\u00fdetine serenjam bermelidir. Allah saklasyn! Dini\u0148i d\u00fc\u015f\u00fcndirjek
  bolup, kimdir birini\u0148 degnasyna deg\u00e4\u00fdse\u0148, ol di\u0148e bir seni
  d\u00e4l, \u00fdokarda agzalan mukaddeslikleri-de \u00fdigrener. Ine, mu\u0148a
  seb\u00e4p bolmak \u00fditgileri\u0148 i\u0148 ulusydyr. Eger-de biz \u015fe\u00fdle
  \u00fditg\u00e4 seb\u00e4p bolsak, o d\u00fcn\u00fd\u00e4de munu\u0148 hasabyny
  bermeli bolarys.\\nSeredi\u0148! Pygamberimiz (sallallahu ale\u00fdhi wesellem)
  adamlary g\u00fcn\u00e4k\u00e4rlik derdeserine itermejek bolup, n\u00e4hili teblig
  edipdir?! Hawa, ol kapyr bilenem, g\u00fcn\u00e4 i\u015f eden bilenem, jena\u00fdatk\u00e4r
  bilen g\u00fcrle\u015f\u00fd\u00e4n \u00fdaly g\u00fcrle\u015fm\u00e4ndir. Ol s\u00f6zle\u00fd\u00e4n
  s\u00f6z\u00fcni, bar ki\u015f\u00e4 di\u00fd\u00fd\u00e4n \u00fdaly edip a\u00fdd\u00fdardy.
  Jemagaty\u0148 arasynda kimdir birini\u0148 a\u00fdbyny g\u00f6rse, derhal m\u00fcnbere
  \u00e7ykyp, tutu\u015f m\u00e4helle wagyz ed\u00fd\u00e4rdi. Indi bolsa, \u015fu\u0148a
  degi\u015fli bir-iki mysaly bell\u00e4p ge\u00e7esim gel\u00fd\u00e4r.\\nSahabalary\u0148
  biri Allah Resulyny\u0148 (sallallahu ale\u00fdhi wesellem) gola\u00fdynda bir \u00fderde
  dileg ed\u00fd\u00e4rdi. Ol elini \u00fdokaryk galdyryp, batly sesi bilen dileg
  edip oturan eken. Be\u00fdle dileg etmek, dilegi\u0148 edebine ters gel\u00fd\u00e4rdi.
  Emma, Pygamberimiz (sallallahu ale\u00fdhi wesellem) di\u0148e o\u0148a wagyz-nesihat
  etmegi\u0148 \u00fderine, o \u00fderd\u00e4kileri\u0148 \u00e4hlisine \u00fd\u00fczlenip,
  \u015fe\u00fdle di\u00fdipdir: \u201eAdamlar! Siz ker hem k\u00f6r birinden dileg
  ede\u0148zok. \u00d6z\u00fc\u0148ize rehmi\u0148iz insin! Dileg ede\u0148izde, orta
  \u00fdoldan gidi\u0148! Size bar zatdan \u00fdakyn bolan we dilegleri kabul ed\u00fd\u00e4n
  be\u00fdik Biribara dileg ed\u00fd\u00e4rsi\u0148iz. Ol sizi\u0148 dilegleri\u0148izi
  (n\u00e4hili bolanda-da ) e\u015fider hem-de jogap berer\u201c\\n\u00ddene bir gezegem,
  \u201eYmam namazy uzak okad\u00fdar\u201c di\u00fdip, jemagat Pygamber Serwerimizi\u0148
  (sallallahu ale\u00fdhi wesellem) \u00fdanyna barypdyr. Olary\u0148 arasynda: \u201e\u00dda
  Resulallah! Tasdanam namazy ta\u015flap gid\u00fd\u00e4rdik\u201c di\u00fdenlerem
  bolupdyr. Ymam bolan adamyny her kim tana\u00fdardy. Bu waka Allah Resulyny\u0148
  (sallallahu ale\u00fdhi wesellem) ynjalygyny ga\u00e7yrypdy. \u015eonda-da, ol namazy
  okadan ymamy \u00f6w\u00fct-\u00fcndew etmek \u00fc\u00e7in, \u00fdanyna \u00e7agyrmandyr.
  Ol tutu\u015f halka \u00fd\u00fczlenip, \u015fe\u00fdle di\u00fdipdir: \u201eAdamlar!
  Size n\u00e4me bol\u00fdar, be\u00fdle? Adamlary n\u00e4me \u00fc\u00e7in \u00fdigrendir\u00fd\u00e4\u0148iz?
  Sizden kim ymam bolsa, namazy \u00fde\u0148il okatsyn! Seb\u00e4bi, olary\u0148
  arasynda garrysy, ejizi we k\u00f6mege m\u00e4t\u00e4\u00e7leri bardyr \u201c\\nIne,
  Allah Resuly (sallallahu ale\u00fdhi wesellem) kem\u00e7ilikleri \u015fe\u00fddip
  d\u00fczedipdir. Seb\u00e4bi, ol adamlary\u0148 halas bolaryny isle\u00fd\u00e4rdi.
  Ol her bir mesel\u00e4ni a\u0148sat usulda hem-de a\u0148sat durmu\u015fa ge\u00e7irip
  bolar \u00fdaly edip d\u00fc\u015f\u00fcndir\u00fd\u00e4rdi.\\n\u201eAdamlar! \u201eL\u00e4
  il\u00e4he illallah\u201c di\u00fdi\u0148 we halas bolu\u0148!\u201c di\u00fd\u00fd\u00e4rdi.
  Ol \u015funu\u0148 \u00fc\u00e7in iberilipdi.\\nHawa, ir\u015fad bilen teblig wezipesinde,
  adamlary a\u00fdyplamak bilen hi\u00e7 ha\u00e7an \u00fdol alyp bolmaz. N\u00e4me
  a\u00fdtsa\u0148am, umumy adamlara \u00fd\u00fczlenip a\u00fdtmaly. G\u00fcn\u00fc\u0148
  \u015f\u00f6hlesinden her kim \u00f6z\u00fc\u00e7e pe\u00fddalany\u015fy \u00fdaly,
  aby-k\u00f6wser s\u00f6zlerdenem her kim ba\u015fardygy\u00e7a pe\u00fddalanyp bil\u00fd\u00e4r.
  \u00ddogsam, so\u0148 d\u00f6r\u00e4n \u00fdarany bejermek gaty kyn bolar.\\nb)
  \u00c7eki\u015fmeden ga\u00e7mak\\nEger-de dini d\u00fc\u015f\u00fcndirmek \u00fc\u00e7in
  iki\u00e7\u00e4k g\u00fcrr\u00fc\u0148de\u015flik zerur bolsa, onda \u015fe\u00fdle
  \u00fdagda\u00fdda g\u00fcrr\u00fc\u0148de\u015fligi\u0148 \u00e7eki\u015fm\u00e4
  \u00fdazmazlygyna \u00fcns bermelidir. Seb\u00e4bi, \u00e7eki\u015fm\u00e4ni\u0148
