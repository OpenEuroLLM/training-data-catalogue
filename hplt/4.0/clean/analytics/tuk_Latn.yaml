  (sallallahu ale\u00fdhi wesellem) en\u00e7eme \u00fdyllap k\u00e4bir Ysra\u00fdylogullaryny\u0148
  ulamalary bilen du\u015fu\u015fyp, olar bilen \u00e7ekele\u015fikli sorag-jogap
  al\u015fypdyr. \u00dd\u00f6ne, \u015funu\u0148 netijesinde olary\u0148 arasynda
  Hak \u00fdoluna giren bolmandyr. \u00c4lem onu\u0148 \u00fc\u00e7in \u00fdaradylypdyr.
  Ol \u2013 Pygamberdi. Onu\u0148 mugjyzalary bardy. Has dogrusy, t\u00e4sinlikler
  hemi\u015fe onu\u0148 da\u015fyny gallap durdy. \u015eonda-da, \u00e7eki\u015fme
