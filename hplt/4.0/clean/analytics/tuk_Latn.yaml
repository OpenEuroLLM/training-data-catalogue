  me\u00fddanyna \u00e7ykanlary di\u0148e s\u00f6zde tutup bol\u00fdardy. Abdullah
  bin Selam (r.a) hem gaty kesir adamdy. Ol hakykaty kabul etmek \u00fc\u00e7in Pygamberimizi\u0148
  (sallallahu ale\u00fdhi wesellem) huzuryna barypdyr. Pygamberimizi\u0148 (sallallahu
  ale\u00fdhi wesellem) \u00fdanyna baranynda, i\u00e7ini gepledip: \u201eEger-de
  T\u00f6wratda \u00fd\u00fcz ke\u015fbi agzal\u00fdan adam \u015fol bolsa, \u015fobada
  o\u0148a iman getirjek\u201c di\u00fd\u00fd\u00e4rdi. \u015ee\u00fdlelikde, ol Pygamberimizi
  (sallallahu ale\u00fdhi wesellem) g\u00f6r\u00fcp-g\u00f6rm\u00e4nk\u00e4, Onu\u0148
  (sallallahu ale\u00fdhi wesellem) d\u00fcn\u00fd\u00e4sinde \u00fdalany\u0148 \u00fdoklugyna
  g\u00f6z \u00fdetiripdir we o\u0148a iman edipdir.\\nGalyberse-de, \u00e7eki\u015fme
  me\u00fddanynda teblig wezipesi \u00fderine \u00fdetirilse, Allatagalany\u0148 razylygy
  \u00fdatdan \u00e7ykarylyp bilin\u00fd\u00e4r. Seb\u00e4bi, dini wagyz ed\u00fd\u00e4n
  adam bilen wagzy di\u0148le\u00fd\u00e4n adam, olary\u0148 ikisem \u00e7eki\u015fme
  me\u00fddanynda \u00f6zlerini\u0148 men-menligini \u00f6\u0148e s\u00fcr\u00fcp,
  a\u0148satlyk bilen birek-birege per bermejek bol\u00fdar. Allatagalany\u0148 razylygy
  g\u00f6zden salyn\u00fdan bolsa, di\u00fdmek, o ta\u00fdda n\u00e4me hakda g\u00fcrr\u00fc\u0148
  edilse-de, Allatagala olardan razy d\u00e4ldir. Adamy Hak \u00fdoluna salmak Allahy\u0148
  elinde bolany \u00fc\u00e7in, Allahy\u0148 razylygyny\u0148 \u00fdok \u00fderinde
  hakykatam \u00fdokdur.\\n\u00e7) Men-menlikden p\u00e4klenmek\\nMen-menlik we egoizm
  adamy\u0148 iman ta\u00fddan k\u00e4mille\u015fmegini\u0148 \u00f6\u0148\u00fcne
  b\u00f6wet bol\u00fdar. \u015eonu\u0148 \u00fc\u00e7inem, m\u00fcr\u015fit bilen
  m\u00fcbellig \u015fe\u00fdle zy\u00fdanly du\u00fdgulardan p\u00e4klenmelidir.
  Ol di\u00fdjek zadyny pesp\u00e4llik bilen di\u00fdmelidir. Onu\u0148 pesp\u00e4lligi,
  gar\u015fysyndaky adamy o\u00fdlanmaga iterip bil\u00fd\u00e4r. Aslynda, hi\u00e7
  kimi\u0148 men-menlik etm\u00e4ge haky \u00fdokdur. Din wagyz\u00e7ysyny\u0148 \u00f6z
  zehinini, akylyny, pa\u00fdhasyny ulanyp a\u00fdd\u00fdan s\u00f6zleri hi\u00e7
  kime t\u00e4sir etm\u00e4n bil\u00fd\u00e4r. K\u00e4bir \u00fdagda\u00fdlarda-da,
  din wagyz\u00e7ysy \u00f6z wezipesini\u0148 jogapk\u00e4r\u00e7iligini du\u00fdup,
  iki s\u00f6z\u00fc\u0148 ba\u015fyny \u00e7atyp bilm\u00e4n k\u00f6senip durka-da,
  ony di\u0148le\u00fd\u00e4nler Hak \u00fdoluna girip bil\u00fd\u00e4r. Bular \u00fdaly
  \u00fdagda\u00fdlara k\u00f6p du\u015f gelse bol\u00fdar. \u015ee\u00fddip, ol adamlary\u0148
  Hak \u00fdoluna girmegine seb\u00e4p bol\u00fdar.\\nd) Adamy\u0148 a\u0148-d\u00fc\u015f\u00fcnjesini\u0148
  gurlu\u015fyny bilmek\\nBu \u00fderde \u00f6r\u00e4n \u00e4hmi\u00fdetli hasapla\u00fdan
  \u00fdene bir mesel\u00e4mi agzaman ge\u00e7ip bilmerin. Olam \u015fudur: din wagyz\u00e7ylary
  gar\u015fydaky adamy\u0148 a\u0148-d\u00fc\u015f\u00fcnjesini\u0148 gurlu\u015fyny
  doly \u00f6wrenmelidir. Mesel\u00e4 has i\u00e7gin seretmeli bolsa, h\u00e4zir yslamy
  toparlary\u0148 barlygy hakykatdyr. Bu hakykaty makullamak ba\u015fgadyr, onu\u0148
  barlygyny kabul etmek bir ba\u015fgadyr. Bar bolan bir zady kabul etm\u00e4n, g\u00f6rmezlige
  salmak \u2013 \u00e7\u00f6zg\u00fct d\u00e4ldir. Di\u00fdmek, Hak wagyz\u00e7ylary
  da\u015fyndaky \u00f6zlerine gulak as\u00fdan adamlary\u0148 ha\u00fdsydyr bir topary\u0148
  agzasydygyny \u00fda-da ha\u00fdsydyr bir jemagata degi\u015fli bolup biljekdiklerini
  \u00fdatdan \u00e7ykarmaly d\u00e4ldir. Ol kim bilen g\u00fcrr\u00fc\u0148de\u015f
  bolanynda-da, \u015fu hakykaty unutmaly d\u00e4ldir. Elbetde, ol islendik bir jemagata
  kemsidiji, a\u00fdypla\u00fdjy s\u00f6zler a\u00fdtmaly d\u00e4ldir. Has dogrusy,
  ol islendik bir jemagaty\u0148, topary\u0148 gybatyny etmeli d\u00e4ldir. Her bir
  topar, her bir jemagat \u00f6z\u00fcni\u0148 alyp bar\u00fdan \u00fdoluny dogry
  hasaplamak bilen birlikde, be\u00fdlekiler bilenem ho\u015fni\u00fdetli gatna\u015fyklary
  saklamalydyr. Bolmasa, Allatagala olardan razy bolmaz. Allatagalany\u0148 halama\u00fdan
  gylyk-h\u00e4si\u00fdetlerini \u00f6z\u00fcne \u00fdaran edinenler dini wagyz\u00e7ylykda
  asla \u00fcst\u00fcnlige \u00fdetip bilmez. Hawa, her bir Hak wagyz\u00e7ysy \u00e4hli
  toparlara hormat go\u00fdmalydyr . Onu\u0148 a\u00fdd\u00fdan her bir s\u00f6zi,
  her jemagatda dogry hasaplan\u00fdan s\u00f6zler bolmalydyr. Seb\u00e4bi, Allatagala
  \u201eAllah\u201c di\u00fd\u00fd\u00e4nleri \u00e4sgerme\u00fd\u00e4nleri, m\u00f6minleri
  ta\u0148kytlap a\u00fdypla\u00fdanlary, kelime\u00fdi t\u00f6whidi a\u00fddyp, Allahy\u0148
  birligine iman getirenler bilen gatna\u015fyklary kes\u00fd\u00e4nleri hala\u00fdan
  d\u00e4ldir we olardan razy d\u00e4ldir.\\nKim bolanynda-da, Allah bilen arabaglany\u015fygy
  bar adam bilen gatna\u015fmak \u2013 bir tarapdan, her adamy\u0148 Allaha bolan
  \u00fdakynlygyny\u0148 derejesini g\u00f6rkez\u00fd\u00e4ndir. Hak wagyz\u00e7ysy
  hakykaty d\u00fc\u015f\u00fcndir\u00fd\u00e4n adamsyny\u0148 Allaha \u00fdakynlyk
  derejesini bilmelidir. Ol \u015fu \u00f6l\u00e7ege g\u00f6r\u00e4, adamlara hakykaty
  d\u00fc\u015f\u00fcndirmelidir. M\u00fcr\u015fit we m\u00fcbelligler \u015fu \u00f6l\u00e7ege
  be\u00fdleki adamlardan k\u00e4n \u00e4hmi\u00fdet bermelidir. Olar adamlary \u00f6z
  tarapyna \u00e7ekjek bolman, ga\u00fdtam, olary g\u00f6n\u00fcden-g\u00f6ni Yslama
  \u00e7agyrmalydyr. Jemagatlary hem-de toparlary birle\u015fdirjek, olary jebisle\u015fdirjek
  i\u0148 \u00e4hmi\u00fdetli faktor, ine, \u015fu a\u0148y\u00fdeti\u0148 \u00f6smegidir.\\nS\u00f6hbetde\u015f
  bol\u00fdan adamy\u0148a d\u00fc\u015f\u00fcnmek \u00fc\u00e7in, onu\u0148 jemgy\u00fdetd\u00e4ki
  ornuny, medeni gurlu\u015fyny doly bilmeli hem-de \u00f6wrenmelidir. Bu, teblig
  etmegi\u0148 usullaryny\u0148 biri bolup dur\u00fdar. Hawa, teblig we ir\u015fad
  \u2013 bor\u00e7dur. Onu\u0148 berja\u00fd edili\u015f usulyny bilmegem \u00fdene
  bir bor\u00e7dur. Mysal \u00fc\u00e7in, sizi\u0148 gar\u015fy\u0148yza topdur \u00fdarag
  bilen \u00e7ykan du\u015fmana eli\u0148izd\u00e4ki ta\u00fdak bilen ga\u00fdtawul
  berjek bolsa\u0148yz, n\u00e4hili bolar? Hawa, siz s\u00f6we\u015fersi\u0148iz.
  Emma, s\u00f6we\u015f t\u00e4rini bilm\u00e4n s\u00f6we\u015f\u00fd\u00e4ni\u0148iz
  \u00fc\u00e7in, \u00fde\u0148li\u015fe sezewar bolarsy\u0148yz. Ine, \u015fu ze\u00fdilli
  emelsizlik tutu\u015f Yslam ara\u00e7\u00e4gine howp sal\u00fdan bolsa, onda n\u00e4me
  etmeli?! \u00ddokarda-da ga\u00fdta-ga\u00fdta bell\u00e4p ge\u00e7i\u015fimiz \u00fdaly,
  teblig etmegi\u0148 usulyny bilmek bizi\u0148 \u00fc\u00e7in ga\u00fdrago\u00fdulmasyz,
  h\u00f6kmanydyr. Teblig etmek bizi\u0148 \u00fc\u00e7in n\u00e4hili \u00e4hmi\u00fdetli
  bolsa, teblig etmegi\u0148 usullaryny bilmegem edil \u015fonu\u0148 \u00fdaly \u00e4hmi\u00fdetlidir.
  Bizi\u0148 di\u00fd\u00fd\u00e4n s\u00f6zlerimiz s\u00f6hbetde\u015f bol\u00fdan
  adamymyzy\u0148 a\u0148 derejesinden juda b\u00e4rde \u00fda-da a\u0148yrda bolsa,
  onda biz teblig etmegi\u0148 t\u00e4rini bilemzok. \u015eonu\u0148 \u00fc\u00e7inem,
  bizi\u0148 tebligimiz t\u00e4sirsiz gal\u00fdar. D\u00fc\u00fdrmegi bilen ateist
  \u00fda-da k\u00fcf\u00fcr der\u00fdasynda \u00fd\u00fcz\u00fd\u00e4n adama, elbetde,
  s\u00f6z\u00fc\u0148 ba\u015fynda tehejj\u00fct namazyny\u0148 sogaby hakda g\u00fcrr\u00fc\u0148
  berip bolmaz. O\u0148a imany\u0148 esaslaryny d\u00fc\u015f\u00fcndirmeli, d\u00fc\u015f\u00fcner
  \u00fdaly edip a\u00fdtmaly. H\u00e4zirki g\u00fcnde, k\u00fcf\u00fcr tebigy bilimlerden
  hem-de ylym-bilimden gel\u00fd\u00e4r. \u015eol seb\u00e4pden, teblig etmegi\u0148
  usuly hem ylmy bolmalydyr. Emma, \u00fdal\u0148y\u015f usul bilen adamy d\u00fczetjek
  bol\u00fdanlaram bar... Hawa, \u015fu g\u00fcn\u00fc\u0148 \u00fda\u015f neslini\u0148
  \u00fd\u00fcregi bejerilmeli wagty, olary\u0148 eginba\u015flaryna, ge\u00fdimlerine,
  i\u00e7ki g\u00f6zellikden \u00f6\u0148 da\u015fky g\u00f6zelligine \u00fcns beripdirler.
  \u015ee\u00fddip, olar bizden da\u015fla\u015fypdyr. Teblig edilende \u015fe\u00fdle
  \u00fdal\u0148y\u015flyga \u00fdol bermek \u2013 adamlary\u0148 ebedi durmu\u015fyny\u0148
  we\u00fdran bolmagyna elt\u00fd\u00e4r. \u015eonu\u0148 \u00fc\u00e7in, \u015fu
  mesel\u00e4ni\u0148 \u00fcst\u00fcnde n\u00e4\u00e7e dursa\u0148am azdyr.\\nHawa,
  gar\u015fy\u0148daky adam sa\u0148a ylym, bilim barada g\u00fcrr\u00fc\u0148 berip
  durka, sen o\u0148a \u00fd\u00f6neke\u00fdje ylmyhal kitabyny okap berse\u0148,
  n\u00e4hili bolar? Men bu \u00fderde ylmyhal kitabyny kemsitjek bolamok, di\u0148e
  gele\u0148sizlik etm\u00e4li\u0148 di\u00fdjek bol\u00fdaryn. Gar\u015fy\u0148daky
  adam \u201cahyret \u00fdok\u201d di\u00fdip durka, sen o\u0148a weliler hakda rowa\u00fdat
  g\u00fcrr\u00fc\u0148 berse\u0148, bolmaz. Adam di\u0148e du\u00fdgudan ybarat barlyk
  d\u00e4ldir. Di\u0148e du\u00fdguly heka\u00fdalar g\u00fcrr\u00fc\u0148 berip,
  adama t\u00e4sir edip bilmersi\u0148. Adamda du\u00fdgyny\u0148 \u00fdany bilen
  akylam bardyr. \u015eonu\u0148 \u00fc\u00e7in, adamy akyl ta\u00fddanam ynandyrmaly.
  Sadeddin Taftazani imany \u015fe\u00fddip d\u00fc\u015f\u00fcndir\u00fd\u00e4r:
  \u201cSen imany delilleri bilen d\u00fc\u015f\u00fcndir. Allatagala-da onu\u0148
  gursagynda iman nuruny tuta\u015fdyrar. Ine, iman budur.\u201d Galyberse-de, di\u0148e
  \u015fular \u00fdaly iman adamy ha\u00fdyr i\u015flere hem-de dini durmu\u015fy\u0148
  bitewi \u00fda\u015falmagyna iterip biler. Du\u00fdgy \u00fdelgini bilen dine go\u015fulan
  adam \u00fdene bir \u00fderde da\u015fky g\u00fc\u00fd\u00e7lerden asgyn gelip,
  dindenem \u00e7ykyp bil\u00fd\u00e4r.\\nKurany Kerim \u00f6z\u00fcni\u0148 \u00fd\u00fczler\u00e7e
  a\u00fdaty bilen tebigy bilimlere we tehnologi\u00fda y\u015farat ed\u00fd\u00e4r.
  Kuran fizika \u00fda-da himi\u00fda kitaby d\u00e4ldir. Emma, tutu\u015f adamzady
  haka \u00e7agyrmak \u00fc\u00e7in \u015fu bilimler h\u00f6kman zerurdyr. \u015eonu\u0148
  \u00fc\u00e7inem, Kurany Kerim musulmanlary \u015fol bilimleri \u00f6wrenm\u00e4ge
  \u00e7agyr\u00fdar. Astronomi\u00fda bilimini\u0148 n\u00e4meligini bilme\u00fd\u00e4n,
  biologi\u00fda biliminden \u00fd\u00fczle\u00fdem bolsa habarly bolmadyk adam Kurany
  Kerimi\u0148 k\u00f6p a\u00fdatlaryna doly d\u00fc\u015f\u00fcnip bilmez. \u00c7\u00fcnki,
  Kurany Kerimd\u00e4ki k\u00f6p a\u00fdata d\u00fc\u015f\u00fcnmek \u00fc\u00e7in,
  tebigy bilimlerden habarly bolmalydyr. Bu \u00fderde \u00e4hli bilimleri\u0148 atlaryny
  agzap, s\u00f6zi uzaldyp oturman, di\u0148e \u015fulary \u00fdatladyp ge\u00e7esim
  gel\u00fd\u00e4r. H\u00e4zirki d\u00f6wr\u00fc\u0148 Hak wagyz\u00e7ylary asyrymyzy\u0148
  bilim we tehnologi\u00fdasyndan habarly bolmalydyr. \u00ddogsam, olary\u0148 ir\u015fady,
  tutu\u015f adamzady \u00f6z i\u00e7ine alyp bilm\u00e4n, di\u0148e \u00e7\u00e4kli
  g\u00fcrr\u00fc\u0148ligine galar.\\ne) D\u00f6wre d\u00fc\u015f\u00fcnmek\\nH\u00e4zirki
  g\u00fcn, adamzady\u0148 ruhy \u00fdagda\u00fdy \u00f6werlik d\u00e4ldir. D\u00f6wr\u00fcmizi\u0148
  adamsyny\u0148 \u015fe\u00fdle g\u00f6zgyny \u00fdagda\u00fdy, esasanam, ir\u015fad
  babatda \u00fd\u00fcze \u00e7ykan \u00e7\u00f6k\u00fc\u015fler zerarlydyr. Seb\u00e4bi,
  d\u00f6wre d\u00fc\u015f\u00fcnme\u00fd\u00e4n, d\u00f6w\u00fcr bilen a\u00fdakda\u015f
  gitme\u00fd\u00e4n adam \u015fol d\u00f6wr\u00fc\u0148 adamlaryna hi\u00e7 zat d\u00fc\u015f\u00fcndirip
  bilmez. \u201cMeni\u0148 bilme\u00fd\u00e4n zadym juda k\u00e4n. Men on\u00e7a zady
  bilm\u00e4n, n\u00e4dip adamlara Haky d\u00fc\u015f\u00fcndire\u00fdin?! Di\u00fdmek,
  \u201eEmri bil magruf, neh\u00fdi anil m\u00fcnker\u201d wezipesini berja\u00fd
  etmek meni\u0148 borjuma girme\u00fd\u00e4r\u201d di\u00fdmeli d\u00e4l. Eger-de
  ynsanlara Haky d\u00fc\u015f\u00fcndirmek \u00fc\u00e7in \u00fdyldyzlara baryp ga\u00fdtmalam
  bolsa, dini d\u00fc\u015f\u00fcndirmek \u00fc\u00e7in \u00fdyldyzlardan maglumat
  getirmelem bolsa, \u015fol \u00fdere baryp ga\u00fddyp, o ta\u00fddan getirlenleri
  m\u00e4t\u00e4\u00e7lere pa\u00fdlamak \u2013 parzlary\u0148 hem parzydyr.\\nAdamzady
  fizika bilen dyza \u00e7\u00f6kerdiler. \u015eu d\u00f6wr\u00fc\u0148 adamsyny himi\u00fda
  bilen oka tutdular. Astronomi\u00fda bilen olary\u0148 depesine \u00fdyldyz \u00fdagdyrdylar.
  Be\u00fdle bolsa, bular \u00fdaly \u00fdagda\u00fdda senem eli\u0148i gow\u015furyp
  oturyp bilmersi\u0148. Hawa, senem \u015fol \u201e\u00fdaraglary\u201c ulanmalysy\u0148.
  Sen adamzady\u0148 elinden tutup galdyrmalysy\u0148. Olary\u0148 maddy-ruhy \u00fdaralaryna
  melhem \u00fdapmalysy\u0148. Bu seni\u0148 borju\u0148dyr. Sen olary\u0148 elinden
  tutup galdyr. Go\u00fd, olar ga\u00fddyp hi\u00e7 ha\u00e7an \u00fdykylmasyn, s\u00fcr\u00e7mesin!
  Go\u00fd, olar \u00fdaman ni\u00fdetli g\u00fc\u00fd\u00e7leri\u0148 a\u00fdagyny\u0148
  astynda basgylanmasyn! \u00c4lemd\u00e4ki her bir hadysany\u0148, her bir barlygy\u0148
  \u00f6z dili bardyr. Allaha iman ed\u00fd\u00e4nler \u015fol dile d\u00fc\u015f\u00fcnmelidir.
  \u00ddogsam, tekwini a\u00fdatlara \u2013 tebigy bilimlere asla d\u00fc\u015f\u00fcnip
  bolmaz. Tekwini a\u00fdatlara d\u00fc\u015f\u00fcnme\u00fd\u00e4n adam \u00fda-da
  halklar zelillige du\u00e7ar bolar. E\u00fdsem-de, Kurany Kerim \u00f6z a\u00fdatlary
  bilen tekwini a\u00fdatlary\u0148 \u00fcst\u00fcnde durup, olara d\u00fc\u015f\u00fcndiri\u015f
  ber\u00fd\u00e4r. Ine, \u015fu hakykatlary e\u015fitmejek bolup gulagyna barmagyny
  dyk\u00fdan adam her g\u00fcn Kurany ba\u015fdan-a\u00fdak okasa-da, Kurany\u0148
  hakyky manysyna asla d\u00fc\u015f\u00fcnip bilmez. Kuran \u2013 ondaky a\u00fdatlary\u0148
  \u00e4hlisine bitewilikde akyl \u00fdetirilsin di\u00fdip iberilipdir. Kim Kurana
  e\u00fde \u00e7yk\u00fdan di\u00fd\u00fd\u00e4n bolsa, muny berk bellemelidir.\\nHawa,
  bizi\u0148 d\u00fc\u015f\u00fcndir\u00fd\u00e4n hakykatlarymyz hern\u00e4\u00e7e
  mukaddes, sogaply bolsa bolubersin, eger-de biz d\u00f6wr\u00fc\u0148 d\u00fc\u015f\u00fcnjesine,
  a\u0148y\u00fdetine hem-de nazaryna g\u00f6r\u00e4 i\u015f alyp barma\u00fdan bolsak,
  onda ed\u00fd\u00e4n i\u015fimiz netijesiz bolar. Seb\u00e4bi, dini, Kurany Kerimi
  akyl, zehin hem-de pikir s\u00fczg\u00fc\u00e7lerinden ge\u00e7irip bolma\u00fdan
  syrly meseleler \u00fdaly edip d\u00fc\u015f\u00fcndirse\u0148, adamlary\u0148 kellesi
  garja\u015f\u00fdar.\\nSahabalar \u00f6z d\u00f6wr\u00fcni\u0148 medeni derejesinden
  has \u00fdokardady. Olar s\u00f6hbetde\u015f bol\u00fdan adamlaryna dine degi\u015fli
  meseleleri \u015fol d\u00f6wr\u00fc\u0148 medeni derejesine la\u00fdyk d\u00fc\u015f\u00fcndirip
  bil\u00fd\u00e4rdiler. Olardan so\u0148 \u00fda\u015fap ge\u00e7en be\u00fdik \u015fahsy\u00fdetlerem
  \u015fe\u00fddipdirler. Mysal \u00fc\u00e7in, \u00f6z asyryny\u0148 i\u0148 be\u00fdik
  din alymy hasaplan\u00fdan Ymam Gazalyny\u0148 wagyzlaryny \u015fol d\u00f6wr\u00fc\u0148
  adamlary ha\u00fdran galyp di\u0148l\u00e4pdirler. Ine, \u015fol ha\u00fdranlyk
  asyrlarbo\u00fdy dowam edipdir. Gibb, Renan \u00fdaly g\u00fcnbatarlylary\u0148
  Ymam Gazaly barada a\u00fddanlaryna \u00fcns\u00fc\u0148izi \u00e7ekesim gel\u00fd\u00e4r:
  \u201cBiz Gazaly \u00fdaly, \u00f6z d\u00f6wr\u00fcni\u0148 medeni\u00fdetine akyl
  \u00fdetiren ikinji bir adama du\u015fmadyk.\u201d. Ymam Rabbaniler, M\u00f6wlana
  Halidi Bagdadylar we olar \u00fdaly, \u00f6z asyryny\u0148 depesinde g\u00fcller
  mysaly a\u00e7ylan be\u00fdik \u015fahsy\u00fdetleri\u0148 baryny\u0148, \u015fol
  d\u00f6wr\u00fcrd\u00e4ki ylym hem medeni\u00fdetden \u00fd\u00fcki \u00fdetikdi.
  Olar \u00f6z d\u00f6w\u00fcrlerini\u0148 \u00f6\u0148\u00fcnde \u00fd\u00f6re\u00fd\u00e4rdiler.
  Olary\u0148 mertebelerini bilmek \u00fc\u00e7in, olary\u0148 adamlary n\u00e4dip
  dine \u00e7agyr\u00fdanyna seretmelidir. \u015eonu\u0148 \u00fc\u00e7inem, olary\u0148
  dilinden \u00e7yk\u00fdan s\u00f6zleri\u0148 bary adamlary\u0148 kalbyna si\u0148\u00fd\u00e4rdi
  hem-de halk tarapyndan goldaw tap\u00fdardy.\\nf) M\u00fcr\u015fit ugurtapyjy bolmaly\\nM\u00fcr\u015fit
  \u00f6z\u00fcni nirede, n\u00e4hili alyp barmalydygyny bilmelidir. Ol k\u00e4 \u00fderde
  u\u00e7udy\u0148 d\u00fc\u00fdb\u00fcne barmalam bol\u00fdar. K\u00e4 \u00fderde
  bolsa, ol minarany\u0148 \u00e7\u00fcr ba\u015fyna-da \u00e7ykmaly bol\u00fdar.
  Seb\u00e4bi, ol her hili adamlar bilen s\u00f6hbetde\u015f bol\u00fdar. Bu onu\u0148
  \u201cmedeni\u00fdet\u201d \u00e7arhyny\u0148 uly bolmalydygyny g\u00f6rkez\u00fd\u00e4r.
  Be\u00fdle d\u00e4ller m\u00fcr\u015fit d\u00e4ldir. Ga\u00fdtam tersine, olar ir\u015fad
  \u00fdolunda b\u00f6wet bol\u00fdarlar. Be\u00fdle adamlar \u00fdoldan a\u00fdrylmaly.
  Olar, \u015fu haly peri\u015fan nesli halas etmek \u00fc\u00e7in gel\u00fd\u00e4n
  hakyky m\u00fcr\u015fitlere \u00fdol bermelidir.\\nBe\u00fdik \u015fahsy\u00fdeti\u0148
  biri \u015fe\u00fdle di\u00fd\u00fd\u00e4r: \u201cBir \u00fda\u015f \u00fdigidi\u0148
  imansyzlygyny g\u00f6rende, dine ynan\u00fdan adamy\u0148 \u00fd\u00fcregi bedenini\u0148
  atomlaryny\u0148 sany\u00e7a b\u00f6lek-b\u00f6lek bolmalydyr...\u201d Ine, hunaba
  \u00fduwud\u00fdan \u00fd\u00fcrek \u015fudur. \u00dda\u015flary\u0148 imansyzlyga
  tarap bar\u00fdanyny g\u00f6r\u00fcp, ine, \u015fular \u00fdaly derdinme\u00fd\u00e4nler
  ir\u015fad we teblig wezipesine asla mynasyp d\u00e4ldir. M\u00fcr\u015fit d\u00f6wre
  d\u00fc\u015f\u00fcnmeli, emma, ol \u015fol bir wagty\u0148 \u00f6z\u00fcnde d\u00fcn\u00fd\u00e4
  aldanmalam d\u00e4l. Hatda gerek bolsa, ol jennetem \u00fdatdan \u00e7ykarmalydyr.
  Ol \u00f6z\u00fcne berlen her wezip\u00e4ni \u015fu d\u00fc\u015f\u00fcnje bilen
  \u00fderine \u00fdetirm\u00e4ge \u00e7aly\u015fmalydyr. Ine, \u015fe\u00fdtse, Allatagala-da
  ony \u00fcst\u00fcnlige elter we da\u015fyndaky adamlaram o\u0148a ynanar.\\nBiz
  \u00f6\u0148em, kime din d\u00fc\u015f\u00fcndiril\u00fd\u00e4n bolsa, \u015fol
  adamy \u00fdakyndan tanamagy\u0148 zerurlygyny bell\u00e4pdik. Hawa, teblig wezipesini
  \u00fderine \u00fdetir\u00fd\u00e4n adamy\u0148 bor\u00e7laryny\u0148 birem \u015fudur.
  Keseli anyklaman, onu\u0148 \u00f6\u0148\u00fcni alyp bolma\u00fdar. Edil \u015fonu\u0148
  \u00fdalam, kime din d\u00fc\u015f\u00fcndiril\u00fd\u00e4n bolsa, ol adamy\u0148
  n\u00e4hili keselini\u0148 barlygyny anyklaman, ony bejerm\u00e4ge synany\u015fmak
  uly \u00fdal\u0148y\u015flykdyr. Her dermany\u0148 her bir \u00fdara melhem bolup
  bilme\u00fd\u00e4ni hemm\u00e4 m\u00e4lim bolsa gerek!\\nK\u00e4bir adamlary bil\u00fd\u00e4rin,
  olar fabrigi\u0148 stanoklaryndan ba\u015fga zady pikir edenoklar. Olary\u0148 bileni-biteni
  ykdysady\u00fdet, ma\u00fda go\u00fdum we agyr senagaty\u0148 \u00e4hmi\u00fdetidir.
  Bu hili adamlar, adamzady\u0148 bagtly durmu\u015fyny di\u0148e \u015fu \u00fdol
  bilen dikeldip bolar di\u00fdip d\u00fc\u015f\u00fcn\u00fd\u00e4rler. Olary\u0148
  \u015fu tutumlary Marksy\u0148 we Engelsi\u0148 pikirlerini, nazar\u00fdetlerini
  ga\u00fdtalamakdan ybaratdyr. H\u00e4zirki g\u00fcnde, \u00e7amalagy \u00e7a\u015fan
  bu nazar\u00fdetler \u00f6zlerini\u0148 \u00fda\u015famagyny bes etdiler. Ine, \u015fu
  nazar\u00fdetlere gulluk ed\u00fd\u00e4n adamlar n\u00e4dip adamzada dirilik e\u00e7ilsin?
  Adamy\u0148 akyly \u00fderinde bolup, n\u00e4dip be\u00fdle \u00fdalana \u00fd\u00fcz
  ur\u00fdanyna ge\u0148 gala\u00fdmaly. Men aldanandygymyzy bo\u00fdun almaga namys
  ed\u00fd\u00e4rin. \u00ddok, \u00fdok! Siz \u00fda\u015f nesli\u0148 ruhy d\u00fcn\u00fd\u00e4lerini
  g\u00f6zden salsa\u0148yz, olary ruhy h\u00f6rek bilen i\u00fdmitlendirmese\u0148iz
  we olary\u0148 a\u0148yna ahyret d\u00fc\u015f\u00fcnjesini gu\u00fdmasa\u0148yz,
  onda guran \u00fda-da gurjak fabrikleri\u0148izem \u2013 hi\u00e7 zadam ony dogry
  \u00fdola salyp bilmez. Hawa, \u015fu g\u00f6de\u0148siz, sergezdan nesillere terbi\u00fde
  berilmese, olar ruhy ta\u00fddan do\u00fdrulmasa, onda olary\u0148 ruhuny hi\u00e7
  hili fantastiki \u00fda-da aja\u00fdyp pikirler bilen do\u00fdrup bolmaz. \u015eonu\u0148
  \u00fc\u00e7inem, nesilleri\u0148 \u00fdaralaryna ykdysady \u00e7\u00f6zg\u00fctler
  bilen em edip boljagyna ynanmak \u2013 gaflaty\u0148 hut \u00f6z\u00fcdir.\\nH\u00e4zirki
  g\u00fcn, d\u00f6w\u00fcr bilen a\u00fdakda\u015f gidip bilm\u00e4ni \u00fc\u00e7in
  Yslam d\u00fcn\u00fd\u00e4sini k\u00fcrs\u00e4 \u00e7ykaranoklar. \u015eu wagt,
  Yslam d\u00fcn\u00fd\u00e4sine g\u00fcrlem\u00e4ge asla nobat berlenok. Ol di\u0148e
  di\u0148l\u00e4p o\u0148maly bol\u00fdar. Ol, bolmanda, a\u00fddyl\u00fdan geplerden
  many \u00e7ykarmagy ba\u015farsady. Belki, \u015fonda ha\u00e7anam bolsa bir g\u00fcn
  ol t\u00e4zeden, g\u00fcrle\u00fd\u00e4n hem-de s\u00f6z\u00fcni di\u0148led\u00fd\u00e4n
  liderlik basgan\u00e7agyna \u00e7ykyp bilerdi. Emma, ol \u00fc\u015f\u00fckli di\u0148le\u00fdjem
  bolup bilmedi. Umuman alany\u0148da, Yslam d\u00fcn\u00fd\u00e4si bula\u015fdy we
  bu bula\u015fyklyk hususy hyzmatlara hem-de \u00f6zba\u015fdak d\u00f6re\u00fdi\u015flere-de
  erbet t\u00e4sir etdi. Olaram \u00f6zlerini\u0148 i\u015fle\u015f\u00fd\u00e4n,
  gatna\u015f\u00fdan adamlaryny\u0148 \u00f6\u0148\u00fcnde arka\u00fdyn g\u00fcrl\u00e4p
  bilmediler. Bizi\u0148 elimizde, tutu\u015f \u00e4leme be\u00fdlede dur di\u00fd\u00fd\u00e4n
  we adamzada hakykaty d\u00fc\u015f\u00fcndir\u00fd\u00e4n Kurany Mugjyzul Be\u00fdan
  bardyr. \u00ddene-de bizi\u0148 elimizde Kurany Kerimi bize i\u0148 gowy usulda
  d\u00fc\u015f\u00fcndir\u00fd\u00e4n Allah Resulyny\u0148 (sallallahu ale\u00fdhi
  wesellem), \u00f6lmez-\u00fditmez s\u00fcnnetleri bardyr. Gynansak-da, biz h\u00e4zire
  de\u0148i\u00e7 \u015fulardan pe\u00fddalanyp bilm\u00e4ndiris. \u00dd\u00fcrek
  bilen zehin bitewiligine \u00fdetip, edil guwwas \u00fdaly, Kuran ummanyna \u00e7\u00fcm\u00fcp
  bilm\u00e4ndiris. \u015eol seb\u00e4pdenem, biz Kurany\u0148am, s\u00fcnneti\u0148em
  n\u00e4me di\u00fd\u00fd\u00e4nine d\u00fc\u015f\u00fcnip bilemzok. Eger-de bizi\u0148
  bu bol\u015fumyz \u00fc\u00fdtgemese, onda biz Kuran bilen s\u00fcnnete hi\u00e7
  ha\u00e7an d\u00fc\u015f\u00fcnip bilmeris we \u015fu d\u00f6wr\u00fc\u0148 musulmanlary
  haosdan asla g\u00f6z\u00fcni a\u00e7yp bilmezler.\\nHawa, d\u00fcn\u00fd\u00e4
  k\u00e4mille\u015f\u00fd\u00e4r. Bilim hem-de tehnologi\u00fda g\u00fcn-g\u00fcnden
  \u00f6s\u00fd\u00e4r. \u00dd\u00f6ne k\u00e4birlerimizi\u0148 di\u00fd\u00fd\u00e4n
  zadymyz \u00f6zger\u00fd\u00e4n d\u00fcn\u00fd\u00e4mizi\u0148 \u00f6l\u00e7egine
  gabat gelenok. Biz yzda galan \u00fc\u00e7 asyr bilen g\u00fc\u00fdmenip \u00fd\u00f6r\u00fcs.
  \u015eu g\u00fcn\u00fc\u0148 \u00fda\u015flary bilen bolsa, asla derdin\u015femzok.
  \u015eonu\u0148 \u00fc\u00e7inem, bizi\u0148 di\u00fd\u00fd\u00e4nimize hi\u00e7
  kim gulak asanok.\\ng) D\u00f6wr\u00fc\u0148 perspektiwasyndan seretmek\\n\u015eu
  g\u00fcn\u00fc\u0148 m\u00fcr\u015fit we m\u00fcbelligi \u00f6z\u00fcni\u0148 d\u00fc\u015f\u00fcndirjek
  meselelerini, \u00fda\u015fa\u00fdan d\u00f6wr\u00fcni\u0148 perspektiwasyndan seredip
  d\u00fc\u015f\u00fcndirmelidir. Ol, kime din d\u00fc\u015f\u00fcndirjek bolsa, ba\u015fdan
  \u015fol adamy\u0148 ruhy gurlu\u015fyny doly \u00f6wrenmeli, so\u0148 bolsa onu\u0148
  be\u00fdnisine s\u00fcnj\u00fcl\u00fd\u00e4n hem-de awy p\u00fcrk\u00fd\u00e4n problemalary
  bilmelidir. Ol a\u00fdtjak her bir s\u00f6z\u00fcni \u015fu d\u00fc\u015f\u00fcnje
  esasynda a\u00fdtmaly. \u015eonda, onu\u0148 a\u00fdd\u00fdanlary adamy\u0148 \u00fd\u00fcregine
  j\u00fc\u0148k bolar. \u015eu d\u00f6wr\u00fc\u0148 \u00fda\u015f nesilleri gan
  \u00fditir\u00fd\u00e4r, biz bolsa olara penselin sanj\u00fdarys.\\nBular meni\u0148
  hy\u00fdaly pikirim d\u00e4l-de, Kurany Kerimde we Pygamberimizi\u0148 (sallallahu
  ale\u00fdhi wesellem) s\u00fcnnetinde kesgitlenilen meselelerdir.\\nKurany Kerim:
  \u201cSeni \u00fdaradan Rebbi\u0148 ady bilen oka!\u201d (Alak, 96/1) di\u00fdmek
  bilen, entek birinji a\u00fdatda tekwini a\u00fdatlara \u2013 \u00fdaradyly\u015f
  hem-de d\u00f6re\u00fdi\u015f \u00fdaly meselelere \u00fcnsi \u00e7ek\u00fd\u00e4r.
  Pelsepe\u00e7ileri\u0148 bary, Epikurdan Demokrite \u00e7enli, Demokritden Sokrata
  \u00e7enli, Sokratdan Platona \u00e7enli, ondanam t\u00e4 Pygamberimizi\u0148 (sallallahu
  ale\u00fdhi wesellem) d\u00f6wr\u00fcnde \u00fda\u015fap ge\u00e7enlere \u00e7enli,
  \u00e4hlisi di\u00fden \u00fdaly, \u00fdaradyly\u015f meselesi bilen gyzyklanypdyrlar
  we \u015fony \u00f6wrenm\u00e4ge \u00e7al\u015fypdyrlar. Di\u00fdmek, \u015fol wagtlar
  adamlary\u0148 \u00fdaradyly\u015f barada, azam bolsa, bil\u00fd\u00e4n maglumatlary
  bolupdyr. Olaram adamy\u0148 bir damja suwdan emele gel\u00fd\u00e4nini we embriony\u0148
  ene garnynda d\u00fcrli etaplar arkaly \u00f6s\u00fd\u00e4nini bil\u00fd\u00e4rdiler.
  Emma, Kurany Kerim \u015fu mesel\u00e4 \u00f6r\u00e4n gi\u0148 perspektiwadan seretdi
  we adamlara: \u201cA\u00fdt: \u00dder \u00fd\u00fcz\u00fcne a\u00fdlanyp \u00e7yky\u0148
  we \u00fdaradyly\u015fy\u0148 n\u00e4dip ba\u015flananyna bir seredi\u0148!\u201d
  (Ankebut, 29/20) di\u00fddi. Muny di\u00fdmegini\u0148 seb\u00e4bi bolsa, h\u00e4zire
  de\u0148i\u00e7 hi\u00e7 kimi\u0148 be\u015feri ylym hem-de be\u015feri nazar\u00fdetler
  bilen \u00fdaradyly\u015fy\u0148 n\u00e4dip ba\u015flanyny d\u00fc\u015f\u00fcndirip
  bilme\u00fd\u015fidir. So\u0148am d\u00fc\u015f\u00fcndirip bilmez. Hawa, Allatagala
  bilen delillendirm\u00e4n, \u00fdaradyly\u015fy asla d\u00fc\u015f\u00fcndirip bolmaz.\\nKurany
  Kerim ba\u015fdan, hi\u00e7 kimi\u0148 d\u00fc\u015f\u00fcndirip bilmedik \u015fe\u00fdle
  \u00e7yl\u015fyrymly meselesini\u0148 \u00fcst\u00fcni a\u00e7yp g\u00f6rkez\u00fd\u00e4r.
  \u015ee\u00fddip, Kuran tekwini a\u00fdatlara-da \u00fcnsi \u00e7ek\u00fd\u00e4r.
  Tekwini a\u00fdatlar \u2013 be\u00fdik \u00ddaradany\u0148 gudraty hem eradasy bilen
  \u00e4lemi\u0148 bo\u00fdnuna dakylan m\u00fc\u0148 \u00f6w\u00fc\u015fginli g\u00fcl\u00fdakadyr,
  syn etmek \u00fc\u00e7in a\u00e7ylan sergidir we okamagymyz \u00fc\u00e7in kitapdyr.
  Ine, biz \u015fu kitaby, \u015fu sergini, \u015fu g\u00fcl\u00fdakany i\u00e7gin
  \u00f6wrenmelidiris. Biz hadysalara hern\u00e4\u00e7e akyl \u00fdetirm\u00e4ge synany\u015fsagam,
  Kurany\u0148 g\u00f6rkezen \u00e7\u00e4ginden da\u015fyna \u00e7ykyp bilmeris.\\nTekwini
  a\u00fdatlary nazara alman, adamyny di\u0148e du\u00fdgy hem hy\u00fdal jo\u015fgunlygy
  bilen a\u00fdak \u00fcst\u00fcnde saklamaga \u00e7aly\u015fmak \u00fdal\u0148y\u015fdyr.
  Hak wagyz\u00e7ylary \u00f6z \u015f\u00e4girtlerini\u0148 \u00fd\u00fcregini hem
  zehinini de\u0148 derejede k\u00e4mille\u015fdirmelidirler. \u015e\u00e4girtlerini
  d\u00f6wr\u00fc\u0148 talabyna la\u00fdyk ta\u00fd\u00fdarlamalydyrlar. \u015ee\u00fdlelikde,
  \u00fd\u00fcrek bilen zehini\u0148 arasyndaky baglan\u015fyk asla gow\u015famaz.
  Wagt \u015fu baglan\u015fyga zy\u00fdan \u00fdetirip bilmez. Bolup ge\u00e7\u00fd\u00e4n
  wakalar bolsa, \u015fol baglan\u015fygy kuwwatlandyryp, ynsany\u0148 erk-eradasyny
  t\u00f6rp\u00fcl\u00e4r.\\nh) Adamy\u0148 derejesini bilmek\\nK\u00e4 \u00fdagda\u00fdlarda,
  biz \u00fd\u00fczlen\u00fd\u00e4n adamymyzy\u0148 derejesine \u00f6z\u00fcmiz barmaly
  bol\u00fdarys. Di\u00fdmek, Hak wagyz\u00e7ysy di\u00fd\u00fd\u00e4n s\u00f6z\u00fcni
  gar\u015fydaky adamy\u0148 zehin derejesine baryp di\u00fdmelidir.\\n\u015eu d\u00fc\u015f\u00fcnj\u00e4ni
  abstraktlykdan saplamak \u00fc\u00e7in, \u015fe\u00fdle d\u00fc\u015f\u00fcndiri\u015f
  berip bolar. Kime din d\u00fc\u015f\u00fcndiriljek bolsa, \u015fol adamy\u0148 zehin
  derejesine baryp d\u00fc\u015f\u00fcndirmek \u2013 ylahy ahlakdyr. Pygamber Serwerimiz
  (sallallahu ale\u00fdhi wesellem) bolsa bizi Allahy\u0148 ahlagyny nusga edinm\u00e4ge
  \u00e7agyr\u00fdar. Kuran ba\u015fdan-a\u00fdak, adamy\u0148 akyl \u00fdetirip,
  d\u00fc\u015f\u00fcnip biljek ylahy kelamydyr. \u00ddagny Allatagala Kurany Kerimde
  ynsany\u0148 d\u00fc\u015f\u00fcnip biljek dilinde g\u00fcrl\u00e4pdir.\\nHawa,
  eger Allatagala Kurany Kerimde, Tur dagynda hezreti Musa (a.s) bilen g\u00fcrle\u015fen
  kelamy bilen s\u00f6zl\u00e4n bolsady, onda bizi\u0148 o\u0148a d\u00fc\u015f\u00fcnm\u00e4ge
  g\u00fc\u00fdj\u00fcmiz \u00fdetmezdi. Kuran di\u0148e genileri\u0148 hem-de a\u00fdratyn
  zehinli adamlary\u0148 d\u00fc\u015f\u00fcnjek dilinde iberilen bolsady, adamlary\u0148
  togsan dokuz g\u00f6terimi Kurandan pe\u00fddalanyp bilmezdi. Emma, be\u00fdle d\u00e4l.
  Allatagala \u00f6z\u00fcni\u0148 be\u00fdikligi hem-de rububi\u00fdeti (Allatagalany\u0148
  her mahluga her wagt, her \u00fderde m\u00e4t\u00e4\u00e7 bolan zatlaryny bermegi
  we olary terbi\u00fdelemegi) bilen birlikde, eradasyna la\u00fdyklykda adamlary\u0148
  \u00fdagda\u00fdyny g\u00f6z \u00f6\u0148\u00fcnde tut\u00fdar we olar bilen \u015fe\u00fddip
  g\u00fcrle\u015f\u00fd\u00e4r. Allatagalany\u0148 kelamy di\u0148e Kuran bilen \u00e7\u00e4klenme\u00fd\u00e4r.
  Kim bil\u00fd\u00e4r, Allatagala \u00f6z\u00fcni\u0148 be\u00fdikligi bilen, g\u00f6r,
  n\u00e4hili \u00e4he\u0148de g\u00fcrl\u00e4p bil\u00fd\u00e4ndir. \u00dd\u00f6ne
  biz \u015folary bilemzok. Bizi\u0148 bar bil\u00fd\u00e4n zadymyz \u015fu: Allatagala
  hemi\u015fe \u00f6z\u00fcni\u0148 ehady\u00fdet (Allahy\u0148 her bir zatda \u00f6z\u00fcni\u0148
  \u00fdeke-t\u00e4kligini g\u00f6rkezmegi) hakykaty bilen adamlara, olary\u0148 zehin
  derejesine g\u00f6r\u00e4 \u00fd\u00fczlenipdir.\\nBiz Kurany Kerimde \u00f6z derej\u00e4mizi
  a\u00e7\u00fdarys. Kuran her kim bilen edil \u00f6z derejesinde g\u00fcrle\u015f\u00fd\u00e4n
  \u00fdaly. Adamy\u0148 zehin derejesi n\u00e4hili bolsa bolubersin. Her bir adam
  Kurany\u0148 a\u00fdatlarynda \u00f6z ruhy \u00fdagda\u00fdyny du\u00fd\u00fdar.
  Hawa, her kimem Kurany Kerimi okanynda, \u00fd\u00fcrekde\u015f bir dostu\u0148
  seni\u0148 syrlary\u0148a de\u0148i\u00e7 bar zady\u0148y a\u00fddyp ber\u00fd\u00e4n
  \u00fdaly, du\u00fdgyny ba\u015fdan ge\u00e7irip bil\u00fd\u00e4r.\\nB\u00e4rde
  ge\u0148 g\u00f6resi zat \u00fdok. Bu \u015fe\u00fdle bola\u00fdmalam. Seb\u00e4bi,
  Kuran \u2013 adamy \u00fdaradan hem-de onu\u0148 gursagyna dem salan Allahy\u0148
  kelamydyr. Allatagala adamy \u00fdokdan bar edipdir. Allah adamy maddy \u00e4lemde
  \u00fdasap, o\u0148a gudrat \u00e4leminden ruh beripdir. Ne ruh \u00f6z da\u015fyna
  ge\u00fddirilen bedenden, ne-de beden \u00f6z i\u00e7ine salnan ruhdan habarlydyr.
  Olary\u0148 ikisinem kim \u00fdaradan bolsa, olary i\u0148 o\u0148at tana\u00fdanam
  \u015foldur. Ine, Kuranam \u015fol be\u00fdik Gudraty\u0148 kelamadyr.\\nBu ylahy
  kelamy\u0148 her bir s\u00f6zi adamlary hak \u00fdoluna elt\u00fd\u00e4n \u00e7e\u015fmedir.
  Edil \u015fonu\u0148 \u00fdaly, \u00e4hli din wagyz\u00e7ylaryny\u0148 Haka \u00e7agyrmakda
  ulan\u00fdan usuly \u00f6z g\u00f6zba\u015fyny Kurandan alyp ga\u00fdd\u00fdar.
  Dini wagyz ed\u00fd\u00e4n adam Kurana seretmeli we adamlar bilen n\u00e4dip g\u00fcrle\u015fmelidigini
  Kurandan \u00f6wrenmelidir.\\nKurany Kerimi\u0148 d\u00fcrli derejed\u00e4ki adamlara
  \u00fd\u00fczlen\u00fd\u00e4ndigi hakykatdyr. Seb\u00e4bi, Ol \u2013 adamy \u00e4hli
  a\u00fdratynlyklary bilen \u00fdaradan we \u00fdugran Allatagalany\u0148 kelamydyr.
  \u015eu g\u00fcne de\u0148i\u00e7 gelip-ge\u00e7en m\u00fc\u0148ler\u00e7e alymlary\u0148
  derejesini, olary\u0148 Kuran hakdaky pikirleri bilen \u00f6l\u00e7ese bol\u00fdar.
  Sagadat asyrynda-da \u00fdagda\u00fd \u015fe\u00fdledi. Sahabalary\u0148 Kurana
  d\u00fc\u015f\u00fcni\u015f derejesi de\u0148 d\u00e4ldi. Olary\u0148 zehin derejeleri
  d\u00fcrli-d\u00fcrli bolany bilen, olary\u0148 hersi \u00f6z\u00fc\u00e7e Kurandan
  pe\u00fddalanyp bil\u00fd\u00e4rdi.\\nO\u00fdlanyp g\u00f6r\u00fc\u0148! Allah Resulyny\u0148
  (sallallahu ale\u00fdhi wesellem) d\u00f6wr\u00fcnde \u00fda\u015fan \u00e7arwa
  araby\u0148 biri gelip Kurany di\u0148le\u00fd\u00e4r-de, ruhuna hem a\u0148yna
  Kurany\u0148 nuruny si\u0148dirmegi ba\u015far\u00fdar. \u015eol d\u00f6w\u00fcrde
  \u00fda\u015fan we \u00fdazan go\u015fgulary K\u00e4bede asylan be\u00fdik \u015fahyrlara-da
  Kuran bi\u00e7ak t\u00e4sir edipdir. \u015ee\u00fdle \u015fahyrlary\u0148 biri Lebiddir.
  Ol Kurany di\u0148l\u00e4ninden so\u0148, go\u015fgy \u00fdazmagyny bes edipdir.
  Hansa atly zenan \u015fahyram Kurana a\u015fyk bolan be\u00fdik ynsanlary\u0148
  biridi. Hawa, Kuran olary\u0148 d\u00fcn\u00fd\u00e4sine \u015fu j\u00e4htden arala\u015f\u00fdardy.
  \u015eonu\u0148 \u00fc\u00e7inem, olary\u0148 \u00fd\u00fcregi hem-de zehini Kurany\u0148
  pa\u00fdhasyndan zerrin bolup do\u00fd\u00fdardy. Ibn Sina, Ibni R\u00fc\u015fd,
  Faraby, Ymam Gazaly, Fahreddin Razi, Ebu Hanife, Ymam \u015eapyg, Ymam Ahmed bin
  Hanbel, Ymam M\u00e4lik we atlary tutulmadyk \u00fdene-de sanardan k\u00f6p be\u00fdik
  \u015fahsy\u00fdetleri\u0148 bary Kurana imrinipdir we olar Kurany\u0148 mekdebinden
  ge\u00e7ipdirler. Di\u00fdmek, Kuran olara-da birme\u0148ze\u015f \u00fd\u00fczlenipdir.\\nHawa,
  Kuran adamy\u0148 zehin derejesini her ugurda g\u00f6z \u00f6\u0148\u00fcnde tutupdyr.
  Kurandaky her bir s\u00f6z d\u00fc\u015f\u00fcner \u00fdaly edip a\u00fddylypdyr.
  Kuran \u015fe\u00fdle usullara juda ba\u00fddyr. Ony \u00e7yn \u00fd\u00fcrekden
  di\u0148l\u00e4n islendik adam Kurany\u0148 s\u00f6zlerini di\u0148e \u00f6z\u00fcne
  a\u00fddylandyr \u00f6\u00fdd\u00fd\u00e4r. Bilim we tehnologi\u00fda g\u00fcn-g\u00fcnden
  m\u00f6w\u00e7 alyp \u00f6s\u00fd\u00e4r, \u00f6zger\u00fd\u00e4r. Bilimi\u0148
  her ugrundan di\u00fden \u00fdaly, biri-birinden g\u00fc\u00fd\u00e7li alymlar d\u00f6re\u00fd\u00e4r.
  Be\u00fdik \u00ddaradan alym adamlary\u0148 zannyna ukyp gu\u00fdupdyr. Olar \u015fol
  ukyplaryny \u00f6sd\u00fcrmek \u00fc\u00e7in, be\u00fdik \u00ddaradany\u0148 \u00e4lemde
  go\u00fdan kanunlaryny \u00f6wrenip, ussatlyga \u00fdetmelidirler. \u015eunu\u0148
  bilen birlikde, olar \u00f6zlerini\u0148 i\u0148 esasy diregi, be\u00fdik \u00ddaradany\u0148
  ezeli kelamy bolan Kurany \u00fdanlaryndan a\u00fdyrmaly d\u00e4ldirler.\\nHawa,
  m\u00fc\u0148ler\u00e7e alymy\u0148 zehin derejeleri d\u00fcrli-d\u00fcrli bolsa-da,
  olary\u0148 baram Kurandan pe\u00fddalanyp, Kurany\u0148 sa\u00fdasynda sa\u00fdalap
  bil\u00fd\u00e4rler. Himik Kurany di\u0148e \u00f6zi \u00fc\u00e7in \u00fdazylan
  kitap h\u00f6km\u00fcnde di\u0148l\u00e4p bil\u00fd\u00e4r. Di\u0148e olmy? Elbetde,
  \u00fdok. Fizik hem, astronom hem, biolog hem, hatda matematik hem, arhitektor hem...
  Kurany\u0148 a\u00fdatlaryna \u00f6z dillerinde g\u00fcrle\u00fd\u00e4ni di\u0148le\u00fd\u00e4n
  \u00fdaly, d\u00fc\u015f\u00fcnip bilerler. Kurany oba hojalyk\u00e7y okasa, onu\u0148
  g\u00f6wn\u00fcne, Kuran ba\u015fdan-a\u00fdak oba hojalykdan g\u00fcrr\u00fc\u0148
  ber\u00fd\u00e4n \u00fdaly bolup g\u00f6r\u00fcn\u00fd\u00e4r. Lukman \u00fc\u00e7in
  bolsa, Kurany Kerim keselleri anyklamakda hem bejermekde t\u00e4ze-t\u00e4ze a\u00e7y\u015flary\u0148
  \u00fcst\u00fcni a\u00e7\u00fdan, h\u00e4zirki zaman barlag-g\u00f6zleg merkezlerinden
  has \u00f6sen, aja\u00fdyp, nurly merkez \u00fdalydyr. Be\u00fdleki ylymlar \u00fc\u00e7in
  hem \u015fol zatlary a\u00fdtsa bolar. Di\u00fdmek, \u00fder s\u00fcr\u00fd\u00e4n
  da\u00fdhanam, asman jisimlerini \u00f6wren\u00fd\u00e4n alymam Kurany\u0148 diline
  d\u00fc\u015f\u00fcnip bil\u00fd\u00e4r.\\nIne, \u00f6z\u00fcni\u0148 \u015fe\u00fdle
  \u00f6zbolu\u015fly a\u00fdratynlygy bolan Kurandan biz sapak almalydyrys. Kuranda
  ensiklopedik terzde bilimleri\u0148 hersi agzalyp ge\u00e7ilse-de, bu kitap ensiklopedi\u00fda
  d\u00e4ldir. Kurany\u0148 \u00fdeke-t\u00e4k maksady \u2013 adamdyr. Ol adamy\u0148
  elinden tutup, ony \u00fderden g\u00f6ge, o ta\u00fddanam bakylyga eltmegi maksat
  edin\u00fd\u00e4r. Ol \u00f6z\u00fcni\u0148 \u015fu maksadyna gulluk etmek bilen
  birlikde, bize adamlary Haka \u00e7agyrmagy\u0148 usulynam \u00f6wred\u00fd\u00e4r.
  Teblig we ir\u015fad wezipesini \u00fderine \u00fdetir\u00fd\u00e4n adam, Kurany\u0148
  \u015fe\u00fdle \u00f6w\u00fc\u015fginini g\u00f6r\u00fcp, kimi Hak \u00fdoluna
  \u00e7agyr\u00fdan bolsa, \u015fonu\u0148 \u00fdagda\u00fdyny, derejesini \u00fcnsden
  d\u00fc\u015f\u00fcrmeli d\u00e4ldir. Teblig we ir\u015fad wezipesini \u00fderine
  \u00fdetir\u00fd\u00e4n adam her bir s\u00f6z\u00fcni \u015fo\u0148a g\u00f6r\u00e4
  di\u00fdmelidir. Elbetde, be\u00fdtmek a\u0148sat d\u00e4ldir. Emma, bu i\u0148
  pe\u00fddaly hem-de zerur usullary\u0148 biridir.\\nAgras, go\u00fdazy g\u00f6r\u00fcnjek
  bolup, pelsepe otarmagy endik edinenler gaty \u00fdal\u0148y\u015f\u00fdarlar. Seb\u00e4bi,
  ir\u015fad we teblig wezipesinde esasy zat \u2013 a\u00fddyl\u00fdan pikire di\u0148le\u00fdjini\u0148
  a\u00fddy\u0148 d\u00fc\u015f\u00fcnmegidir. Bu bolsa, pikiri\u0148 m\u00fcmkingadar
  d\u00fc\u015fn\u00fckli, sada dilde a\u00fddylmagyna baglydyr. Hawa, her kim d\u00fc\u015f\u00fcner
  \u00fdaly edip a\u00fdtmagy ba\u015farmaly.\\nH\u00e4zirki d\u00f6wr\u00fc\u0148
  \u00fda\u015flary dini terminlere hem a\u0148latmalara d\u00fc\u015f\u00fcnenok.
  Olar bilen \u00fdene-de olary\u0148 d\u00fc\u015f\u00fcnjek dilinde g\u00fcrle\u015fmeli
  bol\u00fdar. \u00c7aga bilen \u00e7aga \u00fdaly geple\u015filme\u00fd\u00e4rmi?!
  \u00dc\u00e7 \u00fda\u015fly \u00e7agany\u0148 elinden tutup, bile \u00fd\u00f6r\u00e4\u0148de,
  \u00e4dimi\u0148i o\u0148a g\u00f6r\u00e4 \u00e4tme\u00fd\u00e4rmi\u0148? \u00c7agajygy\u0148
  diline \u00f6\u00fdk\u00fcnip, onu\u0148 bilen g\u00fcrle\u015fme\u00fd\u00e4rismi?
  Edil \u015fonu\u0148 \u00fdaly, ir\u015fad we teblig wezipesinde-de \u00fd\u00fczlenil\u00fd\u00e4n
  adamy\u0148 d\u00fc\u015f\u00fcnjesini g\u00f6z \u00f6\u0148\u00fcnde tutmak h\u00f6kmanydyr.
  \u00c7agany\u0148 d\u00fc\u015f\u00fcnmejek dilinde g\u00fcrl\u00e4p, olara hi\u00e7
  zady \u00f6wredip bolmaz.\\n\u00dda\u015f neslimize Yslam dinini d\u00fc\u015f\u00fcndirenimizde,
  Berksony\u0148, Paskaly\u0148, Platony\u0148 we Deskartesi\u0148 pelsepewi s\u00f6zleri
  d\u00e4l-de, Pygamber Serwerimiz hezreti Muhammedi\u0148 (sallallahu ale\u00fdhi
  wesellem) ir\u015fad we teblig usuly zerurdyr. Allah Resuly (sallallahu ale\u00fdhi
  wesellem) adamlary\u0148 akyl \u00fdetir\u015fini\u0148 d\u00fcrli-d\u00fcrli bol\u00fdanyny
  asla \u00fdatdan \u00e7ykarma\u00fdardy. Onu\u0148 a\u00fdd\u00fdan s\u00f6zleri
  her bir adamy\u0148 \u00fd\u00fcregine j\u00fc\u0148k bol\u00fdardy. Ol gerek \u00fderinde
  \u00e7aga bilen \u00e7aga \u00fdaly, \u00fda\u015f bilen \u00fda\u015f \u00fdaly,
  garry bilen garry \u00fdaly bolup bil\u00fd\u00e4rdi. Ine, \u015fu ylahy ahlak we
  \u015fu \u00fd\u00f6relge \u2013 pygamberleri\u0148 ahlak \u00fd\u00f6relgesidir.
  Pygamberimiz (sallallahu ale\u00fdhi wesellem) bir hadysynda: \u201eBize \u2013
  pygamberlere hemi\u015fe adamlary\u0148 zehin derejelerine la\u00fdyk, olar d\u00fc\u015f\u00fcner
  \u00fdaly g\u00fcrlemek bu\u00fdruldy\u201c, \u00fdene bir hadysda bolsa Pygamber
  Serwerimiz: \u201eAdamlara akyllaryna g\u00f6r\u00e4 s\u00f6z a\u00fddy\u0148\u201c
  di\u00fdmek bilen, bize teblig we ir\u015fad wezipesini\u0148 esaslaryny\u0148 birini
  \u00fdatlad\u00fdar.\\n- -de d\u00f6redildi.\"", "\"D\u00fcn\u00fd\u00e4 edebi\u00fdatyny\u0148
  taryhynda adamzady\u0148 ruhy hazynasyna \u00f6z\u00fcni\u0148 d\u00fcrd\u00e4ne
  many mazmuna \u00fdugurlan \u015fygyrlaryny miras go\u00fdan umumyadamzat \u015fahyry
  Magtymguly Atamyzy\u0148 ba\u00fd d\u00f6redijiligini\u0148 \u015f\u00f6hraty d\u00fcn\u00fd\u00e4
  dol\u00fdar. 2024-nji \u00fdylymyzy\u0148 hem \u201eP\u00e4him-Pa\u00fdhas ummany
  Magtymguly Pyragy\u201c \u00fdyly di\u00fdip atlandyrylmagyny\u0148 a\u0148yrsynda
  hem umman \u00fdaly gi\u0148 many \u00fdatyr. Dana akyldar Magtymguly Pyragy nusgawy
  edebi\u00fdaty\u0148 k\u00e4mille\u015fmegine edebi dilini \u00f6sd\u00fcrmekde
  uly i\u015fler bitiren \u015fahsy\u00fdetdir. Dur\u015fy bilen akyla nakyla \u00fdugurlan
  altyn setirler islendik \u00fda\u015fdaky, islendik k\u00e4rd\u00e4ki adamlary yla\u00fdtada
  \u00fda\u015f nesilleri watan\u00e7ylyk \u00fdokary ruhy ahlak d\u00fc\u015f\u00fcnjelerinde
  terbi\u00fdelemekd\u00e4ki orny a\u00fdratyn bellenilm\u00e4ge mynasypdyr.\\nT\u00fcrkmenistany\u0148
  \u015eekillendiri\u015f sungaty muze\u00fdinde 2024-nji \u00fdyly\u0148 15-nji ma\u00fdynda
  Magtymguly Pyragyny\u0148 doglan g\u00fcn\u00fcni\u0148 300 \u00fdyllygy mynasybetli
  \u201eMagtymguly Pyragyny\u0148 sungat \u00e4lemind\u00e4ki orny Atly amaly-ha\u015fam
  we \u015fekillendiri\u015f sungatyny\u0148 eserlerini\u0148 sergisi gurnaldy. Aja\u00fdyp
  sergide halypa suratke\u015fleri\u0148 d\u00f6reden t\u00e4sin sungat eserleri serg\u00e4
  gatna\u015fanlarda uly t\u00e4sir galdyrdy. Dabaraly serg\u00e4 gatna\u015fanlar
  Akyldary\u0148 ba\u00fd d\u00f6redijiligni d\u00fcn\u00fd\u00e4 \u00fda\u00fd\u00fdan
  T\u00fcrkmen halkyny\u0148 Milli Lideri Gahryman Arkadagymyza, Peder \u00fdoluny
  mynasyp dowam ed\u00fd\u00e4n Arkadagly Gahryman Serdarymyza alky\u015flaryny \u00fd\u00fcrekden
  \u00e7yk\u00fdan bu\u00fdsan\u00e7ly s\u00f6zlerini be\u00fdan ed\u00fd\u00e4rler.\"",
  "\"Qazaqstanda jylqy sany artty\\nNUR-SULTAN. QazAqparat \u2013 QR A\u00fdyl shar\u00fdashyly\u01f5y
  m\u0131n\u0131stri Saparhan Omarov b\u0131yl iri qara mal basy 5 pa\u0131yz\u01f5a
  \u00f3skenin a\u0131tty, dep habarla\u0131dy QazAqparat tilshisi.\\n\u00ab\u0406shki
  naryqty mal shar\u00fdashyly\u01f5y \u00f3nimderimen tolyqtyr\u00fd \u00fashin mal
  basyn \u00f3sir\u00fd qamtamasyz etiledi. 2020 jyldy\u0144 7 a\u0131ynda iri qara
  malyny\u0144 5 pa\u0131yz\u01f5a, usaq maldy\u0144 2 pa\u0131yz\u01f5a, jylqyny\u0144
  9 pa\u0131yz\u01f5a \u00f3s\u00fdi ba\u0131qaldy\u00bb, - dedi m\u0131n\u0131str
  \u00dakimet otyrysynda.\\nSonymen qatar ol \u00f3\u0144delgen \u00f3nim bo\u0131ynsha
  \u00f3sim bol\u01f5anyn a\u0131tty. Bul tur\u01f5yda un 6,4 pa\u0131yz\u01f5a, \u00f3simdik
  ma\u0131y 1,8 pa\u0131yz\u01f5a, makaron \u00f3nimderi 8,4 pa\u0131yz\u01f5a, qus
  eti 12,3 pa\u0131yz\u01f5a, qyshqyl-s\u00fat \u00f3nimderi 4,7 pa\u0131yz\u01f5a,
  sary ma\u0131 12,9 pa\u0131yz\u01f5a, shujyq \u00f3nimderi 22,8 pa\u0131yz\u01f5a
  \u00f3sti.\\nBudan buryn habarlan\u01f5anda\u0131, Qazaqstanda azyq-t\u00falik ta\u00fdarlaryny\u0144
  6 t\u00fari bo\u0131ynsha \u0131mportty almastyr\u00fd j\u00fargizil\u00fdde.\\n-
  Aqt\u00f3bede azyq-t\u00falik ba\u01f5asy qymbattady\\n- Qazaqstanda veter\u0131nar\u0131\u0131alyq
  pasport elektrondyq formatqa a\u00fdystyrylady\\n- \u0406shki astyq nary\u01f5yn
  turaqtandyr\u00fd sharalary iske asyrylady - M\u00e1jilis\\n- Ny\u01f5mat\u00fdl\u0131n:
  \u00abAstyq t\u00fdraly\u00bb za\u0144 jobasy azyq-t\u00falik qa\u00fdipsizdigin
  qamtamasyz et\u00fdge ba\u01f5yttal\u01f5an\\n- Mal urly\u01f5y \u00fashin qanda\u0131
  jaza qoldanylady\\n- Nur-Sultanda senbi-jeksenbidegi a\u00fdyl shar\u00fdashyly\u01f5y
  j\u00e1rme\u0144kesi jal\u01f5asa beredi\\n- Elbasy jolda\u00fdy\\n- Jolda\u00fd
  j\u00faktegen mindetter\\n- Qazaqstan tar\u0131hy\\n- \u00c1lemdik BAQ Qazaqstan
  t\u00fdraly\\n- Ja\u0144a \u0131nd\u00fdstr\u0131\u0131alandyr\u00fd\\n- Bolashaqqa
  100 qadam\"", "\"Aralas sa\u0131la\u00fd j\u00fa\u0131esi bo\u0131ynsha sa\u0131lan\u01f5an
  42 dep\u00fdtat VIII shaqyrylymda\u01f5y qalalyq m\u00e1sl\u0131hatty\u0144 birinshi
  sess\u0131\u0131asy barysynda turaqty kom\u0131ss\u0131\u0131alar bo\u0131ynsha
  b\u00f3lindi. A\u0131ta ket\u00fd kerek, 2004 jyldan beri al\u01f5ash ret dep\u00fdtattardy\u0144
  50%-y part\u0131\u0131alyq tizimder bo\u0131ynsha, qal\u01f5an 50%-y major\u0131tarlyq
  j\u00fa\u0131e bo\u0131ynsha sa\u0131landy.\\nSess\u0131\u0131a jumysyn asha otyryp,
  Almaty qalasy bo\u0131ynsha a\u00fdmaqtyq sa\u0131la\u00fd kom\u0131ss\u0131\u0131asyny\u0144
  t\u00f3ra\u01f5asy A\u0131g\u00fal Qalyqova VIII shaqyrylymda\u01f5y Almaty qalasy
  m\u00e1sl\u0131haty dep\u00fdtattaryny\u0144 k\u00fd\u00e1likteri men t\u00f3sbelgilerin
  tapsyr\u00fd r\u00e1simin \u00f3tkizdi.\\nBirinshi sess\u0131\u0131a barysynda m\u00e1sl\u0131hat
  t\u00f3ra\u01f5asy j\u00e1ne ja\u0144adan quryl\u01f5an turaqty kom\u0131ss\u0131\u0131alardy\u0144
  t\u00f3ra\u01f5alary sa\u0131landy. Osyla\u0131sha, \u00abAMANAT\u00bb part\u0131\u0131asy
  fraks\u0131\u0131asyny\u0144 usynysy negizinde VIII shaqyrylymda\u01f5y Almaty m\u00e1sl\u0131hatyny\u0144
  t\u00f3ra\u01f5asy bolyp Me\u0131irjan Otynsh\u0131ev sa\u0131landy.\\nSonymen qatar
  sa\u0131la\u00fd kom\u0131ss\u0131\u0131asy \u00abQazaqstanda\u01f5y jergilikti
  memlekettik basqar\u00fd j\u00e1ne \u00f3zin-\u00f3zi basqar\u00fd t\u00fdraly\u00bb
  za\u0144yna s\u00e1\u0131kes \u00abAMANAT\u00bb part\u0131\u0131asyny\u0144 fraks\u0131\u0131asy
  tirkelip, ony\u0144 basshysy bolyp Stan\u0131slav Kank\u00fdrov sa\u0131lan\u01f5any
  t\u00fdraly habarlama jasady.\\nSonda\u0131-aq da\u00fdys ber\u00fd n\u00e1t\u0131jesinde
  turaqty kom\u0131ss\u0131\u0131alardy\u0144 basshylary anyqtaldy:\\n- Ekonom\u0131ka,
  qarjy, akt\u0131vter, memlekettik basqar\u00fddy damyt\u00fd j\u00e1ne qo\u01f5amdyq
  qa\u00fdipsizdik j\u00f3nindegi kom\u0131ss\u0131\u0131a, t\u00f3ra\u01f5asy \u2013
  N\u00e1b\u0131ev \u00c1mirjan \u00c1mirjanuly.\\n- Qurylys, s\u00e1\u00fdlet, \u00fdrban\u0131st\u0131ka
  j\u00e1ne jer qatynastary j\u00f3nindegi kom\u0131ss\u0131\u0131a, t\u00f3ra\u01f5asy
  \u2013 Shoqanov Nursultan Nurlanuly.\\n- Komm\u00fdnaldyq \u0131nfraqurylym, energet\u0131ka,
  s\u00fdmen jabdyqta\u00fd j\u00e1ne qalalyq mob\u0131ldilik j\u00f3nindegi kom\u0131ss\u0131\u0131a,
  t\u00f3ra\u0131ymy \u2013 \u041e\u0301mirbaeva Za\u00fdresh \u00c1bil\u01f5ojaqyzy.\\n-
  K\u00e1sipkerlik, \u0131nvest\u0131s\u0131\u0131alar, t\u00fdr\u0131zm j\u00e1ne
  ekolog\u0131\u0131a j\u00f3nindegi kom\u0131ss\u0131\u0131a, t\u00f3ra\u01f5asy
  \u2013 Idr\u0131sov R\u00fdslan Rash\u0131tov\u0131ch.\\n- Qo\u01f5amdyq dam\u00fd,
  m\u00e1den\u0131et, sport, din j\u00e1ne jastar j\u00f3nindegi kom\u0131ss\u0131\u0131a,
  t\u00f3ra\u0131ymy \u2013 Aqanova \u00c1s\u0131\u0131a A\u0131qanqyzy.\\n- Densa\u00fdlyq
  saqta\u00fd, bilim j\u00e1ne jumyspen qamt\u00fd j\u00f3nindegi kom\u0131ss\u0131\u0131a,
  t\u00f3ra\u01f5asy - Qodasbaev Almat Turysbekuly.\\nBir mandatty okr\u00fdgterdi
  eskere otyryp, 24 mandatpen \u00abAMANAT\u00bb part\u0131\u0131asy basymdyqqa \u0131e
  boldy. \u00abRespublica\u00bb part\u0131\u0131asynda 5 mandat, \u00abQazaqstan Halyq
  part\u0131\u0131asy\u00bb men \u00abBAYTAQ\u00bb part\u0131\u0131alarynda \u00fash
  mandattan bar. \u00abAq Jol\u00bb part\u0131\u0131asy 2 mandatty alsa, part\u0131\u0131alyq
  emes dep\u00fdtattar 5 mandatqa \u0131e boldy.\\nM\u00e1sl\u0131hat dep\u00fdtattaryny\u0144
  quramyn ja\u0144art\u00fd 66,7% qurady. \u00c1\u0131elder, jastar j\u00e1ne m\u00famkindigi
  shekte\u00fdli jandar sany 38,1% qurady. Ulttyq quramy bo\u0131ynsha: qazaqtar \u2013
  78,6%, orystar \u2013 7,1%, k\u00e1rister \u2013 4,8%, u\u0131\u01f5yrlar \u2013
  4,8%, tatarlar \u2013 2,4%, \u00fdkra\u0131ndar \u2013 2,4%.\\nUqsas ja\u0144alyqtar\"",
  "\"Gyzgyn i\u015fle\u00fd\u00e4n ulgamlar \u00fc\u00e7in TZM garyndy burun maslahatlary\\n\u00dcst\u00fcnlikleri\\nTZM
  arassa Molibdeni\u0148kiden has g\u00fc\u00fd\u00e7lidir we has ga\u00fdtadan dikeldi\u015f
  temperaturasyna we g\u00fc\u00fd\u00e7li s\u00fc\u00fd\u015fm\u00e4ge gar\u015fylygy
  bar.TZM, mehaniki \u00fd\u00fckleri talap ed\u00fd\u00e4n \u00fdokary temperaturaly
  programmalarda ulanmak \u00fc\u00e7in amatlydyr.Mysal \u00fc\u00e7in gurallary \u00fdasamak
  \u00fda-da rentgen turbalarynda a\u00fdlan\u00fdan anodlar bolup biler.Ulany\u015fy\u0148
  amatly temperaturasy 700 bilen 1400 \u00b0 C arasynda.\\nTZM \u00fdokary \u00fdylylyk
  ge\u00e7irijiligi we poslama gar\u015fylygy bilen adaty materiallardan \u00fdokarydyr\\nA\u00fdratynlyklary\u0148yza
  k\u00f6p b\u00f6lekleri we armaturlary berip bileris we \u00f6nd\u00fcrip bileris:
  Molibden TZM barlary, Molibden TZM plitalary, Molibden TZM \u00e7ybyklary, Molibden
  TZM listleri \u00fda-da be\u00fdlekileri\u0148 arasynda Molibden TZM sim.\\nA\u00fdratynlyklary\\nTZM
  klapan derwezesini\u0148 gyzgyn ylga\u00fdjy burny gi\u0148den ulanyl\u00fdar we
  esasy artykma\u00e7lyklary:\\n1. Gysga a\u00fdlaw wagty, \u00f6nd\u00fcrijiligi\u0148
  \u00fdokarlanmagy;\\n2. I\u015flenip d\u00fcz\u00fclen penjire;\\n3. Derwez\u00e4ni\u0148
  \u00e7ukury \u00fda-da simleri \u00fdok;\\n4. Plastmassa b\u00f6leklerini\u0148
  \u00fcstki we derwez\u00e4ni\u0148 hili;\\n5. Sanjym wagtyna we eremegi\u0148 pa\u00fdlany\u015fyna
  takyk g\u00f6zeg\u00e7ilik;\\n6. Optimalla\u015fdyrylan bo\u015fluk ventilyasi\u00fdasy
  we keb\u015firleme \u00e7yzygy;\\n7. Has \u00e7alt galyp ba\u015flamagy;\\n8. Awtomatla\u015fdyrylan
  galypla\u00fdy\u015f \u00f6\u00fdj\u00fckleri;\\n9. In\u00e7e diwar b\u00f6lekleri,
  k\u00f6p\u00fck we gaz k\u00f6mek sanjymy \u00fc\u00e7in amatly; A\u00fdratynlyklary:\\nGo\u00fdmalar\\n-
  Gurlu\u015f pe\u00e7ini\u0148 b\u00f6lekleri.\\n- Al\u00fdumin gu\u00fdmak \u00fc\u00e7in
  go\u00fdul\u00fdar.\\n- Gyzgyn m\u00f6h\u00fcrleme gurallary.\\n- Raketa burunlary
  we elektrodlar.\""]'
