  GAZ GE\u00c7IRIJISI A\u00c7YLYP ULANMAGA BERILDI\\n2015-nji \u00fdyly\u0148 23-nji
  dekabrynda, Balkan wela\u00fdatyna i\u015f sapary bilen gelen T\u00fcrkmenistany\u0148
  Prezidenti Gurbanguly Berdimuhamedow \u00fdurdumyzy\u0148 iri gaz k\u00e4nlerini
  bir bitewi gaz ge\u00e7iriji ulgama birle\u015fdiren \u201cG\u00fcndogar-G\u00fcnbatar\u201d
  gaz ge\u00e7irijini\u0148 a\u00e7yly\u015f dabarasyna gatna\u015fdy. T\u00e4ze gaz
  ge\u00e7iriji Mary wela\u00fdatyndaky \u201c\u015eatlyk\u201d gaz gysyjy stansi\u00fdasyndan
  Hazar\u00fdaka sebitind\u00e4ki \u201cBelek\u201d gaz gysyjy stansi\u00fdasyna \u00e7enli
  \u00e7ekildi. Bu \u015fatlykly dabara gatna\u015fmak \u00fc\u00e7in h\u00f6k\u00fcmet
  agzalary, Mejlisi\u0148 deputatlary, ministrlikleri\u0148 w...\\nT\u00fcrkmenistan-Owganystan-Pakistan-Hindistan
  gaz ge\u00e7irijisini\u0148 gurlu\u015fygyna badalga berildi\\n2015-nji \u00fdyly\u0148
  13-nji dekabrynda Mary wela\u00fdatynda T\u00fcrkmenistan-Owganystan-Pakistan-Hindistan
  /TOPH/ gaz ge\u00e7irijisini\u0148 hem-de \u201cGalkyny\u015f\u201d gaz k\u00e4nini
  senagat ta\u00fddan \u00f6zle\u015fdirmegi\u0148 ilkinji nobatdakysyny\u0148 desgalaryny\u0148
  gurlu\u015fygyna badalga berildi. Bu desgalar ba\u015flangy\u00e7 tapgyrda t\u00e4ze
  energetika ge\u00e7irijisini\u0148 seri\u015fde bin\u00fdadyna \u00f6wr\u00fcler.
  Dabara T\u00fcrkmenistany\u0148 Prezidenti Gurbanguly Berdimuhamedow hem-de \u00fdakynda
  \u00fdurdumyza saparlar bilen gelen Owganystan Yslam Respublikasyny\u0148 Prezidenti
  Mohammad A\u015fraf Gani, P...\\nT\u00fcrkmenistanda \u00fdokary derejeli maslahat
  ge\u00e7irildi\\n2015-nji \u00fdyly\u0148 12-nji dekabrynda \u201cBitaraplyk sy\u00fdasaty:
  Parahat\u00e7ylygy\u0148, howpsuzlygy\u0148 we \u00f6s\u00fc\u015fi\u0148 ugrunda
  halkara hyzmatda\u015flygy\u201d atly Halkara maslahaty ge\u00e7irildi. O\u0148a
  gatna\u015fmak \u00fc\u00e7in d\u00fcrli \u00fdurtlary\u0148 d\u00f6wlet we h\u00f6k\u00fcmet
  Ba\u015ftutanlary, d\u00fcn\u00fd\u00e4ni\u0148 \u00fdokary sy\u00fdasy derejeli
  wekilleri, abra\u00fdly halkara we sebit guramalaryny\u0148 ba\u015ftunanlary gatna\u015fdylar.\\nDu\u015fenbede
  T\u00fcrkmen-T\u00e4jik sy\u00fdasy ge\u0148e\u015fmeler ge\u00e7irildi\\n2015-nji
  \u00fdyly\u0148 26-njy no\u00fdabrynda Du\u015fenbe \u015f\u00e4herinde T\u00e4jigistan
  Respublikasyny\u0148 Da\u015fary i\u015fler ministrligini\u0148 binasynda T\u00fcrkmenistany\u0148
  we T\u00e4jigistany\u0148 Da\u015fary i\u015fler ministrliklerini\u0148 arasynda
  ministrleri\u0148 orunbasarlaryny\u0148 derejesinde sy\u00fdasy ge\u0148e\u015fmeler
  ge\u00e7irildi. Ge\u0148e\u015fmeleri\u0148 g\u00fcn tertibine t\u00fcrkmen-t\u00e4jik
  d\u00f6wletara geple\u015fiklerini\u0148 sy\u00fdasy, s\u00f6wda-ykdysady, ulag-aragatna\u015fyk,
  ylym, bilim, saglygy gora\u00fdy\u015f, medeni\u00fdet we sungat ulgamlarynda hyzmatda\u015flygy
  has-da \u00fdygjamla\u015fdyrmak meseleleri go\u015fuldy. Tarapla...\"", "\"T\u00fcrkmenistanda
  Subsidi\u00fdalar Azal\u00fdar\\nT\u00fcrkmen h\u00f6k\u00fcmedi \u00f6z ilatyna
  hemi\u015fe ber\u00fd\u00e4n subsidi\u00fdalaryny d\u00fc\u00fdpli kemeltdi.\\nI\u00fdul
  a\u00fdynda h\u00f6k\u00fcmet so\u0148ky 15 \u00fdyly\u0148 dowamynda beril\u00fd\u00e4n
  un subsidi\u00fdasyny aradan a\u00fdyrdy. Ol d\u00fczg\u00fcn bo\u00fdun\u00e7a
  her ma\u015fgala \u00fd\u00f6rite karto\u00e7kalar berlip, uny a\u00fdratyn pes
  baha bilen almak m\u00fcmkindi.\\nMundan ba\u015fgada, h\u00e4kimi\u00fdetler arzanladylan
  bahadan \u00fdangy\u00e7 alyp bil\u00fd\u00e4n s\u00fcr\u00fcjileri\u0148 sanyny
  hem azaltdylar. Bu hususy \u00fd\u00fck ma\u015fynlaryny\u0148 e\u00fdelerini\u0148
  her 6 a\u00fd \u00fc\u00e7in 1 200 litr \u00fdangyjy mugt alan d\u00f6wr\u00fcni\u0148
  so\u0148una \u00e7ykdy. Indi di\u0148e \u00fde\u0148il ma\u015fynlary\u0148 we ki\u00e7i
  ulaglary\u0148 e\u00fdeleri 720 litr mugt benzini \u00fda-da dizeli her \u00fdarym
  \u00fdyl \u00fc\u00e7in talona alyp bil\u00fd\u00e4rler. Motosikl e\u00fdelerine
  240 litr beril\u00fd\u00e4r.\\nSyn\u00e7ylary\u0148 a\u00fdtmagyna g\u00f6r\u00e4,
  bu \u00fdyl galla hasylyny\u0148 pes bolmagy un subsidi\u00fdasyny\u0148 kesilmegine
  getiripdir. T\u00fcrkmenistan uny, edil be\u00fdeleki azyk harytlary \u00fdaly,
  import hem ed\u00fd\u00e4r, \u00fd\u00f6ne ol getirilen un gymmat bahaly.\\nI\u00fdmit
  we sarp edi\u015f harytlaryny\u0148 bahalaryny\u0148 \u00e4hlisi \u00fdokary gal\u00fdar,
  hem-de subsidi\u00fdalary\u0148 kemeldilmegi ilata has agyr d\u00fc\u015fer.\\nK\u00e4bir
  ekspertleri\u0148 pikirine g\u00f6r\u00e4, hatda k\u00f6p mukdarly gaz eksportlary
  bilenem, T\u00fcrkmenistany\u0148 1991-nji \u00fdyldan b\u00e4ri tapawutly h\u00e4si\u00fdeti
  bolan subsidi\u00fdalary we \u00fde\u0148illikleri bermegini indi h\u00f6k\u00fcmedi\u0148
  ba\u015farmajakdygyny bo\u00fdun alan bolmagy m\u00fcmkin.\\nYkdysady\u00fdet we
  \u00f6s\u00fc\u015f ministrligini\u0148 bir i\u015fg\u00e4rini\u0148 a\u00fddy\u015fy
  \u00fdaly, \\\"Bu indi mugt durmu\u015fy\u0148 so\u0148y.\\\"\\nYkdysady kommentator
  subsidi\u00fdalary\u0148 ykdysady\u00fdeti\u0148 k\u00f6p b\u00f6legine \u00fda\u00fdrap,
  hakykatda zatlary\u0148 bahasyny\u0148 n\u00e4\u00e7edigini hasaplamagy kynla\u015fdyr\u00fdandygyny
  d\u00fc\u015f\u00fcndirdi.\\n\\\"Bize sagdyn konkurensi\u00fdaly sredany d\u00f6retmek
  we gara\u015flylykdan da\u015fla\u015fmak gerek, emma subsidi\u00fda esaslanan ykdysady\u00fdet
  muny kynla\u015fdyr\u00fdar\\\" di\u00fdip ol a\u00fdtdy. \\\"Men h\u00e4kimi\u00fdetler
  bazar ykdysady\u00fdetine tarap mundan so\u0148am go\u015fma\u00e7a \u00e4dimler
  \u00e4der di\u00fdip gara\u015f\u00fdaryn.\\\"\\nD\u00f6wlet statistika edarasyny\u0148
  ykdysady\u00fdet\u00e7ilerini\u0148 biri, benzini\u0148 bary-\u00fdogy 22 AB\u015e
  sentine dur\u00fdan d\u00f6wletinde, sarp ediljileri has pes bahalardan da\u015fla\u015fdyrmaga
  wagt \u00fdetendigini a\u00fdtdy.\\n\\\"Bahalar hakykat bilen mundan k\u00f6p wagt
  \u00f6\u0148 gabat gelmelidi\u201d d\u00fdiip ol a\u00fdtdy. \\\"Barybir bu \u00fderde
  hemme zat arzan.\\\"\\nA\u015fgabatly ykdysady\u00fdet\u00e7i hem h\u00f6k\u00fcmedi\u0148
  dogry i\u015f ed\u00fd\u00e4nini a\u00fdtdy, hem-de bu hereketleri\u0148 T\u00fcrkmenistan
  \u00fdaly resurslara ba\u00fd bolan d\u00f6wletlere maslahat beril\u00fd\u00e4n
  sy\u00fdasatlara gabat gel\u00fd\u00e4ndigini belledi.\\n\\\"Ge\u00e7i\u015fden
  \u00dc\u00fdtge\u015fmelere tarap: \u00ddewropada we Merkezi Azi\u00fdada Durnukly
  we D\u00fc\u00fdpli \u00d6s\u00fc\u015f\\\" di\u00fdlip atlandyryl\u00fdan Birle\u015fen
