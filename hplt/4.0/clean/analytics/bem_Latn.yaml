  sana, na bo nkabonaula.+\\n42 Bapunda mutuule, lelo takuli wa kubapususha;+Balilila
  kuli Yehova, lelo tabaasuka.+\\n43 Nkabashonaula ngo lukungu lwa pa nshi;Nkabakandaula
  nga matipa ya mu misebo;+Kabili nkabanyantaula.\\n44 Mukampususha ku fyo abantu
