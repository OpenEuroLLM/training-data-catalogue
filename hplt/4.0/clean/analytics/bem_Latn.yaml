  Bambi bambi bakesa nabaipetamika kuli ine;+Bakaba ne cumfwila kabili bakomfwa kuli
  ine.+\\n46 Bambi bambi bakabulwa amaka,Bakesa baletutuma ukufuma mu malinga yabo
  ayasansuka.+\\n47 Yehova wa mweo;+ kabili cibe icapaalwa Icilibwe candi;+Asansabikwe
  Lesa icilibwe ce pusukilo lyandi.+\\n48 Lesa wa cine e unandwilako+E ulenga abantu
  na bantu ukunakila ine,+\\n49 Kabili e umpususha ku balwani bandi.+Mukansansabika
  ukucila abanjimina;+Mukampokolola ku muntu wa bunkalwe.+\\n50 E co ndemutashisha
  mu nko,+ mwe Yehova;Kabili ndeimbila ishina lyenu amalumbo:+\\n51 Uucitila imfumu
  yakwe ifya kupususha ifikalamba+No kuba ne cikuuku ku wasubwa wakwe,+Kuli Davidi
  na ku bana bakwe umuyayaya.\u201d+\"", "\"Baibolo ya pa Intaneti | BAIBOLO\u2014AMALEMBO
  YA CALO CIPYA\\n35 Amatololo ne mpanga yauma fikasekelela,+ kabili iciswebebe cikasansamuka
  no kubalula nga maluba ya ntongola.+\\n2 Cine cine cikabalula,+ kabili cikesulamo
  ukusekelela no kwaula utupundu.+ Ubucindami bwa kwa Lebanone bukapeelwa kuli cena,+
  pamo no bucindami bwa Karmele+ no bwa Sharone.+ Kukaba abakamona ubukata bwa kwa
  Yehova,+ no bucindami bwa kwa Lesa wesu.+\\n3 Kosheni amaboko ayanaka, kabili kosheni
  amakufi ayaletutuma.+\\n4 Soseni ku basakamikwe mu mitima+ amuti: \u201cKoseni.+
  Mwitiina.+ Moneni! Lesa wenu akesa ne cilandushi,+ Lesa akesa no kulandula.+ Akesa
  no kumupususha.\u201d+\\n5 Pali iyo nshita amenso ya mpofu yakamona,+ na matwi ya
  bankomamatwi yakakomonwa.+\\n6 Pali iyo nshita uwalemana amolu akacilauka nge nsebula,+
  kabili ululimi lwa kwa cibulu lukaula akapundu.+ Pantu mu matololo mukafukauka amenshi,
  ne mimana ikalapita mu fiswebebe.\\n7 Kabili impanga iyaumisha ikaba nge cishiba,
  ne mpanga iyauma ikaba ngo tumfukumfuku twa menshi.+ Umwikala bamumbwe,+ e kutila,
  umo batuushisha, mukaba icani iciteku na matete na macinda.+\\n8 Kabili kulya kukaba
  umusebo,+ kukaba inshila; iketwa Inshila ya Mushilo.+ Uwakowela takapitemo.+ Kabili
  ikaba ya wasuminishiwa ukwendamo, na bawelewele tabakendaukemo.\\n9 Tamwakabe inkalamo
  nakalya, ne fiswango tafyakapitemo.+ Tashakasangwemo,+ kabili abalubulwa bakendamo.+\\n10
  Kabili abalubulwa na Yehova bakabwela+ no kwisa ku Sione no tupundu;+ kabili ukusekelela
  kukaba pa mitwe yabo umuyayaya.+ Bakala-anga no kusekelela, kabili ubulanda no kuteta
  fikafulumukamo.+\"", "\"\u201cE ico, ipayeni ifilundwa fya mubili wenu umumonekela
  imibele yabipa, e kutila ubulalelale, ukukowela, insuuna, ulunkumbwa, no mufimbila,
  pantu ukuba ne yi mibele e kupepa utulubi.\u201d\u2014ABENA KOLOSE 3:5.\\n1, 2.
  Bushe Balaamu acitile shani ilyo alefwaya ukuti abantu ba kwa Yehova batiipwe?\\nELENGANYENI
  ukuti umulondo aya pa ncende apo atemwa ukwipaila isabi. Alefwaya ukuloba umusango
  umo uwe sabi. Eco asala ubulyo kabili abubika ku ndobo yakwe, apoosa ne ndobo pa
  menshi. Mu nshita fye iinono indobo yaibila, intambo yatintikila na pa nshi, awe
  afwampula ne ndobo aikata ne sabi. Amwentula pantu aishiba ukuti acisala bwino ubulyo
  pa kuti alobe isabi ilyo acilafwaya.\\n2 Mu 1473 B.C.E., kwali umuntu umo ishina
  lyakwe ni Balaamu, uwalefwaya ukubeleleka abantu ba kwa Lesa. Kanshi alitontonkenye
  sana no kusala inshila iyo aali no kubabelelekelamo. Pali iyi nshita, abantu ba
  kwa Lesa bapangile inkambi mu Ciswebebe ca Moabu, ku mupaka wa Calo ca Bulayo. Balaamu
  aleibepekesha ukuba kasesema wa kwa Yehova, lelo alitemenwe ifyuma, e co asuminine
  ukuyatiipa abena Israele. Nomba apo Yehova alimucilime, mu nshita ya kubatiipa,
  Balaamu alipaalile abena Israele. Apo Balaamu alefwaisha icilambu bamulaile, atontonkenye
  ukuti nalimo Lesa kuti atiipa abantu bakwe nga ca kutila batunkwa ukucita ulubembu
  lwabipisha. E ico Balaamu abomfeshe abakashana abena Moabu abayemba nga nshi ku
  kubeleleka abena Israele.\u2014Impendwa 22:1-7; 31:15, 16; Ukusokolola 2:14.\\n3.
  Ni banga babelelekwe ne pange lya kwa Baalamu?\\n3 Bushe abantu balibelelekwe nga
  fintu alefwaya? Ee, bamo balibelelekwe. Abena Israele abaume abengi sana \u2018balicitile
  ubulalelale na bana banakashi abena Moabu.\u2019 Batendeke no kupepa balesa ba bena
  Moabu, ukubikako fye na Baali wa ku Peore, lesa wa makankamike, uo baleti ni lesa
  wa bufyashi, nelyo lesa wa kulaalana. Ici calengele abena Israele 24,000 balobe
  ninshi bali fye mupepi no kwingila mu Calo ca Bulayo. We bantu ubwingi abafwile!\u2014Impendwa
  25:1-9.\\n4. Cinshi calengele abena Israele abengi bacite ubulalelale?\\n4 Cinshi
  calengele abantu bafule fi bafwe? Abengi baishileba ne mitima iyabipa pantu balilekele
  ukumfwila Yehova, Lesa uwabalubwile mu Egupti, kabili uwalebapeela ifya kulya mu
  matololo, no kubacingilila ilyo baleya ku calo ca bulayo. (AbaHebere 3:12) Ilyo
  umutumwa Paulo atontonkenye pali uyu mulandu, alembele ukuti: \u201cTwilacita bulalelale,
  filya bamo pali aba bacitile, ica kuti mu bushiku fye bumo abantu amakana 23,000
  pali aba balifwile.\u201d *\u20141 Abena Korinti 10:8.\\n5, 6. Mulandu nshi ilyashi
  lya bena Israele ababembwike lintu bali mu Ciswebebe ca Moabu lingatwafwila pali
  lelo?\\n5 Abantu ba kwa Lesa muno nshiku abali mupepi sana no kwingila mu calo cipya
  ico Lesa abalaya, kuti basambililako amasambililo ayacindama ku lyashi lyaba mwi
  buuku lya Impendwa. (1 Abena Korinti 10:11) Ku ca kumwenako, ifyo abantu ilelo bapenene
  ku bulalelale, e fyo na bena Moabu baali, ni co fye aba muno nshiku bafulapo. Cila
  mwaka Abena Kristu abengi balabelelekwa no kucita ubulalelale nga filya fine na
  bena Israele babelelekwe. (2 Abena Korinti 2:11) Na kabili nga filya Simri apamine
  ukupita no mwanakashi umwina Midiani pa cintubwingi ukuya nankwe mwi tenti lyakwe,
  bamo ababishanya na bantu ba kwa Lesa muno nshiku, nabo balaleta imisango yabipa
  mu Cilonganino.\u2014Impendwa 25:6, 14; Yuda 4.\\n6 Bushe mwaliluka ukuti filya
  cali ku bena Israele ilyo bali mu Ciswebebe ca Moabu e fyo caba na kuli imwe? Bushe
  mulamona icilambu cenu, e kutila icalo cipya ico mulolela ukuti cili fye mupepi?
  Nga mulacimona, bikeni amano ku kwikalilila mu kutemwa kwa kwa Lesa, ne cingamwafwa,
  kukonka ifunde ilitila: \u201cFulumuka ubulalelale.\u201d\u20141 Abena Korinti 6:18.\\nBUSHE
  UBULALELALE NI CINSHI?\\n7, 8. Bushe finshi fyaba mu \u201cbulalelale,\u201d kabili
  abacita ubulalelale balobolola shani ifyo babyala?\\n7 Baibolo nga yalanda pa \u201cbulalelale\u201d
  (mu ciGriki, por\u00b7nei\u02b9a) ninshi ilelanda pa misango yonse iya bupulumushi
  iyo abantu abashaupana ukulingana ne funde bacita. Kanshi mu bulalelale mwaba ubucende,
  bucilende, ukuulungana kwa bashaupana, ukufyomfyonta ku fya mfwalo, ukwampana kwa
  ku matako e lyo no kwikataula ifya mfwalo ifya muntu uushili mwina mwenu. Mwaba
  no kuulungana kwa baume beka beka na banakashi ifyo fine, e lyo no kuulungana ne
  finama. *\\n8 Amalembo yalilanda bwino bwino ukuti: Abacita ubulalelale te kuti
  batwalilile ukuba mu cilonganino kabili tabakakwate umweo wa muyayaya. (1 Abena
  Korinti 6:9; Ukusokolola 22:15) Nangu fye ni pali ino ine nshita balailetelela pantu
  abantu tababacetekela, tababacindika, ifyupo fyabo filapwa, kampingu yabo ilabacusha,
  balapula amafumo, balambula amalwele kabili balafwilamo. (Belengeni Abena Galatia
  6:7, 8.) Ala buwelewele ukutampa ukucita ifintu ifingakuletelela! Ku ca bulanda,
  abengi tabatontonkanya pa fyabipa ifikacitika nga baletamba ifye shiku.\\nUKUTAMBA
  IFYE SHIKU KULENGA ABANTU BACITA UBULALELALE\\n9. Bushe filya bamo batila, ifye
  shiku tafyabipa, ca cine? Londololeni.\\n9 Mu fyalo ifingi, pa matebulo bashitishishapo
  amanyunshipepala na magazini palaba ne fye shiku kabili ifye shiku filaba na mu
  nyimbo, pa TV, e lyo na pa Intaneti apo fyaseeka sana. * Bushe filya bamo batila
  ifye shiku tafyabipa, ca cine? Bufi ubwafita fititi! Abatamba ifye shiku limo balaba
  no musango wa kulaikataula ifya mfwalo, kabili \u2018balatungululwa ne nsuuna iishili
  ya cifyalilwa.\u2019 Ici cilenga balafwaisha ukulacita ubulalelale, baba no lunkumbwa,
  bakwata amafya ayakalamba mu fyupo, nangu fye ukulenga ifyupo fyapwa. * (Abena Roma
  1:24-27; Abena Efese 4:19) Umuntu umo uufwailisha ifya kundapa aba musango uyu atile,
  insuuna ya kulafwaisha ukucita ubulalelale, yaba kwati bulwele bwa kansa, \u201cpantu
  na yo iya ilekula fye. Te lingi ibwelela inuma, kabili yalyafya ukundapa.\u201d\\n10.
  Kuti twalanga shani ukuti tulakonka amashiwi ya kwa Lesa ayatutungulula ayaba pali
  Yakobo 1:14, 15? (Belengeni na akabokoshi akaleti \u201cIfyo Nacitile pa Kuleka
  Imisango ya Bipaba.\u201d)\\n10 Tontonkanyeni pa mashiwi yaba pali Yakobo 1:14,
  15, ayatila: \u201cUmuntu onse atunkwa ilyo ulunkumbwa lwakwe umwine lwamusembeleka
  no kumubeleleka. E lyo ulunkumbwa, ilyo lwaimita, lufyala ulubembu; no lubembu,
  ilyo lwakula, luleta imfwa.\u201d E ico nga ca kuti ulunkumbwa lwaingila mu mutima
  wenu, lufumyenimo ilyo line fye! Tutile mwamona pa kompyuta atemwa pa TV paisa ifye
  shiku, lolesheni kumbi bwangu bwangu, nalimo shimyeni fye kompyuta nangu TV, nelyo
  tambeniko fimbi. Mule-esha na maka yonse ukulataluka ku lunkumbwa pa kuti talumulengele
  mwabembuka!\u2014Belengeni Mateo 5:29, 30.\\n11. Ilyo tulelwisha ukutaluka ku lunkumbwa,
  kuti twalanga shani ukuti twalicetekela Yehova?\\n11 E mulandu wine Lesa uwatwishiba
  bwino ukucila ne fyo twayishiba atukonkomesesha ukuti: \u201cE ico, ipayeni ifilundwa
  fya mubili wenu umumonekela imibele yabipa, e kutila ubulalelale, ukukowela, insuuna,
  ulunkumbwa, no mufimbila, pantu ukuba ne yi mibele e kupepa utulubi.\u201d (Abena
  Kolose 3:5) Ca cine, nalimo kuti cayafya ukwipaya ifilundwa fyesu. Lelo ibukisheni
  ukuti, Shifwe wa ku muulu uo tulililako alitutemwa kabili alitekanya. (Amalumbo
  68:19) Kanshi, amatontonkanyo yabipa nga yaisa mu mutima wenu mwilashimunuka ukupepa
  kuli ena. Mulepepa ukuti amupeele \u201camaka yacila aya bantunse,\u201d kabili
  muleipatikisha ukulatontonkanya pa fintu fimbi.\u20142 Abena Korinti 4:7; 1 Abena
  Korinti 9:27; belengeni na kabo-koshi akaleti, \u201cKuti Nacita Shani pa Kuleka
  Ici-musango Cabipa?\u201d\\n12. Bushe \u201cumutima\u201d wesu wimininako cinshi
  kabili mulandu nshi tufwile uku-usungila?\\n12 Umuntu wa mano Solomone alembele
  ati: \u201cSunga umutima obe ukucila pa fintu fyonse ifyo ufwile ukusunga, pantu
  mu mutima e mwaba utumfukumfuku twa mweo.\u201d (Amapinda 4:23) \u201cUmutima\u201d
  wesu wimininako ifyo twaba mu kati, ifyo Lesa atumona. Na kabili, ifyo Lesa amona
  \u201cumutima\u201d wesu e fikalanga nampo nga tukapokelela umweo wa muyayaya nelyo
  iyo, te fyo abantu bambi batumona. Takwaba icacila pali ifi twalandapo. Kanshi tulingile
  ukusunga bwino umutima. Umuntu wa cishinka, Yobo alipangene icipangano na menso
  yakwe ica kukanalolesha umwanakashi no kumukumbwa. (Yobo 31:1) Na ifwe bene e fyo
  tulingile ukucita! Kemba wa malumbo umo uwaletontonkanya nga Yobo, na o atile: \u201cLengeni
  amenso yandi ukukanalolesha ifya fye.\u201d\u2014Amalumbo 119:37.\\nDINA ASALILE
  IFIBUSA IFYABIPA\\n13. Dina ali nani, kabili mulandu nshi twingasosela ukuti ifibusa
  asalile tafyaweme?\\n13 Nga fintu twasambilile mu Cipandwa 3, ifibusa fyesu kuti
  fyalenga twalacita ifisuma nelyo ifyabipa. (Amapinda 13:20; belengeni 1 Abena Korinti
  15:33.) Natulande pa fyacitikile Dina, umwana mwanakashi uwa kwa Yakobo. Nangu ca
  kuti abafyashi ba kwa Dina balimukushishe bwino, asalilepo ukulayangala na bakashana
  babipa abena Kanaani. Abena Kanaani baishibikilwe ku bulalelale kwati fye bena Moabu.
  (Ubwina Lebi 18:6-25) Abaume abena Kaanani, kumo na Shekemu, \u201cuwacindamishe\u201d
  pali bonse aba mu ng\u2019anda ya kwa wishi balemona ukuti Dina kuti atemwa ukucita
  nabo ubulalelale.\u2014Ukutendeka 34:18, 19.\\n14. Bushe ifibusa ifyo Dina asalile
  fyalengele shani ena no lupwa lonse babe mu bwafya ubukalamba?\\n14 Dina afwile
  tatontonkenyepo pa kuulungana na Shekemu ilyo amumwene. Lelo Shekemu acitile ico
  abena Kaanani abengi balecita nga baumfwa insuuna. Nga ca kuti Dina alyesesheko
  ukukaana, tacamwafwile pantu Shekemu \u201calimubulile\u201d no \u201ckumucenda.\u201d
  Cimoneka kwati pa numa Shekemu \u201calitemenwe\u201d Dina, lelo ici tacalengele
  ico acitile cimoneke icisuma. (Belengeni Ukutendeka 34:1-4.) Ico Shekemu acitile
  calengele abengi baculilamo pamo na Dina wine. Ifibusa ifyo Dina asalile fyalengele
  kwacitika ifintu ifyaseebenye ulupwa lwakwe lonse no kululenga insoni.\u2014Ukutendeka
  34:7, 25-31; Abena Galatia 6:7, 8.\\n15, 16. Bushe kuti twakwata shani amano yene
  yene? (Belengelenipo na mashiwi yali mu kabokoshi akaleti \u201cAmalembo aya Kutontonkanyapo\u201d.)\\n15
  Nga ca kuti Dina alisambilile ukuti ukwangala na babi kubi, ninshi asambilile ici
  pa numa ya kupita mu bwafya. Abatemwa Yehova kabili abamumfwila tabafwile fye ukupita
  mu bwafya pa kuti beshibe ukuti ukumfwila Lesa kusuma. Apo balomfwila Lesa, bafwaya
  \u2018ukwenda na ba mano.\u2019 (Amapinda 13:20a) E ico baleshiba \u201cinshila
  yonse iisuma,\u201d ne ci cilenga belaikolomwena amafya ne fibi fimbi.\u2014Amapinda
  2:6-9; Amalumbo 1:1-3.\\n16 Umuntu nga alefwaisha amano ayafuma kuli Lesa, kuti
  ayakwata kulila fye alepepa no kusambilila Icebo ca kwa Lesa lyonse e lyo no kulabelenga
  impapulo isho umusha wa cishinka kabili uwashilimuka alemba. (Mateo 24:45; Yakobo
  1:5) Na cimbi icifwaikwa pa kukwata amano, kuicefya, pantu uwaicefya alomfwila ukufunda
  kwa mu Malembo. (2 Ishamfumu 22:18, 19) Natulangilile: Umwina Kristu kwena kuti
  asumina ukuti umutima wakwe wa bucenjeshi kabili walipelelwa. (Yeremia 17:9) Lelo
  bushe nga alufyanya, kuti aicefya no kusumina icilubo nga ca kuti bamufunda?\\n17.
  Londololeni cimo icingacitika mu lupwa, kabili landeni na pa fyo umufyashi engafwilisha
  umwana ukumfwikisha uyu mulandu.\\n17 Tutile ba wishi bakaanya umwana wabo umukashana
  ukuya ku kutandala babili fye na munyinefwe uwacaice mu cilonganino. Umwana ayasuka
  ba wishi ati: \u201cTata, bushe kanshi tamwancetekela? Tapali nangu cimo icabipa
  ico twalayacita!\u201d Uyu mukashana nalimo alitemwa Yehova kabili te kuti afwaye
  no kucita icabipa, nomba bushe nga ayasuka ifi, ninshi ale-endela mu \u201cmano
  [ya kwa Lesa]\u201d? Bushe kuti twatila \u2018alefulumuka ubulalelale\u2019? Nelyo
  bushe ukubulwa amano ya kwa Lesa e kwalenga ukuti atetekele \u201cumutima wakwe\u201d?
  (Amapinda 28:26) Nalimo kuti mwatontonkanya na pa mashiwi ya kwa Lesa na yambi ayengafwa
  uyu mufyashi no mwana wakwe ilyo balelanshanya pali uyu mulandu.\u2014Moneni Amapinda
  22:3; Mateo 6:13; 26:41.\\nYOSEFE ALIFULUMWIKE UBULALELALE\\n18, 19. Litunko nshi
  Yosefe akwete, kabili acitile shani?\\n18 Umulumendo umo uwatemenwe Lesa kabili
  uwafulumwike ubulalelale ni Yosefe, ndume ya kwa Dina. (Ukutendeka 30:20-24) Ilyo
  Yosefe ali umwaice, ali-imwenene ububi ubwafumine mu fintu ifya buwelewele ifyo
  nkashi yakwe acitile. Ukwabula no kutwishika, ifi ifyacitikile nkashi yakwe e lyo
  no kufwaisha ukwikalilila mu kutemwa kwa kwa Lesa, e fyamucingilile na pa numa ya
  myaka iingi mu Egupti ilyo umukashi wa kwa shikulu wakwe alemusembeleka \u201ccila
  bushiku\u201d ukuti alaale nankwe. Kwena apo ali musha, Yosefe tali na kuleka incito
  apo alefwaila fye no kuya ukufuma mu Egupti! Alingile ukuba na mano no kushipa pa
  kupwisha ubu bwafya kabili acitile fi ilyo akene muka Potifa pa miku iingi. Na mu
  kulekelesha alimufulumwike.\u2014Belengeni Ukutendeka 39:7-12.\\n19 Taleni tontonkanyeni:
  Nga ca kuti Yosefe aletontonkanya sana pali muka Potifa nelyo pa kulaalapo no mwanakashi,
  bushe nga alitwalilile ukuba uwa cishinka kuli Lesa? Nakalya. Mu nshita ya kulatontonkanya
  pa fyo cingaba ukulaala no mwanakashi, Yosefe acindike bucibusa bwakwe na Yehova,
  kabili ici calimoneke mu fyo ale-eba muka Potifa. Alemweba ukuti: \u201cShikulu
  . . . tantana nangu cimo kano fye imwe, pantu muli mukashi wakwe. E ico kuti nacita
  shani ububi bwakula ifyo no kubembukila Lesa?\u201d\u2014Ukutendeka 39:8, 9.\\n20.
  Bushe Yehova ayafwile shani Yosefe?\\n20 Elenganyeni ifyo Yehova atemenwe ilyo amwene
  umulumendo Yosefe uwali ukutali sana na balupwa wakwe aleba uwa cishinka kuli ena
  cila bushiku. (Amapinda 27:11) Pa numa Yehova alyafwile Yosefe ica kuti balifumishe
  na mu cifungo, kabili balimulaashike pa mulimo wa kuba umukalamba mu calo ca Egupti,
  alelolekesha na pa fya kulya! (Ukutendeka 41:39-49) Ala mwandini amashiwi yaba pa
  Amalumbo 97:10 ya cishinka! Yatila: \u201cMwe batemwa Yehova, pateni ifyabipa. Alinda
  imyeo ya ba cishinka bakwe; no kubapokolola mu minwe ya babifi.\u201d\\n21. Bushe
  munyinefwe umo uwacaice mu Afrika alangile shani ukuti alafwaya ukutwalilila ukuba
  ne mibele isuma?\\n21 Na muno nshiku mwine, ababomfi ba kwa Lesa abengi balalanga
  ukuti \u2018balipata ububi, no kutemwa ubusuma.\u2019 (Amose 5:15) Munyinefwe umo
  uwacaice mu Afrika atile umukashana alesambilila nankwe amwebele ukulaala nankwe
  pa kuti akamwafweko ukusanga insamushi pa mashindano. Alandile ukuti: \u201cNalikene
  apo pene fye. Ukukanacita ifyabipa kwalilenga abantu bancindika kabili nshiyumfwa
  uwasuulwa. Ifi fibili, fyalicindama ukucila golde na silfere.\u201d Ca cine ukuti
  ukucita ulubembu kuti kwalenga umuntu aumfwa \u201cubusuma bwa pa kashita fye,\u201d
  lelo ubu busuma tabutwalilila, buleta fye amafya ayakalamba nga nshi. (AbaHebere
  11:25) E lyo kabili nga mwalinganya ubu busuma ku nsansa shibelelela nga tuleumfwila
  Yehova, kuti mwamona ukuti bwa te busuma bwine bwine.\u2014Amapinda 10:22.\\nMULEPOKELELA
  UKWAFWA KWA KWA LESA WA LUSE\\n22, 23. (a) Umwina Kristu nga acita ulubembu ulukalamba,
  mulandu nshi tushingalandila ukuti calala capwa takelelwe? (b) Bushe bakacema kuti
  bayafwa shani uubembwike?\\n22 Apo tatwapwililika, bonse tulalwisha na maka ukukanacita
  ifya ulunkumbwa ififwaya imitima yesu pa kuti tucite ifyo Lesa afwaya. (Abena Roma
  7:21-25) Yehova alishiba ukuti tatwapwililika, pantu \u201calebukisha ukuti tuli
  lukungu.\u201d (Amalumbo 103:14) Lelo limo Umwina Kristu kuti acita ulubembu ulukalamba,
  bushe ninshi calala capwa te kuti elelwe? Awe iyo! Ca cine, uubembwike kuti alobolola
  ifyabipa, nga fintu cali ku Mfumu Davidi. Lelo Lesa, lyonse \u201calaiteyanya ukwelela\u201d
  abomfwa ububi no \u2018kutumbula\u2019 imembu shabo.\u2014Amalumbo 86:5; Yakobo
  5:16; belengeni Amapinda 28:13.\\n23 Na kabili Lesa alipeela icilonganino ca Bena
  Kristu \u201cifya bupe ku bantu,\u201d na ba ni bakacema bakosoka kabili abafikapo,
  abaiteyanya ukutwafwa. (Abena Efese 4:8, 12; Yakobo 5:14, 15) Ico bafwaya sana,
  kwafwilisha uubembwike pa kuti abe cibusa wa kwa Lesa na kabili, e lyo nga filya
  Imfumu ya mano yalandile, bafwaya uubembwike aba no mutima wa \u201cmano\u201d pa
  kuti tabwekeshepo ukubembuka.\u2014Amapinda 15:32.\\n\u2018BENI NO MUTIMA WA MANO\u2019\\n24,
  25. (a) Bushe umulumendo uo Amapinda 7:6-23 yalandapo alangile shani ukuti aali
  \u201cuwabula amano\u201d? (b) Kuti twacita shani pa kuti tube no \u2018mutima wa
  mano\u2019?\\n24 Baibolo yalilandapo pa muntu \u201cuwabula amano\u201d e lyo na
  pa \u201cwaba no mutima wa mano.\u201d (Amapinda 7:7) Pa mulandu wa kukanaumfwikisha
  ifyo Lesa amona ifintu no kukanaishiba bwino bwino umulimo wa kwa Lesa, \u201cuwabula
  amano\u201d te kuti aleiluka ifintu kabili kuti alafilwa ukulekanya icisuma ku cibi.
  Kuti awila bwangu mu lubembu lwabipisha nga filya cali ku mulumendo uo balandapo
  mu Amapinda 7:6-23. Lelo \u201cuwakwata umutima wa mano\u201d abika amano ku kuceeceeta
  ubuntu bwakwe ubwa mu kati ukupitila mu kusambilila Icebo ca kwa Lesa lyonse pamo
  no kupepa. Na kabili, nangu ca kuti tapwililika, alesha na maka ukuti amatontonkanyo
  yakwe, ifyo afwaya, imibele yakwe, e lyo na mapange yakwe filelingana ne fyo Lesa
  afwaya. Nga alecita ifi ninshi \u201calitemwa umweo wakwe,\u201d akapaalwa, kabili
  uyu muntu \u201cakasanga ubusuma.\u201d\u2014Amapinda 19:8.\\n25 Yipusheni amuti:
  \u2018Bushe nalishininkisha ukuti amafunde ya kwa Lesa yalilungama? Bushe nalicetekela
  sana ukuti nga nalakonka aya mafunde nkaba ne nsansa nga nshi?\u2019 (Amalumbo 19:7-10;
  Esaya 48:17, 18) Nga ca kuti mulatwishika, mulingile ukucitapo cimo. Muletontonkanya
  sana pa fifuma mu kukanakonka amafunde ya kwa Lesa. Na kabili, \u201csondeni no
  kumona ukuti Yehova musuma.\u201d Kuti mwacita ifi nga mulekonka ifyo Baibolo ilanda,
  nga muletontonkanya pa fisuma, e kutila ifintu ifya cine, ifyalungama, ifyasanguluka,
  ifyatemwikwa, kabili ifyawama. (Amalumbo 34:8; Abena Filipi 4:8, 9) Te ca kutwishika
  ukuti nga mwabika sana mano kuli ifi fintu, mukatemwa sana Lesa, mukatemwa ifyo
  atemwa kabili mukapata ifyo apata. Yosefe tali uwapwililika, lelo \u2018alifulumwike
  ubulalelale\u2019 pantu alisumine ukuti Yehova amusambilishe pa myaka iingi, no
  kumupeela umutima wa mano. Kuti cawama nga ca kuti na imwe mwaleka Yehova alemusambilisha.\u2014Esaya
  64:8.\\n26. Lyashi nshi ilyacindama ilyo tukasambililapo mu fipandwa fibili ifikonkelepo?\\n26
  Kabumba wesu tapangile ifya mfwalo ukuti tulefyangasha lelo afipangile pa kuti tulefibomfya
  pa kukwata abana na pa kuti tuleipakisha icupo. (Amapinda 5:18) Ifipandwa fibili
  ifikonkelepo fikalanda pa fyo Lesa amona icupo.\\n^ para. 4 Pa bantu abafwile abo
