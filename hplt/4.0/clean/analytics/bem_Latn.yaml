  mu kucita\u201d ubulalelale abo abapingushi baipeye e lyo na bambi abo Yehova umwine
  aipeye.\u2014Impendwa 25:4, 5.\\n^ para. 7 Nga mulefwaya ifyebo ifyalondolola umwalola
  ukukowela no kupama, belengeni icipande icitila \u201cAmepusho Ukufuma ku Babelenga\u201d
  icaba mu Ulupungu lwa kwa Kalinda ulwa July 15, 2006 ulwa Nte sha kwa Yehova.\\n^
