  iye pusukilo,+Kabili ukuicefya kwenu kulankusha.+\\n37 Mukalefya intampulo shandi;+Ne
  nkolokoso shandi tashakasokone.+\\n38 Nkakonka abalwani bandi, ukuti mbonaule,Kabili
