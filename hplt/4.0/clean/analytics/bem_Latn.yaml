sample: '["\"Icasuko ca mu Baibolo\\nAbantu balifilwa ukuleta umutende pa calo kabili
  tabakabale abauleta. Ifyalenga ni fi:\\n- Umuntu \u201c\\ntakwata amaka ya kutungulula
  intampulo shakwe.\\n\u201d (Yeremia 10:23) Abantunse tabapangilwe na maka nelyo
  insambu sha kuiteka abene, e ico te kuti balete umuntende uwingabako ku ciyayaya.
  -\\n\u201cMwitetekela intungulushi, bantunse fye abashingamupususha. Nga bafwa babwelela
  ku lukungu, na mapange yabo yonse yalaloba muli ubo bwine ubushiku bafwa.\\n\u201d
  (Amalumbo 146:3, 4, Good News Translation) Bakateka kumo na balya abafwaya sana
  ukucita ifisuma, te kuti bapwishe amafya ayalenga kuleba inkondo. - \u201c\\nMu
  nshiku sha kulekelesha mukesaba inshita ishayafya nga nshi. Pantu abantu bakaba
  . . . abankalwe, abashatemwa ubusuma, abafutuka abanabo, bamunshebwa, aba cilumba.\\n\u201d
  (2 Timote 3:1-4) Tuli mu \u201cnshiku sha sha kulekelesha\\n\u201d isha cino calo
  cabipa, umo imibele ya bantu ilenga cayafya ukuleta umutende. - \u201c\\nCabipila
  imwe mwe sonde na bemba, pantu Satana Kaseebanya naikila pali imwe, ali ne cipyu
  icikalamba, pa kwishiba ukuti ali fye ne nshita inono.\\n\u201d (Ukusokolola 12:12)
  Satana Kaseebanya, umulwani wa kwa Lesa balimupoosa pano calo kabili alatunka abantu
  ukukwata imibele yabipa iyo akwatako. Ilyo Satana acili \u2018aleteka pano calo,\\n\u2019
  muli cino calo te kuti mube umutende.\u2014Yohane 12:31. - \u201c\\n[Ubufumu bwa
  kwa Lesa] \u201cbukashonaula no kupwisha aya mabufumu yonse, kabili bwena bukeminina
  umuyayaya.\\n\u201d (Daniele 2:44) Bufumu bwa kwa Lesa fye e bukaletela abantu umutende
  bafwaisha, uushakapwe.\u2014Amalumbo 145:16.\"", "\"Icasuko ca mu Baibolo\\nBaibolo
  itila Satana Kaseebanya e ko aba. Kabili abomfya \u201cifipesha amano ifya bufi\\n\u201d
  e lyo \u2018alabepa\\n\u2019 pa kuti ifyo alefwaya ficitike. Aba nge cipondo icakwata
  sana amaka. Baibolo itila, Satana \u201calaifungushanya kwati ni malaika wa lubuuto.\\n\u201d
  (2 Abena Tesalonika 2:9, 10; 2 Abena Korinti 11:14) Ububifi ubucitika bulanga fye
  ukuti Satana e ko aba.\\nLelo Satana te waleta ukucula konse. Cinshi twalandila
  ifi? Lesa apangile abantu na maka ya kuisalila abene nampo nga balefwaya ukucita
  icisuma nelyo iyo. (Yoshua 24:15) Nga twacita ifyabipa, mulafuma ifibi.\u2014Abena
  Galatia 6:7, 8.\"", "\"Zambiaian sensation, rapper and performer signed to Jerahyo
  Inc. Talent and Artist Management \u2013 Triple M, also known as Rap Shofele, dashes
  out a brand new banger named \u201cTutambakofye\u201d. Triple M is one of the fast
  growing artist in the music industry and does nothing but to deliver the best of
  his art. This is bound to be another jam that you must listen to.\\n\u201cTutambakofye\u201d
  features Nexus Music Entertainment signed rapper Xaven and Baila Empire frontman
  T Sean. The song was produced by King Nachi Beats of KNB Records, a skilled record
  producer. he added to the development of a sound that is obvious and delighting
  through his capacities on the sheets. Listen, Download and Enjoy.\\nLyrics Tutambakofye
  ft. T Sean & Xaven \u2013 Triple M \u2026 Apatatutemwa balitushokwesha Twalileka
  twalinaka ukwesha NImbona nausula mwandi tusha Tupwishisha amashiko muma dodocha
  Nga twamana new couple Tutambakofye Naifwe balitushapo tutambakofye Since twalipitamo
  kale Filapwa ale tutambakofye Nga twamona new Filapwa Ilyashi lyakumutima takwaba
  ukukosa Lilakalipa lwenu mukalila Mule spenda vacation ku sassasa Kanshi ninshi
  kumbali chilalisha Tababa Ati balinkobekela kale Chikulu naupakula tasalembale That\u2019s
  why ifyakutemwa Nali surrender Better ukubukusafye paka waufwa lama Bakubika ku
  status Bambi nababa bluloka Kanshi twalifipitamo kale ifyo IKala panshi teka umutima
  nwinapo amenshi Heartbreak\"", "\"YOSEFE alelolesha sana ku kabanga, nalimo aletontonkanya
  pa kufulumuka no kubwelelamo ku ng\u2019anda. Ku mwabo ni ku Hebrone ukucila impili
  ishalemoneka akatalamukila. Wishi Yakobo afwile alikele aletuusha mu cungulo ukwabula
  ukwishiba icacitike ku mwana wakwe uo atemenwe sana. Yosefe tali no kubwelelamo
  ku ng\u2019anda pali iyi nshita; lelo ena alemona kwati takatale amonanapo na bawishi
  abali abakote. Aba makwebo balemulolekesha ilyo baleya ne ngamila shabo mu musebo
  uwaonaika uwalolele ku kapinda ka ku kulyo. Apo balimushitile, lyonse tabalefwaya
  afuma mu menso. Kuli bena, uyu mulumendo ali no mutengo sana kwati fye finyamuti
  na mafuta ifyo basendele, ifyali no mutengo sana ku calo ca kutali ica Egupti.\\nYosefe
  afwile ali fye ne myaka nalimo 17. Ilyo ale-esha ukutontonkanya pa fyo ifintu fyamubipiile,
  elenganyeni ukuti alelolesha mu muulu lwa ku masamba, ninshi akasuba kele kalewa
  kabili kali mupepi no kuleka ukumoneka pali Bemba Mukalamba. Calimukosele ukusumina
  ukuti abakalamba bakwe balefwaya ukumwipaya kabili balimushitishe mu busha. Afwile
  alelukusha ne filamba. Taishibe ifyo ifintu fyali no kuba ku ntanshi.\\nBushe cali
  shani pa kuti Yosefe abe muli ubu bwafya? Kabili finshi tulesambililako ku citetekelo
  ca uyu mulumendo ou balupwa bacushishe no kukaana?\\nULUPWA AFYALILWEMO\\nYosefe
  akulile mu lupwa ulukalamba, lelo tamwali insansa kabili tabaikatene. Ifyo Baibolo
  ilanda pa lupwa lwa kwa Yakobo filanga ukuti ukuupa impali te kusuma. Lelo, pa nshita
  imo Lesa alisuminishe abantu bakwe ukulaupa impali, mpaka ilyo Umwana wakwe aishilebweseshapo
  ifunde ilya kukwata fye umukashi umo. (Mateo 19:4-6) Yakobo akwete abana mupepi
  na 14 mu banakashi bane, abakashi bakwe babili, Leya na Rakele, na mu babomfi babo
  abanakashi, Silupa na Bilha. Ukutula fye pa kubala, Yakobo atemenwe Rakele pantu
  ali uwayemba. Tatemenwe Leya, umukalamba pali Rakele uo bamupeele mu bucenjeshi,
  nge fyo atemenwe Rakele. Aba banakashi balecimfyanya, kabili ici calengele ukuti
  na bana abo bakwete babe no bufuba.\u2014Ukutendeka 29:16-35; 30:1, 8, 19, 20; 37:35.\\nRakele
  ali ing\u2019umba pa myaka iingi, kabili ilyo aishilefyala Yosefe, Yakobo alitemenwe
  sana umwana wakwe uwa mu bukalamba. Ku ca kumwenako, ilyo ulu lupwa lwaleya mu kukumana
  na Esau, umukalamba wa kwa Yakobo uwalefwaya ukumwipaya akale, Yakobo ashininkishe
  ukuti Rakele no mwana wakwe Yosefe nabacingililwa ku numa ya ba mu ng\u2019anda
  yakwe bonse. Yosefe afwile talabile ifyacitike pali bulya bushiku. Elenganyeni ifyo
  aumfwile pali bulya bushiku ulucelo ilyo aletontonkanya pa calengele bawishi abali
  na maka ukulasunta pa kwenda. Afwile alipapile sana ilyo aishibe icalengele: Ukuti
  ubushiku bwafumineko bawishi balwishenye na malaika uwa amaka nga nshi! Mulandu
  nshi? Pantu Yakobo alefwaya bamupaale kuli Yehova Lesa. Yehova alipaalile Yakobo
  ilyo ayalwile ishina lyakwe ukuba Israele. Uluko lonse lwali no kwinikwa ishina
  lyakwe! (Ukutendeka 32:22-31) Mu kuya kwa nshita, Yosefe aishibe ukuti abana ba
  kwa Israele bali no kufyala imikowa iya muli lulya luko!\\nPa numa, Yosefe aishileba
  no bulanda sana ilyo banyina abo atemenwe sana bafwile ninshi acili fye umwaice.
  Bafwile pa kupaapa umwaice wakwe, Benjamini. Bawishi bali no bulanda icine cine.
  Elenganyeni Yakobo alekumuna ifilamba ku menso ya kwa Yosefe, alemusansamusha ilyo
  alemwebako pe subilo ilyasansamwishe Abrahamu wishikulu wa kwa Yakobo. Yosefe afwile
  alisansamushiwe ilyo aishibe ukuti bushiku bumo Yehova akabuusha banyina ku bafwa!
  Afwile alishiletemwa sana \u201cLesa . . . wa ba mweo.\u201d (Luka 20:38; AbaHebere
  11:17-19) Ilyo umukashi wakwe afwile, Yakobo alitemenwe sana aba bana bakwe babili,
  abafyelwe muli Rakele.\u2014Ukutendeka 35:18-20; 37:3; 44:27-29.\\nAbana abengi
  nga balebasunga muli uyu musango kuti baonaika, lelo Yosefe alisambilile imibele
  iisuma ku bafyashi bakwe, kabili ali ne citetekelo icakosa e lyo alikwete na maka
  ya kulekanya icalungama ne calubana. Ilyo ali ne myaka 17, aleafwa abakalamba bakwe
  ukucema imikuni, kabili amwene abakalamba bakwe balufyanya. Bushe aikele fye ukwabula
  ukulanda pa kuti abakalamba bakwe bamutemwe? Na lyo line, Yosefe asalilepo ukucita
  icalungama. Ailebasosela kuli bawishi. (Ukutendeka 37:2) Nalimo uku kushipa ukwa
  kuti ayalanda ifyacitile abakalamba bakwe e kwalengele ukuti bawishi bamutemwe sana.
  Ala Abena Kristu abacaice kuti basambililako ifingi kuli Yosefe! Nga batunkwa ukufisa
  imembu shabipisha isha banabo nelyo balupwa lwabo, balingile ukupashanya Yosefe
  no kuyaeba abengalinga ukubombelapo pali ico cilubo.\u2014Ubwina Lebi 5:1.\\nNa
  kabili kuti twasambililako na ku lupwa Yosefe afyalilwemo. Nangu ca kuti pali ino
  nshita Abena Kristu ba cine tabopa impali, kwaliba indupwa ishingi umwaba na bana
  aba kusangamo, abana abakwata abafyashi abashabafyalilila, ne ndume ne nkashi abashafyalwa
  inda imo. Bonse kuti basambililako ku lupwa lwa kwa Yakobo ukuti akapatulula nelyo
  ukutemwisha aba mu lupwa bamo ukucila bambi kulalenga ulupwa ukukanaikatana. Abafyashi
  abasuma abakwata indupwa sha musango yu balasambilisha abana babo na ba kusangamo
  ukuti bonse babatemwa fye cimo cine kabili bonse kuti balenga mu lupwa mwaba insansa.\u2014Abena
  Roma 2:11.\\nBATENDEKA UKUBA NO BUFUBA\\nYakobo nalimo alicindike sana Yosefe pa
  mulandu wa kuti alitemenwe icalungama. Amubilile ica kufwala icisuma. (Ukutendeka
  37:3) Cifwile cali icisuma, icitali kabili ica maboko ayatali. Nalimo cali ca kufwala
  umukankala nelyo umwana wa mfumu.\\nYakobo talufyenye ukumubilila ica kufwala, kabili
  ubu bupe wishi amupeele ubwali cishibilo ca kuti alimucindike no kumutemwa bufwile
  bwalifikile sana Yosefe pa mutima. Lelo ici ca kufwala cali no kumuletela amafya
  ayengi. Ku ca kumwenako, uyu mulumendo ali ni kacema. Iyi yali ni ncito iyakosa.
  Elenganyeni umwaice nafwala ica kufwala icisuma ilyo ale-enda mu fyani ifitali,
  alenina impili, nelyo alefumya impaanga iiketwe ku cimuti ca myunga. Bushe ici ca
  kufwala, icali icishibilo icalelanga ifyo Yakobo atemenwe Yosefe cali no kukuma
  shani ifyo Yosefe aleumfwana na bamunyina?\\nBaibolo itila: \u201cIlyo bamunyina
  bamwene ukuti e o shibo atemenwe ukucila bamunyina bonse, balimupatile, kabili tabalelanda
  nankwe mutende mutende.\u201d * (Ukutendeka 37:4) Kwena kuti baumfwa ubufuba, lelo
  balilufyenye ukuleka iyi mibele yabipa ukuba mu mitima yabo. (Amapinda 14:30; 27:4)
  Bushe mwalibala amufimbilapo umuntu pa mulandu wa kuti bambi balimubikako amano
  nelyo balimucindika? Ibukisheni bamunyina ba kwa Yosefe. Ubufuba bwalengele bacite
  ifyabipa ifyo ku ntanshi balelanguluka ukuti nga tabacitile. Ifyo bacitile fisambilisha
  Abena Kristu ukuti cisuma \u2018ukusekelela pamo na balesekelela.\u2019\u2014Abena
  Roma 12:15.\\nYosefe afwile alimwene ukuti bamunyina balimupatile. Nomba bushe alifishile
  ica kufwala cakwe icisuma ilyo bamunyina babwelele? Afwile alefwaya ukufisa. Ibukisheni
  ukuti, Yakobo alefwaya cilya ca kufwala ukuba icishibilo ca fyo atemenwe umwana
  wakwe. Yosefe alefwala ica kufwala bamupeele pantu alefwaya ukutwalilila ukuba ne
  cishinka kuli bawishi pa kuti batwalilile ukumucetekela. Kuti twasambililako kuli
  ena. Nangu ca kutila Shifwe wa ku muulu taba na kapatulula, inshita shimo alasalapo
  ababomfi bakwe aba cishinka no kubapaala. E lyo kabili alabeba ukupusanako na bantu
  ba muli cino calo icabipa. Nga filya fine ica kufwala ca kwa Yosefe cali icisuma,
  imibele iisuma iyo Abena Kristu ba cine bakwata ilalenga bapusanako na bantu aba
  muli cino calo. Ici cilenga abantu ukubafubila no kubapata. (1 Petro 4:4) Bushe
  Abena Kristu bafwile ukuifisa nelyo ukukanaishibisha ukuti babomfi ba kwa Lesa?
  Awe\u2014Yosefe tafishile ica kufwala cakwe.\u2014Luka 11:33.\\nIFILOTO FYA KWA
  YOSEFE\\nTapakokwele, Yosefe alotele ifiloto fibili ifyaibela. Mu ciloto ca kubalilapo,
  Yosefe alotele ukuti ena na bamunyina balekaka imyanshi ya ngano. Lelo imyanshi
  ya bamunyina yashingulwike umwanshi wakwe no ku-utootela. Mu ciloto ca bubili, akasuba,
  umweshi ne ntanda 11 fyaletootela Yosefe. (Ukutendeka 37:6, 7, 9) Cinshi Yosefe
  acitile pali ifi filoto fyaibela alotele?\\nIfiloto alotele fyafumine kuli Yehova
  Lesa. Fyali kusesema ukwafumine kuli Lesa kabili alefwaya Yosefe abebe ifyo alefwaya
  beshibe. Calolele mu kuti, Yosefe ali no kucita ifyo bakasesema baishiletendeka
  ukucita ilyo balebilisha amashiwi ya kwa Lesa no kusoka abantu bakwe abashali ne
  cumfwila.\\nYosefe aebele bamunyina ukuti: \u201cUmfweni, iciloto ico nacilota.\u201d
  Bamunyina balishibe umwalolele iciloto, kabili tabatemenwe nangu panono. Awe bamwipwishe
  abati: \u201cBushe cine cine ukaba imfumu pali ifwe? Atemwa, bushe cine cine ukatuteka?\u201d
  Baibolo ilanda no kuti: \u201cE ico basangile umulandu na umbi uwa kumupatilapo
  pa filoto fyakwe ne fyebo fyakwe.\u201d Ilyo Yosefe ashimikile wishi na bamunyina
  iciloto calenga bubili, ifintu fyalibipileko. Baibolo itila: \u201cWishi atendeke
  ukumukalipila no kumweba ati: \u2018Calola mwi ici ciloto ulotele? Bushe cine cine
  ine na banoko na bamunonko ni fwe tukese no kuwa pa nshi ku kutootela iwe?\u2019\u201d
  Lelo wishi atwalilile ukutontonkanya pali aya mashiwi. Bushe ni Yehova e ulelandila
  muli uyu mulumendo?\u2014Ukutendeka 37:6, 8, 10, 11.\\nYosefe te wali uwa kubalilapo
  nelyo uwa kulekelesha uo Yehova abomfeshe ku kulanda ukusesema uko abantu bambi
  bashatemenwe kabili ukwali no kulenga abantu ukubacusha. Yesu e wali uwakulisha
  pa babomfi ba kwa Lesa aba musango yu, kabili aebele abasambi bakwe ukuti: \u201cNga
  bacushishe ine, na imwe bakamucusha.\u201d (Yohane 15:20) Abena Kristu bonse, abakalamba
  na baice, kuti basambililako ku citetekelo na ku kushipa kwa kwa Yosefe.\\nULUPATO
  LWAKULILAKO\\nPapitile fye inshita iinono, Yakobo atumine Yosefe pa bulendo. Abana
  bakwe abakalamba baile balecema imikuni ku kapinda ka ku kuso aka Shekemu, uko bacitile
  abalwani muli shilya shine nshiku. Nge fyo umufyashi onse engacita, Yakobo alisakamene
  kabili alefwaya ukwishiba ifyo abana bakwe bali, e ico atumine Yosefe ukuya ku kumona
  nga bali fye bwino. Bushe Yosefe ayumfwile shani? Alishibe ukuti bamunyina balimupatile
  sana! Bushe bali no kumfwa shani nga aya kuli bena mu kubeba ifyo wishi amutumine?
  Na lyo line, Yosefe aliile.\u2014Ukutendeka 34:25-30; 37:12-14.\\nUbu bulendo bwali
  ubutali, nalimo aendele inshiku shine nelyo shisano ukuya ku Shekemu. Shekemu yabelele
  ku kapinda ka ku kuso aka Hebrone kabili pali amakilomita 80. Lelo ilyo Yosefe afikile
  ku Shekemu, asangile bamunyina baliya ku Dotani, apalepele amakilomita nalimo 22
  ku kupinda ka ku kuso. Ilyo Yosefe afikile ku Dotani, bamunyina balimumwene aleisa
  akatalamukila. Apo pene ulupato bakwete lwalengele bakalipe nga nshi. Baibolo itila:
  \u201cE ico basoseshenye abati: \u2018Moneni! Kalota wa filoto ulya aisa. E ico
  nomba iseni uleke tumwipaye no kumupoosa mu cilindi ca menshi cimo pali ifi; na
  ifwe tukatila iciswango icikali e cimuliile. E lyo tukamona ifyo fikaba ifiloto
  fyakwe.\u2019\u201d Nomba Rubene aebele bamunyina ukupoosa Yosefe mu cilindi ca
  menshi, pantu alefwaya ukwisamufumyamo pa numa.\u2014Ukutendeka 37:19-22.\\nUkwabula
  ukwishiba, Yosefe afikile pali bamunyina kabili afwile ale-enekela ukuti balamupokelela
  bwino. Lelo bamunyina balimwimine! Bamufuulile ica kufwala cakwe icisuma no kumukululula
  mpaka bamupoosa na mu cilindi ca menshi icakama. Awe e fyo Yosefe afikile na pa
  nshi! Alyeseshe ukufuma mu cilindi, nomba alifilwe. Alemona fye amakumbi yeka yeka
  kabili amashiwi ya bamunyina yaile yalecepa mpaka yaleka ukumfwika. Alepunda, no
  kupapaata, lelo tabamubikileko na mano. Ukwabula no kumfwako uluse, baikele lwa
  mupepi no kutendeka ukulya ica kulya. Ilyo Rubene afuminepo, na kabili batendeke
  ukufwaya ukwipaya umwaice, lelo Yuda aebele bamunyina ukuti bamushitishe fye ku
  bamakwebo abalepita. Umushi wa Dotani wabelele mupepi ne nshila iyo aba makwebo
  balepitamo pa kuya ku Egupti, kabili tapakokwele abalendo abena Ishmaele na bena
  Midiani baishile mu kupita apo bali. Ilyo Rubene abwelele asangile nabamushitisha
  kale. Bashitishe munyinabo mu busha pa mashekele 20. *\u2014Ukutendeka 37:23-28;
  42:21.\\nAwe e fyo Yosefe bamusendele ku bena Ishmaele aba makwebo. Kabili ilyo
  baleya nankwe ku kapinda ka ku kulyo mu musebo waya ku Egupti, Yosefe alemoneka
  kwati nalufya fyonse ifyo akwete. Balimutalwishe kuli balupwa lwakwe! Pa myaka iingi
  tali na kwishiba ifyo ulupwa lwali, ifyo Rubene aumfwile ububi ilyo abwelele no
  kusanga ukuti Yosefe nabamushitisha; ifyo Yakobo aumfwile ubulanda ilyo bamubepele
  ukuti Yosefe nafwa; tali na kumfwako ifili fyonse pali wishikulu Isaki; kabili tali
  na kwishiba ifyo umwaice wakwe Benjamini ali uo ali no kulafuluka nga nshi. Nomba
  bushe Yosefe alilufishe fyonse ifyo akwete?\u2014Ukutendeka 37:29-35.\\nYosefe alikwete
  icitetekelo ico bamunyina bashakwete amaka ya kumupoka. Alishibe ifingi pali Yehova
  Lesa kabili takwali nangu umo uwali no ku mupoka ici. Ukumutalusha kuli balupwa,
  amafya akwete ilyo bamusendele pa bulendo ubutali ubwa kumutwala ku Egupti, nelyo
  umuseebanya wa kumushitisha mu busha ku mukankaala wa ku Egupti uo baleita ati Potifa,
  tafyali na kumulenga alabe Yehova. (Ukutendeka 37:36) Ilyo ali na aya mafya, icitetekelo
  cakwe na bucibusa bakwe na Lesa fyalekoselako fye. Mu fipande fili ku ntanshi, tukamona
  ifyo icitetekelo ca kwa Yosefe calengele ukuti Lesa, Yehova, alemubomfya sana, e
  lyo ne fyo camwafwile ukubomba no lupwa lwakwe ulwali na mafya. Kanshi kuti cawama
  sana ukupashanya icitetekelo Yosefe akwete!\\n^ para. 15 Abafwailisha bamo batila
  bamunyina kwa Yosefe balemona kwati filya wishi apeele Yosefe ubupe fyalelanga ukuti
  e o alefwaya akapeela ububeli. Balishibe ukuti Yosefe e wali ibeli mu mwanakashi
  uo bawishi batemenwe sana, umwanakashi ou balefwaya ukubalilapo ukuupa. Kabili ibeli
  lya kwa Yakobo, Rubene alisendeme na kanakashi wa kwa wishi, kabili asaalwile wishi
  no kulufya ububeli bwakwe.\u2014Ukutendeka 35:22; 49:3, 4.\"", "\"Pali ba Nte 35,000
  abaleikala mu Germany e lyo ne fyalo umo abaNazi baleteka, ba Nte nalimo 1,500 balifwile
  ilyo abaNazi baleipaya abantu mu nshita ya nkondo. Te ba Nte bonse abafwile abo
  twaishiba umulandu bafwilile. Apo bacili balafwailikisha icalengele ukuti bamo bafwe,
  kanshi impendwa kuti yayaluka mu kupita kwa nshita.\\nBushe bafwile shani?\\nAbo
  baipeye: Ba Nte mupepi na 400 balibepeye mu Germany e lyo na mu ncende abaNazi baleteka.
  Bamo abo baleipaya balebalubulwisha mu filye e lyo babapingwila ukufwa kabili balebaputulako
  imitwe. Bambi balepika imfuti nelyo ukubakulika ukwabula no kubatwala ku cilye ukuti
  ba balubulwishe.\\nBalebasunga bulukubuluku: Ba Nte ukucila pali 1,000 balifwile
  mu nkambi abaNazi balecushisha abantu na mu fifungo. Balebabomfya bulukubuluku kabili
  balefwa ku milimo, nelyo pa mulandu wa ku balebakanda, balebekalika insala, balefwa
  ku mpepo, ku malwele e lyo na kukubulwa umuti nga balwala. Pa mulandu ne fyo balebasunga
  bulukubuluku, bamo bafwile ilyo fye balubwike pa numa ya Nkondo ya Calo iya Bubili.\\nFimbi
  ifyalengele: Ba Nte bamo balebabika mu muputule umo, umo balebepaila ukubomfya umwela
  wasumu, balefwa nga badokota bapanga umuti uupya e lyo babalasa pa kuti bamone nga
  ulebomba bwino, e lyo bamo balebalasa inshindano ya muti wa kwipailako.\\nMulandu
  nshi balebacushisha?\\nInte sha kwa Yehova balebacusha pantu balekonka ifyo Baibolo
  isambilisha. Nga ca kuti ubuteko bwa baNazi bwabeba ukucita ifyo Baibolo yalesha,
  ba Nte balekaana ukuficita. Balesalapo \u201cukunakila Lesa ukucila ukunakila abantu.\u201d
  (Imilimo 5:29) Moneni ifintu fibili ifyo balesalapo ukucita.\\nTabalefwaya ukuitumpa
  mu fikansa fya calo. Nga fintu ba Nte mu fyalo fyonse baba, Inte sha kwa Yehova
  abaliko ilyo ubuteko bwa baNazi bwaleteka nabo tabaleitumpa mu fikansa fya calo.
  (Yohane 18:36) Kanshi, balekaana\\nUkwingila ubushilika nelyo ukubomba imilimo iili
  yonse iyaletungilila inkondo.\u2014Esaya 2:4; Mateo 26:52.\\nUkusalako intungulushi
  nelyo ukwingila mu tubungwe twaba baNazi.\u2014Yohane 17:16.\\nUkupika salyuti ku
  mendela nelyo ukusosa ukuti \u201cHeil Hitler!\u201d (ipusukilo lifuma kuli Hitler)\u2014Mateo
  23:10; 1 Abena Korinti 10:14.\\nBalefwaya ukulapepa. Nangu ca kuti balibakeenye
  ukulapepa, Inte sha kwa Yehova balitwalilile\\nUkulalongana ku kupepa.\u2014AbaHebere
  10:24, 25.\\nUkulabila ubukombe bwa mu Baibolo no kulapeela abantu impapulo shilanda
  pa fya mu Baibolo.\u2014Mateo 28:19, 20.\\nUkuba ne cikuuku ku bantu, ukubikako
  fye na baYuda.\u2014Marko 12:31.\\nUkuba ne citetekelo, balekaana ukusaina ifipepala
  fya kulekelapo ukuba Inte sha kwa Yehova.\u2014Marko 12:30.\\nProfesa Robert Gerwarth
  alandile pa Nte sha kwa Yehova ukuti, \u201ce bumba fye ilya mapepo ilyo abaNazi
  balecusha pa mulandu ne fyo basuminemo.\u201d * Abantu bambi abali mu nkambi balecushisha
  abantu balekumbwa ifyo Inte sha kwa Yehova bashipile. Umwaume umwina Austria uwali
  mu cifungo atile: \u201cTabaya ku nkondo. Balesalapo ukubepaya ukucila bena baipaya
  umuntu.\u201d\\nNi kwi bafwilile?\\nMu nkambi balecushisha abantu: Inte sha kwa
  Yehova abengi bafwilile mu nkambi balecushishamo abantu. Bababikile mu nkambi pamo
  nga Auschwitz, Buchenwald, Dachau, Flossenb\u00fcrg, Mauthausen, Neuengamme, Niederhagen,
  Ravensbr\u00fcck, na Sachsenhausen. Mu nkambi ya Sachsenhausen mweka fye, Inte sha
  kwa Yehova abafwile bali nalimo 200.\\nMu fifungo: Ba Nte bamo abali mu fifungo
  balebakanda mpaka bafwa. Bambi balefwa pa mulandu wa mpumo isho balekwata ilyo balebalubulwisha
  ku bashilika nelyo bakapokola.\\nUko baleipaila abantu: Inte sha kwa Yehova balebepaila
  sana mu cifungo ca Berlin-Pl\u00f6tzensee, mu Brandenburg, na mu Halle/Saale. Na
  kabili, balisanga ifyebo ifilanga ukuti kwali incende na shimbi 70 uko ba Nte balebepaila.\\nBamo
  abo baipeye\\nIshina: Helene Gotthold\\nUko babepaile: Mu Pl\u00f6tzensee (mu Berlin)\\nBa
  Helene, balyupilwe kabili balikwete abana babili umwaume no mukashana, balibekete
  pa miku iingi. Mu 1937, balibacushishe sana ica kuti ilyo balebalubulwisha umwana
  uwali mwi fumo alifwile. Pa 8 December, mu 1944, balibaputwileko umutwe ukubomfya
  mashini iyakwete umwele uwatwa mu cifungo ca Pl\u00f6tzensee, mu Berlin.\\nIshina:
  Gerhard Liebold\\nUko babepaile: Brandenburg\\nBa Gerhard bali ne myaka 20 ilyo
  ba baputwileko umutwe pa 6 May, mu 1943, babepeye pa numa ya myaka ibili ukutula
  apo bawishi ba baputwileko umutwe mu cifungo cimo cine. Muli kalata balembeele balupwa
  na nkobekela wabo iya kubalaya batile: \u201cShikulu nga tangafwile, nga nalifilwa
  ukushipikisha.\u201d\\nIshina: Rudolf Auschner\\nUko bamwipaile: Halle/Saale\\nRudolf
  ali ne myaka 17 ilyo bamuputwileko umutwe pa 22 September, mu 1944. Muli kalata
  alembeele banyina iya kubalaya atile: \u201cBamunyinefwe abengi balishipikisha ukufika
  na ku mfwa, na ine wine e fyo nalacita.\u201d\"", "\"Baibolo pa Intaneti\\nBAIBOLO\u2014AMALEMBO
  YA CALO CIPYA\\nApo tubombela pamo nankwe,+ tulemupapaata ukuti mwilacita ifipusene
  no bufwayo bwa cikuuku ico Lesa alanga kuli imwe.+\\nPantu atile: \u201cMu nshita
  ya kupokelelwamo nalikumfwile, na mu bushiku bwe pusukilo nalikwafwile.\u201d+ Moneni!
  Ino ine e nshita ya kupokelelwamo.+ Moneni! Buno e bushiku bwe pusukilo.+\\nTatucita
  nangu cimo icingapunwisha bambi,+ pa kuti abantu beba na pa kusangila ifilubo mu
  mulimo wesu;+\\nlelo muli fyonse tulanga+ ukuti tuli babomfi ba kwa Lesa, ilyo tuleshipikisha
  ifingi, mu macushi, mu kukabila, mu mafya,+\\nmu mpumo, mu fifungo,+ mu fimfulunganya,
  mu kucucutika, mu kufufiwa utulo, na mu kubulwa ifya kulya.+\\nKabili tulanga ukuti
  tuli babomfi ba kwa Lesa pa kuba abasanguluka, e lyo na mu kwishiba Lesa, mu kushishimisha,+
  na mu kuba ne cikuuku.+ Kabili ukukwata umupashi wa mushilo no kuba no kutemwa ukushili
  kwa bumbimunda,+\\nno kusosa icishinka na fyo filalanga ukuti tuli babomfi ba kwa
  Lesa. Kabili ku maka+ ya kwa Lesa na ku kubomfya ifyanso+ fya bulungami ifya kulwishishako
  no kuipokolwelako, na ko tulalangilako ukuti tuli babomfi ba kwa Lesa.\\nIlyo batucindika
  ne lyo batusaalula, ilyo batwamba ne lyo balanda ifisuma pali ifwe; ilyo batumona
  kwati tuli ncenjeshi+ nangu ca kuti tuli ba cishinka,\\nilyo batumona kwati tatwaishibikwa
  nangu ca kuti twalishibikwa bwino,+ ilyo batumona nga bafwa nomba moneni tucili
  abomi,+ ilyo batumona kwati tulingile ukukandwa+ nangu ca kuti tatufwile ukwipaiwa,
  ifwe tulalanga ukuti tuli babomfi ba kwa Lesa.+\\nNangu ca kuti batumona kwati tuli
  no bulanda, ifwe tulasekelela lyonse, nangu ca kuti batumona kwati tuli bapiina
  ni fwe tulenga abengi ukuba abakankaala, nangu ca kuti batumona kwati tatwakwata
  kantu, twalikwata fyonse. Ukucita ifi fyonse e kulanga ukuti tuli babomfi bwa kwa
  Lesa.+\\nNatumweba fye fyonse, mwe bena Korinti, ifwe twalikusha ukutemwa kwesu.\\nMwalikwata
  incende iikalamba mu mitima yesu+ lelo inkumbu shalicepa mu mitima yenu.+\\nNomba
  pa kuti na imwe mube nge fyo twaba, ndesosa nga ku bana+ ndeti, kusheni ukutemwa
  kwenu.\\nMwiba kwi koli limo line na bashatetekela+ pantu tamwaba cimo cine. Bushe
  ubulungami na bumpulamafunde kuti fyaumfwana shani?+ Napamo ulubuuto ne mfifi kuti
  fyaikala shani pamo?+\\nKabili, Kristu kuti aumfwana shani na Beliali?+ Napamo uwatetekela
  kuti aumfwana shani+ no ushatetekela?\\nKabili bushe itempele lya kwa Lesa kuti
  lyaumfwana no tulubi?+ Pantu ifwe tuli itempele+ lya kwa Lesa wa mweo; filya Lesa
  umwine asosele, ati: \u201cNkekala muli bena+ no kwendaendamo, kabili nkaba Lesa
  wabo, na bo bakaba abantu bandi.\u201d+\\n\u201c\u2018E ico fumenimo muli bena,
  no kuipaatulako,\u2019 e fyasosa Yehova, \u2018kabili mwi-ikatako ku cishasanguluka\u2019\u201d;+
  \u201c\u2018na ine nkamupokelela.\u2019\u201d+\\n\u201c\u2018Kabili nkaba Shinwe,+
  na imwe mukaba abana bandi abaume na bana bandi abanakashi,\u2019+ e fyasosa Yehova
  Wa Maka Yonse.\u201d+\"", "\"BUSHE\\nINGEHENA CINSHI KABILI YABA KWI?\\nUkulila\\nkwamfuti
  icililelile kwalicitike ilyo umwana wesukulu umo aile ingila\\nmusukulu no kwipaya
  abanankwe alesambilila nabo abengi. Umuntu uwaitemwa\\nilyo bamutamfishe incito
  yakwe abwelele nokwingilila abakalamba bancito\\nnokubalasa imfuti. Nyinefwe umo
  asunkile motoka yakwe mulibemba nabana\\nbakwe babili mukati banwina nokufwa.\\nMufyalo\\nifikalamba
  fibili amakana namakana yabantu baipaiwa pamulandu wa kusangululwa\\nkwa mutundu.
  Ukutula fye nakunkulo shakale ukulaka kwa mitundu kwaleta\\nubwafya. Abaume, abanakashi,
  abaice notwana baipaiwa ne mfuti, baputaulwa,\\nbapumwa elyo banamayo babapatikisha
  ukuulungana nabo.\\nBuntala\\nmisoka ubwamusango ifi ubupingulo kwipaiwa. Amabumba
  ayengi yalima ukususha\\nubupingushi bwakwi paiwa nokubwita ati tebuntunse iyoo
  \\\"fyabututu\\nsana.\\\" Elyo baipusha, Bushe aba bakepaya bena teti ba pusushiwe?\\nBushe
  cinshi cawaminako ukwipailako ntala misoka? Bushe cipuna camalaiti?\\nBambi batontonkanya
  ifyo inshindano yamuti uukali uwipaya eisuma. Bambi\\nnabo abati ukubakulika kwawamapo.\\nLelo\\nukukulanda
  konse palwa kupingula ukwipaiwa kwa ba icintu cimo ico tabatontonkanyapo\\nukuti
  intala misoka ifwile yacushiwa apakalamba ilyo tabalaipaya. Tapaba\\nnaumbi uwatontonkanyapo
  ifyo intala misoka ifwile ba yoca mumulilo mpaka\\nyafwa. Lelo abaKristu abacishinka
  batila ifi efikacita Lesa kumpula\\nmafunde. Mpulamafunde afwile acushiwa pakuti
  ashininkisha pa membu shakwe.\\nIcabipishapo kumona icikope ca kwa Lesa alekanda
  imbifi mu mulilo wape.\\nBushe finshi fyacitika kumbifi? Bushe amacushi yabo yasuminishiwa
  shani\\nmukutemwa no mulinganya uwakwa Lesa? Natumone ubwasuko mucipingo.\\n1.\\nUKULEPUKA
  KWA MUTIMA UKWA KULEKELESHA UKWA KWA YESU\\nPamyaka\\namakana mutanda Lesa alepapata
  abaume na banakashi\\n\\\"ukulingana\\nnefyo naba, efya sosa Lesa wamilalo, nshisekela
  mumfwa ya mubifi, lelo\\nukuti imbifi ifume kufya bipa no kuba no mweo.\\\" - Ezekele
  33:11.\\nUlupanda\\nlwasokolola ifyo Lesa alefwaya ukupususha umuntunse. Ilyo Yesu
  alilile\\npalupanda, \\\"Tata mubelele, pantu tabeshibe ico balecita,\\\"\\naiswile
  umutima wakwe uwaleshikitikwa (Luka 23:34). Yesu Kristu apopene\\naleka no mweo
  bambi batila afwile no mutima uwalepuka kucikonko (Yohane\\n19:30, 34).\\nNangula\\nYesu
  Kristu alangile ukutemwa ukwa kupapa abantu abengi tabafwaya ukuya\\nkuli Yesu ukulingana
  nefyo ubupulumushi bwaba mukati kesonde umuntuse\\nakalaikala umweo uwabulanda.
  Eico ubupulumushi bufwile bwa onaulwa.\\nBushe Lesa ali no kupwisha shani ubupulumushi?\\n\\\"Ubushiku\\nbwa
  kwa shikulu buleisa\\n. Imyulu ikafumishiwapo kucibulumo elyo\\nnafyonse ifyabamo
  fikapya.\\\" - Petero wa cibili 3:10.\\nLesa\\nkulipele pele ali nokuwamya isonde
  ilya bupulumushi ukufumyamo ulubembu.\\nKuli abo abaikatilila ku lubembu nabo bene
  baka pya kumulilo uwapekanishiwa\\nukonaula cibanda satana, na bangeli bakwe. Yangu!
  ukulepuka kwa mutima\\nilyo Yesu amona abantu bakwe balepya abo aishile fwila ukuti
  engabapususha.\\n2.\\nBUSHE NIKWISA KABILI NILILALI INGEHENA IKAPYA?\\nUkupusana\\nnefyo
  abantu abengi balanda Lesa takwata umulilo ulepya kucifulo uko\\nbeta ati ku ngehena
  uko aba mpulumushi ngabafwa baya. Ingehena ikabako\\nilyo ici calo cikaba muli bemba
  wa mulilo. Lesa alikatilila ubupingushi\\nbwa mpulumushi mpaka pabushiku bwa kulekelesha
  panuma ya myaka ikana\\nlimo (Ukusokolola 20:9-15).\\n\\\"Lesa\\nalishiba ifya kupususha
  abantu bakwe ukubafumya kumatunko nokuleka abampulumushi\\npaka pabushiku bwa bupingushi.\\\"
  - Petelo wacibili 2:9.\\nUtontonkanye,\\nkabili ale wamya icalo no mulilo.\\n\\\"Imulu\\nne
  sonde lino fyonse filelolela ubupingushi bwa mulilo uyo uwa sungwa\\nmpaka pabushiku
  bwa bupingulo.\\\" - 2 Petelo 3:7.\\nLesa\\ntateyanishisha abantu ukufwa mu mulilo
  iyoo. Lelo ilyo abantu bakana\\nukufuma kuli satana lyena bali noku pokelela icilambu
  cakusala kwabo.\\n\\\"Elyo\\nakasosa kubakukuso ati ''fumeni kuli ine, mwalitipwa
  kabiyeni mu mulilo\\nuwapekanishiwa kasebanya naba ngeli bakwe.\\\" - Mateyo 25:41.\\nUkulingana\\nna
  Yesu bushe umulilo wa ngehena ukabako lilali?\\n\\\"Nefyo\\namankumba yanukulwa
  nokocewa mumulilo efyo cikabanokupwa kwa calo. Umwana\\nwa muntu akatuma abangeli
  nokufumyamo mubufumu bwa mumulu conse ico\\nicileta ububi no bupulumushi, bonse
  abacita ububi bakaposwa mu mulilo\\numo umukaba ukulila no kusumanya ameno.\\\"
  - Mateyo 13:40-42.\\nMankumba\\nnencitatubi bakocewa pampela ya calo. Elyo ici tacilacitika
  icalo conse\\ncifwile cashininkisha ifyo Lesa aba wamulinganya. Ngefyo cilandilwe\\nmwi
  sambililo 22, mu bulwi ubukalamba ubo ubucili buletwalilila pakati\\nka kwa Klistu
  na satana, satana alefwaya ukulanga icalo ifyo ubupulumushi\\nenshila iyisuma iyakwi
  kalamo, Yesu aletulanga ifyo icumfwila enkama\\nyakwikala umweo uwapwililila.\\nPampela\\nya
  myaka ikana limo ici cikesa ilanga apabuta tutu ilyo satana, abangeli\\nbakwe nababembu
  bakocewa. Panuma amabuku nayesuka ukulanga imilimo cilamuntu\\nabombele pano isonde,
  Lesa akaposa satana, imfwa, inshinshi nabo bonse\\nabo amashina tayakasangwe mwibuku
  lyamweo muli bemba wa mulilo (Ukusokolola\\n20:14-15). Ukulingana ne lembelo mukusokolola
  21:1, Lesa awamya icalo\\nukufuma ku lubembu no mulilo, apanga imyulu iipya ne calo
  icipya.\\n3.\\nNINSHITA NSHI UMULILO UKAKOKOLA UKUPYA MUNGEHENA?\\nAbengi\\nbalisumina
  ilangulushi lyakutila umulilo ukalapya umuyayaya mu ngehena.\\nNatuloleshe pa malembelo
  ayalanda pafyo Lesa akacita ubupulumushi elyo\\nno muntu ukasangwa no bupulumushi.\\n\\\"Akakanda\\nbonse
  abo abashamwishiba elyo nabo abakana icebo cakwa Yesu. Bali nokukandwa\\numuyayaya
  no kufumishiwa kucinso icakwa Lesa.\\\" - Abena Tesalonika\\nwa cibili 1:8-9.\\nMoneni\\nukuti
  \\\"ukukandwa kwa muyayaya\\\" tacile pilibula \\\"ukulapya\\nmukati akamulilo umuyayaya.\\\"
  Petelo alanda pabushiku bwa bupingushi\\n\\\"ukukanda incita tubi\\\" (Petelo wacibili
  3:7).\\nUkulingana\\nna Yesu \\\"umupashi no mubili\\\" fikonaika mu mulilo wa mungehena\\n(Mateyo
  10:28). Mubushimikilo bwapa lupili, Yesu alandile paka cipata\\nakakamfye mfye \\\"akatwala
  ku mweo\\\" elyo nenshila iyasalala\\n\\\"itwala kubonaushi\\\" (Mateyo 7:13-14).
  Muli Yohane 3:16 Yesu\\nalondolola ukuti Lesa \\\"apele umwana wakwe umo fye mpo\\\"
  kutila\\nbonse abamusumina tabakonaike lelo bakabe no mweo wamuyayaya. Yesu alondolola\\nifintu
  fibili ukuti \\\"umweo wa muyayaya\\\" \\\"nokufwa ukwamuyayaya\\\"\\ntacilepilibula
  ukulapya fye umuyayaya iyoo. Eico twasanga ifyo ingehena\\nyalikwata impela ilyo
  umulilo ukashima ninshi ababifi bonse nabapya\\nnokufwa.\\nIfishinka\\nmukati kamalembelo
  yaletweba ifyo umubembu ali nokonaulwa. \\\"Umubembu\\nali nokufumishiwa po\\\"
  (Amalumbo 37:28), bali \\\"nokonaulwa\\\"\\n(Petele wacibili 2:12), \\\"bali nokuloba
  nge cushi\\\" (Amalumbo\\n37:20). Umulilo ukapwa ukabasha imito (Malaki 4:1-3).
  \\\"Amalipilo\\nyabupulumushi nimfwa\\\" lolo te mweo wa muyayaya mumulilo wangehena.\\nIcabupe
  ca kwa Lesa mweo wamuyayaya (Abena Roma 6:23).\\nUbukalamba\\nbwa bupingushi bwakulekelesha
  mu mulilo wa ngehena koca ubupulumushi.\\nIcili icakosa ukwelenganya ukuti Klistu
  uyo uwaponeshe ifilamba pako\\nnaula Yelusalema nokwelela abo aba mwipeye aposa
  inshita iyitali ukulolekesha\\npakucula kwaba bembu. Ingehena mucine yalikwata impela.
  Pampela ya myaka\\nikana limo, Lesa akaponya umulilo wamfula no kocha satana, nabangeli\\nbakwe,
  ne mpulumushi abo abaikatilila ku bupulumushi.\\nUmulilo\\nwafumine kumulu nokonaula
  bonse (Ukusokolola 20:9). Ukulingana na Yesu,\\numulilo \\\"taushima\\\" (Mateyo
  3:12). Takuli bakashimya ba mulilo\\nabamuli calo abenga shimya uyu mulilo mpaka
  fye wapwisha umulimo wauko.\\nLesa alitulaya ukuti panuma yamulilo wakuwamya icalo
  akabumba \\\"icalo\\ncipya\\\" umo ifyakale tafyakebukishiwe elyo \\\"nokulila nokulosha\\ntamwakabe\\\"
  (Esaya 65:16-19). Bukaba bushiku bwakupapa, conse ici\\ncusha umuntu takwakabe.
  Lesa akaposha ifilonda fya bupulumushi ku mitima\\nyesu nenseko fye umuyayaya.\\n4.\\n\\\"UMUYAYAYA\\\"
  MUMALEMBELO\\nMuli\\nMateyo 25:41 Yesu alanda ifyo \\\"umulilo wamuyayaya wapekanishiwa\\nsatana
  nabangeli bakwe.\\\" Bushe \\\"Umuyayaya\\\" cilepilibula\\nukuba mungehena umuyayaya
  ukwabula ukufwa? Yuda 7 alanga Sodomu na Gomora\\n\\\"nge misumba iyo iyakandilwe
  no mulilo wa muyayaya\\\" cine cine\\niyo misumba tailepya nanomba. Lelo umulilo
  wali wa muyayaya pamulandu\\nwakuti waletele ubonaushi ubwamuyayaya.\\nMuli\\nPetelo
  wacibili 2:6 nakabili twabelengamo umulilo wa muyayaya. Lelo\\nili lembelo lilanda
  ifyo Lesa alikanda imisumba ya Sodomu na Gomora\\nukuyoca icalenga ifyo Lesa ali
  no kucita kumpela ya calo. \\\"Bancitatubi\\nbamu Sodomu tabali mumulilo nanomba
  tulewita ati umulilo wamuyayaya\\nkufyo wa onawile imisumba nabantu. Pamulandu we
  buku lyakusokolola lyabomfya\\nifintu ifya kumwenako namashiwi aya malembelo. Icakumwenako
  Ukusokolola\\n14:11. Ifilanda abaluba, Ne cushi ca kushikitika kwabo cileya cilelola\\nmumulu
  umuyayaya.\\\" Ici cile umfwika kwati kucula kwa muyayaya.\\nLelo natumone ifyo
  amalembelo yalaesha ukulondolola amalembelo yanankwe.\\nUkufuma\\n21:6 yalanda umubonfi
  bamutula icipunda kukutwi icilepilibula ukuti\\nafwile abombelafye shikulu wakwe
  \\\"umuyayaya\\\" Pali ici \\\"umuyayaya\\\"\\ntacilepilibula ukuti uyu mubomfi
  akalabombela fye shikulu wakwe mpaka\\nakafwe. Yona uwaikele munda ya cisabi pa
  nshiku shitatu (Mateyo 12:40)\\nalanda ukuti ali munda yesabi \\\"umuyayaya\\\"
  (Jona 2:6). Ukukana\\ntwishika inshiku shitatu munshita shamfimfi cimoneka kwati
  muyayaya.\\nEico\\ntufwile twacenjela noku mfwikisha amalembo ilyo yabomfiwa mumapinda.\\nIcushi
  cilelola kumulu ukufuma kuli bemba wa mulilo ninsoselofye iyitila\\n\\\"ukucula
  kwamuyayaya.\\\" Ukusokolola 21:8 Bemba wa mulilo ulepya\\nnemingu ya mulilo \\\"nimfwa
  yacibili.\\\" Ingehena yalikwata impela.\\nAbabembu babepaya.\\n5.\\nNINSHI KWABELA
  INGEHENA?\\nPakutendeka\\nLesa alengele icalo icapwililika. Lelo ulubembu lwaishilemo
  nokuleta\\namacushi ne mfwa. Ngacakuti waile kung''anda icungulo bushiku cimo wasanga\\ning''anda
  nabasansa nokonaula bushe kuti waishafye ifyo fine umuyayaya?\\nAwe cakana. Uli
  nokupyanga ifisoso nokuwamya ing''anda yonse, ukulungisha\\nifya onaika. Lesa nao
  efyo akacita. Akawamya icalo icikonaika ukucibumba\\ncipya-cipya. Ubwanshiko bwakwa
  Lesa ubwakuwamya isonde nomulilo kupekanya\\nkwakwisa panga icalo icisuma umwabula
  ulubembu kuli abo abakapusuka.\\nLesa nakwata ubwafya pantu ubupulumushi bonaula
  ubwampano na Lesa nabantu\\nbanensu. Umuntunse atwalililafye imisango iyibi ili
  nga ukuulungana\\nnotwaice, ukwipaya, ukutamba ifikope fyabantu bali ubwamba nefintu
  ifingi\\nifyo naula amatontonkanyo yesu. Lesa ubushiku bumo akonaula ubu pulumushi\\npantu
  ubupulumushi bule onaula abantu. Ubwafya bukwete Lesa ni ubu:\\nBushe kuti aonaula
  shani ubupulumushi ubuli mu kati ka muntu ukukana\\nonaula umuntu uuli no bupulumushi?
  Lelo inshila fye Lesa asanga mu muntu\\nuukwete ubupulumushi kuya kuli Yesu uyo
  uwaishile fwila palupanda pakuti\\nonse uuli nobupulumushi nga atwala kuli wene
  takonaulwe.\\n\\\"Nga\\ntwa lumbula imembu wena wacishinka ali nokutwelela imembu
  nokutusangulula\\nukufuma kumembu shonse.\\\" - Yohane wa cimo 1:9.\\nLesa\\napela
  ubwasuko kubwafya bwalubembu apabula ukulipila kuli onse. Lelo\\nku ca mupamba abantu
  bamo bacili nabekatilila kubulwele bwa lubembu.\\nLesa takapatikishe abantu ukusala
  inshila yakwe iya mweo wamuyayaya.\\nAbo abakana ubu busalo kupelepele bali nokonaulwa.
  Umulandu kwabela\\ningehena nici:\\n\\\"Pantu\\nnali itile lelo tawayaswike, nalilandile
  tawaunfwile. Wacitile ulubembu\\nku cinso candi ico icishansekeshe.\\\" - Esaya
  65:12.\\nWaiputwile\\nwe mwine ukufuma kuli Yesu, eico wasanga ifyo ubusalo bobe
  nimfwa yamuyayaya.\\n6.\\nBUSHE CINSHI UKANONKAKO NGA WA LOBA?\\nAmalembelo\\ntayaletusambilisha
  ukuti umulilo wa mungehena ukalapya fye umuyayaya,\\nlelo ciletulanga ifyo umubele
  wakuloba atemwa ukufwa ukaba. Ababembu\\nbali nokupuswa umweo wamuyayaya. We mutima
  ubukali ilyo umubembu amona\\nifyo apuswa umweo wamuyayaya, no kukwata ubwampano
  na Lesa umuyayaya.\\nIlyo\\nKristu afwa palupanda ne membu she sonde lyonse isho
  ishaleta ukuputula\\nubwampano na wishi nokumfwa ukuti naluba. Ilyo umubembu alolesha
  kuntanshi\\nukwafita ena amona fye imfwa iyamuyayaya ilemupembela. Afwile afwa ukwabula\\nnesubilo
  lya bututubuko bwa cibili. Panshita imo ine ababembu bamona\\nifyo bakene Kristu
  inshita ilyo aleisa kuli bene mukutemwa. Mukulekelesha\\nbafukama kuli wene nokusumina
  ukuti Lesa ubupingushi bwenu bwa cishinka\\nkabili bwa kutemwa (Abena Philipo 2:10-11).\\nEco\\nbakalemba
  bacipingo batusokela ukuti tufwile twapanga ubusalo bwakukonka\\nYesu.\\n\\\"Tulemikambisha\\nukuti
  mwipokelela icikuku cakwa Lesa apafye. Pantu alisosele ati ''munshita\\nyabusalo
  nalimumfwile, elyo nobushiku bwe pusukilo nali mwafwile'' ndemyeba,\\nino enshita
  yakupanga ubusalo ilelo ebushiku bwe pusukilo.\\\" - Abena\\nkilonto wacibili 6:1-2.\\nNshinga\\ntontonkanyapo
  icintu icakupapusha mumweo wa muntu ngo kuposela Yesu\\ninshita iyakufwa palupanda
  ilyo umuntu asala ukuloba. Ubusalo buletelwe\\nkuntanshi yesu buli fye apabuta ni
  ubu: Ukonaika kwamuyayaya nokufuma\\nkucinso cakwa Lesa penape nangula ukupanga
  bucibusa na Yesu penape.\\nCinshi walasalapo we mwine? Cinshi teti usale umweo mwa
  muyayaya mubwalelo?\"", "\"AKATABO KA MIKALILE NO MULIMO TUBOMBA June 2018\\nICUMA
  ICABA MU CEBO CA KWA LESA\\nYehova asalile Maria ukubomba umulimo uwaibela ushatalile
  aubombwapo kabili uushakatale aubombwapo na kabili pantu alikwete sana umutima uusuma.\\nIFYO
  FWE BENA KRISTU TULINGILE UKULAIKALA\\nKuti bamwayafwa abana benu ukuba ababomfi
  ba kwa Yehova aba cishinka nga mulebasambilisha lyonse ilyo mwingacita ifi.\\nIFYO
  FWE BENA KRISTU TULINGILE UKULAIKALA\\nNga filya fine ifibombelo ifingi fyaba, ukulanshanya
  na bantu ukubomfya Intaneti kuti kwatwafwa nelyo kuti kwalenga twaba mu mafya. Mulebomfya
  amashinte ya mafunde ayaba mu Cebo ca kwa Lesa pa kwishiba amafya yabamo e lyo ne
  fya kusengauka ayo amafya.\"", "\"ULUPUNGU LWA KWA KALINDA\u2014ULWA KUSAMBILILAMO
  January 2017\\nMuli ino magazini muli ifipande fya kusambililamo ukutendeka 27 February
  ukushinta pa 2 April, 2017.\\nBankashi abashimbe abengi ababombela mu fyalo fimbi
  pa kubala baleshimunuka ukukuukila ku calo cimbi. Finshi fya bafwile ukushipa? Finshi
  basambililako ilyo bashimikila abantu imbila nsuma mu fyalo fimbi?\\nYehova alatucitilako
  ifyo tushingacita. Lelo afwaya ukuti tulecita ifyo twingaba na maka ya kucita. Bushe
  ilembo lya mwaka wa 2017 liletwafwa shani ukwishiba ifyo twingacita ne fyo tushingacita?\\nBushe
  amaka ya kuisalila e cinshi kabili finshi Baibolo yalandapo? Kuti mwacita shani
  pa kulanga ukuti mwalicindika amaka ya kuisalila ayo abantu bambi bakwata?\\nKuti
  twacita shani pa kuti tutwalilile ukuba abafuuka ifintu nga fyayaluka, nga batusuusha
  nelyo batutasha sana, na lintu tushishibe ifyo fintu fikaba ku ntanshi?\\nBushe
  abakalamba kuti bayafwa shani abashilakota ukulabomba sana imilimo? Bushe abashilakota
  kuti balanga shani ukuti balicindika abatungulula umulimo pa myaka iingi?\"", "\"Cinshi
  cilenga bamo balelembwa inembo pa mubili?\\nRyan atile: \u201cImona kwati inembo
  shilamoneka bwino.\u201d\\nIfyo umuntu amona ukulembwa inembo pa mubili e filenga
  afwaya ukulembwa nelyo iyo. Ku ca kumwenako, Jillian, atile: \u201cIlyo umukashana
  twalesambilila nankwe aali umwaice, banyina balifwile. E ico ilyo akulileko, aliilembele
  ishina lya banyina kwi koshi. Imona kwati ukulembwa inembo sha musango uyo kusuma.\u201d\\nNampo
  nga walikwata imilandu iine iine iyo ufwaila ukulembwa inembo nelyo iyo, ulingile
  ukutontonkanyapo sana ilyo ushilapingulapo ukukulemba inembo. Finshi ulingile ukutontonkanyapo
  ilyo ushilalembwa inembo? Malembo nshi ayengakwafwa ukupingulapo bwino?\\nFinshi
  ulingile ukutontonkanyapo ilyo ushilalembwa inembo?\\nBubi nshi bwaba mu kulembwa
  inembo? Pa webusaiti ya ba Mayo Clinic balondolola ukuti: \u201cApo kulaba ukucenwa
  ilyo umuntu balemulemba inembo, uo balelemba inembo nalimo kuti alwala ubulwele
  bwa pa nkanda nelyo amalwele yambi. Limo umuntu kuti akwata ifipumba apo bamulembele
  inembo. Ukulembwa inembo kuti kwalenga no muntu afimba uluni. Na kabili nga ca kuti
  ico bakulembelako inembo balicibomfeshe ku muntu wakwata ubulwele bumo, na iwe kuti
  wayambula ubo ubulwele.\u201d\\nBushe abantu bambi kuti balakumona shani nga wailemba
  inembo? Ifyo umuntu amoneka filalanga ifyo aba. Filalanga nga ca kuti alikula mu
  mano nelyo iyo, kabili filalanga nga ca kutila kuti acetekelwa nelyo iyo. Samantha
  atile: \u201cNga namona umuntu nalembwa inembo pa mubili, imona kwati ninshi alitemwa
  sana ukunwa ubwalwa e lyo no kwangala.\u201d\\nMelanie, uuli ne myaka 18 na o atile:
  \u201cIne imona kwati ukulembwa inembo pa mubili kulafisa ubusuma bwa muntu. Umuntu
  nga ailemba inembo pa mubili ciba kwati talefwaya mumumone ifyo amoneka.\u201d\\nBushe
  ukatwalilila ukutemwa inembo ulefwaya? Mu kupita kwa nshita, inembo umuntu alembelwe
  kuti shaleka ukumoneka bwino nga ca kuti aina nelyo akulilako. Joseph atile: \u201cInembo
  tashimoneka bwino nga papita imyaka iingi.\u201d\\nAllen uuli ne myaka 22 atile:
  \u201cNga papita imyaka, abantu balaluuka mu fyo bamona inembo bailembele. Ifyo
  batemenwe imyaka iyapita nalimo te kuti bafitemwe mu kupita kwa nshita.\u201d\\nIfyo
  Allen alandile fya cine. Icishinka ca kuti ilyo umuntu alekula, ifyo amona ifintu,
  ifyo afwaya ne fyo atemwa filaaluka, lelo inembo isho ailembeele tashaluka. Teresa
  alandile ukuti: \u201cTe kuti ntemwe ukukwata inembo ishikalanjibukisha fye ifyo
  nali na mano ya bwaice.\u201d\\nMalembo nshi ayengakwafwa?\\nUmuntu wa mano alatala
  atontonkanya sana ilyo talapingulapo ukucita fimo. (Amapinda 21:5; AbaHebere 5:14)
  Mona ifyo amalembo yakonkapo yengakwafwa pa lyashi lya kuilemba inembo.\\nAbena
  Kolose 3:20: \u201cMwe bana, muleumfwila abafyashi benu muli fyonse, pantu ukucita
  ifi e cawama mu menso ya kwa Shikulu.\u201d\\nMafya nshi wingakwata nga wikala na
  bafyashi bobe lelo taubomfwila?\\n1 Petro 3:3, 4: \u201cMwilabika amano ku kuluka
  umushishi no kufwala ifya kuisaamika ifya golde atemwa ku kufwala ifya kufwala ifisuma,
  lelo mulebika amano ku buntu bwa mu kati na ku fya kufwala fya buko ifishingonaika,
  e kutila umutima uwaikala tondolo kabili uwafuuka.\u201d\\nCinshi ulemona ukuti
  e calenga Baibolo ilande sana pa kubika amano ku \u201cbuntu bwa mu kati\u201d?\\n1
  Timote 2:9: \u201cAbanakashi baleisakamana.\u201d\u2014Ukulingana na Baibele wa
  Mushilo\\nBushe ishiwi lya kuti \u201cbaleisakamana\u201d lyalola mwi? Mulandu nshi
  ukuisakamana kwawamina ukucila ukuilemba inembo pa mubili?\\nAbena Roma 12:1: \u201cMutuule
  imibili yenu nge lambo ilituntulu, ilyasanguluka, ilingapokelelwa kuli Lesa, e kutila
  ukubombela Lesa na maka yenu aya kupelulula.\u201d\\nMulandu nshi Lesa abikila amano
  ku fyo usunga umubili obe?\\nPa mulandu wa ifi twalandapo, abantu abengi balisalapo
  ukukanailemba inembo pa mibili yabo. Na kuba balisanga icacila pa kuilemba inembo.
  Teresa, uo tulandilepo kale atile: \u201cNga ca kuti kwaliba amashiwi yamo nelyo
  umuntu uo watemwa, kuti cawama ukulakonka ifyo ayo amashiwi yalanda nelyo ukweba
  uyo umuntu ukuti walimutemwa, ukucila ukuilemba ayo amashiwi nelyo ukuilemba uyo
  umuntu pa mubili.\u201d\"", "\"BUSHE\\nLESA ICINE CINE ALISAKAMANA\\nUMWEO WANDI\\nInshiku\\nshimo
  icalo cilamoneka ubusuma kwati ulifye mu mulu. Ngawashibuka akacelo,\\nwa pupwa
  ko no mwela uwalucelo, ilyo wa funya umutwe pansolokoto, wamona\\nne myengelele
  yakasuba ilebengeshima pamabula ya fimuti. Inshita shimo\\nnasho shilenga umweo
  ukuba uwa sangalala kwati cibusa obe untu ulelaya\\nukuti mune shalapo, elyo wa
  umfwa nakalwimbo akasuma ako aka yana nefyo\\nlulemoneka uwa nsansa ngo mwana umunono.\\nLelo\\ninshiku
  shimbi nasho shilenga icalo ukuba kwati caisulamofye ama chusho.\\nIlyo washibuka
  walolesha pafyo balemba muli mutende (amapela ya malyashi)\\nwasa nga umutwe welyashi
  uleti nalelo abalwani nangu utupondo na ba\\npusha ama bomba, nabaice bamo na ba
  putuka amolu nangu ifilundwa fimbi\\nifya mubili, limbi wa umfwa ukuti umwaice umo
  natulika amenso. Umutwe\\nwelyashi umbi uleti kalya kapondo kaleipaya abantu na
  kepaya naumbi\\nuwalenga ikumi. Imbi nayo aiti insala nangu mulamba nangula icikunkuma\\nnacicitika
  kuli uyu musumba nangula icalo. Ishi nshita isho takuba nangu\\ncimo icimoneka bwino.\\nNgefi\\nfyonse
  fipilibula nshi Bushe kuti twatila ati icalo cesu cisuma nangula\\niyoo Nga kanshi
  cinshi twabelapo Bushe ica cine Lesa alisakamana umweo\\nwandi, nangula nalimo nabafye
  ngelino lya munshimbi limo ilyaba muli\\nci mashini.\\n1.\\nLESA ABUMBILE ICALO
  ICA BULAMO UBUBI\\nLesa\\nnika bumba, kalenga wafintu fyone ukutendeka kuntanda
  ishibengeshima\\nnga kasuba ukufika naku mapindo ya cipepelya Kwishiwi lya Mfumu
  umulu\\nnafyonse ifyabamo fya pangilwe, ku mupu wakwe, pantu asosele nafyo fya\\ncitika,
  akambishe nafyo fya iminine ndi (Malumbo 33:6-9). Lesa ena alandilefye\\nna fyonse
  fya konkele ubu fwayo bwakwe.\\n2.\\nUKU BUMBA ICALO MUNSHIKU MUTANDA\\n\\\"Munshiku\\nmutanda
  imfumu yapangile imyulu ne calo, na bemba, nafyonse ifyabamo,\\nlelo atushishe pa
  bushiku bwalenga cinelubali (7). Eico imfumu ya palile\\nubushiku bwe Sabata no
  ku bushisha.\\\" - Ukufuma 20:11.\\nUwa\\nmuyaya, uwa maka yonse kabumba nga a pangile
  calo mukashitafye akanono\\nUkupitila kumupu wakanwa kakwe; Lelo Lesa asalile ukuti
  enga senda inshiku\\nmutanda (6) ngalefwaya nga acitile muliba mineti mutanda nangu
  ba sekondi\\nmutanda pantu kuli wene nga yali ninshita iya linga. Ibuku ilya kubalilapo\\nmuchipingo
  UKUTENDEKA lilanda pa fya bubumbo ifyo bwa lecitika cila\\nbushiku mu mulungu wa
  bu bumbo. Chinshi Lesa ashalikisheko ukubumba\\nmunshiku mutanda?\\n\\\"LESA\\nAPANGILE
  UMUNTU MU CATA CAKWE, mucata ca kwa Lesa emo ababumbile UMWAUME\\nNO MWANAKASHI.\\\"
  - Ukutendeka 1:27.\\nLesa\\napangile umuntu ukuba nga wene, abafwile ukutontonkanya,
  ukumfwa no\\nkutemwa pamo nga wene. Umuntu onse abumbilwe mu cata cakwa Lesa.\\nMunshiku\\nmutanda
  icalo caiswilemo nefimuti nefitwalwa fyonse pamo ne nama, elyo\\nLesa aletele Adamu,
  ukulingana no kutendeka 2:7 uwa maka yonse apangile\\nAdamu ukufuma kwi loba. Ilyo
  Lesa aputilemo umupu wa bumi mu myona umuntu\\natendeke ukupema no kuba no mwelo.
  Lesa apele umuntu apangile mu cata\\ncakwe ishina lyakuti Adamu ilyo ilipilibula
  ukuti Umwaume. No mwanakashi\\nuwa kubalipo amupele ishina ilya kuti Efa ilipilibula
  ukuti UBUMI (Ukufuma\\n2:20, 3:20) kabumba mukalamba acimwene icayana ukuti umuntu
  abe no wa\\nkumfwana nankwe.\\nUkufuma\\nfye mu minwe ya kwa kabumba, Adamu na Efa
  bonse balangilile icata cakwe\\n(Lesa). Lesa nga lefwa ya nga apangile abantu aba
  pamo nga fimashini\\nifyta kuti file enda no kulanda lelo ukwabula ukutontonkanya.
  Nga bala\\nenda mwibala lya Edeni no kumulumbanya. LELO Lesa alefwaya ukwampana\\nno
  kumfwana ukwa pwililika. Fimashini ifyo beta ati amaloboti; filalanda,\\nfilamwentula
  no kubomba incito ishalekana lekana, lelo tafya kwata ukutemwa.\\nLesa atupangile
  ifwe mu cata cakwe, no kutubikamo amaka ya kutontonkanya\\nelyo no kusala; elyo
  no kwibukisha, ukumwibukisha pamo no kumutemwa.\\nAdamu na Efa bali abana bakwa
  Lesa abo abali abatemwikwa kuli wene.\\nUMULUNGU\\nWA BUBUMBO\\nUbushiku\\nbwa kubalilapo:
  Lubuto, ukukonkapo akasuba no bushiku\\nUbushiku bwa cibili: Ulwelele\\nUbushiku
  bwa citatu: Umushili pamo ne finsabwansabwa\\nUbushiku bwa cine: Akasuba pamo no
  mweshi\\nUbushiku bwa cisano: Ifyoni pamo ne sabi\\nUbushiku bwa mutanda: Umushili
  pamo nenama elyo no muntu\\nUbushiku bwa cine lubali: Isabata\\n3.\\nUBUBI BWAISA
  MUCHALO ICALI ICISUMA\\nAdamu\\nna Efa bali kwete fyonse ifyo ifya ku ba sansa musha.
  Bali no bumi ubusuma,\\nimikalile yabo mwibala lya Edeni iyali enganda yabo mu calo
  cilya (Ukutendeka\\n2:8, 1:28-31) Lesa alibalaile abana pamo namano ya kcita ifintu
  ifyalekana\\nlekana, pakuti bena bengaba abasangalala muncinto shabo shonse isha\\nmaboko
  yabo (Ukutendeka 1:28; 2:15) Inshita nenshita balemonana na kabumba\\nwabo icinso
  ne cinso. Tabakwete ubulanda, uku sakamana, umwenso nangula\\namalwele tayalipo
  munshiku shabo shilya isha kubalilapo mu bwikalo bwabo.\\nNge\\ncalo caishile pilibuka
  shani munshita fye inono, pa kuti kube ukucula\\nna masanso? Nga twa belenga Ukufuma
  2 ne cipande ca citatu (3) twalasanga\\numulembe wafyo ububi bwaingile mucalo cesu.
  Mubelenge ama capitala aya\\nmunshita yenu. Mu bwipi ifi efilimo. Ilyo Lesa na pange
  calo icisuma,\\numulwani aishile mwibala lya Edeni mukwisa tunka Adamu pamo na Efa
  ukuti\\nbena baleke ukumfwila Lesa kabumba wabo. Lesa aebele Adamu na Efa ukuti\\nbekalya
  ko ku cimuti icali pakati kebala lya Edeni ico icali no kubelenga\\nukwishiba ubusuma
  no bubi nga balileko. Kabili bafwile no kutaluka ko,\\npantu ubushiku bakalyako
  bakafwa.\\nLelo\\nubushiku bumo Efa aile aleyendauka mwibala mupepi na ku cimuti
  babindilweko.\\nUmulwani bwangu bwangu atendeke ukulanda kuli Efa atile Lesa alibepele\\nubufi;
  Kabili nga cakuti walyako ta wafwe walaba nga Lesa wine. Ukuba\\nna mano elyo walaishiba
  icisuma pamo no bubi. Iceshamo ba Efa balya\\nelyo na Adamu wine nao alile; uyo
  uwaishibe ubusuma bweka bweka, asuminishe\\nshetani uku mubepa, elyo bonse balile
  icitwalo icabindwa - icilepili\\nbula ukuti ba pulile ubwampano ici cetekelo ne
  cumfwilo kuli Lesa.\\nLesa\\napekenye ukuti Adamu na Efa bakateke pamo nga ba kasunga
  bakwa Lesa\\npafintu fyonse ifyo apangile (Ukutendeka 1:26) Lelo pa mulandu wakuti\\nbali
  lufishe ici cetekelo muli Lesa no kusala umulwani ukuba intungulushi\\nyabo, balufishe
  umupaka wabo. Ilelo umulwani aleti icalo cakwe kabili\\nale esha namaka yonse ukuti
  enga lenga abantu ukuba abasha bakwe. Kwalibe\\ninshita ishingi ilyo tusangwa tulecit
  ifintu ifya kuisekesha, nangula\\nuku itemwa, limbi nalyo tulaba abankalwe ilyo
  tufwile ukuti twinga ba\\nabantu abasuma; chinshi? Mulandu wakuti uyu umulwani ushimoneka
  chibanda,\\nabomba ukuti alenge ifwe tufilwe mumisango iisuma.\\nLintu\\nmwalabelenga
  capitala ca 3, mwibuku lya Kutendeka, mwalasanga ukuti\\nubupulumushi bwalengele
  Adamu na Efa ukufisama ukufuma kuli Lesa pa\\nmulandu wa kutina. Ubupulumushi bwa
  yandatile pa cibumbwa conse. Imyunga\\nya moneka pamo na maluba. Umushili watendeke
  ukulangauka pamulandu wakukana\\nkwata amenshi ayengi,nenchito nayo ya tendeke ukuba
  icisendo. Amalwele\\nyatendeka ukulapona panshita mushenekele. Umufimbila, ubukanami
  ubupondo,\\nfya fula no kulenga yafula amacusho pa muntunse. Necakubipisha icaponene\\npamulandu
  wa bupulumushi nimfwa.\\n4.\\nUYU WINE MULWANI NANI UWALENGELE CALO CANDATILWE NO
  BUPULUMUSHI?\\nAli\\nni KEPAYA UKUFUMA PABUTENDEKO,\\ntamwaba icine muliwene. Nga
  abepa\\nena alanda ubufi aishiba, pantu wabufi kabili TATA WABUFI John 8:44.\\nUkulingana
  na Yesu, Satana entuntuko ya bupulumushi pano isonde Tata\\nwa bululumushi eico
  e payila no kabepa. Thomas Carlyle, injishi kweba\\nya chingeleshi, bushuku bumo
  asendele Ralph Waldo Emerson mumisebo ino\\niyabela ku kabanga kumpela ya musumba
  wa London. Ilyo lintu baleyenda\\numutalalila, ukumona ubupulumushi no bubi ubo
  ubwabashingulwike, Carlyle\\naimishe ishiwi no kwipusha umubiye ati Bushe wa sumina
  mu mulwani nomba?\\n5.\\nBUSHE LESA ALIBUMBILE UMULWANI?\\nAwe\\nLesa musuma tenga
  bumba umulwani. Lelo icipingo cilanda aciti umulwani\\n(shetani) pamo na bangeli
  abo abepele, balufishe incende yabo mumulu,\\nno kwisa pano calo cesu.\\nElyo\\nmwali
  ubulwi mumulu. Mikaeli naba ngeli bakwe ba lwile ne chiswango,\\nelyo ICISWANGO
  NABANGELI BACIKO balwishishe. Lelo ta cakwete amaka,\\nelyo ba LUFISHE INCHENDE
  MUMULU. Iciswango caposelwe panshi, iyo nsoka\\nnkote iitwa umulwani nangula Satana,
  uyo ulenga icalo conse ukuluba.\\nAposelwe pa calo pamo nabangeli bakwe, (Busokolo
  12:7-9).\\nNga\\nshetani (Satana) aisangile shani ku mulu?\\nWali\\nuwasubwa pamo
  ngo mungeli wakulonda, eico na kusubile (ubikwapo iminwe).\\nWali pa lupili ulwa
  mushilo lwa kwa Lesa; Tawakwete UBUBI MUMWEO OBE\\nukufuma pabushiku wa pangilwe
  ukufika ilyo UBUBI BWASANGILWE MULI IWE\\n(Esekele 28:14,15).\\nLesa\\ntapangile
  umulwani iyo, apangile Lucifer umungeli uwapwililika uwabulamo\\nububi, umo uwabangeli
  uwali intungulushi, yabangeli uwa leiminina mupepi\\nne cipuna cakwa Lesa. Lelo
  acitile ubupulumushi ububi bwasangilwe muli\\nwene; Atamfiwe mu mulu no kwisa ilenga
  ukuba ifibusa fya kwa Adamu pamo\\nna Efa asangwike umulwani uwabipisha ku muntunse.\\n6.\\nCINSHI
  CALENGELE LUCIFER UMUNGELI UWAOLOLOKA UKU CITA UBUPULUMUSHI?\\n\\\"Nga\\nWAWA SHANI
  UKUFUMA KUMULU, O welutanda lwa ka celo we mwana wa ku macha\\nWA POSWA PANSHI PACALO\\n.
  Watile mu mutima obe, nalaimina umulu\\nno kusumbula icipuna candi pa mulu wantanda
  sha kwa Lesa; NKABA PAMO\\nNGO MUKULU WINE.\\\" - Esaya 14:12-14.\\nIco\\ncibumbwa
  icaishileba shetani, pakutendeka ali ni Lusifa icilepilibula\\nukuti ULUTANDA LWA
  KASUBA; nangu uwabengeshima. Mu mutima wa uyu mungeli\\nmwaiswile ifilumba elyo
  atendeke na mapange yakwe. Ulubuto lwa filumba\\nlwa tendeke ukukula ukuti enga
  poka icipuna ca kwa Lesa. Lusifa alibombeshe\\nna maka sana pakuti engongola ifibumbwa
  fimo ifya mu mulu. Cintu cayanguka\\nukwelenganya ifyo Satana alecita ifikansa ukuti
  Lesa paliba fimo ifyo\\nafisa, ukukana beba, no kutila uyu Lesa tafwaya ukubapela
  insambu, elyo\\nkabili ni Lesa ushisakana mu mitekele yakwe. Asalwile uyo uo imibele\\nyakwe
  ilanga ukutemwa.\\nBushe\\nubulwi bwine ubu bwapwile shani kumulu?\\nUmutima\\nobe
  waiswilemo ifilumba\\n. Eico na kuposele pa calo Esekele 28:17\\nIfilumba fya pilibwile
  uwali umungeli mukalamba ukwaluka umulwani nangu\\nSatana. Nomba pa kumona ukuti
  umutende no bwampano mumulu bwa sungwa\\nbali muposele panshi pamo neciputulwa cimo
  icabangeli abo aba mukonkele\\nmu kwimina ubufumu bwa kwa Lesa, eco ba mu tanfishe
  (Busikololo 12:4,\\n7-9).\\n7.\\nCHIBINDA WABUPULUMUSHI NINANI\\nChinshi\\nicho
  Lesa tabumbile umuntu uu shingolungana? Pantu abumba uwamusango\\nuyo ngatakwaba
  bupulumushi mwisonde lyonse. Kwena Lesa alefwaya abantu\\nabo engampana nabo mukufumaluka
  ukwafikapo. Echo Lesa abumbilyo muntu\\nmuchipasho chakwe (Ukutendeka 1:27). Ichi
  chilapilibula ukuti tuli bantungwa\\nmumitontonkanishishe. Kuti twasalo kutemwa
  Lesa nelyo kushimutemwa.\\nLesa\\napala abangeli nabantunse abamunkulo shonse umupashi
  wachifyalilwa pamo\\nna maka yakwisalila icho umwine alefwaya. Saleni ilelo untu
  mulefwayo\\nkubombela (Yoswa 24:15).\\nLesa\\nalekambisha abantu, bantu abumbile
  muchipasho chakwe, kusalo kuchita\\nchisuma pantu balikwata amaka yabwishibilo ayabeba
  ifyo inshila yakwa\\nLesa yaba iya wama elyo no kubeba ukufuma kumichitile yabubi,
  pantu\\nbali sokwa nokwishiba ifya chilambu cha bupulumushi pamo nabuchintomfwa.\\nKano
  fye ilyo twakwata amaka yabwishibilo, elyo twingasala chisuma kabili\\nelyo twingaba
  nobwishibilo ubwashika ubwakutemwisha Lesa. Umuntunse\\neka uwakwata amaka yakutontonkanya
  no kusala eungomfwikisha icitemwiko\\nicacine Leza Lesa akabile ukubumba abantu
  abangomfwikisha no kutasha\\nimibele yakwe, ukuya kuli Wene no kutemwa, no kwi sula
  ukutemwa bambi.\\nLesa alefwaya ukwakanya ubutemwe bwakwa cakutila tasakamene ukuti
  enga\\nbumba abangeli nabantu, no kubapela amaka ayakusala. Alishibe ukutila\\nkambi
  akasuba umo pali abo yabumbile alino kusala ukukana mubombela.\\nSatana ali ecibumbwa
  cakubalilapo muchalo chonse ukusala chintu icishaibipila\\nchakupondokela Lesa.
  Eicho ulubembu lwatapile pali ena (Yohane 8:44,\\n1 Yohane 3:8).\\n8.\\nULUPANDA
  LWALIBA NAMAKA YAKONAULA UBUPULUMUSHI\\nChinshi\\nicho Lesa taonawilila Lucifer
  ilyo ubulwele bwabupulumushi tabula andatila?\\nLucifer alisushishe ubusuma bwabuteko
  bwakwa Lesa. Ali bepeshe Lesa\\nubufi: Nga Lesa alipeye Lucifer palya pene, abangeli
  ngabatumikila Lesa\\nmumwenso, Ukuchila mukutemwa. Ichi nga chalyanshishe ubufwayo
  bwakwa\\nLesa buntu akwete pakupanga muntu, ubwakumupelo kwisalila. Nga abantu\\nbaishibe
  shani ubusuma bwa kwa Lesa? Lesa alipele Satana inshita yakuchita\\nifyo alefwaya
  umwine. Emulandu wine amusuminishe ukutunka Adamu na Efa.\\nChino\\nchalo chaba
  apakumwena uwabulamba apo imisango yakwa Satana nemibele\\nyabuteko bwakwe pamo
  nemibele nemisango yabuteko bwakwa Lesa fyabikwa\\npalwalala mukupashanya ukumonapo
  uwachishinka ninani? Kabili ninani\\nafwilyo kuchetekelwa? Kamfutu ni Lucifer. Nachibule
  nshita iyitali sama\\nku bantu bapanwesonde ukushininkishomupwilapo ifyabonaushi
  bwakwa Satana\\nifyo bwaba. Lelo mukupelekesha umuntu onse akaimwena ukuti ichilambu\\nchalubembu
  nimfwa elyo icha bupe chakwa Lesa mweo wa muyaya ya muli\\nYesu Kristu shikulwifwe
  (Bena Roma 6:23).\\nUmuntu\\nonse pano isonde alesumina ukuti Ikulu kabili yakupapa
  imichitile ya\\nmnfumu Lesa mukulu. Ya cine kabili ya chishinka inshila shobe, imfumu\\nya
  nkulo ne nkulo, inko shonse shikesa tota iwe pantu imichitile yobe\\niya bololoke
  naimoneka (Busokololo 15:3, 4).\\nIlyo\\nabantu bakapwa ukwishiba ubusungu bwa bupulumushi,
  pamo na mapange aya\\nbonaushi aya kwa Satana lyena Lesa akonaula Satana pamo no
  bupulumushi.\\nLesa akonaula na bonse abatalama no kukana ichikuku cakwe, no kwikatilila\\nmu
  mibele ya kwa Satana. Lesa ali uwa fwaisha ukuti enga fumyapo ubu\\nbwafya bwa bupulumushi,
  pamo no kuchula, nga cakuti twa fwaya ifwe ukuti\\nachite ifyo. Nomba alelindilila
  ukufikala akachita ichi umupwilapo,\\nelyo no ku mona ukuti ubuntungwa buntu twakwata
  bwa chingililwa kabili\\nno kumona ukuti ububi tabubwelele na kabili. Lesa alilaya
  ukonaula ubupulumushi\\numuyayaya na suka umulu pamo no chino calo no mulilo Mukusuna
  ubulayo\\nbwakwe kuti twa lolesha kuntanshi ya mulu upya ne calo icipya, umushi\\nwa
  abo abololoke (2 Peter 3:10, 13) ububifi bonse ta bwakasangwe mo\\nmuli cilye icalo.
  Icilambu ca bupulumushi chikamoneka apabuta tutu,\\nkabili uku kanaba ne chumfwilo
  kuli Lesa chikalenga ukuti cikabe entuntuko\\nya bonaushi bwakwa Satana pamo no
  bupulumushi umupwilapo.\\n\\\"Apo\\nabana ba kwata umubili no mulopa uyo untu (Kristu)
  afyelweko mu buntunse\\npakuti enge sa uyo uwakwata amaka yamfwa, uli mulwani no
  kwisa lenga\\nbonse babe abantungwa mu myeo yabo abo abali abasha pa mulandu wakutina\\nimfwa.\\\"
  - Ba Hebele 2:14, 15.\\nPa\\nLupanda abangeli, elyo nefyalo fimbi ifi shakumineko
  kubupulumushi,\\nbamwene imitukuto yakwa Satana iya bukabepa, na bukepaya. Palya
  (Satana)\\nasokolwele imibele yakwe apabutatutu ilyo a ongwele abantu pakuti bengimina\\numwana
  wakwa Lesa uwakaele pakuti benga mwikata no ku mwipaya. Abekashi\\nba pano isonde
  nabo ba mwene bumpelwa amano, nobumkalwe bwa bupulumush\\nifyo bwaba. Ulumpanda
  kabili lwa sokolwele imilimo yakwa Satana kabili\\nnefyo Lesa akesa onaula Satana
  nabo bonse aba ikaikatilila kubupulumushi\\nbakeshiba no kulanda ukuti Lesa wa chine.
  Imfwa yakwa Yesu pa lupanda\\nya sikolwele amapange yakwa Satana nafintu alefwaya
  uku cita ku muntunse\\n(Yohane 12:31, 32). Ulupanda lwasokolwele Kristu ifyo aba
  ukuti ni kapususha\\nwa calo conse. Pa gologota epo amaka ya kutemwa yamoneke ukulwishanya\\nnamaka
  yakutemwa ukuteka. Ulupanda lwaletele ubwishibilo bwa kutemwa\\nkwa kuipela ukwa
  kwa Lesa nefyo achita pamitukuto ya kwa Satana, ubupulumushi\\nelyo naba mpula mafunde
  bonse abaume na banakashi.\\nNipalupanda\\nepo Kristu atulangilila apabuta ifyo
  Lesa atutemwa nefyo achimfishe\\nSatana. Inkondo yalipo yakutila nani alateke icalo
  ni Kristu nangu Satana.\\nElyo ulupanda lwa kakulwile ulu lubuli ukwanshita shonse
  afwile ukuba\\nni Kristu uku cila pali fyonse. Bushe nausanga ubwampano no mupusushi\\nuwa
  fwile ukuti engesa tulanga ukutemwa kwakwe uko ukushinga pashinishiwa\\nnangula
  ukupilibulwa.\\nBushe\\nuleumfwa shani pali uyo uwaishile pano isonde no ku fyalwa
  ngo muntu,\\nno kufwa imfwa iyo twali no kufwako, no kwisa pususha iwe ukufuma ku\\ncilambu
  cabupulumushi? Bushe kuti wakonteka icinso cobe nomba line no\\nkutasha Yesu, elyo
  no kumwipusha ukuti engesa muli iwe noku tendeka\\nukutungulula umweo obe?\"", "\"Yesu
  e lyo afumine fye mu kulanda pa mibele abasambi bakwe balingile ukukwata. Balingile
  ukuicefya, no kukanabika amano ku fifulo fya pa muulu nga filya abana abanono baba.
  Aebele abasambi ukuti nga \u2018bapokelela abana abanono pa mulandu we shina lyakwe
  ninshi bapokelela na Yesu.\u2019\u2014Mateo 18:5.\\nIlyo Yesu abebele ifi, abasambi
  nalimo bamwene kwati alebakalipila pantu e lyo bafumine fye mu kukansanina pa wali
  umukalamba. Nomba umutumwa Yohane alandile pa cintu cimbi icacitike. Atile: \u201cTwamwene
  umuntu umo alefumisha ifibanda mwi shina lyenu kabili twalimuleseshe, pantu tatukonka.\u201d\u2014Luka
  9:49.\\nBushe Yohane alemona kwati abatumwa e balingile fye ukundapa no kufumya
  ifibanda? Nga ca kuti abatumwa e balingile fye ukufumya ifibanda, mulandu nshi uyu
  mwaume umuYuda alefumisha imipashi yabipa? Yohane alemona kwati ulya mwaume talingile
  ukufumya ifibanda pantu talekonka Yesu na batumwa.\\nYesu alandile amashiwi ayapapwishe
  Yohane. Atile: \u201cMwilamulesha, pantu takuli nangu umo uucita icipesha amano
  mwi shina lyandi kabili apo pene atampa ukulampontela; pantu uushitulwisha, ninshi
  mwina mwesu. Pantu onse uwamupeela kapu ya menshi aya kunwa pa mulandu wa kuti muli
  ba kwa Kristu, ndemweba icine cine, nati, takabulwe icilambu cakwe nakalya.\u201d\u2014Marko
  9:39-41.\\nUlya umwaume ali musambi wa kwa Yesu nangu ca kutila talekonka Kristu
  pantu pali ilya nshita icilonganino ca Bwina Kristu ninshi tacilapangwa. Kanshi
  tacalolele mu kuti filya talekonka Yesu ninshi tasumiine muli Yesu nelyo alesambilisha
  ifya bufi. Afwile alikwete icitetekelo mwi shina lya kwa Yesu, e lyo kabili Yesu
  atile ulya mwaume takabulwe icilambu.\\nCimbi ico alandilepo ca kutila, kuti cabipa
  sana abatumwa nga bapunwisha umuntu ku fyo balanda nelyo ku fyo bacita. Yesu atile:
  \u201cOnse uwafumya ku citetekelo umo pali aba abanono abasumina, kuti cawama bamukobeka
  mu mukoshi icilibwe cafina ica kupelelako nga cilya impunda ipindulula no kumupoosa
  fye muli bemba.\u201d (Marko 9:42) Asosele no kuti abasambi bakwe balingile ukuputulako
  ukuboko, ulukasa, nelyo ukuilobolamo ilinso nangu line ifi ifilundwa fyalicindama,
  nga ca kuti filelenga baleipununa. Cawamapo ukukanaba ne filundwa fya mubili ifyacindama
  pa kuti twingile mu Bufumu bwa kwa Lesa ukucila ukuba na fyo e lyo twapooswa mu
  Gehena (Umupokapoka wa Hinomu). Abatumwa ba kwa Yesu bafwile baliumwenepo uyu umupokapoka
  uwali mupepi na ku Yerusalemu umo baleocela ifisooso. E ico balishibe ukuti ilyo
  Yesu alandile pali Gehena alelanda pa konaulwa umuyayaya.\\nYesu abasokele no kuti:
  \u201cCenjeleni ukuti mwisuula umo pali aba abanono; pantu ndemweba nati bamalaika
  wabo mu muulu balamona lyonse icinso ca kwa Tata.\u201d Cinshi cilanga ukuti aba
  \u201cabanono\u201d balicindama sana kuli Wishi? Yesu alandile pa muntu uwakwete
  impaanga 100 e lyo paluba imo. Uyu muntu alishiile impaanga 99 no kuya mu kufwaya
  imo iyalubile, kabili ilyo aisangile alitemenwe ukucila ne fyo atemenwe ilyo akwete
  impanga 99. Yesu asosele no kuti: \u201cTata uwaba mu muulu tafwaya ukuti umo pali
  aba abanono alobe.\u201d\u2014Mateo 18:10, 14.\\nNapamo filya abatumwa balekansana
  pa wali umukalamba, e calengele abebe ukuti: \u201cMuleba no mucele mu myeo yenu,
  kabili muleikala umutende na banenu.\u201d (Marko 9:50) Umucele ulalenga ifya kulya
  ukumfwika bwino. Ifyebo ifyalungwamo umucele wa mampalanya filaba ifisuma kabili
  filalenga balaumfwana. Ukukansana kwena takuleta mutende.\u2014Abena Kolose 4:6.\\nLimo
  aba bwananyina kuti bapusana, e ico Yesu alyebele abasambi ifya kucita. Atile: \u201cNga
  munonko acita ulubembu, kabiye no kumweba icilubo cakwe ninshi muli fye babili.
  Nga akuumfwa, ninshi wabwesesha munonko mu nshila.\u201d Inga nga tomfwile? Yesu
  atile: \u201cSenda umuntu na umbi nelyo babili pamo nobe, pantu inte shibili nelyo
  shitatu e shingashininkisha umulandu.\u201d Nga akaana ukumfwa na kuli bena, bafwile
  ukweba \u201cicilonganino,\u201d e kutila baeluda pa kuti bengapingula. Inga nga
  ca kuti tomfwile na kuli baeluda? \u201cLeka abe kuli iwe ngo mwina fyalo kabili
  nga kasonkesha wa misonko,\u201d umuntu uo abaYuda bashaleampana nankwe.\u2014Mateo
  18:15-17.\\nBaeluda balingile ukukonka ifyo Icebo ca kwa Lesa cilanda. Nga basanga
  ukuti uubembwike ali no mulandu kabili alingile ukusalapulwa, ninshi ubupingushi
  bwabo \u2018nabukakwa kale na mu muulu.\u2019 Lelo nga basanga ukuti takwete umulandu,
  ninshi \u2018na mu muulu nakakulwa.\u2019 Ifi fyali no kwafwa Abena Kristu ilyo
  icilonganino capangilwe. Yesu atile ilyo kuli ukulanshanya pa milandu ya musango
  yu, \u201cukuli babili nelyo batatu abalonganina mwi shina lyandi, ninshi na ine
  ndi pa kati kabo.\u201d\u2014Mateo 18:18-20.\"", "\"Ici cipepala cilelondolola umutande
  uwipiuwa nsambu ne milimo iyo mwakwata ilyo mulesendamo ulubali mu kufwailisha kwa
  HIV Vaccine Trials Network (HVTN). Umulimo wa ili Funde lya Nsambu ne Milimo kwafwilishako
  abalesendamo ulubali ukubomba palwabo elyo nokwampana nabaletungulula uku kufwailisha.
  Ngamulefwaya ukwishibilapo nafimbi moneni icipepala cabulondoloshi icakusumininapo.\\nInsambu
  sha Balesendamo Ulubali\\nPamo ngo muntu uulesendamo ulubali mu kufwailisha kwa
  fikumine akashishi ka HIV/AIDS mu mulimo wa HVTN, namukwata insambu sha:\\n- Ukukwata
  ilyashi lyonse, ukubikapo bulondoloshi pamasanso ayengasangwamo elyo nefyo mwinganonkelamo
  ilyo mulesendamo ulubali, ififwile fyalondololwa kuli imwe mumusango untu mwingomfwikisha
  bwino. Muli nokwebwa pa lyashi ilipya lyonse ililesambililwapo ilyo uku kufwailisha
  kulecitika.\\n- Amepusho yenu yonse yafwile ukwasukwa.\\n- Kuti mwakana ukuilundako
  kuli uku kufwailisha nangu ukusala ukufumamo panshita yonse iyo mulefwaya. Kabili
  kuti mwakana nokuilundako ku masambililo yonse ayakalakonkapo ayo bamyebapo. Tamwakalufyepo
  insambu ishili shonse ishilembelwe muli ili pepala ngacakuti mwakana ukuilundamo
  muli uku kufwailisha nangu ngacakuti mwafumamo.\\n- Ukusangwa pa ncende iyabula
  akapatulula. Amasalo yenu, ifikomo fyenu, ifyo mwasuminamo, elyo nentambi shenu
  shilingile ukucindikwa na bantu abaletungulula uku kufwailisha.\\n- Ukutumwa ku
  ncende shimbi mukupandwa amano, ukutangatwa, no kundapwa ku malwele ayo muleculako
  panshita ya uku kufwailisha, ukubikapo na kashishi ka HIV.\\n- Ukwafwilishiwa ukupwisha
  amafya yamikalile na/nangu ukulekeleshiwa ifikumine kuli uku kufwailisha. Ngacakuti
  mwatusuminisha, kuti twalanda na bantu bamo abo mwatweba ukuti tulande nabo pakuti
  twabalondolwelako nafimbi pamulandu wakusendamo ulubali kwenu muli uku kufwailisha.\\n-
  Ukundapwa ku filonda ifyo mwaicena, ngacakuti fyasangwa, ukuceneka konse ukwingesa
  ukufuma ku fipe ne fibombelo ifilesangwa muli uku kufwailisha ukucila pafingaletwa
  ukufuma kumbi, ukufika pa cifiko icilondolwelwe mucipepala cakusumininapo. Kwalibako
  indalama ishakulipila pakundapa ifilonda fyamusango uyu. Ibumba ilipituluka mufikumine
  ubucingo bwa uku kufwailisha lilaceceta nokumona ngacakuti nafyampana. Ubusalo bwabo
  kuti bwapitulukwamo nakabili ngacakuti mwakana kufyo bapingula. Mu milandu imo,
  indalama tekuti shikwanine ishakulipila kukundapa ukwapwililika. Ngacakuti cilekabilwa,
  amabumba ayalekondenkanya uyu mulimo yakafwailapo indalama nashimbi ishakundapila,
  lelo tekuti musubile sana ukuti cikacitika. Abalekondenkanya uyu mulimo bakamipeela
  ilyashi lyonse ilikumine uku kufwailisha elyo kabili bakasuka namepusho yonse ayo
  mwingakwata nangu ukumikuminkanya nabantu abafishiba bwino abengasuka bwino amepusho
  yenu.\\n- Ukupimwa ukwabula ukulipila kabili ukwacishinka ukwa kashishi ka HIV ilyo
  mulesangwa muli uku kufwailisha. Ngacakuti, pampela ya uku kufwailisha, mwasangwa
  ukuti muli nakashishi ka HIV ako akaisa pamulandu wa fibombelo fya uku kufwailisha
  elyo kabili takafumine kumulandu wa lwambu lwa aka kashishi, kuti mwalapimwa mukukonkana
  pa cipatala apalecitikila ukufwailisha ukubomfya imipimine ya HVTN mpakafye mukesepimwa
  ukutila tamukwete aka kashishi.\\n- Ukwafwilishiwa ukukwanisha no kufikilisha ififwaikwa
  ku kufwailisha konse. Umutande wa fintu ififwaikwa ukuti mubomfye ukapelwa kuli
  imwe ukufuma pa ncende ya uku kufwailisha\\n- Inkama. Ukulanshanya konse nefyasungwa
  ifyapa kusendamo ulubali kwenu fikalapelwafye ilyo filefwaikwa mukubomba kwa uyu
  mulimo, nangu ilyo fyakabilwa ukukonkana ne funde. Moneni icipepala cakusumiinapo
  icapa cipatala apalecitikilwa uku kufwailisha pakuti mwishibilepo nafimbi.\\n- Ukupeelwa
  akatupa kakwishibikilwapo ukuti mulesanga muli uku kufwalisha. Pali aka katupa pakalasangwa
  inambala ya musange na/nangu akeyala ka muntu uwingamipeelako ilyashi nalimbi.\\n-
  Ukusungilila insambu shenu ishe funde. Pamo nga uulesendamo ulubali, tamulelufyapo
  insambu shenu ishili shonse.\\n- Ukumyeba ngacakuti mwapelwe icimpashanya ca muti
  nangu umuti uwinefye panuma yauku kufwailisha, nangu ilyo cafwaikwa pamulandu wamyundapile.\\n-
  Ukumyeba ifyo ukufwailisha kuleenda napantu kwafika, ukwebwa ilyo ifikatumbukamo
  fikasangwa, elyo nokumilondolwela bwino ifikatumbukamo kubabomfi ba uku kufwailisha.\\n-
  Ukwishiba ngacakuti kuliko ifyakulipila ifikumine kuli uku kufwailisha elyo nokwishiba
  ngacakuti mukalipililwapo pakusendamo ulubali kwenu.\\nImilimo ya Ulesendamo Ulubali\\nPamo
  ngo muntu uulesendamo ulubali mu kufwailisha kwa fikumine akashishi ka HIV/AIDS
  mu mulimo wa HVTN, namukwata imilimo pamo ngeyi:\\n- Ukupitulukamo nokulanga ukumfwikisha
  ifyalembwa fyonse ifyo mwapeelwa, ukubikapo ne fipepala yakusumininapo. Ukwipusha
  ukumilondolwela pa lyashi lyonse ilyo mushumfwikishe ilyo tamulasumina ukusendamo
  ulubali muli uku kufwailisha. Kabili kuti mwaipusha amepusho ayali yonse panshita
  iili yonse iya uku kufwailisha.\\n- Ukupanga ubusalo ubwaishibikwa bwino ubwakufwaya
  ukusendamo ulubali muli uku kufwailisha panuma yakupima nokupashanya pakati kamasanso
  elyo nefyakunonkelamo. Cili icikankala ukwishiba ico uku kufwailisha kubeleleko.
  Ababomfi ba uku kufwailisha bakamyafwilisha muli ili lyashi. Ngacakuti cingamyafwa
  ukupanga ubusalo, landeniko nabantu abo mwacetekela nokucindika pakuti bamipandeko
  amano ngacakuti cilifye bwino kuli imwe ukwingila muli uku kufwailisha.\\n- Ebeni
  ababomfi ba uku kufwailisha mukwangufyanya ngacakuti mwakumanya ukukankambwa na/nangu
  ubusanso ku mikalile yenu ifyo muletontonkanya ukuti limbi fyaisa pa mulandu wakusangwa
  muli uku kufwailisha.\\n- Tamulingile ukupelako umulopa nangu ukusangulako ifilundwa
  fyenu ifyamubili nangufye ifyamenshi fimbi ifyamu mubli wenu panshita iyo mulesangwa
  muli uku kufwailisha.\\n- Mufwile ukulapimisha akashishi ka HIV pa cipatalafye apo
  pene pa nshita yonse iyo mulesangwa muli uku kufwailisha. Landeni nababomfi ba uku
  kufwailisha ngacakuti mulefwaya ukuyapimisha ku ncende imbi.\\n- Ngacakuti muli
  munshita yakuti kuti mwakwata ifumo, esheni ukucincintila ukukwata ifumo ukupitila
  mukubomfya imiti iyakuicingilila ukwimita. Ababomfi ba uku kufwailisha bakamipitulukilamo
  bwino mu miti iingabomba bwino kuli imwe.\\n- Mulingile ukufikilisha inshita shonse
  ishakufika kuli uku kufwailisha. Mulingile ukweba ababomfi ba uku kufwailisha ngacakuti
  tamwakwanishe pakuti bacinja inshita yakwisa kwenu.\\n- Mulingle ukucindika ababomfi
  ba uku kufwailisha.\\n- Mufwile mwasunga inkama pabanenu bambi abalesendamo ulubali
  muli uku kufwailisha.\\n- Mulingile ukupeela ababomfi ilyashi lyonse kabili ilya
  cishinka ilikumine kuli uku kufwailisha. Ebeni ababomfi pakwaluka kwa musango wakulanshanishishanyamo
  naimwe ilyo lyonse mwacinja nangu ilyashi lyonse ilyapa bumi bwenu.\\n- Konkeni
  inkonka sha kufwailisha ukulingana na maka yenu yonse. Bombeleni pamo nababomfi
  ba uku kufwailisha pakusungilila ubumi no bucingo bwenu ilyo mulesangwa muli uku
  kufwailisha.\\n- Ebeni ababomfi ba uku kufwailisha mukwangufyanya ngacakuti tekuti
  mukwanishe nangu ngamwasala ukufumamo muli uku kufwailisha.\\nImilimo ya Babomfi
  ba uku Kufwailisha\\nAbabomfi ba kufwailisha kwa HVTN, ukubikapo naba Kafwailisha
  Mukalamba (PI) pali ici cipatala, nabakwata imilimo pamo ngeyi:\\n- Ukwipushaipusha
  abekala calo pali fyonse ifikumine uku kufwailisha nokushininkisha ukuti kwaba ubwiminishi
  ubusuma kuli abo abalesendamo ulubali.\\n- Ukuipekanya ukwasuka amepusho elyo nokupokelela
  bumpandamano ukufuma ku kabungwe akalekondenkanya uyu mulimo pamo nga akabungwe
  ka Institutional Review Board (IRB) nangu akabungwe kambi akalebombela mukuceceta
  kwa uku kufwailisha.\\n- Ukushininkisha ukuti abalesendamo ulubali baumfwikisha
  ifyo baleingilamo ilyo tabalasumina ukusendamo ulubali mu milimo yonse iikumine
  uku kufwailisha nangu ifyakucingilila fyonse. Ngacakuti kwabako ifyacinja ilyo ukufwailisha
  kulecitika, abalesendamo ulubali bafwie baipushiwa nakabili ngacakuti balesumina.\\n-
  Ukubomba uku kufwailisha mu musango uwayana, ukubikapo na ukucingilila insambu,
  ukusunga inkama elyo nokusunga bwino ubumi bwabalesendamo ulubali muli uku kufwailisha.
  Pampela ya uku kufwailisha, ababomfi nabakwata umulimo wakweba abalesendamo ulubali
  ifibombelo ifyo bapeelwe muli uku kufwailisha pamofye nokubeba ifitumbwikemo elyo
  nokwebako abekala calo.\\n- Ukutuma abantu ku ncende ishayana ishakupandwako amano,
  ukucingilila ukwambula kwa kashishi ka HIV, ukundapa kwa kashsishi ka HIV, na/nangu
  bumpandamano bonse ubwingakabilwa ilyo uku kufwailisha kulecitika.\\n- Ukwasuka
  ku mepusho yonse na masakamiko ayalefuma ku balesendamo ulubali panshita iyo balekabila
  ukwasukwa.\\n- Ukukwata umucinshi kuli bonse abalesendamo ulubali.\"", "\"\u201cIncito
  natampile ukubomba yalengele ndeikala bwino no lupwa lwandi. Na lyo line, iyi incito
  yalengele ndecita ifyabipa. Natendeke ukusefya amaholide, ukuisansha mu mapolitiki,
  e lyo no kulaya ku macalici. Nalilekele ukulongana no kushimikila pa myaka 40. Ilyo
  paleya palepita inshita, natampile ukutontonkanya ukuti Yehova takatale anjeleela
  pa fyo nalecita. Nalemona kwati imembu nacitile shalifulile sana. Na kuba, nalisambilile
  icine ilyo nshilatendeka ukucita ifyabipa.\u201d\u2014Ba Martha.\\nNGA MULOMFWA
  ububi pa membu mwacitile kuti mwalasakamikwa sana. Imfumu Davidi yatile: \u201cImembu
  shandi shapita pa muulu wa mutwe wandi; shamfinina nge cisendo cafina.\u201d (Amalumbo
  38:4) Abena Kristu bamo balaba sana no bulanda pantu bamona kwati Yehova te kuti
  abeleele. (2 Abena Korinti 2:7) Bushe ca cine Lesa te kuti abeleele? Nga mwalicitilepo
  imembu ishabipisha, bushe mumona kwati muli babembu sana ica kuti Yehova te kuti
  amweleele? Iyo, kuti amweleela.\\n\u201cLekeni Tulanshanye Kabili Nalamwafwa Ukuwamya
  Bucibusa Bwenu na Ine\u201d\\nYehova talekelesha ababembu abalapila. Na kuba, alafwaya
  sana ukuti balapile. Mu cilangililo ca mwana uwalubile, Yesu apashenye Yehova kuli
  wishi uwakwete umwana uwashiile ba lupwa wakwe no kutendeka ukwikala imikalile yabipa.
  Mu kupita kwa nshita, umwana alibweleele ku ng\u2019anda. \u201cNomba ilyo [umwana]
  acili ukutali, wishi alimumwene kabili aumfwile uluse, kabili alimubutukile no kuwila
  pa mukoshi wakwe no kumutomona.\u201d (Luka 15:11-20) Bushe mulafwaya ukupalama
  kuli Yehova, lelo mumona kwati \u2018mucili ukutali\u2019 nankwe? Nga filya wishi
  wa mu cilangililo ca kwa Yesu acitile, Yehova na o kuti amubelela uluse. Alafwaisha
  mwatendeka ukumubombela na kabili.\\nFinshi mufwile ukucita nga mumona kwati imembu
  mwacita shalifulisha ica kuti Yehova te kuti amweleele? Moneni ifyo Yehova atweba
  pali Esaya 1:18. Atila: \u201c\u2018Nomba iseni, lekeni tulanshanye kabili nalamwafwa
  ukuwamya bucibusa bwenu na ine,\u2019 e fyo Yehova asosa. \u2018Imembu shenu nelyo
  shakashika ce, shikabuuta tuutu kwati butonge.\u2019\u201d Ca cine ukuti nangu fye
  imembu shenu shimoneke isha kashika ce pa nsalu yabuuta, Yehova kuti amweleela.\\nYehova
  tafwaya mwatwalilila fye ukumfwa ububi pa fyabipa ifyo mwacitile. Finshi mufwile
  ukucita pa kuti Yehova amweleele na pa kuti mutwalilile ukumubombela na kampingu
  iisuma? Natulande pa fintu fibili ifyo Davidi uwali imfumu acitile. Abalile alanda
  ukuti: \u201cNalayebelela imembu shandi kuli Yehova.\u201d (Amalumbo 32:5) Mwilalaba
  ukuti, Yehova alimweba kale ukuti mulingile ukupepa kuli ena pa kuti \u2018engamwafwa
  ukuwamya bucibusa bwenu\u2019 na ena na kabili. Kanshi mufwile ukulapepa kuli Yehova
  lyonse. Mulingile ukweba Yehova pa membu mwacita e lyo ne fyo muleumfwa ububi pa
  membu mwacitile. Ifyacitikiile Davidi fyalengele apepe ati: \u201cNsangululeni na
  ku lubembu lwandi. . . . Umutima uwa bulanda kabili uwasakamikwa, tamwakausuule,
  mwe Lesa.\u201d\u2014Amalumbo 51:2, 17.\\nLesa na kabili alitumine kasesema Natani
  ku kwafwa Davidi. (2 Samwele 12:13) Na muno nshiku mwine, Yehova alibikako baeluda
  mu filonganino abo asambilisha bwino ifya kwafwa ababembuka abalapila ukuba ifibusa
  fyakwe na kabili. Nga mwaeba baeluda ulubembu mwacitile, bakamubelengela Amalembo
  ayakamwafwa, kabili bakamupepelako pa kuti mwikatwalilila fye ukuba no bulanda pa
  fyo mwacitile na pa kuti mukapole.\u2014Yakobo 5:14-16.\\n\u201cAlipaalwa uo Baeleela
  Ulubembu Lwakwe\u201d\\nNalimo kuti mwamona kwati cintu cayafya sana ukweba Yehova
  Lesa na baeluda imembu isho mwacitile. Ifi fine e fyo na Davidi alemona pantu atile
  \u2018alitaleele\u2019 ilyo abembwike. (Amalumbo 32:3) Na lyo line, mu kuya kwa
  nshita, alimwene ubusuma bwaba mu kuyebelela imembu ne fyo cawamina ukuleka ukucita
  ifyabipa.\\nIlyo Davidi ayebelele imembu, ali ne nsansa na kabili. Alembele ati:
  \u201cAlipaalwa uo baeleela ulubembu lwakwe, uo bafimba pa lubembu lwakwe.\u201d
  (Amalumbo 32:1) Alipepele no kuti: \u201cMwe Yehova, shi asamuneni akanwa kandi,
  pa kuti akanwa kandi kasose ifya kumulumbanya.\u201d (Amalumbo 51:15) Ilyo Davidi
  alekele ukumfwa ububi pa membu isho acitile kabili no kutemwa atemwa pa fyo Yehova
  amubeleele uluse, alitendeke ukwebako bambi pa fyo Yehova eleela imembu.\\nYehova
  afwaya ukuti mulemubombela na kampingu iisuma. Afwaya no kuti muleebako bambi pali
  ena na pa bufwayo bwakwe. Tafwaya ukuti muletwalilila fye ukumfwa ububi pa membu
  isho mwacitile, lelo afwaya ukuti mulemubombela muli bucishika no kuti muleba ne
  nsansa. (Amalumbo 65:1-4) Yehova atweba ati lapileni \u2018pa kuti imembu shenu
  shifuutwe, e lyo Yehova akamupuupuutula.\u2019\u2014Imilimo 3:19.\\nIfi fine e fyo
  cali na kuli ba Martha. Batiile: \u201cUmwana wandi atwalilile fye ukuntumina Ulupungu
  lwa kwa Kalinda na Loleni. Ici calengele ntendeke ukutemwa Yehova panono panono.
  Icintu icangafishe ukucita, kulomba ubwelelo kuli Yehova pa membu isho nacitile
  pa kuti mbwelele kuli ena. Lelo nasukile napepa kuli Lesa ukuti anjeleele. Ndafilwa
  ukushininkisha ukuti palipitile imyaka 40 pa kuti ntendeke ukubombela Yehova na
  kabili. Ifyancitikiile filanga fye ukuti nangu pengapita imyaka iingi shani, umuntu
  na kabili kuti atendeka ukupepa Lesa kabili kuti aaba cibusa wakwe.\u201d\"", "\"Baibolo
  ya pa Intaneti | BAIBOLO\u2014AMALEMBO YA CALO CIPYA\\n8 Bushe amano tayabilikisha,+
  no mucetekanya bushe tausansula ishiwi lya uko?+\\n2 Yeminina apasansuka,+ pa mbali
  ya nshila, na pa masansa ya nshila.\\n3 Ku mbali ya mpongolo, apo bengilila mu musumba,+
  apa kwingilila pa miinshi e po yabilikishisha, ayati:+\\n4 \u201cMwe bantu, ni mwe
  ndeita, ne shiwi lyandi lilebilikisha ku bana ba bantu.+\\n5 Mwe bapelwa mano, beni
  abacenjela;+ na imwe mwe bawelewele, beni no mutima wa mano.+\\n6 Umfweni, pantu
  ndelanda pa fintu ifyacindamisha,+ kabili ndesosa pa bulungami.+\\n7 Pantu icine
  e co akanwa kandi katepelesha;+ kabili ububifi ca bunani ku milomo yandi.+\\n8 Amashiwi
  yonse aya mu kanwa kandi yalilungama.+ Tamwaba icapotama nangu icapondama.+\\n9
  Fyonse fyalilungama ku wa mucetekanya, kabili fyalyololoka ku basanga ukwishiba.+\\n10
  Pa kufunda kwandi na pali silfere, salenipo ukufunda, kabili pa kwishiba kwandi
  na pali golde iyawamisha, salenipo ukwishiba.+\\n11 Pantu amano yaliwama ukucila
  bakorali,+ na fyonse ifyo abantu batemwisha tafingafikako.+\\n12 \u201cIne, ne mano,
  nalicenjela+ kabili nalisanga ukwishiba no kulingulula.+\\n13 Ukutiina Yehova e
  kupata ububi.+ Amatutumuko ne cilumba+ ne nshila ibi na kanwa+ kalanda ifyabipa
  nalifipata.\\n14 Ndapanda amano+ kabili nalikwata na mano yene yene.+ Ine nalikwata
  umucetekanya;+ na maka.+\\n15 Nine nenga ishamfumu shileteka, no kuti abalashi baleshika
  fipope mu bulungami.+\\n16 Nine nenga bacilolo babe bacilolo,+ no kuti bashimucindikwa
  bonse bapingule mu bulungami.+\\n17 Abantemwa na ine nalibatemwa,+ kabili abamfwaya
  e bansanga.+\\n18 Ifyuma no bukata fyaba kuli ine,+ ifya bupyani ifyauma umutengo
  no bulungami.+\\n19 Ifisabo fyandi fyaliwama ukucila golde, nangu fye ni golde iyalopololwa,
  ne fya kulobolola fyandi fyacila silfere iyawamisha.+\\n20 Nyenda mu nshila ya bulungami,+
  pa kati ka misebo ya bupingushi,+\\n21 ku kulenga abantemwa babe ne fyuma;+ kabili
  njisusha amatala yabo.+\\n22 \u201cYehova alimpangile, nine wa kubalilapo pali fyonse
  ifyo apangile,+ nine wa ntanshi pa milimo yakwe iya ku kale.+\\n23 Ukufuma umuyayaya
  nalisansabikwa,+ ukufuma pa kutendeka, ukufuma pa nshita isonde talilabako.+\\n24
  Ilyo tapalaba bemba e lyo nafyelwe kwati ni ku wakomwa ifumo,+ ilyo tapalaba no
  tumfukumfuku utwakwatisha amenshi.\\n25 Ilyo impili shali tashilashimpwa,+ ilyo
  utupili tatulabako, e lyo nafyelwe kwati ni ku wakomwa ifumo,\\n26 ninshi talapanga
  ne sonde+ ne mpanga ne loba lya pa muulu wa mushili wa pano isonde.+\\n27 Ilyo apekenye
  imyulu, e ko nali;+ na lintu apakwile imipaka yashinguluka pa muulu wa menshi ayengi,+\\n28
  ilyo aikeshe amakumbi mu muulu,+ ilyo aikeshe utumfukumfuku twa bemba,+\\n29 ilyo
  abikile icipope kuli bemba ukuti amenshi yepula pa cebo cakwe,+ ilyo abikiile amashintililo
  ye sonde icipope,+\\n30 ninshi ndi nankwe, ngo waishibisha imilimo,+ kabili nine
  atemenwe+ nga nshi inshiku shonse, na ine naleanga ku cinso cakwe inshita yonse,+\\n31
  naleanga pa mulandu we sonde lyakwe,+ kabili abana ba bantu e bo natemenwe.+\\n32
  \u201cE ico nomba, mwe bana, umfweni kuli ine; cine cine balipaalwa abasunga amafunde
  yandi.+\\n33 Umfweni ukusalapula no kuba aba mano,+ kabili mwiba ne misuula nangu
  panono.+\\n34 Alishuka umuntu uumfwa kuli ine pa kuba uwalola ilyo ali pa fiibi
  fyandi ubushiku no bushiku, pa kulinda pa nceshi sha pa minshi yandi.+\\n35 Pantu
  uwansanga akasanga umweo,+ no kumona ipaalo ukufuma kuli Yehova.+\\n36 Lelo uwafilwa
  ukunsanga afyenga umweo wakwe;+ bonse abampata icine cine e batemwa imfwa.\u201d+\"",
  "\"O Ukulala\\nUkusendama bwino - ubumi ubusuma\\nUbusuma bwa mweo, umulimo no kupanga
  ifyafumamo fyashintilila pa busuma bwa kusendama. Nga mulelala bwino, muleumfwa
  bwino mu mikalile ya cila bushiku. Ukulolesha no kuwamya imibele yenu iya kusendama
  ukubomfya Ukusendama.\\n- Luba pa lwa kutonta mu nshita ya kubomba akasuba no kukanakwata
  ubutulo ubushiku.\\n- Fwayeni ilyo mwalala no kubuuka ukufuma ku tulo twabipisha.\\n-
  Ukwishiba nga ca kuti ulelala nelyo ukupopomenwa no kusendama.\\nUkulala Ubutulo\\nIfintu
  ifisuma ifya Kusendama\\nIfikope fya pa cikope\\nIcilangililo cakubomfya icakulala\\nKopa
  no kulaala bwino\\nUkupitulukamo\\nIfyo ababomfya ubutulo balanda\\nIfyakufwaikwa\\nIfyakufwaikwa
  pa kubomfya Amafoni\\nPa kuti \u201cUkulala - ukulolesha pa tulo\u201d ukubomba
  bwino, mufwile ukuba ne cipe icabomfya umusango wa Android uwa 5.0 nelyo ukucilapo,
  e lyo no kuba ne ncende ya buntunse iya 24 MB pa cipe. Ukulundapo, programu ilomba
  insambu ishikonkelepo: ilyashi lya kale ilya kubomfya ifibombelo ne programu, maikulofoni.\"",
  "\"22 Aya e mashiwi ya lwimbo+ ulo Davidi aimbiile Yehova mu bushiku Yehova amupokolwele
  mu minwe ya balwani+ bakwe bonse na mu minwe ya kwa Shauli;+\\n2 atile:\u201cYehova
  e cilibwe candi,+ e cubo candi+ kabili e wa kumpokolola.+\\n3 Lesa wandi e cilibwe
  candi.+ E mo nakulauba,Ni nkwela+ yandi kabili e lusengo+ lwandi ulwe pusukilo,
  e lupili lwandi ulwasansuka,+Kabili e ko mfulumukila,+ e Mupusushi wandi;+ uuntuula
  ku ba lubuli.+\\n4 Yehova, uwalinga ukulumbanya,+ e o ndelililako,Kabili akampususha
  ku balwani bandi.+\\n5 Pantu amabimbi ya kulenga imfwa yalinshingulwike;+Abantu
  ifinangwa na bo baisa nga mukukulule wa menshi ku kuntiinya.+\\n6 Imyando ya Nshiishi
  yalimpombele;+Nakumene ne fiteyo fya mfwa.+\\n7 Mu kucula kwandi nalelilila kuli
  Yehova,+Nalelilila kuli Lesa wandi.+Awe mwi tempele lyakwe aumfwile ishiwi lyandi,+Aumfwile
  inkuuta yandi mu matwi yakwe.+\\n8 Kabili isonde lyatendeke ukusunkana no kutenta;+Amashinte
  ya myulu yalitenkene,+Yalesunkana pantu alikalipe.+\\n9 Mu myona yakwe mwafumine
  icushi, no mulilo uwafumine mu kanwa kakwe waleoca;+Kuli ena kwafumine amalasha
  ayaleaka.+\\n10 E lyo asendeke imyulu no kwika;+Kabili imfifi yafiitisha yali mwi
  samba lya makasa yakwe.+\\n11 Aishile nanina pali kerubi+ no kwisa alepupuka;Aali
  pa mapindo ya kwa malaika.+\\n12 Aikupile imfifi nge nsakwe,+Iya menshi yafiita
