  O na kau vai \u0169mwe wit\u0169 \u0169tonya k\u0169weta nesa vy\u0169 \u0169nd\u0169
  \u0169keth\u0129wa aily\u0129 e nth\u0129 nza\u0169, k\u0169ea ngewa \u0129\u0169l\u0169
  wa k\u0129la t\u0169kwona ta k\u0129kek\u0129ka n\u0129k\u0169tumaa t\u0169thangaany\u2019a,
  na n\u0129k\u0169t\u0169nengae mwanya wa kwonany\u2019a n\u0129t\u0169\u0129k\u0129\u0129e
