  wa \u0169nd\u0169 \u0129vinda y\u0169k\u0129te y\u0129keth\u0129wa y\u0129ily\u0129,
  asung\u0129ie \u0129k\u0169lyo y\u0129u asya: \u201cN\u0129 w\u2019o n\u0129ng\u0169mw\u0129a,
