  m\u0129thenya \u0129tat\u0169 nth\u0129 ya\u0129 na k\u0129vindu king\u0129 m\u0169no,
  \u0129nd\u0129 Aisilaeli ma\u0129 na kyeni k\u0169la mat\u0169\u0129te.\\n\u0128tina
