  na misyi, aimanyisya masinakokeni moo, na aitavan''ya uvoo museo wa usumbi, na aivosya
  mowau ma mithemba yonthe na kila wonzu. Mathayo 9:35 Na makomano manene mooka vala
  ui, me na syonze, na ililinda, na ala mataneenaa, na ala au mamutha, na angi aingi,
