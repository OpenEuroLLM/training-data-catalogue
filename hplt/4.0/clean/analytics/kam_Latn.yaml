  ang\u0129 m\u0169endeee k\u0169thesya nth\u0129 \u0129no y\u0129kale \u0169nd\u0169
  m\u0169\u0169nda wa Eteni waily\u0129. At\u0169i maku onthe mamwendete Yeova o \u0169nd\u0169
