  k\u0169m\u0169th\u0169k\u0169ma Yeova \u0129vindan\u0129 y\u0129\u0129 y\u0129 na
  math\u0129na.\u2014Alo. 1:11, 12, BCK.\\n17 K\u0169k\u0169na visa k\u0129l\u0129kon\u0129
  \u0129\u0169l\u0169 wa \u0129vinda y\u0169k\u0129te n\u0129k\u0169tonya k\u0169t\u0169tethya
  \u0169keth\u0129a t\u0169ikw\u0129silya m\u0169no \u0129\u0169l\u0169 wa math\u0129na
  ala tw\u0129 namo. Kwoosa ngelekany\u2019o ya \u0129vinda y\u0129mwe m\u0169t\u0169mwa
