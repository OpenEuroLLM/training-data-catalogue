  na vinya, na ma\u0169nd\u0169 onthe ala w\u0129kwat\u0129tye kw\u0129sa kwona n\u0129
  maseo. And\u0169 ala ma\u0169ngam\u0129e w\u0129a wenyu wa k\u0169thesya nth\u0129
  mai\u0169m\u0169tulya n\u0169nd\u0169 n\u0129mamwendete vy\u0169. Naku w\u0129\u0129w\u2019a
  m\u0169yo \u0169it\u0169m\u0129a inengo syaku na \u0169t\u0169\u0129ka waku n\u0169nd\u0169
  kyonthe k\u0129la \u0169kw\u0129ka n\u0129k\u0129\u0169tethya ala ang\u0129 na n\u0129k\u0129\u0169m\u0169ta\u0129a
  Ngai. Kwa ngelekany\u2019o, n\u0169\u0169t\u0169m\u0129a \u0129vinda \u0169katetheesya
  ala mathay\u0169\u0169kw\u2019a mam\u0169manye Yeova. (Yoa. 17:3; Meko 24:15) Eth\u0129wa
  n\u0169s\u0169an\u0129aa ma\u0169nd\u0169 asu onthe, ndw\u0129th\u0129awa \u0169iota.
  N\u0129k\u0129? N\u0169nd\u0169 k\u0169k\u0169na visa wa ma\u0169nd\u0169 asu mase\u0169v\u0129te
  \u0169u n\u0129kwosan\u0129te na k\u0129la Maand\u0129ko mawetete \u0129\u0169l\u0169
  wa \u0129vinda y\u0169k\u0129te.\u2014Isa. 11:9; 25:8; 33:24; 35:5-7; 65:22.\\nN\u0128K\u0128
  WA\u0128LE K\u0168NEENEA W\u0128KWATYO WAKU?\\n16, 17. K\u0169neenea w\u0129kwatyo
  \u0169la tw\u0129 naw\u2019o k\u0169tonya k\u0169t\u0169tethya ata?\\n16 K\u0169ea
