  nginya Wakatano\\n2:00 kwakya. nginya 5:00 kwakya. na 7:00 m\u0169thenya. nginya
  10:00 m\u0169thenya.\\n\u0128saa 1\\nMa\u0169nd\u0169 ma vata\\nOvisi \u0169\u0169
  \u0169\u0169ngam\u0129\u0129te w\u0129a wa Ng\u0169s\u0129 sya Yeova nth\u0129 ya
  Fiji, Kiribati, Tuvalu na Nauru. N\u0129 \u0169aly\u0169laa mavuku mena \u0169voo
  kuma Mbivilian\u0129 kwa k\u0129thyomo kya Fijian, Kiribati, Tuvaluan, Rotuman,
  na Nauruan.\"", "\"KWASISYA visa ii. K\u0129la \u0129mwe yasyo y\u0129onany\u2019a
  \u0169th\u0129ny\u2019o \u0169la Yeova waetie \u0129\u0169l\u0169 wa nth\u0129 ya
  Misili. Visan\u0129 wa mbee n\u0169tonya kwona Aluni aik\u0169na \u0168s\u0129 wa
  Naelo na ndata yake. Y\u0129la weekie \u0169u, k\u0129w\u2019\u0169 k\u0129la kya\u0129
  \u0169s\u0129n\u0129 kyaaly\u0169kile kyatw\u2019\u0129ka nthakame. Mak\u0169y\u0169
  n\u0129makwie naw\u2019o \u0169s\u0129 wamb\u0129\u0129a k\u0169nyunga na\u0129.\\n\u0128tina
  wa \u0169u, Yeova atuma syoa syambata kuma \u0168s\u0129n\u0129 wa Naelo. Nasyo
  sya\u0129 k\u0129la vand\u0169\u2014maikon\u0129, ikaang\u0129on\u0129, itandan\u0129\u2014k\u0129la
  vand\u0169. Y\u0129la syoa isu syakwie Amisili masy\u0169mbanisye mavumbu manene,
  na nth\u0129 yanyunga na\u0129 n\u0169nd\u0169 wasyo.\\nNa \u0129nd\u0129 Aluni
  ak\u0169na k\u0129too kya nth\u0129 na ndata yake, nakyo kyaaly\u0169ka kyatw\u2019\u0129ka
  t\u0169sam\u0169 t\u0169nini t\u0169\u0169manaa. \u0168th\u0129ny\u2019o wa katat\u0169
  \u0129\u0169l\u0169 wa nth\u0129 ya Misili wa\u0129 t\u0169sam\u0169 t\u0169u t\u0169nini.\\nMoth\u0129ny\u2019o
  ala ang\u0129 ma\u0169m\u0129isye o Amisili oka, na ti Aisilaeli. \u0168th\u0129ny\u2019o
  wa kana wa\u0129 wa ngi mbing\u0129 nene, ila syetav\u0129\u0129ie ny\u0169mban\u0129
  sya Amisili onthe. Na \u0169th\u0129ny\u2019o wa katano wa\u0129 \u0129\u0169l\u0169
  wa indo. Ng\u2019ombe, na malondu, na mb\u0169i mbing\u0129 sya Amisili n\u0129syakwie.\\nNa
  \u0129ng\u0129, Mose na Aluni moosa m\u0169u na ma\u0169\u0169l\u0169kya nzeven\u0129.
  Naw\u2019o waetee and\u0169 na nyam\u0169 itau nth\u0169ku. \u0168su n\u0129w\u2019o
  wa\u0129 \u0169th\u0129ny\u2019o wa thanthat\u0169.\\n\u0128tina wa \u0169u Mose
  ook\u0129lya kw\u2019oko kwake kwelekela \u0129tun\u0129, na Yeova aete k\u0129tundumo
  na mbua nene ya mavia. Nayo n\u0129yo ya\u0129 mbua nth\u0169ku vy\u0169 ya mavia
  kua nth\u0129 ya Misili.\\n\u0168th\u0129ny\u2019o wa nyanya wa\u0129 nguthu nene
  ya ngie. Mbee o na \u0129tina wa \u0129vinda y\u0129u k\u0169yaa\u0129th\u0129wa
  na ngie mbing\u0129 ta isu. Sya\u0129e m\u0129t\u0129 yonthe \u0129la mbua ya mavia
