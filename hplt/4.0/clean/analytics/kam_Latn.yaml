  \u0169kekal\u0129la k\u0129v\u0129la kya \u0169sumb\u0129 kya \u0169theu wake m\u0169tisu
  k\u0169aly\u0169kwan\u0129 kwe\u0169, inyw\u2019\u0129 nenyu n\u0129m\u0169kekal\u0129la
  iv\u0129la sya \u0169sumb\u0129 \u0129k\u0169mi na il\u0129, m\u0169k\u0129sil\u0129la
  mbai \u0129k\u0169mi na il\u0129 sya Isilaeli. Na k\u0129la m\u0169nd\u0169 \u0169la
  \u0169ti\u0129te ny\u0169mba, kana ana-a-inyia, kana e\u0129tu-a-inyia, kana \u0129the,
  kana nyinyia, kana syana, kana m\u0129\u0169nda, kwond\u0169 wa sy\u0129twa yakwa,
  akoosaa vand\u0169 va k\u0129mwe, \u0129ana, na akati\u0129wa thay\u0169 \u0169tathela.\u201d
  (Mt. 19:27-29) N\u0169nd\u0169 wa ma\u0169nd\u0169 asu Yes\u0169 wamatavisye, Vetelo
  vamwe na amany\u0129w\u2019a ala ang\u0129 ma\u0129 matonya k\u0169k\u0169na visa
  \u0129\u0169l\u0169 wa w\u0129a \u0169la maketh\u0129wa makwat\u0129\u0129e nth\u0129n\u0129
  wa silikal\u0129 \u0129la \u0129kasumb\u0129ka nth\u0129 na \u0129ietee and\u0169
  ala ewi moathimo maseo vy\u0169.\\n18. T\u0169tethekaa ata twas\u0169an\u0129a \u0129\u0169l\u0169
  wa \u0169nd\u0169 Ngai \u0169kean\u0129sya mawatho make?\\n18 Kuma tene ath\u0169k\u0169mi
  ma Yeova ala me k\u0169\u0169 nth\u0129 n\u0129matethekaa mavind\u0129\u0129sya
  m\u0169no \u0129\u0169l\u0169 wa k\u0129la Yeova wathan\u0129te. Kwa ngelekany\u2019o,
  ma\u0169nd\u0169 ala Aveli wees\u0129 \u0129\u0169l\u0169 wa k\u0129eleelo kya Ngai
  n\u0129matoetye k\u0169m\u0169tetheesya ak\u0169ne visa wa \u0129vinda \u0129seo
  y\u0129la ya\u0129 mbee wake. O na n\u0129mam\u0169tetheeisye kw\u0129th\u0129wa
  na m\u0169\u0129k\u0129\u0129o na w\u0129kwatyo m\u0169l\u0169mu. Nake Avalaamu
  eekie ma\u0169nd\u0169 manene ma m\u0169\u0129k\u0129\u0129o n\u0169nd\u0169 no
  ta weene Ngai aian\u0129sya wathani wake \u0129\u0169l\u0169 wa \u0169la \u201c\u0169syao.\u201d
  (Mwa. 3:15) O ta \u0169u, Mose a\u0129 na m\u0169\u0129k\u0129\u0129o na aendeeie
  k\u0169mwenda Yeova n\u0169nd\u0169 \u201cn\u0129wasyaisye \u0129tuvi y\u0129la
  y\u0129kanenganwe.\u201d (Aevl. 11:26) Nait\u0169 no t\u0169mwende Ngai m\u0169nango
  na t\u0169y\u0129th\u0129wa na m\u0169\u0129k\u0129\u0129o m\u0169l\u0169mangu twak\u0169na
  visa ma\u0169nd\u0169 ala wathan\u0129te maian\u0129a. \u0128somo y\u0129la y\u0129at\u0129\u0129e
  n\u0129y\u0129neeneete \u0169nd\u0169 t\u0169tonya k\u0169t\u0169m\u0129a nesa m\u0169th\u0129nz\u0129o
  \u0169su t\u0169nengetwe n\u0129 Ngai.\"", "\"KWASISYA Yosua. Easya: \u2018Sy\u0169a,
  \u0169ngama ki!\u2019 Nayo sy\u0169a ya\u0169ngama ki. Na yekala vau \u0129tun\u0129
  kat\u0129 m\u0169thenya m\u0169ima. Yeova n\u0129we watumie \u0169u w\u0129th\u0129wa.
  \u0128nd\u0129 ekai twone n\u0129k\u0129 Yosua wendaa sy\u0169a y\u0129endee na
  kwaa.\\nY\u0129la asumb\u0129 atano ath\u0169ku ma nth\u0129 ya Kanaani mamb\u0129\u0129ie
  k\u0169kita na Angiveoni, Angiveoni n\u0129mat\u0169mie m\u0169nd\u0169 akamw\u0129te
  Yosua oke amatetheesye. Na m\u0169nd\u0169 \u0169su asya: \u2018Ambata kwit\u0169
  m\u0129t\u0169k\u0129! \u0168t\u0169tang\u0129\u0129e! Asumb\u0129 onthe ma nth\u0129
  y\u0129 i\u0129ma n\u0129mok\u0129te k\u0169kita na ath\u0169kumi maku.\u2019\\nNa
  vate kweteela Yosua na a\u0169me make onthe ma ka\u0169 mathi. Namo maendie na ma\u0169\u0169
  \u0169tuk\u0169 m\u0169ima. Na y\u0129la mavikie Ngiveoni, asikal\u0129 ma asumb\u0129
  asu atano matelema na mamb\u0129\u0129a k\u0169semba mak\u0129\u0129te. Nake Yeova
  \u0129nd\u0129 ausya mbua ya mavia manene kuma \u0129tun\u0129, namo asikal\u0129
  ala makwie n\u0169nd\u0169 wa k\u0169tumbwa n\u0129 mavia asu ma mbua ma\u0129 aing\u0129
  kw\u0129 ala mooaiwe n\u0129 a\u0169me ma ka\u0169 ma Yosua.\\nYosua n\u0129weene
