  \u201cAka ala manya\u0129\u0129kasya \u0169voo n\u0129 nguthu nene.\u201d\u2014Savuli
  68:11.\\nAka ala matw\u2019\u0129k\u0129te ma Ng\u0169s\u0129 maat\u0129\u0129aa
  ngelekany\u2019o ya aka ala mawetetwe Mbivilian\u0129. (Nthimo 31:10-31) O na kau
  ti mo makwat\u0129\u0129aa ma\u0169nd\u0169 k\u0129kundin\u0129, n\u0129matavanasya
  m\u0169no. O na n\u0129mamany\u0129asya syana syoo mw\u0129kal\u0129le \u0169la
  wa\u0129le kwosana na Mbivilia. (Nthimo 1:8) Matataa m\u0169no mat\u0169m\u0129e
  ndeto nzeo na meth\u0129we na mw\u0129kal\u0129le m\u0169seo n\u0129 kana meth\u0129we
  ngelekany\u2019o nzeo kwa and\u0169 ala ang\u0129.\u2014Tito 2:3-5.\"", "\"\u201c[Makwie]
  matosete matho, \u0129nd\u0129 mamonete me k\u0169asa na k\u0169matan\u0129a.\u201d\\n1.
  \u0168tonyi \u0169la tw\u0129 naw\u2019o wa k\u0169k\u0169na visa wa ma\u0169nd\u0169
  t\u0169taaona \u0169t\u0169tethasya ata? (Sisya visa \u0129thang\u0169n\u0129 y\u0129\u0129.)\\nNGAI
  at\u0169nengie m\u0169th\u0129nz\u0129o wa vata m\u0169no \u0129la wat\u0169mbaa.
  M\u0169th\u0129nz\u0129o \u0169su n\u0129 \u0169tonyi wa k\u0169k\u0169na visa k\u0129l\u0129kon\u0129
  \u0169keth\u0129a no ta twene sy\u0129nd\u0169 o na kau t\u0169yaasyona na metho.
  \u0168nd\u0169 \u0169su \u0169tumaa tw\u0129th\u0129wa t\u0169tonya k\u0169vang\u0129\u0129a
  ma\u0169nd\u0169 nesa, na tw\u0129th\u0129wa na mea ma kwona ma\u0169nd\u0169 maseo
  ala me mbee. Yeova mwene n\u0169tonya kwona \u0169nd\u0169 \u0129vinda y\u0169k\u0129te
  y\u0129keth\u0129wa y\u0129ily\u0129, na mavinda maing\u0129 n\u0169t\u0169tavasya
  Maand\u0129kon\u0129 \u0129\u0169l\u0169 wa ma\u0169nd\u0169 mana o na mataa\u0129sa
  kw\u0129k\u0129ka. O na kau ithy\u0129 t\u0169itonya kwona na metho mait\u0169 ma\u0169nd\u0169
  asu makek\u0129ka, n\u0129t\u0169tonya k\u0169k\u0169na visa wamo il\u0129kon\u0129
  sit\u0169. \u0128la twat\u0169m\u0129a \u0169tonyi \u0169su wit\u0169 kwa nz\u0129a
  \u0129su tw\u0129th\u0129awa t\u0169il\u0169l\u0169m\u0129lya m\u0169\u0129k\u0129\u0129o
  wit\u0169.\u20142 Ako. 4:18.\\n2, 3. (a) N\u0129k\u0129 twa\u0129le k\u0169s\u0169an\u0129aa
  \u0129\u0169l\u0169 wa ma\u0169nd\u0169 matonyeka? (b) Tw\u0129s\u0169ng\u0129a
  mak\u0169lyo meva?\\n2 Mavinda ang\u0129 no twamb\u0129\u0129e k\u0169k\u0169na
  visa k\u0129l\u0129kon\u0129 wa k\u0129nd\u0169 o na k\u0129tesa kw\u0129k\u0129ka.
  Kwa ngelekany\u2019o, s\u0169an\u0129a \u0129\u0169l\u0169 wa kamw\u0129l\u0129tu
  ke\u0169k\u0169na visa k\u0129l\u0129kon\u0129 kaku\u0129twe n\u0129 k\u0129mbalutw\u2019a.
  K\u0169u no k\u0169kenga k\u0129l\u0129ko. \u0128nd\u0129 \u0129vinda y\u0129la
  Aana woosie mwanya wa k\u0169s\u0169an\u0129a \u0169nd\u0169 k\u0169keth\u0129wa
  k\u0169ily\u0129 m\u0169thenya \u0169la \u0169katwaa mwanae, Samueli, \u0129eeman\u0129
  ya k\u0169mban\u0129a akam\u0169th\u0169k\u0169mae Ngai, ndeekaa k\u0169kenga k\u0129l\u0129ko
  kyake. Ndakengaa k\u0129l\u0129ko kyake n\u0169nd\u0169 \u0169su n\u0129 \u0169nd\u0169
  watw\u2019\u0129te kw\u0129ka, na k\u0169k\u0169na visa \u0129\u0169l\u0169 wa m\u0169thenya
  \u0169su n\u0129kwam\u0169tetheeisye al\u0169many\u2019e na \u0169twi wake. (1 Sam.
  1:22) O ta \u0169u, \u0129la twak\u0169na visa wa k\u0129la Ngai \u0169twath\u0129te
  kw\u0129ka, tw\u0129th\u0129awa t\u0169is\u0169an\u0129a \u0129\u0169l\u0169 wa
  ma\u0169nd\u0169 matat\u0129a kw\u0129k\u0129ka.\u20142 Vet. 1:19-21.\\n3 Vate nzika,
  and\u0169 aing\u0129 a\u0129k\u0129\u0129ku ala mawetetwe Mbivilian\u0129 n\u0129mak\u0169naa
  visa il\u0129kon\u0129 syoo \u0129\u0169l\u0169 wa ma\u0169nd\u0169 ala Ngai wamath\u0129te.
  Kw\u0129ka \u0169u kwamatethasya ata? Na t\u0169tonya k\u0169tetheka ata twoosa
  \u0129vinda ya k\u0169s\u0169an\u0129a \u0129\u0169l\u0169 wa ma\u0169nd\u0169 maseo
  ala Ngai wath\u0129te ala mamw\u0129w\u2019aa?\\nN\u0128MEEK\u0128IWE VINYA N\u0128
  KW\u0128KALA MENE K\u0128LA MATH\u0128TWE\\n4. N\u0129 kya\u0169 kyatumaa Aveli
  eth\u0129wa atonya k\u0169k\u0169na visa k\u0129l\u0129kon\u0129 \u0129\u0169l\u0169
  wa \u0129vinda y\u0129la ya\u0129 mbee?\\n4 Aveli n\u0129we wa\u0129 m\u0169nd\u0169
  wa mbee kw\u0129th\u0129wa e m\u0169\u0129k\u0129\u0129ku. We n\u0129w\u0129th\u0129wa
  ekalaa ene \u0169nd\u0169 o na \u0169mwe kat\u0129 wa ma\u0169nd\u0169 ala Yeova
  wathan\u0129te? T\u0169itonya kwasya kana Aveli n\u0129wees\u0129 nesa vy\u0169
  \u0169nd\u0169 watho \u0169la Ngai waumisye \u0129\u0169l\u0169 wa \u0129la nzoka
  \u0169kean\u0129a. Ngai athanie at\u0129\u0129: \u201cNgeek\u0129a \u0169maitha
  kat\u0129 wenyu we na m\u0169nd\u0169 m\u0169ka, na kat\u0129 wa \u0169syao waku
  na \u0169syao wake: Akatumba m\u0169twe waku, naku \u0169katumba k\u0129tiinyo kyake.\u201d
  (Mwa. 3:14, 15) \u0128nd\u0129 n\u0129vatonyeka \u0169keth\u0129a Aveli n\u0129wavind\u0129\u0129sye
  m\u0169no watho \u0169su, na akwatya kana ve m\u0169nd\u0169 \u2018\u0169katumbwa
  k\u0129tiinyo\u2019 n\u0129 kana and\u0169 makaa\u0129sa k\u0169vetewa na\u0129,
  na may\u0129kala o tond\u0169 Atamu na Eva maily\u0129 matanamba k\u0169v\u0129tya.
  O na Aveli aketh\u0129wa ak\u0169naa visa \u0169ily\u0129 ata \u0129\u0169l\u0169
  wa \u0129vinda y\u0129la ya\u0129 mbee wake, a\u0129 na m\u0169\u0129k\u0129\u0129o
  \u0169su n\u0169nd\u0169 wa watho \u0169la Yeova waum\u0129tye na n\u0129kyo k\u0129tumi
  Yeova weet\u0129k\u0129lile nthembo yake.\u2014Soma Mwamb\u0129l\u0129lyo 4:3-5;
  Aevelania 11:4.\\n5. Enoko atonya kw\u0129th\u0129wa atethekaa ata n\u0169nd\u0169
  wa kw\u0129kalaa aik\u0169na visa k\u0129l\u0129kon\u0129 \u0129\u0169l\u0169 wa
  \u0129vinda y\u0129la ya\u0129 mbee?\\n5 M\u0169nd\u0169 \u0169ng\u0129 m\u0169\u0129k\u0129\u0129ku
  a\u0129 Enoko, o na kau at\u0169aa na and\u0169 matam\u0169k\u0129aa Ngai na maneeneaa
  \u0169 Ngai ndeto nth\u0169ku. Yeova n\u0129wam\u0169veveee Enoko athana kana akatheea
  \u201cvamwe na atheu make, nguthu \u0129tatal\u0129ka, k\u0169masil\u0129la and\u0169
  onthe, na k\u0169ma\u0129k\u0129\u0129thya onthe ala matam\u0169k\u0129aa Ngai \u0169nd\u0169
  wa meko moo onthe ma k\u0169lea k\u0169m\u0169k\u0129aa Ngai ala meekie, na n\u0169nd\u0169
  wa ndeto syoo syonthe ny\u0169m\u0169 ila asu athe matam\u0169k\u0129aa Ngai mam\u0169neeneete.\u201d
  (Yuta 14, 15) N\u0169nd\u0169 Enoko a\u0129 na m\u0169\u0129k\u0129\u0129o, a\u0129
  atonya k\u0169k\u0169naa visa wa \u0169nd\u0169 nth\u0129 \u0129tonya kw\u0129th\u0129wa
  \u0129ily\u0129 \u0129te na and\u0169 matam\u0169k\u0129aa Ngai.\u2014Soma Aevelania
  11:5, 6.\\n6. N\u0129 \u0169nd\u0169 w\u0129va Noa w\u0129th\u0129wa aendeeie k\u0169s\u0169an\u0129a
  \u0129tina wa \u0129la mbua ya \u0129vinda yake?\\n6 O nake Noa a\u0129 na m\u0169\u0129k\u0129\u0129o
  na n\u0129kyo k\u0129tumi \u0169taanangwa na \u0129la mbua ya \u0129vinda yake.
  (Aevl. 11:7) Mbua \u0129su yathela, m\u0169\u0129k\u0129\u0129o \u0169su now\u2019o
  watumie aumya nthembo sya nyam\u0169. (Mwa. 8:20) O ta Aveli, vate nzika Noa a\u0129
  na m\u0169\u0129k\u0129\u0129o wa kana \u0129vinda y\u0129mwe and\u0169 makathaw\u2019a
  maume \u0169kombon\u0129 wa na\u0129 na k\u0129kw\u2019\u0169. Noa ndaaeka kw\u0129th\u0129wa
  na m\u0169\u0129k\u0129\u0129o na w\u0129kwatyo \u0169su o na \u0129la myaka yav\u0129tie
  na esa kw\u0129th\u0129wa n\u0129 y\u0129la \u0129vinda \u0129th\u0169ku Nimiloti
  wamb\u0129\u0129e k\u0169v\u0129nd\u0169a and\u0169 maleane na Yeova. (Mwa. 10:8-12)
  N\u0129 \u0169nd\u0169 \u0169tonyeka \u0169keth\u0129a n\u0129week\u0129awa vinya
  m\u0169no n\u0129 k\u0169s\u0169an\u0129a \u0129vinda y\u0129la mbaa and\u0169 makavetewa
  asumb\u0129ki ath\u0169ku vamwe na na\u0129 na k\u0129kw\u2019\u0169. O nait\u0169
  no tw\u0129kale twene \u0129vinda y\u0129u \u0129seo y\u0129 mbee wit\u0169. Y\u0129i
  vaasa!\u2014Alo. 6:23.\\nNO TA MEENE MA\u0168ND\u0168 ALA MATH\u0128TWE MAIAN\u0128A\\n7.
  N\u0129 ma\u0169nd\u0169 meva ma\u0129 mbee ala Avalaamu, Isaka, na Yakovo mekalaa
  mene?\\n7 Avalaamu, Isaka, na Yakovo n\u0129matonya kw\u0129th\u0129wa mak\u0169naa
  visa il\u0129kon\u0129 syoo makona \u0129vinda \u0129seo mbee woo n\u0169nd\u0169
  Ngai n\u0129wamath\u0129te kana kw\u0129s\u0129la \u0169syao woo, mba\u0129 syonthe
  ikaathim\u0129ka. (Mwa. 22:18; 26:4; 28:14) Math\u0129twe kana \u0169syao woo \u0169kaing\u0129va
  na \u0169it\u0169a \u0129la Nth\u0129 ya Watho Ngai \u0169ka\u0169nenga. (Mwa. 15:5-7)
  N\u0169nd\u0169 wa m\u0169\u0129k\u0129\u0129o woo, no ta meene \u0169syao woo \u0169tw\u0129e
  nth\u0129 \u0129su math\u0129twe. K\u0169vika o na \u0169m\u0169nth\u0129 kuma \u0129la
  and\u0169 malikile na\u0129n\u0129, Yeova ekalaa ay\u0129\u0129k\u0129\u0129thya
  ath\u0169k\u0169mi make ala a\u0129k\u0129\u0129ku kana moathimo ala maaiw\u2019e
  n\u0129 Atamu mayaaa tene na tene.\\n8. N\u0129 kya\u0169 kyatetheeasya Avalaamu
  eth\u0129we na m\u0169\u0129k\u0129\u0129o m\u0169l\u0169mu?\\n8 N\u0129vatonyeka
  \u0169keth\u0129a Avalaamu eekaa ma\u0169nd\u0169 manene ma m\u0169\u0129k\u0129\u0129o
  n\u0169nd\u0169 n\u0129wak\u0169naa visa wa ma\u0169nd\u0169 ala Ngai wathan\u0129te.
  Maand\u0129ko n\u0129mawetete kana o na kau Avalaamu na and\u0169 ang\u0129 mam\u0169th\u0169k\u0169m\u0129te
  Ngai me a\u0129k\u0129\u0129ku makwie \u201cmatosete matho,\u201d \u0129la ma\u0129
  thay\u0169 \u201cmamonete me k\u0169asa na k\u0169matan\u0129a.\u201d (Soma Aevelania
  11:8-13.) Ve ma\u0169nd\u0169 maing\u0129 m\u0169no matumaa Avalaamu a\u0129k\u0129\u0129a
  kana ma\u0169nd\u0169 ala weeteele maya\u0129 maema k\u0169ka nginya \u0169keth\u0129a
  we no ta wamene o na k\u0169tw\u2019\u0129ka nda\u0129 aamavakya itho.\\n9. Avalaamu
  atethekie ata n\u0169nd\u0169 wa k\u0169\u0129k\u0129\u0129a mawatho ma Ngai?\\n9
  N\u0169nd\u0169 Avalaamu n\u0129wa\u0129k\u0129\u0129e mawatho onthe ma Ngai, a\u0129
  na vinya wa kw\u0129ka \u0169nd\u0169 w\u2019onthe \u0169la Ngai wam\u0169k\u0169lasya
  eke. N\u0129kyo k\u0129tumi weet\u0129k\u0129lile k\u0169tia nd\u0169a ya Ulu na
  alea vy\u0169 kwaka m\u0169sy\u0129 nd\u0169an\u0129 ila sya\u0129 Kanaani. O ta
  nd\u0169a ya Ulu, nd\u0169a isu sya Kanaani iya\u0129 sy\u0129sa kw\u0129kala tene
  na tene n\u0169nd\u0169 ala maisumb\u0129k\u0129te mayam\u0169thaithaa Yeova. (Yos.
  24:2) Myaka yonthe \u0129la Avalaamu wekalile e thay\u0169 kuma auma Ulu, \u201cn\u0129weteelaa
  onw\u2019e nd\u0169a \u0129la y\u0129 na myamb\u0129l\u0129lyo, na mwamb\u0129l\u0129lya
  na mwaki wayo n\u0129 Ngai.\u201d (Aevl. 11:10) Avalaamu n\u0129wak\u0169naa visa
  akona atw\u0129e k\u0169nd\u0169 k\u0169takanangwa k\u0169sumb\u0129k\u0129twe n\u0129
  Yeova. Aveli, Enoko, Noa, vamwe na Avalaamu na and\u0169 ang\u0129 tamo maya\u0129
  na nzika kana akw\u2019\u0169 makathay\u0169\u0169kw\u2019a, na n\u0129meeteele
  m\u0169no kw\u0129sa kw\u0129kala k\u0169\u0169 nth\u0129 masumb\u0129k\u0129twe
  n\u0129 \u0168sumb\u0129 wa Ngai. \u0168sumb\u0129 \u0169su n\u0129w\u2019o \u201cnd\u0169a
  \u0129la y\u0129 na myamb\u0129l\u0129lyo.\u201d K\u0169vind\u0129\u0129sya moathimo
  ta asu n\u0129kwatumie mam\u0169\u0129k\u0129\u0129a Yeova m\u0169nango.\u2014Soma
  Aevelania 11:15, 16.\\n10. W\u0129kwatyo \u0169la Sala wa\u0129 naw\u2019o wam\u0169tethisye
  ata?\\n10 Kwas\u0169an\u0129a \u0129\u0169l\u0169 wa m\u0169ka wa Avalaamu, \u0169la
  weetawa Sala. O na kau aivikya myaka 90 nda\u0129 aasyaa, w\u0129kwatyo \u0169la
  wa\u0129 naw\u2019o n\u0129watumaa eth\u0129wa na m\u0169\u0129k\u0129\u0129o kana
  no \u0169kasyaa. \u0168u no \u0169nd\u0169 \u0169mwe na kwasya kana n\u0129wak\u0169naa
  visa akona Yeova aathim\u0129te syana syake o tond\u0169 wathan\u0129te. (Aevl.
  11:11, 12) N\u0129 kya\u0169 kyatumaa eth\u0129wa na w\u0129kwatyo \u0169su? Yeova
  ath\u0129te m\u0169\u0169me at\u0129\u0129: \u201cNgam\u0169athima, na \u0129ng\u0129
  ngak\u0169nenga mwana kuma kwake: \u0129\u0129, ngam\u0169athima, nake akeeth\u0129wa
  inyia wa mba\u0129; asumb\u0129 ma and\u0169 makauma kwake.\u201d (Mwa. 17:16) Kwoou
  \u0129la Sala wasyaie Isaka, a\u0129 atonya k\u0169k\u0169na visa ate na nzika akona
  moathimo ala ang\u0129 Ngai wath\u0129te Avalaamu maian\u0129a. O nait\u0169 tw\u0129
  na \u0169tonyi ta \u0169su wa k\u0169k\u0169na visa k\u0129l\u0129kon\u0129 t\u0169kona
  ma\u0169nd\u0169 ala Ngai \u0169twath\u0129te. Ma\u0169nd\u0169 asu maikalea kw\u0129an\u0129a!\\nN\u0128WASYA\u0128\u0128SYE
  \u0128TUVI Y\u0128LA Y\u0128KANENGANWE\\n11, 12. N\u0129 kya\u0169 kyatetheeisye
  Mose amwende Yeova?\\n11 M\u0169nd\u0169 \u0169ng\u0129 wam\u0169\u0129k\u0129\u0129e
  Yeova n\u0129 Mose, na n\u0129wamwendete m\u0169no. \u0128nd\u0129 e m\u0169nini
  ekalaa Misili kwa Valao, na n\u0169nd\u0169 wa \u0169u ya\u0129 laisi m\u0169no
  akakwatwa n\u0129 wendi wa mal\u0129 na monene. \u0168seo n\u0129 kana atanamba
  k\u0169thi kwa Valao, asyai make n\u0129mam\u0169many\u0129\u0129tye \u0129\u0169l\u0169
  wa Yeova na k\u0129eleelo kyake kya kumya Aevelania \u0169kombon\u0129 na k\u0169manenga
  \u0129la Nth\u0129 ya Watho. (Mwa. 13:14, 15; Kuma 2:5-10) Eth\u0129wa Mose n\u0129wakothaa
  k\u0169s\u0169an\u0129a \u0129\u0169l\u0169 wa moathimo ala Ngai wath\u0129te and\u0169
  make, we w\u0129ona n\u0129 kya\u0169 wesaa kwenda ngoon\u0129 yake? N\u0129 monene-\u0129,
  kana n\u0129 Yeova?\\n12 Maand\u0129ko matw\u0129\u0129te \u0169\u0169: \u201cKwond\u0169
  wa m\u0169\u0129k\u0129\u0129o Mose, y\u0129la wa\u0129 aneana, n\u0129waleile kw\u0129twa
  mwana wa mw\u0129\u0129tu wa Valao; ak\u0129nyuva kavaa k\u0169th\u0129nw\u2019a
  vamwe na and\u0169 ma Ngai, kw\u0129 k\u0169tana ma\u0169nd\u0169n\u0129 ma na\u0129
  \u0129vinda; aitala k\u0169v\u0169thw\u2019a kwa Kl\u0129sto n\u0129 \u0169thwii
  mwing\u0129 k\u0169v\u0129ta \u0169thwii wa Misili, n\u0169nd\u0169 n\u0129wasyaisye
  \u0129tuvi y\u0129la y\u0129kanenganwe.\u201d\u2014Aevl. 11:24-26.\\n13. Mose atethekie
  ata n\u0169nd\u0169 wa k\u0169vind\u0129\u0129sya m\u0169no \u0129\u0169l\u0169
  wa k\u0129la Ngai wathan\u0129te?\\n13 O \u0169nd\u0169 Mose wat\u0169m\u0129ie
  \u0129vinda y\u0129ana aivind\u0129\u0129sya m\u0169no k\u0129la Yeova wath\u0129te
  Aisilaeli, now\u2019o wam\u0169\u0129k\u0129\u0129e m\u0169nango na amwenda m\u0169nango.
  Mose n\u0169tonya kw\u0129th\u0129wa ak\u0169naa visa \u0129\u0169l\u0169 wa \u0129vinda
  y\u0129la Yeova \u0169kaumya and\u0169 \u0169kombon\u0129 wa k\u0129kw\u2019\u0169,
  o tond\u0169 athaithi ala ang\u0129 ma Ngai meekaa. (Yovu 14:14, 15; Aevl. 11:17-19)
  K\u0129u n\u0129kyatumie amanya \u0169nd\u0169 Ngai weew\u2019\u0129aa tei Aevelania
  vamwe na and\u0169 ala ang\u0129 onthe, na n\u0169nd\u0169 wa \u0169u n\u0129wamwendie
  m\u0169nango. K\u0169mwenda Ngai na k\u0169m\u0169\u0129k\u0129\u0129a n\u0129kw\u2019o
  kwamw\u0129k\u0129ie vinya \u0129vinda yonthe y\u0129la wa\u0129 thay\u0169. (K\u0169t.
  6:4, 5) O na \u0129la Valao wamw\u0129ie a\u0169ngama mbee wake n\u0169k\u0169awa,
  m\u0169\u0129k\u0129\u0129o \u0169la wa\u0129 naw\u2019o na \u0169nd\u0169 wamwendete
  Ngai n\u0129syatumie eth\u0129wa na \u0169k\u0169mba\u0169. O na no kw\u0129th\u0129wa
  visa \u0169la wak\u0169naa k\u0129l\u0129kon\u0129 wa \u0129vinda \u0129seo y\u0129la
  ya\u0129 mbee wake wam\u0169tetheeisye kw\u0129th\u0129wa na \u0169k\u0169mba\u0169
  \u0169su.\u2014Kuma 10:28, 29.\\nVIND\u0128\u0128SYA MA\u0168ND\u0168 ALA \u0168SUMB\u0128
  WA NGAI \u0168KEAN\u0128SYA\\n14. N\u0129 mos\u0169an\u0129o meva m\u0169nd\u0169
  \u0169tonya kw\u0129kenga k\u0129l\u0129ko namo?\\n14 And\u0169 aing\u0129 \u0169m\u0169nth\u0129
  makengaa il\u0129ko syoo kwa k\u0169k\u0169na visa \u0129\u0169l\u0169 wa ma\u0169nd\u0169
  matakesa kw\u0129k\u0129ka. Kwa ngelekany\u2019o, o na kau \u0169m\u0169nth\u0129
  myaka yit\u0169 yus\u0129e \u201cth\u0129na na k\u0129\u0129o,\u201d and\u0169 amwe
  maotaa matw\u2019\u0129k\u0129te athwii m\u0169no na mate na th\u0129na o na \u0169mwe,
  o na k\u0169tw\u2019\u0129ka oyu mai na sy\u0129nd\u0169 mbing\u0129 sya k\u0129-mw\u0129\u0129.
  (Sav. 90:10, The Holy Bible in Current Kikamba Language) O na kau Mbivilia ya\u0129tye
  kana vai k\u0129nd\u0169 k\u0129ng\u0129 k\u0129katethya and\u0169 eka \u0168sumb\u0129
  wa Ngai, and\u0169 ma \u0169ko \u0169su mak\u0169naa visa masumb\u0129k\u0129twe
  n\u0129 silikal\u0129 ya m\u0169nd\u0169 k\u0169te th\u0129na o na \u0169mwe. (Nda.
  2:44) Monaa Ngai ndakaa\u0129sa kwananga nth\u0129 \u0129no nth\u0169ku. \u0128nd\u0129
  k\u0129la Mbivilia \u0129many\u0129asya k\u0129 k\u0129vath\u0169kany\u2019o vy\u0169
  na kyu ma\u0129k\u0129\u0129aa. (Nzev. 1:18; 1 Yoa. 2:15-17) W\u0129kwatyo ta \u0169su
  wa and\u0169 asu mav\u0169thasya k\u0129eleelo kya Yeova no wa mana n\u0169nd\u0169
  meth\u0129awa maikenga il\u0129ko syoo.\\n15. (a) N\u0129 \u0169tethyo mwa\u0169
  Akl\u0129sto makwataa \u0129la mak\u0169na visa \u0129\u0169l\u0169 wa m\u0169thenya
  \u0169la w\u0129kwatyo woo \u0169kean\u0129a? (b) N\u0129 \u0169nd\u0169 w\u0129va
  we weteele m\u0169no kwona \u0169ian\u0129a?\\n15 K\u0129vath\u0169kany\u2019o na
  and\u0169 asu, Akl\u0129sto n\u0129mew\u2019aa makwata vinya \u0129la mak\u0169na
  visa wa m\u0169thenya \u0169la w\u0129kwatyo woo \u0169kean\u0129w\u2019a, w\u0129th\u0129we
