  at\u0129\u0129: \u201cSisya, ithy\u0129 n\u0129t\u0169ti\u0129te syonthe na twak\u0169at\u0129\u0129a;
  t\u0169kosa kya\u0169 \u0129nd\u0129?\u201d N\u0129 kana Yes\u0169 atetheesye Vetelo
