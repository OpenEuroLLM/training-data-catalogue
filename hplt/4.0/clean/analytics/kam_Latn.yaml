  m\u0169ongo na amb\u0129a, \u201cEth\u0129wa w\u0129 m\u0169nd\u0169\u0169me \u0129tetee!\u201d
  Saan\u0129 \u0169su n\u0129navoyie o mboya nguv\u0129, na nam\u0169k\u0169lya Yeova
