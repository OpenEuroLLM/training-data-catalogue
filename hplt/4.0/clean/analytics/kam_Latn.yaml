  Na \u0129nd\u0129 m\u0169la\u0129ka wa Ngai av\u0129t\u0129la \u0129\u0169l\u0169
  wa nth\u0129 ya Misili. M\u0169la\u0129ka oona nthakame \u0129su, ndoaa m\u0169nd\u0169
  o na \u0169mwe ny\u0169mban\u0129 \u0129su. \u0128nd\u0129 ny\u0169mba syonthe ila
  ita\u0129 na nthakame m\u0129t\u0129n\u0129 \u0129l\u0129 \u0129la y\u0129 ndee
  sya m\u0129omo, m\u0169la\u0129ka wa Ngai n\u0129woaa makithathi na nyam\u0169 ila
  syasya\u0129twe mbee. \u0168su n\u0129w\u2019o wa\u0129 \u0169th\u0129ny\u2019o
  wa 10.\\n\u0128tina wa \u0169th\u0129ny\u2019o \u0169su wa m\u0169thya, Valao eea
  Aisilaeli mathi. And\u0169 ma Ngai onthe n\u0129meey\u0169mban\u0129tye k\u0169thi,
  na o \u0169tuk\u0169 \u0169su mamb\u0129\u0129a kyalo kyoo kya kuma Misili.\\nKuma
