sample: '["\"NZIA YA UTANGIIO \\\"Kila Uandiko niwaveveewe ni Ngai\\\" Ndeto ya Ngai
  i thayu, na ni nthangaau, na ni mbui km uvyu ula mui ngali syeli. Aevelania 4:12.
  Ndeto yakma ikeethiwa iilyi ta uu ila yumaa kanyw''ani wakwa: ndikanzyokea mana,
  indi ikeanisya undu nendete, nayo ikaaila, unduni ula namitumie. Isaia 55:11. Uvuan''yo
  wa ndeto syaku nuetae kyeni. Savuli 119:130. Kutw''ikithw''a kwa nthi Mwambililyoni
  Ngai niwatw''ikithisye matu na nthi. Na Ngai oona kila kindu wombie, na, sisya,
  kyai kiseo muno. Mwambililyo 1:1, 31 Syindu syonthe nisyatw''ikithiw''e niwe; na
  ate vo vati kindu o na kimwe kyaatw''ikithw''a kati wa ila syatw''ikithiw''e. Yoana
  1:3 Kutw''ikithw''a kwa mundu Na Ngai atw''ikithya mundu na muvw''ano wake, na muvw''ano
  wa Ngai amutw''ikithya; muume na muka amatw''ikithya. Na Ngai amaathima. Mwambililyo
  1: 27, 28 Na Yeova Ngai oomba mundu na kitoo kya nthi, na amuvevea mithumu ya thayu
  manyiuuni make; na mundu atw''ika kyuu ki thayu. Na Yeova Ngai avanda muunda ngaliko
  ya wumiloni wa syua, nthini wa Eteni; na nikw''o wamwiie mundu ula wombie. Mwambililyo
  2:7, 8 Na Yeova Ngai oosa mundu, na amwia muundani wa Eteni oseuvasye na kusuviaa.
  Na Yeova Ngai amwiaia mundu, akimwia, Wa kila muti wa muundani nutonya uya o undu
  ukwenda: indi wa muti wa kumanyithya useo na uthuku, ndukaye: nikwithiwa muthenya
  ula ukaya waw''o ndukatia ukw''a. Mwambililyo 2:15-17 Undu nai yookie Na indi nzoka
  yai nzeleke muno kwi nyamu o na yiva ya kithekani ila Yeova Ngai wombie. Na yamwia
  mundu muka atii, Ni w''o, Ngai niwaisye, Mutikaye ma miti yonthe ya muundani ? Na
  indi mundu muka eea nzoka, Mosyao ma miti ya muundani nitutonya uya: indi usyao
  wa muti ula wi kati wa muunda, Ngai niwaisye, Muikaye waw''o, o na muikakiite, muikese
  ukw''a. Na nzoka yamwia mundu muka, Muikakw''a nongi: nundu Ngai niwisi kana muthenya;
  ula mukaya waw''o, nivo mukasalukw''a metho, nenyu mukeethiwa ta Ngai, mukimanya
  useo na uthuku. Na yila mundu muka wonie kana muti ni museo wa uya, na ni wa kwendeesya
  methoni, na ni muti wa kwendwa kwa kuivya mundu, atw''a usyao waw''o na, aya; na
  ingi anenga muume, nake aya. Mwambililyo 3:1-6 Na Yeova Ngai eeta u mundu muume,
  amukulya . . . Nuite wa muti, ula nakwiaie ndukaye? Na mundu muume asungia, Mundu
  muka ula wanengie ethiwe nakwa, niwe unengie wa muti, na naya. Na Yeova Ngai akulya
  mundu muka, undu uu wikie nata ? Na mundu muka asungia, Nzoka ningengie, na naya.
  Na Yeova Ngai eea nzoka, Nundu niwikie uu, nuumaniwe, we, kwi indo syonthe, na kwi
  nyamu syonthe sya kithekani; ukaendaa na ivu, na ukaisaa kitoo mithenya yonthe ya
  thayu waku: na ngeekia umaitha kati wenyu we na mundu muka, na kati wa usyao waku
  na usyao wake: akatumba mutwe waku, naku ukatumba kitiinyo kyake. Amwia mundu muka,
  Ngaingivya muno woo waku wa kusyaa; wooni ukasyaa syana; na kwenda kwaku kukeethiwa
  kwa muemeu, nake akasumbika iulu waku. Na amwia Atamu, Nundu niweethukiisye wasya
  wa mukau, na ingi waya wa muti, ula nakwiaie, ngikwia, Ndukaaye waw''o: nthi niumaniwe
  nundu waku; ukaisaa wayo wooni matuku onthe ma thayu waku; miw''a nayo na thangila
  ikakumeesya; naku ukaisaa nyunyi sya muundani; yuutiani ya uthyu waku ukaisaa liu,
  kuvika yila ukasyoka muthangani; nundu nivo waumiw''e: nundu wi kitoo, na nukasyoka
  kitooni. Mwambililyo 3:9, 11-19 Na mukunga usu munene naw''o ni nzoka ila nguu,
  yitawa Ndevili, na ingi Satani, mukengani wa nthi yonthe. Uvuan''yo 12:9 Kwondu
  wa uu, nundu wa mundu umwe nai yalikile kuu nthi, na kikw''u kwondu wa nai; na kwa
  uu kikw''u kyavikia andu onthe, nikwithiwa onthe nimeekie nai. Alomi 5:12 Undu Ngai
  wonaa uthuku wa andu Ithyonthe ta malondu nitwaaite; nitweethyuuie kila umwe na
  kuatiia nzia yake mwene. Isaia 53:6 Yeova asyaiisye ana ma andu e ituni, Asisye
  ethiwa ve umwe ula wi na umanyi, Ula umumanthaa Ngai. Onthe nimathukite utee; onthe
  vamwe nimatw''ikite avuku; Vai umwe wikaa nesa, aiee, o na umwe. Savuli 14:2,3 0
  tondu kuandikitwe, Kui mulungalu, aiee, o na umwe. . . . Na nzia ya muuo matyaamimanya:
  Kumukia Ngai kui methoni moo. . . . Nundu onthe nimeekie nai, na maivikiaa utaio
  wa Ngai. Alomi 3 :10, 17, 18, 23 Indi mothuku menyu nimamutaanitye inyw''i na Ngai
  wenyu, na nai syenyu nivithite uthyu wake kwenyu. Isaia 59:2 Wendo wa Ngai kwa andu
  Nundu Ngai niwendete nthi, niwanenganie Mwana wake e umwe, ni kana o ula umwitikilaa
  ndakae, indi ethiwe na thayu utathela. Yoana 3:16 Akimuvoya Ngai Yesu aisye: Na
  thayu utathela niw''o uu, ni kana makumanye we Ngai ula wa w''o weka, na ula wamutumie,
  nake ni Yesu Klisto. Yoana 17 :3 Unduni uu wendo wa Ngai niwonanitw''e kwitu, nundu
  Ngai niwamutumie Mwana wake kuu nthi, ula wasyaiwe e umwe, ni kana twithiwe na thayu
  kwondu wake. Uu niw''o wendo, ti ithyi twamwendie Ngai, indi niwe watwendie ithyi,
  na atuma Mwana wake ethiwe nthembo ya wiw''anithyo kwondu wa nai situ. 1 Yoana 4:9,
  10 Kuka kwa Mwana wa Ngai kuu nthi Indi wianiu wa ivinda wooka, Ngai atuma Mwana
  wake. Akalatia 4:4 Ni ndeto ya kuikiiwa, na niyailwe ni kwitikilwa ni andu onthe,
  kana Klisto Yesu ookie kuu nthi kumatangiia andu athe. 1 Timotheo 1:15 Ai kuu nthi,
  na i nthi yatw''ikithiw''e niwe, na nthi ndiamwisi. Yoana 1:10 Kusyawa kwa Mwiaii
  Yesu Na kusyawa kwa Yesu Klisto kwailyi uu: Yila Meli inyia wake wevaitw''e ni Yosevu,
  matambite kutwaana, ooneka e na ivu ya Veva Mutheu. Na uu w''onthe utw''ikite, ni
  kana wianiw''e ula waneeniwe ni Mwiaii na kanyw''a wa mwathani, akyasya, Sisya,
  mwiitu akethiwa e ivu, na akasyaa kavisi, Nako syitwa yako makaketa Imanueli; na
  ualyulo wayo ni, Ngai vamwe naitu. Mathayo 1 :18, 22,23 Naku ukaketa syitwa yako
  YESU (Mutangiii); nundu mwe ukatangiia andu make kuma naini syoo. Mathayo 1:21 Mwiaii
  Yesu kuu nthi Uvoo wa Yesu wa Nasaleti, o undu Ngai wamwitikisye Veva Mutheu, o
