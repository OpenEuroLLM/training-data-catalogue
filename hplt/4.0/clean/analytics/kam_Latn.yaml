  \u0168nd\u0169 \u0169la wanzeng\u2019isye n\u0129 kana k\u0129mwana k\u0129u kyookie
  vala n\u0129\u0129 na kyamb\u0129a at\u0129\u0129: \u201cMwa ndekea n\u0169nd\u0169
  wa ma\u0169nd\u0169 ala mek\u0129kie \u0129yoo w\u0129oo. No nende ngeth\u0129wa
  n\u0129ily\u0129 taku. N\u0129enda kw\u0129many\u0129sya Mbivilia.\u201d Natanie
  m\u0169no n\u0169nd\u0169 n\u0129nesi\u0129\u0129ie ndikeke \u0169nd\u0169 \u0169ta\u0129le!
  Na n\u0169nd\u0169 wa \u0169u, n\u0129twamb\u0129\u0129ie kw\u0129many\u0129sya
  Mbivilia n\u0129 na mwanake \u0169su.\\n\u0128nd\u0129 \u0169nd\u0169 wa k\u0169makya
  n\u0129 kana \u0129vindan\u0129 y\u0129u tweemany\u0129asya, and\u0169 ala ang\u0129
  ma m\u0169sy\u0129 n\u0129maemiwe n\u0129 k\u0169endeea kw\u0129many\u0129sya Mbivilia.
  \u0128nd\u0129 n\u0129navangie kana ndi\u0129t\u0129k\u0129la k\u0129nd\u0169 o
  na k\u0129mwe k\u0129nzi\u0129\u0129e kw\u0129many\u0129sya Mbivilia. N\u0129nees\u0129
  kana naendeea kw\u0129th\u0129wa na ngwatan\u0129o na and\u0169 ma Ngai, ngeeth\u0129wa
  n\u0129 m\u0169tanu na ndy\u0129th\u0129wa na ana-a-asa na e\u0129tu-a-asa manth\u0129n\u0129k\u0129aa.
  N\u0129naendeeie kw\u0129ka maendeeo ma k\u0129-veva, na mwakan\u0129 wa 1991, navatiswa
  na neeth\u0129wa n\u0129 Ng\u0169s\u0129 ya Yeova.\\nMOATHIMO ALA N\u0128KWAT\u0128TE:\\nMbeen\u0129,
  n\u0129new\u2019aa woo, n\u0129nendete k\u0169sumb\u0129ka and\u0169, na na\u0129
  m\u0169ng\u2019endu. \u0128nd\u0129 ndeto ya Ngai n\u0129aly\u0169l\u0129te mw\u0129kal\u0129le
  wakwa vy\u0169. Yu n\u0129n\u0129tavasya and\u0169 ala mekwendeew\u2019a \u0169voo
  m\u0169seo wa m\u0169uo \u0169la w\u0129 Mbivilian\u0129. O na n\u0129n\u0129th\u0129\u0129twe
  \u0169th\u0169k\u0169min\u0129 wa \u0129vinda yonthe kwa myaka 23 m\u0129v\u0129tu.\\nVe
  \u0129vinda neeyumisye ngatetheesye w\u0129a ovisin\u0129 wa \u0169vonge wa Ng\u0169s\u0129
  sya Yeova \u0169la w\u0129 Mexico. N\u0129 ovisin\u0129 \u0169su, n\u0129nakomanie
  na m\u0169nd\u0169 m\u0169ka mwanake w\u0129tawa Claudia, na twatwaana mwaka wa
  1999. N\u0129n\u0129m\u0169t\u0169ng\u0129aa Yeova m\u0169vea n\u0169nd\u0169 wa
  k\u0169ngathima na k\u0129veti k\u0129seo na k\u0129\u0129k\u0129\u0129ku!\\nN\u0129twaendie
  k\u0129kundin\u0129 kya k\u0129thyomo kya ala matew\u2019aa kya nth\u0129 ya Mexico
  k\u0169tetheesya and\u0169 memany\u0129sye \u0129\u0169l\u0169 wa Yeova. \u0128tina
  wa \u0129vinda n\u0129tweeiwe t\u0169tham\u0129\u0129e nth\u0129 ya Belize t\u0169kamany\u0129sye
  and\u0169 Mbivilia. O na kau t\u0169y\u0129th\u0129awa na sy\u0129nd\u0169 mbing\u0129
  sya k\u0129-mw\u0129\u0129, n\u0129tw\u0129th\u0129awa na kyonthe k\u0129la twendaa
  n\u0129 kana tw\u0129th\u0129we tw\u0129 atanu. Vai k\u0129nd\u0169 k\u0129tonya
  k\u0169tuma t\u0169eka k\u0169m\u0169th\u0169k\u0169ma Yeova.\\nInyia wakwa n\u0129wesie
  kwamb\u0129\u0129a kw\u0129many\u0129sya Mbivilia \u0129ng\u0129 na avatiswa. O
  na m\u0169k\u0169\u0169a na k\u0129veti kyake na syana syoo yu n\u0129 Ng\u0169s\u0129
  sya Yeova. O na ve anyanyawa amwe natavasya \u0169voo m\u0169seo matw\u2019\u0129kie
  ath\u0169k\u0169mi ma Yeova.\\n\u0168nd\u0169 wa k\u0169makya n\u0129 kana, and\u0169
  amwe ma m\u0169sy\u0129 n\u0129makwie n\u0169nd\u0169 mayaa\u0129t\u0129k\u0129la
  k\u0169aly\u0169la mw\u0129kal\u0129le woo m\u0169th\u0169ku. O nakwa keka n\u0129naendeeie
  kw\u0129th\u0129wa na mw\u0129kal\u0129le \u0169su m\u0169th\u0169ku, n\u0129vatonyeka
  ngeth\u0129wa nakwie. N\u0129n\u0129m\u0169t\u0169ng\u0129aa Yeova m\u0169vea m\u0169no
  n\u0169nd\u0169 n\u0129wangusisye kwake. O na n\u0129n\u0129m\u0169t\u0169ng\u0129aa
  m\u0169vea n\u0169nd\u0169 n\u0129wangusisye kwa athaithi make ala mamany\u0129isye
  me na w\u0169m\u0129\u0129syo k\u0169t\u0169m\u0129a myolooto ya Mbivilia thay\u0169n\u0129
  wakwa.\""]'
