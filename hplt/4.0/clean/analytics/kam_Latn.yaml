  MWAKA WA: 1953\\nNTH\u0128 \u0128LA WUM\u0128TE: AUSTRALIA\\n\u0128VINDA \u0128V\u0128TU:
  ENDETE M\u0168NO KW\u0128LOELA MAVISA MA \u0168LAALAI\\nKW\u0128ANA KWAKWA:\\n\u0128the
  wakwa atham\u0129\u0129ie Australia aum\u0129te Germany mwaka wa 1949. Aendete ku
  k\u0169mantha w\u0129a wa kw\u0129nza sy\u0129nd\u0169 ta thaavu na n\u0129wamanthaa
  w\u0129a kambun\u0129n\u0129 sya k\u0169se\u0169vya sitima, na n\u0169nd\u0169 wa
  \u0169u at\u0169a vand\u0169 va\u0129 vaasa na taoni veetawa Victoria. E ku n\u0129w\u2019o
  watwaie inyia wakwa, na nasyawa mwaka wa 1953.\\nMyaka m\u0129nini \u0129tina wa
  vau inyia wakwa n\u0129wamb\u0129\u0129ie kw\u0129many\u0129sya Mbivilia na Ng\u0169s\u0129
  sya Yeova, na kwond\u0169 wa \u0169u ma\u0169nd\u0169 ala n\u0129lilikanaa nees\u0129
  n\u0129 m\u0169nini n\u0129 ala neew\u2019aa inyia wakwa aimany\u0129w\u2019a. \u0128nd\u0129,
  \u0129the wakwa ndendeeaw\u2019a n\u0129 nd\u0129ni o na \u0129mwe. Na n\u0169nd\u0169
  wa \u0169u n\u0129wamb\u0129\u0129ie k\u0169v\u0169a inyia wakwa na k\u0169m\u0169th\u0129ny\u2019a
  na \u0169u watumaa inyia wakwa am\u0169k\u0129a m\u0169no. \u0128nd\u0129 o na \u0169u
  w\u0129 o vo, n\u0129waendeeie kw\u0129many\u0129sya Mbivilia evith\u0129te na endeew\u2019a
  m\u0169no n\u0129 momany\u0129syo mayo. \u0128la \u0129the wakwa \u0169te kw\u2019o,
  n\u0129wat\u0169many\u0129asya n\u0129 na m\u0169inawa ma\u0169nd\u0169 ala weemany\u0129sya.
  N\u0129wat\u0169tavisye \u0129\u0169l\u0169 wa nth\u0129 nza\u0169 na at\u0169tavya
  \u0169nd\u0169 t\u0169tonya kw\u0129th\u0129wa tw\u0129 atanu twaat\u0129\u0129a
  myolooto \u0129la y\u0129 Mbivilian\u0129.\u2014Savuli 37:10, 29; Isaia 48:17.\\nN\u0129
  na myaka 18, n\u0129naumie m\u0169sy\u0129 n\u0169nd\u0169 \u0129the wakwa a\u0129
  na ithokoo mbing\u0129. O na kau n\u0129na\u0129k\u0129\u0129aa ma\u0169nd\u0169
  ala inyia wakwa wamany\u0129asya kuma Mbivilian\u0129, ndyoonaa matonya k\u0169ndethya,
  na n\u0169nd\u0169 wa \u0169u ndyaamaat\u0129\u0129a. N\u0129namb\u0129\u0129e k\u0169th\u0169k\u0169ma
  w\u0129a wa sitima k\u0169la kw\u0129nzawa makaa ma mwaki. Natwaanie n\u0129 na
  myaka 20. N\u0129twakwatie kel\u0129tu kait\u0169 ka mbee \u0129tina wa myaka \u0129tat\u0169,
  na nas\u0169an\u0129a k\u0129nd\u0169 kya vata k\u0129la naa\u0129le kw\u0129ka.
  N\u0129nees\u0129 kana Mbivilia no \u0129tetheesye m\u0169sy\u0129 wakwa, na kwoou
  namb\u0129\u0129a kw\u0129many\u0129sya Mbivilia na \u0169mwe wa Ng\u0169s\u0129
  sya Yeova. \u0128nd\u0129 k\u0129veti kyakwa k\u0129yamendete o na vanini. \u0128la
  naendie \u0169mbanon\u0129 \u0169mwe wa Ng\u0169s\u0129 sya Yeova, kyamb\u0129ie
  n\u0129nyuve \u0169nd\u0169 \u0169mwe kat\u0129 wa ma\u0169nd\u0169 aa el\u0129,
  n\u0129eke kw\u0129many\u0129sya Mbivilia kana nume vau m\u0169sy\u0129 n\u0129thi
  vy\u0169. N\u0169nd\u0169 noonie nde \u0169nd\u0169 n\u0129ka n\u0129neet\u0129k\u0129lanile
  na \u0169nd\u0169 kyendaa na naeka kw\u0129many\u0129sya na Ng\u0169s\u0129 sya
  Yeova. \u0128tina n\u0129nesie kw\u0129lila m\u0169no n\u0129k\u0129 ndaat\u0129\u0129a
  ma\u0169nd\u0169 ala nees\u0129 n\u0129 maseo.\\nM\u0169thenya \u0169mwe, and\u0169
  ala twath\u0169k\u0169maa \u0129mwe n\u0129mambonisye mavisa ma \u0169laalai. Woonekaa
  w\u0129 \u0169nd\u0169 wa kwendeesya \u0129nd\u0129 wa k\u0169telemya, na \u0129la
  naminie k\u0169sisya visa isu nth\u0169ku neewie wasya wakwa wa ngoo wath\u0169ka
  vy\u0169. \u0128la nalilikanile ma\u0169nd\u0169 ala neemany\u0129isye Mbivilian\u0129,
  n\u0129nees\u0129 nesa vy\u0169 kana Ngai ndaema k\u0169nzil\u0129la. \u0128nd\u0129
  o \u0169nd\u0169 naendeeie kw\u0129loela mavisa asu ma \u0169laalai, now\u2019o
  woni wakwa waaly\u0169kile. \u0128tina wa \u0129vinda, weeth\u0129ie ndy\u0129kala
  ndeloele visa isu nth\u0169ku.\\nMyaka 20 kuma \u0129vinda y\u0129u, n\u0129nath\u0169k\u0129\u0129ie
  na weeth\u0129a vai \u0169nd\u0169 o na \u0169mwe n\u0129at\u0129\u0129aa kat\u0129
  wa ma\u0169nd\u0169 ala inyia wakwa wamany\u0129isye. Mw\u0129kal\u0129le wakwa
  n\u0129woonanasya nesa ma\u0169nd\u0169 ala ma\u0129 k\u0129l\u0129kon\u0129. \u0168neeni
  wakwa wa\u0129 m\u0169th\u0169ku na nendete k\u0169t\u0169m\u0129a ndeto ikonetye
  ma\u0169nd\u0169 ma \u0169laalai \u0129la ng\u0169v\u0169a ng\u0169\u0129. O na
  n\u0129namb\u0129\u0129ie kw\u0129th\u0129wa na mawoni math\u0169ku \u0129\u0169l\u0169
  wa k\u0169manyana k\u0129-mw\u0129\u0129. O na kau nekalaa na k\u0129veti kyakwa,
  n\u0129nakomaa na aka ang\u0129. M\u0169thenya \u0169mwe n\u0129neesiisye k\u0129oon\u0129
  na neew\u2019a neemena vy\u0169. Vand\u0169 va kw\u0129w\u2019a n\u0129nengete nda\u0129a
  \u0169nd\u0169 neew\u2019aa tene, neewie neemena vy\u0169.\\nM\u0169twaano wakwa
  n\u0129wathelile na ma\u0169nd\u0169 math\u0169ka vy\u0169. N\u0129nam\u0169voyie
  Yeova kuma ngoon\u0129 na namb\u0129\u0129a \u0129ng\u0129 kw\u0129many\u0129sya
  Mbivilia, o na kau n\u0129vav\u0129t\u0129te \u0129vinda ya myaka ta 20 ndemany\u0129sya.
  \u0128vindan\u0129 y\u0129\u0129 \u0129the wakwa a\u0129 akwie, na inyia wakwa a\u0129
  avatisiwe na atw\u2019\u0129ka Ng\u0169s\u0129 ya Yeova.\\n\u0168ND\u0168 MBIVILIA
  YAALY\u0168LILE MW\u0128KAL\u0128LE WAKWA:\\nMw\u0129kal\u0129le wakwa wa\u0129
  k\u0129vath\u0169kany\u2019o vy\u0169 na \u0169nd\u0169 Mbivilia \u0129many\u0129asya.
  \u0128nd\u0129 yu n\u0129natw\u2019\u0129te vy\u0169 k\u0169kwata m\u0169uo wa k\u0129l\u0129ko
  \u0169la Mbivilia \u0129wetete. N\u0129navangie k\u0169eka k\u0169t\u0169m\u0129a
  ndeto nth\u0169ku na kw\u0129th\u0129wa nde\u0169thata m\u0129t\u0169k\u0129. O
  na n\u0129natwie k\u0169ekana na mw\u0129kal\u0129le m\u0169th\u0169ku, k\u0169tha
  kalata, k\u0169nyw\u2019a m\u0169no, na k\u0169y\u0129a m\u0169nene \u0169la wamband\u0129k\u0129te.\\nAnd\u0169
  ala twath\u0169k\u0169maa \u0129mwe mayamanyaa n\u0129k\u0129 ngwenda kw\u0129ka
  moaly\u0169ku asu manenevete \u0169u. Kwa \u0129vinda ya myaka ta \u0129tat\u0169
  matind\u0129aa k\u0169nthing\u2019\u0129\u0129sya n\u0129syokee ma\u0169nd\u0169
  asu math\u0169ku. \u0128la nesa k\u0169v\u0129t\u0169\u0169kany\u2019a o vanini
  na ndineena ndeto nth\u0169ku kana ngew\u2019a woo, and\u0169 asu twath\u0169k\u0169maa
  namo meew\u2019aa m\u0169yo m\u0169no na mayasya \u201cekai mwone aisyoka vala \u0169nat\u0169aa.\u201d
  Ndeto isu syan\u0169m\u0129asya m\u0169no! O na syatumaa nona ta ndesa k\u0169aly\u0169ka.\\nVala
  nath\u0169k\u0169maa ya\u0129 laisi vy\u0169 kwona visa sya \u0169laalai. And\u0169
  ala twath\u0169k\u0169maa \u0129mwe matind\u0129aa k\u0169t\u0169ma visa nth\u0169ku
  na komby\u0169ta o tond\u0169 natw\u0129e n\u0129kaa. Natat\u0129te m\u0169no k\u0169ekana
  na k\u0129many\u0129o kya k\u0169sisya visa isu nth\u0169ku, \u0129nd\u0129 namo
  matataa \u0169nd\u0169 matonya n\u0129 kana n\u0129syokee k\u0129many\u0129o k\u0129u.
  N\u0129naneenie na \u0169la tweemany\u0129asya Mbivilia \u0129mwe n\u0129 kana andetheesye
  na aimb\u0129k\u0129a vinya. N\u0129weethuk\u0129\u0129isye nesa vy\u0169 ma\u0169nd\u0169
  ala nam\u0169tavasya kuma ngoon\u0129. N\u0129wat\u0169m\u0129ie Maand\u0129ko k\u0169mbony\u2019a
  \u0169nd\u0169 ndonya k\u0169ekana na k\u0129many\u0129o k\u0129u, na amb\u0129k\u0129a
  vinya n\u0129mw\u0129kwatasye Yeova k\u0129la \u0129vinda kw\u0129s\u0129la mboya.\u2014Savuli
  119:37.\\nM\u0169thenya \u0169mwe n\u0129noombanisye and\u0169 onthe ala twath\u0169k\u0169maa
  \u0129mwe. \u0128la moombanie nameie manenge a\u0169me el\u0129 ma\u0129 vau \u0169k\u0129,
  na n\u0129nees\u0129 kana ma\u0129 na th\u0129na wa k\u0169nyw\u2019a m\u0169no
  \u0129nd\u0129 matw\u2019\u0129te k\u0169ekana na k\u0129many\u0129o k\u0129u. Namina
  k\u0169matavya \u0169u, and\u0169 asu onthe mew\u2019\u0129te woo mamb\u0129ie at\u0129\u0129:
  \u201cT\u0169itonya k\u0169nenga a\u0169me aa \u0169k\u0129 n\u0169nd\u0169 maendeee
  k\u0169ng\u2019ang\u2019ana \u0169nd\u0169 matonya maeke k\u0169nyw\u2019a!\u201d
  Mamb\u0129a \u0169u nakwa nameie at\u0129\u0129: \u201cO nakwa n\u0129endeee k\u0169ng\u2019ang\u2019ana
  tamo.\u201d Kuma m\u0169thenya \u0169su and\u0169 asu n\u0129mamanyie kana n\u0129endeee
  k\u0169ng\u2019ang\u2019ana n\u0129ekane na k\u0129many\u0129o k\u0129u kya k\u0169sisya
  visa sya \u0169laalai, na mayaamb\u0129la \u0129ng\u0129 k\u0169nthing\u2019\u0129\u0129sya
  n\u0129k\u0129syokee.\\n\u0128tina wa \u0129vinda, Yeova n\u0129wandetheeisye m\u0169no
  naekana na k\u0129many\u0129o k\u0129u kya k\u0169sisya visa sya \u0169laalai. Mwaka
  wa 1999, n\u0129navatisiwe natw\u2019\u0129ka \u0169mwe wa Ng\u0169s\u0129 sya Yeova,
  na n\u0129natanie m\u0169no n\u0169nd\u0169 n\u0129nakwatie \u0129ng\u0129 mwanya
  wa kw\u0129th\u0129wa na mw\u0129kal\u0129le m\u0169seo na kw\u0129th\u0129wa na
  \u0169tanu \u0129ng\u0129.\\nYu n\u0129n\u0129s\u0129 nesa n\u0129k\u0129 Yeova
  \u0169menete ma\u0169nd\u0169 asu natw\u0129e n\u0129mendete kwa \u0129vinda \u0129asa.
  N\u0169nd\u0169 n\u0129 \u0128the wakwa \u0169mbendete, endaa k\u0169nz\u0169v\u0129a
  ndikakwatwe n\u0129 ma\u0169nd\u0169 math\u0169ku ala maumanaa na kw\u0129loela
  visa sya \u0169laalai. Kwa w\u2019o ndeto ii sy\u0129 \u0129vukun\u0129 ya Nthimo
  3:5, 6 n\u0129 sya w\u2019o. \u0128and\u0129ko y\u0129u ya\u0129tye at\u0129\u0129:
  \u201c\u0128k\u0129\u0129a Yeova na ngoo yaku yonthe, Na nd\u0169kekwatye \u0169manyi
  waku mwene: M\u0129endelen\u0129 yaku yonthe m\u0169k\u0169s\u0129\u0129e we, Na
  aka\u0169l\u0169ngal\u0129lya nz\u0129a syaku.\u201d O vamwe na k\u0169t\u0169sian\u0129a
  na m\u0129isyo, m\u0129ao \u0129la y\u0129 Mbivilian\u0129 n\u0129t\u0169tetheeasya
  k\u0169endeea nesa.\u2014Savuli 1:1-3.\\nMOATHIMO ALA N\u0128KWAT\u0128TE:\\n\u0128vinda
  \u0129v\u0129tu n\u0129tw\u0129e ndy\u0129w\u2019a n\u0129menete, \u0129nd\u0129
  yu n\u0129n\u0129nengete nda\u0129a na n\u0129n\u0129th\u0129awa na m\u0169uo wa
  k\u0129l\u0129ko. N\u0129n\u0129th\u0129awa na mw\u0129kal\u0129le m\u0169seo, na
  n\u0129n\u0129w\u2019aa Yeova andekeie na n\u0129nonaa aindetheesya. Mwaka wa 2000,
  n\u0129natwaie mw\u0129\u0129tu-a-asa mwanake w\u0129tawa Karolin, \u0169mwendete
  Yeova o takwa. Tw\u0129kalanasya na m\u0169uo n\u0129 na k\u0129veti kyakwa. N\u0129tw\u0129w\u2019aa
  ne \u0169athimo m\u0169nene kw\u0129th\u0129wa tw\u0129 k\u0129kundin\u0129 kya
  K\u0129kl\u0129sto kya nth\u0129 yonthe k\u0129la k\u0129th\u0129awa na ana-a-asa
  na e\u0129tu-a-asa me mw\u0129kal\u0129le m\u0169seo na mendene.\"", "\"NTH\u0128N\u0128
  wa Mbivilia \u0169keeth\u0129a \u0129vuku y\u0129tawa Luthi. \u0128vuku y\u0129u
  y\u0129na ngewa ya and\u0169 ma m\u0169sy\u0129 ma\u0129 thay\u0169 \u0129vinda
  y\u0129la Aisilaeli ma\u0129 na asili. Luthi a\u0129 m\u0169nd\u0169 m\u0169ka wa
  m\u0169ika kuma nth\u0129 ya Moavi. We nda\u0129 wa and\u0169 ma Ngai ma nth\u0129
  ya Aisilaeli. \u0128nd\u0129 y\u0129la Luthi weemany\u0129isye \u0129\u0169l\u0169
  wa Yeova Ngai wa w\u2019o, amwenda m\u0169no vy\u0169. Naomi a\u0129 m\u0169nd\u0169
  m\u0169ka m\u0169k\u0169\u0169 na n\u0129watetheeisye Luthi kw\u0129many\u0129sya
  \u0129\u0169l\u0169 wa Yeova.\\nNaomi a\u0129 M\u0169isilaeli. We na m\u0169\u0169me
  na ana moo el\u0129 n\u0129matham\u0129\u0129ie nth\u0129 ya Moavi \u0129vinda y\u0129mwe
  kwa\u0129 y\u0169a nth\u0129 ya Isilaeli. Na \u0129nd\u0129 m\u0169thenya \u0169mwe
  m\u0169\u0169me wa Naomi akw\u2019a. \u0128tina ana make el\u0129 matwaa e\u0129tu
  Amoavi meetawa Luthi na Oliva. \u0128nd\u0129 \u0129tina wa ta myaka 10, ana asu
  el\u0129 ma Naomi makw\u2019a. Naomi na e\u0129tu asu el\u0129 meewie kyeva ta k\u0129!
  Naomi a\u0129 atonya kw\u0129ka ata yu?\\nM\u0169thenya \u0169mwe Naomi n\u0129watwie
  k\u0169thi kyalo k\u0129asa asyoke m\u0169sy\u0129 kwa and\u0169 moo. Luthi na Oliva
  n\u0129mendaa kw\u0129kala nake, na kwoou o namo mathi nake. \u0128nd\u0129 \u0129tina
  wa k\u0169endanga \u0129vinda \u0129nini, Naomi eethy\u0169\u0169a kwelekela e\u0129tu
  asu na amea: \u2018Endai m\u0169syoke m\u0169sy\u0129 na m\u0169y\u0129kala na aa-inyia
  menyu.\u2019\\nNaomi n\u0129wamamumunyie e\u0129tu asu amati\u0129e \u0169voo. Na
  \u0129nd\u0129 mamb\u0129\u0129a k\u0169\u0129a n\u0169nd\u0169 n\u0129mamwendete
  Naomi m\u0169no, na masya: \u2018Aiee! Ithy\u0129 tw\u0129thi vamwe naku kwa and\u0169
  maku.\u2019 \u0128nd\u0129 Naomi as\u0169ng\u0129a: \u2018No nginya m\u0169syoke,
  e\u0129tu makwa. \u0168keeth\u0129wa wa\u0129lu kwenyu mw\u0129 m\u0169sy\u0129.\u2019
  Kwoou Oliva akwata nz\u0129a en\u0169ka. \u0128nd\u0129 Luthi alea k\u0169thi.\\nNake
  Naomi eethy\u0169\u0169a amwelekela na asya: \u2018Sisya Oliva n\u0129wathi. O naku
  m\u0169at\u0129\u0129e mw\u0129n\u0169kany\u2019e.\u2019 \u0128nd\u0129 Luthi as\u0169ng\u0129a:
  \u2018Eka \u0169nthing\u2019\u0129\u0129sya ng\u0169tie! Eka n\u0129endany\u2019e
  naku. Vala w\u0129thi ngathi, na vala w\u0129\u0129kala ngekala. And\u0169 maku
  makeeth\u0129wa and\u0169 makwa, na Ngai waku akeeth\u0129wa Ngai wakwa. Vala w\u0129kw\u2019\u0129\u0129a
  novo n\u0129kw\u2019\u0129\u0129a, na novo n\u0129thikwa.\u2019 Y\u0129la Luthi
  waisye \u0169u, Naomi ndaatata \u0129ng\u0129 k\u0169mw\u0129a asyoke m\u0169sy\u0129.\\n\u0128tina
  vy\u0169 aka asu el\u0129 n\u0129mavikie Isilaeli. Na mat\u0169a k\u0169u. Na vate
  kweteela Luthi amb\u0129l\u0129lya k\u0169th\u0169k\u0169ma m\u0129\u0169ndan\u0129,
  n\u0169nd\u0169 ya\u0129 \u0129vinda ya k\u0169ketha mbaale. M\u0169nd\u0169 \u0169mwe
  weetawa Mboasi n\u0129wam\u0169ekie ombany\u2019e iia sya mbaale m\u0129\u0169ndan\u0129
  yake. We n\u0129w\u0129s\u0129 inyia wa Mboasi a\u0129 \u0169\u0169? A\u0129 Laavi
  \u0169la wa nd\u0169a ya Yeliko.\\nM\u0169thenya \u0169mwe Mboasi n\u0129weeie Luthi:
  \u2018N\u0129n\u0129w\u2019\u0129te \u0169voo w\u2019onthe \u0129\u0169l\u0169 waku,
  na \u0169nd\u0169 w\u0129th\u0129\u0129twe w\u0129 m\u0169seo kwa Naomi. N\u0129n\u0129s\u0129
  \u0169nd\u0169 watiie \u0129the na inyia waku na nth\u0129 yaku, na \u0169nd\u0169
  wookie kw\u0129kala na and\u0169 \u0169tames\u0129 nongi. Yeova n\u0129ak\u0169athime!\u2019\\nNake
  Luthi as\u0169ng\u0129a: \u2018N\u0129w\u0129th\u0129\u0129twe w\u0129na tei kwakwa,
  mw\u0129a\u0129i. N\u0129watuma n\u0129w\u2019a nesa n\u0169nd\u0169 wa nz\u0129a
  \u0129la waneena nakwa.\u2019 Mboasi n\u0129wamwendie Luthi m\u0169no, na \u0129tina
  wa \u0129vinda \u0129nini matwaana. \u0168nd\u0169 \u0169su n\u0129watan\u0129thisye
