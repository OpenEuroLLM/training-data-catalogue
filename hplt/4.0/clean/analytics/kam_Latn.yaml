  syavath\u0169kaniw\u2019e n\u0129 moth\u0129ny\u2019o ala \u0129k\u0169mi, na k\u0169manya
  \u0169u kwa\u0129le \u0169tuma tw\u0129th\u0129wa na woni mwa\u0169 \u0129\u0169l\u0169
  wa ikundi isu syel\u0129 \u0169m\u0169nth\u0129? (Kuma 8:10, 18, 19; 9:14)\\n\u0128and\u0129ko
  ya Kuma 9:16 y\u0129t\u0169tetheesya ata k\u0169manya k\u0129la k\u0129tum\u0129te
  Yeova am\u0169eka Satani ekale nginya yu? (Alo. 9:21, 22)\\n- Soma Kuma 12:21-32.\\nVasaka
  yatumie \u0169vonokyo \u0169tonyeka ata kwa and\u0169 aing\u0129, nayo yoonanasya
