  Kanaani kwa\u0129 asumb\u0129 ang\u0129 aing\u0129 ath\u0169ku ala mamenete and\u0169
  ma Yeova. Yosua na ita syake makuie ta myaka thanthat\u0169 k\u0169sinda asumb\u0129
  31 ma \u0129 nth\u0129. Y\u0129la \u0169u weekiwe, Yosua n\u0129wa\u0129k\u0129\u0129thisye
  kana nth\u0129 ya Kanaani n\u0129yaan\u0129w\u2019a mba\u0129 ila sya\u0129 na vata
  wa k\u0169a\u0129wa isio.\\nMyaka ming\u0129 n\u0129yav\u0129tie, na \u0129tina
  vy\u0169 Yosua akw\u2019a e na \u0169k\u0169\u0169 wa myaka 110. \u0128vinda yonthe
  y\u0129la we na anyanyae make ma\u0129 thay\u0169, and\u0169 n\u0129mamw\u0129w\u2019aa
  Yeova. \u0128nd\u0129 y\u0129la a\u0169me asu aseo makwie, and\u0169 mamb\u0129\u0129a
  kw\u0129ka ma\u0169nd\u0169 math\u0169ku na malika th\u0129nan\u0129. \u0128vinda
  y\u0129u n\u0129yo ma\u0129 na vata m\u0169nene vy\u0169 wa \u0169tethyo wa Ngai.\\nYosua
  10:6-15; 12:7-24; 14:1-5; Asili 2:8-13.\\nMak\u0169lyo\\n- Vaa visan\u0129 \u0169\u0169,
  Yosua easya ata, na n\u0129k\u0129?\\n- Yeova atethisye Yosua na a\u0169me make
  ma ka\u0169 ata?\\n- N\u0129 asumb\u0129 meana ma amaitha Yosua wasindie, na at\u0169m\u0129ie
  \u0129vinda y\u0129ana ata?\\n- Yosua aanisye nth\u0129 ya Kanaani n\u0129k\u0129?\\n-
  Yosua akwie e na \u0169k\u0169\u0169 mwa\u0169, na n\u0129 kya\u0169 kyakwatie and\u0169
  \u0129tina?\\nMak\u0169lyo ma kwongeleela\\n- Soma Yosua 10:6-15.\\nN\u0129 \u0169\u0129k\u0129\u0129thyo
  mwa\u0169 twa\u0129lwe kw\u0129th\u0129wa naw\u2019o \u0169m\u0169nth\u0129 k\u0169manya
  kana Yeova n\u0129wa\u0169ngamisye sy\u0169a na mwei ki kwond\u0169 wa Aisilaeli?
  (Yos. 10:8, 10, 12, 13; Sav. 18:3; Nth. 18:10)\\n- Soma Yosua 12:7-24.\\n\u0168la
  kwa w\u2019o ki watumie asumb\u0129 31 ma Kanaani masindwa n\u0169\u0169, na n\u0129k\u0129
  \u0169nd\u0169 \u0169su n\u0129 wa vata kwit\u0169 \u0169m\u0169nth\u0129? (Yos.
  12:7; 24:11-13; K\u0169t. 31:8; Lk. 21:9, 25-28)\\n- Soma Yosua 14:1-5.\\nNth\u0129
  yaan\u0129iw\u2019e mba\u0129 sya Aisilaeli ata, na \u0169nd\u0169 \u0169su w\u0129onany\u2019a
  ata \u0129\u0169l\u0169 wa \u0169ti\u0129wa nth\u0129n\u0129 wa Valatiso? (Yos.
  14:2; Isa. 65:21; Esek. 47:21-23; 1 Ako. 14:33)\\n- Soma Asili 2:8-13.\\nTa Yosua
  nth\u0129n\u0129 wa Isilaeli, naa\u0169 \u0169m\u0169nth\u0129 masi\u0129\u0129aa
  momany\u0129syo ma ala maka\u0129\u0129te \u0169la m\u0169\u0129k\u0129\u0129o?
  (Asi. 2:8, 10, 11; Mt. 24:45-47; 2 Ath. 2:3-6; Tito 1:7-9; \u0168vu. 1:1; 2:1, 2)\"",
  "\"Mathoowa ma mauta nimaambata ingi\\nAakenya meikwatiw\u2019a kuendeeya kuvinyiika
  muno kuivia ngalama sya mauta kwa kilungu kya mithenya 30 yukite. Uu ni kwianana
  na muvea wa kulunga mwaki kana energy vaa Kenya ERC kutangaasa mathoowa meu ma mauta.\\nKwianana
  na maulyuku asu meu yu thoowa wa lita umwe wa mauta ma Petrol na ala ma Diesel niwongeleka
  na silingi 2 na mangotole 67 , na silingi 2 na mangotole 13 kiatianisyo vala ona
  ou wiovo thoowa wa mauta taaa waoleka na silingi umwe na mangotole 26.\\nVaa musyini
  wa Ilovi , Lita umwe wa mauta ma petrol withoow\u2019a silingi 112.87, Diesel 104.45
  namo mauta mataa yu meuma silingi 102 lita umwe.\\nMathoowa asu meu meambiiya kuthukumithw\u2019a
  utuku wa umunthi nginya utuku kati matuku 14 mwai wa Katatu.\"", "\"ASYAIWE MWAKA
  WA: 1960\\nNTH\u0128 \u0128LA WUM\u0128TE: FRANCE\\n\u0128VINDA \u0128V\u0128TU:
  A\u0128 M\u0168NG\u2019ENDU, N\u0128WAT\u0168M\u0128AA NDAWA SYA K\u0168MILA, NA
  N\u0128WAV\u0168TH\u0128TYE AKA\\nKW\u0128ANA KWAKWA:\\nNasya\u0129we taonin\u0129
  y\u0129tawa Mulhouse, y\u0129 ngal\u0129ko ya \u0129\u0169l\u0169 ya France. Taoni
  \u0129su yekalaa and\u0169 ma k\u0129lasi kya nth\u0129 na n\u0129yees\u0129k\u0129e
  m\u0169no n\u0169nd\u0169 wa \u0169ng\u2019endu. Ma\u0169nd\u0169 ala n\u0129lilikanaa
  \u0129\u0169l\u0169 wa \u0129la na\u0129 m\u0169nini n\u0129 \u0129\u0169l\u0169
  wa \u0169nd\u0169 and\u0169 ma m\u0129sy\u0129 y\u0129 k\u0129vath\u0169kany\u2019o
  k\u0129sion\u0129 kit\u0169 matind\u0129aa k\u0169kita. Aka n\u0129mav\u0169th\u0129tw\u2019e
  m\u0169no m\u0169sy\u0129 kwit\u0169 na mavinda maing\u0129 a\u0169me mayamak\u0169lasya
  mawoni. Namany\u0129\u0129tw\u2019e kana aka mekalaa ikon\u0129 mais\u0169v\u0129a
  a\u0169me moo na syana.\\nNakwatiwe n\u0129 math\u0129na maing\u0129 m\u0169no \u0129la
  na\u0129 m\u0169nini. N\u0129 na myaka \u0129k\u0169mi, \u0129the wakwa n\u0129wooaiwe
  n\u0129 \u0169k\u0129. \u0128tina wa myaka \u0129tano, \u0169mwe wa ak\u0169\u0169a
  n\u0129weey\u0169aie. Mwakan\u0129 o \u0169su, n\u0129noonie m\u0169nd\u0169 wa
  m\u0169sy\u0129 ooaa \u0169ng\u0129 n\u0169nd\u0169 wa k\u0129neene kya m\u0169sy\u0129,
  na \u0169nd\u0169 \u0169su n\u0129wan\u0169m\u0129isye m\u0169no. And\u0169 ma m\u0169sy\u0129
  n\u0129mamany\u0129\u0129tye \u0169nd\u0169 na\u0129le k\u0169kita n\u0129t\u0169m\u0129\u0129te
  t\u0169vy\u0169 na mavuti \u0129la ve vata. Math\u0129na asu onthe matumie n\u0129solwa
  tattoo mw\u0129\u0129 w\u2019onthe na namb\u0129\u0129a k\u0169nyw\u2019a.\\nN\u0129
  na myaka 16, k\u0129la m\u0169thenya n\u0129nanyusaa s\u0169va 10 k\u0169vika 15
  sya \u0169k\u0129, na \u0129tina wa kavinda kanini namb\u0129\u0129a k\u0169t\u0169m\u0129a
  ndawa sya k\u0169mila. N\u0129 kana n\u0129kwate mbesa sya kw\u0129ka ma\u0169nd\u0169
  asu math\u0169ku, n\u0129natesaa sikilevu na namb\u0129\u0129a k\u0169ya. O na ndivikya
  myaka 17 na\u0129 nakomie yela. N\u0129natw\u2019\u0129\u0129we kyovo mavinda 18
  n\u0169nd\u0169 wa k\u0169ya na \u0169ng\u2019endu.\\nN\u0129 na myaka 20 na k\u0129nd\u0169,
  n\u0129nath\u0169k\u0129\u0129ie \u0129 ya m\u0169no. K\u0129la m\u0169thenya nanyusaa
  m\u0129sokoto 20 ya vangi na n\u0129nanyusaa heroin na ndawa ing\u0129 nth\u0169ku
  sya k\u0169mila. Mavinda maing\u0129 neeth\u0129awa n\u0129 vakuv\u0129 k\u0169kw\u2019a
  n\u0169nd\u0169 wa k\u0169nyw\u2019a m\u0169no sy\u0129nd\u0169 isu. N\u0129namb\u0129\u0129ie
  k\u0169ta ndawa sya k\u0169mila na kwoou nekalaa ngu\u0129te t\u0169vy\u0169 na
