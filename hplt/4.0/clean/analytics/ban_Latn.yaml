  Bali : I Pucung\\nKacrita ada kon\u00e9 tuturan satua, di Banjar Kawan, wewengkon
  Koripan ada anak pacul ngelah pianak muani adiri madan I Pucung.\\n\\nI Pucung kon\u00e9
  gegaenn\u00e9 tuwah mapikat di carik\u00e9, nanging k\u00e9 nyalah unduk pajalann\u00e9
  mapikat krana ia mikatin kedis masan padi tond\u00e9n serab. Dadi tusing pesan kon\u00e9
  ia ta\u00e9n maan kedis, wir\u00e9h tusing ada kedis ngalih amah krana padin\u00e9
  mara ngandeg beling, tond\u00e9n pesu buah. D\u00e9ning k\u00e9to, med-medan kon\u00e9
  ia mapikat. Wadih mapikat ngalih kedis,\\n\\njani I Pucung kon\u00e9 demen tek\u00e9ning
  kuluk. Sak\u00e9wala, tingkahn\u00e9 masih sol\u00e9h maidih-idihan, krana sabilang
  ia nagih ngidih konyong sik pisagann\u00e9 begbeg an\u00e9 idiha konyong an\u00e9
  mara lekad. Wir\u00e9h konyong an\u00e9 nagih idiha enu cerik buina tond\u00e9n
  kedat, kad\u00e9na konyongn\u00e9 enu buta, dadi buung dog\u00e9n kon\u00e9 ia ngidih
  konyong. Mara k\u00e9to paundukan an\u00e9 tepukina baan I Pucung pesu pedih kenehn\u00e9,
  d\u00e9ning makejang an\u00e9 kenehanga tusing ta\u00e9n misi.\\n\\nSasukat ento,
  kacrita I Pucung tusing pesan kon\u00e9 ia ta\u00e9n kija-kija buin, begbeg nyingkrung
  dog\u00e9n jumahn\u00e9. Ping kuda-kuda kad\u00e9n suba bapann\u00e9 ngl\u00e9m\u00e9kin,
  apanga ia nulungin ka carik, nanging ia masih tusing nyak. Wir\u00e9h k\u00e9to
  solah pianakn\u00e9, bapann\u00e9 pedih kon\u00e9 kenehn\u00e9 tek\u00e9n I Pucung,
  nanging ia tusing bani ngl\u00e9m\u00e9kin wiadin nigtig I Pucung krana ia suba
  kelih. Bapann\u00e9 memegeng cara togog nolih I Pucung nyingkrung di plangkan\u00e9
  geris-geris sirep leplep.\\n\\nMakelo-kelo, dadi demen kon\u00e9 I Pucung tek\u00e9n
  anak luh. Sak\u00e9wala dedemenann\u00e9 likad pesan, ged\u00e9 kenehn\u00e9 ia,
  sawir\u00e9h an\u00e9 dotanga sing ja ada l\u00e9n putrin Ida Sang Prabhu Koripan.
  Ditu k\u00e9weh ia makeneh, ngenehang isin dedemenann\u00e9, budi morahan tek\u00e9n
  bapann\u00e9 tusing kon\u00e9 ia juari, d\u00e9ning suba ngas\u00e9n kapining d\u00e9w\u00e9k
  gedeganga. Ngangsan ngibukang kenehn\u00e9 I Pucung wir\u00e9h dot \u00e9nggal makurenan
  ngajak Ida Rad\u00e9n Galuh, nanging tusing ada jalan, mabudi ngalih ka puri ia
  tusing bani. Jani nga\u00e9 kon\u00e9 ia daya, apanga misi kenehn\u00e9 nyidayang
  makatang Rad\u00e9n Galuh.\\n\\n\\n\\nSedek dina anu, selanturnyane mangkin kacritaang
  Mara teked di bancingah, tepukina ada kon\u00e9 parekan nglaut ia matakon, \u201cIh
  jero parekan, nawegang titiang nunas tulung ring jeron\u00e9, wekasang jebos titiang
  ka purian, aturang titiang jagi tangkil ring Ida Sang Prabhu!\u201d\\n\\nMasaut
  parekan\u00e9, \u201cInggih, mangda becik antuk tiang ngaturang ring Ida Sang Prabhu,
  jeron\u00e9 sapasira?\u201d\\n\\n\u201cAturang titiang I Pucung saking Banjar Kawan!\u201d\\n\\nDitu
  lantas parekann\u00e9 ngapurian matur ring Ida Sang Prabhu, \u201cNawegang titiang
  matur ring Palungguh I Ratu, puniki w\u00e9nten kaulan Palungguh Cokor I D\u00e9wa
  mawasta I Pucung saking Banjar Kawan, ipun jagi tangkil ring Palungguh Cokor I D\u00e9wa.\u201d
  Ngandika Ida Sang Prabhu, \u201cApa kon\u00e9 ada aturanga I Pucung tek\u00e9n nira?\u201d\\n\\n\u201cMatur
  sisip titiang Ratu D\u00e9wa Agung, parindikan punika tan w\u00e9nten titiang uning.\u201d\\n\\n\u201cNah,
  lamun k\u00e9to, tund\u00e9n suba ia mai!\u201d Ngajabaang lantas parekan\u00e9
  ngorahin I Pucung tund\u00e9na ngapuriang. Mara k\u00e9to, \u00e9ncol kon\u00e9
  pajalan\u00e9 I Pucung ngapurian. Sasubann\u00e9 neked di ajeng Ida Sang Prabhu,
  lantas ia mamitan lugra.\\n\\n\u201cIh to Cai Pucung, apa ada buatang Cai mai?\u201d\\n\\nMatur
  I Pucung, \u201cInggih matur sisip titiang Ratu D\u00e9wa Agung, w\u00e9nten tunasang
  titiang ring Cokor I D\u00e9wa.\u201d\\n\\n\u201cNah, unduk apa ento Pucung? Lautang
  aturang kapining gelah!\u201d\\n\\n\u201cInggih sapunapi awinan ipun i pantun san\u00e9
  wau embud dados ipun puyung, kalih asun\u00e9 san\u00e9 wau lekad dados ipun buta?\u201d\\n\\nNgandika
  Ida Sang Prabhu, \u201cYan unduk ento takonang Cai, nira tusing pesan nawang awinannyan\u00e9
  buka k\u00e9to, men yan cara Cai, k\u00e9nk\u00e9n mawinan dadi buka k\u00e9to?\u201d\\n\\n\u201cParindikan
  punika tan kamanah taler antuk titiang. Nanging, yan banggayang Cokor I D\u00e9wa
  asapunika k\u00e9wanten, kamanah antuk titiang, gelis jaga rusak jagat dru\u00e9n\u00e9.\u201d\\n\\n\u201cMen
  jani k\u00e9nk\u00e9n baan madaya, apanga gumin\u00e9 tusing uug?\u201d\\n\\n\u201cInggih
  yan kamanah antuk titiang tambet, becik mangkin karyanang banten paneduh aturang
  ring Ida Betara Dalem. Manawi w\u00e9nten kasisipan Palungguh Cokor I D\u00e9wa,
  mangda sampunang Ida Betara banget menggah pamiduka!\u201d\\n\\n\u201cNah lamun
  k\u00e9to ja keneh Cain\u00e9, kema tegarang neduh ka pura Dalem! Sing ada sag\u00e9t
  pawuwus saking Ida Betara Dalem kapining nira, nira lakar ngiring dog\u00e9nan.
  Nah, antiang dini malu akejep, nira nu nund\u00e9n panyeroan\u00e9 nga\u00e9 banten.
  Apang nyidaang maturan dinan\u00e9 jani, sedeng melaha jani dina tumpek. Yan suba
  pragat banten\u00e9, Cai men ngaturang ajak I Mangku Dalem ka pura!\u201d\\n\\n\u201cInggih,
  titiang mased\u00e9w\u00e9k!\u201d K\u00e9to aturn\u00e9 I Pucung.\\n\\nGelisin
  satua, Sasubann\u00e9 pragat banten\u00e9, majalan lantas I Pucung nyuun banten,
  ngojog kumah jero mangku\\n\\n\u201cJero Mangku, Jero Mangku, tiang nikaanga mriki
  mangda ngaturin Jero Mangku olih Ida Sang Prabhu, niki w\u00e9nten upakara mangda
  ragan Jero Mangku ngaturang ring pura Dalem mapinunas mangda jagat\u00e9 i riki
  rahajeng. Samalihipun banten puniki jeron\u00e9 kandikaang makta ka pura. Tiang
  mapamit dumun abosbos jaga kayeh,\u201d ak\u00e9to baana melog-melog Jero Mangku
  baan I Pucung.\\n\\nSasubann\u00e9 matur ulian ng\u00e9ka daya tek\u00e9n Jero Mangku,
  ditu lantas I Pucung \u00e9nggal-\u00e9nggal mapamit uli jeron dan\u00e9 Jero Mangku
  Dalem. Gelisin satua, apang tusing katara, silib kon\u00e9 pajalann\u00e9 I Pucung
  ngojog pura Dalem tur nglaut ia macelep ka palinggih gedong kamulan an\u00e9 tanggu
  kelod. Sawatara ada kon\u00e9 apanginangan ia mengkeb ditu, rauh lantas Jero Mangku
  makta banten ngojog palinggih sik tongos I Pucung\u00e9 mengkeb. Suba k\u00e9to
  lantas kon\u00e9 Jero Mangku ngaturang banten saha mapinunas tek\u00e9n Ida Betara
  mangdan\u00e9 gumin\u00e9 di Koripan manggih karahayuan!\\n\\nSasubann\u00e9 Jero
  Mangku suud ngantebang, ngomong lantas I Pucung uli jumahan gedong\u00e9, mapi-mapi
  dadi Betara, k\u00e9n\u00e9 kon\u00e9 munyinn\u00e9, \u201cIh, Cening Mangku p\u00e9rmas
  Iran\u00e9, ny\u00e9n nund\u00e9n sapuh Ira mai maturan nunas kaluputan tek\u00e9n
  Nira?\u201d\\n\\nMasaur Jero Mangku, \u201cInggih titiang kandikayang antuk damuh
  Palungguh Betara, Ida Sang Prabhu nunas kaluputan ring Palungguh Betara, d\u00e9ning
  pantun\u00e9 wau lekad puyung kalih asun\u00e9 wau lekad ipun buta.\u201d\\n\\nBuin
  ngomong I Pucung, \u201cIh, Cening Mangku, Nira ngiangin lakar ngic\u00e9n kaluputan
  nanging yan Sang Prabhu ngaturang okann\u00e9 Rad\u00e9n Galuh kapining Ira!\u201d
  Jero Mangku ngad\u00e9n munyin I Pucung pangandikan Ida Betara, lantas dan\u00e9
  budal. Teked di jabaan puran\u00e9 Jero Mangku mr\u00e9r\u00e9n di batan punyan
  bingin\u00e9 sambilang dan\u00e9 ngantiang I Pucung.\\n\\nBuin akejepn\u00e9 pesu
  lantas I Pucung uli gedongan palinggih kamulan nglaut ia maekin Jero Mangku sedek
  ngetis tur matakon, \u201dSapunapi Jero Mangku, w\u00e9nten minab wacanan Ida Betara?\u201d
  Jero Mangku Dalem lantas nuturang buat pamargin dan\u00e9n\u00e9 mapinunas kadagingan
  patuh cara munyin I Pucung mapi-mapi dadi Betara nguluk-nguluk ragan dan\u00e9 Jero
  Mangku cara itunian. Buina suud nutur k\u00e9to, Jero Mangku lantas nganikain I
  Pucung, \u201cNah, Pucung melah suba Cai ka puri ngaturang tek\u00e9n Ida Sang Prabhu
  pangandikan Ida Betara. Bapa tusing ja bareng kema, wir\u00e9h jumah ada tamiu ngantiang!\u201d
  D\u00e9ning k\u00e9to pangandikan Jero Mangku, dadi kendel pesan I Pucung, d\u00e9ning
  guguna pamunyin d\u00e9w\u00e9kn\u00e9 tek\u00e9n Jero Mangku, saha lantas ia majalan
  ngapurian.\\n\\nSasubann\u00e9 I Pucung nganteg di purian, ngandika lantas Ida Sang
  Prabhu, \u201cMen, k\u00e9nk\u00e9n Pucung buat pajalan Cain\u00e9 mapinunas, ada
  pawecanan Ida Betara tek\u00e9ning Cai? Tegarang tuturang apang gelah nawang!\u201d\\n\\nMatur
  I Pucung, \u201cInggih w\u00e9nten Ratu D\u00e9wa Agung. Asapuniki wecanan Ida Betara
  ring titiang. \u201cIh, Cening Pucung, kema aturang wecanan Iran\u00e9 tek\u00e9n
  gustin Cening\u00e9, buat pinunas sasuhunan Cening\u00e9, Nira l\u00e9dang lakara
  ngic\u00e9nin ida kaluputan mangdan\u00e9 gumin\u00e9 karahayuan, nanging yan ida
  kayun ngaturang okann\u00e9, Ida Rad\u00e9n Galuh tek\u00e9n Nira!\u201d Asapunika
  pangandikan Ida Betara ring sikian titiang. Inggih, san\u00e9 mangkin asapunapi
  pakayunan Palungguh Cokor I D\u00e9wa, d\u00e9ning asapunika pakayunan Ida Betara?\u201d\\n\\n\u201cNah
  yan k\u00e9to pakayunan Ida Betara, anak\u00e9 buka gelah sing ja bani tulak tek\u00e9n
  pakayunan Idan\u00e9. Yan suba gumin\u00e9 nemu karahayuan, gelah dong ngaturang
  dog\u00e9n. Ento mara abesik putran gelah\u00e9 karsaang Ida Sasuhunan, kadi rasa
  makadadua, gelah pastika lakar ngaturang.\u201d Ditu buin kon\u00e9 ngendelang dog\u00e9n
  kenehn\u00e9 I Pucung d\u00e9ning suba tingas pesan sinah lakar kaisinan idepn\u00e9
  nganggon Rad\u00e9n Galuh kurenan.\\n\\nMatur buin I Pucung, \u201cInggih yan asapunika
  pikayunan Palungguh Cokor I D\u00e9wa, margi rahinan\u00e9 mangkin ratu, aturang
  putrin Cokor I D\u00e9wa, Ida i nanak Rad\u00e9n Galuh ring Ida Betara mangda gelis
  kasidan pinunas Cokor I D\u00e9wa, rahajeng jagat Koripan\u00e9! Titiang ja ngiringang
  Ida, jaga aturang titiang ring Ida Betara Dalem.\u201d Mara k\u00e9to aturn\u00e9
  I Pucung, ditu lantas Ida Sang Prabhu ngandikain parekann\u00e9 apanga ngaturin
  okan\u00e9 lanang Ida Rad\u00e9n Mantri, kandikaang ngapurian. Ida Rad\u00e9n Mantri
  sedek kon\u00e9 di jabaan. Majalan lantas i parekan ka jabaan ngaturin Ida Rad\u00e9n
  Mantri. Ida Rad\u00e9n Mantri raris ngapurian tangkil ring ajinn\u00e9.\\n\\nNgandika
  Ida Sang Prabhu, \u201cCening Bagus Rad\u00e9n Mantri I D\u00e9wa, nah n\u00e9 jani
  Bapa ngorahin Cening, buat arin Cening\u00e9 Rad\u00e9n Galuh karsaanga tek\u00e9n
  Ida Betara Dalem. Bapa lakar ngaturang i anak Galuh tek\u00e9n Ida Betara, d\u00e9ning
  Bapa tuara bani tek\u00e9ning anak tuara ngenah, buina apanga gumin\u00e9 karahayuan.
  Wir\u00e9h mula k\u00e9to swadarmaning dadi agung, tusing dadi mucingin apa buin
  pangandikan Ida Betara an\u00e9 tusing kanten. Yan Bapa tusing ngaturang adin I
  D\u00e9wan\u00e9, pedas rusak jagat\u00e9. Men, cening k\u00e9nk\u00e9n kayun\u00e9?\u201d\\n\\nMatur
  Ida Rad\u00e9n Mantri, \u201cInggih yan sampun asapunika pakayunan Guru Aji, titiang
  tan panjang atur malih. L\u00e9dang t\u00e9 pakayunan Guru Aji k\u00e9manten.\u201d\\n\\nD\u00e9ning
  k\u00e9to aturn\u00e9 Rad\u00e9n Mantri, lantas I Patih kandikaang nuunang peti
  lakar genah I Rad\u00e9n Galuh. Sasubann\u00e9 Ida Rad\u00e9n Galuh magenah di petin\u00e9,
  lantas petin\u00e9 kancinga tur seregn\u00e9 tegulanga di duur petin\u00e9\\n\\nNgandika
  Ida Sang Prabhu, \u201cIh Cai Pucung, nah n\u00e9 suba pragat i nanak Galuh mawadah
  peti, kema suba tegen petin\u00e9 aba ka pura Dalem aturang i nanak Galuh ring Ida
  Betara. N\u00e9 sereg\u00e9 di duur petin\u00e9 mategul. Da pesan Cai nyemak sereg\u00e9
  en\u00e9, depin dog\u00e9n dini, satond\u00e9n Cain\u00e9 nganteg di pura. Buina
  ingetang pabesen gelah\u00e9, y\u00e9n Cai makita manjus di jalan, pejang petin\u00e9
  di duur pundukann\u00e9 tur seregn\u00e9 depang masih ditu mategul!\u201d\\n\\nSasubann\u00e9
  I Pucung polih pangandikan Ida Sang Prabhu tur ia ngresep tek\u00e9n pawecananidan\u00e9
  ditu ia matur, \u201cInggih, titiang sairing,\u201d k\u00e9to aturn\u00e9 lantas
  ia majalan negen petin\u00e9 misi Ida Rad\u00e9n Galuh. Mimih, magr\u00e9tgotan
  kon\u00e9 ia negen petin\u00e9 ento, nanging baan kendeln\u00e9 lakar maan kurenan
  okan Ida Sang Prabhu, dadi tusing kon\u00e9 as\u00e9na baat. Kacrita di jalan, I
  Pucung nepukin tukad an\u00e9 y\u00e9hn\u00e9 ening, dadi prajani pesu kon\u00e9
  kenyeln\u00e9 I Pucung. Kadaut baan ening y\u00e9h tukad\u00e9 tur bedakn\u00e9
  tan kadi-kadi, ditu ia mar\u00e9r\u00e9n nglaut manjus ka tukad\u00e9. Petin\u00e9
  pejanga baan I Pucung di duur pundukan\u00e9 katut seregn\u00e9 kadi pangandikan
  Ida Sang Prabhu. Di makir\u00e9n\u00e9 ia tuun lakar kayeh, matur I Pucung tek\u00e9n
  Rad\u00e9n Galuh, \u201cRatu Rad\u00e9n Galuh, Cokor I D\u00e9wa driki dumun, k\u00e9nakang
  kayun\u00e9 driki. Titiang ngaonin Cokor I D\u00e9wa ajebos, titiang jaga tuunan
  manjus, d\u00e9ning ongkeb pisan tan dugi antuk titiang naanang kebus\u00e9, asapunika
  taler bedak tiang\u00e9 tan kadi-kadi.\u201d D\u00e9ning Ida Rad\u00e9n Galuh mawadah
  peti dadi tusing kon\u00e9 pirenga atur I Pucung\u00e9.\\n\\nSuud I Pucung matur
  k\u00e9to, tuunan lantas ia ka tukad\u00e9 kayeh. I Pucung klangen tek\u00e9n tis
  y\u00e9h tukad\u00e9 kanti tusing inget tek\u00e9n Rad\u00e9n Galuh, ia makelo manjus
  sambilanga mlamlaman. Ditu rauh lantas Ida Rad\u00e9n Mantri sameton Ida Rad\u00e9n
  Galuh nandan macan pacang angg\u00e9n ida ngentosin sameton\u00e9. Sasubann\u00e9
  Ida Rad\u00e9n Mantri rauh sik tongos petin\u00e9 ento, ngelisang raris Ida Rad\u00e9n
  Mantri nyereg petin\u00e9 tur kamedalang arin\u00e9. Sasubann\u00e9 Ida Rad\u00e9n
  Galuh medal, jani macan\u00e9 kon\u00e9 celepang ida tur kakancing, seregn\u00e9
  buin kon\u00e9 genahang ida duur petin\u00e9. Suud k\u00e9to, gelis-gelis kon\u00e9
  Ida Rad\u00e9n Mantri malaib sareng Ida Rad\u00e9n Galuh budal ka Koripan. Buat
  isin petin\u00e9 kasilurin, tusing kon\u00e9 tawanga tek\u00e9n I Pucung.\\n\\nSasubann\u00e9
  I Pucung suud manjus, lantas ia menekan. Teked ba duuran dingeha kon\u00e9 munyi
  krasak-krosok baan I Pucung di tengah petin\u00e9. Ngomong lantas I Pucung, \u201cInggih
  Ratu Rad\u00e9n Galuh, menggah manawi Cokor I D\u00e9wa dados krasak-krosok wau
  kaonin titiang manjus. Margi mangkin Cokor I D\u00e9wa budal kumah titiang\u00e9,
  drika mangkin Cokor I D\u00e9wa malinggih sareng titiang. Cokor I D\u00e9wa pacang
  angg\u00e9n titiang kurenan. Samalihipun, titiang sampun nyiagayang Cokor I D\u00e9wa
  woh-wohan luir ipun: buluan, salak, croring, miwah manggis. Punika pacang rayunan
  Palungguh Cokor I D\u00e9wa sampun w\u00e9nten jumah titiang katragianang antuk
  panyeroan Palungguh Cokor I D\u00e9wa, titiang maderb\u00e9 m\u00e9m\u00e9. Sampunang
  t\u00e9 k\u00e9nten menggah Cokor I D\u00e9wa, mangkin iringa ja Cokor I D\u00e9wa
  budal.\u201d\\n\\nGelisin satua, majalan lantas ia I Pucung ngamulihang negen petin\u00e9.
  Sasubann\u00e9 neked jumahn\u00e9, kauk-kauk lantas I Pucung ngaukin m\u00e9m\u00e9nn\u00e9,
  \u201cM\u00e9m\u00e9, m\u00e9m\u00e9, ampakin tiang jlanan, tiang ngiring Ida Rad\u00e9n
  Galuh mulih. Tiang anak suba ic\u00e9na nunas Ida Rad\u00e9n Galuh tek\u00e9n Ida
  Sang Prabhu. Makedas-kedas men M\u00e9m\u00e9 di jumahan met\u00e9n icang\u00e9
  apang kedas, krana tiang lakar nglinggihang Ida ditu, uli semengan Ida tond\u00e9n
  ngrayunang.\u201d M\u00e9m\u00e9nn\u00e9 tusing ja ia nawang keneh panakn\u00e9,
  slegagan kon\u00e9 ia mara ningeh pamunyin panakn\u00e9 buka k\u00e9to. Dadi ampakina
  dog\u00e9n kon\u00e9 I Pucung jelanan tur I Pucung ng\u00e9nggalang macelep kumah
  met\u00e9n saha \u00e9ncol ngancing jelanan uli jumahan. Petin\u00e9, pejanga kon\u00e9
  baan I Pucung di pasar\u00e9an\u00e9.\\n\\nCritayang jani suba tengah lemeng m\u00e9m\u00e9
  bapann\u00e9 I Pucung suba kon\u00e9 pada leplep sirepn\u00e9, ditu lantas I Pucung
  buin ngomong ngrumrum isin petin\u00e9, \u201cInggih Ratu Rad\u00e9n Galuh, matangi
  Cokor I D\u00e9wa, niki sampun wengi, mriki mangkin Palungguh Cokor I D\u00e9wa
  merem sareng titiang!\u201d Suud ia ngomong k\u00e9to, lantas petin\u00e9 ento serega
  tur ungkabanga. Mara petin\u00e9 ento ungkabanga, m\u00e9m\u00e9h d\u00e9wa ratu
  tangkejutn\u00e9 I Pucung, wir\u00e9h petin\u00e9 misi macan. Tond\u00e9n maan map\u00e9ngkas,
  sag\u00e9t macan\u00e9 an\u00e9 ada di tengah petin\u00e9 makecos nyagrep saha nyarap
  I Pucung. Ditu I Pucung lantas mati sarap macan.\\n\\nBuin mani semengann\u00e9,
  dunduna lantas ia tek\u00e9n m\u00e9m\u00e9nn\u00e9 uli diwangan, d\u00e9ning suba
  tengai I Pucung tond\u00e9n bangun uli pasar\u00e9an. M\u00e9m\u00e9nn\u00e9 narka
  tur ngad\u00e9n panakn\u00e9 sajaan ngajak Rad\u00e9n Galuh. Kanti ping telu kon\u00e9
  m\u00e9m\u00e9nn\u00e9 makaukan, masih tusing kon\u00e9 ada pasautn\u00e9 I Pucung
  uli tengahan met\u00e9n\u00e9. Wir\u00e9h k\u00e9to, m\u00e9m\u00e9nn\u00e9 kon\u00e9
  lantas ninjak jelanann\u00e9. Mara mampakan don jelanann\u00e9, magru\u00e9ng kon\u00e9
  macan\u00e9 jumahan. Ditu makesiab m\u00e9m\u00e9nn\u00e9 I Pucung saha prajani
  lantas buin ngubetang jelanan met\u00e9n\u00e9. Sasubann\u00e9 macan\u00e9 kakancing
  ditu lantas ia gelur-gelur ngidih tulungan tek\u00e9n pisagan\u00e9. Liu pada anak\u00e9
  nyagjagin m\u00e9m\u00e9n I Pucung saha sregep pada ngaba gegawan. Macan\u00e9 laut
  kaiterin di jumahan meten\u00e9 tek\u00e9n kraman\u00e9, ada an\u00e9 numbak uli
  di sisi, ada an\u00e9 nimpug aji batu, k\u00e9to masi ada an\u00e9 nulup. Gru\u00e9ng-gru\u00e9ng
  macan\u00e9 kena tumbak, lantig saang kandikan saha glebugin batu bulitan an\u00e9
  ged\u00e9-ged\u00e9. Wir\u00e9h kakembulin, mati lantas kon\u00e9 macan\u00e9 totonan.
  Sasubann\u00e9 i macan mati, mulihan lantas m\u00e9m\u00e9nn\u00e9 I Pucung ka tengah
  met\u00e9nn\u00e9, dapetanga panakn\u00e9 suba mati tur nu tulang-tulangn\u00e9
  dog\u00e9n.\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0tag:blogger.com,1999:blog-2131724523036064124.post-33117622190089750432013-08-29T20:24:00.001-07:002013-08-30T04:34:59.153-07:00Satua
  Bali : Kambing Takutin Macan\\n\\n\\nKacerita ada kambing madan Ni M\u00e9saba ngajak
  Ni Wingsali. Ia luas ka alas\u00e9, ngalih amah-amahan an\u00e9 nguda-nguda.\\n\\nPanakn\u00e9
  Ni Wingsali masih bareng ka alas\u00e9. Tan kacerita di jalan, teked ajak dadua
  di alas\u00e9. \u201dbih, demen\u00e9 Ni M\u00e9saba ajak Ni Wingsali, nepukin amah-amahan
  an\u00e9 nguda-nguda.\\n\\nSedeng itehe ngamah, Ni Wingsali makasiab nepukin buron
  tawah. Melaib Ni Wingsali di durin m\u00e9m\u00e9n\u00e9, sambilanga matakon. \u201dM\u00e9m\u00e9\u2026.m\u00e9m\u00e9\u2026.ade
  buron tawah, to to ya m\u00e9m\u00e9\u2026..! \u201dikuhn\u00e9 lantang, guban\u00e9
  a\u00e9ng\u201d, nyeh tiyang m\u00e9m\u00e9..!\\n\\nMesaut lantas Ni M\u00e9saba,\\n\\n\u201dento
  madan I Macan\u201d, nah k\u00e9n\u00e9 jani cening, entegang sebeng\u00e9 apang
  care anak sakti, anggon nayanin I Macan, an\u00e9 malaksana corah\u201d.\\n\\nI
  Macan masih ngon nepukin Ni M\u00e9saba ngajak pianakn\u00e9 Ni Wingsali. I Macan
  ngomong,\\n\\n\u201dIh, buron apa saja iba bani mai ka alas\u00e9? kai an\u00e9
  kuasa di alas\u00e9 en\u00e9\u201d!.\\n\\nMesaut Ni M\u00e9saba, \u201dIh iba macan.
  Iba mirib tusing nawang, uli awak kain\u00e9 bisa pesu api. Di tanduk kain\u00e9
  Ida Sang Hyang Siwa an\u00e9 malinggih. Kai kaliwat sakti, tusing buungan iba amah
  kai. Sambilanga Ni M\u00e9saba ng\u00e9ngkotang tandukn\u00e9 tur mekecos.\\n\\nI
  Macan lantas malaib. tepukina tek\u00e9n i Bojog. i Bojog matakon\u201d, Beli, apa
  krana beli malaib?\u201d.\\n\\nI Macan masaut, \u201dbeli jejeh nepukin buron tawah.
  Awakn\u00e9 pol\u00e9ng tandukn\u00e9 lanying\u201d.\\n\\nRaris, seanturnyane ..
  \u201dEnto sing je l\u00e9nan tek\u00e9n I Kambing. Tiang mamusuh tek\u00e9n ia.
  Jalan jani malipetan bareng-bareng alih!\u201d.\\n\\nMasaut I Macan,\\n\\n\u201db\u00e9h,
  y\u00e9n beli kema tusing buungan beli mati. Cai gancang men\u00e9k kayu, \u00e9lah
  makecos\u201d.\\n\\nI Bojog buin ngomong, \u201dy\u00e9n beli sangsaya, jalan tegul
  bangkiang\u00e9. Kant\u00e9tang ikuh\u00e9\u201d.\\n\\nMunyin i Bojog\u00e9 lantas
  guguna tek\u00e9n I Macan. Ditu pada ngilitang ikuh, pada negul bangkiang.\\nKacrita
  jani suba neked di arepan Ni M\u00e9saba. Ni M\u00e9saba masebeng \u00e9gar tur
  mamunyi\\n\\n\u201dUh, cai Bojog teka. Dugas cain\u00e9 kalah matoh-tohan,\\n\\ncai
  majanji nyerahang macan patpat. An\u00e9 jani cai mara ngaba aukud.\\n\\nNah kanggoang
  embok masih. sedeng melaha embok ngidamang b\u00e9 macan.\\nMara k\u00e9to munyin\u00e9
  Ni M\u00e9saba, I Macan kaliwat jejeh.\\n\\n\u201dB\u00e9h, i d\u00e9w\u00e9k bayahange
  utang t\u00e9k\u00e9n i Bojog, \u201d k\u00e9to kenehn\u00e9.\\n\\nDitu lantas ia
  jeg malaib patipurug. i Bojog bragedega. Ulian keliwat jejehn\u00e9 I Macan, lantas
  maka dadua ulung di jurang\u00e9 tep\u00e9n batu. Pamuputn\u00e9 mati I Macan tek\u00e9n
  I Bojog.\\n\\nNah k\u00e9to tuah, amun apa ja wan\u00e9n\u00e9 wiadin kerengn\u00e9,
  y\u00e9ning belog sinah lakar nepukin sengkala buka I Macan.\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
