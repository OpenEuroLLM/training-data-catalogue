  Mas Ruscitadewi was born in Kesiman, Denpasar.\\nIn Indonesian: Mas Ruscitadewi,
  lahir di Kesiman, Denpasar.\\nIn Balinese: Ngakan Mad\u00e9 Kasub Sidan, embas ring
  d\u00e9sa Satra Klungkung nemonin rahina Saraswati warsa 1959.\\nIn English:\\nIn
  Indonesian: Ngakan Made Kasub Sidan, lahir di desa Satra Klungkung bertepatan dengan
  hari suci Saraswati pada tahun 1959.\\nIn Balinese: Ni Kad\u00e9k Widiasih embas
  ring Banjar Magatelu, D\u00e9sa Tista, Kecamatan Abang, Karangasem tanggal 14 Juni
  1984.\\nIn English:\\nIn Indonesian: Ni Kadek Widiasih lahir di Banjar Magatelu,
  Desa Tista, Kecamatan Abang, Karangasem tanggal 14 Juni 1984.\"", "\"Gubernur Bali
  Wayan Koster miwah Wakil Gubernur Tjokorda Oka Artha Ardhana Sukawati (Cok Ace)
  ngaturang pamuji majeng ring pamargin pemilu serentak warsa 2019 ring tanggal 17
  April 2019 duaning sasampune polih kaselehin ring sajeroning pamargi, acarane sampun
  mamargi antar miwah trepti. \u201cPamargin pemilu inggian punika pemilihan presiden
  miwah pemilihan legislatif mamargi aman, trepti, antar tur labda karya,\u201d baos
  Gubernur Koster kaabih olih Wagub Cok Ace ring sajeroning acara jumpa pers sareng
  makudang-kudang awak media/wartawan magenah ring Rumah Jabatan Jaya Sabha, Wraspati
  (18 April 2019) rahina siang.\\nRing galah punika, Koster maosang sajeroning pamargin
  dane nodya utawi memantau ring makudang-kudang genah pemilihan makanten janten pisan
  rasa sumeken krama Bali pacang sareng memilih calon pemimpin sane jagi kaadegang
  pinaka guru wisesa kapungkur wekas. \u201cPara kramane sampun panggihin titiang
  akeh magilir-giliran mamargi ke TPS antuk rasa angayu bagia miwah senengnyane pacang
  ngawigunayang tur nganggen hak pilih sapisanan tanggung jawab/swadharmannyane pinaka
  warga negara,\u201d baos Gubernur Koster. Indike punika manut dane sampun anut ring
  pangaptin pemerintah provinsi, gubernur, PHDI, MUDP, sareng kepolisian miwah lembaga-lemaga
  sane tiosan sane mapangapti tur nyarengin makasami elemen krama Bali mangda ngawerdiang
  rasa sane aman miwah trepti.\\nGubernur Koster ngawewehin, manut data sane kapolihang
  sampun prasida kajantenang tingkat partisipasi utawi keikutsertaan krama Bali ring
  sajeroning ngamargiang hak pilihnyane akehipun nyantos 80% sakadi sane sampun katargetang
  sadurungnyane. \u201cJumlah punika sayan nincapang yening saihang ring persentase
  pemilih daweg pemilihan gubernur sane lintang sane akehnyane nyantos angka 72%.
  (Angka) puniki manahang titiang prestasi sane dahat madurgama pisan anggen nyihnayang
  sayan nincapnyane indeks demokrasi ring Bali,\u201d baos dane.\\nNenten lali Gubernur
  Koster ngangganin jajaran Pemprov Bali ngaturang parama suksmaning manah majeng
  ring para manggala/prawartaka sane sampun mautsaha keras tur ulet pisan mangda prasida
  ngalabda karyanin pemilu. \u201cMajeng ring KPU, Bawaslu, miwah angga Kepolisian
  lan TNI miwah jajaran sami ring sajebag jagat Bali sane nukung pamargin pemilu serentak,
  pamekas majeng ring krama Bali, titiang ngaturang parama suksma sane tulus,\u201d
  baos Ketua DPD PDI Perjuangan Bali puniki.\\nAnggan dane Gubernur Bali taler mapinunas
  majeng ring para pendukung miwah simpatisan inggian saking presiden, partai utawi
  calon legislatif sane sampun ngamolihang hasil quick count mangda tetep mulat sarira,
  ngemit kahanane mangda iraga sareng sami tetep trepti. \u201cSakadi sane sampun
  kauningin, wenten hasil quick count sane nyihnayang sang polih jayanti inggih punika
  pasangan Joko Widodo-KH Maruf Amin, titiang mapinunas mangda ida dane tetep lascarya
  miwah angayu bagia, nenten perlu kadulurin antuk pesta kemenangan sane ngalebih-lebihin.
  Ngiring ngawerdiang rasa trepti, sane satata ngarajegang persatuan miwah ngajiang
  sang sapasira ugi punika taler majeng ring pihak Prabowo-Sandiaga Uno,\u201d kadi
  asapunika pinunas Gubernur Koster. \u201cSampunang wenten sane memancing utawi sane
  terpancing, ngiring tetep nyaga komitmen anggen nindihin gumi Bali,\u201d asapunika
  dane ngawewehin.\\nPinaka panyindeb, Gubernur Koster mapinunas majeng ring krama
  sareng sami mangda nyantosang penyobyahan resmi saking KPU, miwah sareng-sareng
  ngabih suara krama Bali duaning sane mangkin kantun kaproses ring KPU. \u201cNgiring
  iraga kemit sareng-sareng, sampunang nyantos wenten panggih kecurangan tur yening
  wenten sang sane mamurug, titiang nunas mangda pihak berwenang digelis nibakang
  pamidanda,\u201d kadi punika teges dane. (Balitopnews.com/Amo Bali )\\nKomentar\"",
  "\"15\\nrereh. Nanging jadiastoen asapoenik\u0103, taler tan w\u0113nten sid\u0103
  antoek titiang ngoetasang, soantoekan oetang poenik\u0103 tan w\u0113nten keni wilangin
