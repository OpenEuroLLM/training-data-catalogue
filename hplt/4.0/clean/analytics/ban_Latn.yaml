  Bali : I Durma\\n\\n\\nAda tuturan satua anak muani madan I Rajapala makurenan ngajak
  dedari madan ken Sulasih. Ia ngelah pianak adiri adanina I Durma.\\nMara I Durma
  matuuh pitung oton, kalahina teken memene mawali ka swargan. Sawireh keto, Idurma
  kapiara, olih Irajapala,kanti matuuh dasa tiban.\\nGelisang satua I Rajapala makinkin
  bakal nangun kerti ke alas gunung.\\n\\nNuju sanja, I Rajapala ngaukin pianakne
  laut negak masila.\\nI Rajapala ngusap-ngusap duur I Durmane sarwi ngomong,\\n\u201cduh
  cening Durma pianak bapa, tumbuh cening kaasih-asih pesan. Enu cerik cening suba
  katinggalin baan meme. Buin mani masih bapa bakal ninggalin cening luas kagunung
  alas nangun kerti. Jumah cening apang melah\u201d.\\n\\nMara keto, jengis I Durma,
  yeh peningalane ngembeng-ngembeng. Bapane nglanturang mapitutur, \u201cCening Durma
  awak enu cerik, patut cening seleg malajahang awak. Sabilang gae patut plajahin,nyastra
  tusing dadi engsapang. Ditu di pasraman Jero Dukuh, cening mlajah sambilang ngayah\u201d.\\n\u201cPlajahin
  cening matingkah,ngomong muah mapineh. Tingkah,ngomong muah papineh ane rahayu plajahin.
  Sekenang pesan magarapan ditu di pasrama Jero Dukuhe. Prade ada anak kuma tresna,
  suka olas teken cening, ento eda pesan engsapanga. Nanging yen ada anak ngawe jele
  wiadin ngawe jengah teken ukudan ceninge, sadida-sidaan eda Walesa.\\nMinab Ida
  Sang Hyang Widhi tuara wikan nyisipang. Keto masih eda cening ngadu daya lengit,
  ngekadaya nyengkalen anak. Jejerang papinehe ngulati ane melah. Ingetang satata
  ngaturang bakti ring Ida Sang Hyang Widhi, matrisandya tetepang. Nah, amonto bapa
  mituturin cening, dumadak Ida Sang Hyang Widhi Wasa sweca mapica karahayuan tekening
  cening muah bapa\u201d.\\nKacarita jani I Durma suba ngayah, malajah di pesraman
  Jero Dukuhe. Jero Dukuh kalintang ledang pikyunanne, krana\\n\\nI Durma seleg pesan
  malajah tur enggal ngeresep. I Durma tusing milihin gae, asing pituduh Jero Dukuhe
  kgarap kanti pragat. Sabilang peteng kaurukang masastra baan jero Dukuh. Baan selene
  mlajah mamaca, dadi liu ia nawang satwa, tutur muah agama.\\nSasubane I Durma menek
  truna, pepes ia kabencingah, dadi tama ia nangkil ring anake agung di Wanakeling.\\nPara
  punggawa, tandamantri pada uning, tur sayang teken I Durma. Ditu laut I Durma kaangen
  parekan di puri, kadadiang panyarikan sedehan agung purine.\\n\\nDadine, I Durma
  tusing kuangan pangan kinum muah satata mapanganggo bungah.\\nYadiapin keto tusing
  taen ia engsap manyama braya, satata inet teken pitutur bapane muah ajah-ajahan
  Jero Dukuh. Keto yen pikolih anake jemet malajah tur anteng magarapan.\\n\\n\\nsumber
  : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
