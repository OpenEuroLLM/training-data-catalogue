  soe\u0113 ipoen sajan soegih. Sesampornn\u0113 pianakipoen\u0113 lepas saking pese-\"",
  "\"Ceratosaurus (saking Yunani k\u03adpa\u03c2/k\u03adpato\u03c2 keras/keratos ''tanduk''
  miwah \u03c3a\u1fe6po\u03c2 sauros ''kadal'') inggih punika soroh dinosaurus teropoda
  karnivora san\u00e9 maurip ring masa Jurassic Akhir ngantos a (Ki). Genus puniki
  kapertama katlatarang duk warsa 1884 olih sujana paleontologi Amerika Othniel Charles
  Marsh madasar antuk kerangka san\u00e9 sampun jangkep kapanggihin ring Garden Park,
  Colorado, ring batu-batu san\u00e9 ngranjing ring Formasi Morrison. Jenis spesies
  punika inggih punika Ceratosaurus nasicornis.\\nTampilan\"", "\"Olih I Wayan Juniartha\\nJenis
  makanan tradisional to nak menunjukkan watak suku bangsan\u00e9, k\u00e9to t\u00e9orin\u00e9
  I Wayan Cupak Bagus.\\nSedeng liang krama sekaa tuak\u00e9. Ada n\u00e9 ngirim tum
  c\u00e9l\u00e9ng 200 tur kacang gor\u00e9ng 2 kilo. Maklum paek Pilkada, rajin tim
  suks\u00e9s\u00e9 ngirim jotan kija-kija. Y\u00e9n ada nak ngejot patutn\u00e9 tampi,
  disuban\u00e9 jotan dadi tai memilih tetep nganggo hati nurani; keto semboyan sekaa
  tuak\u00e9.\\n\\\"Conton\u00e9 jlema Jawan\u00e9,\\\" keto abetn\u00e9 I Wayan.\\nJlema
  Jawan\u00e9 paling demen k\u00e9n t\u00e9mp\u00e9 lan tahu. Ajin\u00e9 mudah, nga\u00e9
  n\u00e9 sing ketil, tahan lama, gizi n\u00e9 tinggi tur nyidayang kombinasiang ajak
  makudang-kudang bahan makanan an\u00e9 lianan; adungang jak nyuh dadi botok, ajak
  asem lan kecap dadi t\u00e9mp\u00e9 manis, isinin tepung dadi mendoan.\\n\\\"Artine
  jlema Jawa to demen irit, sing demen ribet, sing demen waktun\u00e9 telah krana
  urusan makan dog\u00e9n.\\\"\\nTo makrana jlema Jawan\u00e9 nyidang nabung, jemet
  maga\u00e9 tur kuat maga\u00e9.\\n\\\"Y\u00e9n jlema Bali mula demen k\u00e9n dedaaran
  an\u00e9 ribet.\\\"\\nConton\u00e9 lawar. Y\u00e9n nga\u00e9 lawar, lakar kabasan\u00e9
  g\u00e9n ba liu sajan jenisn\u00e9. Matektekan basa g\u00e9n ba liu sajan nyuang
  waktu lan sumber daya manusia. Di subane pragat, sing lewat pat jam ba masem lawar\u00e9.\\n\\\"Y\u00e9n
  ngor\u00e9ng t\u00e9mp\u00e9 lan tahu padidian nyidayang mragatang. Y\u00e9n lawar,
  harus ram\u00e9-ram\u00e9 mragatang. Sing ada nak nglawar padidian\u00e9. Nglawar
  padidian to patuh jel\u00e9kn\u00e9 ajak maceki padidi.\\\"\\nArtin\u00e9, jlema
  Balin\u00e9 mula demen ram\u00e9-ram\u00e9, demen kumpul jak nyama braya, demen
  mesuang pipis lebih anggo dedaaran.\\n\\\"Krana demen kumpul-kumpul n\u00e9 ba waktu
  anggo maga\u00e9 dadin\u00e9 bedik.\\\"\\nApabuin liunan dedaaran Balin\u00e9 mula
  malakar b\u00e9 c\u00e9l\u00e9ng.\\n\\\"Y\u00e9n suud naar t\u00e9mp\u00e9 tahu
  nak cedang matan\u00e9. Y\u00e9n suud naar lawar c\u00e9l\u00e9ng tur nyiup komoh,
  nak asli pesu kiap\u00e9. Tungkulang kiap asli sing nyidang maga\u00e9.\\\"\\nAnggut-anggut
  krama sekaa tuak\u00e9. Sing ada an\u00e9 bas serius ningehang t\u00e9orin\u00e9
  I Wayan. Konyangan lebih serius ngarap tum lan kacang. Anteg jatahn\u00e9 I Wayan
  ba gragas\u00e9 k\u00e9n krama sekaa tuak\u00e9.\\n\\\"Jlema Balin\u00e9 masi demen
  sajan k\u00e9n dedaaran an\u00e9 isin\u00e9 makudang-kudang jukut tur rasan\u00e9
  lalah, calah srombotan.\\\"\\nArtin\u00e9, jlema Balin\u00e9 mula demen k\u00e9n
  an\u00e9 maadukan, an\u00e9 nga\u00e9 peluh pesu lan basang m\u00e9ncr\u00e9t.\\n\\\"To
  t\u00e9orin cang\u00e9, y\u00e9n cenik-cenik\u00e9 jani demen ken pizza, KFC, lan
  McDonald, artin\u00e9 watakn\u00e9 ba calah jlema toris masi,\\\" k\u00e9to abetn\u00e9
  I Wayan sambilanga nyemak lumur tuakn\u00e9.\\nBa sing misi apa lumurn\u00e9, duman
  tum c\u00e9l\u00e9ngn\u00e9 masi ba ilang kija kad\u00e9n, topl\u00e9s kacang\u00e9
  masi ba puyung. K\u00e9to ba adat\u00e9 di Bali; yen bas liunan mapeta sinah lakar
