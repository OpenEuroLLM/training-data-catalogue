  Bali : I Belog Pengangon Bebek\\n\\n\\nilustrasi i belog\\npengangon bebek\\n\\nAda
  katuturan satua pangangon bebek madan Pan Meri. Sangkal ia madan Pan Meri, kerana
  dugase i malu ia liu gati ngelah memeri utawi panak bebek.\\nSakewala lacur tusing
  dadi kelidin, panyatakan merine mati kena gering. Enu kone masisa buin aukud sada
  merine ento ane paling bengil tur berag.\\nEnto jani kapiara baan Pan Meri. Semengan
  nyanjaang epot Pan Meri ngenang amah-amahan merine bengil ento. Di kengkene ka telabahe
  abana masileman apang nyak kedasan goban merine buin abedik.\\nMerine bengil ento
  masih jemet pesan teken Pan Meri. Yening Pan Meri nuju ngarit jeg nutug di durine
  sambila munyi kwek\u2026.kwek\u2026. kwek\u2026.! Bagia atine Pan Meri ngelah ubuhan
  jemet buka keto. Diastun tuah aukud turin bengil sakewala mawiguna pesan marep Pan
  Meri.\\nKacerita galahe suba sanja. Pan Meri lakar ngemaang amah merine Pan Meri
  lantas ngaukin ri\u2026ri\u2026.ri\u2026ri\u2026! Nanging merine tuara ada. Sengap
  paling Pan Meri mengalihin kema mai masih tuara tepukina. Pan Meri lantas nuluh
  telabah ngalihin sambila mangaukin, naler masih tuara ada. Kanti suba sandikala
  Pan Meri ngalihin tusing masih tepukina merine.\\n\u201cUduh\u2026.Dewa ratu. Dija
  ya merin titiange. Dadi bisa tusing ada, kija lakuna malali. Len suba sandikaon
  buin kejep dogen suba peteng sinah lakar tusing tepuk apa!\u201d Uyang paling kone
  Pan Meri sada sedih merine tuara tepuka.\\nSaget nangked kone Pan Meri di tanggun
  telabahe beten punyan asem, ada batu gede. Ditu kocap tongose tenget tur pingit.
  Sedek bengong Pan Meri, jeg teka anak gede selem, siteng tur tangkahne mabulu. Paliatne
  nelik tur gigine rangap macaling.\\nPan Meri kesiab takut nagih malaib sakewala
  batisne lemet awakne ngetor. Anake gede selem ento maakin Pan Meri.\\n\u201cSuba
  sandikaon adi enu masih kema mai. Apa kalih dini, Pan Meri?\u201d keto omongne I
  gede selem.\\n\\n\u201cIcang ngalih merin icange. Suba sanja konden mulih. Pedalem,
  icang ngelah meri tuah aukud!\u201d\\n\u201cOoh\u2026keto. Mula saja tuni sanjane
  ada meri mai ngelangi.\\nNah jani jemakanga ja, antiang dini!\u201d\\n\\nI gede
  selem maselieb ka durin batune. Pan Meri mara ningeh keto prajani ilang takutne.
  Kendel atine buin bakata merine. Suba keto teka I gede selem ngaba meri, bulune
  alus awakne kedas tur jangih pesan munyine.\\n\u201cene merine, Pan Meri?\u201d\\n\u201cTidong,
  meri icange anak bengil!\u201d\\n\\nBuin I gede selem mesuang meri. Jani merine
  mokoh tur kedas nyalang. Yen adep sinah bakal maal payu.\\n\u201cAne ene merine?\u201d\\n\u201cTidong,
  meri icange berag tur bengil!\u201d\\nKacarita suba liu pesan I gede selem mesuang
  memeri. Sakewala Pan Meri setata ngorahang tidong, kerana mula saja merine makejang
  ento tidong merine Pan Meri.\\nSuba keto I gede selem buin ngomong.\\n\\n\u201cBeh\u2026adi
  makejang tidong. Lamun keto aba suba makejang merine ento!\u201d\\n\u201cAduh\u2026,
  icang tusing bani, ento tusing icang ngelah. Meri icange tuah aukud, berag tur bengil!\u201d
  masaut Pan Meri.\\n\\n\u201cNe mara jadma patut. Tumben jani kai nepuk jadma buka
  Pan Meri. Eda takut\u2026, merine bengil ento mula kai ane ngaba. Nah..,\\n\\nduaning
  Pan Meri maparisolah sane patut tur tusing loba, kai jani ngemaang meri buin aukud.
  Melahang ngubuh apang bisa nekaang hasil. Ne jani aba merine mulih!\u201d\\n\\nTan
  sipi kendelne Pan Meri nepukin merine mulih. Mare keto saget I gede selem ilang
  tur di samping batune gede ada meri buin aukud. Pan Meri ngaturang suksma tur nglantas
  mulih ngaba meri dadua.\\n\\nKacerita meri Pan Meri suba mataluh makelo-kelo mapianak.
  Liu pesan jani Pan Meri ngelah meri. Ia jani dadi sugih ulian madagang memeri. Keto
  yening dadi jadma maparisolah utawi malaksana patut, tusing loba cara Pan Meri,
  sinah kapaica wara nugrah sane nekaang bagia.\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
