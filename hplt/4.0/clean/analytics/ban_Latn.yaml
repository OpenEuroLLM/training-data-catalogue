  :( :s :o :) :L :E :H :Q :-r :-$ :-c :-y :-j :-O I-) 8-| 8-} =(( :-n :-e :-k\\nPosting
  Komentar\\nSemeton sane jagi komentar, ngicenin kritik, saran, request, utawi sekadar
  kenalan driki manten ring kotak komentar niki. Sampunang lali dagingin wastan sameton
  ne ring kotak Beri komentar sebagai. Suksma!!\"", "\"Di Bali, iraga sanget nyaga
  kelestarian budaya nenek moyang iraga. Nanging ane tiang tolih bajang bajange jani
  cenik-cenik suba meroko, minum, seks bebas lan sekancan parilaksana sane ten patut.
  parilaksana keto cara suba lumrah tanggapina teken bajang-bajang jani. Nika makejang
  krana kurang didikan orang tua? Napi krana kesadaran diri? Ada masih ane nepuk contoh
  di hp sosmed. Ane jani viral tusing je harus dueg lan berbakat. Memodal seksi lan
  jegeg jani ampun ngidang viral. Ane keto-keto dogen jani pebaliha ajak cenik-cenike.
  Ditu suba ya maan contoh ane ten patut. Maroko marasa keren, joged goyang seksi
  marasa keren, ulian contoh ane pabalih keto tepuka. Cobak sane viral nika orang
  berbakat, edukasi-edukasi ane mendukung anak anak apang ngelah rasa semangat mengejar
  kemampuan. Patuh teken anake jani cenik-cenik suba nganten. Sepatutne nika ditindaklanjuti
  apang tusing terus berkelanjutan. Perlu edukasi sane patut ring sekolah lan orang
  tua apang cenik-cenike jani ngelah kesadaran diri bisa minayang hal baik lan buruk.
  Nah, perlu masi watesin penggunaan sosmed lan parilaksana sane ten patut apang tusing
  dadi contoh bagi generasi iraga kedepane.\\nEnable comment auto-refresher\"", "\"Gubernur
  Bali Wayan Koster rikala ngaturang pisuguh tur boga amatra ri tepengan acara dinner
  para pamilet Rapat Pimpinan Nasional Kamar Dagang dan Industri (Rapimnas Kadin)
  2019\\nBalitopnews.com, Denpasar\\nBali pinaka silih sinunggil destinasi wisata
  dunia sampun kaloktah indik seni, budaya, miwah alamnyane sane ngadaut pikahyunan
  punika makahawinan kawastanin Pulo Surga. Industri pariwisata pinaka sektor unggulan
  prasida terancam yening kelestarian, kemurnian, miwah nilai sane wenten ring tengahnyane
  sampun ical.\\nDuaning kadi asapunika, Pemerintah Provinsi Bali ngamargiang terobosan
  miwah kebijakan sajeroning nitenin Bali saking dasar malarapan visi \\\"Nangun Sat
  Kerthi Loka Bali\\\" majalaran antuk Pola Pembangunan Semesta Berencana, Nuju Bali
  Era Baru.\\nIndike puniki kasobyahang olih Gubernur Bali Wayan Koster rikala ngaturang
  pisuguh tur boga amatra ri tepengan acara dinner para pamilet Rapat Pimpinan Nasional
  Kamar Dagang dan Industri (Rapimnas Kadin) 2019 magenah ring Jayasabha, Rumah Jabatan
  Gubernur Bali, Denpasar duk rahina Wrahaspati (28 November 2019) wengi.\\nSajeroning
  utsaha ngemit alam, makudang-kudang kebijakan sampun kamedalang olih Gubernur Bali.
  Luiripun, Peraturan Gubernur Bali Nomor 45 Warsa 2019 indik Bali Energi Bersih miwah
  Peraturan Gubernur Bali Nomor 48 Warsa 2019 Indik Penggunaan Kendaraan Bermotor
  Listrik Berbasis Baterai.\\n\\\"Bali nganggen energi bersih. Kapungkur pembangkit
  listrik sane wenten ring Bali patut madasar antuk bahan bakar energi sane anyar
  utawi sane baru terbarukan. Makasami patut madasar antuk energi baru terbarukan.
  Targetnyane warsa 2024, pembangkit listrik ring Bali mangda sampun dados ngangge
  energi sane baru terbarukan. Sajabaning punika, taler sampun kakaryanin kebijakan
  mangda ngangge kendaraan motor listrik sane madasar antuk energi baterai. Indik
  puniki satmaka utsaha mangda alam Bali sayan-sayan bersih,\\\" baosnyane.\\nTios
  ring punika, ring widang budaya, Gubernur Koster taler sampun ngaryanin kebijakan
  malarapan antuk Peraturan Gubernur Bali Nomor 79 Warsa 2018 Indik Rahina Ngangge
  Busana Adat Bali, Peraturan Gubernur Bali Nomor 80 Warsa 2018 Indik Perlindungan
  miwah Penggunaan Bahasa, Aksara, miwah Sastra Bali tur Indik Ngamargiang Bulan Bahasa
  Bali.\\n\\\"Nyabran wenten parikrama nasional utawi internasional sane kalaksanayang
  ring Bali sanistannyane rikala acara pamungkahnyane mangda ngangge busana adat Bali.
  Punika makahawinan kebijakan ngangge busana adat Bali nenten wantah nincapang tur
  ngawerdiang rasa tresna iraga ring budaya, nanging para pegiat industri busana adat
  Bali prasida sayan ngalimbak tur nincap. Omzetnyane taler prasida sayan nincap sinarengan
  ring kebutuhan busana adat Bali,\\\" baosnyane.\\nPinaka utsaha ngenalang para pamilet
  utawi peserta dinner ring kearifan lokal Bali, Gubernur Koster pamekas sampun nyediaang
  Arak Bali ring acara dinner. Arak Bali wantah inum-inuman tradisional sane sampun
  katamiang turun-temurun saking nguni olih krama lokal sane nenten kalah yening saihang
  sareng inum-inuman impor. Pemprov Bali sedeng ngarencanayang regulasi mangda inuman
  puniki prasida kasandingang sareng inum-inuman impor.\\nRing parikrama puniki, Gubernur
  Koster taler ngaturang suksema antuk sampun kapilihnyane Bali dados genah ngamargiang
  RapimnasKadin 2019. Dane mapangapti Kadin prasida sareng ngicenin kontribusi ngawangun
  Bali miwah Rapimnas sane kalaksanayang prasida mamargi antar tur sidakarya.\\nTios
  ring punika, Ketua Umum Kadin Indonesia Rosan Perkasa Roeslani sajeroning sambrama
  wacanannyane ngaturang pamuji sajeroning program sane sampun prasida kamargiang
  Pemerintah Provinsi Bali sajeroning ngemit alam miwah budaya Bali. Manutnyane, alam,
  seni, miwah budaya sane kadruenang Bali patut kakemit becik-becik.\\n\\\"Bali puniki
  yan nirgamayang satmaka anak bajang sane jegeg. Sami jadmane dot rauh ka Bali. Patut
  kakemit adat istiadat, seni, miwah budayannyane sane sayuwakti sampun kukuh pisan.
  Kearifan lokal Bali taler mangda patut iraga dukung mangda sayan-sayan maderbe jati
  diri,\\\" baosnyane.\\nRing sajeroning acara puniki, Ibu Putri Suatini Koster sane
  ngabih Gubernur Bali taler ngawacen asiki puisi sane ngangkat tema nasionalisme
  miwah rasa tresna majeng ring negara, antuk murda \\\"Sumpah Kumbakarna\\\" rariptan
  Denok Kristianti. (Balitopnews.com/DW/Rls)\\nKomentar\"", "\"Sabtu, 29 Oktober 2011\\nAne
  malu\\ndialase ada kedis sangsiah madan I sangsiah teken bojog madan I bojog. I\\nsangsiah
  teken I bojog masawitra. Sedek dina anu I sangsiah cagcag-cigcig\\nngalih padang
  , ambengan\\nmuah don kayu ane tuh. Ento anggone ngae sebum dicarang kayune, sawireh
  ia\\nmekire matulung.sedek iteha ia ngae sebum, saget I bojog suba negak\\ndisampingne.
  Pabaliha I sangsiah ngae sebum. Disubane pragat sebum I sangsiahe\\nlantas ia mareren
  sambilange marembugan ngajak I bojog.\\n\u201cih, bojog,\\napa awinan iba tusing
  nyak ngae umah? Keto men panak ibane idah ideh gandong\\niba. Sing padalem panak
  cenik, uli mara lekad ajak maidehan. Yen keto, apa\\ngunane iba ngelah lima ,\\nngelah
  batis? Awak ibane siteng, batek ngae umah dogen iba tuara ngidayang.\\nTuah saja
  iba buron kaliwat belog. Kaling ka ngelah karirihan, ngae umah dogen\\niba tuara
  bisa!\u201d\\nMara keto\\nmunyin I sangsiahe, jeg gedeg tur jengah I bojog, lantas
  masaut banggras tur\\nmatbat,\u201dih, iba kedis sangsiah, kenken to munyin ibane
  ibusan, kai tusing\\nngelah karirihan? Nah, apang tawang nyai, kai mula terehan
  bojog mawisesa,\\nngidang ngabut gunung. Leluhur kaine kakaula baan Betara Rama.
  Ane malu duga\\npamargan Ida Betara Ramane magebug ka lengka pura, leluhur kaine
  ngidayang ngae\\nkreteg di pasihe mambahan ka lengka pura. Pamuput nyidayang ngalahang
  maharaja\\nRahwana muah sakadang warganida. Bas kaliwat\\niba cangkah-cumangkah
  mapitutur teken kai. Nah ne tolih sebum ibane\\njani,\u201d\\nLantas\\nkabesbes
  sebum I sangsiahe. Disubane telah uug, kaentungang maidehan kanti\\nbenyah latig.
  I sangsiah sebet mimbuh jengah kenehne nepukin bikas I bojog buka\\nketo. Kabarat-kabirit
  pakeber I sangsiahe mangenang sebune kabesbes , maslambeh\\nmidehan uuga teken I
  bojog. I sangsiah lantas nguningang tingkah I bojoge corah\\nring ida pranda. Kenehne
  apange I bojog kadanda olih ida pranda. Sakewale ida\\npranda tusing dadi niwakang
  danda. Sawireh keto nyangetang jengah kemehne I\\nsangsiahe, krana tusing maan lamun
  kenehne. Pamuputne ia sebet tur sedih padidi.\\nKeto\\nkatuturan I bojog buin bangkung.
  Buka I bojog. Sebeneh-beneh anak nuturin\\nkatampi jelek.\\nRead More......\"",
  "\"Usul malih rauh saking DPRD Bali, sasampun wenten wacana indik plat kendaraan
  saking dura Bali kalarang ngeranjing ke Bali duk Nataru, sane mangkin Ketua Komisi
  II DPRD Bali, Agung Bagus Pratiksa Linggih, ngusulang ngalihang margi ring Pelabuhan
  Gilimanuk, Jembrana, ring rahina Natal 2024 miwah warsa anyar 2025.\\nManut dane,
  puniki pinaka pemargi anggen ngirangin kemacetan.\\n\\\"Napi malih bus ageng miwah
  alit, sane nenten kendaraan swasta, anggen ngirangin kemacetan,\\\" baos dane risampune
  matemu sareng Dinas Perhubungan Bali, Selasa (10/12/2024).\\nAgung ngusulang mangda
  transportasi wisata rute darat kaalih ke rute Kabupaten Buleleng rikala Natal lan
  Tahun Baru (Nataru), lempas saking ngilangang macet, taler kaaptiang presida ngenalang
  destinasi wisata tiosan ring Bali Selatan.\\n\\\"Pengalihan ke Buleleng liwat Bedugul
  utawi munggah ke Kintamani, minab akehan wisatawan durung taler uning wenten destinasi
  wisata sane tiosan ring Bali, dadosnyane lempas saking ngilangang macet iraga taler
  prasida ngenalang objek wisata,\\\" baos dane.\\nNyawis usulan politisi puniki sane
  taler mawit saking Buleleng, Kepala Dinas Perhubungan Bali, IGW, Samsi Gunarta,
  maosang inggian utsaha ngirangin kemacetan rikala Natal lan Tahun Baru (Nataru)
  patut kapikayunin becik-becik.\\nUnteng kemacetan inggih punika ring pamedalan Bali
  minakadi bandara lan pelabuhan, taler genah wisata, pamekas ring tigang rahina sadurung
  Natal 2024 lan Tahun Baru 2025. (ANTARA)\\nNgantisipasi Kemacetan Natal, Bus Wisata
  Sane Kausulang Lewat Buleleng\\n\u00d7\\n0Komentar\"", "\"tag:blogger.com,1999:blog-21317245230360641242024-09-26T19:38:37.019-07:00Kumpulan
  Satua BaliOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.comBlogger29125tag:blogger.com,1999:blog-2131724523036064124.post-87429521577927292552013-08-30T05:30:00.000-07:002013-08-30T05:30:14.704-07:00About\\n\\nBerikut
  sedikit pemaparan tentang satua-bali.blogspot.com\\n\\n\\n\\nApa?\\n\\n\\nApa tujuan
  blog satua-bali dibuat?\\n\\n\\n\\n\\n\\n\\nBlog satua-bali.blogspot.com bertujuan
  untuk mengumpulkan satua-satua bali yang memiliki nilai budi pekerti tinggi, serta
  mempermudah akses terhadap satua-satua bali baik oleh orang tua maupun anak-anak.
  Mengingat jaman sekarang gadget pintar dan internet bukanlah hal yang asing bagi
  anak-anak maupun orang tua, dan juga buku2 satua bali mulai susah dan jarang dimiliki
  orang tua. Melestarikan budaya dalam bidang IT? Semoga blog kecil ini bermanfaat
  :).\\n\\nApa satua-bali.blogspot.com memberikan kontenya dicantumkan di blog/website
  lain?\\n\\n\\n\\n\\n\\n\\n\\nsaya secara pribadi tidak melarang konten dalam blog
  ini diposting/dimuat di blog/website lain, justru saya sangat senag kare hal tersebut
  akan semakin memperkaya dan mempermudah akses ke satua-bali yang bisa dijadikan
  bahan ajar budi pekerti ke anak-anak agar mereka menjadi generasi yang baik, karena
  ilmu pengetahuan juga harus diimbangi dengan budi pekerti yang baik.\\n\\n\\n\\nBagaimana?\\n\\n\\nBagaimana
  blog satua-bali menghargai karya seseorang?\\n\\n\\nMenghargai karya orang lain
  maupun teman bloger lain saya wujudkan dengan mencantumkan sumber dari tiap post
  yang tidak saya ketik sendiri. hal ini sebagai bentuk penghargaan atas jerih payah
  teman2 yang telah mengetik ulang naskah satua-bali ini dari buku sumbernya.\\n\\nBagaimana
  blog satua-bali mendapatkan materi cerita?\\n\\n\\nBlog satua-bali.blogspot.com
  mendapat materi cerita dari buku maupun dari websiteblog lain karena blog ini khusus
  untuk menguplkan satua bali sebanyak mugkin. terkadang teman lain memiliki blog
  yang berisikan satua-bali namun blog teman tersebut adalah blog umum dengan berbagai
  macam informasi menarik lainya sehingga tidak menghusus. saya rangkum cerita-cerita
  tersebut untuk mempermudah dalam mengaksesnya.\\n\\nBagaimana cara membantu blog
  satua-bali?\\n\\n\\n\\nApabila ada teman yang mau / mempunyai cerita bali lainya
  selain yang ada di blog ini dan ingin satuanya ditampilkan, bisa menghubugi saya
  dan mengirim e-mail satua teman-teman yang nantinya akan saya tampilkan di blog
  ini :)\\n\\nSiapa?\\n\\n\\nSiapa dibalik blog satua-bali.blogspot.com?\\n\\n\\nSaya
  seorang pemuda bali yang ingin melestarikan budaya bali, kita tidakboleh lupa akan
  identitas walaupun kita diterpa oleh angin globalisasi, kita tetap harus mengikuti
  perkembangan jaman tanpa menghilagkan jati diri, toh budaya balipulalah yang menjadi
  daya tarik bali dan taksunya bali.\\n\\nSiapa sasaran blog satua-bali?\\n\\n\\nPosting
  ataupun satua bai dalam blog ini bertujuan untuk anak-anak muda bali agar mereka
  tidak lupa dan bisa belajar budi pekerti dari cerita turun temurun yang sudah jelas
  memiliki ajaran budi pekerti yang baik. selain itu juga untuk orang tua, mempermudah
  mendapatkan materi satua bali yang bisa di akses melalui web baik dari komputer,
  tablet maupun semartphonenya.\\n\\n\\n\\nMengapa?\\n\\n\\n\\nMengapa satua-bali
  memanfaatkan blogspot.com?\\n\\n\\nBlogspot/blogger.com memiliki layanan service
  yang handal, bandwidth yang besar, fleksibel untuk kotumisasi dibandigkan penyedia
  layanan blog lain. Selain itu blogger.com juga merupakan bawahan dari google.com
  sehingga berbagai service google.com bisa disinkronkan disini. begitu pula dalam
  bidang keamanan lebih terjamin. :)\\n\\n\\n\\n\\n\\n\\n\\nSEMOGA BLOG INI BERMANFAAT
  UNTUK KAWAN SEMUA, TRIMAKASIH ATAS KUNJUNGAN ANDA, SUKSEMA\\n\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0tag:blogger.com,1999:blog-2131724523036064124.post-15682174825534400842013-08-29T20:37:00.002-07:002013-08-30T04:30:25.148-07:00Satua
  Bali : I Lutung\\n\\n\\nIlustrasi oleh : Komang Roy Prismayudi\\n\\nAda tuturan
  satua I Lutung teken I Kekua. I Lutung sedek masayuban di beten kayune, saget dingeha
  I Kekua nyesel iba,kene munyine,\\n\\n\u201d Beh, kene lacure, masan ujan-ujan keweh
  pesan ngalih amah, yen makelo kene, sing buungan deweke lakar mati\u201d.\\n\\nMara
  ningeh munyi keto I Lutung maekin tongose ento. Saget tepukina I Kekua berag akig,
  sajan mirib tuna amah.\\nLantas I Lutung ngomong nimbal,\\n\\n\u201cIh Kekua, suud
  monto maselselan. Ne awake nepukin tongos melah ditu dauh tukad cengcenge ada pondok,
  ento pondok I Kaki Perodong. Disisin abiane bek ada punyan biu.\\n\\nAbulan ane
  suba liwat awake maan liwat ditu. Buine liu wayah-wayah, mirib jani suba pada nasak\u201d.\\n\\nBeh,
  prejani ilang sedukne I Kekua, mara ningeh orta keto. Demen kenehne lakar ngamah
  biu nasak,\\nlaut ia masaut enggal,\\n\\n\u201d Aduh Sang Lutung, yen keto apa kaden
  melahne, nanging kenken kema, sawireh pondoke ento joh, tukad cengcenge linggah,
  buina keweh pesan ngliwat\u201d.\\n\\nMara keto munyine I Kekua, lantas I Lutung
  masaut,\\n\\n\u201d Beh, belog iba Kekua! Cai kaden dueg nglangi, yen tuah cai sakti,
  jalan kema sibarengan. Gandong awake ngliwatin tukad, suba neked ditu, awake menek
  punyan biu, cai ngantosang beten di bongkolne. Yen maan biu tetelu, cai abesik awake
  dadua\u201d.\\n\\nGelisang satua enggal, majalan kone ajaka dadua ngliwatin tukad
  cengcenge,\\nI Lutung magandong ditundun I Kekuane.\\n\\nNgesir pejalane I Kekua
  nut yeh, wireh ia dueg nglangi. I Lutung sambilanga kejengat-kejengit negak ditundun
  I Kekuane.\\n\\nEnggal kone nganteg disisin tukade, lantas bareng majalan, tur saget
  ngenah ada pondok. Pondoke ento gelah I Kaki Perodong ditu lantas I Lutung tolah-tolih
  ngiwasang I Kaki Perodong.\\n\\nKekaden I Lutung pondoke suung, ngenggalang ia menek
  punyan biu ane sedeng mabuah nasak.\\n\\nI Kekua ngantosang di bongkol punyan biune.\\n\\nGelisang
  satua I Lutung ngempok biu masane nasa duang bulih, tur peluta amaha maka dadua.
  I kekua baanga kulitne dogen.\\n\\nMakelo-kelo I Kekua gedeg sawireh I Lutung tusing
  satunit teken janji. Jeg ia pragat maan kulit biune dogen.\\n\\nSedeng iteha I Lutung
  ngamah biu, lantas teka I Kaki Perodong ngaba tumbak lanying\\n\\ntur ngomong,\\n\\n\u201d
  Bah, ne I Lutung ngamah biune, jani lakar matiang!\u201d.\\n\\nI Kekua mengkeb di
  beten punyan biune, Kaki Perodong majalan adeng-adeng ngintip I Lutung.\\n\\nI Lutung
  kaliwat demen kenehne ngamah biu nasak, tusing tau teken ketekan baya, iteh ngamah
  biu nasak di punya.\\n\\nSedeng iteha I Lutung ngamah biu lantas katumbak baan I
  Kaki Perodong beneng lambungne.\\n\\nI Lutung maglebug ulung ka tanahe lantas mati.
  Bangken I Lutung tadtade kapondoke ban I Kaki Perodong.\\n\\n****\\n\\nKeto suba
  upah anake demen mamaling tur demen nguluk-nguluk timpal.\\n\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com2Tembuku,
