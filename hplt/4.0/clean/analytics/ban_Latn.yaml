  Bali : I Tuung Kuning\\n\\n\\n\\nAda tuturan satua, babotoh k\u00eambar madan I
  Pudak. Ia kasap p\u00easan kon\u00e9 mamotoh, buin m\u00ealah kon\u00e9 parann\u00e9
  nyak mat\u00eabah. Ia ng\u00ealah kurungan simalun\u00e9 tuwah dadua, jani s\u00eakat\u00e9
  p\u00eap\u00easan m\u00eanang ia mataj\u00e9n, ng\u00ealiunang dog\u00e9n kurungan\u00e9.
  Mak\u00ealo-k\u00ealo nganti p\u00eanyatusan ia ng\u00ealah kurungan. Nganti k\u00e9w\u00eah
  kur\u00eanan\u00e9 bar\u00eang ng\u00eancanin, maang ngamah magadang. Kur\u00eanan\u00e9
  b\u00ealing g\u00ead\u00e9 lantasan, aji nyampatang tain\u00e9 s\u00ealid sanja
  dog\u00e9n suba k\u00e9w\u00eah. Siapn\u00e9 dog\u00e9n mandus apang t\u00ealu an\u00e9
  awai, amah-amahan\u00e9 s\u00eam\u00eangan jagung, t\u00eangai god\u00eam, sanj\u00ea
  gabah, miwah awakn\u00e9 k\u00eap\u00eal-k\u00eap\u00eal\u00ea. Map\u00easuang sabilang
  wai apang k\u00eana matan ai s\u00eam\u00eangan. Kadi rasa I Pudak sing mandus an\u00e9
  awai ulian ng\u00eancanang siapn\u00e9 totonan. Kac\u00earita I Pudak lakar luas
  ka dajan gunung, mab\u00eas\u00ean kon\u00e9 ia t\u00eak\u00e9n kur\u00eanan\u00e9,
  \u201cWayan, Wayan mani wak\u00ea lakar luas joh, n\u00e9 nyai k\u00e9n\u00e9 b\u00ealing
  g\u00ead\u00e9, wak\u00e9 tond\u00e9n karoan mak\u00ealon\u00e9 luas, sing satond\u00e9n
  t\u00eaka nyai suba ng\u00ealah panak, lamun muani anak\u00e9 c\u00earik, m\u00ealahang
  m\u00ean miara, lamun luh matiang dog\u00e9n t\u00eandasn\u00e9, t\u00eakt\u00eak
  baang kurungan\u00e9 mak\u00eajang pada ab\u00eadik. Wak\u00e9 tusing y\u00eang
  gati ng\u00ealah pianak luh, I d\u00e9w\u00e9k tuyuh ng\u00ead\u00e9nang dog\u00e9n
  m\u00eagadangin p\u00eat\u00eang l\u00eamah, suba dog\u00e9n k\u00ealih pisagan\u00e9
  manjakang\u201d. K\u00e9to pab\u00eas\u00ean I Pudak t\u00eak\u00e9n kur\u00eanan\u00e9,
  nyak kon\u00e9 an\u00e9 luh ngid\u00eapang. Nah buin manin\u00e9 luas kon\u00e9
  suba I Pudak. Mara mak\u00eat\u00ealun I Pudak luas ka D\u00e9n Bukit, kur\u00eanan\u00e9
  ng\u00ealah lantas pianak, laut luh kon\u00e9 pianakn\u00e9. B\u00e9h k\u00e9w\u00eah
  gati m\u00e9m\u00e9n anak\u00e9 c\u00earik \u00eanto. \u201cN\u00e9 k\u00e9nk\u00e9nang
  jani I c\u00eaning, konkona n\u00eakt\u00eak lantas t\u00eak\u00e9n bapan\u00e9,
  laut baang siap. Yan tuutang k\u00ean\u00eah bapan\u00e9, pianak matiang, jabin
  j\u00eal\u00eam\u00ea buduh. N\u00e9 k\u00e9nk\u00e9n jani baan madaya\u201d. K\u00e9to
  abat m\u00e9m\u00e9n anak\u00e9 c\u00earik ngr\u00eangk\u00eang padidiana. Mak\u00ealo
  kon\u00e9 baana b\u00eangong, lantas tumbuh dayan\u00e9 m\u00e9m\u00e9n anak\u00e9
  c\u00earik. \u201cAh, ari-arin\u00e9 dog\u00e9n t\u00eakt\u00eak baang siap pada
  mab\u00eadik\u201d. Kac\u00earita ari-arin\u00e9 dog\u00e9n lantas t\u00eakt\u00eaka,
  to lantas banga siap\u00e9 pad\u00ea mab\u00eadik. Pianakn\u00e9 adanina Ni Tuwung
  Kuning. Suba kon\u00e9 k\u00e9to, anak\u00e9 c\u00earik ajaka lantas kumah m\u00e9m\u00e9n\u00e9.
  T\u00eak\u00ead kon\u00e9 ditu, t\u00eangk\u00eajut lantas dadongn\u00e9. \u201cN\u00e9
  kali k\u00e9nk\u00e9n nyai ng\u00ealah pianak c\u00earik?\u201d \u201cI Busan m\u00e9m\u00e9\u201d,
  \u201cDadi mara mak\u00eaplos panak nyain\u00e9 suba ajak mai?\u201d \u201cK\u00e9n\u00e9
  m\u00e9m\u00e9, ad\u00ea pab\u00eas\u00ean bapann\u00e9 I pidan, anak konkona n\u00eakt\u00eak
  maang siap, y\u00e9n luh panak\u00e9. To kranan\u00e9 anak\u00e9 c\u00earik ajak
  icang mai. M\u00e9m\u00e9 ngajak I c\u00eaning nah?\u201d. Icang takut ngajak jumah
  ny\u00e9n t\u00eaka bapann\u00e9, payu l\u00eampagina icang, anak iya brangsongan
  p\u00easan. Ny\u00e9n lamun ia t\u00eaka lakar orahang suba mati dog\u00e9n I c\u00eaning\u201d.
  Masaut m\u00e9m\u00e9n\u00e9 \u201cnah lamun k\u00e9to, dini suba p\u00eajang I
  c\u00eaning m\u00e9m\u00e9 ngajak. Ing\u00eatang ny\u00e9n n\u00ealok-n\u00ealokin
  mai baang y\u00e9h nyonyo\u201d \u201cNah, m\u00e9m\u00e9, dong j\u00eamakin I c\u00eaning,
  icang mulih, ny\u00e9n t\u00eaka bapann\u00e9\u201d. J\u00eamakina lantas anak\u00e9
  c\u00earik baan m\u00e9m\u00e9n\u00e9. Suba k\u00e9to m\u00e9m\u00e9n anak\u00e9
  c\u00earik ng\u00e9nggalang mulih. Kac\u00earita jani, s\u00ealid sanja kon\u00e9
  d\u00ealokina anak\u00e9 c\u00earik t\u00eak\u00e9n m\u00e9m\u00e9n\u00e9 panyonyoina
  dog\u00e9n, suud k\u00e9to ng\u00eanggalang kon\u00e9 ia mulih. Kad\u00e9na buin
  k\u00eaj\u00eapn\u00e9 bapan\u00e9 mulih, tusing masih ada. Buin abulan masih tusing
  t\u00eaka. Nganti tibanan kon\u00e9 kur\u00eanan\u00e9 luas. Kac\u00earitayang jani,
  ngancan k\u00ealih ngancan j\u00eam\u00eat Ni Tuwung Kuning magarapan. Yan kudang
  taun mak\u00ealon\u00e9 I Pudak luas mataj\u00e9n, critayang jani ia suba mulih
  pipisn\u00e9 t\u00ealah kalah, tuwing \u00eanu nang ak\u00e9t\u00e9ng. T\u00eak\u00ead
  jumahn\u00e9 ia nakonang pianakn\u00e9. Kur\u00eanan\u00e9 ngorahang pianakn\u00e9
  luh tur suba t\u00eakt\u00eaka baang\u00ea siap. Siapn\u00e9 makruyuk, ngorahang
  pianakn\u00e9 kingsananga jumah dadongn\u00e9, tur ari-arin\u00e9 t\u00eakt\u00eaka
  banga siap. Kakruyuk siap\u00e9 k\u00e9to dog\u00e9n, laut kur\u00eanan\u00e9 kaukina.
  Kur\u00eanan\u00e9 konkona ngalih pianakn\u00e9 ka umah dadongn\u00e9. Ni Tuwung
  Kuning aliha ajaka mulih. T\u00eak\u00ead jumah ia lantas ajaka ka alas\u00e9. Di
  T\u00eangah alas\u00e9 Ni Tuwung Kuning nagih matianga. J\u00eag t\u00eaka d\u00eadarin\u00e9
  nyaup Ni Tuwung Kuning. Ni Tuwung Kuning siluranga aji g\u00ead\u00eabong. I Pudak
  sahasa n\u00eakt\u00eak g\u00ead\u00eabong, abana mulih. T\u00eak\u00ead jumah baanga
  siapn\u00e9. R\u00earaman\u00e9 pada s\u00eab\u00eat ning\u00eahang I Pudak n\u00eakt\u00eak
  pianakn\u00e9 anggona amah-amahan siap, nanging I Pudak tusing pisan ya ning\u00eahang
  tutur r\u00earaman\u00e9 totonan. Mak\u00ealo-k\u00ealo I Pudak suba tuw\u00ea,
  kadi rasa majalan suba tusing ngidang. S\u00eakancan p\u00eanyakit\u00e9 an\u00e9
  ada, m\u00eac\u00eal\u00eap di awakn\u00e9 I Pudak, kran\u00ea ia tusing ng\u00ealah
  s\u00eantana, tusing ada an\u00e9 mamanjakin ia, rikalaning ia nagih d\u00eadaaran,
  tusing ada an\u00e9 ny\u00eamakang, ditu lantas ia I Pudak mas\u00eas\u00ealan.
  K\u00eato suba karma phalan\u00e9 anak\u00e9 an\u00e9 d\u00eam\u00ean mamotoh, tusing
  d\u00eam\u00ean ngurus pianak, kur\u00eanan tusing sayang, r\u00earam\u00ea mak\u00eajang
  ng\u00eajoh, k\u00e9to masih Widin\u00e9 ng\u00eajoh t\u00eak\u00ean I rag\u00ea.\\n\\nSumber
