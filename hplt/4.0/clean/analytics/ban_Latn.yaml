sample: '["\"Selamat Datang! Rahajeng Rauh! Dominus Vobis Cum!\\nIda Sri Y\u00e9sus
  kaluwihang antuk kawis\u00e9san ka-Widi-an Idan\u00e9,\\npara utusan Widi san\u00e9
  agung rauh nangkil buat mabebaosan sareng Ida.\\nNgiring sareng ngawangun pondok
  san\u00e9 suci ring jiwan iraga katur ring Ida.\\nMelalui media sederhana ini, sebagai
  oleh-oleh dari Tuka kami ingin berbagi kasih bersama anda melalui firman Tuhan berikut
  ini:\\nMatius 23:1-12\\nIda Sri Y\u00e9sus miteketin para murid\u00e9\\n1 Raris
  Ida Sri Y\u00e9sus mawecana ring anak\u00e9 ak\u00e9h miwah ring para murid Idan\u00e9,
  pangandikan\u00e9: 2 \u201cPara pawikan Taurat miwah soroh Farisi mula kic\u00e9n
  wewenang ngalanturang paurukan Nabi Musa. 3 Ento awanan\u00e9, tinutin ja tur laksanayang
  ja salwir an\u00e9 suba kaurukang tek\u00e9n cening, sak\u00e9wala pagaw\u00e9nnyan\u00e9
  eda tuutina, duaning dan\u00e9 pada ngajahin nanging tusing ngalaksanayang. 4 Dan\u00e9
  pada meselin tetegenan an\u00e9 baat-baat, laut kapategenang tek\u00e9n anak l\u00e9n,
  nanging dan\u00e9 n\u00e9w\u00e9k ngusud dog\u00e9n ko tuara nyak! 5 Salwir pagaw\u00e9nn\u00e9
  an\u00e9 kalaksanayang tuah apanga pabaliha baan anak\u00e9; kala ngastawa dan\u00e9
  nganggon tali tekes an\u00e9 lumbang tur rambun jubah an\u00e9 dawa-dawa; 6 y\u00e9n
  nuju kundangan dan\u00e9 demen negak di tongos\u00e9 an\u00e9 utama, tur y\u00e9n
  di bal\u00e9 pabaktian\u00e9 ia mudiang tongos di arep; 7 demen katunas-lugrahin
  di peken-peken\u00e9 tur demen kasambat \u2018gurun titiang\u2019. 8 Nanging y\u00e9n
  di pantaran c\u00e9ning\u00e9, eda pesan ada an\u00e9 mabudi kasambat \u2018gurun
  titiang\u2019, sawir\u00e9h Gurun cening\u00e9 tuah adiri, tur cening makejang tuah
  patuh paturu nyama. 9 Buina dini di mercapadan\u00e9 eda ja cening nyambatang iny\u00e9n
  ja dadi \u2018palungguh aji\u2019, krana tuah adiri Ajin cening\u00e9, sing ada
  l\u00e9n Ida Sang Aji di Swarga. 10 Eda masih cening mabudi kasambat pamimpin, sawir\u00e9h
  tuah adiri Pamimpin cening\u00e9, nah ento Sang M\u00e9sias. 11 Ny\u00e9n ja an\u00e9
  paling agunga di pantaran cening\u00e9, patut ia dadi pangayah di pantaran cening\u00e9.
