  Bali : Pan Balang Tamak\\n\\n\\n\\n\\nAda reko anak madan Pan Balang Tamak, maumah
  di d\u00e9sa anu. Kacrita ia sugih pesan tur ririh makruna, muah tuara nyak kalah
  tek\u00e9n pada timpaln\u00e9 di d\u00e9\u015ba totonan. Baan t\u00e9 saking kruna
  daya upayan\u00e9 anggona ngamusuhin d\u00e9\u015ban\u00e9. Y\u00e9n upamaang dayan
  Pan Balang Tamak\u00e9, patuh buka bun slingkad lutung\u00e9, baan saking beneh.
  Ento kranan\u00e9 Pan Balang Tamak sengitanga baan d\u00e9san\u00e9. Y\u00e9n tuah
  dadi baan d\u00e9san\u00e9, apanga ia makisid wiadin mati apanga sing ada enu nongos
  di d\u00e9san\u00e9 totonan. Baan t\u00e9 tra ada mintulin paga\u00e9n d\u00e9san\u00e9,
  bakal nga\u00e9nang dosan Pan Balang Tamak\u00e9 ento.\\n\\nDi sedek dina anu paum
  d\u00e9san\u00e9 bakal nayanang Pan Balang Tamak, mangd\u00e9n\u00e9 ia kena danda.
  Lantas panyarikan d\u00e9san\u00e9 nund\u00e9n ngarahin Pan Balang Tamak, k\u00e9n\u00e9
  arah-arahn\u00e9, \u201dIh Pan Balang Tamak, mani semengan mara tuun siap, d\u00e9san\u00e9
  luas ka gunung ngalih kayu, bakal anggon menahin bal\u00e9 agung. Ny\u00e9n ja kas\u00e9pan,
  bakal danda.\u201d K\u00e9to arah-arah\u00e9 tek\u00e9n Pan Balang Tamak.\\n\\nKacarita
  manin\u00e9 semangan mara tuun siyap, lus d\u00e9san\u00e9 makejang, nanging Pan
  Balang Tamak masih enu jumah padidian, krana ia ngantiang siapn\u00e9 tuun uli bengbengan\u00e9.
  Makelo ia ngantiang, tond\u00e9n masih siapn\u00e9 tuun. Ada jenengn\u00e9 makakali
  tepet, mara siapn\u00e9 tuun uli di bengbengan\u00e9, ditu mara ia majalan, nututin
  d\u00e9san\u00e9 luas ngalih kayu ka gunung. Tond\u00e9n makelo ia majalan, tepukina
  krama d\u00e9san\u00e9 suba pada mulih negen kayu, dadi Pan Balang Tamak milu malipetan.
  Kacrita suba neked jumah, lantas d\u00e9san\u00e9 paum, maumang Pan Balang Tamak
  lakar kena danda, krana ia tuara nuutang arah-arah\u00e9. Ditu laut d\u00e9san\u00e9
  nund\u00e9n ngarahin Pan Balang Tamak.\\n\\nKacrita Pan Balang Tamak suba teka,
  lantas klihan d\u00e9san\u00e9 makruna, \u201dIh Pan Balang Tamak, jani cai kena
  danda. Masaut panyarikan d\u00e9san\u00e9, \u201dEnto baan cain\u00e9 tuara ngidepang
  arah-arah\u00e9 ngalih kayu ka gunung.\u201d \u201dMangkin, mangkin jero panyarikan,
  sampunang jeron\u00e9 ngandikayang titiang tuara ngidepang arah-arah\u00e9, d\u00e9ning
  k\u00e9nten arah-arah\u00e9 an\u00e9 teka tek\u00e9n titiang: d\u00e9san\u00e9 mani
  semengan mara tuun siap bakal luas ka gunung. D\u00e9ning tiang ngelah ayam asiki
  buin sedek makaem, dadi makelo antiang tiang tuunn\u00e9 uli di bengbengan\u00e9.
  W\u00e9nten manawi sampun kali tepet, mara ipun tuun. Irika raris titiang mamargi,
  nuutang sakadi arah-arah\u00e9 an\u00e9 teka tek\u00e9n tiang. \u00c9ngken awanan
  tiang\u00e9 kena danda?\u201d K\u00e9to munyin Pan Balang Tamak\u00e9, dadi d\u00e9san\u00e9
  sing ada ngelah keneh nglawan paksann\u00e9 Pan Balang Tamak.\\n\\nKacrita buin
  maninn\u00e9 Pan Balang Tamak karaahin ngaba sengauk, bekel menahang bal\u00e9 agung.
  Pan Balang Tamak ngaba sanggah uug ka pura d\u00e9sa sambilanga makruna k\u00e9n\u00e9,
  \u201dEn\u00e9 sanggah uug, apanga benahanga baan d\u00e9san\u00e9.\u201d Dadi engon
  d\u00e9san\u00e9 ngenot abet Pan Balang Tamak\u00e9 k\u00e9to. Baan k\u00e9to masih
  tan sah keneh d\u00e9san\u00e9 bakal nga\u00e9nang salah Pan Balang Tamak\u00e9.\\n\\nManinn\u00e9
  Pan Balang Tamak kaarahin maboros ka gunung. K\u00e9n\u00e9 arah-arah\u00e9, \u201dMani
  d\u00e9san\u00e9 maboros, apanga ngaba cicing galak. Ny\u00e9n ja tuara ngelah cicing
  galak, lakar kena danda.\u201d K\u00e9to arah-arah\u00e9 arah-arah\u00e9 an\u00e9
  teka tek\u00e9n Pan Balang Tamak. Krama d\u00e9san\u00e9 suba pada yatna, n\u00e9n\u00e9
  tuara ngelah cicing galak, pada nyilih. Y\u00e9n Pan Balang Tamak ngelah kuluk bengil
  aukud buin tuara pati bisa malaib.\\n\\nKocap buin maninn\u00e9 las d\u00e9san\u00e9
  maboros, tur pada ngaba cicing galak-galak, ngliwat pangkung ngr\u00e9mb\u00e9ngan
  dalem-dalem. Y\u00e9n Pan Balang Tamak majalan paling durina pesan sambilanga nyangkol
  cicingn\u00e9. Mara ia neked sig ngr\u00e9mb\u00e9ng\u00e9, sing dadi baana ngliwat,
  lantas ia nga\u00e9 daya apang mangd\u00e9n d\u00e9san\u00e9 teka nyagjagin ibann\u00e9,
  laut ia jerit-jerit. \u201dBangkung tra gigina, bangkung tra gigina.\u201d Mara
  dingeha baan d\u00e9san\u00e9, kad\u00e9na timpaln\u00e9 nepukin bangkung, lantas
  pada nyagjagin. Mara neked ditu enota Pan Balang Tamak jerit-jerit, lantas takonina:
  \u201dApa kendehang Pan Balang Tamak?\u201d Masaut Pan Balang Tamak, k\u00e9n\u00e9
  pasautn\u00e9, \u201dPangkung tra ada titina.\u201d B\u00e9h, sengap d\u00e9\u015ban\u00e9,
  belog-beloga baan Pan Balang Tamak. Payu baangina titi, gantin Pan Balang Tamak\u00e9
  tuara kena danda. Kacrita suba neked di alas\u00e9, lantas d\u00e9\u015ban\u00e9
  pada ngandupang cicingn\u00e9 ka tengah bet\u00e9, ada n\u00e9 ngepung kidang, ada
  ngepung c\u00e9l\u00e9ng, ada ngepung manjangan, ada ngongkong bojog sig punyan
  kayun\u00e9. Y\u00e9n Pan Balang Tamak kelad-kelid sambilanga nyangkol cicingn\u00e9
  mara neked punyan k\u00e9tk\u00e9t\u00e9. Lantas entunganga cicingn\u00e9 ka punyan
  k\u00e9tk\u00e9t\u00e9. Ditu koang-koang cicingn\u00e9 ngengsut, tuara bisa tuun,
  tra bisa men\u00e9k, laut Pan Balang Tamak masaut: \u201dIh jero d\u00e9\u015ba,
  tingalin cicing tiang\u00e9 ngraras ka punyan k\u00e9tk\u00e9t\u00e9. Ny\u00e9n
  d\u00e9\u015ban\u00e9 ngelah cicing galak buka cicing tiang\u00e9? Jani tiang nandain
  d\u00e9\u015ban\u00e9, baan d\u00e9\u015ban\u00e9 sing ada ngelah cicing galak buka
  cicing tiang\u00e9.\u201d K\u00e9to munyin Pan Balang Tamak\u00e9, dadi d\u00e9\u015ban\u00e9
  sing ada bisa masaut, payu kenaina danda baan Pan Balang Tamak. Suba kon\u00e9 k\u00e9to
  lantas pada mulih maboros.\\n\\nKacrita maninn\u00e9 buin karahin Pan Balang Tamak,
  y\u00e9n d\u00e9\u015ban\u00e9 mani sangkep di bale banjar\u00e9. Mara Pan Balang
  Tamak ningeh arah-arah\u00e9 k\u00e9to, lantas ia nga\u00e9 jaja uli injin, bakal
  anggona melog-melog d\u00e9\u015ban\u00e9. Maninn\u00e9 makik\u00e9n sangkep, lantas
  Pan Balang Tamak ngaba jaja uli injin, mapulung-pulung amun tain cicing\u00e9 tek\u00e9n
  y\u00e9h, laut pejang-pejangina sig sendin bal\u00e9 banjar\u00e9 muah kecirina
  tek\u00e9n y\u00e9h. Ny\u00e9n ngad\u00e9n tra tain cicing?\\n\\nKacrita suba pepek
  d\u00e9\u015ban\u00e9, lantas Pan Balang Tamak mauar-uar, k\u00e9n\u00e9 munyin\u00e9,
  \u201dIh jero makejang, ny\u00e9n ja bani naar tain cicing\u00e9 totonan, tiang
  ngupahin pipis siu.\u201d Masaut panyarikann\u00e9, \u201dBes sigug abet\u00e9 mapeta,
  ento ny\u00e9n nyak ngamah tain cicing? Indayang cai ngamah. Lamun bani, icang ngupahin
  pipis siu.\u201d Mara k\u00e9to lantas pelen-pelena baan Pan Balang Tamak, dadi
  cengang d\u00e9\u015ban\u00e9 ngiwasin Pan Balang Tamak bani ngamah tain cicing.
  Puputn\u00e9 payu d\u00e9\u015ban\u00e9 dendaina sin baan Pan Balang Tamak. D\u00e9ning
  k\u00e9to mawuwuh-wuwuh brangtin d\u00e9\u015ban\u00e9 muah tan sah bakal nga\u00e9nang
  daya upaya, manang dan\u00e9 Pan Balang Tamak mati wiadin kena danda.\\n\\nManinn\u00e9
  buin Pan Balang Tamak kaarahin, y\u00e9n sing eda dadi ngenjek karang anak muah
  malih-alihan ka abian anak\u00e9, y\u00e9n lejeh bani, bakal kena danda ged\u00e9.
  K\u00e9to uar-uar\u00e9. Jet k\u00e9to baan Pan Balang Tamak tuara k\u00e9weh, krana
  ia saking patut. Ditu ia nga\u00e9 daya, g\u00e9r\u00e9t\u00e9 pulet\u00e9 an\u00e9
  di sisin peken\u00e9 anggona abian pagehina lidi, apesina baan benang.\\n\\nKacrita
  mara tebeng peken\u00e9, ada anak makita masakit basang, lantas nylibsib ka pulet\u00e9,
  laut masuak Pan Balang Tamak, \u201dIh jero d\u00e9\u015ba, tiang nandain anak ngamaling
  ka abian tiang\u00e9.\u201d Dadi cengang anak\u00e9 n\u00e9 masakit basang \u00e9ndahanga
  baan Pan Balang Tamak. Masaut anak\u00e9 masakit basang, \u201dApa salah tiang\u00e9,
  muah dadi nagih nandain jeron\u00e9?\u201d Masaut Pan Balang Tamak, \u201dJeron\u00e9
  macelep ka abian tiang\u00e9 muah mamaling pamula-mulaan tiang\u00e9. Ento apa bongkos
  jeron\u00e9?\u201d Mara ungkabanga, saja mrareket pulet\u00e9 sig kambenn\u00e9.
  Puputn\u00e9 payu ia dendaina baan Pan Balang Tamak.\\n\\nKacrita d\u00e9\u015ban\u00e9
  k\u00e9weh pesan ngencanin Pan Balang Tamak, daya kudang daya singa ada mintulin.
  N\u00e9 jani k\u00e9neh d\u00e9\u015ban\u00e9 bakal nunasang paporongan tek\u00e9n
  anak\u00e9 agung.\\n\\nGelisang crita, cuba kon\u00e9 kic\u00e9n cetik an\u00e9
  paling mandina, apanga Pan Balang Tamak mati sapisanan. Kocap Pan Balang Tamak suba
  ningeh bakal kaga\u00e9-ga\u00e9nang patinn\u00e9, lantas ia makruna tek\u00e9n
  kurenann\u00e9, \u201dY\u00e9n awak\u00e9 suba mati, gantungin bok awak\u00e9 temblilingan.
  Suba k\u00e9to sed\u00e9d\u00e9ngang sig piasan\u00e9. Buina pagelah-gelahan\u00e9
  pesuang, pejang sig bal\u00e9 sekenem, rurubin baan kamben putih sambilang pangelingin.
  Nah, bangk\u00e9n awak\u00e9 wadahin peti, pejang jumah met\u00e9n.\u201d\\n\\nGelisang
  crita, suba Pan Balang Tamak mati ngamah cetik paican anak\u00e9 agung. Lantas M\u00e9n
  Balang Tamak nuutang buka pabesen Pan Balang Tamak\u00e9. Kacrita d\u00e9\u015ban\u00e9
  ngintip Pan Balang Tamak, mati kalawan tan matin\u00e9. Mara ia neked jumah Pan
  Balang Tamak\u00e9, Pan Balang Tamak mased\u00e9d\u00e9g sig piasann\u00e9 sambilanga
  mamantra ngambahang bok. Ditu d\u00e9\u015ban\u00e9 maselselan, pada ngorahang cetik\u00e9
  jel\u00e9k. Lantas d\u00e9\u015ban\u00e9 buin parek ka puri, ngaturang panguninga
  y\u00e9n Pan Balang Tamak tuara mati. Mara k\u00e9to bendu anak\u00e9 agung, d\u00e9ning
  cetik\u00e9 kaaturang tra mandi. Lantas ida ngandika, \u201dK\u00e9nk\u00e9n cetik\u00e9
  dadi tra ngamatiang, indayang awak\u00e9 ngasanin. Mara ajengan ida abedik, lantas
  ida s\u00e9da prajani.\\n\\nKocap M\u00e9n Balang Tamak ningeh orta, y\u00e9n anak\u00e9
  agung suba s\u00e9da ngajengan cetik, lantas ia ng\u00e9kanang bangk\u00e9n kurenann\u00e9
  buka n\u00e9 suba.\\n\\nKacrita suba sanja, ada dusta ajaka patpat mapaiguman, bakal
  mamaling ka umah Pan Balang Tamak\u00e9. Mara enota kurenan Pan Balang Tamak\u00e9
  mangelingin kurenann\u00e9 sig bal\u00e9 sekenem\u00e9, lantas ia macelep ka umah
  met\u00e9n, tepukina peti ged\u00e9 buin baat pesan, laut sanglonga, senamina, tegena
  ajaka patpat. Suba kon\u00e9 neked ka tengah bet\u00e9, makruna timpaln\u00e9, \u201dDini
  suba gagah!\u201d Masaut timpaln\u00e9, \u201dMaebo bangk\u00e9 dini, jalan indayang
  dituan.\u201d Lantas kisidang masih maebo bangk\u00e9. Buin makruna timpaln\u00e9,
  \u201dJalan suba aba ka pura d\u00e9\u015ba, ditu ny\u00e9n bani ngutang bangkaan.\u201d
  Masaut timpaln\u00e9, \u201dJalan!\u201d Lantas tegena petin\u00e9, abana ka pura.
  Mara neked ditu, lantas ungkabanga. Mara enota bangk\u00e9n Pan Balang Tamak\u00e9
  nyengkang, lantas plaibina, kutanga petin\u00e9 ditu.\\n\\nKacrita maninn\u00e9
  mara galang kangin, nuju jero mangku ngaturang canang ka pura, mara nengok sig kori
  agung\u00e9, tingalina ada peti ged\u00e9 di natah pias\u00e9, lantas jero mangku
  masila tiding sambilanga nyumbah: \u201dBataran titiang\u00e9 mapaica, bataran titiang\u00e9
  mapaica.\u201d Baan sing ada bani mungkah, ngantiang apanga pepek d\u00e9\u015ban\u00e9
  teka. Mara teka ukud nyumbah, teka ukud nyumbah.\\n\\nSuba kon\u00e9 pepek pada
  nyumbah, lantas petin\u00e9 bungkaha, nget bangk\u00e9n Pan Balang Tamak\u00e9 nyengku,
  dadi tengkejut d\u00e9\u015ban\u00e9, buin pada misuhin bangk\u00e9n Pan Balang
  Tamak\u00e9. Ento japin pisuhin, mlutang ya, kadung suba bakat sumbah. Puputn\u00e9
  d\u00e9\u015ban\u00e9 tuyuh m\u00e9anin muah nanemang bangk\u00e9n Pan Balang Tamak\u00e9.
  K\u00e9to katuturannya.\\n\\n\\nSumber : imadesudiana.wordpress.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com1Tembuku,
