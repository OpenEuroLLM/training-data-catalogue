  Bali : Ni Bawang Teken Ni Kesuna\\nAda tuturan satua anak makurenan, ngelah kone
  pianak luh-luh duang diri. Pianakne ane kelihan madan Ni Bawang, ane cerikan madan
  Ni Kesuna. Akuren ngoyong kone di desa. Sewai-wai geginane tuah maburuh kauma.\\n\\nPianankne
  dua ento matungkasan pesan solahne. Tan bina cara gumi teken langit. Solah Ni Bawang
  ajaka Ni Kesuna matungkasan pesan, tan bina cara yeh masanding teken apine.\\n\\nNi
  Bawang anak jemet, duweg megae nulungin reramanne. Duweg masih ia ngraos, sing taen
  ne madan ngraos ane jelek-jelek. Jemet melajang raga, apa-apa ane dadi tugasne dadi
  anak luh. Marengin meme megarapan di paon, metanding canang, sing taen leb teken
  ajah-ajahan agamane. Melanan pesan ngajak nyamane Ni Kesuna. Ni Kesuna anak bobab,
  male megae, duweg pesan ngae pisuna, ento makrana memene stata ngugu pisadun Ni
  Kesuna ane ngorahang Ni Bawang ngumbang di tukade ngenemin anak truna.\\n\\nSedek
  dina anu, dugase ento sujatine Ni Bawang mara suug nglesung padi laut kayeh sambilanga
  ngaba jun anggon ngalih yeh. Krana ngugu munyin Ni Kesuna, ditu Ni Bawang lantas
  tigtiga, siama aji yeh anget tur tundena magedi.\\n\\nNi Bwang laut megedi sambilange
  ngeling sigsigan. Di subane ngutang umah, neked kone ye di tukade ketemu ajak kedis
  crukcuk kuning. Ditu i Kedis Crukcuk Kuninge kapilasa teken unduk Ni Bawange. Ni
  Bawang gotola, baanga emas-emasan, marupa pupuk, subeng, kalung, bungkung, gelang
  muah kain sutra.\\n\\nSesukat Ni Bawang ngelah panganggi ane melah-melah buka keto,
  ia nongos di umah dadongne. Tusing taen ye mulih ke umah reramanne. Kacrita jani
  Ni Kesuna kone nepukin embokne mapanganggo melah-melah, laut ia nakonang uli dija
  maan panganggo buka keto.\\n\\nDisubane orahina teken Ni Bawang, ditu laut Ni Kesuna
  metu kenehne ane kaliwat loba. Edot ngelahang penganggo lan priasan ane bungah buka
  ane gelahang embokne. Krana ento, lantas Ni Kesuna ngorahin memenne nigtig ukudane
  apang kanti babak belur.\\n\\nSesubane katigtig, lantas ia ngeling sengu-sengu ka
  tukade katemu teken I Kedis Crukcuk Kuning. Kacrita jani I Crukcuk Kuning ngotol
  ukudan Ni Kesunane, isinina gumatat-gumitit. Neked jumah ditu lantas gumatat-gumititte
  ento ane mencanen Ni Kesuna kanti ngemasin mati.\\n\\nKeto suba upah anak ane mrekak,
  setata demen mapisuna timpal, sinah muponin pala karma ane tan rahayu.\\n\\n\\nsumber
  : ngiringmabasabali.wordpress.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
