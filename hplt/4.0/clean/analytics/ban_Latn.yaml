  -8.4058201999999991 115.3904215tag:blogger.com,1999:blog-2131724523036064124.post-76800603542909310912013-08-29T19:56:00.002-07:002013-08-29T19:56:39.507-07:00Satua
  Bali : Naga Basukih\\n\\n\\nJani ada kone tutur-tuturan satua, Ida Betara Guru.
  Ida Betara Guru totonan malinggih ring Gunung Semeru, kairing olih putranidane mapesengan
  I Naga Basukih. Pesengan Idane dogen suba ngarwanang, I Naga Basukih terang gati
  suba putran Ida Betara Guru totonan maukudan Naga, marupa lelipi gede pesan sing
  keto jenenga?\\n\\npic.suryadistirablogspotNah jani sedek dina anu, kandugi enu
  ruput pesan I Naga Basukih tangkil ring ajine. Baan tumben buka semengane I Naga
  Basukih Tangkil, dadi matakon Ida Betara Guru ring putrane, \u201cUduh nanak Bagus,
  dadi tumben buka semengan I Nanak nangkilin Aji, men apa jenenga ada kabuatan I
  Nanak ring Aji, nah lautan I Nanak mabaos!\u201d Keto kone pataken Ida Betara guru
  ring putrane I Naga Basukih.\\n\\nDitu lantas I Naga Basukih matur ring Ajine, \u201cNawegang
  Aji Agung titiang kadi isenge ring sameton titiange sane wenten ring jagat Bali,
  makadi Betara Geni Jaya sane malinggih kocap ring Bukit Lempuyang, Betara Mahadewa
  kocap ring Gunung Agung, Betara Tumuwuh ring Gunung Batukaru, Betara Manik Umang
  ring Gunung Beratan, Betara Hyang Tugu di Gunung Andakasa, cutet ring sami sameton
  titiange sane wenten ring tanah Bali. Dening sampun lami pisan Aji, titiang tan
  pisan naanin mapanggih sareng sameton, nika mawinan titiang nunasang mangda sueca
  ugi maicain titiang lunga ka tanah Bali jaga ngrereh sameton titiange sami.\u201d\\n\\nBeh,
  mara keto kone aturne I naga Basukih, dadi di gelis Ida Betara Guru ngandika, \u201cUduh
  nanak Bagus, nah yan dadi baan Aji sampunang ja I Nanak lunga ka Bali buate lakar
  ngalih pasemetonan I Dewane. Nah apa lantas ngawinang dadi buka Aji mialang pamargan
  I Nanak, mapan gumi Baline totonan joh pesan uli dini. Buina yan lakar I Nanak ngalih
  gumi Baline, pajalane ngliwat pasih. Len teken totonan buat tongos sameton-sameton
  I Nanake malinggih madoh-dohan, selat alas suket madurgama. Kaparna baan Aji, minab
  lakar sengka baan I Nanak indike jaga mamanggih sameton. Buina yan pade I Nanak
  lunga, men nyen kone ajak Aji ngawaspadain utawi nureksain dini di Gunung Semeru.\u201d
  Dadi keto kone pangandikan Ida Betara Guru buka anake mialang pajalane I Naga Basukih
  unduke lakar luas ka tanah Bali.\\n\\nBaan isenge teken sameton, mimbuh baan dote
  nawang gumi Bali sing ya keto jenenga, dadi buin ngawawanin I Naga Basukih matur
  ring Betara Guru, \u201cNunas lugra Aji Agung, yening kenten antuk Aji mabaos, minab
  Aji ngandapang saha nandruhin kawisesan titiange. I wau Aji mamaosang jagat Baline
  selat pasih raris mialang pajalan titiange ka Bali, beh elah antuk titiang ngentap
  pasihe wantah aclekidek. Raris malih Aji maosang genah sameton titiange di Bali
  medoh-dohan, maselat alas suket madurgama, amunapi se ageng gumi Baline punika Aji?
  Kantun elah antuk titiang Aji. Yening Aji maicayang, punika Aji.\u201d Dadi jeg
  keto kone aturne I Naga Basukih, jeg nyampahang gumi Baline di ajeng Ida Betara
  Guru.\\n\\nNah mapan keto kone aturne I Naga Basukih, men Ida Betara Guru jog kadi
  blengbengan kayunidane miragi atur putrane. Dados jog nyampahang gumi Baline, buin
  sadah elah kone baana nguluh mapan tuah amul taluhe geden gumi Baline. Sakewala
  pamuput ngandika Ida Betara Guru teken I Naga Basukih, \u201cNanak Bagus Naga Basukih,
  Aji sing ja buin lakar mialang pajalan I Nanak ka jagat Bali, nah majalan I Nanak
  apang melah!\u201d Mara keto kone pangandikan Ajine, beh ngrigik kone I Naga Basukih,
  jog menggal-enggalan nunas mapamit ring Ida Betara Guru.\\n\\nNah jani madabdan
  kone I Naga Basukih buate luas ka Bali. Yan buat pajalane uli Gunung Semeru lakar
  ngojog Blangbangan. Di benengan majalane I Naga Basukih, asing tomploka jog pragat
  dekdek remuk. Telah punyan-punyanane balbal sabilang ane kentasin baan I Naga Basukih.
  Sing baan geden lipine ngranaang sing keto jenega? Biuna telah patlangkeb kutun
  alase mara ningalin I Naga Basukih.\\n\\nGelising satua tan ucap di jalan, jani
  suba kone neked di Blangbangan pajalane I Naga Basukih. Mapan edote apang enggal
  ja ningalin gumi Baline, dong keto ya jenenga, jani menek kone I Naga Basukih ka
  duur muncuk gununge, uli muncuk gununge totonan lantas I Naga Basukih ninjo gumi
  Baline. Bes gegaen ningalin uli joh lantasan, terang suba cenik tingalina gumi baline
  teken I Naga Basukih. Payu ngrengkeng I Naga Basukih, kene kone krengkenganne I
  Naga Basukih, \u201cBeh bes sanget baana I Aji melog-melog deweke, suba seken gumi
  Baline amul taluhe dadi mahanga lakar keweh kone deweke ngalih sameton di gumi Bali.
  Dadi buka anake sing nyager I Aji teken kesaktian deweke.\u201d\\n\\nNah keto ja
  kone pakrengkenganne I Naga Basukih. Dadi tusing pesan kone ia rungu wiadin anen
  pakrengkengane di ati tatonan kapireng olih Ida Betara Guru. Ida anak mula maraga
  mawisesa, maraga sakti, sakedap dini sakedap ditu, cara angin tuara ngenah. Dadi
  dugas I Naga Basukih ngrengkene masambilan ninjo gumi Baline uli muncuk gununge
  Ida Batara suba ditu, sakewala sing tingalina teken I Naga Basukih. Ida mula uning
  ngenah ilang.\\n\\nMen jani mapan aketo lantasan pakrengkenganne I Naga Basukih,
  ditu lantas Ida Betara Guru jog nyeleg di sampingne I Naga Basukih tumuli ngandika,
  \u201cUduh nanak Naga Basukih nganti suba pindo pireng Aji I Nanak nyampahang gumi
  Baline, I Nanak ngorahang gumi Baline totonan tuah amul taluhe. Nah jani Aji kene
  teken I Nanak, yan saja gumi Baline tuah amul taluhe buka pamunyin I Nanake, nah
  ento ada muncuk gunung ane ngenah uli dini. Yan buat gununge ento madan Gunung Sinunggal.
  Jani yan saja I Nanak sakti tur pradnyan, Aji matakon teken I Dewa, \u201cNyidaang
  ke I Nanak nguluh gununge totonan? Yang suba saja mrasidaang I Dewa nguluh, nah
  kala ditu Aji ngugu teken kawisesan I Dewane.\u201d Keto kone pangandikan Ida Betara
  Guru teken I Naga Basukih.\\n\\nBeh payu makejengan I Naga Basukih, krana tusing
  naen-naen gati dadi jog nyeleg Ajine di sampingne. Dadi mapan aketo bebaos Ida Betara
  Guru, dadi matur I Naga Basukih, \u201cInggih Aji Agung, yang wantah Aji nitah mangda
  nguluh Sinunggale, maliha yan bantas amonika pakantenan jagat Baline, yening Aji
  maicayang jagat Baline jaga uluh titiang.\u201d Keto kone aturne I Naga Basukih
  kaliwat bergah.\\n\\nMalih Ida Betara Guru ngandika, \u201cCening Naga Basukih,
  nah ene titah Ajine ane abedik malu laksanaang!\u201d\\n\\nJani madabdaban lantas
  I Naga Basukih lakar nguluh Gunung Sinunggale ane ada di tanah Bali uli di Gunung
  Blangbangane. Ditu I Naga Basukih ngentegang saha nuptupang bayu. Beh ngencorong
  paningalan I Naga Basukih neeng Gunung Sinunggale, yan rasa-rasaang tulen ja buka
  kedis sikepe di benengan nyander pitike kagangsaranne I Naga Basukih ngepet-ngepetang
  muncuk gununge.\\n\\nNah jani disubane neked di Bali, buina suba kacaplok Gunung
  Sinunggale, beh kaling ke lakar nguluh, ajin bantas mara muncukne dogen suba sing
  nyidaang I Naga Basukih ngepet-ngepetang muncuk gununge. Mapan kagedean lelipi sadah
  sambilanga maplengsagan mesuang bayu, dadi embid Gunung Sinunggale ane paek bena
  kelodne. Yan rasaang, beh cara munyin kerug sasih kaulu munyin doosanne I Naga Basukih
  amah kenyelne, masih tonden nyidaang nguluh Gunung Sinunggale.\\n\\nKacrita ne jani
  pelanan suba telah gading bayunne I Naga Basukih masih tonden nyidaang nguluh gununge.
  Undukne I Naga Basukih buka keto kaaksi olih Ida Betara Guru, mawanan di gelis Ida
  ngandika, \u201cNanak Naga Basukih, men kenken nyidaang apa tuara I Nanak nguluh
  Gunung Sinunggale?\u201d\\n\\nMara keto kone patakon Ida Betara Gurune, emeh kaliwat
  kabilbilne madukan jengah kenehne I Naga Basukih. Sakewala buin telung keto ja lakar
  ngaba jengah, lakar pragat tuara nyidaang I Naga Basukih lakar nguluh Gunung Sinunggale.
  Kaling ke nguluh makejang, ajin nguluh muncukne dogen suba nandes. Dadi sambilanga
  masemu kabilbil matur I Naga Basukih ring Ida Betara Guru.\\n\\n\u201cNawegang Aji
  Agung, kenak Aji ngampurayang indik titiange bregah saha ngandapang jagat Baline.
  Mangkin kenak Aji ngenenin upadarwa padewekan titiange baan titiang bregah!\u201d
  Keto kone aturne I Naga Basukih, jegan pragat tinut teken sapatitah Ida Betara Guru.\\n\\nNah
  sasukat I Naga Basukih nongosin Gunung Sinunggale, kapah ada linuh, kapah ada blabar,
  buina tusing pesan taen ada angin slaung sajeroning Bali.\\n\\nNah, ada buka jani
  gunuge tegeh-tegeh di Bali, ento kone mawiwit uli Gunung Mahameru ane katurunang
  di Bali olih Ida Betara Guru.\\n\\n\\nsumber : aryaoka.wordpress.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com1Tembuku,
