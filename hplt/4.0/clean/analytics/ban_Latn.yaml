  Bali : I Lutung Dadi Pecalang\\n\\n\\nilustrasi i lutung dadi pecalang\\n\\nKacerita
  I Singa madeg ratu merintah sekancan burone. I lutung dadi\\npecalang wireh keto
  nyabra dida. I lutung mideran nabdabang kekertan jagat.\\nBaan kenylne mejalan kemu-mai,
  sedek nyongkok angut-angut naenang kiap, I\\nlutung tengkejut ningehang munyin kukul
  titir; tuk, tuk, tuk\u2026,tuk, tuk, sepanan ia\\nbangun kipak-kipek liatne merengang.
  Kaget tepukine I Blatuk ngulkul di punyan\\nkayune. I lutung nyeri raosne bangras,
  \u201cIh Blatuk ngudiang iba ngukul bulus?,\\ntingkah ibane ene, ngerang gumine
  mebiayuban. Enggalang orahang teken\\nawake!\u201d,\\n\\nI Blatuk enggalang tuun,
  tumuli ngeraos dadab, \u201cinggih jero pecalang\\ntiang ngukul, wireh samian biota,
  aru-ara nandang pikeweh, punika panjak duene\\nkadung Bangkok ileh-ileh ngaba tumbak
  poleng, sapunika taler, miwah I kekawa\\nsetata masang jaring. Tiang nenten uning
  sane ngawinang, jerone sane patut\\nngayunin, sampunang uju-uju duka ring dewek
  titian.\\n\\nI Lutung kebilbilang tumuli ngelanturang mejalan sambilanga ngrengkeng,\\n\u201cApana
  ane ngeraniang gumine mebiayuhan?, lantas tepukina I tumisi\\nnyerengseng mondong
  umahne,! I lutung ngengalang maekan matakon \u201cue\u2026\\nTumisi dadi iba nyerucut
  mondong umah?. I Tumisi matolihang lantas mesaut,\\n\u201cinggih jero pecalang,
  awinag titiangrarud makta umah santukan ikunang-\\nkunang milehang ngaba api, manah
  titian jejeh pet ipun nguncangan umah\\ntitiange, samemangkin jerone tunas titian
  pasubayan.\u201d\\n\\nMara keto raos I tumisine, I lutung brangkit pesan, matane
  barak tumuli genjanga mejalan ngalih I kunang-kunang. Suba joh pejalane, saget tepukina
  I kunang-kunang di tengah umahne. I Lutung nyagjagin sawireh ngucap \u201c ue\u2026
  I kunang-kunang mai malu!\u201d\\n\\nI kunang-kunang matolihan lantas maekin. I
  lutung. I kunang-kunang\\nngucap, nawegan jero pecalang, napi wenten karya?, dados
  nemben ngerereh\\ntitian? I Lutung nengkik mamunyi, \u201cye\u2026 ngudiang iba
  tandruh ?, jani iba lakar\\nkrangkeng awake pelih iba mailehan ngaba api, ngawinang
  gumine\\nmablayuhang, liu anake rarud ngaba umahne.\u201d\\n\\nI Kunang-kunang dabdab
  nyutin, \u2018mangkin dumun jero pecalang. Awinag\\ntitang ileh-ileh makta api,
  santukan I Beduda sadina-dina ngai bang-bang ring\\nmargi-margine yan titian nenten
  makta suluh sinah titian macelempung kebang-\\nbange. Sane mangkin titang nunas
  pematut ring jerone.\u201d\\nI Lutung magebras ngalih I Beduda, saget tepukina I
  Beduda disamping\\ngokne. I Lutung matkon. \u201cAi\u2026, beduda corah, dadi iba
  ngawag-ngawag ngai\\nbangbang dijalane?, laksana ibane ngaenag gumi biut. I Beduda
  mesaut dabdab,\\n\u201cmankin dumun jero pecalang,. Tetujon titian mekarya bangbang
  pacing anggen\\ntitang nanem bacin I Lembune, sane mebrarakan ring margane, sinah
  yan\\nsangprabu melancarang margine bersih ngawinang ledang kayun idane. Iwangke\\nlaksanan
  titange sekadi sapunika? I Lutung maplengek lantas ngerimik, \u201c nah\\nyan keto
  unduke, I Lembu ane gumine biut, jani awake man ngewales corah\\nlaksanan ibene
  maluan. Das-dasan awke kelembu di pasihe dugas iba ngutang\\nawake di peragane.
  \u201c I Lutung magebrus mejalan gencang ngalih I Lembu.\\n\\nCeritayang I Lembu
  sedek medem-medeman ngilang padang, jeg teke I\\nLutung pejalane encol, kipekane
  merengang I Lembu nyapa alon, \u201c inggih jero\\npecalang lunga kija mangkin?.
  I Lutung mesaut bangras, \u201c ih, lembu, iba mula\\ndemen ngeletehin gumi keme-mai
  muyagan bancin ibane, jani iba patut\\nkenedenda mati. Iba lakar repotan kai ring
  prabu Singa.\\n\\n\u201c I Lutung laut mejalan ngerereh I Singa, diarep I singane,
  I Lutung masila.\\nI Singa ngeraos, ih I Lutung adakeh iba nepukin pakeweh nabdabang
  gumine?, I\\nLutung mesaut nawegan sang prabu!, ipun lembu sane purun tempal ring
  iratu,\\nmanah ioune mebalik, ipun jagi ngadu ring iratu. Mara keto raos I Lutung,
  I Sing\\npedih makpak, nagih nyarap ukudang I Lembune, lantas I Singa ngalih I Lembu\\nkasarengin
  teken I Lutung.\\n\\nCeritayang I Lembu ketemu teken I Lelasan. I Lembu orahange
  dewekne\\nrepotange teken I Lutung, sinah ia lakar sarape baan I Singa, I Lelasan
  seken\\nngeraos \u201cuduh Lembu de jejeh !, seenune kaine hidup, konden karwan
  iba lakar\\nmati, awake misadya nandingin I Singa. Buin kejepne saget teka I Singa
  ajak I\\nLutung, I Singa nyagjagin I Lembu, I Lelasan encol ngadang I Singa sambilange\\nmamunyi
  bangras, \u201c ih Singa cang tandingan ci !, yan kai suba mati mara iba\\ndadi
  nyarap I Lembu. I Singa mamunyi bangras, \u201c ih Lelasan nyalah-nyalah kai\\nngelawan
  iba, gediang awak ibane!, dosan I Lembu gede pesan, ia pantes kene\\ndenda mati??
  I Lelasan ngucap, \u201cih Singa eda iba liunan pete mai metanding.\\nLawan icing.
  I Singa ngamuk lautnyarap, I Lelasan saget mekelid tendasne ngigel\\nikutne kutal-kutil.
  I Singa pedih pesan laut ngengsebang nguber. I Lelasan encol\\nmakecos ka tunggak
  tinge, I Singa ngangsebang. Nyerap, saget tunggak tiinge\\nkene sagrep, metatu bungut
  I Singa cuah-cuah pesu getih. I Singa nyelempoh\\nlantas mati. Nepukin I Singa mati
  I Lutung melaib bah bangun ngungsi alas\\nwayah.\\n\\n\\nsumber : satuabaliku.blogspot.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com1Tembuku,
