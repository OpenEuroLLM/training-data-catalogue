  Bali : Lutung teken Kakua Mamaling Isen\\nKacerita ada I Lutung masawitra ajak I
  Kakua. Sedek dina anu I Lutung mamaling isen di tegal dukuh Kantrungan ngajak I
  kakua. Sedeng iteha ngokoh Isen, saget teka dane Dukuh Kantrungan. I Lutung encol
  makecos ka punya kayune, sambilanga magending pupuh durma.\\n\u201c Jero Dukuh puniki
  jua pirengan\\nI Kakua ia manyingid\\nDi batan tengkulak\\nI Lutung ia bubuan\\nMenek
  di kayu ia manyingid\\nIh dukuh Kantrungan\\nNyen alih jero jani\u201d\\n\\nDukuh
  Kantrungan ngenggalang ngungkab tengkulak. Bakatanga I Kakua, ia kijap-kijap, laut
  abane mulih.\\nTeked jumah dane dukuh ngaukin pianaknyane Luh Ayu Kantrungan, tur
  tundene ngae basa, sawireh lakar nampah I Kakua, anggon lawar. I Kakua celepanga
  ka krangkenge, tur encol ngaliang kulit bantal teken kulit biu kuning, manut pangidih
  I Kakua ring dane Jero Dukuh.\\nTan panaen saget teka I Lutung nelokin I Kakua sambilanga
  kedek ingkel-ingkel, sambilana ngraos, \u201c Kaden wake iba suba bangka?\u201d
  I Kakua masut, \u201c Uduh iba Lutung pelih pisan tetenger ibane, wireh dinane mani
  wake lakar keantenang ngajak Luh Ayu Kantrungan, tur wake dini maura baan amah-amahan.
  Ento iwasin Luh Ayu sedek ngaenang wake boreh\u201d.\\nI Lutung matolihan sambilanga
  ngetel paosne nepukin buka apa ane orahanga baan I Kakua, sarwi ngraos, \u201c Duh
  Kakua tutugang legan ibane tekening wake, wake ja nyilurin iba nongos di krangkenge\u201d.
  Masaut I Kakua, \u201cNah dong enggalang je bukaang jelana krangkenge!\u201d Disubane
  mabukaang krangkenge encol I Lutung macelep ka krangkenge. I Kakua nyelihsih pesu
  lantas ngancing krangkenge.\\n\\nKacrita Ni Ayu Kantrungan tengkejut, rikale maekin
  krangkenge lakar nyemak I Kakua, tepukine ada Lutung di tengah krangkenge. Lantas
  nyeritin reramane, \u201c Bapa, wenten bojog ring krangkenge\u201d, keto raos Ni
  Ayu. Jero Dukuh Kantrungan ngenggalang ke krangkenge, \u201c Bah sedeng melaha,
  ada Lutung mokoh lung pesan anggon olah-olahan\u201d. Keto pangandikan dane jero
  Dukuh.\\nI Lutung nimbal nyawis, \u201cInggih jero Dukuh, mangdane uning yening
  ngolah ulam Lutung mangda nenten pahit kadi kantawali, sampunang bacin tiange medal.
  Mangdane titiang padem, tur olahan titiange rasane becik, puniki muncuk ikuh titiange
  bebed antuk gilingan kapas miwah duk, usan kenten tunjel ikuh titiange\u201d.\\nGelisang
  satua, encol dane Jero Dukuh Kantrungan medbed ikuh I Lutung, saha kaenjutin. Suba
  gede apine I Lutung ngencolang makecos ka raab umah jero dukuhe. Makwewengan Jero
  Dukuh ngotonang umah denene puun.\\nKeto upah awak belog, ngugu munyi manis, tuara
  nawang ejite kabandilin. Napi munyi patut pinehin malu, eda iju malaksana satonden
  melah baan ngaresepang, apang tusing gangsaran tindak kuangan daya.\\n\\n\\nsumber
