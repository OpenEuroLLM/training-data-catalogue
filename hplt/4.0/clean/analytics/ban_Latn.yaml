  bali : I Lutung Masawitra Ring I Kekua\\nRing tengah alase sane jimbar, wenten macan
  masawitra sareng lutung. Sedek rahina anu i macan sane masambung ikuh sareng i lutung
  malaib pati luplup, santukan jejeh manahnyane ngeton i kambing. Palaib ipune sareng
  kalih pati luplup, nenten ngetang karengkaden alas, pangkung miwah grembeng. Saking
  pangendan Widi, sambungan ikuh sang kalih keles, mawinan palaib i macan sareng i
  lutunge mabelasan.\\n\\nCritayang i lutung sampun rauh ring alase sane madurgama.
  Irika i lutung mararian, tur glalang-gliling ring tanahe, santukan nenten sida antuk
  ipun naanang sakit awakipune. Angkihanipune noos kabatek antuk kenyelipune. Sampun
  sue masanekan raris ipun bangun, mamanah pacang ngulati toya santukan bedaknyane
  tan gigisan. Irika raris ipun mamargi ring samping pangkunge, bilih wenten toya
  panggihinipun. Tan dumade panggihinipun tugu bagu sampun rubuh, genah i kekua masinutan.\\nI
  lutung kagiat miragi suara saking batune. Manahangipun suara punika suaran manusa,
  mawinan ipun nenten di geelis nyaurin.\\nI kekua malih mabaos, \\\" Ih lutung cai
  teka uli dija, dadi tumben tepukin deweke?\\\"\\nI lutung raris nyelehin panangkan
  suaranne, kandugi panggihinipun i kekua ngesil ring samping batune.\\nI lutung alon
  nyaurin, \\\"Mawanan deweke teked dini, sawireh deweke paling, tusing nawang lisikan.
  Deweke bengong ngatonang jeneng caine tawah pesan. Tusing pesan masaih teken buron
  ane lenan. Ento krananne deweke kedek ngatonang goban caine masaih pesan teken batu.\\\"
  Miragi baos i lutunge nyadcad deweknyane, i kekua manahipune daat brangti raris
  mabaos bangras, \\\"Ih lutung kaliwat baan cai mamunyi, tusing nawang paundukan.
  Padingehang munyin deweke! Deweke mula terehan Bedawang Nala ane setata kukuh nyuun
  gumine. Leluhur deweke kasub tan patandingan ane malu. Yan cai dot nawang buat kawisesan
  deweke, mai paekang awak caine, lakar uyeng deweke! Yan sedekan deweke pedih gumi
  muah alas gununge makejang, nyidaang deweke mralina. Nah edengang jani kawisesan
  caine. Deweke lakar nandingin kapurusan caine!\\\" Sapunika baos i kekuane bangras.\\nI
  lutung daat jejeh miragi gertak i kekuane tumuli mabaos banban, \\\"beh kekua, sinampuraang
  pesan buat kasigugan deweke. Tusing ja sangkaning deweke degag bani teken cai. Sujatinne
  deweke tusing nawang teken panumadian caine. Nah ne jani jalan makekasihan! Cai
  kekua anggon deweke kanti. Sawireh i raga mula terehan wangsa utama.\\\" Sapunika
  baos i lutunge.\\nI kekua raris mabaos banban sarwi kenyem, \\\"ih lutung, mangdoh
  lakar kasidan amun keneh caine, lakar makasihan teken icang sawireh bebaksane pada
  melenan. Icang demen teken dondonan ane berek, cai demen teken wohwohan, sinah suba
  pepinehe tusing lakar adung.\\n\\nAda katuturan ane malu, anggon icang tetuladan,
  buka bojog masawitra teken i kambing. Pawawitrane raket, mawastu ngwetuang siat
  malarapan baan ngrebutin tanduk.\\\" I lutung kenyem nyaurin, \\\"Ih kekua, yan
  kenehang icang tusing ja keto. Sawireh icang melenan teken bojoge ane satuaang cai.\\\"
  Sapunika pajar i lutunge mitegesang pisan.\\n\\nCritayang indik pasawitran i lutunge
  sareng ring kekua becik pisan. Sareng kalih ipun rerad-rerod luas ngrereh tetedaan
  nenten naenin mabelasan, ngulurin legan kenehnyane. Ri kala semeng i lutung metu
  manahipune pacang nyugjugin baos i kekuane, santukan ipun ngaku sakti.\\nSasampun
  i lutung matemu ring sawitrannyane, raris ipun mapajar, \\\"Ih cai kekua, buin mani
  jalan luas melali kategale kelod, sawireh icang ningeh orta, ditu liu ada umbi-umbian
  muah woh-wohan minakadi poh, pakel, nyambu, juuk muah ane lenan. Buina soroh umbi-umbiane
  suba kone sedeng ebet.\\n\\nDisisin-sisin abiane, glagahe bet buina liu pesan don
  kayune berek ane ulung ka tepin jurange. Jae, isen, lempuyang samah buka alase.
  Buina ane ngelahang abiane tusing mondokin.\\\" Sapunika baos i lutunge. I kekua
  lega manahipune miragi sarwi mabaos banban, \\\"Nah yan saja buka raos caine, jalan
  buin mani semengan luas ka tegale kelod. Nanging ada piteket deweke, yan saget teked
  di pakubuan, apang ngalih amah-amahan suang-suang, buina eda cai uyut.\\n\\nCritayang
  benjangne pasemengan i lutung miwah i kekua sampun mamargi. Sampun doh ipun mamargi
  nuut lisikan sane silak-siluk ring bangkiang gununge. Saking bangkiang gununge katon
  pasisine asri ngulangunin manahipune. Sasampune rauh ring pabianan, sareng kalih
  macelep ka tengah abiane. Nyandang becika sang madrue abiane nenten wenten ring
  abian, mawinan kalintang lega manah sang kalih neda tetedaan sane doyaninipun. Nenten
  nyandang baosang indik legannyane ngulurin kaulangunan. I lutung raris ngrincikang
  daya pacang nyengkalen i kekua. Irika ipun tedun saking wit tarune tur nuju wit
  jaene, tumuli ngambil umbinnyane tatis kateda. Sasampune polih ngarasayang, pramangkin
  ipun maduhan sarwi ngusap yeh mata. Suarannyane ngelur aduh-aduh. Kala punika i
  kekua raris nangsekin tur mabaos, \\\"Ih lutung eda keto, suud aduh-aduh! Yan dingeha
  teken ane ngelah abiane sinah deweke lakar matianga.\\\" Sapunika pajar i kekuane.
  I lutung nenten ngrungu baos i kekuane, bilih nyangetang ipun aduh-aduh. Duk punika
  suaran i lutunge kapiragi olih sang nruenang abiane. Sang madrue raris gegison nyujur
  ka abiannyanne. Sasampune rauh ring tegalanipune, tengkejut ipun ngatonang abiannyane
  telas kagebur.\\nTan dumade metu gedeg manahipune tur di gelis ngruruh, nyliksik
  sang corah sarwi matbat, \\\"Ih cai corah, kenken sujatinne goban caine. Cai bani
  ngusak-asik pabianan deweke, antosang buin ajahan, lakar empug kai tendas ibane.\\\"\\nMiragi
  baos sang masrue abian, i kekua daat jejeh raris di gelis mengkeb ring batan tengkulake.
  I lutung makecos menek ring tarune. Solahipune kajengat-kajengit sekadi nundun gedeg
  manah sang madue abiane. I lutung tatis magending sapuniki, \\\"I lutung babuan
  di kayu, i kekua batan tengkulak dug, dag, ceng, ceng, kiok.\\\" Sapunika gendinganipune
  mawali-wali, ngardinin sang madue abiane sane mawasta durbudi sayan nyangetang pedihipune.
  Bonglakipune makelep kasunarin antuk surya. Matanipune barak, nulengek mapawasan
  ring carang kayune. Panggihinipun i lutung negak ring carang kayune, iteh magending.
  Durbudi sayan sengitan.\\nIpun raris mabaos, \\\"Ih lutung buron cemer, apa petaang
  cai? Cai kaliwat degag teken deweke. Yan saja cai wanen, tuunang iban caine! Lakar
  cohcoh kai tendas ibane baan caluk. Kema enggalang orahin kadang caine, tonden ngrebut
  kai!\\\" I lutung nenten ngrungu munyin Durbudine bilih nyangetang ipun magending.
  Sasampune ipun miragi gending i lutunge, raris ipun mapineh-pineh, \\\"I lutung
  magending sujatinne ngorahin i dewek.\\\" I Durbudi raris nyliksik batan tarune.
  Asing-asing ane ebet adas ipun. Tan dumade panggihin upun clebongkak madugdug, punika
  tatis keberangipun, panggihinipun i kekua ngesil.\\nDurbudi kalintang sengitan tur
  mabaos, \\\"Bah ne ko ya malinge ane bani ngrusak abian deweke.\\\" Sapunika baos
  ipune. I kekua di gelis kategul, raris kabakta ka pondoknyane.\\n\\nKacrita sampun
  tauh ring pondok, Durbudi raris ngaukin pianak miwah somahipune, \\\"Men Cening,
  mai tingalin! Kema enggalang ngalih saang. Ajaka mebat. Ne kekuane suba krangkeng
  Bapa. Buin mani pasemengan dabdabang basa muah reramone!\\\"\\n\\nSasampune sore
  i lutung sane kantun ring carang kayune, wiakti daat lega manahipune, santukan katarka
  i kekua pedas pacang padem. Punika mawinan ipun tedun, mamanah pacang nyelehin genah
  i kekuane.\\nRauh i lutung ring genah i kekuane raris ipun mapakar alon, \\\"Ih
  kekaua, eda cai sanget nyekelang deweke! Sawireh ene mula pangendan Widi, rusing
  dadi kelidin. Yan kenehang deweke, cai tusing ja lakar mati, yan saja buka munyin
  caine i pidan, cai mula terehan sakti mawisesa. Sakewala baan teresnan deweke masawitra
  teken cai, ento krananne deweke teka nelokin cai. Yan sing pelih baan deweke narka
  sinah cai lakar anggona cokok makuskus.\\\" Sapunika baos i lutunge, sakadi nyindirin.\\nI
  kekua kenyem nyaurin, \\\"Bah yan keto, tusing cai nawang teken unduk deweke? Di
  kapan deweke lakar mati, sawireh deweke dini, lakar kanggon mantu. Petengne nyanan
  deweke lakar kaatenang ngajak pianak Durbudine. To iwasin, gegelan deweke mara pesan
  suud ngulig boreh! matuan deweke epot magarapan nabdabang sagi, nyanggra tamiune
  lakar teka.\\\" Sapunika baos i kekuane, masebeng bingar. Nenten pisan wenten merawat
  jejeh ring semitanipune, yadiastun ipun pacang kapademang. I lutung bengong miragiang
  satuan i kekuane. Saantukan belognyane kaliwatm baos i kekuane kadenipun sujati.
  Irika metu manahipune dot ngantinin i kekua dados mantu sarwi ipun mabaos, \\\"Beh,
  saking saja cai mula sawitran deweke ane melah. Nah jani terusang legan caine masawitra
  teken icang. Cutetne icang ngidih teken cai apang cai saking las nyerahang gegelan
  caine teken icang. Icang ngantinin cai dadi mantun I Durbudine. Yan suba saking
  saja cai nyak nyerahang gegelan caine, icang tising engsap teken kapitresnan caine
  yadiastun ping kuda-kuda icang lakar numadi, apang setata masawitra teken cai.\\\"
  Sapunika baos i lutunge.\\nI kekua kenyem nyaurin, \\\"Yan keto keneh caine, apa
  men orahang deweke teken cai. Deweke mula saking sujati tresna makekasihan. Deweke
  tusing mucingin pangidihan caine. Jani, cai dini nongos di tengah krangkenge, deweke
  lakar matinggal, cirin deweke tresna teken cai!\\\" Sapunika baos i kekuane. I lutung
  raris ngungkab krangkenge, tumuli ngranjing ngentosin i kekua. I kekua raris matinggal
  nylupsup ka bete.\\n\\nTan critaang i kekua ring margi, mangkin ipun sampun rauh
  ring genah sane singid. Critayang mangkin I Durbudi sampun puput nyangih blakas
  tumuli ipun nyujur genah i kekuane. Sarauhe ring genah i kekuane, I Durbudi daat
  kagiat, saantukan ipun manggihin i lutung sane matekep ring krangkenge.\\nI Durbudi
  raris mabaos ring somahipune, \\\"Men Cening nyen ane nyilurin i kekua di krangkenge?\\\"
  Somahipune maosang nenten uning.\\nI Durbudi malih ngucap, \\\"Bah saking suecan
  Widi ene, kekuane magentos dadi lutung.\\\" Sapunika baosipune, sarwi ngigelang
  blakas antuk legan manahipune.\\\" Bah mati cai lutung. Cai buron corah tur nista
  sing buungan cai lakar anggon deweke cokok, anggon deweke murnayang keneh deweke
  sebet.\\\" Sapunika baos I Durbudine. Somah miwah pianaknyane sami lega tur mabaos,
  \\\"Ngedenang bene teka.\\\"\\nI Duurbudi mabaos, \\\"Men Cening imbuhin buin basane.
  Aba mai wadah getihe!\\\" Miragi baos I Durbudine asapunika i lutung daat jejeh,
  awakipune ngejer santukan tan pariwangde ipun pacang kapademang.\\nI lutung raris
  mapineh-pineh, \\\"Bah uli kene i kekua lakar ngamatiang deweke.\\\" Sapunika pepinehipune,
  tur tan mari nyesel awak baan belogipune nenten uning keni upaya sandi. Irika raris
  ipun mabaos ring I Durbudi, \\\"Uduh jero, nenten ke jerone pacang leteh mademang
  tur ngajengang titiang, santukan tiang makuku lelima. Yan manut ajaran agama, sane
  makuku lelima, tan wenang kabaksa. Mawastu jerone jagi nemu nraka. Yan pet jerone
  ngamatiang tur ngajengan sinah lakar nenten ngleganin kayun, sawireh awak tiange
  jagi berek kateda olih bubuk. Yan jerone mapakayun apang rasan ben tiange becik,
  nyupsup kayang kawekas tur prasida nyupat nrakan jerone, mangkin durus pirengang
  atur titiange. Titiang puniki wantah terehan wenara saking gunung kiskinda sane
  naenin ngrusak gumi Lengkane. Mangda jerone uning sane anggen mademang titiang,
  inggih punika kulit sane lumutan, punika anggen nunu dewek titiange, sinah titiang
  padem. Yan ben titiange kaolah sinah pacang ngamedalang sad rasa sane becik.\\\"
  Sapunika baos i lutunge.\\nI Durbudi bengong miragi baos i lutunge santukan nembe
  miragi tutur. Saantukan belog tututipune nenten uning ring daya upayan i lutunge,
  tan dumade punika sane katuut. Sasampune ipun polih kulit kayu kadugdugang ring
  arep i lutunge raris katunjel. Apine ngendih murub ngabar-ngabar. I lutung di gelis
  makecos ngelidang dewekipune. Apine sayan dumillah kaampehang angin, nilap pondok
  I Durbudine, jantos puun. Pondoknyane telas puun, saantukan nenten wenten anak sane
  nulungin. I Durbudi sareng pianak somahipune raris matilar ngungsi alase sane suung.
  Apine sayan murub muunang kekayuan sane ring samping pondok I Durbudine, sekare
  katah sane aas saking witnyane saantukan layu keni iusan panes. Tambulilingane sami
  mabiayuhan, pakeberbernyane pati purug, kalikub antuk andus. Suaran paksine makuug,
  makeber srantaban. Iusan genine sayan nyupsup mawinan katah pianak paksine sane
  wenten ring sebunnyane, paplukpuk ulung.\\n\\nCritayang i lutung sampun rauh ring
  alase ageng. Manahipune pacang ngetut pejalan i kekuane. I lutung nenten lega, yan
  tan ipun polih ngwales laksanan i kekuane sane daat corah punika. Sapanjang margi
  ipun uyut ngaukin i kekua, \\\"Ih cai kekua kaliwat nista tur corah, dija tongos
  caine, yadiastun cai mengkeb di tengah pasihe, lakar sliksik kai. Rahina wengi i
  lutung masusupan ring alase, nyliksik pangkung, jurang miwah bete. I kekua taleer
  durung panggihinipun. Tandumade ring tegal ambenganne linggah panggihinipun i kekua
  sedek ngesil ring beten batune sane ngenjol. Ring samping i kekuane wenten lelipi
  poleng sedekan pules. Kala punika i kekua uning ring pangrauh i lutunge raris ipun
  mapi-mapi ngranasika, mamegeng sarwi ngidemang matannyane, sekadi tingkah anake
  matapa.\\nI lutung rauh nangsekin, tur mabaos bangras tur nuding, \\\"Ih kekua mati
  cai jani. Cai kaliwat corah, tusing nyandang anggon sawitra tingkah caine nyicing
  singal. Laluang keneh caine. Tendas caine lakar pantigang deweke. Apang tawang cai
  pikolih anake tusing satia teken munyi.\\\" Sapunika baos i lutunge, sada jenger.\\nI
  kekua sebengne alep raris mabaos, \\\"Saja pesan buka raos caine. Eda cai sanget
  pedih. Dikapan cai nyidaang ngamatiang deweke. Mapan deweke mula kasuecanin olih
  Sang Hyang Widi. Deweke dini kanikayang ngemit druen Ida Betara. Apang cai nawang
  deweke jani nyatauin cai, sakewala tusing dadi wera. Ada katuturan satua singid,
  rikala watek betara sura gana, sapta resi muah danawa rajane makejang satinut muter
  pasih empehane. Pakayunidane sami pacang ngrereh amreta miwah raja brana. Amertane
  kawadahin jun manik. Penegulan amertane ada dini. Deweke kanikayang ngemit. Ento
  krananne deweke ada dini, nyungsung pangandikan Ida Betara. Sawireh ada pawisik,
  nyen ja ane ngemit pican Ida Betara, ia tusing lakar kena baya ane ngewehin, tusing
  kena gering, muah tusing lakar mati. Yan pet mati sinah buin mewali idup. Nah keto
  kautaman sabuke.\\\" Sapunika baos i kekuane. Wiakti pangus antukipun nyatuaang
  anggenipun ngengkebang kacorahannyane. I lutung teleb miragiang, mawanan ical pedihipune.
  Kamanah antukipun baos i kekuane saking tetuian pisan.\\nIrika raris ipun mabaos,
  \\\"Ih kekua, buka raos deweke i tunian, eda nyen cai pedih. Ampurayang munyin deweke
  ane nyakitin keneh caine, saja bas kaliwat icang mesuang munyi, sakewala sujatinne
  keneh icange mula saking tresna masawitra teken cai. Raos icange buka keto mula
  nyinahang karaketan keneh icange masawitra. Nah yan ada legan caine teken icang,
  icang dot pesan apang taen nganggon sabuk polenge ene, apang sida masih icang nepukin
  karahayuan. Icang majanji teken cai, yan pet icang nepukin kadirgayusan tur kasuecanin
  olih Ida Betara, icang tusing engsap masawitra teken cai kayang kawekas.\\\" Sapunika
  baos i lutunge kedeh pisan, mangda ipun kawehin ngangge sabuk polenge sane kakemit
  olih i kekua. Ipun nenten uning ring pangindra jalan i kekuane.\\nKala punika i
  kekua raris nyaurin, \\\"Apa men orahang deweke teken cai, sawireh keneh caine suluk
  lakar nganggon sabuke ene. Sujatinne abot pesan keneh deweke lakar mebasang, nanging
  baan tresnan deweke masawitra teken caim deweke tusing lakar mucingin. Sakewala
  ada piteket deweke teken cai. Deweke takut kaduken olih Ida Betara, deweke lakar
  ninggalin cai dini. Eda pesan cai jeg kadropon nganggon sabuk polenge ene, satonden
  deweke ninggalin cai. Yan suba deweke joh mejalan, ditu mara cai nganggo sabuke
  ene!\\\" Sapunika baos i kekuane. I lutung matutang, saantukan meled manahipune
  pacang ngrangsuk sabuk punika. Irika raris i kekua matilar saking genah lelipi polenge
  medem. Sampun doh i kekua mamargi, i lutung raris mabakti ring arep lelipine pules.
  Puput mabakti, di gelis i lutung nyaup lelipine sarwi ngambil bungutnyane. kala
  punika i lelipu tengkejut, tur pedih, manahangipun wenten baya sane rauh. Irika
  raris i lelipi nyeceh nyotot tur nglilit bangkiang i lutunge. I lutung pramangkin
  nyerit maduhan, antuk pangrabdan wisian lelipine. I lutung raris ebah glalang-gliling
  ring tanahe, naanang wisian lelipine sayan nyusup. Dewekeipune waluya kadi tan pajiwa
  sarwi ngeling, nyambat-nyambat Widi. Saking pamerat wisian lelipi polenge, i lutung
  raris engsap tur nylempang ring sor taru kepele. Yan makudang dina suene i lutung
  niwang ring tengah alase, Critayang mangkin i kekua sampun ring sisin pasihe. Manahipune
  setata sengsaya santukan i lutung sinah pacang gedeg tur ngruruh ipun pacang mademang.
  Irika ipun mapineh-pineh, ngricikang daya upaya mangdene nenten disa kasengkalen
  olih i lutung.\\n\\nCritayang wenten kerang magenah ring sor parangane ngenjol,
  kenjekan nyebak keni embahan toyan pasihe sedekan puras. I kekua raris gelis nangsekin
  kerange punika, sarwi nongos ring sampingnyane.\\n\\nBaosang mangkin i lutung sasampunne
  ipun seger, manaipune daat gedeg ring i kekua sarwi mapineh-pineh. Beh sing cepok
  pindo deweke nagih matianga teken i kekua, mawinan tusing nyandang ia idupang.\\\"
  Sapunika manahipune saatukan gedegnyane kaliwat. Punika mawanan panes bara rasan
  manahnyane matanipune barak, angkihannyane noos miwah limannyane ngetor mamanah
  pacang ngilut baong i kekuane. Irika raris ipun mamargi gegancangan ngentasin alas
  sane wayah, tan ngitung bayane pacang nyengkalen. Ting margi ipun setata ngimik,
  matbat i kekua sane kaliwat corah, sarwi makta batu pacang anggeipun mademang i
  kekua.\\nPamarginnyane tan pararianan, kancit i lutung rauh ring genah i kekuane,
  sarwi gregetan nuding, \\\"Bah, mati cai jani kekua. Ene iwasin liman kaine, lakar
  mancut urip caine. Jani suba pragatne, pikolih caine matingkah corah. Uli goban
  caine suba nyinahang, Cai setata ngardinin deweke sakit kalara-lara, jani trima
  pikolih pakardin caine ane setata ngrincikang matin deweke. Dadi cai nengil, dong
  pesuang karirihan caine! Yadiastun Sang Hyang Wisnu ngasih-asih ngidih pelih teken
  deweke cai tusing ja lakar idupang kai.\\\" Sapunika baos i lutunge.\\nWau i lutung
  pacang nglempag, i kekua masebeng kenyem sarwi mabaosm \\\"Ih sawitra, sedeng melaja
  cai teka. Deweke mula setata ngati-ati apang enggal kamatiang baan saritra, maka
  jalaran deweke maan suarga. Keto pangandikan Ida Sang Hyang Widi tekening deweke,
  apang enggal deweke mulih ka suargan, upah deweke dadi panunggu.\\\" Sapunika baos
  i kekuane. I lutung kamegan miragi, santukan tambet manahipune. Ipun kadaut antuk
  baos manis.\\nPedihipune mawastu enduh sarwi mabaos, \\\"Bah yan keto, tegarang
  satuaang katuturanne!\\\" I kekua raris nyatua, \\\"Kacrita ane malu Ida Sang Hyang
  Siwa ngelarang tapa, tusing dadi ngajak rabi. Ada detia raja madan Si Nila Rudraka,
  tusing suud-suud kenehne lakar nguugang suargane. Mawastu bingung kayun watek dewatane
  di suargan, sawireh ane lakar nyidayang ngamatiang Si Nila Rudraka mula tuah okan
  Sang Hyang Siwa mapesengan Sang Hyang Gana. Ditu laut para dewatane nunas ica ring
  Ida Sang Hyang Semara, mangdane ida ngoda patapan Ida Betara Siwa, apanga metu kayunidane
  kasemaran. Ditu laut Sang Hyang Semara ngoda yogan Sang Hyang Siwane, majalaran
  baan niwakang panah semara, Ri kala Ida Betara Siwa kena panah semara, laut ida
  ngleuang semara laut ida duka. Sang Hyang Semara kageseng baan api, dumilah ane
  pesu uli panyingakan Betara Siwane. Ida Betari Ratih rabin Sang Hyang Semarane mireng
  rakanidane seda, laut ida masatia malabuh geni. Nah keto katuturan sedan Idang Sang
  Hyang Semara kasarengin baan rabinne. Pasukanidane ane mautama ada dini di parangane
  marupa kerang. Asing -asing ane sida nguasayang mawastu dadi ratu wibuh pradnyan,
  susila, kasumbung di gumine. Buina setata prasida ngulurin Karasmian ngajak rabine.
  Nah keto katuturan Sang Hyang Semara ane malu apang cai nawang.\\\" Sapunika baos
  i kekuane. Manah i lutunge lega miragi satuan i kekuane, santukan lengut antukipun
  ngiketang satua.\\nGedeg i lutunge mawastu ical, raris ipun mabaos banban, \\\"Galamg
  keneh icange ningeh satuan caine. Sayan cumpu keneh icange makekasihan teken cai
  baan isin satuan caine daat mautama. Ane jani icang ngidih teken cai, yan cai lega,
  icang ngenntinin cai dini. Dumadak ada suecan Widi, icang enggal dadi ratu nyakra
  werti. Icang lakar nganggon cai patih Mangku Bumi.\\\" Sapunika baos i lutunge tetuian.
  I kekua nenten malih mabaos, raris gelis nyrutcut makaon.\\n\\nTan critayang pajalan
  i kekuane nylupsup ring alase, baosang mangkin i lutung sampun usan mabresih masuci,
  raris nabdabang negak masila sarwi nyakupang lima ngranasika. Solahnyane tan pendah
  kadi anak matapa. Ri kala i lutung sedek teleb ngincepang semadi ring arep kerange
  sane nyebak, tan dumade kaange raris ngep, nyepit liman i lutunge.\\nI lutung nyerit
  aduh-aduh sarwi ngedeng limanipune sambilang ipun mabaos, \\\"Ratu Betara, ampurayang
  titiang parekan Betara. Sampunang banget duka, durus lebang liman titiange!\\\"
  Sapunika baosipune. Kala punika toyane sayan ngagengang, mawastu liman i lutunge
  kalebang. i lutung raris munggah ka duur parangane. Manahipune sayan jejeh, saantukan
  sinah ipun pacang padem kalebu. \\\"Aduh sing buungan deweke lakar mati dini. Tusing
  pesan ada ane lakar nulungin, yan tusing mula saking suecan Ida Sang Hyang Widi.\\\"
  Sapunika baosipune tan mari nyelsel dewek saantukan merasa kauluk-uluk olih i kekua.
  Manahipune sayan sedih sarwi ngeling, mapulisahan ring parangane.\\n\\n\\nsumber
