  Bali : Nang Cubling\\n\\n\\nilustrasi bojog dalam nang cubling\\n\\nKacrita di desa
  anu ada anak mapungkusan madan Nang Cubling. Sedek dina ia masangin bojog di tukade,
  lantas ada bojog gede teka tur matakon,\\n\u201cNang Cubling, basang apa ento kaumbah?\u201d\\nNang
  Cubling masaut, \u201cBasang I Lut.\u201d\\nI Bojog tusing buin matakon, nglantas
  magedi. Buin kesepne buin ada bojog gede teka, masih ia matakon,\\n\u201cNang Cubling
  basang apa ento kaumbah?\u201d\\nNang Cubling masaut, \u201cBasang I Lut.\u201d\\nI
  Bojog lantas magedi. Liu bojoge teka matakon, nanging pasaut Nang Cublinge patuh
  dogen.\\n\\n\\nCritayang jani ada bojog cenik matakon,\\n\u201cNang Cubling, basang
  apa ento kaumbah?\u201d\\nNang Cubling masaut, \u201cBasang I Lut.\u201d\\nI Bojog
  buin nyekenang, \u201cI Lut ento celeng?\u201d\\nNang Cubling nyautin, \u201cTusing
  I Lut ento, I Lut, I Lut, I Lut... tung.\u201d\\nI Bojog buin nakonang, \u201cApa,
  kerasang te!\u201d\\nNang Cubling nyautin, \u201cI Lut, I Lut, I Lut, I Lutung!\u201d\\n\\nMara
  I Bojog ningeh munyin Nang Cublinge ngorahang I Lutung, lantas ia malaib morahan
  teken timpalne. Tusing makelo liu bojoge teka, lakar ngrejek Nang Cubling. Lantas
  malaib Nang Cubling tur morahan teken kurenanne. Nang Cubling lantas katunden marurub
  baan kasa. Buin kejepne teka bojog ajaka liu pesan, dapetanga Men Cubling ngeling.
  Bojoge lantas matakon, \u201cIh Men Cubling, nguda ngeling?\u201d\\nMen Cubling
  masaut, \u201cKurenan icange ia mati.\u201d\\nI Bojog masaut, \u201cEnto apa ya
  di balene?\u201d\\n\\nI Bojog makejang kemo, tur ngungkab rurub Nang Cublinge, dapetanga
  Nang Cubling nylempang, tusing makrisik-krisikan. Makejang bojoge ngaden Nang Cubling
  saja mati. Men Cubling lantas ngomong, \u201cIh Bojog makejang, tulungin ja icang
  ngae bangbang ane gede tur dalem, lakar tongos nanem bangkene Nang Cubling!\u201d
  lantas bojoge makejang ngae bangbang gede tur dalem. Sedek bojoge ngeduk bangbange,
  lantas Nang Cubling bangun nyemak bedeg anggona nekepin bangbange. Men Cubling ngenggalang
  nyemak yeh anget, anggona nyiam bojoge. Dadi bojoge makejang mati, lantas bangbange
  kaurugin.\\n\\n\\nsumber : satuabaliku.blogspot.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com1Tembuku,
