  -8.4058201999999991 115.3904215tag:blogger.com,1999:blog-2131724523036064124.post-72165577736765921622013-08-29T09:39:00.002-07:002013-08-29T09:39:34.514-07:00Satua
  Bali : I Ketimun Mas\\n\\n\\nCerita rakyat dengan judul I Ketimun Mas ini adalah
  cerita masyarakat daerah Bali. Tentu saja menggunakan bahasa daerah Bali. Saya mengutipnya
  dari Buku Satua Bali Jilid I B untuk murid Sekolah Dasar Kelas II, tahun 1975. Cerita
  rakyat dengan judul serupa yaitu \u201cTimun Emas\u201d atau \u201cTimun Mas\u201d
  juga ada di daerah Jawa Tengah. Mungkin ceritanya agak mirip dengan kisah I Ketimun
  Mas ini. Saya tidak tahu cerita dari daerah mana yang ada lebih dulu. Namun, itu
  rasanya gak penting dan jangan dipermasalahkan. Karena terlepas dari \u201cmana
  yang lebih dulu\u201d, semuanya adalah warisan nusantara yang patut kita lestarikan
  keberadaannya. :wink:\\n\\nBerikut kisah dari satua Bali I Ketimun Mas:\\n\\nI Raksasa
  dan I Ketimun mas\\nIlustrasi I Raksasa menculik I Ketimun Mas\\n\\nAda katuturan
  satua ane malu. Anak luh balu ngelah pianak luh adiri. Adanina I Ketimun Mas. Ia
  mumah di tanggun desane, desa Dauh Yeh, paek teken alas.\\n\\nKacerita jani sedek
  semengan, memenne bakal luas ka peken. Mabesen ia teken panakne, kene, \u201cCening,
  cening Ketimun Mas, meme bakal luas ka peken. Nyai ngijeng jumah, nyanan gapgapina
  laklak. Jumahan meten nyai nongos, kancing men jlanane. Yening ada anak kauk-kauk
  tidong meme, da pesan ampakina!\u201d\\n\\nKacerita kone jani I Ketimun Mas, nongos
  jumahan meten makancing jlanan. Saget teka I Raksasa kauk-kauk, munyinne gede tur
  garo, \u201cCening , cening Ketimun Mas, meme teka, ampakin meme jlanan!\u201d Pedasange
  baan I Ketimun Mas. \u201cNe, nyen ya ngelah munyinne? Nguda gede tur garo? Bah,
  tidong i meme.\u201d Keto kenehne I Ketimun Mas. I Raksasa tusing ampakina jlanan.
  Mulih lantas I Raksasa.\\n\\nKacerita jani teka memenne. Ampakina lantas jlanan,
  kriut gedebleg. Morahan I Ketimun Mas, \u201cMeme, ibusan ada anak kauk-kauk. Munyinne
  gede tur garo. Beh, jejeh pesan keneh tiange. Tusing bani tiang ngampakin jlanan.\u201d
  Memenne kendel kenehne. I Ketimun Mas gapgapina laklak atekor. Tur lantas ngomong,
  \u201cKatawang ento ane kauk-kauk i tunian? I Raksasa ento. Yen ento ampakin, pedas
  cening plaibange.\u201d\\n\\nBuin manine, buin memenne ka peken. Makire majalan,
  memenne mabesen, \u201cCening, cening, meme lakar ka peken. Jumah meten ngijeng,
  kancing jlanane. Ingetang munyin memene ibi. Yening tusing meme ane mekaukan, da
  pesan ampakina jlanan!\u201d\\n\\nKacerita jani I Raksasa, lakar buin kumahne I
  Ketimun Mas. Di jalan nepukin ia anak ngangon bebek. Paekina pangangon ento, awakne
  ngetor pesu peluh baan jejehne. Ngomong I Raksasa, \u201cIh, jero pengangon bebek,
  jalan kema kumahne I Ketimun Mas. Nyanan lamun tusing jumah memenne, kauikin I Ketimun
  Mas!\u201d Masaut i pangangon, \u201cMindah, bebek tiange tusing ada nongosin.\u201d
  Galak i Raksasa, \u201c Yen tusing nyak, ia tendasne kamah. Basang awake seduk.\u201d
  Mara keto abetne I Raksasa, nyak lantas i pengangon bebek.\\n\\nDapetange umahne
  I Ketimun Mas suung. Ngomong I Raksasa teken i pangangon, \u201cNah, kema kaukin
  I Ketimun Mas. Ia jumahan meten makancing jlanan. Jangihang munyine, cara munyin
  memenne!\u201d\\n\\n\u201cCening, cening Ketimun Mas. Ampakin ja meme jlanan!\u201d
  Apa, kendel I Ketimun Mas. Kadena saja memenne teka. Kriut gedebleg, jlanane kaampakang.
  Saget saupa I Ketimun Mas, plaibanga baan I Raksasa. Beh, jerit-jerit I Ketimun
  Mas ngeling.\\n\\nGelisang satua, neked I Raksasa jumahne. Tekepina I Ketimun Mas
  aji grobag, tetehina aji lesing batu. I Raksasa ngelah juru ijeng dadua. Ne adiri
  buta, ane lenan bongol. Ngomong I Raksasa, \u201c Buta, Bongol! Eda luas kema-mai!
  Awake lakar ngalih bakal basa akejep.\u201d Ngarod I Ketimun Mas ngeling, di tengah
  grobage mateteh lesung.\\n\\nJani kacerita memenne I Ketimun Mas, mara teka uli
  di peken. Dapetange umahne suung jlanan ampikne mampakan. Pianakne tusing ada. Gelar-gelur
  ia makaukan. Tusing ada ane masaut. Ngeling lantas memenne I Ketimun Mas, tur mapineh.
  \u201cPedas I Ketimun Mas plaibanga baan I Raksasa. Kenkenang jani baan madaya?\u201d\\n\\nLantas
  ada kone meong teken bikul, kema maekin memenne I Ketimun Mas. Men Ketimun Mas ngomong,
  \u201cNah, ne apa Sang Meong ajaka Sang Bikul. Nyak ngalih I Ketimun Mas? Ia plaibanga
  baan I Raksasa. Yen teka baan iba I Ketimun Mas, upahina be bajo asok teken padi
  abodag.\u201d\\n\\nNyak lantas I Meong teken I Bikul, majalan ajaka dadua kumahne
  I Raksasa. Tepukina I Ketimun Mas matangkeb. Tongosina baan I Buta teken I Bongol.
  I Raksasa sedekan di paon, repot munduhang bakal basa.\\n\\nKacerita pongponga grobage
  ban I Bikul. I Meong nyongkok duur grobage ngantiang. Krepet-krepet ngenyonyong,
  kriet-kriet kepungpung. Dingeha kriet-kriet teken I Buta, \u201cApa sih krepet-krepet
  ditu?\u201d \u201cNgeong!\u201d keto munyin meonge. \u201cSep, apa sih gesgesa meonge
  ditu?\u201d Keto I Buta. Ngomong I Bongol, \u201cAda meong duur grobage.\u201d \u201cUlahang
  meonge, Bongol!\u201d Mendep I Bongol, wireh ia mula tusing ningeh. Kanti linggah
  song grobage, pongponga baan I Bikul.\\n\\nSuba ada asedengan jlema, pesu lantas
  I Ketimun Mas. Ateha mulihne baan I Meong teken I Bikul. Neked jumahne, nyagjang
  memenne, kendel pesan kenehne. \u201cDewa Ratu, cening Ketimun Mas. Mara teka, aget
  pesan Meme!\u201d I Meong teken I Bikul lantas upahina be bajo asok teken padi abodag.
  I Meong nyuang be bajone asok, I Bikul makatang padine abodag. Keto katuturanne
  I Ketimun Mas.\\n\\n\\n\\n\\n\\nSumber : adiarta.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com3Tembuku,
