  Bali : I Lubdaka\\n\\n\\nKacritayang daweg dumun, wenten juru boros, maparab I Lubdaka.
  Liat salap baos banggras dengkak-dengkik. Solah ngapak-apak, nyapa kadi aku. Akedik
  nenten madruwe manah welas asih, morosin kidang, bojog wiyadin irengan.\\n\\nNuju
  panglong ping pat belas Tileming Kapitu, semengan ipun sampun ka alase. Nanging
  asiki nenten manggihin buron. Sampunang ja buron ageng, kadi rasa lelasan ja nenten
  wenten medal nenten wenten kepanggih.\\n\\nI Lubdaka raris ngungsi alas sane sripit.
  Irika kacingak wenten telaga, toyanne ening pisan, tur magading tunjung manca warna.
  Irika I Lubdaka maka sanja, taler nenten wenten buron sane rawuh.\\nRing sampune
  engseb suryane, raris I Lubdaka ngrenggeng : \\\"Yeh... enen suba sanja, yen jani
  I dewek mulih, kapetengan di jalan, sinah aluh I macan ngebog I dewek. Ah... paling
  melah dini dogen I dewek nginep \\\".\\n\\nSapupute I Lubdaka ngrenggeng, raris
  ngrereh genah nginep. I Lubdaka mongkod taru bila ageng, sane mentik ring sisin
  telagane. Ring carang taru bila punika ipun ngesil.\\n\\nSampun nyaluk wengi I Lubdhaka
  arip. Metu ajerih manah ipun, yan nyriet akedik janten runtuh nengkayak. Raris ipun
  ngeka naya mangda nenten arip. Daun bilane kapikpik, tur kasintungang ring telagane.
  Kala punika jeg marawat-rawat, I kidang sanekatumbak olih ipun ibi. I kidang maplisahan
  ngelur ring tanahe, naanang sakit. Taler sawat-sawat dingeh ipun, pacruet eling
  panak I bojog, mangelingin memene kena tumbak.\\n\\nNgancan suwe, ngancan akeh parisolah
  ipune marawat, kala maboros ring alase, wantah ngardi sangsaran ye I buron. I Lubdaka
  raris ngrenggeng : \\\"Liu pesan I dewek lakar ngae jelek di gumine, uli jani I
  dewek lakar suwud maboros\\\". Asapunika semayan ipun wengine punika.\\n\\nAntuk
  akeh daun bilane kapikpik, tur kasintungang ring telagane, raris mabejug daun bilane
  marupa lingga. Lingga maka linggih Ida Sang Hyang Siwa. Tur nenten kerasa, saget
  sampun semengan jagate. I Lubdaka gegesonan tedun, tur budal nenten makta punapa-punapi.\\n\\nRawuh
  ring pondok rabine nyanggra : \\\"Inggih... Beli... Napi mawinan wawu rawuh. Napi
  ke beli mangguhang baya ring alase?\\\". I Lubdaka raris gelis nyawis: \\\"Adi sayang...
  beli tusing mulih ibi, sawireh beli kanti ka sanja, abesik tusing maan buron. Jengah
  keneh beline, lantas ngungsi alas sripit, ditu masih tusing ada buron.\\n\\nTur
  tusing marasa saget suba sanja. Yen beli mulih jejeh kapetengan di jalan, tur elah
  I macan ngebog dewek beli. Ento kerana beli nginep di tengah alase, duwur punyan
  bilane beli ngesil, magadang nganti ka lemah. Sambil magadang beli ngenehang dewek,
  sujatine jele pesan solah beli ane suba. Beli langgane mancut pramanan I buron.
  Ia i buron sujatine patuh cara I raga, ia masih mabudi idup. Ento kerana ane jani,
  beli lakar suwud maboros. Beli suwud ngambekang solah mamati-mati, ane madan Himsa
  Karma\\\".\\n\\nNgawit punika I Lubdaka wusan maboros, tur geginan ipun sane mangkin,
  wantah matetanduran ring tegale. Pikolih matetanduran, anggen ipun ngupapira pianak
  somah.\\n\\nKacrita ring sampun I Lubdhaka lingsir, tur tiben sungkan raat pisan
  raris seda. Raris pianaknyane ngupakara layon I Lubdaka, Ngaben lantur Nyekah manut
  dresta.\\nSampun puput pulah palih ngupakara, atman I Lubdaka raris malesat ka niskala,\\n\\ntur
  sampun rawuh ring teleng marga sanga. Ring teleng marga sanga, atman I Lubdaka bengong,
  santukan ten uning ring genah jagi katuju. Daweg punika raris rawuh cikrabala akeh
  pisan, sahasa ngoros atman I Lubdaka, raris katur ring Ida Sang Hyang Suratma, ida
  pinaka dewa nyurat solah atmane.\\n\\nIda Sang Hyang Suratma raris mataken: \\\"Eh...
  cai atma... nyen adan caine? Apa gaen caine di mercepada? Lautang jani cai matur
  teken manira\\\".\\n\\nAtman I Lubdaka raris matur sada ngejer: \\\"Inggih... Ratu...
  titiang mawasta I Lubdaka. Karyan titiang ring jagate wantah maboros\\\".\\n\\nWawu
  asapunika atur I Lubdaka, raris Ida Sang Hyang Suratma mawecana: \\\"Eh... Lubdhaka...
  yen keto solah cai, ento madan Himsa Karma. Jele pesan solah cai. Ane jani sandang
  dosan caine, malebok dikawahe satus tiban\\\".\\n\\nPuput Ida Sang Hyang Suratma
  mangucap, raris cikrabala sami ngoros atman I Lubdaka kabakta ka kawah Candra Goh
  Muka. Rawuh ring teleng margi, tan pasangkan rawuh Surapsara akeh pisan melanin
  atman I Lubdaka.\\n\\nPara cikrabala raris mataken, \\\"Eh... Surapsara, ngudiang
  I dewa melanin atman I Lubdaka ane setata masolah corah di gumine?\\\".\\n\\nSurapsara
  sami mangucap, \\\"Eh... cikrabala, apang i dewa tatas, tiang kandikayang olih Ida
  Hyang Siwa, mendak atman I Lubdhaka\\\".\\n\\nYadiastun Ida Sang Hyang Siwa, sane
  ngarsayang atman I Lubdaka, cikrabala sami nenten kayun nyerah, santukan para cikrabala,
  pageh ngamel swadharma, mayang-mayang atma sane corah. Punika mawinan atman I Lubdaka,
  kukuh kagamel. Raris metu yuda\\nrames. Kasuwen-suwen kasor cikrabala sami. Atman
  I Lubdaka kagayot olih Surapsara, kagenahang ring joli emas.\\n\\nNenten suwe pamargin
  Surapsara sami, sampun rawuh ring Siwa Loka, raris atman I Lubdaka, katur ring Ida
  Sang Hyang Siwa.\\nIda Sang Hyang Yama mireng indik asapunika, raris gelis tangkil
  ring Ida Sang Hyang Siwa. Sampun rawuh ring ajeng Ida Sang Hyang Siwa, raris Ida
  Sang Hyang Yama matur, \\\"Inggih... Ratu Sang Hyang Siwa, I ratu sane ngardi awig-awig
  jagat, yan masolah becik polih linggih sane becik, yan masolah kawon polih linggih
  sane kawon. Raris I Lubdaka, sekala solah ipune kawon pisan, ngambekang solah mamati-mati.
  Dados ipun sane icen I Ratu linggih becik?. Yan puniki margiang I Ratu, janten katulad
  olih panjake sami, tur janten rug jagate\\\".\\n\\nAsapunika atur Ida Sang Hyang
  Yama, ten cumpu ring pamargin Ida Sang Hyang Siwa, ngicen I Lubdaka linggih becik.\\nWawu
  asapunika atur Ida Sang Hyang Yama, raris Ida Sang Hyang Siwa nyawis, \\\"Uduh...
  Dewa Sang Hyang Yama, eda Dewa salit arsa ( iwang penampen ). Saja I Lubdaka masolah
  Himsa Karma, nanging nuju Panglong pat belas Tilem Kapitu, ia suba ngelar brata,
  anggona nglebur dosane makejang\\\".\\n\\nMireng bawos Ida Sang Hyang Siwa asapunika,
  ngancan nenten tatas Ida Sang Hyang Yama, raris Ida mangucap malih, \\\"Inggih...
  Ratu Bethara, titiang pedas pisan, daweg punika I Lubdaka, wantah magadang ka lemah.
  Dados ipun wantah magadang, kabawos ipun ngelar brata?\\\".\\n\\nIda Sang Hyang
  Siwa raris gelis nyawis, \\\"Uduh... Dewa Sang Hyang Yama, mangkin nira nartayang
  indik i manusa. I manusa sujatine damuh sane sering lali. Lali maring raga, tur
  lali ring Ida Sang Hyang Widhi. Antuk laline mangliput, mawinan kenehne sering paling,
  mawastu sering masolah dursila. Raris antuk majagra utawi magadang Nira ngajahin
  manusa mangda eling ring raga. Majagra kalaning panglong pat pat belas, Tileming
  Kapitu. Sedeng becik daweg punika, nira ngelar yoga, mawinan duk punika kaucap rahina
  Siwa Ratri. Sane mangkin manira jagi nartayang, indik Bratha Siwa Ratri salanturnyane,
  majagra wewehin upawasa. Upawasa ten keni pangan kinum. Raris bratha Siwa Ratri
  malih siki, sane kabawos pinih utama, majgra, upawasa lan monobrata. Monobrata inggih
  punika meneng ening\\\".\\n\\nIda Sang Hyang Yama malih masabda, \\\"Inggih Ratu...
  titiang meled uning, napi mawinan ring Panglong pang pat belas, Tilem Kapitu, kanggen
  galah utama nangun bratha?\\\".\\nIda Sang Hyang Siwa raris masabda, \\\"Suksman
  Tilem Kapitu inggih punika sekalane jagate kapetengan, maka niasa manah peteng.
  Sane ngardi manahe peteng wenten pepitu. Mangkin jagi dartayang nira saka siki.\\n\\n1.
  Kaping siki SURUPA, punyah antuk goba jegeg wyadin bagus.\\n2. Kaping kalih DHANA,
  punyah antuk sugih arta brana.\\n3. Kaping tiga GUNA, punyah antuk kawagedan.\\n4.
  Kaping papat KULINA, punyah antuk wangsa lwih.\\n5. Kaping lima YOWANA, punyah antuk
  merasa nedeng teruna.\\n6. Kaping enem SURA, punyah antuk tuwak wyadin arak, miwah
  salwir tetayuban sane ngranayah punyah, rawuhing ring salwiring Narkoba sami.\\n7.
  Kaping pitu KASURAN, punyah antuk merasa dewek wanen.\\n\\nPepitu sane ngawe manah
  peteng, sane ngawe manah paling, punika mawasta Sapta Timira. Kapetengan manah punika
  sane patut galangin antuk majagra, mangda I raga ten masolah dursila\\\".\\nSane
  mangkin manira jagi nartayang tata krama ngelar Bratha Siwa Ratri, mangda asuci
  laksana riin.\\n\\\"Raris ring sampune sandyakala, ngunggahang pejati lan daksina,
  ring Sanggah Kamulan. Ring ajeng ngastawa katur upakara sesayut, pangambeyan, prayascita,
  lingga saking sekar widuri putih, aledin antuk dawun pisang kayu\\\".\\nRaris ulengan
  kayune ring Ida Sang Hyang Siwa sane malingga ring linggane, lingga punika maka
  linggih Ida Sang Hyang Siwa.\\n\\nRing sampune tengahing wengi malih ngastawa. Kalaning
  wengi mangda nenten arip, gita Lubdhakane tembangan, becik anggen suluh urip, mangda
  ten kantun masolah dursila\\\".\\nWawu asapunika bawos Ida Sang Hyang Siwa, wawu
  raris Ida Sang Hyang Yama tatas,\\nraris Ida mawecana, \\\"Inggih... Ratu Maha Luwih,
  titiang matur suksma ring I Ratu, I Ratu ledang nartayang indik brata Siwa Ratri
  sajangkepnyane, mawinan titiang tatas uning kawyaktyanne. Sane mangkin tityang nglungsur
  pamit ring anggan I Ratu\\\". Puput matur raris Ida Sang Hyang Yama budal mawali
  ka Yama Loka.\\n\\nsumber : satuabaliku.blogspot.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0tag:blogger.com,1999:blog-2131724523036064124.post-80793630281277986672013-08-29T18:54:00.002-07:002013-08-29T18:54:53.705-07:00Satua
  Bali : I Cicing Gudig\\n\\n\\nilustrasi i cicing gudig\\n\\nNah ada kone tuturan
  satua I Cicing Gudig. I Cicing Gudig, buka adanne berag tegreg tur keskes gudig,
  sing jalana mlispis ada dogen anak ngesekang wiadin ngaltig. Sai-sai kone ia maselselan,
  nyelselang buat kalacuranne tumbuh dadi cicing makejang anake tuara ngiyengin.\\n\\nSedek
  dina anu I Cicing Gudig mlispis di pekene. Ada kone anak madaar di dagang nasine,
  ento kone nengnenga menek tuunanga dogen. Kene kenehne I Cicing Gudig, \\\"Yan i
  dewek dadi manusa buka anake ento, kenken ya legan nyete ngamah, mebe soroh ane
  melah-melah. Ah kene baan, nyanan petenge lakar mabakti ke Pura Dalem, mapinunas
  teken Batari Durga apang dadi manusa.\\\"\\n\\n\\nKacrita suba peteng, mabakti kone
  lantas I Cicing Gudig di Pura Dalem. Medal lantas Ida Betari Durga tur ngandika
  teken I Cicing Gudig, \\\"Ih iba Cicing Gudig, dadi iba ngacep nira, apa katunasang?\\\"
  Masaut I Cicing Gudig, \\\"Inggih paduka Betari, yan paduka Betari ledang, titiang
  mapinunas mangda dados manusa.\\\"\\n\\nKalugra kone pinunasne I Cicing Gudig, lantas
  ia dadi jlema. Dening I Cicing Gudig tusing bisa ngalih gae, tusing pati kone ngamah.
  Mara-maraan ngamah ulihan maan mamaling. Pepes kone ia katara mamaling. Lantas buin
  kone ia mabakti di Pura Dalem. Medal lantas Ida Betari Durga tur ngandika teken
  I Cicing Gudig, \\\"Ih iba cai I Cicing Gudig, ngenken dadi iba buin mai?\\\" Matur
  I Cicing Gudig, \\\"Inggih paduka Betari, titiang tan wenten demen dados manusa
  panjak. Yan paduka Betari ledang, titiang mapinunas mangda dados \\\"Patih\\\".
  Ida Betari Durga lugra.\\n\\nNujuang pesan kone dugase ento Ida Sang Prabu ngrereh
  buin adiri. I Cicing Gudig lantas kandikaang dadi Patih, tur I Cicing Gudig ngiring.\\\"Beh
  keweh pesan i dewek dadi Pepatih, tusing maan ngenken-ngenken, begbeg pesan kandikayang
  tangkil ka puri. Yan i dewek dadi Anak Agung, kenken ya legan nyete nunden-nunden
  dogen.\\\" Keto kenehne I Cicing Gudig. Nyanan petengne buin kone ia mabakti di
  Pura Dalem, mapinunasang apang dadi Anak Agung. Ida Betari Durga lugra, lantas patuh
  pesan kone goban I Cicing Gudige teken warna Ida Sang Prabu.\\n\\nKacrita sedek
  dina anu Sang Prabu lunga maboros ka alase, macelig kone I Cicing Gudig ka puri.
  Dening patuh goban I Cicing Gudige teken Ida Sang Prabu, dadi kasengguh Ida Sang
  Prabu kone ia baan I Patih muah teken prayogiane ane len-lenan.\\nMatur I Patih
  saha bakti, \\\"Titiang mamitang lugra Ratu Sang Prabu, punapi awinan dados Cokor
  I Ratu paragayan tulak saking paburuan?\\\" Masaut I Cicing Gudig, \\\"Kene Patih,
  mawinan nira tulak, saking nira ngiringang sabdan Betara, tan kalugra nira malaksana
  mamati-mati. Kandikayang lantas nira tulak. To juru borose ada pinunasa teken nira,
  tusing ngiring mantuk, krana kadunga suba makenaan. Nira nglugrahin, mawanan tan
  pairingan nira mulih.\\\" Keto pamunyinne I Cicing Gudig, teka jag ngugu kone I
  Patih muah panjake ane len-lenan.\\n\\nKacrita sai-sai kone I Cicing Gudig ngraosin
  anak mawikara. Reh Cicig gudig tuara nawang lud, makejang wikaran anake pelih baana
  ngundukang, ane patut menang kalahanga, anak patut kalah menanganga. Mawanan kaupet
  kone I Cicing Gudig dadi Agung, sawai-wai ngencanin anak mawikara dogen. Yan I Dewek
  okan Anak Agung, kenken ya demene, kema mai malali iringang parekan, di kenkene
  magandong, buina tusing pesan ngitungan apan-apan, sajawaning ngamah teken malali
  dogen.\\nNyanan petengne, mabakti kone buin I Cicing Gudig di Pura Dalem, mapinunas
  apang dadi okan Anak Agung. Ida Betari Durga lugra. Patuh lantas gobanne I Cicing
  Gudig buka warnanida Raden Mantri.\\n\\nBuin mani semenganne, maorta ilang kone
  lantas Ida Raden Mantri. Ya sedeng ewana jerone ngibukang Raden Mantri, deleng-deleng
  kone lantas I Cicing Gudig ngapuriang. Reh Cicing Gudig kasengguh Raden Mantri,
  makesiar kone keneh wang jerone makejang.\\nKacrita jani I Cicing Gudig kapurukang
  malajah masastra. Dening asing ajahina muah takonina I Cicing Gudig tuara karoan
  baana apa, saapan kone lantas gurune ngemplangin I Cicing Gudig. \\\"Koang,\\\"
  keto kone aduhanne I Cicing Gudig. Dening keto, buin kone pasangetina ngemplangin
  I Cicing Gudig. \\\"Koang,\\\" keto kone buin aduhanne. Buin kemplangina tur pasangetina,
  buin kone I Cicing Gudig makoangan. Brangti kone lantas gurunne, lantas ia nyemak
  penyalin anggona nigtig I Cicing Gudig, kanti enceh-enceh, mara kone suudanga.\\n\\nKacrita
  nyanan petengne kone ka Pura Dalem lantas I Cicing Gudig mabakti, mapinunas apang
  buin dadi Cicing Gudig buka jati mula. I Cicing Gudig lantas buin dadi cicing gudig.\\n\\n\\nsumber
