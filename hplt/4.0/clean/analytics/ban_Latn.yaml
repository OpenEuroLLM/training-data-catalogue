  Bali : Nang Bangsing tek\u00e9n I Belog\\nTuah ada tuturan satua anak masawitra
  ajaka dadua, madan Nang Bangsing tek\u00e9n I Belog. Pasawitran\u00e9 kon\u00e9
  mula sangkaning nek\u00e9ng tuas, pakrubuk ajaka dadua saling silih, saling tulungin
  y\u00e9n p\u00e9t ada silih tunggil tusing ngelah tur ngelah gega\u00e9n abot. Ento
  mawinan Nang Bangsing ajaka I Belog setata ngenah anut y\u00e9n upamiang kadi y\u00e9h\u00e9
  di pason\u00e9 tusing ta\u00e9n makl\u00e9ncokan buat leketn\u00e9 masawitra.\\nKacrita
  I Belog anak ia sajaan buka adann\u00e9 belog pesan tur tutut. Sedek dina anu ajakina
  kon\u00e9 I Belog makena bubu tek\u00e9n Nang Bangsing. I Belog nyanggupin pangajak
  Nang Bangsing\u00e9 lakar makena bubu. Ditu pesu kon\u00e9 dot kenehn\u00e9 nawang
  baneh an\u00e9 anggona mikatin b\u00e9 tek\u00e9n Nang Bangsing, laut ia matakon,
  \u201cBeli, beli, apa anggon baneh bubun\u00e9, turin dija anak\u00e9 makena bubu?\u201d\\nMara
  k\u00e9to patakonn\u00e9 I Belog, dadi pesu jailn\u00e9 Nang Bangsing kapining I
  Belog, turin ia lantas masaut sada guyu, \u201cIh, Belog, yan anak\u00e9 manehin
  bubu tusing dadi l\u00e9nan tek\u00e9n jaja kukus akuskusan mulu tusing dadi embuhan,
  tek\u00e9n unti nyuhan abungkul, suba k\u00e9to kenaang lantas di pagehan\u00e9!\u201d\\n\\nBuin
  maninn\u00e9, pasemengan d\u00e9gd\u00e9g I Belog lantas meli ketan ac\u00e9\u00e9ng,
  nyuh abungkul muah gula duang tebih. Suba genep makejang lakar jajann\u00e9, lantas
  lebengina, tur di subann\u00e9 lebeng lantas banehina bubunn\u00e9. Di subann\u00e9
  suud manehin, lantas kon\u00e9 bubun\u00e9 kenaanga di pagehan\u00e9.\\n\\nKacrita
  Nang Bangsing makena bubu, nanging di tukad\u00e9. An\u00e9 jani, suba pada suud
  makena bubu lantas Nang Bangsing ajaka I Belog mapitungan, k\u00e9n\u00e9 munyinn\u00e9
  Nang Bangsing, \u201cBelog, wir\u00e9h i raga ajak dadua jani suba pada makena bubu,
  jalan sirep selidan, tusing dadi magadang. Buin mani apang nu semengan pesan ngangkid
  bubu.\u201d K\u00e9to munyinn\u00e9 Nang Bangsing. D\u00e9ning k\u00e9to, sajaan
  nu selidan kon\u00e9 suba I Belog pules. Suba sawatara tengah lemeng, ditu lantas
  Nang Bangsing bangun uli pasar\u00e9an nyemak bubunn\u00e9 I Belog tur telahanga
  daara jajann\u00e9. Di subann\u00e9 telah, lantas bubunn\u00e9 I Belog pejunina,
  laut buin melahanga ngejang di tongosn\u00e9 i tunian. Suba k\u00e9to mulih lantas
  Nang Bangsing buin masar\u00e9.\\n\\nGelisin satua, suba kon\u00e9 makruyuk siap\u00e9
  mara acepok, enten lantas I Belog tur bangun ngl\u00e9jat laut ia ngalih Nang Bangsing
  , \u201cNang Bangsing, Nang Bangsing, suba semengan dong jalan angkid bubun\u00e9!\u201d\\n\\n\u201cEnd\u00e9n
  malu.\u201d K\u00e9to pasautn\u00e9 Nang Bangsing uli di pasar\u00e9an, lantas antianga
  kon\u00e9 tek\u00e9n I Belog di teb\u00e9nan.\\n\\nBuin kejepn\u00e9 makruyuk siap\u00e9
  buin acepok, ditu buin dunduna Nang Bangsing baan I Belog, \u201cBeli Nang Bangsing,
  mai suba angkid bubun\u00e9, suba lemah n\u00e9.\u201d\\n\\n\u201cEnd\u00e9n k\u00e9
  sedeng jaenn\u00e9 pules belin\u00e9, antosang buin aklepugan!\u201d K\u00e9to pasautn\u00e9
  Nang Bangsing. Kanti ngepah kon\u00e9 I Belog ngantiang Nang Bangsing pules, telah
  awakn\u00e9 garang legu. Wir\u00e9h tusing tahen garang legu buin kon\u00e9 gubega
  Nang Bangsing tek\u00e9n I Belog, \u201cJalan t\u00e9 \u00e9nggalang angkid bubun\u00e9
  nyanan maluina tek\u00e9n pisagan\u00e9!\u201d K\u00e9to abetn\u00e9 I Belog.\\n\\nNang
  Bangsing bangun mapi-mapi kapupungan, kijap-kijap kon\u00e9 ia lantas masaut, \u201cJa\u2026a\u2026lan,
  jalan,\u201d k\u00e9to abetn\u00e9. Ditu lantas ajaka dadua paanjun majalan ngangkidang
  bubu.\\n\\nCritaang mara angkida bubunn\u00e9 I Belog sag\u00e9t bek misi tai, nanging
  banehn\u00e9 telah. B\u00e9h pedih kon\u00e9 basangn\u00e9 ia sambilanga ngrengkeng,
  \u201cN\u00e9 bubu apa t\u00e9n\u00e9nan dadi bek misi tai.\u201d K\u00e9to munyinn\u00e9
  I Belog sambilanga ngediang tain\u00e9.\\n\\nKacrita mulih lantas I Belog ngaba
  bubu puyung. Buin akejepn\u00e9 teka Nang Bangsing magr\u00e9ndotan ngaba bubu,
  tur liu misi b\u00e9, ada lindung, deleg, l\u00e9l\u00e9, kulen, muah an\u00e9 l\u00e9nan.
  Ditu lantas matakon I Belog tek\u00e9n Nang Bangsing, \u201cNang Bangsing, k\u00e9nk\u00e9n
  ya dadi bek bubun icang\u00e9 misi tai buina banehn\u00e9 telah?\u201d Dadi masaut
  lantas Nang Bangsing, \u201cAh, da k\u00e9ta baana, buin mani da ditu makena bubu,
  ditu laku di punyan nyuh\u00e9, tur salinin banehn\u00e9. Nangka anggon baneh an\u00e9
  nasak abungkul!\u201d K\u00e9to munyinn\u00e9 Nang Bangsing. Sajaan kon\u00e9 lantas
  I Belog ngalih nangka nasak anggona baneh bubunn\u00e9, laut kenaanga ba duur di
  punyan nyuh\u00e9.\\n\\nGelisang satua \u00e9nggal, Nang Bangsing masi makena kon\u00e9
  ia bubu, nanging bet\u00e9n nyuh\u00e9 an\u00e9 kenaina bubu baan I Belog, d\u00e9ning
  ditu ada tlabah an\u00e9 liu misi b\u00e9. Di subann\u00e9 pada suud makena bubu,
  lantas mulih ajaka dadua. Nganteg jumah, selidan gati suba I Belog pules jejeh kenehn\u00e9
  tengai bangun.\\n\\nKacrita suba tengah lemeng buin lantas aliha bubunn\u00e9 I
  Belog tek\u00e9n Nang Bangsing, banehn\u00e9 dog\u00e9n juanga abana mulih tur buin
  ia masar\u00e9. Gelisin satua, suba kon\u00e9 lemah, bangun lantas I Belog, tur
  lantas ngangkid bubunn\u00e9. Mara jemaka puyung buina banehn\u00e9 telah, ditu
  gedeg pesan kon\u00e9 basangn\u00e9 I Belog, ia ngrengkeng, \u201cB\u00e9h, saking
  ja bubun\u00e9 t\u00e9n\u00e9nan bantug, melahan suba jani tektek polonn\u00e9.\u201d\\n\\nMara
  ukana tekteka bubun\u00e9 baan I Belog, sag\u00e9t ada Kedis Selem teka uli kaja
  kangin, jeg macelep ka tengah bubunn\u00e9. Mara k\u00e9to, ngon tur liwat kendeln\u00e9
  I Belog, \u201cB\u00e9h, jani ja payu maan b\u00e9, gantin i d\u00e9w\u00e9k\u00e9
  ta\u00e9n naar b\u00e9 kedis selem.\u201d K\u00e9to munyinn\u00e9 I Belog.\\n\\nDitu
  lantas I Kedis Selem masaut, \u201cY\u00e9h Cai Belog, da Cai nampah d\u00e9w\u00e9k\u00e9.
  Yan Cai tusing nampah d\u00e9w\u00e9k\u00e9, apa ja idih Cai kapining i d\u00e9w\u00e9k,
  baanga ja.\u201d\\n\\nMara k\u00e9to munyinn\u00e9 i kedis masaut lantas I Belog,
  \u201cMasa ya kedis bisa maang ngidih apan-apan, dija nyen ngelah lud, melahan tampah
  dog\u00e9n suba jani.\u201d K\u00e9to abetn\u00e9 I Belog. Buin masaut i kedis,
  \u201cK\u00e9n\u00e9 Belog, yan Cai tusing ngugu munyin icang\u00e9, n\u00e9 bulun
  icang\u00e9 abut akatih lantas keberang men, kija ja pajalan bulun icang\u00e9 en\u00e9
  nyanan tututin dog\u00e9nan!\u201d K\u00e9to munyinn\u00e9 i kedis.\\n\\n\u201cSaja
  ya i kedis ngelah apan-apan, tegarang ja lakar tuutang buka pamunyinn\u00e9.\u201d
  K\u00e9to kenehn\u00e9 I Belog, tur abuta lantas bulun kampidn\u00e9 akatih, lantas
  l\u00e9bina kedis\u00e9. Makeber kon\u00e9 lantas I Kedis Selem ngaja kanginang.\\n\\nDi
  subann\u00e9 k\u00e9to, lantas keberanga bulun kedis\u00e9 an\u00e9 abuta tek\u00e9n
  I Belog, sajaan ngapirpir pajalann\u00e9 ngaja kanginang. Ento lantas tutuga baan
  I Belog. Mara ad\u00e9ng pajalann\u00e9 I Belog, bulun kedis\u00e9 ad\u00e9ng kon\u00e9
  masi pakebern\u00e9. Mara I Belog ngangsarang, bulun kedis\u00e9 bareng gangsar.
  K\u00e9to dog\u00e9n kon\u00e9 buat pajalann\u00e9 I Belog muah bulun kedis\u00e9.\\n\\nKacrita
  suba joh pajalann\u00e9 I Belog nututin pakebern\u00e9 i bulun Kedis Selem, sag\u00e9t
  kon\u00e9 ia nepukin puri melah pesan. Neked di jaban kori agung\u00e9 kancit ilang
  kon\u00e9 bulun kedis\u00e9 totonan. Ditu lantas ibuk kenehn\u00e9 I Belog tur ngrengkeng
  padidi buka k\u00e9n\u00e9, \u201cAh, saking ja mula kedis jail t\u00e9n\u00e9nan,
  d\u00e9w\u00e9k\u00e9 belog-beloga, jani mara neked dini ilang polonn\u00e9, d\u00e9w\u00e9ka
  tuara ja mabekel nyang ak\u00e9t\u00e9ng, kalud jani basang\u00e9 suba seduk.\u201d
  K\u00e9to abetn\u00e9 I Belog. Kabenengan dugas\u00e9 totonan ada kon\u00e9 parekan
  Anak\u00e9 Agung an\u00e9 nu\u00e9nang purin\u00e9 ento, ningeh munyin I Belog\u00e9.
  Ditu lantas takonina I Belog tek\u00e9n I Parekan, \u201cIh, jero, sampunang jeron\u00e9
  ngraos k\u00e9nten, nyen uningina tek\u00e9n Anak\u00e9 Agung driki, janten jeron\u00e9
  ngemasin sisip. Jeron\u00e9 jadma saking dija?\u201d\\n\\nMasaut lantas I Belog,
  ngandang-nganjuh kon\u00e9 pasautn\u00e9, \u201cAh, apin ja sisip depang ya, anak
  saja kedis beler melog-melog d\u00e9w\u00e9k\u00e9.\u201d Mara k\u00e9to pasautn\u00e9
  I Belog, lantas ng\u00e9nggalang I Parekan ngapuriang matur tek\u00e9n Ida Anak\u00e9
  Agung kauningang saindik-indikn\u00e9 I Belog. D\u00e9ning k\u00e9to, Ida Anak\u00e9
  Agung lantas ngandikain I Belog parek ka puri. Sasubann\u00e9 I Belog tangkil, ditu
  Ida Anak\u00e9 Agung ngandika, \u201cIh Belog, Cai nyak nunas nasi dini?\u201d\\n\\nMatur
  I Belog, \u201cInggih, tiang nyak basang tiang\u00e9 seduk gati, uling ibi tiang
  tusing kena nasi.\u201d Mara k\u00e9to aturn\u00e9 I Belog, lantas kandikaang parekann\u00e9
  nyagiang I Belog.\\n\\nKacrita jani I Belog suba ngarepin sagi, mara tingalina nasin\u00e9
  tuah abedik pesan, rasa asopan kuangan. Ditu ia ngrengkeng, \u201cB\u00e9h, tuah
  amon\u00e9 baanga ngidih nasi, acepok dog\u00e9n sop telah, saking ja Anak Agung
  demit makilit t\u00e9n\u00e9nan.\u201d K\u00e9to kenehn\u00e9 I Belog, nanging k\u00e9
  tunasa masi nasin\u00e9 ento. Sabilang sopa nasin\u00e9 ento, nu dog\u00e9n buin
  asopan, k\u00e9to masi b\u00e9nn\u00e9 sing ja bisa telah. Di subann\u00e9 basangn\u00e9
  I Belog masa wareg, mara nasin\u00e9 ento telah.\\n\\nSuud nunas, I Belog lantas
  kon\u00e9 ia malali-lali di jabaan. Sedekan ia klicak-klicak, ditu ia kaukina baan
  I Panunggun Lawang, \u201cIh Belog, mai ja malu!\u201d Mara k\u00e9to lantas srapat
  I Belog nyagjag tur ia matakon nyekedang, \u201cNg\u00e9ngk\u00e9n jero gebagan?\u201d\\n\\n\u201cK\u00e9n\u00e9
  Belog, y\u00e9n pad\u00e9 Cai ic\u00e9na barang-barang tek\u00e9n Anak\u00e9 Agung
  da nyaka. Ento ada jaran berag, to men tunas!\u201d\\n\\n\u201cNah, yan k\u00e9to
  tiang ngidepang.\u201d K\u00e9to pasautn\u00e9 I Belog bebelogan tuara ada palawanan
  nyang abedik. Suba k\u00e9to lantas takonina I Belog tek\u00e9n Anak\u00e9 Agung,
  \u201cIh Belog, jani apa lakar tunas Cai tek\u00e9n nira? Cai demen tek\u00e9n kamben,
  pipis, mas, muah an\u00e9 l\u00e9n-l\u00e9nan?\u201d\\n\\nMasaut I Belog, \u201cInggih
  Ratu Anak Agung, titiang n\u00e9nten nunas an\u00e9 k\u00e9nten-k\u00e9nten. Y\u00e9n
  I Ratu l\u00e9dang, kudan\u00e9 san\u00e9 berag punika pamitang titiang, lianan
  ring punika titiang n\u00e9nten demen.\u201d Mara k\u00e9to aturn\u00e9 I Belog,
  lantas ngandika Anak\u00e9 Agung, \u201cY\u00e9h Cai Belog, dadi jaran demenin Cai?
  Cai awak tuara, sing ngelah apa-apa. Men, n\u00e9 jaran niran\u00e9 anak nagih pedeman
  an\u00e9 melah. K\u00e9nk\u00e9n ja pedeman Cain\u00e9, apang k\u00e9to masi pedeman
  jaran\u00e9, tur amah-amahann\u00e9 k\u00e9to masi, yan Cai naar nasi misi b\u00e9,
  jaran\u00e9 ngamah nasi misi b\u00e9 masi. Cendekn\u00e9 apa ja dedaaran Cain\u00e9,
  jaran\u00e9 an\u00e9 k\u00e9to baang!\u201d K\u00e9to pangandikan Anak\u00e9 Agung.\\n\\n\u201cInggih
  Ratu Anak Agung, yadian asapunika, sak\u00e9wanten Cokor I D\u00e9wa su\u00e9ca
  ring titiang, sasidan-sidan antuk titiang ngubuhin.\u201d Ngandika buin Ida Anak\u00e9
  Agung, \u201cNah y\u00e9n k\u00e9to Belog, juang jaran niran\u00e9 ento, nira sing
  ja lakar mucingin.\u201d\\n\\nD\u00e9ning k\u00e9to lantas kandikain I Parekan,
  \u201cIh parekan, kema jemakang I Belog jaran\u00e9 an\u00e9 berag! D\u00e9ning
  an\u00e9 k\u00e9to kon\u00e9 demenina.\u201d Majalan lantas I Parekan nyemak jaran
  turin lantas kabaang I Belog. Suba k\u00e9to lantas mapamit I Belog tek\u00e9n Ida
  Anak\u00e9 Agung. Jaran\u00e9 ento lantas kategakin. Wir\u00e9h jaran berag, dadi
  tusing nyidaang kon\u00e9 baana malaib. Mara kedenga talin padangalan\u00e9, makipekan
  kori jaran\u00e9 tan mari ia majalan bejag-bejug dasdasan I Belog labuhanga.\\n\\nD\u00e9ning
  k\u00e9to pajalann\u00e9 I Belog, dadi liu kon\u00e9 anak\u00e9 ngiwasin undukn\u00e9
  negakin jaran, saha pada ngomong k\u00e9n\u00e9, \u201cB\u00e9h, I Belog, adi juari
  gatin\u00e9 negakin jaran kak\u00e9n\u00e9 beragn\u00e9, yan i d\u00e9w\u00e9k ngelah
  adaan tanem dog\u00e9n suba. Ngudiang ngubuhin jaran nga\u00e9nang d\u00e9w\u00e9k\u00e9
  kimud dog\u00e9n.\u201d\\n\\nNingeh raos brayan\u00e9 pada pakrimik ngraosang unduk
  pajalann\u00e9 I Belog negakin jaran srayang-sruyung buka k\u00e9to, dadi pesu kon\u00e9
  pedih kenehn\u00e9 ia tur masaut, \u201cB\u00e9h, demenan ngomong jeron\u00e9, nyen
  katumbragin jaran mara nawang asann\u00e9.\u201d K\u00e9to pasautn\u00e9 I Belog
  sada bangras sambilanga nigtig jarann\u00e9. Salantang jalan an\u00e9 liwatina baan
  I Belog, makejang anak\u00e9 an\u00e9 nepukin buat undukn\u00e9 ia buka kak\u00e9to
  ked\u00e9k tur nyailin. K\u00e9to masi kon\u00e9 ia I Belog pedih pesan kenehn\u00e9
  mara ked\u00e9kina tur jailina.\\n\\nTan crita I Belog di jalan, \u00e9nggal kon\u00e9
  ia neked jumahn\u00e9. Sasubann\u00e9 neked jumah, sag\u00e9t jarann\u00e9 mejuang
  pipis mabrarakan liu gati. \u00c9nggal laut I Belog ngampilang pipis\u00e9 apang
  tusing ada anak nepukin jaran\u00e9 bisa mejuang pipis. Suba maan mategtegan, ditu
  lantas I Belog ngaukin m\u00e9m\u00e9nn\u00e9 tur kabaang ngidih pipis. M\u00e9m\u00e9nn\u00e9
  tangkejut laut matakon, \u201cBelog dija Cai maan pipis liu buka kak\u00e9n\u00e9?\u201d\\n\\nMasaut
  I Belog, \u201cM\u00e9m\u00e9 siep dog\u00e9n, kema bayah utang m\u00e9m\u00e9n\u00e9
  dija ja ngelah anggehan, buina kema M\u00e9m\u00e9 ka peken beliang icang b\u00e9
  c\u00e9l\u00e9ng, lakar basa, baas liunang, sambilang masi ngaukin brayan\u00e9
  ajak mulih apang ada nulungin malebengan!\u201d D\u00e9ning k\u00e9to pangidihan
  I Belog, m\u00e9m\u00e9nn\u00e9 tusing liu raos jag laut majalan mayah anggehan
  tur nglaut mameken meli magenepan lakar anggona m\u00e9bat-\u00e9batan. Suba pada
  jangkep beblanjan\u00e9, M\u00e9n Belog lantas mulih sambilanga masi ngaukin brayan\u00e9
  apanga nulungin d\u00e9w\u00e9kn\u00e9 m\u00e9bat.\\n\\nKacrita jani pisaga miwah
  panyamann\u00e9 I Belog suba makejang pada teka, ada ngaba blakas, pangrupak, talenan,
  miwah gegawan m\u00e9bat an\u00e9 l\u00e9nan. I Belog ngatikang brayan\u00e9 nglawar.
  Gelisan tuturan satua, suba kon\u00e9 suud malebengan, I Belog laut iju nyagiang
  jaran\u00e9 sagi agenepan. Suba pragat maang jaran\u00e9 ngamah, lantas tamiun\u00e9
  kedenga madaar baan I Belog. Suud madaar, dimulih\u00e9 makejang kon\u00e9 tamiunn\u00e9
  baanga kaputan nasi misi b\u00e9, tum, lawar, miwah jukut ar\u00e9s baan m\u00e9m\u00e9nn\u00e9
  I Belog. Seed tamiunn\u00e9 ngaba aba-abaan uli jumah I Belog.\\n\\nGelisan satua,
  dimulih\u00e9, tamiun\u00e9 tepukina tek\u00e9n Nang Bangsing, lantas ia matakon,
  \u201cIh Bapa, Beli, BMbok, lan luh-luh ajak makejang teka uli dija n\u00e9, mirib
  teka uli kundangan aa?\u201d Masaut lantas an\u00e9 takonina k\u00e9n\u00e9.\\n\\n\u201cAa,
  bapa uli kundangan sig umahn\u00e9 I Belog.\u201d K\u00e9to abetn\u00e9 makejang
  masaut buka briukan panggul\u00e9, patuh pasautn\u00e9. D\u00e9ning k\u00e9to, makesiab
  Nang Bangsing ningeh pangakuan anak\u00e9 an\u00e9 tepukina di jalan totonan, wir\u00e9h
  tusing perah lakar I Belog nyidaang ngingu anak liu buka an\u00e9 tepukina. Buina,
  kadi rasa an\u00e9 daara padidi dog\u00e9nan suba I Belog kuangan, k\u00e9to tarka
  Nang Bangsing padidi. Ditu lantas dot kenehn\u00e9 Nang Bangsing lakar matakon tek\u00e9n
  I Belog buat laksanan\u00e9 ngundang-undang ma\u00e9buh-\u00e9buhan buka k\u00e9to.
  \u00c9ngap-\u00e9ngap kon\u00e9 pajalann\u00e9 Nang Bangsing ngojog umahn\u00e9
  I Belog. Mara macelep di kubunn\u00e9 I Belog, sag\u00e9t tepukina Nang Bangsing
  teka kapining I Belog, laut ia matakon, \u201cBeli Nang Bangsing, anak uli dija
  dadi makedengasan tepukin tiang tindakan belin\u00e9 mulih ka pondok icang\u00e9?\u201d\\n\\nMasaut
  Nang Bangsing, \u201cBeli mula uli jumah, lakar nyadia matakon tek\u00e9ning Cai.\u201d\\nNimbal
  I Belog, \u201cMen, apa buat sarat takonang Beli kapining icang?\u201d\\n\\n\u201cO,
  unduk ento, k\u00e9n\u00e9 Belog, beli dot nawang wir\u00e9h beli ningeh Cai ibi
  nekaang braya liu ajak Cai m\u00e9bat-\u00e9batan, to dija Cai maan pipis anggon
  ngingu brayan\u00e9 liu gatin\u00e9?\u201d K\u00e9to abetn\u00e9 Nang Bangsing nyliksik
  dot nawang undukn\u00e9 I Belog.\\n\\nI Belog, anak mula belog tur polos, tusing
  bisa nyidra patakon anak, jeg mamolos masaut, \u201cO, unduk to saja Beli icang
  ngundang-undang,\u201d tur katuturang urah-arih d\u00e9w\u00e9kn\u00e9 uli makena
  bubu ngajak Nang Bangsing nganti bisa ngelah jaran. Mara k\u00e9to munyinn\u00e9
  I Belog, d\u00e9ning Nang Bangsing mula anak iri ati, ditu lantas nagih siliha jarann\u00e9
  I Belog. I Belog jag lega masi nyilihang jarann\u00e9 tek\u00e9n Nang Bangsing,
  wir\u00e9h ia tusing bisa demit, saha kategesin kon\u00e9 Nang Bangsing baan I Belog
  apanga miara jarann\u00e9 melah-melah.\\n\\n\u201cK\u00e9n\u00e9 Beli Nang Bangsing,
  yan Beli nyilih jaran icang\u00e9, k\u00e9nk\u00e9n ja dedaaran Belin\u00e9 ajak
  makejang jumah, jaran\u00e9 musti an\u00e9 k\u00e9to baang, tur pamedemann\u00e9
  masih k\u00e9to, k\u00e9nk\u00e9n ja pasar\u00e9an Belin\u00e9 apang k\u00e9to masi
  pedeman jaran\u00e9!\u201d K\u00e9to pabesenn\u00e9 I Belog tek\u00e9n Nang Bangsing.\\n\\nMasaut
  Nang Bangsing sada nengkik, \u201cYadiapin k\u00e9to Beli tusing kaberatan.\u201d
  Mara k\u00e9to buin kon\u00e9 I Belog nyekenang, \u201cNanging Beli, yan p\u00e9t
  mati jaran icang\u00e9, da tanema jumah Beli, mai aba kumah icang\u00e9!\u201d\\n\\n\u201cNah.\u201d
  K\u00e9to abetn\u00e9 Nang Bangsing, tur nglaut lantas jaran I Belog\u00e9 jemaka
  abana mulih baan Nang Bangsing.\\n\\nSasubann\u00e9 neked jumah, lantas Nang Bangsing
  ngorahin kurenann\u00e9, tund\u00e9na ngolah an\u00e9 jaen-jaen tur apanga ngundang
  brayan\u00e9 makejang ajaka map\u00e9sta jumahn\u00e9. Mara k\u00e9to munyin Nang
  Bangsing\u00e9, srapat lantas somahn\u00e9 ngundang krama banjaran\u00e9, d\u00e9ning
  Nang Bangsing tusing kuangan brana sinah \u00e9lah baana namiu anak\u00e9 a banjar.
  Para tamiun\u00e9 suba makejang pada teka, k\u00e9to masi lakar olah-olahan\u00e9
  suba masi pada jangkep. Pakrubuk nyamann\u00e9 ngolah tur kacrita \u00e9nggal suba
  pada lebeng. Makedus kon\u00e9 bon olah-olahan\u00e9 jaen pesan, suba pada pragat
  masagi, ditu lantas krama banjarn\u00e9 Nang Bangsing ajaka madaaran. Suba pada
  suud madaar, makejang braya, krama banjar\u00e9 mulih.\\n\\nGelising crita, suba
  pada mulih brayan\u00e9, ditu lantas Nang Bangsing buin nund\u00e9n kurenann\u00e9
  apanga meli kasur, galeng, muah tikeh an\u00e9 melah-melah. Nang Bangsing bincuh
  ngayahin jaran\u00e9, empek-empeka maang nasi, b\u00e9, lawar, gegor\u00e9ngan,
  muah an\u00e9 l\u00e9n-l\u00e9nan. Acepan\u00e9 apanga jaran\u00e9 liu mesuang pipis.\\n\\nKacrita
  suba sanja, lantas celepanga jaran\u00e9 kumah met\u00e9n, tur dampingina pedeman
  makasur lan matikeh anyar. Suba sawetara tengah lemeng, meju kon\u00e9 lantas jaran\u00e9,
  mejuang tai mising wir\u00e9h bes lebihan ngamah lawar.\\n\\nDi bal\u00e9 ged\u00e9n\u00e9,
  kacrita Nang Bangsing ajaka kurenann\u00e9 pakisi, \u201cNanangn\u00e9, turah icang
  jaran\u00e9 lakar mejuang pipis akroso, i tunian dingeh icang jaran\u00e9 suba meju
  pakr\u00e9c\u00e9k ulungan tainn\u00e9, sinah suba ento mas, p\u00e9rak, slaka mabrarakan,
  dong \u00e9nggalang jemak kumah met\u00e9n!\u201d K\u00e9to munyinn\u00e9 an\u00e9
  luh nundung somahn\u00e9.\\n\\nMasaut Nang Bangsing sada agul, \u201cW\u00e9\u00e9
  m\u00e9m\u00e9n\u00e9 eda t\u00e9h uyut, n\u00e9 nu peteng guminn\u00e9 mani semengan
  duduk alihang kisa batu apang melah baan ngaba.\u201d K\u00e9to pasautn\u00e9 Nang
  Bangsing laut madingin tundun somahn\u00e9. \u201cNah k\u00e9to ja k\u00e9to, nyaan
  maluina baan pisagan\u00e9 nuduk kanggoang talin pagehan mani gor\u00e9ng!\u201d
  M\u00e9n Bangsing masaut sambilanga maid saput buin sirep ngantosang lemah.\\n\\nGelisin
  satua \u00e9nggal, suba jani semengan, b\u00e9h saling pamaluin an\u00e9 luh ajaka
  an\u00e9 muani ngampakang jelanan dot lakar mulihan kumah met\u00e9n kanti saling
  kedeng, \u201cIcang baang maluan cang baang maluan.\u201d K\u00e9to abetn\u00e9
  ajaka dadua. Pamragat sibarengan lantas ia mulihan, dredesanga kon\u00e9 jelanan\u00e9
  ngampakang. Mara ia madelokan kumah met\u00e9n, ditu tepukina tain jaran\u00e9 mabrarakan
  ngebekin rongan tur bon\u00e9 malekag. M\u00e9n Bangsing kanti ngutah-utah ngadek
  bon tain jaran\u00e9 buka k\u00e9to. Ditu lantas Nang Bangsing brangti pesan kenehn\u00e9
  tek\u00e9n I Belog tur ngrengkeng k\u00e9n\u00e9, \u201cB\u00e9h, tendas bedag I
  Belog, belog-beloga d\u00e9w\u00e9k\u00e9, kalud pipis\u00e9 telah anggon namiu,
  ludin jumahan met\u00e9n bek misi tai. Ah da k\u00e9to baana, cendek baan jani makeneh,
  bakal matiang dog\u00e9n suba jaran\u00e9 t\u00e9n\u00e9nan.\u201d K\u00e9to munyinn\u00e9
  Nang Bangsing sambilanga nyemak madik, lantas sepegina makapatpat batis jaran\u00e9
  laut kon\u00e9 baongn\u00e9 goroka.\\n\\nAn\u00e9 jani kacrita kon\u00e9 I Belog
  wir\u00e9h makela suba jarann\u00e9 siliha baan Nang Bangsing masi kond\u00e9n ulihanga,
  ditu pesu kenehn\u00e9 lakar ngalih jarann\u00e9 kumah Nang Bangsing. Lantas ia
  majalan ngapang-ngapang kenehn\u00e9 suba di jaran\u00e9 dog\u00e9nan. Di subann\u00e9
  neked ditu lantas takonina Nang Bangsing, \u201cBeli, beli Nang Bangsing, jaran
  icang\u00e9 dija?\u201d\\n\\nMasaut Nang Bangsing masebeng sada sredah, \u201cB\u00e9h,
  jaran\u00e9 makelo suba matiang beli, wir\u00e9h ia meju di jumahan met\u00e9n tur
  tainn\u00e9 mising, bek pamelangan met\u00e9n belin\u00e9 misi tai, ento makrana
  lantas matiang beli.\\n\\nMasaut lantas I Belog, \u201cB\u00e9h, amonto suba seken
  pabesen icang\u00e9 tek\u00e9n Beli, dadi Beli tuara ngingetang. Men, jani dija
  bangk\u00e9n jaran\u00e9?\u201d \u201cB\u00e9h, yan buat ento ditu tanem beli ba
  dangin\u00e9.\u201d K\u00e9to pasautn\u00e9 Nang Bangsing nlegdeg.\\n\\nI Belog
  tusing mapalawanan, tusing liu raos, ia anak mula belog polos. Mara k\u00e9to munyinn\u00e9
  Nang Bangsing, nyrutcut lantas ia nganginang ngojog tongos an\u00e9 patujuina baan
  Nang Bangsing, alih-alihina laad gegumuk nanem jaran\u00e9. Suba tepukina, ditu
  b\u00e9t\u00e9 bangk\u00e9n jaran\u00e9 laut abana mulih prat\u00e9kana baan ia
  tur lantas tanema di sanggah kamulan\u00e9. Suba makelo-kelo, di tongos I Belog\u00e9
  nanem jaran\u00e9 mentik tiing petung duang katih tur tegeh ngalik. Nuju ada ujan
  bales, bah lantas tiing\u00e9 totonan, an\u00e9 akatih bah ngerobin peken Sangsit\u00e9,
  an\u00e9 buin katihn\u00e9 bah ngerobin peken Badung\u00e9.\\n\\nCritaang kon\u00e9
  punyan tiing\u00e9 an\u00e9 ebah ka peken Badung\u00e9, liu anak\u00e9 mameken ngejangin
  kamben, baju, senteng, kancrik, ada masi an\u00e9 ngengsutang saput, sarung, jal\u00e9r,
  muah an\u00e9 l\u00e9n-l\u00e9nan kanti bek misi magenepan. K\u00e9to masi an\u00e9
  ebah ka peken Sangsit\u00e9 ada anak ngantungin urutan, d\u00e9ngd\u00e9ng, lindung,
  muah an\u00e9 l\u00e9nan sarwa dedaaran\u00e9 an\u00e9 jaen-jaen. Di subann\u00e9
  bek pada tiing\u00e9 misi ma\u00e9ndahan, ditu buin kon\u00e9 lantas majujuk. B\u00e9h,
  bek umahn\u00e9 I Belog misi sarwa panganggo muah dedaaran an\u00e9 sarwa luih-luih.\\n\\nMara
  k\u00e9to, prajani kon\u00e9 I Belog dadi anak sugih, liu ngelah arta brana, buina
  yan nuju ia pesu ka jalan\u00e9, panganggon\u00e9 setata makr\u00e9n\u00e9b ngawinang
  ngon anak\u00e9 an\u00e9 nepukin, k\u00e9to masi m\u00e9m\u00e9nn\u00e9 l\u00e9n
  pesan bawan\u00e9 ngajak ipidan tusing nu s\u00e9ts\u00e9t pasuranting panganggon\u00e9,
  suba nuutin cara pianakn\u00e9 kedas gading. Paundukan I Belog buka kak\u00e9to
  buin kon\u00e9 dingeha baan Nang Bangsing. Patuh cara an\u00e9 maluan, buin kon\u00e9
  masi siliha tiingn\u00e9 I Belog baan Nang Bangsing. K\u00e9to masi I Belog tusing
  nemitang, buin kon\u00e9 masi baanga nyilih.\\n\\nKacrita jani Nang Bangsing ngidih
  tulungan tek\u00e9n krama banjarn\u00e9 lakar ngabut tiing uli jumahn\u00e9 I Belog
  abana kumahn\u00e9. Tiing\u00e9 lantas tanema di sanggahn\u00e9. Di subann\u00e9
  majujuk, lantas kon\u00e9 tiing\u00e9 buin bah ka peken Sangsit\u00e9 muah ka peken
  Badung\u00e9. Mara nepukin ada tiing buin bah ngungkul di peken Badung\u00e9, ditu
  para dagang\u00e9 pakrimik, sawir\u00e9h i pidin dugas\u00e9 kagantungin baju, kamben,
  muah an\u00e9 l\u00e9n-l\u00e9nan bisa ilang, jani lantas pesu jail para dagang\u00e9.
  Tiing\u00e9 laut kagantungin sarwa an\u00e9 pengit, makadi bangk\u00e9n c\u00e9l\u00e9ng,
  sera, leluu, mis an\u00e9 bengu, muah an\u00e9 l\u00e9nan. An\u00e9 bah ka peken
  Sangsit\u00e9 masi k\u00e9to ada an\u00e9 ngantungin bangk\u00e9n cicing, bangk\u00e9n
  bikul, s\u00e9ts\u00e9tan kamben uw\u00e9k, sandal pegat, muah sarwa leledan\u00e9.\\n\\nGelisan
  satua, crita jani tiing\u00e9 makadadua totonan buin majujuk. Mimih d\u00e9wa ratu,
  paclebugbug ulung bangk\u00e9 lan sarwa an\u00e9 bengu jumah Nang Bangsing, turin
  bon\u00e9 tusing sida baana ngadek tek\u00e9n Nang Bangsing baan bengun\u00e9. Nang
  Bangsing pencad tindakan\u00e9 ngalih tulungan ajaka ngisidang sakancan bangk\u00e9
  muah beberekan\u00e9 totonan. Wir\u00e9h tawanga ia liu ngelah brana, nyaman\u00e9
  tusing nyak nulungin, sak\u00e9wala yan mupahang mara lakar jagjagina baan pisagan\u00e9.
  Kanti telah kasugihan\u00e9 anggona mupahang mresihin umahn\u00e9 mara kon\u00e9
  nyidaang kedas. D\u00e9ning k\u00e9to, lantas Nang Bangsing dadi lacur, I Belog
  nyalinin dadi sugih.\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
