  ... baca selengkapnya\"", "\"Baligrafi cecek puniki daging manah titiang anggen
  titiang tugas mata kuliah aksara Bali. Karya puniki mawit saking manah titiang sane
  puyung ri kalaning ngaryanin baligrafi puniki. Ri kala titiang bengong, saget titiang
  manggihin cecek apasang sane sedeng macanda. titiang makenyem ngatonang cecek punika
  macanda. Titiang eling ring lakon pawayangan tantri sane nyritayang indik Sang Aji
  Dharma, sake kacritayang olih Bapak I Wayan Wija. Raris titiang ngrasayang pateh
  ring cerita Sang Aji Dharma. Titiang ngawit ngaryanin baligrafi cecek, sane madaging
  aran titiang.\\nEnable comment auto-refresher\"", "\"Gaguritan Candrakirana inggih
  punika silih tunggil kakawian tradisional Bali marupa tembang san\u00e9 nyritayang
  indik kapitresnan Raden Semara Nusapati saking J\u00e9nggala (Koripan) sareng Raden
  Dewi Candrakirana saking Kediri (Daha).[1] Gaguritan puniki ngangg\u00e9n pupuh
  sinom, pupuh pangkur, pupuh dangdang, pupuh durma, pupuh ginada, pupuh kumambang,
  pupuh semarandhana, pupuh mijil, pupuh ginanti, miwah pupuh dmung.[2]\\nKacrita
  Ida Sang Prabu ring Daha madu\u00e9 oka istri-istri kakalih. Okan Ida Sang Prabu
  sareng Ida Pramiswari maparab Dewi Candrakirana. Malih siki okan Ida Sang Prabu
  sareng I Liku mawasta Galuh Ajeng. Yening sandingang indik kajegegan tur kalewihan
  Galuh Ajeng joh kasoran tek\u00e9n Dewi Candrakirana. Kacritayang mangkin Dewi Candrakirana
  miwah Galuh AJeng tangkil ring Ida Sang Prabu pacang nyarengin saisin purine ngaryanin
  mareresik ring margi. Pramiswari miwah I Liku taler mangiring. Sampun prapta ring
  taman sari, w\u00e9nten kedis mabulu halus ngrawit san\u00e9 sedeng makeber. Punika
  kacingak olih Galuh Ajeng raris ng\u00e9nggalang dan\u00e9 bangun ngepungin sareng
  para parekane mangiring. Samian mabudi pacang nyemak kedise punika nanging nenten
  mrasidayang. Dewi Candrakirana san\u00e9 kajujur antuk kedis punika raris nakep
  tur makatang kedis punika. Galuh Ajeng nunas kedis san\u00e9 becik punika ring Dewi
  Candrakirana nanging nenten kaicen. Punika mawinan Galuh Ajeng manangis tur I Liku
  ged\u00e9g mangkin. Sampun rawuh ring bancingah, I Liku kari idepnane iri hati.
  Manahne mangda padidi kesayangang olih Ida Sang Prabu tur padidi nitah saisin puri.
  Irika raris Pramiswari kaekanang olih I Liku mangda sida ngemasin. I Liku ngaryanang
  racun reracikan kadi upas san\u00e9 kaadukin rujak raris kaaturin Pramiswari. Pramiswari
  ngambil rujak punika raris kaajengang. Wau duang sidu kaajeng, Pramiswari sungkan
  weteng raris seda. Dewi Candrakirana bah maguyang, di natahe mangliling manangis.
  Tangise mangetus kayun, sesambate nudut cita, nunas mangda sareng seda. Sang sampun
  lina sampun kabasmi, puputing prateka nanging Dewi Candrakirana kari sedih kalara-lara.\\nWenten
  malih kacritayang Ida Sang Prabu Koripan sampun mireng indik arinne ring Daha katinggalan
  Pramiswari. Ida taler uning punika wantah I Liku san\u00e9 ngracunin. I Patih ngaturang
  ring Ida Sang Prabu kahanan ring Daha inggih punika I Liku san\u00e9 kajenengang
  dados Pramiswari, Dewi Candrakirana san\u00e9 katinggalan biang nenten karunguang
  malih, tur wantah Galuh Ajeng san\u00e9 kasayangang mangkin. Ida Sang Prabu Koripan
  mangkin mapikayun pacang mamadik Dewi Candrakirana, pacang kajangkepang sareng okane.
  Ida Sang Prabu raris ngandikain okanne san\u00e9 maparab Raden Semara Nusapati mangda
  parek ka bancingah. Sesampune Raden Semara Nusapati prapta ring bancingah, Ida Sang
  Prabu raris ngandika ring okanne indik kahanan ring Daha. Ida Sang Prabu taler nunas
  ring okane mangda kayun kajangkepang sareng misan\u00e9 inggih punika Dewi Candrakirana
  saking Daha, sawir\u00e9h dan\u00e9 sampun nenten madu\u00e9 biang tur nenten karunguang
  olih ajinne ring Daha. Raden Semara Nusapati kayun kajangkepang sareng misanne ring
  Daha. Punika mawinan Ida Sang Prabu ngutus Patih ke Daha ngaturang tulis tur makta
  togog apasang praya kaaturang irika.\\nKacrita I Patih sampun prapta ring Daha,
  raris tangkil ring Ida Sang Prabu Daha tur ngaturang surat saking rakanne. Surat
  punika wus kapawos, Ida Sang Prabu makenyem tur cumpu pacang nyangkepang okanne
  sareng okan rakane ring Koripan. Kalingke asiki, makakalih kaambil pacang kaaturin.
  Sapunika pangandikan Ida Sang Prabu ring I Patih. Egar kenehne I Patih ningehang.
  Wusan punika Ida Sang Prabu ngranjing ka puri kairing olih I Patih. I Patih mangranjing
  ka pesanggrahan jagi kaaturin ayunan olih pengayah san\u00e9 akeh ipun petang diri.
  Ida Sang Prabu mangkin ngaturin Galuh Ajeng mangda milihin togog san\u00e9 kabakta
  olih Patih saking Koripan. Wenten togog kakalih, punika wantah kaicen olih Raden
  Semara Nusapati. Sane asiki makaput baan sutra kuning tur majahit baan kawat mas.
  Malih asiki makaput baan sutra buluk tur majahit baan benang bola. Galuh Ajeng ngambil
  san\u00e9 makaput baan sutra kuning, lega pisan kenehne polih dumunan milihin. Mangkin
  kari togog malih asiki san\u00e9 makaput sutra buluk punika rupannyane daki bengil.
  Ida Sang Prabu ngandikain I Bayan tek\u00e9ning I Sangit ngaturang togog punika
  majeng ring Dewi Candrakirana. Benjang semengan kaucapang, Patih saking Koripan
  mapamit pacang budal. Ida Sang Sang Prabu raris mapaica wastra miwah kampuh maduluran
  lengis miik. Sesampune prapta ring Koripan, I Patih raris tangkil ring Ida Sang
  Prabu tur ngaturang indik ring Daha. Ida Sang Prabu kenak mirengang raris ngandikain
  sami mangda madabdaban.\\nRing Daha mangkin kocapang, Dewi Candrakirana ngagah togoge
  san\u00e9 makaput sutra buluk. Kagiat dan\u00e9 nyingakin daging kaputane, togog
  becik pisan antuk mas dumilah tur mata winten murub. Cayane mangayang-ngayang, makalangan.
  Togog punika raris kaaras tur kacangkrimang olih Dewi Candrakirana. Galuh Ajeng
  ngintip saking lawang, kacingak togogne Dewi Candrakirana lintang lewih tur kacangkrimang
  bisa makenyung. Dadi metu kayunne iri ring Dewi Candrakirana. Galuh Ajeng gelis
  manyagjag tur nunas togog punika ring rakanne nanging nenten kaicen olih Dewi Candrakirana.
  Galuh Ajeng budal mangambres tur ged\u00e9gne tan sinipi. Patrebes yeh paningalane
  metu ngrereh I Liku. I Liku nyingakin okane nangis raris nyesed nakenin. Ida Sang
  Prabu taler w\u00e9nten irika nyingakin Galuh Ajeng mecara. Irika raris Galuh Ajeng
  nartayang indik togog mas san\u00e9 kadruwenang rakane. Cutetnyane dan\u00e9 meled
  nuenang togog punika, sampun polih nunas ring rakane nanging tan kaicen. Ida Sang
  Prabu raris ngutus I Bayan miwah I Sangit parek ring Dewi Candrakirana jagi nagihang
  togog punika. Dewi Candrakirana san\u00e9 katagihin togog punika makesyab tur nenten
  nagingin pinunas ajinne baan sayangne tek\u00e9n togog punika. Punika mawinan Ida
  Sang Prabu kayunne bendu, macebur ngrereh Dewi Candrakirana. Dewi Candrakirana nyumbah
  matur, nungkemin cokor ajinne mangda togog punika nenten kaambil. Nyingakin okane
  kedeh nenten nagingin pinunasne, Ida Sang Prabu sayan bendu. Ida raris ngambil gunting
  tur kacukur rambutne Dewi Candrakirana. Dewi Candrakirana nangis mamulisah kagundul
  olih ajinne. Wusan punika Ida Sang Prabu budal. Dewi Candrakirana raris matilar
  saking puri kairing olih I Bayan miwah I Sangit. Ida taler nunas mangda I Patih
  ngatehang lunga manyusup ka tengahing alas. Dewi Candrakirana pengangg\u00e9ne care
  lanang tur nyungklit keris ngendih murub. Sareng patpat mamargi tengah dalu nuju
  ka tengahing alas. Sampun rawuh ring alase pingit, mararyan ring sor binginne ageng
  san\u00e9 nyanding tukad. Irika raris mabresih tur kakaryanang puri olih I patih.
  Purine kadi ring swargan, mabancingah, pamremane miik, temboke magambar, tur korine
  maprada. Sampun puput sami, Dewi Candrakirana nunden I Patih matulak ka Daha.\\nDewi
  Candrakirana lintang suka ring alase. Sane mangkin dan\u00e9 mapikayun jagi mapangangge
  tur mapayas kadi anak lanang mangda silib ring alase. Irika raris Dewi Candrakirana
  ngambil tiuk miwah gunting, raris ngetep bok I Bayan miwah I Sangit mangda sakadi
  anak lanang. Dewi Candrakirana, I Bayan miwah I Sangit taler magentos adan. I Bayan
  magentos adan dados I Kuda Prewira, I Sangit magentos adan dados I Kuda Pramanca.
  Punika taler Dewi Candrakirana mangkin maparab Panji Semirang. Sareng tiga kawastanin
  Bala Klana Sakti. I Kuda Prewira miwah I Kuda Pramanca geginane nyadang pangalu
  san\u00e9 mentas ring alase tur nuduk bebandaranne. Yening pangalune nglawan, irika
  pacang kaamuk olih I Kuda Prewira miwah I Kuda Pramanca. Nanging y\u00e9ning pangalune
  manyerah, pacang kaatehang tangkil ring Panji Semirang. Nyabran dina pakaryan I
  Patih kalih menyandak anak majalan, kantos akeh madu\u00e9 panjak. I Patih kalih
  setata menang ring payudan raris pengalune san\u00e9 kalah kaaturang ring Panji
  Semirang. Pengalune punika kaicen umah miwah ajeng-ajengan. Punika mawinan samian
  suka mamanjak irika tur engsap ring dusunne dumun. Wenten pangalu saking Koripan
  sawatara satus diri, w\u00e9nten malih saking Metawun tur saking Daha.\\nWenten
  malih kacritayang Ida Sang Prabu ring Matawun, ngutus patih dan\u00e9 ke tengahing
  alas mangda ngematiang Bala Klana Sakti krana akeh panjak dan\u00e9 kacandak tur
  ngraris mamarekan irika. Sampun prapta ring tengahing alas, Patih Matawun miwah
  bala Matawune kalah mayuda nglawan Panji Semirang, I Kuda Prewira miwah I Kuda Pramanca.
  Pamuputne I Patih Matawun kabasta tur sadya mamanjak ring Panji Semirang. Irika
  raris Panji Semirang mamargi pacang mangebug nagara Matawun kairing olih Patih Matawun.
  Santukan ajerih nagarane pacang rusak, Ida Sang Prabu Matawun kayun nungkul ring
  Panji Semirang. Panji Semirang taler kaaturin putri kakalih, okan Ida Sang Prabu
  Matawun. Sane duuran maparab Dyah Puspa Jwita tur san\u00e9 alitan maparab Dyah
  Puspa Sari. Sang Putri kalih san\u00e9 nenten uning Panji Semirang maraga istri,
  salah tampi santukan nenten kajamah antuk Panji Semirang. Irika raris Panji Semirang
  ngorahang ragane kari kaiket antuk brata lewih. Sampun lami ring nagara Matawun,
  Panji Semirang mapamit mantuk kairing olih Sang Putri kalih.\\nSane mangkin kacrita
  ring nagara Koripan madabdaban pacang mabuncing ka Daha, san\u00e9 kautus inggih
  punika I Punta sareng Patih kakalih. Irika ring tengahing alas kacandak antuk I
  Kuda Prewira miwah I Kuda Pramanca raris masiat. I Punta san\u00e9 manunas urip
  kaaturang ring Panji Semirang, kewanten Patih kakalih matulak ka Koripan, tangkil
  ring Raden Semara tur nartayang kahanan ring alase. Raden Semara erang, ngambil
  kuda raris mamargi kairing olih balane sami. Prapti ring alas kapendak antuk surat
  olih Panji Semirang saantukan y\u00e9ning mayuda pastika pacang kalah. Surat punika
  kabakta olih I Punta, dagingnyane tuara lian wantah nglungsur pangampura tur manungkul
  ngaturang urip. Raden Semara pamenggahe dados punah. Panji Semirang nunas raden
  Semara mangda simpang nanging Raden Semara nenten kayun krana pacang mabuncing ke
  Daha. Dan\u00e9 mapamit sareng Panji Semirang tur ngorahang, matulak saking Daha
  pacang simpang. Wawu mamargi ngantos bancingah, kudan\u00e9 mangkel irika tuara
  nyak majalan. Punika mawinan Raden Semara durus simpang ring purine Panji Semirang.
  Irika dan\u00e9 katuran ayunan lewih tur magegonjakan ngantos tengah wengi.\\nBenjangne
  sampun semengan, Raden Semara katuran matangi olih Panji Semirang krana pacang mabuncing
  ka Daha. Raden Semara mapi nenten mireng, Panji Semirang ngranjing ka pamreman raris
  Raden Semara kadundun kakocokang. Irika raris Panji Semirang kagisiang olih Raden
  Semara tur katunas mangda sareng merem. Panji Semirang uning ragane sampun ketara,
  irika dan\u00e9 raris matur pacang ngaturang raga, kayun makaronan, nanging Raden
  Semara katunas mangda mabuncing dumun ka Daha tur matulak sajeroning makatelun.
  Panji Semirang ngaturang saputangan dadu pinaka cihna bhakti mamanjak ring Raden
  Semara. Punika taler Raden Semara ngicen bungkung ring Panji Semirang angg\u00e9n
  ciri tresnane. Makakalih sampun masubaya pacang matemu malih tigang rahina. Raden
  Semara raris mapamit pacang mabuncing ka Daha.\\nSampun prapta ring Daha raris tangkil
  ring Ida Sang Prabu Daha ring bancingah. Galuh Ajeng taler prapta manyapa tur ngaturang
  pecanangan. Nenten w\u00e9nteng Dewi Candrakirana kacingak olih Raden Semara. Irika
  dan\u00e9 uning minab Panji Semirang tuara len wantah Dewi Candrakirana san\u00e9
  dados anak lanang bagus ring alase. Raden Semara katuran ayunan tur kaayahin olih
  Galuh Ajeng. Ida Sang Prabu taler nunden Raden Semara merem ring Daha. Galuh Ajeng
  ngranjing ring pamreman Raden Semara raris ngelut tur mengaras-aras, nanging Raden
  Semara nenten nagingin kayunne Galuh Ajeng. Punika mawinan Galuh Ajeng nangis maguyang,
  ngranaang Raden Semara sumingkin ged\u00e9g tur nenten polih sirep ngantos lemah.
  Sampun lemah, Galuh Ajeng nunas Raden Semara mangda masiram ka beji sareng dan\u00e9
  nanging Raden Semara kedeh nenten kayun. Raden Semara ring pamreman uyang paling
  sawir\u00e9h Panji Semirang tan sah ring ati.\\nTan carita sampun petang dina, subayane
  sampun liwat. Panji Semirang sungsut tan sipi saantukan Raden Semara nenten rauh.
  Dan\u00e9 raris mapikayun mapamit pacang manyusup ring alas sareng para putri miwah
  patih dan\u00e9 makakalih. Irika malih magentos parab mangda silib dados I Gambuh
  Darma Swara. Sareng lelima makawon saking puri, mamargi tur tan pegat-pegat sedih
  ring alase. Kacrita Raden Semara mangkin eling ring janjine sampun lintang. Dan\u00e9
  mapikayun budal, raris matulak saking Daha nanging pamargine silib. Rawuh ring alas
  Semirang dan\u00e9 mangojog ka bancingah miwah ring puri, dapetanga sampun suwung
  irika. Raden Semara mapikayun ngrereh Panji Semirang, para patih dan\u00e9 kautus
  matulak ka Koripan. Pamuputne Raden Semara miwah Panji Semirang prasida matemu ring
  nagara Gagelang tur budal ka nagara Koripan.\\n- Dewi Candrakirana (Panji Semirang)\\n-
  Raden Semara Nusapati\\n- Galuh Ajeng\\n- Ida Sang Prabu Daha\\n- Pramiswari Daha\\n-
  I Liku\\n- Ida Sang Prabu Koripan\\n- Patih Koripan\\n- Patih Daha\\n- I Bayan (I
  Kuda Prewira)\\n- I Sangit (I Kuda Pramanca)\\n- Ida Sang Prabu Matawun\\n- Patih
  Matawun\\n- Dyah Puspa Jwita\\n- Dyah Puspa Sari\\n- I Punta\"", "\"Wali Kota Bengkulu
