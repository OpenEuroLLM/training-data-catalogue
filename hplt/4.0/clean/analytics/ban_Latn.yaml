  Bali : Men Sugih teken Men Tiwas\\nAda katururan satua Men Sugih teken Men Tiwas.
  Men Sugih anak sugih pesan, nanging demit tur iri ati, jail teken anak lacur.\\nMen
  Tiwas buka adane tiwas pesan, nanging melah solahne, tusing taen jail teken timpal.
  Men Tiwas geginane ngalih saang ke alase lakar adepa ka peken.\\nNuju dina anu,
  Men Tiwas ka umah Men Sugih ngidih api. Ditu Men Sugih ngomong, \\\"Ih cai Tiwas,
  alihin ja icang kutu, yen suba telah kutun icange, nyanan upahina baas\\\".\\n\\nLaut
  Men Tiwas ngalihin kutu Men Sugihe. Suba tengai mara suud. Men Tiwas upahina baas
  acrongcong, ngenggalang lantas baasne abana mulih laut jakana.\\n\\nMen Sugih jumahne
  buin masiksikan, maan kutu aukud. Ngenggalang ia ka umah Men Tiwase, laut ngomong,
  \\\"Ih cai Tiwas, ene icang maan kutu aukud, jani mai uliang baas icange ituni\\\".
  Masaut Men Tiwas, \\\"Yeh, baase ituni suba jakan tiang\\\".\\n\\nMasaut Men Sugih,
  \\\"Nah, ento suba aba mai anggon pasilih!\\\". Nasine ane makire lebeng ento laut
  juanga konyang ka pancine abana mulih baan Men Sugih. Nyanane buin teka Men Sugih,
  \\\"Ih Tiwas, tuni Nyai ngidih api teken saang icange\\\". Lantas api teken saange
  apesel gede juanga baan Men Sugih. Men Tiwas bengong mapangenan baan lacurne buka
  keto.\\n\\nBuin manine Men Tiwas tundena nebuk padi baan Men Sugih lakar upahina
  baas duang crongcong. Men Tiwas nyak nebuk kanti pragat, upahina baas duang crongcong,
  laut encol mulih lantas nyakan. Men Sugih lantas nyeksek baas, maan latah dadua.\\n\\nEncol
  ia ka umah Men Tiwas laut ngomong, \\\"Ih Tiwas ene baase enu misi latah dadua,
  jani uliang baas icange, yen suba majakan ento suba aba mai\\\".\\n\\nSedek dina
  anu Men Tiwas luas ka alase, krasak-krosok ngalih saang. Saget teka Sang Kidang
  laut ngomong, \\\"Men Tiwas apa lakar alih ditu?\\\" masaut Men Tiwas, \\\"Tiang
  ngalih saang teken paku\\\".\\n\\\"Lakar anggon gena ngalih paku?\\\"\\nMasaut Men
  Tiwas, \\\"Lakar anggon tiang jukut\\\".\\n\\\"Ih Tiwas lamun nyak Nyai nyeluk jit
  icange, ditu ada pabaang nira teken Nyai!\\\"\\n\\nLantas Men Tiwas nyak nyeluk
  jit kidange, mara kedenga, limane bek misi mas teken selaka. Suud keto Sang Kidang
  ilang, Men Tiwas kendel pesan lantas mulih. Teked jumah ia luas ke pande ngae gelang,
  bungkung teken kalung.\\n\\nMen Tiwas jani sugih nadak, pianakne makejang nganggo
  bungah, lantas ia pesu mablanja. Tepukina Men Tiwas teken Men Sugih. Delak-delik
  ia ngiwasin pianak Men Tiwase.\\n\\nBuin manine Men Sugih mlali ka umah Men Tiwase
  matakon, \\\"Ih Tiwas, dija Nyai maan mas selaka liu?\\\". Masaut Men Tiwas, \\\"Kene
  embok, ibi tiang luas ka alase ngalih saang teken paku lakar jukut, saget ada kidang,
  nunden tiang nyeluk jitne. Lantas seluk tiang, mara kedeng tiang limane ditu maan
  emas teken selaka liu.\\\" Mare ningih keto. Men Sugih ngencolang mulih.\\n\\nManine
  Men Sugih ngemalunin luas ke alase, Men Sugih nyaru-nyaru buka anak tiwas, krasak-krosok
  ngalih saang teken paku.\\n\\nSaget teka Sang Kidang, \\\"Nyen ento krasak-krosok?\\\".\\nMasaut
  Men Sugih, \\\"Tiang Men Tiwas, uli puan tiang tuara nyakan\\\".\\nMen Sugih kendel
  pesan kenehne.\\nLantas masaut Sang Kidang, \\\"Ih Tiwas, mai seluk jit nirane!\\\".\\n\\nMara
  keto lantas seluka jit kidange, laut kijem jit kidange, Men Sugih paide abana ka
  dui-duine. Men Sugih ngeling aduh-aduh katulung-tulung,\\\"Nunas ica tulung tiang,
  tiang kapok!\\\".\\n\\nTeked di pangkunge mara Men Sugih lebanga, awakne telah babak
  belur tur pingsan. Disubane inget ia magaang mulih. Teked jumahne lantas ia gelem
  makelo-kelo laut ngemasin mati.\\n\\n\\nsumber : www.cakrawayu.org\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
