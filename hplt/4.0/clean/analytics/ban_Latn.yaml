  Bali : Cupak Grantang\\n\\n\\nilustrasi cupak grantang\\n\\nAda katuturang satua,
  I Cupak teken I Grantang. Menyama ajaka dadua. I Cupak ane kelihan, I Grantang ane
  cerikan. Goba lan parilaksanan kaka adi punika doh pesan matiosan. I Cupak gobane
  bocok, kumis jempe, kales, brenges, lan bok barak keke alah duk. Basang gede madaar
  kereng pesan. Nanging joh bina ajaka adine I Grantang. I Grantang pengadegne lanjar,
  goba alep bagus, asing-asing anake ngantenang makejang ngedotang. Kemikane manis
  tur anteng magarapan. Kacarita sedek dina anu, i Cupak ajak I Grantang matekap di
  carike, I Grantang matekap nututin sampi, nanging i Cupak satate maplalianan dogen
  gaene. Tusing pesan I Cupak ngrunguang adine magae. Disubane I Grantang suud matekap
  mara I Cupak teka uli maplalianan. Yadiastun keto bikas beline masih luung penampene
  I Grantang. I Grantang ngomong munyine alus tur nyunyur manis. \u201cKemu beli malunan
  mulih tiang lakar manjus abedik. \u201cI cupak masaut gangsar,\u201dLamun keto kola
  lakar malunan mulih, adi. I Cupak laut majalan mulih. Disubane joh liwat uli sig
  I Grantange manjus, ditu lantas I Cupak makipu di endute kanti awakne uyak endut.
  Disubane keto, I Cupak nutugang majalan ngamulihan saha jlempah jlempoh. Kacarita
  ane jani i Cupak suba neked diwangan umahe, ditu laut I Cupak gelur-gelur ngeling.
  Meme bapane tengkejut ningehin eling panakne tur nyagjag laut nakonin,\u201dCening-cening
  bagus Wayan Cupak anake buka cening ngudiang cening padidi mulih buine blolotan,
  men adin ceninge I Made Grantang dija?\u201d Disubane keto petakon reramane, laut
  masaut i Cupak sambilange ngeling. \u201cKene ento bapa lan meme Kola anak uli semengan
  metekap dicarike I Grantang anak meplalianan melali dogen uli semengan, buine ia
  ento ngenemin anak luh-luh dogen gaene\u201d. Mara monto pesadune I Cupak bapane
  suba brangti teken I Grantang. Suud keto laut bapane ngrumrum I Cupak. \u201cNah,
  mendep dewa mendep, buin ajahan lamun teka I Grantang lakar tigtig bapa, lakar tundung
  bapa uli jumah. \u201cLega pesan kenehne I Cupak ningeh bapane pedih teken I Grantang.
  Apang tusing ketara dayane jele, I Cupak pesu ngaba siap lakar mabongbong. Ane jani
  kacaritayang I Grantang suba ngamulihang uli carik genah ipun magarapan. I Grantang
  majalan jlempah jlempoh kabatek baan kenyelne kaliwat. Tan kacaritayang malih kawentenang
  ipun ring margi, kancit sampun neked jumahne. Duk punika sahasa bapane teka nyag
  jag nyambak tur nigtig. Bapane ngomong bangras. Makaad cai makaad Grantang, nirguna
  bapa ngelah panak buka cai. Goba melah, solah jele, tur tuara demen nyemak gae,
  men nyak adung goba ajaka bikase? Dija cai maan ajah-ajahan keto? \u201d I Grantang
  ngeling sigsigan merasa teken dewek kena pisuna. Ngomong laut I Grantang, sakewala
  raosne pegat-pegat duaning sambilange ngeling. \u201cNah, Bapa yan suba keto keneh
  bapane, nundung anake buka tiang\u2026.uli jumah, tiang nerima pesan tresnan bapane
  ento. Dumadak-dumadik sepatilar tiang uli jumah bagia idup bapa miwah belin tiange
  I Cupak. Amonto I Grantang ngomong teken bapane laut majalan makaad uli jumah. Lampah
  laku pajalane I Grantang tur jlempah-jlempoh pejalane kabatek baan naanang basang
  seduk. Sakit saja kenehne I Grantang ningeh munyin bapane abuka keto. Disubane joh
  I Grantang liwat, teka lantas I Cupak turnakonang adine I Grantang. \u201cMeme\u2026Bapa\u2026adin
  kolane dija? \u201d Mesaut laut bapane, \u201cAdin I Dewane suba tigtig bapa tur
  suba tundung bapa uli jumah. Jani apang tawange rasan mayusne ento.\u201d Mara keto
  pasaut bapane I Cupak ngeling gelur-gelur tur mamunyi : \u201cNgudiang ketang bapa
  adin kolane. Dadi tundung bapa adin kolane, dija jani alih kola adin kolane \u2026anak
  kola \u2026anak \u2026 anak kola ane mayus magae, ngudiang adin kolane tundung bapa?\u201d
  Ningeh munyin I Cupake keto dadi engsek memen bapane, merasa teken dewek pelih.
  \u201cJani kola lakar ngalih adin kolane, lakar abang kola takilan!\u201d Masepan-sepan
  memene ngaenang I Cupak takilan. Kacarita jani I Cupak ninggal umah ngalain memen
  bapane lakar ngruruh I Grantang. Gelur gelur I Cupak ngaukin adine Adi\u2026.adi\u2026.adi..Grantang
  \u2026 ene kola teka ngaba takilan ..Adi!\u201d Cutetin satua, bakat bane ngetut
  adine, tepukina ditengah alase. Ditu lantas I Cupak ngidih pelih teken adine. Adi
  jalan mulih adi, ampurayang Beli adi, jalan adi mulih!\u201d I Grantang mesaut alot,
  \u201ckema suba Beli mulih padidi, depang tiang dini naenang sakit ati, diastun
  tampin tiang mati.Apa puaran tiange idup tusing demenin rerama. \u201cDisubane buka
  keto pasaut adine laut nyawis nimbal natakin panes tis, suka duka ajak dadua. Jalan
  mareren malu adi, kola kenyel pesan nugtug adi uli jumah. Ene kola ngaba takilan,
  jalan gagah ajak dadua. \u201cI Cupak lantas nunden adine ngalih yeh, \u201cKema
  adi ngalih yeh, kola nongosin takilane dini. \u201cNyrucut I Grantang ngalih yeh.
  Disubane I Grantang liwat joh, pesu dayane I Cupak lakar nelahang isin takilane.
  Sepan-sepan I Cupak ngagah takilane tur daara telahanga. Sesubane telah, kulit takilane
  besbesa tur kacakanga di tanahe. Nepukin unduke ento lantas I Cupak dundune teken
  I Grantang. I Cupak mani-mani kapupungan. \u201cAduh adi apa mesbes takilane ne?
  Bes makelo Adi ngalih yeh kanti takilane bakat kalain pules. Nah ne enu lad-ladne
  jalan gagah ajak dadua.\u201dDisubane ada raosne I Cupak buka keto laut masaut I
  Grantang, \u201cNah daar suba beh, tiang tusing merasa seduk\u201d I Cupak medaar
  padidiana, ngesop nasi nginem yeh, celekutang nitig tangkah, suud madaar I Cupak
  taagtaag nyiriang basang betek. Disubane I Cupak ajaka I Grantang maan mareren laut
  ngalanturang pejalane. Kacarita ane jani I Cupak lan I Grantang neked di Bencingah
  Puri Kediri. Di desane ento suung manginung, tusing ada anak majlawatang. Pejalane
  I Cupak ngetor kabatek baan jejehne, jani suba neked kone ia di jaba puri Kedirine,
  ditu I Cupak nepukin peken. Di pekene masih suung manginung tuah ada dagang nasi
  adiri buina mengkeb madagang. Ngatonang unduke buka keto, ditu laut I Grantang metakon
  teken dagange ento, \u201cNawegang jero dagang nasi, titiang matur pitaken, napi
  wastan jagate puniki, napi sane mawinan jagat druwene sepi. I Dagang nasi masaut,
  Jero, jero anak lanang sareng kalih jagate puniki mawasta jagat Kediri. Jagat puniki
  katiben bencana. Putran Ida Sang Prabu kapandung olih I Benaru. Ida Sang Prabu ngamedalang
  wecana, sapasiraja sane mrasidayang ngrebut putran gelahe tur mademang I Benaru
  jagi kaadegang agung ring jagate puniki. Wantah putrin Ida sane kaparabiang ring
  sang sane prasida mademang I Benaru. I Cupak masaut elah, \u201cah raja belog kalahang
  Benaru. Kola anak suba bisa nampah Benaru. Eh dagang, kema orahang teken rajabe
  dini. Bantes Benaru aukud elah baan kola ngitungang\u201d. I Grantang megat munyin
  beline, \u201cEda Beli baas sumbar ngomong, awak tusing nawang matan Benaru. Patilesang
  raga beline digumin anak. \u201cSakewala I Cupak bengkung ngelawan tur tuara ngugu
  munyin adine. \u201cAdi baas setata, adi mula getap. Kalingke nampak ngadeg gumi,
  baanga ngidih nasi dogen beli nyak ngematiang I Benaru. \u201cI Grantang nglanturang
  munyine teken jero dagang nasi. \u201cInggih jero dagang nasi durusang uningan marika
  ring Ida Sang Prabu. Titiang jagi ngaturang ayah, ngemademang ipun I Benaru. \u201cDuaning
  asapunika wenten pabesene I Grantang, laut I dagang nasi gagesonan nangkil ka puri.
  Nganteg ring puri I Dagang nasi matur, \u201cInggih Ratu Sang Prabhu sasuhunan titiang,
  puniki wenten tamiu sareng kalih misadia jagi ngemademang I Benaru. Riwawu asapunika
  atur I Dagang nasi, premangkin ledang pisan pikayun Ida Sang Prabhu. Raris Ida Sang
  Prabhu ngandika, \u201d Ih memen cening, yen mula saja buka atur men ceninge, lautang
  kema tunden ia tangkil ka puri apang tawang gelah!\u201d Sesampune wenten renteh
  wacanan Ida Sang Prabhu,\u2019I Dagang nasi jek ngenggalang ngalih I Cupak teken
  I Grantang. Nganteg di peken dapetange I Cupak masehin lima mara suud madaar. I
  Grantang kimud kenehne nepukin beline setata ngaba basang layah. I Grantang laut
  ngomong. \u201cNawegang jero dagang belin tiange iwang ngambil ajengan, mangda ledang
  jero ngampurayang santukan titiang nenten makta jinah. \u201cI Cupak masaut, \u201cSaja
  kola nyemak nasi, ampura kola, tusing sida baan kola naanang basang layah. \u201cI
  Dagang nasi anggen kenehne ningeh munyine I Grantang. Munyin I Cupake tan kalinguang.
  I dagang nasi laut nekedang pangandikan Ida Sang Prabhu, apang tangkil ajaka dadua.
  Sesampune katerima pabesene punika olih I Dagang nasi. Teked di puri hut panjake
  pati kaplug melaib, kadene I Benaru. Kacrita sane mangkin I Cupak lan I Grantang
  sampun tangkil ring ajeng Ida Sang Prabhu raris Ida Sang Prabhu ngandika, \u201cEh
  cai ajak dadua cai uli dija, nyen adan caine?\u201d I Grantang matur dabdab alon,\u201dNawegang
  titiang Ratu Sang Prabhu, titiang puniki wantah jadma nista saking jagat Gobangwesi.
  Munggwing wastan titiang wantah I Grantang, niki belin titiange mewasta I Cupak.
  Titiang jagi matetegar nyarengin sewayambarane puniki ngamademang ipun satrun palungguh
  I Ratu I Benaru. Konden suud aturne I Grantang saget sampun kasampuak olih I Cupak,
  tur ngomong kene, \u201cKola seduk, kola lakar ngidih nasi abetekan. Basang kolane
  layah. Suud keto I Cupak ajak I Grantang mapamit. Ida Sang Prabhu mapaica cincin
  mas masoca mirah teken pajenengan puri Kediri. Ento pinaka cirin I Grantang dados
  utusan. Gelisang carita I Cupak kebedak-bedak, lantas nepukin telaga linggah tur
  bek misi yeh. Ditu lantas I Cupak morahang teken adine. \u201cAdi\u2026adi Grantang
  mareren malu, kola kenyel tur bedak pesan, kola lakar ngalih yeh ditu di telagane.
  \u201cKasautin laut pamunyin Beline teken I Grantang, \u201cEda beli ditu ngalih
  yeh, ento anak yeh encehne I Benaru tusing dadi inem, beli, \u201cNingeh munyin
  adine keto I Cupak makesiab ngatabtab muane putih lemlem. I Grantang nutugang majalan.
  I Cupak buin nepukin gegumuk maririgan. Ditu buin I Cupak matakon teken adine, \u201cNyen
  ane ngae gunung gunungan dini adi?\u201d sambilange maklemir I Grantang nyaurin
  petakon beline. \u201cEne tusing ja gunung-gunungan beli, ene mula tuah taine I
  Benaru beli. I Cupak makraik baan takutne. \u201cAduh mati jani beli adi, yan mone
  geden taine, lamun apa ja gedene I Benaru, adi?. Jalan suba mulih adi. I Grantang
  nguncangang majalan ngungsi Guane I Benaru. I Cupak bejag bejug nutug I Grantang.
  Kacaritayang sane mangkin I Cupak ajaka I Grantang suba teked di sisin goane I Benaru.
  Umah I Benaru ditengah goane. I Cupak laut ngomong \u201d Adi \u2026. kola tusing
  bani tuun adi, adi dogen suba masiat ngelawan I Benaru. Kola ngantiang dini. Kewala
  ngidih olas kola teken adi, tegul kola dini adi! \u201d Bincuh I Grantang ngalih
  tali anggona negul I Cupak. Disubane suud I Grantang negul beline, I Grantang laut
  matinget teken beline, \u201cEne tingalin tumbake buin ajahan beli, yan bah kangin
  tumbake ento pinaka cirin tiange menang di pasiatan. Sakewala yan bah kelod tumbake,
  ento pinaka cihna tiang kalah. \u201cSuud matinget, teken beline, I Grantang laut
  tuun ka goane. Teked di tengah goane dapetange I Benaru nagih melagandang Raden
  Dewi. I Benaru matolihang tur matbat I Grantang. \u201d \u201cEh iba manusa cenik,
  wanen iba teka mai, Yan iba mabudi idup matulak iba mulih ! \u201d Disubane keto
  ada munyine I Benaru, laut I Grantang masaut wiring, \u201cApa..apa..orahang iba
  Benaru? Kai teka mai mula nyadia lakar ngalahan iba, tur kai lakar mendak Raden
  Dewi putran Ida Sang Prabhu. Kai lakar ngiring Ida ka Puri. \u201d I Benaru lantas
  ngelur brangti laut ngamuk. Ditu I Grantang mayuda ngajak I Benaru. Sangkaning kepradnyanan
  I Grantang mayuda, dadosne I Grantang polih galah nebek basangne I Benaru nganti
  betel antuk keris pajenengan purine. I Benaru ngelur kesakitan basangne embud mebrarakan.
  Kacrita ane jani, I Cupak baduuran ningeh I Benaru ngelur. I Cupak pesu enceh, tur
  tategulane telah tastas. Ditu lantas I Cupak inget teken patingetne I Grantang.
  Ningalin lantas tumbake ento suba bah kangin. Mara I Cupak masrieng kenehne liang.
  I Cupak laut ngomong, \u201d Adi\u2026adi Grantang antos kola Adi. Yan kola tusing
  maan metanding ngajak I Benaru jengah kola, Adi. \u201d I Grantang laut ngomong
  uli tengah goane teken I Cupak. \u201cBeli tegarang entungan tali bune ka goane!
  \u201cDisubane ada raos adine buka keto laut I Cupak ngentungan taline ento. Ditu
  lantas I Grantang ngelanting ditaline apan ngidang menek. I Grantang sambilange
  ngamban Raden Dewi. Disubane I Grantang lan Raden Dewi nengok uli ungas goane, gegeson
  pesan I Cupak nyaup Raden Dewi tur sahasa megat tali ane glantingine baan I Grantang.
  Duaning tali bune kapegatang, ditu lantas I Grantang ulung ngeluluk ditengah goane.
  Semaliha Ida Raden Dewi kasirepang olih I Cupak di batan kayune satonden megat tali
  bune ento. Kacaritayang sane mangkin, I Cupak ngiring Ida Raden Dewi nuju Puri Agung.
  Tan kacaritayang kawentenang Ida kairing baan I Cupak ring margi, kancit sampun
  rauh Ida ring Puri. Ida Sang Prabhu ledang kayune tan siti, digelis raris nyaup
  Raden Dewi. Ida Sang Prabhu raris matemuang Ida Raden Dewi teken I Cupak sawireh
  I Benaru suba mati. I Cupak matur ring Ida Sang Prabhu, I Grantang sampun padem,
  kapademang oleh I Benaru. I Cupak mangkin kaadegang Agung ring Puri. Kacaritayang
  sane mangkin I Cupak sampun madeg Agung ring Puri. Makejang panjake keweh, duaning
  sasukat risapa madeg I Cupak sadina-dina panjaka makarya guling. Sane mangkin iring
  menengang abosbos cerita sapamadeg I Cupak, iring sane mangkin caritayang kawentenang
  I Grantang ring tengah goane. I Grantang grapa-grepe bangun nyelsel padewekan. \u201cRaturatu
  Bhatara nguda kene lacur titiange manumadi?\u201d Kasuen-suen dados metu rincikan
  naya upanaya I Grantang bakal nganggon tulang I Benarune menek. I Grantang ngragas
  tur makekeh pesan menek. Sakewanten sangkanin sih Ida SangHyang Parama Kawi I Grantang
  nyidayang ngamenekang. I Grantang jadi suba neked di baduuran. I Grantang lantas
  nugtugang pejalane nuju je puri. Gelisang carita I Grantang suba neked di puri.
  Ditu lantas I Grantang ngomong teken panyeroan I Cupake, \u201cJero tulung titiang,
  titiang jagi tangkil matur ring Ida Sang Prabhu. \u201cMalaib panyroane ka puri
  nguningayang unduke punika teken Raden Cupak. I Cupak inget teken adine ane enu
  digoane. Ditu lantas I Cupak ngelur nunden panjake ngejuk tur ngulung aji tikeh
  tur ngentungang ka pasihe. Kacarita buin manine Pan Bekung memencar di pasihe ento.
  Uling semengan nganti linsir sanje memencar tusing maan be naang aukud. Ngentungan
  pencar tanggun duri, pencare marase baat, mare penekanga bakatange tikeh. Buin Pan
  Bekung mulang pencar buin bakatange tikehe ane busan. Gedeg basang Pan Bekunge,
  laut tikehe abane menek tur kagagah. Makesiab Pan Bekung ningalin jadma berag pesan.
  Pan Bekung enggalang ngajak anake ento kepondokne. Teked dipondokne pretenina teken
  Men Bekung. Sewai-wai gaenange bubuh, uligange boreh. Dadosne sayan wai sayan misi
  awakne I Grantang. Dadi kendel Pan Bekung ajak Men Bekung iaan unduk panak truna
  tur bangus. Di subane I Grantang seger ditu lantas I Grantang ngae tetaneman. Megenepan
  pesan bungane tanema. Disubane bungane pada kembang, I Grantang ngalap bungane ento
  tur adepa teken Men Bekung ka peken. Sadinadina saja geginane I Grantang metik bunga
  lan Men Bekung ngadep. Kacarita ane jani ada wong jero uli puri Kediri lakar meli
  bunga. Makejang bungane Men Bekung belina baan wong jerone ento. Disubane suud mablanja
  lantas wong jerone ento ka puri ngaturang bunga. Bungane ane kaaturang katerima
  olih Ida Raden Dewi. Mara kearasan oleh Raden Dewi dadi merawat rawat anak bagus
  dibungane. Eling lantas Ida teken I Grantang anak bagus ane ngamatiang I Benaru.
  Ida Raden Dewi raris metaken teken wong jerone. \u201cEh Bibi bibi Sari dija nyai
  meli bungane ene?\u201dbuin mani ka pasar apang kacunduk teken dagang bungane ene.\u201d
  Manine kairing Ida Raden Dewi lunga, matumbasan ka pasar.Gelisang carita raris kapanggih
  Men Bekung nyuun kranjang misi bunga mewarna warni. Raden Dewi raris nampekin. Kagiat
  Raden Dewi nyingak bungkung mas masoca mirah ane anggone teken Men Bekung. Bungkunge
  ento wantah druwen Ida Sang Prabhu lingsir, ane kapicayang teken I Grantang. Ngaksi
  kawentenane punika, raris Raden Dewi ngandika teken Men Bekung. \u201cUduh Meme,
  titiang matakon, dija umah memene?\u2019 Ajak gelah melali kema ka umah Memene apang
  gelah nawang. \u201d Gelisang carita Ida Raden Dewi sampun neked di pondok Men Bekung.
  Pan Bekung kemeg-megan sinambi ngadap kasor saha nyambang sapangrauh Ida Raden Dewi.
  Ningeh Bapane makalukang tur epot laut I Grantang nyagjag. Ditu lantas I Grantang
  matemu teken Raden Dewi. Rikanjekan pinika Ida Raden Dewi nyagjag tur mlekur I Grantang
  sinambi nangis masasambatan, \u201cAduh Beli mgudal las beli ngutiang tiang. Ngudiang
  beli tusing ka puri tangkil ring Ida Sang Prabhu.\u201d Sasampune wenten ketel wacanan
  Ida Raden Dewi raris I Grantang nyawis tur matur dabdab alon, ngaturan parindikan
  pajalan sane sampun lintang. Kacaritanyang mangkin I Grantang sareng Ida Raden Dewi
  suba neked di puri. Sang Prabhu maweweh meweh ledang kayun Idane nyingak putrane
  anut masanding ajaka I Grantang. Kacaritayang mangkin I Cupak katundung uli puri.
  I Grantang mangkin kaadegang agung ring puri. Sasukat I Grantang madeg agung, jagate
  gemuh kerta raharja. Panjake sami pada girang pakedek pakenyung duaning suud ngayahin
  raja buduh.\\n\\nsumber : bebekbengil.wordpress.com/\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
