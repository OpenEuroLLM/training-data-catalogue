  Bali : I Belog\\nAda katuturan satua anak belog. Baan belogne ia adanina I Belog.
  Sedek dina ia tondena meli bebek ka peken teken memene. Ditu lantas ia nyemakin
  memene pis. Lantas memene buin ngomong, kema jani cai engal-enggal ka peken, terus
  meli be dadua di tongos dagang bebeke.\\n\\nDisubane I Belog neked di peken, kema-mai
  ia ninggalin dagang bebek sakewala ia ngenjuhang pipis dasa tali rupiah. Jero niki
  jinah, tiang meli bebek dadua. Bebeke aukud aji Rp. 4000. Lantas dagang bebeke ngemaang
  I Belog susuk bui Rp. 2000. Disubane maan meli bebek lantas I Belog mulih.\\n\\nKacrita
  ia ngemulihang, tur ngaliwatin tukad linggah. Ditu lantas bebeke ngeleb. Maka dadua
  bebeke ngelangi di tukade. I Belog bengong ninggalin bebeke kambang tur ia ngrengkeng
  kene. Beh, bebek puyung bakat beli. Awake nagih bebek mokoh tur baat, sakewala bebek
  puyung baanga. I Dewek belog-beloga. Lantas bebeke tusing ejuka tur kalahina mulih.\\n\\nDisubana
  I Belog neked jumahne, ajinanga baan memene tuara ngaba bebek. Memene ngomong, ih
  belog encen bebeke? Masaut I Belog, \u201cmaan ja icang meli bebek, nanging puyung
  icang adepina teken dagang bebeke. Lantas bebeke leb di tukade, tur ngelangi. Buina
  laut ulah icang sawireh meli bebek puyung tuara ada gunane.\\n\\nDitu lantas I Belog
  welanga baan memene. Keto upah anake belog, tuara ngresep teken munyi. Bebeke mula
  kambang yan ia lebang di tukake dalem.\\n\\n\\nsumber : ngiringmabasabali.wordpress.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com2Tembuku,
  Bangli, Bali, Indonesia-8.4058201999999991 115.3904215-8.4058201999999991 115.3904215
  -8.4058201999999991 115.3904215tag:blogger.com,1999:blog-2131724523036064124.post-52871559920351727342013-08-29T19:40:00.000-07:002013-08-29T19:40:18.161-07:00Satua
  Bali : I Tuma Teken I Titih\\nKacarita ada tuma, nongos di lepitan tilam anake agung.
  Ditu ia kapepekan amah, maan ngisep rah anake agung, kanti mokoh. Nanging I Titih
  nongos di selagan dingding anake agung. Dening ia ngiwasin I Tuma mokoh, lantas
  ia kema ngalih I Tuma. Satekede ditu, I Titih matedoh ngomong, \u201cInggih jero
  gede, angob pisan titiang, ngantenang jerone wibuh. Sinah jerone kapepekan ajeng-ajengan.
  Nanging titiang setata kakirangan amah, kantos titiang berag sapuniki. Yan wantah
  jerone ledang, titiang sareng iriki. Mangda titiang dados sisian jerone. Titiang
  pacang ngiring sapituduh jerone.\u201d\\n\\nMasaut I Tuma, \u201cIh Titih, lamun
  suba pituwi saja buka omong caine, bapa nyak ngajak cai dini. Kewala ene ingetang
  pitutur bapane. Eda pesan cai ngulurin lobhan keneh caine. Anake ane lobha, tusing
  buungan lakar nepukin sengkala. Lenan teken ento, tusing pesan dadi iri hati, kerana
  doyan liu ngelah musuh. Apang cai bisa malajahang kadharman.\u201d Keto pamunyinne
  I Tuma teken I Titih.\\n\\nJani suba ia makakasihan. I Titih lega pesan kenehne
  dadi sisian I Tuma. Sedek dina anu, ida anake agung merem-mereman. Saget I Titih
  lakar ngutgut. Ngomong I Tuma, \u201dIh Tittih,eda malu ngutgut ida anake agung.
  Kerana ida tonden sirep.\u201d Nanging I Titih bengkung, tusing dadi orahin, lantas
  ia sahasa ngutgut ida anake agung. Ida anake agung tengkejut lantas matangi.\\n\\nDitu
  ida ngandikang parekanne ngeliin I Titih. Parekanne lantas ngeliin. Mara kebitanga
  di batan tilame, tepukina I Titih lua muani, lantas matianga. Buin alih-alihina,
  tepukina I Tuma di lepitan kasure. Ditu lantas matianga. Pamragat mati I Tuma ajaka
  I Titih. Keto katuturan anake ane lobha, tusing bisa ngeret indria, tan urungan
  lakar nepukin sengkala.\\n\\nsumber : ngiringmabasabali.wordpress.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
