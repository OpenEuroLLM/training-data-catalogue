  Bali : Anak Ririh\\nPan Karsa ajaka pianakn\u00e9 muani nanggap upah nga\u00e9 s\u00e9m\u00e9r
  di sisin rurung\u00e9 ged\u00e9. Uli semeng makasanja ia ajaka dadua tusing mar\u00e9r\u00e9n
  maga\u00e9, sajawaning dinuju madaarn\u00e9. Kenehn\u00e9 apang gega\u00e9n\u00e9
  enggal pragat, tur lantas nampi upahn\u00e9. Telung dina ia maga\u00e9 tan par\u00e9r\u00e9nan,
  s\u00e9m\u00e9r\u00e9 suba dalem, ngantiang pragat. Kendeln\u00e9 tara bakat ban
  nuturang. Buin awai maga\u00e9, pedas ia bakal nampi upah liu. Tan critanan manin\u00e9
  semeng s\u00e9m\u00e9r\u00e9 lakar katampiang tek\u00e9n ane mupahang. Petengn\u00e9
  sag\u00e9t ujan bales pesan madulurang angin. Apeteng Pan Karsa tusing bisa pules
  ngenehang gega\u00e9n\u00e9. Takut s\u00e9m\u00e9r\u00e9 bek kaurugin tanah. Manin\u00e9
  nu ruput ia ajaka pianakn\u00e9 nelokin s\u00e9m\u00e9r\u00e9, sambilang ngaba tambah.
  Saja lantas s\u00e9m\u00e9r\u00e9 bek aji tanah. Pianakn\u00e9 sedih mapangenan.
  Pan Karsa masih mapangenan. Makelo ia bengong, mangenang kalacuran d\u00e9w\u00e9kn\u00e9.
  Nangingk\u00e9 ia ngalih daya, apanga gega\u00e9n\u00e9 aluhan. Lantas ia ngomong
  tek\u00e9n pianakn\u00e9. \u201cih cening, de cai keweh, buin akejep dong ilang
  tanah\u00e9 an\u00e9 ngurugin s\u00e9m\u00e9r\u00e9 n\u00e9.\u201dDitu lantas Pan
  Karsa ngantungan baju muah capiln\u00e9 ditongos\u00e9 ngantungan buka an\u00e9
  suba-suba. Pianakn\u00e9 masih nuutang tingkah bapan\u00e9. Buine tambah\u00e9 an\u00e9
  besikan bantangn\u00e9 tancebanga ka tanah\u00e9 an\u00e9 ngurugin s\u00e9m\u00e9r\u00e9,
  muah an\u00e9 l\u00e9nan pejaga di sisin s\u00e9m\u00e9r\u00e9, suud keto lantas
  kalahina mengkeb.\\n\\n\\nKacrita anak\u00e9 san\u00e9 mentas ditu pada ngon, ningalin
  baju muah capil magantung paek s\u00e9m\u00e9r\u00e9, tur an\u00e9 ngelahang tuara
  ada. Apa buin mara ajinanga ada tambah ditu. Alihina tusing ada, kauk-kaukina tara
  ada masaut. Sayan makelo sayan liu anak\u00e9 pada kema tur pada ngenehang, anak\u00e9
  an\u00e9 nga\u00e9 s\u00e9m\u00e9r\u00e9 kaurugan baan tanah ditu. Lantas sahasa
  nyemak tambah, pada numbegin s\u00e9m\u00e9r\u00e9 ento. Tanahn\u00e9 kagediang.
  Baan liu anak\u00e9 maga\u00e9, buina tanah nu gebuh, dadiannya tuara makelo s\u00e9m\u00e9r\u00e9
  ento suba kedas buka ibin\u00e9. Ditu Pan Karta Malaib-laib tur ngomong, \u201cinggih
  jeron\u00e9 sareng sami, tiang nunas pisan ring pitulung jeron\u00e9 sane paicaang
  ring tiang.\u201d\\n\\nsumber : satuabaliku.blogspot.com\\nOkayanahttp://www.blogger.com/profile/17981745179115183953noreply@blogger.com0Tembuku,
