  (Sepuluh milyar rupiah)\\nBisa nego langsung pemilik\\nStatus : SHM\\nRegards\\nMade
  L. Wijaya\\nHP. 0812 949 9049\\nHP. 0813 1102 2449\\nInformasi Lengkap silakan Klik
  :\\nRabu, 24 Agustus 2016\\nIda Sang Bhatara Kala sedek Ida sungsut kebekang ring
  kayun, eling ring raga lacur, wireh medal ring kalaning rahina Saniscara Kliwon
  Wuku Wayang,minab nenten wangde Ida pacang katadah olih Bhatara Kala, reh wenten
  panugrahan Bhatara Ciwa pecak, \\\"Yan ada anak embas utawi lekad di Ukun Wayange,
  wenang Bhatara Kala nadah. \\\"Irika raris Sang Bharata kaparisudha olih ajin Ida,
  Bhagawan Bhrgu. Sangkaning kaparisuda punika Ida mapesengan Sang Sudha. Yadiastun
  sampun kaparisuda, taler nenten nyidayang Ida Bhatara Nilakantha, tan urungan Ida
  katadah olih Ida Bhatara Kala.\\nKamis, 17 Desember 2015\\nRing galahe sane becik
  puniki, titiang Rare Angon Nak Bali Belog, jagi ngewehin akidik parindikan Paribasa
  Basa Bali, melarapan antuk gambar JPEG, mangdane prasida ke sharing ring semetone
  sami.\\nMinggu, 29 Januari 2012\\nDitu di alase bet ngeriung, ketuturan ada Gajah
  ane meawak gede, tegeh, kulitne tebel kakah, tur kereng ipun tanpa ingen. Sedak
  dina anu, I Gajah ento ngamuk. Sekancan taru ane ada ditu karubuh baan I Gajah.
  I Kedis, I Bojog, Kidang, tur ane lenan tusing ngelah tongos mesayuban. Taluh tur
  sebun I Kedis makejang ulung. I Kedis Siung kaliwat sebetne sawireh taluhne ane
  makere lekad ulung tur pianakne mati. Tan kodag baan jengah basangne nepukin solahne
  I Gajah. Keto masih buron ane lenan.\\nYan mepalu arep, sinah suba iraga kaon, wireh
  ia buron kaliwat gede tur kereng\\\" . Mesaut lantas I Kedis Blibis kene,\\\" Cang
  ngelah daya buka kene, kenken baan apang I Gajah buta tusing nepukin apa, di subane
  keto mara lantas dedehang ia apang ulung\\\". Nah di subane keto, I Kedis Siung
  midep teken ia I Blibis tur mepaitungan ditu ajak ia I Goak, I Kedis Corek, teken
  I Kedis Gadangan. Di subane ingkup paitunganne ditu lantas pengeka dayane ento kelaksanayang.\\nIa
  tusing nyidayang ngamah tur nepukin yeh lakar inem. Di subane suba, I kedis Siung
  buin ngorahin nyamane ia I Kedis Gadangan apang memunyi di duwur pangkunge. Sinah
  suba ia I Gajah ngaden di tongos I Kedis Gadangan mamunyi ada yeh. Ningeh munyin
  I Kedis Gadangan, I Gajah kedropon melaib kema ngalih yeh baan keliwat bedakne.
  Nanging lacur, I Gajah tusing nawang teken ada pangkung dalem. I Gajah lantas ulung
  meglebug ke pangkunge dalem tur ngemasang mati.\\nSabtu, 12 Februari 2011\\nNegeri
  Nisadha, salah satu wilayah makmur di tanah Bharata. Negeri ini dibangun oleh leluhur
  Nala. Namun, karena keserakahan penguasanya, negeri ini terpuruk. Konon, sekian
  deret waktu berlalu, sampailah negeri Nisadha diperintah oleh seorang Raja bernama
  Hiranyadanu. Ia mempunyai putra bernama Ekalaya. Seperti pemuda kebanyakan, kesehariannya
  berpenampilan sederhana. Kendati berkulit sedikit gelap, ia sosok lelaki remaja
  tampan dengan wajah bersih, dagu lembut dan tubuh yang tegap.\\nEkalaya memiliki
  otak cerdas. Berbagai ilmu dipelajarinya. Sehingga tak ayal, dahinya bersinar. Suatu
  hari, ia berpamitan pada orang tuanya.\\n\u201cRama, aku akan berguru ke Negeri
  Hastina. Konon, disanalah turun kitab-kitab sastra termasyur. Sejak Parasara menorehkan
  tinta emas pengetahuan abadi, negeri itu bermandi cahaya\u2026.\u201d\\n\u201cBaiklah,
  ananda. Demi ilmu, bila perlu pergilah engkau ke batas langit. Namun ingatlah, setelah
  engkau kembali nanti, bangunlah negeri Nisadha ini menjadi wilayah yang makmur dan
  sejahtera.\u201d\\n\u201cBaiklah, Rama\u2026.\u201d\\nEkalaya berjalan sendirian.
  Ribuan hektar daratan datar dilintasinya, turun jurang dan pendakian gunung pun
  bukan hal yang istimewa lagi. Sekian waktu berlalu, sampailah ia di Hastina. Menurut
  cerita penduduk, Hastina mempunyai ratusan pangeran. Mereka semuanya cerdas dan
  pandai berkat didikan Rsi Drona. Terutama Arjuna, dialah diantara pangeran-pangeran
  Hastina yang paling hebat. Hampir seluruh kemampuan gurunya dikuasainya. Ekalaya
  hanya bisa mengangguk terkagum-kagum pada Guru Drona. Dan kemudian membayangkan,
  andaikata saja, ia diterima sebagai murid Drona.\\nObsesi menjadi salah satu murid
  Drona menyiksa bathin Ekalaya. Akhirnya, diputuskannya untuk menemui Rsi Drona dan
  memohon padanya agar sudi diterima menjadi salah satu siswa.\\nSaat itu, Drona lagi
  melepas lelah, seharian mengajar di istana. Di sela waktu istirahat, ia menyempatkan
  diri melantunkan syair kitab suci. Sekonyong-konyong, seseorang bertubuh tegap muncul
  dihadapannya.\\n\u201cMaafkan hamba, Tuan. Begitu lancangnya hamba menghadap padamu
  hanya karena keinginan yang membuncah di dada hamba\u2026.\u201d\\nRsi Drona menatap
  tajam, pemuda tampan penuh santun yang bersila di depannya. Sembari merapikan kitab
  suci, ia menyambut si pemuda.\\nMata hatinya menjawab, bahwa sosok yang datang kali
  ini sangat membutuhkan uluran tangannya.\\n\u201cAnak muda, bangunlah. Ada keperluan
  apa menemui aku?\u201d\\nEkalaya memperkenalkan diri. Lalu menjawab,\u201daku ingin
  diangkat menjadi muridmu\u2026.\u201d\\nRsi Drona terpaku. Ia sangat terpesona oleh
  penampilan Ekalaya. Kalau saja ia tak bersumpah tidak mengangkat murid selain ksatria
  Hastina. Barangkali saja Ekalaya bisa menjadi andalannya untuk mengimbangi kemampuan
  Arjuna. Menurut kata hatinya, potensi tersembunyi yang dimiliki Ekalaya luar biasa.
  Auranya menyedot, menyita perhatiannya. Seperti, tatkala ia berjumpa Arjuna tempo
  hari.\\nPutranya, Aswatama yang diharapkan mampu ternyata masih di bawah kemampuan
  Arjuna. Ia sangat labil dalam emosi, sehingga akan mempengaruhi intelektual dan
  spiritualnya menuju tatanan stabil. Namun, Ekalaya tidak. Ia cukup sempurna. Hal
  itu terlihat jelas dari sorot matanya, kalau saja ia yang membimbing, sudah pasti
  Ekalaya menjadi ksatria pilih tanding, melebihi murid kesayangannya, Arjuna.\\n\u201cMaafkan
  hamba, Tuan. Kalau sangat berat memutuskan hari ini, esok hari, atau kapanpun hamba
  siap menunggu jawaban Tuan\u2026.\u201d\\nDrona tersentak. Lamunannya buyar.\\n\u201cBu\u2026.bukan
  begitu, anak muda. Aku tak bisa menerima dirimu sebagai murid\u2026\u201d\\n\u201cAlasan
  Tuanku?\u201d\\n\u201cKamu dari Nisadha. Bukan ksatria Hastina. Aku hanya bertugas
  melatih ksatria Hastina\u2026.dan itu bagian dari sumpahku!\u201d kata Drona lembut.\\n\u201cBaiklah,
  kendati Tuan tidak mau menerimaku, perkenankan aku memanggilmu guru\u2026.\u201d\\nDrona
  bengong. \u201cBetapa kuat tekad pemuda itu?\u201d pikirnya membatin.\\nEkalaya
  kecewa, ia pun pergi. Pikirannya kalut. Ia berusaha memaafkan Drona, karena telah
  bersumpah tidak mengambil murid selain ksatria Hastina. Kakinya melangkah menuju
  hutan. Pada sebuah bukit cadas, ia berhenti. Ia melihat seonggok batu yang terkikis
  angin, sehingga menyerupai bentuk tubuh seseorang.\\nPikirannya bekerja. \u201cAndaikan
  aku bentuk batu ini menyerupai patung Drona, alangkah indah jadinya. And, ku bawa
  padanya sebagai kenang-kenangan dariku, mungkin saja ia luluh dan menerimaku menjadi
  muridnya\u2026..\u201d\\nEkalaya pun mencabut belatinya, perlahan dengan kehati-hatian
  tangannya menoreh garis, membentuk batu cadas menjadi patung. Setiap hari pekerjaannya
  hanya itu, membuat arcanam Drona. Sampai sekian bulan, barulah patung itu jadi.
  Patung yang sangat mengagumkan. Persis seperti aslinya. Baru saja ia hendak membawa
  patung itu ke rumah Drona. Terlintas kembali pernyataan Drona, bahwa ia tak akan
  mengangkat murid selain ksatria Hastina. Ekalaya ragu. Akhirnya, ia urungkan niat
  membawa patung Drona.\\n\u201cBaiknya, aku stanakan arcanam guru di tempat aku berlatih
  ilmu.\u201d\\nMulai saat itulah, Ekalaya berguru pada batu. Ia sering bercakap dengan
  arcanam gurunya. Seolah dibimbing oleh sang guru.\\n***\\nSuatu hari, para pangeran
  Kurawa dan Pandawa lagi berburu. Ia membangun kemah dipinggiran hutan. Saat mentari
  membara di ubun-ubun, mereka istirahat. Anjing-anjing pemburunya dilepas liar, dengan
  harapan salah satu dari mereka mencium kumpulan rusa hutan bersembunyi.\\nSalah
  seekor menerobos, cukup jauh dari areal perkemahan. Dan, kebetulan saja berada tidak
  jauh dari pondok Ekalaya. Saat itu, Ekalaya keluar pondok hendak berlatih. Rupanya
  bayangan Ekalaya mengejutkan anjing pemburu tadi. Anjing itu menggonggong sejadi-jadinya.
  Percuma Ekalaya memberi isyarat agar tidak menggonggong. Konsentrasi Ekalaya buyar.
  Sedikit jengkel, diraihnya beberapa anak panah. Dan beberapa detik kemudian.\\nPlasss\u2026\u2026!
  Anak-anak panah itu meluncur ke arah anjing yang menyalak santer. Luar biasa panah
  itu tidak membunuh. Namun menutup mulut anjing yang menganga. Panah yang tersusun
  rapi dimulut anjing membuatnya tak berkutik, lalu berlari ketakutan menuju perkemahan
  tuannya.\\nSemua siswa Drona terkejut melihat kenyataan itu. Mereka tak menduga
  ada seseorang yang mampu menandingi kemampuan Drona dalam membidikkan anah panah.
  Begitu pula Arjuna, mulutnya menganga takjub.\\n\u201cGuru, siapa gerangan yang
  mampu menandingi kehebatanmu ?\u201d tanya Arjuna.\\nDrona yang melamun, tersentak.
  Jangan-jangan Bhargawa turun gunung. Selain dirinya, hanya Bhargawa yang mampu memanah
  sehebat itu.\\n\u201cArjuna, ayo kita cari si pemilik panah, pasti tidah jauh dari
  sini\u2026.aku curiga hanya Bhargawa yang mampu melakukannya\u2026.\u201d\\nArjuna
  dan Drona mencari si pemilik panah. Setelah setengah hari mencari, barulah mereka
  bertemu. Betapa terkejut Drona, ternyata yang dijumpainya hanyalah pemuda berkulit
  gelap dan begitu asing baginya, ia lupa pernah bersua dengannya tempo hari.\\n\u201cWahai
  anak muda, engkau sangat hebat. Aku kagum akan kemampuanmu\u2026\u201d\\n\u201cTerima
  kasih\u2026.\u201d Sahut Ekalaya tenang.\\n\u201cBisakah engkau menunjukkan kepadaku,
  kemampuanmu yang lain ?\u201d\\nWajah Ekalaya berbinar. Inilah ujian sesungguhnya,
  sudah lama ia berguru pada arcanam Drona. Sekarang, ya sekaranglah Dewata mengutus
  guru yang berwujud manusia datang memberi ujian.\\n\u201cBaiklah, Guru\u2026..\u201d
  Kata Ekalaya.\\nMendengar sebutan guru pada Drona. Arjuna cemberut. Kentara sekali
  perasaannya iri akan kemampuan Ekalaya. Dalam hatinya, ia berkata, gurunya telah
  berbohong. Janjinya akan memberi ilmu utama padanya hanyalah sekedar janji, bukan
  sesungguhnya. Buktinya, ada muridnya yang lain.\\nDi pihak Drona, justru dengan
  panggilan guru membuatnya terperanjat. Ingatannya yang melamur tadi, perlahan terang.
  Ya, pemuda dihadapannya tidak lain pemuda yang pernah mendatanginya tempo hari.\\n\u201cBenar,
  ia ksatria Nisadha yang bernama Ekalaya\u2026\u201d kayanya membatin.\\nEkalaya
  mematung, ia meditasi.\\nLalu mengeluarkan panah Brahmastra dan merentang busur.
  Panah meluncur mengeluarkan desing. Kecepatannya luar biasa, lalu berubah menjadi
  seekor naga yang siap memagut lawan. Pada saat panah menemui sasaran, bumipun berguncang.
  Pohon bertumbahangan. Rumput terbakan. Hangus. Sebelum sempat menghancurkan lebih
  lanjut, Ekalaya memanggil panah yang masuk kembali ke kelongsongnya.\\nDrona bertepuk
  tangan. Kagum. Arjuna cemberut, lalu menghujat gurunya.\\n\u201cSekarang, tampaknya
  engkau memberikan janjimu pada orang lain\u2026\u201d pekiknya.\\nDrona tertampar
  malu. Lantas menoleh ke Ekalaya.\\n\u201cRasanya, aku tak pernah mengajarimu. Dari
  mana kamu berguru ?\u201d\\nEkalaya tersenyum, lalu membuka penutup arcanam gurunya.\\n\u201cAkh\u2026.?!\u201d
  Mereka terpekik kaget memandangi wajah patung yang persis wajah Rsi Drona.\\nDibalik
  rasa kagum, ia berusaha menutupi gejolak perasaannya. Drona memutar otak. Andaikata,
  Ekalaya dibiarkan terus melakukan hasratnya. Sudah tentu, Ekalaya yang akan menjadi
  pemanah hebat bukan Arjuna.\\n\u201cHal ini tak boleh terjadi ! Tidak boleh terjadi
  ! \u201c tegas hatinya.\\n\u201cEkalaya, kamu keliru. Sangat keliru ! Aku tak pernah
  menganggapmu menjadi murid. Ini namanya mencuri, ya mencuri ilmu. Inilah yang mendasari
  aku tak mau mengangkatmu menjadi murid. Ingatlah, sejarah bangsamu. Kekalahan Prabu
  Nala melawan sepupunya di meja judi ? Sehingga istananya dipertaruhkan ? Tabiat
  judi, tidak jauh dari mencuri.\\nHukumannya sangat berat\u2026.\u201d\\n\u201cMaafkan
  aku guru\u2026.\u201d\\n\u201cKamu bisa menjadi muridku, hanya dengan satu syarat\u2026.\u201d\\n\u201cSyarat
  apapun akan kuterima, asal aku sah menjadi muridmu.\u201d\\n\u201cKarena mencuri,
  aku minta ibu jari tangan kananmu\u2026.\u201d\\n\u201cAkh\u2026! \u201c Ekalaya
  terkejut.\\nNamun ia tersenyum, lalu mencabut belati dan memotong ibu jarinya sendiri
  dengan tangannya sendiri. Drona menerima ibu jari yang berlumuran darah dengan harapan
  Ekalaya tak mampu melanjutkan ilmu panah saktinya.\\nMereka pun pergi meninggalkan
  Ekalaya. Sembari mengelus dada, Ekalaya menarik nafas panjang. \u201cEngkaulah penyebab
  semua ini. Egoisme yang engkau miliki merugikan orang lain. Aku tak akan memaafkanmu.
  Memang leluhurku, penjudi. Namun beliau telah bertobat. Aku tak terima, perbuatan
  leluhurku dibawa-bawa. Ingatlah, pada waktunya nanti seluruh keluargamu akan mendapat
  bencana seperti apa yang pernah terjadi pada keluargaku\u2026.wahai, Arjuna !! \u201c
  teriak Ekalaya.\\nTiba-tiba petir menyambar di siang bolong. Kutukan Ekalaya diterima
  Dewata. Benar, pada saat pertarungan dadu. Pandawa dikalahkan Kurawa. Parahnya,
  selain istana, permaisurinya Drupadi pun dipertaruhkan.\\nRabu, 29 Desember 2010\\nKacrita
  ada katuturan satua anak cerik madan I Rar\u00e9 Angon. Kadanin I Rar\u00e9 Angon,
  wireh satekan\u00e9 uli masekolah, ia setata geginan\u00e9 ngangonang ubuh-ubuhan
  minakadinnyan\u00e9 sampi, kebo, jaran, miwah kambing sadina-dina uling cerik. Apang
  tusing med nongosin ubuh-ubuhan an\u00e9 itep ngamah di pagpagan\u00e9, I Rar\u00e9
  Angon ngisinin waktu luang sambilanga ngambar di tanah\u00e9, y\u00e9n napkala ia
  engsap ngaba buku gambar.\\nSabilang teka uli masekolah, I Rar\u00e9 Angon tusing
  engsap tek\u00e9n geginan\u00e9 an\u00e9 pedumanga tek\u00e9n reraman\u00e9. Keto
  masi ia tusing engsap tek\u00e9n swadarman\u00e9 dadi murid, malajah sadina-dina.
  Tas sekolahan\u00e9 an\u00e9 misi buku nutugin ia ngangon. Kenyel mamaca buku, anggona
  nylimurang kiap, I Rar\u00e9 Angon nglaut ngambar. Cacep pesan kon\u00e9 ia ngambar
  wayang, pemandangan, 3d impression (red) muah an\u00e9 l\u00e9nan kanti ngon timpal-timpaln\u00e9
  sekaa ngangon\u00e9.\\nKatuju dina anu, sambilanga nongosin sampi ngambung, I Rar\u00e9
  Angon iseng-iseng kon\u00e9 ngambar anak luh di tanah\u00e9. Mara suud ia ngambar,
  tlektekanga gambar\u00e9 ento, \u201cMimih d\u00e9wa ratu adi ken\u00e9 jeg\u00e9g
  gambar anak luh t\u00e9n\u00e9nan? Nah, eda suba usapa pedalem i d\u00e9w\u00e9k
  ngusap.\u201d K\u00e9to kon\u00e9 kenehn\u00e9 I Rar\u00e9 Angon. Gambar\u00e9 totonan
  adanina kon\u00e9 baan I Rar\u00e9 Angon I Lubang Kuri.\\nMara k\u00e9to pangangken
  cerik-cerik\u00e9, ditu lantas ida ngandika tek\u00e9n I Rar\u00e9 Angon, \u201cRar\u00e9
  Angon, saja cening nga\u00e9 gambar\u00e9 en\u00e9?\u201d. Kacawis lantas baan I
  Rar\u00e9 Angon, \u201cInggih yakti titiang.\u201d Malih matak\u00e9n Ida Anak\u00e9
  Agung, \u201cDija cening ta\u00e9n nepukin anak luh buka k\u00e9n\u00e9, orahang
  tek\u00e9n gelah!\u201d \u201cTitiang matur sisip Ratu Anak Agung, tan w\u00e9nten
  pisan titiang nahen manggihin jadma marupa asapunika.\u201d \u201cMen, dadi cening
  bisa nga\u00e9 gambar I Lubang Kuri?\u201d\\nMatur malih I Rar\u00e9 Angon sada
  takut, \u201cPunika sangkaning titiang ngawag-ngawagin, Ratu Anak\u00e9 Agung.\u201d
  Mara k\u00e9to pangakun\u00e9 I Rar\u00e9 Angon, Ida Anak\u00e9 Agung tusing kon\u00e9
  ngega aturn\u00e9 I Rar\u00e9 Angon, tur ida mabaos, \u201cAh, gelah sing ngugu,
  kema alihang gelah I Lubang Kuri, yan cening tuara nyidayang, mati palan cening\u00e9!\u201d
  K\u00e9to Ida Anak\u00e9 Agung ngancam I Rar\u00e9 Angon.\\nMara k\u00e9to pangandikan
  Anak\u00e9 Agung, ibuk lantas kenehn\u00e9 I Rar\u00e9 Angon saha ngeling sigsigan
  nglaut ia mulih, sampin\u00e9 kutanga di pangangonan. Teked jumahn\u00e9, takonina
  kon\u00e9 ia tek\u00e9n m\u00e9m\u00e9nn\u00e9, \u201cKenapa ja cening dadi ngeling?\u201d
  Tuturanga lantas undukn\u00e9 kapandikayang ngalih I Lubang Kuri tek\u00e9n Ida
  Anak\u00e9 Agung. Mara k\u00e9to pasautn\u00e9 I Rar\u00e9 Angon, m\u00e9m\u00e9nn\u00e9
  bareng sedih minehin unduk pianaknyan\u00e9.\\nKacrita, jani petengn\u00e9 mara
  I Rar\u00e9 Angon sirep, lantas ia ngipi, ngipiang katedunin olih Ida Betara. Di
  pangipian, Ida Betara kon\u00e9 ngandika tek\u00e9n d\u00e9w\u00e9knyan\u00e9 I
  Rar\u00e9 Angon k\u00e9n\u00e9: \u201cCening Rar\u00e9 Angon, eda cening sedih,
  en\u00e9 rurung\u00e9 ngaja kanginang tuut, sinah tepuk cening I Lubang Kuri!\u201d
  Tuah amonto pangandikan Ida Betara tek\u00e9n I Rar\u00e9 Angon \u00e9nggalan ipun
  enten.\\nMani semengann\u00e9, tuturanga lantas ipiann\u00e9 tek\u00e9n m\u00e9m\u00e9nn\u00e9,
  tur nglaut ia morahan lakar luas ngetut buri pangandikan Ida Betara buka isin ipiann\u00e9.
  R\u00e9pot m\u00e9m\u00e9nn\u00e9 nga\u00e9nang bekel. Di suban\u00e9 pragat, lantas
  I Rar\u00e9 Angon majalan. Pajalann\u00e9 ngaja kanginang, nganti joh pesan kon\u00e9
  ia majalan. Pajalann\u00e9 tuun gunung men\u00e9k jurang, megat-megat pangkung,
  gr\u00e9mb\u00e9ngan, ngliwatin margi agung, sag\u00e9t nepukin lantas ia padukuhan.\\nDi
  padukuhan, kacritayang I Rar\u00e9 Angon lantas singgah sik jeron dan\u00e9 Jero
  Dukuh. Jero Dukuh nyapa, \u201cSapasira Jero Alit, dados mariki paragayan?\u201d
  Masaut I Rar\u00e9 Angon, \u201cInggih titiang I Rar\u00e9 Angon, mawinan titiang
  mariki, titiang ngutang d\u00e9w\u00e9k, san\u00e9 mangkin titiang nunas ica ring
  jeron\u00e9 genah madunungan!\u201d\\n\u201cNah, dini cening nongos, apang ada ajaka
  adin cening\u00e9, pianak Bapan\u00e9 dini makeengan!\u201d Jero Dukuh ngelah kon\u00e9
  oka istri bajang adiri. Kacrita suba makelo I Rar\u00e9 Angon madunungan sik jeron
  Dan\u00e9 Dukuh\u00e9, ditu lantas atepanga kon\u00e9 ia ngajak okan dan\u00e9n\u00e9.
  Sedek dina anu, morahan kon\u00e9 I Rar\u00e9 Angon tek\u00e9n Jero Dukuh. \u201cTiang
  matur ring Jero Dukuh, mawinan tiang rauh mariki ngutang-ngutang d\u00e9w\u00e9k,
  tiang kapandikayang antuk Ida Anak\u00e9 Agung ngrereh anak luh san\u00e9 madan
  I Lubang Kuri. Kedeh pisan pakayunanidan\u00e9, yan tiang tuara nyidayang ngrereh
  tur ngaturang ring ida tiang pacang kapademang antuk Ida.\u201d Mara k\u00e9to pasadok
  I Rar\u00e9 Angon, ditu lantas dan\u00e9 Jero Dukuh masaur, \u201cEda cening k\u00e9weh,
  Bapa matujuin cening tongos I Lubang Kurin\u00e9, ditu di muncuk gunung\u00e9 kaja
  kangin. Ditu suba tongosn\u00e9 cening, nanging sengka pesan pajalan\u00e9 kema,
  krana I Lubang Kuri kagebag baan soroh buron\u00e9 an\u00e9 galak-galak, mapangka-pangka
  tongos gebagan\u00e9.\u201d\\nSesubann\u00e9 I Rar\u00e9 Angon kapicain tongos ngalih
  anak istri an\u00e9 madan I Lubang Kuri, nglaut kon\u00e9 ia kapicain soroh buron
  an\u00e9 ngebag I Lubang Kuri tek\u00e9n dan\u00e9 Jero Dukuh.\\nBaos Jero Dukuh:
  \u201cAn\u00e9 tanggu bet\u00e9n macan pager\u00e9ng, an\u00e9 baduuran soroh lelipi
  n\u00e9 ged\u00e9-ged\u00e9, an\u00e9 tanggu duur raksasa dadua luh muani, ento
  pangalang-alang anak\u00e9 kema ngalih I Lubang Kuri\u201d, k\u00e9to Jero Dukuh
  nerangang tek\u00e9n I Rar\u00e9 Angon.\\nBuin dan\u00e9 Jero Dukuh ngimbuhin, \u201cYadiapin
  k\u00e9to, en\u00e9 Bapa maang Cening manik sesirep, apang prasida Cening nganteg
  ka puncak. Pad\u00e9 di malipetan\u00e9 Cening lantas katangehang, p\u00e9t ubera
  Cening tek\u00e9n raksasan\u00e9, en\u00e9 buin Bapa maang manik pangalang-alang;
  manik tiing, manik blabar, manik api, anggon ngentungin i raksasa. Yan ento tuara
  nyidayang, en\u00e9 manik atman\u00e9 entungin, pedas i raksasa mati. Nah, kema
  Cening majalan, eda Cening sumanangsaya!\u201d\\nMara k\u00e9to baos dan\u00e9 Jero
  Dukuh, nglaut majalan kon\u00e9 I Rar\u00e9 Angon ngaba manik liu pesan. Suba neked
  di bongkol gunung\u00e9, tepukina kon\u00e9 macan pager\u00e9ng, entungina lantas
  manik sesirep. Ditu pules lantas macan\u00e9 makejang. Buina mara ia majalan ngamen\u00e9kang,
  nepukin kon\u00e9 ia lelipi ged\u00e9-ged\u00e9, buin kon\u00e9 entungina sesirep.
  Pules kon\u00e9 lelipin\u00e9 makejang. Mara I Rar\u00e9 Angon ngamen\u00e9kang,
  siduur, tepukina raksasa dadua luh muani nglicak tusing bisa ngoyong. Ditu buin
  entungina baan manik sesirep, pules maka dadua raksasan\u00e9 ento.\\nSuba pada
  pules gebagan\u00e9 makejang, prasida lantas I Rar\u00e9 Angon katemu tek\u00e9n
  I Lubang Kuri. Ngon I Rar\u00e9 Angon tek\u00e9n warnan I Lubang Kurin\u00e9, sajaan
  patuh buka goban gegambaran\u00e9 an\u00e9 gambara di pangangonan. Suba makelo kamemegan,
  I Rar\u00e9 Angon lantas nuturang unduk d\u00e9w\u00e9kn\u00e9 nganti teked di tongos
  I Lubang Kurin\u00e9, sing ja ada l\u00e9n krana ia kautus olih Anak\u00e9 Agung.
  Ajakina lantas I Lubang Kuri ka negara, bakal katur tek\u00e9n Ida Anak\u00e9 Agung.
  Mara k\u00e9to pangidih I Rar\u00e9 Angon, I Lubang Kuri satinut.\\nGelisin crita,
  majalan lantas ajaka dadua nganuunang. Mara sajaan neked basa tengahang gunung\u00e9,
  bangun kon\u00e9 raksasan\u00e9 maka dadua, pagelur nutug I Rar\u00e9 Angon. I Rar\u00e9
  Angon ng\u00e9ncolang majalan, sak\u00e9wala i raksasa \u00e9nggal pesan nutug pajalann\u00e9
  I Rar\u00e9 Angon. Suba paek i raksasa, I Rar\u00e9 Angon lantas ngentungin raksasan\u00e9
  ento manik tiing. Dadi prajani ada tiing ategal melat pajalan i raksasan\u00e9.
  Tiinga tusing dusa baan i raksasa, tuuka kanti lulus bah bed\u00e9g punyan tiinga
  kajekjek. Ditu buin kon\u00e9 entungina manik blabar baan I Rar\u00e9 Angon raksasan\u00e9
  ento. Dadi prajani ada blabar endut, masi tuuka dog\u00e9n tek\u00e9n i raksasa.
  Buin lantas entungina manik api, dadi api makobar-kobaran melat pajalan i raksasan\u00e9.
  Ento masi tusing nyidaang ngalangin pajalan i raksasa ngepung I Rar\u00e9 Angon.\\nJani
  kacrita suba paek pesan kon\u00e9 i raksasa ada di durin I Rar\u00e9 Angon\u00e9,
  kadi rasa ia suba maekin mati kauluh tek\u00e9n i raksasa totonan. Inget kon\u00e9
  ia tek\u00e9n d\u00e9w\u00e9kn\u00e9 enu ngelah manik buin abesik, manik atman\u00e9
  ento lantas entungina i raksasa, mati lantas i raksasa makadadua.\\nGelisang satua,
  I Rar\u00e9 Angon ajaka I Lubang Kuri jani suba neked di jeron Jero Dukuh. Katuturan
  kon\u00e9 pajalan\u00e9 ajaka dadua suba peteng mara neked ditu. Katuju dan\u00e9
  Jero Dukuh sedeng matutur-tuturan ajaka okann\u00e9. \u201cOm, Swastyastu, jero
  Dukuh\u201d, k\u00e9to abetn\u00e9 I Rar\u00e9 Angon. \u201cOm Swastyastu, y\u00e9
  i cening Rar\u00e9 Angon suba teka, k\u00e9nk\u00e9n rahayu pajalan\u00e9 Ning?\u201d,
  k\u00e9to dan\u00e9 Jero Dukuh nyawis sapetekan I Rar\u00e9 Angon.\\nSuba kon\u00e9
  onyang negak, suba pada maan ngidih t\u00e9h anget maimbuh s\u00e9la malablab, ditu
  dan\u00e9 Jero Dukuh mabaos tek\u00e9n I Rar\u00e9 Angon, \u201cNah, Cening Rar\u00e9
  Angon, buin mani semengan kema suba Cening mulih aturang I Lubang Kuri tek\u00e9n
  Ida Anak\u00e9 Agung. En\u00e9, adin Cening\u00e9 I Luh, titipang Bapa tek\u00e9n
  Cening, ajak ia bareng mulih kumah Cening\u00e9, bareng ajahin sapratingkah anak\u00e9
  makrama di negara!\u201d I Rar\u00e9 Angon sairing baos dan\u00e9 Jero Dukuh, tumuli
  ngaturang suksma ring Jero Dukuh.\\nKacrita mani semengann\u00e9 di subann\u00e9
  I Rar\u00e9 Angon, okan Jero Dukuh\u00e9, muah I Lubang Kuri mapamit, lantas ajaka
  onya makalah uli padukuhan, tumuli makejang nyakupang tangan tek\u00e9n dan\u00e9
  Jero Dukuh. Jero Dukuh mabaos, \u201cMajalan Cening, dumadak mangguh karahayuan
  di jalan-jalan, selamet Cening teked ka negari!\u201d Pajalann\u00e9 ngamulihang
  men\u00e9k jurang tuun pangkung. Tusing marasa kenyel, mara nyaluk peteng, saget
  suba teked I Rar\u00e9 Angon jumahn\u00e9. Kendel pesan kon\u00e9 m\u00e9m\u00e9nn\u00e9.
  \u201cDuh, rauh Cening pianak M\u00e9m\u00e9, pitahen M\u00e9m\u00e9 Cening lakar
  tuara sida malipetan\u201d. R\u00e9pot m\u00e9m\u00e9nn\u00e9 ngebatang tikeh muah
  nga\u00e9nang y\u00e9h anget anggona nyeduhang t\u00e9h tamiunn\u00e9.\\nDi subann\u00e9
  pada mategtegan, ditu lantas I Rar\u00e9 Angon nyatua, nuturang pajalann\u00e9 luas
  ngalih I Lubang Kuri, tur maan kurenan okan Jero Dukuh Sakti. Ditu buin maweweh-weweh
  liang keneh m\u00e9m\u00e9nn\u00e9 I Rar\u00e9 Angon saha tan mari ngaturang suksma
  ring Ida Hyang Widhi. Buin maninn\u00e9 pasemengan gati kon\u00e9 I Rar\u00e9 Angon
  ka puri ngaturang I Lubang Kuri. Angob maduluran brangti kayun Ida Anak\u00e9 Agung
  tek\u00e9n I Rar\u00e9 Angon, wir\u00e9h nyidayang ngalih I Lubang Kuri.\\nSesubann\u00e9
  I Rar\u00e9 Angon nyidayang ngaturang I Lubang Kuri ka purian, makayun-kayun Ida
  Anak\u00e9 Agung. \u201cYan tusing jlema sakti, tuara nyidayang apa ngalih I Lubang
  Kuri. Y\u00e9n jleman\u00e9 en\u00e9 baang idup, pedas kagungan i d\u00e9w\u00e9k\u00e9
  lakar juanga, sinah rered kawibawan d\u00e9w\u00e9k\u00e9. Nah, jani lakar rincikang
  daya apanga prasida bakat kapatiann\u00e9 I Rar\u00e9 Angon\u201d, k\u00e9to kon\u00e9
  pikayun Ida Anak\u00e9 Agung ring pikayunan.\\nDitu lantas Anak\u00e9 Agung nganikain
  I Rar\u00e9 Angon apanga ngrerehang ida macan, \u201cCai Rar\u00e9 Angon kema Cai
  buin luas, alihang anak\u00e9 buka gelah macan, dot pesan gelah apang nawang macan.
  Nah, kema Cai \u00e9nggal-\u00e9nggal majalan!\u201d\\nMara k\u00e9to pangandikan
  Ida Anak\u00e9 Agung, ngembeng kon\u00e9 y\u00e9h paningalan\u00e9 I Rar\u00e9 Angon,
  wir\u00e9h suba ngrasa tek\u00e9n d\u00e9w\u00e9k kaupayain baan Anak\u00e9 Agung.
  Mapamit lantas ia budal.\\nGelisang satua \u00e9nggal, suba neked jumah, matakon
  lantas kurenann\u00e9 tek\u00e9n I Rar\u00e9 Angon, \u201cBeli, k\u00e9nk\u00e9n
  ja dadi masebeng sedih, anak k\u00e9nk\u00e9n di puri? Apa beli dukaina tek\u00e9n
  Anak\u00e9 Agung? Nah t\u00e9 orahang kapining tiang, ny\u00e9n nawang tiang prasida
  matetimbang kapining baat keneh belin\u00e9?\\nMasaut I Rar\u00e9 Angon, \u201cK\u00e9n\u00e9
  adi, sinah suba baan beli Anak\u00e9 Agung pedih pesan tek\u00e9n beli. Suba beli
  nyidayang ngalih I Lubang Kuri, jani buin beli kapangandikayang ngalih macan.\u201d\\nMasaut
  kurenann\u00e9, \u201cYan bantas ak\u00e9to, eda beli sanget ng\u00e9wehang, n\u00e9
  tiang ngelah manik astagina, paican dan\u00e9 i bapa. Jani tiang ngadakang macan.
  \u201cManik astagina, apang ada macan!\u201d, prajani kon\u00e9 ada macan ged\u00e9
  gati. Nah, kema suba beli ka puri tegakin macan\u00e9 en\u00e9, aturang tek\u00e9n
  Ida Anak\u00e9 Agung!\u201d Tegakina lantas macan\u00e9 ento ka puri. Teked di puri,
  sedek Anak\u00e9 Agung katangkilin olih panjakidan\u00e9. Ditu makejang anak\u00e9
  an\u00e9 tangkil serab malaib, jejeh pati kaplug palaibn\u00e9. Ida Anak\u00e9 Agung
  pramangkin jejeh ngetor wau nyingakin macan an\u00e9 galak tur mamunyi gru\u00e9ng-gru\u00e9ng.\\n\u201cGediang-gediang!\u201d
  Keto pangandikan Anak\u00e9 Agung sambilang ida malaib ngapuriang. Gedianga kon\u00e9
  lantas macan\u00e9 ento tek\u00e9n I Rar\u00e9 Angon, tegakina abana mulih. Teked
  jumahn\u00e9 macan\u00e9 ento lantas pastuna tek\u00e9n kurenann\u00e9 apang dadi
  lesung, dadi lantas macan\u00e9 ento lesung.\\nBuin maninn\u00e9, buin kon\u00e9
  I Rar\u00e9 Angon kas\u00e9ngin ka puri, ngandika Anak\u00e9 Agung tek\u00e9n I
  Rar\u00e9 Angon, \u201cCai Rar\u00e9 Angon, kema gelah alihang naga, yan cai tond\u00e9n
  maan naga, da cai malipetan mulih!\u201d\\nNgiring kon\u00e9 I Rar\u00e9 Angon,
  lantas ia mapamit budal. Teked jumahn\u00e9 morahan kon\u00e9 ia tek\u00e9n kurenann\u00e9.
  Ditu lantas kurenann\u00e9 nyemak manikn\u00e9. \u201cManik astagina apang ada naga!\u201d
  Ada kon\u00e9 lantas naga ged\u00e9 pesan, tegakina lantas nagan\u00e9 tek\u00e9n
  I Rar\u00e9 Angon ka puri. Ngokok kon\u00e9 nagan\u00e9 ento salantang jalan. Suba
  neked di bancingah, ngl\u00e9pat ikut nagan\u00e9 bakat pentala kon\u00e9 candi
  bentar\u00e9, aas candi pamedal Ida Anak\u00e9 Agung. Anak\u00e9 di bancingah pada
  pablesat malaib, takut tek\u00e9n naga.\\nIda Anak\u00e9 Agung mara mireng orta
  dog\u00e9n suba ida ngetor, saling k\u00e9 ngaksinin, m\u00e9h ida lemet prajani.
  Kapangandikayang lantas I Rar\u00e9 Angon ngediang nagan\u00e9 ento. Mulih lantas
  I Rar\u00e9 Angon negakin naga. Teked jumahn\u00e9 nagan\u00e9 ento lantas pantuna
  tek\u00e9n kurenann\u00e9 dadi lu.\\nKacrita Ida Anak\u00e9 Agung angob pesan tek\u00e9n
  kasaktian I Rar\u00e9 Angon\u00e9. Buin maninn\u00e9 lantas I Rar\u00e9 Angon kandikayang
  ngalih tabuan sirah. Ditu lantas kurenann\u00e9 ngadakang tabuan sirah, ambul guungan\u00e9
  ged\u00e9n umahn\u00e9, buina nedeng benbena, pagriyeng inann\u00e9 galak-galak.
  Ento kon\u00e9 t\u00e9ngt\u00e9nga tek\u00e9n I Rar\u00e9 Angon abana ka puri.\\nSuba
  neked di puri, pesu makejang inan tabuann\u00e9, sahasa ngrebut ngacelin Ida Anak\u00e9
  Agung. Ida Anak\u00e9 Agung lantas nyel\u00e9 ati, angganidan\u00e9 beseh makaukud.
  Suba suud ngacelin, tabuan\u00e9 lantas nambung. Ditu Ida Anak\u00e9 Agung tusing
  mrasidayang ka pamreman, raris karampa angganidan\u00e9 olih para pangabihnyan\u00e9.\\nUpas
  tabuan\u00e9 nyusup ka anggan Ida Anak\u00e9 Agung kanti ida tuara m\u00e9ling tek\u00e9n
  raga. Buin maninn\u00e9 lantas ida n\u00e9wata. Makuug tangis\u00e9 di jero puri
  tan papegatan. Sasampun Ida Anak\u00e9 Agung s\u00e9da, I Rar\u00e9 Angon lantas
  ka purian ngalih I Lubang Kuri tur lantas ajaka mulih kumahn\u00e9. I Lubang Kuri
  lantas anggona kurenan.\\nKacrita ses\u00e9dan Ida Anak\u00e9 Agung, kasub pesan
  kon\u00e9 kasaktiann\u00e9 I Rar\u00e9 Angon. Yadiastun ia sakti sak\u00e9wala I
  Rar\u00e9 Angon tusing ta\u00e9n sigug kapining anak l\u00e9n. I Rar\u00e9 Angon
  setata mapitulung tek\u00e9ning anak lara an\u00e9 ada di guminn\u00e9. Ento makrana
  makelo-kelo I Rar\u00e9 Angon lantas kadegang Agung baan panjak\u00e9. Sasukat I
  Rar\u00e9 Angon madeg Agung panjak\u00e9 trepti, lingkungan\u00e9 bresih; tusing
  ta\u00e9n ada banjir, tusing ta\u00e9n ada grubug muah sakancan isin gumin\u00e9
  pada asah-asih lan asuh.(*bb/stb)\\nSabtu, 20 Februari 2010\\nSedek dina anu makapepitu
  nganggur kumah I Mandalane. Ditu ia kacunduk teken pianak I Mandalane ane luh, ane
  nedeng truni, madan Ni Luh Layang, jegege ngenyudang keneh.\\nI Lengar paing keliha
  dot teken Ni Luh Layang. Ia lantas maekin I Mandala, tumuli ngraosang anake daa,
  lakar anggona kurenan.\\nI Mandala tusing cumpu mamantu teken I Lengar. Ia lantas
  ngeka daya apanga pianakne tusing makurenan ngajak I Lengar. Kenjekan dugase totonan
  ada lelipi mranen sedek mataluh, masebun di muncuk punyan buahe ane tumbuh di umahne.
  Ningeh munyin I Lengar paling keliha, lantas ia masaut,\\\" Ih cai Lengar, yen saja
  cai dot teken pianak icange, jani ada pangidihan icange teken cai. Isinin apang
  sida ja cai ngamatiang lelipine ane masebun tur mataluh di muncuk punyan buahe tenenan.
  Yen suba mati i lelipi, ditu cai lakar anggon icang mantu. Cai lakar antenang icang
  ngajak pianak icange, Ni Luh Layang\\\".\\nBan dotne ngelah kurenan, muah ampahne
  kaliwat, jeg inceg I Lengar paling keliha masaut,\\\" Nggih Bapa, tiang sanggup
  ngamatiang i lelipi tur nuduk taluhne. Sakewala da Bapa linyok teken janji\\\".\\nI
  Mandala nyaurin,\\\"Di kapan icang linyok teken munyi ten sekadi wayan giri\\\".\\nI
  Lengar tusing taen teken daya upayan I Mandalane. Tusing buin matetimbang ngajak
  adin-adinne. I Lengar paling keliha gegison mongkod punyan buahe. Adi-adinne ngantosang
  di samping punyan buahe.\\nSesubane I Lengar paling keliha neked di basetengahan
  punyan buahe, laut punyan buahe gejoranga. Lelipine tengkejut tur galak jeg nrojo
  I Lengar. Lelipine ngutil I Lengar paling keliha, mawastu ia mati. Sawanne ulung
  ka tanahe.\\nNingalin belinne ngemasin mati, dadi makejang adinne mekeneh ngwirangang.
  Sakaadiri lantas mongkod punyan buahe praya ngamatiang i lelipi. Nanging lacur,
  makejang adinne ngemasin mati kena pangindrajalan I Mandalane. Ditu lantas I Mandala
  ngengkebang sawane nem diri. Ane adiri tuanannga nylempang di samping bungkil punyan
  buahe.\\nKacrita suba sandikala ada anak truna madan I Widara teka kumah I Mandalane.
  Ia makeneh madik Ni Luh Layang. I Mandala masih tusing cumpu mamantu teken I Widara.
  Sawireh keto, I Mandala buin ngrincikang pangindrajala, sarwi ngraos. \\\"Ih, anak
  truna, icang ngisinin keneh caine, sakewala ada pangidihan icange. Ene ada bangken
  anak lengar, mati coto lelipi, nylempang dini di samping punyan buahe. Icang ngidih
  teken cai, apang ngisidang bangkene ene laut tanem di semane. Sasubane cai pragat
  nanem bangkene, kala ditu cai lakar sakapang icang ngajak pianak icange, Ni Luh
  Layang\\\".\\nI Widara masih ampah, tusing menyet kena daya upaya. Gegison ia malaksana
  negen bangken I Lengare, tumuli tanema di semane. Sasubane pragat nanem, ia laut
  mabresih, kenehne cager bakal antenanga ngajak Ni Luh Layang. Dugase I Widara nanem
  bangken I Lengare, I Mandala inceg nyemak bangken I Lengare ane lenan, tumuli pejanga
  sig tongos bangkene i tunian.\\nPragat I Widara mabresih, lantas ia majalan nyujur
  umah I Mandalane. Teked jumah I Mandalane, I Widara ngorahang bangkene suba pragat
  matanem. I Mandala inceg mapi-mapi nureksa tongos bangkene, tumuli ngraos kene,
  \\\"Yeh, orahang cai bangkene suba pragat matanem, kenken undukne dadi enu dini
  ?\\\".\\nI Widara lek tur jengah, laut bangken I Lengare tegena abana ka semane.
  Sasubane pragat matanem, I Widara buin mabresih tumuli buin majalan nyujur umah
  I Mandalane. Dugas I Widara majalan ka semane, I Mandala buin ngedengang bangken
  I Lengare ane lenan, pejanga sig tongos bangkene itunian. Teked jumah I Mandalane,
  I Widara buin ngatonang bangken I Lengare enu ditu. I Widara buin ngincegang negen
  bangkene abana ka semane, laut tanema. Keto unduke bulak-balik, nganti bangkene
  makapepitu telah tanema di semane olih I Widara.\\nDugas I Widara nanem bangken
  I Lengare ane kaping pitu, ia mitaen bangken I Lengare bangke sakti, suba matanem
  bisa mawali ka tongosne i tunian. Marasa teken dewek tusing nyidayang ngalahang
  bangken I Lengare, buina marasa dewekne kenyel cagcag-cigcig ka semane, ia lantas
  buung madik Ni Luh Layang.\\nI Widara lantas murang-murang laku, matinggal uli ditu.
  Keto unduk anake ampah, kadropon malaksana dulurin tuna pepineh tung kuang pangunadika,
  tan urugan nemu sengkala wiadin sakit hati.\"", "\"1 I. PURWAKA. Sangkaning paswecan
  Ida Hyang Widhi Wasa, sane ngardi Buwana Agung lan Buwana Alit. turmaning ngawisesa
  kahuripan sarwa prani miwah sarwa tiumuwu, mewastu I Manusa rikala ngupadi kerahajengan
  jagat melarapan antuk astiti bakti ring linggih Ida miwah pengupaya ring pretiwi
  rauhing pangupapira ring sarwa prani lan sarwa tumuwuh. Mengwing pidabdab pacang
  ngulati kerahengan jagat sekala lan niskala, sampun kaunggahang ring indik Tri Hita
  Karana,Tri mapiteges tetiga, Hita mapiteges kerahajengan, Karana mapiteges awinan.
  Gumanti Tri Hita Karana mapiteges wantah tatiga sane ngardiang jagate preside ngemanggehang
  kerahajengan inggih punika : Ha. Ida Hyang Widhi Wasa : Sane ngardi Buwana Agung
  lan Buwana Alit. Na. Buwana Agung : Pinaka genah kawentenan Buwana Alit Ca. Buwana
  Alit : Sarwa wastu minakadi manusa sane muponin jagadhita ring kahuripan. Sakadi
  sampun katah Desa Pakraman Tonja wantah pawakan buwana, sane mahurip jangkep tur
  sampun negemargiang Tri Hita Karana sekadi ring sor puniki : Ha. Kahyangan Tiga
  ( Pura Desa, Pura Puseh lan Pura Dalem ) pinaka genah ngercana linggih Ida Sanghyang
  Widhi Wasa, saha prabawa idane pinaka urip utawi atma desane. Na. Pawongan ( Ida
  dane Krama Desa ) pawakan Tri Kaya mawinan Desa sida ngamolihang prawerti. Ca. Palemahan
  ( Tanah wewidangan desa saha dagingnyene ) sane sinanggeh angge sarira utawi twulan
  desane. Manut swadarma Krama Desa Pakraman Tonja rikala mikukuhang kasukertan jagat
  malarapan antuk minakadi : Ha. Ngerereh sangkan paraning Desa Pakraman Tonja sekadi
  sane kaunggahang ring indik katattwaning Desa Pakraman Tonja. Na. Ngrajegang kerahajengan
  Desa Pakraman Tonja sajeroning ngelaksanayang Adat, seni Budaya miwah Agama Hindu,sekadi
  sane sampun kapiteketin ring indik Parhyangan. Ca. Ngupadi kasukertan Desa Pakraman
  Tonja sajeroning paiketan I Krama Desa ring krama Desa lianan,sekadi kemanggehang
  ring indik Pawongan. Ra. Mikukuhang kejagatditaan Desa Pakraman Tonja ri sajeroning
  paiketan krama Desa.Ri Sajeroning wewidangan Desa Pakraman Tonja sekadi sane kemanggehang
  ring indik Palemahan. Eka Ilikta Desa Pakraman Tonja Kaca 1\\n2 II. KETATWANING
  DESA PAKRAMAN TONJA. Ri sajeroning kahuripan ring maya pada puniki,sinah janten
  maduwe ketatwan sowang sowang minakadi ketatwanan Desa Pakraman Tonja puniki. a.
  Manut kadi Babad Dalem Kuwub inggih punika : Caritanin duk icaka wartaning bumi,
  Caka 1250 madeg raja ring Bali,mapuspata pwa sira Dalem Batu Ireng. Ri sampun mabiseka
  ngaran pwa sira Asta Sura Ratna Bumi Banten. Raja Asta Sura Bumi Banten Inabih olih
  para demung-demung ira mekabehan. Luirnya : Ki Pasung Grigis, Ki Buahan, Ki Tunjung
  Tutur, Ki Kalung Singkal, Ki Gudung Basur, ana muwah tan kena wilangan. Ya ta Ika
  Dalem Batu Ireng mangadakaken subaya tan inut ri pituduh Raja Majapahit, murka yun
  nira Raja majapahit, rinutus andel-andel nira, apa sadnya pwa sira Patih gajah Mada.
  Tumedun ta sira Gajah Mada maring Bali ngenyahang ta sira Batu Ireng. Riwawu kekantenan
  Patih Gajah Mada, malayu pwa sira Dalem Batu Ireng jaga nyujur pamoksan. Pelayun
  nira pwa sira mangungsi jagat Tro, Gelgel, Baturyang, Batusasih, Kalangendis, Taman
  Yang Batu, Bukit Kali, Batu Belig, Batu Bide, Ngewetanan Pelayuan Nira. Pelayuan
  nira iniring dening waduan nira makabehan luirnia Pasek Bendesa,Pande. Sepanangkane,caritaning
  mangke I Gusti Ngurah Bungaya angadak aken upacara Yadnya ri padruwean nira, Ya
  ta ika Dalem Batu Ireng nguwub ring sor panggungan genah upakara. Ya ta ika I Gusti
  Ngurah Bungaya angatoning Dalem Batu Ireng Tonya, karenge de nira dalem Batu Ireng
  kekatonin Tonya, saksana pinastu I Gusti Ngurah Bungaya ( Boya Bungaya Batan Jeruk
  ) apangaran mangke I Gusti Ngurah Tebongkang. Walikan kata caritane mangke dalem
  Batu ireng mengalor pwa pelayuan nira, raris nanjung Batu, genahe duk nanjung batu
  punika kepastu wekasan graham iki apengaran bumi Tonjaya, mangkana ujar Batu Ireng.
  Mangke waduan nira makabehan akarya kuwu-kuwu pad ajungut-jungut, ( Iki Babad Dalem
  Kuwub muang prasasti Buaji ). b. Babacangan Rsi Bujangga. Duk Icaka warsa Sang Bujangga
  Esti Guru muah Ni Dayu Raris, mangke arep nira pemantuka saking watu wulan, angelod
  kauhan pelaku nia kaget dating ring jagat batu, Rais ketakoning antuk I Gusti Mog
  Arig,sane angraja sila ring Jagat Batu. Ulun Paduka alunge kija, Ulun Pemantuke
  ke Klating,Inggih Eka Ilikta Desa Pakraman Tonja Kaca 2\\n3 punapi Karena ulun tan
  papegatan kena lare ing kene?. Waraha dening paduka yan mangkana jagat iki kinaranan
  Tega, Bungkena jatinnya tan papegatan gering, tega tan tulus kena gering karananing
  Bungkena mangkana ling sang Bujangga. Maparisuda anggrekaning jagat mangkana, lumaku
  sira paripurna lara roga, ika ingkena atur ira I Gusti Mog Arig. Apan karang mangkana
  sagori salu raja,awetani awan sungguan paduka angraja sila. Sadnya sang Bujangga
  ah wong kami sedaya ane dongkuang wastanin swanegara yeki, apa ta ika luirnia mangkana.
  Mangke TONJAYA angaranya bumi iki mapan kiota angaton akuangajaya kal wisya engkene,
  mangke ling sang Bujangga sawur ira I wong kabeh, pada enak age ngewastani swa Negara.
  Muah I Gusti Mog Arig prasama angwastanin TONJAYA Bumi iki. (Babancangan Rsi Bujangga
  ). Asapunika kirang langkung presida keatur tur kesurat ketatwaning Desa Pakraman
  Tonja, Risampune kekantenan wastan Desa Raris kepah dados 9 (siya) banjar adat sane
  wacakan ipun sekadi ring sor puniki : Ha. Na. Ca. Ra. Ka. Da. Ta. Sa. Wa. Banjar
  Adat Tatasan Klod. Banjar Adat Tatasan Kaja. Banjar Adat Tega. Banjar Adat Sengguan.
  Banjar Adat Kedaton. Banjar Adat Batanancak Banjar Adat Tegeh Kuri Banjar Adat Tanggungtiti.
  Banjar Adat Tegehsari. Titiang nenten nyurat ring Eka Ilikita puniki indik ketatwaning
  Banjar Adat inucap ring ajeng, riantukan titian ngemangguhang pikobet nenten wenten
  marupa suratan minakadi lontar lontar utawi prasasti sane prasida nyihnayang wastan
  banjar Adat punika. Eka Ilikta Desa Pakraman Tonja Kaca 3\\n4 III. PARHYANGAN Parhyangan
  ring jagat Bali ketah kasinanggeh wantah linggih Ida Sang Hyang Widhi Wasa, para
  Dewata Dewati, Bhatara bhatari miwah para leluhur sane sane kawaoe Pura. Ring pakubon,
  Jero utawi griya taler wenten linggih Ida sane kabawos Sanggah utawi Pamerajan.
  Parhyangan pinaka genah ngerastiti Ida Sang Hyang Widhi Wasa, riantukan asapunika
  genah utawi linggih Ida punika patut keupapira sekala lan niskala. Sekala widang
  palemahannyane patut mewates sane pastika, yadiastun melakar antuk tanah, paras
  utawi nganggen turus, utawi entik-entikan sane patut. Wates punika kabawos panyengker,
  tetujon ipun mangde ten awor. Punika taler mangde wenten Kori utawi pamedalan. Palemahan
  kautsahayang mangde setata bersih kedulurin antuk tetaneman sekar lan plawa,mangde
  kekantenannyene asri taler mapikenoh nyanggra rikala wentek pebaktian. Palinggih
  pinaka linggih Ida Bhatara patut melakar antuk kayu utawi sane siosan sane manut
  kecaping sastra. Widang Niskala Ida Sang Hyang Widhi utawi Ida Bhatara Bhatari sane
  melinggih ring pelinggihe patut kaaci sakasidan, pamekas anut ring kecaping sastra
  agama minakadinyene : Kesuma Dewa, Sundarigama, : Kesuma Dewa, Sundarigama,Yadnya
  Prakerti, utawi mungguh ring kecaping sastra sane siosan. Pengaci sakasidan inucap
  manut kawentenan sane kabawos Nista, Madya, Utama. Siosan ring punika yadnya pangacine
  patut kepasaksara ring sane manut yadnya lan sang yajamana. Kahyangan Desa sane
  wenten ring wewengkon Desa Pakraman Tonja sampun kamunggahang ring awig-awig Desa
  Pakraman Tonja, inggih punika Kahyangan Tiga, saha piranti sekadi bale kulkul, genah
  pesimpenan raja brana,lan sarana upakara yadnya siosan. Ha. KAWENTENAN KAHYANGAN
  TIGA. Kahyangan Tiga punika nenten sios wantah panyiwian I Krama Desa, ri sajeroning
  Desa Pakraman kayangan tiga punika ketah kebawos Pura Desa lan Bale Agung, Pura
  Puseh, Pura Dalem lan Pura Prajapati muah pura Kahyangan. Pura Kahyangan Tiga punika
  kaempon antuk antuk Krama Desa Pakraman Tonja. Kawentenan Parhyangan punika jantos
  mangkin kapiara becik, miwah ketata rapi, manut etangan I Prajuru Desa katiba ring
  I Krama Desa. Ngenenin indik wates sane kewastaning Tri Mandala sampun taler pastika,
  nanging kawentenannyene kosek pisan riantukan genah sane cupek. Rikala wenten yadnya
  nemonin puja wali utawi serahina-rahina lulunnyene Eka Ilikta Desa Pakraman Tonja
  Kaca 4\\n5 kageseng utawi katunjel ring jaba pura ( nista mandala ) utawi kerarung
  manut genah sane sampun kepastikayang selantur ipun kegingsirin tur keangkut olih
  Dinas kebersihan Kota Denpasar, utawi Guru Wisesa. Sane mereresik ring lahyangan
  tiga serahina nuju rerainan wantah Jro Mangku kewantu antuk krama siosan. Indik
  rahina piodalan ring Pura Kayangan Tiga inucap inggih punika : - Ring Pura Desa,
  Puseh, lan Bale Agung nemonin purnama Kasa. - Ring Pura Dalem,Kahyangan lan Prajapati
  nemonin rahina Saniscara Kliwon wuku Kuningan. Pemargin piodalan ring Pura Desa,Pura
  Puseh lan Bale Agung kemargiang piodalan jelih riantukan kemargiang awarsa apisan,nanging
  ring Pura Dalem,Pura Kahyangan lan Prajapati kemargiang apisan piodalan alit malih
  apisannyene piodalan jelih. Mengwing rerahinan sane katiba asasih kemergiang manut
  dresta oleh pemangku suwang-suwang. Indik pemargin upacara tawur kesange sane kemargiang
  nyabran rahina tilem sasih kesanga, sampun memargi becik tur keempon oleh krama
  Banjar ring wewidangan Desa Pakraman Tonja manut giliran. Ngenenin indik prabia
  piodalan ring pura kahyangan tiga, lan upacara sasih kesanga, ring Desa Pakraman
  Tonja, kamedalan saking kas Krama Desa,Punia Krama Desa lan wantuan Guru Wisesa.
  Lan kemargiang oleh Krama Banjar Desa Pakraman Tonja sane polih giliran. Ring rahina
  piodalan I Krama Desa sampun maturan merupa banten pajegan/gebogan,manut kadi pagilir
  galah sane sampun kacumawisan tur kepastikayang, siosan ring pemangku kahyangan
  tiga sane ngantebin taler pemangku prasanak sarenga nyarengin. Taler Ida sang Sulinggih
  keatur ngenteran pemargin upacara Yadnya ritatkala kemargiang piodalan jelih. Na.
  TATA CARA LAN SARANA PAMUSPAN/PANGUBAKTIAN Muspa utawi nyembah pinaka sarana pamitegep
  nyihnayang pangubakti ring Ida Sang Hyang Widhi Wasa,Bhatara-bhatari miwah leluhur
  antuk nyakupan tangan kalih, pina cihna penunggalan stula sarira kelawan suksma
  sarira utawi penunggalan buwana alit kelawan buwana agung. Tetujuon pengubakti punika
  nenten sios wantah ngaturang suksmaning manah mantuka ring Ida Sang Hyang Widhi
  Wasa sampun prasida ngardi jagat lan dagingnyene, tur nunas kerahajengan ring angga
  keluarga, kerahajengan jagat mane ane siosan. Eka Ilikta Desa Pakraman Tonja Kaca
  5\\n6 Pemargin pemuspan Krama Desa Pakraman Tonja kemargiang nganutin linggih pustaka
  tuntunan pemuspan sane kemedalan olih sang angawarat utawi guru wisesa. Pamitegep
  utawi pepalihan pamuspan kemargiang nganutin kramaning sembah lan Panca sembah kejangkepan
  antuk sarana sekar sane manut, asep lan kwangen. Risampune puput pamuspane kemargiang,
  kelanturanantuk nunas wangsuh pada Ida Bhatara sane kemargiang oleh dane jro mangku
  tur kejangkepan antuk bija. Sadurung pamuspan kemargiang rihinan kemargiang tirta
  pangelukatan olih Jro Mangku sane matetujon mangda sekala lan niskala krama sane
  jagi muspa tan reged. Riantukan genah natah pura cupek pisan lan akehnyene krama
  Desa jagi ngaturan bakti miwah muspa ritatkala rerahinan utawi piodalan, parikrama
  muspa nenten prasida kemargiang apisan, nanging kemargiang megilir. Pemargin pemuspane
  ring Pura Kahyangan Tiga,lan pura pura lianan sane wenten ring sejebag Desa Pakraman
  Tonja, kaenter oleh pemangku kayangan tiga utawi silih sinunggil prajuru Desa sane
  kasudi sane sampun mapudgala. Sekadi sampun katah memargi yening pamuspan punika
  galah ipun nepek ring dauh sane patut ngemargiang Trisandya,pemuspan punika jagi
  kekawitin antuk Trisandya riinan tur ngelantur panca sembah. Yening galah mabuat
  pisat,wawu kejangkepin antuk darma wacana olih Bendesa, kesarengan antuk Petugas
  Penyuluh Lapangan Agama Hindu sane katugas nabdab umat druwene ring Desa Pakraman
  Tonja. Ca. PEMARGIN PAMUSPAN. Pamuspan kemargiang olih I Krama Desa, yadian pamuspan
  serahina-rahina, lan ritatkala Purnama,Tilem, Kajeng Kliwon, rerahinan ageng, piodalan
  ring sanggah utawi merajan I Krama Desa muwah, ring purapura lan pura Kahyangan
  Tiga. Tur sampun kapidabdabin mangda I Krama desa ngemargiang Tri Sandya serahina-rahina
  manut dauh sane sampun pastika. Ra. TARI SANE WENTEN RING DESA PAKRAMAN TONJA. Widang
  seni tari sane wenten ring wewidangan Desa Pakraman Tonja,akidik pisan inggih punika
  sane mrupa tari sakral inggih punika Barong Ket, Dewa Rangda dan Ratu Ayu, Wayang
  Wong, Ketekok Jago, Tari Rejang Dewa, Baris Gede. Tari Baris Gede,Tari Rejang Dewa
  lan Topeng Sidakarya, sampun kamedalan ritatkala piodalan jelih ring Pura Kahyangan
  Tiga gumantine mangde jangkep pemargin piodalan. Sekaa Tari atau wali-walian / tari
  profan taler wenten ring Desa Pakraman Tonja kewastanin sanggar tari lan Tabuh sane
  magenah ring banjar Eka Ilikta Desa Pakraman Tonja Kaca 6\\n7 wewidangan Desa Pakraman
  Tonja. Sekaa-sekaa punika taler sampun presida ngaturang ayah ri kanjekan piodalan
  ring pura Kahyangan Tiga, lan Pura siosan. Ring suang-suang banjar taler wenten
  sekaa-sekaa gong sane kantun tegep, anggen nyanggra tur nyangkepan pemargin yadnyane
  ritakala wenten piodalan utawi karya yadnya ring pura utawi ring suwang-suwang jero
  miwah pakubon. Siosan sane kaucap ring ajeng wenten taler sekadi sekaa geguntangan,sekaa
  santhi lan sekaa angklung. Ka. PARHYANGAN RING KULA WARGA. Kulawarga inggih punika
  pupulan jadma sane kaiket antuk pasidikaran sane kawentenannyene pinih alit ring
  desa Pakraman, diastu asapunika nanging nenten lempas ring uger-uger Tri Hita Karana,
  minakadi parhyangan, pawongan lan palemahan. Genah suci anggen ngarcana Ida Sang
  Hyang Widhi Wasa, Ida Bhatara-Bhatari miwah leluhur ring sajeroning pakulawarga,
  lumrah kewastaninsanggah utawi pemerajan. Genah Parhyangan ring kulawarga punika
  nganutin uger-uger sane munggah ring sastra inggih punika Kaja kangin utawi ring
  ulu pekarangan, pinaka utaming mandala,taler sampun pastika pisan watesnyene. Jimbar
  utawi cupek natarnyene, nganutin kawentenan sang adruwe. Taler sampun katibakan
  nganutin linggih asta bumi lan asta kosala kosali olih sang sane ngawikanin utawi
  siwanyene suwang-suwang. Indik wewangunan pelinggih taler sampun nganutin jajaran,napike
  merupa sanggah, pemerajan gede, utawi alit. Jajaran pelinggih sane wenten ring sanggah
  utawi pamerajan sampun nganutin dresta sane katah iriki ring Desa Pakraman Tonja.
  Mungwing indik pemargin pengaci katah kemargiang nganutin rerahinan sekadi purnama,
  tilem, kajeng kliwon, jantos galungan lan kuningan. Yaning sane nyabran rahina sanistan
  ipun kemargian banten saiban. Ngenenin indik piodalan tatas sampun nganutin rahina
  lan pawukon, ngenembulan apisan pemargine alit apisan jelih apisan. Mareresik ring
  sanggah utawi pemerajan suwang-suwang pinka swadarma sang adruwe pakubon/paumahan
  taler sampun kejangkepin tetanduran sane manut nganutin pewarah-warah sang angwa
  rat. Eka Ilikta Desa Pakraman Tonja Kaca 7\\n8 Da. SWADARMA KRAMA DESA RIKALA NYANGGRA
  UPACARA. Sehanan pemargin upacara ring desa, patut pesan kesanggra olih I Krama
  Desa lanang Istri. Penyanggran krama inucap nganutin ageng alit karya ane kemargiang,
  tur sampun taler sampun pastika gilirannyene sane kaenter olih Prajuru Desa lan
  Klian banjar Pantus suwang-suwang. Indik ngayah yening wenten karya yadnya utawi
  wewangunan, kepatutang sareng sami ngayah nganutin uger-uger sane sampun kepastikayang
  ring perarem. Desa utawi Banjar yening kawentening silih sinunggil krama sane sangkaning
  ngerereh pengupa jiwa utawi ngemargiang swadarmaning Negara jenek ring dura desa
  utawi ring dura negara, kedadosan numbas ayah sane weratnye danganan ring upah buruh.
  Lumbrah ngangge praimba pengargan beras manut uger-uger sane menggah ring perarem.
  Yening nuju karya/piodalan ring pura utawi kelebubangan,sang sane numbas ayah kapatutang
  rauh sanistane ring panumaya karya. Indik pemargin ayah-ayahan I krama ke desa rauh
  mangkin kantun memargi nganutin dresta, sane kaenter olih prajurunyene suwang-suwang
  nganutin ageng alit karya. Ta. INDIK PESANTIAN. Silih sinunggil sarana rikala ngwangun
  karya utamanyene Panca Yadnya, patut kejangkepan antuk kekidungan utawi mawirama/gegitan.
  Ngenenin indik pesantian sampun wenten ring suwang-suwang Banjar wewidangan Desa
  Pakraman Tonja. Risampune lelimbakan indik Utsawa Dharma Githa saking sang angawa
  Rat,mangda wenten nyanggra indik pekaryan asapunika sampun kewentenang seka pesantian
  Desa Pakraman Tonja sane kewastanin Nawa Githa Eka Adnyana, sane anggannyene kasudi
  saking sowangsowang banjar, lan sampun praside ngamolihan jayanti ring tingkat kecamatan
  miwah ring tingkat Kota Denpasar, ri sajeroning ngamiletin Utsawa Dharma Githa punika.
  Ngenenin indik kekidung lan kekawin kemargiang ring sowing-sowang banjar antuk krama
  ring galahe nganutin tatimbang prajuru banjar sowingsowang. Jantos mangkin kawentenannyene
  diastun jagate iriki sampun keni embas pariwisata saha pakibehnyene,kawentenan sekaa
  punika kanyun ajeg. Siosan ring nabdab rikala wenten pacentokan Utswa Dharma Githa.sekaa
  pesantian punika sering keulemin ritatkala wenten warga utawi krama sane ngwangun
  karya ayu. Bilih-bilih yening wenten piodalan utawi karya yadnya ring pura-pura
  penyungsungan se jebag Desa Pakraman Tonja, sekaa pesantian punika sadia ngaturang
  aya. Ngenenin indik upah nenten wenten Eka Ilikta Desa Pakraman Tonja Kaca 8\\n9
  kepastikayang,sukserah nganutin ledang kayun ring sang adruwe karya sane kagenahang
  pinaka sarining daksina. Sa. UTSAHA NELEBANG SANGHYANG AGAMA. Agama Hindu pinaka
  penuntun krama desane sekala niskala gumanti sida ngamolang tetujon kehuripan, inggih
  punika sane kebawos MOKSARTAM JAGADHITA YA CA ITI DHARMA. Indik pemargin tatelebang
  Sang Hyang Agama kemargiang sekadi ring sor puniki: Kaping siki : Ngawentenan tuntunan
  agama ring krama desa. Kaping kalih : Nunas tuntunan ring Parisadha Hindhu Dharma
  Kecamatan. Utawi Kota Denpasar rikala wenten galah sane mabuat, taler nyarengin
  penataran pemangku tukang banten sane kawentenin oleh sang ngawa rat. Kaping tiga
  : Ngwentenan pebaktian nemoning Panca Dasi Sukla Paksa lan Kresna Paksa, ring sanggah
  utawi pemerajan,sowing-sowang pura sane keempon oleh banjar utawai I krama lan Pura
  Kahyangan Tiga manut tetimbang prajuru Desa. Kaping patpat : Nincapang kaheningan
  pekayun ngemargiang pebaktian ring sajeroning parhyangan parhyangan majalaran antuk
  pemargi muspa sinareng sami sane kaenter olih Jro Mangku. Wa. NELEBANG AJAHAN PANCA
  SRADA. Ri sajeroning nelebang ajahan Panca Srada Krama Desa Pakraman Tonja sampun
  mautsaha mautsaha melajahin ajaran sastra agama yadian indik ngenenin Widhi tatwa.
  Atma Tatwa, Karma Phala Tatwa, Punarbhawa Tatwa lan Moksa Tatwa. Ri sajeroning nelebang
  ajaran Widhi Tatwa, taler sampun kelaksanayang melarapan antuk ngastiti bakti ring
  Ida Hyang Widhi Wasa meserana antuk upacara lan upakara, babanten ring parhyangan.
  Taler sampun ngaturan bakti utawi muspa serahina ring pura,sanggah utawi merajan
  suwang-sowang. Taler sampun kauningan indiki tetuek pamuspan, mtirta,lan mabija.
  Ri neleban ajaran Atma Tatwa I Krama Desa sampun sauningan sagilik saguluk, ritatkala
  ngemargiang pah-pah karya, sane keatur oleh Prajuru Desa, nenten saling sikut riantukan
  I krama sampun uning krama desa sami wantah semeton, riantukan sane melinggih riangga
  sarira soang-soang krama suyakti ipun wantah tunggal tur saking Ida Sang Hyang Widhi
  wasa. Eka Ilikta Desa Pakraman Tonja Kaca 9\\n10 Ri neleban ajaran Karma Phala I
  Krama Desa sampun kawentenannyee Karma Phala, mawinan I krama setata mepikayun,
  mekarya, lan mewecana sane becik, serahina-rahina ring jagate. Ri Neleban ajaran
  Punarbhawa I Krama Desa wantah percaya pisan, inggih punika panumadian ke mercepada
  risampunan mebalik ke karang wayah/seda, manut suba, sedurunge embas pungsed anak
  alit ngelaksanayang meluasin /nunas baos sapa sira sane mapuayangan utawi ngidih
  nasi ke mercepada. Ajaran puniki sane ngawinan mangda Ikrama setata melaksana becik
  benjang pungkuran yening numadi kemercepada mangde ten kebanda antuk sengsara. Ri
  nelebang ajaran Moksa I Krama setata mautsaha mengupapira ri sajeroning kauripan
  melarapan antuk nelebang ajaran Tri Kaya Parisudha, yening sampun mewali kekarang
  wayah utawi seda mangda prasida amor ring acintya utawi moksa, suka tan pawali dukha.
  La. PEMARGIN AJAHAN AGAMA. Pemargin tata agama saking nguni rauh mangkin sane kemargiang
  olih I Krama Desa setata memargi becik nenten naenin wenten wicara, mamokang (penipuan
  ) memaling lan paradana. Taler nenten wenten ngalegeyang padruen desa wiadin Pura,miwah
  yan wenten kedurmanggalan digelis keupakara pemarisuda. Eka Ilikta Desa Pakraman
  Tonja Kaca 10\\n11 IV. PAWONGAN. Pawongan kebaws paiketan sehananing para jana antuk
  pasilih asih, paras paros, sarpanaya, salunglung sabayaantaka,ngelaksaneyang pasuka
  duka ring Desa Pakraman Tonja. Piketan punika mangda memargi sekadi tata titi sane
  kebawos susila kerahayuane sareng sami macihna pinaka piranti minakadi sekadi ring
  sor puniki : Ha. Awig-awig Desa Pakraman,Perarem Desa lan Banjar. Na. Bale desa
  lan bale Banjar. Ca. Parhyangan Desa lan Banjar. Ra. Kulkul saha bale Kulkul Desa
  lan Banjar. Ka. Prajuru Desa lan prajuru banjar sane ngenterang Desa utawi Banjar.
  Sane sinangguh Krama Desa Pakraman Tonja, inggih punika sapisanan sane magama Hindu
  tur jenek sane mawit saking Krama Desa Pakraman Tonja, sane sampun ngamiletin polah
  polih mekrama desa utawi makrama banjar tur manut sekadi awig awig Desa Pakraman
  Tonja utawi perarem Banjar. Ring awig-awig lan,desa utawi banjar sampun kasinahang
  asapunapi patutnyene nglaksanayang sajeroning keadatan,sekaa-sekaa,tata cara parum,tata
  cara psuka dukaan, tata cara ngeremba wewangunan, rencana wewangunan, nyanggra darmaning
  Negara lan darmaning agama. Asapunika taler utsaha-utsaha pacing nincapang paiketan
  maagama,sareng tiyosan agama,lan sang meagama ring sang guru wisesa,sane kebawosang
  sekadi inucap ring ajeng. Ring Desa Pakraman Tonja indike asapunika sampun sami
  pada kemargiang duaning sampun wenten sepat siku-siku sane katuut minakadi Awig-Awig
  Desa Pakraman sane jagi kedarteyang. Ha. INDIK UNDAGAN PRAJURU DESA PAKRAMAN. Sane
  kasinanggehang prajuru ring Desa Pakraman Tonja manut kecap ring awig-aawig inggih
  punika, Sesepuh Desa,Kerta Desa, Bendesa, Pangllman, Penyarikan, Patengen, Kasinoman.
  Soang-soang Prajuru ngemargiang swadarmannyene,tur nenten sane ngerangkap. Pekaryan
  nganutin Swadarma negara tur pada madrue lekita marupa administrasi,tur pemargine,rikala
  ngemargiang pekaryan adat, paras paros sarpanaya. Eka Ilikta Desa Pakraman Tonja
  Kaca 11\\n12 Na. INDIK NGADEGANG PRAJURU. Pemargin nitenin indik ngadegang prajuru
  desa kelaksanayang nyabran kelimang warsa apisan, sampun saking riyin kemargiang
  olih angga panitya sane angganyene utusan saking sowang-sowang Banjar wewidangan
  Desa Pakraman Tonja. Risampun panitya kabentuk selantur ipun ngarereh sang sane
  jagi keadegang Bendesa saking suwang-sowang banjar. Risampunne polih sang sane jagi
  keadegang selantur ipun kasudi langsung olih I Krama Desa nganutin suara pilih akeh
  kemanggehang dados Bendesa. Selanturnya Bendesa sane kasudi nagingin pepelihan prajuru
  luire, Pangliman, Penyarikan, Patengen lan sane siosan keambil saking utusan suwangsuwang
  banjar. Uger-uger sang sane jagi keadegang dados prajuru desa minakadin ipun yusa
  kirang langkung telung dasa tiban ngamunggahan kantos enem dasa lima tiban,uning
  ring sastra nyurat lan ngwacen,siosan ring punika sane mabuat pisan janten kesungkemin
  kecumponin ring Banjar genah sang sane pacing keajegan prajuru. Sane dados keadegang
  Bendesa wantah krama sane uwed kemanten. Ca. AWIG- AWIG DESA PAKRAMAN TONJA. Awig-awig
  pinaka piranti ngiket I krama desa pemekas ring Desa Pakraman Tonja sampun kapatutang
  saha sampun kalingga tanganin antuk sang angawa rat,rawuh Walikota denpasar pinaka
  murdaning jagat Kota Denpasar. Awig- Awig puniki keraremin duk warsa masehi 1992,magenah
  ring Pura Desa saha sampun kasurat antuk aksara Bali miwah kepasupati. Awig-awig
  punika inucap sampun pastika kemargiang olih prajuru desa rikala nibakang wicara
  mantuke ring kramanyene. Ra. INDIK PARUMAN DESA PAKRAMAN TONJA Paruman pinaka sarana
  ikrama desa jagi nykiang pikayun pacing nabdab pengerencana utawi wicara sane mabuat
  ring desa utawi bebanjaran. Manut sekadi kasurat ring sajeroning awig-awig pawos
  17 paruman Desa Pakraman Tonja kepah dados : Kaping siki : Paruman Desa Pakraman
  Tonja. Kaping kalih : Sangkepan prajuru, kawentenang manut wiguna. Peparuman kawentenang
  manut pawukon,taler kelaksanayang nganutin pekaryan utawi pangerencana sane jagi
  kesanggra. Tatacara ngemargiang paruman kepatutang mabusana adat manut dresta,kejangkepan
  antuk upakara pinunas icaan minakadi ipun canang pengaraos,lan cane. Peparuman dados
  Eka Ilikta Desa Pakraman Tonja Kaca 12\\n13 kemargiang risampun upakara kemargiang,kelanturan
  antuk nunas tirta sejangkepnyene, manut dudonan,raris kelanturan antuk manggalaning
  peparuman nyacah kramanyene sane rauh. Yening sampun peparumane kerauhin antuk wargi
  sekirang-kirangnyane atenge lintangan adiri,wawu keangkat peparumane kemargiang.
  Sinamian krama desa nyarengin peparuman aktip ngamedalang pekayun sane mabuat. Ka.
  INDIK KULKUL. Kulkul utawi kentongan wantah pinaka piranti Desa Pakraman Tonja,sane
  suaranyene pinaka tetengeran dedauhan ring krama desa. Siosan ring punika kulkul
  taler wenten ring banjar wewidangan Desa Pakraman Tonja, tetujonnyene taler pateh
  sekadi ring ajeng suaranyene pinaka tetengeran dedauhan ring krama banjar. Sekaa-sekaa
  sane wenten ring bebanjaran taler madue kulkul, nanging bah bangun kulkulnye mabinayan,
  punika taler indik suarannyene ring kulkul banjar. Kulkul inucap kasuarayang sangkaning
  pituduh prajuru manut kawigunan. Ripet wenten jadma nyuarayang kulkul sangkaning
  manah iseng patut kedanda manut daging awig-awig sane kapitegesang antuk perarem.
  Cutet ipun tan kepatutang siosan ring prajuru sane nyuarayang kulkul rikala wenten
  pidabdab sane mabuat. Tetengeran suaran kulkul sane munggah ring awig-awig utawi
  perarem sekadi tengeran wenten yadnya desa utawi banar, anak seda / padem, ngelaksanayang
  pekaryan, keni panca baya, miwah sane siosan sami sampun suaran tetengerane pada
  masiosan. Da. INDIK NEPASIN WICARA. Sahaning wicara sane mawiwit saking krama desa
  sane melaksana corahsaha luirnyane sinengguh nungkasin daging awig-awig,pasuara
  miwah perarem desa/banjar. I Prajuru patut digelis nepasin tur maosin tan nyantos
  pesadok, penepase patut pastika. Nyantennang wong iwang patut melarapan Tri Premana
  minakadi saksi,ilikita miwah bukti, miwah tan maren nepek ring catur dresta luir
  ipun Loka Dresta, Desa Dresta, Purwa Dresta, lan Sastra Dresta. Yan sampun janten
  wong inucap melaksana corah, patut katepekin pamidande manut agung alit kaiwangan
  ipun minakadi : Dedosan antuk arta, panebusan kasisipan antuk ayahan, Upacara antuk
  banten, spa sumaba (Kasepekang) ring desa/banjar, Kebancutin, kegurahin, kasekung
  kesah katundung, kapalasang nunas gung pangampura ring krama desa/banjar. Eka Ilikta
  Desa Pakraman Tonja Kaca 13\\n14 Ta. KAWERUHAN PRAJURU INDIK AWIG AWIG LAN UGER-UGER
  SANE SIOSAN. Indik kaweruhan prajuru Desa Pakraman Tonja indik daging awigawig miwah
  perarem desa sampun keuniang sami, riantukan para prajuru sampun polih dumduman
  awig-awig anggen panuntun sedina-dina ring jeroan,pakubon suwangsuwang prajuru.
  Yadiastun asapunika riantukan kebanda antuk kekirangan I prajuru sinah sampun ipun
  jagi meled melajah tur ngebit-ngebitin awaig-awig punika rikanjekan jagi nepasin
  wicara sane mabuat. Tur taler I Prajuru ten surud-surud melajihin angga,lan masadok
  sareng krama desa sane uning. Sa. PETIAS UTAWI PAUPON UPON PRAJURU. Petias lan upon-upon
  I Prajuru Desa saking Desa Pakraman Tonja/banjar wantah lupun ayah lan papeson Desa
  Pakraman utawi Banjar. Saking Pemerintah Kota Denpasar wenten pica sebilang warsa
  sane katerima oleh Jro Bendesa nanging keh ipun nenten akeh, riantukan dados prajuru
  wantah kedasarin manah antuk ngayah ring jagate. Petias keatur ring Jro mangku Pura
  Kayangan Tiga inggih punika luput peson-peson Desa Pakraman utawi banjar,lan yening
  prade wenten Jero Mangku Kayangan Tiga sane kelayu sekar prabiya upakaranyene Wa.
  INDIK KAWERUHAN PRAJURU. Ngenenin ring kaweruhan prajuru Desa Pakraman Tonja pidarteyang
  titian ring sor : No. Pepasih Linggih Pendidikan 1. Drs. I Made Sudarsana. Bendesa.
  S1. 2. Drs. I Made Nuada. Petajuh I. S1 3. Drs. I Made Sugiarta. Peatjuh II. S1.
  4. I Gede Yoga Premana,SE. Penyarikan I. S1 5. I Nyoman Alit Arta,SS. Penyarikan
  II. S1. 6. I Nyoman Gede Eka Muliawan,SE. Petengen I. S1 7. Putu Gde Himawan Saputra,SE.
  Petengen II. S1 8. I Made Ardana,Spd. Widang Pawongan. S1. 9. I Nyoman Sariana,Spd.M.Si.
  Widang Pawongan. S Ida Bagus Anom BA. Widang Parhyangan. Sarmud. 11. I Ketut Sana.
  Widang Parhyangan. SMU 12. Drs. Ec.I Made Anom Atmaja. Widang Parhyangan. S Drs.
  I Made Oka Bagiarta. Widang palemahan. S I Made Mudita Widang palemahan. SMU 15.
  I Nyoman Supartha. Kesinoman. SMU 16. I Nyoman Suarjana. Kesinoman. SMU 17. I Wayan
  Sukertiyasa. Kesinoman. SMU Eka Ilikta Desa Pakraman Tonja Kaca 14\\n15 La. INDIK
  KAWENTENAN SEKAA TERUNA Indik kawentenan sekaa teruna ring soang-soang banjar sampun
  wenten, maka sami sampun madruwe pepalihan prajuru sane pastika. Taler sampun madruwe
  awig-awig sane keanggen pinaka sepat siku-siku rikala ngemargiang Sekaa Teruna punika,
  taler sampun meduwe buku-buku administrasi sane jangkep. Kawentenan Sekaa teruna
  uleng ngelaksanayang indik kayowanan lan agama. Silih sinunggil Sekaa Teruna Werdhi
  Sesana Br.Tega, Desa Pakraman Tonja sampun ngamolihan jayanti ring pacentokan Sekaa
  teruna tingkat Provinsi Bali pinaka Duta Kota Denpasar warsa 2014 lintang. Ma. PARIBASA.
  Krama Desa Pakraman Tonja rauh mangkin kantun ngajegang tata cara adat nganggen
  bahasa Bali, utama ipun ring peparuman Desa Pakraman,taler nganggen tatacara adat
  anggen mikukuhin wewangunan adat lan Agama Hindhu kadulurin manah sagilik saguluk.
  Punika taler Prajuru Desa Pakraman nganggen bahasa Bali ritatkala keaturin ngerauhan
  yening wenten upacara pepadikan utawi pawiwahan. Lianan ring punika prajuru desa
  patut ngelimbakan bahasa baline mangde keangge bahasa sewai wai sareng keluarganyene
  ring jero pakubon suwang-suwang gumanti bahasa baline presida lestari tur nenten
  ical. Mawinan bahasa nyihneyang budaya. Ga. INDIK NGEPAH PEKARYAN MANUT DRESTA.
  Indik sekaa-sekaa sane wenten ring Desa Pakraman Tonja sekadi sane sampun kawedar
  ring daging ilikita sane duuan jantos mangkin kari ajeg tur lestari. Minakadi sekaa
  teruna,sekaa Gong,Sekaa santhi sanpun tregep jagi nyanggra karya yening kawehin
  karya, tur sampun medrue prajuru sane ngetangan. Ri sajeroning nyanggra pekaryan
  makasami warganyene briuk sepanggul medasar kayun gilik saguluk ngambil sehananing
  pekaryan. Punika taler indik pemargin upacara piodalan,kesanga lan pekaryan sane
  siosan sampun kepah olih Jro Bendesa sape sira sane polih giliran, tetujon ipun
  mangde pekaryan punika pastika sane ngelaksanayang tur sane nitenin. Ba. PAKILITAN
  RING SAJERONING KELOMPOK. Ring sajeroning pakilitan kelompok sane wenten, nyantos
  mangkin memargi becik, seantukan nenten naenin wenten biuta ringkelompok inucap.
  Punika maka cihna kelompok inucap setata nginggilang pakilitan sane becik medasar
  antuk pekayunan segilik saguluk. Ri sajeroning pakilitan menyama braya kelompok
  inucap taler ngutsahayang keraketan pasidikaran marep ring kelompok desa siosan
  utawi sane kasinanggeh kelompok dure desa. Eka Ilikta Desa Pakraman Tonja Kaca 15\\n16
  Nya.NINCAPAN KEGOTONG ROYONGAN. Indik nincapan kegotong royongan ring Desa Pakraman
  Tonja kelaksanayang padgata kala nyabran sasih apisan,sane katedunan olih I krama
  Desa maka sami ring sowangsowang Banjar, sejabaning kram sane polih leluputan minakadi
  Pemangku, Prajuru Desa Pakraman lan sane siosan lan patut. Kedotong royongan inucap
  keambil tur kelasanayang melarapan antuk manah subakti ring Desa Pakraman. Pa. INDIK
  MAPITULUNG. Mawosan indik mapitulung ring Desa Pakraman Tonja kantun memargi becik,punika
  kecihneyang ri sajeroning wenten pekaryan sane merupa upacara agama minakadi upcara
  Panca Yadnya sane kelaksanayang olih I Krama Desa. Indik mapitulung inucap nenten
  ngetangan saking keluarga dane pinih nampek,nyamabraya miwh sane tiyos-tiyosan punika
  sinamina briuk sepanggul mapitulung ring sang sane madue karya. Ja. INDIK SWADARMA
  Mawosang indik swadarma krama Desa Pakraman Tonja sampun kepastika yang manut kadi
  swadarmannyene sowing-sowang,inggihan punika I Prajuru lan I Krama Desa pada uleng
  ngemargian pekaryanyene. Sakewanten nenten lempas ring daging awig-awig Desa Pakraman
  Tonja, setata memargi ngelantur manut dresta. Ya. INDIK TATA TITI KRAMA. Sekadi
  sane sampun kawikanin sareng sami indik tata tit krama ri sajeroning mabebaosan
  setata ngangge anggah ungguhing basa manut kadi sor singgihin ring para jana sane
  jag airing mebaosan umpami matur ring anak lingsir, matur ring sesamen miwah ring
  anak sane sandang singgihan. Punika taler indik mabusana yening wenten upacara adat
  miwah piodalan ring pura sampun manut dresta. Nya. INDIK PEKARSAN MELAJAH NINUTIN
  PAKIBEH JAGAT. Ring Desa Pakraman Tonja taler sampun ngemargiang,nglimbakang tur
  nincapang kaweuhan nganutin uger-uger sane kamedalang olih sang Angawa Rat sane
  sinanggeh guru wisesa,inggih punika wajib belajar.utsahautsaha sane sampun kemargiang
  ring Desa Pakraman Tonja nincapan kaweruhan ring Desa Pakraman Tonja sampun wenten
  PAUD ( Pendidikan Anak Usia Dini ) sane mewasta TK. Tunas Mekar I, Sekolah Dasar,
  Sekolah Kejuruan Menegah lan Perguruan Tinggi sane mabuat pisan jagi nincapan kaweruhan
  krama Desane. Eka Ilikta Desa Pakraman Tonja Kaca 16\\n17 Ha. 1. PARTISIPASI KRAMA
  RING PANGUMBARAN. Krama Desa Pakraman Tonja sane wenten ring pengumbaran setata
  ngelingang desannyene ring dije jua ragane magenah, ring sajeroning ngewangun desannyene
  yadian merupa klompok, yadian niri-niri ring sajeroning ngamedalan pikayun pikayaun,dana
  punia, miwah sane tiyosan keangge ritepengan ngwangun Desa. Ritatkala wenten pujawali
  ring Pura Kahyangan Desa krama pangumbaran inucap stata budal ngaturan bhakti, saha
  sareng nyanggra pidabdabe ring Desa Pakraman. Na. 1. PENGARUH PARIWISATA MAJENG
  RING SAJERONING TATA PAKRAMAN DESA PAKRAMAN TONJA. Sekadi sane sampun katah kemargiang
  olih sang Angawa Rat ring jagat Bali inggih punika Bali kedadosang Industri Pariwisata
  sane madrue, adat sosial budaya sane medasar antuk Agama Hindhu. Katah sampun maosan
  Bali dados Industri Wisata sane ngadol budaya kemanten, budaya sane medasar antuk
  Agama Hindhu. Riantukan asapunika wiyakti banget pisan pengaruh tur pikenoh pariwisata
  punika majeng ring kawentenan Desa Pakraman lan krama duene. Sapunika taler ring
  wewidangan Desa Pakraman Tonja yadiastun nenten dados obyek wisata, nanging keni
  imbas riantukan akeh kramanyene sane mekarya ngerereh pengupa jiwa ring wewidangan
  pariwisata punika. Pengaruh Pariwisata majeng ring krama Desa Pakraman Tonja makeh
  pisan minakadi sekadi ring sor puniki : Kaping siki : Wenten genah ngereh tur nunas
  pekaryan utawi wenten genah ngereh pengupa jiwa. Kaping kalih : Wenten pablibagan
  ( Komunikasi ) sane praside Ikrama jagi ngutsaha nincapan kaweruhannyene indik bahasa.
  Kaping tiga : Wenten pablibagan indik budaya sane mabuat anggen tetimbangan. Kaping
  empat : Wenten pikayun jagi mikukuhin Agama Hindhu lan nincapin tur miara buadayanyene
  pinaka daya tarik wisatawan mangda rauh melancaran ke Bali. Pinaka piranti nulak
  tur ngicalang pengaruh sane kawon sampun taler kecumponin ring perarem Banjar muah
  Desa PAKRAMAN sane medasar antuk awig-awig,umpamin ipun tan kedadosang ngeranjing
  ke Pura yening tan manut ring tata krama. Yan dados mapunyah-punyahan miwah sane
  tiyosan. Eka Ilikta Desa Pakraman Tonja Kaca 17\\n18 Ca. 1. PAKILITAN DESA PAKRAMAN
  MAJENG DESA DINAS Palemahan Desa Pakraman Tonja Kawentenannyene asiki ring wewidangan
  Kelurahan Tonja, duaning asapunika Lurah Tonja maosang linggih Lurah kesarengan
  Bendesa PAKRAMAN Tonja pateh/sejajar. Nika mahawinan ri tepengan wenten pidabdab
  wiadin pekaryan kawentenan bebaosan sane becik, inggian ring ngemedalan krama Desa
  wiadin dinas/tamiu. Nyanto mangkin pakilitan Desa Pakraman Tonja majeng ring Desa
  Dinas nenten nainin wenten wicara. Mangdene nenten wenten ngerangkep pekaryan ring
  I krama Desa, mahawinan Pengurus LPM (Lembaga Pemberdayaan Masyarakat) sinalih tunggil
  lembaga sane wenten ring Desa Dinas nenten kedadosan dados ngerangkep dados prajuru
  Desa Pakraman Tonja, riantukan sami pada ngayah,mangda nenten abot ritatkala ngambil
  pekaryan. Punika taler yening wenten karya mabuat ring Desa Pakraman, Desa Dinas
  taler nyarengan ngewantu bilih bilih indik dana. Ra. 1. PENANJUNG BATU. Manut kadi
  daging Awig-awig Desa Pakraman Tonja sinalih tunggil wacakan ipun Yan ana wong tan
  mekrama ring Desa Pakraman Tonja, kelampusan ( kelayu sekar ) tur pacang ngaben
  ring Setra Desa Pakraman Tonja sajeroning magama Hindhu keni jinah penanjung batu.
  Ka. 1. INDIK LEMBAGA PERKREDITAN DESA ( LPD ) LAN PASAR. Maosan indik LPD lan Pasar
  sane sampun kaloktah ring jagat Bali, kawentenannyene mawiguna pisan keangge ngajegang
  Desa Pakraman. Desa Pakraman Tonja sampun madrue LPD lan Pasar, sane sampun presida
  memargi. Lembaga punika sampun mikolihing pikolih,yadiastun kari kedik nanging mabuat
  pisan anggen ngawewehan dana sane sampun wenten kadruweang olih Desa Pakraman. Ngatos
  mankin mekekalih lembaga punika sayan warsa sayan nincap tur memargi antar. I Krama
  Desa sampun ngangge LPD punika pinaka genah nabung lan nyelang jinah riantukan pikolih
  sane sampun keraseyang olih I Krama,inggih punika 30 % ( telungdasa prosen ) keuntungannyene
  ngeranjing ke Desa Pakraman keangge mecikin pelinggih lan pidabdab sane siosan.
  Punika taler kawentenanyene Pasar Desa Pakraman druwene, nanging riantukan genah
  pasar ring tengah nenten ring Jalan ageng sinah sampun mabineyang ring pasar-pasar
  sane kedrue olih desa PAKRAMAN liannan. Indik Pasar Desa Ngantos mangkin durung
  preside ngewewehin Kas Desa Pakraman duene riantukan kari medabdab tur metaki taki
  dimogi benjang pungkuran mangde preside ngamolihan dana majeng ring Kas Desa. Eka
  Ilikta Desa Pakraman Tonja Kaca 18\\n19 V. PALEMAHAN Ha. WATES DESA PAKRAMAN TONJA
  Jebar kakuwub wewidangan Desa Pakraman Tonja kirang langkung 210 Ha mewates nyatru
  desa inggih punika : 1. Sisi Wetan : Wewidangan Desa Pakraman Oongan. 2. Sisi Kidul
  : Wewidangan Desa Pakraman Sumerta lan Pagan. 3. Sisi Kulon : Wewidangan Desa Pakraman
  Denpasar. 4. Sisi Lor : Wewidangan Desa Pakraman Peraupan. Indik wates Desa Pakraman
  Tonja maka sami ngangge wates alam, wenten sane ngangge rurung, tukad utawi jelingjingan,
  taler sampun kekaryanin tapal batas sane ngepah Desa Pakraman Tonja sareng Desa
  Pakraman sane siyosan. Tapal batas punika sampun nyantenang nyihnayang wates wewidangan
  Desa Pakraman Tonja. Indik wates jantos mangkin nenten naenin wenten wicara, lan
  sampun keunggahang ring peta wewidangan Desa Pakraman Tonja. Na. KEASRIAN WEWIDANGAN
  DESA PAKRAMAN. Ring sowang-sowang keluarga sane jenek ring sajeroning wewidangan
  Desa Pakraman Tonja, ngaryanin keasrian palemahannyene, saking nguni sampun kautsahayang
  sakasidan nenten sangkaning nyanggra pacentokan kemanten. Sowang-sowang telajakan
  paumahan kepatutan lan sampun kautsahayang nanemin entik-entikan sane manut kawigunan,
  karesikan wewidangan palemahannyene sampun taler keutsahayang, tur kelaksanyang
  olih I Krama Desa. Ngenenin indik lulu sewusan kelaksanayang upacara sampun digelis
  keresikin, lulu punika kebungkus tur kewadihan pan ten amure, tur sampun presida
  keangkut olih Dinas Kebersihan Kota Denpasar. Ca. KAWENTENAN SETRA. Kawentenan Setra
  ring Desa Pakraman Tonja wantah kekalih sane mewasta Setra Bungkeneng lan Setra
  Kebon Buni. Setra pinaka genah mendem sawa, utawi genah ngelaksanayang upacara pengabenan
  ( nunjel sawa ) sampun kepah manut kadi pengemong suwangsuwang banjar. Indik keresikan
  setra pastika sampun keutsahayang ngelaksanayang gotong royong nyabran tigang sasih.
  Setra punika sampun pastika watesnyene antuk tembok penyengker. Yadiastun setra
  punika sampun kepah pengempon suwang suwang banjar, nanging yening wenten krama
  sane medrue umah ring wewidangan Desa Pakraman Tonja,nangin Eka Ilikta Desa Pakraman
  Tonja Kaca 19\\n20 nenten mekrama desa ring Desa Pakraman Tonja,wenten kelayuan
  sekar mapikayun ngelaksanayang upacara pengabenan ring setra druwen Desa Pakraman
  Tonja, upacara punika dados kelaksanayang. Nanging sedurung kelaksanayang mangda
  atur supeksa ring I Prajuru Desa utawi Banjar tur keni prabea utawi penanjung batu,manut
  sekadi daging awig-awig lan perarem Desa Pakraman Tonja. Wantah Banjar Tangguntiti
  Setrannyene mabinayang riantukan banjar inucap sampun madrue setra sane mewasta
  Setra Kebon Buni. Ngenenin indik lulu sisan-sisan upakara risampun wusan upacara
  kelaksanayang taler sampun kedabdabang indik kebersihannyene olih I Krama Banjar.
  Ra. KONSEP TRI MANDALA. Ngenenin indik genah pura karang paumahan.setra sampun kemanggehang
  manut uger uger sane kebawos Tri Mandala. Indik genah Pura ring Desa Pakraman Tonja
  samian sampun nganuti Tri Mandala nimakadi : Ha. Na. Ca. Utaming Mandala,pinaka
  genah linggih utama. Madya Mandala pinaka jaba tengah genah wewangunan tiyosan.
  Nista Mandala pinaka jaba sisi. Ring suwang-suwang karang paumahan taler sampun
  nganutin Tri Mandala sane pepalihannyene kadi ring sor puniki : Ha. Na. Ca. Utaming
  Mandala, pinaka genah Parhyangan, minakadi Pamrajan,Sanggah saha sampun ketanduran
  sarwa sekar sane dados keanggen upkara. Madya Mandala pinaka genah wewangunan keluwarga
  nganutin sukat asta kosala kosali,taler ring genahe punika ketandurin pepayonan
  utawi taru hiasan,apotik hidup,karang kitri.dapur hidup miwah sane siosan. Nista
  Mandala genah puniki katah kebawos teba pinaka genah WC,utawi genah ngutang kotoran
  utawi leluhu,tur taler katah ketanduran klapa utawi pisang. Asapunika taler ring
  indik genah setra taler saking nguni sampun nganutin indik sane kebawos Tri Mandala.
  Manut ring daging Awig-Awig Desa Pakraman Tonja wewalungan nenten kedadosang ngeranjing
  ke Pura,yan prade wenten, sang madruwe wewalungan wenang kasisipan antuk denda prebeyaning
  upakara pemarisuda. Indike punika durung naenin kapanggihwewalungan sane ngeranjing
  ke Pura. Eka Ilikta Desa Pakraman Tonja Kaca 20\\n21 Ring sowing-sowang Pura Kahyangan
  Desa sampun kawentenan pakeling indik warga cuntaka tan kedadosang ngranjing ring
  sajeroning Pura, maka sami krama desa sampun uning ring paindikan asapunika taler
  sampun satinu indik pakeling punika. Ka. INDIK BANJAR. Ngenein indik wates banjar
  sampun pada pastika ngangge wates sane merupa rurung,tur sowing-sowang banjar sampun
  madrue bale banjar, nanging krama banjarnyene nenten nganutin genah kadi wewidangan
  banjar,riantukan krama banjar sane wenten ring Desa Pakraman Tonja,genah pakubonnyene
  saling seluk, yadiastun asapunika nenten naenin wenten wicara ring sowing-sowang
  banjar. Banjar inucap sampun presida ngelaksanayang swadarma sowang-sowang. Da.
  INDIK NYANGGRA KATREPTIAN RING DESA PAKRAMAN. Indik nyanggra katreptian ring Desa
  Pakraman Tonja, sampun katugasin Ring Para Pecalang ritakala wenten upacara ring
  Desa Pakraman Tonja. Tiyosan ring punika Taler keadegang Satuan Tugas Keamanan lan
  Ketertiban ri sajeroning ngelaksanayang pengrondan nyabran wengi. Ngenenin pariindikan
  indik wicara sane wenten sampun prasida ketanganin oleh Para Pecalang lan Satuan
  Tugas Keamanan lan Ketertiban punika. Ring Kelurahan Tonja taler kawentenan Satuan
  Tugas Keamanan lan Ketertiban sane mewasta Hansip,sane nyarengan nyanggra katreptian
  Desa Pakraman Tonja. Pecalang taler wenten ring sowang- sowang Banjar ripet wenten
  ke Panca Baya Pecalang punika sampun tiyaga ngelaksanayang utawi mewantu ketreptian
  Desa/Banjar, utawi krama. Ta. TANAH PADRUWEN DESA. Ngenenin indik tanah padruwen
  Desa sane dados pelaba pura Kahyangan Desa inggih punika. : ha. Pelaba Pura Desa
  : - Jebar 2800 M2 lan 400 M2 megenah ring wewidangan Subak Angabaya,Kelurahan Penatih.
  - Jebar 1600 M2 megenah ring wewidangan Banjar Tegehkuri,Desa Pakraman Tonja lan
  sampun keanggen genah Pasar lan Kantor LPD lan Kantor Desa Pakramana Tonja. na.
  Pelaba Pura Dalem : - Jebar 2775 M2 megenah ring wewidangan subak angabaya Desa
  Penatih Dangin Puri. Eka Ilikta Desa Pakraman Tonja Kaca 21\\n22 Makasami padruwen
  desa inucap sampun keilikitayang/kesertipikatang, tiyosan ring padruwen Desa ring
  ajeng taler wenten tanah setra. Pedruwen desa inucap ring ajeng nenten kegarap olih
  I Krama Desa Pakraman Tonja,riantukan genahnyene ring dura desa,nanging indih pikolih
  druwen desa punika sampun taler keterima tur kesurat olih I Prajuru Desa. Sa. PARUPAYAN
  PADRUWEN RING WEWIDANGAN DESA PAKRAMAN. Parupayan padruwen ring wewidangan Desa
  PAkraman Tonja wenten sane kadruwe Desa Pakraman Tonja, inggih punika pelaba-pelaba
  sane sampun kawedar ring ajeng, tiyosan ring punika janten pisan kadruweyang olih
  I Krama Desa sowang-sowang. Tanah padruwen Desa Pakraman jimbarnye wantah akedik
  yan rerehang ( dibandingkan ) ring padruwen I Krama maka sami. Tiyosan ring punika
  yaler wenten tanah padruwen Banjar utaman ipun genah wewangunan balai banjar. Wa.
  NGELESTARIANG TANAH PADRUWEN DESA. Utsaha prajuru Desa Pakraman Tonja ngelestariang
  tanah padruwen desa nyantos mangkin memargi becik, nika mahawinan nenten wenten
  tanah padruwen desa sane megentos kawigunan, taler nenten wenten tanah desa sane
  kadruweyang olih I Krama. Eka Ilikta Desa Pakraman Tonja Kaca 22\\n23 VI. WESANA
  Manut sekadi sane sampun kaungghang tur kapidartayang ring Eka Ilikita mungwing
  kawentenan Desa Pakraman Tonja sane sampun katah nganutin Tri Hita Karana inggih
  punika : Parhyangan,Pawongan lan Palemahan presida kapupulan daging - daging ipun
  ring sor puniki : Ha. Ring widang Parhyangan sampun kasungkemin kawentenan Kahyangan
  Tiga punika genah ngastawa Ida Sang Hyang Widhi Wasa, maka cihna baktin I Krama
  Desa riantukan sampun ngamolihan kerahajengan melarapan saking paswecan Ida. Na.
  Ring widang Pawongan, Krama Desa Pakraman Tonja pastika ngajegang kasukertan ring
  pawongan melarapan antuk ngemargiang daging awig-awig lan perarem,sane tan mari
  katitenin antuk prajuru Desa mewastu wentene pasikian kayun,bawos lan laksana sane
  becik maka cihna kahuripan sane paras paros salunglung sabaya antaka. Ca. Ring widang
  Palemahan kawentenan palemahan Desa Pakraman Tonja,sampun ngemanggehang Tri Mandala,inggih
  punika sane kebawos Utama Mandala, Madya Mandala lan Nista Mandala, sami pinaka
  jalaran pacing ngulati ke jagadhitan ring negara krama. Siosan ring punika Krama
  Desa Pakraman Tonja rikala ngemargiang swadarma ngajegang sahananing dresta,paswara,perarem
  pinaka penyahcah daging awigawig sampun kapidartayang ring daging eka ilikita puniki.
