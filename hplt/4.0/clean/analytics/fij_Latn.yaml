  vuqa sara na nodratou katokatoni ko ni sa dau rogorogoca tiko e na nomuni sala ni
  kakaburaki na Viti Fm, ia na sere oqo \u201cNA DINA LAU LO E LOMA\u201d e vola ko
  Marika Vaniqi, ka katona ko [\u2026]\"", "\"Nida sega ni kila vakavinaka sara na\\nloma
