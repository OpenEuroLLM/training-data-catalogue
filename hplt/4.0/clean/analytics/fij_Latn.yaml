sample: '["\"CAVA E OKATI KINA?\\nNa veivosoti oya na nomu vosota na cala e vakayacori
  vei iko, nomu sega ni cudruvaka se yalocataka na ka e caka vei iko. E sega ni kena
  ibalebale ni o vakadonuya na cala, o raica vakamamada se o vakalecalecava na ka
  e yaco.\\nIVAKAVUVULI VAKAIVOLATABU: \u201cMoni dau yalorawarawa, ni dau veivosoti
  tale ga vakarawarawa ke dua e didivaka e dua na ka vua e dua tale.\u201d\u2014Kolosa
  3:13.\\n\u201cO na raibaleta nona malumalumu e dua qai kauaitaka ga nona sasaga
  me dua na tagane se yalewa vinaka ke o lomani koya.\u201d\u2014Aaron.\\nVUNA E BIBI
  KINA NA VEIVOSOTI\\nKe o dau yaloca, ena rawa ni vakaleqa nomu bula vakayago, rawa
  ni o beci iko, qai rawa sara ga ni vakaleqa nomu vakawati.\\n\u201cA vakararawataki
  au dina o watiqu ena dua na gauna, qai kere veivosoti vei au. E taura toka na gauna
  meu qai vosoti koya. Au veivutunitaka noqu sega ni veivosoti totolo. Qori e ikuri
  tale ni leqa ena neirau vakawati.\u201d\u2014Julia.\\nKA O RAWA NI CAKAVA\\nESO
  NA TARO MO VAKASAMATAKA\\nKe vakararawataki iko tale ena dua na gauna o watimu ena
  ka e tukuna se cakava, e vinaka mo taroga:\\n\u2018Au dau kauaitaka tale vakasivia
  na ka e tukuni se caka vei au?\u2019\\n\u2018E gadrevi dina me kere veivosoti vei
  au o watiqu, seu rawa ni guilecava ga na nona cala?\u2019\\nVEIVOSAKITAKA KEI WATIMU\\nVakacava
  keirau dau veivosoti totolo se taura toka na gauna me keirau qai veivosovosoti?\\nNa
  cava me keirau cakava me totolo kina neirau veivosoti?\\nVAKATUTU\\nNi o vakacudrui,
  kua ni nanuma ni nakicataki iko o kemu isa.\\nSaga mo vosota na cala i watimu, nanuma
  tiko \u201ceda dau tarabe kece.\u201d\u2014Jemesa 3:2.\\n\u201cE rawarawa na veivosoti
  ke drau cala ruarua, e dau dredre qori ke cala ga e dua. O koya ga e yalomalumalumu
  dina ena veivosoti.\u201d\u2014Kimberly.\\nIVAKAVUVULI VAKAIVOLATABU: \u201cVeiyaloni
  vakatotolo.\u201d\u2014Maciu 5:25.\\nKe o dau yaloca, ena rawa ni vakaleqa nomu
  bula vakayago, rawa ni o beci iko, qai rawa sara ga ni vakaleqa nomu vakawati\"",
  "\"Na vuli kei na bula vinaka\\n27 November, 2017, 10:28 am\\nUpdate: 10:28AM ENA
  noda veiwasei tiko me baleta na noda vakaiyautaki na kawa iTaukei, e rua na tikina
  au gadreva me\ufffdu vakabibitaka; oya na nodra vuli o ira na noda gone; kei na
  noda qarauna meda bulabula vinaka.\\nO rau oqo erau bibi sara ena nona vakaiyautaki
  koya e dua na kawa tamata. Ena vuli, eda kila ni rawa ni kovei laivi vei keda na
  noda i lavo, noda vale, se noda motoka, ia, e dua na ka ena sega vakadua ni kovei
  tani oya na veika eda vulica ka sa dei tu ena noda kila. Na veika eda vulica ena
  tu vata kei keda ka tawamudu ka na yaga ena veitikina eda bula kina.\\nNa bulabula
  vinaka e i yaulevu. E dau tukuni vakaPeritania, \ufffdgood health is wealth\ufffd.
  Kevaka eda bulabula vinaka eda na rawata e vuqa na ka, wili kina na veivakabauti
  mai vei ira na wekada nida rawata na qaravi tavi.\\nEna tabana ni vuli, au sa dau
  vakaraitaka ena vica na gauna ena noqu rarawa ni so veikeda e vaka era tu wale tu.
  E sega na qele mera teitei kina; e calati ira na veivakatorocaketaki eso; ka sega
  sara tu ga na kila ena dua na tabana ni cakacaka (skills). E dau mosimosi vei au,
  ena noqu dauveilakoyaki me\ufffdu raici ira na noda cauravou nira tuki yaqona tiko
  ena lomaloma ni siga. E dau lako cake mai vei au na loma tarotaro, se sa sega beka
  ni dua na ka yaga era rawa ni vakaitavitaki kina?\\nIa, nida vakadikeva vakamalua,
  eda qai kila ni sega sara tu ga na vuli vei ira na noda cauravou vakaoqo. E lewe
  vuqa sa yaco ga ena kalasi walu, sai koya. Eso era bau \ufffdhigh school\ufffd vakalailai,
  ia, era sega ni vakacavara sara, sa ra mai tu wale tu. E dodonu meda veisautaka
  oqo, o keda na tama nikua. E dodonu me tiko vua na noda cauravou, se noda gone yalewa
  e dua na kila vakacakacaka e yaga (skills). E rawa ni vulica na tuva buloko (block
  layer); tuva tiles (tile layer); dau boroboro (painter); \ufffdplasterer\ufffd;
  kei na vuqa tale na kila ena tara cakacaka ka yaga vakalevu e daidai.\\nAu sa dau
  cauraka e Palimedi me dau tiko ena veitikina kece o ira na kila na tara cakacaka
  nida gadreva na veivakatorocaketaki. Eda sa raica tiko oqo na kena vakavinakataki
  na noda veivale, ka gadrevi vakalevu na veivakavaletaki, ia, ena rawa oqo kevaka
  era tu maliwai keda na noda gone era kila na veigacagaca kece ni cakacaka e gadrevi.
  Era sa tu na kena veikoro ni vuli e veiganiti, me vakataki ira na \ufffdTechnical
  Colleges\ufffd kei Montfont. Oqo e dodonu mera vuli kina vakalevu o ira na noda
  gone me rawa ni t u kina vei ira e dua na kila e yaga.\\nAu sa vakatututaka e Palimedi
  ena dua na \ufffdpetition\ufffd me kakua ni saumi na vuli ena veikoro ni vuli vaka
  oqo. Au a cauaraka talega me wili kina na vuli ena Univeseti; oya me vakalevutaki
  na kila ka vei ira na noda gone, ka ni oqo ena veivuke ena kena vakatuburi ni noda
  i yau.\\nEna tabana ni bula, au leqataka sara vakalevu ni lewe vuqa vei ira na wekada
  era mate dole tiko. Ena vica na soqo ni veibulu au tiko kina ena veimacawa sa oti,
  au vakaraica toka na kedra I bulubulu eso na wekaqu kei na nodra yabaki ni bula;
  ka so vei ira era maumau sara nira mate dole. Era takali oqo ena yabaki sara ga
  ni bula e dodonu mera vuavuai kina (productive years). E vakabauta ni tarai keda
  kece oqo ena noda dui mata vuvale.\\nIa, e daidai, sa rabai levu sara na kila ka
  dodonu meda qaqarauni kina. Eda kila na kena rerevaki na non communicable diseases
  (NCD), se mate sureti. Eda kila na veika e dodonu meda vakalailaitaka, se biuta
  laivi ena noda bula kei na veika meda maroroya. Ena NCD, na tikina bibi taudua oya
  na kakana. O keimami e Palimedi keimami liutaka tiko na valuti ni NCD. Ena dua na
  veiwasei vakaPalimedi e vakaraitaka kina na Marama na Speaker ena vakasigalevu ena
  dua na koro, ka vakaitamera na veikakana lewe ni manumanu e vakarautaki. E sega
  nira bau raica e dua na kakana draudrau, ia, era sautu ena veikakana draudrau ka
  wavolita tu na koro. Ena dua na neitou veisiko kivei iratou noqu Naita e Wainibuka,
  keitou vakasigalevu ena so na mataqali rourou au se qai tovolea vakadua. E dina
  e tiko e loma eso na lewe ni manumanu, ia, vei au, na rourou oya sa rauti au vinaka.
  E veiwalitaka vei au ni oya na \ufffdeveryday\ufffd; ke dina, sa dua na \ufffdeveryday\ufffd
  totoka.\\nNa i tuvaki ni veiqaravi ni bula ena noda vanua esa cecere sara tiko mai.
  Kena i vakaraitaki; ena vica na macawa sa oti, e mai vakadaberi kina ena MIOT (Suva
  Private) e dua na misini ka rawa ni vakaraitaka se ena vakacava na utoda ena lima
  kei na tini na yabaki mai muri.\\nE dodonu me vakayacori vei keda e dua na \ufffdbaseline\ufffd;
  oya na kena vakadikevi kece na noda gacagaca; ka yavutaki kina na veiqaravi era
  na qai muri mai. Oqo ena yaga sara vei ira na noda vuniwai ena veimate kece e dau
  tauvi keda ena veigauna. Ni sega na baseline, era dau yali kina vakatawa dodonu
  eso na wekada eda nanuma nira davo tiko ena dua ga na tauvimate lailai.\\nEna kena
  vakadikevi na lewe ni vanua era sa \ufffdregister\ufffd mera veidigidigi ena yabaki
  mai oqo, 2018; e kunei ni rauta e vitusagavulu ka tolu na pasede (73%), e lailai
  mai a vasagavulu na yabaki ni nodra bula. Oqo esa vakadeitaka sara tikoga ni lewe
  vuqa vei keda era takali dole tiko.\\nNira takali; sa yali ena keda maliwa na vuku,
  sa yali na kila, sa yali na yalomatua. Ena vakaleqa na noda buli yau kevaka e vaka
  tiko oqo na noda bula; ka malumalumu na vuli.\"", "\"Era na vukei vakacava na mataveitacini
  e dau lako vakaca vei ira na ivakaboi vinaka?\\nEso na mataveitacini e dau lako
  vakaca vei ira na ivakaboi vinaka. E sega ni dua na ka era na cakava rawa nira veimaliwai
  e veisiga kei ira tale eso. Eso era taroga gona ke rawa nira kerei na mataveitacini
  mera kua ni vakayagataka na sede se kaloni ena soqoni vaKarisito, soqo ni tabacakacaka,
  kei na soqo ni veiwasewase.\\nE macala ni sega ni dua na lotu vaKarisito ena via
  vakadredretaka nona tiko e dua ena soqoni vaKarisito. Bibi vei keda kece meda vakayaloqaqataki
  ena soqoni. (Iper. 10:24, 25) Ena vinaka me veitalanoa kei ratou na qase o koya
  e dau lako vakaca vua na ivakaboi vinaka, ni vakavuna me sega ni dau tiko ena soqoni.
  E sega ni vakaivolatabu se kilikili me caka eso na lawa me baleta na vakayagataki
  ni ivakaboi vinaka vei ira na tiko ena soqoni, ena vinaka mera vakarautaka na qase
  eso na itukutuku me yaga vei ira na lewe ni ivavakoso mera kila na ka e vauci ena
  leqa qo. Ena vakatau ena ituvaki, ratou na rairai vakatulewataka na qase me veivosakitaki
  eso na itukutuku sa tabaki oti me baleta na leqa qo ena itavi ni veika e gadrevi
  ena ivavakoso, se me kacivaki vakamatau na leqa qo ena Soqoni ni Cakacaka. Ia ena
  sega ni rawa ni kacivaki vakawasoma na tikina qo. Ena noda soqoni era na dau tiko
  o ira na tataleitaki kei ira na vulagi era sega ni kila na leqa qo, eda vinakata
  mera marautaka nodra tiko. Me kua ni tikotiko vakaca e dua ni vakayagataka vakarauta
  na ivakaboi vinaka.\\nKe ra tiko eso ena ivavakoso era sotava tiko na leqa qo, e
  rawa ni tuvanaka na ilawalawa qase mera dabe ena dua na vanua vakatikitiki ena Vale
  ni Soqoni. Kena ivakaraitaki, e rawa nira lai dabe ena rumu ni bose e rawa ni rogoci
  kina na soqoni. Ena sala qo ena yaga tiko ga vei ira nodra tiko ena soqoni. Ia ke
  sega ni wali vakamatau na leqa qo ra qai vakaleqai tiko ga kina, sa rawa ni katoni
  na soqoni se mera qiri mai mera vakarorogo e nodra vale, me vaka e dau caka vei
  ira na sega ni veitosoyaki rawa.\\nEna vica tiko ga na yabaki qo era uqeti na mataveitacini
  ena Noda Cakacaka Vakaitalatala mera vakasamataka vakabibi na tikina qo nira lai
  tiko ena soqo ni veiwasewase. Ni vakayacori na soqo ni veiwasewase ena lomanivale
  e cagina vinaka, era kerei na dauveiqaravi mera kua ni vakayagataka vakalevu na
  ivakaboi vinaka. Me vakasamataki vinaka na tikina qo ena soqo ni veiwasewase, ni
  sega ni rawa me vakarautaki e dua na vanua e sega ni vakatarai kina na ivakaboi
  vinaka. Ia e sega ni inaki ni idusidusi qori me vakayagataki ena soqoni ni ivavakoso.\\nNida
  bula tu ena ituvaki ni vuravura qo, eda na vakila na revurevu ni bula ivalavala
  ca. Eda vakavinavinakataka nodra sasaga eso mera vakamamadataka na ituvaki dredre
  eda tu kina! Ena rairai dredre vei ira eso mera kua ni vakayagataka na sede se kaloni
  me vakarawarawataka kina nodra tiko ena soqoni na mataveitacini. Ia na loloma ena
  uqeti keda meda cakava qori.\\nE tiko na ivakadinadina ena so tale na ivola, ni
  bula dina o Ponitio Pailato?\\nEra kilai Ponitio Pailato na dau wili iVolatabu ni
  a vakaitavi ena nona lewai o Jisu kei na nona vakamatei. (Maciu 27:1, 2, 24-26)
  Ia e laurai tale ga vakavica na yacana ena so na ivola ni itukutuku makawa me baleta
  na gauna oya. E tukuni ena dua na ivolavosa ni iVolatabu (The Anchor Bible Dictionary)
  ni kena ivolatukutuku \u201ce levu duadua qai matailalai ni vakatauvatani kei na
  so tale na kovana ni Jutia kai Roma.\u201d\\nLaurai vakalevu na yaca i Pailato ena
  nona volavola o Josephus e daunitukutuku makawa e Jiu, e vola e tolu na itukutuku
  me baleta na dredre e donuya o Pailato ena gauna e kovana tu kina e Juta. Na ikava
  ni itukutuku e vola o Philo e daunitukutuku makawa e Jiu. Na dauvolavola kai Roma
  o Tacitus, e vola na kedra itukutuku na empara ni Roma, e vakadeitaka ni vakarota
  o Ponitio Pailato na nona vakamatei o Jisu ena gauna e veiliutaki kina o Tiperiu.\\nEna
  1961 era kunea na daukelikeli era cakacaka tiko ena nodra valenisarasara makawa
  na kai Roma mai Sisaria, e Isireli, e dua na vatu rabaraba e ceuti tu kina na yaca
  i Pailato ena vosa vakaLatina. E laurai ga eso na vosa (vakaraitaki tu qo) e ceuti
  ena vatu, ia e nanumi ni volai kina: \u201cE vakatabuya vei ira na kalou dokai na
  Tiperiu (qo) o Ponitio Pailato, na iLiuliu Levu kei Jutia.\u201d Na vale e tukuni
  tiko qo e rairai dua na valenisoro e vakalagilagi kina na Empara ni Roma o Tiperiu.\\nMe
  ubia na uluna na dautukutuku yalewa ke vakavulica e dua ena iVolatabu ni tiko e
  dua na dautukutuku tagane?\\nE tukuni ena \u201cTaro na Dauwiliwili\u201d e tabaki
  ena Vale ni Vakatawa 15 Julai, 2002, me ubia na yalewa na uluna ke veivakavulici
  tiko ena iVolatabu ni tiko e dua na tagane dautukutuku e papitaiso se sega. Ni dikevi
  tale na ulutaga qo, e bibi me vakadodonutaki na kena idusidusi.\\nKe salavata kei
  na yalewa e dua na dautukutuku tagane sa papitaiso ena dua na vuli iVolatabu, ena
  vinakati me ubia o yalewa na uluna. E vakaraitaka nona doka na ituvatuva i Jiova
  me baleta na veiliutaki ena loma ni ivavakoso, ni vakayacora na itavi e dau lesi
  ga vei ira na tagane. (1 Kor. 11:5, 6, 10) Ena yasana adua, e rawa ni kerei tagane
  me caka vuli ke rawata na kena ivakatagedegede.\\nIa ke salavata kei na dua na yalewa
  e dua na tagane e dautukutuku bera ni papitaiso e sega ni watina ena dua na vuli
  iVolatabu, ena sega ni gadrevi vakaivolatabu me ubia na uluna. Ena yasana adua,
  na nodra lewaeloma eso na yalewa ena uqeti ira mera ubia na uludra ena ituvaki mada
  ga va qo.\"", "\"NA TIKO MAI NA LEKUTU 24\\nSa baci vosavakalougatataki ira tale
  na Isireli ko Pelami, 1-9. Sa veileti kaya tale ko Pelaki, 10-14; a sa cavuta ko
  Pelami eso na ka ena yaco, 15-24. Sa lesu tale ki na nona vanua, 25.\\n1Ia ni sa
  raica ko Pelami ni sa vinaka vei Jiova me vakalougatataki ira na Isireli, sa sega
  ni goleva tale, me vaka eliu, na ka ni veinita, ia sa vakanamata ga vaka ki na lekutu.
  2A sa ta cake ko Pelami, a sa raici ira na Isireli ni ra sa tiko vakamataqali; a
  sa curumi koya na Yalo ni Kalou. 3A sa lagata ko koya na nona vosa vakaibalebale,
  ka vaka; Sa kaya ko Pelami, na luve i Piori, Io sa kaya na tamata ka vakayadrati
  na matana: 4Sa kaya ko koya sa rogoca na vosa ni Kalou, Ko koya sa raica na raivotu
  i Koya na Kaukauwa, Sa bibi mai, ia sa yadra ga na matana: 5A ka talei na nomudou
  veivale laca, na Jekope! Na nomudou veivale ni tiko, na Isireli! 6Sa tevuki yani
  me vaka na veibuca, Ka vaka na veiwere mai na bati ni uciwai, Sa vaka na yasiyasi
  sa tea ko Jiova, Ka vaka na sitari e na bati ni wai. 7Ena nodra na veisaqa sa drodro
  maikina na wai, Ia ena nodra na sila-tei e loma ni wai e vuqa; Ena levu na nodra
  tui, ka lailai ko Ekaki, Ia ena vueti cake na nodra matanitu. 8Sa kauti ira tani
  mai Ijipita na Kalou; Sa kaukauwa ko ira e vaka na iunikoni: Ena kania na veimatanitu
  era nodra meca, Ka qurulaka na suidra, Ka laubasikataka e na nona gasau. 9Sa koto
  sobu, sa koto me vaka na laioni, Ka vaka na laioni yalewa: ko cei ena vakayadrata?
  Sa kalougata ko ira yadua sa vosavakalougatataki iko, Ka me ra cudruvi ko ira yadua
  sa vatonaki iko.\\n10A sa waqa mai vei Pelami na cudru i Pelaki, a sa tavia vata
  na ligana: a sa kaya vei Pelami ko Pelaki, Au a kacivi iko mo vatonaki ira na noqu
  meca, ka raica, ko sa vosavakalougatataka sara ka vakatolu vakaoqo: 11ia oqo, mo
  dro ki na nomu yasana: au a kaya me''u vakalevulevui iko sara; ka raica, sa vakadaroya
  ko Jiova mo kakua kina ni vakalevulevui.\\n12A sa kaya vei Pelaki ko Pelami, Au
  a sega beka ni vosa vei ira na nomu i talaki ko a tala vei au, ka vaka, 13Kevaka
  sa na solia mai vei au ko Pelaki na siliva kei na koula e sinai rawa kina na nona
  vale, au sa sega ni sivia rawa na vosa i Jiova, me''u kitaka na ka vinaka se na
  ka ca e lomaqu walega; na ka ga sa cavuta ko Jiova, oqori ka''u na cavuta? 14Ia
  oqo, raica, ka''u sa lako vei ira na kai noqu: me''u na vakatakila mada vei iko
  na ka era na cakava e na gauna maimuri na tamata oqo kivei ira na nomu tamata. 15A
  sa lagata ko koya na nona vosa vakaibalebale, ka kaya, Sa kaya ko Pelami na luve
  i Piori, A sa kaya na tamata ka vakayadrati na matana: 16Sa kaya ko koya sa rogoca
  na vosa ni Kalou, Ka kila nai vakavuvuli i Koya na Cecere, Ko koya sa raica na raivotu
  i Koya na Kaukauwa, Sa bibi mai, a sa yadra ga na matana: 17Au sa raici koya, ka
  sa bera ga ko koya: Au sa raici koya, ka sa yawa ga ko koya: Ena vura mai e dua
  na kalokalo mai vei Jekope, Ka tubu e dua nai titoko vakatui mai vei Isireli, Ka
  yavita na veiyalayala ni Moapi, Ka vakawabokotaki ira kecega na luve i Seci: 18Ia
  ena taukeni Itomi ko koya, Ena taukeni Sia talega ko ira na nona meca; Ia ena gumatua
  na Isireli. 19Ia ko koya sa daulewa ena lako mai vei Jekope, Ka vakarusai ira era
  sa vo e na koro.\\n20A sa raici ira na Amaleki ko koya, a sa lagata na nona vosa
  vakaibalebale, ka kaya, Ko Amaleki ka levu vei ira na veimatanitu, Ia emuri ena
  rusa laivi ko ira.\\n21A sa raici ira na Kenaiti ko koya, a sa lagata na nona vosa
  vakaibalebale, ka kaya, Sa kaukauwa na nomudou i tikotiko, E na uluvatu sa caka
  na nomudou i mocemoce:\\n22Ia ena malai yani na Kenaiti, Me yaco mada na gauna sa
  vakabobulataki kemudou kina na kai Asiria.\\n23A sa lagata ko koya na nona vosa
  vakaibalebale, ka kaya, Ulei, ko cei me bula rawa ni sa kitaka na ka oqo na Kalou!
  24Ia ena lako mai eso na waqa mai na baravi kei Kitimi, Ka vakararawataki Asiria,
  ka vakararawataki ira na Iperi, Ka na rusa laivi talega ko koya.\\n25A sa cavu tu
  ko Pelami, ka la''ki lesu ki na nona yasana: a sa lako talega e nona sala ko Pelaki.\"",
  "\"1Ia me baleta na lako tale mai ni noda Turaga ko Jisu Karisito kei na noda soqoni
  vata vua me da tavaki koya, keitou sa vakamasuti kemuni kina na veiwekani, 2me kakua
  ni veilecayaki vakatotolo na nomuni vakasama, se mo ni loma leqa mai na nona parofisai
  se na nona vunau e dua na tamata se e na dua na i vola e nomuni ni vu mai vei keitou
  ka tukuni kina ni sa yaco oti mai na Siga ni Turaga. 3Me kakua ni dua e vakacalai
  kemuni e na dua na ka. E na sega mada ni yaco na Siga koya me yacova ni sa yaco
  oti na vuki tani mai vua na Kalou ka sa vakaraitaki ko koya na Daucaka Ca ko koya
  sa nakiti tu me na vakarusai mai eli. 4Sa i koya sa dau veivorati kei ira kece ga
  era sa vakatokai me ra kalou se me ra dau qaravi vakalou, ka na vakacerecerei koya
  me cecere vei ira kece ga. E na lako tale ga ko koya ka laki dabe e na Vale Tabu
  ni Kalou ka na kaya ni sa i koya na Kalou. 5Ko ni sa sega beka ni nanuma ni''u a
  dau tukuna vei kemuni na veika oqo e na gauna au sa tiko vata kina kei kemuni? 6Ia
  ko ni sa kila tiko na ka e tarovi koya tiko e na gauna oqo ka me qai vakaraitaki
  ga mai kina ko koya e na kena gauna. 7Ni sa cakacaka tiko edaidai na kaukauwa vuni
  ni ca; ia e na sega mada ni yaco na ka sa dodonu me yaco me yacova ni sa kau tani
  ko koya e se tarova tiko e na gauna oqo. 8E na qai vakaraitaki mai na Daucaka Ca
  koya, ia e na qai vakamatei koya na Turaga ko Jisu e na i cegu ni gusuna ka vakarusai
  koya e na i serau ni kena i rairai ni sa lako mai. 9E na qai lako mai na Daucaka
  Ca e na kaukauwa i Setani ka cakava na veimataqali i vakatakilakila lelevu kece
  ga kei na veika veivakurabuitaki vakailasu kece ga; 10kei na veivakacalai ca kece
  ga vei ira na rusa ni ra sega ni via lomana na ka dina me ra bula kina. 11Sa i koya
  oqo sa tala mai kina na Kalou na veivakacalai kaukauwa vei ira ka ra sa vakabauta
  kina na ka lasu; 12me ra vakarusai kina ko ira kece ga era sega ni vakabauta na
  ka dina, ia ka ra sa dau taleitaka ga na ka sa sega ni dodonu. 13Ia sa kilikili
  me keitou sa dau vakavinavinaka tiko ga vua na Kalou e na vukumuni na veiwekani,
  ko i kemuni sa dau lomani kemuni na Turaga, ni sa digitaki kemuni na Kalou mai na
  i vakatekivu mo ni vakabulai, ni ko ni sa vakasavasavataki e na Yalo Tabu ka vakabauta
  na ka dina. 14Sa kacivi kemuni ki na ka oqo ko koya e na neitou i tukutuku vinaka,
  mo ni taukena kina na lagilagi ni noda Turaga ko Jisu Karisito. 15Sa i koya oqo
  mo ni tu dei kina na veiwekani ka taura matua na veivakavuvuli keitou a vakavulici
  kemuni kina e na vosa se e na i vola. 16Ia me vakaceguya mada ga na lomamuni ka
  vakataudeitaki kemuni e na vei cakacaka kei na veivosa vinaka kece ga na noda Turaga
  ko Jisu Karisito vata kei koya na Kalou ko Tamada, o koya ka a lomani keda ka solia
  vei keda na loloma na vakacegu tawa mudu kei na vakanuinui vinaka!\"", "\"Na Covulaca
  ni Randm 9000 e dua na digidigi e cake ena 2025 makete ni vape vakayagataki. E kilai
  tani ena kena droini duatani kei na kena tekinolaji torocake. Era sa nanamaki tiko
  na veivosacataki ni tavako me tovolea na vape oqo. Era a tiko na dauveivakauqeti
  kei na kenadau ena tavoci me ra raica vakataki ira. Era vakacaucautaka na kena veika
  digitaki kei na kena cakacakataki vakavinaka. \u2026\\n9000\\nNa Covulaca ni Randm
  9000 sa yaco vakatotolo me digidigi levu duadua vei ira na vapers, oka kina o Jake.
  Ena 2025 tavoci vou ni ivoli, a vakamatatataki me baleta na kena ituvatuva veivakauqeti
  kei na kena veimataqali ikanakana. Na digitaki ni kena ikanakana dodonu sa idola
  ni kena marautaki taucoko na misini oqo. Na kena ikanakana yadua e rawa ni vakatorocaketaka
  vakalevu na nomu vamosi. Meda raica mada na \u2026\\nNa Covulaca ni Randm 9000 sa
  toboka na mata ni vaping veivosacataki ena kena ivakarau rabailevu ni flavors kei
  na kena ivakarau cecere. Ni da toso ki na 2025, na misini ni vaping premium oqo
  e tomana tikoga na kena tuvanaki na itikotiko cecere. Eda na dikeva na Randm Tornado
  ni 9000 na kena ikanakana, vakaraitaka na nodrau vakaraitaka kei na kena tekinolaji
  torocake me vakavinakataka cake na vaping. iVakamacala Taumada ki na \u2026\\nNa
  vuravura ni vaping e dau veisau tu ga, kei na Randm Tornado 9000 e dua na misini
  vou. Na railesuvi oqo e raica na kena ivakarau, na kena cakacaka vinaka, kei na
  veika era kaya na vakayagataka. E kena inaki me solia vei iko e dua na rai matata
  me baleta na kena yaga. Ni da vakadikeva na misini oqo, ko na raica na kena tekinolaji
  torocake. E caka \u2026\\nEna 2025, na veivosacataki vapinga era vaqara tiko na
  sala vinaka cake me ra marautaka kina na nodra gacagaca. Na Covulaca ni Randm 9000
  e dua na digidigi cecere duadua me baleta e dua na veika e sotavi ena vaping. E
  vakayagataka na tekinolaji vou kei na droini me vakavinakataki cake kina na vaping.
  Na idusidusi oqo ena vakaraitaka vei iko na sala mo rawata kina na vinaka duadua
  mai na nomu Randm Tornado 9000. O na vulica na kena \u2026\\nNa Covulaca ni Randm
  9000 e dua na rika levu ena vaping tech, makataka e dua na ikalawa levu ki liu.
  Ni da raica na 2025, na gacagaca ni vape oqo e sotava na gagadre ni vakayagataki
  ka tuvanaka na ivakatagedegede vou. E vakaraitaka na bibi ni ivakarau kei na vakasama
  ena vapinga. Ni sa tubu cake tiko na ivakarau vou, na iwasewase oqo e vakadikeva
  na Covulaca 9000 \u2026\\nEna 2025, na Randm Tornado 9000 laurai me vaka e dua na
  misini ni vape e cake. E solia e dua na veika e sotavi me vaka e dua tale. Na kena
  droini kei na tekinolaji e gadrevi me maroroi vakavinaka me rawa ni cakacaka vinaka
  tikoga. Ena kena toso cake na vape vakamisini nikua, kila na iwalewale ni kena maroroi
  na nomu misini e idola. Na idusidusi oqo ena vakavulici iko ena ivakarau mo maroroya
  kina na nomu \u2026\\nNa Covulaca ni Randm 9000 sa tuvanaki me veisautaka na vuravura
  veilecayaki ena 2025. Oqo e dua vei ira na gacagaca e waraki tu vakalevu ena vaping.
  Na misini ni vaping ni vaping oqo e kauta vata mai na tekinolaji kei na droini vou
  ka dau vakaliuci ira na vakayagataka. E kena inaki me wali na leqa me vaka na kena
  yali na kena ikanakana, batiri vakasavuya, kei na rawarawa ni kena vakayagataki.
  Ena \u2026\\nNa Covulaca ni Randm 9000 e dua na veisau ni qito ena vaping. Na railesuvi
  oqo ena kovuta na kena bibi, na vinaka kei na ca, kei na vuna e okati kina me ivakatagedegede
  cecere. Eda na raica na kena tekinolaji torocake kei na kena droini rawarawa ni
  vakayagataki. Na neitou takete me keitou vukei iko mo vakatulewa kevaka e Randm
  Tornado 9000 e dodonu vei iko. iVakamacala Taumada ni Covulaca ni Randm \u2026\\nNa
  Covulaca ni Randm 9000 sa veisautaka tiko na vuravura vaping. E tuvanaka na ivakatagedegede
  vou ka sivia na ka e namaka o koya e vakayagataka. Na misini ni vape e cake oqo
  e cokovata vakamisini kei na dua na droini stylish me baleta na vaping vinaka duadua.
  E vinaka sara vei ira ruarua na vukavuka ka vulagi vou mai. Na Covulaca 9000 kauti
  iko ena dua na ilakolako taleitaki. O na kunea na kena ikanakana vou kei na \u2026\\nRaitayaloyalotaka
  mada e dua na misini ni vapingi ka veisautaka na qito. Na Covulaca ni Randm 9000
  e sega ni dua walega na misini. Oqo na vape vinaka duadua ena makete nikua. E kilai
  ena kena droini ni iyaya ni kotiva kei na vape vakamisini e cake. Na gacagaca oqo
  e yalataka na ivakarau kei na vakacegu vei ira kece na vukavuka. Meda dikeva mada
  na cava e vakavuna na Randm Tornado 9000 e cake \u2026\"", "\"Cava o na tukuna .
  . .\\nio?\\nsega?\\nde dua?\\nKA E KAYA NA IVOLATABU\\nEDA RAWA NI VAKABAUTA NA
  KA E KAYA NA IVOLATABU?\\nIo, qo e tolu na vuna:\\nE Dauveibuli na Kalou. Na iVolatabu
  e vakatoka na Kalou o Jiova me \u201civurevure ni bula.\u201d (Same 36:9; Cakacaka
  17:24, 25) E bulia na kabula kece, e rawa sara ga ni vakabula e dua sa mate.\\nSa
  veivakaturi oti na Kalou. E volai ena iVolatabu e walu na veivakaturi. Era vakaturi
  kina na gone, qase, tagane, kei na yalewa e vuravura. So era se qai mate ga, dua
  ga e tu ena ibulubulu me va na siga!\\n\u2014Joni 11:39-44. E vinakata sara ga na
  Kalou me cakava tale qori. E cata o Jiova na mate; e okata me meca. (1 Korinica
  15:26) E \u201cvinakata\u201d me vakamalumalumutaka na meca qo, me vakaotia vakadua
  na mate ena nona veivakaturi. E lomana dina me vakaturi ira e nanumi ira tu, mera
  bula tale e vuravura.\\n\u2014Jope 14:14, 15, Ai Vola Tabu.\"", "\"Era sa maqusa
  na veitimi kara qito tiko ena sotasota levu ni 1st Fiji Bitter Tabadamu Rugby 7\u2019s.
  Ena tolu tiko na siga ni sotasota oqo ka sa mai tekivutaki tiko ena mataka nikua
  , tomani ni mataka \u2013 Vakaraubuka kana laki vakacavari tiko ena siga Vakarauwai.\\nLevu
  sara na veitimi rogo ena noda vanua era mai vakasota tiko ena sotasota oqo me vaka
  na Police Blue, Fiji Bitter Tabadamu , Waimanu Rugby , Wardens Gold , Police White
  kei na vuqa tale. Tiko talega na vetimi kara na solia tiko na veiqati vinaka vei
  ira na timi lelevu me vaka na Fiji Bitter Mokani, Western Force , Samurai Barracudas,
  AJ Pallets Ba River kei na Tuva Youth.\\nE 48 kece na timi ni tagane era na veiqati,
  12 na timi ni marama kei na 24 na timi ni under 21. Era na vakaitavi talega na goneyalewa
  ena qito netball ka 16 na timi levu kei na 6 na timi ni mixed netball se na timi
  veicurumaki.\\nVei kemuni na via laki sara qito , nai curucuru vei kemuni na qase
  e 5 na dola gone e 3 na dola.\\nVakaraubuka ni mataka curucuru vei kemuni na qase
  , 5 na dola , gone e 3 na dola kei na Vakarauwai sa veisau me 10 na dola na qase
  ka 3 na dola na gone.\\nSema tikoga mai ena Vitifm ena macala ni qito ka sarava
  talega na itaba ena facebook page ni Vitifm.\\nsource:Vitifm\"", "\"\u201cKeitou
  via lako vata kei kemudou, ni keitou rogoca ni tiko vata kei kemudou na Kalou.\u201d\u2014SAKA.
  8:23.\\nSERE 26 Oni Cakava Vei Au\\nKA ENA VULICI *\\n1. Na cava sa tukuna rawa
  tu o Jiova ni na yaco ena noda gauna?\\nSA TUKUNA rawa tu o Jiova na ka ena yaco
  ena noda gauna. E kaya: \u201cEratou na mai taura e tini na tamata eratou duivosavosa
  mai na veivanua kece, io, eratou na taura matua na nona isulu balavu e dua na Jiu,
  eratou kaya: \u2018Keitou via lako vata kei kemudou, ni keitou rogoca ni tiko vata
  kei kemudou na Kalou.\u2019\u201d (Saka. 8:23) O cei na \u201cJiu\u201d? O ira na
  lumuti ena yalo tabu. Era kilai tale ga mera \u201cIsireli ni Kalou.\u201d (Kala.
  6:16) O cei na \u201ctini na tamata?\u201d O ira e nodra inuinui na bula tawamudu
  e vuravura. Era kila ni o Jiova e digitaka na ilawalawa lumuti qori, era raica tale
  ga me ka dokai nodra qaravi Jiova vata.\\n2. Eratou \u201clako vata\u201d vakacava
  kei ira na lumuti na \u201ctini na tamata\u201d?\\n2 Eda na sega ni kila na yacadra
  kece na lumuti era se bula tiko nikua. * Ia e rawa nira \u201clako vata\u201d kei
  ira na lumuti o ira e nodra inuinui na bula tawamudu e vuravura. Ena sala cava?
  E kaya na iVolatabu ni o iratou na \u201ctini na tamata,\u201d eratou na \u201ctaura
  matua na nona isulu balavu e dua na Jiu, eratou kaya: \u2018Keitou via lako vata
  kei kemudou, ni keitou rogoca ni tiko vata kei kemudou na Kalou.\u2019\u201d E tukuni
  ena tikinivolatabu qo e dua ga na Jiu. Ia na vosa \u201ckemudou\u201d e dusia e
  le vica. Kena ibalebale, na Jiu qo e sega ni dua ga na tamata, ia e dusi ira kece
  na lumuti. O ira na sega ni lumuti era duavata kei ira na lumuti mera qaravi Jiova.
  Era na sega ni raici ira na lumuti me nodra iliuliu nira kila vinaka ni nodra iLiuliu
  ga o Jisu.\u2014Maciu 23:10.\\n3. Na taro cava ena saumi ena ulutaga qo?\\n3 E levu
  na lumuti era se bula tiko nikua e vuravura, de dua eda na taroga: (1) Me vakacava
  nodra rai na lumuti me baleti ira? (2) Meda raici ira vakacava na vakayagataka na
  madrai kei na waini ena iVakananumi? (3) Meda leqataka na tubu ni kedra iwiliwili?
  Ena saumi qori ena ulutaga qo.\\nME VAKACAVA NODRA RAI NA LUMUTI ME BALETI IRA?\\n4.
  Na ivakasala cava ena 1 Korinica 11:27-29 mera vakasamataka vakabibi na lumuti?
  Na vuna?\\n4 E vinakati mera vakasamataka vakabibi na lumuti na ivakasala ena 1
  Korinica 11:27-29. (Wilika.) Ena rawa vakacava vua e dua na lumuti me vakayagataka
  \u201cena veibeci\u201d na madrai kei na waini? Ena cakava qori ni kania na madrai
  qai gunuva na waini, ia e talaidredre tiko ena lawa i Jiova. (Iper. 6:4-6; 10:26-29)
  Era kila na lumuti ni dodonu mera yalodina tiko ga mera rawata \u201cna icovi ni
  veikacivi ni Kalou i lomalagi ena vuku i Karisito Jisu.\u201d\u2014Fpai. 3:13-16.\\n5.
  Me vakacava nodra rai na lumuti me baleti ira?\\n5 Na yalo tabu i Jiova e uqeti
  ira na nona dauveiqaravi mera yalomalumalumu, sega ni dokadoka. (Efeso 4:1-3; Kolo.
  3:10, 12) Era na sega gona ni nanuma na lumuti nira vinaka cake. Era kila ni o Jiova
  e sega ni solia vakalevu vei ira na nona yalo tabu, vakalailai vei ira na vo ni
  nona dauveiqaravi. Era sega tale ga ni nanuma ni levu na ka dina vakaivolatabu era
  kila ni vakatauvatani kei ira na kena vo. Era na sega ni tukuna vua e dua ni lumuti
  tale ga, me vakayagataka kina na madrai kei na waini ena iVakananumi. Ia era yalomalumalumu
  nira kila ni o Jiova ga ena digitaki ira na lai bula i lomalagi.\\n6. Me vaka e
  tukuni ena 1 Korinica 4:7, 8, me vakacava na nodra itovo na lumuti?\\n6 Era kila
  na lumuti ni ka dokai mera lai bula i lomalagi, ia era sega ni vinakata mera qoroi.
  (Fpai. 2:2, 3) Era kila tale ga ni gauna e lumuti ira kina o Jiova, a sega ni veitukuniyaka.
  Ena sega gona ni kurabui e dua na lumuti ke dredre mera vakabauta eso tale ni digitaki.
  E kila vinaka ni tukuna na iVolatabu me kua ni vakabauti totolo e dua e kaya ni
  lesi koya na Kalou ena itavi dokai. (Vkta. 2:2) Ke dua erau se qai sota vakadua,
  ena sega ni tukuna vua ni lumuti me kua kina ni vakacerecerei. Ena sega tale ga
  ni dokadoka me veitukuniyaka ni lumuti.\u2014Wilika 1 Korinica 4:7, 8.\\n7. Na cava
  era na sega ni cakava na lumuti? Na vuna?\\n7 Era sega ni nanuma na lotu vaKarisito
  lumuti mera vakailala ga vakataki ira, vaka mera lewena tiko e dua na isoqosoqo.
  Era na sega ni vaqarai ira na vo ni lumuti mera veitalanoataka na sala era lumuti
  kina, se mera lewena e dua na ilawalawa mera vulica vata na iVolatabu. (Kala. 1:15-17)
  Ke ra cakava qori, ena veisei na ivavakoso. Era na sega ni cakacaka vata kei na
  yalo tabu e vakavuna tiko nodra duavata kei na vakacegu na dauveiqaravi ni Kalou.\u2014Roma
  16:17, 18.\\nEDA NA RAICI IRA VAKACAVA NA LUMUTI?\\n8. Na cava meda qarauna kina
  na noda rai me baleti ira na lumuti? (Raica na ivakamacala e ra.)\\n8 Eda na raici
  ira vakacava na lumuti? E cala ke da qoroya vakasivia e dua ke lumuti mada ga. (Maciu
  23:8-12) Ni vakamacalataki ira na qase ni ivavakoso na iVolatabu, e tukuna meda
  \u201cvakatotomuria na nodra vakabauta.\u201d Ia e sega ni tukuna meda vakacerecerea
  e dua na tamata me noda iliuliu. (Iper. 13:7) E kaya na iVolatabu mera \u201crokovi
  vakalevu\u201d eso. Eda sega ni cakava qori nira lumuti, ia nira \u201cqarava vinaka
  na nodra itavi,\u201d era \u201cgumatua [tale ga] ena nodra tukuna kei na nodra
  vakavulica na vosa ni Kalou.\u201d (1 Tim. 5:17) Ke da qoroi ira vakasivia na lumuti
  se vakalevulevui ira, ena rawa nira madua. * Se ca sara, era na dokadoka kina. (Roma
  12:3) Eda sega gona ni via cakava e dua na ka mera tarabe kina na lumuti!\u2014Luke
  17:2.\\n9. Eda na vakaraitaka vakacava nida dokai ira na lumuti?\\n9 Eda na vakaraitaka
  vakacava nida dokai ira na lumuti? Eda na sega ni taroga na sala era lumuti kina.
  Qori e nodra ga kei Jiova, e sega ni dodonu meda kila. (1 Ces. 4:11; 2 Ces. 3:11)
  Meda kua tale ga ni nanuma ni lumuti na watidra, nodra itubutubu, se na lewe ni
  nodra vuvale. E sega ni ka ni kawa na lai bula i lomalagi. E veidigitaki na Kalou.
  (1 Ces. 2:12) Meda qarauna tale ga na taro e rawa ni vakamosi yalo. Kena ivakaraitaki,
  ke lumuti e dua na tacida tagane, eda na sega ni tarogi watina: \u201cNa cava nomu
  rai me baleta na bula tawamudu e vuravura ni sa yali o watimu?\u201d Eda vakadeitaka
  ni o Jiova ena \u201cvakaceguya na veika era gadreva na kabula kece\u201d ena vuravura
  vou.\u2014Same 145:16.\\n10. Eda na taqomaki vakacava nida sega ni vakalevulevui
  ira eso tale?\\n10 Eda na taqomaki tale ga nida sega ni vakalevulevui ira na lumuti.
  Ena sala cava? E kaya na iVolatabu ni rawa nira tawayalodina eso na lumuti. (Maciu
  25:10-12; 2 Pita 2:20, 21) Ia ke da sega ni vakalevulevui ira eso tale, eda na sega
  ni muritamata, vakabibi o ira na lumuti, o ira na qarava na itavi bibi ena ivavakoso,
  se o ira na qaravi Jiova tu mai vakadede. (Juta 16) Ke ra tawayalodina se biuta
  na ivavakoso, ena dei tiko ga na noda vakabauta, eda na qaravi Jiova tiko ga.\\nMEDA
  LEQATAKA NA TUBU NI KEDRA IWILIWILI?\\n11. Na cava e laurai ena kedra iwiliwili
  na vakayagataka na madrai kei na waini?\\n11 E vica vata na yabaki na kena lutu
  tiko ga na kedra iwiliwili na vakayagataka na madrai kei na waini ena iVakananumi.
  Ia ena vica ga na yabaki qo, e tubu tale na kedra iwiliwili. Vakacava meda lomaleqa?
  Sega. Meda dikeva mada eso na vuna.\\n12. Na cava meda kua ni leqataka kina na kedra
  iwiliwili na vakayagataka na madrai kei na waini?\\n12 \u201cO Jiova e kilai ira
  na nona tamata.\u201d (2 Tim. 2:19) Era sega ni kila na tacida tagane era wiliki
  ira na vakayagataka na madrai kei na waini se o cei dina e lumuti, o Jiova ga e
  kila. Na iwiliwili qori era okati kina eso era kaya tiko nira lumuti, ia era sega
  ni digitaki. Kena ivakaraitaki, eso era dau vakayagataka tu mai na madrai kei na
  waini, ia qo era sa cegu. Eso tale era nanuma nira na lai veiliutaki kei Karisito
  i lomalagi ena vuku ni mate ni vakasama se lomabibi. Kena ibalebale, eda sega ni
  kila na kedra iwiliwili kece na lumuti era se bula tiko e vuravura.\\n13. E cavuti
  ena iVolatabu na iwiliwili ni lumuti e vuravura ni tekivu na veivakararawataki levu?\\n13
  Era na tiko e veiyasa i vuravura na lumuti ni kumuni ira o Jisu i lomalagi. (Maciu
  24:31) E tukuna na iVolatabu ni na bula tiko e vuravura e dua na iwiliwili lailai
  sara ni lumuti ena iotioti ni veisiga. (Vkta. 12:17) Ia e sega ni tukuni na kedra
  iwiliwili ni tekivu na veivakararawataki levu.\\n14. Me vaka e cavuti ena Roma 9:11,
  16, na cava meda kila tiko me baleta na nodra digitaki na lumuti?\\n14 E lewa o
  Jiova na gauna me digitaki ira kina na lumuti. (Roma 8:28-30) E tekivu digitaki
  ira na lumuti o Jiova ni vakaturi oti o Jisu. Kena irairai nira lumuti kece na lotu
  vaKarisito ena imatai ni senitiuri. Ena veiyabaki e tarava, levu era kaya nira lotu
  vaKarisito era sega dina ni muri Karisito. Ia o Jiova e lumuti ira eso na lotu vaKarisito
  dina ena gauna qori. E kaya o Jisu me baleti ira nira vaka na witi e tubu ena maliwa
  ni co ca. (Maciu 13:24-30) Ena iotioti ni veisiga, o Jiova se digitaki ira tiko
  ga na lewe ni 144,000. * Kena ibalebale, ke digitaka o Jiova eso ni bera na icavacava,
  e dodonu meda nuitaka ga na nona vuku. (Wilika Roma 9:11, 16.) * Meda kua ga ni
  vakataki ira na tamata cakacaka ena vosa vakatautauvata i Jisu. Era vosakudrukudrutaka
  na ka e cakava na iliuliu ni cakacaka vei ira na qai tekivu cakacaka ena iotioti
  ni aua.\u2014Maciu 20:8-15.\\n15. Me vaka e cavuti ena Maciu 24:45-47, era lewe
  ni \u201cdauveiqaravi yalodina e vuku\u201d na lumuti kece? Vakamacalataka.\\n15
  Era sega ni lewe ni \u201cdauveiqaravi yalodina e vuku\u201d na lumuti kece. (Wilika
  Maciu 24:45-47.) Me vaka ena imatai ni senitiuri, erau vakayagataka tale ga nikua
  o Jiova kei Jisu e vica ga na tacida tagane me ratou vakani ira e levu, se vakavulici
  ira. E vica ga na lotu vaKarisito lumuti eratou digitaki me ratou vola na iVolatabu
  vaKirisi vaKarisito. Nikua tale ga, eratou lesi e vica ga na lotu vaKarisito lumuti
  me ratou vakarautaka na \u201ckakana ena kena gauna donu.\u201d\\n16. Na cava o
  vulica ena ulutaga qo?\\n16 Na cava eda vulica ena ulutaga qo? E vakarautaka o Jiova
  na bula tawamudu e vuravura vei ira e le levu, ia e vica ga era na lai veiliutaki
  kei Jisu i lomalagi. E vakalougatataki ira kece na nona dauveiqaravi o Jiova, wili
  kina o koya na \u201cJiu,\u201d kei na \u201ctini na tamata.\u201d E vinakata o
  Jiova mera muria e dua ga na ivakatagedegede, mera yalodina tale ga. E bibi mera
  yalomalumalumu kece, mera qaravi koya ena duavata, mera kua ni veisei. E bibi tale
  ga mera uqeta kece na veiyaloni ena ivavakoso. Nida volekata yani na icavacava,
  meda qaravi Jiova tiko ga qai muri Karisito nida \u201cdua ga na qelenisipi.\u201d\u2014Joni
  10:16.\\n^ para. 5 Ena yabaki qo, ena vakayacori na iVakananumi ni mate i Karisito
  ena Tusiti na ika7 ni Epereli. Me vakacava noda rai me baleti ira na vakayagataka
  na madrai kei na waini ena yakavi qori? Meda leqataka ni tubu tiko ga na kedra iwiliwili
  na lumuti? Ena saumi na taro qori ena ulutaga qo, e yavutaki ena dua na ulutaga
  ena Vale ni Vakatawa ni Janueri, 2016.\\n^ para. 2 E tukuni ena Same 87:5, 6, ni
  dua na gauna mai muri, na Kalou ena rairai vakatakila na yacadra kece na lumuti
  era veiliutaki kei Jisu i lomalagi.\u2014Roma 8:19.\\nSERE 34 Yalodina Tiko ga\"",
  "\"Na noda kila na ka dina ena vakatau kina na bula kei na mate. Kena ivakaraitaki,
  ni o vakasamataka noda bula, o na sauma vakacava na taro qo: E dewa vakacava na
  tauvimate?\\nA sega tu ni kilai na isaunitaro qori ena vica na udolu na yabaki sa
  sivi, e laurai tale ga nira mate e le vica vata na milioni ni takavi ira na matedewa.
  Ia toso na gauna era qai kila na saenitisi na kena isau. Era dikeva nira vakadewa
  tiko na tauvimate na manumanu somidi me vaka na germs, bacteria se virus. Era marautaka
  na itukutuku qori e vica vata na bilioni nira sa kila na sala mera taqomaki ira
  kina, bula balavu, ra bulabula tale ga.\\nVakacava qori ga na taro e vinakati me
  saumi? Cava nomu rai me baleta na kilai ni ka dina? Vakasamataka mada e vica na
  taro qo:\\nO cei na Kalou?\\nO cei o Jisu Karisito?\\nNa cava na Matanitu ni Kalou?\\nEna
  vakacava na bula ena veigauna se bera mai?\\nE le vica vata na milioni era sa kila
  na isaunitaro qori, ra saga tale ga me vinaka nodra ivakatagedegede ni bula. Ena
  rawa ni yaga tale ga vei iko.\\nO RAWA NI KILA NA KA DINA\\nO na rairai vaqaqa,
  \u2018Ena kilai vakacava na ka dina me baleta e dua na ka?\u2019 Na cava sa qai
  dredre tiko ga kina me kilai na ka dina me baleta e levu na ka?\\nLevu era sega
  ni nuitaka na matanitu, veika vakabisinisi se tabana ni itukutuku mera kila na ka
  dina. E dredre kina mera vakaduiduitaka rawa na itukutuku e dina, e vakatikina,
  lasutaki kei na kena e biu vaqaseqase me nanumi tu ni dina. Ni va qori na ituvaki,
  sa dau veiletitaki gona na itukutuku dina, se na kena yaga ena nodra bula.\\nE ka
  ni sasaga toka, ia se rawa tiko ga ni saumi eso na taro bibi eda dau via kila. Ena
  sala cava? Muria ga na iwalewale o cakava e veisiga mo kila kina na isau ni nomu
  vakatataro.\\nSAGA MO KILA NA KA DINA\\nDe dua e nomu ivakarau mo kila na ka dina
  me baleta e dua na ka. Vakasamataki Jessica mada, e kaya: \u201cE dau lako vakaca
  vei luvequ na pinati, ke dua mada ga na pinati lailai e kania e rawa sara ga ni
  vakaleqai koya.\u201d E kauaitaka vakabibi o Jessica na kakana e volia vei luvena.
  E tomana: \u201cNi bera niu volia e dua na kakana, au na wilika e liu na ivakamacala
  e kabi toka ena kena pakete kei na so tale na kena itukutuku. Au na taro tale ga
  ina kabani e bulia, meu rawa ni vakadeitaka ni na sega ni lako vakaca vei luvequ.
  Au nuidei tale ga nira kaya eso ni kabani vinaka, e caka tale ga vakavinaka na kakana
  ratou bulia.\u201d\\nNa nomu via kila na ka dina ena rairai sega ni vaka sara na
  ka e cakava o Jessica. Ia o rawa ni vuli ena nona ivakaraitaki mo rawa ni kila eso
  na isaunitaro o vaqaqa tu:\\nKila na itukutuku dina kece.\\nVaqaqa e levu tale na
  kena itukutuku.\\nVakadeitaka me nuitaki na yavu ni nomu itukutuku.\\nEna rawa ni
  saumi kina e levu na taro bibi o dau vaqaqa. Ena sala cava?\\nIVOLA VAKASAKITI NI
  KA DINA\\nNa iwalewale e cakava o Jessica me dikeva kina na kakana e lako vakaca
  vei luvena, e vakayagataka tale ga qori me kila na ka dina vakaivolatabu. E kaya,
  \u201cAu dau wilika vinaka na iVolatabu, vakadidike tale ga vakatitobu meu kila
  kina na ka dina.\u201d Me vakataki Jessica, e vica vata tale na milioni era vulica
  ena iVolatabu na isaunitaro qo:\\nEda mai bula tu vakacava e ke?\\nCava e yaco nida
  mate?\\nCava eda rarawa tiko kina?\\nCava ena cakava na Kalou me vakaotia kina na
  rarawa kece?\\nEna bula marau vakacava noda vuvale?\\nO rawa ni kila na isau dina
  ni vica na taro qori kei na so tale ni o wilika na iVolatabu, vakadidike tale ga
  ena internet ena www.jw.org.\"", "\"MUANIWAQA VOCALS-Na matasere oqo, e sa vuqa
