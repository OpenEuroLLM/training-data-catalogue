  Privacy Policy\"", "\"Cata na veika ca. 1 Korinica 6:9, 10\\nKe da lomani Jiova,
  eda na sega ni cakava na veika e cata.\\nE sega ni vinakata o Jiova meda butako,
  mateni se vakayagataka na wainimate gaga.\\nE cata na Kalou na laba, vakalutu, kei
  na veimoceri vakamataqali vata. E sega ni vinakata meda kocokoco se veivala.\\nMeda
  cata na qaravi matakau kei na vakatevoro.\\nEra na sega ni bula ena Parataisi e
  vuravura o ira na dau caka ca.\\nCakava na veika vinaka. Maciu 7:12\\nSaga meda
  vakatotomuria na Kalou meda vakamarautaki koya kina.\\nMeda dauloloma, yalovinaka,
  meda lomasoli tale ga.\\nMeda daudina.\\nMeda yalololoma qai dau veivosoti.\\nTukuni
  Jiova kei na nona ivalavala.\u2014Aisea 43:10.\"", "\"9 SEVITEBA, 2019\\nKA VOU\\nEna
  ika6 ni Seviteba, 2019 e sevutaki na New World Translation of the Holy Scriptures
  ena vosa vakaVenda, kei na itabataba vakavoutaki ni New World Translation ena vosa
  vakaAferika kei na vosa vaXhosa, e Johannesburg, mai Sauca Aferika. Ena siga e tarava,
  e sevutaki na itabataba vakavoutaki ni New World Translation ena vosa vakaCzech,
  kei na vosa vakaSlovaka, e Ostrava mai Czech Republic. E sevutaki tale ga na New
  World Translation ena vosa vakaTurkmen.\\nSa vakadewataki taucoko se vakatikina
  na New World Translation ena 184 na vosa, wili kina e 29 na ilavelave e vakavoutaki
  ena itabataba ni 2013.\"", "\"Vei koya na dairekita. Na sere i Tevita, ni veiyacovi
  oti kei Pacisepa+ o Tevita qai lako mai vua o Necani na parofita.\\n51 Kemuni na
  Kalou, ni lomani au me vaka na dei ni nomuni loloma.+\\nNi bokoca laivi noqu cala
  me vaka na nomuni yalololoma levu.+\\n7 Ni vakasavasavataki au ena isopi mai na
  noqu valavala ca, meu savasava kina,+\\nNi vui au, meu vulavula cake mai na ucacevata.+\\n9
  Ni vagolea tani* na matamuni mai na noqu ivalavala ca,+\\nQai qusia laivi* na noqu
  cala kece.+\\n10 Ni bulia na lomaqu me savasava, kemuni na Kalou,+\\nQai biuta e
  lomaqu e dua na yalo vou,+ na kena e tudei.\\n11 Ni kua ni viritaki au laivi mai
  matamuni,\\nKua tale ga ni kauta tani vei au na yalomuni tabu.\\n12 Ni vakalesuya
  vei au na marau levu ena nomuni veivakabulai,+\\nNi uqeta na lomaqu meu talairawarawa
  vei kemuni.*\\n13 Au na vakavulici ira na dau talaidredre ena nomuni sala,+\\nMera
  lesu tale vei kemuni o ira na valavala ca.\\n14 Ni vakabulai au mai na veibeitaki
  ni vakadavedra,+ kemuni na Kalou, na noqu Kalou ni veivakabulai,+\\nMe marau na
  yamequ ni tukuna na nomuni yalododonu.+\\n16 Ni oni sega ni vinakata na isoro\u2014ke
  sega au na solia,+\\nOni sega ni marautaka na isoro kama taucoko.+\"", "\"ESA koto
  oqo e ra na i kuri ni i vosavosa vaka-Viti, ka veivuke mai kina na Tabana ni i Tovo
  kei na Vosa ena loma ni Minisitiri ni Vuli, ni wiliwili sara yani.\\nNa ivosavosa
  cava e kena ibalebale bula dede ga o koya e dau dro, vakaliataka na cakacaka.\\nKena
  isau: Bula dede ga na dadatuvu\\nVakamacala: Na ?datuvu? e kena ibalebale na yalolailai.
  Qo me vaka na qaravi itavi, na cakacaka se na ivalu.\\nO koya gona ena bula dede
  na dadatuvu nira oca o ira era mamakutu ena cakacaka ka bula vinaka tu ga o koya
  ni dau vakalia ka sega ni bau tara mada ga e dua na cakacaka.\\nNa ivosavosa cava
  e kena ibalebale nona wale na rogo vinaka ena nodra buno na tani.\\nKena isau: Vakaucuucu
  ni Cama\\nVakamacala: Na cama ena waqa ni viti e tu wale tu ga me vukea na cici
  ni waqa.\\nO koya gona meda kua ni rawata na noda bula mai vei ira na tani me vaka
  na cama ni waqa ni Viti ena kena tu wale tu ga.\\nNa ivosavosa cava kena ibalebale
  tamata se manumanu e sesevaki koya, tatabalebale me vaka na mateni na nona ivakarau.\\nKena
  isau: Vaka na ika duvani\\nVakamacala: Na duva e dua na mataqali wa sala toloilevu
  toka ni baravi veivatu kei na veidogo, drau lumisa lelevu toka, se lalai piqi siawa,
  vua rabaraba na vaka na vua ni walai. Na wakana e tuki me mate kina na ika.\\nNi
  dua na tamata e va qo na nona ivakarau ena qai cavuti vua na ivosavosa qo: vaka
  na ika duvani baleta ni tatabalebale ka sesevaki koya mai na nona ilakolako.\\nNa
  ivosavosa cava kena ibalebale mama ga na vakawati voleka se vakoro vata kua so na
  lai vakawati vakayawa.\\nKena isau: Lavi voleka ga na buka e waqa\\nVakamacala:
  Lavi na vakadewataki ni buka waqa me lai waqa tale kina e dua na ka me vaka na buka
  se tavako.\\nKena ibalebale kevaka o lako sara vakayawa, ena boko koso na buka,
  ia, ke o lako voleka ena waqa tiko ga.\\nNa ivosavosa cava kena ibalebale oti na
  soqo, sega tale ni dua na ka e vo, ni sa oti na iyau, kakana kei na so tale.\\nKena
  isau: Maca na wai koto na qere\\nVakamacala: E so na uciwai lalai e dau maca ni
  dausiga vakabalavu na vanua.\\nNi maca oya sa qai kune tu na laqere se na qereqere
  ena boto ni waiwai.\\nVakatauvatani kina na ivosavosa qo ni oti ga na soqo sa sega
  tale ni dua na ka e vo, oti kece sara ga vakadua.\\nNa ivosavosa cava e kena ibalebale
  sota kaya ga na leqa ni lakova.\\nKena isau: Moku na vuaka ni kauta na yavana\\nVakamacala:
  Na kena lai moku na vuaka ena dua na iteitei ka lai vakacaca kina, e baleta ga ni
  kauti koya kina na yavana. O koya gona na nona lai moku se lauvacu e dua na cauravou
  mai na dua na koro e baleta ga na yavana ni kauti koya e ke ya ka mani lai sotava
  wale mai kina na leqa.\\nNa ivosavosa cava kena ibalebale dui kau kena se dui vakarautaki
  koya ena ilakolako\\nKena isau: Lako vakabeka, dui kau kena\\nVakamacala: Na beka
  e dua na mataqali manumanu vuka levu toka, boi levu, vakabati, vakasucuna e kiriwana,
  vaka na ibulibuli ni kalavo qai vakatabana mamare loaloa.\\nEra dau veivukayaki
  vakalevu na vaqara vuanikau dreu, uto vea mera misika, se na se ni onolulu, kavika,
  vuga, niu mera gunuva.\\nRa kosakosa vakalevu nira dau veivala.\\nDau rawa mai ni
  lau kolo se laurabo, se kuretaki na vunikau ra moce se kana kina, se coko ena kena
  lawa se dai soni, qai saqa se tavu me laukana.\\nNa suina e caka kina na batiniveiqia,
  batina e tui me itaube batini beka.\\nNira vuka na beka ena vaqara kedra era dui
  sasaga ga, e sega ni vakatautaka tale vua e dua, ke sa kune na vuata ena kana ga,
  mamau ka vuka yani.\\nE sega ni vakatautaka se kerekere tale vua e dua.\\nNa ivosavosa
  cava kena ibalebale e da tu vata ga, e rawa na veika kece.\\nKena isau: Da tu vata
  ga, vuvu na wai\\nVakamacala: Vakaibalebaletaki na ivosavosa qo ena ika na Nuqa,
  nira dau qeleqeleni vata tu. Qo ena vula o Tiseba na vula i Nuqa lailai kei na vula
  o Janueri na vula i Nuqa levu.\\nNa maliwa ni vula e rua qo era dau qeleqeleni kina,
  kara matai sara na vakavuvu wai mera taqomaki ira kina.\\nO koya gona nira kovuti
  se bunuci e dua na qele ni nuqa, era sa qai vakavuvuya na wai kara dro yani mera
  bula.\\nNa ivosavosa cava kena ibalebale na itutu vakaloloma e tu kina e dua ni
  sa kautani vakasauri vua na ka e dau vakaukauataki koya.\\nKena isau: Vuka nona
  Lulu\\nVakamacala: Na lulu e kainaki ni manumanu dau solia vei keda na vuku ka vuni
  kaukaua. O koya gona ni sa na yali na lulu sa na yali vata tale ga na kaukaua.\\nNa
  ivosavosa cava e kena ibalebale vaka baubau se vakawiliwili wale tu ga, toka wale
  ka vakarorogo\\nKena isau: Vodo i Cama\\nVakamacala: Na cama e gacagaca ni waqa
  ni Viti e vukea na kena nawa se cici vakadodonu.\\nNi da vodo eda vodo ena dago
  ni waqa ni Viti e sega nida vodo ena cama. Na cakacaka kece ni soko ena caka ga
  ena dagoni waqa ni Viti.\\nni dua e vodo i cama e vakawiliwili wale tu ga ena soko,
  toka wale toka ga ka vakarorogo vei ira era cicivaka tiko na waqa.\\nNi dua gona
  e vodo e cama e sega ni cakava na cakacaka ni soko, e vodo wale tiko ga.\\nNa ivosavosa
  cava e kena ibalebale eda sa mai yacova sara na vanua eda a dau gagano taka se da
  tatadrataka tu mai.\\nKena isau: Eda sa mai tarai Burotu sara\\nVakamacala: O Burotu
  e tukuni taki tu ni vanua talei, tu kina na veika matalia ka talei. E tukuni ni
  yanuyanu ni tadra, dau veiciriyaki voli.\\nO koya gona eda sa mai tarai Burotu sara
  oya nida sa mai yacova na vanua eda dau gadreva se da tatadra taka tu meda butuka.\\nNa
  ivosavosa cava kena ibalebale tamata mamaqi taura matua toka nona iyau.\\nKena isau:
  Drega ni vudi tasi\\nVakamacala: Na vudi eda sa kila kece ni tiko na kena drega.
  Ni dau tasi na vudi o na qarauna sara me kakua ni tauva na nomu isulu ni dau dredre
  na kena takali.\\nNi dua gona e mamaqi ena taura matua sara toka ga na nona iyau
  me kakua ni takali tani mai vei koya.\\nQo me vaka ga na drega ni vudi tasi ni sa
  takavi keda ena dredre me takali tani.\\nEna qai tomani tale yani.\\nHome | Top\\\"This
  will be a great advantage for locals living overseas, particularly our readers who
  are soldiers and Fijians serving in the British Army,\\\" Mr Ravula said.\\n\\\"I
  am delighted with it, it''s a major project and it is a major achievement for the
  newspaper and greater service to our readers offshore,\\\" The Fiji Times publisher
  Hank Arts said. \\\"I think the people will love it,\\\" he said.The Fiji Times
  editor-in-chief Fred Wesley voiced similar sentiments and added uploading the vernacular
  newspaper online was part of The Fiji Times'' service to its readers.\\n\\\"We hope
  this site will assist our readers in terms of helping them understand and value
  the iTaukei language, culture and traditions,\\\" Mr Wesley said.\"", "\"Chesterfield
  idabedabe ena cemuria\\nVintage Chesterfield idabedabe kei cemuria\\nRai Vakararaba\\nNa
  Chesterfield idabedabe ena cemuria sa ikoya na noda mamare ka madila e dua mai vei
  ira tale eso, ka dau taura e dua na chesterfield vakasakiti idabedabe. Keitou vakubeci
  na droini makawa ia a solia me dua tale na vakanananu ena gauna oqo. Yavutaki ena
  mataqali tufting nei Chesterfield, eda tovolea me da veisautaka na kena bibi. Na
  dakuna o dau taleitaka na ligamu ena cecere duadua ga ni vakacegu levu. Na idabedabe
  kei na dakuna e sa caka mai na foam malumu ka rawa ni o marautaka e dua na vakaoti
  ni Saratoga. Sa kena ibalebale oqo ni sega ni dodonu mo veivukevuke na cushions
  sa sereka.\\nNi yaco mai ki na cemuria, e vinaka cake tu se donu? E relies kece
  ena nomu rumu ni pepa ia keitou sa vakatura sara ga na cemuria e yasana ka lailai
  na kena gaunisala. O na rairai vakasamataka tiko na kedrau duidui na dodonu kei
  na cemuria na kena italanoa. Raitayaloyalotaka mada ni o tucake tu ena mata ni nomu
  chesterfield idabedabe. Na cemuria dodonu ena tiko ena yasamu imatau kei na dua
  na cemuria ena tiko ena nomu imawi. E sega walega ni dua na idabedabe rawarawa mo
  dabe kina ni ko sarava tiko na retioyaloyalo se kauta e dua na moce ena yakavi ni
  macawa. Ia e dua na chesterfield ni idabedabe ena dua na cemuria e kauta mai ena
  vakasama ni kalasi, eleilei, cecere, softness.\\nMe vaka na roka eda dau placid
  karakarawa me da vakaraitaka kina na yabaki ni gauna oqo, ka solia e dua na marau
  vou kei na vakasama. Tufted ibulukau, matavinaka ka vakamareta, veiqaravi me dua
  na ivakatakilakila cecere ni chesterfield oqo idabedabe. Taga vulaitubutubu kei
  na density sipaji idusidusi vinaka ki na veika totoka idabedabe. Sa vakarautaki
  tu na digidigi ni veiqaravi me chesterfield na nomu idabedabe ka vakakina kevaka
  o sa vakacavara na itukutuku. Keimami dau tu ga eke me vukei kemuni mo ni vakacavara
  na decoration vinaka duadua ni vale.\\nMatailalai ni ivoli\\nOloga ivakatagedegede\\n1~
  3: EPE ologa wavokita na idabedabe\\n4~ 6: Foam corrugated kateni ologa ena tutu\\n7~
  8: Kateni pepa ologa ena loma ni idabedabe, oka kina na kena e ra\\n9~ 12: Vakavavakutaka
  ilati e tautuba.\\nNa i Gale na iRogo\\nQ: O iko e dua na kabani ni manufacturer
  se veisau?\\nE dua: O keda e dua na buli iyaya ni kena upholstery na ivoli mai na
  1985.\\nQ: Sa evei na nomu volau ni nona?\\nE dua: Eda sa tiko ena Shunde, Foshan
  City, Guangdong na yasana, Jaina\\nQ: Na cava na nomu veiqaravi ni volivoli?\\nE
  dua: E tiko e dua na noda vakadikeva na volivolitaki. Kevaka e dua na veivakacacani
  mai na lori se ituvaki vinaka, eda na matanataka na iwali ka solia vei iko na vakasama.\\nQ:
  Na cava na nomu MOQ?\\nE dua: Na noda MOQ e 40HQ se 20GP(E rawa ni vakayagataki
  eso tale na isau), e rawa ni o veiwaki na ivoli duidui mo cokovata kina e dua na
  40HQ se 20GP.\\nQ: E rawa ni o cakava na veitarogi me baleta na cakacaka ni otela?\\nE
  dua: Eda sa sotava na cakacaka me baleta na otela kei na iyaya kece sara e rawa
  ni veisoliyaka na veisaqasaqa ni buka me vaka na CA117, BS5852, BS7177, BS7176,
  kei E0/E1.\\nQ: Na cava na nomu itavi levu ni ivoli?\\nE dua: Eda sa ga vakayacoka
  Sofas, Sofabed, Meteresi, Recliners, kei na idabedabe.\\nQ: E rawa beka ni ''u digitaka
  na roka?\\nE dua: Io, e tiko eso na roka e tu vei keda me da digidigi mai na veimataqali
  iyaya me vaka na leca kakana e cake, PVC, PU, se isulu.\\nQ: Na cava na kena gauna?\\nE
  dua: Ni keirau sa ciqoma na vakacuruilavo, e rawa ni taura e 30 na ~ 35 na siga.\\nQ:
  Na cava na vosa ni sausaumi?\\nE dua: Na ivakarau ni sausaumi ena FOB ki na SHENZHEN
  waqa. T/T, 35% vakacuruilavo, vakatautauvatataki ni bera ni caka.\\nQ: E tiko e
  dua na nomu ivotavota ni ivoli?\\nE dua: Sega, Eda sa OEM ka ODM manufacturer, na
  ivoli kece e vakarawarawataka vei ira na noda kasitama.\\nQ: E rawa ni cakava na
  volau ni nona na sabolo?\\nE dua: Keitou rawa ni vakauta sara ga e loma ni isulu
  se leca na sabolo oqo. Na ODM ni ivoli e dodonu me lesi me icurucuru ni sabolo ni
  oti 10 na ota pcs ena lesu tale ki na icurucuru ni sabolo.\\nQ: Na cava na Lotu
  warranty ni nomu ivoli?\\nE dua: Na warranty ni sofas sa 2 veiyabaki ena loma ni
  vale, 1 yabaki ni leca e tautuba; Meteresi e 10 yabaki ni innerspring vale.\"",
  "\"Chapter 1\\n1 Na raivotu nei Aisea na luve i Emosi, ena nona raica na veika me
  baleti Juta kei Jerusalemi ena gauna i Usaia, Jocame, Easi, kei Esekaia, ratou na
  Tui Juta.\\n2 Rogoca, na lomalagi, ka dolava mai na daligamu, na vuravura! Ni sa
  vosa mai na Kalou o Jiova, \\\"Ka''u a veisusu ka veituberi mai vei ira na luvequ,
  ia o ira, era sa qai vuki tani tale mai vei Au;\\n3 Na bulumakau e kila na kena
  i taukei, kei na asa na bai ni nona Turaga; ia o ira na Isireli, era sega tu ni
  kila, o ira na noqu tamata, era sega ni bau via kauwai mai vei au.\\\"\\n4 Ulei
  na matanitu sa ca na tamata sa bikai ena caka cala, sa tubu me levu na i vakarau
  vakasisila, era sa vakaleqai vakalevu na gone, era sa guilecavi Jiova, era vakacudruya
  me cudru na Yalosavasava i Isireli, era sa vuki tani vakanadaku.\\n5 Cava mo do''u
  mokuti tale kina? Dou sa na qai ca tikoga vakalevu nomudou qavokavoka sa tauvimate,
  na yalomudou sa tu vakadua, sa yali kina na bula.\\n6 Mai na qeteqete ni yavamudou
  me tara yani na nomudou qavokavoka sa sega ni qai dua na i vakaraitaki ni bula me
  kune kina, ia sa kune ga kina na mavomavoa, kei na mawe ni vakacacani; ka sega ni
  bau dua na veiqaravi e bau vakayacori kina se lumuti tu ena waiwai.\\n7 Nomudou
  vanua sa lala, nomudou vei koro lelevu sa vakamai ena buka; o ira na kai tani era
  sa mai kania na nomudou veiwere ena matamudou; sa ra qai biuta tu me lala ni ra
  sa mai taura ka vukica na kai tani.\\n8 O ira na goneyalewa ni Saioni era sa biu
  tu me vaka e dua na vale e tara me cegu kina vakalailai na tamata ena vei loga ni
  vaini, vaka talega na vale ni veimaroroi ena loga ni kiukaba, me vaka na koro sa
  vakacacani.\\n9 Vaka vo o Jiova ni lewe vuqa me qai biuta mai e vica me vo tiko
  vei keda, oi keda eda na via tautauvata kei Sotoma, eda na tautauvata talega kei
  Komora.\\n10 Dou rogoca na vosa i Jiova oi kemudou na vakatulewa tiko mai Sotoma;
  dou rogoca vinaka na vunau ni noda Kalou, oi kemudou na kai Komora:\\n11 \\\"A cava
  sara mada na i naki ni nomudou dauvakacaboi soro mai vei au?\\\" sa tukuna o Jiova,
  \\\"Sa levu tu vei au na sipi tagane me i soro kama kei na uro ni bulumakau, e vakani
  tu vakavinaka au sega ni marautaka na dra ni bulumakau, se lami, se dra ni me.\\n12
  \\\"Ni dou sa lako mai mo dou mai tu e mataqu o cei sa vakadonuya vei kemudou me
  taura me na ciqoma na ligamudou, ni dou sa mai buturaka ka vakacacana na Noqu loma
  ni bai?\\n13 Me kakua ni kau tale mai na i soro vakaveitalia na i madrali boivinaka
  e vakasisila vei Au na Vula Vou, na SigaTabu kei na kacivi mo dou vakasoqoni vata
  mai\u2014Au sa sega ni vosota rawa na i valavala ca kei na soqosoqo tabu.\\n14 Na
  nomudou Vula Vou kei na nomudou Solevu tabu sa cata na lomaqu, sa vakararawataki
  Au tiko, ka sa mai vaka vu leqa vei Au.\\n15 Ni do''u sa dodoka na ligamudou, mai
  vei au ka''u na tabonaka na mataqu mai vei kemudou; e dina ni dou masu mai vakavuqa,
  ka''u na sega ni rogoca na ligamudou sa sinai ena dra.\\n16 \\\"Vakasavasavataki
  kemudou, me savasava vinaka na nomudou bula; dou biuta tani e mataqu na nomudou
  i tovo ca, me sa rauta na caka ca,\\n17 Vulica na caka vinaka; segata na lewa dodonu,
  cudruvi koya na tamata ca, maroroi ira na luve ni yali, dau vukei ira na yada.\\n18
  \\\"Dou lako mai, me tou veivosaki vata\\\" sa tukuna o Jiova, \\\"Ke sa vaka na
  ka kulakula na nomudou i valavala ca sa na vulavula me vaka na vulavula ni uca cevata;
  ke sa mani damu vakula sara, sa na vaka ga na vuti ka ni sipi.\\n19 Kevaka do''u
  sa loma rawarawa mo dou vakarorogo, dou na kania na vuata ni vanua;\\n20 Ia kevaka
  dou cata ka talaidredre, ena tarai kemudou na i seleiwau;\\\" ni sa vosa dina oqo
  mai na gusu i Jiova.\\n21 Na kena yaco me dautagane na koro ka dauyalodina! Koro
  daulewa dodonu, a ka dodonu ga ka dau tiko kina; ia e daidai sa tiko kina na daulaba.\\n22
  Na nomu siliva sa vuki me veveka mai, na nomu waini sa veiwaki vata kei na wai.\\n23
  O ira na nomu ravouvou era sa dautalaidredre, era sa veitokani vata kei ira na daubutako:
  era dauvinakati ira na daurawa ka ena sala tani, ka ra muria me ra saumi lesu: era
  sa sega ni lewa dodonu, ena vukudra na luve ni yali kei na nodra sega ni raici vinaka
  na yada.\\n24 O koya oqo sa tukuna kina na Turaga, o Jiova ni lewe vuqa, o Koya
  na kaukauwa i Isireli, \\\"Io, Ka''u na vakacegui Au mai vei ira na Kequ meca, ka
  vakayacora na cudru vei ira era cati Au.\\n25 Au na vukica vei iko na ligaqu me
  tarai iko ka''u na savata laivi na veveka mai na siliva, ka kauta tani kece.\\n26
  Ka''u na vakalesui ira tale na nomu Turaga ni lewa me vaka e liu, kei ira na nomu
  matabose me vaka na kena i tekitekivu, ka oti o na qai vakatokai, na koro daucaka
  dodonu, ka koro dauyalodina.\\\"\\n27 Ena vakabulai o Saioni ena vuku ni lewa dodonu,
  kei ira era sa veivutuni mai ena lewa dodonu.\\n28 Na veivakarusai vei ira na i
  vakarau kaukauwa kei ira nai valavala ca ena vakayacori vata ga, kei ira era biuti
  Jiova era na rusa.\\n29 Ni ra na maduataka na oki do''u sa daudomona, dou na taqaya
  talega ena vuku ni veiwere dou sa digitaka.\\n30 Ni dou na vaka na vuni oki sa malai
  na drauna, kei na were sa sega kina na wai.\\n31 Ia o koya sa kaukauwa ena vaka
  na wa ni cina, kei na nona cakacaka ena vaka na lidi ni yameyame me waqa mai, e
  rau na kama vata ruarua, ka sega ni rawa ni dua me bokoca rawa.\\nChapter 2\\n1
  Na vosa ka raica o Aisea na luvei Emosi ena vuku i Juta kei Jerusalemi.\\n2 Sa na
  yaco dina sara ena siga mai muri, ni na vakataudeitaki na ulunivanua ni vale i Jiova
  me toka ena ulunivanua cecere, ena vakaceceretaki ka me lolovira na vei ulu ni koro
  tale eso; ka ra na drodro yani kina na vei matanitu kecega.\\n3 Era na lakova na
  tamata e vuqa ka tukuna, \\\"Lako mai, meda lako cake kina ulunivanua i Jiova, kina
  vale ni Kalou i Jekope; ena vakavulica vei keda o koya na Nona i valavala, ia eda
  na muria na Nona sala.\\\" Ni na lako yani mai Saioni na vunau, kei na vosa i Jiova
  mai Jerusalemi.\\n4 Ena ia na veilewai ena vuku ni matanitu ka na vunauci ira e
  vuqa, ka ra na tukitukia na nodra i seleiwau me bati ni siviyara, kei na nodra moto
  me i sele ni samaki; ena sega ni lave i seleiwau e dua na matanitu, kina dua tale
  na matanitu ka ra na sega ni vulica tale na i valu.\\n5 Vei kemudou na mataqali
  i Jekope, meda mai lako voli tu ena rarama i Jiova.\\n6 Ni Kemuni a biuti ira na
  Nomuni tamata na mataqali i Jekope, ni ra sa vakasinaita na nodra bula ena i valavala
  mai na tokalau; era dauvakaraitaka na veika lasulasu me vaka e ka dina me vakataki
  ira na kai Filisitia, ka ra lomavinaka vei ira na gone ni matanitu tani.\\n7 Na
  nodra vanua sa sinai kina na siliva kei na koula, ka sa levu na nodra i yau talei;
  na nodra vanua sa sinai kina na ose, ka sega ni wili rawa na nodra qiqi ni valu.\\n8
  Na nodra vanua sa sinai ena matakau; era cuva ka qarava na cakacaka ni ligadra,
  kina veika e cakava na qaqalo ni ligadra.\\n9 Era cuva sobu na tamata, ena nodra
  vakamalumalumutaki ira; o koya mo ni kakua ni vosoti rawa.\\n10 Mo curu kina vei
  ruku ni vatu ka vunitaki iko ena kuvu ni qele, mai na Nona rerevaki na Kalou, ena
  Nona i serau kei na Nona i ukuuku levu vaka Turaga.\\n11 Na nona mata viavialevu
  e dua na tamata ena vakamalumalumutaki, kei na nodra dokadoka na tamata ena vakabalei
  sobu, ia ena cecere duadua o Jiova ena siga o ya.\\n12 Ena siga i Jiova ni lewe
  vuqa ena lako mai vei ira kecega era dokadoka ka viavialevu\u2014kei ira kecega
  era vakalevulevui ira era na vakamalumalumutaki \u2014\\n13 Na sitari ni Lepanoni
  sa vakacerecerei ka laveti cake, kei na oki kecega ni pasani;\\n14 Na ulunivanua
  cecere kecega, kei na vei delana era sa laveti cake tiko;\\n15 Kei na vale ni valu,
  kei na bai ni valu;\\n16 Na waqa kecega ni Tasisi, kei na i yaya rairai vinaka kecega.\\n17
  Na viavia levu ni tamata ena vakamalumalumutaki sobu, kei na qaciqacia ena uru sobu;
  o Jiova duadua ga ena vakacerecerei ena siga o ya,\\n18 Ia na matakau kece ena vakarusa
  laivi o Koya.\\n19 Era na lako na tamata kina veiqara vatu, kei na qara ena loma
  ni qele, ena vuku ni veika rerevaki i Jiova kei na i ukuuku ni Nona i sulu vakaTuraga,
  ni sa tucake me yavalati vuravura vakalevu sara.\\n20 Ena siga o ya ena biuta tani
  na tamata na nona matakau siliva kei na nona matakau koula, era bulia me ra dauqarava,
  kina na kalavo kei na beka,\\n21 Me la''ki curu kina qara vatu, kei na vei uluvatu,
  ena vuku ni veika rerevaki i Jiova kei na i ukuuku ni Nona i tutu vakaTuraga, ni
  sa tucake me vakayavalati vuravura vakalevu sara.\\n22 Dou kua ni goleva e dua na
  tamata, sa tiko ena qara ni ucuna na nona i cegu; a cava mada sa bau rawata o koya?\\nChapter
  3\\n1 Raica, na Turaga o Jiova ni lewe vuqa, sa kauta tani e Jerusalemi kei Juta
  na veika kece me bula tiko kina, na madrai kece kei na wai kece me bula kina;\\n2
  Na tamata kaukauwa kei ira na tamata ni valu, na Turaga ni lewa kei na parofita,
  kei ira na daurairai kei ira na qase;\\n3 Na Turaga ni lewe limasagavulu kei ira
  era Turaga tu nodra bula, ira na lewe ni bose, kei na matai vuku kei koya sa maqosa
  ena vosa.\\n4 \\\"Au na soli ira na gone me Turaga liuliu vei ira kei ira na gone
  se qai sucu me lewai ira.\\n5 Era na veivakasaurarataki na tamata, vei ira vakataki
  ira kei ira na kai nona; ira na gone era na beca na qase kei ira na tamata wale
  vei ira na Turaga.\\\"\\n6 Na tamata ena goleva na tuakana ena vale nei tamana ka
  tukuna, \\\"E tu vei iko na i sulu; mo liutaki keitou, na leqa sa tu qo me tiko
  ena ruku ni nomu vakatulewa,\\\"\\n7 Ena siga o ya ena vakabesebese, ka tukuna \\\"Au
  na sega ni vakabulai iko, ni sa sega na kakana kei na i sulu e noqu vale; do''u
  kua ni lesi au me''u nomudou i liuliu.\\\"\\n8 Ni sa bale sobu o Jerusalemi, sa
  lutu o Juta, baleta na yamedra kei na nodra bula e vakararawataka na Kalou o Jiova
  me vakacudruya e matana ena Nona i tutu vakaTuraga.\\n9 A i rairai ni matadra sa
  beitaki ira ni ra sa ca, ia na nodra i valavala ca era sa vakavotuya me vakataki
  Sotoma; era sa sega ni vunitaka rawa. Ena ca na lomadra! Ni ra sa vakacacani ira
  vakataki ira.\\n10 \\\"Tukuna vua sa yalododonu ena yaco vei ira na vinaka, ni ra
  na kania na vua ni nodra bula.\\n11 Ena ca vei koya sa i valavala ca! ena yaco ga
  vua na leqa, na i sau ni veika e cakava na ligana ena saumi lesu tale vua.\\n12
  Ira ga na gone era vakasaurarataki ira na noqu tamata, kei ira na yalewa era lewai
  ira. Oi kemudou na noqu tamata o ira era tuberi kemudou, era vakacalai kemudou ka
  vakacacana na nomudou sala.\\\"\\n13 Sa tucake o Jiova me vukei ira ka tucake talega
  me na lewai ira.\\n14 O Jiova ena curuma yani na veilewai vei ira na qase ni Nona
  tamata kei ira na ravouvou; \\\"Ni do''u sa kania oti na loga ni vaini; kei na i
  yaya sa kau mai vei ira na dravudravua sa maroroi tu ena nomudou vei vale.\\n15
  Cava na kena i balebale e buturaki kina o ira na Noqu tamata ka butuqaqia na matadra
  na dravudravua?\\\" Sa tukuna o Jiova ni lewe vuqa.\\n16 Sa tukuna talega o Jiova:
  \\\"Ni ra sa qaciqacia na goneyalewa ni Saioni ka ra vakateqateqa nodra i lakolako
  ka sa veirawai na matadra, ka ra lako tu me vaka era titeqe, ka tataqiriqiri tu
  na vesa ni yavadra,\\n17 O koya ena lewa kina na Turaga me tubura na buradeladra
  na goneyalewa ni Saioni na karokaro, ka na vakaluvaiwaletaki ira o Jiova.\\\"\\n18
  Ena siga o ya ena luvata tani o Jiova na nodra i ukuuku lagilagi; kei na i ubi ni
  drau ni uludra kei na nodra i taube makuwaliliva;\\n19 Na sau ni daligadra, na qato,
  kei na i ubi ni mata;\\n20 Na i ubi ni ulu, na qato ni yava, kei na i vesu ni ulu,
  na kato ni ka boivinaka, kei na i vakaboi vinaka,\\n21 Kei na mama; na sau ni ucu,\\n22
  Na i sulu vaka i ukuuku, sulu taube, sulu sole, na baosi,\\n23 Na iloilo, na i sulu
  lineni matailailai, na i sala, kei na i ubi levu.\\n24 Ena yaco na i boi totoka
  sa i sosomi ni boi drulua, na i vau totoka, sa i sosomi ni dali; na ulu tali vakamaqosa,
  sa i sosomi ni ulu pori; na i ubi levu totoka, sa i sosomi na taga; na mata totoka,
  sa i sosomi ni mata mawe ni mavoa.\\n25 Nomu tagane era na bale ena i sele, kei
  ira na nomu tamata qaqa ena i valu.\\n26 Era na tagi kei na tagiyaso ena nomu matamata
  ni koro, era na dabe kina qele ni sa lala tu.\\nChapter 4\\n1 Ena gauna o ya ena
  lewe vitu na yalewa e ratou na taura e le dua na tagane, ka tukuna, \\\"Keitou na
  kania na neitou kakana ka daramaka na neitou i sulu; ia me keitou vakatokai ga ena
  yacamu, me kau tani kina na neitou i rogorogo.\\\" 2 Ena siga o ya na Coke i Jiova
  ena rairai vinaka ka serau; na vuata ni vanua ena matua vinaka ka bobota, me kedra
  na Isireli era dro bula. 3 Ia ena yaco mai na gauna o koya e tiko laivi mai Saioni
  kei koya ka tiko mai Jerusalemi, ena vakatokai me savasava\u2014kei ira kece era
  volai vata kei ira e bula tiko mai Jerusalemi. 4 Na Turaga ena qai savata laivi
  na nodra dukadukali na goneyalewa ni Saioni, ka vuya tani na dra mai na loma ni
  koro, ena yalo turaganilewa dodonu kei na yalo e caudre tu, 5 Ena bulia o Jiova
  ena vanua cecere mai Saioni me i tikotiko tudei, mai cake na i soqosoqo levu na
  o kei na kubou ena siga kei na rarama ni bukawaqa caucaudre ena bogi. Ena veivakarurugi
  tiko e kea na i serau. 6 Ena dua na vale vakacevaceva ena i vakaruru tiko ena gauna
  ni siga mai na katakata, e dua na vanua me i drodro mai na cava kei na uca.\\nChapter
  5\\n1 Me''u lagasere mada vua na noqu Daulomani na sere baleti Daulomani ena vuku
  ni nona loga ni vaini: na were ni vaini nei koya na noqu Daulomani e tiko ena dua
  na delana bulabula.\\n2 E kelia vinaka ka biuta tani na vatu ka tea kina na vaini
  vinaka sara, ka tara e dua na vale cecere e loma, a sa kelia kina na i keli waini;
  ka sa qai nuitaka me vua mai kina na vaini vinaka, sa qai vuataka mai na vaini ca.\\n3
  \\\"Ia oqo oi kemudou na kai Jerusalemi kei na tamata i Juta, dou lewa mada mai
  vei au kei na noqu loga ni vaini.\\n4 A cava tale me caka ena Noqu loga ni vaini
  ka''u a sega ni cakava kina? Na cava Ni''u nuitaka me vuataka na vaini vinaka, sa
  qai vuataka tu na vaini ca?\\n5 Oqo ka''u na tukuna mada vei kemudou na ka Au na
  kitaka kina noqu loga ni vaini: Au na kauta tani na kena veiwa dautubu tu i sau
  me na qai kama; me basuki na kena bai me qera sobu.\\n6 Au na biuta me i benubenu
  ena sega ni samaki se vakatoroicaketaki, me na tubura na kau votovotoa kei na soni.
  Au na qai vakarota na o me kakua ni tauca mai na uca.\\\"\\n7 Ni sa loga ni vaini
  i Jiova ni lewe vuqa na mataqali i Isireli, kei na tamata i Juta era nona kau talei.
  Sa qara na lewa dodonu, ia na veivakararawataki; sa qara na bula dodonu raica sa
  rogoci ga na tagi ni veivuke.\\n8 Ena ca o ira era veisematitaka na vale kina dua
  tale na vale; ka kuria na teitei kina teitei, me yacova ni sa sega ni dua na vanua
  e vo ka okati me ra qai tiko yadua ena loma donu ni vanua!\\n9 E rogoca tiko na
  daligaqu ni vosa tiko o Jiova ni lewe vuqa, \\\"E dina e vuqa na vei vale ena lala,
  na veivalevale lelevu totoka ena sega e dua me vakatawa.\\n10 Na loga ni vaini e
  tini na eka ena rawata ga e dua na ka lailai, kei na kaburaki ni vuqa na sore ni
  tei ena takiveiyaga sara ena rawa mai.\\\"\\n11 Era na ca o ira sa souta na gunu
  yaqona ena mataka caca ka bogicaka me yacova ni ra sa mateni ena waini!\\n12 Ia
  na api kei na wai ni vakatagi na tiberieli kei na bitu ni vakatagi, kei na waini
  sa ka ni nodra soqo; ia na cakacaka i Jiova era sega ni bau kauwai kina, kei na
  veika e cakava na ligana me ra wilika.\\n13 O koya oqo era na kau vakabobula kina
  na noqu tamata, ni sa sega vei ira na kila ka; nodra vei Turaga era na viakana kei
  na nodra lewe vuqa era na karamaca ena via gunu wai.\\n14 O koya oqo sa vakalevutaki
  koya kina o bulubulu ka dolava tu vakalevu na gusuna; na kedra totoka na nodra rogo
  na kedra lewe levu kei na marau ena ka wale era na tini taucoko kina.\\n15 Era na
  biu sobu na tamata, ka yaco me ra vakamalumalumutaki ira, kei na mata viavialevu
  ena malumalumu ga mai.\\n16 Ia ena vakacerecerei o Jiova ni lewe vuqa ena siga ni
  veilewai, na Kalou ena vakarokorokotaki ena dodonu savasava.\\n17 Na lami ena kana
  ena veico drokadroka na vulagi ena kania na vanua sa biu tani vakatikitiki.\\n18
  Ena ca o ira era kauta mai na i valavala ca ena wa ni lasu ka caka ca me vaka na
  dali dreta na qiqi;\\n19 Dou tukuna, \\\"Me totolo cake ka vakusakusataka na Nona
  cakacaka, meda raica; me toso mai ka lako mai, na lewe Dua Savasava ni Isireli me
  rawa nida qai kila.\\\"\\n20 Era na ca o ira era vakatoka na ca me vinaka kei na
  vinaka me ca; era tukuna sa rarama na butobuto ka butobuto na rarama; era tukuna
  sa kamikamica na ka gaga ka gaga na ka kamikamica!\\n21 Ena ca o ira sa bau nanuma
  ni ra vuku, ni ra kila tiko ni ra yaloqaseqase!\\n22 Ena ca o ira era daugunu waini
  tu ga vakasivia, kei ira na daulosea vata na waini,\\n23 Era vakadonuya na tamata
  ca me dua na kena i wase me nona, ka ra qai kauta tani mai vua na tamata dodonu
  na nona dodonu!\\n24 O koya oqo ena kama kina na vuni sila, ena yameyame ni buka
  ka sa yavu sara na co, ni sa caucaudre ena vuca sara vaka kina na wakadra, ia na
  sedra ena vuka cake me vaka na kuvu ni soso, baleta ni ra sa vakanadakuya na i vunau
  nei Jiova ni lewe vuqa, ka beca na vosa nei Koya na le Dua\\n25 O koya oqo sa waqa
  mai kina na cudru i Jiova vei ira na Nona tamata; ka dodo yani na ligana ka samuti
  ira, e yavavala na vei delana na yagodra sa vaka na soqosoqo ena loma ni gaunisala.
  Ni sa yaco tiko na ka oqo e sega ni oti tikoga na Nona cudru, se dodo tikoga na
  ligana vei ira.\\n26 Ena qai vakarewataka o Koya na kuila vei ira na matanitu tu
  vakayawa, ena qai kaluvi ira mai na i yalayala kei vuravura; ka raica era na vakusakusa,
  ka vakatotolo na nodra lako mai.\\n27 Ena sega ni dua vei ira me na malumalumu se
  bale se sosovu se moce; sega ni dua me na kasere na i vau ni tolona, se na nodra
  i vesu ni vava me cavuka;\\n28 Na nodra gasau e motomoto vinaka, ka sa vakarau tu
  na nodra dakai titi na nodra yava ni ose sa vaka mai na vatu qiwa, kei na nodra
  qiqi ni valu sa vaka na covulaca.\\n29 Na nodra rorogo ena vaka na laione, ena vaka
  na rorogo ni luve ni laione, io, era na tagi era na kudru ni ra sa toboka; era vakamareqeta
  vakavinaka, ni ra sa kauta ena sega ni dua me na bula.\\n30 Ena siga o ya sa na
  kacabote mai na domodra vakataki ira ga me vaka na rorogo ni vadugu ni ua mai wasawasa,
  kevaka me dua e qai rai mai kina vanua, ka raica, na butobuto kei na rarawa; ka
  sa vakabutobutotaki na rarama ena o.\\nChapter 6\\n1 Ena yabaki sa mate kina o Usaia
  na Tui, ka''u a raica na Turaga ni sa tiko ena i tikotiko vaka Turaga, sa cecere
  ka toka sara ki cake, a sa robota na vale ni Soro na Nona i tini yara.\\n2 Era sa
  tucake vua o ira na Serafimi; o ira yadua era yaono na tabadra e rua sa tabonaka
  kina na matana, e rua sa tabonaka kina na yavana, ka rua sa vuka yani kina.\\n3
  E dua e kailavaka vua tale e dua ka tukuna e dodonu, \\\"E dodonu, e dodonu, o Jiova
  ni lewe vuqa; sa vakasinaita tu na vuravura taucoko na Nona i serau!\\\"\\n4 A sa
  yavavala na duru ni katuba ena domo i Koya sa kaci mai, ka sa solega tu na vale
  na kubou.\\n5 Au a qai tukuna: \\\"O cei oi au, ni''u tamata ca! ni''u sa tamata
  tebe ni gusu qeleqelewa, au sa tiko vata talega kei ira na tamata tebenigusu qeleqelewa;
  na mataqu sa qai raica na Tui, o Jiova ni lewe vuqa.\\\"\\n6 E dua vei ira na Serafimi
  sa qai vuka mai vei au, sa taura tiko e ligana e dua na tiki ni koala sa waqa tu
  ena kena i tautauri mai na i cabocabo ni soro.\\n7 Sa qai vakatara ki gusuqu, ka
  tukuna: \\\"Raica, sa tara yani oqo na tebenigusumu; sa kautani na nomu cala kece,
  sa bokoci talega na nomu i valavala ca.\\\"\\n8 Au sa qai rogoca talega na domo
  ni Kalou, ni sa tukuna: \\\"O cei Me''u tala, o cei me lako ena vuku i Keitou?\\\"
  Au a qai tukuna, \\\"Oi au oqo! Ni talai au.\\\"\\n9 Sa qai tukuna mai, \\\"Lako,
  ka tukuna vei ira na tamata oqo: ''Dou sa daurogoca tikoga, ka sega ni bau kila;
  dou sa dauraica tikoga ka sega ni kunea.''\\n10 \\\"Mo vaqataka na yalodra na tamata
  oqo, kei na daligadra me bibi ni rogoca, ka sogota na matadra, de qai rai na matadra,
  ka rogo mai na daligadra, ka kila mai na yalodra, ka vuki mai me ra sa vakabulai.\\\"\\n11
  Au a qai tukuna, \\\"Kemuni na Turaga, cava na kena dede?\\\" Sa qai sauma mai:
  \\\"Me yacova sara ni sa lala na koro me sega ni dua e tawana, me sa lala talega
  na vei vale, kei na vanua me sa vakanomodi,\\n12 O Jiova sa vakatikitikitaka tani
  na tamata kina dua na vanua yawa sara, ena levu na vanua vei ira e loma ena lala
  me veikau wale tu ga.\\n13 Ia na kena i katini ena vo tu kina, era na lesu mai me
  vakarusai me vaka na paini kei na oki ni sa vakadavori sobu ena bula tikoga na vuna.
  Na kena tubu na vuna ni tubu kina na sore ni kau tabu savasava.\\\"\\nChapter 7\\n1
  A sa yaco na gauna i Easi na luve i Jocame, na luve i Usaia, na tui Juta, ni rau
  sa qai lako cake ki Jerusalemi, o Risina na tui Siria kei Peka na luve i valuta,
  ka dredre ni rawati.\\n2 A sa tukuni kina mataqali i Tevita, ka vaka, \\\"Na mataivalu
  i Siria sa vakarau tiko mai Ifereimi.\\\" Ka sa yavala kina na yalona kei na yalodra
  na nona tamata me vaka na suaigelegele ni kau ena loma ni veikau ni sa liwava yani
  na cagi.\\n3 Sa qai vosa vei Aisea o Jiova, \\\"Mo lako sara ga oqo mo sota kei
  Easi, o iko kei luvemu o Siariyasupi, kina i drodro ni wai mai cake, ena gaunisala
  ena nodratou vanua na dausava i sulu,\\n4 \\\"Ka tukuna vua: ''Kua ni rere, mo tiko
  malua; vakacegu ga kua ni vakadatuvutaki rau ni rau sa vakarau kama yavu ena nodratou
  cudru katakata o Risina kei Siria, kei na luve i Rimalaia.\\n5 ''Baleti Siria, o
  Ifereimi, kei na luve i Rimalaia e ratou sa bukia tiko na vere baleti iko, ka tukuna,\\n6
  \\\"Me datou lako cake mada ki Juta ka vakatotogana, me datou basuka na kena bai
  me rawarawa vei kedatou, me datou bulia e dua na tui me luve i Tapeli\\\"\u2014\\n7
  ''Sa tukuna na Turaga o Jiova: \\\"Ena sega ni rawa ni na tucake, se yaco.\\n8 Ni
  sa ulu i Siria ga o Tamasiko, ka ulu i Tamasiko o Risina. Ena loma ni onosagavulukalima
  na yabaki ena musuki O Ifereimi, me kakua ni dua na matanitu.\\n9 Na ulu i Ifereimi
  o Samaria, ka ulu i Samaria na luve i Rimalaia. Kevaka do''u na sega ni vakadinata,
  ena sega dina sara ga ni dou na vakataudeitaki.\\\"''\\\"\\n10 Baci vosa tale vei
  Easi, o Jiova ka tukuna,\\n11 \\\"Taroga mada e dua na i vakatakilakila me baleti
  iko vei Jiova na nomu Kalou; mo taroga kina e dua na tikina e ra se dua na vanua
  cecere.\\\"\\n12 Ia sa qai sauma o Easi, \\\"Au na sega sara ni kerea, se vakatovolea
  na Kalou!\\\"\\n13 Sa qai tukuna, \\\"Rogoci au, na mataqali i Tevita! E sega ni
  dua na ka tu ga vei kemudou mo do''u dau vakaoca na tamata, ia do''u sa baci vakaoca
  talega na Kalou?\\n14 \\\"O koya oqo o Jiova ga ena solia vei kemudou e dua na i
  vakatakilakila: Ka raica, ena dua na goneyalewa sega cala, ena yaco me kunekune
  me na vakasucuma e dua na Gonetagane, ena vakayacani Koya o Imanueli.\\n15 \\\"Na
  bata kei na o ni ena kania o Koya ni sa kila me biuta na ka ca ka digitaka na ka
  vinaka.\\n16 \\\"Ia ni bera ni kila o Koya na gone me biuta na ka ca ka digitaka
  na vinaka, na vanua do''u rerevaka ena qai vakalala na tui e rua.\\n17 \\\"Ena kauti
  tui Asiria mai vei kemuni o Jiova kei ira na nomuni tamata kei na vale nei tamamuni\u2014na
  gauna e se bera vakadua ni yaco vaka kina mai na siga sa lako tani kina mai Juta
  o Ifereimi.\\\"\\n18 Ena qai yaco dina na siga o ya ena qai kaluva o Jiova na lago
  ka tiko sara ena sovuna mai na uciwai mai Ijipita, kei na pi ka tiko mai na vanua
  o Asiria.\\n19 Era na lako mai ka mai tiko kece ena vei buca sa lala kei na qara
  ni vei vatu, kei na kau vakavotona kece kei na veico drokadroka vinaka.\\n20 Ena
  siga vata tikoga o ya ena ia na vei toro o Jiova, ena i toro sa voli mai ena tai
  kadua ni Uciwai, kei ira vata tukuna kei tui Asiria, na qavokavoka kei na vuti ni
  yava, ena toro laivi talega na kumi.\\n21 Ena yaco ena siga o ya ena dua na tagane
  ena maroroya me bula e dua na bulumakau yalewa kei na rua na sipi;\\n22 Ena vuku
  ni vakaitamera ni sucu e solia sa yaco kina na kana bata; ni bata kei na o ni era
  na kania o ira kece se vo tiko ena vanua.\\n23 Na ka ena yaco ena siga o ya, na
  vanua kece e tu kina na vaini e udolu e na kena i sau e udolu na sikeli siliva,
  ena yaco ga me veikau osooso ka votovotoa.\\n24 Ena dakai titi kei na kena gasau
  era na lako kina na tamata, ena vuku ni sa veikau osoosoi tu ka votovotoa.\\n25
  Ena vei delana daulakovi tu e liu sa na dredre ni lakovi baleta na kau votovotoa
  kei na osooso ni veikau sa bula tu kina; e sa na yaco me bai ni bulumakau kei na
  vanua ni vakana sipi.\\nChapter 8\\n1 Sa baci vosa tale vei au o Jiova, \\\"Mo taura
  e dua na i vola vivigi levu, mo taura mai vua e dua na tamata na peni ka vola kina
  na ka e baleti Measalali-asi-pasi.\\n2 \\\"Au na taura mai e lewe rua na tamata
  yalodina me vakadinadina ni tukutuku, o Uraia na bete kei Sakaraia na luve i Jeperekaia.\\\"\\n3
  Au a lako vua na parofita yalewa ka yaco me kunekune ka vakasucuma e dua na gonetagane.
  Sa qai tukuna vei au o Jiova \\\"Mo vakayacani koya o Measalali-asi-pasi;\\n4 \\\"Ni
  sa bera ni yacova na gone me kila na duidui ni ka ena nona kila ka me kaci ''tamaqu
  se tinaqu'', ena kautani rawa mai Tamasiko na nona i yau talei kei na i toki ni
  valu e rawata o Samaria me kauta o tui Asiria.\\\"\\n5 Sa baci vosa tale vei au,
  o Jiova ka tukuna:\\n6 \\\"Ni ra beca tiko na waidrodro malua o Sailoa o ira na
  tamata oqo, ka ra marautaki Risina kei koya na luve i Rimalaia;\\n7 Ia oqo, Raica,
  na Turaga ena kauta cake mai na wai ni Uciwai, sa kaukauwa ka kuiOna tui Asiria
  ena nona i ukuuku kece; ena tubu cake na wai oqo ena bati ni uciwai me tabale yani
  ki vanua.\\n8 Ena lako curumi Juta, ena luvuci ka vuabale sara ki domodra; ni sa
  dedeka na tabana ena tara na mua ni vanua e dua kei na mua ni vanua ka dua, Isa
  Imanueli.\\n9 \\\"Dou lialiaci mada, oi kemudou na tamata dou kavoro mada ena yalo
  e raramusumusu! Dou rogoca mada oi kemudou na tu yawa yani. Dou vauci kemudou vakaukauwa,
  ia dou kakavorovoro mai dou vauci kemudou, dou kakavorovoro mai.\\n10 Dou bose vata
  mada, ena sega ni vakavotukana e dua na ka; vunautaka na vosa, ena sega ni kaukauwa
  ni sa tiko kei keda o Jiova.\\\" Rerevaka Na Kalou Ka Muria Na Nona Vosa\\n11 Sa
  bikai au na liga kaukauwa i Jiova ni vosa vei au, ka vakasalataki au me''u kua ni
  muria na nodra sala na tamata, ka vaka:\\n12 \\\"Dou kua ni tukuna na buki vere,
  ni ra sa tukuna tiko na tamata na ''buki vere'', dou kua ni rerevaka na nodra veivakarerei,
  kua ni dou via lomaleqa kina.\\n13 O Jiova ni lewe vuqa, sa i Koya mo dou doka sa
  i Koya ga mo dou rerevaka tiko, o Koya me vuni nomudou taqaya.\\n14 O Koya me na
  vale tabu ni Kalou, na vatu me ra tarabe kina kei na vatu levu sara me ra daubale
  kina na mataqali ruarua i Isireli, me kedra dai me coriti kina o Jerusalemi.\\n15
  Ena levu vei ira era na tarabe kina, me ra bale sobu ka ramusu.\\\"\\n16 Mo kumuna
  vata me dua na kena i tukutuku tudei, ka dregata sara na vunau me nodra na noqu
  tisaipeli.\\n17 Au na qai waraki Jiova, o Koya sa tabonaka na matana mai na mataqali
  i Jekope; au na qai nuitaki Koya tiko.\\n18 Sa tu oqo oi au kei ira na gone sa solia
  mai vei au o Jiova! Keimami tu eke me vakatakilakila kei na veivakurabutaki levu
  e Isireli mai vei Jiova ni lewe vuqa o Koya sa tiko mai na Ulunivanua o Saioni.\\n19
  Ena gauna era vosa kina vei iko, \\\"Dou a vakasaqara na daurairai kei na dauviacakamana
  lasulasu, me ra vakasolokakana.\\\" Me kua ni dua na tamata me vakasaqara na nona
  Kalou? E dodonu li vei ira me ra tarogi ira na mate ena vukudra na bula?\\n20 Mai
  na vunau se kina i tukutuku maroroi! kevaka e dua vei ira e vosa ka sega ni salavata
  kei na i tukutuku e rua oqo, baleta sara ga ni sa sega na rarama vei ira.\\n21 Era
  na lako curuma yani na veivakararawataki kei na viakana; ena gauna e ra sa viakana
  kina, era na qai cudruva ka vosavakacacataka na nodra Tui kei na nodra Kalou, e
  ra na rai ki cake.\\n22 E ra na rai sobu talega ki vuravura, e ra na raica na rarawa
  kei na butobuto, kei na nuiqawaqawa; era na qai vakatalai tani kina butobuto.\\nChapter
  9\\n1 Ena sega ni yaluma tiko o Koya se kune rarawa, me vaka sa beci e liu o Koya
  mai na vanua o Sevuloni kei na vanua o Navitalai, ia ena tabaki sobu na kena totoka
  ena gauna mai muri na yasayasa vakawaitui, na bati ni Joritani o Kaleli ni veimatanitu
  tani.\\n2 O ira na tamata era lako tiko ena butobuto era na raica na rarama levu;
  o ira era tiko ena buca ni yaloyalo ni mate, ena cilavi ira na rarama.\\n3 O ni
  sa vakatubura na i wiliwili ni matanitu ka tosoya cake na nodra reki, e ra veimeketi
  e Matamuni me vaka na reki ni tatamusuki, ka vaka talega ni ra dauwasea na i toki
  ni valu.\\n4 O ni musuka sobu na nona i colacola bibi kei na ka kece e dreketa voli,
  na nona i vua, me vaka na siga i Mitiani.\\n5 Na nodra i vava kece ni valu o ira
  na tamata i valu, ena i valu e rogo levu wale tu ga, kei na i sulu e tauva tu na
  dra, ena vakayagataki me vakawaqa ni buka ena vanua me vakamai kina.\\n6 Ni sa sucu
  mai e dua na Gone me noda, sa soli mai vei keda e dua na Gonetagane, ena tu ena
  ligana na kaukauwa ni matanitu, na Yacana ena vakatokai o ai Qoroqoro, na Daunivakasala,
  na Kalou Kaukauwa, na Tama ni Gauna Sega ni Mudu, na Ravouvou ni Sautu.\\n7 Ena
  tubu cake tikoga na Nona matanitu kei na sautu me sega ni oti rawa ena i dabedabe
  vaka tui i Tevita, kei na Nona matanitu ena vakamaucokonataka ka vakadeitaka ena
  lewa dodonu, kei na i valavala dodonu, ena veisiga ni mataka kei na veigauna e se
  bera mai, na gugumatua i Jiova ni lewe vuqa ena vakayacora na ka oqo.\\n8 Na vosa
  me saqati kina o Jekope ka sa lutuki ira na Isireli mai vei Jiova.\\n9 E ra na qai
  kila kina na tamata taucoko\u2014o Ifereimi kei ira na kawa i Samaria\u2014era cavuta
  na nodra dokadoka kei na loma e kaukauwa:\\n10 \\\"Sa qeqera sobu na vatu buli,
  ia eda na tara vou tale ena vatu sivi, na sikamoa sa musu sobu, ia eda na vakasosomitaka
  ena sitari.\\\"\\n11 O Koya oqo o Jiova ena vakarautaka na meca i Risina me valuti
  ira, ka na uqeti ira talega na meca,\\n12 O ira na kai Siria mai liu o ira na Filisitia
  mai muri e rau na tilomi Isireli. Ena sega kina ni muduki na nona cudru, ni sa dodo
  tikoga yani na ligana.\\n13 O ira na tamata era sega ni bau via vuki lesu vei koya
  e vakararawataki ira, se goleva me vakasaqarai Jiova ni lewe vuqa.\\n14 O koya oqo
  ena musuka laivi na uludra kei na buidra na Isireli o Jiova, na taba ni niu kei
  na taria ena dua ga na siga.\\n15 O ira na qase kei ira na Turaga, sa ira oqo na
  uludra; o ira na parofita ka vakavuvulitaka tiko na lasu, sa ira oqo na buidra.\\n16
  O ira na vei liuliu ni tamata oqo ka vakavuna tiko me ra cala, kei ira e ra liutaki
  tiko mai vei ira era na vakarusai taucoko.\\n17 O koya oqo o Jiova ena sega ni rekitaki
  ira tiko na nodra cauravou, ena sega talega ni yalololoma tiko vei ira na luveniyali
  kei na yada; ni ra sa dauveivakaisini taucoko ka bula dukadukali, na gusudra sa
  cavuta na vosa rogo vakasisila. Na veika kece oqo sa sega ni yali tikoga kina na
  Nona cudru, ka se dodo tikoga na Ligana.\\n18 Ni sa waqa mai na i valavala ca me
  vaka na buka; ena kania na kau vakavotona kei na soni, ena vakacaudreva na veikau
  loa ka na kuvu cake me vaka na o kubou.\\n19 Sa kama na vanua ena Nona cudru o Jiova
  ni lewe vuqa, o ira na tamata e ra na vakawaqa tale ni buka; ena sega ni dua me
  maroroya rawa na tacina.\\n20 Ena taura vakaukauwa na ligana i matau ena yaco na
  via kana; ena vakayagataka na ligana i mawi ena sega ga ni mamau rawa; era na dui
  kania yadua na lewe ni ligana.\\n21 Ena tarai Ifereimi o Manasa, o Manasa vei Ifereimi;
  rau ruarua oqo rau a saqati Juta. Na veika oqo ena sega ga ni oti kina na cudru
  i Jiova, ka na dodo tikoga na ligana.\\nChapter 10\\n1 \\\"Ena ca o ira sa vakatura
  na lawa sa sega ni dodonu, ka vola na ka veilecayaki era sa lesia\\n2 Me butakoca
  na dodonu nodra na dravudravua ka kauta tani na nodra dodonu na vakaloloma mai vei
  ira na Noqu tamata, ena tauri na nodra i yau na yada, e ra na qai butakoca talega
  na luveniyali.\\n3 Na cava dou na cakava ena siga ni veicudruvi, kei na veivakarusai
  sa lako tiko mai vakayawa? Dou na dro vei cei mo dou bula? Dou na solia vei cei
  na ka dou lagilagi tiko kina?\\n4 Ni''u na yali vei ira era na cuva vei ira na tauri
  vakabobula, e ra na bale vata kei ira na vakamatei\\\" na veika oqo ena sega ga
  ni oti na cudru i Jiova, na Ligana e se dodo tikoga vei ira.\\\"\\n5 \\\"O iko Asiria
  na i titoko ni noqu cudru na i wau ena ligadra sa noqu cudru waqawaqa.\\n6 Au na
  talai koya kina dua na matanitu ca, kivei ira na tamata sa tiko kina na noqu cudru,
  Me''u na vakaroti koya me kovea ka tokitaka ka buturaki ira sobu me vaka na qele
  dada ni butuka na tamata ena gaunisala.\\n7 Ia o koya ena sega ni nanuma me vaka
  kina, ka sa sega ni kena i naki ni lomana; sa lomana ga me ia na veivakarusai, ka
  vakaotia eso na matanitu.\\n8 Ni sa tukuna, ''E sega beka ni ra tu e keri o ira
  na ravouvou?\\n9 Sa sega ni vakataki Kisimisi o Kalino? Sa sega ni vakataki Apati
  o Emaci? Sa sega ni vakataki Tamasiko o Samaria?\\n10 Me vaka sa kunea na ligaqu
  na nodra matakau na veimatanitu, na nodra matakau ceuti sa roboti Jerusalemi kei
  Samaria,\\n11 Me vaka au sa vakarusa na nodra matakau mai Samaria, au na sega beka
  ni vakarusa talega na nodra matakau mai Jerusalemi?\\\"''\\n12 Ni sa qai yaco sara
  na kena gauna, ena Nona vakayacora na Nona cakacaka kece o Jiova ena ulunivanua
  o Saioni, sa qai tukuna, \\\"Au na cudruva talega na yalo vatu ni tui Asiria, kei
  na viavialevu ni matana.\\\"\\n13 Ni sa tukuna o koya; \\\"Ena kaukauwa ga ni ligaqu
  au sa rawata na ka oqo, ni''u sa yalomatua ni''u sa tosoya laivi na yalayala ni
  tamata, ka butakoca na nodra i yau talei; me vaka e dua na qaqa, ni vakamalumalumutaki
  ira na lewe ni vanua.\\n14 Ia na ligaqu sa taura na nodra i yau talei na tamata
  me vaka e dua sa kumuna vata na yaloka sa biu tu, Au vakasokumuni vuravura taucoko;
  ka sega ni bau dua mada ga me bau yavalata na tabana, se dua me dalaga me vosa,
  ka sega mada ni dua me bau irova mai.\\\"\\n15 Sa bau dokai koya mada na matau vei
  koya e vakayagataka? Se na ivaro me dokai koya vei koya e varovaro? Se na i titoko
  vua sa laveta cake, se vaka na i wau me dokai koya ni vakaduri cake ni o koya e
  kau ga!\\n16 O koya oqo o Jiova ni lewe vuqa, ena vakatalai ira na suivotu ena kedra
  maliwa na levulevu sivia; ena rukuna na Nona ka lagilagi ena vakawaqaca na buka
  me bukawaqa caucaudre.\\n17 Ena yaco na nodra Rarama na Isireli me bukawaqa kei
  Koya na le dua Yalosavasava me yameyame ni bukawaqa; ena waqa ga ka na vakama yavu
  na kau votovotoa kei na soni ena dua ga na siga.\\n18 Ena vakama yavu o Koya na
  kena vinaka ni veikau kei na nona veiwere bulabula na yalona kei na yagona; ena
  vaka ni sa suivotu mai e dua sa tauvimate.\\n19 Na i vovo ni kau ena nona veikau
  ena lailai sara na kena levu e dua mada ga na gone e rawa ni vola na kena i wiliwili.
  Na Kena Vo Vei Ira Na Isireli Era Lesu Bula\\n20 Ena yaco ena siga o ya o ira na
  lewe vica ni Isireli, kei ira na mataqali i Jekope, e ra dro bula e ra na sega ni
  vakararavi tale tiko vei koya e vakararawataki ira, e ra na vakararavi vakaidina
  ga vei Jiova, na Le Dua Yalosavasava e Isireli.\\n21 Na lewe vica i Jekope ka ra
  lesu mai Vua na Kalou Kaukauwa.\\n22 Kevaka ena vaka na nuku ni wasawasa o ira na
  noqu tamata na Isireli, ena lesu ga mai na vica e vo, ia na kawa boko sa lesi me
  yaco ena rairai levu kina na kena caka vakadodonu.\\n23 O Jiova ni lewe vuqa ena
  kitaka ga na ka e nanuma e vuravura taucoko.\\n24 O koya sa tukuna kina o Jiova
  ni lewe vuqa; \\\"Oi kemudou na noqu tamata, ka tiko e Saioni, dou kakua ni rerevaki
  Asiria. Ena samuti iko ena i titoko ka laveta vei iko na nona i wau, me vakataki
  ira na kai Ijipita.\\n25 \\\"Ena vakalailai sara sa na oti na Noqu cudru katakata
  ena nodra rusa.\\\"\\n26 O Jiova ni lewe vuqa ena uqeta na veivakanakuitataki me
  vaka na nodra moku na kai Mitiani ena vatu levu mai Orepi, na Nona i titoko ena
  vakatauca ena dela ni wasawasa, ena dodoka tale o Koya me vaka mai Ijipita.\\n27
  Ena siga dina o ya na na nona i colacola ena luvati tani mai ena vatuvatu ni tabamu,
  kei na nona i vua mai na domomu, kei na i vua ena vakarusai ena vuku ni veilumuti.\\n28
  Sa lako mai o koya ki Aiaci, sa lako yani ki Mikironi, sa laiva tu yani ki Mikimasi
  na nona i colacola.\\n29 Era sa sivia na tadrua ni veivatu, era sa moce ki Kepa,
  ni sa rere o Rama, e ra sa dro ki Kipea na koroi Saula.\\n30 Mo qoqolou, na goneyalewa
  ni Kalimi! Mo vakarogoca Leisi\u2014Isa o Anacoci!\\n31 Sa dro o Matimena, o ira
  na kai Kepemi era sa vaqara bula.\\n32 Sa bogi dua ga mai Nopi o koya; ena qai kureitaka
  na ligana ena ulunivanua nodra na goneyalewa ni Saioni mai na delana o Jerusalemi.\\n33
  Raica na Turaga o Jiova ni lewe vuqa, ena tamusuka vakaukauwa vakaidina na tabana,
  ena taya sobu na ka kecega na viavialevu ena vakamalumalumutaki sobu.\\n34 Ena taya
  sobu o Koya na kau ni veikau ena matau, o Lepanoni e na vakabalei mai Vei Koya na
  Kaukauwa.\\nChapter 11\\n1 Ena tubu mai e dua na Coke mai na dulumi i Jese, ka na
  tubu cake mai na wakana e dua na Tabana.\\n2 Ena tikoga Vua na Yalo i Jiova na Yalo
  ni matua kei na lewa dina, na Yalo ni vakavuvuli kei na kaukauwa kei na Yalo ni
  daukila ka kei na rerevaki Jiova.\\n3 Na Nona vu ni reki e tiko ena nona rerevaki
  Jiova, ena sega ni lewa o Koya me vaka na ka sa rairai walega, se vunauca na ka
  me vaka na ka sa rogoca e daligana;\\n4 Ia, ena lewai ira vakadodonu na dravudravua,
  ka lewa vakadodonu ena vukudra na yalomalumalmu e vuravura; ena samuti vuravura
  e na i titoko ni gusuna ia ena i cegu ni tebenigusuna ena vakamatei ira na i valavala
  ca.\\n5 Ena kena i vau ni tolona na yalododonu, kei na yalodina.\\n6 \\\"Na wolifa
  ena duavata ka tiko vata kei na lami, ka na davo vata na lepate kei na luve ni me,
  ena tiko vata talega na luvedratou na bulumakau kei na laione; kei na manumanu uro
  ena tuberi iratou ga e dua na gone lailai.\\n7 Ena kana vata na bulumakau kei na
  pera; ena davo sobu vata na luvedra; na laione ena kania na co sila me vaka na bulumakau.\\n8
  Na gone se qasiqasi ena qito voli ena loma ni qara ni kobara, ena biuta na ligana
  na gone sa kali ena qara ni gata paisoni.\\n9 Era na sega ni vakamavoataki se vakacacani
  ena Noqu ulunivanua tabu kecega, ni na yaco o vuravura me vakasinaita na i serau
  i Jiova me vaka sa ubia na wasa liwa na wai.\\n10 \\\"Io ena siga o ya ena dua na
  Coke i Jese, ena tu me i vakaraitaki vei ira na vei mataqali, o ira na vei Matanitu
  tani e ra na vakasaqarai Koya kei na Nona i vakavaka cegu ena qai serauni.\\\"\\n11
  Ena yaco ena siga o ya e na baci dodoka tale vakarua na ligana o Jiova, me vakabulai
  ira na kena vo ni nona tamata e ra se vo tiko mai Asiria kei Ijipita, mai Pacirosi
  kei Kusa kei Ilama, Saina kei Emaci kei na veiyanuyanu mai wasawasa.\\n12 Ena vakarautaka
  o Koya e dua na drotini vei ira na vei matanitu, ka vakasoqoni ira vata na Isireli
  e ra tu ena boto ni tuitui, ka na vakasoqoni ira vata na Juta ka ra veiseyaki tu
  ena tutu vava kei vuravura.\\n13 Ena takali talega na loma ca nei Ifereimi, ena
  sega talega ni vakararawataki Ifereimi o Juta.\\n14 Ia e rau na vakavukaca kina
  ra na nodra i yalayala na kai Filisitia; rau na lomavata me rau vakacataki ira mai
  na Tokalau; e rau na tarai Itomi kei Moapi; ka ra na talairawarawa vei rau o ira
  na luve i Amoni.\\n15 Ena vakarusa o Jiova na toba ni wasawasa o Ijipita; ena Nona
  cagi kaukauwa ena qai laveta kina na ligana ena Uciwai, ka na samuta me vitu na
  kena i drodrodro, ka kauti ira yani na tamata ka me sega ni dua me bau suasua na
  yavana.\\n16 Ena dua na gaunisala vakarautaki totoka me baleti ira na i vovo ni
  Nona tamata ka ra biu tu mai Asiria, me vaka vei ira na Isireli ena siga e ra a
  lako cake tani mai kina ena vanua o Ijipita.\\nChapter 12\\n1 Ena siga dina o ya
  o na qai tukuna: \\\"I Jiova, au na qai vakavinavinaka vei Kemuni:, e dina o ni
  a cudruvi au, na Nomuni cudru sa yali tani yani, o ni sa qai vakacegui au. 2 Raica,
  sa noqu i vakabula na Kalou o Jiova, au na vakararavi tiko ka sega ni rere; ni sa
  vuni noqu kaukauwa o Jiova ka vuni noqu sere '' O YAWE, o Jiova, ka sa yaco me noqu
  i Vakabula.\\\"'' 3 O koya oqo ena reki ni dou na takiwai Mai na mata ni wai bula.
  4 Ena siga o ya dou na tukuna; \\\"Vakavinavinaka vei Jiova, dou kaciva na Yacana;
  vakatakila vei ira na lewe ni vanua na Nona cakacaka, ka kacivaka ni sa cecere na
  Yacana. 5 Dou sere vei Jiova ni sa cakava na ka e uasivi; me kilai yani na ka oqo
  e vuravura taucoko. 6 Dou kailavaka yani vakadomoilevu, na kai Saioni, ni sa levu
  ka cecere ena nomudou i tikotiko o Koya na Yalosavasava ni Isireli!\\\"\\nChapter
  13\\n1 Na vosa ni parofisai bibi nei Papiloni oqori ka raica o Aisea na luve i Emosi.\\n2
  \\\"Dou laveta cake na drotini ena ulunivanua cecere, dou tabalaka cake na domomudou
  vei ira; dou yaloyalo me raica na ligamudou ka curuma na nodra matamata ni koro
  na Turaga.\\n3 Au sa vakaroti ira, o koya Ka''u sa lumuta ia ka''u sa kacivi ira
  na Noqu qaqa e ra liga ni Noqu cudru o ira e ra marautaka na ka Ka''u na rogo kina.\\\"\\n4
  Na rorogo ni valu ni lewe vuqa ena ulunivanua, sa vaka e ra lewe vuqa! Na domo ni
  nodra ue sa soqona vata o Jiova ni Lewe Vuqa! Sa vakasoqoni ira vata na Nona mataivalu.\\n5
  E ra lako mai ena dua na vanua yawa, mai na i yalayala ni lomalagiOia o Jiova kei
  na i yaragi ni Nona cudru levu, me vakarusa na vanua taucoko.\\n6 Dou tagi vakararawa
  ni sa voleka na siga i Jiova! ena yaco me vaka na dauveivakarusai mai vei Koya sa
  Kaukauwa.\\n7 Ena malumalumu kina na ligadra kecega, ka waicala na yalo ni tamata
  kecega,\\n8 Ena qai yacovi ira na rere. Na yaluma kei na rarawa ena tarai ira; e
  ra na vaka na yalewa sa taratara; e ra dui kidacala e dua vua tale e dua; na matadra
  ena vaka na yameyame ni buka.\\n9 Raica, sa toro mai na siga i Jiova, sa tarava
  tiko mai na ka rarawa kei na cudru waqawaqa, me vakarusa na vanua, ena vaqeavutaka
  na kena tamata i valavala ca.\\n10 Era na sega ni cila mai na vei kalokalo kei na
  veikumukumuni tale eso me vaka na kena i vakarau; na matanisiga ena butobuto tu
  ga ni sa toso tiko, kei na vula ena sega talega ni cila mai.\\n11 \\\"Au na cudruvi
  vuravura ena vuku ni kena ca, kei na tamata caka cala ena vuku ni nodra i valavala
  ca, ka''u na muduka talega na nodra yalolevu o ira na dokadoka ka uruca sobu na
  nodra viavia Turaga o ira e ra dau via vaka rerevaki.\\n12 Au na cakava me dredre
  ka rawarawa na koula dina, ia me dredre e dua bau ga na tamata ka rawarawa na koula
  ni Ofiri.\\n13 Ia ka''u na vakayavalati lomalagi, o vuravura ena veitosoyaki mai
  na kena tikina, ena cudru levu i Jiova ni lewe vuqa ena siga ni Nona cudru waqawaqa.\\n14
  Ena vaka na teira sa vakacemuri kei na sipi sa sega ni dua me qarauna; e ra na dui
  lesu yadua na tamata vei ira na wekana, e ra na dui lesu kina nona vanua dina na
  tamata kecega.\\n15 O koya yadua sa tauri ena lausua mate, kei ira kece ena vesuki
  e ra na mate ena i selewau.\\n16 Na nodra gone ena basubasuraki vakalalai e matadra;
  na nodra vei vale ena yanaraki ka ra na yarataki na watidra.\\n17 \\\"Raica, au
  na uqeti ira na kai Mitia me kedra meca, e ra na sega ni kauwaitaka na siliva, ka
  ra na sega ni marautaka na koula.\\n18 A nodra dakai titi ena vakabalei ira na cauravou
  kina vatu me ra vurumemea, era na sega ni lomana na vua ni kete; ena sega ni loloma
  na matadra vei ira na gone.\\n19 o Papiloni, ka rogo vei ira na vei matanitu, na
  nodra lagilagi e ra dokai ira kina na kai Kalitia ena tautauvata kei Sotoma kei
  Komora na nona taura ka botolaka sobu na Kalou.\\n20 Ena sega ni tawani tale, ena
  sega tale ni tiko kina e dua nai taba tamata kina dua tale na taba tamata; ena sega
  ni birika mai kea na nona vale laca na kai Arapea, o ira talega e ra na sega ni
  vakadavora mai kea na nodra qele ni sipi.\\n21 Ena koto ga mai kea na manumanu kila
  ni veikau ena tawani na nodra veivale ena manumanu dautagi vakaloloma; ena tiko
  mai kea na luve ni Ositereji, na me kila e ra na qito kina.\\n22 Na wolifa ena tagi
  ena nodra vei vale, kei na koli ni veikau ena nona tikina vinaka, nona gauna sa
  roro mai, ena sega ni lokuyarataki na kena siga.\\\"\\nChapter 14\\n1 O Jiova ena
  qai lomani ira na Jekope, ka digitaki ira tale na Isireli, ka vakasukari ira lesu
  kina nodra vanua. O ira na kai tani e ra na la''ki tovata, kei ira ka kabiti ira
  na mataqali i Jekope.\\n2 O ira na lewe ni vanua era na kauti ira kina nodra yasana,
  na mataqali i Isireli ena tauri ira ena vanua i Jiova, me nodra tamata kei na nodra
  yada na tamata e ra vakabobulataki ira e liu; e ra sa qai vesuki me nodra bobula
  ka lewai ira na vakasaurarataki yani kina.\\n3 Ena yaco ena siga o ya me vakacegui
  iko kina o Jiova mai na nomu rarawa, kei na nomu rere kei na veivakatotogani mo
  na qarava yani,\\n4 O sa qai taura cake na vosa vakaibalebale oqo mo cavuta vei
  tui Papiloni, ka tukuna \\\"E oti vakacava na dauveivakasaurarataki, na koro koula
  sa oti!\\n5 O Jiova sa musuka na i wau ni tamata i valavala ca, na nodra i titoko
  na daulewa;\\n6 O Koya ga ka samuti ira ena Nona cudru ena tomana tikoga o Koya
  na Nona cudru ena matanitu, o Koya ka vakacacani ka sega ni dua e bau tarova.\\n7
  O vuravura taucoko sa qai vakacegu ka vakanomodi; e ra sa ia mai na lagasere.\\n8
  E dina na damanu sa reki mai ena vukumu, kei na sitari ni Lepanoni, e ra tukuna,
  ''O iko sa musuki sobu, sa sega ni qai cabe rawa mai e dua na dau ta kau me valuti
  iko.''\\n9 \\\"Sa marautaki iko tiko o eli mai na botoi vuravura ena nomu na lako
  yani kina, sa vakauqeti ira na mate tu me baleti iko, sa vakaduria na veitikotiko
  vakaturaga vei ira kece na tui ni vei matanitu.\\n10 E ra na vosa ka tukuna kece
  vei iko; ''O sa malumalumu talega me vakataki keitou?\\n11 Na kemu i rogorogo o
  sa biu sobu kina ki na i bulubulu, kei na rorogo ni nomu i vakatagi vakawa; era
  sa davo ubi iko kina na manumanu somidi lalai kei na ulo sa curumi iko.''\\n12 \\\"O
  lutu vakacava mai lomalagi o iko Lusefa? na luve ni mataka! o musuki sobu vakacava,
  o dau vaka i valavala ca taka na vei matanitu!\\n13 O iko o a tukuna e yalomu: ''Ka''u
  na cabe ki lomalagi, ka''u na vakalevulevuya na noqu i tikotiko me cecere ka me
  tiko sobu ka lolovira na kalokalo ni Kalou; au na qai dabe tiko ena nodra ulunivanua
  na i soqosoqo levu ena vanua yawa duadua mai na vualiku;\\n14 Au na cabe cake me
  uasivita yani na cecere ni o, au na via tautauvata i Koya sa cecere sara.''\\n15
  Io o na biu sobu ga ki etesi, ena loma ni qara kina botona sara e ra.\\n16 \\\"O
  ira kece e ra na raici iko e ra na vakadikevi iko, era na nanumi iko ka tukuna:
  ''Oqo li na tamata ka vakayavalati vuravura, ka kuretaka na vei matanitu,\\n17 Ka
  vakayacori vuravura me lala didi ka vakarusa na kena vei koro lelevu, o koya ka
  sega ni bau dolava na nodra vei vale na vesuki?''\\n18 \\\"O ira kece na tui ni
  vei matanitu, e ra dui moce ena nodra dui vei vale ena lagilagi;\\n19 Ia o iko o
  sa biu tani mai kina nomu davuke me vaka na taba ni kau vakasisilataki, me vaka
  na i sulu nodra na mate ni ra lausua ena i selewau, ka sa lutu sobu kina vei vatuvatu
  ena boto ni qara, me vaka na yago ni mate sa dasila.\\n20 O na sega ni buluti vata
  kei ira, baleta ni o sa vakacacana sara ga na vanua ka vakamatei ira na tamata,
  na yacadra na daucaka ca ena sega ni wili me dua na ka.\\n21 Vakarautaka na vei
  vakamatei vei ira na nona gone baleta na nodra i valavala ca na tamadra, de ra qai
  tucake mai ka taura na vanua, ka tawani vuravura ena vei koro.\\\"\\n22 \\\"Au na
  tucake ka valuti ira,\\\" sa tukuna o Jiova ni lewe vuqa, \\\"Ka tagutuva vakadua
  na kena i vovo, kei na yaca i Papiloni, kei na nodra kawa kei na luvedra tagane,\\\"
  sa tukuna o Jiova.\\n23 \\\"Au na bulia na vanua me nodra i gadigadi na belo, ka
  me kena wai me vaka na roka ni dobui; au na taviraka ena i tataviraki ni veivakarusai,\\\"
  sa tukuna o Jiova ni lewe vuqa.\\n24 E bubului o Jiova ni lewe vuqa, ka tukuna,
  \\\"Me vaka, na dina ni Noqu vakanananu, ena yaco vaka kina, kei na Noqu lewa, ena
  yaco ga:\\n25 Au na musuki Asiria ena Noqu vanua, ena Noqu ulunivanua au na buturaki
  koya ena yavaqu. Na nodra i vua ena vagalalataki mai vei ira, kei na i colacola
  ni tabadra ena luvati laivi.\\n26 Oqo na i naki sa nakinaki tu mai kina baleti vuravura
  taucoko, kei na liga oqo sa dodo tiko mai me tara na vei matanitu.\\n27 O cei me
  na tarova na ka sa nakita, o Jiova ni lewe vuqa? O cei me na vukica tani na ligana
  ni sa dodo tiko mai?\\\"\\n28 Ena yabaki sa mate kina o Easi na Tui sa qai vakayacori
  na parofisai oqo.\\n29 \\\"Vei kemudou mai Filisitia raraba dou kakua ni reki tiko,
  baleta ni sa kamusu na i wau ka samuti kemudou; mai na kawa ni gata ena tubu mai
  kina e dua na gata rerevaki sara, na kena kawa e ra na muri mai e ra na gata dauveivukayaki
  rerevaki.\\n30 Na nodra ulumatua na dravudravua ena vakani, kei ira na vakaloloma
  e ra na maroroi ni ra sa davo sobu; au na vakamatea na nomu kawa ena dausiga, e
  na qai vakamatei sara o ira na dro bula.\\n31 Dou tagi lagalaga, ena matamata ni
  koro! ka tagi vakadomoi levu, na koro levu! vei kemudou mai Filisitia dou na waicala
  ga; ena lako mai na kubou mai na vualiku, ena sega ni dua me na guilecavi ena gauna
  sa lokuci tu mai.\\\"\\n32 Taro cava me ra na sauma o ira na dauvakau i tukutuku
  ni vei matanitu? Ni sa kunei Saioni o Jiova, kei ira na Nona tamata e ra dravudravua
  e ra na maroroi kina.\\nChapter 15\\n1 Na parofisai bibi me baleti Moapi ni ena
  vakalalai vakadua o Ari-Moapi ena bogi, e na vakarusai baleti Kiri-Moapi ka vakalalai
  vakadua ni na vakarusai ena bogi, 2 Era sa cabe cake kina vale ni kalou nei Tiponi,
  kina vanua cecere me tagi, o Moapi ena tagicaki Nipo kei na vanua kece vaka Metipa;
  na nodra qavokavoka ena tasi, kei na kumidra ena toro laivi. 3 Ena veigaunisala
  ni ra lako tu e ra na dara na i sulu taga; ena delavuvu ni nodra vei vale kei na
  gaunisala ni ra lako tu e ra na tagi ka veitagicaki vakalevu sara. 4 O Esiponi kei
  Elale rau na tagi, na domodrau ena rogoci sara mai Jeasa; na mata sotia ni Moapi
  e ra na qai tagi mai; ena vakarawarawataki koya ga na lomana. 5 \\\"Na yaloqu ena
  tagicaki Moapi; ira na tamata beitaki e ra na vaqara bula ki Soa, me vaka na luve
  ni bulumakau yabaki tolu, e ra na tagi tiko ni ra sa Cabe ki Luici; e na i lakolako
  ki Oroneimi era na tagicaka na veivakarusai, 6 Ena vakamacari na wai ni Nimirimi,
  ni sa malai ka madu na co bulabula; sa sigasiga na vanua, sa yali na co drokadroka.
  7 Na ka e ra sa bau rawata, kei na ka e ra sa bau maroroya, e ra kau laivi ena Mataniwai
  kina veikau bitubitu. 8 Na veiyalayala ni vanua kei Moapi sa rorogo ga mai kina
  na domo ni veitagicaki, na tagi qoqolou vei Ekileimi kei Pierielimi talega. 9 Na
  wai ni Timona ena sinai ena dra; ni''u na vakalevutaka ki Timona eso tale, o koya
  e via dro mai Moapi ena sota vata kei na laione, kei ira talega e ra se vo tiko.\\\"\\nChapter
  16\\n1 Mo tala na lami vua na tui ni vanua, mai Sela kina veivanua dravuisiga, kina
  ulunivanua nodra na goneyalewa ni Saioni.\\n2 Ena vaka e dua na manumanu vuka sa
  yali na kena sova; e ra na vaka kina na goneyalewa ni Moapi ena sovu ni wai o Aranoni.\\n3
  \\\"Dou bose mada, me dua na lewa dodonu; dou cakava na kemudou i yaloyalo me vaka
  ena bogi me laurai ena sigalevu tutu; vunitaki ira na sega vanua, kua ni cakitaki
  Koya sa dro.\\n4 Laivi ira na Noqu sega vanua me tiko kei iko, Moapi; mo nodra i
  vakaruru mai na matadra na dauvakacaca. Ni sa vakarau mai muduki o ira na dauveilawakitaki
  vakailasu, sa malumu mai na dauvakacaca ka ra sa cemuri tani mai na vanua o ira
  na dauvakasaurara.\\n5 Na i tikotiko vakaTuraga ena vakataudeitaki ena loloma; ena
  qai dabe kina e Dua sa i Koya na dina ena Vale ni Soro nei Tevita, ena ia na lewa
  ka na vakasaqarai na lewa dodonu kei na vakatotolotaki ni caka dodonu.\\\"\\n6 Eda
  sa rogoca tiko na viavialevu i Moapi ena nona qaciqacia\u2014yalolevu kei na dokadoka
  kei na nona cudruvi\u2014ia na nona dauvosa lasu ena sega ni yali.\\n7 O koya oqo
  ena tagicaki Moapi kina o Moapi; taucoko na tamata e ra na tagi, dou na tagicaki
  Kiriereseci ni sa vakarusai ka na kuitataki vakaidina.\\n8 Ni sa qai malai na veiwere
  mai Asiponi, kei na vaini ni Sipima; o ira na Turaga ni vei matanitu e ra sa vakabalea
  sobu na tabana, talei sa laki yala ki Jaseri sa lako sese ki veikau sa tete yani
  na tabana ka teteva na wasawasa.\\n9 O koya oqo Au na tagicaka na vaini ni Sipima,
  me vaka ka''u sa tagicaki Jaseri, Au na vakasuasuataki kemudrau Esiponi kei Elale
  ena wai ni mataqu, ni sa rogo na kaila ni valu mai na nomu vuata ni yabaki.\\n10
  Sa kau laivi na lomavinaka kei na reki, ni sa levu na kakana ena teitei; ena sega
  na lagasere ena loga vaini se na kaikaila; ena sega ni seraka vinaka na waini ena
  i keli waini Au sa vagalua na nodra kaikaila.\\n11 O koya oqo ena tataqiriqiri na
  yaloqu me vaka na rorogo ni api vei Moapi kei na utoqu sara mai loma vei Kiriereseci.\\n12
  Ena yaco na kena gauna, ni na oca mai o Moapi ena vanua cecere e toka kina, e na
  qai lako mai ena vale ni soro me masu; ia sa na sega ga ni yaga.\\n13 Oqo na vosa
  sa cavuta o Jiova ena gauna sa oti ena vuku i Moapi.\\n14 Ia oqo sa vosa o Jiova,
  ka vaka, \\\"Ena loma ni tolu na yabaki, me vaka na yabaki ni dua na tamata e voli
  me cakacaka kina, ena vakarusai o Moapi ena ka e lagilagi tiko kina me ra na rusa
  kece, e ra na lewe vica sara ena vo ka ra na sega ga ni rawata e dua na ka.\\\"\\nChapter
  17\\n1 Na vosa ni parofisai bibi me baleti Tamasiko, \\\"Raica, o Tamasiko ena cavuraki
  me kua ni koro levu tiko, na kena caca ni koro ena dua na i binibini levu sara.\\n2
  Sa biu wale na vei koro lelevu mai Aroeri, ena nodra i kanakana na sipi e ra na
  veidavoci kina, ka sega ni dua me na vakarerei ira.\\n3 Ena oti talega mai na koro
  ni valu i Ifereimi na matanitu i Tamasiko, kei ira na i vovo mai Siria; e ra vakaiukuukutaki
  me vakataki ira na gone ni Isireli,\\\" sa tukuna o Jiova ni lewe vuqa.\\n4 \\\"Ena
  yaco dina sara ena vakalailaitaki na i ukuuku i Jekope, kei na yagona levulevu me
  na salulu mai.\\n5 Ena tautauvata kei ira na dautatamusuki ni ra kumuna vata na
  sore ni sila, ka tamusuka na sovuna e na ligana; ena tauvata kei koya e kumuna vata
  na sovu ni tei ni sila ena buca o Refeimi.\\n6 Ena vica ga na vuanikau kamikamica
  ena vo me vaka na yavalati ni vuni olive e rua se tolu ena vuso ni tabana ki cake
  e va se lima ena vo ena tabana dau vua,\\\" sa tukuna o Jiova na Kalou i Isireli.\\n7
  Ena siga ena golevi koya kina o Koya ka bulia na tamata, na matana ena rokova na
  Le Dua Yalosavasava i Isireli.\\n8 Ena sega ni goleva na i cabocabo ni soro, ena
  ka sa cakava na ligana; e na sega ni rokova na ka sa buli e nona i qaqalo, se na
  matakau kau se na i cabocabo ni ka boivinaka.\\n9 Ena siga o ya ena nona koro levu
  kaukauwa ena vaka na kau ta vaka vo kina tabana i cake, o koya e ra sa biuta tu
  me baleti ira na gone ni Isireli ena qai vakalailai tu.\\n10 Baleta ni dou sa guilecava
  na Kalou sa vakabulai kemudou, ka sa sega ni nanumi koya na Vatu nomu idrodro o
  koya o sa tea kina na kau talei ka vakatetea yani na sore ni kau mai na veivanuatani;\\n11
  Ena siga dou sa vakatubura kina na nomudou i tei ni kau, kei na mataka lailai dou
  na vakamareqeta na nomudou i tei me seraka; ia ni sa tamusuki ena dua na i binibini
  ca kece ena dua na siga ni rarawa kei na mosi ni ulu.\\n12 Ena ca vei ira na lewe
  vuqa ni ra vakavuna na rorogo me vaka na vadugu ni wasa liwa, kei na rorogo tatamosamosa
  ni veimatanitu ka rorogo me vaka na wai kui kaukauwa!\\n13 Era na tamosa na veimatanitu
  me vaka na rorogo ni lutu sobu mai na wai kaukauwa, ia ena cudruvi ira o Jiova ka
  ra na dro vakayawa, ka ra na vuka me vaka na qa ni sila ni vukaca na cagi ena vei
  ulunivanua, ka vaka na vakatoqiqi ni dua ena gauna ni covulaca.\\n14 Mo raica, ena
  yakavi, na rarawa! ni se bera ni kida na mataka, sa sega tale ni dua na kena o me
  tiko. Oqo ena nodra o ira e ra vakacacani keda, kei na ka sa votai vei ira e ra
  butakoci keda.\\nChapter 18\\n1 Ena ca na vanua sa vakatabana rorogo, ka rorogo
  sa koto ena tai kadua ni uciwai i Iciopea, 2 Ka vakauta na nona mata ki wasawasa,
  ena waqa kuta ena dela ni wai ka tukuna, \\\"Mo lako na mata, totolo kina matanitu
  sa balabalavu ka yagoyago vinaka, ki vei ira na tamata sa rerevaki mai liu ka yacova
  na siga oqo, na matanitu kaukauwa ka dau veitabaki sobu, na nona vanua e wasewasea
  na vei uciwai.\\\" 3 Vei kemuni kece na lewe i vuravura kei kemuni sa tiko e na
  vanua ni sa vakaliliga ena ulunivanua e dua na kuila dou a raica kei na gauna sa
  uvuca kina na davui, dou a rogoca. 4 Ni sa vosa vaka oqo vei au o Jiova, \\\"Au
  na vakacegu mada, Au na qai rai mai ena Noqu i tikotiko me vaka ni daumaka vinaka
  na siga, me vaka na draki katakata ni tatamusuki ni lutuka tu na o ena kabu.\\\"
  5 Ni se bera na tatamusuki, sa matua tu na vaini ka seraka vinaka mai na senikau,
  ena qai musuki laivi ena i sele ni tatamusuki, ka tatalaka laivi me musuka sobu
  na veitabana. 6 E ra na biu vata kei na manumanu vuka ni ulunivanua, kei na manumanu
  kila ni vanua; na manumanu vuka ena kania ena vula i katakata, kei na manumanu kila
  ena vula i liliwa. 7 Ena qai kau mai e dua na i loloma vei Jiova ni lewe vuqa, mai
  vei ira na tamata balabalavu ka yagoyago vinaka, mai vei ira na tamata rerevaki
  mai liu me yacova mai oqo, a matanitu kaukauwa ka dauveibutuki sobu, na nona vanua
  e wasewasea na uciwai\u2014kina vanua sa vakatokai kivei Jiova ni lewe vuqa, na
  ulunivanua o Saioni.\\nChapter 19\\n1 Na vosa ni parofisai bibi baleti Ijipita,
  ka raica, o Jiova sa vodo lako ena dua na o totolo ena qai lako mai ki Ijipita;
  na matakau ni Ijipita e ra na sautaninini e matana, ena waicala na yalona o Ijipita
  ena waicala e loma.\\n2 \\\"Au na cakava me rau veivala ga vaka i rau o Ijipita
  vata kei Ijipita; e ra na dui veivala ga vakaveitacini, e ra na dui veivala vakaveiwekani
  voleka, koro lelevu vata kei na koro lelevu, matanitu kei na matanitu.\\n3 Ena sega
  ni rawata na lomana o Ijipita; au na vakarusa na nona lewe ni bose, e ra na laki
  taroga na kalou mate, kei ira na daulawaki, kei ira na daucaka mana lasu kei ira
  na daurairai.\\n4 Au na soli Ijipita kina liga ni dua na Turaga dauveivakatotogani,
  ena dua na tui rerevaki ena liutaki ira,\\\" sa tukuna o Jiova ni lewe vuqa.\\n5
  Ena sega na wai mai wasawasa na uciwai ena mamaca ka sega ni yaga.\\n6 Ena bona
  na uciwai, ena maca talega na veidrodro lalai ni wai, ena malai na gasau kei na
  kuta.\\n7 Na veico mai na Uciwai, mai na bati ni uciwai kei na loga ni sila kecega
  mai na Uciwai, ena malai ka cagina tani yani.\\n8 E ra na tagi talega na gonedau;
  e ra yalobibi ni ra viritaka tiko na nodra siwa, ena tarai ira tu, na veika rarawa
  ni ra viritaka na nodra lawa e dela ni wai.\\n9 Era na madua o ira e ra cakacaka
  laino matailalai kei ira e ra dautali sulu vulavula;\\n10 Na kena yavu ena ramusu
  kei ira kece e ra cakacaka baleta na kedra i sau ena rarawa kina na lomadra.\\n11
  E dina sara e ra yalo lialia na ravouvou ni Soana; o ira na dauvakatulewa vuku nei
  Fero e ra solia tiko eso na i vakasala lialia. o na tukuna rawa vakacava vei Fero,
  \\\"Au na luve ni vuku kei na luve ni tui ena veigauna makawa?\\\"\\n12 E vei o
  ira oqo? E vei o ira na nomu tamata vuku? Me ra tukuna rawa mai oqo, me rawa ni
  ra kila na cava sa nakita tiko o Jiova ni lewe vuqa me vakayacora vei Ijipita.\\n13
  O ira na ravouvou ni Soana sa ra lialia mai; o ira na ravouvou ni Nofi e ra sa vakaisini;
  ka ra sa vakacalai Ijipita na duru ni veimataqali.\\n14 Sa solia o Jiova ki lomadra
  na yalo vakatani; ka ra vakaleqa kecega na cakacaka mai Ijipita, me vaka na nona
  yavavala ni dua e lualua ena levu ni mateni.\\n15 Ena sega ni dua na cakacaka e
  rawa ni caka mai Ijipita, vei koya na uluna se vei koya na buina tabana se na tolona.\\n16
  Ena siga o ya ena domobula o Ijipita me vaka na yalewa ni sa raica na yavala ni
  liga i Jiova ni lewe vuqa.\\n17 Na vanua vaka Juta ena vaka vu rere tiko vei Ijipita;
  o ira kece e ra na cavuta na vosa baleti Juta e ra na rere vakataki ira me vaka
  na Nona lewa o Jiova ni lewe vuqa sa vakataudeitaki oti tu.\\n18 Ena siga o ya ena
  lima na koro lelevu ena vanua o Ijipita, ena vosataka na vosa vaka Kenani ka bubului
  vei Jiova ni lewe vuqa; e dua e na vakatokai na Koro Levu ni Veivakarusai.\\n19
  Ena siga o ya ena dua na i cabocabo ni soro vei Jiova ena loma ni vanua o Ijipita,
  ka na dua na duru me kena i yalayala ni vanua.\\n20 Ena tu e kea me i vakatakilakila
  ka vakadinadinataka tiko vei ira na kai Ijipita ni oqo o Jiova ni lewe vuqa; e ra
  na tagi vei Jiova ena vuku ni veika rarawa, ena qai tala o Koya vei ira e dua nai
  Vakabula sa Kaukauwa sara, e na qai sereki ira o Koya.\\n21 Ena qai kilai mai Ijipita
  o Jiova e ra na qai kila dina sara ena siga o ya e ra na qai vakacaboi soro kina
  kei na i madrali; io e ra na ia na bubului vei Jiova ka vakayacora sara.\\n22 Ena
  qai taralaki Ijipita o Jiova, e na samuti ira ka vakabulai ira tale; e ra na qai
  lesu mai vei Jiova, e ra na vakamasuti Koya ka na vakabulai ira o Koya.\\n23 Ena
  siga o ya ena dua na gaunisala vou mai Ijipita ki Asiria, o ira na kai Asiria e
  ra na lako mai Ijipita o ira na kai Ijipita ki Asiria, e ra na veiqaravi vata o
  ira na Asiria kei Ijipita.\\n24 Ena siga o ya o Isireli ena kena i katolu vei Ijipita
  kei Asiria\u2014ena vuni sautu tiko ena nodrau dui bula,\\n25 Sa vakasaututaka o
  Jiova ni lewe vuqa ka tukuna, \\\"Ena sautu o Ijipita na noqu tamata, kei Asiria
  na cakacaka ni Ligaqu kei Isireli na noqu i votavota.\\\"\\nChapter 20\\n1 Ena yabaki
  sa lako mai kina o Taritani ki Asitoki, ni sa talai koya o Sarikoni na tui Asiria
  ka sa vala kei Asitoti ka taura, 2 Ena gauna vata o ya sa vosa kina o Jiova vei
  Aisea na luvei Emosi ka vaka, \\\"Lako ka kauta tani na i sulu taga mai na yagomu,
  ka kauta tani talega na i vava mai na yavamu\\\". Asa kitaka vaka kina ni lako tu
  ka luvaiwale ka sega ni vakaivava. 3 Sa qai tukuna o Jiova \\\"Me vaka na nona lako
  o Aisea ni luvaiwale ka sega ni vakaivava me tolu na yabaki me i vakatakilakila
  ka vakatakarakara baleti Ijipita kei Iciopea, 4 \\\"Ena vaka kina o tui Asiria ena
  kauti ira na kai Ijipita e ra sa bobula kei na kai Iciopea era vulagi, na gone kei
  na qase ni ra luvaiwale ka sega ni vaka ivava, ka sega ni bulukau na nodra i sulu,
  a ka ni veivakamaduataki ki Ijipita. 5 \\\"E ra na qai rere ka maduataki Iciopea
  na ka e ra vakararavi kina kei na ka e ra dokai kina. 6 \\\"O ira sa tiko rawa ena
  tai oqo e ra na qai tukuna ena siga o ya, ''Raica sa i koya oqo eda vakararavi kina
  nida via dro meda kere veivuke mai vei tui Asiria, ena qai rawa vakacava meda sereki?''\\\"\\nChapter
  21\\n1 Na vosa ni parofisai bibi baleta na dravuisiga ni wasawasa me vaka na covulaca
  mai na Ceva ni lako mai, e lako mai ena vanua dravuisiga, mai na dua na vanua rerevaki
  sara.\\n2 Sa vakaraitaki vei au e dua na raivotu ni rarawa; sa butako na daubutako
  ka vakacaca na dauvakacaca, o Ikoilama! Mo lako cake, o iko Mitia, mo laki drasiva
  na kau! Na nona dauveivakararawataki kecega au na muduka.\\n3 O koya oqo sa mosi
  kina na toloqu; sa yacovi au na rarawa, me vaka na taratara ni yalewa bukete; au
  yaluma ni''u sa rogoca; au taqaya ni''u sa raica.\\n4 Sa rikou na yaloqu ena domobula
  ni rere, na bogi me''u marau kina sa vukica me vakarerei au.\\n5 Vakarautaka na
  teveli lesia na i vakatawa ena vale ni yadra, mo kana ka gunu ka tucake, na ravouvou,
  lumuta na isasabai!\\n6 Ni sa tukuna vei au o Jiova; \\\"Mo laki lesia e dua na
  i vakatawa me tukuna mai o koya na ka sa raica.\\\"\\n7 Ni sa kunea o koya na qiqi
  ni valu kei ira na mataivalu ose, na qiqi ni valu asa, kei na qiqi ni valu kameli,
  sa qai vakadirorogo o koya me rogoca vinaka.\\n8 Sa qai kacivaka mai o koya, \\\"Na
  laione, noqu Turaga! sa sega ni''u cegu me''u tikoga ena vale ni yadra ni gauna
  ni siga; au sa tikoga ena noqu vanua ni yadra ena vei bogi.\\n9 Ka raica sa lako
  mai oqo e dua na mataivalu ose!\\\" Sa qai vosa mai o koya ka tukuna, \\\"Sa bale
  o Papiloni, sa bale! kei ira taucoko na nona matakau ceuti sa bale taucoko kina
  qele.\\\"\\n10 Ulei, na noqu tamata ka dau samuti, kei na noqu sila ena noqu rara
  ni sila na ka ka''u a rogoca mai vei Jiova ni lewe vuqa, na Kalou ni Isireli, ka''u
  sa tukuna yani vei kemudou.\\n11 Na i colacola bibi me baleti Tuma, sa kaci mai
  vei au e dua mai Sia, ka tukuna \\\" Na i vakatawa sa vakaevei na bogi? Na i vakatawa,
  sa vakaevei na bogi?\\\"\\n12 Sa tukuna mai na i vakatawa, \\\"Sa kida mai na mataka,
  sa toro talega mai na bogi, kevaka dou via taroga, dou taroga ga; dou lesu! tale
  mai!\\\" Sa Vakarogoi Na Veika Me Baleti Arapea\\n13 Na vosa ni parofisai bibi baleti
  Arapea. Dou na bogi ga mai veikau, ni Arapea oi kemudou na i vavakoso ni Tetanimi
  sa lako tu.\\n14 O ira na lewe ni vanua o Tima, dou kauta na wai ki vei o ya sa
  via gunu; e ra sa tavaki ira e ra sa dro ka solia vei ira na kedra madrai.\\n15
  Ni ra drovaka mai na i selewau sa ucuni tu, kei na dakai sa vakarau me vanataki,
  kei na veika rarawa ena i valu.\\n16 Ni sa vosa vei au o Jiova; \\\"Me dua tale
  na yabaki me vaka na yabaki ni tamata voli, ena qai vakaoti na nodra lagilagi na
  kai Kitari;\\n17 \\\"Na kena vo ni tamata dauvavana, na qaqa ni Kitari ena lewe
  lailai mai, ni sa tukuna vaka kina o Jiova na Kalou ni lewe vuqa.\\\"\\nChapter
  22\\n1 Na vosa ni parofisai me baleta na Buca ni Raivotu, cava sa manati kemudou
  ni dou sa cabe cake kina dela ni vale,\\n2 Dou sa sinai ena rorogo, na koro levu
  dau mauwe, na koro levu daumarau? O ira na nomu tamata era lausua e ra sega ni mate
  ena i selewau, e ra sega ni mate ena veivaluvaluti.\\n3 O ira na nomu Turaga e ra
  sa dro vata kece; e ra sa vesu mai vei ira na dauvavana. O ira kece e ra sa kune
  vei iko e ra sa vauci vata; ka ra sa dro vakayawa.\\n4 O koya oqo Ka''u sa tukuna
  kina, \\\"Dou rai tani vei au, ena ka rarawa na Noqu tagi, dou kakua ni gu me vakacegui
  au ena vuku ni kena vakacacani na nodra goneyalewa ni noqu tamata.\\\"\\n5 Ni sa
  siga ni rarawa kei na veivakanakuitataki kei na taqaya mai Vua na Turaga o Jiova
  ni lewe vuqa, ena Buca ni Raivotu na siga ni basu bai kei na tagi mai na ulunivanua.\\n6
  A sa cola taga gasau o ira na Ilama ena qiqi ni valu kei na tamata sa vodo ose,
  o ira na Kiri e ra sa ucuna nai sasabai mai na kena taga.\\n7 Ena yaco dina sara
  na gauna ni bula o digitaka ena oso ena qiqi ni valu, kei na vodo ose e ra na tuvani
  mai ena matamata ni koro.\\n8 Ena kautani na veimaroroi mai vei Juta, mo qai raica
  ena siga o ya na i yaragi ena Vale mai Veikau;\\n9 O sa raica vinaka talega na vakacaca
  ena koro i Tevita, ka sa ka levu sara; ka vakasoqona vata na wai mai na tobu e ra.\\n10
  Mo wilika tiko na vale i Jerusalemi, kei na vale o basuka sobu me dei kina na bai.\\n11
  Dou cakava e dua na tobu wai ena tadrua ni bai e rua me maroroi kina na wai mai
  na tobu makawa. E sega ni bau rai vei Koya na Dauveibuli, se mo dokai Koya o Koya
  e ukutaka ena veigauna sa oti yani.\\n12 Ena siga sa kaciva kina o Jiova ni lewe
  vuqa na tagi kei na rarawa, na tasi ni ulu kei na sulu taga.\\n13 Ka sa ia na reki
  kei na marau, vakamatei na bulumakau kei na vakamate sipi, kana lewe ni manumanu
  kei na gunu waini: \\\"Meda kana ka gunu, ni da na mate ni mataka!\\\"\\n14 Sa vakatakila
  ena daligaqu o Jiova ni Lewe Vuqa; \\\"Ena sega ni bokoci na nomudou i valavala
  ca oqo me yacova na nomudou mate,\\\" sa tukuna o Jiova ni lewe vuqa.\\n15 Sa tukuna
  o Jiova ni lewe vuqa; \\\"Mo lako, vua na dauniyau oqo, vei Sepina, o koya sa lewa
  taucoko na vale, ka vaka:\\n16 ''Cava e nomu e ke, o cei e nomu o sa tiko kina eke,
  o sa mai tataka e dua na nomu i bulubulu eke, me vaka e dua sa biuta na nonai bulubulu
  ena vanua cecere, ka ceuta na nona i tikotiko ena vatu?\\n17 Raica o Jiova ena viritaki
  iko vakaukauwa, o iko na tamata kaukauwa ena qaqiraki iko vakaidina.\\n18 Ena tauri
  iko vakaukauwa ka ulataki iko me vaka na polo mo laki tau kina dua na vanua vakaitamera;
  e kea mo na mate kina, sa na kautani talega kina na qiqi vakaTuraga o daulagilagi
  tu kina me vu ni veivakamaduataki ena vale ni nomu Turaga.\\n19 Au na cemuri iko
  tani mai na nomu vale ni volavola, ka vakasivoya na nomu i tutu.\\n20 ''Ena siga
  dina o ya, Au na qai kaciva na Noqu i talatala o Elaiakimi na luve i Ilikaia;\\n21
  Au na vakaisulutaki koya ena nomu i sulu ubi ka vauci koya ena nomu i vau ni sulu;
  ka''u na lesi koya me lewa na ka o sa lewa, ia ena yaco o koya me tamadra na kai
  Jerusalemi kei na mataqali i Juta.\\n22 Na i dola ni vale nei Tevita Au na vakataqara
  ki tabana; ena dolava ka na sega e dua me na sogota rawa; ni sa sogota ena sega
  ni rawa ni dua me na dolava.\\n23 Ka''u na vakataudeitaki koya me vaka na i vako
  ena tikina sa dei sara; ena yaco me vakaiukuuku na nona i tikotiko ena vale nei
  tamana.\\n24 ''E ra na vakaliliga vua na i ukuuku kecega ni vale nei tamana, na
  gone kei ira na kena kawa, kei na bilo lalai kecega, mai na bilo ni gunu ka yacova
  na bilo ni takitaki.\\n25 ''Ena siga o ya,'' sa tukuna o Jiova ni lewe vuqa, ''Ena
  biu tani na i vako sa vakataudeitaki ena tikina sa dei sara, ena musuki me bale,
  na i yaya ka vakarubeci tiko kina ena tamusuki laivi; sa tukuna o Jiova.''\\\"\\nChapter
  23\\n1 Na vosa ni parofisai bibi vei Taia, dou tagi qoqolou, na waqa ni Tasisi ni
  sa rusa koto, sa sega ni dua na vale, sa sega ni dua na toba; ni sa vakatakilai
  mai vei ira ena vanua o Saipurusi.\\n2 Dou tiko malua, na lewe ni yanuyanu, kemudou
  na dauveivoli ni Saitoni vei ira na dausokota na wasawasa me ra dauveisoli.\\n3
  Na sila ni Siori mai na bati ni wai levu, na tatamusuki ena Uciwai, na non i vurevure
  ka sa nodra vanua ni volivoli na vei matanitu.\\n4 Mo madua, Saitoni; ni sa vosa
  mai na wasawasa, na kaukauwa ni wasawasa, e tukuna, \\\"Au sega ni vakasucu, au
  sega ni susu gone; au sega ni vakavulici ira na cauravou, se tuberi ira na goneyalewa
  sega cala.\\\"\\n5 Ni sa yacovi Ijipita na i tukutuku, e ra na rarawataka talega
  me baleti Taia.\\n6 Dou takosovi Tasisi; ka tagi qoqolou oi kemudou na lewe ni yanuyanu!\\n7
  Sa i koya beka oqo na nomu koro levu daumarau, o koya ka tubu ena gauna sara e liu,
  o koya sa vakauti koya na yavana vakayawa sara me la''ki tiko mai kina?\\n8 O cei
  sa lewa oqo me baleti Taia na koro levu vakairogorogo, na nona dauvakau i yaya na
  ravouvou, kei ira na nona duvolivoli me ra tamata rogo e vuravura?\\n9 Sa lewa o
  Jiova ni lewe vuqa me uruca sobu na dokadoka ni ka e ra qoroi kina, vei ira talega
  na dauraici cake tu e vuravura e ra na raici sobu.\\n10 Mo vuabale yani ena nomu
  vanua me vaka na Uciwai, o iko na goneyalewa ni Tasisi; sa sega ni dua tale na kaukauwa.\\n11
  Sa dodo yani na Ligana kina wasawasa ka yavalata na matanitu eso; sa vakarota o
  Jiova ena vuku i Kenani me vakarusa na kena vei koro kaukauwa.\\n12 Ka sa tukuna,
  \\\"Mo kua tale ni qai marau tiko o iko o dau vakacacani ira na goneyalewa ni Saitoni,
  tucake ka lako ki Saipurusi, mai keya o na sega ni na kunea na vakacegu.\\\"\\n13
  Raica na nodra vanua na kai Kalitia, na mataqali oqori ka sega ga e liu, ka sa qai
  tauyavutaka o Asiria me nodra na kai veikau ka ra sa qai tara na kena vei vale cecere,
  ka vakaduria na kena vei vale vakaTuraga ka vakarusa o Koya.\\n14 Dou qoqolou, na
  waqa ni Tasisi! ni sa vakarusai na nomudou koro kaukauwa.\\n15 Ena yaco na gauna
  ena guilecavi kina o Taia me vitusagavulu na yabaki, me vakatauvatani kei na yabaki
  ni dua na tui. Ni sa cava na vitusagavulu na yabaki ena qai caka vei Taia me vaka
  na sere ni yalewa dautagane:\\n16 \\\"Taura na api, la''ki volita na koro levu,
  o iko na yalewa dautagane guilecavi; mo solia mai na rorogo vinaka, lagata mai e
  levu na sere, me rawa ni o bau nanumi tu kina.\\\"\\n17 Ni sa oti na yabaki e vitusagavulu,
  ena qai talevi Taia tale o Jiova. Ena qai lesu tale mai me volitaki koya vei ira
  na vei matanitu e vuravura me raica na mata i vuravura kece.\\n18 Na ka e rawata
  kei na kena i sau ena tabu me nei Jiova; ena sega ni maroroi na ka e rawata e nodra
  na tiko ena vale nei Jiova, me ra kana vinaka, ka vakaisulu vinaka.\\nChapter 24\\n1
  Raica, sa vakalalai vuravura o Jiova ka kitaka me ka walega, ka vukica sobu na delana
  ka vakatalabusesetaki ira na lewena.\\n2 Ena yaco me vaka kina; na bete, me vaka
  sa yaco vei ira na tamata; vua na Turaga, me vaka vua na nona tamata, vua na marama,
  me vaka vua na nona vada; vua sa volitaka, me vaka vua sa volia, me vaka na dausoli
  lavo, me vaka vua sa kerea; me vaka na dausoli dinau, me vaka vei koya e dinau.\\n3
  Ena vakalailai ka vakacacani vakadua na vanua sa cavuta na vosa oqo o Jiova.\\n4
  Ena tagi na vanua ka luca yani, o vuravura ena cegu oca ka malai yani; o ira na
  Turaga e vuravura e ra na takali yani.\\n5 E ra sa vakadukadukalitaki vuravura na
  lewena ni ra sa talaidredre kina i vunau, moica na ka sa lesi tu, vakatawayagataka
  na veiyalayalati sega ni mudu.\\n6 O koya oqo era na cudruvi kina na tiko e vuravura,
  e ra na tu ena vanua lala, e ra na vakamai na lewe i vuravura, ena qai lewe vica
  ga ena vo.\\n7 Na waini vou sa sega ni yaga, sa malai na vuni vaini, o ira na daumarau
  vakalialia e ra na vutugu mai.\\n8 Sa mudu na marau ena tibirieli, sa oti na kena
  daurorogo na marau, sa mudu na rekitaki ni api.\\n9 E ra na sega ni gunu waini kei
  na lagasere; na yaqona kaukauwa ena gaga ni ra sa gunuva.\\n10 Na koro levu veilecayaki
  ena basuki sobu; sa sogo taucoko na vei vale ka sega tale e dua me rawa ni curuma
  yani.\\n11 Era sa ra tagi ena veisaqata ni koro, ena vuku ni waini, sa yali na reki
  sa sega na marau ena vanua.\\n12 Sa vo ga na rusa e loma ni koro, ka sa basubasuraki
  sara na matamata ni koro.\\n13 Ena vaka oqo na rairai ni vanua e na kedra maliwa
  na vei matanitu ena vaka ni sa kurei na vuni olive, ka vaka ni sa tomitomiki na
  vua ni vaini ni sa oti na kena vula\\n14 E ra na tabalaka cake na domodra, e ra
  na sere; ena vuku ni ukuuku i Jiova e ra na kailavaka mai ena loma ni wasawasa.\\n15
  O koya oqo mo dou vakavinavinaka vei Jiova ni kida mai na mataka, na yaca i Jiova
  na Kalou i Isireli ena veiyanuyanu ni wasawasa.\\n16 Mai na i yalayala kei vuravura
  eda rogoca na domo ni sere: \\\"Na vakavinavinaka vua na yalododonu!\\\" Ia au sa
  tukuna, \\\"Au sa ca, au sa ca!, Isa Oi au! Na daubutako e ra sa butako e ra sa
  taura vakaveitalia na ka kecega.\\\"\\n17 Na rere na i keli titobu kei na i cori
  sa yacovi iko, na lewenivanua e vuravura.\\n18 Ena yaco o koya sa dro mai ena domo
  ni qoqolou ni rere ena lutu sara kina i keli, o koya talega sa cabe cake mai ena
  i keli ena coriti ena i cori; ni sa tadola na i sogo kei lomalagi, ka sa yavala
  na yavu kei vuravura.\\n19 Sa duisebaseba vakalalai na vanua ka sa tadola levu tu,
  sa yavavala vakalevu sara na vanua.\\n20 Sa yatayata me vaka na mateni, ka veisuayaki
  me vaka na loga lili; na nona i colacola bibi ena sega ni na colata rawa, ena qai
  bale sobu, ka sega ni tucake tale.\\n21 Ena yaco na siga o ya ena cudruvi ira na
  lewe vuqa e ra vakaceceretaki ira tiko, kei ira na tui ni vuravura oqo o Jiova.\\n22
  E ra na vakasoqoni vata, me vaka na nodra sota na bobula ena i keli me ra sogolati
  yani kina ka waraka na nodra i totogi ena siga sa lokuci.\\n23 Ena madua ka taqaya
  na vula kei na matanisiga; ni sa vakatulewa o Jiova ni lewe vuqa ena ulunivanua
  o Saioni kei Jerusalemi me vakarokorokotaki e matadra nona qase.\\nChapter 25\\n1
  Kemuni Jiova o ni sa noqu Kalou, au na vakalevulevui Kemuni, au na vakacaucautaka
  na Yacamuni, o ni a vakayacora e levu na ka au qoroqoro tu kina; na Nomuni vakatulewa
  sa oti e laurai kina na dina kei na dodonu.\\n2 Ni Kemuni sa veisautaka na koro
  levu me i benubenu, na koro levu kaukauwa me nodra i i kanakana na bulumakau, na
  nodra i gadigadi na vulagi e liu nikua sa yali; e na sega tale ni na vakavoui.\\n3
  O koya oqo e ra na rokovi Kemuni kina na tamata kaukauwa, na nodra koro lelevu na
  vei matanitu rerevaki e ra na rerevaki Kemuni.\\n4 Ni o ni sa vuni Kaukauwa vei
  ira na dravudravua, o ni vuni kaukauwa talega vei koya e vakaloloma, a i drodro
  mai na cava, kei na i vakaruru mai na katakata; na rogorogo e vakayacora na tamata
  rerevaki e vaka ga na cagi ni sa roba na lalaga.\\n5 Kemuni na vakalailaitaka sobu
  na domodra na vulagi, me vaka na katakata ena vanua mamaca; me vaka na katakata
  ena i yaloyalo ni o, na vakamalumalumutakivaka kina na nodra sere na dauviavakarerevaki.\\n6
  Ena ulunivanua oqo o Jiova ni lewe vuqa, e na vakarautaka vei ira na tamata kecega
  e dua na kana magiti ni kakana e lavotaki, kana ni waini makawa, kei na veika uro
  ni uto ni uro, ena waini makawa makare sara.\\n7 Ena vakarusa ena ulunivanua oqo
  na kedra i tuvi ni mata na tamata kece, kei na i ubi e robota tu na vei matanitu
  kecega.\\n8 Ena vakaoti mate vakadua o Koya, ena tavoya kece o Jiova na wai ni mata
  mai na mata kecega; kei na nodra vakalialiai na Nona tamata ena kauta tani o Koya
  mai na dela i vuravura taucoko; sa tukuna o Jiova.\\n9 Ena siga o ya e ra na qai
  tukuna: \\\"Raica, oqo na noda Kalou; e da a waraka tiko ena vakabulai keda o koya
  sa i koya oqo na Kalou; e da waraki Koya tiko; e da na kaila ka reki ena Nona veivakabulai.\\\"\\n10
  Ena ulunivanua oqo ena tiko kina na liga i Jiova, o Moapi ena buturaki sobu mai
  Vua, me vaka na kena buturaki sobu e dua na i binibini co.\\n11 Ena qai dodoka yani
  na ligana ena kedra maliwa me vaka na dauqalo ni sa dodoka na ligana me qalo, e
  na qai biuta sobu na nodra dokadoka kei na i naki ca ni ligadra.\\n12 Na vale ni
  valu cecere kei na nomu bai vatu ena biuta sobu o Koya, me davo sobu, ka biuta sobu
  sara kina qele, kina kuvu ni qele sara.\\nChapter 26\\n1 Ena siga o ya ena qai lagati
  ena vanua o Juta na sere oqo; \\\"Sa dua na noda koro kaukauwa; o Jiova ena lesia
  na veivakabulai me bai kei na bai ni valu.\\n2 Dolava na matamata ni koro, me ra
  curu mai na veimatanitu e ra maroroya tu na dina.\\n3 O ni na maroroi koya ena vakacegu
  e sega yalani, ni nona vakanananu sa tu ga vei Kemuni ni sa vakabauti Kemuni.\\n4
  Mo vakararavi tikoga vei Jiova me kua ni mudu, vei YAWE na Kalou, sa sega ni yalani
  rawa na Nona kaukauwa.\\n5 Ni sa daukauti ira sobu o ira e ra dauviavakaceceretaki
  ira, na koro levu cecere, sa biu sobu ki ra, e biu sobu kina qele, ka biu sara kina
  kuvu ni qele.\\n6 Ena butuki sobu ena yavadra io ena yavadra na dravudravua kei
  na nodra i kalawa na vakaloloma.\\\"\\n7 Na nona sala na yalododonu sa dodonu sara;
  vei Kemuni na yalododonu sara, o ni vakarautaka na nona sala na yalododonu.\\n8
  Io ena Nomuni lewa dodonu, i Jiova keimami waraki Kemuni; na loma i keimami sa gadreva
  na Yacamuni kei na ka o Ni nanumi kina.\\n9 Ena lomaqu au sa gadrevi Kemuni ena
  bogi, io ena yaloqu au na vakasaqarai Kemuni ni se qai mataka caca; ni sa tiko e
  vuravura na Nomuni cudru e ra na qai vulica na dodonu na lewe ni vanua.\\n10 Ni
  lomani tiko na tamata i valavala ca, e na sega ni rawa ni vulica tiko na i valavala
  dodonu; e na nodra vanua na tamata dodonu o koya e na bula tu ga vakaveitalia, ka
  na sega ni rawa ni raica na i ukuuku i Jiova.\\n11 I Jiova, sa laveti cake na Ligamuni
  e ra na sega ni raica. Ia ni ra na raica e ra na madua ena nodra loma ca vei ira
  na tamata; ia na bukawaqa nodra na nomu meca ena vakaoti sara.\\n12 Jiova o ni na
  vakadeitaka vei keimami na vakacegu, ni Kemuni sa cakava kecega vei keimami na cakacaka
  me yaga vei keimami.\\n13 Kemuni Jiova o ni sa neimami Kalou e ra a lewai keimami
  o ira na Turaga tani; ia na Vukumuni duadua ga keimami na vakacaucautaka na Yacamuni.\\n14
  E ra sa mate, e ra na sega ni bula tale; e ra sa yali yani e ra na sega ni tucake
  tale. O koya Kemuni sa vakarusai ira ka vakaotia na ka me ra nanumi kina.\\n15 I
  Jiova o ni sa vakatubura cake na matanitu, o ni sa rokovi o ni sa vakarabailevutaka
  na i yalayala kece ni vanua.\\n16 I Jiova, ni ra sa tiko leqa e ra sa qai lako mai
  vei Kemuni, e ra sova na masu vuni ni Kemuni sa cudruvi ira.\\n17 Me vaka na yalewa
  bukete ni tagi ka mosi, ni sa roro tiko mai na nona gauna ni vakasucu keimami a
  vaka kina e Matamuni, Jiova.\\n18 Keimami sa tiko vaka gone, keimami sa kune rarawa;
  sa vaka ni keimami a bukete ka vakasucuma na cagi; keimami a sega ni vakabula rawa
  na vanua, ka sega ni dua na lewe i vuravura me vakabalei.\\n19 Ena bula o ira na
  nomu mate; e ra na tucake vata kei ira na noqu mate, yadra ka sere, o iko ka vaka
  i tikotiko ena kuvu ni qele; ni sa vaka na tegu ena co na nomu tegu kei na qele
  ena biuti ira tani na mate.\\n20 Dou lako mai noqu tamata ka curuma nomudou yasana
  vuni, ka sogota na nomudou katuba; dou vunitaki kemudou vakalailai mada ga, me yacova
  ni sa oti na veicudruvi.\\n21 Ka raica, sa lako tani mai o Jiova ena Nona yasana
  me cudruvi ira na lewe i vuravura ena nodra i valavala ca; o vuravura ena sega ni
  rawa ni ubia tiko na nona dra, ka na sega ni vunitaki ira tiko na moku mate.\\nChapter
  27\\n1 Ena siga o ya, o Jiova ena Nona i seleiwau gata ka kaukauwa, ena vakarusai
  Liviacani na gata dauveisiriyaki, o Liviacani na gata dauviviraki koya; ena taya
  laivi na gata levu ka tiko e loma ni wasawasa.\\n2 Ena siga o ya mo seretaka, \\\"Na
  loga vaini damudamu!\\n3 Oi Au o Jiova na kena i vakatawa, Au dauvakasuasuataka
  ena veigauna me kua ni dua e vakacacana; Au qarava ena siga kei na bogi:\\n4 Sa
  yali vei Au na cudru katakata. O cei me na viribai me votonikau vei Au ena i valu?
  Au na curu basikati ira, ka vakamai ira vata.\\n5 Me mai taura mada na Noqu kaukauwa
  o koya, me rawa ni keirau duavata; sa na qai rawa ni Keirau veivinakati\\\"\\n6
  Vei ira na lako mai e ra na sema e na kawa i Jekope; o Isireli ena se ka beta yani,
  e ra na vakasinaiti vuravura ena vuadra.\\n7 Na Nona mokuti Isireli ena mokuti ira
  vaka talega kina vei ira e ra mokuti koya? Se sa vakamatei o Koya me vakataki ira
  sa vakamatea o Koya?\\n8 Me vaka na i vakarau ni nomu vakatalai koya tani, o sa
  lomavinaka kina, sa vagalalataki ena nona cagi voravora ena siga ni cagi tokalau.\\n9
  Ena vuku ni ka oqo na i valavala ca i Jekope ena bokoci; sa i koya oqo na vuana
  taucoko ni sa kautani na nona i valavala ca. Ni sa cakava o koya na vatu kecega
  ni cabocabo ni soro me tauvata kei na lase sa kakavorovoro, me sega ni tucake tale
  na matakau e ra bulia kei na cabocabo ni ka boivinaka ena sega ni tucake tale.\\n10
  Ena lala na vei koro kaukauwa kei na vei tikotiko me vaka na veikau; e ra na kana
  kina na bulumakau ka davo kina me ra kania na tabanikau.\\n11 Ni sa madu na tabana
  ena musuki; e ra na lako mai na marama ka ra na mai vakama. Ena vuku ni ra sa sega
  ni tamata yalomatua; o Koya ka buli ira ena sega ni yalololoma vei ira, o Koya ka
  vakataucokotaki ira ena sega ni lomani ira.\\n12 Ena yaco ena siga o ya, ena uvuca
  tani o Jiova na qa ni sila mai na i tatakoso ni Uciwai kina Wai o Ijipita; dou na
  qai vakasokumuna yadudua na gone ni Isireli.\\n13 Ena qai yaco na siga o ya; na
  davui levu ena uvuci; e ra na lako mai o ira sa voleka tu ni mate mai na vanua o
  Asiria, kei ira na vakatalai mai ena vanua o Ijipita, e ra na qai mai qaravi Jiova
  ena ulunivanua tabu o Jerusalemi.\\nChapter 28\\n1 Ena ca na i sala lagilagi ni
  dokadoka, nodra na daumateni ni Ifereimi kei na senikau ni kena i ukuuku sa malai
  tiko yani, o koya ka ra vakaisala kina na tiko ena buca bulabula, vei ira sa rawai
  tu ena waini!\\n2 Raica, o Jiova sa dua na Nona kaukauwa ka qaqa sa vaka na uca
  ceveta lutu bi, ka vaka na wai ni waluvu tabale ena vanua, o cei ena rawa ni kauta
  sobu mai ki vuravura ena ligana.\\n3 Na i sala ni qaciqacia na daumateni nei Ifereimi,
  ena buturaki sobu;\\n4 Na ka qoroi totoka sa senikau malai ka sa vakaisala kina
  na ulu ni buca bulabula, e na vaka na i sevu ni vuata ni se bera na vula i katakata,
  o koya e raica ena sega ni bera ena kania ga.\\n5 Ena siga o ya ena yaco o Jiova
  ni lewe vuqa me i sala vakai ukuuku kei na i sala talei vei ira na Nona tamata sa
  vo.\\n6 Kei na Yalo ni lewa vua sa tiko me lewa, kei na nodra kaukauwa e ra sa vakasava
  tani na i valu mai na matamata ni koro.\\n7 Ia o ira talega oqo sa vakacalai ira
  na waini, ka sa vakasesei ira talega na yaqona, na bete kei na parofita e rau sa
  vakacalai ena yaqona, sa rawai rau na waini, e rau sa vakasesei ena yaqona; e rau
  sa cala ena raivotu, e rau sa yatayata ena lewa.\\n8 Sa sinai ena teveli taucoko
  na lua kei na duka; sa sega na tikina e savasava.\\n9 \\\"O cei me vakavulica o
  Koya me kila ka? Se me vakavukui cei me kila na i tukutuku? O ira se qai kali mai
  na wai ni sucu? Ka kautani mai na sucu i tinadra?\\n10 Ni sa dau kuri na i vunau
  ena i vunau, na vunau ena vunau, na vosa ena vosa, na vosa ena vosa, vakalailai
  eke vakalailai mai kea.\\\"\\n11 Ena tebenigusu kaka kei na vosa tani ena vosataka
  o Koya vei ira na tamata oqo,\\n12 O ira oqo sa tukuna kina o Koya, \\\"Oqo na i
  vakavakacegu dou vakacegui ira kina sa oca.\\\" \\\"Oqo na ka ni veivakacegui,\\\"
  e ra sa bese ga ni rogoca.\\n13 Ia sa tau tikoga vei ira na vosa i Jiova, \\\"Na
  vunau ena vunau, vunau ena vunau, na vosa, ena vosa, vosa ena vosa, vosa vakalailai
  eke, ka vakalailai mai kea,\\\" e ra na lako ka bale i muri, ka ramusu ka mavoa
  ka vesuki.\\n14 O koya mo dou rogoca na vosa i Jiova, oi kemudou na dauveivakalialiai,
  sa lewai ira na tamata oqo mai Jerusalemi,\\n15 Baleta ni dou sa tukuna, \\\"Keitou
  sa veiyalayalati oti kei mate, kei bulubulu keitou sa veidinadinati tu. Ni sa lako
  mai na ca ena vuabale, ena sega ni yacovi keitou, me keitou sa cakava na lasu me
  i drodro, ka vunitaki keitou ena lawaki.\\\"\\n16 O koya oqo sa tukuna o Jiova na
  Kalou; \\\"Raica, Au sa vakotora mai saioni na vatu me yavu. Na vatu sa vakatovolei
  na vatu ena tutu ni vale sa talei, na yavu sa dei sara; o koya sa vakabauta ena
  sega ni yatayata.\\n17 Au na ia na lewa dodonu me wa i vakarau, kei na caka dodonu
  me i vatu vakarau; na uca cevata ena vakayalia sara na i drodro lasulasu, kei na
  i vunivuni ena luvuci ena wai.\\n18 Na nomudou veiyalayalati kei mate ena sega ni
  dei, kei na nomudou veidinadinati kei bulubulu ena sega ni vakayacori; ena gauna
  sa vuabale mai kina na ca dou na qai vakabalei sobu.\\n19 Ni sa dau lako tiko mai
  ena kauti kemudou; ena vei mataka kece sara ena lako tiko, ena siga kei na bogi;
  ena vu ni rere tiko ni da rogoca na kena i tukutuku.\\\"\\n20 Na i mocemoce sa rui
  lekaleka meda dodo kina, ka sega ni veirauti na i tutuvi meda tutuvi kina.\\n21
  O Jiova ena tucake me vaka na Ulunivanua o Pirasimi, ena rarawa sara me vaka na
  buca mai Kipioni ena qai cakava na Nona cakacaka, Nona cakacaka maqosa ena qai vakayacora
  na Nona i tovo, Nona i tovo ga.\\n22 O koya oqo, mo dou kua ni veivakalialiai tiko,
  me kaukauwa tikoga na kemudou i sema; ni''u sa rogoca mai vei Jiova ni lewe vuqa,
  e dua na veivakarusai sa nanumi iko me na tarai vuravura kece sara.\\n23 Dou vakatudaliga
  ka rogoca na domoqu, vakadirorogo ka rogoca Noqu vosa.\\n24 Sa cukucuki tiko beka
  na daucuki ena siga taucoko me sa kabukaburaki sara? Sa tekivu me veivukiyaka tiko
  beka na nona qele me malumu?\\n25 Ni sa vakatautauvatataka vakavinaka na delana,
  sa sega ni duibiubiuta kina na kumina loa ka biuta vou kina na kumina dina, ka teivaka
  na witi me yatuni, na parile ena tikina e vakarautaki, kei na sila vuti ena bati
  ni were?\\n26 Sa vakavulici koya ena lewa dodonu, ni sa vakavulica vua na Nona Kalou.\\n27
  Ni sa samuti na kumina loa ena i samu yara, ka sega ni toqici na yava ni qiqi ni
  sila; ena kumina dina, na kumina loa sa samuti ena kena i ua kei na kumina dina
  ena i titoko.\\n28 Me qaqiraki na madrai falawa; sa na sega ni qaqiraki tikoga ena
  veigauna, me musuki ena yava ni qiqi, se me buturaka na yava ni ose.\\n29 Sa lako
  talega mai vei Jiova ni lewe vuqa, o koya sa qoroi na Nona lewa ka totoka na Nona
  veituberi.\\nChapter 29\\n1 \\\"Ulei o Erieli, o Erieli, na koro levu ka tiko kina
  o Tevita! dou soqona na veiyabaki kei na veiyabaki me ia tiko na kana magiti.\\n2
  Ka''u na vakararawataki Erieli; ena yaco na lomabibi kei na rarawa, ena vakataki
  Erieli dina vei Au.\\n3 Au na viribaiti iko ena mataivalu, Au na vakarautaka na
  i valu e nomu koro, Ka''u na vakarautaka na mataivalu me tarova na nomu veicuruyaki.\\n4
  O na biu sobu, o na qai vosa tiko mai ena qele ena rogo lailai na domomu mai na
  kuvu ni qele, na domomu ena vaka na domo ni daucurumi, ni vosa tiko mai ena loma
  ni qele; io mai na kuvu ni qele ena rogo lailai na nomu tagi.\\n5 \\\"Na kemu meca
  e ra lewe vuqa e ra na vaka na mata ni nuku lalai, e ra na vaka na qa ni sila cagina
  tani; o ira na i soqosoqo rerevaki ena ka vakasauri; ka vakidacala na kena yaco.\\n6
  O na cudruvi vei Jiova ni lewevuqa ena kurukuru kei na uneune kei na rorogo rerevaki,
  ena cava kei na covulaca kei na yameyame sa kana voli.\\n7 Ena qai vaka na tadra
  se na raivotu ena bogi na nodra i soqosoqo na lewe ni vei vanua, e ra valu mai Erieli,
  io o ira kecega e ra vala tukuna kei na nona koro kaukauwa, ka sa vakararawataki
  koya.\\n8 Ena vaka e dua e viakana ni tadra, ka raica sa kana; ia sa yadra mai,
  ka sa lala na yalona; ka vaka sa tadra e dua sa viagunu, ka raica sa gunu, a sa
  yadra mai, ka raica sa malumalumu ka sa gagano na yalona; ena vaka kina na kedra
  lewevuqa na vei vanua, e ra na valu mai ena ulunivanua o Saioni.\\\"\\n9 Dou tu
  vakadua ka lialiaci mada! dou kua ni rai ni dou sa mataboko! e ra sa mateni, ka
  sega ni gunu waini; e ra sa sasakurekure ia ka sega ni cakacaka ni yaqona kaukauwa.\\n10
  Ni sa sova vei kemudou o Jiova na yalo ni moce lutu, ka tabonaka na matamudou, o
  ira na parofita; ka ubia na ulumudou o ira na daurairai.\\n11 Na raivotu kece e
  vaka na vosa ni vola sa dregati vei kemudou, e ra sa solia vua e dua sa kila na
  wili vola, ka tukuna, \\\"Mo yalovinaka wilika mada oqo\\\", a sa tukuna o koya,
  \\\"Au sa sega ni rawata, ni sa dregati tu.\\\"\\n12 Sa qai soli na i vola vua e
  dua e rawa ni wilika, ka vaka \\\"Mo yalovinaka wilika mada qo,\\\" a sa tukuna,
  \\\"Au sa sega ni kila na wilika.\\\"\\n13 O koya oqo sa tukuna o Jiova: \\\"Ni
  ra sa toro mai vei Au o ira na tamata, ena gusudra e ra sa vakarokorokotaki Au walega
  ena tebenigusudra, ia e ra sa vagolea tani na yalodra mai vei Au, kei na nodra rerevaki
  Au sa vu ga mai ena nodra i vakavuvuli na tamata,\\n14 O koya oqo, Raica, Au na
  baci cakava tale e dua na cakacaka me ra qoroya ka taleitaka na tamata oqo, me ra
  kurabui ka liaca tu; ena vakayali na nodra yalomatua na nodra tamata vuku, kei na
  nodra kila ka na tamata lewa matau ena vakayali.\\\"\\n15 Ena ca o ira e ra vunia
  matua mai vei Jiova na nodra bose ka, kei na nodra cakacaka ena butobuto; e ra tukuna,
  \\\"O cei e raici keitou?\\\" \\\"O cei e kilai keitou?\\\"\\n16 E dina e so na
  ka mo dou veisautaka! me rau tautauvata li na dautuli kuro kei na qele; me vosa
  vua sa tulia o koya sa tuli tiko? \\\"O koya e sega ni tuli au?\\\" Se me tukuna
  na ka sa buli vua ka bulia, \\\"O Koya e sega tu ni kila\\\"?\\n17 Ena sega ni dede
  sara ena qai vukici o Lepanoni me veiwere bulabula kei na veiwere bulabula ena okati
  me veikau?\\n18 Ena siga o ya na didivara e ra na rogoca na vosa ni vola o ya, kei
  na matadra na mataboko ena cecegi laivi na i tatao ni butobuto e matana me rai rawa.\\n19
  O ira na yalomalumalumu e ra na tosoya cake na nodra rekitaki Jiova kei ira na dravudravua
  mai vei ira na tamata e ra na rekitaki Koya na Le Dua Yalosavasava i Isireli.\\n20
  Vei koya na tamata rerevaki ena vakamalumalumutaki me sega ni dua na ka, na dauveivakalialiai
  ena vakaoti laivi, e ra na musuki o ira e ra yadrava na i valavala ca\u2014\\n21
  O koya e cavuta na vosa me vakacacana e dua, ka bukuya e dua na vere vei koya na
  i vakatawa ni matamata, ka vakamadualaki koya na Yalododonu ena vosa lialia.\\n22
  O koya oqo sa tukuna o Jiova, o koya ka vakabulai Eparama, ena vuku ni mataqali
  i Jekope: \\\"O Jekope me kakua ni madua tiko, me kua ni rairai malumalumu na matana;\\n23
  Ia ena gauna sa raici ira kina na luvena, na cakacaka ni ligana ena kedra maliwa
  e ra na qai vakarokorokotaka na Yacaqu, ka vakarokorokotaka na Le Dua i Jekope,
  ka rerevaka na Kalou i Isireli.\\n24 O ira na vakaleqai na yalodra e ra na qai vuku
  mai, kei ira na dauveileti e ra na qai vulica na i vakavuvuli.\\\"\\nChapter 30\\n1
  \\\"Ena ca o ira na gone talaidredre,\\\" sa tukuna o Jiova, \\\"Era taroi vakasala
  cala ka sega vei Au, e ra navunavuci ka sega kina na Yaloqu, e ra vakaikuritaka
  na i valavala ca kina i valavala ca;\\n2 E ra lako me ra lako sobu ki Ijipita, ka
  ra sega ni kere i vakasala vei Au, me ra vakaukauwataki kina ena kaukauwa nei Fero,
  ka ra nuitaka na i yaloyalo walega kei Ijipita!\\n3 Na kaukauwa i Fero ena vaka
  vu madua vei kemudou, kei na vakararavi ena i yaloyalo i Ijipita, dou na rogo ca
  kina.\\n4 O ira na nona ravouvou e ra tiko mai Soani, kei na nona mata ki Anesi.\\n5
  Era sa madua kece vei ira na tamata ka sega ni dua na betena vei ira, se me ra vukei
  se lomani, ia na madua ga kei na yaluma.\\\"\\n6 Na vosa bibi ni parofisai baleta
  na manumanu rerevaki mai na Ceva. Ena vanua ni oca kei na rarawa, e lako mai kina
  na laione yalewa kei na laione daukata, na gata loa kei na gata vakabukawaqa, e
  ra na kauta na nodra i yau e na daku ni asa gone, kei na nodra i yau vakamareqeti
  ena dakudra na kameli, vei ira na tamata e sega ni dua na ka e rawa ni ra rawata;\\n7
  Na nodra veivuke na kai Ijipita e maumau walega ka sega ni yaga. O koya oqo au sa
  vakatokai koya kina na daubole ka dau guce. O Ira Na Tamata Talaidredre\\n8 Mo lako,
  ka vola ena vava ni volavola ka vola ena i vola vivigi me tu ka yacova na gauna
  mai muri, me sega ni mudu ka sega ni mudu;\\n9 O ira oqo na tamata dauvuki tani,
  ka gone lasulasu, na gone e ra sega ni dau via rogoca na i vunau i Jiova;\\n10 Era
  tukuna vei ira na daurairai, \\\"Dou kakua ni raica,\\\" vei ira talega na parofita,
  \\\"Kakua ni tukuna vei keimami na ka dodonu; tukuna ga vei keimami na ka e sega
  ni yaga, parofisaitaka mai na ka lasu.\\n11 Dou lako tani ena sala, lako vakatikitiki
  e gaunisala me lako mai na Le Dua Yalosavasava e Isireli de tarovi na Nona lako
  mai vei keimami.\\\"\\n12 O koya oqo sa tukuna na Le Dua Yalosavasava i Isireli:
  \\\"Ni dou sa beca na vosa oqo, ka vakararavi kina veivakasaurarataki kei na ka
  vereverea mo dou bula kina,\\n13 O koya oqo na ca sa na tarai kemudou ena vaka e
  dua na bai vatu kaukauwa sa vakarau bale, ka sa vakalakala tu ena kasura ga vakasauri.\\n14
  Ena basuka o koya me vaka na kavoro ni bilo vua na dautuli bilo, ena kakavorovoro
  vakamatailalai; ena sega ni dua me vo, sa sega kina ni kune na kena i caca me buka
  ena matadravu, se me vakayagataki me taki kina na wai ena i keli.\\\"\\n15 Ni sa
  tukuna o Jiova, na Le Dua Yalosavasava i Isireli: \\\"Ni dou sa lesu mai ka tiko
  malua dou na vakabulai; ena vakanomodi kei na lomadina me nomudou kaukauwa,\\\"
  ia dou sa qai bese ga,\\n16 Dou a tukuna, \\\"E sega, keimami na dro ena ose\\\"O
  dou sa dro ga! \\\"Keimami na vodo lako ena ose totolo\\\"O ia e ra na totolo sara
  o ira e ra cemuri kemudou!\\n17 Ena dro e lewe dua na udolu ni dua ga e bolei ira,
  ni bolei kemudou e lewe lima dou na dro, me yacova ni dou sa vaka e dua na duru
  ena dela ni ulunivanua kei na dua na kuila ena delana.\\n18 O koya oqo ena qai wawa
  kina o Jiova me yalovinaka vei kemudou; ena ka oqo ena laveti kina o Koya, me rawa
  ni lomani kemudou mai kina. Ni sa lewa vakadodonu na Kalou o Jiova; e ra kalouvinaka
  o ira kecega e ra sa waraki Koya.\\n19 O ira na tamata e ra tiko mai Saioni e Jerusalemi;
  dou na sega tale ni tagi. Ena lomani iko o Koya ni rogoca na domo ni nomu tagi;
  ni sa rogoca o Koya ena sauma mai vei iko.\\n20 E dina na Turaga ena solia mai vei
  iko na madrai ni rarawa kei na wai ni veivakasaurarataki, o ira na nomu qasenivuli
  e ra na sega ni vunitaki tale, o na raici ira tikoga na nomu qasenivuli.\\n21 Na
  daligamudou ena rogoca na domo mai dakumudou, ka vaka, \\\"Oqo na sala, mai lako
  kina,\\\" ni dou sa vuki kina ligamudou i matau se kina i mawi.\\n22 Dou na qai
  vakacacana na i botani siliva ni matakau siliva, kei na i ukuuku koula ni nomudou
  matakau koula, o na biuta laivi me vaka na dukadukali; o na tukuna kina, \\\"Mo
  lako tani!\\\"\\n23 Ena qai vakatauca na uca me baleta na nomu sore ni kau o sa
  kaburaka kina qele, na madrai na vua ni qele; ena vakalewe ka lelevu, ena siga o
  ya na nomu bulumakau e ra na kana ena veico drokadroka.\\n24 Na bulumakau talega
  kei na luve ni asa e ra daucakacaka ena were e ra na daukania na ka tuituina, ka
  sa vakasavasavataki ena i sivi ka iriva na i irinicagi.\\n25 E ra na tiko ena vei
  ulunivanua cecere kei na vei ulu ni delana ena uciwai kei na veibasogana lalai,
  ena siga ni veivakamatei levu, ena bale na vale cecere.\\n26 Ena qai vaka na rarama
  ni siga na rarama ni vula, kei na rarama ni matanisiga ena qai vakavitu, me tautauvata
  kei na rarama ni siga e vitu, ena gauna sa vauca kina o Jiova na nodra mavoa na
  Nona tamata ka vakabula na we ni kedra kuita.\\n27 Raica, na Yaca i Jiova sa lako
  vakayawa mai, sa katakata tu na Nona cudru, ka bibi na Nona i colacola; na tebenigusuna
  sa cudru vakalevu, kei na yamena sa kama voli me vaka na bukawaqa.\\n28 Na Nona
  i cegu sa vaka na uciwai sa vuabale ka lako cake me yaco ki domodra, me tavulona
  na vei matanitu ena vulo lasu; ena dua na i tacori ena gusudra, me ra vakacalai
  kina.\\n29 Ena qai dua na nomudou sere me vaka ena bogi sa ia kina na solevu tabu,
  kei na reki vakayalo me vaka e dua sa uvu bitu ni sa lako tiko mai kina ulunivanua
  i Jiova, kivei Koya na kaukauwa Isireli.\\n30 Ena vakarogoya na domona vakaTuraga
  o Koya me rogoci, ena vakaraitaki o Koya na ligana ni sa tau mai, ena cudru katakata
  kei na yameyame ni bukawaqa sa veisebayaki kei na cava kei na uca cevata.\\n31 Ni
  qai rogo na domo i Jiova, ena qai samuti Asiria sobu ena Nona i titoko.\\n32 Ena
  tikina kece e tau kina na titoko ni cudru, me vaka sa vakatauca vua o Jiova, ena
  ia vata kei na tibereli kei na qiri api; ia ena i valu rerevaki ena vala tukuna
  o Koya.\\n33 Ni sa vakarautaki mai e liu o Tofeci, ia sa vakarautaki oqori me nona
  tui. Sa cakava me titobu ka rabailevu; a kena i binibini bukawaqa kena buka drokadroka
  sa levu; a i cegu i Jiova, me vaka na sulifure, sa dave tu ena vakacaudreva.\\nChapter
  31\\n1 Ena ca o ira sa lako sobu ki Ijipita me kerea na veivuke, ka vakararavi kina
  ose, kina qiqi ni valu baleta ni ra sa rui levu, na kena tamata i valu dauvodo ose
  e ra sa kaukauwa sara, ia e ra sega ni bau golevi Koya na Le Dua Yalosavasava i
  Isireli, e ra sega ni vakasaqarai Jiova! 2 Sa vuku talega o Koya ena kauta mai na
  ca, ena sega ni veisautaka na Nona vosa, ia ena tucake me valuta na nodra mataqali
  na i valavala ca, kei ira e ra vukei ira na tamata ca. 3 Oqo o ira na Ijipita e
  ra tamata ga, ka sega ni Kalou; a nodra ose talega sa vakayago, ka sega ni vakayalo.
  Ni sa dodo yani na liga i Jiova, ena bale sobu o koya sa veivuke; o ira taucoko
  e ra na rusa vata. 4 Sa qai vosa mai vei au o Jiova; \\\"Me vaka na domo ni dua
  na laione sa tagi io na luve ni laione ni sa taura tiko na kena, (ni sa kailavaka
  tiko mai na i vakatawa e vuqa me mai vala tukuna, ena sega ni rerevaka na domodra
  se me vakamalumalumu ena vuku ni nodra kaila), ena lako sobu mai o Jiova ni lewe
  vuqa me vala ena vuku ni ulunivanua o Saioni kei na kena vei delana. 5 Me vaka na
  veivukayaki ni manumanu ena vaka kina o Jiova ni lewe vuqa na Nona taqomaki Jerusalemi.
  Ni sa vakaruruga ena vakabula,\\\" ni lako sivita ena maroroya.\\\" 6 Dou lesu mai
  vei Koya e ra sa vuki tani vakalevu vua na Isireli. 7 Ena siga o ya e ra na biuta
  tani na tamata vakayadua ga na nona matakau siliva kei na nona matakau koula\u2014na
  i valavala ca dou sa kitaka ena ligamudou ena okati vei kemudou. 8 \\\"O Asiria
  ena bale sega ena i selewau nona na qaqa, ena tunaki koya ga na i selewau sega ni
  nona e dua na tamata. Ia ena drotaka rawa o koya na i seleiwau, o ira na nona cauravou
  era na vesuki. 9 Ena lako kina nona koro ni valu kaukauwa ena vuku ni nona rere,
  kei ira na nona luve ni turaga era na rerevaka na drotini\\\", sa tukuna o Jiova,
  o koya sa tu mai Saioni na nona bukawaqa, kei na nona lovo mai Jerusalemi.\\nChapter
  32\\n1 Raica, ena dua na tui ena ia na lewa dodonu, o ira talega na luve ni tui
  e ra na lewa vakadodonu.\\n2 Ena dua na tamata ena vaka na i vunivuni mai na cagi,
  kei na i vakaruru mai na cava, ena vaka na uciwai ena vanua dravuisiga, ka vaka
  na iyaloyalo ni dua na vatu levu ena vanua dauveivakaocataki.\\n3 A matadra e ra
  na rai rawa ka sega ni buwawa, kei na daligadra ena rogo rawa ka vakarorogo.\\n4
  A lomadra talega na yaloriri ena kila mai na vuku, ka na vosa rawa ka macala na
  yamedra na kaka.\\n5 Na tamata lialia ena sega ni vakatokai tiko me yalo vakaturaga,
  se tukuni me lomasoli o koya sa kocokoco;\\n6 O koya sa lialia ena vosataka na ka
  vakalialia, ka caka ca tiko na lomana; me ia na veivakaisini ka vosa cala vei Jiova
  me vakavuna tikoga na nodra via kana na waloloi, ka vakayali na mena wai na tamata
  sa via gunu.\\n7 Na nona tuva ka o koya sa dau tuvatuva e butobuto; sa daubukia
  na vere ca me vakarusai ira kina na dravudravua ena vosa lasu, ni ra vosataka na
  ka dodonu na vakalololoma.\\n8 Ia o koya sa daulomasoli sa vakananuma na cakacaka,
  na nona daulomasoli ena tudei kina o koya.\\n9 Oi kemudou, na yalewa sa dautiko
  wale dou tucake ka rogoca na domoqu; oi kemudou na yalewa daunanumi kemudou, dou
  rogoca mada na domoqu.\\n10 Ena yabaki dua ka bogi vica dou na vakaleqai vakalevu
  oi kemudou na yalewa daunanumi koya; ni na yali na vua ni vaini, na vula i matua
  ena sega ni yaco.\\n11 Dou kidacala mada na goneyalewa daunanumi koya; dou liaci
  kemudou na daunanumi koya; dou luvata tani na nomudou i sulu ka vauca na i sulu
  madra ki tolomudou.\\n12 E ra na tagi na tamata ka tara lako na lomaseredra ni sa
  qai ca mai na were vinaka kei na veikau bulabula.\\n13 Ena nodra qele na noqu tamata
  ena lako mai kina na soni kei na kau votovotoa, io ena dela ni vei vale daumarau
  kecega na koro e ra daureki;\\n14 Ni sa biu laivi na vale vakaturaga ka sa lala
  mai, na koro ka sega, na koro ni valu kei na vei vale cecere a qai yaco me qara
  wale tu, ka sega ni mudu me ra rekitaka na asa kila ka kedra vanua veico na sipi\u2014\\n15
  Me yacova ni qai sovaraki na yalo i Koya sa cecere sara mai cake, ka sa yaco na
  vanua dravuisiga me teitei bulabula, ka sa wili na teitei bulabula me veikau loa.\\n16
  Ena qai tiko na lewa dodonu mai na vanua liwa lala ka na tiko ena teitei bulabula
  na i valavala dodonu.\\n17 Na cakacaka dodonu ena tubu kina na sautu, na cakacaka
  dodonu ena vakatubura na vakacegu, kei na tiko dei me sega ni mudu.\\n18 O ira na
  Noqu tamata e ra na tikotiko ga ena vanua ni sautu, kei na vei vale sa dei kei na
  i vakavakacegu vinaka.\\n19 E dina ena tau mai na uca cevata ki na veikau, na koro
  levu talega ena biu sobu me vakalolovirataki.\\n20 Sa kalouvinaka oi kemudou sa
  ia na kakaburaki ena bati ni wai kecega, oi kemudou sa vakauta yani kina na yavadra
  na bulumakau kei na asa.\\nChapter 33\\n1 Ena ca o iko sa dauvakacaca, e dina ni
  o a sega ni vakacacani; o iko talega sa dauveivakaisini, e ra sa sega ni vakaisini
  iko! ni sa oti na nomu vakacaca tiko, o na qai vakacacani; ni sa oti na nomu veivakaisini,
  e ra na qai vakaisini iko.\\n2 Kemuni Jiova, Mo ni lomani keimami mai; keimami sa
  waraki Kemuni Mo ni ligadra mada ena vei mataka, Mo ni neimami vakabula ena gauna
  ni rarawa.\\n3 Ni sa rogo na ue e ra na dro na tamata; ni Kemuni sa tucake mai e
  ra sa veiseyaki na vei matanitu;\\n4 Na nomudou toki ni valu ena kumuni me vaka
  na nodra daukumuni na banuve; me vaka na nodra veiladeyaki na vodre, ena ladeva
  vaka kina na ka oqori.\\n5 Sa cecere o Jiova, ni sa tiko mai cake o Koya; sa vakasinaiti
  Saioni ena lewa kei na caka dodonu.\\n6 Na yalomatua kei na vuku ena vakataudeitaka
  na nomu gauna, kei na i gu ni veivakabulai; na rerevaki Jiova e Nona i yau talei.\\n7
  E dina sara o ira na nodra qaqa e ra na kaila e tautuba, o ira na mata ni sautu
  e ra na tagi vakalevu sara.\\n8 Sa lala na salatu, sa sega ni ra lakova na dauveilakoyaki.
  Sa vakacataka o koya na vosa ni yalayala, sa beca na vei koro lelevu, ka sega ni
  bau kila e dua na tamata.\\n9 Sa tagi na vanua ka ceguoca, sa madua o Lepanoni ka
  sa malai yani; sa vaka na vanua talasiga o Seroni, sa mimira na drauna o Pasani
  kei Kameli.\\n10 \\\"Ia oqo Au na qai tacake,\\\" sa tukuna o Jiova. \\\"Au na qai
  vakalevulevui, Au na qai vakaceceretaki Au.\\n11 Dou na kunekunetaka na qa ni sila
  dou na qai vakasucuma na vu ni sila; a nomudou i cegu ena vaka na bukawaqa, ena
  qai kati kemudou.\\n12 O ira na tamata e ra na vaka na lovo ni lase; me vaka na
  kau vakavotona sa ta e ra na vakamai ena bukawaqa.\\n13 Oi kemudou, sa tiko vaka
  yawa, dou rogoca na ka ka''u a cakava; oi kemudou sa tiko voleka, dou raica ka kila
  na Noqu kaukauwa.\\\"\\n14 Sa rere mai Saioni o ira na i valavala ca; sa sautanini
  o ira na dauveivakaisini; \\\"O cei vei keda me na tiko ena bukawaqa daukana voli?
  O cei vei keda me na tiko ena bukawaqa ka kama tiko me sega boko rawa?\\\"\\n15
  O koya sa dodonu na nona i lakolako, ka sa vosataka na ka dodonu, o koya sa beca
  na i yau sa kovei, ka sa bese na ligana, ni taura na ka e soli mai vakalaiwaki,
  ka sa sogota na daligana me rogoca na rorogo ni veivakamatematei, ka tabonaka na
  matana me kua ni raica na ca:\\n16 O koya ena vakaceceretaki na nona i tikotiko;
  ena viribaita na nona i tikotiko kaukauwa na vatu lelevu; ena soli vua na madrai
  ka na sega ni na maca rawa na mena wai. Na Vanua nei Koya na Tui Vakaiukuuku\\n17
  Ena matamu ena raici Koya na Tui ena Nona totoka ni sa ukucavu tu; ka na raica na
  vanua sa yawa sara.\\n18 A lomamu ena vakananuma kina ka ni veivakarerei: \\\"Sa
  e vei na vunivola? Sa e vei na dauniyau? Sa e vei na dauwilika na vei vale cecere?\\\"\\n19
  O na sega ni na kunea eso na tamata vakarerevaki, tamata ka daudredre ni kilai na
  nodra vosa, gusu kaka, sega ni macala vinaka na veika e ra daucavuta.\\n20 Mo raici
  Saioni cake, na koro levu ni noda solevu tabu; a matamu ena kunei Jerusalemi, na
  i tikotiko vinaka, na vale vakacevaceva ena sega ni kau tani na kena latu ena sega
  sara ni cavu tale se cavuka e dua na kena dali.\\n21 Ia o Jiova vakaiukuuku ena
  yaga vei keda me vaka na yasa ni uciwai, na wai sa rabailevu vaka ka vaka, e na
  sega ni vocetaki kina e dua na waqa, ena sega talega e dua na waqa vakaTuraga me
  lako voli kina\\n22 (Ia o Jiova sa noda Turaganilewa, o Jiova sa noda Vu ni Lawa,
  o Jiova sa noda Tui; o Koya ga ena vakabulai keda);\\n23 Sa rui malumu nomu dali,
  e ra dredre ni duri na i vana, e ra sega ni vakarewataka rawa na laca, sa qai votai
  na i yau levu sa tauri; e ra tokitaka o ira na lokiloki.\\n24 Kei ira na lewe ni
  koro e ra na sega ni rawa ni tukuna, \\\"Au sa tauvimate\\\". O ira na tamata e
  ra tiko kina sa na bokoci na nodra i valavala ca.\\nChapter 34\\n1 Dou toro mai,
  na vei matanitu, mo dou rogoca; ka dou vakarorogo mai na vei mata tamata! me rogoca
  o vuravura kei ira kece era tiko kina, na vei vanua kei na ka kece sa tubu mai kina.\\n2
  Ni sa cudru sara o Jiova vei ira kecega na vei matanitu, sa cudruvi ira talega na
  kena vei mataivalu; ena vakarusai ira dina o Koya, sa soli ira me vakamatei.\\n3
  O ira na vakamatei e ra na biu tani ki tautuba; ena boi cake na bona ni yagodra,
  na nodra dra ena vakawaicalataka na vei ulunivanua.\\n4 Ena waicala yani na kalokalo
  kecega ni lomalagi, ka na vivigi vata na lomalagi me vaka na i vola balavu sa vivigi
  tu; ena lutu mai na kalokalo kecega me vaka sa mira mai na drau ni vaini, ka vaka
  ni sa qeqera mai na vua ni lololo.\\n5 \\\"Na Noqu i selewau e na quaraki mai lomalagi;
  ena qai lako sobu mai me tarai Itomi, vei ira na tamata ka''u sa cudruva, me ra
  cudruvi.\\n6 Na i selewau i Jiova sa sinai ena dra, sa lumuti tu ena uro, ena dra
  ni lami kei na me, ena ivi uro ni sipi tagane, ni sa dua na i madrali vei Jiova
  mai Posira, kei na veivakamatei levu mai na vanua o Itomi.\\n7 Ena lako sobu vata
  mai kei ira na bulumakau kila, kei ira na bulumakau lalai vata kei na bulumakau
  yadru; na nodra vanua ena curuma tu na dra, na kuvu ena veiwaki vata kei na dra\\\".\\n8
  Ni sa kena siga ni Nona veicudruvi o Jiova, na yabaki ni veisausaumi ena vuku i
  Saioni.\\n9 Na kena vei uciwai ena vuki me rara, kei na kena kuvu ni qele ena vuki
  me sulifure; na kena qele ena yaco me caudre tu kina na buka.\\n10 Ena sega ni bokoci
  rawa ena siga se bogi; ena kuvu cake na kena kubou me sega ni mudu. Mai na dua na
  i taba tamata kina dua na i taba tamata ena biu lala tu ga; ena sega e dua me lakova
  rawa mai na gauna oqo kei na veigauna sa tu mai liu.\\n11 Ena qai kena i taukei
  na manumanu vuka ena tiko talega kina na lulu kei na reveni, ena dreta e delana
  o koya na dali ni veilecayaki kei na vatu ni veivakalailaitaki.\\n12 E ra na kacivi
  ira na nodra Turaga kina matanitu, ena sega e dua me rairai kina, kei ira na nodra
  ravouvou ena sega tu ni dua na ka.\\n13 Ena tubu ena kena vale vakaturaga na wavakavotona,
  na salato kei na soni, ena kena vei koro ni valu; ena nodra i tikotiko na koli ni
  veikau, kei na nodra loma ni bai na ositereji.\\n14 Na manumanu kila ni vanua talasiga
  ena mai sota kina kei na koli kila, e na vakasaqara talega na me kila na kena i
  sa; na manumanu dau lako voli ena bogi ena lako me ra tiko kina, me kunea e dua
  na vanua me dau vakacegu tu kina.\\n15 Na gata daucoka ena vakarautaka nona sova
  me vakalutuka kina na nona yaloka, ena vakalutu yaloka ka soqona ena ruku ni nona
  i yaloyalo; ena soqoni talega yani na manumanu vuka kaukauwa levu na tuivuci levu,
  kei kena i sa.\\n16 \\\"Dou vakasaqara ena i vola i Jiova, ka wilika: ena sega ni
  yali e dua vei ira oqo; e na sega e dua me yali na kena i sa, ni sa vakarota na
  gusuqu, ia na Yaloqu sa vakasoqoni ira mai.\\n17 A sa ia na vakawiri madigi vei
  ira, ka wasei ira ena Ligana ena kedra maliwa, era na qai taukena ka sega ni mudu;
  mai na dua na i taba tamata kina dua na i taba tamata e ra na qai vakaitikotiko
  kina.\\\"\\nChapter 35\\n1 Na vanua dravuisiga kei na veikau loa ena reki ena vuku
  ni ka oqo, na vanua liwa lala ena marau ka na se me vaka na rosi;\\n2 Ena se ka
  beta ena reki talega, ka ia vata kei na sere. Na i ukuuku vaka Lepanoni ena soli
  kina, na dokai nei Kameli kei Seroni. E ra na raica nai ukuuku i Jiova, kei na Nona
  dokai na noda Kalou.\\n3 Dou vakaukauwataka na ligadra e ra malumalumu, ka vakataudeitaka
  na durudra na sautanini.\\n4 Tukuna vei ira na yalo daurere, \\\"Dou kaukauwa, dou
  kakua ni rere! raica na nomudou Kalou ena yaco mai, na veisausaumi, sa ia na Kalou;
  ena lako mai o Koya ka vakabulai kemudou.\\\"\\n5 Ena qai rai na matadra na mataboko,
  kei na daligadra na didivara ena dolavi.\\n6 Ena qai ladelade na lokiloki me vaka
  na dia, ka na tasere na yamedra na galu. Ni na vure cake mai na wai ena vanua dravuisiga,
  kei na vei uciwai lalai ena vanua talasiga.\\n7 Na vei nuku katakata ena yaco me
  drano, kei na qele mamaca me i vurevure ni wai; na nodra tikina na koli ni veikau
  e ra dau moce kina ena vanua vei gasau ka vei kuta.\\n8 Ena dua na sala vou ena
  davo kina, kei na dua na sala makawa ga, ka sa na vakatokai na Gaunisala Tabu. Ena
  sega ni lakova e dua e sega ni savasava, ia e ra na lakova eso tale. O koya e lakova
  kevaka mada ga e lialia ena sega ga ni butusevata.\\n9 Ena sega ni dua na laione
  se dua na manumanu kila daukata me lakova cake me muria; se me ra bau kune voleka
  kina, o ira ga na vakabulai e ra na lako tu kina,\\n10 O ira sa vakabula o Jiova
  e ra na lesu mai ki Saioni, ena domo ni sere kei na reki e sega yalani sa tu ena
  nodra vakasama. E ra na taukena na reki kei na vakavinavinaka, ia na rarawa kei
  na tagi ena dro tani yani.\\nChapter 36\\n1 Io oqo ena kena i ka katinikava ni yabaki
  i Esekaia na tui, sa qai lako cake o Senikaripi na tui Asiria me valuta na vei koro
  kecega vakabai e Juta ka taura kece.\\n2 O tui Asiria sa talai Rapisake ki na i
  valu levu mai Lakisi ki Jerusalemi. Kivei Esekaia na tui, ka sa la''ki tu voleka
  o koya kina i salisali ni drano mai cake, kina sala ena nodratou Vanua na Dausavaisulu.\\n3
  A ratou sa lako yani vua o Elaiakimi na luve i Ilikaia o koya sa lewa na vale levu,
  Sepina na vunivola, kei Joa na luve i Esafa, o koya sa dauvola na ka ni matanitu.\\n4
  Sa tukuna vei iratou o Rapisake, \\\"Tukuna vei Esekaia, ''Ni sa tukuna na tui levu,
  o tui Asiria: \\\"Cava o sa nuitaka mo vakararavi kina?\\n5 \\\"Au sa qai tukuna
  sa vosa wale na nomu vuku kei na nomu kaukauwa me ia na i valu; ia oqori e ka ga
  ni vosa. Ia o sa vakararavi vei cei, o via vorati au kina?\\n6 \\\"Raica! o sa vakararavi
  tiko kina i titoko gasau sa kamusu tu Ijipita? O koya kevaka sa ravita e dua ena
  lauta na ligana ka suaka, sa vaka kina o Fero na Tui Ijipita ki vei ira kecega e
  ra vakararavi vua.\\n7 \\\"Ia kevaka o sa tukuna vei au, ''Keimami vakabauti Jiova
  na neimami Kalou.'' Sa sega li ni o Koya sa taukena na vei tikina cecere kei na
  i cabocabo ni soro ka biuta tani o Esekaia, sa tukuna vei ira na Juta kei ira mai
  Jerusalemi, ''Dou soro ga ena mata ni cabocabo ni soro oqo''?\\\"''\\n8 \\\"Ia oqo
  mo yalovinaka, au sa kerei iko, mo solia mada vua na noqu turaga na tui Asiria,
  na i vakadinadina ni''u na solia vei iko e rua na udolu na ose kevaka o sa rawata
  na tamata me vodo kina!\\n9 \\\"E rawa vakacava mo qai vakasuka tani, e dua na turaga
  ni valu lailai vei ira na tamata ni noqu turaga, mo qai laki vakararavi tu ki Ijipita
  me so mai kina na nomu qiqi ni valu kei na nomu tamata dauvodo ose?\\n10 \\\"Ka''u
  sa qai lako cake mai vakataki au ga ka sega o Jiova me vakarusa na koro? Sa tukuna
  vei au o Jiova, ''Lako cake kina vanua oqo, ka vakarusa.''\\\"\\n11 Sa tukuna vei
  Rapisake o Elaiakimi, na luve Ilakaia, kei Sepeni, kei Joa \\\"Mo vosa mada vei
  keitou na nomu tamata ena vosa vaka Aramea ni keitou sa kila oqori, ia mo kakua
  ni vosa vei keitou ena vosa vaka Jutia me ra rogoca na tamata e ra toka ena dela
  ni bai.\\\"\\n12 Asa tukuna o Rapisake, \\\"Sa talai au beka na noqu turaga me''u
  tukuna na ka oqo vei kemudrau kei na nomudrau turaga? Ka sega ni talai au vei ira
  talega na tamata e ra sa toka ena dela ni bai, me ra kania na nodra benu ka gunuva
  na nodra suasua vata kei kemudou?\\\"\\n13 Ka sa tu o Rapisake ka kaci vakadomoilevu
  ena vosa vaka Iperiu, ka tukuna, \\\"Dou rogoca mada na nona vosa na tui levu, na
  tui Asiria!\\n14 \\\"Sa vosa vaka oqo na tui, ''Me kakua ni vakaisini kemudou o
  Esekaia, ni na sega ni vakabulai kemudou rawa;\\n15 ''Me kakua ni rawa na yalomudou
  o Esekaia mo dou vakararavi vei Jiova, ena nona tukuna tiko, \\\"Ena vakabulai keda
  vakaidina o Jiova; ena sega ni soli na koro oqo kina ligana na tui Asiria.\\\"''\\n16
  \\\"Dou kakua ni vakarorogo vei Esekaia; ni sa vaka o tui Asiria: ''Dou soro mada
  vei au ka lako mai ki tautuba vei au; ka me kania tiko na tamata yadua na nona vua
  ni vaini kei na nona vua ni lolo, ka gunuva na tamata yadua na wai mai na nona mata
  ni wai;\\n17 ''Me yacova ni lako tale mai ka kauti kemudou yani ki na vanua ni sila
  kei na waini, a vanua ni madrai kei na loga ni vaini.\\n18 ''Dou lewai kemudou vinaka
  de rawai kemudou o Esekaia, ka tukuna, \\\"Ena vakabulai keda o Jiova,\\\" sa dua
  li na kalou ni vei vanua sa vakabula na nona vanua mai na liga i tui Asiria?\\n19
  ''Sa e vei na Kalou i Emani kei Apati? Sa e vei na Kalou i Sifaveimi? Era sa vakabulai
  Samaria li mai na ligaqu?\\n20 ''O cei vei ira na kalou ni veivanua oqori e ra sa
  vakabula na nodra vanua mai na ligaqu me sa vakabulai Jerusalemi kina o Jiova mai
  na ligaqu?''\\\"\\n21 Ara sa galu ga ka ra sa sega ni cavuta vua e dua na vosa;
  ni sa vaka oqo na i vakaro ni tui, \\\"Dou kakua ni vosa vua.\\\"\\n22 E ratou sa
  qai lesu vei Esekaia o Eleakimi na luve i Iliakaia, o koya sa lewa na vale levu,
  kei Sipina na vunivola, kei Joa na luve i Esafa, o koya sa dauvola na ka ni matanitu,
  ka sa dresulaki tu na nodratou i sulu, a ratou sa tukuna vua na vosa i Rapisake.\\nChapter
  37\\n1 Ni sa rogoca o Esekaia na Tui, sa qai dresulaka na nona i sulu, ka ubi koya
  ena i sulu taga, ka laki curu ena vale i Jiova.\\n2 Sa qai talai Elaiakimi, o koya
  sa lewa na vale levu, kei Sepina na vunivola, kei iratou na qase vei ira na bete,
  ka ratou sa vakaisulu ena sulu taga, kivei Aisea na parofita, na luvei Emosi.\\n3
  E ratou sa qai tukuna vua, \\\"Sa tukuna vakaoqo o Esekaia, ''Na siga oqo sa siga
  ni veivakararawataki ni veivunauci kei na vosa veivakacacataki, me baleti ira na
  gone era vakarau sucu, ia sa sega ni qai dua na kaukauwa me vakasucumi ira mai.\\n4
  ''Ena rogoca beka o Jiova na nomu Kalou na vosa kecega i Rapisake, o koya sa tala
  mai o tui Asiria na nona turaga me vosa vakacacataka na Kalou bula, ka na sauma
  na vosa sa rogoca o Jiova na nomu Kalou. O koya mo qai gumatua cake ena masu ena
  vukudra na vica era se vo tiko.''\\\"\\n5 Ka ratou sa qai lako vei Aisea o iratou
  na dauniveiqaravi nei Esekaia na tui.\\n6 Sa qai tukuna vei iratou o Aisea, \\\"Dou
  tukuna vaka oqo vua na nomudou turaga, ''Sa tukuna o Jiova: \\\"Mo kakua ni rere
  ena vuku ni vosa o sa rogoca, ka ratou vosavakacacataki Au kina o iratou na nona
  tamata na tui Asiria.\\n7 \\\"Raica oqo Au na tala e dua na yalo vei koya, ena qai
  rogoca o koya e dua nai tukutuku lasu me vakalesui koya ki nona vanua, Au na qai
  vakabalei koya ena i seleiwau mai nona vanua.\\\"''\\\"\\n8 Ka sa lesu yani o Rapisake,
  a sa kunei tui Asiria ni sa vala tiko kei Lipina, ni sa rogoca e liu o koya ni sa
  lako tani mai Lakisi.\\n9 Ka sa rogoca o koya na tui ni sa tukuni tiko o Tiraka
  na tui Eciopea, \\\"Ni sa lako tiko mai me mai valuti koya.\\\" Ni sa rogoca o koya
  sa tala e dua na nona i talai me lako vei Esekaia, me tukuna,\\n10 \\\"Mo dou vosa
  vakaoqo vei Esekaia na tui Juta, ''Me kakua ni vakaisini iko na nomu Kalou, o koya
  o sa vakararavi kina, ni sa tukuna, \\\"O Jerusalemi ena sega ni na soli kina liga
  i tui Asiria.\\\"\\n11 ''Raica! o sa rogoca oti na ka era sa cakava na tui Asiria
  ki na veivanua kecega, ni ra sa vakarusa sara; ia o iko o na vakabulai beka?\\n12
  ''Era sa vakabula beka na kalou ni veimatanitu o koya sa vakarusa o ira na noqu
  qase, o Kosani kei Arani, kei Resefi, kei ira na luvei Iteni era tiko mai Tilasari?\\n13
  ''Sa e vei o tui Emaci, kei tui Apati kei na tui ni koro levu o Sifaveimi, kei Ena,
  kei Iva?''\\\"\\n14 Sa ciqoma nai vola o Esekaia mai na ligadratou na talai, ka
  wilika; sa lako cake o Esekaia ki na vale i Jiova, ka sa tevuka ena mata i Jiova.\\n15
  Sa qai masu o Esekaia, ena mata i Jiova:\\n16 \\\"Oi kemuni o Jiova ni lewe vuqa,
  na Kalou neimami na Isireli, oi kemuni o ni sa tiko ena tadrua ni Jerupi, sai kemuni
  na Kalou duaduaga ni veimatanitu kecega e vuravura, oi kemuni ka buli lomalagi kei
  vuravura.\\n17 \\\"Mo ni vakala mai na daligamuni, i Jiova, mo ni rogoca, dolava
  na matamuni, i Jiova, mo ni raica, ka rogoca na vosa i Senakaripi, o koya sa vakauta
  mai me vosavakacacataka na Kalou bula.\\n18 \\\"E dina, Jiova, o iratou na tui Asiria
  e ratou sa vakarusa nodra vanua, kei na veimatanitu tale eso,\\n19 \\\"E ratou sa
  biuta ki na bukawaqa na nodratou kalou; ni ra sa sega ni kalou, na cakacaka walega
  ni liga ni tamata\u2014na kau kei na vatu. O koya oqo e ratou sa vakarusa kina.\\n20
  \\\"Ia oqo, Jiova na neimami Kalou, vakabulai keimami mai na ligana, me ra kila
  na veimatanitu kece e vuravura ni sai kemuni duadua ga o Jiova.\\\"\\n21 A sa talai
  vei Esekaia o Aisea na luvei Emosi, ka tukuna, \\\"Sa vosa vakaoqo o Jiova na noda
  Kalou na Isireli, ''Na ka o sa masu kina vei au ena vuku i Senakaripi na tui Asiria,\\n22
  ''Oqo na vosa sa vosataka o Jiova ena vukuna: \\\"Na goneyalewa sega cala, na luvei
  Saioni, sa beci iko, ka dredrevaki iko; era kurea na uludra i dakumu o ira na goneyalewa
  ni Jerusalemi!\\n23 \\\"O cei o sa vakalialia ka vosataka? Vei cei o tabalaka kina
  na domomu, ka rai cake kina na matamu? Vei Koya ga na Le Dua Yalosavasava i Isireli.\\n24
  O sa vosavakacacataki Koya na Turaga ena gusudra na nomu i talai, ka tukuna, ''Ena
  noqu qiqi ni valu e vuqa au sa cabeta kina na vei ulunivanua cecere, kina yasai
  Lepanoni; au na taya sobu na kena vei sitari balabalavu kei na kena veidamanu vivinaka;
  au na yacova na kena i yalayala cecere duadua, kei na kena veikau bulabula.\\n25
  Au sa kelia ka gunuva na wai, ka vakadiva ena qeteqete ni yavaqu na uciwai kecega
  ni tataqomaki.''\\n26 \\\"O se sega beka ni rogoca ena gauna makawa na noqu a cakava,
  mai na gauna sa oti Au a vakarautaka? Ia oqo Au sa qai vakayacora, sa na yaco kina
  mo cakava na koro levu bai vatu kaukauwa me dua nai binibini yaya vakacacani.\\n27
  O koya oqo sa sega ni qai dua na kaukauwa me tiko vei ira na lewena; era sa yalolailai
  ka taqaya; era sa vaka na co ni vanua kei na co bulabula malai, na co mai na dela
  ni vale kei na sila sa raqosa sa sega ni tubu cake.\\n28 \\\"Ia Au sa kila nomui
  tikotiko, nomu lakoi tuba kei na nomu curu mai loma, kei na nomu rarawa katakata
  vei Au.\\n29 Sa mai rogoca na daligaqu na nomu rarawa katakata kei na nomu viavialevu
  vei Au, o koya oqo Au na ciqiri ki ucumu Noqu i qila Ka''u na qasota ki gusumu noqu
  i tatarovi ni ose, Au na qai vakasukai iko lesu ena sala o a muria mai.\\\"''\\n30
  \\\"Oqo na kena i vakatakilakila vei iko, dou na kania ena yabaki oqo na ka sa tubu
  wale tu ga, ena kena i karua ni yabaki dou na kania na ka sa tubu walega mai kina;
  ena kena i katolu ni yabaki dou kakaburaki, dou tatamusuki, tea na were ni vaini
  ka kania na vuana.\\n31 O ira na vo era dro bula ena mataqali i Juta, era na tei
  sobu tale, ka qai vua ki cake.\\n32 Era na lako tani mai Jerusalemi na kena vo,
  kei ira na dro mai na ulunivanua o Saioni. Na lomakatakata ni gumatua i Jiova ni
  lewe vuqa ena cakava na ka oqo.\\n33 \\\"O koya oqo sa vosa kina o Jiova baleti
  tui Asiria, ''Ena sega ni curu mai ki na koro oqo se vanataka kina e dua na gasau
  se mai tu kina ka vakaisasabai me viribaita.\\n34 Ena sala e lakova mai, na sala
  vata o ya ena muria lesu ena sega tale ni qai butuka na koro levu oqo,'' sa tukuna
  o Jiova.\\n35 ''Au na taqomaka na koro levu oqo, Me''u vakabula ena Vukuqu ena vuku
  talega i Tevita na Noqui talatala.''\\\"\\n36 Ka sa lako yani na agilosi i Jiova,
  ka vakamatei ira ena nodra i tikotiko ni valu na kai Asiria e dua na drau walusagavulu
  ka lima na udolu; ni ra lako yani vakamataka na tamata era raica\u2014ni ra sa davo
  matemate tu.\\n37 Sa qai dro o Senakaripi na tui Asiria ka lesu ki vale, ka laki
  tiko mai Ninive.\\n38 Sa qai laki lotu tiko o koya ena bure nei Nisiroki na nona
  kalou, e rau qai vakamatei koya ena i seleiwau oi rau na luvena o Etirameleki kei
  Saresa; ka rau dro sara ki na vanua vaka Ararata. Sa qai buli me tui o Esa-Toni
  na luvena me kena i sosomi.\\nChapter 38\\n1 Ena siga o ya sa tauvi mate o Esekaia
  ka sa voleka ni mate. Sa qai lako mai vua o Aisea na parofita na luvei Emosi ka
  tukuna vua, \\\"Sa tukuna vakaoqo o Jiova: ''Mo tuvana vakavinaka nomu vuvale, ni
  o na mate ga ka sega ni bula.''\\\"\\n2 Sa qai vuki na matana ki lalaga, ka masu
  vei Jiova,\\n3 Ka sa tukuna, \\\"Au masuti kemuni, Jiova, mo ni nanuma mada na noqu
  dau lako voli e matamuni ena yalodina kei na yaloqu taucoko, kei na noqu caka vinaka
  e matamuni.\\\" Ka sa tagi vakalevu sara o Esekaia.\\n4 Sa qai yaco mai na vosa
  i Jiova vei Aisea, ka vaka,\\n5 \\\"Mo lako vei Esekaia ka tukuna, ''sa vosa vakaoqo
  o Jiova na Kalou i Tevita na nomu qase: \\\"Au sa rogoca na nomu masu, Au sa raica
  na wai ni matamu; ka raica Au na tomana na nomu gauna ni bula me tini kalima tale
  na yabaki.\\n6 \\\"Au na sereki iko kei na koro levu oqo mai na ligai tui Asiria,
  au na taqomaka na koro levu oqo.\\\"''\\n7 \\\"Oqo nai vakatakilakila vei iko mai
  vei Jiova, ni na vakayacora e dua na ka oqo, ena ka sa cavuta:\\n8 \\\"Raica, ka''u
  na vakasuka tale ki muri na yaloyalo sa lako sobu ena i vakatakilakila ni matanisiga
  nei Easi, me tini na tikina. A sa suka tale ki muri na matanisiga me tini na tikina.\\\"
  A tikina oqori ka sa lako sobu kina.\\n9 Oqo na nona volavola o Esekaia na tui Juta,
  ena gauna ni nona tauvimate kei na nona bula tale mai na mate:\\n10 Au tukuna, \\\"Ena
  gauna e tu donu kina na noqu bula au na lako ka curuma na matamata ki Etesi, sa
  vakayali vei au na noqu yabaki sa vo tiko.\\\"\\n11 Au tukuna, \\\"Au na sega ni
  na raici Yawe, o Jiova ena nodra vanua na bula, au na sega ni raica tale na tamata
  kei ira na lewe i vuravura.\\n12 Noqu gauna ni bula sa oti, e kau tani vei au me
  vaka na vale laca nona nai vakatawa ni sipi; au sa gutuva na noqu bula me vaka nona
  wa na dautali i sulu; o ni na vakaotia na noqu bula ena mataka me yacova na bogi.\\n13
  Au a vakasama tiko me yacova ni sa mataka me vaka na laione, sa vakaramusutaka taucoko
  o koya na suiqu, mai na siga me yacova na bogi o ni sa vakaotia noqu bula.\\n14
  Au a vaka na kakabace se na belo ena noqu rorogo ni tagi vakamamakeukeu; au tagi
  rarawa me vaka na ruve; sa oca na mataqu ena noqu rai cake tiko. Kemuni Jiova, ka''u
  sa bitaki sara; mo ni vukei au mai!\\n15 \\\"A cava tale me''u na tukuna? Sa vosa
  oti mai vei au o Koya, ka sa vakayacora talega o Koya, au na qarauna na noqui lakolako
  ena noqu veiyabaki ena vuku ni rarawa ni lomaqu.\\n16 Kemuni Jiova, ena veika oqo
  ena bula na tamata; ena vuku ni ka kecega oqo sa bula na yaloqu; Kemuni na vakabulai
  au me''u sa bula kina.\\n17 E dina na noqu rarawa bibi sa vakayacori au me''u vakacegu
  kina, o ni a vakabula na yaloqu ka vakabula mai nai keli ni rusa, ni Kemuni sa biuta
  ki Dakumuni na noqui valavala ca kecega.\\n18 Ena sega ni vakavinavinaka vei Kemuni
  nai bulubulu, se vakacaucautaki kemuni o mate; o ira sa lako sobu ki nai keli era
  na sega ni nuitaka na nomuni vosa ni dina.\\n19 O koya sa bula, na tamata sa bula,
  me vakavinavinakataki Kemuni, me vakataki au ena siga oqo, ena tukuna na dina me
  baleti Kemuni o ira na qase vei ira na gone.\\n20 \\\"Sa vakarau tu o Jiova me vakabulai
  au, o koya oqo me da qai lagata vata noqu sere e nai vakatagi vakawa ena vale i
  Jiova, ena veisiga ni noda bula.\\\"\\n21 Sa tukuna oti tu o Aisea, \\\"Me ra kauta
  e dua nai buli lolo, ka ubia kina na bo ena qai bula o koya.\\\"\\n22 Sa tukuna
  talega o Esekaia, \\\"A cava nai vakatakilakila ni''u na lako cake ki na vale i
  Jiova?\\\"\\nChapter 39\\n1 Ena gauna o ya ni sa rogoca o Merotaki- Paletani, na
  tui Papiloni, na luvei Paletani, ni sa tauvi mate o Esekaia ka qai bula tale, sa
  qai vakauta vua nai vola kei na ka ni loloma. 2 Sa reki o Esekaia ena vukudra, ka
  vakaraitaka vei ira na vale ni nona ka talei na siliva kei na koula, kei na ka boi
  vinaka kei na waiwai vinaka kei na vale taucoko ni nona i yaragi\u2014kei na nona
  i yau kecega sa sega e dua na ka e nona vale kei na nona matanitu taucoko, me sega
  ni vakaraitaka vei ira o Esekaia. 3 Sa qai lako mai o Aisea na parofita vei Esekaia,
  ka tukuna vua, \\\"Na cava era mai tukuna na yavu tamata qo, e vei na vanua era
  lako mai kina vei iko?\\\" Sa qai tukuna o Esekaia, \\\"Era lako mai vei au, mai
  na dua na vanua yawa sara, o ya o Papiloni.\\\" 4 Sa qai tukuna o koya, \\\"Cava
  era sa raica e nomu vale?\\\" Sa sauma o Esekaia, \\\"Na ka kecega sa tu e noqu
  vale era sa kunea; sa sega e dua na noqui yau ka''u sa sega ni vakaraitaka vei ira.\\\"
  5 Sa tukuna o Aisea vei Esekaia, \\\"Dou rogoca na vosa i Jiova ni lewe vuqa: 6
  ''Raica, sa lako mai na gauna ena kau tani kina ki Papiloni na ka kecega sa tu e
  nomu vale, kei na ka era sa binia na nomu qase ka yacova na siga oqo, ena sega ni
  vo e dua na ka,'' sa tukuna o Jiova. 7 ''O ira na luvemu era sa tubu e muri mai
  vei iko o ira o na vakatubura era na kau tani, ka ra na matanivanua, ena vale vakaturaga
  i koya na tui Papiloni.\\\"''\\\" 8 Sa qai tukuna o Esekaia vei Aisea, \\\"Na vosa
  ni Kalou o sa cavuta sa totoka dina!\\\" Ni sa vaka, \\\"Na sautu kei na dina sa
  bau yaco tu mada ga ena noqu gauna.\\\"\\nChapter 40\\n1 \\\"Dou vakacegui ira,
  vakacegui ira Noqu tamata!\\\" sa tukuna na nomudou Kalou.\\n2 \\\"Dou vosataka
  na vosa ni veivakacegui ki Jerusalemi, ka kacivaka vua, ni sa oti na nona gauna
  ni oca, sa bokoci nona caka cala; ni sa tarai koya oti na ligai Jiova me vakarua
  ena vuku ni nona i valavala ca.\\\"\\n3 E dua na domo sa rogo ni kaci tiko mai ena
  vanua dravuisiga; \\\"Vakarautaka na sala i Jiova, mo vakadodonutaka e dua na sala
  vinaka i Jiova ena vanua talasiga.\\n4 Ena vakacerecerei na veibuca kecega ka na
  biu sobu na veiulunivanua kei na veidelana; na veivanua e veve ena vakadodonutaki,
  kei na tikina sukusukura ena vakalogalogavinakataki;\\n5 Nai ukuuku i Jiova ena
  qai vakatakilai mai, ka ra na raica vata na tamata kecega, ni sa cavuta na gusu
  i Jiova.\\\"\\n6 Tukuna o koya, \\\"Mo kacivaka yani\\\" a sa sauma o Koya, \\\"Na
  cava me''u kacivaka?\\\" \\\"Na tamata kece sa vaka na co, na kedra i ukuuku totoka
  sa vaka na senikau ena veiloga ni senikau.\\n7 Sa daumalai na co, a sa dau mira
  na senikau, baleta ni sa uvuca tani o Jiova e na nona i cegu; e dina sara sa co
  ga na tamata.\\n8 Sa dau malai na co, a sa dau mira na senikau, ia na vosa ni noda
  Kalou ena tudei ka sega ni mudu.\\\"\\n9 Mo cabeta na ulunivanua cecere, o iko Saioni,
  ka kauta mai nai rogorogo vinaka mo tabalaka vakaukauwa na domomu o iko Jerusalemi,
  ka kauta mai nai rogorogo vinaka, mo tabalaka, kakua ni o rere; tukuna kina veikoro
  e Juta, \\\"Raica na nomudou Kalou!\\\"\\n10 Ka raica, na Kalou o Jiova ena lako
  mai ena kaukauwa ni ligana, ia na ligana ena lewa ena Vukuna; ka raica, na kena
  i sau sa tiko ga Vua, kei na Nona cakacaka sa tu e matana.\\n11 Ena vakani ira Nona
  qele ni sipi me vaka nai vakatawa, ena roqoti ira na luve ni sipi ena Ligana, ka
  kauti ira voli ena Lomaserena, ena tuberi ira vakamalua o ira era qaravi ira na
  lalai.\\n12 O cei sa vakarautaka na wai ena qeteqete ni Ligana, ka kumukumuna vata
  na kuvu ni qele ena dua nai vakarau? E vakarautaka na veiulunivanua ena dua nai
  vakarau ni bibi, kei na veidelana ena i vakarau ni vakatautauvata?\\n13 O cei sa
  kila rawa na Yalo i Jiova, se o cei me Nona i vakavuvuli me vakavulici Koya?\\n14
  E rau sa bose vata mada kei cei, o cei sa vakasalataki Koya, ka vakavulici Koya
  e na sala ni lewa ka vakavulici Koya me vuku, o cei sa vakaraitaka Vua na sala ni
  kila ka?\\n15 Raica, na veimatanitu sa nanumi me ra vaka e dua na mata ni wai e
  nai takitaki, ka vaka na kuvu ni soso ena dari ni vakarau, raica, sa tomika o Koya
  na veiyanuyanu me vaka sa ka lailai sara.\\n16 O Lepanoni e sega ni yaga me vakamai,
  na kena manumanu talega e sega ni dodonu me cabori.\\n17 Na veimatanitu kece sa
  vaka e ka wale tu ga Vua, ka sa wilika tu o Koya na ka levu me ka lailai, ka sa
  ka wale sara ga.\\n18 O cei dou na vakatautauvatataka kina na Kalou? Se dou na vakatautauvatana
  kei cei na kena i rairai?\\n19 Sa cakava na matakau ceuceu e dua na matai, ka dua
  na matai ni koula sa botana e na koula, ka sa bulia na kena sinu codo siliva.\\n20
  O koya sa dravudravua a sa dredre ni caka i soro ka sa digitaka na kau sa sega ni
  vuca rawa, sa qai vakasaqara e dua na matai vuku, me vakaduria e dua na matakau
  ceuceu e na sega ni yavala.\\n21 Dou a sega beka ni kila? Dou a sega beka ni rogoca?
  Ea sega beka ni tukuni taumada vei kemudou mai liu? Dou a sega beka ni kila mai
  na gauna sa tauyavu kina o vuravura?\\n22 Sai Koya ga a tiko mai cake ka toka era
  o vuravura, o ira na lewe i vuravura era sa vaka na vodre, o Koya ga sa tevuka na
  lomalagi me vaka nai ubi rairai totoka ni vale, ka birika yani me vaka na vale laca
  mei tikotiko.\\n23 E vakayacori ira na ravouvou me sega ni dua na ka; o ira na turaga
  ni lewa kei vuravura sa vakayacori ira talega me ka wale sara.\\n24 Era sega ni
  tei dina, era sega ni kaburaki dina, sa sega ni tei sobu e dua na wakadra kina qele,
  ka sa uvuci ira walega o Koya a ra sa malai, ia na covulaca ena kauti ira tani me
  vaka na qa ni sila.\\n25 \\\"O cei dou na vakatautauvatani Au kina, se o cei me
  keirau bau tautauvata?\\\" Sa tukuna o Koya na Ledua Yalosavasava.\\n26 Dou tacake
  ka rai yani na matamudou, ka raica o cei ka bulia na veika oqori, ka sa kauta vakamataivalu
  mai na kedra i vavakoso; sa kacivi ira kecega ena yacadra, ka ni sa levu na Nona
  kaukauwa ka sa dau gumatua sara, sa sega ni dua na ka e yali.\\n27 A cava o sa vosa
  kina, o iko Jekope, o iko talega Isireli; ka tukuna, \\\"Sa vuni tu na noqu sala
  vei Jiova, ia na noqu ka ka''u a dodonu kina sa takali tani vua na noqu Kalou\\\"?\\n28
  O sa sega beka ni kila? O sa sega beka ni rogoca? O koya sa Kalou, ka sega ni mudu
  o Jiova, o koya ka bulia nai yalayala kei vuravura, ena sega ni malumalumu o koya
  ena sega ni oca, sa sega ni dikevi rawa na nona vuku.\\n29 Sa dau solia na kaukauwa
  vei ira era sa malumalumu, kei ira e sega vei ira na yalo e gu sa vakatubura o Koya
  na yalo qaqa.\\n30 Io era na malumalumu ka oca ga mai nai tabagone, era na bale
  sara na cauravou,\\n31 Ia o ira era waraki Jiova era na vakaukauwataki tale; era
  na tubu cake me vaka era sa vakatetaba na ikeli, era na cici ka sega ni oca, era
  na lako tu ka sega ni bau malumalumu mai.\\nChapter 41\\n1 \\\"Dou vakadirorogo
  vei Au, na veiyanuyanu, ka me ra vakavoui tale mada na lewe ni vanua na nodra kaukauwa!
  Me ra toro voleka mai, me ra qai vosa; me da mai ia vata na veilewai.\\n2 \\\"O
  cei sa vakatubura e dua mai na tokalau? Ena nona yalododonu e kacivi koya mai ki
  na yavana ka solia na veimatanitu vua, ka lesi koya me lewai ira na tui? O cei ka
  soli ira me vaka na kuvu ni soso kina no nai selewau ka vukataka na dakai titi me
  vaka na vuni sila cagina?\\n3 Sa vakasevi ira o koya, ka sa lako vakavinaka voli
  yani ena sala sa sega ni butuka na yavana?\\n4 O cei sa vakaraitaka ka cakava, ka
  kaciva na veitabatamata mai liu sara? ''Oi Au o Jiova nai vakatekivu; Oi Au talega
  nai vakataotioti.''\\\"\\n5 O ira ena baravi era raica ka ra qai rere, nai yalayala
  kei vuravura era sa domobula; era toro voleka ka lako mai.\\n6 Era sa vukei ira
  yadua na wekana, ka tukuna vei ira na tacidra, \\\"Mo yaloqaqa tiko!\\\"\\n7 Na
  dauceuceu sa vakayaloqaqataki koya na matai ni koula; kei rau na dauvakayagovinakataka
  nai tukituki kei na dautukia e nai tuki kaukamea, e rau sa tukuna, \\\"Sa drega
  vinaka oqo\\\" ka rau sa vakadeitaka e nai vako, me kakua ni yavala.\\n8 \\\"Ia
  o iko, Isireli, na Noqu tamata, o iko Jekope Ka''u sa digitaka, na kawa i Eparama
  na Noqui tokani vinaka.\\n9 O iko Ka''u a kauta mai nai yalayala kei vuravura, ka
  kaciva mai ena sauka ni vanua, ka tukuna vei iko, ''O iko Noqu tamata, ka''u a digitaki
  iko ka sega ni biuti iko:\\n10 Kakua ni o rere, Ni''u sa tiko vata kei iko: Kakua
  ni o taqaya Ni''u sa nomu Kalou. Au na vakaukauwataki iko, io Au na vukei iko, io
  Au na tokoni iko ena ligaqu i matau sa dau dina.''\\n11 \\\"Raica, era na madua
  ka yaluma mai o ira kecega era yaloca vei iko; era na vaka na ka walega, era na
  rusa ga o ira era veileti kei iko.\\n12 O na qarai ira ka sega ni kunei ira o ira\u2014era
  dau via veicudruvi kei iko. O ira era veivala kei iko era na vaka na ka walega,
  sa sega ni vakavotukana.\\n13 Ni sai Au, o Jiova na nomu Kalou, ka''u na taura na
  ligamu i matau, ka tukuna, ''Mo kakua ni rere, Au na vukei iko.''\\n14 \\\"Mo kakua
  ni rere, o iko Jekope na wadamele kei kemudou na Isireli! Au na vukei iko,\\\" sa
  tukuna o Jiova kei na nomui Vakabula, na Yalosavasava ni Isireli.\\n15 \\\"Raica,
  Au na vakayacori iko mo vaka e dua na yava ni qiqi vou ka gatagata na batina; o
  na samuta na veiulunivanua ka butuqaqia mematailalai, kei na veidelana mo vakatautauvatataka
  kei na qa ni sila.\\n16 O na iriva ena qai cagina tani ena cagi, ena qai mai veibiuyaka
  na covulaca; o iko mo rekitaki Jiova, o na vakacaucautaki Koya na Yalosavasava ni
  Isireli.\\n17 \\\"O ira na dravudravua kei na vakaloloma era vakasaqara na wai,
  ia sa sega, ni sa mamaca na yamedra ena via gunu, oi Au, o Jiova, Au na rogoci ira;
  Oi Au na nodra Kalou na Isireli, Ka''u na sega ni laivi ira.\\n18 Au na vakadavea
  na uciwai ena vanua talasiga, kei na mata ni wai ena loma ni vei buca; Au na cakava
  na vanua dravuisiga me vei tobu ni wai, kei na vanua mamaca me vurevure ni wai.\\n19
  Au na tea ena talasiga na sitari kei na sitimi, kei na mateli kei na olive; Au na
  tea vata ena vanua dravuisiga na nokonoko na damanu kei na dilo,\\n20 Me rawa ni
  ra raica ka kila, ka vakasamataka me rawa ni ra kila vata, ni sa cakava na ka oqo
  na liga i Jiova, ni sa bulia kecega o Koya na Yalosavasava ni Isireli.\\n21 \\\"Dou
  vakaraitaka mai nomudou kisi,\\\" sa tukuna o Jiova, \\\"Dou vakamacalataka mai
  na nomudou i le,\\\" sa tukuna na Tui i Jekope.\\n22 \\\"Me ra tukuna mada mai ka
  vakatakila vei keda na ka ena yaco, mera vakaraitaka na veika sa oti me kilai, me
  rawa ni da vakalewa vinaka, me da kila na kena i tinitini; me rawa ni qai vakaraitaka
  vei keda na veika se bera ni yaco.\\n23 Dou vakaraitaka mai na ka ena yaco mai muri
  me keitou kila ni dou sa kalou; io ni dou cakava na ka vinaka se na ka ca, me keitou
  taqaya ka raica vata.\\n24 E dina ga dou sa ka walega, kei na nomudou cakacaka sa
  ka wale; o koya sa digitaki kemudou sa tamata vakasisila dina.\\n25 \\\"Au sa vakatubura
  e dua mai na vualiku, ena qai lako mai, mai nai cadracadra ni matanisiga, ena kaciva
  mai na Yacaqu,ena lako mai me saqati ira na ravouvou me vaka na vanataki ni dakai
  levu mai na vanua cecere, me vaka na dautuli kuro ni babia na tete.\\n26 O cei beka
  sa tukuna mai nai vakatekivu me keimami kila? Se na gauna sa oti yani, me keimami
  tukuna, ''Sa dodonu o Koya''? E dina ni sega ni dua me vakaraitaka, e dina e sega
  ni dua me cavuta, e dina e sega ni dua me rogoca nomu vosa.\\n27 Nai matai ni gauna
  Au tukuna vei Saioni, ''Raica o ira sa tu o ya!'' Au na qai solia ki Jerualemi o
  koya sa kauta mai nai rogorogo vinaka.\\n28 Ni''u rai yani, Au sega ni raica e dua
  na tamata, Ni''u vakaraici ira Au sega ni kunea rawa e dua na daulewa, na gauna
  Me''u tarogi ira kina sega e dua vei ira me vosa.\\n29 Sa dina sara sa ka walega,
  nodra cakacaka e maumau walega; na nodra matakau ceuti sa cagi walega ka veilecayaki.\\nChapter
  42\\n1 \\\"Raica! Na Noqu Tamata o koya Au tokona, na Noqu Digitaki sa reki kina
  vakalevu na Lomaqu! Au sa solia na Yaloqu ki Vua, ena vakayacora o koya na lewa
  dodonu vei ira na kai Matanitu tani.\\n2 Ena sega ni qolou vaka i cake na Domona,
  se kaikaila se me rogo levu tu ena veisaqata ni gaunisala.\\n3 Ena sega ni musuka
  na gasau sa voleka me kamusu, se bokoca na tavaya waiwai sa kubou walega; ena kauta
  mai na lewa dodonu kei na dina.\\n4 Ena sega ni vakasuka se me yalolailai, me yacova
  ni sa vakadeitaka na dodonu e vuravura; era na waraka na veiyanuyanu na Nonai vunau.\\\"\\n5
  Sa vosa vakaoqo na Kalou o Jiova, o Koya ka bulia na lomalagi ena ligana maqosa,
  ka tevuka yani na vuravura me ra bula mai na veika bula, ka solia nai cegu vei ira
  na lewe i vuravura, kei na yalona vei ira ga era lako voli kina:\\n6 \\\"Oi au o
  Jiova, sa kacivi Iko ena Noqu lewa dodonu, ka taura voli na ligamu; Au na maroroi
  iko ka soli iko mo veiyalayalatitaki vei ira na tamata, mo rarama vei ira na Matanitu
  tani,\\n7 Mo dolava na matadra na mataboko, mo sereki ira na kaivesu mai na vale
  ni veivesu, kei ira era vesuki tu ena butobuto mai na vale ni butobuto.\\n8 Oi au
  o Jiova, sai koya oqori na Yacaqu; na Noqu lagilagi me kua ni dua keirau lewe rua
  tukuna, na Noqu vakavinavinaka me kua ni vagolei ki na matakau ceuti.\\n9 Raica,
  na veika sa tukuna oti sa yacova mai oqo na kena gauna, kei na ka vou au sa vakaraitaka
  qo; ni bera ni qai basika mai au sa tukuna rawa vei kemudou.\\\"\\n10 Dou seretaka
  vei Jiova na sere vou, kei na vakavinavinaka Vua mai nai yalayala kei vuravura,
  Oi kemudou dou sa lako sobu kina wasawasa, kei na ka kecega sa sinai kina, na veiyanuyanu
  kei ira kecega na lewena!\\n11 Mera tabalaka na domodra na vanua dravuisiga kei
  na veika lelevu, na veikoro sa tiko kina o Kitari, kei ira na lewe i Sela mera lagasere,
  mera kaila mai ena dela ni ulunivanua.\\n12 Laivi ira me ra vakacaucautaki Jiova,
  me vakaraitaki na vakavinavinaka Vua ena vei yanuyanu.\\n13 O Jiova ena lako yani
  me vaka na qaqa; ena vakauqeti Koya vakai Koya me yalo qaqa me vaka na tamata sa
  vakarau me valu. Ena tabalaka mai na domona, io, mo kaci mai cake, ena vakamalumalumutaki
  ira rawa na Kena meca.\\n14 \\\"Au a qarauni Au sara tu ga vakavinaka ena dua na
  gauna balavu. Au tiko vakamalua ga ka tiko ga. Ia oqo Au na tagi me vaka na yalewa
  sa taratara, Au na vakarusa ka tiloma sara.\\n15 Au na vakacataka na veiulunivanua
  kei na veidelana, ka vakaraqosataka na kena kakana draudrau; au na kitaka na veiuciwai
  me ra vovodea mai, Au na vakamacara na vei tobu ni wai kece.\\n16 Au na kauti ira
  sobu na mataboko ena sala era sega ni kila; Au na liutaki ira ena sala era sega
  ni bau vakasamataka. Au na cakava na butobuto me rarama e matadra, kei na veivanua
  e veve me na dodonu yani. Na veika oqo Au na kitaka vei ira, Ni''u na sega ni biuti
  ira.\\n17 Era na qai vuki lesu, ka madua vakalevu sara, ni ra nuitaka tu na matakau
  ceuceu, ka ra dau tukuna kina matakau waicala rawarawa, ''Oi kemudou na neimami
  kalou.''\\n18 \\\"Dou rogoca, na didivara, ka raica, oi kemudou na mataboko, mo
  dou raica rawa.\\n19 O cei sa mataboko o koya ga na Noqu tamata, se didivara me
  vaka na noqui talai o koya ka''u sa tala? O cei sa mataboko me vakataki koya sa
  dodonu me vakataki koya na tamata i Jiova?\\n20 Sa levu na ka o sa raica, ka sa
  sega ga ni o vakasama; sa dolavi na daligamu, ia se sega tiko ga ni dua na ka o
  rogoca rawa.\\\" Dei Tu Ga O Isireli Ena Talaidredre\\n21 Sa marautaki ira na yalododonu
  o Jiova; ena vakalevulevuya nai vunau ka vakaturagataka.\\n22 Ia o ira na tamata
  oqo era butakoci ka tauri vakaukauwa; era sa coriti kece e nai keli, ka vunitaki
  ena loma ni vale ni veivesu; era sa tokitaki, ka sega e vakabula; ni ra tauri vakaukauwa,
  sega ni dua me tukuna, \\\"Me vakasukai lesu tale!\\\"\\n23 O cei vei kemudou me
  na dolava na daligana me rogoca na ka oqo? Me vakarorogo ka rogoca ena gauna sa
  muri mai?\\n24 O cei e soli ira na Jekope vei ira na dau vakacaca, kei Isireli vei
  ira na daubutako? Sega beka ni o Jiova, o koya eda sai valavala ca vua? Ni ra sega
  ni muria tiko Nona sala, se me ra talairawarawa ki na Nona i vunau.\\n25 O koya
  oqo sa solia ga vei koya na nona cudru waqawaqa kei na kaukauwa ni valu; ka vakamai
  koya ena yasana kece, e se sega tikoga ni liaci koya; sa tarai koya vakaca sara
  na kama, e se sega tikoga ni vakila na yalona e dua na ka.\\nChapter 43\\n1 Ia oqo,
  sa tukuna o Jiova, o koya ka buli iko, Jekope, kei Koya sa vakacokotaki iko Isireli
  \\\"Kakua ni o rere, ni''u sa voli iko, au a kacivi iko ena yacamu; o sa noqu.\\n2
  Ni o sa lako e loma ni wai, Au na tiko kei iko, kei na loma ni uciwai, ena sega
  ni luvuci iko. Ni o lakova ena loma ni bukawaqa, o na sega ni kama, ena sega ni
  yameci iko na yameyame ni bukawaqa.\\n3 Ni sai Au o Jiova na nomu Kalou, na yalosavasava
  ni Isireli, na nomui Vakabula; Au a soli Ijipita me kemui voli, o Iciopea kei Sepa
  ena vukumu.\\n4 O iko o sa talei sara e Mataqu, o sa dokai kina, Au a lomani iko;
  o koya oqo Au na solia na tagane vei iko, kei na tamata mei sau ni nomu bula.\\n5
  Kakua ni o rere, Ni''u sa tiko vata kei iko; Au na kauti ira nomu kawa mai na tokalau,
  ka vakasoqoni kemudou mai na ra;\\n6 Au na qai vosa ki na vualiku, ''Soli ira mai!''
  kei na ceva ''Kakua ni o tauri ira tiko!'' Kauti ira mai na luvequ tagane mai na
  vanua yawa, kei ira na luvequ goneyalewa mai nai yalayala kei vuravura\u2014\\n7
  O ira kece era vakayacani ena yacaqu, ka ra buli me laurai kina na Noqu lagilagi;
  Au a vakataucokotaki koya, io, Au a buli koya.\\\"\\n8 Dou kauti ira mai na mataboko
  ka tiko na matana, kei ira na didivara ka tiko na daligadra.\\n9 Mera vakasoqoni
  vata na veimatanitu kecega; kei ira taucoko na tamata mera soqoni vata mai. O cei
  vei ira me na tukuna rawa na veika oqo, ka vakaraitaka vei keda na veika sa oti?
  Mera kauti ira mai na nodra dauvakadinadina mera vakadonui kina se me ra rogoca
  ka tukuna \\\"E sa ka dina.\\\"\\n10 \\\"Sai kemudou na Noqui vakadinadina,\\\"
  sa tukuna o Jiova, \\\"Kei ira na Noqu tamata ka''u sa digitaka, mo dou sa kunea
  ka vakadinati Au, ka kila ni sai Au o Koya, sa sega na Kalou ka bula e liu ka muri
  oi Au, ka na sega e dua me na taravi Au.\\n11 Oi au, io oi au ga o Jiova, ka sa
  sega tale nai vakabula oi Au ga.\\n12 Oi au ka''u a tukuna, ka ia na veivakabulai
  ka vakatakila ni sa sega veikemudou na kalou tani; ia sai kemudou ga dou na tukuni
  Au, Ni''u sa Kalou,\\\" sa tukuna o Jiova.\\n13 Sa dina sara mai na siga oqo, sai
  au ga; ka sega e dua mena vakabula rawa mai na ligaqu; au cakacaka tiko, o cei me
  tarova?\\\"\\n14 Sa tukuna vakaoqo o Jiova, na nomudou i vakabula, na Yalosavasava
  ni Isireli. \\\"Ena vukumudou Au na talai ki Papiloni, ka vakauti ira kece mai na
  dro\u2014kei ira na kai Kalatia ka ra dau mamarau tiko na nodra waqa, na nodra marau
  me tagi.\\n15 Oi au o Jiova, na nomudou Le Dua Yalosavasava, o Koya ka buli ira
  na Isireli oi Au na nomudou Tui.\\\"\\n16 Sa tukuna vakaoqo o Jiova, o koya ka cakava
  e dua na sala e loma ni wasawasa kei na dua na gaunisala totoka e na maliwa ni wai
  voravora,\\n17 O koya ka kauta mai na qiqi ni valu kei na ose, na mataivalu kei
  na nona kaukauwa kece (era na davo vata kece, e ra, ka ra na sega ni tucake tale;
  era na vakawabokotaki, ka bokoci laivi me vaka na cina):\\n18 \\\"Dou kakua ni nanuma
  na veika sa oti, se vakasamataka vakabibi na ka makawa.\\n19 Raica, au na cakava
  na ka vou, ena tubu ga oqo, dou na sega ni kila? Au na cakava e dua na sala ena
  vanua dravuisiga kei na uciwai ena vanua talasiga.\\n20 Ena rokovi au na manumanu
  kila ni vanua, na koli ni veikau kei na ositereji, baleta Ni''u solia na wai ena
  vanua dravuisiga kei na uciwai ena vanua talasiga, me ra gunu kina o ira Noqu tamata,
  Ka''u sa digitaka.\\n21 O ira na tamata oqo Ka''u a bulia ka vakataucokotaki i ra
  me Noqu, me ra na tukuna tiko na Noqu lagilagi.\\n22 \\\"Ia o a sega ni bau kacivi
  Au Jekope, o sa oca ni qaravi Au, Isireli.\\n23 O sega ni kauta mai vei au na sipi
  mei soro kama, se mo dokai Au ena caka madrali. Au a sega ni kerei kemudou, mo dou
  veiqaravi e na witi, se me''u vakaocai kemudou e na i madrali boivinaka.\\n24 O
  sega ni bau volia vei Au e dua na ka kamikamica e nai lavo, kosega ni vakamamautaki
  Au ena uro ni nomui soro; ia o sa qai maivakacolati Au ena nomui valavala ca, ka
  o vakaocataki Au ena nomu caka cala.\\n25 \\\"Oi au, io, oi au ga, au sa bokoca
  na nomu talaidredre me sa vukuqu duaduaga, au na sega ni nanuma tale tiko na nomui
  valavala ca.\\n26 Mo dau vakananumi Au; me daru mai dabe vata mada; mo vakaraitaka
  mai nomu cala, me rawa ni o vakadonui kina.\\n27 Nai matai ni tamamu e valavala
  ca, o ira talega na nomu dauvakavuvuli era talaidredre vei Au.\\n28 O koya oqo Au
  na yaviti ira kina na ravouvou ni vale tabu, ka soli ira na Jekope kina cudruvi,
  kei Isireli me vakarogocataki.\\nChapter 44\\n1 \\\"Mo vakarorogo oqo, Jekope na
  Noqu tamata, o iko talega Isireli Ka''u sa digitaka.\\n2 Sa tukuna vakaoqo o Jiova
  ka buli iko kei na nona vakataucokotaki iko mai na kete, ena vukei iko o Koya: ''Mo
  kakua ni rere, Jekope na Noqu tamata; kei iko talega Jesuruni, o koya Au sa digitaka.\\n3
  Au na livia yani na wai vua sa via gunu, kei na wai e vuqa ena vanua mamaca; au
  na sovaraka na Yaloqu ki vei ira nomu kawa, kei na Noqu veivakalouvinakataki vei
  ira na nomu i sema vakadra;\\n4 Era na tubu cake vakatotolo ena maliwa ni co me
  vaka na veiwilou ena bati ni wai drodro'';\\n5 Ena tukuna e dua, ''Oi au sa nei
  Jiova,'' e dua tale ena vakatokayacataki ena yacai Jekope; e dua tale ena vola ki
  na ligana, sa ''nei Jiova,'' ka vakatokai koya e na yaca i Isireli.\\n6 \\\"Sa tukuna
  vaka oqo o Jiova, na nodra Tui na Isireli, o Koya na nodra i Vakabula, o Jiova ni
  lewe vuqa: ''Oi Au nai matai Oi Au nai tinitini; e sega tale ni dua na Kalou e taravi
  Au.\\n7 O cei beka e rawa ni kacivaka me vakataki au? Ka tukuna ka tusanaka mai
  na ka ena yaco e na vukuqu, mai na gauna ka''u a vakatikori ira kina na tamata e
  liu, kei na ka se bera ni yaco, kei na ka ena yaco mai muri, me ra tukuna mai.\\n8
  Dou kakua ni taqaya, se rere; Au a sega beka ni tukuna oti vei kemudou mai na gauna
  o ya, ni''u sa vakaraitaka? Sai kemudou na Noqu i vakadinadina. E dua beka na Kalou
  e volekati au? E dina sara ni sega tale e dua na Vatu dina; au sega tale ni qai
  kila e dua.''\\\"\\n9 O ira era bulia na matakau, na ka kece oqori e sega na betena,
  kei na nodra ka talei e sega ni dua na ka vinaka e kauta mai; era sa tukuni ira
  tikoga, era sega ni raica se mera kila ni ra na madua mai.\\n10 O cei e rawa ni
  bulia e dua na kalou se ceuta e dua na matakau e sega ni dua na ka ena kauta mai?\\n11
  E dina ni o ira na nona i lawalawa era na madua; o ira na kena matai, era tamata
  ga. Me ra vakasoqoni vata, me ra tucake, era na domobula, era na madua vata kece.\\n12
  Na daucaka kaukamea sa taura e dua nai qila ka taura na qilaiso sa waqa tu, ka vakayagoyagovinakataka
  e nai tuki, ka tulia ena kaukauwa taucoko ni ligana. Sa dreve ga, ena nona malumalumu,
  ni se bera tu ni kana; e sega ni bau gunu wai sa qai malumalumu sara kina.\\n13
  Na matai ni kau sa dreta na nona wai vakarau, sa vola ena peni kau; sa qai qivia
  ena i qivi, sa qai makataka me cowiri wavoki, sa qai bulia me vaka nai bulibuli
  ni tamata me vaka na rairai totoka ni dua na tamata, me tu ga e loma ni vale.\\n14
  Sa musuka sobu na sitari me nona, ka sa kauta na nokonoko kei na oki; sa maroroya
  me yaga vua na kau ni veikau. Sa tei e dua na vuni paini, ka sa vakabulabulataka
  na uca.\\n15 Ena qai yaga kina me vakama e dua na tamata, me qai taura mai kina
  e dua, me vakatakatai koya kina; io, e vakawaqa me vavi madrai kina; se me bulia
  e dua na kalou ka qarava; se vakaduria e dua na matakau ceuceu, ka cuva sobu kina.\\n16
  E vakama na kena veimama ena buka waqa; na veimama qo e kania kina na lewe ni manumanu;
  sa tavu ka tavu vinaka, ka sa mamau. Sa tatalai vinaka ka vaka, \\\"Au sa katakata
  dina, au sa raica na bukawaqa.\\\"\\n17 Na kena vo sa cakava kina e dua na kalou,
  e ceuta na matakau. E cuva sobu kina ka qarava, e masu kina ka tukuna, \\\"Mo sereki
  au, ni o sa noqu kalou!\\\"\\n18 Era sega ni kila se vakasamataka, ni sa sogota
  na matadra o Koya me ra kua ni raica, kei na yalodra me ra kua ni ciqoma rawa.\\n19
  E sega ni dua me bau kila rawa e yalona, sa sega na vuku se kila ka me tukuna mai,
  \\\"Au sa vakama na kena veimama ena buka, io, au sa vavia talega na madrai ena
  kena qilaiso, au sa tavuna na lewe ni manumanu ka''u sa kania; na kenai vovo me''u
  na qai cakava me ka e vakasisila? Me''u na bale sobu beka e na dua na i binibini
  kau?\\\"\\n20 Sa kania na dravusa; na yalo dauveivakaisini sa vakacalai koya; ka
  sa sega ni rawa ni vakabula rawa na lomana, se me tukuna, \\\"E sega ni tiko beka
  e ligaqu i matau e dua na ka lasu?\\\"\\n21 \\\"Mo nanuma na ka oqo, o iko Jekope,
  kei Isireli, ni o sa Noqu tamata; Au a buli iko, o iko na noqu tamata, o iko Isireli,
  o na sega ni guilecavi mai vei Au!\\n22 Au sa vakaseavutaka yani, me vaka na yali
  ni o loaloa, na nomu caka cala, kei na nomui valavala ca me vaka na o veivukayaki,
  mo lesu mai vei Au, Ni''u sa voli iko.\\\"\\n23 Mo lagasere mai, na lomalagi, ni
  sa vakayacora o Jiova; dou kaila, na yasai vuravura era; dou tabalaka mai na sere,
  na veiulunivanua, na veikau, kei na kau yadua sa tu kina! Ni sa voli Jekope oti
  o Jiova, ka sa vakarokorokotaki Koya ena vuku i Isireli.\\n24 Sa tukuna vakaoqo
  o Jiova, o koya na nomui Vakabula, kei Koya ka buli iko mai na kete; \\\"Oi au o
  Jiova, sa kitaka na ka kecega, ka tevuka duadua ga na lomalagi, ka dedeka yani na
  vuravura vakai Au ga;\\n25 Au a vakatawayagataka na nodra ka mana na dau rawa i
  lavo ena ka lasu, ka vakasesei ira na dau via rairai; ka vukici ira vakanadaku na
  vuku, ka veisautaka na nodra vuku me lialia;\\n26 Ka vakadeitaka ena vosa ni Nona
  tamata, ka qarava na nodra i vakavuvuli ni Nona i talatala; ka tukuna ki Jerusalemi,
  ''O na tawani mai;'' ki na veikoro e Juta,'' ''Dou na tara.'' Ka tara cake na kena
  veitikina sa ca au na vakavinakataka tale;\\n27 Sa vosa ki na wasa titobu, ''Mo
  mamaca mai! Au na vakadiva na nomu veiuciwai'';\\n28 Sa vosa ena vuku i Sairusi,
  ''O koya na Noqui vakatawa, o koya ena cakava kece na ka Au dau vinakata, sa tukuna
  ki Jerusalemi, \\\"O na tara tale,\\\" ki na vale tabu, \\\"Sa na vakarau vakasoburi
  na nomu yavu.\\\"\\nChapter 45\\n1 \\\"Sa tukuna vakaoqo o Jiova, vua na Nonai lumuti,
  ki vei Sairusi, na ligana i matau au sa taura tiko\u2014me vakamalumalumutaki na
  veimatanitu vua ka sereka na nodra i sasabai ni valu na tui, ka dolava e matana
  na katuba e rua, me rawa ni kua ni sogoti na matamata ni koro:\\n2 ''Au na liutaki
  iko ka vakadodonutaka na veivanua sukusukura; au na basuraka vakalalai na matamata
  parasa, ka musuraka na kenai vesu kaukamea.\\n3 Au na solia vei iko na i yau kumuni
  ena butobuto kei nai yau talei ka vunitaki ena yasana tabu, mo rawa ni kila kina
  ni sai Au, o Jiova, o koya ka kacivi iko ena yacamu, Ka''u Kalou ni Isireli.\\n4
  E na vuku i Jekope na Noqu tamata, kei Isireli na Noqu digitaki, Au a kacivi iko
  dina ena yacamu; Au a vakayacani iko, io o iko o sega ni kilai Au.\\n5 Sai Au o
  Jiova, ka sega tale e dua; e sega tale ni dua na Kalou sai Au ga, Au a vauci iko,
  ia o iko o sega tikoga ni kilai Au,\\n6 Me ra na kila mai nai cadracadra ni siga
  kei na kena i dromudromu ni sega tale ni dua oi Au ga, Oi Au o Jiova ka sega tale
  e dua;\\n7 Au bulia na rarama kei na butobuto talega, Au vakayacora na veisaututaki
  ka vakatubura na dausiga; Oi Au, o Jiova, sa cakava na ka kecega oqo.''\\n8 \\\"Me
  tau sobu mai na uca, mai lomalagi e cake ka me sovaraka mai na maliwa lala na dodonu;
  me tadola o vuravura, me basika mai na bula, ena qai vakaraitaki koya na dodonu
  ni rau sa tubu vata oi Au o Jiova sa kitaka.\\n9 \\\"Ena ca o koya sa veivorati
  kei Koya ka buli koya! Nai caca ni bilo sa duavata kei nai caca ni bilo ni qele
  kei vuravura! Me tukuna li na qele vei koya ka buli koya, a cava o bulia tiko? Se
  na nomu cakacaka ni ligamu me tukuna, ''E sega tu na ligana?''\\n10 Ena ca o koya
  sa tukuna vei tamana, ''A cava o sa vakatubura?'' Se vua na yalewa, ''A cava o sa
  vakasucuma mai?''\\\"\\n11 Sa tukuna vakaoqo o Jiova, na yalosavasava ni Isireli,
  kei na nona Dauveibuli: \\\"Mo tarogi Au ena veika se bera mai e na vukudra na luvequ
  tagane; kei na cakacaka talega ni ligaqu me vaka nomu i vakaro vei au.\\n12 Au a
  bulia na vuravura, kei ira talega na tamata me ra tiko kina\u2014na ligaqu\u2014
  e dedeka tu na lomalagi, kei na kena vavakoso Au vakaroti ira tu.\\n13 Au a laveti
  koya cake ena yalododonu, Au na dusimaka vua nona sala kece; ena qai tara o koya
  Noqu koro levu ena qai sereki ira Noqu tamata era vesu tu sega e na dua na i sau
  se ka ni veisausaumi, \\\" sa tukuna o Jiova ni lewe vuqa.\\n14 Sa tukuna vakaoqo
  o Jiova; \\\"Nai yau kei Ijipita kei na nona veivoli o Kusa, kei ira na kai Sipa
  era tamata vatukaivinaka, era na lako mai vei iko, era na nomu ga, era na muri iko,
  era na vesuki tu ni ra lako tu, era na cuva vei iko. Era na vakamasuti iko ka vaka,
  ''E dina sara sa tiko kei iko o Jiova, ena sega tale e dua, ena sega tale e dua
  na Kalou.''\\\"\\n15 E dina o Ni sa Kalou, ka vunitaki Kemuni, na Kalou i Isireli,
  nai Vakabula!\\n16 Era na madua mai era na taqaya vata kece, era na veilecayaki
  vata talega, o ira na dau buli matakau.\\n17 Ia o Isireli ena vakabulai mai vei
  Jiova ena veivakabulai e sega ni mudu; mo kakua ni madua se yatayata me yacova na
  sega ni mudu ni gauna.\\n18 Ni sa vosa vakaoqo o Jiova, ka bulia na lomalagi, sa
  Kalou o koya ka tauyavutaka na vuravura ni bulia, ka vakataudeitaka, e sega ni bulia
  me qai lala tu, e bulia me tawani, \\\"Sai au o Jiova, ka sega e dua tale.\\n19
  Au sega ni dau vosa vaka vuni, ena dua na yasana buto kei vuravura; au sega ni tukuna
  vei ira na kawa i Jekope, ''Mo dou vakasaqarai Au vagumatua,'' Oi Au, o Jiova, sa
  dau vosa ga vakadodonu, Au dau vakatakila ga na veika e dina.\\n20 \\\"Dou vakasoqoni
  vata ka qai lako mai, dou toro veivolekati, oi kemudou ka dro mai na veimatanitu.
  E sega vei ira na kila ka, era colata na kau ni nodra matakau ceuceu, ka masu vua
  e dua na kalou ka sega ni rawa ni ia na veivakabulai.\\n21 Dou tukuni kemudou ka
  kauta mai na nomudou kisi; io, me ra veivosaki vata mada. O cei sa vakaraitaka na
  ka oqo ena gauna sa oti? O cei sa bau tukuna ena gauna o ya? Sega beka ni o Au,
  o Jiova? E sega tale ni dua na Kalou me keirau lewe rua tukuna, na Kalou dodonu
  kai Vakabula; e sega tale ni dua me torovi Au.\\n22 \\\"Dou raici Au matua, mo dou
  bula, vei kemudou nai yalayala kei vuravura! Ni sai Au ga na Kalou, ka sega tale
  e dua.\\n23 Au sa bubului ga vaka i Au; na dodonu ni noqu vosa sa lako tani mai
  gusuqu ka sega ni na suka tale, ena tekiduru vei Au na duru vakaaduaga, era na vosa
  bubului na yame kecega.\\n24 Ena tukuna na tamata, ''Sa dina o Jiova ga au na dodonu
  kina ka vakaukauwataki. Era na lako mai vei Koya na tamata kecega, era na madualaki
  ira ni ra caka ca vua.\\n25 Vei Jiova o ira kece na kawa i Isireli era na vakadonui,
  ka vakaiukuukutaki.''\\\"\\nChapter 46\\n1 Sa vakatobuicu sobu o Peli, sa vakalairoro
  sobu talega o Nipo. Na nodra matakau sa tiko ena dela ni manumanu kila kei na dela
  ni bulumakau. Sa vakasinaiti tu ena i yaya na nomudou qiqi, ka sa na colacola bibi
  vua na manumanu ni sa oca tu.\\n2 E rau vakalairoro vata, ka cuva sobu vata, e rau
  na sega ni na drotaka nai colacola bibi, ia e rau na kau ga yani vakabobula.\\n3
  \\\"Dou vakarorogo mai vei Au, na mataqali i Jekope, kei ira na vo mai na mataqali
  i Isireli. Au a keveti kemudou voli ena gauna ni nomudou sucu, ka dou maroroi voli
  mai na kete:\\n4 Me yacova ni dou sa qase yani, Oi Au sai Au tikoga, ni dou sa yacova
  na ulu sika Au se keveti kemudou ga! Au sa cakava tiko Au na cakava tikoga; Au a
  roqoti kemudou ka ''u na vakabulai kemudou.\\n5 \\\"O cei dou na vakatautauvatana
  kei Au, me keirau tautauvata me vakataki Au sara ga?\\n6 Era sovaraka tani na koula
  mai na kena taga, ka vakarautaka na siliva ena i vakarau; era sauma e dua na matai
  ni koula ka bulia kina o koya e dua na kalou; era tekicuva sobu ka vakarokoroko
  vua.\\n7 Era vakatauca ki domodra, ka colata era vakaduria ena kenai tutu ka tucake
  tu; mai na vanua e duri tu kina e sega ni bau yavala. E dina ni ra kaciva yani ka
  sega ni bau sauma mai ena sega ni rawa ni na vakabulai koya mai na nona rarawa.\\n8
  \\\"Dou nanuma mada qo, ka vakaraitaki kemudou mai; vakalesuya tale mada mai nomudou
  vakasama, Oi kemudou na dauvuki tani.\\n9 Dou nanuma mada na veika sa oti, ni sai
  Au na Kalou, ka sega ni dua tale; Oi Au na Kalou ka sega e dua me keirau tautauvata,\\n10
  Au sa vakaraitaka mai nai vakatekivu kinai vakataotioti, kei na veigauna makawa
  yani Au sa tukuna na ka se bera ni caka, ni tukuni, ''Na noqu lewa ena dei tu ga,
  au na cakava na ka au vinakata me''u cakava,''\\n11 Au na kaciva e dua na manumanu
  vuka levu mai na tokalau, na tamata sa na vakayacora na noqui naki mai na vanua
  yawa. Au sa cavuta dina, Au na vakayacora dina sara. Au sa nakita; Au na qai cakava
  talega.\\n12 \\\"Dou vakarorogo vei Au, oi kemudou na yaloqa, ka sa yawa sara ena
  caka dodonu:\\n13 Au sa kauta mai na Noqu yalododonu me voleka mai, ena sega ni
  yawa sara; Noqu veivakabulai ena sega ni yawa Au na biuta e Saioni na veivakabulai,
  me rogo kina o Isireli na noqu lagilagi.\\nChapter 47\\n1 \\\"Lako sobu mai ka mai
  dabe ena kuvu ni qele, o iko na goneyalewa savasava ni Papiloni; ka dabe sara ena
  qele ka sega nai dabedabe vakaturaga, o iko na goneyalewa ni kai Kalatia! O na sega
  ni na vakatokai tale mo uasivi ka totoka.\\n2 Taura na vatu i qaqi ka qaqia na sila.
  Kauta tani nomu i ubi, ka luvata nomu liku, cega me yaco ki sagamu, ka takosova
  na uciwai.\\n3 Na nomu luvawale ena laurai, io na nomudou madua ena raici, Au na
  sauma lesu nomudou ca, ka sega e dua na tamata me keirau na veivosovosoti.\\\"\\n4
  Na neimami i Vakabula, o Jiova ni lewe vuqa na Yacana, na Yalo Savasava ni Isireli.\\n5
  \\\"Mo dabe ena vakanomodi, ka lako yani ena butobuto, o iko na goneyalewa ni Kalatia;
  ni o na sega ni kacivi tale me Mrama ni Veimatanitu.\\n6 Au a rarawataki ira tiko
  na Noqu tamata, Au a vakacacana na noqui votavota, ka soli ira kina ligamu. O sega
  ni bau yalololoma vei ira; vei ira na qase o sa vakabibitaka vakalevu vei ira na
  nomui vua.\\n7 O qai tukuna, ''Au sa marama dina me sega ni mudu,'' O sega sara
  ni biuta ki yalomu na veika oqo, se vakasamataka na kena i tinitini.\\n8 \\\"Mo
  rogoca sara na ka oqo, o iko o daumarau vakalialia, ka sa tiko vinaka, ka tukuna
  ena yalomu, ''O au ga, ka sega tale e dua me keirau lewe rua; au na sega ni tiko
  me vaka e dua na yada, au sega talega ni vakila nodra mate na gone lalai'';\\n9
  Io ena rua na ka oqo, ena lako mai vei iko ena dua ga na siga vakakidacala, na mate
  ni luvemu kei na nomu tiko mo yada. Ena yaco vei iko vakaukauwa sara ni sa dau levu
  na nomu caka mana lasu, kei na nomu i yau levu mai na nomu daucakaisausau.\\n10
  \\\"O iko o sa nuitaka tu ga nomui valavala ca; o tukuna, ''E sega ni bau dua e
  raici au;'' na nomu vuku kei na ka o kila e vei cei iko tani; o tukuna e yalomu,
  ''Oi au ga ka sega tale e dua oi au ga.''\\n11 O koya qo ena tarai iko kina na butobuto;
  o na sega ni kila se tubu mai vei. Ena yacovi iko na veika rarawa; o na sega ni
  rawa ni cemuria tani, ena yacovi iko vakasauri na veivakarusai, o na sega ni namaka.\\n12
  \\\"Mo tucake sara ga oqo kei na nomu daucakaisausau kei na veika lelevu o sa rawata,
  ena nomu dau caka mana lasulasu, ni o se cakava gone sara tikoga mai\u2014se dua
  na ka ona rawata mai kina, se o na qai gumatua sara kina.\\n13 Sa vakaocai iko ga
  na levu ni bose ka, o ira sara ga na dauvakarairaimata ki lomalagi, kei ira era
  dauvakarairai kalokalo kei ira era dau wili vula me ra tu mada mai ka vakabulai
  iko ena veika sa vakarau yaco yani oqo.\\n14 Raica, era na vaka na vunisila, era
  na kama yani ena bukawaqa;era na sega ni vakabulai ira rawa mai na kaukauwa ni yameyame
  ni buka; ena sega ni vaka na qilaiso me da vakatakatai kina, se na bukawaqa me da
  dabe volekata!\\n15 Era na vaka kina vei iko o ira o a dau oca vei ira, era dauveivoli
  kei iko o ira ni o se qai tabagone mai; era na vakasaqara e vei na vanua era tiko
  kina, ena sega ni dua me na vukei iko rawa.\\nChapter 48\\n1 \\\"Dou rogoca mada,
  na mataqali i Jekope, Oi kemudou sa kacivi ena yacai Isireli, ka sa lako mai ena
  mata ni wai nei Juta; ka bubului ena yaca i Jiova, ka daucavuta na Kalou nei Isireli,
  ia ka sega ni cavuti ena dina kei na yalododonu;\\n2 Era vakatokai ira tiko mera
  lewe ni koro Tabu, ka ravita na Kalou ni Isireli; o Jiova ni lewe vuqa na yacana:\\n3
  \\\"Au sa tukuna na ka sa caka oti mai nai vakatekivu sara; e lako mai ena gusuqu
  Ka''u vinakata me ra rogoca. Au a vakayacora sara vakasauri ka sa vakavotukana sara.\\n4
  Ni''u sa kila ni o a sega ni duavata kina, ni sa dali kaukamea na domomu, kei na
  yadremu e parasa,\\n5 Mo kila sara mai nai vakatekivu Au sa vakaraitaka oti vei
  iko; ni se bera ni qai yaco mai Au sa dau cavuta tiko vei iko, de o qai tukuna,
  ''Na noqu matakau ga e cakava na ka oqo, na noqu matakau ceuceu kei na noqu matakau
  sa vakawaicalataki e vakarota me yaco na ka oqo.''\\n6 \\\"O sa rogoca; ka raica
  kece na ka sa yaco. O na sega beka ni via kacivaka talega? Au na vakayacori iko
  mo dau rogoca na ka vou ena gauna sara ga oqo, na ka vuni o na sega ni rawa ni kila.\\n7
  Era qai buli ga oqo ka sega mai nai vakatekivu; o a sega ni dau rogoca tu me yacova
  ni kua, de o baci tukuna, ''Au sa kila oti tu.''\\n8 E dina sara o a sega ni rogoca,
  e dina sara o a sega ni kila; e dina sara mai na gauna sara e liu na daligamu e
  sega tu ni rogo rawa.Ni''u sa kila oti ni o dau cakacaka vakailasu sara, ni o sa
  vakatokai oti tu na dautalaidredre ni o se tiko sara mai na kete.\\n9 \\\"Ena vuku
  ni Yacaqu Au na vakadavora mada na Noqu cudru, kei na noqui rogorogo Au na tarovi
  au ga, me rawa Ni''u kakua kina ni musuki iko laivi.\\n10 Raica, Au sa vakasavasavataki
  iko, ia ka sega ni vaka na siliva; au a vakatovolei iko ena lovo buka waqa ni veivakararawataki.\\n11
  Ena vukuqu, ena vukuqu ga, Au na cakava; ena cava era vakadukadukalitaka kina na
  Yacaqu? Au na sega ni solia vua tale e dua na noqu lagilagi.\\n12 \\\"Dou rogoci
  au mada, na Jekope, kei Isireli, o koya Au sa kaciva; sai Au oqo, Au nai vakatekivu,
  Au talega nai Vakataotioti.\\n13 Na ligaqu ga e vakadavora na yavu e dabe kina na
  vuravura, kei na ligaqu i matau e dedeka na lomalagi, ni''u kacivi ira, era na tucake
  vata kece.\\n14 \\\"Dou soqoni vata kece mai, ka vakatudaliga! O cei vei ira e vakaraitaka
  na veika oqo? O Jiova e lomani koya, me cakava na ka e vinakata e Papiloni, kei
  na ligana ena vakacacani ira na kai Kalatia.\\n15 Oi, au, sa tukuna oti; io, Au
  a kacivi koya, Au a kauti koya mai, ena vuavuai na nona i lakolako.\\n16 \\\"Dou
  toro mai vei Au, ka rogoca, Au sega ni dau vosa ena vanua vuni tekivu mai nai vakatekivu;
  mai nai vakatekivu Au sa bula tiko, o koya sa talai au mai oqo, na Kalou o Jiova
  kei na Yalona.\\\"\\n17 Sa vosa vaka oqo o Jiova na nomudou i Vakabula, na Le Dua
  Yalo Savasava ni Isireli; \\\"Oi au o Jiova na nomudou Kalou, ka vakavulici iko
  mo vutuniyau, ka tuberi kemudou ena sala e dodonu mo dou lako tiko kina.\\n18 Ke
  o vakarorogo kina Noqui vakaro! Na nomu vakacegu ena drodro tu me vaka na uciwai
  malumu, kei na nomu yalododonu ena vaka na ua ni wasawasa.\\n19 Na nomu kawa talega
  era na vaka na nuku, ena sega ni tagutuvi laivi na yacana se me dua e vakacacani
  mai na mataqu.\\\"\\n20 Dou biubiu mai Papiloni! Ka drovaki ira na kai Kalatia!
  Ena domo ni lagalaga sere, kacivaka ka vakaraitaka yani, vakadewataka kina! yalayala
  kei vuravura; ka vaka, \\\"O Jiova sa veivakabulai vei ira na Nona tamata na Jekope!\\\"\\n21
  Era sega ni bau via gunu ni''u liutaki ira tiko ena loma ni vanua dravuisiga; sa
  vakavuna me dave mai na wai mai na loma ni vatu; e samuta i rua na vatu ka dave
  mai kina na wai.\\n22 \\\"E sega na vakacegu,\\\" sa tukuna o Jiova, \\\"Vei ira
  nai valavala ca.\\\"\\nChapter 49\\n1 \\\"Dou vakarorogo vei Au, na veiyanuyanu,
  ka vakatudaliga mai oi kemudou mai na vanua yawa! O Jiova sa kacivi Au mai na kato
  ni gone ka sa vakayacani Au mai na loma ni kete i tinaqu.\\n2 Ka sa bulia na gusuqu
  me vaka nai seleiwau gata; ka qai vunitaki Au ena i yaloyalo ni ligana, ka qai lumuti
  Au me''u caliva tu me vaka na kaukamea, ka qai vunitaki Au ena nona taga ni gasau.\\\"\\n3
  \\\"Sa qai tukuna vei au o Koya, ''O iko na Noqu tamata, Isireli, mai vei iko Au
  na vakacaucautaki.''\\n4 Au a qai tukuna, ''Au sa oca ka sega na betena, Au vakayalia
  na noqu kaukauwa ka sega ni dua na ka au taura lesu, io na kequi sau dodonu dina
  ga sa tu vei Jiova, kei na noqu cakacaka sa tu vua na noqu Kalou.''\\\"\\n5 \\\"Oqo
  sa tukuna o Jiova, o koya ka buli Au mai na kato ni gone me''u nona tamata, me''u
  kauti ira na Jekope lesu mai vei Koya, me ra vakasoqoni vata vei Koya o ira na Isireli
  (me rawa ni''u lagilagi kina ena matai Jiova, ni sa vuni Noqu kaukauwa na Noqu Kalou.)''\\n6
  Oqo na Nona vosa dina ni tukuna, ''Sa ka lailai mo Noqu tamata mo vueta cake na
  veimataqali i Jekope, ka vakasuka lesu na ka maroroi nei Isireli, Au na soli iko
  talega mo nodra rarama na Veimatanitu tani, Mo yaco talega mo vu ni bula ena Vukuqu
  kina i yalayala kei vuravura.''\\\"\\n7 Sa tukuna vakaoqo o Jiova, nai Vakabula
  ni Isireli, na nodra Yalo Savasava, era na beci Koya na tamata, era na vakasisilataki
  Koya na lewe ni vanua, o Koya na tamata nodra na Turaga, \\\"O ira na tui era na
  raica ka tucake mai, o ira talega na ravouvou era cuva ka vakarokoroko vua, ena
  vuku i Jiova o Koya sa dau yalodina, o Koya na Yalosavasava ni Isireli; o Koya sa
  digitaki Iko.\\\"\\n8 Sa tukuna vakaoqo o Jiova; \\\"Ena gauna sa lokuci Au a rogoci
  iko, kei na siga ni veivakabulai Au a vukei iko; Au na maroroi iko ka soli iko mo
  veiyalayalati kei ira na tamata, mo vakatoroicaketaki vuravura, me rawa ni tawani
  tale na veivanua sa lala tu;\\n9 Mo tukuna talega vei ira na vesuki, ''Dou lako
  yani,'' vei ira ka tiko ena butobuto, ''Dou lako mai ka vakaraitaki kemudou,'' \\\"Era
  na kana ena gaunisala, na nodra veico drokadroka ena tu mai ena veiyasana cecere.\\n10
  Era na sega ni viakana se viagunu, ena sega ni vakacacani ira na katakata se na
  siga, ni o Koya ka lomani ira e liutaki ira tiko, ena tuberi ira talega kina mata
  ni wai vure.\\n11 Au na cakava na Noqu veiulunivanua me gaunisala, ena vakaceceretaki
  na veisala buli kece.\\n12 E dina ni ra na lako vakayawa sara mai, raica o ira mai
  na vualiku kei na ra, kei ira vata kece mai na vanua o Sainimi.\\\"\\n13 Mo lagasere
  mai, na lomalagi! Ka reki, na vuravura! Ka kacabote mai na lagasere, na ulunivanua!
  Ni sa vakacegui ira na nona tamata o Jiova, ena lomani ira o ira era vakaleqai.\\n14
  Ia sa tukuna o Saioni, \\\"O Jiova sa biuti au, ka sa guilecavi au talega na noqu
  turaga.\\\"\\n15 \\\"E na rawa li vua e dua na yalewa me na guilecava na luvena
  se qai sucu, me kua ni lomana na luvena na lewe ni ketena? E dina sara e rawa ni
  guilecava, io, oi Au, au na sega sara ni rawa ni na guilecavi iko.\\n16 Mo raica,
  Au sa ceuti iko tu ena qeteqete ni ligaqu; a nomu bai sa tikotiko ga e mataqu.\\n17
  O ira na luvemu tagane era na lako kusarawa mai; o ira na dau vakacacani iko kei
  ira na dau butakoci iko era na lako tani mai vei iko.\\n18 Mo tacake, ka veiraiyaki,
  o ira kecega oqo era sa soqoni vata mai, era sa lako mai vei iko me vaka na kena
  dina ni Noqu bula,\\\" sa tukuna o Jiova; \\\"O ira kecega oqo o na vakaisulutaki
  iko kina, me vaka na ka ni ukuuku ka vauca vei iko me vaka sa ia na yalewa sa qai
  vakawati.\\n19 \\\"Ena nomu vanua sa lala ka vakarusai tu, e sa na lailai ka sega
  ni veirauti vei ira na lewe ni vanua; kei ira era via tilomi iko era na yawa sara.\\n20
  O na tauri ira na gone, ni o sa vakayalia eso vei ira, era na vosa e daligamu, ka
  vaka ''Sa lailai vei keimami na vanua oqo, mo solia vei au e dua na vanua me''u
  na tiko kina.''\\n21 O na qai vosa e yalomu, ''O cei ka vakatuburi ira oqo me noqu,
  ni ra sa mai yali taucoko na luvequ ka''u sa tu wale tu ga oqo, na bobula, ka dau
  veilakoyaki vaka ka vaka? O cei sa susugi ira cake oqo? Au a biu laivi tu; ia o
  ira oqo era a tiko mai vei?''\\\"\\n22 Sa tukuna o Jiova na Kalou, \\\"Raica Au
  sa laveta cake na ligaqu me vakadinadina vei ira na veimatanitu, ka vakaduria na
  Noqu kuila vei ira na tamata; era na keveti ira mai na luvemu tagane ena ligadra,
  kei na luvemu yalewa ena laveti mai e tabadra;\\n23 O ira na luvemu era na susugi
  mai vei ira na tui, kei ira na nodra marama era na mai veiqaravi vei iko; Era na
  mai cuva sobu e matamu ka vakanamata ki na qele, ka quraka laivi na kuvu mai na
  yavamu. Mo na kila kina ni sai Au o Jiova, ni ra na sega ni madua o ira era dau
  waraki Au.\\\"\\n24 Me na kau tani li nai toki ni valu mai vua na qaqa, se o ira
  era bobula ni yalododonu me ra na sereki?\\n25 Ia sa tukuna o Jiova; \\\"O koya
  mada ga e vesuki tu vei koya na qaqa ena kautani, kei nai toki ni valu vei koya
  na tamata rerevaki duadua ena sereki ga, Au na valuti koya o koya e via valuti iko,
  Au na vakabulai ira na luvemu.\\n26 Au na vakani ira o ira era via vakasaurarataki
  iko ena yagodra, era na mateni ni ra gunuva ga nodra dra, me vaka na waini kamikamica,
  me ra na kila na tamata kecega ni oi Au o Jiova na nomui vakabula, ka voli iko,
  sai Au na kaukauwa i Jekope.\\\"\\nChapter 50\\n1 Sa tukuna vakaoqo o Jiova: \\\"Sa
  E vei nai vola ni veibiu nei tinamu, ka''u a biuti laivi? O cei soti era a dinau
  tu vei Au o ni a volitaki kina? E na vuku ga ni nomudou i valavala ca dou sa volitaki
  kemudou ga kina, kei na vuku ni nomudou dau basu lawa sa biu laivi kina o tinamudou.\\n2
  Cava, Ni''u sa lako mai ka sega ni dua na tagane me tu? Cava, Ni''u sa kaci ka sega
  e dua me sauma mai? Sa lekaleka beka na ligaqu me dredre kina ni ia na veivakabulai?
  Se sa sega ni tu vei Au na kaukauwa me''u veisereki? Au na vunauca kina na wasawasa
  me mamaca mai, Au na cakava na uciwai me vaka na lauqa; ena bona na kena ika ni
  sa sega na wai ka ra mate talega ena viagunu.\\n3 Au sa vakaisulutaka na lomalagi
  ena butobuto, ka ubia ena i sulu taga.\\\"\\n4 \\\"Sa solia vei Au na Kalou o Jiova,
  na yame sa vakavulici rawa, me''u rawa ni kila kina na vosa Me''u rawa ni vosa kina
  vua sa oca, ka sa dau vakayadrati Au o koya ena veimataka, ka sa vakadirorogo na
  daligaqu, Me''u vakarorogo me vakataki ira era sa vakatavulici.\\n5 Sa dolava na
  daligaqu na Kalou o Jiova, Au a sega ni vuki tani, se Me''u beca.\\n6 Vei ira era
  mokuti Au, Au vukica na dakuqu vei ira, kei na baluqu vei ira na dauveitoro kumi;
  Au sega ni vunia na mataqu mai na madua kei na veikasiviti.\\n7 \\\"Ni sa vukei
  Au na Turaga o Jiova, o koya oqo Au na sega ni taqaya kina; Ka''u sa vakaukauwataka
  kina na mataqu me vaka e dua na vatu mulo na noqu rai yani, Ka''u sa kila ni''u
  sa sega ni madua.\\n8 Sa voleka sara mai o Koya sa vakadonui Au; o cei me na ia
  na veilewai kei Au? Me da tucake vata mada. O cei e tu me bolei Au? Me toro voleka
  mai vei Au.\\n9 E dina ena vukei Au na Kalou o Jiova, o cei me na vakacalai Au?
  Ni na madra mai me vaka nai sulu makawa, ena kania na sarasara.\\n10 \\\"O cei vei
  kemudou sa rerevaki Jiova? Ka talairawarawa vua na Nona Dauveiqaravi? Ka lako voli
  ena butobuto ka sega vua na rarama? Me nuitaka ga na yacai Jiova ka vakararavi vakatabaki
  dua ga vua na Kalou.\\n11 Dou raica, dou sa vakawaqa kece ni buka, ka vauci kemudou
  ena i vakawaqa ni buka: Dou lako ena rarama ni buka kei na nomudou i vakawaqa ni
  buka dou vakacaudreva kina \u2014 ena ka oqo sa tarai kemudou kina na ligaqu; dou
  na davo sobu ena rarawa.\\nChapter 51\\n1 \\\"Dou rogoci Au, oi kemudou sa muria
  lako na yalododonu, dou vakasaqarai Jiova: dou raica na vatu dou a ta mai kina,
  kei na qara ni keli dou a keli cake mai kina.\\n2 Dou raici Eparama na tamamudou,
  kei Sera ka vakasucumi kemudou. Au a kacivi koya duadua ga, Au a vakalouvinakataki
  koya ka vakatuburi koya.\\\"\\n3 Ni na vakacegui Saioni o Jiova, ena vakavinavinakataka
  na nona vanua lala; na nona vanua dravuisiga ena vukica me tautauvata kei Iteni,
  kei na nona vanua talasiga ena tautauvata nai teitei i Jiova. Na reki kei na marau
  ena basika kina, na vakavinavinaka kei na domo ni sere.\\n4 \\\"Dou vakarorogo vei
  Au na Noqu tamata; ka rogoci Au mai na veimatanitu.Ni na lako yani mai vei au nai
  vunau, na noqu lewa Au na vakataudeitaka me nodra rarama na veimatanitu.\\n5 Sa
  voleka Noqu lewa dodonu, sa lako yani na Noqu veivakabulai, na ligaqu ena lewai
  ira na tamata; na veiyanuyanu era na waraki Au, ena ligaqu era na vakararavi kina.\\n6
  Dou dolava mada na matamudou ki lomalagi, ka rai sobu ki vuravura. Ena seavu o lomalagi
  me vaka na kubou, o vuravura e na yaco me vaka nai sulu madra, o ira era tiko kina
  era na mate vakatautauvata ga; ia na Noqu veivakabulai ena sega ni mudu, kei na
  Noqu yalododonu ena sega ni takali.\\n7 \\\"Dou rogoci Au oi kemudou sa kila na
  yalododonu, na tamata sa tiko ena lomamudou na Noqu i vunau: Dou kakua ni rerevaka
  na nodra vosa ca na tamata, se yalolailai ena nodra veivakasesewani.\\n8 Ena kani
  ira na sarasara me vaka sa kania nai sulu, kei na yavato ena kania me vaka na vuti
  ni sipi, ia na Noqu yalododonu ena sega ni mudu, kei na Noqu veivakabulai mai na
  dua nai taba tamata kina dua tale nai taba tamata.\\\"\\n9 Yadra mada, yadra mada,
  vakaisulu ena kaukauwa, ena liga i Jiova! Dou yadra me vaka na veigauna e liu, ena
  veitabatamata sa oti yani. E sega beka ni o iko na liga ka musuki Reapi, ka vakamavoataka
  talega na gata levu?\\n10 Sega beka ni o iko ka vakamamacataka na wasawasa, na wai
  ena wasa titobu; ka bulia na sala ena loma ni wasawasa me ra lakova o ira na vakabulai?\\n11
  O ira sa vakabula o Jiova era na lesu mai, ki Saioni ena domo ni sere, ena reki
  e sega cavuti rawa ena nodra vakasama. Era na taukena na reki kei na marau na rarawa
  kei na tagi ena dro yawa yani.\\n12 \\\"Oi Au, io, Oi Au, Au a vakacegui kemudou,
  o cei o iko mo rerevaka e dua na tamata e rawa ni mate, kei na luve ni tamata ena
  vukici ga me vaka na co?\\n13 O sa guilecavi Jiova na Dauveibuli, o Koya ka tevuka
  na lomalagi ka vakadavora talega na yavu kei vuravura; o sa rere tikoga e vei siga
  ena vuku ni nodra veivakarerei na dauvakarerevaki, e na nona sa vakarau me veivaluti.
  E vei na nona vakarerevaki na dauveivakarerei?\\n14 Sa sasaga na tamata bobula,
  me sereki koya tani; me kua kina ni mate ena i qara, me kua talega ni yali na kena
  madrai.\\n15 Ia Oi Au o Jiova na nomu Kalou, ka wasea na wasawasa kei na kena ua
  voravora\u2014o Jiova ni lewe vuqa na yacana.\\n16 Au sa vakacuruma ki gusumu na
  Noqu vosa; ka vakarurugi iko ena i yaloyalo ni ligaqu, de Me''u rawa ni teivaki
  lomalagi, ka vakadavora na yavu kei vuravura, ka tukuna vei Saioni, ''O iko na Noqu
  tamata.''\\\"\\n17 Dou yadra, dou yadra mai! Ka tucake mai Jerusalemi o iko o sa
  mateni ena liga i Jiova, ena bilo ni nona cudru katakata o gunuva sara ga na kena
  duka ena bilo ni veilecayaki, o sa vakamacara sara ga vakadua.\\n18 Vei ira taucoko
  na luvena tagane e vakasucuma e sega ni bau du talega na luvena tagane e vakasucuma
  me taura na ligana me tubera.\\n19 A ka ruarua oqo sa yacovi iko mai; o cei me na
  vosoti iko?\u2014Na veivakalalai kei na veivakacacani, dausiga kei nai seleiwau\u2014me''u
  na vakacegui rawa vakacava?\\n20 Na luvemu tagane era sa kolaiciba, era sa veidavoci
  ena vei mua ni sala, sa vaka na dia ni sa vesuki ena lawa; ni sa tarai ira vakaukauwa
  na cudru katakata i Jiova, kei na veivunauci ni nomu Kalou.\\n21 O koya mo dou rogoca
  oqo, oi kemudou sa vakaleqai tu, ni dou mateni ka sega ena waini.\\n22 Sa tukuna
  vakaoqo o Jiova, o Jiova o Koya na nomu Kalou, sa taqomaki na veika baleti ira Nona
  tamata; ''Raica Au sa kauta tani mai ena ligamu na bilo ni veilecayaki, io, na kena
  soko ena bilo ni Noqu cudru katakata; o na sega ni na gunuva tale.\\n23 Ia, Au na
  biuta kina ligadra o ira era vakaleqai iko, era cavuta vei iko, ''mo davo sobu me
  vaka o iko na qele, ni ra lakova tiko na tamata'' era nanuma tikoga ni gaunisala.\\\"\\nChapter
  52\\n1 Dou yadra, dou yadra! Ka vakatokara vei iko na nomu kaukauwa, Saioni, mo
  daramaka nomu i sulu rairai totoka, i Jerusalemi, na koro Tabu! Era na sega ni na
  lako mai vei iko o ira na sega ni cili kei ira na sega savasava.\\n2 Mo tucake,
  ka kureitaka na yagomu mai na kuvu, dabe sobu, Jerusalemi! Oi kemudou na goneyalewa
  bobula ni Saioni, dou sereka tani nai vesu ni domomudou!\\n3 Sa tukuna vakaoqo o
  Jiova: \\\"Dou a volitaki kemudou ka sega tu na kenai sau, oqo dou na voli lesu
  ka sega e nai lavo.\\\"\\n4 Ni sa tukuna vakaoqo na Kalou o Jiova: \\\"O ira na
  noqu tamata era lako taumada ki Ijipita mera vakaitikotiko kina; o ira na kai Asiria
  era vakayalolailaitaki ira ka sega tu na vuna.\\n5 Na cava au sa tu kina eke, ena
  gauna oqo,\\\" sa tukuna o Jiova, \\\"O ira noqu tamata era sa kau tani ka sega
  ni dua na vuna? O ira era lewai ira era sa vakararawataki ira. \\\"Na yacaqu talega
  sa vakasewasewani tu ga ena veisiga.\\n6 O koya oqo era na qai kila ga mai na yacaqu
  na Noqu tamata; o koya talega oqo mera na qai kila ena siga o ya ni''u sa vosa vei
  ira: ''Raica, sai Au ga.''\\\"\\n7 Na kena rairai totoka na veiulunivanua na yavai
  koya sa kauta mai nai tukutuku vinaka, sa kacivaka na tiko sautu, sa kauta mai nai
  rogorogo vinaka ni ka vinaka,sa vunautaka na veivakabulai, ka tukuna ki Saioni,
  \\\"Na nomu Kalou sa lewa tiko!\\\"\\n8 Na nomui vakatawa era na tabalaka cake mai
  na domodra, ena domodra era na lagasere vata mai; ni ra na raica ena matadra dina
  ni sa vakalesui ira tale mai ki Saioni o Jiova.\\n9 Dou reki ena yalo e vakamuduo,
  ka lagasere vata mai, na vanua sa lala tu mai Jerusalemi! Ni sa vakacegui ira nona
  tamata o Jiova, ka sa vakabulai Jerusalemi.\\n10 Sa vakaraitaka ki na veimatanitu
  kecega na ligana sa tabu o Jiova; kei nai yalayala i vuravura era na raica na veivakabulai
  i Jiova.\\n11 Dou lako, dou lako! Dou lako tani e keri, dou kakua ni tara na ka
  sa sega ni savasava; dou lako tani mai vua, dou savasava mai, oi kemudou nai yaya
  ni cakacaka i Jiova.\\n12 Ena sega ni na totolo na nomudou lako, ena sega ni dou
  na vuka ena waqa vuka, ena liutaki kemudou o Jiova, ena tu talega mai dakumudou
  me na maroroi kemudou.\\n13 Raica, na Noqu Tamata ena cakacaka vakavuku; ena vakalevulevui
  ka vakacerecerei ena levu o Koya.\\n14 Me vaka na nodra mata sarasara na lewe vuqa
  ena vukumu, ni sa rui vakacacani vakalevu na matana ka vakalailai na mata ni tamata
  kecega, kei na yagona talega me sega ni vakataki ira na luve ni tamata;\\n15 Ena
  vakakina, ena vakamiraka e levu na veimatanitu. Era qamu gusu na tui vei Koya; na
  ka e sega ni bau tukuni tu vei ira era na raica, kei na ka era sega ni se bau rogoca
  vakadua era na rogoca.\\nChapter 53\\n1 O cei sa vakabauta na neitou i tukutuku?
  Ka sa vakatakilai vei cei na liga i Jiova?\\n2 Ni na tubu cake o Koya me vaka na
  coke e matana, ka vaka na waka ni kau mai na qele mamaca. Sa sega ni vinaka na matana
  ka sa sega ni vatukai vinaka na yagona; ni da sa raici Koya, sa sega na ka e tu
  Vua me taleitaki kina.\\n3 Sa beci sa sega ni taleitaki mai vei ira na tamata, sa
  Tamata e dau rarawa na lomana ka vakasinaiti tu ena rarawa. Ka vaka e dua eda sa
  tabonaka na matada mai vei Koya; sa beci ka da na sega ni dokai Koya.\\n4 E dina
  sa colata o Koya na noda rarawa ka sa colata na rarawa ni lomada, ni da kila vinaka
  ni a vakaleqai vakaca sara, ka vakacacani mai vua na Kalou, ka kune ka rarawa.\\n5
  Ia sa vakamavoataki o Koya ena vuku ni noda talaidredre, ka sa vakadrakusitaki ena
  vuku ni noda caka cala, sa tau Vua na cudruvi sa vuni noda veivinakati tale, ia
  na we ni kena kuita eda sa vakabulai kina.\\n6 Oi keda kece, eda sa vaka na sipi
  lako sese, eda sa dui lesu tani, kina noda sala, oi keda kece sara, ka sa vakataqara
  Vua o Jiova me colata na noda caka cala kecega.\\n7 Sa vakasaurarataki ka sa vakamalumalumutaki
  Koya ga o Koya, sa sega ni bau dolava na gusuna me vosa; ka sa tuberi me vaka na
  lami me laki vakamatei, ka vaka na sipi, sa galu ena matai koya sa kotiva, sa galu
  vakakina o Koya.\\n8 Sa kau tani mai o koya ki na vale ni veivesu kei na mataveilewai
  talega, o cei e rawa ni tusanaka Nona i taba tamata? Ni sa musuki koso o Koya mai
  na nodra vanua na bula tiko, ena nodra talaidredre na noqu tamata sa vakamavoataki
  kina o Koya.\\n9 Era sa buluti Koya vata kei ira nai valavala ca\u2014ia na Nona
  mate sa vaka e dua na vutuniyau, baleta ni sega nona cala, ka sega ni bau lako mai
  e na gusuna na veivakaisini.\\n10 Ka sa lomavinaka kina o Jiova me vakamavoataki
  Koya; ka vakararawataki Koya vakalevu sara. Ni o sa vakarautaki koya ena lomana
  mei soro ni valavala ca, ena qai raici ira na Nona kawa, ena vakabalavutaki Nona
  siga, kei na ka sa vinakata o Jiova ena vakayacora ga o koya ena ligana.\\n11 Ena
  raica o Koya na vua ni Nona cabori Koya ena lomana, ka marautaka. Ia na nona kila
  ka na Noqu tamata Yalododonu ena vakadonui kina e lewe vuqa, ni na cola o Koya na
  nodra caka cala.\\n12 O koya oqo Au na wasea Vua nai lumu kei ira na qaqa ni vakabauta,
  ena wasea na Nonai yau vei ira na gugumatua, baleta ni a soli Koya oti tu me mate,
  ka sa wili vata kei ira na dautalaidredre, ka sa colata o Koya na nodra i valavala
  ca na lewe vuqa, ka sa yaco tale o Koya me dauniveisorovaki vei ira na dautalaidredre.\\nChapter
  54\\n1 \\\"Mo laga sere, o iko na yava, sa sega ni vakasucu! Tabalaka mai na laga
  sere, ka kaila vakadomoilevu, o iko ka sega ni bau taratara! Ni sa lewe levu na
  gone vei koya e sega ni vakawati tiko,\\\" sa tukuna o Jiova.\\n2 \\\"Vakalevutaka
  na tikina sa tu kina na nomu vale laca, me ra qai dedeka yani nai latilati ni nomui
  tikotiko, me kua ni dua e vo vei iko; dodoka vakabalavu yani nomu dali, ka mo vakaukauwataka
  nomu duru ni bai.\\n3 Ni o na teteva yani vaka kina i matau kei nai mawi, kei na
  nomu kawa ena taukena na veimatanitu eso, ka ra na tawana na veikoro lelevu sa lala
  tu.\\n4 \\\"Mo kakua ni o rere, ni o na sega ni madua; kakua ni yalo taqaya, ni
  o na sega ni vakamaduataki; o na guilecava talega na kemui rogo ca mai na gauna
  ni nomu gone kei na nomu rogo ca ena nomu a tiko vakayada o na sega ni nanuma tale.\\n5
  Na nomu Dauveibuli ga o Koya na watimu, o Jiova ni lewe vuqa na yacana; kei na nomui
  Vakabula Na Le Dua Yalosavasava ni Isireli; o Koya sa vakatokai na Kalou ni vuravura
  taucoko.\\n6 Ni sa kacivi iko o Jiova o sa vaka tu na yalewa sa guilecavi ka dau
  rarawa na yalona, ka vaka na goneyalewa sa vakawati ka sega ni taleitaki,\\\" sa
  tukuna na nomu Kalou.\\n7 \\\"E dua ga na gauna lekaleka au a guilecavi iko, ia
  ena loloma sega yalani Au na ciqomi iko.\\n8 Ena noqu cudru Au a tabonaka na Mataqu
  mai vei iko ena dua ga na gauna lekaleka; ia Au lomani iko tu ga ena yalovinaka
  e sega ni vakaiyalayala,\\\" sa tukuna o Jiova na nomudou i Vakabula.\\n9 \\\"Vei
  au sa vaka na wai ena gauna i Noa; me vaka na noqu bubului ena sega ni luvuci vuravura
  tale na wai, me vaka Noqu bubului Au na sega ni na cudruvi iko se karalaki iko.\\n10
  Era na tosoi na veiulunivanua kei na veidelana ena biu vakatikitiki, ia na Noqu
  yalololoma ena sega ni takali vei iko, ena sega ni na kau tani na Noqu veiyalayalati
  ni tiko sautu,\\\" sa tukuna o Jiova, o koya ka lomani iko.\\n11 \\\"O iko na daurarawa,
  ka dau veikauyaki ka sega ni bau vakacegui, raica, Au na ukutaka nomu veivatu ena
  vatu Jasipa, ka vakayavutaki iko ena safaia.\\n12 Au na cakava na nomu bai ni valu
  ena rupi, kei na nomu matamata ena karisitala, na nomu bai ena ceuti kina na veivatu
  talei sara.\\n13 O Jiova ena vakavulici ira na luvemu kece, ka ra na vutuniyau vakalevu
  ena vakacegu.\\n14 O na vakatikori vakavinaka ena yalododonu; ena dro yawa mai vei
  iko na veika rarawa eso, o na sega sara ni rere, kei na veika rerevaki ena sega
  ni na torovi iko mai.\\n15 Era na kumukumuni dina me ra soqoni vata, ia ka sega
  ga ni vukuqu. O ira kece era via soqoni vata me ra valuti iko era na druka kece
  ga.\\n16 \\\"Raica, Au sa bulia na matai ni siliva o koya ka uvuca na qilaiso ena
  bukawaqa, ka sa kauta mai nai yaya kece ni nona cakacaka; Oi Au talega sa bulia
  na dauvakacaca me veivakacacani.\\n17 Nai yaragi kece me baleti iko mo leqa kina,
  era na sega ni rawata e dua na ka, kei na veiyame kece era vakasesewani iko ena
  veilewai o na dusimaki ira tale. Oqo dina na nodra i votavota na tamata i Jiova,
  na nodra bulataka tiko na dodonu sa vu mai vei au,\\\" sa tukuna o Jiova.\\nChapter
  55\\n1 \\\"Oi kemudou vakaaduaga sa viagunu, dou lako mai kina wai; kei koya sa
  sega vua nai lavo, dou lako mai, ka volia na kemudou kakana. Io, mo lako mai ka
  volia na waini kei na sucu, sega ni o kauta mai nai lavo, e sega talega ni tu na
  kenai sau dodonu.\\n2 Cava dou sa vakayagataka kina nai lavo ena ka e sega ni madrai,
  kei na nomudou i sau ena veika walega? Dou vakarogoci Au vinaka, ka kania ga na
  ka vinaka, ena reki na lomamudou ena bula e rawa vakalevu sara.\\n3 Dou dolava na
  daligamudou, ka lako mai vei Au, mo rogoca, ena qai bula na lomamudou; Au na qai
  vakayacora e dua na veiyalayalati sega ni mudu vei iko ena loloma dina i Tevita.\\n4
  E dina Au sa soli koya mei vakadinadina vei ira na tamata, mei liuliu ka turaga
  ni valu talega vei ira na tamata.\\n5 E dina o na kaciva e dua na matanitu o sega
  ni kila, kei na veimatanitu era sega ni kilai iko era na cici mai vei iko, baleti
  Jiova na nomu Kalou, Na Le Dua Yalosavasava ni Isireli; ni sa vakalevulevui iko
  o Koya.\\\"\\n6 Dou vakasaqairai Jiova ni se kune rawa tiko, dou masuti Koya ni
  se voleka tiko.\\n7 Me biuta mada na nona i tovo na tamata ca, kei na nona vakanananu
  na tamata daucaka cala; laivi koya me lesu mai vei Jiova, ena qai lomani o koya,
  vei Koya na noda Kalou, ena vosoti vakalevu sara o koya.\\n8 \\\"Na Noqu vakanananu
  e sega ni tautauvata kei na nomudou vakanananu, na nomudou i valavala e sega ni
  tautauvata kei na Noqui valavala,\\\" sa tukuna o Jiova.\\n9 \\\"Me vaka sa cecere
  cake o lomalagi mai ki vuravura, sa cecere cake vakakina na Noqu i valavala mai
  na nomudou i valavala.\\n10 \\\"Me vaka na tau sobu ni uca, kei na uca cevata mai
  lomalagi, ka sega ni lesu tale yani kina, ia ka vakasuasuataka na qele, ka vakatubura
  me sereka mai, me rawa ni solia na kenai tei vei koya sa daukabukaburaki, kei na
  madrai vei koya sa kania,\\n11 Ena vaka talega kina na Noqu vosa ka''u sa vosataka
  yani ena sega ni lesu tale wale vei Au, ia ena vakayacora ga na ka Ka''u sa vinakata,
  ena sega ni lesu tale wale ena cakava na ka Au tala kina.\\n12 \\\"Ni dou na lako
  yani ena reki, ka tuberi yani ena vakacegu; na veiulunivanua kei na veidelana era
  na lagalaga sere e matamudou, kei na kau kecega ni vanua era na vakasausau.\\n13
  E sa na i sososmi ni soni na damanu ni tubu mai, era na tubu mai na mateli mei sosomi
  ni salato; na ka oqo ena vakarogoya yani na yaca i Jiova, me dua nai vakananumi
  me sega ni mudu ena sega ni takali rawa.\\\"\\nChapter 56\\n1 Sa tukuna vakaoqo
  o Jiova; \\\"Maroroya na lewa, ka kitaka nai valavala dodonu, ni sa vakarau yaco
  mai na Noqu veivakabulai, kei na Noqu lewa dodonu sa na vakarau vakatakilai.\\n2
  Sa kalouvinaka na tamata ena cakava na ka oqo, kei na luve ni tamata o koya e taura
  matua; ka maroroya me kua ni vakacacana na Siga ni Vakacecegu, e tarova talega na
  ligana me kakua ni cakava e dua na ka ca.\\\"\\n3 Kakua ni vakatara na luve ni kai
  tani ka sa semati koya vei Jiova me cavuta, ka tukuna, \\\"O Jiova sa tawasei au
  dina mai vei ira na Nona tamata,\\\" me kua talega ni ra cavuta na euniki (matanivanua)
  ka tukuna, \\\"Oi au oqo na kau sa madu.\\\"\\n4 Ni sa tukuna vakaoqo o Jiova, \\\"Vei
  ira na euniki (matanivanua) era sa vakatabuya na Noqu Siga ni Vakacecegu, ka digitaka
  na ka Au taleitaka, ka taura matua na Noqu veiyalayalati,\\n5 Au na solia na noqu
  vale ena vukudra ga ena noqu loma ni bai, e dua na vanua kei na dua na yaca vinaka,
  ka uasivi sara vei ira nodra goneyalewa kei na gonetagane; au na solia vei ira e
  dua na yaca e sega ni mudu ka sega ni rawa me yali.\\n6 \\\"O ira talega na luve
  ni kaitani ka semati ira vei Jiova, me qaravi Koya, ka ra lomana na yaca i Jiova,
  ka me ra bobula ki Vua vei ira taucoko ka maroroya na Siga ni VakaceceguOka taura
  matua na noqu veiyalayalati.\\n7 Au na kauti ira mai kina Noqu ulunivanua tabu,
  ka vakarautaki koya ena Noqu valeni masu. A nodra i soro kama kei na nodra i madrali
  ena vakadonui ena Noqui cabocabo ni soro; ni na vakatokai na Noqu vale me nodra
  vale ni masu na tamata kecega.\\\"\\n8 Na Kalou o Jiova o koya ka vakasoqoni ira
  vata na Isireli ka bobula tu, sa tukuna, \\\"Au na vakasoqoni ira vata vei koya
  eso tale, mai na kena era sa soqoni oti tu.\\\" Era Sega Ni Nuitaki Nai Liuliu Kei
  Isireli\\n9 Oi kemudou kece na manumanu kila ni vanua, dou mai kana, kei kemudou
  talega na manumanu kila ni veikau loa.\\n10 Na nonai vakatawa era sa mataboko, ka
  sega ni vuku, era sa vaka kecega na koli sa galu tu, ka sega ni bau kodrokodro;
  era dau moce, era veidavoci tu ga ka taleitaka vakalevu sara na moce lutu.\\n11
  Io, era sa koli kocokoco ka sega ni bau mamau rawa. O ira oqo nai vakatawa ka sega
  ni kila ka rawa; era sa dui goleva ga na sala sa dodonu e matadra, era sa dui sagai
  ira ga me ra tiko vinaka, e na nodra dui vanua era tiko kina.\\n12 \\\"Lako mai,\\\"
  sa tukuna mai e dua, \\\"Au na kauta mai na waini, meda na mai vakasinaiti keda
  mada ga ena yaqona; ni mataka e na vakaga na siga ni kua, ni na uasivi cake sara
  na bula.\\\"\\nChapter 57\\n1 Sa yali na tamata yalododonu, ka sega ni bau dua me
  siqe e yalona, na tamata yalololoma era sa kau tani, ka sega ni dua e bau kauwai
  ni ra sa kautani tiko na yalododonu mai vua na vuni ca.\\n2 Ena curu yani ki nai
  vakavakacegu o koya; ka na laki davoca me vakacegu ena nonai davodavo, era na tacake
  tu ni ra sa lako tu.\\n3 \\\"Ia, dou lako mai ke, na luvena tagane na daucakaisausau,
  oi kemudou na kawa ni dauveibutakoci kei na dautagane!\\n4 O cei dou vakalialia?
  Vei cei dou dara yame kina? Dou sa sega li ni luve ni dautalaidredre, na kawa ni
  daulasu,\\n5 Dou vakacaboi soro vei ira na kalou tani ena vei ruku ni vunikau tubu
  bulabula, ka vakamatei ira na gone ena vei buca ena vei ruku ni vatu levu?\\n6 Ena
  vatu yagoyagovinaka ni wai drodro o sa votai kina; sai o ya ga, ka nomu i votavota!
  Ki na ka o sa sova kina nai sevu ka vakacabora nai madrali, Me''u sega li ni cudru
  ena ka oqo?\\n7 \\\"Ena dela ni ulunivanua cecere ka toka sara i cake o vakadavora
  kina na nomui mocemoce; ka mo dau cabe kina mo vakacaboi soro.\\n8 Mai na daku ni
  sogo kei na kena duru o sa vakaduria tu kina na kemui vakananumi; ni o sa laki vakaluvaiwaletaki
  iko vua e dua tani tale, ni o sa cabe cake vei ira; o sa domona vakalevu na nodra
  i davodavo, ena gauna o raica kina na nodra luvaiwale.\\n9 Mo lako vua na tui ena
  nomu i lumu, ka vakalevutaka vei iko na kaloni boi kamica; mo vakatalai ira vakayawa
  na nomui talaki, me ra volekati Etesi yani.\\n10 O sa oca ena nomu lako voli; o
  sega ni bau tukuna, ''E sega ni dua nai nuinui'' o sa qai kunea na bula ka tiko
  ena ligamu; o koya oqo o sega kina ni yalolailai.\\n11 \\\"O cei o rerevaka, ka
  taqayalaka, ni o sa lasu ka sega ni bau nanumi Au, ka o sega ni kauta sara ki yalomu?
  Baleta Au a galu ga mai liu sara, sai koya beka o ya o sega ni rerevaki Au kina?\\n12
  Au na tukuna na nomu yalododonu kei na nomu cakacaka, ena sega ni dua na ka vinaka
  ena kauta mai vei iko.\\n13 Ni o sa tagi mai, na matakau o sa vakasoqona tu me vakabulai
  iko sara. Ia na cagi ena ceburaki ira tani, e dua na veiceguvi ena tarai ira. Ia,
  o koya e vakabauti Au ena taukena na vanua, ka na soli vua na Noqu ulunivanua tabu.\\\"
  Veivakabulai Vei Ira Na Lotu Gogo\\n14 Ena qai tukuna mai e dua, \\\"Dou bulia cake!
  Dou bulia cake! Vakarautaka na sala, dou kauta tani nai tatao e dau tarovi ira tiko
  na Noqu tamata.\\\"\\n15 Ni sa tukuna vakaoqo o koya sa Levu ka Cecere sara o koya
  ka lewa na sega ni mudu ka yacana na Yalosavasava sara. \\\"Au tiko ena vanua tabu
  ka cecere sara, vei koya sa ramusu ka malumalumu na yalona, me''u vakabulabulataka
  na yalo i koya sa yalomalumalumu, kei na noqu vakabulabulataka talega na yaloi koya
  sa bikai tu.\\n16 Oi Au na sega ni veisaqasaqa tiko ga me sega ni mudu, Au na sega
  talega ni''u na cudru tiko; ena yali e mataqu na yalo ni tamata kei na tamata Au
  sa bulia.\\n17 Au a cudru ka vakamavoataki koya ena vuku ni nona ca kei na kocokoco,
  ka sa suka lesu tale yani o koya me muria na dodomo ni yalona.\\n18 Au sa raica
  nai valavala sa muria, Au na vakabulai koya; Au na tuberi koya, ka vakasuka vua
  na vakacegu kei ira talega sa rarawa vata.\\n19 \\\"Au bulia na vua ni tebenigusu:
  Na tiko sautu, na sautu vei koya e tiko vakayawa kei koya talega e tiko voleka,\\\"
  ni sa tukuna o Jiova, \\\"Au na vakabulai koya.\\\"\\n20 Ia o ira na tamata ca era
  sa vaka na wasawasa voravora, sa sega ni bau cegu rawa, na kena wai sa binia vata
  kece mai na qele lolobo kei na duka kecega.\\n21 \\\"Sa sega na vakacegu,\\\" sa
  tukuna na noqu Kalou, \\\"Vei koya sa kitaka tiko nai valavala ca.\\\"\\nChapter
  58\\n1 \\\"Mo kaci vakadomoilevu, me kua ni dua me vo; me rogolevu yani me vaka
  na davui; tukuna vei ira na Noqu tamata na nodra talaidredre, kei na mataqali i
  Jekope ena nona i valavala ca.\\n2 O ira era sa dau vakasaqarai Au tikoga ena veisiga,
  ka marau ni ra kila tiko Noqu i valavala, ni sa matanitu dau caka dodonu, ka ra
  sega ni biuta nai vakaro dodonu; era sa qai torova na Kalou ena yalo e rekitaka.\\n3
  ''Na cava keimami lolo kina, era tukuna, ka o sega ni bau raica? Cava o sega ni
  bau kauwai mai kina, ni keimami vakararawataka na loma i keimami?'' \\\"Io, na ka
  dina, ena siga ni nomudou lolo, dou qai veimarautaki tiko, ka vakacakacakataki ira
  tiko nomudou tamata cakacaka.\\n4 Dou sa lolo ga me tubu kina na veivala kei na
  veileti, ka vakayagataka na liga sa valavala ca. Mo dou kua tale ni lolo me vaka
  dou cakava ena siga oqo, me rawa ni rogoci kina mai cake na domomudou.\\n5 Me vaka
  ni oqo na lolo Au sa digitaka, na siga me malumu mai kina na loma ni tamata? Me
  vakacuva sobu mai na uluna me vaka na bulumakau sa manoa, ka tevuka nai sulu taga
  kei na dravusa? O rawa ni vakatoka oqo me lolo, se me siga sa vinakata o Jiova?\\n6
  \\\"Sa sega ni vakaoqo na lolo Au sa vinakata, me sereki nai vesu ni valavala ca,
  me biu sobu nai colacola bibi, ka sereki o ira o cata tu kei na nomudou musuka kece
  nai vua?\\n7 E sega beka ni o wasea na kemu madrai vei ira era viakana, ka kauti
  ira mai ki nomu vale o ira na dravudravua sa biu tu; ni o sa raica e dua ni luvaiwale,
  mo vakasuluma, mo kakua ni vunitaki iko mai vua na wekamu dina?\\n8 Ena qai kida
  mai na nomu rarama me vaka na mataka, ena qai yaco vakatotolo sara mai na veivakabulai
  vei iko, ena liutaki iko na nomu yalododonu; nai serau i Jiova ena vakarurugi iko.\\n9
  Ni o sa qai masu, ena rogoci iko o Jiova; ni o tagi Vua, ena tukuna mai, ''Oi Au
  oqo,'' \\\"Kevaka dou biuta tani nai vua vei kemudou, na dusi qaqalo, kei na vosataka
  na ka ca,\\n10 Kevaka o daulomasoli vua sa viakana ka vakacegui koya e kune rarawa,
  ena qai kida mai nomu rarama ena vanua butobuto, kei na nomu butobuto ena rarama
  mai, me vaka na sigalevu tutu.\\n11 O Jiova ena tuberi iko tikotikoga, ka vakacegua
  na lomamu ena gauna ni dausiga, ka vakaukauwataka nomu sui; o na vaka e dua nai
  teitei bulabula kei na nomu bula ena vaka na mata ni wai, sa sega ni bau maca rawa.\\n12
  Eso ga vei kemudou era na tara tale na vanua sa biu ka lala tu; mo na laveta cake
  na yavu era tara cake kina nai tabatamata e liu; o na qai vakatokai, o koya ka Vakavinakataka
  na Tikina sa Kabasu, kei koya na Dauvakavinakataki Sala me ia kina na tiko.\\n13
  \\\"Kevaka mo vagolea tani na yavamu nai na Siga ni Vakacecegu, ka mo cakava kina
  na ka e marautaka na yalomu, ka tukuna ni Siga ni Vakacecegu e siga marautaki dina
  vei iko, na Siga ni Vakacecegu i Jiova e siga dokai, mo dokai Koya kina, mo kakua
  ni cakava kina me nomu marau vakalialia, me kakua ni siga ni nomu veilakoyaki, se
  mo vosataka kina na veivosa e sega kilikili,\\n14 O na qai rekitaki Jiova tikoga,
  Au na qai vakayacori iko mo vodoka na veivanua cecere e vuravura, ka vakani iko
  e nai votavota i Jekope na tamamu. Ni sa cavuta dina na vosa oqo na gusu i Jiova.\\\"\\nChapter
  59\\n1 Raica, sa sega ni lekaleka na liga i Jiova, me dredre kina ni ia na veivakabulai;
  ka sa sega ni bibi na daligana, me dredre kina ni rogoca.\\n2 Ia na nomudou caka
  cala ga sa tawasei kemudou tani mai Vua na nomudou Kalou; kei na nomudou i valavala
  ca sa tabonaka kina na matana mai vei kemudou, me sega ni rogoca.\\n3 Ni sa dukadukali
  na ligamudou ena dra, kei na qaqalo ni ligamudou ena caka cala; a tebeni gusumudou
  sa vosa lasu, ka sa cavuta na ka ca na yamemudou.\\n4 E sega ni bau dua me kaciva
  na veilewai, ka sega e dua e vakadinadinataka na ka dina, era vakabauta ga nai lawaki
  kei na vosa lasu; era kunekunetaka na ca ka vakasucuma mai na ka cala.\\n5 Era dirika
  na yaloka ni gata daukata ka talia na viritalawalawa; o koya e na kania na kena
  yaloka ena mate, na yaloka sa diriki tu sa lako mai kina na gata daukata.\\n6 Ena
  sega ni rawa ni sulumi na kena viritalawalawa, ena sega ni rawa ni ra ubia na nodra
  cakacaka; na nodra cakacaka sa cakacaka ga ni ca, ka sa vakaitavi na ligadra ena
  i valavala kaukauwa.\\n7 Na yavadra sa ciciva na ca, ka ra vakadavea na dra sega
  cala; na nodra vakanananu sa vakanananu ga ni ca, na vakaloloma kei na rusa sa tu
  ena nodra sala.\\n8 Era sega ni bau kila tu na sala ni vakacegu, ka sega na ka dodonu
  ena nodra i lakolako; era sa vakarautaka ga vei ira na sala veve; o koya ena muria
  na sala o ya ena sega ni kila na vakacegu.\\n9 O koya oqo sa yawa kina vei keda
  na lewa dodonu; ka sega ni rawa ni mai liutaki keda na dodonu; eda vakasaqara na
  veivakararamataki, ia eda sa qai lako tiko ena butobuto loaloa!\\n10 Eda vakayayamo
  ena bai me vaka na mataboko, ka da vakayayamo dina me vaka sa sega na matada; eda
  tarabe ena siga levu tutu me vaka talega na buto ni mataka, eda vaka na tamata mate
  ena vanua sega ni sega tu.\\n11 Eda kudrukudru kece me vaka na Pera, ka tagi lako
  vaka na ruve; eda vakasaqara na lewa dodonu, ka da sega ni kunea, na veivakabulai,
  ka sa yawa kalia sara vei keda.\\n12 Ni sa vakalevutaki tikoga na talaidredre e
  Matamuni, kei na neimami valavala ca sa tukuni keimami; ni sa tiko kei keimami na
  neimami talaidredre, na neimami caka cala, keimami sa kila ga:\\n13 Keimami sa talaidredre,
  ka lasu vei Jiova, ka lako tani mai Vua na neimami Kalou, ka cavuta tiko na veivakasaurarataki
  kei na vakabesebese, ka vakananuma ka cavuta mai na vu ni yaloi keimami na vosa
  lasu.\\n14 Sa vakasukai ki muri na lewa dodonu, ka sa tu vakayawa na dodonu; ni
  sa vakabalei na dina e na gauni sala, ka sa sega ni curu rawa na ka dodonu.\\n15
  Sa yali na dina, o koya sa lako tani mai nai tovo ca ena vakasaqarai.\\nKa sa raica
  o Jiova, sa rarawa kina ni sa yali na lewa dodonu.\\n16 A sa raica o Koya ni sa
  sega ni tiko e dua na tamata, ka liaca ni sa sega e dua me dauveisorovaki, o koya
  oqo na ligana ga ena ia na veivakabulai vua; kei na Nona Yalododonu, ena tauri Koya.\\n17
  Ka sa sulumaka o Koya nai valavala dodonu me vaka nai sasabai, kei nai sala ni veivakabulai
  ena uluna; ka vakaisulu e nai sulu ni veisausaumi, ka sa vakatutuvitaki Koya ena
  loma katakata.\\n18 Me vaka na nodra cakacaka, ena sauma vakakina o Koya, na cudru
  katakata vei ira nodra meca, kei na veisaumi lesu vei ira era veivakacacani; kei
  ira na veiyanuyanu ena sauma lesu.\\n19 Era na rerevaka na yaca i Jiova o ira mai
  na ra, kei nai cadracadra ni matanisiga na Nonai ukuuku; era na lako mai me vaka
  na waluvu na meca, ena qai vakarewataki na kuila na Yaloi Jiova me tarovi ira.\\n20
  \\\"Ena qai lako mai ki Saioni nai Vakabula, o ira taucoko na Jekope era na vuki
  ka veisau mai na talaidredre,\\\" sa tukuna o Jiova.\\n21 \\\"Ki vei Au,\\\" sa
  tukuna o Jiova, \\\"Oqo na noqu veiyalayalati vei ira. Na Yaloqu ka sa tiko kei
  kemudou kei na Noqu vosa Au sa biuta ena gusumudou, me kakua ni yali tani mai ena
  gusumudou, se mai na gusudra na nomudou kawa, se na gusudra na nomudou kawa ni veikawa,\\\"
  sa tukuna o Jiova, \\\"Mai na siga oqo kei na veisiga me sega ni mudu.\\\"\\nChapter
  60\\n1 Mo tucake ka rarama mai; ni sa qai yaco mai na nomu rarama! kei nai serau
  i Jiova sa cadra mai vei iko.\\n2 Mo raica, na butobuto ena ubi vuravura, ka vakabutobutotaki
  ira na tamata; ia o Jiova ena cadra cake mai vei iko, kei na Nona i serau ena laurai
  vei iko.\\n3 Na veimatanitu tani era na lakova mai na nomu rarama, kei ira na tui
  era na vakararamataki e nai serau ni nomu cadra cake mai.\\n4 \\\"Tacake na matamu
  ka veiraiyaki mo raica; ni ra sa soqoni vata mai, ka lako mai vei iko, o ira na
  luvemu tagane era lako vakayawa sara mai, kei ira na luvemu yalewa era na mai veiqaravi
  e yasamu.\\n5 O na qai raica ka marau, na yalomu ena vakamolimol1; baleta nai yau
  kece ena loma ni wasawasa ena vakalesui mai vei iko, kei na nodra i yau na veiyasai
  vuravura ena soli vei iko.\\n6 A qele ni kameli ena lako mai vei iko, na luve ni
  kameli ni Mitiani kei Ifa; o ira kece mai Sipa era na lako mai, era na kauta mai
  na koula kei na ka boi vinaka, era na qai tusanaka me vakavinavinakataki o Jiova.\\n7
  A qele ni sipi kecega ni Kitari ena vakasoqoni mai vei iko, na sipi tagane ni Nepeioci
  era na qaravi iko; era na cabeta na Noqui cabocabo ni soro ena yalo e taleitaka,
  Au na qai vakalagilagia na Noqu vale ni ukuuku.\\n8 \\\"O cei oqo era vuka me vaka
  na o, sa vaka na ruve ena taba ni kau ni nonai mocemoce?\\n9 E dina sara ni ra a
  waraki Au na veiyanuyanu; na waqa ni Tasisi ena liu mai ni kauti ira tiko mai na
  luvemu tagane mai na vanua vakayawa, na nodra koula kei na siliva era kauta tiko
  mai, ki vua na yaca ni Turaga na nomu Kalou, Na Le Dua Yalosavasava i Isireli, ni
  sa vakacerecerei iko o Koya.\\n10 \\\"O ira na luvedra tagane na matanitu tani era
  na mai tara nomu bai, era na mai qaravi iko na nodra tui, ena gauna au cudru kina
  Au na mokuti iko, ia e Noqu loloma vei iko, Au na yalololoma kina vei iko.\\n11
  O koya oqo me qai dau dola tikoga na nomu matamata; me kua ni sogo tiko ena siga
  se bogi, na tamata o ya ena rawa ni kauta mai vei iko na nodra i yau na matanitu
  tani, kei na nodra tui era na veituitui mai.\\n12 Era na rusa laivi o ira na veimatanitu
  kei na veivanua era bese ni qaravi iko, na veimatanitu o ya ena vaqeavutaki vakadua.\\n13
  \\\"Nai ukuuku kei Lepanoni ena lakovi iko mai, na damanu, na paini kei na dilo,
  me ra na mai ukutaka na vanua ni Noqu veiqaravi; kei nai butubutu ni Yavaqu Au na
  vakaiukuukutaka.\\n14 O ira talega na luvedra tagane era vakacacani iko era na lako
  mai ka kerea na veivosoti, kei ira talega era vakasewasewani iko era na lako mai
  ka cuva e yavamu. Era na qai kacivi iko na Koro i Jiova o Saioni na Nona na Yalosavasava
  ni Isireli.\\n15 \\\"Ena gauna o biligi ka guilecavi tu kina, e sega ni bau dua
  me kauwaitaki iko, io oi au, Au a qai vakayacori iko mo rogo ka vakasakiti, mo vuni
  reki tu vei ira na i tabatamata kecega.\\n16 Na sucu ni veimatanitu tani o na gunuva,
  kei na nodra mata ni sucu talega na tui; mo kila kina ni sai Au o Jiova na nomui
  Vakabula ka Dauveisereki na Kaukauwa i Jekope.\\n17 \\\"Au na kauta mai na koula
  mei sosomi ni varasa, Au na kauta mai na siliva mei sosomi ni kaukamea, ka mei sosomi
  ni kau na varasa, ka mei sosomi ni vatu na kaukamea, Au na vakayacori ira nomu dauveiqaravi
  me ra dau vuni veivinakati, kei ira nomu dau buli lawa mera lewa dodonu.\\n18 Ena
  sega ni na rogoci tale ena nomu vanua nai vakarau kaukauwa, na nomu i yalayala ni
  vanua ena sega tale kina na veibasuraki se na veivakaduiduitaki; ia o na vakatoka
  na nomu bai me Bai ni Bula kei na nomu matamata ni koro me matamata ni Vakavinavinaka.\\n19
  \\\"Na matanisiga ena sega tale ni nomu rarama ena siga, na vula talega ena sega
  ni cila mai me nomu rarama; o Jiova ga ena vuni nomu rarama me sega ni mudu, kei
  na nomu Kalou ena nomui ukuuku.\\n20 Na nomu matanisiga ena sega ni dromu, na nomu
  vula talega ena sega ni na dromu, ni na nomu rarama o Jiova me sega ni mudu; na
  nomu siga ni rarawa ena vakaoti.\\n21 O ira na nomu tamata era na yalododonu kece;
  era na taukena na vanua ka sega ni mudu, na tabana Au a tea kei na cakacaka ni ligaqu
  meu na qoroi kina.\\n22 Na ka lailai me na yaco me udolu, kei koya na somidi me
  matanitu kaukauwa, Oi Au o Jiova, Au a vakayacora me vaka na kena gauna ga.\\\"\\nChapter
  61\\n1 \\\"Sa tu vei au na Yaloi Jiova na Kalou, baleta ni sa lumuti Au o Jiova,
  Me''u vunautaka nai rogorogo vinaka vei ira na dravudravua; sa talai Au mai me''u
  vakabulai ira sa kavoro na yalodra, Me''u vunautaka na galala vei ira na vesuki
  tu, kei na dolavi ni vale ni veivesu vei ira na sogoti tu;\\n2 Me''u vunautaka na
  yabaki vinaka i Jiova, kei na siga sa na ia kina na veisausaumi na noda Kalou; Me''u
  vakacegui ira sa rarawa,\\n3 Me''u vakayaloqaqataki ira na rarawa mai Saioni Me''u
  solia vei ira na mata lumilumisa mai na mata dravukasi, na waiwai ni reki mai na
  rarawa bibi, nai sulu ni vakavinavinaka mai na yalo e bibi, ka ra na vakatokai na
  kau dau vuataka nai valavala dodonu ka sa tea o Jiova, ka me vakacaucautaki kina
  o Koya.\\\"\\n4 Era na tara tale na veikoro sa rusa makawa tu, ka me ra laveta cake
  na vanua sa vakacacani e liu, ka vakavouya na veikoro sa lala tu kei na veiyasana
  ka ca mai ena vei tabatamata kece yani e liu.\\n5 Era na lako mai na kai tani me
  ra mai vakania na nomudou qele ni sipi, kei na luvedra tagane na matanitu tani,
  era na mai nomudou dau cukicuki kei na dau samaki veivaini.\\n6 Ia dou na qai vakatokai
  me bete i Jiova, era na kacivi kemudou mo dou tamata ni Kalou. Dou na vakamamautaki
  ena nodra sautu na veimatanitu tani, dou na qai vakalevulevui kemudou ena ka era
  dau qoroi tu kina.\\n7 Sa sega tale ni o qai madua, ni sa vakaruataki na ka o taukena,
  sa sega ni o qai veilecayaki ni o sa vuabale ena reki sega cavuti rawa. o koya oqo
  era na taukena kina e yarua na tiki ni qele mai na nodra qele; era na vakaiyau ena
  reki sega ni yalani rawa.\\n8 \\\"Ni sai Au, o Jiova, Au sa vinakata na lewa dodonu;
  Au cata na ka butakoci me vakacabori; Au na dusimaki ira ena nodra cakacaka ena
  dina, Au na qai vakayacora e dua na veiyalayalati Sega ni mudu kei ira.\\n9 Na nodra
  kawa ena kilai mai na veimatanitu tani, kei na luvedra ena cavuisaravi mai vei ira
  na tamata. o ira kece era raici ira era na qoroqoro ga, ni sai ira oqo nai sausauvou
  sa vakalouvinakataka o Jiova.\\\"\\n10 Au na rekitaki Jiova vakaidina sara, na lomaqu
  ena reki tiko vua na Kalou; ni sa vakasulumi au ena i sulu ni bula, ka ubi au ena
  i tuvi ni yalododonu, me vaka na nona lumuti e nai waiwai talei na tagane sa qai
  vakawati, ka vaka talega na yalewa sa qai vakawati na nona daramaka yani na veimataniciva
  talei sara.\\n11 Me vaka na kena buroro cake mai na qele na ka sa tei, ka vaka talega
  nai tei ni sa kadre mai ena i teitei, ena vakatubura vakakina o Jiova na yalododonu
  kei na dau vakavinavinaka me basika cake mai ena matadra na veimatanitu kecega.\\nChapter
  62\\n1 Ena vuku i Saioni Au na sega ni tarovi Au, kei Jerusalemi talega Au na sega
  ni na weletaka, me yacova ni sa dodonu sara me makaresese mai, kei na nodra veivakabulai
  ena vaka na cina drata ni waqa tiko.\\n2 Era na raica mai na nomu yalododonu na
  veimatanitu tani, kei ira na tui na nomu lagilagi. o na vakayacani ena dua na yaca
  vou, ena vakayacani iko o Jiova.\\n3 Ena vakaisalataki iko ena i sala vakaiukuuku
  ena daramaka vei iko na ligai i Jiova, ka na daramaka talega vei iko o Jiova nai
  sala vakatui.\\n4 O na sega ni vakatokai tale o koya sa Guilecavi, ena sega ni na
  Vakalalai tu na nomu vanua, ia o na vakatokai ga o koya sa Taleitaki kei na nomu
  qele sa Maroroi, ni sa rekitaki iko o Jiova, ena qai vauci vata na nomu qele.\\n5
  Me vaka na nona vakawatitaka e dua na goneyalewa savasava e dua na cauravou, ena
  vaka kina na luvemu tagane mera na vakawati kei iko; me vaka na nona marau na tagane
  sa qai vakawati vua na watina yalewa, ena vaka kina na Kalou ena nona marautaki
  iko.\\n6 O iko Jerusalemi, Au sa lesia eso nai vakatawa ena dela ni nomu bai, era
  na sega ni wele ena siga se bogi. Oi kemudou sa cavuta na yaca i Jiova dou kakua
  ni tiko lo,\\n7 Dou vakasosataki koya tikoga me yacova ni sa vakataudeitaki Jerusalemi,
  mera dau lakova mai na lewe i vuravura.\\n8 Sa bubului o Jiova ena ligana i matau
  kei na ligana o Koya sa kaukauwa sara: \\\"Au na sega dina sara ni solia tale na
  nomu sila me kedra na kemu meca; kei na luvedra tagane na kai matanitu tani ena
  sega ni na gunuva na waini vou, o koya o sa oca kina.\\n9 Ia o ira era sokomuni
  vata era na kania, ka vakacaucautaki Jiova; o ira era kauta vata mai era na mai
  gunuva ena Noqu loma ni bai tabu.\\\"\\n10 Mo curu yani, ka curuma na matamata!
  Caramaka na nodra sala na tamata; tara cake, mo tara cake na sala logaloga vinaka!
  Me kautani na vatu, ka vakarewataka na kuila vei ira na tamata!\\n11 Sa kacivaka
  o Jiova kina i yalayala kei vuravura, \\\"Tukuna kina goneyalewa ni Saioni, ''Sa
  lako dina mai na nomu Vakabula; Raica nai sau ena Vukuna sa tiko ga Vua me solia,
  na cakacaka sa tu e matana.''\\\"\\n12 Era na vakatokai ira na Tamata sa Savasava,
  o ira sa vakabula o Jiova; o na qai kacivi tu, o Koya ka Kune, na Koro sa Sega ni
  Guilecavi.\\nChapter 63\\n1 O cei oqo sa lako mai Itomi, ka daramaka tu nai sulu
  kesavi ni Posira, o Koya qo sa vakaiukuuku na Nonai sulu, ka lako vata tiko mai
  kei na Nona kaukauwa kece?\u2014\\\"Oi Au ka dau vosa vakadodonu, sa kaukauwa na
  noqu veivakabulai.\\\"\\n2 Cava sa damudamu kina na Nomu i sulu, sa vaka na kote
  sa butubutuki ena I keli ni waini?\\n3 \\\"Au a butulaka sobu nai keliwaini vakai
  Au ga, e sega ni dua vei ira na lewe ni vanua me tiko kei Au. Ni''u a buturaka ena
  Noqu cudru, ka butuka ena Noqu cudru katakata; na kena dra e sikava mai na noqu
  i sulu, ka tauvi dra na Noqu kote kece.\\n4 Na Yaloqu sa kila tiko na siga me''u
  na veisausaumi kina, ka sa qai yaco mai oqo na yabaki nei koya Noqui vakabula.\\n5
  Au rai yani, ia ka sega sara ga ni bau tu e dua me veivuke, Au kurabui ni sega ni
  dua me laurai; o koya oqo na ligaqu ga sa qai ia na veivakabulai vei Au; ka sa maroroi
  Au na Noqu cudru katakata.\\n6 Au a butulaki ira sobu na tamata ena Noqu cudru,
  ka kolotaka sobu i ra na nodra kaukauwa.\\\"\\n7 Au na tukuna na yalololoma i Jiova
  kei na vakavinavinaka i Jiova, me vaka na ka levu sa vakayacora vei keda, kei na
  nona loloma levu sa vakayacora ena mataqali i Isireli, me vaka na Nona lomani ira,
  kei na Nona loloma e sega yalani.\\n8 Ka sa vosa dina, \\\"O ira oqo na Noqu tamata,
  na luvequ ka sega vei ira na lasu.\\\" Ka sa yaco o Koya me nodra i Vakabula.\\n9
  Ena nodra veigauna rarawa, sa rarawa vata kei ira o Koya, na Agilosi ka dau tu e
  Matana sa qai vakabulai ira; ena Nona loloma kei na Nona lomalomani ira sa vakabulai
  ira kina; ka soli bula ena vukudra ka keveti ira ena veigauna sa oti yani.\\n10
  Ia o ira era talaidredre ga, ka vakararawataka na Nona Yalo Tabu; ka sa vuki tale
  kina o Koya me kedra meca, ka veivaluti kei ira.\\n11 Era sa qai nanuma na veigauna
  sa oti, ni tukuna o Mosese kei ira na nona tamata; \\\"E vei o Koya ka kauti ira
  cake mai ena loma ni wasawasa kei nai vakatawa ni Nona sipi? E vei o Koya ka vakatikora
  ki yalodra na Nona Yalo Tabu,\\n12 Ka liutaki ira ena veituberi ni ligai matau i
  Mosese ena ligana vakaiukuuku, ka wasea na wai e matadra, me rawa ni vakatetea kina
  na kaukauwa e tu ena Yacana e sega ni yalani rawa,\\n13 Ka tuberi ira ena vanua
  titobu, me vaka na ose ena vanua dravuisiga, me sega ni tarabe?\\\"\\n14 Me vaka
  na manumanu kila ni lako sobu kina bula, sa dau vakakina na Yaloi Jiova ni sa dauvakacegui
  ira, sa dau tuberi ira vinaka Nona tamata o Jiova, me vakalagilagi kina na Yacamuni.\\n15
  Mo ni rai sobu mai lomalagi, ka raica mai ena Nomuni tikotiko tabu vakaiukuuku,
  sa E vei na Nomu lomakatakata kei na Nomu kaukauwa, na gagadre ni yalomuni kei na
  Nomuni loloma mai vei au? A sa sega ni vakavotui mai?\\n16 Sai Kemuni na Tamai keimami,
  e dina ni sega ni kilai keimami o Eparama, ka sega ni bau kauwaitaki keimami o Isireli,
  Oi Kemuni Jiova, na Tamai keimami, Oi kemuni na neimami i vakabula sa Sega ni mudu
  na yacamuni.\\n17 I Jiova cava o ni vakavuna kina me keimami butu sevata na Nomuni
  sala, ka vakayalokaukauwataki keimami me keimami sega ni rere kina ni torovi Kemuni?
  Mo ni lesu mai ena vukudra na nomuni tamata, na mataqali ni Nomuni votavota.\\n18
  Era na taukena o ira na Nomu tamata sa savasava ia ena vakalailai ga, na keimami
  meca era butuka sobu Nomuni vale tabu.\\n19 Keimami sa qai vaka na tamata o ni sega
  tu ni lewai ira, mai na gauna makawa, o ira era sega ni vakayacani ena yacamuni.\\nChapter
  64\\n1 Mo ni sea mada na lomalagi! Ka lako sobu mai! Me ra yavala e matamuni na
  veiulunivanua\u2014\\n2 Me vaka na kama ni kau madu, sa bue kina na wai katakata\u2014
  Me kilai kina na yacamuni vei ira na Nomuni meca, era na domobula na veimatanitu
  e matamuni!\\n3 O ni cakava e so na ka e sega ni rawa ni vakamacalataki, keimami
  a sega ni raica, ni o Ni lako sobu mai, e yavavala na veiulunivanua e matamuni.\\n4
  E nai vakatekivu kei vuravura, a sega ni rogoci ena daliga, se me laurai e mata
  e dua na Kalou me tautauvata kei Kemuni. Ni o ni dau veivuke ena gauna o Ni gadrevi
  kina.\\n5 O ni dau sotava o koya e reki tiko ka kitaka na ka dodonu, ka dau vakanananu
  ki na nomuni i valavala. O ni a cudruvi keimami ni keimami a valavala ca \u2014
  keimami sa sega ni cakava tale, ka keimami gadreva na veivakabulai.\\n6 Ia keimami
  sa vaka na ka sa sega ni savasava Oi keimami kecega ka sa vaka nai sulu madra na
  neimami valavala dodonu, keimami malai vaka na drau ni kau, kei na neimami caka
  cala sa vaka na cagi, na kena vukaci tani.\\n7 Sa sega tale e dua me masuta na yacamuni,
  ka vakauqeti koya ga me tatakube vei keimuni; Ni o ni sa vunia na matamuni vei keimami,
  ka vakaoti keimami vakadua ena vuku ni neimami caka cala.\\n8 Ia, oqo Jiova, o ni
  sa Tamai keimami; Oi keimami na tete, Oi kemuni na dautuli kuro; keimami na mawe
  ni ligamuni.\\n9 Mo ni kua ni cudru vakalevu, i Jiova, mo ni kua ni nanuma na neimami
  caka cala; mo ni raica ka kila mada\u2014ni keimami sa Nomuni tamata Oi keimami
  kecega!\\n10 A nomuni koro lelevu sa veitalasiga, o Saioni sa veitalasiga, o Jerusalemi
  sa lala tu.\\n11 Na neimami vale tabu rairai totoka, na vanua era dau laveti Kemuni
  kina na neimami qase, sa vakamai ena buka waqa, kei na neimami yaya vakamareqeti
  sa vakarusai kece.\\n12 O ni na vosoti keimami Jiova ena vuku ni ka oqo? O ni na
  tarovi kemuni mai kina, se vakararawataki keimami vakalevu sara?\\nChapter 65\\n1
  \\\"Sa qarai Au mai o ira era a sega ni bau tarogi Au, sa kunei Au o ira era a sega
  ni vakasaqarai Au. Au a qai tukuna yani, ''Oi Au oqo,'' vua e dua na matanitu ka
  sega ni vakatokai ena Yacaqu.\\n2 Au a dodoka na ligaqu ena veisiga kina dua na
  mataqali tamata dautalaidredre, ena nodra talairawarawa tikoga kina nodra vakasama
  mera sega kina ni muria na gaunisala vinaka;\\n3 O ira na tamata oqo era vakacudrui
  Au tu ga e mataqu e veisiga; era cabora tu ga nodra i soro ena nodra vei teitei,
  kei na ka boi vinaka ena vatu buli ena qele;\\n4 Era dau dabedabe tu ga e maliwa
  ni bulubulu ka ra dau moce ena bogi ena vei qara vatu; ka ra qai kania tiko na viciko
  ni vuaka, na waibuta ni ka vakasisila sa sega tu ena nodra bilo;\\n5 Era tukuna,
  ''Mo tiko ga mai keri, kakua ni volekati au mai, ni''u sa savasava cake vei kedaru!''
  Sa curumi kubou cake ga na ucuqu ena buka waqa sa caudre tikoga e vei siga.\\n6
  \\\"Raica, sa volai tu e mataqu, Au na sega ni na tiko dei, me yacova ni''u sa sauma\u2014Io,
  Au na sauma me tara sara ga nodra ka vakamareqeti\u2014\\n7 Na nomudou caka cala,
  kei na caka cala i tamamudou,\\\" sa tukuna o Jiova, \\\"Ena nodra cabora nai madrali
  boi vinaka ena ulunivanua ka vosa vakacacataki Au ena delana, o koya oqo Au na sauma
  kina nodra cakacaka e liu me tara nodra ka vakamareqeti.\\\"\\n8 Sa tukuna vakaoqo
  o Jiova, \\\"Me vaka sa kune na waini vou ena i soso vua ni vaini, ka sa tukuna
  e dua, ''Mo kakua ni vakacacana ni sa tu kina na ka ni veivakasaututaki,'' Au na
  kitaka vakakina ena vukudra na Noqu tamata, Me''u kakua ni vakacacani ira kecega.\\n9
  Au na kauta mai e dua na kawa i Jekope kei Juta e dua o koya ena taukena na noqu
  ulunivanua; na Noqu digitaki era na vakaivotavota kina kei ira na Noqu tamata, era
  na tiko kina.\\n10 O Seroni ena yaco me bai ni sipi, kei na Buca i Aikori ena nodra
  i vakavakacegu na bulumakau, vei ira na Noqu tamata era dau qarai Au.\\n11 \\\"Ia
  oi kemudou sa biuti Jiova, ka guilecava na Noqu ulunivanua tabu, ka vakarautaka
  na teveli vei Kata, ka vakacabora na yaqona vei Meni.\\n12 O koya oqo sa nomudou
  i lesilesi kina nai seleiwau; baleta Ni''u kaci yani vei kemudou, dou qai sega ni
  via rogoca, Ni''u vosa yani, dou qai vakavaravarai kemudou, ia dou qai cakava tiko
  na ka sa dukadukali e mataqu, ka digitaka na ka Au sega ni taleitaka.\\\"\\n13 O
  koya oqo sa tukuna na Kalou o Jiova: \\\"Raica, ena kana na Noqu tamata, ia o iko
  o na viakana, raica, ena gunu na Noqu tamata, ia o iko o na viagunu; raica ena marau
  na Noqu tamata, ia o iko o na matamadua;\\n14 Raica, o ira Noqu tamata era na sere
  ena yalo e marau, ia o iko o na tagi e na yalo e bibi, kei na tagi lagalaga ena
  rarama ni yalo.\\n15 Mo biuta mai na yacamudou me ra dau rukaka o ira na Noqu digitaki,
  ni na vakamatei iko na Kalou o Jiova, ka kacivi ira tale Nona tamata ena dua na
  yaca vou;\\n16 O koya sa kalouvinaka e vuravura sa kalouvinaka talega ena mata ni
  Kalou dina, o koya sa bubului e vuravura ena bubului talega ena mata ni Kalou dina;
  baleta ni sa guilecavi na leqa sa oti ka sa yali vakadua e mataqu.\\n17 \\\"Ka raica,
  au sa bulia na lomalagi vou kei na vuravura vou; na vuravura makawa ena sega ni
  nanumi tale.\\n18 Ia dou reki ka marau me sega ni mudu ena ka Au sa bulia; ka raica,
  Au bulia me dau reki o Jerusalemi, kei ira vata tukuna na lewena.\\n19 Au na marau
  tiko mai Jerusalemi, kei na nodra reki vata na Noqu tamata, e sa na yali na domo
  ni tagi kei na tagi qoqolou.\\n20 \\\"Ena sega ni dua na gone lailai se qai siga
  vica ga na nona bula me tikoi kea, se dua na qase me qase ca sara; ni o koya na
  gone ena mate ni sa yabaki dua na udolu, ia na tamata i valavala ca ni sa yacova
  na yabaki e dua na drau e sa na ka ni voraki vua.\\n21 Mera na tara vale ka tiko
  kina, me ra tea na veiloga ni vaini ka kania na vuana.\\n22 Me kua tale ni ra tara
  e dua nodra i tikotiko, me ra kua tale ni tea e dua na kau me ra kania; me vaka
  na balavu ni bula ni dua na kau ena vakakina nodra yabaki ni bula na Noqu tamata,
  era na qai marautaka tiko na cakacaka ni ligadra.\\n23 Ena ka walega na nodra oca,
  se vakasucuma na gone me ka ni rarawa vei ira; ni kawa e vakalouvinakataka o Jiova,
  kei ira na luvedra era na tiko vata ga.\\n24 \\\"Ni sa yaco dina sara se bera ni
  ra masu mai, Au sa rogo yani, ni ra qai tekivu me vosa mai, Au sa rogoca oti tu.\\n25
  Na wolifa kei na lami e rau na dovia vata na kedrau, na laione ena kania na taba
  ni sila me vaka na bulumakau yadru, kei na gata ena dau kania na kuvu ni qele. Era
  na sega ni veivakamavoataki se veivakamatei ena Noqu veiulunivanua tabu kecega,\\\"
  sa tukuna o Jiova.\\nChapter 66\\n1 Sa tukuna vakaoqo o Jiova: \\\"O lomalagi sa
  Noqu i tikotiko vakaTuraga, o vuravura sai tutu ni yavaqu. A vale cava dou na tara
  me Noqu? kei na vanua cava Me''u dau cegu kina?\\n2 Na ka kecega oqori sa cakava
  na ligaqu, na ka kece oqori e tu dei,\\\" sa tukuna o Jiova. \\\"Ia na tamata Au
  sa na goleva me sa dau yalomalumalumu, ka voroki rawarawa na yalona, ka sa rerevaka
  na Noqu vosa.\\n3 \\\"O koya sa vakamatea na bulumakau e rawa ni vakamatea talega
  na tamata; o koya e cabora e dua na lami, e rawa ni musuka talega na domo ni koli;
  o koya e cabora nai madrali, e vaka talega na cabori ni dra ni vuaka; o koya e cabora
  na ka boi vinaka e vaka talega nona vosa vinakataka na matakau. Ena nodra sa digitaka
  ga na nodra sala mera muria, na lomadra sa marautaka na nodra vakaloloma,\\n4 \\\"O
  Au na digitaka beka na ka era sa oca walega kina, ka vakarerei ira ena ka era rerevaka;
  baleta Ni''u kaci yani, sega ni dua e bau rogo, Ni''u vosa yani era sogota na daligadra;
  ia era cakava ga na ka dukadukali e mataqu, ka digitaka na ka Au sega ni taleitaka.\\\"\\n5
  Dou rogoca na vosa i Jiova, oi kemudou sa rerevaka na Nona vosa; \\\"O ira na wekamudou
  ka cati kemudou ka biuti kemudou tani ena vuku ni yacaqu, era sa tukuna, ''Me vakarokorokotaki
  o Jiova, ena rairai ga o koya mo dou reki kina,'' ka ra na madua ga o ira.\\\"\\n6
  Na domo ni mauwe mai na koro levu! Kei na rorogo mai na vale ni soro! Ni sa domo
  i Jiova, Nona sausaumi lesu tiko vei ira na kena meca!\\n7 \\\"Ni se bera na nona
  taratara, sa vakasucu o koya, ka vakasucuma e dua na gone tagane, ni se bera ni
  yacovi koya mai na mosi.\\n8 O cei sa bau rogoca e dua na ka vakaoqo? O cei sa raica
  na ka vakaoqo? O vuravura e sega ni vakasucu ga vakadua ena dua na siga? Se sucu
  vata vakadua na lewei vuravura kece? Ena gauna sa taratara kina o Saioni, sa vakasucumi
  ira na luvena.\\n9 Me''u vakayacora beka na taratara ka sega ni vakayacora talega
  na vakasucu?\\\" Sa tukuna o Jiova, \\\"Se Me''u vakayacora beka na vakasucu ka
  qai sogota tale? \\\" Sa tukuna na nomu Kalou.\\n10 \\\"Dou reki vata kei Jerusalemi,
  ka marautaki koya oi kemudou kece sa lomani koya, dou reki vakalevu vata kei koya,
  oi kemudou ka tagicaki koya;\\n11 Dou na vakani ka mamau ena loma ni lomaserena,
  o na vagunuvi ka vuabale ena vakavinavinaka, ni sa vakasinaiti iko na nona i ukuuku.\\\"\\n12
  Ni sa tukuna vaka oqo o Jiova: \\\"Raica, Au na vakadrodroya vua na vakacegu me
  vaka na drodro ni uciwai, kei na nodra lagilagi na Veimatanitu tani me vaka na drodro
  ni mata ni wai lalai, o na qai vakani tiko, ena qai keveti iko o koya o na qai tenei
  e duruna.\\n13 Me vaka na nona veivakamenemenei na tina ni gone, Au na vakayacora
  talega vaka kina, dou na maroroi vaka talega kina mai Jerusalemi.\\\"\\n14 Ni dou
  sa raica na ka oqo, me reki na yalomudou, ena qai tubu me bulabula mai na nomudou
  sui me vaka na co, ena kilai na ligai Jiova vei ira Nona tamata, na cudruvi vei
  ira na Kena meca.\\n15 Raica, ena lako mai vaka na buka waqa o Jiova kei na Nona
  qiqi ni valu e vaka na covu-laca, ena Nona sausaumi lesu ena cudru katakata, kei
  na nona vosa e vaqeavutaka na ka kecega.\\n16 Ena yameyame ni buka waqa kei nai
  selewau, ena ia kina na veilewai o Jiova ena tamata kecega; e levu ena mate ena
  veivakamatei i Jiova.\\n17 \\\"O ira era vakasavasavataki ira kei ira era ukutaki
  ira, ena nodra lakova na matakau ena loma ni teitei, era kania na viciko ni vuaka,
  kei na ka vakasisila kei na kalavo, era na vakawabokotaki vata ga,\\\" sa tukuna
  o Jiova.\\n18 \\\"Au sa kila na nodra cakacaka kei na nodra vakanananu, Ni''u na
  vakasoqoni ira vata na duivosavosa ni veimatanitu, me ra lako mai ka raica na Noqui
  ukuuku.\\n19 \\\"Au na biuta vei ira e dua nai vakatakilakila vei ira era dro Au
  na talai ira kina veimatanitu: Ki Tasisi, kei Puli, kei Luti o ira na dau vakadretaka
  na dakaititi, ki Tupali kei Javana, ki na veiyanuyanu yawa yani era se bera ni rogoca
  na Kequi rogorogo, se raica Noqu i serau. Ia e ra na qai kacivaka yani Noqu lagilagi
  ki na veimatanitu tani.\\n20 \\\"Era na kauti ira mai na mata veiwekani me ra mai
  vakacaboi soro vei Jiova na veivanua kecega, ena ose kei na qiqi ni valu na vatavata,
  ena meule kei na kameli, kina noqu ulunivanua tabu o Jerusalemi;\\\" sa tukuna o
  Jiova, \\\"Me vaka nodra kauta mai na luvei Isireli nai yaya savasava kina vale
  i Jiova.\\n21 \\\"Au na lesia talega eso vei ira me bete kei na Livai,\\\" sa tukuna
  o Jiova.\\n22 \\\"Me vaka na lomalagi vou kei na vuravura vou Au na qai vakarautaka
  me tu e mataqu,\\\" sa tukuna o Jiova, \\\"Ena tudei vakatalega kina na nomudou
  kawa kei na yacamudou.\\n23 Ena yaco mai na gauna mai na dua na vula vou kina dua
  tale na vula, mai na dua na Siga ni Vakacecegu kina dua tale na Siga ni Vakacecegu,
  era na dui lako mai na veimataqali tamata mera mai qaravi Au.\\\" Sa tukuna o Jiova.\\n24
  \\\"Ni ra sa lako mai era na qai raica na yago ni tamata mate, o ira ka ra dau vakacudrui
  Au. E sega ni vuca na yagodra, ka sega ni boko rawa na buka waqa ka caudre tiko
  vei ira, ni ra raica na tamata kecega, era na vakasisilataka.\\\"\"", "\"VEIKA VAKALAWA\\nEna
  rogoci tale e Tangarog Rusia ena ika11 ni Tiseba, 2014 na nodratou kerekere na le
  16 na iVakadinadina. Ratou totogitaki ni ratou vakaitavi ena cakacaka e vakavuna
  na \u201ctiko yavavala.\u201d\\nRA TAROGA NA ITABAGONE\\nVakatulewa vinaka me baleta
  na alakaolo mo kua kina ni totogitaki se vakacacani kemu irogorogo, me kua ni vakayacori
  vei iko na veivakasagai tawakilikili, mo kua ni bobula ina gunu, mo kua tale ga
  ni mate.\\nRA TAROGA NA ITABAGONE\\nO via vakamacalataka ena doudou na vuna o vakabauta
  kina na Kalou? Vulica na ka mo kaya ke so era vakataroga na ka o vakabauta.\\nRA
  TAROGA NA ITABAGONE\\nE sega ni gadrevi mo kila vinaka na veika vakasaenisi mo rawa
  ni vakamacalataka na vuna o vakabauta kina ni buli na veika e tu e vuravura. Vakayagataka
  na ivakamacala rawarawa qai matata ena iVolatabu.\\nSAUMI NA TARO VAKAIVOLATABU\\nVakacava
  ke sa kilai tiko ni sa na mate ga e dua, e dodonu me sagai me vakabalavutaki nona
  bula se mani iwalewale cava e muri?\"", "\"NA koro vakaturaga o Taulevu e wili tiko
  e na tikina o Matailobau ka veiliutaki tiko kina na yavusa Siko. E tolu na yavusa
  e vaka i tikotiko e na koro kei na qele vaka Taulevu.\\nE vakaraitaka ko Kaveni
  Nakailagi yabaki 63 na i liuliu ni yavusa Mati ni tolu na yavusa. Na yavusa Siko
  ka sa veiliutaki tiko e Taulevu, yavusa Mati kei na yavusa Nairai.\\nNa yavusa Siko
  e 3 na mataqali e wili tiko kina. Na mataqali Siko ka veiliutaki tiko, tarava na
  mataqali Nadovunisili kei na mataqali ko Nawaita.\\nE na yavusa Mati e lima na kena
  mataqali oya na mataqali Mati, mataqali o Navetau, mataqali o Tova, mataqali o Gasele
  ka ratou sa tiko mai Waidracia kei na mataqali o Nakawaga ka ratou sa kawa boko.\\nNa
  i katolu ni yavusa oya na yavusa Nairai ka tolu na kena mataqali oya na mataqali
  o Nairai, mataqali Qoma kei na mataqali ko Natauloa e ratou sa tiko mai Nairai e
  na gauna qo.\\nE kaya ko Nakailagi ni suitu ni yavusa Siko oya e nodratou kau na
  vico, ika na vo ka nodratou manumanu na vuaka. Ia, na yavusa Mati e nona kau na
  vesi, ika na beli ka nona manumanu na toa.\\nNa yavusa Nairai e nona kau na vutu,
  ika na duna ka sega ni ratou kila na nodratou manumanu.\""]'
