  k\u00e9uh yang j\u00e9ut\\nAdmin tuleh nibak uro\u00e9 nyo\u00e9 s\u00e8umoga m\u00e9umanfaat
  k\u00e9u g\u00e9utanyo\u00e9 mandum.\"", "\"Thursday, November 19, 2009\\nSalamu''alaikom
