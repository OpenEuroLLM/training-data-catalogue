  Nabi Muhammad nibak Uroe Dudoe\u2026Amiin-Amin Ya Rabbal \u2018Alamin\\nGeupeusaho
  ngon Geutuleh Kelai Le Ureung\\nHina Teungku Edi Syuhada, Salah Sidroe Khadam Thalabah
  Bak Dayah\u201cDarul Ihsan\u201d\\nAbu Krueng Kalee.\\nPosting Komentar\"", "\"Strength\\n-
  TUHAN Po teu Allah gata teuma geuseut\u00f4t sira geujak tul\u00f4ng gata, dan Gobnyan
  teuma geupeumeunang gata.'' Kitab Teu-Ulang 20:4\\n- Ingat, Ul\u00f4n ka L\u00f4n
  bri peurintah ubak gata mangat gata biet-biet yak\u00e9n dan beurani! B\u00e9k kheueh
  gata takot dan kureueng seumangat, sabab ul\u00f4n TUHAN Po teu Allah gata sabe
  na meusajan gata bahpi ho mantong nyang gata jak.\\\" Joshua 1:9\\n- \u00d3h lheueh
  nyan l\u00e9 Nabi Daud geupeugah lom ubak aneu\u00ebk gobnyan Nabi Sulaiman, \\\"Gata
  har\u00f4h yak\u00e9n dan gata jeuet. Tapeuphon kheueh meubuet nyan dan gata b\u00e9k
  yo mubacut pih keupeue mantong. TUHAN Allah nyang ul\u00f4n seumah geutul\u00f4ng
  gata. Allah hana geutinggai gata. Gobnyan teutab na sabe disampeng gata sampoe nyang
  gata peubuet nyan seuleusoe. 1 Tawarikh 28:20\\n- Bak awaknyan nyang na teunaga
  manusia, teuma nibak geutanyoe na TUHAN Po teu Allah nyang tul\u00f4ng geutanyoe
  didalam prang.\\\" Ban geudeungoe kheun raja droe geuh nyan, rakyat pih meutamah
  beurani. 2 Tawarikh 32:8\\n- Jinoenyoe tajak woe kheueh u rumoh gata mas\u00e9ng-mas\u00e9ng;
  tamakheun dan tajieb kheueh i\u00e9 deungon mangat dan geumbira. Tajok kheueh siladum
  nibak peunajoh dan angg\u00f4 gatanyan keu ureu\u00ebng nyang bit-bit peureul\u00e9e.
  Uroe nyoe na kheueh uroe nyang khusos keu TUHAN, Allah geutanyoe, jadi, b\u00e9k
  kheueh gata peususah at\u00e9. Geumbira nyang geujok l\u00e9 TUHAN keu gata nyan
  na kheueh mangat teupeuteuga gata.\\\" Nehemiah 8:10\\n- Ya TUHAN, Allah kamoe,
  kuasa Droeneueh meusyeuhu bansaboh bumoe! Keuagongan Droeneueh trok u lang\u00e9t
  Zabur 8:2\\n- Droeneueh puhu pany\u00f4t ul\u00f4n; TUHAN Allah ul\u00f4n nyang
  peu peungeuh ul\u00f4n nibak seup\u00f4t. deungon tul\u00f4ng Allah ul\u00f4n peuhanco
  peutahanan awaknyan. Sabab TUHAN kheueh Po teu Allah; Allah mantong nyang jeuet
  keu nyang bila geutanyoe. Zabur 18:29, 30B, 32\\n- Jinoenyoe bar\u00f4 kheueh ul\u00f4n
  teupeue bahwa TUHAN geubri keumeunangan ateueh raja nyang geupil\u00e9h. TUHAN geujaweueb
  gobnyan di syeuruga nyang suci; l\u00e9 kuasa TUHAN gobnyan meuteum\u00e9 meunang
  nyang paleng raya. Zabur 20:7\\n- Keu teupimp\u00e9n kor. Zabur Nabi Daud. Zabur
  21:1\\n- Ul\u00f4n yak\u00e9n teuma l\u00f4n rasa keuba\u00edekan TUHAN lam udeb
  l\u00f4n lam donya nyoe. Meuharab kheueh ubak TUHAN, peukong kheueh dan peuteutab
  kheueh at\u00e9 droeneueh; nyoe, meuharab kheueh ubak TUHAN. Zabur 27:13, 14\\n-
  TUHAN peulindong dan nyang bila ul\u00f4n, ul\u00f4n peucaya ubak Gobnyan. Gobnyan
  geutul\u00f4ng dan nyang peu mangat at\u00e9 ul\u00f4n, ul\u00f4n pujoe Gobnyan
  deungon ca-e dan nyanyoe syuko. TUHAN geubri teunaga keu umat Gobnyan, Gobnyan geubila
  dan geupeuseulamat raja nyang geupil\u00e9h l\u00e9 Gobnyan keudroe. Zabur 28:7,
  8\\n- Meunyoe ureu\u00ebng sal\u00e9eh nyang meuh\u00f4i, TUHAN geudeungoe, dan
  geupeuseulamat awaknyan nibak banmandum nyang salah. Zabur 34:18\\n- Ureu\u00ebng
  jeuhet teuma mat\u00e9 sabab buet jih nyang jeuhet, ureu\u00ebng nyang jibanci keu
  ureu\u00ebng sal\u00e9eh teuma geuhuk\u00f6m. Zabur 34:22\\n- TUHAN geubimb\u00e9ng
  ureu\u00ebng nibak rot nyang har\u00f4h geulalu, Gobnyan geupeukong ureu\u00ebng
  nyang udeb jih teutab meukeunong bak at\u00e9 Gobnyan. Meunyoe rhot, ureu\u00ebng
  nyan hana that meubahya, sabab TUHAN geumat jaroe ureu\u00ebng nyan. Zabur 37:23,
  24\\n- TUHAN geupeuseulamat ureu\u00ebng sal\u00e9eh, dan geulindong awaknyan \u00f3h
  wat\u00e9e teuseupet. Zabur 37:39\\n- Ya Allah, Droeneueh kheueh nyang peurunoe
  ul\u00f4n yoh phon ul\u00f4n nyoe mantong muda, sampoe \u00e1n jinoe ul\u00f4n kisah
  buet Droeneueh nyang takAyub luwa biasa nyan. Ya Allah, b\u00e9k kheueh neutinggai
  ul\u00f4n, sampoe ul\u00f4n tuha dan put\u00e9h \u00f4k nibak ul\u00e9e, mangat
  hase ul\u00f4n peusampoe Zabur 71:17, 18\\n- Droeneueh neubri keu ul\u00f4n peundeuritaan
  nyang lumpah brat, teuma Droeneueh neupeupul\u00e9h teunaga ul\u00f4n dan neupeubeud\u00f4h
  ul\u00f4n dalam jrat. Droeneueh neupeujeuet ul\u00f4n leubeh teuhoreumat, dan neuhib\u00f4
  ul\u00f4n lom. Zabur 71:20, 21\\n- Bahpi jiwa raga l\u00f4n meutamah leumoh, Droeneueh
  kheueh teunaga ul\u00f4n, ya Allah; Droeneueh kheueh banmandum atra ul\u00f4n keu
  siumu masa. Zabur 73:26\\n- Keubit that bahgia ureu\u00ebng nyang tinggai di Ba\u00e9t
  Droeneueh, dan jimeuca-e nyanyoe pujo keu Droeneueh tieb-tieb wat\u00e9e. Teungoh
  awaknyan jijak rot Pant\u00f4n Baka, teumpatnyan awaknyan ubah sampoe jeuet keu
  mata i\u00e9, ujeuen nyang phon i\u00e9 jih meulimpah deungon beureukat. Zabur 84:5,
  7\\n- Meunyoe at\u00e9 ul\u00f4n gundah ngon apoh apah, Droeneueh nyang hib\u00f4
  dan peugeumbira. Zabur 94:19\\n- TUHAN na kheueh teunaga ul\u00f4n dan pujaan ul\u00f4n,
  Gobnyan ka geupeuseulamat ul\u00f4n. Zabur 118:14\\n- Jiwa ul\u00f4n ka hanco meukeupeng-keupeng
  keunong keusosahan, neupeukong kheueh ul\u00f4n nyang sisuai deungon janji Droeneueh.
  Zabur 119:28\\n- Nyoe kheueh nyang peulalo ul\u00f4n lam peundeuritaan, bahwa janji
  Droeneueh nyan teuba ul\u00f4n ubak udeb. Zabur 119:50\\n- Wat\u00e9e ul\u00f4n
  rhot bak apoh apah, Droeneueh nyang peuteun udeb ul\u00f4n. Droeneueh nyang lawan
  musoh l\u00f4n nyang teungoh beung\u00e9h dan Droeneueh peuseulamat ul\u00f4n ngon
  kuasa Droeneueh. Zabur 138:7\\n- Dikeue Gobnyan ul\u00f4n apoh apah; ul\u00f4n peugah
  laju peue mantong keusosahan l\u00f4n ubak Gobnyan. Zabur 142:3\\n- Sabab Droeneueh
  jeuet keuteumpat meu-ungs\u00e9 keu ureu\u00ebng nyang leumoh, teumpat nyang aman
  nibak ureu\u00ebng gasien wat\u00e9e meukarat. Droeneueh kheueh peulindong nibak
  ang\u00e9n bad\u00e9e, teumpat meupayong l\u00e9 uroe criet nyang meutala. beuliong
  wat\u00e9e ujeuen teuka, Nabi Yesaya 25:4\\n- Gobnyan nyang peuteuga ureu\u00ebng
  nyang h\u00e9k, geubri seumangat keu ureu\u00ebng nyang hana meudaya. Nabi Yesaya
  40:29\\n- Teuma ureu\u00ebng nyang meuharab ubak TUHAN mantong, ureu\u00ebng nyan
  teuma meuteum\u00e9 teunaga bar\u00f4. Awaknyan lag\u00e9e cic\u00e9m siwah nyang
  jipo manyang deungon teunaga sayeub jih. Awaknyan jiplueng dan hana meunyuem h\u00e9k,
  awaknyan jijak dan hana jeuet keu leusu. Nabi Yesaya 40:31\\n- B\u00e9k teumakot,
  sabab Ul\u00f4n na meusajan gata, b\u00e9k gundah, sabab Ul\u00f4n na kheueh Po
  teu Allah gata. Gata Ul\u00f4n peukong dan Ul\u00f4n tul\u00f4ng, Ul\u00f4n peutakteh
  deungon jaroe Ul\u00f4n nyang jaya. Nabi Yesaya 41:10\\n- Meunyoe bansa Ul\u00f4n
  nyang malang nyan jijak mita i\u00e9, dan takue awaknyan tho sabab glaih, teuma
  Ul\u00f4n, TUHAN, L\u00f4n jaweueb do\u00e1 awaknyan; Po teu Allah Israel hana geutinggai
  umat Gobnyan. Nabi Yesaya 41:17\\n- keu teubri keugeumbiraan dan suka cita keu ureu\u00ebng
  nyang teungoh seudeh dan keunong musibah; keuteu ubah seudeh awaknyan jeuet keu
  ca-e puja ngon pujoe. Awaknyan teuma jeuet lag\u00e9e bak kay\u00e9e nyang geupula
  l\u00e9 TUHAN keudroe. Awaknyan jipeubuet nyang jroh dan nyang beuna, dan TUHAN
  jipeuagong teuma. Nabi Yesaya 61:3\\n- Laju TUHAN Nyang Mahakuasa meufeureuman ubak
  ul\u00f4n, \\\"He Yeremia, sabab awaknyan ka jipeugah haba nyang lag\u00e9e nyan,
  awaknyan keunong bala nyang meunurot awaknyan hana teujadi. Ul\u00f4n kupeujeuet
  tutoe haba L\u00f4n lag\u00e9e apui hu lam babah gata. Bansa nyoe jeuet lag\u00e9e
  kay\u00e9e nyang teutot, dan apui nyan jitot awaknyan sampoe hab\u00e9h.\\\" Nabi
  Yeremia 5:14\\n- Sabab, TUHAN hana geutulak geutanyoe siumu masa. \u00d3h ka lheueh
  Gobnyan geubri peundeuritaan, nibak gobnyan pih na gas\u00e9h sayang, sabab Gobnyan
  teutab geugas\u00e9h keu geutanyoe deungon geunas\u00e9h nyang hana bataih. Gobnyan
  hana deungon rila at\u00e9 geupeubiyeu geutanyoe meudeurita dan seudeh. Peumo Ba-E
  3:31-33\\n- Ul\u00f4n L\u00f4n peukong umat Ul\u00f4n, awaknyan ta\u00e1t dan meubakti
  ubak Ul\u00f4n. Zechariah 10:12\\n- Sabab nyang peugah haba bak wat\u00e9e nyan
  kon kheueh gata, teuma Roh Bapak nyang na dalam syeuruga, rot gata. Matius 10:20\\n-
  Isa geungieng ateueh awaknyan laju geupeugah, \\\"Nibak manusia, hai nyan hana jitamong
  lam akai! Teuma nibak Po teu Allah, bandum mungken.\\\" Matius 19:26\\n- Teuma gata
  meuteum\u00e9 kuasa, meunyoe Roh Allah ka teuka ubak gata. Dan gata jeuet keu saksi-saksi
  keu Ul\u00f4n di Yerusalem, bansaboh Yudea, di Samaria dan sampoe u ujong bumoe.\\\"
  Kisah Rasui-Rasui 1:8\\n- Anggota-anggota sidang peungadelan nyan hireuen that-that
  wat\u00e9e jikalon keubeuranian Petrus ngon Yahya, peuteuk lom awaknyan jiteupeue
  bahwa mandua droe rasui nyan na kheueh ureu\u00ebng-ureu\u00ebng biasa nyang h\u00e1ntom
  jijak beuet. Laju awaknyan sadar bahwa mandua droe rasui nyan na kheueh ureu\u00ebng-ureu\u00ebng
  nyang na jiseut\u00f4t ngon Isa. Kisah Rasui-Rasui 4:13\\n- Tanyoe tateupeue bahwa
  Allah nyang atoe peue-peue mantong, sampoe jipeuhase nyang g\u00e9t keu ureu\u00ebng-ureu\u00ebng
  nyang gas\u00e9h Gobnyan dan geuh\u00f4i jihnyan saban ngon reuncana Gobnyan. Roma
  8:28\\n- Peu kheueh nyang jeuet teupeugah bak wat\u00e9e nyoe ngon mandum nyan?
  Meunyoe Allah na blaih geutanyoe, soe nyang hase jilawan tanyoe? Roma 8:31\\n- Sabab
  nibak ureu\u00ebng nyang jituju ubak keubinasaan, haba keuhai mat\u00e9 Almaseh
  bak kay\u00e9e saleb nyan na kheueh haba sulet. Teuma, keugeutanyoe nyang geupeu
  seulamat l\u00e9 Po teu Allah, haba nyan na kheueh cara jih Allah geutunyok kuasa
  Gobnyan. 1 Korintus 1:18\\n- Haba nyang ul\u00f4n peutrok bak gata hana ul\u00f4n
  peutrok ngon tutoe nyang meunarek meunurot keubijaksanaan manusia. Ul\u00f4n peutrok
  nyan ngon cara teubri bukeuti bahwa Roh Allah meukuasa. Ul\u00f4n peubuet lag\u00e9e
  nyan, mangat keupeucayaan gata ubak Almaseh hana meudasai bak keubijaksanaan manusia,
  teuma meudasai bak kuasa Po teu Allah. 1 Korintus 2:4, 5\\n- Beuat\u00e9-at\u00e9
  dan waspada kheueh gata dan beukong lam udeb gata sibagoe ureu\u00ebng Kristen.
  Meutindak kheueh ngon beuhe dan beuteuga kheueh. 1 Korintus 16:13\\n- Nibak kamoe
  hana sapeue alasan pi keuteupeugah bahwa kamoe hase kamoe peubuet buet nyoe, teuma
  Allah nyang bri keumampuan nyan ubak kamoe. 2 Korintus 3:5\\n- Sinjata-sinjata nyang
  kamoe peuguna lam peujuangan kamoe kon sinjata donya nyoe, teuma sinjata-sinjata
  Allah nyang meukuasa. Ngon sinjata-sinjata nyan laju kamoe peuhanco bubena kuta-kuta;
  kamoe tangkeh bubena dobat-dobat 2 Korintus 10:4\\n- Teuma Tuhan geujaweueb, \\\"Ul\u00f4n
  kugas\u00e9h gata dan nyan ka seb keugata; sabab kuasa Ul\u00f4n keubiet that teuga
  meunyoe gata lam keuadaan leumoh.\\\" Nyang kheueh sabab jih ul\u00f4n leubeh galak
  l\u00f4n peubangga hai-hai l\u00f4n nyang leumoh, sabab meunyoe ul\u00f4n ka leumoh,
  dan bak wat\u00e9e nyan kheueh ul\u00f4n rasa Almaseh geulindong ul\u00f4n ngon
  teunaga Gobnyan. Ngon lag\u00e9e nyan ul\u00f4n keubiet that galak ateueh keuleumohan
  l\u00f4n nyan. Ul\u00f4n biet that mangat at\u00e9 meunyoe l\u00e9 sabab Almaseh
  ul\u00f4n jifiteunah, ul\u00f4n meuteum\u00e9 susah, jilet-let dan ul\u00f4n meuteum\u00e9
  keupayahan. Sabab meunyoe ul\u00f4n leumoh, teuma bak wat\u00e9e nyan kheueh ul\u00f4n
  jiteuka teumakot. 2 Korintus 12:9, 10\\n- Ul\u00f4n meudo\u00e1 seumoga Allah nyang
  mahamulia geutembri teupeukong bat\u00e9n gata ngon Roh Gobnyan. Efesus 3:16\\n-
  Akh\u00e9 jih, bah kheueh gata teuga ngon teunaga nyang gata teum\u00e9 nibak kuasa
  Tuhan, sabab gata meusaboh ngon Gobnyan. Efesus 6:10\\n- Allah keudroe kheueh nyang
  peuphon buet nyang jroh nyan keu gata, dan ul\u00f4n yak\u00e9n that Gobnyan teuma
  geupeubuet laju buet nyang lag\u00e9e nyan sampoe seuleusoe bak Uroe Isa Almaseh
  geuteuka lom teuma. Filipi 1:6\\n- Ngon kuasa nyang geubri l\u00e9 Almaseh keu ul\u00f4n,
  nibak ul\u00f4n kana teunaga keu l\u00f4n meuhadab ubak peue-peue mantong keuadaan
  nyang teuka. Filipi4:13\\n- Sabab Roh Allah nyang geubri ubak geutanyoe, kon kheueh
  Roh nyang teupeujeuet geutanyoe jeuet keuteumakot. Nyang sibeuna jih, Roh Allah
  nyan teupeujeuet geutanyoe meutamah teuga, peunoh ngon gas\u00e9h sayang dan hase
  tapeuteun droe. 2 Timotius 1:7\\n- Meunyoe tanyoe teutab tabah, geutanyoe teuma
  tamat peurintah cit meusajan Gobnyan. Meunyoe geutanyoe taiengkeue keu Gobnyan,
  Gobnyan pi teuma geuiengkeue keugeutanyoe. 2 Timotius 2:12\\n- Teuma Aneu\u00ebk-aneu\u00ebk
  l\u00f4n, gata na kheueh mil\u00e9k Allah. Gata ka tapeutalo nabi-nabi peuleusu,
  sabab Roh nyang na nibak gata leubeh meukuasa nibak roh nyang na nibak ureu\u00ebng-ureu\u00ebng
  mil\u00e9k donya nyoe. 1 Yahya 4:4\"", "\"1Bak siuroe, uroe Sabat, wat\u00e9e Isa
  geujak rot lamp\u00f4h gandom gob, murit-murit Gobnyan laju geupot boh gandom, laju
  geupajoh boh gandom nyan sabab ka deuk that. 2Wat\u00e9e jingieng hai nyan l\u00e9
  ureu\u00ebng-ureu\u00ebng Farisi, awaknyan laju jipeugah ubak Isa, \\\"Kalon kheueh!
  Murit-murit Droeneueh ji-iengkeue huk\u00f6m agama geutanyoe deungon cara jipeubuet
  nyang geutham bak uroe Sabat.\\\" 3Geujaweueb l\u00e9 Isa, \\\"Peu kheueh gohlom
  na gata beuet peue nyang ka geupeubuet l\u00e9 Nabi Daud wat\u00e9e gobnyan ngon
  murit-murit gobnyan deuek? 4Gobnyan geutamong lam Ba\u00e9t Allah; teuma laju geupajoh
  ruti nyang ka teupeuseumah keu Po teu Allah. Padahai meunurot huk\u00f6m agama geutanyoe,
  gobnyan meunan cit deungon murit-murit gobnyan hana jeuet geupajoh ruti nyan --
  nyang jeuet pajoh na kheueh imeum-imeum mantong. 5Atawa peu kheueh gohlom na gata
  beuet didalam huk\u00f6m Nabi Musa bahwa tieb-tieb uroe Sabat imeum-imeum nyang
  peubuet tugaih bak Ba\u00e9t Allah, geu-iengkeue peuratoran uroe Sabat, teuma hainyan
  hana geupeusalah? 6Neusimak kheueh peue nyang Ul\u00f4n peugah nyoe: disinoe na
  nyang leubeh rayeuk nibak Ba\u00e9t Allah. 7Lam Alkitab na meutul\u00e9h: Gas\u00e9h
  sayang kheueh nyang Ul\u00f4n lak\u00e9e, bukon keureubeuen beulatang. Meunyoe seukira
  jih gata beut\u00f4i-beut\u00f4i muphom peue nyang Ul\u00f4n peugah nyan, pasti
  gata hana tapeusalah ureu\u00ebng-ureu\u00ebng nyang hana meusalah. 8Sabab Aneu\u00ebk
  Manusia meukuasa ateueh uroe Sabat.\\\" 9Isa teuma laju geutinggai teumpat nyan
  teuma geujak u dalam saboh rumoh i\u00e9badat. 10Nibak teumpat nyan na ureu\u00ebng
  nyang jaroe jihnyan lap\u00e9e siblaih. Na meupadub droe nyang teungoh jimita salah
  nyang geupeubuet l\u00e9 Isa, awaknyan laju jitanyong ubak Isa, \\\"Peu kheueh jeuet
  teupeupul\u00e9h ureu\u00ebng bak uroe Sabat?\\\" 11Geujaweueb l\u00e9 Isa, \\\"Meunyoe
  sangkira jih na sidroe lamkawan gata na tapeulara saboh bubiri, dan bak uroe Sabat
  bubiri nyan rhot lam mon nyang lumpah that lhok; peu kheueh ureu\u00ebng po bubiri
  nyan hana jiuseuha jipeuteungoh bubiri lam mon nyan? 12Nyan, manusia leubeh muyuem
  nibak bubiri! Teuma, meunyoe meunan, jeuet teutul\u00f4ng gob bak uroe Sabat.\\\"
  13\u00d3h lheueh nyan Isa geupeugah ubak ureu\u00ebng nyang jaroe jih lap\u00e9e
  siblaih nyan, \\\"Sunyueng kheueh keunoe jaroe gata.\\\" Ureu\u00ebng nyan laju
  jisunyueng jaroe jihnyan, dan jaroe nyan laju pul\u00e9h lag\u00e9e jaroe siblaih
  treuk. 14Teuma l\u00e9 ureu\u00ebng-ureu\u00ebng Farisi laju jitinggai rumoh i\u00e9badat
  nyan, teuma laju jijakmupakat keuneuk poh mat\u00e9 Isa. 15Isa geuteupeue bahwa
  ureu\u00ebng-ureu\u00ebng Farisi nyan na niet brok keu Gobnyan. Teuma, Gobnyan laju
  geujak nibak teumpat nyan dan jai that ureu\u00ebng la\u00e9n nyang seut\u00f4t
  Gobnyan. Laju Gobnyan geupeu pul\u00e9h bandum ureu\u00ebng nyang sak\u00e9t. 16Teuma
  Gobnyan geutham ureu\u00ebng-ureu\u00ebng nyang geupeu pul\u00e9h nyan b\u00e9k
  jipeugah bak ureu\u00ebng la\u00e9n keuhai Gobnyan. 17Deungon lag\u00e9e nyan jeuet
  teuk peue nyang ka geupeugah l\u00e9 Allah rot Nabi Yesaya, 18\\\"Nyoe kheueh utosan
  l\u00f4n nyang ul\u00f4n pil\u00e9h, Ureu\u00ebng nyang L\u00f4n gas\u00e9h dan
  biet that galak at\u00e9 L\u00f4n. Roh Ul\u00f4n teuma L\u00f4n bri keu Gobnyan,
  keuadelan L\u00f4n teuma jipeusampoe keu bansa-bansa. 19Gobnyan hana geumeudakwa
  atawa geu-geumeuciek, atawa meupidato bak rot ueh raya. 20Trieng nyang leunuet hana
  teuma geuleug\u00f4t pany\u00f6t nyang mala hana teuma geupeulon. Gobnyan teuma
  meujuang sampoe keuadelan meuteum\u00e9; 21banmandum bansa geupeutroh harapan keu
  Gobnyan.\\\" 22\u00d3h lheueh nyan laju jiba ukeue Isa sidroe ureu\u00ebng buta
  dan kalu sabab ka jikuasa l\u00e9 roh jeuhet. Isa laju geupeu pul\u00e9h ureu\u00ebng
  nyan sampoe ka jeuet jipeugah haba ngon jikeumalon. 23Bandum ureu\u00ebng hireuen
  sira jipeugah, \\\"Mungken nyoe kheueh Gobnyan Aneu\u00ebk Nabi Daud nyang ka geupeu
  janji l\u00e9 Po teu Allah nyan?\\\" 24Wat\u00e9e ureu\u00ebng-ureu\u00ebng Farisi
  jideungoe hai nyan, awaknyan jijaweueb, \\\"Ureu\u00ebng nyoe nyang jeuet geu-use
  roh jeuhet, sabab Beelzebul, ul\u00e9e roh-roh jeuhet, ka geubri kuasa nyan keu
  Gobnyan.\\\" 25Isa geuteupeue pikeran ureu\u00ebng Farisi nyan. Teuma Gobnyan laju
  geupeugah ubak awaknyan, \\\"Meunyoe na saboh nanggroe ka peucah beulah sampoe ka
  jeuet meukaw\u00f6m-kaw\u00f6m nyang musoh meumusoh, nyan tanda jih nanggroe nyan
  hana \u00e9k meuteuen. Teuma saboh banda atawa keuluwarga nyang teujadi peucah beulah
  dan jeuet keumusoh saboh deungon nyang la\u00e9n teuma nyang lag\u00e9e nyan rhot
  keu ancoe. 26Meunan cit teuma lam keurajeuen Iblih; meunyoe na saboh kawan teu-use
  kawan nyang la\u00e9n, teuma keurajeuen Iblih nyan ka teujadi peucah beulah dan
  laju ancoe. 27Gata tapeugah bahwa Ul\u00f4n use roh jeuhet sabab kuasa Beelzebul.
  Meunyoe meunan deungon kuasa soe kheueh murit-murit gata jiuse roh jeuhet. Murit-murit
  gata keudroe nyang jeuet keutanda bahwa gatanyoe salah! 28Teuma Ul\u00f4n use roh
  jeuhet deungon kuasa Roh Allah. Dan nyan na kheueh sibagoe tanda bahwa Allah ka
  geupeu phon mat peurintah lamkawan geutanyoe. 29Pakriban ureu\u00ebng hase jitamong
  lam rumoh ureu\u00ebng kha keu jijak reupah hareuta ureu\u00ebng nyan, meunyoe ureu\u00ebng
  kha nyan hana teu-ikat leubeh il\u00e9e? \u00d3h lheueh nyan, bar\u00f4 kheueh gobnyan
  hase jicok bandum atra ureu\u00ebng nyan. 30Ureu\u00ebng nyang hana jidong blaih
  L\u00f4n nyang sikeubiet jih ureu\u00ebng nyan ka jilawan Ul\u00f4n. Dan ureu\u00ebng
  nyang hana jitem tul\u00f4ng Ul\u00f4n nyang sikeubiet jih ka jipeureul\u00f4h nyang
  Ul\u00f4n peubuet! 31Ngon sabab nyan, beutateupeu kheueh, meunyoe na ureu\u00ebng
  jipeubuet desya ngon jimeututoe nariet nyang hina, ureu\u00ebng nyan jeuet teupeu
  amphon! Teuma meunyoe ureu\u00ebng nyang jihina Roh Po teu Allah, ureu\u00ebng nyan
  hana jeuet teupeu amphon! 32Meunyoe na ureu\u00ebng jipeugah sipeue-peue nyang sifeuet
  jih jilawan Aneu\u00ebk Manusia, ureu\u00ebng nyan jeuet teupeue amphon, teuma meunyoe
  ureu\u00ebng nyan jihina Roh Po teu Allah, ureu\u00ebng nyang lag\u00e9e nyan hana
  jeuet geupeu amphon, bah kheueh nyan bak wat\u00e9e nyoe meunan cit \u00f3h uroe
  akhirat!\\\" 33\\\"Mangat boh kay\u00e9e nyan g\u00e9t, bak jih har\u00f4h subo
  ngon g\u00e9t. Meunyoe bak jih hana subo ngon g\u00e9t, b\u00f4h jih pih hana g\u00e9t.
  Sub\u00f6 jih bak kay\u00e9e nyan leumah teukalon nibak b\u00f4h jih. 34Gata ureu\u00ebng
  jeuhet, pakriban mungken gata jeuet tapeugah hai-hai nyang g\u00e9t meunyoe gata
  jeuhet? Peue nyang jipeugah l\u00e9 babah nyan kheueh teuma nyang teusur\u00e9h
  dalam at\u00e9! 35Ureu\u00ebng nyang g\u00e9t geumeututoe nyang jroh sabab ureu\u00ebng
  nyan peunoh ngon nyang g\u00e9t. Seubalek jih, ureu\u00ebng nyang jeuhet jimeututoe
  hai-hai nyang jeuhet sabab gobnyan peunoh ngon nyang jeuhet. 36Teuma, ingat kheueh:
  bak Uroe Kiamat, tieb-tieb ureu\u00ebng har\u00f4h meutanggong jaweueb ateueh tieb-tieb
  nariet nyang ka jipeugah nyang hana meuguna. 37Sabab tutoe gata keudroe kheueh nyang
  teungui keu teupeuput\u00f4h peu kheueh gata meusalah atawa beuna.\\\" 38\u00d3h
  lheueh nyan na meupadub droe gur\u00e9e agama dan ureu\u00ebng-ureu\u00ebng Farisi
  geupeugah, \\\"Bapak gur\u00e9e, kamoe keuneuk kalon Droeneueh neupeuleumah buet
  nyang aja\u00e9b.\\\" 39\\\"Keubiet that jeuhet jih dan doraka jih ureu\u00ebng-ureu\u00ebng
  bak jam\u00e9n nyoe!\\\" Geujaweueb l\u00e9 Isa, \\\"Gata nyoe talak\u00e9e mangat
  L\u00f4n peuleumah buet aja\u00e9b? Keu gata hana teubri bah pih meusaboh buet aja\u00e9b,
  malengkan keuaja\u00e9ban Nabi Yunus. 40Nabi Yunus tinggai lh\u00e9e uroe lh\u00e9e
  malam dalam pruet uengkot raya. Meunan cit deungon Aneu\u00ebk Manusia teuma tinggai
  lh\u00e9e uroe lh\u00e9e malam dalam pruet bumoe. 41Bak Uroe Kiamat, peunduduek
  Niniwe teuma jibeud\u00f4h meusigoe ngon ureu\u00ebng-ureu\u00ebng jam\u00e9n nyoe
  dan jitud\u00f4h awaknyan. Sabab ureu\u00ebng-ureu\u00ebng Niniwe nyan ka meutobat
  nibak desya-desya jih nyan, wat\u00e9e Nabi Yunus geu-khutubah ubak awaknyan. Teuma
  disinoe bak wat\u00e9e nyoe na nyang leubeh rayeuk nibak Nabi Yunus! 42Bak Uroe
  Kiamat, ratu nibak nanggroe Seulatan teuma geubeud\u00f4h meusigoe-sigoe ngon ureu\u00ebng-ureu\u00ebng
  jam\u00e9n nyoe dan geutud\u00f4h awaknyan. Sabab keu teudeungoe peurunoe Nabi Sulaiman
  nyan bijak, ratu nyan kuasa geujak nibak nanggroe geuh nyang ji\u00f4h that di ujong
  bumoe. Teuma disinoe bak wat\u00e9e nyoe na nyang leubeh rayeuk nibak Nabi Sulaiman!\\\"
  43\\\"Meunyoe roh jeuhet jitinggai sidroe-droe ureu\u00ebng, roh nyan jikeulileng
  bak teumpat-teumpat nyang tho keu jimita teumpat peuniy\u00f4h, teuma nyang jimita
  nyan hana meuteum\u00e9. 44Ngon sabab nyan laju jipeugah, ''ul\u00f4n teuma l\u00f4n
  gisa u rumoh nyang ka l\u00f4n tinggai.'' Wat\u00e9e awaknyan ka trok keudeh, rumoh
  nyan ka shoh, gleh dan teu-atoe. 45Laju jijak dan jiba tujoh droe roh nyang la\u00e9n
  nyang leubeh jeuhet nibak jih nyan. \u00d3h lheueh nyan awaknyan laju jitamong lam
  tuboh ureu\u00ebng nyan, laju jitinggai lam badan ureu\u00ebng nyan. Teuma akh\u00e9
  jih keuadaan ureu\u00ebng nyan leubeh brok nibak bak nyang ka-ka. Nyan kheueh teuma
  nyang jeuet deungon ureu\u00ebng-ureu\u00ebng jeuhet bak jam\u00e9n nyoe.\\\" 46Teungoh
  Isa mantong geupeugah haba deungon ureu\u00ebng ram\u00e9 nyan, teuka teuk ubak
  Gobnyan mak Geuh ngon syedara-syedara Gobnyan. Awaknyan geudong diluwa sira geu-useuha
  mangat hase geumariet deungon Gobnyan. 47Na kheueh sidroe lamkawan ureu\u00ebng
  ram\u00e9 nyan, nyang na nibak teumpat nyan jipeugah ubak Isa, \\\"Hai pak, mak
  neueh ngon syedara droeneueh na di luwa. Awaknyan keuneuk peugah haba deungon Bapak.\\\"
  48Laju geujaweueb l\u00e9 Isa, \\\"Soe kheueh mak Ul\u00f4n? Soe kheueh teuma syedara-syedara
  L\u00f4n?\\\" 49Laju Gobnyan geutunyok ubak murit-murit Geuh sira geupeugah lag\u00e9e
  nyoe, \\\"Nyoe kheueh mak ngon syedara-syedara L\u00f4n. 50Ureu\u00ebng nyang peubuet
  keuheundak Bapak Ul\u00f4n di syeuruga, nyan kheueh syedara Ul\u00f4n nyang agam,
  syedara inong, dan mak Ul\u00f4n.\\\"\"", "\"Chapter 1\\n1 \u00d3h ka lheueh Raja
  Saul wafeuet, Nabi Daud laju geugisa nibak mideuen prang geujak peutaloe ureu\u00ebng
  Amalek, laju geutinggai di Ziklag nyang treb jih na dua uroe.\\n2 \u00d3h singoh
  beungoh nyan, teuka kheueh sidroe aneu\u00ebk muda nibak khimah-khimah Raja Saul.
  Sibagoe tanda meukabong ureu\u00ebng nyan ka jipriek peukayan jih keudroe dan jiboh
  tanoh di ateueh ul\u00e9e droe jih. Jihnyan jijak ubak Nabi Daud dan jisujut dikeue
  geuhnyan.\\n3 Nabi Daud laju geutanyong ubak aneu\u00ebk muda nyan, \\\"Pane gatajak?\\\"
  Jijaweueb l\u00e9 aneu\u00ebk muda nyan, \\\"Ul\u00f4n lheueh nibak khimah-khimah
  ureu\u00ebng Israel.\\\"\\n4 Geutanyong l\u00e9 Nabi Daud, \\\"Gata peugah kheueh
  laju, peue nyang ka teujadi!\\\" Jijaweueb aneu\u00ebk muda nyan, \\\"Tantra kamoe
  ka kamoe peuplueng droe di mideuen prang, dan jai that nyang tiwaih, lamkawan nyang
  tiwaih nyan Raja Saul dan aneu\u00ebk geuh Yonatan.\\\"\\n5 \\\"Pakriban hai nyan
  gata teupeue?\\\" geutanyong l\u00e9 Nabi Daud ubak aneu\u00ebk muda nyan.\\n6 Jaweueb
  aneu\u00ebk muda nyan, \\\"Keubeutulan mantong ul\u00f4n na disinan nibak Gunong
  Gilboa, laju deuh ul\u00f4n kalon Raja Saul geumeusadeue nibak kapak geuh, seudangkan
  geuritan-geuritan dan tantra meuguda atra musoh, ka t\u00f4 that keuneuk jikeupong.\\n7
  Raja Saul geupaleng u likot, dan geungieng ul\u00f4n, laju ul\u00f4n geuh\u00f4i,
  dan ul\u00f4n jaweueb, ''Nyoe pat ul\u00f4n, Teungku Amphon.''\\n8 Gobnyan geutanyong,
  soe ul\u00f4n nyoe, dan ul\u00f4n kheun ubak gobnyan bahwa ul\u00f4n nyoe na kheueh
  ureu\u00ebng Amalek.\\n9 Laju geupeugah lom ubak ul\u00f4n, ''Gata peurab kheueh
  keunoe, dan tapoh mat\u00e9 kheueh ul\u00f4n! Ul\u00f4n nyoe ka luka parah, dan
  karab mat\u00e9.''\\n10 L\u00e9 sababnyan laju ul\u00f4n peurab ubak gobnyan dan
  laju ul\u00f4n poh sampoe gobnyan meuninggai, sabab ul\u00f4n kuteupeue meunyoe
  gobnyan reubah sabab hana teuga le geudong, pasti gobnyan meuninggai cit teuma.
  \u00d3h lheueh nyan laju ul\u00f4ncok mahkota ateueh ul\u00e9e gobnyan dan gleueng
  nyang na nibak jaroe gobnyan, dan atranyan laju ul\u00f4n ba keunoe ubak Teungku
  Amphon.\\\"\\n11 Ban geudeungoe nyang lag\u00e9enyan Nabi Daud laju geupriek peukayan
  nyang na nibak badan geuh sabab seudeh lumpah na, meunan cit deungon banmandum aneu\u00ebk
  buah gobnyan jipeubuet cit lag\u00e9e Nabi Daud peubuet nyan.\\n12 Awaknyan geumo
  ngon geupeuba-e geumeukabong ngon geupuasa sampoe \u00e1n malam uroe keu Raja Saul
  dan Yonatan, dan lom keu rakyat Israel, umat TUHAN, sabab jai that-that nyang ka
  meuninggai di mideuen prang nyan.\\n13 \u00d3h lheuehnyan Nabi Daud geuteumanyong
  ubak peumuda nyang ka jipeusampoe haba nyan, \\\"Pat asai gata?\\\" Jaweueb aneu\u00ebk
  muda nyan, \\\"Ul\u00f4n nyoe ureu\u00ebng Amalek, sidroe aneu\u00ebk ranto nyang
  tinggai di nanggroe Teungku Amphon.\\\"\\n14 Geupeugah lom l\u00e9 Nabi Daud, \\\"Biet
  beuh\u00e9 that teuh gata jeuet tapoh mat\u00e9 raja nyang ka geupil\u00e9h l\u00e9
  TUHAN!\\\"\\n15 L\u00e9 gobnyan laju geuh\u00f4i sidroe lamkawan aneu\u00ebk buah
  gobnyan sira geupeurintah, \\\"Gata poh mat\u00e9 ureu\u00ebng nyoe!\\\" Di ureu\u00ebng
  nyang geuyuenyan laju jitak peumuda Amalek nyan sampoe mat\u00e9.\\n16 Geupeugah
  l\u00e9 Nabi Daud ubak peumuda Amalek nyan, \\\"Gata keudroe nyang tapeurhot huk\u00f6man
  mat\u00e9 nyoe ateueh droe gata deungon gata meungaku bahwa gata ka tapoh mat\u00e9
  raja nyang ka geupil\u00e9h l\u00e9 TUHAN!\\\"\\n17 \u00d3h lheuehnyan Nabi Daud
  laju geumeu ca-e sira geumeuba-e keu Saul dan Yonatan,\\n18 dan geupeurintah mangat
  ca-e nyoe teupeurunoe teuma ubak suk\u00e9e Yehuda. (Ca-e nyoe na teutul\u00e9h
  didalam Kitab Yasar).\\n19 \\\"Israel, di buk\u00e9t-buk\u00e9t droeneueh, ji\u00f4h
  disideh, gugur kheueh pahlawan, dumna aneu\u00ebk agam neugahra, mat\u00e9 kheueh
  awaknyan sibagoe bung\u00f6ng bansa.\\n20 Seumoga l\u00e9 ureu\u00ebng Gat hana
  jideungoe haba nyan. Seumuga jurong-jurong Askelon hana teuma meuteum\u00e9 haba
  keuhai nyan. B\u00e9k sampoe ureu\u00ebng inong Filistin jisumurak meuhubo b\u00e9k
  teuma sampoe ureu\u00ebng inong nyang kaph\u00e9 jimeukuk geumbira.\\n21 Hai buk\u00e9t-buk\u00e9t
  Gilboa, deungoe kheueh ul\u00f4n meuh\u00f4i nyoe: B\u00e9k sampoe i\u00e9mbon dan
  ujeuen jisiram bumoe! Bah kheueh tho ngon kreng blang dan padang gata. Sabab disinan
  kheueh meusa\u00f4h peudeueng beuso beurani. Dan peudeueng Saul pih ka meugeuratan,
  h\u00e1ntom na le teugeusok ngon miny\u00e9uk.\\n22 Panah Yonatan nyang ampoh ngon
  meubisa nyan. Peudeueng Raja Saul nyang hana jituri keu gas\u00e9h sayang bak teupoh
  musoh, teupeubinasa lawan.\\n23 Saul dan Yonatan ureu\u00ebng nyang that ramah lom
  ram\u00e9 gob gas\u00e9h; sabe meusaboh lamhai udeb ngon mat\u00e9; awaknyan leubeh
  bagaih nibak cic\u00e9m geuruda, dan leubeh teuga nibak singa muda.\\n24 Hai, ureu\u00ebng
  inong Israel, tameuba-e kheueh keu Raja Saul! Nyang ka geupeungui gata deungon ija
  gawon mirah nyang meuw\u00e1h, dan geupeuhias gata deungon m\u00e9uh peumata nyang
  ceudah.\\n25 Ka hab\u00e9h reubah dumna pahlawan, reubah nibak mideuen prang dan
  nibak buk\u00e9t ngon gunong nyang sungue Yonatan ka teunyue teugang.\\n26 Yonatan,
  hai syedara ul\u00f4n, at\u00e9 l\u00f4n hanco, sabab droeneueh g\u00e9t that muyuem
  nibak ul\u00f4n. Geunas\u00e9h gata ubak ul\u00f4n g\u00e9t that mulia, leubeh nibak
  geunas\u00e9h sidroe ureu\u00ebng inong.\\n27 Ka gugur dumna pahlawan bansa. Meusia-sia
  kheueh sinjata nyang na!\\\"\\nChapter 2\\n1 \u00d3h lheuehnyan Nabi Daud laju geutanyong
  ubak TUHAN, \\\"Peu kheueh Droeneueh ya TUHAN neubri kuasa keu ul\u00f4n mangat
  jeuet l\u00f4n kuasa saboh lamkawan la\u00e9n banda di Yehuda?\\\" \\\"Nyoe,\\\"
  geujaweueb l\u00e9 TUHAN. \\\"Banda nyang toh?\\\" geutanyong lom l\u00e9 Nabi Daud.
  \\\"Banda Hebron,\\\" geujaweueb TUHAN.\\n2 L\u00e9 sababnyan geujak kheueh laju
  Nabi Daud u Hebron meusajan deungon ban dua droe peurumoh gobnyan: Ahinoam inong
  nyang nibak Yizreel, dan Abigail beukaih inong si Nabal di Karmel.\\n3 Meunan cit
  teuma deungon aneu\u00ebk buah gobnyan deungon keuluwarga awaknyan mas\u00e9ng-mas\u00e9ng
  jiseut\u00f4t meusajan deungon Nabi Daud, dan awaknyan laju tinggai teutab di Hebron
  dan silingka nyan.\\n4 \u00d3h lheuehnyan bubena ureu\u00ebng Yehuda jijak laju
  u Hebron, dan jilantek laju Nabi Daud jeuet keu raja ateueh nanggroe Yehuda. Bak
  wat\u00e9e Nabi Daud geudeungoe bahwa ureu\u00ebng-ureu\u00ebng Yabesh di Gilead
  ka jipeukubu lam jrat many\u00e9t Saul,\\n5 ureu\u00ebng nyan jipeutrok peusan lag\u00e9enyoe,
  \\\"Seumoga TUHAN geubri beureukat ubak gata, sabab gata ka tatunyok keuseutiaan
  gata keu raja gata deungon cara ka taseumuyueb gobnyan u dalam jrat.\\n6 L\u00e9
  sababnyan, TUHAN ka geutunyok gas\u00e9h sayang gobnyan keu gata. Ul\u00f4n pih
  teuma l\u00f4n peusaneut gata deungon g\u00e9t sabab l\u00e9 buet gata nyan.\\n7
  Tabah kheueh at\u00e9 gata dan jakbuet kheueh sibagoe pahlawan! Saul, raja gata
  nyang keubiet ka wafeuet, teuma di ureu\u00ebng-ureu\u00ebng Yehuda ka jibai\u00e1t
  ul\u00f4n jeuet keu raja awaknyan.\\\"\\n8 Panglima tantra Raja Saul, na kheueh
  Abner aneu\u00ebk Ner, ka jipeuplueng droe meusajan deungon Isyboset aneu\u00ebk
  Raja Saul, u Mahanaim di meurandeh Krueng Yordan.\\n9 Disinan Abner laju geu angkat
  Isyboset jeuet keu raja ateueh wilayah-wilayah Gilead, Asyuri, Yizreel, Efraim dan
  Benyamin, dan ateueh bansaboh Israel.\\n10 Isyboset ka meu umu peuet ploh thon bak
  wat\u00e9e teubai\u00e1t jeuet keuraja ateueh Israel, dan gobnyan jimat peurintah
  dua thon treb jih. Teuma di suk\u00e9e Yehuda teutab seutia ubak Nabi Daud sibagoe
  raja geuh,\\n11 dan Nabi Daud geumat peurintah di Hebron ateueh Yehuda na tujoh
  siteungoh thon treb jih.\\n12 Bak siuroe Abner jijak nibak Mahanaim u banda Gibeon,
  meusajan deungon aneu\u00ebk buah Isyboset.\\n13 Meunan cit deungon Yoab (mak jihnyan
  nan jih Zeruya), meusajan deungon aneu\u00ebk buah Nabi Daud jijak u banda nyan.
  Ban dua boh reugu nyang meula\u00e9n meunan cit sal\u00e9ng meulawan nyan laju meuhadab-hadab
  keu di kulam Gibeon; Abner dan meunan cit deungon pihak awaknyan jiduek di meurandeh
  nyoe, Yoab dan pihak droe jih teuma na dimeurandeh j\u00e9h.\\n14 Geupeugah kheueh
  l\u00e9 Abner ubak Yoab, \\\"Jak, tayue aneu\u00ebk buah geutanyoe mangat jimeutunang
  meulo!\\\" \\\"G\u00e9t kheueh, meunyoe meunan,\\\" geujaweueb l\u00e9 Yoab.\\n15
  Laju jimaju na dua blaih droe nibak suk\u00e9e Benyamin nyang jiwaki l\u00e9 Isyboset,
  dan dua blaih droe teuma nibak aneu\u00ebk buah Nabi Daud.\\n16 Awaknyan mas\u00e9ng-mas\u00e9ng
  sal\u00e9ng jiteumarek \u00f4k nibak ul\u00e9e dan sal\u00e9ng teuma jitob pruet
  lawan jih mas\u00e9ng-mas\u00e9ng, l\u00e9 sabab nyan mat\u00e9 kheueh awaknyan
  meusigoe teuma. Sabab nyan kheueh teumpat di Gibeon nyan geuboh nan \\\"Blang Peudeueng\\\".\\n17
  \u00d3h ka lheueh teujadi nyang lag\u00e9e nyan teuka kheueh teuma prang nyang keubiet
  hebat, dan Abner meunan cit deungon banmandum tantra Israel ka hab\u00e9h taloe
  buet aneu\u00ebk buah Nabi Daud.\\n18 Ban lh\u00e9e droe aneu\u00ebk Zeruya na disinan,
  awaknyan na kheueh Yoab, Abisai dan Asael. Asael nyan meunyoe bak plueng bagaih
  jih ban lag\u00e9e jiplueng rusa,\\n19 dan jipeulet kheueh Abner nyan hana pi\u00f4h-pi\u00f4h.\\n20
  Abner laju jingieng u likot sira jitanyong, \\\"Peu kheueh gata nyan Asael?\\\"
  \\\"Nyoe, beut\u00f4i,\\\" jaweueb Asael.\\n21 \\\"B\u00e9k tatiyeub ul\u00f4n!\\\"
  geupeugah l\u00e9 Abner. \\\"Cuba kheueh gatadrob sidroe lamkawan tantra nyan dan
  tacok kheueh laju sinjata jihnyan!\\\" Teuma Asael hana geupeuduli nyan gobnyan
  hana geupi\u00f4h geutiyeub laju ureu\u00ebng nyan.\\n22 Sigoe teuk Abner geupeugah
  ubak gobnyan, \\\"B\u00e9k tatiyeub ul\u00f4n! Eunteuk meunyoe tatiyeub cit teupaksa
  gata ul\u00f4n poh mat\u00e9. Meunyoe meunan, pakriban ul\u00f4n hase ul\u00f4n
  pandang muka Yoab adeun gata nyan?\\\"\\n23 Bak wat\u00e9e nyan Asael teutab cit
  hana jitem pi\u00f4h jipeucrok nyan, Abner laju jitob ngon kapak jih u likot, dan
  laju keunong ubak pruet Asael sampoe beus\u00f3t kapak nyan dan peureulong ubak
  rhueng jih. Asael reubah dan mat\u00e9 laju di teumpat nyan. Banmandum ureu\u00ebng
  nyang trok jiteuka u teumpat jih nyang ka teugageueng nyan, laju teudong disinan.\\n24
  Teuma Yoab dan Abisai mantong cit jitiyeub ngon hana geupi\u00f4h teuhadab Abner.
  Bak wat\u00e9e mata uroe ka jilhob, trok kheueh laju awaknyan u Buk\u00e9t Ama,
  nyang na di siblaih u timu Giah, u arah padang pasi Gibeon.\\n25 Disinan ureu\u00ebng-ureu\u00ebng
  nibak suk\u00e9e Benyamin jimeusaho lom deungon Abner, laju jiatoe baresan awaknyan
  nibak saboh pucak gunong.\\n26 Phon sinan Abner jitaw\u00f6k ubak Yoab, \\\"Peu
  kheueh geutanyoe har\u00f4h ta muprang siumu masa? Peu kheueh gata hana tasada bahwa
  prang nyoe lumpah that phet? Kamoenyoe syedara gata saboh bansa. Padubna treb teuk
  gata har\u00f4h tapreh sigohlom tapeurintah aneu\u00ebk buah gata mangat jipi\u00f4h
  jipeucrok kamoe?\\\"\\n27 Jijaweueb l\u00e9 Yoab, \\\"Deumi Po teu Allah nyang udeb,
  meunyoe gata hana tapeuphon peugah haba, pasti aneu\u00ebk buah ul\u00f4n hana jipi\u00f4h
  jipeu crok gata trok \u00e1n singoh beungoh.\\\"\\n28 L\u00e9 Yoab laju geuyueb
  beureuguih sibagoe tanda keu aneu\u00ebk buah jih mangat jipi\u00f4h b\u00e9k jilet
  le ureu\u00ebng Israel, dan deungon na nyang lag\u00e9enyan reuda kheueh muprang
  nyang lumpah gura nyan.\\n29 Abner dan aneu\u00ebk buah gobnyan simalam beungoh
  jimeubar\u00e9h jijak rot Pant\u00f4n Yordan, laju jijeumeurang Krueng Yordan, dan
  \u00f3h lheueh jijak siuroe seup\u00f4t nyan bak uroe lheueh nyan teuma, trok kheueh
  awaknyan u Mahanaim.\\n30 \u00d3h ka lheueh Yoab geupi\u00f4h geutiyeub Abner, gobnyan
  laju geupeusapat banmandum aneu\u00ebk buah. Seula\u00e9n Asael teunyata na sikureueng
  blaih droe aneu\u00ebk buah gobnyan gad\u00f4h.\\n31 Aneu\u00ebk buah Nabi Daud
  ka jipoh mat\u00e9 360 droe pasokan Abner nibak suk\u00e9e Benyamin.\\n32 \u00d3h
  lheuehnyan Yoab dan aneu\u00ebk buah gobnyan jibeu\u00f4t laju many\u00e9t Asael
  dan jipeukubu laju didalam lamp\u00f4h jrat keuluwarga gobnyan di Betlehem. \u00d3h
  lheueh nyan awaknyan jijak lom simalam suntok laju trok u Hebron bak wat\u00e9e
  ka teungoh malam.\\nChapter 3\\n1 Prang nyang meutamah-tamah hibat l\u00e9 peureut\u00e9
  keuluwarga Saul deungon peureut\u00e9 Nabi Daud teutab hana lom reuda. Nabi Daud
  seumaken teuga, la\u00e9n hai deungon lawan gobnyan seumaken leumoh.\\n2 Aneu\u00ebk-aneu\u00ebk
  agam Nabi Daud nyang lah\u00e9 di Hebron na kheueh lag\u00e9e nyang teupeugah nyoe
  meunurot urotan lah\u00e9 jih: Amnon. Mak jihnyan na kheueh Ahinoam nibak Yizreel.\\n3
  Kileab. Mak jihnyan na kheueh Abigail, beukaih peurumoh Nabal nibak Karmel. Absalom.
  Mak jihnyan na kheueh Maakha, putroe Raja Talmai nibak Gesur.\\n4 Adonia. Mak jihnyan
  na kheueh Hagit. Sefaca. Mak jihnyan na kheueh Abital.\\n5 Yitram. Mak jihnyan na
  kheueh Egla. Ban nam droe aneu\u00ebk agam geuhnyan lah\u00e9 di Hebron.\\n6 Bak
  wat\u00e9e prang mantong that hebat l\u00e9 peureut\u00e9 Nabi Daud deungon peureut\u00e9
  keuluwarga Saul, Abner jiuseuha laju mangat peungar\u00f4h gobnyan meutamah rayeuk
  nibak peureut\u00e9 Saul.\\n7 Bak siuroe Isyboset, aneu\u00ebk agam Saul, jitudoh
  Abner ka geu-\u00e9h sajan deungon sidroe lamkawan gundek Saul nyang nan jih Rizpa
  aneu\u00ebk Aya.\\n8 Ban geudeungoe habanyan, Abner beung\u00e9h geuh that-that
  dan gobnyan jipeugah, \\\"Peu kheueh Teungku Po neuanggab bahwa ul\u00f4n nyoe ka
  l\u00f4n kianat ubak Saul dan l\u00f4n dong blaih Yehuda? Phon awaikon ul\u00f4n
  nyoe l\u00f4n dong blaih Saul bapak Teungku Po, dan keu kaw\u00f6m syedara gobnyan
  meunan cit keu rakan-rakan gobnyan. Ul\u00f4n ka ul\u00f4n tul\u00f4ng Teungku Po
  sampoe hana hase le jipeutaloe l\u00e9 Nabi Daud. Bahpih dubnyan ka ul\u00f4n peubuet,
  teuma Teungku Amphon neuhina cit ul\u00f4n teuma l\u00e9 soai ureu\u00ebng inong!\\n9
  Leubeh g\u00e9t ul\u00f4n jak tul\u00f4ng Nabi Daud, peue lom TUHAN ka geumeujanji
  ubak gobnyan bak saboh wat\u00e9e geucok keurajeuen nyoe nibak Saul dan nibak keuturonan
  gobnyan, laju geubai\u00e1t Nabi Daud jeuet keuraja keu bansigom tanoh Israel dan
  Yehuda. Seumoga Po teu Allah geupeumat\u00e9 ul\u00f4n, meunyoe hana ul\u00f4n peutrok
  janji Po teu Allah ubak Nabi Daud nyan!\\\"\\n11 Isyboset hana hase geujaweueb haba
  nyan bahpi meu sikr\u00e9k haba pih, sabab gobnyan geutakot ubak Abner.\\n12 L\u00e9
  Abner geukir\u00e9m utosan ubak Nabi Daud nyang nibak wat\u00e9e nyan gobnyan na
  di Hebron, haba peuneusan nyan na kheueh, \\\"Soe nyang mat kuasa ateueh tanoh nyoe?
  Neupeug\u00e9t kheueh peujanjian deungon ul\u00f4n, teuma ul\u00f4n tul\u00f4ng
  Teungku Amphon mangat jeuet banmandum bansa Israel jidong blaih Teungku Amphon!\\\"\\n13
  Geujaweueb l\u00e9 Nabi Daud lag\u00e9e nyoe, \\\"G\u00e9t kheueh! Tapeutrok kheueh
  peusan nyoe ubak Abner: Ul\u00f4n l\u00f4ntem peug\u00e9t peujanjian deungon gata,
  teuma deungon saboh carat: Mikhal, aneu\u00ebk inong Saul, har\u00f4h taba ubak
  ul\u00f4n meunyoe gata tajak meuhadab ubak ul\u00f4n.\\\"\\n14 \u00d3h lheueh nyan
  Nabi Daud geukir\u00e9m utosan ubak Isyboset, dan haba peuneusan geuh lag\u00e9e
  nyoe, \\\"Bah kheueh Teungku Amphon neupeuriwang Mikhal, peurumoh ul\u00f4n, ubak
  ul\u00f4n. Jihnyan ka ul\u00f4n bloe deungon yuem sireutoih boh kul\u00e9t ujong
  boh ureu\u00ebng Filistin.\\\"\\n15 L\u00e9 Isyboset geuyuejak laju utosan geuhnyan
  mangat teujak tueng Mikhal nibak lakoe jih, na kheueh Paltiel aneu\u00ebk si Lais.\\n16
  Teuma Paltiel hana jipi\u00f4h jiseut\u00f4t laju Mikhal sira jimo. Bak wat\u00e9e
  awaknyan ka sampoe u banda Bahurim, Abner jipeugah ubak ureu\u00ebng nyan, \\\"Ka
  kheueh, neujakwo mantong droeneueh!\\\" Dan Paltiel pih jijakwo teuma.\\n17 Teungoh
  Abner geumupakat deungon mandum ureu\u00ebng patot-patot di Israel dan geupeugah,
  \\\"Ka treb that-that gata tameuheuet mangat jeuet Nabi Daud teupeujeuet keuraja
  gata.\\n18 Dan, nyoe kheueh keuseumpatan nyang paleng rayeuk nibak gata. Ingat kheueh,
  TUHAN ka geumeujanji ubak Nabi Daud, bahwa gobnyan teuma geupeuguna Nabi Daud nyan
  mangat teupeuseulamat umat Israel nibak ureu\u00ebng Filistin dan nibak banmandum
  musoh nyang la\u00e9n.\\\"\\n19 Meunan cit Abner geumupakat deungon ureu\u00ebng-ureu\u00ebng
  nibak suk\u00e9e Benyamin, dan \u00f3h lheuehnyan geujak teuma u Hebron keu geujak
  peugah ubak Nabi Daud peue nyang ka jiseutuju l\u00e9 ureu\u00ebng Benyamin dan
  ureu\u00ebng Israel nyan.\\n20 Bak wat\u00e9e Abner meusajan deungon dua ploh droe
  aneu\u00ebk buah gobnyan geumeuhadab ubak Nabi Daud di Hebron, Nabi Daud laju geupeuna
  khanuri keu awaknyan.\\n21 \u00d3h lheueh nyan Abner laju geulak\u00e9e droe sira
  geupeugah, \\\"Neupeu idhin kheueh keu ul\u00f4n mangat l\u00f4njak peugrak at\u00e9
  bansaboh Israel mangat awaknyan jimeugabong deungon Teungku Amphon. Awaknyan teuma
  jiteurimong Teungku Amphon sibagoe raja, dan deungon na nyang lag\u00e9e nyan, Teungku
  Amphon ka jeuet keu raja keu saboh nanggroe, paih lag\u00e9e meukeusut Teungku Amphon.\\\"
  \u00d3h lheuehnyan Abner laju geupeu idhin l\u00e9 Nabi Daud dan geujamin keuseulamatan
  gobnyan.\\n22 \u00d3h ka leupah Abner geujak, Yoab meusajan deungon aneu\u00ebk
  buah Nabi Daud nyang la\u00e9n geuwoe nibak mideuen prang dan jai that geupeuwoe
  barang rampasan.\\n23 Ubak Yoab laju geubri t\u00e9e bahwa Abner banmantong geujak
  meuhadab ubak Raja Daud dan ka geupeu idhin jijak dan geujamin teuma keuseulamatan
  gobnyan.\\n24 Dan geujak meuhadab kheueh Yoab ubak raja sira geupeugah lag\u00e9e
  nyoe, \\\"Pakriban buet droeneueh nyan ya Teungku Amphon? Abner ka teuka jijak meuhadab
  ubak Teungku Raja. Pakon Teungku Raja neupeu idhin jijak meunan mantong?\\n25 Pasti
  kheueh Teungku Amphon ka neuteupeue bahwa Abner nyan teuka keunoe na kheueh keu
  jijak peung\u00e9t Teungku Amphon, dan keu jiteupeue keuadaan dan peue-peue nyang
  ka Teungku Amphon reuncana.\\\"\\n26 \u00d3h ka lheueh geutinggai Nabi Daud, Yoab
  laju geukir\u00e9m utosan mangat jijak tueng Abner. Awaknyan laju jijak seut\u00f4t
  Abner sampoe trok ubak mon Sira, Dan Abnernyan awaknyan peuwo laju ubak Nabi Daud.
  Banmandum nyan teujadi hana geuteupeue mubacut pih l\u00e9 Nabi Daud.\\n27 Meunan
  Abner nyan ka trok u Hebron, ureu\u00ebng nyan laju jipakat l\u00e9 Yoab ubak bin\u00e9h,
  t\u00f4 ngon babah pintoe geureubang, siulah-ulah jikeuneuk peugah saboh rahsia.
  Teuma hana teusangka-sangka Yoab laju geutob nibak pruet Abner sampoe gobnyan mat\u00e9
  bak wat\u00e9e nyan cit teuma. Meunan kheueh Abner ka mat\u00e9 jipoh l\u00e9 Yoab
  keu jibalaih dam ateueh teupoh mat\u00e9 adoe gobnyan si Asael.\\n28 Bak wat\u00e9e
  Nabi Daud geudeungoe hainyan, gobnyan geupeugah, \\\"TUHAN geuteupeue bahwa ul\u00f4n
  dan rakyat ul\u00f4n mubacut pih hana meusalah keuhai teupoh mat\u00e9 Abner nyan.\\n29
  Bah kheueh Yoab dan banmandum keuluwarga jih nyan geuhuk\u00f6m l\u00e9 TUHAN ateueh
  buet jih nyang ka salah nyan. Seumoga dalam keuluwarga Yoab treun meutreun sabe
  na ureu\u00ebng nyang meudeurita peunyak\u00e9t kul\u00e9t nyang parah that, atawa
  ureu\u00ebng agam nyang leumoh hana meuteunaga, atawa nyang mat\u00e9 nibak mideuen
  prang atawa nyang sabe kureueng peunajoh!\\\"\\n30 Meunan kheueh Yoab dan Abisai
  adoe gobnyan, geubalaih dam ubak Abner kareuna Abner ka geupoh mat\u00e9 Asael adoe
  gobnyan dalam prang di Gibeon.\\n31 \u00d3h lheueh nyan Nabi Daud laju geubri peurintah
  ubak Yoab dan aneu\u00ebk buah gobnyan mangat geupriek peukayan droe geuh mas\u00e9ng-mas\u00e9ng,
  dan geungui ija meuduka cita meunan cit teupeuba-e keu Abner nyang ka mat\u00e9
  keunong poh nyan. Dan bak wat\u00e9e many\u00e9t teu intat u dalam kubu, Nabi Raja
  Daud keudroe teuma nyang jak dilikot keureunda many\u00e9t nyang teungoh jiseu\u00f4n
  jiba ubak jrat nyan.\\n32 Abner teupeukubu di Hebron, raja dan banmandum rakyat
  geumo ba-e deungon meuratok ngon su nyang lumpah nyareng nibak bin\u00e9h kubu nyan.\\n33
  \u00d3h ka lheuehnyan Nabi Daud geupeuratok keu Abner, lag\u00e9e nyoe,\\n34 \\\"Peu
  kheueh Abner har\u00f4h mat\u00e9 sibagoe ureu\u00ebng bangai: Jaroe gobnyan hana
  teu ikat, dan gaki gobnyan hana teubeuleunggu? Gobnyan mat\u00e9 keunong tob l\u00e9
  ureu\u00ebng jeuhet nyang keujam.\\\" Ban geudeungoe nyan banmandum rakyat jimo
  ba-e jipeumo Abner nyang leubeh teuga lom.\\n35 Si uroe suntok ureu\u00ebng la\u00e9n
  ji useuha jibujuk Nabi Raja Daud mangat geutem makheun bahpi meubacut, teuma gobnyan
  geumeusumpah, \\\"Kira jih Po teu Allah geupoh mat\u00e9 ul\u00f4n, meunyoe ul\u00f4n
  makheun sigohlom mata uroe jilhob!\\\"\\n36 Ban geudeungoe hainyan rakyat ka meurasa
  seunang ngon galak. Beut\u00f4i, peue mantong nyang geupeubuet l\u00e9 Nabi Raja
  Daud nyan, at\u00e9 awaknyan ka jeuet keu mangat.\\n37 Bak uroe nyan banmandum rakyat
  Nabi Daud dan banmandum Israel ka muphom, bahwa raja hana geuharab Abner teupoh
  mat\u00e9.\\n38 Geupeugah l\u00e9 Nabi Raja Daud ubak dumna ureu\u00ebng nyang ir\u00e9ng
  gobnyan, \\\"Peu kheueh hana neuteupeue bahwa nibak uroenyoe sidroe peumimp\u00e9n
  rayeuk bansa Israel ka mat\u00e9 syahid?\\n39 Bahpih ul\u00f4n nyoe raja nyang geupil\u00e9h
  l\u00e9 Po teu Allah, teuma jinoenyoe ul\u00f4n meurasa that-that leumoh. Aneu\u00ebk-aneu\u00ebk
  Zeruya nyan lumpah that keujam. Ul\u00f4n hana hase ul\u00f4n kuasa ateueh awaknyan.
  Seumoga TUHAN geuhuk\u00f6m bubena peunjahat-peunjahat nyan, nyang sisuai deungon
  peue nyang jipeubuet!\\\"\\nChapter 4\\n1 Keuturonan Saul nyang la\u00e9n na kheueh
  Mefiboset, aneu\u00ebk agam nibak Yonatan. Aneu\u00ebk nyan capiek wat\u00e9e umu
  jih limong thon, bak wat\u00e9e Saul dan Yonatan meuninggai donya. Sabab bak wat\u00e9e
  haba keuhai awaknyan meuninggai teuka nibak banda Yizreel, deundayang nyang useuha
  Mefiboset nyan laju jiplueng; teuma sabab inong nyan bak jiplueng lumpah meudab-dab,
  aneu\u00ebk nyan rhot bak tanoh sampoe gaki jih capiek. Bak wat\u00e9e Isyboset
  aneu\u00ebk agam Saul nyan jideungoe bahwa Abner ka teupoh mat\u00e9 di Hebron,
  teuma rhot kheueh seumangat gobnyan, dan ban saboh bansa Israel ka jeuet keu geumpa.
  Isyboset nyan na dua droe peuwira nyang jeuet keu ul\u00e9e pasokan seureubu; nyang
  sidroe nan jih Baana, dan nyang sidroe teuk nan jih Rekhab. Awaknyan na kheueh aneu\u00ebk
  Rimon, nibak Beerot dan asai nibak suk\u00e9e Benyamin. (Beerot nyan rhoh lam daerah
  Benyamin. Peududuek aseuli nyang na disinan jipeuplueng droe u daerah Gitaim dan
  laju tinggai disinan phon sa\u00e1t nyan.)\\n5 Ban dua droe si peuwiranyan, na kheueh
  si Rekhab dan Baana jijak laju u rumoh Isyboset dan trok keunan bak wat\u00e9e cot
  uroe timang, bak wat\u00e9e Isyboset teungoh jipi\u00f4h hek wat\u00e9e uroe.\\n6
  Ureu\u00ebng inong nyang jaga rumoh nyan teugantuek that mata wat\u00e9e nyan teungoh
  jitampoe boh gandom, nibak teugantuek nyan laju gobnyan teug\u00e9ut. Sabab nyan
  Rekhab dan Baana hase deungon mudah jitamong u dalam.\\n7 Awaknyan laju jitamong
  ubak kama \u00e9h di teumpat Isyboset teungoh teung\u00e9ut meukanga, l\u00e9 awaknyan
  laju jitob Isyboset nyan sampoe mat\u00e9. \u00d3h lheuehnyan ul\u00e9e ureu\u00ebng
  nyang ka mat\u00e9 nyan laju jikoh meukhan dan jiba laju nibak teumpatnyan. Simalam
  beungoh awaknyan jijak ngon tapak meulalu Pant\u00f4n Yordan.\\n8 \u00d3h lheuehnyan
  ul\u00e9e Isyboset nyan jijok laju ubak Nabi Daud di Hebron sira jipeugah, \\\"Nyoe
  kheueh ul\u00e9e Isyboset aneu\u00ebk agam si Saul, musoh Teungku Amphon nyang teungoh
  ji useuha jikeuneuk poh mat\u00e9 Teungku Amphon. Bak uroenyoe TUHAN ka geubalaih
  buet si Saul dan keuturonan gobnyan keu Teungku Amphon.\\\"\\n9 Teuma Nabi Daud
  geujaweueb, \\\"TUHAN nyang udeb, nyang ka geupeuseulamat ul\u00f4n nibak sigala
  mara bahya, Gobnyan geuteupeue bahwa nyang ul\u00f4n peugah nyoe beut\u00f4i.\\n10
  Bak wat\u00e9e di Ziklag na ureu\u00ebng nyang jijak brit\u00e9e ubak ul\u00f4n
  keuhai Saul ka wafeuet, jipike l\u00e9 jih bahwa gobnyan jiba haba nyang jroh. Teuma
  jihnyan ka ul\u00f4n drob dan ul\u00f4n poh mat\u00e9. Nyang kheueh upah nyang ul\u00f4n
  bri keu jihnyan sibagoe imbalan ateueh haba nyang ka jipeugah ubak ul\u00f4n nyan.\\n11
  Padubna leubeh brat lom huk\u00f6m nyang teuma ul\u00f4n peurhot ateueh ureu\u00ebng
  jeuhet nyang ka jipoh mat\u00e9 ureu\u00ebng nyang hana meusalah dan lom teungoh
  jiteungeut di rumoh jih keudroe! Jinoenyoe ul\u00f4n tueng bila ateueh peue nyang
  ka gata peubuet nyan, dan ul\u00f4n peuranab gata nibak ateueh muka bumoenyoe!\\\"\\n12
  \u00d3h lheueh geupeugah nyan Nabi Daud laju geupeurintah ubak aneu\u00ebk buah
  gobnyan mangat jijak poh mat\u00e9 si Rekhab dan Baana. \u00d3h ka lheueh teupoh
  mat\u00e9, jaroe dan gaki awaknyan laju jikoh ngon jigantung teuma nibak bin\u00e9h
  kulam. Teuma ul\u00e9e Isyboset jicok dan laju jitanom di banda nyan cit teuma didalam
  kubu Abner.\\nChapter 5\\n1 \u00d3h ka lheueh nyan teuka kheueh ubak Nabi Daud bubena
  peumimp\u00e9n-peumimp\u00e9n nibak suk\u00e9e Israel di Hebron dan jipeugah ubak
  gobnyan, \\\"Kamoe nyoe na kheueh rakan Teungku Amphon.\\n2 Phon yoh masa il\u00e9e,
  dan yoh mantong Saul geumat peurintah ateueh kamoe, Teungku Amphon cit teuma nyang
  pimp\u00e9n tantra Israel tieb-tieb wat\u00e9e awaknyan jijak maju u mideuen prang,
  meunan cit teuma TUHAN ka geumeujanji ubak Teungku Amphon bahwa Teungku Amphon kheueh
  nyang pimp\u00e9n umat Gobnyan dan jeuet keu raja awaknyan.\\\"\\n3 Nabi Daud laju
  geupeuna peujanjian deungon bubena peumimp\u00e9n-peumimp\u00e9n nyan, laju awaknyan
  jibai\u00e1t gobnyan jeuet keu raja Israel.\\n4 Nabi Daud meu-umu lh\u00e9e ploh
  thon bak wat\u00e9e gobnyan teulantek jeuet keu raja, dan gobnyan geumat peurintah
  peuet ploh thon treb jih.\\n5 Di Hebron gobnyan geumat peurintah ateueh Yehuda tujoh
  thon siteungoh treb jih, dan di Yerusalem gobnyan geumat peurintah ateueh banmandum
  Israel dan Yehuda nyang treb jih lh\u00e9e ploh lh\u00e9e thon.\\n6 Bak siuroe Nabi
  Raja Daud dan aneu\u00ebk buah gobnyan geubeud\u00f4h geubeurangkat keuneuk jak
  prang Yerusalem. Ureu\u00ebng Yebus peunduduek banda nyan, jipike bahwa Nabi Daud
  hana ek geupeutaloe Yerusalem. Sabab nyan awaknyan jipeugah ubak gobnyan, \\\"Gata
  nyoe hana teuma leupah tatamong keunoe; ureu\u00ebng-ureu\u00ebng buta ngon ureu\u00ebng
  capiek pih hase ji-use gata.\\\"\\n7 Nabi Daud geupeugah ubak aneu\u00ebk buah gobnyan,
  \\\"Peu kheueh na disinoe ureu\u00ebng nyang banci ubak ureu\u00ebng Yebus lag\u00e9e
  ul\u00f4n nyoe l\u00f4n banci keu awaknyan? Peu kheueh ka lumpah jibanci that awaknyan
  sampoe jihnyan jikeuneuk poh awaknyan? Meunyoe meunan, tatamong kheueh laju rot
  guha i\u00e9 dan taprang kheueh bubena ureu\u00ebng buta ngon ureu\u00ebng capiek
  nyang that-that ul\u00f4n banci nyan.\\\" (Nyang kheueh sabab jih ureu\u00ebng la\u00e9n
  jipeugah, \\\"Ureu\u00ebng buta dan ureu\u00ebng capiek hana jeuet jitamong u dalam
  Ba\u00e9t TUHAN.\\\") Nabi Daud meuhase geureubot kuta Sion dan geuduek laju disinan.
  Laju geuboh nan nyan \\\"Banda Nabi Daud\\\". Banda nyan geupeudong nibak ban sikeulileng
  kuta nyan, phon nibak siblaih u timu buk\u00e9t nyang ka teupeu manyang deungon
  tanoh.\\n10 Nabi Daud maken treb maken teuga, sabab TUHAN, Po teu Allah Nyang Mahakuasa
  nyang tul\u00f4ng gobnyan.\\n11 Raja Hiram di Tirus geukir\u00e9m waki-waki gobnyan
  ubak Nabi Daud, meunan cit deungon kay\u00e9e ceumara Libanon meunan cit deungon
  tukang-tukang kay\u00e9e dan tukang bat\u00e9e keu jijak peudong meuligoe.\\n12
  Kareuna nyan Nabi Daud meutamoh yak\u00e9n bahwa TUHAN ka geupeukong gobnyan sibagoe
  raja ateueh Israel, dan geupeukong keurajeuen gobnyan deumi keu keupeuntengan umat
  TUHAN.\\n13 \u00d3h ka lheueh Nabi Daud geuminah nibak Hebron u Yerusalem, gobnyan
  geumeukawen lom deungon na meupadub droe ureu\u00ebng inong dan geucok teuma na
  padub droe ureu\u00ebng inong keu gundek gobnyan; deungon na lag\u00e9enyan meutamoh
  kheueh teuma aneu\u00ebk agam ngon aneu\u00ebk inong gobnyan.\\n14 Aneu\u00ebk-aneu\u00ebk
  agam gobnyan nyang jipeulah\u00e9 di Yerusalem na kheueh: Syamua, Sobab, Natan,
  Salomo,\\n15 Yibhar, Elisua, Nefeg, Yafia,\\n16 Elisama, Elyada dan Elifelet.\\n17
  Bak wat\u00e9e ureu\u00ebng Filistin jideungoe bahwa Nabi Daud ka teubai\u00e1t
  jeuet keu raja ateueh Israel, awaknyan laju jijak jikeuneuk jak drob gobnyan. Teuma
  Nabi Daud geudeungoe hai nyan, geubeud\u00f4h geujak laju ubak kuta.\\n18 Ureu\u00ebng
  Filistin ka trok u Pant\u00f4n Refaim dan jiduek laju disinan.\\n19 Nabi Daud laju
  geutanyong ubak TUHAN, \\\"Peu kheueh ul\u00f4n nyoe har\u00f4h ul\u00f4n jakprang
  ureu\u00ebng Filistin nyan, ya TUHAN? Peu kheueh teuma TUHAN neupeumeunang ateueh
  ul\u00f4n?\\\" \\\"Jak prang kheueh!\\\" geujaweueb l\u00e9 TUHAN. \\\"Ul\u00f4n
  teuma L\u00f4n bri keu gata meunang!\\\"\\n20 \u00d3h lheueh nyan geujak kheueh
  laju Nabi Daud u Baal-Perasim dan disinan kheueh pasokan Filistin nyan geupeu taloe.
  Laju gobnyan geupeugah, \\\"TUHAN ka geupeuhanco peutahanan musoh l\u00f4n, lag\u00e9e
  i\u00e9 raya nyang jipeu hanyot ngon jisamp\u00f4h peue-peue nyang na lam wat\u00e9e
  nyang sikeujab.\\\" Sabab nyan kheueh, teumpat nyan geuboh nan Baal-Perasim.\\n21
  Pasokan Filistin nyan laju jiplueng dan hana jiteumeba patong-patong beurala droe
  jih. Banmandum patong-patong nyan laju geucok l\u00e9 Nabi Daud dan aneu\u00ebk
  buah gobnyan.\\n22 Hana padubna treb teuma \u00f3h lheueh nyan teuka lom ureu\u00ebng
  Filistin jijakduek nibak Pant\u00f4n Rafaim.\\n23 Sigoteuk Nabi Daud geulak\u00e9e
  peutunyok ubak TUHAN. TUHAN geujaweueb, \\\"B\u00e9k gata prang jihnyan phon disinoe,
  teuma tajak kheueh meuputa dan gata prang kheueh awaknyan rot likot, to deungon
  bak kay\u00e9e murbei.\\n24 Meunyoe na gata deungoe su lag\u00e9e su langkah ureu\u00ebng
  meubar\u00e9h dipucok bak-bak kay\u00e9e nyan, dan gata maju kheueh laju, sabab
  ul\u00f4n teuma ul\u00f4njak dikeue gata keu l\u00f4njak peutaloe tantra Filistin.\\\"\\n25
  Nabi Daud laju geupeubuet peue nyang ka geupeurintah l\u00e9 TUHAN, dan gobnyan
  meuhase geuseup\u00f4t sampoe tantra Filistin nyan jisurot nibak Geba sampoe trok
  u Gezer.\\nChapter 6\\n1 \u00d3h lheuehnyan Nabi Daud geutaw\u00f6k dan geupeusapat
  lom tantra-tantra nyang paleng g\u00e9t di Israel mangat jimeugump\u00f4i, jeumeulah
  jih na 30.000 droe.\\n2 Awaknyan geupimp\u00e9n dan teutuju u Baale-Yehuda, mangat
  teujakcok nibak teumpat nyan Peuto Peujanjian nyang teupeugah deungon nan TUHAN
  Mahakuasa nyang duek meutahta di ateueh kerub-kerub.\\n3 Peuto Peujanjian nyan geucok
  di rumoh Abinadab di ateueh buk\u00e9t dan atra nyan geupeu \u00e9k laju u ateueh
  geureubak peudati nyang bar\u00f4. Dan l\u00e9 si Uza dan Ahio, aneu\u00ebk-aneu\u00ebk
  Abinadab ji ir\u00e9ng laju geureubak peudati nyan; si Uza jijak bak bin\u00e9h
  geureubak peudati nyan,\\n4 dan si Ahio jijak teuma dikeue geureubak peudati nyan.\\n5
  Nabi Daud dan banmandum bansa Israel geujak teuma dikeue geureubak peudati nyan
  sira meunari ngon geumeulikak sihab\u00e9h teunaga meunan cit teuir\u00e9ng deungon
  meuca-e keu teuhoreumat TUHAN. Awaknyan sira geujak geupeumeu \u00e9n keucapi, gambus,
  rapa-i, keuleuntingan, dan simbal.\\n6 \u00d3h wat\u00e9e ka trok awaknyan bak saboh
  teumpat nyang nan jih teumpat teupeuluroih aneuk gandom atra si Nakhon, hana teusangka-sangka
  di leum\u00f4-leum\u00f4 nyang teungoh jitarek geureubak nyan meugantoih, laju si
  Uza jisunyueng jaroe jih dan jimat laju Peuto Peujanjian nyan mangat b\u00e9k rhot.\\n7
  Bak wat\u00e9e nyan cit teuma TUHAN Po teu Allah jeuet keu beung\u00e9h ubak Uza,
  sabab l\u00e9 buet jih nyan na kheueh sibagoe teuhina ubak TUHAN. Dan Uza nyan laju
  geupoh mat\u00e9 di teumpat nyan, rab that ngon Peuto Peujanjian.\\n8 Teuma phon
  wat\u00e9enyan teumpat nyan geuboh nan Peres-Uza. Nabi Daud beung\u00e9h sabab TUHAN
  ka geupoh mat\u00e9 si Uza.\\n9 Teuma Nabi Daud geutakot cit ubak TUHAN sira geupeugah
  lag\u00e9e nyoe, \\\"Jinoenyoe pakriban Peuto Peujanjian nyan hase ul\u00f4n ba?\\\"\\n10
  Sababnyan kheueh gobnyan hana geutem ba Peuto Peujanjian nyan u Yerusalem, teuma
  geukeubah di rumoh Obed-Edom ureu\u00ebng Gat.\\n11 Peuto Peujanjian nyan laju tinggai
  disinan na lh\u00e9e buleuen treb jih, dan TUHAN laju geubri beureukat ubak Obet-Edom
  dan keuluwarga gobnyan.\\n12 Raja Daud geudeungoe bahwa TUHAN geubri beureukat ubak
  keuluwarga Obed-Edom dan banmandum atra mil\u00e9k jih sabab Peuto Peujanjian nyan.
  Teuma geujak kheueh laju gobnyan u rumoh Obed-Edom, geujak cok Peuto Peujanjian
  nyan geupinah teuma u Yerusalem deungon geupeuna peurayaan nyang lumpah gura.\\n13
  Bak wat\u00e9e ureu\u00ebng-ureu\u00ebng nyang jibeu\u00f4t Peuto Peujanjian nyan
  ka jijak nam boh langkah, Nabi Daud laju geuyue dong awaknyan. Dan gobnyan pih geupeuseumah
  laju keureubeuen keu TUHAN, na kheueh leum\u00f4 agam dan aneu\u00ebk leum\u00f4
  nyang ka geupeu teumbon.\\n14 \u00d3h lheuehnyan Nabi Daud laju geumeulikak ngon
  geumeunari deungon peunoh seumangat keu geuhoreumat ubak TUHAN. Bak wat\u00e9e nyan
  gobnyan nyang na geungui cuma ija kroeng lineun nyang paneuk nyang geu ikat ubak
  keuieng.\\n15 Meunan kheueh cara jih Nabi Daud dan banmandum rakyat Israel geupinah
  Peuto Peujanjian nyan u Yerusalem, teupeu-ir\u00e9ng deungon sumurak nyang meuhubo
  dan su beureuguih nyang hana put\u00f4h-put\u00f4h.\\n16 Bak wat\u00e9e Peuto nyan
  teungoh geuba jipeutamong u dalam banda, si Mikhal putroe Saul jicingeuek nibak
  peuradeuen teuma deuh laju geukalon Raja Nabi Daud mantong geumeulumpat-lumpat sira
  geumeulikak keu geuhoreumat ubak TUHAN, dan si Mikhal nyan g\u00e9t that geungeuen
  \u00f3h jikalon Nabi Daud nyang lag\u00e9e nyan.\\n17 Peuto Peujanjian nyan geukeubah
  laju nibak teumpat jih didalam khimah nyang ka geupasang l\u00e9 Nabi Daud keu Peuto
  nyan. \u00d3h lheuehnyan Nabi Daud laju teuma geupeuseumah keureubeuen nyang teutot
  dan keureubeuen peudam\u00e9 ubak TUHAN.\\n18 Laju gobnyan geubri beureukat ubak
  rakyat Israel deungon nan TUHAN Nyang Mahakuasa.\\n19 \u00d3h ka lheuehnyan laju
  teuma geubagi-bagi peunajoh keu awaknyan banmandum. Tieb-tieb ureu\u00ebng nyang
  na tinggai disinan bah kheueh jih nyan sidroe ureu\u00ebng agam atawa ureu\u00ebng
  inong geubri laju sikrak eungkot sie nyang teupanggang, ruti dan kue kismis. \u00d3h
  ka lheueh nyan awaknyan laju jijakwoe u rumoh jih mas\u00e9ng-mas\u00e9ng.\\n20
  Bak wat\u00e9e Nabi Daud geuwoe ubak meuligoe geuh keu geujak bri saleuem ubak banmandum
  keuluwarga gobnyan, Mikhal laju jiteubiet keu jijak meurumpok ngon Nabi Daud dan
  jipeugah, \\\"Bak uroenyoe raja Israel bit-bit ka geupeu jeuet droe geuh teuhoreumat!
  Gobnyan ka geumeulon lag\u00e9e ureu\u00ebng bangai nyang hana jiteupeue mal\u00e9e
  dikeue namiet ureu\u00ebng inong atra mil\u00e9k dumna peugaw\u00e9e meuligoe!\\\"\\n21
  Nabi Daud laju geujaweueb, \\\"Ul\u00f4n meulikak nyan na kheueh keu ul\u00f4n bri
  horeumat ubak TUHAN, nyang ka teutulak bapak droeneueh meunan cit deungon keuluwarga
  droeneueh, laju geupil\u00e9h ul\u00f4n mangat jeuet keu peumimp\u00e9n ateueh Israel,
  umat Gobnyan. Sabab nyan kheueh ul\u00f4n hana l\u00f4n pi\u00f4h meulikak ngon
  meunari ul\u00f4n horeumat TUHAN.\\n22 Bahpi meunan ul\u00f4n seudia jihina leubeh
  nibak nyang bunoe. Jeuet mantong droeneueh neupandang miyueb ateueh ul\u00f4n, teuma
  namiet-namiet nyang droeneueh peugah nyan bunoe, teuma jihareuga ul\u00f4n!\\\"\\n23
  Mikhal, putroe Saul nyan hana jimeu aneu\u00ebk siumu udeb gobnyan.\\nChapter 7\\n1
  TUHAN geupeulindong Raja Nabi Daud nibak meubagoe jipeukaru l\u00e9 musoh-musoh
  gobnyan, akh\u00e9 jih gobnyan hase teutab tinggai didalam meuligoe.\\n2 Teuma geupeugah
  kheueh l\u00e9 raja ubak Nabi Natan, \\\"Kalon, ul\u00f4n nyoe tinggai didalam meuligoe
  nyang teupeug\u00e9t nibak bahan kay\u00e9e ceumara Libanon, padahai Peuto Peujanjian
  Po teu Allah teuma teukeubah didalam khimah!\\\"\\n3 Geujaweueb l\u00e9 Natan, \\\"Neupeubuet
  kheueh laju peue nyang ka neuniet l\u00e9 Teungku Amphon, sabab TUHAN geutul\u00f4ng
  Teungku Amphon.\\\"\\n4 Teuma nibak malam nyan TUHAN geupeugah ubak Natan,\\n5 \\\"Neujak
  kheueh laju dan neupeusampoe kheueh ubak hamba Ul\u00f4n Nabi Daud peusan ul\u00f4n
  nyoe, ''Ek kheueh gata nyang peudong rumoh keu ul\u00f4n.\\n6 Yoh phon that bansa
  Israel Ul\u00f4n peubeubaih di nanggroe Meus\u00e9 sampoe nibak uroenyoe, h\u00e1ntom
  na lom Ul\u00f4n tinggai lam saboh rumah, seula\u00e9n ul\u00f4n meugeumbara dan
  tinggai didalam saboh khimah.\\n7 Yoh phon Ul\u00f4n meugeumbara meusajan deungon
  bansa Israel, h\u00e1ntom lom Ul\u00f4n teumanyong ubak peumimp\u00e9n-peumimp\u00e9n
  nyang ka Ul\u00f4n pil\u00e9h, peue sabab jih awaknyan hana jipeudong rumoh nibak
  kay\u00e9e ceumara Libanon keu Ul\u00f4n.''\\n8 L\u00e9 sabab nyan, hai Natan, tajak
  peugah kheueh ubak hamba Ul\u00f4n Nabi Daud, bahwa Ul\u00f4n, TUHAN Nyang Mahakuasa,
  Ul\u00f4n peugah ubak gobnyan, ''Gata ka Ul\u00f4n cok nibak buet gata meurabe didalam
  blang dan Ul\u00f4n bai\u00e1t gata jeuet keu raja ateueh umat Ul\u00f4n Israel.\\n9
  Ul\u00f4n ka Ul\u00f4n peungon gata ho mantong nyang gata jak, dan bubena musoh
  gata ka lheueh Ul\u00f4n samp\u00f4h banmandum bak wat\u00e9e gata teungoh lam prang.
  Gata teuma Ul\u00f4n peujeuet keu meusyeuhu saban lag\u00e9e peumimp\u00e9n-peumimp\u00e9n
  nyang paleng rayeuk di ateueh donya.\\n10 Lom teuma, keu umat Israel ka Ul\u00f4n
  keubah teumpat dan Ul\u00f4n yue awaknyan tinggai teutab disinan, mangat awaknyan
  hase jih udeb deungon teunang, dan hana ureu\u00ebng la\u00e9n nyang jijak peukaru.
  Phon awaknyan teuka ubak tanoh nyoe, dan Ul\u00f4n bai\u00e1t peumimp\u00e9n-peumimp\u00e9n
  keu awaknyan, awaknyan ka jiprang l\u00e9 ureu\u00ebng-ureu\u00ebng nyang galak
  ubak buet jeuhet lom kreueh. Teuma hainyan hana teujadi le. Ul\u00f4n meujanji bahwa
  gata teuma aman nibak mubagoe musoh, dan Ul\u00f4n teuma L\u00f4nbri keuturonan
  keu gata.\\n12 Teuma, meunyoe ajai gata ka sampoe, dan gata jitanom didalam jrat
  nibak teumpat jrat indatu gata, sidroe lamkawan aneu\u00ebk gata nyang agam Ul\u00f4n
  bai\u00e1t jeuet keu raja. Jihnyan kheueh nyang peudong rumoh keu Ul\u00f4n. Keurajeuen
  jih teuma Ul\u00f4n peuteuga dan keu siumu masa sidroe nibak keuturonan jih teuma
  jimat peurintah sibagoe raja.\\n14 Ul\u00f4n teuma jeuet keu bapak jih, dan jihnyan
  teuma jeuet keu aneu\u00ebk Ul\u00f4n. Meunyoe jihnyan jipeubuet buet nyang salah,
  jihnyan teuma Ul\u00f4n huk\u00f6m lag\u00e9e sidroe bapak geuhuk\u00f6m aneu\u00ebk
  geuh.\\n15 Teuma Ul\u00f4n teutab Ul\u00f4n peubuet nyang jroh keu jihnyan sisuai
  deungon janji Ul\u00f4n. Janji Ul\u00f4n keu jihnyan teuma teutab Ul\u00f4n mat,
  hana lag\u00e9e nyang ka Ul\u00f4n peubuet ubak si Saul nyang ka Ul\u00f4n g\u00e9es\u00e9e
  nibak teumpat jih duek mangat gata hase jeuet keuraja.\\n16 Gata hana put\u00f4h
  sabe na keuturonan, dan Ul\u00f4n teuma L\u00f4n peujeuet keurajeuen gata nyan jimeuteun
  siumu masa. Meunan cit keu siumu masa sidroe nibak keuturonan gata teuma jimat peurintah
  sibagoe raja.'' \\\"\\n17 Laju Natan geubri t\u00e9e ubak Nabi Daud peue mantong
  nyang ka geupeugah l\u00e9 Po teu Allah ubak gobnyan.\\n18 Geutamong kheueh laju
  Raja Nabi Daud u dalam Khimah TUHAN. Laju geuduek dan geumeudo\u00e1, \\\"Ya TUHAN
  Nyang Mahamanyang, ul\u00f4n dan keuluwarga ul\u00f4n hana patot ul\u00f4n teurimong
  mandum keubaikan nyang ka TUHAN tunyok ubak ul\u00f4n seulawet nyoe.\\n19 Dan TUHAN
  ka geupeubuet leubeh nibak nyan, Ya TUHAN Nyang Mahamanyang; Droeneueh ka neupeug\u00e9t
  janji keuhai keuturonan ul\u00f4n keu wat\u00e9e nyang teuma teuka. Dan Droeneueh
  peuleumah hainyan ubak ul\u00f4n, bahpih ul\u00f4n nyoe teuma sidroe manusia, Ya
  TUHAN Nyang Mahamanyang!\\n20 Peue lom nyang jeuet ul\u00f4n peugah ubak Droeneueh?
  Droeneueh ka neuteupeue banmandum keuhai ul\u00f4n nyoe.\\n21 Deumi janji Droeneueh
  dan ateueh keuheundak Droeneueh keudroe Droeneueh ka neupeubuet-buet nyang paleng
  rayeuk nyan guna jih keu neupeurunoe hamba Droeneueh nyoe.\\n22 Droeneueh keubiet
  akbar, ya TUHAN Allah! Teuma Droeneueh kheueh TUHAN Po teu Allah, hana nyang saban
  deungon Droeneueh. Kamoe meuteupeue hainyan sabab ka neubrit\u00e9e yoh phon masa
  il\u00e9e.\\n23 Di bansigom bumoe nyoe hana bansa nyang saban deungon bansa Israel.
  Israel na kheueh saboh bansa nyang ka neupeubeubaih nibak jipeujeuet keu namiet
  mangat jeuet keu umat Droeneueh keudroe. Banmandum buet nyang rayeuk dan aja\u00e9b
  nyang ka neupeubuet keu awaknyan, sampoe ka jeuet nan Droeneueh meusyeuhu bansaboh
  donya. Bansa-bansa nyang la\u00e9n meunan cit deungon dewa-dewa awaknyan ka Droeneueh
  use bak wat\u00e9e umat Droeneueh jimaju u mideuen prang.\\n24 Bansa Israel ka neupeujeuet
  keu umat Droeneueh keudroe keu siumu masa, dan Droeneueh, ya TUHAN, ka jeuet keu
  Po teu Allah awaknyan.\\n25 Dan jinoenyoe, ya TUHAN Po teu Allah, bah kheueh kira
  jih TUHAN peukong keu siumu masa janji nyang ka Droeneueh peugah keuhai droe ul\u00f4n
  dan keuturonan ul\u00f4n. Soe kheueh kira jih TUHAN peubuet peue nyang ka TUHAN
  peujanji nyan.\\n26 Dipat mantong bubena ureu\u00ebng sabe jipeu agong-agong nan
  Droeneueh sira jipeugah, ''TUHAN Nyang Mahakuasa na kheueh Po teu Allah ateueh Israel.''
  Teuma keu siumu masa sidroe nibak keuturonan ul\u00f4n teuma jimat peurintah sibagoe
  raja ateueh bansa nyoe.\\n27 TUHAN Nyang Mahakuasa! Ul\u00f4n peubeurani droe ul\u00f4n
  lak\u00e9e do\u00e1 nyoe ubak Droeneueh, sabab Droeneueh keudroe ka neubri t\u00e9e
  ubak ul\u00f4n bahwa aneu\u00ebk cucoe ul\u00f4n treun meutreun teuma neupeujeuet
  keu raja ateueh bansa nyoe.\\n28 Ya TUHAN Nyang Mahamanyang, Droeneueh kheueh Po
  teu Allah; banmandum janji Droeneueh neupeuteupat, dan hai nyang g\u00e9t-g\u00e9t
  nyan ka neupeujanji ubak ul\u00f4n.\\n29 Sabab nyan, ul\u00f4n lak\u00e9e, neutem
  kheueh kirajih neubri beureukat ateueh keuturonan ul\u00f4n, mangat jeuet keu siumu
  masa awaknyan teutab jirasa gas\u00e9h nyang seutia nibak Droeneueh. Ya TUHAN Nyang
  Mahamanyang, banmandum nyan ka lheueh TUHAN peujanji, teuma keuturonan ul\u00f4n
  teutab TUHAN bri beureukat keu siumu masa.\\\"\\nChapter 8\\n1 Napadub na treb teuma
  \u00f3h lheuehnyan Nabi Raja Daud geujak prang lom ureu\u00ebng Filistin. Ureu\u00ebng
  Filistin nyan laju geupeutaloe dan teureubot tanoh awaknyan pi laju geureubot.\\n2
  Meunan cit di Nabi Daud geujak prang teuma ureu\u00ebng Moab dan awaknyan pih taloe.
  Geuyue awaknyan mangat ji-\u00e9h di ateueh tanoh, ureu\u00ebng nyang ka ji-\u00e9h
  nyan laju geupoh mat\u00e9 dua droe tieb-tieb lh\u00e9e droe nyang na \u00e9h disinan.
  Deungon nyan, di ureu\u00ebng Moab ka jitaklok ubak Nabi Daud dan laju jibayeue
  upeti ubak gobnyan.\\n3 \u00d3h lheuehnyan Nabi Raja Daud nyan geujak prang dan
  geupeutaloe teuma Raja Hadadezer aneu\u00ebk Rehob nyan mat peurintah di Zoba, na
  kheueh saboh keurajeuen nyang rab ngon Damsyik. Bak wat\u00e9e nyan Hadadezer teungoh
  lamjak keuneuk jijak peupul\u00e9h keukuasaan jih di wilayah nyang rab ngon ul\u00e9e
  Krueng Efrat.\\n4 Nabi Daud laju geudrob 1.700 droe tantra meuguda, dan 20.000 droe
  tantra nyang jijak ngon gaki. Gobnyan geupeuhanco mandum guda, teuma na bacut sagai,
  seb keu sireutoih geuritan prang.\\n5 Di Ureu\u00ebng Siria nyan na di Damsyik laju
  teuma jikir\u00e9m sipa-i keu jijak tul\u00f4ng Raja Hadadezer. Teuma Nabi Daud
  laju geupeutaloe awaknyan dan meuteum\u00e9 geupoh mat\u00e9 22.000 droe nibak awaknyan.\\n6
  \u00d3h lheuehnyan Nabi Daud laju geupeudong khimah-khimah tantra lam wilayah awaknyan,
  dan awaknyan taklok dan jibayeue upeti ubak gobnyan. TUHAN geupeumeunang ubak Nabi
  Daud dipat mantong gobnyan geupeubeud\u00f4h prang.\\n7 Tameng-tameng m\u00e9uh
  nyang jingui l\u00e9 tantra Hadadezer laju geureupah l\u00e9 Nabi Daud dan geuba
  laju atranyan u Yerusalem.\\n8 Seula\u00e9n nibaknyan Nabi Daud geucok teuma peurunggu
  nyang lumpah that le nibak Betah dan Berotai, banda-banda nyang yoh wat\u00e9e il\u00e9e
  jikuasa l\u00e9 Raja Hadadezer.\\n9 Raja Tou di nanggroe Hamat geudeungoe teuma
  bahwa Nabi Daud ka geupeutaloe banmandum tantra Hadadezer.\\n10 Teuma l\u00e9 geuhnyan
  laju geu kir\u00e9m Yoram aneu\u00ebk agam gobnyan mangat geujak peutrok saleuem
  ubak Nabi Raja Daud dan geupeugah seulamat ateueh keumeunangan gobnyan, sabab Hadadezer
  ka kay\u00e9m that geumuprang deungon Raja Tou. Yoram jijak ubak Nabi Daud sira
  jiba hadiah nyang lumpah le nyang teupeug\u00e9t nibak m\u00e9uh, pirak dan peurunggu.\\n11
  Nabi Raja Daud nyan laju geupeuseumah banmandum hareuta nyan ubak TUHAN mangat teupeuguna
  didalam upacara i\u00e9badat. Meunan cit teuma geupeubuet u ateueh barang-barang
  m\u00e9uh dan pirak nyang ka geureupah nibak Raja Hadadezer dan barang-barang bansa
  nyang ka geupeutaloe, bansa nyan na kheueh, bansa Edom, Moab, Amon, Filistin dan
  Amalek.\\n13 Nan Nabi Daud meutamah meusyeuhu lom bak wat\u00e9e gobnyan meuhase
  geupeutaloe ngon geupeumat\u00e9 na kira-kira 18.000 droe ureu\u00ebng Edom di Pant\u00f4n
  Asin.\\n14 Gobnyan laju geupeudong khimah-khimah tantra nibak saboh nanggroe Edom,
  dan bubena ureu\u00ebng Edom nyan ka taklok ubak gobnyan. TUHAN geujok meunang keu
  Nabi Daud dipat mantong gobnyan geupeubeud\u00f4h prang.\\n15 Meunan kheueh cara
  jih Nabi Daud geumat peurintah nibak bansaboh nanggroe Israel dan geujaga mangat
  rakyat gobnyan sabe teupeusaneut ngon ade dan g\u00e9t-g\u00e9t.\\n16 Nyoe kheueh
  peujabat-peujabat rayeuk nyang geu angkat l\u00e9 Nabi Daud nyan: Panglima angkatan
  prang: Yoab aneu\u00ebk Zeruya; Sekretaris meuligoe: Yosafat aneu\u00ebk Ahilud;
  Teungku-teungku imeum: Zadok aneu\u00ebk Ahitub, dan Ahimelekh aneu\u00ebk Abyatar;
  Sekretaris nanggroe: Seraya\\n18 Ul\u00e9e kawan nyang kawai pribadi raja: Benaya
  aneu\u00ebk Yoyada; Teungku-teungku imeum di meuligoe: aneu\u00ebk-aneu\u00ebk agam
  Nabi Daud.\\nChapter 9\\n1 Bak siuroe Nabi Daud geuteumanyong, \\\"Peu kheueh mantong
  na ureu\u00ebng nyang udeb lam keuluwarga Saul? Meunyoe mantong na, ul\u00f4n keuneuk
  jak peubuet nyang g\u00e9t ubak keuluwarga nyan deumi si Yonatan.\\\"\\n2 Keuluwarga
  Saul na sidroe namiet nyang nan jih Ziba, dan namiet nyan geuyue jak meuhadab ubak
  Raja Nabi Daud. Raja geuteumanyong, \\\"Peu kheueh gata nyang nan Ziba?\\\" \\\"Nyoe,
  beut\u00f4i that Teungku Amphon,\\\" jijaweueb l\u00e9 Ziba nyan.\\n3 \u00d3h lheuehnyan
  raja geutanyong lom, \\\"Peu kheueh mantong na ureu\u00ebng nyang udeb lam keuluwarga
  Saul? Ul\u00f4n keuneuk jak peubuet nyang g\u00e9t keu ureu\u00ebng nyan, lag\u00e9e
  nyang ka ul\u00f4n meujanji ubak Po teu Allah.\\\" Geujaweueb l\u00e9 Ziba, \\\"Mantong
  na sidroe aneu\u00ebk agam si Yonatan. Jihnyan capiek.\\\"\\n4 \\\"Dipat jihnyan?\\\"
  geutanyoe l\u00e9 Raja Daud. \\\"Di Lodebar, di rumoh si Makhir aneu\u00ebk si Amiel,\\\"
  jipeugah l\u00e9 Ziba.\\n5 L\u00e9 Nabi Raja Daud laju geuyuejak h\u00f4i aneu\u00ebk
  agam si Yonatan nyan.\\n6 Aneu\u00ebk agam Yonatan nyan nan jih Mefiboset. Bak wat\u00e9e
  katrok jiteuka, laju jisujut jibri horeumat ubak Nabi Daud. Nabi Daud laju geusapa
  ureu\u00ebng nyan, sira geupeugah, \\\"Mefiboset,\\\" dan aneu\u00ebk nyan laju
  jijaweueb, \\\"Nyoe pat ul\u00f4n, Teungku Amphon.\\\"\\n7 Nabi geupeugah, \\\"B\u00e9k
  teumakot teuh. Ul\u00f4n keuneuk peumurah at\u00e9 keu gata deumi si Yonatan bapak
  gata. Banmandum tanoh atra abusyiek gata si Saul, teuma ul\u00f4n jok pulang ubak
  gata dan keu siumu masa gata jeuet tamakheun nibak meuligoe gobnyan.\\\"\\n8 Mefiboset
  jisujut lom sira jipeugah, \\\"Peu kheueh makna jih ul\u00f4n nyoe hai Teungku Amphon!
  Pakon Teungku Amphon leupah jroh keu ul\u00f4n?\\\"\\n9 Laju l\u00e9 raja geutaw\u00f6k
  Ziba namiet Saul nyan, dan geupeugah laju, \\\"Peue mantong na hareuta nyang jitinggai
  l\u00e9 Saul dan keuluwarga gobnyan sabab atra ul\u00f4n keuneuk bri keu cucoe Teungku
  gata nyoe.\\n10 Gata dan aneu\u00ebk-aneu\u00ebk meunan cit deungon peumbantu gata
  bahtajak meu\u00fae tanoh nyan deumi keuluwarga teungku gata si Saul, dan neubri
  kheueh laju hase tanoh nyan ubak awaknyan mangat teupeuseb nyang jipeureul\u00e9e
  l\u00e9 awaknyan. Teuma Mefiboset jeuet geumakheun nibak meuligoe siumu masa.\\\"
  (Ziba na jimeu aneu\u00ebk 15 droe aneu\u00ebk agam dan 20 droe namiet).\\n11 Geujaweueb
  l\u00e9 Ziba ubak raja, \\\"Banmandum titah Teungku Amphon teuma ul\u00f4n peubuet.\\\"
  Teuma l\u00e9 Mefiboset laju jimakheun saboh talam deungon raja, lag\u00e9e aneu\u00ebk
  agam Nabi Raja Daud keudroe.\\n12 Mefiboset na teuma jimeu aneu\u00ebk agam nyang
  nan jih si Mikha. Banmandum anggota keuluwarga Ziba nyan ka jeuet keu namiet Mefiboset.\\n13
  Meunan kheueh si Mefiboset nyang capiek nibak ban dua blaih gaki jih nyan tinggai
  di Yerusalem dan sabe jipajoh bu di Meuligoe.\\nChapter 10\\n1 Na meupadub treb
  teuma \u00f3h lheueh nyan Nahas raja Amon meuninggai donya, dan aneu\u00ebk gobnyan
  nyang agam nyang nan jih Hanun duek keugeunantoe raja.\\n2 Dan geupeugah l\u00e9
  Nabi Raja Daud, \\\"Nahas na kheueh rakan ul\u00f4n nyang that seutia. Jadi ul\u00f4n
  har\u00f4h kheueh ul\u00f4n meusahabat deungon Hanun aneu\u00ebk geuh nyan.\\\"
  Sabab nyan Nabi Daud laju geukir\u00e9m utosan u nanggroe Amon mangat teujak peuhibor
  at\u00e9 Hanun ateueh kameuninggai bapak jihnyan.\\n3 Bak wat\u00e9e awaknyan ka
  trok u Amon, bubena peumimp\u00e9n nanggroe nyan laju jijak peugah ubak Hanun, \\\"B\u00e9k
  kheueh neupike hai Teungku Amphon Nabi Daud geukir\u00e9m utosan geuh nyan sabab
  gobnyan geukeuneuk horeumat keu bapak Teungku Amphon! Gobnyan geukir\u00e9m ureu\u00ebng
  geuh keunoe na kheueh sibagoe mata-mata jijak muluem u nanggroe geutanyoe nyoe,
  jijak seulidek banda geutanyoe mangat hase jireubot l\u00e9 awaknyan.\\\"\\n4 L\u00e9
  Hanun laju jidrob utosan Nabi Daud nyan, jicuko laju janggot awaknyan siblaih, dan
  jigunteng teuma peukayan awaknyan sampoe \u00f3h punggong, dan laju jiyue jak awaknyan.\\n5
  Teuma awaknyan that-that mal\u00e9e keuneuk jiwoe u nanggroe droe jih. \u00d3h wat\u00e9e
  hainyan jibrit\u00e9e ubak Nabi Daud, gobnyan laju geukir\u00e9m lom utosan mangat
  awaknyan tinggai mantong di Yerikho sampoe janggot awaknyan jitimoh lom teuma.\\n6
  \u00d3h lheueh nyan di ureu\u00ebng Amon jisada bahwa deungon buet awaknyan nyang
  lag\u00e9e nyan bagoe Nabi Daud ka jeuet keumusoh. Sabab nyan di awaknyan laju jijak
  siwa 20.000 droe tantra ureu\u00ebng Siria nyang na tinggai di Bet-Rehob dan Zoba,
  meunan cit deungon 12.000 droe tantra di nanggroe Tob, meunan cit meusajan teuma
  deungon raja nibak nanggroe Maakha deungon 1.000 droe tantra gobnyan.\\n7 Bak wat\u00e9e
  Nabi Daud geudeungoe hai nyan, gobnyan laju geuyue Yoab deungon banmandum angkatan
  prang gobnyan geuyue maju jak lawan musoh.\\n8 Ureu\u00ebng Amon laju jiteubiet
  dan ji ato laju baresan jih di keu pintoe geureubang Raba ma banda awaknyan keudroe,
  seudangkan ureu\u00ebng Siria, ureu\u00ebng Tob dan Maakha jiatoe teuma baresan
  jih di dalam padang.\\n9 Yoab jikalon bahwa gobnyan ka teuseupet ngon ji apet l\u00e9
  pasokan musoh dikeue dan dilikot droe geuh. Sabab nyan gobnyan laju geupil\u00e9h
  tantra Israel nyang paleng g\u00e9t dan laju awaknyan geupeuduek meuhadab-hadab
  keue deungon tantra Siria.\\n10 Nyang leubeh nibak tantra Israel nyan jiseurah laju
  ubak Abisai adoe gobnyan, nyang atoe baresan awaknyan meuhadab keue teuma deungon
  tantra Amon.\\n11 Yoab jipeugah ubak adoe jih nyan, \\\"Meunyoe ul\u00f4n singoh
  ka hana ekle ul\u00f4n meuteun teuhadab tantra Siria, bubagaih kheueh neutul\u00f4ng
  ul\u00f4n; meunan cit teuma, meunyoe droe kheueh hana ekle neupeuteuen teuhadab
  tantra Amon nyan, ul\u00f4n teuma l\u00f4n teuka jak tul\u00f4ng gata.\\n12 Saba
  kheueh! Jak kheueh geutanyoe tajak muprang deungon ceubeueh dan beurani deumi keu
  bansa geutanyoe dan keu banda-banda Po teu Allah geutanyoe. Seumoga TUHAN geupeubuet
  peue nyang geukeuheundaki.\\\"\\n13 Yoab dan pasokan gobnyan laju jimaju u mideuen
  prang, akh\u00e9 jih bube nyang na tantra Siria ka hab\u00e9h jiplueng.\\n14 Bak
  wat\u00e9e ureu\u00ebng Amon jikalon tantra Siria ka jiplueng bansalamle, awaknyan
  pih jiplueng cit nibak Abisai dan ji surot laju u dalam banda. \u00d3h ka lheueh
  jiprang ureu\u00ebng Amon, Yoab laju geuwoe riwang u Yerusalem.\\n15 Ureu\u00ebng
  Siria jit\u00e9e droe bahwa jihnyan ka jipeutaloe l\u00e9 ureu\u00ebng Israel, sabab
  nyan laju jih\u00f4i banmandum anggota pasokan jih mangat jimeusapat lom.\\n16 Teuma
  l\u00e9 Raja Hadadezer geuyue jakh\u00f4i ureu\u00ebng Siria nyang na di siblaih
  u timu Krueng Efrat, dan jiteuka kheueh awaknyan u Helam dimiyueb pimp\u00e9nan
  panglima Sobakh, Sobakh nyan na kheueh panglima tantra Raja Hadadezer di Zoba.\\n17
  Ban geudeungoe hai nyan, Nabi Daud deungon reujang that geupeusapat banmandum pasokan
  Israel, laju geujak jeumeurang u meurandeh Krueng Yordan, \u00f3h lheuehnyan jimaju
  laju u Helam. Disinan na teuma ureu\u00ebng Siria teungoh ji atoe baresan jih dan
  laju teuma jimaju jijak prang pasokan Nabi Daud.\\n18 Teuma di ureu\u00ebng Israel
  laju jipoh sampoe jisurot u likot tantra Siria. Nabi Daud dan pasokan gobnyan ka
  geupoh mat\u00e9 700 droe nyang mat keumudoe geuritan prang, dan 40.000 droe teuma
  tantra meuguda; seula\u00e9n nibak nyan si Sobakh nyang panglima prang nyan keunong
  teuma dan luka jih lumpah parah akh\u00e9 jih sabab luka nyan jihnyan pih mat\u00e9
  di mideuen prang.\\n19 Bak wat\u00e9e raja-raja nyang jimat kuasa l\u00e9 Hadadezer
  jikalon bahwa awaknyan ka jipeutaloe l\u00e9 tantra Israel, awaknyan laju jilak\u00e9e
  meudam\u00e9 laju jitaklok ubak ureu\u00ebng Israel. Phon wat\u00e9enyan di ureu\u00ebng
  Siria hana jijeuet le jibantu ureu\u00ebng Amon.\\nChapter 11\\n1 Raja-raja biasa
  jijakmaju u mideuen prang bak wat\u00e9e mus\u00e9m semi. Dan bak wat\u00e9e mus\u00e9m
  semi thon nyan Nabi Daud geuyue ubak Yoab mangat jijak maju umideuen prang meusajan
  deungon mandum peuwira gobnyan dan banmandum peuwira Israel; laju awaknyan geupeutaloe
  ureu\u00ebng Amon dan geukeupong banda Raba. Teuma Nabi Daud teutab na tinggai di
  Yerusalem.\\n2 Bak siuroe, wat\u00e9e ka seup\u00f4t, \u00f3h ka lheueh Nabi Daud
  geubeud\u00f4h nibak teung\u00e9ut, gobnyan laju geujak-jak di ateueh bubong meuligoe
  nyang data nyan. Nibak teumpatnyan leumah geukalon sidroe ureu\u00ebng inong teungoh
  jimano, dan ureu\u00ebng inong nyan lumpah ceudah.\\n3 L\u00e9 Nabi Daud laju geuyue
  tanyong soe ureu\u00ebng inong nyan, dan laju jibri t\u00e9e bahwa ureu\u00ebng
  inong nyan nan jih Batsyeba; bapak jih nan geuh Eliam dan lakoe gobnyan na kheueh
  Uria ureu\u00ebng Het.\\n4 Nabi Daud laju geuyue jakh\u00f4i ureu\u00ebng inong
  nyan, dan \u00f3h ka trok inong nyan ubak meuligoe, Nabi Daud laju geu-\u00e9h deungon
  ureu\u00ebng inong nyan. (Batsyeba ban mantong lheueh jipeubuet upacara meusuci
  \u00f3h ka hab\u00e9h jiteuka he). Dan jijakkwoe kheueh laju inong nyan u rumoh
  jih.\\n5 Hana padubna treb teuma \u00f3h lheuehnyan Batsyeba laju mume, laju gobnyan
  jijak peugah ubak Nabi Daud keuhai nyan.\\n6 Bak wat\u00e9e nyan cit teuma Nabi
  Daud geubri peurintah ubak Yoab, geupeugah, \\\"Gata yue laju ubak Uria ureu\u00ebng
  Het nyan mangat jijak meurumpok deungon ul\u00f4n.\\\" Teuma Yoab laju jiyue Uria
  jijak meurumpok deungon Nabi Daud.\\n7 Bak wat\u00e9e Uria jijak meurumpok deungon
  Nabi Daud, raja laju geutanyong ubak jihnyan keuadaan Yoab dan pasokan Israel, dan
  meunan cit geutanyong pakriban teuma jalan jih wat\u00e9e teumuprang.\\n8 \u00d3h
  lheuehnyan Nabi Daud geupeugah lom ubak Uria, \\\"Tajak woe kheueh u rumoh gata
  dan tajak pi\u00f4h h\u00e9k kheueh meusikeujab.\\\" \u00d3h ka lheueh Uria jitinggai
  meuligoe Nabi Daud nyan, Nabi Daud laju geukir\u00e9m hadiah u rumoh Uria.\\n9 Teuma
  Uria hana jiwoe teuma jijak \u00e9h sampoe teung\u00e9ut dibabah pintoe meuligoe
  meusajan deungon banmandum peungawai raja.\\n10 Ubak Nabi Daud jijak peugah laju
  keuhai nyan. Teuma gobnyan laju geutanyong ubak Uria, \\\"Gata banmantong tawoe
  nibak meuneujak nyang lumpah ji\u00f4h, pakon hana tajakwoe u rumoh gata?\\\"\\n11
  Jijaweueb l\u00e9 Uria, \\\"Tantra Israel dan Yehuda teungoh jimeujuang udeb mat\u00e9
  dan Peuto Peujanjian TUHAN na nibak awaknyan; Yoab panglima kamoe dan bubena peuwira
  awaknyan geupeudong khimah di teungoh padang. Ek kheueh ul\u00f4n nyoe l\u00f4n
  jakwoe u rumoh, dan makheun meusajan meunan cit l\u00f4n \u00e9h meusajan deungon
  ureu\u00ebng binoe? Deumi nyaw\u00f6ng Teungku Amphon dan nyaw\u00f6ng ul\u00f4n,
  ul\u00f4n hana ul\u00f4n peubuet hai nyan!\\\"\\n12 Laju geupeugah l\u00e9 Nabi
  Daud, \\\"Ka kheueh meunyoe meunan, gata meureuhat kheueh disinoe bak uroenyoe dan
  singoh beungoh teuma ul\u00f4n peu idhin gata tajak.\\\" Deungon nyan Uria pih tinggai
  di Yerusalem nibak uroenyan. Bak uroe nyang seulanjut jih gobnyan teu-undang jak
  makheun meusajan Nabi Daud.\\n13 Teuma jipajoh kheueh bu meusigoe ngon Nabi Daud
  nyan meunan cit deungon i\u00e9 meuneujieb na kheueh i\u00e9 kreueh nyang lumpah
  jai sampoe Uria ka mab\u00f6k. Teuma nibak malam nyan Uria nyan hana cit jiwoe u
  rumoh jih, teuma ji-\u00e9h di ateueh ija seulimbot jih di dalam kama peungawai
  meuligoe.\\n14 \u00d3h singoh beungoh nyan Nabi Daud laju geutul\u00e9h surat bak
  Yoab di mideuen prang, dan surat nyan geukir\u00e9m laju deungon peurantaraan si
  Uria.\\n15 Asoe surat nyan na kheueh lag\u00e9e nyoe, \\\"Gata peuduek kheueh si
  Uria nyoe nibak gareh nyang paleng dikeue bak wat\u00e9e tamaju u mideuen prang,
  \u00f3h lheuehnyan gata tasurot kheueh ulikot mangat jihnyoe mat\u00e9.\\\"\\n16
  Teuma teungoh Yoab jikeupong banda nyan, Uria laju geuyue ubak saboh teumpat nyang
  ka jiteupeue bahwa nibak teumpat nyan lumpah teuga jijaga l\u00e9 musoh.\\n17 Bak
  wat\u00e9e tantra musoh jiteubiet nibak banda dan jijak prang tantra Yoab, na meupadub
  droe peuwira Nabi Daud ka teupoh mat\u00e9, meunan cit deungon Uria mat\u00e9 disinan.\\n18
  \u00d3h lheuehnyan Yoab laju geukir\u00e9m utosan ubak Nabi Daud keujijak peugah
  jalan teujadi muprang nyang paleng hebat nyan.\\n19 Haba peurintah Yoab ubak utosan
  nyan lag\u00e9e nyoe, \\\"\u00d3h ka lheueh Teungku Amphon geudeungoe laporan gata
  keuhai jalan jih muprang nyoe,\\n20 mungken gobnyan jeuet keubeung\u00e9h dan geutanyong
  ubak gata, ''Pakon gata rab that-that deungon banda nyan? Bukon kheueh gata tateupeue
  bahwa musoh pasti ji timbak gata deungon panah-panah nyang jipeuleuh diateueh pageue-pageue
  beuton rumoh awaknyan?\\n21 Peu kheueh gata ka tuwoe bahwa si Abimelekh aneu\u00ebk
  Gideon nyan teupoh mat\u00e9 di Tebes? Bukon kheuehnyan mat\u00e9 l\u00e9 sabab
  na sidroe ureu\u00ebng inong jigeulawa deungon aneuk bat\u00e9e ngon gileng teup\u00f4ng
  nibak ateueh beuton ubak gobnyan? Nyang kheueh, pakon gata meunan that t\u00f4 deungon
  beuton nyan?'' Meunyoe Teungku Amphon geutanyong lag\u00e9e nyan, tapeugah kheueh
  laju ubak gobnyan, ''Uria si peuwira Teungku Amphon, meunan cit ka mat\u00e9 meusajan!''
  \\\"\\n22 Jijak kheueh laju utosan nyan jimeuhadab ubak Nabi Daud dan jipeugah peue
  nyang ka jipeugah l\u00e9 Yoab ubak gobnyan.\\n23 Utosan nyan jikheun, \\\"Lawan
  kamoe leubeh teuga dan awaknyan jiteubiet dalam banda laju jijak prang kamoe nyang
  na didalam padang. Teuma deungon sihab\u00e9h teunaga hana meurasa teumakot kamoe
  lawan laju awaknyan sampoe trok lom u babah pintoe geureubang banda.\\n24 \u00d3h
  lheueh nyan di ateueh bubong meunan cit deungon di ateueh pageue beuton awaknyan
  laju jipeutek kamoe deungon aneuk panah, dan napadub droe nibak peuwira Teungku
  Amphon meunan cit deungon si Uria pih ka mat\u00e9.\\\"\\n25 Nabi Daud geupeugah
  ubak ureu\u00ebng nyang ba habanyan, \\\"Gata peukhong kheueh at\u00e9 Yoab dan
  tapeugah kheueh laju ubak droe jihnyan mangat b\u00e9k cut at\u00e9, sabab hana
  hase jiramai soe nyang teuma mat\u00e9 lam prang nyan. Peugah kheueh ubak geuhnyan
  mangat jijak prang musoh nyang leubeh hibat dan leubeh nibak nyang ka-ka ateueh
  banda nyan sampoe banda nyan meuteum\u00e9 teureubot dan meunyeurah.\\\"\\n26 Bak
  wat\u00e9e Batsyeba geudeungoe bahwa lakoe geuh ka meuninggai, laju gobnyan meukabong
  ngon at\u00e9 nyang peudeh.\\n27 \u00d3h lheuehnyan \u00f3h ka hab\u00e9h wat\u00e9e
  meukabong, Nabi Daud laju geuyuejak tueng ureu\u00ebng inong nyan mangat jiba u
  meuligoe gobnyan dan laju geucok keu ureu\u00ebng binoe geuh. Na padub beuleuen
  teuma \u00f3h lheuehnyan ureu\u00ebng binoe geuhnyan geupeulah\u00e9 sidroe aneu\u00ebk
  agam. Teuma TUHAN hana galak keubuet Nabi Daud nyang lag\u00e9e nyan.\\nChapter
  12\\n1 \u00d3h ka lheueh nyan TUHAN laju geu kir\u00e9m Nabi Natan geuyue jak meurumpok
  deungon Nabi Daud. Nabi Natan laju geujak ubak gobnyan dan geupeugah, \\\"Na dua
  droe ureu\u00ebng nyang tinggai dalam saboh banda; nyang sidroe kaya dan nyang sidroe
  teuk gasien.\\n2 Sikaya bak jihnyan jai that jipeulara beulatang peulara dan bubiri,\\n3
  seudangkan ureu\u00ebng gasien nyan bak jihnyan teuma na saboh aneu\u00ebk bubiri,
  nyang jibloe. Aneu\u00ebk bubiri nyan jipeulara sampoe ka rayeuk di dalam rumoh
  jihnyan meusajan-sajan deungon aneu\u00ebk-aneu\u00ebk gobnyan. Aneu\u00ebk bubiri
  nyan jijok peunajoh nibak peunajoh ureu\u00ebng nyan, sampoe ubak jipeujieb i\u00e9
  keu aneu\u00ebk bubiri nyan dalam cangkie ureu\u00ebng nyan keudroe, meunan cit
  deungon ji-\u00e9h aneu\u00ebk bubiri nyan didalam pangk\u00e9e ureu\u00ebngnyan;
  paneuk haba, jipeusaneut aneu\u00ebk bubirinyan saban lag\u00e9e jipeusaneut keu
  aneu\u00ebk inong jihnyan keudroe.\\n4 Bak siuroe ureu\u00ebng kaya jiteuka jam\u00e9
  dirumoh jih nyan. Ureu\u00ebng kaya nyan hana jitem sie bubiri atawa leum\u00f4
  jih nyan keudroe mangat jeuet teutaguen keu jam\u00e9 jih nyan. Teuma jijak cok
  aneu\u00ebk bubiri ureu\u00ebng gasien nyan, laju atra ureu\u00ebng gasien nyan
  jisie dan jitaguen laju keu jam\u00e9 jih nyan.\\\"\\n5 Ban geudeungoe nyang lag\u00e9e
  nyan Nabi Daud g\u00e9t that beung\u00e9h sabab buet ureu\u00ebng kaya nyang lag\u00e9e
  nyan dan geupeugah, \\\"Keujam that ureu\u00ebng kaya nyan! Deumi TUHAN nyang udeb,
  ureu\u00ebng nyan har\u00f4h jigantoe aneu\u00ebk bubiri nyan peuet goe lipat dan
  ureu\u00ebng nyan har\u00f4h teuhuk\u00f6m mat\u00e9!\\\"\\n7 Geupeugah l\u00e9
  Nabi Natan ubak Nabi Daud, \\\"Teungku Amphon kheueh ureu\u00ebng nyang teupeugah
  nyan! Dan nyoe kheueh nyang geupeugah l\u00e9 TUHAN, Po teu Allah Israel, ''Droeneueh
  ka Ul\u00f4n bai\u00e1t jeuet keu raja ateueh Israel dan ka Ul\u00f4n peuseulamat
  nibak si Saul.\\n8 Keurajeuen Saul dan bubena peurumoh jihnyan ka Ul\u00f4n bri
  keu gata, lom teuma gata Ul\u00f4n bai\u00e1t jeuet keuraja ateueh Israel dan Yehuda.
  Meunyoe atra nyan gohlom seb, pasti teuma Ul\u00f4n jok lom keu gata nyang leubeh
  le nibak nyang na.\\n9 Pakon gata hana tapakoe peue nyang ka Ul\u00f4n peurintah?
  Keupeue tajak peubuet nyang jeuhet nyan? Uria gata yuepoh mat\u00e9 didalam prang;
  tapeubiyeu jihnyan mat\u00e9 jipoh l\u00e9 ureu\u00ebng Amon, dan gata cok teuma
  peurumoh jih!\\n10 L\u00e9 sabab gata hana tata\u00e1t ubak Ul\u00f4n dan tareupah
  teuma peurumoh Uria, l\u00e9 sababnyan didalam tieb-tieb keuturonan gata treun meutreun
  na nyang mat\u00e9 teupoh.\\n11 Ul\u00f4n meusumpah teuma Ul\u00f4n peurhot mala
  peutaka nyan u ateueh gata nyang teuka jih nibak keuluwarga gata keudroe. Ul\u00f4n
  teuma L\u00f4ncok peurumoh-peurumoh gata dikeue mata gata keudroe dan teuma Ul\u00f4n
  jok keu ureu\u00ebng la\u00e9n nyang teuma ji-\u00e9h meusajan awaknyan bak wat\u00e9e
  uroe ka peungeuh trang.\\n12 Gata ka tapeubuet desya seucara seungab-seungab, teuma
  saboh wat\u00e9e Ul\u00f4n kupeubukeuti ancaman Ul\u00f4n nyan deungon seucara trang-trang
  di bansaboh Israel.'' \\\"\\n13 Laju geupeugah l\u00e9 Nabi Daud ubak Nabi Natan,
  \\\"Ul\u00f4n ka meudesya ubak TUHAN.\\\" Geujaweueb l\u00e9 Nabi Natan, \\\"TUHAN
  ka geupeu amphon Teungku po; jadi Teungku Amphon hana teuma mat\u00e9.\\n14 Teuma
  l\u00e9 sabab Teungku Amphon ka neuhina TUHAN deungon buet droeneueh nyan, aneu\u00ebk
  agam Teungku Amphon nyang ban lah\u00e9 nyan teuma mat\u00e9.\\\"\\n15 \u00d3h ka
  lheueh geupeugah nyan geuwoe kheueh Nabi Natan u rumoh gobnyan. Aneu\u00ebk agam
  Nabi Daud nyang geupeulah\u00e9 l\u00e9 Batsyeba bal\u00e9e Uria ka rhot bak sak\u00e9t
  deungon keuheundak TUHAN.\\n16 Laju Nabi Daud geumeudo\u00e1 ubak TUHAN mangat aneu\u00ebk
  geuh nyan pul\u00e9h. Gobnyan geupuasa dan tieb-tieb malam geu-\u00e9h simalam beungoh
  ateueh aleue kama gobnyan.\\n17 Laju l\u00e9 ureu\u00ebng-ureu\u00ebng patot nyang
  teupeucaya di dalam meuligoe jijak ubak gobnyan dan jibujuk gobnyan mangat geubeud\u00f4h,
  teuma gobnyan geutulak dan hana geutem makheun meusigoe ngon awaknyan.\\n18 Na siseuen
  aleuhat teuma \u00f3h lheuehnyan aneu\u00ebk nyan pih meuninggai donya, dan bubena
  namiet Nabi Daud ban mandum jitakot keu jijak brit\u00e9e hai nyan. Jipeugah l\u00e9
  awaknyan, \\\"Yoh wat\u00e9e aneu\u00ebk nyan mantong udeb, raja hana geutem deungoe
  meunyoe tanyoe ta peugah haba deungon gobnyan. Peue lom jinoenyoe wat\u00e9e aneu\u00ebk
  geuh nyan ka meuninggai donya! Pat tateupeue gobnyan teuma geurajam droe gobnyan
  keudroe!\\\"\\n19 Bak wat\u00e9e Nabi Daud geukalon namiet geuhnyan jimeus\u00e1ih-s\u00e1ih,
  sada kheueh gobnyan bahwa aneu\u00ebk geuh nyan ka meuninggai donya. Laju geutanyong
  ubak awaknyan, \\\"Peu kheueh aneu\u00ebk nyan ka meuninggai?\\\" \\\"Ka Teungku
  Amphon,\\\" jaweueb awaknyan.\\n20 Dan geubeud\u00f4h kheueh laju Nabi Daud nibak
  aleue teumpat geu-\u00e9h nyan, laju geujak bakmon geumanoe \u00f3h lheueh nyan
  geusugot ngon \u00f4k, dan geutuka peukayan. \u00d3h lheuehnyan geubeud\u00f4h geujak
  laju meui\u00e9badat u Ba\u00e9t TUHAN. \u00d3h lheueh nyan gobnyan geuwoe laju
  ubak meuligoe, dan geulak\u00e9e laju hidangan bu keuneuk makheun l\u00e9 gobnyan,
  dan laju geu makheun.\\n21 \u00d3h ban jingieng nyang lag\u00e9e nyan bagoe, l\u00e9
  namiet Nabi Daud laju jitanyong ubak gobnyan, \\\"Kamoe banmandum nyoe hana muphom,
  ya Teungku Amphon. Bak wat\u00e9e aneu\u00ebk nyan mantong udeb, Teungku Amphon
  neupuasa dan neupeuba-e aneu\u00ebk nyan, teuma \u00f3h ka lheueh aneu\u00ebk nyan
  meuninggai, Teungku Amphon neubeud\u00f4h laju neu pajoh bu!\\\"\\n22 \\\"Nyoe,
  beut\u00f4i,\\\" geujaweueb Nabi Daud, \\\"Keubiet ul\u00f4n meupuasa dan ul\u00f4n
  moe bak wat\u00e9e aneu\u00ebk nyan mantong udeb dan teuma ul\u00f4n pike: Mungken
  TUHAN geugas\u00e9h keu ul\u00f4n dan geupeupul\u00e9h aneu\u00ebk nyan nibak peunyak\u00e9t
  jih dan hase udeb lag\u00e9e bak nyang ka.\\n23 Teuma jinoenyoe, \u00f3h ka sah\u00e9eh
  jihnyan ka meuninggai, keupeue guna jih ul\u00f4n nyoe sabe l\u00f4n puasa? Peu
  kheueh aneu\u00ebk nyan hase ul\u00f4n peu udeb lom teuma? Bak saboh wat\u00e9e
  teuma ul\u00f4n pih l\u00f4n jak cit ubak teumpat aneu\u00ebk l\u00f4n nyan jijak,
  teuma jinoenyoe jihnyan hana jiwoe le ubak ul\u00f4n.\\\"\\n24 \u00d3h lheuehnyan
  Nabi Daud geupeu mangat lom at\u00e9 ureu\u00ebng inong gobnyan si Batsyeba, \u00f3h
  lheuehnyan laju geujak \u00e9h ngon binoe geuh nyan. Batsyeba laju geupeulah\u00e9
  lom sidroe aneu\u00ebk agam nyang geuboh nan Sulaiman l\u00e9 Nabi Daud. TUHAN that-that
  geugas\u00e9h keu aneu\u00ebk nyan\\n25 dan geuyue Nabi Natan mangat geuboh nan
  aneu\u00ebk nyan ngon nan Yedija, sabab TUHAN geugas\u00e9h keu aneu\u00ebk nyan.\\n26
  Bak wat\u00e9enyan Yoab mantong hibat that teungoh geumeu heuengkoe dalam mideuen
  prang geulawan Raba ma banda nanggroe Amon, dan karab geureubot banda nyan.\\n27
  Laju gobnyan geukir\u00e9m utosan ubak Nabi Daud sira geupeugah, \\\"Ul\u00f4n ka
  l\u00f4n prang Raba, dan ka ul\u00f4n reubot peuseudiaan i\u00e9 jih.\\n28 Jinoenyoe,
  neutem kheueh Teungku Amphon neupeusapat tantra geutanyoe nyang na mantong tinggai,
  laju neupimp\u00e9n seurangan mangat tapeutaklok banda nyan. Deungon na nyang lag\u00e9e
  nyan teuma hana jikheun bahwa ul\u00f4n nyang reubot banda nyan.\\\"\\n29 Laju Nabi
  Daud geupeusapat banmandum tantra gobnyan, \u00f3h lheuehnyan laju geujak prang
  Raba, geuseureubu dan laju teuma geupeutaklok.\\n30 Nabi Daud laju geucok mahkota
  di ateueh ul\u00e9e raja awaknyan dan atra nyan laju geungui keudroe di ateueh ul\u00e9e
  gobnyan. Mahkotanyan na brat jih kira-kira 35 kilogram dan meutahta deungon peumata
  nyang lumpah ceudah. Meunan cit Nabi Daud geuba nibak teumpatnyan lumpah jai barang
  rampasan.\\n31 Seula\u00e9n nibaknyan peunduduek banda nyan laju geuparoih, dan
  geuyue bak awaknyan mangat jiba gogajo, cangkoi beuso, dan pato beuso dan awaknyan
  laju geuyue meukeureuja nibak teumpat peug\u00e9t bat\u00e9e bata. Meunan cit hainyan
  geupeubuet u ateueh peunduduek banda-banda Amon nyang la\u00e9n. \u00d3h lheueh
  nyan Nabi Daud dan banmandum tantra gobnyan geuwoe lom u Yerusalem.\\nChapter 13\\n1
  Absalom aneu\u00ebk agam Nabi Daud na sidroe adoe jih nyang inong, aneu\u00ebk dara
  nyan cukob lagak, nan jih Tamar. Amnon aneu\u00ebk agam Nabi Daud nibak peurumoh
  nyang la\u00e9n ka teuma rhot cinta keu si Tamar nyan,\\n2 dan ka meuheuet that
  jikeuneuk \u00e9h meusajan si dara nyan. Teuma hainyan mustah\u00e9 hase teujadi
  sabab si Tamar nyan gohlom jimeukawen dan hana jeuet teuma jimeurakan deungon aneu\u00ebk
  agam. Amnon hana pi\u00f4h-pi\u00f4h jipike keuhai nyan sampoe jihnyan rhot keu
  sak\u00e9t.\\n3 Amnon na teuma sidroe rakan nyang lumpah lisek, nan rakan jih nyan
  Yonadab aneu\u00ebk Simea aduen Nabi Daud.\\n4 Yonadab jipeugah ubak Amnon, \\\"Hai
  Teungku Pangeran, pakon tieb-tieb uroe ul\u00f4n ngieng droeneueh seudeh that? Peue
  nyang ka teujadi u ateueh droeneueh?\\\" Jijaweueb l\u00e9 Amnon, \\\"Ul\u00f4n
  ka rhot cinta ubak Tamar, adoe si Absalom syedara ul\u00f4n nyan.\\\"\\n5 Laju jipeugah
  l\u00e9 Yonadab ubak gobnyan, \\\"Oh, meunyoe hainyan mudah that hai teungku pangeran!
  Neujak \u00e9h kheueh laju u ateueh tika, dan neupeug\u00e9t kheueh droeneueh sang-sang
  teungoh sak\u00e9t. Meunyoe bapak droeneueh teuka dan geujak ngieng droeneueh, dan
  neupeugah laju ubak gobnyan, ''Bapak, neupeu idhin kheueh si Tamar jijak kalon ul\u00f4n
  sira ji peuhidang bu keu ul\u00f4n. Meunyoe ul\u00f4n hase ul\u00f4n ngieng si Tamar
  nyan teungoh jitaguen bu keu ul\u00f4n disinoe, ul\u00f4n ka hase l\u00f4n pajoh
  bu.'' \\\"\\n6 \u00d3h lheueh nyan si Amnon laju jijak \u00e9h di teumpat \u00e9h
  pura-pura gobnyan lam keuadaan sak\u00e9t. Bak wat\u00e9e Raja Nabi Daud bapak gobnyan
  teuka geujak kalon, Amnon laju jipeugah ubak bapak jih nyan, \\\"Bapak, neupeu idhin
  kheueh si Tamar jijak keunoe mangat jipeug\u00e9t juadah dikeue ul\u00f4n disinoe;
  meunyoe nyan ka lheueh jipeumasak mungken ul\u00f4n ka ek ul\u00f4n makheun.\\\"\\n7
  \u00d3h lheueh nyan Nabi Daud laju geukir\u00e9m peusan ubak si Tamar nyang na di
  dalam meuligoe, geupeugah lag\u00e9e nyoe, \\\"Tajak kheueh laju u rumoh aduen gata
  si Amnon, dan tapeug\u00e9t kheueh laju peunajoh keu jihnyan.\\\"\\n8 \u00d3h ban
  jideungoe nyang lag\u00e9e nyan si Tamar laju jijak u rumoh aduen jih nyan dan deuh
  laju jikalon aduen jih si Amnon mantong teubalek nibak teumpat \u00e9h. Tamar jicok
  laju bacut teup\u00f4ng dan dikeue aduen jih nyan jipeug\u00e9t laju kue juadah
  dan laju jitot ngon jipanggang di ateueh ngeue apui.\\n9 \u00d3h ka lheueh nyan
  jipeuteubiet laju juadah nyan didalam panci dan jibri ngon geupeuhidang laju ukeue
  aduen jih si Amnon nyan. Teuma Amnon hana jitem pajoh juadah nyan. Gobnyan jipeugah,
  \\\"Tayue teubiet laju banmandum ureu\u00ebng nyang na didalam kama nyoe!\\\"\\n10
  \u00d3h ka lheueh banmandum ureu\u00ebng jiteubiet nibak kama nyan, jipeugah kheueh
  l\u00e9 Amnon ubak si Tamar, \\\"Taba kheueh laju banmandum juadah nyan keunoe,
  ubak teumpat ul\u00f4n \u00e9h nyoe, dan gata suleueng kheueh u dalam babah ul\u00f4n!\\\"
  Tamar jiturot peue nyang jiyue nyan.\\n11 Teuma bak wat\u00e9e Tamar jisunyueng
  juadah nyan u dalam babah Amnon, Amnon laju jimat aneu\u00ebk dara nyan sira jipeugah,
  \\\"Adoe meutuah, keunoe gata \u00e9h meusapat ngon ul\u00f4n!\\\"\\n12 \\\"Ah,
  b\u00e9k hai aduen meutuah!\\\" jaweueb aneu\u00ebk dara nyan. \\\"B\u00e9k neupaksa
  ul\u00f4n tapeubuet buet nyang hina nyan! Hai nyang lag\u00e9e nyan h\u00e1ntom
  na teupeubuet di Israel.\\n13 Meunyoe teujadi nyang lag\u00e9e nyan, ho ul\u00f4n
  nyoe har\u00f4h ul\u00f4n s\u00f6m jumoh ul\u00f4n? Meunan cit deungon droeneueh
  hai aduen teuma jihina l\u00e9 gob di nanggroe Israel nyoe. Nyang seug\u00e9t jih
  hainyan neujak mariet kheueh ubak raja, ka pasti raja teuma situju ul\u00f4n nyoe
  jeuet keu ureu\u00ebng binoe droeneueh.\\\"\\n14 Teuma Amnon hana jitem deungoe
  peue nyang jipeugah l\u00e9 si Tamar nyan, dan sabab Amnon nyan leubeh teuga, jipaksa
  laju adoe jih nyan deungon cara gasa, laju jipeukosa adoe jih si Tamar nyan.\\n15
  Teuma \u00f3h ka lheueh jipeukosa nyan deungon hana teusangka-sangka Amnon ka teuka
  banci keu adoe jih nyan dan hana tanggong-tanggong, leubeh rayeuk banci jih nibak
  cinta jihnyan yoh awaiphon. L\u00e9 jihnyan laju jipeugah ubak adoe jih nyan, \\\"Jak
  teubiet keudeh!\\\"\\n16 Tamar jipeugah, \\\"Ah, pakon jeuet keumeunan aduen? Meunyoe
  ul\u00f4n neu-use, keujeuhetan nyan leubeh rayeuk nibak hai nyang ka lheueh neupeubuet
  bunoe!\\\" Teuma si Amnon hana jitem deungoe peue nyang jipeugah l\u00e9 Tamar nyan.\\n17
  Amnon laju geuh\u00f4i peulayan pribadi jih sira jipeugah, \\\"Gata peuteubiet laju
  ureu\u00ebng inong nyoe uluwa, dan tagunci laju pintoe!\\\"\\n18 L\u00e9 peulayan
  nyan laju jiturot peue nyang ka jiyue l\u00e9 Amnon nyan. Peukayan si Tamar na kheueh
  baj\u00e9e jubah panyang meujaroe panyang. Nibak jam\u00e9n nyan putroe-putroe nyang
  gohlom jimeukawen lazem jih jingui peukayan nyang lag\u00e9e nyan.\\n19 L\u00e9
  Tamar laju jisipreuk ab\u00e9e u ateueh ul\u00e9e droe jih, jipriek baj\u00e9e jubah
  jih, dan jijak laju sira jit\u00f4b muka jih deungon bandua blaih jaroe sira jimo
  musok-musok ngon at\u00e9 nyang roga.\\n20 Bak wat\u00e9e Absalom jikalon aduen
  jih nyan, teuma jitanyong kheueh l\u00e9 jihnyan ubak Tamar nyan, \\\"Peu kheueh
  si Amnon bunoe ka ji-iengkeue keuhormatan gata? Ka kheueh adoe meutuah, b\u00e9k
  tapike le hainyan. Bukon kheueh jihnyan aduen gata, dan b\u00e9k kheueh hainyan
  gata peugah ubak soe mantong.\\\" Bak wat\u00e9e nyan cit teuma Tamar jipeuas\u00e9ng
  droe jih di rumoh Absalom, dan jih nyan g\u00e9t that seudeh lom ngon seungue hana
  meurakan.\\n21 Raja Nabi Daud laju geudeungoe hai nyang lag\u00e9e nyan, dan gobnyan
  g\u00e9t that beung\u00e9h.\\n22 Absalom that-that jitroih dam keu Amnon dan hana
  jitem le peugah haba deungon jihnyan sabab jihnyan ka jipeukosa adoe jih si Tamar.\\n23
  Dua thon teuma \u00f3h ka lheueh nyan Absalom laju jipeuna khanuri teugunteng pita
  bul\u00e9e bubiri di Baal-Hazor, tou ngon banda Efraim, dan l\u00e9 gobnyan laju
  jiundang banmandum aneu\u00ebk raja nyang agam.\\n24 Gobnyan jijak laju meuhadab
  ubak Bapak geuh Raja Nabi Daud dan jipeugah, \\\"Bapak, ul\u00f4n keuneuk peuna
  khanuri teugunteng bul\u00e9e bubiri. Ul\u00f4n that-that meuharab Bapak pi neutem
  teuka ubak khanuri ul\u00f4n nyan meunan cit deungon ureu\u00ebng-ureu\u00ebng rayeuk
  nyang na di dalam meuligoe.\\\"\\n25 Teuma geujaweueb l\u00e9 raja, \\\"B\u00e9k,
  hai aneu\u00ebk meutuah, sabab jih meunyoe kamoe nyoe banmandum kamoe jak keunan
  beuareuti kamoe nyoe ka kamoe peusosah gata.\\\" Teuma di Absalom hana geutem sabe
  jipaksa pakriban mantong bapak jih nyan geutem teuka ubak teumpat khanuri nyang
  jipeugot nyan, teuma bapak jih nyan teutab cit hana geutem. Gobnyan teuma geubri
  idhin mantong ubak aneu\u00ebk geuh nyan.\\n26 Laju jipeugah kheueh l\u00e9 Absalom,
  \\\"Meunyoe meunan, neupeu idhin kheueh syedara ul\u00f4n si Amnon jiseut\u00f4t
  deungon kamoe.\\\" Geupeugah l\u00e9 raja, \\\"B\u00e9k kheueh jihnyan gata peurhoh
  sajan gata.\\\"\\n27 Teuma sabab Absalom hana jipi\u00f4h jideusak ngon jipaksa
  ureu\u00ebng syiek jih nyan, bak akh\u00e9 jih Nabi Daud laju geubri idhin Amnon
  dan banmandum aneu\u00ebk agam geuh nyang la\u00e9n jimeusajan jiseut\u00f4t meusapat
  deungon Absalom. Laju Absalom jipeu-idang peunajoh nyang lumpah meuw\u00e1h.\\n28
  Gobnyan laju jibri peurintah ubak bubena namiet jih, \\\"Gata deungoe kheueh nyoe
  beug\u00e9t-g\u00e9t, meunyoe Amnon ka mab\u00f6k sabab jijieb i\u00e9 angg\u00f4,
  ul\u00f4n teuma l\u00f4n bri aba-aba, laju gata poh mat\u00e9 jih nyan. B\u00e9k
  gata takot. Ul\u00f4n nyang meutanggong jaweueb ateueh hai nyan. Gata meubuet kheueh
  deungon beuh\u00e9 dan b\u00e9k ragu-ragu!\\\"\\n29 Bubena namiet nyan laju jipeubuet
  peue nyang ka jipeurintah l\u00e9 Absalom, laju awaknyan jipoh mat\u00e9 Amnon.
  Ban jikalon peue nyang ka teujadi nyan bubena aneu\u00ebk agam Nabi Daud nyang la\u00e9n
  laju ji-\u00e9k u ateueh bagal jihnyan mas\u00e9ng-mas\u00e9ng dan laju jipeuplueng
  droe.\\n30 Teungoh awaknyan mantong nibak rot ueh teungoh jiwoe, na ureu\u00ebng
  la\u00e9n laju jijak peugah ubak Nabi Daud, \\\"Absalom ka jipoh mat\u00e9 banmandum
  aneu\u00ebk agam Teungku Raja -- hana meusidroe pi nyang na udeb!\\\"\\n31 Raja
  geubeud\u00f4h nibak teumpat duek, laju geupriek peukayan nyang meuleukek nibak
  tuboh geuh sabab that-that seudeh, dan geupeureubah laju droe gobnyan u ateueh aleue.
  Meunan cit banmandum peugaw\u00e9e gobnyan jipeureubah droe jih u ateueh aleue.\\n32
  Teuma Yonadab aneu\u00ebk Simea aduen Nabi Daud jipeugah, \\\"Teungku Amphon, b\u00e9k
  neugundah dan b\u00e9k teuma neupike bahwa banmandum aneu\u00ebk agam teungku Amphon
  ka mat\u00e9. Teuma na kheueh Amnon mantong nyang mat\u00e9, sabab ka jeulaih nyan
  kheueh nyang jilak\u00e9e l\u00e9 Absalom yoh phon Tamar adoe geuhnyan jipeukosa
  l\u00e9 Amnon.\\n33 Jadi b\u00e9k kheueh neupateh bahwa banmandum aneu\u00ebk Teungku
  Amphon ka meuninggai donya, lag\u00e9e nyang ka ul\u00f4n peugah bunoe nyang mat\u00e9
  na kheueh Amnon sidroe kong.\\\"\\n34 Dan bak wat\u00e9e nyan cit teuma Absalom
  ka jipeuplueng droe geuh. Ureu\u00ebng jaga meuligoe Nabi Daud deuh jikalon bahwa
  ram\u00e9 that ureu\u00ebng teungoh jitreun di ateueh gunong nibak Horonaim. Dan
  jijak peugah kheueh hainyan ubak raja.\\n35 Dan Yonadab pih laju geupeugah ubak
  Nabi Daud, \\\"Nyang kheueh bubena aneu\u00ebk agam Teungku Raja! Beut\u00f4i lag\u00e9e
  nyang ka ul\u00f4n peugah bunoe.\\\"\\n36 Banmantong gobnyan seuleusoe geupeugah
  haba, jitamong kheueh laju bubena aneu\u00ebk agam Nabi Daud nyan u dalam ruweueng
  meuligoe. Awaknyan ka jipeuphon mo, dan Nabi Daud meunan cit deungon banmandum namiet
  gobnyan ka geumo ba-e sabab seudeh.\\n37 Absalom laju jijak peuas\u00e9ng droe ubak
  meuligoe raja Gesur, na kheueh Talmai aneu\u00ebk Amihur. Gobnyan tinggai disinan
  treb jih lh\u00e9e thon. Treb that Nabi Daud geumeukabong keu Amnon,\\n39 teuma
  bak wat\u00e9e Nabi Daud hana meuseudeh at\u00e9 le, gobnyan pih ka teuma teuingat
  that-that ngon meucen that-that keu Absalom.\\nChapter 14\\n1 Yoab geuteupeue bahwa
  Raja Nabi Daud g\u00e9t that geumeuc\u00e9n keu Absalom,\\n2 l\u00e9 sababnyan gobnyan
  geuyue jak tueng baksidroe ureu\u00ebng inong nyang lisek nyang na tinggai di Tekoa.
  Bak wat\u00e9e ureu\u00ebng inong nyan ka trok, Yoab laju geupeugah ubak ureu\u00ebng
  inong nyan, \\\"Droeneueh mak har\u00f4h kheueh pura-pura neumeukabong ngon at\u00e9
  nyang roga; neungui kheueh laju peukayan meukabong, dan b\u00e9k neungui miny\u00e9uk
  mangat b\u00e9e. Neupeujeuet kheueh droeneueh lag\u00e9e ureu\u00ebng inong nyang
  ka lumpah treb jipeumo ngon jipeuba-e ureu\u00ebng nyang ka mat\u00e9 nyang g\u00e9t
  that jicinta.\\n3 \u00d3h lheueh nyan tajak kheueh laju meuhadab ubak raja, tapeugah
  laju ubak gobnyan lag\u00e9e nyoe,\\\" Laju Yoab geupeugah ubak inong nyan peue
  nyang har\u00f4h jipeugah.\\n4 Laju di ureu\u00ebng inong nyan jimeuhadab ubak raja,
  sira jitukui ngon jiseumah jipeugah laju lag\u00e9e nyoe, \\\"Teungku Amphon Nyang
  Mulia, neutul\u00f4ng kheueh ul\u00f4n nyoe!\\\"\\n5 \\\"Peue hai?\\\" geutanyong
  l\u00e9 raja ubak ureu\u00ebng inong nyan. Ureu\u00ebng inong nyan geujaweueb \\\"Ul\u00f4n
  nyoe sidroe ureu\u00ebng inong bal\u00e9e nyang lumpah gasien. Lakoe ul\u00f4n ka
  meuninggai donya.\\n6 Ul\u00f4n na dua droe aneu\u00ebk agam, dan bak siuroe awaknyan
  jimeudakwa di dalam blang. Sabab hana ureu\u00ebng nyang peugla, laju sidroe lamkawan
  aneu\u00ebk ul\u00f4n nyan ka mat\u00e9 teupoh.\\n7 Dan jinoenyoe, banmandum kaw\u00f6m
  keuluwarga ul\u00f4n ka jipeumusoh ul\u00f4n dan jituntot ubak ul\u00f4n mangat
  ul\u00f4n jok aneu\u00ebk ul\u00f4n nyang ka jipoh mat\u00e9 nyan keu awaknyan,
  mangat awaknyan jihuk\u00f6m teuma aneu\u00ebk ul\u00f4n nyan deungon huk\u00f6man
  mat\u00e9, sabab jihnyan ka jipoh mat\u00e9 syedara jih. Meunyoe ul\u00f4n jok aneu\u00ebk
  nyan, tinggai kheueh ul\u00f4n sidroe mantong. Awaknyan jipeuhanco harapan ul\u00f4n
  nyang kheueh sidroe teuk dan hana jitinggai meusidroe pih aneu\u00ebk agam keu lakoe
  ul\u00f4n mangat jeuet jipeusambong keuturonan gobnyan.\\\"\\n8 \\\"Neujak woe kheueh
  laju,\\\" geupeugah l\u00e9 raja, \\\"teuma ul\u00f4n uroih hai nyan.\\\"\\n9 \\\"Teungku
  Amphon Nyang Mulia,\\\" jipeugah lom l\u00e9 ureu\u00ebng inong nyan, \\\"peue mantong
  nyang Teungku Amphon peubuet, ul\u00f4n dan keuluwarga ul\u00f4n kheueh nyang tanggong
  akibat jih; Teungku Amphon dan keuluwarga Teungku Amphon hana meusalah.\\\"\\n10
  Geujaweueb l\u00e9 raja, \\\"Meunyoe na ureu\u00ebng nyang jiancam gata, gataba
  kheueh ureu\u00ebng nyan ubak ul\u00f4n, teuma \u00f3h lheueh nyan pasti kheueh
  ureu\u00ebng nyan hana ji peukaru le gata.\\\"\\n11 Jipeugah l\u00e9 ureu\u00ebng
  inong nyan, \\\"Neumeudo\u00e1 kheueh Teungku Amphon ubak TUHAN Po teu Allah Teungku
  Amphon, mangat ureu\u00ebng nyang jikeuneuk balaih ateueh keuhai mat\u00e9 aneu\u00ebk
  ul\u00f4n nyan b\u00e9k sampoe jipeubuet buet nyang leubeh rayeuk lom deungon jipoh
  mat\u00e9 aneu\u00ebk ul\u00f4n nyang sidroe teuk nyan.\\\" Geujaweueb l\u00e9 Nabi
  Daud, \\\"Deumi TUHAN nyang udeb, aneu\u00ebk gata nyang na sidroe teuknyan hana
  jipakoe le l\u00e9 awaknyan.\\\"\\n12 Laju jipeugah kheueh l\u00e9 ureu\u00ebng
  inong nyan lom, \\\"Teungku Amphon Nyang Mulia, neupeu idhin kheueh ubak ul\u00f4n
  nyoe ul\u00f4n peugah haba bacut teuk mantong.\\\" \\\"G\u00e9t kheueh,\\\" geujaweueb
  l\u00e9 Raja.\\n13 Kheun ureu\u00ebng inong nyan, \\\"Deungon tutoe haba Amphon
  nyan, Teungku Amphon ka neumeungaku bahwa Teungku keudroe meusalah sabab hana neupeu
  idhin aneu\u00ebk agam Teungku Amphon jiwoe nibak teumpat gobnyan jipeus\u00f6m
  droe. Pakon Teungku Amphon neupeubuet buet nyang salah nyang lag\u00e9e nyan ateueh
  umat Po teu Allah?\\n14 Geutanyoe nyoe banmandum teuma mat\u00e9; geutanyoe manusia
  nyoe na kheueh saban lag\u00e9e i\u00e9 nyang roe ateueh tanoh dan hana meuteum\u00e9
  le i\u00e9 nyan tapeusapat lom teuma. Dan meunan cit Po teu Allah pih hana teuma
  geupeu udeb ureu\u00ebng nyang ka mat\u00e9; l\u00e9 sabab nyan bah kheueh Teungku
  Amphon neu-useuha ureu\u00ebng nyang ka teub\u00f6ih sampoe ji\u00f4h nyan hase
  jiwoe lom teuma.\\n15 Ul\u00f4n nyoe l\u00f4njak meuhadab ubak Teungku Amphon sabab
  ul\u00f4n jiancam l\u00e9 gob. Laju teupike l\u00e9 ul\u00f4n nyang sigot jih hainyoe
  ul\u00f4n jak meuhadab ubak Teungku Amphon sira ul\u00f4n peugah haba deungon peunoh
  harab peue nyang ul\u00f4n lak\u00e9enyoe Teungku Amphon peutrok.\\n16 Ul\u00f4n
  pike Teungku Amphon teuma neudeungoe dan neupeuseulamat ul\u00f4n nibak ureu\u00ebng
  nyang jiuseuha jikeuneuk poh ul\u00f4n dan meunan cit aneu\u00ebk ul\u00f4n. Awaknyan
  jimeuniet keuneuk jikireuh kamoe nibak tanoh nyang geubri l\u00e9 Po teu Allah keu
  umat Gobnyan.\\n17 Ul\u00f4n yak\u00e9n bahwa janji Teungku Amphon nyan teuma teujamin
  teupeuseulamat ul\u00f4n sabab Teungku Amphon na kheueh lag\u00e9e Malaikat Allah,
  nyang hase teupeubeda peue nyang g\u00e9t dan peue teuma nyang jeuhet. Seumoga TUHAN
  Po teu Allah Teungku Amphon sabe na meusajan Teungku Amphon!\\\"\\n18 Geujaweueb
  l\u00e9 Raja Nabi Daud, \\\"Ul\u00f4n teumanyong sisuatu ubak gata, tajaweueb kheueh
  deungon jujoe.\\\" \\\"Silahkan Teungku Amphon neupeugah haba,\\\" jijaweueb l\u00e9
  ureu\u00ebng inong nyan.\\n19 Kheun Raja, \\\"Peu kheueh Yoab nyang yue gata?\\\"
  Jaweueb ureu\u00ebng inong nyan, \\\"Deumi nyaw\u00f6ng Teungku Amphon, ul\u00f4n
  hana mungken ul\u00f4n peu asek ul\u00e9e nibak peue nyang ka Teungku Amphon tanyong.
  Beut\u00f4i that Teungku Amphon, Yoab ka geupeugah ubak ul\u00f4n peue nyang har\u00f4h
  ul\u00f4n peubuet dan ul\u00f4n peugah.\\n20 Teuma gobnyan geupeugah meunan na kheueh
  keu keuneuk peuseuleusoe peukara nyan deungon jroh-jroh. Teungku Amphon na kheueh
  ureu\u00ebng bijak sana lag\u00e9e Malaikat Allah sampoe neuteupeue banmandum peue
  nyang teuma teujadi.\\\"\\n21 \u00d3h lheueh nyan Raja Nabi Daud nyan laju geuh\u00f4i
  Yoab dan geupeugah ubak gobnyan, \\\"Meukeusut at\u00e9 gata nyan teuma ul\u00f4n
  peupeunoh. Tajak kheueh laju tajaktueng Absalom dan taba kheueh laju jihnyan keunoe
  ubak ul\u00f4n.\\\"\\n22 Yoab laju geusujut dikeue Nabi Daud, dan geupeugah, \\\"Kira
  jih Po teu Allah geubri beureukat ubak Teungku Amphon! Jinoenyoe ka ul\u00f4n teupeue
  bahwa Teungku Amphon neuteurimong ul\u00f4n kareuna Teungku Amphon ka neuteurimong
  peue nyang ul\u00f4n lak\u00e9e.\\\"\\n23 Laju geubeurangkat kheueh Yoab u Gesur
  keu geujak tueng Absalom geupeuwoe lom u Yerusalem.\\n24 Teuma Raja Nabi Daud nyan
  hana geupeu idhin aneu\u00ebk geuh Absalom nyan tinggai didalam meuligoe. \\\"Ul\u00f4n
  hana l\u00f4n tem ngieng jih nyan,\\\" geupeugah l\u00e9 Raja Nabi Daud. L\u00e9
  sababnyan Absalom langsong jiwoe u rumoh droe geuhnyan, dan hana jimeuhadab ubak
  raja.\\n25 Absalom jipujo l\u00e9 gob sibagoe ureu\u00ebng nyang paleng gagah bansaboh
  nanggroe Israel. Hanale ureu\u00ebng nyang paleng ceudah seula\u00e9n nibak gobnyan.
  Phon nibak tapak gaki trok ubak ujong \u00f4k hana mubacut pih na meucupa.\\n26
  \u00d4k gobnyan teubai ngon patah manyang, dan \u00f4k geuh nyan har\u00f4h geugunteng
  seun sithon sigoe sabab han \u00e9k geupeuteun sabab brat. \u00d4k nyang ka geu
  gunteng nyan na brat jih dua kilo gram leubeh nyan meunurot timbangan raja.\\n27
  Absalom na geumeu aneu\u00ebk lh\u00e9e droe aneu\u00ebk agam dan sidroe aneu\u00ebk
  inong nyang lumpah that lagak dan jiboh nan Tamar.\\n28 Ka na dua thon Absalom tinggai
  di Yerusalem, teuma gohlom cit gobnyan meurumpok deungon raja.\\n29 L\u00e9 sababnyan
  bak siuroe gobnyan geuh\u00f4i Yoab, keu geuyue ureu\u00ebng nyan jijak meuhadab
  ubak raja, teuma Yoab hana geutem teuka, Absalom laju jih\u00f4i gobnyan sigoteuk,
  teuma meunan cit Yoab hana cit jitem teuka.\\n30 \u00d3h lheueh nyan jipeugah kheueh
  l\u00e9 Absalom ubak namiet gobnyan, \\\"Gata tateupeue lamp\u00f4h si Yoab na di
  siblaih lamp\u00f4h ul\u00f4n nyang ka jipula deungon bak jelai? Gata tot kheueh
  lamp\u00f4h jih nyan.\\\" Dan awaknyan pih laju jijak tot lamp\u00f4h nyan.\\n31
  Teuma Yoab laju geujak u rumoh Absalom sira geutanyong, \\\"Pakon namiet-namiet
  droeneueh jijak tot lamp\u00f4h ul\u00f4n?\\\"\\n32 Jijaweueb l\u00e9 Absalom, \\\"Sabab
  gata hana tatem teuka bak ul\u00f4n wat\u00e9e ul\u00f4n h\u00f4i. Ul\u00f4n keuneuk
  yue gata jak meuhadab ubak raja dan gata peusampoe peue nyang ul\u00f4n tanyong
  nyoe, ''Keupeue guna jih ul\u00f4n tinggai Gesur dan ul\u00f4n tinggai disinoe?
  Leubeh g\u00e9t ul\u00f4n tinggai mantong disideh.'' \\\" Dan jipeugah l\u00e9 Absalom
  lom teuma, \\\"Gata useuha kheueh mangat ul\u00f4n hase l\u00f4n jak meuhadab ubak
  raja, dan meunyoe ul\u00f4n mantong na geu anggab meusalah, ul\u00f4n rila geu huk\u00f6m
  mat\u00e9.\\\"\\n33 \u00d3h lheueh nyan geujak kheueh laju Yoab jak meuhadab ubak
  Raja Nabi Daud dan geupeusampoe laju peumohonan Absalom. Laju Raja geuh\u00f4i Absalom,
  dan Absalom pih teuka laju jisujut dikeue raja. Dan raja pih geusambot gobnyan deungon
  cara geucom.\\nChapter 15\\n1 \u00d3h ka lheueh nyan Absalom jikeubah laju keu droe
  jih saboh geuritan prang meunan cit deungon guda dan na limong ploh droe peungir\u00e9ng
  gobnyan.\\n2 Tieb-tieb uroe Absalom jibeud\u00f4h nibak teumpat \u00e9h beungoh-beungoh
  that dan laju jijakdong nibak bin\u00e9h jalan t\u00f4 ngon pintoe geureubang meuligoe.
  Soe mantong ureu\u00ebng nyang jikeuneuk meungadu keuhai peukara jih ubak raja,
  laju jih\u00f4i ngon jitanyong l\u00e9 Absalom nyan, jipeugah lag\u00e9e nyoe, \\\"Gata
  nyoe nibak suk\u00e9e toih?\\\" Dan meunyoe ureu\u00ebng nyang jitanyong nyan jijaweueb,
  \\\"Nibak suk\u00e9e nyoe atawa j\u00e9h,\\\"\\n3 teuma Absalom laju jipeugah, \\\"Meunurot
  huk\u00f6m, gata beuna, teuma sayang hana waki raja nyang geutem deungoe peue nyang
  gata gadu nyan.\\\"\\n4 Laju jipeugah lom l\u00e9 ureu\u00ebng nyan, \\\"Cuba, meunyoe
  ul\u00f4n nyang jeuet keu hak\u00e9m, soe mantong ureu\u00ebng nyang na seungketa
  atawa tuntotan ureu\u00ebng nyan jeuet jijak ubak ul\u00f4n dan ul\u00f4n peusaneut
  ureu\u00ebng nyan deungon ade.\\\"\\n5 Meunyoe na ureu\u00ebng nyang jipeutou ubak
  Absalom keu jisujut jiseumah gobnyan, laju Absalom jisunyueng jaroe geuhnyan, laju
  di ureu\u00ebng nyan jipeusaneut ngon cara jic\u00f6m.\\n6 Meunan kheueh sikeub
  Absalom keu soe mantong ureu\u00ebng Israel nyang keuneuk jak peugah keuhai peukara
  jih ubak raja, dan deungon na lag\u00e9e nyan Absalom ka jicok at\u00e9 ureu\u00ebng
  Israel.\\n7 \u00d3h kana peuet thon teuma \u00f3h lheueh nyan, Absalom jipeugah
  ubak Raja Nabi Daud, \\\"Bapak, neupeu idhin kheueh ul\u00f4n jak u Hebron keu ul\u00f4n
  jak peuteupat janji ul\u00f4n ubak TUHAN.\\n8 Sabab yoh ul\u00f4n mantong tinggai
  di Gesur nanggroe Siria, ul\u00f4n ka lheueh ul\u00f4n meujanji teuma ul\u00f4n
  jak meu i\u00e9badat ubak TUHAN di Hebron meunyoe gobnyan ka geupeu idhin ul\u00f4n
  woe u Yerusalem.\\\"\\n9 Geujaweueb l\u00e9 raja, \\\"Gata jak kheueh deungon seulamat.\\\"
  Dan jibeurangkat kheueh Absalom u Hebron.\\n10 Teuma sigohlom nyan gobnyan ka geukir\u00e9m
  utosan-utosan geuh ubak bubena suk\u00e9e Israel sira jiba peusan nyang lag\u00e9e
  nyoe, \\\"Meunyoe gata ka tadeungoe su beureuguih, gata kuk kheueh laju, ''Absalom
  ka jeuet keuraja di nanggroe Hebron!'' \\\"\\n11 Nibak Yerusalem na ureu\u00ebng
  dua reutoih droe nyang ji-ir\u00e9ng Absalom jijak u Hebron. Awaknyan hana jiteupeu
  sapeue keuhai komplotan nyan dan awaknyan banmandum jijak deungon teunang deungon
  hana curiga meubacut pi.\\n12 Dan teungoh Absalom jipeuseumah keureubeuen, gobnyan
  geukir\u00e9m cit utosan u banda Gilo mangat geujak h\u00f4i Ahitofel, ureu\u00ebng
  nyan na kheueh sidroe peunaseuhat Nabi Raja Daud. Meunan kheueh komplotan nyang
  keuneuk lawan raja nyan seumaken le ngon teuga, dan meutamah le kheueh peuikot-peuikot
  Absalom.\\n13 \u00d3h lheueh nyan na sidroe ureu\u00ebng jijak ba haba ubak Nabi
  Daud, \\\"Ureu\u00ebng-ureu\u00ebng Israel ka jidong blaih Absalom.\\\"\\n14 Laju
  Nabi Daud geupeugah ubak banmandum peugaw\u00e9e gobnyan nyang na di Yerusalem,
  \\\"Boh jak geutanyoe tajak meungunse, tajak mus\u00f6m u teumpat nyang aman. Nyoe
  na kheueh jalan nyang paleng g\u00e9t mangat geutanyoe teuhenda nibak Absalom. Hana
  treb le jih nyan jijak keunoe. Bagaih kheueh, b\u00e9k sampoe geutanyoe jitiyeub
  ngon jipeutaloe, akh\u00e9jih banmandum peunduduek banda nyoe jipoh mat\u00e9!\\\"\\n15
  \\\"Get, Teungku Amphon,\\\" jaweueb awaknyan. \\\"Kamoe ka siab kamoe peubuet peue
  mantong nyang Teungku Amphon peugah.\\\"\\n16 Dan geujak kheueh raja ji-ir\u00e9ng
  l\u00e9 banmandum keuluwarga dan peugaw\u00e9e gobnyan, teuma na siploh droe gundek
  gobnyan nyang geutinggai keu jikeumiet meuligoe.\\n17 Bak wat\u00e9e raja dan banmandum
  peungir\u00e9ng gobnyan teungoh geujak geutinggai banda, awaknyan laju geupi\u00f4h
  hek dan to that ngon rumoh nyang keuneuleueh.\\n18 Banmandum peugaw\u00e9e raja
  jidong blaih gobnyan bak wat\u00e9e pasokan peungawai raja meuriti jijak rot keu
  gobnyan. Meunan cit deungon nam reutoih droe tantra nyang ka jiseut\u00f4t gobnyan
  yoh phon di Gat, awaknyan pih meubar\u00e9h dikeue gobnyan.\\n19 Ban geungieng nyang
  lag\u00e9e nyan l\u00e9 raja laju geupeugah ubak Itai nyang jeuet keu keumeundan
  pasokan nyang nam reutoih droe nyan, \\\"Pakon gata nyoe banmandum taseut\u00f4t
  cit meusajan deungon kamoe? Leubeh g\u00e9t gata tajak gisa dan tinggai meusajan
  deungon raja nyang bar\u00f4. Bukon kheueh gatanyoe ureu\u00ebng as\u00e9ng, peungungs\u00e9
  nyang ji\u00f4h that nibak nanggroe gata keudroe?\\n20 Gohlom treb gata tinggai
  disinoe, ek kheueh gata ul\u00f4n yue jak seut\u00f4t tameungeumbara deungon ul\u00f4n?
  Ul\u00f4n keudroe hana l\u00f4n teupeue ho nyang har\u00f4h ul\u00f4n jak. Tajakwoe
  kheueh, dan taba kheueh sajan rakan-rakan gata nyang saboh bansa, seumoga TUHAN
  geugas\u00e9h keu gata dan seutia ubak gata.\\\"\\n21 Teuma l\u00e9 Itai jijaweueb,
  \\\"Amphon Deulat Tuanku Nyang Mulia, deumi TUHAN nyang udeb dan deumi nyaw\u00f6ng
  Teungku Amphon, ho mantong kheueh Teungku Amphon neujak, ul\u00f4n teutab l\u00f4n
  seut\u00f4t, bahpi nyang teupeukeue nyan na kheueh mat\u00e9.\\\"\\n22 \\\"Get kheueh,
  meunyoe meunan!\\\" geujaweueb l\u00e9 Nabi Daud, \\\"Tajak kheueh laju!\\\" Teuma
  jijak kheueh laju Itai meusajan deungon banmandum pasokan jih meunan cit deungon
  keuluwarga awaknyan.\\n23 Banmandum rakyat jikliek ngon jimo ba-e bak wat\u00e9e
  pasokan Nabi Daud geutinggai banda. \u00d3h lheueh nyan raja laju geujeumeurang
  Krueng Kidron meunan cit jiseut\u00f4t mandum l\u00e9 pasokan gobnyan, laju jijak
  kheueh awaknyan meulalu padang pasi.\\n24 Teungku Imeum Zadok dan Teungku Imeum
  Abyatar na lamkawan nyan meunan cit deungon banmandum ureu\u00ebng Lewi nyang ba
  Peuto Peujanjian TUHAN. Peuto Peujanjian nyan laju jikeubah, dan hana jibeu\u00f4t
  sigohlom banmandum rakyat jitinggai banda nyan.\\n25 Dan geupeugah kheueh l\u00e9
  raja ubak Zadok, \\\"Gata peuriwang kheueh Peuto Peujanjian TUHAN nyan u dalam banda.
  Meunyoe TUHAN geutueng keu ul\u00f4n, teunt\u00e9e kheueh Gobnyan geupeu idhin keu
  ul\u00f4n mangat jeuet lom l\u00f4n woe keunoe dan l\u00f4n teupeungieng Peuto Peujanjian
  nyan meunan cit meuteum\u00e9 ul\u00f4n kalon teumpat tinggai jih.\\n26 Teuma meunyoe
  TUHAN hana geutueng keu ul\u00f4n, teuseurah kheueh mantong ubak TUHAN peue nyang
  geukeuneuk peubuet ateueh ul\u00f4n nyoe!\\\"\\n27 Lheueh nyan geupeugah lom l\u00e9
  raja ubak Zadok, \\\"Gata pakat kheueh Ahimaas aneu\u00ebk gata dan Yonatan aneu\u00ebk
  Abyatar; jakwoe kheueh u dalam banda deungon teunang.\\n28 Ul\u00f4n preh gata nibak
  teumpat jeumeurang krueng t\u00f4 ngon padang pasi sampoe ul\u00f4n teurimong haba
  nibak gata.\\\"\\n29 Laju Zadok dan Abyatar jiba Peuto Peujanjian TUHAN nyan jipeugisa
  u Yerusalem dan awaknyan laju tinggai disinan.\\n30 \u00d3h lheueh nyan Nabi Daud
  laju geusut sipatu geuh. Meunan cit deungon banmandum peungikot-peungikot gobnyan
  jiteungoh laju u ateueh Buk\u00e9t Zaiton sira geumo deungon ul\u00e9e teuth\u00f4b
  tanda ureu\u00ebng teungoh meukabong.\\n31 Bak wat\u00e9e jibrit\u00e9e ubak Nabi
  Daud bahwa Ahitofel na cit meusajan deungon geurombolan Absalom, laju geumeudo\u00e1
  kheueh Nabi Daud lag\u00e9e nyoe, \\\"Ya, TUHAN, neupeubateue kheueh peue nyang
  jinaseuhat l\u00e9 Ahitofel!\\\"\\n32 Bak wat\u00e9e Nabi Daud ka trok ubak pucak
  gunong di teumpat nyang lazem ureu\u00ebng jimeu i\u00e9badat ubak TUHAN, gobnyan
  laju jisambot l\u00e9 rakan geuh nyang seutia, na kheueh Husai ureu\u00ebng Arki.
  Peukayan Husai nyan teupriek dan nibak ul\u00e9e jih nyan teutabu deungon ab\u00e9e.\\n33
  Nabi geupeugah ubak ureu\u00ebng nyan, \\\"Meunyoe gata taseut\u00f4t meusajan deungon
  ul\u00f4n, gata ka jeuet keu beuban nibak ul\u00f4n.\\n34 Teuma gata hase tatul\u00f4ng
  ul\u00f4n, meunyoe gata tawoe u banda dan neupeugah ubak Absalom, bahwa jinoenyoe
  gata keuneuk peutimang jih nyan deungon peunoh seutia, lag\u00e9e ka gata peutimang
  bapak jih yoh wat\u00e9e il\u00e9e. Deungon cara nyang lag\u00e9e nyan gata ka hase
  tapeubateue peue mantong nyang jibri naseuhat l\u00e9 Ahitofel.\\n35 Teungku Imeum
  Zadok dan Abyatar meunan cit na disinan. Tajak peugah kheueh ubak gobnyan peue-peue
  nyang gata deungoe di meuligoe.\\n36 Ahimaas aneu\u00ebk Zadok dan Yonatan aneu\u00ebk
  Abyatar meunan cit awaknyan jiseut\u00f4t bapak droe jih, deungon nyan awaknyan
  kana cit disinan. Aneu\u00ebk-aneu\u00ebk nyan kheueh gata yue teuka ubak ul\u00f4n
  mangat jijak peusampoe peue mantong haba nyang gata deungoe.\\\"\\n37 Teuma jiwoe
  kheueh Husai rakan Nabi Daud nyan u Yerusalem, paih bak wat\u00e9e Absalom trok
  keunan.\\nChapter 16\\n1 Bak wat\u00e9e Nabi Daud ban mantong geuliwat bak pucak
  buk\u00e9t, hana geusangka-sangka teuka kheueh si Ziba namiet si Mefiboset, namiet
  nyan laju jijak ubak gobnyan sira jiba sijudo keuleud\u00e9e nyang na teupeudieng
  di ateueh rhueng keuleud\u00e9e nyan na dua reutoih boh ruti, sireutoih boh tangke
  boh angg\u00f4 nyang ka tho, sireutoih boh karang boh kay\u00e9e nyang mantong jroh
  dan saboh baluem teuma i\u00e9 angg\u00f4.\\n2 Raja Nabi Daud nyan laju geutanyong
  ubak namiet nyan, \\\"Keupeue banmandum atranyoe?\\\" Jijaweueb l\u00e9 Ziba, \\\"Keuleud\u00e9e-keuleud\u00e9e
  nyoe teupeuguna keu beulatang keu ngon peudieng keuluwarga Teungku Amphon, ruti
  dan dumna boh kay\u00e9e nyoe na kheueh keu peulayan-peulayan Teungku Amphon, dan
  nyang i\u00e9 angg\u00f4 nyoe na kheueh keu ureu\u00ebng nyang graih nibakjak di
  padang pasi.\\\"\\n3 Laju geutanyong lom l\u00e9 Raja Nabi Daud nyan ubak ureu\u00ebng
  nyan, \\\"Dipat si Mefiboset cucoe teungku gata si Saul?\\\" \\\"Gobnyan mantong
  na teutab di Yerusalem,\\\" jaweueb Ziba, \\\"sabab gobnyan yak\u00e9n bahwa jinoenyoe
  ureu\u00ebng Israel teuma geujok pulang keurajeuen Saul indatu gobnyan ubak gobnyan.\\\"\\n4
  Laju geupeugah kheueh l\u00e9 raja ubak Ziba, \\\"Jinoenyoe banmandum hareuta mil\u00e9k
  Mefiboset ka jeuet keu hakmil\u00e9k gata.\\\" \\\"Teurimong gas\u00e9h Teungku
  Amphon,\\\" jaweueb Ziba. \\\"Seumoga Teungku Amphon sabe neugas\u00e9h keu ul\u00f4n!\\\"\\n5
  Wat\u00e9e Nabi Daud katrok u Bahurim, teuka kheueh sidroe nibak teumpat nyan, dan
  sira jipeurab ubak kawan raja, gobnyan laju jikutok Nabi Daud. Ureu\u00ebng nyan
  nan jih Simei bin Gera, nibak kaw\u00f6m syedara Saul.\\n6 Simei jigeulawa Nabi
  Daud dan peugaw\u00e9e-peugaw\u00e9e gobnyan deungon aneuk bat\u00e9e, bahpi Nabi
  Daud jipagab ngon jikeulileng l\u00e9 aneu\u00ebk buah gobnyan meunan cit l\u00e9
  dumna peuwira gobnyan.\\n7 Simei jikutok laju Nabi Daud deungon tutoe haba, \\\"Jak
  w\u00e9eh laju keudeh, hai manusia tukang seumupoh mat\u00e9! Droeneueh peunjahat!\\n8
  Droeneueh ka neureupah keurajeuen Saul! Jinoenyoe droeneueh geuhuk\u00f6m l\u00e9
  TUHAN sabab ka neupoh mat\u00e9 nyang lumpah thatle kaw\u00f6m syedara Saul. TUHAN
  ka geubri keurajeuen droeneueh nyoe ubak aneu\u00ebk droeneueh si Absalom. Jinoenyoe
  bawa kireueh kheueh droeneueh, hai manusia tukang poh mat\u00e9!\\\"\\n9 Abisai
  adoe Yoab aneu\u00ebk Zeruya, jipeugah ubak raja, \\\"Pakon Teungku Amphon neupeubiyeu
  ureu\u00ebng peurusak nyan jikutok Teungku Amphon? Neupeu idhin kheueh ubak ul\u00f4n
  mangat l\u00f4njak teubang nibak takue jih nyan!\\\"\\n10 Teuma raja geupeugah ubak
  Abisai dan Yoab aduen jih nyan, \\\"B\u00e9k tapeureumeun keu jih nyan, tapeubiyeu
  mantong jihnyan jikutok ul\u00f4n. Sabab meunyoe TUHAN nyang yue jihnyan, soe kheueh
  ureu\u00ebng nyang na hak jijak tanyong pakon jihnyan jipeubuet lag\u00e9e nyan?\\\"\\n11
  Laju Nabi Daud geupeugah ubak Abisai, dan meunan cit ubak banmandum namiet gobnyan,
  \\\"Aneu\u00ebk i\u00e9 tuleueng ul\u00f4n keudroe jiuseuha jikeuneuk poh mat\u00e9
  ul\u00f4n; pakon teuma gata hireuen takalon pi-e ureu\u00ebng Benyamin nyoe? TUHAN
  kheueh nyang yue jihnyan jikutok ul\u00f4n; l\u00e9 sababnyan b\u00e9k tapeukaru
  jihnyan dan tapeubiyeu mantong ureu\u00ebng nyan jikutok ul\u00f4n.\\n12 Mungken
  TUHAN teuma geupeurati peundeuritaan nyoe dan geubri beureukat ubak ul\u00f4n sibagoe
  geunantoe kutokan nyan.\\\"\\n13 Laju Nabi Daud dan dumna ureu\u00ebng nyang ir\u00e9ng
  gobnyan geujak laju nibak teumpatnyan sira geupeujak laju meuneujak gobnyan, seudangkan
  Simei laju teuma jiseut\u00f4t bagaih-bagaih nibak lereng gunong sira jimeurapa
  ngon jigeulawa gobnyan rotlikot ngon aneuk bat\u00e9e dan ngon tanoh.\\n14 Raja
  ngon aneu\u00ebk buah gobnyan ka h\u00e9k that-that dan laju geupi\u00f4h nibak
  bin\u00e9h Krueng Yordan.\\n15 Bak wat\u00e9e nyan Absalom dan banmandum ureu\u00ebng
  nyang jiseut\u00f4t gobnyan teungoh geujak geutamong u dalam banda Yerusalem, dan
  lamkawan nyan na cit jiseut\u00f4t l\u00e9 Ahitofel.\\n16 Yoh wat\u00e9e Husai rakan
  Nabi Daud nyang seutia nyan meurumpok deungon Absalom, Husai laju jitaw\u00f6k ubak
  Absalom nyan, \\\"Udeb raja! Udeb raja!\\\"\\n17 Teuma Absalom jitanyong ubak jih
  nyan, \\\"Dipat kheueh takeubah keuseutiaan gata teuhadab rakan gata Nabi Daud?
  Pakon gata hana taseut\u00f4t deungon gobnyan?\\\"\\n18 Jijaweueb l\u00e9 Husai,
  \\\"Panena mungken! Ul\u00f4n dong blaih ureu\u00ebng nyang geupil\u00e9h l\u00e9
  TUHAN, l\u00e9 ureu\u00ebng-ureu\u00ebng nyoe, dan l\u00e9 banmandum ureu\u00ebng
  Israel. Ureu\u00ebng nyan kheueh nyang teuma ul\u00f4n seut\u00f4t.\\n19 Lom teuma,
  soe kheueh lom nyang teuma ul\u00f4n peutimang? Bukon kheueh aneu\u00ebk agam Teungku
  Amphon? Lag\u00e9e nyang ka ul\u00f4n peutimang bapak Teungku Amphon, meunan cit
  teuma ul\u00f4n peutimang u ateueh Teungku Amphon nibak sa\u00e1t nyoe.\\\"\\n20
  \u00d3h lheueh nyan Absalom jipeugah ubak Ahitofel, \\\"Gata peugah kheueh laju
  peue nyang har\u00f4h tanyoe peubuet.\\\"\\n21 Jijaweueb l\u00e9 Ahitofel, \\\"Neujak
  kheueh laju ubak gundek-gundek bapak Teungku Amphon nyang ka geutinggai keu jikeumiet
  meuligoe, dan neu-\u00e9h kheueh deungon gundek nyan. Bansaboh Israel teuma jiteupeu
  bahwa deungon na Teungku Amphon peubuet nyang lag\u00e9e nyan, Teungku Amphon ka
  geu anggab musoh l\u00e9 bapak Teungku Amphon. Deungon nyan banmandum peungikot
  Teungku Amphon meutamah-tamah jijeuet.\\\"\\n22 L\u00e9 sababnyan, keu Absalom geupeuget
  khimah di ateueh bubong meuligoe nyang data nyan. Laju \u00f3h jingieng l\u00e9
  rakyatba Absalom geutamong u dalam khimah nyan dan geu-\u00e9h laju deungon gundek-gundek
  bapak geuh nyan.\\n23 Bak wat\u00e9enyan tieb-tieb naseuhat Ahitofel geuteurimong
  sang-sang nyan na kheueh haba Po teu Allah keudroe; bah kheueh Nabi Daud meunan
  cit Absalom geuturot sabe peue nyang geunaseuhat nyan.\\nChapter 17\\n1 Hana treb
  teuma \u00f3h lheueh nyan, Ahitofel jipeugah lom ubak Absalom, \\\"Neupeu idhin
  kheueh ubak ul\u00f4n mangat l\u00f4n pil\u00e9h 12.000 droe. Eunteuk malam ul\u00f4n
  teuma l\u00f4njak tiyeub Nabi Daud.\\n2 Gobnyan ul\u00f4n prang bak wat\u00e9e awaknyan
  teungoh h\u00e9k dan ka rhot seumangat. Ul\u00f4n teuma l\u00f4n peukeujot gobnyan,
  akh\u00e9jih banmandum aneu\u00ebk buah gobnyan jipeuplueng droe. Dan Raja Nabi
  Daud mantong nyang ul\u00f4n poh mat\u00e9.\\n3 Teuma banmandum aneu\u00ebk buah
  gobnyan ul\u00f4n jok pulang ubak Teungku Amphon lag\u00e9e dara bar\u00f4 jiwoe
  ubak lakoe jih. Bukon kheueh Teungku Amphon nyang lak\u00e9e nyaw\u00f6ng sidroe
  ureu\u00ebng mantong? Seudangkan nyang la\u00e9n hana teupeukaru.\\\"\\n4 Naseuhat
  nyan jipandang g\u00e9t that l\u00e9 Absalom dan l\u00e9 banmandum peumimp\u00e9n
  Israel.\\n5 Bahpi meunan Absalom jipeugah, \\\"Tajak kheueh laju jinoenyoe hai Husai;
  jak tadeungoe pakriban peudapat jih.\\\"\\n6 Bak wat\u00e9e Husai jiteuka jak meuhadab,
  Absalom jipeugah laju reuncana Ahitofel sira jipeugah lag\u00e9e nyoe, \\\"Peu kheueh
  taseut\u00f4t peue nyang ka geunaseuhat nyan? Meunyoe h\u00e1n, cuba neubri usui
  nyang la\u00e9n.\\\"\\n7 Jijaweueb l\u00e9 Husai, \\\"Naseuhat Ahitofel goenyoe
  hana g\u00e9t.\\n8 Teungku Amphon pasti neuteupeue bahwa Nabi Daud dan aneu\u00ebk
  buah gobnyan na kheueh peujuang nyang pantang meunyeurah lom gagah beurani. Awaknyan
  beuh\u00e9 lag\u00e9e cag\u00e9e inong nyang ka gad\u00f4h aneu\u00ebk. Lom teuma
  Nabi Daud nyan na kheueh sidroe tantra nyang ka jaithat peungalaman nyang h\u00e1ntom
  geumeudom meusapat deungon aneu\u00ebk buah gobnyan.\\n9 Mungken nibak sa\u00e1t
  nyoe pih gobnyan teungoh geumus\u00f6m didalam saboh guha atawa di teumpat nyang
  la\u00e9n. L\u00e9 sababnyan, meunyoe aneu\u00ebk buah Teungku Amphon geuprang l\u00e9
  Nabi Daud, dan na nyang mat\u00e9, dan soemantong nyang jideungoe hainyan teuma
  jipeugah bahwa aneu\u00ebk buah Absalom ka teupeutaloe.\\n10 Dan ureu\u00ebng-ureu\u00ebng
  nyang paleng beurani dan gagah peukasa lag\u00e9e singa pi pasti teumakot. Sabab
  banmandum ureu\u00ebng Israel jiteupeue bahwa bapak Teungku Amphon na kheueh sidroe
  pahlawan, dan meunan cit deungon aneu\u00ebk buah gobnyan na kheueh peujuang-peujuang
  nyang gagah beurani.\\n11 L\u00e9 sabab nyan, naseuhat ul\u00f4n lag\u00e9e nyoe:
  Neujak peusapat kheueh laju banmandum ureu\u00ebng Israel bansaboh nanggroe, sampoe
  le jih na sidub ano dibin\u00e9h pasi. Laju Teungku Amphon keudroe kheueh nyang
  maju ukeue dalam mideuen prang dan droeneueh kheueh nyang jeuet keu panglima prang
  nyan.\\n12 Geutanyoe teuma meurumpok ngon Nabi Daud dipat mantong gobnyan na, dan
  tanyoe prang gobnyan sigohlom gobnyan sada peue nyang ka teujadi. Hana meusidroepi
  nyang hase jipeuleuh droe, bah kheueh gobnyan meunan cit deungon aneu\u00ebk buah
  geuh.\\n13 Meunyoe gobnyan geuplueng u dalam saboh banda, banmandum rakyat geutanyoe
  jicok laju bubena talo teumalo teujak ikat laju banda nyan dan ta seumpom u dalam
  barieh nyang paleng t\u00f4. Meusineuk bat\u00e9e pih hana nyang teutinggai di ateueh
  buk\u00e9t nyan.\\\"\\n14 Ban geudeungoe nyang lag\u00e9e nyan l\u00e9 Absalom dan
  banmandum ureu\u00ebng Israel jipeugah, \\\"Naseuhat Husai leubeh g\u00e9t nibak
  naseuhat Ahitofel.\\\" Keubiet, TUHAN ka geupeuteunt\u00e9e keu geupeu bateue naseuhat
  Ahitofel nyang jroh nyan, mangat Absalom geuteurimong mala peutaka.\\n15 \u00d3h
  ka lheueh nyan Husai jilapor ubak Teungku Imeum Zadok dan Teungku Imeum Abyatar
  keuhai naseuhat Ahitofel dan naseuhat gobnyan keudroe ubak Absalom dan mandum peumimp\u00e9n
  Israel.\\n16 Kheun Husai, \\\"Bagaih, neubri t\u00e9e ubak Nabi Daud mangat b\u00e9k
  geu mudom nibak teumpat teujeumeurang krueng di padang pasi. Gobnyan har\u00f4h
  deungon sigra geujeumeurang Krueng Yordan. Meunyoe hana, gobnyan dan banmandum pasokan
  gobnyan jipeuhanco.\\\"\\n17 Bak wat\u00e9enyan Yonatan aneu\u00ebk Abyatar dan
  Ahimaas aneu\u00ebk Zadok teungoh jipreh dan hana padubna ji\u00f4h ngon mata i\u00e9
  En-Rogel, nibak bin\u00e9h banda Yerusalem. Awaknyan hana jijeuet jitamong u dalam
  banda sabab teumakot jingieng l\u00e9 gob. Lag\u00e9e nyang ka lazem, meunyoe na
  sidroe namiet ureu\u00ebng inong jijak peugah ubak awaknyan haba nyang har\u00f4h
  jipeusampoe ubak Raja Nabi Daud.\\n18 Teuma bak gobnyan na sidroe aneu\u00ebk agam
  keubeutulan deuh jikalon awaknyan, dan hainyan jijak brit\u00e9e laju ubak Absalom.
  L\u00e9 sababnyan awaknyan bagaih-bagaih jijak sira jimus\u00f6m nibak rumoh sidroe
  peunduduek nyang na di gamp\u00f4ng Bahurim. Bin\u00e9h rumoh nyan na saboh mon
  i\u00e9 dan awaknyan laju jitamong u dalam mon nyan.\\n19 Peurumoh ureu\u00ebng
  po rumoh nyan laju jileueng si\u00f4n ija di ateueh babah mon nyan dan di ateueh
  ija nyang ka teuleueng nyan laju teuma jitabu aneuk gandom, akh\u00e9jih mon i\u00e9
  nyan ka hana leumah le.\\n20 Ureu\u00ebng nyang jiyue l\u00e9 Absalom laju trok
  ubak rumoh nyan dan laju jitanyong ubak ureu\u00ebng inong nyan, \\\"Dipat deuh
  kah kalon Ahimaas dan Yonatan?\\\" \\\"Awaknyan banmantong geujeumeurang krueng,\\\"
  jaweueb ureu\u00ebng inong nyan. Awaknyan jimita laju ban dua droe aneu\u00ebk mudanyan,
  teuma hana meurumpok ngon awaknyan, laju jijakwoe kheueh awaknyan u Yerusalem.\\n21
  Ahimaas dan Yonatan laju geuteubiet dalam mon nyan, laju reujang-reujang geujak
  meurumpok ubak Raja Nabi Daud dan jilapor laju peue nyang ka geurasa nyan. Kheun
  awaknyan, \\\"Ahitofel ka jibri naseuhat keu jijak prang Teungku Amphon. Deungon
  nyan phon sa\u00e1tnyoe tabeurangkat kheueh laju neujeumeurang krueng nyoe.\\\"\\n22
  Laju Nabi Daud dan aneu\u00ebk buah gobnyan geujeumeurang Krueng Yordan, dan trok
  u meurandeh j\u00e9h ka beungoh uroe.\\n23 Bak wat\u00e9e Ahitofel ka jiteupeue
  bahwa naseuhat gobnyan hana jiseut\u00f4t l\u00e9 Absalom, gobnyan laju jijak pasang
  peulana keuleud\u00e9e jih dan jijakwoe laju u banda droe jih. \u00d3h ka lheueh
  jipeubeur\u00e9eh banmandum urosan droe jih laju gobnyan jigantung droe, dan \u00f3h
  ka jeulaih jihnyan ka mat\u00e9 jitanom laju u dalam jrat nibak jrat-jrat keuluwarga
  droe jih.\\n24 Nabi Daud ka sampoe ubak banda Mahanaim bak wat\u00e9e Absalom jijeumeurang
  Krueng Yordan, ji ir\u00e9ng l\u00e9 dumna ureu\u00ebng Israel. (\\n25 Absalom ka
  geuangkat Amasa jeuet keu ul\u00e9e pasokan keugeunantoe Yoab. Amasa nyan na kheueh
  aneu\u00ebk Yitra ureu\u00ebng Ismail; mak jih nan geuh Abigail aneu\u00ebk Nahas,
  na kheueh syedara inong mak Yoab nyang nan ji Zeruya.)\\n26 Absalom dan aneu\u00ebk
  buah gobnyan jipeudong khimah di tanoh Gilead.\\n27 Bak wat\u00e9e Nabi Daud trok
  u Mahanaim, gobnyan laju jisambot l\u00e9 Sobi aneu\u00ebk si Nahas nibak banda
  Raba di Amon, dan l\u00e9 Makhir aneu\u00ebk Amiel nibak Lodebar, dan l\u00e9 Barzilai
  nibak Rogelim di Gilead.\\n28 Awaknyan laju jiba camb\u00f4ng, kuali dan tilam keu
  Nabi Daud dan aneu\u00ebk buah gobnyan, meunan cit jiba gandom, jeulai, teup\u00f4ng,
  gandom nyang ka lheueh teu cr\u00e1ih, kacang mirah, kacang mirah nyang rayeuk,
  meulisan, keuju, ul\u00e9e susu dan meupadub boh bubiri. Awaknyan jiteupeu bahwa
  Nabi Daud dan aneu\u00ebk buah gobnyan teungoh deuk that, glaih ngon tou rukueng
  meutamah ngon h\u00e9k sabab meuneujak nyang panyang di padang pasi.\\nChapter 18\\n1
  Raja Nabi Daud laju geupeusapat banmandum aneu\u00ebk buah gobnyan, \u00f3h lheuehnyan
  pasokan nyang geupeusapat nyan geubagi teuma jeuet keu pasokan na nyang sireub\u00e9e
  saboh pasokan dan na teuma nyang sireutoih droe. \u00d3h lheuehnyan geu angkat teuma
  peuwira-peuwira nyang mat keumudo ateueh pasokan-pasokan nyan.\\n2 \u00d3h lheueh
  nyan geupeuleueh laju awaknyan u mideuen prang dalam lh\u00e9e boh keulompok, mas\u00e9ng-mas\u00e9ng
  keulompok nyan geupimp\u00e9n l\u00e9 Yoab, Abisai adoe Yoab dan Itai ureu\u00ebng
  Gat. Geupeugah l\u00e9 raja ubak aneu\u00ebk buah gobnyan, \\\"Ul\u00f4n na cit
  meusajan gata.\\\"\\n3 Teuma bubena awaknyan jijaweueb, \\\"B\u00e9k Teungku Amphon,
  meunyoe kamoe teupaksa har\u00f4h kamoe plueng, atawa bahpi siteungoh nibak kamoe
  nyoe mat\u00e9, musoh gohlom meurasa puih at\u00e9 jih, sabab Teungku Amphon kheueh
  nyang awaknyan mita. Teungku Amphon saban yuem jih deungon siploh rib\u00e9e droe
  kamoe nyoe. Lom teuma leubeh g\u00e9t Teungku Amphon neukir\u00e9m bantuan mantong
  ubak kamoe didalam banda.\\\"\\n4 Laju geupeugah l\u00e9 raja, \\\"Get kheueh, teuseurah
  mantong ubak gata.\\\" \u00d3h lheuehnyan gobnyan laju geudong dibin\u00e9h pintoe
  geureubang banda, seudangkan banmandum pasokan ka teudong meuriti diluwa lam keusatuan-keusatuan
  nyang na nibak sirib\u00e9e droe dan sireutoih droe.\\n5 Laju Raja Nabi Daud geubri
  peurintah ubak Yoab, Abisai dan Itai, lag\u00e9e nyoe geupeugah, \\\"B\u00e9k kheueh
  gata peuluka si Absalom aneu\u00ebk muda nyan deumi ul\u00f4n.\\\" Banmandum pasokan
  jideungoe peurintah Nabi Daud nyan.\\n6 Dan beurangkat kheueh pasokan Nabi Daud
  jijak prang pasokan Israel, dan awaknyan jimeu heuengko dalam uteuen Efraim.\\n7
  Pasokan Israel laju jipeutaloe l\u00e9 aneu\u00ebk buah Nabi Daud; keuhai taloe
  pasokan Israel nyan lumpah rayeuk, na 20.000 droe mat\u00e9 nibak uroenyan.\\n8
  Prang bak uroenyan ka meutamah gunjak dan hebat that, sampoe ka meuluwah ban saboh
  daerahnyan, dan leubeh jai ureu\u00ebng nyang mat\u00e9 nyang teukurong didalam
  uteuen nibak nyang mat\u00e9 dalam mideuen prang.\\n9 Bak wat\u00e9e Absalom teungoh
  ji-\u00e9k ateueh bagal droe jih, hana teusangka-sangka gobnyan laju meurumpok deungon
  aneu\u00ebk buah Nabi Daud. Bagal nyan teungoh jijak dimiyueb bak kay\u00e9e raya
  nyang miyueb, dan meusangkot kheueh ul\u00e9e Absalom nibak cabeueng kay\u00e9e
  nyan. Bagal nyan laju jiplueng seudangkan Absalom mantong meugantueng meu ayon-ayon
  nibak cabeueng kay\u00e9e nyan.\\n10 Sidroe lamkawan aneu\u00ebk buah Nabi Daud
  deuh jikalon hainyan dan laju jijak lapor ubak Yoab, \\\"Teungku Amphon, bunoe leumah
  ul\u00f4n kalon Absalom ka meugantueng nibak cabeueng kay\u00e9e raya!\\\"\\n11
  Geujaweueb l\u00e9 Yoab, \\\"Peue kah peugah? Deuh kahkalon gobnyan? Pakon hana
  kahpoh bumat\u00e9? Pasti ul\u00f4n bri keu gata siploh p\u00e9ng pirak dan saboh
  talo keuieng.\\\"\\n12 Teuma ureu\u00ebng nyan jijaweueb, \\\"Bahpi neubri 1.000
  p\u00e9ng pirak keu ul\u00f4n, ul\u00f4n h\u00e1n l\u00f4ntem peusak\u00e9t aneu\u00ebk
  agam raja. Kamoe banmandum kamoe deungoe peue nyang ka geupeurintah l\u00e9 raja
  ubak Teungku Amphon dan ubak Abisai meunan cit ubak Itai, mangat b\u00e9k teupeuluka
  Absalom aneu\u00ebk muda nyan deumi raja.\\n13 Dan meunyoe jih nyan ul\u00f4n poh
  mat\u00e9 si Absalom nyan, ka pasti nyan geuteupeue l\u00e9 raja, sabab raja ka
  teunt\u00e9e geudeungoe keuhai peue-peue mantong -- dan Teungku Amphon pih ka pasti
  hana neutem bila ul\u00f4n.\\\"\\n14 \\\"Boh ka kheueh nyan! Hab\u00e9h wat\u00e9e
  meuseu \u00e9ue jaweueb keuhai nyan deungon gata,\\\" geupeugah l\u00e9 Yoab. Laju
  Yoab geucok lh\u00e9e boh kapak dan kapak nyan laju geut\u00f4b ubak dada Absalom
  nyang bak wat\u00e9e nyan mantong udeb dan teugantueng bak cabeueng kay\u00e9e.\\n15
  \u00d3h lheueh na teuma siploh droe aneu\u00ebk buah Yoab laju teuma jijak paran
  sira jicang-cang Absalom nyan sampoe mat\u00e9.\\n16 Yoab laju geuyob beureuguih
  akh\u00e9jih aneu\u00ebk buah gobnyan banmandum jipi\u00f4h jipeucrok pasokan Israel.\\n17
  \u00d3h lheueh nyan many\u00e9t Absalom laju jibeu\u00f4t dan ji seumpom u dalam
  mon nyang that lhok didalam uteuen nyan. Mon nyan laju jiseub\u00e9e l\u00e9 awaknyan
  deungon aneuk bat\u00e9e sampoe manyang. Banmandum pasokan Israel laju jipeuplueng
  droe mas\u00e9ng-mas\u00e9ng u rumoh droe jih.\\n18 Yoh mantong udeb Absalom ka
  geupeudong keudroe gobnyan saboh tugu di Pant\u00f4n Raja, sabab gobnyan hana geumeu
  aneu\u00ebk nyang agam keu teusambong keuturonan gobnyan. Tugu nyan geuboh nan paih
  lag\u00e9e nan gobnyan keudroe, dan sampoe nibak uroe nyoe tugu nyan teuboh nan
  tugu Absalom.\\n19 \u00d3h lheuehnyan jipeugah kheueh l\u00e9 Ahimaas aneu\u00ebk
  Zadok ubak Yoab, \\\"Neupeu idhin kheueh ubak ul\u00f4n mangat ul\u00f4n plueng
  l\u00f4njak brit\u00e9e ubak raja dan ul\u00f4n ba haba mangat at\u00e9 nyang toh
  TUHAN ka geupeuseulamat Teungku Amphon nibak musoh gobnyan.\\\"\\n20 \\\"B\u00e9k,\\\"
  kheun Yoab, \\\"na wat\u00e9e la\u00e9n singoh. Uroenyoe h\u00e1njeuet gata tajakba
  haba, sabab aneu\u00ebk agam raja ka mat\u00e9.\\\"\\n21 \u00d3h lheueh nyan Yoab
  geupeugah ubak sidroe lamkawan namiet gobnyan nyang ureu\u00ebng Sudan, \\\"Tajak
  peugah kheueh haba nyoe ubak raja peue nyang ka gata kalon.\\\" Namiet nyan laju
  jisujut jiseumah Teungku droe jih dan jibeud\u00f4h sinan laju jijak sira jiplueng.\\n22
  Teuma Ahimaas laju jipaksa ubak Yoab, \\\"Peue mantong nyang teuma teujadi, neupeu
  idhin kheueh ubak ul\u00f4n nyoe mangat ul\u00f4n jakba haba.\\\" \\\"Pakon gata
  g\u00e9t that meuhasrat takeuneuk jak meusajan, hai aneu\u00ebk ul\u00f4n?\\\" geutanyong
  l\u00e9 Yoab. \\\"Gata hana teuma neuteurimong gaji keuhai nyan.\\\"\\n23 \\\"Hana
  peue,\\\" jipeugah lom l\u00e9 Ahimaas, \\\"Ul\u00f4n teuma teutab l\u00f4njak.\\\"
  \\\"Meunyoe meunan, tajak kheueh,\\\" kheun Yoab. Dan jiplueng kheueh laju Ahimaas
  jiseut\u00f4t bin\u00e9h rot nyang teuliwat sipanyang Pant\u00f4n Yordan, dan hana
  treb teuma \u00f3h lheueh nyan ka meuhase jitinggai namiet Yoab nyang ka awai jijak
  bunoe.\\n24 Nabi Daud bak saboh wat\u00e9e teungoh geuduek-duek di ruweueng pintoe
  lamkawan pintoe geureubang teungoh ngon pintoe geureubang luwa banda nyan. Teuka
  si peunjaga laju jijak \u00e9k u ateueh beuton dan jidong laju di ateueh bubong
  pintoe geureubang nyan. Bak wat\u00e9e ureu\u00ebng nyan teungoh jingieng sira jipandang
  keudeh keunoe, leumah laju jikalon na sidroe ureu\u00ebng jiteuka sira jiplueng-plueng.\\n25
  Peunjaga nyan laju jitaw\u00f6k u miyueb sira jipeugah hainyan ubak raja, dan raja
  geupeugah, \\\"Meunyoe jihnyan sidroe mantong, ka pasti nyang jiba nyan na kheueh
  haba nyang jroh.\\\" Bak wat\u00e9e ureu\u00ebng nyan ka rab sampoe,\\n26 peunjaga
  nyan jikalon na teuma sidroe teuk teuka meunan cit sira jiplueng. L\u00e9 sababnyan
  ureu\u00ebng nyan jitaw\u00f6k lom, \\\"Ngieng! Na ureu\u00ebng la\u00e9n sidroe
  teuk teungoh jiplueng cit keunoe.\\\" Raja geujaweueb, \\\"Pasti ureu\u00ebng nyan
  jiba haba nyang g\u00e9t cit teuma.\\\"\\n27 Peunjaga nyan jipeugah, \\\"Ureu\u00ebng
  phon nyan Ahimaas. Ul\u00f4n l\u00f4n teupeu nibak cara jihnyan jiplueng.\\\" \\\"Gobnyan
  ureu\u00ebng g\u00e9t,\\\" kheun raja, \\\"ka teunt\u00e9e jihnyan jiba haba nyang
  jroh teuma.\\\"\\n28 Sira jiteumaw\u00f6k Ahimaas laju jibri saleuem ubak raja,
  laju jisujut dan geupeugah, \\\"Teupujoe kheueh TUHAN Po teu Allah Teungku Amphon,
  nyang ka geuseurah ubak Teungku Amphon ureu\u00ebng-ureu\u00ebng nyang beurontak
  keu Teungku Po!\\\"\\n29 Geutanyong l\u00e9 raja, \\\"Peu kheueh Absalom ureu\u00ebng
  muda nyan seulamat?\\\" Jijaweueb l\u00e9 Ahimaas, \\\"Teungku Amphon, bunoe bakwat\u00e9e
  ul\u00f4n geu utoih jak keunoe l\u00e9 Yoab, deueh ul\u00f4n kalon karu ngon ri\u00f4h
  nyang lumpah subra, teuma ul\u00f4n hana l\u00f4n teupeue peue nyang ka teujadi.\\\"\\n30
  \\\"Gata beud\u00f4h dan tajakdong kheueh blaih j\u00e9h,\\\" geupeugah l\u00e9
  raja; teuma Ahimaas jijak laju keunan dan jidong nibak bin\u00e9h lag\u00e9e nyang
  ka geuyue l\u00e9 Nabi Daud nyan.\\n31 \u00d3h lheuehnyan trok teuma namiet Yoab,
  dan jipeugah laju ubak raja, \\\"Ul\u00f4nnyoe l\u00f4nba haba nyang paleng g\u00e9t
  ubak Teungku Amphon! Bak uroenyoe TUHAN ka geubri keu Teungku Amphon keumeunangan
  ateueh banmandum ureu\u00ebng nyang ka jibeurontak ubak Teungku Amphon.\\\"\\n32
  Raja laju geutanyong ubak budak nyan, \\\"Peu kheueh Absalom aneu\u00ebk muda nyan
  seulamat?\\\" Jijaweueb l\u00e9 namiet nyan, \\\"Kira jih banmandum musoh Teungku
  Amphon, meunan cit banmandum nyang ka beurontak teuhadab Teungku Amphon ka jirasa
  naseb nyang saban lag\u00e9e aneu\u00ebk muda nyan.\\\"\\n33 Ban geudeungoe nyan
  raja g\u00e9t that peudeh, laju geujak \u00e9k u ateueh ruangan di ateueh pintoe
  geureubang sira geumo ngon geumeu ba-e, \\\"Oh aneu\u00ebk ul\u00f4n! Aneu\u00ebk
  ul\u00f4n Absalom! Absalom aneu\u00ebk ul\u00f4n! Leubeh g\u00e9t ul\u00f4n mantong
  nyang mat\u00e9 keugeunantoe gata, aneu\u00ebk ul\u00f4n! Absalom, aneu\u00ebk ul\u00f4n!\\\"\\nChapter
  19\\n1 Ubak Yoab teupeusampoe bahwa Raja Nabi Daud geumo ba-e ngon geumeukabong
  keu Absalom.\\n2 Dan keuhai meunang nibak uroenyan ka meu-ubah jeuet keu seudehan
  ubak banmandum tantra Nabi Daud kareuna awaknyan jideungoe bahwa raja teungoh keupeuratok
  aneu\u00ebk agam gobnyan.\\n3 Deungon cara seungab-seungab awaknyan jigisa u banda,
  bak lag\u00e9e tantra nyang meurasa mal\u00e9e kareuna jipeuplueng droe nibak mideuen
  prang.\\n4 Raja geus\u00f6m muka gobnyan sira geumeuba-e ngon su nyang meuleungkeng,
  \\\"Oh aneu\u00ebk ul\u00f4n! Aneu\u00ebk ul\u00f4n Absalom! Absalom, aneu\u00ebk
  ul\u00f4n!\\\"\\n5 Yoab laju geujak meuhadab ubak raja dan geupeugah, \\\"Bak uroenyoe
  Teungku Amphon ka neupeumal\u00e9e aneu\u00ebk buah Teungku Amphon, padahai awaknyan
  kheueh nyang ka peuseulamat nyaw\u00f6ng Teungku Amphon, nyaw\u00f6ng aneu\u00ebk
  agam ngon aneu\u00ebk inong Teungku Amphon, meunan cit deungon peurumoh dan gundek
  Teungku Amphon.\\n6 Teungku Amphon ka neugas\u00e9h keu ureu\u00ebng-ureu\u00ebng
  nyang jibanci keu Teungku Amphon, teuma Teungku Amphon neubanci ubak ureu\u00ebng
  nyang jigas\u00e9h keu Teungku Amphon! Deungon jeulaih that Teungku Amphon ka neupeuleumah
  bahwa banmandum peuwira meunan cit deungon tantra Teungku Amphon nyan hana meu areuti
  nibak Teungku Amphon. Teuma leumah jih Teungku Amphon leubeh that-that galak meunyoe
  nibak uroenyoe Absalom mantong na udeb dan kamoenyoe banmandum mat\u00e9!\\n7 Nyang
  sig\u00e9t jih Teungku Amphon neubeud\u00f4h dan neujak uluwa keu teupeuteunang
  at\u00e9 aneu\u00ebk buah Teungku Amphon. Ul\u00f4n meusumpah deumi TUHAN, meunyoe
  Teungku Amphon hana neuteubiet neujak meurumpok ngon awaknyan, teuma nibak malam
  nyoe cit teuma hanale na ureu\u00ebng meusidroe pih nyang jitem na deungon Teungku
  Amphon. Nyan na kheueh sibagoe beuncana nyang paleng rayeuk nyang teuma Teungku
  Amphon rasa siumu udeb Teungku Amphon.\\\"\\n8 \u00d3h lheuehnyan geubeud\u00f4h
  kheueh raja dan geujak laju uluwa, dan geuduek laju to ngon pintoe geureubang. Aneu\u00ebk
  buah gobnyan jideungoe bahwa gobnyan ka na disinan, laju awaknyan banmandum teuka
  jijak meuhadab. Bak wat\u00e9e nyan banmandum pasokan Israel ka jipeuplueng droe,
  dan jijakwoe u rumoh jih mas\u00e9ng-mas\u00e9ng.\\n9 Lamkawan banmandum suk\u00e9e
  Israel teuka kheueh seuleuseh paham ka jimeudakwa ngon jimeudakwi sabe keudroe-droe.
  Kheun awaknyan, \\\"Raja Nabi Daud ka geupeuseulamat geutanyoe nibak ureu\u00ebng
  Filistin dan meunan cit ka geupeu lheueh geutanyoe nibak musoh-musoh nyang la\u00e9n,
  teuma jinoenyoe gobnyan ka geupeuplueng droe nibak Absalom dan geutinggai nanggroenyoe.\\n10
  Absalom tanyoe bai\u00e1t jeuet keu raja, teuma jinoenyoe ka mat\u00e9 didalam mideuen
  prang, pakon hana meusidroe ureu\u00ebng pih jiuseuha jiba peuwoe Nabi Daud mangat
  geuwoe keunoe?\\\"\\n11 Tutoe haba nyan trok cit ubak Raja Nabi Daud. Sabab nyan
  gobnyan geuyue laju Teungku Imeum Zadok dan Teungku Imeum Abyatar geuyuejak tanyong
  ubak peumimp\u00e9n Yehuda lag\u00e9e nyoe, \\\"Pakon gata ka jeuet keu nyang keuneuleueh
  keu teujak sambot ngon teujak ir\u00e9ng raja geuwoe lom teuma ubak meuligoe gobnyan?\\n12
  Neupeugah kheueh laju gata war\u00e9h syedara ul\u00f4n dan kaw\u00f6m keurabat
  ul\u00f4n? Pakon jeuet gata nyang keuneuleueh neulak\u00e9e mangat ul\u00f4n woe?\\\"\\n13
  Meunan cit teuma l\u00e9 Nabi Daud geupeugah geuyue peusampoe ubak awaknyan mangat
  jijak peugah ubak Amasa lag\u00e9e nyoe, \\\"Bukon kheueh gatanyoe sabat ul\u00f4n?
  Phon bak sa\u00e1tnyoe gata ul\u00f4n angkat jeuet keu panglima tantra ul\u00f4n
  keugeunantoe Yoab. Kira jih Po teu Allah geupoh mat\u00e9 ul\u00f4n meunyoe hainyan
  hana ul\u00f4n peubuet!\\\"\\n14 Meunan kheueh cara jih Nabi Daud ka meuhase geucok
  at\u00e9 banmandum kaw\u00f6m Yehuda sampoe awaknyan jikir\u00e9m peusan ubak raja
  mangat geuwoe ubak meuligoe meusajan banmandum deungon dumna peugaw\u00e9e gobnyan.\\n15
  \u00d3h lheueh nyan raja pih geubeurangkat dan trok laju nibak Krueng Yordan, bak
  wat\u00e9e nyan di ureu\u00ebng-ureu\u00ebng Yehuda ka teuma sampoe u Gilgal keu
  jijak tueng raja dan jikawai gobnyan teujeumeurang Krueng Yordan.\\n16 Simei aneu\u00ebk
  si Gera, ureu\u00ebng Benyamin nyan jiba teuma na sirib\u00e9e droe nibak suk\u00e9e
  Benyamin dan bagaih-bagaih jiteuka meusigoe deungon ureu\u00ebng-ureu\u00ebng Yehuda
  nyan keu jijak sambot raja. Meunan cit deungon Ziba namiet keuluwarga Saul, meunan
  cit deungon ban limong blaih droe aneu\u00ebk gobnyan nyang agam dan dua ploh droe
  namiet gobnyan; awaknyan ka jijeumeurang Krueng Yordan sigohlom raja teuka keunan.\\n18
  Awaknyan jibantu keuluwarga raja geujeumeurang krueng nyan dan jipeubuet laju peue
  mantong nyang geuyue l\u00e9 raja ubak gobnyan. Bak wat\u00e9e raja geukeuneuk jeumeurang
  krueng, Simei laju jisujut dikeue gobnyan dan jipeugah,\\n19 \\\"Ul\u00f4n meulak\u00e9e,
  bah kheueh Teungku Amphon hana neu anggab ul\u00f4n teutab meusalah. Bah kheueh
  Teungku Amphon neupeu tuwoe peue nyang ka ul\u00f4n peubuet nibak uroe Teungku Amphon
  neutinggai Yerusalem.\\n20 Ul\u00f4n ka insaf, bahwa ul\u00f4n ka l\u00f4n peubuet
  desya, dan l\u00e9 sabab nyan, lamkawan suk\u00e9e-suk\u00e9e nyang na tinggai di
  daerah utara ul\u00f4n kheueh nyang phon-phon that teuka jak sambot Teungku Amphon
  nibak uroe nyoe.\\\"\\n21 Ban geudeungoe nyang lag\u00e9e nyan di Abisai aneu\u00ebk
  Zeruya jipeugah, \\\"Simei ka patot teuhuk\u00f6m mat\u00e9 sabab jihnyan ka jikutok
  raja nyang ka geupil\u00e9h l\u00e9 TUHAN.\\\"\\n22 Teuma Nabi Daud geupeugah ubak
  Abisai dan Yoab aduen gobnyan, \\\"B\u00e9k taikot jampu urusan ul\u00f4n. Keupeue
  awaknyoe tapeususah ul\u00f4n? Bak uroenyoe ul\u00f4n ka jeuet keuraja lom ateueh
  Israel, dan hana jeuet na ureu\u00ebng Israel nyang teuhuk\u00f6m mat\u00e9.\\\"\\n23
  \u00d3h lheueh nyan geumeusumpah kheueh raja ubak Simei, \\\"Ul\u00f4n jamin bahwa
  gata hana teuhuk\u00f6m mat\u00e9.\\\"\\n24 Meunan cit si Mefiboset cucoe Saul,
  jiteuka keu jiseut\u00f4t sajan jak sambot raja. Gobnyan hana jihrah gaki geuh,
  hana teuma jigunteng janggot geuh, dan hana teuma jirhah peukayan jih yohphon Nabi
  Daud geutinggai Yerusalem sampoe gobnyan deungon seulamat teuma geugisa.\\n25 Bak
  wat\u00e9e Mefiboset teuka di Yerusalem keu jijak sambot raja, geupeugah kheueh
  laju l\u00e9 raja ubak jihnyan, \\\"Hai Mefiboset, pakon gata hana tajak deungon
  ul\u00f4n nibak wat\u00e9e nyan?\\\"\\n26 Jijaweueb l\u00e9 Mefiboset, \\\"Nyang
  ul\u00f4n peumulia Teungku Amphon, Teungku kon neuteupeue bahwa ul\u00f4n nyoe capiek.
  Ul\u00f4n yue peulayan ul\u00f4n sipeusiab keuleud\u00e9e nyang hase ul\u00f4n pasang
  di teueh rhueng jih mangat jeuet ul\u00f4n seut\u00f4t Teungku Amphon. Teuma ul\u00f4n
  ka jikianat l\u00e9 peulayan nyan.\\n27 Kon nyan mantong, ul\u00f4n jifiteunah teuma
  teuhadab Teungku Amphon. Teuma Teungku Amphon na kheueh ban lag\u00e9e malaikat
  Allah. Sabab nyan neupeubuet kheueh laju peue nyang Teungku Amphon anggab g\u00e9t.\\n28
  Banmandum kaw\u00f6m keuluwarga bapak ul\u00f4n ka pathot neuhuk\u00f6m mat\u00e9
  l\u00e9 Teungku Amphon, teuma ul\u00f4n nyoe ka Teungku bri idhin keu meusajan l\u00f4n
  makheun ngon Teungku Amphon nibak meuligoe. Jinoenyoe ul\u00f4n hana beurani le
  l\u00f4n lak\u00e9e peue mantong nibak Teungku Amphon.\\\"\\n29 Geujaweueb l\u00e9
  raja, \\\"Hana peureul\u00e9e le tapeugah peue mantong. Ul\u00f4n ka l\u00f4n cok
  keusimpolan keu ul\u00f4n bri peue mantong hareuta Saul keu gata dan keu Ziba.\\\"\\n30
  Laju jijaweueb l\u00e9 Mefiboset, \\\"Bah kheueh atranyan jicok l\u00e9 Ziba banmandum.
  Ul\u00f4n ka puih sabab Teungku Amphon ka neuwo deungon seulamat.\\\"\\n31 Meunan
  cit si Barzilai ureu\u00ebng Gilead nyan teuka di Rogelim keu jijak ir\u00e9ng raja
  geujak jeumeurang Krueng Yordan.\\n32 Barzilai bak wat\u00e9e nyan ka tuha that,
  umu gobnyan ka na lapan ploh thon. Gobnyan ureu\u00ebng nyang kaya that yoh mantong
  raja tinggai di Mahanaim yoh wat\u00e9e il\u00e9e, Barzilai nyan kheueh nyang peuna
  peunajoh keu raja.\\n33 Raja geupeugah ubak ureu\u00ebng nyan, \\\"Gata seut\u00f4t
  kheueh laju deungon ul\u00f4n u Yerusalem, teuma disideh ul\u00f4n jok peue mantong
  nyang gata peureul\u00e9e.\\\"\\n34 Teuma jijaweueb l\u00e9 Barzilai, \\\"Ul\u00f4n
  nyoe hana panyang le umu, dan udeb ul\u00f4n nyoe hana treb le. L\u00e9 sababnyan
  keupeue kheueh guna jih ul\u00f4n nyoe l\u00f4n seut\u00f4t deungon Teungku Amphon
  u Yerusalem?\\n35 Umu ul\u00f4n nyoe ka lapan ploh thon, dan hana le peue nyang
  ul\u00f4n harab nyang hase teubri keuteupeu mangat at\u00e9 ul\u00f4n. Ul\u00f4n
  nyoe hana le nyang mangat peue nyang ul\u00f4n makheun dan peue teuma nyang ul\u00f4n
  jieb, dan punyueng ul\u00f4n hana hase le ul\u00f4n deungoe su nyang meureudu ureu\u00ebng
  meuca-e. Ul\u00f4n teuma jeuet keubeuban u ateueh Teungku Amphon.\\n36 Ul\u00f4n
  nyoe hana patot ul\u00f4n teurimong upah nyang rayeuk nyan. Teuma ul\u00f4n nyoe
  meuheut ul\u00f4n keuneuk ir\u00e9ng Teungku Amphon meupadub langkah mantong di
  meurandeh Krueng Yordan.\\n37 \u00d3h lheueh nyan, bah kheueh ul\u00f4n nyoe l\u00f4nwoe
  u rumoh dan meuninggai disinan, \u00f3h lheueh nyan jipeukubu bak bin\u00e9h jrat
  bapak ul\u00f4n, teuma nyoe kheueh aneu\u00ebk ul\u00f4n nyang nan jih Kimham. Neupeu
  idhin kheueh jihnyan ji ir\u00e9ng Teungku Amphon dan neupeubuet kheueh ateueh jihnyan
  peue nyang Teungku Amphon ngieng nyan g\u00e9t.\\\"\\n38 Geujaweueb l\u00e9 raja,
  \\\"Kimham teuma ul\u00f4n ba dan ul\u00f4n uroih lag\u00e9e nyang gata lak\u00e9e,
  dan peue mantong nyang gata lak\u00e9e ubak ul\u00f4n teuma ul\u00f4n peupeunoh.\\\"\\n39
  \u00d3h ka lheueh geupeugah nyan, Nabi Daud dan banmandum aneu\u00ebk buah gobnyan
  laju geujeumeurang Krueng Yordan. Sigohlom nyan Nabi Daud geuc\u00f4m leubeh il\u00e9e
  Barzilai sira geulak\u00e9e idhin. \u00d3h lheueh nyan geuwoe kheueh laju si Barzilai
  u rumoh gobnyan.\\n40 Banmandum pasokan Yehuda dan siteungoh nibak pasokan Israel
  ji-ir\u00e9ng raja jak jeumeurang Krueng Yordan nyan. \u00d3h ka lheueh nyan raja
  laju geujak u Gilgal, dan Kimham geuba sajan deungon gobnyan.\\n41 \u00d3h ka lheueh
  nyan teuka kheueh banmandum ureu\u00ebng Israel jak meuhadab ubak raja dan jipeugah
  ubak gobnyan, \\\"Teungku Amphon, pakon kheueh syedara kamoe nyang ureu\u00ebng
  Yehuda nyan jipike bahwa awaknyan kheueh nyang na hak jijak tueng ngon jikawai Teungku
  Amphon meunan cit deungon banmandum keuluwarga Teungku Amphon dan mandum aneu\u00ebk
  buah Teungku Amphon nyang meusajan-sajan teujeumeurang Krueng Yordan?\\\"\\n42 Laju
  jijaweueb l\u00e9 ureu\u00ebng Yehuda nyan, \\\"Nyan ka patot hak kamoe, sabab raja
  nyan na kheueh sabat kamoe. Peue pasai jeuet keubeung\u00e9h gata? Peu kheueh keubutohan
  kamoe geutanggong l\u00e9 raja, atawa ka geubri sapeue-sapeue hadiah keu kamoe?\\\"\\n43
  Jijaweueb l\u00e9 ureu\u00ebng Israel nyan, \\\"Hak kamoe u ateueh raja nyan na
  siploh goe lipat nibak hak gata, bahpih raja nyan na kheueh rakan nyang krab deungon
  gata. Pakon gata ngieng enteng teuhadab kamoe? B\u00e9k tuwoe gata bahwa kamoe kheueh
  nyang phon-phon that usui keu teuba raja mangat teupeuwo!\\\" Teuma di ureu\u00ebng
  Yehuda leubeh kreueh nibak ureu\u00ebng Israel dan h\u00e1n jitem taloe.\\nChapter
  20\\n1 Di Banda Gilgal na sidroe ureu\u00ebng jeuhet nyang buet jih jipeurusak ngon
  jipeukaru keuteuntraman masyarakat, nan ureu\u00ebng nyan Seba. Seba nyan aneu\u00ebk
  si Bikri nibak suk\u00e9e Benyamin. Bak wat\u00e9e ir\u00e9ng-ir\u00e9ngan Nabi
  Daud teuka, Seba laju jiyueb beureuguih dan jipeugah, \\\"Geutanyoe banmandum hana
  hubongan sapeuepi deungon Nabi Daud. Jadi hana peureul\u00e9e geutanyoe taseut\u00f4t
  gobnyan? Ho droeneueh mandum ureu\u00ebng Israel, jak geutanyoe tajakwoe!\\\"\\n2
  Ban jideungoe nyang lag\u00e9e nyan di ureu\u00ebng-ureu\u00ebng Israel nyan pih
  laju jijakwo jiseut\u00f4t Seba hana jipako meubacut pi ubak Nabi Daud. Teuma di
  ureu\u00ebng Yehuda teutab seutia dan ji ir\u00e9ng laju Nabi Daud nibak Krueng
  Yordan sampoe u Yerusalem.\\n3 \u00d3h ka sampoe Nabi Daud ubak meuligoe gobnyan
  di Yerusalem, ban siploh droe gundek gobnyan nyang geutingggai disinan keu jikeumiet
  meuligoe, geupeuduek didalam rumoh nyang jijaga l\u00e9 peugaw\u00e9e. Keubutohan
  awaknyan ka teukeubah siseb-seb jih, teuma Nabi Daud h\u00e1ntom geu-\u00e9h le
  deungon awaknyan. Jadi awaknyan hana geutuk\u00e9h le dan udeb awaknyan lag\u00e9e
  inong bal\u00e9e sampoe \u00e1n mat\u00e9.\\n4 Raja laju geubri peurintah ubak Amasa,
  \\\"Gata peusapat kheueh laju bubena ureu\u00ebng Yehuda dan tayuejak kheueh keunoe
  deungon awaknyan lam tempo lh\u00e9e uroe.\\\"\\n5 \u00d3h lheueh nyan jijak kheueh
  laju Amasa keu jijak gump\u00f4i awaknyan lag\u00e9e nyang ka geupeurintah ubak
  jihnyan, teuma ureu\u00ebng nyan hana jigisa le lag\u00e9e nyang ka geupeuteunt\u00e9e
  l\u00e9 raja.\\n6 \u00d3h lheueh nyan geupeugah kheueh teuma l\u00e9 raja ubak Abisai,
  \\\"Seba nyan leubeh jai kajipeususah geutanyoe nibak Absalom. Sabab nyan taba kheueh
  aneu\u00ebk buah ul\u00f4n dan tapeulet kheueh awaknyan, mangat b\u00e9k sampoe
  awaknyan jiduek nibak banda-banda nyang meukuta, dan jiteumeu plueng nibak geutanyoe.\\\"\\n7
  Dan dimiyueb pimp\u00e9nan Abisai, pasokan Yoab dan pasokan peungawai pribadi raja
  dan banmandum tantra nyang la\u00e9n jibeurangkat u Yerusalem deungon tujuan jijak
  tiyeub Seba.\\n8 Bak wat\u00e9e awaknyan ka sampoe nibak bat\u00e9e raya di Gibeon,
  Amasa laju teuka jijak meurumpok ngon awaknyan. Yoab nibak wat\u00e9e nyan geungui
  peukayan prang deungon peudeueng dalam sarong nyang meugantueng nibak keuieng gobnyan.
  Bak wat\u00e9e gobnyan teungoh geujak ngon geumaju, sarong peudeueng nyan teuduit
  dan sampoe peudeueng nyan teug\u00e9es\u00e9e ubak jaroe wie gobnyan.\\n9 Yoab geupeugah
  ubak Amasa, \\\"Peue haba, rakan?\\\" sira geumat janggot Amasa deungon jaroe uneuen
  geuh sang-sang geukeuneuk c\u00f6m jihnyan.\\n10 Amasa hana deuh jikalon na peudeueng
  nibak jaroe wie Yoab. Deungon hana teusangka-sangka Yoab laju geut\u00f4b peudeueng
  geuh nyan ubak pruet Amasa, sampoe asoe pruet Amasa nyan ro meuhambo ateueh tanoh.
  Amasa nyan mat\u00e9 bak wat\u00e9e nyan cit teuma, sampoe l\u00e9 Yoab hana peureul\u00e9e
  le geut\u00f4b jihnyan. Dan \u00f3h lheueh nyan Yoab dan Abisai adoe gobnyan, jijak
  let laju Seba.\\n11 Sidroe lamkawan tantra Yoab jidong t\u00f4 ngon many\u00e9t
  Amasa dan jimeuh\u00f4i, \\\"Sou nyang dong blaih Yoab dan Nabi Daud, gata seut\u00f4t
  kheueh Yoab!\\\"\\n12 Many\u00e9t si Amasa nyang mantong meulabo ngon darah nyan
  mantong na teutiek di ateueh jalan raya. Tantra Yoab bunoe deuh jikalon bahwa banmandum
  ureu\u00ebng nyang teungoh jijak jipi\u00f4h disinan. L\u00e9 sabab nyan kheueh
  gobnyan jitarek many\u00e9t nyan u dalam lamp\u00f4h dan jithob laju ngon ija seulimbot.\\n13
  \u00d3h ka lheueh many\u00e9t nyan jig\u00e9es\u00e9e di ateueh rot nyan, bar\u00f4
  kheueh bubena ureu\u00ebng nyang teungoh jipi\u00f4h bunoe ka hase jijak lom teuma,
  dan banmandum ureu\u00ebng nyan jiseut\u00f4t Yoab keuk jijak tiyeub Seba.\\n14
  Seba nyan ka lheueh jijak bansaboh daerah suk\u00e9e Israel, laju sampoe ubak banda
  Abel-Bet-Maakha jiseut\u00f4t banmandum l\u00e9 suk\u00e9e nyang meumarga Bikri.\\n15
  Aneu\u00ebk buah Yoab jideungoe bahwa Seba na disinan, dan awaknyan pih laju jikeupong
  banda nyan. Awaknyan laju jitamon tanoh nibak seukeulileng beuton lua dan jipeuphon
  tema kueh tanoh nyang na dimiyueb beuton nyan mangat jeuet ji reuloih ngon geupeureubah
  bint\u00e9h beuton nyan.\\n16 Di banda nyan na sidroe ureu\u00ebng inong nyang bijak
  sana, dan gobnyan jidong di ateueh bint\u00e9h beuton laju jimeuh\u00f4i, \\\"Neudeungoe!
  Neudeungoe! Neulak\u00e9e kheueh mangat Yoab jiteuka keunoe; ul\u00f4n keuneuk peugah
  haba ngon gobnyan.\\\"\\n17 Geuteuka laju Yoab dan di ureu\u00ebng inong nyan jitanyong,
  \\\"Droeneueh kheueh nyan Yoab?\\\" \\\"Nyoe, beut\u00f4i, ul\u00f4n Yoab,\\\" geujaweueb
  l\u00e9 Yoab nyan. Jipeugah l\u00e9 ureu\u00ebng inong nyan, \\\"Neudeungoe kheueh
  peue nyang ul\u00f4n peugah nyoe, hai Teungku.\\\" \\\"Get kheueh, ul\u00f4n deungoe,\\\"
  geujaweueb l\u00e9 Yoab.\\n18 Jipeugah l\u00e9 ureu\u00ebng inong nyan, \\\"Yoh
  wat\u00e9e il\u00e9e ureu\u00ebng ram\u00e9 jipeugah lag\u00e9e nyoe, ''Meunyoe
  droeneueh na peureul\u00e9e peutunyoek, neujak kheueh laju ubak banda Abel'' --
  dan nyan kheueh nyang jipeubuet l\u00e9 awaknyan.\\n19 Banda kamoe nyang nan jih
  Abel nyoe banda nyang raya, dan saboh banda nyang paleng aman ngon seutia di nanggroe
  Israel. Pakon di Teungku neu-useuha neu keuneuk peuhanco? Peu kheueh Teungku kana
  niet neukeuneuk peurusak tanoh nyang atra TUHAN?\\\"\\n20 \\\"Mubacut pih hana niet
  nibak ul\u00f4n nyang lag\u00e9e nyan!\\\" geujaweueb l\u00e9 Yoab, \\\"ul\u00f4n
  mubacutpi tan na niet l\u00f4n peurusak atawa l\u00f4n peuhanco banda droeneueh!\\n21
  Nyan bukon reuncana kamoe. Teuma sidroe ureu\u00ebng nyang nan jih Seba aneu\u00ebk
  si Bikri, ureu\u00ebng nyan meuasai nibak daerah meugunong-gunong Efraim, jih nyan
  ka jibeurontak ubak Nabi Raja Daud. Gata jok kheueh jih nyan, \u00f3h lheueh nyan
  ul\u00f4n teuma l\u00f4njak nibak banda nyoe.\\\" Jipeugah lom l\u00e9 ureu\u00ebng
  inong nyan, \\\"Ul\u00e9e ureu\u00ebng nyan teuma kamoe rhom ubak Teungku rot bint\u00e9h
  beuton nyoe.\\\"\\n22 Jijak kheueh laju gobnyan dan deungon lisek jih jipeugah laju
  meukeusut jih nyan ubak peunduduek banda nyan. \u00d3h lheueh nyan ul\u00e9e Seba
  laju jiteubang dan jigeulawa laju ubak Yoab. \u00d3h lheueh nyan Yoab geuyueb laju
  beureuguih dan bubena aneu\u00ebk buah gobnyan jitinggai laju banda nyan laju jijakwoe
  u rumoh droejih mas\u00e9ng-mas\u00e9ng. Dan meunan cit deungon Yoab laju geujakwoe
  u Yerusalem geujak meuhadab ubak raja.\\n23 Nyoe kheueh peujabat-peujabat nanggroe
  nyang meupangkat manyang nyang geu bai\u00e1t l\u00e9 Nabi Daud: Panglima keu banmandum
  tantra Israel: geuangkat Yoab. Ul\u00e9e pasokan peungawai pribadi Nabi Daud: geuangkat
  Benaya aneu\u00ebk Yoyada.\\n24 Keu ul\u00e9e ureu\u00ebng keureuja paksa: geuangkat
  si Adoram. Keu beundahara nanggroe: geuangkat si Yosafat aneu\u00ebk si Ahilud.\\n25
  Keu sekretaris nanggroe: geuangkat Seya. Keu teungku imeum: geuangkat Zadok dan
  Abiyatar.\\n26 Teungku imeum dalam meuligoe: geuangkat Ira nibak banda Yair.\\nChapter
  21\\n1 Bak masa Nabi Daud geumat peurintah, teuka kheueh bala mus\u00e9m deuk nyang
  lumpah hibat dan treb jih lh\u00e9e thon peunoh. Laju Nabi Daud geulak\u00e9e peutunyok
  ubak TUHAN keuhai deuk nyan, dan TUHAN meufeureuman, \\\"Teuka bala mus\u00e9m deuk
  nyan na kheueh sabab salah si Saul dan keuluwarga jih, jihnyan ka jipoh mat\u00e9
  banmandum ureu\u00ebng-ureu\u00ebng Gibeon.\\\"\\n2 (Ureu\u00ebng-ureu\u00ebng Gibeon
  nyan bukon ureu\u00ebng Israel; awaknyan jitamong u dalam keulompok ubit nibak ureu\u00ebng
  Amori. Dan di ureu\u00ebng Israel ka jimeujanji bahwa awaknyan teuma jilindong,
  teuma Saul ka jiuseuha keu jipeuhab\u00e9h awaknyan sabab jihnyan nyang jipike na
  kheueh keu keupeuntengan ureu\u00ebng Israel dan Yehuda.) Dan Nabi Daud laju geutaw\u00f6k
  ureu\u00ebng-ureu\u00ebng Gibeon nyan,\\n3 dan geutanyong ubak awaknyan, \\\"Peu
  kheueh nyang jeuet ul\u00f4n peubuet keu gata? Ul\u00f4n keuneuk teuboih buet nyang
  salah nyang ka geupeubuet l\u00e9 Saul u ateueh gata, mangat gata tabri beureukat
  keu umat TUHAN.\\\"\\n4 Jaweueb awaknyan, \\\"Peukara kamoe deungon Saul meunan
  cit deungon keuluwarga gobnyan hana hase teupeuseuleusoe ngon pirak atawa ngon m\u00e9uh,
  teuma dikamoe pih hana meuheuet keuneuk poh mat\u00e9 bahpi meusidroe kong lamkawan
  bansa Israel.\\\" Laju geupeugah lom l\u00e9 Nabi Daud, \\\"Meunyoe meunan, peue
  nyang gata lak\u00e9e jeuet ul\u00f4n peubuet?\\\"\\n5 Jaweueb awaknyan, \\\"Saul
  raja nyang ka geupil\u00e9h l\u00e9 TUHAN nyan geukeuneuk peubinasa kamoe banmandum
  sampoe kamoenyoe ranab nibak bansaboh tanoh Israel.\\n6 L\u00e9 sabab nyan, neuseurah
  kheueh ubak kamoe tujoh droe keuturonan nyang agam, mangat awaknyan kamoe gantung
  dikeue TUHAN di Gibea, banda Raja Saul keudroe.\\\" Geujaweueb l\u00e9 raja, \\\"Get
  kheueh, awaknyan teuma ul\u00f4n jok ubak gata.\\\"\\n7 Teuma sabab Nabi Daud dan
  Yonatan ka lheueh geumeusumpah sabe keudroe-droe geuh, Nabi Daud hana geuseurah
  Mefiboset aneu\u00ebk Yonatan.\\n8 Nyang geucok l\u00e9 Nabi Daud na kheueh Armoni
  dan Mefiboset, nyang na kheueh ban dua droe aneu\u00ebk agam Saul nyang jipeulah\u00e9
  l\u00e9 ma jih ureu\u00ebng inong Rizpa aneu\u00ebk Aya; meunan cit ban limong aneu\u00ebk
  agam si Merab aneu\u00ebk inong Saul, aneu\u00ebk-aneu\u00ebk nyan lah\u00e9 nibak
  hase jimeukawen Merab deungon Adriel aneu\u00ebk si Barzilai, ureu\u00ebng Mehola
  nyan.\\n9 Awaknyan geujok laju ubak ureu\u00ebng-ureu\u00ebng Gibeon, dan ban tujoh
  droe ureu\u00ebng nyan meuninggai mat\u00e9 teugantueng di ateueh buk\u00e9t dikeue
  TUHAN. Huk\u00f6man mat\u00e9 nyan teulaksana nibak mus\u00e9m semi, bak wat\u00e9e
  bak jelai ka jipeuphon koh.\\n10 Dan si Rizpa gundek Saul, jileueng laju ija krong
  keudroe jih di ateueh bat\u00e9e diteumpat many\u00e9t-many\u00e9t nyan teu-\u00e9h
  teulinteung. Rizpa hana jijak nibak teumpat nyan phon awai mus\u00e9m keumeukoh
  sampoe nibak jitreun ujeuen bak mus\u00e9m luroih \u00f4n kay\u00e9e. Gobnyan hana
  jipeubiyeu many\u00e9t-many\u00e9t nyan jicutok l\u00e9 cic\u00e9m-cic\u00e9m \u00f3h
  wat\u00e9e uroe dan l\u00e9 beulatang juah bak wat\u00e9e malam teuka.\\n11 Bak
  wat\u00e9e teujak peugah ubak Nabi Daud peue nyang ka geupeubuet l\u00e9 Rizpa,\\n12
  gobnyan laju geujakcok tuleueng-tuleueng Saul dan Yonatan nibak peunduduek banda
  Yabes di Gilead. (Awaknyan ka jajak cua tuleueng-tuleueng nyan nibak tanoh luwah
  di banda Bet-San, di teumpat ureu\u00ebng Filistin jigantung many\u00e9t-many\u00e9t
  nyan \u00f3h ka lheueh jipeutaloe Saul di buk\u00e9t Gilboa.)\\n13 Banmandum tuleueng
  Saul dan tuleueng Yonatan nyan geuba nibak teumpat nyan, meunan cit geupeusapat
  teuma dumna tuleueng ban tujoh droe ureu\u00ebng nyang ka teugantueng nyan.\\n14
  \u00d3h lheueh nyan tuleueng-tuleueng Saul dan Yonatan dan tuleueng ban tujoh droe
  ureu\u00ebng nyan geutanom laju u dalam jrat Kish bapak Saul di Zela dalam wilayah
  Benyamin. \u00d3h ka seuleusoe banmandum nyan geupeubuet nyang sisuai deungon peurintah
  raja, bar\u00f4 kheueh Po teu Allah geupeukabui do\u00e1 awaknyan keu nanggroe nyan.\\n15
  Lamkawan ureu\u00ebng Filistin dan ureu\u00ebng Israel beureutoih lom prang. Nabi
  Daud dan aneu\u00ebk buah gobnyan geujak laju u mideuen prang keu teujak meuheungko
  deungon ureu\u00ebng Filistin. Dalam prang nyan Nabi Daud jiteuka h\u00e9k nyang
  biet-biet mupalo.\\n16 Dan teuka kheueh ubak gobnyan sidroe ureu\u00ebng rayeuk
  lag\u00e9e gogasi nyang nanjih Yisbi-Benob. Kapak jih teupeug\u00e9t nibak peurunggu
  nyang brat jih na kira-kira lh\u00e9e siteungoh kilo gram. Meunan cit l\u00e9 ureu\u00ebng
  nyan jigulam peudeueng nyang bar\u00f4, dan ureu\u00ebngnyan yak\u00e9n that deungon
  alat jih nyan nibak goenyan ka hase jipeutaloe Nabi Daud.\\n17 Teuma Abisai bin
  Zeruya bagaih that teuka jijak tul\u00f4ng Nabi Daud. Laju jiheuntam gogasi nyan
  dan lam wat\u00e9e sikeujab nyan cit teuma manusia gogasinyan mat\u00e9. \u00d3h
  lheueh nyan aneu\u00ebk buah Nabi Daud jimeulak\u00e9e mangat Nabi Daud geumeujanji
  hana geuseut\u00f4t le \u00f3h wat\u00e9e na prang dipat mantong. \\\"Teungku Amphon
  na kheueh harapan Israel, b\u00e9k sampoe kamoe geumad\u00f4h Teungku Amphon,\\\"
  jipeugah l\u00e9 awaknyan.\\n18 Teuma jiteuka lom prang ngon ureu\u00ebng Filistin
  di Gob. Lam prang nyan Sibkhai ureu\u00ebng Husa jipoh mat\u00e9 teuma sidroe ureu\u00ebng
  gogasi nyang nanjih Saf.\\n19 Nibak prang nyang la\u00e9n deungon ureu\u00ebng Filistin
  di Gob, Elhanan aneu\u00ebk si Yair di Betlehem ka jipoh mat\u00e9 Goliat nibak
  Gat. Go kapak si Goliat nyan na bube kay\u00e9e alat teumpeun ija.\\n20 Na lom muprang
  teulawan ureu\u00ebng Filistin di Gat. Disinan na sidroe ureu\u00ebng gogasi nyang
  lumpah galak jijak muprang. Manusia Gogasi nyan aneuk jaroe jih nam neuk tieb-tieb
  jaroe siblah jaroe dan meunan cit deungon aneuk gaki jih nam neuk cit tieb-tieb
  siblah gaki.\\n21 Ureu\u00ebng nyan jihina ngon jipeuk\u00e9m ureu\u00ebng Israel,
  dan sabab l\u00e9 nyan kheueh jihnyan jipoh mat\u00e9 l\u00e9 Yonatan aneu\u00ebk
  Simea, aduen Nabi Daud.\\n22 Ban peuet droe nyang geupoh mat\u00e9 l\u00e9 Nabi
  Daud dan pasokan gobnyan, na kheueh keuturonan gogasi di Gat.\\nChapter 22\\n1 \u00d3h
  ka lheueh TUHAN geupeuseulamat Nabi Daud nibak Saul dan nibak meubagoe musoh gobnyan
  nyang la\u00e9n, Nabi Daud laju geuca-e ngon lagu nyang ceudah ubak TUHAN:\\n2 Ul\u00f4n
  cinta ubak Droeneueh ya, TUHAN, Droeneueh kheueh teunaga ul\u00f4n.\\n3 TUHAN ban
  lag\u00e9e kuta nyang kong teumpat ul\u00f4n meulindong. Allah ul\u00f4n ban lag\u00e9e
  gunong bat\u00e9e, teumpat ul\u00f4n meureului. Lag\u00e9e peurisai Gobnyan geut\u00f4b
  ul\u00f4n, dan geujaga ul\u00f4n jeuet aman sabe.\\n4 Ul\u00f4n meulak\u00e9e ubak
  TUHAN nyang patot teupujoe, Gobnyan ka geupeu beubaih ul\u00f4n nibak musoh-musoh
  ul\u00f4n.\\n5 Ul\u00f4n jikeulileng l\u00e9 bahya maw\u00f4t dan teugeunang l\u00e9
  i\u00e9 raya keubinasaan.\\n6 Ul\u00f4n jikeulileng l\u00e9 bahya maw\u00f4t, jeunieb
  maw\u00f4t meulinteung dikeue ul\u00f4n.\\n7 Lam keuadaan ul\u00f4n teukeupong l\u00f4n
  meulak\u00e9e ubak TUHAN, ul\u00f4n kliek ubak Allah ul\u00f4n l\u00f4n lak\u00e9e
  tul\u00f4ng. Di Ba\u00e9t Gobnyan TUHAN geudeungoe su ul\u00f4n dan geupeutrok nyang
  ul\u00f4n lak\u00e9e.\\n8 Laju bumoe meuhayak dan meuhayon, gaki-gaki gunong pih
  goyah dan meuhayak sabab Allah ka mureuka!\\n9 Asab jiteubiet meukeubok lam ruhueng
  idong Gobnyan, bara apui nyang hu jiteubiet nibak babah Gobnyan.\\n10 Lang\u00e9t
  dimanyang geuplah dua, laju geutreun kheueh Gobnyan, deungon awan nyang seup\u00f4t
  na dimiyueb gaki Gobnyan.\\n11 Gobnyan geupo sira geugiduek ateueh kerub; Gobnyan
  meulayang di ateueh sayeub ang\u00e9n.\\n12 Geut\u00f4b droe Geuh deungon seup\u00f4t;
  awan ngon reudok nyang teubai jikeulileng Gobnyan.\\n13 Kilat nyang muble dikeue
  Gobnyan, jiteubiet awan, ujeuen \u00e9h meunan cit ngon apui.\\n14 Teuka TUHAN ngon
  su lag\u00e9e lag\u00e9e su geulanteue di lang\u00e9t, Allah Nyang Mahamanyang geupeudeungoe
  su Gobnyan.\\n15 Gobnyan laju geupeutek bubena aneuk panah Geuh, dan sampoe teupeu
  crebre bubena musoh. Gobnyan geuseumama ban lag\u00e9e kilat meu-ulang-ulang dan
  sampoe awaknyan jiplueng teung bayeueng ka hana meuteunt\u00e9e le.\\n16 Tuwie i\u00e9
  la\u00f4t nyang lhok sampoe teubeud\u00f4h dan meunan cit ngon lapek bumoe sampoe
  teuhah bak wat\u00e9e TUHAN geu dump\u00e9k musoh Gobnyan deungon that mureuka.\\n17
  Nibak di manyang TUHAN geusunyueng jaroe Gobnyan; geumat bak ul\u00f4n dan laju
  geutarek dalam i\u00e9 nyang lhok.\\n18 Gobnyan ka geupeuseulamat ul\u00f4n nibak
  musoh nyang kha dan nibak ureu\u00ebng nyang jibanci ul\u00f4n sabab awaknyan lumpah
  that teuga meunyoe ngon ul\u00f4n.\\n19 Awaknyan jiprang ul\u00f4n bak wat\u00e9e
  ul\u00f4n jitimpa l\u00e9 beuncana teuma TUHAN kheueh nyang jeuet keu peunul\u00f4ng
  ul\u00f4n.\\n20 TUHAN kheueh nyang peulheueh ul\u00f4n nibak banmandum bala dan
  nyang peuseulamat ul\u00f4n sabab Gobnyan meukeunong keu ul\u00f4n.\\n21 TUHAN geubalaih
  peue nyang ul\u00f4n peubuet nyang beuna; Gobnyan geubri beureukat keu ul\u00f4n
  sabab ul\u00f4n hana meusalah.\\n22 Ul\u00f4n keubiet that ta\u00e1t ubak peurintah
  TUHAN, dan hana l\u00f4n meupaleng nibak Po teu Allah ul\u00f4n.\\n23 Banmandum
  huk\u00f6m Gobnyan ul\u00f4n peubuet, bubena peurintah Gobnyan hana l\u00f4n peulal\u00e9e.\\n24
  Gobnyan geuteupeue bahwa ul\u00f4n hana meucupa dan l\u00f4n peuji\u00f4h droe nibak
  buet nyang salah.\\n25 Teuma TUHAN geubalaih buet ul\u00f4n nyang beut\u00f4i sabab
  Gobnyan geuteupeue bahwa ul\u00f4n hana meusalah.\\n26 TUHAN, Droeneueh that seutia
  keu ureu\u00ebng nyang seutia dan jroh ubak nyang jroh.\\n27 Ubak ureu\u00ebng suci
  neupeugah Droeneueh suci, dan keu ureu\u00ebng nyang jeuhet jeuet keumusoh TUHAN.\\n28
  Ureu\u00ebng nyang miyueb at\u00e9 TUHAN peuseulamat; teuma ureu\u00ebng nyang congkak
  TUHAN peutundok.\\n29 TUHAN kheueh nyang puhu pany\u00f6t ul\u00f4n; dan TUHAN Allah
  ul\u00f4n kheueh nyang peupeung\u00e9uh ul\u00f4n didalam seup\u00f4t.\\n30 TUHAN
  kheueh nyang peuteuga ul\u00f4n mangat beuhase l\u00f4n peuhanco bubena musoh; deungon
  geubantu l\u00e9 Po teu Allah hase ul\u00f4n peuhanco kuta peutahanan awaknyan.\\n31
  Peue nyang geupeubuet l\u00e9 Po teu Allah na kheueh sampoereuna, dan janji nyang
  ka geupeugah l\u00e9 TUHAN na kheueh jeuet teupeucaya! Gobnyan saban lag\u00e9e
  peurisai l\u00e9 banmandum nyang jijak meulindong ubak Gobnyan.\\n32 Sabab TUHAN
  mantong kheueh nyang Po teu Allah; Allah kheueh nyang jeuet keu nyang bila geutanyoe.\\n33
  Gobnyan na kheueh Po teu Allah nyang peuteuga ul\u00f4n dan Gobnyan geupeubuet rotjak
  ul\u00f4n nyoe aman.\\n34 Gobnyan nyang peukong gaki ul\u00f4n ban lag\u00e9e gaki
  rusa, dan Gobnyan kheueh teuma nyang jaga keuseulamat ul\u00f4n di ateueh gunong-gunong.\\n35
  TUHAN geulatih ul\u00f4n pakriban cara teujak muprang, akh\u00e9jih ka hase ul\u00f4n
  reuntang aneuk panah nyang paleng teuga.\\n36 TUHAN, Droeneueh kheueh nyang peulindong
  dan nyang peuseulamat ul\u00f4n, dan neutumpang ul\u00f4n deungon kuasa Droeneueh
  ul\u00f4n jeuet keumeugah sabab l\u00e9 neutul\u00f4ng l\u00e9 Droeneueh.\\n37 Droeneueh
  teuma nyang jaga ul\u00f4n mangat ul\u00f4n b\u00e9k keunong teuen dan ul\u00f4n
  h\u00e1ntom na reubah.\\n38 Ul\u00f4n tiyeub musoh ul\u00f4n dan ul\u00f4n peutaloe
  awaknyan, dan pantang ul\u00f4n surot sigohlom awaknyan binasa.\\n39 Ul\u00f4n seumpom
  awaknyan sampoe h\u00e1n hase jibeud\u00f4h le, awaknyan reubah hana meudaya dimiyueb
  gaki ul\u00f4n.\\n40 Droeneueh nyang bri teunaga keu ul\u00f4n mangat jeuet l\u00f4njak
  muprang, dan keuhai meunang ateueh musoh-musoh ul\u00f4n.\\n41 Droeneueh nyang peucrok
  sampoe musoh ul\u00f4n jiplueng nibak ul\u00f4n; dan ureu\u00ebng nyang jibanci
  keu ul\u00f4n ka hab\u00e9h ul\u00f4n peubinasa.\\n42 Awaknyan jilak\u00e9e tul\u00f4ng,
  teuma hana nyang tem bantu, awaknyan jimeuh\u00f4i TUHAN, teuma hana geujaweueb.\\n43
  Awaknyan ul\u00f4n peuhanco ngon ul\u00f4n peureumok ban lag\u00e9e ab\u00e9e nyang
  ro meutabu, dan ul\u00f4n samp\u00f4h ban lag\u00e9e luhob nibak rot raya.\\n44
  Droeneueh nyang peubeubaih ul\u00f4n nibak kaw\u00f6m nyang doraka, dan neupeujeuet
  ul\u00f4n keupeunguasa ateueh bansa-bansa; bansa nyang hana ul\u00f4n turi ka jeuet
  keunamiet ul\u00f4n.\\n45 Meunan cit deungon ureu\u00ebng as\u00e9ng jitundok ubak
  ul\u00f4n, dan jita\u00e1t meunyoe jideungoe peurintah ul\u00f4n.\\n46 Beuh\u00e9
  ngon ceubeueh awaknyan ka gad\u00f4h; awaknyan yo meug\u00e1m-g\u00e1m laju jiteubiet
  nibak kuta jih.\\n47 TUHAN udeb! Teupujoe kheueh nyang bila ul\u00f4n! Teupeu agong
  kheueh keubeusaran Allah, nyang peuseulamat ul\u00f4n!\\n48 Gobnyan nyang peumeunang
  Ul\u00f4n ateueh musoh ul\u00f4n, meunan cit deungon bansa-bansa geupeutaklok dikeue
  ul\u00f4n,\\n49 meunan cit geupeuseulamat ul\u00f4n ateueh lawan-lawan ul\u00f4n.
  TUHAN, Droeneueh nyang bri meunang ateueh musoh ul\u00f4n, Droeneueh nyang lindong
  ul\u00f4n nibak ureu\u00ebng nyang keujam.\\n50 Teuma ul\u00f4n peuagong Droeneueh
  lamkawan bubena bansa, dan ul\u00f4n meuca-e lagu seumujoe ubak Droeneueh.\\n51
  Allah ka geubri meunang nyang lumpah raya keu raja nyang geubai\u00e1t l\u00e9 Gobnyan,
  Gobnyan teutab geugas\u00e9h ubak ureu\u00ebng nyang ka geupil\u00e9h, nyang kheueh
  Nabi Daud dan keuturonan gobnyan keu siumu masa.\\nChapter 23\\n1 Nabi Daud aneu\u00ebk
  Isai teupil\u00e9h jeuet keuraja dan geupeujeuet jeuet keu ureu\u00ebng rayeuk l\u00e9
  Po teu Allah Nabi Yakub. Gobnyan teuma nyang karang bubena ca-e-ca-e keu bansa Israel.
  Nyoe kheueh nariet Nabi Daud nyang keuneuleueh:\\n2 Roh TUHAN ka geupeugah meulalu
  ul\u00f4n; peusan dan amanat Gobnyan na nibak bibi ul\u00f4n.\\n3 Po teu Allah Nabi
  Yakub ka geupeugah haba; ubak ul\u00f4n peulindong Israel geupeugah meunoe: \\\"Raja
  geupeurintah rakyat deungon keuadelan nyang geupimp\u00e9n deungon keuta\u00e1tan
  ubak TUHAN,\\n4 Gobnyan ban lag\u00e9e cahya mata uroe nyang mantong meureukah bak
  wat\u00e9e teungoh malam deungon lang\u00e9t mantong gleh meucahya. Gobnyan ban
  lag\u00e9e cahya mata uroe beungoh nyang ban hab\u00e9h jisiram l\u00e9 ujeuen treun
  sampoe naleueng jitimoh ijo lagak muble-ble.\\\"\\n5 Meunan cit deungon keuturonan
  ul\u00f4n nyang geubri beureukat l\u00e9 Po teu Allah, janji Gobnyan ubak ul\u00f4n
  hana meu-ubah, janji Geuh nyan na kheueh keukai dan sampoereuna, teu-ato didalam
  mubagoe hai. Po teu Allah geujamin meunang u ateueh ul\u00f4n, dan geujamin peue
  mantong nyang ul\u00f4n meuheuet.\\n6 Teuma keu ureu\u00ebng nyang hana jita\u00e1t
  ubak TUHAN na kheueh saban lag\u00e9e duro nyang teutiek. Jaroe gob hana hase jimumat;\\n7
  hana meusidroepi nyang jitem cuk\u00e9h meunyoe tan na alat nyang teupeug\u00e9t
  nibak kay\u00e9e atawa beuso. Bubena ureu\u00ebng nyan ka hanco jiliet l\u00e9 apui.\\n8
  Nyoe kheueh nan-nan bubena peuwira Nabi Daud nyang paleng meusyeuhu: Nyang phon
  that na kheueh Ishbaal, ureu\u00ebng Hakhmoni, peumimp\u00e9n \\\"Keulompok Lh\u00e9e\\\"
  (Triwira). Ka lheueh teujadi nibak saboh prang gobnyan geumuprang ngon lawan na
  lapan reutoih droe teuma digobnyan geumuprang nyan na kheueh ngon kapak gobnyan.\\n9
  Ureu\u00ebng nyang keudua didalam Triwira nyan na kheueh Eleazar aneu\u00ebk Dodo
  nibak kaw\u00f6m Ahohi. Gobnyan geuir\u00e9ng Nabi Daud bak wat\u00e9e awaknyan
  geumuprang ngon ureu\u00ebng Filistin nyang meusapat keuneuk jijakmuprang. Laju
  bak wat\u00e9enyan cit teuma pasokan Israel jisurot,\\n10 Eleazar hana jipi\u00f4h
  jimeujuang jiheungko ureu\u00ebng Filistin sampoe \u00e1n awaknyan kaseb h\u00e9k.
  Jaroe gobnyan ka jeuet keukeuboh bak jimat peudeueng sampoe peudeueng nyang na nibak
  jaroe gobnyan hana hase jipeuleueh. Bak uroenyan TUHAN geupeumeunang nyang lumpah
  rayeuk keu bansa Israel. Pasokan Israel nyang teungoh jisurot bunoe jiriwang lom
  ubak teumpat Eleazar nyang teungoh muprang, laju awaknyan jisuit baj\u00e9e-baj\u00e9e
  nyang na nibak many\u00e9t-many\u00e9t nyang ka mat\u00e9 disinan.\\n11 Ureu\u00ebng
  keu lh\u00e9e didalam Triwira nyan na kheueh Sama aneu\u00ebk Age di Harari. Ka
  lheueh teujadi bak wat\u00e9e ureu\u00ebng Filistin teungoh meusapat di Lehi, nibak
  saboh lamp\u00f4h nyang peunoh teupula ngon boh reuteuk mirah, pasokan Israel jiplueng
  nibak ureu\u00ebng Filistin.\\n12 Teuma si Sama teutab jimeuheungko, jipoh mat\u00e9
  dan geupeutaloe ureu\u00ebng Filistin, sampoe gobnyan meuhase jipeuteuen lamp\u00f4h
  jih nyan. Meunan kheueh cara jih TUHAN ka geubri meunang nyang lumpah rayeuk.\\n13
  Bak uroe nyang la\u00e9n karab t\u00f4 ngon mus\u00e9m keumeukoh, na lh\u00e9e droe
  ureu\u00ebng nibak\\n30 droe peuwira Nabi Daud nyang paleng meusyeuhu geutreun ubak
  Guha Adulam. Bak wat\u00e9enyan Nabi Daud na didalam kuta di dalam guha nyan. Seudangkan
  ureu\u00ebng Filistin na teuma jipeudong khimah di Pant\u00f4n Refaim, dan na saboh
  pasokan nibak awaknyan ka jiduek di Betlehem.\\n15 Nabi Daud hana geusangka-sangka
  ka teuka rindu ngon meuc\u00e9n u gamp\u00f4ng halaman geuh nyan dan geupeugah laju,
  \\\"Ah, meunyoe na nibak ul\u00f4n jibri i\u00e9 jieb nibak mon nyang tou ngon pintoe
  geureubang di Betlehem!\\\"\\n16 Ban jideungoe nyang lag\u00e9e nyan teuka kheueh
  lh\u00e9e droe peuwira gobnyan laju jiteurobos khimah-khimah ureu\u00ebng Filistin
  nyan, laju jijak crong i\u00e9 lam mon nyan, \u00f3h lheueh nyan i\u00e9 nyang ka
  lheueh teu crong nyan jiba laju ubak Nabi Daud. Teuma Nabi Daud hana geutem jieb
  i\u00e9 nyan, teuma laju geuro i\u00e9 nyan sibagoe peuseumahan ubak TUHAN.\\n17
  Gobnyan geupeugah, \\\"Ya TUHAN, ul\u00f4n h\u00e1n hase ul\u00f4n jieb i\u00e9
  nyoe! Meunyoe ul\u00f4n jieb, siulah-ulah ka ul\u00f4n jieb darah ureu\u00ebng nyang
  ka jipeusabong nyaw\u00f6ng jih!\\\" Jadi Nabi Daud mubacut pi hana geutem jieb
  i\u00e9 mon nyan. Nyan kheueh jasa-jasa peujuang nyang lh\u00e9e droe lom peukasa
  nyan.\\n18 Ban lh\u00e9e ploh droe peuwira nyan geuboh teuma nan jih deungon \\\"Tridasawira\\\".
  Awaknyan geupimp\u00e9n l\u00e9 Abisai adoe Yoab, aneu\u00ebk Zeruya. Ka lheueh
  l\u00e9 gobnyan geupoh mat\u00e9 lh\u00e9e reutoih droe deungon kapak gobnyan. Sabab
  nyan kheueh gobnyan meutamah meugah ngon meusyeuhu. Teuma gobnyan hana lag\u00e9e
  hibat \\\"Triwira\\\".\\n20 Na sidroe teuk peuwira nyang paleng meusyeuhu nan jih
  Benaya aneu\u00ebk Yoyada ureu\u00ebng Kabzeel. Ureu\u00ebng nyan g\u00e9t that
  beurani lom ngon ceubeueh. Na dua droe pahlawan rayeuk nibak Moab ka geupoh mat\u00e9.
  Ka lheueh na teujadi nibak siuroe nyang meusalju, gobnyan geutamong u dalam saboh
  guha, \u00f3h trok keunan laju geupoh mat\u00e9 saboh singa nyang na disinan.\\n21
  Meunan cit gobnyan ka lheueh teuma geupoh mat\u00e9 sidroe ureu\u00ebng Meus\u00e9,
  nyang keubiet beuh\u00e9 ngon meusinjata kapak. Teuma Benaya geuhadab ureu\u00ebng
  nyan teuma deungon tungkat. Seudangkan kapak nyang na nibak jaroe ureu\u00ebng Meus\u00e9
  nyan geuteum\u00e9 reubot dan ngon kapak nyan cit teuma geupoh mat\u00e9 ureu\u00ebng
  Meus\u00e9 nyan.\\n22 Nyan kheueh jasa-jasa Benaya, sidroe nibak \\\"Tridasawira\\\".\\n23
  Lamkawan nyan Benaya kheueh nyang paleng meusyeuhu, teuma gobnyan hana saban hebat
  jih lag\u00e9e \\\"Triwira\\\". Nabi Daud geuangkat gobnyan jeuet keu ul\u00e9e
  peungawai pribadi gobnyan.\\n24 Anggota-anggota nyang la\u00e9n nibak \\\"Tridasawira\\\"
  na kheueh: Asael adoe Yoab Elhanan aneu\u00ebk Dodo ureu\u00ebng Betlehem Sama dan
  Elika ureu\u00ebng Harod Hele ureu\u00ebng Palti Ira aneu\u00ebk Ikes ureu\u00ebng
  Tekoa Abiezer ureu\u00ebng Anatot Membunai ureu\u00ebng Husa Zalmon ureu\u00ebng
  Ahohi Maharai ureu\u00ebng Netofa Heleb aneu\u00ebk Baana ureu\u00ebng Netofa Itai
  aneu\u00ebk Ribai ureu\u00ebng Gibea diwilayah suk\u00e9e Benyamin Benaya ureu\u00ebng
  Piraton Hidai ureu\u00ebng di pant\u00f4n-pant\u00f4n Gaas Abialbon ureu\u00ebng
  Araba Azmawet ureu\u00ebng Bahurim Elyahba ureu\u00ebng Saalbon Aneu\u00ebk-aneu\u00ebk
  Yasyen Yonatan Sama ureu\u00ebng Harari Ahiam aneu\u00ebk Sarar ureu\u00ebng Harari
  Elifelet aneu\u00ebk Ahasbai ureu\u00ebng Maakha Eliam aneu\u00ebk Ahitofel ureu\u00ebng
  Gilo Hezrai ureu\u00ebng Karmel Paerai ureu\u00ebng Arbi Yigal aneu\u00ebk Natan
  ureu\u00ebng Zoba Bani ureu\u00ebng Gad Zelek ureu\u00ebng Amon Naharai ureu\u00ebng
  Beerot, nyang gulam sinjata Yoab Ira dan Gareb ureu\u00ebng Yetri Uria ureu\u00ebng
  Het. Bandum nyan na lh\u00e9e ploh tujoh droe tantra nyang paleng meusyeuhu.\\nChapter
  24\\n1 TUHAN geubeung\u00e9h lom ubak bansa Israel, laju Nabi Daud geubujuk deungon
  meukeusut geupeuteuka keusosahan u ateueh bansa nyan. Feureuman TUHAN ubak gobnyan,
  \\\"Tapeubuet kheueh laju peurintah Ul\u00f4n nyoe mangat tapeuna seunsus di nanggroe
  Israel dan Yehuda.\\\"\\n2 Geupeugah kheueh laju l\u00e9 Nabi Daud ubak Yoab panglima
  tantra gobnyan, \\\"Tajak kheueh laju meusajan deungon peuwira-peuwira gata ubak
  banmandum suk\u00e9e Israel di bansaboh nanggroe keu tajak catat seunsus. Ul\u00f4n
  keuneuk teupeue padubna jeumeulah awaknyan.\\\"\\n3 Teuma Yoab geupeugah laju ubak
  raja, \\\"Seumoga TUHAN Po teu Allah Teungku Amphon geupeulipat ganda rakyat Israel
  trok ubak sireutoih lipat nibak nyang na jinoenyoe, dan meunan cit seumoga Teungku
  Amphon mantong udeb mangat jeuet neukalon hase jihnyan. Teuma keupeue Teungku Amphon
  neukeuneuk teupeu seunsus nyan?\\\"\\n4 Teuma l\u00e9 raja teutab geumumat ubak
  peurintah nyan. Jadi Yoab meunan cit deungon peuwira nyang la\u00e9n laju jijak
  itong jeumeulah bansa Israel.\\n5 \u00d3h ka leupah jijeumeurang Krueng Yordan,
  Yoab dan aneu\u00ebk buah gobnyan geupeudong laju khimah disiblaih seulatan Aro\u00ebr,
  Aro\u00ebr nyan na kheueh saboh banda di teungoh-teungoh pant\u00f4n wilayah Gad.
  Jibeud\u00f4h disinan awaknyan jijak laju u arah utara, Yeazer nan jih,\\n6 beud\u00f4h
  sinan laju jijak dan sampoe u Gilead dan u Kades didalam wilayah ureu\u00ebng Het.
  \u00d3h ka lheueh nyan jijak laju nibak Dan wet u, arah barat, u Sidon.\\n7 Geubeud\u00f4h
  sinan awaknyan jijak laju u arah seulatan u Tirus banda nyang na kuta nyan. Lheuehnyan
  awaknyan jijak laju ubak mandum banda ureu\u00ebng Hewi dan ureu\u00ebng Kanaan,
  dan akh\u00e9ji u Bersyeba, dibagian seulatan Yehuda.\\n8 Awaknyan jibl\u00f4h laju
  bansaboh nanggroe lam tempo sikureueng buleuen dua ploh uroe. \u00d3h lheuehnyan
  jiwoe kheueh laju awaknyan u Yerusalem\\n9 dan jijak lapor ubak raja Nabi Daud hase
  nibak seunsusnyan. Jeumeulah ureu\u00ebng agam nyang ka peunoh syarat keu jeuet
  teutamong tantra na 800.000 droe di Israel dan 500.000 droe na di Yehuda.\\n10 Teuma
  \u00f3h ka lheueh Nabi Daud geu itong bansanyan, Gobnyan ka meurasa meusalah, laju
  geupeugah ubak TUHAN, \\\"Ya TUHAN, ul\u00f4n that-that meudesya! Neupeu amphon
  kheueh ul\u00f4n nyoe, sabab peue nyang ka ul\u00f4n peubuet nyan na kheueh keureuja
  nyang lupah bangai.\\\"\\n11 Laju TUHAN meufeureuman ubak Nabi Gad nyang jeuet keupeurantara
  lamkawan Nabi Daud ngon TUHAN, \\\"Tajak peugah kheueh laju ubak Nabi Daud bahwa
  ul\u00f4n jok keu jihnyan na lh\u00e9e boh peunil\u00e9h. Peue mantong nyang jipil\u00e9h
  lamkawan lh\u00e9e nyan teuma ul\u00f4n peubuet.\\\" Banbeungoh singoh, bak wat\u00e9e
  Nabi Daud banmantong jibeud\u00f4h \u00e9h,\\n13 laju Gad teuka jijak meuhadab dan
  geupeugah laju ubak gobnyan peurintah TUHAN nyan, geupeugah, \\\"Nyang toh nyang
  Teungku Amphon pil\u00e9h: Nanggroe nyoe jiteuka l\u00e9 bala mus\u00e9m deuk nyang
  treb jih na lh\u00e9e thon, atawa Teungku Amphon neuplueng jil\u00e9t-l\u00e9t l\u00e9
  musoh nyang treb jih na teuma lh\u00e9e buleuen, atawa nanggroe nyoe jiprang l\u00e9
  bala peunyak\u00e9t nyang treb jih lh\u00e9e uroe? Neupeuput\u00f4h kheueh laju
  jinoenyoe peue nyang har\u00f4h ul\u00f4n peugah ubak TUHAN.\\\"\\n14 Geujaweueb
  l\u00e9 Nabi Daud, \\\"Aduh! Mupalo ul\u00f4n! Teuma nibak ul\u00f4n jihuk\u00f6m
  l\u00e9 manusia, leubeh g\u00e9t geutanyoe banmandum geuhuk\u00f6m l\u00e9 TUHAN,
  sabab Gobnyan rayeuk that gas\u00e9h sayang Geuh.\\\"\\n15 Teuma TUHAN laju geupeutreun
  bala peunyak\u00e9t u ateueh bansa Israel phon nibak beungoh nyan sampoe ubak wat\u00e9e
  nyang ka geuteutab nyan. Bansaboh Israel na 70.000 droe meuninggai donya.\\n16 Malaikat
  TUHAN geupeutreun bala maw\u00f4t nyan sampoe ubak ureu\u00ebng nyang teungoh jiceumeulo
  boh gandom atra su Arauna, ureu\u00ebng Yebus. Bak wat\u00e9e TUHAN geukalon bahwa
  malaikat Geuhnyan ka siab teuma keu jipeuhanco Yerusalem, laju TUHAN geu-ubah keuputosan
  Gobnyan, dan Gobnyan laju geupi\u00f4h geuhuk\u00f6m bansa nyan. Geupeugah ubak
  malaikat nyan, \\\"Kaseb nyan! Neupi\u00f4h!\\\"\\n17 Nadi Daud deuh geukalon malaikat
  teungoh geutarek nyaw\u00f6ng bansa gobnyan, laju gobnyan geupeugah ubak TUHAN,
  \\\"Ul\u00f4n kheueh nyang meudesya, sabab ul\u00f4n nyang peubuet salah nyan. Teuma
  peu kheueh salah jih ateueh bansa nyang malang nyan? Neu huk\u00f6m kheueh ul\u00f4n
  dan keuluwarga ul\u00f4n!\\\"\\n18 Bak uroenyan cit teuma Gad teuka geujak meuhadab
  ubak Nabi Daud dan geupeugah laju ubak gobnyan, \\\"Beubagaih kheueh laju Teungku
  Amphon neujak \u00e9k u ateueh teumpat ureu\u00ebng teungoh ceumeulo gandom atra
  Arauna nyan, dan neupeudong laju miseubah keu TUHAN.\\\"\\n19 Dan geujak kheueh
  laju Nabi Daud pakriban nyang ka geu peurintah l\u00e9 TUHAN nyang ka geupeusampoe
  ubak gobnyan meulalu Nabi Gad nyan.\\n20 \u00c2ih teuma Arauna bak wat\u00e9e nyan
  teungoh jiceungeuek u miyueb, dan deuh laju jikalon raja ji-ir\u00e9ng l\u00e9 bubena
  peuikot gobnyan teungoh geujak geutuju ubak Arauna. Arauna laju geusujut dikeue
  Nabi Daud,\\n21 dan jitanyong, \\\"Peue meukeusut Teungku Amphon neuteuka keunoe?\\\"
  Geujaweueb Nabi Daud, \\\"Ul\u00f4n keuneuk bloe teumpat loe gandom nyoe, mangat
  di ateueh nyoe ul\u00f4n peudong miseubah ubak TUHAN sampoe bubena peunyak\u00e9t
  nyang teungoh jiteuka lam nanggroe geutanyoe nyoe hase teusamp\u00f4h.\\\"\\n22
  Geupeugah l\u00e9 Arauna, \\\"Neucok kheueh laju Teungku Amphon, dan neupeuseumah
  laju ubak TUHAN peue nyang Teungku Amphon rasa g\u00e9t. Nyoe leum\u00f4-leum\u00f4
  keu keureubeuen nyang teutot dan keu kay\u00e9e sinungo apui jih Teungku Amphon
  jeuet neucok tangke langai dan papeun-papeun ceumeulo nyan.\\\"\\n23 Banmandum nyan
  geubri l\u00e9 Arauna ubak raja, sira geupeugah, \\\"Bah kheueh TUHAN Po teu Allah
  Teungku Amphon geuteurimong peuseumahan Teungku Amphon nyan.\\\"\\n24 Teuma Raja
  Nabi Daud geujaweueb, \\\"B\u00e9k! Atra droeneueh nyan ul\u00f4n bloe mantong.
  Ul\u00f4n h\u00e1n l\u00f4ntem keureubeuen keu TUHAN Allah deungon sapeue-sapeue
  nyang ul\u00f4n teum\u00e9 deungon meunang mantong.\\\" Laju Nabi Daud geubloe teumpat
  ceumeulo gandom si Arauna nyan meunan cit deungon leum\u00f4-leum\u00f4 geuhnyan
  deungon yuem limong ploh p\u00e9ng pirak.\\n25 Laju Nabi Daud geupeudong miseubah
  disinan keu TUHAN dan geupeuseumah laju keureubeuen nyang teutot dan keureubeuen
  peudam\u00e9. TUHAN geupeukabui laju do\u00e1 Nabi Daud, dan deungon nyan teuhinda
  kheueh bala peunyak\u00e9t nyang ka jiheuntam nanggroe Israel nyan.\"", "\"Tempat
