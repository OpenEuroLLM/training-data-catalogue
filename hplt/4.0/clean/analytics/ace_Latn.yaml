sample: '["\"Keuluaran\\nChapter 37\\nBezaleel laju jipeuget Peuto Peujanjian nibak
  kay\u00e9e akasia, panyang jih 110 seuntimet\u00e9e, luwah dan manyang jih mas\u00e9ng-mas\u00e9ng
  na 66 seuntimet\u00e9e.\\n2 Siblah udalam meunan cit ngon siblah u luwa teuseup\u00f4h
  ngon m\u00e9uh aseuli, \u00f3h lheueh nyan laju jipeug\u00e9t bingk\u00e9e m\u00e9uh
  bansilingka jih.\\n3 \u00d3h lheuehnyan jipeuget teuma peuet boh gleung m\u00e9uh
  keukay\u00e9e ngon gulam jih dan laju jipasang nibak ban peuet boh gaki nyan, dua
  boh gleung nibak tieb-tieb sagoe.\\n4 Meunan cit jipeuget teuma ngon gulam jih nibak
  kay\u00e9e akasia, dan atranyan pih teuseup\u00f4h ngon m\u00e9uh,\\n5 laju kay\u00e9e
  geunulam nyan jipeutamong lam gleung nibak tieb-tieb sagoe nyan.\\n6 \u00d3h lheuehnyan
  jipeuget teuma saboh sinut\u00f4b nibak m\u00e9uh aseuli, panyang jih na 110 seuntimet\u00e9e
  dan luwah jih 66 seuntimet\u00e9e.\\n7 Meunan cit jipeuget teuma dua boh kerub nibak
  m\u00e9uh teuteumpah,\\n8 saboh nibak tieb-tieb ujong sinut\u00f4b nyan. Bandua
  boh kerub nyan teupeujeuet saboh bagian ngon sinut\u00f4b jih\\n9 dan atranyan jipeug\u00e9t
  meuhadab-hadab keue, deungon sayeub nyang teupeunyue sampoe teut\u00f4b peuto nyan.\\n10
  Bezaleel jipeug\u00e9t meuja nibak kay\u00e9e akasia, nyang panyang jih na 88 seuntimet\u00e9e,
  luwah jih 44 seuntimet\u00e9e dan manyang jih 66 seuntimet\u00e9e.\\n11 Meuja nyan
  teuseup\u00f4h ngon m\u00e9uh aseuli dan bansilingka nyan jipasang teuma ngon bingk\u00e9e
  m\u00e9uh.\\n12 Laju jipeug\u00e9t teuma bin\u00e9h meuja nyang luwah jih 7,5 seuntimet\u00e9e.
  Bin\u00e9h nyan teuboh teuma ngon bingk\u00e9e m\u00e9uh bansilingka.\\n13 Jipeug\u00e9t
  teuma peuet boh gleung keu ngon geunulam atranyan dan laju jipasang nibak ban peuet
  boh gaki meuja.\\n14 Gleung keu ngon peuteun kay\u00e9e geunulam nyan jipasang nibak
  thon ngon bin\u00e9h meuja.\\n15 Geunulam nyan teupeug\u00e9t nibak kay\u00e9e akasia
  dan teuseup\u00f4h teuma ngon m\u00e9uh.\\n16 Meunan cit jipeug\u00e9t teuma cipe-cipe,
  cangkie-cangkie, keundi-keundi dan camb\u00f4ng-camb\u00f4ng keuteumpat teupeuseumah
  i\u00e9 angg\u00f4. Banmandum peuleungkapan meuja nyan jipeug\u00e9t nibak m\u00e9uh
  aseuli.\\n17 Bezaleel jipeug\u00e9t teuma gaki pany\u00f6t nibak m\u00e9uh aseuli.
  Keunaleueng dan tangke teumpat mat jih teupeug\u00e9t teuma nibak m\u00e9uh teuseup\u00f4h.
  Bung\u00f6ng-bung\u00f6ng teuhias, meunan cit ngon kumb\u00e9e dan keulopak jih
  teupeug\u00e9t saboh ngon tangke teumpat mat jih.\\n18 Nibak tangke ngon teumpat
  nyan jipeug\u00e9t teuma nam boh cabeueng nibak tieb-tieb sagoe jih.\\n19 Nibak
  tieb-tieb cabeueng jih teuhias teuma deungon lh\u00e9e boh bung\u00f6ng badam deungon
  kumb\u00e9e-kumb\u00e9e dan keulopak jih.\\n20 Nibak tangke teumpat mat jih teuhias
  teuma deungon peuet boh bung\u00f6ng badam deungon kumb\u00e9e dan keulopak jih.\\n21
  Dimiyueb tieb-tieb cabeueng keulopak nyan teupeug\u00e9t teuma saboh kumb\u00e9e.\\n22
  Bansaboh gaki pany\u00f6t nyan deungon kumb\u00e9e-kumb\u00e9e dan cabeueng-cabeueng
  jih teupeug\u00e9t nibak sikr\u00e9ek m\u00e9uh teuseup\u00f4h aseuli.\\n23 Nibak
  gaki pany\u00f6t nyan teupeug\u00e9t teuma tujoh boh pany\u00f6t meunan cit deungon
  alat keu ngon peugleh dah pany\u00f6t dan talam jih nibak m\u00e9uh aseuli.\\n24
  Keuteupeug\u00e9t gaki pany\u00f6t meunan cit deungon peuleungkap jih teupeureul\u00e9e
  35 kilogram m\u00e9uh aseuli.\\n25 Bezaleel jipeug\u00e9t teuma nibak kay\u00e9e
  akasia saboh miseubah keu teumpat tot dupa. Miseubah nyan hi jih meusagoe; panyang
  dan luwah jih mas\u00e9ng-mas\u00e9ng 45 seuntimet\u00e9e dan manyang jih 90 seuntimet\u00e9e.
  Nibak ban peuet boh sagoe blaih si u ateueh jipeug\u00e9t teuma lungk\u00e9e nyang
  jeuet meusaboh ngon miseubah nyan.\\n26 Siblaih u ateueh, ban peuet boh sagoe meunan
  cit ngon lungk\u00e9e-lungk\u00e9e jih teuseup\u00f4h teuma ngon m\u00e9uh aseuli
  dan bansilingka jih teupeug\u00e9t teuma ngon bingk\u00e9e m\u00e9uh.\\n27 Jipeug\u00e9t
  cit teuma dua boh gleung dimiyueb bingk\u00e9e m\u00e9uh nibak bandua boh sagoe
  jih keungon peuteun kay\u00e9e geunulam miseubah nyan.\\n28 Geunulam nyan teupeug\u00e9t
  nibak kay\u00e9e akasia dan teuseup\u00f4h deungon m\u00e9uh.\\n29 Bezaleel jipeug\u00e9t
  miny\u00e9uk upacara dan dupa aseuli nyang mangat b\u00e9e, teujampu lag\u00e9e
  miny\u00e9uk mangat b\u00e9e.\"", "\"Hikayat Muda Seudang Pt. 4; Masa Abege Sa\\nMalam
  meugantoe uroe trouh teuka\\nHan jan ta kira ka meutuka thon\\nUdep lam donya chit
  han ek ta rika\\nMeunan keuh haba jinoe ta peu phon\\nTamse angen pout deurui bak
  badan\\nUmmi Po Intan seunang that ate\\nGeu kalon aneuek ka rayeuk sajan\\nRupa
  jih tampan meunarek abege\\nUmu lhee blah thon masa periang\\nNyak Muda Seudang
  jinoe reumaja\\nMeusoe nyang kalon hatee geuh seunang\\nAkai geuh sopan narit geujaga\\nPat
  mantong tumpok geujak meu''en bhan\\nJi seutot rakan meu ikue dilikot\\nHan pileh
  parheuk bak mita rakan\\nMeunan e taulan wasiet ma geu turot\\nMeunan chit paban
  bak kawee eungkot\\nMata meusangkot dalam krueng saja\\nHan geu keureuleng sampeng
  ngon likot\\nTakot deuh teu-ot di aneuek dara\\nMata geupeulara babah meukatob\\nGet
  that geu takot tamong nuraka\\nJioh that bida ngon aneuek bang akob\\nUlee tan teutop
  narit tan soe kira\\nMeunan chit buet hai rakan seutia\\nMarwah geujaga adat that
  lambong\\nUmu lhee blah thoun mantong belia\\nJeut keu permata ban saboh gampong\\n''Oh
  malam uroe geu beuet cong balee\\nNyang jeut keu guree Abu Peh Tima\\nKitab nyang
  geubeut ka bajuri lhee\\nMeunan ileumee jeumot geumita\\nBek tuwoe neubaca chit
  ata awai mangat meuho;\\n- Bhah lhee Muda Lam Ayon\\n- Bhah dua Awai Phoun Mula\\n-
  Bhah sa Muqaddimah\\nHai, helo @lamkote! Ini artikelnya bagus.. telah kami resteem
  ke 7617 follower ya.. (Seberkas kontribusi kami sebagai witness di komunitas Steemit
  Indonesia.)\\nka mantap.. na panyang masa abege nyan teuma.. neu tamah meu 8 boh
  bareh teuk hai..\\nNyan abg bhah sa, na bhah dua lom singoh malam. Taci ringkas
  bacut sapat bek panyang that bosan ureung baca\\nneu peu panyang kata lam bareh
  mantong.. hikayat chit panyang, miseu ka neubuka phon, bek neu cawo lee, neu lanjut
  calitra sampo akhe, meusambong ujongnya sama.. aci kalon atra TA sakti tuleh, lagak
  chit hai. ka jeut nyan.. si uroe saboh 60 atawa 80 bareh mantong\\nKon han lon peu
  panyanh kon chit han lon peu indah, watee lon nyang singkat. Kadang hana lon teumee
  edit.\\nMaklum, woe kanto lon jak u balee jak seumeubeut.\\nLheuh nyan lon woe u
  keude lon meu hareukat.\\nSabtu ngon minggu lon jak u lampoh.\\nAlhamdulillah adak
  sempit watee lon peusiblah meubacut keu steemit.\\nSaran droe neuh akan ta jadikan
  pertimbangan.\\nInsya Allah, meuphom uloen tiwan ngon kada keadaan droun. Nyang
  penteng ta useuha kiban jeut. Uloen pih suwah peubereih jai that cara teumuleh nyang
  salah. Lah pih ka loen cok pangsion.. hana that sibok, maguen saja nyang brat bacut.\\nRencana
  lon tuan meunyoe na geubri sehat badan nibak Allah ta''ala, lon peugot hikayat beugot
  dile sampoe lheuh baro lon posting.\\nNyoe wate taneuk posting baro ta pike, ya
  kualitas meunurot kada\\nnyan ban... ken ka meusaneut menyo na ta baca meusambong
  sambong \ud83d\ude02\ud83d\ude02\\nSaket ulee bak ta pike seunambong.\\nInsya Allah
  akan ta useuha sampoe seuleusoe\\nmye jak,jak btroh\\nbek mtanggoh singoh lusa\\nmye
  han, pgah beu awai\\nbek smpe mumang urg yg baca\\nmeu ah hai rakn kon ulon proteh\\ntpi
  nyan keu daleh keu mgt haba\\nmuda seudang nyn dum urg preh2\\nkrn kasaheh dlm adt
  budaya\\nmeuseumong.........+++\\nTeurimong geunaseh ka trouh neu teuka keuno.\\nLon
  pih lakee meu''ah saweub trep2 sigo lon jak saweu syedara. Nyan karena watee nyang
  sempit\\nsama2,\\nyg pntg hate bek putoh wlopun gdoeh dlm mrika, krn hba lm jarak
  jaoh bah pih sigo2 troh nyn hna peukarha\\nasai slm sbe ta laboh bah pih roh eungkot
