  keurija\\nJanda ngoen pateng, pih tan soe pakoe\\nJinoe ka laloe, atoe duek raja\\nMiseu
  DPR , bacut lon muproe\\nKa laloe keudroe, mita beulanja\\nDana Aspirasi, peuduek
  juet sagoe\\nYang peuteng keudroe, tamoeng beulaja\\nSeurambi tiep uroe , neucuba
