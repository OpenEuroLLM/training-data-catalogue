  meututoe, mustahil Allah nyang bisu\\nSifeut Nyang Jaiz Bak Allah Ta''ala Na Saboh
  Sifeut, Neupeujeut Segala Mumkin\\nNadham Nyoe Keuneubah Ulama Awai, Kamoe\\nTeurimong,
  Kamoe Meurunoe ngon Kamoe Hafai Nibak Gure-Gure Yoh Wate Kamoe\\nMantong Cut...Nyoe
  Keuh Aqidah Rasululah Saw, Aqidah Sahabat ngon Tabi''in, Ulama Salaf ngon Khalaf,
