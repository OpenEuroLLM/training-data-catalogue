  cat\u00f2\u0142eghi[canbia | canbia el c\u00f2daxe]\\nSant''Adelaide, Sant''Adelardo,
  Sant''Adone, Sant''Albina e Sant''Everardo\"", "\"Autor:Jacopo Vincenzo Foscarini\\nJacopo
  Vincenzo Foscarini (Venesia, 8 novenbre 1783 - Miran, 20 zugno 1864), dito anca
  el barcariol o Giacomo Vicenzo Foscarini, nobile e poeta venexian.\\nTesti\\nCanti
  patriotici del 1848-49[canbia]\\nCanti patriotici scriti durante l''insuression
  de Venexia contro i Austriaci del 1848-49, public\u00e0 soto vari pseudonimi, con
  tuta probabilit\u00e0 riconducibili al Foscarini.\\n- Dio lo vol 12 aprile 1848,
  a firma de \\\"El barcariol\\\"\\n- Ringraziamento per la liberazion de Venezia
  13 aprile 1848, a firma de \\\"El barcariol\\\"\\n- Povaro Barcariol, se ti xe vechio
  14 aprile 1848, a firma de \\\"El vecio barcariol\\\"\\n- Tre soneti 15 aprile 1848,
  a firma de \\\"El vecio barcariol\\\"\\n- Al popolo (Santa xe de Pio Nono la parola)
  17 aprile 1848, a firma de \\\"El vecio barcariol\\\"\\n- Al popolo (Fora el nemigo
  da l''Italia) 8 magio 1848, a firma de \\\"El vecio barcariol\\\"\\n- Adio ai Romani
  26 dicembre 1848, a firma de \\\"El barcariol venezian\\\"\\nCanti popolari[canbia]\\n-
  Canti pel popolo veneziano 1844, racolta de poesie\\nCanzonete[canbia]\\nSoneti[canbia]\\nAltri
  soneti sparsi:\"", "\"di Gianluca Panto\\nEl Veneto, e no sol ke kuesto, ga\u2019
  da dimandarse incosa far intea fase del post-sviupo.\\nEa Itaja ciapada insieme
  no la ga\u2019 interese de kuesto, parke\u2019 el nostro teritorio el ga\u2019 \u201d
  tanto pa scomisiar\u201d da render , ninporta a kual costo.\\nPar cui da na parte
  se vede come kel sia un mucio ciaro ke xe\u2019 deventa\u2019 importante svilupar
  novi raporti streti e de comercio coi nostri visini de Carinsia Slovenia Croasia
  e Bosnia , da kealtra xe\u2019 komunque anka indispensabie ea conquista anka de
  na indipendensa poitica , parke\u2019 kuesta xe\u2019 la unica strada percoribie
  pa svilupar dei novi modei de societa\u2019 ke i sipia pi\u2019 adati a nu.\\nIn
  entrambi i casi el apartener al stato Yugo-Italia no ne favorise par gnente.\\nPar
  cui ea cresita del PIL la vien riconsesta kome el parametro de misurasion del progreso
  e dea prosperita\u2019 de un Paese, la solusion de tuto el mal, social, anbietal,
  poetego..\\nSecundo la dotrina neolibarista l\u2019acresimento economico intenduo
  kome \u201daumento dei beni e dei servisi prodoti inte un ano\u201d el genera nea
  coletivita\u2019 na forte spinra ala felisita\u2019 dei so\u2019 citadini.\\nPar
  kui sti povari eseri umani li vien consideradi sol ke semplici consumatori e i loro
  desideri i li ga\u2019 da vegner fati coincider kol poseso de un mucio de beni.\\nA
  sta\u2019 idea fasinosa de kontinua cresita economega deo stato no li xe\u2019 esenti
  gnanca i paesi in via de sviupo (ciapa a Cina de uncuo\u2019), e gnaca serti paesi
  sociaisti, kuesti ultimi i ga\u2019 visto falir la so\u2019 idea de na pianificasion
  oportunamente gestida da na economia basada sua proprieta\u2019 koletiva dei mesi
  de produsion, ciapada kome mezo pa mejorar ea vita dea plebe.\\nE sti paesi sociaisti
  li xe\u2019 incora deso carenti de na risposta economega e coerente al neolibarismo.\\nNeolibarismo
  ke xe\u2019 anka kuesto un mal , parke\u2019 ea continua e infinita cresita economega
  el rapresenta na idolatria de un fantasma invent\u00e0 par far laorar de p\u00ec
  la zente e podopo ciuciarghe tuto el sangue co tase o consumi oblig\u00e0.\\nSta
  teoria comporta tante volte la idea masa superficiae de voer katar l\u2019obietivo
  dea rikesa materiae e de indentifarlo koa feisita\u2019 dei omani. Ghe ne\u2019
  invese uncuo\u2019 un mucio de interviste e de riserke par cui le testimonia ke
  el status uman dea feisita\u2019 interior el sia indipendente da ver rajunto n\u2019alto
  status personae economico , mentre a livelo nasional na kresita economega p\u00ec
  granda no la significa par forsa un major benesere social difuso.\\nUn mucio grandi
  invese li x\u00e8 i problemi sociai ke te comporta ea ricerca de na cresita economega
  esasperada kome obetivo primario de no stato: consumismo ke te magna l\u2019anima
  , degrado de l\u2019anbiente, distrusion dea coesion social, maeseri difusi, depresion,
  ansia, sensasion de inadeguatesa e solitudin\u00e0interior.\\nLa verit\u00e0 a x\u00e8
  ke ben altri i x\u00e8 i valori da considerar ala base dea feisita\u2019.\\nI x\u00e8
  l\u2019uguaiansa social, ea conosensa, l\u2019industrialisasion, i diriti civili,
  la toleransa.\\n1) sora un certo redito nasional i abitanti dei paesi p\u00ec riki
  no li x\u00e8 p\u00ec feisi de kelatri\\n2) In te un dato paese i citadini p\u00ec
  riki no li x\u00e8\u2019 pi feisi de kuei ko manko redito\\n3) E persone no le deventaI
  fatori de benasare p\u00ec feisi aumentando de tanto el proprio patrimonio par finir
  ea fede religiosa ke la fornise senso e scopo ala vita.\\nI fatori de benesare ke
  invese dipende da na condision unicamente personae i x\u00e8 : la autostima , la
  consapevolesa de s\u00e8, l\u2019otimismo, l\u2019inpegno in ativit\u00e0 gratificanti
  durante un dilato tenpo libaro ke te g\u00e0 da dispore, boni raporti amicai e de
  fameja, e par finir la fede relijosa ke la d\u00e0 senso e scopo ala vida e spasa
  via el relativismo inconcludente.\\nMa kueo ke influensa el benesere sojetivo el
  x\u00e8 dato anka dai obietivi verso i kuai se vol tendar, da kome e dal modo ke
  se li serca, dal kuadro de vita verso el kual se g\u00e0 da inserirli e dala priorit\u00e0.\\nA
  priorit\u00e0 de nu, pa realisar sto novo mondo x\u00e8 sempre coela: independensa.\\nVeneti
  Sempre !\\nGianluca Panto\\n23-12-2009\\nE QUESTO EA DIXE LONGA SORA EL FATO CHE
  I STATI P\u00ec CEI GA NA CONCESSION DE LAORO DIVERSA DAEA NOSTRA\u2026BASTA VEDARE
  IN SOLVENIA, IN AUSTRIA. EA XENTE GA MOLTO P\u00ec TENPO LIBARO PERCHE\u2019 I STA
  BEN ECONOMICAMENTE. VE CONTO ON FATO: ONCO\u2019 ME XE RIVA\u2019 EL STIPENDIO.
  LAORO IN BANCA: TUTI DIXE CHE NO SE STA MAL IN BANCA ! BEH A CONTI FATI STO MEXE
  GHE GO ASSA\u2019 AL STATO STROSSIN TAGLIAN COASI 1100 (MIESSENTO EURO) DE TASSE.
  SO ON ANO GO\u2019 PAGA\u2019 12 MILA EURO DE TASSE\u2026E SO\u2019 UN LAVORATORE
  DIPENDENTE. SE VIVESSE SO ON STATO INDIPENDENTE GAVARIA PAGA\u2019 FORSE 6/7 MILA
  EURO DE TASSE\u2026E CO DEI SERVISSI COI FIOCHI ! INVESSE DEI ME SCHEI COSSA SE
  NAI FATO ??? I GA\u2019 FINANZIA I PARTITI, I GA\u2019 PAGA L\u2019ABRUSSO, I SE
  NE GAVARA\u2019 MAGNA\u2019 MEXI E DOPO NO GHE XE SAE DA BUTAR IN TEE STRADE\u2026E
  TUTO QUESTO IN NOME DE UN FEDERALISMO FISCAE CHE DIXE CHE COMUNI E REGIONI POL DECIDAR
  DE METERE ALTRE TASSE MA CHE NO DIXE CHE SE RIDUXE E TASSE PAGAE A ROMA. VARDE\u2019
  A SO\u2019 CUSS\u00ec INRABIA\u2019 CHE GHE MASTEGARIA NA RECIA A CHI CHE DIXE CHE
  NO SEMO SO NA DITATURA FISCAE ! CO 5 MIA EURO DE DIFFARENSA NDARIA IN VACANSA 3
  OLTE SO ON ANO. INVESSE GHE VAGO NA OLTA SOA E CO FADIGA ! XE VERO: GO\u2019 TRENTAON
  ANO SO XOVENE MA ORA CHE DEVENTO VECIO SAVIO RAQUANTI SCHEI CHE GHE ASSARO\u2019
  X\u00f2 AL STATO TAGLIAN ?? E PAR VER COSSA ?!!\\nNA SANITA\u2019 DE MERDA, NA GIUSTISSIA
  INCONCLUDENTE CHE NO RIESSE GNANCA P\u00ec A METARE IN GAERA I CRIMINAI, NA SITUASSION
  DE STATO SOCIAE CHE X\u00e8 ROBE DA SUD-AMERICA E CHE TRA ON FIA\u2019 SFOCIARA\u2019
  IN GOERA SOCIAE, INFRASTRUTURE A LIVEI DA TERSO MONDO, TASSE E SORATASSE ANCA SO
  L\u2019AQUA DEL CESSO. VARDE\u2019 TOXI: NO VOJO P\u00ec SENTIRGHENE PARLARE DE
  LEGA NORD, DE ZAIA, DE GAEANI E DE SCASSACASSI VARI. XE ORA FAR SENTIRE EL GRIDO
  FORTE DEL INDIPENDENSA. XE\u2019 ORA DE SCRIVAR NA PAJNA NOVA PAL BEN NOSTRO, DEI
  NOSTRI CARI E DEI NOSTRI FIOI ! XE\u2019 ORA DARGHE NA SPERANSA A TUTI E UN FUTURO
  SERENO AI NOSTRI PARI E AI NOSTRI VECI. SO\u2019 SENPRE P\u00ec CONVINTO CHE EA
  DERIVA SOCIAE XE\u2019 AEA PORTE. PARECEMOSE ANCA AL PEXO DEL PEXO. PARECEMOSE,
  NO FEMO CATARSE INPREPARAI\u2026EA CONVINSION DEE NOSTRE IDEE SARA\u2019, INSIEME
  AEA FEDE EL NOSTRO FARO. MA STEMO COI OCI VERTI !\\nL\u2019ORA DEA RISCOSSA XE\u2019
  VISSINA !!!\\nPAR TERA PAR MAR\u2026SAN MARCO !!!!\\nParlemo de felicit\u00e0, benesare
  e economia, robe ca no sempre le v\u00e0 insieme, ma de frequente capita ca sipia
  cus\u00ec.\\nInte la storia de Scrooge el so servo el par tanto felice inte la so
  fameja, ma la so felicit\u00e0 inv\u00e8ro la xe rovin\u00e0 da la so indigensa
  ca no ghe parmete de magnar degnamente e de curar el fiolo mal\u00e0.\\nInsoma,
  i skei no far\u00e0 la felicit\u00e0, ma juta tanto. Me pare tanto comodo pontar
  el deo so la rikesa material quando se ne ga fruio. Mi no credo ca tanti nostri
  noni i saria d\u2019acordo.\\nLa economia porla eser negativa? La economia la xe
  inte la so forma minimal e esensial la mexura tra i costi e i benefici. El punto
  el xe individuar cossa xe beneficio e cossa xe costo. De securo in tanti paexi in
  via de svilupo el beneficio de poder ver skei par crompar tv giganti, ver caxe comode,
  magnar carne tuti i d\u00ec, e ver na makina come i ocidentali, xe de gran longa
  superiore de i costi de inquinar e rovinar el ambiente.\\nPar nantri el costo de
  rovinar el ambiente el taca pexar tanto quanto ver on SUV, par cui se preferise
  la makina ca no inquina (ma magari la costa de p\u00ec de el vecio SUV). La percesion
  de costi e benefici alora no la xe na costante, e la depende da la cultura e da
  el grado de evolusion de la popolasion so cui a se mexura la so economia. Par sto
  motivo me cato d\u2019acordo so el fato ca la mera mexura de el PIL la sipia incompleta.\\nMa
  co se taca parlar de felicit\u00e0, no credo proprio ca se posa dir ca sipia da
  doparar i metri indic\u00e0 intel articolo.\\nXela cossa la felicit\u00e0? A me
  modesto parere la felicit\u00e0 la xe la posibilit\u00e0 de vedar realiz\u00e0 i
  propri dexideri. La felicit\u00e0 la xe donca lig\u00e0 a la volont\u00e0 de la
  Persona. Pol alora, so la baxe de sta ipotexi, eser dopar\u00e0 la parola \u201cugualiansa
  social\u201d par definir on parametro entro cui se pol svilupar la felicit\u00e0?\\nUgualiansa
  social, se vardemo ben, vol dir spianar le condision sociali de le persone, inte
  on mito coletivista. Digo \u201cmito\u201d parch\u00e9 in realt\u00e0 savemo ca
  in natura ogni persona la xe on individuo par conto suo, e diverso da ogni altro.
  Xe donca aplicabile principi coletivisti so na popolasion de individui (intel senso
  de personalit\u00e0 difarenti)? Mi no credo. La ugualiansa social la xe ansi proprio
  la negasion de la libara volont\u00e0 individual de la Persona, donca la xe la negasion
  de el principio secondo cui dovaria fondarse la felicit\u00e0 istesa.\\nProbabilmente
  podemo pensar ca la Persona la staga ben inte na comunit\u00e0 de Persone ca le
  se vol ben in armonia, ma la xe na idealizasion, na speransa, dificilmente na certesa.
  Podemo auspicar sto tipo de roba, e se pol narghe rente probabilmente co na situasion
  ndo la solidariet\u00e0 la xe premi\u00e0, ndo el respeto civile e de coelaltro
  el sipia elev\u00e0 e al contrario sipia punio i caxi contrari, ndo in pratega se
  atua na forma de justisia semplice e certa fond\u00e0 so el respeto e la no agresion.\\nMa
  la baxe fondamentale la resta, inte la me umile opinion, la libart\u00e0 de la volont\u00e0
  de la Persona.\\nAnca la fede relijoxa, la xe na vixion relativa de coel ca el sente
  tale fede, ma no xe dito ca la sipia la raixa so cui se fonda la felicit\u00e0 de
  na persona. El \u201crelativismo inconcludente\u201d el xe semai fiolo de la mancansa
  de valori, ca no xe dito i sipia par forsa relijoxi. Ansi, de frequente le relijon
  le xe el motivo par far scatenar pasion inutili e deleterie, speso pens\u00e0 pestando
  la volont\u00e0 de altri.\\nNa dimension ca la sconfina speso in coela politega,
  paraltro.\\nAncora na volta vedemo ca inv\u00e8ro co el pretesto de prexunti valori
  condivixi se pesta la volont\u00e0 altrui, e se fa agresion: a se p\u00e8ta dhoxo
  inte na contradision ndo el valore no el xe el respeto e la asensa de agresivit\u00e0,
  ma el fanatixmo e el canonicalismo, l\u2019uniformit\u00e0.\\nTorno all\u2019economia.
  Anca so la question tempo libaro, dovaresimo interogarse da ndo el riva sto tempo
  libaro. Sensa rexorse economeghe (overo skei) no se pol de securo vantajarse de
  ver tempo libaro. On dixocup\u00e0 el ga na mucia de tempo libaro, ma par coesto
  no xe ca el staga ben. Isteso a level de na intera comunit\u00e0: el so PIL no el
  sar\u00e0 na mexura completa, ma significativa bastansa par dir se el tempo libaro
  de coela popolasion el xe dovesto a prosperit\u00e0 o incapacit\u00e0 de rendarse
  utili par i altri popoli, esportando i so prodoti materiali e (soradetuto) inteletuali.\\nMe
  pare ca el PIL procapita dei popoli ca ga p\u00ec tempo libaro cof\u00e0 Austria
  o Slovenia (come ga dito Stefano) el sipia p\u00ec alto de coel de popoli co manco
  tempo libaro cof\u00e0 Itaja. No penso el sipia on caxo.\\nConcludendo, se la felicit\u00e0
  la xe na roba ben definia e distinta da le raxon economeghe, el fato ca ghe sipia
  na bona distribusion de la rikesa, e ca ghe sipia proprio rikesa, xe tanto dovesto
  a come vien govern\u00e0 on popolo, e quanto civile xe sto popolo.\\nDe securo co
  le impoxision (da cui disende tute le idee coletiviste e redistributive) a xe prov\u00e0
  ca no ghe xe alcun rexult\u00e0 de svilupo economego, tanto quanto a xe prov\u00e0
  el contrario (USSR docet, USA docet, Cina pre[coletivista]-post[liberalfasista]
  docet).\\nD\u2019altra parte la Cina proprio ne mostra come la felicit\u00e0 la
  posa eser in s\u00e9 svincol\u00e0 da le raxon economeghe, se in nome de coeste
  a se urta altre libart\u00e0 de la Persona. Quindi el punto supremo el xe la union
  de la libart\u00e0 de la volont\u00e0 de la Persona co la facolt\u00e0 de ela istesa
  de contribuir al so benesare come ela la crede, in piena libart\u00e0.\\n(\u2026continua)\\nDe
  securo deso ghe sar\u00e0 taluni ca me far\u00e0 objesion dixendo ca alora se p\u00e8ta
  intel individualismo sfren\u00e0, del on contro tuti. Coesta la xe na vixion distorta
  per\u00f2, parch\u00e9 no xe ca el respeto de la libart\u00e0 de la Persona voja
  dir alienasion.\\nDe securo a me sento ben se son co persone ca le me respeta e
  no le se parmete de interferir co le decixion ca le me revarda, al contrario me
  sento a dixagio se me cato co persone ca no le ga respeto gnanca de coel ca no xe
  suo (par exempio rovinando e sporcando el ambiente).\\nL\u2019amicisia ca deriva
  da la stima par coel ca el ga respeto de ti, la xe ben p\u00ec forte de coela ca
  deriva da la temansia e da la sotomision. La coexion de na comunit\u00e0 la xe proprio
  fond\u00e0 so la libara stima reciproca, e no da raxon gerarchiche de mero oportunismo.\\nSe
  te se ca na persona de la to comunit\u00e0 no la xe na pelandrona ma la vive on
  momento de sfortuna, a te si ben propenso jutarla, el juto ca piove da el governo
  ca el te ga ciav\u00e0 i skei par dargheli a persone de cui te dubiti el ga el sa\u00f2r
  de la estorsion p\u00ec ca de la solidariet\u00e0.\\nParch\u00e9 a la fine tuto
  sto interogarse sora el nostro futuro el xe par domandarse cossa volemo e come voresimo
  costruir el nostro spasio, e mi penso ca sensa tegner come punto supremo el respeto
  de la libart\u00e0 de la volont\u00e0 de la Persona a se perde el primo punto cardinale
  par orientarse inte la condusion de la nostra societ\u00e0.\"", "\"Con scritti di:
  Alberto Ambrosini, Michele Amedei, Adriano Amendola, Maria Giulia Aurigemma, Malcom
  Baker, Luisa Berretti, Stefano Bruni, Francesco Caglioti, Antonella Capitanio, Marco
  Collareta, Sergio Cortesini, Vincenzo Farinella, Gail Feigenbaum, Pasquale Focarile,
  Francesco Freddolini, Andrea Fusani, Antonella Gioli, Cristiano Giometti, Sandra
  Lischi, Loredana Lorizzo, Sonia Maffei, Raffaella Morselli, Silvia Papini, Mattia
  Patti, Giovanna Perini Folesani, Stefano Renzoni, Manuel Rossi, Frank Salmon, Giovanni
  Santucci, Chiara Savettieri, Vincenzo Sorrentino, Lucia Tongiorgi Tomasi, Alessandro
  Tosi, Stefano Villani, Caterina Volpi, Alison Yarrington.\"", "\"+21\u02da\\n+18\u02da
  +25\u02daEl Canal Grando (par i venesiani anca Cana\u0142aso) el x\u00e9 el prinsipal
  canal de Venesia. \u0141\u00f3ngo sirca 3800 metri (\u0142arghesa dai 30 ai 70 m,
  profondit\u00e0 media 5 m), el divide en d\u00f3 parte el s\u00e9ntro st\u00f2rego
  trasando na \\\"S\\\" roversada che \u0142a va dal''entrada del Ponte de \u0142a
  Libart\u00e0 al Basin de San Marco.\\nen primo pian Pa\u0142aso Cavalli-Franchetti,
  en \u0142ontanansa \u0142a Bax\u00ec\u0142ica de \u0142a Sa\u0142ude]]El x\u00e9
  fianc\u00e0 par tuta \u0142a \u0142onghesa da maravegi\u00f3xi edifisi, en gran
  parte dei s\u00e8co\u0142i fra el XII e el XVIII, chei mostra el ben\u00e8ser e
  l''arte creai da \u0142a Rep\u00f9blica de Venesia, fax\u00e9ndo\u0142o un dei s\u00ecnbo\u0142i
  de \u0142a sit\u00e0. Ogni an i venesiani i ghe revive tradision seco\u0142are de
  \u0142a Seren\u00ecsima come \u0142a Regada St\u00f2rega.\\nD\u00f3po un corto t\u00f3co
  en diresion sud-est, al''altesa del P\u00f3nte de \u0142a Costitusion el gira a
  nord-est par descrivar na granda ansa \u0142\u00f3ngo \u0142a qual se cata el P\u00f3nte
  dei Scalsi e \u0142a confluensa del Canal de Canaregio, e che \u0142a finise al
  P\u00f3nte de Rialto, l''unego antigo frai p\u00f3nti e fam\u00f3xo come el canal
  steso. Da qui el va vanti verso sud-ovest e d\u00f3po a sud (d\u00f3po \u0142a \\\"volta
  de Canal\\\") e infin a est dal P\u00f3nte del''Academia a \u0142a Punta de \u0142a
  Dogana. En sto percorso qua el toca sinque dei sie sesti\u00e8ri, el toe 45 rii
  minori e el x\u00e9 supar\u00e0 da sete p\u00f3nti (quatro pedona\u0142i, d\u00f3
  automobi\u0142\u00ecstisi e un feroviaro). El pi\u00f9 resente el x\u00e9 el Ponte
  de \u0142a Costitusion, proget\u00e0 dal''architeto Santiago Calatrava par co\u0142egar
  el piasal de \u0142a Stasion de Venesia Santa Lusia co Piasal Roma, cao\u0142\u00ecnea
  de \u0142e l\u00ecne automobl\u00ecstiche del''Azienda Consorzio Trasporti Venezia.
  \u0141a data de inaugurasion al tr\u00e0fego del quarto p\u00f3nte, el nome definitivo
  del qual nol x\u00e9 anc\u00f3 st\u00e0 dato, \u0142a x\u00e9 anc\u00f3 inserta
  a c\u00e0uxa del \u0142ento ''ndar vanti dei \u0142av\u00f3ri de giustamento.\\nFiume
  intorno al qual \u0142a sit\u00e0 \u0142a x\u00e9 nasua, s\u00e9ntro vidal dei comersi
  de \u0142a Seren\u00ecsima par tuto el Medioevo, el Canal Grando el x\u00e9 st\u00e0
  \u0142a sede pi\u00f9 anbia dei pa\u0142asi de rapresentansa de \u0142e fam\u00e9ge
  patrisie, el \u0142\u00f3go dove mostrar \u0142a propia rich\u00e9sa, \u00abel v\u00e8ro
  Libro d\u2019oro\u00bb ''ntel qual dist\u00ecnguarse.\\nI x\u00e9 almanco 170 \u0142e
  rexidense che anca deso \u0142e poe contar un megiaro de ani de splendor de \u0142a
  Rep\u00f9blica, ''nte \u0142a storia de \u0142e fam\u00e9ge che \u0142e ga visuo
  e ''ntel vicendarse de \u0142e architeture, s\u00e9npre influensae da un gusto partico\u0142ar
  venesiano. Se poe dir che co sta \\\"gara\\\" qua al pa\u0142aso pi\u00f9 be\u0142o
  Venesia \u0142a gabia dato corpo ''ntel Canal Grando al''orgogio de \u0142a propia
  identid\u00e0 e al prof\u00f3ndo \u0142egame co \u0142a laguna. A ste qua se x\u00f3nta
  qualche c\u00e9xe, sc\u00f3\u0142e e canpi; p\u00f3che \u0142e fondamente par costegiarlo
  a pie.\\nen un dipinto de Canaletto.]]Squaxi tute \u0142e abitasion \u0142e salta
  fora diretamente dal canal, sensa marsapi\u00e9: so\u0142o navegando se pue contemplar
  sensa interusion sto seren seguirse de pa\u0142asi \u0142umenai dai riflesi del''aqua,
  ixo\u0142ai dai fiumi de x\u00e9nte e speso \\\"serai dr\u00e9nto\\\" da variopinte
  br\u00ecco\u0142e par l''atraco. El Canal Grando el da cus\u00ec un anbiente incant\u00e0,
  componente esensial de \u0142a mag\u00eca che \u0142a ga fato Venesia na de \u0142e
  sit\u00e0 pi\u00f9 amae al m\u00f3ndo.\"", "\"Asistente virtua\u0142e\\nOn asistente
  virtuale o asistente personal intelijente (conosuo anca col so acronemo inglexe
  IPA) l''\u00e8 on software solitamente instal\u00e0 soidispoxidivi mobili, come
  on te\u0142efono inte\u0142ijente, re\u0142ojo inte\u0142ijente o anca so dispoxidivi
  p\u00ec grosi come on computer, on tablet, o calsiasi altro dispoxidivo dot\u00e0
  de on sistema operadivo in grado de far ndar l''aplicasion e fornire el servisio
  domand\u00e0 da l''uxuario.\\nI asistenti virtuali i funsiona col riconosimento
  vocal, e i njien senpre p\u00ec doparai in p\u00ec lengue, par dar modo de ver on
  espansion senpre p\u00ec granda de sti servisi e senpre p\u00ec personalixasion
  e famejarit\u00e0 intr\u00e0 l''asistente e chi che lo dopara.\\nGhe x\u00e9, n''tei
  vari store online, on continuo cresare del numaro dei asistenti intelijenti e senpre
  p\u00ec sistemi operadivi i ga el proprio, x\u00e0 instal\u00e0 n''tei so dispoxidivi,
  par dar p\u00ec fa\u00e7ilit\u00e0 ai uxuari de far ativit\u00e0 che se no, le garia
  da esar fate manualmente. Alguni dei exenpi p\u00ec inportanti e conosui, x\u00e9
  par esenpio Google Assistant soi dispoxidivi Android e Google, Bixby soi dispoxidivi
  Samsung, Siri soi dispoxidivi iOS e Cortana soi dispoxidivi Microsoft Windows.\\nOltre
  che n''tei dispoxidivi come cheli scrivesti a cao pajina, i asistenti vocali i x\u00e9
  drio diventar senpre p\u00ec doparabili par robe difarenti, e parch\u00e9 sia cus\u00ec,
  difarenti axiende, le x\u00e9 drio produr anca ojeti fixi\u00e7i de asistensa vocal.
  Sti ojeti fixi\u00e7i, i x\u00e9 ciamai Altoparlanti inte\u0142ijenti, che no i
  saria altro che on altoparlante wireless co l''asistente virtual, chel ga la comodit\u00e0
  de no verlo in man, el pole star pox\u00e0 in calsiasi parte de la caxa e che coleg\u00e0
  a la corente, el pole star senpre inpis\u00e0. El funsiona n''tel steso modo che
  funsiona cheli n''tei dispoxidivi come PC, Smartphone e altri, o sia dixendo la
  \\\"parola ciave\\\" (Ok google par Google Home, Alexa par Alexa...) se ativa l''asistente
  vocal co tute le so funsion.\"", "\"Stephansort\\nStephansort xe st\u00e0 fondada
