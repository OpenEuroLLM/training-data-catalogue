  oncora 15 d\u00ec.\\nAvegnimenti[canbia | canbia el c\u00f2daxe]\\n- 1910 \u2013
  Henri Coanda el conpie el primo breve volo con un aereo dot\u00e0 de motore jet.\\n-
  1942 \u2013 Heinrich Himmler l''ordina che anca i zinga\u0142i i vegna mand\u00e0
