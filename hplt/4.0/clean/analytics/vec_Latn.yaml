  che \u00e0 fato tripe de i eserciti de Anibale e de Asdrubale ne le gran guere contro
  de i Romani.\"", "\"Com\u00f9ne de la pianura veronese a 46 Km da Verona al conf\u00ecn
  con la provincia de Vicensa e bagn\u00e0 dal progno Gu\u00e0, el g\u00e0 come frassioni\\nBaldaria,
  Sabi\u00f3n, Sant''Andrea, San ''Bastian, Spessa, Porceti. La presensa de l''\u00f2mo
  da ''ste parti l''\u00e8 antichissima come p\u00f3l testimoni\u00e0r i reperti catadi
  de le \u00e7ivilt\u00e0 Euganea (1000 a. C.), Paleoveneta (VIII-VII sec. a. C.),
  Veneta e Romana con urne, ceramiche e scud\u00e8le, conserv\u00e0 nel magnifico\\nMuseo
  Archeologico de Cologna. Dopo la conquista romana e l''organisassion de Cesare dei
  \\\"Municipia\\\" (49-45 a. C.), ne la localit\u00e0 l''\u00e8 st\u00e0 fond\u00e0
  ''na \\\"Colonia\\\" agricola da parte de Otaviano Augusto (29 a.C.) per ricompensar
  i propi veterani. Cologna l''\u00e9ra trav\u00e9rs\u00e0 da l''antica via Romana
  Porciliana o Porcilana che partendo da San Mart\u00ecn b\u00f2n Albergo la univa
  la Via Postumia a la Via Emilia-Altinate passando par Por\u00e7il (Belfi\u00f3r),
  Desmont\u00e0, Cuca (Veron\u00e8la), Str\u00e0, Olmo, Pressana e Montagnana. Con
  tuta probabilit\u00e0 l''\u00e8 la \\\"Colonia\\\" scrita da Catullo nel primo capoverso
  del Carme XVII\\n\\\"O Colonia quae cupis ponte ludere l\u00f3ngo\\\", presente
  \u00e0nca nel stema comun\u00e0l. In epoca Romana l''\u00c0dese el passava in ''sto
  teritorio in diressi\u00f3n Ateste (Este) prima de la famosa pi\u00e9na con relativa\\n\\\"Rotta
  della Cucca\\\" del 589 d.C. che l''\u00e0 fato deviar el fiume verso Albaredo in
  diressi\u00f3n Legnago creando el Gu\u00e0 o\\n\\\"Flumen Novum\\\". Cologna l''\u00e9ra
  importantissima par i romani ma \u00e0nca par Odoacre che nel V secolo dopo l''invasion
  barbarica dei Unni de Attila, el l''\u00e0 ricostruida con el nome de\\n\\\"Colonia
  Gotica\\\". Ne la frassi\u00f3n de\\nSabi\u00f3n secondo ''na legenda gh''\u00e9ra
  un cast\u00e8l fato costru\u00ecr da Rosmunda fi\u00f3la de Cunimondo re dei Gepidi,
  ''nd\u00f3e nel 547 l''\u00e0 proget\u00e0 de copar con Elmichi, so mar\u00ec Alboin.
  Dopo i longobardi Cologna l''\u00e8 pass\u00e0 ai Conti Maltrav\u00e9rsi par\u00f3ni
  de Vicensa e P\u00e0doa col tempo al \\\"ramo de fam\u00e9ja\\\" i Conti Malacapella
  che i \u00e0 fato costru\u00ecr cast\u00e8l e fortificassioni, sensa desm\u00e9nteg\u00e0rse
  del possesso de Cologna da parte dei Estensi. Nel 1239 Esel\u00ecn da Rom\u00e0n
  dopo vari assalti l''\u00e8 devent\u00e0 par\u00f3n de Cologna ma la popolassi\u00f3n
  no l''\u00e9ra massa contenta, al p\u00f3nto che nel 1256 i abitanti con a capo
  Jacopo Bonfado i s''\u00e0 riolt\u00e0 sperando ne l''aiuto del Pontificato e de
  Azzo d''Este che par\u00f2 no l''\u00e8 riv\u00e0. Eselin dopo av\u00e9r risposto
  a l''insuression l''\u00e0 fato finta de cat\u00e0r ''n acordo con Bonfado che ''pena
  l''a gir\u00e0 el canton el g''a taj\u00e0 la gola insieme con el fi\u00f3l Aprile.
  Nel periodo Scaligero Cologna l''\u00e8 st\u00e0 el \u00e7entro de uno dei Vicariadi
  piass\u00e9 grandi de la provincia veronese goern\u00e0 da sindaci soi, ma essendo
  posission\u00e0 in una zona de conf\u00ecn l''\u00e8 st\u00e0 par un fraco ''de
  ''olte in m\u00e8so a le guere tra veronesi e padoani come nel 1278, mentre nel
  1280, dopo la vitoria dei De la Scala, l''\u00e8 st\u00e0 deciso de but\u00e0r z\u00f2
  el cast\u00e8l e de vietar la costrussi\u00f3n de le fortificassioni con un decreto,
  che dopo no''l venar\u00e0 rispet\u00e0.\\nDopo i Scaligeri, nel giro de quasi vint''ani
  Cologna l''\u00e8 pass\u00e0 ai Visconti, ai Carraresi e par fin\u00ecr ai Venessiani
  nel 1405, deventando un \u00e7entro importante e s\u00f3ratuto auton\u00f2mo, esent\u00e0
  dal pagamento de le tasse e dal fornir sold\u00e0, ma fedelissima a Venessia che
  ''ista ''sta devossion l''\u00e0 ricompens\u00e0 Cologna piass\u00e9 ''olte con
  privilegi e bonifiche. Dopo l''ocupassion de le trupe straniere de la Lega de Cambrai
  nel ''500, Cologna l''\u00e8 pass\u00e0 da n\u00f3vo a Venessia deventando feudo
  dei Serego. Nel periodo Venessian se vede una b\u00f2na coltivassi\u00f3n e laorassion
  de la canapa par far soghe da darghe a le imbarcassioni navali de la Republica Veneta.
  Dopo i Venessiani j\u00e8 riv\u00e0 ne l''800, le dominassioni straniere, francese
  e par ultima austria\u00e7a e nel 1866 Cologna l''\u00e8 devent\u00e0 italiana.
  Da segnal\u00e0r tra le c\u00e9se el D\u00f2mo del 1807 ''nd\u00f3e un tempo gh''\u00e9ra
  el cast\u00e8l con dr\u00e9nto ''na pala del ''500 del Brustolon e un crocefisso
  in avorio del ''700 de Andrea Brustolon mentre el campan\u00ecl del 1841 l''\u00e8
  l''imitassion de qu\u00e9l de San Marco a Venessia costruido su la base de ''na
  t\u00f3r de ''n antica fortificassion ciam\u00e0 \\\"Mainarda\\\"; la c\u00e8sa
  de San Bartolomeo ricostruida nel XVIII secolo con dipinto de la\\nMadona del spasimo;
  la c\u00e8sa de Santo Spirito del 1535. De le fortificassioni gh''\u00e8 rest\u00e0
  i tochi de una de le oto t\u00f3ri del cast\u00e8l scaligero, mentre l''atu\u00e0l
  t\u00f3r Civica con campana e orologio del ''500 l''\u00e8 costruida sui qu\u00e9l
  che gh''\u00e8 rest\u00e0 de la t\u00f3r del cast\u00e8l nel XVI secolo; interessanti
