sample: '["\"El Pian Marshall, ufisalmente ciam\u00e0 European Recovery Program, el
  ze sta uno dei piani pu\u0142\u00ectego-econ\u00f2meghi statunitensi par \u0142a
  recostrusion de l''Eoropa dopo de \u0142a seconda guera mondia\u0142e. El ze sta
  anuns\u00e0 inte un discorso del segret\u00e0rio de Stato statunitense George Marshall
  inte el 5 de zugno del 1947 inte l''Universit\u00e0 de Harvard e i vegneva inpegnai
  p\u00ec de 12,7 mi\u0142iardi de d\u00f2\u0142ari.\\nIst\u00f2rego[canbia | canbia
  el c\u00f2daxe]\\nDiscorso de consepimento[canbia | canbia el c\u00f2daxe]\\nEl
  discorso col cua\u0142o el segret\u00e0rio de Stato statunitense del tenpo George
  Marshall el ghea anuns\u00e0 al mondo \u0142a decizion dei Stati Unii d''Am\u00e8rica
  de tacar e\u0142aborar e l''atuar un pian de juti econ\u00f2mego-finansiari par
  l''Eoropa che dopo, par convension storiogr\u00e0fega, el saria sta conosesto cof\u00e0
  \\\"Pian Marshall\\\", el ze sta sensa d\u00f9bio uno dei momenti p\u00ec inportanti
  de \u0142a st\u00f2ria de \u0142a pu\u0142\u00ectega internasiona\u0142e del secondo
  dopoguera.\\nMarshall el ghea aferm\u00e0 che l''Eoropa \u0142a garia avesto bezogno,
  almanco par altri 3 - 4 ani, de grandi juti da parte statunitense e che, sensa de
  sti cu\u00e0, granda parte del v\u00e8cio continente el garia pas\u00e0 un stra-grave
  deterioro de \u0142e condision pu\u0142\u00ecteghe, econ\u00f2meghe e socia\u0142i.
  Siben che el fuse sta tanto vago so \u0142e carater\u00ecsteghe del Pian, anca parch\u00e9
  prima el vo\u0142ea desc\u00f3rar so \u0142a predispozision dei t\u00e8rmani coi
  eoropei, el segret\u00e0rio de Stato el se ghea augur\u00e0 che da sto fondo se
  podese v\u00e8rzar no solch\u00e9 na nova e p\u00ec granda \u00e8poca de co\u0142aborasion
  intr\u00e0 \u0142e do sponde de l''Atl\u00e0ntego, ma anca na prima rea\u0142izasion
  de tuti i projeti eoropeisti fin deso caraterizai da na serta vaghesa utop\u00ecstega.\\nRea\u0142izasion[canbia
  | canbia el c\u00f2daxe]\\nL''idea de Marshall, che \u0142a zera vegnesta de fato
  za comunicada ai inglezi, \u0142a zera stada colzesta co favor anca da \u0142a Fransa,
  che, par\u00f2, \u0142a ghea dimand\u00e0 de est\u00e9ndar \u0142e reunion preparat\u00f2rie
  anca a l''Union Sovi\u00e8tega che, dopo un prins\u00ecpio de manifestasion de intarese,
  \u0142a se ghea refud\u00e0 partesipar al neg\u00f2sio, obigando anca tuti che\u0142i
  altri paezi del bloco orienta\u0142e e comunista de far conpagno.\\nEl Eoropean
  Recovery Program (ERP) el ghea prevedesto a \u0142a fin un fondo de poco p\u00ec
  de 14 mi\u0142iardi de d\u00f2\u0142ari par un per\u00ecodo cuadriena\u0142e. Col
  fin de favorir na prima integrasion econ\u00f2mega inte el Continente, el zera nasesto
  anca el Organization for Eoropean Economic Cooparation (OEEC, in v\u00e8neto OECE),
  organismo t\u00e8cnego andove i programatori inviai da Washington i ghea serc\u00e0
  de sp\u00e9nzar i goerni eoropei a doparar i juti miga solch\u00e9 par far fronte
  ai problemi del momento, ma anca par m\u00e9tar in pie un prosedimento de trasformasion
  de \u0142a strutura de l''economia dei so Paezi.\\nContrariamente a l''aug\u00f9rio
  fazesto inte el prins\u00ecpio da Marshall, cuazi tuti i adezionadori al pian, i
  ghea dimand\u00e0 el juto par \u0142a cronpa de a\u0142imenti de nesesit\u00e0 bazi\u0142are,
  prodoti industria\u0142i, conbust\u00ecbi\u0142e e, solch\u00e9 in m\u00ecnema parte,
  machinari e mezi de produsion che de longo t\u00e8rmeno, i garia podesto frutar
  a \u0142e economie. Inte l''iteso tenpo sentenari de consejeri econ\u00f2meghi statunitensi
  i zera stai mandai in Eoropa, e ghe ze sta consentio a studiozi e esperti eoropei
  de vizitar inpianti industria\u0142i e de frecuentar corsi de istrusion inte i Stati
  Unii.\\nConsevense[canbia | canbia el c\u00f2daxe]\\nEl Pian el zera f\u00ecnio,
  cof\u00e0 prevedesto in prins\u00ecpio, inte el 1951 e i tenti de slong\u00e0rghene
  par calche ano l''efeto no i ga avesto bon \u00e8zito par via del s-ciopo de \u0142a
  guera de Corea e de \u0142a vit\u00f2ria dei republegani inte \u0142e e\u0142esion
  par el Congreso de l''ano prima.\\nPar cualche tenpo un m\u00f9cio de economisti
  statunitensi se ghea zudeg\u00e0 negativamente l''inpatamento del Pian Marshall
  su l''economia eoropea dato che, par so opinion, el ghea produzesto efetivamente
  na cr\u00e9sita sostegnesta, ma gr\u00e0sie al baso costo del lavoro, roba che -
  no gavendo induzesto na contenpor\u00e0nea cr\u00e9sita dei r\u00e8diti - el gaveva
  port\u00e0 verso de na serta stagnasion inte \u0142a speza e inte i consumi. In
  realt\u00e0 - cof\u00e0 dimostr\u00e0 da \u0142e an\u00e0\u0142ize dei \u00f9ltemi
  ani - el Pian el ga consentio a l''economia eoropea de suparar un momento de crize
  e el ghea favorio na recuperasion che za inte el 1948 \u0142a zera evidente, consentendo
  ai Paezi benefisadori de suparare l''\u00ecndaze de produsion pre-b\u00e8\u0142ego
