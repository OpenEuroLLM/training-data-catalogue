  el 1800.\\nCarton animato che parla de come el nome de Venesia xe cambi\u00e0 ne
  i secoi.\\nCarton animato che conta de el compleano de Venesia.\"", "\"Online international
  wire transfer enabled SWIFT-BIC Code of Banca Valsabbina S C P A having swift code
  branches cities are Adro, Agnosine, Bagolino, Bione, Bondone, Botticino, Brescia,
  Calcinatello (Calcinato), Calcinato, Carpenedolo, Castiglione Delle Stiviere, Casto,
  Chiari, Concesio, Desenzano Del Garda, Gavardo, Ghedi, Gussago, Idro, Legnago, Leno,
  Lodrone (Storo), Lonato, Lumezzane, Manerbio, Marcheno, Mazzano, Montichiari, Mura,
  Nave, Odolo, Orzinuovi, Ospitaletto, Paitone, Palazzolo Sulloglio, Polaveno, Rivoltella
  (Desenzano Del Garda), Roe Volciano, Roncadelle, Rovato, Sabbio Chiese, Salo, San
  Bonifacio, San Giovanni Lupatoto, San Martino Buon Albergo, San Pietro In Cariano,
  Sarezzo, Storo, Vallio Terme, Verona, Vestone, in Italy - IT Country.\"", "\"El
  cana\u0142e Ma\u0142amoco-Marghera, el ze un Cana\u0142e artifisia\u0142e che co\u0142ega
  el Mar Adriatego (a \u0142a boca de''l porto de Ma\u0142amoco) al porto commercia\u0142e
  de Marghera, traversando \u0142a \u0142aguna de Venesia, conos\u00f9o anca come
  cana\u0142e dei petroli, poich\u00e9 el ze st\u00e0 rea\u0142iz\u00e0 par consentir
  a \u0142e nave petroliere de razonzer diretamente \u0142e rafinarie de''l petrolchimico
  de Marghera, o sia sensa incrozar \u0142e rote de \u0142e nave toristeghe che \u0142e
  tranzita par el sentro st\u00f2rego de Venesia e el Basin San Marco.\\nStoria[canbia
  | canbia el c\u00f2daxe]\\nZa so''l fenir de''l XVII s\u00e8co\u0142o, a cauza del
  progresivo insabiamento de''l porto de San Nicol\u00f2, \u0142e nave p\u00ec grande
  ga tac\u00e0 entrar inte \u0142a \u0142aguna veneta traverso \u0142a boca de Ma\u0142amoco.
  Inte''l 1725 el Consejo dei Pregadi ga de\u0142ibar\u00e0 de scavar el cana\u0142e
  de Santo Spirito (a l''inisio fondo cuatro metri e \u0142argo 14 m), par unir Ma\u0142amoco
  col Basin San Marco e fas\u0142itar cus\u00ec l''aceso de \u0142e nave de mazor
  portada a Venesia.[1] Durante el dominio napo\u0142eonego, el cana\u0142e de Santo
  Spirito ze st\u00e0 zlarg\u00e0 e sbas\u00e0 a \u0142a fondit\u00e0 de 6,5 m, par
  parmetarghe el pasar de vase\u0142i a 74 canoni direti a l''Arsenal de Venesia.
  Inte el corso del XIX seco\u0142oo]], el cana\u0142e ze st\u00e0 port\u00e0 a \u0142a
  fondit\u00e0 de 9,5 m, co \u0142arghesa de 30\u201360 m.[2]\\nTra el 1920 e el 1925
  ze st\u00e0 scav\u00e0 el Cana\u0142e Vittorio Emanuele III (fondo 9\u201310 m e
  \u0142argo 28 m) par co\u0142egar el Canal de \u0142a Zueca a \u0142a cusidita prima
  zona industria\u0142e del nasente po\u0142o de Porto Marghera.[3] El cana\u0142e
  ze st\u00e0 zlarg\u00e0 a 50 m par razon be\u0142iche durante \u0142a segonda guera
  mondia\u0142e e ulteriormente sbas\u00e0 a 11 metri de fondit\u00e0 inte i ani 1950.[4]\\nInte
  el 1953 el Zenio Sivi\u0142e par \u0142e Opare Mariteme ga proponesto el scavo de
  un novo cana\u0142e de granda navegasion par co\u0142egar Porto Marghera a \u0142a
  boca de porto de Ma\u0142amoco, al fin de portar el trafego maritemo fora dal sentro
  storego de Venesia e rea\u0142izar un porto par \u0142e petroliere inte el marzene
  meridiona\u0142e de \u0142a cusidita \\\"segonda zona\\\". \u0141a proposta \u0142a
  ze st\u00e0 conferm\u00e0 dal Zenio Sivi\u0142e anca inte i projeti prezentai inte
  i ani 1956, 1961 e 1962, in cui el porto dei petroli ze st\u00e0 spost\u00e0 p\u00ec
  a sud, inte el basin \u0142agunar de Ma\u0142amoco. Drioman el cusidito boom petro\u0142ifero
  de chel periodo, el projeto definitivo ga modifeg\u00e0 el tras\u00e0 e \u0142e
  dimension del cana\u0142e Ma\u0142amoco-Marghera, par consentir el pasajo de nave
  petroliere p\u00ec grande.[5]\\nEl cana\u0142e dei petroli ze st\u00e0 scav\u00e0
  tra el 1964 e el 1968,[6] par essere funzionale allo sviluppo del polo petrolchimico.[7]\\nInte
  el 1992 el Magistrato a \u0142e acue ga rea\u0142iz\u00e0 l''inpianto de i\u0142uminasion
  del cana\u0142e.\\nDescrision[canbia | canbia el c\u00f2daxe]\\nCarateristeghe tecneghe[canbia
  | canbia el c\u00f2daxe]\\nEl cana\u0142e el ze \u0142ongo sirca 15 km, de cui 14,350
  km costituise l''aso prinsipa\u0142e e 650 metri par el ramo d''aceso al porto petro\u0142ifero
  de San Lunardo,[8] el cua\u0142e el ze co\u0142eg\u00e0 a \u0142a rafinaria tramite
  un o\u0142eodoto translagunar co diametro de 1,07 m e \u0142ongo 11 km.[9]\\nDrioman
  a \u0142a costrusion del MOSE a \u0142a boca de porto de Ma\u0142amoco, \u0142a
  fondit\u00e0 de aceso al cana\u0142e Ma\u0142amoco-Marghera dal Mar Adriatego \u0142a
  rezulta vinco\u0142\u00e0 a non pi\u00f9 de 14 metri;[10] ta\u0142e fondit\u00e0
  \u0142a ze \u0142a mazor consentia da \u0142e struture del MOSE par l''aceso direto
  a \u0142a \u0142aguna venesiana (sensa traversar \u0142e conche de navegasion),
  dopo i 12 metri del Cana\u0142e de Lido San Nicol\u00f2 a \u0142a boca de porto
  de Lido-San Nicol\u00f2.[11]\\nEl cana\u0142e el ze \u0142argo duzento metri e fondo
  fin a dizasete metri inte \u0142a prima trata (fin al Porto de San Lunardo), anca
  se ne gera previsti sirca cuatordeze e mezo; drioman el conpoise na volta a 90\u00b0
  in diresion nord e inte \u0142a segonda trata el ze fondo dodeze metri e mezo.\\nEl
  cana\u0142e el ze dot\u00e0 de un trozo \u0142uminozo conponesto da 345 ponti \u0142uze
  so pa\u0142i meta\u0142isi.\\nInpato anbienta\u0142e[canbia | canbia el c\u00f2daxe]\\nI
  fanghi restanti da l''incavo del cana\u0142e dei petroli ze st\u00e0 uti\u0142iz\u00e0
  da novo par persugar miere de etari de \u0142aguna co l''intendto de far sorzer
  na tersa zona industria\u0142e visin Fuzina. Ze naseste cus\u00ec \u0142e case de
  inbonimento, el cui destin ze st\u00e0 vanifeg\u00e0 da \u0142a Di\u0142uvion de
  Venesia del 4 novenbre 1966, e a \u0142a costrusion de \u0142e cua\u0142e zera st\u00e0
  atribuia \u0142a colpa de \u0142a catastrofe.\\nEl cana\u0142e el ze st\u00e0 a
  \u0142ongo e''l ze tuto ancuo al sentro de numaroze controversie, soratuto par i
  efeti che no''l aporta a l''ecui\u0142ibrio \u0142agunar par via de \u0142a so stragranda
  sesion; infati, col so inatura\u0142e scorimento d''acua, el ga siment\u00e0 un
  notevo\u0142e inalsamento del \u0142ive\u0142o de marea inte \u0142a \u0141aguna
  Sentra\u0142e, stim\u00e0 in molte dezene de sentimetri. De conseguensa, barene,
  cana\u0142i e ghebi ze stai demo\u0142ii da \u0142a forte enerzia de \u0142a corente,
  che da deceni, par do volte al d\u00ec, \u0142a spiana i marzeni dei cana\u0142i,
  supegando da novo i sedimenti e travazando in mar, durante el rifluso, stragrande
  cuantit\u00e0 de materia\u0142e so\u0142ido in sospension, cauzando de fato, un
  dezvodamento de \u0142e aree \u0142agunari antistanti \u0142a boca de porto de Ma\u0142amoco
  e de na notevo\u0142e parte de \u0142aguna sentra\u0142e.\\nInte el 1992 el Magistrato
  a \u0142e acue, in co\u0142aborasion col Consorsio Venesia Nova, ga cre\u00e0 el
  primo pian morfo\u0142ozego de \u0142a \u0142aguna de Venesia, el cua\u0142o ga
  individ\u00e0 el cana\u0142e dei petroli cof\u00e0 \\\"cauza de l''inisio de un
  proceso de movimentasion dei sedimenti co conseguente forte erozion dei basifondi\\\".[12]
  Al fin di \\\"riduzer i efeti de \u0142a portua\u0142it\u00e0 o de \u0142a navegasion
  so \u0142a morfo\u0142ozia, el pian ga proponesto un \\\"intarvento radica\u0142e
  de interamento del cana\u0142e da Ma\u0142amoco a San Lunardo, co para\u0142e\u0142a
  ricostrusion de na via naveg\u00e0bi\u0142e \u0142ongo el cana\u0142e Fisolo\\\".
  Ta\u0142e ipotezi, che a l''epoca \u0142a \u0142imitava el tranzito a \u0142e so\u0142e
  nave non p\u00ec \u0142onghe de 240 metri, zera st\u00e0 par\u00f2 e\u0142imin\u00e0
  inte \u0142e sucesive \u0142inee guida emanae inte el 2004, che paraltro \u0142e
  prevedea el conso\u0142idamento del tras\u00e0 del cana\u0142e co arzenadure e barene
  artifisia\u0142e.[13]\\nNotasion[canbia | canbia el c\u00f2daxe]\\n- D''Alpaos,
