sample: '["\"ME\u0160OMO YA GO ITHUTA YA BANA\\nME\u0160OMO YA GO ITHUTA\\nRe Matlafat\u0161wa
  ke Bana Babo Rena le Dikgaet\u0161edi\\nIthute kamoo ba lapa la geno le ba phuthego
  ya geno ba ka go matlafat\u0161ago ka gona.\\nT\u0161e di Oket\u0161egilego go t\u0161wa
  Dihlogong t\u0161e\\nMo\u0161omo wo o thu\u0161a bana ba mengwaga ya magareng ga
  e 8 le e 12 go bont\u0161ha dika t\u0161a go ba mogwera yo botse.\\nBona gore o
  ka gopola dilo t\u0161e kae ka go bapala papadi ye ya go lebanya dikarata yeo e
  theilwego go dikgaolo 2 go ya go 7 t\u0161a puku ya Joshua.\\nSega gomme o kopanye
  puzzle ye gore le kgone go bapala kanegelo ye ya Beibele ya Kora.\"", "\"Beibele
  Inthaneteng\\nPHETOLELO YA LEFASE LE LEFSA YA MANGWALO A MAKGETHWA\\n33 Go madimabe
  wena o senyago, fela wena o sa senyet\u0161we, le wena yo a radiago, fela go se
  na bao ba go radiago!+ Ge o fet\u0161a go senya o le mosenyi, le wena o tlo senyet\u0161wa.+
  Ge o fet\u0161a go radia, ba tlo go radia.+\\n2 Jehofa, re gaugele.+ Re go holofet\u0161e.+
  Eba letsogo+ la rena mesong+ e mengwe le e mengwe, ee, eba pholo\u0161o ya rena
  nakong ya tlalelo.+\\n3 Merafo e ile ya t\u0161haba ge e ekwa modumo wa khuduego.+
  Ge o tsoga dit\u0161haba di ile t\u0161a ga\u0161ana.+\\n4 Dithebola+ t\u0161a lena
  di tla kgoboket\u0161wa go et\u0161a ge maphene a kgoboket\u0161a dilo, di tla kgeregelwa
  go et\u0161a ge segongwane se kgeregela motho.+\\n5 Jehofa o tla phagami\u0161wa+
  gobane o dula moo go phagamego.+ O tla tlat\u0161a Tsione ka toka le toko.+\\n6
  Go botega ga mehla ya gago e tla ba ditiro t\u0161a go pholo\u0161a+\u2014bohlale,
  tsebo+ le poifo ya go boifa Jehofa+ ke letlotlo la mong wa lona.\\n7 Bonang! Bagale
  ba bona ba goelet\u0161a ba le mokgotheng; baromiwa ba khut\u0161o+ ba tla lla gabohloko.\\n8
  Ditsela t\u0161e dikgolo di sent\u0161we;+ ga go sa feta motho tseleng.+ Mosenyi
  o sent\u0161e kgwerano;+ o nyadit\u0161e metse;+ ga a na taba le motho wa nama le
  madi.+\\n9 Naga e a lla, e omile.+ Libanoni e hlabja ke dihlong;+ e bodile. Sharona+
  e et\u0161a leganata; Bashani le Karamele di hlohlorega matlakala a t\u0161ona.+\\n10
  \u201cBjale ke tla ema,\u201d+ go bolela Jehofa, \u201cbjale ke tla iphagami\u0161a;+
  bjale ke tla ikukela godimo.+\\n11 Le imile bjang bjo bo omilego;+ le tla belega
  mahlaka. Moya wa lena o tla le ja+ wa le fet\u0161a go et\u0161a mollo.+\\n12 Merafo
  e tla et\u0161a motaga o swelego. E tla fi\u0161wa ka mollo go et\u0161a meetlwa
  yeo e remilwego.+\\n13 Lena bao le lego kgole, ekwang seo ke tlago go se dira!+
  Tsebang matla a ka, lena bao le lego kgauswi.+\\n14 Badiradibe kua Tsione ba t\u0161hogile;+
  bahlanogi+ ba a thothomela, ba re: \u2018Ke mang mo go rena yo a ka dulago go ya
  go ile mollong+ o t\u0161humago? Ke mang mo go rena yo a ka dulago go ya go ile
  malakabeng a mollo?\u2019+\\n15 \u201cGo na le motho yo a sepelago ka toko+ a sa
  kgaot\u0161e le yo a bolelago t\u0161e di lokilego,+ yo a ganago go boelwa ka boradia,+
  yo a ganet\u0161ago seatla sa gagwe go t\u0161ea letsogo-le-kobong,+ yo a thibago
  ditsebe t\u0161a gagwe gore a se theet\u0161e t\u0161a t\u0161hollo ya madi le yo
  a tswalelago mahlo gore a se bone t\u0161e mpe.+\\n16 Ke yo a tlago go dula godimo
  dithabeng;+ sebo sa gagwe e tla ba mafelo a magaga ao go lego thata go a fihlelela.+
  O tla newa senkgwa sa gagwe;+ meetse a gagwe a ka se fele.\u201d+\\n17 Mahlo a gago
  a tla bona botse bja kgo\u0161i;+ a tla bona naga ya kgole.+\\n18 Pelo ya gago e
  tla bolelela fase+ ka selo se t\u0161ho\u0161ago, e re: \u201cMongwadi o kae? O
  kae yo a lefago?+ Yo a balago dibo o kae?\u201d+\\n19 Ga go na batho ba mereba bao
  o tlago go ba bona, ba leleme le le sa kwe\u0161i\u0161egego le ba leleme le\u0161ele
  leo o sa le kwe\u0161i\u0161ego.+\\n20 Bona Tsione,+ motse wa menyanya ya rena!+
  Mahlo a gago a tlo bona Jerusalema, lefelo la bodulo la khut\u0161o, e lego tente
  yeo go sego yo a ka e phuthago.+ Dimapolo t\u0161a tente ya yona di ka se ke t\u0161a
  tumolwa le ka mohla, le gona dithapo t\u0161a yona di ka se kgaolwe diripa t\u0161e
  pedi.+\\n21 Eup\u0161a gona lefelong leo Yena yo Mogolo,+ Jehofa, o tla re \u0161irelet\u0161a
  bjalo ka dinoka+ le mekero e ahlamego. Dikepe t\u0161a manaba di ka se ye go t\u0161ona,
  gomme ga go na dikepe t\u0161e dikgolo t\u0161eo di tla fetago moo.\\n22 Gobane
  Jehofa ke Moahlodi+ wa rena, Jehofa ke Moneimolao+ wa rena, Jehofa ke Kgo\u0161i+
  ya rena; o tla re pholo\u0161a.+\\n23 Dithapo di tla lepelela; dikokwane ga se t\u0161a
  tsengwa ka go tia; seila ga se ya alwa.Mohlang woo le dithebola t\u0161e dint\u0161i
  di tla arolwa; dihlot\u0161a le t\u0161ona di tla it\u0161eela dilo t\u0161e dint\u0161i
  t\u0161e di hut\u0161wego.+\\n24 Ga go na modudi yo a tla rego: \u201cKe a babja.\u201d+
  Batho bao ba dulago nageng e tla ba bao ba swaret\u0161wego molato wa bona.+\"",
  "\"Mathomong a 1942, madira a matla a Japane a ile a thoma go laola Indonesia ka
  tsela e sehlogo kudu. Bana babo rena ba bant\u0161i ba be ba gapelet\u0161wa go
  dira modiro o thata wa matsogo\u2014ba aga ditsela goba ba epa diforo. Ba bangwe
  ba be ba tswalelet\u0161we dikampeng t\u0161a kgolego t\u0161eo di nago le dit\u0161hila
  gomme ba tlai\u0161et\u0161wa gore ba gana go thekga ntwa. Go ile gwa hwa bonyenyane
  bana babo rena ba bararo kgolegong.\\nKgaet\u0161edi yo mongwe wa Modutch, e lego
  Johanna Harp, yo a bego a dula motseng wa dithabeng wo o lego ka thoko ka Bohlabela
  bja Java, o ile a kgona go phema go i\u0161wa dikampeng mengwageng e mebedi ya mathomo
  ya ntwa. Yena le bana ba gagwe ba bararo bao e bego e le bafsa ka nako yeo ba ile
  ba diri\u0161a tokologo yeo ba bego ba na le yona go fetolela puku ya Salvation
  le ditokollo t\u0161e dingwe t\u0161a Morokami go tloga go Seisemane go ya go Sedutch.
  * Ke moka go be go dirwa dikopi t\u0161a dikgati\u0161o t\u0161e di fetolet\u0161wego
  gomme di romelwa ka sephiring go Dihlatse ka moka t\u0161a Java.\\nDihlatse t\u0161e
  sego kae t\u0161eo di bego di se t\u0161a golegwa di be di swara diboka ka dihlopha
  t\u0161e dinyenyane gomme di bolela ditaba t\u0161e dibotse ka \u0161edi. Josephine
  Elias (yo e bego e le wa ga Tan) o it\u0161e: \u201cKe be ke phela ke but\u0161e
  mahlo gore ke nee bohlatse bjo bo sa rulaganyet\u0161wago. Ke be ke swara lepolanka
  la papadi ya chess ge ke etela batho bao ba thabelago magaeng a bona e le gore ba
  bangwe ba nagane gore ke be ke ipapalela chess.\u201d Felix Tan le mosadi wa gagwe,
  e lego Bola, ba be ba bolela ditaba t\u0161e dibotse ka ntlo le ntlo, ba dira eka
  ba reki\u0161a sesepa. Felix o it\u0161e: \u201cGant\u0161i re be re \u0161alwa
  morago ke batho bao ba nyakago go tseba ditaba t\u0161e it\u0161ego ka rena bao
  ba bego ba \u0161omela maphodisa a Kempeitai, e lego maphodisa a se\u0161ole a Japane
  ao batho ba bego ba a t\u0161haba kudu. E le gore go se be le batho bao ba re gononelago,
  re be re fetofeto\u0161a dinako t\u0161a rena t\u0161a go etela barutwana ba rena
  ba Beibele. Ba tshelelago ba barutwana ba rena ba ile ba t\u0161wela pele gabotse
  gomme ba kolobet\u0161wa yona nakong yeo ya ntwa.\u201d\\nGo Tsoga Diphapano Gare
  ga Bana Babo Rena Kua Jakarta\\nGe bana babo rena ba dut\u0161e ba tlwaelana le
  mathata a nakong ya ntwa, go se go ye kae ba ile ba lebelet\u0161ana le teko e nngwe
  e kgolo. Balaodi ba mmu\u0161o ba Majapane ba ile ba laela batho ka moka bao ba
  sa t\u0161wego nageng ye (go akaret\u0161a le ma-China ao a dulago Indonesia) go
  ingwadi\u0161a le go swara karata ya boitsebi\u0161o yeo e nago le mant\u0161u a
  gore ba tla botegela Mmu\u0161o wa Majapane. Bana babo rena ba bant\u0161i ba ile
  ba ipot\u0161i\u0161a gore: \u2018Na re swanet\u0161e go ingwadi\u0161a gomme re
  saene karata yeo ya boitsebi\u0161o, goba re swanet\u0161e go gana go ingwadi\u0161a?\u2019\\nFelix
  Tan o hlalosit\u0161e gore: \u201cBana babo rena ba Jakarta ba ile ba kgothalet\u0161a
  rena re bego re dula Sukabumi gore re gane go saena karata yeo ya boitsebi\u0161o.
  Eup\u0161a re ile ra kgopela balaodi ba mmu\u0161o ge e ba re ka feto\u0161a mant\u0161u
  a karateng yeo gore a se balege ka gore \u2018motho yo a saennego mo o ikanne gore
  o tla botegela\u2019 ma\u0161ole a Japane, eup\u0161a a balege ka gore \u2018motho
  yo a saennego mo a ka se \u0161iti\u0161e\u2019 ma\u0161ole a Japane. Se se makat\u0161ago
  ke gore ba ile ba dumela, ka gona ka moka ga rena re ile ra hwet\u0161a dikarata
  t\u0161eo. Ge bana babo rena ba Jakarta ba ekwa ka phetho ya rena, ba ile ba re
  bit\u0161a bahlanogi gomme ba se sa diri\u0161ana le rena.\u201d\\nKa manyami, ba
  bant\u0161i ba bana babo rena bao ba bego ba fi\u0161egela thoko kua Jakarta ba
  ile ba golegwa gomme ba tlogela there\u0161o. Ngwanabo rena yo mongwe yo a ilego
  a dula a tiile tumelong o ile a felelet\u0161a a le kgolegong le Andr\u00e9 Elias.
  Andr\u00e9 o it\u0161e: \u201cKe ile ka boledi\u0161ana le yena ka taba ya go ingwadi\u0161a
  gomme ka mo thu\u0161a gore a be le pono e lekalekanego. Ka boikokobet\u0161o o
  ile a kgopela tshwarelo ka ge ba ile ba se sa diri\u0161ana le rena. Ke moka re
  ile ra thabela go agana, eup\u0161a ka manyami, o ile a hwa ka baka la go phela
  maemong a sa kgahli\u0161ego moo kgolegong.\u201d\\nMerdeka!\\nKa morago ga gore
  ntwa e fele ka 1945, bana babo rena le dikgaet\u0161edi ba be ba fagahlet\u0161e
  go t\u0161wela pele ka modiro wa go bolela ditaba t\u0161e dibotse. Ngwanabo rena
  yo mongwe yo a ilego a golegwa le go tlai\u0161wa o ile a ngwalela ofisi ya lekala
  kua Australia gore: \u201cKe nna yo ke sa le gona ka morago ga nywaga e mene e thata
  kudu, ke sa botega gomme ga se ka feto\u0161a monagano wa ka. Mathateng a ka ka
  moka, ga sa nka ka lebala bana babo rena. Na le ka nthomela dipuku?\u201d\\nDipuku
  t\u0161eo ngwanabo rena yo a bego a di letile di ile t\u0161a fihla, mathomong e
  be e le t\u0161e sego kae feela eup\u0161a ka morago gwa tla t\u0161e dingwe t\u0161e
  dint\u0161i. Sehlopha sa bagoeledi ba lesome kua Jakarta se ile sa tso\u0161olo\u0161a
  modiro wa go fetolela dikgati\u0161o ka Seindonesia.\\nKa August 17, 1945, baetapele
  ba mokgatlo wa tokologo wa Indonesia ba ile ba tsebi\u0161a gore Indonesia ke repabliki
  e ikemet\u0161ego, gomme seo sa thoma ntwa yeo e t\u0161erego mengwaga e mene ya
  go lwa le mmu\u0161o wa Madutch. Batho ba diketekete ba ile ba hwa tlhakatlhakanong
  yeo e ilego ya latela, gomme ba ka godimo ga dimilione t\u0161e \u0161upago ba gapelet\u0161ega
  go tlogela magae a bona.\\nNakong yeo ka moka ya ntwa bana babo rena ba ile ba t\u0161wela
  pele ba bolela ditaba t\u0161e dibotse ka ntlo le ntlo. Josephine Elias o it\u0161e:
  \u201cBatho bao ba ratago naga ba ile ba leka go re gapelet\u0161a gore re goelet\u0161e
  ka gore \u2018Merdeka,\u2019 e lego lent\u0161u leo le bolelago gore \u2018Tokologo.\u2019
  Eup\u0161a re ile ra ba bot\u0161a gore ga re t\u0161ee karolo ditabeng t\u0161e
  bjalo t\u0161a dipolotiki.\u201d Ka 1949, Madutch a ile a kgaot\u0161a go bu\u0161a
  koloni ya ona gomme a feti\u0161et\u0161a pu\u0161o Repabliking ya United States
  ya Indonesia (gona bjale ke Repabliki ya Indonesia). *\\nKa 1950, bana babo rena
  kua Indonesia ba ile ba kgotlelela ntwa yeo e t\u0161erego mengwaga e ka bago e
  lesome. Eup\u0161a ba be ba sa na le modiro o mogolo kudu woo ba bego ba swanet\u0161e
  go o dira. Ba be ba ka dira eng gore ba bolele ditaba t\u0161e dibotse go badudi
  ba Indonesia ba dimilione? Go ya ka pono ya motho, go be go bonagala ba ka se kgone
  go dira modiro woo! Lega go le bjalo, bana babo rena ba ile ba t\u0161wela pele
  ba na le tumelo e tiilego, ba kgodi\u0161egile gore Jehofa o tla \u2018romela ba\u0161omi
  punong ya gagwe.\u2019 (Mat. 9:38) Jehofa o ile a dira sona seo.\"", "\"Phela ka
  Lethabo \u2026 Lehono\\nPhela ka lethabo \u2026 lehono Phela ka lethabo \u2026 ka
  gare ga mathata Phela ka lethabo lehono \u2026 ka ntle le dit\u0161hiti\u0161o Phela
  ka lethabo \u2026 dinakong t\u0161e thata Phela ka lethabo \u2026 o tseba gore mehlolo
  e sa direga Phela ka lethabo \u2026 t\u0161hirelet\u0161ong ya Modimo Phela ka lethabo
  \u2026 ka ntle le poifo Phela ka lethabo \u2026 le go ikokobet\u0161a go Modimo
  Phela ka lethabo \u2026 le go letela se Modimo a ka se dirago Phela ka lethabo \u2026
  ka tsebo ya gore Modimo o sa dira mehlolo Phela ka lethabo \u2026 go mogau wa Modimo
  Phela ka lethabo \u2026 o tshepha Modimo Phela ka lethabo \u2026 o thu\u0161a ba
  bangwe Phela ka lethabo \u2026 ka ntle le pelaelo Phela ka lethabo \u2026 o tshepha
  Modimo go go nea katlego Go phela ka lethabo \u2026 le ge o le modumedi o nno\u0161i
  tikologong ya gago Go phela ka lethabo \u2026 go sa \u0161et\u0161we manyami Go
  phela o thabile \u2026 le ge o robegile pelo Go phela o thabile \u2026 ka gare ga
  go dira diphetho t\u0161e kgolo Phela ka lethabo \u2026 o tshepha Modimo go go nea
  katlego Phela ka lethabo \u2026 o le modirakhut\u0161o Go phela o thabile \u2026
  lehono (bofelo)\\nKe eng sephiri sa bophelo bja lethabo, go ya ka Bibele? Latela
  thulaganyo ye ya go bala ya mat\u0161at\u0161i a 22 gomme o hwet\u0161e gore o ka
  phela bjang ka lethabo let\u0161at\u0161i le lengwe le le lengwe. Ipshine ka leeto
  la gago la go bala Bibele!\"", "\"Beibele Inthaneteng\\nPHETOLELO YA LEFASE LE LEFSA
  YA MANGWALO A MAKGETHWA\\n6 \u201cWena yo botsebotse gare ga basadi, moratiwa wa
  gago o ile kae?+ Moratiwa wa gago o ile kae e le gore re tle re go nyaki\u0161e
  yena?\u201d\\n2 \u201cMoratiwa wa ka o theoget\u0161e serapeng+ sa gagwe, dirapaneng
  t\u0161a dihla\u0161ana t\u0161a dinoko.+ O ile go di\u0161et\u0161a+ dirapeng le
  go kga mat\u0161oba a lili.\\n3 Lesogana la ka ke la ka, le nna ke wa lona.+ Le
  di\u0161a+ gare ga mat\u0161oba a lili.\u201d\\n4 \u201cO yo mobotsana wena kgarebe
  ya ka,+ o bjalo ka Motse o Kgahli\u0161ago,+ o yo botse go et\u0161a Jerusalema,+
  o kgahli\u0161a go et\u0161a madira+ ao a dikanedit\u0161ego difoka.+\\n5 Tlo\u0161a
  mahlo+ a gago pele ga ka, ka gobane a nt\u0161ho\u0161it\u0161e. Moriri wa gago
  o et\u0161a mohlape wa dipudi woo o tshelatshelago o et\u0161wa Gileada.+\\n6 Meno
  a gago a et\u0161a mohlape wa dinku t\u0161a ditshadi t\u0161e di sa t\u0161wago
  go hlapi\u0161wa, t\u0161eo ka moka di tswalago mafahla, go se le e tee ya t\u0161ona
  yeo e lobilego dikwana.+\\n7 Bokagodimo bja marama a gago bjo bo \u0161irilwego
  ke le\u0161ira bo et\u0161a seripa sa garenate.+\\n8 Go ka ba go na le bahumagadi
  ba masometshela, basadi ba direthe ba masomeseswai le basetsana ba bant\u0161int\u0161i.+\\n9
  Eup\u0161a ke o tee yo e lego leebana+ la ka, motho wa ka yo a hlokago bosodi.+
  Ke yena morwedi wa mmamoratwa go mmagwe. Ke yena mosekegi wa yo a mmelegego. Dikgarebe
  di mmone gomme t\u0161a bolela gore o thabile; bahumagadi le basadi ba direthe le
  bona ba mmone gomme ba mo tumi\u0161a+ ba re:\\n10 \u2018Ke mang mosadi+ yo yo a
  lebelet\u0161ego fase go et\u0161a masa,+ yo mobotsana go et\u0161a kgwedi e tlet\u0161ego,+
  yo a sekilego go et\u0161a let\u0161at\u0161i+ leo le phadimago le yo a kgahli\u0161ago
  go et\u0161a madira ao a dikanedit\u0161ego difoka?\u2019\u201d+\\n11 \u201cKe theoget\u0161e
  serapeng+ sa sehlare sa dikoko gore ke yo bona mahlogedi moeding wa mafula,+ ke
  yo bona ge e ba morara o hlogile, ge e ba megarenate e thunt\u0161e.+\\n12 Ge ke
  re phaphara, ke ile ka ipona ke le dikoloing t\u0161a batho ba ge\u0161o ba baithaopi.\u201d\\n13
  \u201cBoa, boa wena Moshulami! Boa, boa re tle re go bone!\u201d+\u201cLe bona\u2019ng
  go Moshulami yo?\u201d+\u201cRe bona selo se se swanago le dihlopha t\u0161e pedi
  t\u0161a babini!\u201d\"", "\"Episode 3945\\n#Mahlakung \u2013Alfios o t\u0161hogile
  kudu ge Malehu a mmot\u0161a gore sebatana seo Matsobane a nago le sona se nyaka
  sehlabelo sa madi a bana ba bona.Malehu o mo elet\u0161a gore yena a se fe Rethabile
  gomme Matsobane a se fe Mochichi. Alfios o mmot\u0161a gore yena ga a sa sepela
  o ya go dula le yena ka ge a t\u0161haba noga kudu.Naa Alfios le Matsobane ba bothateng
  ?\\nEpisode 3944\\n#Mahlakung \u2013Bra Bizza o bot\u0161a Konstabel Mpedi gore
