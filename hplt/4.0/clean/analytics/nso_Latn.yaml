  ebile a bot\u0161a Moruti Kgole go bot\u0161a Badgirl go emi\u0161a ka mogwanto?\\nEpisode
  3932\\n#Mahlakung-Matsobane o bot\u0161a Titi gore gosasa Rethabile o tla ba a boile
  ka gae.O mmot\u0161a gore go nale seo a yago go se dira.Naa Matsobane ke moporofeta
  goba o hlatha eng?\\nEpisode 3931\\nMonday \u2013Episode 3931\u201326th MAY 2025
  @19h55 #Mahlakung \u2013Titi o lla gabohloko ka ge a gopola gore Robert o bolaile
  Rethabile morago ga gore Mamabona a mmot\u0161e gore mongaka Malehu o re ditaola
  t\u0161a gagwe di mmont\u0161ha phoofolo , noga le lepokisi. Naa ka nnete Robert
  o bolaile Rethabile goba go diragala eng?\\nEpisode 3930\\n#Mahlakung \u2013Petronella
  o hweleledit\u0161e Matsobane a bolela ka mogala le mothotsoko ka selo seo a bolelago
  gore ga se ba mmot\u0161a ge ba mo fa sona gore se nale magato a go fapana, le gore
  se nyaka madi le gore Alfios o bolela gore selo seo se gare se a gola.Naa bophelo
  bja Matsobane le Afios bo kotsing?\\nEpisode 3929\\n#Mahlakung \u2013Konstabel Mpedi
  o thomile dinyaki\u0161i\u0161o ka David Potsotso Mampane e bile re kwa a kgopela
  \u201cSelosecha\u201dgo mo i\u0161a lebitleng la gagwe.Naa Konstabel Mpedi o ya
  go dira eng lebitleng la David Mampane?\\nEpisode 3928\\n#Mahlakung \u2013Rethabile
  le Titi ba lwa ntwa ya mahlo a mahwibidu ge Rethabile a ganelela go ba le Robert
  a gana go ya gae?Naa Titi o tla kgona go ba kgaogant\u0161ha goba Rethabile ke gona
  ge a nyamelet\u0161e?\\nEpisode 3927\\n#Mahlakung-Phetola o ganne go amogela R100
  000 ya Matsobane yeo a bego a mo tshepisa yona gore a boe kerekeng ya gagwe. Alfios
  o bit\u0161a phetola setlaela go gana t\u0161helete.Naa Phetola o bone eng ga Mabona
  ya go dira gore a tlogele kereke ya gagwe?\\nEpisode 3926\\n#Mahlakung \u2013Moruti
  Kgole le Mmamoruti Sister Millicent ,ba thekga lesolo la go ya go gwanta kgahlanong
  le tlai\u0161o ya Petronella.Re kwa Bra Bizza le Jonjon ba bont\u0161ha let\u0161hogo
  la bona ka Matsobane, moo re kwago Bizza a bot\u0161i\u0161ago Moruti gore o nyaka
  go roula naa le Jonjon a bolela ka go ba kotsi ga Matsobane?Naa Moruti, Mmamoruti
  le set\u0161haba sa Mahlakung ba raloka ka mollo?\"", "\"101Barwa ba Arone, Nadaba
  le Abihu, ba t\u0161ea dibjana t\u0161a bona t\u0161a magala ba nokela magala, ba
  t\u0161hela seorelo godimo ga ona, gomme ba a tli\u0161a go Morena. Fela mollo wo
  o be o se wa dumelelwa, ka gobane Morena o be a se a ba laela go o tli\u0161a. 2Ka
  bjako Morena a romela mollo, gomme wa ba t\u0161huma ba hwa gona moo pele ga gagwe.
  3Moshe a re go Arone: \u201cSe ke se Morena a bego a bolela ka sona ge a re: \u2018Ka
  moka bao ba ntirelago ba swanet\u0161e go hlompha bokgethwa bja ka; ke tla utollela
  set\u0161haba sa ka letago la ka.\u2019 \u201d10:3 \u201cke tla utollela set\u0161haba
  sa ka letago la ka\u201d goba \u201cset\u0161haba sa ka se swanet\u0161e go ntlhompha\u201d
  Eup\u0161a Arone a ikhomolela.\\n4Moshe a bit\u0161a Mishaele le Elitsafane, barwa
  ba Usiele, rangwane wa Arone, a re go bona: \u201cTlang mo, le tlo\u0161eng ditopo
  t\u0161a bomorwarragolena Tenteng ye kgethwa, le di bee ka ntle ga me\u0161a\u0161a.\u201d
  5Ba tla ba di kuka di sa le ka diaparong t\u0161a boprista ba di i\u0161a ka ntle
  ga me\u0161a\u0161a, ka moo Moshe a laet\u0161ego ka gona.\\n6Ke moo Moshe a it\u0161ego
  go Arone le barwa ba gagwe, Eleasara le Ithamara: \u201cLe se ke la tlogela meriri
  ya ba mahlafarara, goba la gagola diaparo t\u0161a lena. Ge le ka dira bjalo le
  tla hwa, gomme Morena o tla befelelwa set\u0161haba ka moka. Fela Baisraele ba gabolena
  ka moka bona ba dumelet\u0161we go ilela bahu ba ba bolailwego ka mollo woo Morena
  a o romet\u0161ego. 7Le se ke la tloga mojakong wa Tente gore le se hwe, ka gobane
  le beilwe baprista ka makhura a Morena a tlot\u0161o.\u201d Ba dira bjalo ka ge
  Moshe a be a ba laet\u0161e.\\n8Morena a re go Arone: 9\u201cWena le barwa ba gago
  le se ke la tsena ka Tenteng ya bodulo bja ka le nwele beine goba bjala, gore le
  se hwe. Wo ke molao woo o swanet\u0161ego go phethwa ke ditlogolo t\u0161a gago
  ka moka. 10Le kgetholle t\u0161e dikgethwa go t\u0161e e sego t\u0161e dikgethwa,
  le t\u0161e di hlwekilego go t\u0161e di sego t\u0161a hlweka. 11Le ruteng set\u0161haba
  sa Israele melao ka moka ye ke le filego yona ka Moshe.\u201d\\n12\\nMoshe a re
  go Arone le go barwa ba gagwe ba babedi ba ba \u0161et\u0161ego, Eleasara le Ithamara:
  \u201cT\u0161eang kabelo ya bupi ye e \u0161et\u0161ego mola dijong t\u0161e di
  abet\u0161wego Morena, mme ka yona le direng senkgwa se se se nago komelo, gomme
  le se je ka lehlakoreng la aletare, ka gobane kabelo ye ke ye kgethwakgethwa. 13Le
  se jeng felong mo gokgethwa; ke seripa se e lego sa gago le barwa ba gago sa dijo
  t\u0161e di abet\u0161wego Morena. Seo ke se Morena a ntaet\u0161ego sona. 14\\nGomme
  lena le ba malapa a lena le ka jela leumo le serope t\u0161ela di abelwago Morena
  e le mpho ye e fiwago yena, le kabelo ye e abelwago yena ka tsela ye e it\u0161eng.
  Le ka di ja lefelong lefe le lefe le le hlweket\u0161ego tirelo. Diaba t\u0161e
  di filwe lena le bana ba lena e le seripa se e lego sa lena sa dihlabelo t\u0161a
  kagi\u0161ano t\u0161a Baisraele. 15Ba tli\u0161e serope seo le leumo leo ka nako
  ya ge makhura a tli\u0161wa e le sehlabelo go Morena. Diaba t\u0161e ke t\u0161a
  lena le bana ba lena go ya go ile, ka moo Morena a laet\u0161ego ka gona.\u201d\\n16Moshe
  a bot\u0161i\u0161a ka pudi ya sehlabelo sa tshwarelo ya dibe, gomme a kwa gore
  e \u0161et\u0161e e t\u0161humilwe. Ka gona a befelelwa Eleasara le Ithamara mme
  a ba bot\u0161i\u0161a a re: 17\\n\u201cKe ka lebaka lang le se la ja sehlabelo
  sa tshwarelo ya dibe felong mo go kgethwa? Ke se sekgethwakgethwa, gomme Morena
  o le file sona gore le tlo\u0161e sebe sa set\u0161haba go se boelanya le Morena.
  18Ka ge madi a yona a se a tli\u0161wa ka tenteng ye kgethwa, le be le swanet\u0161e
  go ja sehlabelo seo ka ntshe, ka moo ke laet\u0161ego ka gona.\u201d\\n19Arone a
  mo fetola a re: \u201cGe nkabe ke lle sehlabelo seo lehono, a seo se be se tla kgahla
  Morena? Set\u0161haba se diret\u0161e Morena sehlabelo sa sona sa tshwarelo ya dibe
  le sehlabelo sa go t\u0161hungwa ka moka lehono, le ge go le bjalo ke hlaget\u0161we
  ke t\u0161e \u0161oro t\u0161e.\u201d 20Ge Moshe a ekwa taba yeo, a kgotsofala.\\n111Morena
  o file Moshe le Arone melawana ye 2ya Baisraele. Le ka ja phoofolo efe goba efe
  ya nageng 3ye e nago le ditlhako t\u0161a mapharo gape ye e otlago. 4-6Eup\u0161a
  le se ke la ja dikamela le dipela le mebutla. T\u0161e di swanet\u0161e go t\u0161ewa
  gore di t\u0161hilafet\u0161e; di a otla, eup\u0161a ga di ne ditlhako t\u0161a
  mapharo. 7Le se ke la ja dikolobe. Di swanet\u0161e go t\u0161ewa gore di t\u0161hilafet\u0161e;
  di na le ditlhako t\u0161a mapharo, fela ga di otle. 8Le se ke la ja diphoofolo
  t\u0161e le ge e le go kgwatha ditoto t\u0161a t\u0161ona; di t\u0161hilafet\u0161e.\\n9Le
  ka ja dihlapi t\u0161a mohuta ofe le ofe t\u0161e di nago le diphegwana le magapi,
  10eup\u0161a se sengwe le se sengwe se se phelago ka meetseng se se ne diphegwana
  le magapi se t\u0161hilafet\u0161e. 11Dibopiwa t\u0161a mohuta woo di swanet\u0161e
  go t\u0161ewa gore ke dit\u0161hila go lena. Ga le a swanela go di ja le ge e le
  go kgwatha ditoto t\u0161a t\u0161ona. 12Se sengwe le se sengwe se se phelago ka
  meetseng mme se se ne diphegwana le magapi ke dit\u0161hila go lena.\\n13-19Dinonyana
  t\u0161e di latelago le se ke la di ja; ke dit\u0161hila go lena: manong, le dint\u0161hu,
  le maaka ka mehuta ya ona, le dipekwa ka mehuta ya t\u0161ona, le magokobu ka mehuta
  ya ona, le dimp\u0161he, le maribi\u0161i ka mehuta ya ona, le digot\u0161ane ka
  mehuta ya t\u0161ona, le dikokolohute, le megole, le boma\u0161ianoke ka mehuta
  ya bona, le dikukuku, le bomankgaganyane ka mehuta ya bona.\\n20Dikhunkhwane ka
  moka t\u0161e di nago le diphego di t\u0161hilafet\u0161e, 21ntle le t\u0161eo di
  nago le maotwana a di tabogatabogago ka ona. 22Le ka ja t\u0161ie ya segongwane
  ka mehuta ya yona, le ditatakgope ka mehuta ya t\u0161ona, le mehloro ka mehuta
  ya yona, le ditlhakwanapitsi ka mehuta ya t\u0161ona. 23Eup\u0161a dilo t\u0161e
  dingwe t\u0161e nnyane t\u0161e di nago le diphego gape di nago le maotwana a mane
  di swanet\u0161e go t\u0161ewa gore ke dit\u0161hila go lena.\\n24-28Yo a ka kgwathago
  ditoto t\u0161a diphoofolo t\u0161e di latelago o tla t\u0161hilafala go fihlela
  mant\u0161iboa: diphoofolo ka moka t\u0161a ditlhako, ge e se ge ditlhako t\u0161a
  t\u0161ona e le mapharo gomme di otla, le diphoofolo ka moka t\u0161a maoto a mane
  t\u0161a borofa. Yo a ka rwalago ditoto t\u0161a t\u0161ona o swanet\u0161e go hlatswa
  diaparo t\u0161a gagwe, eup\u0161a o tla fela a sa t\u0161hilafet\u0161e go fihlela
  mant\u0161iboa.\\n29-30Dirunya le magotlo le mahohomedi le mekgaritswane ye mengwe
  le maobu di swanet\u0161e go t\u0161ewa gore di t\u0161hilafet\u0161e. 31Yo a ka
  di kgwathago di hwile o tla t\u0161hilafala go fihlela mant\u0161iboa. 32Gomme ge
  di ka wela godimo ga selo se sengwe di hwile, se tla t\u0161hilafala, e ka ba se
  se dirilwego ka kota goba le\u0161ela goba mokgopa goba lesaka, go sa kgathalege
  gore se \u0161omi\u0161wa go dira eng. Selo seo se inwe meetseng, eup\u0161a se
  tla no ba se t\u0161hilafet\u0161e go fihlela mant\u0161iboa. 33Gomme ge ditoto
  t\u0161a t\u0161ona di ka wela ka pit\u0161eng ya letsopa, se sengwe le se sengwe
  se se lego ka go yona se tla t\u0161hilafala, gomme pit\u0161a yeo le e p\u0161hatle.
  34Dijo t\u0161e di loket\u0161ego go lewa, ge di ka t\u0161helwa ka meetse a a t\u0161wago
  ka pit\u0161eng yeo, di tla t\u0161hilafala, le seno sefe le sefe se se lego ka
  pit\u0161eng yeo se t\u0161hilafet\u0161e. 35Selo sefe le sefe se se ka welwago
  ke ditoto t\u0161a dilo t\u0161eo se t\u0161hilafet\u0161e; ge e ka ba onto goba
  setofo sa letsopa se p\u0161hatlwe; 36ge e le mothopo goba molete wa meetse wona
  ga o t\u0161hilafale, go t\u0161hilafala se se ka kgwathago ditoto t\u0161a t\u0161ona
  t\u0161e di wet\u0161ego ka go wona. 37Ge setoto sa t\u0161ona se ka wela godimo
  ga peu ye e yago go bjalwa, peu yeo e ka se t\u0161hilafale. 38Eup\u0161a ge peu
  yeo e ka welwa ke setoto sa t\u0161ona e \u0161et\u0161e e innwe ka meetseng, gona
  peu yeo e t\u0161hilafet\u0161e.\\n39Ge phoofolo ye e lewago e ka hwa, yo a ka e
  kgwathago o tla t\u0161hilafala go fihlela mant\u0161iboa. 40Gomme yo a ka jago
  nama ya yona, a hlatswe diaparo t\u0161a gagwe, fela o tla fela a sa t\u0161hilafet\u0161e
  go fihlela mant\u0161iboa; yo a ka rwalago setoto seo o swanet\u0161e go hlatswa
  diaparo t\u0161a gagwe, fela o tla fela a sa t\u0161hilafet\u0161e go fihlela mant\u0161iboa.\\n41Le
  se ke la ja segagabi sefe le sefe, 42e ka ba se se sepelago ka mpa, goba ka maoto
  a mane, goba ka maoto a mant\u0161i \u2013 t\u0161ohle di t\u0161hilafet\u0161e.
  43Le se ke la it\u0161hilafat\u0161a ka go ja se sengwe sa t\u0161ona. 44\\nKe nna
  Morena Modimo wa lena, gomme ineeleng go nna, mme le beng ba bakgethwa, ka gore
  nna ke yo mokgethwa. 45Ke nna Morena yo ke le nt\u0161hit\u0161ego Egepeta gore
  ke tle ke be Modimo wa lena. Le beng ba bakgethwa, ka gobane nna ke yo mokgethwa.\\n46Woo
  ke wona molao mabapi le diphoofolo, le dinonyana, le diphedi t\u0161ohle t\u0161a
  ka meetseng, le digagabi t\u0161ohle. 47Molao wo ke wa gore le kgethologanye se
  se hlwekilego le se se sego sa hlweka, diphedi t\u0161e di ka lewago le t\u0161eo
  di sego t\u0161a swanela go lewa.\\n121Morena o file Moshe melawana ye 2ya Baisraele.
  Ge mosadi a ka belega ngwana wa mo\u0161emane, o t\u0161hilafala mat\u0161at\u0161i
  a a \u0161upago, go no swana le ge a t\u0161hilafala ge a bone kgwedi. 3\\nKa let\u0161at\u0161i
  la seswai ngwana yoo a bolot\u0161we. 4Go tla feta mat\u0161at\u0161i a mangwe a
  masome a mararo le met\u0161o ye meraro gore mmagwe a hlweke ka ge a t\u0161wele
  madi; a se ke a kgwatha selo se sekgethwa goba a tsena ka Tenteng ye kgethwa go
  fihlela ge nako ya gagwe ya go hlweki\u0161wa e fetile.\\n5Ge mosadi a ka belega
  ngwana wa mosetsana, o t\u0161hilafala mat\u0161at\u0161i a lesome le a mane, go
  no swana le ge a t\u0161hilafala ge a bone kgwedi. Go tla feta mat\u0161at\u0161i
  a mangwe a masome a a selelago le met\u0161o ye e selelago gore a hlweke ka ge a
  t\u0161wele madi.\\n6Ge mosadi a belege ngwana wa mo\u0161emane goba wa mosetsana
  mme nako ya go hlweki\u0161wa ga gagwe e fetile, a tli\u0161e kwanyana ya ngwaga
  o tee go moprista mojakong wa Tente ya bodulo bja Morena e le sehlabelo sa go t\u0161hungwa
  ka moka; a tli\u0161e le leeba goba mokuru e le sehlabelo sa tshwarelo ya dibe.
  7Moprista a direle Morena sehlabelo seo sa mosadi yoo mme a mmoelanye le yena; ke
  moo a tlago ba a hlweki\u0161it\u0161we ka ge a be a t\u0161wele madi. 8Seo ke se
  mosadi a swanet\u0161ego go se dira ge a seno belega.\\n9\\nGe mosadi a se ne kwanyana,
  a tli\u0161e mekuru ye mebedi goba maeba a mabedi, le lengwe e be la sehlabelo sa
  go t\u0161hungwa ka moka, mme le lengwe e be la sehlabelo sa tshwarelo ya dibe,
  gomme moprista a mmoelanye le Morena, mme o tla hlweka.\"", "\"Beibele Inthaneteng\\nPHETOLELO
  YA LEFASE LE LEFSA YA MANGWALO A MAKGETHWA\\n6 Re \u0161oma gotee le yena,+ gape
  re le lopa gore le se ke la amogela botho bjo bogolo bja Modimo gomme la lahlegelwa
  ke morero wa bjona.+\\n2 Gobane o re: \u201cKe go kwele ka nako e amogelegago gomme
  ke go thu\u0161it\u0161e let\u0161at\u0161ing la pholo\u0161o.\u201d+ Bonang! Bjale
  ke nako e amogelegago ka mo go kgethegilego.+ Bonang! Bjale ke let\u0161at\u0161i
  la pholo\u0161o.+\\n3 Ka tsela le ge e le efe ga re nee lebaka la go kgop\u0161a,+
  gore bodiredi bja rena bo se ke bja solwa;+\\n4 eup\u0161a re ipolelela ka ditsela
  t\u0161ohle+ re le badiredi ba Modimo, ka go kgotlelela dilo t\u0161e dint\u0161i,
  ka ditlai\u0161ego, ka mabaka a go hloka dilo, ka mathata,+\\n5 ka go itiwa, ka
  go golegwa,+ ka meferefere, ka go \u0161oma ka thata, ka ma\u0161ego a go hlorega
  boroko, ka dinako t\u0161a go se be le dijo,+\\n6 ka tshekego, ka tsebo, ka go kgotlelela
  ka go se fele pelo,+ ka botho,+ ka moya o mokgethwa, ka lerato le le se nago boikaket\u0161i,+\\n7
  ka polelo ya go rere\u0161a, ka matla a Modimo;+ ka dibet\u0161a+ t\u0161a toko
  ka letsogong la le letona le ka letsogong la le letshadi,\\n8 ka letago le lenyat\u0161o,
  ka pego e mpe le pego e botse; ka go swarwa bjalo ka bafori+ fela re le ba go rere\u0161a,\\n9
  re t\u0161ewa bjalo ka ba ba sa tsebjego fela re tsebja,+ re t\u0161ewa re le ba
  swanet\u0161wego ke lehu eup\u0161a re a phela,+ re itiwa + fela re sa gafelwe lehu,+\\n10
  bjalo ka ba nyamilego eup\u0161a re dula re thabile, bjalo ka badiidi fela re humi\u0161a
  ba bant\u0161i, le bjalo ka ba se nago selo fela re na le dilo t\u0161ohle.+\\n11
  Bakorinthe, re bolet\u0161e le lena ka go se pepetlet\u0161e, lerato leo le lego
  dipelong+ t\u0161a rena le katologet\u0161e go lena.\\n12 Ga re dikadike go le bont\u0161heng
  lerato,+ eup\u0161a lena le a dikadika go re bont\u0161heng lona.+\\n13 Ka gona
  ke bolela bjalo ka ge go bolelwa le bana,+ ke re le dire se se swanago le go rena
  ka gore le lena le katolo\u0161eng lerato leo le lego dipelong t\u0161a lena.\\n14
  Le se ke la rwala joko le ba ba sa dumelego.+ Gobane toko le go hloka molao di na
  le segwera sefe?+ Goba seet\u0161a se abelana eng le leswiswi?+\\n15 Go feta moo,
  go na le kwano efe magareng ga Kriste le Sathane?+ Goba modumedi o swana+ ka eng
  le yo a sa dumelego?\\n16 Tempele ya Modimo e na le tumelelano efe le medingwana?+
  Gobane re tempele+ ya Modimo yo a phelago; go et\u0161a ge Modimo a it\u0161e: \u201cKe
  tla dula gare ga bona+ ka sepela gare ga bona gomme ke tla ba Modimo wa bona, bona
  e tla ba batho ba ka.\u201d+\\n17 Jehofa o re: \u201c\u2018Ka gona t\u0161wang gare
  ga bona, le itlhaole le lese go kgwatha selo se se sa hlwekago\u2019\u201d;+ \u201c\u2018gomme
  ke tla le amogela.\u2019\u201d+\\n18 \u201c\u2018Ke tla ba tatago lena,+ lena le
  tla ba barwa le barwedi ba ka,\u2019+ go bolela Jehofa Ramatlaohle.\u201d+\"", "\"Selo
  sa botse kudu ka kgogo ke gore e nyaka e ba nonyana ka moka yeo e ka \u0161omi\u0161wago,
  o ka ja nama ya phepo ye go godimo kudu gomme wa diri\u0161a marapo a ma\u0161aledi
  go dira dithoto. Nama gape key a go fapana gomme e ka be\u0161wa sebe\u0161ong,
  ya dirwa set\u0161uu, go dirwa kheri goba go be\u0161wa. Butcher SA e le dit\u0161hi\u0161inyo
  t\u0161e di latelago t\u0161a go apea:\\nKgogo ka Moka\\nDinonyana t\u0161a ka moka
  di a hwet\u0161agala ka bareki\u0161eng di na le goba ka ntle le dikiblete (dikiblete
  ke lereo leo le \u0161omi\u0161wago ka go kopant\u0161hwe ka kilana, pshio, pelo,
  sebete le molale). ge o reka kgogo ka moka dikiblete gant\u0161hi di phuthet\u0161we
  ka polastiki ka gare ga kgogo. Mokotla wa go ba le dikiblete o swanet\u0161e go
  tlo\u0161wa pele ga ge o apea nonyana.\\nKgogo e ka apewa ka moka goba e kgaogant\u0161hwe
  ka dikaroganyo t\u0161a go bapa le mokokotlo (e but\u0161we). Dinonyana ka moka
  di ka t\u0161ent\u0161hwa marineite le go hlohlwa t\u0161e dingwe pele ga ge e ka
  be\u0161wa goba go pakwa. Kgogo yeo e but\u0161wego e tsent\u0161hwa marineite,
  ya be\u0161wa ka obeneng goba e be\u0161we sebe\u0161ong.\\nMapheko\\nMaphego a
  nonyana a dira mabosabosana wa maleba goba mathomo, kudukudu ka souso ya go kgomarela
  goba marineite. Di ka be\u0161wa ka obeneng goba di t\u0161ent\u0161hwe dinoko t\u0161a
  apewa.\\nDikgara le Thendaloin\\nDikgara le dithendaloin di na le nama ye t\u0161hweu
  le makhura a go ba ma nnyane kudu. Dithendaloin di bolete go feta kgara ka moka.
  Dikgara le dithendaloin di ka pakwa, di apewe ka ntle le meetse, be be\u0161we,
  di be\u0161we go feta tekano, di gadikwe ka go \u0161omi\u0161wa pane ka boyona,
  ka diselae, disopo goba st\u0161uu. E ka rekwa ka ntle le go ba la letlalo goba
  le mapheko (mapheko a go ripiwa \u0161adi\u0161a ka mohlakanelweng) a kgomaredit\u0161we
  letlalong.\\nMaoto\\nMaoto, a bopilwe ka serope sa tlase le kopanyo ya serope, di
  t\u0161ewa bjalo dikarolo t\u0161a go monwa le go ba le tatso kudu dikgogong. Di
  ka t\u0161ent\u0161hwa marineite goome t\u0161a be\u0161wa ka obeneng goba t\u0161a
  be\u0161wa sebe\u0161ong, go \u0161omi\u0161wa ka dikhaseroleng, dikhering le st\u0161uung.\\nMateng\\nSebete
  ke mothopo wo mobotse wa tshipi le proteine gomme se ka gadikwa le konofele le me\u0161unkwane
  ye mengwe go t\u0161welet\u0161a pheite ya sebete. Go feta fao e loket\u0161we go
  gadikwa ka botebeong. Nose to Tail go hlohlelet\u0161wa go inela sebete ka maswing
  a botoro meetseng a esete pele ga ge se apewa go dira tatso e ne seet\u0161a.\\nDikiblete
  t\u0161e dingwe ka moka, kilana, pelo le diph\u0161io, di ka bedi\u0161wa go t\u0161welet\u0161a
  setoko goba moro, goba e ka gadikwa ka botebo. O seke wa tsent\u0161ha sebete ge
  o dira setoko, ka ge se tla fa setoko tatso ye bo\u0161ula.\\nKilana e na tshipi
  ya godimo, dibithamini A le C, kalasiamo, sodiamo le potassiamo, mola pelo e le
  go mothopo wo mobotse wa proteine, bithamini b12, folate le zinki. Dipshio, Go ya
  ka Nose to Tail, e na melatonin receptors t\u0161eo di bego di tsebjwa ka go lwant\u0161ha
  bot\u0161ofe gammogo le kankere. E ya \u0161omi\u0161wa ka dikotlelong t\u0161e
  go khethega t\u0161a Sefora le SeChina.\\nCockscomb ke ya go ba le gelatin, e nago
  le palo ye nnyane ya diproteine le diaminoesiti. Ke ditswaki t\u0161e di tumilego
  ka dim sum ya maChina le Cibreo ya Mantariana. Mapele a na le proteine, sodiamo,
  potassiamo, tshipi, zinki, fosforo le maknisiamo gomme a \u0161omi\u0161wa ka merong
  le dist\u0161uu. Dikefa t\u0161a dikgogo le mapele di swanet\u0161e go hlweki\u0161wa
  gomme t\u0161a bidi\u0161wa go tlo\u0161a letlalo pele ga ge di a apewa.\\nMaotwana
  a dikgogo a tladi\u0161we ka proteine, kalasiamo, kholajene le le\u0161etla. Di
  ka gadikwa ka botebo goba di bedi\u0161we go t\u0161welet\u0161a moro goba stoko.
  Letlalo le swanet\u0161e go tomolwa go tloga maotong pele ga go apea.\\nTranslated
  by Lawrence Ndou\"", "\"Beibele Inthaneteng | PHETOLELO YA LEFASE LE LEFSA YA MANGWALO
  A MAKGETHWA\\nGo moopedi\u0161i. Ko\u0161a ya Dafida.\\n19 Magodimo a bolela ka
  letago la Modimo;+\\nGomme mediro ya diatla t\u0161a gagwe e tsebat\u0161wa ke sebakabaka.+\\n2
  Let\u0161at\u0161i le lengwe le le lengwe le bakela gore go be le seo se bolelwago,+\\nBo\u0161ego
  bjo bongwe le bjo bongwe bo bonagat\u0161a tsebo.+\\n3 Ga go kwale polelo, ga di
  nt\u0161he mant\u0161u;\\nGa go na modumo wa lent\u0161u wo o kwalago go t\u0161ona.+\\n4
  Eup\u0161a molaet\u0161a wa t\u0161ona o ile lefaseng ka moka,+\\nGomme dipolelo
  t\u0161a t\u0161ona di ile phelet\u0161ong ya lefase.+\\nGo t\u0161ona Modimo o
  beile tente ya let\u0161at\u0161i,+\\n5 Let\u0161at\u0161i le swana le monyadi ge
  a et\u0161wa ka phapo\u0161ing ya gagwe;+\\nLe hlalala go et\u0161a mogale ge a
  kitima tseleng ya gagwe.+\\n6 Le tloga phelet\u0161ong e nngwe ya magodimo go ya
  go e nngwe,\\nLe dikologa go tloga phelet\u0161ong e nngwe go ya go e nngwe ya ona;+\\nGa
  go seo se ka ikutelago phi\u0161o ya lona.+\\n7 Molao+ wa Jehofa o phethaget\u0161e,+
  o tso\u0161olo\u0161a moya.+\\nKgopot\u0161o+ ya Jehofa e a botega,+ e dira gore
  yo a se nago temogo a be bohlale.+\\n8 Ditayo+ t\u0161e di t\u0161wago go Jehofa
  di lokile,+ di thabi\u0161a pelo;+\\nTaelo+ ya Jehofa e hlwekile,+ e phadimi\u0161a
  mahlo.+\\n9 Go boifa+ Jehofa go sekile, go ema ka mo go sa felego.\\nDikahlolo+
  t\u0161a Jehofa di a rere\u0161a;+ di lokile ka mo go felet\u0161ego.+\\n10 Di kganyogega
  go feta gauta, ee, go feta gauta e nt\u0161i yeo e seki\u0161it\u0161wego;+\\nDi
  bose go feta dinose+ le todi yeo e elelago ya mamapo.+\\n11 Le gona mohlanka wa
  gago di mo lemo\u0161it\u0161e;+\\nGo di lota go na le moputso o mogolo.+\\n12 Ke
  mang yo a ka lemogago dipho\u0161o t\u0161a gagwe?+\\nO se mpalele dibe t\u0161eo
  ke sa lemogego gore ke di dirile.+\\n13 Le gona thibela mohlanka wa gago go dira
  ditiro t\u0161a go ikgodi\u0161a;+\\nO se di dumelele gore di mpu\u0161e.+\\nGe
  go le bjalo ke tla be ke felet\u0161e,+\\nGomme ke tla be ke dut\u0161e ke se na
  molato dikarogong t\u0161e dint\u0161i.\\n14 Anke dipolelo t\u0161a molomo wa ka
  le t\u0161eo pelo ya ka e di nagani\u0161i\u0161ago+\\nE be t\u0161e di kgahli\u0161ago
  pele ga gago, wena Jehofa Leswika la ka+ le Molopolodi wa ka.+\"", "\"141Ka t\u0161at\u0161i
  le lengwe la Sabatha Jesu a ya go ja ka ga yo mongwe wa bagolo ba Bafarisei. Batho
  ba be ba tloga ba mmeile leihlo. 2A bona a lebane le monna yo mongwe wa go ruruga
  maoto le matsogo. 3A bot\u0161i\u0161a boramangwalo le Bafarisei a re: \u201cNa
  go fodi\u0161a motho ka t\u0161at\u0161i la Sabatha go dumelet\u0161we?\u201d\\n4Bona
  ba homola. Ke ge Jesu a t\u0161ea molwet\u0161i yola a mo fodi\u0161a, mme a mo
  lesa a itshepelela. 5\\nKe moka a re go bona: \u201cKe mang mo go lena yo e ka rego
  morwagwe a wet\u0161e ka sedibeng goba go wet\u0161e kgomo ya gagwe, a se e nt\u0161he
  le semeetseng le ge e le ka lona t\u0161at\u0161i la Sabatha?\u201d\\n6Bona ba se
  kgone go mo fetola mo tabeng yeo.\\n7Jesu ge a bona balalet\u0161wa ba bangwe ba
  ipea madulong a ka pele a ba bot\u0161a ka go swant\u0161ha a re: 8\\n\u201cGe motho
  a go laledit\u0161e monyanyeng wa lenyalo, o se ke wa fihla wa ipea madulong a bohlomphegi,
  ka gore e ka no ba e le gore go laledit\u0161we le yo mongwe yo a hlomphegago kudu
  go feta wena, 9gomme yo a le laledit\u0161ego ka babedi a tla a re go wena: \u2018\u0160utelela
  yo.\u2019 Gomme ya ba gona o yago go dula madulong a ka moragorago ka dihlong. 10Wena
  ge o laledit\u0161we o fihle o ipee madulong a ka moragorago, gore ge molalet\u0161i
  wa gago a etla a re go wena: \u2018Mogwera, fetela kua madulong a makaone!\u2019
  Gomme o tla godi\u0161wa ke ba ba laledit\u0161wego le wena. 11\\nGobane mang le
  mang yo a ikgodi\u0161ago o tla kokobet\u0161wa, gwa re yo a ikokobet\u0161ago a
  godi\u0161wa.\u201d\\n12A bot\u0161a le yola molalet\u0161i wa gagwe a re: \u201cGe
  o lalet\u0161a batho go tlo ja le wena dijo t\u0161a mosegare le ge e le t\u0161a
  mant\u0161iboa, o se ke wa lalet\u0161a ba e lego bagwera ba gago, goba banabeno,
  goba meloko yeno, goba baagi\u0161ani ba gago ba bahumi, gobane le bona ba ka tla
  ba go lalet\u0161a, gomme ya ba ge o boelwa ke t\u0161e o kilego wa ba direla t\u0161ona.
  13Wena ge o dira monyanya, o lalet\u0161e badiidi le dihlot\u0161a le digole le
  difofu, 14gomme o tla ba le mahlogonolo, gobane bao ga ba na se ba ka go bu\u0161et\u0161ago
  ka sona. O tla bu\u0161et\u0161wa ke Modimo mohla a tso\u0161a baloki bahung.\u201d\\n15Yo
  mongwe wa balalet\u0161wa ba ba bego ba le dijong, ge a ekwa Jesu a realo, a re
  go yena: \u201cGo lehlogonolo bao ba tlago tla dijong mmu\u0161ong wa Modimo!\u201d\\n16Jesu
  a re go yena: \u201cMotho yo mongwe o kile a dira monyanya wo mogolo, mme a lalet\u0161a
  batho ba bant\u0161i. 17Ge nako ya go keteka e fihla a roma mohlanka wa gagwe gore
  a yo bot\u0161a balalet\u0161wa a re: \u2018Etlang, t\u0161ohle di loki\u0161it\u0161we!\u2019
  18Eup\u0161a bona ka moka ba itatola ka o tee ka o tee. Wa mathomo a re go mohlanka
  yoo: \u2018Ke rekile t\u0161hemo, gomme ke swanet\u0161e go yo e bona. Hle, o mpolelele
  gore ke swaregile.\u2019 19Yo mongwe a re: \u2018Ke rekile dipholo t\u0161e lesome,
  gomme ke a ya go bona ge eba di tla goga gabotse. Hle, o mpolelele gore nka se kgone
  go tla.\u2019 20Yo mongwe a re: \u2018Ke sa t\u0161o nyala mosadi, gomme ke sona
  se se nt\u0161hiti\u0161ago go tla.\u2019\\n21\u201cMohlanka yola a boela morago
  a yo di bot\u0161a mong wa gagwe. Yena a galefa, a bot\u0161a mohlanka yoo a re:
  \u2018Itlhaganele o ye mekgotheng le mekgothaneng ya motse, o boe le badiidi le
  dihlot\u0161a le digole le difofu.\u2019 22Ka morago mohlanka yoo a boa, a re: \u2018Ke
  phethile se o rilego ke se dire, morena, fela go sa na le madulo.\u2019 23Monglapa
  a re go yena: \u2018Eya ditseleng le mebileng o yo gapelet\u0161a batho go tlo tsena,
  gore ntlo ya ka e tle e tlale. 24Gomme ke le bot\u0161a gore le o tee wa banna ba
  ba bego ba laledit\u0161we a ka se latswe dijo t\u0161a ka.\u2019 \u201d\\n25Ya
  re ge batho ba bant\u0161int\u0161i ba nt\u0161e ba sepela le yena, a retologa,
  a re go bona: 26\\n\u201cYo a tlago go nna a sa nthate go feta ka mo a ratago tatagwe,
  le mmagwe, le mosadiagwe, le bana ba gagwe, le bomorwarragwe, le dikgaet\u0161edi
  t\u0161a gagwe, e\u0161ita le yena mong, a ka se kgone go ba morutiwa wa ka. 27\\nYo
  a sego a ikemiset\u0161a go tlai\u0161wa bjalo ka nna mme a ntatela, a ka se kgone
  go ba morutiwa wa ka.\\n28\u201cGa ke re ge o nyaka go aga tora o thoma ka go dula
  fase wa akanya tshenyegelo ya gona, gore o bone ge eba o na le t\u0161helete ye
  e lekanego go phetha modiro woo? 29Gape ge o ka se dire bjalo, o tla re o beile
  motheo wa tla palelwa ke go phetha tora yeo, gomme wa kwerwa ke bohle ba ba di bonago.
  30Ba re: \u2018Moisa yo o kgonne go thoma go aga, fela go phetha go mo palet\u0161e.\u2019\\n31\u201cKgo\u0161i
  yona ke efe ye e ka rego e eya go lwa le ye nngwe ya se dule fase ya lebeledi\u0161i\u0161a
  ge eba e tla kgona ka bahlabani ba dikete t\u0161e lesome go lwa le yo a t\u0161wilego
  ka bahlabani ba dikete t\u0161e masome a mabedi? 32Ge a bona gore a ka se kgone,
  o tla roma batseta ba yo loba yola a sa le kgole.\u201d 33Jesu a fet\u0161a ka go
  re: \u201cKa wona mokgwa woo, yo a sa tlogelego t\u0161ohle t\u0161e a nago le t\u0161ona
  a ka se kgone go ba morutiwa wa ka.\u201d\\n34\u201cLetswai ke selo se sebotse,
  fela ge le ka tapa, le ka hlwa le sa tswailo\u0161wa ka eng? 35Ga le sa hola mobu
  ka selo e\u0161ita le wona mmutedi; sa lona ke go dio t\u0161hollwa. Yo a nago le
  tsebe a a kwe!\u201d\"", "\"Beibele Inthaneteng\\nPHETOLELO YA LEFASE LE LEFSA YA
  MANGWALO A MAKGETHWA\\n17 \u201cKe nolegile moko,+ mat\u0161at\u0161i a ka a fedile;\\nLebitla
  le nkemet\u0161e.+\\n2 Ke a kwerwa,+\\nLe mahlo a ka a dulela go bona boitshwaro
  bja bona bja borabele.\\n3 Hle anke o be kgonthi\u0161et\u0161o ya ka.+\\nKe mang
  yo mongwe yo a lego gona yo a tlago go fana diatla+ le nna e le go dira tlamo?\\n4
  O tswalelet\u0161e dipelo t\u0161a bona temogo.+\\nKe ka baka leo o sa ba phagami\u0161ego.\\n5
  Yo mongwe a ka bot\u0161a bagwera ba gagwe gore ba t\u0161ee dikabelo t\u0161a bona,\\nMola
  mahlo a barwa ba gagwe a tla palelwa.+\\n6 O dirile gore batho ba hlabe seema+ ka
  nna,\\nMoo ke bago wa go tshwelwa ka mare sefahlegong.+\\n7 Mahlo a ka a swifat\u0161wa
  ke go selekega,+\\nGe e le ditho t\u0161a ka ka moka di otile.\\n8 Baloki ba tsepelela
  se ka go makala,\\nLe yo a sego molato o tenwa ke mohlanogi.\\n9 Moloki o swarelela
  ka go tia tseleng ya gagwe,+\\nLe wa diatla t\u0161e di hlwekilego+ matla a gagwe
  a a oket\u0161ega.+\\n10 Lega go le bjalo, ka moka le ka no thomolo\u0161a. Ka gona
  hle,\\nDirang seo ka ge ke sa hwet\u0161e yo bohlale gare ga lena.+\\n11 Mat\u0161at\u0161i
  a ka a fetile,+ maano a ka a padile,+\\nT\u0161ona dikganyogo t\u0161a pelo ya ka.\\n12
  Bo\u0161ego ba re ke mosegare,+ ba re:\\n\u2018Ka ge go le leswiswi, gona seet\u0161a
  se batamet\u0161e.\u2019\\n13 Ge ke dula ke letile, gona Bodulabahu ke ntlo ya ka;+\\nKe
  tla ala bolao bja ka leswiswing.+\\n14 Ke tla goelet\u0161a molete+ ka re: \u2018O
  tate!\u2019\\nGo seboko+ ka re: \u2018O mma e bile o kgaet\u0161ediaka!\u2019\\n15
  Ka gona, kholofelo ya ka e kae?+\\nA go na le yo a naganago gore go na le kholofelo
  ka nna?\\n16 Kholofelo yeo e tla theogela dikgorong t\u0161a Bodulabahu,\\nGe ka
  moka ga rena re theogela gotee gona leroleng.\u201d+\"", "\"111Morena o file Moshe
  le Arone melawana ye 2ya Baisraele. Le ka ja phoofolo efe goba efe ya nageng 3ye
  e nago le ditlhako t\u0161a mapharo gape ye e otlago. 4-6Eup\u0161a le se ke la
  ja dikamela le dipela le mebutla. T\u0161e di swanet\u0161e go t\u0161ewa gore di
  t\u0161hilafet\u0161e; di a otla, eup\u0161a ga di ne ditlhako t\u0161a mapharo.
  7Le se ke la ja dikolobe. Di swanet\u0161e go t\u0161ewa gore di t\u0161hilafet\u0161e;
  di na le ditlhako t\u0161a mapharo, fela ga di otle. 8Le se ke la ja diphoofolo
  t\u0161e le ge e le go kgwatha ditoto t\u0161a t\u0161ona; di t\u0161hilafet\u0161e.\\n9Le
  ka ja dihlapi t\u0161a mohuta ofe le ofe t\u0161e di nago le diphegwana le magapi,
  10eup\u0161a se sengwe le se sengwe se se phelago ka meetseng se se ne diphegwana
  le magapi se t\u0161hilafet\u0161e. 11Dibopiwa t\u0161a mohuta woo di swanet\u0161e
  go t\u0161ewa gore ke dit\u0161hila go lena. Ga le a swanela go di ja le ge e le
  go kgwatha ditoto t\u0161a t\u0161ona. 12Se sengwe le se sengwe se se phelago ka
  meetseng mme se se ne diphegwana le magapi ke dit\u0161hila go lena.\\n13-19Dinonyana
  t\u0161e di latelago le se ke la di ja; ke dit\u0161hila go lena: manong, le dint\u0161hu,
  le maaka ka mehuta ya ona, le dipekwa ka mehuta ya t\u0161ona, le magokobu ka mehuta
  ya ona, le dimp\u0161he, le maribi\u0161i ka mehuta ya ona, le digot\u0161ane ka
  mehuta ya t\u0161ona, le dikokolohute, le megole, le boma\u0161ianoke ka mehuta
  ya bona, le dikukuku, le bomankgaganyane ka mehuta ya bona.\\n20Dikhunkhwane ka
  moka t\u0161e di nago le diphego di t\u0161hilafet\u0161e, 21ntle le t\u0161eo di
  nago le maotwana a di tabogatabogago ka ona. 22Le ka ja t\u0161ie ya segongwane
  ka mehuta ya yona, le ditatakgope ka mehuta ya t\u0161ona, le mehloro ka mehuta
  ya yona, le ditlhakwanapitsi ka mehuta ya t\u0161ona. 23Eup\u0161a dilo t\u0161e
  dingwe t\u0161e nnyane t\u0161e di nago le diphego gape di nago le maotwana a mane
  di swanet\u0161e go t\u0161ewa gore ke dit\u0161hila go lena.\\n24-28Yo a ka kgwathago
  ditoto t\u0161a diphoofolo t\u0161e di latelago o tla t\u0161hilafala go fihlela
  mant\u0161iboa: diphoofolo ka moka t\u0161a ditlhako, ge e se ge ditlhako t\u0161a
  t\u0161ona e le mapharo gomme di otla, le diphoofolo ka moka t\u0161a maoto a mane
  t\u0161a borofa. Yo a ka rwalago ditoto t\u0161a t\u0161ona o swanet\u0161e go hlatswa
  diaparo t\u0161a gagwe, eup\u0161a o tla fela a sa t\u0161hilafet\u0161e go fihlela
  mant\u0161iboa.\\n29-30Dirunya le magotlo le mahohomedi le mekgaritswane ye mengwe
  le maobu di swanet\u0161e go t\u0161ewa gore di t\u0161hilafet\u0161e. 31Yo a ka
  di kgwathago di hwile o tla t\u0161hilafala go fihlela mant\u0161iboa. 32Gomme ge
  di ka wela godimo ga selo se sengwe di hwile, se tla t\u0161hilafala, e ka ba se
  se dirilwego ka kota goba le\u0161ela goba mokgopa goba lesaka, go sa kgathalege
  gore se \u0161omi\u0161wa go dira eng. Selo seo se inwe meetseng, eup\u0161a se
  tla no ba se t\u0161hilafet\u0161e go fihlela mant\u0161iboa. 33Gomme ge ditoto
  t\u0161a t\u0161ona di ka wela ka pit\u0161eng ya letsopa, se sengwe le se sengwe
  se se lego ka go yona se tla t\u0161hilafala, gomme pit\u0161a yeo le e p\u0161hatle.
  34Dijo t\u0161e di loket\u0161ego go lewa, ge di ka t\u0161helwa ka meetse a a t\u0161wago
  ka pit\u0161eng yeo, di tla t\u0161hilafala, le seno sefe le sefe se se lego ka
  pit\u0161eng yeo se t\u0161hilafet\u0161e. 35Selo sefe le sefe se se ka welwago
  ke ditoto t\u0161a dilo t\u0161eo se t\u0161hilafet\u0161e; ge e ka ba onto goba
  setofo sa letsopa se p\u0161hatlwe; 36ge e le mothopo goba molete wa meetse wona
  ga o t\u0161hilafale, go t\u0161hilafala se se ka kgwathago ditoto t\u0161a t\u0161ona
  t\u0161e di wet\u0161ego ka go wona. 37Ge setoto sa t\u0161ona se ka wela godimo
  ga peu ye e yago go bjalwa, peu yeo e ka se t\u0161hilafale. 38Eup\u0161a ge peu
  yeo e ka welwa ke setoto sa t\u0161ona e \u0161et\u0161e e innwe ka meetseng, gona
  peu yeo e t\u0161hilafet\u0161e.\\n39Ge phoofolo ye e lewago e ka hwa, yo a ka e
  kgwathago o tla t\u0161hilafala go fihlela mant\u0161iboa. 40Gomme yo a ka jago
  nama ya yona, a hlatswe diaparo t\u0161a gagwe, fela o tla fela a sa t\u0161hilafet\u0161e
  go fihlela mant\u0161iboa; yo a ka rwalago setoto seo o swanet\u0161e go hlatswa
  diaparo t\u0161a gagwe, fela o tla fela a sa t\u0161hilafet\u0161e go fihlela mant\u0161iboa.\\n41Le
  se ke la ja segagabi sefe le sefe, 42e ka ba se se sepelago ka mpa, goba ka maoto
  a mane, goba ka maoto a mant\u0161i \u2013 t\u0161ohle di t\u0161hilafet\u0161e.
  43Le se ke la it\u0161hilafat\u0161a ka go ja se sengwe sa t\u0161ona. 44\\nKe nna
  Morena Modimo wa lena, gomme ineeleng go nna, mme le beng ba bakgethwa, ka gore
  nna ke yo mokgethwa. 45Ke nna Morena yo ke le nt\u0161hit\u0161ego Egepeta gore
  ke tle ke be Modimo wa lena. Le beng ba bakgethwa, ka gobane nna ke yo mokgethwa.\\n46Woo
  ke wona molao mabapi le diphoofolo, le dinonyana, le diphedi t\u0161ohle t\u0161a
  ka meetseng, le digagabi t\u0161ohle. 47Molao wo ke wa gore le kgethologanye se
  se hlwekilego le se se sego sa hlweka, diphedi t\u0161e di ka lewago le t\u0161eo
  di sego t\u0161a swanela go lewa.\\n121Morena o file Moshe melawana ye 2ya Baisraele.
  Ge mosadi a ka belega ngwana wa mo\u0161emane, o t\u0161hilafala mat\u0161at\u0161i
  a a \u0161upago, go no swana le ge a t\u0161hilafala ge a bone kgwedi. 3\\nKa let\u0161at\u0161i
  la seswai ngwana yoo a bolot\u0161we. 4Go tla feta mat\u0161at\u0161i a mangwe a
  masome a mararo le met\u0161o ye meraro gore mmagwe a hlweke ka ge a t\u0161wele
  madi; a se ke a kgwatha selo se sekgethwa goba a tsena ka Tenteng ye kgethwa go
  fihlela ge nako ya gagwe ya go hlweki\u0161wa e fetile.\\n5Ge mosadi a ka belega
  ngwana wa mosetsana, o t\u0161hilafala mat\u0161at\u0161i a lesome le a mane, go
  no swana le ge a t\u0161hilafala ge a bone kgwedi. Go tla feta mat\u0161at\u0161i
  a mangwe a masome a a selelago le met\u0161o ye e selelago gore a hlweke ka ge a
  t\u0161wele madi.\\n6Ge mosadi a belege ngwana wa mo\u0161emane goba wa mosetsana
  mme nako ya go hlweki\u0161wa ga gagwe e fetile, a tli\u0161e kwanyana ya ngwaga
  o tee go moprista mojakong wa Tente ya bodulo bja Morena e le sehlabelo sa go t\u0161hungwa
  ka moka; a tli\u0161e le leeba goba mokuru e le sehlabelo sa tshwarelo ya dibe.
  7Moprista a direle Morena sehlabelo seo sa mosadi yoo mme a mmoelanye le yena; ke
  moo a tlago ba a hlweki\u0161it\u0161we ka ge a be a t\u0161wele madi. 8Seo ke se
  mosadi a swanet\u0161ego go se dira ge a seno belega.\\n9\\nGe mosadi a se ne kwanyana,
  a tli\u0161e mekuru ye mebedi goba maeba a mabedi, le lengwe e be la sehlabelo sa
  go t\u0161hungwa ka moka, mme le lengwe e be la sehlabelo sa tshwarelo ya dibe,
  gomme moprista a mmoelanye le Morena, mme o tla hlweka.\\n131Morena o file Moshe
  le Arone melawana ye e latelago. 2Ge motho a na le serurugi letlalong goba mogarogo
  goba setswata, gomme selo seo sa keka ya ba bolwet\u0161i bja letlalo bja go mo
  t\u0161hilafat\u0161a, a tli\u0161we go moprista Arone, goba go yo mongwe wa baprista
  ba Baarone. 3Moprista a lekodi\u0161i\u0161e se\u0161o seo, gomme ge mehlahla ye
  e lego go sona e fetogile ye me\u0161weu mme se\u0161o nke se sobelet\u0161e letlalong,
  ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a. Moprista a bege gore
  o t\u0161hilafet\u0161e. 4Eup\u0161a ge se\u0161o e le se se\u0161weu gomme nke
  ga se sa sobelela letlalong mme mehlahla le yona e se ya fetoga ye me\u0161weu,
  moprista a beele motho yoo thoko mat\u0161at\u0161i a a \u0161upago. 5A mo hlahlobe
  gape ka let\u0161at\u0161i la bo\u0161upa, gomme ge ka moo a bonago ka gona se\u0161o
  seo se sa swana le pele mme se se sa keka, a beele motho yoo thoko mat\u0161at\u0161i
  a mangwe a a \u0161upago. 6A mo hlahlobe gape ka let\u0161at\u0161i la bo\u0161upa,
  mme ge se\u0161o seo se timelela gomme se sa keke, a bege gore o hlwekile; e be
  e le se\u0161o fela. Motho yoo a hlatswe diaparo t\u0161a gagwe, mme e tla ba yo
  a hlwekilego. 7Eup\u0161a ge se\u0161o se ka keka ka morago ga ge moprista a mo
  hlahlobile mme a it\u0161e o hlwekile, o swanet\u0161e go tla go moprista gape.
  8Moprista a mo hlahlobe gape, gomme ge se\u0161o se kekile, moprista a bege gore
  o t\u0161hilafet\u0161e; ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a.\\n9Ge
  motho a na le bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a, a tli\u0161we
  go moprista, 10mme yena a mo hlahlobe. Ge go na le serurugi se se\u0161weu letlalong
  la gagwe seo se feto\u0161ago mehlahla gore e be ye me\u0161weu mme se bulegile,
  11ke bolwet\u0161i bja go se fole bja letlalo bja go mo t\u0161hilafat\u0161a. Moprista
  a re o t\u0161hilafet\u0161e, mme a se hlwe a re o mmeela thoko, ka gobane go a
  bonagala gore o t\u0161hilafet\u0161e. 12Ge bolwet\u0161i bjoo bja letlalo bo ka
  phatlalala bja aparela motho yoo go tloga hlogong go fihla leotong, 13moprista a
  mo hlahlobe gape. Ge a ka hwet\u0161a gore gabotsebotse bo aparet\u0161e mmele ka
  moka, a bege gore motho yoo o hlwekile. Ge letlalo la gagwe ka moka le fetogile
  le le\u0161weu, o hlwekile.13:13 \u201cbo aparet\u0161e mmele ... o hlwekile.\u201d
  Ge di\u0161o di ikadile le letlalo ke go re molwet\u0161i o a fola. 14Fela go tloga
  ka nako ye se\u0161o se se phulegilego se bonala, o t\u0161hilafet\u0161e. 15Moprista
  a mo hlahlobe gape, gomme ge a ka hwet\u0161a se\u0161o se se phulegilego, a re
  motho yoo o t\u0161hilafet\u0161e. Se\u0161o seo se phulegilego se \u0161upa bolwet\u0161i
  bja letlalo bja go mo t\u0161hilafat\u0161a, gomme motho yoo o t\u0161hilafet\u0161e.
  16Eup\u0161a ge se\u0161o seo se fola mme se eba se se\u0161weu gape, motho yoo
  a ye go moprista, 17mme yena a mo hlahlobe gape. Ge se\u0161o seo se fetogile se
  se\u0161weu, o hlwekile, gomme moprista a re o hlwekile.\\n18Ge motho a be a t\u0161wile
  sekaku mme sa fola, 19gomme ka morago gwa bonala serurugi se se\u0161weu goba setswata
  sa bo\u0161weu bja bohubedu moo go bego go le sekaku, a ye go moprista. 20Moprista
  a mo hlahlobe, gomme ge felo fao go bonala go sobelet\u0161e letlalong mme mehlahla
  ya moo e fetogile ye me\u0161weu, moprista a re motho yoo o t\u0161hilafet\u0161e.
  Ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a bjo bo thomilego ka
  sekakung. 21Eup\u0161a ge moprista a ka hlahloba felo fao, gomme a hwet\u0161a gore
  mehlahla ya moo ga se ya fetoga ye me\u0161weu, le gore felo fao ga se gwa sobelela
  letlalong, fela go galogile, moprista a beele motho yoo thoko mat\u0161at\u0161i
  a a \u0161upago. 22Ge go ka keka, moprista a re motho yoo o t\u0161hilafet\u0161e;
  o swerwe ke bolwet\u0161i. 23Eup\u0161a ge sekaku se ka ema felo gotee mme sa se
  ke sa keka, ke fela lebadi la sekaku sela, gomme moprista a re motho yoo o hlwekile.\\n24Mabapi
  le motho yo a swelego, ge ntho yeo e eba ye t\u0161hweu goba ya bo\u0161weu bja
  bohubedu, 25moprista a mo hlahlobe. Ge mehlahla ya setswata e fetogile ye me\u0161weu
  mme se sobelet\u0161e letlalong, ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a
  bjo bo thomilego nthong ya mollo, gomme moprista a re motho yoo o t\u0161hilafet\u0161e.
  26Eup\u0161a ge mehlahla ya setswata e se ya fetoga ye me\u0161weu mme felo fao
  go se gwa sobelela letlalong, fela go galogile, moprista a mmeele thoko mat\u0161at\u0161i
  a a \u0161upago. 27Moprista a mo hlahlobe gape ka let\u0161at\u0161i la bo\u0161upa,
  gomme ge go keka, ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a,
  mme moprista a re motho yoo o t\u0161hilafet\u0161e. 28Eup\u0161a ge setswata se
  ka ema felo gotee mme sa se keke, sa galoga, ke go t\u0161wa ga mollo fela. Moprista
  a re motho yoo o hlwekile, ka gobane ke fela leswao la go swa mola.\\n29Ge monna
  goba mosadi a t\u0161wile se\u0161o hlogong goba seledung, 30moprista a se hlahlobe.
  Ge e ka ba se sobelet\u0161e letlalong mme meriri ya moo go sona ke ye mesehla ye
  mesesenyane, ke bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a, gomme
  moprista a re motho yoo o t\u0161hilafet\u0161e. 31Ge eba ge moprista a mo hlahloba,
  se\u0161o seo ga se bonale se sobelet\u0161e letlalong, le ge go le bjalo go se
  na meriri ye meso go sona, moprista a mmeele thoko mat\u0161at\u0161i a a \u0161upago.
  32Moprista a se hlahlobe gape ka let\u0161at\u0161i la bo\u0161upa, gomme ge se
  sa ka sa keka, go se na meriri ye mesehla go sona mme se sa bonale se sobelet\u0161e
  letlalong, 33motho yoo a kote tikologo ya se\u0161o seo. Moprista a mmeele thoko
  mat\u0161at\u0161i a mangwe a a \u0161upago. 34Ka let\u0161at\u0161i la bo\u0161upa
  moprista a se hlahlobe gape, gomme ge se se sa keka mme se sa bonale se sobelet\u0161e
  letlalong, a re motho yoo o hlwekile. Motho yoo a hlatswe diaparo t\u0161a gagwe,
  mme o tla be a hlwekile. 35Eup\u0161a ge se\u0161o seo se ka keka ka morago ga ge
  moprista a it\u0161e o hlwekile, 36a mo hlahlobe gape. Ge se kekile, moprista a
  se hlwe a re o nyaka meriri ye mesehla; go molaleng gore motho yoo o t\u0161hilafet\u0161e.
  37Eup\u0161a ge go ya ka mo moprista a bonago ka gona se\u0161o se sa ka sa keka
  gomme go sona go met\u0161e meriri ye meso, se\u0161o seo se a timelela, gomme moprista
  a re motho yoo o hlwekile.\\n38Ge monna goba mosadi a ka t\u0161wa ditswata t\u0161e
  t\u0161hweu letlalong, 39moprista a hlahlobe motho yoo. Ge ditswata t\u0161eo e
  le t\u0161e tshehla, e no ba fela dibabo t\u0161e di t\u0161welego letlalong; motho
  yoo o hlwekile.\\n40-41Ge motho a hlobega meriri hlogong ka sephothong goba ka thoko
  ya phatla, e no ba lefatla fela; seo ga se mo t\u0161hilafat\u0161e. 42Eup\u0161a
  ge se\u0161o sa bo\u0161weu bja bohubedu se ka t\u0161wa moo lefatleng, ke bolwet\u0161i
  bja letlalo bja go mo t\u0161hilafat\u0161a. 43Moprista a mo hlahlobe, gomme ge
  go na le serurugi sa bo\u0161weu bja bohubedu sa go swana le sa bolwet\u0161i bja
  letlalo bja go mo t\u0161hilafat\u0161a, 44moprista a re o t\u0161hilafet\u0161e,
  ka lebaka la bolwet\u0161i bjoo bo lego hlogong ya gagwe.\\n45Motho yo a nago le
  bolwet\u0161i bja letlalo bja go mo t\u0161hilafat\u0161a, a apare diaparo t\u0161a
  mankgeretla, a tlogele moriri e le mahlafarara, a ipipe go tloga molomong go ya
  seledung, gomme a goelele a re: \u201cKe t\u0161hilafet\u0161e! Ke t\u0161hilafet\u0161e!\u201d
  46Ge a sa swerwe ke bolwet\u0161i bjoo e tla no ba yo a t\u0161hilafat\u0161ego,
  gomme o swanet\u0161e go dula ka ntle ga me\u0161a\u0161a, kgole le batho.\\n47Ge
  go na le mouta13:47 \u201cmouta\u201d Lent\u0161u la Seheberu la \u201cbolwet\u0161i
  bja letlalo bja go t\u0161hilafat\u0161a\u201d le \u201cmouta\u201d ke le tee. seaparong,
  e ka ba sa wulu goba sa leokodi, 48goba le\u0161eleng la go logwa ka leokodi goba
  ka wulu, goba mokgopeng goba selong se se dirilwego ka mokgopa, 49e le se se talanyana
  goba se se hubet\u0161wana, ke mouta wa go t\u0161hilafat\u0161a gomme o swanet\u0161e
  go laet\u0161wa moprista. 50Moprista a hlahlobe selo seo, gomme a se beele thoko
  mat\u0161at\u0161i a a \u0161upago. 51A se hlahlobe gape ka let\u0161at\u0161i la
  bo\u0161upa, mme ge mouta woo o kekile, selo seo se t\u0161hilafet\u0161e. 52Moprista
  a se t\u0161hume, ka gobane ke mouta wa go t\u0161hilafat\u0161a wo o swanet\u0161ego
  go fedi\u0161wa ka mollo.\\n53Eup\u0161a ge moprista a ka re a se hlahloba a hwet\u0161a
  mouta wola o se wa keka moo seaparong goba selong seo, 54a laele gore se hlatswiwe
  gomme se beelwe thoko mat\u0161at\u0161i a mangwe a a \u0161upago. 55Ka morago ga
  moo a se hlahlobe gape, gomme ge mouta o se wa fetoga mmala, le ge o se wa keka,
  se sa t\u0161hilafet\u0161e; a se t\u0161hume, le ge se llwe ka ntle goba ka gare.
  56Eup\u0161a ge e ka re ge moprista a se hlahloba gape a hwet\u0161a mouta o tlogile,
  a gagole seripana sa seaparo goba sa selo mo go nago le mouta. 57Ka morago, ge mouta
  wola o ka bonala la bobedi mme wa keka gape, mong wa selo seo a se t\u0161hume.
  58Ge a ka hlatswa selo seo mme mouta wa timelela, a se hlatswe gape, gomme e tla
  ba se se hlwekilego.\\n59Wo ke wona molao mabapi le mouta seaparong, e ka ba sa
  wulu goba sa leokodi, goba sa le\u0161ela la go logwa ka leokodi goba ka wulu, goba
  selong se se dirilwego ka mokgopa.\"", "\"11-2\\nKgo\u0161i Zerksese o be a bu\u0161a
  dilete t\u0161e 127, go tloga India go ba go yo fihla Etopia, a le setulong sa gagwe
  sa bogo\u0161i kua Susa, motsemo\u0161ate.\\n3Ka ngwaga wa boraro wa pu\u0161o ya
  gagwe a direla babu\u0161i\u0161i ba gagwe ka moka le bahlanka monyanya. Madira
  a Persia le a Media a be a le gona, gotee le bakgomana le bahlankedi ba dilete t\u0161a
  gagwe. 4A ba bont\u0161ha mahumo a kgoro ya mo\u0161ate gotee le botse bja yona
  le bogolo bja bogo\u0161i bja gagwe mat\u0161at\u0161i a mant\u0161i, e lego a lekgolo
  le masome a seswai.\\n5Ka morago ga moo a direla banna ka moka, bahumi le badiidi,
  ba motsemo\u0161ate Susa monyanya. Wona wa t\u0161ea mat\u0161at\u0161i a a \u0161upago
  o swaret\u0161we lebaleng le le lego ka serapeng sa mo\u0161ate. 6Kgoro ya gona
  e be e kgabi\u0161it\u0161we ka digaretene t\u0161a le\u0161ela la mmala wo mo\u0161weu
  le wo serolane t\u0161e di kgokelet\u0161wego mefsiring ya silibera mo dikokwaneng
  t\u0161a magakabje ka dithapo t\u0161a le\u0161ela le boletiana la bohwibidu bja
  moretele. Ditulo t\u0161a gauta le silibera di be di beilwe lebaleng leo lebato
  la lona le bego le batet\u0161we ka magakabje, maswikana a mahwibidu, perela le
  thekoise. 7Dino di be di tli\u0161wa ka dinwelo t\u0161e di sa swanego t\u0161a
  gauta, gomme beine ya mo\u0161ate e le ye nt\u0161i. 8Motho o be a sa lekanyet\u0161we
  dino; kgo\u0161i o be a laet\u0161e bahlanka ba mo\u0161ate gore yo mongwe le yo
  mongwe a nwe ka mo a ratago ka gona.1:8 \u201cMotho o be a sa lekanyet\u0161we ...
  ratago ka gona.\u201d goba \u201cEup\u0161a go be go se motho yo a gapelet\u0161wago
  go nwa; kgo\u0161i o be a laet\u0161e bahlanka ba mo\u0161ate gore yo mongwe le
  yo mongwe a nwe kudu goba gannyana ka moo a ratago ka gona.\u201d\\n9Ka kua lapeng
  la mo\u0161ate Mohumagadi Bashti le yena o be a diret\u0161e basadi monyanya.\\n10Ka
  let\u0161at\u0161i la bo\u0161upa la monyanya, ge kgo\u0161i a ikhoret\u0161e dino,
  a bit\u0161a banna ba ba \u0161upago ba ba amogilwego bonna ba e bego e le bahlanka
  ba gagwe ba bagolo, Mehumane, Biseta, Harbona, Bigta, Abagtha, Setare le Karkase.
  11A ba laela gore ba tli\u0161e Mohumagadi Bashti a rwele mphapahlogo wa gagwe wa
  bogo\u0161i. Gape mohumagadi yoo e be e le mosadi yo mobotse, gomme kgo\u0161i a
  nyaka go kgant\u0161het\u0161a bakgomana le baeng ba gagwe ka moka botse bja gagwe.
  12Eup\u0161a ya re ge bahlanka bao ba bot\u0161a Mohumagadi Bashti se kgo\u0161i
  a se laet\u0161ego, yena a gana go tla. Gomme seo sa befedi\u0161a kgo\u0161i kudu.\\n13Kgo\u0161i
  o be a tlwaet\u0161e go kgopela kelet\u0161o ye e nepaget\u0161ego mabapi le ditaba
  t\u0161a molao le toka; ka gona a bit\u0161a baelet\u0161i ba gagwe bao ba bego
  ba tseba ditaba. 14Ba a bego a ati\u0161a go kgopela kelet\u0161o go bona e be e
  le Karshena, Shetare, Admatha, Tarshishe, Merese, Marsena le Memugane, bona bakgomana
  ba ba \u0161upago ba Persia le Media ba e bego e le ba maemo a godimo mmu\u0161ong.
  15A re go banna bao: \u201cNna, Kgo\u0161i Zerksese, ke romile bahlanka ba ka go
  Mohumagadi Bashti gore ba yo mmot\u0161a taelo ya ka, fela yena o ganne go e phetha!
  Ka molao re dira eng ka yena?\u201d\\n16Ke moo Memugane a beget\u0161ego kgo\u0161i
  le bakgomana ba gagwe a re: \u201cMohumagadi Bashti ga se a pho\u0161et\u0161a kgo\u0161i
  fela, o pho\u0161edit\u0161e le bakgomana ba gagwe \u2013 gabotsebotse o pho\u0161edit\u0161e
  banna bohle mmu\u0161ong wohle wa kgo\u0161i. 17Mosadi yo mongwe le yo mongwe o
  tla thoma go nyat\u0161a monna wa gagwe ge a ekwa se mohumagadi a se dirilego. Ba
  tla re: \u2018Kgo\u0161i Zerksese o laet\u0161e Mohumagadi Bashti gore a tle go
  yena, gomme yena a gana.\u2019 18Ge basadi ba bakgomana ba mo\u0161ate wa Persia
  le Media ba ekwa se mohumagadi a se dirilego, ba tla bot\u0161a banna ba bona taba
  ye pele ga ge le t\u0161at\u0161i le dikela. Basadi mo gohle ba ka se sa hlompha
  banna ba bona, mme banna ba tla ba galefela. 19Ge kgo\u0161i a dumela, a a bee molao
  wo o rego Bashti a se sa tsoga a tlile pele ga kgo\u0161i. A a laele gore molawana
  woo o ngwalwe melaong ya Persia le Media gore o se ke wa tsoga o feto\u0161it\u0161we.
  Gomme madulo a gagwe a bogo\u0161i a a fe mosadi yo mongwe yo a mo phalago. 20Ge
  molao wo wa kgo\u0161i o begwa gohle mmu\u0161ong wo mogolo wo, mosadi yo mongwe
  le yo mongwe o tla hlompha monna wa gagwe ka tshwanelo, le ge monna yoo e le mohumi
  goba modiidi.\u201d\\n21Kgo\u0161i le bakgomana ba gagwe ba ile ba kgahlwa ke kelet\u0161o
  yeo, gomme kgo\u0161i a dira se Memugane a se bolet\u0161ego. 22A romela mangwalo
  seleteng se sengwe le se sengwe sa kgo\u0161i ka mmolelo le mongwalelo wa sona,
  a a rego1:22 \u201ca a rego\u201d goba \u201cgore\u201d monna yo mongwe le yo mongwe
  a laole lapa la gagwe, gomme se a se bolelago se phethwe.\\n21Ka morago, le mola
  kgalefo ya kgo\u0161i e \u0161et\u0161e e okobet\u0161e, yena o ile a no fela a
  gopola se Bashti a kilego a se dira le se a ilego a se bega ka ga yena. 2Ka gona
  bahlanka ba bangwe ba kgo\u0161i ba bagolo ba re: \u201cKe eng o sa nt\u0161he lesolo
  wa tsoma dikgarebe t\u0161e botsana? 3O ka bea batseta seleteng se sengwe le se
  sengwe sa mmu\u0161o wa gago gore ba tli\u0161e dikgarebjana t\u0161e botsana ngwakong
  wa basadi mo Susa, motsemo\u0161ate. O ba fe Hegai, moamogwabonna yo a hlokomet\u0161ego
  basadi ba gago, gore a ba \u0161et\u0161e, gomme ba fiwe ditlolo t\u0161a go ithakga.
  4O t\u0161ee ngwanenyana yo o mo ratago kudu o mo dire mohumagadi legatong la Bashti.\u201d\\nKgo\u0161i
  a bona kelet\u0161o yeo e lokile, gomme a e amogela.\\n5Gona moo Susa go be go dula
  Mojuda yo mongwe yo a bego a bit\u0161wa Mordekai, morwa wa Jaire; yena e be e le
  wa kgoro ya Benjamene, gomme borakgolokhukhu ba gagwe ba bangwe e le Kishe le Shimi.
  6\\nMola Kgo\u0161i Nebukadnesare wa Babilone a thopa Joyakine wa Juda, kgo\u0161i
  ya Jerusalema, gotee le sehlopha sa mathop\u0161a, Mordekai le yena o be a le gare
  ga mathop\u0161a ao. 7O ile a t\u0161ea Estere, morwedi wa rangwaneagwe, a mo godi\u0161a
  bjalo ka ngwana wa gagwe ge batswadi ba gagwe ba hlokafet\u0161e. Leina la gagwe
  la Seheberu e be e le Hadasa. E be e le mosetsana yo mobotse wa go bopega.\\n8Ge
  kgo\u0161i a seno bea molao wo mofsa banenyana ba bant\u0161i ba tli\u0161wa Susa,
  Estere o be a le gare ga bona. Le yena a tli\u0161wa mo\u0161ate gomme a hlokomelwa
  ke Hegai yo a bego a hlokomet\u0161e ngwako wa basadi. 9Hegai a rata Estere ka gore
  o be a mo kgahla. Ka ntle le go senya sebaka, a mo fa ditlolo t\u0161a go thakga
  letlalo, gotee le dijo t\u0161e di swanet\u0161ego. A mo nea madulo a mabotsebotse
  moo ngwakong wa basadi, gomme a kgetha dikgarebe t\u0161e di \u0161upago moo mo\u0161ate
  gore di mo hlankele.\\n10Go ya ka kelet\u0161o ya Mordekai, Estere o be a utile
  gore ke yena Mojuda. 11T\u0161at\u0161i le lengwe le le lengwe Mordekai o be a fela
  a itshepet\u0161atshepet\u0161a pele ga kgoro ngwakong wa basadi, gore a bone gore
  Estere o phela bjang, le gore go tla direga eng ka yena.\\n12Basadi ba ile ba t\u0161ea
  ngwaga ba ithakga ka ditlolo \u2013 dikgwedi t\u0161e di selelago t\u0161a mathomo
  ba be ba tlola ka makhura a mira, gomme t\u0161e dingwe t\u0161e selelago ba tlola
  ka balsamo le ditlolo t\u0161e dingwe. Ka morago ga moo banenyana ba i\u0161wa go
  Kgo\u0161i Zerksese ka o tee ka o tee. 13Ge ngwanenyana a et\u0161wa ka ngwakong
  wa basadi a eya go kgo\u0161i, o be a dumelet\u0161we go apara se a se ratago. 14O
  be a eya mant\u0161iboa, gomme mosong a i\u0161we ngwakong wo mongwe wa basadi,
  a hlokomet\u0161we ke Shaashegase, moamogwabonna yo a bego a hlokomela metlabo ya
  kgo\u0161i. O be a sa boelele go kgo\u0161i, ge e se ge a kgahlile kgo\u0161i moo
  e kago mmit\u0161a ka leina.\\n15Nako ya gore Estere a ye go kgo\u0161i ya fihla.
  Estere yo e be e le morwedi wa Abihaile, rangwane wa Mordekai yo a mo godi\u0161it\u0161ego
  bjalo ka morwedi wa gagwe. Yena o be a kgahla batho ka moka ba ba mmonago. Ge nako
  ya gore a ye e fihla, o ile a apara t\u0161ona t\u0161ela Hegai, moamogwabonna yo
  a bego a hlokomet\u0161e ngwako wa basadi, a mmodit\u0161ego gore a di apare. 16E
  be e le ka ngwaga wa bo\u0161upa ge Zerksese e le kgo\u0161i, ka kgwedi ya lesome
  ya Tebete, ge Estere a tli\u0161wa go kgo\u0161i mo\u0161ate. 17Kgo\u0161i a mo
  rata go feta basadi ba gagwe ka moka; gomme a mo kganyoga, a ba a kgahlwa ke yena
  go feta banenyana bale ba bangwe bohle. A mo rwe\u0161a mphapahlogo wa bogo\u0161i
  gomme a mmea mohumagadi legatong la Bashti. 18Ka morago kgo\u0161i a direla Estere
  monyanya wo mogolo, gomme a lalet\u0161a bakgomana le bahlanka ba gagwe. A bega
  gore let\u0161at\u0161i leo ke let\u0161at\u0161i la boikhut\u0161o2:18 \u201cke
  let\u0161at\u0161i la boikhut\u0161o\u201d goba \u201cga go t\u0161helwe\u201d mmu\u0161ong
  wa gagwe ka moka, gomme a abela batho dimpho t\u0161a sego\u0161i.\\n19Ka nako yeo
  kgo\u0161i o be a \u0161et\u0161e a beile Mordekai molaodi wa mo\u0161ate. 20Estere
  yena o be a se\u0161o a utolla gore ke yena Mojuda. Mordekai o be a mo laile gore
  a se bot\u0161e motho, gomme yena a mo theelet\u0161a bjalo ka ge a be a mo theelet\u0161a
  go tloga bjaneng mola a sa mo godi\u0161a.\\n21Nakong ya ge Mordekai e le molaodi
  wa mo\u0161ate, Bigtana le Tereshe, baamogwabonna ba babedi ba mo\u0161ate ba ba
  bego ba hlapet\u0161a mejako ya go tsena ka diphapo\u0161ing t\u0161a kgo\u0161i,
  ba thoma go hloya Kgo\u0161i Zerksese gomme ba loga maano a go mmolaya. 22Mordekai
  a kwa taba ye gomme yena a e bot\u0161a Mohumagadi Estere, yo a ilego a bot\u0161a
  kgo\u0161i se Mordekai a se kwelego. 23Go ile gwa nyaki\u0161i\u0161wa gomme gwa
  hwet\u0161wa gore taba yeo ke there\u0161o, ka gona banna bao ba babedi ba fegwa
  koteng. Kgo\u0161i a laela gore taba yeo e ngwalwe ka pukung ya ditaba t\u0161a
  mmu\u0161o wa gagwe.\"", "\"Beibele Inthaneteng\\nPHETOLELO YA LEFASE LE LEFSA YA
  MANGWALO A MAKGETHWA\\n23 Molaet\u0161a o matla malebana le Tiro \u0161o:+ Gololang,
  lena dikepe t\u0161a Tarashishi,+ ka gobane e sent\u0161we gomme ga e sa le boemakepe,
  ga e sa le lefelo leo go ka tsenwago go lona.+ Seo ba se utollet\u0161we ba le nageng
  ya Khithima.+\\n2 Homolang, lena badudi ba naga e bapilego le lebopo. Bareki\u0161i
  bao ba t\u0161wago Sidone,+ bao ba tshelago lewatle, ba le humi\u0161it\u0161e.\\n3
  Peu ya Shihoro+ le puno ya Nile ke mot\u0161helo wa Tiro gomme di be di sepedi\u0161wa
  ka dikepe; e ile ya ba kgwebo ya dit\u0161haba.+\\n4 Wena Sidone,+ sebo sa lewatle,
  hlabja ke dihlong; ka gobane lewatle le it\u0161e: \u201cGa se ka ka ka \u0161okwa,
  e bile ga se ka belega goba go godi\u0161a masogana le ge e le dikgarebe.\u201d+\\n5
  Go et\u0161a ge batho ba ile ba kwa bohloko ka pego yeo e bego e le mabapi le Egipita,+
  ka mo go swanago ba tla kwa bohloko kudu ge ba ekwa pego mabapi le Tiro.+\\n6 Tshelelang
  Tarashishi; gololang lena badudi ba naga e bapilego le lebopo.\\n7 Na wo ke motse
  wa lena wo kgale o bego o hlalala, go tloga mehleng ya wona ya bogologolo? Maoto
  a wona a be a o rwala a o i\u0161a kgole go yo dula e le modiiledi.\\n8 Ke mang
  yo a rerilego+ se ka Tiro, yena morwe\u0161i wa mefapahlogo, yoo bareki\u0161i ba
  gagwe e bego e le dikgo\u0161ana gomme bagwebi ba gagwe e le bahlomphegi ba lefase?+\\n9
  Jehofa wa madira ke yena a rerilego+ se, gore a gobo\u0161e boikgant\u0161ho bja
  gagwe le botse+ bja gagwe ka moka le go nyat\u0161a bahlomphegi bohle ba lefase.+\\n10
  Ikale nageng ya geno go et\u0161a Noka ya Nile, wena morwedi wa Tarashishi.+ Ga
  go sa na boemakepe.+\\n11 O otlollet\u0161e seatla sa gagwe godimo ga lewatle; o
  ferekant\u0161e mebu\u0161o.+ Jehofa o nt\u0161hit\u0161e taelo malebana le Fenikia
  gore dibo t\u0161a yona di fedi\u0161we.+\\n12 A re: \u201cWena mogatelelwa, kgarebe
  yeo e lego morwedi wa Sidone,+ o ka se sa hlwa o hlalala.+ Ema, o tshelele Khithima.+
  Le gona moo o ka se khut\u0161e.\u201d\\n13 Bonang! Ye ke naga ya Bakaladea.+ Ke
  bona set\u0161haba se se dirilego gore Tiro e be bodulo bja diphoofolo,+ ga se Baasiria+
  ba e dirilego seo. Ba agile dibo t\u0161a bona;+ ba phu\u0161ot\u0161e dintlo t\u0161a
  bona t\u0161a dibo;+ ba e fetot\u0161e ma\u0161ope a kgeregago.+\\n14 Gololang,
  lena dikepe t\u0161a Tarashishi, gobane sebo sa lena se sent\u0161we.+\\n15 Mohlang
  woo Tiro e tla lebalwa ka nywaga e masome\u0161upa,+ nakong ya mat\u0161at\u0161i
  a go phela a kgo\u0161i e tee. Bofelong bja nywaga e masome\u0161upa, Tiro e tla
  et\u0161a mogweba-ka-mmele yo go opelwago ka yena go thwe:\\n16 \u201cWena mogweba-ka-mmele+
  yo a lebet\u0161wego, t\u0161ea harepa o dikologe motse. Bont\u0161ha bothakga bja
  gago ge o let\u0161a kwadi; opela diko\u0161a t\u0161e dint\u0161i e le gore o ka
  gopolwa.\u201d\\n17 Bofelong bja nywaga e masome\u0161upa, Jehofa o tla \u0161et\u0161a
  Tiro, yona e tla boela ya amogela meputso ya yona+ gomme ya gweba ka mmele le mebu\u0161o
  ka moka ya lefase.+\\n18 Poelo le moputso t\u0161a yona+ e tla ba dilo t\u0161e
  kgethwa go Jehofa. Di ka se bolokwe goba t\u0161a kgobelwa, ka gobane moputso wa
  yona o tla newa bao ba dulago pele ga Jehofa+ gore ba je ba kgotsofale le go apara
  gabotse.+\"", "\"Leina\\nNarrow-leaved Turpentine Grass\\nLeina la seLatini\\nCymbopogon
  plurinodis\\nT\u0161homi\u0161o\\nKe bjang bjo fokolago ge go tliwa go t\u0161a
  phulo ka lebaka la Dioli t\u0161a maleba t\u0161e di fago tatso ye bo\u0161ula.
  E akaret\u0161a oli ya maleba ka ga di metswako ye 17, ka piperitol le delta-nerolidol
  t\u0161a go ba t\u0161e tharo t\u0161a bohlokwa kudu.\\nTlhalo\u0161o\\nT\u0161hutla
  ya dingwagangwaga le letlakalapepetla la dimilemetara t\u0161e 2 - 5. Hlogo ya mat\u0161oba
  ke sehlopha sa mat\u0161oba sa maaka ya go fihla go meetlwa ya seswai ya go pariwa.
  Bjang bjo bo Sesane bja Thapenthaene ke bjang bjo bo sa lewego ge ntle le ge bo
  sa bo nnyane.\\nMafelo a bodulo\\nE a gola ka mafelong a bjang a go bulega goba
  ka dipat\u0161ong t\u0161a naga ya go bulega ka ma\u0161okeng a dilete. Bo gola
  ka mehuteng ka moka ya mabu, eup\u0161a bo rata mabung a moo e ka dirang gore go
  bu\u0161e bona. Bo phatlaladit\u0161we ka Aforika ka bophara.\\nGo thunya\\nDiphalane
  - Mopitlo\"", "\"Ge nako e dut\u0161e e eya, Baisiraele ba ile ba lahla Modimo gape
  gomme ba rapela medimo ya maaka. Bamidiane ba ile ba fet\u0161a mengwaga e \u0161upago
  ba utswet\u0161a Baisiraele diruiwa e bile ba senya ma\u0161emo a bona. E le gore
  ba t\u0161habele Bamidiane, Baisiraele ba be ba utama ka maweng le dithabeng. Ba
  ile ba kgopela Jehofa gore a ba thu\u0161e. Ka gona Jehofa a romela morongwa go
  monna yo a bit\u0161wago Gideone. Morongwa yoo o ile a fihla go Gideone a re: \u2018Jehofa
  o go kgethile gore o be le\u0161ole leo le nago le matla.\u2019 Gideone a re: \u2018Ke
  tla pholo\u0161a Baisiraele bjang? Ga ke na mohola.\u2019\\nGideone o be a tla tseba
  bjang gore Jehofa o mo kgethile go pholo\u0161a Baisiraele? O ile a bea boya mobung
  gomme a re go Jehofa: \u2018Ge boya bjo bo ka tsoga bo kolobile ka phoka gomme mobu
  o omile, gona ke tla tseba gore o nkgethile gore ke pholo\u0161e Baisiraele.\u2019
  Mesong e latelago, boya bjoo bo be bo kolobile eup\u0161a mobu o omile! Lega go
  le bjalo, Gideone o ile a kgopela Jehofa gore mesong e latelago go kolobe mobu gomme
  boya bjola bo se ke bja koloba. Ge seo se diregile, Gideone o ile a kgolwa gore
  Jehofa o mo kgethile gore a pholo\u0161e Baisiraele. O ile a kgoboket\u0161a ma\u0161ole
  a gagwe gore a yo lwa le Bamidiane.\\nJehofa o ile a re go Gideone: \u2018Ke tlo
  le thu\u0161a go fenya Bamidiane. Eup\u0161a ka ge o na le ma\u0161ole a mant\u0161i,
  le ka tla la nagana gore le fent\u0161e Bamidiane ka matla a lena. Bot\u0161a bao
  ba t\u0161habago go ya ntweng gore ba ye gae.\u2019 Ka gona ma\u0161ole a 22 000
  a ile a boela gae, gomme gwa \u0161ala a 10 000. Ke moka Jehofa a re go Gideone:
  \u2018O sa na le ma\u0161ole a mant\u0161i kudu. Etla le wona nokeng gomme o a bot\u0161e
  gore a nwe meetse nokeng yeo. Ke moka o ye ntweng feela le bao ba tlago go nwa meetse
  ba emi\u0161it\u0161e dihlogo gore ba bone manaba a bona.\u2019 Ke banna ba 300
  feela bao ba ilego ba nwa meetse ba emi\u0161it\u0161e dihlogo t\u0161a bona. Jehofa
  o ile a tshepi\u0161a gore banna bao ba 300 ba be ba tla fenya ma\u0161ole a Bamidiane
  a 135 000.\\nBo\u0161egong bjoo, Jehofa o ile a bolela le Gideone a re: \u2018Ye
  ke nako ya gore o hlasele Bamidiane!\u2019 Gideone o ile a nea banna ba gagwe manaka
  le dibjana t\u0161e dikgolo t\u0161eo ba bego ba utile dirumula ka gare ga t\u0161ona.
  Ke moka a re go bona: \u2018Le lebeleleng nna, gomme le dire seo ke se dirago.\u2019
  Gideone o ile a let\u0161a lenaka la gagwe, a p\u0161hatla sebjana sa gagwe, a emi\u0161et\u0161a
  serumula godimo gomme a goelet\u0161a a re: \u201cT\u0161ho\u0161a ya Jehofa le
  ya Gideone!\u201d Ma\u0161ole a gagwe ka moka a 300 le wona a dira bjalo. Bamidiane
  ba ile ba t\u0161hoga kudu gomme ba t\u0161haba. Ka yona nako yeo, ba thoma go bolayana.
  Le mo nakong ye, Jehofa o ile a thu\u0161a Baisiraele go fenya manaba a bona.\"",
