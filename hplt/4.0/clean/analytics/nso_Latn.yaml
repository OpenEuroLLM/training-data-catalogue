  t\u0161haba eng?\\nEpisode 3934\\n#Mahlakung \u2013Phetola o seki\u0161a Saki ka
  go ya go \u0161omela Matsobane. Saki o fologa koloi ya Lethebe o a t\u0161haba.
  Naa ke gona ge Saki a hlanoget\u0161e ba ga Lethebe , gona ke pho\u0161o ge a eya
  go nyaka mafulo a matala?\\nEpisode 3933\\n#Mahlakung \u2013Phetola o bot\u0161a
  Moruti Kgole gore a kgopele Hlapyadi a emi\u0161e go ya go gwantela Matsobane.Naa
