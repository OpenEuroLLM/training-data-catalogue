  21 le Thapelo\"", "\"O MYEMYELA ka lethabo ge seboledi seo se lego sethaleng se
  dut\u0161e se nea polelo. Ke ngwanabo rena yo mofsa go t\u0161wa phuthegong ya geno,
  gomme o nea polelo ya gagwe ya mathomo kopanong. Ge o dut\u0161e o theedit\u0161e
  polelo ya gagwe, o ikwa o thaba le go makat\u0161wa ke tlwaet\u0161o yeo batho ba
  Modimo ba e hwet\u0161ago. O gopola polelo ya gagwe ya mathomo phuthegong ya geno
  gomme o lemoga t\u0161welopele e kgolo yeo a e dirilego! O ile a dira t\u0161welopele
  e kgolo kudu ka morago ga go tlwaet\u0161wa Sekolong sa Tirelo ya Bobulamadibogo.
  Morago bjale, yena le mosadi wa gagwe ba thabet\u0161e go ba gona Sekolong sa Baebangedi
  ba Mmu\u0161o. Ge o dut\u0161e o opa magofsi ka morago ga polelo e matla ya ngwanabo
  rena yo, o lebelela batheet\u0161i go go dikologa gomme wa nagana ka thuto yeo batho
  ba Modimo ka moka ba e hwet\u0161ago.\\nBeibele e bolet\u0161e e sa le pele ka nako
  yeo ka yona batho ba Modimo ka moka ba tlago go \u2018rutwa ke Jehofa.\u2019 (Jes.
  54:13) Re phela nakong yeo. Ga re hwet\u0161e thuto ka dikgati\u0161o t\u0161a rena
