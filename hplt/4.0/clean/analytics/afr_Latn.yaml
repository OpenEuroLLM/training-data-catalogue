sample: '["\"My liefste Liefie\\nVanoggend toe ek in Scottburg was om al ons sake
  te gaan doen en ek by die mall stilhou vir ons laaste inkopies, kon ek sommer dadelik
  sien dis die maand van die liefde, Valentynsmaand. Al die geskenke \u2026 ook my
  gunsteling-sjokolade.\\nIn die klere-afdeling het ek daardie rooirok gesien, die
  \u201cPretty Woman\u201d-rok. Toe dink ek aan die aand toe ons gaan dans het en
  ek ook my rooi rok aangehad het. Jy het in my oor gefluister hoe pragtig ek lyk.
  Ek het my arms om jou nek geslaan en ons het innig gesoen. Onthou jy hoe een jong
  paartjie ons aangekyk het? Jy\u2019t ges\u00ea hulle dink seker ek is \u2019n ander
  man se vrou. Ons het gegiggel en net stywer teen mekaar gedans. Ek was so trots
  om in jou arms te wees. Jy\u2019s besonders lank en skraal \u00e9n aantreklik. En
  jy het die mooiste groen o\u00eb. Hoe beskryf ek die manier hoe jy afgekyk het na
  my terwyl ons gedans het?\\n\u2019n Warm bruisende gevoel het van my voete af tot
  by my mond beweeg, en ek het in jou oor gefluister: \u201cMy Liefie, vannaand wil
  ek my ten volle, my alles aan jou gee.\u201d Hoe anders dan? Niemand het my nog
  ooit so liefgehad nie. Ek onthou die musiek se note het sagter geword en uiteindelik
  stil \u2013 daardie oorweldigende gevoel van liefde vir mekaar op die dansvloer.\\nEk
  het vanoggend sommer daar in die winkel my stoute laggie gegee, want ek het onthou
  jy het my na ons tafel begelei. Ons het mekaar aangekyk, ek het my silwer sakkie
  geneem, jy jou baadjie. Jy het dit oor jou lang lenige skouer gegooi (onder daardie
  hemp, het ek geweet, is bruingebrande, gespierde arms). Die ander arm was my skouers.
  Ons het glimlaggend die ander pare gegroet. Ek het so veilig gevoel en natuurlik
  ook goed gevoel, want die aantreklikste, liefdevolste, bedagsaamste man van die
  aand het sy arm om m\u00fd gehad.\\nN\u00e1 die inkopies, het ek teruggery huis
  toe, die motor se dak afgeslaan. Met die wind deur my hare, het ek kliphard gesing.
  Ek het my gedagtes weer vlerke gegee en die mooiste \u201cmemories\u201d het voor
  my verby geflits.\\nMy Liefste, dankie vir jou wysheid en die manier wat jy my bygestaan
  het met die grootmaak en opvoeding van ons kinders. Jy\u2019t sterk waardes by hulle
  ingeprent. Jy is steeds ons koning. Ons kinders en kleinkinders is mal oor hul oupa.
  En kleinseun Kobus het klaar sy oupa se \u201clooks\u201d, met daardie groen o\u00eb
  wat dwarsdeur \u2019n mens kyk.\\nToe ek later by ons plaaspad indraai, was die
  son net besig om te sak. Liefling, ek was oorweldig met dankbaarheid teenoor ons
  Hemelse Vader, want daar op die stoep het die lang lenige man vir my staan en wag
  \u2026 my man, my held, my minnaar, my Godgegewe man.\\nEk het jou oneindig lief\"",
  "\"Nathi Mthethwa, die minister van polisie, het Dinsdag \u0149 beroep op inwoners
  van die Brits-omgewing in Noordwes gedoen dat gemoedere moet kalmeer nadat twee
  inwoners Maandag glo deur die polisie tydens \u0149 gewelddadige diensteleweringsbetoging
  doodgeskiet is.\\nMthethwa het in \u0149 verklaring ges\u00ea die publiek het die
  grondwetlike reg om te betoog en hul stem dik te maak oor kwessies waarmee hulle
  ontevrede is. \u201cDi\u00e9 reg beteken egter nie dat hulle gewelddadig moet optree,
  eiendom beskadig of die polisie moet aanval en ander intimideer nie,\u201d het Mthethwa
  ges\u00ea.\\nInwoners van Mothutlung naby Brits betoog sedert Sondag omdat hulle
  glo drie maande laas skoon drinkwater gehad het. Die betogers het \u0149 pad met
  brandende bande versper en die polisie is ontbied om die betoging te monitor. Daar
  was glo \u0149 skermutseling tussen die betogers en die polisie waarna die twee
  betogers doodgeskiet is.\\nMthethwa het ges\u00ea daar is nie \u0149 \u201ckultuur
  van straffeloosheid\u201d in die polisie nie. \u201cOns kan die publiek verseker
  indien enige polisiebeampte skuldig bevind word, hulle die nodige gevolge sal dra.\u201d\\nDie
  onafhanklike polisie-ondersoekdirektoraat (Opod) ondersoek die saak. Intussen het
  Thandi Modise, die premier van Noordwes, die inwoners versoek om hulle volle samewerking
  aan Opod te gee tydens hul ondersoek.\\nIs dit nie hoo gtyd dat daar teen die persone
  wat die dienste moet lewer, daarvoor betaal word en nie hulle werk doen nie, op
  te tree nie. Raak ontslae van hulle en kry bevoegde mense wat die werk kan en sal
  doen en die probleem landwyd sal iets van die verlede wees.\\nHierdie probleem was
  nie daar voor 1994 nie.\\nStem saam GawieM\\nDie land verval in wetteloosheid en
  die regering maak net lee beloftes. Die arme polisie moet ook net hulle werk doen.
  As hulle optree is dit verkeerd, en as hulle dit nie doen nie is dit ook verkeerd.
  Dis n kultuur ding lyk dit my, brand af en vernietig. Dan betoog jy vir heroprigting
  van dit wat jy verwoes het. Maak dit sin?????\\nHyla die regering maak soos jy ook
  tereg skrywe net lee beloftes. Dis hoog tyd dat die mense wat in posisies sit tot
  verantwoording geroep word. Aan die anderkant het die regering aan die mense GRATIS
  water ens belowe. Dis nie nagekom en ongelukkig staan die mense saam en \u2018leer\u2019
  die regering n les. Iets wat die wittes (myself ingesluit) nie kan doen. Dus manne
  \u2026.. BREEK AF!!!\\nDie polisie skuil agter n uniform, want trek hy dit uit is
  hy/sy n nul op n kontrak. Dus kan hy maak wat hy wil. Dis ongehoord. Dis tyd dat
  die polisie ook in die bek geruk kan word maar met slapg@t leier is dit nie moontlik.\\nEk
  glo Thandi Modise moet van haar duur motors verkoop en daardie geld skenk vir die
  opgradering van skoonwater aan die mense. Dis nie eers te praat/skrywe van die inwoners
  van Brits wat met groen water sit. Ek daag Thandi uit om n glas van daardie vuil
  water voor die mense te drink.\\nEk het nie baie simpatie met die mense nie want
  hulle het die ANC ingestem. Jy kry wat jy vra.\"", "\"- Not important at all\\n-
  Slightly important\\n- Moderately important\\n- Decidedly important\\n- Non-negotiable\\nAbout
  Her\\nEk is opsoek na vriende. Ek is n extreme ekstrovert wanneer ek tussen mense
  is wat ek ken maar n introvert by die huis. Ek het n borrelende persoonlikheid wat
  maak dat baie mense van my hou. Ek is mal oor dans en glo mens is so oud soos die
  man wat jy voel LOL. Ek is n persoon wat my eie ding doen (seker oor ek al so lank
  single is) en hou nie van jaloesie nie. Ek is n all arounder maar tog n one man
  woman (klink deurmekaar ne?). Soek nie iemand wat my probeer tem nie maar eerder
  respekteer in dit wat ek doen.\\nAbout Her Ideal Match\\nEk soek n \\\"pel\\\" wat
  saam met my die dinge van die lewe kan geniet. Iemand by wie ek gemaklik voel, sonder
  om te moet keer vir my wickets. Ek stel nie belang in n verhouding nou nie aangesien
  ek baie seer gekry het. Soek iemand wat my vat nes ek is...., wat my nie judge nie....
  Wat nie onredelik jaloers is nie. Om eerlik te wees... iemand wat my sex appeal
  look kan hanteer, wat saam my kan party maar wat ook saam met my en my kind kan
  swem en lag en movies kyk... Bestaan daar so iemand????\"", "\"Het jy geweet een
  van die bekendste Michael Jackson nabootsers is van Suid-Afrika af?\\nHy staan bekend
  as Dantanio Goodman en is gebore in Kimberly. Danksy sy gesin se wortels in die
  Kerk, het sing en dans op die ouderdom van nege al begin, en hy kon selfs ''n vokale
  repertoire ontwikkel vir Pop, RnB, Swing, Jazz en Reggae. Hy het ''n uiteenlopende
  loopbaan in die vermaakbedryf geskep, waaronder teaterwerk, liedjieskryf vir kontempor\u00eare
  popsterre en die vrystelling van twee solo-albums.\\nMaar sy grootste sukses tot
  dusver is sy rol as Michael Jackson in verskeie huldeblyktoere waar hy die koning
  van pop weer herleef.\\nIn 2014 is Dantanio deur die regisseur Johnny Van Grinsven
  gekies om die wereld te toer as Michael, en hy het tussendeur alles perfek, van
  grimering tot sy houding.\\n\u201cMichael Jackson het my ge\u00efnspireer om te
  sing en dans. Ek het my hele lewe lank voorberei op hierdie rol, en ek moet my droom
  uitleef om hulde te bring aan my afgod op die verhoog regoor die w\u00eareld,\u201d
  erken Dantanio.\\nVan sy gunsteling treffers op die verhoog sluit in Thriller, Billie
  Jean, Smooth Criminal, Bad, Beat It, ABC, Don`t Stop Til You Get Enough, Human Nature
  en They Don`t Really Care About Us.\\nMaar Dantanio het dalk binnekort kompetisie,
  soos die spanne voorberei vir vanaand se karaoke, waar hulle self Michael Jackson
  weer moet laat leef, en dit lyk asof almal \u2018n begrip daarvoor kry. Veral na
  hulle raad van Emo Adams ontvang het.\\nMaar almal kry gereed om die koning van
  pop weer te resurect.\\nGesels saam op Facebook, Instagram en Twitter met die hutsmerke
  #Kwarantyn, #SpanLeRoux en #SpanScheepers.\\nOnthou om te stem vir jou gunsteling-familielid
  van Woensdag, 21:00 tot Maandag, 22:00 op jou rekenaar, jou selfoon, per SMS of
  op die DStv-app. Elke platform bied vir jou 100 unieke stemme.\\nElke Maandag, Dinsdag,
  Donderdag, Vrydag en Saterdag word die daaglikse hoogtepunte op kykNET&kie, DStv-kanaal
  145, uitgesaai. Elke Woensdag is dit die weeklikse hoogtepunt-episode om 20:00 op
  kykNET, DStv-kanaal 144 \u2013 moet dit nie misloop nie.\"", "\"Irrigation Unlimited
  verskaf bekostigbare, veelsydige en kostedoeltreffende besproeiingsprodukte. Veral
  die beweegbaarheid van die besproeiingsprodukte is \u2019n groot voordeel vir boere
  wat soms in moeilike omstandighede moet besproei.\\nIn sy reeks is verskeie pyp-
  en mobiele besproeiers. Pypbesproeiers, ook genoem traveller and hard hose-masjiene,
  sluit in mobiele waterkanonne of spuitbalke wat die gewasse besproei terwyl dit
  oor \u2019n land beweeg.\\nHoe werk dit?\\n\u2019n Katrolwa met \u2019n groot wateraangedrewe
  pypkatrol word aan die een kant van die land geparkeer. Die punt van die pyp is
  aan \u2019n karretjie met \u2019n kanonspuit gekoppel. Di\u00e9 karretjie word 130-300
  m ver na die oorkant van die land uitgekatrol en die pyp word agterna gesleep.\\nWanneer
  jy die watertoevoerkraan oopdraai, vloei die water deur \u2019n waterturbine wat
  \u2019n ratkas aandryf en die groot katrol aan die draai sit om die pyp stadig in
  te katrol en sodoende die kanonspuitwaentjie terug na die katrolwa te sleep terwyl
  dit die hele area natmaak.\\nDie spoed waarteen die kanonspuit ingesleep word, kan
  verstel word om meer of minder water per lopie toe te dien. Wanneer die baan voltooi
  is, skakel die motor wat die kanonspuitkarretjie inkatrol, outomaties af.\\nDaar
  is vier Ocmis-modelle beskikbaar:\\nDie R1/1 se pyp is 75 mm dik en 220 m lank,
  en bespuit dus n baan van 220 m.\\nDie R2/2 se pyp is 100 mm dik en 300 m lank,
  en bespuit dus \u2019n baan van 300 m.\\nDie Micro Rain MRR 58/200 kan vir kleiner
  landerye en tuine gebruik word.\\nDie Micro Rain MR 40/130 se pyp is 40 mm dik en
  130 m lank, en kan tot 0,56 ha per 130 m besproei.\"", "\"Di\u00e9 naweek is \u2018n
  bejaarde boer van Limpopo deur vyf verdagte koperkabeldiewe met pangas aangeval
  een teen die kop gekap. Die slagoffer het daarin geslaag om een van sy aanvallers
  dood te skiet, en die ander het gevlug.\\nDi\u00e9 voorval het \u2018n ontsaglike
  stroom kommentaar op die sosiale netwerke ontlok, wat \u2018n verwagte, maar ontstellende
  prentjie van polarisasie skep. Aan die een kant is daar \u2018n stroom deelnemers
  wat meen dis jammer die boer het nie al vyf in die stof laat byt nie. Aan die ander
  kant mense wat di\u00e9 deelnemers vir hul bloeddorstigheid verkwalik en meen die
  nodige geweld is vir selfverdediging gebruik.\\nBaie van die deelnemers is bekommerd
  dat die boer, wanneer hy genoegsaam herstel het, gearresteer en van moord aangekla
  gaan word. Ongelukkig was daar al gevalle waar mense, ook boere, onder soortgelyke
  omstandighede gearresteer is en moordossiere geopen is, hoewel blykbaar min van
  hierdie sake die howe haal. Die gewone publiek tref egter nie die onderskeid tussen
  \u2018n formele verhoor en die aanvanklike arrestasie nie.\\nWat sake in hierdie
  geval meer tot die punt dryf, is dat die Wetsontwerp op gevaarlike wapens slegs
  \u2018n kort blootstelling vir openbare kommentaar gehad het. Dit skep die indruk
  dat die owerheid hierdie wet wil stoomroller. Di\u00e9 persepsie word versterk deurdat
  die publiek vroe\u00ebr, toe begin is om die wetsontwerp op te stel, geleentheid
  vir inspraak gehad het \u2013 inspraak wat skynbaar volledig ge\u00efgnoreer is.\\nDit
  volg ook kort op die hakke van die uitspraak in die Julius Malema-haatspraakverhoor.\\nUit
  gisteraand se Kommentaar op RSG was dit ook duidelik dat baie politieke ontleders
  erg onthuts is met \u2018n ANC-faksie se houding dat die grondwet \u2018n struikelblok
  is om \u2018n meerderheidswil afgedwing te kry, en dat die grondwet al meer uitgedaag
  en selfs ge\u00efgnoreer word. In \u2018n heterogene samelewing is dit nie iets
  wat ligtelik mee omgegaan kan word nie.\\nUit \u2018n skripsie van \u2018n Stellenbosse
  student blyk dit voorts hoe gepolariseerd menings in die land is. Op die vraag of
  gemeen word dat blankes swart mense se grond gesteel het, het by verre die meeste
  swart respondente ja ges\u00ea, en baie hiervan het baie sterk ja gestem. Dit geld
  in \u2018n wisselende mate al swart volksgroepe in die land. Die by verre die meeste
  Afrikaans- en Engelssprekendes meen egter dit is nie so nie, hoewel diegene wat
  saam met die stelling stem oor tyd ook meer word.\\nIronies, voor die Malema-verhoor
  begin het, het meer as sestig persent swart mense volgens \u2018n peiling gemeen
  Malema se sing van die omstrede liedjie is haatspraak en verkeerd.\\nVerskillende
  weergawes van dieselfde werklikhede is lank reeds in die land in omloop, en dit
  gaan ook nie oornag verander nie. In die internet-era is dit ook nie so maklik om
  mense se verwysingsraamwerke eenvormig te maak nie. En selfs al sou dit tegnies
  moontlik wees om op die internet en in die ander media dieselfde weergawes voor
  te hou, is daar nie soos die vroe\u00ebre Sjinese gebruik \u2018n tradisie van boekverbranding
  wanneer een dinastie \u2018n ander opvolg, en die geskiedenis as\u2019t ware opnuut
  begin nie.\\nDie werklikheid is dat \u2018n reuse diversiteit van inligting die
  publiek bereik, en selfs elke groep sogenaamde ontkenners, hetsy oor klimaatsverandering,
  die oorsaak van Vigs en \u2018n magdom ander sake, sy eie webwerwe en ondersteuners
  het. Die vlakke van onverdraagsaamheid is ontsaglik, die riooltaal wat selfs Christene
  onderling teen mekaar gebruik, walglik. Die komende twee weke vind verskeie sinodes
  plaas, en in elk het die gewone gemeentelede kommer oor die verwagte polarisasie.
  Die Hervormde Kerk se spesiale Algemene Kerkvergadering oor die sogenaamde apartheidsbesluit
  gaan weer emosies opjaag. Die NG Kerk in Afrika in die Vrystaat se sinode staan
  in die skadu van verskeie sake wat nog na die onmin met die VGK herlei kan word.
  Die NG kerk sal op sy sinode \u2018n goue weg moet vind oor verskeie kwessies waaroor
  verskillende lidmate sterk opponerende standpunte huldig.\\nKerkverbande is veronderstel
  om Christene wat betreklik eendersdenkend is te groepeer. As dit daar so gaan, lyk
  dit na \u2018n byna onbegonne taak in die politiek waar verskillende groepe nie
  eens oor \u2018n vaste stel feite soos historiese gebeure min of meer dieselfde
  weergawe het nie.\\nDit sou al baie beteken het as die regering konsekwent die boodskap
  van regeer in algemene belang uitgedra het. Faksiegevegte binne die ANC maak dit
  egter baie moeilik, en die howe sal klaarblyklik baie besig gehou word om die grondwet
  gehandhaaf te hou.\\nHerman Toerien\"", "\"Laerskool Stellenbosch Nasorg\\nNavrae:\\n-
  Belinda L\u00fcttich (Graad 1 en 2)\\nbelinds.mare@gmail.com\\n071 889 9845 - Lynette
  Alberts (Graad 3 \u2013 7)\\nkennylynette5@gmail.com\\n061 483 6298\\nOns is bly
  dat u besluit het om u kind aan ons sorg toe te vertrou. Dit is vir ons \u2019n
  groot voorreg om ook deel van sy/haar opvoeding te wees. As mede-opvoeders, sal
  ons probeer om te alle tye die belange van u kind voorop te stel. Ons nooi u dus
  uit om, met vrymoedigheid, enigiets met ons te bespreek. Dit is vir ons baie belangrik
  dat daar goeie kommunikasie sal wees sodat die kinders daarby kan baat.\"", "\"Weergawe:
