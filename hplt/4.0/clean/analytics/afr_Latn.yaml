  jy seker dis sonder kragwoord?\"", "\"INHOUDSOPGAWE\\nWeet jy wat die hamster kan
  eet?\\nMeeste van die tyd benodig hamsters nie baie verskillende soorte kos nie.
  Jou troeteldier benodig egter in elk geval ''n kommersi\u00eble korrel van ho\u00eb
  gehalte as sy hoofdieet om aan sy voedingsbehoeftes te voldoen.\\nVir hierdie gevalle
  is daar ''n verpille voer. Dit word gemaak van ''n kompressiebehandeling, wat korrels
  produseer met sterk aangehegte bestanddele, wat vermorsing voorkom en die werking
  van kontaminante verminder. Soms verskaf dit egter nie die nodige voedingstowwe
  nie en die knaagdier is ''n bietjie veeleisend in sy dieet, en kan kos weier as
  daar geen variasies is nie.\\nDit is noodsaaklik dat die meeste van die kos vir
  ''n troeteldierhamster bestaande uit goeie gehalte winkelkos wat spesifiek vir hamsters
  ontwerp is. Tydens die artikel, benewens hierdie, sal jy ''n reeks in-diepte inligting
  ontdek om die troeteldier op die beste moontlike manier te voed. Kom ons gaan?\\nVrugte
  wat hamsters kan eet\\nOm jou hamster se dieet te diversifiseer, is dit belangrik
  dat jy vir hom vrugte en ander gesonde kos gee. Dit sal verseker dat hy langer leef
  en gesonder is. Dus, sodat jy presies kan weet wat om jou hamster te gee, sal ons
  vir jou ''n paar vrugtewenke hieronder gee. Kyk dit!\\nApple\\n''n Uitstekende keuse
  van vrugte wat jy af en toe aan joudat hierdie kosse nie baie geskik is om deel
  van die klein knaagdier se spyskaart te wees nie. Met ander woorde, jy moet in gedagte
  hou dat sulke kosse komplikasies vir jou troeteldier kan veroorsaak as dit in groot
  hoeveelhede verbruik word. Wanneer jy twyfel, gee voorkeur aan ligter en minder
  suur kosse.\\nBone\\nBone is nog ''n kos wat nie aan die klein knaagdier aangebied
  moet word nie. Dit is as gevolg van dieselfde rede dat hulle ''n meer brose spysverteringstelsel
  het, en kan selfs meer kwesbaar wees met die inname van bone. Dit is ''n voedsel
  uit die peulplantfamilie met ''n ho\u00eb kalorie- en voedingswaarde, veral yster.\\nGee
  in elk geval voorkeur aan meer voedsame kosse wat geskik is vir verbruik deur hamsters,
  soos vrugte of ander aanbevole kosse . As jou troeteldier dit per ongeluk eet, neem
  dit as ''n voorsorgmaatre\u00ebl na die veearts, om enige moontlike komplikasies
  te vermy wat jou troeteldier se gesondheid kan benadeel.\\nSjokolade en ander lekkers\\nBied
  onder geen omstandighede sjokolade aan nie jou hamster. Sjokolade kan baie skadelik
  vir hamsters en selfs dodelik wees. Dit is omdat dit ''n stof bevat wat vir lang
  tydperke in stelsels bly. Dit wil s\u00ea, aangesien die spysverteringstelsel van
  hierdie diere baie meer broos is in vergelyking met di\u00e9 van mense, is dit interessant
  om sulke tipe stowwe te vermy.\\nEn, omdat hamstersaangesien dit sulke klein diere
  is, stel ''n klein inname van sjokolade ''n groter deel van hierdie stof vry, wat
  hoogs skadelik is. Dit is die moeite werd om te onthou dat ons nie net oor sjokolade
  praat nie, aangesien enige ander lekkers skade aan jou troeteldier kan bring.\\nSorg
  vir jou hamster sodat hy langer kan lewe!\\nIn hierdie artikel het jy geleer dat
  daar verskeie kosse is wat voordele of nadele vir jou hamster se gesondheid kan
  inhou. Boonop het jy gelees oor sommige van die belangrikste voorsorgmaatre\u00ebls
  wat ons moet tref om jou troeteldier langer en beter te laat leef.\\nHamsters is
  die meeste van die tyd baie gemaklike klein knaagdiere en, net soos mense, is daar
  kos wat hulle kan en nie kan eet nie. Daarom is dit belangrik dat jy doen wat jy
  kan om hulle gesond te hou. Noudat jy weet hoe om dit te doen, en dat jy die artikel
  kan herlees wanneer jy wil, pas net die voorsorgmaatre\u00ebls en wenke in!\\nhamster
  is die appel. Dit is ''n gesonde en veilige kos vir knaagdiere, wat ''n verskil
  kan maak. Dit is egter die moeite werd om te onthou dat die appel ''n ho\u00eb vlak
  van suiker en water in sy samestelling het, sowel as ander vrugte. Dus, om ''n paar
  weke te wag voordat jy die lekkerny weer aanbied, is ''n slim besluit om probleme
  te vermy.Piesang\\nPiesang is nog ''n veilige vrug om jou troeteldier hamster te
  gee. Hierdie heerlike vrugte sal wonderlik wees om jou graan te versier, sodat jy
  ''n klein snytjie met jou hamster kan deel. Dit is die moeite werd om te onthou
  dat, soos die appel, die piesang ook ''n ho\u00eb suikerinhoud het wat vetsug en
  diabetes kan veroorsaak. Voer dus jou hamster stukkies piesang spaarsamig en pligsgetrou.\\nAarbeie\\nAarbeie
  is ''n ryk bron van vitamien C en is veilig om jou hamster te voer solank hulle
  in klein dosisse gevoer word en geleidelik in jou hamster se dieet ingebring. Andersins
  kan jy jou troeteldier se spysverteringstelsel ontstel.\\nSien ook: Weet jy hoeveel
  jaar leef ''n haas? Leeftyd en meer!Onthou: aarbeie is nie ''n noodsaaklike deel
  van ''n hamster se dieet nie. Dus, as jou hamster nie daarvan hou nie, vervang dit
  met ander gesonde kosse waarvan hy hou.\\nMango\\nMango is nog ''n voorbeeld van
  vrugte waarvan jou hamster dalk hou of nie. En gevolglik kan dit maklik vervang
  word deur ''n ander kos van jou keuse.dit is goed vir die gesondheid van die dier.
  Met ''n sappige pulp kan die mango verskeie voedingstowwe bied sodat jou troeteldierhamster
  langer en beter lewe.\\nDaarbenewens is die mango ''n vrug wat baie maklik is om
  te vind en vir verskeie ander doeleindes gebruik kan word. keuse. Kortom, dit is
  ''n volledige kos wat ontelbare voordele vir jou en jou hamster kan inhou. Daarom
  is mango ''n uitstekende vrugte-opsie vir jou troeteldier.\\nDruiwe\\nNog ''n uitstekende
  vrugte-idee vir jou hamster is druiwe en rosyne. Hulle is heeltemal veilig vir ''n
  troeteldierhamster om te eet, solank hulle goed gewas en vry is van enige moontlike
  plaagdoders.\\nMaak seker dat hulle skoongemaak word voordat hulle aan die dier
  aangebied word sodat dit nie hardloop nie. risiko wanneer die vrugte ge\u00ebet
  word. Dit is ook die moeite werd om te onthou dat, om altyd die beste vir jou hamster
  te bied, dit aanbeveel word dat jy met jou veearts praat oor die voldoende hoeveelheid
  kos wat aan die dier gebied kan word.\\nPeer\\nDie peer is nog ''n voorbeeld van
  ''n vrug wat die meeste hamsters liefhet. Dit kan maklik gevind word vir verkoop
  of jy kan dit selfs self kweek. En daarbenewens is dit iets wat die spyskaart kan
  verhoog en baie goed vir die dier kan doen.\\nOmdat dit min kalorie\u00eb is, is
  die peer ''n vrug wat belangrike voedingstowwe vir gesondheid verskaf, soos vitamien
  A, E, C, vesels,kalium, magnesium en kalsium. Daarom is dit die moeite werd om jou
  troeteldierhamster se dieet te diversifiseer deur hom af en toe klein stukkies peer
  aan te bied.\\nWatlemoen en spanspek\\nLaaste maar nie die minste nie, waatlemoen
  en spanspek is wonderlike vrugte om jou troeteldierhamster te bedien . Hierdie kosse
  het egter ''n ho\u00eb waterinhoud, wat diarree en dehidrasie kan veroorsaak as
  dit in oorvloed aangebied word. So, onthou om die kos goed te was om skadelike onsuiwerhede
  te verwyder voordat dit aan die troeteldier aangebied word.\\nGroente wat hamsters
  kan eet\\nOm die dieet nog meer gesondheid van jou te diversifiseer troeteldier,
  sal ons hieronder ''n paar wenke bring oor groente en groente wat die hamster kan
  eet. Ons weet reeds dat hierdie kosse baie goed is vir die menslike liggaam. Maar
  het hulle dieselfde effekte vir die hamster? Watter een kan hulle eet? Kyk bietjie!\\nWortel\\n''n
  Eerste voorbeeld van ''n veilige groente vir jou troeteldierhamster is die wortel.
  Dit is ''n voedsel wat, indien dit matig toegedien word, hoogs voordelig vir die
  gesondheid van die dier kan wees. Wortels vir hamsters is ''n veilige en gesonde
  snack vir harige kleintjies. Dit, om te verhoed dat jou hamster oorgewig word en/ofvatbaar
  vir diabetes.\\nSlaai\\nSoos waatlemoen, is blaarslaai ''n groente ryk aan water,
  wat diarree en/of dehidrasie kan veroorsaak as dit in groot hoeveelhede ingeneem
  word. Vir die hamster is dit nie anders nie. Ten spyte daarvan dat dit ''n goeie
  kos vir die dier is, is dit belangrik dat dit met mate gegee word om nie komplikasies
  by die klein knaagdier te veroorsaak nie.\\nDaar is ''n wye verskeidenheid blaarslaaie
  wat jy jou hamster kan voer sonder om bekommerd te wees. . Daarbenewens is dit ''n
  kos wat maklik gevind kan word of selfs op jou eie gekweek kan word. Dit maak blaarslaai
  ''n uitstekende opsie om jou troeteldier se spyskaart te vergroot\\nPampoen\\nOmdat
  dit baie voordelig is vir beide mense en hamsters, is pampoenpitte ware supervoedsel,
  aangesien dit ryk is aan prote\u00efene en ander lewensbelangrike voedingstowwe.
  Hierdie groot kalbassade is uitstekend as ''n peuselhappie vir groter hamsters,
  en jy kan dit veilig aan jou troeteldier bied.\\nHamsters is van nature omnivore,
  maar vars vrugte en groente moet by enige dieet ingesluit word.makgemaakte knaagdier.
  Pampoen in sy mees uiteenlopende eienskappe kan ''n voedingsryke snack vir hamsters
  bied. Daarbenewens is dit die moeite werd om te onthou dat pampoenpitte voedsel
  is wat maklik is om te vind of voor te berei.\\nSoetpatats\\nNog ''n goeie opsie
  om joutroeteldier hamster is patat. Dit is ''n voedsel ryk aan vesel, vitamiene
  en minerale van die mees diverse soort, wat baie voordelig vir die klein knaagdier
  kan wees.\\nDaarbenewens het sulke kos ''n groot hoeveelheid energie, aangesien
  dit ''n ho\u00eb inhoud van koolhidrate en is steeds ryk aan vesel, B-vitamiene,
  vitamien A, vitamien C en minerale. Dit is egter die moeite werd om te onthou dat
  patats van die skil verwyder moet word voordat dit gevoer word. Dit is omdat vorms
  op die vel kan floreer, wat probleme in die spysverteringskanaal en ander siektes
  veroorsaak.\\nBlomkool\\nOns weet dat, hoewel gewone brokkies die meeste van die
  voedingstowwe in ''n blomkooldieet verskaf, ''n hamster, is dit noodsaaklik om dit
  met ander kosse te verhoog. Onder hulle is ''n baie aanbevole groente blomkool.
  Omdat dit baie voedsaam is, bevat dit groot hoeveelhede vitamien C, K, folaat en
  dieetvesel.\\nSulke kos maak ''n wonderlike bederf vir jou troeteldierhamster, solank
  dit vars en goed gewas is. Daarbenewens is dit ''n baie geskikte kos vir die goeie
  gesondheid van beide mense en hamsters. Dit is die moeite werd om te kyk of jou
  troeteldier van blomkool hou en dit dan af en toe aan te bied.\\nJy kan jou hamster
  komkommer gee\\nDie laaste voorbeeld van die beste groente om Deel van jou hamster
  se dieet te maak, is komkommer. Klein knaagdiere kan, ja, solank komkommer eetdit
  is skoon en vars. Dit is ryk aan kalium, wat buigsaamheid aan die spiere bied en
  elastisiteit gee aan die selle waaruit die vel bestaan.\\nOmdat dit ''n ongelooflike
  lekkerny vir hamsters is, is komkommer ''n goeie opsie om jou troeteldier se dieet
  saam te stel. Dit is egter die moeite werd om te onthou dat hierdie kos, sowel as
  ander hierbo genoem, ''n ho\u00eb waterinhoud het, wat dehidrasie en diarree kan
  veroorsaak, indien dit in groot hoeveelhede aangebied word.\\nMeer kosse wat hamsters
  kan eet\\nTot dusver het ons gepraat oor verskillende kosse wat deel van jou hamster
  se dieet kan wees, meer spesifiek vrugte en groente. Maar natuurlik kan ons verder
  gaan as dit. Van hier af sal ons vir jou ander kosopsies bring waarsonder jy jou
  hamster veilig kan aanbied.\\nBrood\\nAangesien sommige brode graan en sade bevat,
  is dit ''n gesonde maaltyd of peuselhappie, hamsters Ja, hulle kan brood eet. Van
  die beste broodopsies vir jou hamster is: heerlike brood, witbrood, volgraanbrood,
  rogbrood, platbrood, ens.\\nSien ook: Kat kwyl baie? Sien moontlike oorsake en wat
  om te doen!Maar aan die ander kant het hierdie soort kos ook sy nadele . Dit is
  omdat ''n hamster se dieet meestal uit sade bestaan, so brood is nie noodwendig
  die beste ding vir hulle nie.\\nSade en neute\\nBaie beskou ''n handvol sade as
  die beste ding. vir hulle, perfekte versnapering vir ''n hamster. En ja, hulle kanbaie
  voordelig wees vir die gesondheid van jou klein knaagdier. As ''n voorbeeld, ons
  sal pampoenpitte h\u00ea\u2014perfek vir groter hamsters- en sonneblomsaad, gelaai
  met vette en vitamiene, wat ''n gewilde keuse vir hamsters is.\\nOok omdat hulle
  omnivore is, hou hierdie diere ook van neute. In hierdie geval kan jy ongesoute
  grondboontjies, wat ''n uitstekende bron van prote\u00efene is, en neute in matige
  porsies aanbied om vetsug te vermy.\\nGekookte eier\\nOmdat hulle omnivore is, hamsters
  wat hulle nodig het ''n gevarieerde dieet wat vleis en ander prote\u00efenryke kosse
  insluit. Dus, hoewel min mense dit weet, is ''n uitstekende opsie om in hierdie
  behoefte te voorsien die gekookte eier.\\n''n Goeie aanbeveling is om jou troeteldier
  een of twee keer per week ''n paar eiers te voer en sodoende te verseker dat hy
  genoeg inkry. prote\u00efen. Maar onthou: nooit, onder geen omstandighede, voer
  jou hamster rou eierwitte nie.\\nWat hamsters nie kan eet nie\\nOm alles saam te
  bring wat jy moet weet om jou troeteldierhamster te maak leef langer en beter, dit
  is ook nodig om te praat oor ''n paar sorg. In hierdie onderwerp sal jy sien watter
  kos jou hamster nie kan eet nie. Kyk gerus!\\nTamaties\\nDie eerste kos wat jy nie
  by jou hamster se dieet moet insluit nie, is tamaties. In sommige gevalle kan jy
  aanbiednet die pitte van die tamatie sonder probleme, maar vermy waar moontlik.
  Tamaties is ''n uitstekende bron van vitamiene A, C en komplekse B, en word sterk
  aanbeveel vir mense, nie hamsters nie.\\nDaar is verskeie ander kosse wat tamaties
  maklik in jou hamster se dieet kan vervang. Die meeste kundiges in die veld beveel
  nie aan dat kli\u00ebnte hul hamsters tamaties voer nie weens kommer oor potensi\u00eble
  toksisiteit.\\nSitrusvrugte\\nNog ''n voedselgroep wat jy nie jou hamster moet voed
  nie, is sitrusvrugte. vrugte, soos lemoen, suurlemoen en mandaryn. Ten spyte van
  die feit dat dit ryk is aan vitamiene, kan sitrusvrugte, indien dit in groot hoeveelhede
  ingeneem word, letsels in die hamster se mond of spysverteringstelsel veroorsaak.\\nSitroenvrugte
  word gekenmerk deur ho\u00eb konsentrasies askorbiensuur. Askorbiensuur is ook verantwoordelik
  daarvoor om ''n suur smaak aan vrugte te gee, wat dalk voordelig vir hamsters is
  of nie. Daarom, om moontlike komplikasies te vermy, kies veiliger vrugte, soos appels
  en pere.\\nKnoffel en ui\\nAangesien hamsters ''n baie meer brose spysverteringstelsel
  het in vergelyking met mense, is knoffel en uie ander voorbeelde van wat om nie
  klein knaagdiere aan te bied nie. Knoffel en ui het suurheid as hul hoof fisies-chemiese
  eienskap.\\nHiermee is dit te verwagte\"", "\"GENESIS-REEKS NO 47\\nGenesis 49 >
  Die toekoms in \u2018n neutedop\\nGenesis 49 is letterlik Jakob se laaste woorde
  net voor sy dood. En dit is sterwenswoorde uitgespreek onder die leiding van die
  Heilige Gees. Dit is ook profetiese woorde aangaande die toekoms van Jakob se seuns
  \u2013 in po\u00ebtiese, digterlike taal.\\nBehalwe dat Gen 49 \u2018n moeilike
  gedeelte is, is die groot vraag wat ons vanoggend beantwoord moet kry: Wat het die
  toekoms van Jakob se seuns met \u00f3ns \u2013 in die 21ste eeu \u2013 te doen?
  Nog \u2018n vraag: Wat het hierdie uitsprake vir Jakob se seuns te s\u00ea gehad
  aangesien hulle almal in Egipte sou sterf en dus glad nie lank genoeg lewe om die
  vervulling daarvan te sien nie. Waarom het die Here \u2013 deur Jakob se mond \u2013
  oor goed gepraat wat eers vervul sou word lank nadat almal reeds dood was? Wat was
  die doel daarvan? Waarom ontvang Ruben, Simeon en Levi bestraffing van hulle pa
  oor hulle sondige verlede, terwyl Juda \u2013 wat ook baie goddeloos was \u2013
  die grootste se\u00ebning van al die seuns ontvang \u2013 deurdat hy die voorvader
  van die Messias sou wees? Watter werklike waarde het Jakob se woorde vir Ruben,
  Simeon, Levi, Juda en die res gehad? En natuurlik: Wat moet ONS vandag daarmee doen?\\nEen
  gevaar wat ons moet vermy is om in die fynere detail van hierdie profetiese uitsprake
  vas te val. Ons moet onthou: EEN dat dit in po\u00ebtiese taal gegiet is en TWEE
  dat die bedoeling nie is om elkeen van die seuns as individuele persone se toekoms
  uit te spel nie, maar om hulle te sien as uiteindelike leiers van stamme \u2013
  die 12 stamme van Israel. Dit gaan dus oor die algemene karakter en klimaat waaraan
  elke stam in die afsienbare toekoms gekenmerk sou word.\\nOm dus in klein detail
  vas te val en in alles spesifieke vervullings in die geskiedenis te wil gaan soek,
  is \u2018n mors van tyd en energie. Mense is soms geneig om dit te doen omdat hulle
  nie verstaan wat presies bybelse profesie is nie. Ons moet byvoorbeeld eerder vra
  wat die tydlose boodskap is wat ons uit die uitsprake kan filtreer.\\nDis nogal
  interessant om te sien hoe hierdie uitsprake van Jakob oor die toekoms van sy seuns
  eintlik net \u2018n verlengstuk is van hetsy hulle verlede of die betekenisse van
  hulle name. Dis belangrik om dit te sien, want dit leer vir ons iets oor wat bybelse
  profesie is.\\nProfesie is nie toekomsvoorspelling soos wat \u2018n waars\u00eaer
  onder demoniese invloed by sy/haar kristalbal doen nie. Bybelse profesie is Evangelieverkondiging
  \u2026 dit is \u2018n Boodskap van die lewende God wat op een of ander manier vervul
  is of sal word in die Here Jesus Christus en wat die verlossing van sondaars in
  die oog het. Bybelse profesie is nooit lukrake toekomsvoorspellings nie.\\nDie rede
  waarom OT profesie meesal toekomsmusiek is, is omdat die koms van die Messias nog
  \u2013 vir hulle \u2013 in die toekoms gel\u00ea het. En die rede waarom profetiese
  woorde in die NT soms toekomsmusiek is, is omdat die TWEEDE koms van Christus \u2013
  vir ons \u2013 nog in die toekoms l\u00ea.\\nBybelse profesie is dus HEILSVERKONDIGING
  in die Messias, wat stewig geanker is in die pad wat die Here alreeds met Sy mense
  geloop het \u2013 die heilsgeskiedenis dus.\\nKyk na Jakob se uitsprake en u sal
  dit sien. Die toekomstige se\u00ebninge wat Jakob aan byvoorbeeld Ruben, Simeon
  en Levi toes\u00ea, is gebaseer op die sondes wat hulle in die verlede gedoen het.
  Ander se toekomstige se\u00ebninge is gebou op die betekenis van hulle name soos
  byvoorbeeld Juda wie se naam \u201clofprysing\u201d beteken. En nou s\u00ea Jakob
  dat Juda deur sy broers geprys sal word (vers 35). Dan, wie se naam \u201com te
  oordeel\u201d beteken, sal oor die Here se mense oordeel (vers 16).\\nOns moet dus
  helder en duidelik weet wat Bybelse profesie is: Die boodskap van heil in die Messias
  \u2013 geanker in God se historiese verlossingshandelinge met Sy mense. Praat dit
  oor die Messias wat nog moet kom (soos in die OT) dan is dit voorsegginge vir die
  toekoms. Dan KLINK dit soos \u2018n Gypsy met \u2018n glasbal se toekomsvoorspellings,
  maar dit is glad nie dit nie. Dit is evangelieverkondiging \u2013 vasgebind in die
  Messias.\\nDis moeilik om te s\u00ea HOE belangrik hierdie definisie is. Veral in
  ons dag, waar mense om elke hoek en draai kwansuis die \u201cgawe van profesie\u201d
  besit en allerlei uitsprake van \u201cdie Here het vir my ges\u00ea om vir jou te
  s\u00ea\u201d OF \u201cdie Here het vir my gewys wat gaan gebeur\u201d maak.\\nDie
  sogenaamde \u201cgawe van profesie\u201d beteken volgens hierdie mense dat die Here
  nuwe openbarings aan sommige mense gee \u2013 direk in hulle ore \u2013 waarvan
  baie met die toekoms te make het. Wat eintlik beteken dat dit wat in die 66 boeke
  van die Bybel geskryf is, nie God se afgehandelde volledige openbaring is nie \u2013
  dit kan en moet nog aangevul word.\\nOns kan maar rustig van hierdie moderne profete
  vergeet, sonder om vir een oomblik skuldig te voel.\\nNatuurlik bestaan die profetiese
  gawe nog steeds vandag. Maar dit beteken om dit wat in die SKRIF staan \u2013 dit
  wat God KLAAR gepraat het \u2013 onder leiding van die Gees korrek toe te pas binne
  konkrete situasies. Gaan en praat SKRIFWOORDE en die Heilige Gees sal dit gebruik
  om ander te stig, op te bou, te vermaan, te waarsku, te troos, te leer, op te voed
  ensovoorts. Dis wat profesie beteken.\\nKom ons kyk vervolgens kortliks na die inhoud
  van elkeen van Jakob se uitsprake en daarna distilleer ons die boodskap wat dit
  vir ons vandag inhou \u2013 die w\u00e1re profetiese woord vir ons wat hier sit.\\n1
  RUBEN (VERSE 3-4) > Ruben was die eersgeborene van Jakob, maar het sy eersgeboortereg
  van om oor sy broers gestel te wees en \u2018n dubbele deel erfporsie te ontvang,
  verloor agv sy wellus en magslus wat sigbaar geword het toe hy owerspel met sy pa
  se byvrou, Bilha, gepleeg het. Hy was onstabiel soos seewater. Geen leier \u2013
  rigter, profeet, koning \u2013 het ooit uit die stam van Ruben gekom nie. BOODSKAP:
  SONDE HET ALTYD KONSEKWENSIES \u2013 Ruben verloor sy eersgeboortereg.\\n2 SIMEON
  EN LEVI (VERSE 5-7) > Deur die manier hoe hulle opgetree het toe hulle suster Dina
  deur Sigem onteer was, het hulle getoon dat hulle nie godvrugtig lewe nie. Hulle
  het naamlik met ongekontroleerde woede en sinnelose vernietiging teenoor die Sigemiete
  opgetree. Daarom sou hulle nie eie grond kry nie. Uiteindelik het dit ook so gebeur
  dat Simeon se nageslag se grondgebied binne Juda s\u2019n gevestig was. En omdat
  die priesters uit Levi sou kom, het hulle ook nie grond gehad nie. BOODSKAP: SONDE
  HET KONSEKWENSIES: SIMEON EN LEVI VERLOOR HULLE GRONDGEBIED!\\n3 JUDA (VERSE 8-12)
  > Ons sou nie van Juda verwag om prominensie te ontvang nie \u2013 nie na die episode
  met Tamar vir wie hy as prostituut aangesien het nie (Gen 38). En tog wag daar \u2018n
  blink toekoms vir die stam van Juda. Dis duidelik dat die posisie wat Ruben moes
  gehad het, na Juda oorgedra word. Juda het immers gepleit vir Josef se behoud toe
  sy broers hom wou doodmaak. Juda het homself as borg gegee vir Benjamin se veiligheid.
  Hy sou oor sy broers heers en sy vyande oorwin. Sy milit\u00eare mag sou die krag
  van \u2018n leeu h\u00ea. Die Messias sou ook uit die stam van Juda gebore word.
  Die misterieuse titel SILO (wat in baie vertalings korrek vertaal is) is \u2018n
  verwysing na die komende Messias \u2013 die \u201cleeu uit die stam van Juda\u201d
  (Openb 5:5). Die septer van leierskap sou uit die Judastam voortkom en uitmond in
  Dawid se koningshuis en Christus wat uit die Dawid-lyn sou kom. BOODSKAP: TEN SPYTE
  VAN GELOWIGES SE PERSOONLIKE SONDE-SKETE, IS GOD GETROU EN VERVUL HY SY PLAN EN
  RAAD EN BELOFTES!\\n4 SEBULON EN ISSASKAR (VERSE 13-15) > In teenstelling met Juda,
  het Issaskar nie sy vyande onderwerp nie. Die gevolg hiervan was dat die vyand oor
  hom geheers het. Issaskar sou in diens van die Kana\u00e4niete wees. Wat hulle nie
  kon bemeester nie, het hulle meester geword. Terwyl dit lyk asof die belofte aan
  Sebulon nie waar geword het nie, want Jakob beloof dat hierdie stam tot teen die
  seestrand en tot by Sidon sal gaan. Uit Josua 19 weet ons egter dat die grondgebied
  wat Sebulon ontvang het NIE letterlik tot by die see of Sidon gegaan het nie. Maar,
  dit was wel naby genoeg aan beide om verryk te kon word deur die seehandel. En so
  het dit ook gebeur. In die Hebreeus kan ons sien dat Jakob eintlik s\u00ea dat Sebulon
  se grondgebied IN DIE RIGTING VAN DIE SEE sal strek. BOODSKAP: DIE GELOWIGE KAN
  NIE EN MAG DIE SONDE EN VERSOEKINGS MAK MAAK NIE. DEUR DIE GEES MOET DAAROOR GEHEERS
  WORD, ANDERS SAL DIE VYAND OOR JOU HEERS.\\n5 DAN (VERSE 16-18) > Al word hier iets
  positiefs oor die stam Dan ges\u00ea, naamlik dat Dan vir die ander stamme koers
  en rigting sal gee (want dit is wat daar bedoel word wanneer ges\u00ea word dat
  Dan regter oor die ander sal wees \u2013 dit beteken RIGTER sal wees) \u2013 fokus
  vers 18 nie op die hoop wat Dan moet bring nie, maar op die verlossing wat die HERE
  moet bring. Kyk gerus mooi daarna: Die Heilige Gees praat deur Jakob en die Gees
  verskuif die fokuspunt na die regte plek toe: Nie die stam Dan nie, maar die HERE
  alleen is die bron, fontein, oorsprong, van ware en egte heil. Ons moenie ons oog
  op die MENS hou nie, maar op die HERE, want die mens sal ons faal en teleurstel.
  Soos wat Dan inderdaad gedoen het. Die geskiedenis bevestig dit. In Openbaring 7
  word Dan nie eens in die lys van stamme van Israel genoem nie!\\n6 GAD EN ASER (VERSE
  19-20) > Van hierdie twee stamme sou twee dinge waar word: Gad sou in staat wees
  \u2013 deur God\u2019s genade \u2013 om nie vernietig te word deur vyandige aanslae
  van ander nasies nie. Gad sou \u2018n oorwinnende, manhaftige stam wees. En Aser
  sou materie\u00ebl welvarend \u2013 produktief \u2013 wees. Dit het in die geskiedenis
  ook so gebeur. BOODSKAP: DIT IS DIE VRUG WAT DIE HEILIGE GEES UIT GENADE IN ALLE
  GELOWIGES SE LEWENS UITWERK: MEER AS OORWINNAARS \u2013 SOOS OPENBARINGBOEK LEER\\n7
  NAFTALI (VERS 21) > Die prentjie wat gegee word van die stam van Naftali is dat
  hulle ongehinderde vryheid en toename in getalle sou h\u00ea. Hulle sou \u2018n
  se\u00ebn vir ander wees. Die rigter Deborah sou byvoorbeeld uit hierdie stam kom.
  BOODSKAP: DIE HERE SE WIL VIR SY MENSE IS DAT HULLE TOT SE\u00cbN VAN ANDER SAL
  WEES.\\n8 JOSEF (VERSE 22-26) > Die Messias sou nie uit Josef voortkom nie, maar
  tog sou Josef se nageslag oorvloed en vrugbaarheid geniet. Ons weet egter hoe Efraim
  se hoogmoed en afvalligheid die genieting van hierdie se\u00ebninge tot \u2018n
  groot mate beperk het. BOODSKAP: DIE OORHEERSENDE BOODSKAP VAN JOSEF SE NAGESLAG
  IS DAT DIT \u2018N PRENTJIE IS VAN DIE OORVLOED WAARMEE DIE HERE SY MENSE WIL SE\u00cbN\\n9
  BENJAMIN (VERS 27) > Benjamin se nageslag word beskryf as kwaai en aggressief. \u2018n
  Wolf wat sy prooi verskeur. Iets daarvan sien \u2018n mens in Rigters 19-21. In
  Deut 33 sou Moses baie jare later vir Benjamin in \u2018n meer positiewe lig stel
  deur te wys op die sekuriteit wat hy in die Here gevind het. Die Here het so baie
  aan hierdie stam toevertrou, maar helaas het hulle nie altyd besef dat hoe meer
  aan jou toevertrou word, hoe meer verantwoordelikheid en getrouheid dit eis nie.\\nDIE
  BOODSKAP VIR ONS\\nDit is seker moontlik om \u2018n klompie mooi moralistiese lessies
  uit hierdie ingewikkelde hoofstuk af te lei, maar ek dink nie dit is die rigting
  waarin ons die boodskap moet soek nie.\\nDie Bybel se hoofintensie is nie om morele
  lesse te leer nie. Die Bybel se intensie is om Christus te verkondig, om die Evangelieboodskap
  te verkondig. En ek dink ons moet uit Genesis 49 die manier leer hoe ons die geheelboodskap
  van die hele Bybel moet verstaan \u2013 en veral die Bybel as PROFETIESE Woord van
  God moet verstaan.\\nDoen ons dit op hierdie manier, hoor ons die volgende:\\n1
  > DIE PROFETIESE WOORD VAN GOD FOKUS ONS AANDAG OP DIE TOEKOMS > Alle mense se geneigdheid
  is om te leef asof daar nie \u2018n toekoms is nie en alles oor die hier en die
  nou en die sigbare gaan. Dit is ingewortel in elke mens se binneste om te leef vir
  die hede en die tydelike en die sigbare.\\nJakob en sy seuns en hulle nageslagte
  was ook presies net so.\\nMaar Genesis 49 laat ons sien hoe die Here hulle fokus
  na die toekoms draai en hulle DAAR laat kyk en daarom lewende HOOP kry. Dis GOD
  se toekoms, u sien. Nie \u2018n onsekere mensgemaakte stuk wensdenkery nie.\\nHebr
  11:1 s\u00ea dat ware geloofsvertroue \u2018n stuk sekerheid is oor die dinge waarop
  gehoop word, dinge wat nie gesien kan word nie.\\nJakob se seuns moes nie hulleself
  blindstaar teen wat Egipte hulle daar en dan kon bied nie. Hulle moes die land Kanaan
  sien \u2013 waarheen hulle nageslagte deur God gelei sou word, want dis wat Hy beloof
  het om te doen.\\nWare Christene is mense wat ten diepste met hulle oog op God se
  toekoms leef. En daardie fokus be\u00efnvloed hulle lewe van vandag\u2026\\n2 >
  DIE PROFETIESE WOORD VAN GOD HELP ONS HOE OM VANDAG TE LEEF IN DIE LIG VAN DIE TOEKOMS
  > Vreeslik belangrik is om te sien dat die profetiese woord aan Jakob se seuns bedoel
  was om passiwiteit en selftevredenheid uit te wis en om hulle aan te spoor om die
  Here ywerig te dien en heilig te leef. Hulle vorentoe kyk na God se toekoms en die
  beloofde land, moes hulle lewens in die HEDE verander en na die Here toe draai.\\nLuister
  wat s\u00ea die Apostel Petrus in 2 Petr 3: \u201cDie Dag vd Here kom soos \u2018n
  dief in die nag wanneer die hemele sal verbygaan met \u2018n gedruis en die planete
  sal smelt en die aarde verbrand word. Aangesien al hierdie dinge so aan hulle einde
  sal kom, hoeveel te meer moet julle nie nou heilig en godvrugtig leef nie..\u201d\\nMy
  sekerheid oor God se toekoms be\u00efnvloed my lewe van vandag \u2013 baie drasties.\\nWys
  vir my iemand wat die Here met alle mag wil gehoorsaam en wat brandend is vir die
  Here Jesus. Iemand wat opsigtelik \u2018n heilige lewe najaag. Ek kan u verseker
  dat so \u2018n persoon se o\u00eb op die Here se toekoms vasgenael is. Daar is \u2018n
  stuk toekomshoop in so \u2018n persoon se binneste. \u2018n Mens kan dit sien aan
  hoe so \u2018n mens leef.\\nTafelberg Gemeente (Dolerend)\\nBuitenkantstraat 39,
  Kaapstad\\nwww.tafelbergkerk.co.za\\nDr Chris Saayman\"", "\"Aflaai \u0130SEM,\\nMet
  die ISEM-toepassing kan gestremde individue wat in Istanbul woon maklik vanaf hul
  Android-toestelle toegang kry tot alles wat hulle nodig het.\\nAflaai \u0130SEM\\nISEM-toepassing
  wat deur Istanbul Metropolitaanse Munisipaliteit aangebied word, bied u al die dienste
  van die IMM Direktoraat vir Gestremdes vanaf u slimtoestelle. In die ISEM-toepassing,
  wat maklike toegang tot alle gestremde sentrums in Istanbul bied, word dienste ook
  aangebied vir kommunikasie met gestremde individue.\\nIn die ISEM-toepassing, wat
  ook n gebaretaalwoordeboek bied, kan jy toegang tot n baie omvattende woordeboek
  kry en gebaretaal leer. Daarbenewens het jy toegang tot alle aankondigings van die
  IMM Direktoraat vir Gestremdes in die aansoek, en jy kan ook die instelling se Twitter-rekening
  volg.\\nToepassing kenmerke\\n- Gedetailleerde inligting oor gestremde sentrums.\\n-
  Kommunikasie met gestremdes.\\n- Omvattende gebaretaalwoordeboek.\\n- Vermo\u00eb
  om die aankondigings van die Istanbul Metropolitaanse Munisipaliteit Direktoraat
  vir Gestremdes te volg.\\n\u0130SEM Spesifikasies\\n- Platform: Android\\n- Kategorie:
  App\\n- Taal: Engels\\n- L\u00eaergrootte: 8.4 MB\\n- Lisensie: Gratis\\n- Ontwikkelaar:
  \u0130stanbul B\u00fcy\u00fck\u015fehir Belediyesi\\n- Laaste opdatering: 08-01-2024\\n-
  Aflaai: 1\"", "\"Na die skerp prysstygings van landboumasjinerie oor die afgelope
  18 maande lyk dit asof die prysverandering op \u2019n jaargrondslag op kort termyn
  stadig daal.\\nDr. Jim Rankin, uitvoerende hoof van Agfacts, s\u00ea in Desember
  2012 was die prysverandering op \u2019n jaargrondslag vir alle kategorie\u00eb landboumasjinerie
  (trekkers, stropers, hooi- en voermaaktoerusting asook werktuie) redelik laag met
  die gemiddelde algemene prysverandering wat met 3% gedaal het.\\nDie waardevermindering
  in die waarde van die rand gedurende 2013 en vroeg in 2014 het \u2019n nadelige
  uitwerking gehad op die prysveranderinge op ''n jaargrondslag. Sedertdien het die
  verandering op ''n jaargrondslag in die waarde van die rand versterk. Vir Junie
  2014 word die prysverandering vir alle kategorie\u00eb landboumasjinerie as 21,4%
  aangegee terwyl di\u00e9 syfer vir Julie 2014 op 18,3% staan, wat \u2019n afwaartse
  neiging van 3,0% aandui.\\nDie Suid-Afrikaanse Landboumasjinerie-assosiasie (Salma)
  se amptelike kleinhandelsverkooppsyfers vir April, Mei en Junie van nuwe trekkers
  en stropers in Suid-Afrika is nie beskikbaar nie. Volgens Agfacts se skatting is
  die 590 nuwe trekkers wat in Junie 2014 verkoop is, egter sowat 10,1% minder as
  die 656 eenhede wat in Junie 2013 van die hand gesit is.\\nIn die drie maande tot
  Junie vanjaar het 95 nuwe stropers nuwe base gekry teenoor die 110 nuwe stropers
  wat in die ooreenstemmende tydperk verlede jaar verkoop is. Hierdie syfers verteenwoordig
  \u2019n daling van 13,6% in stroperverkope vir die gegewe tydperk.\\nVolgens skatting
  sal tussen 6 800 en 7 200 nuwe trekkers (5% tot 10% minder as in 2013) en tussen
  320 en 330 nuwe stropers (5% tot 10% minder as in 2013) in 2014 van die hand gesit
  word, s\u00ea Rankin.\"", "\"Wat was die vonk wat jou laat begin skryf het?\\nDie
  \u2018vonk\u2019 wat my laat skryf is \u2018n goeie storie-idee. En dan is dit soos
  \u2018n vreeslike lus wat my beetpak om binne in daardie storie te gaan kuier. Soos
  my onlangse boek, Die Avonture van Magrietjie Swaaiboude, my in die lewe van die
  karakters ingetrek het.\\nHoekom het jy spesifiek gekies om jou toe te l\u00ea op
  kinder- en jeugboeke?\\nEk het nie regtig gekies om kinder- en jeugboeke te skryf
  nie. Dit het maar net so gebeur. Ek skryf ook ander stories. Maar, kinderboeke l\u00ea
  my na aan die hart.\\nJy kan jou veral in die w\u00eareld van dierekarakters besonders
  inleef. Hoekom is dit vir jou belangrik om oor dierekarakters te skryf?\\nDierekarakters
  vind byval by alle kinders. Jy het nie nodig om polities korrek te wees nie. Muise
  is muise en honde is honde. Dis net soveel makliker.\\nDink jy die feit dat jy as
  kind toegelaat is om jou verbeelding vryelik uit te leef, en dat daar vir jou voorgelees
  is as jong kind, het n rol gespeel in jou latere skryfwerk?\\nEk het behoorlik stories
  met my pap ingekry. By die etenstafel soggens, middae en saans voor slaaptyd het
  my ma vir ons stories vertel. Sy het ook baie stories vir ons gelees. En ek dink
  dat al die wonderlike stories wat ons gehoor het, het ons beslis gehelp om vandag
  kreatief te dink. Ons het altyd planne gemaak. Ons eie speletjies uitgedink. Ons
  het toe ek twaalf jaar oud was ons eerste verhaal uitgewerk en op \u2018n bandmasjien
  opgeneem, met byklanke! Ons het die bure se seuns oorgenooi en ons eie radioverhaal
