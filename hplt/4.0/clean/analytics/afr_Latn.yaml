  2 | Datum gepubliseer: 06 Dec 2015 | Kere gelees: 0 | Kommentare: 1\\nIn beweging,
  of hoe ''n luim sy ronde draai\\nDie woede\\nOUPA IS BESIG om...\\nTitel: Ek (deel
  4)\\nWeergawe: 1 | Datum gepubliseer: 10 Nov 2015 | Kere gelees: 0 | Kommentare:
  0\\nTeensinnigheid word vermag met die draai van \u2019n arm en die sny van die
  vlees...\\nNuutste werk ingestuur binne die afgelope 7 dae\\ndeur Rachelle du Bois\\nAdele
  Coetzee will nie vir Francois Bekker as nuwe plaasbestuurder op Goedgeloofd h\u00ea
  nie. Sy kan self hul familieplaas bestuur. Francois is \u2018n indringer en hoort
  nie op die plaas nie. Sy vertrou hom nie, maar Francois besluit dat hierdie tierwyfie
  getem moet word. Deon Kelder woon op die buurplaas Goedehoop en hy is verlief op
  die misterieuse nuwe onderwyseres by die plaaslike laerskool, Madri Viljoen. Waarvoor
  het die hoogsbegaafde Madri gevlug en wat kom maak sy hier op Heidelberg? Hy wil
  haar h\u00ea, maar dis toe nie so maklik nie, want haar pynlike verlede kom staan
  soos \u2018n skim tussen hulle. En wie is Alex \u2026.?\"", "\"Ons het een jaar,
  n\u00e1 \u2019n familietroue op Tulbagh, vir vier dae op een van Alb\u00e9 Louw
  se weidingsplase gaan oorstaan. Dit was naby Granaatboskolk, wat net \u2019n naam
  op die landkaart is.\\nDit was vier dae sonder selfoonsein, elektriese krag of lopende
  water \u2013 behalwe dit wat in 5 liter-waterbottels opgegaar is en in die son warm
  geword het, en wat ons oor mekaar uitgegiet het in die bad om mee af te spoel. Die
  stilte was die bekoorlikste van alles.\\nD\u00e1\u00e1r het die gedagte ontkiem
  om dit eendag vir \u2019n langer tydperk te onderneem; om net weer gestroop van
  alle luuksheid by ons wortels en die basiese dinge van die lewe, en by onsself,
  uit te kom. Dit was nooit \u2019n beplande nege maande nie \u2013 dit het net toevallig
  s\u00f3 uitgewerk.\"", "\"Ons leef in \u2018n tyd waarin daar toenemende druk op
  omtrent alle kerke in die w\u00eareld toegepas word om hulle leerstellings ingrypend
  te verander. Daar moet minder dogmaties na die Bybel gekyk word, omdat die moderne
  mens nie sy vryheid deur \u2018n eng, letterlike beskouing van die Bybel wil beperk
  nie. \u2018n Bybelse godsbegrip, verlossingsleer en chiliastiese weergawe van die
  eindtyd, word deur die nuwe hervorming verwerp wat nou aan die gang is. Dit staan
  in die pad van koninkrykshervormings wat daarop gerig om \u2018n gelukkige toekoms
  vir \u2018n verenigde mensdom van alle gelowe te skep. In die postmoderne w\u00eareld
  beskou mense hulleself vry om hulle eie waardes en geloofsopvattings te bepaal.
  Wanneer dit met di\u00e9 van die Bybel verskil, word bloot ges\u00ea dat die Bybel
  in terme van \u2018n antieke w\u00eareldbeeld geskryf is toe mense nog geglo het
  dat daar \u2018n duiwel en \u2018n hel is, asook \u2018n God wat wraaksugtig is
  en straf vir sonde wil uitdeel. In die postmoderne w\u00eareld word daar volgens
  nuwe paradigmas gedink wat in botsing met \u2018n letterlike vertolking van die
  Bybel is. Omdat godsdiens nie meer deur geloof nie, maar deur subjektiewe menslike
  denke bepaal word, word moderne en pre-moderne opvattings gedekonstrueer en met
  postmoderne idees vervang wat uit \u2018n humanistiese w\u00eareldbeeld kom.\\nDie
  verskillende strome van godsdienstige dwalings in die w\u00eareld is tans besig
  om groter te word en met mekaar saam te vloei om \u2018n magtige stroom van misleiding
  te word wat onstuitbaar op sy doel afstuur om die w\u00eareld oor te neem en te
  verander. Die w\u00eareldkerk wat uit hierdie nuwe hervorming gebore word, word
  die opkomende kerk van die 21ste eeu genoem \u2013 in Engels the emerging church.
  Dit is die tema van verskeie nuwe boeke wat gepubliseer word, onder andere Roger
  Oakland se boek met die titel: Faith Undone. The Emerging Church \u2013 a New Reformation
  or an End-time Deception? (Besoek die webblad www.lighthousetrails.com). Dit is
  inderdaad die doel van die nuwe hervorming om \u2018n Bybelse geloof te vernietig
  en \u2018n valse spiritualiteit in die plek daarvan te vestig. Die volgende is die
  uitstaande kenmerke van die opkomende kerk:\\nOntstaan van die beweging\\nEen van
  die nuwe hervorming se pioniers was die beroemde Amerikaanse sakeman, Peter Drucker,
  wat in 2005 oorlede is. Hy het \u2018n sterk beweging van postmoderne hervormings
  in die samelewing aan die gang gesit. Dit het behels dat openbare instellings, beleidsrigtings
  en geloofsopvattings van die moderne tyd vir di\u00e9 van \u2018n postmoderne tyd
  moes plek maak. Hy het drie terreine in die samelewing ge\u00efdentifiseer waar
  verandering gelyktydig moet geskied: Op die politieke gebied moet regerings met
  bre\u00eb en meer demokratiese beginsels aan die bewind kom sodat daar groter vrede
  en eenheid geskep kan word \u2013 ook met die buitew\u00eareld. Op die ekonomiese
  gebied moet groot korporasies en multinasionale maatskappye tot stand kom, sodat
  die sakesektor \u2018n groter bydrae tot sosiale verandering kan lewer. Op die godsdienstige
  terrein moet mega-gemeentes met sterk ekumeniese bande geskep word, om \u2018n groter
  rol in sosiale en geestelike transformasie te kan speel. Leierskapsnetwerke is op
  al drie hierdie terreine geskep, en hulle werk met mekaar saam om die doel van omvattende
  veranderings te verhaas. Op di\u00e9 manier word sielkundige en sakebeginsels ook
  aktief vir kerkgroei ingespan.\\nWat sy godsdienstige ori\u00ebntasie betref, het
  Peter Drucker die grootste aansluiting by die Deense filosoof en godsdienstige denker,
  Kierkegaard, gevind. Volgens Kierkegaard is geloof nie op objektief waarneembare
  feite gebaseer nie, maar \u2018n subjektiewe saak wat elkeen in sy eie gedagtes
  kan konstrueer soos hy wil. Sy godsbegrip was misties. Die mens moet vry wees om
  sy godsdienstige oortuigings volgens sy eie behoeftes te bepaal, daarom was Kierkegaard
  baie sterk teen die Deense staatskerk gekant, wat volgens hom menslike vryhede aan
  bande gel\u00ea het. Hy het selfs ges\u00ea dat \u2018n besluit om Christus na te
  volg, op afgodediens neerkom.\\nVolgens Drucker en ander postmoderniste is kerke
  wat rigiede strukture en geloofsopvattings het, bastions van die uitgediende moderne
  era. Hulle moet verander en ekumenies-gesinde mega-kerke word wat saam met die sakesektor
  en politieke organisasies \u2018n dinamiese rol sal speel om die samelewing te hervorm
  en te verenig. Daar word spottenderwys na di\u00e9 kerke en Christene wat nie wil
  verander en die nuwe hervorming aanvaar nie, as Vintage Christianity verwys \u2013
  dit is die outydse Christendom. Hulle is soos ou motors uit vervlo\u00eb dae.\\nDrucker
  het \u2018n leierskapsinstituut gestig omdat mense se behoeftes volgens hom veel
  wyer as die grense van tradisionele instellings in die samelewing gaan. Onder die
  sterk be\u00efnvloeding van Drucker het \u2018n ander sakeman, Bob Buford, in 1984
  \u2018n leierskapsnetwerk gestig om die leiers van innoverende kerke te help om
  met mekaar saam te werk en s\u00f3 gouer hulle doel te bereik. Twee leiers wat \u2018n
  groot rol in die vroe\u00eb dae van die leierskapsnetwerk gespeel het, is Bill Hybels
  van die Willow Creek mega-kerk en Rick Warren van Saddleback. Bill Hybels het verskeie
  groot konferensies gehou en ook boeke oor die opkomende kerk gepubliseer. Daar het
  ook ander prominente leiers na vore getree, soos Leonard Sweet, Professor in evangelisasie
  aan die Drew Universiteit, en Brian McLaren, \u2018n invloedryke evangeliese leier
  wat sterk ten gunste van fundamentele verandering is.\\nDie persoon wat egter die
  grootste impak ten gunste van die opkomende kerk gemaak het, is Rick Warren. Daar
  is reeds 400 000 predikers in 163 lande wat by sy opleidingsprogram vir doelgerigte
  gemeentes ingeskakel is. Warren gee groot erkenning aan Peter Drucker en Bob Buford
  vir sy kennis oor leierskap, en het ook met beide van hulle saamgewerk. Hy het in
  \u2018n onderhoud ges\u00ea dat daar vir die stabiliteit van \u2018n nasie \u2018n
  sterk en gesonde regering, \u2018n sterk en gesonde sakesektor en sterk en gesonde
  kerke moet wees. Dit is soos \u2018n driepoot-stoel wat vas staan. Met die oog hierop
  gaan hy na verskeie lande om aan regeringsleiers, sakeleiers en kerkleiers hulle
  rol en plig tot onderlinge samewerking te verduidelik.\\nRick Warren praat met kerkleiers
  van alle denominasies oor sosiale transformasie, ook met Mormone en Katolieke, en
  beklemtoon telkens dat leerstellings nie so belangrik as diens aan die gemeenskap
  is nie.\\nKoninkryksteologie\\nDie opkomende kerk is baie sterk tot die openbaring
  van God se koninkryk verbind; dit moet hier en nou, nog voor die wederkoms van Christus,
  gebeur. In hierdie koninkryk gaan dit oor die mensdom wat gelukkig en tevrede moet
  wees, sonder onderdrukking, uitbuiting, armoede, siektes, konflik, revolusies, oorlogvoering
  en ander negatiewe ervarings. Rick Warren het \u2018n omvattende PEACE plan ontwerp
  om die koninkryk in alle gemeenskappe te laat kom. PEACE is \u2018n akroniem waarin
  die P vir Planting and Partnering Churches staan, die E vir Equipping leaders, die
  A vir Assisting the poor, die C vir Caring for the sick en die E vir Educating the
  next generation.\\nWarren be\u00efnvloed miljoene gelowiges \u00e9n ongelowiges
  in die w\u00eareld deur sy mengsel van humanit\u00eare en Bybelse doelwitte wat
  binne die raamwerk van positiewe denke aangebied word. Dit vind byval by regerings,
  sakemanne, kerke \u00e9n die bre\u00eb gemeenskap, ongeag of hulle sekul\u00ear
  of godsdienstig geori\u00ebnteerd is, omdat dit daarop gerig is om die samelewing
  op te hef, armoede uit te skakel, siekes te behandel, die ongeletterdes op te lei,
  en vrede en versoening tussen alle faksies in die samelewing te bevorder.\\nDie
  probleem met Rick Warren se positivistiese en mens-geori\u00ebnteerde program is
  dat niks genoem word wat \u2018n negatiewe konnotasie het nie, soos bv. geestelike
  misleiding, die feit dat ongeredde mense verlore sondaars is, en die oordeel van
  God oor sonde tydens die soendood van Christus aan die kruis. Die kruis en bloed
  van Christus word doelbewus verswyg, gevolglik is hy besig om \u2018n menslike koninkryk
  op die valse fondament van \u2018n ander Jesus te bou. Die 40-dae program van sy
  doelgerigte lewe word net as \u2018n hulpmiddel gebruik om die potensiaal van mense
  te ontsluit en te ontwikkel, sodat hulle \u2018n vervullende lewe kan lei en die
  volle maat van God se se\u00ebn kan geniet. Die versoening kom nie duidelik ter
  sprake nie. George Otis stem ook hartlik hiermee saam, want hy s\u00ea dat God nie
  ons sonde op grond van Christus se kruisdood vergewe nie, maar omdat Hy goed en
  vergewensgesind is. Die boodskap van Bybelse versoening word al hoe meer op die
  agtergrond geskuif.\\nDit is die taal van die opkomende kerk. In die koninkryk wat
  hulle besig is om op te bou, word daar nie aandag aan die suiwerheid van Christelike
  leerstellings gegee nie. Warren s\u00ea dat dit in hierdie tweede hervorming nie
  oor leerstellings gaan nie, maar oor dade: dit gaan nie oor wat die kerk glo nie,
  maar oor wat hulle doen. Jesus Christus is nie die sentrale fokuspunt van die opkomende
  kerk nie, omdat die aandag hoofsaaklik op die vestiging van God se koninkryk op
  aarde toegespits is. Almal moet saamwerk om die probleme van siekte, armoede, werkloosheid,
  ongeletterdheid, verdeeldheid en konflik uit te skakel. Transformasie-byeenkomste
  is een van die metodes wat gebruik word om mense te motiveer om hierdie doel te
  help bereik.\\nAs gevolg van die feit dat die opkomende kerk besig is om \u2018n
  mensgemaakte koninkryk op aarde te vestig waarin almal in vrede en voorspoed saamleef,
  is hulle geheel en al teen \u2018n chiliastiese vertolking van Bybelse profesie\u00eb
  gekant. Die Bybelse scenario dat daar \u2018n groot geestelike afval in die laaste
  dae sal plaasvind, dat die ongelowige mensdom op \u2018n verdrukking onder die bewind
  van die Antichris afstuur, asook op die slag van Armageddon, is totaal met hulle
  toekomsverwagting van vrede op aarde in botsing. Hulle s\u00ea selfs dat dit \u2018n
  vermorsing van tyd is om op die tekens van die tye ag te slaan, en beskou mense
  wat \u2018n studie van profesie\u00eb oor die einde van die kerkbedeling maak, as
  negatief en selfgesentreerd. Rick Warren s\u00ea ook dat ons onsself nie met Bybelse
  profesie\u00eb moet bemoei nie. Hy gaan selfs verder en s\u00ea dat Christelike
  fundamentaliste \u2013 dit is mense wat alles letterlik glo wat in die Bybel staan
  \u2013 die grootste gevaar vir die opkomende kerk van die 21ste eeu is. Dit is duidelik
  dat antichiliastiese kerke en Christene natuurlike bondgenote en ondersteuners van
  die opkomende kerk is, en die valse koninkryksteologie daarvan sonder voorbehoud
  sal aanvaar.\\nGeorge Otis van die Sentinel-groep het tydens sy laaste besoek aan
  Suid-Afrika ges\u00ea dat ons reeds in hierdie bedeling \u2018n vervulling van die
  volgende versoek in die Onse Vader-gebed moet verwag: \u201cLaat u koninkryk kom;
  laat u wil geskied, soos in die hemel net so ook op die aarde\u201d (Matt. 6:10).
  Hy s\u00ea dat ons toestande soortgelyk aan di\u00e9 in die hemel moet verwag wanneer
  God se koninkryk oor ons neerdaal. Hy erken dat die duiwel vir baie misleiding en
  wanorde op aarde verantwoordelik is, maar het \u2018n uitgebreide stelsel van strategiese
  geestelike oorlog ontwerp om Satan se vestings te verbreek en van hom ontslae te
  raak. Alle pogings om dit te doen, het egter dusver misluk. Die w\u00eareld is steeds
  in die mag van die Bose (1 Joh. 5:19).\\nPeter Wagner van die World Prayer Center
  is ook van mening dat die duiwel se mag verbreek kan word en dat die w\u00eareld
  spoedig regeer sal word deur magtige apostels en profete wat aan die hoof van verenigde
  stadskerke staan. Hy noem die opkomende kerk die post-denominasionele kerk van die
  21ste eeu en s\u00ea dat wanneer Satan onttroon en die groot kerke gevestig is,
  dit baie moeilik vir enige persoon in s\u00f3 \u2018n stad sal wees om verlore te
  gaan. Hulle aanvaar geensins dat die w\u00eareld in die eindtyd slegter word en
  op die bewind van die Antichris afstuur nie.\\nn Ander God en \u2018n ander Christus\\nDie
  opkomende kerk se godsbegrip verskuif vinnig van \u2018n Bybelse Drie-eenheid af
  na die universele God van alle gelowe. Daar word nou algemeen beweer dat God Homself
  deur alle gelowe openbaar \u2013 nie net deur die Bybel, deur Jesus Christus en
  deur die Christelike kerk nie. Daar is ook \u2018n duidelike verskuiwing weg van
  monote\u00efsme af na panente\u00efsme. Die idee word dus nie meer gehuldig dat
  daar \u2018n persoonlike skeppergod is wat bokant sy skepping verhewe is nie, maar
  \u2018n onpersoonlike god wat in alles is \u2013 in alle mense en ook in die natuur.
  Dit beteken dat mense hom in hulleself kan ontdek en ook klein godjies word.\\n\u2018n
  Baie groot aanslag word ook op die Bybelse voorstelling van Christus gemaak. Alle
  pogings word aangewend om van Hom net \u2018n gewone mens te maak wat op \u2018n
  gelyke vlak met die leiers van ander gelowe is. Dit word gedoen deur sy maagdelike
  geboorte, sy liggaamlike opstanding uit die dood en sy hemelvaart te ontken. Op
  grond hiervan word die aanspraak dat Hy God is wat as mens geopenbaar is, verwerp.
  Hierdie valse siening word ook deur talle teolo\u00eb in Suid-Afrika gehuldig \u2013
  onder meer deur die leiers van die Nuwe Hervorming. Daar word algemeen deur hulle
  geredeneer dat Jesus net metafories opgestaan het en in die harte van sy dissipels
  voortleef.\\nEen van hierdie teolo\u00eb, prof. A. van Aarde van die Univ. van Pretoria,
  s\u00ea in \u2018n sy boek, Fatherless in Galilee, dat Jesus \u2018n buite-egtelike
  kind, sy moeder \u2018n prostituut en sy vader waarskynlik \u2018n Romeinse soldaat
  was. Dit word as rede aangevoer waarom Hy oor \u2018n hemelse Vader gefantaseer
  het. Die ontkenning van Jesus se opstanding word deur verskeie van die plaaslike
  teolo\u00eb ondersteun. Die meeste van hulle ontken ook die bestaan van die duiwel
  en die hel. \u2018n Besoekende teoloog van die Jesus Seminaar in die VSA, John Dominic
  Crossan, het in Pretoria ges\u00ea dat die kruisiging \u2018n transendentale daad
  van kindermishandeling was, en dat ons s\u00f3 \u2018n wrede God moet verwerp. Hy
  het ook ges\u00ea dat Jesus nie begrawe is nie en dat sy lyk deur wilde honde gevreet
  is. Crossan is n\u00e1 sy lesing lof toegeswaai en sy standpunte is deur verskeie
  plaaslike teolo\u00eb verkondig as deel van \u2018n nuwe hervorming in die teologie.\\nDie
  postmoderne dekonstruksie van die persoon van Jesus Christus word gedoen om Hom
  aan die beeld van die Antichris gelykvormig te maak. Dit is die einddoel waarop
  al die misleiding oor Jesus ingestel is. Hierdie proses gaan nog steeds voort: nadat
  Jesus van sy goddelike attribute gestroop is, word van Hom die kosmiese christus
  van alle gelowe gemaak. Dit is in pas met die siening dat God die God van alle gelowe
  is. De dekonstruksie van Christus gaan n\u00f3g verder, want in terme van die panente\u00efstiese
  siening van \u2018n onpersoonlike, mistiese God, word daar ook van die christusbewussyn
  as \u2018n vorm van innerlike verligting gepraat. Dit word met die Boeddha-bewussyn
  gelyk gestel. Omdat die opkomende kerk ontken dat daar \u2018n duiwel en \u2018n
  Antichris is, sal hulle die Antichris as die Christus aanvaar, omdat hy in baie
  opsigte met die beeld van hulle gedekonstrueerde Jesus sal ooreenstem.\\nOpenbaringskanaal\\nDie
  opkomende kerk word deur die toenemende verwerping van die Bybel as die foutloos
  ge\u00efnspireerde Woord van God gekenmerk. Die rede hiervoor is omdat hulle in
  die postmoderne denkwyse hulleself van die taal van dogma bevry. Eng, dogmatiese
  stellings word verwerp \u2013 nie net oor die attribute van God en Jesus Christus
  nie, maar ook moreel-etiese sake soos homoseksualiteit. S\u00f3 verloor die Skrif
  sy gesag, en word selfs die heilige boeke van ander gelowe ook as openbaringskanale
  van God aanvaar.\\nHierdie ingesteldheid het na \u2018n groot belangstelling in
  buite-Bybelse openbarings van God se wil gelei, wat hoofsaaklik misties van aard
  is. Die mistiek is \u2018n geestelike terrein wat niks met die Heilige Gees of met
  die ervaring van die Here se teenwoordigheid te doen het nie. Ons kan \u00f3f deur
  die Heilige Gees tot God se genadetroon nader, \u00f3f ons kan deur die beoefening
  van verskeie tegnieke mistiese, bonatuurlike ervarings h\u00ea. Wanneer mense d\u00edt
  doen, dan stel hulle hulself vir regstreekse be\u00efnvloeding deur die duiwel en
  sy bose geeste oop. Hy kom as \u2018n engel van die lig om aan hulle \u2018n valse
  vrede asook \u2018n valse godsdiensbelewenis te gee.\\nDie mees algemene tegniek
  om \u2018n mistiese of transtoestand te beleef, is transendentale meditasie. Dit
  is van Hindoe\u00efstiese oorsprong, maar word ook in verskeie ander heidense kulture
  aangetref. Sulke mense sit vir \u2018n kwartier of langer doodstil en dink aan niks
  nie. Om hulle te help om hulle gedagtes leeg te maak, herhaal hulle \u2018n enkele
  woord of \u2018n kort sinnetjie oor en oor. Die Hindoes noem dit \u2018n mantra,
  en gebruik gewoonlik die naam van een van hulle gode hiervoor. Christene wat hierdie
  heidense gebruik by die Bybel probeer aanpas het, gebruik selfs Jesus se naam as
  \u2018n mantra. N\u00e1 \u2018n ruk gaan s\u00f3 \u2018n persoon in \u2018n beswyming
  of soort hipnotiese toestand oor. Omdat hy doelbewus alle rasionele gedagtes afgesluit
  het, het hy geen nugtere oordeelsvermo\u00eb of beheer oor dit wat met hom gebeur
  nie. In hierdie alternatiewe bewussynstoestand hoor party mense stemme, sommiges
  kry ingewings oor wat hulle moet doen, terwyl ander net vrede ervaar en van al hulle
  stres verlig word. Alle mediteerders getuig daarvan dat konflik uit hulle gedagtes
  verdwyn omdat hulle alle dinge in \u2018n geheelverband sien. In hierdie holistiese
  denke is daar nie meer wesenlike verskille tussen godsdienste, politieke ideologie\u00eb
  en uiteenlopende lewenswyses nie, omdat alles onderdele van \u2018n groter geheel
  is. Hulle noem dit \u2018n kosmiese bewussyn.\\nChristene wat hierdie tegniek by
  die heidenw\u00eareld oorgeneem het, hou op om te bid en mediteer net. Hulle noem
  hierdie mistiese gebruik ook kontemplasie of sentreringsgebede. Selfs die humanistiese
  sielkunde het di\u00e9 tegniek oorgeneem en in wetenskaplike terme geklee. Hulle
  noem dit aandagsvernouing ter wille van bewussynsverdieping, en s\u00ea dat mense
  van stres bevry kan word as hulle tydens meditasie van hulle rasionele linkerbrein
  na hulle kreatiewe regterbrein oorskakel.\\nTydens hierdie mistiese belewenis ontmoet
  sommige mense geestelike gidse wat hulle na hulle kinderjare of selfs na hulle vorige
  lewe terugvoer sodat hulle ou konflikte en probleme kan verwerk en regstel. Die
  idee van re\u00efnkarnasie kom van die Hindoes af. Ander maak weer met die geeste
  van afgestorwenes kontak, en beoefen sodoende spiritisme. Daar is geen perke aan
  die okkultiese ervarings wat mense kan h\u00ea as hulle met heidense gebruike soos
  di\u00e9 eksperimenteer nie. Dit word vir hulle \u2018n selfverlossingsleer waardeur
  innerlike genesing bewerkstellig word. Op hierdie mistiese reis na binne ontdek
  hulle die god binne-in hulleself (the god within) wat nie die ware God van die hemel
  is nie, maar die god van hierdie w\u00eareld wat op die troon van alle ongeredde
  mense se harte sit.\\nMoenie deur selfinkering en \u2018n ydele herhaling van woorde
  na die mistiese vlakke van jou onderbewussyn probeer afdaal nie, want daardeur sal
  jy \u2018n poort vir be\u00efnvloeding deur \u2018n valse god skep. Daar is ook
  in Kaapstad \u2018n Sentrum vir Christelike Spiritualiteit waar baie mense geleer
  word om hierdie tegniek te beoefen. Hulle bied ook retraites op stil vakansie-oorde
  aan om mense te leer mediteer. Ander hulpmiddels wat gebruik word, is joga-ontspanningsoefeninge
  en die bewandeling van labirinte.\\nDaar is verskeie ander gebruike wat ook misties
  van aard is, en tot groot dwalings aanleiding kan gee. Hieronder is buite-Bybelse
  openbarings van God se wil deur die spreek in tale, asook deur drome en visioene.
  Daar word selfs kursusse aan mense gebied om hulle drome te interpreteer. \u2018n
  Mistiese gebruik wat baie gewild is, is val in die Gees. Mense raak in \u2018n beswyming
  en val plat op die vloer. \u2018n Vreemde gees verkry beheer oor hulle: sommiges
  lag onbeheerd en ander maak weer snaakse dieregeluide soos blaf, brul, kraai of
  bl\u00ear. Op grond van hierdie ervaring beskou sulke mense hulleself as gered of
  geheilig, terwyl hulle in die toestand van beswyming geen geloof kan beoefen nie
  \u2013 hulle het net \u2018n bedenklike ervaring gehad. Dit is alles kenmerke van
  die opkomende kerk van die 21ste eeu.\\nWat moet ons doen?\\nMeer as ooit tevore
  moet ons ag slaan op die Here se waarskuwings: \u201cPas op dat niemand julle mislei
  nie (Matt. 24:4); vlug vir valse leraars wat van die gesonde leer afwyk en fabels
  verkondig omdat hulle mense se gehoor wil streel (2 Tim. 4:3-4); toets die geeste
  of hulle uit God is, want baie valse profete het in die w\u00eareld uitgegaan (1
  Joh. 4:1); stry kragtig vir die geloof wat eenmaal aan die heiliges oorgelewer is
  (Judas 1:3); hou maar net vas wat jy het, totdat Ek kom. En aan hom wat oorwin en
  my werke tot die einde toe bewaar, sal Ek mag oor die nasies gee\u201d (Op. 2:25-26).
  Moet onder geen omstandighede deel van die eindtydse verval word nie: \u201cDie
  Gees s\u00ea uitdruklik dat in die laaste tye sommige van die geloof afvallig sal
  word en verleidende geeste en leringe van duiwels sal aanhang\u201d (1 Tim. 4:1).\\nIn
  die postmoderne denkklimaat van openheid vir ander oortuigings word die deur wyd
  vir \u2018n vreemde, multigodsdienstige belewenis oopgemaak. Dit is waarlik \u2018n
  tyd waarin die Christelike fondamente van die samelewing omver gewerp word. Die
  psalmis het ges\u00ea: \u201cAs die fondamente omgegooi word, wat kan die regverdige
  doen? \u2026 Die Here toets die regverdige; maar sy siel haat die goddelose en die
  wat geweld liefhet. Hy sal op die goddelose\u2026 vuur en swawel laat re\u00ebn\u201d
  (Ps. 11:3-6).\\nDie erg ontwrigtende omstandighede waarin ons verkeer, is volgens
  die Bybel \u2018n tyd van toetsing vir die regverdige. Die Here s\u00ea Hy gaan
  sy dorsvloer deur en deur skoonmaak, sodat Hy die koring in sy hemelse skuur kan
  saambring en die kaf met vuur verbrand\u201d (Luk. 3:17). Een van die min voordele
  van hierdie tyd van postmoderne dekonstruksie en verval is dat ons nie meer deur
  die tradisies en gebooie van mense gelei en gemanipuleer hoef te word nie (Matt.
  15:9). Elkeen moet nou wys waar hy of sy werklik staan \u2013 \u00f3f by die evangeliese
  Christendom \u00f3f by die vervallende maar verenigende w\u00eareld wat besig is
  om die weg vir die verskyning van die Antichris voor te berei. In \u2018n tyd soos
  di\u00e9 sal die hemelse Bruidegom sy bruid kom haal. Is u hiervoor gereed?\\nProf.
  Johan Malan\"", "\"Suid-Afrika verkeer steeds in \u0149 groot ekonomiese krisis.
  Die skade van dekades onder \u0149 ANC-regering en verkeerde beleidsrigtings sal
  nie oornag reggedokter kan word nie. Daar is wel \u0149 paar strale van hoop wat
  deur die donker wolk begin skyn.\\nUit vandag se mediumtermynbegrotingsraamwerk
  van die minister van finansies, mnr. Enoch Godongwana, wil dit voorkom of die blinde
  optimisme en vae beloftes van vorige jare plek gemaak het vir \u0149 meer pragmatiese
  beskouing van die land se ekonomiese en fiskale probleme en \u2018n klemverskuiwing
  na die privaatsektor wat gekoester moet word om die ekonomie te red.\\nDit blyk
  ook dat die regering van nasionale eenheid (RNE) hoop gebring het dat veranderinge
  wel moontlik is. Min. Godongwana het dit tereg \u0149 \u201cvars gevoel van hoop,
  energie en kameraadskap\u201d genoem.\\nDie harde realiteit bly dat die regering
  se skuldvlakke onvolhoubaar hoog is en dat daar selfs meer geleen sal moet word.
  Die begrotingstekort neem dus toe en vir elke rand belasting wat die staat in die
  huidige boekjaar invorder, gaan 22 sent aan die diens van skuld.\\nTeen 2025 sal
  die land se skuld sowat R6 biljoen (6 duisend miljard rand) beloop.\\nBelastinginvordering
  is stadiger as verwag weens ontoereikende ekonomiese groei.\\nPositiewe aspekte
  is dat die minister besef dat daar geprioritiseer moet word om \u0149 uitvoerbare
  en stabiele fiskale raamwerk daar te stel om groei te bewerkstellig. Ook dat die
  nodige strukturele hervormings daarvoor nodig is.\\nIn die verlede het die regering
  ook ges\u00ea wat nodig is vir ekonomiese groei. Die uitvoering van die planne het
  egter agterwe\u00eb gebly.\\nDie minister het vandag infrastruktuurontwikkeling
  soos watersuiweringsaanlegte tot prioriteit verklaar en daarmee saam vennootskappe
  met die privaat sektor om die ontwikkeling te laat realiseer.\\nDit is vir die VF
  Plus \u0149 positief en \u0149 verskuiwing van vorige beleidsrigtings. Met die huidige
  toestand en tekorte in kerninfrastruktuur kan die ekonomie nie ontwikkel nie.\\nDie
  feit dat die minister vir die eerste keer daadwerklike stappe aangekondig het om
  die staat se salarisrekening te verklein deur waarskynlik vervroegde aftreepakkette
  aan amptenare te bied wat nie noodsaaklike dienste verrig nie, dui op daadwerklike
  optrede.\\nDit is \u0149 goeie begin en die VF Plus sal deur sy deelname aan die
  RNE en met sy rol in die parlement toesien dat stappe geneem word om volhoubare
  ekonomiese groei te bewerkstellig tot voordeel van almal in die land.\"", "\"DOEN
  NOU AANSOEK VIR 2022!\\nKurrikulum:\\nDie kurrikulum wat ons volg is vir Graad R
  tot 3, wat deur die Departement voorgeskryf word. Deurlopende informele assessering
  word gedoen, sodat indien daar \u2018n probleem in \u2019n sekere Leerarea is, dit
  betyds ge\u00efdentifiseer en hanteer kan word- hetsy deur verwysings of ekstra
  hulp van die Opvoeder.\\nTye:\\nLeerders word ontvang vanaf 07:30 tot 07:55.\\nLeerders
  moet teen 07:45 by hul klas wees, ons begin reeds 07:55 met die dag se aktiwiteite.\\nOuers
  kan dus met \u2018n geruste hart werk toe gaan met die wete dat daar toesig is.\\nSkooltye
  is vanaf 07:55 tot 13:00.\\nLeerders moet stiptelik om 13:00 by die klein hekkie
  in Willetstraat afgehaal word.\\nVerpligtend:\\nAlhoewel Graad R nog nie as verpligtend
  deur die Onderwysdepartement ge\u00efmplementeer is nie, voel ons so sterk oor hierdie
  voorbereidingsjaar vir formele onderrig in Graad 1, dat ons dit as verpligtend hanteer.\\nOuderdom:\\nLeerders
  moet in hul Graad R jaar ses word, dit wil s\u00ea hul kan op vyf jaar reeds skool
  toe kom, maar moet in daardie spesifieke jaar ses word.\"", "\"Die eerste keer het
  A.J. Luna het aan die dood ontkom terwyl sy in Irak gedien het, dit was te danke
  aan ''n Marlboro -menthol.\\nDit was ''n warm dag, en sy eenheid was op pad van
  Bagdad na LSA Anaconda, ''n Irakse lugmagbasis ongeveer 40 kilometer noord. As deel
  van ''n kilometer lange konvooi bewegende voertuie het hulle miljoene dollars se
  voorraad op ''n paar van die gevaarlikste paaie ter w\u00eareld vervoer.\\nNa ure
  se reis was Luna lus vir ''n rokie. Toe hulle stop, versoek hy ''n kort pouse voordat
  hy terugkeer na sy uitkykposisie bo -op die tenk. Hy gaan sak vir ''n sigaret en
  voel hoe die voertuig in rat sit. ''Ons het begin beweeg,'' s\u00ea hy, ''en dan''
  boom ''. Hy sien puin bo die voertuig vlieg, terwyl sommige selfs in die tenk se
  romp neerspring tot waar hy was.\\n''Al wat ek kan onthou, is net om die flits te
  sien en hoe hard die ontploffing was,'' s\u00ea hy. ''S\u00ea vir my dat dit nie
  die geluk van die Iere is nie.''\\nLuna het 11 maande en drie weke in Irak gedien
  as lid van die 95ste Milit\u00eare Polisiebataljon, in die tweede golf van Operasie
  Iraqi Freedom II. Gedurende daardie jaar in 2004 loop hy ''n strop van gevaar. Alhoewel
  Luna nie in ''n direkte gevegsrol ontplooi is nie - hy het konvooi -kommunikasie
  en logistiek bestuur - illustreer sy ervaring die aansienlike fisiese gevare en
  geestelike spanning wat inherent is aan sulke ondersteuningsposisies. Bomme kan
  afgaan, skerpskutters kan u kant toe rig, ongelukke kan plaasvind. Nabye oproepe
  is volop. Maar deur dit alles, s\u00ea hy, moes u aanhou beweeg en bly waaksaam
  oor skofte van 18 uur wat byna geheel en al deur Red Bull aangevuur word. En, s\u00ea
  hy, u moes u span beskerm asof dit u gesin was, hoe anders dit ook al sou lyk.\\nKlik
  hier vir die werklike Irak -oorlogsverhaal agter American Sniper.\\nDie toevalligheid
  van die dood\\nDie tweede keer dat Luna aan die dood ontkom het, was dit die gevolg
  van ''n ewekansige oorskakeling. Normaalweg, het hy ges\u00ea, het hy as ''n loodgeweerwa
  gereis, maar daardie aand het sy kollega Morciglio aangebied om te ruil en ges\u00ea:
  ''Julle vat die middel, my trok sal die leiding neem.''\\nDit moes ''n heeltemal
  onbeduidende ruil gewees het, maar die voorste voertuig is deur ''n ge\u00efmproviseerde
  ploftoestel getref. Luna onthou hoe sy die lig van verder agter in die konvooi sien
  flits het. ''Ek was die middelste vragmotor, en ek is gewoonlik die voorste vragmotor.''
  Hy voel nou nog skuldig daaroor: \u201cJy kan alles doen wat jy kan, maar dinge
  gebeur. En dit is wat jy probeer om jou kop om te draai, maar jy verstaan nie hoekom
  nie. \u201d\\nDaar was ''n slagoffer enkele dae voor sy eenheid se aankoms by Camp
  Scania, ''n tentstad ''n paar dosyn myl suid van Bagdad. Ure voordat die vertrekkende
  eenheid sou vertrek, het ''n soldaat in die tou by die Posbeurs by die basis gewag
  toe hy deur ''n mortierronde getref en vermoor is. ''As dit u nie vertel hoe broos
  hierdie ding is nie, kan niks u vertel nie,'' s\u00ea Luna.\\nGedurende Luna se
  tyd in Irak het die man se dood swaar in sy verbeelding gehang. In Korea, waar hy
  ''n paar jaar tevore as ''n kabelstelsel-installeerder gedien het as deel van ''n
  veldartillerie-eenheid, het hy die dae afgetel totdat hy by die huis gekom het.
  Hier het hy dit dag vir dag geneem, nooit seker of sy geluk beter sou wees as di\u00e9
  van die man wat voor hom gekom het nie. ''Totdat ek by die McGuire -lugmagbasis
  is, totdat ons die grond raak en ons dit ruik, is dit nie verby nie.''\\nNa byna
  ''n jaar op die koord in Irak, het Luna die besluit geneem om weg te gaan van die
  weermag. In ses jaar het dit hom ''n opvoeding, ''n gevoel van self en ''n doel
  gegee. Maar toe ''n goeie vriend sterf onder omstandighede wat Luna as onnodig beskou
  het, het hy geweet dat dit tyd was om aan te gaan. ''Op daardie stadium,'' s\u00ea
  hy, ''het ek vir myself ges\u00ea:'' Weet u wat, ek het alles gegee wat ek kon gee,
  alles wat ek wil gee. ''\\nVandag woon Luna in Bergen County, New Jersey, waar hy
  as direkteur van veteraandienste in die land werk. Dit is ''n werk wat hy baie lonend
  vind - ''n geleentheid om terug te gee aan sy gemeenskap en meer as 30 000 veterane
  te verbind met dienste wat hulle dalk nie weet bestaan nie.\\nOproep na Irak\\nIn
  Desember 2003, toe Luna die oproep gekry het om na Irak te gaan, was hy ''n 24-jarige
  universiteitstudent aan Brooklyn College in New York. Nadat hy op 18 aangesluit
  het en tyd in Duitsland en Suid -Korea deurgebring het, het hy na die VSA teruggekeer
  om sy opleiding te bevorder terwyl hy as lid van die National Guard gedien het.
  Hy het pas sy laaste universiteitsfinaal vir die semester klaargemaak toe sy sersant
  bel en vir hom s\u00ea om sy goedjies bymekaar te maak. Hulle was oorsee, het hy
  aan Luna ges\u00ea. ''Op my tipiese manier in New York,'' onthou hy, ''het ek ges\u00ea:''
  Kan u ''n bietjie meer spesifiek wees? Oorsee is ''n redelike groot plek. ''Hy het
  ges\u00ea:'' Ons gaan waarskynlik die operasie Iraqi Freedom ondersteun ''.\\nLuna
  het Kersfees tuis saam met sy gesin deurgebring. Hy het hulle aanges\u00ea om hom
  in hulle gebede te hou - sy ma is ''n metodiste -predikant - maar om hom so min
  as moontlik oor hom te bekommer. ''Ek het ges\u00ea:'' Moenie toelaat dat dit u
  gedagtes oorneem nie. ''\\nDaar is ''n grap in die weermag dat LP, soos milit\u00eare
  polisie bekend staan, vir veeldoelige dinge staan. Volgens Luna het hulle eintlik
  \u201calles gedoen wat die weermag nodig gehad het\u201d. Irak was ''n woestynoorlog,
  waar gevegte gevoer is op paaie wat omring is met handpalms en wat deur ontploffings
  gemerk is. Luna se span was nodig op die paaie - om eenhede te beskerm, vragmotors
  te bestuur en voorraad te lei na waar hulle moes wees. ''Dit maak nie saak wat u
  rol was toe u daar was nie,'' s\u00ea Luna. ''As u in die land was, was u aan gevaar
  blootgestel.''\\nVir elke gevegsoldaat, s\u00ea Luna, is daar moontlik 15 mense
  in ondersteuningsrolle soos hierdie, wat werk oor die verskaffingskettingbestuur,
  instandhouding, vervoer, gesondheidsdienste en enigiets anders wat lugvaart- of
  grondgevegsmagte nodig het om hul werk te verrig . Ondanks die naam was hulle goed
  binne die vuurlyn: Jessica Lynch, die eerste vroulike Amerikaanse krygsgevangene,
  was deel van die Quartermaster Corps, wat help om brandstof, voedsel en ander dienste
  te verskaf.\\nMilit\u00eare polisie is een van die gevaarlikste van hierdie posisies.\\nDie
  uitdagings om ''n eenheid te word\\nBaie lede van die New Guard in New York, wat
  by Luna moes aangesluit het, kon nie na Irak kom nie, het hy ges\u00ea, met verwysing
  na persoonlike noodgevalle of gesondheidsprobleme. Dus, toe hulle nie daarin geslaag
  het om twee kompanies te vul met mense uit die metropolitaanse gebied nie, het die
  weermag soldate van regoor die staat bymekaargemaak, uit baie verskillende agtergronde
  en omstandighede.\\nLuna het grootgeword in Oos -New York, ''n gebied in Brooklyn
  met ''n paar van die hoogste misdaadsyfers in die stad, na ''n ma uit die Dominikaanse
  Republiek en ''n pa uit Argentini\u00eb. Sy woonbuurt was uiteenlopend en werkersklas
  - ''n plek waar jy waaksaam, liberaal en straatsmart grootword. In Irak het hy egter
  saam met lede van die NYPD gedien, mans uit die platteland van New York, \\\"afwykings\\\"
  van Buffalo en mense met ''n radikaal ander politieke uitkyk as sy eie. Aanvanklik
  was daar baie kulturele botsings. ''Ons moes daarmee inskakel,'' onthou hy, ''en
  dit het ''n rukkie geneem.''\\nWat egter gehelp het, was ''n geleidelike besef dat
  hulle meer gemeen het as wat hulle dit verdeel het. \\\"Almal het ''n gesin, almal
  wil goed doen vir hul gesin, almal wil ''n geleentheid h\u00ea,\\\" s\u00ea Luna.
  ''Dit is universele beginsels - wie gee om uit watter streek u kom?'' Onder hul
  eerste sersant, ''n \\\"infanterie -ou\\\" met baie vaste idees oor wat hulle moes
  doen, werk hulle deur die probleme en raak uiteindelik nader as wat hulle kon gewees
  het as hulle altyd oor die weg gekom het.\\n\\\"Dit was een van die redes wat ons
  gehelp het om baie dinge te oorleef wat ons oorleef het,\\\" onthou Luna. Terwyl
  die eenheid voor hulle sewe of agt slagoffers gehad het, en die een wat hulle vervang
  het, in die eerste drie weke ''n ongeval gehad het, het slegs een lid van Luna se
  span dit nie reggekry nie. Van die begin af, s\u00ea hy, het hul sersant hulle geboor
  met een boodskap: Niemand in die span moet onnodig sterf nie. Sommige dinge was
  groter as politiek. ''Dit gaan nie gebeur nie, want ons was sorgeloos,'' het Luna
  ges\u00ea. ''Dit was die soort houding wat ons moes h\u00ea.''\\nDie angel van ''n
  toevallige dood\\nUiteindelik was dit egter ''n daad van sorgeloosheid wat Luna
  laat besluit het dat hy sy rol in die weermag se masjien gespeel het - en nou was
  dit tyd om uit te klim, voordat sy geluk opraak.\\nToe hulle die moeilike oorgang
  van dag na nag missies maak, het baie van die ouer manne in hul span die kans nodig
  gehad om by ''n nuwe skedule aan te pas en te herstel. Selfs vir Luna, toe 25, was
  dit ''n uitdagende skakelaar. Maar die bevel wou h\u00ea dat ''n span van drie mans,
  elk 40 jaar oud, die aand moet vertrek sonder ''n pouse of geleentheid om weer te
  kalibreer. Een van hulle was ''n goeie vriend. Luna onthou dat hy die aand met hom
  gepraat het, voordat hy uitgegaan het. Hulle terugkeer huis toe na Brooklyn was
  op hande, en hulle bespreek al die dinge wat hulle wou doen toe hulle terugkom.\\nDaardie
  aand was daar ''n omvalongeluk. Dit lyk asof die bestuurder in ''n oomblik van uitputting
  op sy skof van 18 uur flou geword het. Toe hulle ''n versperring tref, het die voertuig
  gerol. Luna se vriend, die skieter, is op slag dood. Luna was buite homself van
  hartseer - dat hulle so ver in die toer was en dat sy vriend om so ''n dom rede
  gesterf het. ''Ek is bitter daaroor,'' s\u00ea hy. ''Ek dink dat hy onnodig gesterf
  het - hy hoef nie te sterf nie.'' Sy vriend se seun was op die eerste toer en het
  dit oorleef; nou, sy pa sou nie huis toe kom nie.\\nToe hulle by die huis kom, s\u00ea
  Luna, was sy hart nie meer daarin soos dit eens was nie. Hy kon nie dieselfde kans
  waag nie. By die huis in Brooklyn het sy gesin angstig op sy aankoms gewag; tydens
  sy ontplooiing het sy broer gereeld die lys van die slagoffers aanlyn opgesoek en
  na Luna se naam gesoek. Nou, dit was tyd om terug te gaan na hulle.\\nAanpas by
  die tuisfront\\nDie volgende paar jaar het Luna hom gedwing om die universiteitsgraad
  te voltooi wat hy onderbreek het toe sy sersant bel. Terwyl hy by sy terugkeer by
  die Brooklyn College-CUNY klasgegee het, het hy probeer om die omvang van die dinge
  wat hy gesien en beleef het, te verwerk met hulp van ''n terapeut op die kampus.
  Sommige dinge was maklik - soos om te kniel en soveel papiere te doen as wat hy
  kon. Ander, soos om met die metro te ry, het pynlike herinneringe teruggebring.
  In die jare daarna verhuis hy uit die stad, na die rustiger voorstede van Bergen
  County, N.J.\\nUiteindelik werk Luna saam met veteraandienste - eers aan CUNY en
  later aan die Fairleigh Dickinson College, waar hy sy meestersgraad voltooi het.
  Hy onthou hoe hy mense ontmoet het wat lewens gered het, maar baie bang was vir
  universiteitskursusse; of mense wat ''n ongestruktureerde universiteitstelsel gevind
  het nadat hulle in die weermagomgewing was wat baie regimenteer was. In beide gevalle
  het Luna hulle gewys waarheen hulle moet gaan.\\nNou woon hy saam met sy vrou en
  hul twee jong dogters in New Jersey. In drie en ''n half jaar in die rol, het hy
  Bergen gehelp om die eerste graafskap in New Jersey te word om veterane haweloosheid
  uit te skakel. Luna se kantoor is bederf met sertifikate, waarderingsnotas en foto''s
  van sy gesin.\\nBuite sy deur staan ''n afgedrukte bordjie \\\"Ek wens dit was so
  maklik om gewig te verloor as om my verstand te verloor!\\\" Dit was sy mees onlangse
  persoonlike uitdaging, s\u00ea hy-terwyl hy praat, drink hy uit ''n plastiekbottel
  kersierooi Crystal Light. In ''n professionele konteks waar hy nie meer daagliks
  die dood omseil nie, s\u00ea hy, is dit die minste wat hy kan doen. ''Ek het twee
  kleintjies waarvoor ek moet wees, so ek doen dit vir hulle.''\\nAlgemene veiligheids-
  en verdedigingsbeleid\\nDie Algemene veiligheids- en verdedigingsbeleid (CSDP) is
  die optrede van die Europese Unie (EU) op die gebied van verdediging en krisisbestuur,
  en ''n hoofkomponent van die EU se gemeenskaplike buitelandse en veiligheidsbeleid
  (GBVB).\\nDie GOSDB behels die implementering van milit\u00eare of burgerlike missies
  om vrede te bewaar, konflik te voorkom en internasionale veiligheid te versterk
  in ooreenstemming met die beginsels van die Verenigde Nasies se Handves. Milit\u00eare
  missies word uitgevoer deur EU -magte wat gevestig is met afdelings van die lidstate
  se gewapende magte. Die GOSDP behels ook kollektiewe selfverdediging tussen lidlande
  [a] sowel as ''n permanente gestruktureerde samewerking (PESCO) waarin 25 van die
  27 nasionale weermagte strukturele integrasie nastreef. Die SSBO -struktuur - onder
  leiding van die Unie se ho\u00eb verteenwoordiger (HR/VP), Josep Borrell, en soms
  na verwys as die Europese Verdedigingsunie (EDU) met betrekking tot sy voornemende
  ontwikkeling as die EU se verdedigingsarm [4] [5] [6] [b] - bestaan uit:\\n- die
  direktoraat-generaal van die verdedigingsbedryf van die Europese Kommissie\\n- die
  Direktoraat Krisisbestuur en Beplanning (CMPD) van die External Action Service (EDEO)
  en permanente operasionele hoofkwartier (OHQ''s) vir bevel en beheer (C2) op milit\u00eare/burgerlike
  strategiese vlak, dit wil s\u00ea die MPCC en CPCC.\\n- ''n aantal voorbereidende
  liggame van die Raad vir Buitelandse Sake (FAC) - soos die Milit\u00eare Komitee
  (EUMC)\\n- vier agentskappe, waaronder die Defense Agency (EDA)\\nDie bevel- en
  beheerstrukture van die EU is baie kleiner as die opdragstruktuur van die Noord
  -Atlantiese Verdragsorganisasie (NAVO), wat vir territoriale verdediging ingestel
  is. Daar is ooreengekom dat die Navo se geallieerde beveloperasies (ACO) gebruik
  mag word vir die uitvoering van die EU -missies. Die MPCC, wat in 2017 gestig is
  en in 2020 versterk moet word, is die eerste permanente milit\u00eare OHQ van die
  EU. Terselfdertyd is die nuutgestigte Europese Verdedigingsfonds (EDF) die eerste
  keer dat die EU -begroting gebruik word om multinasionale verdedigingsprojekte te
  finansier.\\nBesluite rakende die GOSDB word voorgestel deur die HR/VP, deur die
  FAC aangeneem, wat in die algemeen eenparigheid vereis, en dan deur die HR/VP ge\u00efmplementeer.\\nDeur
  ons u e -posadres te gee, meld u aan by die Early Bird Brief.\\nTidd het ''n verskil
  opgemerk met hoe China probeer het om invloed in die streek te verkry. Baie van
  sy optrede het, net soos in ander dele van die w\u00eareld, veral Afrika, gekom
  deur ekonomiese transaksies wat met behulp van finansi\u00eble steun groot hoeveelhede
  natuurlike hulpbronne probeer onttrek, dikwels teen ''n lang termyn.\\n''Daar is
  geen langtermynvoordele uit China-transaksies nie,'' het Tidd aan die gehoor ges\u00ea.
  \\\"China gebruik ekonomiese staatskaping en meer gewetenlose middele soos omkoopgeld
  om Latyns -Amerika in sy wentelbaan te trek.\\\"\\n2. Terroriste groepe samel geld
  in ons agterplaas in.\\nHezbollah werk al dekades lank in Latyns -Amerika en benut
  korrupsie om geld in te samel vir terreuroperasies in die Midde -Ooste.\\n''Hezbollah
  was al lank daar,'' het Tidd ges\u00ea. Hy het terreuraanvalle in die 1990''s in
  Argentini\u00eb opgemerk. Alhoewel ISIS en al-Qaida opskrifte kry vir hul optrede
  elders, het Tidd ges\u00ea dat Hezbollah die ''A'' span vir terroristebewegings
  is. Hulle het \u201cgrootskaalse kriminele aktiwiteite gebruik om terrorisme in
  ander dele van die w\u00eareld te finansier\u201d.\\nMaar net omdat hierdie aktiwiteite
  nou gefokus is op fondsinsameling, beteken dit nie dat die groepe nie kan oorgaan
  na meer direkte, dodelike optrede nie. ''As Iran verkies om voordeel te trek uit
  gevolmagtigdes om uit te skakel. ons kan nie die fout maak om te dink dat dit slegs
  in die Midde -Ooste sal gebeur nie. Net soos ons nie kan dink dat Rusland slegs
  in Europa en China in die Suid -Chinese See sal deelneem nie. \u201d\\n/> VS. Kurt
  W. Tidd, hoof van die vloot, is die hoof van die Amerikaanse suidelike kommando,
  wat toesig hou oor byna die hele Latyns-Amerika en werk van teenmedisyne tot humanit\u00eare
  sorg tot by die Panamakanaal. (Vloot)3. Terroriste werwing en aanvalle vind plaas
  in die Karibiese Eilande.\\nVroe\u00ebr vanjaar het Amerikaanse milit\u00eare personeel
  van Tidd se bevel deelgeneem aan aanvalle teen terreur in die klein eilandnasie
  Trinidad en Tobago, maar nie in direkte geveg nie. In ''n verslag wat verlede jaar
  deur die Soufan -groep opgestel is, word geraam dat 130 mense uit Trinidad na Irak
  of Siri\u00eb gereis het om by die geveg aan te sluit. Een daarvan was die boksende
  hoopvolle Tariq Abdul Haqq, ''n medaljewenner van die Statebondspele en ''n Olimpiese
  hoop, so onlangs as 2013, voordat hy by die terreurgroep aangesluit het en in die
  geveg gedood is.\\nTidd het die land se regering uitgestel om die grootte van die
  terreurselle in die land te kwantifiseer. Maar hy het wel gewys op die erkenning
  van Trinidad en Tobago van ''n groeiende probleem en die gebruik van Amerikaanse
  bates om sulke bedreigings beter te identifiseer en op te lei.\\n4. SOUTHCOM het
  die verantwoordelikheid vir een van die belangrikste vervoerpunte ter w\u00eareld,
  die Panamakanaal.\\nTerwyl ''n groot deel van die Amerikaanse milit\u00eare teenwoordigheid
  in Latyns-Amerika fokus op humanit\u00eare hulp, soos reaksies op orkane en ander
  natuurrampe, bly veiligheidsbedreigings van ho\u00ebr orde. Die Panamakanaal is
  ''n groot bekommernis oor die veiligheid, soveel so dat die grootste milit\u00eare
  oefening wat in SUIDCOM gehou word, gefokus is op die beskerming van die lewensbelangrike
  vaartuig.\\nVerlede jaar se PANAMAX -oefening het 16 vennootlande laat oefen om
  die kanaal teen aanvalle te verdedig.\\nTidd het opgemerk dat hierdie jaar se oefening
  die derde agtereenvolgende jaar sal wees.\\n5. Die Siriese vlugtelingkrisis is nie
  die enigste sodanige krisis wat streekseffekte het nie. Kyk net na Venezuela.\\nAan
  die voorkant van die admiraal en gereeld op die top van sy Twitter -plasings is
  die vlugtelingkrisis waarmee baie lande te kampe het as gevolg van die voortdurende
  uittog van Venezolane weens hiperinflasie, ekonomiese ineenstorting, die hoogtes
  van misdaad en skynheilige verkiesings.\\n''Dit is ''n humanit\u00eare ramp van
  byna monumentale omvang,'' het Tidd ges\u00ea. Na raming het 4 miljoen Venezolane
  na Colombia, Brasili\u00eb, Argentini\u00eb, Chili en ander lande gevlug. Die krisis
  is besig om die geraamde 5,5 miljoen vlugtelinge wat uit oorloggeteisterde Siri\u00eb
  gevlug het, te oorskry.\\nNog ''n tweede-orde-effek wat die vlugtelingkrisis het,
  is die pogings van Colombia om FARC-lede te herintegreer na ''n suksesvolle vredesverdrag
  met die linkse guerrilla, wat dekades lank die Colombiaanse regering geteister het.\\nDie
  instroming van na raming 1 miljoen Venezolane in Colombia is besig om die land se
  hulpbronne op te eet en sy leiers te dwing om te kies tussen die hulp van die vlugtelinge
  of om aan die vereistes van die FARC -ooreenkoms te voldoen.\\nDie krisis het ''n
  ''geweldige impak'' op die vermo\u00eb van Colombia om FARC te herintegreer, het
  Tidd ges\u00ea.\\nOor Todd South\\nTodd South het sedert 2004 vir verskeie publikasies
  oor misdaad, howe, die regering en die weermag geskryf en is aangewys as ''n 2014
  Pulitzer-finalis vir ''n mede-geskrewe projek oor getuie-intimidasie. Todd is ''n
  mariene veteraan van die Irak -oorlog.\\nMis van die oorlog\\nEen van die moeilikste
  uitdagings wat verband hou met die gebruik van PMC''s, is die kwessie van toesig
  en deursigtigheid.Kwessies van wanbestuur kan wissel van finansi\u00eble verkwisting
  tot ernstige ongevalle. Terwyl milit\u00eare beamptes die optrede van milit\u00eare
  personeel en regeringsburgers beheer, is hul beheer oor individuele kontrakteurspersoneel
  minder duidelik. Milit\u00eare personeel is strafbaar as hulle ''n bevel nie gehoorsaam
  nie, terwyl die verantwoordelikhede van kontrakteurs in ''n vaste skriftelike kontrak
  bepaal word.\\nDie gebrek aan deursigtigheid wat verband hou met die gebruik van
  PMC''s, raak die probleem van toesig. PMC -kontrakte is nie onderhewig aan die versoek
  van die Freedom of Information Act om die vertroulikheid van die bedrywighede te
  handhaaf nie, maar hierdie praktyk verbied in wese die toegang van die publiek tot
  belangrike data, soos die aantal ongevalle. Sonder ''n duidelike opdragketting in
  plek of publiek, en met weinig aanspreeklikheid teenoor die publiek, ontwrig die
  huidige vlak van regulasies wat PMC''s plaas, die doeltreffendheid van Amerikaanse
  operasies en daag die huidige standaard van openbare vertroue in die Amerikaanse
  weermag uit.\\nSpesiale bedryfsvooruitsigte 2019 se digitale uitgawe is hier!\\nMilit\u00eare
  vragmotors word van die neushelling van ''n C-5A Galaxy-vervoervliegtuig van die
  Amerikaanse lugmagreservaat, Military Airlift Command, afgelaai ter ondersteuning
  van Operation Desert Shield. DoD foto.\\nToe die eerste valskermsoldate van die
  82ste lugafdeling die grond in Saoedi-Arabi\u00eb tref, was die eerste ding wat
  hulle opgemerk het die hitte, die onverbiddelike hitte van 120 grade. Daar was min
  of geen skuiling teen die skroeiende son nie, en die humiditeit het in die skaduwee
  nie veel beter gevoel nie - dit wil s\u00ea vir diegene wat ''n boom, tent of dak
  gevind het om onder weg te kruip.\\nDan was daar die sand, die fyn, korrelrige sand
  wat in ''n ligte wind in hul o\u00eb, ore en mond sou waai en, as dit mettertyd
  onbewaak gelaat word, byna elke voertuig, wapen of masjinerie wat hulle vertrou,
  sou verstop. op. Daar was min of geen lopende water, baie minder genoeg drinkwater,
  en voedsel was basies beperk tot vaal etes, gereed om te eet (MRE''s). Tente en
  beddens was op die minimum.\\nSlaap was nie maklik nie, want ten minste 360 000
  swaar gewapende Irakse soldate was besig om na die noorde te kom en dreig om op
  enige oomblik aan te val. Agt dae voor die Irakse indringers Kuwait binnegestorm
  het, het hulle vinnig die olie-ryk emiraat oorval en paniekgolwe deur die hele Saoedi-Arabi\u00eb
  gestuur, wat so kwesbaar was, en Saoedi-koning Fahd het gou aanvaar dat president
  George Bush \u2019s die Amerikaanse troepe stuur om die Islamitiese heiligdom te
  beskerm land.\\nDit was die omstandighede op 10 Augustus 1990, toe generaal -majoor
  William \\\"Gus\\\" Pagonis van die weermag by die King Abdul Aziz -vliegbasis in
  Dhahran, Saoedi -Arabi\u00eb, beland het. Met vier handgekose logistici (nog 18
  kom 15 Augustus aan), wou Pagonis ''n mate van orde skep tussen die 4 000 soldate
  en tonne toerusting wat uit C-5 en C-141 vragstrale begin stort het en op die stoof
  kom. soos teerpad elke dag.\\n''Daar was oral skares mense wat op soek was na iemand
  om die leiding te neem ... en ek het die leiding geneem,'' het Pagonis ges\u00ea
  oor die eerste chaotiese dae in die teater. ''As die Irakezen ons aanval, sou ons
  na Bahrein gaan en die weg blaas.''\\nDie improvisasie wat die handelsmerk van die
  Golfoorlog -logistiek geword het, het onmiddellik begin om te oorleef. Omdat hy
  die eerste paar weke aan die agterkant van ''n Chevrolet Blazer geslaap en gewerk
  het weens ''n gebrek aan bouruimte, het Pagonis ''n privaat opdrag gegee om die
  pligte van ''n bevelvoerder te verrig om te verseker dat almal genoeg water en woestynuniforms
  het, plus gasmaskers en chemikalie\u00eb beskermingspakke. Hy het die goue eikehoutblare
  van ''n majoor op ''n lasbriefoffisier vasgesteek, sodat die soldaat beter reaksies
  kon kry om fasiliteite, goedere en mannekrag te beveilig deur statusgerigte Saoedi''s.
  En hy het begin jaag en met plaaslike kontrakteurs omgegaan om vars voedsel, behuising,
  brandstof, voertuie, vurkhysers stadig maar seker te bekom - alles wat die vinnige
  ontplooiing van die 82ste, die 101ste lugafdeling (Air Assault), die First Marine
  sou vergemaklik of bespoedig. Ekspedisiemag en ander vroe\u00eb aankomste.\\nPagonis
  is inderhaas na Saoedi gestuur om die hoof van ''n ad-hoc-bevel te wees, ''n uitrusting
  wat teen Desember as die 22ste ondersteuningsopdrag aangewys is. Die 22ste het nie
  net die massiewe Amerikaanse opbou gevorm nie, dit het uiteindelik gehelp om die
  \\\"linkerhaak\\\" te orkestreer wat uiteindelik die Irakse magte uit Koeweit verdryf
  het. Tydens Operations Desert Shield en Desert Storm (insluitend die onttrekking),
  sou die 22ste SUPCOM en sy voorgangers toesig hou oor bewegings van reusagtige hoeveelhede
  troepe en materiaal, wat ten minste 350 000 soldate en 7 miljoen ton voorraad verwerk.\\nBehalwe
  vir die mariniers, lugmag en vloot, wat die meeste van hul eie logistiek versorg
  het, het byna alles wat die teater binnekom (en vertrek) deur Pagonis en sy logistieke
  personeel gegaan. Hulle het 170 000 voertuie, waaronder 12 000 gepantserde, en 12,575
  vliegtuie, insluitend 2 000 helikopters, hanteer, met baie van die tenks en gepantserde
  voertuie wat woestynbruin geverf moes word en met beter toerusting toegerus was.
  Minstens 52 miljoen maaltye is bedien, insluitend tot twee warm maaltye per dag
  vir die meer gelukkig soldate, mariniers en vlie\u00ebniers. En minstens 32 000
  ton pos is afgelewer, met 31 000 ton meer huis toe gestuur. Omdat vervoer noodsaaklik
  was in die uitgestrekte gebied van Saoedi -Arabi\u00eb, wat ongeveer die grootte
  van die Verenigde State oos van die Mississippirivier is, het Pagonis en sy bevel
  gesorg dat 52 miljoen myl gery en 1,3 miljard liter brandstof gepomp moes word.
  Die logistieke prestasies was, volgens die woorde van genl H. Norman Schwarzkopf,
  bevelvoerder van koalisiemagte, \\\"''n absoluut reuse -prestasie.\\\"\\n''N Hyskraan
  lig ''n M1A1 Abrams -hoofgeestenk uit die Ready Reserve Force -vragskip Cape Mendocino
  by ''n pier in die Persiese Golf tydens Operation Desert Shield. DoD -foto deur
  Spec. Samuel Henry.\\nLogistiek het die historiese opbou en die weswaartse flankbeweging
  moontlik gemaak, en omdat doktrine toe ''n Koue Oorlog -taktiek van ''n Europese
  oorlog teen Sowjet -magte vereis het, is baie ruimte gebied om nuwe taktieke te
  ontwerp wat pas by die toestande van die Persiese Golf. Om mee te begin, het Schwarzkopf
  Pagonis aangewys as die enigste kontakpunt vir logistiek, sodat die dienste nie
  sou meeding om skaars hulpbronne of voorraad nie. Tweedens, en miskien die belangrikste,
  het Pagonis ''n reeks houtbase of voorraaddepots bedink wat strategies langs die
  voorkant geplaas sou word, in plaas van ver agter die gevegsmagte te plaas, soos
  tradisioneel gedoen.\\n''Die grootste probleem was om beperkte hulpbronne op gelyke
  basis aan almal te kry,'' het Pagonis ges\u00ea. ''Leer sal nie [alleen] werk nie.
  Om logistiek as ''n konsep aan te pas, is regtig die regte pad. \\\"\\nNa die eerste
  paar chaotiese weke, waarin bevelvoerders moes fokus op die basiese beginsels soos
  veiligheid, kos, water, skuiling, storte en latrines, kon Pagonis en sy immergroeiende
  personeel uiteindelik begin om die planne wat hulle opgestel het, op te stel terwyl
  hulle op die C ry. -141 Starlifter van die Verenigde State. Die implementering,
  het hulle tot die gevolgtrekking gekom, sou in vyf logistieke fases verdeel word:\\n\u2022
  Fase Alpha, wat gefokus was op voorbereiding en voorsetsel, basies die verskaffing
  en verdediging van vroe\u00eb aankomste, en om te verseker dat hulle in die aanvallende
  modus kan oorgaan indien nodig.\\n\u2022 Fase Bravo, wat konsentreer op die beweging
  van die twee Amerikaanse weermagkorps en hulle help om ''n verdedigende houding
  aan te neem.\\n\u2022 Fase Charlie, wat daarop gemik was om ''n massiewe grondaanval
  te onderhou, ''n scenario wat waarskynlik onvoorspelbare verskuiwings in die lyne
  sou meebring en vereis uiterste buigsaamheid in logistiek.\\n\u2022 Fase Delta,
  wat alle logistieke behoeftes vir die verdediging van oorloggeteisterde Koeweit
  ge\u00ebis het nadat Irakse magte verdryf is.\\n\u2022 Phase Echo, wat ''n beroep
  op die herontplooiing van alle Amerikaanse troepe, toerusting en voorrade betyds
  gedoen het, ''n skrikwekkende taak om te verseker dat geen ammunisie of ander materiaal
  agterbly nie.\\n''N Belangrike deel van alle fases van die algehele logistieke plan
  was om maksimum buigsaamheid moontlik te maak. Prosedures en beleide is in sommige
  gevalle, veral in die vroe\u00eb dae van die ontplooiing, ter plaatse opgemaak.
  Pagonis en sy personeel organiseer die vloei van toerusting van 65 hawens w\u00eareldwyd
  na twee Saoedi -hawens, en vervoer die VII Corps tot 330 myl en die XVIII Airborne
  Corps tot 550 myl na die voorkant. Hulle het dit betyds gemaak, sodat skepe hul
  vragte afgelewer het en vertrek het sonder om kwesbaar in die hawens te vertoef.
  As daar rugsteun is, sal personeel van Pagonis \u2019 beveel dat skepe op see moet
  vertraag. Teen November, toe die VII-korps in Saoedi begin aankom, het aflaai ''n
  vinnige proses geword: ''Ons het ammunisie-skepe binne twee dae afgelaai'', het
  Pagonis in 1992 ges\u00ea en bygevoeg dat ander skepe binne 24 uur leeggemaak is.\\nAirlift,
  hoewel dit te veel belas is, het relatief glad verloop, hoofsaaklik as gevolg van
  die groot kapasiteit van die lugmag. Einde Augustus ondersteun 94 persent van die
  C-5''s (118 van 126) en 73 % van die C-141''s (195 van 265) die ontplooiing, met
  81 persent van die KC-10''s, 44 persent van die diens KC-135''s en kommersi\u00eble
  vliegtuie speel ook ''n belangrike rol in die lewering van troepe en voorrade. Teen
  die begin van die lugoorlog op 17 Januarie 1991 het kommersi\u00eble en milit\u00eare
  vliegtuie meer as 10,500 vlugte uitgevoer om meer as 355,000 kort ton voorraad van
  regoor die w\u00eareld te lewer.\\nKC-10 en KC-135 tenkskip het ook ''n belangrike
  rol gespeel in die brandstofaanval, verkenning, vrag en ander vliegtuie. Gedurende
  die ses maande van Operation Desert Shield het die lugmag meer as 17 000 keer 262
  KC-10''s en 46 KC-135''s gevlieg, waarvan 11 500 soorte wat besig was om brandstowwe
  te vul wat meer as 33,000 vliegtuie gevul het, insluitend 5500 vloot- en mariene
  stralers. Gedurende die ses weke van Operation Desert Storm het die tenkwaens 17
  000 sorteervlugte gevlieg, waarvan meer as 15 000 missies gevul het, en ten minste
  52 000 koalisievliegtuie voorsien van meer as 125 miljoen liter brandstof (meestal
  JP-8, hoewel JP-5 ook gebruik is) , veral vir vlootvliegtuie). Lugmag C-12''s en
  C-130''s en mariene en weermagvlieghelikopters soos die UH-1, UH-60''s, CH-46''s,
  CH-47s en CH-53''s is ook sterk aangewese om troepe en toerusting na die teater
  te vervoer , veral om die weswaartse flankbeweging te bevorder.\\nBrandstof was
  die lewensaar van die oorlog, en tenkwaens soos die Lugmag se KC-135''s is hard
  gewerk. DoD foto.\\nVir seevaart is tientalle verskillende soorte skepe gebruik
  om hardeware aan Saoedi te lewer, waaronder baie wat nog nooit milit\u00eare voorrade
  gehad het nie. Die ses voorafgaande posisioneringskepe van Diego Garcia en agt vinnige
  se\u00eblskepe (FSS) uit die state is tot hul maksimum gestoot, wat veroorsaak dat
  een FSS breek en na Rota, Spanje, trek om herstelwerk te doen. Die se\u00ebling
  het uiteindelik voldoende geblyk, hoewel dit swakhede blootgel\u00ea het wat die
  Pentagon steeds probeer aanspreek.\\nOp die grond was die 7de vervoergroep op 9
  Augustus die eerste logistieke uitrusting wat na Saoedi gestuur is, en die eerste
  300 soldate was spesifiek daarop gemik om die oostelike hawens van Ad-Dammam en
  Al-Jubayl te bestuur. Hulle het begin om die vooraf-posisioneringskepe wat tenks
  en toerusting bevat, af te laai vir die 24ste Infanteriedivisie (gemeganiseer),
  wie se swaar eenhede broodnodig sou wees as die Irakezen sou aanval. Die probleem
  was dat die 7de net vier vurkhysers gehad het om mee te begin. Die prepo -skip met
  vurkhysers en ander hawe -toerusting is nie eers afgelaai nie, en selfs dan het
  dit slegs ''n minimum gebied.\\nDie Saoedi''s het die las van logistieke snafus
  verlig en gehelp om die vurkhysers, liere, hyskrane en ander toerusting vir Amerikaners
  te voorsien, plus arbeiders wat dringend nodig was. Daar is ook ''n groot beroep
  op die gashere gedoen om vervoer - vragmotors, busse en motors - via kommersi\u00eble
  kontrakteurs te voorsien. Uiteindelik het Duitsland en Japan tot 3000 vierwielmotors
  geskenk. Volgens die weermaghistorikus John McGrath, het die bemanning van Pagonis
  teen 8 September $ 1,83 miljard bestee om ''n wye verskeidenheid ondersteuning van
  die Saoedi''s te bekom: 51 sake- en behuisingskomplekse, die gebruik van 1900 vragmotors,
  8416 tente en 738 arbeiders per dag. Die Saoedi''s het ook twee maaltye per dag
  vir 116 000 troepe voorsien en al die basiese dinge verskaf - water en ys, brandstof,
  verkoeling, elektrisiteit, riool, telefone, ens. - wat die Amerikaanse magte benodig.\\nBy
  die hawens is baie probleme ondervind om vas te stel watter skeepshouers waarheen
  gaan. Die nuwe strepieskodeerstelsel wat gebruik is-skandeerders soortgelyk aan
  di\u00e9 in kruidenierswinkels-het nie heeltyd gewerk nie, daarom moes houers van
  40 en 20 voet gewoonlik oopgemaak word om te bepaal wat daarin was. Dit het tydrowende
  vertragings veroorsaak.\\nNog ''n probleem vroeg was kos. MRE''s en T-Rantsoene,
  halfbederfbare kospakkies wat slegs kookwater nodig gehad het om 36 soldate te voed,
  was goed beskikbaar (een prepo-skip was met 1,5 miljoen MRE''s gestoor), maar het
  ''n demoraliserende invloed op troepe gehad toe hulle almal daar was verteer moet
  word. Die kosdirekteur van die 7de het besluit om Hardee -hamburgers te koop vir
  troepe om te eet, maar dit was moeilik om dit warm te lewer, nog minder warm. Pagonis
  het kontak gemaak met Zahir Masri, ''n welgestelde Saoedi -sakeman, wat saam met
  ao 4 Wesley Wolfe, Pagonis \u2019 -voedsel -tsaar gere\u00ebl het om troepe warm
  etes (lasagne, worsbroodjies, pizza, ens.) En vars pitabrood te voorsien, vrugte
  en groente, selfs vir soldate in die voorste linies, ''n merkwaardige moraalverhoger.
  Teen Desember het tot 300 000 Amerikaanse troepe elke dag hierdie sogenaamde ''A-rantsoene''
  ge\u00ebet, plus ''Wolfburgers''-warm hamburgers wat deur verskeie mobiele bakkies
  verskaf is wat Wolfe na woestynposte gestuur het.\\n''N Ander groot taak waarmee
  die 22ste SUPCOM te kampe het, was die behoefte om tenks en ander toerusting wat
  na Saoedi stroom, te vervang of te moderniseer. Die 24ste, 1ste Kavalleriedivisie
  en 3de Pantser Kavallerieregiment het al sy M-1 tenks opgegradeer na M1A1s. Die
  Amerikaanse weermag Europa het byna 800 M1A1''s bygedra met die veel kragtiger 120mm
  geweer, en Army Materiel Command het hierdie M1A1''s opgegradeer met verskeie aanpassings
  en dit aan eenhede in die teater uitgereik. Teen die begin van die grondoorlog is
  948 tenks gemoderniseer, insluitend almal met die XVIII Airborne Corps en almal
  behalwe twee bataljons van die VII Corps 1st Infantry Division (Mechanized), volgens
  McGrath. Tot 836 van die nuutste weergawes van die M2A2 Bradley Fighting Vehicles
  het aangekom, en die VII Corps \u2019 2nd Armoured Cavalry Regiment het dit gebruik
  om die ouer Bradleys te vervang.\\nOmdat VII Corps \u2019 rupsvoertuie uit Duitsland
  bosgroen geverf was, moes die meeste van hulle woestynbruin geverf word, ''n taak
  wat die 593ste Area Support Group verrig het, eers by die hawens van Damman en Jubayl
  en later by twee ander woestynposte. In totaal is meer as 10 000 voertuie geverf,
  waaronder ongeveer 8 600 van die VII Corps, met meer as 30 000 liter verf, wat kommersieel
  gekoop moes word.\\nXVIII Airborne Corps se troepe wag om aan boord van ''n vliegtuig
  te gaan. DoD foto.\\nGrondvervoer was die grootste logistieke hoofpyn. Groot vragmotors
  sou nodig wees om tenks en ander swaar pantsers na die slagveld te vervoer, want
  sommige sou ''n paar honderd kilometer moes ry om in posisie te kom. Die enigste
  antwoord was vervoerders vir swaar toerusting (HETs), wat groot vragmotors is wat
  plat vragmotors kan hanteer, soos die 70-ton M1A1 Abrams-tenks. Maar weereens, omdat
  die leerstelling van die Koue Oorlog bepaal het dat treine tenks na die voorkant
  van ''n Europese oorlog sou vervoer, het die weermag ''n tekort aan vragmotors gehad
  - slegs 112 HET''s was in die teater. Die 22ste het daarin geslaag om nog 2 200
  bakkies en 450 laerseuns te gebruik, wat almal swaar vragte kon sleep.\\nBoonop
  het die Saoedi''s en ander koalisievennote, veral Egipte, Duitsland en Tsjeggo-Slowakye,
  nog 1,300 HET''s verskaf, meestal trekkerwaens met ervare derdewereldbestuurders.
  Egipte alleen het ''n HET -bataljon aangebied met bestuurders, werktuigkundiges
  en onderdele.\\n''Dit het duidelik geword dat u tenks nie na die slagveld ry nie.
  U moet wielvoertuie gebruik om dit daar te kry, \u201ds\u00ea Pagonis, wat in Februarie
  1991 tot luitenant -generaal bevorder is.\u201c Die Egiptiese HET''s het ons huide
  gered. \u201d Ooit die vernuwer, het Pagonis geskep wat hy grappenderwys die ''Pakistaanse
  vragmotorbataljon'' noem, ''n tydelike bemanning van duisende bestuurders uit lande
  soos Pakistan, Indi\u00eb en Bangladesh. Baie van die bestuurders was 18 uur per
  dag, ses dae per week, op pad na gasmaskers, bandjies van Amerikaanse musiek en
  Amerikaanse T-hemde. Die bestuurders, meestal Moslems, is toegelaat om vyf pouses
  per dag te neem om te bid. Afwesigheidsyfers het ''n ernstige probleem geword toe
  die lugoorlog begin het, maar sodra dit duidelik geword het dat die bestuurders
  min skade gehad het, het dit aansienlik gedaal. Tog het die 22ste SUPCOM gere\u00ebl
  dat 1,786 Amerikaanse soldate gebruik word as bestuurders om die huurbestuurders
  aan te vul en in sommige gevalle te vervang.\\nDie beweging van die twee weermagkorps
  en kleiner Britse en Franse eenhede na aanvalposisies kon eers begin nadat die lugveldtog
  op 17 Januarie 1991 begin het, sodat die Irakezen nie aan die bondgenote in die
  weswaartse flankbeweging toegeslaan sou word nie. Pagonis wou vroe\u00ebr begin
  met die oprigting van die voorste boomstamme, waaronder Log Base Charlie, gele\u00eb
  in die noordweste van Saoedi naby Rafha, maar Schwarzkopf sou hom nie toelaat totdat
  koalisievliegtuie beheer van die lug gevestig het nie. Pagonis meen die massiewe
  opbou in King Khalid Military City (KKMC), net suid van Hafr Al-Batin, naby waar
  die grense tussen Saoedi, Irak en Koeweit saamloop, het gehelp om enige spioene
  wat die Irakezen op die grond gehad het, af te gooi. \\\"In die mis van die oorlog
  was die opbou by KKMC ''n uitstekende dekking vir die flankmaneuver van die linkerhaak
  en#8217,\\\" merk Pagonis op. ''Die bombardement was so massief dat dit werklik
  hierdie misleiding moontlik gemaak het.\\nTog was dit gevaarlik om die troepe in
  aanvalposisies op die Spartaanse pad in Saoedi te plaas. Minstens 46 soldate is
  dood en 41 beseer in motorongelukke, met 23 van die sterftes op Taplineweg, of Main
  Supply Route (MSR) Dodge, ''n swak geboude tweespoorpad wat oos-wes loop in Saoedi
  langs die Irakse en Koeweitse grense. Op baie gebiede het MSR Dodge - wat sy twyfelagtige
  naam gekry het vanwe\u00eb die motors en vragmotors wat sou verdwyn en in en uit
  die verkeer sou waai terwyl hy groot konvooie wou verbysteek - geen skouers gehad
  nie. In plaas daarvan het dit gevaarlike afleggings van twee voet gehad.\\nVan 20
  Januarie tot middel Februarie, toe eenhede in aanvalposisies verskuif is, was die
  hoeveelheid verkeer op paaie soos MSR Dodge en MSR Texas, die noord-suid-pad tussen
  Riyad en KKMC, ongelooflik. Alleen op MSR Dodge dreun elke dag 4500 vragmotors op
  en af met die smal pad, met 18 vragmotors wat op ''n gegewe minuut ''n enkele plek
  verbygaan.\\nVervoerbestuur was moeilik, maar die meeste van die XVIII Airborne
  Corps se grondkonvooie het ''n suidelike benadering tot die westelike gebiede geneem,
  wat die verkeer vir die VII Corps verminder het, wat hom op die oostelike gebiede
  van MSR Dodge geplaas het. Die 318ste Bewegingsbeheeragentskap het probeer om die
  vloei te beheer deur bepaalde eenhede ''n paar keer tyd te gee om die verskillende
  MSR''s te reis.Die 89ste Milit\u00eare Polisie Brigade het die moeilike taak aangepak
  om die verkeer so veilig as moontlik te laat beweeg - ''n taak wat die burgerlike
  verkeer des te meer afskrik en bestuurders van die Derde W\u00eareld nie gewoond
  was aan die streng re\u00ebls van die konvooi nie. Die parlementslede het kontrolepunte
  gevestig en die verkeer na oorvol kruispunte gerig, soos die een waar MSR Dodge
  MSR Texas ontmoet het, die ''moeder van alle kruisings'' genoem, en ingenieurs omseilings
  gebou het, hoewel dit feitlik onbruikbaar geraak het nadat winterre\u00ebn hulle
  in modder verander het. Pagonis en sy personeel het ook sewe \\\"rusplekke\\\" langs
  die verskillende roetes geskep, wat bestuurders in staat gestel het om brandstof
  te maak, te stort en ''n warm maaltyd te eet voordat hulle weer die pad aandurf.\\nTeen
  24 Februarie, die dag toe die grondaanval begin het, was al vyf die voorste houthakkies
  gereed, gereed om vinnig op te brand en te voorsien. \\\"Die troepe het die houthutte
  in drie weke opgerig, dit moes drie maande geneem het,\\\" het Pagonis ges\u00ea
  oor die groot depots, wat wissel van drie myl by vyf myl tot 30 myl by 30 myl. ''Sommige
  was binne ''n week aan die gang.''\\nDie skoonmaak, voorbereiding en aflewering
  van toerusting na die konflik was ''n groot prestasie. DoD -foto deur lt. Gary W.
  Butterworth.\\nNiemand het verwag dat die \\\"linkerhaak\\\" so goed sou werk nie
  - of so vinnig sou beweeg. Die 24ste het die Eufraatrivier, 200 kilometer noord
  van KKMC, bereik en sy toevoerlyne begin oorskry. Teen 28 Februarie, die dag waarop
  president Bush ''n skietstilstand verklaar het, was die 24ste 30 myl van Basra af,
  gereed om op die Irakse Republikeinse Garde te slaan.\\nBrandstofverbruik was die
  enigste logistieke bron van kommer oor die vinnige opmars, want teen 25 Februarie
  was Amerikaanse eenhede gemiddeld 25 dae rantsoene en 66 dae ammunisie in voorraadbrandstofreserwes,
  maar het tot 5,6 dae gedaal. Elemente van die 3de Pantserdivisie het brandstoftekorte
  te\u00ebgekom, maar ''n vloot van 300 tenkwaens is noordwaarts gehaas om hul voorraad
  aan te vul. Pagonis en sy beplanners het sulke brandstoftekorte verwag, want die
  voertuie van beide die bande en wiele gebruik gas teen kommerwekkende snelhede.
  Hy merk op dat voor die begin van die grondoorlog, die meeste eenhede slegs 45 dae
  ammunisie en 5,2 dae brandstof in voorraad gehad het, sodat logistieke pogings eintlik
  die voorraad verhoog het sodra die aanval begin het. Die toename in ammunisievoorrade
  was die gevolg van die gebrek aan swaar gevegsbevelvoerders wat verwag is, aangesien
  elke eenheid bykomende ammunisie gekry het nadat die vierdaagse grondinval begin
  het.\\nKort nadat Koeweit bevry is, is die VSA vrygespreek van die aanvaarding van
  al sy logistieke steun vir die oorloggeteisterde land, wat die grootste deel van
  die taak aan die Koeweit, Saoedi''s en ander Arabiese nasies oorgedra het, en Fase
  Delta van die oorspronklike logistieke planne effektief uitgeskakel het. Maar Phase
  Echo sou binnekort begin, en dit sou ''n groot opruiming wees, ''n logistieke nagmerrie,
  sou sommige meen. President Bush het beveel dat alle gevegstroepe so gou as moontlik
  terugkeer huis toe, en die kongres was huiwerig om reserviste, wat byna 70 persent
  van die 22ste SUPCOM uitmaak, agter te laat vir die herontplooiing. Tog is 6 000
  reserviste - die ruggraat van die 22ste vanaf Desember 1990 - in 69 eenhede georganiseer
  en die taak om troepe uit die teater te verwerk en hul toerusting skoon te maak,
  te pak en huis toe te stuur.\\nVolgens Pagonis was dit die vinnigste herontplooiing
  wat die indrukwekkendste logistieke prestasie van sy Persiese Golfperiode was. Hy
  was in beheer nadat Schwarzkopf en die ander voorste leiers na die state teruggekeer
  het vir ''n welkom by die helde, en organiseer die skoonmaak en versending van alle
  Amerikaanse voorrade en toerusting, plus meer as 1200 tenks en voertuie op wiele.
  Van Maart tot Junie 1991 was die belangrikste taak om die soldate by die huis te
  kry, en gedurende die tyd het die 22ste gedurende die tyd 5.000 soldate per dag
  na huiswaartse vliegtuie gestuur. ''Dit was die moeilikste tyd, het Pagonis in 1992
  ges\u00ea.'' Almal het huis toe gegaan en ons het daar gebly en skoongemaak. Ons
  het 100 myl per uur gery. \u201d\\nDie grootste uitdaging vir die oorblywende troepe
  was om die fyn sand uit voertuie en helikopters te onttrek en tot 4000 per dag te
  skrop. Die soldate van die 22ste \u2019''s het groot draagbare watertenks gebruik
  om water vir die skoonmaak te voorsien, wat die water gefiltreer het sodat dit weer
  gebruik kon word, het hy ges\u00ea. ''Ons het motorwassers gebou wat groter is as
  sommige stede,'' verklaar hy by sy terugkeer in Januarie 1992.\\nPagonis en sy le\u00ebr
  reserviste het teen ''n heftige tempo gewerk en teen Januarie 1992 die onttrekking
  voltooi, ses maande voor skedule. Tienduisende ton ammunisie - oorspronklik ingebring
  in geval van ''n langdurige oorlog - moes gelaai en verskeep word. Pagonis het ges\u00ea
  dat hy fokus op aanspreeklikheid, en hy het gere\u00ebl om Bedoe\u00efene, of woestyn
  nomades, te betaal om die woestyn te soek vir verlore toerusting. ''Ons het niks
  daar gelaat nie,'' het hy beweer, hoewel hy nooit seker kan wees nie.\\nDie ongelooflike
  kort 100-uur grondoorlog het die Amerikaanse weermag nie gedwing om sy ware logistieke
  vermo\u00ebns te toets nie, het Pagonis 10 jaar later afgesluit. Die strepieskodering
  vir houers het nooit gewerk soos geadverteer nie, en eenheidsbevelvoerders het \\\"nooit
  naby gekom\\\" om aan sy eis te voldoen dat 60 persent van elke vraghouer vir een
  eenheid aangewys moes word nie. Pagonis wou h\u00ea dat eenhede al hul toerusting
  in houers van 20 voet moet plaas in plaas daarvan om dit in houers van 40 voet te
  meng, maar dit het ook nooit gerealiseer nie, wat talle vertragings in die ontplooiing
  veroorsaak het. Die weermag en die mariniers was ook nooit gedwing om die vloei
  van herstelonderdele te toets nie, wat deurslaggewend sou wees tydens ''n uitgerekte
  oorlog, merk hy op.\\nBenewens die ernstige tekort aan HETS en vervoerders vir ho\u00eb
  mobiliteitstoerusting, wat moeilik terrein met swaar vragte kan deurkruis, het logistici
  ook ''n groot aantal hindernisse oorkom. Daar was ''n tekort aan vurkhysers en toerusting
  vir rowwe terreine en ''n uiters behoefte aan bakkies en basiese arbeiders soos
  kokke en bestuurders, waarvan die meeste deur die Saoedi''s voorsien is. Behalwe
  dat hulle baie baat gevind het by die groot verskeidenheid Saoedi -en koalisiehulp,
  was die Amerikaanse troepe gelukkig Saddam Hussein het hulle nie aangeval terwyl
  hulle so kwesbaar was in die vroe\u00eb stadiums van die ontplooiing nie. ''Ek dink
  nie ons kan in die toekoms daarop reken dat ons so gelukkig is nie,'' het Pagonis
  opgemerk. ''Die meeste aanvallers is meer vasberade.''\\nHierdie artikel is die
  eerste keer gepubliseer Desert Shield/Desert Storm: Die 10de herdenking van die
  Golfoorlog.\\nWat is die geskiedenis van omgekeerde logistiek?\\nOmgekeerde logistiek
  bestaan al ''n lang tyd om ons. Die geskiedenis van omgekeerde logistiek vind sy
  oorsprong in die Amerikaanse burgeroorlog. Natuurlik sou daar ander literatuur wees
  wat die geskiedenis van omgekeerde logistieke aktiwiteite selfs vroe\u00ebr as die
  Amerikaanse burgeroorlog opneem, maar hierdie aktiwiteite is nie stelselmatig opgeteken
  of algemeen erken nie. Om die omgekeerde logistiek beter te verstaan, laat ons eers
  vinnig kyk na die belangrike gebeurtenisse in die geskiedenis van omgekeerde logistiek.\\nU
  kan baie besonderhede van die geskiedenis van omgekeerde logistiek in die boek van
  Rogers en Tibben-Lembke sien, Om agteruit te gaan, omgekeerde logistieke tendense
  en praktyke.\\n1861-1865: Die geskiedenis van omgekeerde logistiek het sy wortels
  in die weermag\\nAan die einde van die Amerikaanse burgeroorlog het generaal William
  T. Sherman besef dat die aard van sy le\u00ebrs ''n kwessie van aanbod en mobiliteit
  sou wees en dat sy operasies deur vyandige gebied moeilik sou wees. Hy staan voor
  die ingewikkelde taak om sy soldate tydens die optog te voorsien.\\n1872: Kleinhandel
  dryf voort met die geskiedenis van omgekeerde logistiek\\nVandag se kwessies vir
  kleinhandelopbrengste vind hul wortels in die kli\u00ebntediensbeleid van Montgomery
  Ward. Montgomery Ward is ''n Amerikaanse meubelwinkel wat in 1872 gestig is. Hulle
  beleid was dat as die kli\u00ebnt nie 100% tevrede is nie, hulle dit kan terugbring
  vir ''n volledige terugbetaling.\\n1942: Oorlog skep altyd wonderlike logistieke
  oplossings, die geskiedenis van die agtermark in die motor van die omgekeerde logistiek
  het die wortels van die Tweede W\u00eareldoorlog\\nMateriaaltekorte tydens die Tweede
  W\u00eareldoorlog het ''n behoefte geskep om motoronderdele te herbou en ''n neiging
  begin wat tot vandag toe voortduur. Dit het eintlik ''n besigheid van $ 36 miljard
  geword en \\\"90 tot 95 persent van alle starters en alternators wat vir vervanging
  verkoop word, word hervervaardig\\\".\\n1984: Suksesvolle produkherinnerings begin
  die gebruik en gebruik van omgekeerde logistiek toeneem\\nDie volgende belangrike
  datum van belang in die geskiedenis van omgekeerde logistiek is die 1984 Tylenol
  -skrik. Johnson en Johnson saam met McNeil Laboratories het vinnig gereageer terwyl
  Amerika die aandnuus oor die ''besmette lot'' van Tylenol kyk. Die vinnige reaksie
  deur McNeil Laboratories om die besmette produkte uit die rakke te kry en vinnig
  deur nuwe lotte met peutervaste bottels vervang, het groot vertroue in die Amerikaanse
  publiek ingeboesem en die nuwe standaard vir omgekeerde logistiek gestel.\\n1991-1996:
  Meer toesig oor die positiewe omgewingsimpak van omgekeerde logistiek kom in 1991\\nIn
  1991 het die Bondsrepubliek Duitsland herwinningsvoorskrifte in die omgekeerde omstroming
  van die omgewing goedgekeur en verpligte herwinningsprogramme ingestel. In hierdie
  verordeninge was bepalings vir boetes en vervolging vir oortreders van die verordeninge,
  en strenger riglyne vir die hantering en vervoer van gevaarlike materiaal en verantwoordelikhede
  vir die herwinning van gevaarlike afval.\\nDie Duitse verordeninge het gelei tot
  ''n wetgewing in die Verenigde Koninkryk van 1996 wat vereis dat versenders en vervaardigers
  verantwoordelik is vir die terugstuur en herwinning van verpakkingsmateriaal. Die
  Europese Unie het hierdie stap in 2001 verder geneem deur ''n doel van 50-65% herwinning
  of herwinning van verpakkingsafval te stel. Die implikasie vir die res van die w\u00eareld
  is dat hulle gehoorsaam moet wees as hulle met die EU sake wil doen.\\n1998 tot
  2000''s: Geskiedenis van omgekeerde logistiek groei tot gesofistikeerdheid en is
  ''n meer strategiese toepassing in die sakew\u00eareld\\nOmgekeerde logistiek het
  die afgelope dekade nie veel aandag van die sakew\u00eareld getrek nie. In die vroe\u00eb
  90''s het die Council of Logistics Management (nou die Council of Supply Chain Management
  Professionals) twee studies oor omgekeerde logistiek gepubliseer. Die eerste is
  geskryf deur J. R. Stock wat stelselmatig gerapporteer het oor hoe om op te stel
  en hoe om omgekeerde logistieke programme te bedryf. Stock se boek het ook probeer
  om die potensiaal van omgekeerde logistiek te ontdek. Rogers & amp; Tibben-Lembke
  het egter ''n uitgebreide versameling uiteengesit van verskillende omgekeerde logistieke
  besigheidsstatistiekdata, ingedeel volgens tipes industrie. Die tydskrifuitgewersbedryf
  het byvoorbeeld die hoogste opbrengs (50%). Tydskrifte het ''n kort rakleeftyd as
  dit nie naby die publikasie-/voorbladdatum uitverkoop kan word nie, dit moet teruggegee
  of weggegooi word. Rogers & amp; Tibben-Lembke het ook berig dat ander bedrywe met
  ''n ho\u00eb gemiddelde opbrengs boekuitgewers, katalogushandelaars en wenskaartondernemings
  insluit. Behalwe hierdie bogenoemde studies, fokus sommige ander artikels op die
  optimalisering en bestuur van omgekeerde logistiek rondom die jaar 2000 op die kenmerke
  van omgekeerde logistiek vir hervervaardigingsisteme.\\nAlhoewel die Raad van Logistieke
  Bestuur reeds ''n definisie gegee het vir omgekeerde logistiek, het omgekeerde logistiek
  ontwikkel sedert die datum waarop dit erken is, maar die werklike definisie daarvan
  verskil grootliks van die onderneming of bedryfsegment wat dit wou verduidelik.
  Shad Dowlatshahi in sy koerant getiteld, Die ontwikkeling van ''n teorie van omgekeerde
  logistiek beskryf ''n holistiese siening van omgekeerde logistiek met 11 faktore.
  Dowlatshahi het hierdie faktore verder in twee hoofkategorie\u00eb verdeel: strategiese
  faktore en operasionele faktore. Strategiese faktore bestaan uit strategiese koste,
  algehele kwaliteit, kli\u00ebntediens, omgewingsbesorgdheid en wetgewende kommer.
  Die operasionele faktore bestaan uit koste-bate-analise, vervoer, pakhuise, voorraadbestuur,
  vervaardiging en herwinning en verpakking.\\nDie opkoms van e -handel en die na
  -mark verhoog die formele gebruik van omgekeerde logistiek deur afleiers\\nDie styging
  in e -handel gaan hand aan hand met die opkoms van omgekeerde logistiek in die geskiedenis
  van omgekeerde logistiek. Aangesien die gebruik van die internet meer algemeen in
  Amerikaanse huishoudings was en die opkoms van meerkanaals-kleinhandel sedert die
  laaste 2000''s en in die huidige dekade toegeneem het, is omgekeerde logistiek nou
  ''n vereiste vir e-handel. In die middel van die negentigerjare tot 2000''s het
  die kommersi\u00eble gebruik van die internet groot vooruitgang gemaak. Die grootste
  aanlyn -kleinhandelaar ter w\u00eareld, Amazon, wat in 1995 as ''n aanlyn boekwinkel
  bekendgestel is. Bakstene-en-mortier-boekwinkels was beperk tot ongeveer 200 000
  titels, en Amazon was ''n aanlynwinkel sonder fisiese beperkings en kon eksponensieel
  meer produkte aan die koper bied. Tans bied Amazon nie net boeke nie, maar DVD''s,
  CD''s, MP3 -aflaai, rekenaarprogrammatuur, videospeletjies, elektronika, klere,
  meubels, kos en speelgoed. ''N Unieke kenmerk van Amazon se webwerf is die gebruikersbeoordelingsfunksie
  wat ''n beoordelingsskaal bevat om ''n produk te beoordeel. Klantebeoordelings word
  nou beskou as die doeltreffendste taktiek op sosiale media om verkope te bevorder.
  Die onderneming lok maandeliks ongeveer 65 miljoen kli\u00ebnte na sy Amerikaanse
  webwerf en verdien in 2010 34,344 miljard in 2010. In 2001 het Amazon.com sy eerste
  mobiele handelswebwerf geloods.\\n''N Ander groot suksesverhaal van die dot com
  -borrel was Ebay, ''n aanlynveilingwebwerf wat in 1995 gedebuteer het. Ander kleinhandelaars
  soos Zappos en Victoria Secret het die voorbeeld gevolg, terwyl Zappos ''n aanlyn
  winkel was.\\nAs u aan e -handel dink, fokus u gereeld op die siklus wat uitloop
  op die aflewering van goedere aan ''n kli\u00ebnt. Maar daar is ''n hele deel van
  die e -handelsvoorsieningsketting wat in werking tree nadat goedere afgelewer is.
  Betree die w\u00eareld van omgekeerde logistiek. \u201d Daar is verskeie redes wat
  omgekeerde logistiek onvermydelik maak. Hier is ''n paar van die algemeenste:\\n-
  Opbrengste\\n- Goedere wat nie afgelewer is of nie afgelewer is nie\\n- Beskadigde
  goedere\\n- Wanfunksionele goedere\\n- Uitruilprogramme\\nToepassing van omgekeerde
  logistiek in die groeiende na -markbedryf\\nDie Amerikaanse motornavorsingsbedryf
  behoort jaarliks tot 2016 met 3,4 persent te groei tot $ 263,8 miljard, wat $ 32,6
  miljard tot die ekonomie bydra, volgens ''n verslag wat gesamentlik deur die Automotive
  Aftermarket Industry Association en die Automotive Aftermarket Suppliers Association
  gelewer is.\\nSoos in die pos van gister ges\u00ea, fokus die gewone logistieke
  vloei op alles wat gebeur voor die verkoop en dan tussen die verkoop en die punt
  waarop die klant die produk in die hand het. U produk, wat dit ook al is, moet vervaardig
  word en dan gestoor word in voorbereiding vir die finale versending, of moet dit
  versprei word oor ''n verskeidenheid kleinhandelkanale of ander besighede vir posisionering
  voor die verbruiker.\\nOmgekeerd fokus omgekeerde logistiek op die terugkeer van
  motor -na -produkprodukte om verskillende redes (gewoonlik dieselfde as hierbo gelys
  vir e -handel). Reverse Logistics is regtig ''n fokus op baie kern -motoriste -logistieke
  aktiwiteite. As ''n onderdeel nie pas nie, moet dit teruggegee word. As die onderdeel
  beskadig is, moet dit teruggestuur word. Onthou, die na -industrie word gedefinieer
  as die mark vir onderdele, bykomstighede en komponente, veral vir motorvoertuie.
  Dink net daaraan as u ''n herstelprojek op u eie motor het en hoe gereeld u na die
  motoronderdele -winkel moes terugkeer. Dit is dieselfde idee met motor -na -mark
  -omgekeerde logistiek!\\nWaarom sien motorlogistiek dan ''n oplewing in omgekeerde
  logistiek? Wel, veral omdat die bedryf groei, maar dit is ook baie duidelik uit
  hierdie aanhaling van die uitvoerende hoof van AAIA, president, Kathleen Schmatz:
  ''Die voorspellingsmodel toon aan dat ondanks sterk verkoop van nuwe voertuie, historiese
  ho\u00eb gaspryse en ''n afplatting van myl gery, is ons bedryf gereed vir bestendige
  groei. Hoekom? Die gemiddelde ouderdom van voertuie is 11,3 jaar, die oudste ooit,
  en die ouderdomsmengsel van voertuie bevoordeel steeds ouer voertuie, wat ''n goeie
  plek is vir diens en herstel.\\nHierdie uitgebreide en verskillende toepassings
  deur die geskiedenis van omgekeerde logistiek, skep baie verskillende sinonieme\\nAnder
  terme wat sinoniem is met Reverse Logistics is Aftermarket Logistics, Retrogistics
  of Aftermarket Supply Chain. Die omgekeerde verskaffingsketting is ook ''n term
  wat in die bedryf gebruik word. RL moet nie verwar word met vooruitlogistiek of
  om die produk op die mark te bring nie, algemeen bekend as die voorwaartse verskaffingsketting.
  Tipes aktiwiteite wat algemeen voorkom met omgekeerde logistiek, sluit in: logistiek,
  pakhuise, herstelwerk, opknapping, herwinning, e-afval, ondersteuning na die oproepsentrum,
  omgekeerde uitvoering, velddiens en vele ander.\\nWat ontbreek ons in hierdie geskiedenis
  van Reverse Logistics? Wat sou jy byvoeg?\\nDie vier logistieke dilemmas wat op
  die weermag wag op die moderne slagveld\\n\\\"Die geveg, die rigting, selfs die
  beplanning van die gevegte duur in die hele sekondes slegs tot die ure se arbeid
  wat betrokke was by die voorbereiding en uitvoering van optogte.\\\"\\n- Montgomery
  C. Meigs, kwartiermeester -generaal van die Amerikaanse weermag, 1861\u20131882\\nVoordat
  die bevel oorgeneem het oor die voorste ondersteuningsmaatskappy van ''n infanteriebataljon,
  het die tweede-in-bevel van die kompanjie onthul dat sy soldate meer as ''n jaar
  nie op hul wapensisteme gekwalifiseer het nie. Binne ''n paar dae sou ons brigade
  die nasionale reaksiemag van die land word, en my ondersteunde bataljon sou die
  eerste eenheid van die brigade wees wat reageer op onbekende krisisse regoor die
  w\u00eareld. Ek was bewus van die agterstand van die bataljon in die agterstand,
  die nuutgemaakte (maar onaangeraakte) vermo\u00ebns en sendingopdragstelsels, en
  die vorige stryd van die maatskappy om die eenvoudigste instandhoudingstake uit
  te voer, maar die te vereenvoudigde kritiek van vorige leiers en bestuur was nie
  voldoende om die volle omvang van die probleme. Hierdie probleme spruit uit vier
  algemene dilemmas wat jong logistici wat taktiese formasies ondersteun daagliks
  moet trotseer.\\nIn ''n boodskap aan kadette wat hulle voorberei om as offisiere
  in al die loopbane van die weermag in diens te neem, het luitenant -kolonel Charles
  Faint kadette uitgedaag om hul onderskeie takke te \\\"besit\\\". In die komende
  maande sal meer as 660 Amerikaanse milit\u00eare akademie en opleidingskorps van
  die reserwebeamptes toegang tot die kwartiermeester, die munisipaliteit en die vervoerkorps
  aan hul onderskeie eenhede rapporteer. Vir hierdie toekomstige logistici kan hul
  vermo\u00eb om vier dinge te doen die weermag se sukses op toekomstige slagvelde
  bepaal: vind balans tussen opleiding en ondersteuning, adviseer hul maneuver -eweknie\u00eb
  oor logistieke aangeleenthede, dink kreatief oor die bestaande vermo\u00ebns in
  hul formasies en integreer komplekse tegnologie effektief .\\nDie Tuine van klip
  Dilemma\\nHierdie dilemma spreek van die logistieke behoefte van die logistikus
  om op te lei vir selfvoorsiening in die oorlog, terwyl dit terselfdertyd ander se
  voorbereiding op oorlog ondersteun. Die naam van die dilemma word gekenmerk deur
  ''n wanbalans in opleiding en ondersteuning, en is afgelei van die film van Francis
  Ford Coppola uit 1987, Tuine van klip. Die film toon gevegservare, senior onderoffisiere
  wat sukkel om lede van die 3de Amerikaanse Infanterieregiment (The Old Guard) voor
  te berei op die smeltkroes van die Vi\u00ebtnam-oorlog, terwyl hulle tegelykertyd
  milit\u00eare eerbewyse en begrafnisse op die Arlington National Cemetery uitvoer.\\nWeermaglogistici
  het ''n baie soortgelyke probleem. Hulle ontbreek gereeld die opleiding vir hul
  gevegsrolle. Die missie -eenheid se missies en onophoudelike tempo van toetsing,
  veldwerk en integrasie van nuwe tegnologie en vermo\u00ebns l\u00ea ''n geweldige
  verbintenis in tyd en opleiding op. Die logistikus erken en waardeer die buitengewone
  onderneming van die gevegseenheid en bestee enorme energie om die gereedheid van
  die maneuvereenheid te verseker - gewoonlik ten koste van die instandhoudingseenheid
  se eie gereedheid.\\nOnderhoudseenhede se oorlogsvoorbereidheid is niks nuuts nie.
  Logistici was swak voorbereid op die Koreaanse oorlog, die inval in Grenada en die
  ingryping in Somali\u00eb. Slegs dae voor sy eenheid die Grenada -inval in 1983
  ondersteun, het een ondersteuningsbevelvoerder opgemerk dat sy eenheid ''verroes
  in die veld'' was en dat hy nie ''die taktiese opleiding benodig om hul posisies
  te verdedig'' nie. In Somali\u00eb in 1992\u20131993 was onderhoude -eenhede \\\"nie
  voorbereid of voldoende opgelei om die ROE [verbintenisre\u00ebls] toe te pas\\\"
  tydens konvooi -operasies nie. En eers na die hoogs gepubliseerde hinderlaag van
  die 507ste Onderhoudsmaatskappy in 2003 (waarin elf logistici in aksie in ''n konvooi
  buite Nasiriya, Irak, dood is), het die weermag maatre\u00ebls getref om die taktiese
  tekortkominge van instandhoudingseenhede aan te spreek.\\nDie Oranje is die nuwe
  swart Dilemma\\nHierdie dilemma kan herhaal word as die \\\"as ons amber is op voorraad,
  dan is ons swart\\\". ''Amber'' in milit\u00eare omgangstaal is die oranje-tint,
  deel van die groen-amber-rooi-swart skaal wat gebruik word as ''n maatstaf vir gereedheid,
  en is die onredelik laagste logistieke risiko wat baie bevelvoerders bereid is om
  te aanvaar. In wese, as die beperkings op die aanbod ''n eenheid tot amberstatus
  op ammunisie, brandstof, rantsoene, ens. Veroorsaak, sal baie ondersteunde eenhede
  dit as ''n behoefte aan onmiddellike heraanbod beskou.\\nDie kommer oor logistieke
  status bedreig die toekomstige sukses van die weermag, en toekomstige logistici
  moet hierdie wanpraktyk belemmer - soms met risiko''s van hul loopbane. Eenhede
  het dekades lank staatgemaak op installasieondersteuning by die tuisstasie en die
  vaste beskikbaarheid van voorrade op voorwaartse bedryfsbase (in Vi\u00ebtnam, Irak
  en Afghanistan) om die stryd te handhaaf. Die afwesigheid van hoogs effektiewe,
  vyandige interdiksiebedrywighede het beteken dat eenhede relatief ongehinderd kon
  werk deur logistieke aangeleenthede. Die Vi\u00ebtnam -oorlog was goed voorsien
  en dele van die konflik in Grenada en Panama in die tagtigerjare en Irak in 1991
  het nie meer as ''n paar dae geveg nie - skaars genoeg tyd om ''n oudisie van die
  weermag se gevorderde logistieke apparaat te doen (teen baie minder vyande). .\\nGevolglik
  verafsku (of vrees) grondbevelvoerders \\\"amber\\\" logistieke status en doen ''n
  beroep op onderhoude -eenhede om, sonder twyfel, op elke behoefte te reageer sonder
  om veel advies van logistici te gee. Hierdie buitensporige opdragte plaas jong logistici
  in dilemmatiese situasies met manoeuvre -bevelvoerders (wat soms hul beoordelaars
  of senior beoordelaars is) waar hulle gedwing word om te worstel met die vraag of
  hulle ondersteun deur op elke behoefte te reageer, of moet voorstel dat heraanbod
  kan wag op grond van die inligting wat deur die ondersteunde eenheid verskaf word.\\nDie
  \\\"War Rig\\\" -dilemma\\nDie dilemma \\\"War Rig\\\" kom voor op die oorvleuelende
  gebiede van oorlog en geld wanneer logistici die behoefte aan bygewerkte toerusting
  onderneem, terwyl hulle terselfdertyd erken dat sulke innovasie die oorlogsvegter
  se vermo\u00ebns negatief sou be\u00efnvloed. In die begin van die smeltkroes, logistici
  vinnig aanpas hul verouderde vermo\u00ebns tot die oorlogstydse realiteite op maniere
  soortgelyk aan voertuigveranderings wat in die film van 2015 uitgebeeld word Mad
  Max: Fury Road.\\nDie film se mees opvallende masjien, met die gepaste naam \\\"The
  War Rig\\\", was ''n swaar gewysigde agtienwieler met gepantserde naafdoppe, ''n
  koeivanger, aangepaste torings en meer. Die bemanning van die War Rig het die voertuig
  herontwerp om die behoeftes of bedreigings aan te spreek in die chaotiese, post-apokaliptiese
  w\u00eareld van die onbekende. Sulke improvisasie het sterk weerklank in die modifikasies
  op veldvlak, soos die hegskerms in Normandi\u00eb in die Tweede W\u00eareldoorlog
  en gepantserde gepantserde geweerwaens in Vi\u00ebtnam en in Irak in 2003-2004.\\nBaie
  min modernisering vind plaas tydens volmaakte formasies gedurende periodes van vrede.
  Soos een Small Wars Journal bydraer verklaar:\\nOns Amerikaanse weermag is deurdrenk
  en het ''n liefde-haat-verhouding met innovasie en verandering. En terwyl milit\u00eare
  leiers taktiese innovasie in die voorste linie met entoesiasme sal omhels. . . in
  vredestyd is leierskap huiwerig om taktiese of strategiese innovasie te ondersteun,
  veral in organisasies wat meer van die stryd af is.\\nUiteindelik skik die logistikus
  oor wat voorsien word. Jong logistici moet erken dat hulle die leiding neem oor
  formasies wat op sy beste tydens die laaste oorlog geskik is. Lesse wat uit vorige
  konflikte geleer is, word selde vertaal in materi\u00eble verbeterings onder volhoubaarheidsformasies
  gedurende periodes van vrede. Byvoorbeeld, die behoefte aan interne veiligheid (dws
  geweerwaens) in instandhoudingseenhede is reeds in Vi\u00ebtnam ge\u00efdentifiseer
  en in Somali\u00eb. Maar teen die laat negentigerjare het die weermag sy opgegradeerde
  geweerwa-inventaris aan milit\u00eare polisie en kavalerie-eenhede uitgereik-presies
  die tipe eenhede wat vir hul belangrikste missies toegewy is en nie veel hulp aan
  onderhoudseenhede kon verleen nie. Gevolglik het instandhoudingseenhede gedurende
  die vroe\u00eb maande van Operation Iraqi Freedom War Rig -agtige aanpassings aangebring
  om te vergoed vir die gebrek aan beskerming en sekuriteit van hul voertuie. Onder
  die huidige toestemmagtigings en die strategie vir taktiese voertuie vir 2010, is
  instandhoudingseenhede net so gedemilitariseer as voorheen, maar met ''n blywende
  verwagting om hulself te beveilig deur hul maneuver-eweknie\u00eb.\\nDie Hoverboard
  -dilemma\\nAnders as die vorige drie dilemmas wat in die moderne milit\u00eare geskiedenis
  bestaan het, is die hoverboard -dilemma ''n ontluikende uitdaging namate die weermag
  al hoe meer tegnologie gebruik. Die naamgenoot van hierdie dilemma is die gier van
  2015 waarin Amerikaners regoor die land haastige hoverboards gekoop het. Verbruikers
  was verlief op die nuwe produk, al bied dit nie dieselfde ervaring as Marty McFly
  nie Terug na die toekoms Deel II. Baie wat die produk gekoop het, het nie die uitdagings
  of gevare wat dit inhou, ten volle verstaan nie. Die gewildste uitkoms van die hoverboard
  was waarskynlik video''s op sosiale media van verbruikers wat probeer om die produk
  te gebruik en daarna val en hulself beseer. Afgesien van die sigbaarste veiligheidsrisiko,
  het baie hoverboards onverwags aan die brand geslaan. Namate die gier oplos, is
  baie hoverboards in die kaste gegooi nadat die nuwigheid verdwyn het en nooit weer
  gebruik is nie.\\nNet soos die hoverboard -gier, is dit onwaarskynlik dat logistici
  genoeg tyd het om die toepassings daarvan volledig op te lei en te verstaan wanneer
  die weermag nuwe tegnologie en ander vermo\u00ebns gebruik. Die weermag gee ook
  nie addisionele personeel toestemming om aan nuwe logistieke eise te voldoen nie,
  omdat ''n toename in onderhoudspersoneel ''n afname in maneuverpersoneel sou meebring.
  Hierdie feite belemmer suksesvolle integrasie van nuwe vermo\u00ebns en bou die
  nodige vaardighede op om die toerusting in stand te hou sonder aansienlike ondersteuning
  deur velddiensverteenwoordigers. Boonop word gapings in kommunikasie en ander vermo\u00ebns
  groter tussen die ondersteunde en ondersteunende eenheid.\\nEk het hierdie raaisel
  as ''n bevelvoerder van die onderneming waargeneem terwyl ek probeer het om vaardigheidsstelle,
  WIN-T-stelselopdaterings en nuwe mobiliteitsplatforms in my organisasie te integreer.
  Ondanks die opleiding van nuwe toerusting en talle oefeninge, kon my onderneming
  skaars tred hou met die vaardigheid van ons maneuver op die stelsels of die onderhoudsvereistes.
  Soortgelyk aan die Tuine van klip dilemma, het ek ten gunste van die maneuver -element
  gefouteer teen ''n aansienlike koste vir my eie eenheid se gevegsgereedheid. En
  namate die tegnologiese voordele van die weermag bo dreigemente van naby-eweknie\u00eb
  afneem, sal logistici ekstra spanning ondergaan om ons voordele te behou en te behou.\\nDie
  vier dilemmas van volhoubaarheidsformasies\\nDie logistikus se dilemmatiese verantwoordelikheid\\nAs
  jy ''n man ''n vis gee, gee jy hom ''n dag kos. As jy ''n vis by hom neem, laat
  jy hom ''n dag lank honger. Maar as u die waterbron gryp en behou, sal hy en sy
  kamerade honger ly, dehidreer en die wil om te veg verloor. In die uiterste omstandighede
  sterf die weermag. Toevoerlynverbod bly ''n beproefde manier om ''n le\u00ebr van
  sy vermo\u00eb te ontneem om sy wil op te l\u00ea. Suksesvolle interdikasiebedrywighede
  het die nasionale ekonomie verwoes, die weermag van hul bestaan en moraal beroof
  en ''n reeks lesse gelaat vir die professionele soldaat. Die uitbeelding van hierdie
  historiese mislukkings om die logistieke kapasiteit op ''n kaart te beskerm, lyk
  soos ''n opvallend komplekse, onvoltooide ''verbind-die-kolletjies'' legkaart: die
  Gedrosiaanse woestyn (325 v.C.). Guandu (200 vC). Carrhae (53 vC). Die horings van
  Hattin (1187). Tumu (1449). Die Russiese veldtog (1812). Holly Springs-Vicksburg
  (1862). Kalubara (1914). Singapoer (1942). Wanat (2008). En nog vele meer. Die ambisies
  en die lewe van die le\u00ebrs en soldate wat met hierdie logistieke tekorte gepaardgaan,
  het in baie opsigte ge\u00ebindig met uitgeteerde krygers en nageslag, bevrore aanhangsels,
  gebrek aan wapens, le\u00eb brandstoftenks, ''n verslete gees - of ''n goddelose
  kombinasie van al hierdie en meer . En solank die spies van Mars bewe, sal die rekord
  en liggaamstelling as gevolg van swak beplande en uitgevoerde logistiek toeneem.\\nOnder
  fiskale beperkings in vredestyd prioritiseer die weermag sy \\\"tande\\\" bo sy
  \\\"stert\\\", maar soos die geskiedenis illustreer, moet milit\u00eare leiers hul
  bestendingseenhede se gevegsgereedheid met kreatiwiteit en begrip benader tydens
  periodes van vrede en fiskale beperking. Gevolglik kan taktiese onderhoude -eenhede
  nie opgelei word vir hul oorlogstydpligte sonder ''n mate van (ongewenste) opoffering
  aan gevegseenhede nie. ''Ondersteuning aan die lyn'' hou ''n groot risiko in vir
  personeel en voorrade, maar min manoeuvre -bevelvoerders sal gewilliglik hul taktiese
  vaardigheid en milit\u00eare kundigheid van hul eenhede prysgee oor ''vraagstukke''.
  Nog minder manoeuvre -bevelvoerders sou oorlogsvegters van die lyn haal om voorraad
  te bekom as die ondersteunende eenheid self kon regkom. Om hierdie redes moet jong
  logistici die volgende praktyke oorweeg:\\n- Verminder nou die risiko verantwoordelik
  vir die oorlog van m\u00f4re. Indien moontlik, ontwerp opleiding wat instandhoudingseenhede
  dwing om aan te pas en lesse met ander volhoubaarheidsformasies te deel. Besef dat
  instandhoudingseenhede nie toegerus is om die volgende oorlog te beveg nie. Hersien
  beleid oor afstandsbeheer en ko\u00f6rdineer met toepaslike agentskappe om veilige
  opleiding met ''aanpassings'' en onortodokse platforms moontlik te maak. Onderhoudseenhede
  kan onder hierdie metode belaglik en primitief lyk, maar hulle leer hoe hulle werklik
  sal veg.\\n- Maak van ''administratiewe'' en ''veronderstelde'' onderhoude ''n wanpraktyk
  van die verlede. Logistici is in ''n uitstekende posisie om verandering aan te bring
  en gesonde leerstellings in logistieke aangeleenthede te gebruik. Maak gebruik van
  logistieke kundigheid, maak die korrekte ko\u00f6rdinasie om te doen wat reg is,
  en wees verantwoordelik vir die gevegsgereedheid van die instandhoudingseenheid
  - selfs al veroorsaak dit geringe frustrasie by die ondersteunde eenheid.\\n- Fokus
  op klein eenhede en taktiek. Onderhoudsleiers en literatuur l\u00ea ''n onredelike
  klem op volhoubaarheidsperspektiewe vanuit die operasionele en strategiese oorlogsvlakke.
  Brig. Genl Jesse R. Cross, die vyftigste kwartiermeester -generaal van die Amerikaanse
  weermag, het altyd gespog dat hy ''n agbare kaptein was voordat hy ''n generaal
  -offisier was. Net so moet jong logistici hul energie toespits om hul bemanning
  en groepe suksesvol voor te berei op oorlog voordat hulle die kompleksiteite van
  goed ontwerpte, hoogs komplekse voorsieningskettings probeer begryp.\\n- Prioritiseer
  ondersteuning. Ondersteuningsprioriteite wat in operasionele bevele uiteengesit
  word, word selde gevolg of toegepas. As eenhede ''n \\\"amber\\\" status rapporteer
  en ''n onmiddellike heraanvraag versoek, leer om te wag \\\"wag\\\" in plaas van
  \\\"roger.\\\" Dit is ''n oefening van gedissiplineerde ongehoorsaamheid. ''N Volledig
  bemande verspreidingspeloton wat ''n ligte infanteriebataljon ondersteun, het nie
  meer as sestien gemagtigde personeel om meer as ''n dosyn peloton in vier kompanie
  te ondersteun nie. Onmiddelik om op elke oproep te reageer, is onvolhoubaar.\\nHierdie
  uitbeelding van die ondersteuning van die weermag moet nie ge\u00efnterpreteer word
  as ''n beskuldiging van die weermag, ons regering of die logistikus se gevegswapens
  nie. Dit is ''n bewys van die uithouvermo\u00eb, toewyding en professionaliteit
  van die belofte van die weermag se logistieke korps om die oorwinning op enige slagveld
  te behou. Vir meer as 660 jong logistici wat in 2019 die weermagberoep betree, word
  hul sukses gemeet aan hoe goed hulle daagliks in vrede en oorlog onderhandel oor
  die vier dilemmas. Hulle sal vind dat hul grootste uitdagings sal plaasvind waar
  hierdie dilemmas mekaar sny en geen enkele, universele oplossing toegepas kan word
  wanneer faktore soos eenheidsmissie en kultuur die sukses of mislukking van hul
  pogings om oor hierdie dilemmas te onderhandel, kan be\u00efnvloed nie. Ondersteunde
  eenhede kan ook baat vind by die denke oor volhoubaarheid vanuit hierdie perspektief.
  Maar dit is die professionele logistikus se verantwoordelikheid om te verstaan hoe
  hierdie dilemmas die pogings tot volhoubaarheid kan belemmer en doeltreffende en
  doeltreffende metodes voorstel om dit te hanteer.\\nKaptein Fred Brown is ''n weermag
  -logistieke beampte en instrukteur by die Simon Center van die Amerikaanse Milit\u00eare
  Akademie vir die Professionele Milit\u00eare Etiek. Hy is tans besig om ''n boek
  te skryf waarin logistieke op die voorste linies uiteengesit word Ondersteuning
  aan die lyn: ware verhale oor moed, moed en logistiek.\\nDie menings wat uitgespreek
  word, is die van die outeur en weerspie\u00ebl nie die amptelike standpunt van die
  Amerikaanse Milit\u00eare Akademie, die Departement van die Weermag of die Departement
  van Verdediging nie.\\nLiggame betrokke\\n''N Aantal gepaardgaande beleidskomitees,
  organisasies en agentskappe is betrokke by of ondersteun logistiek. Hulle bestaan
  uit:\\n- die logistieke komitee (LC)\\n- die Petroleumkomitee (PC)\\n- Komitee van
  die Chiefs of Military Medical Services in NATO (COMEDS)\\n- die burgerlike noodbeplanningskomitee
  (CEPC)\\n- die Komitee vir Standaardisering\\n- die NATO Supply and Procurement
  Agency (NSPA)\\n- die Bi-SC* Bewegings- en Vervoerforum (Bi-SC M & ampT Forum)\\n-
  die Bi-SC* Medical Advisory Group (Bi-SC MEDAG).\\n- Brandstofbestuur, wat die Sentraal
  -Europese pyplynstelsel (CEPS) -program insluit\\n- Strategiese vervoer en berging,
  wat die NATO Airlift Management (NAM) -program insluit\\n- Stelselverkryging en
  lewensiklusbestuur\\n- Logistieke dienste en projekbestuur\\n- Ondersteuning vir
  operasies en oefeninge.\\n(*Bi-SC dui aan dat die betrokke formasie aan beide Strategic
  Commanders (SC) rapporteer.)\\nLogistieke komitee\\nDie Logistieke Komitee (LC)
  is die NAVO se hoofkomitee wat handel oor logistiek. Sy algemene mandaat is tweeledig:
  om logistieke aangeleenthede aan te spreek met die oog op die verbetering van die
  prestasie, doeltreffendheid, volhoubaarheid en doeltreffendheid van die Alliansie-magte
  en om namens die Noord-Atlantiese Raad ''n oorkoepelende ko\u00f6rdinerende gesag
  oor die hele spektrum van logistieke funksies binne die NAVO.\\nDit verrig sy werk
  deur middel van vier ondergeskikte liggame waarvan die uitvoerende groep van die
  logistieke komitee en die groep vir beweging en vervoer die belangrikste is. Die
  LC rapporteer gesamentlik aan beide die Milit\u00eare Komitee en die Noord -Atlantiese
  Raad, of die Verdedigingsbeplanningskomitee, soos gepas, wat die afhanklikheid van
  logistiek van beide burgerlike en milit\u00eare faktore weerspie\u00ebl.\\nPetroleumkomitee\\nDie
  Petroleumkomitee (PC) is die senior adviesliggaam in die NAVO vir logistieke ondersteuning
  aan Alliansiemagte oor alle aangeleenthede rakende petroleum, insluitend die NAVO
  -pypleidingstelsel, ander petroleuminstallasies en hanteringstoerusting. Die PC
  is die deskundige liggaam wat aan die LC verantwoordelik is om te verseker dat die
  NAVO kan voldoen aan sy petroleumvereistes in tye van vrede, krisis en konflik,
  insluitend ekspedisie -operasies.\\nDie PC is oorspronklik gestig as die NAVO -pyplynkomitee
  in 1956, maar is daarna twee keer herdoop: een keer in Maart 2008 toe dit die NAVO
  -petroleumkomitee geword het om sy groter rol en verantwoordelikhede beter te weerspie\u00ebl
  en die tweede keer in Junie 2010 tydens ''n groot komitee hersiening, toe dit die
  Petroleumkomitee geword het en onder die LC geplaas is.\\nKomitee van die Chiefs
  of Military Medical Services in NATO\\nDie Komitee van die Hoofde van Milit\u00eare
  Mediese Dienste in die NAVO (COMEDS) dien as die sentrale punt vir die ontwikkeling
  en ko\u00f6rdinering van milit\u00eare mediese aangeleenthede en om mediese advies
  aan die Milit\u00eare Komitee van die NAVO te gee.\\nSiviele noodbeplanningskomitee\\nDie
  Burgerlike Noodbeplanningskomitee (CEPC) is verantwoordelik vir die beleidsrigting
  en algemene ko\u00f6rdinering van burgerlike noodbeplanning en paraatheid op NAVO
  -vlak. Dit vergemaklik integrasie van burgerlike ondersteuning en advies oor burgerlike
  aangeleenthede in die operasionele beplanning van die Alliansie, insluitend die
  moontlike gebruik van milit\u00eare logistieke hulpbronne vir burgerlike noodgevalle.
  Dit ko\u00f6rdineer nou met die LC.\\nKomitee vir Standaardisering\\nDit is die
  senior gesag van die Alliansie om geko\u00f6rdineerde advies aan die Noord -Atlantiese
  Raad te verskaf oor algemene standaardiseringsaangeleenthede. Aangesien die doel
  van NAVO -standaardisering is om die operasionele doeltreffendheid van die Alliansie
  te verbeter deur interoperabiliteit tussen die NAVO -magte te bereik en ook tussen
  die NAVO -magte en die magte van vennote en ander lande, ko\u00f6rdineer dit met
  die LC.\\nNavo se ondersteunings- en verkrygingsagentskap\\nDie NATO Support and
  Procurement Agency (NSPA) is die uitvoerende liggaam van die NATO Support and Procurement
  Organization (NSPO). Dit is in Julie 2012 gestig en bring die NAVO se logistieke
  en verkrygingsondersteuningsaktiwiteite byeen deur produkte en dienste aan te bied
  volgens sy vyf noodsaaklike bedrywighede:\\nBi-SC Bewegings- en Vervoerforum\\nBi-SC
  Bewegings- en Vervoerforum (Bi-SC M & ampT Forum) is in 1996 gestig en is die senior
  forum vir die ko\u00f6rdinering van alliansie-wye bekommernisse oor beplanning oor
  bewegings- en vervoerbeleid tussen strategiese bevelvoerders, NAVO-lede en aangewese
  agentskappe. Bewegings- en vervoerkwessies wat van belang is vir die forum, is die
  gevolg van die bewegings- en vervoerverantwoordelikheid van die NAVO -bevelvoerder
  en van konsepte en beleid wat deur die NAVO -hoofkwartier ontwikkel is.\\nBi-SC
  Mediese Adviesgroep\\nDie Bi-SC Mediese Adviesgroep (Bi-SC MEDAG) bied ''n forum
  vir mediese kwessies tussen die Strategiese Bevelvoerders. Mediese aangeleenthede
  wat vir die groep van belang is, is di\u00e9 wat voortspruit uit die mediese verantwoordelikheid
  van die NAVO -bevelvoerder en uit konsepte en beleid wat deur die NAVO -hoofkwartier
  ontwikkel is.\\nInhoud\\nVroe\u00eb geskiedenis Redigeer\\nBurgeroorlog Redigeer\\nTydens
  die Amerikaanse burgeroorlog was vervoer ''n integrale deel van milit\u00eare logistiek
  deur die organisering van spoorwe\u00eb as ''n lewensvatbare en doeltreffende manier
  van milit\u00eare vervoer. Die Amerikaanse weermag het die bestuur van spoor gesentraliseer
  in die Amerikaanse milit\u00eare spoorweg (USMRR). Die Army Quartermaster het in
  Februarie 1862, ''n volle maand voor die USS Monitor en CSS Virginia vaar. City
  Point, Virginia, in 1864, sou in 1864 die grootste hawe -operasie in die Westelike
  Halfrond word. Teen 1864 het vyf van die nege afdelings in die kwartiermeesterafdeling
  uitsluitlik handel gedryf. ''N Aansienlike aantal gevegte is gewen vanwe\u00eb die
  veldkommandant se vermo\u00eb om troepe en voorrade vinnig en effektief te verskuif.
  Die meeste gewonde soldate is weggevoer in ''n piesangvormige kar wat ''n gondel
  genoem word. [5]\\nSpaans -Amerikaanse oorlog wysig\\nTydens die Spaans -Amerikaanse
  oorlog het die taak om ''n grootliks vrywillige mag na Kuba en die Filippyne te
  mobiliseer en te ontplooi, die behoefte aan ''n aparte vervoerdiens in die kwartiermeesterafdeling
  groter gemaak. Weermagvervoerders het saam met die burgerlike spoorwe\u00eb en die
  maritieme industrie saamgewerk om ''n suksesvolle intermodale operasie saam te stel.
  [5]\\nEerste W\u00eareldoorlog Edit\\nDie Amerikaanse ekspedisiemag wat tydens die
  Eerste W\u00eareldoorlog na Frankryk ontplooi het, beklemtoon die behoefte aan ''n
  enkele vervoerbestuurder. William W. Atterbury, ''n voormalige spoorwegbestuurder,
  is aangestel as brigadier-generaal en word aangestel as die direkteur-generaal van
  vervoer en ''n aparte motorvervoerkorps van die nasionale weermag is op 15 Augustus
  1918 gestig om vragmotors te bestuur. vir vragmotorbestuurders is teen 9 Julie 1918
  gestig [6] en die vervoerkorps van die AEF is na die oorlog afgeskaf, [5] The MTC
  het daarna in 1919 en 1920 transkontinentale motorkonvooie gehou.\\nTweede W\u00eareldoorlog
  Wysig\\nOp 9 Maart 1942 is die Vervoersdiens gestig as deel van die Diens van Voorsiening.
  In Maart 1942 is die vervoersfunksies gekonsolideer in die Vervoersafdeling van
  die nuutgeskepte Verskaffingsdienste. Op 31 Julie 1942 word die vervoerdiens die
  vervoerkorps. [7] Teen die einde van die oorlog het die Transportation Corps meer
  as 30 miljoen soldate binne die kontinentale Verenigde State en 7 miljoen soldate
  plus 126 miljoen ton voorraad oorsee verhuis. [5] Vanaf die begin in Engeland aan
  die einde van Mei 1942 is die Transportation Corps -bedrywighede in die ETO gelei
  deur generaal -majoor Frank S. Ross, wat gekies is deur genl.maj John CH Lee, kommandant
  -generaal, dienslewering (na die D-Day Invasion, die Communications Zone, oftewel
  Com-Z) genoem, die Europese Operasieteater.\\nEen van die grootste prestasies van
  die Transportation Corps, via die Milit\u00eare Spoorwegdiens, was die heropbou
  van Frankryk se gebroke spoorwegnetwerk na D-Day en die vervoer van 1500 lokomotiewe
  en 20.000 spoorwaens spesiaal gebou vir die ligter Franse spoorstelsel wat begin
  met D- Dag +38. Om die proses te bespoedig en vertragings te voorkom wat veroorsaak
  word deur Franse kanaalhavens en dokke wat deur die terugtrekkende Duitsers vernietig
  is, het die Transportation Corps die swaar spoorwegvoorraad oor die kanaal en oor
  die strande gebring in spesiaal geboude LST''s. [8]\\nTerwyl die geallieerde magte
  in die somer van 1944 vinnig deur Frankryk gevorder het, is ''n spesiale vervoeroperasie
  met die bynaam Red Ball Express uitgevoer. Die Red Ball Express het daagliks konvooie
  van vragmotors van geallieerde hawens voorsien om troepe aan die voorkant in ''n
  reuse-eenrigtinglus te voorsien. Daar was ander minder bekende vragmotorroetes:
  die Green Diamond Express het vanuit Cherbourg, suidwaarts, gery om die magte wat
  op Brittanje en Brest ry, te bedien. Later werk die White Ball Highway Express uit
  Le Havre na dieselfde depots wat die Rooi Bal bedien. Later nog het die snelweg
  A B C mannetjies en voorraad van die Belgiese hawe Antwerpen na die voorkant verskuif.
  Die verhaal van die Red Ball Express is in die film van die 1950''s vertel Red Ball
  Express. Daar was ''n kortstondige televisiereeks in die vroe\u00eb sewentigerjare
  Rol uit wat fokus op die ervarings van ''n fiktiewe Afro -Amerikaanse motorvervoereenheid
  wat betrokke is by die Red Ball Express.\\nKoue Oorlog Redigeer\\nDie Koue Oorlog
  tussen die Verenigde State en die Sowjetunie strek van 1945 tot 1991 en strek oor
  die Golfoorlog. Toe die Sowjetunie die stad Berlyn in 1948 afsluit, het die Transportation
  Corps ''n belangrike rol gespeel in die instandhouding van die stad. Twee jaar later,
  op 28 Junie 1950, stig president Harry S. Truman die Transportation Corps as ''n
  permanente tak van die weermag. [5]\\nKoreaanse oorlog wysig\\nTydens die Koreaanse
  Oorlog het die Transportation Corps die VN -magte deur drie winters voorsien. Teen
  die tyd dat die wapenstilstand onderteken is, het die Transportation Corps meer
  as 3 miljoen soldate en 7 miljoen ton vrag geskuif. [5]\\nOorlog in Vietnam\\nIn
  die Vi\u00ebtnam -oorlog was die mees gediversifiseerde verskeidenheid vervoereenhede
  wat ooit saamgestel is. Vir meer as ''n dekade lank het die Transportation Corps
  deurlopend steun verleen aan Amerikaanse en bondgenote deur ''n tropiese omgewing
  wat nie verbeter is nie, met watervaartuie, amfibie\u00eb, motorvragmotors en Transportation
  Corps -vliegtuie. Die vyandelike bedreiging vir konvooie het ''n unieke oplossing
  vereis - geweervragmotors. [5]\\nOp 31 Julie 1986 is die Transportation Corps opgeneem
  in die Amerikaanse weermag se regimentstelsel.\\nGolfoorlog Wysig\\nIn 1990 het
  die Transportation Corps met die aanvang van die Golfoorlog een van sy grootste
  uitdagings gekonfronteer. Tydens Operation Desert Shield en Operation Desert Storm
  bewys die Transportation Corps uit hawens op drie kontinente sy vermo\u00eb om massiewe
  magte te ontplooi en in stand te hou. [5]\\nNa die koue oorlog wysig\\nBedrywighede
  in Somali\u00eb, Rwanda, Ha\u00efti, Bosni\u00eb en Irak het ook ''n groot aantal
  vervoereenhede ontplooi. [5]\\nOperasie Enduring Freedom Wysig\\nToe die koalisiemagte
  Afghanistan binnegeval het, het die Transportation Corps die luglyn van kommunikasie
  na die land oopgemaak en tot 2008 het ''n enkele bewegingskontrolebataljon alle
  logistieke in die streekkommando-Oos bestuur. Namate die aantal brigadegevegspanne
  in 2006 in Afghanistan toegeneem het, het die Transportation Corps met grondkonvooi
  -operasies begin.\\nOperasie Iraqi Freedom Edit\\nDie 143ste vervoeropdrag het die
  hawe oopgemaak en die stoot na Bagdad in Maart 2003 ondersteun. Nadat Bagdad in
  April geval het, het die maneuver -operasie tot ''n volhoubaarheidsoperasie ontwikkel
  met ''n spilpunt en toevoerlyn. Nadat die vyand konvooie begin aanval het, het die
  vragmotorbestuurders gereageer met ''n eeue oue oplossing om vragmotors met staal
  te verhard en masjiengewere by te voeg, en sodoende geweerwaens en konvooi -sekuriteit
  ''n permanente deel van die vervoerdoktrine te maak. Hoe groot die bedreiging ook
  al was, die Transportation Corps het die goedere afgelewer. Tydens Operasie New
  Dawn was die Transportation Corps verantwoordelik vir die heropgradering van al
  die toerusting uit Irak teen die sperdatum van Desember 2012.\\nToe dit in 1942
  gestig is, was dit gevestig in Fort Eustis, Virginia. Die hoofkwartier is na Fort
  Lee verskuif vanaf 2010. [9] Destyds is slegs sewe kursusse vir milit\u00eare beroepspesialiteit
  (MOS) by die nuwe Fort Lee Transportation School aangebied. [9] Byvoorbeeld, die
  vragspesialis (MOS 88H), watervaartuigoperateur (MOS 88K) en watervaartuigingenieur
  (MOS 88L) het by Fort Eustis gebly, wat die hoofhuis van die weermag se watervaartuie
  is. Spoorwegopleiding vir Army Reserve -soldate (MOS''s 88P, 88T en 88U) en burgerlike
  werknemers van die weermag het ook by Fort Eustis gebly, aangesien daar slegs pakhuise
  en geen spoorwegstelsel beskikbaar is vir opleiding by Fort Lee nie. Motorvervoeroperateur
  (vragmotorbestuurder, MOS 88M) word in Fort Leonard Wood, Missouri, aangebied.\\nDie
  navorsing wat in hierdie verslag beskryf word, is geborg deur die Amerikaanse weermag
  en uitgevoer deur die RAND Arroyo Center.\\nHierdie verslag is deel van die RAND
  Corporation Monograph -reeks. RAND -monografie\u00eb bied belangrike navorsingsbevindinge
  aan wat die uitdagings van die openbare en private sektor in die gesig staar. Alle
  RAND -monografie\u00eb word deur streng ewekniebeoordeling ondergaan om ho\u00eb
  standaarde vir navorsingskwaliteit en objektiwiteit te verseker.\\nDaar word toestemming
  gegee om hierdie elektroniese dokument slegs vir persoonlike gebruik te dupliseer,
  solank dit onveranderd en volledig is. Afskrifte mag nie vir kommersi\u00eble doeleindes
  gedupliseer word nie. Ongemagtigde plasing van RAND-PDF''s op ''n nie-RAND-webwerf
  is verbode. RAND PDF''s word beskerm onder die kopieregwetgewing. Besoek die RAND
  -toestemmingsbladsy vir inligting oor herdruk en toestemmings om te koppel.\\nDie
  RAND Corporation is ''n instelling sonder winsbejag wat deur navorsing en analise
  help om beleid en besluitneming te verbeter. RAND se publikasies weerspie\u00ebl
  nie noodwendig die menings van sy navorsingskli\u00ebnte en borge nie.\"", "\"Microsoft
