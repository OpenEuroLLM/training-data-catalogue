  \u0686\u06be\u0648\u0691\u062a\u06d2 \u06c1\u06cc\u06ba\u06d4\\nBanjar (Latin script)
  : Pada tahun 1970, Raymond Damadian, saurang dokter wan ilmuwan panaliti, manamuakan
