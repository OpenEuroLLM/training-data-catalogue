  \u062a\u06be\u0627-\\nBanjar (Latin script) : Pada tahun 1977, Dr. Damadian manuntungakan
  pambangunan pamulaan \u00a8masin MRI sabarataan awak\u00a8, nang disambatnya \u00a8Indomitable\u00a8.\\nUrdu
  : 1977\u0621 \u0645\u06cc\u06ba \u0688\u0627\u06a9\u0679\u0631 \u062f\u0645\u0627\u062f\u06cc\u0626\u0646
