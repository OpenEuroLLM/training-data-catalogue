  Ismail Kandangan\\n- Syair Tajul Muluk karya Kiai Mas Dipura Martapura\\n- Syair
  Intan Permainan (anonim)\\n- Syair Nur Muhammad karya Gusti Zainal Marabahan\\n-
  Syair Ibarat karya Mufti Haji Abdurrahman Siddiq al-Banjari.[29]\\n- Syair Burung
  Simbangan\\n- Syair Burung Bayan dengan Burung Karuang\\nHikayat BanjarSunting\\nHikayat
  Banjar pernah dikaji oleh orang Belanda, Johannes Jacobus Ras, sempena peperiksaan
  doktoralnya di Universiti Leiden pada tahun 1926. Promoternya adalah Dr. A. Teeuw.\\nPetikan
  kisah dalam Hikayat Banjar:\\nMaka dicarinya Raden Samudera itu. Dapatnya, maka
  dilumpatkannya arah parahu talangkasan. Maka dibarinya jala kacil satu, baras sagantang,
  kuantan sabuah, dapur sabuah, parang sabuting, pisau sabuting, pangayuh sabuting,
  bakul sabuah, sanduk sabuting, pinggan sabuah, mangkuk sabuah, baju salambar, salawar
  salambar, kain salambar, tikar salambar. Kata Aria Taranggana: \\\"Raden Samudera,
  tuan hamba larikan dari sini karana tuan handak dibunuh hua tuan Pangeran Tumanggung.
  Tahu-tahu manyanyamarkan diri. Lamun tuan pagi baroleh manjala, mana orang kaya-kaya
  itu tuan bari, supaya itu kasih. Jangan tuan mangaku priayi, kalau tuan dibunuh
  orang, katahuan oleh kaum Pangeran Tumanggung. Jaka datang ka bandar Muara Bahan
  jangan tuan diam di situ, balalu hilir, diam pada orang manyungaian itu: atawa pada
  orang Sarapat, atawa pada orang Balandean, atawa pada orang Banjarmasih, atawa pada
  orang Kuwin. Karana itu hampir laut maka tiada pati saba ka sana kaum Pangeran Tumanggung
  dan Pangeran Mangkubumi, kaum Pangeran Bagalung. Jaka ada tuan dangar ia itu ka
  sana tuan barsambunyi, kalau tuan katahuannya. Dipadahkannya itu arah Pangeran Tumanggung
  lamun orang yang hampir-hampir itu malihat tuan itu, karana sagala orang yang hampir
  itu tahu akan tuan itu. Tuan hamba suruh lari jauh-jauh itu\\\". Maka kata Raden
  Samudera: \\\"Baiklah, aku manarimakasih sida itu. Kalau aku panjang hayat kubalas
  jua kasih sida itu.\\\" Maka Raden Samudera itu dihanyutkannya di parahu kacil oleh
  Aria Taranggana itu, sarta air waktu itu baharu bunga baah. Maka Raden Samudera
  itu bakayuh tarcaluk-caluk. Bahalang-halang barbujur parahu itu, karana balum tahu
  bakayuh.\\nPengaruh Bahasa JawaSunting\\nBahasa Banjar meminjam perkataan dari bahasa
  Jawa seperti banyu (bahasa Jawa Baru), diduga dahulu kata air menggunakan bahasa
  Melayu Kalimantan seperti ai (bahasa Kayong) atau aing (bahasa Kadayan/bahasa Bukit)
  atau mungkin pula menggunakan bahasa Dayak (Barito isolect) yang menggunakan istilah
  danum.\\nBahasa serumpunSunting\\nBerikut ini adalah jadual perbandingan bahasa
  Banjar dengan bahasa-bahasa Melayu setempat di Kalimantan.\\nLihat pulaSunting\\nRujukanSunting\\n-
