  \u0633\u06d2) \u0646\u06d2 \u062f\u0631\u06cc\u0627\u0641\u062a \u06a9\u06cc\u0627
  \u062a\u06be\u0627\u06d4\\nBanjar (Latin script) : Dalam resonansi ngini, medan
  magnet wan galombang radio manyebabkan atom-atom mambarikan sinyal radio nang halus.\\nUrdu
  : \u0627\u0633 \u06af\u0648\u0646\u062c \u0645\u06cc\u06ba\u060c \u0645\u0642\u0646\u0627\u0637\u06cc\u0633\u06cc
