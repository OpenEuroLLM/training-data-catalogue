  link]\"", "\"Anggr\u00e9k Hirang atawa Kersik Luai adalah tanaman matan famili Orchidaceae
  atawa anggr\u00e9k-anggr\u00e9kan. Tananaman ngini tumbuh di Sumatera, Kalimantan,
  Malaysia, wan Pilipina, nang mana tanaman ngini tamasuk tanaman maskut matan Parupinsi
  Kalimantan Timur. Tanaman ngini tamasuk tanaman nang dilindungi lawan pamarintah
  maraga tanaman ngini sudah langka wan jarang ditamui urang. Kambangnya sorang kawa
  mangaluarakan bau harum pada bulan Marit sampai Juni.[1][2]\\nTanaman ngini baisi
  sifat \u00e9pifit atawa barikit di tanaman lain. Rancak tanaman ngini barikit di
  puhun tuha, di parak pantai, atawa rawa di dataran randah nang tapanas.[2]\\nParawakan[babak
  | babak asal-mulanya]\\nTanaman ngini baisi ilat kambang atawa labellum nang saratnya
  bawarna hirang wan baisi gari-garis hijau babulu. Dalam sabuting tandan, ada 1-14
  kuntum kambang nang baisi garis tangah kira-kira 10 santimitir. Daun kalupaknya
  nang bawarna hijau baisi panjang kira-kira 5-6 santimitir wan liarnya kira-kira
  2-3 santimitir, nang mana daun ngini mamanjang wan manajam. Daun mahkutanya nang
  bawarna hijau anum baisi bibir nang bantuknya nang kaya biula bawarna hirang atawa
  cuklat anum, nang mana daun mahkutanya saurang tumbuh mamanjang wan manajam.[1]\\nDaun
  tanaman ngini tamasuk kalumpuk daun nang impar lawan kalumpuk rurumputan atawa Graminae.[3]
  Daunnya babantuk lunjung wan bawarna hijau, lawan jua baisi panjang kira-kira 40-50
  santimitir wan libar kira-kira 2-3 santimitir.[1]\\nTanaman ngini baisi buah nang
  bawarna hirang babantuk jurung nang panjangnya kira-kira 7 santimitir wan libar
  2-3 santimitir. Walaupun ngitu, kada barataan kambang kawa jadi buah.[1]\\nKalangkaan[babak
  | babak asal-mulanya]\\nTanaman ngini sasain langka maraga kambangnya nang bagus
  wan unik, jadinya banyak urang nang bibas maambil tanaman ngini langsung matan hutan
  walaupun pamarintah maulah Paraturan Pamarintah RI No. 7 Tahun 1999 wan Undang-Undang
  No.5 tahun 1990 nang maatur pasal palindungan tanaman ngini. Pasal ngini ditambah
  pulang lawan masyarakat nang balum tahu lawan atura ngini maraga banyak hujungan
  matan sagi ikunumi. Sagan malindungi tanaman ngini, banyak urang mulai mambarikan
  pandidikan pasal palindungan anggr\u00e9k hirang nang kaya panganalan anggr\u00e9k,
  pangambangan budidaya, wan lainnya.[4] Salah sabutingnya yaitu pangambangan anggr\u00e9k
  nang mamakai cara in vitro atawa di daiam laburaturium kultur jaringan tumbuhan.
  Bigi anggr\u00e9k ditanam di m\u00e9dia ulahan di laburaturium wan dibarii macam-macam
  parlakuan kimiawi nang kaya sanyawa urganik wan hurmun tumbuh, fisikawi, atawa biologis.[5]\\nJujuhutan[babak
  | babak asal-mulanya]\\n- ^ a b c d Zapino, Tomi; Fitri, Chairi (2022). Kamus Nomenklatur
  Flora dan Fauna. Jakarta: Bumi Aksara. hlm. 645. ISBN 9786022178521.\\n- ^ a b Rahmatia,
  Diah; Pitriana, Pipit (2007). Buku Pengayaan Seri Flora & Fauna: Si Cantik Anggrek.
  Jakarta: JP Book. hlm. 78. ISBN 9789793487847.\\n- ^ Kartohadiprojo, Nies Sumarti;
  Prabowo, Gandhi (2009). Asyiknya Memelihara Anggrek. Jakarta: Gramedia Pustaka Utama.
  hlm. 21. ISBN 9789792246216.\\n- ^ Wahyudiningsih, Tri Suwarni; Jagau, Y.; Ravenska,
  N. (2018-10-16). \\\"Konservasi Coelogyne pandurata Lindh. di Kalimantan Tengah:
  Karakter Morfologi, Propagasi In Vitro, dan Pelestarian Berbasis Komunitas Lokal\\\".
  Jurnal Pengelolaan Lingkungan Berkelanjutan (Journal of Environmental Sustainability
  Management) (dalam bahasa Inggris): 125\u2013139. doi:10.36813/jplb.2.2.125-139.
  ISSN 2598-0025. Diarsipkan dari versi asli tanggal 2023-03-20. Diakses tanggal 2023-03-20.\\n-
  ^ Untari, Rini; Puspitaningtyas, Dwi Murti (2006-09-06). \\\"The effect of some
  organic compounds and NAA application on the in vitro growth of the black orchid
  (Coelogyne pandurata Lindl.)\\\". Biodiversitas Journal of Biological Diversity
  (dalam bahasa Inggris). 7 (4). doi:10.13057/biodiv/d070409. ISSN 2085-4722.\"",
  "\"Gitaan marupakan buah nang digulungakan dalam satu kaluarga gonol tanaman Apocynaceae
  atau kambuja-kambujaan. Sedangkan ngaran ilmiahnya nintu Willughbeia coriacea[1]
  (Sinonim: Willughbeia firma BL) ngarannya. Buah gitaan bawarna jingga, nang rasa
  dagingnya manis dan sadikit masam. Buahnya saukuran ganggaman tangan urang tuha.
  Kulitnya tabal dangan parmukaan halus ditumbuhi samacam bulu-bulu. Daging kulitnya
  bawarna putih. Saat buah anum, di bagian daging kulitnya saparti spons pina padat
  dangan parmukaan bawarna hijau muda agak kakuningan. Dibawah kulitnya tadapat bagian
  buah nang bajumlah 5-8 bigi. Di dalam daging tadapat biji nang mampunyai kandungan
  lambaga bakaping talu.\\nPuhun buah gitaan mamiliki kulit batang bawarna cuklat
  tuha nang banyak di dalamnya gatah bawarna putih. Daunnya tumbuh pada batang dan
  cabangnya. Bantuk daunnya lonjong memanjang dangan tulang daun menyirip. Parmukaan
  daun ditumbuhi bulu-bulu halus, kada mencilang, nang bawarna hijau anum. Panjang
  daun kurang labih 11-20 sentimeter dangan libar 6-12 sentimeter.[2]\\nRujukan[babak
  | babak asal-mulanya]\\n- ^ Wall., 1832 In: Pl. Asiat. Rar. 3: 45\\n- ^ Rohliansyah,
  Pahmi (2007). Mengenal Buah-Buahan Kalimantan. Yogyakarta: ADICITA KARYA NUSA. hlm.
  19\u201323. ISBN ISBN 979-9246-71-7 Periksa nilai: invalid character\\n|isbn=\\n(bantuan).\"",
  "\"Gunung is\\nGunung is (Bahasa Inggris: iceberg) tu sabuting bungkahan ganal is
  banyu hambar nang hudah tapacah matan gletser atawa ice shelf wan taapung di laut
  nang bibas. Sabab densitas is (920 kg/m3) tarandah pada banyu laut (1025 kg/m3),
  biasanya, kira-kira 90% matan vulum gunung is nang ada di bawah laut, wan rupa hagian
  ngitu ngalih dikira-kira kalunya didasari pada apa nang talihat di parmukaan. Ngini
  ni mamunculakan sabuting istilah yitu paatasan gunung is (tip of the iceberg) nang
  biasanya dipakay gasan masalah atawa kangalihan gasan manggambarakan kalu masalah
  nang kalihatan tu adalah sabagian halus matan masalah nang taganal haja.\"", "\"\u201cMauk
  banar wahini pamarintah, kanapa maka suara adzan disariki pakai toa,\u201d Pii datang
  manamui Alim di rumahnya, sambil mambawa muha masam.\\n\u201cBawa batanang dahulu,
  jangan langsung menggas kaya itu pang. Bawa minum kupi dahulu nah,\u201d Alim mananangkan
  Pii nang tamakan hoax.\\n\u201cIni nah coba lihati habar di WA, pamarintah malarang
  azan pakai toa, bararti kita azan harus bagimit lah? Babisik? Hih!\u201d\\n\u201cHiih
  dasar bujur tu, dasar aturannya hudah wahini azan tu kada bulih nyaring-nyaring.\u201d\\n\u201cAy,
  kanapa ikam. Mana ada kaya itu, azan tu harus nyaring. Sasat ikam ni.\u201d Pii
  panas mandangar pandapat Alim.\\n\u201cCuba am ikam carii ja mana ada urang azan
  nang bekuciak nyaring-nyaring,\u201d si Alim takarinyum.\\nNapa ikam mahuluti aku
  kah! Takaji alisan sasat kah ikam ni?\\n\u201cNah cuba dangari bujur-bujur. Adakah
  urang azan tu nang bakuciak nyaring\u2013nyaring kaitu? Urang tu bila azan \u2018Allahu
  akbar sampai La ilaha Illallah\u2019.\u201d Imbah manjalaskan si Alim tatawa kada
  beampihan.\\nMandangar panjalasan Alim tadi, Si Pii bagaru kapala.\""]'
