  (Latin script) : Kabanyakan bumerang tesadia di Australia sebujurnya kada bebulik.
  Ngitu nyaman gasan pamula-pamula supaya kada manawak beangin\\nUrdu : \u0632\u06cc\u0627\u062f\u06c1
