  dan khabar kiamat, Universitas Riau Press, 2001\"", "\"Tanggui\\nTanggui (Caping)
  adalah panukup kapala urang bibinian nang damintu naung jaka diguna''akan di wayah
  matahari panas manggantang wan mambarangat mancirati bumi. Tanggui ngini biasanya
  dipakai ulih urang bibinian sawayah bajualan di pasar tarapung atawa bagawi di pahumaan.
  Tanggui diulah matan daun rumbia nang rangkanya diulah matan paikat limbah nitu
  kulilingannya disirat (jahit). Tanggui bantuknya satangah bola (dukup). Barang nang
  mahirip lawan tanggui di Jawa dingarani caping nang diulah matan paring babantuk
  karucut. Maulah tanggui daun rumbia, tanpa sabuah katarampilan wan katugulan sarta
  katalitian ayaman tanggui kada pacangan babantuk.[1]\"", "\"Akhirnya ada jua nang
  babaik hati maulahakan wadah gasan buhan kita,.tarima kasih banyak ghasant pa Daeng,,smoga
  jasa pian dibalas Allah dg hal yag lebih baik lagi..\\nUlun dari Sebamban,.jauh
  di pedalaman Kabupaten Tanah Bumbu,.kurang lebih 200 an pal matan Banjarmasin,.tapi
  jalan meleneng haja jadi kawa lakas sampai mun bajalan ke wadah kami,.\\nTahun 80
  an kami datang dari tanah jawa,di lokasi ini,waktu itu masih hutan belantara,.saya
  br berumur 3 th an,.\\nsaya bangga bisa hidup,berkarya dan mengabdi untuk Banua,.\\nBuat
  Pa Deng,.Urang Bugis 35 % menghuni Kab. Tanah Bumbu,.tinggal disepanjang pesisir,.jadi
  pak daeng ga usah kwatir kalo tdampar di Tan-bu,banyak sodara kita disini,.\\ndan
  kita semua sesungguhnya adalah bersaudara....\\nMaaf Kalu ulun kada tapi bisa bbahasa
  banjar nang baik wan fasih,.\\nsalam buat semua warga Banua\\n\\\"Haram Manyarah
  Waja Sampai Kaputing \\\"\"", "\"Disarikan dari Pengajian KH Ahmad Zuhdiannoor (Guru
  Zuhdi Banjarmasin)\\nSyukuri nang Ada, Kada Usah Sahutang-hutangAKHLAK orang shaleh
  di zaman dahulu, mereka-mereka itu tidak membangun rumah atau bangunan apapun, kecuali
  bangunan itu memang mereka hajatkan dan benar-benar mereka perlukan.\\nDengan kata
  lain, orang-orang di zaman bahari, hati mereka sangat menyukuri apa yang sudah ada
  pada mereka, sehingga mereka hanya membangun rumah atau bangunan lainnya dikarenakan
  benar-benar diperlukan saja. Begitupun dengan kebutuhan-kebutuhan duniawi lainnya,
  mereka kada handak mamaksa diri untuk mendapatkan nang kadada.\\nMereka tahu, mamaksa-akan
  diri, mausahai, mancangkali, atawa mancari nang baluman ada itu, bisa membuat mereka
  kada ingat menyukuri nang ada. Bahasa lainnya, karena mahaga nang balum ada, kada
  ingat manyukuri nang sudah ada.\\nNah, di zaman sekarang ini, dimana kita dapat
  dengan mudah memiliki rumah atau keperluan lainnya dengan cara kredit, dimana nafsu
  kita dimanja-akan banar oleh dunia, kita handak apa aja kawa, padahal di tangan
  kada baisi duit apa-apa.\\nMaka dengan kondisi zaman yang seperti itu, perlu disampaikan
  dan benar-benar harus diperhatikan, amunnya manukar barang dengan cara seperti itu
  (kredit), perlu diingatakan saat akad, akad-akan dengan harga satuntungnya. Jadi
  misal kreditnya Rp 500 ribu per bulan, kali-akan kreditnya berapa bulan, misalnya
  15 tahun, berarti duitnya Rp 90 juta. Maka akadnya, \u201ckujual rumah lawan ikam
  Rp 90 juta\u201d dan disahut \u201ckutukar rumah lawan ikam Rp 90 juta\u201d.\\nKaya
  itu jua mun mangaridit kandaraan. Misalnya bulanannya Rp 600 ribu dikali berapa
  tahun, misal total akhirnya Rp 18 juta, berarti akadnya \u201ckujual kandaraan lawan
  ikam Rp 18 juta\u201d dan disahut \u201ckutukar kandaraan lawan ikam Rp 18 juta\u201d,
  walaupun harga kontan kandaraan itu misalnya Rp 15 juta.\\nDengan cara seperti itu,
  maka rumah nang kita akad-akan tadi, kandaraan nang kita akad-akan tadi, statusnya
  sudah milik kita karena sudah kita akad-akan, cuma duitnya aja belum dibayar. Sesuai
  perjanjian, bayari-ai tunggal bulanan kreditnya.\\nPun demikian, sebelum kita bujur-bujur
  handak mengredit, sebaiknya sembahyang hajat dulu lawan Allah. Bedoa, bepadah wan
  Allah; \u201cYa Allah, ulun handak baisi rumah, tapi duitnya kadada. Ulun bapadah
  lawan pian, ulun minjam duit pian. Ulun yakin, kawa aja pian mambayari\u201d.\\nIngatakan
  bapadah dulu wan Allah. Jangan sampai saat handak bahutang, kita kada ingat bapadah
  lawan Allah. Karena kita kada tahu apa yang akan terjadi dalam kehidupan kita. Bisa
  jadi hitung-hitungan kita luput. Kita nang misalnya bapingkut lawan toko, mahitung
  bahwa kredit bisa dibayar dari usaha toko, siapa nang tahu dua tiga bulan ke depan
  tokonya kebakaran, kamana lagi mangadu? Makanya bapadah dulu wan Allah!\\nTapi mudah-mudahan,
  kita sabaraan kada sampai talilit hutang, apalagi hutang nang babunga-bunga. Mudahan
  jangan ada, mudahan kita berataan dilepasakan Allah daripada hutang. Apalagi sampai
  menderita membayari hutang-hutang nang babunga.\\nRingkas kata, mun handak bahutang,
  cari-i nang bahutang 100, bayarnya 100 jua. Atau bahutang 100 bayarnya 90. Itu aja
  nang dicari-i. Mun ada urang nang handak mahutangi 100 bayarnya 150, kada usah gin.
  Kada usah gin, kasian ikam. Tasiksa ikam kaina. Nang 100 ni aja balum tantu kawa
  bayar, apalagi harus bayar 150. Nang 100 ni aja jadi pikiran, apalagi bayarannya
  150, kada usah ah. Kasian ikam, kasian bini ikam, anak cucu ikam. Bini nakal, anak
  cucu nakal gara-gara tamakan duit nang diharamakan oleh Allah SWT.\\nPokoknya mun
  kada baisi baras baranai, bila kada baisi iwak baranai, bila garing baubat, bila
  mati patak! Hidup kada perlu dipermasalahkan, nang penting kita lawan Allah. Kalau
  kita kada mampu makan, kada usah makan! Kalau kada mampu baubat, kada usah baubat!
  Nang penting jangan dipaksa-akan!\\nBabinian ni lah, daripada hari-hari makan di
  warung, baik bamasak di rumah, jelas lebih murah. Mun sekali-sekali boleh, tapi
  jangan hari-hari. Kasian laki nang bacari, apalagi gawian laki misalnya sakit jua,
  apalagi sampai tahutang-hutang hanya karena manurutakan kahandak makan di warung
  satiap hari. Baik bamasak di rumah, biar iwaknya sapat karing, insya Allah nyaman
  haja asal kita musyahadah.\\nKesimpulannya, sebagaimana akhlak orang-orang shaleh
  bahari nang hati mereka sangat menyukuri apa yang sudah ada pada mereka, dan mereka
  kada handak mamaksa diri untuk mendapatkan nang kadada, maka hendaklah kita jua
  senantiasa menyukuri nang ada, dan kada perlu mamaksa diri untuk mandapat-akan nang
  kadada.\\nSyukuri nang ada haja, walau bahutang itu boleh (dengan catatan nilai
  yang diakadkan adalah nilai total yang dikredit sebagaimana ulasan di atas, red),
  tapi mun kawa kada usah sahutang-hutang, apalagi hutangnya nang babunga-bunga.\\nMudahan
  jangan ada lagi kaum muslimin nang bahutang itu babunga. Dan mudahan jangan ada
  kaum muslimin nang mahutangakan itu babunga. Mudahan kita selamatan berataan, aamin
  ya Rabbal\u2019alamin.[]\\n** Kitab Ilmunnibras Karangan Habib Abdullah bin Alwi
  bin Hasan al-Atthas\"", "\"Melayu-Bugis adalah bubuhan Melayu (Johor, wan Pattani)
  nang tulak maadam ka Sulawesi Selatan tumatan tahun 1490. Parantau-parantau nang
  ini ayungannya kaina maranakakan katurunan nang baperan panting di kerajaan-kerajaan
  Sulawesi Selatan, Riau, wan Semenanjung Malaysia.\\nWayah tahun 1542, Antonio de
  Paiva saurang petualang Portugis balabuh di Siang, sabuah karajaan tuha di pasisir
  selatan Makassar. De Paiva mamadahakan sawayah balabuh inya tatamu lawan urang Melayu
  di Siang. Bubuhan Melayu bagana di kampung Melayu langkap lawan susunan masyarakat
  nang taatur tumatan tahun 1490.[1] Manuel Pinto nang datang di Siang wayah tahun
  1545, mamadahakan bahwa urang Melayu di Siang bajumlah sakira 40.000 jiwa. Wayah
  jaman pamarintahan Karaeng Tumaparisi Kallonna (1500-1545), urang Melayu sudah manajak
  kampung di Mangallekana, subalah utara Somba Opu ibu kota kerajaan Gowa. Wayah jaman
  Karaeng Tunipallangga, urang Melayu ma''utus Datuk Nakhoda Bonang maarak ma''aturi
  kapada raja Gowa mancatu supaya Mangallekana dibari''i hak otonomi.\\nLimbah datangan
  bubuhan urang Melayu ka kerajan Gowa, peranan bubuhannya kada tikas sabagai padagang
  wan ulama haja, tapi bubuhan jua gin bapangaruh kapada kahidupan sosial wan politik
  kerajaan. Basarnya jumlah wan peranan bubuhan urang Melayu di kerajaan Gowa, manyababkan
  raja Gowa XII Karaeng Tunijallo (1565-1590) manajak sabuah masigit di Mangallekana
  gasan bubuhan urang Melayu, padahal wayahitu raja baluman masuk Islam.[2] Dalam
  struktur kakuasaan karajaan Gowa, banyak bubuhan urang Melayu ma''ingkut peranan
  panting di istana kerajaan. Wayah masa pemerintahan raja Gowa X (1546-1565), saurang
  katurunan Melayu badarah campuran Bajau, Daeng Ri Mangallekana diangkat jadi syahbandar
  karajaan. Imbah wayah itu sacara turun manurun jabatan syahbandar dijabat ulih urang
  Melayu haja. Jabatan penting lainnya ialah sabagai juru tulis istana. Di masa Sultan
  Hasanuddin (1653-1669), saurang Melayu Incik Amin jadi juru tulis istana sakaligus
  panyair.\\nPeranan bubuhan Melayu di karajaan tamasuk jua dalam hal sastra wan pangajaran
  agama Islam. Babarapa buting naskah kaagamaan wan karya-karya sastra ditarjamahakan
  tumatan bahasa Melayu ka bahasa Bugis. Nangkaya Hikayat Rabiatul Adawiah, Hikayat
  Isma yatim, Hikayat Muhammad Hanafiah, Hikayat Shahi Mardan Ali Al Murtada, Hikayat
  Puteri Jauhar Manikam. Tradisi intelektual batarus sampay abad ka-19 sawayah manggawi
  panulisan ba''asa pulang Sureg I Lagaligo karya sastrawan Melayu Johor, Ratna Kencana
  atawa Collipujie Arung Pancana Toa Datu Tanate.\\nTumatan babarapa buting sumber
  kawa diketahui bahwa sampay tahun 1615, roda parekonomian Sulawesi khususnya pardagangan
  antarpulau nang malalui palabuhan Makassar dikuasai oleh urang Johor wan Pattani.
  Bubuhan urang Melayu nang sudah bamukim di Sulawesi tumatan ba''abad-abad bahari
  tatap ba''isi hubungan dagang lawan negeri asalnya di tanah semenanjung wan kapulawan
  Riau. Tumatan tahun 1511, bubuhan padagang Melayu sudah membawa baras tumatan Sulawesi
  ka Malaka. Pamulaannya wayah tahun 1621, di bawah kakuasaan Daeng Manrabia Sultan
  Alauddin (1593-1639), bubuhan urang Bugis mulai jua umpatan ambil bagian nang penting
  di dunia pardagangan wan palayaran Nusantara.\\nKada kawa diketahui pasti wayahapa
  urang Melayu Pattani wan Johor mulai bamukim di Makassar. Beberapa sumber lokal
  menyatakan bahwa kedatangan urang Pattani wan Johor kada lawas imbah kejatuhan Malaka
  ke tangan Portugis pada tahun 1511. Kehadiran Portugis di Malaka menyebabkan kepentingan
  urang Johor dan Pattani manjadi taganggu.\\nDatuk Leang Abdul Kadir dan Tuan Fatimah
  dikenal sabagai cikal bakal kaluarga Melayu asal Pattani. Sedangkan Datuk Makotta
  dan Tuan Engku Zahara merupakan cikal bakal kaluarga Melayu. Di Makassar terjadi
  perkawinan antara urang Pattani lawan Johor, nang ditandai adanya perkawinan Tuan
  Aminah, putri Leang Abdul Kadir lawan Tuan Rajja, putra Datuk Makotta. Perkawinan
  ini biasa diberi gelar incek. Kemudian terjadi pula perkawinan antara urang Melayu
  lawan urang Bajau, nang diberi gelar kare. Perkawinan antara kare dan incek, melahirkan
  generasi masyarakat Melayu-Bugis nang dikenal lawan sebutan tubaji (bahasa Makassar)
  dan tudenceng (bahasa Bugis). Sepanjang kurang lebih 150 tahun telah terjadi perkawinan
  campuran di antara para bangsawan Bugis-Makassar lawan urang-urang Melayu. Keturunannya
  kada lagi menyebut diri sabagai urang Melayu, melainkan menyebut diri sabagai urang
  Bugis atau urang Makassar.\\nSawayah kajadian ketegangan antara kerajaan Gowa lawan
  VOC nang barabut dominasi ekonomi di Indunisia timur tumatan wayah pamulaan abad
  ka-17, urang Melayu wan urang Jawa nang bagawi di kantor-kantor asing mandapat \\\"pukulan
  nang barat\\\". Kerajaan curiga banaran lawan urang Melayu nang umpat bagawi dalam
  kegiatan pardagangan bangsa Walanda di Makassar. Kecurigaan nang ini kaputingannya
  sampay puncaknya sawayah karajaan Gowa kalah dalam perang Makassar (1667-1669) nang
  ba''akibat bubuhan Melayu diundurakan matan kerajaan. Perang Makassar mamaksa Sultan
  Hasanuddin manandatangani Perjanjian Bongaya nang bujur-bujur marugiakan Gowa. Akibat
  parjanjian nang ini, bubuhan urang Melayu nang mamingkut jabatan di karajaan lawan
  jua urang Bugis nang lainnya umpat jua tulak maninggalakan Sulawesi manuju karajaan-karajaan
  di tanah Melayu.\\n- Bacharuddin Jusuf Habibie - Presiden RI ke-3\\n- Raja Ali Haji
  - Sastrawan Melayu\\n- Kemas Andi Syarifuddin - Sejarawan Palembang\\n- Tun Abdul
  Razak - Perdana Menteri Malaysia ke-2\\n- Sultan Ibrahim Ismail - Sultan Johor dan
  Yang Dipertuan Agong Malaysia\\n- Sultan Alauddin Ahmad Syah - Sultan Aceh ke-25\\n-
  Sultan Alauddin Johan Syah - Sultan Aceh ke-26\\n- Sultan Alauddin Mahmud Syah I
  - Sultan Aceh ke-28\\n- Sultan Badruddin Johan Syah - Sultan Aceh ke-27,29 dan 31\\n-
