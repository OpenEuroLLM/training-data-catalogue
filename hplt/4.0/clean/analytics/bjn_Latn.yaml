  \u0633\u06d2 \u0641\u0648\u0646 \u06a9\u06d2 \u0630\u0631\u06cc\u0639\u06c1 \u0628\u0631\u0627\u06c1
  \u0631\u0627\u0633\u062a \u0628\u064f\u06a9 \u06a9\u0631\u0648\u0627\u0646\u0627
  \u0686\u0627\u06c1\u06cc\u0626\u06d2\u06d4\"", "\"Allah bapandir lawan kita melalui
  Alkitab. 2 Timotius 3:16\\nBahari, Allah maarahakan bubuhan lalakian nang Sidin
  pilih gasan manulisakan pikiran Sidin dalam kitab suci, ngarannya Alkitab. Sidin
  handak Pian tahu habar nang penting di dalamnya.\\nAllah bujur-bujur tahu apa nang
  paling baik gasan kita sabarataan. Amun Pian mandangarakan Sidin, Pian tahu mana
  nang bujur wan mana nang salah.\\nAllah handak sabarataan urang mambaca Alkitab.
  Makanya, wayah ngini Alkitab di ulah dalam banyak bahasa.\\nAmun Pian handak mandangarakan
  Allah, Pian musti mambaca wan mangarti isi Alkitab.\\nDimana haja, banyak urang
  nang balajar tentang Allah. Matius 28:19\\nSaksi-Saksi Yehuwa katuju membantui Pian
  mangarti isi Alkitab.\\nDimana haja, bubuhannya malajari apa nang bujur tentang
  Allah.\\nAmun Pian balajar, pian kada usah babayar apa-apa. Pian kawa jua balajar
  di tempat ibadah Saksi-Saksi Yehuwa nang paling parak di daerah Pian.\"", "\"Ahmad
  Fahmi Zamzam\\nK.H. Ahmad Fahmi bin Zamzam, M.A. nang baisi ngaran pena Abu Ali
  Al-Banjari An-Nadwi Al-Maliki (lahir di Amuntai, Hulu Sungai Utara, Kalimantan Selatan,
  9 Juni 1959; umur 61 tahun) adalah saurang ulama asal Kalimantan Selatan nang sajak
  labih matan dua puluh tahun nang dahulu inya imbah mangabdiakan dirinya di Kedah,
  Malaysia, wan di wadah-wadah lain. Dihiga itu inya tarus mangajar wan badakwah di
  Kalimantan Selatan, Kalimantan Tengah, Kalimantan Timur wan dairah-dairah lain di
  Indunisia.\"", "\"Wilangan\\nWilangan adalah suatu konsep matamatika nang diguna''akan
  hagan pancacahan wan pangukuran. Simbul atawa lambang nang diguna''akan hagan mawakili
  suatu wilangan disambat sabagai angka atawa lambang wilangan. Dalam matamatika,
  konsep wilangan salawas batahun-tahun lawasnya hudah diparlumbah hagan maliputi
  wilangan nol, wilangan negatif, wilangan rasional, wilangan irasional, dan wilangan
  kompleks.\\nWilangan bahari (candra sengkala?)Sunting\\nDijuhut matanSunting\\n-
  Amir Hasan Kiai Bondan, Suluh Sejarah Kalimantan\"", "\"Kalteng kawa jua disambat
  Banua Banjar ke-2 marga di Kalteng banyak banar Urang Banjar. Hampir 1 juta Urang
  Banjar badiam di Kalteng atau sekitar 40% dari 2,5 juta penduduk Kalteng. Urang
  Banjar di Kalteng kebanyakan badiam di Kapuas, Palangkaraya, Sampit wan Pangkalan
  Bun.\\nUrang Banjar di Kalteng bagawi di macam-macam gawian, ada nang pedagang,
  pengusaha, pejabat samuaan ada. Urang Banjar di Kalteng dikenal sebagai pedagang
  nang mendominasi perekonomian. Nang bajualan keperluan sehari-hari kaya sembako,
  makanan, pakaian sampai emas, elektronik, ponsel di Kalteng mayoritas urang Banjar.
  Ruko wan toko banyak nang ampun urang Banjar jua. Masakan Banjar kawa didapati dimana-mana
  di Kalteng nangkaya Soto Banjar, Katupat Kandangan sampai wadai-wadai Banjar sudah
  jadi makanan khas Kalteng.\\nUrang Banjar adalah peran utama dalam pembangunan ekonomi
  di Kalteng. Tapi kada cuma di ekonomi, Urang Banjar rancak jua memimpin pemerintahan
  di Kalteng, nangkaya di Kotawaringin Timur (Sampit), bupatinya Supian Hadi urang
  Banjar (Kotabaru). Bupati Kapuas sebelumnya nang wayahini jadi anggota DPD mawakili
  Kalteng, M.Mawardi sidin urang Banjar (Amuntai). Baharuddin H. Lisa nang pernah
  menjabat bupati Barito Selatan sidin urang Banjar jua (Danau Panggang). Banyak lagi
  Urang Banjar baik nang lahir di Kalsel atau di Kalteng nang jadi bupati di Kalteng.\\nUlama
  di Kalteng rata-rata Urang Banjar jua, nangkaya Ahmadi Isa (Amuntai), sidin guru
  besar Unpar nang jua menjabat ketua MUI Kalteng. Sidin jua Ketua Kerukunan Bubuhan
  Banjar Kalteng.\\nBahasa Banjar sudah jadi bahasa hari-hari di Kalteng utamanya
  di Palangka Raya, Sampit wan Kapuas. Sebagian wilayah Kalteng pernah masuk dalam
  wilayah Kesultanan Banjar. Sudah mulai lawas sampai bahini Kalteng jadi wilayah
  Urang Banjar gasan merantau. Apalagi sesudah tahun 1960-an, peluang ekonomi di Kalteng
  maulah banyak Urang Banjar pindah ke Kalteng. Daerah-daerah Pahuluan/Banua Anam
  di Kalsel merupakan daerah nang padat penduduk nang mulai lawas urang Banjar Pahuluan
  katuju merantau, baik ke Kalteng, Kaltim, Sumatera maupun Pulau Jawa. Selain urang
  Banjar, urang Jawa jua banyak masuk ke Kalteng lewat transmigrasi.\\nMudahan urang
  Banjar Kalteng kawa makin melestariakan budaya Banjar di Kalteng. Urang Banjar jua
  tetap jaga persatuan wan jangan bacakut papadaan, tetap kada melapas adat budaya
  identitas Banjar biar madam ka Banua urang.Paling kada kita rajin menyetel lagu-lagu
  Banjar wan memakai kain khas Banjar sasirangan atau laung. Kesenian Banjar nangkaya
  madihin, panting, lagu Banjar wan tarian Banjar jua harus kita lestariakan biar
  di perantauan. Urang Banjar perantauan jua harus bisi peran penting dalam pembangunan
  daerah baik di Banua maupun perantauan.\\nNang penting jua urang Banjar harus menjaga
  kerukunan wan suku-suku lain, apalagi Kalteng adalah wilayah multi etnis, ada urang
  Banjar, Dayak, Jawa, Batak, Bali, Madura, Sunda wan suku-suku lain, Urang Banjar
  harus menjaga wan mengayomi perdamaian di Kalteng supaya konflik etnis nang dulu
  pernah ada kada tejadi lagi.\\nKalteng juga bisa disebut Banua Banjar ke-2 karena
  di Kalteng sangat banyak Orang Banjar. Hampir 1 juta Urang Banjar tinggal di Kalteng
  atau sekitar 40% dari 2,5 juta penduduk Kalteng. Orang Banjar di Kalteng kebanyakan
  tinggal di Kapuas, Palangka Raya, Sampit dan Pangkalan Bun.\\nOrang Banjar di Kalteng
  bekerja di bermacam-macam profesi, dari pedagang, pengusaha, pejabat semua ada.
  Orang Banjar di Kalteng dikenal sebagai pedagang yang mendominasi perekonomian.
  Yang menjual keperluan sehari-hari seperti sembako, makanan, pakaian sampai emas,
  elektronik, ponsel di Kalteng mayoritas orang Banjar. Ruko dan toko banyak dimiliki
  orang Banjar juga. Masakan Banjar bisa dimana-mana di Kalteng seperti Soto Banjar,
  Ketupat Kandangan sampai kue-kue Banjar sudah jadi makanan khas Kalteng.\\nUrang
  Banjar adalah peran utama dalam pembangunan ekonomi di Kalteng. Tapi tidak hanya
  di ekonomi, Orang Banjar juga ada yang memimpin pemerintahan di Kalteng, seperti
  di Kotawaringin Timur (Sampit), bupatinya Supian Hadi orang Banjar (Kotabaru). Bupati
  Kapuas sebelumnya yang sekarang menjadi anggota DPD mewakili Kalteng, M.Mawardi
  ia orang Banjar (Amuntai). Baharuddin H. Lisa yang pernah menjabat bupati Barito
  Selatan ia orang Banjar juga (Danau Panggang). Banyak lagi Orang Banjar baik yang
  lahir di Kalsel atau di Kalteng yang jadi bupati di Kalteng. Semoga ada orang Banjar
  yang akan menjadi gubernur Kalteng.\\nUlama di Kalteng rata-rata Orang Banjar juga,
  seperti Pak Ahmadi Isa (Amuntai), ia guru besar Unpar yang juga menjabat ketua MUI
  Kalteng. Ia juga Ketua Kerukunan Bubuhan Banjar Kalteng.\\nBahasa Banjar sudah menjadi
  bahasa sehari-hari di Kalteng terutama di Palangka Raya, Sampit dan Kapuas. Sebagian
  wilayah Kalteng pernah masuk dalam wilayah Kesultanan Banjar. Sudah sejak lama hingga
  sekarang Kalteng menjadi wilayah Orang Banjar merantau. Apalagi sesudah tahun 1960-an,
  peluang ekonomi di Kalteng membuat banyak Orang Banjar pindah ke Kalteng. Daerah-daerah
  Pahuluan/Banua Anam di Kalsel merupakan daerah yang padat penduduk yang sejak lama
  orang Banjar Pahuluan suka merantau, baik ke Kalteng, Kaltim, Sumatera maupun Pulau
  Jawa. Selain orang Banjar, orang Jawa juga banyak masuk ke Kalteng lewat transmigrasi.\\nSemoga
  dengan adanya Kerukunan Bubuhan Banjar Kalteng bisa semakin melestarikan budaya
  Banjar di Kalteng yang sudah banyak ditinggalkan. Orang Banjar tetap jaga persatuan
  dan jangan bertengkar antarsesama, tetap tidak melapas adat budaya identitas Banjar
  walau merantau ke Banua orang. Paling tidak kita rajin memainkan atau mendengarkan
  lagu-lagu Banjar dan memakai kain khas Banjar sasirangan atau laung. Kesenian Banjar
  seperti madihin, panting, lagu Banjar dan tarian Banjar jugaa harus kita lestariakan
  walau di perantauan. Urang Banjar perantauan juga harus punya peran penting dalam
  pembangunan daerah baik di Banua maupun perantauan.\\nYang penting juga orang Banjar
  harus menjaga kerukunan denan suku-suku lain, apalagi Kalteng adalah wilayah multi
  etnis, ada orang Banjar, Dayak, Jawa, Batak, Madura dan suku-suku lain, Orang Banjar
  harus menjaga dan mengayomi perdamaian di Kalteng supaya konflik etnis nang dahulu
  pernah ada tidak tejadi lagi.\"", "\"Badapatan pandir\\nBadapatan pandir atawa gelar
  wicara (basa Inggris: talk show; chat show) adalah sabuting janis acara tilipisi
  atawa radio nang barupa pamandiran saikung atawa sakalumpuk urang \\\"tamu\\\" pasal
  sabuting bahan pamandiran tatantu (atawa bamamacam bahan pamandiran) lawan dipandu
  ulih pamandu badapatan pandir. Tamu dalam sabuting badapatan pandir rancaknya tadiri
  matan urang-urang nang sudah mampalajari atawa baisi pangalaman luas nang takait
  lawan masalah nang rahatan dipandirakan. Sabuting badapatan pandir kawa dibawaakan
  lawan gaya rasmi wan jua santai wan bahanu kawa manarima talipun barupa patakunan
  atawa tanggapan matan pamirsa atawa urang di luar studio.\"", "\"Gangan Haliling
  marupakan salah sabuting makanan khas Banjar. Makanan ngini babahan utama haliling.[1]
  Bahan-bahan nang diparluakan gasan maulah gangan haliling antara lain; haliling
  nang hudah ditatak buntutnya wan dibasuh barasih, batang serai, lengkuas, daun salam,
  santan, banyu, minyak wijen, kaldu bubuk, uyah, gula, lombok parawit, bawang bombay,
  bawang habang, bawang putih, wan kamiri.[2]\\n- ^ \\\"Aneka Kuliner Banjar Berpotensi
  Mengangkat Arus Wisatawan\\\". kumparan (dalam bahasa Indonesia). Diakses tanggal
  2024-09-28.\\n- ^ \\\"Resep Gangan Haliling (Tutut/Keong Sawah/Siput Masak Berkuah)
  oleh Evana Tati \u2705\\\". Cookpad (dalam bahasa Indonesia). 2020-07-04. Diakses
  tanggal 2024-09-28.\"", "\"Bahasa Banjar\\nBahasa Banjar[2] adalah satu bahasa Austronesia
  yang dipertuturkan oleh suku Banjar[3] di Kalimantan Selatan, Indonesia, sebagai
  bahasa ibunda.\\nBahasa Banjar adalah cabang bahasa yang berkembang dari Bahasa
  Melayu. Bahasa ini berasal dari provinsi Kalimantan Selatan yang terdiri daripada
  Banjar Kandangan, Amuntai, Alabiu, Kalua, Alai, dan lain-lain. Bahasa Banjar dihipotesiskan
  sebagai bahasa proto-Malayik, sama seperti bahasa Minangkabau dan bahasa Serawai
  (Bengkulu).\\nSelain Kalimantan Selatan, bahasa Banjar yang asalnya berupa bahasa
  suku kaum juga menjadi lingua franca di kawasan-kawasan lain, iaitu Kalimantan Tengah
  dan Kalimantan Timur serta di daerah Kabupaten Indragiri Hilir, Riau, sebagai bahasa
  perantaraan sesama suku.[4][5]\\nBahasa Banjar banyak dipengaruhi oleh bahasa Melayu,
  Jawa dan bahasa-bahasa Dayak.[6][7] Bahasa Banjar dipercayai mempunyai hubungan
  dengan bahasa Kedayan (Brunei) dan sering pula disebut Bahasa Melayu Banjar.[8][9]
  Dalam perkembangannya, bahasa Banjar nampaknya terlalu banyak meminjam perkataan
  dari bahasa Indonesia dan bahasa-bahasa asing.[10] Namun demikian, bahasa Banjar
  berada dalam kategori yang masih jauh dari kancah kepupusan kerana ia masih digunakan
  sebagai bahasa perbualan seharian oleh masyarakat Banjar mahupun pendatang.[11]
  Kini, Bahasa Banjar sudah diajarkan di sekolah-sekolah di Kalimantan Selatan sebagai
  matapelajaran setempat.[12]\\nPenyebaranSunting\\nSecara geografi, suku Banjar pada
  mulanya mendiami hampir seluruh wilayah provinsi Kalimantan Selatan, tetapi sekarang,
  kesan perpindahan atau percampuran penduduk dan kebudayaannya di dalam proses selama
  ratusan tahun yang lalu, suku Banjar dan bahasa Banjar tersebar meluas sampai ke
  kawasan pesisir Kalimantan Tengah dan Kalimantan Timur, bahkan juga banyak didapati
  di beberapa tempat di pulau Sumatera yang sebenarnya menjadi kawasan petempatan
  Banjar sejak dahulu kala seperti di Muara Tungkal, Tembilahan, dan Sapat. [13]\\nSelain
  di pantai timur pulau Sumatera, bahasa Banjar dapat dijumpai juga pada perkampungan
  Suku Banjar[14]yang ada pantai barat semenanjung Malaya di Malaysia Barat[15] (Perak
  Tengah, Krian, Pahang, Kuala Selangor, Batu Pahat, Kuala Lumpur[16], walaupun suku
  Banjar di Semenajung Malaysia disebut sebagai orang Melayu, tetapi di luar wilayah
  Semenanjung Malaysia, seperti di Sabah dan Sarawak misalnya di bahagian Tawau masih
  menggelar dirinya sebagai orang Banjar.[17][18]\\nMenurut Cense,[19] bahasa Banjar
  dituturkan oleh para penduduk di sekitar Banjarmasin dan Hulu Sungai. Kesan penyebaran
  penduduk, bahasa Banjar sampai di Kutai dan tempat-tempat lain di Kalimantan Timur.
  Walhal Den Hamer[19] menentukan tempat bahasa Banjar itu di samping daerah Banjarmasin
  dan Hulu Sungai sampai pula ke daerah pulau Laut (Kalimantan Tenggara) dan Sampit
  yang secara administratif pemerintahan termasuk provinsi Kalimantan Tengah sekarang
  ini.[19] Dibandingkan dengan pendatang-pendatang dari daerah lain yang umumnya masih
  mempunyai ikatan yang cukup kuat dengan kawasan asalnya, dan juga suku-suku lain
  dari kawasan asal itu seperti perantau Minang, Bugis dan Madura, pola perantauan
  suku Banjar adalah berbeza. Perantau Banjar cenderung merantau hilang, yakni tidak
  lagi menjalin hubungan dengan orang-orang kawasan asal, tidak banyak surat-menyurat
  dan jarang pulang ke kawasan asal, namun tidak sama sekali melupakan kebanjarannya.
  Satu ciri kebanjaran yang ternyata dipertahankan oleh orang Banjar ialah bahasa
  Banjar yang dapat dipertahankan dengan cara membangun komuniti khas keturunan Banjar
  di rantauan, supaya mereka dapat mempertahankan bahasa Banjar, maka kebanjaran orang
  Banjar terutama sekali terletak pada bahasanya dan tanah air orang Banjar adalah
  bahasa Banjar.\\nSelagi seseorang fasih menggunakan bahasa Banjar dalam kehidupan
  seharian, maka dialah yang bergelar orang Banjar, tidak kira sama ada dia lahir
  di Tanah Banjar atau tidak, berdarah Banjar atau tidak, dan sebagainya. Bahasa merupakan
  salah satu faktor kebanjaran disamping faktor lainnya seperti adat istiadat dan
  lain-lain.[20]\\nLoghatSunting\\nJika diperhatikan, para penutur bahasa Banjar dapat
  dikenal pasti adanya kelainan-kelainan dalam pengucapan atau perbezaan kosa kata
  sesama kelompok suku Banjar, maka perbezaan ini boleh dikatakan sebagai loghat dari
  bahasa Banjar yang terbahagi kepada dua kelompok loghat[13][21] iaitu;\\n- Bahasa
  Banjar Hulu Sungai/Bahasa Banjar Hulu\\n- Bahasa Banjar Kuala\\nLoghat Banjar Kuala
  pada umumnya ditutur oleh penduduk asli sekitar kota Banjarmasin, Martapura dan
  Pelaihari, manakala dialek Banjar Hulu pula ditutur oleh penduduk daerah Hulu Sungai
  umumnya, iaitu kawssan Kabupaten Tapin, Hulu Sungai Selatan, Hulu Sungai Tengah,
  Hulu Sungai Utara (dan Balangan) serta Tabalong. Penutur dialek Banjar Hulu ini
  jauh lebih luas dan masih kelihatan beberapa kelainan subloghat lagi yang disebutkan
  oleh Den Hamer[19] dengan istilah dialek setempat, seperti Amuntai, Alabiu, Kalua,
  Kandangan, Tanjung. Selain itu, Den Hamer amat berpendapat bahawa bahasa yang dipakai
  oleh orang Bukit, iaitu penduduk pedalaman pegunungan Meratus, merupakan salah satu
  subdialek Banjar Hulu juga, dan mungkin subloghat baik Banjar Kuala mahupun Banjar
  Hulu itu masih banyak lagi, jika dilihat banyaknya kelainan penuturan bahasa Banjar
  yang masih memerlukan penyelidikan lanjut dari para ahli dialektrografi sehingga
  bahasa Banjar itu dengan segala subloghatnya boleh dipetakan secara teliti dan tepat.
  Berdasarkan pengamatan yang ada, perbezaan kelompok dialek Banjar Kuala dengan Banjar
  Hulu setidak-tidaknya ada dua perkara penting,[13] iaitu:\\n- Adanya perbezaan pada
  kosa kata tertentu;\\n- Perbezaan pada sebutan fonem tertentu. Di samping itu ada
  pula pada perbezaan nada dan tekanan meskipun yang terakhir ini bersifat tidak membezakan.[13][22]\\nBahasa
  Banjar Hulu merupakan loghat asli yang dipakai di wilayah Banua Enam yang merupakan
  bekas Afdelling Kandangan dan Afdeeling Amoentai (suatu pembagian wilayah pada zaman
  pendudukan Belanda) yang meliputi kabupaten Tapin, Hulu Sungai Selatan, Hulu Sungai
  Tengah, Hulu Sungai Utara, Balangan dan Tabalong pada pembahagian pentadbiran ketika
  itu.\\nPuak-puak suku Banjar Hulu Sungai dengan loghat masing-masing bersesuaian
  secara relatif dengan pembahagian pentadbiran pada zaman kerajaan Banjar dan Hindia
  Timur Belanda, iaitu mengikut Lalawangan atau daerah (Kawedanan) pada masa itu,
  yang sudah berbeza pada zaman sekarang. Puak-puak suku Banjar di daerah Hulu Sungai
  tersebut misalnya :\\n- Orang Kelua dari bekas Distrik Kelua di hilir Daerah Aliran
  Sungai Tabalong,Kabupaten Tabalong.\\n- Orang Tanjung dari bekas Distrik Tabalong
  di hulu Daerah Aliran Sungai Tabalong, Kabupaten Tabalong\\n- Orang Lampihong/Orang
  Balangan dari bekas Distrik Balangan (Paringin) di Daerah Aliran Sungai Balangan,
  Kabupaten Balangan\\n- Orang Amuntai dari bekas Distrik Amuntai di Hulu Sungai Utara\\n-
  Orang Alabio dari bekas Distrik Alabio di Hulu Sungai Utara\\n- Orang Alai dari
  bekas Distrik Batang Alai di Daerah Aliran Sungai Batang Alai, Hulu Sungai Tengah\\n-
  Orang Pantai Hambawang/Labuan Amas dari bekas Distrik Labuan Amas di Daerah Aliran
  Sungai Labuan Amas, Hulu Sungai Tengah\\n- Orang Negara dari bekas Distrik Negara
  di tepi Sungai Negara, Hulu Sungai Selatan.\\n- Orang Kandangan dari bekas Distrik
  Amandit di Daerah Aliran Sungai Amandit, Hulu Sungai Selatan\\n- Orang Margasari
  dari bekas Distrik Margasari di Kabupaten Tapin\\n- Orang Rantau dari bekas Distrik
  Benua Empat di Daerah Aliran Sungai Tapin, Kabupaten Tapin\\nDaerah Oloe Soengai
  dahulu merupakan pusat sebuah kerajaan Hindu, tempat bermulanya perkembangan bahasa
  Melayu Banjar.\\nPerbezaanSunting\\nDialek merupakan variasi dari suatu bahasa tertentu
  dan dituturkan oleh sekumpulan masyarakat bahasa tersebut. Dialek ditentukan oleh
  fakor geografis (dialek kawasan) dan sosial (dialek sosial). Dialek sosial seperti
  bahasa baku, bahasa basahan (bahasa kolokial), bahasa formal, bahasa tak formal,
  bahasa istana, bahasa slanga (prokem), bahasa pasar, bahasa halus, bahasa kasar
  dan sebagainya.\\nDialek kawasan berbeda dari segi:\\n- Sebutan\\n- Contoh: Perkataan
  gimit (perlahan) disebut dalam pelbagai loghat seperti gamat, gimit, g\u00e9m\u00e9t,
  gumut.\\n- Gaya bahasa\\n- Contoh: Subloghat Kalua biasanya mempunyai sebutan yang
  lebih panjang daripada Subloghat Banjarmasin.\\n- Tata bahasa\\n- Contoh: kuriak-kuriak
  (loghat Banjar Kuala) dan kukuriak (loghat Banjar Hulu).\\n- Kosa kata\\n- Contoh:
  hamput (Banjarmasin), tawak (Barabai), himpat (Kalua), hantup (Tanjung), tukun (Amuntai),
  tingkalung bererti lempar.\\n- Contoh: adupan (Banjarmasin), hidupan (Barabai),
  kuyuk (Kalua), kutang (Kandangan), duyu''(Paringin), asu (Marabahan), bererti anjing.\\n-
  Contoh: hamput (Banjarmasin), tawak (Barabai), himpat (Kalua), hantup (Tanjung),
  tukun (Amuntai), tingkalung bererti lempar.\\n- Kata ganti diri\\n- Contoh : kao
  (loghat utara Kalsel maksudnya kamu) dan nyawa (loghat selatan Kalsel bermaksud
  kamu)\\n- Contoh : ia (loghat utara Kalsel maksudnya dia) dan inya (loghat selatan
  Kalsel bermaksud dia)\\nBanjar HuluSunting\\nLoghat-loghat Bahasa Banjar Hulu[23]
  bersesuaian dengan kecamatan-kecamatan yang berpenduduk suku Banjar yang ada di
  Hulu Sungai, karena orang Banjar menyebut dirinya berdasarkan asal kecamatan atau
  banua masing-masing. Loghat-loghat tersebut antara lain: Muara Uya, Haruai, Tanjung,
  Tanta, Kelua, Banua Lawas, Amuntai, Danau Panggang, Babirik, Sungai Pandan (Alabio),
  Batu Mandi, Lampihong, Awayan, Paringin, Juai, Batu Benawa, Haruyan, Batang Alai,
  Barabai, Pandawan, Labuan Amas, Angkinang, Kandangan, Simpur, Daha, Sungai Raya,
  Telaga Langsat, Padang Batung, Margasari (di kecamatan Candi Laras), Tapin dan Binuang.\\nBanjar
  KualaSunting\\nLoghat Bahasa Banjar Kuala, iaitu bahasa yang dipakai di wilayah
  Banjar Kuala atau bekas Afdelling Banjarmasin (kini Distrik Bakumpai) dan Afdeeling
  Martapoera yang kini terdiri daripada Distrik Martapura, Distrik Riam Kiwa, Distrik
  Riam Kanan, Distrik Pleihari, Distrik Maluka dan Distrik Satui. Kawasan tersebut
  pada zaman sekarang meliputi Kabupaten Banjar, Barito Kuala, Tanah Laut, serta kota
  Banjarmasin dan Banjarbaru. Pemakaiannya meluas hingga kawasan pesisir tenggara
  Kalimantan (bekas Afdelling Kota Baru) iaitu kabupaten Tanah Bumbu dan Kotabaru
  sampai ke Kalimantan Timur dan Kalimantan Tengah.\\nKosa kataSunting\\nKosa kata
  loghat Banjar Hulu tetap ada bezanya sesama subloghat bahasa Banjar, tetapi jelas
  tidak ditemui dalam dialek Banjar Kuala, ataupun sebaliknya kosa kata seperti unda
  (aku), dongkah (sobek besar), atung (taat) dan sebagainya dalam loghat Banjar Kuala
  tidak ditemui dalam loghat Banjar Hulu. Dilihat dari kosa kata, baik dalam hal jumlah
  maupun variasi subdialeknya, tampaklah dialek Banjar Hulu jauh lebih banyak dan
  kompleks. Misalnya antara satu subloghat dengan subloghat lain, seperti Alabio,
  Kalua, Amuntai dan lain-lain banyak berbeza kosa katanya, sehingga dapat terjadi
  kosa kata yang digunakan di satu kawasan tidak jarang atau kurang biasa dipergunakan
  di kawasan lain. Tetapi dibandingkan dengan loghat Banjar Kuala, subloghat Banjar
  Hulu ini lebih berdekatan dengan satu sama lain. Oleh itu, di dalam Kamus Banjar\u2013Indonesia,
  bahasa Banjar selalunya hanya dibezakan antara Banjar Kuala (BK) dan Banjar Hulu
  (BH). Dalam perkembangannya, pergaulan dan pembauran sesama kedua-dua penutur loghat
  tersebut semakin kuat.[13]\\nPerbezaan dalam sebutan fonem:\\nContoh Loghat Banjar
  Hulu\\n- Hagan apa hampiyan mahadang di sia, hidin hudah hampai di rumah hampian
  (Dialek Kandangan?)\\n- Sagan apa sampiyan mahadang di sini, sidin sudah sampai
  di rumah sampiyan. (Banjar populer)\\n- Inta intalu sa\u2019igi, imbah itu ambilakan
  buah nang warna abang awan warna ijau sa\u2019uting dua uting. Jangan ta\u2019ambil
  nang igat (Dialek Amuntai?)\\n- Minta hintalu sabigi, limbah itu ambilakan buah
  nang warna habang lawan warna hijau sabuting dua buting. Jangan ta\u2019ambil nang
  rigat.(Banjar populer)\\nFonologiSunting\\nDalam bahasa Banjar tidak ada F, Q, V
  kerana F dan V diserap ke dalam P; Q diserap ke dalam K; dan Z diserap ke dalam
  S/J. [13]\\nTingkatan bahasaSunting\\nBahasa Banjar juga mengenal tingkatan bahasa
  (Jawa: unggah-ungguh), tetapi hanya untuk kata ganti orang, yang tetap digunakan
  sampai sekarang. Zaman dahulu sebelum dihapuskannya Kesultanan Banjar pada tahun
  1860, bahasa Banjar juga mengenal sejenis bahasa formal yang disebut basa dalam
  (bahasa istana), yang merupakan pengaruh dari bahasa Jawa terutamanya dari Kesultanan
  Mataram, disamping ada pula kosa kata yang dicipta sebagai bahasa formal, misalnya
  jarajak basar bermaksud tiang, dalam bahasa Banjar normal disebut tihang. Basa dalam
  kini sudah pupus, tetapi sesekali masih digunakan dalam kesenian daerah Banjar.
  Dalam Hikayat Banjar, manira (saya) dan pakanira (anda) adalah perkataan bahasa
  Bagongan yang digunakan secara meluas.\\n- unda, sorang = aku ; nyawa = engkau \u2192
  (kasar)\\n- aku, diyaku = aku, saya ; ikam, kawu = engkau, awak \u2192 (biasa)\\n-
  ulun = saya ; [sam]pian / [an]dika = anda \u2192 (formal)\\nuntuk kata ganti orang
  ke-3 (dia)\\n- inya, iya, didia = dia \u2192 (biasa)\\n- sidin = beliau \u2192 (formal)\\nBilanganSunting\\nBerikut
  merupakan kata bilangan asas dalam Bahasa Banjar. Kata-kata bilangan dalam bahasa
  Banjar mirip dengan kata-kata bilangan bahasa Jawa Kuno.\\nTulisanSunting\\nPenulisan
  bahasa Banjar pada zaman dahulu dalam abjad Jawi misalnya;\\n- sastera sejarah/mitos
  seperti Hikayat Banjar\\n- peraturan kerajaan seperti Undang-Undang Sultan Adam
  1825.\\n- perjanjian-perjanjian antara Kerajaan Banjar dengan bangsa lain.\\n- kitab-kitab
  agama Islam\\n- karya sastera lainnya seperti syair :\\n- Syair Brahma Syahdan karya
  Gusti Ali Basyah Barabai\\n- Syair Madi Kencana karya Gusti Ali Basyah Barabai\\n-
  Syair Teja Dewa karya Anang Mayur Babirik\\n- Syair Nagawati karya Anang Mayur Babirik\\n-
