  \u0646\u06d2 \u0627\u06cc\u06a9 \u062c\u062f\u06cc\u062f \u062a\u0634\u062e\u06cc\u0635\u06cc
  \u0622\u0644\u06c1 \u062f\u0631\u06cc\u0627\u0641\u062a \u06a9\u0631\u0646\u06d2
