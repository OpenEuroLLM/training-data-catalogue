sample: '["\"Page 8 of 11 \u2022 1, 2, 3 ... 7, 8, 9, 10, 11\\nyang matian to ditanam\\nmon
  yang kadak islam hanyar dibanam!!!\\nAtong- Mejar Jeneral\\n- Posts : 8268\\nPoints
  : 8310\\nJoin date : 22/05/2009\\nLocation : Alam Maya (Kuala Lumpur)\\nBukit Merah
  - Kelisa emas ( terbaik di dunia )\\nKalimantan - Kelisa merah\\nAmun maambil di
  sungai kada kawa dijual di pasaran terbuka ( dianggap ikan liar ) kada ada cip /
  bar code nya, kacuali dijual secara gelap hagan induk.\\nIkan kelisa bukan hagan
  dimakan, tapi ikan hiasan.\\nurang luar negara (maju ) lukisan gin kawa dijual ratusan
  ribu.\\nkelisa sabagai koleksi hiasan\\nKelisa lebih kapada ekspot, jualan dlm nagara
  hanya kelisa nang murah- murah haja. Ngalih manjual kelisa nang haloi- haloi dangan
  harga RM 5,000 ka atas mun di nagara sandiri. Malaysia masih di bawah 10% permintaan
  global. Luar nagara labih memerlukan kelisa emas Malaysia, berbanding urang Malaysia
  sandiri.\\nHidup atau mati kelisa adalah ketentuan Allah. Inya banda hidup. sama
  jua urang maharagu lambu, kambing, mananam sawit, sunyaan nya banda hidup. Yang
  panting sumber mendapatkan / mambali itu halal.\\nAda jua kawan ku, bagawi di XXX
  . Inya jar kada payah basusah payah malabur berisiko, manukar kabun sawit dsj. bab
  bab pertanian tak main la jar nya. Inya sabulan RM 20k kada lari, pambarian hadiah
  dari tapak used car nang di pinggir jalan. Bagi aku itu rezeki cara inya la, halal
  kah kada aku kada tahu, itu urusan nya, asal inya kada ganggu aku udah. Aku kada
  manjual used car jua ha. Maraha cina nang manjulungi inya.\\nhe he he kada ah........(
  itu cakap ganal mun nyambat kada main )\\naku ni atong gai, mun makai BMW gin kada
  kawa mandaribal laju lagi\\n120km / hour gin udah tarasa laju . jadi, pakai aje
  lah nang mana ada\\nAku amat supan nu ipar duai ku mun aku makai kurita mahal, dipa
  yang masyuk baguih baguih tu gin biasa biasa aje. Ada ai ipar ku yang makai kompressor
  E, BMW 5s...tu yg badiam di Tmn TAR Ampang tuh, kakak ku gin makai merc sahanyarnya,
  itu baru hadiah hari jadi dari anak nya. Tapi dipa masyuk nya ditunjul kada rabah
  lagi. Jadi aku ni di takdirkan ada rezeki labih, munkin makan masa 2 - 3 tahun hulu
  hanyar wani manukar ( biar keadaan reda hulu )\\nezlankhu- Guest\\nhambur ka urang
  lain...luko haje ah...\\nsilap urang kot...\\nUmaYani/UY- Brigedier Jeneral\\n-
  Posts : 3505\\nPoints : 3508\\nJoin date : 22/05/2009\\nLocation : Meru, Klang\\nPage
  8 of 11 \u2022 1, 2, 3 ... 7, 8, 9, 10, 11\"", "\"Datu Muning marupakan salah sabuting
  kisah menganai riwayat datuk (datu-datu) dalam masyarakat Banjar.[1] Datu-datu dalam
  masyarakat Banjar digambarakan sabagai urang nang baisi kakuatan nang tinggi, kabal
  sanjata wan taat baagama.[2] Kawa disambat datuk marupakan urang super. Salain itu
  datu rancak baik wan mangasihi lawan nang lain. Datu Muning digalari jua Datu Suban
  nang bailmu tinggi. Inya dapat ilmunya matan Kitab Laduni. Kisah menganai riwayat
  Datu Muning ni imbahnya mamalopori kisah-kisah riwayat para muridnya. Murid-muridnya
  naitu: Datu Tamongkar, Datu Marukat, Datu Niang Talib, Datu Sanggul, Datu Taruna
  Barikin, Datu Kalua, Datu Labi Diluman, Datu Harun, wan Datu Pujung. Kisahni mengisahakan
  kayaapa Datu Muning mandapatakan warisan barupa kitab ilmu agama. Isinya marupakan
  ilmu Kaesaan Tuhan nang paling tinggi. Kamudian ulih para panarusnya kitab itu disambat
  kitab Laduni. Hagan kawa menyarap ilmu matan kitab itu, Datu Muning malakukan semadi
  wan mempalajari dalam-dalam isi kitab nya.\\nTampaian\"", "\"BANJARMASIN \u2013
  Bamula pulang banyu ba\u2019ah di banua kita ngini, nang hanyar ngini sapalihan
  kartak wan rumah bubuhan warga di pahuluan sampai ka pahiliran sudah kacalapan,
  Ahad (28/11/2021).\\nRami banar urang babagi video banyu ba\u2019ah di pahuluan,
  ada nang tumatan Kecamatan Muara Uya, Kabupaten Tabalong, Barabai di Hulu Sungai
  Tengah (HST), ada jua nang tumatan Loksado di Kabupaten Hulu Sungai Selatan (HSS).\\nBanyu
  ba\u2019ah atawa banjir ngini sampai jua sudah ka pahiliran, yaitu sampai ka wilayah
  Amuntai, Kabupaten Hulu Sungai Utara. Amun nang di Kota Amuntai, banyu ba\u2019ah
  lurukan banyu di hulu, tumatan Sungai Tabalong wan Balangan atawa Paringin.\\nBanyu
  ba\u2019ah di Kota Barabai nang sudah maulah jalan wan pasar calap ngitu datangnya
  tumatan di hulu jua, umpamanya haja tumatan Kacamatan Hantakan, laku ka Sungai Benawa
  wan limpas ka kartak wan rumah bubuhan warga sampai ka pasar.\\nUjar sapalihan urang
  banyu ba\u2019ah ngini ukaranya hujan labat dalaman babarapa hari ngini. Imbah ngitu
  jua ulihan hutan atawa lingkungan nang rusak.\\nBanyu ba\u2019ah ngini amun ditiring
  di video bubuhan warga di medsos maulah calap terminal di Pasar Loksado, Di Pasar
  Barabai, Jalan di Muara Uya. Imbah ngitu pulang banyu ba\u2019ah di Hantakan, HST
  ngitu sudah marusak jumbatan.\\nAmun badasarkan laporan cuaca tumatan BMKG di Banua
  kita ngini di Kalsel bilang kikiraannya hujan haja samingguan. Gasan ngitu bubuhan
  kula-kula barataan diingatakan supaya bahati-hati atawa waspada kalo banyu ba\u2019ah
  banaik tarus.\"", "\"TOPIK\\nSi Palui\\nWAYAH handak hari raya Palui wan kakawalannya
  umpat jua manjadi amil zakat di masigit. Sakalian mahadangi urang maantar fitrah
  bubuhannya salajur jua\\n-\\nPalui pahaman nang kukuriak itu hidungnya rongong jadi
  manyambat salambar itu adalah salawar. Maksudnya inya kahilangan saraba salambar.\\n-\\n\\\"Adakah
  bubuhan ikam baisi ruku? Masam muntungku nah, parak satangah hari aku kada baruku,\\\"
  ujar Garbus maminta ruku.\\n-\\nMaka bilang badadua pina mahahing, kadada nang maunya
  mangalah alias balamah. Kada siang kada malam pokoknya nangkaya kucing wan anjing
  bila batamuan\\n-\\n\u201cDi.... basmi dibasmi dibasmi..... dibasmi dibasmi dibasmi.....
  Urang tuha panyarikan, dibari Ubat ini, ampih panyarikan,...\u201d\\n-\\nMaaf bamaafan
  itu ihlas haja bila ada salah hilaf, tapi sual hutang kada kawa dimaafakan karna
  itu urusan dunia.\\n-\\nAmun ada urang manyaru basalamatan, bubuhan Palui wan kakawalannya
  takanal paling rajin mandatangi.\\n-\\nPalui ini tamasuk canggih, tapi canggihnya
  kada karna kaharatannya, tapi canggihnya adalah Cangkal Bahutang Ngalih Ditagih.\\n-\\nPalui
  di kalangan kakawalannya digalari santri hanyar karna sabalumnya inya tamasuk bambung
  kaya nang lainnya jua.\\n-\\nTapi walaupun jarang banar bulik tatap haja satiap
  hari mangirimi kul wan aruwah abah umanya\\n-\\nImbah babarapa bulan Palui kawin,
  pinanya kadada parubahan jua kalakuannya nang pangoler wan katuju bangun malandau,
  lalu mintuhanya mulai sarik.\\n-\\n\u201cUmur manusia kadada nang tahunya kacuali
  Tuhan, makanya rajin-rajinlah baibadah apalagi bulan suci ini,\u201d ujar Palui.\\n-\\n\\\"KAMARIAN
  bubuhan ikam sabarataan kusaru karumah gasan buka puasa, salamatan saraba sadikit,\u201d
  ujar Tulamak.\\n-\\nPura-pura tasalah bapandir, singaja mamancing-mancing. Pura-pura
  ba-ucap, incaan ilat tasilahu, tapi nang bujurnya handak mambunguli bini.\\n-\\nKenikmatan
  napa nang ikam rasakan Lui maka pina handak manambah bulan puasa jadi saratus hari\\n-\\nHaji
  Adul basaruan sampai ke Banjar, salajur manyaruani Palui, Garbus, Tuhirang dan Tulamak,
  sakalian wan bininya masing-masing.\\n-\\nMalihat Umbui Saudah kasasarikan Tulamak
  baundur handak bukah, tapi batisnya tabarusuk ka lubak\\n-\\n\u201cBila bulan anum
  tiap hari ahad pasti ada urang nang bakakawinan lalu kaya apa rancana kita?\u201d\\n-\\nManukar
  kupinya biar sagalas tapi duduknya dua-tiga jam, pukuknya amun kada habis surat
  kabar tadi kada harapan bagarak tu pang pada kadudukannya.\\n-\\nSudah jua kucubai
  bapuluh-puluh bigi bawang habang tapi kada kawa manangkapnya, bahkan hayamnya makin
  liar\\n-\\nPalui mengatakan jera ke rumah sakit karena sakit karena hendak di suntik
  5 kali sehari.\\n-\\n\u201cAku baulah wan manjual pais, ba-bungkuh, pupudak, lapat,
  buras, lalampar, nasi pundut, nang pabungkusnya daun pisang balipat-lipat\\\"\\n-\\nAda
  lagi kalabihan lainnya nang kada kalihatan tapi hanya bisa dirasakan, yaitu Lakiku
  itu ada baisian tiga bigi butir di kapalanya\\n-\\nSalain itu wayah ini Palui bilang
  kadada baisi waktu lagi gasan anak-bini.\\n-\\nSampai di sakulahan, sudah banyak
  kakawalannya nang sama-sama handak ma-ambilakan buku rapor anaknya, lalu Palui umpat
  jua duduk\\n-\\nTagal, Utuh tu anak nang taat wan babakti lawan kuwitan. Napa ja
  disuruh atawa dipasani kuwitan, karap digawi wan diingatakanny\\n-\\nKarna mandangar
  bininya handak manyambal, lakas ai palui tulak tuju ka puhun asam nang babuah di
  balakang rumah\\n-\\nSI Tulamak dasar kada kawa mandangar ada makanan pina hanyar,
  langsung inya handak marasani.\\n-\\nSaling katujunya lawan motoGP, hakun haja Palui
  manungkar sapida mutur ganal nang babungkuk kaya nang rancak dipakai bubuhan palatino
  rosi\\n-\\nKada sawat lawas jadi pagawai pamarintah, Palui sudah dijulungi sapida
  mutur dinas ulih kantur wadahnya bagawi.\\n-\\nBAISUKAN Palui sudah mendatangi rumah
  Tulamak nang kada jauh matan rumahnya. Kada hiran, Tulamak takajut banar karna kada
  biasanya\\n\u00a9 2020 TRIBUNnews.com Network,a subsidiary of KG Media.\\nAll Right
  Reserved\"", "\"40 days Banjar (Latin script) and Urdu conversation with Flores.\\nIn
  this session, we will learn a conversation in Bahasa Banjar and \u0627\u0631\u062f\u0648
  (\u0627\u0631\u062f\u0648) languages using the ''Flores200'' data provided by ''MetaAI.''
  This data consists of a total of 997 sentences, so if you read 25 sentences per
  day, you can see your language skills improve within 40 days.\\nFurthermore, this
  data has translations in the same content for 204 languages, so you can use the
  blog search function at the top to search for the desired language. However, please
  note that this data will be reflected in the blog starting from June 2023, and it
  takes six months for all the data to be incorporated. If the language you search
  for is not available, it means it hasn''t been included yet, so please understand.\\nThe
  language list is provided at the bottom of this post.\\n[Day1]\\nBanjar (Latin script)
  : Pas hari Senin, bubuhan panaliti dari Sakulah Ubat Universitas Stanford mahabarakan
  panamuan hanyar alat diagnosa nang kawa mamilihi sel-sel badasarakan janisnya: cip
  halus nang kawa dicetak ngitu kawa diulah pakai standar parcitakan inkjet nang ganalnya
  nangkaya duit satu sen Amerika.\\nUrdu : \u067e\u06cc\u0631 \u06a9\u06d2 \u0631\u0648\u0632\u060c
  \u0633\u0679\u06cc\u0646\u0641\u0648\u0631\u0688 \u0627\u0633\u06a9\u0648\u0644
