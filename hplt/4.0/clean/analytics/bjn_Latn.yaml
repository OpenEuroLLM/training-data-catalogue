  \u06a9\u0631 \u0631\u06c1\u0627 \u062a\u06be\u0627-\\nBanjar (Latin script) : MRI
  baasal dari kajadian fisika nang disambat resonansi magnetik nuklir (NMR), nang
  ditamuakan pas tahun 1930-an ulih Felix Bloch (bagawi di Universitas Stanford) wan
  Edward Purcell (matan Universitas Harvard).\\nUrdu : MRI \u062c\u0648\u06c1\u0631\u06cc
  \u0645\u0642\u0646\u0627\u0637\u06cc\u0633\u06cc \u06af\u0648\u0646\u062c (NMR)
  \u0646\u0627\u0645 \u06a9\u06cc \u0638\u06c1\u0648\u0631 \u0637\u0628\u06cc\u0639\u06cc\u0627\u062a
  \u067e\u0631 \u0645\u0628\u0646\u06cc \u06c1\u0648\u062a\u06cc \u06c1\u06d2\u060c
