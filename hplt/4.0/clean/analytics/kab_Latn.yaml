  i lebda amek i \u0263a nefhem neccin, amezruy n ta\u1e0dbibt.\\nIna d ixsan d imasriyen
  min \u0263er yella luluf n iseggusa, aqqa-ten di tse\u1e0dma n Duckworth di tesdawit
  n Cambridge, di Tgelda-Imunen, i d-yemmlin ca icerrigen i yeggin ca n tdarriyin.\\nQqaren
  imussnawen belli ijjen zeg iqecqacen-nni itte\u025bqab \u0263er 4000 n usegg\u02b7as,
