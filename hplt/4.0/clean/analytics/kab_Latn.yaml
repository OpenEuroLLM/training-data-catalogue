  zi\u0263en kra din wwint wamn, la\u025btab d lba\u1e6d\u1e6del i nes\u025bedda d
  Fransa, kra ur d iban.\\nTura yernu, Lzayer tamharsant n 1962, tebna akken ad tessenger
  tamurt taqbaylit d tutlayt tamazi\u0263t sumata ; ma\u025bna, ar tura, mazal xilla
