  ad tecced di ca n weslem, mala dayk amnus n yixf nnek waha.\\nMala texsem ad teswizam
  di \u1e25ettu n tmurt i yellan ixessa ad\u2011as nerr taynit k\u1e6der zi \u1e25e\u1e6d\u1e6du
  zi ca nni\u1e0den. Ha min \u0263a teggem:\\nXeyye\u1e0d tikmamin n ukettan, tsebbni\u2011tent
  mkul ass, wer ssa\u0263 ca tinni n yir\u1e0d nder.\\nMala wer tzemmred ad txey\u1e0ded
  ad tafed tinni n ukettan tmenzant, ad tes\u0263ed ijjen twarat, xir zi mala tessa\u0263ed
  mkul ass.\\nTakmant mala tkemmled zzag\u2011s, amkan nnes d AFRAD. Maci d i\u0263zar
  ni\u0263 d abrid ni\u0263 azzarg.\"", "\"Eug\u00e8ne Green issufe\u0263-dd ijjen
  ufilem di beddu n cher n Cutenbir qqaren-as \u00abAtarrabi et Mikelats \u00bb. Bussinaryu-nnes
  irezzu zeg ufilem-a ad issre\u0263 tifawin x lhimmet i \u0263er-sen \u0263a yelsawen
  uqlilen deg uma\u1e0dal i yettwala belli nitni d ccihed x tussna. Deg ufilem-a Green
  issru\u0263a tifawin x iles Abasku.\\nEug\u00e8ne Green ixleq di New-York. Netta
  zeg iwdan i tt-yeccin x yiles n Ibaskuten. Bussinaryu-ya d udramaturji d umari,
  mani lexdayem-nnes isrusa dag-sen iseqsan we\u0263ban, ull\u0263en. Green wer isnuffur
  ca anict n tmexsa i \u0263er-s \u0263a yelsawen. Uca ixeddem x inni uqlilen zzag-sen
  \u1e25uma ad asen-yewwec ccan-nnsen, ad asen-dd-yerr lhimmet-nnsen.\\nGreen, iqqen
  ixef-nnes \u0263er iles Abasku, itte\u025bjib-as mamec tteggen iwdan ssawalen zzag-s.
  Netta iqqar kul iles \u0263er-s lxezrat \u0263er uma\u1e0dal. D ijjen tebridt i
  zi \u0263a nxes amyanaw i yellan deg uma\u1e0dal-a. Yettwala belli a\u1e6d\u1e6das
  n inni ig ixeddmen di sini x ifilmawen wer ttweqqiren ca yilsawen iberraniyen, uca
  axmi tteggen ijjen marka n ddenf n yiles-a. Ddenf-nni maci \u0263ir x inni i yessawalen
  iles-nni maca ddenf kun\u1e6dra i tewdanit amen tekmel.\\nGuant\u00e1namo: Afilem
  n \u00ab Amuri\u1e6dani \u00bb ittekkes tduli x ubniq a\u025beffan deg uma\u1e0dal\\nDeg
  useqqim adusturi yettwala ila asexdem n ca n yiles-nni\u1e0den di temzgida n t\u0263uri
  bla Tafransist wer dd-itis ca aked ddustur n tmurt-a. S uya netta, igga afilem-a
  s Tbaskut axmi d ijjen tebridt i zi \u0263a innezbi. \u00ab Atarrabi et Miklats
  \u00bb d ijjen ufilem n lexyal i yessawalen x tlelli d min ixe\u1e6d\u1e6dar bnadem
  i yixef-nnes. Mamec \u0263er-s tibratin d tipulitikiyin. Be\u025bda Eug\u00e8ne
  Green, yeqqar belli aseqqim adusturi ittegg ijjen ddenf d aye\u025bqubi.\\nTaneglinzit
  d ijjen yiles i yettexsen yewdan merra. Lqanun n Fioraso ittbedda aked uselmed s
  yiles-a aberrani. Maca ittagi x yilsawen n tmurt. Wer nzemmer a nessexdem iles abasku
  di tmersal (institutions) \u0263ir di dders n t\u0263erma (civilisation) Tabaskit
  di tesdawit. Maca, \u025bawed, wer nzemmer a nesselmed lma\u1e6d, ni\u0263 Tafilusuft
  s Tbaskut, maca manaya izemmer ad yili s Teglinzit.\\nLxedmet n artistat ma ad bedden
  deg wudem n ddegg-a n izerfan i yettejjan tussna d tame\u1e93lu\u1e0dt. Green netta
  wer yeggi ca ifilmawen s Tbaskut waha maca ula s wa\u1e6d\u1e6das n yelsawen-nni\u1e0den
  iberraniyen am Tafransist, i idewlen issawal-itt nican, d Tpurtugalit d Te\u1e6dalyant.\"",
