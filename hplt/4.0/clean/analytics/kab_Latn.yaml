  lejdud-nne\u0263 aked lehlak-a a\u025beffan.\\nYenna i xinsya n Press Association
  belli netta awettas-nnes ad isi\u0263a x \u201ctbyugrafit n uxenzir zi beddu n umezruy
  n bnadem\u201d.\"", "\"TAMURT \u2013 Ass-a a ken-d-meslaye\u0263 \u0263ef yiwen
