  akked ti\u1e63ufe\u01e7t n wayen n diri.\\nIhi, a tagmatt akk-a i tnegger yal ass
  teqbaylit, alamma ur d-iqqim kra deg-s. Tura d lawan akken ad d-akwim, akken a nedduklet
  am yiwen i lme\u1e25na yagi n ims\u025bareben id-se\u0263lin fell-a\u0263 Buxaruba
