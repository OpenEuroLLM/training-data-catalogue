  ixeddem deg luzin n Coder Saint Marcel.\\nAss n 12 maggu 1954 yekcem ad-yeseeddi
  leeskkar, Amenzu maggu 1956 yeffeY-d di leesker, imiren kan yuli s adrar, anda baba-s
