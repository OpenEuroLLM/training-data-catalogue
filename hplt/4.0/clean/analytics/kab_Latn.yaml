  d icenfiren-nsent ; sser$ayent azezzu ittak-d ime\u00ee\u00eeawen\\niwmi qqaren
  timmi, ttarrant-tt i le\u00e2yun-nsent. Qell\u00e2en-t\\nmedden mi ara t-afen di
