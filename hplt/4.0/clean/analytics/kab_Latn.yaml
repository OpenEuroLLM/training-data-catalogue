  ye\u1e25ramen, irgaezen s iqenddyar deg unebdu.\\nMara tent-wali\u1e0d deg iberdan,
  tiwaculin-agi, ad a-tini\u1e0d d tiwaculin ticerqiyin (orientaux) ne\u0263 d tipalistiniyanin.
