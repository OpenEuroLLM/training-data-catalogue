  llant s yi\u1e0duman akked ssel\u025ba n lebni\u2019\u2019. Sg tama n yimezda\u0263,
  yu\u0263al llum \u0263ef t\u0263iwanin akked yim\u1e0debbren \u2018\u2019Ad ar\u01e7un
