  tidarriyin n ijjen uxenzir i ttu\u0263a i\u1e0darren i\u0263es, maca di twalat d
  icten immal-d belli tam\u0263art-nni teggenfa zeg ijjen uyezzim.\\nIqqar Camar\u00f3s
  belli manaya yudrus. Minzi iyezzimen ttbanen-d \u0263er yexsan n yergazen kter.\\nWami
  ggin ifessayen i yexsan-nni, ttu\u0263a yettbanen-d mli\u1e25 axenzir-nni.\\n\u00ab
  Nessen luxa ila wenni d ijjen uxenzir i yetteggen ca n tdarriyin deg yexsan, i yeqqnen
  nican \u0263er mamec i\u0263es ittra\u1e25 ittehrura. \u00bb I d-yenna umussnaw
