  yeqqaren belli axenzir ttu\u0263a yeggur di ddat-nnes.\\nIjjen weqcqac i yudrusen\\nDi
  tse\u1e0dma-ya, ufin imerzuten \u025bawed ijjen uqecqac d aqdim s ca n 2000 n usegg\u02b7as,
