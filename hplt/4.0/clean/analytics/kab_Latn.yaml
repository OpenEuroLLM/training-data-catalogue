  sfesden, er\u1e93an di cci n lemlayek n medden akked d win n ddula.\\nh) 1989 d
  talalit n ukabar F.I.S (parti islamique du salut), ddan, bu\u1e6d\u1e6din ar tama
  n Abbassi Madani d Ali Bel\u1e25a\u01e7. Fernen tam-nsen, tama n imnekcem a\u025brab-ineslem.
  A lukan yella deg-sen kra n leb\u0263i, tili bu\u1e6d\u1e6din ikabaren iqbayliyen
  n FFS d RCD, maca ugwin ad ddun d atmaten-nsen, maca ernan ar u\u1e25emmal n ti\u025burrebt
  akked tneslemt. Asmi i d-i\u1e0dra wass n tidett, ass n lbu\u1e6d n tugdut, akken-llan,
  argaz tame\u1e6d\u1e6dut, bu\u1e6dan ara tama n FIS. S yenna imiren twalam akk ayen
  i d-i\u1e0dran ar tagara-nni mi terwi, texnez ttazzalen-d ar tmurt taqbaylit, regglen-d
  si lbubmat d ter\u1e63a\u1e63in n ukabar n Abbassi Madani d werfiq is Ali Bel\u1e25a\u01e7.\\nkra
  \u025ber\u1e0den Iqbayliyin d Teqbayliyin, si 1963 ar ass-a akken ad bnun tugdut
  d timuz\u0263a n Tefriqt Ugafa me\u1e5b\u1e5ba, tiwaculin agi tim\u1e6durniyin,
  tinekkarin n tna\u1e63lit (r\u00e9n\u00e9gates), ma\u010d\u010da ttekkant am tiwaculin
  timta\u025barbin, zgant lla ttferi\u01e7ent si leb\u025bid segne\u0263 mi nettna\u0263
  d ucenggu a\u025brab-ineslem n usekkak.\\nIhi dag-kan ad twalim, ger twaculin agi
  i iberran si tjaddit akked tid tims\u025barbin, ulac d acu i ten-ixulfen, acku tidak
  \u00ab i\u1e25ecden \u00bb. Amdan am usaku (tejra), ur d-ttak ara lfakya yelhan,
