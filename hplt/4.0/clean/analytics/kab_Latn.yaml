  ma llan as-i-d- awin laecur i ccix nsen.\\nAss nni d ass n ssuq, yerja winna g webrid
  yettawin ar Ljemae; i\u1e5buja-t, ibedd armi i t-id yeqdae, dYa inteq ar Yur-s yenna-as:
