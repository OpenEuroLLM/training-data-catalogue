  ! mi ara ilal uqcic, \u00e2laxa\u00eeer i\u00e9ra,\\nasmi ara yim$ur uqcic-nni,
  a t-issenger ; wamma mi ara tlal\\nteqcict, iferre\u00ea, ittarra tame$ra : i\u00e9ra
  taqcict ur t-tettvurru ara\\n7\\nimi d astenfe\u00e2 ara testenfe\u00e2 yes-s. Akken
  ad ssizew$ent\\nle\u00eanak-nsent, tt\u00eaukkunt-asen \u00eamimuc.\\nAvummu ur
