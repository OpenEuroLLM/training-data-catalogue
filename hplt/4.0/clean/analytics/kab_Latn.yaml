  wenni, ni\u0263 ggin manayenni awerni i lmewt ma\u1e25end ad fehmen mayen yemsaren
  i umettin.\\nYenna Edgard Camar\u00f3s, ijjen upaliyu\u1e6dulujist di tesdawit n
