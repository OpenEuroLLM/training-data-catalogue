  : s\u00e2an ta\u00eacict iwmi qqaren\\namezzir n u$yul. Mi d-ddmen tameqqunt, a
  tt-cudden,\\nttvummun yes-s ivumman imeqranen, am u\u00e2fir, adaynin,\\nazniq ne$
  amviq illan yumes a\u00eeas. Amezzir imeqqi-d deg\\nu\u00eariq ne$ deg umviq ur
  tekkat ara tgersa. Tekksen-t-id\\nmedden melmi i sen-ihwa, \u00eaaca deg wass n
  ssebt : qqaren d\\n\u00ee\u00eeira. Ifilku d yileggi tteksen-ten-id medden, ttvummun
  yes-sen\\ndeg unnar mi ara sserwaten. Ur s\u00e2in ara nnfe\u00e2 n wa\u00eeas\\n\u00e2laxa\u00eeer
  kra n wanda llan, amkan-nni d i\u00e2iqer, da$ netta ur\\nten-\u00eaemmlen ara medden
  ; $ef waya i qqaren : Akal dittaken ifilku, budde$-as asyax deg unebdu ! Ula d ileggi
  ur is\u00e2i\\nnnfe\u00e2 n wacemma.\\nAkal da$en deg d-meqqint tfuzzal ur iswi
  acemma, axleno\\nakken-nniven. Qqaren : Win ib$an ad is$er aqerru-s issucef s\\ntmerdemt
  n tfuzzal !\\nKra di te\u00eacicin n lexla tturaren yes-sent warrac, am tyedret
  n\\nu$yul : ttarran-tt di lqec-nsen, skaden-tt mi ara tle\u00ea\u00eau.\\nSswaye\u00e2
  n lexla, ssentuyen-tent $ef tcucay-nsen, ttferrioen\\ndeg-sent anta ara inven a\u00eeas.
  Ticuffivin n lexla s\u00eeerviqen-tent\\ngar yiifassen-nsen am l\u00eaerraqa.\\n8\"",
  "\"Amrig (imrigen), 1- arme (fr) - weapon, arm (en) - arma (es) - \u0633\u0644\u0627\u062d\\n2-
  Kkes-as amrig-nnes (i kra n yiwen) - d\u00e9sarmer - desarmar - \u0646\u0632\u0639
  \u0633\u0644\u0627\u062d \u0634\u062e\u0635 \u0645\u0627\u060c \u062c\u0631\u0651\u062f
  \u0634\u062e\u0635\u0627 \u0645\u0646 \u0633\u0644\u0627\u062d\u0647\\nAddad amaruz:
  wemrig/umrig (yemrigen/yimrigen).\\nA\u0263balu: Amawal n Tmazi\u0263t Tatrart -
  Lexique du berb\u00e8re moderne (Tiddukla A\u1e93ar, Bgayet 1990).\\nTasniremt:\\nAmrig
  afessas - arme l\u00e9g\u00e8re - arma ligera - \u0633\u0644\u0627\u062d \u062e\u0641\u064a\u0641\\nAmrig
  akruran - arme chimique - arma qu\u00edmica - \u0633\u0644\u0627\u062d \u0643\u064a\u0645\u064a\u0627\u0648\u064a\\nAmrig
  asnaktan - arme id\u00e9ologique - arma ideol\u00f3gica - \u0633\u0644\u0627\u062d
  \u0625\u064a\u062f\u064a\u0648\u0644\u0648\u062c\u064a\\nAmrig asnudran - arme biologique
  (fr) - biological weapon (en) - arma bil\u00f3gica (es) - \u0633\u0644\u0627\u062d
  \u0628\u064a\u0648\u0644\u0648\u062c\u064a\\nAmrig aymani - arme automatique - arma
  autom\u00e1tica - \u0633\u0644\u0627\u062d \u0623\u0648\u062a\u0648\u0645\u0627\u062a\u064a\u0643\u064a\\nAmrig
  imi\u0263es - arme nucl\u00e9aire - arma nuclear - \u0633\u0644\u0627\u062d \u0646\u0648\u0648\u064a\\nAmrig
  n tnekra - arme de r\u00e9volte - arma de revuelta - \u0633\u0644\u0627\u062d \u062b\u0648\u0631\u0629\\nAmrig
  n tru\u1e93i n ujemmal - arme de destruction massive - arma de destrucci\u00f3n
  masiva - \u0633\u0644\u0627\u062d \u062f\u0645\u0627\u0631 \u0634\u0627\u0645\u0644\\nAmrig
  n tseddi - arme de pr\u00e9cision - arma de precisi\u00f3n - \u0633\u0644\u0627\u062d
  \u062f\u0642\u064a\u0642\\nAmrig n u\u1e25uddu - arme d\u00e9fensive - arma defensiva
  - \u0633\u0644\u0627\u062d \u0644\u0644\u062f\u0641\u0627\u0639\\nAmrig n umgaru
  - arme de guerre - arma de guerra - \u0633\u0644\u0627\u062d \u062d\u0631\u0628\\nAmrig
  yettwagedlen - arme interdite - arma prohibida - \u0633\u0644\u0627\u062d \u0645\u062d\u0638\u0648\u0631\\nTukksa
  n yimrigen - d\u00e9sarmement - desarmamento - \u0646\u0632\u0639 \u0627\u0644\u0633\u0644\u0627\u062d\\nTukksa
  n yimrigen ikruranen - d\u00e9sarmement chimique - desarmamentio qu\u00edmico -
  \u0646\u0632\u0639 \u0627\u0644\u0633\u0644\u0627\u062d \u0627\u0644\u0643\u064a\u0645\u064a\u0627\u0648\u064a\\nAql-iken
  deg - Vous \u00eates dans - You are in - Ustedes est\u00e1n en - \u0623\u0646\u062a\u0645
  \u0641\u064a\\nAsegzawal n Tmazi\u0263t - Dictionnaire Amazigh - Fran\u00e7ais -
  Amazigh - English Dictionary - Diccionario Amazigh - Espa\u00f1ol - \u0642\u0627\u0645\u0648\u0633
  \u0623\u0645\u0627\u0632\u064a\u063a\u064a - \u0639\u0631\u0628\u064a\\n(c) Omar
  Mouffok - Tiddukla Tadelsant Imedyazen.\"", "\"\u00c9tiquettes\\nculture amazighe,
  culture berb\u00e8re, lhoussain Azergui, lhu azergi, roman amazigh, ungal amazigh,
  Zaid ouhmad, Zayd U-Hmad\\nRe\u1e93me\u0263-d di\u0263 allen \u0263ef tudert. Maka,
  matta tudert ? Ddaw tudert. Gar tudert. Tmessus amm walu\u1e0d. Tennegza. Telqaq.
  Ter\u1e93a. Iffe\u0263-tt wa\u1e0du n ugari, n waddur d ugemmir. Tuf-tt tmettant.
  Tudert n yi\u0263ed. I\u0263ed n tlelli ane\u0263-ittyakksen, ikem\u1e0den dat wallen-nne\u0263
  afella n yidurar n Wa\u1e6dlas. Ssne\u0263 is ur sar nbeddi. Ner\u1e93a seg wammas.
  Nekna allig da nettelle\u0263 akal. Allig da nessudum tizukin-nne\u0263. \u00abCa
  \u0263ifes azaglu, ca la as-tettuga tariyt [1]\u00bb. Awed yan inejmen. Ur sar nusiy
  i\u0263ef \u0263er igenna, nger izlan \u0263ef tlelli d tayri. Aters-nne\u0263 i\u0263wba.
  Yugem. Asafar-nnes iga-t ugari, maka ur \u0263urne\u0263 illi. Tunant taberrkant
  ayed ane\u0263-iwtan g uqerru, tessgerd anelli, tne\u0263 degs ired n usirem. Ufi\u0263-d
  ama\u1e0dal n Ayt Yafelman irdel. Innegwdem. Amm udrar iwta usetti\u0263. Iga iberyan
  amm ufecku ifrurin. Iftuttes dat wallen-nne\u0263 ur idmin. Ur nezmir. Ur nedmi.
  Ur \u0263ifes ngi. Tamazirt-nne\u0263 da tettwa\u0263 ddaw u\u1e0dar n Yirumiyen.
  Andar-nnes da as-nettiselli ku i\u1e0d ig nedda ad ngen. Andar-nnes idus. Ta\u0263ect-nnes
  da tessergigi i\u1e93uran, tessre\u0263 degsen idammen. Idammen-nne\u0263, teffe\u0263-ten
  tzu\u0263i. Tekcem-ten tawda tawra\u0263t. Ur da ane\u0263-itta\u01e7\u01e7a ad
  ngen. Nedder g umalu n t\u1e0duri. G te\u0263mert ur tettinniy ti\u1e6d. Nella ur
  nelli. Nemmut n\u0263al is nedder. \u0393ef u\u0263amu n tru\u1e93i im\u0263i-d
  ugummu[2] ir\u1e93agen amm ufer\u1e93i\u1e93, win tkendawt d tcekkamt. I\u0263uma
  bu\u0263lan, gman amm yibuxxa, nyaddan g tmazirt. Neb\u1e0den-tt, \u010d\u010dan-as
  anelli. A\u1e6d\u1e6dan ikref tamurt. In\u0263a-tt. Adis-nnes ur da d-ittarew \u0263as
  ime\u1e6d\u1e6dawen. Tilelli tekme\u1e0d. Tettyaker. Tga i\u0263ed.\\nTawda-lli\u0263
  ssiwiden Ayt Yafelman s teb\u0263est-nnsen, tawda-lli\u0263 ur yufin ad\u0263ar
  agensu n wulawen-nnsen ta\u0263ul tga u\u010d\u010di-nnsen akuyas. Swan-tt d waman.
  Selmen-tt d uwern. Uw\u0263en-as d u\u0263rum. Tezde\u0263-ten. Tra-ten. Ran-tt.
  Tettemra degsen amm uselluf asen-issumumen idammen. Icekkamen ur yad da tteffren,
  ssarden udem s ube\u1e93\u1e93id ir\u0263an n tru\u1e93i. Burzen. Gan afus g win
  ucengu.\\nAsa\u1e0den n Baddu d Sa\u0263ru ucckan. Ku yan d winnes. Ka immut. Ka
  iga am\u0263ar yager wafa-nnes win Yirumiyen. Ka ib\u1e0dey wul-nnes s unga\u1e93.
  Ka illa g ukurmu. Ka irul \u0263er aza\u0263ar. Tudert n yimezda\u0263 tmessus.
  Icekkamen lan tawuri. Ur da tta\u0263en akal. \u1e0cufen aha imezda\u0263.\\nZed\u0263e\u0263
  g taddart-nne\u0263.Yiwet tikkelt g umalas kke\u0263-d \u0263ur Sekku A\u1e93elma\u1e0d.
  Netta ayed i-yakkan ine\u0263misen imeggura. Maka ine\u0263misen-nnes r\u1e93agen.
  Ur da i-tta\u01e7\u01e7an ad gne\u0263. Ku i\u1e0d, ar di\u0263 sbertu\u0263. Ri\u0263
  ad kse\u0263. Ri\u0263 ad rule\u0263 deffer n wulli d t\u0263e\u1e6d\u1e6den, nse\u0263
  di\u0263 g yifran, ge\u0263 atag afella n ufurrgis g Tizi, su\u1e0de\u0263 g tebja,
  siwle\u0263 i waman, i yigenna, i udrar. Ri\u0263 ad ge\u0263 ilelli. Nek luli\u0263-d
  ilelli. Aksum-inu ir\u1e93ag. Maka, tilelli-nu, kem\u1e0den-as igeldan. Tettukref.
  Teggujel. I\u1e93uran-inu zwan. Inker degsen umersal. Mellulen. Semmumen.\\nNer\u1e93a
  neknu. Na\u0263ul amm wactal ittaw\u0263en i wakal aberrkan \u0263ef \u0263usen
  yinaruzen-nne\u0263. Akal-dde\u0263 aberrkan, nesswa-t s tidi, ussan n umdaz d s
  yidammen ussan n yimen\u0263i. Iga winne\u0263 neg winnes. Umaxdac ayed igan taru\u1e93i-nne\u0263
  tameggarut. Ismar yimen\u0263i, nekren-d yimazdaren ar ttettan seg useklu d-igman
  s yidammen n winna immuten \u0263ef tlelli d ugemmir. Ffren allig ner\u1e93a, ff\u0263en-d
  yifisen. Senmen yikennaden[3] a\u0263wejdim \u0263ef tme\u1e0dlin n wasa\u1e0den.
  Kud ssumumen i\u0263san ttell\u0263en ime\u1e6d\u1e6dawen n warraw-nnsen. Kigan
  ger yimeddukkal-nne\u0263 ayed ittun\u0263an. Yiwen, \u0263as yiwen g yinezbayen
  ssne\u0263 ayed irulen \u0263er aza\u0263ar. Usin akw Yirumiyen ayenna ila. Imarawen-nnes
  sulen g ukurmu. Nna\u0263en awed nitni g tin Baddu. N\u0263an kigan n yiserdasen.
  Seqsa\u0263 \u0263ifes, Inna-i Sekku: \u00abIlla igellin ! Da ikessa \u0263ur yan
  usebbab axatar g Melwit.\u00bb Maka, uki\u0263 d wawal-nnes irgag. Ssne\u0263 is
  da iskirkis. Sekku ur issin ad iskirkes. Ur ilmid ad iskirkes.\\nNni\u0263-as:\\n\u2013
  Ssne\u0263, ar ikessa \u0263ur yan usebbab allig t-um\u1e93en !\\n\u2013 Mayed ak-innan
  awal-nna\u0263 ? Idrus mayed t-issnen !\\n\u2013 Annaye\u0263 tillas n ukurmu g
  wallen-nnek. Is tettud mayed mse\u0263 ?\\nInna:\\n\u2013 Illa g ukurmu n Midelt.
  Ar ikessa ar yan wass, kecment-as wulli turtit n yan u\u1e5bumi. Iffe\u0263-d umeggaru-dde\u0263,
  yame\u1e93-t. Gran-t g ukurmu. Idd ulli ikessa, usin-tent. Aya ayed ssne\u0263.
  Ur ri\u0263 awal-dde\u0263 ad nn-igulu imarawen-nnes.\\nIssusem, ssusme\u0263 awed
  nek. Ku yan ar iseksiw \u0263er waye\u1e0d. Irnu di\u0263, inna:\\n\u2013 Han awed
  Zayd Uskwenti[4] illa g ukurmu ! Yugi ad ikcem ddaw tayet n Yirumiyen. \u1e5amin
  degs seg wass g d-iggez seg Baddu. Ran ad ig am\u0263ar n Ayt Mer\u0263ad. Maka
  yugi.\\nNni\u0263-as:\\n\u2013 Uskwenti !?\\nFesti\u0263. Kti\u0263-d awal n yinezbayen
  i-ijjenjemen g uwerz n Baddu. Ur ssine\u0263 is sulen ddren midd ttun\u0263an. Kigan
  ayed \u0263ifes sella\u0263. Ssne\u0263 is ib\u0263es, is yugey ad ikcem ddaw tenba\u1e6d
  n Yirumiyen. Ssne\u0263 is akw ikka ini\u0263an ikkan g Un\u1e93ul Ugmi\u1e0d mgal
  n Yifransisen. Nni\u0263:\\n\u2013 Yugi ad ig am\u0263ar ! Netta han kra n yinezbayen
  gan d\u0263i icekkamen n yicenga-lli\u0263 d nna\u0263en \u0263ef yidurar. S\u0263an-ten
  s urkes d ukerbas. A\u0263ulen kkan ddaw Yirumiyen.\\nFesti\u0263 di\u0263. Kti\u0263-d
  Umaxdac iggullan ittna\u0263 ard i\u1e0der ne\u0263 issafe\u0263 Irumiyen seg tmazirt.\\nAss-nna\u0263,
  isawel-i Sekku A\u1e93elma\u1e0d \u0263ef kigan n wasa\u1e0den n Un\u1e93ul Ugmi\u1e0d.
  Irnu di\u0263 an\u1e0daf i wul-inu itersen. Aters-nne\u0263 zzi\u0263 i\u0263wba,
  iglugel s yime\u1e6d\u1e6dawen, nekren-d degs iwekkiwen. Inna-i:\\n\u2013 Yiwen
  ayed isulen. \u0393as yiwen ! Zayd Uskwenti.\\n\u2013 Maka !\\nIrnu di\u0263, ar
  i-ittales i wawal yad inna, waqila ittu, ne\u0263 ul-nnes ayed te\u010d\u010da tare\u1e93gi.\\n\u2013
  Illa g ukurmu ur t-igin ! Awed netta gedlen[5] \u0263ifes ad d-iffe\u0263 seg taddart-nnes
  seg wass g d-iggez seg Baddu. Ur iri ad ig am\u0263ar. Ur iri ad degs neb\u1e0den
  Yirumiyen, yugi ad iger afus-nnes g winnsen.\\nUskwenti, amsedrar texwla tlelli,
  yi\u0263iy ad fellas ifek tudert-nnes. Seg mayed isul ime\u1e93\u1e93iy ayed yusi
  imrigen ad inna\u0263 mgal n Yirumiyen d-ikecmen \u0263er tmazirt. Yamu akw g yini\u0263an
  ikkan g Un\u1e93ul Ugmi\u1e0d d Wa\u1e6dlas. Yamu g tin Budnib (1908), Tafilalt
  (1918-1919), Tde\u0263wt (1918-1919), Ayt I\u025beqqub (1929-1930), Tunfiyt (1929-1930),
  Tarda (1930), Tazegzawt (1932), Serredrar (1932), Tizi n U\u0263rum d Baddu (1933).
  Izzri simraw d sin n yiseggwasen n yimen\u0263i d uzbu mgal n Yirumiyen. Yugi ad
  iknu dat yimnekcamen. Ib\u0263es amm yizem. Ur akw tessin tawda abrid \u0263er ul-nnes
  i\u0263wman s ugari. G Baddu, inna\u0263 amm wasa\u1e0d. Itturtes g wudem. Maka,
  idde\u0263 yannay asirem n trennawt[6] ixsey g wallen n yinezbayen deffer n kigan
  n yimalasen n yimen\u0263i, iggez-d ad imnala d ujiniral Huri. \u0393as ikcem \u0263er
  tqi\u1e0dunt-nnes, inna-as:\\n\u2013 Ne\u0263tes ad d-neggez seg udrar, mek a\u0263-tu\u01e7\u01e7am.\\nYukez
  Huri awal-nnes, inna-as:\\n\u2013 Mayed tram ?\\n\u2013 Nra ad ta\u01e7\u01e7em
  inezbayen ad u\u0263ulen \u0263er i\u0263erman-nnsen. Ad ur tam\u1e93em awed yan
  degsen g yikurmuten-nnun. Nra awed ad trarem ikalen tusim d wactal tukrem i yid
  bab-nnsen. Ur ri\u0263 imezda\u0263 ad xlun, ad gen imatrawen \u0263ef wakal-nnsen.
  Ri\u0263 awed ad tefrum atig n yimrigen \u0263urne\u0263 illan mek tram ad ten-tekksem
  i yinezbayen. Wenna awen-iruran amrig-nnes, ad yame\u1e93 atig-nnes.\\n\u2013 Ad
  awen-nefru atig n yimrigen s ten\u0263am kigan g yiserdasen-nne\u0263 ?\\n\u2013
  Ur idd \u0263as iserdasen-nnun ayed ittun\u0263an g umgaru[7]-dde\u0263. Timi\u1e0diwin
  n yirban, n twetmin d yiregzen n Ayt Yafelman ayed ten\u0263am s tsaylalin[8]-nnun.
  Ur da sawale\u0263 \u0263ef winna ten\u0263am g Tzegzawt d yini\u0263an akw n yidurar
  n Dren, Bugafer d Wa\u1e6dlas Anammas.\\n\u2013 Afella n udrar ! Mayed illan afella
  n udrar ?\\n\u2013 Afella n udrar, llan kigan n yimettinen, n yimezda\u0263 in\u0263a
  la\u1e93, ur i\u010d\u010din ula swan ugar n yimalas aya. Awren n tactatin ayed
  sellmen. Maka, meqqar llu\u1e93en, afud-nnsen isul idus, ulawen-nnsen \u1e63i\u1e0den
  da suddumen tab\u0263est. Zemren ad nna\u0263en amm yizmawen ard ur d-iqqim awed
  yan.\\n\u2013 Ran ad d akw ggzen ?\\n\u2013 Kigan g yinezbayen ur rin ad d-ggzen.
  Ran ad nna\u0263en ar tigira.\\n\u2013 Illa degsen Eli U\u1e6d\u1e6dermun ?\\n\u2013
  Mayed ak-d-issaw\u1e0den ine\u0263misen-nna\u0263 ?\\n\u2013 Nessen, nessawe\u1e0d-as-nn
  tabrat as-nn-uznen ayt taddart-nnes seg Ufrekla. Nnan-as ad d-iggez seg udrar. Yugi.
  Ibbey tabrat.\\n\u2013 Mek tram ad ta\u01e7\u01e7em imezda\u0263 ad u\u0263ulen
  \u0263er i\u0263erman-nnsen, ad d-ddmen uguz seg usekka. Aya ayed \u0263uri illan
  ad awen-t ini\u0263.\\n\u2013 Waxxa !\\nImmater ujiniral Huri udem n Uskwenti itersen
  d tu\u0263mas-nnes ir\u1e93an. Inna-as:\\n\u2013 Ad d-teggzem seg udrar awi\u0263-k
  \u0263er Fas ad ak-d-seggme\u0263 ayenna\u0263 n tu\u0263mas ir\u1e93an.\\n\u2013
  Tanemmirt, maka tu\u0263mas ffullsent i ta\u1e6d\u1e63a. Nekwni ur sar yad ne\u1e6d\u1e63i.
  Taru\u1e93i ur da tettmun d ta\u1e6d\u1e63a. Ur di\u0263 ne\u1e6d\u1e63i ard teff\u0263em
  tamazirt-nne\u0263. Ard di\u0263 name\u1e93 tilelli.\\n\u2013 Ur nsawel \u0263ifek
  keyyin.\\n\u2013 Nek, ass g d-ggzen medden seg udrar, u\u0263ulen \u0263er tadderwin-nnsen,
  tessekrem \u1e93ari ayenna tram. Ur i-iddi ka.\\nIffe\u0263 seg tqi\u1e0dunt, yali
  di\u0263 adrar ad nn-issiwe\u1e0d ane\u0263mis. Isekkiwes ujiniral Huri ar isemrara
  iwaliwen n Uskwenti gras d yi\u0263ef-nnes, inna:\\n\u2013 Ur \u01e7\u01e7in \u1e93ri\u0263
  a\u0263ref amm wa, iregzen amm wi. Ur ssine\u0263 is nneflen, ne\u0263 be\u0263sen.\\nZrin
  yitsen wussan, ggzen-d yinezbayen seg Baddu. Ku yan yu\u0263ul \u0263er i\u0263rem-nnes.
  Nnan-as Yifransisen i Uskwenti:\\n\u2013 Iqqen-k-inn ad tged am\u0263ar n Ayt Mer\u0263ad
  ! Ur illi kra n wudem mi ttisellin anect-nnek.\\n\u2013 Ur nna\u0263e\u0263 g Baddu
  af ad ge\u0263 am\u0263ar ! Nna\u0263e\u0263 \u0263ef tlelli. Amm nek amm akw imezda\u0263.\\nYugi
  ad ig am\u0263ar ittyime\u1e93. Gedlen-as ad d-iffe\u0263 seg taddart-nnes. Ku tikkelt,
  aznen \u1e93ares Yirumiyen udmawen ixataren n Ayt Eisa Izem ad ides msawalen. Ran-t
  ad ig am\u0263ar-nnsen. Ur yadduz[9] ar 1937.\\nIdd igellin n U\u1e6d\u1e6dermun,
  yiwen g wa\u1e63a\u1e0den ya\u1e0den n Baddu, ya\u0263ul-d \u0263er i\u0263rem-nnes,
  Sat Tamajjyalt g Ufrekla. Teqqima degs tru\u1e93i n Baddu, ar ittumum allig ib\u1e0dey
  wul-nnes s unga\u1e93.\\nIsmar wakud n yimen\u0263an g Wa\u1e6dlas, tali-d tafuyt
  n yicekkamen d yixendallasen.\\n[1] expression utilis\u00e9e dans le Moyen Atlas.\\n[2]
  fruit\\n[3] rus\u00e9s\\n[4] Asa\u1e0d n Baddu, Ilula g Teskwentit g tmazirt n Yi\u0263faman
  (Amellagu) g useggwas n 1890. Immut g useggwas n 1943. Ad tafem ine\u0263misen ya\u1e0dnin
  \u0263ifes g https://zayduhmad.wordpress.com/\\n[5] interdire\\n[6] victoire\\n[7]
  guerre\\n[8] avions\\n[9] accepter\\n\u00c9tiquettes\\nculture amazighe, culture
  berb\u00e8re, Imeggura g imazighen, les derniers des hommes libres, lhoussain Azergui,
  lhu azergi, roman amazigh, ungal amazigh, Zaid ouhmad, Zayd U-Hmad\\nLa mort de
  Zayd Uhmad, abattu \u00e0 Tadafalt en 1936, a mis fin \u00e0 tout espoir de r\u00e9volte
  ou de soul\u00e8vement dans les c\u0153urs des habitants d\u00e9sormais soumis au
  pouvoir du Makhzen et des Fran\u00e7ais. La plupart des h\u00e9ros de Saghru et
  de Baddou sont devenus des ca\u00efds, d\u2019autres des mokhaznis au service de
  la France. Certains ont quitt\u00e9 la r\u00e9gion, d\u2019autres ont succomb\u00e9
  au d\u00e9sespoir et \u00e0 la souffrance. Ils avaient regrett\u00e9 d\u2019avoir
  baiss\u00e9 les armes \u00e0 Baddou. Leurs espoirs ont \u00e9t\u00e9 an\u00e9antis.Leur
  monde s\u2019est \u00e9croul\u00e9 devant leurs yeux sans rien pouvoir faire pour
  le redresser.\\nAu Moyen-Atlas et dans la r\u00e9gion de Fazaz, des Hommes s\u2019organisent
  clandestinement,s\u2019approvisionnent en armes pour relancer la lutte contre l\u2019arm\u00e9e
  fran\u00e7aise,mais une tuerie survenue \u00e0 Agouray les obligent \u00e0 revoir
  tous leurs plans.Certains d\u2019entre-eux, parmi les plus convaincus de la lutte
  arm\u00e9e contre l\u2019arm\u00e9e fran\u00e7aise et son alli\u00e9, le Makhzen,
  sont tu\u00e9s, victimes de trahisons, de manipulations et d\u2019ignorance.\\nA
  F\u00e8s, un groupe d\u2019hommes appel\u00e9s \u00abnationalistes\u00bb cr\u00e9ent
  une formation politique, pensent \u00e0 l\u2019apr\u00e8s \u00ab ind\u00e9pendance\u00ab
  . Ils fa\u00e7onnent d\u00e9j\u00e0 l\u2019image d\u2019un pays ind\u00e9pendant,
  mais soumis \u00e0 leur joug et \u00e0 leur pouvoir.\\nLes derniers Hommes qui aspiraient
  \u00e0 rester debout et \u00e0 combattre pour la libert\u00e9 sont an\u00e9antis.
  Le visage du pays a chang\u00e9. Il deviendra le butin des\u00abnationalistes\u00bb
  et du Makhzen. Il ne tardera pas \u00e0 obtenir son \u00ab ind\u00e9pendance \u00bb,mais
  pas la libert\u00e9 tant r\u00eav\u00e9e. Les Imazighens, qui avaient r\u00e9sist\u00e9
  h\u00e9ro\u00efquement \u00e0 la p\u00e9n\u00e9tration fran\u00e7aise, sont vaincus
  et exclus. Les nouveaux ma\u00eetres du pays programment leur an\u00e9antissent
  pur et simple.\\nImeggurag Yimazi\u0263en , Afafa, Roubaix, 2014, 10 euros.\\n\u00c9tiquettes\\namazigh,
  Azergui, Baddou, Badou, berb\u00e8re, Bougafer, Maroc, Oubasslam, ouskounti, r\u00e9sistance
  amazighe, roman amazigh, Saghru, Sekku, Tinejdad, Tinghir, Zaid ouhmad, Zayd Ouhmad,
  Zayd U-Hmad\\n(Pages : 17 \u00e0 21)\\nTigira n mars 1933\\nInna-i Sekku Azelma\u1e0d,
  imi-nnes izwa. Udem iwraY amm tawda. Irwas win umettin:\\n\u2013 Seksew!\\nBeddiY
  Yef tfednin, greY allen Yer aneqqer d-tekka tallest. Age\u1e0drur izdey igenna d
  wakal. Issentel udem azegzaw n tafuyt. IzeggwaY. Ila a\u1e0du n tmettant d tfekkiwin
  ircan is\u1e0di\u1e0diyen. UkiY d udrar ar ittergigi ddaw yidasilen-inu d wul-nnes
  ar ittwaY amm win uYilas ittutersen. AnniY iwaYezniwen ar ttazzlan amm yinfalen.
  Ig\u1e0da\u1e0d ar kkaten s wafriwen ur ssinen mani Yer ttraran udem. Tem\u1e0derway
  g udrar.\\nNniY-as:\\n\u2013 Matta yixxan-a?\\n\u2013 TamurYi! Ikabaren n tmurYi
  taberrkant. A\u1e0dar i\u1e6dfar a\u1e0dar. Afriw ikkat afriw. Adida da issiwid.
  Axbac iYwma s yidammen. Ifassen da ten-suddumen. Iqqucan cwan amm yimegwran. Gezmen
  tasa n yimezdaY. Sell i wakal-nneY da ittwaY ddaw titiwat n wuzzal. Timura Yef tekka
  tenber-asent udem. TenYa irban, tisednan d yiregzen. TesYwas urtan trar medden d
  isemxan. TamurYi n wuzzal. Tar ul. Tar tasa. S ugari, tra ad aneY-tenbe\u1e0d. Ad
  aneY-tneY. Tekref-aY ifassen, allaYen d wulawen \u2026\\nUr yad da ttiselliY i wawal-nnes.
  Ammi Yifi yaggug. GriY aYuyyi allig \u1e6d\u1e6daqqsen yi\u1e93uran n uger\u1e0d-inu.
  Irar-i-d udrar tiqqlit. Irgag amm nek. Ul n udrar ilqaq amm win yimezdaY-nnes. Gnunnin
  yiselliwen. Adida-nnsen irwas win tegniw. Ar ten-seksiweY allig nn-aYen asif iYwban.
  Ftuttsen gen iberyan. Ammi nYan iman-nnsen. Skecmen tawda g wul-inu. Ur ssineY maY
  allig ggwdeY ad frurin yimezdaY amm yiselliwen.\\nSmaneY ulli kessaY. AnnayeY-tent
  duyent. Ar ttergigint ammi \u1e93rant uccen. \u1e6c\u1e6dukkint. Isdi-tent uYuyyi-nu
  immYen g wasif n tawda. ZdiY tarula Yer iYrem n Tana ad nn-sselkmeY aneYmis.\\nInna-i-d,
  ime\u1e6d\u1e6di g yiles, tirrget g wul:\\n\u2013 A\u1e0dar aerab \u2026 Arkes a\u1e5bumi
  ! NniY-ak \u2026 Aerab d U\u1e5bumi!\\nUr ukizeY awal-nnes. Nek Yas arba ame\u1e93\u1e93an
  ayed giY. \u0393as ameksa. Ur ssineY mayed msen Waeraben ula I\u1e5bumiyen. ZdiY
  tarula, idasilen-inu ar ttemneqqaren Yef wakal n udrar amm yi\u1e0darren n tmurYi.\\nInna-i-d
  diY:\\n\u2013 WilliY nin-d iysan d yileYwman. Wi yuwi-ten-d wuzzal. Maka amm wi
  amm williY ! \u2026 Amm williY!\\nNniY-as-d, imi-inu itkar s wakal d-ssnekrent wulli:\\n\u2013
  Illa umuttel!\\nInna-i:\\n-Illa yimenYi ayed izwaren!\\nNniY-as:\\n\u2013 ImenYi?\\nTeg
  akw tudert-nneY Yas imenYan!\\nNe\u1e5bmi asgunfu!\\nIga ammi ur i-isella, inna-d:\\n\u2013
  Assna\u1e6d, Aerab. Assa, A\u1e5bumi. S ugari d tkendawt ad degneY ba\u1e0den. Yitsen
  kerfen-aY ilsawen, ifassen d yi\u1e0darren s udlis-nnsen. Wiye\u1e0d, ran ad asen-nessudum
  ifassen d tzukin. Nella ger yigenna d wakal. Nettyarna.\\n\u2013 Mek nettyarna ur
  ta nennaY, i max ad tazned medden Yer imenYi? Key trid uxla imezdaY ad ttunYan tidired
  key.\\n\u2013 XseY ad aneY-ib\u1e0du wasif n yidammen nekwni d Yi\u1e5bumiyen akken
  ad ur sar ten-ne\u1e6dfur!\\nIsawel-d ka agensu-nu. Awal-nnes iYwba. Inna:\\n\u2013
  Asif n yidammen? Hat ib\u1e0da-aY yad d yinselmen. Han amata g yimezdaY isul ittukraf
  s yikerkas-nnsen. \u010c\u010dan seg yimkuraren-nnsen iqburen d yimaynuten. ZedYen-asen
  ifadden amm wa\u1e6d\u1e6dan. Ssgerden-asen inelliten. Ur zmiren ad griwlen, ad
  swinegmen, ad bedden, ad mmectegen ula sawlen!\\nZdiY tarula Yer iYrem. Isawel-d
  yan umeksa, inna-i:\\n\u2013 Mani Yer tezdid tarula?\\nNniY-as:\\n\u2013 TamurYi!
  Ikabaren n tmurYi! Kkan-d mayed igan aqqa. \u0393er iYerman-nneY, zdin-d tawada.\\nIduy.
  Iddem ar ireggwel. Ur issin matta tunant t-iwtan.\\nAneYmis yaY akw idurar d yiYerman
  n Ayt Yafelman. Ir\u1e93a uzbu n Ayt Ee\u1e6d\u1e6da g SaYru deffer n sin yiyyar
  n yimenYi. Ugar n kumraw (40) n yisufag d tamraw n yigiman (80 000) n yiserdasen
  ayed d-tessenker Fransa mgal n sin n yigiman d t\u1e93at n timma\u1e0d (2 900) n
  yinezbayen ilan Yur kra\u1e6d n timma\u1e0d (300) n yimrigen. Rwin-ten.\\nGgzen-d
  Ayt Ee\u1e6d\u1e6da seg udrar g kkan ssenfin. Knan. Dat Yi\u1e5bumiyen, sersen ifadden
  d yiyerriten Yef wakal ammi da tt\u1e93allan. \u0393erden mayed lan Yef tmurt-nnsen
  sswan s yidammen. A\u1e5bumi ibedda. Tiyenzar-nnes g yigenna.\\nA\u1e6das n yimezdaY
  ayed ittunYan. Agari i\u010d\u010da medden. Isfe\u1e0d amata degsen Yef wudem n
  wakal. TimYarin d yirgazen zban allig r\u1e93an. Ur knin. Ayt Ee\u1e6d\u1e6da ur
  \u011f\u01e7in knin i awed yan.\\nInna diY:\\n\u2013 TeYli tawda imezdaY. Smattren
  ifeckan-nnsen, asin irden, tim\u1e93in, asengar d akw mayed lan. Zdin tawada s uzir
  Yer idurar n Baddu d \u1e24emdun. Uwin tiYe\u1e6d\u1e6den, ulli, ifunasen, iserdan.
  Zrin iYerman-nnsen alin adrar ad rulen i U\u1e5bumi. Tisednan d yicirran ffren g
  yifran. Iregzen smattren imrigen. Ggullan ttnaYen mgal n yiserdasen n Fransa ar
  tigira.\\nInna-i ammi yannay tawda i-ikerfen anelli:\\n\u2013 Ul-nnek ilqaqen assa
  amm win unugu\u1e0d, asekka ad idus. Ad yimYur. Ad idwel amm win uYilas \u2026 Ngum
  tin Bugafer, timi\u1e0diwin d tmi\u1e0diwin n YimaziYen d TmaziYin ayed ittunYan
  g yidurar n Wa\u1e6dlas lumar g tin Tzegzawt. Tahamajiyt n Yi\u1e5bumiyen ur tli
  tilisa allig Yalen medden is ur lin ulawen. Awed yat tewsit isarsen ifadden Yef
  wakal min imenYi. Awed yan degsen iknan i U\u1e5bumi. Zban allig r\u1e93an.\\nTudert
  n yimezdaY tekkefrurey. Ur teswi awed iYef n tissegnit. G yitsen yiYerman n udrar,
  da settin Yi\u1e5bumiyen iregzen, timYarin d yirban, awin-ten. Awed yan issnen Yer
  mani. Da zeddin yimezdaY tawada ard \u1e0dren s la\u1e93, fad d u\u1e5bmay. Awed
  yan d-ittuYulen. Wenna idusen, izbu, nYen-t[1].\\nSseknan medden iYfawen. Ttyarnan.
  Ddren g timmuzdert.\\nFestiY. Allen-inu mmYent s yime\u1e6d\u1e6dawen. Ulli-nu iduyen
  ttint-i. Ur ukizent. AnnayeY tawda g wallen-nnsent ilan ini n yilmuten n Wa\u1e6dlas.\\nUsiY
  amrig-inu Yef yiYir. ZdiY tawada awed nek Yer adrar n Baddu. Ul-inu innuYjef. IYufa.
  Ira ad ibbaqqi zund agari.\\nInna-i:\\n\u2013 Key tsuled tme\u1e93\u1e93iyd Yef
  yimenYan d ugari. Qqim idi g yiYrem. Nek ad sskareY agari. Key ad t-inn-tessiwi\u1e0ded
  i yinezbayen.\\n\u2013 Waxxa!\\n\u00c9tiquettes\\nA\u00eft Aissa Izem, Ali Ou Termoun,
  amazigh, Amellagou, Ayt Yafelman, Baddou, berb\u00e8re, berb\u00e8res, Boudenib,
  Bougafer, Errachidia, Gh\u00e9ris, Goulmima, Imtghren, ouskounti, Peuple amazigh,
  r\u00e9sistance berb\u00e8re, Tafilalet, Tarda, Tazegzaout, Tazegzawt, Tinghir,
  Uskunti, Za\u00efd Ou Skounti, Zaid ouhmad, Zayd U-Hmad, Zayd Uhmad\\nZa\u00efd
  Ou Hsa\u00efn Ou Skounti est n\u00e9 vers 1890 \u00e0 Taskountit dans l\u2019Ighfaman,
  cercle d\u2019Amellago dans le Haut-Atlas oriental. Il appartient \u00e0 une des
  grandes familles nomades du lignage des I\u00e2chaqen, de la sous-fraction des A\u00eft
  Taleb, fraction des A\u00eft A\u00efssa Izem, tribu des A\u00eft Merghad, conf\u00e9d\u00e9ration
  des A\u00eft Yafelman.\\nTr\u00e8s jeune, Za\u00efd Ou Skounti r\u00eavait d\u00e9j\u00e0
  d\u2019\u00eatre cavalier et guerrier. Son r\u00eave ne tarda pas \u00e0 se r\u00e9aliser
  puisqu\u2019il accompagne son p\u00e8re et l\u2019ensemble des r\u00e9sistants pour
  combattre l\u2019arm\u00e9e coloniale fran\u00e7aise aux portes de Boudenib en 1908.
  Son p\u00e8re l\u2019envoie pour un temps s\u2019instruire chez le ca\u00efd Moha
  Ou Assou \u00e0 Midelt. Il y voit d\u00e9filer des personnalit\u00e9s et des notables
  locaux et prend connaissance des \u00e9v\u00e8nements politiques qui agitent la
  r\u00e9gion et l\u2019ensemble du pays au moment o\u00f9 il est confront\u00e9 aux
  app\u00e9tits coloniaux.\\nZa\u00efd Ou Skounti \u00e9pouse deux femmes : Itto Hammou
  des nomades A\u00eft A\u00efssa Izem et A\u00efcha Oussou de Tadighoust. Il participe
  \u00e0 l\u2019ensemble des combats livr\u00e9s par les r\u00e9sistants \u00e0 l\u2019arm\u00e9e
  coloniale fran\u00e7aise dont notamment:\\n\u2013 Le combat de Boudenib, 1908 ;\\n\u2013
  les combats du Tafilalet, 1918-1919 ;\\n\u2013 les combats du Todgha, 1918-1919
  ;\\n\u2013 les combats d\u2019A\u00eft Ya\u00e2qoub et Tounfit, 1929-1930 ;\\n\u2013
  le combat de Tarda, 1930 ;\\n\u2013 le combat de Tazegzaout, 1932 ;\\n\u2013 le
  combat de Serdrar, 1932.\\nAu d\u00e9but des ann\u00e9es 1930, Za\u00efd Ou Skounti
  devient l\u2019un des chefs de r\u00e9sistance les plus influents de l\u2019ensemble
  du Sud-est du Maroc aux c\u00f4t\u00e9s de Ali Ou Termoun, Moha Arji, les fr\u00e8res
  Sidi Ahmed et Sidi Tayebi, entre autres. Il est bless\u00e9 au combat de Tirga en
  juin 1933. En juillet 1933, il s\u2019illustre aux combats de Tizi n Oughroum. En
  ao\u00fbt de la m\u00eame ann\u00e9e, il refuse les n\u00e9gociations qui lui sont
  propos\u00e9es par les autorit\u00e9s fran\u00e7aises. Les A\u00eft Merghad conduits
  par Ou Skounti auxquels se joignent d\u2019autres combattants issus des populations
  du Sud-est se dirigent vers le djebel Baddou (2921 m) qui devient l\u2019\u00e9picentre
  de la r\u00e9sistance. Les combattants se retranchent sur les flancs de la montagne
  et font la cible de l\u2019artillerie lourde et des bombardements de l\u2019aviation
  suivant un plan militaire \u00e9labor\u00e9 par pas moins de quatre g\u00e9n\u00e9raux.
  Apr\u00e8s d\u2019\u00e2pres combats au cours desquels il y\u2019eut des centaines
  de morts, des milliers de t\u00eates de cheptel tu\u00e9s, Ou Skounti est bless\u00e9
  au visage et les r\u00e9sistants ne peuvent plus s\u2019approvisionner en eau et
  leurs r\u00e9serves sont \u00e9puis\u00e9es. A sa descente du Baddou, Za\u00efd
  Ou Skounti est re\u00e7u le 29 ao\u00fbt 1933 par G\u00e9n\u00e9ral Giraud \u00e0
  Assoul.\\nIl est d\u2019abord plac\u00e9 en r\u00e9sidence surveill\u00e9e \u00e0
  Tadighoust de 1933 \u00e0 1937. Sous la pression de membres influents de la fraction
  des A\u00eft A\u00efssa Izem, envoy\u00e9s \u00e0 lui par les fran\u00e7ais, il
  accepte de devenir Ca\u00efd du Cercle des A\u00eft Merghad d\u2019Assoul. Il s\u2019\u00e9tablit
  \u00e0 Timatdite \u00e0 5 km d\u2019Assoul. Il occupe le poste de ca\u00efd jusqu\u2019\u00e0
  son d\u00e9c\u00e8s tragique le 10 juillet 1943 dans un accident lors d\u2019une
  partie de chasse sur les hauteurs du village d\u2019A\u00eft Brahim dans la vall\u00e9e
  moyenne de l\u2019oued Gh\u00e9ris \u00e0 laquelle un ami \u00e0 lui l\u2019avait
  invit\u00e9.\\nLorsque Ou Skounti descendit du Baddou, les fran\u00e7ais lui ont
  propos\u00e9 de se refaire les dents qu\u2019il a perdues au combat. Il r\u00e9pondit
  : \u00ab les dents servent \u00e0 sourire. Q auoi sert le sourire maintenant que
  nous sommes vaincus? \u00bb. A la question d\u2019un journaliste qui lui demanda
  : \u00ab pourquoi avez-vous combattu les fran\u00e7ais ? \u00bb, Ou Skounti r\u00e9pondit
  : \u00ab je l\u2019ai fait pour mon pays ; nous voulions faire sortir les occupants
  de notre pays \u00bb.\\nQuelques r\u00e9f\u00e9rences bibliographiques:\\nANONYME,
  s.d., La Pacification de l\u2019Atlas Central, , 6 tomes, Paris : Service Historique
