  tiqbayliyin n tmurt. Tiwaculin n tmana\u0263t, atg,\u2026 ass-a, nwala-tent si 1962,
  d ttid i yu\u0263alen \u1e25ecdent (d\u00e9g\u00e9n\u00e9r\u00e9es), fettint \u00ab
  am te\u1e25jurt n sekker i ifettin daxel n lkas n waman \u00bb. Mar tefsi te\u1e25jurt
