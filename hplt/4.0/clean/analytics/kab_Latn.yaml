  wi kidek mala dayk lehlak wer dag\u2011s ilesseq. maca mala tkemmled zzag\u2011s
  uca ddelqed\u2011as manimma. Rexdennit t\u2011\u1e0derrid tamurt amen tekmel.\\nMala
