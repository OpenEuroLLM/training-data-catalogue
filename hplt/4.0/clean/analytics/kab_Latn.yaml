  irfed-itt s-sin ifassen ar igenni, dYa isuY s-wurrif, inna :\\n\u2013 Tegzem-iyi
  tkeffa\u1e5bt, ar d-tefke\u1e0d laecu\u1e5b agi inek neY ar tura ar d wwteY dagi
  ar d-alin waman !\u2026\\nWinna , yenteq ar Yur-s, immeY sin ifassen, (yesnaemel
  am akken at-i\u1e25bes, amzun yugad \u201clbehan n sidi ccix\u201d), yenna i Sidi
  Ccix:\\n\u2013 A Sidi ccix, tegzem iyi tkweffart nni i si tegulle\u1e0d akken, a
