  yal aseggas deg unerni n Iqbayliyen d Teqbaylyin. Walit-kan ayen din n iqbayliyen
  i d-ittlalan yal ass, maca ttu\u0263alen, rennun, snernayen tama n wa\u025braben-inselemn
