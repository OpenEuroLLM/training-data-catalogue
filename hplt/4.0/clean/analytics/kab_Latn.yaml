  ar mani tedwel wer tzemmer ad tugur ula ad t\u1e0du.\\nTt\u025bawaden belli ufin
  \u00ab alastik nni n tekmant yceddas x i\u1e0darn, ar mani bdan ad uffen \u00bb\\nTa
  d icct zeg wa\u1e6d\u1e6das n itegg wefra\u1e0d nne\u0263 di rmar agrnaw, Tamunt
  n \u1e25e\u1e6d\u1e6du n leb\u1e25urat tufa Ticmamin xf wa\u1e6d\u1e6das n playat.\\nTakmant
  le\u025bber d ukla\u1e63i d ukulur i texsem!!!\\nTamunt n \u1e25e\u1e6d\u1e6du n
  leb\u1e25urat t\u1e25ekker i wemxumbel\u2011a di febrayer ye\u025bdan. di jjwayeh
  tejme\u025b\u2011dd zi tegzirt n Soko do Hongkong deg ijjen wass 60 ar 70 n tekmamin.
  \u0190ad deg ijjen wemkan waha. simana awarn\u2011as ufin din \u025bawd yujer 30.\\ndeg
  ufu\u1e6du n Gary Stokes zi \u00ab OceansAsia \u00bb, nettwala belli tikmamin nni
  marra n \u00ab ijjen wass \u00bb, mkul ict d kulur\u2011nnes. Tikmamin\u2011a dag\u2011sent
  \u00ab Polypropyl \u00bb ni\u0263 \u00ab Plastik wer ireccin \u00bb.\\nWer d teqqim
