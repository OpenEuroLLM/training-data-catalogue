  Ecole des Hautes Etudes en Sciences Sociales, Paris.\\nVOINOT, L., 1939 Sur les
  Traces glorieuses des Pacificateurs du Maroc, Paris : Ch. Lavauzelle.\\nPar : Ahmed
  Skounti\\n(Article publi\u00e9 avec l\u2019aimable autorisation de l\u2019auteur.
  Merci encore Mr Skounti.)\\n\u00c9tiquettes\\namazigh, Baddou, berb\u00e8res, Goulmima,
  Imazighen, Khettouch, Moha ou Ali, r\u00e9sistance, r\u00e9sistance amazighe, Saghru,
  Zaid ouhmad, Zayd Ouhmad, Zayd U-Hmad\\nDans son livre \u00abAzour amokrane ne meurt
  jamais \u2026 \u00bb, Moha Ou Ali Khettouch consacre 12 pages (63 \u00e0 75) \u00e0
  l\u2019histoire de Zayd U Hmad. Cette partie de son livre est intitul\u00e9e \u00abOh
  Zaid, sauve ce qui en reste \u2026\u00bb\\n1- 1932 : Zayd U Hmad abat deux aviateurs
  militaires fran\u00e7ais dont l\u2019avion avait fait un atterrissage forc\u00e9
  dans la plaine de Tamtetoucht.\\n2- 1934 : A Tigounsa (dans la vall\u00e9e de Gh\u00e9ris),
  il tue son \u00abpatron\u00bb fran\u00e7ais.\\n3-Juillet 1934 : Il tue un officier
  et 8 l\u00e9gionnaires \u00e0 Tizi n Uderbal.\\n4- A Aqqa n Tizgui, il tue 4 \u00e9l\u00e9ments
  commis pour assurer le barrage mis en place pour sa recherche et sa capture.\\n5-
  Juillet 1934 : Il attaque et incendie un camion de ravitaillement qui assurait la
  liaison entre Imtghren (Ksar Souk) et Goulmima.\\n6- Ao\u00fbt 1934 : Il abat le
  propri\u00e9taire d\u2019un bar-\u00e9picerie \u00e0 Tinghir ainsi que 5 l\u00e9gionnaires.\\n7-
  Novembre 1934 : A Ikkouden (pr\u00e8s de Tinghir), Zayd U Hmad tue 6 l\u00e9gionnaires
  en faction \u00e0 l\u2019entr\u00e9e du d\u00e9fil\u00e9 de Tizi n izouzan.\\n8-
  D\u00e9cembre 1934 : Il attaque une colonne de l\u00e9gionnaire stationn\u00e9e
  \u00e0 Agerd Zegzaouen \u00e0 Msemrir, tuant 3 d\u2019entre eux.\\n9- Zayd U Hmad
  a \u00e9t\u00e9 tu\u00e9 \u00e0 Tadafalt (date non indiqu\u00e9e par l\u2019auteur).
  Selon lui, il a \u00e9t\u00e9 abattu par Hmad Ou Said Ou Trirout.\\nR\u00e9f\u00e9rence
  :\\n\u00abAzour amokrane ne meurt jamais \u2026 \u00bb, Moha Ou Ali Khettouch, Edition
