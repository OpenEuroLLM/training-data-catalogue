  i cetwa. Akken qqren \u2019Le\u1e25der yugar leq\u1e0de\u025b\u2019. Nutni, teddun
  ass s wass, ulac akk tastratijit\u2019\u2019. Akka iwala yiwen urgaz i t\u1e25uza
