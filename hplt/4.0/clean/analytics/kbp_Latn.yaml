  \u00d0\u0269p\u0269z\u0269\u0263 n\u025b \u0256\u0269t\u028b\u028b al\u0269waat\u028b
  nd\u028b \u0256\u0269kpak\u0269\u0263 n\u025b \u0256\u0269m\u028b\u028bn\u0269 helim
  yaa \u0256\u0269lak\u0269n\u0269 ale\u0263ya y\u0254 t\u0269-y\u0254\u0254?\\n14.
  L\u025b\u0263z\u0269t\u028b nd\u028b hal\u028b n\u0254\u0254y\u028b n\u025b \u025b-wal\u028b
  palaba se p\u0269s\u0269n\u0269-w\u025b n\u025b p\u025bw\u025b\u025bn\u0269 al\u0269waat\u028b
  n\u025b paka \u00f1\u028b\u028b n\u025b t\u0254m susuu t\u028bm\u0269y\u025b?\\n14
  Mb\u028b \u025bgb\u025by\u025b taa \u025bz\u028bt\u028by\u028b weyi paya\u0263 se
  Elias y\u0254 n\u025b \u025b-hal\u028b palaba. \u0190y\u0254\u0254daa se: \u201cAl\u0269waat\u028b
  nd\u028b \u0256\u0269kpa\u0263 l\u0269ma\u0263za se \u0256isuyuu \u0256\u0254-t\u0254m
  susuu al\u0269waat\u028b y\u0254\u0254 y\u0254, \u0256\u0269taap\u0269z\u0269\u0263
  se \u0256\u0269la n\u028bm\u0254\u028b l\u0269z\u028b\u028b t\u028bm\u0269y\u025b
  kpaagbaa, \u025bl\u025b \u0256\u0269p\u0269za\u0263 se \u0256\u0269la nab\u028by\u028b
  n\u025b p\u0269s\u0269n\u0269-\u0256\u028b n\u025b \u0256isusi t\u0254m n\u025b
  p\u0269kpa\u0256\u0269. P\u0269-taa nab\u028by\u028b l\u025b se \u0256\u0269pas\u0269
  liidiye n\u0256\u0269 \u0256\u0269laka\u0263n\u0269 t\u028bm\u0269y\u025b h\u0254\u028b
  taa y\u0254 \u0256\u0269-y\u0254\u0254, \u0256\u0269pas\u0269 \u0256\u0254\u0256\u0254
  al\u0269waat\u028b nd\u028b \u0256\u0269kpaka\u0263 n\u025b \u0256\u0269lak\u0269n\u0269
  ale\u0263ya y\u0254 t\u0269-y\u0254\u0254 n\u025b \u0256\u0269p\u0254z\u0269 \u0256\u0254\u0256\u0254
  \u0256a-t\u028bm\u0269y\u025b \u00f1\u028bnd\u0269naa se papas\u0269 \u0256a-t\u028bm\u0269y\u025b
  al\u0269waat\u028b y\u0254\u0254. P\u0269s\u0269n\u0269-\u0256\u028b n\u025b \u0256\u0269p\u0269z\u0269
  n\u025b \u0256isusuu t\u0254m \u0256anas\u0269 y\u0254\u0254, \u0256\u0269w\u025b\u025bn\u0269
