  se Yehowa \u025bs\u0269n\u0269-s\u0269. N\u025b Yehowa n\u0269\u0269 si-kubusi.\\nYehowa
  heyi Gidey\u0254\u0254 se ekpe\u0263li s\u0254\u0254janaa. Gidey\u0254\u0254 kpe\u0263li
  s\u0254\u0254janaa 32000. Pa n\u025b s\u0254\u0254janaa mba paca\u0263 lab\u028b
