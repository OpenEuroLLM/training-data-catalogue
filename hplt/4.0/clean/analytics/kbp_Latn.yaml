  (Mat. 6:22) \u0190-t\u0254m nd\u028b t\u0269-t\u0254b\u028b\u028b l\u025b suwe?
  T\u0269-t\u0254b\u028b\u028b l\u025b se p\u0269c\u025byaa se \u0256e-wezuu ca\u0263\u028b
  \u025bw\u025b\u025b k\u025bl\u025b\u028b yaa \u0256\u0269ka \u00f1\u028b\u028b n\u025b
  ka\u0256\u028bwa k\u028b\u0256\u028bma\u0263, \u0256itaayele n\u025b nab\u028by\u028b
  k\u025bz\u0269 \u0256a-l\u0269ma\u0263za. Yesu ha-\u0256\u028b k\u0269\u0256a\u028b
  p\u0269t\u0269\u014bn\u0269 \u025bz\u0269ma \u025bkam \u00f1\u028b\u028b n\u025b
  \u025b-\u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b e-wezuu ca\u0263\u028b
  taa y\u0254, n\u025b \u025bw\u0269l\u0269 \u0256\u0254\u0256\u0254 \u025b-t\u0254mkp\u025bl\u0269k\u0269yaa
  se paka \u00f1\u028b\u028b n\u025b Yehowa t\u028bm\u0269y\u025b n\u025b \u0190s\u0254
  Kewiya\u0263. \u00d0\u0269ma\u0263z\u0269\u0263n\u0269 Yesu al\u0269waat\u028b nd\u028b
  \u0256\u0269s\u0269\u0263 t\u0254m susuu t\u028bm\u0269y\u025b kajala\u0263 lone
  taa n\u025b \u0256\u0269cal\u0269\u0263n\u0269 \u201c\u00f1\u0269n\u028b\u028b Kewiya\u0263
  n\u025b [\u0190s\u0254] si\u0263si\u0263 w\u025bt\u028b\u201d y\u0254.\u2014Mat.
  6:33.\\n13. \u0190b\u025b p\u0269z\u0269\u0263 p\u0269s\u0269n\u0269-\u0256\u028b
  n\u025b \u0256\u0269ka \u00f1\u028b\u028b n\u025b \u0256\u025b-\u0190s\u0254 s\u025bt\u028b
  t\u028bm\u0269y\u025b?\\n13 Mb\u028b p\u0269w\u025b\u025b se \u0256\u0269la n\u025b
  p\u0269w\u0269l\u0269 se \u0256\u0269kam \u00f1\u028b\u028b n\u025b \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b y\u0254, p\u0269-taa nab\u028by\u028b l\u025b
  se \u0256\u0269ca\u0263 wezuu k\u025bl\u025b\u028b n\u025b p\u0269sa n\u025b \u0256\u0269s\u0269n\u0269
