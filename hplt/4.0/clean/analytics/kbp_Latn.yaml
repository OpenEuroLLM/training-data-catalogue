  l\u0269m n\u025b pefe\u014bi\u0263 \u0256\u0254\u0256\u0254 y\u0254, pe-yeke na.
  N\u025b \u0190s\u0254 t\u0254 se mba paap\u0269z\u0269\u0263 se pala mb\u028b y\u0254,
