  h\u025bk\u028b taa avema naay\u025b, tam nab\u028bl\u025b paa fena\u0263 \u014bga.
  P\u0269ha\u0263-\u0256\u028b taa lele\u014b si\u014b\u014b!\u201d\\n\u0190Z\u0196MA
  \u00d0\u0196P\u0196Z\u0196\u0194 N\u0190 \u00d0\u0196W\u0190\u0190 NIYE T\u0186M
