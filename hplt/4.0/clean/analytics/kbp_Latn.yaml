  n\u025b \u0256\u0269la t\u028bm\u0269y\u025b n\u025b p\u0269sa n\u025b \u0256\u0269c\u0254n\u0269
  \u0256a n\u025b \u0256\u0254-h\u0254\u028b \u0256a-k\u0269c\u025by\u0269m \u0256e\u0256e.
  P\u0269t\u0269la \u0256\u0254\u0256\u0254 y\u0254, \u0256\u0269w\u025b\u025b n\u025b
  \u0256\u0269l\u028bk\u0269n\u0269 h\u0254\u028b taa s\u028b\u028bt\u028b nat\u028by\u028b,
  k\u028bd\u0254\u014b, n\u0269\u0263z\u025b, yaa akpad\u0269y\u0269t\u028b. Paa \u0256\u0269kat\u0269\u0263
  kala ana y\u0254, \u025bz\u0269ma \u0256\u0269p\u0269z\u0269\u0263 n\u025b \u0256iwolo
  p\u0269-y\u0254\u0254 n\u025b \u0256\u0269la \u0256\u025b-\u0190s\u0254 s\u025bt\u028b
  t\u028bm\u0269y\u025b kiya?\\n3. T\u0254m nd\u028b Yesu y\u0254\u0254d\u0269 Maatiyee
  13:23 taa y\u0254, t\u0269w\u0269l\u0269\u0263 suwe?\\n3 Ye \u0256\u025b-w\u025bt\u028b
  \u025b\u025bha\u0263-\u0256\u028b n\u028bm\u0254\u028b se \u0256\u0269kpa\u0263
  al\u0269waat\u028b sak\u0269y\u025b n\u025b \u0256\u0269lab\u0269n\u0269 Yehowa
  t\u028bm\u0269y\u025b y\u0254, p\u0269t\u0269p\u0254z\u0269 se pitibi-\u0256\u028b
  y\u0254\u0254\u0254. Yesu kaanawa se \u0256a-t\u0269\u014ba \u0256\u0269\u0269p\u0269z\u0269\u0263
  n\u025b \u0256\u0269l\u028bl\u0269 Kewiya\u0263 pee k\u0269ma\u014b. (Kal\u0269
  Maatiyee 13:23.) Ye \u0256\u0269lak\u0269 \u0256o-\u0256o\u014b \u0256e\u0256e Yehowa
  t\u028bm\u0269y\u025b taa y\u0254, t\u028bma wena pay\u0269 \u0256\u0269lak\u0269
  y\u0254, ak\u025bd\u0269\u0263n\u0269-\u0269 si\u014b\u014b. (Ebr. 6:10-12) \u0190l\u025b
  nab\u028by\u028b taa \u0256\u0269p\u0269z\u0269\u0263 n\u025b \u0256\u0269na se
  \u0256\u025b-w\u025bt\u028b ha\u0263-\u0256\u028b n\u028bm\u0254\u028b se \u0256\u0269la
  fezuu taa t\u028bma sak\u0269y\u025b n\u025b p\u0269kpa\u0256\u0269. T\u0254m \u00f1\u028b\u028b
  k\u028bn\u025b k\u0269-taa \u0256\u0269ka\u0263 na\u028b \u025bz\u0269ma \u0256\u0269p\u0269z\u0269\u0263
  n\u025b \u0256\u0269s\u0269\u0269 \u0256\u025b-\u0190s\u0254 s\u025bt\u028b kajala\u0263
  lone taa \u0256e-wezuu ca\u0263\u028b taa, \u025bz\u0269ma \u0256\u0269p\u0269z\u0269\u0263
  n\u025b \u0256\u0269ca\u0263 wezuu k\u025bl\u025b\u028b n\u025b \u025bz\u0269ma
  \u0256\u0269la n\u025b \u0256\u0269w\u025b\u025b niye t\u0254m susuu n\u025b t\u0254m
  w\u0269l\u028b\u028b n\u028bm\u0254\u028b taa n\u025b p\u0269kpa\u0256\u0269 y\u0254.
  \u0190l\u025b kajala\u0263 l\u025b, ye p\u0254t\u0254m se \u0256\u0269la \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b kiya, p\u028b-t\u0254b\u028b\u028b l\u025b
  suwe?\\n4. Ye p\u0254t\u0254m se \u0256\u0269la \u0256\u025b-\u0190s\u0254 s\u025bt\u028b
  t\u028bm\u0269y\u025b kiya y\u0254, p\u028b-t\u0254b\u028b\u028b l\u025b suwe?\\n4
  Tobi l\u025b, \u0256\u0269lak\u0269 \u0256\u025b-\u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b
  kiya al\u0269waat\u028b nd\u028b \u0256\u0269lak\u0269 \u0256o-\u0256o\u014b \u0256e\u0256e
  t\u0254m susuu n\u025b t\u0254m w\u0269l\u028b\u028b t\u028bm\u0269y\u025b taa y\u0254.
  \u0190l\u025b p\u0269t\u0269k\u025b al\u0269waat\u028b nd\u028b \u0256\u0269kpak\u0269\u0263
  n\u025b \u0256\u0269lak\u0269n\u0269 t\u028bm\u0269y\u025b n\u0256\u0269 y\u0254,
  ti-\u0256eke t\u0269-t\u0254m c\u025by\u0269na. Mb\u028b pise\u0263ti\u0263-\u0256\u028b
  n\u025b \u0256\u0269lak\u0269 t\u028bm\u0269y\u025b n\u0256\u0269 y\u0254, p\u0269-t\u0254m
  c\u025by\u0269 Yehowa \u025bs\u0269ndaa \u0256\u0254\u0256\u0254. \u0190z\u0269ma
  \u0256\u0269s\u0254\u0254l\u0269 Yehowa n\u025b \u0256\u0269s\u0254\u0254l\u0269
  \u0256\u0254\u0256\u0254 \u025byaa lalaa y\u0254, mb\u028b se\u0263ti\u0263ni-\u0256\u028b
  se \u0256isusi t\u0254m n\u025b \u0256a-kal\u0269za\u0263 pilim. * (Mark. 12:30,
  31; Kol. 3:23) Ye p\u0254t\u0254m se \u0256\u0269s\u025b\u025b \u0190s\u0254 n\u025b
  \u0256a-kal\u0269za\u0263 pilim y\u0254, p\u028b-t\u0254b\u028b\u028b l\u025b se
  \u0256\u0269ha \u0256a-t\u0269 n\u025b \u0256\u0269la \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b n\u025b \u0256o-\u0256o\u014b kpeekpe. Ye t\u0254m
  susuu t\u028bm\u0269y\u025b \u025bm\u028b \u00f1\u0269m si\u014b\u014b \u0256\u025b-\u025bs\u0269ndaa
  y\u0254, \u0256\u0269ka\u0263 \u00f1a\u0263\u028b pana se \u0256\u0269la \u0256o-\u0256o\u014b
  \u0256e\u0256e n\u025b \u0256isusi-t\u028b \u025byaa sak\u0269y\u025b.\\n5-6. Ha
  k\u0269\u0256a\u028b \u014bg\u028b k\u0269w\u0269l\u0269\u0263 \u025bz\u0269ma \u025by\u028b
  p\u0269z\u0269\u0263 n\u025b \u025bs\u0269\u0269 \u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b
  kajala\u0263 lone taa paa \u025bf\u025by\u0269n\u0269 al\u0269waat\u028b y\u0254.\\n5
  \u00d0\u0269kpa\u0263 se evebu n\u0254\u0254y\u028b s\u0254\u0254l\u0269 c\u0269m\u028b\u028b
  mab\u028b p\u0269d\u0269\u0269f\u025by\u0269. \u0190-taa lak\u0269 lele\u014b si\u014b\u014b
  al\u0269waat\u028b nd\u028b ehiki\u0263 wa\u0256\u025b n\u025b \u025bmak\u0269 c\u0269m\u028b\u028b
  y\u0254. P\u028bway\u0269 l\u025b, pam\u028b-\u0269 lone na\u0256\u0269y\u025b taa
  n\u025b \u025bmak\u0269 c\u0269m\u028b\u028b Maza\u0263 n\u025b Kujuka, paa kp\u0269ta\u028b
  \u014bg\u028b. \u0190l\u025b liidiye n\u0256\u0269 p\u025bh\u025by\u0269\u0263-\u0269
  y\u0254, \u0256\u0269\u0269tal\u0269\u0263-\u0269 se \u025bc\u0254n\u0269 \u025b-k\u0269c\u025by\u0269m
  \u0256e\u0256e. P\u028by\u0254\u0254 l\u025b, \u025bpa\u0263z\u0269 t\u028bm\u0269y\u025b
  lab\u028b fa\u0263\u0256\u025b cikpe\u0256e na\u0256\u0269y\u025b taa, kpa\u0263n\u0269
  Hodo n\u025b piwolo Keme\u0263a paa kp\u0269ta\u028b \u014bg\u028b. Paa \u025blak\u0269
  fa\u0263\u0256\u025b taa t\u028bm\u0269y\u025b al\u0269waat\u028b sak\u0269y\u025b
  y\u0254, \u025b-l\u0269ma\u0263za w\u025b c\u0269m\u028b\u028b mab\u028b y\u0254\u0254
  paa \u025bz\u0269mtaa. \u0190s\u0254\u0254laa se \u025bw\u025b\u025b niye c\u0269m\u028b\u028b
  mab\u028b taa n\u025b p\u0269kpa\u0256\u0269 n\u025b \u025bp\u0269s\u0269 c\u0269m\u028b\u028b
  ma\u0256\u028b paa \u025bz\u0269mtaa. P\u028by\u0254\u0254 l\u025b, al\u0269waat\u028b
  nd\u028b ehiki\u0263 wa\u0256\u025b na\u0256\u0269y\u025b paz\u0269 se \u025bma
  c\u0269m\u028b\u028b y\u0254, eeyeki se \u0256\u0269\u0256\u025b\u025b \u025b-y\u0254\u0254
  kpa.\\n6 P\u0269t\u0269la \u00f1a \u0256\u0254\u0256\u0254 p\u0269w\u025b-\u014b
  ka\u0256\u025b se \u014bhi\u0263 al\u0269waat\u028b sak\u0269y\u025b n\u025b \u014blab\u0269n\u0269
  t\u0254m susuu t\u028bm\u0269y\u025b. \u0190l\u025b \u014bs\u0254\u0254l\u0269 t\u028bm\u0269y\u025b
  n\u0256\u0269 \u0256\u0269-lab\u028b. \u014a\u00f1ak\u0269 pana se \u014bw\u025b\u025b
  niye t\u0254m k\u0269band\u028b susuu taa n\u025b p\u0269kpa\u0256\u0269 n\u025b
  p\u0269sa n\u025b t\u0254m nd\u028b \u014bsusuu \u025byaa y\u0254, titukuni pa-la\u014ba.
  \u0190l\u025b \u014bw\u025bn\u0269 t\u028bma nd\u0269 nd\u0269 n\u025b p\u028by\u0254\u0254
  l\u025b, p\u0269p\u0269z\u0269\u0263 n\u025b p\u0269w\u025b-\u014b ka\u0256\u025b
  se \u014bt\u0269l\u0269 \u025bz\u0269ma \u014bs\u0269\u0269 t\u0254m susuu t\u028bm\u0269y\u025b
  kajala\u0263 lone taa y\u0254.\\n\u0190Z\u0196MA \u014aP\u0196Z\u0196\u0194 N\u0190
  \u014aS\u0196\u0196 \u0190S\u0186 S\u0190T\u01b2 T\u01b2M\u0196Y\u0190 KAJALA\u0194
  LONE TAA Y\u0186\\n7-8. \u0190z\u0269ma \u0256\u0269p\u0269z\u0269\u0263 n\u025b
  \u0256\u0269w\u025b\u025bn\u0269 l\u0269ma\u0263za wena Yesu kaaw\u025bn\u0269 t\u0254m
  susuu y\u0254\u0254 y\u0254?\\n7 Yesu kaaw\u025bn\u0269 l\u0269ma\u0263za k\u0269bana
  \u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b y\u0254\u0254 n\u025b p\u028by\u0254\u0254
  l\u025b, \u025bk\u025bn\u0269-\u0256\u028b k\u0269\u0256a\u028b k\u0269ba\u014b\u028b
  si\u014b\u014b. \u0190s\u0254 Kewiya\u0263 y\u0254\u0254 t\u0254m y\u0254\u0254d\u028b\u028b
  kaak\u025bn\u0269 mb\u028b p\u0269-t\u0254m k\u0269l\u0269 c\u025by\u028b\u028b
  e-wezuu ca\u0263\u028b taa y\u0254. (Yoh. 4:34, 35) \u0190\u0256\u0254m kilom\u025btanaa
  m\u0269n\u0269\u014b sak\u0269y\u025b se p\u0269sa n\u025b esusi t\u0254m \u025byaa
  sak\u0269y\u025b. \u0190t\u0269\u014ba\u0263n\u0269 n\u028bm\u0254\u014b t\u0269\u014ba
  y\u0254\u0254 se esusi Kewiya\u0263 t\u0254m \u025byaa, sama\u0263 taa yaa pa-\u0256\u0269s\u0269
  taa. Yesu kaas\u0269 \u025b-\u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b kajala\u0263
  lone taa e-wezuu ca\u0263\u028b taa.\\n8 \u00d0\u0269p\u0269z\u0269\u0263 n\u025b
  \u0256\u0269ma\u0263z\u0269n\u0269 Yesu al\u0269waat\u028b nd\u028b \u0256\u0269\u00f1\u0269n\u0269\u0263
  n\u028bm\u0254\u014b nd\u0269 nd\u0269 se \u0256\u0269t\u0269\u014bn\u0269 \u0269-y\u0254\u0254
  n\u025b \u0256isusi lalaa t\u0254m y\u0254. \u00d0\u0269lak\u0269 mb\u028b paa le,
  n\u025b paa \u025bz\u0269mtaa. \u00d0\u0269s\u0254\u0254laa se \u0256\u0269laa k\u0269la\u014b
  weyi pay\u0269 p\u0269p\u0254z\u028b\u028b y\u0254 n\u025b p\u0269sa n\u025b \u0256\u0269\u0256\u028b
  nesi t\u0254m susuu t\u028bm\u0269y\u025b. (Mark. 6:31-34; 1 P\u0269y. 2:21) \u0190gb\u025by\u025b
  taa koobiya nab\u025by\u025b k\u025b n\u028bm\u0254\u028b l\u0269z\u0269yaa kiya,
  paa \u0256ooye n\u028bm\u0254\u028b l\u0269z\u0269yaa yaa n\u028bm\u0254\u028b l\u0269z\u028b\u028b
  s\u0269n\u0269yaa. Lalaa \u00f1\u025bkp\u025bl\u0269k\u0269 k\u028bn\u028b\u014b
  k\u0269fal\u028b\u028b yaa pak\u028byaa n\u025b powolo \u0256en\u0256e t\u0254m
  susuyaa t\u0269\u0256\u0254\u0254 y\u0254 se pa\u0256\u028b nesi. \u0190l\u025b
  koobiya sak\u0269y\u025b l\u025b, palak\u0269 po-\u0256o\u014b \u0256e\u0256e n\u025b
  posusuu t\u0254m \u0256o\u014b \u0256o\u014b \u025bz\u0269 p\u025b-w\u025bt\u028b
  ha\u028b-w\u025b n\u028bm\u0254\u028b y\u0254. Paa w\u025bt\u028b nd\u028b taa \u0256\u0269t\u0269\u0269w\u025b\u025b
  y\u0254, Yehowa \u025b\u025bp\u0254z\u028b\u028b-\u0256\u028b se \u0256\u0269la
  mb\u028b p\u0269c\u025bz\u0269 \u0256o-\u0256o\u014b \u0256e\u0256e y\u0254. \u0190s\u0254\u0254laa
  se \u0256\u0269n\u0269\u0269 lele\u014b \u025b-t\u028bm\u0269y\u025b taa al\u0269waat\u028b
  nd\u028b \u0256isusuu \u201c\u0190s\u0254 koboya\u0263 t\u028b t\u025b t\u0254m
  k\u0269band\u028b s\u0254s\u0254t\u028b\u201d y\u0254.\u20141 Tim. 1:11; Wp. 30:11.\\n9.
  (a) \u0190z\u0269ma P\u0254\u0254l\u0269 s\u0269 t\u0254m susuu t\u028bm\u0269y\u025b
  kajala\u0263 lone taa hal\u0269 p\u0269kp\u025bnd\u0269n\u0269 al\u0269waat\u028b
  nd\u028b p\u0269\u0269w\u025b\u025b se \u025bla t\u028bm\u0269y\u025b n\u025b \u025bc\u0254n\u0269
  \u025b-k\u0269c\u025by\u0269m \u0256e\u0256e y\u0254? (b) T\u028bma Lab\u028b 28:16,
  30, 31 w\u0269l\u0269\u0263 se l\u0269ma\u0263za wena P\u0254\u0254l\u0269 kaaw\u025bn\u0269
  \u025b-\u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b y\u0254\u0254?\\n9 \u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b t\u0254m kaak\u0269l\u0269n\u0269 c\u025by\u028b\u028b
  apostoloo P\u0254\u0254l\u0269 wezuu ca\u0263\u028b taa n\u025b p\u028by\u0254\u0254
  l\u025b, \u025bk\u025bn\u0269-\u0256\u028b k\u0269\u0256a\u028b k\u0269ba\u014b\u028b
  si\u014b\u014b. \u0190\u025bk\u025b \u0190s\u0254 t\u0254m tiyiyu. \u0190\u0256\u0254m
  \u025b-n\u028bm\u0254\u028b naal\u025b \u00f1\u0269\u014bg\u028b n\u025b ewolo K\u0254r\u025bnt\u0269
  \u025bgb\u025by\u025b taa l\u025b, liidiye k\u0254\u0254 n\u025b \u0256\u0269t\u025b\u0256\u0269-\u0269.
  P\u028by\u0254\u0254 l\u025b, \u025bkpa\u0263 al\u0269waat\u028b nat\u028by\u028b
  paz\u0269 n\u025b \u025blak\u0269 kizinziki\u014b \u025byaa n\u025b p\u025bh\u025by\u0269\u0263-\u0269.
  Paa mb\u028b y\u0254, p\u0269t\u0269k\u025b kizinziki\u014b lab\u028b t\u028bm\u0269y\u025b
  t\u0254m kaak\u0269l\u0269n\u0269 c\u025by\u028b\u028b P\u0254\u0254l\u0269 \u025bs\u0269ndaa.
  \u0190lab\u0269 t\u028bm\u0269y\u025b n\u0256\u0269 se \u025bp\u0269z\u0269 n\u025b
  \u025bc\u0254n\u0269 \u025b-k\u0269c\u025by\u0269m \u0256e\u0256e n\u025b piyele
  n\u025b esusi K\u0254r\u025bnt\u0269 \u00f1\u0269ma \u201ct\u0254m k\u0269band\u028b
  falaa.\u201d (2 K\u0254r. 11:7) Paa p\u0269\u0269w\u025b\u025b se P\u0254\u0254l\u0269
  \u025bla t\u028bm\u0269y\u025b n\u025b \u025bc\u0254n\u0269 \u025b-k\u0269c\u025by\u0269m
  \u0256e\u0256e y\u0254, ewobi p\u0269-y\u0254\u0254 n\u025b \u025bs\u0269\u0269
  \u0190s\u0254 s\u025bt\u028b t\u028bm\u0269y\u025b kajala\u0263 lone taa n\u025b
  esusuu \u0190s\u0254t\u0254m paa Sabaat\u0269 \u014bg\u028b. \u0190-w\u025bt\u028b
  k\u0254ma n\u025b p\u0269l\u025b\u0263z\u0269 l\u025b, ewobi p\u0269-y\u0254\u0254
  n\u025b \u025bka \u00f1\u028b\u028b n\u025b t\u0254m susuu t\u028bm\u0269y\u025b.
  Mas\u0269 y\u0254\u0254d\u028b\u028b se: \u201cP\u0254\u0254l\u0269 \u025bs\u0269y\u025b
  pa\u0263z\u0269 s\u025b\u028b n\u025b t\u0254m w\u0269l\u028b\u028b si\u014b\u014b,
  \u025bl\u0269za\u0263 Yuuda mba ase\u0263\u0256e se \u025bw\u0269l\u0269-w\u025b
  se Yesu k\u025bn\u0269 Kr\u0269st\u028b.\u201d (T\u028bma 18:3-5; 2 K\u0254r. 11:9)
  P\u028bway\u0269, al\u0269waat\u028b nd\u028b pa\u0256\u0269\u0263-\u0269 \u025b-ma\u0263ma\u0263
  \u025b-\u0256\u0269\u0263a taa p\u0269nz\u0269 naal\u025b Roma t\u025bt\u028b taa
  y\u0254, ewobi p\u0269-y\u0254\u0254 n\u025b esusuu t\u0254m mba powoka\u0263 \u025b-c\u0254l\u0254
  y\u0254, n\u025b \u025bma \u0256\u0254\u0256\u0254 takay\u0269s\u0269 sak\u0269y\u025b.
  (Kal\u0269 T\u028bma Lab\u028b 28:16, 30, 31.) P\u0254\u0254l\u0269 kaat\u025bm
  \u025b-taa se eeyeki n\u025b nab\u028by\u028b p\u0269s\u0269n\u0269 \u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b n\u025b way\u0269. \u0190mawa se: \u201c\u0190z\u0269ma
  . . . p\u025bc\u025bl\u0269-\u0256\u028b l\u0269m \u0256\u028b\u028b t\u028bm\u0269y\u025b
  \u0256\u0269n\u025b y\u0254 p\u028by\u0254\u0254 l\u025b, \u0256iiyeki-\u0256\u0269
  lab\u028b.\u201d (2 K\u0254r. 4:1) \u0190z\u0269 P\u0254\u0254l\u0269 y\u0254, paa
  p\u0269w\u025b\u025b se \u0256\u0269kpa\u0263 al\u0269waat\u028b sak\u0269y\u025b
  n\u025b \u0256\u0269la t\u028bm\u0269y\u025b n\u025b \u0256\u0269c\u0254n\u0269
  \u0256a-k\u0269c\u025by\u0269m \u0256e\u0256e y\u0254, \u0256\u0269p\u0269z\u0269\u0263
  n\u025b \u0256iwolo p\u0269-y\u0254\u0254 n\u025b \u0256\u0269s\u0269\u0269 Kewiya\u0263
  t\u028bm\u0269y\u025b kajala\u0263 lone taa \u0256e-wezuu ca\u0263\u028b taa.\\n10-11.
  Ye \u0256\u0269f\u025by\u0269n\u0269 tomna\u0263 taa alaaf\u0269ya, \u025bz\u0269ma
  \u0256\u0269p\u0269z\u0269\u0263 n\u025b \u0256\u0269la \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b kiya?\\n10 Ye akpad\u0269y\u0269t\u028b yaa
  k\u028bd\u0254\u014b eyeba n\u025b \u0256\u0269\u0269tas\u0269\u0263 p\u0269z\u028b\u028b
  se \u0256isusi t\u0254m kpa\u0263 \u0256\u0269\u0263a n\u025b \u014bwolo \u0256\u0269\u0263a
  \u025bz\u0269 \u0256\u0269s\u0254\u0254l\u028b\u028b y\u0254 y\u0254, \u0256\u0269p\u0269z\u0269\u0263
  n\u025b \u0256\u0269t\u0269\u014bn\u0269 n\u028bm\u0254\u014b l\u025b\u025b\u014b
  y\u0254\u0254 n\u025b \u0256isusuu t\u0254m. Kajala\u0263 Kr\u0269st\u028b \u00f1\u0269ma
  \u00f1aka\u0263 pana n\u025b posusuu t\u0254m \u025byaa paa le. Pat\u0269\u014ba\u0263n\u0269
  n\u028bm\u0254\u014b t\u0269\u014ba y\u0254\u0254 se peheyi toovenim t\u0254m \u025byaa.
  Pat\u0269\u014ba\u0263n\u0269 kpa\u0263 \u0256\u0269\u0263a n\u025b \u014bwolo \u0256\u0269\u0263a,
  sama\u0263 taa, n\u025b al\u0269waat\u028b fan\u028b\u028b t\u0254m susuu y\u0254\u0254
  n\u025b posusuu t\u0254m \u2018\u025byaa mba pakata\u0263 paa evemiye n\u0256\u0269
  y\u0254.\u2019 (T\u028bma 17:17; 20:20) Ye \u0256\u0254n\u025b \u025bw\u025b-\u0256\u028b
  ka\u0256\u025b y\u0254, \u0256\u0269p\u0269z\u0269\u0263 n\u025b \u0256\u0269ca\u0263
  lone n\u0256\u0269 \u0256\u0269-taa \u025byaa sak\u0269y\u025b w\u025b\u025b y\u0254,
  n\u025b \u0256isusuu t\u0254m mba p\u025b\u0256\u025b\u0263 y\u0254. Yaa p\u0269t\u0269la
  \u0256\u0269p\u0269z\u0269\u0263 \u0256\u0254\u0256\u0254 n\u025b \u0256\u0269la
  al\u0269waat\u028b fan\u028b\u028b t\u0254m susuu, \u0256\u0269ma takay\u0269s\u0269,
  yaa \u0256\u0269t\u0269\u014bn\u0269 ka\u014bgalaafu y\u0254\u0254 n\u025b \u0256isusi
  \u025byaa t\u0254m. Mba k\u028bd\u0254\u014b yaa kala l\u025b\u025bna y\u0254\u0254
  l\u025b, paap\u0269z\u0269\u0263 n\u025b posusuu t\u0254m kpa\u0263 \u0256\u0269\u0263a
  n\u025b \u014bwolo \u0256\u0269\u0263a al\u0269waat\u028b sak\u0269y\u025b y\u0254,
  pap\u0269z\u0269\u0263 n\u025b pat\u0269\u014bn\u0269 n\u028bm\u0254\u014b \u025bn\u0269
  \u0269-y\u0254\u0254 n\u025b pehi\u0263 taa lele\u014b si\u014b\u014b t\u0254m susuu
  taa.\\n11 Paa \u0256\u0269f\u025by\u0269n\u0269 tomna\u0263 taa alaaf\u0269ya y\u0254,
  \u0256\u0269p\u0269z\u0269\u0263 n\u025b \u0256\u0269la \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b kiya. Iyele n\u025b \u0256\u0269\u0256a\u0263n\u0269
  y\u0254\u0254d\u028b\u028b apostoloo P\u0254\u0254l\u0269 k\u0269\u0256a\u028b t\u0254m.
  \u0190y\u0254\u0254daa se: \u201cP\u0269t\u0269\u014ba pay\u0269 p\u0269-taa l\u025b,
  m\u025bw\u025bn\u0269 \u0256o\u014b p\u0269t\u0269\u014bn\u0269 weyi \u025bha\u0263-m
  \u0256o\u014b y\u0254 \u025b-y\u0254\u0254.\u201d (Fil. 4:13) Al\u0269waat\u028b
  nd\u028b P\u0254\u0254l\u0269 \u0256\u0254\u014ba\u0263 n\u028bm\u0254\u028b nak\u028by\u028b
  n\u025b \u025bh\u0269n\u0269 k\u028bd\u0254\u014b y\u0254, p\u0269\u0269p\u0254z\u0269-\u0269
  \u0256o\u014b \u025bn\u028b. Eheyi Galaatii mba se: \u201cMon-tomna\u0263 taa k\u028bd\u0254\u014b
  nak\u028by\u028b y\u0254\u0254 maahi\u0263 wa\u0256\u025b kajala\u0263 \u0256e\u0256e
  n\u025b monsusi-m\u0269 t\u0254m k\u0269band\u028b.\u201d (Gal. 4:13) Mb\u028b \u0256\u0254\u0256\u0254
  p\u0269t\u0269la y\u0254, \u025bz\u0269ma \u014bf\u025by\u0269n\u0269 tomna\u0263
  taa alaaf\u0269ya y\u0254, p\u0269p\u0269z\u0269\u0263 n\u025b p\u0269ha-\u014b
  wa\u0256\u025b n\u025b \u014bsusi t\u0254m k\u0269band\u028b \u025byaa nab\u025by\u025b
  \u025bz\u0269 \u0256\u0254k\u0254t\u0254naa n\u025b mba p\u0254c\u0254\u014bn\u0269
  \u00f1\u0254-y\u0254\u0254 y\u0254. \u00d0o\u014b \u0256o\u014b l\u025b, \u025byaa
  mba pa-taa sak\u0269y\u025b w\u025b pa-t\u028bma taa, al\u0269waat\u028b nd\u028b
  t\u0254m susuyaa woki pa-\u0256\u0269s\u0269 taa y\u0254.\\n\u0190Z\u0196MA \u00d0\u0196P\u0196Z\u0196\u0194
  N\u0190 \u00d0\u0196CA\u0194 WEZUU K\u0190L\u0190\u01b2 Y\u0186\\n12. Ye p\u0254t\u0254m
  se \u00f1\u025b-\u025bs\u0269y\u025b \u025bw\u025b\u025b \u201cp\u028by\u028b k\u028b\u0256\u028bm
  y\u0254\u0254,\u201d p\u028b-t\u0254b\u028b\u028b l\u025b suwe?\\n12 Yesu y\u0254\u0254daa
  se: \u201cTomna\u0263 kan\u0256\u028b l\u025b \u025bs\u0269y\u025b. Ye mb\u028b,
  ye \u00f1\u025b-\u025bs\u0269y\u025b \u025bw\u025b p\u028by\u028b k\u028b\u0256\u028bm
  y\u0254\u0254 [yaa \u201c\u025bw\u025b k\u025bl\u025b\u028b\u201d, p\u0269-t\u025b\u025b
