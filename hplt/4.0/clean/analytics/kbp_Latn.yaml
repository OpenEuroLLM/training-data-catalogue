  tomna\u0263 t\u0269\u014ba taa n\u025b p\u0269ya\u0263 tomna\u0263 \u0256o\u014b.
  Mb\u028a yekina n\u025b \u025by\u028a tomna\u0263 taa w\u025b\u028a alaaf\u0269ya.\\nT\u0254\u0254na\u0263
  k\u028at\u0254wa\u0263 \u014bga, ka-taa mb\u028a p\u0269\u0269waz\u0269\u0263 tomna\u0263
