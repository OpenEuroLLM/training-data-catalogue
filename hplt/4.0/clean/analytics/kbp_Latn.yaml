  Amoosi paaca\u0263 wezuu al\u0269waat\u028b k\u028b\u0256\u028bmt\u028b taa. H\u0254\u0254l\u0269\u014b
  \u0269n\u025b \u0269-t\u0269\u014ba \u0269ka\u0263-\u014b s\u0269n\u028b\u028b n\u025b
