  se: \u2018\u0190yaa sama\u0263 k\u0269l\u0269 \u0256\u0254\u028b \u00f1\u0254-c\u0254l\u0254.\u2019
  \u0190b\u025b y\u0254\u0254 Yehowa y\u0254\u0254d\u0269 mb\u028b?\\nMb\u028b p\u028by\u0254\u0254
  y\u0254, ye Izray\u025b\u025bl\u0269 piya \u0269waba y\u0254, s\u0269p\u0269z\u0269\u0263
