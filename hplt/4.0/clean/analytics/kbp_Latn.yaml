sample: '["\"Henry Ford k\u025b \u025bja\u0256\u025b n\u0256\u0269 paya\u0263-\u0256\u0269
  size Etaazuunii y\u0254 \u0256\u0269-t\u025bt\u028b taa p\u0269\u0263a. Pal\u028bla-\u0269
  Has\u0269ya\u0256\u025b fena\u0263 taa k\u0269yak\u028b hi\u014b naadozo (30) n\u0304\u0269\u014bg\u028b
  wiye p\u0269na\u0263 1863 n\u0304\u0269\u014bga taa. Egeetiye n\u0256\u0269 \u0256\u0269-taa
  pal\u028bla \u0256ajaa s\u0254s\u0254 Henry Ford \u025bn\u025b y\u0254, n\u0256\u0269
  paya\u0263 size Dearborn, \u0256\u0269w\u025b Michigan \u025bjad\u025b n\u0256\u0269
  \u0256\u0269\u0256\u0269 k\u025bna Etaazuunii t\u025b \u025bja\u0256\u025b cikpe\u0256e
  naa\u0256\u0269 y\u0254 \u0256\u0269-taa.\\n\u0189ajaa \u025bn\u028b, \u025bs\u0269ba
  \u0256oma\u0263 fena\u0263 taa k\u0269yak\u028b l\u028bb\u025b (7) n\u0304\u0269\u014bg\u028b
  wiye p\u0269na\u0263 1947 n\u0304\u0269\u014bga taa. T\u025bt\u028b nd\u028b t\u0269-taa
  \u025bs\u0269ba y\u0254, nd\u028b paya\u0263 size Dearborn \u0256en\u0256e paal\u028bla-\u0269
  y\u0254. \u0189ajaa Henry Ford \u025bn\u025b, \u025bk\u025b t\u028bma nd\u0269 nd\u0269
  la\u0256\u028b s\u0254s\u0254 n\u0254\u0254y\u028b Etaazuunii \u025bja\u0256\u025b
  n\u0256\u0269 \u0256\u0269-taa pee\u0256e.\\nK\u0254n\u0254\u0254 kpa\u0256\u028b
  h\u025bk\u028b n\u025b h\u025bk\u028b n\u0304\u0269\u014bg\u028b taa mb\u0269 y\u0254\u0254
  l\u025b, \u0256ajaa \u025bn\u025b \u025bk\u025bk\u025bna nd\u0269 nd\u0269 t\u028bma
  la\u0256\u028b s\u0254s\u0254 weyi pataway\u0269 liuu si\u014b\u014b y\u0254. Al\u0269waat\u028b
  nd\u028b t\u0269-taa \u0256\u0254\u0256\u0254 l\u025b, \u025bn\u028b kaak\u025bna
  l\u0254\u0254\u0256a \u0256\u0269la\u0256\u025b lone t\u028bm\u0269y\u025b t\u028b.
  \u0190t\u028bm\u0269y\u025b n\u0256\u0269 paya\u0263 size Ford. \u0189\u0269s\u0269ma
