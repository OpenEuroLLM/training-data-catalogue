  s\u025bt\u028b t\u028bm\u0269y\u025b kiya y\u0254.\u201d)\\n15 N\u028bm\u0254\u028b
  l\u025b\u025bk\u028b \u014bg\u028b k\u0269-y\u0254\u0254 \u0256\u0269p\u0269z\u0269\u0263
  \u0256\u0269t\u0269\u014bna n\u025b \u0256\u0269la \u0256\u025b-\u0190s\u0254 s\u025bt\u028b
  t\u028bm\u0269y\u025b kiya y\u0254 l\u025b se \u0256\u0269\u00f1a\u0263 pana n\u025b
  \u0256\u0269w\u025b\u025b niye t\u0254m susuu taa n\u025b p\u0269kpa\u0256\u0269.
  T\u028bma naay\u025b taa l\u025b, p\u0269p\u0254z\u028b\u028b se pafal\u0269s\u0269\u0263
  t\u028bmla\u0256aa paa \u025bz\u0269mtaa n\u025b p\u025bw\u025b\u025bn\u0269 l\u025b\u0263t\u028b
  n\u025b p\u025bw\u025b\u025b \u0256\u0254\u0256\u0254 niye pa-t\u028bm\u0269y\u025b
  taa n\u025b p\u0269kpa\u0256\u0269. Mb\u028b \u0256\u0254\u0256\u0254 p\u0269w\u025b
  Kewiya\u0263 t\u0254m susuyaa h\u0254\u0254l\u028b\u028b taa. P\u0269w\u025b\u025b
  se \u0256iwolo p\u0269-y\u0254\u0254 n\u025b \u0256\u0269kp\u025bl\u0269k\u0269\u0263
  \u025bz\u0269ma \u0256\u0269la n\u025b \u0256\u0269w\u025b\u025b niye \u0256\u025b-\u0190s\u0254
  s\u025bt\u028b t\u028bm\u0269y\u025b taa n\u025b p\u0269kpa\u0256\u0269 y\u0254.\u2014Adu.
  1:5; kal\u0269 1 Timootee 4:13, 15.\\n16 \u0190l\u025b, \u025bz\u0269ma \u0256\u0269p\u0269z\u0269\u0263
  n\u025b \u0256iwolo p\u0269-y\u0254\u0254 n\u025b \u0256\u0269\u0256\u025b\u025bn\u0269
