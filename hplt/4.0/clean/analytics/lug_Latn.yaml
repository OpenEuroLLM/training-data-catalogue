  box_shadow_color=\u201d#0C71C3\u2033]\\n29. ESSULA: AL-ANKABUT, \u2018NABBUBI\u2019\\nYakkira
  Makka. Erina Aya 69.\\nKulw\u2019erinnya lya Allah Omusaasizi ennyo ow\u2019okusaasira
  okw\u2019enjawulo.\\n1. Alif,Lam. Mim\\n2. Abaffe abantu basuubidde okulekwa obulekwa,
  okwogera obwogezi nti twakkiriza naye nga tebagezesebwa?\\n3. Mazima twagezesa bali
  abaabasookawo. Era Katonda amanyira ddala abo abaali abaamazima era amanyira ddala
  abalimba.\\n4. Nandiki basuubidde abo abakola ebyambyone nti basobola okutusimattuka?
  Bibi nnyo ebyo byebalamula.\\n5. Oyo alina essuubi ly\u2019okusisinkana Katonda
  mazima entuko za Katonda zijja kutuukirira era ye wuyo Omuwulizi Omumanyi.\\n6.
  Era oyo afubye okukola, mazima ekyo kyaba afubirira y\u2019emmeeme ye. Mazima Katonda
  ye Mugagga eyemalirira mpawo kyeyetaaga ku bitonde.\\n7. Ate abo abakkiriza era
  abaakola ebirungi tuba tubakenderezaako ddala ebibi byabwe era tuba tubasasulira
  ddala ekisinga obulungi kwebyo bye baali bakola.\\n8. Kale twalaamira omuntu bazadde
  be okubayisa obulungi; Naye ssinga bakufubako, osikirizibwe okungattako ebyo byotalina
  kyobimanyiko tobagondera. Gyendi y\u2019eri obuddo bwammwe, (mwenna) mbe nga mbategeeza
  bye mwali mukola.\\n9. Ate abo abakkiriza era abaakola ebirungi tuba tubayingiriza
  ddala mu luse lw\u2019abalongofu.\\n10. Kale abantu abamu mulimu abagamba nti: \u2018Twakkiriza
  Katonda, kyokka ssinga anakuwazibbwa olwa (okuyimirizawo eddiini ya) Katonda agerageranya
  ekigezo ky\u2018abantu mungeri eterina njawulo na kibonerezo kya Katonda, ate bwe
  buba butuuse obuwanguzi obuva ewa Mukama Katonda Omulezi wo olwo babategeereza ddala
  nti: \u2018Mazima ffe tubadde bumu nammwe!\u2019. Abaffe Katonda naye asobola obutamanya
  ebyo ebiri mu bifuba bya bitonde byonna?\\n11. Kale Katonda aba amanyidde ddala
  abo abakkiriza era aba amanyidde ddala abannanfusi.\\n12. Ate abo abaajeema baategeeza
  abo abakkiriza nti: \u2018Mugoberere ekisinde kyaffe era ffe tuvunanyizibwa okwetikka
  ebyonoono byammwe!\u2019 Sso nga bbo tebavunanyizibwa kwetikka ku byonoono byabwe
  kintu kyonna. Mazima bebo abalimba.\\n13. Kale ba kwetikkira ddala obuzito bwabwe
  n\u2019obuzito obulala obwegatta ku buzito bwabwe era, babuulizibwe ddala ku lunaku
  lwamayimirira ebyo bye baali bagunjawo.\\n14. Kale mazima twatuma Nuhu mu bantu
  be era yabalwamu ebbanga lya myaka lukumi nga ojjeeko ataano, olwo ne gabazikiriza
  amataba nga balemedde mu bujeemu.\\n15. Bwetutyo twamuwonya n\u2019abali mu lyato,
  era ekyo twakifuula ekyamagero ekiyigiriza ensi.\\n16. (Netutuma) ne Ibrahim. Jukira
  lwe yalagira abantu be nti: \u2018Musinze Katonda era mu mutye! Ekyo kyekisinga
  obulungi gye muli bwe muba mumanyi\u2019.\\n17. \u2018Mazima ebyo bye musalawo okusinza
  nga muvudde ku Katonda, bifananyi era mujwetekawo bya bulimba. Mazima ebyo bye musinza
  nga muleseewo Katonda tebirina buvunanyizibwa gye muli bwa kubagabirira, kale munoonye
  okuva ewa Katonda yekka obugabirizi era mu musinze era mu musiime. Gyali mwenna
  gye muzzibwa.\\n18. Naye bwe mujeema, mazima gyali migyemu emirembe nfafa egya basookawo.
  Era tewali kyavunanyizibwa kirala omubaka okujjako okutuusa obubaka obwanjulukufu\u2019.\\n19.
  Abaffe balemeddwa okwerolera engeri Katonda gyatandika okutonda ebitonde, bwamala
  abizzaawo. Mazima ekyo ewa Katonda kyangu.\\n20. Balagire nti: \u2018Mutambule munsi
  mwerolere engeri (Katonda) gye yatandikawo obutonde. Oluvannyuma Katonda abisibula
  olusibula olusembayo. Mazima Katonda buli kintu ye Musobozi.\\n21. Abonereza gwayagala
  era asaasira gwayagala era gyali gyemuzzibwa.\\n22. Era tewali mmwe kyemuyinza kulemesa
  (kutuukirizibwa) munsi newankubadde mu ggulu. Era temulinaayo nga ojjeeko Katonda
  mukuumi yenna wadde omutaasi.\\n23. Naye abo abaajeemera amateeka ga Katonda n\u2019okumusisinkana,
  bebo abatakyalina ssuubi lya (kufuna) busaasizi bwange, era bebo ab\u2019okufuna
  ekibonerezo ekikakali.\\n24. Naye tewaaliwo ngeri ndala gye baayanukula abantu be
  (Ibrahiim) okujjako okugamba nti: \u2018Mu mutte oyo oba ssi ekyo mu mwokye!\u2019.
  Naye Katonda yamuwonya obutayokebwa muliro. Mazima ekyo kirimu ekyamagero ekiyigiriza
  abantu abakkiriza.\\n25. Yabagamba nti: \u2018Mazima ebyo bye mwessizaawo nga muvudde
  ku Katonda, bifananyi, ekyo nga kyemwegombye mwekka mu buwangazi bwensi. Ekyo nga
  kiwedde ba kuwakanya abamu mummwe bannaabwe, era ba kukolimira abamu mummwe bannaabwe,
  era obuddiro bwammwe gwe muliro era temulinaawo ba bataasa.\\n26. Bwatyo Luutu yamukkiriza
  era yagamba nti: \u2018Nze nsazeewo kusenguka kudda eri Mukama Katonda Omulezi wange.
  Mazima yewuyo Luwangula Omulamuzi.\\n27. Kale twamugemulira (ezzadde lya) Isihaka
  ne Yakuubu era twassa muzzadde lye obwannabbi n\u2019ekitabo era twamusasula empeera
  ye munsi, nate mazima yye, ku lunaku lw\u2019enkomerero wa kuba mu luse lwa batuukirivu.\\n28.
  Ne Luutu (Naye twamuwonya), Jjukira lwe yategeeza abantu be nti: \u2018Mazima mmwe
  mukolera ddala eby\u2019obuwemu ebitalina yali abibasooseeko (ku bikola) noomu mu
  bantu bensi yonna.\\n29. Abaffe musalirawo ddala mutya mmwe okuganza abasajja n\u2019okukola
  obwakkondo mu makubo n\u2019okuku\u014b\u014baanira mu bibinja byammwe okukola ebyambyone.
  Naye tewaaliwo ngeri ndala gye baayanukula abantu be (Luutu) okujjako okugamba nti:
  \u2018Kale tutuseeko ekibonerezo kya Katonda bwoba oli wa mazima.\\n30. Yasaba nti:
  \u2018Ai Mukama Katonda Omulezi wange ntasa ku bantu abonoonefu.\\n31. Naye bwe
  baamala ababaka baffe okutuuka eri Ibrahim nga bamutwalidde amawulire ag\u2019essanyu
  baamutegeeza nti mazima tulina okuzikiriza abantu b\u2019ekyalo kino. Mazima abantu
  bakyo baalemera mu bwewagguzi.\\n32. Yabategeeza nti: \u2018Mazima Luutu ali eyo!\u2019
  baamuddamu nti: \u2018Ffe tusinga okumanya (abalongofu) abalimu. Oyo yye turina
  kumuwonyeza ddala n\u2019abantu be nga ojjeeko mukyala we eyasalilwawo okusigala
  (mu kibonerezo).\\n33. Naye bwe baamala ababaka baffe okutuukirira Luutu yajjirwa
  okubeeraliikirira (okutuusibwako) ekibi, era emmeeme ye yafundiwalirwa ku lwabwe
  okusala amagezi, naye baamugumya nti: \u2018Totya era tonakuwala ffe mazima tuli
  ba ku kuwonya n\u2019abantu bo nga ojjeeko mukyala wo eyasalilwawo okusigala (mu
  kibonerezo).\\n34. Mazima ffe tulina okutuusa ku bantu ba kino ekyalo ekibonerezo
  nga kiva muggulu nga balangibwa engeri gyebabadde bayonoona.\\n35. Era mazima twakirekamu
  (ekyalo ekyo) ekyamagero ekyeyolefu eri abo abantu abategeera.\\n36. Ate waatumwayo
  eri (abantu be) Madiyana Muganda wabwe Swaibu era yabalagira nti: \u2018Bannange
  musinze Katonda era musuubire olunaku lwenkomerero era mwewale okubunyisa mu nsi
  obwonoonefu.\\n37. Kyokka baamulimbisa bwebatyo baatuusibwako okuyuuguuma kwa musisi
  nebakeeseza mu maka gabwe nga baga\u014b\u014balamye. 38. Ne (omulembe gwa) Aad
  ne Thamud (Musisi yagiyuuguumya). Era mazima byeyoleka gyemuli ebikwata ku maka
  gabwe (byemwafunamu eky\u2019okuyigirako). Era Ssitaani yabawundira emirimu gyabwe
  (emibi) olwo n\u2019ebawugula ku mugendo sso nga baali basobola okwekkaanya.\\n39.
  Ne Qaruna ne Firawo ne Hamaana (Ssitaani yabawugula). Kale mazima yatuuka gyebali
  Musa n\u2019obunnyonnyofu naye beekuluntaza munsi era tebaasobola kusimattuka (bibonerezo).\\n40.
  Kale buli kinnakimu (mu bibinja ebyo) twakituusa ku kibonerezo kyakyo. Era ebimu
  mubyo mulimu (abo) betwasindikira (kibuyaga alimu) amayinja, era ebimu mubyo mulimu
  (abo) be kwatuukako okubwatuka, era ebimu mubyo mulimu (abo) be twabuutikiza ettaka,
  era ebimu mubyo mulimu (abo) be twazikiriza (mungeri endala). Kale tekyamugwanira
  Katonda kubalyazamanya wabula baali myoyo gyabwe gye balyazamanya.\\n41. Enfanana
  yabo abessizaawo, nga baleseewo Katonda, baddunda abalala eringa Nabbubi eyezimbira
  enju. Sso nga mazima ekisingayo obunafu mu mayumba, ddala (ye) nnyumba ya Nabbubi,
  ssinga baali bamanyi.\\n42. Mazima Katonda amanyi ebyo bye basinza ebitali Yye bya
  nnaba ki. Era yoyo Luwangula Omulamuzi Kalimagezi.\\n43. Kale eyo y\u2019engeri
  eby\u2019okulabirako gye tubissizaawo abantu. Era mpawo abitegeera okujjako abamanyi.\\n44.
  Katonda yatonda eggulu n\u2019ensi olw\u2019ensonga entufu. Mazima ekyo kirimu ekyamagero
  eri abo abakkiriza.\\n45. Gwe soma ekiba kibikkuddwa gyoli nga kisimbulwa mu kitabo,
  era yimirizaawo esswala. Mazima esswala ekugira obutakola bya buwemu n\u2019ebitamibwa.
  Era okutendereza Katonda ddala ky\u2019ekisingayo obunene. Era Katonda amanyi bye
  mukola.\\n46. Kale mwewale okuwakanya ba nnannyini kitabo okujjako nga ekyeyambisiddwa
  kyekyo ekisingayo obulungi, nga totwaliddeemu abo abaalyazamanya abasangibwa mu
  kibinja kyabwe. Era mubategeeze nti: \u2018Ffe twakkiriza ebyo ebyatussibwako era
  ebyassibwa gye muli. Era Omusinzibwa waffe n\u2019omusinzibwa wammwe yomu era ffe
  oyo yekka gwe twewaayo gyali (gwe tusiramukira)\\n47. Kale eyo y\u2019engeri gye
  twassa gyoli ekitabo. Era abo be twawa ekitabo bakikkiriza. Era n\u2019abamu kwabo
  mulimu oyo akikkiriza. Kale teriiyo awakanya mateeka gaffe okujjako abajeemu.\\n48.
  Kale tobangako asobola okusoma olubereberye lwayo (eyo Qur\u2019an) nga osimbula
  mu kitabo (kyonna) era toyinza kugiwandiisa mukono gwo ogwaddyo. Olwo baalibuusizzabuusizza
  abonoonyi.\\n49. Wabula eyo (Qur\u2019an) ge mateeka amanjulukufu agali mu bifuba
  by\u2019abo abaawebwa obuyivu. Era mpawo awakanya mateeka gaffe okujjako abalyazamanyi.\\n50.
  Kale baabuuza nti: \u2018Kiki ekyalemesa okussibwa gyali ekyamagero ekisibuka ewa
  Mukama Katonda Omulezi we? Baddemu nti: \u2018Mazima ebyamagero yokka gye bisangibwa
  ye wa Katonda, era nze ekyo kyennina okutuukiriza kw\u2019ekuba omulabuzi omweyolefu.\\n51.
  Abaffe balemeddwa okumalirwa eky\u2019okuba nti twassa gyoli ekitabo ekibasomerwa?
  Mazima ekyo mulimu obusaasizi n\u2019okwejjukanya ebyayawulirwa abantu abakkiriza.\\n52.
  Bategeeze nti: \u2018Kimaze bumazi okuba nti Katonda ali wakati wange nammwe nga
  omujulizi. Amanyi ebiri muggulu n\u2019ensi. Era abo abakkiriza ebikyamu era abaawakanya
  Katonda, bebo abaafaafaagana.\\n53. Ate banguyirira okukusaba okutuusibwako ekibonerezo.
  Naye ssinga zaali tezisalibwangawo entuko zabwe engereke, kyalibatuuseeko ekibonerezo,
  naye ddala kyakubatuukako kibwatukira nga bbo tebamanyi.\\n54. Banguyirira okukusaba
  okutuusibwako ekibonerezo sso nga mazima ggeyeena yebunguludde abajeemu.\\n55. Olunaku
  lwe kibabuutikira ekibonerezo nga kisinzira waggulu wabwe ne wansi w\u2019ebigere
  byabwe olwo n\u2019abagamba nti: \u2018Mulege ku (mpeera ya) ebyo bye mubadde mukola.\\n56.
  Abange mmwe abaddu bange abo abakkiriza, mazima ensi yange ngazi kale nze nzekka
  gwe muba musinza.\\n57. Buli mwoyo gulina okuloza ku kufa oluvannyuma gyetuli gye
  muzzibwa.\\n58. Era abo abakkiriza era abakola ebirungi mazima tulina okubateekerateekera
  mujjana ebisenge nga gikulukutira wansi wabyo emigga, ba kubeera omwo lubeerera,
  nga y\u2019empeera ey\u2019omukisa ey\u2019abakozi (b\u2019ebirungi).\\n59. Abo
  abaagumiikiriza era nga Mukama Katonda Omulezi wabwe yekka gwe besigamira.\\n60.
  Kale kameka nga enkuyanja y\u2019ebiramu ebitambula tebyesibirira ntanda ya byakulya
  byabyo? Katonda byonna abigabirira (n\u2019agabirira) nammwe. Era yewuyo Omuwulizi
  Omumanyi.\\n61. Ate bwoba obabuuzizza nti: \u2018Ani yatonda eggulu n\u2019ensi
  era eyafuula okuba ebigonvu enjuba n\u2019omwezi, baba baddiramu ddala nti: \u2018Katonda\u2019.
  Kale lwaki ate bawuguka?\\n62. Katonda ayanjuluza enfuna yoyo gwayagala mu baddu
  be era agimiima eyoyo (Gwayagala). Mazima Katonda buli kintu ye Mumanyi.\\n63. Ate
  bwoba obabuuzizza nti: \u2018Ani assa okuva muggulu amazzi n\u2019ageyambisa okulamusa
  ensi ekyo nga kiddirira obufu bwayo, baba baddiramu ddala nti: \u2018Katonda\u2019.
  Tendereza nti: Amatendo amalungi ga Katonda!\u2019. Ekyembi abasinga obungi mu kibinja
  kyabwe tebategeera.\\n64. Era mpawo kiri mu bya buwangazi bwa nsi okujjako okutiguka
  n\u2019omuzannyo. Era mazima ennyumba ey\u2019enkomerero y\u2019eyo ey\u2019obuwangazi
  obw\u2019obulamu. Singa babadde bamanyi.\\n65. Kale bwe baba basaabadde mu maato
  basaba Katonda, kyokka bwaba abasomosezza ku ttale nga olwo batanula okuyimbagatanya.\\n66.
  Nga bagenderera okuwakanya ebyo (eby\u2019omukisa) bye yabawadde era bagenderera
  okweyagala. Kyaddaaki banaamanya.\\n67. Abaffe balemeddwa okwerolera engeri gye
  twafuula ekifo okuba eky\u2019emirembe, sso nga bakwakkulwa bukwakkulwa abantu abasangibwa
  eyo okukyebungulula?. Abaffe ebikyamu bye bakkiririzaamu ate omukisa gwa Katonda
  gwe bawakanya?,\\n68. Era mpawo kasobeza asinga oyo ajwetese ku Katonda obulimba
  era alimbisizza amazima nga gamaze okumujjira? Abaffe yali abuzeemu ddi ggeyeena
  obutuuze bwa bajeemu?\\n69. Era abo abaafuba ennyo (okulwanirira eddiini) ku lwaffe
  tuba tubalu\u014b\u014bamiza ddala mu makubo gaffe (agatutuukako). Era mazima Katonda
  ali wamu n\u2019abalongosa.\\n[/et_pb_text][/et_pb_column][/et_pb_row][/et_pb_section]\"",
  "\"OMWEZI ogujja abayizi ba yunivasite bagenda kutandika olusoma lwabwe olutandika
  omwaka. Abayizi naddala abava mu siniya beesunga kubanga bamanyi bawonye amateeka
  ga siniya gye babadde bafugibwa okuva ku ntambula, ennyambala okutuukira ddala mu
  kibiina mw''asomera.\\nBamanyi nti ku yunivasite bajja kukola buli kye baagala olw''eddembe
  lye bawulira babawa. Wadde ku yunivasite ebaayo eddembe baba n''amateeka agabafuga
  wadde teri ajja kukutambulirako kugassa mu nkola.\\nAbayizi abamu eddembe balikozesa
  bubi oluusi ne balemererwa okutuukiriza ebirooto byabwe. Agamu ku mateeka agalina
  okugobererwa mu yunivasite ezenjawulo ge gano; MAKERERE UNIVERSITY Dr. Muhammad
  Kiggundu Matovu omwogezi wa yunivasite, yagambye nti yunivasite mu nteekateeka yaayo,
  eruubirira okutendeka omuyizi okusobola okwerabirira yekka nga teri amugoberera.\\nY''ensonga
  lwaki obulippo obussibwa ku muyizi tebuba bungi nga bwe bubadde mu siniya. Amateeka
  ga yunivasite gonna gye gava ne gye gakoma gagenderera kuyigiriza muyizi okukolagana
  n''abantu abembeera ez''enjawulo n''okumwagazisa okwerwanako.\\nY''ensonga lwaki
  amateeka ga yunivasite gawa omuyizi eddembe okweyisa nga bw''ayagala ssinga aba
  akola ebyo yunivasite by''eragira. Agamu ku mateeka gano kuliko;\\n- Okusoma: ,Omuyizi
  atwalibwa okuba nti muntu mukulu asobola okwekubiriza. Olina okuba nga waakiri obadde
  mu kibiina ebitundu 80 ku 100 okukkirizibwa okutuula ebigezo ebikomekkereza olusoma.
  Mu mbeera eno bwodda mu kucakala n''otosoma okusoma kuyinza okukulema.\\n- 2 Ebigezo:
  Bino byawulwamu emirundi ebiri. Waliyo ekitundu ekya \u2018Course Work'' nga bakuwa
  ekibuuzo n''ogenda okunoonyereza mu kukiddamu ate ekitundu ekirala kya bigezo ebiggalawoolusoma.\\n-
  Yunivasite tekaka bayizi kukola bigezo. Etteeka ligamba nti \u2018Course work''
  atwala obubonero bwa bitundu 30 ku 100 ate ekigezo ekisembayo kitwala ebitundu 70
  ku 100. Ssinga oba tokoze \u2018Course work'' totawaana na bigezo byakamalirizo.
  l Ssinga omuyizi aba takoze bibuuzo 3 ku masomo 6 g''aba akola, ono takkirizibwa
  kweyongera mu maaso. Alina okuddamu olusoma olwo. l Omuyizi bwaba yagwa ekigezo
  ekisooka bamuwa okukissa okukiddamu. Wabula ssinga bw''oddamu toweza bubonero 50
  ateekwa okuddamu olupapula olwo nga tannaba kutikkirwa. Omuyizi alina okulusasulira
  okusinziira ku mwaka gw''ebyensimbi ogwo. l Omuyizi bwakola obubi mu bigezo n''afuna
  obubonero (CGP) obuli wakati wa 2-2.5 CGP mu mwaka omulamba awummuzibwa agende yeetereeze
  era oluvannyuma lw''omwaka aweebwa omukisa n''akomawo. Ssinga akomawo n''alemererwa
  okukyusa olwo yunivasite esobola okumugoba. l Omuyizi abadde akola obulungi nga
  taddangamu kigezo olwolumu ssinga afuna obubonero nga 47 ku 100 bayinza okumwongerako
  obubonero busatu n''awona okuddamu ekigezoEmyaka gy''olina okumala ku yunivasite:
  Omuyizi tebamusuubira ku kandaalira ku yunivasite. Ekinene ennyo kkoosi bw''eba
  ebadde ya myaka 3 okkirizibwa okugisomera emyaka 5 ssinga olaga ensonga ezizze zikulemesa
  okusoma ne balaba nga zirimu eggumba. 4 Okubba ebibuuzo: Ssinga omuyizi akwatibwa
  ng''akoppa, ayinza okugobwa oba okuyimirizibwa. 5 Ensasula ya fiizi: Omuyizi aweebwa
  wiiki 6 ng''amazeeyo ebisale bya yunivasite era ssinga \u2018Course Work'' oba ebibuuzo
  ebikomekkereza olusoma bituuka ng''omuyizi tannamalayo fiizi takkirizibwa kukola
  bibuuzo nga ne z''aba asasuddeko tezimuddizibwa. 6 Okukyusa University: Omuyizi
  abadde asomera e Makerere okukyusa agendE awalala ng''ayongereza we yakomye tekikola.
  . 7 Emize agenda e Makerere gy''ateekwa okwewala; Omuyizi ssinga akwatibwa mu bikolwa
  ebikyamu atwalibwa mu lukiiko olukwasisa empisa okwewozaako. Bwe gumusinga ng''afuna
  ekibonerezo kyonna olukiiko kye luba lusazeewo. Efujjo; Omuyizi takkirizibwa kwenyigira
  mu bikolwa bya ffujjo. Emize emirala omuli obubbi, n''okulwana. Dr.Kiggundu awadde
  abayizi amagezi obutacamuukirira na ddembe lye bafuna wabula okulikozesa okukuza
  endowooza zaabwe. MAKERERE BUSINESS SCHOOL(MUBS) NAKAWA Omwogezi wa Mubs, Peter
  Simon Odoki, alambuludde ku mateeka abayizi ge balina okugoberera. Ensasula ya fiizi:
  Omuyizi ateekwa okusasula mu wiiki 6 ezisooka. Yunivasite tekugoba mu kibiina naye
  olina okwekubiriza ebigezo bituuke nga weetereeza dda. Omuyizi ateekeddwa okubeera
  mu bibiina ekiseera kya bitundu 75 ku 100 era ssinga takituukiriza takkirizibwa
  kukola bigezo. Course work naye wa tteeka ku buli muyizi olw''ensonga nti akola
  ebitundu 40 ku 100 ku bubonero obwakamalirizo. Ebigezo bye bitwala ebitundu 60 ku
  100. Omuyizi atakoze \u2018Course Work'', n''ekibuuzo takkirizibwa kubikola. Omuyizi
  atewezezza bubonero 50 ku 100 mu kibuuzo ky''azzeemu, ateekwa okukiddamu n''akikola
  mu mwaka omulala. Buli kibuuzo ky''oddamu okisasulira 20,000/-. Omuyizi afiirwa
  ddi olusoma: Ssinga omuyizi agwa ebigezo ebisinga bamulagira naddamu olusoma lwonna
  so si mpapula zagudde. Yunivasite teyingiza muyizi mu makkati ga kkoosi olina kutandikirawo
  n''omalira ddala. Okusazaamu olusoma: Omuyizi ssinga ofuna ekizibu nga tojja kusobola
  kusoma omuli obulwadde, ebyenfuna, asobola okusaba nawummuzibwa n''aweebwa,omwaka
  n''asooka yeetereeze. Emyaka omuyizi gy''alina okusomera: Omuyizi bamukkiriza okumala
  kkoosi mu myaka 5. Omuyizi aweereddwa omukisa okuddamu ebibuuzo bye yagwa n''alemwa
  enfunda eziwera, yunivasite, esobola okuwa omuyizi oyo \u2018Conside Pass n''emuta
  n''afuluma. Obubbi bw''ebigezo tekukkirizibwa omuyizi agobwa oba okuweebwa ekibonerezo.
  MBARARA UNIVERSITY OF SCIENCE TECHNOLOGY, Omuyizi alina okusasula ebitundu 50 ku
  100 ku ssente za fiizi mu wiiki 6 ezisooka ng''olusoma lutandika era teri muyizi
  akkirizibwa mu kibuuzo nga tamazeeyo fiizi. Omuyizi alina okubeera mu kibiina. Ssinga
  omuyizi abula okumala omwaka nga tategeezezza yunivasite, omwaka bagusazaamu. Ebigezo
  bya tteeka ku buli muyizi: omuyizi ateekeddwa okukola ebibuuzo byonna okuva ku \u2018Course
  work'' ezikolebwa wakati mu lusoma. Bw''ogwa ekigezo olina okukiddamu naye kisasulira.
  Omuyizi akwatiddwa mu bubbi bw''ebigezo, ayinza okugobwa oba okuweebwa ekibonereza.
  Akwatiddwa mu bikolwa nga obubbi, obutemu n''ebirala yunivasite emukwasa poliisi
  n''avunaanibwa. Emikwano omuyizi gy''afuna nga yaakayingira yunivasite gikola kinene
  ku ngeri gy''atambuzaayo emisomo gye. KYAMBOGO UNIVERSITY Nga onoosoma bulungi eno
  oteekwa okussa amaanyi mu kusoma ebitabo olw''ensonga nti nayo buli kigezo ky''ogwa
  okisasulira. Omuyizi akoppa agobwa. Omuyizi ayingira mu kibuuzo nga tafunye lukusa,
  naye bw''akwatibwa. N''amalala nga bwe gali ku yunivasite y''e Makerere.\"", "\"BYA
  ROSEMARY NAKALIRI\\nAbavubuka b\u2019e Makindye si bamativu olw\u2019engeri ssente
  z\u2019abavubuka gye zigabwamu ng\u2019abasinga tebazifuna okusobola okwekulaakulanya.\\nBino
  baabyogeredde ku mukolo gw\u2019okutongoza ekisinde kya \u2018yellow power\u2019
  ogwabadde e Makindye ku Papaz Spot ng\u2019eyabadde omugenyi omukulu Aisha Nakaayi
  muwala wa Gen. Salim Saleh yakiikiriddwa Shamim Nanfuma akulira ebibiina bya bamufunampola
  mu Kampala Metropolitan.\\nNanfuma yategeezezza nti ekisinde kino kyakuyambako okukkakkanya
  okwekalakaasa mu bitundu eby\u2019enjawulo nti singa abantu baba n\u2019obutali
  bumativu eri gavumenti be bantu be balina okutuukirira ne basobola okutuusaayo obuzibu
  bwabwe ewa pulezidenti era ne bugonjoola wamu n''okumanyisa abantu NRM by\u2019esobodde
  okukola n\u2019ebikyagaanye, okusinziira ku bweyamo bwe yakola ng''ejja mu buyinza.\\nHaruna
  Nambale ssentebe w\u2019ekisinde kino yategeezezza nti ekisinga okuggya abantu mu
  mbeera ze ssente eziweebwa abakulembeze ababatwala mu bitundu byabwe okwekulaakulanya
  naye ne zitabatuukako.\\nYagambye nti ekisinde kino kyakumalawo obuzibu buno era
  nga baasuubizza abantu nti gavumenti yaakuvaayo ebayambeko mu kukulaakulanya bizinensi
  zaabwe entonotono ze beetandikiddewo basobole okwekulaakulanya.\\nBano baabadde
  beegattiddwaako abatuuze b\u2019e Makindye abeegattira mu kibiina kya Makindye Cooperative
  Union nga bano baasabye abakulembeze b\u2019ekisinde kino baleme kubakozesa nga
  ddaala lyabwe okwenoonyeza ebyabwe wabula babayambeko okubabasakira eri pulezidenti
  basobole okwekulaakulanya mu SACCO yabwe kuba bagamba abavubuka bangi baagala okwegatta
  ku kibiina kyabwe naye ebikozesebwa bitono ddala.\"", "\"Ministry yebyobulamu eyagala
  abantu abakkirizibwa okunywa omwenge batandikire ku myaka 21 egy\u2019obukulu mu
  kifo ky\u2019emyaka 18, okukendeeza omuwendo gw\u2019abavubuka aboononeka olw\u2019okunywa
  omwenge nga bakyali mu myaka egya wansi.\\nMinister owebyobulamu ebisookelwako Mragret
  Muhanga bino abitegeezezza akakiiko ka parliament akolondoola eby\u2019obusuubuzi
  n\u2019obulamu, akekeneenya etteeka erirungamya enkosesa y\u2019omwenge erya Alcoholic
  Drink Control Bill 2023.\\nMuhanga ategezezza nti eteeeka ly\u2019omwenge lisaanye
  okunyweezebwa wabeewo ebika by\u2019omwenge ebiggyibwa ku katale okutaasa bannauganda
  abafa olwokukozesa obubi omwenge ogwo.\\nMungeeri yeemu Minister Margret Muhanga
  ategezeezza nti government asaasanya ensimbi ezisoba mu buwumbi 600 okujanjaba abantu
  abakosebwa Omwenge buli mwaka.\\nDr Joseph OKwale avunanyizibwa ku kitongole ekikwasisa
  amateeka g\u2019ebyobulamu mu Ministry y\u2019ebyobulamu ategezezza akakiiko kano
  nti baliko okunoonyereza kwebakoze nebakizuula nti abantu bwebatandiika okunywa
  omwenge ku myaka emito kikosa obwango bwabwe.\\nWabula ababaka okubade omubaka wa
  Buhweju County Francis Mwijuki ne Athedra Ronald Olema omubaka wa Luo Madi benyamidde
  nti singa etteeka lino liyisibwa, kyakufiiriza abantu abafuna ensimbi mu mwenge
  naddala abayiisa omwenge mu masoso gebyaalo\\nAmyuka Ssentebe wa Kakiiko kano Omubaka
  Omukyaala owa District ye Omoro Catherine Lamwaaka alagidde abakulu mu Minsstry
  y\u2019ebyobulamu okutwalira akakiiko ebikwata kukunoonyereza kwebakoze n\u2019ebibalo
  kwebasinzidde okulinnyisa emyaka egikkirizibwa okunywa omwenge okuva ku 18 okudda
  ku 21.\\nBisakiddwa: Edith Nabagereka\"", "\"Paxful esobozesa Abafilipino okugula
  Bitcoin ku mutimbagano ku miwendo egisingayo obulungi egisoboka ate awatali bisale
  byeyongeramu. Waanyisa Peso yo eya Philippine (PHP) ofunemu BTC ng`okozesa GCash,
  Paymaya, Payoneer, n`engeri z`okusasula endala e\u014b\u014banzi.\\nToyagala kufuluma
  mu nnyumba yo? Teweeraliikirira, tuli ku mutimbagano ffenna! Funa Bitcoin yo esooka
  okuyita ku kibanja kyaffe oba okuyita ku app zaffe eza iOS ne Android. Gula ssente
  z`oku mutimbagano mangu ddala ng`omaze okukakasa akaawunti yo era otandike okusuubula
  mu PHP, USD, EUR, GBP, oba ekika kya ssente ekirala.\\nOkwawukanako n`okuwaanyisa
  ssente z`oku mutimbagano okwabulijjo, ojja kuba ogula BTC okuva ku basuubuzi abeesigika
  mu katale ka Paxful. Kino kitegeeza osobola okugula ku miwendo emirungi ddala. Osobola
  n`okugereka omuwendo gw`oyagala okugula BTC 1 (oba ekitundu kyayo). Paxful y`engeri
  esinga obwangu ey`okugula ssente z`oku mutimbagano. Kati olinda ki? Gula Bitcoin
  mu Philippine ng`okozesa Paxful leero!\\nPaxful ekifuula kyangu era ekyesigika okugula
  n`okufuna ssente z`oku mutimbagano. Zuula ekivuganyo ekisinga obulungi wammanga
  era ogule ssente z`oku mutimbagano ne Okuyisa mu Bbanka leero.\\nPaxful ekifuula
  kyangu era ekyesigika okugula n`okufuna ssente z`oku mutimbagano. Zuula ekivuganyo
