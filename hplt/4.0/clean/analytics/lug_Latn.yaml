sample: '["\"BYA SIRAJE SSEMUGENYI\\nPoliisi mu kibuga ky''e Koboko ekutte abasuubuzi
  4 abakozesezza okubalukawo kw''ekirwadde kya COVID-19 nebongeza ebisale by''ebintu.\\nAbasirikale
  ba Poliisi nga bakulembeddwamu RDC w''e Koboko Capt. Yahaya Kakooza bagaddewo amadduuka
  ne bakwata Abayindi 3 ne Munnayuganda omu abaabadde bongezza ebbeeyi y''omunnyo,
  sukaali n''ebintu ebirala.\\nBano bakwatiddwa oluvannyuma lw''abatuuze okwemulugunya.\\nBano
  kuliko nannyini; Lila-D-Keshwala enterprise, home brother\u2019s investment ne Paul
  enterprise, nga babadde batunda saketi y''omunnyo ku shs 3,000 okuva ku 700.\"",
  "\"Poliisi e Iganga ekutte omusajja myaka 25 ku misango gy\u2019okusobya ku mukadde
  ali mu gy\u2019obukulu 100.\\nOmukadde, mutuuze ku kyalo Nabiri Central mu ggoombolola
  y\u2019e Kidago era omuvubuka yamusangirizza mu nnyumba okumusobyako.\\nOkusinzira
  kw\u2019addumira Poliisi mu disitulikiti y\u2019e Iganga David Willis Ndaula, omusajja
  alina abakyala 2 kyokka oluvanyuma lw\u2019okukwattibwa ng\u2019asobeza ku mukadde,
  bamutwala mu kkooti essaawa yonna.\\nWabula abatuuze bagamba nti omusajja abadde
  asukkiridde okunywa enjaga nga n\u2019abakyala bombi baamugoba awaka olw\u2019okulemwa
  okulabirira famire.\\nAte omukadde atwaliddwa mu ddwaaliro okufuna obujanjabi nga
  kigambibwa yalumiziddwa ennyo mu bitundu by\u2019ekyama olw\u2019emyaka.\"", "\"Eseza
  7:4 Endagaano Enkadde n\u02bcEndagaano Empya (LCB)\\n4 Nze n\u2019abantu bange tutuundiddwa
  eri okuzikirizibwa, okuttibwa n\u2019okubula. Wakiri singa tutuundiddwa okuba abaddu
  n\u2019abakazi abaweereza, nandisirise ne sikuteganya newaakubadde nga omulabe teyandiyinzizza
  kuliwa kabaka bwe yandifiiriddwa.\u201d\\nEndagaano Enkadde n\u02bcEndagaano Empya
  (LCB) Bayibuli Entukuvu, Endagaano Enkadde n\u02bcEndagaano Empya Copyright \u00a9
  1984, 1986, 1993, 2014 by Biblica, Inc.\u00ae Tuweereddwa olukusa okuva mu Biblica,
  Inc.\u00ae Olukusa lwonna mu nsi yonna lusigalidde mu Biblica, Inc. Luganda Contemporary
  Bible Copyright \u00a9 1984, 1986, 1993, 2014 by Biblica, Inc.\u00ae Used by permission
  of Biblica, Inc.\u00ae All rights reserved worldwide.\"", "\"Bya HUSSEIN BUKENYA\\nLwakutaano
  mu liigi:\\nURA 1-1 Victors\\nWaters 2-1 Hoima/Busia\\nSAM Ssimbwa, abawagizi ba
  Express gwe baawemula n\u2019agisuulawo, yeefukuludde n\u2019addayo okugirwanirira.\\nSsimbwa,
  agamba nti agenda kukola ekisoboka okulaba nga ttiimu ye edda ku ntikko gy\u2019emazeeko
  omwezi gumu n\u2019ennaku ttaano.\\n\u201cSijja kuddamu kutya bivumo by\u2019abawagizi
  kuba nnina ebigendererwa eby\u2019okutuukiriza,\u201d Simbwa bwe yagambye. Yayongedeko
  nti, \u201cKati nkola misana na kiro nzize ttiimu ku mutindo gw\u2019ebaddeko etwale
  liigi.\u201d\\nKu Lwokutaano, URA yaggye Express ku ntikko oluvannyuma lw\u2019okulemagana
  (1-1)ne Victors e Namboole.\\nSsimbwa yeefukuludde n\u2019addamu okutendeka Express\"",
  "\"-\\nWelcome Bonus+18 | New Players Only\\n-\\n+18 | New Players Only\\nTable
  of Contents\\nEra nateeka n''omuwendo ogwettimiza ne Swedbank okusobola okukozesa
  ekika eggulo eri mu kasino online, era okuyimira embuga zamwe okuva mu mwaka 2001
  ogwa kasino wakati wekwata kwe kwetaga olwaleero. Swedbank mulimu essimu eya okuzikola
  omulundi gw''okukozesa ne okweyongera ekika mu kasino n''okufumbirwa akawunti nga
  onoonyereza kuba obutono kwaakazi mu ggwanga Uganda. Yenze ekika n''ennyimba zzikirize
  kasino mu Ulaya bazikolera mu bukyaamu buli mwaka.\\nOkulondawo mu kasino\\nOkukolera
  ekika ku Swedbank mu kasino okusobola okukola mu mbaga eri mu begisa, bakiyirize
  okukolera akawunti ku kasino era okukakasa kwa ggwe. Waliwo obugagga bwa kutwala
  emikono gyonna mu kasino naye muntu yenna yakozesa okukolera ekika mulimu buli nsi.\\n-
  Ekikolwa wakati\\nEkika wakati akola mulimu oluvannyuma lw''okutoganya lwo mu Swedbank
  ogw''omuli ggwe mu ggwanga wakati ogw''okulwanirira kwa mannya egatta ebikolwa obubala
  nga Catwoman n''ovo mu basumbubuli ku Starburst. Era akola ne microgaming, NetEnt,
  n''abageni ba kasino era ze zirina 99.9% ensimbi empapula.\\nOkutondawo kw''emikuguu\\nSwedbank
  okutaanoledde nga omuntu afuna okukolera ekika kulageza eyo kubanga akutteeko ffene
  okuva emikuguu okugeza ebika bya money transfer systems kubanga bwe kigenda kutuuma
  ku akawunti egatta ebiragiro ebikulu. Bino biki byegatta ebisoboka mu kasino. Mu
  kasino, okukolera ekika ne Swedbank okusobola okunywereza mu sawa ku bintu nga;
  Visa, MasterCard ''n Debit, neteller, ekika eyaliko okubonero bino naye omu ku bagenda
  okuva mu kasino.\\nOmugenzi\\nSwedbank ye mukulu obutono ku bukyayi oluvakuno wabula
  okubeera abadde alya obuwumbi 1594 buli kulyamu, naawa ey''omu masaza mu Ulaya.
  Kino kyebakyusiza okusinga mu mikolo gyaffe bwe tuli bafirika. Swedbank yalina eggulo
  erya kasino n''otono ezikolo ankola abagenyi ba kasino obutono ku bwabaala. Gasimbuka
  nti, wano Wakati OP yasinga EuropeCasino, Unity Trust Bank nasobola okukolera ekika
  mu kasino. Nga abantu bakola ekika mu kasino mu mawanga mengi (amu paka sawa ku
  Uganda), Swedbank n''akawunti ye ye akolera oluganda lw''okuzikola abantu abo. Mu
  kasino, Swedbank ng''ey''okuzikola oluganda awamu bisobola okusobola okujjaamu simanyi
  egenda burusanga nabalongodde olukolwe.\\nOkutondawo ekika ne Swedbank mu kasino
  mu Uganda.\\nKiriza ekikolwa kya Swedbank?\\nSwedbank yonna mumasomero gyaffe yewangula
  emirimu y''abantu nga bakolagana bulungi okusinza ne kuweerera. Era, Swedbank yonna
  yanaagattako okubawangula amaaso ku makolwa gaffemu.\\nNg''enaama z''amaaso za Swedbank?\\nOkuva
  mu Uganda, Swedbank gagenda okubaagattako okubawangula amaaso ku maaso ga Maestro,
  MasterCard ne Visa.\\nOkutuukaamu ky''okusinza ne Swedbank?\\nOkusinza ne Swedbank
  kyonnogerwa. Kino kyonna kyo ku webusayiti abaayo, omukolere enyawera wa Swedbank
  ne lubaawo y''omukolere kyo kyonna mumaguufu ga Swedbank.\\nNg''okusigala okukolagana
  nga Swedbank?\\nOkukolagana nga Swedbank kino kyeyamanyi ku birowoozo by''Euroapu
  naddala mu ggwanga lya Sweden. Swedbank yonna yalina okulimumu ag''abantu abaagala
  okusaamira ekibiina kye ne maaso ku webusayiti yonna baituuka. Era, abantu abaagala
  okukolagana nga Swedbank basigala okutuukaamu ebyobuwangwa byabwe ku webusayiti
  ya Swedbank.\\nOkwongera kuyogera mu bukisenge?\\nOkusinga ebyokunyiga bukisenge
  kyonnogerwa era kubanga okutuukaamu ku Swedbank kulaba baayo abantu abatya mu bibono
  ebyaffe n''ekibiina kya Swedbank. Kino kyewandiikire ebbaluwa ebifuna okubawangula
  amaaso okupya mu ssente z''amaanyi naye kino kyonna kubanga Swedbank kikolagana
  ne butainimu ku webusayiti ya buli websayiti ebikolwa ebirungi ku nsi ez''enjawulo
  zonna ne kikolagana ne ssente mu bitundu bya Swedbank biwandiiko ku webusayiti ya
  Swedbank n''omukolere enjawulo wo mukolagana nga Swedbank mulimu.\\nOkulaba kye
  bakola nga tabaabawangula amaaso ku Swedbank?\\nSiwona mpewo yonna ey''amaaso gy''obufuzi
  kukakasuka emirimu gy''abaayo. Obuwanguzi bwo kulaba siwona mpewo yonna buli ki,
  kino kyonna kyo ku mulimu gw''omukolere eyinnayira maaso ku Swedbank ne kuweerera
  n''omukolere eyo yennaayo mu bitundu byonna bayiika Swedbank ku webusayiti yonna
  bench yonna yekitwala ku biriwo ebitaliimu mu batunda ku maaso ga Swedbank era ku
  webusayiti ya Swedbank yonna.\\nNg''okunywera okusuubiza amaaso ku Swedbank?\\nKunsonga
  kw''okusinza, okuwuulira okuwangula amaaso ku Swedbank kyonnogerwa ku buli webusayiti
  ebyemwererwa nga Swedbank. Ebyogerwa ebyonna ebibuzibwako ku Swedbank ku kutuukaamu
  ebyokunwera ku mugambo gwabwe oguwandiikira ku webusayiti yonna.\"", "\"Bya Madinah
  Sebyala\\nAkulira eby''obusuubuzi ku disitulikiti y''e Mukono, Keneth Ntege akubiriza
  abantu abaagala okulinnyisa eddaala mu byenfuna beekwate BUKEDDE kubanga mulimu
  emboozi eziyigiriza obusuubuzi.\\nAgambye nti, ye BUKEDDE naddala ow''oku Lwokusatu
  afulumya emiko gya YIIYA SSENTE mulimu bingi omuntu ayagala okutandika bizinensi
  naddala ez''obwegassi by''ayigirako Kuno bagattako \u2018Ensi Kuyiiya'' eya Micheal
  Mukasa Ssebowa ne Yiga Enkwata ya Ssente nga ssinga weekwata BUKEDDE toyinza kulekebwa
  mabega mu byensimbi.\\nAkulira ebyobusuubuzi ku disitulikiti, Keneth Ntege ne Baroma
  ng''aliko byatangaaza\\nYabadde mu musomo oguyigiriza abakyala obwegassi ku kitebe
  kya Disitulikiti y''e Mukono gye yayitiddwa ekibiina kya Mukono Women Forum SACCO.\\nMu
  kusomesa yakubirizza abakyala okukendeeza ku budde bwe bamala nga tebayingiza era
  n''abakubiriza n''okukuuma ebitabo mu bizinensi ze bakola.\\nEaster Baroma, akulira
  olukiiko olufuga abakyala mu disitulikiti y''e Mukono era nga y''omu ku bataddewo
  kaweefube okulaba nti abakyala bagoba obwavu mu maka nga bayita mu kibiina kyabwe
  kino yakubirizza abakyala okutandikawo bizinensi beewole nga bwe batereka ate bafube
  okuyamba ku baami baabwe nga kye kinaamalawo n''obutabanguko mu maka.\"", "\"Eby''okukuba
  omuyimbi Pallaso e South Africa bikyuse, omu ku baabaddewo bw''ayogedde bye yalabye
  n''annyonnyola ekituufu ekyamuleetedde okufuna ebisago by''alina kati.\\nAmawulire
  ga Pallaso (Pius Mayanja) okumukubira e South Africa gaasattizza abooluganda n''abawagizi
  be era bangi n''okutuusa kati bakyebuuza ekituufu ekyabaddewo.\\nPallaso e South
  Africa yagenzeyo wiiki ewedde okuyimba ku kivvulu kya valentayini ekyabadde ku Ferndale
  Recreation Centre e Johannesburg ng''ali wamu ne bakazanyirizi Madrat ne Chiko era
  ne wiikendi eno alina ebivvulu mu bitundu bya South Africa ebirala.\\nAmawulire
  agaasoose okusaasaana mu kiro ekyakeesezza Olwokuna gaalaze nga Pallaso bwe baamuzingirizza
  mu kitundu ky''e Turffontein ekisangibwa mu kibuga Johannesburg ne bamukuba mizibu
  nti olw''okukwana omuwala ate ng''omuwala ono yabadde alina muganzi we.\\nPallaso
  eby''omuwala yabiwakanyizza ng''agamba nti yagudde mu bannansi b''e South Afrika
  abaabadde baswakidde nga bakuba n''okutemaatema buli gwe basanze okwefaananyirizako
  ebikolwa by''Ekittabaddugavu ebizze bibalukawo mu ggwanga lino (Xenophobia) era
  nti be baamukubye.\\nWabula omu ku baabaddewo atayagadde kumwatuukiriza mannya agamba
  Pallaso yagudde bwe yabadde adduka bamusaayimutabule (bayite Abacootala) abaabadde
  beesaze akajegere nga beegugunga olw''omuntu waabwe eyattiddwa. \\\"Olunaku lwakedde
  bulungi nga bulijjo era ekitundu ky''olunaku ekisinga Pallaso yakimaze wa Hajjati
  Zaituni e Winchester.\\nPallaso yagenze e South Africa ne pulaani y''okukwata vidiyo
  y''oluyimba lwe era ku ssaawa nga 8:00 ez''emisana yatandise okugikwata. Ekitundu
  ekisooka yakikwatidde waka wa Hajjati Zaituni wano we yavudde ne Denis Kiwunya eyabadde
  avuga mmotoka ne beeyongerayo awalala.\\nNga buwungeera baavuze bakomewo we baasimbudde
  kyokka baabadde banaatera okutuuka mmotoka n''esika Kiwunya kwe kugisimba ku mabbali
  g''oluguudo akole ku ky''amafuta.\\nBaabadde baakasimba ne balengera ekibinja ky''abantu
  abaabadde baswakidde nga bakutte emiggo n''ebissi ebirala nga beegugunga olw''omuntu
  waabwe eyabadde attiddwa era mu kutya okungi Pallaso yalabye banaatera okutuuka
  ku mmotoka kwe kufubutuka n''adduka nga akaweewo ng''alowooza nti Ekittabaddugavu
  ekitera okubeera mu South Africa kimusemberedde.\\nAbaabadde beegugunga bwe baalabye
  Pallaso ng''awenyuka ne bamuteebereza okubaako ky''amanyi oba okuba omuntu omukyamu
  ne bakuba mmotoka mwe yabadde, eyabadde erekeddwa ku mabbali g''ekkubo.\\nEyeerabiddeko
  ono agamba nti Pallaso mu kuwenyuka yatalantuse n''agwa kwe kufuna ebinuubule ku
  mikono n''akakongovule era we yatuukidde we yabadde alaga ng''abunye omusaayi.\\nAyongerako
  nti kubanga ebiwundu tebyabadde bya maanyi, baakoze ku nteekateeka z''okumutwala
  mu ddwaaliro okufuna obujjanjabi obusookerwako wabula waliwo munne eyamuwadde amagezi
  nti asobola okukozesa embeera okukola amawulire era kwe kukola akatambi ke yasoose
  okubunyisa n''oluvannyuma beeyongedeyo mu ddwaaliro gye beekubidde ebifaananyi nabyo
  ne basaasaanya ku mikutu mugattabantu.\\\" Eggulo Pallaso ng''ayogera ku mbeera
  kati gy''alimu ne bw''awulira yasoose kugumya bawagizi nti agenze atereera wadde
  akyawuliramu obulumi olw''ebisago bye yafunye kyokka yalaze okwennyamira olw''abantu
  abamu nti mu kifo ky''okunyolerwa awamu naye bafudde ebizibu bye emboozi.\\nMaama
  wa Pallaso alaze okutya olw''obulamu bw''abaana be. Ng''ayogera ku byatuuse ku mutabani
  we yasoose kulaga kutya olw''ebikolobero ebizze bikolebwa ku baana be ekyavaako
  ne muto waabwe AK47 okufa mu ngeri etetegeerekeka. \\\"Ekisinga obukulu bwe bulamu.\\nOba
  yabadde na muka musajja oba yabadde agenze kugula njaga tusooke tutaase obulamu
  bw''omuntu n''oluvannyuma buli muntu ayogere by''ayagala,\\\"bwe yagambye. Ate ye
  mukulu we Jose Chameleone agamba nti Pallaso gw''amanyi era gwe yakula naye tasobola
  kulwanira muwala.\\n\\\"Sisuubira nti Pallaso ali ku ddaala erirwanira omukazi.
  Ne mu Uganda tulina abawala abalungi bangi ate ndabye emirundi mingi nga ntambula
  ne Pallaso ng''abawala bennyini be bamwekwanira nze ndowooza ayinza okuba yagudde
  mu bantu abakyamu.\\\"\"", "\"Asia Nakibuuka yazaalibwa ng''enaku z''omwezi 28,
  mu mwezi ogw''ekimineebiri mu mwaka gwa 2002 nga munayuganda azannya omupiira ng''omuzibizi
  mu liigi ya FUFA ey''abakazi mu kiraabu ya Kawempe Muslim Ladies FC ne ttiimu ya
  Uganda y''eggwanga ey''omupiira.\\nNakibuuka azannyidde mu kiraabu ya Kawempe Muslim
  Ladies mu Uganda.[1]\\nNakibuuka yazannyira ttiimu y''eggwanga lya Uganda ku mutendera
  gw''abakulu mu mpaka za COSAFA Women''s Championship ezaaliwo mu mwaka gwa 2021
  ne mu z''omwaka gwa 2022 ez''okusunsula abakazi abaali bagenda okwetaba mu mpaka
  z''abakazi ez''okulukalo lwa Afrika.\"", "\"Kalisizo\\nAbantu 36 be basindikiddwa
  ku alimanda mu kkomera ly\u2019essaza mu disitulikiti y\u2019e Masaka olw\u2019okwenyigira
  mu kwekalakaasa okwali mu kitundu kya Kyotera Ttawuni kkanso Ssabbiiti ewedde.\\nOmugatte
  gw\u2019abantu 60 be baakwatibwa ku Lwokuna n\u2019Olwokusatu okuva mu bitundu by\u2019e
  Kyotera eby\u2019enjawulo.\\nBano baakwatibwa poliisi, amagye n\u2019aba LDU oluvannyuma
  lw\u2019okukwatibwa kwa munnakibiina kya National Unity Platform (NUP) e Luuka bwe
  yali anoonya akalulu akanaamutuusa ku bwapulezidenti mu kalulu ka bonna aka 2021.\\nAbakwatte
  ng\u2019okusinga bavubuka abali wansi w\u2019emyaka 25, baasimbiddwa mu kkooti y\u2019omulamuzi
  asookerwako e Kalisizo, Joy Namboozo n\u2019abasindika ku alimanda.\\nBano emisango
  bagyegaanye era n\u2019okusaba kwabwe okuyimbulwa ku kakalu ka kkooti, nakwo omulamuzi
  n\u2019akugaana olw\u2019abajulizi abaaleeteddwa obutaba na bisaanyizo.\\nOmwogezi
  wa poliisi mu ttundutundu ly\u2019e Masaka, Muhammad Nsubuga, yagambye nti bakyaliko
  abantu abalala abeetaba mu kwekalakaasa kuno be banoonya.\\nOmubaka wa Pulezidenti
  mu kitundu kino, David Matovu, yannyonnyodde nti bo ng\u2019abakulira eby\u2019okwerinda
  mu disitulikiti ezikola ekitundu kya Masaka, bali bulindaala okwambalagana n\u2019omuntu
  yenna ayagala okutabangula emirembe gya bannamasaka.\\nMatovu yagasseeko nti baliko
  abantu be banoonya nga be bagambibwa okukulemberamu okwekalakaasa kuno n\u2019ategeeza
  nti wadde embeera yazze mu nteeko, baakukozesa abakessi baabwe okulaba ng\u2019abaakuliddemu
  obwegugungo buno bavunaanibwa.\\nBya URN\"", "\"BYA ALICE NAMUTEBI\\nOMUWABUZI wa
  kkooti mu misango 29 egivunaanibwa eyali omubalirizi w''ebitabo ow''enkalakalira
  mu offisi ya katikkiro, Geofrey Kazinda, asabye omulamuzi David Wangutusi amwejjeereze
  emisango gyonna.\\nAnthony Auma yategeezezza omulamuzi Wangutusi atuula ku kkooti
  ewozesa abagambibwa okubeera abakenuzi e Kololo nti obujulizi bw''oludda oluwaabi
  bwalimu ebituli n''okubuusabuusa kungi nga kkooti tesobola kubwesigama kusingisa
  Kazinda misango era n''amusaba amwejjeereze.\\nWabula endowooza y''omuwabuzi wa
  kkooti tebeera yankomeredde nga omulamuzi asobola okuginderako oba omusango okugusala
  mu ngeri gy''aba agulabyemu.\\nObumu ku bujulizi obwalimu okubuusa Auma bwe yeesigamyeko
  kwekuba nga omuwandiisi w''enkalakalira mu ofiisi ya Katikkiro, Pius Bigirimana
  eyategeeza nti ssente zabibwa mu ofiisi ye, yalemwa okutegeeza kkooti omuwendo gwa
  ssente ogwabbibwa ate ng''oludda oluwaabi lwalemererwa okuleeta omujulizi okuva
  mu bbanka ya Uganda enkulu okunnyonnyola oba baafunako ku mpapula ezisaba ssente
  nga ziriko emikono emijingirire.\\nAuma era yategezeeza omulamuzi Wangutusi nti
  yadde oludda oluwaabi lwategeeza nga bwe lwazuula empapula ezisaba ssente mu nnyumba,
  Kazinda gye yazimbira nnyina, tebafaayo kuleeta maama wa Kazinda kunnyonnyola ani
  yateeka empapula zino mu nnyumba ye ate nga n''omukugu mu by''empandiika eyakakasa
  nti omukono gwa Bigirimana ku mpapula zebajja ewa maama wa Kazinda gwali mujingirire,
  naye teyategeeza oba nga Kazinda ye yagujingirira.\\nOmulamuzi Wangutusi ataddewo
  olwa nga 19 June lwagenda okuwa ensala ye ku misango gino.\\nKazinda avunaanibwa
  emisango 29 omuli okukozesa obubi ofiisi ye, okujingirira omukono gwa mukama we
  Pius Bigirimana nga kiteeberezebwa nti yali ayagala kujja ssente mu bbanka ssaako
  n''okusangibwa n''ebintu bya Gavumenti mu ngeri emenya amateeka.\\nOmuwabuzi wa
  kkooti asabye Kazinda yejjeerezebwe\"", "\"MICHEAL Kaddu omu ku bagagga abaafi iridde
  ku lyato abadde yaakamala ennaku nnya mu ttaka famire ye n\u2019etabuka olw\u2019ebyobugagga
  bye yalese. Kaddu abadde omusuubuzi ow\u2019omaanyi mu kibuga yafudde ne bagagga
  banne okuli Yoweri Musumba, George Kisitu n\u2019abalala baafi iridde mu nnyanja
  ku Lwomukaaga oluwedde.\\nBaabadde ku lyato MV \u2013Palm Boat eryabadde libatwala
  ku Palm Beach kyokka ne litatuuka ne libayiwa okumpi ne bbiici eyitibwa Mutima esangibwa
  mu ggombolola y\u2019e Mpatta mu disitulikiti y\u2019e Mukono. Oluvannyuma lwa Kaddu
  okuziikibwa ku Lwokubiri e Nabutitti Bukuya, famire yatandika okutabuka n\u2019okwerangira
  ku by\u2019obugagga by\u2019omugenzi.\\nSsenga wa Kaddu looya Janet Nabatta Mukiibi
  ne taata we omuto, Ceaser Nsonga ku Lwokutaano baagenze ku LC1 mu Kikuubo ne baggala
  edduuka erisangibwa mu kizimbe kya Vinco ne sitoowa esangibwa ku kizimbe kya Kabaale
  ebibadde bikubyeko emmaali ne beewera obutakkiriza muntu yenna kugaggulawo. Baabadde
  baakavaawo omusika wa maama wa Kaddu ayitibwa Eva Lubega bwe babadde bakolera mu
  dduuka ne mwannyina wa Kaddu ne batuuka.\\nBaasanze edduuka lissiddwaako kkufulu
  mukaaga ne bazikubamu ne zaaka. Baafunye ekibinja ky\u2019abavubuka ne bagula emisumeeni
  emyogi egisala ebyuuma, kkufulu zonna ne bazisala n\u2019okuzimenya nga bwe bayomba
  nti, Abendiga baagala kubba mmaali yaabwe. Eva Lubega eyabadde tasalikako musale
  yategeezezza nti kitalo nnyo okutandika okulwanira emmaali nga n\u2019omugenzi tannaba
  kukkalira magombe n\u2019alombojja obuvo n\u2019obuddo bwa Kaddu okusobola okuggusa
  ensonga ze.\\nYagambye nti: Kaddu yakulira bukojja ne maama we, Margaret Namatovu
  (naye omugenzi) era ye yamusomesa okutuuka mu siniya ey\u2019omukaaga mwe yakoma
  nga ssente ziweddewo. Olw\u2019okuba Namatovu yalina abaana abalala abato, yasalawo
  okuyimiriza Kaddu okusoma n\u2019amusembeza bakolere wamu ayige eby\u2019okusuubula.
  Maama yawa Kaddu amagezi akkirize bato be basome ku busente obwali busigaddewo ye
  akkirize atandike obulamu bw\u2019okusuubula era bwe kyali.\\nMaama bwe yafa nze
  namusikira era bwe tutyo bwe tuzze tukola ne Kaddu! Kya nnaku okulaba kati nga ssenga
  we ne taata we omuto ababadde tebamanyi yadde Kaddu gy\u2019akolera n\u2019ebimukwatako
  ate okutulumba baggale edduuka ne sitoowa n\u2019okukaayanira emmaali yaffe. Tetusobola
  kukikkiriza era tebalinnya wano!\\nMu dduuka twasanzeemu emmeeza n\u2019entebe Kaddu
  kw\u2019abadde atuula, Eva Lubega n\u2019atutegeeza nti ebyo byokka omugenzi Kaddu
  by\u2019abadde alina mu dduuka ebintu byonna ebirala byabwe. \u201cKaddu ffe tubadde
  tumutuma okugula n\u2019okutambuza emmaali kuba abadde mwangu, mujagujagu ate omwesigwa.
  Kati ndowooza abantu bwe babadde bamulaba ng\u2019abitambuza n\u2019okuba ne ssente
  ne balowooza nti zize ekitali kituufu.\\nWaliwo kw\u2019abo abantu ayinza okwogera
  Kaddu gye yaggya ssente atuuke ku ddaala erikola edduuka bweriti? Abo bagezaako
  kwagala kufuna bya bugagga bye batamanyi gye tubiggye naye tubalaba,\u201d Eva bwe
  yayongedde okuyomba. Yabadde ne muwalawe, Teddy Nakimbugwe eyategeezezza nti mwannyina
  abadde n\u2019ebintu ebibye era bye baategeezezza Abendiga ne babibalaga gye biri
  naye nga temuli dduuka wadde sitoowa. \u201cKaddu abadde ne poloti ze ssaako ennyumba
  n\u2019abaana be bana.\\nByonna twabibagambye ne tubalaga ne we biri kyokka kyewuunyisa
  ate okutulumba,\u201d Nakimbugwe bwe yagambye. Yategeezezza nti singa babadde babbi
  tebaalibalaze poloti za Kaddu.\\nKyokka Ssenga wa Kaddu bwe yabaddeayogera mu kuziika,
  yategeezezza nti ye yaweerera Kaddu n\u2019okumulabirira nti yamusomesa okuva mu
  bibiina ebya wansi okumalako siniya ey\u2019omukaaga era n\u2019ayingira ne yunivasite
  kyokka yasomayo omwaka gumu n\u2019ayingira obusuubuzi era abadde akyogera lunye
  nti agenda kuddayo amalirize diguli mu mbeera z\u2019abantu. Yagambye nti buli bw\u2019abadde
  amusisinkana ng\u2019amukakasa nti agenda kuddayo okusoma.\\nYagambye nti Kaddu
  abadde mukozi atava ku nnyonyi ne mu bbaasi era abadde asuubula ebibye n\u2019okugulira
  abalala ababadde bamutuma. Yagambye nti abadde asuubula e Kenya, Dubai ne China
  ebintu eby\u2019enjawulo.\\nKaddu abadde alina ebintu by\u2019akoze ebiraga nti
  ddalamusuubuzi alina ssente okuli amaka ag\u2019ebbeeyi agasangibwa e Nansana. Abadde
  yaakamala okukola embaga ey\u2019ebbeeyi ekunukkiriza obukadde 300. Bwe yali ayanjula
  mukyala we, yamuwa emmotoka empya ekika kya Harrier. Abadde avuga emmotoka ey\u2019ebbeeyi
  ey\u2019ekika kya Vox Wogen ekunukkiriza obukadde 80.\\nKu kwanjula kwe kwaliko
  abayimbi abanene okuli Robert Kyagulanyi (Bobi Wine) n\u2019abalala era abadde n\u2019emikwano
  egimumanyi nti abadde alina ssente. \u201cOmuntu okuvaayo n\u2019ogamba nti Kaddu
  abadde alina ntebe oba mmeeza kiba tekitegeerekeka era ffe ensonga tuzikwasizza
  bannamateeka baffe bazimalirize\u201d Nabatta bwe yagambye.\\nSsentebe wa LC 1 mu
  Kikuubo, Bashir Muwonge yategeezezza nti ssenga wa Kaddu Janet Nabatta ne mwannyina
  Ceaser Nsonga baamutuukiridde ne beemulugunya era ye ng\u2019omukulembeze, yabalagidde
  nti bakkirize basse kkufulu ku dduuka ne sitoowa basooke bakkiriziganye.\\nYagambye
  nti tebagenda kukkiriza muntu yenna kuggulawo sitoowa wadde edduuka okutuuka nga
  bakkiriziganyizza ng\u2019aba famire ya Kaddu ku buli ludda. Ate omwogezi w\u2019olukiiko
  lw\u2019abasuubuzi mu Kikuubo, Samuel Muyomba yagambye nti aba famire batuule ensonga
  bazimalirize kubanga bye balimu biswaza famire.\\nYagambye nti abantu basatu batuukiridde
  ofi isi y\u2019abasuubuzi nga basaba babayambe ku ssente zaabwe kubanga Kaddu afudde
  baakamuwa emmaali yaabwe nga tannaba kubasasula era bamubanja kyokka bawulira ate
  aba famire bayomba.\\nKaddu afudde wa myaka 32 gyokka era abadde mutabani wa Isaac
  Sserunkuuma omukozi mu kitongole ekiramuzi. Yaziikiddwa ku biggya bya bajjajjaabe,
  Samuel Balagadde e Kataza e Nabutiti Bukuya Singo ku Lwokubiri.\\nAbasuubuzi ababadde
  bamanyi Kaddu n\u2019okukolagana ennyo naye, abamu baazirise olw\u2019entiisa gye
  yabaleseemu okufa amangu. Abamu baatidde nti tebamanyi ngeri gye bagenda kufunamu
  mmaali yaabwe kubanga y\u2019abadde abayamba.\\nOkutabuka kwa famire kwatandikira
  ku ggwanika e Mulago abooluganda lwa Nnamwandu bwe baayagala okwefuga omulambo okuba
  nga be bamukolako kyokka abooluganda lwa Kaddu ne babakkakkanya.\\nOlutalo ku mmaali
  lugenze okubeerawo ng\u2019abamu beemulugunya dda nti waliwo abaagala ebybugagga.
  Mmotoka ya Kaddu eyali erekeddwa ku bbiici ya KK e Ggaba nayo yaggyiddwaayo mukyala
  we kyokka abamu era baakirabye bubi\"", "\"NGA tusemberedde okutuuka mu nnaku za
  Ssekukkulu alina bizinensi naddala entono okyayinza okukyusa mu bukodyo bw''obadde
  weeyambisa okutunda ebintu byo n''osobola okwenogera kaasi awera omwaka nga tegunnaggwaako.
  John Ssengonzi omukugu mu byenfuna okuva ku Naalya Secondary School agamba nti,
  mu sizoni eno buli muntu alina bizinensi aba yeesunga kukola ssente kumpi akubiseemu
  mwezo z''abadde akola.\\nNaye bangi balemererwa okuzikola olw''enzirukanya y''emirimu
  gyabwe etetambula na kiseera kiriwo ate ng''abaguzi baba baagala okufuna ebintu
  ebirungi, nga n''abitunda yeeyisiza ddala mu mbeera eraga nti tuli mu kiseera kya
  njawulo. Buli lw''oba mu bizinensi olina okukyuka n''embeera eriwo, ate n''omanya
  n''abantu bye baagala okukozesa mu kiseera kye baba balimu olwo naawe kw''osinziira
  okusuubula ebintu, ekyo bwe kikulema Ssekukkulu eba egenda kuggwaako ng''ogyevuma
  nti nga tolina ssente ze wakolamu.\\nOBUKODYO BW''OLINA OKWEYAMBISA OKUTUNDA EBINTU
  MU SIZONI YA SSEKUKKULU\\nSsengonzi agamba nti abaagala okukola ssente okusukkuluma
  ku balala mu kiseera kino ekya Ssekukkulu ssinga mukola bino, omwaka gujja kugenda
  okuggwaako nga muliisa buti.\\n1Timba edduuka lyo oba awantu wonna w''okolera walabike
  bulungi nga kasitoma bw''atuukawo ne bw''aba si waakukyama asikirizibwa okujja n''akugulako
  ekintu.\\nKino oyinza okukikola nga weeyambisa bbaluuni n''ozeetoolooza bizinensi
  yonna oba okufuna akati ka Kulisimasi n''okatimbako ebimuli ebyakaayakana. Kino
  bw''okikola mu kiseera kino kye tuyingidde ennyingizaayo gy''obadde ofuna ojja kulaba
  nga yeeyongeddeko. 2 Sala ku muwendo gwa ssente z''otunda ebintu byo.\\nKino osobola
  okukikola bwoti, nti Ssinga kasitoma agula ebintu nga biwerako omusalirako ku ssente
  z''alina okukuwa. Wabula olina okulaba ng''amagoba osigala ogafuna bulungi. Kino
  kigenda kwongera okukuleetera bakasitoma abalala kubanga gw''osaliddeko y''agenda
  okukuleetera abantu abalala bakuwe ssente.\\n3 Suubula ebintu ebitambula era ebiri
  ku mutindo ate nga bituukana ne sizoni ya Ssekukkulu. Bwe kiba kiteeteeyi kya mwana
  muwala kirina okuba nga ddala kirabika bulungi nga bw''akyambala buli omu asigala
  amunyeenyeza mutwe. Kino kijja kusikiriza abantu okukugulako ebintu nga ne bw''omuseera
  asigala akuwa ssente kuba aba akyagala.\\n4 Yambako bakasitoma bo okulonda n''okugula
  bye baagala. Ssinga olaba nga kasitoma alonda ekintu ekitagenda kumunyumira mugambe
  akyuseemu kubanga bw''anaakitwala n''akyambala n''atalabika bulungi aba tagenda
  kudda ate tasobola kukuleetera bakasitoma balala. Naye bw''alaba nga ky''omulondedde
  kirabise bulungi emikisa gy''okufuna bakasitoma abalala abakuleetere giba mingi
  ddala. Ate abaguzi bwe beeyongera ne ssente ng''ofuna.\\n5 Yambala bulungi osikirize
  bakasitoma okugula by''otunda. Bw''oba mutunzi wa mmere weewale okujja mu bakasitoma
  ng''olabika bubi ate ne bw''oba mutunzi wa ngoye, yambalako bulungi kasitoma agende
  okukutunulako nga ddala osaanidde okumuguza olugoye.\\n6 Weekenneenye abakozi b''okozesa
  mu kiseera kino. Bw''oba obadde ne b''otambula nabo okuva emabega tokemebwa kuwandiika
  balala, kubanga abakozi abasinga bagenda okujja nga baagala kufunamu ze bagenda
  okulya mu nnaku enkulu era bw''oteegendereza, kyangu okukubba bizinensi n''esigala
  nga nkalu Ssekukkulu n''ogiyitamu ng''onyiga biwundu.\\n7 Bizinensi togireka mu
  mikono gya muntu mulala yenna. Ssinga okemebwa mu kiseera kino eky''ennaku enkulu
  bizinensi n''ogivaamu n''ogikwasa omuntu omulala tojja kufunamu kitegeera, ogenda
  kusigala ku muwendo gwa ssente gwe gumu gw''obadde ofuna b''okozesa bakusinge okufuna
  ssente. Naye ssinga onoosigala nga weddukanyiza buli kimu ogenda kufunamu nnyo kuba
  buli kimu ojja kuba okibalirira.\\n8 Beera mu mbeera ya Ssekukkulu n''olulimi lw''okozesa
  lube nga lwogera Ssekukkulu. Olw''okuba omuwendo gw''abantu ogusinga ebiseera bya
  Ssekukkulu bwe bituuka baba tebaagala kuwulira kirala kyonna, kasitoma bw''ajja
  okukugulako ekintu n''asanga ng''embeera z''olimu tezikwatagana na zize kyangu nnyo
  okunoonya awalala w''anaafunira emirembe ezo ssente ne zikusuba.\\n9 Sasula bulungi
  abakozi b''okozesa baleme kufuna mutima gubba bizinensi yo okugikaliza. Mu kiseera
  kino omukozi naye aba ayagala nnyo ssente asobole okusanyusa abantu be balinako
  obuyinza nga ssinga omusasula bulungi ajja kukola n''omutima gumu ng''ali mu bizinensi
  eyiye. Naye ssinga tosasula bakozi, ojja kubasikiriza okukubba sizoni ekusale.\\n10
  Fuba okulaba nga buli lw''onnyuka oleka obaze ebitabo byo naddala mu kiseera kino
  kye tuyingiramu ojja kuyambibwa okumanya oba amagoba geeyongera kulinnya oba nedda
  era bwe kiba nti tegalinnya osobole okusala amagezi engeri gy''olina okufunamu ssente
  mu kiseera kino. Mu ngeri y''emu ojja kwanguyirwa okumanya ssinga wabaawo ebintu
  ebibula nga tomanyi.\\n11 Teekawo omutemwa gwa ssente gw''olina okutuukiriza buli
  lunaku. Okugeza, oyinza okugamba nti olunaku nteekwa okufuna 100,000/-. Kino kijja
  kukuyamba okuyiiya engeri zonna z''osobola okusikirizaamu bakasitoma okujja bagule
  by''otunda okulaba ng''ekigendererwa kyo kituukirira.\\n12 Mu kiseera kino bw''oba
  n''ebyuma ebikuba myuziki teekako ennyimba eziraga nti ddala tuli mu kiseera kya
  Ssekukkulu kijja kukuyamba okusikiriza abantu okujja okukugulako ebintu kubanga
  ennyimba ezo ziteeka abantu mu mbeera eragira ddala nti bali mu nnaku nkulu era
  omuntu bw''alusanga nga balutaddeko tayagala kusimbula kuva weruli.\\nGift Nakimuli
  omusuubuzi w''engoye e Kabuusu ku katale agamba nti; \\\"Newankubadde edduuka lyange
  teriri mu kibuga wakati naye bakasitoma bange batandise okumbuuza ekiraga Ssekukkulu
  we nkolera.\\nBwe nafunye abantu nga bataano nga bonna bambuuza ekintu kye kimu
  ne nsalawo ngule ebimuli mbitimbe mu dduuka kyongere okulaga abantu bange nti ddala
  Ssekukkulu yatuuse dda.\\nOkumanya kikola, ntandise okulaba abajja ne bangulago
  engoye naye nga bamaze kutunuulira dduuka lyange bwe lifaanana era waliwo omwami
  eyanguzeeko essaati n''ahhamba nti ekimukyamizza kwe kulaba edduuka nga lirabika
  bulungi. Olw''okuba ntandise okukiraba nti omuwendo gwa bakasitoma gutandise okweyongera
  hhenda kwongerera ddala okukola ebintu ebisikiriza bakasitoma bajje banguleko kubanga
  kyeraze lwatu nti mu kiseera kino ataafe ku bizinensi ye ayinza obutakola bulungi
  ssente mu Ssekukkulu.\\\"\\nNNYONGEDDEMU EBINTU BYE MBADDE SIRINA\\nNisha Kaweesi
  omusuubuzi w''ebintu by''abakyala e Kasubi yagambye nti, akeetalo k''abantu okugula
  ebyetaago katandise, era kati naye atandise okutunda ssente eziwerako okusinga gye
  buvuddeko emabega. \\\"Bwe ndabye guli gutyo ate nga ne bye bambuuza bingi bye sirina
  ne nsalawo nfune ssente nnyongeremu bye mbadde sirina kasitoma nga bw''ajja okugula
  olugoye nsobola okumugulizaako engatto, ensawo, essaawa awamu n''obukomo ate nga
  ne bw''aba ayagala galubindi asobola okuvaawo ng''azirina.\\nKino nkikoze kinnyambe
  okutaayiza kasitooma bw''ajja ne ssente ate nneme kuwa balala mukisa kuzintwalako
  byonna by''ayagala abe ng''asobola okubiggya mu dduuka lyange era nsuubira nti we
  naamalirako ennaku zino enkulu nga waakiri nninawo ssente ze nkoze ezitegeerekeka\\nGift
  Nakimuli omusuubuzi w\u2019engoye e Kabuusu ku katale agamba nti; \u201cNewankubadde
  edduuka lyange teriri mu kibuga wakati naye bakasitoma bange batandise okumbuuza
  ekiraga Ssekukkulu we nkolera. Bwe nafunye abantu nga bataano nga bonna bambuuza
  ekintu kye kimu ne nsalawo ngule ebimuli mbitimbe mu dduuka kyongere okulaga abantu
  bange nti ddala Ssekukkulu yatuuse dda. Okumanya kikola, ntandise okulaba abajja
  ne bangulago engoye naye nga bamaze kutunuulira dduuka lyange bwe lifaanana era
  waliwo omwami eyanguzeeko essaati n\u2019ahhamba nti ekimukyamizza kwe kulaba edduuka
  nga lirabika bulungi. Olw\u2019okuba ntandise okukiraba nti omuwendo gwa bakasitoma
  gutandise okweyongera hhenda kwongerera ddala okukola ebintu ebisikiriza bakasitoma
  bajje banguleko kubanga kyeraze lwatu nti mu kiseera kino ataafe ku bizinensi ye
  ayinza obutakola bulungi ssente mu Ssekukkulu.\u201d NNYONGEDDEMU EBINTU BYE MBADDE
  SIRINA Nisha Kaweesi omusuubuzi w\u2019ebintu by\u2019abakyala e Kasubi yagambye
  nti, akeetalo k\u2019abantu okugula ebyetaago katandise, era kati naye atandise
  okutunda ssente eziwerako okusinga gye buvuddeko emabega. \u201cBwe ndabye guli
  gutyo ate nga ne bye bambuuza bingi bye sirina ne nsalawo nfune ssente nnyongeremu
  bye mbadde sirina kasitoma nga bw\u2019ajja okugula olugoye nsobola okumugulizaako
  engatto, ensawo, essaawa awamu n\u2019obukomo ate nga ne bw\u2019aba ayagala galubindi
  asobola okuvaawo ng\u2019azirina. Kino nkikoze kinnyambe okutaayiza kasitooma bw\u2019ajja
  ne ssente ate nneme kuwa balala mukisa kuzintwalako byonna by\u2019ayagala abe ng\u2019asobola
  okubiggya mu dduuka lyange era nsuubira nti we naamalirako ennaku zino enkulu nga
  waakiri nninawo ssente ze nkoze ezitegeerekeka\"", "\"Claus Archilles Lumu 23 omutuuze
  w''e Ntinda akoze ssigiri ekolera ku maanyi g''enjuba ekiyamba okukekkereza ku manda.
  Agamba nti ekirowoozo ky''okukola ssigiri eno gy''ayita \u2018Solar Stove'' yakiggya
  ku ttendekero e Ndejje ng''omusomesa abasabye okubaako kye bayiiya bwe baali bagezesa
  okukola( Internaship).\\n\\\"Bwe twamala okusoma nanoonya bannange bwe twasoma bana
  ne tulowooza ku kiyinza okutufunira ssente kwe kuyiiya ssigiri eno nga tumaze okukakasa
  nti tekoma mu kutufunira bufunizi ssente wabula n''omuntu abeera agikozesa emuyamba
  okukekkereza ssente.\\nEssigiri eno okumanya yanjawulo esobola okukozesa amasannyalaze
  aga bulijjo ssaako ag''enjuba kubanga mu kugizimba eteekebwamu ekiwujjo ng''ekozesa
  mayinja ag''omu nsozi, ezimbibwamu ekifo mw''osobola okutereka bbaatule ezigiyamba
  okukuma omuliro ogubeera guvudde mu masannyalaze aga bulijjo n''ago ag''enjuba.\\nTUTANDIKA
  OKWEKOZESA: Twasoma byamasannyalaze, era kubanga kye twayiiya kyali kituukira ddala
  ku byatusomesebwa tetwafuna nnyo kusoomoozebwa. Naye nga entandikwa bw''eteba nnyangu,
  ekyasinga okutuzibuwaliza omulimu zaali ssente, kubanga ebikozesebwa okutuuka ku
  mutendera gw''essigiri gye njogerako bya bbeeyi, ng''omuntu kimwetaagisa okubeera
  ne ssente waakiri ezitandikirwako 500,000/-.\\nTwagezaako okutakula emitwe okunoonya
  mu bantu baffe ne tusobola okufuna ssente 500,00/- ng''era zino ze twakozesa nga
  Entandikwa okutandika omulimu guno. Twazikozesa okugula ebikozesebwa mu ssigiri
  era mu katale omukisa gwatukwata netusaanga ne bbeeyi ya matiriyo eyetagisibwa si
  wa bbeeyi nnyo.\\nOmulimu guno okugwongerako omutindo twafuna bakasitooma abaatuwa
  odda okubakolera ebyotto mu ngeri y''emu ng''esigiri nga birina ebikozesebwa bye
  bimu. Abantu bangi essigiri zaffe bazettanidde nnyo wadde nga mu kusooka baali tebazitegeera,
  era omwezi ogwasooka essigiri emu twagitundanga wakati wa 200,000/- ne 300,000/-
  kyokka olw''ebbeeyi ye bikozesebwa okulinya kati tugitunda 500,000/-.\\nEBYETAAGISA
  OKUKOLA ESSIGIRI N''EKYOTO EBY''AMAANYI G''ENJUBA l. Amasannyalaze: Tugakozesa mu
  kwokya ebyuma ebiteekebwa ku ssigiri ne mu kyoto, era tugakozesa nga tugassa mu
  bbaatule ezeeyambisibwa mu kwaka. Amasannyalaze g''amaanyi g''enjuba nago gakola
  ku mutendera guno nga byombi bye bikozesebwa mu kukuma essigiri oba ekyoto. 2. Amabaati:
  Gano gassibwa ku mubiri gw''essigiri nga tugizimba nga gano ge gayamba essigiri
  okugirabisa obulungi n''okugigumya. 3. Enjazi z''omu nsozi: kizibu okugula essigiri
  eno n''otafunirako mayinja gano. Gano gakola ng''amanda olw''ensonga nti gakwata
  mangu omuliro kw''ossa n''okukekkereza obungi bw''amanda g''okozesa. 4. Amanda n''olusennyente:
  Bino byeyambisibwa mu kutandika okukuma omuliro newankubadde ng''oluusi amanda geetaagisa,
  naye ku ssigiri eno weetaaga matono. 5. Omusenyu ne bbulooka: Bino byeyambisibwa
  mu kuzimba essigiri nga bbulooka zikozesebwa okwawula ebisenge by''essigiri n''okugikuuma
  ng''eri wamu. 6. Bbaatuule: Omuntu ayinza okwebuuza omugaso gwa bbaatuule mu ssigiri
  zino naye eyamba okutereka omuliro oguva ku maanyi g''enjuba nga guno gwe gusobozesa
  ekiwujjo okutambula okuyamba essigiri okukola obulungi.\\n7. Amaanyi g''enjuba:
  Gano ge gavaamu amasannyalaze agasobozesa essigiri eno okukwata omuliro mu bwangu.
  Kizibu essigiri eno okwaka nga teteereddwamu masannyalaze olw''ensonga nti ge gayamba
  ekiwujjo ekiri mu ssigiri okutambula olwo essigiri n''eryoka ekwata mangu omuliro.\\nEKIBALO
  Amasigiri gano tugakola nga waliwo abamaze okugasaba kyokka buli luvannyuma lwa
  wiiki tubeerako n''ekyoto kye tuzimba era abantu ssekinnoomu be batutuukirira. Essigiri
  emu ng''ewedde tugitunda 500,000/- ng''eno ezitowa kkiro 20 olw''amayinja n''ebintu
  ebirala ebigiteekebwamu. Okuzimba ekyoto nga bino eby''amasomero tukozesa ebintu
  ebiwerako omuli, amayinja g''enjazi, omusenyu n''ebirala nga kiggweera mu 800,000/-,
  nga kigula wakati wa 1,500,000/- ne 2,000,000/- okusinziira ku bunene.\\nOKUSOOMOOZEBWA:
  Essigiri zino zikyali za bbeeyi ekireetedde abantu obutazettanira nga kino kizihhamizza
  omulimu gwaffe kubanga bakasitoma bakyali batono ddala. Enjazi oba amayinja g''omu
  nsozi, gano tugaggya Kasese nga bakasitoma babeera bageetaaga kyokka nga tetusobola
  kukozesa bwangu bwe baagala. Amasannyalaze agakozesebwa mu kwokya ebyuma ebiteekebwa
  mu ssigiri ga buseere.\\nEBIRUUBIRIRWA: Mu ntandikwa twali abakozi bana wabula nga
  mu kiseera kino tuweze 10. Mu myaka etaano tulina ekiruubirirwa eky''okugaziya empeereza
  yaffe etuuke mu bifo ebyetoolodde Kampala. Tulina ekirooto ky''okutandikawo ettendekero
  ly''okubangula abavubuka mu mulimu guno.\\nBYE TUFUNYE: Ekirooto kyaffe kyali kyakufuna
  mulimu tusobole okwekozesa era kyatuukirira. Twafunye ekifo ekyaffe mwe tukolera
  emirimu gino ne tuwona obupangisa. Wadde tetunnatandika ttendekero kyokka waliwo
  abavubuka be tuyigirizza omulimu guno.\\nAKATALE: Akatale kaffe akasinga kakyali
  mu masomero nga gettanidde ebyoto bye tuzimba kubanga bikekkereza. Kyokka essigiri
  zi sinze kwettanirwa ba wooteeri n''abatunda ebyokulya.\\nEBITUYAMBYE OKUFUNAMU:
  Newankubadde bizinensi y''essigiri n''ebyoto abantu abasinga tebannagitegeera tufuba
  okugikolera akatale nga twogera ebirungi ebigirimu. Kino kiyambye bangi okumanya
  nti bakendeeza ssente nga bakozesezza ssigiri z''amaanyi g''enjuba ssente ze babadde
  bagenda okukozesa mu manda ne bazifissa.\"", "\"Amawulire\\nGavumenti egamba nti
  egenda kugula enyonyi 6\\nBya Ritah Kemigisa\\nMu kawefube wokuzukusa ekitongole
  kya gavumenti ekye Uganda Airlines, gavumenti egamabanti egenda kugula enyonyi 6
  ngomwaka guno tegunagwako.\\nBwabadde ayogera ne banamwulire ku bikoleddwa gavumenti
  mu ministry yebyentambula mu kisanja kya NRM opkusinziira kwebyo byebasubiza, minister
  webyentambula Monica Azuba Ntege ategezeza nti 4 ezisooka zakugutandika okukola
  mu November womwaka guno.\\nEnyonyi zino 4 agambye zakubeera kika kya Bombardier
  CRJ900 nga zakoleddwa mu gwanga lya Canada nga zakutuuza abanasabaze 80 ku 100 nga
  zirubiridde okukolera mu East Africa, okugonza ku byentambula.\\nAte endala, Airbus
  2 kika kya A330 akutuuza abantu 300 nga zzo zaguliddwa kuva mu gwanga lya Bufalansa,
  nga zakutuka mu 2020.\\nAzuba Ntege agambye nti watereddwawo akakiiko okussa mu
  nkola nokulondoola entekateeka za gavumenti zino.\"", "\"OMUYIMBI Samalie Matovu
  yabiraba bwe yayimba nti omukwano gunyuma bwe guba gutandika, wabula bwe gugenda
  gukula gubowa.\\nKino kyeyolekera mu maka g\u2019abafumbo naddala abamaze emyaka
  10 n\u2019okudda waggulu.\\nBangi abakulanye laavu egenda ekendeera, munno eyali
  akuyita \u2018Swiiti\u2019 nga bw\u2019alikuyita oyinza okwekanga, n\u2019olowooza
  nti osanga alina omulala gw\u2019abadde ayita.\\nMu mbeera eno, abaamalanga ebbanga
  nga beenoonya mu ngeri y\u2019okukola \u2018lomansi\u2019, biba tebikyabamalira
  biseera, abamu ne batuuka ne ku ssa ly\u2019okweteekawo ng\u2019omugogo munne n\u2019agattako
  n\u2019okumukuutira \u2018okumubikka ng\u2019amaze by\u2019akola\u2019\\nEBITTA
  \u2018LOMANSI\u2019\\nAbakugu mu bya laavu bagamba nti ensonga ya \u2018lomansi\u2019
  tetandikira mu buliri oba mu kisenge.\\nBagamba nti omuntu ali \u2018lomantiki\u2019
  atandikira ku kutonera munne bulabo, okumuweereza mesegi z\u2019omukwano n\u2019okumulaga
  nti amufaako.\\nBagattako nti kizibu abaagalana abaayawukanye ku makya ne bamala
  olunaku nga tewali awulizza ku munne okubasuubira okukola \u2018lomansi\u2019 nga
  batuuse mu kisenge.\\nMw. Vincent Kasule abuulirira abafumbo ng\u2019abeera Najjanankumbi
  agamba nti abakyala bwe balwa mu bufumbo batandika okufuna emize gy\u2019obuteeguya.
  \u201cAte bw\u2019azaala omukwano gwa bba gwonna aguzza ku bbebi.\\nBino bikyusa
  obwongo bw\u2019omusajja naye n\u2019akendeeza mpola omukwano gwe n\u2019ekivaamu
  nga n\u2019ebya \u2018lomansi\u2019abivaako\u201d.\\nEnsonga y\u2019okulaga omusajja
  ti okooye nnyo nga naye atandika okukyusa engeri gy\u2019akolamu emirimu.\\nEyali
  awaayo obudde n\u2019akunoonya nga takyatawaana kuba naawe omujuliza nga bw\u2019okooye
  ennyo.\\nAte n\u2019abasajja oluusi bakoowa nnyo ku mirimu.\\nAgenda okutuuka mu
  buliri ng\u2019ayagala kutuukira ku ky\u2019alowooza so ssi kusooka \u2018kwemoola\u2019.\\nAbakazi
  obutaba na bukodyo bupya bunyumisa mukwano nakyo kimalamu bannaabwe amaanyi n\u2019ebya
  \u2018lomansi\u2019 ne babivaako. Abakazi obutatega bumasu nayo nsonga nkulu ddala.\\nObucaafu
  nsonga nkulu ereetedde abasajja okwesamba okunoonya bannaabwe. Omusajja eyabanga
  akomba ebbakuli n\u2019akuba n\u2019ennoga kizibu okukikola nga munne si muyonjo.\\nAbakazi
  okutandika okwenda nakyo kimazeemu nnyo abasajja amaanyi agakuba emmese aba alowooza
  nti ne bw\u2019anaamufiirako era ajja kubaliga.\\nAbasajja okupapa ennyo nakyo kisse
  ekinyusi ky\u2019okwenoomnya kuba abamu bw\u2019acamuka, ebirowoozo byonna abimalira
  munda mu nnabunnya era abamu eby\u2019okunoonya munne aba tabiraba nga bikulu.\\n\u2018LOMANSI\u2019
  YANDIBADDE ATYA?\\nEddy Walugembe ow\u2019e Mpereerwe agamba nti \u2018lomansi\u2019
  mu kisenge yandimaze wakati w\u2019eddakiika 30 ne 45 , olwo buli omu n\u2019atuuka
  ku ssa ly\u2019okulinda munne batandike okulya.\\nAbaagalana abatuuse mu kiseera
  kino kizibu omukazi obutatuuka ku ntikko ya mukwano.\\n\u201c Wadde tewali mateeka
  omuntu g\u2019alina okugoberera mu kukola \u2018lomansi\u2019 naye kirungi buli
  omu atuuke mu buli kitundu kya munne ng\u2019amunywegera ng\u2019akozesa emimwa,
  n\u2019olulimi n\u2019engalo nga kw\u2019agasse okumusonseka obugambo obuwoomu\u201d,
  bw\u2019agamba.\\nOMUGASO GWA LOMANSI\u2019\\nAyamba abaagalana okwongera okwetegeera.
  Ebbanga lye mumala nga buli omu anoonya munne kimuyamba okutegeera ebitundu ebimusumulula
  era awo w\u2019asinga okussa essira.\\nKu ludda lw\u2019abasajja ayamba okwongera
  ku maanyi, kuba buli lw\u2019alwawo okuyingira e buziba n\u2019amaanyi gagenda geeyongera
  era eyandimaze eddakiika ebbiri yeesanga waakiri awezezza ekkumi.\\nKu bakazi singa
  omusajja ensonga eno agikwata bulungi kizibu okubulwa ag\u2019emugga agamala ate
  ku bamu naddala abamalira kungulu tekyetaagisa musajja kulafuubana ng\u2019atuuka
  e buziba okusanyusa munne.\\nWalugembe agattako nti ng\u2019oggyeeko endowooza y\u2019abaddugavu
  abakitwala nti okuyingira ebuziba kye kisinga obukulu, \u2018lomansi\u2019 nsonga
  nkulu ddala kubanga omusajja atwalibwa nti amanyi omukwano abakazi abasinga bamupimira
  ku ngeri gy\u2019anywegeramu, n\u2019okunoonya munne, so ssi ku luutu z\u2019atwala
  nga bali mu kisaawe oba sayizi y\u2019obusajja bwe.\\nEkikulu kiri nti buli lwe
  munyweza ensonga y\u2019okwenoonya, kizibu emboozi z\u2019omu kitanda obutagenda
  bulungi, kubanga kye kisumuluzo ky\u2019essanyu ly\u2019abaagalana.\\n\u2018Lomansi\u2019
  ayamba omukazi okutuuka ku ntikko y\u2019omukwano\"", "\"[et_pb_section fb_built=\u201d1\u2033
