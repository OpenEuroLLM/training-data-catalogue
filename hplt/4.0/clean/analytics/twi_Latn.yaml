  ne ad\u0254ep\u025b ne ahobr\u025base a wode ne wo Nyankop\u0254n nantew.\u201d
  (Mika 6:8) Hy\u025b no nsow s\u025b nne\u025bma a Yehowa hwehw\u025b fi y\u025bn
  h\u0254 no mu biako ne s\u025b \u2018y\u025bb\u025bda at\u025bntrenee adi.\u2019
  Y\u025bb\u025by\u025b d\u025bn atumi ay\u025b saa?\\n\u201cNokware Trenee\u201d
  Akyi a Yebedi\\n4. Y\u025by\u025b d\u025bn hu s\u025b Yehowa hw\u025b kwan s\u025b
  y\u025bde ne trenee gyinap\u025bn ahorow b\u025bb\u0254 y\u025bn bra?\\n4 Yehowa
  p\u025b s\u025b y\u025bde ne gyinap\u025bn ahorow a \u025bfa papa ne b\u0254ne ho
  b\u0254 y\u025bn bra. Esiane s\u025b ne gyinap\u025bn ahorow y\u025b nea \u025bte\u025b
  nti, s\u025b y\u025bde b\u0254 y\u025bn bra a na y\u025bredi at\u025bntrenee ne
  trenee akyi. Yesaia 1:\\n5, 6. (a) D\u025bn nti na \u025bny\u025b den s\u025b yebedi
  Yehowa gyinap\u025bn ahorow so? (b) \u0186kwan b\u025bn so na Bible da no adi s\u025b
  trenee akyi a yebedi no y\u025b adey\u025b a \u025bk\u0254 so ara?\\n5 So \u025by\u025b
  den s\u025b yebedi Yehowa trenee gyinap\u025bn ahorow akyi? Dabi. Yehowa ahwehw\u025bde
  so di ny\u025b den mma koma a \u025bb\u025bn no. Esiane s\u025b y\u025bd\u0254 y\u025bn
  Nyankop\u0254n ne s\u025bnea \u0254te biara nti, y\u025bp\u025b s\u025b y\u025bb\u0254
  y\u025bn bra w\u0254 \u0254kwan a \u025bs\u0254 n\u2019ani so. (1 Yohane 5:3) Kae
  s\u025b Yehowa \u2018p\u025b as\u025bntrenee.\u2019 (Dwom 11:7) S\u025b yebetumi
  asuasua Onyankop\u0254n at\u025bntrenee, anaa trenee a, \u025bs\u025b s\u025b y\u025bn
  ani gye nea Yehowa ani gye ho ho na yekyi nea okyi.\\n6 \u0190ny\u025b mmer\u025bw
  s\u025b nnipa a y\u025bny\u025b p\u025b bedi trenee akyi. \u0190s\u025b s\u025b
  yeyi nipasu dedaw ne ne nney\u025be b\u0254ne no gu, na y\u025bhy\u025b nipasu foforo.
  Bible ka s\u025b w\u0254nam nokware nimde\u025b so na \u2018\u025by\u025b\u2019
  nipasu foforo no \u201cfoforo.\u201d (Kolosefo 3:\\n7. \u0186kwan b\u025bn so na
  \u025bs\u025b s\u025b yebu huamm\u0254 a yedi w\u0254 mm\u0254den a y\u025bb\u0254
  s\u025b yebedi trenee akyi no mu?\\n7 \u0186kwan b\u025bn so na \u025bs\u025b s\u025b
  yebu huamm\u0254di a yehyia w\u0254 mm\u0254den a y\u025bb\u0254 s\u025b yebedi
  trenee akyi no mu? Nokwarem no, \u025bns\u025b s\u025b yebu aniberes\u025bm a b\u0254ne
  y\u025b no adewa. Bere koro no ara no, \u025bns\u025b s\u025b y\u025bpa abaw, a
  y\u025bte nka s\u025b y\u025bn sint\u0254 ahorow no ma y\u025by\u025b nnipa a y\u025bmfata
  s\u025b y\u025bsom Yehowa. Y\u025bn Nyankop\u0254n a \u0254y\u025b \u0254domfo no
  ay\u025b nsiesiei a \u0254nam so ma w\u0254n a wonu w\u0254n ho komam no nya n\u2019anim
  dom bio. Susuw \u0254somafo Yohane ns\u025bm a awer\u025bkyekye wom yi ho hw\u025b:
  \u201cMerekyer\u025bw eyinom mabr\u025b mo, na moany\u025b b\u0254ne.\u201d Afei
  \u0254de kaa ho pefee s\u025b: \u201cNa s\u025b obi y\u025b b\u0254ne [esiane sint\u0254
  a yenya fii awo mu nti] a, y\u025bw\u0254 okyigyinafo bi, agya no nky\u025bn, \u0254ne
  \u0254treneeni Yesu Kristo.\u201d (1 Yohane 2:1) Yiw, Yehowa de Yesu agyede af\u0254re
  no ama na ama y\u025batumi asom no w\u0254 \u0254kwan a \u025bs\u0254 ani so \u025bmfa
  ho s\u025b y\u025by\u025b ab\u0254nefo. So \u025bno nka y\u025bn mma yennya \u0254p\u025b
  s\u025b y\u025bb\u025by\u025b nea yebetumi biara s\u025b y\u025bb\u025bs\u0254 Yehowa
  ani?\\nAs\u025bmpa no ne Onyankop\u0254n At\u025bntrenee\\n8, 9. \u0186kwan b\u025bn
  so na as\u025bmpa no a y\u025bka no da Yehowa at\u025bntrenee adi?\\n8 Yebetumi
  ada at\u025bntrenee adi\\n9 Yehowa remfa nhyehy\u025be b\u0254ne yi mma awiei bere
  a yennii kan mm\u0254\u0254 ho k\u0254k\u0254. Yesu kae w\u0254 nk\u0254mhy\u025b
  a \u025bfa nea \u025bb\u025bk\u0254 so w\u0254 awiei bere mu ho mu no s\u025b: \u201cEtwa
  s\u025b w\u0254ka as\u025bmpa no kyer\u025b amanaman nyinaa kan.\u201d (Marko 13:\\n10,
  11. \u0186kwan b\u025bn so na ky\u025bfa a yenya w\u0254 as\u025bmpa no ka mu no
  da Onyankop\u0254n at\u025bntrenee adi?\\n10 \u0186kwan b\u025bn so na as\u025bmpa
