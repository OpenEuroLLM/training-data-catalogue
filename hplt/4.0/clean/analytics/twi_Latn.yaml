  ahonim di adanse\u025b s\u025b w\u0254di bem anaas\u025b w\u0254abu w\u0254n f\u0254.
  16Enti, as\u025bmpa a meka no kyer\u025b s\u025b, s\u025b \u025bda no duru a, saa
  na Onyankop\u0254n nam Yesu Kristo so b\u025bbu nnipa k\u0254koams\u025bm at\u025bn.\\n17Mo
  Yudafo\u0254 de\u025b, mosusu s\u025b mo ne Onyankop\u0254n te no yie so, \u025bfiri
  s\u025b, \u0254de ne Mmara a monam so b\u025bnya nkwagye\u025b no maa mo. Na moka
