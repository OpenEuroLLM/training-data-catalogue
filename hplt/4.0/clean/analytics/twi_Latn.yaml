sample: '["\"R\u00edo Pl\u00e1tano Bisophere Korabea\\nR\u00edo Pl\u00e1tano Bisophere
  Korabea y\u025b 5,250 kasaase a w\u0254dze esie w\u0254 La Mosquitmantew a \u0254w\u0254
  he Caribbempoano a \u0254w\u0254 Hondura Asaase obebree na twa mu w\u0254 he R\u00edo
  Pl\u00e1tan\u0190p\u0254w na w\u0254 mboa dodow bia suro h\u0254n nna bi nso y\u025b
  Hondura \u0254y\u025b \u0190p\u0254w no kese. Woay\u025b wiase amanbra bea na hen
  p\u0254w fir ce 198 W\u0254 2011, UNESCO dze s\u0254w no tow wiase amanbra a \u0254w\u0254
  fonamu krataa do.\\nAbak\u0254s\u025bm[sesa mu | sesa ekyirs\u025bm]\\nW\u0254 1960
  mu no, w\u0254dze asase no too nky\u025bn s\u025b \\\"Ciudad Blanca Fam Atutuw Akorae,\\\"
  a w\u0254dze tete atrae a w\u0254ka ho as\u025bm s\u025b w\u0254fr\u025b no la Ciudad
  Blanca no din too so. W\u0254sesaa akorae\u025b no din \\\"R\u00edo Pl\u00e1tano
  Biosphere Reserve\\\" w\u0254 afe 1980 mu na w\u0254dze kaa Wiase Agyapadze ho w\u0254
  afe 1982 mu.\\nW\u0254y\u025b\u025b nhyehy\u025be ne nk\u0254so\u0254 w\u0254 afe
  1980 mu na Department of Natural Renewable Resources dzi dii dwuma w\u0254 afe 1987
  mu. W\u0254 afe 1997 mu no, w\u0254kyer\u025b\u025b 3250 km2 fofor\u0254 s\u025b
  beae\u025b a w\u0254dze b\u025bb\u0254 akorae\u025b no. W\u0254 1997 mu no, Germany
  Nk\u0254so Sikakorabea no fii nhyehy\u025be bi ase a \u025bb\u025btr\u025bw akorae
  no mu k\u025bse ak\u0254 Patuca Asub\u0254nten no ne Bosawas Ab\u0254de a Nkwa Wom
  Akorae a \u025bw\u0254 Nicaragua no mu. Mprempren, Germany nhyehy\u025be no ne\u025bma
  mu.\\nMmeae a wotutu fam hwehw\u025b tetefo n\u025bn[sesa mu | sesa ekyirs\u025bm]\\nNne\u025bma
  a w\u0254akora so no da so ara w\u0254 mmeae b\u025bboro 200 a wotutu fam hwehw\u025b
  tetefo nne\u025bma mu,a beae a Christopher Columbus dii kan baa Amerika asasep\u0254n
  no so ka ho. Afei nso, atrae a as\u025be a abo a efi adan ne akwan so, abotan a
  w\u0254asen, ne nne\u025bma afoforo a aka ka ho w\u0254 beae\u025b a w\u0254akora
  so no.\\nSaa mmeae yi mu kakraa bi na w\u0254ab\u0254 ho ban, nokwarem no w\u0254afow
  ebinom na pii y\u025b ade titiriw a \u025bma nsrahw\u025bfo k\u0254 h\u0254. \u0190wom
  s\u025b mfiriase no, \u0254mantam no bo a \u025bsom w\u0254 fam tutu mu no dii dwuma
  k\u025bsew w\u0254 beae\u025b a w\u0254akora so no a w\u0254hyehy\u025b\u025bw no
  mu de, nanso mprempren beae\u025b a w\u0254akora so no twe adwene si kwae ahorow
  no ho banb\u0254 so k\u025bsew.\\nS\u025bnea atetes\u025bm kyer\u025b no, La Ciudad
  Blanca w\u0254 \u0254mantam no mu. Mfe pii a atwam no, fam tutufo a w\u0254y\u025b
  adwumaden ne w\u0254n a w\u0254ny\u025b adwumaden pii aka s\u025b w\u0254ahu, nanso
  emu biara mmaa adanse a wotumi gye di na adwumay\u025bfo dodow no ara da so ara
  gye akyinnyew s\u025b na \u025bw\u0254 h\u0254 p\u025bn.\\nMp\u0254tam h\u0254 nnipa
  dodow[sesa mu | sesa ekyirs\u025bm]\\nNnipa b\u025bborow 2,000 a w\u0254y\u025b
  abor\u0254fo ne nnipa a wotu k\u0254tra mmeae foforo a w\u0254d\u0254\u0254so w\u0254
  beae a w\u0254akora so no.Nnipa dodow naa y\u025b amammer\u025b akuw anan a \u025bsono
  w\u0254n koraa na w\u0254y\u025b soronko koraa: Miskitofo, Pechfo, Garifunafo, ne
  ladinofo. Akuw nketewa no, Pechfo, Garifunafo, ne Miskitofo a w\u0254te h\u0254
  no mu dodow no ara te atifi fam, w\u0254 asub\u0254nten no do. Saa nnipa yi w\u0254
  hokwan ahorow w\u0254 asase no ho na w\u0254n mu dodow no ara de asase no y\u025b
  kua. \u0190ny\u025b den s\u025b w\u0254b\u025bma Pechfo kuay\u025b nketewa no ay\u025b
  nea \u025bb\u025bk\u0254 do\\no atra h\u0254 daa. Kuw a \u025bs\u00f5 sen biara
  no mu pii, ladino, fi anwafo fam hy\u025bn mmoa a w\u0254kora w\u0254n so no mu.[3]
  Asase hokwan ahorow ho ntawntawdi y\u025b ade titiriw a \u025bde ntawntawdi ba mmusuakuw
  ahorow ntam. Mprempren ntawntawdi a \u025bfa asase hokwan ahorow ho no fa nnipa
  a w\u0254ny\u025b kurom h\u0254fo a w\u0254tow hy\u025b abor\u0254fo asase wuranom
  so na wohunahuna w\u0254n\u2014a w\u0254hy\u025b w\u0254n ma wofi w\u0254n abak\u0254s\u025bm
  mu nsase so.\\nSenea w\u0254 kora no[sesa mu | sesa ekyirs\u025bm]\\nW\u0254 1996
  mu no, beae a w\u0254akora so no nyaa Wiase Agyapadze a \u0190w\u0254 Asiane mu
  din. Nhyehy\u025bew bi a w\u0254de hw\u025b nne\u025bma a w\u0254kora so so, a w\u0254dze
  dzii dwuma w\u0254 afe 2000 mu no, na \u025bka ho ne macrozoning, subzoning, ne
  nhyehy\u025bw p\u0254t\u025bw a \u025bfa ns\u025bm a \u025bfa nne\u025bma a w\u0254kora
  so ho.[8] Macrozoning nhyehy\u025be no de buffer zones, amammer\u025b zones, ne
  nucleus zones zii h\u0254. Na ahunahuna no nyinaa, titiriw w\u0254 nuklea mmeae\u025b
  no, so ate w\u0254 afe 2006 mu a \u025bhunu nk\u0254so\u0254 k\u025bse\u025b w\u0254
  mm\u0254dzen a w\u0254b\u0254 s\u025b w\u0254b\u025bkora nne\u025bma so no mu, na
  \u025bdze Wiase Agyapadze a \u025bw\u0254 Asiane mu din a w\u0254dze too h\u0254
  no fii h\u0254 w\u0254 afe 2007 mu. Nanso, firi nhwehw\u025bmu a w\u0254y\u025be\u025b
  nnansa yi w\u0254 afe 2010 ne 2011 mu no, \u025bte s\u025b nea mfaso\u0254 biara
  a w\u0254anya no, mfiriase\u025b no, \u025bnte saa mprempren. UNESCO nnansa yi ara
  (2011) y\u025b\u025b as\u025bmpatr\u025bw adwuma bi k\u0254\u0254 Rio Pl\u00e1tano
  na wohui s\u025b dwumadi a mmara mma ho kwan w\u0254 beae titiriw no mu. Nnub\u0254ne
  a w\u0254dze fa sum ase, asase a wotutu so ma anantwi didi, ne mpataayi ne ab\u0254mm\u0254
  a mmara mma ho kwan w\u0254 asub\u0254nten no ho rek\u0254 so mprempren. W\u0254
  afe 2011 mu no, UNESCO de saa akorae\u025b no too Wiase Agyapadze a \u0254w\u0254
  Asiane mu no din mu.\\nW\u0254nam nhyehy\u025bw a \u0254fi Department of Protected
  Areas & Wildlife, State Forestry Administration a \u025bw\u0254 Honduras no h\u0254
  so na \u025bb\u0254 beae no ho ban, na wonya sika bi fi Wiase Nyinaa Wildlife Fund
  ne ankorankoro ahyehy\u025bde afoforo h\u0254. Aban ne ahyehy\u025bde ahorow ne
  boayikuw ahorow dodow bi a \u025bny\u025b aban de ay\u025b nhyehy\u025be ahorow
  a w\u0254de b\u025bkora nne\u025bma so na w\u0254de adi dwuma w\u0254 \u0254mantam
  no mu. Botae titiriw a \u025bw\u0254 beae a w\u0254akora so no ne s\u025b \u025bb\u025bb\u0254
  asase no ho ban afi kwae a wobetutu ne nk\u0254so ho.\\nNhyehy\u025be a w\u0254de
  hw\u025b mmoa so no botae ne s\u025b w\u0254de mp\u0254tam h\u0254fo b\u025bka w\u0254n
  nne\u025bma a atwa w\u0254n ho ahyia ho denam kuay\u025b nney\u025be a \u025bb\u025bk\u0254
  so atra h\u0254 daa so (hw\u025b La Ruta Moskitia Ecotourism Alliance). Abibifo
  a w\u0254y\u025b abor\u0254fo no di dwuma k\u025bse w\u0254 nne\u025bma a w\u0254kora
  so ho nhyehy\u025bw no mu, w\u0254 beae a w\u0254akora so no mu ne nea w\u0254akora
  so no akyi w\u0254 mmeae a w\u0254hw\u025b mmoa so no nyinaa. Abodzin ahorow a w\u0254de
  b\u025bma ne agyapadze hokwan ahorow a wogye tom de facto dzii dwuma titiriw w\u0254
  nhyehy\u025bw a w\u0254dze b\u025bkora nne\u025bma so w\u0254 beae a w\u0254akora
  so no mfiriase no mu. Mprempren \u025bho hia s\u025b w\u0254y\u025b nhyehy\u025be
  biara a w\u0254dze b\u025bkora nne\u025bma so ama beae a w\u0254akora so no foforo.\\nNhyehy\u025be
  a \u025bfa nne\u025bma a w\u0254kora so no bisa s\u025b w\u0254nk\u0254 so mfa w\u0254n
  ho nhy\u025b mu s\u025b w\u0254b\u025bma asase a w\u0254w\u0254 w\u0254 beae a w\u0254akora
  so no ne ne mp\u0254tam no mu ada h\u0254. \u0190s\u025b s\u025b w\u0254y\u025b
  nhwehw\u025bmu pii na ama w\u0254ate bo a adekorabea no som ne ahunahuna a ebetumi
  aba no ase. Mprempren wonni mm\u0254nten so aw\u025bmfo anaa aban adwumakuw biara
  a w\u0254de nsiy\u025b rehw\u025b mmeae ahorow anaas\u025b w\u0254rew\u025bn\\nte
  to h\u0254.\"", "\"Previous Lesson -- Next Lesson\\n4. Agya no annuoyamhy\u025b
  no de basabasay\u025b baae\u025b (Yohanne 12:27-36)\\nYOHANNE 12:27-28\\n27 \\\"Afei
  me kra ho yera no; na \u025bde\u025bn na menka? Agya, gye me firi d\u0254n yi mu!
  Nanso yei nti na mebaa d\u0254n yi mu. 28 Agya, hy\u025b wo din animuonyam! \u025bnna
  \u025bnne bi firi soro bae\u025b: Mahy\u025b no animuonyam dada, na m\u025bhy\u025b
  no bio.\\\"\\nYesu hunuu amane\u025b frii ne kra mu. Na \u0254no ne nkwa nyinaa
  wura, nanso \u0254br\u025b\u025b ne ho ase ma owuo tumi menee no. Na \u0254y\u025b
  Awura mu Awurade, nanso \u0254maa \u0254bonsam, a odi owuo so tumi no, ne no dii
  \u025bsie w\u0254 nahoden nyinaa mu. Na Yesu firii \u0254p\u025bpa mu soaa y\u025bn
  b\u0254ne nyinaa, de yii Onyankop\u0254n abufuohye\u025b gya a na \u025bredere tia
  y\u025bn no. \u0186y\u025b \u0186ba, a na \u0254ne Agya no w\u0254 h\u0254 daa a
  \u025bnni \u025bwie\u025b. Nanso y\u025bn nkwagye\u025b nti Agya no yii nani hintaa
  no, na ama y\u025bafa nadom no so ne no anya nkabom. Obiara nntumi nhunu \u0254yaw
  soronko a \u0186ba no faa mu w\u0254 Agya no anim maa y\u025bn. Onyankop\u0254n
  Baasa Koro no faa \u0254yaw mu maa y\u025bn nkwagye\u025b.\\nKristo nipadua faa
  ateetee mu ne \u0254yaw k\u025bse\u025b mu. Na \u0254teamu s\u025b, \\\"Agya, gye
  me fri saa d\u0254n yi mu.\\\" Na \u0254tee Honhom no nne s\u025b \u0254geeso w\u0254
  nakoma mu s\u025b, \\\"Saa d\u0254n yi mu nti na w\u0254woo wo\u0254. Na saa d\u0254n
  yi ne botae\u025b a \u025by\u025b daa nkwa a \u025bnni \u025bwie\u025b. Ab\u0254de\u025b
  nyinaa ne Agya no retwen saa d\u0254n yi, na ama nnipa nyinaa atumi abata Onyankop\u0254n
  ho, na ab\u0254de\u025b nyinaa ak\u0254 \u0254b\u0254ade\u025b no nkyen. Na \u025byi
  mu na nkwagye\u025b ho nhyehy\u025be\u025b nyinaa b\u025btumi ahy\u025bma.\\\"\\nNa
  \u025bno mu no, Yesu teamu s\u025b, \\\"Agya, hy\u025b wo din annuoyam!\\\" Na \u0186ba
  no rentie honam nne. Na \u0254b\u0254\u0254 mpae\u025b w\u0254 Honhom Kronkron no
  mu s\u025b, \\\"Wodin ho ntew. S\u025bde\u025b \u025bb\u025by\u025b na wiase nyinaa
  b\u025bhunu s\u025b wonny\u025b Onyankop\u0254n a wommb\u0254 hu, na wommmi akyirikyiri
  na \u025bfei nso wonny\u025b \u0254boafo\u0254, na mmom wob\u025bhunu s\u025b woy\u025b
  Agya a \u0254d\u0254 ahy\u025b wo ma, a w\u0254de wo ho maae\u025b w\u0254 \u0186ba
  no mu de gyee wiase amumuy\u025b ne ayera mma nkwa.\\nNa Onyankop\u0254n y\u025b\u025b
  nt\u025bm gyee ne Ba no so. Na obuaa no frii soro. \\\"Mahy\u025b me din annuoyam
  w\u0254 wo mu. Woy\u025b me Ba setie ne ahobr\u025b\u025baase\u025bni. \u0190no
  nti obiara ohunu wo\u0254 no, ohunu me. Na wone me d\u0254 Ba, na wona wos\u0254
  mani. Na minnni anigyie biara w\u0254 baabiara agyes\u025b wo mu ne as\u025bndua
  no so. W\u0254 wo nkunimdie wuo no mu, na meyi mannuoyam tumi no \u025bdi w\u0254
  abrab\u0254 haw ahorro\u0254 mu akyer\u025be\u025b. W\u0254 as\u025bndua no na woyii
  ntease\u025b a \u025bw\u0254 mannuoyam ne me kronkrony\u025b mu \u025bdi kyer\u025b\u025be\u025b.
  Na \u025by\u025b \u0254d\u0254 na \u025bmaa w\u0254b\u0254\u0254 af\u0254re\u025b
  soronko na w\u0254de wo ho maae\u025b maa won a anka wonns\u025b mmfata na won akoma
  nso apirim.\\\"\\nNa \u0254soro nne no toaaso kasae\u025b p\u025bfee s\u025b, \\\"Mehy\u025b
  me din annuoyam bio, s\u025b wos\u0254re firi awufo\u0254 mu na woforo ba me nkyen
  w\u0254 soro ha, na wob\u025btena me nsa nifa w\u0254 annuoyam mu a, mehwie me Honhom
  no agu woad\u0254fo\u0254 nyinaa so. Na mema m''Agyay\u025b din no ada \u025bdi
  w\u0254 dodo\u0254 a wonya awo\u0254 foforo no nyinaa mu w\u0254 Honhom Kronkron
  no tumi mu. Na won nyinaa b\u025bhy\u025b me annuoyam; na \u025bfei won atew me
  din ho. Wo wuo w\u0254 as\u025bndua no so na ama Onyankop\u0254n mma anya awo\u0254
  foforo. Na wodima mu annuoyam na ama as\u0254re no \u025bdi nkunim. Na wo nko wo
  mu na ama Agya no annuoyam to nntwa dabiarada.\\\"\\nYOHANNE 12:29-33\\n29 \u025bnna
  nkur\u0254fokuo a w\u0254gyina h\u0254 na w\u0254tee\u025b no kaa s\u025b, \\\"Aprannaa
  abom! Ebinom se, \u0254b\u0254fo\u0254 ne no kasae.\\\" 30 Yesu bua kaa s\u025b:
  \u025bny\u025b me nti na \u025bnne yi bae\u025b, na mo ntira. 31 Afei ne wiase atemmuo;
  afei na w\u0254b\u025byi wiase sodifo\u0254 no h\u0254. 32 Na me de\u025b, s\u025b
  w\u0254ma me so firi asase so a, m\u025btwe nnipa nyinaa maba me nky\u025bn. 33
  Yei de\u025b, \u0254ka de kyer\u025b\u025b owu ko a \u0254reb\u025bwuo.\\nNa nkur\u0254fokuo
  no nnim s\u025b Yesu ne Onyankop\u0254n \u025bkasa nya nkutahodie, na nne no a bae\u025b
  te s\u025b apranaa. Won anntumi annhunu s\u025b Onyankop\u0254n y\u025b \u0254d\u0254,
  na won anntumi annte ne nne no nso, na \u025bfei nso won annhunu s\u025b Onyankop\u0254n
  adiyis\u025bm no a \u025by\u025b wiase at\u025bnbuo no ada \u025bdi w\u0254 ne Ba
  no mu.\\n\u0186bonsam hweree nnipa a woafa won domum no, \u025bfiris\u025b Yesu
  wui w\u0254 as\u025bndua no so de gyee y\u025bn nkwa. Na \u0254b\u0254nefo\u0254
  no tumi nyinaa hwee fam na \u0254br\u025b\u025b ne ho ase maa \u0186ba no w\u0254
  Agya no p\u025b mu. Na Yesu fr\u025b\u025b \u0254bonsam s\u025b wiase yi sodifo\u0254,
  a \u025bkyer\u025b s\u025b wiase nyinaa da nabamu. W\u0254 \u0254yaw ne ateetee
  nyinaa mu no Yesu, de ne trenee nkrante\u025b b\u0254\u0254 \u0254bonsam twaa no
  hwee fam, na \u0254s\u025be ne ndwuma nyinaa. Na \u025bfei de\u025b y\u025by\u025b
  mma a y\u025bade y\u025bn ho w\u0254 Yesu din mu.\\nNa woatwe y\u025bn aba nas\u025bndua
  no ho. \u0186bonsam ko tiaa no kosii s\u025b anka onim a anka woammma Yesu annwu
  w\u0254 as\u025bndua no so anaas\u025b ne fie mpo, nanso \u0254maa no so b\u0254\u0254
  no as\u025bndua mu ma no wuui\u025b w\u0254 animguase\u025b mu. Na s\u025bde\u025b
  Moses maa \u0254w\u0254 no so w\u0254 dua no so w\u0254 ser\u025b no so na \u025bmaa
  Onyankop\u0254n abufuo br\u025b\u025b ase maa agyidifo\u0254 no, saa ara nso na
  as\u025bndua no nso faa at\u025bnbuo nyinaa too ne ho so. Na Onyankop\u0254n mmbu
  won a w\u0254ma won aniso hw\u025b as\u025bndua no so no at\u025bnbuo. \u0190firis\u025b
  y\u025bn gyidie a \u025bw\u0254 Yesu mu no b\u0254 y\u025bne no as\u025bndua mu
  na \u025btwe y\u025bn bata ne ho w\u0254 ne wuo mu. Na y\u025bawu ama b\u0254ne
  na y\u025batena ase ama trenee.\\nNa y\u025bn nkabom a y\u025bw\u0254 w\u0254 Kristo
  mu no ma y\u025bn akwanya w\u0254 Ne tumi ne nannuoyam mu. S\u025bde\u025b odii
  b\u0254ne so ne owuo tumi so w\u0254 kronkrony\u025b mu no, saa ara nso na \u0254b\u025btwe
  y\u025bn aba ne nkyen na \u0254de y\u025bn ak\u0254 nannuoyam mu. Na obiara a \u0254gye
  no \u025bdie no rennyera, na mmom ob\u025bnya daa nkwa.\\nYOHANNE 12:34\\n34 Nkur\u0254fokuono
  buaa no s\u025b: Y\u025bn de\u025b, y\u025bate no mmara no mu s\u025b, Kristo no
  te h\u0254 daa; na ad\u025bn na wose: \u025btwa s\u025b w\u0254ma Onipa Ba no so\u0254?
  Hwan ne Onipa Ba yi?\\nJewfo\u0254 no ne Yesu dii apreapre\u025b, na wobisaa no
  s\u025b \u0254nkyer\u025b won de\u025b \u025bdi adanse\u025b p\u025bfee fa ne ho,
  na ama won atumi agye no \u025bdi s\u025b \u0254y\u025b papa. Na wonim ns\u025bm
  a \u025bw\u0254 Daniel nnwoma no mu w\u0254 nkyeky\u025bmu 7 no mu, \u025bh\u0254
  na \u025bka s\u025b Mesaia no y\u025b Onipa Ba ne wiase nyinaa at\u025bnbuafo\u0254
  no. Nanso na w\u0254p\u025bs\u025b w\u0254te fri nanom s\u025b \u0254no ne Onyankop\u0254n
  Ba no. Na won anngye saa as\u025bm yinom anndi, na w\u0254kaa ns\u025bm a \u025bnim
  mmom, na y\u025bnnhw\u025b s\u025b \u0254y\u025b de\u025b \u0254se \u0254y\u025b
  no anaa. Na \u025bbinom y\u025b atanfo\u0254 a na w\u0254w\u0254 adwene b\u0254ne
  nso, na w\u0254p\u025b\u025bs\u025b w\u0254b\u0254 no sombo\u0254 s\u025b woaka
  abusus\u025bm, \u025bfiris\u025b woaka s\u025b \u0254y\u025b Onyame Ba a na \u0254y\u025b
  onipa ba. Na Yesu annyi ne \u025bdi p\u025bfee annkyer\u025b won a na w\u0254rey\u025b
  ne ho nhwehw\u025bmu no, na mmom oyii ne ho \u025bdi kyer\u025b\u025b agyidifo\u0254
  no, a w\u0254maa kwan ma Honhom Kronkron no b\u025bhw\u025b\u025b won ma no, won
  a w\u0254paemu kaa s\u025b Onipa Ba no y\u025b Onyankop\u0254n Ba no, w\u0254 won
  nney\u025b\u025b nyinaa mu.\\nYOHANNE 12:35\\n35 \u025bnna Yesu ka kyer\u025b\u025b
  w\u0254n s\u025b, \\\"Aka hann no ber\u025b tiaa bi w\u0254 mo mu. Mow\u0254 hann
  no yi, monnante, na esum amm\u025bto mo; na de\u025b \u0254nam sum mu no nnim faako
  a \u0254rekor\u0254.\\\"\\nYesu ne wiase kanea no, s\u025b obi p\u025bs\u025b ohunu
  kanea no a nkyer\u025bkyer\u025bmu tenten biara nni mu bebree. \u0190da \u025bdi
  p\u025bfee ma obiara tumi hunu kanea no, \u025bfiris\u025b nsonsonoe\u025b da \u025bne
  \u025bsum n9 ntam. Na \u025bhyan w\u0254 h\u0254 yi obiara b\u025btumi atu kwan,
  na ob\u025btumi anante anaas\u025b ob\u025btu mirika. Na anadwo de\u025b, obiara
  nntumi nny\u025b adwuma. Na \u025bmber\u025b a \u025bwia guso reb\u0254 no, \u025by\u025b
  adwuma mber\u025b. Yesu ka kyer\u025b\u025b Jewfo\u0254 no s\u025b w\u0254w\u0254
  mber\u025b kakraabi s\u025b w\u0254b\u025bnante \u025bhyan no mu, s\u025b w\u0254p\u025b
  a. Saa mber\u025b no y\u025b gyinae\u025b si mber\u025b, s\u025b w\u0254de won ho
  nyinaa b\u025bma no ama won \u025bsipi.\\nNanso obiara a \u0254b\u025bpo kanea no,
  \u0254b\u025btena \u025bsum kabii mu, na \u0254rennhunu nakwan mu yiye. Na Yesu
  ka kyer\u025b\u025b Jewfo\u0254 no s\u025b, wob\u025bsinti w\u0254 \u025bsum kabii
  mu, a anidaso\u0254 biara nni h\u0254 ma won. Na saa \u025bsum no nny\u025b wiase
  sum a y\u025bde y\u025bniwa hunu yi. Na mmom \u025by\u025b \u025bsum kabii a \u025bw\u0254
  \u0254kra no mu, a \u025by\u025b ahonhomfi na \u025bde ba onipa honhom mu. Na \u025bma
  saa nipa no abrab\u0254 nyinaa b\u025by\u025b \u025bsum kabii. \u0190no nti obiara
  a \u0254nngye Kristo no nndie no, saa \u025bsum kabii yi b\u025bdi no so. Wob\u025btumi
  ahunu, de\u025bn nti a \\\"Kristofo\u0254\\\" aman binom ab\u025by\u025b \u025bsum
  kabii w\u0254 wiase yi mu? \u0190ny\u025b obiara a w\u0254woo no \\\"Kristoni\\\"
  na \u025bde ne ho ama Kristo. Nnipa kakraabi na \u025bw\u0254 won mu a won ab\u025by\u025b
  Kristofo\u0254. \u0190sum di obiara \u0254mmfaa ne ho nnhy\u025b\u025b kanea no
  ase. Na \u025bba no saa a worenntumi nnya nhyira a \u025bfiri As\u025bmpa no mu
  ba no bi. Agyes\u025b woagye atomu, na woay\u025b osetie de wo ho ama Kristo ansana
  wob\u025bhunu kanea no.\\nYOHANNE 12:36\\n36 \\\"Mow\u0254 hann no yi, monnye hann
  no nni, na moay\u025b hann no mma.\\\" Yesu kaa yeinom, na \u0254firi w\u0254n anim
  h\u0254 k\u0254huntae\u025b.\\nApam a wone Kristo anya w\u0254 gyidie mu no b\u025bma
  woay\u025b soronko koraa. Na As\u025bmpa no yi Onyankop\u0254n anuuoyam \u025bdi
  kyer\u025b, na \u025by\u025b tumi k\u025bse\u025b sene ade\u025b biara. Na s\u025bde\u025b
  akode\u025b s\u025be nno\u0254ma no, saa ara nso na Kristo kanea no de daa nkwa
  ba y\u025bn mu ne no, na ama ogyidifo\u0254 no ab\u025by\u025b kanea mma ne abusuakuo
  bebree. So wode wo ho ama Kristo no anaa, a nokor\u025bdie ahy\u025b wo ma, ne ahote\u025b
  ne \u0254d\u0254? Yesu refr\u025b wo afri wo sum kabii no mu aba Ne hyan wawaso\u0254
  no mu na ama woab\u025by\u025b kronkron koraa.\\nNa \u0254kaa saa ns\u025bm yinom
  w\u0254 ber\u025b a \u0254rek\u0254 Yerusalem no, na woamfa tumi so ne Romanfo\u0254
  no anndi ako anaa Herodi. Na mmom na onim s\u025b ne ko no aba awie\u025b na wiase
  at\u025bnbuo nso ab\u025bn. Kanea no hyeren \u025bsum mu; na agyidifo\u0254 b\u025bnya
  nkwa, na won a wonngye nndie no b\u025byera. Na \u0186soro ne asaase apreapre\u025b
  no aba nawie\u025b. Na Onyankop\u0254n nnhy\u025b onipa biara s\u025b \u0254ngye
  nni. So woab\u025by\u025b kanea no ba anaas\u025b wodaso te \u025bsum kabii nkoasom
  mu?\\nMPAEB\u0186: Y\u025bda wo ase Awurade Yesu, s\u025b woyii wo ho \u025bdi s\u025b
  wiase kanea. Y\u025bsr\u025b wo s\u025b twe y\u025bn bra wo mm\u0254borohunu hyan
  no mu, na ma y\u025bny\u025b mm\u0254borohunufo\u0254 nso. Yi y\u025bn fri sika
  aniber\u025b ho, ne wiase tumidie ho, na ama y\u025batumi \u025bdi wakyi w\u0254
  nokor\u025b mu, na y\u025batena wo mu s\u025b hyann mma\\nNS\u0190MBISA:\\n- S\u025bn
  na asekyer\u025b s\u025b y\u025by\u025b hyan mma?\"", "\"NKY\u0190M A EDI KAN\\nNNWOM
  1-41\\n\u0186treneeni ne \u0254deb\u0254ney\u025bfo\\n1Nhyira nka onipa a ontie
  nneb\u0254ney\u025bfo afotu, na onni nneb\u0254ney\u025bfo nney\u025be akyi, na
  onni w\u0254n a wodi f\u025bw nso akyi. 2 Na mmom, \u0254de anigye di Awurade mmara
  so, na odwen ho awia ne anadwo nyinaa. 3 \u0186te s\u025b nnua a enyin w\u0254 asuten
  ho, na \u025bsow aba bere a \u025bs\u025b mu a ne nhaban no nguan. Odi nkonim w\u0254
  biribiara a \u0254y\u025b mu.\\n4 Nanso nneb\u0254ney\u025bfo nte saa; w\u0254te
  s\u025b nt\u025bt\u025b a mframa b\u0254 gu. 5 Onyankop\u0254n bebu nneb\u0254ney\u025bfo
