  wo afe 2003 mu. \u0254san nSo soom s\u025b Soafo mprenu; s\u025b Soafo a \u0254hw\u025b
  Atifi At\u0254e Mantam mu firi afe 2004 kosi 2006 ne Soafoa a \u0254hw\u025b At\u025bntrene
  so firi afe 2006 kosii 2007. Dery soom s\u025b \u0254kandifo ma d\u0254m kumaa w\u0254
  mmarahy\u025b bagua a \u025bt\u0254 no nnum no mu w\u0254 Ghana. Dey dii nkunim
  w\u0254 Nandom mmarahy\u025b bagua abato\u0254 no mu, na afei Lara-Nandom abato\u0254
  mp\u025bsoa so w\u0254 2008 mu nanso, \u0254hweree agua no maa Benjanmin Kumbour
  w\u0254 afe 2012 abatoo no mu. Soom s\u025b \u0254kwnakyer\u025bfo maa kuo a ne
  din de Water Aid Partner Round Table (1993 - 2003 )\\nNe ho ns\u025bm[sesa]\\nAmbrose
  y\u025b Romani na \u0254y\u025b \u0254warefo a \u0254w\u0254 ba baako\\nNkekaho[sesa]\\nNa
  \u0254ka Constitutional, Legal ne Parliamentary ho ns\u025bm na \u0254sane ka Selection
  kuo.\"", "\"D\u025bn Ne Nhwehw\u025bmu Adwumay\u025b ho Ns\u025bnkyer\u025bnne?
  What Are Analytical Performance Indicators in Akan\\nNhwehw\u025bmu adwumay\u025b
  ho ns\u025bnkyer\u025bnne y\u025b nnwinnade a \u025bho hia a w\u0254de susuw adwuma
  biara nkonimdi. W\u0254de adwumakuw bi adwumay\u025b ho ns\u025bm a \u025bk\u0254
  akyiri ma, na \u025bma wotumi te ahyehy\u025bde no aho\u0254den ne mmer\u025bwy\u025b
  ahorow ase yiye. \u0190denam saa ns\u025bnkyer\u025bnnede ahorow yi mu nhwehw\u025bmu
  so no, nnwumakuw betumi ahu mmeae a wobetumi anya nk\u0254so na w\u0254ay\u025b
  akwan horow a w\u0254b\u025bfa so ama w\u0254n tumi ay\u025b k\u025bse. Saa as\u025bm
  yi b\u025bhwehw\u025b hia a \u025bho hia w\u0254 nhwehw\u025bmu adwumay\u025b ho
  ns\u025bnkyer\u025bnne ne s\u025bnea wobetumi de adi dwuma de ama adwuma bi adwumay\u025b
  atu mp\u0254n.\\nAnalytical performance indicators y\u025b metrics a w\u0254de susuw
  adwuma anaa ahyehy\u025bde bi adwumay\u025b. W\u0254de nhumu ma w\u0254 s\u025bnea
  adwumay\u025b, akwan horow, ne akwan horow a w\u0254fa so y\u025b adwuma no tu mp\u0254n
  ho, na wobetumi de akyer\u025b mmeae a \u025bs\u025b s\u025b wotu mp\u0254n. Wobetumi
  de nhwehw\u025bmu adwumay\u025b ho ns\u025bnkyer\u025bnne adi dwuma de ahw\u025b
  nk\u0254so a aba w\u0254 bere mu, de adwumay\u025b atoto akansifo ho, na w\u0254asusuw
  nsakrae no nk\u025bnt\u025bnso. \u0190denam saa ns\u025bnkyer\u025bnnede ahorow
  yi mu nhwehw\u025bmu so no, nnwumakuw betumi asi gyinae ahorow a \u025bfata a \u025bb\u025bboa
  w\u0254n ma w\u0254adu w\u0254n botae ahorow ho.\\nD\u025bn Nti na Analytical Performance
  Indicators Ho Hia? (Why Are Analytical Performance Indicators Important in Akan?)\\nNhwehw\u025bmu
  adwumay\u025b ho ns\u025bnkyer\u025bnne ho hia efis\u025b \u025bma wonya s\u025bnea
  adwuma bi rey\u025b yiye no ho ns\u025bm a \u025bk\u0254 akyiri. W\u0254de sikas\u025bm
  mu mm\u0254denb\u0254, adet\u0254fo akomat\u0254yam, adwumay\u025b mu mm\u0254denb\u0254,
  ne nsusuwii atitiriw afoforo susuw adwuma bi nkonimdi ho. \u0190denam saa ns\u025bnkyer\u025bnnede
  ahorow yi a wodi akyi so no, nnwumakuw betumi ahu mmeae a \u025bs\u025b s\u025b
  wonya nk\u0254so na w\u0254asi gyinae a \u025bfata w\u0254 s\u025bnea w\u0254b\u025bkyeky\u025b
  nne\u025bma yiye ho.\\nNhwehw\u025bmu Adwumay\u025b Ns\u025bnkyer\u025bnne Ahodo\u0254
  B\u025bn Ne? (What Are the Types of Analytical Performance Indicators in Akan?)\\nAnalytical
  performance indicators y\u025b metrics a w\u0254de susuw adwuma anaa ahyehy\u025bde
  bi nkonimdi. Yebetumi akyeky\u025b saa ns\u025bnkyer\u025bnnede yi mu akuw atitiriw
  abien: sikas\u025bm ne nea \u025bny\u025b sikas\u025bm. Sikas\u025bm ho ns\u025bnkyer\u025bnne
  kyer\u025b s\u025bnea adwuma bi sikas\u025bm y\u025b yiye, te s\u025b mfaso a wonya,
  mfaso a wonya fi sika a w\u0254de asie mu, ne sika a wonya. Nne\u025bma a \u025bny\u025b
  sikas\u025bm ho ns\u025bnkyer\u025bnne susuw s\u025bnea adwuma bi di yiye w\u0254
  mmeae te s\u025b adet\u0254fo akomat\u0254yam, adwumay\u025bfo a w\u0254de w\u0254n
  ho hy\u025b mu, ne gua so ky\u025bfa. \u0190denam saa ns\u025bnkyer\u025bnnede ahorow
  yi a wodi akyi so no, nnwumakuw betumi anya w\u0254n adwumay\u025b ho nhumu na w\u0254asisi
  w\u0254n daakye ho gyinae a \u025bfata.\\n\u0186kwan B\u025bn so na W\u0254de Analytical
  Performance Indicators Di Dwuma w\u0254 Laboratory Testing mu? (How Are Analytical
  Performance Indicators Used in Laboratory Testing in Akan?)\\nW\u0254de nhwehw\u025bmu
  adwumay\u025b ho ns\u025bnkyer\u025bnne (API) di dwuma w\u0254 aduruy\u025bdan mu
  s\u0254hw\u025b mu de susuw nea efi mu ba no mu p\u025bp\u025b\u025bp\u025b na \u025by\u025b
  p\u025bp\u025b\u025bp\u025b. W\u0254de di dwuma de hw\u025b s\u025bnea s\u0254hw\u025b
  no mu aba no te na w\u0254hw\u025b hu s\u025b aduruy\u025bdan no redu gyinap\u025bn
  ahorow a \u025bfa p\u025bp\u025b\u025bp\u025by\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  a aduruy\u025bdan no de asi h\u0254 no ho. W\u0254taa de API ahorow di dwuma de
  toto nea efi s\u0254hw\u025b ahorow mu ba ho na w\u0254de hu nsonsonoe biara a \u025bw\u0254
  w\u0254n ntam. Wobetumi nso de adi dwuma de ahu nne\u025bma biara a ebetumi ama
  mfomso aba w\u0254 s\u0254hw\u025b nhyehy\u025be no mu. \u0190denam API ahorow a
  w\u0254de di dwuma so no, aduruy\u025bdan ahorow betumi ahw\u025b ahu s\u025b nea
  efi mu ba no y\u025b nea wotumi de ho to so na \u025by\u025b nokware.\\nDwuma b\u025bn
  na Analytical Performance Indicators Di w\u0254 Quality Control mu? (What Is the
  Role of Analytical Performance Indicators in Quality Control in Akan?)\\nAnalytical
  performance indicators ho hia ma quality control, \u025bfiri s\u025b \u025bma susudua
  a \u025bkyer\u025b s\u025bde\u025b akwan ne akwan a \u025bw\u0254 h\u0254 no tu
  mp\u0254n. \u0190denam saa ns\u025bnkyer\u025bnnede ahorow yi akyi a wobedi so no,
  wobetumi ahu mmeae a \u025bs\u025b s\u025b wonya nk\u0254so na w\u0254ahw\u025b
  ahu s\u025b w\u0254redi gyinap\u025bn ahorow a \u025bfa nne\u025bma pa ho no so.
  Wobetumi ay\u025b eyi denam s\u025bnea w\u0254b\u025bhw\u025b s\u025bnea data no
  y\u025b p\u025bp\u025b\u025bp\u025b, s\u025bnea w\u0254y\u025b no nt\u025bmnt\u025bm,
  s\u025bnea nea efi mu ba no hyia, ne s\u025bnea adey\u025b no nyinaa y\u025b adwuma
  yiye no so.\\nNsonsonoe b\u025bn na \u025bda P\u025bp\u025b\u025bp\u025b ne P\u025bp\u025b\u025bp\u025b
  ntam? (What Is the Difference between Accuracy and Precision in Akan?)\\nP\u025bp\u025b\u025bp\u025b
  ne p\u025bp\u025b\u025bp\u025by\u025b y\u025b nsusuwii abien a \u025bho hia w\u0254
  susuw mu. P\u025bp\u025b\u025bp\u025b kyer\u025b s\u025bnea susudua bi b\u025bn
  nokware bo no, bere a p\u025bp\u025b\u025bp\u025by\u025b kyer\u025b s\u025bnea susuw
  b\u025bn w\u0254n ho w\u0254n ho. S\u025b nhw\u025bso no, s\u025b susudua bi y\u025b
  p\u025bp\u025b\u025bp\u025b nanso \u025bny\u025b p\u025bp\u025b\u025bp\u025b a,
  \u025bkyer\u025b s\u025b susudua no b\u025bn bo ankasa nanso susudua a w\u0254afa
  no nhyia. \u0186kwan foforo so no, s\u025b susudua bi y\u025b p\u025bp\u025b\u025bp\u025b
  nanso \u025bny\u025b p\u025bp\u025b\u025bp\u025b a, \u025bkyer\u025b s\u025b susudua
  a w\u0254afa no y\u025b p\u025bp\u025b\u025bp\u025b nanso \u025bnb\u025bn bo a \u025bsom
  ankasa. S\u025bnea \u025bb\u025by\u025b a wobenya nea efi mu ba a \u025by\u025b
  p\u025bp\u025b\u025bp\u025b na \u025by\u025b p\u025bp\u025b\u025bp\u025b no, \u025bho
  hia s\u025b w\u0254hw\u025b hu s\u025b susuw a w\u0254asusuw no y\u025b p\u025bp\u025b\u025bp\u025b
  na \u025by\u025b p\u025bp\u025b\u025bp\u025b.\\nP\u025bp\u025b\u025bp\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  y\u025b nsusuwii abien a \u025bho hia w\u0254 susuw mu. P\u025bp\u025b\u025bp\u025by\u025b
  ne s\u025bnea bo a w\u0254asusuw no b\u025bn gyinap\u025bn anaa bo a wonim. P\u025bp\u025b\u025bp\u025by\u025b
  ne baabi a susuw a w\u0254susuw mp\u025bn pii w\u0254 tebea horow a \u025bnsakra
  mu no da nea efi mu ba koro no ara adi. Wobetumi asusuw p\u025bp\u025b\u025bp\u025by\u025b
  ne p\u025bp\u025b\u025bp\u025by\u025b nyinaa denam nsonsonoe a \u025bda bo a w\u0254asusuw
  ne bo a wogye tom ntam a wobebu ho akontaa no so. Dodow a nsonsonoe no sua no, dodow
  no ara na susuw no y\u025b p\u025bp\u025b\u025bp\u025b na \u025by\u025b p\u025bp\u025b\u025bp\u025b.\\nD\u025bn
  ne Mfomso Fibea a \u0190ka P\u025bp\u025b\u025bp\u025b ne P\u025bp\u025b\u025bp\u025b?
  (What Are the Sources of Errors Affecting Accuracy and Precision in Akan?)\\nNne\u025bma
  ahorow betumi anya p\u025bp\u025b\u025bp\u025by\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  so nk\u025bnt\u025bnso. Eyinom bi ne nnipa mfomso, adwinnade mu mfomso, nne\u025bma
  a atwa y\u025bn ho ahyia, ne s\u025bnea susuw no ankasa y\u025b p\u025bp\u025b\u025bp\u025b.
  Nnipa mfomso betumi afi data a w\u0254ankyer\u025bw a \u025bnte\u025b, akontaabu
  a \u025bnte\u025b, anaa nea efi mu ba no nkyer\u025base a \u025bnte\u025b mu aba.
  Adwinnade no mfomso betumi afi calibration a \u025bnte\u025b, adwinnade no a w\u0254mfa
  nni dwuma yiye, anaas\u025b adwinnade no a w\u0254ansiesie no yiye. Nne\u025bma
  a atwa y\u025bn ho ahyia betumi aka p\u025bp\u025b\u025bp\u025by\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  denam nne\u025bma a \u025bsakra te s\u025b \u0254hyew, \u0254hyew, ne mframa nhy\u025bso
  a w\u0254de b\u025bba so.\\n\u0186kwan B\u025bn so na Wobetumi Ama P\u025bp\u025b\u025bp\u025b
  ne P\u025bp\u025b\u025bp\u025b Atu mp\u0254n? (How Can Accuracy and Precision Be
  Improved in Akan?)\\nWobetumi ama p\u025bp\u025b\u025bp\u025by\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  atu mp\u0254n denam susuw ahorow pii a w\u0254b\u025bfa na w\u0254ay\u025b no s\u025b
  w\u0254kyekyem p\u025bp\u025b\u025bp\u025b no so. Eyi boa ma nne\u025bma a \u025bboro
  so anaa mfomso biara a \u025bw\u0254 data no mu no nk\u025bnt\u025bnso so tew.\\nD\u025bn
  Ne Akontaabu Akwan a \u0190fata a W\u0254de Hw\u025b P\u025bp\u025b\u025bp\u025b
  ne P\u025bp\u025b\u025bp\u025b? (What Are the Appropriate Statistical Methods for
  Evaluating Accuracy and Precision in Akan?)\\nP\u025bp\u025b\u025bp\u025b ne p\u025bp\u025b\u025bp\u025by\u025b
  y\u025b metrics mmienu a \u025bho hia a w\u0254de hw\u025b s\u025bnea akontabuo
  nhw\u025bso\u0254 bi y\u025b adwuma. S\u025b obi b\u025bsusu p\u025bp\u025b\u025bp\u025b
  a, \u0254b\u025btumi de metrics te s\u025b mean absolute error (MAE), mean squared
  error (MSE), ne root mean squared error (RMSE) adi dwuma. S\u025b obi b\u025bsusu
  p\u025bp\u025b\u025bp\u025b a, \u0254b\u025btumi de metrics te s\u025b mean absolute
  percentage error (MAPE), mean absolute deviation (MAD), ne coefficient of determination
  (R-squared) adi dwuma. Wobetumi de saa metrics yi atoto nhw\u025bso ahorow ho na
  w\u0254ahu nea \u025by\u025b p\u025bp\u025b\u025bp\u025b na \u025by\u025b p\u025bp\u025b\u025bp\u025b
  sen biara.\\nNkate ne p\u0254teey\u025b y\u025b nne\u025bma abien a \u025bho hia
  a \u025bkyer\u025b s\u025bnea w\u0254y\u025b no p\u025bp\u025b\u025bp\u025b w\u0254
  aduruy\u025b mu s\u0254hw\u025b ahorow mu. Nkate y\u025b tumi a s\u0254hw\u025b
  bi tumi hu w\u0254n a w\u0254w\u0254 yare no yiye, bere a specificity y\u025b tumi
  a s\u0254hw\u025b bi tumi hu w\u0254n a wonni yare no yiye. \u0186kwan foforo so
  no, nkate susuw nne\u025bma pa a w\u0254ahu no yiye no f\u00e3, bere a specificity
  susuw nne\u025bma a enye ankasa a w\u0254ahu no yiye no f\u00e3. Nne\u025bma abien
  no nyinaa ho hia na ama w\u0254ahu s\u025b aduruy\u025b mu nhwehw\u025bmu bi y\u025b
  p\u025bp\u025b\u025bp\u025b.\\n\u0186kwan B\u025bn so na W\u0254susu Nkate ne Nne\u025bma
  p\u0254tee? (How Are Sensitivity and Specificity Measured in Akan?)\\nNkate ne p\u0254teey\u025b
  y\u025b nne\u025bma abien a \u025bho hia a \u025bkyer\u025b s\u025bnea w\u0254y\u025b
  no p\u025bp\u025b\u025bp\u025b w\u0254 aduruy\u025b mu s\u0254hw\u025b ahorow mu.
  Nkate susuw nne\u025bma pa a w\u0254ahu no yiye no f\u00e3, bere a specificity susuw
  nne\u025bma a enye ankasa a w\u0254ahu no yiye no f\u00e3. \u0186kwan foforo so
  no, nkate kyer\u025b tumi a s\u0254hw\u025b bi tumi hu w\u0254n a w\u0254w\u0254
  yare no yiye, bere a specificity kyer\u025b tumi a s\u0254hw\u025b bi tumi hu w\u0254n
  a wonni yare no yiye. Nne\u025bma abien no nyinaa ho hia na ama w\u0254ahu s\u025b
  aduruy\u025b mu nhwehw\u025bmu bi y\u025b p\u025bp\u025b\u025bp\u025b.\\nD\u025bn
  ne Mfomso Fibea a \u0190ka Nkate ne P\u025bp\u025b\u025bp\u025b\u025bp\u025b? (What
  Are the Sources of Errors Affecting Sensitivity and Specificity in Akan?)\\nMfomso
  ahorow a \u025bka nkate ne p\u0254teey\u025b betumi afi mmeae ahorow aba. Eyinom
  bi ne ns\u025bm a w\u0254akyeky\u025b mu w\u0254 \u0254kwan a \u025bnte\u025b so,
  nsusuwii a \u025bnte\u025b a \u025bfa nnipa dodow ho, ne akwan a \u025bnte\u025b
  a w\u0254fa so de nhw\u025bsode di dwuma.\\n\u0186kwan B\u025bn so na Wobetumi Ama
  Nkate ne Nne\u025bma p\u0254tee a W\u0254y\u025b no Atu mp\u0254n? (How Can Sensitivity
  and Specificity Be Improved in Akan?)\\nWobetumi anya nkate ne p\u0254teey\u025b
  a \u025bb\u025bma atu mp\u0254n denam nhw\u025bsode no parameters a w\u0254b\u025bma
  ay\u025b papa no so. Wobetumi ay\u025b eyi denam nsakrae a w\u0254b\u025by\u025b
  w\u0254 model no threshold no mu, a \u025bkyer\u025b s\u025bnea model no kyeky\u025b
  input bi mu.\\nD\u025bn Ne Akontaabu Akwan a \u0190fata a W\u0254fa so Hw\u025b
  Nkate ne P\u025bp\u025b\u025bp\u025b\u025bp\u025b? (What Are the Appropriate Statistical
  Methods for Evaluating Sensitivity and Specificity in Akan?)\\nS\u025b w\u0254resusuw
  nkate ne p\u0254teey\u025b ho a, \u025bho hia s\u025b w\u0254de akontaabu akwan
  a \u025bfata di dwuma. Akwan a w\u0254taa fa so y\u025b adwuma ne Receiver Operating
  Characteristic (ROC) curves ne Area Under the Curve (AUC). W\u0254de ROC curves
  di dwuma de hw\u025b s\u025bnea binary classifier bi y\u025b adwuma, bere a w\u0254de
  AUC di dwuma de susuw s\u025bnea classifier bi y\u025b adwuma nyinaa. Saa akwan
  abien yi nyinaa ho w\u0254 mfaso ma nhwehw\u025bmu a w\u0254de hw\u025b s\u025bnea
  nhw\u025bsode bi y\u025b p\u025bp\u025b\u025bp\u025b w\u0254 nea ebefi s\u0254hw\u025b
  bi a w\u0254de ama mu aba no ho nk\u0254mhy\u025b mu.\\nAnohyeto a w\u0254de hu
  no ne ade bi dodow a \u025bba fam sen biara a wobetumi de ho ato so denam nhwehw\u025bmu
  kwan bi a w\u0254de ama so. \u0190y\u025b ade a \u025bho hia a \u025bs\u025b s\u025b
  wosusuw ho bere a w\u0254rey\u025b nhwehw\u025bmu biara no, efis\u025b ebetumi aka
  s\u025bnea nea efi mu ba no y\u025b p\u025bp\u025b\u025bp\u025b na \u025by\u025b
  p\u025bp\u025b\u025bp\u025b. S\u025bnea \u025bb\u025by\u025b a w\u0254b\u025bhw\u025b
  s\u025b nea ebefi mu aba no y\u025b nea wotumi de ho to so no, \u025bho hia s\u025b
  w\u0254te anohyeto a \u025bw\u0254 detection mu ne s\u025bnea ebetumi anya nk\u025bnt\u025bnso
  w\u0254 nnwinnade ko a w\u0254de di dwuma, nhw\u025bsode ahosiesie, ne nhwehw\u025bmu
  ko a w\u0254rey\u025b no ase.\\nDodowy\u025b y\u025b \u0254kwan a w\u0254fa so kyer\u025b
  biribi dodow anaa dodow. Anohyeto a \u025bw\u0254 dodow mu ne biribi dodow a \u025bsen
  biara a wobetumi asusuw anaa w\u0254akyer\u025b no p\u025bp\u025b\u025bp\u025b.
  \u0190ho hia s\u025b y\u025bte dodow a w\u0254de kyer\u025b anohyeto no ase bere
  a w\u0254rey\u025b nhwehw\u025bmu anaas\u025b w\u0254rey\u025b akontaabu no, efis\u025b
  ebetumi aka nea efi mu ba no p\u025bp\u025b\u025bp\u025b. S\u025b nhw\u025bso no,
  s\u025b anohyeto a w\u0254de kyer\u025b dodow no sua dodo a, ebia nea ebefi mu aba
  no reny\u025b nokware. \u0186kwan foforo so no, s\u025b anohyeto a w\u0254de kyer\u025b
  dodow no d\u0254\u0254so dodo a, ebia nea ebefi mu aba no b\u025by\u025b p\u025bp\u025b\u025bp\u025b
  dodo na ebia mfaso nni so. Enti, \u025bho hia s\u025b wote dodow a w\u0254de kyer\u025b
  anohyeto no ase ansa na woay\u025b nhwehw\u025bmu anaa akontaabu biara.\\n\u0186kwan
  B\u025bn so na W\u0254kyer\u025b Anohyeto a W\u0254de Hu ne Anohyeto a W\u0254de
  Kyer\u025b Dodow? (How Are the Limit of Detection and Limit of Quantification Determined
  in Akan?)\\nAnohyeto a \u025bw\u0254 detection ne quantification mu no, \u025bnam
  s\u025bnea nhwehw\u025bmu kwan a w\u0254de di dwuma no te nka so na \u025bkyer\u025b.
  Saa nkate yi gyina tumi a \u0254kwan no tumi hu na \u025bkyer\u025b dodow a analyte
  a n\u2019ani gye ho w\u0254 nhw\u025bsode matrix no mu no so. Anohyeto a w\u0254de
  hu no ne analyte a \u025bba fam koraa a wobetumi ahu nanso \u025bny\u025b nea \u025bkyer\u025b
  ne dodow. Anohyeto a \u025bw\u0254 dodow a w\u0254de kyer\u025b no mu ne ade a w\u0254de
  y\u025b nhwehw\u025bmu a wobetumi akyer\u025b dodow a \u025bba fam koraa. W\u0254nam
  nhwehw\u025bmu kwan no so p\u025bp\u025b\u025bp\u025b na \u025by\u025b p\u025bp\u025b\u025bp\u025b
  so na \u025bkyer\u025b anohyeto abien no.\\nD\u025bn ne Mfomso Fibea a \u0190ka
  Anohyeto a W\u0254de Hu ne Anohyeto a W\u0254de Kyer\u025b Dodow? (What Are the
  Sources of Errors Affecting the Limit of Detection and Limit of Quantification in
  Akan?)\\nWobetumi akyeky\u025b mfomso\u0254 fibea a \u025bka anohyeto\u0254 a w\u0254de
  hu ne anohyeto\u0254 a w\u0254de kyer\u025b dodo\u0254 no mu mmienu: nhyehy\u025be\u025b
  mu mfomso\u0254 ne mfomso\u0254 a \u025bba kwa. Nne\u025bma te s\u025b adwinnade
  a w\u0254de susuw nne\u025bma ho, nhw\u025bsode a wosiesie, ne nne\u025bma a atwa
  y\u025bn ho ahyia na \u025bde mfomso a \u025bba w\u0254 nhyehy\u025be mu ba. Mfomso
  a \u025bba kwa no fi nne\u025bma te s\u025b nhw\u025bsode a \u025bsakra, nnwinnade
  dede, ne susuw mu mfomso. Mfomso ahorow abien no nyinaa betumi ama nea efi mu ba
  no ny\u025b nokware na ebetumi aka anohyeto a w\u0254de hu ne anohyeto a w\u0254de
  kyer\u025b dodow. S\u025bnea \u025bb\u025by\u025b a mfomso b\u025btew no, \u025bho
  hia s\u025b w\u0254hw\u025b hu s\u025b w\u0254asusuw adwinnade no ho yiye, w\u0254asiesie
  nhw\u025bsode no yiye, na w\u0254ahw\u025b nne\u025bma a atwa y\u025bn ho ahyia
  no so.\\n\u0186kwan B\u025bn so na Wobetumi Ama Anohyeto a W\u0254de Hu ne Anohyeto
  a W\u0254de Kyer\u025b Dodow no Atu mp\u0254n? (How Can the Limit of Detection and
  Limit of Quantification Be Improved in Akan?)\\nWobetumi ama anohyeto a \u025bw\u0254
  detection ne anohyeto a \u025bw\u0254 quantification mu no atu mp\u0254n denam nhwehw\u025bmu
  akwan a \u025by\u025b mmer\u025bw k\u025bse a w\u0254de bedi dwuma so. S\u025b nhw\u025bso
  no, s\u025b w\u0254de mass spectrometer a \u025bw\u0254 nsusuwii a \u025bkor\u0254n
  anaas\u025b detector a \u025by\u025b mmer\u025bw k\u025bse di dwuma a, ebetumi aboa
  ma anohyeto a w\u0254de hu ne anohyeto a w\u0254de kyer\u025b dodow no atu mp\u0254n.\\nLinearity
  y\u025b adwene a \u025bkyer\u025b adwene a \u025bne s\u025b \u025bs\u025b s\u025b
  as\u025bm bi nya nk\u0254so w\u0254 linear kwan so, a adey\u025b biara de ntease
  k\u0254 nea edi h\u0254 no so. Eyi kyer\u025b s\u025b \u025bns\u025b s\u025b as\u025bm
  no huruw di ak\u0254neaba w\u0254 bere mu anaas\u025b ns\u025bm a esisi a \u025bne
  w\u0254n ho w\u0254n ho nni abusuab\u0254. Brandon Sanderson, nsusuwii hunu kyer\u025bwfo
  a wagye din no taa de linearity di dwuma w\u0254 n\u2019as\u025bm ahorow mu, na
  \u0254y\u025b as\u025bm a \u025bka bom a \u025bny\u025b den s\u025b wobedi akyi
  na w\u0254ate ase.\\nRange y\u025b nsonsonoe\u025b a \u025bda botae\u025b a \u025bkor\u0254n
  ne nea \u025bba fam ntam w\u0254 data ahodo\u0254 bi mu. \u0190y\u025b ade a w\u0254de
  susuw s\u025bnea ns\u025bm no tr\u025bw na wobetumi de atoto ns\u025bm ahorow a
  w\u0254ahyehy\u025b ho. S\u025b nhw\u025bso no, s\u025b data kuw biako w\u0254 10
  na data foforo nso w\u0254 20 a, \u025bnde data a \u025bto so abien no tr\u025bw
  k\u025bse sen nea edi kan no. Wobetumi nso de Range adi dwuma de ahunu outliers
  w\u0254 data set bi mu, \u025bfiri s\u025b value biara a \u025bkor\u0254n anaa \u025bba
  fam k\u025bse\u025b sene data nkae\u025b no b\u025bma range no ak\u0254 soro.\\nLinearity
  ne range no nam abusuab\u0254 a \u025bda nhyehy\u025be bi a w\u0254de ba ne nea
  w\u0254de fi mu ntam so na \u025bkyer\u025b. Linearity y\u025b dodo\u0254 a nhyehy\u025be\u025b
  bi mu nsunsuanso\u0254 ne nea w\u0254de ba no hyia, ber\u025b a range y\u025b dodo\u0254
  a nsusui\u025b a \u025bfiri mu ba no tumi fa. S\u025b nhw\u025bso no, s\u025b input
  no y\u025b voltage a, output no betumi ay\u025b current, na linearity ne range a
  \u025bw\u0254 system no mu no, anka abusuab\u0254 a \u025bda abien no ntam no b\u025bkyer\u025b.\\nD\u025bn
  ne Mfomso Fibea a \u0190ka Linearity ne Range? (What Are the Sources of Errors Affecting
  Linearity and Range in Akan?)\\nMfomso a \u025bka linearity ne range no betumi afi
  nne\u025bma ahorow mu aba. Eyinom bi ne calibration a \u025bnte\u025b, temperature
  compensation a \u025bnte\u025b, zero adjustment a \u025bnte\u025b, span adjustment
  a \u025bnte\u025b, signal conditioning a \u025bnte\u025b, ne signal amplification
  a \u025bnte\u025b.\\n\u0186kwan B\u025bn so na Wobetumi Ama Linearity ne Range Atu
  mp\u0254n? (How Can Linearity and Range Be Improved in Akan?)\\nWobetumi anya linearity
  ne range a \u025bb\u025bma atu mp\u0254n denam hw\u025b a w\u0254b\u025bhw\u025b
  s\u025b s\u025bnkyer\u025bnne no mu y\u025b den na emu da h\u0254 no so. Wobetumi
  ay\u025b eyi denam nne\u025bma a \u025bkor\u0254n te s\u025b afiri a \u025bma nne\u025bma
  y\u025b k\u025bse ne antenna a w\u0254de bedi dwuma so, na w\u0254ahw\u025b ahu
  s\u025b ns\u025bnkyer\u025bnne afoforo nsiw s\u025bnkyer\u025bnne no kwan anaas\u025b
  \u025brensiw kwan no so.\\nAho\u0254den y\u025b tumi a nhyehy\u025be bi tumi gyina
  basabasay\u025b ano na \u025bsan nya aho\u0254den na \u025bda so ara kura ne dwumadi
  ahorow a \u025bho hia no mu. \u0190y\u025b tumi a nhyehy\u025be bi tumi k\u0254
  so a nne\u025bma a efi akyi te s\u025b nsakrae a \u025bba nne\u025bma a atwa y\u025bn
  ho ahyia mu anaas\u025b nea \u0254de di dwuma no nnya so nk\u025bnt\u025bnso. Aho\u0254den
  y\u025b ade titiriw w\u0254 nhyehy\u025be biara a w\u0254y\u025b mu, efis\u025b
  \u025bhw\u025b hu s\u025b nhyehy\u025be no betumi ak\u0254 so ay\u025b adwuma w\u0254
  ns\u025bm a w\u0254nhw\u025b kwan mu. Aho\u0254den nso y\u025b ade titiriw a \u025bma
  wotumi de ho to nhyehy\u025be bi so, efis\u025b \u025bhw\u025b hu s\u025b nhyehy\u025be
  no betumi ak\u0254 so ay\u025b nea \u0254p\u025b s\u025b \u0254y\u025b bere mpo
  a wohyia tebea horow a w\u0254nhw\u025b kwan no.\\nRuggedness y\u025b as\u025bmfua
  a w\u0254de kyer\u025b s\u025bnea ade anaa ade bi ky\u025b na \u025by\u025b den.
  W\u0254taa de kyer\u025b tumi a ade anaa ade bi tumi gyina tebea horow a emu y\u025b
  den te s\u025b \u0254hyew a ano y\u025b den, s\u025bnea w\u0254de di dwuma denneennen,
  ne s\u025bnea w\u0254de w\u0254n ho hy\u025b wim tebea mu ano. Nne\u025bma a \u025by\u025b
  den y\u025b ade a \u025bho hia a \u025bs\u025b s\u025b wususuw ho bere a worepaw
  nne\u025bma anaa nne\u025bma a w\u0254de bedi dwuma w\u0254 mmeae a emu y\u025b
  den no.\\n\u0186kwan B\u025bn so na W\u0254susu Robustness ne Ruggedness? (How Are
  Robustness and Ruggedness Measured in Akan?)\\nW\u0254taa de s\u025bnea ade no tumi
  gyina nne\u025bma a atwa y\u025bn ho ahyia te s\u025b \u0254hyew, \u0254hyew, ne
  wosow ano na \u025bkyer\u025b s\u025bnea \u025by\u025b den na \u025by\u025b den.
  W\u0254y\u025b eyi denam s\u0254hw\u025b ahorow a w\u0254de y\u025b ade no toatoa
  so a \u025by\u025b tebea horow a ebia ebehyia w\u0254 nea w\u0254p\u025b s\u025b
  w\u0254de bedi dwuma no ho mfonini so. Afei w\u0254de nea efi s\u0254hw\u025b ahorow
  yi mu ba no di dwuma de hu s\u025bnea aduru no y\u025b den na \u025by\u025b den.\\nD\u025bn
  ne Mfomso Fibea a \u0190ka Robustness ne Ruggedness? (What Are the Sources of Errors
  Affecting Robustness and Ruggedness in Akan?)\\nAho\u0254den ne nea \u025by\u025b
  den y\u025b su abien a \u025bho hia w\u0254 nhyehy\u025be biara mu, na mfomso betumi
  aka w\u0254n w\u0254 akwan horow so. Mfomso fibea betumi ay\u025b hardware a entumi
  ny\u025b adwuma yiye, software b\u0254ne, nea \u0254de di dwuma no ns\u025bm a \u025bnte\u025b,
  nne\u025bma a atwa y\u025bn ho ahyia, ne nea \u025bkeka ho. Bio nso, mfomso betumi
  afi nsusuwii a \u025bnte\u025b anaas\u025b gyinaesi a \u025bnte\u025b a wosisi w\u0254
  adwini ho. Saa nne\u025bma a \u025bde mfomso ba yi nyinaa betumi ama aho\u0254den
  ne nea \u025by\u025b den no so atew, na ebetumi ama nhyehy\u025be no ay\u025b nea
  wontumi mfa ho nto so anaas\u025b entumi nnyina. \u0190ho hia s\u025b w\u0254hunu
  na w\u0254di saa mfomso\u0254 fibea yi ho dwuma s\u025bde\u025b \u025bb\u025by\u025b
  a w\u0254b\u025bhw\u025b s\u025b nhyehy\u025be\u025b no b\u025bk\u0254 so ay\u025b
  nea wotumi de ho to so na \u025by\u025b den.\\n\u0186kwan B\u025bn so na Wobetumi
  Ama Aho\u0254den ne Nne\u025bma a \u0190y\u025b Den no Atu mp\u0254n? (How Can Robustness
  and Ruggedness Be Improved in Akan?)\\nWobetumi ama s\u025bnea \u025by\u025b den
  na \u025by\u025b den no atu mp\u0254n denam hw\u025b a w\u0254b\u025bhw\u025b s\u025b
  w\u0254ay\u025b ade no s\u025bnea \u025bb\u025by\u025b a ebetumi agyina tebea a
  w\u0254ahy\u025b da ay\u025b no mu kateey\u025b ano no so. Nea \u025bka eyi ho ne
  nne\u025bma a \u025brentumi ns\u025be, ne nne\u025bma a w\u0254de y\u025b nne\u025bma
  a etumi gyina \u0254hyew a ano y\u025b den, \u0254hyew, ne nne\u025bma afoforo a
  atwa y\u025bn ho ahyia ano.\\n- Assessing hospital performance indicators. What
  dimensions? Evidence from an umbrella review (opens in a new tab) by E Carini &
  E Carini I Gabutti & E Carini I Gabutti EM Frisicale\u2026\\n- Conceptualizing and
  specifying key performance indicators in business strategy models (opens in a new
  tab) by A Mat & A Mat J Trujillo & A Mat J Trujillo J Mylopoulos\\n- A taxonomy
  for key performance indicators management (opens in a new tab) by E Domnguez & E
  Domnguez B Prez & E Domnguez B Prez L Rubio & E Domnguez B Prez L Rubio MA Zapata\\n-
  Augmented reality tools for industrial applications: What are potential key performance
  indicators and who benefits? (opens in a new tab) by J Jetter & J Jetter J Eimecke
  & J Jetter J Eimecke A Rese\"", "\"\u201cMommma obi nny\u025b mmma nkonimbo no mmm\u0254
  mo.\u201d\u2014KOL. 2:18.\\n1, 2. (a) Nkonimbo b\u025bn na Onyankop\u0254n asomfo
  hw\u025b kwan? (b) D\u025bn na \u025bboa y\u025bn ma y\u025bde y\u025bn ani si nkonimbo
  no so? (Hw\u025b mfonini a \u025bw\u0254 adesua yi mfiase no.)\\nKRISTOFO a w\u0254asra
  w\u0254n no w\u0254 anidaso papa bi. W\u0254hw\u025b kwan s\u025b w\u0254b\u025bk\u0254
  ak\u0254tena soro. \u0186somafo Paulo kae s\u025b saa anidaso no y\u025b \u201cnkonimbo
  a \u025bne \u0254soro fr\u025b a efi Onyankop\u0254n h\u0254.\u201d (Filip. 3:14)
  W\u0254n a w\u0254asra w\u0254n no hw\u025b kwan s\u025b w\u0254ne Yesu Kristo bedi
  ade w\u0254 \u0254soro Ahenni no mu, na w\u0254ne no aboa adesamma ama w\u0254ay\u025b
  p\u025b. (Adi. 20:6) Wei y\u025b hokwan a \u025bso bi nni; Onyankop\u0254n na \u0254de
  ama w\u0254n! Nguan foforo no de\u025b, \u025bsono w\u0254n anidaso. W\u0254hw\u025b
  kwan s\u025b wobenya nkonimbo a \u025bne daa nkwa w\u0254 asase so. Saa anidaso
  no ma w\u0254n ani gye paa!\u20142 Pet. 3:13.\\n2 N\u00e1 Paulo p\u025b s\u025b
  \u0254boa ne mf\u025bfo Kristofo a w\u0254asra w\u0254n no ma w\u0254k\u0254 so
  di nokware na w\u0254n nsa ka nkonimbo no. Enti \u0254ka kyer\u025b\u025b w\u0254n
  s\u025b: \u201cMomfa mo adwene nsi nne\u025bma a \u025bw\u0254 soro so.\u201d (Kol.
  3:2) N\u00e1 ehia s\u025b w\u0254k\u0254 so de w\u0254n adwene si w\u0254n anidaso
  papa bi a wobenya w\u0254 soro no so. (Kol. 1:4, 5) Nokwas\u025bm ne s\u025b, Yehowa
  ahy\u025b ne nkur\u0254fo b\u0254 s\u025b obehyira w\u0254n. Onyankop\u0254n asomfo
  binom w\u0254 anidaso s\u025b w\u0254b\u025bk\u0254 soro, afoforo nso de\u025b,
  w\u0254n anidaso ne s\u025b w\u0254b\u025btena asase so. S\u025b wodwinnwen saa
  nhyira no ho a, \u025bboa w\u0254n ma w\u0254de w\u0254n ani si nkonimbo no so.\u20141
  Kor. 9:24.\\n3. Asiane ahorow b\u025bn na Paulo b\u0254\u0254 ne mf\u025bfo Kristofo
  k\u0254k\u0254 w\u0254 ho?\\n3 Asiane ahorow bi a ebetumi ama nkonimbo no ab\u0254
  Kristofo no, Paulo b\u0254\u0254 w\u0254n k\u0254k\u0254 w\u0254 \u025bno nso ho.
  Ebi ne s\u025b, \u0254kyer\u025bw asafo a \u025bw\u0254 Kolose no kaa atoro Kristofo
  bi ho as\u025bm kyer\u025b\u025b w\u0254n. N\u00e1 saa atorofo no mp\u025b s\u025b
  wobegye Kristo adi, na mmom na wosusuw s\u025b, s\u025b wodi Mose Mmara no so a
  \u025bnna wobenya Onyankop\u0254n anim dom. (Kol. 2:16-18) Paulo kaa asiane ahorow
  bi a \u025bda so w\u0254 h\u0254 de besi nn\u025b nso ho as\u025bm. \u0190no nso
  betumi ama nkonimbo no ab\u0254 y\u025bn. Nhw\u025bso bi ni. \u0186kyer\u025b\u025b
  s\u025bnea yebetumi ako atia ak\u0254nn\u0254 b\u0254ne, s\u025bnea yebesiesie ns\u025bmns\u025bm
  a \u025bs\u0254re w\u0254 y\u025bne y\u025bn nuanom Kristofo ntam, ne y\u025bn abusua
  mu ns\u025bnnennen. Afotu a Paulo de mae no so w\u0254 mfaso ma y\u025bn nn\u025b.
  \u0186d\u0254 a Paulo w\u0254 ma Kolosefo no nti na \u0254b\u0254\u0254 w\u0254n
  k\u0254k\u0254. Enti momma y\u025bnhw\u025b k\u0254k\u0254b\u0254 no bi w\u0254
  krataa a \u0254de k\u0254maa w\u0254n no mu.\\nMUNKUM AK\u0186NN\u0186 B\u0186NE\\n4.
  Ad\u025bn nti na ak\u0254nn\u0254 b\u0254ne betumi ama nkonimbo no ab\u0254 y\u025bn?\\n4
  Paulo kaee ne nuanom s\u025b w\u0254w\u0254 anidaso papa bi. Afei \u0254ka kyer\u025b\u025b
  w\u0254n s\u025b: \u201cMunkum mo nipadua akwaa a \u025bw\u0254 asase so no w\u0254
  aguamamm\u0254, afide, nna ho ak\u0254nn\u0254, nkate b\u0254ne, ne anibere a \u025by\u025b
  abosonsom ho.\u201d (Kol. 3:5) Ak\u0254nn\u0254 b\u0254ne mu betumi ay\u025b den
  paa, na ebetumi as\u025be y\u025bne Yehowa ntam na ama nne\u025bma pa a y\u025brehw\u025b
  kwan no nso ab\u0254 y\u025bn. Ak\u0254nn\u0254 b\u0254ne maa onua bi fii asafo
  no mu; akyiri yi \u0254san bae. \u0186kae s\u025b: \u201cAk\u0254nn\u0254 b\u0254ne
  no mu y\u025b\u025b den araa ma m\u2019ani baa me ho so no, na aka akyi dodo.\u201d\\n5.
  S\u025b y\u025bk\u0254 tebea bi a ebetumi ama y\u025bat\u0254 asiane mu a, y\u025bb\u025by\u025b
  d\u025bn ab\u0254 y\u025bn ho ban?\\n5 S\u025b y\u025bk\u0254 tebea bi mu, na ebetumi
  ama y\u025babu Yehowa mmara so a, \u025bs\u025b s\u025b y\u025bhw\u025b yiye paa.
  \u0190ho nhw\u025bso bi ni. S\u025b \u0254barima ne \u0254bea bi p\u025b s\u025b
  w\u0254ware a, \u025by\u025b papa s\u025b mfiase no ara w\u0254kyer\u025b baabi
  a \u025bs\u025b s\u025b w\u0254y\u025b nne\u025bma kodu. S\u025b wosi gyinae s\u025b
  obi beso ne y\u0254nko mu, w\u0254b\u025bfew w\u0254n ano, anaa w\u0254n nkutoo
  b\u025btew w\u0254n ho ak\u0254hy\u025b baabi a, ehia s\u025b w\u0254hw\u025b yiye.
  (Mmeb. 22:3) S\u025b Kristoni bi tu kwan s\u025b \u0254rek\u0254y\u025b adwuma a,
  \u025bno nso betumi ama wahyia \u0254bras\u025be ho s\u0254hw\u025b. Saa ara na
  s\u025b Kristoni barima ne \u0254bea bi y\u025b adwuma anaa Kristoni bea bi ne \u0254barima
  bi y\u025b adwuma a, \u025bno nso betumi ama wahyia \u0254bras\u025be ho s\u0254hw\u025b.
  (Mmeb. 2:10-12, 16) S\u025b wok\u0254 tebea bi a \u025bte saa mu a, da wo ho adi
  s\u025b woy\u025b Yehowa Dansefo, y\u025b nea \u025bfata, na kae s\u025b, s\u025b
  wode wo ho hyehy\u025b \u0254barima anaa \u0254bea bi a, ebetumi de \u0254haw k\u025bse
  aba. S\u025b nne\u025bma haw y\u025bn na y\u025bn abam bu nso a, ebetumi ay\u025b
  asiane k\u025bse ama y\u025bn. \u0190ba saa a, na y\u025bn ani agyina s\u025b yebenya
  obi a \u0254b\u025bma y\u025bahu s\u025b odwen y\u025bn ho. Y\u025bn ho betumi ayeraw
  y\u025bn araa ma obiara a \u0254b\u025bba ab\u025bkyekye y\u025bn wer\u025b no,
  yebegye no atom. S\u025b \u025bba s\u025b wok\u0254 tebea a \u025bte saa mu a, ny\u025b
  biribiara a \u025bb\u025bma nkonimbo no ab\u0254 wo. Mmom, k\u0254 Yehowa nky\u025bn
  na hwehw\u025b mmoa fi wo nuanom Kristofo h\u0254.\u2014Kenkan Dwom 34:18; Mmebus\u025bm
  13:20.\\n6. D\u025bn na \u025bs\u025b s\u025b y\u025bma \u025btena y\u025bn adwenem
  w\u0254 nne\u025bma a y\u025bde gyigye y\u025bn ani ho?\\n6 S\u025b yebetumi akum
  ak\u0254nn\u0254 b\u0254ne a \u025bw\u0254 y\u025bn mu a, gye s\u025b y\u025btwe
  y\u025bn ho fi anigyede a \u0254bras\u025be wom ho. \u0190nn\u025b, nnwumakuw a
  w\u0254y\u025b anigyede dodow no ara y\u025b w\u0254n ade te s\u025b tete Sodomfo
  ne Gomorafo no. (Yuda 7) Adwene a saa nnwumakuw no akannifo kura w\u0254 abrab\u0254
  ho no, \u025bno ara na w\u0254de y\u025b anigyede. W\u0254ma \u025by\u025b te s\u025b,
  s\u025b obi b\u0254 aguaman a, as\u025bm biara nni ho, na \u0254rentwa so aba b\u0254ne
  biara. \u0190ns\u025b s\u025b yegyaagyaa y\u025bn ho na yegye anigyede biara a w\u0254b\u025by\u025b
  tom. Ehia s\u025b y\u025bpaw anigyede a \u025bremma nkwa nkonimbo no mm\u0254 y\u025bn.\u2014Mmeb.
  4:23.\\n\u201cMONHY\u0190\u201d \u0186D\u0186 NE AYAMYE\\n7. \u0186haw b\u025bn
  na yebetumi ahyia w\u0254 Kristofo asafo no mu?\\n7 Y\u025bn nyinaa gye tom s\u025b
  \u025by\u025b nhyira s\u025b y\u025bw\u0254 Kristofo asafo no mu. Yesua Onyankop\u0254n
  As\u025bm no w\u0254 asafo nhyiam ase, y\u025bda \u0254d\u0254 adi kyer\u025b y\u025bn
  ho y\u025bn ho, na yeyi y\u025bn yam boa y\u025bn ho y\u025bn ho. Wei boa y\u025bn
  ma y\u025bde y\u025bn ani si nkonimbo no so. Nanso \u025bt\u0254 da a, mente me
  ho ase tumi de akasakasa ba asafo no mufo ntam. S\u025b y\u025banhw\u025b ansiesie
  \u0254haw a \u025bte saa a, \u025bny\u025b den koraa s\u025b y\u025bde afoforo ho
  ns\u025bm b\u025bhy\u025b y\u025bn mu.\u2014Kenkan 1 Petro 3:8, 9.\\n8, 9. (a) Suban
  b\u025bn na yenya a, \u025bb\u025bboa y\u025bn ama y\u025bn nsa aka nkonimbo no?
  (b) S\u025b y\u025bn nua Kristoni bi y\u025b biribi ma \u025bhaw y\u025bn a, d\u025bn
  na \u025bb\u025bboa ama asomdwoe ak\u0254 so atena y\u025bn ntam?\\n8 D\u025bn na
  y\u025bb\u025by\u025b na y\u025bamfa afoforo ho ns\u025bm anhy\u025b y\u025bn mu
  na nkonimbo no amm\u0254 y\u025bn? Paulo ka kyer\u025b\u025b Kolosefo no s\u025b:
  \u201cS\u025b\u0301 nnipa a Onyankop\u0254n apaw mo, akronkronfo ne ad\u0254fo no,
  monhy\u025b ayamhyehye, ayamye, ahobr\u025base adwene, odwo, ne abodwoky\u025bre.
  S\u025b obi w\u0254 as\u025bm tia ne y\u0254nko a, monk\u0254 so nnya mo ho abotare
  na momfa mfirifiri mo ho korakora. S\u025bnea Yehowa de afiri mo no, mo nso mony\u025b
  saa ara. Na eyinom nyinaa akyi no, monhy\u025b \u0254d\u0254 efis\u025b \u025by\u025b
  koroy\u025b hama a \u025by\u025b p\u025b.\u201d\u2014Kol. 3:12-14.\\n9 S\u025b y\u025bw\u0254
  \u0254d\u0254 ne ayamye a, ebetumi aboa y\u025bn ama y\u025bde afoforo b\u0254ne
  aky\u025b w\u0254n. \u0190ho nhw\u025bso ni. S\u025b y\u025bn nua Kristoni bi ka
  as\u025bm anaa \u0254y\u025b biribi ma \u025by\u025b y\u025bn yaw a, y\u025bn nso
  y\u025bnkaakae y\u025bn tirim na yebehu s\u025b bere bi y\u025bkaa as\u025bm anaa
  y\u025by\u025b\u025b biribi ma \u025bhaw obi. Bere a y\u025bn nuanom mmarima ne
  mmea yii w\u0254n yam de y\u025bn mfomso ky\u025b\u025b y\u025bn saa no, y\u025bn
  ani annye anaa? (Kenkan \u0186s\u025bnkafo 7:21, 22.) \u0190y\u025b y\u025bn d\u025b
  paa s\u025b Kristo ayi ne yam aka nokware asomfo abom ama baakoy\u025b w\u0254n
  y\u025bn mu. (Kol. 3:15) Onyankop\u0254n baako na y\u025bn nyinaa d\u0254 no, as\u025bmpa
  koro na y\u025bn nyinaa ka, na \u0254haw a yehyia no pii y\u025b ade koro. S\u025b
  yeyi y\u025bn yam da \u0254d\u0254 adi de b\u0254ne kyeky\u025b y\u025bn ho a, y\u025bboa
  ma baakoy\u025b tena Kristofo asafo no mu, na \u025bma y\u025bk\u0254 so de y\u025bn
  ani si nkwa nkonimbo no so.\\n10, 11. (a) Ad\u025bn nti na anibere anaa aho\u0254yaw
  y\u025b hu? (b) D\u025bn na y\u025bb\u025by\u025b na anibere anaa aho\u0254yaw amma
  nkonimbo no amm\u0254 y\u025bn?\\n10 Bible b\u0254 y\u025bn k\u0254k\u0254 s\u025b
  anibere anaa aho\u0254yaw y\u025b hu, na ebetumi ama nkonimbo no ab\u0254 y\u025bn.
  Nhw\u025bso bi ni. Kain ani beree ne nua Habel ma okum no. Kora, Datan, ne Abiram
  ani beree Mose ma w\u0254s\u0254re tiaa no. Afei nso, bere a na nne\u025bma rek\u0254
  yiye ma Dawid no, \u0186hene Saul ani beree no; anka \u0254rep\u025b no akum no.
  Enti \u025bny\u025b nwonwa s\u025b Onyankop\u0254n As\u025bm ka s\u025b: \u201cBaabi
  a aho\u0254yaw ne mansotwe w\u0254 no, \u025bh\u0254 na sakasaka ne akyide biara
  w\u0254.\u201d\u2014Yak. 3:16.\\n11 S\u025b yeyi y\u025bn yam d\u0254 afoforo a,
  \u025bb\u025by\u025b den s\u025b y\u025bn ani b\u025bbere w\u0254n. Onyankop\u0254n
  As\u025bm ka s\u025b: \u201c\u0186d\u0254 w\u0254 abodwoky\u025bre na ne yam ye.
  \u0186d\u0254 ny\u025b aho\u0254yaw.\u201d (1 Kor. 13:4) \u0190s\u025b s\u025b y\u025byere
  y\u025bn ho nya Onyankop\u0254n adwene na yebu y\u025bn nuanom mmarima ne mmea s\u025b
  nipa baako a y\u025bw\u0254 Kristofo asafo no mu. Y\u025by\u025b saa a, anibere
  rennye ntini w\u0254 y\u025bn koma mu. Wei b\u025bboa y\u025bn ama y\u025banya tema
  ama w\u0254n. Saa na Onyankop\u0254n As\u025bm tu y\u025bn fo s\u025b y\u025bny\u025b.
  Bible ka s\u025b: \u201cS\u025b w\u0254hy\u025b kwaa bi anuonyam a, akwaa a aka
  no nyinaa ne no di ahurusi.\u201d (1 Kor. 12:16-18, 26) Enti s\u025b obi nya hokwan
  bi a, y\u025bn ani remmere no, na mmom y\u025bn ani begye. Y\u025bnhw\u025b \u0186hene
  Saul ba Yonatan. Bere a Yehowa paw Dawid s\u025b \u0254no na obedi hene no, Yonatan
  ani ammere no. \u0186hy\u025b\u025b Dawid nkuran mmom. (1 Sam. 23:16-18) Yebetumi
  asuasua Yonatan na y\u025bayi y\u025bn yam ad\u0254 afoforo anaa?\\nNEA Y\u0190B\u0190Y\u0190
  AMA Y\u0190N ABUSUA ANYA NKONIMBO NO\\n12. Bible mu afotu b\u025bn na y\u025bn abusua
  de y\u025b adwuma a, \u025bb\u025bboa y\u025bn ama y\u025bn nsa aka nkonimbo no?\\n12
  S\u025b abusua bi de Bible nnyinasos\u025bm y\u025b adwuma a, wobenya asomdwoe na
  w\u0254n ani begye. Afei nso, \u025bb\u025bboa w\u0254n ama w\u0254anya nkonimbo
  no. Bible mu afotu b\u025bn na Paulo de maa mmusua bere a \u0254kyer\u025bw Kristofo
  a w\u0254w\u0254 Kolose no? \u0186kae s\u025b: \u201c\u0186yerenom, mommr\u025b
  mo ho ase mma mo kununom, s\u025bnea \u025bfata Awurade mu. Okununom, monk\u0254
  so nn\u0254 mo yerenom na mommma mo bo mmfuw w\u0254n denneennen. Mma, muntie mo
  awofo as\u025bm ade nyinaa mu, na eyi na \u025bs\u0254 ani Awurade mu. Agyanom,
  monnhy\u025b mo mma abufuw na w\u0254n abam ammu.\u201d (Kol. 3:18-21) Akyinnye
  biara nni ho s\u025b, wugye tom s\u025b \u025bnn\u025b mpo okununom, \u0254yerenom,
  ne mma de Paulo afotu a Onyankop\u0254n ma \u0254kyer\u025bwee no y\u025b adwuma
  a, \u025bb\u025bboa w\u0254n.\\n13. Kristoni bea b\u025by\u025b d\u025bn aboa ne
  kunu a \u0254ny\u025b Yehowa Dansefo ama wab\u025bsom Yehowa?\\n13 S\u025b woy\u025b
  \u0254bea warefo na wote nka s\u025b wo kunu a \u0254ny\u025b Yehowa Dansefo ne
  wo nni no yiye a, d\u025bn na wob\u025by\u025b? S\u025b wo ne no ham w\u0254 nea
  \u0254rey\u025b no ho a, \u025bb\u025bma nne\u025bma ak\u0254 yiye anaa? S\u025b
  mpo wutumi ma \u0254y\u025b nea wop\u025b ma wo a, \u025bb\u025bboa no ama waba
  nokware no mu? Ebia \u0254remma. Nanso s\u025b wubu wo kunu s\u025b \u0254no ne
  wo ti a, wubetumi aboa ama asomdwoe atena abusua no mu, wob\u025bhy\u025b Yehowa
  anuonyam, na ebi mpo a wubetumi aboa no ama waba nokware som mu. Wei betumi ama
  mo baanu nyinaa anya nkonimbo no.\u2014Kenkan 1 Petro 3:1, 2.\\n14. S\u025b Kristoni
  barima yere a \u0254ny\u025b Yehowa Dansefo mmu no a, d\u025bn na \u025bs\u025b
  s\u025b \u0254y\u025b?\\n14 S\u025b woy\u025b \u0254barima warefo na wote nka s\u025b
  wo yere a \u0254ny\u025b Yehowa Dansefo mmu wo a, d\u025bn na wob\u025by\u025b?
  S\u025b wop\u025b s\u025b wokyer\u025b no s\u025b wo na woy\u025b ne wura na wokekaw
  mu gu ne so a, \u025bno b\u025bma wabu wo anaa? Dabida! Wo na woy\u025b abusua ti,
  enti Onyankop\u0254n p\u025b s\u025b wod\u0254 wo yere; woy\u025b saa a, na woresuasua
  Yesu. (Efe. 5:23) Yesu y\u025b asafo no ti, na \u0254de \u0254d\u0254 ne abotare
  na edi asafo no so. (Luka 9:46-48) S\u025b okunu suasua Yesu a, obetumi anya ne
  yere ama waba nokware som mu.\\n15. D\u025bn na Kristoni barima b\u025by\u025b de
  akyer\u025b s\u025b \u0254d\u0254 ne yere?\\n15 Yehowa aka akyer\u025b okununom
  s\u025b: \u201cMonk\u0254 so nn\u0254 mo yerenom na mommma mo bo mmfuw w\u0254n
  denneennen.\u201d (Kol. 3:19) Okunu a \u0254d\u0254 ne yere di no ni; otie ne yere
  adwenkyer\u025b, na \u0254ma ne yere hu s\u025b, s\u025b \u0254kyer\u025b n\u2019adwene
  w\u0254 nne\u025bma ho a, \u025bboa no paa. (1 Pet. 3:7) S\u025b \u025bny\u025b
  nea ne yere b\u025bka biara na \u0254b\u025by\u025b bere nyinaa mpo a, s\u025b \u0254taa
  bisa n\u2019adwene w\u0254 nne\u025bma ho a, ebetumi aboa no ama wasisi gyinae a
  \u025bfata. (Mmeb. 15:22) Okunu a \u0254d\u0254 ne yere nhy\u025b no s\u025b ommu
  no, na mmom \u0254b\u0254 mm\u0254den s\u025b \u0254b\u025by\u025b nne\u025bma a
  \u025bb\u025bma ne yere abu no. S\u025b okunu d\u0254 ne yere ne ne mma a, \u025breny\u025b
  den s\u025b abusua no nyinaa de anigye b\u025bsom Yehowa na w\u0254anya nkwa nkonimbo
  no.\\nMMABUN\u2014MOMMMA BIRIBIARA MMMA NKONIMBO NO MMM\u0186 MO!\\n16, 17. Woy\u025b
  aberante anaa ababaa a, d\u025bn na wob\u025by\u025b na wo bo amfuw w\u2019awofo
  denneennen?\\n16 Woy\u025b aberante anaa ababaa? Wote nka s\u025b w\u2019awofo a
  w\u0254y\u025b Kristofo nte wo ase na w\u0254hy\u025b wo so dodo? Anhw\u025b a wo
  bo betumi afuw araa ma woanya adwene mpo s\u025b gyama wugyae Yehowa som a wo ho
  b\u025bt\u0254 wo. Nanso s\u025b abufuw nti wugyae Yehowa som a, \u025brenky\u025b
  wubehu s\u025b obiara nni h\u0254 a odwen wo ho paa sen w\u2019awofo a wosuro Onyankop\u0254n
  ne w\u2019asafo mufo.\\n17 Fa no s\u025b w\u2019awofo nte\u025b\u025b wo so da;
  wob\u025by\u025b d\u025bn ahu s\u025b wodwen wo ho ankasa? (Heb. 12:8) Ebia \u0254kwan
  a w\u2019awofo fa so te\u025b wo so no na \u025bhaw wo. Nanso mfa w\u2019adwene
  nsi \u025bno so, na mmom b\u0254 mm\u0254den s\u025b wubehu nea enti a w\u0254te\u025b
  wo so no. Enti nya abotare, mma wo bo mfuw denneennen s\u025b w\u0254aka w\u2019anim.
  Onyankop\u0254n As\u025bm ka s\u025b: \u201cNea \u0254kora n\u2019ano no w\u0254
  nimde\u025b, na nhumufo honhom dwo.\u201d (Mmeb. 17:27) Fa y\u025b wo botae s\u025b
  wo ho b\u025bkokwaw na woay\u025b komm atie afotu. \u0190ns\u025b s\u025b woma \u0254kwan
  a w\u2019awofo fa so tu wo fo no haw wo pii, na mmom sua biribi fi mu. (Mmeb. 1:8)
  S\u025b wow\u0254 awofo a w\u0254d\u0254 Yehowa paa a, \u025bnde na woanya nhyira.
  \u0190da w\u0254n koma so s\u025b w\u0254b\u025bboa wo ama woanya nkwa nkonimbo
  no.\\n18. Ad\u025bn nti na woasi wo bo s\u025b wode w\u2019ani besi nkonimbo no
  so?\\n18 S\u025b nkwa a owu nnim na yebenya w\u0254 soro oo, s\u025b daa nkwa na
  yebenya w\u0254 asase so paradise oo, nkonimbo a \u025bda y\u025bn anim no, \u025bsom
  bo paa, enti \u025bs\u025b s\u025b yegye bere dwinnwen ho. Y\u025bn anidaso no b\u025bbam
  \u0254kwan biara so, efis\u025b \u0186b\u0254ade\u025b no ankasa na wahy\u025b y\u025bn
  b\u0254. Onyankop\u0254n aka asase so Paradise no ho as\u025bm s\u025b: \u201cYehowa
  ho nimde\u025b b\u025bhy\u025b asase so m\u00e3.\u201d (Yes. 11:9) Saa bere no,
  Onyankop\u0254n b\u025bkyer\u025bkyer\u025b obiara a \u0254w\u0254 asase so. \u0190fata
  paa s\u025b y\u025byere y\u025bn ho ma y\u025bn nsa ka saa nkonimbo no. Enti fa
  w\u2019adwene si \u025bb\u0254 a Yehowa ahy\u025b no so, na mma biribiara mmma nkonimbo
  no mmm\u0254 wo!\"", "\"Nnipa dodow no ara kasa tia awares\u025be, nanso awares\u025be
  da so ara di mmusua pii nya.\\nD\u025bn ne awares\u025be?\\nNEA NKUR\u0186FO KA\\nAman
  bi so no, s\u025b obi fi ne hokafo akyi a, w\u0254mfa no as\u025bm biara. Na mmarima
  mpo de\u025b, w\u0254kyer\u025b s\u025b w\u0254w\u0254 hokwan s\u025b w\u0254y\u025b
  saa. Ebinom nso afa aware\u025b s\u025b kuw bi a w\u0254b\u025btumi ad\u0254m nn\u025b,
  \u0254kyena na w\u0254afi mu.\\nNEA BIBLE KA\\nBible ka awares\u025be a, nea \u025bkyer\u025b
  ne s\u025b \u0254barima anaa \u0254baa b\u025bfi ne hokafo akyi ne obi foforo ada.
  (Hiob 24:15; Mmebus\u025bm 30:20) Onyankop\u0254n kyi awares\u025be k\u0254k\u0254\u0254k\u0254.
  Tete Israel no, s\u025b obi s\u025be aware\u025b a, na \u0254de ne nkwa twa so.
  (Leviticus 18:20, 22, 29) Yesu kyer\u025bkyer\u025b\u025b n\u2019akyidifo s\u025b
  w\u0254ntwe w\u0254n ho mfi awares\u025be ho.\u2014Mateo 5:27, 28; Luka 18:18-20.\\nNEA
  ENTI A \u0190HO HIA\\nObi s\u025be aware\u025b a, na was\u025be apam a \u0254ne
  ne hokafo ay\u025b. \u0190y\u025b \u2018b\u0254ne a \u025btia Onyankop\u0254n\u2019
  nso. (Genesis 39:7-9) Awares\u025be tumi tete awofo ne w\u0254n mma ntam yayaaya.
  Aniberes\u025bm a \u025bwom koraa ne s\u025b, Bible ka s\u025b \u2018Onyankop\u0254n
  b\u025bbu awares\u025befo\u0254 at\u025bn.\u2019\u2014Hebrifo\u0254 13:4.\\n\u201cMomma
  aware\u025b ho mmra nyam, na monngu aware\u025b mpa ho f\u0129.\u201d\u2014Hebrifo\u0254
  13:4.\\nAwares\u025be b\u025btumi agu aware\u025b koraa?\\nNEA BIBLE KA\\nS\u025b
  \u0254barima anaa \u0254baa fi ne hokafo akyi a, Bible ma kwan s\u025b nea as\u025bm
  nni ne ho no b\u025btumi agyae aware\u025b. (Mateo 19:9) \u0186p\u025b nso a \u0254b\u025bk\u0254
  so ne no atena; \u025by\u025b \u0254no ara gyinaesi.\u2014Galatifo\u0254 6:5.\\nNanso
  \u025bs\u025b s\u025b y\u025bkae s\u025b Onyankop\u0254n bu aware\u025b s\u025b
  ade kronkron a \u025bs\u025b s\u025b \u025btena h\u0254 afeb\u0254\u0254. (1 Korintofo\u0254
  7:39) Enti obi rentumi nnyina as\u025bm a \u025bny\u025b as\u025bm biara so nnyaa
  aware\u025b. S\u025b n\u2019ani nnye ne hokafo ho mpo a, \u0254rentumi nka s\u025b
  \u0254regyaa no. Onyankop\u0254n kyi biribi a \u025bte saa koraa. Enti worentumi
  ns\u0254re k\u025bk\u025b nka s\u025b woregyae aware\u025b.\u2014Malaki 2:16; Mateo
  19:3-6.\\n\u201cMese mo s\u025b, s\u025b \u025bny\u025b adwamamm\u0254 nti na obi
  gyaa ne yere a, \u025bb\u025btumi ama \u0254baa no as\u025be aware\u025b.\u201d\u2014Mateo
  5:32.\\nS\u025b obi s\u025be aware\u025b a Onyankop\u0254n remfa nky\u025b no koraa
  anaa?\\nNEA BIBLE KA\\nDabi. Bible ka s\u025b, s\u025b obi y\u025b b\u0254ne na
  \u0254nnu ne ho a Onyankop\u0254n de b\u025bky\u025b no. Saa ara na s\u025b awares\u025befo\u0254
  nu w\u0254n ho a, \u0254de b\u025bky\u025b w\u0254n. (Asomafo\u0254 Nnwuma 3:19;
  Galatifo\u0254 5:19-21) Nokwas\u025bm ni, Bible ma y\u025bhu s\u025b mmarima ne
  mmaa bi w\u0254 h\u0254 a kan no na w\u0254y\u025b awares\u025befo\u0254, nanso
  w\u0254gyaee na w\u0254b\u025by\u025b\u025b Onyankop\u0254n nnamfo mpo.\u20141 Korintofo\u0254
  6:9-11.\\nTete Israel hene Dawid faa ne sraani bi yere, nanso Onyankop\u0254n huu
  no mm\u0254b\u0254. (2 Samuel 11:2-4) Bible kaa pefee s\u025b \u2018ade\u025b a
  Dawid y\u025be\u025b no ans\u0254 Onyankop\u0254n ani.\u2019 (2 Samuel 11:27) Onyankop\u0254n
  kaa Dawid anim na \u0254no nso gyee ne mfomso toom, enti \u0254de ky\u025b\u025b
  no. Nanso Dawid amfa ne ho anni korakora; \u0254twaa ne b\u0254ne no so aba. (2
  Samuel 12:13, 14) Akyiri yi, \u0186hene Solomon kaa s\u025b \u2018obiara a \u0254s\u025be
  aware\u025b no nni ti.\u2019\u2014Mmebus\u025bm 6:32.\\nNEA WOB\u0190TUMI AY\u0190\\nS\u025b
  woas\u025be aware\u025b a, \u025bs\u025b s\u025b wosr\u025b Onyankop\u0254n h\u0254
  b\u0254ne fafiri na wopa wo hokafo ky\u025bw. (Dwom 51:1-5) Onyankop\u0254n kyi
  awares\u025be, enti \u025bns\u025b s\u025b wode di agor\u0254 koraa. (Dwom 97:10)
  \u0190nne\u025b, si wo bo s\u025b worenhw\u025b ponografi na worennwennwene aguamans\u025bm
  ho. Afei mfi wo kunu anaa wo yere akyi mfa wo ho nhyehy\u025b \u0254barima anaa
  \u0254baa foforo. B\u0254 mm\u0254den s\u025b wob\u025bkwati biribiara a \u025bb\u025bma
  woakyer\u025b obi a \u0254ny\u025b wo hokafo ho anigye.\u2014Mateo 5:27, 28; Yakobo
  1:14, 15.\\nS\u025b wo kunu anaa wo yere as\u025be aware\u025b a, ka wo koma to
  wo yam, efis\u025b Onyankop\u0254n nim nea worefam. (Malaki 2:13, 14) Dan w\u2019adesoa
  to ne so; \u0254b\u025bkyekye wo wer\u025b, na \u201c\u0254b\u025bs\u0254 wo mu.\u201d
  (Dwom 55:22) S\u025b wop\u025b s\u025b wode wo kunu anaa wo yere b\u0254ne ky\u025b
  no na mok\u0254 so ware a, \u025bs\u025b s\u025b moy\u025b nea mob\u025btumi nyinaa
  ma aware\u025b no gyina.\u2014Efesofo\u0254 4:32.\\nBere a Dawid y\u025b\u025b b\u0254ne
  na \u0254nuu ne ho no, odiyifo Natan ka kyer\u025b\u025b no s\u025b, \u201cYehowa
  nso de wo b\u0254ne aky\u025b wo.\u201d\u20142 Samuel 12:13.\"", "\"1Proto\u017e
  nem\u016f\u017ee\u0161 se vymluviti, \u00f3 \u010dlov\u011b\u010de ka\u017ed\u00fd,
  potupuje jin\u00e9ho. Nebo t\u00edm, \u017ee jin\u00e9ho potupuje\u0161, s\u00e1m
  sebe odsuzuje\u0161, pon\u011bvad\u017e tot\u00e9\u017e \u010din\u00ed\u0161, co\u017e
  na jin\u00e9m tup\u00ed\u0161. 2V\u00edmet'' zajist\u00e9, \u017ee soud Bo\u017e\u00ed
  jest podle pravdy proti t\u011bm, kte\u0159\u00ed\u017e takov\u00e9 v\u011bci \u010din\u00ed.
  3Zdali se domn\u00edv\u00e1\u0161, \u00f3 \u010dlov\u011b\u010de, jen\u017e soud\u00ed\u0161
  ty, kdo\u017e takov\u00e9 v\u011bci \u010din\u00ed, a s\u00e1m tot\u00e9\u017e \u010din\u011b,
  \u017ee ty ujde\u0161 soudu Bo\u017e\u00edho? 4\u00c8ili bohatstv\u00edm dobrotivosti
  jeho a sn\u00e1\u0161elivosti i dlouho\u010dek\u00e1n\u00ed pohrd\u00e1\u0161, nev\u011bda,
  \u017ee dobrotivost Bo\u017e\u00ed ku pok\u00e1n\u00ed tebe vede? 5Ale podle tvrdosti
  sv\u00e9 a srdce nekaj\u00edc\u00edho shroma\u017e\u010fuje\u0161 sob\u011b hn\u011bv
  ke dni hn\u011bvu a zjeven\u00ed spravedliv\u00e9ho soudu Bo\u017e\u00edho, 6Kter\u00fd\u017e
  odplat\u00ed jednomu ka\u017ed\u00e9mu podle skutk\u016f jeho, 7T\u011bm zajist\u00e9,
  kte\u0159\u00ed\u017e trvaj\u00edce v dobr\u00e9m skutku, sl\u00e1vy a cti a nesmrtelnosti
  hledaj\u00ed, \u017eivotem v\u011b\u010dn\u00fdm, 8T\u011bm pak, kte\u0159\u00ed\u017e
  jsou sv\u00e1rliv\u00ed a pravd\u011b nepovoluj\u00ed, ale povoluj\u00ed nepravosti,
  prchlivost\u00ed a hn\u011bvem, 9Tr\u00e1pen\u00edm a \u00fazkost\u00ed, a to ka\u017ed\u00e9
  du\u0161i \u010dlov\u011bka \u010din\u00edc\u00edho zl\u00e9, i \u017dida p\u0159edn\u011b,
  a t\u00e9\u017e i \u0158eka. 10Ale sl\u00e1vu a \u010dest a pokoj d\u00e1 ka\u017ed\u00e9mu,
  kdo\u017e \u010din\u00ed dobr\u00e9, i \u017didu p\u0159edn\u011b, a t\u00e9\u017e
  i \u0158eku. 11Nebot'' nen\u00ed p\u0159ij\u00edm\u00e1n\u00ed osob u Boha. 12Kte\u0159\u00ed\u017ekoli
  zajist\u00e9 bez Z\u00e1kona h\u0159e\u0161ili, bez Z\u00e1kona i zahynou; a kte\u0159\u00ed\u017ekoli
  pod Z\u00e1konem byv\u0161e h\u0159e\u0161ili, skrze Z\u00e1kon odsouzeni budou,
  13(Nebo ne ti, jen\u017e sly\u0161\u00ed Z\u00e1kon, spravedlivi jsou p\u0159ed
  Bohem, ale \u010dinitel\u00e9 Z\u00e1kona spravedlivi budou. 14Nebo kdy\u017e pohan\u00e9
  Z\u00e1kona nemaj\u00edce, od p\u0159irozen\u00ed \u010din\u00ed to, co\u017e p\u0159ikazuje
  Z\u00e1kon, takov\u00ed Z\u00e1kona nemaj\u00edce, sami sob\u011b z\u00e1konem jsou,
  15Kte\u0159\u00ed\u017eto ukazuj\u00ed d\u00edlo Z\u00e1kona napsan\u00e9 na srdc\u00edch
