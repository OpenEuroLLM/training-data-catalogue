  so na \u0254hene bi bedi hene, na asafohene nso, atemmu so na wobedi asafohene.\u201d
  (Yesaia 32:1) Yiw, Yehowa hw\u025b kwan s\u025b mpanyimfo b\u025bsom at\u025bntrenee
  so. \u0186kwan b\u025bn so na wobetumi ay\u025b eyi?\\n17 Saa honhom fam mmarima
  a w\u0254fata yi nim yiye s\u025b at\u025bntrenee, anaa trenee hwehw\u025b s\u025b
  w\u0254ma asafo no ho tew. \u0190t\u0254 mmere bi a w\u0254hwehw\u025b s\u025b mpanyimfo
