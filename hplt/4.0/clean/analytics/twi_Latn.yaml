  toaa so ka kyer\u025b\u025b Mose s\u025b: \u201cMene Yehowa.+\\n3 Miyii me ho adi
  kyer\u025b\u025b Abraham,+ Isak,+ ne Yakob+ s\u025b ade nyinaa so Tumfo\u0254 Nyankop\u0254n,+
  nanso me din Yehowa+ no de, mamma w\u0254amfa anhu me.+\\n4 Na me ne w\u0254n y\u025b\u025b
  apam s\u025b mede Kanaan asase a w\u0254k\u0254so\u025b\u025b so s\u025b ah\u0254ho
  no b\u025bma w\u0254n.+\\n5 Afei mate Israelfo no apinisi,+ nkoasom a Egyptfo de
  w\u0254n aba mu no, na m\u2019apam+ no, mekae.\\n6 \u201cEnti ka kyer\u025b Israelfo
  no s\u025b, \u2018Mene Yehowa, na meyi mo afi Egyptfo nnesoa ase na magye mo afi
  w\u0254n nkoasom mu;+ mede basa a emu ate\u025b ne atemmu k\u025bse na ebegye mo.+\\n7
  Na mede mo b\u025by\u025b me man,+ na may\u025b mo Nyankop\u0254n;+ na mubehu s\u025b
  mene Yehowa mo Nyankop\u0254n a oyii mo fii Egypt nkoasom mu+ no.\\n8 Mede mo b\u025bba
  asase a memaa me nsa so kaa ntam+ s\u025b mede b\u025bma Abraham, Isak, ne Yakob
  no so; na mede b\u025bma mo s\u025b agyapade.+ Mene Yehowa.\u2019\u201d+\\n9 Afei
  Mose de ns\u025bm yi nyinaa too Israelfo no anim, nanso abasamtu ne nkoasom dennen
  no nti, w\u0254antie Mose.+\\n10 \u0190nna Yehowa ka kyer\u025b\u025b Mose s\u025b:\\n11
  \u201cK\u0254ka kyer\u025b Egypt hene Farao+ s\u025b \u0254mma Israelfo no kwan
  mma womfi n\u2019asase so nk\u0254.\u201d+\\n12 Nanso Mose ka kyer\u025b\u025b Yehowa
  s\u025b: \u201cHw\u025b, Israelfo no mpo antie me,+ na \u025bb\u025by\u025b d\u025bn
  na Farao atie me+ a wontwaa m\u2019ano twetia+ yi?\u201d\\n13 Na Yehowa ka kyer\u025b\u025b
  Mose ne Aaron s\u025b w\u0254mfa n\u2019ahy\u025bde nk\u0254to Israelfo no ne Egypt
  hene Farao anim, na wonyi Israelfo no mfi Egypt asase so.+\\n14 Eyinom ne atitiriw
  a w\u0254w\u0254 w\u0254n agyanom fie: Israel ba panyin+ Ruben mma ne Hanok, Palu,
  Hesron, ne Karmi.+ Eyinom ne Ruben asefo.+\\n15 Na Simeon mma ne Yemuel, Yamin,
  Ohad, Yakin, Sohar, ne Saul a \u0254ne Kanaanni bea woo no+ no. Eyinom ne Simeon
  asefo.+\\n16 Lewi+ mma din s\u025bnea w\u0254n mmusua te+ ni: Gerson, Kohat, ne
  Merari.+ Na mfe a Lewi dii nyinaa y\u025b \u0254ha aduasa ason.\\n17 Gerson mma
  ne Libni ne Simei,+ s\u025bnea w\u0254n mmusua+ te.\\n18 Kohat mma ne Amram, Yisar,
