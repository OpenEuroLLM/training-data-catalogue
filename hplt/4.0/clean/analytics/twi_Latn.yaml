  s\u025b w\u0254b\u025bboa \u0254deb\u0254ney\u025bfo no ma wanya adwensakra. Nanso,
  mm\u0254den a \u025bte saa a w\u0254b\u0254 s\u025b w\u0254b\u025bboa nyinaa akyi
  no, s\u025b \u0254deb\u0254ney\u025bfo no ankyer\u025b nokware ahonu a, d\u025bn
  na w\u0254b\u025by\u025b? W\u0254 at\u025bntrenee a \u025by\u025b p\u025b mu no,
  Yehowa As\u025bm kyer\u025b s\u025b wonsi gyinae pintinn: \u201cMunyi \u0254b\u0254nefo
  no mfi mo mu!\u201d \u0190no kyer\u025b yi a wobeyi no afi asafo no mu. (1 Korintofo
  5:\\n18. S\u025b mpanyimfo de Bible mu afotu rema afoforo a, d\u025bn na \u025bs\u025b
  s\u025b w\u0254ma \u025btra w\u0254n adwenem?\\n18 At\u025bntrenee mu a w\u0254som
  nso kyer\u025b Bible mu afotu a w\u0254de ma w\u0254 bere a \u025bho hia mu. Nokwarem
  no, mpanyimfo nhwehw\u025b afoforo ho mfomso. Na saa ara nso na \u025bny\u025b biribiara
  ho na w\u0254de afotu ma bere nyinaa. Nanso, y\u0254nko gyidini betumi \u2018adi
  mfomso bi ansa na n\u2019ani aba ne ho so.\u2019 Bere a mpanyimfo kae s\u025b Onyankop\u0254n
  at\u025bntrenee ny\u025b atirim\u0254den anaa nea enni tema no, \u025bb\u025bka
  w\u0254n ma \u2018w\u0254ate\u025b nea \u0254te saa no so w\u0254 odwo honhom mu.\u2019
  (Galatifo 6:1) Enti, mpanyimfo ntwiw obi a wadi mfomso anim anaas\u025b w\u0254renka
  ns\u025bm a \u025by\u025b yaw nkyer\u025b no. Mmom no, afotu a wofi \u0254d\u0254
  mu de ma no hy\u025b nea w\u0254de rema no no nkuran. Mpo s\u025b mpanyimfo de animka
  p\u0254tee rema\\n19. Gyinae b\u025bn na w\u0254ma mpanyimfo sisi, na d\u025bn so
  na \u025bs\u025b s\u025b w\u0254de w\u0254n gyinaesi ahorow gyina?\\n19 W\u0254taa
  ma mpanyimfo sisi gyinae a \u025bka w\u0254n mf\u025bfo gyidifo. S\u025b nhw\u025bso
  no, mpanyimfo hyiam bere ne bere mu susuw ho s\u025b ebia anuanom foforo a w\u0254w\u0254
  asafo no mu fata s\u025b w\u0254kamfo w\u0254n kyer\u025b s\u025b mpanyimfo anaa
  asafo mu asomfo anaa. Mpanyimfo no nim hia a \u025bho hia s\u025b w\u0254nhw\u025b
  nnipa anim. W\u0254ma Onyankop\u0254n ahwehw\u025bde a \u025bfa paw a w\u0254paw
  afoforo saa ho no kyer\u025b w\u0254n kwan w\u0254 w\u0254n gyinaesi mu, w\u0254mma
  w\u0254n nkate nni w\u0254n so. Enti wosisi gyinae a \u2018w\u0254mpere ho mmu at\u025bn,
  na w\u0254ny\u025b biribiara nyiyim so.\u2019\\n20, 21. (a) Mpanyimfo b\u0254 mm\u0254den
  s\u025b w\u0254b\u025by\u025b s\u025b d\u025bn, na d\u025bn ntia? (b) D\u025bn na
  mpanyimfo betumi ay\u025b de aboa \u201cw\u0254n a w\u0254n koma atu\u201d no?\\n20
  Mpanyimfo de Onyankop\u0254n at\u025bntrenee di dwuma w\u0254 akwan foforo so nso.
  Bere a Yesaia ka siei s\u025b mpanyimfo b\u025bsom w\u0254 \u2018at\u025bntrenee
  mu\u2019 wiei no, \u0254toaa so s\u025b: \u201cW\u0254n mu biara b\u025by\u025b
  s\u025b mframa ano hintabea ne osu ano guank\u0254bea, s\u025b nkyerekyerewa so
  nsuwansuwa, s\u025b asase a akyen so botan k\u025bse onwini.\u201d (Yesaia 32:2)
  \u0190nde, mpanyimfo, momm\u0254 mm\u0254den mma mo mf\u025bfo asomfo nnya awer\u025bkyekye
  ne abot\u0254yam.\\n21 \u0190nn\u025b a \u0254haw pii a \u025bma abasamtu w\u0254
  h\u0254 no, nnipa pii na wohia nkuranhy\u025b. Mpanyimfo, d\u025bn na mubetumi ay\u025b
  de aboa \u201cw\u0254n a w\u0254n koma atu\u201d no. (1 Tesalonikafo 5:\\nS\u025b
  mpanyimfo hy\u025b w\u0254n a w\u0254n abam abu nkuran a, na w\u0254reda Yehowa
  at\u025bntrenee adi\\n22. Akwan b\u025bn so na yebetumi asuasua Yehowa at\u025bntrenee,
  na d\u025bn na ebefi mu aba?\\n22 Nokwarem no, y\u025bnam Yehowa at\u025bntrenee
  a yesuasua no so b\u025bn no bere nyinaa! S\u025b yekura ne trenee gyinap\u025bn
  ahorow mu, ka as\u025bmpa a egye nkwa no kyer\u025b afoforo, na y\u025bhwehw\u025b
  nne\u025bma pa a \u025bw\u0254 afoforo ho sen s\u025b y\u025bde y\u025bn adwene
  besi w\u0254n mfomso ahorow so a, na y\u025breda Onyankop\u0254n at\u025bntrenee
  adi. Mpanyimfo, s\u025b mob\u0254 asafo no ahotew ho ban, mode Kyer\u025bwns\u025bm
  mu afotu a \u025bhy\u025b den ma, na musisi gyinae a animhw\u025b nnim, na mohy\u025b
  w\u0254n a w\u0254n abam abu nkuran a, na moreda Onyankop\u0254n at\u025bntrenee
  adi. Hw\u025b s\u025bnea \u025bb\u025by\u025b s\u025b Yehowa koma ani gye bere a
  ofi soro hw\u025b fam na ohu s\u025b ne nkur\u0254fo rey\u025b nea wobetumi biara
  de \u2018ada at\u025bntrenee adi\u2019 w\u0254 w\u0254ne Onyankop\u0254n nantew
  mu no!\\n^ nky. 13 Nkyer\u025base bi ka s\u025b \u201cmummmu nt\u025bn\u201d na
  \u201cmummmu f\u0254.\u201d Nea \u025bkyer\u025b ne s\u025b \u2018mummfi ase mmmu
  nt\u025bn\u2019 na \u2018mummfi ase mmmu f\u0254.\u2019 Nanso w\u0254 mfitiase kasa
  mu no, Bible akyer\u025bwfo no de \u0254hy\u025b kabea (a \u025bkyer\u025b adey\u025b
  a \u025brek\u0254 so mprempren) a \u025bw\u0254 dabi kabea mu na edii dwuma w\u0254
  ha. Enti nney\u025be a w\u0254kaa ho as\u025bm no y\u025b nea na \u025brek\u0254
  so a na \u025bs\u025b s\u025b wogyae.\\n^ nky. 18 Bible ka w\u0254 2 Timoteo 4:2
  s\u025b, \u025bt\u0254 mmere bi a \u025bs\u025b s\u025b mpanyimfo \u201cyi nt\u025bn,
  ka anim, tu fo.\u201d Hela as\u025bmfua a w\u0254kyer\u025b\u025b ase \u201ctu fo\u201d
  (pa\u00b7ra\u00b7ka\u00b7le\u02b9o) no betumi akyer\u025b \u201chy\u025b nkuran.\u201d
  Hela as\u025bmfua bi a \u025bte s\u025b \u025bno, pa\u00b7ra\u02b9kle\u00b7tos,
  betumi akyer\u025b as\u025bnni mu okyigyinafo. Enti, s\u025b mpanyimfo de animka
  a emu y\u025b den mpo rema a, \u025bs\u025b s\u025b w\u0254y\u025b w\u0254n a wohia
  honhom fam mmoa no aboafo.\"", "\"1Eu, Paulo, escolhido por Deus como ap\u00f3stolo
  de Jesus Cristo, e o irm\u00e3o Tim\u00f3teo. 2Dirigimo-nos aos santos em Colossos,
  irm\u00e3os fi\u00e9is em Cristo, desejando-lhes a gra\u00e7a e a paz de Deus nosso
  Pai.\\nA\u00e7\u00e3o de gra\u00e7as e ora\u00e7\u00e3o\\n3Sempre que oramos por
  voc\u00eas, exprimimos a Deus, Pai de nosso Senhor Jesus Cristo, a nossa gratid\u00e3o.
  4Pois temos sabido da vossa f\u00e9 em Cristo Jesus e do vosso amor crist\u00e3o
  para com todos os irm\u00e3os crentes, 5por causa da esperan\u00e7a que vos est\u00e1
  reservado no c\u00e9u. Essa esperan\u00e7a brotou depois que ouviram a mensagem
  de verdade do evangelho. 6A qual tem sido espalhada por todo o mundo, dando frutos,
  tal como aconteceu no vosso meio, desde que ouviram e conheceram o verdadeiro significado
  da gra\u00e7a de Deus. 7\u00c9 o que vos pregou Epafras, nosso querido colaborador
  e um fiel di\u00e1cono de Cristo. 8Ele contou-nos todo o amor que o Esp\u00edrito
  vos tem inspirado.\\n9E por isso mesmo, n\u00f3s tamb\u00e9m, desde o dia em que
  ouvimos falar a vosso respeito, pela primeira vez, n\u00e3o temos cessado de orar
  por voc\u00eas e de pedir que tenham um conhecimento cada vez mais completo da vontade
  de Deus, atrav\u00e9s de uma clara compreens\u00e3o e sabedoria das coisas espirituais.
  10A fim de que a vossa conduta seja digna do Senhor, agradando-lhe em tudo, dando
  frutos, praticando toda a esp\u00e9cie de bons atos e crescendo no conhecimento
  de Deus. 11E sejam fortalecidos pelo seu poder glorioso, para poderem suportar tudo
  com paci\u00eancia e alegria. 12E saibam agradecer ao Pai, que nos fez dignos de
  participar da heran\u00e7a que reserva aos crentes que vivem na sua luz. 13Porque
  foi Deus quem nos livrou do imp\u00e9rio das trevas e nos transferiu para o reino
  do seu Filho amado; 14o qual pagou para n\u00f3s a reden\u00e7\u00e3o e o perd\u00e3o
  dos pecados.\\nA gl\u00f3ria de Cristo\\n15Cristo \u00e9 a imagem do Deus invis\u00edvel.
  Ele existe antes de Deus ter criado todas as coisas e \u00e9 a fonte de toda a cria\u00e7\u00e3o.
  16Na verdade, foi atrav\u00e9s dele que Deus criou tudo o que h\u00e1 nos c\u00e9us
  e sobre a Terra; tudo o que se v\u00ea e o que n\u00e3o se v\u00ea; at\u00e9 os
  governantes, as autoridades, os que t\u00eam o poder e a for\u00e7a. Tudo foi estabelecido
