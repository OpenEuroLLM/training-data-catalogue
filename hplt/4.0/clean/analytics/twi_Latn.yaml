  \u025bte\u025b s\u025b y\u025by\u025b nea yebetumi biara s\u025b y\u025bb\u025bboa
  afoforo ma w\u0254anya nkwagye. Susuw mfatoho a \u025bfa gye a wogye wo fi po so
  hy\u025bn a \u025bremem mu ho no ho bio. Bere a wote ahy\u025bmma a w\u0254de gye
  nkwa mu dwoodwoo no, akyinnye biara nni ho s\u025b wob\u025bp\u025b s\u025b woboa
  afoforo a w\u0254da so w\u0254 nsu no mu no. Saa ara na y\u025bw\u0254 as\u025by\u025bde
  w\u0254 w\u0254n a w\u0254da so repere wiase b\u0254ne yi \u201cnsu\u201d mu no
  ho. \u0190wom, bebree po y\u025bn as\u025bm no. Nanso, bere tenten a Yehowa k\u0254
  so da boaset\u0254 adi kyer\u025b w\u0254n no, y\u025bw\u0254 as\u025by\u025bde
  s\u025b y\u025bma wonya hokwan \u201cba adwensakra mu,\u201d na w\u0254nam so fata
  ma nkwagye.\\n11 S\u025b y\u025bka as\u025bmpa no kyer\u025b w\u0254n a yehyia w\u0254n
  nyinaa a, y\u025bda at\u025bntrenee adi w\u0254 \u0254kwan foforo a \u025bho hia
  so: Y\u025bny\u025b nyiyim. Kae s\u025b \u201cOnyankop\u0254n nhw\u025b onipa anim,
  na mmom \u0254man biara mu, nea osuro no na \u0254y\u025b ade trenee no, \u0254p\u025b
  no agye no.\u201d (Asomafo no Nnwuma 10:\\nS\u025bnea Y\u025bne Afoforo Di\\n12,
  13. (a) D\u025bn nti na \u025bns\u025b s\u025b y\u025bp\u025b nt\u025bm bu afoforo
  at\u025bn? (b) Yesu afotu a ese \u201cmummmu nt\u025bn\u201d ne \u201cmummmu f\u0254\u201d
  no kyer\u025b d\u025bn? (Hw\u025b ase h\u0254 as\u025bm no nso.)\\n12 Y\u025bnam
  s\u025bnea y\u025bne afoforo di s\u025bnea Yehowa ne y\u025bn di no so nso tumi
  da at\u025bntrenee adi. \u0190ny\u025b den koraa s\u025b yebebu afoforo at\u025bn,
  aka w\u0254n mfomso ahorow ho as\u025bm, na y\u025bakasa atia adwene a wokura anya
  ho adwemm\u0254ne. Nanso, y\u025bn mu hena na \u0254b\u025bp\u025b s\u025b Yehowa
  feefee ne nsusuwii ne ne sint\u0254 ahorow mu atirim\u0254den so? \u0190ny\u025b
  saa na Yehowa ne y\u025bn di. Odwontofo no kae s\u025b: \u201cYah, s\u025b wudi
  amum\u0254y\u025bde akyi a, [Yehowa, NW], hena na anka obegyina?\u201d (Dwom 130:3)
  So \u025bny\u025b y\u025bn anigye s\u025b y\u025bn Nyankop\u0254n a obu at\u025bntrenee
  na \u0254y\u025b mm\u0254borohunufo no mfa n\u2019adwene nsi y\u025bn mfomso ahorow
  so? (Dwom 103:\\n13 S\u025b y\u025bn ani s\u0254 mm\u0254borohunu a \u025bw\u0254
  Onyankop\u0254n at\u025bntrenee mu no a, y\u025bremp\u025b nt\u025bm mmu afoforo
  at\u025bn w\u0254 nne\u025bma a \u025bmfa y\u025bn ho ankasa anaas\u025b \u025bho
  nhia pii mu. W\u0254 Yesu Bep\u0254w so As\u025bnka no mu no, \u0254b\u0254\u0254
  k\u0254k\u0254 s\u025b: \u201cMummmu nt\u025bn, na w\u0254ammu mo nt\u025bn.\u201d
  (Mateo 7:1) S\u025bnea Luka kyer\u025bwtoh\u0254 no kyer\u025b no, Yesu de kaa ho
  s\u025b: \u201cMummmu f\u0254, na w\u0254ammu mo f\u0254.\u201d * (Luka 6:\\n14.
  D\u025bn nti na \u025bs\u025b s\u025b \u2018yegyae nt\u025bn a yegu so rebu afoforo
  no\u2019?\\n14 D\u025bn nti na \u025bs\u025b s\u025b \u2018yegyae nt\u025bn a yebu\u2019
  afoforo? Ade biako ne s\u025b, y\u025bn tumi sua. Osuani Yakobo kae y\u025bn s\u025b:
  \u201cObiako ne mmarahy\u025bfo ne temmufo\u201d\\n15. Ns\u025bm ne nney\u025be
  b\u025bn na enni af\u00e3 biara w\u0254 Onyankop\u0254n asomfo mu, na d\u025bn ntia?\\n15
  Na y\u025bn abusuafo nso \u025b? Awer\u025bhos\u025bm ne s\u025b, w\u0254 nn\u025b
  wiase no, nt\u025bn a enye koraa a wobu no biako y\u025b nea wobu w\u0254 beae a
  anka \u025bs\u025b s\u025b asomdwoe tra\\nMpanyimfo a \u2018W\u0254som At\u025bntrenee
  Mu\u2019\\n16, 17. (a) D\u025bn na Yehowa hwehw\u025b fi mpanyimfo no h\u0254? (b)
  S\u025b \u0254b\u0254nefo bi anna nokware ahonu adi a, d\u025bn na \u025bs\u025b
  s\u025b w\u0254y\u025b, na d\u025bn ntia?\\n16 Y\u025bn nyinaa w\u0254 as\u025by\u025bde
  s\u025b y\u025bda at\u025bntrenee adi, nanso mpanyimfo a w\u0254w\u0254 Kristofo
  asafo no mu w\u0254 as\u025by\u025bde titiriw w\u0254 eyi mu. Hy\u025b s\u025bnea
  w\u0254aka \u201casafohene,\u201d anaa mpanyimfo ho as\u025bm w\u0254 nk\u0254mhy\u025b
