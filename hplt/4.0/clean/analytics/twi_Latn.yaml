  Onyankop\u0254n hwehw\u025b s\u025b moy\u025b. Moasua afiri Mmara no mu ahunu de\u025b
  \u025by\u025b. 19Mofa mo ho s\u025b moy\u025b akwankyer\u025bfo\u0254 ma anifirafo\u0254,
