  ma mmara no na w\u0254b\u025bbu w\u0254n bem. 14Amanamanmufo\u0254 no nni mmara,
  nanso w\u0254firi w\u0254n awosu mu y\u025b de\u025b mmara no hwehw\u025b s\u025b
  w\u0254y\u025b a, \u025bwom s\u025b w\u0254nni mmara de\u025b, nanso yeinom b\u025by\u025b
  mmara ama w\u0254n. 15Esiane s\u025b w\u0254n abrab\u0254 kyer\u025b s\u025b, de\u025b
