  sebe neu\u010d\u00ed\u0161? Vyhla\u0161uje, \u017ee nem\u00e1 kradeno b\u00fdti,
  s\u00e1m krade\u0161? 22Prav\u011b: Nezcizolo\u017e\u00ed\u0161, a cizolo\u017estv\u00ed
  p\u00e1ch\u00e1\u0161? V ohavnosti maje modly, svatokr\u00e1de\u017ee se dopou\u0161t\u00ed\u0161?
  23Z\u00e1konem se chlub\u011b, p\u0159estupov\u00e1n\u00edm Z\u00e1kona Bohu ne\u00factu
  \u010din\u00ed\u0161? 24Nebo jm\u00e9no Bo\u017e\u00ed pro v\u00e1s v porouh\u00e1n\u00ed
  jest mezi pohany, jako\u017e ps\u00e1no jest. 25Ob\u0159ez\u00e1n\u00edt'' zajist\u00e9
  prosp\u011bje, bude\u0161-li Z\u00e1kon plniti; pakli bude\u0161 p\u0159estupitelem
  Z\u00e1kona, ob\u0159ez\u00e1n\u00ed tv\u00e9 u\u010din\u011bno jest neob\u0159ez\u00e1n\u00edm.
  26A proto\u017e jestli\u017eet'' by neob\u0159\u00edzka ost\u0159\u00edhala pr\u00e1v
  Z\u00e1kona, zdali\u017e nebude po\u010dtena neob\u0159\u00edzka jejich za ob\u0159\u00edzku?
  27A odsoud\u00ed ti, kte\u0159\u00ed\u017e jsou z p\u0159irozen\u00ed neob\u0159\u00edzka,
  zachov\u00e1vaj\u00edce Z\u00e1kon, tebe, kter\u00fd\u017e pod literou a ob\u0159\u00edzkou
  p\u0159estupn\u00edk jsi Z\u00e1kona? 28Nebo ne ten jest prav\u00fd \u017did, kter\u00fd\u017e
  jest zjevn\u011b \u017didem; ani\u017e to jest prav\u00e9 ob\u0159ez\u00e1n\u00ed,
  kter\u00e9\u017e b\u00fdv\u00e1 zjevn\u011b na t\u011ble; 29Ale ten jest prav\u00fd
  \u017did, kter\u00fd\u017eto vnit\u0159 jest \u017didem, a to jest prav\u00e9 ob\u0159ez\u00e1n\u00ed,
  kter\u00e9\u017e jest srde\u010dn\u00e9 v duchu, a ne podle litery; jeho\u017eto
  chv\u00e1la ne z lid\u00ed jest, ale z Boha.\\n1Mo a mobu afofor\u0254 at\u025bn
  no, monni anoyie biara. \u0190kwan biara a mob\u025bfa so abu afofor\u0254 at\u025bn
  no, \u025bnam saa \u025bkwan no ara so ma mode atemmuo ba mo ho so. \u0190firi s\u025b,
  b\u0254ne a \u025bma mobu afofor\u0254 at\u025bn no, mo nso moy\u025b saa b\u0254ne
  kor\u0254 no ara bi. 2Y\u025bnim s\u025b, s\u025b Onyankop\u0254n bu w\u0254n a
  w\u0254te saa ara no at\u025bn a, na ne kwan so ara ne no. 3Na wo, onipa, wobu afofor\u0254
  at\u025bn w\u0254 nne\u025bma kor\u0254 no ara a woy\u025b bi no ho a, wosusu s\u025b
  Onyankop\u0254n remmu wo at\u025bn anaa? 4Anaas\u025b, ebia, wommu n\u02bcayamy\u025b,
  n\u02bcabodwokyer\u025b ne ne boaset\u0254? Wonnim s\u025b Onyankop\u0254n y\u025b
  mm\u0254bor\u0254hunufo\u0254 a \u0254p\u025b s\u025b \u0254kyer\u025b wo kwan a
  wob\u025bfa so anu wo ho?\\n5Nanso, \u025bsiane w\u02bcakoma den ne akoma pirim
  enti, woboaboa abufuhye\u025b ano ma wo ho w\u0254 Onyankop\u0254n abufuhye\u025b
  da no, \u025bda no a \u0254b\u025bda n\u02bcat\u025bntenenee adi no. 6De\u025b obiara
  ay\u025b no, \u025bso akatua na Onyankop\u0254n b\u025bma no anya. 7W\u0254n a w\u0254de
  boaset\u0254 y\u025b papa de hwehw\u025b animuonyam, anidie ne de\u025b \u025bmpor\u0254
