  todo o mundo, e do qual eu, Paulo, me tornei di\u00e1cono.\\nO trabalho de Paulo
  pela igreja\\n24E esta \u00e9 a minha alegria: que esteja a sofrer por vossa causa.
  Estou assim a cumprir os sofrimentos que Cristo me disse para assumir pela causa
