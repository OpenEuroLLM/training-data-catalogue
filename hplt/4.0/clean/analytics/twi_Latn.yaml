  kter\u00e1\u017e se vespolek obvi\u0148uj\u00ed, anebo tak\u00e9 vymlouvaj\u00ed.)
  16V ten den, kdy\u017eto souditi bude B\u016fh tajn\u00e9 v\u011bci lidsk\u00e9,
  podle evangelium m\u00e9ho skrze Jezukrista. 17Aj, ty slove\u0161 \u017did, a spol\u00e9h\u00e1\u0161
  na Z\u00e1kon, a chlub\u00ed\u0161 se Bohem, 18A zn\u00e1\u0161 v\u016fli jeho,
  a rozezn\u00e1v\u00e1\u0161, co slu\u0161\u00ed neb neslu\u0161\u00ed, nau\u010den
  jsa z Z\u00e1kona, 19A za to m\u00e1\u0161, \u017ee jsi ty v\u016fdc\u00edm slep\u00fdch,
  sv\u011btlem t\u011bch, kte\u0159\u00ed\u017e jsou ve tm\u011b, 20\u0158editelem
