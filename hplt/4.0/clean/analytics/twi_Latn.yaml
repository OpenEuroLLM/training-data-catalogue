  no ka s\u025b mo enti, ewiasefo\u0254 kasa tia Onyankop\u0254n.\\n25S\u025b woy\u025b
  Yudani na wodi Onyankop\u0254n mmara no so a, \u025by\u025b ade\u025b a \u025bsom
  bo. Na s\u025b moanni so a, nsonsonoe\u025b biara nni mo ne momonotofo\u0254 ntam.
  26S\u025b momonotofo\u0254 di Onyankop\u0254n mmara so a, w\u0254remmu w\u0254n
  s\u025b Onyankop\u0254n nkur\u0254fo\u0254 anaa? 27Enti momonotoni a \u0254di mmara
  no so no b\u025bkasa atia mo, Yudafo\u0254 a monim Onyankop\u0254n mmara a w\u0254atwer\u025b
  no, nanso monni so no.\\n28Wo a w\u0254woo mo s\u025b Yudafo\u0254 anaas\u025b twa
  a w\u0254atwa mo twetia no nkyer\u025b s\u025b moy\u025b Yudafo\u0254 kann. 29Yudani
  kann no ne de\u025b \u0254y\u025b no w\u0254 n\u02bcakoma mu. Saa ara nso na twetiatwa
  y\u025b akoma mu nsakrae\u025b a \u025bfiri Onyankop\u0254n Honhom mu ba. Nsakrae\u025b
  yi mmfiri di a obi di mmara bi so. Na de\u025b w\u0254asakra no ay\u025byie mmfiri
  nnipa h\u0254, na mmom, \u025bfiri Onyankop\u0254n h\u0254.\"", "\"6 Yehowa ka kyer\u025b\u025b
  Mose s\u025b: \u201cAfei wubehu nea m\u025by\u025b Farao,+ efis\u025b nsa a \u025by\u025b
  den b\u025bhy\u025b no ma wama w\u0254n kwan ak\u0254, na nsa a \u025by\u025b den
