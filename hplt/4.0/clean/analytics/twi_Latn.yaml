  Mo nso mob\u0254 kor\u0254no anaa? 22Mo a moka s\u025b adwamamm\u0254 ny\u025b.
  Mo nso mob\u0254 adwaman anaa? Mo a moka s\u025b mokyiri ahoni no, mo nso mob\u0254
  kor\u0254no w\u0254 as\u0254refie mu anaa? 23Mode mmara no hoahoa mo ho, nanso mobu
