  p\u025bs\u025bmenkomenya, ne w\u0254n a w\u0254po nokor\u025b no k\u0254di b\u0254ne
  akyi no, abufuhye\u025b ne amanehunu b\u025bba w\u0254n so. 9Yudafo\u0254 ne amanamanmufo\u0254
  a w\u0254k\u0254 so y\u025b b\u0254ne no nyinaa b\u025bhunu amane na w\u0254n wer\u025b
  nso b\u025bho. 10Nanso, w\u0254n a w\u0254tie no no, s\u025b w\u0254y\u025b Yudafo\u0254
  anaa amanamanmufo\u0254 no, w\u0254b\u025bnya animuonyam, anidie ne asomdwoe\u025b
  afiri Onyankop\u0254n nky\u025bn. 11Onyankop\u0254n ny\u025b nyiyimu na \u0254ny\u025b
  animhw\u025b nso w\u0254 n\u02bcatemmuo mu.\\n12W\u0254n a w\u0254nnim mmara no
  na w\u0254y\u025b b\u0254ne no, w\u0254b\u025bkwati mmara no abu w\u0254n at\u025bn
  ara, na w\u0254n a w\u0254nim mmara no na w\u0254y\u025b b\u0254ne no, w\u0254nam
  mmara no so b\u025bbu w\u0254n at\u025bn. 13\u0190ny\u025b mmaratiefo\u0254 na w\u0254tene
