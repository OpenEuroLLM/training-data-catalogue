  so no mu w\u0254 New Patriotic Party din mu.\\nNe ho ns\u025bm[sesa]\\nDery y\u025b
  mmarinimfo a \u0254k\u0254\u0254 suap\u025bn a \u025bde University of Ghana w\u0254
  afe 1977 bre a owie ntoaso sukuu a \u025bde Navrongo Secondary School, na onyaa
  ab\u0254din krataa w\u0254 mmaranim mu a \u025bde (LL. B) na wofr\u025b\u025b no
