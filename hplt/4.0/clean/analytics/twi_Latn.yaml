  vama. 14Gdje vas ne prihvate i ne poslu\u0161aju \u0161to im govorite, otresite
  s nogu i pra\u0161inu iz toga mjesta kad budete odlazili. 15Zaista vam ka\u017eem,
  na Sudnji \u0107e dan Sodomi i Gomori biti lak\u0161e nego tomu mjestu!\\n\u010cekaju
  vas progonstva!\\n(Mk 13:9-13; Lk 12:11-12; 21:12-19)\\n16\u0160aljem vas, evo,
  kao ovce me\u0111u vukove. Stoga budite mudri kao zmije, a bezazleni kao golubovi.
  17\u010cuvajte se jer \u0107e vas predavati sudu i bi\u010devati po sinagogama.
  18Zbog mene \u0107e vas izvoditi pred vladare i kraljeve, da biste njima i poganima
  mogli posvjedo\u010diti o meni. 19Ne brinite se \u0161to \u0107ete govoriti kad
  vas predaju sudu jer \u0107e vam tada biti dano \u0161to da ka\u017eete. 20Ne\u0107ete
  govoriti vi\u2014kroz vas \u0107e govoriti Duh va\u0161ega nebeskog Oca.\\n21Brat
  \u0107e brata i otac dijete predavati na smrt. Djeca \u0107e se dizati protiv roditelja
  i predavati ih da ih ubiju. 22Svi \u0107e vas zamrziti zbog mene, ali tko ustraje
  do kraja, spasit \u0107e se. 23Kad vas po\u010dnu progoniti u jednom gradu, bje\u017eite
  u drugi! Ja, Sin \u010covje\u010dji, vratit \u0107u se prije nego \u0161to obi\u0111ete
  sve izraelske gradove.\\n24U\u010denik nije ve\u0107i od svojega u\u010ditelja,
  niti je sluga iznad svojega gospodara. 25Dosta je da u\u010denik dijeli u\u010diteljevu,
  a sluga gospodarovu sudbinu. Ako su dakle mene, doma\u0107ina, nazvali \u2018Beelzebulom\u2019,10:25
  Sotonom. koliko li \u0107e onda vi\u0161e vas, moje uku\u0107ane?\\nNe treba se
  pla\u0161iti\\n(Lk 12:2-9; Mk 8:38)\\n26Ali ne bojte se onih koji vam prijete. Jer
  dolazi vrijeme kad \u0107e sve \u0161to je skriveno biti otkriveno; sve \u0161to
  je tajno \u010dut \u0107e se pred svima. 27\u0160to vam sad govorim u tami, vi\u010dite
  po ulicama kad svane dan. \u0160to vam \u0161ap\u0107em na uho, vi\u010dite s krovova
  da svi \u010duju!\\n28Ne bojte se onih koji mogu ubiti samo tijelo, ali du\u0161u
  ne mogu! Bojte se Boga koji i du\u0161u i tijelo mo\u017ee uni\u0161titi u paklu.
  29Ne prodaju li se dva vrapca za nov\u010di\u0107, a ipak nijedan od njih ne padne
  na zemlju bez dopu\u0161tenja va\u0161ega Oca. 30A vama su izbrojene i vlasi na
  glavi. 31Stoga se ne bojte! Vi ste mu mnogo vredniji od mno\u0161tva vrabaca.\\n32Tko
  ovdje na zemlji pred ljudima prizna da pripada meni, za njega \u0107u ja, pred svojim
  Ocem na nebu, priznati da mu pripadam. 33Ali onoga koji mene zanije\u010de na zemlji
  odre\u0107i \u0107u se pred svojim Ocem na nebu.\\nKako bi ljudi trebali slu\u017eiti
  Isusu\\n(Lk 12:51-53; 14:26-27; 17:33; Mk 8:34-35; Iv 12:25)\\n34Nemojte misliti
  da sam na zemlju do\u0161ao donijeti mir! Nisam do\u0161ao donijeti mir, nego ma\u010d.
  35Do\u0161ao sam rastaviti:\\n\u2018sina od oca,\\nk\u0107erku od majke\\ni snahu
  od svekrve.\\n36\u010covjeku \u0107e neprijatelji biti vlastiti uku\u0107ani.\u201910:36
  Mihej 7:6\\n37Tko voli svojega oca ili svoju majku vi\u0161e nego mene, nije me
  dostojan. Tko voli sina ili k\u0107erku vi\u0161e nego mene, nije me dostojan. 38Tko
  ne uzme svoj kri\u017e i ne po\u0111e za mnom, nije me dostojan. 39Tko za sebe \u010duva
  svoj \u017eivot, izgubit \u0107e ga; a tko dade svoj \u017eivot za mene, na\u0107i
  \u0107e ga.\\nNagrade\\n(Mk 9:41; Lk 10:16; Iv 13:20)\\n40Tko prihvati vas, mene
  prihva\u0107a. A tko mene prihvati, prihva\u0107a Boga koji me je poslao. 41Tko
  prihvati proroka zato \u0161to je prorok, dobit \u0107e proro\u010dku pla\u0107u;
  tko prihvati pravednika zato \u0161to je pravednik, dobit \u0107e pravedni\u010dku
  pla\u0107u. 42Tko napoji jednoga od ovih najmanjih \u010da\u0161om hladne vode,
  zato \u0161to je moj u\u010denik, sigurno ne\u0107e mu propasti nagrada.\u201d\\nYesu
  Soma Asuafo Dumien No\\n1Yesu fr\u025b\u025b n\u02bcasuafo dumien no baa ne nky\u025bn,
  na \u0254maa w\u0254n tumi s\u025b wontu ahonhomm\u0254ne na w\u0254nsa nyarewa
  ne aho\u0254mmer\u025bw nyinaa.\\n2Yesu asuafo dumien no din ni:\\nSimon a ne din
  baako ne Petro ne ne nua Andrea;\\nYakobo ne ne nua Yohane a w\u0254y\u025b Sebedeo
  mma no,\\n3Filipo ne Bartolomeo,\\nToma ne towgyefo Mateo,\\nYakobo, Alfeo ba ne
  Tadeo,\\n4Simon a ofi Kana ne Yuda Iskariot a akyiri no, oyii Yesu mae no.\\n5Yesu
  somaa asuafo dumien no hy\u025b\u025b w\u0254n se, \u201cMonnk\u0254 nea amanamanmufo
  w\u0254 anaa Samariafo kurow biara mu, 6na mmom monk\u0254 Onyankop\u0254n nguan
  a w\u0254w\u0254 Israel a w\u0254ayera no nky\u025bn. 7Monk\u0254ka nkyer\u025b
  w\u0254n se, \u2018Onyankop\u0254n Ahenni no ab\u025bn!\u2019 8Monsa ayarefo yare,
  munnyan awufo, momma akwatafo ho mfi, na muntu ahonhomm\u0254ne. S\u025bnea munyaa
  no kwa no, saa ara na mo nso na momfa mma kwa.\\n9\u201cMommmfa sikak\u0254k\u0254\u0254,
  dwet\u025b anaa k\u0254bere biara mm\u0254 mo ho. 10Mommmfa akwantukotoku anaa ntade
  anaa mpaboa anaa pema. \u0190s\u025b s\u025b odwumay\u025bni didi. 11Kurow biara
  a mob\u025bk\u0254 mu anaa akuraa biara a mob\u025bk\u0254 ase no, monhwehw\u025b
  onipa a onyamesuro w\u0254 ne mu akyi kwan na montena ne nky\u025bn kosi da a mubefi
  h\u0254 ak\u0254 baabi foforo. 12S\u025b mok\u0254 ofi bi mu a, munkyia w\u0254n
  se, \u2018Asomdwoe nka mo!\u2019 13S\u025b saa ofi no mufo gye mo f\u025bw so a,
  munhyira w\u0254n, na s\u025b w\u0254annye mo de a, momfa mo asomdwoe. 14S\u025b
  morefi ofi anaa kurow biara a w\u0254annye mo w\u0254 mu no mu ak\u0254 a, momporoporow
  ofi no anaa kurow no mu mfutuma a \u025bw\u0254 mo nan ase no ngu h\u0254.10.14
  Eyi y\u025b nea Farisifo y\u025b bere a wofi baabiara a wobu s\u025b amanamanmufo
  atena h\u0254 nti \u025bh\u0254 agu fi no. \u0190y\u025b k\u0254k\u0254b\u0254 a
  emu y\u025b den ma w\u0254n a w\u0254po Awurade as\u025bm no. 15Nokware ni, atemmuda
  no, Sodom ne Gomora mpo benya baabi agyina w\u0254 Onyankop\u0254n anim sen saa
  kurow no.\\n16\u201cMonkae s\u025b meresoma mo s\u025b nguan ak\u0254 mpataku mu.
  Mony\u025b anifere s\u025b aw\u0254 na munnwo s\u025b mmor\u0254noma. 17Nanso monhw\u025b
  yiye w\u0254 nnipa ho! W\u0254b\u025bkyere mo adi mo as\u025bm, ab\u0254 mo mmaa
  w\u0254 w\u0254n as\u0254redan mu. 18Me nti, w\u0254de mo b\u025bk\u0254 atumfo
  ne ahene anim. Eyi b\u025bma moanya kwan aka as\u025bmpa no akyer\u025b w\u0254n
  ne amanamanmufo no. 19S\u025b w\u0254kyere mo a, munnnwinwen as\u025bm a mob\u025bka
  de ayi mo ho ano ho. W\u0254de as\u025bm a mob\u025bka no b\u025bma mo bere a \u025bs\u025b
  mu. 20As\u025bm a mob\u025bka no remfi mo, na mmom, mo \u0254soro Agya no honhom
  na \u0254nam mo so b\u025bkasa.\\n21\u201cOnua beyi onua ama na w\u0254akum no.
  Saa ara na agyanom nso beyi w\u0254n mma ama. Mma b\u025bs\u0254re atia w\u0254n
  awofo ama w\u0254akum w\u0254n. 22Me nti, nnipa nyinaa b\u025btan mo. Nanso nea
  obetumi agyina pintinn akosi awiei no na wobegye no nkwa. 23S\u025b w\u0254taa mo
  kurow baako mu a, munguan nk\u0254 kurow foforo mu. Mereka nokware akyer\u025b mo
  se morenwie Israel nkurow nyinaa mu adwumay\u025b ansa na Onipa Ba no aba.\\n24\u201cOsuani
  nsen ne kyer\u025bkyer\u025bfo, na akoa nso nsen ne wura. 25Osuani sua ne kyer\u025bkyer\u025bfo,
  na akoa nso sua ne wura. Enti s\u025b me a mey\u025b ofi no ti no w\u0254fr\u025b
  me \u2018\u0186bonsam\u2019 a, d\u025bn din na w\u0254remfa mfr\u025b mo!\\n26\u201cMunnsuro
  w\u0254n. Mmere bi b\u025bba a nokware no b\u025bda adi. Nea w\u0254y\u025b no kokoa
  mu no nyinaa b\u025bda adi. 27Nea mereka akyer\u025b mo w\u0254 sum mu yi, monka
  w\u0254 hann mu. Nea mereka agu mo asom yi, mompae mu nka w\u0254 adan atifi. 28Munnsuro
  w\u0254n a wobetumi akum mo nipadua nanso w\u0254rentumi nkum mo kra no. Onyankop\u0254n
  a obetumi akum onipadua no ne \u0254kra w\u0254 amanehunu kurom no nko ara na munsuro
  no. 29W\u0254t\u0254n akasanoma gye ahe? Nkasanoma abien bo ny\u025b sika kakraa
  bi p\u025b? Nanso akasanoma biara nni h\u0254 a obewu a mo Agya no nnim ho biribi.
  30Mo tinwi mpo, w\u0254akan ne nyinaa. 31Enti munnsuro! Mosom bo ma Onyankop\u0254n
  sen nkasanoma.\\n32\u201cObiara a \u0254b\u025bka se onim me w\u0254 nnipa anim
  no, me nso m\u025bka se minim no m\u02bcagya a \u0254w\u0254 \u0254soro no anim.
  33Na obiara a \u0254b\u025bka se onnim me w\u0254 nnipa anim no, me nso m\u025bka
  se minnim no w\u0254 m\u02bcagya a \u0254w\u0254 \u0254soro no anim.\\n\u0190ny\u025b
  Asomdwoe, \u0190y\u025b \u0186ko\\n34\u201cMunnsusuw s\u025b mede asomdwoe na \u025bbaa
  asase yi so! \u0190ny\u025b asomdwoe na mmom afoa na mede bae. 35Maba s\u025b m\u025bma,\\n\u201c
  \u2018\u0254babarima as\u0254re atia n\u02bcagya,\\nna \u0254babea as\u0254re atia
  ne na,\\nna \u0254bea warefo nso as\u0254re atia n\u02bcasebea.\\n36Obiara tamfo
  a ne ho y\u025b hu no befi n\u02bcankasa ne fi.\u2019\\n37\u201cNea \u0254d\u0254
  n\u02bcagya anaa ne na ky\u025bn me no rentumi ny\u025b me de. Saa ara na nea \u0254d\u0254
  ne babarima anaa ne babea ky\u025bn me no rentumi ny\u025b me de ara ne no. 38S\u025b
  obi amfa n\u02bcasennua na wammedi m\u02bcakyi a, \u0254rentumi ny\u025b me de.
  39S\u025b woma wo kra som wo bo a, wob\u025bhwere wo kra no, nanso s\u025b me nti
  wohwere wo kra a, wo nsa b\u025bka.\\n40\u201cObiara a ogye mo no gye me, na nea
  ogye me no nso gye Onyankop\u0254n a \u0254somaa me no. 41S\u025b wugye odiyifo
  bi s\u025b \u0254y\u025b Onyankop\u0254n nipa nti a, wobetua wo so ka s\u025b odiyifo
  no ara p\u025b. Na s\u025b wugye nnipa trenee a, wubenya akatua s\u025b onipa trenee.
  42Na obiara a \u0254b\u025bma m\u02bcakyidifo yi mu akumaa bi nsu anom no, onii
  no akatua remm\u0254 no da.\u201d\"", "\"NEA ENTI A EHIA\\nAfe biara w\u0254to nnipa
  mpempem mmonnaa anaa w\u0254y\u025b w\u0254n basabasa. Mmofra ne mmabun na w\u0254taa
  y\u025b w\u0254n saa.\\n\u0190D\u0190N NA WOB\u0190Y\u0190?\\nN\u00e1 Annette ani
  nna ne ho so. Ohui ara ne s\u025b obi ato ahy\u025b ne so aka no atim fam. \u0186kae
  s\u025b, \u201cMey\u025b\u025b s\u025b m\u025bte\u025bm, nanso mete\u025bm koraa
  a, \u025bmma. Merepia no no, na mereb\u0254 no, na meretiti no. Nso ne nyinaa ankosi
  hwee. Nea metee ara ne s\u025b \u0254de sekan aw\u0254 me. Afei na meda h\u0254
  kagyaa.\u201d\\nWo na biribi saa too wo a, anka wob\u025by\u025b d\u025bn?\\nSUSUW
  HO HW\u0190!\\nEbia wohw\u025b wo ho yiye paa. S\u025b worepue anadwo a, woy\u025b
  nea wubetumi biara de b\u0254 wo ho ban. Nanso b\u0254ne betumi ato wo bere biara.
  Bible ka s\u025b, \u2018\u0190ny\u025b aho\u0254harefo na wodi nkonim mmirikatu
  mu, na \u025bny\u025b animdefo na wonya nnipa anim dom; efis\u025b asiane to w\u0254n
  nyinaa bere a w\u0254nhw\u025b kwan.\u2019\u2014\u0186s\u025bnkafo 9:11.\\nNea \u025btoo
  Annette no to mmabun pii; nkur\u0254fo a wonnim w\u0254n na \u025bto w\u0254n mmonnaa.
  Nanso ebinom de\u025b, amannifo anaa abusuafo mpo na \u025bto w\u0254n mmonnaa.
  Y\u025bhw\u025b Natalie sei a, odii mfe du na aberante bi too no mmonnaa. N\u00e1
  aberante no te w\u0254n mp\u0254tam h\u0254 ara. Natalie kae s\u025b, \u201cN\u00e1
  may\u025b basaa. Aniwu ne ehu kyekyeree me. Enti mfiase no, mamm\u0254 obiara amanne\u025b.\u201d\\nAS\u0190M
  NO MFI WO\\nDa biara a Annette b\u025bkae nea esii no, na wabubu. \u0190y\u025b
  no s\u025b nea \u025bbae nyinaa fi no. \u0186kae s\u025b: \u201c\u0190w\u0254 h\u0254
  ara na abesi me tirim. Midwen ho a, \u025by\u025b me s\u025b migogow me ho dodow.
  As\u025bm no ara ne s\u025b, onya de sekan no w\u0254\u0254 me ara na ehu t\u0254\u0254
  me so. Mantumi any\u025b hwee bio, nanso ebia anka \u025bs\u025b s\u025b mekentene
  me ho kakra.\u201d\\nNatalie nso susuw s\u025b nea esii nyinaa fi no. \u0186kae
  s\u025b: \u201cMigyee aberante no dii dodo. Na m\u2019awofo aka no denneennen s\u025b
  mek\u0254 ab\u0254nten kodi agor\u0254 a, menhw\u025b s\u025b me nuabea nso w\u0254
  h\u0254 bi. Nanso mantie. Enti \u025by\u025b me s\u025b me ara m\u2019aso\u0254den
  na \u025bk\u0254faa ne nyinaa bae. As\u025bm no haw m\u2019abusuafo paa, na wei
  besi me tirim a na merey\u025b awu. \u0190ny\u025b me a anka wei nyinaa amma.\u201d\\nAnnette
  ne Natalie as\u025bm yi ne wo de\u025b hyia a, \u025bnde kae s\u025b obi to wo mmonnaa
  a, \u025bnkyer\u025b s\u025b wo na womaa kwan. Mmonnaato y\u025b aniberes\u025bm
  paa, nanso ns\u025bm a ebinom ka ma no y\u025b s\u025b gyama \u025bny\u025b biribiara.
  W\u0254ka s\u025b: \u201cMmarimaa de\u025b saa ara; wugyaagyae wo ho a, w\u0254remfa
  nky\u025b wo.\u201d Nanso hena na \u0254b\u025bka s\u025b \u0254no de\u025b \u0254p\u025b
  s\u025b obi to no mmonnaa? Enti s\u025b obi ato wo mmonnaa p\u025bn a, mmu wo ho
  f\u0254, efis\u025b as\u025bm no mfi wo.\\nY\u025bka s\u025b \u201cas\u025bm no
  mfi wo\u201d a, ebia \u025bny\u025b den s\u025b wob\u025bte ase, nanso wubegye atom
  anaa? Ebinom mp\u025b s\u025b w\u0254b\u0254 as\u025bm no so koraa. Ade\u025b yi
  wosusuw s\u025b w\u0254n ara na ak\u0254fa aba. Enti daa na wosu gu w\u0254n yam.
  Nanso, wo de\u025b hw\u025b oo: Wumua w\u2019ano a, hena paa na worey\u025b no?
  Nea \u0254too wo mmonnaa no, anaa wo a y\u025bato wo mmonnaa no? Wo ara wo yiye
  mu nti ehia s\u025b wudwen as\u025bm no ho bio.\\nMFA NHY\u0190 WO MU\\nBible ka
  s\u025b \u0254treneeni Hiob rehu amane no, \u0254kae s\u025b: \u201cM\u025bkasa
  me kra awer\u025bhow mu!\u201d (Hiob 10:1) Wo nso \u025b? Wunnye nni s\u025b woka
  ho as\u025bm a \u025bb\u025bboa? Woka kyer\u025b obi a wop\u025b n\u2019as\u025bm
  a, wubehu nne\u025bma ani so yiye na woahu nea wob\u025by\u025b w\u0254 ho. Wei
  betumi ayi adesoa ne adwennwen afi wo so.\\nAnnette hui s\u025b as\u025bm yi y\u025b
  nokware. Wo de\u025b tie n\u2019anom as\u025bm: \u201cMeka kyer\u025b\u025b m\u2019adamfo
  bi, na \u0254hy\u025b\u025b me nkuran s\u025b menka nkyer\u025b m\u2019asafo mu
  mpanyimfo no bi. \u0190y\u025b me d\u025b paa s\u025b mey\u025b\u025b saa. W\u0254ne
  me b\u0254\u0254 nk\u0254mm\u0254 mp\u025bn pii hy\u025b\u025b me den. W\u0254kasa
  maa no t\u0254\u0254 me koma so paa. W\u0254maa mihui s\u025b nea esii no mfi me.
  Emu biara nni h\u0254 a efi me.\u201d\\nNatalie kaa nea esii no kyer\u025b\u025b
  n\u2019awofo. Tie n\u2019anom as\u025bm: \u201cM\u2019awofo twaa me koma too me
  yam, na \u025bmaa mitumi kasae. Nea m\u2019awofo y\u025be yi boaa me paa; amma m\u2019anni
  yaw k\u025bse.\u201d\\nAde\u025b baako a \u025bboaa Natalie nso ne mpaeb\u0254.
  \u0186kae s\u025b: \u201cEdu baabi na \u025by\u025b den s\u025b me ne obi besusuw
  ho a, na aka me ne me Nyankop\u0254n. Meb\u0254 mpae a, mitumi hwie me komam ns\u025bm
  nyinaa gu n\u2019anim. Wei ma me ho dwo me sei f\u0254mm.\u201d\\nWo nso \u025b?
  Biribi saa ato wo p\u025bn a, kae s\u025b \u2018ayaresa w\u0254 ne bere.\u2019 (\u0186s\u025bnkafo
  3:3) Enti hw\u025b wo ho so yiye. \u0190y\u025b a nya bere home. Afei kae s\u025b
  Yehowa ne awer\u025bkyekye nyinaa Nyankop\u0254n, enti fa wo ho to no so.\u20142
  Korintofo 1:3, 4.\\nS\u0190 W\u2019ASO AWARE A\\nS\u025b woy\u025b abaayewa na obi
  p\u025b s\u025b \u0254hy\u025b wo ma wubu bra b\u0254ne a, nsuro s\u025b wob\u025bka
  no pen s\u025b, \u201cGyae nea worey\u025b no!\u201d anaa \u201cYi wo nsa, gyae
  me mu!\u201d Nka s\u025b mo adamfofa no b\u025bs\u025be nti wubemua w\u2019ano.
  S\u025b wei nti \u0254ne wo twa mu a, mma no nhaw wo. \u0186ny\u025b \u0254barima
  a \u0254fata wo! Wuhia \u0254barima a obu ne ho, \u0254barima a obedi wo ni.\\nY\u0190
  S\u0186HW\u0190 YI\\n\u201cBere a y\u025bw\u0254 sukuu no, \u025bw\u0254 h\u0254
  a na mmarimaa bi abegyina m\u2019akyi atwe me brassiere (b\u0254des) akeka abofonos\u025bm
  akyer\u025b me. Wotumi ka s\u025b me ne w\u0254n da a, m\u2019ani begye paa.\u201d\\n\u2014Coretta.\\nWohw\u025b
  nea mmarimaa no y\u025be yi a, wob\u025bka s\u025b:\\nW\u0254ne Coretta redi agor\u0254?\\nW\u0254de
  w\u0254n ho rehyehy\u025b no?\\nW\u0254retwetwe n\u2019adwene aba nna so?\\n\u201cBere
  bi a y\u025bte b\u0254s mu no, abarimaa bi fii ase keka ns\u025bnhunu kyer\u025b\u025b
  me. Mihui ara na was\u0254 me mu. Enti meb\u0254\u0254 ne nsa twenee baabi ka kyer\u025b\u025b
  no s\u025b omfi me nky\u025bn. Afei na \u0254hw\u025b me h\u00e3\u00e3, kyer\u025b
  s\u025b onhu nipa ko a mey\u025b.\u201d\\n\u2014Candice.\\nWohw\u025b nea abarimaa
  no y\u025be yi a, wob\u025bka s\u025b:\\n\u0186ne Candice redi agor\u0254?\\n\u0186de
  ne ho rehyehy\u025b no?\\n\u0186retwetwe n\u2019adwene aba nna so?\\n\u201cAfe a
  etwaam no, abarimaa bi tuu n\u2019ani sii me so s\u025b \u0254p\u025b me na \u0254p\u025b
  s\u025b yepue. Nanso mampene. \u0190t\u0254 da a, \u0254de ne nsa fefa me ho. Meka
  s\u025b onnyae a, ontie. Da bi na merehy\u025b me mpaboa, nea metee ara ne s\u025b
  wab\u0254 me to.\u201d\\n\u2014Bethany.\\nWuhu nea abarimaa yi y\u025be no s\u025bn?\\n\u0186ne
  Bethany redi agor\u0254?\\n\u0186de ne ho rehyehy\u025b no?\\n\u0186retwetwe n\u2019adwene
  aba nna so?\\nY\u025bhw\u025b ns\u025bm yi nyinaa a, nea \u025bt\u0254 so 3 no na
  \u025by\u025b nokware.\\nS\u025b obi retwetwe w\u2019adwene aba nna so anaa \u0254de
  nna ho ns\u025bm rehaw wo a, y\u025brentumi nka s\u025b \u0254ne wo redi agor\u0254
  anaa \u0254de ne ho hyehy\u025b wo k\u025bk\u025b. Ad\u025bn ntia?\\nObi retwetwe
  w\u2019adwene aba nna so na woka kyer\u025b no s\u025b onnyae koraa ontie.\\nWei
  y\u025b aniberes\u025bm paa, efis\u025b ebetumi akowie mmonnaato.\"", "\"Nkyia\\n1Saa
  nhoma yi fi Onyankop\u0254n somfo ne Yesu Kristo somafo Paulo nky\u025bn. W\u0254paw
  me na w\u0254somaa me se memm\u025btr\u025bw nnipa a Onyankop\u0254n ayi w\u0254n
  no gyidi mu no, na menkyer\u025bkyer\u025b w\u0254n nokwas\u025bm a \u025bde onyamesuro
  ba 2w\u0254 nkwa a enni awiei ho anidaso a Onyankop\u0254n a onni atoro no hy\u025b\u025b
  y\u025bn ho b\u0254 ansa na \u0254refi wiase ase; 3na afei ne bere a \u025bs\u025b
  mu no, \u0254faa as\u025bnka a \u0254no Nyankop\u0254n a \u0254y\u025b y\u025bn
  Agyenkwa no hy\u025b me s\u025b menka no so daa no adi.\\n4Mekyer\u025bw me ba Tito
