  exist\u00eancia e todo o universo se mant\u00e9m gra\u00e7as a ele. 18Cristo \u00e9
  a cabe\u00e7a da igreja que \u00e9 o seu corpo, e \u00e9 o princ\u00edpio, a fonte
  entre os mortos e, consequentemente, o primeiro em tudo e sobre todas as coisas!
  19Porque Deus em toda a sua plenitude decidiu estar presente em Cristo. 20E por
  ele Deus reconciliou todas as coisas consigo mesmo. Cristo estabeleceu a paz com
  tudo que existe na Terra e no c\u00e9u, por meio do seu sangue na cruz.\\n21Portanto,
  tamb\u00e9m est\u00e3o inclu\u00eddos nesta obra de reconcilia\u00e7\u00e3o, voc\u00eas
  que antes eram estranhos, que at\u00e9 eram seus inimigos nos vossos pensamentos
