  Ilma selleta ei leia er\u00fctrots\u00fc\u00fctide ja antikehade moodustumist, mist\u00f5ttu
  v\u00f5etakse see aneemia ja v\u00e4hendatud immuunsuse tagamiseks.\\n- See m\u00e4ngib
  olulist rolli n\u00e4rviimpulsside \u00fclekandmisel osalevate neurotransmitterite
  moodustamiseks: serotoniini, adrenaliini jne Seet\u00f5ttu on B6-vitamiinid n\u00e4idustatud
  n\u00e4rvis\u00fcsteemi haiguste puhul - normaalsest stressist kuni Parkinsoni t\u00f5be.\\n-
  T\u00e4htis on \u00f5ige maksafunktsioon\\n- Looduslik diureetikum\\n- Ravib nahahaigusi\\n-
  V\u00e4hendab iiveldust, mist\u00f5ttu seda kasutatakse rasedate naiste liikumisraskustes
  ja toksikoloogias.\\n- Aitab libisevate krampidega \u00f6\u00f6sel ja tuimaks k\u00e4tele\\nN\u00fc\u00fcd,
  kui teate selle vitamiini rolli keha t\u00e4ielikuks toimimiseks, saab selgeks,
  kui t\u00e4htis on seda v\u00f5tta piisavas koguses.\\n\u00d5nneks on see suurep\u00e4rane
  aine laialt levinud, seda v\u00f5ib leida paljudest nii k\u00f6\u00f6giviljade kui
  loomse p\u00e4ritoluga toodetest. K\u00f5ige rikkam neist:\\n- teraviljad (pealegi
  on see enamasti koore ja seemnep\u00f5\u00f5sas, seega on k\u00f5ige parem kasutada
  kliid, pruun riisisorte, leiba ja j\u00e4mejahu valmistatud pasta);\\n- \u00f5llep\u00e4rm;\\n-
  p\u00e4hklid (eriti kreeka p\u00e4hklid ja sarapuup\u00e4hklid);\\n- rups (s\u00fcda,
  maks, neerud);\\n- kala (eriti tuunikala, l\u00f5he ja tursk);\\n- munad;\\n- piimatooted;\\n-
  spinati, kapsa, tomatid, sparglid, kaunviljad.\\nLisaks metaboliseeritakse keha
  soolestiku mikrofloora abil B6-vitamiin.\\nSelle toote sisaldus toodetes ladustamisel
  ja kuumt\u00f6\u00f6tlemisel v\u00e4heneb. Alkoholi ja \u00f6strogeeni sisaldavate
  preparaatide kasutamisel imendub see kehvasti.\\nP\u00e4eva hind (tabel)\\nB6-vitamiini
  annus s\u00f5ltub otseselt vanusest. T\u00e4iskasvanu keskmine p\u00e4evane annus
  1,5-2 mg p\u00e4evas.\\nNaiste haiguste, rasete ja imetavate naiste kannatuste suurenemine
  stressi suurenemise ajal on sportlastel suurenenud vajadus. Sellistel juhtudel v\u00f5ib
  seda v\u00f5tta kuni 4 mg p\u00e4evas ja v\u00e4ga intensiivse koormusega - kuni
  10 mg.\\nKui palju B6-vitamiini tuleb v\u00f5tta s\u00f5ltuvalt kehaku vanusest
  ja seisundist, on see n\u00e4idatud j\u00e4rgmises tabelis:\\nVitamiin B6 (p\u00fcridoksiin)\\nVitamiin
  B6 (p\u00fcridoksiin) - vees lahustuv. Seda kuvatakse 8 tundi p\u00e4rast allaneelamist
  ja kuidas tuleb k\u00f5iki B-vitamiine t\u00e4iendada.\\nVitamiin B6 on tegelikult
  r\u00fchm vitamiine: p\u00fcridoksiin, p\u00fcridoksinaal ja p\u00fcridoksamiin,
  mis on \u00fcksteisega tihedalt seotud ja toimivad koos.\\nM\u00f5\u00f5detakse
  mg-des. Vajalik antikehade ja punaste vereliblede moodustamiseks. T\u00e4iskasvanutel
  soovitatakse v\u00f5tta 1,6-2,0 mg p\u00e4evas, rasedatel naistel on vaja annust
  suurendada. N\u00f5utav B12 n\u00f5uetekohaseks imendumiseks. Vajalik vesinikkloriidhappe
  ja magneesium\u00fchendite moodustamiseks.\\nSoodustab valgu ja rasva \u00f5iget
  imendumist. Edendab tr\u00fcptofaani (asendamatu aminohappe) muundamist niatsiiniks.
  Aitab v\u00e4ltida mitmesuguseid n\u00e4rvis\u00fcsteemi ja nahahaigusi. V\u00e4hendab
  iiveldust.\\nEdendab vananemist v\u00e4ltivate nukleiinhapete \u00f5iget s\u00fcnteesi.
  V\u00e4hendab \u00f6ine lihaste spasmid, vasika lihaskrambid, k\u00e4te tuimus,
  teatud j\u00e4semete neuriit. Tegutseb loodusliku diureetikumina.\\nB6 defitsiidi
  p\u00f5hjustatud haigused: aneemia, seborr\u00f6a dermatiit, glossiit.\\nParimad
  looduslikud allikad on \u00f5lletehased, nisukliid, nisumumarjad, maks, neerud,
  s\u00fcda, kanepipuu, kapsas, melass, piim, munad, veiseliha.\\nVitamiin B6 (p\u00fcridoksiin,
  p\u00fcridoksaal, p\u00fcridoksamiin) s\u00fcnteesitakse kehas soolestiku mikrofloora
  abil.\\nP\u00e4evased annused vahemikus 2-10 grammi v\u00f5ivad p\u00f5hjustada
  neuroloogilisi h\u00e4ireid. V\u00f5imalikud s\u00fcmptomid, mis v\u00f5ivad p\u00f5hjustada
  liigse B6-vitamiini tarbimist - \u00e4revus unes ja liiga eredad unistuste m\u00e4lestused.
  Rohkem kui 500 mg \u00f6\u00f6p\u00e4evas ei ole soovitatav.\\nP\u00e4eva hind\\nVaenlased:
  pikaajaline ladustamine, vesi, toiduainete t\u00f6\u00f6tlemine, alkohol, \u00f6strogeen.\\nSeda
  vitamiini vajavad inimesed, kes tarbivad suures koguses valku. Vitamiin B6 v\u00f5ib
  v\u00e4hendada diabeetikute vajadust insuliinis ja kui selle annust ei korrigeerita,
  v\u00f5ib see p\u00f5hjustada veresuhkru languse.\\nInimesed artriidiga, keda ravitakse
  penitsillamiiniga, peaksid v\u00f5tma selle vitamiinipreparaadi. Selle vitamiini
  lisandeid ei tohi v\u00f5tta need, kes Parkinsoni t\u00f5ve t\u00f5ttu v\u00f5tavad
  levodopat.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin)
  on vajalik koguse suurendamiseks, antikehade kvaliteedi parandamiseks - keha kaitsjad
  paljude haiguste patogeenide vastu.\\nPiisav kogus vitamiini B6 on organismis oluline
  immuuns\u00fcsteemi funktsioneerimise olulise indikaatori - T-rakkude arv - normaalseks
  tootmiseks. Eriti vitamiin B6 on vajalik lastele ja vanas eas, et s\u00e4ilitada
  normaalse taseme keha f\u00fc\u00fcsiline kaitse bakteriaalsete ja viirusnakkuste
  eest.\\nVitamiin B6 (p\u00fcridoksiin, pyridoxal, p\u00fcridoksamiiniga) koos vitamiinide
  B1 (tiamiin), B9 (foolhape), B12 (ts\u00fcanokobalamiin) on hooldaja tervise veresoonkond
  see v\u00e4hendab haigusjuhte, nagu s\u00fcdame isheemiat\u00f5bi, ateroskleroos,
  s\u00fcdameatakk m\u00fcokard.\\nKui vitamiin B6 puudub, muutub veri tihedamaks,
  viskoosseks, kipuvad moodustama h\u00fc\u00fcbimisi, mis v\u00f5ivad veresooni ummistuda.
  Vitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin) eemaldab kehast
  homots\u00fcsteiini, aminohape, mille suur sisaldus veres p\u00f5hjustab insuldi
  ja m\u00fcokardi infarkti esinemissageduse suurenemist.\\nOn t\u00f5endeid selle
  kohta, et vitamiin B6 on oluline ateroskleroosi ennetamisel. Uuringud, mis on l\u00e4bi
  viidud ahvidega pikka aega, et saada D6-vitamiini ebapiisava sisaldusega toit, n\u00e4itasid
  selgelt v\u00e4ljendunud ateroskleroosi tekkimist koos koronaararterite esmaste
  kahjustustega.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin)
  hoolitseb naatriumi ja kaaliumisisalduse eest kehavedelikes. Naatrium on soola lahutamatu
  osa, mille t\u00f5ttu vesi koguneb kehasse. Kui me soolme palju toitu v\u00f5i v\u00f5taksime
  ebapiisava vitamiini B6, p\u00f5hjustab see vedeliku kogunemist (\u00f6deemi), k\u00f5rge
  verer\u00f5hku. Vitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin)
  toimib diureetikumina, mis aitab eemaldada vett organismist.\\nOsaleb metabolismi,
  eriti valkude ainevahetuses, aminohapete vahetamise ens\u00fc\u00fcmide konstrueerimisel.\\nOrganismis
  fosfor\u00fc\u00fclitakse B6-vitamiin (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin)
  fosfop\u00fcridoksaaliks, mis on transaminaaside koens\u00fc\u00fcm ja on seega
  osa aminohapete transaminiseerimise ens\u00fc\u00fcmidest.\\nEriti oluline on aminohapete
  nagu tr\u00fcptofaani, glutamiinhappe vahetamine. Tr\u00fcptofaani jaotus toimub
  koos vitamiin B6 osalusega. Seoses sellega p\u00f5hjustab B6-vitamiini (p\u00fcridoksiini,
  p\u00fcridoksaali, p\u00fcridoksamiini) puudumine tr\u00fcptofaani metabolismi,
  mittet\u00e4ieliku l\u00f5hustamise ja ebat\u00e4ielike l\u00f5hustamisproduktide
  h\u00e4ireid uriinis (ksant\u00fcrhape jne).\\nAitab organismil stressi vastu seista,
  kus neerupealised eraldavad hormoone, aktiveerivad valkude ainevahetust. Seet\u00f5ttu
  on stressirohketel juhtudel p\u00fcridoksiin k\u00f5ige enam tarbitud, kuna p\u00fcridoksiin
  on proteiini assimilatsiooniks vajalik.\\nTaastab olulist rolli rasvade ainevahetuses.
  Vitamiin B6 seos k\u00fcllastumata rasvhapete vahetamisega on kindlaks tehtud. P\u00f5ldoksiinis
  osalemine tekib v\u00e4ga biosaadavast arahidoonhappest linoleenhappest. Dermatiidi
  ravis t\u00e4heldati B6-vitamiini ja k\u00fcllastumata rasvhapete kombineeritud
  kasutamisel parima terapeutilise efekti.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal,
  p\u00fcridoksamiin) koos foolhappega (vitamiin B9) normaliseerib kolesterooli metabolismi
  (omab kolesterooli taset langetavat toimet).\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal,
  p\u00fcridoksamiin) v\u00f5ib seostuda lipotroopsete ainetega. On kindlaks tehtud,
  et vitamiini B6 puudumine toidus suurendab rasvkoe infiltratsiooni maksa\\nIgap\u00e4evane
  B6-vitamiini tarbimine\\nVitamiin B6\\nVitamiin B6 p\u00fcridoksiin on vees lahustuv
  element, mis t\u00e4idab inimkehas erinevaid \u00fclesandeid, mille peamine eesm\u00e4rk
  on tuvastada metaboolsete protsesside toimimine ja valkude konstrueerimine. See
  element on seotud \u00f5nnehormoonide v\u00e4ljat\u00f6\u00f6tamisega, mis vastutavad
  hea une, hea meeleolu ja s\u00f6\u00f6giisu eest.\\nTuunikala sisaldab palju vitamiini
  B6\\nP\u00fcridoksiin takistab erinevate naha- ja n\u00e4rvis\u00fcsteemi h\u00e4irete
  teket, takistab vananemist nukleiinhapete s\u00fcnteesimisega. See m\u00f5jutab
  looduslikku diureetikumit ja v\u00e4hendab j\u00e4seme krampe.\\nB6-vitamiini peamised
  funktsioonid:\\n- Toetada n\u00e4rvis\u00fcsteemi toimimist;\\n- Hormooni taseme
  s\u00e4ilitamine naisorganismis;\\n- S\u00fcdame-veresoonkonna haiguste ja diabeedi
  ennetamine;\\n- Tugevdatud immuunsus ja juuste kasv.\\nVitamiin B6 on immuuns\u00fcsteemi
  tervise jaoks v\u00e4ga t\u00e4htis element. See on vastutav kaaliumi ja naatriumi
  tasakaalu eest kehas, mis takistab turse esinemist. Lisaks proteiini metabolismile
  m\u00e4ngib see element rasvade ja s\u00fcsivesikute metabolismi olulist rolli.
  P\u00fcridoksiin tarnib organismile gl\u00fckoosi, sekreteerides selle verdesse
  maksa ja lihaste s\u00e4ilitatud s\u00fcsivesikuid.\\nVitamiini B6 allikad\\nToidus
  sisalduv suur p\u00fcridoksiini sisaldus on konservit\u00f6\u00f6stuses (57-77%)
  ja k\u00fclmutamisel (20%) kaotatud. Kuumt\u00f6\u00f6tlus m\u00f5jutab kahjulikult
  ka B6-vitamiini, kusjuures termiline ekspositsioon kaotab umbes 90% p\u00fcridoksiini
  kogusisaldusest toidus.\\nTaimsed allikad\\n- K\u00f6\u00f6giviljad - kartul, rohelised
  lehtk\u00f6\u00f6giviljad (rooskapsas, spargel, seller), mais, pipar, lillkapsas,
  bulgaaria spinat, tomatid;\\n- Puuviljad - banaanid, avokaadod, melonid, tsitrusviljad;\\n-
  Marjad - maasikad;\\n- P\u00e4hklid - sarapuup\u00e4hklid, kreeka p\u00e4hklid,
  maap\u00e4hklid;\\n- Teravili - tatar, jahu (rafineerimata teravili), kliid, riis;\\n-
  Kaunviljad, k\u00fc\u00fcslauk ja soja;\\n- P\u00e4evalilleseemned\\nLoomsed allikad\\n-
  Liha - kana, veiseliha;\\n- Kala - tursk, tuunikala;\\n- Rups - veiste ja tursa
  maks, s\u00fcda, neer;\\n- Mereannid - austrid;\\n- Munakolm ja piimatooted.\\nIgap\u00e4evane
  vitamiin B6 n\u00f5ue ja soovitused kasutamiseks\\nP\u00fcridoksiini sisaldavad
  ravimid v\u00f5etakse suu kaudu p\u00e4rast s\u00f6\u00f6ki, samuti on v\u00f5imalik
  intramuskulaarset, intravenoosset ja subkutaanset s\u00fcstimist, mis m\u00e4\u00e4ratakse
  juhul, kui seda on v\u00f5imatu v\u00f5tta sisse (n\u00e4iteks oksendamine) ja kui
  selle elemendi imendumine soolestikus on v\u00e4henenud.\\nLaste p\u00e4evarahad\\n-
  0-6 kuud - 0,5 mg;\\n- Kuue kuu kuni \u00fche aasta jooksul - 0,6 mg;\\n- 1-3 aastat
  - 0,9 mg;\\n- 4-6 aastat - 1,3 mg;\\n- 7-10 aastat vana - 1,6 mg.\\nMeeste p\u00e4evaintressim\u00e4\u00e4r\\nIsikud,
  kes on alkoholi ja suitsetamisest s\u00f5ltuvad, vajavad p\u00e4evas p\u00fcridoksiini
  suuremat annust. Pingetavad olukorrad ja suurenenud koormused n\u00f5uavad ka selle
  aine suuret tarbimist kehas.\\n- 11-14-aastased - 1,8 mg;\\n- 15-18-aastased - 2
  mg;\\n- 19-59-aastased - 2 mg;\\n- 60-74 aastat - 2,2 mg;\\n- 75 aastat v\u00f5i
  rohkem - 2,2 mg.\\nNaiste p\u00e4evad\\nP\u00fcridoksiin on naiste tervisele h\u00e4davajalik
  element. T\u00e4nu organismi tasakaalule on oluliselt paranenud premenstruaalne
  s\u00fcndroom, menopaus ja rasedus. Tema vajadus suureneb rasestumisvastaste pillide
  kasutamise ajal. T\u00e4nu B6-vitamiinile normaliseerub naissoost hormoonide tasakaal
  ja v\u00e4lditakse v\u00e4hkt\u00f5ve vorme.\\n- 11-14-aastased - 1,6 mg;\\n- 15-18-aastased
  - 1,6 mg;\\n- 19-59-aastased - 1,8 mg;\\n- 60-74 aastat - 2 mg;\\n- 75 aastat v\u00f5i
  rohkem - 2 mg;\\n- Rasedus - + 0,3 mg;\\n- Imetamine - + 0,5 mg.\\nVideo internetist\\nM\u00e4rgid
  puuduvad vitamiin B6\\nRohkem kui sada sorti erinevatest haigustest tuleneb B6-vitamiini
  puudusest organismis. Selle elemendi puudust on v\u00e4ga raske kindlaks teha juba
  algusest peale, mille tagaj\u00e4rjel tekib haiguste areng.\\nP\u00fcridoksiini
  defitsiidi s\u00fcmptomid:\\n- \u00c4rrituvus, krambid, letargia, depressiivsed
  seisundid, unetus;\\n- N\u00e4o n\u00e4gemish\u00e4ire, seborr\u00f6a, cheilosis
  (huulte l\u00f5henemine), stomatiit;\\n- Oksendamine, iiveldus ja isutus (eriti
  raseduse ajal);\\n- Alam- ja \u00fclemiste j\u00e4semete pol\u00fcneuriit, konjunktiviit.\\nH\u00fcpovitaminoosi
  p\u00f5hjused\\nP\u00fcridioksiini ja valkude vaheline interaktsioon, mis on m\u00f5istlikult
  ja peenelt tasakaalustatud inimese kehas, on v\u00e4ga tundlik ja seet\u00f5ttu
  kergesti rikutud. Pingetavad olukorrad v\u00f5i suures koguses valku s\u00f6\u00f6mine
  v\u00f5ib m\u00f5jutada p\u00fcridoksiini imendumist, mis kahjustab selle kogust
  kehas. See t\u00e4hendab, et lihatooteid s\u00f6\u00f6vad kolm korda p\u00e4evas
  ja stresshormoonid absorbeerivad kogu B-vitamiini varustust keha sees, mis paikneb
  maksas ja soolestikes.\\nP\u00fcridoksiini \u00fcleannustamise m\u00e4rgid\\nVitamiin
  B6 on h\u00e4sti talutav mis tahes kujul. K\u00f5rvaltoimed, mis v\u00f5tsid sellel
  p\u00e4eval suured annused sellel vitamiinil, pika aja jooksul ei n\u00e4idanud
  mingeid negatiivseid ja k\u00f5rvaltoimeid.\\nKui palju vitamiine p\u00e4evas vajate?\\nArvutage
