  penitsillamiiniga, peaksid v\u00f5tma selle vitamiinipreparaadi. Selle vitamiini
  lisandeid ei tohi v\u00f5tta need, kes Parkinsoni t\u00f5ve t\u00f5ttu v\u00f5tavad
  levodopat.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin)
  on vajalik koguse suurendamiseks, antikehade kvaliteedi parandamiseks - keha kaitsjad
  paljude haiguste patogeenide vastu.\\nPiisav kogus vitamiini B6 on organismis oluline
  immuuns\u00fcsteemi funktsioneerimise olulise indikaatori - T-rakkude arv - normaalseks
  tootmiseks. Eriti vitamiin B6 on vajalik lastele ja vanas eas, et s\u00e4ilitada
  normaalse taseme keha f\u00fc\u00fcsiline kaitse bakteriaalsete ja viirusnakkuste
  eest.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin) kombinatsioonis
  vitamiinidega B1 (tiamiin). B9 (foolhape), B12 (ts\u00fcanokobalamiin), kaitseb
  kardiovaskulaars\u00fcsteemi tervist, v\u00e4hendab selliseid haigusi nagu s\u00fcdame
  isheemiat\u00f5bi, ateroskleroos, m\u00fcokardiinfarkt.\\nKui vitamiin B6 puudub,
  muutub veri tihedamaks, viskoosseks, kipuvad moodustama h\u00fc\u00fcbimisi, mis
  v\u00f5ivad veresooni ummistuda. Vitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal,
  p\u00fcridoksamiin) eemaldab kehast homots\u00fcsteiini, aminohape, mille suur sisaldus
  veres p\u00f5hjustab insuldi ja m\u00fcokardi infarkti esinemissageduse suurenemist.\\nOn
  t\u00f5endeid selle kohta, et vitamiin B6 on oluline ateroskleroosi ennetamisel.
  Uuringud, mis on l\u00e4bi viidud ahvidega pikka aega, et saada D6-vitamiini ebapiisava
  sisaldusega toit, n\u00e4itasid selgelt v\u00e4ljendunud ateroskleroosi tekkimist
  koos koronaararterite esmaste kahjustustega.\\nVitamiin B6 (p\u00fcridoksiin, p\u00fcridoksaal,
  p\u00fcridoksamiin) hoolitseb naatriumi ja kaaliumisisalduse eest kehavedelikes.
  Naatrium on soola lahutamatu osa, mille t\u00f5ttu vesi koguneb kehasse. Kui me
  soolme palju toitu v\u00f5i v\u00f5taksime ebapiisava vitamiini B6, p\u00f5hjustab
  see vedeliku kogunemist (\u00f6deemi), k\u00f5rge verer\u00f5hku. Vitamiin B6 (p\u00fcridoksiin,
  p\u00fcridoksaal, p\u00fcridoksamiin) toimib diureetikumina, mis aitab eemaldada
  vett organismist.\\nOsaleb metabolismi, eriti valkude ainevahetuses, aminohapete
  vahetamise ens\u00fc\u00fcmide konstrueerimisel.\\nOrganismis fosfor\u00fc\u00fclitakse
  B6-vitamiin (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin) fosfop\u00fcridoksaaliks,
  mis on transaminaaside koens\u00fc\u00fcm ja on seega osa aminohapete transaminiseerimise
  ens\u00fc\u00fcmidest.\\nEriti oluline on aminohapete nagu tr\u00fcptofaani, glutamiinhappe
  vahetamine. Tr\u00fcptofaani jaotus toimub koos vitamiin B6 osalusega. Seoses sellega
  p\u00f5hjustab B6-vitamiini (p\u00fcridoksiini, p\u00fcridoksaali, p\u00fcridoksamiini)
  puudumine tr\u00fcptofaani metabolismi, mittet\u00e4ieliku l\u00f5hustamise ja ebat\u00e4ielike
  l\u00f5hustamisproduktide h\u00e4ireid uriinis (ksant\u00fcrhape jne).\\nAitab organismil
  stressi vastu seista, kus neerupealised eraldavad hormoone, aktiveerivad valkude
  ainevahetust. Seet\u00f5ttu on stressirohketel juhtudel p\u00fcridoksiin k\u00f5ige
  enam tarbitud, kuna p\u00fcridoksiin on proteiini assimilatsiooniks vajalik.\\nTaastab
  olulist rolli rasvade ainevahetuses. Vitamiin B6 seos k\u00fcllastumata rasvhapete
  vahetamisega on kindlaks tehtud. P\u00f5ldoksiinis osalemine tekib v\u00e4ga biosaadavast
  arahidoonhappest linoleenhappest. Dermatiidi ravis t\u00e4heldati B6-vitamiini ja
  k\u00fcllastumata rasvhapete kombineeritud kasutamisel parima terapeutilise efekti.\\nVitamiin
  B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin) koos foolhappega (vitamiin
  B9) normaliseerib kolesterooli metabolismi (omab kolesterooli taset langetavat toimet).\\nVitamiin
  B6 (p\u00fcridoksiin, p\u00fcridoksaal, p\u00fcridoksamiin) v\u00f5ib seostuda lipotroopsete
  ainetega. On kindlaks tehtud, et vitamiini B6 puudumine toidus suurendab rasvkoe
  infiltratsiooni maksa\\nAllikad: http://pyridoxin.x51.ru, http://www.calorizator.ru,
  http://ru.wikipedia.org/wiki/\\nVitamiin B6\\nVitamiin B6 omab teisi nimetusi -
  p\u00fcridoksamiin, p\u00fcridoksaal, p\u00fcridoksiin (p\u00fcridoksool).\\nVitamiin
  B6 on vees lahustuv kristalne kristalne aine.\\nOn r\u00fchma aineid, mis omavahel
  \u00fcksteisega muutuvad - 3-h\u00fcdroks\u00fcp\u00fcridiin-p\u00fcridoksooli (p\u00fcridoksiini),
  p\u00fcridoksamiini ja p\u00fcridoksaali derivaadid. Seet\u00f5ttu t\u00e4hendab
  p\u00fcridoksiini v\u00f5i \\\"vitamiini B6\\\" m\u00f5iste terve rida sarnaseid
  aineid, millel on v\u00f5rdne vitamiinide aktiivsus.\\nTaimse ja loomset p\u00e4ritolu
  toidus on B6-vitamiin siduvas olekus, seedimise protsessis muutub see aktiivseks
  ja imendub kiiresti seedetraktis. Seej\u00e4rel jagatakse vitamiin kudedesse ja
  elunditesse. Suurim kogus vitamiini B6 on leitud maksa- ja s\u00fcdantsis (selle
  panus), selle komponent on neerudes suur.\\nK\u00fcpsetamise ajal v\u00f5ib kuni
  35% p\u00fcridoksiini kaduda. Grinding grain v\u00e4hendab selle vitamiini sisaldust
  umbes 80% v\u00f5rra. P\u00fcridoksiini sisaldav toiduainete k\u00fclmutamine praktiliselt
  ei m\u00f5juta selle kogust.\\nB6-vitamiini bioloogiline roll\\n- v\u00f5tab aktiivselt
  osa aminohapete s\u00fcnteesist k\u00f5ikidel etappidel, eriti sellistes aminohapeteks
  nagu tr\u00fcptofaan;\\n- aitab kaasa aju normaalsele toimimisele ja toimimisele;\\n-
  takistab veresoonte aterosklerootilisi muutusi;\\n- pehmendab ja v\u00e4hendab valulikke
  n\u00e4htusi premenstruaalse s\u00fcndroomi tagaj\u00e4rjel;\\n- aitab v\u00e4hendada
  halva kolesterooli taset;\\n- tal on rahustav toime;\\n- osaleb aktiivselt energia
  tootmises ja seda peetakse \u00fcheks olulisemaks bioenergiaelemendiks;\\n- tugevdab
  immuuns\u00fcsteemi;\\n- aitab aeglustada vananemisprotsessi organismis (osalemise
  t\u00f5ttu nukleiinhapete s\u00fcnteesis);\\n- v\u00e4hendab astma s\u00fcmptomite
  raskust;\\n- v\u00e4hendab artriidiga kaasneva p\u00f5letiku raskust;\\n- osaleb
  antikehade ja punaste vereliblede s\u00fcnteesis;\\n- aitab kaasa kardiovaskulaarsete
  ja n\u00e4rvis\u00fcsteemide normaalsele toimimisele;\\n- teostab h\u00fcdroks\u00fcaminohapete
  ja v\u00e4\u00e4vlit sisaldavate aminohapete muundamise;\\n- parandab kehas k\u00fcllastamata
  rasvhapete kasutamist, millel on kasulik m\u00f5ju maksa, aju ja hematopoeetilise
  s\u00fcsteemi t\u00f6\u00f6le.\\nVitamiini B6 puudus\\nVitamiin B6 defitsiidiga
  on t\u00e4heldatud:\\n- aneemia\\n- t\u00e4helepanu ja m\u00e4lu\\n- \u00e4rrituvus\\n-
  letargia ja disinhibition\\n- apaatia, unisus\\n- isukaotus\\n- iiveldus\\n- suurenenud
  aterosklerootiliste protsesside oht (veresoonte seinte naastude moodustumine);\\n-
  veenide ja veresoonte h\u00e4ired.\\nSelle vitamiini puudumine p\u00f5hjustab keelekestuse
  p\u00f5letikku, huulte pragusid, stomatiiti, naha suurenenud kuivuse tekkimist,
  dermatiiti (eriti nasolabiaalses voldis, peanahal, silmade ja kulmude l\u00e4hedal)
  ja muid ebameeldivaid nahahaigusi.\\nP\u00f5hilised B6-vitamiini defitsiidid organismis
  on:\\n- tasakaalustamata toitumise (liigne valk) t\u00f5ttu\\n- raseduse ajal\\n-
  raske f\u00fc\u00fcsiline pingutus\\n- v\u00f5tma suuri annuseid alkoholi,\\n- suitsetamise
  ajal\\n- mitmete ravimite (antibiootikumid, rasestumisvastased tabletid, tuberkuloosivastased
  ravimid ja antikonvulsandid jne),\\n- mitmete haiguste (hepatiit, sooleinfektsioonid).\\nVajadus
  B6-vitamiini j\u00e4rele v\u00f5ib suureneda, kui t\u00f6\u00f6tab ebasoodsates
  tingimustes, n\u00e4iteks k\u00fclmas v\u00f5i \u00e4\u00e4rmises kuumuses, kokkupuutel
  toksiliste kemikaalide ja muude kahjulike \u00fchenditega.\\nToit on k\u00f5rge
  vitamiiniga B6\\nLooduslikud allikad B6-vitamiin sisaldab:\\n- kala, liha, rups,\\n-
  piimatooted\\n- munad;\\n- kartul\\n- maasikas\\n- avokaado\\n- tsitrusviljad (sidrunid
  ja apelsinid),\\n- lillkapsas ja valge peakapsas\\n- herned\\n- magus kirss\\n-
  porgand\\n- spinat\\n- Nisu ja muude teraviljade idandatud terad\\n- p\u00e4hklid
  (p\u00e4hkel ja sarapuup\u00e4hkel),\\n- mitmesugused teraviljad.\\nV\u00e4ike kogus
  seda ainet s\u00fcnteesitakse inimese soole asustatud probiootiliste mikroorganismide
  poolt.\\nVitamiin B6 imendub k\u00f5ige paremini koos magneesiumiga (Mg).\\nIgap\u00e4evane
  B6-vitamiini tarbimine\\nB6-vitamiini p\u00e4evane tarbimine: imikutele 0,3-0,6
  mg, lapsed vanuses 1 kuni 10 aastat - 0,7-1,4 mg, noorukid (poisid) - 1,7-2 mg,
  noorukid (t\u00fcdrukud) - 1,4-1,5 mg, t\u00e4iskasvanud - 2 mg, rasedad ja imetavad
  naised - 2 kuni 6 mg (ja rohkem, t\u00e4pne annus m\u00e4\u00e4ratakse arsti poolt
  igal \u00fcksikjuhul individuaalselt).\\nV\u00e4ga suurte vitamiinide (tavaliselt
  1... 00... 150 korda suurem soovitatavast m\u00e4\u00e4rast) korral v\u00f5ib tekkida
  h\u00fcpervitaminoos. See ilmneb j\u00e4semete, kramplikuste, jalgade ja k\u00e4te
  kipituste, m\u00e4lu kaotuse tuimusest.\\nSee on t\u00e4htis! P\u00fcridoksiin on
  v\u00e4ga oluline v\u00e4ikelaste ja eakate jaoks, et s\u00e4ilitada k\u00f5rge
  immuunsusstabiilsus ja kaitsta keha \u00f5hus levivate nakkuste eest (viirus- ja
  bakteriaalne).\\nVitamiin B6 (p\u00fcridoksiin) - toime, n\u00e4idustused, igap\u00e4evane
  vajadus\\nMiks on B6-vitamiin nii oluline inimese keha jaoks ja kelle jaoks see
  on eriti vajalik? Millised tooted sisaldavad p\u00fcridoksiini? Kasutamisn\u00e4hud,
  samuti h\u00fcpogl\u00fckeemia ja h\u00fcpervitaminoos.\\nToidus leidub B6-vitamiini
  kolmes vormis: p\u00fcridoksamiin, p\u00fcridoksaal, p\u00fcridoksiin. P\u00fcridoksiin
  on m\u00f5ru maitsega v\u00e4rvitu kristall.\\nB6-vitamiini avastamine\\nSelle vitamiini
  avastamise ajalugu on seotud pellagra - t\u00f5sise haigusega, mis oli levinud kuni
  viimase sajandi keskpaigani - ravimite otsimiseni. 1926. aastal j\u00f5udis Goldberg
  j\u00e4reldusele, et pellagra manifestatsioon ei ole vitamiinide B1 ja B2 m\u00f5ju
  suhtes vastuv\u00f5tlik, kuid neid m\u00f5jutab loomadele manustatud p\u00e4rm.
  P\u00e4ris teadaolev komponent, mida nimetatakse \\\"roti teguriks\\\". Pisut hiljem,
  1936. aastal, oli v\u00f5imalik seda isoleerida ja s\u00fcnteesida. Teda kutsuti
  B6-vitamiiniks. Kuid ta ei suutnud ravida inimese pellagra - p\u00f5hjus oli vitamiin
  PP puudumine (nikotiinhape).\\nVarsti teadlased m\u00f5istsid, et aminohapete (valkude
  komponentide) transaminatsioon on v\u00f5imalik ainult p\u00fcridoksiini osalusel.\\nJa
  ainult 1944. aastal suutis Ameerika nimega E. Snell isoleerida veel 2 sellist vitamiini:
  p\u00fcridoksaali ja p\u00fcridoksamiini.\\nB6-vitamiini toime\\nVitamiini B6 k\u00f5ige
  t\u00e4htsam \u00fclesanne on tagada aminohapete vahetamine ja neid tihti v\u00f5rreldakse
  oluliste (ja mitte ainult) valkude \\\"ehitusplokkidega\\\". Tervis s\u00f5ltub
  sellest, kuidas organism absorbeerib valkude kogust. Selgub, et lihast v\u00f5i
  proteiinisisaldusega rikastest tarbimisest, et nende komponentide imendumine keha
  \\\"tarbib\\\" maksa ja soolestikku, v\u00f5ime \u00f6elda, et k\u00f5ik p\u00fcridoksiinid
  ja see hakkab p\u00f5hjustama selle puudumist.\\nStressivastase v\u00f5itluse perioodil
  juhtub sama asi: kogu vitamiini reservi on ammendunud ja selle puudumine ilmub uuesti.
  K\u00f5ik see v\u00f5ib p\u00f5hjustada aminohapete metabolismi h\u00e4ireid ja
  erinevate haiguste esilekutsumist.\\nP\u00fcridoksiin on oluline ka s\u00fcsivesikute
  ainevahetuse jaoks: lihastes kogunenud s\u00fcsivesikud ja maksa sisenevad verre
  ja see annab rakkudele vajaliku koguse gl\u00fckoosi, et toota energiat.\\nKoostoimimine\\nP\u00fcridoksiin
  on \u00fcsna stabiilne isegi siis, kui seda kuumutatakse leelise juuresolekul. See
  lahustub vees ja et\u00fc\u00fclalkoholis. P\u00e4ikesevalguse poolt h\u00e4vitatakse
  kiiresti. Kui p\u00fcridoksiini v\u00f5etakse koos riboflaviiniga, siis imendub
  organism kehas 4 korda paremini.\\nFoolhappe ja kobalamiini juuresolekul muudab
  B6-vitamiin aminohappe metioniini \u00fchendiks, mis on vajalik sidekoe tugevdamiseks.
  Kui need vitamiinid rakus puuduvad, hakkab tekkima kahjulik aine, mis p\u00f5hjustab
  luukoe negatiivseid muutusi.\\nKontratseptiivsed pillid h\u00e4vitavad B6-vitamiini
  ainult 3 tundi p\u00e4rast nende ravimite v\u00f5tmist, v\u00e4hendab B6 taset veres
  20% v\u00f5rra.\\nAntikonvulsandid ja tuberkuloosivastased ravimid v\u00f5ivad samuti
  p\u00f5hjustada selle puudust.\\nTooted, mis sisaldavad vitamiini B6\\nNisuiduud,
  banaanid, sojaoad, spinat, avokaadod, kliid, kreeka p\u00e4hklid, kodulinnud, kalad,
  maks.\\nIgap\u00e4evane vajadus vitamiini B6 j\u00e4rele\\nT\u00e4iskasvanu jaoks
  on see vajadus 2-3 mg p\u00e4evas.\\nSuurenenud B6-vitamiini annuseid kasutatakse
  j\u00e4rgmistel juhtudel:\\n- S\u00fcdamehaigus;\\n- Kontratseptiivide v\u00f5tmine;\\n-
  Suhkru puudumine veres;\\n- Ps\u00fchholoogiline ja f\u00fcsioloogiline stress;\\n-
  Nakkushaigused;\\n- Rasedus ja rinnaga toitmine;\\n- Spordi\u00fcritused;\\n- Raske
  f\u00fc\u00fcsiline pingutus;\\n- Menstruaalts\u00fckli ajal;\\n- Menopausi algusega;\\n\u00dcleannustamise
  ja nappuse tagaj\u00e4rjed\\nH\u00fcpovitaminoos:\\n- Tekib desorientatsioon, m\u00e4lu
  ja t\u00e4helepanu on h\u00e4iritud;\\n- Aneemia hakkab arenema;\\n- S\u00f6\u00f6giisu
  v\u00e4henemine ja kehamass;\\n- Ilmuvad v\u00e4simus, erutusv\u00f5ime ja peavalu;\\n-
  Nahk on sidrunikollane, ilmneb dermatiit.\\nH\u00fcpervitaminoosi iseloomustab asjaolu,
  et j\u00e4semetes on h\u00e4iritud vereringe ja m\u00f5nel juhul tekivad allergilised
  reaktsioonid. Annused vahemikus 200 kuni 5000 mg p\u00f5hjustavad jalgade ja k\u00e4te
  tuimust ja n\u00f5rgendamist, samasugustes tundlikes piirkondades kaotus.\\nIgap\u00e4evane
  vajadus vitamiini B6 j\u00e4rele\\nVitamiin B6 (p\u00fcridoksiin)\\nP\u00fcridoksiini
  avastamine\\nP\u00fcridoksiini avastamise ajalugu on seotud pellagra, raske haiguse,
  mis oli laialt levinud kuni eelmise sajandi keskpaigani, raviks. Goldberger 1926.
  aastal j\u00f5udis j\u00e4reldusele, et pellagra manifestatsioonid ei ole v\u00f5imelised
  m\u00f5jutama vitamiine B1 ja B2, kuid neid m\u00f5jutavad loomadele toitnud p\u00e4rm.
  P\u00e4rmi teadmata komponenti nimetati \\\"roti teguriks\\\" ja hiljem 1936. aastal
  oli see juba v\u00f5imeline isoleerima, s\u00fcnteesima seda ja nimetama seda vitamiiniks
  B6. Kuid inimese pellagra ei saanud k\u00f5veneda - s\u00fc\u00fcdi oli nikotiinhappe
  (vitamiin PP) puudumine.\\nVarsti leidsid teadlased, et aminohapete (valkude komponendid)
  transamiinimise protsess on v\u00f5imalik ainult p\u00fcridoksiini osalusega.\\nJa
  ainult 1944. aastal suutis Ameerika E. Snell isoleerida veel 2 sellist vitamiini:
  p\u00fcridoksamiini ja p\u00fcridoksaali.\\nB6-vitamiini toime\\nB6-vitamiini k\u00f5ige
  t\u00e4htsam tegevus on tagada oluliste valkude \\\"ehitusplokkide\\\" asendamine
  aminohapetega. Tervislik seisund s\u00f5ltub sellest, kui palju meie organism absorbeerib
  valkude kogust. Seega, liha v\u00f5i proteiini toiduse \u00fclem\u00e4\u00e4rase
  tarbimise korral keha \\\"tarbib\\\" peaaegu kogu p\u00fcridoksiini maksast ja soolest,
  mis on selle puudumise p\u00f5hjuseks.\\nSama asi juhtub stressi vastu v\u00f5itlemise
  ajal: kogu vitamiini reservi on kahanenud ja selle puudumine tekib uuesti. K\u00f5ik
  see p\u00f5hjustab aminohapete ainevahetuse ja erinevate haiguste ilmnemise rikkumist.\\nP\u00fcridoksiin
  m\u00e4ngib samuti olulist rolli s\u00fcsinikuvahetusreaktsioonides: maksas ja lihastes
  kogunenud s\u00fcsinik l\u00e4heb vereringesse, mis annab rakkudele vajaliku koguse
  gl\u00fckoosi energia tootmiseks.\\nVitamiini B6 koostoime\\nIsegi kuumutamisel
  leeliste ja hapete juuresolekul on p\u00fcridoksiin \u00fcsna stabiilne. See on
  vees ja et\u00fc\u00fclalkoholis lahustuv. P\u00e4ikesevarjud h\u00e4vitavad selle
  kiiresti. Riboflaviiniga v\u00f5etuna p\u00fcridoksiin imendub kehas 4 korda paremini.\\nKobalamiini
  ja foolhappe manulusel muundab B6-vitamiin aminohappe metioniini \u00fchendiks,
  mis on vajalik sidekoe tugevdamiseks. Nende vitamiinide puudumisel rakkudes hakkab
  moodustuma kahjulik aine, mis p\u00f5hjustab luukoe negatiivseid muutusi.\\nVitamiin
  B6 h\u00e4vitab rasestumisvastaseid tablette (suukaudsed rasestumisvastased vahendid):
  3 tundi p\u00e4rast nende ravimite v\u00f5tmist v\u00e4hendatakse selle taset veres
  20% v\u00f5rra.\\nAnti-tuberkuloos, krambivastased ravimid v\u00f5ivad samuti p\u00f5hjustada
  puudust.\\nMillised toidud sisaldavad B6-vitamiini?\\nNisu terade, sojaubade, banaanide,
  avokaado (teada saada avokaado omadustest), spinat, kreeka p\u00e4hklid, kliid,
  kodulinnud, maks, kalad.\\nIgap\u00e4evane vajadus B6\\nT\u00e4iskasvanu jaoks on
  see 2-3 mg p\u00e4evas.\\nVitamiini B6 suurendamine on vajalik j\u00e4rgmistel juhtudel:\\n-
  F\u00fcsioloogiline ja ps\u00fchholoogiline stress;\\n- S\u00fcdamehaigus;\\n- Raske
  f\u00fc\u00fcsiline tegevus ja sport;\\n- Kontratseptiivide v\u00f5tmine;\\n- Nakkushaigused;\\n-
  Suhkru puudumine veres;\\n- Rasedus ja rinnaga toitmine;\\n- Menopausi alguse ja
  menstruaalts\u00fckli ajal.\\nP\u00fcridoksiini defitsiidi tagaj\u00e4rjed ja \u00fcleannustamine\\nH\u00fcpovitaminoos:\\n-
  S\u00f6\u00f6giisu kaotamine ja kehakaalu kaotus;\\n- Areneb aneemia (loe aneemia
  muudest p\u00f5hjustest);\\n- On disorientatsioon, m\u00e4lu, t\u00e4helepanu on
  h\u00e4iritud;\\n- Nahk muutub sidruni-kollaseks varju, tekib dermatiit;\\n- On
  peavalu, erutusv\u00f5ime, v\u00e4simus.\\nH\u00fcpervitaminoosi iseloomustab j\u00e4semete
  vereringe halvenemine ja m\u00f5nel juhul allergiliste reaktsioonide ilmnemine.
  Annused vahemikus 200 kuni 5000 mg tekitavad k\u00e4te ja jalgade tuimust ja kipitust,
  nendes samades piirkondades esinevat sensatsiooni kaotust.\\nVitamiini B6 n\u00e4ited\\n-
  B6 h\u00fcpovitaminoos;\\n- Aneemia;\\n- Rasedate toksikoloogia;\\n- Leukopeenia;\\n-
  N\u00e4rvis\u00fcsteemi haigused (neuriit, radikuliit, parkinsonism, v\u00e4ikehaigused,
  neuralgia);\\n- \u00d5hus ja merep\u00f5letik;\\n- Meniire''i t\u00f5bi;\\n- \u00c4ge
  ja krooniline hepatiit;\\n- Dermatiit;\\n- Laste autism ja enurees.\\nMeeldib see
  artikkel? Jagage seda oma s\u00f5pradega sotsiaalsete vahendite kaudu! Sotsiaalse
  v\u00f5rgustiku nupu kaks klikki kulutades vaid 10 sekundit oma ajast, aitate meie
  projekti. T\u00e4nan teid!\\nSeonduvad uudised\\nVitamiin B7 (vitamiin H, biotiin)\\nVitamiin
  B3 (nikotiinhape, vitamiin PP, niatsiin)\\nB17-vitamiin (am\u00fcgdaliin, kollane)\\nVitamiin
  B13 (orotok, urats\u00fc\u00fclkarboks\u00fc\u00fclhape)\\nVitamiin B12 (ts\u00fcanokobalamiin)\\nVitamiin
  B1 (tiamiin)\\nVitamiin B6 toidus\\nVitamiin B6 v\u00f5i p\u00fcridoksiin on vees
  lahustuvat B-vitamiini, mis ei kumuleeru kudedes, see eritub uriiniga ja on toodetud
  teatud koguses soole mikrofloorale soolte ja maksa jaoks.\\nVitamiin B6 leidub nii
  taime- kui loomas\u00f6\u00f6das. Sellep\u00e4rast ei ole p\u00fcridoksiini puudumine
  t\u00fc\u00fcpiline, kuna tasakaalustatud toitumise korral ei ole t\u00e4iendavat
  tarbimist vaja.\\nIgap\u00e4evane vajadus B6-vitamiini j\u00e4rele - 2 mg t\u00e4iskasvanule.
  Siiski on inimesi vaja mitut kategooriat\\n- suurendada seda annust kuni 5 mg:\\nR\u00e4\u00e4gime
  vitamiini B6 olemasolust toidus.\\nVitamiin B6 toodetes kuumt\u00f6\u00f6tlemise
  ajal h\u00e4vib ainult 25-30%, samal ajal kui k\u00fcpsetamise ajal j\u00e4\u00e4b
  m\u00f5ni vitamiin veest v\u00e4lja. P\u00fcridoksiin kahjustab p\u00e4ikesevalgust.\\nB6-vitamiini
  olulised omadused seisnevad peamiselt valkude, antikehade ja hemoglobiini s\u00fcnteesi
  osalemises. P\u00fcridoksiin m\u00e4ngib olulist rolli rasvade, valkude, s\u00fcsivesikute,
  samuti ens\u00fc\u00fcmide moodustumisel. P\u00fcridoksiin on vajalik aju ja n\u00e4rvis\u00fcsteemi
  normaalseks toimimiseks. Ta osaleb aminohapete ja nukleiinhapete s\u00fcnteesis.\\nIgap\u00e4evases
  toidurajatises on vaja lisada B6-vitamiine sisaldavaid tooteid, sest ilma selleta
  rikutakse B12 imendumist ja Mg-ga seotud \u00fchendeid.\\n- \u00e4rrituvus;\\n-
  apaatia, unisus;\\n- krambid, j\u00e4semete tuimus;\\n- praod suu nurkades;\\n-
  huulte praod;\\n- kuiv nahk;\\n- isukaotus;\\n- kasvu katkestamine (lastel).\\nB6
  puudus esineb soolestiku infektsioonide, maksapuudulikkuse, kiiritushaiguse korral.
  P\u00fcridoksiini imendumine ja antibiootikumid, rasestumisvastased tabletid ja
  tuberkuloosivastased ravimid halvenevad.\\n\u00dcleannustamine\\nM\u00fcrgitus vitamiiniga
  B6 on v\u00f5imalik ainult pika annusega \u00fcle 100 mg p\u00e4evas. Sellisel juhul
  v\u00f5ib tekkida iiveldus, j\u00e4semete tundlikkuse kaotus.\\nVitamiin B6 (p\u00fcridoksiin),
  milles on tooted, vitamiini B6 roll ja t\u00e4htsus, vitamiin B6 vajadus, vitamiin
  B6 puudumine ja liigne sisaldus\\nVitamiin B6. tuntud kui p\u00fcridoksiin. lahustub
  vees ja seet\u00f5ttu kergesti organismist v\u00e4lja. P\u00fcridoksiin on vastupidav
  hapniku ja soojuse toimele, kuid see h\u00e4vitab valguse.\\nInimesel peaks B6-vitamiin
  alati olema k\u00fcllaldane, sest see on vajalik k\u00f5ikide rakkude ja kudede
  jaoks, nii et peate oma varusid pidevalt t\u00e4iendama - see on k\u00f5ige parem
  toiduga, kuid v\u00f5ite v\u00f5tta spetsiaalseid toidulisandeid.\\nMillised toidud
  sisaldavad vitamiini B6 (p\u00fcridoksiini), vitamiin B6 allikaid?\\nP\u00fcridoksiini
  leidub paljudes toitudes, kuid loomsetes saadustes on see m\u00f5nev\u00f5rra rikkalikum:
  munad, krevetid, austrid, l\u00f5he, tuunikala, sink, kana liha, jahvatatud veiseliha
  ja lambaliha, maks, kodujuust, juust ja muud piimatooted.\\nTaimsed tooted on p\u00fcridoksiinist
  \u00fcsna rikkaks: seemnenud terad, kartulid, herned, kapsas, porgandid, tomatid,
  oad, l\u00e4\u00e4tsed, sojaoad, lehtk\u00f6\u00f6giviljad, palju teravilju ja teravilju,
  p\u00e4rmi, p\u00e4hkleid, seemneid, marju ja puuvilju. Suur osa B6-vitamiini banaanides.\\nAlates
  maitsetaimedest on vitamiin B6 rikkalikult lutsern, kartulikas, kanep, kaera\u00f5led.
  Lisaks s\u00fcnteesitakse p\u00fcridoksiin tavap\u00e4rase soolestiku mikrofloora
  abil.\\nB6-vitamiini (p\u00fcridoksiini) roll ja t\u00e4htsus\\nP\u00fcridoksiin
  t\u00e4idab palju organismis \u00fclesandeid, mille peamiseks eesm\u00e4rgiks on
  tagada aminohapete normaalne t\u00f6\u00f6tlemine. On teada, et valgumolekulid on
  valmistatud aminohapetest, seet\u00f5ttu, kui vitamiini B6 ei piisa, tekivad paljud
  haigused.\\nAminohapete t\u00f6\u00f6tlemisel ja valkude assimilatsioonil on vajalik
  ens\u00fc\u00fcm, mis s\u00fcnteesitakse maksas p\u00fcridoksiiniga. Tugeva stressi
  all toodavad aminohapped aktiivseid valke - ja see n\u00f5uab rohkem p\u00fcridoksiini.\\nKaasaegne
  mees liigub ja kulutab palju v\u00e4hem energiat kui need, kes s\u00f5na otseses
  m\u00f5ttes elasid 100-150 aastat tagasi, nii et toidust on piisavalt aminohappeid,
  et anda energiat lihastele - muidugi, kui te pole sportlane.\\nKuid ps\u00fchholoogiline,
  n\u00e4rviline, vaimne stress on t\u00e4nap\u00e4eval k\u00fcmme korda suurem kui
  meie esivanemate puhul. V\u00f5ibolla see v\u00f5ib olla piisavalt valku, kuid vitamiin
  B6, et neid assimileerida tavaliselt, ei piisa. Seet\u00f5ttu soovitavad enamik
  eksperte, et inimesed, kelle t\u00f6\u00f6 on seotud pideva stressiga, kasutavad
  sageli p\u00fcridoksiiniga rikkaid tooteid v\u00f5i v\u00f5tavad seda osa toidulisanditest.
  V\u00f5tke \u00fcks vitamiin ei tohiks olla - see on suur viga, eriti seoses B-vitamiinidega,
  mis toimivad t\u00f5husalt ainult kompleksis.\\nP\u00fcridoksiin osaleb ka punaste
  vereliblede ja hemoglobiini tootmises; s\u00e4ilitab kaalium- ja naatriumi tasakaalu
  k\u00f5ikides kehavedelikes, mis on v\u00e4ga oluline n\u00e4rvis\u00fcsteemi normaalseks
  toimimiseks, m\u00e4lu ja aju toimimiseks.\\nIlma B6-vitamiinita pole v\u00f5imatu
  mitte ainult normaalne valkude metabolism, vaid ka rasvade ja s\u00fcsivesikute
  metabolism. N\u00e4rvirakkudes gl\u00fckoosi \u00fchtlane sisaldus n\u00f5uab palju
  p\u00fcridoksiini, nii et peaaegu pool kehas sisalduvast p\u00fcridoksiinist kasutatakse
  seda s\u00fcsivesikute esilekutsumiseks veres.\\nVitamiin B6 tugevdab immuuns\u00fcsteemi,
  kuna see soodustab antikehade moodustumist, mis kaitsevad immuuns\u00fcsteemi stimuleerivat
  organismi ja rakke. Kui p\u00fcridoksiin on t\u00f5siselt ebaadekvaatne, muutub
  kehav\u00e4hi immuuns\u00fcsteemi keskosa keskmisest inimesest rohkem kortsus kui
  vanemad inimesed, kellel on p\u00fcridoksiini kogus peaaegu normaalne.\\nInimesed,
  kellel on s\u00fcdamehaiguste ja veresoonte arenemise t\u00f5en\u00e4osus, vajavad
  p\u00fcridoksiini suures koguses: see ei v\u00f5imalda vere paksenemist, takistab
  ateroskleroosi, s\u00fcdameataktsiooni ja insuldi arengut, normaliseerib verer\u00f5hku.
  Normaalne maksafunktsioon s\u00f5ltub ka B6-vitamiini sisaldusest organismis.\\nVitamiini
  B6 puudus\\nVitamiin B6 puudus v\u00f5ib p\u00f5hjustada enam kui sada erinevat
  haigust. N\u00e4iteks valkude puhul, kui nad ei imendu selle vitamiini puudumise
  t\u00f5ttu ja keha lihtsalt neid ei saa, siis tekivad kroonilised haigused. Teine
  n\u00e4ide: inimene s\u00f6\u00f6b palju valku, eriti looma, ja siis tuleb neid
  k\u00f5iki seedida p\u00fcridoksiiniga. Sellisel juhul v\u00f5etakse p\u00fcridoksiin
  maksast, soolest ja rakkudest, samas kui teistel elunditel ja s\u00fcsteemidel puudub
  see.\\nKahjuks kogeme stressi v\u00e4ga tihti ja sellistes olukordades kulutame
  kogu p\u00fcridoksiini, mis v\u00f5ib olla reservi - see s\u00f5na otseses m\u00f5ttes
  \\\"sulab\\\", pestakse rakkudest ja kudedest. Valkude metabolismi h\u00e4irimine
  on \u00fcsna lihtne, ja siis on see v\u00e4ga raske taastuda.\\nP\u00fcridoksiini
  puudumine h\u00e4irib vedelikus oleva naatriumi ja kaaliumisisalduse ja vesi hakkab
  kehas kogunema. Seega esineb turse: jalgadel, k\u00e4tel, n\u00e4ol ja isegi suur
  maos v\u00f5ib olla tingitud puudumisest B6-vitamiini.\\nKui n\u00e4rvirakkude \u00f5igeaegseks
  manustamiseks gl\u00fckoosiga pole piisavalt p\u00fcridoksiini, siis saab inimene
  kiiresti v\u00e4simuse, muutub n\u00e4rviliseks, ei uni h\u00e4sti ja tunneb depressiooni.
  Sellised inimesed ei suuda tavaliselt lahendada isegi k\u00f5ige levinumaid probleeme
  - nii t\u00f6\u00f6l kui igap\u00e4evaelus.\\nKuid nad on kergesti \u00e4rritunud,
  sageli agressiivsed, mille tagaj\u00e4rjel neerupealised sekreteerivad adrenaliini.
  Vere suhkrusisaldus t\u00f5useb, gl\u00fckoosireservid p\u00f5letakse ja n\u00e4rvilisus
  muutub veelgi tugevamaks - seet\u00f5ttu kannatavad t\u00e4nap\u00e4eval \u00fcha
  rohkem inimesi erinevate depressioonivormide all. On olemas t\u00f5eline n\u00f5iaring,
  mille v\u00e4ljapaiskumine pole v\u00f5imalik, kuigi peate hoolitsema ainult p\u00fcridoksiini
  \u00f5igeaegse vastuv\u00f5tmise eest organismis, samuti muid vajalikke aineid.\\nIgap\u00e4evane
  vajadus vitamiini B6 (p\u00fcridoksiini) j\u00e4rele\\nKui palju vitamiini B6 me
  vajame p\u00e4evas? T\u00e4iskasvanud vajavad umbes 2-3 mg, rasedatele ja imetavatele
  naistele on see m\u00e4\u00e4r veidi suurem. Menstruatsiooni ajal ja p\u00fcridoksiini
  suukaudsete kontratseptiivide v\u00f5tmisel peavad naised ka rohkem olema; s\u00fcdame-veresoonkonna
  haiguste korral, h\u00fcpogl\u00fckeemia, infektsioonid, vajadus selle j\u00e4rele
  ka suureneb.\\nKuna p\u00fcridoksiin ei kogune kehas, tuleb seda pidevalt s\u00f6\u00f6ta.
  Ja siin on igasuguste toitumisharjumuste austajad eriti haavatavad: p\u00fcridoksiin
  on kiiresti tarbitud ja v\u00e4ga v\u00e4hesed neist sisenevad. Sel juhul peaksite
  v\u00f5tma toidulisandeid - n\u00e4iteks p\u00e4rmi kujul.\\n\u00dcleliigne vitamiin
  B6 (p\u00fcridoksiin)\\nP\u00fcridoksiini \u00fclej\u00e4\u00e4k praktiliselt ei
  esine, sest see eritub kiiresti uriiniga. Kui te v\u00f5tate v\u00e4ga suurt annust
  s\u00fcstete v\u00f5i pillide kujul, v\u00f5ib selja ja jalgade tuimus muutuda l\u00fchiajaliseks
  n\u00e4rvis\u00fcsteemiks. K\u00f5ik need s\u00fcmptomid kaovad niipea, kui p\u00fcridoksiin
  elimineeritakse kehast.\\nVitamiin B6 (p\u00fcridoksiini) interaktsioon\\nVitamiin
  B6 aktiivselt suhtleb teiste oluliste vitamiinide ja mineraalidega: koos kaltsiumiga
  aitab see s\u00fcdant ja lihaseid t\u00f6\u00f6tada; T\u00e4nu teda kasutatakse
  t\u00f5husalt gl\u00fckoosi; Raud, vask ja tsink, mis interakteeruvad p\u00fcridoksiiniga,
  on kaasatud heme s\u00fcnteesi - kompleksi, mis on osa hemoglobiinist ja annab verele
  punaseid vereliblesid.\\nKombineerides vitamiin B9 (foolhape), reguleerib p\u00fcridoksiin
  kolesterooli kogust veres ja kui te lisate neile selle r\u00fchma vitamiine - B1
  ja B12, siis kaitstakse kardiovaskulaars\u00fcsteemi.\\nKuidas s\u00e4ilitada vitamiin
  B6 (p\u00fcridoksiin)?\\nAlkoholi suitsetamise ja joomise ajal on p\u00fcridoksiini
  imendumine halvem; lihav\u00f5tjad vajavad p\u00fcridoksiini mitu korda rohkem kui
  need, kes j\u00e4rgivad tasakaalustatud toitu; diabeedi korral v\u00f5ib vitamiini
  B6 \u00f5igeaegne manustamine insuliinis\u00f5ltuvust veidi v\u00e4hendada.\\nVitamiin
  B6 h\u00e4vib pikaaegse ladustamise, konserveerimise, r\u00f6stimise ja pika valmimisega
  toodete puhul, samuti toiduvalmistamisel suures koguses vett. Seet\u00f5ttu on parem
  s\u00fc\u00fca k\u00f6\u00f6givilju, samuti aurutatud liha ja kala, v\u00f5i k\u00fcpsetada
  ahjus.\\nToidu k\u00fclmutamine, hoides seda valguses, h\u00e4vitab ka p\u00fcridoksiini;
  teravilja t\u00f6\u00f6tlemine ei j\u00e4ta neile mitte ainult p\u00fcridoksiini,
  vaid praktiliselt mitte midagi kasulikku, seega peaksite s\u00f6\u00f6ma v\u00e4hem
  leiba ja k\u00fcpsetatud valmistatud k\u00f5rgekvaliteetsest valgest jahuost.\\nProovige
  k\u00fclmutada toitu v\u00e4hem ja keelduda kodus konserveerimise \u00fcldse - meie
  vanaemad s\u00e4ilitada palju rohkem toitaineid, kui nad kuivatatud rohelised, koristatud
  marinaadid, moosid, keedetud ja leotatud k\u00f6\u00f6giviljad ja puuviljad. Proovige
  s\u00e4ilitada vitamiine k\u00f5ikidel v\u00f5imalikel viisidel ja te ei pea v\u00f5itlema
  h\u00fcpovitaminoosiga kas talvel v\u00f5i kevadel.\\nVitamiin B6 (p\u00fcridoksiin)
  - \\\"k\u00f5igist haigustest\\\"?\\nVitamiinid, nagu me teame, antakse tavaliselt
  erilist tervendavat omadust. N\u00e4iteks A-vitamiin \\\"\u00f6\u00f6pimedusest\\\",
  C-vitamiin - \\\"k\u00fclmast\\\", B1 - \\\"n\u00e4rvidest\\\", B2 - nahk (\\\"ilu
  eest\\\"), B3 - \\\"aju jaoks\\\", B5 - \\\"elu j\u00e4tkamiseks\\\" D - \\\"asendab
  p\u00e4ikest\\\". Kuid B6-vitamiini ei ole veel m\u00e4\u00e4ratud asjakohaseks,
  sest sellel on v\u00e4ga lai t\u00f6\u00f6projekt.\\nVitamiin B6 (p\u00fcridoksiin)
  on organismile v\u00e4ga oluline, sest see parandab k\u00fcllastumata rasvhapete
  imendumist. Koos kaltsiumiga aitab see kaasa lihaste ja s\u00fcdame normaalsele
  toimimisele ning nende efektiivsele l\u00f5dvestumisele. Leiti, et vitamiin B6 puudumisel
  v\u00f5ib tekkida keskk\u00f5rva p\u00f5letik.\\nP\u00fcridoksiin (vitamiin B6)
  on seotud paljudes keemiates esinevatest keemilistest reaktsioonidest. Seda v\u00f5ib
  pidada ens\u00fc\u00fcmide hoidlaks. Teisis\u00f5nu, ilma selleta on elu s\u00fcndimine
  ja s\u00e4ilimine v\u00f5imatu. Ta m\u00e4ngib olulist rolli rasvade ja valkude
  ainevahetuses. Mida rohkem inimene neid tarbib, seda rohkem on vaja vitamiini B
  (samuti C-vitamiini). Pealegi on toidule assimilatsiooniks l\u00f5pp-produkt oksaalhape.
  Kuid kui kehas on v\u00e4he B6-vitamiini, on \u00fcks ens\u00fc\u00fcmidest (transaminaas)
  blokeeritud ja ilma selleta ei saa oksaalhapet lahustuvateks \u00fchenditeks muundada.
  Ja siis oksaalhape \u00fchendab kaltsiumi ja moodustab oksalaadid, mis sadestuvad
  liiva ja neerukivide kujul.\\nHaruldaste arterite (Journal of Urology, 1974, oktoober)
  poolt kirjeldati huvitavat meetodit urolitiaasiga patsientide ravimiseks: viie aasta
  jooksul raviti 79% patsientidest t\u00e4ielikult. Neile anti 300 mg magneesiumi
  ja 10 mg p\u00fcridoksiini (s.o vitamiin B6). M\u00f5lemad ravimid aeglustavad oksaalhappe
  moodustumist ja juba uriinis ei olnud. Harvardi arstide s\u00f5nul on selline ravi
  \\\"mugav, odav ja t\u00e4iesti ohutu\\\", lisaks v\u00f5ib B6-vitamiini pidada
  suurep\u00e4raseks looduslikuks diureetikaks.\\nUngari p\u00e4ritolu ameeriklane
  Albert Sainte-Diery austab avastamist mitmete vitamiinide korraga: askorbiinhape,
  tiamiin, riboflaviin, biotiin ja p\u00fcridoksiin (1934. aastal). Enam kui 20 aastat
  \u00f5ppis ta B6-vitamiini ja j\u00f5udis j\u00e4reldusele, et rinnaga toitvatele
  emadele tuleks seda kasutada 2 mg ja rasedatele 2,5 mg-ni 20-25 mg (peaaegu 10 korda).\\nSelle
  aine t\u00e4iendav \\\"v\u00f5imas\\\" osa on vajalik j\u00e4rgmistesse kategooriatesse
  kuuluvate inimeste jaoks:\\n-naised, kes v\u00f5tavad rasestumisvastaseid vahendeid
  v\u00f5i pillid ja k\u00f5ik ravimid, mis sisaldavad \u00f6strogeeni;\\n-rasedad
  naised, kelle kehas on tohutu hulga \u00f6strogeene, on raseduse l\u00f5puks m\u00f5nikord
  vitamiin B6 vaja tuhandeid kordi rohkem kui norm;\\n-premenstruaalts\u00fckli viimase
  kahe n\u00e4dala jooksul, kui organism toodab k\u00f5ige rohkem \u00f6strogeene;\\n-iga\u00fcks,
  kes kasutab steroide sisaldavaid ravimeid, n\u00e4iteks kortisooni;\\n-need, kes
  k\u00f5ikidest j\u00f5upingutustest hoolimata ei saa kaalust alla v\u00f5tta (p\u00f5hjuseks
  v\u00f5ib olla vitamiini B6 puudumine);\\n-Aknega noorukid, mis on tingitud rasvade
  n\u00e4\u00e4rmete suurenenud aktiivsusest ja raskesti ravitavast. L\u00f6\u00f6ve
  v\u00f5ib kaotada salvi kasutamisel 5 kuni 21 p\u00e4eva jooksul, mis sisaldab 10
  v\u00f5i isegi 50 mg vitamiini B6 1 g koore kohta (rasv). Esialgu s\u00fcgelemine
  peatub, siis toimub koorimine ja l\u00f5puks naha punetus kaob.\\nVitamiini B6 puudus.\\nKuidas
  m\u00e4\u00e4rata B6-vitamiini puudumist kehas?\\nSee pole v\u00e4ga lihtne. N\u00e4iteks
  kui pahkluu tagak\u00fcljel ilmnevad \u00e4kki \u00f6\u00f6sel p\u00f5rguvalu, nii
  tugev, et te voodist v\u00e4lja h\u00fcppate, v\u00f5ite eeldada, et teil pole piisavalt
  vitamiini B6 (kuid see v\u00f5ib olla m\u00e4rk sellest, et puudub E-vitamiin v\u00f5i
  magneesium). Kui k\u00e4tes on v\u00e4ike v\u00e4risemine, silmalaugude \u00e4rritus,
  siis ei maganud h\u00e4sti, teil on halb m\u00e4lu - need pole vananemise m\u00e4rke,
  vaid ainult vitamiini B6 ja magneesiumi puudumise s\u00fcmptomid!\\nKuulsa Ameerika
  toitumisspetsialisti A. Davis kirjutab oma raamatus \\\"Olge terved\\\", et vitamiin
  B6 pakub diabeedi raviks hindamatuid teenuseid. Kuid arst peab m\u00e4\u00e4rama
  annuse. A. Davis usub, et B6-vitamiini on v\u00f5imalik v\u00f5tta 10 kuni 50 mg
  p\u00e4evas, lisades sellele 500 mg magneesiumi. Enamik k\u00f5hun\u00e4\u00e4rmehaigustega
  seotud haigusi n\u00f5uavad peaaegu alati t\u00e4iendavat kogust vitamiini B6 ja
  sageli ka E-vitamiini. A. Davise s\u00f5nul v\u00f5ivad sellised s\u00fcmptomid,
  nagu iiveldus ja oksendamine operatsioonij\u00e4rgsetel patsientidel p\u00f5hjustada
  B6-vitamiini puudumine ja kiiresti kaduda, kui 10 mg v\u00f5i rohkem sellest vitamiinist.\\nLinus
  Paulingu s\u00f5nad on vaja meeles pidada: \\\"Arstid ignoreerivad asjaolu, et iga\u00fcks
  meist on molekulaarstruktuur erinev ja rakendab raviskeeme, mis ei arvesta seda
  erinevust. Kuid hoolimata sellest, et B6-vitamiini tase on tavaliselt 2 mg p\u00e4evas,
  peavad paljud meist 20 mg v\u00f5i isegi rohkem. \\\"\\nIgap\u00e4evane vajadus
  vitamiini B6 j\u00e4rele:\\nVitamiin B6 f\u00fcsioloogiline vajadus, mg p\u00e4evas:\\nB6-vitamiini
  tarbimise \u00fclempiir on 25 mg p\u00e4evas\\nRasvumise ja B6-vitamiini probleem\\nRasvumine
  on tsivilisatsiooni haigus. Inimesed on selle haiguse suhtes vastuv\u00f5tlikud,
  kuna nad liiguvad liiga v\u00e4he, nad t\u00f6\u00f6tavad f\u00fc\u00fcsiliselt
  v\u00e4he - masinad teevad seda nende jaoks; lisaks sageli toodetud toidu kogus
  \u00fcletab keha vajadusi, liigne \\\"k\u00fctus\\\" ladestub \u00fclem\u00e4\u00e4rase
  rasva kujul. Liigne rasva vabanemine kahel viisil. Esimene on toidu energia saamine
  t\u00e4pselt sellises koguses, mida keha n\u00f5uab, see t\u00e4hendab, et mitte
  s\u00fc\u00fca rohkem kui keha suudab imenduda. Teine v\u00f5imalus on suurendada
  f\u00fc\u00fcsilist aktiivsust. See tee on tervisele eriti oluline: see takistab
  liigse toitumise muutmist rasvaks.\\nS\u00fcda, mis suunab verd k\u00f5igile inimese
  keha elunditele, kudedele ja rakkudele, veresooned, mille kaudu kapillaarid voolavad
  - meie v\u00e4ikesed s\u00fcdamed, maks, kopsud, neerud, nahk, enneaegselt kuluvad
  ja n\u00f5rgendavad, kui peate s\u00e4ilitama liigse rasvkoe v\u00f5i t\u00fchik\u00e4igu
  lihaseid ja halvasti toimivad elundid. Seet\u00f5ttu on m\u00f5istlik f\u00fc\u00fcsiline
  t\u00f6\u00f6 vajalik igas vanuses. Peate sundima ennast tegema f\u00fc\u00fcsilist
  t\u00f6\u00f6d, et p\u00e4\u00e4sta keha \u00fclekaalulisusest. Ainult kaalulangus
  toitumine v\u00f5ib aidata.\\nDieet for dieters. Aastal 1977 sai Ameerika stiilis
  \\\"imeline, teaduslikult v\u00e4lja t\u00f6\u00f6tatud\\\" kehakaalu v\u00e4hendav
  dieet. Normaalse toiduga, mis sisaldab rohkesti puuvilju, puuvilju ja k\u00f6\u00f6givilju,
  50 mg vitamiini B6, 1 tl \u00f5unasiidri \u00e4\u00e4dikat, 1/2 tassi keedetud linaseemet
  (kuni 90% letsitiini), 1 kuni 2 multivitamiini tablette makro ja mikroelemendid,
  2 - 3 tl soja\u00f5li t\u00fchja k\u00f5huga (v\u00f5i salat k\u00f6\u00f6giviljad).
  S\u00f6\u00f6giriistad on parem kristallsoolaga rikastatud mikroelementidega.\\nK\u00f5ik
  need tooted p\u00f5hjustavad soovimatute rasvade p\u00f5letamist kehas, samuti rasvasisaldust,
  sageli toitu liiga palju. Selline toit tagab \u00f5huke n\u00e4itaja. Mis on sellise
