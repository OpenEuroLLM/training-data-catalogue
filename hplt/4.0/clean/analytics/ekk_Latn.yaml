  S\u00f5nade h\u00e4\u00e4ldus v\u00f5ib varieeruda (nt praegu, praega, pr\u00e4\u00e4gu).
  Morfoloogias on mitmetest vormidest paralleelvariandid (nt illatiiv koju, kodu ja
  kodusse). Ka lausegrammatikas ei ole asjad teisiti. Inimene v\u00f5ib soovida telefoninumbrit
  k\u00fcsilausega (Kas te ei \u00fctleks mulle rektori telefoni?),...\\nKeel ja Identiteet
  Arvan, et keel ja identiteet on omavahel seotud v\u00e4ga tugevasti, eriti meie,
  eestlaste jaoks kes me end s\u00f5naotseses m\u00f5ttes vabaks laulsime. Keel on
  aidanud s\u00e4ilitada meie kultuuri ning rahvust l\u00e4bi pikkade ja raskete aegade.
  V\u00f5iks isegi \u00f6elda, et keel on pannud aluse meie kultuurile, mis omakorda
  pani aluse meie rahvusele. V\u00f5iks \u00f6elda, et keelest on arenenud v\u00e4lja
  identiteet. Inimesi seob \u00fcks keel, millest on s\u00fcndinud \u00fchine inimeste
  grupp, millel on eriline nendele omane kultuur. N\u00e4iteks on eestlaste k\u00f5ige
  stereot\u00fc\u00fcpsem iseloomustus see, et oleme \u00f5elad. Seegi v\u00f5ib olla
  seotud meie keelega, sest ka meie keel on kohati v\u00e4givaldne. Meeldib eestlastele
  ju aega surnuks l\u00fc\u00fca ning autost reisijaid maha lasta, inimestele meeldib
  end \u00fcles l\u00fc\u00fca, vahest isegi k\u00e4iakse salongis et keegi teine
  nad \u00fcles l\u00f6\u00f6ks ning p\u00e4rast r\u00e4iget pidu armastame haudvaikselt
  magada. Teisest...\\nPetroskoi soome-ugri kooli vepsa keele \u00f5petaja Nade\u017eda
  Kukojeva, ajalehe Kodima peatoimetaja kohuset\u00e4itja Marina Ginijatullina ja
  filoloogiadoktor Nina Zaitseva kirjutatud keele\u00f5pik on valmis v\u00e4ljaandmiseks
  ja j\u00f5uab koolidesse \u00f5ppeaasta alguseks. M\u00f6\u00f6dunud aastal valmis
  samadel autoritel \u00f5pik 1. klassi \u00f5pilastele. Kes arvab \u00e4ra mis raamat
  see on? Kas keelel on ametlik keelepoliitika? Muidigi riiki v\u00f5i oblastit keegi
  ei juhi vepsa keeles, selleks on ametlikult vene keel. Kuid Vepslaste kodukandis
  on liiklusm\u00e4rgid kahes keeles. Koolides on v\u00f5imalus \u00f5ppida vepsa
  keelt. Keele n\u00e4ited. Vepsa keel \u2013 Eesti keel Kisoim-kasoim - Mu kiisu-miisuke
  kus olid? - kus olid? Mecas. - Metsas. Mind said? - Mis said? P\u00fcn sain. - P\u00fc\u00fc
  sain. Kuna panid? - Kuhu panid? Pachan p\u00e4h\u00e4. - Posti otsa. Ken s\u00f6i?
  - Kes s\u00f5i? Papin koir. - Papi koer. Huvitavaid fakte Vepsa lipp T\u0161uudid
  = Vepslased (Uus nimetus al. 19 saj. 19. sajandil on ametlikus vene keele...\"",
  "\"Viimasel paaril n\u00e4dalal olen millegip\u00e4rast kokku sattunud inimestega,
  kes kurdavad, et ei tule enam ots otsaga kokku. Tee mis tahad, punnita kuidas oskad,
  aga ikka on kuu l\u00f5puks rahakott sama \u00f5\u00f5nes kui Igor Mangi t\u0161akrate
  katsumise tamm. Mida teha, kuidas end sellest piinavast olukorrast s\u00e4\u00e4sta?\\nTean
  ise h\u00e4sti, mida rahalises kitsikuses olevad inimesed tunnevad. Kui elasin Soomes,
  oli \u00fcsna tavap\u00e4rane olukord, kui p\u00e4rast arvete maksmist j\u00e4i
  \u00fche kuu elamiseks j\u00e4rele j\u00e4medalt paarsada eurot. Kui arvestada,
  et seal oli \u00fchistranspordi kuupilet juba ise ligi sada eurot \u2013 elasin
  siis Vantaa piirkonnas -, j\u00e4i ka minu rahakott \u00fcsna \u00f5hukeseks. M\u00e4letan
  h\u00e4sti, kui mulle tuli k\u00fclla poeg, kes armastas h\u00e4sti s\u00fc\u00fca
  ja mul oli arvel vaid 2.67 eurot. Ma ei h\u00e4bene ka tunnistada, et olen k\u00e4inud
  \u00f6\u00f6siti \u2013 p\u00e4rast jaanip\u00e4eva \u2013 linna pealt pudeleid
  korjamas ja teiste eluheidikutega magusamate pr\u00fcgikastide p\u00e4rast kaklemas.
  Kord juhtus ka selline lugu, et n\u00e4dala alguses oli mul taskus vaid kahe eurone
  m\u00fcnt ja uus raha tuli alles n\u00e4dala l\u00f5pus. Ega siis ei olnudki muud
  teha kui kleepisin raha l\u00e4bipaistva teibiga esikusse ja iga kord kui \u00f5ue
  l\u00e4ksin, \u00fctlesin endale: \u201e\u00c4ra seekord veel raha kaasa v\u00f5ta,
  keeda makarone v\u00f5i s\u00f6\u00f6 putru, katsu veel \u00fcks p\u00e4ev m\u00f6\u00f6da
  saada.\u201c Sain kah, aga see m\u00e4lestus kehvikuks olemisest on mul siiani v\u00e4ga
  selgelt meeles.\\nKuidas ma t\u00e4barast olukorrast v\u00e4lja tulin? V\u00e4ga
  lihtsalt: tegin omale eraldi rahap\u00e4eviku ja koostasin igan\u00e4dalase eelarve.
  Kandsin hoolega vihikusse k\u00f5ik kulud ja tulud ning j\u00e4lgisin kiivalt, et
  igap\u00e4evased kulutused ei \u00fcletaks etteantud normi. Samuti tegin endale
  selgeks, millised on t\u00e4pselt minu kokkuhoiu eesm\u00e4rgid. Selle h\u00f5lbustamiseks
  leidsin vastamiseks p\u00e4ris head k\u00fcsimused:\\n\u00b7 Millised on minu peamised
  kulutused kodus?\\nNipp: kasuta t\u00e4pselt paika pandud eelarvet v\u00f5i kulude
  j\u00e4lgimise t\u00f6\u00f6riistu (n\u00e4iteks kulude-tulude tabel), et paremini
  tuvastada, kuhu sinu raha l\u00e4heb.\\n\u00b7 Kui palju soovin kokku hoida igan\u00e4dalaselt
  v\u00f5i iga kuu?\\nNipp: sea konkreetsed numbrilised eesm\u00e4rgid, mis aitavad
  j\u00e4lgida sinu edusamme. K\u00f5lab v\u00f5ibolla rumalalt, et napi eelarve juures
  r\u00e4\u00e4kida veel s\u00e4\u00e4stmisest, kuid see on just see koht, kus m\u00f5elda
  igap\u00e4evase s\u00e4\u00e4stmise peale. Iga t\u00e4na s\u00e4\u00e4stetud euro
  t\u00e4hendab suuremat eelarvet homme!\\n\u00b7 Millised on sinu peamised motivaatorid
  kokkuhoiuks?\\nNipp: tee endale selgeks, kas soovid raha s\u00e4\u00e4sta tuleviku
  jaoks v\u00f5i v\u00e4hendada stressi rahaliste murede p\u00e4rast v\u00f5i lihtsam
  olla teadlikum oma kulutustest. Mina oma n\u00e4gurip\u00e4evadel v\u00e4ga tuleviku
  p\u00e4rast ei muretsenud, vaid mul oli kindel reegel: ela \u00fcks p\u00e4ev korraga
  ja muretse vaid t\u00e4nase p\u00e4eva (eelarve) p\u00e4rast.\\n\u00b7 Millised
  on sinu peamised v\u00e4ljaminekud, millele soovid keskenduda?\\nNipp: m\u00f5tle
  v\u00e4lja, kas sinu prioriteet on toiduainete ostmine, kommunaalkulud, kodum\u00f6\u00f6bli
  v\u00f5i -seadmete ostmine v\u00f5i midagi muud. Mina keskendusin eelk\u00f5ige
  arvete maksmisele ja alles seej\u00e4rel vaatasin, palju toiduks j\u00e4rele j\u00e4\u00e4b.
  Kui vaja oli uusi botaseid, tegin prioriteediks selle ja eraldasin igan\u00e4dalasest
  eelarvest papude jaoks viis eurot.\\n\u00b7 Millised meetodid ja strateegiad on
  sinu jaoks k\u00f5ige t\u00f5husamad?\\nNipp: kasulik on v\u00e4lja m\u00f5elda,
  kas eesm\u00e4rgiks on kulude v\u00e4hendamine, sooduskaupade ostmisele keskendumine
  v\u00f5i hoopis n\u00e4iteks energia s\u00e4\u00e4stmine? Mina loobusin k\u00f5ige
  raskematel aegadel praeahju kasutamisest ja kui mu m\u00e4lu mind ei peta, oli j\u00e4rgmise
  kuu elektriarve k\u00fcmme eurot tavap\u00e4rasest v\u00e4iksem. Ja k\u00fcmme eurot
  on kehval ajal v\u00e4ga k\u00f5va valuuta!\\n\u00b7 Kas saad kaasata pere v\u00f5i
  leibkonna liikmeid oma s\u00e4\u00e4stuprogrammi?\\nSuhteliselt m\u00f5ttetu on
  ise paaniliselt s\u00e4\u00e4sta, kui sinuga samas leibkonnas olev inimene priiskab
  ja laristab nagu p\u00f6\u00f6rane. Seega on igati kasulik oma pereliikmeid oma
  s\u00e4\u00e4stuplaanidesse kaasata. Kui on t\u00f5esti rasked ajad, ei ole \u00fcldse
  h\u00e4biasi l\u00e4hedastelt v\u00e4ikest lisaabi k\u00fcsida. Ka paark\u00fcmmend
  eurot kuus lisaraha on suureks abiks!\\n\u00b7 Kuidas kavatsed j\u00e4lgida ja hinnata
  oma edusamme?\\nV\u00e4ga oluline on keset s\u00e4\u00e4stuprotsessi mitte masendusse
  \u00e4ra vajuda v\u00f5i loobuda eelarve igap\u00e4evasest kontrollimisest. Mis
  minu puhul v\u00e4ga h\u00e4sti t\u00f6\u00f6tas, oli igan\u00e4dalane pisike premeerimine.
  Kui ma n\u00e4gin, et olin kenasti eelarvest kinni pidanud, ostsin endale \u00fche
  j\u00e4\u00e4tise. Pisike \u017eest, ent minu jaoks t\u00f6\u00f6tas selline moodus
  imeh\u00e4sti.\\n\u00dcks asi, millele tasub eraldi t\u00e4helepanu p\u00f6\u00f6rata,
  on toidu ja kulinaariaga seotud kokkuhoid. Vanade botastega liipab edasi ka veel
  \u00fche n\u00e4dala, ent s\u00f6\u00f6ma peame iga p\u00e4ev. Seega on oluline,
  et iga n\u00e4dala alguses on kaval ette planeerida terve n\u00e4dala men\u00fc\u00fc,
  et v\u00e4ltida toidu raiskamist ja poes emotsiooniostude tegemist. Veel \u00fcks
  nipp: kasuta \u00e4ra j\u00e4relej\u00e4\u00e4nud toiduaineid uutes roogades! Samuti
  tasub toidupoodides j\u00e4lgida sooduspakkumisi (Maxima ja Lidl) ja allahinnatud
  tooteid (Coop).\\nL\u00f5petuseks veel \u00fcks kuldreegel: osta ainult neid esemeid,
  mida tegelikult vajad. Iga kord enne ostu tegemist k\u00fcsi endalt: kas see on
  t\u00f5esti v\u00e4ltimatu ost v\u00f5i saan tegelikult ka ilma hakkama? Samuti
  on meil p\u00e4ris lahedaid uuskasutuspoode, kus on v\u00f5imalik osta soodsa hinnaga
  taaskasutatud v\u00f5i renoveeritud tooteid.\\nKehvik olla on piinav ja vastik tunne,
  ent hoolika eelarvestrateegiaga on v\u00f5imalik ka sellest olukorrast v\u00f5tta
  maksimum ja elada v\u00e4hegi inimv\u00e4\u00e4rselt.\\nComent\u00e1rios\"", "\"Beebigurmee-
  Beebigurmee ehk tervislik lastetoit\\nLaste kasvava ja ennast intensiivselt \u00fclesehitava
  organismi varustamine vajalike toitainetega on normaalse arengu eeldus. Kaasajal
  m\u00fc\u00fcakse kauplustes toiduaineid ja poolfabrikaate, mis sisaldavad tervisele
  ohtlikke kemikaale. Kuid ka kemikaalivaba toit ei pruugi alati olla t\u00e4isv\u00e4\u00e4rtuslik.
  Intensiivne maaviljeluse tagaj\u00e4rjeks on sageli mikroelementidevaene pinnas,
  p\u00f5llumajandussaadused ei pruugi t\u00e4ita k\u00f5iki keha vajadusi.\\nParim
  toit nii t\u00e4iskasvanule kui lapsele on puhas, v\u00e4rskelt valmistatud ja pH-tasakaalus
  kodumaine toit. Beebid ei ole kosmonaudid, nad ei pea s\u00f6\u00f6ma ainult konserve.
  Samuti pulbreid - teaduslikult on t\u00f5estatud rinnapiima ja pulbripiima pH erinevus,
  ka poolfabrikaatide m\u00fcrgistavate ja s\u00f5ltuvust tekitavate ainete sisaldus.
  Neid tuleb \u00e4ra tunda ja v\u00e4ltida.\\nViimaste aastak\u00fcmnete v\u00e4\u00e4rarusaamad,
  vastutustundetu tootmine ja turundus on invaliidistanud juba liiga paljusid meie
  lapsi (diabeet, h\u00fcperaktiivsus, ts\u00f6liaakia, autism jne). Tuleb \u00fcle
  saada \u00f5pitud abitusest ja tuletada meelde k\u00f5ik vanad nipid, mille abil
  meie esivanemad kasvatasid \u00fcles tervisest pakatavad p\u00f5lvkonnad.\\n- \u00d5pitoas
  r\u00e4\u00e4gime headest bakteritest nahal ja soolestikus, lapse emotsioonide ja
  tervise seostest ja muidugi sellest, mis on tervislik toit ja mida tuleks kindlasti
  v\u00e4ltida.\\n- Rehabiliteerime Eesti juurviljad ja kaunviljad, tuletame meelde
  nende imeomadused. R\u00e4\u00e4gime piimast, v\u00f5ist ja \u00f5list.\\n- Valmistame
  tervislikke ja maitsvaid (ka pH-tasakaalustavaid) jooke, p\u00fcreed, tummi, putru,
  suppi ja k\u00fcpsiseid.\\nLapse toitumisharjumuse kujunemise ja toiduvaliku eest
  vastutab eelk\u00f5ige ema.\\nJa emad ju armastavad oma lapsi!\\nTeemad\\n- Aktsioon
  S\u00d6\u00d6DAV S\u00d6\u00d6K (6)\\n- Ilunipid (3)\\n- Kahjulikud e-ained (5)\\n-
  Keskkond (3)\\n- Looduskosmeetika (9)\\n- M\u00e4\u00e4ratlemata (8)\\n- M\u00f5tteainet
  (19)\\n- pH-tasakaal (2)\\n- Ravimtaimed (6)\\n- Taaskasutus (2)\\n- Tervis (17)\\n-
  Tervislik toitumine (23)\\n- Toiduretseptid (9)\\n- Toitumisn\u00f5uanne (7)\\n-
  Traditsioonide tarkus (28)\\n- Transrasvad (5)\\n- Uncategorized (5)\\n- Uudised
  (6)\\nArhiiv\\n- m\u00e4rts 2017 (2)\\n- veebruar 2017 (1)\\n- mai 2013 (1)\\n-
  aprill 2013 (4)\\n- m\u00e4rts 2013 (4)\\n- detsember 2011 (1)\\n- november 2011
  (1)\\n- oktoober 2011 (2)\\n- september 2011 (11)\\n- august 2011 (1)\\n- juuli
  2011 (2)\\n- mai 2011 (3)\\n- aprill 2011 (8)\\n- m\u00e4rts 2011 (9)\\n- veebruar
  2011 (5)\\n- jaanuar 2011 (4)\\n- november 2010 (1)\\n- oktoober 2010 (2)\\n- september
  2010 (7)\\n- august 2010 (3)\\n- aprill 2010 (1)\\n- m\u00e4rts 2010 (1)\\n- veebruar
  2010 (2)\"", "\"KLIIMANEUTRAALSE ELEKTRITOOTMISE UURINGU MATERJALID\\nEuroopa Komisjon
  (DG Reform) toetab Eestis kliimaneutraalse elektrienergia tootmise anal\u00fc\u00fcsi
  l\u00e4bi viimist. Projekti eesm\u00e4rk on pakkuda v\u00e4lja institutsionaalsed,
  administratiivsed ja kasvutagavad reformid Eestis aitamaks Majandus- ja Kommunikatsiooniministeeriumil
  leida kliimaneutraalse elektritootmise saavutamise alternatiivseid teid ja rakendatavaid
  tegevuskavasid. Projekti viib ellu Trinomics partneritega E3Modelling, Stockholm
  Environment Institute ja TalTech. Projekt sai alguse 2020. aasta septembris. Valminud
  stsenaariumidele koostatakse j\u00e4rgmiseks sotsiaalmajandusliku m\u00f5ju hindamine,
  riski- ja tundlikkusanal\u00fc\u00fcs. Valminud anal\u00fc\u00fcse kasutades koostatakse
  igale stsenaariumile tegevuskava. Projekti l\u00f5pparuanne valmib m\u00e4rtsis
  aastal 2022. Projekti anal\u00fc\u00fcside ja tegevuskavade tulemused annavad \u00fclevaate
  kliimaneutraalse elektritootmise v\u00f5imalikest tulevikest Eestis. Tulemusi kasutatakse
  energiamajanduse arengukava aastani 2035 koostamisel.\\nT\u00f6\u00f6 teostajad
  andsid kliimaneutraalse elektritootmisele \u00fcleminekuks Eestis j\u00e4rgmised
  p\u00f5hisoovitused:\\n-\\nPlaneerimis- ja loamenetluse kiirendamine;\\n-\\nTaastuvenergia,
  salvestuse ja madala s\u00fcsinikuheitmega tootmise jaoks vajalike finantseerimisv\u00f5imaluste
  tagamine;\\n-\\nPaindlikkusteenuste turu loomine\\n-\\nV\u00e4hekindlustatud majapidamiste
  majanduslik, tehniline ja informatiivne toetamine\\nUuringus modelleeritud ja anal\u00fc\u00fcsitud
  stsenaariumide eeldused:\\nL\u00d5PPARUANNE (inglise keeles)\\nTEGEVUSKAVADE ARUANNE
  (inglise keeles)\\nArvutused (Exceli tabel)\\nSensitiivsusanal\u00fc\u00fcsis ebastabiilsema
  tuuleenergiaga uuesti modelleeritud teekaartidele koostati antud etapis tegevuskavad.
  Valitud kriteeriumite (investeeringu maksumus, elektrihind, SKP, t\u00f6\u00f6kohad,
  sisemaise elektrienergia toodangu osakaal) alusel on teekaartide j\u00e4rjestamisel
  hinnatud parimateks teekaartideks tuumaenergia, k\u00f5ikide tehnoloogiate ning
  taastuvelektri ja salvestuse teekaardid. Uuringu koostajad soovitavad kolme teekaardi
  seast rakendada kas taastuvelektri ja salvestuse v\u00f5i k\u00f5igi tehnoloogiatega
  teekaarti, kuna tuumaenergia teekaardi rakendamiseks puudub seni Eestis vastava
  tehnoloogia kogemus ning seda poleks v\u00f5imalik enne 2035. aastat kasutusele
  v\u00f5tta.\\nKliimaneutraalsele elektrienergia tootmisele \u00fcleminekuks on uuringu
  teostajate soovituste kohaselt vajalikud j\u00e4rgmised tegevused:\\nTULEMUSTE KOKKUV\u00d5TTE
  ESITLUS 11.05.2022 webinaril\\nUuringu tulemusi tutvustava l\u00f5pu\u00fcrituse
  salvestus on k\u00e4ttesaadav SIIN.\\nKLIIMANEUTRAALSE ELEKTRITOOTMISE STSENAARIUMIDE
  ESIALGSETE TULEMUSTE ARUANNE JA KOKKUV\u00d5TE (ingliskeelsed)\\n\u2022 Uuringu
  k\u00e4igus modelleeriti 9 stsenaariumit: BAU, referents, taastuvad ja salvestus,
  tuumajaama, s\u00fcsiniku p\u00fc\u00fcdmine ja kasutus, taastuvgaas, tehnoloogiate
  mix, 1000 MW juhitavaid, impordita stsenaarium (Business as usual (BAU), Reference
  (REF), Renewables + storage (offshore wind), Nuclear, CCUS, Renewable gas, All technologies,
  1000 MW dispatchable capacity, No net imports).\\n(ingliskeelsed)\\nErinevate tehnoloogiate
  m\u00f5ju Eesti majandusele s\u00f5ltub impordis\u00f5ltuvusest, tootlikkusest ja
  h\u00f5ivest investeerivates sektorites ning finantseerimiskuludest. Stsenaariumide
  sotsiaalmajandusliku m\u00f5ju hindamine soovitab eelistada kulude siseriikliku
  finantseerimise (investeerimine elektritootmisesse v\u00e4listab investeeringud
  mujal sektorites) asemel v\u00e4lislaenude abil finantseerimist (10 a tagasimakseperiood
  intressiga 5%).\\nEsialgsete tulemuste p\u00f5hjal soovitab uuring sotsiaalmajanduslikust
  perspektiivist l\u00e4htudes RES-STORAGE, RES-GAS v\u00f5i AT-NIMP stsenaariumi.\\nJoonis
  Kumulatiivne m\u00f5ju SKP-le v\u00f5rreldes referentsstsenaariumiga 2025-2050.\\nTabel
  Vajalikud investeeringud elektritootmises ja salvestuses, mln eurot.\\nSource: LEAP
  model outputs, D3 \u201cDevelopment of pathways for reaching climate-neutral electricity
  generation\u201d\\n*Note that for all pathways except the CCS pathway, investments
  in oil-fired shale refer to retrofitting former oil shale plants to use biomass;
  in the CCS pathway, the plants continue to burn oil shale.\\nRiskianal\u00fc\u00fcs
  (ingliskeelne)\\nRiskianal\u00fc\u00fcs n\u00e4itas, et k\u00fcsitlusele (saadeti
  68 eksperdile, sh 37 organisatsioonile, millele vastasid 6 organisatsiooni esindajad
  ning lisaks intervjueeriti 4 liitu ja 3 ettev\u00f5tet) vastanute seas eelistatakse
  taastuvenergia ja salvestuse stsenaariumi, kuna olemas on t\u00f6\u00f6tavad tehnoloogiad,
  riskid on teada ja nendega on v\u00f5imalik tegeleda (nt planeerimisprotsessi t\u00f5rked,
  kohalike vastuseid), see stsenaarium vastab teiste riikide tegevuseesm\u00e4rkidele
  dekarboniseerimisel (Saksamaa, Taani, Rootsi, Soome), olemas on strateegia ja kogemus
  EL tasandil. Mitmed vastajad t\u00f5id v\u00e4lja, et antud stsenaariumi riske v\u00f5iks
  aidata maandada taastuvgaaside ja CCU tehnoloogiate kasutusele v\u00f5tt.\\nRiskide
  t\u00f5en\u00e4osuse ja t\u00f5siduse alusel on v\u00e4ikseima riskiga taastuvgaasil
  elektrienergia tootmise stsenaarium.\\nSENSITIIVSUSANAL\u00dc\u00dcSI ARUANNE (inglise
  keeles)\\nSensitiivsusanal\u00fc\u00fcsis modelleeriti uuesti stsenaariumid j\u00e4rgmiste
  sensitiivsustega, mille tulemusel:\\n- ebastabiilsemate tuuleoludega remodelleerimise
  tulemusel oleks suurem investeeringute vajadus, mis omakorda on positiivse m\u00f5juga
  SKP-le;\\n- k\u00f5rgema biomassi hinnaga p\u00f5levkivi asemel biomassi kasutades
  tooks rohkem salvestusv\u00f5imsusi ja v\u00e4hem p\u00e4ikeseenergiat;\\n- tuumajaam
  t\u00f6\u00f6ajaga 90% (esialgsetes arvutustes kasutatud t\u00f6\u00f6aja 60% asemel)
  asendaks odavamaid elektritootmisi madala n\u00f5udlusega aegadel t\u00f5stes elektrihinda;\\n-
  k\u00f5rged akude ja Paldiski pumph\u00fcdroenergiajaama kapitalikulud v\u00e4hendaks
  ebastabiilsemate tuuleoludega stsenaariumide korral akude v\u00f5imsust, kuna Paldiski
  pumph\u00fcdroenergiajaam kataks seonduvat salvestusvajadust, \u00fchtlasi v\u00e4heneks
  vajadus p\u00e4ikeseenergia j\u00e4rele ning v\u00e4heneks elektrihind.\\nSensitiivsusanal\u00fc\u00fcs
  n\u00e4itab, et suures mahus maismaatuulepargid on enamuses stsenaariumides soodsaimad,
  maksimumv\u00f5imsusega kuni 1479 MW. Ebastabiilsemad tuuleolud n\u00f5uavad suuremaid
  investeeringuid akudesse varustuskindluse tagamiseks. Mitmetes stsenaariumides biomassi
  kasutus t\u00e4nastes p\u00f5levkivijaamades v\u00f5imaldavad neid kasutada aastani
  2050 toodanguga kuni 3 TWh/a. S\u00fcsiniku p\u00fc\u00fcdmine ja kasutust anal\u00fc\u00fcsi
  tulemuste alusel ei soovitata. Varustuskindluse tagamisel ei n\u00e4hta hea lahendusena
  ka taastuvgaasi stsenaariumit. Tuumastsenaariumi puhul on investeeringute tasuvuse
  k\u00fcsimus madalamate koormuste korral.\\nEbastabiilsema tuuleenergiaga uuesti
  modelleeritud stsenaariumid on aluseks tegevuskavade v\u00e4lja t\u00f6\u00f6tamisele.
  Enamuses stsenaariumides on suurem juhitav v\u00f5imsus (eelk\u00f5ige akudes),
  suurem p\u00e4ikeseenergia v\u00f5imsus aastal 2030 ja suurem meretuuleenergia v\u00f5imsus
  aastal 2050 t\u00f5stes sisemaise toodangu osakaalu.\\nJoonisel on toodud stsenaariumide
  esialgsete tulemuste ja ebastabiilsema tuuleenergia toodanguga uuesti modelleeritud
  stsenaariumide v\u00f5rdlus tootmisv\u00f5imsuse MW kohta aastal 2030:\\nJoonisel
  on toodud stsenaariumide esialgsete tulemuste ja ebastabiilsema tuuleenergia toodanguga
  uuesti modelleeritud stsenaariumide v\u00f5rdlus toodangu TWh kohta aastal 2030:\\nJoonisel
  on toodud stsenaariumide esialgsete tulemuste ja ebastabiilsema tuuleenergia toodanguga
  uuesti modelleeritud stsenaariumide v\u00f5rdlus tootmisv\u00f5imsuse MW kohta aastal
  2050:\\nJoonisel on toodud stsenaariumide esialgsete tulemuste ja ebastabiilsema
  tuuleenergia toodanguga uuesti modelleeritud stsenaariumide v\u00f5rdlus toodangu
  TWh kohta aastal 2050:\\nLisainfo saamiseks kirjutage palun: irje.moldre@mkm.ee\\nTUUMAENERGIA
  UURINGUD\\n\u00dcheks v\u00f5imalikuks energiaallikaks elektrienergia tootmisel
  on tuumaenergia, mille kasutusv\u00f5imalusi Eestis anal\u00fc\u00fcsib Keskkonnaministeeriumi
  juurde moodustatud tuumaenergia t\u00f6\u00f6r\u00fchm, mille t\u00f6\u00f6 tulemuste
  \u00fclevaade valmib 2022. aasta septembris.\\nFermi Energia O\u00dc arendatava
  v\u00e4ikereaktori kasutusele v\u00f5tuga seotud uuringud on j\u00e4rgmised:\\nAnal\u00fc\u00fcs
  n\u00e4itab, et tuumaelektrijaam kahandaks tuuleparkide osa:\\n- Comparison of the
  most likely low-emission electricity production systems in Estonia, Taltech ja Utah
  \u00dclikooli koost\u00f6\u00f6s valminud artiklis modelleeriti ja anal\u00fc\u00fcsiti
  v\u00f5rdlevalt erinevaid elektritootmise stsenaariume:\\nStsenaariumide m\u00f5juanal\u00fc\u00fcsi
  tulemusel j\u00f5uti j\u00e4reldusele, et ebastabiilse tuuleenergia toodangu stabiliseerimiseks
  on salvestid l\u00e4hitulevikus veel liiga kulukad kogu v\u00f5rgu stabiliseerimiseks,
  sh pumph\u00fcdroeneriajaam on LCOE v\u00f5rdluses 40-50% kallim elektrijaamast.
  Salvestid sobivad eelk\u00f5ige t\u00e4iendavateks v\u00f5rguteenusteks. Juhitavateks
  v\u00f5imsusteks sobivad eesk\u00e4tt energiaallikatena p\u00f5levkivi, p\u00fcrol\u00fc\u00fcsigaas
  ja tuumaenergia. Seejuures on moodultuumajaamu v\u00f5imalik paindlikumalt juhtida,
  kui p\u00f5levkivijaamu. Lisaks on, isegi CCS rakendamisel p\u00f5levkivijaamad
  suurema kasvuhoonegaaside heitega kasutusea jooksul kui tuumajaamad ning muud \u00f5huheited
  p\u00f5hjustavad v\u00f5rdluses oluliselt rohkem surmasid. Turu kohanemiseks on
  vajalikud energiatootmise kompenseerimise v\u00f5i salvestusega seotud v\u00f5rgule
  pakutavad t\u00e4iendavad teenused nagu nt paindlik energiatootmine ja reservv\u00f5imsused
  v\u00f5imaldavad luua stabiilse m\u00fc\u00fcgitulu suurtele energiaprojektide investeeringuteks.
  \u00dcleminek v\u00e4hese heitega energiatootmisele t\u00f5stab elektrikulusid.
  Tuuleenergia stabiliseerimine v\u00e4iksemate soojuselektrijaamadega v\u00f5iks
  hoida \u00fclemineku kulud madalamad.\\nV\u00e4ikeste moodulreaktorite asukohtade
  alternatiivide sotsiaalmajandusliku m\u00f5ju anal\u00fc\u00fcsi k\u00e4igus prognoositi
  v\u00e4ikereaktorite rajamise ja opereerimisega kaasnevaid m\u00f5jusid kohaliku
  omavalitsuse vaates (L\u00fcganuse ja Viru-Nigula vald). Selleks koostati kahe stsenaariumi
  (v\u00e4ikereaktoriteta ja v\u00e4ikereaktoritega) kirjeldused, mille lahknevus
  on k\u00e4sitletav jaama poolt loodava m\u00f5juna.\\nAnal\u00fc\u00fcsi fookuses
  olid omavalitsuse elanike arv ja eelarve tulude pool. Omavalitsuste p\u00f5hitegevuse
  kulud on v\u00e4ga suures ulatuses seadustest tulenevate kohustustega kindlaks m\u00e4\u00e4ratud,
  samuti ei ole ette n\u00e4ha t\u00e4iendavaid kulusid seoses v\u00e4ikereaktorite
  rajamise ja/v\u00f5i opereerimisega.\\nV\u00f5rreldavad omavalitsused on mitmes
  suhtes sarnased \u2013 v\u00f5rdlemisi kiirelt kahaneva rahvastikuga ja suure t\u00f6\u00f6stussektori
  osakaaluga. Tulude tase on samuti v\u00f5rreldav, kuigi Viru-Nigula valla eelarven\u00e4itajad
  on pisut paremad. \u00dcldine l\u00e4hteolukord on L\u00fcganuse vallas m\u00f5nev\u00f5rra
  ebasoodsam. Seniste teadaolevate trendide j\u00e4tkudes kahaneb elanike arv m\u00f5lemas
  omavalitsuses 2040. aastaks kuni kolmandiku praegusega v\u00f5rreldes. Elanikkonna
  v\u00e4henemine avaldab negatiivset m\u00f5ju ka kummagi omavalitsuse tulubaasile.
  \u00dcksikisiku tulumaksu laekumine v\u00f5ib v\u00e4heneda 1,5\u20132 miljoni euro
  v\u00f5rra aastas.\\nV\u00e4ikereaktorite rajamise absoluutne m\u00f5ju on rahvastiku
  ja eelarvetulude arengule m\u00f5lemas omavalitsuses sama. Need toovad omavalitsusse
  olulisel m\u00e4\u00e4ral k\u00f5rge kvalifikatsiooni ja palgaga elanikke (200 otsest
  t\u00f6\u00f6kohta 2 reaktori peale) (keskmine palk p\u00f5levkivisektoris 1700
  eurot, v\u00e4ikereaktorites 3325), mis kompenseerivad osaliselt elanikkonna kahanemist,
  ja suurendavad eratarbimist piirkonnas.\\nV\u00e4ikereaktori rajamise ja opereerimisega
  kaasnevad maksimaalsed m\u00f5jud on j\u00e4rgmised:\\nEhitusperioodil, s.o aastatel
  2029\u20132035:\\n- Omavalitsustele koguneb \u00fcksikisiku tulumaksu kokku 15,4
  miljonit eurot. Arvestuse aluseks on ehitajate, t\u00f6\u00f6tajate ja nende kaaslaste
  kaalutud keskmised palgad ja omavalitsustele \u00fclekantava tulumaksu m\u00e4\u00e4r
  brutotulust, milleks on 11,93%.\\n- Asukohaj\u00e4rgsele omavalitsusele koguneb
  maamaksu 210 tuhat eurot.\\n- Riigi tulud on kokku u 66,6 miljonit eurot, sh tulumaks
  (8,07% \u00fcksikisiku tulumaksuga maksustatud brutotulust), sotsiaalmaks (33% brutotulust)
  ja k\u00e4ibemaks ehitusega kaasnevatelt kulutustelt.\\n- Piirkonnas tarbitakse
  erinevaid teenuseid ja kaupu kuni 80,6 miljoni euro eest (k\u00e4ibe-eeldus: \u00fcks
  inimene kulutab p\u00e4evas 50 eurot).\\n- Kaudseid t\u00f6\u00f6kohti tekib piirkonda
  kuni 110.\\n- Opereerimisperioodil kumulatiivselt:\\n-- Asukohaj\u00e4rgsele omavalitsusele
  koguneb aastas maksimaalselt tulusid 2,4 miljoni euro v\u00e4\u00e4ringus (tabelis
  veerg 2036+), opereerimisperioodil kokku 142 miljonit eurot, sh 96 miljonit \u00fcksikisiku
  tulumaksu.\\n-- Asukohaj\u00e4rgsele omavalitsusele koguneb maamaksu aastas 30 tuhat,
  kokku 1,8 miljonit eurot.\\n-- Riigi tulud on opereerimisperioodil kokku kuni 3,36
  miljardit eurot, sh tulumaks (8,07% \u00fcksikisiku tulumaksuga maksustatud brutotulust),
  sotsiaalmaks (33% brutotulust) ja k\u00e4ibemaks ehitusega kaasnevatelt kulutustelt
  ning v\u00e4ikereaktorite m\u00fc\u00fcgitulult.\\n-- Piirkonnas tarbitakse erinevaid
  teenuseid ja kaupu kuni 570 miljoni euro eest.\\n-- Kaudseid t\u00f6\u00f6kohti
  lisandub piirkonda ligikaudu 63.\\n-- Omavalitsuses tehakse 40 miljoni euro eest
  mitmesuguseid investeeringuid, sh:\\n- 10 miljonit eurot omavalitsuse investeeringuteks,
  mis makstakse v\u00e4lja kolmes jaos alates ehitusloa v\u00e4ljastamisest.\\n- 20
  miljonit elamuarenduseks, kuna t\u00f6\u00f6tajad vajavad elukohti ja praegune kinnisvaraturg
  vajadusi ei rahulda. Eelduslikult on \u00fche elamu\u00fchiku suuruseks 60\u201370
  m2, mille ehitushinnaks on 2000 eurot m2. Arvestatud on 150 elamu\u00fchikuga, kuna
  eeldatavalt tuleb osa t\u00f6\u00f6tajaskonnast koha pealt ja neil on eluase olemas.\\n-
  5 miljonit v\u00e4ikereaktorit teenindavale taristule.\\n- 5 miljonit v\u00e4ikereaktori
  k\u00fclastuskeskuse rajamiseks.\\n- Suureneb n\u00f5udlus avalike teenuste j\u00e4rele
  \u2013 eelk\u00f5ige lasteaia- ja koolikohad (u 120). Samas vajadust uusi hooneid
  ehitada puudub, kuna juba praegu on omavalitsustes kohti \u00fcle.\\n- Omavalitsuse
  eelarvesse laekub lisaks \u00fcksikisiku tulumaksule ligikaudu 730 tuhat eurot aastas
  vastavalt Fermi Energia pakkumisele. Tasandusfondi eraldise suurust see eeldatavalt
  ei m\u00f5juta, sest see s\u00f5ltub elanike (maksumaksjate) arvust ja vanuselisest
  koosseisust.\\n- V\u00e4ikereaktorite juurde rajatakse k\u00fclastuskeskus, mille
  eeldatav aastane k\u00fclastajate hulk on 10 tuhat inimest. Eeldatavalt pikendab
  keskus turistide k\u00fclastuskestvust piirkonnas poole p\u00e4eva v\u00f5rra. V\u00f5ttes
  arvesse teisi piirkonnas juba olemasolevaid ja arendatavaid turismiatraktsioone
  (Kivi\u00f5li Seikluskeskus, Eesti Kaevandusmuuseum, Aidu Veemaa) v\u00f5ib see
  aga kaasa tuua t\u00e4iendava \u00f6\u00f6bimise. Eesti siseturist kulutab p\u00e4evas
  23\u201347 eurot, v\u00e4listurist 78\u2013171 eurot[1]. Turismitulu arvestus sisaldub
  piirkonnas tarbitavate teenuste ja kaupade koguk\u00e4ibes.\\n- Keskmine t\u00f6\u00f6tasu
  l\u00e4heneb Eesti keskmisele, kuid t\u00f5en\u00e4oliselt ei \u00fcleta seda, kuna
  v\u00e4ikereaktori poolt loodavate k\u00f5rgepalgaliste t\u00f6\u00f6kohtade arv
  ei ole selleks piisav.\\nLisaks elektritootmisele kaasneb v\u00e4ikereaktori opereerimisega
  veel v\u00f5imalus pakkuda otseliiniga elektrit (vastavalt Elektrituruseadusele
  kuni 6 km raadiuses) ja t\u00f6\u00f6stusauru. Kuiv\u00f5rd on aga teadmata v\u00e4ikereaktori
  t\u00e4pne asukoht, ei ole v\u00f5imalik prognoosida v\u00f5imalikke kasusaajaid.\\nKahe
  moodultuumajaama GEH BWRX 300 small modular reactors (\u201cSMR\u201d) sotsiaalmajandusliku
  m\u00f5ju anal\u00fc\u00fcs n\u00e4itab, et\\n1. tuumajaama rajamise faasis kulutab
  Fermi Energia 15 aastaga 2 mlrd eurot panustades 253 mln eurot/a SKP-sse ja luues
  619 t\u00f6\u00f6kohta aastas\\n2. 60 aasta jooksul tuumajaama opereerides panustab
  see 266 mln eurot/a SKP-sse ja pakub 195 t\u00f6\u00f6kohta aastas\\n\u00dclevaade
  kirjeldab tuumajaamaga seotud peamisi keskkonnam\u00f5jude valdkondi ning nende
  keskkonnam\u00f5jude hindamiseks kasutatavaid l\u00e4henemisi. Anal\u00fc\u00fcsis
  k\u00e4sitletakse n\u00e4idetena ka Soome Loviisa tuumajaama ja Kanada Darlingotni
  tuumajaama praktilisi kogemusi.\\nTuumarajatise elukaare etappidel eeldatavalt tehtavad
  kiirguse keskkonnam\u00f5ju hindamised [Allikas: IAEA ohutusjuhend GSG-10, 2018;
  t\u00e4iendatud Eesti kontekstiga]:\\nVattenfall viis l\u00e4bi Rootsis tuumajaamade
  m\u00f5ju uuringu kohalikele omavalitsustele. Uuring v\u00f5rdleb kahte omavalitsust,
  kus asuvad tuumajaamad Oskarshamn ja Forsmark. Uuringus vaadati ajaperioodi 20 aastat
  enne ja 20 aastat peale tuumajaamade ehitamist ning anal\u00fc\u00fcsiti selle m\u00f5ju
  rahvastiku juurdekasvule ja struktuurile nendes omavalitsustes.\\nUuringu tulemusel
  v\u00f5ib kindlalt j\u00e4reldada, et tuumaenergial on olnud kohalikele omavalitsustele
  oluline m\u00f5ju. Tugevamaid m\u00f5jusid v\u00f5ib t\u00e4heldada ehitusajal ja
  esimestel kasutusaastatel, hilisemates etappides need aga v\u00e4henevad ja muutuvad
  raskesti eristatavaks. See on koosk\u00f5las sellega, mida on t\u00e4heldatud ka
  investeeringute puhul teistesse suurtesse taristuprojektidesse, n\u00e4iteks raudteedesse.
  Investeeringuga kaasnev kiire rahvastiku kasv peatus paar aastat p\u00e4rast ehitusperioodi
  ja p\u00f6\u00f6rdus seej\u00e4rel tagasi varasemate arengumustrite juurde. Anal\u00fc\u00fcsid
  n\u00e4itavad aga erinevusena suurtest taristuprojektidest, et tuumaenergia puhul
  on omavalitsused p\u00e4rast ehitamist stabiliseerunud k\u00f5rgemale sotsiaalmajanduslikule
  tasemele.\\nTuumat\u00f6\u00f6stus pakub h\u00e4sti tasustatud ja peaaegu liikumatut
  t\u00f6\u00f6kohta, mis loob aluse kohalikule sotsiaalmajanduslikule arengule, mida
  liikuv t\u00f6\u00f6stus ei suuda pakkuda. Tuumajaam ei saa kolida madala palgaga
  piirkonda, seda on konkurentsiga raske \u00e4rist v\u00e4lja t\u00f5mmata ning uue
  tehnoloogiaga asendamine enne selle eluea l\u00f5ppu on pea v\u00f5imatu. Just need
  omadused annavad v\u00f5imaluse stabiilsemaks majandusarenguks. Siiski tuleb m\u00e4rkida,
  et erinevalt paljudest teistest t\u00f6\u00f6stusharudest s\u00f5ltub tuumat\u00f6\u00f6stus
  poliitilistest otsustest.\\nTuumajaama asukoha omavalitsustes oli rahvastiku struktuur
  teiste sarnaste omavalitsustega v\u00f5rreldes noorem ja selle kahanemine pidurdus.
  Lisaks rahvastiku anal\u00fc\u00fcsile uuriti ka m\u00f5ju kinnisvarale. Maaklerite
  k\u00fcsitluse tulemusel ei toodud v\u00e4lja seda, et tuumajaama ehitus oleks kuidagi
  m\u00f5jutanud kinnisvara v\u00e4\u00e4rtust. Kinnisvara hind antud piirkonnas j\u00e4i
  samaks, mida v\u00f5ib t\u00e4heldada ka positiivse m\u00f5juna, kuna reeglina v\u00e4heneva
  rahvastikuga piirkondades kinnisvara hind pigem langeb.\\n\u00dcldine j\u00e4reldus
  on, et isegi kui k\u00f5ige suuremad m\u00f5jud ilmnesid piiratud aja jooksul, oli
  tuumainvesteeringul pikaajaline positiivne m\u00f5ju kohalike \u00fchiskondade sotsiaal-majanduslikule
  arengule. Nagu paljud intervjueeritavad on v\u00e4itnud, on t\u00e4nap\u00e4eval
  raske ette kujutada antud omavalitsusi ilma tuumajaamadeta. Tuumavallad on vaatamata
  algselt sarnasele sotsiaalmajanduslikule struktuurile majanduskriisidega paremini
  toime tulnud kui v\u00f5rdlusomavalitsused. Tuumat\u00f6\u00f6stus on andnud omavalitsustele
  vastupidavuse.\""]'
