sample: '["\"Esmasp\u00e4ev, 9. detsember\\nKell 17.30 kohtuvad J\u00f5geva vallajuhid
  Luua metsanduskooli klubis Kivim\u00e4e, Luua, Ehavere, Praaklima ja Kaiavere elanikega\\nKell
  17.30\u201320.00 saab Laiuse \u00f5lemuuseumis osaleda viljapeadest j\u00f5ulukuuse
  valmistamise t\u00f6\u00f6toas\\nTeisip\u00e4ev, 10. detsember\\nKell 14.00 kohtub
  poetess ja kirjanik Anneli Lamp Siimusti raamatukogus lugejatega\\nKell 16.00 toimub
  j\u00f5ulukaunistuste (p\u00e4rjad, ehted, kuused\u2026) \u00f5pituba Saduk\u00fcla
  rahvamajas. \u00d5pituba juhendavad Malle Kera ja Anne M\u00e4gisoo. Info: Anne
  5656 1820.\\nKell 18.00 saab Kaarepere rahvamajas piparkooke valmistada\\nKolmap\u00e4ev,
  11. detsember\\nKell 11.00 toimub Arukate Akadeemia vestlusring J\u00f5geva kultuurikeskuses
  teemal \u201eSalakaval haigus\\\". Sel teemal r\u00e4\u00e4gib SA Tartu \u00dclikooli
  Ps\u00fchhiaatria Kliiniku ja SA Tartu kiirabi \u00f5de ning J\u00f5gevamaa aasta
  \u00f5ppija 2018 Inga Veri. Arukate Akadeemia fotokonkursi tingimusi seletab lahti
  Johannes Haav (MT\u00dc Piltijad).\\nKell 16.00 toimub j\u00f5ulukaunistuste (p\u00e4rjad,
  ehted, kuused\u2026) \u00f5pituba Saduk\u00fcla rahvamajas. \u00d5pituba juhendavad
  Malle Kera ja Anne M\u00e4gisoo. Info: Anne 5656 1820.\\nKell 18.00 toimub J\u00f5geva
  kultuurikeskuse kammersaalis J\u00f5geva valla kultuurit\u00f6\u00f6tajate t\u00e4nu\u00fcritus\\nKell
  19.00 saab J\u00f5geva kultuurikeskuses vaadata Rakvere teatri etendust \u201eOnu
  Vanja\\\". P\u00e4\u00e4se 14/16 \u20ac.\\nNeljap\u00e4ev, 12. detsember\\nKell
  16.00 saab Saduk\u00fcla rahvamajas osaleda j\u00f5ulutoitude valmistamise \u00f5pitoas.
  \u00d5pituba juhendavad Malle Kera ja Anne M\u00e4gisoo. Info: Anne 5656 1820.\\nKell
  19.00 k\u00f5lavad Kaarepere rahvamajas j\u00f5ululaulud koos Nukitsamehe naistega\\nKell
  19.00 on Kuremaa lossis kontsert \u201eMuusikaga j\u00f5uludesse\\\". Esinevad sopran
  Kristina V\u00e4hi ja Marko Martin klaveril. Kavas j\u00f5ulumeeleolu muusika. P\u00e4\u00e4se:
  5/ 7 eurot.\\nReede, 13. detsember\\nKell 09.00\u201315.00 toimub J\u00f5geva kultuurikeskuse
  \u00fcmbruses j\u00f5ululaat\\nKell 16.00 on Saduk\u00fcla rahvamajas j\u00f5ulukaartide
  valmistamise \u00f5pituba. \u00d5pituba juhendavad Malle Kera ja Anne M\u00e4gisoo.
  Info: Anne 5656 1820.\\nKell 19.00 l\u00f5petatakse Saduk\u00fcla rahvamajas j\u00f5ulun\u00e4dal
  piduliku \u00f5htus\u00f6\u00f6giga\\nLaup\u00e4ev, 14. detsember\\nKell 16.00 algab
  Palamuse kirikus Tartu \u00fcli\u00f5pilassegakoori kontsert. Dirigeerib K\u00fcllike
  Joosing.\\nP\u00fchap\u00e4ev, 15. detsember\\nKell 10.00\u201316.00 toimub j\u00f5uluturg
  Kuremaa lossis. Kell 12 lossi II korruse saalis koguperefilm \u201eEia j\u00f5ulud
  Tondikakul\\\". Pilet 3,5/5 eurot. Kuremaa Talli poni s\u00f5idutab lapsi. M\u00fc\u00fcgiks
  k\u00f5ik eestimaine: k\u00e4sit\u00f6\u00f6, toit jpm. Info ja registreerimine
  502 7541.\\nKell 11.00 on J\u00f5geva koguduses kolmanda advendi jumalateenistus\\nKell
  11.00 algab Palamuse kirikus kolmanda advendi jumalateenistus. Kaasa teenib segakoor
  \u201eServiti\\\" \u00dclle Sakariase juhendamisel. Kell 11.00 on Palamuse koguduse
  pastoraadi II korruse saalis lastetund.\\nKell 11.00 toimub kolmanda advendi jumalateenistus
  Torma kirikus\\nKell 12.00 on P\u00e4kapikula Torma rahvamajas. Kavas meisterdamine,
  m\u00e4ngud ning m\u00f5nusad j\u00f5ulujutud.\\nKell 12.00 stardib J\u00f5geva
  spordihoone Virtus juurest J\u00f5geva j\u00f5ulujooks\\nKell 14.00 toimub Palamuse
  laulustuudio j\u00f5ulukontsert Palamuse rahvamajas. Esineb \u0160ahh Matt ja kavas
  on palju \u00fcllatusi.\\nKell 16.00 kuulutab Eesti Evangeelse Luterliku Kiriku
  piiskop Joel Luhamets J\u00f5geval v\u00e4lja j\u00f5ulurahu kogu Eestile. J\u00f5uluootuse
  tervitused annavad edasi J\u00f5geva vallavanem Aare Olgo, Riigikogu teine aseesimees
  Siim Kallas ja J\u00f5geva vallavolikogu esimees Raivo Meitus.\\nKell 17.00 on J\u00f5geva
  kultuurikeskuses j\u00f5ulurahukontsert. Esinevad Evelin Samuel-Randvere (laul),
  Johan Randvere (klaver) ja Marten Altrov (klarnet). Sissep\u00e4\u00e4s tasuta!\\nEsmasp\u00e4ev,
  16. detsember\\nKell 17.30\u201320.00 saab Laiuse \u00f5lemuuseumis osaleda j\u00f5ulukrooni
  valmistamise \u00f5pitoas\\nKestvad s\u00fcndmused\\n10.\u201315. ja 17.\u201322.12
  j\u00f5ulud Paunveres \u2013 p\u00e4ev t\u00e4is tegevusi Palamuse muuseumis\\n*
  Koolimajas j\u00f5ulup\u00fchaeelne koolitund kell 10, 12, 14, 16\\n* K\u00f6stri
  \u00f5unaaidas: j\u00f5ulukombed vanasti kodus kell 11, 13, 15, 17\\n* Teele \u00f5pitoas:
  j\u00f5ulukingi meisterdamine koolimaja teisel korrusel: Pagari piparkook! L\u00f5kke
  \u00e4\u00e4res valame ka \u00f5nnetina! P\u00e4\u00e4se \u2013 \u00fcksikk\u00fclastaja
  8 \u20ac perepilet 22 \u20ac (2 t\u00e4iskasvanut ja kuni 3 alla 18-aastast last).
  K\u00f5igist tegevustest osasaamiseks varuge aega v\u00e4hemalt 4 tundi.\\n9., 12.,
  13.12 kell 18.00 muusikan\u00e4dala kontserdid Palamuse laulustuudios\\n05.12\u201308.01.20
  V\u00e4ino Valdmanni foton\u00e4itus \u201e25 pluss miinus 5\\\" J\u00f5geva linnaraamatukogus\\n02.12\u201306.01.20
  n\u00e4itus \u201eP\u00e4kapikud piiluvad\\\" J\u00f5geva linnaraamatukogu lasteosakonnas\\n03.12\u201331.12
  lasteraamatuillustratsioonide n\u00e4itus \u201eRisti-r\u00e4sti l\u00e4bi Eestimaa\\\"
  Palamuse muuseumis\\n20.11\u201311.01.20 Irina Tammise n\u00e4itus \u201eS\u00f5lelised\\\"
  Betti Alveri muuseumis\\n22.11\u201310.12 Riina M\u00e4gi ja Anatoli Makarevit\u0161i
  foton\u00e4itus \u201eKareva ja Kaplinskiga luulelaineil\\\" J\u00f5geva kultuurikeskuses.
  N\u00e4itus on p\u00fchendatud luulep\u00e4evadele \u201eT\u00e4hetund\\\".\\n08.11\u201315.12
  Rahvusarhiivi n\u00e4itus \u201ePildirindel\\\" Siimusti raamatukogus. N\u00e4itus
  11 stendil kujutab II maailmas\u00f5ja aegseid karikatuure ja nalju m\u00f5lemalt
  poolt rindejoont.\\nJ\u00e4lgi s\u00fcndmusi: www.kultuurikava.ee (J\u00f5gevamaa,
  J\u00f5geva vald)\"", "\"\\\"Kosmos 68\\\" on dokumentaalfilm, mis keskendub biit-
  ja rokkmuusika s\u00fcnnile, mist\u00f5ttu on v\u00e4ga asjakohane, et filmi esitlusele
  aitab kaasa ansambel Uus viisik, kes annab juba homme Rockstarsis deb\u00fc\u00fctkontserdi.\\nB\u00e4nd
  koosneb Fixi, R\u00fctmikute, Mikronite ja J.Tompi nimelise poistekoori liikmetest
  ning s\u00f5na v\u00f5tab ka filmi autor Peeter Brambat. Repertuaaris on Uuel viisikul
  peaasjalikult 1970-ndate muusika, \u00fcks vanematest lugudes p\u00e4rineb lausa
  aastast 1962. Esitusele tuleb ka paar omaloomingulist lugu ansambli m\u00f5ne liikme
  poolt. Nime \u2014 Uus Viisik m\u00f5te sisaldab ka ingliskeelset b\u00e4ndi nime
  Old Five New Wave, mis sobib h\u00e4sti kokku meeste elueaga, sest b\u00e4ndiliikmete
  vanuse summa on 300 aastat.\\n\u00dcritus algab kell 19.00, filmi saab n\u00e4ha
  kell 20.00 ja Uus viisik astub lavale kell 21.45. Ja muide, sissep\u00e4\u00e4s
  on jumala tasuta!\"", "\"Juba \u00fcle kahe aasta on kogu maailm elanud koos koroonaviirusega.
  Juhtumite koguarv maailmas oli 16. m\u00e4rtsi seisuga \u00fcle 462 miljoni. Pandeemia
  on toonud muutusi ka meie elustiili. Distants\u00f5pe on \u00f5pilaste, \u00fcli\u00f5pilaste
  ja nende vanemate jaoks muutunud igap\u00e4evaseks, kohtumised s\u00f5pradega Zoomi,
  Discordi v\u00f5i Skype\u2019i vahendusel pole enam haruldus ning kontorit\u00f6\u00f6tajad
  t\u00f6\u00f6tavad sagedamini kodus ja l\u00e4hevad kontorisse harvemini. Praegune
  olukord tekitab mulje, et selle aja jooksul pole midagi head juhtunud. Kuid selles
  artiklis tahaksin v\u00e4lja tuua m\u00f5ned asjad, mis on meie elu paremaks muutnud.
  See artikkel toob esile seitse tervishoius ja argielus olulist uuendust.\\nPandeemia
  ajal hakkasid inimesed oma tervise eest rohkem hoolt kandma, eriti aga k\u00e4te
  ja pindade puhtuse eest. Rutiinne k\u00e4tepesu ja desinfitseerimine oli ja on k\u00f5igile
  tervishoiut\u00f6\u00f6tajatele kohustuslik, samas ei ole see nii tavaelanikkonna
  seas. N\u00fc\u00fcd aga v\u00f5ib \u00f6elda, et suurel osal elanikkonnast on tekkinud
  harjumus desinfitseerida k\u00e4si enne ja p\u00e4rast mistahes asutuse k\u00fclastamist.
  Loomulikult on sellele kaasa aidanud desinfektsioonivahendite paigaldamine peaaegu
  k\u00f5ikidesse asutustesse.\\nBradley Corporationi uuringu kohaselt teatas 2020.
  aasta aprilli seisuga 90% t\u00e4iskasvanutest, et pesevad k\u00e4si varasemast
  sagedamini. K\u00e4te puhtana hoidmine on \u00fcks olulisemaid samme, mida saame
  teha, et v\u00e4ltida haigestumist ja teiste nakatamist.\\nNimetus \u201etelemeditsiin\u201c
  on kreekakeelse t\u00fcvega, tulenedes s\u00f5nast \u201etele\u201c (kaugel/eemal).
  See on suhteliselt uus valdkond, mis on Covid-19 pandeemia ajal astunud suure sammu
  edasi.\\nTelemeditsiin on meditsiiniteenuste, sealhulgas uuringute ja konsultatsioonide
  kaugpakkumine telekommunikatsiooni infrastruktuuri kaudu. Covid-19 pandeemia ajal
  on kohustuslik sotsiaalne distantseerumine ja t\u00f5husate ravimeetodite puudumine
  muutnud telemeditsiini k\u00f5ige turvalisemaks interaktiivseks s\u00fcsteemiks
  nii nakatunud kui ka nakatumata patsientide ja arstide vahel.\\nEnne koroonaviiruse
  pandeemiat oli telemeditsiin paljude arstide jaoks e-tervise lisateenus, mida oli
  tore omada, kuid mille kasutamine polnud kohustuslik. T\u00e4nap\u00e4eval on sellest
  saanud elanikkonnale meditsiiniteenuste osutamise oluline osa. Arstid, tervishoiueksperdid
  ja patsiendid on seisukohal, et p\u00e4rast pandeemiat j\u00e4\u00e4b kiirelt arenev
  telemeditsiin meile alles ning areneb j\u00f5udsalt edasi.\\nKoos Covid-19 pandeemiaga
  on j\u00e4rsult suurenenud vajadus meditsiiniseadmete ja tervisetoodete, eriti isikukaitsevahendite
  j\u00e4rele. Meditsiiniseadmete t\u00f6\u00f6stus seisab silmitsi kasvava n\u00f5udlusega
  ning vajadust lihtsa, odava ja kiire tootmismetoodika j\u00e4rele tuntakse rohkem
  kui kunagi varem.\\nP\u00fc\u00fcdes seda probleemi lahendada on tootjad p\u00f6\u00f6rdunud
  3D-printimise poole, et rahuldada n\u00f5udlust ja suurendada meditsiiniseadmete
  tootmist. Pandeemia algusaegadel v\u00e4lja t\u00f6\u00f6tatud ja kasutatud t\u00fc\u00fcpiliste
  seadmete hulka kuuluvad k\u00e4ed-vabad ukseavajad, n\u00e4omaskid, visiirid, hingamisaparaadid
  ja vahendid Covid-19 testimiseks.\\nMitme ohutu ja t\u00f5husa Covid-19 vaktsiini
  v\u00e4ljat\u00f6\u00f6tamist v\u00e4hem kui aastaga v\u00f5ib ilmselt tulevikus
  meenutada kui \u00fcht suurimat teaduse edusamme inimkonna ajaloos. \u00dcks p\u00f5hjus
  on see, et seni konkureerinud ettev\u00f5tted on hakanud koost\u00f6\u00f6d tegema
  ning p\u00fc\u00fcavad teha k\u00f5ik endast oleneva viiruse alistamiseks.\\nL\u00fchidalt
  \u00f6eldes on suur osa teadusmaailmast fokusseerunud Covid-19 ravimeetodite v\u00e4ljat\u00f6\u00f6tamisele.
  M\u00f5ned ravimite v\u00e4ljat\u00f6\u00f6tamise lihtsustatud regulatsioonid v\u00f5ivad
  Covid-19 pandeemiaga kaduda, kuid uuenduslikud l\u00e4henemisviisid testimises ja
  koost\u00f6\u00f6s j\u00e4\u00e4vad teadusele kasutada ka edaspidi.\\nPandeemiast
  inspireeritud desinfitseerimistehnoloogiad on n\u00fc\u00fcd k\u00f5ikjal. Lisaks
  k\u00e4tepuhastusvahenditele, ruumide m\u00e4rgpuhastustele ning esemete ja erinevate
  pindade desinfitseerimisele igap\u00e4evaste toodete abil on meil vajadus viiruste
  vastu v\u00f5itlemiseks ka teiste meetodite ja vahendite j\u00e4rele.\\nSelle aja
  jooksul on tekkinud neid v\u00e4ga erinevaid, antimikroobsetest seljakottidest kuni
  t\u00f5eliselt \u00e4gedate robotiteni, mis eraldavad ultraviolettkiirgust ja puhastavad
  \u00f5hku. Samuti on kaasaskantavad UV-puhastusvahendid autole, prillidele v\u00f5i
  muule. Alates filtreerivatest n\u00e4omaskidest kuni baktereid h\u00e4vitavate ultraviolettkiirteni
  \u2013 see k\u00f5ik on loodud desinfitseerimiseks ja bakterite eest kaitsmiseks
  \u2013 seepi pole vajagi! Isegi vidinaid, mille otsene puhastamine varem oli problemaatiline,
  kavandatakse n\u00fc\u00fcd nii, et puhastamine oleks kiirem ja t\u00f5husam: telefoni\u00fcmbrised,
  ekraanikaitsed, s\u00fclearvutid ja puutetundlikud ekraanid on n\u00fc\u00fcd valmistatud
  antimikroobsest materjalist, mida on v\u00f5imalik kiirelt desinfitseerida.\\nElame
  tehnikaajastul ja tavalise nutitelefoni kasutamine igap\u00e4evasteks asjadeks,
  n\u00e4iteks kohvi keetmiseks v\u00f5i majas tulede kustutamiseks, ise linna teises
  otsas viibides, on meil \u00fcsna mugav ja sageli kasutatav lahendus. Seet\u00f5ttu
  ei kujunenud pandeemia programmeerijate jaoks takistuseks, vaid vastupidi \u2013
  p\u00f5hjuseks uute mobiilirakenduste loomisel.\\nMitmed riigid on oma kodanikele
  v\u00e4lja t\u00f6\u00f6tanud rakendused, mis teavitavad selle kasutajat koroonaviiruse
  puhangutest ja v\u00f5imalikust kokkupuutest nakatunutega. Nii s\u00fcndisid Soome
  programm \u201cKoronavilkku\u201d, Saksa \u201cCorona-Warn-App\u201d, Austraalia
  \u201cCOVIDSafe\u201d, Taani \u201cSmittestop\u201d ja paljud teised. Selliste rakenduste
  hulgas on meil ka kodumaise tootja programm HOIA. Alates 2020. aastast on see allalaadimiseks
  saadaval k\u00f5igile GooglePlay ja AppStore\u2019i kasutajatele. Seda programmi
  saab seni kasutada vaid Eestis. Teave nakkuse kohta j\u00f5uab kasutajani \u00fchest
  telefonist teise Bluetoothi kaudu.\\nSamal ajal on arendajad p\u00f6\u00f6ranud
  olulist t\u00e4helepanu iga kasutaja andmete turvalisusele. See t\u00e4hendab, et
  nii teave haiguse kohta kui ka kasutajate telefoninumbrid on konfidentsiaalsed ning
  neid ei saa kasutada programmi arendajad ega telefonitootjad. Vaid \u00fche n\u00e4dalaga
  laadis rakenduse alla umbes 65 000 inimest, kellest viis inimest m\u00e4rkis end
  selles rakenduses nakatunuks. Kindlasti vajab ka see rakendus veel t\u00e4iustamist.\\nMeditsiin
  ei seisa kunagi paigal ja areneb pidevalt, kohandudes keskkonnatingimuste, inimeste
  vajaduste ja hetkeolukorraga maailmas. V\u00e4lja on t\u00f6\u00f6tatud mitmeid
  uusi seadmeid, mis aitavad tervishoiut\u00f6\u00f6taja t\u00f6\u00f6d lihtsustada.\\nSelliste
  uuenduste hulgas on ka pulssoks\u00fcmeeter. See seade on pandeemia ajal muutunud
  v\u00e4ga populaarseks ning paljud on selle ka koduseks kasutamiseks ostnud. On
  teada, et Covid-19 infektsiooni levinuim t\u00fcsistus on kopsup\u00f5letik, mis
  toob kaasa vere hapnikusisalduse languse. Pulssoks\u00fcmeeter v\u00f5imalda naha
  terviklikkust rikkumata kiiresti hapnikupuudust tuvastada.\\nMeditsiiniliste tarvikute
  juures tuleb \u00e4ra mainida ka n\u00e4ovisiirid. Tegemist ei ole k\u00f5rgtehnoloogiliste
  seadmetega, vaid mugavate isikukaitsevahenditega. L\u00e4bipaistev klaasist v\u00f5i
  plastikust visiir hoiab \u00e4ra pritsmete ja ka n\u00e4iteks l\u00e4hedalasuva
  inimese aevastusest pihustunud aerosooli sattumise n\u00e4o nahale ja limaskestadele.
  Lisaks meditsiinilistele visiiridele on olemas prillid, ripp- ja p\u00f5randakaitsed.
