  aruandeid. Ajalooliste ajalehtede abielud, netisaated ja muud uudsed artiklid v\u00f5ivad
  samuti anda teavet pereliikmete kohta.\\nKuigi see annab hea alguse, on oluline
  meeles pidada, et selline avaldatud teave on teisene, m\u00f5ni \u00f5ige ja m\u00f5ni
  veidi rohkem kui oletus. Et olla kindel oma kuulsate \u00fchenduste kohta, vii oma
