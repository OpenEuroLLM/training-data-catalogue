  25 kordsele pesule.\\nOEKO-TEX\u00ae sertifitseeritud.\"", "\"Kas teie peret\u00fc\u00fcbis
  on keegi?\\nKas ma olen seotud kellegi kuulsusega? See on \u00fcks k\u00fcsimustest,
  mis sageli esile kutsuvad inimese huvi genealoogia vastu. V\u00f5ibolla olete kuulnud,
  et olete p\u00e4rit Benjamin Franklinist, Abraham Lincolnist, Davy Crockettist v\u00f5i
  Pocahontistest. V\u00f5i ehk kahtlustate printsess Diana, Shirley Tempeli v\u00f5i
  Marilyn Monroe perekonna\u00fchendust (kuigi kauge). V\u00f5ib-olla jagate isegi
  perekonnanime kellegi kuulsaks ja ei tea, kas olete kuidagi seotud.\\nTeadus Tagasi
  kuulsale esivanemale\\nKui te kahtlustate perekonnapuu \\\"kuulsast\\\" \u00fcksikisikust
  v\u00f5i kahest, siis alustades sellest, kui v\u00f5imalik, \u00f5ppides nii palju
  oma pereajaloo kui v\u00f5imalik. Nimede ja kuup\u00e4evade kokkupanemine oma sugupuus
  on vajalik, et hiljem \u00fchendada suured andmebaasid ja biograafiad, mis sisaldavad
  kuulsatele inimestele eelnevalt l\u00e4bi viidud uuringuid.\\nS\u00f5ltumata sellest,
  kas olete otse allak\u00e4ik v\u00f5i k\u00fcmnendiku n\u00f5bu, kahekordselt eemaldatud,
  peate enne kuulsat inimest \u00fchendust v\u00f5tma, peate oma pereliiget uurima
  v\u00e4hemalt mitu p\u00f5lvkonda. Kaugemate sugulussuhete suhted n\u00f5uavad tihtipeale
  sugupuu asetamist mitu p\u00f5lvkonda enne kuulsa isiku aega ja seej\u00e4rel j\u00e4ljenevad
  oma teed tagasi erinevate k\u00fclgharudega. Te ei pruugi olla n\u00e4iteks Davy
  Crocketti j\u00e4rglane, kuid siiski jagate oma Crocketi esivanemate hulgas \u00fchist
  esivanemist.\\nSelle seose leidmiseks peaksite uurima mitte ainult oma perekonnapuu,
  vaid ka tema, ja siis v\u00f5ib-olla ka oma esialgse \u00fchendusega edasi liikuda.\\nLisateave
  v\u00f5imaliku kuulsa esivanema kohta\\nLisaks oma perekonna ajaloo uurimisele saate
  uurida ka teavet, mis on olemas kuulsale isikule, kelle arvates olete sellega seotud.\\nKui
  nad on \u00fcsna kuulsad, siis on t\u00f5en\u00e4oline, et keegi on nende perekonna
  ajalugu juba uurinud. Kui ei, siis on t\u00f5en\u00e4oline, et nende elulugu v\u00f5i
  muud ressursid on teie jaoks \u00f5iges suunas alustamiseks k\u00e4ttesaadavad.
  Mida paremini tunnete oma potentsiaalse kuulsa sugulase perekonnapuu nime ja asukohta,
  seda lihtsam on tuvastada v\u00f5imalikke \u00fchendusi, kui te ise oma t\u00f6\u00f6tate
  tagasi. Lihtsalt \u00e4rge pange l\u00fc\u00fcse, eeldades, et sama nimi / sama
  asukoht t\u00e4hendab sama isikut!\\n- Tuhandete kuulsate isikute elulugusid on
  lihtne leida veebist. Biography.com sisaldab l\u00fchikest biograafiat enam kui
  25 000 kuulsa inimese kohta, ulatudes n\u00e4itlejatest ja n\u00e4itlejatest poliitiliste
  juhtide ja ajalooliste tegelaste hulka. Infoplease.comil on 30 000 m\u00e4rkimisv\u00e4\u00e4rset
  inimest. Biograafilist teavet osalejate, n\u00e4itlejate ja teiste filmiga seotud
  isikute kohta leiate aadressilt E! Internetis ja Interneti-filmiandmebaasis. Naiste
  ajaloo m\u00e4rkimisv\u00e4\u00e4rne tunnusjoon on m\u00e4rkimisv\u00e4\u00e4rsete
  naiste biograafiad. Populaarsed genealoogia andmebaasid, n\u00e4iteks FamilySearch
  kasutaja poolt esitatud genealoogiad v\u00f5i perekonna puu, Ancestry.com Member
  Trees, samuti sisaldavad paljud kuulsuste suguv\u00f5sud - kuid palun pidage meeles,
  et need ei pruugi alati olla 100% \u00f5iged. M\u00f5ned neist kuulsatest \u00fchendustest
  juurduvad aegadest ja paikadest, kus \u00fclekaalukad kirjed on v\u00e4he ja seega
  ei pruugi need olla t\u00f5endid, mis vastavad Genealoogilise Proofi standardile
  .\\n- Populaarsetel kalmistu veebisaitidel on tutvustatud kuulsuste hauakivide kuup\u00e4evi
  ja pilte. Haua leidmine sisaldab transkribeeritud hauakivide teavet (ja m\u00f5nikord
  ka pilte) tuhandetele kuulsatele ja kurikuulus inimestele, samas kui Hollywoodi
  metroo annab l\u00f6\u00f6gi Los Angelese ja selle \u00fcmbruses asuvate kuulsate
  inimeste viimaste puhkepaikade kohta. Sarnane veebisait, poliitiline surnuaed, \u00fctleb
