  "\"Eelised ja v\u00e4ljakutsed\\nRistl\u00f5ikelises uuringus vaadeldakse inimesi,
  kes erinevad \u00fche konkreetse ajahetkel \u00fche v\u00f5tmeomaduse poolest. Andmed
  kogutakse samal ajal inimestelt, kes on sarnased teiste tunnustega, kuid erinevad
  huvi pakkuvates olulistes tegurites, nagu n\u00e4iteks vanus, sissetulekute tase
  v\u00f5i geograafiline asukoht. Osalejad jagunevad sageli gruppidesse, mida tuntakse
  kohortidena .\\nN\u00e4iteks v\u00f5ivad teadlased luua osalejate gruppe, kes on
  oma 20-, 30- ja 40-aastased.\\nKuidas ja millal kasutatakse sektsioonidevahelisi
  uuringuid\\nSeda t\u00fc\u00fcpi uuringus kasutavad erinevad inimeste r\u00fchmad,
  kes erinevad huvipakkuvas muutujates, kuid kellel on sellised omadused nagu sotsiaalmajanduslik
  staatus, hariduslik taust ja rahvus. Ristl\u00f5ike uuringuid kasutatakse sageli
  arenguhoolduses , kuid seda meetodit kasutatakse ka paljudes teistes valdkondades,
  sealhulgas sotsiaalteadustes ja hariduses.\\nN\u00e4iteks v\u00f5ivad arenguhoolduse
  uurijad uurida inimesi, kes on enamikus piirkondades m\u00e4rkimisv\u00e4\u00e4rselt
  sarnased, kuid erinevad ainult vanuse l\u00f5ikes. Seda tehes v\u00f5ib eeldada,
  et k\u00f5ik erinevused gruppide vahel s\u00f5ltuvad vanuselistest erinevustest,
  mitte muudest muutujatest.\\nRistl\u00f5ike uuringud on iseloomulikud ja neid nimetatakse
  kirjeldavateks uuringuteks, mitte p\u00f5hjuslikeks v\u00f5i seosteks, mis t\u00e4hendab,
  et te ei saa neid kasutada, et m\u00e4\u00e4rata kindlaks midagi, nagu haigus.\\nTeadlased
  salvestavad elanikkonnas esinevat teavet, kuid nad ei manipuleeri muutujatega.\\nSeda
  t\u00fc\u00fcpi uuringuid saab kasutada, et kirjeldada kogukonnas esinevaid omadusi,
  kuid mitte m\u00e4\u00e4rata p\u00f5hjuslike ja tagaj\u00e4rgede seost erinevate
  muutujate vahel. Seda meetodit kasutatakse sageli v\u00f5imalike suhete kohta j\u00e4relduste
  tegemiseks v\u00f5i esialgsete andmete kogumiseks, et toetada edasisi uuringuid
  ja eksperimente.\\nSektsiooniliste uuringute karakteristikute m\u00e4\u00e4ratlemine\\nRistl\u00f5ikelise
  uuringu p\u00f5hijooned on j\u00e4rgmised:\\n- Uuring toimub \u00fchel ajahetkel\\n-
  See ei h\u00f5lma muutujate manipuleerimist\\n- See v\u00f5imaldab teadlastel vaadata
  korraga arvukalt tunnuseid (vanus, sissetulek, sugu)\\n- Seda kasutatakse sageli
  teatud populatsiooni valitsevate tunnuste vaatlemisel\\nM\u00f5elge ristl\u00f5ikeliste
  uuringutega konkreetse inimeste r\u00fchma hetkehetkest hetkeseisule. Erinevalt
  pikisuunalistest uuringutest, mis n\u00e4evad inimesi pikema aja jooksul kokku,
  kasutatakse ristl\u00f5ikelisi uuringuid, mis kirjeldavad praegusel hetkel toimuvat.\\nSellist
  t\u00fc\u00fcpi teadust\u00f6\u00f6d kasutatakse sageli kindlaksm\u00e4\u00e4ratud
  ajahetke populatsiooni valitsevate tunnuste v\u00e4ljaselgitamiseks. N\u00e4iteks
  v\u00f5ib ristl\u00f5ikelist uuringut m\u00e4\u00e4rata, kas konkreetsete riskiteguritega
  kokkupuude v\u00f5ib konkreetsete tulemustega korreleerida.\\nUurija v\u00f5ib koguda
  ristl\u00f5iked andmeid varasemate suitsetamisharjumuste ja praeguste kopsuv\u00e4hki
  diagnoosimise kohta. Kuigi seda t\u00fc\u00fcpi uuring ei suuda t\u00f5estada p\u00f5hjuslikkust
  ja m\u00f5ju, v\u00f5ib see anda kiire \u00fclevaate korrelatsioonidest, mis v\u00f5ivad
  teatud kohas esineda.\\nSektsioonidevaheliste uuringute eelised\\nRistl\u00f5ikeliste
  uuringute m\u00f5ned eelised on j\u00e4rgmised:\\n- Nad on odavad ja kiiremad. Ristl\u00f5ike
  uuringud on tavaliselt suhteliselt odavad ja v\u00f5imaldavad teadlastel koguda
  v\u00e4ga palju teavet \u00fcsna kiiresti. Andmeid kogutakse sageli isereageerimisuuringute
  abil ja teadlased suudavad koguda suurel hulgal teavet suurtest osalejatest.\\n-
  Need v\u00f5imaldavad erinevaid muutujaid. Teadlased saavad koguda andmeid m\u00f5nev\u00f5rra
  erineva muutuja kohta, et n\u00e4ha, kuidas erinevad soost, vanusest, haridusastmest
  ja sissetulekud v\u00f5ivad olla seotud huvipakkuva kriitilise muutujaga.\\n- Nad
  sillutavad teed edasiseks \u00f5ppimiseks. Kuigi ristl\u00f5ikelisi uuringuid ei
  saa p\u00f5hjuslike seoste kindlaksm\u00e4\u00e4ramiseks kasutada, v\u00f5ivad need
  anda kasuliku tugipunkti edasiseks uurimiseks. Kui vaatate rahvatervisega seotud
  k\u00fcsimusi, n\u00e4iteks seda, kas konkreetne k\u00e4itumine v\u00f5ib olla seotud
  konkreetse haigusega, v\u00f5iksid uurijad kasutada ristl\u00f5ikelist uuringut,
  et otsida vihjeid, mis on kasulikuks vahendiks edasiste eksperimentaaluuringute
  suunamiseks. N\u00e4iteks v\u00f5ivad teadlased olla huvitatud sellest, kuidas \u00f5ppimine
  m\u00f5jutab kognitiivset tervist vanusega. Nad v\u00f5ivad koguda erinevatest vanuser\u00fchmast
  p\u00e4rinevaid andmeid selle kohta, kui palju nad harjuvad ja kuidas nad kognitiivsete
  testide puhul t\u00e4idavad. Sellise uuringu l\u00e4biviimine v\u00f5ib anda teadlastele
  vihjeid selliste harjutusviiside kohta, mis v\u00f5ivad kognitiivse tervise jaoks
  k\u00f5ige kasulikumad olla ja inspireerivad seda teema eksperimentaalset uurimist.\\nSektsioonidevaheliste
  uuringute v\u00e4ljakutsed\\nRistl\u00f5ikeliste uuringute v\u00f5imalikud v\u00e4ljakutsed
  on j\u00e4rgmised:\\n- Konkreetsete osalejate leidmine: Kuigi disain paistab suhteliselt
  otsekoheselt, v\u00f5ib v\u00e4ga keerulisteks leida v\u00e4ga sarnased osalejad,
  v\u00e4lja arvatud \u00fcks konkreetne muutuja. Ristl\u00f5ike uuringud eeldavad
  \u00fcldjuhul paljusid osalejaid, seega on t\u00f5en\u00e4osus, et osalejate vahel
  on v\u00e4ikesed erinevused. Kuigi sellised erinevused v\u00f5ivad tunduda v\u00e4ikesed,
  v\u00f5ivad nad m\u00f5jutada uuringu tulemusi.\\n- Kohordi erinevused: grupid v\u00f5ivad
  m\u00f5jutada kohordi erinevusi, mis tulenevad ainulaadse inimeste r\u00fchma konkreetsetest
  kogemustest. Sama ajavahemiku jooksul s\u00fcndinud isikud v\u00f5ivad jagada olulisi
  ajaloolisi kogemusi, kuid selle grupi inimesed, kes on s\u00fcndinud antud geograafilises
  piirkonnas, v\u00f5ivad jagada ainult oma f\u00fc\u00fcsilist asukohta h\u00f5lmavaid
  kogemusi. Inimesed, kes olid Pearl Harbori, Vietnami v\u00f5i 9. septembri sissetungi
  ajal elus olnud, v\u00f5isid jagada kogemusi, mis muudavad need n\u00e4iteks vanusegruppidest
  erinevad.\\nRistl\u00f5iked vs pikisuunalised uuringud\\nSellised uuringud erinevad
  pikisuunalistest uuringutest , kuna ristl\u00f5ikelised uuringud on m\u00f5eldud
  muutuja vaatamiseks kindlal ajahetkel. Pikisuunalised uuringud h\u00f5lmavad mitmeid
  meetmeid pikema aja jooksul.\\nNagu v\u00f5ite kujutada, peavad pikaajalised uuringud
  n\u00f5udma rohkem ressursse ja on sageli kallimad kui ristsuunalised ressursid.
  T\u00f5en\u00e4oliselt m\u00f5jutavad ka neid, mida nimetatakse selektiivseks n\u00f5rgemaks
  muutumiseks , mis t\u00e4hendab, et m\u00f5ned inimesed kalduvad uuringust lihtsalt
  enam v\u00e4lja ja v\u00f5ivad uuringu kehtivust m\u00f5jutada.\\nRistl\u00f5ikeliste
  uuringute \u00fcks eeliseid on see, et kuna andmeid kogutakse korraga, on v\u00e4hem
  t\u00f5en\u00e4oline, et osalejad loobuvad uuringust enne andmete t\u00e4ielikku
  kogumist.\\n> Allikad\\n- > PubMed Tervis. Cross-Sectional uuring. USA Rahvusraamatukogu\\n-
  > Setia MS. Metoodika seeria moodul 3: ristsihilised uuringud. Indian Journal of
  Dermatology . 2016; 61 (3): 261-264. doi: 10.4103 / 0019-5154.182410.\"", "\"L\u00f5ppemas
  on projekt \u201cBreaking Barriers\u201d, mille partneriks on Narva Keeltel\u00fctseum
  koos L\u00e4ti ja Soome \u00f5ppeasutustega.\\nProjekti m\u00e4rks\u00f5nadeks on
  kaasamine ja toetus igale lapsele, s\u00f5ltumata tema v\u00f5imetest ja omadustest.
  Projekti eesm\u00e4rk oli luua praktilisi lahendusi kaasava hariduse kvaliteedi
  parandamiseks.\\nIgas riigis on oluliseks hariduse kvaliteedi kriteeriumiks personaliseeritud
  haridus, mis kaasab iga lapse ja noore t\u00e4iel m\u00e4\u00e4ral \u00f5ppimisse.
  Kaasav haridus on elukestva v\u00f5rd\u00f5iguslikkuse alus. Kaasav kool on k\u00e4ttesaadav
  igale lapsele, n\u00f5ustudes sellega, et iga laps on erinev.\\nProjekti k\u00e4igus
  toimus kolm partnerriikide t\u00f6\u00f6kohtumist: L\u00e4ti, Soome ja Eesti.\\nEsimene
  t\u00f6\u00f6koosolek toimus 12.06.23-14.06.23 Ventspilsis (L\u00e4ti). Kohtumisel
  v\u00f5rreldi erivajadustega \u00f5pilaste tugis\u00fcsteemide korraldust nii kooli
  kui ka riigi tasandil. Programmi raames k\u00fclastati nii tavakoole, kus kasutatakse
  kaasavat haridust, kui ka raske puudega lastele m\u00f5eldud eri\u00f5ppeasutusi.
  Samuti oli \u00fcks koolip\u00e4ev p\u00fchendatud \u00f5pilaste emotsionaalse intelligentsuse
  arendamise t\u00e4htsusele.\\nTeine t\u00f6\u00f6koosolek toimus 25.09.23-27.09.23
  Helsingis (Soome). Kohtumise k\u00e4igus k\u00fclastasid projektis osalejad koole
  ja Metropolia Rakendusk\u00f5rgkooli, kus tutvuti kaasava hariduse positiivsete
  n\u00e4idetega. Spetsialistidel oli v\u00f5imalus vahetada kogemusi, v\u00f5tta
  kasutusele kasulikke \u00f5ppemeetodeid ja praktikaid ning ideid kooliruumi kohandamiseks.\\nProjekti
  kolmas ja viimane etapp toimus 11.06.24 -14.06.24 Eestis.\\nProgrammi k\u00e4igus
  k\u00fclastasid Narva Keeltel\u00fctseumi esindajad koos partneritega Soomest ja
  L\u00e4tist Vivere erakooli, kus rakendatakse edukalt kaasava hariduse p\u00f5him\u00f5tteid.
  Samuti k\u00fclastasime kohtumise k\u00e4igus M\u00f5drikul asuva Tallinna Tehnikak\u00f5rgkooli
  osakonda, kus koolitatakse tulevasi sotsiaalt\u00f6\u00f6tajaid.\\nProjekti peamiseks
  l\u00f5puetapiks oli 14. juunil 2024 Narva Keeltel\u00fctseumis toimunud l\u00f5puseminar.
  Seminarile olid oodatud Narva linna kultuuriosakonna esindajad, Narva linna koolide
  esindajad ja k\u00f5ik huvilised.\\nSeminari k\u00e4igus jagasid iga projekti partnerriigi
  esindajad tehtud t\u00f6\u00f6 tulemusi, oma kogemusi ja kasulikke n\u00e4iteid
  praktilisest t\u00f6\u00f6st.\\nSeminari esimeses osas tutvustati k\u00fclalistele
  Narva Keeltel\u00fctseumi tugispetsialistide t\u00f6\u00f6d, hariduslike erivajadustega
  laste toetamisel kasutatavaid meetodeid, kaasava hariduse meetodeid, laste sotsiaalsete
  oskuste ja emotsionaalse intelligentsuse arendamise v\u00f5imalusi.\\nTehtud t\u00f6\u00f6
  tulemused v\u00f5eti ka kokku:\\nProjekti Breaking Barriers raames viisid kooli
  tugispetsialistid l\u00e4bi \u00f5petajatele suunatud kovisioone, individuaalkohtumisi
  ja konsultatsioone ning \u00fcmarlaudu kooliv\u00e4liste spetsialistide kaasamisega.\\nNarva
  Keeltel\u00fctseumis loodi lastele puhkealad ja soetati m\u00fcrasummutavad k\u00f5rvaklapid,
  mis vajadusel aitavad lastel \u00f5ppeprotsessile keskenduda.\\nProjekti teemast
  inspireerituna n\u00e4itasid g\u00fcmnaasiumiastme \u00f5pilased suurt huvi kaasava
  hariduse arendamisele, laste emotsionaalse intelligentsuse arendamisele, laste vaimse
  tervise hoidmisele ja koolikiusamise ennetamisele suunatud \u00fcrituste l\u00e4biviimise
  ja meistriklasside korraldamise vastu. 2024-2025 \u00f5ppeaastal viiakse \u00f5ppej\u00f5udude
  ja tugispetsialistide toel nende ideed ellu uurimis- ja praktiliste t\u00f6\u00f6de
  raames.\\nSeminari teises osas said k\u00fclalised osa v\u00f5tta t\u00f6\u00f6tubadest.
  \u00dcks t\u00f6\u00f6tubadest \u201cKogukonnatunne ja osalus k\u00f5igile Soome
  p\u00f5hikoolis\u201d korraldasid Soome kolleegid. Teine ruum \u201cL\u00e4ti \u00f5ppekeelele
  \u00fclemineku \u00f5ppetunnid hariduses. Lahendused leitud\u201d. J\u00e4rgmisena
  oli k\u00fclalistel v\u00f5imalus osa v\u00f5tta inglis- ja venekeelsetest kovisioonidel,
  mida viisid l\u00e4bi osalejad Eestist.\\nSeega v\u00f5ib m\u00e4rkida, et projekti
  Breaking Barriers partnerriikide esindajate \u00fchist\u00f6\u00f6 k\u00e4igus t\u00f6\u00f6tati
  v\u00e4lja lahendusi ja l\u00e4henemisi kaasava hariduse parandamiseks koolides
  ning igas eraldiseisvas \u00f5ppeasutuses v\u00f5eti kasutusele oma meetodid \u00f5pilaste
  toetamiseks eri\u00f5ppega. vajadustele.\\nAvaldame s\u00fcgavat t\u00e4nu Narva
  Keeltel\u00fctseumi direktorile Nade\u017eda T\u0161erka\u0161inale ja projekti
  koordinaatorile Eestist Elena Lohmatovale v\u00f5imaluse eest osaleda projektis
  Breaking Barriers!\\nSotsiaalpedagoog Daria Ivanova,\\nPs\u00fchholoog Alisa Seppenen,\\nLogopeed
  Mekhriban Matrasulova.\"", "\"Kirjeldus\\nFristads pikkade k\u00e4istega k\u00f5rgn\u00e4htav
