  - tunduvalt rohkem kui soovitatud 2 mg. T\u00f5si k\u00fcll, kui me t\u00f5esti
  ratsionaalselt toitlustame ja liigutame palju, tegelesime f\u00fc\u00fcsilise t\u00f6\u00f6ga,
  siis me ei oleks esiteks \u00fclekaalulised ja teiseks peaksime oma toidus olema
  piisavalt vitamiini B6.\\nB6-vitamiini allikad.\\nVitamiin B6 on k\u00f5ige rikkalikumad,
  nagu ka teised B-vitamiinid, p\u00e4rmis, maksas, \u00f5\u00f5nes nisust, kliid
  ja rafineerimata teradest. Palju seda kartulit (220-230mkg / 100 g), melassi, banaane,
  sealiha, munade, kapsa, porgandi ja kuivatatud ubade (550 mkg / 100 g) kartulit.
  Kuid oluline on mitte ainult teada saada ja leida rikkalik vitamiin B6 allikas,
  vaid ka seda s\u00e4ilitada.\\nKuidas hoida vitamiini B6 toidus\\nK\u00fclmutatud
  k\u00f6\u00f6giviljad, samuti k\u00fclmutatud v\u00f5i konserveeritud puuviljamahlad
  ja liha kaotavad palju p\u00fcridoksiini. Sellest valmistatud valge jahu ja leib
  sisaldab ainult 20% rafineeritud nisut\u00e4rklise kogusest. Koos veega, milles
  riis oli keedetud, t\u00fchjendame umbes 93% selles sisalduvast vitamiinist B6;
  sama kehtib kartulite valmistamisel saadud vedeliku kohta. Kui konserveerimine kaotab
  57-77% sellest olulisest vitamiinist.\\nK\u00f6\u00f6giviljadest ja puuviljadest
  v\u00f5ib pidada parimaks p\u00fcridoksiiniallikaks (B6-vitamiin), kuid see on oluline
  nende piirkondade elanike jaoks, kus nad kogu aasta v\u00e4ltel kasvavad. Meie riigis
  v\u00f5ib selline allikaks olla see vitamiin rikkalikult kartul, kui see on vahvalt
  \u00f5rnalt valmistatud, st nad ei t\u00fchjendanud vett p\u00e4rast toiduvalmistamist
  v\u00f5i k\u00fcpsetamist ahjus, \u00fcmbritsetud fooliumiga. Lisaks on B6-vitamiini
