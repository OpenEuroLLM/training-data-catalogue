  uuritud. Tuntud perekondlikke puid v\u00f5ib sageli leida kuulsate liinide kohta
  (nt kuulsad perekonnapuud) v\u00f5i avaldatud biograafilistest v\u00f5i perekonna
  ajaluguest. Muinsuskaitse- ja p\u00e4ritolu\u00fchingute v\u00e4ljaanded ja liikmelisuse
  taotlused on veel \u00fcks tuntud \u00fcksikisikute rikas allikas. Kasulik seoste
  leidja t\u00f6\u00f6riist, mis on juurdep\u00e4\u00e4setav tasuta FamilySearchi
