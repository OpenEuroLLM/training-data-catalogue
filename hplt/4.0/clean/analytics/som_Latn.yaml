  ka mid haa: Dooxooyinka Biyaha iyo Baadka ee duleedka Ceelasha Hargeisa. Intaan
  dhismaha Hargeisa samaysmin in Malcaamadaha oo Waabab ah la sameeyey. Nabadda dadka
  iyo xoolahooda oo la adkeeyey. Saldanada Beesha iyo Culimada oo isku dhisnaa, Gogol
  keliyana wada fadhiyey oo kuna Maamulaayey Diinta iyo Shareecadda Islaamka. Waxa
  iyana Hibo Alle iyo Deeq Alle ahayd Sheekh Haruun oo Illaahay siiyey lix wiil oo
  dhammaan Culimo Diini ah noqday oo kale ahaa: Sheekh Mohamoud, Sheekh Musa, Sheekh
  Hussein, Sheekh Guure, Sheekh Abdi iyo Sheekh Adan oo dhammaan noqday Macalimiin
  iyo Ducaatul Culuumudiin. Sheekh Haruun waxay isku Wakhti ahaayeen Suldaan Diiriye
  iyo Suldaan Abdiiahi.\\nXilligii Sheekh Madar Ahmed: Sheekh Madar waxa Hargeisa
  soo dejiyey Suldaan Diiriye iyo Sheekh Haruun oo Xaruntoodu ay ahayd Beertii Suldaanka
  iyo Xaafadda Jameecada, Sheekh Madar oo xilliyadaa ka soo guuray Ethiopia isaga
  iyo Xertiisi. Sheekh Madar intu noolaa waxay isa soo gaadhaan Suldaan Diiriye iyo
  Sheekh Haruun iyo inankiisii Curad Sheekh Mohamoud. Wakhtigaas Culimadu waxay ahaayeen
  ul iyo Diir ku walaaloobay Diinta iyo Shareecadda Islaamka. Fiiro Iyo Gudbin Gaar
  ah: Sidan kor ku cadeeyey Aasaaska Hargeisa iyo Wakhtigii la magaaleeyey way ka
  horeysay Imaatinka Sheekh Madar, waxanan Marjac iyo Xaqiijin uga dhigay: 1) Iyada
  oo aan Asaaska Magaalda Hargeisa ugu abtiriyey saddexda Suldaan ee is dhalay Farah,
  Hassan iyo Suldaan Diiriye oo ku dhawaad Qarni iyo Badh hayey Xilka Suldaanimo ee
  Beesha. 2) Labada sheekh ee is dhalay Ali iyo Sheekh Haruun iyana muddadaa taxneyd
  ahayd Culimada Dalka Hormoodkoodii. 3)Buugga uu qoray Dr. Sheikh Suldaan Bin Mohamed
  Al Qasimi. 4) Kutub uu lahaa Sheekh Ali iyo kuwa uu qoray oo yaala Maktabadda Weyn
  ee Jaamacatal Azhar ee Duuqi ku Taal ( Cairo ). 5) Illaahay Cimriga haw raajee waxa
  ina dhex fadhiya Diwaanka Qarniga Al Haj Abdi Karim Hussein oo la soo shaqeeyey
  Suldaan Diiriye, Suldaan Abdillahi, Sheekh Haruun, Sheekh Mohamoud, Chief Aqil Jambiir
  Kahin Suldaan Hassan, Suldaan Rashid, Suldaan Abdikadir, Suldaan Mohamed iyo Dhammaan
  Golaha Cuqaasha ee Beesha ilaa yawmanaa haada.\\nHadaba haddii aan dib ugu noqdo
  Dulucda Maqaalkan oo aan Raad raacisu yahay Mawduucii ,, Bilowgii Degitaanka Hargeisa,,
  ee Hadhwanaag News uu u soo gudbiyey inanka Cali Cabdi Coomay 11 kii December, waxan
  kugu wargelinayaa sida kooban ee Taariikhda Hargeisa aan u taatabtay, waxan ka saaraayey
  Muhmilka iyo Madmadawga ad gelaysay ama baryahanba socotay ee Taariikhdii Sheekh
  Madar la geliyey, si ka fog oo baal marsan Karamkii iyo Ixtiraamkii uu Sheekhu inagu
  lahaa. Sidan kor ku muujiyey Sheekh Madar waxan tilmaamay goortu Sheekhu Dalka yimid,
  Salaadiintii iyo Culumadii ka horeeyey ee aanu nolol ku soo gaadhin iyo Kuwu soo
  gaadhay ee wadajir ay u soo wada shaqeysiiyeen. Waxan Malafka Taariikhda Hargeisa,
  Marjaceedii aan ku xusay in Haji Abdi karim Hussein Xayun yurzaq inoo nool yahay.
  Sheekh Madar waxa Tiir iyo Rukumo u ahaa Salaadiinta iyo Culimadaas. Sheekh Madar
  na waxa uu ka mid raggaas Ususka iyo Aaasaaka u ahaa My Town Hargeisa, Illaahayna
  dhamaantood ha ka abaal mariyo. Cali Cabdi aniga oo kugu tixgelinaaya Taariikhda
  inta aad ka haysato, waxan ku weydiin lahaa, saddexda shay ee Hargeisa looga duceeyey
  sidad sheegtay, horta afar ayey ahaayeen oo waxa afar ku ahaa Qodaxda. Afar Caalim
  oo Sheekh Madar ka mid ahaa ayaa Ninba Shay gaar u qaatay, aan ku weydiiyee Bal
  Afarta Caalim ee hor Illaahay u walaaloobay bal magacyadooda noo sheeg iyo Sheekh
  waliba tuu Alla Berigeeda, khaas ahaan u lahaaa?\\nTalo iyo Digniin: Cali Cabdaw
  Adiga, Ehelka u dhashay Hargeisa iyo Culimada Maanta ee Dalka gaar ahaan kuwa Ehelka
  u ah Hargeisa aan farayaa, Taariikhda Sheekhunaa Sheekh Madar iyo Dhaxalka uu inooga
