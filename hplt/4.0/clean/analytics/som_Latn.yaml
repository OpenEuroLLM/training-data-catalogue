sample: '["\"Ubah Medical Academy\\nDugsiga Charter\\nBuundooyin 9-12\\nQiimo Lacag
  la''aan\\nSaacadaha iskuulka 7:30AM-2:30PM (M-Th) & 7:30AM-1:00PM (F)\\nTirakoobka
  dadweynaha\\n- TacliinA college prep program. Curriculum focuses on medicine, health,
  & the life sciences. Offers PSEO.\\n- Barnaamijyo dheeraad ahWaxay bixisaa Carabi.
  Iskaashiga Twin Cities International Elementary School & Minnesota International
  School Middle School.\\n- Waxbarasho gaar ahWaxay bixisaa adeegyo waxbarsho oo gaar
  ah. Wac iskuulka wixii warbixin dheeri ah.\\n- GaadiidBaabuur raaca waa la bixinayaa.
  Wixii warbixin dheeraad aha kala xiriir iskuulka.\\n- Sida loo diiwangeliyoHadii
  aad xiiseeynayso diwaangelinta, kala xiriir (952) 540-2943. Sidoo kale waxaad wixii
  war bixin dheeri ah ka booqan kartaa https://www.ubahmedicalacademy.org/domain/1213
  -\\nHeerka qalin-jebinta 4ta sano\\n2019: Ardayda heerka fasalka (aqoontooda)\\nDul
  bood si aad u aragto celceliska xisaabta iyo akhriska ku jabay.\\nACT: 18.1\"",
  "\"wariye wax baaro islamarkaana ka howl gala gudaha Deegaanada uu ka arimiyo maamul
  gobaleedka jubaland Laguna Magacaabo Karar Aadan Rukow ayaa shaaca ka qaaday in
  ay jiraan xoga muhiim ah oo ku saabsan dagaalkii dagmada ceelwaq.\\nwariyaha oo
  soo xigtay ila wareedyo kala duwan ayaa soo bandhigay xog balaaran oo ku saabsan
  dagaalkii 17kii bishaan ka dhacay dagmada ceelwaaq ee gobalka gedo,kasoo waxyeelo
  ay ka soo gaartay ciidamo ka tirsan dowlada soomaliya laguna dilay CO. Aadan maxamed
  wacays [aadan koronto] ayaa ogaaday Baaritaan dheer oo uu sameeyey kadib, in ay
  ka dambeyeen saraakiil iyo madax ka tirsan maamul gobaleedka jubaland. [ laba maalmood
  ka hor intii al shabab aysan weerarka ku qaadin dagmada ceelwaaq ,waxaa gudaha gobalkaasi
  si dhuumalays ah oga baxay saraakiil iyo xubno ka tirsan maamulka jubaland . kuwasoo
  la sheegay in ay ka indho qarsanayeen qorsho ay wax ka ogaayeen oo laga soo maleegay
  magaalada kismaayo oo xarun kumeel gaarka u ah maamulka jubaland .\\nshaqsiyaadka
  barnaamijkaasi lagu tuhmayo in wax ka ogaayeen waxaa ka mid ah,cabaas ibraahim guray
  oo ahaa taliyaha ciidamada dowlada ee aaga konfurta gobalka gedo , madax wayne ku
  xigeenka maamulka jubaland maxamuud sayid aadan iyo wasiirka amniga ee jubaland
  cabdi rashiid cabdi nuur [ indha kori] barnaamijka saldhiga u ahaa dagaalka ceelwaaq
  ayaa ahaa mid looga hortagayo dhaqdhaaq ay wadaan saraakiil ka soo jeedo gobalada
  jubooyinka kas oo ay taageerayso dowlada somaaliya dariska la ah ee kenya.\\njubaland
  ayaa siyaasad ahaan ka horimaaday barnaamijkaas ay kenya horseedka ka tahay ee isbadalka
  loogu samaynayo gobalka gedo .waxaana 1/9 /2016 madaxtooyada maamulka jubaland ka
  soo baxday warqad uu saxiixay madaxwaynaha maamulka jubaland axmed maxamed islaam
  tasoo ahayd in lag hortago dhaqdhaqaaqayada ka soo cusboonaaday galbeedka gobalka
  gedo gaar ahaan dagmada ceelwaaq iyo deegaanada hoosyimaada.\\nwaxaan warqadaasi
  fulinteeda loo xill saaray shaqsiyaad uu hogaaminaya maxamuud sayid aadan, ayna
  ka mid yihiin wasiiru dowlaha amniga maxamed cabdi kaliil ,wasiir ku xigeenka bi,ada
  cabdi rashiid maxamed ducaale iyo shaqsiyaad kale .\\n26/8/2016 waxaa magaalada
  celwaaq booqday wafti balaaran oo uu hogaaminaya madaxwayne ku xigeenka jubaland.
  waxaana boqashadaasi ay qayb ka ahayad barnaamijka looga hortagayo dhaqdhaqaaqda
  ka socda dhinaca kenya.\\nintii u dhaxeysay 26/08/2016 ilaa 28/08/2016 waxaa dagamada
  ceelwaaq ka dhacay shirar u dhexeeyay maamulka jubaland iyo qaybaha bulshada iyo
  saraakiisha maamulka dagmadaasi. kulamadaasi waxaa maamulka jubaland ay ku doonayeen
  in ay ku sameeyaan maamul cusub iyo in saraakiisha ciidamada lagu qanciyo in ay
  joojiyaan kacdoon ay kaga soo horjeedeen kornayl cabaas ibraahim gurey islamarkaana
  ay la shaqeeyaan , inkastoo kulamadaasi ay ku soo dhamaadeen is afgarawaa ayadoo
  maamulka iyo saraakiisha dowlada ee dagmada ceelwaaq ay ku gacan sayreen in ay wax
  amar ah ka qaataan kornayl cabaas,\\nwaxaana waftigii uu hogaaminayay madaxwayne
  ku xigeenka ay laabteen iyagoo aan wax muuqda oo isbadal ah ka samayn dagamada ceelwaaq.taasina
  waxay sii dhiiro galisay qorshihii maamulka jubaland ee ahaa in laga hortago shirarka
  iyo barnaamijyada laga soo maleegayo kenya.\\ngudoomiye ku xigeenka dagmada ceelwaq
  Sahal macalin aadan oo wareysi siiyay wariyaha wax baarayay ayaa u xaqiijiyay in
  ay jirtay cabsi ku aadanayd qorshayaal ka dhan ah xasiloonida dagamadaasi ,madamaa
  maamulka iyo shacabka dagmadaasi ay si cad oga horyimaadeen ilaa afar barnaamij
  oo maamulka jubaland uu doonayay inuu ka fuliyo deegaanada ceelwaaq,buusaar garilley
  ,kasoo ahaa in la badalo dhamaan maamulada deeganadaas ,in la dhiso ciidamo daraawiish
  ah oo ka amar qaata jubaland. iyo dhamaan ciidamadaasi ay hoostagaan saldhig cusub
  oo ciidamada itoobiya ay ka furan rabaan nawaaxiga deegaanka ceelcade ee bartamaha
  gobalka gedo.\\nlaba maalmood ka hor dagaal ceelwaq waxaa safar su.aal ay ka imaaday
  gobalka oga baxay, wasiirka amniga jubaland ,madaxwayne ku xigeenka jubaland,iyo
  taliyhii ciidamada aaga koonfurta ee gobalka .waxaana safaradaasi ay kula aadeen
  magaloyinka wajeer iyo adis abab.\\nwaxaa sidoo kale furumaha laga saaray ciidamadii
  ku sugnaa deegaanada garillay,caws qurun,diif, iyo dhuyac garoon . waxaana taasi
  ay sababtay in ciidamada dowlada ee ku sugnaa dagmada ceelwaaq ay la kulmaan aagag
  cusub oo aysan dabooli karin . dhinaca kale 29/08/2016 weerar qaraxyo ah lagu dilay
  deeqoow diiriye sargaal ka tirsanaa ciidanka dowlada somaaliya,islamarkaana horay
  oga tirsanaan jiray saraakiisha ilaalada wasiirka gaashaan dhiga ee somaaliya Janaraal
  Cabdiqaair Sheeh Cali Diini.\\nKornel fatxi xusen cabdi [fatxi jiis] abaaduulaha
  ciidamada dowlada ee gobalka jubada hoose ayaa u sheegay wariyaha samaynayay baritaanka
  in weerarkii ceelwaq uu ahaa mid lagu mijaxaabinaya awooda ciidamada dowlada soomaliya
  ee ka howl galo jubaland. kadib markii ay ka biya diideen in ay hoostagaan maamulka
  jubaland,\\nkornayl fatxi oo hada ku sugan jubada hoose ayaa sheegay in isaga qudhiisa
  uu la kulmay dagaal xoogan muda dhowr cisho ka hor islamarkaana looga dilay hal
  askari loogana qaatay gaari nooca dagaalka ah.kadib markii ay weerareen ciidamada
  ka tirsan raaskaambooni meel u dhow deegaanka dhoobley,\\nisagoo sheegay in waqti
  xaadirkaan uu ku sugan yahay xero ay leeyihiin ciidamada dowlada kenya.halkaasna
  uu ka gaabaadsanayo weeraro kale oo oga yimaada dhinaca maamulka jubaland\\nwariyahaan
  wax baaro oo lagu magaabo Karar Aadan Rukow ayaa sheegay intii uu waday baritaankaasi
  inuu ku ogaaday xoga badan oo qaar kood aysan suuro gal ahayn in loo soo bandhigo
  warbaahinta,balse waxaa wariyaha uu is waydiiyay su.aalo ay ka mid yihiin. 1- awooda
  maamulka jubaland uu u lee yahay in uu hor istaago barnaamijyada ay wadaan wadmada
  dariska ah,sida dalka kenya iyo waliba saraakiisha al shabaab ee fulisay dagaalkii
  ceelwaaq hanaankii ay adeegsadeen marka laga hadlayo ,qaabkii uu u dhacay weerarkii
  ceelwaq iyo waliba nooca hubka ee loo isticmaalay .\\nDhamaan Su\u2019aalahaas iyo
  kuwo kale oo daahsoon ayuu Wariye Karar Aadan Rukow oo kamid ah Warfidiyeenada dhinaca
  baaritaanka ku xeeldheer isweydiiyey isagoo qoritaanka faaladaane alinka u qaatay
  sababo la xiriira bal in bulshada uu jawaab kaheli karo iyo in xitaa oo Dhibanayaasha
  dhibkaas uu gaaray uu lawadaago xogaha daahsoon ee aysan suuragalka aheyn in cidkastaa
  ay ogaato.\\nW/Q : Karar Aadan Rukow\\nInvestigative Journalist/ Wariye Waxbaara\\nmaxamedrukow@gmail.com\\nLeave
  a Reply\"", "\"Roobab mahiigaan ah iyo dabaylo xoog leh ayaa ka dhacaya magaalada
  Tokyo iyo nawaaxigeeda iyada oo la saadaalinayay in duufaano xoog leh ay ku soo
  wajahanyihiin.\\nHal milyan oo qof ayaa loogu baaqay inay guriyahooda ka qaxaan
  si ayna dhibato uga soo gaarin duufaanta.\\nLoogu Akhrinta Badanyahay\\nWasaaradda
  waxbarashada ee dalka ayaa shaacisay in dugsiyada ay sii furnaan doonaan kaddib
  markii ay kordheen kiisaska iyo dhimashada COVID-19 .\\nXoghayaha joogtada ee wasaaradda...\\nMadaxweynaha
  dalka Tanzania John Magufuli ayaa markii labaad ku guuleystay doorashadii dalkaasi
  ka dhacday dhawaan kaddib markii uu si aqlabiyad leh codadkii la dhiibtay...\\nGuddiga
  qaran ee mideynta iyo isdhexgalka shacabka ee NCIC ayaa baaq u diray siyaasiyiinta
  dalka.\\nSiyaasiyiinta ayaa loogu baaqay in aysan dooda warbixinta guddiga dib...\"",
  "\"Nabad-doon: Xassan Geedi Abtoow Aybakar Cali Adan, oo si aad ah looga yaqaan
  gobalka ex-Banaadir iyo gobala kale oo badan, ahaana Nabadonka \u2013guud ee Mogadishu
  iyo deegaanada u dhaw. waxa uu ku dhashay Bashaqle ( 1859-1926), Hooyadiina waxaa
  la yiraa: Xaliimo Cadow Xayle. Waxa uu ka mid ahaa nabadoonadii isticmaarka si toos
  ah uga horyimid diidayna fekrada badan oo ay wateen, ayada oo dadka qaar ay ku dagaalamaan
  Hub, Suugaan, dhaqaale, feker diineed ayaa Nabdoon Xasan Geediwaxa uu ku dagaalamay
  Caqli. Waxa uu ahaa nin Ilaaliya dhaqanka somalida,waxa uu xiran jiray dharkii ahaa
  labada go\u2019 ee dadka deegaanka dhaqanka u aheed,Fiiri Sawirka 1aad,dhaqankaa
  oo duubabka dhaqanku ilaali jireen fiiri sawirka 2aad,saddaxda will ee uu dhalay
  Suldaan Cusman oo ka mid ahaa reer Imaamkii magaalada xakumi jiray. Berrigii Sayid
  Barqash uu sheeganayay in uu xakumo xamar iyo nawaaxiga u dhaw, ayuu Xassan Geedi
  ku soo rogay Sayid barqash laftiisu in uu bixiyo cashuur,waana tan keentay in Barqash
  uu dagaal la\u2019aan Talyaaniga isaga wareejiyay markii ay u celiyeen 199.000 DN
  oo aheed cashuurtii barqash ka bixiday,waxa uuna [Sii aqri]\\nKulan ay Isugu Yimaadeen
  Dhalinyarada iyo waxgaradka kasoo jeeda Beesha Ogoonyar gaabane ayaa ka dhacay Magaalada
  Muqdisho Kulankaasi Waxaa looga hadlayay arimaha Horumarinta Beesha Agoonyar-gaabane
  Iyo Deegaanada ay ka dagan Yihiin Guud ahaan Dalka Soomaaliya. Kulankaasi Waxaa
  lagu Daah furayay Urur ka shaqeeyn doona Dhinaca Hormarinta Dadka Iyo Deegaanka
  Magaciisana Waxaa La Yiraahdaa Horusocod Foundation. Dhalinyaradii aas-aastay Ayaa
  Sheegay in uu yahay Urur Horumarineed Oo Ka Shaqeyn Doona Horumarka Dadka Iyo Deegaanka.
  Kulankaasi waxaa kasoo qayb galay Kulankaasi Odayaal dhaqameed,Aqoonyahano ,Haween
  iyo dhalinyaro kasoo jeeda beesha Agoonyar-gabane ee ku sugan Magaalada Muqdisho,
  Sidoo kale furitaankii kulankaasi Waxaa looga Hadlay arimaha uu ka shaqeeyn doono
  Ururka Horusocod Foundation . Mid ka Mid ah Dhalinyaradii Ka Hadashay Goobta ayaa
  Sheegay Horusocod Foundation\u201d Ma ahan Urur Ka shaqeeyn doona Arrimaha Siyaasada
  ee Waa Urur Ka Shaqeeyn Doona Arrimaha Horumarinta Dadka Iyo Deegaan. Hoos ka DAAWO:\\nMusharaxa
  u Taagan Xilka Madaxweeynaha HirShabelle Mudane Cabdi kariim Maxamed Jimcaale oo
  ka mid ah aqoonyahanada Soomaaliyeed Kana Soojeeda Dowlad Goboleedka HirShabelle
  ahna Musharaxiinta ugu cad cad xilka Madaxweynaha HirShabelle ayaa Hadal Qoraal
  ah Oo dhinacyo badan taabanaya u jeediyay Shacabka HirShabelle. Salaan iyo Mahadnaq:
  Bismillaahi, Mahad oo dhan Eebbe ayay u sugnaatay, Naxariis iyo Nabad-gelyana hagaarto
  Suubahanaheenii Maxamed (SCW). Shacabka Soomaaliyeed Gaar ahaan Shacabka HirShabelle
  Assalamu Calaykum Waraxmatullaahi Wabarakaatuh. Salaan ka dib Waxaa sharaf weyn
  ii ah in aan maanta idiin soo bandhigo Waxqabadkeeyga Iyo Barnaamijkeeyga siyaasadeed
  ee aan doonayo inaan ku hago Dawlad Goboleedka HirShabelle Afarta sano ee soo socota
  haddii ALLE idmo, fursadaasna aad isiisaan. Wajiga 1aad: Hirgalinta isbedel siyaasadeed
  oo dhaxal-gal ah: 1. Waxaan mudnaan gaar ah siindoonaa taabba-galinta Sharciga iyo
  Qaanuunka si loo helo Hay\u2019ado dawli ah oo is kor joogteeya isuna dheeli tiran
  (Checks and Balance). 2. Waxaan Dib-u-qaabeynayaa Hay\u2019adaha Dowliga ah ee HirShabelle,
  iyadoo dib-u-eegis aan ku samaynayndoono tirada, tayada iyo xeerarka lagu asaasay
  Hay\u2019adahaas si loo kala caddeeyo waajibaadkooda shaqo, sarena loogu qaado tayadooda,
  ayna ula [Sii aqri]\\nKadib markii kuraasta xildhibaanada barlamanka la lambareystay
  oo mid waliba meeshii la rabo loo rarayo ayaa waxaa soo baxaya inaysan mucaaridku
  fahamsaneyn sida wax u socdaan oo waxay ku dhegan yihiin hal eray oo ah \u201cdoorasho
  hala qabto\u201d. Haddii doorasho ku shubasho ah la qabto kooxda Farmajo Iyo Fahad
  Waxa ay keensanayaan xildhibaanada ay rabaan Kuwaasi Oo Dooranaya Afar sano Oo kale.
  Kuraastii xildhibaanada Golaha Shacbiga ayaa mid waliba waxaa la siiyey lumber,
  waxaana lagu saleeyey 18kii gobol ee dalka. Waxaa meesha laga saaray dhammaan dowlad
  goboleedyada iyo doorkooda, tan oo u muuqata in aysanba ku baraarugsaneyn mucaaradka
  iyo Madaxda maamul goboleedyada kuwooda aan khiyaanada qeyb ka ahayn. Safiirka Qadar
  oo noqday Gabraha cusub ee 20/21 ayaa hadda lagu soo warramayaa inuu bilaabay inuu
  u kala safro ama la xiriiro maamul goboleedyada isagoo boorsooyin lacag ah sita,
  soona agdhigaya lacag lagu Howl gelinayo Madaxdaxda Iyo Siyaasiyiinta Si ay Taaero
  ugu Muujiyeen Madaxweeyne Farmaajo Iyo Fahad. iyadoo loo sheegayo ina la rabo dhallinyaro
  cusub oo maamulka loo dhiibo Maadaama odayaasha wax garanaya uu doorkii dhammaaday.
  Sidoo [Sii aqri]\\nSida aan la socono Magaalada Muqdisho Waddooyinkeeda waxaa lagu
  Xeray Dhagxaan Tan iyo Markii uu Hogaanka Qabsaday Madaxweeyne Farmaajo sanadkii
  2017-2-8. Hadalkii uu Jeediyay Madaxweeyne Farmaajo ayaa ahaa In aan aysan Jiri
  Doonin In waddo la xero ayadoo lagu Mar-marsiyoonayo Waxaa la sugayaa Amniga .Balse
  Maxaa Dhacay Markuu Xakunka Qabtay Madaxweeyne Farmaajo. Hadii aan u soo Qaadano
  Tusaale Asbuucii la soo Dhaafay Magaalada Muqdisho Waxaa Qarax Iyo Dilal Toogasho
  Ah ee ka dhacay. 1: Suuqa Xamar weeyne Waxaa lagu Dilaya Mid ka mid ah Xoogsatada
  Muqdisho Waxaana Dilay Askari Ka Tirsan Dowlada Fedralka 18-6-20 2:muqdisho Waxaa
  lagu Dilay Qarax Sedex qof Hooyo Iyo Carurteeda Tariikhda Marka ay aheeyd 18-6-2020
  waxaana uu ka dhacay xaruunta Madaxtooyada Cabdi qaasim. 3:Suuqa Bakaaraha Waxaa
  lagu Dilay Aksari Boolis ah Tariikhda Marka ay aheeyd 18-6-2020: 4: Askari ka Tirsan
  Booliska ayaa dil u geeystay Qof shacab ah Magaciisa la Yiraahdo Cumar kaasi oo
  ku sugnaa Goobtiisa Ganacsi agaagaarka Isbitaal martiini Taarkhda Marka ay aheeyd
  16-6-2020 5: Kooxo Hubeeysan ayaa dil u geeystay Marxuum ka Tirsanaa Wasaarada Maaliya
  qeeybta Canshuuraada degmada [Sii aqri]\\nDeegaanka Miir-taqwa Waxaa laga Hirgeliyay
