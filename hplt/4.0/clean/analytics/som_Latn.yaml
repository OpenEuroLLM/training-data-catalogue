  GARAAD\\n22. AQONYAHAN SHIINO culay\\n23. siciid garaad\\n<\"", "\"Qorshaha Diiwaan
  Galinta Komishanka Doorashooyinka Qaranku Wuu Khilaafsan Yahay Xeerka Diiwaan Galinta
  Xeer Lr.37/2007\\nQorshaha diiwaan gelinta codbixiyeyaasha ee Komishanka Doorashooyinka
  Qaranku (KDQ) ay doonayaan inay ku dhaqan galiyaan diiwaan gelinta codbixiyeyaashu
  wuxuu si cad u khilaafsan yahay xeerka diiwaan galinta codbixiyeyaasha ee xeer Lr.37/2007.
  xeerkan oo lagu maamulayo diiwaan galinta codbixiyeyaaha qaranka Somaliland sida
  uu dhigayo qodobkiisa 2-aad ee xeerkan ayaa jidaynaya waxa uu noqonayo diiwaanku;
  qaab dhismeedka maamulka goobaha diiwaan galinta codbixiyeyaasha.\\nWakhtiga la
  dhaqan galinayo diiwaan galinta iyo wakhtia kama dambaysta ah ee ay tahay inay shaqaalaha
  diiwaan galintu joogaan ama la geeyo goobaha dadka lagu diiwaan galinayo.\\nWakhtiga
  ay soconayso diiwaan galintu, sida loo xafidayo agabka diiwaan galinta, siday warbixinaha
  u kala helayaan goobta diiwaan galinta, degmada, gobolka iyo xarunta dhexe.\\nMarkay
  dhamaato mudada diiwaan galintu qofka ka taga jiidii uu iska diiwaan galiyay ee
  meel kale taga ee jecel inuu halkaa kale ka codeeyo xiliga doorashada waxa uu yeelayo
  iyo hadii habsan ku yimaado waxa dhaca, xilalka iyo waajibaadka ay kala leeyihiin
  masuuliyiinta diiwaan galinta ee goob, degmo, gobol iyo qaran, iyo qofka ay goobta
  ku xaqiijin kari waayaan muwaadinimadiisa wakiilada wasaarada arrimaha gudaha iyo
  maxkamada racfaanku. Fursada ay tahay in la siiyo, iyo guud ahaanba soo saarista
  liisaska.\\nArrimaha dhamaantood, barnaamijka diiwaan galinta codbixiyeyaasha ee
  KDQ soo bandhigeen wuxuu u dhigayaa qaab ka gedisan sida uu xeerku jeedinayo.\\nWaxa
  arrintaa tusaale ugu filan arrimahan:\\n1- Wakhtigan la dhaqan galinayo diiwaan
  galinta, wuxuu dhigayaa Qod: 12-aad, faqradiisa koowaad sidan:-\\n\u201cKomishanku
  waa inuu ku dhaqan galiyo diiwaan galinta codbixiyeyaasha ugu yaraan muddo lix bilood
  ah ka hor maalinta doorashada.\\nWakhtigan hada la joogo ee ay soo bandhigeen barnaamijkii
  ay ku dhaqan galinayeen diiwaan galinta codbixyeyaasha waxa ka hadlay taariikhda
  loo ciyimay qabashada doorashada goleyaasha deegaanka muddo ku siman afar bilood
  oo keliya, wakhtigii sharci ahaana waxa la soo dhaafay laba bilood, mana jiro sharci
  u fasaxaya inay bilaabi karaan markay afar bilood ka hadhsan tahay maalinta doorashada\u201d.\\nQodobka
  27, faqradiisa 1-aad, waxay dhigaysaa sidan:-\\n\u201cShan bilood ka hor maalinta
  doorashada waa in la gaadhsiiyo masuuliyiinta diiwaan galinta goobaha diiwaan galineed,
  lana bilaabo diiwaan galinta\u201d\\nMudadaa sharcigu tilmaamayana waxa la soo dhaafay
  hal bil welina lama shaqaalayn hawl wadeenadii ka haw geli lahaa goobaha diiwaan
  galinta\u201d.\\n2- Qaab Dhismeedka Maamulka Goobaha Diiwaan Galinta Codbixiyeyaasha\\nWuxuu
  dhigayaa Qod: 11-aad, faqradiisa 1-aad iyo 3-aad sidan:-\\n\u201c1- Masuulka diiwaan
  galinta qaranka oo masuul \u2026.\\n2- Masuulka diiwaanka Gobol kasta.\\n3- Masuulka
  diiwaanka ee degmo kasta.\\n4- Masuulka diiwaanka ee goob kasta oo codbixineed\u201d\\n\u201c3
  \u2013 Qaab-dhismeedka maamulka goobaha diiwaangelinta waxa loo raacayaa xeerka
  doorashooyinka qaranka.\u201d\\nXeerka doorashooyinka hab-dhimeedka maamulku u socdaa
  waa: sii socodka-Qaran-Gobo-Degmo-Goob; soo noqodka-Goob -degmo-gobol-qaran. Markay
  dhamaato codbixintu shaqaalaha goobtu dokumentiggii iyo qalabkii shaqadaba waxay
  ku wareejinayaan degmada, degmada ayaana warbixinta natiijada degmada oo dhamaystirna
  soo gudbisa.\\nBarnaamijka KDQ waa kooxo toos uga hawlgalaya goobaha shan maalmood
  isla markaana shaqaalaha diiwaangelinta ee goobta warbixinta (2 hardcopies of all
  data) waxay toos ugu soo dirayaan xarunta KDQ. Dabeetana qalabkoodii ayay urursanayaan
  waxaanay u guurayaan goob kale oo gobol kale ah.\\nWaa laba nidaam oo kala duwan
  midka xeerku dhigayo iyo ka komishanku dhigtay.\\n3-Wakhtiga ay soconayso diiwaangelintu\\nQodobada
  xeerrka ee ka hadlaya wakhtiga ay soconayso diiwaangelintu waa kuwan:\\nQodobka
  12-faqradiisa 2aad\\n\u201cDiiwaangelintu waxay soconaysaa muddo aan ka yarayn hal
  bil kana badanayn saddex bilood.\u201d\\nQodobka 13-\\n\u201c\u2026, komishanku
  waa inuu furo diiwaangelinta codbixiyeyaasha muddo aan ka yarayn bil gudaheed, lix
  bilood ka hor xilliga doorasho kasta,,,\u201d\\nQodobka 22 \u2013 Faqradiisa 2aad\\n\u201cMeelaha
  ay jirto gaadiid xumo, dokumentigu waxa uu ku dhaxayaa diiwaangeliyaha goobta oo
  u gudbin doona diiwaangeliyaha degmada hal mar tdobaadkiiba maalinta Khamiista\u2026.\u201d\\nQodobka
  23- Faqradaha 1 &2\\n\u201c1 \u2013 Masuulka diiwaangelinta ee heer degmo wuxuu
  habaynayaa oo uu gelinayaa warbixinada diiwaangelinta qabsoontay todobaad walba
  foomka uu siin doono komishanku, wuxuu u gudbinayaa masuulka heer gobol xog faahfaahsan
  oo ku saabsan sida ay diiwaangelintu uga qabsoontay todobaadkii tegey degmadiisa.
  Masuulka heer gobolna kadib markuu soo ururiyo warbixinta degmooyinka gobolka, wuxuu
  u gudbinayaa warbixina dhamaystiran komishanka qaranka.\u201d\\n\u201c2- Komishanka
  waxaa waajib ku ah inuu todobaad kasta ku daabaco wargeysyada qaranka, kana baahiyo
  idaacadda iyo telefishanka tirada muwaadiniinta isdiiwaangelinaysa iyo inuu sidoo
  kale qaato tallaaabooyin uu dadku ku wacyigelinayo si ay suurtogal u noqoto inay
  isdiiwaangeliyaan tirada ugu badan ee suurtogalka ah. Komishanku wuxuu buuxinayaa
  dhamaan foomamka loo baahdo oo dhan warbixintuna waa inay lahaato saxeexa maamulka
  soo diray.\u201d\\nQodobadani waxay si aan mugdi ku jirin uga hadlayaan hawl diiwaangelineed
  oo todobaado ka soconaysa goobaha diiwaangelinta ee degmo kasta, iyo inay degmadu
  todobaadkiiba hal mar soo gubinayso warbixin tafaftiran oo koobaysa hawsha diiwaangelineed
  ee ka qabsoontay todobaadkaa. Weliba qodobka 22aad faqradiisa 2aad ayaa si cad uga
  hadlaysa inay jiraan goobo diiwaangelineed oo gaar ah oo iyagu hal mar oo ah dhamaadka
  todobaad kasta looga baahan yahay inay soo gudbiyaan warbixinta goobta.\\nDhinaca
  kale, waxay qodobadan iyo qaar kaleba qeexayaan xidhiidhka wada shaqayneed iyo masuuliyada
  ay kala leeyihiin jaranjarta masuuliyadaha diiwaangelinta oo waafaqsan nidaamka
  jaranjarada maamul ee xeerka doorashooyinka.\\nQorshaha KDQ wuxuu ku xardhan yahay
  inay diiwaangelintu ka socoto goobta muddo todobaad ka yar oo shan cisho ah bedelkii
  todobaadada. Waanu ka duwan yahay qaabkiisa maamul ka xeerka doorashooyinka, waana
  qaab aanu jirin xeer banaynayaa.\\nQorshahan diiwaangelinta ee KDQ ee diiwaangelinta
  ee shanta maalmood soconaysa wuxuu muwaadiniinta ka qaadayaa xuquuqdii sharcigu
  siiyay ee ahayd muddo dheer oo qof waliba si nefisa ikhtiyaarkiisa isugu diiwaangeliyo,
  waxaanay ugu bedeleen qarbo-qarbo iyo wakhti cidhiidhi ah.\\nQorshaha KDQ wuxuu
  shaki la\u2019aan luminayaa xaqii reer-miyigu u lahaa codaynta doorashooyinka mudada
  gaaban ee cidhiidhiga ah awgeed.\\nDooda odhanaysa dadku maalin qudha ayay codaynayaane
  ma shan maalmood ayaanay isdiiwaangelin karayn waa dood sideeda u jaban waayo, kasokow
  faraqa ballaadhan ee u dhexeeya labada arrimood, waa arrin sharciya inay muddooyinkoodu
  sidaa u kala duwanaadaan oo aan gorgortan lahaynba.\\n4- Wakhtiga hadhsan, dhaqangelinta
  diiwaangelinta, iyo hawsha doorashada\\nhaddii laga soo qaado inaanu sharcigu xadidayn
  wakhtiga dhaqangelinta diiwaangelinta codbixiyeyaasha oo ay taasi furantahay, xilliga
  loo cayimay doorashada goleyaasha deegaanka waxa imika ka hadhsan muddo ku siman
  afar bilood. Muddadaa afarta bilood ah iyo labada hawlood ee kala ah diiwaangelinta
  codbixiyeyaasha iyo hawsha ku beegan diyaarinta iyo qabashada doorashadu, sida la
  isu cunsiinayaa iyana waa arrin kale oo hor taala komishanka doorashooyinka qaranka.\\nJadwalka
  barnaamijka diiwaangelinta codbixiyeyaashu siday sheegeen komishanku wuxuu u muddaysan
  yahay 25 maalmood oo ka horeeya shanta maalmood ee gobolka u horeeya la diiwaangelinayo
  + lixda gobol oo min shan maalmood ah + 14 maalmood oo gobolka u dambeeya diiwaangelinta
  codbixiyeyaasha la sii joogayo degmooyinkiisa. Isugeyntaasi waxay noqonaysaa 25
  + 30 + 14 = 69 + 5 cisho oo geediya = 74 + 1 = 75 oo lagu daro maalinta u dambaysa
  ee ay soo guurayaan kooxihii degmooyinkaasi, taasoo macneheedu yahay 71 maalmood
  kadib ay soo bixi karaan liisaska hore ee codbixiyeyaasha isdiiwaangeliyay iyadoo
  ay hubaal tahay inay hawshaasi marka aanu wax dibu-dhac ahi ku iman, ay qaadan karto
  ugu yaraan dhawr maalmood. Dabadeetana waxa bilaabmaysa diyaarinta iyo daabacaada
  liisaska kama dambaysta ah. Isku soo wada duuboo wakhtiga ugu yar ee ay hawshaasi
  u baahantahay waa saddex bilood oo ka bilaabmaysa maalintay 25 cisho ee wacyigelintu
  bilaabato. Haddaba, haddii ay maanta noqon lahayd bilowgaasi waxa hawshii doorashada
  wkakhti u hadhay hal bil keliya, balse, sida muuqata marka dhinacyo badan laga eego,
  inteeda badani way ka baxaysaa meesha. Shaki la\u2019aana hawshani waxay dhamaan
  kartaa iyadoo ay maalintii doorashada ay ka hadhsan tahay tobaneeyo maalmood. Haddii
  uu hakad yari ku yimaadana way isgelayaan oo hawshii diiwaangelinta cxodbixiyeyaasha
  oo aan dhamaan ayay imanaysaa maalintay doorashadu ku mudaysanayd.\\nGoleyaasha
  qaranku markay mudooyinka xeerka ku adidaydeen waxa sifo sharci looga haortegayay
  inaanay tan oo kale dhicin oo hawl kasta gaarkeeda loogu helo wkahti macquula.\\nWaxaan
  usoo jeedinayaa komishakna doorashooyinka Qaranka inay iska daayaan ismaqaaqa iyo
  indho-qabashada ummadda. Wadadan ay hayaan waa xagaaf meel dhow kusoo afgo\u2019aysa.
  Waxaanan xusuusinayaa inay hawsha dhabta ah ee iyaga asal ahaan loo doortay ee laga
  sugayo inay ku fuliyaan wkhtigeeda ay tahay qabshada doorashada wakhtiga loo cayimay,
  taasoo diyaargaraynteedu ugu yaraan saddex bilood u baahan tahay, waayo mar kale
  in mudada la korhiyo komishanka oo xilkiisii ku fashilmay awgeed ma jirto cid u
  diyaar ahi.\\nHaddii ay doorashadu wakhtigeeda qabsoomi waydana waxa ogaataan wixii
  natiijo ah ee halkaa ka dhasha inaanay jiri doonin cid masuuliyadeeda idinla wadaagi
  doontaa.\\n\u2013\\nCabdillaahi M. Dahir\"", "\"Madaxweyne ku-xigeenka dowlad goboleedka
  Galmudug Mudane Cali Daahir Ciid oo maalmahan ku sugan magaalada gaalkacyo ee xarunta
  gobalka Mudug ayaa kormeer ku tagay maanta xarunta wasaaradda waxbarashada ee Gobalkaasi.\\nMudane
  Cali Ciid ayaa kulan la qaatay wasiiru- dowlaha wasaarada, Agaasimaha guud iyo shaqaalaha
  xarunta isagoona ka xog-waraystay hawl-maalmeedkooda shaqo.\\nMadaxweyne ku xigeenka
  ayaa sidoo kale soo indha-indheeyay qeybaha kala duwan ee xarunta waxbarashada ee
  gobalka Mudug.\\nThis post first appeared on Radio Moqdisho. Read the https://www.radiomuqdisho.net/madaxweyne-ku-xigeenka-galmudug-oo-kormeeray-xarunta-wasaaradda-waxbarashada-galmudug-ee-galkacyosawirro/original
  article\"", "\"Guddoomiyaha golaha guurtida Saleebaan oo Sheegay in aan la soo Celinayn
  Xeerkii Doorashada ee uu iyaga ka Gudbay\\nHargeysa(Qaran news)- Buuq iyo sawaxan
  hadheeyay fadhigii saaka ee Golaha Guurtida,kadib markii mudanayaal dalbaday in
  dib loo soo celiyo Xeerarkii isa saarka Doorashooyinka.\\nGuddoomiyaha Golaha Guurtidda
  Md. Saleebaan Maxamuud Aadan ayaa sheegay in Golaha Guurtida uu ka gudbay xeerkaasi
  oo aan dib loo soo celin karin. Kadibna waxa golaha ka istaadhmay buuq ay xildhibaanno
  soo jeedinayeen in dib loo soo celiyo xeerka doorashooyinka ee Golaha wakiiladdu
  dhawaan ku ansixiyeen qaabkii hore ee uu iyaga kaga baxay.\\nBuuq iyo sawaxan kadib
  guddoomiye Saleebaan ayaa xidhay fadhigii saaka.\"", "\"Xoogag ka tirsan Al-shabaab
  ayaa xalay weeraray habeenkii labaad degmada Afgooye ee gobolka Sh/hoose.\\nWeerarkan
  oo markii hore ku bilowday labo qarax oo loo adeegsaday bambooyin ayaa waxaa uu
  si gaar ah uga dhacay fariisin Ciidamada Dowladda ku leeyihiin agagaarka saldhiga
  degmada Afgooye.\\nCiidamada Dowladda oo markii horeba ku jiray feejignaan dheeri
  ah, maadaama habeen hore la weeraray ayaa iska caabiyay dagaalyahanada Al-Shabaab
  ee soo weeraray sida wararku sheegayaan.\\nWeli lama oga khasaaraha rasmiga ah ee
  ka dhashay dagaalka kooban ee ciidamada dowladda iyo Al-shabaab ku dhexmaray degmada
  Afgooye.\\nIntii uu weerarkan socday ayaa Ciidamada AMISOM ee degmadaas ku sugan
  waxay rideen Madaafiic, kuwaasoo ku dhacay duleedka degmada Afgooye, kuwaasoo iyana
  ilaa hadda aan la ogeyn cida wax ku noqotay.\"", "\"Madaxweyne Ku-xigeenka dowlad
  Goboleedka Jubbaland ahna ku simaha madaxweynaha Mudane Maxamuud Sayid Aadan ayaa
  si\u2019rasmi ah u furay mashruuca Dhismaha Golaha degaanka ee dowlad goboleedka
  Jubbaland.\\nXaflada daahfurka waxaa madaxweynaha kuwehliyay qaar kamid ah Golaha
  fulinta DG Jubbaland, Golaha sharci dajinta DG jubbaland, Gudomiyaha gobolka J.hoose,
  Gudomiyaha Gobolka Gedo, bulshada qeybaheeda kaladuwan iyo mas\u2019uuliyiinkale.\\nWaxaana
  dhawaan lafilayaa in ay bilaabmaan dhismaha golayaasha degaanka iyadoo ay fulindoonto
  Wasaaradda Arimaha Gudaha iyo Dowladaha hoose ee DG Jubbaland, Guddiga Dorashooyinka
  Jubbaland iyagoo kashanaaya Hay\u2019ado heer caalami ah.\"", "\"Suuqii Xagaaga
  ee la soo dhaafay waxa la sameeyay saxiixyada ugu waaweyn yurub iyada oo kooxo badan
  is xoojiyeen laakiin xiddigehee soo bandhigay qaab ciyaareed fiican?\\nXilli aan
  la saadaalin karin xiddigaha fashilmi doona ama xiddigaha sida fiican u ciyaari
  doona hadana wax ay wax walba kala cadaadaan marka la gaadho dhamaadka xilli ciyaareedka.\\nKooxaah
  premier League ayaa xagaagii hore suuqa galiyay lacag ka badna 2 bilyan euro iyaga
  oo kula soo wareegay xiddigo kala duwan oo ku soo biiray 20-ka kooxood ee premier
  league.\\nSidoo kale waxa jira saxiixyo ka dhacay horyaalada kale ee Serie A, La
  Liga, Germany, France iyo meel kale.\\nHadaba warbixintan waxan ku soo bandhigi
  doonaa xiddigihii qaab ciyaareedka fiican soo bandhigay xilli ciyaareedkii dhamaaday
  ee xagaagii ku soo biiray kooxaha kala duwan.\\n1.Erling Haaland (Man City, \u00a351m):\\nMa
  jirto wax lagu qiyaasi karo qaab ciyaareedka Haaland, xiddiga reer Norway ayaa Man
  City ugu biiray lacag 51 milyan ah laakiin waxa uu muujiyay in ay Man City ka faa\u2019iiday
  lacagta ay ka bixisay.\\nXiddiga ayaa jabiyay rikoodh kasta oo premier League ah
  waxana uu dhaliyay 36 gool premier League halka uu tartamada oo dhan dhaliyay 52
  gool waxana lagu tilmaami karaa saxiixa ugu fiican suuqii xagaaga.\\n2.Khvicha Kvaratskhelia
  (Napoli, \u00a39m):\\nXiddiga Khvicha Kvaratskhelia saaran dibnaha taageerayaasha
  horyaalka Talyaaniga ama qaarada yurub kadib markii uu qaab ciyaareed cajiib ah
  ku soo bandhigay kooxda Napoli.\\nNapoli ayaa 9 milyan oo euro ka soo bixisay xiddiga
  waxana la filayay in aanu samayn wixii uu sameeyay laakiin xiddiga ayaa ku lug lahaa
  32 gool tartamada oo dhan 42 kulan oo uu ciyaaray.\\n3.Robert Lewandowski (Barcelona,
  \u00a342m):\\nKa dib markii uu ku guuleystay 19 koob oo uu ku dhaliyay 344 gool
  Bayern siddeed sano oo xusuus ah, Lewandowski wuxuu go\u2019aansaday inuu ku biiro
  Barcelona waxana la filayay in uu buuxiyo kabihii uu Messi ka tagay.\\nLaakiin Lewandowski
  ayaa muujiyay in da\u2019du kaliya tahay Lambar waxana uu wacdaro ka dhigay horyaalka
  La Liga waxana uu kooxdiisa Barcelona ku hogaamiyay ku guulaysiga horyaalka waxana
  uu gool dhalinta ku garaacay xiddiga Karim Benzema.\\n4.Casemiro (Manchester United,
  \u00a370m):\\nUnited ayaa si weyn uga dhibaatootay khadka dhexe sanadihii ugu dambeeyay
  waxana ay xagaagii u dhaqaaqday xiddiga Casemiro kaas oo kaligiis xaliyay dhibaatada
  United haystay ilaa kadib wakhtigii Sir Alex Ferguson.\\nCasemiro ayaa lagu tirin
  karaa xiddigihii ugu fiicnaa horyaalka premier League xilli ciyaareedkii dhamaaday
  waxana uu United ka caawiyay in ay gaadho 2 final halka ay sidoo kale u soo bexeen
  champions League.\\n5.Kim Min-jae (Napoli, \u00a316m)\\n6.Gabriel Jesus (Arsenal,
  \u00a345m)\\n7.Niklas Sule (Borussia Dortmund, Xor)\\n8.Enzo Fernandez (Benfica,
  \u00a310m)\\n9.Manuel Akanji (Man City, \u00a315m)\\n10.Folarin Balogun (Reims,
  Amaah)\\n11.Sven Botman (Newcastle, \u00a335m)\\n12.Alexandre Lacazette (Lyon, xor)\\n13.Andre-Frank
  Zambo Anguissa (Napoli, \u00a314m)\\n14.Randal Kolo Muani (Eintracht Frankfurt,
  \u00a314m)\\n15.Xavi Simons (PSV, Xor)\\n16.Andreas Christensen (Barcelona, Xor)\\n17.Andre
  Onana (Inter, Xor)\\n18.Take Kubo (Real Sociedad, \u00a36m)\\n19.Paulo Dybala (Roma,
  xor)\\n20.Alexis Sanchez (Marseille, Xor)\\n21.Matthijs de Ligt (Bayern Munich,
  \u00a367m)\\nRelated\"", "\"Turkiga ayaa ku dhawaaqay in dalkiisa u furayo Bukaanada
