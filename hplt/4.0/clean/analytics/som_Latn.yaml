  geeriyoodeen in Saddexda loo dhisay Qudbiyo iyo dhismoyaal aan Diinta iyo Shareecaduba
  aanay banaaneyn!!! Waxana sababay Muxibo iyo Jibo aan Xad lahayn iyo Aqoonta Diinta
