  "\"MUQDISHO (SONNA)- Hoobiyeyaasha ay arxan-laawayaashu ku soo tureen deegaankan
  ayaa khaasaro hantiyeed iyo dhaawac u geystay dadka deegaanka.\\nCiidanka Xoogga
  dalka ee ku sugan Aw-dheegle ayaa weerar ku qaaday qaaday maleeshiyadii Hoobiyeyaasha
  ku soo weeraray deegaankaas, kuwaa oo qorsheynayay in Hoobiyeyaasha kedib ay weerar
  fuleynimo ah ku qaadaan.\\nCiidamada ayaa sheegay in ay soo af-jareen Maleeshiyadaas
  oo ku dhuumaaleysanayay meel ka baxsan Aw-dheegle, waxa ayna ciidanku guulo la taaban
  karo ka gaareen hawlgalkaas.\\nCiidanka Xoogga dalka ayaa toddobaadyadii ugu danbeeyay
  gobolada dalka ka waday hawlgalo culus oo lagu baacsanayo dhagar-qabayaasha Al-shabaab,
  waxaana laga xoreeyay deegaano badan oo ka tirsan Galmudug, Hirshabeelle iyo Jubaland.\\nLa
  wadaag cid kale\"", "\"Xadhigjiidka Axsaabta Xuquuqbaa ku Lumeysa(1) Dr.Elmi M.Nur\\nPosted
  by Sawnews.tk on August 15, 2009\\nHordhac.\\nMarxaladaha siyaasadda Somaliland
  ee socod baradka ahi waxaad mooddaa maanta iney madaxa ku hirdidey mawjado ay adag
  tahey in la saadaaliyo raadka ay kaga tegayaan qarankan curdinka ah.\\nXaaladaha
  sii murgaya iyo wakhtiga xasaasiga is gurayaa waxay u muuqdaan kuwo geeddi socodkii
  ummaddan ee wali martida ka ah nidaamka adduunka, ku hagaayaan marxalad aysan furdaaminteedu
  sahlanaan doonin.\\nHalkan lagumasoo koobi karo qaddiyadaha murugsan ee ka dhashey
  siyaasadda ku qotonta xafiiltanka, nin tooxsiga, car iyo wirta ee baryahani calaamadda
  u nuqdey golayaasha Somaaliland iyo saameyntooda nolosha dadweynaha. Waxaase hubaal
  ah halista ugu weyn ee soo wajahdey masiirka ummadda iyo nidaam dawladnimo oo ka
  hana qaada dalku tahey go\u2019aannada xikmadda ka madhan iyo adeegsiga awoodaha
  aan xeer dabra laheyn ee la isu adeegsanayo.\\nMarka laga gudbo xadhijiidka iyo
  buuqa iyo muranka ka aloosan golayaashan xiiqsan una degto nuxurka xaqiiqada qaddiyadda
  waxaa kuu soo baxaya inuu dhinackastiba doonayo inuu qiiqa ku qariyo guuldarrada
  ay kasoo hooyeen waajibaadkii saarnaa. Haddaba inigoo isu dayaya inaan mid mid usoo
  qaato waxaan maanta wax yar ka bidhaamin doonaa halka sartu ka qudhuntey waa guddiga
  doorashooyinka qaranka ee lagu guuldarreystey iyo kadeedka ay abuureen.\\nGuddiga
  Doorashooyinka Qaranka GDQ.\\nDoorashadu waa mashruuc baaxad leh waa marxalad halis
  badan, waa xilliga ummadi ammaba waddan si kasta oo uu biseyl siyaasadeed, xasiloonaan
  iyo dawlad wanaag ugu naaloodo uu ugu nugeyl badan yahey. Waa marxalad uu qaranku
  ruqaansadey una dhaxeeyo inuu hore u guuro iyo inuu gadaal u dheelliyo oo guuldarro
  aan laga soo waaqsan karin galo. Waa xilli xamaasaadda iyo baratanka axsaabtu haddaan
  xilkasnimo lagu maareyn, uu si toos ah ammaba si dadban uu qaarkood ula gali karo
  dano liddi ku ah masiirka ummadda. Sidaa darteed waxaa lagama maarmaan aheyd in
  cidda loo caleema saarayo iney maraxaladdaa halista badan ka tallaabiso qaran aan
  tiir adag ku joogin adduunkana hiil taageero ka haysan, aad loo qiimeeyo. Waxaa
  loo baahnaa in kooxda hawshan gadhwadeenka ka noqonaya la hubiyo iney noqdaan kuwo
  lagu aammini karo masuuliyadda mugga weyn leh. Ma aha in lagu qiimeeyo iney da\u2019ahaan
  iyo daacadnimo buuxiyeen shuruudda, balse waa iney noqdaan kuwo ku guuleysta xulkii
  qaranka ee xilkan xajmigiisa iyo walwalkiisa leh. Taasi waajibaad culus ayey saareysaa
  golayaasha soo magacaaba xubnaha komishanka iyo wakiilladaba iney hubiyaan lahaanshaha
  aqoonteeda, waayo aragnimadeeda, miisaankeeda garsoorrsoornimo caddaalad leh, hufnaan,
  wadashaqeyn (teamwork) iyo farsamo maamul oo aad u sarreysa.\\nMarka arrimahaas
  lagu saleynayo abaabulka guddigani, ummadda iyo golayaashuna gaadh ka hayaan ee
  ay si joogta ah ugu kuurgalayaan halka ay dalka ku hagayaan iyo qaabka ay u gudanayaan
  waajibka qarada leh ee saaran, waxaa sahlanaaneysa in qiimeyn joogta ah lagu sameeyo,
  taasi oo ay ku kasban karaan kalsoonida ummadda iyo asxaabta loolameysa intaba ammaba
  ay ku luminayaan. Laakiin marka muhimmaddani noqoto mid lagu bixiyo shaqaaleysiin
  iyo shakhis jaceyl iyo dano siyaasadeed oo gaar ah waxaa ku lumaya danta guud iyo
  xuquuqda masiiriga ee ummadda, waana ta horseeddey xaaladdan cakiran ee maanta inna
  hortaalla.\\nMarka loo yimaaddo hirdanka axsaabta iyo golyaasha qaranka ee ka aloosmey
  diiwaan gelinta waxaa marka hore masuuliyaddeeda qaadaya GDQ oo si isdaba joog ah
  oo xilkasdarro ka muuqato ugu fashilmey iney fahmaan (is kadaa iney gutaan eh) masuuliyadda
  saaran, ilaa haddana ay ka lunsantahey, iney abuuraan isu kalsooni dhexdooda ah
  (ka sokow mid qaran). Waxey ku guul darreysteen iney go\u2019aan mid ah soo saaraan
  oo xaqiiqada ku qotoma, iney hubaal ka yeelaan qorshihii iyo agabkii ay doorasho
  xor ah oo xalaal ah ku qaban lahaayeen muddada gaaban ee ka dhiman. Marka habdhaqankoodii
  muddadaas ay jireen dib loo jalleeco, ma muuqanayo waxaan ka aheyn, go,aanno qabyo
  ah, natiijooyin is burinaya, hubsiimo la\u2019aan, khilaaf joogta ah, dayac xogtii
  ummadda, , qiyaasxumo aaney xaddidi karin waajibka sugaya iyo qorshe la\u2019aan
  hawlaha muddeysan ee sugaya. Go\u2019aanka guddoonka GDQ ay ku laaleen natiijadii
  diiwaangelinta iyo eedda ay usoo jeedinayaan Interpeace ma noqoneyso mid ka dhaqeysa
  guuldarrooyinka taxanaha ah ay ka soo hooyeen wajigii koowaad ee xilka loo igmadey.
  Mas\u2019uuliyaddarrada ay muujiyeen ayaa keentey in Interpeace isa siiso awood
  ayna mudneyn iyo iney hay\u2019addani xurmeyn weydo xeerarka dalka ay martida u
  tahey.\\nMarka hawshan dib loo eego qaladka ugu weyni wuxuu kasoo unkamey markii
  waajibaadkii ay laheyd wasaaradda arrimaha gudaha iyo dawladaha hoose oo ah bixinta
  jinsidda muwaaddinka oo ka horreyn lahadyd diiwaan gelinta dusha laga saarey GDQ
  ka. Laakiin haddii duruufaha dhaqaale iyo wakhtigu khasbeen in hawshan la isu daro,
  waxey ku habbooneyd in fulinteeda guddi gaara iyo dawladaha hoose loo saaro. Markaa
  doorka GDQku wuxuu ku koobnaan lahaa hubinta in natiijada soo baxdey doorasho lagu
  geli karo iyo in kale. Waayo masuuliyadda aassaasiga ah ee GDQ waxey aheyd iney
  doorashooyin ku qabtaan wakhtigii loo muddeeyey, xaqna u laheyn iney iyago wax ka
  beddelaan. Farsamo ahaan iyo sharci ahaanba ma habbooneyn iney GDQ dhalashada jinsiyadda
  bixiyaan. Xaaladda habqanka ee murugsani waa mid haddii laga gudbo mudan in waxbadan
  laga barto. GDQku wuxuu noqdey kuwii hawshan diiwaan gelinta iyo jinsiyadda fuliyey
  isla markaana fashilkeeda ka marakacey, taasi oo keentey iney waxbadan xeerar badani
  is hirdiyaan, madaxana isugu dhufataan dhinacayadii ay dartood guddigani u dhaarteen
  iney ugu yaraan kala dhowraan haddeysan isu soo dhaweeyn karin.\\nMaxaa Xal Noqon
  Kara?\\nHaddaba xadhigjiidka golayaasha iyo jahawareerka siyaasdeed ee arrintan
  murugsan ka dhashey iyo xaaladda aan ka soo rayneyn ee komishanku waxey walaac xoog
  leh ku abuureysaa qofkasta oo dhab ula socda waaqica taagan, qiimeynna kara, natiijada
  laga sugi karo, geeddiga habeenaad ee guddigani ku yabooheen iney, mar kale gaadiid
  la\u2019aan, raraan qarankan socod baradka ah. Xaqiiqada inna hor taalla waxey tilmaameysaa,
  haddii aan xal wadajir ah degdeg loogu hawlgalin; karti xumada komishanka, kalsoonida
  luntey iyo sida muuqata kaalmo la\u2019aanta beesha caalamka waxey bidhaamineysaa
  kadeed hor leh oo aan la saadaalinkarin halka uu saldhigan doono iyo saameynta uu
  reebi doono.\\nHaddaba si looga gudbo moronkan daba dheeraaday oo galey wajiga xasaasiga,
  waxaa lama huraan ah inaanan hirdanka xisbiyada lagu hilmaamin waaqica cusub mashaqadani
  ka abuurmey:\\n- Ma muuqato rajo iyo kalsooni dhiman in GDQku gudan karaan waajibaadka
  farsamada iyo wadashaqeynta ay u baahan tahey doorasho xor ah oo xalaal ah ammaba
  ku sixi karaan qaladaadka qarada le hey galeen, qarankanna kaga sabata bixin karaan
  khatarta uu ficilkoodu horseedey.\\n- Diiwaan gelintu waa mashruuc qaran, wakhti,
  maal iyo maskax badanina gashey hase ahaatee shaki kuma jiro iney farsamo xumo,
  takrifal iyo xil gudasho la\u2019aan ka timid guddiga doorashadu owgeed uga leexatey
  hadafkii dartii loogu badheedhey.\\n- Natiijada diiwaan gelintu sidaan ognahey waxey
  soo saartey muuqaal foolxun oo ah iney, si ogaal ah, ummadda badhna gabi ahaanba
  jiritaankooda is waayaan, la iskana hortaago xaqa doorasho ee codkooda, badh kalena
  qofkiiba toban iyo in kabadan kaga qayb galaan doorashada, taasi oo gabi ahaanba
  baal marsan hadafkii iyo caddaaladdii laga lahaa diiwaan gelinta.\\n- Caddaalad
  darradan aan hadda maaro loo hayn intaan doorashaba la gaadhini, waa mid mustaxiil
  ka dhigeysa in lagaga gar niqi karo sanduuqa doorashada iyo natiijada ka soo baxda,
  iyadoo codkastaa ku qiimeysan yahey halka uu gaadhsiin karo masharaxiisa, oo ah
  kursiga uu sarreeya talada dalka.\\nHaddaba aniga aragtideyda shakhsiga ah marxaladdan
  kala guurka ahi waxey khasbeysaa in goloyaasha qaranku ka gudbaan nin tooxsiga iyo
  ficiltanka iyagoo u tudhaya shacabkan go\u2019doonka ah, gartaanna in mustaqbalka
  ummaddu ku xidhan yahey Ilaahey ka sokow kartida, xikmadda iyo hab dhaqanka goloyaasha
  qaranka iyo hoggaanada asxaabta. Sidaa darteed waxaan soo jeedinayaa:\\n- In GDQ
  (marka laga reebo labada xubnood ee cusub) sida ugu dhakhso badan iyagoo u tudhaya
  shacabkooda eegayana xaaladda khatarta ee ay sabab u noqdeen, midkalena u baajiyaan,
  is casilaan ammaba wada jir looga codsado iney banneeyaan iyagoo sharaftooda leh
  kuna ixtiraaman.\\n- In golayaasha dalka iyo xisbiyadu si degdeg ah u magaacaabaan
  xubno karti, aqoon iyo hufnaan leh oo buuxiya kaalintan qabtana doorashada madaxweynaha
  diiwaan gelin la\u2019aan, si or ah oo xalaal ah.\\n- In la abuuro guddi qaran oo
  kala shaandheeya diiwaan gelinta iyo bixinta jinsiyadda, wixii ka dhimanna dhammeystira,
  iyadoo lala kaashanayo hay\u2019adaha ay khuseyso iyo saaxiibbada Soomaliland.\\n-
  In natiijada diiwaangelinta oo hufan lagu dhaqmo doorashooyinka danbe laga bilaabo
  doorashooyinka dawaladaha hoose ee soo socota si tajribada ka soo baxda looga faa\u2019iideysto
  wakhti ku filanna loogu helo sixidda iyo horumarinteeda.\\nUgu dambeyntii waxaan
  golayaasha dalka u soo jeedinayaa iney fahmaan in go\u2019aannada taabanaya masiirka
  ummadda aanan lagu qaadan xaalad caadifad iyo rag iska celini ku dheehan tahey,
  waa in caqliga iyo xikmaddu shaqeyso, waa in xaalad kasta wada tashi isku tanaasul
  lala yimaaddo, iyadoo ay lagama maarmaan tahey in qaraarada lagu saleeyo xaqiiqooyin
  si cilmiyeysan ah loo daraaseeyey loogana baaraan degey natiijada ka dhalaneysa,
  iyadoo la xeerinayo danta guud, himilada iyo wadajirka ummadda.\\nElmi M Nur\\nSweden\\nLeave
  a Reply\"", "\"TACSI TIIRAANYO LEH: \u0625\u0646\u0627 \u0644\u0644\u0629 \u0648\u0625\u0646\u0627
