  Bartolini, Giacomini, Maldini, Maurensig, Tam e Morat, dul\u00e0 che i persona\u00e7s
  si movin intun mont compon\u00fbt des tramis di ducj i roman\u00e7s pussibii e a
  jentrin in contat cun altris persona\u00e7s leteraris.\u201d\\nCarlo Tolazzi, president
  de jurie, al \u00e8 some\u00e2t plui content dai ultins agns disint che e je stade
  une edizion dal premi interessante cuntun alt numar di oparis presentadis, ben cutuardis,
  dul\u00e0 che si \u00e8 viodude ancje une buine partecipazion feminine cun cuatri
  autoris. Il nivel al \u00e8 st\u00e2t di prese\u00e2 cun almancul un s\u00ees o
  siet oparis che, par struture narative, lungjece e temis front\u00e2ts, a podevin
  confront\u00e2si cu la definizion di roman\u00e7. Al \u00e0 ancje marc\u00e2t, cun
  sodisfazion, il fat che lis tematichis sieltis dai concorints a an v\u00fbt un resp\u00eer
  ampli e moderni, e, se e je vere che la opare vincidore e jere une cuarte parsore
  di ch\u00eas altris, la cualit\u00e2t in gjener\u00e2l e je stade valide.\\nAl \u00e8
  masse adore par cap\u00ee se e je passade la prognosi risiervade pe leterature furlane
  un tr\u00ea agns inda\u00fbr propit dal San Simon, e ancje par cap\u00ee se il ruspi
  e dolor\u00f4s dibatit che dasp\u00f2 si jere davuelz\u00fbt al vedi puart\u00e2t
  a alc di posit\u00eef e che al duredi tal timp. Dut c\u00e2s chest an di Codroip,
  de jurie e des autorit\u00e2ts presintis, no cate il contest esterni di sig\u00fbr
  dificil pe culture e pe lenghe furlane, a son st\u00e2ts mand\u00e2ts dai segn\u00e2i
  posit\u00eefs.\\nLa motivazion dal premi cjapade dal verb\u00e2l de Jurie:\\n\u201cUne
  storie ben postade te suaze di un Fri\u00fbl e di une Mitteleurope che a partegnin
  ae nestre culture e ae nestre leterature. Une conte moderne l\u00e0 che il furlan
  si pant tant che une lenghe braurose di confront\u00e2si cul resp\u00eer de narative
  internazion\u00e2l. I nivei di leture a son plur\u00f4s e no cate il p\u00eas di
  citazions salacor cualchi volte di masse, la storie e cor vie cun sugjestions che
  nus fasin prese\u00e2 une tiere no su l\u2019\u00f4r de Italie, ma tal mie\u00e7
  de Europe\u201d. \u25a0\\nMaurizio Biasizzo\\nBARCELONA Aureli Argem\u00ed, fundador
  i president em\u00e8rit del Centre Internacional Escarr\u00e9 per a les Minories
  \u00c8tniques i les Nacions (CIEMEN), ha mort aquest dilluns als 88 anys, segons
  ha informat l\u2019entitat en un comunicat. Nascut a Sabadell el 1936 i llicenciat
  en teologia a Roma i Par\u00eds, va ser monjo de Montserrat, va formar part [\u2026]
  lei di plui +\\nUne biele gnove pe nestre int! A tornin a jessi in volum li \u201cLETARIS
  AI FURLANS\u201d di Pre Bepo Marchet Intune edizion curade e comentade di Davide
  Turello, a saran presentadis MIERCUS AI 3 DI AVR\u00ceL aes 5 e mieze sot sere inte
