  ai Colonos\\nwww.aicolonos.it\\ntel 0432 76 49 12\\ntel 0432 76 49 03\\nmob 342
  0803361\\nagricolonos@cheapnet.it\"", "\"A 12 km da Tumie\u00e7 e a p\u00f4us min\u00fbts
  di strade de Pl\u00eaf di San Pi\u00eari di Zui, a 830 m. sul livel dal m\u00e2r,
  a si cjate il pi\u00e7ul paisut di Fielis. Il pa\u00ees al conte cirche 45 animis
  che a vivin dut il timp dal an, d\u2019est\u00e2t chist numar al cres fint a 200/250.
  Tancj a son i paesans che a tornin a salud\u00e2 la l\u00f4r cjere ma a son tancj
  encje i turiscj e i forescj che a rivin da Triest, Vignesie, Milan, Rome par pass\u00e2
  cualchi d\u00ec in p\u00e2s e trancuilit\u00e2t.\\nA Fielis a \u2018nd \u00e8 un
  grum di cjantons interessants da scuviergi: la cjase \u201cdai moros\u201d, cu la
  s\u00f4 struture carateristiche dai archs in pi\u00eare metude a n\u00fbf pouc timp
  fa grazie al comun e al intervent des \u201cbelle arti\u201d; l\u2019ex latarie
  soci\u00e2l indul\u00e0 che a si pos viodi cem\u00fbt che si lavorave il lat dal
  pa\u00ees (ai son encje i regjistros par segn\u00e2 la cuantit\u00e2t di lat che
  ognidun a puartave); la glesie dal sietcent dedicade a San Roc.\\nMa a si cjate
  encje, inte ex scuele, un pi\u00e7ul bar cun negozi di aliment\u00e2rs indul\u00e0
  che, prenotant, a si pos mangj\u00e2 plats tradizion\u00e2i (in particol\u00e2r
  a Fielis a son fam\u00f4s i cjarsons).\\nD\u2019inviern Fielis a davente mete di
  tancj turiscj che cu lis cjaspis a van in Malghe Daude (obiet\u00eef tant prese\u00e2t
  encje d\u2019est\u00e2t, lant a p\u00eet o in biciclete, dul\u00e0 che si pues cjat\u00e2
  formadi e scuete frescje); il percors al davente inm\u00f2 plui intaressant parc\u00e8
  che lant indavant a si rive prime in malghe Meleit (indul\u00e0 che al \u00e8 l\u2019agriturisim)
  e po\u2019 intal Zoncolan.\\n\u201cAveniments che an segn\u00e2t il pa\u00ees \u2013
  al conte il giovin Cristian Agostinis \u2013 a son principalmentri doi: il taramot
  dal \u201876 che, come dal rest dal Fri\u00fbl, al \u00e0 lass\u00e2t i siei segnos
  e mi ven tal cj\u00e2f la place 19 di mar\u00e7 cuant che in timp di vuere i cosacs
  a vevin di cop\u00e2 ducj, ma grazie a un miracul ch\u2019al ven atribu\u00eet a
  San Josef a son st\u00e2ts sparagn\u00e2ts; da chel an par ringrazi\u00e2 a si f\u00e2s
  la pussisjion. Par vegni a Fielis a tocje prin di dut vei pasjion pe mont e pe trancuilit\u00e2t!
  No si pos pratindi di vei dutis lis comodit\u00e2ts de sit\u00e2t! Ma a \u2018nd
  \u00e8 robis che la sit\u00e2t a s\u2019insumie di d\u00e2! Tocje dome saveilis
  scuviergi e prese\u00e2!\u201d \u25a0\\nMarta Vezzi\\nAlessandro Marangoni: la Aclif
  e deventar\u00e0 istituzion di riferiment pai furlans \u201cLa Assemblee dai sindics
  furlans e je une realt\u00e2t necessarie. E cul timp e deventar\u00e0 ancjem\u00f2
  di plui un pont di riferiment pe identit\u00e2t de nestre int\u201d. Al \u00e8 sig\u00fbr
  di chest Alessandro Marangoni, prin citadin di Dartigne, che al cr\u00f4t tant inte
  Aclif [\u2026] lei di plui +\\n\u273d\u273d No pod\u00ecn sig\u00fbr f\u00e2 fente
  che la vuere in Ucraine no dedi une serie di problemis intrig\u00f4s ancje aes fuarcis
  che si riclamin ae autodeterminazion dai popui e al ricognossiment dai dirits des
  minorancis etnichis. Prin di dut, ce che al \u00e8 da\u00fbr a sucedi al \u00e8
  la ultime dimostrazion che chei problemis no [\u2026] lei di plui +\\nLis strategjiis
  macroregjon\u00e2ls a son la ultime \u201cinvenzion\u201d UE par favor\u00ee la
  cooperazion teritori\u00e2l. Tr\u00ea di cuatri si incrosin in Fri\u00fbl Intai
  ultins agns, la Union Europeane si \u00e8 sfuar\u00e7ade in maniere vigorose di
  vign\u00ee dongje di plui ai citadins e \u2013 su la fonde di chest cambi di rote
  \u2013 e \u00e0 ricognoss\u00fbt une [\u2026] lei di plui +\\nTal centenari de muart
  di Pier Pauli Pasolini o ripuart\u00ecn a tocs la tierce part dal libri scrit di
  Antoni Beline tal 1993 \u2018Trilogjie tormentade\u2019, che e rivuarde propit il
  poete di Cjasarse I. RISPIET\u00c2 IL MISTERI DAL OMLa sience plui dificile e je
  la cognossince di se stes. E se al \u00e8 grivi cognossi [\u2026] lei di plui +\\nDi
  cualchi d\u00ec al \u00e8 st\u00e2t scre\u00e2t un gn\u00fbf servizi intal spa\u00e7
  e ristorant di Chiara e Matteo \u201cLa Polse di Cougnes\u201d a Zui, indul\u00e0
  che si pues cum\u00f2 cjat\u00e2 e compr\u00e2 prodots loc\u00e2i. \u201cLa idee
  e je nassude pal fat che za n\u00f4 intal ristorant o dopr\u00ecn avonde materiis
  primis dal teritori \u2013 e [\u2026] lei di plui +\\nJugn 2022 \u2013 L\u2019EDITORI\u00c2L.
  La multiculturalit\u00e2t e valorize il grant e il pi\u00e7ul / (L)INT AUTONOMISTE.
  Il pericul centralist al \u00e8 tal Dna dai part\u00eets talians / PAGJINE 2 \u2013
  LA STORIE. Di Udin a Pesariis par promovi la mont e i prodots furlans / INT DI CJARGNE.
  Aziende Agricule Rovis Sabrina di Dav\u00e0i di [\u2026] lei di plui +\"", "\"Un
  anzian si \u00e8 brus\u00e2t intal prin dopomisd\u00ec inte s\u00f4 cjase a Dignan.
  Intant che al jere in bande dal cjaminet, al p\u00e2r che al sedi st\u00e2t cjap\u00e2t
  des flamis in maniere acident\u00e2l.\\nI inferm\u00eers de Sores a \u00e0n invi\u00e2t
  daurman l\u2019ecuipa\u00e7 di une ambulance di S. Den\u00eal e l\u2019elisocors.
  L\u2019anzian al \u00e0 ripuart\u00e2t ustions di secont e tier\u00e7 gr\u00e2t
  inte part alte dal cuarp e al \u00e8 st\u00e2t somet\u00fbt daurman aes primis curis
  de bande dai sanitaris. Sul puest a son riv\u00e2ts ancje lis Vuardiis dal f\u00fbc.
  L\u2019om al \u00e8 st\u00e2t traspuart\u00e2t cul elicotar al osped\u00e2l S. Marie
  de Misericordie di Udin. (A.D.G.) \u2013 14.12.2022\"", "\"Da\u00fbr dal Teatro
  della Corte di Os\u00f4f, la s\u00f4 \u201ccjase storiche\u201d, An\u00e0-Thema
  Teatro al vier\u00e7 ancje il Cine Teatri \u201cImpero\u201d di Martign\u00e0 cuntune
  stagjon siore di propuestis par dute la famee, dai spetacui di prose il vinars di
  sere ae rassegne di flabis a mirinde la domenie dopomisd\u00ec, fintremai ai spetacui
  pes scuelis. A vierzi il sipari, vinars ai 4 di Novembar, \u201cIl segreto del bosco
  veccchio\u201d, la produzion di An\u00e0-Thema dal fam\u00f4s roman\u00e7-conte
  di Dino Buzzati, che al \u00e0 debut\u00e2t l\u2019an pass\u00e2t. A Dicembar \u201cRicordi
  e canzonette\u201d, un via\u00e7 jenfri musiche e peraulis intes atmosferis dai
  Agns \u201830-\u201950, po dopo tal 2023 tantis altris propuestis. (A.I.) \u2013
  03.11.2022\\n41\"", "\"v\u00f4s\\nv\u00f4s\\n[FO]\\n-\\ns.f.\\nemission di suns
  fate des personis par fevel\u00e2, cjant\u00e2, clam\u00e2 e v.i.:\\nla Penze e
  saludave a man e v\u00f4s, stant su la puarte (Dino Virgili, La aghe da p\u00eet
  la cleve);\\ncuant che il cjan al fermave di vuac\u00e2 al sintive lis v\u00f4s
  e i suns\u00fbrs de cene dentri cjase (Carlo Sgorlon, Prime di sere)\\n-\\nfonazion,
  produzion di suns armonics modulabii, lis voc\u00e2lse v.i., e rum\u00f4rs, lis
  consonantise v.i., fate plui che altri cu la emission dal aiar dai polmons, traviers
  de glotide e des cavit\u00e2ts oronas\u00e2ls:\\nla intensit\u00e2t de v\u00f4s,
  associade a la emission de silabe e jere plui grande cuant che i partecipants a
  cjapavin s\u00f9 i ogjets plui larcs (Giacomo Rizzolatti, Laila Craighero, Speculazions
  su la origjin dal lenga\u00e7)\\n-\\nmaniere di emeti i suns par fevel\u00e2, cjant\u00e2
  e v.i. tipiche di une persone:\\nla v\u00f4s di Greg Lake ti tire dentri e ti traspuarte
  intun insium\u2026 dal rest\u2026 no jerial lui stes a cjant\u00e2 tai prins magjics
  King Crimson? (Checo Tam, Ladies and gentlemen\u2026 Emerson, Lake & Palmer!);\\n\\\"Gnagne,
  gnagne Anute\u2026 vierzimi\u2026 no mi cognossistu te v\u00f4s!\\\" (Pieri Menis,
  Sul ag\u00e2r)\\n-\\ns.f.\\ntimbri o caratar di ch\u00ea emission di suns:\\nsi
  sintive a cjamin\u00e2 int, a l\u00e2 e torn\u00e2, po ancjem\u00f2 a va\u00ee une
  vosute cree, ma vive vive (Pieri Menis, Chei di Muraie);\\nune v\u00f4s grocjose
  e zig\u00e0, a dute gnot, di colp, a fuart, che e par\u00e8 li dif\u00fbr, tal curt\u00eel
  (Dino Virgili, La aghe da p\u00eet la cleve);\\n\\\"Ti cogn\u00f2s, ti cogn\u00f2s\\\"
  al sgrasaiave cu la v\u00f4s grocje (Maria Forte, Il Bulo di Crodio);\\nil vieli
  si jere dre\u00e7\u00e2t su lis spadulis e al fevelave cu la v\u00f4s sclendare
  \\\"Tavin\u2026 no st\u00e2 fevel\u00e2 cuss\u00ec di Tavin!\\\" (Dino Virgili,
  La aghe da p\u00eet la cleve);\\ni berl\u00e0 lis domandis muse cuintri muse, cun
  v\u00f4s di orcul (Gianni Gregoricchio, Tr\u00ea feminis);\\nla Morane e jere une
  femenone ruane, ma no beveve, cuntune vosate di om (Pieri Menis, Chei di Muraie)\\n-\\nfuarce
