  [\u2026] lei di plui +\\nTe seste edizion de rasegne \u201cQuando le Donne\u201d
  curade da la Aministrazion Comun\u00e2l di Romans, cu la autore, Walter Tomada,
  diret\u00f4r de \u201cLa Patrie dal Fri\u00fbl\u201d. A Cormons ur daran acet i
