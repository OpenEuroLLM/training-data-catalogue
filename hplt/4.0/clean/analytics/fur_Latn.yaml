  cj\u00e2f dai furlans)\\n-\\ns.f.\\nviers di un anim\u00e2l:\\ne rivave la v\u00f4s
  dai rusign\u00fbi che a si clamavin tes boschetis dulintor (Alan Brusini, Come tai
