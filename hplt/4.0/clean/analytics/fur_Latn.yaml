  tant curi\u00f4s che inmagant: e je la Messe dal Spadon, che par tradizion si f\u00e2s
  tal ant\u00eec Domo ant\u00eec. [\u2026] lei di plui +\\n\u201cApene finidis di
  lei lis poesiis dal cont Ermes, il dot\u00f4r Cesare, fra i batimans dal public,
