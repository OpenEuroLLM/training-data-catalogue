  scueladis, a puedin f\u00e2 ce che a vuelin, tant che i oms; anzit, di plui. Che
  une femine e pues f\u00e2 maraveis, parc\u00e8 che noaltris no sin di mancul di
  l\u00f4r, ancje se in tancj no lu crodin\u00bb.\\nTeresa Zais e murar\u00e0 intal
  1735, a sessante agns. Libare e indipendente cuss\u00ec come che e jere vivude.
  \u275a\\nAgnul Floramo\\nIl festival che al met in r\u00eat midiant de musiche Cjargne,
