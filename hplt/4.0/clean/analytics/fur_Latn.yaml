  inte solitudin dal munist\u00eer.\\nCuss\u00ec e spieghe la s\u00f4 poetiche intun
  passa\u00e7 une vore significat\u00eef: \u00abLis m\u00eas poesiis a son inspiradis
  di une voie oneste di divert\u00eesi, un tant par cjap\u00e2 fl\u00e2t dai torments
  di sal\u00fbt che mi perseguitin e ancje par jud\u00e2mi a sostign\u00ee il p\u00eas
