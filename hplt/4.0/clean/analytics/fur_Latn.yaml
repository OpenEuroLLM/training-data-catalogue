  Di sig\u00fbr, la s\u00f4 vene poetiche e je declarade tant che un dai esemplis
  plui biei di scriture inte suaze dal S\u00eescent furlan.\\nGjavant in struc lis
  informazions dai documents, al ven f\u00fbr che Teresa e sar\u00e8s nassude a S.
  Den\u00eal ai 22 di Avr\u00eel dal 1675. E jentre tant che terziarie francescane
