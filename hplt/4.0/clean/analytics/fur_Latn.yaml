  Checo Placerean al tacave a volt\u00e2 il Mess\u00e2l par furlan. A son pass\u00e2ts
  passe 50 agns e i furlans no \u00e0n ancjem\u00f2 plen dirit, pe Glesie di Rome,
  a pre\u00e2 inte l\u00f4r lenghe. La Conference Episcop\u00e2l dai Talians e \u00e0
  mancj\u00e2t, ancjem\u00f2 une volte, di f\u00e2 bon [\u2026] lei di plui +\\nJoibe
  di sere aes 6 intal Salon dal Popul dal Pala\u00e7 da Comun di Udin si tignar\u00e0
  la cerimonie di consegne de prime edizion dal premi ACUILE SPORTIVE FURLANE, un
  gn\u00fbf ricognossiment che al met dongje il val\u00f4r dai risult\u00e2ts sport\u00eefs
  ae cussience identitarie che i campions furlans di ogni sport a son bogns di [\u2026]
  lei di plui +\"", "\"O sin in pocjis, aromai. Strachis passudis, disvuedadis, mortificadis.
  Ma no vin\u00e7udis, fintremai che si tignar\u00ecn strentis une cun ch\u00ea altre,
  cjaminant cuintri aiar te montafin dal nestri dol\u00f4r. E ancjem\u00f2 mancul
  disperadis: la sperance no le vin mai pierdude. A \u2018nd vin simpri chel tichinin
  da p\u00eet dal c\u00fbr.\\nE je ch\u00ea, che nus sburte a bacil\u00e2 par riv\u00e2
  a sav\u00ea, par cognossi la veret\u00e2t, par metisi \u2013 alfin \u2013 la anime
  in p\u00e2s.\\nCuant che o pensi a chel frut che no ai mai cognoss\u00fbt, mi imagjini
  i siei voi. No vi\u00f4t altri che chei.\\nVoi che no viodaran mai musis sinceris
  ator di se, che no leiaran mai e mai altri la veret\u00e2t. Al sar\u00e0 par vie
  che no pues nancje insumi\u00e2mi une vite cence veret\u00e2t, al sar\u00e0 parc\u00e8
  che a son plui di trente agns che o scombat, che o berli, che o prei e che o implori.\\nE
  pensant ai voi di chel frut che no ai mai pod\u00fbt ni\u00e7\u00e2 e che a forescj
  ur \u00e0 dit mame, pap\u00e0, none, nono, mi sovegnin lis peraulis dolcis di m\u00ea
  ave, che te s\u00f4 lenghe cjalde di un pa\u00ees lontan mi cjantave \u201cnane,
  nane tu ninin\u201d. Mi torne s\u00f9 la dolcece di ch\u00ea man tai miei cjavei,
  la musiche di ch\u00eas peraulis fofis e profumadis che mi passavin il tesaur de
  lenghe che si jerin puart\u00e2ts tal c\u00fbr.\\nVe ca, o soi rivade. Plaza de
  Mayo si slargje come simpri pegre e superbeose denant di n\u00f4. Come ogni joibe
  di agns in ca, o met s\u00f9 il fa\u00e7olet blanc cul non di Patricia, m\u00ea
  brut, desaparecida tal Setembar dal 1977, pronte par partur\u00ee il so frut.\\nTal
  puest dal non dal pi\u00e7ul, che no sai e forsi mai o savarai, o ai scrit \u201cNinin\u201d.\\ndi
  L\u2019ANTESC\u00dbR\\nLa Patrie dal Fri\u00fbl e presente il libri \u201cFeminis
  furlanis fuartis\u201d. Storiis di feminis furlanis dal d\u00ec di vu\u00ea, p\u00f4c
  o par nuie cognossudis, diferentis par et\u00e2t, divignince, esperiencis formativis
  e profession\u00e2ls. Lis lee la fuarce che a esprimin tal cir\u00ee di realiz\u00e2si
  cun tignince, tai cjamps plui svari\u00e2ts. Cun bra\u00f9re pes lidr\u00ees e tal
  [\u2026] lei di plui +\\nJoibe ai 30 di Novembar al Teatro San Giorgio \u2013 Udin
  (Borc di Gra\u00e7an) si \u00e8 tignude la seconde edizion de manifestazion \u201cStin
  dongje ae Patrie\u201d che e rapresente un moment di incuintri e di solidariet\u00e2t
  cul mens\u00eel \u201cLa Patrie dal Fri\u00fbl\u201d, gjorn\u00e2l scrit f\u00fbr
  par f\u00fbr in lenghe furlane fintremai dal lontan 1946. Inte [\u2026] lei di plui
  +\\nStant che tal articul chi sore o ai scrit di iconografie music\u00e2l, la pirule
  di storie e di musiche di chest m\u00eas si intive a celebr\u00e2 un pit\u00f4r
  furlan che al \u00e0 d\u00e2t cetant in fat musiche piturade, e di lui si celebrin
  chest an i cuatricent e d\u00ees agns de s\u00f4 nassite. Lui al [\u2026] lei di
  plui +\\nDa\u00fbr di une liende, di un proverbi o di une conte popol\u00e2r si
  plate simpri une fonde di veret\u00e2t Al sar\u00e0 forsit par cheste reson che
  cualchi m\u00eas inda\u00fbr, jessude la gnove di studis sientifics che a dimostravin
  la artificialit\u00e2t dal \u00e7uc di Udin, nissun di noaltris si \u00e8 marave\u00e2t
  plui di tant. Dal rest, [\u2026] lei di plui +\\nIl festival che al met in r\u00eat
  midiant de musiche Cjargne, Valcjan\u00e2l e Cjan\u00e2l dal Fier A son trentedoi
  agns che la Cjargne e je protagoniste di armoniis music\u00e2ls estivis, graciis
  al festival de mont Carniarmonie, la prime vere rassegne music\u00e2l che e \u00e0
  pand\u00fbt une maniere di f\u00e2 culture che cum\u00f2 e je cetant [\u2026] lei
  di plui +\"", "\"gioved\u00ec 18 settembre 2008\\nUn famos giornal si \u00e8 lanci\u00e0t
  a vendi vin cun lis modernis tecnologis . L''\u00e8 stat creat un sit www.wsjwine.com
  par vendi vins in Americhe di diferentis zonis dal mont (13 pais) e di difarentis
  produzions: Argentine 1, Australie 7, Austrie 1, Cile 4, France 43, Italie 9, Germanie
  5, Ongjiarie 3, Gnove Zelande 4, Portogal 3, Spagne 4 e poi i plui famos produtors
  di vin tal mond USA 41! Same\u00e8 che le cualitat e lassi un poc a desider\u00e0,
  ma disin che si \u00e0 di scuminza par pod\u00e8 miglior\u00e0 dopo.\\nVedaren come
  che funzione...\\nVedaren come che funzione...\\nvenerd\u00ec 12 settembre 2008\\nCome
  che ripuarte un giornal di Firenze, l''atacant da Fiorentine Adrian Mutu l''\u00e0
  dat il propit nom a un vin di Castelnuovo Berardenga. Il vin di clamar\u00e0 \\\"Il
  10 di Adrian Mutu\\\", vermentino blanc, rosat e ros. Cuiss\u00e0 se cualchi cantine
  furlane premiar\u00e0 in chist mut un zuador dall''Ud\u00ecn, par brind\u00e0 al
  suc\u00e8s!\\ngioved\u00ec 11 settembre 2008\\nCualchi riflesion final su le cuestion
  dal Brunello. Di une bande l''\u00e8 un prodot di alte cualitat che nol pol jessi
  snaturat cun modifichis di produzion, almancul di no f\u00e0 un Brunello di Serie
  A e un di Serie B. Di che altre lis pressions economichis (baste viodi ce che costin
  lis butilis) che domondin plui flessibilitat par vendi di plui. Il rest mi sam\u00e8e
  filosofie o cjacaris come che disevin i vons.\\nUne cuestion ancjemo viarte che
  si viodar\u00e0 cimut che v\u00e0 a finile.\\nmarted\u00ec 9 settembre 2008\\nUn
  ziar a cognossi un vin furlan, chel sameave piardut dopo da fillossere: il pignul.
  Nas in ta zone di Buri e il ven za citat dal 1300, cuand chel venive ufiart da citadinanze
  di Udin ai luogotenens che rivavin. Tornat a cjat\u00e0 dongje da Abazie di Rosaz
  tal 1970, el \u00e8 un vin chel spose ben sie le ciar rosse che blancje. Cuasi a
  dut past, se il prin l''\u00e8 important. Bon brindisi!!\\ndomenica 7 settembre
  2008\\nTra un an, gambiar\u00e0 le classificazion dai vins passand da piramide DOCG/DOC/IGT/VDT
  al sisteme europeo za in vigor par gli alimens e il ueli DOP e IGP. Chest cambiament
  el compuarte le riduzion a 182 tra DOP e IGP cuintri lis 470 DOCG, DOC e IGT. Soredut
  sar\u00e0 un territori a part\u00e0 il nom e no plui une zone specifiche vocade
  a che produzion. Par f\u00e0 l''esempli dal Brunello, il Rosso di Montalcino, Sant''Antimo
  e Moscadello sarn dutin inglobadis ta definizion Brunello DOP. Cui chel var\u00e0
  teritoris in che zone podar\u00e0 clam\u00e0 il vin Brunello ancje se no sar\u00e0
  plui le stese cuestion. E magari giav\u00e0nt fur lis vis definidis improdutivis
  si cjape ancje un premi.\\nDal moment che l''Europe a decidut che si produs masse
  vin, bisugne sgarf\u00e0 fur lis vignis improdutivis, e sper\u00e0 che nol sucedi
  come cul lat e il forment che cum\u00f2 vin di import\u00e0 da Cine...\\nI giapones
  e stan z\u00e0 provan il sake pasat tas bottis di vin blanc par dagij un altri savor...\\nDal
  moment che l''Europe a decidut che si produs masse vin, bisugne sgarf\u00e0 fur
  lis vignis improdutivis, e sper\u00e0 che nol sucedi come cul lat e il forment che
  cum\u00f2 vin di import\u00e0 da Cine...\\nI giapones e stan z\u00e0 provan il sake
  pasat tas bottis di vin blanc par dagij un altri savor...\\nsabato 6 settembre 2008\\nSi
  \u00e8 vidut secuestr\u00e0 butilis di Brunello, di aziendis ancje famosis, fat
  cun ue difarente dal Sangiovese, cince rispet\u00e0 il disciplinar di produzion,
  lis regulis che sigurin chel chel compre da cualitat dal prodot. Ma cuai sono i
  limis tan contestas dal disciplinar di produzion? Soredut us\u00e0 dome ue Sangiovese,
  prodote tal territori comunal di Montalcino. Tanc sostegnin che no si pol produsi
  un vin al 100% Sangiovese, ma l''\u00e8 mior tajalu cun un tic di merlot, cabernet
  o altris vins. Esperiencis dal genar son stadis fatis, ma le cuestion je che no
  si pol clamalu Brunello, baste clamalu in altre maniere. Se no si fevele di condono!
  Si \u00e0 di d\u00ec che si a scherzat e no si son rispetadis lis regulis, e che
  certis butilis \\\"di ecellenze\\\", no son propit cuss\u00ec. Alore parce cir\u00e8
  di modific\u00e0 il disciplinar? In nom da modernitat? Da evoluzion dal gust di
  chei che lu bevin? o in prevision da gnove normative di classificazion dai vins
  propueste da Union Europee?\"", "\"Dal Schisme di Ocident\\ne de Vuere dai Cent
  Agns\\nLa Europe che e jes f\u00fbr dal Millennium de Ete di Mie\u00e7 e sta cambiant
  muse, e svelte. Se o volessin segn\u00e2 suntune lavagne - propit come che si f\u00e2s
  a scuele - lis datis che a fasin di cerniere jenfri i doi periodis, o podaressin
  segn\u00e2 il 1409, l\u2019an dal gran Consei di Civid\u00e2t, l\u00e0 che un pape
  che al veve cjap\u00e2t il non di Gregori XII, al secul Agnul Correr, al cir\u00ec
  di risolvi il probleme dal Grant Schisme di Ocident, che al durave bielz\u00e0 dal
  1377 e che al viodeve un Pape franc\u00eas in France, a Avignon, e chel altri talian
  a Rome. E al pens\u00e0 di f\u00e2lu propit in Fri\u00fbl, metintsi tal mie\u00e7
  des rivalit\u00e2ts dai doi grancj part\u00eets dal moment, ven a st\u00e2i chel
  pro Vignesie, rapresent\u00e2t di Udin, e chel pro Imperi, che al cjatave in Civid\u00e2t
  la s\u00f4 bandiere. Sielzint la bande imperi\u00e2l, e provant a imagjin\u00e2si
  - cem\u00fbt che o var\u00ecn m\u00fbt di cont\u00e2le - une glesie umanistiche,
  rinovade, gnove, ep\u00fbr braurose de s\u00f4 identit\u00e2t. Cheste crevadure
  si sar\u00e8s medeade dome intal 1417, cuant che a Costance si decidar\u00e0 di
  torn\u00e2 sot di une sole ale, ch\u00ea romane (magari cuss\u00ec no). Intant,
  la Ingletiere e la France a stan ancjem\u00f2 scombatint une vuere che e je tacade
  intal 1347, l\u2019an de Peste Nere, e che si fermar\u00e0 dome intal 1453: la famose
  vuere dai Cent Agns, che une volte finide si podar\u00e0 fevel\u00e2 pe prime volte
  di St\u00e2ts nazion\u00e2i; di in ch\u00ea volte, i Franc\u00eas a saran rez\u00fbts
  di un re franc\u00eas e i Ingl\u00eas di un re ingl\u00eas. Cuss\u00ec almancul
  nus contin i manu\u00e2i di storie, dismenteantsi (o forsit no je une vere e propite
  amnesie, se mai une sielte storiografiche precise) des soferencis di chei popui
  che a son st\u00e2ts oble\u00e2ts a river\u00ee un st\u00e2t che nol coincideve
  cu la l\u00f4r nazion, e o pensi in particol\u00e2r ai Gal\u00eas, ai Cornish e
  ai Irland\u00eas pe Ingletiere (il probleme de Scozie al sar\u00e8s vign\u00fbt
  f\u00fbr dome cualchi timp plui inl\u00e0, sot dal ream di Elisabete I), e ai Bretons
  pe France. La situazion de Spagne si sar\u00e8s disvilupade intune dimension nazionalistiche
  fuartonone, judade di un integralisim catolic e roman sostign\u00fbt des coronis
  di Leon, Castilie e Aragon e fin\u00eet intal 1492 cu la distruzion dal Calif\u00e2t
  di Granada e la espulsion di ducj i no cristians, pene la persecuzion de Sante Incuisizion.
  Il 1453 al vi\u00f4t ancje la tant famose \u201ccolade di Bisanzio\u201d: l\u2019Imperi
  roman dal Orient al ven ocup\u00e2t dai Turcs che, un p\u00f4c par volte, tacant
  dal secul XIV, lu vevin ben strent intune smuarse, penetrant intai Balcans. In curt,
  tal 1463, l\u2019ultin re cristian de Bosgne, Stjepan Toma\u0161evic\u02c7, al sar\u00e8s
  st\u00e2t decapit\u00e2t a Jajce par volont\u00e2t dal Sultan Maomet II. E la Serenissime,
  in dut chest? Di simpri e veve bramade la disfate dai Bizantins, riv\u00e2i inte
  navigazion di chel m\u00e2r, l\u2019Adriatic, che cun prepotence la Dominante e
  veve simpri clam\u00e2t \u201cGolf di Vignesie\u201d, tant di imbast\u00ee adiriture
  une finte Crosade, intal 1204: no par deliber\u00e2 Jerusalem, ma pluitost par depred\u00e2
  Costantinopoli. Cu l\u00e2 benedizion dal Pape di Rome, dal moment che nol cjalave
  ben il Patriarcje Bizantin, schismatic fin dal 1054. Atri che Serenissime: anime
  nere! \u275a\\nAgnul Floramo\"", "\"salt\u00e2 f\u00fbr\\n[FO]\\n-\\nloc.v.\\njess\u00ee
  cuntun salt o vign\u00ee f\u00fbr svelt:\\nin chel moment saltavin f\u00fbr, da
  li boschetis, i ladrons che gji disvuedavin li sachetis ai viasad\u00f4rs (Ranieri
  Mario Coss\u00e2r, Il sechin tal font dal sac)\\n-\\nvign\u00ee f\u00fbr di cjase
  o di un ambient, soredut al improv\u00ees:\\nal fo dut un cori di dutis lis bandis.
  Mariane e salt\u00e0 f\u00fbr a viodi ce che al jere suced\u00fbt (Maria Forte,
  Il bal spisim\u00e2t des ombrenis);\\nsaltait f\u00fbr, bielis bambinis, / puartait
  f\u00fbr chel cj\u00e2r morbin; / za lis gjambis lis v\u00eas buinis / par bal\u00e2
  fin a la fin (Popol\u00e2r, Saltait f\u00fbr, bielis bambinis)\\n-\\nvign\u00ee
  f\u00fbr o vign\u00ee vie cun fuarce:\\nde cooperative al jessive a pleton une roie
  di vin che a faseve une grant poce tal mie\u00e7 dal curt\u00eel. Cul prin cjalt
  de Primevere al jere salt\u00e2t f\u00fbr il cjalcon di une bote di lambrusc...
  (Pieri Somede dai Marcs, 21 Avr\u00eel);\\nsi \u00e0 scuviert che il po\u00e7 dai
  f\u00eei eletrics des pompis di prese de aghe di m\u00e2r al veve une crevadure
  di 20 cm, e che di li e saltave f\u00fbr aghe une vore radioative (Alessandro Pascolini,
  Il disastri de centr\u00e2l nucle\u00e2r di Fukushima Dai-ichi)\\n-\\nloc.v.\\njessi
  intune posizion, ancje rispiet a altris elements, che e permet di jessi viod\u00fbt:\\ngruesse,
  grasse e taronde, simpri legre, cu la muse un p\u00f4c ruane che i saltave f\u00fbr
  dal fa\u00e7olet neri a pinie le\u00e2t un p\u00f4c mol sot dal barbu\u00e7 (Pieri
  Somede dai Marcs, Pre Josef)\\n-\\nloc.v.\\nnassi, compar\u00ee, tac\u00e2 a vign\u00ee
  f\u00fbr:\\ne ven Primevere: fine e frescjine e salte f\u00fbr la jarbe pal pr\u00e2t
  (Catarine Percude, La rosade di sant Zuan);\\ncum\u00f2 el soreli l''\u00e8 za par
  salt\u00e2 f\u00fbr e lui al duar ancjem\u00f2 (Dolfo Zorzut, Ipocrisie, ipocrisie,
  el Sign\u00f4r ti cjastie)\\n-\\nloc.v.\\njessi puart\u00e2t e met\u00fbt a disposizion
  o in viste:\\n\\\"E je ancjem\u00f2 plui di mieze ore di l\u00fbs. Parc\u00e8 no
  tach\u00ecno une partidute?\\\" La bale e jere saltade f\u00fbr dal moment e li,
  sul pedr\u00e2t, a vevin tac\u00e2t a cori, a pid\u00e2 e a vos\u00e2 (Gianni Gregoricchio,
  La clape)\\n-\\njessi cjat\u00e2t:\\ndopo di v\u00ea but\u00e2t par aiar dut il
  curt\u00eel e ficj\u00e2t lis mans e i bachets in dutis lis busis e cir\u00fbt dal
  togl\u00e2t fintremai in cjase, la cunine no jere saltade f\u00fbr (Gianni Gregoricchio,
  \u00cer e doman)\\n-\\nloc.v.\\ncapit\u00e2 dal improv\u00ees:\\njuste cum\u00f2
  e salte f\u00fbr la storie des autonomiis a mostr\u00e2 che no ducj i pipins a son
  pipins dal dut, a mostr\u00e2 che e je ancjem\u00f2 cualchi persone, cualchi fl\u00e2t
  di libert\u00e2t (Josef Marchet, Personis e pipins)\\nSin. vign\u00ee f\u00fbr\\n-\\njessi,
  sucedi tant che risult\u00e2t:\\nla stale e i pr\u00e2ts fasin il mussulin, / e
  da chest salte f\u00fbr e pan e vin (Pieri \u00c7orut, Il Strolic furlan par l''an
  1851);\\ncjo! par f\u00e2si viodi sapientone tantis voltis e da di ch\u00eas talianadis
  che no us d\u00ees... e a saltin f\u00fbr po di chei strambolots che Jesus Marie
  (Pieri Somede dai Marcs, Lassait che mi sbrochi!)\\n-\\njessi cognoss\u00fbt, soredut
  dal improv\u00ees o cence jessi spiet\u00e2t o dopo di jessi st\u00e2t plat\u00e2t
  o no sav\u00fbt:\\n\\\"Ca dentri lis robis si lis sa dome dopo fatis, duncje e podar\u00e8s
  salt\u00e2 f\u00fbr cualchi altre novit\u00e2t...\\\" (Costantino Smaniotto, Co
  l''am\u00f4r al cimie);\\nalore j\u00ea une gnot e va tal cimitieri e e robe ducj
  i flocs des rosis [...]. La robe, dopo un p\u00f4c, e salte f\u00fbr. A van di j\u00ea
  lis vuardiis e po al devent\u00e0 il proc\u00e8s (Popol\u00e2r - Andreina Nicoloso
  Ciceri, La fantate inzegnose - Racconti popolari friulani I)\\n-\\nloc.v.\\nf\u00e2
  une azion, soredut d\u00ee o fevel\u00e2, che e pues jessi caraterizade dal fat
  di jessi volontarie, improvise, no spietade, strambe e v.i.:\\ne che nissun salti
  f\u00fbr a d\u00eenus che o sin materialiscj e che o cjal\u00ecn nome l''inter\u00e8s
  dai budiei (Josef Marchet, La torce de civilt\u00e2t);\\nune volte Catin e jere
  saltade f\u00fbr cun chestis peraulis: \\\"Menut al \u00e8 un frut che mi pl\u00e2s:
  bon, rispiet\u00f4s; e a Gjisute al p\u00e2r che i vadi [...]\\\" (Maria Forte,
  Dome la cjampanute di Sant Bortul)\\nSin. vign\u00ee f\u00fbr\\n, salt\u00e2 s\u00f9\\n-\\nloc.v.\\nriv\u00e2
  a front\u00e2 ben une situazion, un probleme, un impegn e v.i.:\\nchel puer on al
  lavorave dut el d\u00ec e ancje di gnot, ma mai nol podeve salt\u00e2 f\u00fbr cu
  li spesis (Dolfo Zorzut, Ipocrisie, ipocrisie, el Sign\u00f4r ti cjastie);\\nil
  fat di no riv\u00e2 a salt\u00e2 f\u00fbr di cheste storie tal m\u00fbt che al intindeve
  lui, a Gubian i sglonfave il fi\u00e2t (Gianni Gregoricchio, \u00cer e doman)\\nSin.
  salt\u00e2i f\u00fbr\\n, puart\u00e2le f\u00fbr\\n, puart\u00e2se f\u00fbr\\nComponents:\\n-\\nf\u00fbr\\nav.,
  prep., inter., adi.inv., s.m.sing.\\n-\\nsalt\u00e2\\nv.intr., v.tr.\\nProverbis:\\n-
  la prime ploie di Avr\u00eel il cai al salte f\u00fbr dal so cov\u00eel\\n- no bisugne
  f\u00e2lis, par che no saltin f\u00fbr\\n- no si file mai tant sut\u00eel che il
  cjave\u00e7 nol salti f\u00fbr\"", "\"A \u00e0n cjap\u00e2t Matteo Messina Denaro!
  Chest fat nus lasse viertis dal sig\u00fbr tantis domandis e al met in biele mostre
  ce che salacor al \u00e8 il pivot plui fuart, l\u00e0 che si poie la realt\u00e2t
  de mafie: la omert\u00e2t. Ma e je une cuistion inm\u00f2 plui grivie e e rivuarde
  la complicit\u00e2t o \u2013 no vol\u00ecn pens\u00e2 \u2013 la poie des istituzions.\\n\u25c6
  Ma cheste volte no cjacarar\u00ecn de Italie, che intes Gjermaniis e je viodude
  tant che tiere di latin lovers, spaghets e soredut MAFIE. La convinzion, par altri,
  no si rifer\u00ecs nome al Sud: par tancj di l\u00f4r ducj i talians a son mafi\u00f4s,
  di Tarvis inj\u00f9. O ai insegn\u00e2t par tancj agns il talian in Austrie e il
  berdei plui dificil di disgrop\u00e2 nol \u00e8 st\u00e2t chel des coniugazions,
  ma chel di riv\u00e2 a discredit\u00e2 chescj prejudizis. E cualchi volte o ai scugn\u00fbt
  f\u00e2 cuintri a docents di lenghe taliane, che a trasmetevin chescj stereotips
  ai arl\u00eafs. Par agnorums o ai cir\u00fbt di f\u00e2 cap\u00ee che la mafie no
  je scomen\u00e7ade cun Tot\u00f2 Riina e persona\u00e7s su chel stamp, che forsit
  a son dome la risulte fin\u00e2l e pi\u00eas, ma e nas su m\u00fbts di f\u00e2 che
  a somein cence rilevance, che planc a planc a jentrin inte vite di ogni d\u00ec
  e disp\u00e8s a vegnin ancje cjap\u00e2ts dentri tant che regolaments intes istituzions,
  che a son masse cjadochis par rindisi cont.\\n\u25c6 O ai pod\u00fbt viodi di persone
  cem\u00fbt che tancj fenomens mafi\u00f4s a sedin ben inlidris\u00e2ts ancje intune
  tiere come la Austrie \u2013 e no stoi fevelant di mafie di importazion taliane,
  si ben di manifestazions nassudis l\u00e0 \u2013 che e somear\u00e8s parsore di
  ogni suspiet, se nol fos che o ai scugn\u00fbt pat\u00ee di persone cierts compuartaments.\\n\u25c6
  In Austrie la manutenzion dai implants di riscjaldament no je obligatorie nome pes
  cjalderiis a metan o a gasoli come in Italie, ma par cualsisei fate di riscjaldament,
  e si che duncje ancje par une stue a lens e pal so cjamin. Pai implants a gas e
  gasoli si \u00e0n di f\u00e2 doi intervents ad an, biel che pes stuis a len si scuegnin
  f\u00e2 cuatri di oblic, not\u00e2ts suntun libret di pueste. E fin ach\u00ec o
  podaressin d\u00ee che al \u00e8 complic\u00e2t, cost\u00f4s, ma ae fin al garant\u00ecs
  une buine sigurece. Dut v\u00ear, ma dut al cole cuant che si scuvier\u00e7 che
  par chestis manutenzions a son st\u00e2ts autoriz\u00e2ts nome doi o tr\u00ea spachenapis,
  da\u00fbr dal numar dai abitants dal comun, e no si pues l\u00e2 f\u00fbr di chei:
  o si siel\u00e7 un, o si siel\u00e7 chel altri. Al \u00e8 cl\u00e2r par ducj che
  un sisteme di cheste fate al puarte a prepotencis, insolencis, ab\u00fbs e in cualchi
  c\u00e2s si rive ancje a menacis ai citadins che a fasin cuintri a propuestis di
  meti s\u00f9 implants une vore cj\u00e2rs ma dal dut inutii, che no son nancje previod\u00fbts
  des le\u00e7s. In c\u00e2s contrari, a cualchidun i ven dineade la conformit\u00e2t
  de manutenzion, fat che al ven comunic\u00e2t aes autorit\u00e2ts cu lis consecuencis
  di multis che a puedin cost\u00e2 une vore. Ben cl\u00e2r che il sisteme al somee
  democratic, stant che si pues cambi\u00e2 il furnid\u00f4r dal servizi, ma dome
  une volte, e si cap\u00ecs subit che si pues fin\u00ee intun cercli vizi\u00f4s.\\n\u25c6
  In sumis, al \u00e8 cl\u00e2r che une cuistion di pocje valence come la netisie
  di un cjamin e pues f\u00e2 nassi compuartaments che no \u00e0n nuie di invidi\u00e2
  cul sisteme mafi\u00f4s, che nus acusin simpri. Ben cl\u00e2r che no son inm\u00f2
  a nivel di grandis organizazions, ma se a continuin a paid\u00ee chestis andis,
  il pas par l\u00e2 in pi\u00eas al sar\u00e0 une vore curt.\\n\u25c6 Bisugne per\u00f2
  fevel\u00e2 ben di ducj chei spachenapis che a fasin il l\u00f4r lav\u00f4r cun
  onest\u00e2t, coretece e disponibilit\u00e2t, cence profit\u00e2 des sclapaduris.
  Dopo cualchi probleme cun doi di l\u00f4r, o ai v\u00fbt la fortune di v\u00ea il
  servizi di un propit br\u00e2f e onest. \u275a\\nAl \u00e0 fat une vore di scjas
  l\u2019articul scrit su la \u201cPatrie\u201d di Setembar di Marco Moroldo, furlan
  che al v\u00eef in France e che al \u00e0 insegn\u00e2t ai siei f\u00ees la marilenghe.
  Torn\u00e2t a Mortean pes vacancis di Ist\u00e2t, al \u00e0 prov\u00e2t a cir\u00ee
  cualchi zovin o cualchi frut che al fevel\u00e0s furlan cui [\u2026] lei di plui
  +\\nIn Italie si torne a fevel\u00e2 di autonomie. Magari par d\u00e2i cuintri,
  ma si torne a discuti. La Lega cu la propueste di le\u00e7 su la autonomie diferenziade
  e torne a metile in cuistion. Dopo la Secession de Padanie, la Devoluzion, la Gjestion
  des Regjons dal Nord, dutis cuistions ladis in malore, cum\u00f2 Calderoli al [\u2026]
  lei di plui +\\nPe rassegne Avostanis, li dai Colonos a Vilecjaze di Listize, il
  mont des associazions, de culture, dal spetacul, dal sport si \u00e8 strenz\u00fbt
  intor dal gjorn\u00e2l dut par furlan fond\u00e2t tal 1946 A an partecip\u00e2t:
  Glesie Furlane, i Bakan, Claudio Moretti \u2013 Elvio Scruzzi \u2013 Fabiano Fantini
  (Teatro Incerto), Serena Fogolini e Raffaele Serafini (Contecurte), [\u2026] lei
  di plui +\\nI popui a \u00e0n une identit\u00e2t ancje se no le vuelin. Tant che
  ogni om al nas e che al cres cuntun non, un cognon, un puest di divignince, e un
  document che lu comprove, cuss\u00ec ancje i popui a vegnin di un timp lontan e
  di une tiere dongje, a clamin lis robis intune [\u2026] lei di plui +\\nL\u2019apontament
  si tignar\u00e0 doman, Vinars ai 8 di Mai, aes 18, te terace de Biblioteche Comun\u00e2l,
  vie Divisione Julia a Tarcint. La Aministrazion Comun\u00e2l di Tarcint cun la Comision
  de Pari Oportunit\u00e2t nus invide ae presentazion dal libri di Erika Adami \u201cFeminis
  furlanis fuartis\u201d che viodar\u00e0 la partecipazion di une protagoniste dal
  libri e de [\u2026] lei di plui +\\nPrese\u00e2t bonsign\u00f4r Riccardo Lamba,
  gn\u00fbf Arcivescul di Udin, \u201cLa Patrie dal Fri\u00fbl\u201d i da il benvign\u00fbt
  e i f\u00e2s i auguris pe so gnove mission. La mi\u00f4r robe che o pod\u00ecn sper\u00e2,
  par lui e par n\u00f4, e je che al rivi a colp a jentr\u00e2 in sintonie cu la storie
  di cheste tiere, che [\u2026] lei di plui +\"", "\"Miercus ai 12 Avost, h 21:00\\nConference
  di astronomie di Nando Patat\\nPercussions di Ermes Ghirardini\\nLeturis di Sandra
  Cosatto\\nImagjinis video\\nL\u2019Univiers al \u010d fat di almancul altris centen\u00e2rs
