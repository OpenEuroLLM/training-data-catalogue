  am\u00f4r, dedizion, voie di zir\u00e2 il mont, spirt competit\u00eef, leam cun
  il teritori des Vals dal Nadison, e risult\u00e2ts une vore prese\u00e2ts. Il [\u2026]
  lei di plui +\\nUne zornade di incuintri pai Conseis dai Fantats Al \u00e0 fat scjas
  il senat\u00f4r Roberto Menia che al \u00e0 declar\u00e2t di vol\u00ea gjav\u00e2
  il furlan de scuele e dal \u00fbs public. Al jere di un pie\u00e7 che nissun rapresentant
  des istituzions al pandeve cl\u00e2r di vol\u00ea scancel\u00e2 lis normis di tutele,
  ma salacor a son [\u2026] lei di plui +\"", "\"La edizion dal 2012 dal Premi San
  Simon di Codroip e je stade vin\u00e7ude, pal secont an di file, di Franco Marchetta
  cul roman\u00e7 \u201cU-\u201c.\\n\u201cAl \u00e8 un libri\u201d al \u00e0 spieg\u00e2t
  l\u2019aut\u00f4r dilunc de premiazion, \u201cche al rapresente un oma\u00e7 a la
