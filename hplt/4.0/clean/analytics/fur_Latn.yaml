  e devente par j\u00ea ancje un codi\u00e7 impuartant par esprimi dute la fuarce
  dal so sint\u00ee profont, pe\u00e2t ae culture de s\u00f4 tiere, la lenghe dal
  afiet e dal c\u00fbr, ch\u00ea de panze e dal sanc. No scr\u00eef dome in furlan,
  ma ancje par venezian e franc\u00eas, braurose di jessi plurileng\u00e2l.\\nLis
  lirichis a mostrin un sens di marum pal timp che al scjampe cence ferm\u00e2si mai,
