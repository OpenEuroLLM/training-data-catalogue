  Scruzzi \u2013 Fabiano Fantini (Teatro Incerto), Serena Fogolini e Raffaele Serafini
  (Contecurte), [\u2026] lei di plui +\\nI popui a \u00e0n une identit\u00e2t ancje
  se no le vuelin. Tant che ogni om al nas e che al cres cuntun non, un cognon, un
  puest di divignince, e un document che lu comprove, cuss\u00ec ancje i popui a vegnin
  di un timp lontan e di une tiere dongje, a clamin lis robis intune [\u2026] lei
  di plui +\\nL\u2019apontament si tignar\u00e0 doman, Vinars ai 8 di Mai, aes 18,
  te terace de Biblioteche Comun\u00e2l, vie Divisione Julia a Tarcint. La Aministrazion
  Comun\u00e2l di Tarcint cun la Comision de Pari Oportunit\u00e2t nus invide ae presentazion
  dal libri di Erika Adami \u201cFeminis furlanis fuartis\u201d che viodar\u00e0 la
  partecipazion di une protagoniste dal libri e de [\u2026] lei di plui +\\nPrese\u00e2t
  bonsign\u00f4r Riccardo Lamba, gn\u00fbf Arcivescul di Udin, \u201cLa Patrie dal
  Fri\u00fbl\u201d i da il benvign\u00fbt e i f\u00e2s i auguris pe so gnove mission.
  La mi\u00f4r robe che o pod\u00ecn sper\u00e2, par lui e par n\u00f4, e je che al
  rivi a colp a jentr\u00e2 in sintonie cu la storie di cheste tiere, che [\u2026]
  lei di plui +\\nPrese\u00e2t bonsign\u00f4r Riccardo Lamba, gn\u00fbf Arcivescul
  di Udin, \u201cLa Patrie dal Fri\u00fbl\u201d i da il benvign\u00fbt e i f\u00e2s
  i auguris pe so gnove mission. La mi\u00f4r robe che o pod\u00ecn sper\u00e2, par
  lui e par n\u00f4, e je che al rivi a colp a jentr\u00e2 in sintonie cu la storie
  di cheste tiere, che [\u2026] lei di plui +\\nLa Patrie dal Fri\u00fbl e segnale
  doi apontaments che le viodin protagoniste cul libri \u201cFeminis furlanis fuartis\u201d
  di Erika Adami, che e f\u00e2s part de golaine \u201cLa machine dal timp\u201d.
  Te suaze dal festival vicino/lontano, riv\u00e2t ae vincjesime edizion, Erika Adami
  e moderar\u00e0 l\u2019incuintri \u201cFeminis. Talents di no strass\u00e2\u201d
  che al nas des esperiencis contadis [\u2026] lei di plui +\"", "\"Cuant che si fevele
  di libris e progjets di culture cun Orazio Cantiello, fondad\u00f4r de cjase editore
  l\u2019Omino Rosso, si reste stran\u00eets, par la tante passion che al met tai
  siei progjets. La s\u00f4 e je une pi\u00e7ule realt\u00e2t, dal dut origjin\u00e2l,
  jenfri il panorame des cjasis editoris, ma tal stes timp e je leade al teritori
  tant di public\u00e2 libris (uniche realt\u00e2t di Pordenon cit\u00e2t) in furlan
  koin\u00e8 ma ancje in variet\u00e2ts specifichis da lis v\u00e2ls de provincie.
  Ogni publicazion e ven presentade cuntun pi\u00e7ul aveniment-event che a smire
  soredut a d\u00e2 lustri ai aut\u00f4rs cence per\u00f2 jessi un spot par vendi.\\nCem\u00fbt
  mai la idee di scre\u00e2 une gnove cjase editore?\\nCuant che o jeri pi\u00e7ul
  o volevi devent\u00e2 avocat, ma cressint mi soi inacuart di v\u00ea une cussience\u2026\\nIl
  merit al \u00e8 st\u00e2t dai libris che o ai let e chi, intai agns, o ai impar\u00e2t
  a v\u00ea a cj\u00e2r. O cr\u00f4t di jessi un predestin\u00e2t\u2026\\nDi dul\u00e0
  vegnie le idee dal non Omino Rosso?\\nCualchi an inda\u00fbr o cirivi un non che
  al pod\u00e8s meti in struc la m\u00ea personalit\u00e2t: chei che mi cognossin
  a san che o soi un \u201cfint-sclagn\u201d e che mi plasin cetant i pomodoros e
  lis cjariesis. E po o cr\u00f4t ancjem\u00f2 a Sant nicolau, l\u2019Om Ros par ecelence.\\nPresentinus
  la cjase editore L\u2019Omino Rosso (www.ominorosso.it)?\\nO fas\u00ecn biei libris,
  cualchi volte dibess\u00f4i cualchi volte in colaborazion cun ents, aziendis e associazions.
  O vin s\u00ees golainis che a spaziin da la leteradure pai frutus (il nestri element
  di ponte\u2026) a la art, da la sagjistiche al lis vuidis. Insome, un p\u00f4c di
  dut, ma simpri cui p\u00eets par tiere. Progjets dimension\u00e2ts a la nestre realt\u00e2t
  e al nestri teritori. In cheste otiche nus pl\u00e2s indre\u00e7\u00e2so ancje ai
  plui grancj cun titui di inter\u00e8s soci\u00e2l che a \u00e0n tocj\u00e2t temis
  come la diaspore, il degr\u00e2t ambient\u00e2l o lis storiis mai contadis.\\nCual
  isal il pont di fuarce de t\u00f4 cjase editore?\\nJessi origjn\u00e2i al coste
  tante fadie e b\u00ea\u00e7s, ma al da tantis sodisfazions. Intal grant panorame
  de editorie nazion\u00e2l e loc\u00e2l, o cir\u00ecn di metisi in mostre cun propuestis
  coloradis e cetant legris che a coinvolzin cuasi simpri aut\u00f4rs di cjase nestre.\\nCu\u00e2i
  sono i titui che o v\u00eas public\u00e2t\\nin marilenghe?\\nI libris in marilenghe
  par cum\u00f2 a son tr\u00ea, ma dome un al \u00e8 dut in lenghe. Il prin si intitule
  \u201cSe o fos un grant\u201d, un libri ilustr\u00e2t par canais che al \u00e0 v\u00fbt
  un gran suc\u00e8s di critiche e un biel riscuintri di vendite. Il secont al \u00e8
  \u201cVito d\u2019Asio e la Val D\u2019Arzin\u201d, un libri fotografic cun tescj
  par furlan, talian e ingl\u00eas, l\u00e2t vend\u00fbt in p\u00f4c timp e vu\u00ea
  in ristampe. Il tier\u00e7 al \u00e8 \u201cPavea un\u2019est\u00e2t, la luna tal
  cod\u00e2r\u201d in furlan asin cun cjadincis dal puest e cun traduzion par talian;
  chest ultin libri lu vin present\u00e2t intai d\u00ees pass\u00e2ts cuntun spetacul
  di suns e peraulis pardabon di fuarte emozion.\\nUne vore di titui a son le\u00e2ts
  a strent\\ncul teritori e a son adiriture scrits\\nin tipologjiis di furlan loc\u00e2l.
  Parc\u00e8?\\nLa grande part de nestre produzion e je leade al nestri teritori (Fri\u00fbl-Vignesie
  Julie e zonis di confin cul Venit), e propit par chest, diviers libris a son cun
  tescj par furlan. In chest sens, po, o vin cjat\u00e2t aministrazions comun\u00e2ls
  che si son dimostradis un partner atent e disponibil a valoriz\u00e2 la culture
  dal l\u00fbc.\\nPal doman intend\u00easo continu\u00e2 a public\u00e2 libris in
  marilenghe?\\nSig\u00fbr. Lis sfidis mi son simpri plasudis e ch\u00ea dal public\u00e2
  par furlan (intune zone come ch\u00ea di Pordenon cit\u00e2t) e je plui inmagant
  di altris. Dal pont di viste comerci\u00e2l o vin devant un public esigjent, che
  al sa prese\u00e2 la cualit\u00e2t e che tal stes timp al snobe lis iniziativis
  editori\u00e2ls che no curin intai det\u00e2is il complic\u00e2t e varieg\u00e2t
  mont le\u00e2t a la lenghe da la nestre regjon.\\nV\u00easo progjets in cors di
  opare?\\nPar sielte aziend\u00e2l lis nestris novit\u00e2ts a jessin dutis di Jugn
  in denant. Ven a st\u00e2i che si prep\u00ecn a la publicazion di cinc libris: doi
  par canais, doi par fruts e un sul sport. I titui a vegnaran present\u00e2ts a Pordenonelegge.it
  (19-21 di Setembar) e te setemanis dasp\u00f2 in diviers incuintris. I titui che
  la comission di Pordenonelegge nus scarte (\u2026 par cuiss\u00e0 cu\u00e2i mot\u00eefs),
  a saran dist\u00e8s in biele esposizion intal nestri spazi. Subit dasp\u00f2 al
  vignar\u00e0 il moment da lis presentazions di Nad\u00e2l e cuiss\u00e0 che no sponti
  ancjem\u00f2 alc par furlan\u2026\\nI titui par furlan cem\u00fbt sono st\u00e2ts
  recep\u00eets dai pordenon\u00eas?\\nI pordenon\u00eas, gjavadis lis zonis pedemontanis
  (cetant vivarosis) e lis fassis dal Tiliment, no capissin tant il furlan e par chest
  a fasin fadie a prese\u00e2 lis iniziativis in lenghe, ma chest nol \u00e8 un probleme.
  O rispient\u00ecn i guscj di ducj e si indrec\u00ecn a chei che, al contrari, a
  cognossin e a vuelin svissin\u00e2si a la marilenghe. Tes libreriis de cit\u00e2t,
