  une apartignince ae sfere privilegjade de societ\u00e2t. A \u00e0n let e a lein
  libris, a son educadis a une forme profonde di pins\u00eer critic. Disp\u00e8s a
  coltivin ide\u00e2i di grande modernit\u00e2t, strument di resistence e di riviel
  cuintri di chel mont mascli che lis \u00e0 isoladis dal contest civ\u00eel, che
  lis \u00e0 paradis f\u00fbr di cjase e che ur \u00e0 imponude une regule severe.\\nE
  p\u00fbr, si pues ancje viodile di ch\u00ea altre bande: a son i oms che no puedin
  jentr\u00e2 cence il perm\u00e8s de Mari Badesse che e siel\u00e7, e filtre, e dec\u00eet
