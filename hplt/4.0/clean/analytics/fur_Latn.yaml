  [\u2026] lei di plui +\\nDi un probleme ae \u00e7ate al record in mont: interviste
  cun Thomas Colussa, che cul so Numb al sta pontant al record di altece lant sul
  Mont Blanc O vevi za intervist\u00e2t Thomas Colussa, 40 agns, un p\u00e2r di agns
  inda\u00fbr. In ch\u00ea volte al jere un \u201cfurlan a Milan\u201d e al faseve
  il personal [\u2026] lei di plui +\\nLa aziende agricule biologjiche La Gallinella
  Saggia e je nassude 7-8 agns inda\u00fbr: \u201cLa idee e je stade di m\u00ea mari
  \u2013 e conte Caterina Pillinini \u2013 che e \u00e0 simpri fat orts e cjamps,
