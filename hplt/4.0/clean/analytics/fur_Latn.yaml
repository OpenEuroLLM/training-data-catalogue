sample: '["\"Storie di un profess\u00f4r furlan tal forest\\nTacant dai prins agns
  Novante, in gracie di un progjet de Universit\u00e2t di Clanfurt, in colaborazion
  cun altris Ateneus, la localit\u00e2t di Ple\u00e7 (Slovenie) e je deventade mete
  estive di studis e di incuintris di caratar internazion\u00e2l, cun grant atrat
  di bande dai students universitaris.\\nIl diret\u00f4r di chest an, profess\u00f4r
  Luca Melchior, nus conte di cem\u00fbt che si \u00e8 disvilupade vie pai agns cheste
  iniziative.\\nLa scuele estive di Ple\u00e7 e je nassude par iniziative di un storic
  de Universit\u00e2t di Clanfurt, Andreas Moritsch, in colaborazion cu lis Universit\u00e2ts
  dal Fri\u00fbl e di Lubiane. La idee e jere ch\u00ea di un laboratori di confront
  su la storie di cheste regjon, che e je comune, ma masse disp\u00e8s dividude e
  insanganade. I cors di lenghe \u2013 sul prin talian, todesc e sloven \u2013 a jerin
  nome funzion\u00e2i al scambi tra i students e i docents, parc\u00e8 che si voleve
  dopr\u00e2 lis lenghis de regjon e no l\u2019ingl\u00eas. La idee e je stade puartade
  indenant di un altri storic, Karl Stuhlpfarrer, e dopo dal pedagogjist Vladimir
  Wakounig, prin che mi tocj\u00e0s a mi. Cui agns si son zontadis lis Universit\u00e2ts
  dal Litor\u00e2l di Koper, la Universit\u00e2t di Triest e la Facolt\u00e2t di filosofie
  di Rijeka, e cuss\u00ec si \u00e8 slargjade la ufierte dai cors ancje al furlan
  e al cravuat. Gno obiet\u00eef al sar\u00e8s st\u00e2t di riv\u00e2, tai agns, ancje
  al ladin, ma prin il covid, dasp\u00f2 la fin dal gno contrat a \u00e0n ferm\u00e2t
  il plan.\\n__\\nCu\u00e2l isal il spirt di cheste iniziative?\\nIl spirt al \u00e8
  chel di un progjet di p\u00e2s e di incressite comune, intun dialic tra students
  dai Pa\u00ees de regjon, che disp\u00e8s a cognossin nome une version, ch\u00ea
  de l\u00f4r bande, de storie e de culture, in realt\u00e2t comunis, dal teritori
  e che \u2013 magari cuss\u00ec no \u2013 tantis voltis no san ce che al suc\u00eat,
  o che al \u00e8 suced\u00fbt, di ch\u00ea altre bande dal confin. Une robe che nus
  somee impuartante, dut c\u00e2s, e je ch\u00ea di slargj\u00e2 ancjem\u00f2 di plui
  la prospetive a aspiets plui le\u00e2ts, par esempli, al disvilup economic e tecnologjic
  inte regjon.\\n__\\nE cum\u00f2, invezit, par cognossilu mi\u00f4r, cu\u00e2l isal
  st\u00e2t il so percors di studis?\\nO ai fat studis di todesc e rumen a Udin (cun
  tapis a Rostock e Timi\u015foara), cuntun p\u00f4c di serp-cravuat in bande, formazion
  di docent di talian lenghe foreste a Vignesie, a vore inte scuele e universit\u00e2t
  a insegn\u00e2 talian a Lipsie, dotor\u00e2t in linguistiche romanze a Munic e Udin
  sui migrants furlans in Baviere, assistent universitari a Graz, profess\u00f4r di
  ricercje sul plurilinguisim a Clanfurt.\\n__\\nCe judizi podaressial d\u00e2 su
  la s\u00f4 preparazion?\\nDi sig\u00fbr positive, cu la pussibilit\u00e2t di scambis
  internazion\u00e2i e di confront\u00e2mi cun docents prepar\u00e2ts e che, no simpri
  ma disp\u00e8s, a savevin ancje acompagn\u00e2 i students inte cressite academiche.
  Mi sar\u00e8s plas\u00fbt per\u00f2 v\u00ea cognoss\u00fbt il program di Ple\u00e7
  za di student\u2026\\n__\\nE sui Ateneus che al \u00e0 vude maniere di cognossi
  (di student, ricercjad\u00f4r e profess\u00f4r)?\\nA son judizis une vore diferents,
  ma in gjener\u00e2l ancje une vore posit\u00eefs. La LMU di Munic e je une universit\u00e2t
  storiche e grande, cun tante ufierte e rapuarts internazion\u00e2i cu lis universit\u00e2ts
  plui impuartantis dal mont; Lipsie e je une universit\u00e2t cuntune grande storie,
  ma in ch\u00ea volte che o jeri jo e veve une seconde zovent\u00fbt, intune cit\u00e2t
  vive e dinamiche; Graz e \u00e0 une grande tradizions di studis romanistics (e sul
  Fri\u00fbl), Clanfurt e je intune posizion ide\u00e2l pe regjon de Alpe Adria, ma
  salacor no simpri si sa sfrut\u00e2le\u2026\\n__\\nCe progjets aial in cant\u00eer?\\nO
  soi da\u00fbr a lavor\u00e2 cuntun team di coleghis, in primis Franco Finco e Paolo
  Roseano, suntune gramatiche descritive dal furlan, cun Isabella Matticchio o vin
  in p\u00eets une bibliografie dai scrits di linguistiche su lis lenghis e variet\u00e2ts
  de Istrie, cun Franco Finco e Fabiana Fusco un studi sul insegnament di sauran,
  sapadin e timau\u00eas, e dasp\u00f2 studis sui linguistic landscapes di cheste
  regjon de Alpe Adria.\\n__\\nI capitial mai di fevel\u00e2 de lenghe furlane cun
  coleghis o students no furlanofons?\\nS\u00ec, fevel\u00e2 di lenghe furlane mi
  capite cuasi ogni d\u00ec\u2026 ancje te m\u00ea cariere academiche l\u2019inter\u00e8s
  pal Fri\u00fbl al \u00e8 simpri st\u00e2t presint, dai cors su la ricjece linguistiche
  dal Fri\u00fbl (cun cors di lenghe furlane) a Munic fin ai cors sul plurilinguisim
  inte Alpe Adria. In Austrie, in particol\u00e2r a Clanfurt, di Fri\u00fbl si sa
  avonde, l\u2019inter\u00e8s al \u00e8 alt tai students. Plui di cualchidun mi \u00e0
  dit che al sar\u00e8s biel v\u00ea cors universitaris di furlan. I coleghis in gjener\u00e2l
  a son interess\u00e2ts a aspiets specifics, come la tutele, la standardizazion,
  il contat linguistic e lis s\u00f4s manifestazions, ma ancje la variazion dialet\u00e2l
  o la presince inte scuele.\\nO cr\u00f4t che al sedi dificil f\u00e2 un confront
  cul Fri\u00fbl: tal forest salacor e je plui curiosit\u00e2t, parc\u00e8 che je
  simpri une robe \u201caltre\u201d, al \u00e8 un ategjament viert e il confront cu
  la situazion des lenghis des minorancis storichis e dai dialets presints ach\u00ec
  al \u00e8 une vore impuartant te cuotidianit\u00e2t comunicative. Al \u00e8 cl\u00e2r
  che si trate di un toc di societ\u00e2t particol\u00e2r \u2013 students e docents
  universitaris -, duncje no rapresentat\u00eef di dute la popolazion.\\n__\\nLavor\u00e2
  tal forest aial influen\u00e7\u00e2t il so m\u00fbt di jessi e di sint\u00eesi furlan?\\nDis\u00ecn
  che par ciertis aspiets si pues cjal\u00e2 lis robis cun plui \u201cdistac\u201d,
  che nol \u00e8 m\u00e2l, e chest mi da la pussibilit\u00e2t di lavor\u00e2 sul furlan
  cun calme. Mi f\u00e2s sint\u00ee che jessi furlan al \u00e8 un toc impuartant di
  me, e che jessi furlan al v\u00fbl d\u00ee dal sig\u00fbr fevel\u00e2 furlan, ma
  ancje jessi \u201cfi\u201d di une realt\u00e2t fate di un miscli\u00e7 di tantis
  lenghis, dutis impuartantis.\\n__\\nCe impression aial dal Fri\u00fbl cjalantlu
  dal dif\u00fbr?\\nDal Fri\u00fbl o ai la impression che, a nivel politic, un p\u00f4c
  si piert intun \u201cNordest\u201d o intune \u201cNorditalie\u201d dismenteantsi
  di se, des s\u00f4s particolarit\u00e2ts, dal so teritori, de s\u00f4 storie. Ma
  par fortune a son iniziativis dal bas, ancje se in chest moment di crisi continue
  a nivel mondi\u00e2l, ancje ch\u00eas a sofrissin tant\u2026\\n__\\nIsal un moment
  bon pe lenghe furlane? Ce criticit\u00e2ts e ce pussibilis alternativis viodial?\\nA
  son tantis iniziativis, e chest al \u00e8 posit\u00eef. Che si lavori pe scuele
  e pe professionalizazion dal insegnament al \u00e8 une vore impuartant, ma o cr\u00f4t
  che la robe plui impuartante e sedi che si mantegni la trasmission dal furlan ai
  fruts in famee. E chi la situazion, magari cuss\u00ec, no no mi somee tant positive,
  ancje se a son iniziativis impuartantis. Il furlan al \u00e0 di torn\u00e2 a jessi
  lenghe de comunicazion inte famee e inte comunit\u00e2t dal pa\u00ees, che cence
  di chel il fat che si dopri inte comunicazion ufici\u00e2l nol \u00e8 avonde: e
  je une robe s\u00ec impuartantone, ma che di bessole no lu judar\u00e0 a salv\u00e2si.
  \u275a\\nGiovanni Battista Marzuttini, al jere il 1884 cuant che un zovin marcjadant
  di farinis, Nicol\u00f2 Serafini, al decideve di meti s\u00f9 a Udin un circul mandulinistic,
  stri\u00e2t di chel strument che al veve vude maniere di scolt\u00e2 in gracie di
  un via\u00e7 a Rome.\u25c6 Tirade dongje la int e soredut lis risorsis finanziariis,
  e tac\u00e0 [\u2026] lei di plui +\\nLa tradizion dal \u201cKheirar\u201d e dal
  \u201cR\u00f6lar\u201d e cjape dentri dut il pa\u00ees Mascaris bielis e mascaris
  brutis, cun musis intaiadis intal len e cu lis liniis plui diferentis, a son lis
  protagonistis assoludis di une ricorence tant curiose che antighe: al \u00e8 il
  Carnev\u00e2l di Sauris, intal dialet sauran loc\u00e2l cognoss\u00fbt ancje tant
  che \u201cDer Voschank\u201d.L\u2019aspiet [\u2026] lei di plui +\\nCuatri am\u00ees
  inmag\u00e2ts de origjinalit\u00e2t di lenghe, musiche e bai dal Cjan\u00e2l incjanton\u00e2t
  jenfri lis Musis e la mont Cjanine In ce aventure che mi soi but\u00e2t! Dut par
  l\u00e2 da\u00fbr di m\u00ea madone! Cum\u00f2, aes tr\u00ea dopomisd\u00ec, ach\u00ec
  in machine o sin in cuatri: jo, Mario Dean, 46 agns, profess\u00f4r di talian tal
  Marinelli, [\u2026] lei di plui +\\nLa memorie e torne inda\u00fbr a Marquart, ma
  forsit la tradizion e je ancjem\u00f2 plui antighe Ai 6 di Zen\u00e2r, in ocasion
  de fieste de Epifanie, il Comun di Civid\u00e2t si prepare a celebr\u00e2 un ritu\u00e2l
  tant curi\u00f4s che inmagant: e je la Messe dal Spadon, che par tradizion si f\u00e2s
  tal ant\u00eec Domo ant\u00eec. [\u2026] lei di plui +\\n\u201cApene finidis di
  lei lis poesiis dal cont Ermes, il dot\u00f4r Cesare, fra i batimans dal public,
  al si ritire da\u00f9r l\u2019uniche quinte preparade a zampe dal\u2026 palc scenic.
  Ma, pal bessologo, che il devi recit\u00e0 il br\u00e2f at\u00f4r di san Denel,
  Giovanin Tombe, \u2018e oc\u00f2r une scene, e il dot\u00f4r Cesare la proviot cuss\u00ec:\u2026\u201d
  [\u2026] lei di plui +\\nDi un probleme ae \u00e7ate al record in mont: interviste
  cun Thomas Colussa, che cul so Numb al sta pontant al record di altece lant sul
  Mont Blanc O vevi za intervist\u00e2t Thomas Colussa, 40 agns, un p\u00e2r di agns
  inda\u00fbr. In ch\u00ea volte al jere un \u201cfurlan a Milan\u201d e al faseve
  il personal [\u2026] lei di plui +\"", "\"A son un centen\u00e2r i cartons anim\u00e2ts
  par furlan che la ARLeF e met a disposizion dai fruts in chestis setemanis di pass\u00e2
  a cjase. Pensant a l\u00f4r, la Agjenzie e \u00e0 anticip\u00e2t la metude in linie
  de gnove serie Rite & Cjossul, 26 episodis che a contin lis zornadis di Rite, une
  frute di cinc agns, e dal so cjan Cjossul, pegri e cuiet, che al \u00e8 bon di fevel\u00e2.
  Il carton anim\u00e2t al \u00e8 une produzion gjaponese, gjavade f\u00fbr dai libris
  ilustr\u00e2ts \u201cRita et Machin\u201d, public\u00e2ts par franc\u00eas di Gallimard
  Jeunesse.\\nLa serie si zonte a ch\u00eas altris za a disposizion sedi inte sezion
  Fruts di chest s\u00eet che sul can\u00e2l YouTube dedic\u00e2t: Omenuts, la serie
  innomenade fate de Fisher-Price (Mattel) che e \u00e0 tant che protagoniscj cinc
  pi\u00e7ui am\u00ees e lis l\u00f4r storiis sioris di emozions; Tui e Tuie, doi
  gjatuts simpatics, fradi e s\u00fbr, che midiant di une scjate magjiche e di une
  imagjinazion ferbinte a vegnin traspuart\u00e2ts lontan di cjase e a vivin aventuris
  plenis di sorpresis e di scuviertis; La Pimpa, la simpatiche cji\u00e7ute blancje
  a balins ros, nassude dal lapis di Altan.\\nA son prodots di cualit\u00e2t, pens\u00e2ts
  par f\u00e2 divert\u00ee i fruts ma che a risultin ancje bogns par rindi chest periodi
  di timp, l\u00e0 che si \u00e0 di rest\u00e2 a cjase, une ocasion educative.\\nLa
  sezion Fruts dal s\u00eet e je un tesaur si\u00f4r di tancj altris materi\u00e2i
  \u201canti-stufe\u201d: dentri a son dutis lis pontadis de trasmission Maman!, adun
  cun flabis, libris e audiolibris, files music\u00e2i cun filastrocjis e cjan\u00e7onutis,
  dissens di pitur\u00e2 e z\u00fbcs interat\u00eefs.\"", "\"-\\nDISVUEDANT IL SCANSEL\\nSul
  cjast al jere un vecjo scrin cuntune specjere, un plan di marmul e cuatri scansei.
  I prins tr\u00ea si podevin vierzi cu la rispetive cl\u00e2f. A vevin dentri dome
  vecjos vistidats rose\u00e2ts des tarmis e dai catans cuasi cence val\u00f4r: un
  orloi fer, ocj\u00e2i di soreli e di viste, rivistis di sport. Max al veve cjapat
  in man martiel e scarpel par scantin\u00e2 la clavarie dal unic scansel cence cl\u00e2f,
  il plui in bas\u2026 Al cap\u00ec daurman che al jere di front a la memorie di so
  barbe. Il barbe al jere muart za di tancj agns ma Max si visave ancjem\u00f2 de
  s\u00f4 v\u00f4s. Al tac\u00e0 a lei cun passion chel materi\u00e2l dut scrit par
  furlan: alore i pareve che il barbe i stes fevelant\u2026\\n-\\nCUN ALTRIS VOI\\nGianfranco
  Pellegrini nus f\u00e2s jentr\u00e2 in events che a \u00e0n marc\u00e2t popui e
  tieris dal Fri\u00fbl o ben che a son o che a stan par plomb\u00e2. Etis diferentis,
  persona\u00e7s e situazions pinel\u00e2ts cun netisie di particol\u00e2rs, evocat\u00eefs
  di m\u00fbts di vivi la vite e di sei protagoniscj, voie o no, di ce che al \u00e8
  da\u00fbr a sucedi o ben che al sucedar\u00e0. Nuie nol \u00e8 mai fer, dut al \u00e8
  dentri chel sut\u00eel divign\u00ee che al diven carulant fissit\u00e2ts, sigurecis
  e progjets. Un continui scombati par cambi\u00e2 o resisti. Pagjinis che a puartin
  dentri dal labirint di une tiere intorteade in sutilis dicotomiis, cu lis s\u00f4s
  feminis e i soi oms. La lenghe furlane plasmade su lis ambientazions e diven piel
  di ogni figure. Un scrivi, chel di Gianfranco Pellegrini, che al intiz\u00ece pe
  forme, pes sieltis stilistichis, pes induvinadis licencis; spieli di ricercje lessic\u00e2l
  e leterarie coltade instre\u00e7ade cu la sclagne tradizion popol\u00e2r or\u00e2l.\"",
  "\"Fotografiis cun Pape Wojtyla e cun Eduard Shevardnadze, e po ancje cul president
  dal Messic Salinas o cun grancj persona\u00e7s dal spetacul come Alberto Sordi:
  jentr\u00e2 intal studi di Gianni Bravo al \u00e8 un p\u00f4c torn\u00e2 inda\u00fbr
  tal timp, a di un moment dul\u00e0 che il so \u201cbrand\u201d Made in Friuli al
  viazave ator pal mont cun grancj risult\u00e2ts di imagjin, ma ancje cuntun grum
  di oportunit\u00e2ts di vuadagn pes impresis di chenti. A somein secui, ma \u00abnon
  son pass\u00e2ts nancje 30 agns di cuant che il New York Times al puartave in prime
  pagjine un articulon che al contave de nestre spedizion te capit\u00e2l economiche
  mondi\u00e2l spiegant ai siei milions di let\u00f4rs che la nestre bandiere che
  ducj a vevin viod\u00fbt di f\u00fbr dal Plaza insiemit cun ch\u00ea americane no
  jere ch\u00ea di un gn\u00fbf St\u00e2t dal Onu, ma che di une des regjons plui
  bielis d\u2019Italie\u00bb. Al jere il nestri sium chel di puart\u00e2 la Patrie
  ator pal mont no dome pai nestri emigrants, ma par f\u00e2le cognossi a ducj: parc\u00e8
  che cui che al cogn\u00f2s i furlans si fide di l\u00f4r e par chest al \u00e8 facil
  che al compri i nestris prodots.\\nFAL\u00c2T DELOCALIZ\u00c2_ Chei di Bravo no
  son ricuarts e vonde; par lui e je cheste la strade che si var\u00e8s di cjap\u00e2
  par sburt\u00e2 la nestre economie in chest moment di crisi no dome taliane, ma
  internazion\u00e2l. \u00abNoaltris o sin simpri l\u00e2ts ator pal mont, prin come
  emigrants e po come imprendit\u00f4rs. Ma fin tai agns Otante o sin l\u00e2ts dome
  a vendi, e po o vin scomen\u00e7\u00e2t a spost\u00e2 lis produzions inaltr\u00f2
  par sparagn\u00e2 sui coscj. Nuie di plui fal\u00e2t. Cui che al delocalize al \u00e8
  un oportunist, no un v\u00ear impresari: e cul men\u00e2 f\u00fbr di chenti lav\u00f4r
  e produzion al cope il Fri\u00fbl\u00bb. L\u2019imprendit\u00f4r plui fuart in Fri\u00fbl,
  \u00abla Danieli, e je un esempli model parc\u00e8 che cheste aziende e lavore s\u00ec
  pe plui part tal forest, ma e ten ach\u00ec lis inteligjencis e la strategjie. No
  licenzie in Fri\u00fbl par vierzi in Russie.\\nE vier\u00e7 in Russie par consolid\u00e2
  la s\u00f4 cjase mari\u00bb.\\nPE\u00c2SI CUL FOREST CENCE PIERDI LA LIDR\u00ceS_
  Al \u00e8 chest che ur mancje cum\u00f2 ai imprendit\u00f4rs furlans secont Bravo:
  la capacit\u00e2t di pe\u00e2si a realt\u00e2ts tal forest buinis di f\u00e2 cressi
  lis possibilit\u00e2ts di espandi i l\u00f4r marcj\u00e2ts. \u00abLa modalit\u00e2t
  plui juste par cressi, se lis impresis furlanis no \u00e0n voie di agreg\u00e2si
  in blocs plui pen\u00e7s e plui bogns di imponisi sul marcj\u00e2t, e je che de
  joint venture con realt\u00e2ts forestis: ma fin cum\u00f2 la medie des aziendis
  furlanis no \u00e0 nancje consider\u00e2t la oportunit\u00e2t di dopr\u00e2 chest
  imprest di cressite\u00bb.\\nA mancjin lis ocasions di meti in contat i operat\u00f4rs
  di chenti cun chei dal forest, la domande, la ufierte e i servizis (des bancjis
  aes assicurazions, ae logjistiche dai traspuarts) che a coventin a realiz\u00e2
  acuardis che a durin tal timp.\\n\u00abO v\u00ecn di torn\u00e2 protagoniscj parc\u00e8
  che i furlans a son bogns di f\u00e2 maraveis: mal \u00e0 ricognoss\u00fbt ancje
  Mohamed Al Fayed cuant che i ai spieg\u00e2t che il v\u00ear svilup de l\u00fbs
  eletriche nol \u00e8 vign\u00fbt di Edison ma di Malignani, e che chest om invezit
  di cre\u00e2 une \u201ccorporation\u201d cui b\u00ea\u00e7s vuadagn\u00e2ts al \u00e0
  fondade la Bancje dal Fri\u00fbl che e \u00e0 disvilup\u00e2t dut il nestri teritori.
  Chest spirt, come chel che nus \u00e0 sburt\u00e2t a torn\u00e2 a f\u00e2 su il
  Fri\u00fbl dasp\u00f2 dal taramot, al lar\u00e8s recuper\u00e2t dai nestris impresaris\u00bb.\\nLIS
  CL\u00c2FS DAL SUC\u00c8S_ Che cum\u00f2, dut c\u00e2s, a cjalin a resisti ae buere
  de crisi. E lis peraulis di ordin a puedin sei dome tr\u00ea, dutis che a scomencin
  cul \u201ci\u201d: \u201cinovazion, internazionalizazion e identit\u00e2t\u201d.
  La prime e var\u00e8s di v\u00ea un sburt impuartanton de Universit\u00e2t, \u00abche
  e je une concuiste une vore preziose ma e va doprade cuntun sproc pragmatic e le\u00e2t
  aes impresis dal teritori\u00bb. Al secont obiet\u00eef si podar\u00e8s riv\u00e2
  \u00abcuntun fuart investiment par cre\u00e2 un puint jenfri dai produt\u00f4rs
  e dai \u201cbuyers\u201d dai marcj\u00e2ts plui vivar\u00f4s che vu\u00ea a son
  ator pal mont. Ma i nestris prodots si vendin dome se e je clare la lor divignince
  furlane, la l\u00f4r identit\u00e2t che e devente cualit\u00e2t\u00bb. Un esempli?
  \u00abMi impensi \u2013 al siere Bravo \u2013 di cuant che o ai puart\u00e2t pe
  prime volte \u201cLatterie Friulane\u201d a Moscje: intune capit\u00e2l come ch\u00ea
  russe che e \u00e0 14 milions di abitants a son dutis lis marcjis di yogurt dal
  mont, ma \u201cLatterie Furlane\u201d e fature un milion e mie\u00e7 di euros. E
  chest al mostre che intun mont che si globalize, dut al devente plat; e dome cui
  che al marche une fuarte difarence, une sane peculiarit\u00e2t, al \u00e8 consider\u00e2t
  dal consumad\u00f4r unic e iripetibil\u00bb. \u25a0\\nWalter Tomada\\nPar sig\u00fbr
  o sin st\u00e2ts ducj braur\u00f4s cuant e je rivade in television la storie, discognossude
  a tancj furlans, di Marc di Mur\u00f9s (o Moru\u00e7?), ultin a rindisi ae concuiste
  venite dal 1420. P\u00fbr di no dine\u00e2 la s\u00f4 apartignince ae Patrie dal
  Fri\u00fbl, lui \u2013 che al puartave la bandiere dal St\u00e2t patriarcj\u00e2l
  \u2013 [\u2026] lei di plui +\\nIn Italie si torne a fevel\u00e2 di autonomie. Magari
  par d\u00e2i cuintri, ma si torne a discuti. La Lega cu la propueste di le\u00e7
  su la autonomie diferenziade e torne a metile in cuistion. Dopo la Secession de
  Padanie, la Devoluzion, la Gjestion des Regjons dal Nord, dutis cuistions ladis
  in malore, cum\u00f2 Calderoli al [\u2026] lei di plui +\\nPe rassegne Avostanis,
  li dai Colonos a Vilecjaze di Listize, il mont des associazions, de culture, dal
  spetacul, dal sport si \u00e8 strenz\u00fbt intor dal gjorn\u00e2l dut par furlan
  fond\u00e2t tal 1946 A an partecip\u00e2t: Glesie Furlane, i Bakan, Claudio Moretti
  \u2013 Elvio Scruzzi \u2013 Fabiano Fantini (Teatro Incerto), Serena Fogolini e
  Raffaele Serafini (Contecurte), [\u2026] lei di plui +\\nAl \u00e0 fat une vore
  di scjas l\u2019articul scrit su la \u201cPatrie\u201d di Setembar di Marco Moroldo,
  furlan che al v\u00eef in France e che al \u00e0 insegn\u00e2t ai siei f\u00ees
  la marilenghe. Torn\u00e2t a Mortean pes vacancis di Ist\u00e2t, al \u00e0 prov\u00e2t
  a cir\u00ee cualchi zovin o cualchi frut che al fevel\u00e0s furlan cui [\u2026]
  lei di plui +\\nI popui a \u00e0n une identit\u00e2t ancje se no le vuelin. Tant
  che ogni om al nas e che al cres cuntun non, un cognon, un puest di divignince,
  e un document che lu comprove, cuss\u00ec ancje i popui a vegnin di un timp lontan
  e di une tiere dongje, a clamin lis robis intune [\u2026] lei di plui +\\nL\u2019apontament
  si tignar\u00e0 doman, Vinars ai 8 di Mai, aes 18, te terace de Biblioteche Comun\u00e2l,
  vie Divisione Julia a Tarcint. La Aministrazion Comun\u00e2l di Tarcint cun la Comision
  de Pari Oportunit\u00e2t nus invide ae presentazion dal libri di Erika Adami \u201cFeminis
  furlanis fuartis\u201d che viodar\u00e0 la partecipazion di une protagoniste dal
  libri e de [\u2026] lei di plui +\"", "\"Lis datis jenfri parentesi taronde si riferissin
  al an di composizion o publicazion de opare citade. Lis datis jenfri parentesi cuadrade
  si riferissin al an che al f\u00e2s riferiment il contign\u00fbt des citazions stessis.\\n***\\n\u201cIl
  linguaggio friulano \u00e8 particolare, ed \u00e8 difficile ad intendersi quanto
  il genovese, anche per gli italiani. Pare che questo gergo si accosti molto alla
  lingua francese. Tutti i termini femminili che in italiano finiscono in a, nel Friuli
  terminano in e, e tutti i plurali dei due generi sono terminanti in s.\u201d\\nCarlo
  Goldoni, M\u00e9moires (1797)\\n***\\n\u201cDie Furalnische Sprache ist eigenlich
  nicht zu den Mundarten der Italianischen zu rechnen, sondern sie ist, wie die Rh\u00e4tische,
  deren wir bereits eben erw\u00e4hnt haben, eine Tr\u00fcmmer des grossen Romanischen
  Vereins der s\u00e4mlichen lateinischen Tochtersprachen im fr\u00fcheren Mittelalter\u201d.\\n(La
  lenghe furlane no je in maniere proprie un dai dialets dal talian, ma ben, tant
  che il za menzion\u00e2t Retic, un relit dal grant compl\u00e8s roman\u00e7 des
  lenghis s\u00fbrs latinis feveladis te Ete di Mie\u00e7).\\nCarl Ludwig Fernow,
  R\u00f6mische Studien (1808)\\n\u2712 Vielm\\nPe rassegne Avostanis, li dai Colonos
