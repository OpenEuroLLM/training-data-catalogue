  otign\u00ee chest risult\u00e2t? Stramp ma v\u00ear, declarant vuere a la invasion
  di anglicisims te lenghe curinte, pensant di prov\u00e2 a sostitu\u00ee tiermins
  come download, trailer, outing, gossip e v.i. cun curispuindints furlans, tantis
