  ni fida.\"", "\"Kaayyoon hundeeffama Magaalaa Shaggar saamicha lafaa maqsuun sirna
  bulchiinsa lafaa ammayyaawaa guddina hawaasa naannoofi badhaadhina biyyaaf akka
