  fi bilisummaan kan hafaniif; nagaa fi araarri Ayyaana abboolii fi ayyoliif haa tahu!\\nIbsaa
  Guutama\\nBitootessa 2016\"", "\"Waliigala\\nAni Juneeydi Saaddoo Cirrii Siyaasaa
  Ummata Oromoo keessattis ta\u2019ee siyaasa biyyatti keessatti haala adda addaatiin
  bara 1976 irraa jalqabee hirmaachaan turee. Dhaloonni kiyyaa Godina Arsii, Dheerinna
  Gaara Cilaalo gara bahatti, labbaa Tulluu Denestari jedhamtu, ollaa Tullu Begoo,
  ganda Sheemachaa keessattidha. Akka waligalaatti Godina Arsii keessa waggoota gara
  19 yo jiraadhu, Finfinne keessammo waggota 32 jiraadhee. Waggota 4 mana barnootaa
  keessa turee malee kan hafan hojii motumma keessatti biyyaafi ummata tajaajilaa
  turee.Bara 2000 irraa jalqabee sadarkaa hoggansa ol\u2019aanaatti Oromiyaafi biyyattidhaaf
  hojjachaan turee. Syaasaa biyyatti keessatti, bara 1991 booda adeemsifamaa turee,
  kallattiidhaan akka miseensaatti kan hirmaachuu jalqabee bara 2001dha. Baatii Qaam\u2019ee
  2001 Magaaalaa Naqamtee keessatti Yaaii OPDOn adeemsifteerratti miseensaafi hogganas
  ta\u2019e filatame. Ergasi ka\u2019e hanga Onkololeessa 11, bara 2012tti siyaasaa
  biyya sani keessaa qooda qabaachuun kiyya ifaa. Rakko bara 2012 guutuu na mudataa
  tureerraa kan ka\u2019e, gara baqaa deemudhaan kunoo amma Ameerikaa keessattin argamaa.Ibsii
  asi gaditti dhiyeessu, seena kiyya dabre keessaa wantoota gabaabdu qofa Ummata biyya
  keessa jirufi biyya alaa jiruf dhiyeesudhaan Saba Oromoo dhiifama gaafachuudhaafi.\\nBara
  ijollummaa\\nYeroon kuni bara dhaladhee kaasee hanga mana barnoota Yunivarsitii
  Finfinnee xumurutti kan ilaaludhaa. Ilma qonnaan bulaa, baddaa Arsitti jireenna
  hamaa Ummanni keenna keessa jiraatu keessatti dhalachu qofa oso hintayiin seenaa,
  odeeffanno, rakkoo fi makko ummatichaa kan na waliin dhalate keessatti waggota 5niif
  mana barnoota sadarkaa 1ffaa, magaalaa Loodee-Jimaataatti Kiloometrii 12 deddebi\u2019udhan
  baradhee. Bara Sochiin barattota Yunivarsiti jalqabuu, ani sadrakaa 1ffaa keessan
  turee. Bara HSn kufuu kutaa saddet turee. Labsii lafa baadiyyaa gammachuudhaan fudhachuudhanis
  hirira qabsoo, isa jalqabaa, keessatti uf argee. Baruma sana gaazeexa Ihiaappaa
  (EPRP) kan dimookraasiyaa jedhamtus dubbisee. Bara ittiaanu, 1975, Assallaatti seeraan
  sosochi barattoota keessa galudhaan hirmaannaa bal\u2019ina qaba jedhamee waamamu
  dndayu taasiissa turee. Manni barnootas akka cufamu hiriiroota adda addaa keessatti
  qooda fudhachuudhaan barnoota dhaabee gara Magaalaa Hurutaa deebi\u2019udhaan sochii
  lafa jalaa bal\u2019aa adeemsiissa turee. Bara ittiaanuu dirqamaan gara mana barnoota
  nudeebisaniyyu sochiin kuni itti fufee. Dargiin ijoollee hiriyyoota kiyyaa heddu
  hidhuun, ajjeesufi tumuun (torcher) (goolii diimaa), qabsoon kuni akka laamshayu
  taasiisee. Waggoonni lamaan hafan, bara \u201csiyaasaa fi Korreenti fagootti\u201d
  jedhamee namni hundi mataa gadi qabate turee. Bara 1981 yeroo jalqabaatiif gara
  Finfinnee deemudhaan Kaampaasi Kiilo 4 seenudhaan barnoota itti fufee. Waggoonni
  4n kunniin yeero \u201cpolitically dormant\u201d ittiin tureedha.\\nBara Hojii Ogummaa\\nBara
  1984 irraa kaasee hanga 1991tti, seektara bishaani keessatti hojjachaan turee. Yeeroma
  kana, waggota lamaaf gara Ingiliiz (Fuulbaana 1987) deemudhaan barnoota digrii lammaffaa
  waa lamarratti wagoota lamaan kessatti barachuudhaan gara biyyaatti deebi\u2019ee.
  Waggota 7n kana keessatti Dargii hamachuufi jibburra dabree wanti qabatamaan godhee
  hinturree. Marii guyyota Jimaataa hunda waajjiraalee motummaa keessatti adeemsifamanirraa
  hafuu, buusii adda addaa diduufi seera laaffisurra waan dabre hinhojannee.Bara 1991
  yeroo Dargiin kufuu ani waajjira bishaan Magaalaa Finfinne keessatti Projektoota
  gugurdorrattiin hojjachaa turee. Yeroo bishaan Finfinnee keessa hojjadhuu, magaalaa
  Finfinnees akka baru carraa guddaan argadhee. Maastar Pilaani 1990-2006 hojjatamee
  kessattis qooda fudhadheen turee. Ilaalchi magaala sana maal akka ta\u2019e, fedhiinifi
  hawwiin maal akka ta\u2019e kan baree yeeroo sana turee. Jijjiramicha 1991 akka
  gaaritti fudhadheen garummo ufeggannodhaan ilaalaa turee. Naannoleen Afaaniifi Aadaa
  isaanitiin uf habulchan, seenaan Itophiyaa waggaa dhibba tokko qofa, hire ufi ufiin
  murteeffachu, hacuucaa sabummaa fonqolchuu, lafti akka hingurguramne, kkf dhimmoonni
  anaaf ijoo tayan kun sirnicha haraya dhufe kanaaf gurra akka keennu nataasiisee.Bara
  1995 Jia Adooleessa, Mootummaan Naanno Oromiyaa, kan OPDOn gaggeeffamu nawaamudhaan
  seektara Bishaaniifi Albuudaa akkan hogganu nagaafatee. Gaaffi kana fudhachuudhaan
  Hojii naanno keennaa jalqabee. Yeero kanatti namni waan miseensummas taye waan biraa
  natti kaase hinturree. Hojii bishaani garaa guutuudhaan itti uf gadiidhiisee hojjadhee.
  Biiroo deebiseen akka gaaritti ijaaru, caasaa godinaalee cimsuu, sirna sivil sarvisi
