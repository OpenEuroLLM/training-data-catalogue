  kan dandyu sirna ijaaruu, koontraatoota gurguddo biyya alaatiifi biyya keessa raawwachuudhaan
  dhiyeessiin bishaan dhugaatii baadiyyaa fi magaaloota Oromiyaa keessatti akka diriirfamu
  tasiisuu fi kkf hujeen jiraa. Sadarkaa biyyaa qofa oso hintaanee sadarkaa Afriikaatti
  ilaalamu kandandayan hojileen gurguddoon hojjatamani jiruu. Lafa Oromoo, ganda Oromoo,
  kan dur essa jiraan hinbeekkamne, Moyaalee kaasee hanga Cinaaksan, Hidhabu Aboteeti
  kaasee hanga Mandiitti, badda fi gammojji barachuu, nama barachuu, rakkoo qabatamaa
  hiikudhaan Ummata kiyya bira dhaabbadheen jiraa. Lafa ABOn keessa jiru hindeemiin
  oso naan jedhan lafa akka Gawgaw, Breeda Leenca, Milqaay, Raayituu KKf keessa deemeen
  hojjadhee jiraa. Uf keenne hojjadhee. Ennuyyu gammachiisuuf miti. Caasaa Oromoo
  kan lubbu qabu tokko ijaaru kiyyattis gammachuun qabaa. Haala Kanaan uwwisa bishaani
  dhibbentaa gara 15 qofa turee waggota shanan keessatti dhibbentaa 41 olitti kaasuun
  dandayameera! Hojjattootafi ogeessota bishaan Oromiyaa yoomiyyu hinirranfadhuu!Bara
  paartii biyya bulchaa jiru keessatti rakkoon baqaquu ka\u2019e, ani dame dinagdee
  Naanichaan hogganaa turee. Gara dhumatirrattis haala heeddu rakkisaa tayee keessatti
  hojiwwan dame kiyyaa qofa oso hintayiin kan dameelee heddu (kan waajjira Preezidaantichaas
  dabalatee) halkani guyyaa hojjachuudhaan Waajjirri Motummaa Naanoo Oromiyaa akka
  hincufamne taasiseen turee.Akka seensa kiyyarratti dubbadheetti, bara 2001 Jia Onkololeessaa
  keessa, Preezidaantii naanichaa tayeen Caffeedhaan Filatamee. Hojiwwan walxaxaafi
  rakkisaa tayanis hojjachuu kan jalqabee yoonarraa kaaseetii. Yeeroon kuni yeeroo
  motummaan jiddugaleessatiifi kan naannolelle heddu dadhaban turee. Motummaan maqaa
  malee caasaan isaa hinhojjatu turee. Mormiin Ummataa gara hundaan akka ibiddaatti
  bobayaa turee. Haala kana keessatti hojiin hojjadhee, hanqinoota turan, dogongoroota
  turaniifi badilee turan akka itti aanutti Ummataaf dhiyeessaa:\\nHaalli hojii naannicha
  hogganuuf itti fudhadhee akka salphaatti hinturre. Waggaa tokkoo lama dura barnoota
  dooktarummaatiif biyya Ingliiz deemen erga egaleen booda rakko mahallaqa mana barnootaarratti
  na qunnameerra kan ka\u2019e biyyatti deebi\u2019ee mahallaqa gara Dolaara kuma
  54 dhaabbolee adda addaarra ergan walitti qabeen booda motummaan deemsa naa\u2019eyyamuu
  waan dideef hafee. Haa tayu malee deebi\u2019ee deemuuf fedhii guddaa waan qabaachaa
  tureef yeroo hojiin Preezidaantumma natti kennamu mormii torban tokkoo olif, marii
  ta\u2019amaa turerratti, dhiyeessen jira. Haa tayu malee sochii naannicha keessatti
  adeemsifamaa tureerraan kan ka\u2019e namni hundinuu (gaggeesitoonni OPDO) naannorratti
  ramadamani hojjachuudhaaf diddaa waan agarsiisaniif ani hojii kana akka hojjadhu
  murtaayee.Erga hojitti seeneen booda garaa guuraa hinhojjannee. Caasaafi motumma
  Ummata Oromoo kan lubbu qabu ijaarudhaaf carraaquttin seenee. Akkaa amantaattis
  biyya Itophiya keessatti sirni bulchiinsa Fedeeraalizimi kunii haqaan hojirra yo
  oole, Ummanni keenna mirgi isaa kabajamu dandayaa, kanaaf immo nuti Oromoonni ufii
  keenna \u201cprove\u201d uf godhu qabna, biyyarraa baqachuudhaan, ummatarraa addaan
  ciccituudhaan bu\u2019aan dhufu hinjiru, rakkoon siyaasaa OPDO keessattis tayee,
  OPDO fi dhaabbolee biraa jiddutti jiraachu nidandaya, ha tayuti garuu, qabsoo dimookraatawaa,
  qabsoo olaantummaan seeraa keessatti kabajamu, qabsoo mirga hiree keennaa ufi keennaan
  mirkaneeffachu itti dandeennu karaa nagayaatiin adeemsiisudhaan carraa Saba Oromo
  jijjiiru nidandeenna, jijjirus qabna jedheen itti amanee hojjadhee.\\nOromoon uf
  bulchuu hindandayu kan jedhamu furshii taasiisudhaan caasaa ufitti amanuufi ummataa
  isaa bulchu, rakko isaa hiikuu dandayu ijaarudhaaf guddaa dhama\u2019een ture.\\nHaala
  Kanaan qaamolee sadan motummaa (qaama raawwachiiftuu, qaama seera baasuufi qaama
  seera hiikuu/mannen murtii) akka addaan bahani ijaaraman, yeero jalqabaatiif taasifneerra.
  Qaamoleen kunii mirga guutuu qabaatuu baatanille, tarkaanfii karaa sirrirratti fudhatameedhaa.
  Caasaa Motummaa gutumatti akka haarayaatti deebifnee ijaaruu, Naannichi kaabineen
  akka hogganamu taasiissuu, caasaa godinaaleefi kan aanootas kaabineen akka hogganaman
  taasissu fi humna namaatiin hanga dandayameetti akka guutaman taasifneerra.\\nBeela
  biyyattirratti bu\u2019e (bara 2001-2003 nama miliyoona 13-14ttu beelaaf saaxilame)
  ilaalchisee Ummata Oromoo Miliyoona 3.8 beelawee turee, oso balaan hamaan nuhinqunnamiin
  toyachu akka dandayamu aantummaafi kaka\u2019umsa sabbonummaa guddaatiin caasaan
  naannicha hundi hirmaanna guddaa akka taasiisufi balicha akka dhaabbatu taasifneerra.
  Seena biyya sani keessatti waggota lama keessatti qofa namoota kuma 300 oli qubachiifneerra.
  Yeroo Dargii, waggota heeddu keessatti nama kuma 600 qofa (sanummo akka biyya guutuutti)
  kan qubachiisan yo tayeelle, dhumarratti qubannaan sun, %85 kan fashalaaye tayuun
  niyaadatamaa! Baroota 2002-2003 garuu, naannoon Amaaraafi Naanoon Tigraayi ummanni
  waan dideef, kan qubachiisu dandayaan namoota kumoota kurnaniin laakkayamanidha.
  Oromiyaan maaliif milkoyte? Yeero jalqabaatiif Ummanni Oromoo qubachu barabaadufi
  waan nuti (bulchiinsii naannicha) jennu nu amanurrayi. Kana malees tokkummaafi birmannaa
  Ummanni keenna walii godhuu qabatamaan waan argeefidha. Warra tokkummaa keenna shakkuufis
  deebii amansiisaa kan itti muliifnee yeero kanaa. Ummanni Wallagga Lixaa, Wallagga
  Bahaa, Iluu Abba Boraa fi Jimmaa mana qubataa ijaarudhaan, biddeena oo\u2019aa mana
  isaati fiduudhaan, eddo tokko tokkottimmo saawwa dhaltii dabarsee keennudhaan waan
  ajaa\u2019iiba tayee tokko hojjatee jiraa. Hojiin kuni halkani fi guyyaa toyannaa
  cimaafi, bakkatti (eddotti) argamuudhaan kan hojjatameefi hirmaannaa Saba Bal\u2019aatiin
  kan milkaaye, caasaan Oromiyaa halkaniifi guyyaa karaa ijaarudhaan, bishaan baasudhaan,
  Kiliinika horiitifi kan namaa ijaarudhaan, ogeessi ufi isaati itti amanee eddoolee
  kanatti argamee akka hojjatu taasiisudhan wanta seena qabeessa taye raawwaanne jirra.
  Ar\u2019allee, Ummata Oromo kan qubateefi kan qubachiisee, hojjattootaafi hoggantoota
  Oromoo aarsaa kaffalani Ummata keenna baraaraan galata guddaa galchaafi. Ijoon dubbi
  kanaa; yeeroo kamiyyu, yo rakkoon si mudatuu, abbaa falaafi abbaa malaa kan tayee
  Saba bal\u2019aa Amani, Sabatti uf kenni, ajajuu oso hintaane yaada isaa irraa fudhadhuuti
  hojitti geeddarii, Ummatatii uf kenni. Kuni hojii kamiifu, yeero kamiyyu, eddo kamittu
  nihojjata jedheen amanaa.\\nRakkoon inni biraa cimaan naqunnamee turee haala siyaasaa
  Oromiyaa kan ilaaludhaa. Akkuma asi olitti tuqeetti yeero lola Ertraafi Itophiyaa
  jiddutti adeemsifamaa tureerra ka\u2019ee, paartii biyya bulchaa turee jiddutti
  rakko siyaasaa umameen, keessa keessa dubbiin danfa\u2019aa dhuftee motummas haalan
  dadhabsiisaa kan fidde yo ta\u2019u, Oromiyaa keessatti mormiin barattootaa garmalee
  cimaa akka turee niyaadatamaa. Bara 1999 yookiin 2000(?) keessa bosona Baaleefi
  Gujiitti ibiddi qabatu waliin walqabatees sosochiin barattoota Oromoo heddu owwaa
  turee. Bara 2001-2003ttis sochiin kuni keessattu godinaale gara lixaa jiran (Shawaa
  Lixaa, Wallagga Bahaafi Lixaa) keessatti rakkoo turee. Rakkoon yeeroo sanii akka
  ammaa kana, gadi bayu dhorkamuu ijollee oso hintayiin jeequmsa adda addaa toyachuutu
  rakko turee. Barattoonni mannen barnootaa fi qabeenna adda addaarratti miidhha geessaa
  turan akkamitti toyanna kan jedhu motummaa reefu debi\u2019e dhaabbata jiruuf qormaata
  guddaa turee. Fakkennaf Magaalaa Walisootti kan argamu, manni barnoota Garasuu Dhukii
  gubachuun ni yaadatamaa. Haala kana keessatti gara tokkoon sochi ijoolle kana toyachuun
  akkasumas toyannaa kana keessatti miidhaan namarra akka hingeenne godhuun akkamitti
  dandayama kan jedhu dubbi hamaa akka tayee namni hundi hubachu nidandayaa. Kanarraa
  kan ka\u2019een tooftaan ani itti fayyadame (1) sochiin ijoolle harka keenna ala
  akka hinbaane tooyachuu, yeerodhaaf ijoolle eddo muraasa tayanitti qabani tursiisudhaan
  spoorti hojjachiisani gadi lakkisuu akka filannoo tokkotti fudhadhee. Hanga ani
  beekutti haala kana keessatti ijoollen hidhamte torbaan 4-5 yeero hincaallef qofa
  akka tureedha; (2) dhimma ijoollen kaasan qabanne gara Ummataatti deemudhaan ijoollefi
  Ummatichaa mariisisuudhan rakko furuu, (3) pooliisiin Oromiyaa nama akka hinajjefneefi
  akka hinmadeessiine ufeggannoon ol\u2019aanaan akka godhamu taasiisuu, (4) poolisiin
  Oromiyaa muxannoo jeequmsa toyachuu waan hinqabneef, yeero jalqabaatiif biyyatti
  keessatti humna jeequmsa bittinneessu (Riot Police) nama 500 ijaarudhaan meeshaan
  waraanaa dirree hiriiraa kamiyyu akka hinseenne taasiisu, (5) hidhamtoonni mana
  hidhaa Oromiyaa jala jiru hunda keessa jiran akka hintumamne qajeelfama cimaa poolisi
  fi bulchiinsa mana adabaa/hidhaatiif dabarsuufi kkf raawwachuudhhan balaan caalu
  akka nuhinmudanne taasisuf hojjadheen jira. Fakkeennaaf Bulchiinsa Motummaa Ummattota
  Kibbaa keessatti mormii Ummanni Sidaamaa Magaala Hawaasaa irratti kaaseen guyyaa
  tokko keessatti namni 25 akka du\u2019e niyaadatamaa. Garuu Oromiyaa walakkaa keessatti
  (Lixa Oromiyaa guutuu) jeequmsii yeeroo dheeraaf adeemsiifama turee, balaan guddaan
  oso hinqunnamiin kan dabreef iccitiin isaa maali, jedhee namni hundi yaadu nidandayaa.
  Ijoolleen Yunivarsiti Finfinnee Biiroo tiyyatti dhufudhaan akka fedhanitti yaada
  mormii isaani dhiyeeffachaa akka turaniifi mariilee babal\u2019aa adeemsiisaa akka
  turrefi nagayaan addaan akka deemaa turre beekkamu qabaa. Kana keessatti hanqinaafi
  dogongorri hinturre jechu kiyyammo akka hintaanee namni hundi akka naaf beeku gaafachaa
  eddo isatti, barreeffama kana keessatti akka kaasu nan mirkaneessaa.\\nYeroo ani
  bulchaa tureetti hidhamaan mana hidhaa keessa jiru rakko dhiphiina eddo, rakko nyaataafi
  saaniteeshinii qabaachaa turani. Kuni durumarraa kan dhaalameedhaa. Haala manneen
  hidhaa keessa turan foyyeessuf hanga dnadayametti tarkaanfiwwan kanatti aanan fudhadheen
  turee; (1) bara 2003 namni 5800 akka dhifatamaan gadilakkifamu, bara 2004mmo 3500
  akka galakkifamau taasiisneerra; kuni immo seenaa biyya sanii keessatti (keessahu
  sirna kana keessatti) kan jalqabaa turee, (2) mannen hidhaa hedduurra deemuudhaan
  ilaaluu, hidhamtoota waliin marii gaggabaabaa adeemsiisu, (3) manni fincaanii, dhiyeessiin
  bishaan dhugaatitiifi kan dhiqannaa akka dhiyaatuu taasiisuu, (4) eddoon midhaan
  itti bilcheessan akka foyya\u2019an taasiisuu, (5) nyaata hidhamtootarratti jijjirama
  guddaa taasiissu fi kkf raawwatamaniru.\\nDhiimmi biraa rakkisaan hanga ammaa hinfuramne
  dhimma Magaala Finfinneeti. Isa kana qorachiisuuf yo yallelle, dubbichi dhimma seeraa
  oso hintayiin dhimma siyaasaa tayuun isaa adeemsaan hubannee. Finfinneen lafa Tuulamaa,
  lafa weerara diinaatiin qabamtee, lafa Ummanni Oromoo Tuulamaa kuma hedduun laakkayamu
  lola yeero heddu (Eekkatti, Gaara hexootti, Gullalletti, Ejereetti) adeemsiifameen
  irratti dhumeedhaa. Qe\u2019een Oromootaa, guututti ibiddaan barbaadaye, qabbenni
  isaa guutumatti saamamedha. Finfinneen AWWAALA Oromoo irratti ijaaramtee. Finfinneen
  handhuura Oromiyaa qofa oso hintaanee, seenaa Sabni nagaya biyya ufii keessatti
  mirga lubbuun jiraachuu dhabee itti dhume qabdii. Dhiigni namaafi looni weerartootaan
  gadi naqame akka bishaani laga keessa akka ya\u2019aa ture seenaan nimu\u2019lisaa.
  Dhimmi akkanaa, dubbi ogummaa seeraatiin hikkamuu oso hintaane, deebii siyaasaa
  qofaan akka tayee beekudhaan, haala yeeroo san tureen (ammas ni hammaatee malee
  wanti foyya\u2019ee hinjiruu), gutumattis tayu dhabuu, akkamitti furmaata xixinnaa
  keennuun dandayama ka jedhu ilaallee turree. Haaluma Kanaan, (1) bulchaan Magaala
  Finfinne nama Oromoo akka tayu (mayor of the city), (2) mana marii bulchiinsa magaala
  Finfinne keessa barcuumaan %25ni Oromoodhaaf qofa akka hambifamee Motummaan Naannoo
  Oromiyaa namoota dandeetti qaban Magaala Finfinnee keessayis tayee Oromiyaarraa
  waldorgoomsiisee akka ramadu, barcumaa hafanirrattis namni Oromoo namoota saba biro
  waliin waldorgomee yo filatamee eddo qabachuu akka dandayu, carraan banaa akka tayu,
  (3) galii Magaalli Finfinne galchiitu keessaa %10-20 tayu Oromiyaadhaf akka galu,
  (4) xurii, hasbaafi shama Finfinnee keessa gadiyaa\u2019u warshaaleen hundi fayyisani
  (treated waste) malee akka gadi hinlakkifnee akkasumas manni qopheessaa, xurii fi
  kosii goggogaa seera egumsa naannoo eggateen akka maqsuufi Buulchiinsa Motummaa
  Naanno Oromiyaa waliin akka hojjatu kan jedhuuf kan biroolle akka mariatamaa tureefi
  wixineen yaadaafi seeraa akka dhiyaataa turee ninbeekaa. Kannen hunda keessa laakkofsa
  1ffa jalatti kan tuqe qofti hojirra yoo oolu kan hafan akka hojirra hinoolles ninbeekaa.
  Rakkoon Siyaasaa Finfinnee Rakkoo Siyyaasa Ummata Oromootiin addaan baafame ilaaluun
  akka hindandaymnee adeemsa kana keessatti baradheen jiraa. Hanga sani bulchiinsi
  motummaa Oromiyaa Magaala Finfinne keessa akka turuu, dhimmoonni Oromummaa agarsiissan
  tokko tokkos akka ijaaraman, fakkennaaf manneen barnoota afaan Oromoo, jiddu gala
  aadaa Oromoo\u2026. Kannen keessayis wanti jalqabame yo jiraatelle harkifannaafi
  foqooqaa akka tayee amanuun barbaachiisaadhaa.\\nRakkoon Siyaasaa Ummata Oromoo,
  gara tokkoon yoo ilaalamu, rakkoo magaalaa fi baadiyaa tayee argamaa. Ummanni Oromoo
  gaafa ani Oromiyaa turee (2001-2005), %89 baadiyyaa keessatti bittinnaayee jiraataa.
  Magaaloonni naanno Oromiyaa, keessattu Finfinnerra gara bahaatti kan argaman kan
  ijaaraman Ummata Oromootiin akka hintaanee namani hundii nibeekaa. Magaalli lafa
  siyaasaan, daldalli, walqunnamtiifi odeeffannooon baliinaan keessatti argamuudhaa.
  Caasseffama (socio-economic hierarchy) hawaasoota biyya guddataa jirani keessatti
  magaaloonni mataa yoo tayan badiyyaan isaani gadidhaa. Ummanni Oromoo, Magaalota
  keessaa akka ari\u2019atamu, magaaloonni lafa hidhaa, lafa afaaniif aadaan isaa
  itti qaaneeffamu, walumaagalatti biyya isaa oso hintayiin akka waan biyya ormaa
  dhaqeetti akka itti dhagayamuu godhamani ijaaramani. Bulchiinsii, ilaalchii, amantiin,
  propogaandaan midiyaale, qaani tokko malee waggota 136f ololaafi maqaa balleessaa
  Orommoorratti adeemsiisaa turani. Bara 1991 booda erga bulchiinsii naannolee ijaaramee
  kaasee, Magaaloota Dirre Dhawaafi Finfinnee malee kan hafan Oromiyaa jalatti akka
  bulan yo taasifamu, ummanni magaaloota kana keessa jiru garuu garri caalu Oromoo
  waan hintayiiniif rakko ifatti mul\u2019atu akka ta\u2019ee hubachuudhaan Ummanni
  Oromoo magaaloota Naanno isaa keessa jiranitti akka galu yaalii godheen dhiibbaan
  ifaafi ifa hintaanee narratti adeemsifameeraa. Projeektiin kunis akka fashaalaayu
  taasifamuun isaa dhimma gadda guddaadhaan yaadadhuudhaa. Sababni isaas, Oromoon
  lafa qotee, horii horsiisee qofa ummata biro kan magaalotaa fi kanafu, siyaas-dinagdee
  isaa toyatu qallabuun yakkaa jedheen waan amanuufi. Ummanni Oromoo ar\u2019aa oso
  hintayiin bara 1990mman keessa magaalota isaa toyachuu qaba turee. Ummata Oromoo
  biyya keessa jiruufi daayaasporaa adda addaa akka biyyatti galee lafa fudhatu yeero
  jalqabaatiif anatuu yaali godhee. Yaanni kiyyas kan maddu, lafa Oromoo gurguruuf
  oso hintaanee siyaas-dinaggee magaaloota isaa akka inni toyaatuuf turee. Haluma
  amma jiru keessattis dhimmi sirrifi mirga ennuyyu oso hintuqnee mirga Oromoo kan
  tarkaanfachiisuu dandayu ajandaa ebbifamaa turee. Kuni danqaa siyaasaa fi dhiibba
  bal\u2019aafi olola dubbi micciruutiin fashalaaye. Kuni aangoo Motummaa Naanno Oromiya
  fi mirga OPDOti turee; garuu hintaanee.\\nDhimmi biro dhimma Jimaatii. Jimaan, keessayyu
  kan baha Oromiyaa amma sadarkaa lammaffarratti sharafa biyya alaa kan galchiitudhaa.
  Jimaa tana garuu, Oromoon keessatti miskinayee, gadadoofi hiyyuummaadhan jala deeme
  omishuu, gaheen inni keessa qabuu, heddu xiqqaadhaa. Saamtoonnii (motummaafi motummaa
  alas kanjiran) adda addaa daldaltoota Oromoo hintayiin waliin waltayuudhaan Oromoo
  dhiiga isaa xuuxaa jirani. Kana jijjirudhaaf qonnaan bulaa godinaalee Hararghee
  lamaan keessa jiran waldaya gamtaatiin waliitti ijaarudhaan gandi hundi waldaya
  tokko akka qabaatu godhuudhhan waldaalee godina lamaanimmo Yuniyeeni (union) Humbanaa-Carcar
  ijaarudhaan sosochi abdi nama keennu uumnee turree. Haa tayu malee, caasaan hannaan
  xaxamee daldaltoota saamtootaa Oromoo quncifachaa jiraniin waliigaludhaan Yuniyeeni
  keenna akka diiggamuufi waldaaleen b\u2019uuraas akka diiggaman taasifamu isaa,
  gadda zamanni hinshaarren yaadadhdhaa! Rakkoon Jimaa Oromiyaa dhimma Ijoo siyaasaati
  malee dhimma daldaalaa, kan teekinika akka hintaanees hubadheen jiraa. Jimaan qabxii
  qabsoo Oromoo keessaa isa tokko akka tayees niinamanaa! Ragaa Oromoon qabeenna isaarratti
  abboomu dadhabuu Jimaafi Bunaa ol wanti dhiyaatu akka hinjirree, qabsaayeen, hojjadheen
  argeeraa.\\nDhimmoota dogongoraa fi dhiifama irratti Gaafadhuu:\\nBara 2001-2012tti
  motummaa amma biyya bulchaa jiru kessatti eddo gara gararratti sadarkaa gaggeesummaatti
  hojjadheen jiraa. Yeroo kana keessatti dhimmota imaammataa fi dhimmota seeraafi
  siyaasaas dabalatee murtilee gurguddo murteesseen jiraa, yookaan immo akka murtaayan
  sagalee kiyya keennudhaan qooda keessatti fudhadheen jiraa. Kuni, motummaa naannos
  tayee motummaa feedeeraalas nidabalataa. Murtilee kana hunda isaanituu Ummanni Oromoos
  tayee Umaanni biyyatti akka miidhaman, akka badan, akka cunqurfaman yaade murtii
  kamiyyu murteessu baadhuulle, murtileen ani murteessefi akka murtayaan ani gargaaree
  Ummattooto biyyattifi Ummata kiyyas (Ummata Oromoo) kan miidhan yo jiraatan hal
  duree tokko malee dhifaman gaafadhaa.\\nAni ilma qonnaan bulaa, haccuccaafi hiyyummaan
  baadiyya maal akka taate beeku, Ummata waggota 136f mirga isaa gonfachuuf qabsaayu
  keessaa bayee. Ilaalchi kiyya yoomiyyu hawwi Ummata Oromootiin addaan hinbayuu.
  Murtiwwan ani raawwadheen Sabni bal\u2019aa fi namoonni dhuunfaas kan waliin hojjadhees
  taye hojjachiise kan miidhaman yo tayan dhiifaman gaafadhaa.Bara 2001-2003 ykn 2004
  jeequmsa barattoonni kaasaa turan keessatti hanga ani beekutti barattoonni lama
  rasaasa poolisi Oromiyaatiin du\u2019un isaani ni beekkamaa. Haala asi olitti baliinaan
  ibsee sana keessatti of eggannoon ol\u2019aanaan fudhatamulle garuu, dogongoronni
  akkanaa dhabamu waan dandayan hinseyu. Magaala Shaambuutiifi Magaala Amboo kessatti
  akkuma rakkoon kuni umamuu dhagayeen poolisooni dhukaasa kana banan to\u2019annaa
  jala oolani akka seeratti dhiyaatan yo taasiisu, gara biraatiin Gumaan Lubbu waarra
  ijolleettif oso oolee hinbuliin akka kafalamu taasiiseen jiraa. Tayulle lubbuu namoota
  dabraniitiif haal duree tokko malee dhiifamaan gaafadhaa.Barattota Yunivarsiti Finfinnee
  300 tayan kan arisiisee Juneeydidha jedhame kan haasayamee citu didee hanga ar\u2019aa
  deemaa jiru kijiba adiidhaa. Ijollee kana kan ari\u2019ee motummaa Fedeeraalaati.
  Dubbiin oo\u2019itee jennaan warri feedeeraalaa gara keenna darbatee.\\nOromiyaa
  guutuu keessatti ilmaan Oromoo Yunivarsitii keessa jiran hundi akka waan ari\u2019amanitti
  waan ololfameef deebii gara midiyaatiin ani akka keennu OPDOn murteessee. Haaluma
  Kanaan gabaasa warri fedeeraalaa gara keenna ergeerratti (ijolleen foodda layibraarii
  caccabsuu, sirni baruufi barsiisuu akka gufatu taasiisuu, preezidanticha Yunivarsiti
  waajjira isaatti marsuudhaan guyya walakkaaf (hotage) godhuufi kkf) hundaayudhaan
  ibsa kennee turee. Ibsi sunis (1) namni Oromo Yunivarsitiwwan saddettan yeero san
  turan keessatti baratu kuma 10ni ol akka taye, (2) ijoolleen kuni karaa nagayaatiin
  mormii isaani dhiyeffachuu oso dandayaan qabeenna caccabsuufi preezidaanti hostage
  godhani qabachuun sirri akka hinturrefi murtiin motummaan fedeeraalaa fudhate sirridha
  kan jedhu turee. Kanarratti dogongorri kiyya akkataa ibsa san itti kennedha malee
  murtii keenname sani anis tayee OPDOn jijjiruu hindandayu turee! Hinbeekus turee!
  Murtiin ariisaa ijoolle sanis murtii siyaasaa turee malee murti bulchiinsaa hinturre.\\nMurtii
  qaamni biraa murteesserratti ibsa akkasi keennuun kiyya dogongora akka tayee bara
  2005 Baatii Adooleessa barattoota Yunivarsitii, kumaatamatti laakkayaman baati tokko
  oliif, Hadamaarratti OPDOn leenjisurratti, guyyota 5nif anis qooda fudhadheen, achirratti
  barataaf haala kana ibseefi gocha oso hintayiin jecha kiyyaf dhiifama gaafadhee
  barataan guutuun gammachuufi oo\u2019ina guddaadhaan harka dhayee narraa fudhateera.
  Ani nama barnoonni Oromiyaa gandoota 6500 keessatti akka diriirfamu taasiiseedha.\\nBara
  kiyyaa, hojiiwwan hojjataman keessa inni guddaan mannen barnootaa gandoota baadiyyaa
  Oromiyaa akka walgayan, Oromoon humna isaatiin, qabeenna isaatiin, mana barnoota
  akka ijaaruu, mana barsiisota baadiyya akka ijaaruu, manneen barnnotaa akka qabeenaa
  ufitti fudhatee akka qooda keessattis fudhatuu Ummata Keennatti warwaadheen amansiisee
  hojii guddaa hojjadhee jiraa. Oromoon waggaa dhibbaf akka farda lugaamame bishaan
  taliila yaa\u2019u dhuguu dadhabee bira dhaabbatutti barnootarraa ittiifamee turee;
  amma garru seenaa kana hajijjirru jedheen Ummatati booyee, boochisee haala jijjiree.
  Ar\u2019aa \u201cdhaloota qubee\u201d jedhamee kan waamamu kuni kan ardii Oromootirra
  oldammaqee Oromummaa finiinsaa jiruu kuni qabsoo hadhaawaadhaan dhufee. Bara san
  bara barsiisaan paantiitti deebi\u2019ee Chalk ittin barsiisuu lafa kaayee dhoqqee
  dhiitee mana maarigee/laambubeedha. Barri sun, bara Oromoon guyyaa tokkotti mana
  barnoota sadarkaa tokkoffa itti ijaare fixu turee, barri sun Oromoon qabeenna ufi
  baasee, baati 3 fi 4 keessetti mana barnoota sadarkaa lammaffas tayee kan BLTO xumuratee
  biiro tiyyaafi biiroo barnoota Oromiyaas dhufee barsiisaa nukeenna jedhaa turee,
  barri sun bara mannen hirriba kollejjotaa gara kutaa barnootaatti jijjirre ijoollef
  immo qarshii nyaataafi kiraa manaa kafalle Oromiyaa keessatti raajiin hojjatameedha.
  Asirratti hojii guddaa akkanaa kana kan hojjadhee kophaa kiyya miti.\\nBu\u2019ura
  Obbo Ibsaa Guutamaa bara ce\u2019umsaa lafa kaayeerratti hogganoota Biiroo Barnoota
  Oromiyaa kan yeerro adda addaa hundayyu (Mulugeetaa Ammannaa, Birhaanuu, Yohaanis
  Gendaa, Haaruun Hussen\u2026) dhamaatii isaanitiif kan galatoonfadhu yo ta\u2019eyyu,
  Obbo Darajjee Asfaaw kophaattiin yaadadhaa. Darajjee was the stabilizer of Oromiyaa
  Education. Kanaafi Ummanni Oromoo bal\u2019aan kan biyyafi biyya ormaa keessa jiru
  haqa turee, hanqina tureefi haala turee yaada keessa galchee murti isaa akka keennu
  isaaf dhiisaa.Dhimmoonni biro kan midiyyarrattis tayee waltajjii adda addarratti
  dubbadhee mala qaroomina walqunnamtiitiin (communication science) kan hindeggaramne
  akka tayee ninbeekaa. Haala Kanaan jechoota nama hinharkifne, kan nama waraananiifi
  kan nama dhuunfaas tayee Saba tuqaan jiraachuu nimalu. Jechoota faallaa mirga Oromoo
  tayani mul\u2019atan hundaa, Ummanni akka irra naaf taru gaafadhaa.Bara 2012 rakko
  babal\u2019aa Ummata Musliimaatiifi motummaa fedeeraalaa jiddu tureerratti ana ilaalchiisee
  walhubannaa dhabiitiin akka umamee ninbeekaa. Ani Oromoodha. Oromummaan mallatto
  ennummaa kiyyaatti. Ani Muusliima. Kunis ennumma kiyya. Rakkoo deemaa turtee keessatti
  (hiikudhaaf) kan qooda fudhadhee gara baatii Gurrandhala, 2012ti. Ijjannoon kiyya,
  (1) ummanni musliimaa bakka lamatti walqoodee walfixuun irra hinjiraatu, kanaafis
  ummata kiristaanaa Ortodooksii, Kaatolikii, Protestaantii ilaalaa, yoo walihingalles
  garaa garummaa keessan walif kabajaati jiraadhaa kan jedhu, (2) waajjira majiliisa
  Islaamatiifi warra Towhiida jedhaman walitti fidudhaaf yaalli godheeraa, (3) haala
  yeero sana tureen kana godhuun kiyyas paarti biyya bulchaa jiruuf waan gaaridha
  malee hamaadha jedhee hinyaannee, (4) haalli biyyatti keessa turee rakkisaa waan
  tayeef (mummichii ministroota dhibee keessa waan tureef, yo inni fayye galee anatu
  isiin fuudhee biraa dhaqnee waan barbaaddan gaafattani. Hanga sani ummata tasgabeessa
  kan jedhu ture).\\nAni kana godhaa kan tureef namoota muusliima tayan kan kaabinee
  feederaalaa keessa jiran gara 7 ykn 8 tayan keessaa, isaan caalaa muusliima tayee
  oso hintayiin dhimmi ummataa, yeeroo kamiyyuu waan nadhibuuf cal jedhee ilaaluu
  hindandeenne. Garuummo, Yaaliin kiyya gara motummaatinis tayee gara ummataatiin
  ija gaariin hin\u2019ilaalamnee. Asirratti amanti Ahbash jedhamtu kan Shek Abdalla
  Adareetiin biyya Lubnaan (Lebanon) irra hogganamtuf gartummaa agarsiiseen turee.
  Sababnis, ani (traditional Islam) kan jedhamu hordofaa waanan tureef, amantiin Jaarsi
  kuni oofus Kanaan walitti waan dhuftuuf turtee. Haa tayu malee, ani ummanni musliimaa
  kan Towhidaa amantii isaa hinadeemsifatiin jedhee gaafa tokkos dubbadhee hinbeekuu.
  Warri matooti amantii kanaas kan Oromoo tayan hundaayyu ninbeekaa. Gartummaa Ahbashi
  agarsiisuu kiyyaf garuu, dhiifaman gaafadhaa.\\nDhimmota sirrayu qaban:\\nAni hanqinoota
  heddu nama qabuudhaa. Muxanno hojiifi ogummaa adda addaa heddu yo qabaadheelle,
  ammas hanqina heddu akkan qabuu nama ufbeekudhaa. Kanaafu yeero hundaa waltajji
  jireennaafi qabsoo kamirrayyu dafee barachuudhaaf yaalii taasiisaa tureera. Kanaaf
  hanqinni akka narra jiru barudhaan hojiifi adeemsa kiyya foyyeessuf carraaqaan ture
  ammas ittiin jiraa. Haa tayu malee, ololoota akka faashisti ani tayeetti oofaman
  ninbalaaleefadhaa! Ani nama waan fascism taye bareechee beekudhaa. Ani, naanno yoon
  bulchaa tureefi fedeeraala keessa yeeroon hojjadhutti nama Oromoos tayee nama biraa
  tokkolle, eddo kamittu akka ajjeefamu karaa ifa tayeefi karaa dhoksaa tayeenis wanti
  tokko ani raawwadhee hinjiruu. Ittis hinamanuu. Kana malees yeroon ummata Oromoo
  bulchaa turee, Ummatatti ufkenneeti hojjadhe malee ummatarraa uf hinqabnee. Diriirfadhee
  taaiitaa ooisaa hinbaanee. Gandoota Oromoo dhaqabuudhaan, qe\u2019ee isaa oso hinyaadatamne
  dhaquudhaan, mana isaa seenuudhan, urgaa isaa urgeeffachuudhaan waggota afran dabarsee.
  Yo biiroon rakko fiddus, gara baadiyyaa deemaan turee. Baadiyyaa yo deemu ninfayyaa!
  Fakkeennaaf yeero tokko Magaalaa Mandii- Wallagga Lixaa keessatti, hojii ilaaluf
  yeeroon deemu waraanni biyyaa, naannawa sana jiru hidhanno guutuu qabatee ummata
  bayee karaa gamaa gamana dhaabbatee nasimachuuf bayerratti, fuulaan itti garagalee
  qawwee gara ummataa qabee animmo jiddu sana akka dabru qophaayee turee. Battalumatti,
  waraanni kuni asi ka\u2019u malee lafa daaw\u2019annaa san hindeemu jedhee diduudhaan
  namicha basaasaa naanno sana jiruun hatattamaan akka kaasu itti himee. Innis nageenna
  keetiif jennaan, ani ummata Oromoorra uf hineeguu, waan ummata Oromoorra dabreemmo
  humni dafee dhaqabaa Oromiyaa (kan Yoonaatanniifi Dirribaa Aariqoo leenjisan) nama
  10ni gadi kan hintaaneetu nawaliin jiraa. Eegumsa warana biyyaa, Oromiyaan hingaafanne
  jechudhaan waraanicha kaasiiseen ummata keessa miila kiyyaan deemee, harka fuudhee,
  waliin nyadhee dhugee, Oromummaa agarsiiseen Oromummas argeen galee. Mandiin lafa
  hoggansi OPDO hanga guyyaa sanitti dhaqee hinbeekneedha.\\nLafti sun, lafa hoggantoonni
  ABO tokko tokko itti dhalatan waan taateef akka lafa ABOtti fudhatamtii. Edoo kamittu,
  yeeroo kamiyyu Ummata Oromoorra hinqoollifanne. Oloola maqaa balleessaafi ennumma
  namaa biyya faranjii, biyya iftooma qabduu keessa ta\u2019aani oso haqaafi dhara
  addaan hinbaafne namarratti duuluun Oromoo diiguudha jedheen abaaraa.Waayee amantirratti
  Sheekkota areeda dheeraa qaban isinirra haada jedheeni; jedhamee saalfii tokko malee
  warri oduu kana gadidhiisuu, ammas Ummata Oromootiifi ana waldhabssiisuf warra carraaqudha.
  Warroonni kunimmo biyya keessafi (caasaa motummaa keessafi isaa alas) biyya alas
  warra jiran akka tayee ninbeekaa. Ani warra amantii dhiisiti nama kamiyyu, garaa
  garummas yon qabaadhees nama kabajudhaa. Kanammo Sabni bal\u2019aan nibeekaa. Caasaa
  OPDO keessatti namni biiroo isaa Ummata Oromootiif yeeroo jalqabaatiif bane anadhaa.
  Qonnaan bulaan, hojjataan, warrii amantii, hiyyeessi, dureessi, dhiiraafi dhalaan,
  diqqaafi guddaan biiroo tiyya hindhufne hinturree.\\nNamni kaffalti geejibaa gara
