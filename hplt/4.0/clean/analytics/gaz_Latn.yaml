  bara dheeraaf qaban jiraachuu keenyayyuu herrega keessa akka hin galchine godheera.
  Sun bara imperialism waan tureef amma bara teknoloojii addunyaan ganda baaqulawaa
  tokko tahuuf aggamatu kana hariiroon saanii waan bara waliin hin deemneef hin qabu.
  Oromoon wayyabaa; bucuun hin moohamnu jedhaa jiru. Yoo irra goruu baatanuu, saba
  bucuu irra tursuuf akka hin sadne haa gaafannu.\\nMootummaan Habashaa gargaarsa
  halagaan malee dilii kamittuu waraana Oromiyaa moo\u2019atee hin beeku. Kan Oromoo
  qabatee hanga yoonaa irra turuu dandahes gargaarsa walfakkaataa walirraa hin citneen
  tahuuf raga hedduutu jira Fakeenyaaf tokko, uffata, hidhannoo fi geejiba loltuun
  TPLF Oromoo ajjeesaa jirtuu ilaaluu dha. Ummata abdii kutatee hanga du\u2019a hin
  sodaanne gahee gargaarsi kamuu ukkamsuu hin dandahu. Oromoon hardha sadarkaa sana
