  kaayyoo Goototni Oromoo qaqqqaaliin irratti wareegaman galmaan gahuuf irbuu isaanii
  itti haaromsanidha. Seenaa fi imaanaa gootonni Oromoo wareegamaniif galmaan gahuuf
  jecha Qeerroon Bilisummaa Oromoos guyyuma kana irratti Ebla 15,2017 Oromiyaa keessatti
  sirnaan hudeefamee sochii seena qabaeessa eegalee har\u2019a gahee jira.\\nSeenaa
  ummata Oromoo keessatti Ebla 15, guyyoota kaan irraa wanti adda taasisu bara 1980
