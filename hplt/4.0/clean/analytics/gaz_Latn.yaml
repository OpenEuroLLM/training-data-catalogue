  lubbuun hedduun galaafatamee dhiigni dhangala\u2019eera, tokkummaan ummatootaa laafffatee
  Wayyaaneef carraa ta\u2019eera. Mootummaan abbaa irree amma illee uummata Oromoo
  Booraanaa fi Gujii saba tokkicha gidduutti tooftaa uummata shororkeessuu fi dhiigaa
  waldhangalaasiisuu gaggeessa jira. Ummaanni Oromoo hundi akeeka diinaa kana irratti
  dammaquun ummanni keenya bu\u2019aa xixiqqoo irratti dhiiga waldhangalasuun carraa
  diinaaf banuu dhiifnee, diina wal nu nyaachisaa jiru abbaa irree EPRDF irratti gamtaan
  qabsaa\u2019uuf ga\u2019een dargaggootaa fi beektotaa olaanaa ta\u2019uu ni hubachiifna.\\n-
  Qabsoo Bilisummaa Oromoofi kabajamuu mirga Ummata Oromoof ittigaafatamuummaa guddaa
  kan of harkaa qabu numa dargaggoota Oromoo fi beektoota Oromoo sadarkaa garaa garaa
  irra jirru ta\u2019uu jaabessinee hubachiifna. Goototni ilmaan Oromoo kaleessa utuu
  hanga kana hin baay\u2019atiin, hin baratiin, walitti dhiyaatee hin marii\u2019atiin
  fi teeknoloojii hin fayyadamiin eenyummaa ummataa keenyaa fi qabeenya Oromoon qabu
  tiksuun wareegama qaalii lubbuu, lafee itti cabsee dhiiga irratti cophsee Oromoo
  fi Oromiyaa har\u2019aa kana nu dhaalchisee utuu diinaaf hin jilbeeffatiin bilisummaa
  keessanitti xumura godhadha ofiin of bulchaa jechuun wareegama tilmaama hinqabne
  kanfaluun seenaa keessatti bakka olaanaa qabaachuun darbaniiru. Nuti dhaloonni har\u2019aa
  ittigaafatama seenaa jalaa of baasuufi Qabsoo Bilisummaa gootota keenyaan dhaalchifamnee
  fi bu\u2019aa Qabsoo Oromoo ta\u2019uu keenya beekuun eenyummaa, abbaa biyyummaa,
  sabboonummaa, fi bilisummaa keenya gonfachuuf yoomiyyuu caalaa yeroon gamtaan harka
  walqabannee biyya keessaafi biyyota hambaa garaagaraa keessatti FDG Qeerroon qabsiisee
  jiruu jabeessuun wareegama barbachiisa itti kanfallee bilisummaa keenya mirkaneeffannu
  amma jechuun Hogganni Qeerroo Bilisummaa Oromoo godinoota adda addaa bakka bu\u2019anii
  Ebla 2/2014 haala yeroo irratti marii gochuun dhiha Oromiyaa magaalaa Jimmaa keessatti
  keessatti Ibsa Ejjennoo walgahii kanaa baaseen beeksisaee sochii gootuu Oromiyaa
  qabsiisuun isaa yaadatnoo dhihooti.\\nUmmaatni Oromoo Sochii qindaa\u2019aa kana
  irratti Gootota Qeerroo Dargaggoota Oromoofi Barattoota oromoo waliin hiriiruun
  Qabsoo Bilisummaa Oromoo galiin ga\u2019uuf tokkummaan falmaa irraa akka duubatti
  hindeebine Ayyaanaa Irreecha birraa bara 2015 irratti irbuu isaa bifa ajaa\u2019ibaatiin
