  seeraa akka fudhatamu ta\u2019eera.\\nWaggaa lamaaf hojimaata sirreessuufi sochii
  abbootii qabeenyaa qulqulleessuurra turuu yaadachiisanii; ammaan tana ulaagaaleen
  simannaa tarreeffamee abbootiin qabeenyaa karaa hannaafi tuttuqaarraa bilisa ta\u2019een
  onlaayinii simatamaa jiraachuu ibsaniiru.\\nAmmaan tana pirojektoonni invastimantii
  4,300 ta\u2019an Shaggar keessa kan jiran yommuu ta\u2019u; lafti hektaarri 3,525
  hojii invastimantiif qophaa\u2019eera. Bu\u2019aqabeessummaa invastimantii magaalattii
