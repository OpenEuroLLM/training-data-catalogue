  si\u2019eessan kanneen sadarkaasaanii eeggatan bu\u2019uura pilaanii magaalattiin
  hojjetamaa jiru. Qonnaan bulaan qe\u2019eesaarratti abbaa qabeenyaa haala itti ta\u2019uufi
  omishtummaa qonnaa itti guddisurratti leenjiin hubannoo uumuu bal\u2019inaan kennameera,
  ammas kennamaa jira.\\nBarana lafa magaalattii hektaarri kuma 81 qotame keessaa
  lafti qamadii jallisii bonaa isa olaanaadha. Lafti Shaggar omishaalee akaakuuwwan
  hundaaf mijataa waan ta\u2019eef kuduraaleefi muduraaleenis bal\u2019inaan omishamaa
  jiru.\\nShaggaritti karoorri wabii midhaan nyaataa mirkaneessuu yeroo gabaabaa keessatti
  firii waan godhateef ammaan tana yaaddoon jiru hanqina omishaa osoo hintaane waan
  omishameef gatii madaalawaa dhabuudha. Killeen duraan Shaggar keessatti daran qaala\u2019aa
  ture yeroo gabaabaa keessatti lukkuu miliyoonaan omishuun waan danda\u2019ameef
  gatiin killee daran gad bu\u2019aa ta\u2019uu kaantiibichi ibsaniiru.\\nAbbaan qabeenyaa
  Riizoortii Kurriftuufi Ispaa Obbo Taadiyoos Ballaxaa gamasaaniin, Shaggar biyyarra
  darbee Afrikaafuu hojiilee fakkeenya ta\u2019an hedduu xiyyeeffannaa addaatiin hojjechaa
  akka jiru dubbatu. Obbo Taadiyoos deeggarsa barbaachisaa Bulchiinsi Magaalaa Shaggar
  isaaniif taasiseen riizoortii bashannaanaafi dhimmoota hawaasummaa garaagaraaf oolu
  ijaaruun hawaasa tajaajiluurratti argamu. Riizoortiin kun meeshaalee aadaa biyyoota
  Afrikaa garagaraa calaqqisiisan walittiqabuun haala qalbii nama hawwatuun keenyan
  seensa galma riizoortichaarratti faayeera.\\nHojii misooma invastimantii taasisan
  keessatti hoggansi magaalattii sadarkaan jiru tumsa barbaachisaa gochuufii dubbatanii;
  fuuldurattis hojii misooma hoteelaa babal\u2019isuuf karoora qabu.\\nWayita riizoortiin
  kun ijaaramu namoota 500 oliif carraan hojii kan baname yommuu ta\u2019u ammaan
  tanas tajaajilawwan garagaraarratti hojjettoota 250 ta\u2019aniif carraa hojii uumuu
  eeraniiru. Namootni carraan hojii uumameef kunneenis abbaan qabeenyaa kun leenjii
  bal\u2019aa akka argatan erga taasisee booda riizoortichatti isaan mindeessuusaatti
  gammachuu guddaa kan qaban ta\u2019uu ibsaniiru.\\nAkka Obbo Taadiyoos jedhanitti,
  qabeenyaafi beekumsa qabaniin hawaasa ofii tajaajiluun bu\u2019uura hundarra caaludha.
  Bakkawwan hoteelaafi riizoortii ijaaran hundatti hojii dhabdoota homaa hin qabne
  lafaa kaasanii leenjiin ga\u2019oomsanii hoteelota guguddoo sadarkaa idiladdunyaatti
  akka tajaajila kennan taasisuu cinatti jireenya baay\u2019otaa jijjiiraniiru. Riizoortiin
  kun calaqqee Afrikaan waan yayyabameef embaasiiwwan biyyoota garagaraa aadaasaanii
  keessatti akka calaqqisiifatan taasifamaa jira.\\nDurbee Mirat Waaqgaarii riizoortii
  kana keessatti wayita tajaajiltu arginee dubbisne. Akka isheen jettutti, duraan
  hojii konistiraakishiniirratti hojii guyyaan jireenyashee gaggeeffataa turte. Hojiin
  kun keessattuu dubartootaaf hojii ulfaataa yommuu ta\u2019u; qarshiin argataa turtes
  gadaanaadha. Amma garuu abbaan qabeenyaa kun leenjii tajaajila hoteelaafi turizimii
  akka argatan erga taasisee booda riizoortii kana keessatti qarshii gaariin isaan
  mindeesse.\\nAbbaan qabeenyaa ilaalcha hawaasummaa qabu osoo baay\u2019atee rakkoon
  hoji dhabdummaa salphaatti furama. Dargaggoon humna misoomaa carraa argatu hundaan
  of kennee hojjechuun guddina biyyaa ariifachiisa jechuun carraa argatte kanatti
  gammaduushee ibsiteetti.\\nHaaluma walfakkaatuun dawwaannaa sochii invastimantii
  Magaalaa Shaggaritti taasifame keessaa inni tokko warshaa tiraansfoormarii omishu
  \u2018Advantage industry\u2019 jedhamudha. Industiriin kun hojii omisha daddabarsa
  humna ibsaa/tiraansformarii waggoota 13f hojjetaa ture. Yeroo ammaa kana Kutaa Magaalaa
  Gafarsaa Noonnootti tiraanisformarii omishaa kan jiru yommuu ta\u2019u; namoota
  266 olii carraa hojii uumeera.\\nIndustiriin kun tiraanfoormaroota dullooman deebisee
  haaressuu cinatti tiraansformaroota haaraa sadarkaasaanii eeggatan omishuurratti
  argama. Industirichi waggoota kudhanii asitti omishtummaasaa dabaluun ammaantana
  tiraanformarii dabalataa meeshaalee humna ibsaa dabarsuu keessatti hojiirra oolan
  garagaraa omishuurratti argama.\\nKanaan dura tiraansformariin sharafa alaatiin
  biyya alaa galaa ture rakkoon sharafa alaa akkuma jirutti ta\u2019ee qulqullina
  tiraansformaroota kanneenii meeshaan qoratu hinjiru ture. Amma garuu Humni Ibsaa
  Itoophiyaa meeshaa qulqullina tiraansformarii mirkaneessuu horachuu cinatti baasii
  sharafa alaa hanbisuuf tiraansformaroota sadarkaasaanii eeggatan biyyuma keessatti
  omishuun danda\u2019ameera.\\nItoophiyaan hidhaa haaromsaa dabalatee hanga humna
  ibsaashee olkaasuuf maddoota anniisaa garagaraa gabbisaa jirti. Injiinarummaa elektiriikiin
  barattootni dhaabbilee barnoota olaanaa garagaraarraa eebbifamaa jiranis industirii
  kana keessatti shaakala ba\u2019uun dabalata boodarras carraa mindeeffamanii hojjechuu
  akka argatan hubachuun danda\u2019ameera.\\nOdeeffannoon Industiricharraa argame
  akka ibsutti, hanga ammaatti Itoophiyaa keessa tiraansformaroota kuma 65 qofatu
