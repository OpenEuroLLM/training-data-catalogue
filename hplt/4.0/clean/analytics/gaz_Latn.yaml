sample: '["\"Anna Mae Yu Lamentillo, Kafaa''aa fi Hojii Ijoo Bara Dheeraa, NightOwlGPT,
  Gumiin Addunyaa Guyyaa Dargaggootaa 2024 kan biyya Kanada, Montr\u00e9al keessatti
  taasifame, akka tokkoo keessaa namoota shanan badhaasa ImpactAI Scholarship kan
  The BrandTech Group irraa argatanitti hirmaatte. Gumiin kun, Fulbaana 18 hanga 21
  bara 2024tti geggeeffame, hoggantoota dargaggootaa 190 ol biyya keessaa walitti
  fiduun, bu''aa hawaasummaa addunyaa irratti saffisiisuuf yaada fi tarsiimoo haaraa
  waliin qooddatan.\\nLamentillo, kan yeroo ammaa Karay-a, garee afaanii fi aadaa
  Philippines keessa jiraattu, NightOwlGPT, applikeeshinii dekstopii fi moobaayilii
  kan AI\u2019n tumsame, kan afaanota haalaan dandamachuu qaban eeguuf fi damee dijitaalaa
  keessattuu hawaasota gad-aantummaa keessa jiran giddu-galeessa gochuuf qophaa\u2019e,
  hogganaa dha. Afaanota hunda keessaa harka lama caalaan\u20143,045 keessaa 7,164\u2014dandamachuu
  qabu, fi hanga 95% kan gara dhabamuutti ce\u2019uuf sodaachisaa ta''anii jiru. NightOwlGPT,
  kan gocha kana irraa hojii fardii fi bu\u2019a qabeessa qaba, hojiiwwan afaanii
  fi aadaa kunuunsuuf gargaara. Marsariitii kun hiika yeroo dhugaa, beekumsa aadaa
  fi meeshaalee barnoota waliin hojjachuun, fayyadamtootaaf aadaa dijitaalaa keessa
  milkaa''inaaf carraaqqii gochuun humna ni kenna. Yeroo jalqabaa irratti, Phippines
  irratti xiyyeeffatame yoo ta\u2019u, karoora bal\u2019aa hojii tanaa addunyaa guutuu
  keessa, Aasiya, Afrikaa fi Latiin Ameerikaa irratti bal\u2019achuuf karoorfameera,
  ilaalcha gochuun haala walfakkaataa fi aadaa afaanii eeguuf.\\nSummitii fi karoora
  hojii ishee irratti yaada kennitee, Lamentillo akkana jette: \\\"Karay-a biyyoota
  afaanii fi aadaa tokko irraa kan dhufe, afaan keenya fi aadaa keenya tikfachuu barbaachisummaa
  isaa ani akkaataa keessa jiru nan beekadha. NightOwlGPT waliin, afaanota qofa hin
  tiksinu\u2014ummatoota gara fuuldura dijitaalaa hirmaachuuf dandeessisuu jirra.
  One Young World Summit immoo meeshaa fi network addunyaa nuuf kennee, kaayyoo keenya
  galmaan gahuuf.\\\"\\nWalqixxummaa irratti, Lamentillo wajjin barattoota ImpactAI
  afur biroo hirmaatanii turan, isaanis hojiiwwan bu''a qabeessa qaban qooda fudhatanii
  turan, kanneen hojii isaanii keessatti gareewwan isaanii hogganaa jiran:\\nJoshua
  Wintersgill, hundeeffama easyTravelseat.com fi ableMove UK, industirii xiyyaaraa
  kan namoota miidhamanaf saaxilamaa ta\u2019e akka ta\u2019u hawwiin qaba.\\nRebecca
  Daniel, Daarektara The Marine Diaries, hojiin dhaabbii isaatiin, kan barattoota
  keessatti hogganaman, gara dhaabbata alaa kan hawaasa waliin teeknoolojii wal qunnamti
  fi hojiiwwan bakka buusuu dhiyeessuu irratti xiyyeeffateetti jijjiire.\\nHikaru
  Hayakawa, Daarektara Giddugala Climate Cardinals, dhaabbata gurguddaa biyyoota 82
  keessatti hojjattoota fi gargaartoota kumaatamaan walitti dhufeenya qabu tokko kan
  ummata guddifachuu fi walitti dhufeenya gara hojiitti guddisu qaba.\\nHammed Kayode
  Alabi, hundeeffama fi Itti gaafatamaa CEO Skill2Rural Bootcamp, barnoota guutuu
  AI irratti hunda\u2019e kan dargaggoota fi imigranti gargaarsa hojii qabsiisuu irratti
  hojjata.\\nBarattoonni kunneen filatamanii jiru akkaataa isaan itti cimdii hawaasummaa
  fi naannoo gaarii uumuu keessatti mul''ata isaanii, akkasumas akkaataa isaan AI
  uumamaa hojii isaanii keessatti galchuu danda''an irratti.\\nWaggaa 2024 One Young
  World Global Summit xumuramee, Lamentillo fi barattoota waliin turan, One Young
  World Ambassador Community, kan leenjii fi hoggantoota 17,000 ol qaban walitti dhufeenya
  addunyaa keessatti hirmaatanii jiru. NightOwlGPT''n, Lamentillo tajaajila tekinoolojii
  AI fayyadamuudhaan qooda guddina jijjiiramaa fiduuf akkasumas hawaasa addunyaa irratti
  aadaa fi afaanota gargar baafaman eeguuf ciminaan hojjataa jira.\"", "\"Sambata,
  Caamsaa 11, 2013\\nOromoon Mootummaa Isaaf Dhaabbate Dhabaaf Biyya Ofii Irratti
  Salphifama\\nSirnootni Itoophiyaa dabareedhaan aangoo siyaasaa biyyattii dhaalan
  hundi yeroo itti Oromoof ciisan hin qaban. Oromoon guddina sabummaa, bal\u2019ina
  lafa isaa fi badhaadhina qabeenyaa isaaf jecha biyyuma isaa irratti sabatiinsa dhowwatama.
  Akka weennii gogaa isheef ajjeefamtuutti kan dhufaa dabru hundaan adamsama. Waan
  sirnoonni Itoophiyaa dabran Oromoo irraan gahaa turan seenaaf dhiifnee waan har\u2019a
  Oromoon sirna amma aangoo harkaa qabu jalatti ta\u2019aa jiru laaluun gahaa dha.\\nMootummaan
  Wayyaanee golgaa \u201cmootummaa federaalaawaa sabummaa irratti hundaawen diriirse\u201d
  jedhuun ummata Oromoo irratti kallattii maraan duula banuu fi bansiisuu imaammatee
  waggootii 22 darban kana hojjechaa jira. Sabootaa fi sablammoota waggoota baay\u2019eef
  ummata Oromoo waliin wal jaalalaa fi wal kabajaan jiraachaa bahan mara Oromoo irratti
  kakaasuu fi kallattii maraan rukuchiisuun akeeka Wayyaanee isa ol\u00e1anaa tahuun
  dalagaadhaan mirkanaayee jira. Eega sirni Wayyaanee aangoo siyaasaa biyyattii qabatee
  eegalee walitti bu\u2019iinsa sabootaa fi sablammoota gidduutti dhalatu kamuu keessatti
  maqaa Oromootu dhagahama. Oromoon olloota isaaf humna yaaddessaa fi cunqursaa tahee
  osoo hin taane Wayyaaneetu olloota Oromoo garii hidhachiisee Oromoo irratti bobbaasa.
  Kallattii maraan Oromoo irratti ibdidda qabsiisee qaammata.\\nKaraa Dhiha Oromiyaan
  dhalattoota sablammii Gumuz yeroo adda addaatti hidhachiisee jiraattota Oromoo hidhannoo
  dhabilee tahan irratti bobbaasee lubbuu dhibbootgaan fi qabeenyaa qarshii miliyoonotatti
  shallagamu barbadeesseera, barbadeessiseera. Har\u2019as kana irraa hin dhaabbanne.
  Gama Bahaan gosoota Soomaalii Isaa fi kan biroo yeroo dheeraaf hidhachiisee ummata
  Oromoo nagayaan qeyee isaa irra jiraatu irratti duulchisa. Lammii Oromoo ajjeesuu
  fi ajjeechisuu, daa\u2019imman Oromoo gudeeduu fi gudeedchisuu, qabeenyaa Oromoo
  saamuu fi saamsisuu, akkasumas, lafa Oromoo seenaadhaan beekamaa tahe irraa Oromoo
  buqqisanii alaabaa naannoo isaanii lafa oromoo irratti dhaabsisanii warra biraa
  qubsiisuun gochaalee duula farrummaa Wayyaanee warra gurguddaa dha. Karaa Kibba
  Oromiyaatiinis haalli jiru kanumaan wal fakkaata. Oromoon Booranaa dachii abbaa
  isaa irratti manni itti gubameera, loon isaa saamameera, sana biras dabree lafti
  isaa akaakilii fi abaabiliin irra jiraate roorroo alagootaan irraa fudhatamee warra
  kaaniif kennameera. Oromoon Gujiis akkasuma, jiruu hadhaawaa kana fakkaatuun marfamee
  qaama itti iyyatu wallaalee hiraaraa jira. Kibba Oromiyaa keessatti golgaa \u2018walitti
  bu\u2019iinsa marga dheedichaa fi eela bishaanii irratti dhalate\u2019 jedhuun Wayyaaneen
  tahe jedhee sablammoota olla hidhachiisuu fi gorsaan dogoggorsee obboleeyyan isaanii
  Oromoo irratti kakaasaa yoona gahe. Walitti bu\u2019iinsa kanaan lubbuun namaa waggoota
  digdamman dabran keessatti bade kumaan shallagama. Kutaalee Oromiyaa hafan keessattis
  taanaan Oromoon nagaa fi tasgabbiidhaan jiraachuu hin dandeenye.\\nMootummaan Wayyaanee
  sababa tahe jedhee Oromoo irratti diinota daneessuuf hojjetuuf qaba. Yaaddoon isaa
  guddaan guddina Oromiyaa fi Oromooti. Kanaafuu akka Oromoon wal utubee wayyabummaa
  isaa gara humnaatti jijjiiree biyya isaa Oromiyaa irratti abbaa hin taane gochuuf
  kaabaa kibbaan, bahaa dhihaan ibidda itti qabsiisee tasgabbii dhowwata. Yoo Oromoon
  humna tahe qabeenyaa Oromiyaa halkanii fi guyyaa walitti dhaabee saamaa jirutu jalaa
  hafa. Yoo Oromoon humna tahe aangoo siyaasaa Itoophiyaa qabatee jiru irraa darbatamee
  diigama sirna isaatu taha. Yoo Oromoon humna tahe sadoo fi qananii baratetu itti
  hafa. Yoo Oromoon humna tahe sabaa fi sablammoonni biroonis Oromoo waliin tumsa
  jaarrachuudhaan biyya ofii irratti abbaa tahanii weerartummaa Wayyaanee waloon of
  irraa qolatu. Kanaaf jecha Wayyaaneen Oromoo diina innikkaa godhatee waraana isaa
  itti bobbaasee hanga danda\u2019e rukuta, hanga harki isaa dhaqqabuu hanqate ammoo
  sablammoota olla hidhachiisee irratti kakaasee rukuchiisa.\\nKeessumattuu wanni
  yeroo ammaa Baha Oromiyaa keessatti mul\u2019ataa jiru garuu garmalee daangaa dabree
  balaa guddaa dorrobee akka jiru hunda birattuu hubatamuu qaba. Sirni Wayyaanee tahe
  jedhee humna \u201cLiyyuu Poolis\u201d jedhee naannoo Ogadeniif leenjisa adddaa
  kenneefii meeshaa gurguddaa hidhachiiseetti dhimma bahuunii fi gosoota Sooamalii
  qixa saniin Oromoo daangessan hidhachiisee Oromoo qehee isaa irratti goolaa jira.
  Qubsuma isaa irraas buqqisee dirree irratti facaasaa jira. Wayyaaneen dheebuu biyya
  Oromoo weeraruuf waggoota kurnoota dura Soomaaliyaa irraa dhagahameen haala wal
  fakkaatuun dachii Baha Oromiyaa Oromoo harkaa baasuuf duulee duulchisaa jira. Gosoota
  Soomaalii keessaa kanneen salphaatti isaan dogoggorfamanii fi hawwiin \u2018Somalee
  Guddiitti\u2019 sammuu keessaa baduu dide hidhachiisee dhalaa fi ijoollee dabalatee
  ummata dhibbootaan ajjeesuu, qehee Oromoo gubuu, qabeenya Oromoo saamuu, lafa Oromoo
  dhaaluu irratti gorsaa fi hidhanoo waraaniitiin jajjabeessaa jira. Ummanni Oromoo
  gama Bahaa daba hamtuu isa irratti raaw\u2019atamaa jirtu kanaan imimmaan fixatee
  dhiiga booyaa jira. Booyichi kunis hammeenyi isaa adda tahu illee kan kutaa Oromoo
  tokko qofaa osoo hin taane kan guutuu saba Oromoo ti. Baha Oromiyaa keessatti roorroon
  kana fakkaatu kun qindeessitummaa, hidhachiistummaa fi gorsitummaa waraana Wayyaaneetiin
  eega jalqabamee osoo wal irraa hin citin walakkaa waggaa dabree jira.\\nOromoon
  humna qawwee hidhateen qehee isaa irraa booqqifamu kun qaama mootummaa itti iyyatu
  hin qabu. Mootummichatu mootummaa isa irra dhaabbate malee mootummaa isaaf dhaabbatee
  miti waan taheef mootummaa diinaatti iyyata isaa dhaggeessifatee milkaayuus hin
  danda\u2019u. Furmaanni isaaf dhihaate qehee fi lafa isaa bal\u2019aa akaakilii
  fi abaabiliin irra jiraate weerartootaaf gadhiisee baqachuu, yookiis harka duwwee
  tahee afaan qawwee dura dhaabbachuun du\u2019uu qofa tahe. Har\u2019a Itoophiyaa
  keessatti saboonni hunduu bittaa sirna gabrummaa Wayyaanee jala akka jiran kan hin
  haalamne tahu illee, akka Oromootti kan dachiin isaa jaannama biyya lafaa itti taate
  jira jechuuf nama rakkisa. Kanaaf egaa, rakkoon siyaasaa Oromoon keessa jiru rakkoo
  biyyattii keessatti mul\u2019atu kamiinuu caalaa hadhaawaa fi furmaata addaa kan
  barbaadu tahuun kan irra deddeebi\u2019amee dubbatamuuf.\\nNamoonni shiraa fi hammeenya
  gadi fagoo Wayyaaneen Oromoof qabu kana hubachuu hin danda\u2019in tokko tokko OPDO
  komachuu malu. OPDOn qaama mootummaa kanaa tahee akkamitti ummata Oromoo irratti
  miidhaan kana fakkaatu yoo dalagamu callisee laala jedhanii gaafachuu malu. Deebiin
  gaaffii fayyaalummaa akkasii kanaaf kennamus salphaa fi ifaa dha. Ilmaan Oromoo
  sabboonoo OPDO keesssa jiran mirga Oromoof falmanii roorroo Oromoo irraa deebisuun
  haa turuutii ofiifuu roorrifamoo dha. Kanneen Oromoo hin taane ammoo kayyoo fi akeekaanuu
  sirna sana waliin kan wal qabatanii maqaa Oromoo golgaa godhatanii Oromoo dhiigsaa
  jiranii dha. Kaayyoon OPDOn jaarameefis Oromoo irraa roorroo akka ittisutti osoo
  hin taane Oromoo irratti umrii roorroo dheeressuu dha. Alagoota Afaan Oromoo dubbataniin
  kan taliigamu OPDOn yeroo Oromoon rukutamu ulee, yoo Oromoon waraanamu eeboo, yoo
  Oromoon rashanamu rasaasa, yoo qeheen Oromoo gubamu ibidda taheefii diina tajaajiluu
  malee gootummaa afaanumaan illee tahu ittiin Oromoof falman qabaatee hin beeku.
  Sabboontonni Oromoo OPDO keessatti fayyaalummaan hiriiran tokko tokko dubbii kanaan
  gubatanii waa gochuufis aangoo waan harkaa hin qabneef jecha callisa filachuu dirqamu.
  Kun garuu imimmaan Oromoo hin haqu, madaa Oromoos hin dhiinsu. Yakka mootummaan
  kun Oromoo irratti raaw\u2019ataa jiru kana argaa callisuudhaan kanneen qaama mootummichaa
  tahanii Oromummaa himatan boru itti gaafatamuuf taa\u2019u.\\nOromoof furmaanni
  tokkichi jiru bakka jirutti gurmaawee roorroo fokkataa kana fakkaatu irraa karaa
  danda\u2019ame hundaan of ittisuu qofa. Roorroo manatti namatti dhufe jalatti jilbiinfatanii
  callisuun daranuu diinota nama irratti goobsa malee garaa namaaf hin laaffisu. Sabni
  Oromoo kaabas tahee kibba, bahas tahee dhiha, yookiis giddu galeessa, ganda jiru
  mara keessatti humna hidhatee itti dhufee nageenya isaa booressu, qabeenya isaa
  saamu, qehee irraa isa buqqisu iyyee iyya dabarsuun walitti dirmatee of irraa deebisuu
  qaba. Wareegamni kafalamu qaalii fi rifaasisaa tahuu ni mala. Kabajaa sabummaa bortaadhaan
  sarbamu bortaadhaan deebisuun hanga dirqama tahetti ammoo wareegamni kafalamu gatii
  malee hin hafu. Oromoon qehee isaa irratti of ittisuuf jecha waan humni isaa eehame
  kamuu hidhatee WBO cinaa goruun lolee of kabajsiisuun dirqama seenaa taheera. Ummanni
  Oromoo mallattoo nagayaa fi dimokraasii tahuun olloota isaa maraaf fakkeenya tahee
  jiraate. Sirni Wayyaanee sirnoota amma dura dabran kamuu caalaa Oromoo diina innikkaa
  godhatee karaa maraan lola itti banee seenaa gaarii Oromoon qabu kana jijjiiruuf
  akka hojjetaa jiru beekamaa dha. Yakka kanaaf ammoo guyyaa tokko seeratti dhihaatee
  gaafatamuun isaa akka hin oolle dagatamuu hin qabu.\\nSabaa fi sablammoonni ollaa
  Oromiyaas tahee kanneen Oromiyaa keessaa qubsuma qaban, akkasumas, namtokkeeleen
  dhimma adda addaaf Oromiyaa keessa qubatanii ummata Oromoo waliin jiraatan dubbii
  fardii takka hubachuu qabani. Har\u2019a dantaa yeroof jecha Wayyaanee caalchifatanii
  Oromoo irratti diinomuun egeree isaanii miidhuu irraa kan hafe wabii jireenya bara
  baraa tahuufiif hin jiru. Michoomni siyaasaa Wayyaanee waliin tolfachuu barbaadan
  boru nidabra. Ollummaan Oromoo ammoo jaalatamus jibbamus bara baraan jiraata. Wayyaaneen
  gaafa dantaan isaa kan yeroodhaa guutamteef galagalee akka isaan hin laalle, inumaa
  dantaa itti aanuuf jecha boru isaanumayyuu deebisee diinomfachuun akka hin oolle
  dursanii beekuu qabani. Miidhaan har\u2019a Oromoo irra gahaa jiru boru dabaree
  isaa eegee balbala isaanii rurrukutuun waan hin oolle. Wayyaaneen diina waloo waan
  taheef har\u2019a tokkotti firoomee isa kaan rukutuu, boru ammoo kan kaleessa diinomfatetti
  firoomee kan duraan firoomfataa ture diinomfachuu irraa duubatti hin jedhu.\\nKanaafuu
  dhalattoonni sabootaa fi sablammootaa Oromoo waliin ollummaa fi hariiroo gaarii
  bara dheeraa qabaachaa turan Wayyaaneedhaan dogoggorfamanii Oromoo irratti badii
  raaw\u2019achuu irraa jabeessanii akka of qusatan dhaamnaaf. Kan nu baasu ummatoonni
  cunqurfamoon madaa wal fakkaataa qabnu wal tumsinee diina waloo irratti duuluu dha
  malee gariin diina waliin dhaabbatee ollaa isaa irratti roorrisuu miti. Sirni Wayyaanee
  har\u2019a abbaa baraa tahee waan hundumaa qawween toyatu kun oolee bula malee jiguun
  isaa waan hin hafne. Gaafas jaalatanis jibbanis Oromootu isaan waliin hafa. Yakka
  sirna Wayyaaneef tumsamee Oromoo irratti raaw\u2019atamu kamiifuu itti gaaftamuunis
  akka hin oolle yaadachiisuu feena.\\nUmmanni Oromoos akka har\u2019a hidhannoo dhabilee
  tahe kanatti itti roorrifamaa bara baraan hin jiraatu. Gurmaawee hidhatee biyya
  isaa irratti abbaa tahuudhaan roorristoota qehee isaatti itti dhufan of irraa adabuun
  isaa gonkumaa waan hin oolle. Gaafas gaaffii seenaan dhiheessuuf deebii kennuun
  qooda abbaa ti!\\nInjifannoo Ummata Oromoof!\\nInfoo Deeskii ABO\\nCaamsaa 11, 2013\\nGalatooma
  gumaa obbolota kenya hin hafu.\"", "\"Ummati Oromoo ummatoota Afrikaa lakkoofsaan
  olhaanan (kumkuma 30 ol) afur keessa tokko. Jaarraa kudha sagalaffaa keesa ummatooti
  Afrikaa hundi kolonoomani alaabaa halagaa jalatt kufanii. Oromiyaan innas kan qabamte,
  alaabaa magariisa, keelloo fi diimaa mootummaa ollaa see, keettoo halagaa gabra
  gama tahe, Absiniyaa jalatt kan kufte. Roorron itt raawwatame hundi alaabaa kana
  qabatamee waan taheef hanga inni irraa buqa\u2019utt nageenyi hin jiru. Kanneen
  gabra gamaa dhufaniin kan Habasha adda godhu biyyaan ollaa fi bifaan gurraacha tahuu
  dha. Kan tokko isa godhu meeshaa, gargaarsa fi ogummaa biyyoota Impriyalistootaa
  Awuropaa fi Rusiyaa dhufe isaaniin walgitu qabaachuu dha. Kan bira miseensa hidhata
  biyyoota Gaanfa Afrikaa qircachuuf waliigalani tahuu fi sararaa dangaa isaan gidduu
  bu\u2019ee irratt waliigaluu dha. Daftarooti Itophiyaa dhugaa kana gara dabarsuuf
  seenaa jajallisuu yaalaniyyuu yeroof malee hin milkoofne. Amma, gaaffiin gaaffii
  seenaa mitii; garuu eenyutu hardha mirga dabaan jalaa saamame akka deebi\u2019uuf
  gaafataa jiraa kan jedhu? Oromiyaan jaarraa ol qabama jala jiraachuun ifaa dha.
  Garuu akka si\u2019anaa Seerri Waaraanaa utuu hin labsamin suduudaan loltuu qofan
  hin bullee. Noolli itt akeekaa EPRDF (OPDOn) biyyicha ni bulchina jedhaa bahan fakkeessuun
  saaniiyyuu raawwatee jira.\\nQabama Oromiyaa fi jabina empayera Itophiyaa keessatt
  abba tokkooti Oromoo qooda guddaa gumaachanii jiru. Kun waan haaraa miti, duula
  Impriyaalistootaa hedduu keessatt ummati koloneeffame kan waraana koloneeffatoof
  humna hin gumaachine hin jiru. Humnooti Walii Tumsan, Xaaliyaanii Itophiyaa gad
  dhiisisuuf loltoota Sudaanii fi Koongoo Beeljigitt dhimma bahuun ni yaadatama. Akkasumas,
  Xaaliyaan empayer Itophiyaa qabachuu loltoota Libiyaa, Eertraa fi Somaleett dhimma
  bahuun seenaa kaleessaati. Abba tokkooti kun ummata ofii bakka bu\u2019anii utuu
  hin tahin kaan dirqiin kan qaxaramanii itt galan. Akkasitt namooti Oromoo marsamanii
  lolatt oofamuun kan duulota koloneeffataa isaan hin laalle Oromiyaa, Ogaaden, Tigrayii,
  fi Eertraa irratt qooda fudhatan malee, Itophiyaa yk du\u2019a jedhanii miti. Naannaa
  barreesaan kun itt dhalatee duula Maayicawuuf yoo xinnaatt manni tokko nama tokko
  abbaa duulaa koleefataa jalatt dhiichun itt buufamee ture. Jannummaa saanii diinaafis
  firaafis duula hunda irratt ragaasisanu, akka sabaatt garuu onnee dhabuun utuu hin
  tahin qophee dhabuun kufuun irra gahe.\\nOromoon akka ummataatt takkaa fedhanii
  Itophiyaa jala hin jiraanne. Akka sabaatt seenaa, afaan, daangaa biyyaa fi aadaan
  isaanirraa adda. Lakkoofsaanis waan isaanii ol turaniif, jaalalaan yartuuf jilbeenfatan
  jechuun waan hin fakkaanne. Hanga hardhaa qawwen qabamanii jirachuun ifaa dha. Hayyooti
  gorsitoota mootummaa Habashaa tahan badiisi Oromoo irra gahe dhokatee akka hafu
  barbaaduu. Mootiin Habashaa, Oromoo, harka ciree mormatt rarraasuu, hallayyaatt
  hoomaan darbachuu; arraba cireee akka hin azanne gochuu; harka muree harma muree
  muka kara darbaan laalutt rarraasuu; fixiisa waliigala akka Calanqoo, Sibuu fi Buunnoo
  raawwachuu kkf akka dhokatee hafu barbaaduu. Kun akka Oromoon hin irraanfane ummati
  Habashaa mootummoota sana dhaalan, akkasumas hayyooti dhossuu barbaadan beekuu qabu.
  Biyyoota qawween walitt qaban irraa biyya eenyummaa kanneen qabamanii haqe, kan
  saanii fudhatu uumuu hawwu turan; hin milkoofne. Yakki kun al tokkoon hin dhaabbanee
  hanga hardhaatt ittuma jira. Oromoon akka sabaatt yeroo carraa argatu seenaa ofii
  ofiin barreeffata malee beekota koloneeffataa nuu barreessu jedhee hin eegu. Goototi
  Oromiyaa dabaan dhuman hunda akka roorroo fi roorrisaan hin irraanfatamne siidaan
  yaadannoo itt fufa.\\nUmmati Oromoo bilisummaa saa gaafachuutt erga ka\u2019ee fagoo
  dha. Akkuma ummata kolonomanii turan biraa hiree sabummaa ofii ofiin murteeffachuu
  fedha. Gaaffin saa kun hanga deebii tolaa argatutt godinichi nagaa hin argatu. Anga\u2019ooti,
  hunda walitt qabanii, dhiibbaa fedha saaniif tahu gochuuf mijjaawu saa malee, miiddhaa
  ummatootaaf dantaa hin agarsiifne. Bulchooti Afriikaa gaaffi sabummaa fi gosummaa
  of keessaa qaban furuu dhimma hi godhatan. Bulchaaf ummata ofii utuu hin tahin anga\u2019oo
  addunyaa irratt hirkatu. Mootummooti Afrikaa kun waldaa tokkummaa ummatanii jiru.
  Caalaan saanii ofangessoo waan tahaniif michoota. Dhaalmaa koloneeffataa durii kabajuuf
  walii galaniiru. Afaanumallee kan ofii guddisuurra kan koloneeffataa duriitt dhimma
  bahu. Isaan keessaa Itophiyaa qofti koloneeffataa waan taheef afaan ofiin hojjeta.
  Kolonoti saas afaan saa qofa akka baratanii fi ittiin hojjetan godhaa bahe. Mirga
  afaan ofiitiin hojjechuu fi barachuu qabsoon argame akkuma biyyoota Afrikaa kana
  kolonooti dhimma itt bahuu hin barbaanne jiru. Rakkina jiruf, furmaati hoggansa
  Afrikaa si\u2019ana irraa hin eegamu.\\nAfrikaan daka, ummata irraa ka\u2019ee ol
  ijaaramu malee bilisoomuu hin dandahu. Hanga yoonaa erga walaboomte jedhamellee,
  fakmishoo koloneeffataa faana bu\u2019ee aangoon olii gad itt ciipha\u2019ama. Itophiyaan
  yoomuu of angessaa waan taheef kolonota hafee ummati ofiiyyuu angoo hirmachuu hin
  eeggatu. Ummatooti Africa utuu moo\u2019umsa keessatt qooda fudhatanii fedha ummataa
  irratt hundaawanii bu\u2019uura hin sossone Tokkummaa Afrikaa egereef uumuu dandahu.
  Oromiyaan miseensa tokkummaa akkasii tahuuf daaya qabdii. Garuu sammuu yeroo dheeraaf
  hacuuccaa jala ture bilisoomsuuf barbaachisummaan sochii warraaqaa ni qayyabatti.
  Kan jijjiirama warraaqaa fiduu dandahu sammuu bilisoome qofa malee ayyaanlaallatuu
  daddaaqxuu fi baqattuu miti. Jara akkasiiti kan diinatt riqatanii fi nafii saa leellisan;
  akka qabsaawota Oromoo tokko tokkoo kan kufaatii irraa oolchuuf birmataniif. Bajoojanii
  hafu malee hin milkaawani.\\nUmmati Habashaa takaa akka fedha ofiin jiraatee hin
  beeku. Mootummaan saa kan humnaan dhufee humnaan bu\u2019u. Gita bulchituuf waloo
  kan turan Galmistana Ortodoxii fi gonfoo \u201cZawud\u201d jedhanii. Kanneeniif
  hoodoti biyyatii alatt uumaman jiru. Hundeen Galmistanichaa Kopt Masiri. Hamma bara
  Mootii Moototaa, Hayila Sillaaseett Abbaan saa (Pariyark) achii ergamaaf ture. Akka
  seera tureett lafti Habashaa sadii keessaa tokko isa jala jira. Mootichis isaan
  dibamee Zawud kee\u2019ata. Kanaaf angoo ayyaanawaa fi lafa kanaa, halagaan muudamu
  jechuu dha. Mootichis qacee saa Mootii Solomoon Yihudaatt hidhata ture. Ummatichi
  dhaabota hundee halagaa himatan kana fudhachuu malee filmaata hin qabu. Fedha waaqaan
  sun tahe waan jedhameef sana mamuun aangoo Waaqaa mamuu taha. Yeroo yeroon abba
  tokkooti ni fincilu, yoo mo\u2019atan isaanis muudamanii madduma halagaa sana fi
  fedha Waaq dhahatu malee ummata keessaa bahan hin himatan. Sanaan ummaticha hadoochanii
  of jalatt hambisu.\\nAkkasitt gurguddoon Habashaa ummata ofii irraa adda of tolchee
  hacuucaa jiraate. Hololli dhaloota dhalootatt walirraa hin citne sammuu ummataa
  akka barumsi kamiyyuu keessaa hin baafnett dhiqaa ture. Ummatichi haala bilisa qaabannoo
  ofii keessaa hin qabu. Kan aangoo irra bahe hundaaf damboobinaan buluu dha. Rakkinni
  gurguddoon Habashaa si\u2019ana qaban kanuma. Seenaa hololaan uumame duukaa bu\u2019anii
  dhugaa ilaaluu dadhabaa jiru. Rakkinni jiraachuu beekanuu furmaata saa, of keessaa
  ol baasani ilaaluu fedu.Erga bulchi Nugusaa sokkeeyyuu rakkinni gurguddoo Habashaa
  sana. Keesaa kanneen barumsa dudhaa waabarii amanteett fixatan, hammam barumsa ammayya
  ofitt naqanuu, soba ijoollummaan waabarichatt itt hudumame of keessaa baasuu hin
  dandeenye. Akkuma si\u2019a duriitt yaaduun seenaa sobaa hololaaf uumamee irra deddeebi\u2019aa
  jiraatu.\\nOlhantummaa sobaan afuufame kanaan ummata erga of jala galchanii waggaa
  dhibaa ol hin taane eenyummaa saa dagachiisuu fedhu. Isaan beekaa, inni wallaalaatt
  waan fudhataniif, lakkofsa saa wayittuu hin galchine. \u201cHabashaan tokko kumashee
  oofa\u201d jedhanii of saadu.Isaan utuu hin tahin qawween akka oofaa jiru hin hubanne.
  Qooqa \u201connee/wannee jedhu Oromoo irraa akka dhagahan hin beekanii. Ummati Oromoo
  dandahaa dha. Tarkaanfiin fudhatu hobbaatii saa erga hede duuba. Hamma jireenyi
  saa du\u2019a irraa hiiquu tahett gidira hunda dandahee hamajaajiin of geeddaruu
  akka dandahutt carraa kennaafii. Garuu hamajaajiin of jijjiiruu dhiisee cunqursaa
  fi tuffii irr fufe. Sun jireenya saa dorsifnaan sochii malalchiisaa gochuuf dirqame.
  Karaa nagaa fi araaraa buusuuu erga fixachiisee booda sosso\u2019uun murannoo fi
  dudhama isaan abjootanii hin beekne itt agarsiise. Sana booda kan isaan of jibbaama
  Oromoon dhugaa qaba jechuuf kan eegalan. Oromoon \u201cdhiphoo fi fottoqsituu\u201d
  tahuuf himatamaa ture. Amma garuu isaanumatu \u201cnan fottoqa hin jenne\u201d jedhanii
  dubbataafii jiru. Arrabsoon baasuu didnaan saaduun moo\u2019achuu yaala jiru. Garuu,
  hanga yoonaa \u201cOromoon \u201cMaal barbaadda?\u201d hin jedhamnee. Hin barbaachisus,
  Oromoon qabsoo ilmaan Oromoo itt dhumaa jiran Itopheessuun, isaan caalaa Oromo salphisuuf
  bobba\u2019an waan jiraniif taha.\\nUmmati Oromoo walitt qabaa ummatoota yaroo empayerichaa
  caalaa guddaadha. Empayera keessa akka afaan saddeettamaatu dubbatama jedhamaa.
  Hedduun lammoota afaanota kana dubbatanii kanneen lakkofsi saanii kumoota keessa
  jiru. Erga koloneeffataan walakkaa caalaa ajjeesuu fi garboomsuun fixee as guddachuu
  hin dandeenyee. Caalaatt dhiibamaa fi akka barumsa hin arganne godhamaa waan jiraatanif
  sadarkaan jireenya saanii isa qabama dura jiru irraa gad adeeme. Si\u2019ana bu\u2019uura
  jireenya saanii kan tahe bosonni saanii ciramaa fi lafti saanii dureessotatt gurguramaaqonnaa
  shonkooraa fi biqiltuu adda addaa lafa gad dhiisaa jiru. Hojii sanaan uumamuutt
  hojjetaa Tigrayitu durfannoo qaba. Laggeen isaan qurxummii baafachuu, jallisiin
  qotachuu fi waan adda addaaf dhimma itt bahan humna elektrikaaf hidhamaa, haddhaa
  adda addaan faalamaa jiru. Isaan lafa saanii irraa buqqifamanii bakka jireenyaaf
  hin tollett ari\u2019amuun hamaa caalaan irraa gahaa jira. Akka lammileett badiisi
  itt dorsisaanii jira. Eegumsaa fi gargaarsa olloota gurguddaa fi addunyaa haala
  itt barbaachisurra jiru. Kana malee mootummaan amma jiru da\u2019oott ukkaamsee
  fixuuf adeema.\\nOromiyaan kolonota keessaa isa guddichaa. Koloneeffataaf qabeenya
  uumaa, homisham fi humna namaa heddumminaan kan dhiheessus isaa. Kan koloneeffataan
  ummatoota naannaa, kan ofii utuu hin hafin ittiin rukutus heddumminaa humna namaa
  isa keessaa fudhatuuni, fakkeenyaaf OPDO. Kanaaf Oromiyaan walaba hin taane mootummaan
  Habashaa ulee ittiin nama dorsisu heddumminaan kan keessaa muratu. Yeroo ammaa koloneeffataan
  Oromiyaas balleessaa kan jiru jaruma akkasiinii. Oromoon aadaa demokraatawaa dhaalmaan
  darbeef qaba. Dudhaa hacuuccaas hin qabu; akka kanneen humna hin qabnett hin cobne
  seera safuu jedhamu qaba. Isaan bilisa bahuun ulee abbaa hirrootaa tahu hambisee
  moora kanneen bilisummaa fi walqixxummaa leellisanii dagaagsaa.\\nKanaaf bilisummaan
  Oromiyaa ummata hundaaf, ummata koloneeffataa dabalatee, bilisa bahuu taha. Oromoon
  madaala uumaa eeguutt amanu. Nama hafee margoo fi binoon munyuuqanillee kaasaa malee
  akka hin tuqamne seera qabu. Kanaaf lammilee bucun badiisa irraa baraaramanii, mirgi
  ilmaan namaa kabajameefii, lafa akaakilee irraa darbaafii dhufe irratt abbaa biyyumaa
  akka mirkaneeffatan Oromoo caalaa gargaaruu kan dandahu hin jiru. Ofiis rakkina
  walfakaataa qaba. Oromoon olloota saa hundaa akka namaatt malee akka faayaatt hin
  laalu. Daaya walgargaaranii hamma humnaa gumaachuun naannaa saanii misoomsanii nagaa
  fi gammachuun waliin jiraatu kan jedhu qaba.\\nBarreessan kun akka waan Oromoo bakka
  bu\u2019uutt kan dubbatuuf ayyaana Gadaa demokraasii fi walabummaatt waan amanuuf;
  waa\u2019ee jara akka saa amananiitt malee waa\u2019ee sigabaa fi jaalalloota koloneeffataa
  miti. Kallachi sochii bilisummaa Oromo ABOn daaya saanii kana sagantaa malbulchaa
  bara 1976 fi 1998 foyyessee baasee irratt ifa godhee jira. Kaayyoon ABOn hordofu
  kaayyoo ofiin bula biyyattii fi bilisummaa ummatichaati. ABOn kan qabsaawu Oromiyaa
  walaba argamsiisee Demokraatic Republik Oromiyaa bu\u2019uursuuf. Kanaaf hiree sabummaa
  ofii ofiin murteeffachuu seera addunyaan beekame deggera. Hiree ofi kan murteeffatu
  ummata Oromooti malee eenyuu, ABOn dabalamee hin murteessaniifii. ABOn akka gogeessa
  tokkoott waan itt amanu ummataa dhiheessa malee murteessuufiif mirgas seeras qaba
  hin jedhu.Ummatichi kana waan amanuuf ABO dhaa deggersa qusii hin qabne kenneefii.
  Hogggansi miccciramuu fi kayyoo irraa cehuu ni dandaha. Waa\u2019ee amantee fi jaalala
  ummataa yoo dubbannu waa\u2019ee kaayyoo gootota itt dhumanii ganama jechuuf keenyaa.
  Hoggansi ABO fudhatama kan qabaatu hanga karaa sana irraa hin maqnettii. Kaayyoo
  ummaticha kan irraa fudhatu yk gara dhabsiisu dandahu hin jiru.\\nHogganooti sabaa
  ejjennoo saanii qaammi sadaffaan ifatt akka beekuu gochuu qabu. Sanaaf kumooti wareegama
  guddaa baasaa akka jiran irraanfatamuu hin qabu. Eenyu ejjennoo akkasii hin jaallatu
  taha jedhee mamii agarsiisuun amanamummaa nama dhabsiisa.Tokkoffaa akeeka qabaachuu
  dha. Akeekichi waan fedhu itt baasuuf murteefachuu barbaachisa. lammaffaa kan akeeka
  qabu ija sodaatee hin daddaaqu. Hamma dhumaatt kan akeekkate bakkaan gahuuf tattaafachuu
  qaba. Akka waan humnooti anga\u2019oon akeeka namaa tolchaniitt kana hin jallatan,
  sana hin jaallatan kan jedhan jiru. Anga\u2019ooti akkeka namaa hin tolchan; gaaruu
  akeeki eenyuuyyuu fedha saanii yoo doomsu hin jallatani. Kanaaf hanga waan namaatt
  hin dabarrett kan sodaatamu hin jiru. Kan saaniis fedha kan ummata biraas fedha.
  Akka tokko isa kaanitt anjaa madala hin qabne hin fudhanne waliin haasa\u2019anii
  furachuu dha. Sabi Oromoo saba seenaa dheeraa kan Masir duriitt ejju akka qabu beekamaa
  dha. Jalee eenuyyuu miti. Kanaaf akka itt jiraatu ofiin murteeffata malee halagaan
  murteessaaf taanaan waan of se\u2019u miti jechuuf dha. Akka of fudhatutt walabummaan
  yk kan wal fedhan waliin bulcha tokko jalatt haa tahu akka ollaa dansatt jiraachuun
  mirga saa uumamati. Kun akeeka wareegamaniif malee kan ija laafanii gaddhiisan miti.\\nNaannaa
  jaarraa tokkoof walakkaa, Oromiyaa irratt empayeratu ijaarame. Empayericha kan ijaarrataan
  mirga akka ilmoo namaatt ummati Oromo qabuu fi qabeenya saa mulqaniitu. Biyyis nammis
  qabeenya akka fedhan itt ajajan tahe. Kanaaf caasaa too\u2019annoo sana calaqisutu
  ijaarame. Ummatichas holola hadoochaa fi of wallaalchisaatu waggootii sana hundaaf
  irratt gaggeeffame. Kanaaf qabsaawoti sochii ittisaa jalqaban keessaallee kan sammuu
  bilisoomfachuu dadhaban ni mullatu. Oromiyaa haajjisa, empayera du\u2019aaf dhidhiitatutt
  qalanii fayyisuuf tattaafataa jiru. Dargaggoon Oromiyaa akka isaan hin milkoofne
  gufuu itt taateettii. Gocha dargaggoo kana jara Habashaa caalaa \u201cbiyya keenya
  Itophiyaa \u201c balleessuu dandaha jedhanii yaaddoo saanii akka isa \u201cPapa
  caalaa Kaatolika\u201d jedhanii gaddaan ifsatu. Akka waan ergaa warabame liqimsanii
  qabsaawota Oromo farsaa bakka sagaleen saanii gahuu hin dandeenye akka gahaniif
  irbuu seenan. Dhugaan saa \u201cJara sagaleenu isin bira gahuu hin qabne kara isin
  gahan yaala\u201d jechuuf saaniiti. Hariiroo dhiheenya tolfataa jiranii fi imaammata
  labsatan irraa yoo qabsoon Oromoo burkutawe Empayerri Itophiyaa baraarame xinnoomallee
  kan garaan nahu hin fakkaatu. Waaqayyoo isaaniif haa dhiisu.\\nUmmati Habashaa haala
  bilisummaa qaabannoo isaa keessaa hin qabu jenneeraa. Bulchooti saa kumaaleef Waaqaa
  gaditt nutu sii beeka jedhaanii dhufan. Kanaaf si\u2019ana yeroo ollaan saa, Oromiyaan
  mirgaaf falmachuun mootummicha hundee raasaa jiru of bilisoomsuuf ka\u2019uun itt
  hin mullanee. Kanneen mootummicha bakka bu\u2019uu fedhan qofatu waca. Amaarrii
  fi Qimant walitt buunaan afarsuu yaalanii hin taaneef. Ummata Walqayitt kaasaa taha
  jedhanii abdatanuu Amaara biraa, Saayinti, Manzee, Goojjam kkf irraa tumsi hin kaane.
  Oromiyaanis qabeenya keenya jedhanii duula hin kaafne. Gurguddoon bakka hin hooqsifne
  hooquufii barbaadan malee inni kan qabu fudhateera. Oromoon Raayyaa hanga Booranaatt,
  Begiitti hanga,Jaarsoo bahatt mee Buraayyu keenya, Sabbata keenya, Cillimoo keenya
  tuqaa jedhee akka kannisi gaagurri see jeeqameett ka\u2019ee huurse. Sun miiddhaa
  hanga yoonaa irra diriirfatee jiru yeroo dhumaaf ofirraa fonqolaachisuuf kaasaa
  waliin ka\u2019ee dhiichu tahef. Si\u2019ach hanga walabummatt maqi biraa hin jiraatu.\\nMootummaa
  maqaa saaniin aangoo irra jiru qabaachuun ummata Habashaa cunqurfamaa jedhamu calisiise.
  Akkuma durii shiftaa isuma keessaa bahee finqilchuun eeggata. Rakkinni fi ilaalchi
  addunyaaf qaban Oromoo fi kan saanii, adda adda tahuu agarsiise. Tokko hudduu qullaa
  olhantummaan kan itt dhagahamu, inni kaan cunqursaan halagaa kan harka harka itt
  jedheen tahuutu mullate. Silaa qabsoon Oromoo gadadoo waggootaa fi ayyaanfennaa
  abbaa hirrootaa jalaa bilisoomuuf carraa guddaa ture. Gurgudoon saanii Tedros, Yohannis,
  Minilik, Adaalii fi Tafariin boonaa jedhu. Jarri kun kan ummata walitt qabanii abidaan
  guban harka harma fi arraba irraa ciran turani. Inni amma jiru ummatoota akka qaceen
  saanii lafatt hin hafne kan haxaawaa jiru. Jara darban akka goototaatt ilaalu taanaan
  isa kana waan hamaatt ilaalaniif hin qabani. Yoo jara duraatt gaabban isa kanaan
  mormu. Oromoof hundi saanii diina nama nyaatota. Kanneen durii balaaleffataa isa
  amma ofirraa kaasuuf kan barbaachisu hunda itt baasaa jira. Gocha jara duriitt kan
  hin gaabbine waliin fromanii nagaa fi araaraa buusuun rakkisaa taha.\\nUmmati Kibbaa
  akkuma Oromoo koloneeffame, erga Wayyaaneen dhufe harki ajjeechaa irraa hin kaane.
  Fakkeenyaaf naannaan Hadiyyaa fi Kambaataa kennata kan laaluun; Sidaamaan Loqqee
  irratt, Shekoo fi Mazhangir Tepii irratt, Naylotota naannaa Omoo fi Gambeela irratt
  kkf duula qacefixaaan dhumaa yoonaa gahan. Oromoon fixiisa akkasii waggootii hedduuf
  dhandhamate. Amma garuu xumura itt gochuuf ka\u2019ee jira. Hunduu hanga dandahu
  iyyee sagalee ofii dhageessisaa diina gara jabeessa kana ofirraa facisa malee lamuu
  callisee hin dhumu. Jara bucuun akka sanyiimaanu hin badne Oromoon abdii tahuufii
  qabu. Qabsoon walabummaan Oromoo qabsoo cunqurfamaa hundaaf karaa bilisummaa banuu
  tahuutu irraa eegama. Kufaatiin saa kufaati naannaa hunda hubu. Milkaawuun saa garuu
  godinichaaf nagaa araaraa fi tasgabii fida. Wanti hubatamuu qabu Wayyaaneen ummata
  yaroo dha jedhee eenyuufuu akka hin hillee. Saamichaf DhDU hundatt ijaaruun hamma
  lafeett utuu hin qorqin salphaatt akka hin dhiisne agarsiisa. Dogoggoraan waan se\u2019aniif
  Oromoo akka hubuu ummata ofii akka diina saaniif tumsu dhiibuu dandahu; ollooti
  hundi arjummaa fi qulqullina garaa Oromoo, Oromiyaa keessa jiraatanii hojjetanii
  beekuu.\\nWayyaaneen maqaa ummataan dargaggoo hedduu riphe lolummaan hiriirse. Warraaqxoti
  isa jala hiriiran erga aangoo qabate akeeka jijjiirrachuu arganii morminaan heduu
  baasee gate. Loltuu amma inni horate kan kaasaaf utuu hin tahin mindaaf bulani.
  Kanaaf Wayyaaneen dhaaba yeroo dirree ture ummataaf dudhama qabu sana utuu hin tahin
  dhaaba ofangessaa dha. Mootummoota isa duraa caalaatt mirga ilmmoo namaa dhiphisee
  samichaaf kan qophaawe. Waggootii digdamii shan tooftaa itt samu gegeeddaraa jirate.
  Fakmishoon saa isa bara mootummaan Habashaa ummatoota bitu caalaa iyyaatii qabuuti.
  Amma teknolojiin hundaa banaa waan taheef akka durii nama sobuun hin dandahamu.
  kanaaf soba buusifama ooluun amanamummaa dhabsiisaa jira. Diddaa barattoota Oromoo
  gadi qabuu haa tahuu furmaata araarsaa taheen gadi bahuu dadhabuun Wayyaanee bakka
  jirutt kantaruu saa agarsiisa. Erga Mallas jalaa du\u2019ee hogganooti mataa tokko
  hafee mataa waan jedhamu kan ittiin yaadanuu qabu hin fakkaatani.\\nDureeyyeen isa
  gargaaruf Oromoo qeeyee saa irraa buqqisanii qabeenya saa saamu keessaa fi alaa
  yaa\u2019an illee xaxatanii karaa ilaallataa jiru. Duraanuu Wayyaaneen miilla suphee
  akka qabuu utuu hin hubatin dhufani. Lammaffaa tuffii Oromoo qabaniin hooda cabsanii
  Oromiyaatt duudan. Amma barnoota jireenya saanii egereef maayii baasuuf akka argatan
  abdatama. Jarri firummaan Tigrayii dhufanii halkanuma tokkott abboolii kumkumoota
  tahan idaa baankiitt dhiisanii waan dandahan gabra gamatt baqachiifataa jiru. Kan
  amanamummaa dhabe ummata nagaan bulchuu hin dandahu. Waraanni gaafa dammaqe qawween
  qoraan dhukaatu utuu hin tahin baatamtu akka taatuu kufaatii Dargii irraa agarreerra.
  Innimoo waan fagoo fakkaataa hin jiru. Mallattoon bakka bakkatt mullataa jira.\\nWayyaanett
  kan lubbbuu itt bitaa jiran anga\u2019oota gabra gamaati. Aanga\u2019ooti kun Wayyaaneef
