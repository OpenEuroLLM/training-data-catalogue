  qabeenyaas saamicha kana keessatti qooda fudhachuurraa darbee hojii misoomaa bu\u2019aqabeessa
  hojjechuurratti qaawwaa guddaatu ture. Sirni bulchiinsa lafaa ammayyaawaan waan
  hinturreef abbootiin qabeenyaa lafa kennameefiin alatti lafa dabalataa barbaacha
  qonnaan bulaa buqqisaa turan.\\nWaggaa 10 dura lafa duwwaa turerratti weerarri lafaa
  banamuun yeroo gabaabaa keessatti ijaarsa seeraan alaan dhuunfatame. Ijaarsi manaa
  taasifame kun sochii invastimantiitti karra cufuu qofa osoo hintaane pilaaanii kan
  hin qabneefi ijaarsa bu\u2019uuraalee misoomaa ilaalcha keessa kan hin galchine
  ture.\\nHaa ta\u2019u malee, hundeeffama Shaggariin walqabatee alseerummaa ittisuufi
  sirna bulchiinsa magaalaa ammayyaa diriireen injifannowwan boonsaan galmaa\u2019aniiru.
  Shaggar tarkaanfii ijaarsa seeraan alaarratti fudhateen lafa misooma garaa garaaf
  ooluu danda\u2019u hektaara 3,800 gara baankii lafaatti deebisuu danda\u2019eera.\\nAmmaan
  tana lafti magaalattii eessattiifi eenyu harkatti akka argamu sirriitti adda ba\u2019ee
  jira. Bu\u2019uuruma kanaan cittuun lafaa magaalattii kuma 660 ta\u2019u galmaa\u2019ee
  siistama keessa galuufi qabiyyee lafaa kuma 142f kaartaan kennamuu Doktar Tashoomaan
