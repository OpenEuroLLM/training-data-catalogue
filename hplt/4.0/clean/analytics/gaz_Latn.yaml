  yakkee hidhuu, ajjeesuufi qabeenya Oromoo saamuu irratti argamu, gaaffii mirga abbaa
  biyyummaa uummata Oromootif deebii rasaasa taasisuuf kan murteeffate Master Plan
  Finfinnee addaan citee ture bara 2015 bifa haaraan deebsisee kaasuu danda\u2019eera.
  Sochiin Warraaqsa Qeerroo Bilisummaa Oromoon durfamus ofirratti hirkachuun Ummata
  Oromoo qawweefi roorroo alagaaf hinjilbiiffatne qabsoof hiriirsuufi hirmaachisuun
  gaaffiin mirga abbaa biyyummaa hanga deebi\u2019utti warraaqsi FGD mootummaa abbaa
  irree Wayyaanee jilbeeffachiisuu irratti qiyyaafate daran jabaatee falmaa hadhaawaa
  ittifufe. Haaluma kanaan Sochiin Fincila Diddaa Gabrummaa bifa qindaa\u2019aa ta\u2019een
  Sadaasa 12,2015 Giddugala Oromiyaa mara keessatti qabate.\\nHaala Kanaan Jaarmiyaan
  Qeerroo Bilisummaa Oromoo seenaa gootota Oromoo hundee godhachuun Ebla 15, bara
  2017 ijaaramee bifa maraan socho\u2019aa turuun injifatnoo irratti injifatnoolee
  goonfataa,guutuu Oromiyaa keessatti milkoomina seenaa keessatti ol aanaa ta\u2019e
  galmeessaa fi sochii bifa ammayyeessaan duree ABO jalatti hojjechaa qabsoo FXG gara
  gara Sochii Fincila Xumura Gabrummaatti tarkaanfachiisuu danda\u2019eera. Warraaqsi
  seena-qabeessi kuni aarsaa qabaatuyyuu Caasaa sirna Mootummaa Wayyaanee hundeen
  diiguun, mootummaan Wayyaanes carraa isa dhumaa yaallachuuf Oromiyaa Bulchiinsa
  Waraanaa jala galcheera.\\nYeroo har\u2019aa biyyattiin Humna Komaandi Poostiin
  bulaa jiraachuun eenyufuu ifadha. Haala sochii Warraaqsa Biyyoolessaa Oromiyaa kanaa
  keessatti lubbuun ilmaan Oromoo kumaatamaan lakkaa\u2019amanii tarkaanfii gara jabinaa
  waraanni Wayyaanee fudhateen galaafatamee jira. Hojjettoonni mootummaa barsiisota
  dabalatee hanga ammaatti 4000 ol eenyummaa isaaniin wal qabatee hojii irraa arihamanii
  jiru. Dararaan akkaanii ummata keenya irra gahee fi gahaa jira.\\nKanaaf miidhaan
  fedhe gama mootummaa TPLFn ummata Oromoo irra gahu iyyuu gama biraan yeroon kun
  yeroo Qabsoon Bilisummaa Oromoo sadarkaa ol aanaatti tarkaanfatee jiru dha. Oromoon
  akka sabaatti uummata hundaaf kabajaa qabu, goota, jagnaa fi uummata guddaa tokkummaa
  qabu ta\u2019uu hawaasa addunyatti agarsiiseera, agarsiisaas jira. Yeroo uummati
  Oromoo, \u201cAmmaan booda cunqursaa, saamichaa fi hacuuccaa alagaa baachuu hindanda\u2019u!
  Na gahe!\u201d jedhee sirna roorriftuu alagaa of irraa darbuuf harka duwwaa diina
  meeshaa lolaa ammayyaa hidhate dura dhaabbatee murannoon wareegama barbaachisu baasaa
  jirutti yaadatamuufi yeroo Oromoon of hidhachiisaa jirudha. Oromoon, \u201cBilisummaa
  yookaan du\u2019a!\u201d jechuun yeroo falmaa hadhaawaa godhuuf murteeffatee ka\u2019edha.
  Maayii irratti uummatni Oromoo mirga siyaasaa, dinagdee fi hawaasummaa humna qawween
  irraa sarbame wareegama barbaachisu baasee of harka galfachuuf dandeettii kan qabu
  tahuu hawaasa addunyaa hubachiiisuu barbaada.\\nUmmatni Oromoo qonnaan bulaan, Qeerroon
  (Daragaggoon) barataan, daldalaan, hojjattootni, beektotni walumaagala murnooti
  hawaasa Oromoo hundi Sochii Warraaqsa Biyyoolessa Oromiyaa keessatti ittifufiinsaan
  adeemaa jiru bifa qindaa\u2019een daran cimsitanii akka cina-dhaabbattaniifi kufaatii
  sirna cunqursaa Wayyaaneetti xumura goonu waamicha dabarsa.\\nINJIFANNOON UMMATA
  OROMOOTF!\\nGADAAN GADAA BILISUMMAATI!\\nEBLA 15,2017\\nFinfinnee, OROMIYAA\\nQeerroo
  horaa bula\"", "\"HAALA RAKKISAA\\n\u201cNama naaf ta\u02bcu akkan argadhe natti
  dhaga\u02bcamee ture. Keessa kootti, \u2018Gurbaa kanaa wajjin bara baraaf jiraachuu
  nan danda\u02bca\u2019 jedheen yaade. Haa ta\u02bcu malee ji\u02bca lamaaf erga
  wal qorannee booda, isa irraa addaan ba\u02bcuufan dirqame. Wanti abdii guddaadhaan
  jalqabame kun saffisa kanaan addaan cituu isaa amanuun natti ulfaate!\u201d\u2014Aaanaa.
  *\\n\u201cWanta itti wal fakkaannu hedduu qabna turre. Garaa kootti akka gaa\u02bcela
  godhannu mirkanaa\u02bcaa ta\u02bceen ture. Yeroo booda garuu garaa garummaa hedduu
  akka qabnu hubachuun jalqabe. Dogoggora guddaa hojjechuu koo yommuun hubadhu isa
  irraa addaan nan ba\u02bce.\u201d\u2014Elaayaan.\\nAtoo wanti akkanaa si mudatee
  beekaa? Taanaan mata dureen kun rakkina kana mo\u02bcuuf si gargaaruu danda\u02bca.\\nWANTA
  BEEKUU QABDU\\nWal qorachuu addaan kutuun abbaa yaada kana dhiheesse illee gaddisiisuu
  danda\u02bca. Shamarreen Saaraa jedhamtu tokko erga jaalallee ishii wajjin wal qorachuu
  dhaabdee ji\u02bca ja\u02bca booda akkana jetteetti: \u201cMiirri koo ni jeeqame!
  Daqiiqaa tokkoof namni kun ammas ta\u02bce gara fuulduraatti naa wajjin ture; daqiiqaa
  itti aanutti immoo ana biraa dhabame. Sirboota lamaan keenya baay\u02bcee jaallannu
  nan dhaggeeffadha, kunis yeroo gaarii waliin dabarsine na yaadachiisa. Iddoowwan
  lamaan keenya baay\u02bcee jaallannu yommuun dhaqus inni ana biraa dhibamuun isaa
  akka malee na gaddisiisa. Walitti dhufeenya keenya akka addaan kutnu yaada kan dhiheesse
  ana yoo ta\u02bce illee wanti kun hundi natti dhaga\u02bcama!\u201d\\nAddaan ba\u02bcuun
  kan nama gaddisiisu ta\u02bcus gaarii ta\u02bcuu danda\u02bca. Elaayaan akkana jetteetti:
  \u201cNama sana miidhuu hin barbaaddan. Karaa gara biraa immoo wanti kun akka hin
  taane utuu beektanii wal qorachuu keessan yoo itti fuftan yeroo booda lamaan keessan
  iyyuu akka miidhu ni hubattu.\u201d Saaraanis yaada kana irratti walii galti. Akkana
  jetteetti: \u201cNama tokkoo wajjin yeroo wal qorataa jirtanitti yoo hin gammaddan
  ta\u02bce, yoo nama sanaa wajjin gaa\u02bcela godhattanis tarii gammaduu hin dandeessan
  ta\u02bca, kanaaf addaan ba\u02bcuun keessan caalaatti gaarii ta\u02bca.\u201d\\nNama
  tokko irraa addaan ba\u02bcuun kee ati nama gaarii akka hin taane hin argisiisu.
  Dhugaa dubbachuuf karaa bu\u02bca qabeessa ta\u02bceen wal qorachuun, murtoo tokko
  irra ga\u02bcuudhaan xumurama malee yeroo hunda gaa\u02bcela godhachuudhaan xumurama
  miti. Ati ykn jaalalleen kee mamii cimaa qabdu taanaan murtoon sirrii ta\u02bce
  addaan ba\u02bcuu ta\u02bcuu danda\u02bca. Murtoo akkasii irra geessee walitti dhufeenyi
  keessan addaan cite jechuun ati nama gaarii hin taane dha jechuu miti. Haala si
  mudate mo\u02bcuu ni dandeessa! Akkamitti?\\nWANTA GOCHUU DANDEESSU\\nGadduu akka
  dandeessu amanii fudhadhu. Elaayaan ishiin seensa irratti ibsamte, \u201cKan ani
  dhabe michuu qofa utuu hin ta\u02bcin, michuu hunda caalu dha\u201d jechuudhaan
  dhugaa isaa dubbatteetti. Nama baay\u02bcee sitti dhihaatu tokko irraa yommuu addaan
  baatu yeroo murtaa\u02bceef gadduun waanuma jiru dha. Dargaggeessi Addaam jedhamu
  tokko, \u201cWalitti dhufeenyi keessan addaan cituun isaa caalaatti gaarii akka
  ta\u02bce yoo beektan illee gadda fiduun isaa waan hin oolle dha\u201d jedheera.
  Atis akkuma Daawit isa Kitaaba Qulqulluu keessatti ibsame sanaa sitti dhaga\u02bcama
  ta\u02bca. Daawit, \u201cHalkanuma dhuftu boo\u02bcuu kootiin siree koo nan tortorsa\u201d
  jechuudhaan wanta yeroo gadde isatti dhaga\u02bcame barreesseera. (Faarfannaa 6:6)
  Yeroo tokko tokko karaan gadda mo\u02bcuun itti danda\u02bcamu inni hunda irra caalu,
  rakkina sana keessa darbuu malee rakkina sana irraa baqachuu miti. Gadda kee mo\u02bcuuf
  tarkaanfiin inni jalqabaa miira sitti dhaga\u02bcamu amantee fudhachuu dha.\u2014Qajeelfama
  Kitaaba Qulqulluu: Faarfannaa 4:4, NW.\\nNamoota siif yaadaniitti dhihaadhu. Kana
  gochuun salphaa akka hin taane beekamaa dha. Aanaan ishiin olitti ibsamte akkana
  jetteetti: \u201cJalqaba irratti nama arguu illee hin barbaaduun ture. Waa\u02bcee
  dhimma sanaa yaaduu fi wanta raawwatame hubachuuf yeroon na barbaachisa ture.\u201d
  Ta\u02bcus Aanaan yeroo booda michoota ishii warra ishii jajjabeessuu danda\u02bcanitti
  dhihaachuun barbaachisaa akka ta\u02bce hubatteetti. Akkana jetteetti: \u201cAmma
  sirriitti yaaduu nan danda\u02bca. Addaan ba\u02bcuun akka yeroo duraa sana akka
  malee ana hin gaddisiisu.\u201d\u2014Qajeelfama Kitaaba Qulqulluu: Fakkeenya 17:17,
  NW.\\nWanta Sirra Ga\u02bce Irraa Baradhu. Akkana jedhii of gaafadhu: \u2018Muuxannoon
  kun gama ani itti guddachuu qabu tokko akka jiru mul\u02bciseeraa? Taanaan, nama
  kan biraa wajjin yeroon wal qoradhu kana irraa haala adda ta\u02bceen maal gochuun
  danda\u02bca?\u2019 Shamarreen Maarsiyaa jedhamtu tokko, \u201cYeroo booda, amma
