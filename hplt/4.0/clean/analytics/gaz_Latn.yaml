  ishee gargaareera.\\nSosochii daawwannaa invastimantii miidiyaaleefi qaamoleen hawaasaa
  biroo Kibxata darbe taasisanirratti ibsa kan kennan Kantiibaan Magaalaa Shaggar
  Doktar Tashoomaa Addunyaa akka jedhanitti, magaalaan kun wayita Godina Addaa Oromiyaa
