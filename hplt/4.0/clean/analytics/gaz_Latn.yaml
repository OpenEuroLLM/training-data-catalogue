  ta\u2019aa jiru jechuun dubbate, lammiin Itiyoophiyaa kun\\nSolomoon dabalee yoo
  dubbatu, lammileen Itiyoophiyaa Jibuutii jiraatan kana kaffaluu waan hin dandeenyeef
  seeraan alaa jiraatu jedhe. Kunis warra mataa gosaa biyya Jibuutii jiranii qabatanii
