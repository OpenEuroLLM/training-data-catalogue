  ilaalaman Kiristaana-Islaamaafi lagaan osoo wal hinqoodin jumulaan wareegama qaalii
  kanfaluun tokkummaa saba Oromoo dhiiga isaaniin mirkaneessan ta\u2019uu isaati.
  Hanga har\u2019aattillee hoogganootaa fi miseensoti Adda Bilisummaa Oromoo, Qeerroo
