  jeeqamaa jira. Sanaafis walabummaan Oromiyaa fala taha. Jireenyi nagaa, seeran bulmaati,
  ilmoo namaa walqixxeett ilaaluun aadaa saatii. Ummatoota kolonootaa qofa utuu hin
  tahin ummatooti Itophiyaallee walabummaa Oromiyaan ni bilisoomu. Nammi Oromoo roorrisaaf
  bitamee ulee saa tahuun yeros hafa. Uleen harka buunaan roorrisaan hin jiru. Oromoon
  nagaa fi araaraa busee jiraachuu fi hariiroo sabgidduu akka seera addunyaatti, saba
