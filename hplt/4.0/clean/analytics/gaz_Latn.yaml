  Fincila Xumura Garbummaatti (FXG) jedhu gidduugaleessa godhachuun Warraaqsii Biyyoolessaa
  Oromiyaa godinaalee Oromiyaa cufa keessatti akka qabsiifamuuf haalduree Sochii Warraaqsaa
  Biyyooleessa Oromiyaa qindeessuun ummata waliin tokkummaan falmaan akka ittifufuuf
