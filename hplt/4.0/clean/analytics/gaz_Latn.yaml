  dabalataa fe''adhu\"", "\"Torban darbe bakka mana barumsaa sadarkaa tokkoffaa keenya
  Adami Tulutti boolli bishaanii qotamee ture. Ijaarsa daree barnootaa 4 yeroo jalqabaaf
