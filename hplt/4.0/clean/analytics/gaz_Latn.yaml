  waldaa Geejjibaa itiyoophiyaa jibuutii jiruu tokko ka maqaan isaanii akka eeramu
  hin feene waldaaleen Geejjibaa rakkoo hedduu qabuu jedhan. Tokko walii galtee warra
  Buufata konkolaataa eegan duuka jiru ka amma yeroon isaa irra darbedha. Hojiin kun
