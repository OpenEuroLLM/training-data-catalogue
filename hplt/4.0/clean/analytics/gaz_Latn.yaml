  Oromoo Ebla 15 ka\u2019umsa godhachuudhaan akeekaafi kaayyoo GGO galiin ga\u2019uuf
  Qeerroon Bilisummaa Oromoo jala bultii GGO Ebla 15 kan bara 2014 sababeeffachuun
  haala yeroo irratti ibsa waliigalaa erga kennee booda Ebla 11,2014 Sochii Warraaqsa
  FDG bifa ijaarameefi qindaa\u2019een dhoosuun Mootummaa abbaa irree Wayyaanetti
  xumura gochuuf Warraaqsa Biyyoolessaa Oromiyaaf bu\u2019uura kaa\u2019an.\\nSeenaan
  Ebla 15, GGO Sochii Warraaqsa Biyyoolessaa Oromiyaa FXG sadarkaa idil-addunyaatti
  beekamtii argate waliin seenaa addaa qabaachuu isaa Ibsa Qeerroon Bilisummaa Oromoo
  Ebla 2014 kennee Warraaqsa dhoosee kaayyoo GGO dachaan tarkaanfachiise irraa hubachuun
  nidanda\u2019ama. \u201cHaala Yeroo Ilaalchisee Ibsa Sochii Dargaggoota Biyyoolessaa
  Irraa kenname (Qeerroo Bilisummaa) Ebla 2,2014 Jimmaa Bakka bu\u2019oonni Qeerroo
  Bilisummaa Oromoo godinoota adda addaa irraa walitti dhufuun Ebla 1 fi Ebla 2,2014
  walgahii guyyaa lamaaf gaggeefatan irratti haala yeroo uummata Oromoo fi Qabsoo
  FDG Bilisummaa Oromoo daran jabeessuufi haala waliigala raafama siyaasa Impaayera
  biyyattii irratti marii bal\u2019aa gochuun ibsa armaan gadii dabarsee jira.\\n-
  Duguuginsa Sanyii (Genocide), moototni Habashaa erga Oromoo afaan qawween cabsanii
  bulchuu eegalanii hanga har\u2019a jaarraa 21ffatti dabaree aangootti dhufan raawwatanif
  Oromoon tolee jedhee jilbeeffatee bitamee, hinbulle. Utuu falmatuu diina kufaa kuffisaa
  har\u2019a as ga\u2019ee; Qabsoo Bilisummaa Oromoos bu\u2019aawwan dagatamuufi eenyuyyuu
  haaluu hindandeenye dhiigaafi lafee isaa itticabsee fidee har\u2019a dhaloota haaraa
  nu Qeerroo Oromoo qaqqabsiisee jira. Haata\u2019uu malee, ilmaan mootota Habashaa
  kaleessaa har\u2019allee Qabsoo Oromoo dhaamsuuf Oromiyaa deebisanii qabachuufi
  sirnoota abbootii isaanii sirna nafxanyaa kaleessaa deebisuuf nurraa hindhaabbanne
  hojii idilee isaanii godhachuun hanga sadarkaa mana maxxansaa banachuun Oromoo arrabsuu,
  xiqqeessuu, tuffachuu fi Oromoon biyya hinqabu jechuu irra gahani jiru. Nafxanyaa
  har\u2019a qawweefi golgaa dimookiraasiin biyya lafa gowwomsaa jiru of jabeessuun
  umrii bittaa isaa dheereffachuuf yeroo kallattii hundaan tattafatan ifatti ba\u2019een
  mul\u2019acha jira, sochii farrummaa Oromoo nafxanyota kaleessaafi har\u2019a kana
  dhaabamsisuuf Oromoon bakka jiru hundaa dammaqee qalbiin qabsoo FDG keessatti qooda
  guddaa ba\u2019uu qaba.\\n- Mootummaan abbaa Irree Wayyaanee bulchiinsa Magaalotaa
  Oromiyaafi saaminsa qabeenyaa uummata Oromoofi uummaata Oromoo qe\u2019eefI qabeenyaa
  irraa buqqisuuf bifa haaraan karoorfatee sochii irra jiraachuu ifatti karaa Miidiyaa
  of harka qabuun labsii dabarfatee jira. Sochii kana dhaabsiisuufi bulchiinsa Magaalaa
  Finfinnee to\u2019achuuf, qabeenya uummata Oromoo saaminsa irraa hambisuuf, akkasumas,
  Oromoon nagaan qe\u2019eef qabeenya isaa irratti abbaa biyyummaa akka mirkaneeffatuuf
  bakka jirru maraa haalduree tokko malee maqaa Oromoo jettu qofaan waliif dirmannee
  qabsoo FDG jabeessuun bara sirna nafxanyaa kaleessaafi har\u2019atti xummura haa
  goonu jechuun waamicha Oromummaa ilmaan Oromoo hundaaf nidabarsina.\\n- Ilmaan Oromoo
  gooftummaan diinaa suga isinitti fakkaatee mootummaa EPRDF fi Wayyaanee duukaa dhaabbachaa
  jirtan guyyaa saafaa ilmaan Habashaafi sirni EPRDF uummata Oromoo tuffachaa, arrabsaafi
  arrabsiisaa dhiyeenya kana du\u2019aa mootummaa naannoo Oromiyaa President Alamaayyoo
  Atoomsaa fi waldorgommii Ispoortii magaalaa Baahirdaritti gaggeeffame irratti salphina
  guddaa uummata keenya irratti rawwatame ijan argamee jira. Kana qofaa mitii eeyyama
  Oromoo malee Magaalawwaan Oromiyaa kanneen akka Burraayyuu, Sabbataa, Sulultaa,
  Holotaa, Sandafaa, Laga Xaafoo laga daadhii, Aqaaqii Qaallitii ,Duukam, Galaan bishooftuu,
  fi magaalota kannee akka Shashamannee, Adaamaa, Jimmaa, Neqemtee fi Amboo illee
  bulchiinsa Federaalaa jala galchuun leeccalloo achii irraa argamuufi Oromoo ittin
  jilbeffachisanii bituun umrii garbummaa dheeressuuf diini karoorsee uummata keenya
  irratti hojechaa jiraachuun ifatti ba\u2019ee saaxilamee jira. Kanaaf ilmaan Oromoo
  diina duukaa dhabbachuun haa ga\u2019u jenna.\\n- Jaarraa amma geenye keessa yeroo
  biyyi lafaa bineensaafiyyuu carraa barnoota kennaa jirtutti Mootummaan abbaa irree
  EPRDF Baratoota Oromoo badii tokko malee sababa Oromummaa isaaniifi sirna Wayyaaneetti
  harka hinkennannu jedhaniif jumlaan barnoota irraa arii\u2019aa, mana hidhaatti
  guuraa, ajjeesaa, fi biyya irra ari\u2019ataa dararaan ilma namaa irratti raawwatamuu
  hinqabne nurratti rawwatamaa waan jiruuf qabsoo FDG jabeesinee ittifufuu murteessinee,
  rakkina kana keessaas of baasuun Oromiyaa bilisoomteefi ummanni keenya hiree isaa
  murteeffatee ofiin akka of buchuuf qabsoo sochii warraqsaa dimookisiifi bilisummaa
  Qeerroon gaggeessaa jiru gabrummaa bardhibbeetti furmaata waaraafi karaa waan ta\u2019eef
  fincillee mirga keenya kabachiifachuuf bakka jirru gamtaan sagalee keenya haa dhageesifannu.\\n-
  Akka guutuu Oromiyaatti yeroo ammaa kanatti qaala\u2019insa jiruuf jireenyaa fi
  hojii dhabdummaan ija baasee dargaggoonni Oromoo dhaabbilee barnoota olaanoo akka
  Yuunibarsiitiifi Kolleejjota garaagara irraa sadarkaa barnoota dipiloomaa hanga
  Digrii 2ffaatti baratanii hojii dhabdee ta\u2019uun dararama ilmi namaa hinargine
  argaa jiru. Sirni EPRDF sirna dabballee wallaalaafi ogummaa hinqabneen kan durfamu
  waan ta\u2019eef of shakkii aangoo irraa ka\u2019uun beektotaafi hayyoota Oromoo
  ogummaa isaniitiinillee lammii isaanii tajaajilanii akka of hinjiraachifneef beektota
  Oromoo moggaatti dhiibee, barattoota dargaggoota Oromoo hojii dhabdee taasiisuun
  karaa irra taa\u2019ee dargaggeessi akka kadhatuuf saaxilee jira. Dhugaan kun har\u2019a
  addunyaa biyya lafaaf ifaadha. Kanaafuu beektootnifi dargaggoon Oromoo dhaabbilee
  barnoota olaanoo irraa eebbifamuun jiruuf jireenyaan dararamaa jirtan dandeettiifi
  humna keessaniin qabsoo FDG sochii Warraaqsaa Qeerroon Bilisummaa Oromoo gaggeessaa
  jirutti gurmuunis ta\u2019ee namtokkeen wal ijaaruun harka wal qabannee sirna wallaltotaafi
  humna qawween ijaarame kana diiguun mirga ummata keenyaafi bilisummaa keenya haa
  kabachiifannuun waamicha keenya.\\n- Mootummaan shororkeessaafi abbaa irree kan
  ta\u2019e Wayyaaneen TPLF humna afaan qawween aangoo irra kan ture sabaafi sablammii
  biyyattii gidduutti ibidda qabsiisuun walnyaachiisaa ofiif fayyadamaa ta\u2019aa
  as ga\u2019e wanti baay\u2019ee nama ajaa\u2019ibu sabuma tokkicha Oromoofi Oromoo
  gidduuttillee walitti bui\u2019insa hinjirre qabsiisuun dhiiga wal dhangalaasisaa
  umrii dheereffatee, uummatni Oromoo lola Gumuziifi Oromoo, Sumaaleefi Oromoo, Oromoofi
