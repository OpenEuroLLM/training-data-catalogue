  er y gall ffermio ffatri ymddangos fel ffordd gost-effeithiol o gynhyrchu bwyd,
  mae\u2019r costau cudd sy\u2019n gysylltiedig ag ef yn llawer uwch. O niwed amgylcheddol
  i effeithiau negyddol ar iechyd a phryderon moesegol, mae gwir bris ffermio ffatri
  yn ymestyn ymhell y tu hwnt i''r pris ar eich nwyddau. Fel defnyddwyr, mae''n bwysig
  bod yn ymwybodol o''r costau cudd hyn ac ystyried dewisiadau amgen mwy cynaliadwy
  a thrugarog ar gyfer ein ffynonellau bwyd. Mae hefyd yn hanfodol i lywodraeth ac
  arweinwyr diwydiant flaenoriaethu lles ein planed, anifeiliaid, a chymunedau dros
  elw a chyfleustra. Bydd ein dewisiadau heddiw yn cael effaith sylweddol ar ddyfodol
  ein planed a''i thrigolion. Gadewch inni wneud penderfyniadau gwybodus a gweithio
  tuag at system fwyd fwy cynaliadwy a moesegol er lles pawb.\\nFAQ\\nBeth yw rhai
  o ganlyniadau amgylcheddol ffermio ffatri, a sut maent yn cyfrannu at gostau cudd?\\nMae
  gan ffermio ffatri nifer o ganlyniadau amgylcheddol, gan gynnwys llygredd d\u0175r
  yn sgil y defnydd gormodol o wrthfiotigau a gwrtaith, datgoedwigo ar gyfer cnydau
  porthiant, allyriadau nwyon t\u0177 gwydr o dda byw, a diraddio pridd oherwydd gorbori.
  Mae''r canlyniadau hyn yn cyfrannu at gostau cudd trwy roi straen ar adnoddau naturiol,
  cynyddu costau gofal iechyd oherwydd ymwrthedd i wrthfiotigau, a chyfrannu at newid
  yn yr hinsawdd. Yn ogystal, gall y symiau enfawr o wastraff a gynhyrchir gan ffermydd
  ffatri halogi ffynonellau d\u0175r cyfagos, gan arwain at gostau glanhau ac iechyd
  ychwanegol. Yn gyffredinol, mae effaith amgylcheddol ffermio ffatri yn arwain at
  gostau cudd sylweddol nad ydynt yn cael eu cyfrif i ddechrau ym mhris cynhyrchion
  anifeiliaid.\\nSut mae\u2019r risgiau iechyd sy\u2019n gysylltiedig \u00e2 ffermio
  ffatri yn effeithio ar gymdeithas, a beth yw rhai o\u2019r costau cudd sy\u2019n
  gysylltiedig \u00e2\u2019r materion iechyd hyn?\\nMae''r risgiau iechyd sy''n gysylltiedig
  \u00e2 ffermio ffatri yn cael effaith sylweddol ar gymdeithas. Yn gyntaf, mae''r
  gorddefnydd o wrthfiotigau yn y llawdriniaethau hyn yn cyfrannu at y cynnydd mewn
  bacteria sy''n gwrthsefyll gwrthfiotigau, gan ei gwneud yn anoddach trin heintiau.
  Yn ail, mae''r amodau gorlawn ac afiach mewn ffermydd ffatri yn cynyddu''r risg
  o glefydau fel salmonela ac E. coli, a all arwain at salwch a gludir gan fwyd mewn
  defnyddwyr. Yn ogystal, mae bwyta cig o ffermydd ffatri wedi''i gysylltu \u00e2
  risg uwch o faterion iechyd amrywiol, gan gynnwys clefyd y galon a rhai mathau o
  ganser. Mae costau cudd y materion iechyd hyn yn cynnwys costau gofal iechyd cynyddol,
  cynhyrchiant coll, a llai o ansawdd bywyd i unigolion yr effeithir arnynt.\\nBeth
  yw rhai o effeithiau economaidd ffermio ffatri, o ran costau cudd a manteision posibl?\\nMae
  gan ffermio ffatri gostau cudd economaidd a manteision posibl. Mae costau cudd yn
  cynnwys difrod amgylcheddol, megis llygredd d\u0175r a datgoedwigo, a all arwain
  at ganlyniadau economaidd hirdymor. Yn ogystal, mae''r defnydd o wrthfiotigau mewn
  ffermio ffatri yn cyfrannu at y cynnydd mewn bacteria sy''n gwrthsefyll gwrthfiotigau,
  gan beri risgiau i iechyd y cyhoedd a chynyddu costau gofal iechyd. Ar yr ochr arall,
  gall ffermio ffatri ddarparu buddion economaidd o ran cynhyrchu mwy o fwyd a phrisiau
  bwyd is, a all gael effaith gadarnhaol ar wariant defnyddwyr a thwf economaidd cyffredinol.
  Fodd bynnag, rhaid pwyso a mesur y manteision hyn yn erbyn y costau hirdymor a\u2019r
  canlyniadau negyddol posibl sy\u2019n gysylltiedig \u00e2 ffermio ffatri.\\nSut
  mae ffermio ffatri yn cyfrannu at ddiraddio lles anifeiliaid, a beth yw\u2019r costau
  cudd sy\u2019n gysylltiedig \u00e2 hyn?\\nMae ffermio ffatri yn cyfrannu at ddiraddio
  lles anifeiliaid trwy arferion fel gorlenwi, caethiwo, a defnyddio gwrthfiotigau
  a hormonau. Mae''r amodau hyn yn arwain at straen, afiechyd, ac anffurfiadau corfforol
  mewn anifeiliaid. Mae costau cudd sy''n gysylltiedig \u00e2 ffermio ffatri yn cynnwys
  difrod amgylcheddol, megis llygredd d\u0175r o wastraff anifeiliaid, a lledaeniad
  bacteria sy''n gwrthsefyll gwrthfiotigau. Yn ogystal, mae''r defnydd dwys o adnoddau,
  megis tir a d\u0175r, yn gwaethygu ymhellach faterion fel datgoedwigo a phrinder
  d\u0175r. Mae\u2019r effaith negyddol ar les anifeiliaid a\u2019r amgylchedd yn
  amlygu\u2019r angen am ddewisiadau amgen mwy cynaliadwy a moesegol i ffermio ffatri.\\nYm
  mha ffyrdd y mae ffermio ffatri yn effeithio ar gymunedau lleol, a beth yw rhai
  o\u2019r costau cudd y mae\u2019r cymunedau hyn yn eu hysgwyddo o ganlyniad?\\nMae
  ffermio ffatri yn effeithio ar gymunedau lleol mewn sawl ffordd. Yn gyntaf, gall
  arwain at lygredd amgylcheddol, gan fod llawer iawn o wastraff a chemegau yn cael
  eu cynhyrchu. Gall hyn halogi ffynonellau d\u0175r a chyfrannu at lygredd aer. Yn
  ail, mae ffermydd ffatri yn aml angen swm sylweddol o dd\u0175r, a all roi straen
  ar gyflenwadau d\u0175r lleol. Yn ogystal, gall y ffermydd hyn gael effeithiau andwyol
  ar ffermydd teuluol lleol, gan eu bod yn aml yn gyrru gweithrediadau llai allan
  o fusnes. At hynny, mae cyfleusterau ffermio ffatri yn allyrru arogleuon cryf, a
  all leihau ansawdd bywyd trigolion cyfagos. Gall y costau cudd hyn gynnwys materion
  iechyd, gostyngiad yng ngwerth eiddo, a cholli diwylliant a hunaniaeth leol.\"",
  "\"Dechreuodd Catrin Williams arddangos ei gweithiau celf ar ddiwedd yr 1980au ac
  ers hynny mae ei gwaith wedi teithio ar draws y byd. Fe''i magwyd ar fferm fynydd
  yng Nghefnddwysarn ger Y Bala, ond mae wedi byw wrth ymyl y m\u00f4r ym Mhwllheli
  ers 1996. Cymreictod - neu yn hytrach y profiad o fyw yn Nghymru - yw un o''r themau
  cryfaf yng ngwaith Catrin Williams; mae''r ddresel, y dillad, wynebau ac arferion
  y teulu i gyd yn aml wedi gweu drwy''i gilydd ac yn mynnu sylw. Dros amser datblygodd
  y themau cartrefol a theuluol i gynnwys elfennau o''r symbolau twristaidd o Gymru
  fel y llieiniau golchi llestri ystrydebol. Mae atsain o''i thirluniau cynnar o fynyddoedd
  y Berwyn yn amlwg yn ei darnau diweddaraf, ond arfordir a thraethau penrhyn Ll\u0177n
  yw''r ysbrydoliaeth bellach.\\nErs blynyddoedd mae galw mawr wedi bod am ei gwaith
  gan gasglwyr preifat. Fe\u2019i gwelir mewn casgliadau preifat ym mhob rhan o Ynysoedd
  Prydain, Ffrainc, Yr Almaen, Hwngari, Siapan, Canada, America a Tseina, ac yng nghasgliadau
  cyhoeddus Llyfrgell Genedlaethol Cymru, Amgueddfa Gymreig o Gelfyddyd Fodern Y Tabernacl,
  Cyngor Sir Gwynedd, Oriel Ceredigion Aberystwyth ac Oriel Casnewydd Gwent.\\n\u201cDwi\u2019n
  angerddol am y celfyddydau o bob math ac mae wedi bod yn bleser mawr i mi gael tynnu
  nifer o artistiaid mor wahanol at eu gilydd a\u2019u mentora er mwyn creu arddangosfa
  llawn amrywiaeth ym Mhlas Glyn-y-Weddw. Er mwyn i unrhyw artist ddatblygu mae angen
  cefnogaeth i\u2019w wthio ymhellach, a\u2019i hybu i ddal ati i greu. Un o\u2019r
  rhesymau pwysig dros sefydlu B\u00d4N yw bod yr unigolion yn gallu cefnogi a hyrwyddo
  ei gilydd \u2013 mae orielau\u2019n cefnogi trwy gynnig gofod i arddangos, a gall
  pawb sy\u2019n ymweld \u00e2\u2019r sioe hon ddangos eu gwerthfawrogiad trwy ymgysylltu
  \u00e2\u2019r gwaith sy\u2019n cael ei arddangos.\u201d - Catrin Williams\\n//\\nCatrin
  Williams has exhibited her art widely since the late 1980s. Brought up on a hill-farm
  near Bala, she has lived near the sea at Pwllheli since 1996. Welshness - or rather
  the experience of living in Wales - is an obvious theme in Catrin Williams\u2019
  work, she has embodied the Welsh dresser, clothes, faces and family customs in her
  work. Family and homely themes have also developed into studies of the tourist imagery
  of Wales such as the dreaded clich\u00e9-ridden tea-towels. Recent landscape works
  echo her early paintings of the Berwyn mountains but it''s the coastline and the
  sea around the Ll\u0177n Peninsula which are now the inspiration.\\nThere has been
  a real demand for her work from many private collectors, pieces of Catrin''s art
  are in private collections all over the British Isles, France, Germany, Hungary,
  Japan, Canada America and China - and in the public collections of National Library
  Wales, MOMA Wales Machynlleth, Cyngor Sir Gwynedd County Council, Oriel Ceredigion
  Aberystwyth and the Newport Gwent Gallery and Museum.\\nI''m passionate about all
  kinds of art and it''s been a great pleasure for me to be able to bring a number
  of different artists together, and to mentor them in order to create an exhibition
  full of variety at Plas Glyn-y-Weddw. In order for any artist to develop, they need
  support to push them further, and encourage them to keep creating. One of the important
  reasons for establishing B\u00d4N is that the individuals can support and promote
  each other \u2013 galleries support by offering a space to exhibit, and everyone
  who visits this show can show their appreciation by engaging with the work on display.\u201d
  - Catrin Williams.\"", "\"Cerdd yn y Pot dan y Gwely (Pot Piso)\\nYma mae Charlotte
  Rogers o Ganolfan Dylan Thomas yn archwilio bywyd, gwaith a dylanwad Tambimuttu.\\nFel
  ffigwr canolog yng nghylchoedd llenyddol (a chymdeithasol) ei ddydd, gwelwn enw
  Dylan Thomas wedi\u2019i gysylltu \u00e2 nifer o ysgrifenwyr eraill. Edith Sitwell,
  Vernon Watkins, Pamela Hansford Johnson a Kingsley Amis ag enwi rhai yn unig. Fodd
  bynnag, mae ffigwr yr oedd ei frwdfrydedd creadigol a\u2019i wreiddioldeb craff
  yn cysylltu cynifer o\u2019r artistiaid rydym yn meddwl amdanynt heddiw fel rhan
  o\u2019r canon llenyddol \u2013 gan gynnwys Dylan.\\nCyhoeddwr, bardd, golygydd
  a beirniad Tamil oedd Meary James Tambimuttu a oedd yn dadlau\u2019n frwd o blaid
  \u2013 ac yn cyfrannu at \u2013 fyd llenyddol canol yr ugeinfed ganrif yn Llundain
  ac Efrog Newydd. Mae \u2018na si iddo fathu\u2019r term \u2018Fitzrovia\u2019, sy\u2019n
  cyfeirio at yr ardal yn Soho lle byddai\u2019r ysgrifenwyr a\u2019r artistiaid mawr
  (a oedd yn aml yn feddw) yn ymgasglu i drafod eu celfyddyd a\u2019u gobeithion ar
  gyfer y dyfodol.[1]\\nFe\u2019i ganed ym 1915 yn Seil\u00f3n (Sri Lanka erbyn hyn),
  a daeth \u2018Tambi\u2019 fel y\u2019i hadwaenwyd gan ei gyfeillion a\u2019i gydweithwyr,
  i Lundain pan oedd yn 22 oed. O fewn blwyddyn o gyrraedd y ddinas, roedd wedi dechrau
  cyhoeddi\u2019r cylchgrawn llenyddol enwog, Poetry London, a fyddai\u2019n cynnwys
  gwaith sawl enw eiconig, gan gynnwys, Lawrence Durrell, Elizabeth Smart, Diana Gardner,
  George Barker, ac \u2013 wrth gwrs \u2013 Dylan Thomas.[2] Roedd gwreiddioldeb yr
  argraffiad cyntaf yn golygu ei fod yn llwyddiant di-oed, ac ysgrifennodd Dylan at
  Tambimuttu i\u2019w longyfarch ar ei ddewisiadau blaengar a\u2019i \u2018gyflwyniad
  anffasiynol\u2019.[3] Byddai\u2019r cyhoeddiad hwn yn gosod y naws ar gyfer holl
  benderfyniadau golygyddol a chyhoeddi Tambimuttu, y\u2019u nodweddwyd yn aml gan
  reddf am ddawn a heriai gonfensiwn.\\nNi ellir gorbwysleisio cefnogaeth Tambimuttu
  ar gyfer cerddi Dylan. Pan gyhoeddwyd Poetry London am y tro cyntaf ym 1938, roedd
  Dylan a\u2019i wraig newydd Caitlin yn byw yng Nghymru\u2019n bennaf, heb gysylltiad
  \u00e2 byd llenyddol y brifddinas. Er bod Dylan wedi cael llwyddiant gyda chyhoeddiad
  18 Poems and Twenty-five Poems drwy J M Dent & Sons Ltd, roedd yn dal yn ddigon
  tlawd i orfod benthyca arian ar gyfer ei drwydded briodas; ac fe dreulion nhw gryn
  dipyn o 1938 yn byw dan ras ei deulu a\u2019i ffrindiau. Roedd cefnogaeth Tambimuttu
  yn hanfodol wrth barhau i ledaenu enw da Dylan fel bardd modern gwerth buddsoddi
  ynddo.\\nYchydig iawn a wyddai\u2019r naill ddyn a\u2019r llall y byddai\u2019r
  hyn y gadawsant ar eu holau\u2019n cael ei gysylltu mor fanwl ar \u00f4l eu marwolaeth.
  Ymhlith ugeiniau o gysylltiadau llenyddol, enw Dylan sy\u2019n ymddangos dro ar
  \u00f4l tro yn y casgliad o ysgrifau coffa a gyflwynwyd i Tambimuttu, a ysgrifennwyd
  gan ffrindiau a chydweithwyr ar \u00f4l ei farwolaeth ym 1983.[4] Mae\u2019n anodd
  dweud a yw hyn oherwydd y bu Dylan mor ganolog i fyth a hudoliaeth criw Fitzrovia
  yn hytrach nag oherwydd unrhyw agosatrwydd penodol yr oedd yn ei rannu \u00e2 Tambimuttu
  ei hun. Yn wir, crybwyllir Dylan fel arfer fel presenoldeb cadarn yn yr Hog and
  Pound neu yn The Swiss yn Old Compton Street. Nid yw\u2019n siarad, mae e\u2019n
  yfed yn unig. Nid yw byth yn y swyddfa, mae e\u2019 bob amser yn y dafarn.\\nYn
  ail ran y blog hwn, byddwn yn ymchwilio\u2019n ddyfnach i\u2019w perthynas ac i
  arwyddoc\u00e2d llenyddol Tambimuttu yn Llundain. Byddwn hefyd yn darganfod sut
  glaniodd un o gerddi Dylan mewn cynhwysydd anffodus iawn!\\nCharlotte Rogers, Canolfan
  Dylan Thomas\\n[1] Miles, Barry, London Calling, Atlantic Books: London, 2010, p.
  11\\n[2] Williams, Jane, Tambimuttu: Between Two Worlds, Peter Owen: Llundain, 1989,
  pp. vii-xiv\\n[3] Ferris, Paul, Dylan Thomas: The Collected Letters, J M Dent: Llundain,
  2010, p. 413-414\\n[4] Williams, Tambimuttu\\nThis post is also available in: English\"",
  "\"Lleoliad:\\nYstafell Bwyllgora 3 - Senedd\\nDyddiad: Dydd Llun, 3 Hydref 2016\\nAmser:
