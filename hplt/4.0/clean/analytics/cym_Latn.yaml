  amwni) wedi mynd i dafarn a thalu \u00a32.50 i mynd i fewn ac roedd y peint gyntaf
  am un geiniog, a dyma fi''n trafod bod hynny, er ei bod hi''n edrych yn dda, yn
  con. Wedyn dyma fi''n tollti peint Guinness rhywun ar lawr a galw''r boi''n ''miserable
