  o''r cyfarfod (PDF 1MB) Gweld fel (259KB)\\n1.1 Croesawodd y Cadeirydd aelodau''r
  Pwyllgor i\u2019r cyfarfod.\\n1.2 Cafwyd ymddiheuriadau gan Mohammad Asghar. Dirprwyodd
  Paul Davies ar ei rhan.\\n1.3 Hefyd, croesawodd y Cadeirydd ddirprwyaeth o Senedd
  Botswana a fu\u2019n arsylwi rhan o''r cyfarfod o''r oriel gyhoeddus.\\n2.1 Cytunwyd
  ar y cofnodion.\\n3.1 Bu''r Pwyllgor yn holi Syr Derek Jones, yr Ysgrifennydd Parhaol,
  Gawain Evans, y Cyfarwyddwr Cyllid a Peter Kennedy, Cyfarwyddwr Adnoddau Dynol Llywodraeth
  Cymru ynghylch Cyfrifon Cyfunol Llywodraeth Cymru 2015-16.\\n3.2 Cytunodd Syr Derek
  Jones i anfon rhagor o wybodaeth am y materion a ganlyn:\\n\u00b7 I ba raddau y
  mae awdurdodau lleol yn recriwtio pobl allanol sydd \u00e2\u2019r arbenigedd priodol
  ym maes caffael\\n\u00b7 Ffigurau\u2019n ymwneud \u00e2 phrosesau caffael Llywodraeth
  Cymru a sector cyhoeddus Cymru\\n\u00b7 Eglurhad o\u2019r amrywiadau yn y tanwariant
  o \u00a3153 miliwn yn y Gr\u0175p Iechyd a Gwasanaethau Cymdeithasol, fel y\u2019i
  nodir yn nhabl y Crynodeb o''r Alldro, ac effaith y tanwariant yng Nghwmpas Iechyd
  a Gwasanaethau Cymdeithasol pe na bai dau o\u2019r cyrff iechyd wedi gorwario (ynghyd
  ag effaith penderfyniad Llywodraeth Cymru i roi arian ychwanegol i ddau fwrdd iechyd
  a oedd wedi gorwario ac effaith hyn ar y gofyniad arian parod)\\n\u00b7 Cyfeirio\u2019r
  Pwyllgor at lincs lle caiff rhagor o wybodaeth (gohebiaeth flaenorol) am Gronfa
  Risg Cymru\\n\u00b7 Hysbysu''r Pwyllgor am y camau disgyblu posibl yn ymwneud \u00e2
  thalu\u2019r swm ofer o \u00a31. 25m\\nSut y caiff rhwymedigaethau cyfyngedig a
  heb eu meintoli eu cyfrifo o ran eglurder\\n4.1 Derbyniwyd y cynnig.\\n5.1 Trafododd
  yr aelodau\u2019r dystiolaeth a ddaeth i law yn ystod y broses o graffu ar gyfrifon
  2015-16.\\nGan nad oedd y tyst a oedd i fod yn bresennol yn y cyfarfod ar 10 Hydref
  ar gael, cytunodd y Pwyllgor i ohirio busnes nes y gall tyst fod yn bresennol ar
  14 Tachwedd.\\nBydd y Cadeirydd i ffwrdd ar fusnes y Cynulliad ar 17 Hydref a galwodd
  ar yr aelodau i enwebu cadeirydd dros dro ar gyfer y cyfarfod ar 17 Hydref, a hynny
  o dan Reolau Sefydlog 17.22 a 18.6. Enwebwyd Rhun ap Iorwerth gan Rhiannon Passmore
  ac fe''i hetholwyd.\"", "\"Castio Die Alwminiwm\\nArwynebau Dosbarth-A- Rydym wedi
  meistroli dylunio a gweithgynhyrchu rhannau ag arwynebau modurol dosbarth-A y gellir
  eu drychau neu eu paentio.\\nGostyngiad pwysau- Mae castio marw alwminiwm yn darparu''r
  cydbwysedd gorau posibl o gryfder, pwysau a chost mewn deunydd rhagorol ar gyfer
  cymwysiadau sy''n sensitif i bwysau sy''n gofyn am wydnwch a chryfder.\\nCywirdeb
  dimensiwn a sefydlogrwydd- Mae castio alwminiwm yn cynhyrchu rhannau sy''n wydn,
  yn sefydlog ac yn cadw goddefiannau agos.\\nCynhyrchu cyflym- Mae castio marw alwminiwm
  yn darparu siapiau cymhleth, goddefiannau da na llawer o brosesau cynhyrchu m\u00e0s
  eraill.Ychydig neu ddim peiriannu sydd ei angen i gynhyrchu miloedd o gastiau union
  yr un fath.\\nGwasgariad Gwres- Mae gan alwminiwm cast marw y nodweddion hyblygrwydd
  dimensiwn a gwasgariad gwres.\\nGoddefgarwch Gwres- Gall rhannau cast marw gyd-fynd
  \u00e2''r cymhlethdod a geir mewn plastigau gor-lwydni wrth weithredu''n effeithiol
  mewn sefyllfa gwres uchel.\\nCryfder a phwysau- Mae rhannau alwminiwm cast pwysau
  yn darparu cryfder da na mowldio chwistrellu plastig ar gyfer yr un dimensiynau.\\nTechnegau
  gorffen lluosog- Mae FUERD yn darparu arwynebau llyfn neu weadog i rannau cast marw
  alwminiwm y gellir eu platio, eu gorchuddio neu eu gorffen yn hawdd gydag ychydig
  iawn o baratoi arwyneb.\\nCynulliad Syml- Gall castiau marw alwminiwm fod yn elfennau
  cau annatod, fel penaethiaid a stydiau.Mae integreiddio edafedd yn y cyfnod dylunio
  llwydni yn dileu caewyr ychwanegol ar brosesau cydosod.Mae tabiau a phenaethiaid
  integredig a nodweddion cofrestru yn lleihau''r cyfrif rhan ac ansawdd y cydosod
  yn dda ymhellach.\\nDewis aloi- Mae dewis yr aloi alwminiwm cywir ar gyfer y cais
  a dylunio''r gydran i fanteisio ar nodweddion yr aloi a''r broses cast marw yn caniat\u00e1u
  i OEMs fedi manteision llawn alwminiwm mewn llawer o gymwysiadau, megis A360, A380,
  ACD12.\\nGwrthsefyll Cyrydiad- Mae alwminiwm yn cynnig manteision amlwg dros ddeunyddiau
  amgen, mewn cymwysiadau sy''n mynnu goddefgarwch uchel i amgylcheddau cyrydol.Mae
  rhannau alwminiwm yn darparu''r gwydnwch cyfunol gorau yn erbyn halen, d\u0175r
  ac UV, o''u cyfuno \u00e2''r dechnoleg cotio gywir ar gyfer y cais - difrod.\"",
  "\"\u25a0 \u0175. R''hif XXIX.] [Mai 1, 1883. EN GENHADOL CHWARTEROL Y GYMDEITHAS
  EB LLEDAENU YB EFENGYL. DELHI. EGLWYS ST. STEPHEN, DELHI. *7 Deliii yw uii or dinasoedd
