sample: '["\"Uncategorized\\n-\\nMae Elder Hopi Yn siarad \u201cYr ydych wedi bod
  yn dweud wrth y bobl mai dyma''r Awr ar ddeg, erbyn hyn mae''n rhaid i chi fynd
  yn \u00f4l a dweud wrth y bobl mai dyma''r Awr. Ac mae yna bethau i''w hystyried
  . . . Ble dych chi''n byw? Beth wyt ti''n gwneud? Beth yw eich perthnasoedd? Ydych
  chi mewn perthynas iawn? Ble mae eich d\u0175r? Adnabod eich gardd. Mae''n bryd
  siarad eich Gwirionedd. Creu eich cymuned. Byddwch yn dda i''ch gilydd. A pheidiwch
  ag edrych y tu allan i''ch hun am yr arweinydd.\u201d Yna cydiodd yn ei ddwylo gyda''i
  gilydd, gwenodd, a dywedodd, \u201cGallai hyn fod yn amser da!\u201d \u201cMae afon
  yn llifo yn awr iawn\u2026\\n-\\nMae''r swydd hon yn cael ei ysbrydoli gan y gerdd
  gan Wendell Berry, Mae Heddwch Pethau Gwyllt. Im ''ar hyn o bryd yn teimlo''n anobeithiol
  ac trafferthu gyson gan feddwl am y ddynoliaeth yn y dyfodol yn ei wneud am ei hunan.
  Rwy''n teimlo ei gynnal ar ymyl dibyn yn emosiynol, nid yw hwn yn gyflwr naturiol
  i mi gan fy mod yn credu bod y gwydr bob amser yn llawn, erioed y optimist tragwyddol
  efallai y byddwch yn dweud. Felly pam ydw i''n ar waith emosiynol hon ar hyn o bryd?
  nid oes dim wedi newid yn fy mywyd, Im ''yn anrhydedd i fod y cyd-gofalwr o fferm
  ar raddfa ddynol fechan yng nghanol Ffrainc ar hyd ochr Fiona fy ngwraig gwych ers
  2002. We have food in abundance\u2026\\n-\\nMae''r Eginblanhigyn Yma yn y dyfnderoedd
  tywyll o farwolaeth l\u00f4m gorau''r Ddaear a dirywiad yn frenin, a phob math o
  wrigglers grwydro. Ond yma hefyd y daw genedigaeth ac aileni; chwyrl\u00efo bach,
  gan droi mewn hedyn miniscule; wrth i tendrils meddal cyntaf bywyd gyrraedd yr haul,
  pridd maetholion ymdrochi hwn cain, newydd, un ifanc. \u201cMae angen ein gilydd\u201d
  whisper the fungi that swap sugar for ions; am aeons maen nhw wedi cofleidio gwreiddiau
  planhigion; gweoedd myseliwm yn gweu trwy briddoedd, hwmws ac egin. Then mycorrhizal
  bacteria fix nitrogen and shake hands with plants. Cyfnewid ynni - mae bargen wedi''i
  tharo. \u201cAll this symbiotic magic down in this\u2026\\n-\\nCawsom hyn yn y post
  y bore yma, ac rydym yn cyffwrdd iawn bod rhai pobl yn deall ein bywydau. Diolch
  yn fawr i bawb a ddaeth yma eleni, ac wedi buddsoddi eu hunain yn ein bywydau a''n
  ffordd o fyw, rydym yn gobeithio y byddwch yn cymryd i ffwrdd yr un teimladau \u00e2
  Michelle. Cariad a diolch i chi i gyd.\\n-\\nOK nid yw''n rhad ac am ddim i bawb!
  ond gallai un person fod enillydd lwcus cwrs Tystysgrif Dylunio Permaddiwylliant
  am ddim yn 2016 drwy gyfrwng raffl! All you have to do to enter is like our Face
  Book Page and get your friends to like it too, unwaith y byddwn gyrraedd 1000 likes
  we will randomly pick one of the people who likes our page and give them a gift
  certificate to attend one of our Permaculture Design Certificate courses. Gall yr
  enillydd lwcus ddefnyddio eu hunain neu anrheg i ffrind neu aelod o''r teulu, we
  will publish the name of the lucky winner both here\u2026\\n-\\nPermaddiwylliant,
  \\\"Arsylwi & rhyngweithio \\\"Byddaf yn meiddio dweud y gallwch alw yn ffaith bod\\\"
  Beauty yn y llygad y gw\u00eal \\\"\\\" dal a storio ynni \\\"heb edrych dros eich
  ysgwydd. \\\"Gwnewch gwair tra bod yr haul yn tywynnu\\\" & \u201cObtain a yield\u201d
  \u201cYou can\u2019t work on an empty stomach\u201d a whole day on the field. Bydd
  rhaid i chi \\\"yn berthnasol hunanreoleiddio & derbyn adborth \\\"Os byddwch yn
  ni fydd ein presenoldeb yn y pen draw yn ergyd yn \u00f4l. \\\"Mae pechodau y tad
  yn cael ymweliad ar y plant yn y seithfed genhedlaeth\\\" Mae''n bryd i ddynoliaeth
  i ddod allan chwyldro heddychlon. \\\"Defnyddio a gwerth adnoddau adnewyddadwy &
  services\u201d \u201cLet nature\u2026\\n-\\nBeachwood fires are bright and clear
  If the logs are kept a year, Unig da Chestnut yn maent yn ei ddweud, Os, am TIS
  logiau ''a osodwyd i ffwrdd. Wneud t\u00e2n o goed Elder, Bydd Marwolaeth o fewn
  eich t\u0177 fod yn; Ond mae onnen newydd neu ludw hen, Is fit for a queen with
  crown of gold Birch and fir logs burn too fast Blaze up bright and do not last,
  it is by the Irish said Hawthorn bakes the sweetest bread. Elm pren yn llosgi fel
  llwydni fynwent, E\u2019en the very flames are cold But ash green or ash brown Is
  fit for a queen with golden crown Poplar gives a bitter smoke, Fills\u2026\\nRhaid
  i chi fod mewngofnodi i postio sylw.\"", "\"Ffilm ddrama llawn cyffro gan y cyfarwyddwr
  Orhan Aksoy yw \u015eafakta Bulu\u015fal\u0131m a gyhoeddwyd yn 1975. Fe''i cynhyrchwyd
  yn Nhwrci. Sgwennwyd y sgript yn wreiddiol yn Tyrceg a hynny gan Safa \u00d6nal.\\nY
  prif actorion yn y ffilm hon yw C\u00fcneyt Ark\u0131n, H\u00fcseyin Zan, G\u00fcl\u015fen
  Bubiko\u011flu, Hakk\u0131 K\u0131van\u00e7, Zeki Sezer, Ekrem D\u00fcmer, Atilla
  Erg\u00fcn a Kenan Pars. Cafodd ei ffilmio mewn lliw.\\nFel y nodwyd, cyhoeddwyd
  y ffilm yn 1975. Ffilm fwyaf poblogaidd y flwyddyn honno oedd One Flew Over the
  Cuckoo''s Nest sef ffilm gan Milos Forman am ysbyty meddwl. Hyd at 2022 roedd o
  leiaf 2,660 o ffilmiau Tyrceg wedi gweld golau dydd. Mae''r ffilm hon wedi''i seilio
  ar waith cynharach, The Summertime Killer, sef ffilm gan y cyfarwyddwr Antonio Isasi-Isasmendi
  a gyhoeddwyd yn 1972.\\nGanwyd y cyfarwyddwr ffilm Orhan Aksoy ar 10 Ionawr 1930
  ym Mustafakemalpa\u015fa a bu farw yn Istanbul ar 31 Mai 1999.\\nCyhoeddodd Orhan
  Aksoy nifer o ffilmiau gan gynnwys y canlynol:\\nRhestr Wicidata:\"", "\"9.\u2014(1)
  Caiff yr Asiantaeth awdurdodi unrhyw unigolyn (boed yn aelod o''i staff neu beidio)
  i arfer y pwerau a bennir ym mharagraff (4) at ddibenion cyflawni ei swyddogaeth
  o dan reoliad 7 mewn perthynas ag unrhyw awdurdod gorfodi.\\n(2) Ni chaniateir i
  unrhyw awdurdodiad o dan y rheoliad hwn gael ei ddyroddi ac eithrio yn unol \u00e2
  phenderfyniad a gymerwyd gan yr Asiantaeth ei hun neu gan bwyllgor, is-bwyllgor
  neu aelod o''r Asiantaeth sy''n gweithredu ar ran yr Asiantaeth.\\n(3) Rhaid i awdurdodiad
  o dan y rheoliad hwn fod yn ysgrifenedig a chaniateir iddo gael ei roi yn ddarostyngedig
  i unrhyw gyfyngiadau neu amodau a bennir yn yr awdurdodiad (gan gynnwys amodau sy''n
  ymwneud \u00e2 rhagofalon hylendid sydd i''w cymryd tra''n arfer pwerau yn unol
  \u00e2''r awdurdodiad).\\n(4) Caiff person awdurdodedig \u2014\\n(a)mynd i mewn
  i unrhyw fangre a grybwyllir ym mharagraff (5) ar unrhyw adeg resymol er mwyn arolygu''r
  fangre neu unrhyw beth a geir ynddi;\\n(b)cymryd samplau o unrhyw eitemau neu sylweddau
  a geir ar y fangre honno;\\n(c)arolygu a chop\u00efo unrhyw gofnodion a geir ar
  y fangre honno (ac, os ydynt yn cael eu cadw ar ffurf gyfrifiadurol, ei gwneud yn
  ofynnol iddynt gael eu rhoi ar gael ar ffurf ddarllenadwy);\\n(ch)ei gwneud yn ofynnol
  i unrhyw berson sy''n bresennol ar y fangre honno ddarparu iddo unrhyw gyfleusterau,
  unrhyw gofnodion neu wybodaeth ac unrhyw gymorth arall y bydd yn gofyn yn rhesymol
  amdanynt.\\n(5) Y fangre y caiff person awdurdodedig fynd i mewn iddi yw \u2014\\n(a)unrhyw
  fangre sydd wedi''i meddiannu gan yr awdurdod gorfodi;\\n(b)unrhyw labordy neu fangre
  debyg lle mae gwaith sy''n gysylltiedig \u00e2 gorfodi unrhyw ddeddfwriaeth berthnasol
  wedi''i gyflawni i''r awdurdod gorfodi; ac\\n(c)unrhyw fangre arall (nad yw''n dy
  annedd preifat) y mae gan y person awdurdodedig sail resymol dros gredu ei bod yn
  fangre y mae pwerau gorfodi''r awdurdod gorfodi yn arferadwy (neu wedi bod yn arferadwy)
  ar ei chyfer.\\n(6) Mae''r p\u0175er a roddwyd i berson awdurdodedig i fynd i mewn
  i fangre yn cynnwys p\u0175er i fynd ag unrhyw berson arall y mae''n barnu ei fod
  yn briodol gydag ef.\\n(7) Os gofynnir iddo wneud hynny, rhaid i berson awdurdodedig
  \u2014\\n(a)dangos ei awdurdodiad cyn arfer unrhyw bwerau o dan baragraff (4); a\\n(b)darparu
  dogfen sy''n enwi unrhyw sampl a gymerwyd, neu ddogfennau a gop\u00efwyd, o dan
  y pwerau hynny.\\n(8) Os bydd person, sy''n mynd i mewn i unrhyw fangre yn rhinwedd
  yr adran hon, yn datgelu i unrhyw berson unrhyw wybodaeth a gafwyd ar y fangre o
  ran unrhyw gyfrinach fasnachol, bydd y person hwnnw yn euog o dramgwydd, oni bai
  ei fod wedi''i datgelu wrth gyflawni ei ddyletswydd.\\n(9) Os yr Asiantaeth yw''r
  awdurdod gorfodi o ran deddfwriaeth archwilio berthnasol, mae''r rheoliad hwn, gan
  hepgor paragraff (5)(a), yn gymwys o ran yr Asiantaeth (mewn perthynas \u00e2''i
  pherfformiad o ran gorfodi''r darpariaethau hynny).\\n(10) Yn y rheoliad hwn ystyr
  \u201cperson awdurdodedig\u201d yw person sydd wedi''i awdurdodi o dan y rheoliad
  hwn.\"", "\"Yr Wyddgrug Bathtub Chwistrellu Plastig\\nC: Pa wasanaethau ydych chi''n
  eu darparu?\\nA: Rydym yn cynhyrchu mowldiau chwistrellu plastig ac yn cynhyrchu
  rhannau chwistrellu plastig ar gyfer samplu a chynhyrchu swmp.Rydym hefyd yn darparu
  gwasanaethau dylunio llwydni.\\nC: Sut alla i gysylltu \u00e2 chi?\\nA: Gallwch
  anfon ymholiad atom trwy e-bost, WhatsApp, Skype neu Wechat.Byddwn yn ymateb i chi
  o fewn 24 awr.\\nC: Sut alla i gael dyfynbris?\\nA: Ar \u00f4l derbyn eich RFQ,
  byddwn yn ymateb i chi o fewn 2 awr.Yn eich RFQ, darparwch y wybodaeth a''r data
  canlynol er mwyn i ni anfon prisiau cystadleuol atoch yn seiliedig ar eich gofynion.a)
  Lluniau rhan 2D ar ffurf PDF neu JPG a lluniadau rhan 3D yn UG, PRO/E, SOLIDWORKS,
  CATIA, CAD, STP, X_T, IGS, PRT, DWG, neu DXFb) Gwybodaeth resin (Taflen Ddata)c)
  Gofyniad maint blynyddol ar gyfer rhannau\\nC: Beth fyddwn ni''n ei wneud os nad
  oes gennym ni luniadau rhannol?\\nA: Gallwch chi anfon eich samplau rhan plastig
  neu luniau atom gyda dimensiynau a gallem ddarparu ein datrysiadau technegol i chi.Byddwn
  yn creu.\\nC: A allwn ni gael rhai samplau cyn cynhyrchu m\u00e0s?\\nA: Ydw, byddwn
  yn anfon samplau atoch i''w cadarnhau cyn dechrau cynhyrchu m\u00e0s.\\nC: Oherwydd
  gwahaniaeth amser gyda Tsieina a thramor, sut alla i gael gwybodaeth am gynnydd
  fy archeb?\\nA: Bob wythnos rydym yn anfon adroddiad cynnydd cynhyrchu wythnosol
  gyda lluniau digidol a fideos sy''n dangos y cynnydd cynhyrchu.\\nC: Beth yw eich
  amser arweiniol?\\nA: Ein leadtime safonol ar gyfer cynhyrchu llwydni yw 4 weeks.For
  rhannau plastig yn 15-20 diwrnod yn dibynnu ar faint.\\nC: Beth yw eich tymor talu?\\nA:
  50% fel blaendal taliad, bydd balans o 50% yn cael ei dalu cyn ei anfon.Am swm bach,
  rydym yn derbyn Paypal, bydd comisiwn Paypal yn cael ei ychwanegu at y gorchymyn.Ar
  gyfer swm mawr, mae''n well T / T\\nC: Sut alla i warantu ein hansawdd?\\nA: Wrth
  wneud llwydni, rydym yn cynnal archwiliad deunydd a rhan.Yn ystod cynhyrchu rhan,
  rydym yn cynnal arolygiad ansawdd llawn 100%.\\ncyn pecynnu a gwrthod pob rhan nad
  yw''n unol \u00e2''n safon ansawdd neu''r ansawdd a gymeradwywyd gan ein cleient.\"",
  "\"Module LCS-3020:\\nIaith Sbaeneg 2 (Is Bwnc)\\nModule Facts\\nRun by School of
  Languages, Literatures and Linguistics\\n20 Credits or 10 ECTS Credits\\nSemester
  1 & 2\\nOrganiser: Dr Helena Miguelez-Carballeira\\nOverall aims and purpose\\n-
  Atgyfnerthu meysydd allweddol gramadeg uwch.\\n- Datblygu ymhellach sgiliau cyfieithu
  uwch mewn profion i''r iaith darged ac o''r iaith darged.\\n- Hyrwyddo defnydd priodol
  o arddull a chywair mewn gwaith ysgrifenedig.\\n- Datblygu a mireinio sgiliau uwch
  wrth wneud tasgau aralleirio ac ysgrifennu traethodau ffurfiol strwythuredig. Bydd
  myfyrwyr ar y modiwl hwn yn gweithio tuag at ennill C1/C2 ar y Fframwaith Cyfeirio
  Ewropeaidd Cyffredin ar gyfer Ieithoedd.\\nCourse content\\nMae''r modiwl 20 credyd
  hwn sy''n para trwy''r flwyddyn yn hyrwyddo defnydd priodol o arddull a chywair
  ym mhob darn o waith ysgrifenedig ac yn sicrhau bod myfyrwyr yn gallu ymdrin ag
  amrywiadau cywair a mynegiant idiomatig mewn modd hyderus a chywir. Trwy ddarllen
  testunau amrywiol a gweld strwythurau gramadegol cymhleth, mae myfyrwyr yn meithrin
  sgiliau darllen ac ysgrifennu sy''n cyfateb i safon myfyrwyr iaith yn eu blwyddyn
  olaf.\\nNid oes testun gosod ar gyfer y modiwl iaith hwn, ond caiff myfyrwyr eu
  hannog yn gryf i brynu copi o''r llyfrau canlynol i''w hastudio''n annibynnol: Butt,
  John and Carmen Benjamin (2011) A New Reference Grammar of Modern Spanish, London
  and Oxford: Arnold. Pountain, Christopher, Teresa de Carlos and Angela Howkins (2011)
  Practicing Spanish Grammar: A Workbook, London & Oxford: Arnold. Unrhyw adnoddau
  dysgu eraill. Rhoddir dwy ffeil modiwl i''r myfyrwyr ar ddechrau''r flwyddyn sy''n
  cynnwys yr holl ddeunyddiau sydd eu hangen ar gyfer eu dosbarthiadau. Anogir myfyrwyr
  i gwblhau Portffolio Hunan-astudio''r Ysgol (sydd ar gael o wefan yr Ysgol)\\nAssessment
  Criteria\\nthreshold\\n40-49%: I ennill credyd, rhaid i''r myfyrwyr ddangos gallu
  cyffredinol ym mhob un o''r sgiliau a brofir.\\ngood\\n50-69%: Bydd y myfyrwyr yn
  dangos ystod dda o eirfa, gallu gramadegol eang a''r gallu i''w mynegi eu hunain
  yn effeithiol ymhob un o''r sgiliau angenrheidiol.\\nexcellent\\n70+%: Bydd yr ymgeiswyr
  gorau yn dangos galluoedd sy''n ymylu ar fod yn rhai siaradwr brodorol ym mhob un
  o''r sgiliau a brofir, gyda lefel uchel o hyder a dawn wrth eu mynegi eu hunain,
  ac yn defnyddio''r agweddau technegol ar yr iaith mewn modd sydd, i raddau helaeth,
  yn naturiol.\\nLearning outcomes\\n-\\n- Darllen a deall testunau cymhleth mewn
  amrywiol arddulliau, tonau a chyweiriau ac ysgrifennu sylwadau cryno a rhugl am
  y testunau hynny.\\n-\\n- Dangos yn y traethodau a''r gwaith cyfieithu afael soffistigedig
  ar Sbaeneg a Chymraeg/Saesneg sy''n effro i ystod rethregol y ddwy iaith.\\nAssessment
  Methods\\nTeaching and Learning Strategy\\nTransferable skills\\n- Literacy - Proficiency
  in reading and writing through a variety of media\\n- Computer Literacy - Proficiency
  in using a varied range of computer software\\n- Self-Management - Able to work
  unsupervised in an efficient, punctual and structured manner. To examine the outcomes
  of tasks and events, and judge levels of quality and importance\\n- Exploring -
  Able to investigate, research and consider alternatives\\n- Information retrieval
  - Able to access different and multiple sources of information\\n- Inter-personal
  - Able to question, actively listen, examine given answers and interact sensitevely
  with others\\n- Self-awareness & Reflectivity - Having an awareness of your own
  strengths, weaknesses, aims and objectives. Able to regularly review, evaluate and
  reflect upon the performance of yourself and others\\nCourses including this module\\nCompulsory
  in courses:\\n- T113: BA Chinese & French with Spanish year 4 (BA/CHFS)\\n- T116:
  BA Chinese & German with Spanish year 4 (BA/CHGS)\\n- T119: BA Chinese & Italian
  with Spanish year 4 (BA/CHIS)\\n- R913: BA French & German with Spanish year 4 (BA/FGS4)\\n-
  R919: BA French & Italian with Spanish year 4 (BA/FIS4)\\n- R924: BA German & Italian
  with Spanish year 4 (BA/GIS4)\"", "\"Fformiwla Strwythurol: 2KHSO5\u2022 KHSO4\u2022
  K2SO4\\nRhif CAS: 70693-62-8\\nPwysau Moleciwlaidd: 614.7\\nDisgrifiad\\nHalen gwyn,
  crisialog, heb arogl, sy''n llifo''n rhydd sy''n cynnwys monopersylffad potasiwm,
  Potasiwm Sylffad a Potasiwm Bisulfate.Mae PMPS yn cael adwaith asid cryf mewn hydoddiant
  dyfrllyd.O ganlyniad i''w botensial ocsideiddio uchel ac effeithiolrwydd microbiolegol,
  gellir ei ddefnyddio ar gyfer nifer fawr o wahanol gymwysiadau.Mae ganddo''r fantais
  arbennig o fod yn sefydlog iawn o ran storio, yn hawdd ac yn ddiogel i''w drin,
  yn rhydd o glorin ac o gael adweithedd uchel.\\nData technegol\\nCais\\nStorio\\nRhaid
  storio PMPS o dan amodau sych.Mae''n rhaid ei amddiffyn rhag golau haul uniongyrchol
  a rhag unrhyw ffynonellau gwres eraill.\\nCludiant\\nRhif y Cenhedloedd Unedig:
  UN3260.\\nEnw cludo cywir y Cenhedloedd Unedig: CORROSIVE SOLID, ASIDIC, INORGANIC,
  NOS (Yn cynnwys cyfansawdd monopersylffad).\\nDosbarth(au) peryglon trafnidiaeth:
  8.\\nGr\u0175p pecynnu: PG II.\\nPecynnu Safonol\\nY pecyn safonol yw bag 25 kg
  Allanol PP + PE Mewnol, neu yn unol \u00e2 chais y cwsmer.\"", "\"Defosiwn Dyddiol
  MEC - 14 Mai 2020\\nUpdated: May 20\\n''Gyfaill, tyrd yn uwch.''\\nLuc 14:10\\nMae
  bod yn falch yn cael ei ystyried yn rhinwedd bellach yn ein cymdeithas. Arwydd o
  lwyddiant yw ein bod yn ymfalch\u00efo yn ein cyraeddiadau. \u2018Wedi\u2019r cyfan,\u2019
  dywedir, \u2018os dio gen ti dangosa fo\u2019. Ond serch hynny, onid oes rhywbeth
  hyll iawn yngl\u0177n \u00e2\u2019r person sy\u2019n llawn o\u2019i bwysigrwydd
  ei hun? Mae\u2019n amlwg bod yr hyn sy\u2019n wir heddiw wedi bod yn wir hefyd yn
  nyddiau Iesu \u2013 does fawr dim wedi newid dros y 2,000 blynedd diwethaf o safbwynt
  y natur ddynol.\\nUn dydd Saboth aeth Iesu i gyd-fwyta gyda gwesteion eraill yn
  nh\u0177 rhyw Pharisead. Nid Pharisead cyffredin mo hwn ond arweinydd yn eu plith
  \u2013 y pwysica o\u2019r pwysigion. Ac wrth i bobl gymryd eu lle wrth y bwrdd yng
  nghartref y dyn sylwodd Iesu fod rhyw ymrafael hyll am y mannau o anrhydedd i\u2019w
  weld.\\nGallwn yn hawdd ddychmygu\u2019r olygfa wrth i bobl ymwthio heibio\u2019i
  gilydd yn slei bach i fachu lle yn y safle roedden nhw\u2019n tybio oedden nhw\u2019n
  ei haeddu. Wedi llwyddo i sicrhau y llefydd gorau posibl lled orweddodd pawb yn
  barod i fwyta. Ond yn lle bwyd yr hyn gawson nhw oedd dameg oedd yn ddrych o\u2019u
  hymddygiad. Mae\u2019r hanes i\u2019w gael yn Luc 14:7\u201310:\\nYna adroddodd
  ddameg wrth y gwesteion, wrth iddo sylwi sut yr oeddent yn dewis y seddau anrhydedd:
  \\\"Pan wahoddir di gan rywun i wledd briodas, paid \u00e2 chymryd y lle anrhydedd,
  rhag ofn ei fod wedi gwahodd rhywun amlycach na thi; oherwydd os felly, daw''r sawl
  a''ch gwahoddodd chwi''ch dau a dweud wrthyt, ''Rho dy le i hwn'', ac yna byddi
  dithau mewn cywilydd yn cymryd y lle isaf. Yn hytrach, pan wahoddir di, dos a chymer
  y lle isaf, fel pan ddaw''r gwahoddwr y dywed wrthyt, ''Gyfaill, tyrd yn uwch'';
  yna dangosir parch iti yng ng\u0175ydd dy holl gyd-westeion.\\nAdroddodd Iesu\u2019r
  ddameg hon, nid yn unig er mwyn ceisio gwella sut roedd pobl yn ymddwyn wrth fwyta,
  ond i dynnu sylw at y pechod o falchder ac i danlinellu sut mae Duw\u2019n ymwneud
  \u00e2 ni bobl bechadurus. Daw hyn yn amlwg yn y geiriau sy\u2019n dilyn y stori
  fechan hon, \u2018Oherwydd darostyngir pob un sy\u2019n ei ddyrchafu ei hun, a dyrchefir
  pob un sy\u2019n ei ddarostwng ei hun.\u2019 (ad.11)\\nDrwy ostwng ein hunan y mae
  Duw yn ein dyrchafu. Nid crefyddwyr rhagrithiol sy\u2019n gwedd\u00efo er mwyn cael
  eu gweld yw\u2019r rhai y mae Duw yn eu derbyn, yn hytrach pechaduriaid sydd wedi\u2019u
  darostwng ac sy\u2019n galw allan am drugaredd sy\u2019n derbyn ei faddeuant. Nid
  y balch sy\u2019n dod at droed y groes ond y pechadur diymadferth sy\u2019n ymwybodol
  iawn o\u2019i angen. Ein problem fawr mor aml yw\u2019r tueddiad sydd ynom i wthio\u2019n
  hunain yn uwch, hyd yn oed tra ar yr un pryd yn ceisio rhoi\u2019r argraff ein bod
  yn isel.\\nOnd mae hon yn ffordd ff\u00f4l iawn o fyw. Onid llawer gwell yw bod
  yn ddarostyngedig a chydnabod ein pechod o flaen y Duw sanctaidd, na cheisio ymddangos
  felly\u2019n unig. Oherwydd pan fyddwn yn plygu\u2019n isel rydym yn y lle priodol
  i glywed y geiriau grasol, \u2018Gyfaill, tyrd yn uwch.\u2019\\nSam Oldridge, Borras
  Park\"", "\"Datganiadau i''r Wasg 2014-2015\\nDewch i ddarganfod Prifysgol Cymru
  Y Drindod Dewi Sant, Caerfyrddin\\n03.02.2015\\nBydd Prifysgol Cymru Y Drindod Dewi
  Sant (PCYDDS) yn cynnal Diwrnod Agored ar ei champws yng Nghaerfyrddin ddydd Sadwrn,
  7 Chwefror.\\nMae dod i Ddiwrnod Agored yn ffordd ardderchog i ddarpar fyfyrwyr
  ddysgu mwy am y Brifysgol a\u2019r amrywiol raglenni sydd ar gael. Gall y rhai sy\u2019n
  dod hefyd ddarganfod mwy am fywyd myfyrwyr yng Nghaerfyrddin trwy siarad \u00e2
  myfyrwyr cyfredol a chael taith o amgylch y campws.\\n\u201cCaiff ymwelwyr gyfle
  i ofyn cwestiynau ac i gwrdd \u00e2\u2019r staff academaidd i drafod opsiynau o
  ran cyrsiau, gofynion derbyn ac i ddysgu mwy am y cyrsiau sydd o ddiddordeb ichi,\u201d
  meddai Melanie Jones, Swyddog Marchnata Gweithredol: Ysgolion a Cholegau yn y Brifysgol.\\n\u201cByddwch
  yn gallu siarad \u00e2 swyddogion cyllid y Brifysgol i ddysgu am gostau Addysg Uwch
  a\u2019r cymorth ariannol sydd ar gael, ac fe gewch gyfle i gwrdd \u00e2\u2019r
  t\u00eem Cymorth Dysgu i drafod unrhyw gymorth dysgu arbennig sydd ei angen arnoch,\u201d
  ychwanegodd.\\nYn ogystal \u00e2 dysgu mwy am gyrsiau a chyllid, mae\u2019r Diwrnod
  Agored yn ffordd wych i ddarpar fyfyrwyr gael ymdeimlad o naws y campws a\u2019r
  ardal gyfagos. Caiff yr ymwelwyr gyfle i ymgyfarwyddo \u00e2 thref farchnad fywiog
  Caerfyrddin a\u2019r holl amrywiaeth sydd gan Sir Gaerfyrddin i\u2019w gynnig.\\nYn
  ystod y dydd, bydd cyfleoedd i fynd am dro o amgylch y campws; gweld y cyfleusterau
  sydd ar gael ac i weld y neuaddau preswyl.\\nMae rhagor o wybodaeth am brofiad myfyrwyr
  yn PCYDDS ar gael trwy flogiau myfyrwyr, sydd i\u2019w gweld ar www.uwtsd.ac.uk/cy/fystori.
  Yn ogystal gall darpar fyfyrwyr gysylltu \u00e2 myfyrwyr presennol ar-lein i gael
  sgwrs \u00e2 nhw am fywyd ar gampws Caerfyrddin.\\nI gael rhagor o wybodaeth am
  y Diwrnod Agored neu i gofrestru\u2019ch diddordeb, ewch i www.uwtsd.ac.uk/cy/ymweld\\nNodyn
  i''r Golygydd\\n- Sefydlwyd Prifysgol Cymru Y Drindod Dewi Sant yn 2010 trwy uno
  Prifysgol Cymru Llanbedr Pont Steffan a Choleg Prifysgol y Drindod, Caerfyrddin.
  Ar 1 Awst 2013 ymunodd Prifysgol Fetropolitan Abertawe \u00e2\u2019r Brifysgol.\\n-
  Siartr Frenhinol y Brifysgol (1828) yw\u2019r hynaf yng Nghymru, a hon yw\u2019r
  drydedd hynaf yng Nghymru a Lloegr ar \u00f4l Rhydychen a Chaergrawnt. EUB Tywysog
  Cymru yw Noddwr y Brifysgol.\\n- Ar 1 Awst, 2013 ymunodd Coleg Sir G\u00e2r \u00e2
  Gr\u0175p Prifysgol Cymru Y Drindod Dewi Sant, fodd bynnag byddant yn cadw eu brand
  eu hun. Daeth Coleg Ceredigion yn rhan o\u2019r Gr\u0175p ar 1 Ionawr 2014.\\nGwybodaeth
  Bellach\\nI gael rhagor o wybodaeth, cysylltwch \u00e2 Sara Jones, Swyddog Cysylltiadau
  Cyhoeddus a Chyfathrebu, ar 07449 998478 neu anfonwch e-bost at sara.f.jones@pcydds.ac.uk\"",
  "\"gioved\u00ec, dicembre 29, 2005\\n2005\\nMae''r amser wedi dod imi edrych dros
