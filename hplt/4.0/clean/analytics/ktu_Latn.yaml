sample: '["\"1/KINSHASA : yau zibukaka kilumbu ya ntete kisadilu sambu na kuteka ya
  mbote na pweleleto march\u00e9 public na munkufi ba ke bokila yau SGMAP;\\n2/BUNIA
  : Bantu kumi na iya me monaka lufwa na bumvuanzi kotisilaka bau binuani ya CODECO
  na localit\u00e9 Lodjo na territoire ya Djugu na kizunga Ituri;\\n3/ MBUJI MAYI
  : na kasasi Oriental , kukondwa nguizani me kota na territoire ya Tshilenge , bantu
  iya lwadisamaka na bantu iya mpe ba inzo mingi zikisamaka tiya , ntalu nayau me
  zabana ntete ve/sites/default/files/2022-08/300822-p-a-d-journalkikongomatin-00.mp3\"",
  "\"1/ Kinshasa : Inzo ya Moise Katumbi na ya Salomona awa Kinshasa, yambaka bantu
  ya bisalu ya makesa ya kusosa sosa ba nsangu , inki bau monaka kuna nionso na inda
  ya nsangu yai.\\n2/ Mbandaka : Na Bumba, ya kele na kizunga Mongala, maza ya nzadi
  me fuluka katuka ngonda mosi , na ba quartiers ya kele finakani na maza\\n/sites/default/files/2023-06/08062023-p-a-d-journalkikongosoir-00.mp33/
  Goma : Mabuta mingi ya ba policiers ke zingaka na finakani ya boloko ya nene ya
  Munzenze na Goma , fwana katuka na ntoto ina na luzahisu tulaka kinyemo ntuadisi
  ya kizunga .\"", "\"JOURNAL EN KIKONGO DE CE JEUDI 26082021 SOIR\\n1. BUKAVU : Na
  Mwenga ba chinois ke landakana na kutimuna mabanga ya ntalu na kukondwa kuzitisa
  nsiku bakaka ntuadisi ya kizunga\\n2. BUTEMBO: Ba infirmier ya Butembo me vutukila
  kisalankatu kuvingila lukanu ya intersyndical na bau\\n3. BANDUNDU : Bantu ya mabwala
  Nkonde mpe Nkolombeke ke kulala na nganda , inzo na bau /sites/default/files/2021-08/26082021-a-k-journalkikongosoir-00_0.mp3bwaka
  na mvula mpe mupepe lutaka kuna, bau ke lomba na ba mfumu na kubanzila bau\"", "\"1\\nNkanda
  ya mbutukulu ya Yesu\\n1Nkanda ya mbutukulu ya Yesu Klisto, mwana ya Davidi, mwana
  ya Abalahami. Luk. 3:23\\n2Abalahami vandaka tata ya Isaki, Isaki tata ya Yakobi,
  Yakobi tata ya Yuda ye bampangi ya yandi. 1 Mose 21:2; 25:24; 29:35\\n3Yuda ye Tamali
  butaka Pelesi ye Sela, Pelesi tata ya Heselone, Heselone tata ya Lami. 1 Mose 38:27;
  1 Lus. 2:4, 5\\n4Lami tata ya Aminadabi, Aminadabi tata ya Nasoni, Nasoni tata ya
  Salamoni. Luti 4:19\\n5Salamoni ye Lakabi butaka Boasi, Boasi ye Luti butaka Obedi,
  Obedi tata ya Isai.\\n6Isai tata ya Davidi, ntinu, Davidi ye nkento ya vandaka ya
  Ulia butaka Solomo. 1 Sam. 17:12; 2 Sam. 12:24\\n7Solomo tata ya Lehabami, Lehabami
  tata ya Abia, Abia tata ya Asa.\\n8Asa tata ya Yosafati, Yosafati tata ya Yolami,
  Yolami tata ya Usia. 1 Nt. 15:24; 2 Nt. 8:16, 24\\n9Usia tata ya Yotami, Yotami
  tata ya Ahasi, Ahasi tata ya Hiskia. 2 Lus. 26:23; 27:9; 2 Nt. 16:20\\n10Hiskia
  tata ya Manase, Manase tata ya Amoni, Amoni tata ya Yosia. 2 Nt. 20:21; 1 Lus. 3:14;
  2 Lus. 33:25\\n11Yosia tata ya Yekonia ye mpangi ya yandi mu ntangu ya bau natwaka
  ku Babeli. 2 Nt. 23:30, 34; 1 Lus. 3:15, 16\\n12Kulanda ya bau natwaka ku Babeli,
  Yekonia tata ya Sealatieli, Sealatieli tata ya Zelubabeli. 1 Lus. 3:17, 19; Yes.
  3:2; 5:2\\n13Zelubabeli tata ya Abiudi, Abiudi tata ya Eliakimi, Eliakimi tata ya
  Asoli.\\n14Asoli tata ya Sadoki, Sadoki tata ya Akimi, Akimi tata ya Eliudi.\\n15Eluidi
  tata ya Elasali, Elasali tata ya Matani, Matani tata ya Yakobi.\\n16Yakobi tata
  ya Yosefi, bakala ya Malia ya butaka Yesu, ya bingwa Klisto.\\n17Mpilayai bambandu
  yonso tuka Abalahami ti Davidi ikele babandu kumi ye iya; bambandu tuka Davidi ti
  bau; natwaka ku Babeli ikele kumi ye iya; bambandu tuka bau natwaka ku Babeli ti
  Klisto ikele kumi ye iya.\\nLubutuku ya yandi ye nkumbu ya yandi\\n18Lubutuku ya
  Yesu Klisto vandaka mpilyai: Bu ngudi ya yandi Malia silwaka kwa Yosefi, bu bau
  imene kwiza sikamosi ve, yandi monwaka na divumu ya katuka na Mpeve Yanlongo. Luk.
  1:37\\n19Kansi Yosefi bakala ya yandi, sambu na yandi vandaka muntu ya lunungu ye
  zolaka ve kumonisa yandi nsoni nantwala ya bantu, yandi zolaka kubika yandi mu kinsweki.
  5 Mose 24:1\\n20Bu yandi yindulaka mambu yai, tala, wanjo ya Mfumu monikaka kwa
  yandi mu ndozi, kutuba: Yosefi, mwana ya Davidi, tita ve kubaka Malia nkento ya
  nge, kadi yina ya yimitwa mu yandi ikele ya Mpeve Yanlongo.\\n21Yandi tabuta mwana
  bakala, ye nge tabinga nkumbu ya yandi YESU, kadi yandi tavulusa bantu ya yandi
  na masumu ya bau. Luk. 1:31; 2:21; Bis. 4:12; 10:43; 13:38\\n22Mambu yai yonso vandaka,
  na yo lenda maniswa ya Mfumu tubaka mu mbikudi, kutuba:\\n23Tala, nkento ya imene
  kuzaba bakala ve tavanda na divumu ye tabuta mwana bakala; bau tabinga nkumbu ya
  yandi Emanueli, tendula ya yo ikele yai: Nzambi ikele na beto.\\n24Yosefi sikamaka
  na tulu ye salaka mpilamosi wanjo ya Mfumu sikidikisaka yandi, ye bakaka nkento
  ya yandi.\\n25Kansi yandi zabaka yandi ve ti yandi butaka mwana bakala; yandi bingaka
  nkumbu ya yandi YESU.\"", "\"- BENI : Na bansangu yayi, beto ta tubila mavuanga
  ya lutaka mazono na mbanza Beni, na kutala mutindu ya bimvuka yankaka ya nkangu
  lombaka na muntu nionso kubikala na nzo nandi, wapi bisalu nionso ya munkiti kangamaka.\\n-
  BUKAVU : Na mbanza Bukavu, kuna, nsangu kele ya luyantiku ya ndambu ya zole ya kupesa
  mangwele ya kimbefo ya Corona Virus.\\n- KINDU : Na mbanza Kindu, Kisangani bwela
  diaka Butembo, minganga me ndima na kuvutukila kisalu na bau.\\n- BENI-TERRITOIRE
  : Mpe na yau mosi Territoire ya Beni, bimvuka ya nkangu, mpe bimvuka yankaka ya
  ke la ndilaka banswa ya bantu ke pesa nsangu ya kutambula ya bimpumbulu ya ba Adf,
  ya ke na kukatuka na ndambu ya Esete, mpe ya ke na kukwenda na ndambu ya Ouesete
  ya Territoire.\\n- GOMA: Beto bikala kaka kuna na Kivu ya zulu, wapi mfumu ya kizunga
  me lomba kuvukisa mabanza ti bizunga ya ke na kukabula bandilu ti bau; ya vanda
  mpe ti nsi ya Rwanda, Ouganda, mpe Burundi samu na kusosa kuvutuka ya ngemba ya
  kieleka na ndambu yina ya nsi na beto. Lieutenant-g\u00e9n\u00e9ral Constant Ndima
  Kongba monisaka zola nandi yayi na kilumbu ya sabala me luta, mingi na ntangu ya
  makesa monisaka na ntwala ya bapanzi kimvuka mosi ya bimpumbulu.\\n- MATADI : Mazono,
  mbuta Felix Tshisekedi lungisaka bamvula tatu na kiyeka ya nsi na beto. Na kilumbu
  yina ya makumi zole na iya ya ngonda yantete, nsobasani ya kimfumu salamaka na ngemba
  nionso na kati ya mbuta Felix Tshisekedi mpe muntu ya yandi yinga, mbuta Josep Kabila.\\n-
  BUTEMBO : Na mbanza Butembo, ba infirmiers mpe bakalaka ya banzo ya lusansu ya mbula
  matadi me ndima na kuvutukila kisalu na nima ya bangonda sambanu ya ba buyaka kisalu.
  Nionso yayi na kulanda kutulama ya maboko ya mukanda ya ngwakana na kati ya bantumwa
  na bau mpe luyalu na sabala me luta.\\n/sites/default/files/2022-01/25012022-p-k-journalkikongomatin-00_.mp3\"",
  "\"BENI: ba ntuadisi ya mambu ya mavimpi ya nzutu mpe bayina ya socit\u00e9 civil
  ke lomba na nakangu na kusadisla ba nukanu me bakamaka na ba mbuta ya luyalu sambu
  na kunuanisa kimbevo ya Ebola;\\nBANDUNDU : Bantu tinaka territoire ya Kwamouth
  sambu na ba nkindu ke luta kati ya Bateke na Bayake ba me yamba bau na Bolobo ,
  na kizunga Mayi ndombe kuna bau kemona mpasi bau kele na mfunu ya lusadisu me zabisa
  ntuadisi ya territoire;\\nBUNIA ba nzietelo me telemisama na nzila ya national numero
  2 kati ya Beni Komanda sambu an kukondwa lukengelo ke nata binuani ya ba ADF/sites/default/files/2022-08/250822-p-a-d-journalkikongomatin-00_.mp3\"",
  "\"Ba lenda bimisa zizulunalo zeto mu Internet mu zindinga luta 200, diaka mu ndinga
  za mababa. Linongi ya Mosenzeli [Nzo ya Nkengedi] yeti bangula beto mambu momo meti
  luta mu nza yamvimba mulungisa zimbikudulu za Bibila. Meti kindisa bobo batanganga
  mo mu nzila ya nsangu ya mbote ya Kimfumu kia Nzambi ye yeti kubasadisa bakala minu
  mu Yesu Klisto. Lamuka! yeti monisa beto mpila tufueti tomisina mambu ma ntangu\u2019eto.
  Yeti vovila mambu ma mfunu ye ma manene mukwikila vo Nsemi wuna fuanisa nsilulu\u2019andi
  ya tula nza ya mpa ya yenge ye ya kondua wonga. Sola ndinga yi uzolele mu fulu kina,
  mpe niema vana basonekene \u201cSosa\u201d mu mona nkia mutindu a zizulunalo zena
  mu ndinga yina.\"", "\"- KINSHASA: RDc me manisa kutanga ba mbefu makumi iya na
  tanu mpe zole me manis akufwa kuluta nkama sambanu vuandaka finakani na ba mbefu,
  makumi iya na iya kele na quarantaine\\n- KINSHASA: Muntu ya ntete ina belaka kimbevo
  ya coronavirus na RDc me beluka mpe yandi fwana basika na lupitalu na ba ntangu
  ke kwisa\\n- BENI: CNPR nord kivu me baka lukanu ya kunuanisa kimbevo ya Coronavirus,na
  yau ntalu ya bantu ke bakama na kati ya matoma me kita, kansi bakwa matoma ke nionga
  sambu an ba mpaku na nzila\\n- BANDUNDU: Sambu na kukitanina na kimbevo ya Coronavirus,
  ntuadisi ya kizunga me zabisti konso kilumbu ya tanu ya sabala ta vanda bisambu
  sambu na kizunga,insi mpe inza ya mvimbi\\n- BUTEMBO: Ntalu ya ba billet sambu na
  nzietelo me mata , katuka na ba dollars makumi zole na tanu ti na makumi tanu ya
  ba dollars\\n- KINSHASA: batonier Mukendi wa Mulumba me fwa bubu na suka , mutindu
  mosi ngimbisi ya insi ya Cameroun Manu Dibangu me kufwa mpe, bau nionso me fwa na
  kimbevo ya Coronavirus\\n- BENI: Binunai ya ba ADF makumi samnanu na zole me kufwa
  , makesa mpe ya FARDC me kufwa kati na bau vuandaka na mfumu ya makesa, bau me fwa
  na mvita ke salama kuna na territoire ya Beni/sites/default/files/2020-03/24032020-s-k-journalkikongosoir-00.mp3\"",
  "\"24\u00e8 Le\u00e7on Chronique \u201d les \u00e9lections c`est facile \u00e0 comprendre
  \u201d de la semaine du 21 au 25 Novembre 2005\\n\u201d Bureau ya vote ikele inki
  ?( Inki bake bokila Bureau ya vote ?) \u201crn*na ntwala ya kupesa mvutu na kiuvu
  yai,ya fwana ntete kuzabisa ti,kupona kele mutindu ya mwana ya insi,to bantu ya
