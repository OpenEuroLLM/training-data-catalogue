  "\"Manaka ya maponami : intu intu Denis kadima na ntuala ya Adolphe Muzito lumbu
  kintete bubu na Mbanza kinsasa\\nNa nima ya Fayulu, Matata, Sesanga, mpe Mo\u00efse
  katumbi, mfumu ntuadisi ya maponami ata solula diaka na ntuadisi ya kinvuka politiki
  nouvel \u00c9lan,lumbu ya ntete bubu ki 03 ya ngonda sambwandi 2023 n''a kinsasa.\\nIntu
  intu Denis kadima na ntuala ya Adolphe Muzito masolo na bau ata tadila penza maponami
  kele kwisa na Kongo d\u00e9mocratiki wapi bi kinvuka politiki opposition buya yau.\\n\u00ab
  Mono ke yamba, lumbu kintete bubu ki 03 ya ngonda sambwandi 2023 n''a tangu ya kumi
  ,kuna Congo h\u00f4tel, mfumu ntuadisi ya kinvuka politiki nouvel \u00c9lan, M.Adolphe
  Muzito,sambu na solula ndiambu ya manaka ya maponami \u00bb, sonikaka mfumu ntuadisi
  ya maponami na kibaka Andi ya tweeter.\\nNa ntuala ya Denis kadima lumbu ya sambanu
  ki 30 ya ngonda sambanu mene luta, kinvuka ya ba opposants lombaka penza tadila
  ya mbote ya nkanda maponami,yidika mbote penza CENI mpe kinvuka ya ba zuzi.Adolphe
  Muzito lenda bwela ku ntuala ya Fayulu, Matata,Sesanga, mpe Mo\u00efse katumbi.\"",
  "\"Bahumbu\\nBahumbu to bawumbu kele bantu, yina ke zingaka na ndambu ya Kinsasa.
  Na kinkulu bau vwandaka bankwa ya Kongo ya Ntotila, na ndambu ya Mpumbu. Ndinga
  ya bau kele mutindu mosi na ndinga ya bateke, yina kwizaka na Mpumbu na nima.\\nNdinga
  betu bahumbu ka ndinga bateke ko. Betu bahumbu ndinga dia betu kele bonso ndinga
  dia bambala...ye makanda makaka kuna bandundu...kizeyi kwami ko. Kansi betu kuna
  Kongo dia Ntotila ta kuisa kuvanda mu kinshasa...tua sumba toto ko...tua samba toto
  ko...\\nBe mono luvila la me Kinsau ka lunga wa lunga ngonda e tangu...ba nkaka
  ba me...batuka ku Kongo dia Ntotila...Mutom a mpansu munkati a nde Ndona Lukula
  babuta Mfumu Itonga... Benu luzeyi mana? Mbote kwa beno bansi Kongo dia Ntotila!\"",
  "\"Nsi ya Luangu\\nNsi ya Luangu vuanda kintinu na mpanzi ya Ngabu, Repubilika ya
  Kongo na Kabinda. Yau me zingaka katuka bamvula nkama ya 15 tuka bamvula nkama ya
  19. Na ntangu ya bunene ya yau, na bamvula nkama ya 17, yau me yalumuka katuka buala
  ya Mayumba ti nzadi Lueme. Mbanza ya kimfumu ya yau vuanda Luangu. Bantu luta nene
  ya nsi ya Luangu vuanda bavili.\\nBandambu[soba | edit source]\\nLuangu vuanda na
  bandambu nsambuadi. Yau vanda:\\n- Kikanu (Tsikanu)\\n- Kikuni (Tsikuni)\\n- Kilunge
  (Tsilunge)\\n- Kuangu\\n- Luanzili (Loandjili)\\n- Mpili\\n- Yombi\\nMaluangu[soba
  | edit source]\\nMaluangu vuanda zina ya ntinu ya nsi ya Luangu. Maluangu vuandaka:\\n-
  bamvula nkama ya 17\\n- Maluangu Nzimbi (1600)\\n- Maluangu Tati (1630)\\n- Maluangu
  Mue Puati (1660)\\n- Nguli Nkama Luembe (1680)\\n- Nganga Mvumba Niambi (1700)\\n-
  bamvula nkama ya 18\\n- bamvula nkama ya 19\\n- bamvula nkama ya 20\"", "\"Kiswahili\\nKiswahili
  kele nd\u00eenga ya yinsi ya Tanzania, Kenya, Uganda mpe Kongo-Kinsasa.\\nKiswahili
  me butama nt\u00e2ngu babantu me kuta balabu na simu ya esete ya Afrika. Kiswahili
  kele na m\u00e2mbu m\u00eengi yina katuka kilabu. Bubu yayi kiswahili kele nd\u00eenga
  ya yinsi ya Tanzania, Kenya mpe Uganda, mpe yawu kele nd\u00eenga ya bwala ya K\u00f4ngo-Kinsasa.\\nNtalu
  ya batubi ya Kiswahili:\\n- Kongo-Kinsasa 15 000 000\\n- Burundi 2 000 0000\\n-
  Kenya 20 000 000\\n- Rwanda 2 000 000\\n- Tanzania 32 000 000\\n- Uganda 8 000 000\\n-
  Bankaka 1 000 000\\n- Na kimvuka: 80 000 000\\nM\u00e2mbu[soba | edit source]\\nM\u00e2mbu
  ya kibantu[soba | edit source]\\nKiswahili kele na m\u00e2mbu m\u00eengi yina kele
  mosi na kik\u00f4ngo.\\n- jambo (dyambu)\\n- kaa (kala)\\n- kucheka (kuseka)\\n-
  mtu, watu (muntu, bantu)\\n- mwana\\n- ndege/nyuni (ndeke/nuni)\\n- njia (nzila)\\nKik\u00f4ngo
  kele mpe na m\u00e2mbu yina katukaka na kiswahili:\\n- at\u00e1 (sw. hata)\\n- k\u00eeti
  (sw. kiti)\\n- langi (sw. rangi)\\n- madidi (sw. baridi)\\n- sanduku (sw. sanduku)\"",
  "\"TESTIMONIES\\nEnglish | German | Haitian Creole | Italian | Kinyarwanda | Lingala\\nMalagasy
  | Malayalam | Polish | Spanish | Tamil | Telugu\\nNgizulu ami ku Canada yatukisa
  lebakana kua kunene mu mwuela''mi mu diambu dia matedi nza yayi ye mayindu ma mpila
  mu mpila mu mvwilu a lekua bia nza. Yakatuka ku Vancouver, B.C. buala bundi yiza
  tudila ku Canada, mu kuenda vuandi ku Montr\u00e9al. Ya kala mvu minya ku Montr\u00e9al,
  Qc nate ye ndiele vutuki ku Vancouver, B.C. mu kala kuna ye longuka ki ngeloso.\\nLebakana
  ye mayindu mu bilekua bia nza evo mambu manza yayi manata zimpasi mu mwela''mi.\\nMamo
  ma ya zola vanga, makala ma bedusua. Ndi yenda kota zi nzo zitatu za tata Nsambi,
  kasi ya tambula lekwa ko. Mpasi zami, za luta ngolo, kadi ka sekuka nzo Nsambi ko
  yi vananga mpulusu, kasi ntima usekuka uvananga luvovomo.\\nMatai 6:33-34 \u00abLu
  tomba ntete kinfumu kia mazulu\u2026\u00bb\\n\u00abKa lukalandi mayindu ko mu lumbu
  kia mbazi\u2026\u00bb\\nMu ngonde ya ntatu mu mvu wa 1996 ku Vancouver, B.C., ya
  tumusua mu kuenda ku lukutukunu mu dibundu dia Sr Collins. Ya wa malongi ma tata
  Nsambi ma longua mu lulendo lua mpeve ya nlongo. Ya tambula malongi momo mu ntimami,
  ye yalomba mlemvo kua Mfumu Yesu mu mambi mamo.\\nMfumu Yesu wa ndem''vukila ye
  mpeve ya nlongo ya yiza mu ntima''mi. Mfumu wa katula lebakana ye mabanza mamo manza
  ye watula luvovomo ye kiese kia zulu mu ntima''mi, ye mu mwuela mi. Ye ya tambula
  zingu kia mona.\\nBibila kivovele mu Matai 11:28 \u00abLuiza kwa mono, beno babo
  luena ba lebakana ye nati a bizitu, mono siya kulu vundisa\u00bb\\n1 Yoane 1:9 \u00abVo
  tutambudidi masumu meto kwa Yesu, yandi sika kutu lemvukila ye kutu vedisa mu yambi
  ya yonso\u00bb.\\nNgiena ye mayangi mu ntima''mi mu vulusua ye mu zaba Yesu mu Kedika,
  ye mu zaba vo zina diami dia sonama ku zulu. Bika nkumbu a Mfumu Yesu yi kembusua.
  Mvutudi mpe matondo ma mpuele maka malendi suka ko, mu diambu dia zi nkutukunu mu
  dibundu dia sielo kiandi kia nketo Sr Collins.\\nMatondo diaka kua Mfumu mu mamo
  matueti tambula mu mdongolo, mu zi nduengosolo mu malongi ma nkadulu mu nzila Nsambi
  ye mu zi nsambudulu zazo.\\nSr Collins i Nsamuni waKedika. Weti longa mambu ma Nsambi
  nate ye lumbu kiaki, mu lulendo lua mpeve ya nlongo, mu bunga ye bebisa mavanga
  ma satana mu miela mi batu.\\nIdiau, batu ba vuata fuani kia ma meme mu dibundu,
  ye kabena ma meme ma Kedika ko, bau i zi nkonsi. Batu bobo, ba totuka mu dibundu
  bau veka ye bayenda sonika ye vova mambu ma luvunu ye makondolo nsundu mu diambu
  dia Sr Collins ye dibundu. Batu bobo, bazolele votikisa dibundu dia tata Nsambi.
  Yuda 4\\nKwa beno lueti tanga:\\n- Wa Kedika Kia Mfumu Yesu Kieti longua Kua Sr
  Collins, Nsamuni wa Kedika, wa solua kua Tata Nsambi.\\n- Kadi zibula matu meno
  mu wa luvunu lwa satana ye batu bandi ba yaluwa kwa mpeve za sumuka. Kadi batu bobo
  beti vanga mambi ye bankwa masumu bena. Ba zolele tula nkindu mu dibundu dia Sr
  Collins, ye beti sonika mambu ma luvunu beni ye vekisa mo mu bifulu. Kasi kaba beki
  lulendo mu bunga dibundu dia tata Nsambi ko. \u00abLulenda kuiza tala ye mekisa
  bonso bwena nlemvo a Mfumu Yesu\u00bb\\n- Nate ye bwabu, Mfumu weti nata batu mu
  dibundu, ba zolele mpulusu, ba zolele tambula Kedika kia Yesu mu ntima miau, ye
  ba zolele niaka mu bimbevo mpe.\\n- Bobwau, Mfumu weti tatamana sadila sielo kiandi
  kia nketo, mu ndongolo a mambu ma Nzambi maKedika ye mu zinsambudulu zandi kua makanda
  mamo mu nsi zazo.\\nMu manisa: Sr Collins i Nsamuni wa Kedika, ye weti zingila mu
  Kedika Kia Mfumu Yesu, ye mu luzolo lua Mfumu kua batu ba zi nsi zazo. 1 Yoane 5:20\\nNtondele
  beni kua Sr Collins.\\nBernice Nzumba Baku-Vuvu\\nR\u00e9publique D\u00e9mocratique
  du Congo (RDC)\"", "\"/sites/default/files/2021-12/01122021-p-k-journalkikongosoir-00.mp3JP
  lingala soir du 01122021\\n1/ BENI : Makesa ya insi ya Ouganda na kimvuka na makesa
  ya RDC me vukana sambu na kukuka bimpumbulu ya ADF na Beni\\n2/KINSHASA : Divula
