  "\"Ngola\\nNgola kele nsi mosi ya Afelika ya Sudi. Bansi ya pembeni kele Kongo-Kinsasa,
  Zambia na Namibia. Kizunga ya Kabinda kele na ndilu na Kongo-Braza. Luanda kele
  mbanza-mfumu ya Ngola.\\n[balula] Kinkulu\\nBansi ya ntotila ke tulama na sika ya
  Ngola na ntwala. Bau vanda Kakongo na Kabinda, Kongo ya Ntotila na node, Ndongo
  ye Matamba na katikati ye Benguela na sudi. Er negrito monito bonito kerer zumbar.\\nNgola
  vuandaka koloni ya Portugal.\\n[balula] Bizunga\\n- Bengo\\n- Bengela\\n- Biye\\n-
  Kabinda\\n- Kuando Kubango\\n- Kuanza Node\\n- Kuanza Sudi\\n- Kunene\\n- Wambu\\n-
  Wila\\n- Luanda\\n- Lunda Node\\n- Lunda Sudi\\n- Malanzi\\n- Musiku\\n- Namibe\\n-
  Wizi\\n- Nzadi\\n[balula] Bantu\\nKimputulukesi kele ndinga ya kisalu. Bandinga
  ya bwala kele kikongo, kimbundu, ovimbundu, kitshokue, kimbunda na kikuanyama.\"",
  "\"BENI : Makesa ya nsi landaka na kukota awa na ntoto na beto, tuka Territoire
  ya Beni.\\nKINSHASA : Kaka na bansangu yayi, beto ta tubila inki mutindu ya nsi
  na beto ke na kusala samu na kumanisa kimbefo ya Sida.\\nKISANGANI : Na mbanza Kisangani,
  kele mazono ya mukembo ya nsuka ya mvula salamaka na Universit\u00e9 ya Kisangani.\\nASSEMBLEE
  NATIONALE : Kele na kilumbu ya mazono ya nzo ya kinzonzi ndimaka samu na mbala ya
  kumi na tatu ya kulandakana ya luyalu ya kele na maboko ya makesa mpe bapulusi na
  kizunga ya Ituri, mpe ya Kivu ya zulu.\\nKINSHASA : Lukanu yayi ya me pesa nswa
  na makesa ya Kongo Kinshasa mpe ya nsi ya Ouganda samu na kunuanisa bimpumbulu ya
  ba Adf, lukanu yayi me tadila bansi nionso zole yayi ; lukanu mpe ya Monusco ke
  na kuzitisa.\"", "\"Repubilika ya K\u00f4ngo ya Dimokalasi\\nRepubilika ya K\u00f4ngo
  ya Dimokalasi to K\u00f4ngo Demokratiki to K\u00f4ngo-Kinsasa kele yinsi na Afelika
  ya Kati. Bayinsi ya p\u00e8ne-p\u00e8ne na yawu kele Repubilika ya K\u00f4ngo, Repubilika
  ya Afelika ya Kati, Sudan, Uganda, Rwanda, Burundi, Zambia n\u00e1 Ngola. K\u00f4ngo-Kinsasa
  kele yinsi ya tatu na bunene ya Afelika.\\nContents\\nKinkulu[soba | edit source]\\nTuka
  2000 NK t\u00ee 500 BK bitembo ya babantu katuka londe sompaka na nd\u00e2mbu ya
  K\u00f4ngo ya nt\u00e2ngu yayi. Bantu ya kisina, bambekele, fwanaka sompa na dikabu
  ngele ya yinsi. Babantu yina kotisaka kisalu ya bilanga pe kisalu ya kibende tuka
  Afrika-Mputu.\\nP\u00e8ne-p\u00e8ne na mvula 400 kimvuka mosi bandaka kukulisa na
  simu ya nzadi Lualaba. Nk\u00fbmbu ya kimvuka yayi vwandaka Upemba. Yawu kumaka
  Luba ya Ntotila na nima (p\u00e8ne-p\u00e8ne na 1585). Kimvuka ya mfunu ya nkaka
  vwandaka K\u00f4ngo ya Ntotila, yina butukaka p\u00e8ne-p\u00e8ne na mvula 1400
  mpe zingaka t\u00ee 1885 na nsiku.\\nLuyalu ya Belezi (1908 \u2013 1960)[soba |
  edit source]\\nK\u00f4ngo vwandaka koloni ya Belezi banda 1908 t\u00ee kuna 1960.\\nVita
  ya yinsi (1960-1965)[soba | edit source]\\nZaire (1971 \u2013 1997)[soba | edit
  source]\\nNa nima ya mvula t\u00e2nu ya vita mpe ya ngemba ve, Joseph-D\u00e9sir\u00e9
  Mobutu, lieutenant g\u00e9n\u00e9ral ya banwani, basisaka Kasa Vubu katuka k\u00eeti
  ya luyalu na ngolo na 1965. Mobutu nataka ngemba na yinsi, kasi luyalu na yandi
  vwezaka bansua ya muntu mpe salaka lukwikilu ya muntu samu na Mobutu kibeni.\\nNa
  bamvula kumi ya 1970 Mobutu salaka politiki ya kuzairisa (kifalanse: za\u00efrianisation).
  Na mvula 1971 yandi pesaka K\u00f4ngo zina ya yimpa, Zaire, yina kele mpila ya kupola
  ya mpovo ya kik\u00f4ngo, Nzadi.\\nTransition (1996 \u2013 bubu)[soba | edit source]\\nNa
  mvula 2005 Repubilika ya K\u00f4ngo ya Dimokalasi me kuzwa misiku ya yinsi ya yimpa.
  Banda misiku yayi nzila me zibulama samu na kumanisa transition na nswalu nyonso
  na kubimisa nsiku ya maponama ke kwiza. Kimvuka ya kimpwanza ya kupona (Commission
  electorale independante) salaka maponama samu na ntwadisi ya yinsi n\u00e1 luyalu
  ya yinsi na 30.7.2006. Joseph Kabila nungaka Jean-Pierre Bemba n\u00e1 bakandida
  ya nkaka na maponama ya ntwadisi ya nsi.\\nB\u00easi[soba | edit source]\\nKibuka
  ya bantu ya nene kele:\\n- baluba 18 %\\n- bak\u00f4ngo 16,1 %\\n- bankundu 13,5
  %\\n- banyarwanda n\u00e1 banyamulenge 10,3 %\\n- bazande 6,1%\\n- babangi n\u00e1
  bangala 5,8%\\n- bantu ya nkaka 30,2%\\nBand\u00eenga[soba | edit source]\\nNd\u00eenga
  ya kisalu ya K\u00f4ngo-Kinsasa yawu kele kifalanse. Band\u00eenga ya bwala kele
  kik\u00f4ngo, kiluba, kiswahili na lingala. Yinsi ke tembikisa band\u00eenga yina
  nyonso na kuloza ata mosi ve. Band\u00eenga ya nkaka ya yinsi yawu kele samu na
  lukumu ya yinsi ya Kongo yina luyalu ke kwiza kakila.\\nLukwikilu[soba | edit source]\\n-
  bana ya Yesu ya katolika 70%\\n- bana ya Yesu ya misioni 20%\\n- bana ya Kimbangu
  10%\\n- basilamu 10%\\n- lukwikilu ya bambuta 10%\\nMalongi ya ntoto[soba | edit
  source]\\nNzadi K\u00f4ngo n\u00e1 bana-nzadi ya yandi ke sabuka yinsi ya mvimpa.
  Nzadi K\u00f4ngo ke kabula K\u00f4ngo-Balazavile na K\u00f4ngo-Kinsasa. Nzadi Ubangi
  kele ndilu na Yinsi ya Afelika ya Kati. Uganda kele na simu ya Mazanga Mobutu na
  Rwitanzige. Rwanda kele na simu ya Kivu. Burundi na Tanzania kele na simu ya Tanganyika.
  Dizanga Mweru ye nzadi Luapula salama bonso ndilu na Zambia. Kwango na Kas\u00e2yi
  ke l\u00e2nda ndilu ya Ngola.\\nBiz\u00fbnga[soba | edit source]\\nRepubilika ya
  K\u00f4ngo ya Dimokalasi kele na biz\u00fbnga mak\u00fbmi z\u00f4le na t\u00e2nu,
  na mb\u00e2nza Kinsasa.\\nPolitiki[soba | edit source]\\nMinsiku ya leta[soba |
  edit source]\\nBantwadisi ya nsi[soba | edit source]\\n- 1960 - 1965 Joseph Kasa
  Vubu\\n- 1965 - 1997 Mobutu Sese Seko\\n- 1997 - 2001 Laurent Kabila\\n- 2001 -
  Joseph Kabila\\nBantumwa ya ntete[soba | edit source]\\n- 1960 - 1960 Patrice Lumumba\\n-
  1961 - 1961 Joseph Ileo\\n- 1961 - 1964 Cyrille Adoula\\n- 1964 - 1965 Moise Tshombe\\n-
  1965 - 1965 Evariste Kimba\\n- 1965 - 1966 L\u00e9onard Mulamba\\n- 1966 - 1977
  ?\\n- 1977 - 1979 Mpinga Kasenga\\n- 1979 - 1980 Bo-Boliko Lokonga Mihambo\\n- 1980
  - 1981 Jean Nguza Karl-I-Bond\\n- 1981 - 1982 Joseph Untube N''singa Udjuu\\n- 1982
