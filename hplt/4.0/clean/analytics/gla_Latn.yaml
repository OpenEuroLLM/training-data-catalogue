  "\"THE\\nWORD\\nAWST, 1910.\\nMOLAIDHEAN LE FRIENDS.\\nA bheil buaidh aig a bhith
  a \u2019buntainn ri Comainn Dh\u00ecomhair a\u2019 tarraing air ais no ag adhartachadh
