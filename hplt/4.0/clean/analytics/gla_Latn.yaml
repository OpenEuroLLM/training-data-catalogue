  \u2019cur casg air an inntinn bho no a\u2019 cuideachadh le leasachadh a r\u00e8ir
  n\u00e0dar agus leasachadh na h-inntinn sh\u00f2nraichte sin agus an se\u00f2rsa
  Comann D\u00ecomhair a tha am fear sin na bhall. Faodar a h-uile comann d\u00ecomhair
  a bhith air an se\u00f2rsachadh fo dh\u00e0 cheann: an fheadhainn aig a bheil e
  mar amas an inntinn agus an corp a thr\u00e8anadh airson adhbharan inntinn agus
