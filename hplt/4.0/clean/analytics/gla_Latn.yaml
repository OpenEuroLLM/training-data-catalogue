  a \u2019dol an aghaidh lagh n\u00e0durrach gus toraidhean corporra a thoirt gu buil
  tha an lagh ag iarraidh ath-r\u00e8iteachadh, agus gu tric bidh an ath-bhualadh
  nas cruaidhe na an trioblaid t\u00f9sail. Mar sin nuair a tha sl\u00e0inte air a
  thagradh agus nuair nach eil na riatanasan corporra airson sl\u00e0inte corporra
  air an toirt seachad, faodaidh an inntinn toirt air falbh f\u00e0s m\u00ec-fhallain,
  leithid tumhair Ach airson leigheas cho follaiseach tha iarrtas air iarraidh le
  n\u00e0dar airson feuchainn ri casg a chuir oirre. laghan. Le bhith a \u2019sparradh
  sgapadh an tumhair faodaidh c\u00f9is an tumhair a bhith - mar nuair a th\u00e8id
  toirt air daoine gun lagh an cuid ghalaran fh\u00e0gail le ath-leasaichean meallta
