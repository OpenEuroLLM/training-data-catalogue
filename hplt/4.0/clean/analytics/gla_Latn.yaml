  is gann agus mura h-eil e a\u2019 s\u00e0sachadh no a \u2019freagairt ceistean na
  beatha a tha inntinn a\u2019 miannachadh, tha seo na chomharra gu bheil a chuid
  tha inntinn a \u2019f\u00e0s agus a\u2019 f\u00e0s a-mach \u00e0s a \u2019chlas
  sin a tha air a riochdachadh leis a\u2019 chreideamh sh\u00f2nraichte sin agus tha
  e a \u2019sealltainn gu bheil inntinn ag iarraidh rudeigin a bheir seachad am biadh
  inntinn no spioradail a dh\u2019 fheumas e airson f\u00e0s leantainneach. Bidh a
  h-uile comann d\u00ecomhair fon chiad chlas, aig a bheil mar amas leasachadh gluasadan
  inntinn, a \u2019toirt air ais an inntinn oir feumaidh a h-uile c\u00e0il den t-se\u00f2rsa
  inntinn a bhith ceangailte ris na ciad-f\u00e0than agus an inntinn a thoirt fo uachdranas
  nan ciad-f\u00e0than.\\nTha comainn dh\u00ecomhair an d\u00e0rna clas air an d\u00e8anamh
  suas de na buidhnean sin aig a bheil amasan buannachdan poilitigeach, s\u00f2isealta,
  ionmhasail agus mercenary. Fon chlas seo thig na comainn brathaidh agus coibhneil,
  iadsan a tha air an eagrachadh gu d\u00ecomhair gus riaghaltas a chuir \u00e0s,
  no an fheadhainn a bhios gan ceangal fh\u00e8in c\u00f2mhla airson adhbharan dubh-dubh,
  murt no \u00f9mhlachd ciallach agus borb. Is d\u00f2cha gu bheil e furasta innse
  am bi gin dhiubh sin a \u2019cuideachadh no a\u2019 toirt air ais leasachadh na
  inntinn ma tha e e\u00f2lach air na h-amasan agus na nithean aige.\\nIs e a \u2019bheachd
  a th\u2019 ann an d\u00ecomhaireachd e\u00f2las no rudeigin a bhith aig daoine nach
  eil aig cuid eile, no ann a bhith a \u2019roinneadh e\u00f2las le beagan. Tha miann
  an e\u00f2lais seo l\u00e0idir agus tarraingeach don fheadhainn neo-leasaichte,
  \u00f2igeachd agus inntinn a tha a \u2019s\u00ecor fh\u00e0s. Tha seo air a shealltainn
  leis a \u2019mhiann a th\u2019 aig daoine a bhith a \u2019buntainn ri rudeigin a
  tha toirmeasgach agus doirbh a dhol a-steach agus a bheir togail-inntinn no farmad
  no urram dhaibhsan nach buin. Is toil le eadhon clann d\u00ecomhaireachdan a bhith
  aca. Bidh ribean na falt air nighean bheag no air a sh\u00e0ilean gus sealltainn
  gu bheil d\u00ecomhair aice. Tha i na adhbhar farmad agus urram nan nigheanan beaga
  eile gus am bi fios air an d\u00ecomhaireachd, an uairsin bidh an rioban agus an
  d\u00ecomhair a \u2019call a luach. An uairsin tha nighean bheag eile le rioban
  eile agus d\u00ecomhaireachd \u00f9r mar mheadhan an tarraing. A dh \u2019aindeoin
  na comainn phoilitigeach, ionmhasail agus borb no eucorach, tha a\u2019 mh\u00f2r-chuid
  de dh\u00ecomhaireachd nan comainn dh\u00ecomhair san t-saoghal, cho beag de luach
  no nach eil iad cho cudromach ri d\u00ecomhaireachdan na h-\u00ecghne. Ach dh \u2019fhaodadh
  an fheadhainn a bhuineas dhaibh a bhith air an toirt seachad le\u201c cluich, \u201da
  tha cho buannachdail dhaibh\u2019 s a tha d\u00ecomhaireachd na h-\u00ecghne dhi.
  Mar a bhios an inntinn a \u2019tighinn gu \u00ecre chan eil i ag iarraidh d\u00ecomhaireachd;
  tha e a \u2019faighinn a-mach gu bheil an fheadhainn a tha ag iarraidh d\u00ecomhaireachd
  neo-\u00e0bhaisteach, no gu bheil na smuaintean agus na gn\u00ecomhan aca a\u2019
  sireadh dorchadas gus an solas a sheachnadh. Tha an inntinn aibidh airson sgaoileadh
  fiosrachaidh a sgaoileadh, ged a tha fios aige nach urrainnear e\u00f2las a thoirt
  dha na h-uile. Mar a bhios an r\u00e8is a \u2019tighinn air adhart ann an e\u00f2las,
  bu ch\u00f2ir don iarrtas airson comainn dh\u00ecomhair airson leasachadh na h-inntinn
  a dhol s\u00ecos. Chan eil feum air comainn dh\u00ecomhair airson inntinnean adhartachadh
  nas fhaide na aois nighean sgoile. Bho thaobh gn\u00ecomhachais is s\u00f2isealta
  is litreachais, tha a h-uile r\u00f9n a tha riatanach ann am beatha \u00e0bhaisteach
  gus fuasgladh fhaighinn air an inntinn agus leis am bi an inntinn a \u2019dol air
  adhart tro \u00ecrean \u00f2ige. Chan urrainn do chomann d\u00ecomhair sam bith
  an inntinn adhartachadh nas fhaide na a leasachadh n\u00e0durrach no leigeil leis
  faicinn tro dh\u00ecomhaireachd n\u00e0dur agus fuasgladh fhaighinn air duilgheadasan
  beatha. Is d\u00f2cha gum bi grunn bhuidhnean d\u00ecomhair san t-saoghal buannachdail
  don inntinn mura stad an inntinn air an uachdar, ach th\u00e8id e a-steach do fh\u00ecor
  bhr\u00ecgh an teagasg. Is e a leithid de bhuidheann \u00d2rdugh nan Saor Chlachairean.
  Chan eil ach gl\u00e8 bheag de dh \u2019inntinnean na buidhne seo a\u2019 faighinn
  a-mach ach buannachd gn\u00ecomhachais no s\u00f2isealta. Cha mh\u00f2r nach eil
  an fh\u00ecor luach samhlachail agus an teagasg moralta agus spioradail air chall
  dhaibh.\\nChan eil buidheann a tha dha-r\u00ecribh d\u00ecomhair a tha buannachdail
  don inntinn na leasachadh air ainmeachadh mar chomann d\u00ecomhair, agus chan eil
  e aithnichte don t-saoghal. Feumaidh e a bhith cho s\u00ecmplidh agus cho s\u00ecmplidh
  ri beatha n\u00e0darra. Chan eil inntrigeadh do chomann d\u00ecomhair mar sin le
  deas-ghn\u00e0th. Is ann le f\u00e0s, tro f\u00e8in-oidhirp na h-inntinn. Feumar
  f\u00e0s a-steach, gun a dhol a-steach. Chan urrainn do dhuine sam bith inntinn
  a chumail a-mach \u00e0 buidheann mar sin mas ann le f\u00e8in-oidhirp a tha an
  inntinn sin a \u2019s\u00ecor fh\u00e0s. Nuair a dh \u2019fh\u00e0sas inntinn a-steach
  do e\u00f2las beatha bidh an inntinn sin a\u2019 feuchainn ri aineolas a chuir \u00e0s
  le bhith a \u2019toirt air falbh na sg\u00f2than, a\u2019 faighinn a-mach d\u00ecomhaireachdan
  agus le bhith a \u2019tilgeil solas air a h-uile duilgheadas beatha agus a\u2019
  cuideachadh inntinnean eile nan leasachadh agus an leasachadh n\u00e0darra. Cha
  bhith a \u2019buntainn ri comann d\u00ecomhair a\u2019 cuideachadh na h-inntinn
  a bhios de\u00f2nach f\u00e0s a-steach dha fh\u00e8in.\\nA bheil e comasach rudeigin
  fhaighinn gun dad? Carson a bhios daoine a \u2019feuchainn ri rudeigin fhaighinn
  airson dad? Ciamar a dh''fheumas daoine a tha coltach gu bheil iad a \u2019faighinn
  rudeigin gun dad, p\u00e0igheadh airson na gheibh iad?\\nTha a h-uile duine gu l\u00e0idir
  a \u2019faireachdainn nach urrainn do dhuine rudeigin fhaighinn airson dad agus
  gu bheil am moladh ce\u00e0rr agus an oidhirp neo-airidh; gidheadh, nuair a smaoinicheas
  e air co-cheangailte ri n\u00ec air choreigin aige tha miann, deagh bhreithneachadh
  air a leigeil seachad agus tha e le cluasan de\u00f2nach ag \u00e8isteachd ris a
  \u2019mholadh agus a\u2019 cur \u00e0s dha fh\u00e8in a bhith a \u2019creidsinn
  gu bheil e comasach agus gu bheil he is d\u00f2cha gum faigh e rudeigin gun dad.
  Tha beatha ag iarraidh gun t\u00e8id tilleadh no cunntas a dh\u00e8anamh airson
  a h-uile dad a gheibhear. Tha an riatanas seo st\u00e8idhichte air an lagh riatanach,
  a tha a \u2019solarachadh airson cuairteachadh beatha, cumail suas fhoirmean agus
  cruth-atharrachadh bhuidhnean. Bidh esan a dh \u2019fheuchas ri faighinn airson
  dad nach tigeadh dha, a\u2019 cur bacadh air cuairteachadh beatha agus cuairteachadh
  chruthan a r\u00e8ir lagh n\u00e0durrach, agus mar sin tha e a \u2019d\u00e8anamh
  cnap-starra dha fh\u00e8in ann an corp n\u00e0dur. Bidh e a \u2019p\u00e0igheadh
  a\u2019 pheanais, a tha n\u00e0dur a bharrachd air a h-uile buidheann a tha air
  a riaghladh leis an lagh agus a \u2019toirt air ais an rud a ghabh e no eile a bheil
  e gu tur air a chumail fodha no air a thoirt air falbh. Nam biodh e an aghaidh seo
  le bhith ag argamaid nach robh na fhuair e ach na bhiodh air a thighinn thuige co-dhi\u00f9,
  tha an argamaid aige a \u2019f\u00e0iligeadh oir nam biodh na fhuair e airson dad,
  a r\u00e8ir coltais, air a thighinn thuige \u00e0s aonais an oidhirp aige, cha bhiodh
  feum air a bhith air an oidhirp a rinn e gus fhaighinn. Nuair a thig c\u00f9isean
  gu aon gun oidhirp fhollaiseach, leithid rud ris an canar tubaist agus cothrom no
  le oighreachd, thig iad air sg\u00e0th agus a r\u00e8ir obrachadh n\u00e0darra a-mach
  \u00e0s an lagh, agus san d\u00f2igh seo tha e dligheach agus a r\u00e8ir an lagh.
  Anns a h-uile c\u00f9is eile, leithid a bhith a \u2019faighinn sochairean corporra
  agus ciallach le bhith a\u2019 miannachadh a-mh\u00e0in, no le bhith a \u2019smaoineachadh
  a-mh\u00e0in, no le bhith a\u2019 d\u00e8anamh iarrtasan a r\u00e8ir abairtean ris
  an canar lagh pailteas no lagh opulence, tha e do-dh\u00e8anta rudeigin fhaighinn
  airson dad ged-t\u00e0 tha e coltach gu bheil aon a \u2019faighinn rudeigin gun
  dad. Is e aon de na h-adhbharan a bhios daoine a \u2019feuchainn ri rudeigin fhaighinn
  airson dad, air sg\u00e0th ged a tha iad a\u2019 faireachdainn nach urrainn seo
  a bhith f\u00ecor gu f\u00ecrinneach, tha iad a \u2019faicinn gu bheil feadhainn
  eile air faighinn a-mach nach eil na daoine eile sin ag obair dha, agus seach gu
  bheil e air a r\u00e0dh le feadhainn eile. bidh daoine a \u2019faighinn rudan le
  bhith d\u00ecreach a\u2019 guidhe air an son no ag iarraidh orra agus gan tagradh
  gus am bi iad aca. Is e adhbhar eile a th \u2019ann air sg\u00e0th nach eil inntinn
  an neach gu \u00ecre aibidh agus e\u00f2las gu le\u00f2r airson fios a bhith aige
  nach urrainn dha rudeigin fhaighinn a dh\u2019 aindeoin na tha e a \u2019toirt a-steach,
  brosnachaidhean no tagraidhean as urrainn dha. Tha adhbhar eile ann air sg\u00e0th
  nach eil an neach a tha den bheachd gun urrainn dha rudeigin fhaighinn airson dad
  idir onarach. Ann am beatha gn\u00ecomhachais \u00e0bhaisteach is e na daoine as
  motha a tha a \u2019creidsinn gun urrainn dhaibh a dhol thairis air an lagh agus
  gum faigh iad rudeigin gun dad, ach tha seo air sg\u00e0th gu bheil iad am beachd
  na daoine a dh\u00e8anamh nas lugha na tha iad fh\u00e8in a\u2019 solarachadh na
  tha iad ag iarraidh. Mar sin tha iad a \u2019toirt seachad sgeama luath-bheairteach-luath
  no sgeama eile agus a\u2019 toirt air daoine eile a bhith m\u00ec-onarach ach le
  nas lugha de e\u00f2las na iad fh\u00e8in a thighinn a-steach. Bidh a \u2019mh\u00f2r-chuid
  a th\u00e8id a thoirt a-steach don sgeama gu tric air an sealltainn leis an sgeamaiche
  mar a tha e a\u2019 dol a dh \u2019fhaighinn a\u2019 chuid as fhe\u00e0rr de chuid
  de dhaoine eile agus a tha a \u2019m\u00ecneachadh mar as urrainn dhaibh beairteas
  fhaighinn gu sgiobalta. Nam biodh iad sin onarach cha bhiodh iad air an toirt a-steach
  don sgeama ach, le bhith ag ath-thagradh gu avarice agus covetousness anns na dupes
  aige agus tro na d\u00f2ighean eas-onarach aige fh\u00e8in, gheibh an sgeamaiche
  na tha an luchd-fulang aige a \u2019toirt seachad. Nuair a tha duine dha-r\u00ecribh
  onarach bidh fios aige nach urrainn dha rudeigin fhaighinn airson dad agus nach
  fheuch e, ged a dh \u2019fhaodadh e gabhail ris an rud a thig thuige gu laghail
  nuair a thig e tro dh\u00f2ighean n\u00e0durrach.\\nFeumaidh daoine a gheibh rudeigin
  p\u00e0igheadh airson na gheibh iad. Ma gheibh daoine rudan a tha coltach gu bheil
  iad a \u2019tighinn a-mach \u00e0s an adhar agus a\u2019 tuiteam nan lapan mar thoradh
  air gairm air lagh pailteas no an taigh-st\u00f2ir uile-choitcheann no air lagh
  opulence, no d\u00e8 nach eil, tha iad mar an fheadhainn ghoirid- feadhainn fradharcach
  gun d\u00f2igh a bhios a \u2019d\u00e8anamh ceannach m\u00f2r air creideas, gun
  smaoineachadh air \u00e0m an r\u00e8iteachaidh. Coltach ris an fheadhainn \u00e0s
  aonais goireasan a bhios a \u2019ceannach air creideas, bidh na mearachdan cunnartach
  sin gu tric a\u2019 faighinn na rudan nach eil iad a \u2019feumachdainn; mar an
  luchd-ceannach gun bheachd, tha an fheadhainn a tha ag iarraidh \u201clagh na pailteas\u201d
  a \u2019bruadar agus a\u2019 miannachadh gun d\u00e8an iad m\u00f2ran leis na gheibh
  iad - ach tha iad faisg air briseadh nuair a thig \u00e0m an r\u00e8iteachaidh.
  Is d\u00f2cha nach t\u00e8id fiachan aideachadh, ach tha an lagh cinnteach d\u00e8
  am p\u00e0igheadh a dh \u2019aindeoin sin. Fear a dh \u2019iarras sl\u00e0inte corporra
  agus beairteas corporra le bhith gan tagradh agus ag iarraidh iad sin bho\u201c
  lagh na pailteas, \u201dno bho\u201c an fh\u00ecor, \u201dno bho rud sam bith eile,
  agus a gheibh rudeigin de na tha e ag iarraidh, an \u00e0ite a bhith ga fhaighinn
  gu dligheach san r\u00ecoghachd far am buin e, feumaidh e na fhuair e air ais a
  bharrachd air an riadh a chaidh iarraidh airson a chleachdadh.\\nDh \u2019fhaodadh
  aon a bhith a\u2019 ceartachadh eas-\u00f2rdughan nearbhach agus a \u2019toirt a\u2019
  bhodhaig air ais gu sl\u00e0inte le beachd inntinn; ach th\u00e8id a lorg gu bheil
  duilgheadasan nearbhach sa mh\u00f2r-chuid air an toirt air adhart agus air an leantainn
  le inntinn trioblaideach. Nuair a th\u00e8id an sealladh ceart a ghabhail leis an
  inntinn tha an trioblaid nearbhach air a cheartachadh agus bidh an corp ag ath-th\u00f2iseachadh
  a ghn\u00ecomhan n\u00e0darra. Is e leigheas dligheach a tha seo, no an \u00e0ite
  a bhith a \u2019toirt air falbh adhbhar tinneas, oir tha an leigheas air a choileanadh
  le bhith a\u2019 l\u00e0imhseachadh an trioblaid aig an st\u00f2r aige. Ach chan
  eil a h-uile galar agus droch shl\u00e0inte mar thoradh air inntinn trioblaideach.
  Mar as trice bidh droch shl\u00e0inte is galair air an adhbhrachadh le bhith ag
  ithe biadh neo-iomchaidh agus a \u2019toirt toileachas dha blasan morbid agus miann
  m\u00ec-laghail. Tha suidheachaidhean corporra agus seilbh air an toirt seachad
  le bhith a \u2019faicinn gu bheil iad riatanach airson obair neach, agus an uairsin
  le bhith ag obair dhaibh a r\u00e8ir nan d\u00f2ighean corporra dligheach aithnichte.\\nTha
  e comasach dha galairean a thig air adhart le biadhadh neo-iomchaidh a dhol \u00e0
  sealladh, agus tha e comasach airgead agus buannachdan corporra eile fhaighinn le
  bhith ag agairt agus ag iarraidh iad sin bho ge bith d\u00e8 an abairt a tha an
  inntinn toilichte a chruthachadh no a ghabhail os l\u00e0imh. Tha seo comasach oir
  tha cumhachd aig an inntinn a bhith ag obair air inntinnean eile agus toirt orra
  na cumhaichean a tha i ag iarraidh a thoirt gu buil agus seach gu bheil cumhachd
  aig an inntinn agus is d\u00f2cha gum bi e comasach dhaibh a bhith a \u2019cur an
  gn\u00ecomh suidheachadh a pl\u00e8ana fh\u00e8in, agus a\u2019 ch\u00f9is seo ann
  an faodaidh tionndadh gn\u00ecomh a dh\u00e8anamh no na cumhachan a tha an inntinn
  ag iarraidh a thoirt gu buil; tha e comasach oir is d\u00f2cha gun cuir an inntinn
  a chumhachd thairis air a \u2019bhodhaig agus gun toir e air galar corporra a dhol
