  bhith ag obair air, a\u2019 coiseachd gu na b\u00f9than, msaa.\\nBhiodh a bhith
  a \u2019sparradh clogaidean baidhsagal, eadhon ged a dh\u00e8anadh e baidhsagal
  nas s\u00e0bhailte, fhathast na chosgais iomlan don phoball A\u2019 sti\u00f9ireadh
