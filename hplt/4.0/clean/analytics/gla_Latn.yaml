  na galairean sin ''. Faodaidh baidhsagal \u00e0ite m\u00f2r a chluich ann an casg
  Is e rothaireachd aon de na d\u00f2ighean as fhe\u00e0rr air sabaid air baidhsagal
  mar ph\u00e0irt de thrafaig mar ph\u00e0irt de bheatha l\u00e0itheil a \u2019ciallachadh
