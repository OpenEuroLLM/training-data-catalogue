  bhiodh clogaid air uaireannan agus fhuair e a-mach nuair a bha e a\u2019 caitheamh
  a \u2019chlogaid gun robh an trafaic a\u2019 gluasad nas fhaisge, uaireannan cunnartach,
  agus mar sin bha d\u00e0 mh\u00ecneachadh againn a dh \u2019fhaodadh gum biodh e
  furasta dhut a bhith le clogaid a \u2019coimhead nas e\u00f2laiche air al s B\u2019
  e freagairt nan draibhearan do na m\u00ecneachaidhean eile a bha comasach gu robh
  Glamour den bheachd gu robh e air a dh\u00econ agus gum faodadh e cunnartan a ghabhail.\\nMar
  sin d\u00e8 a thachair nuair a rinn d\u00f9thchannan clogaidean baidhsagal \u00e8igneachail?
  clogaid an co-dh\u00f9nadh aca chan eil fianais sam bith ann gu bheil iad a \u2019d\u00e8anamh
  seo le wire.Many e\u00f2laichean baidhsagal a\u2019 faighinn f\u00ecor sh\u00e0rachadh
  nuair a tha iomairtean s\u00e0bhailteachd baidhsagal st\u00e8idhichte air clogaidean.
  Chan eil seillean-m\u00f2r ach mu bhith a \u2019caitheamh clogaid baidhsagal a h-uile
  uair a bhios strap agad, agus chan e clann a th\u2019 ann a bheil thusa Helmets
  gu pr\u00f2iseil a \u2019caitheamh cuid de na duilgheadasan sin nas fhe\u00e0rr
  na a\u2019 mh\u00f2r-chuid. Is e ChrisBoardman an t-seann churaidh Oiliompaiceach
  gu bhith na ghn\u00ecomhaiche baidhsagal Helmet cuspair sgaradh Tha iad buailteach
  a bhith mar fhreagairt dhaoine do \u00e0rainneachd a tha mi a \u2019faireachdainn
  gun chuideachadh Chan eil dad as urrainn dhomh a dh\u00e8anamh Tha rothaireachd
  na naomh Gn\u00ecomhachd Is e an \u00e0rainneachd tha sin cunnartach Tha feum air
  atharrachadh a chuir an Duitseach seachad 40 bliadhna a \u2019togail rathaidean
  baidhsagal s\u00e0bhailte agus cha mh\u00f2r nach eil duine a\u2019 rothaireachd
  le clogaid, ach anns an \u00d2laind tha rothaireachd timcheall air ceithir uiread
  cho s\u00e0bhailte ri pr\u00ecomh rathad na RA as aithne dhut, tha thu a \u2019toirt
  slighe ghoirid air falbh. gu dearbh ma tha thu d\u00ecreach a \u2019coimhead air
  adhart ri \u00f9idh r is e a h-uile neach-cleachdaidh rathaid an \u00e0ireamh as
  motha am measg dhraibhearan.\\nMar sin ma th\u00e8id toirt air duine clogaidean
  a chaitheamh ort taing airson a bhith a \u2019coimhead, innis dhuinn do bheachdan
  anns na beachdan gu h-\u00ecosal, thoir s\u00f9il air na h-artaigilean eile ann
  an theries agus bi cinnteach gum faigh thu ballrachd airson barrachd\\nD\u00e8 a
  bhios rothaichean a \u2019caitheamh san uisge?\\nAn aodach as cudromaiche airson
  a bhith a \u2019sabaid anuisgetha seacaid. Chan e a-mh\u00e0inthoilseacaid d\u00econ-uisge
  math c\u00f9m do torso tioramthoildo chuideachadh le bhith a \u2019riaghladh te\u00f2thachd
  do bhodhaig. Is e GoreTex an stuth as fhe\u00e0rr leis gu bheil e d\u00econach agus
  breathable. Tha stuth breathable deatamach gus nach cuir thu cus teas ort.\\nTha
  tr\u00ec pr\u00ecomh dhuilgheadasan ann le bhith a \u2019draibheadh ann an aimsir
  fhliuch: fuachd, ruith, agus fuireach gu d\u00ecreach. Mar sin, seo 10 comhairle
  a bu ch\u00f2ir do chumail a \u2019draibheadh gu comhfhurtail agus gu comhfhurtail.
  A-nis faodaidh tu uiread de fhillidhean a chaitheamh mar as toil leat thu fh\u00e8in
  a dh\u00econ bhon uisge, ach bidh malairt ann an-c\u00f2mhnaidh.\\nCh\u00ec thu,
  falbhaidh tu - gheibh thu - is d\u00f2cha nach eil cho m\u00f2r \u2018s a n\u00ec
  mi, ach leigidh tu le taiseachd teicheadh aig an \u00ecre a bheir thu a-mach e.
  Mar sin, is d\u00f2cha gum bi thu a \u2019faireachdainn nas comhfhurtail a\u2019
  caitheamh nas lugha agus a \u2019caitheamh aodach airson aimsir fhliuch. Mar sin
  ged a gheibh thu fliuch air an taobh a-muigh, gheibh thu nas lugha fliuch air an
  taobh a-staigh, ach co-dhi\u00f9 bu ch\u00f2ir dhut a h-uile fionnarachadh as urrainn
  dhut fhaighinn gus co-dhi\u00f9 teothachd do bhodhaig a riaghladh.\\nNuair a l\u00f9ghdaicheas
  tu cuideam an taidheir, thig barrachd taidhrichean air an rathad agus tha barrachd
  greim agad gu math cudromach air rathaidean fliuch leis gu bheil t\u00f2rr nas lugha
  de ghreim ann ---- mar sin tha e cudromach gun d\u00e8an thu greim cho m\u00f2r
  \u2018s as urrainn dhut. Mar a thuirt mi san ro-r\u00e0dh, faodaidh cabadaich a
  bhith na fh\u00ecor dhuilgheadas nuair a bhios tu a \u2019rothaireachd ann an aimsir
  fhliuch. A-nis tha e air sg\u00e0th gu bheil craiceann tais t\u00f2rr nas cugallaiche,
  ach san d\u00e0rna \u00e0ite, faodaidh gainmheach a bhith anns an uisge a spreadh
  le do bhaidhc ---- a dh \u2019fhaodadh gu m\u00ec-fhortanach faighinn a-steach gu
  cuid de raointean mothachail.\\nIs e deagh dh\u00f2igh air d\u00e8iligeadh ri seo
  a bhith a \u2019cleachdadh beagan uachdar chamois ---- eadhon ged nach fheum thu
  a chleachdadh ann an suidheachaidhean \u00e0bhaisteach. Is d\u00f2cha gu bheil thu
  d\u00ecreach a \u2019ceannach beagan \u00f9ine a bharrachd dhut fh\u00e8in airson
  a bhith a\u2019 faireachdainn comhfhurtail le latha fada anns an d\u00ecollaid air
  thoiseach ort. Tha a \u2019mhargaidh aodaich air a roinn ann an d\u00e0 roinn nuair
  a thig e gu g\u00e8ar s\u00ecde fhliuch ---- claisean cruaidh traidiseanta soakable
  aig a bheil aodach d\u00econ-uisge agus an uairsin claisean le teip, agus an uairsin
  tha softshells a tha nas anail, nas lugha uisge-d\u00econach, ach san fharsaingeachd
  nas fhaisge iomchaidh ---- mar sin tha sin a \u2019ciallachadh gum bi a\u2019 mh\u00f2r-chuid
  de phroifeiseantaich gan cleachdadh leis gu bheil iad a \u2019fuireach aerodynamic,
  ach gu dearbh, tha an d\u00e0 she\u00f2rsa shligean a\u2019 frithealadh diofar adhbharan.\\nAirson
  l\u00e0ithean nas fhaide, nas s\u00e0mhaiche air a \u2019bhaidhc, bidh cl\u00e0r
  cruaidh gad chumail nas tiorma agus mar sin nas bl\u00e0ithe - ach air turasan nas
  giorra agus nas cruaidhe, tha bior-losgaidh gu cinnteach nas fhe\u00e0rr oir tha
  e nas anail agus chan eil e a\u2019 sruthadh timcheall. Is e d\u00f2igh f\u00ecor
  mhath eile airson fuireach nas bl\u00e0ithe air l\u00e0ithean fliuch. Tha sin d\u00ecreach
  airson rothaireachd nas cruaidhe.\\nFaodaidh seo a bhith duilich a-nis nuair a tha
  seisean s\u00f2nraichte agad nad inntinn, ach chan eil teagamh sam bith gu bheil
  e \u00e8ifeachdach ann a bhith a \u2019d\u00e8anamh na h-obrach gum feum thu cumail
  air falbh bho rathaidean nach leig leat an gn\u00ecomh sin a dh\u00e8anamh - - mar
  sin tha mi a \u2019smaoineachadh sa mh\u00f2r-chuid air te\u00e0rnadh fada. Mar
  sin air l\u00e0ithean fliuch, feuch ri draibheadh air rathaidean a tha gu \u00ecre
  mh\u00f2r r\u00e8idh gus am bi e comasach dhut an trioblaid a ghabhail, agus bidh
  buannachd a bharrachd agad gum mair na breicichean agad nas fhaide. Is e seo aon
  de na goireasan as ruigsinneach as urrainn dhut a cheannach.\\nTha an casquette
  iriosal cuideachd mar aon den fheadhainn as \u00e8ifeachdaiche. A-nis is d\u00f2cha
  gu bheil e d\u00ecreach air a dh\u00e8anamh le cotan, ach seasaidh e do cheann nuair
  a bhios e fliuch agus cumaidh an sg\u00e0il-bhrat cuid den uisge a-mach \u00e0s
  do sh\u00f9ilean. Tha overshoes sgoinneil.\\nA-nis cha bhith iad a \u2019cumail
  do chasan gu tur tioram, ach air turas nas giorra bidh iad a\u2019 d\u00e8anamh
  obair mhath ---- agus bidh na paidhrichean tiugh a \u2019cumail do chasan snog is
  bl\u00e0th, ach is fhiach a bhith mothachail gur e deagh bheachd a th\u2019 annta
  gan caitheamh ach nuair a tha e fliuch, eadhon ged a bhiodh e bl\u00e0th a-muigh.
  Leis gu bheil thu a \u2019cumail do bhr\u00f2gan rathaid\u2018 sionnach \u2019daor
  ann an staid tip-tip mus cuir thu do bhr\u00f2gan os cionn an inneal nigheadaireachd.
  Breicichean, feumaidh tu aghaidh a thoirt air an fh\u00ecor fh\u00ecrinn gum bi
  buaidh mh\u00f2r aig na breicichean agad ---- eadhon ged a bhios breicichean diosc
  agad bheir e nas fhaide dhut slaodadh s\u00ecos, agus gu dearbh bidh buaidh mh\u00f2r
  aig do ghreim slacking air oidhirpean, ach an sin na dh\u00f2igh air seo a chuir
  air d\u00f2igh gu \u00ecre ---- agus is e sin d\u00e8anamh cinnteach gum faigh thu
  ann ro \u00e0m Nuair a bhios tu a \u2019cornachadh nuair a bhios tu fliuch, tha
  thu gu cinnteach airson a bhith a\u2019 breiceadh beagan a bharrachd oir is e breic
  an rud mu dheireadh a tha thu airson a dh\u00e8anamh ann am meadhan na h-oisinn
  airson breic no dh\u00e0 oir tha thu dha-r\u00ecribh ag \u00e0rdachadh cunnart ruith
  a-mach agus buaidh.\\nMar sin cuimhnich gum breic thu fada mus tionndaidh thu nuair
  a tha e fliuch. Mar a chaidh a r\u00e0dh roimhe, tha tarraing gu math cudromach
  air rathaidean fliuch agus tha cuid de uachdar nas miosa na feadhainn eile ----
  mar sin tha spr\u00f9illeach gu math follaiseach air an rathad, tha loidhnichean
  geal beagan nas lugha. A-nis, ann an cuid de dh\u00f9thchannan, faodaidh na loidhnichean
  peanta geal sin a bhith gu tur marbhtach agus gun m\u00f2ran gr\u00e8im a thoirt
  dhaibh.\\nIs d\u00f2cha gur e dath de she\u00f2rsa eadar-dhealaichte a th \u2019ann
  no rudeigin, ach ge bith d\u00e8 a th\u2019 ann - is e deagh bheachd a th \u2019ann
  an seachnadh, gu h-\u00e0raidh nuair a bhios tu a\u2019 breiceadh, a \u2019corniceadh
  no a\u2019 leigeil feachd bho do chluasan mar mata bl\u00e0th nuair a bhios e a
  \u2019luathachadh faodaidh e a bhith gu s\u00f2nraichte duilich nuair a th\u00f2isicheas
  an te\u00f2thachd a leigeil \u00e0s. tha miotagan d\u00econ-uisge rim faighinn a-nis,
  ach nar n-e\u00f2las chan eil iad ag obair gl\u00e8 mhath. tha do l\u00e0mhan fhathast
  fliuch agus fuar.\\nMar sin is e miotagan neoprene an roghainn eile. Is e neoprene
  an aon stuth a thathas a \u2019cleachdadh ann an suidsichean fliuch. Cha bhith e
  a \u2019cumail an uisge a-mach - bidh e a\u2019 glasadh c\u00f2mhdach anns a \u2019mhias
  ri taobh do chraicinn, far am bi e snog is bl\u00e0th a th\u00e8id sinn - deich
  d\u00f2ighean airson thu fh\u00e8in a chumail nas comhfhurtail agus gu d\u00ecreach
  anns an uisge.\\nA-nis, ma tha thu ag iarraidh beagan a bharrachd fiosrachaidh mu
  mar a n\u00ec thu oisean ann an aimsir fhliuch, tha artaigil againn mu dheidhinn.
  Faodaidh tu fhaighinn gu furasta le bhith a \u2019cliogadh air Tha, agus ma tha
  thu airson na molaidhean againn air aodach geamhraidh airson rothaireachd fhaicinn,
  faodaidh tu s\u00f9il a thoirt air an seo gu h-\u00ecosal. Agus airson ballrachd
  a thoirt do GCN - cliog air mo shoggy oir gu dearbh chan urrainn dhomh a chreidsinn
  na tha sinn a \u2019d\u00e8anamh. ''Cha bhith mi ga dh\u00e8anamh san uisge.\\nA-nis
  chan eil mi - bha mi airson a r\u00e0dh gur e an rud as fhe\u00e0rr a th \u2019agam
  mu bhith a\u2019 draibheadh gu cruaidh agus tha sinn fhathast nan seasamh fhathast-seadh
  - Rachamaid. Tha mi bog troimhe.\\nD\u00e8 an t-aodach a bhios ort fo do chlogaid
  baidhsagal sa gheamhradh?\\nSeacaid slige bog. Airson barrachd bl\u00e0ths,gutha
  seacaid slige bog no geansaidh na roghainn eadhon nas fhe\u00e0rr.Lestuth stad-gaoithe
