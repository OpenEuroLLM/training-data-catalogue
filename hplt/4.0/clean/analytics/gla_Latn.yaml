  neamh, fad \u00e0s, iomallach agus air a dhroch mh\u00ecneachadh. Ach tha beatha,
  b\u00e0s agus aiseirigh \u00ccosa air a thuigsinn nas fhe\u00e0rr anns na h-oidhirpean
  aige gus r\u00ecoghachd Dh\u00e8 a thoirt dhan talamh seo.\\nAnn an foillseachadh
  \u00ccosa aig toiseach a mhinistrealachd teagaisg, tha e ag ainmeachadh teachd Latha
