  ann am bochdainn agus tinn, a bha sa phr\u00ecosan, a bha nan tr\u00e0illean, agus
  an fheadhainn le diofar dhualchasan cinneachail agus cinneadail.\\nNas duilghe buileach
  dha na daoine beairteach agus cumhachdach bha a bheachdan air beairteas agus c\u00ecsean.
  Bha Iosa a\u2019 fuireach agus a\u2019 teagasg ann an raon f\u00ecor bhochdainn.
  Bha na daoine a\u2019 fulang leis na daoine beairteach, a bha a\u2019 fuireach ann
  am bailtean m\u00f2ra leithid Sephorus agus Tiberias, agus an fheadhainn a bha cumhachdach
  gu poilitigeach a bha gan cumail bochd leis na h-iarrtasan airson deicheamhan agus
  c\u00ecsean.\\nAch cha b'' e a mh\u00e0in gu robh Iosa ag innse sgeulachdan mu r\u00ecoghachd
  Dh\u00e8 air thalamh, dh''fhastaidh e dheisciobail gus a chuideachadh le bhith ga
  toirt gu buil; ghuidh e air son gu''n tachradh e ; theagaisg e daoin'' eile urnuigh
  a dheanamh air a shon.\\nAnns na linntean cinnteach, ge-t\u00e0, tha m\u00f2ran
