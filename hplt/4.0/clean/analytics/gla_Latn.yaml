  a r\u00e0dh mar threas clas, a tha air a dh\u00e8anamh suas de na comainn a tha
  a\u2019 teagasg leasachadh inntinn agus a \u2019tagradh conaltradh le daoine spioradail.
  Thathas ag r\u00e0dh gu bheil uinneanan ne\u00f2nach air an toirt gu buil anns na
  cearcallan agus na suidheachain aca. Tha iad cuideachd ag r\u00e0dh gu bheil buannachdan
  corporra aca, agus a bhith comasach dhaibh, a bhuileachadh air feadhainn eile. Bu
  ch\u00f2ir iad sin uile a thighinn fon d\u00e0rna clas, oir lorgar gu bheil an rud
  aca ciallach agus corporra.\\nChan eil na comainn d\u00ecomhair den chiad chlas
  ach beag an taca ris an d\u00e0rna clas; den bheagan sin chan eil ach \u00e0ireamh
  bheag sa cheud a \u2019cuideachadh na h-inntinn le leasachadh spioradail. Fon chiad
  chlas seo tha comainn de bhuidhnean creideimh a bhios a \u2019feuchainn ri na buill
  aca a chuideachadh ann an d\u00f9sgadh spioradail agus a\u2019 fosgladh - aig nach
  eil nithean mar tr\u00e8anadh poilitigeach no sti\u00f9ireadh armachd no sti\u00f9ireadh
  ann an d\u00f2ighean gn\u00ecomhachais - agus cuideachd buidhnean de bhunait feallsanachail
  is creideimh. Faodaidh an fheadhainn a tha bho chreideamhan s\u00f2nraichte buannachd
  fhaighinn le bhith a \u2019buntainn ri comann d\u00ecomhair taobh a-staigh a\u2019
  chreideimh sin mura leig nithean a \u2019chomainn leis an inntinn a chumail ann
  an dorchadas agus mura cuir iad stad air bho bhith a\u2019 faighinn e\u00f2las.
  Mus t\u00e8id aon de chreideamh sam bith a-steach do chomann d\u00ecomhair a chreideimh
  bu ch\u00f2ir dha sgr\u00f9dadh math a dh\u00e8anamh air na nithean agus na d\u00f2ighean
  aca. Tha m\u00f2ran chomainn dh\u00ecomhair taobh a-staigh gach creideamh m\u00f2r.
  Bidh cuid de na comainn dh\u00ecomhair sin a \u2019cumail na buill aca ann an aineolas
  a thaobh e\u00f2las beatha, agus bidh iad a\u2019 d\u00e8anamh cron air na buill
  aca an aghaidh chreideamhan eile. Faodaidh comainn d\u00ecomhair den leithid cron
  m\u00f2r a dh\u00e8anamh air inntinn nam ball fa-leth. Dh \u2019fhaodadh an leithid
  de thr\u00e8anadh claon-bhreith agus aineolas \u00e8igneachaidh a bhith a\u2019
  bl\u00e0thachadh, a \u2019sp\u00f9tadh agus a\u2019 sg\u00f2th na h-inntinn gum
  feum e m\u00f2ran de bheatha pian is br\u00f2in gus na h-eucoirean a dh \u2019fhaodadh
  a bhith air an toirt gu buil a cheartachadh. Faodaidh an fheadhainn aig a bheil
  dearbhaidhean creideimh iad fh\u00e8in a thaobh creideamh, buannachd fhaighinn le
  bhith a \u2019buntainn ri comann d\u00ecomhair den chreideamh sin ma choinnicheas
  nithean agus modhan a\u2019 chomainn sin le aonta na h-inntinn sin, agus fhad \u2018s
  a bhuineas an inntinn sh\u00f2nraichte sin no a \u2019faighinn oideachadh anns a\u2019
  chreideamh sh\u00f2nraichte sin. Tha creideamhan an t-saoghail a \u2019riochdachadh
  nan diofar sgoiltean anns a bheil cuid de inntinnean air an tr\u00e8anadh no air
  an oideachadh airson leasachadh spioradail. Nuair a tha aon a \u2019faireachdainn
  gu bheil creideamh a\u2019 s\u00e0sachadh miannan spioradail na inntinn, buinidh
  e don chlas de bheatha spioradail a tha an creideamh sin a \u2019riochdachadh. Nuair
  nach eil creideamh a-nis a \u2019toirt seachad rud ris an canar mar as trice biadh
  spioradail na h-inntinn, no nuair a th\u00f2isicheas duine a\u2019 ceasnachadh \u201cf\u00ecrinnean\u201d
  a chreideimh, tha e na chomharra nach buin e tuilleadh dha no gu bheil e ga sgaradh
  bhuaithe . Ma tha teagamh ann, ma tha e m\u00ec-thoilichte le agus a \u2019dol \u00e0s
  \u00e0icheadh teagasg a chreideimh gun adhbharan eile a bhith aige na m\u00ec-thoileachas
