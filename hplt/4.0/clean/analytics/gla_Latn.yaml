  ann gu bheil na buannachdan sl\u00e0inte bho rothaireachd fada nas motha na na cunnartan
  sl\u00e0inte.\\nCuideachd, chan eil baidhsagal cho cunnartach leis gu bheil daoine
  den bheachd gu bheil aon bh\u00e0s san RA airson timcheall air a h-uile 30 millean
