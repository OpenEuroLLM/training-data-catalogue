  nas duilghe a lorg agus a l\u00e0imhseachadh. Nuair a th\u00e8id a sgaoileadh le
  \u00e8igneachadh inntinn faodaidh an tumhair a dhol \u00e0 sealladh bho aon ph\u00e0irt
  den bhodhaig mar tumhair agus a \u2019nochdadh a-rithist ann am p\u00e0irt eile
  den bhodhaig mar ghoirt loathsome no aillse.\\nNuair a dh \u2019iarras aon neach
  agus a gheibh e seilbh corporra le bhith ag iarraidh orra bho\u201c an fh\u00ecor
  \u201dno\u201c taigh-st\u00f2ir an fh\u00ecor, \u201dc\u00f2rdaidh e riutha airson
  \u00f9ine oir bidh gambler a\u2019 faighinn tlachd \u00e0s na buannachdan aige.
  Ach tha an lagh ag iarraidh chan e a-mh\u00e0in gun cuir e air ais na rudan nach
