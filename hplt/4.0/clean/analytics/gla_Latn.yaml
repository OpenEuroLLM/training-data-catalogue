  fiachan a tha fo ch\u00f9mhnant.\\nNuair a dh \u2019fheuchas inntinn ri bhith na
  sheirbheiseach don bhodhaig le d\u00f2ighean d\u00ecolain, agus a\u2019 str\u00ecopachas
