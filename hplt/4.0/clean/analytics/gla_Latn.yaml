  adhbharan sti\u00f9bhardachd. B\u2019 e plana \u00ccosa a bh\u2019 ann airson cuir
  \u00e0s do bhochdainn.\\nTha mi a\u2019 cumail a-mach gum bu ch\u00f2ir am B\u00ecoball
