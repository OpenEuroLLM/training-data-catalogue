  Texas\\nTi ta kouri Hood ta pou li nan klas, comme habitude.Ede l'' ale class osi
  vit ke nou kapab par l'' sourit la!\"", "\"Mediterane klima\\nNan klimatoloji, klima
  Mediterane a (CS dapre K\u00f6ppen klima klasifikasyon an , ki moun ki rele l ''
  Aethesian klima) se pi piti anpil nan tanpere klima . Li se karakterize pa yon pery\u00f2d
  tan de lapli mouason ak hailstorms abondan ak grenn rive 70-80mm an dyam\u00e8t,
  s\u00e8k ete ak lapli sezon iv\u00e8 ak tanperati tw\u00f2 grav; lanm\u00e8 kontribye
  yo ak klima a, ki se tanpere cho, ak tanperati chanjman chak jou ak chak ane mod\u00e8s
  (mwens pase 21 \u00b0 C): an reyalite, lanm\u00e8 a kenbe chal\u00e8 ete a akimile
  li epi li L\u00e8 sa a, lage l ''pandan sezon liv\u00e8 an.\\nAsosyasyon an nan
  ete s\u00e8k ak lapli sezon iv\u00e8 se yon karakteristik tipik nan klima Mediterane
  a: an reyalite, nan pr\u00e8ske tout klima (eksepte klima maritim ak konstan lapli
  ak dez\u00e8 klima kote li pr\u00e8ske pa janm lapli) pi f\u00f2 nan lapli a tonbe
  nan sem\u00e8s la cho: li ta dwe remake ke moun ki rate a nan lapli nan cho demi-ane
  propos agrikilti a nan yon dezavantaj konpare ak klima a Sinic .\\nDefinisyon\\nK\u00f6ppen
  defini klima a CS k\u00f2m youn nan nan ki pi ba mwa a lapli nan sem\u00e8s la cho
  gen yon lapli manm mwens pase yon ty\u00e8 nan sa yo ki an umid mwa a sezon fredi
  ak nan nenp\u00f2t ka mwens pase 30 mm. Si mwa a pi s\u00e8k gen yon total de mwens
  pase yon ty\u00e8 nan mwa a umid men pi gran pase 30 mm li pral idantifye k\u00f2m
  Cfs\\nSalvador Rivas Mart\u00ednez defini yon bioclimate Mediterane k\u00f2m youn
  nan ki gen omwen de mwa youn apre l\u00f2t nan sechr\u00e8s ete.\\nSous-types\\nKlima
  a ki te Mediterane gen de tip debaz: CSA ak ete cho ak CSB ak pi cho ete.\\nCSA\\nSubtip
  nan CSA, nan ki tanperati a nan mwa a pi cho se pi wo a 22 \u00b0 C, se yo te jwenn
  ansanm z\u00f2n yo koty\u00e8 nan Mediterane a ak Pw\u00f2ch Oryan an, pandan ke
  yo nan z\u00f2n yo dey\u00f2 b\u00f2 lanm\u00e8 gen pi ba tanperati (nan Marrakech
  nan Mar\u00f2k tanperati an mway\u00e8n mwa Jiy\u00e8 a se 20 \u00b0 C). tanperati
  ki wo anpil yo ekri nan ary\u00e8r an Kalif\u00f2ni (wouj Bluff, ak yon mway\u00e8n
  Jiy\u00e8 tanperati ki nan 27.5 \u00b0 C).\\ncsb\\nSubtip nan CSB se tipik nan z\u00f2n
  koty\u00e8 nan California ak Oregon tankou Santa Monica ak San Francisco ak yon
  mway\u00e8n de 18.9 \u00b0 C ak 17.7 \u00b0 C respektivman. Gen k\u00e8k kote nan
  Frans, Mar\u00f2k, Latiki, Chili ak Ostrali tou apatni a sa a subtip. Yon regilarite
  ekstr\u00e8m nan tanperati rive nan Zile yo Farallon nan San Francisco, kote tanperati
  a mway\u00e8n nan mwa a pi fr\u00e8t se 12 \u00b0 C ak sa yo ki an mwa a pi cho
  se 14 \u00b0 C.\\nrejim Tranzisyon\u00e8l\\nContinental Mediterane klima\\nKlima
  a ki te kontinantal Mediterane , tranzisyon nan direksyon pou klima a stepik , ki
  karakterize pa dire a ki pi kout nan sezon lapli a sezon liv\u00e8 ak ki pi gran
  pase varyasyon yo tanperati , tou de dyurnal ak chak ane.\\nSub-Mediterane klima\\nKlima
  a ki te sub-Mediterane , tranzisyon nan direksyon pou klima a tanpere imid , ki
  karakterize pa dire a ki pi kout nan sezon ete a s\u00e8k, pa tanperati yo relativman
  pi ba osi byen ke pa posibilite pou Lan\u00e8j ki Tonbe an , byenke pa tr\u00e8
  souvan. nan peyi Itali ka klima sa a ka jwenn ansanm Shores yo nan Lake garda .\\nDistribisyon\\nNan
  Ew\u00f2p , li se tipik nan rejyon yo fonty\u00e8 Mediterane Lanm\u00e8 : Itali
  an , sid la ak b\u00f2 sol\u00e8y leve nan peyi Espay , k\u00f2t Mediterane a nan
  Lafrans ak penensil la Balkan . Nan peyi Itali li se te jwenn pi wo a tout sou Ligurian
  , tireny\u00e8n ak Ionian rejyon ki toupre . Sou Adriyatik rejyon ki toupre nan
  k\u00f2t lw\u00e8s la li pa ale nan n\u00f2 rimini , ak\u00f2z pwoksimite a nan
  fon an Po, ki te gen yon klima sub-kontinantal yo. Sou k\u00f2t l\u00e8s nan Adriyatik
  a li dat tounen anpil pi lwen nan n\u00f2, ki gen ladan Dalmasi , teren an koty\u00e8
  nan wisteria ak pwovens lan nan triy\u00e8st , kote klima a se Mediterane pou tanperati,
  men ta ka konsidere tankou tranzisyon an referans a lapli (nan Osmer estasyon nan
  triy\u00e8st mway\u00e8n nan 25 ane ki sot pase yo se 877 mm. pou chak ane, ak mwa
  a pi s\u00e8k, jiy\u00e8, ki te rive nan yon mway\u00e8n de 54 mm. nan lapli, yon
  kantite lajan egal a mwatye, epi yo pa yon twazy\u00e8m, nan mwa. lapli a, Novanm,
  ak 109 mm.). Tipikman Mediterane z\u00f2n ki gen sijesyon subtropikal yo Sid Itali
  , Sicily ak Sardinia .\\nMenm klima konparab nan z\u00f2n ki chita sou l\u00f2t
  kontinan yo konsidere k\u00f2m egzanp nan Mediterane klima: pou egzanp, nan basen
  Mediterane a li se tou yo te jwenn nan Turkish rejyon ki toupre ak Pw\u00f2ch Oryan
  an . Nan Lafrik di gen yon klima Mediterane sou Maghreb rejyon ki toupre ak nan
  rejyon an Cape ; b\u00f2 lanm\u00e8 California ak santral Chili gen yon klima konparab
  nan Amerik yo , ak k\u00f2t la sidw\u00e8s nan Ostrali . An rezime, sa yo, se z\u00f2n
  klimatik ki sitiye yon ti kras pi lwen n\u00f2 oswa yon ti kras nan sid twopik yo,
  ki f\u00e8 klima a olye grav. Sa a se rezon an pou kisa se klima Mediterane a pafwa
  konsidere k\u00f2m subtropikal , k\u00f2m pou egzanp pa trol ak Paffen .\\nVejetasyon\\nAgrikilti
  ak elvaj yo te pratike gen pou sy\u00e8k. Nan z\u00f2n sa yo, se sezon lete an tr\u00e8
  s\u00e8k ak f\u00e8mye itilize irigasyon sist\u00e8m ki kapab exploiter tou de dlo
  sifas ak dlo anba t\u00e8 yo grandi pye oliv , pye rezen , fwi Citrus ak sereyal
  . Ki kote pa gen okenn rek\u00f2t agrik\u00f2l, gen Evergreen for\u00e8-kalite oswa
  vejetasyon ti touf bwa-kalite.\\nTe Klima a ki te Mediterane det\u00e8mine div\u00e8s
  kalite ekosist\u00e8m , nan la ki pi popil\u00e8 ki se fwote nan Mediterane . Nan
  Kalif\u00f2ni, yon kalite ki sanble rele CHAPARRAL prevo pandan ke yo nan z\u00f2n
  nan Cape yo rele sa fenbo ak se patikily\u00e8man moun rich nan div\u00e8site biyolojik
  .\\nBibliyografi\\n- Mario Pinna, atmosf\u00e8 a ak klima, Torino, UTET a, 1978.\\n-
  Fulvio Fulvi, Dictionary nan Jewografi Fizik, lavil W\u00f2m, Newton Compton, 1996.\\nL\u00f2t
  pwoj\u00e8\\nLyen ekst\u00e8n\\n- Bioclimate a Mediterane nan Ew\u00f2p: Gwoup Mizik
  thermoclimatic , sou globalbioclimatics.org.\\n- Rap\u00f2te nan z\u00f2n nan etid
  nan Coast la triy\u00e8st (PDF), sou Regione.fvg.it.\"", "\"Jwe Jw\u00e8t Fiziyad
