sample: '["\"Le pr\u00e9sident de la chambre des d\u00e9put\u00e9s met le pr\u00e9sident
  Martelly en garde contre toute tendance \u00e0 faire pression sur le parlement en
  vue d\u2019un vote favorable au premier ministre d\u00e9sign\u00e9 Daniel-G\u00e9rard
  Rouzier.\\nUne allusion au \u00ab robot-call \u00bb de Michel Martelly \u00e0 des
  membres de la population pour les informer de son choix.\\n\u00ab Ce n\u2019est
  pas la proc\u00e9dure trac\u00e9e par la constitution \u00bb, estime Saurel Jacinthe.\\nPar
  ailleurs, le pr\u00e9sident de la Chambre basse dit n\u2019avoir trouv\u00e9, jusqu\u2019\u00e0
  pr\u00e9sent, aucune correspondance du chef de l\u2019Etat convoquant les d\u00e9put\u00e9s
  \u00e0 l\u2019extraordinaire.\\nM. Jacinthe nie que ce retard soit d\u00fb \u00e0
  des n\u00e9gociations avec les diff\u00e9rents blocs parlementaires.\\nLe d\u00e9put\u00e9
  de Moron/Chambellan a toutefois mentionn\u00e9 une rencontre qui \u00e9tait pr\u00e9vue,
  hier mardi, entre les responsables du Groupe Parlementaire du Renouveau, le bloc
  majoritaire domin\u00e9 par la plateforme INITE, et le premier ministre d\u00e9sign\u00e9,
  sur invitation de ce dernier.\\nSaurel Jacinthe map reponn ou mwen menm afe de mise
  en garde ou wa fourel nan poche ou menm jan ou te di l pou prezidan Martelly kek
  semen de sa. Se you travay ke nou vin fe pou mete peyi kraze santi saa nan you pi
  bon eta se pa goumen ni voye pye nou vin fe nan palman an si se sou goumen nou ye
  se poun al cheche ou teren kote yo fe sa men pa nan palman an. Menm jan nou pemet
  nou di prezidan Martelly saa map di nou tout mete dlo nan di vin nou tande. se pep
  la ki voye nou defann intere l se pa machandaj plas li voye nou vin fe\\nGren, m
  ta rinmin ke sweet micky pose l pcq ratification doit passer entre le parlement
  et la presidence. pas question de robot call a la population de la part de tisimone.
  nou mele avek neg sa. se paleman pa ratifie chwa la pcq li te deja chwazil depi
  4mwa. ti groupe petion ville pabral fe anyen serie nan pays a. ke timone konnan
  role l. novice qu\u2019il est en politique. qui donc, on peut pas prendre 2 novices
  en pol a la tete du pays\\nJeff mregret sa men ou se you ignoran de premiere espece
  alo se poum pa diw k ou se lot la ou konprann. ki saw ye pou ap mande prezidan an
  poul pose se ou k pou pose ou pa legume nan soup la. non saa ou renmen anpil la
  mkonprann pou kisa pask manmanw se ti simone li rele.\\nSi on parle de changement
  reel, c\u2019est normal que la presidence donne une chance au parlement de faire
  son travail. On n\u2019est pas oblige d\u2019etre populiste pour travailer pour
  le bien \u2013 etre de la nation. Merci\\nMwen pat vote mateli, men si li ap f\u00e8
  sa ki bon f\u00f2k nou tout ayisyen apiye li, paske se peyi nou, nou vle sove, mich\u00e8l
  f\u00e8 sa ki bon bravo, li f\u00e8 sa ki pa bon nou dwe montre ke nou pa dak\u00f2.
  Mateli chwazi yon moun ki konn travay byen, Konbyen n\u00e8g politik ki te premye
  minis? anpil, kisa yo te p\u00e8m\u00e8t peyi a? mwen pa w\u00e8. Antouka ann kite
  w\u00e8 negatif, ann avanse devan pou peyi nou chanje li pa ka desann pi ba ank\u00f2.
  Palman an la pou li f\u00e8 kontr\u00f2l, li pa la pou li egzije p\u00f2s, yo vle
  chat veye mant\u00e8g, se sak f\u00e8 peyi a toujou tonbe nan tchouboum. P\u00e8,
  lanmou, limy\u00e8 sou ayiti e nan k\u00e8 nou!!!\\nNou gen on peyi ki bezwen avanse
  kounyea men gen moun k\u2019ap pale de \u201ccouleur\u201d PM design\u00e9. Kote
  peyi sa-a prale?\\nSur la question d\u2019experience dans l\u2019administration
  publique: je pose cette question a quiconque veut repondre. Quels sont les resultats
  positifs produits par ceux qui viennent du secteur public? Mezanmi, nou pa w\u00e8
  toujou! Administration publique la Ayiti se medyocrite sou medyokrite, gagot sou
  gagot. Se sa-a nou rele eksperyans lan.\\nAvan nou vin krusifye mwen, m\u2019 tou
  f\u00e8 nou konnen mwen konprann tr\u00e8 byen ke relayite secteur prive a pa menm
  jan ak secteur public la.\\nArticle 13 de la constitution Daniel Rouzier ne peut
  pas \u00eatre Premier Ministre\\nPOUR LA COMMISSION DU SENAT DEVANT RATIFIER LE
  CHOIX DE DANIEL ROUZIER : LA NOMINATION DE DANIEL ROUZIER EST ILLEGALE ET INCONSTITUTIONNELLE\\nLa
  nomination de Daniel Rouzier a titre de Premier Ministre d\u2019Haiti est ill\u00e9gale
  et inconstitutionnelle. Rouzier est Consul de la Jamaique en Haiti. En sa qualit\u00e9
  de Consul Honoraire de la Jamaique en Haiti, il occupe un poste politique au service
  d\u2019un gouvernement \u00e9tranger. La Convention de Vienne sur les Relations
  Consulaires du 24 Avril 1963 et entr\u00e9e en vigueur le 19 mars 1967 exige dans
  son article 55 que \u00ab Sans pr\u00e9judice de leurs privil\u00e8ges et immunit\u00e9s,
  toutes les personnes qui b\u00e9n\u00e9ficient de ces privil\u00e8ges et immunit\u00e9s
  ont le devoir de respecter les lois et r\u00e8glements de l\u2019Etat de r\u00e9sidence.
  Elles ont \u00e9galement le devoir de ne pas s\u2019immiscer dans les affaires int\u00e9rieures
  de cet Etat. \u00bb\\nLes lois et r\u00e8glements de l\u2019Etat d\u2019Haiti n\u2019acceptent
  pas que des personnes d\u2019origine ha\u00eftienne dans un poste politique au service
  d\u2019un gouvernement \u00e9tranger soient nomm\u00e9es Premier Ministre, Pr\u00e9sident
  d\u2019Haiti , Ministre ou places dans les hautes sph\u00e8res d\u2019actions des
  trois pouvoirs de l\u2019Etat. Par respect des lois et r\u00e8glements de l\u2019Etat
  d\u2019Haiti Daniel Rouzier aurait du d\u00e9cliner l\u2019offre de devenir Premier
  Ministre de Martelly pour ne pas s\u2019immiscer dans les affaires politiques de
  la nation ha\u00eftienne, envelopp\u00e9 dans le drapeau jama\u00efcain.\\nLe nouveau
  Premier Ministre d\u00e9sign\u00e9 ne peut se pr\u00e9valoir de sa qualit\u00e9
  d\u2019haitien pr\u00eat pour un tel poste , avec un titre de Consul au service
  d\u2019un gouvernement \u00e9tranger. Selon la Constitution dans son article 13\\n\u00ab
  La Nationalit\u00e9 ha\u00eftienne se perd par :\\na) La Naturalisation acquise
  en Pays \u00e9tranger;\\nb) L\u2019occupation d\u2019un poste politique au service
  d\u2019un Gouvernement Etranger;\\nc) La r\u00e9sidence continue \u00e0 l\u2019\u00e9tranger
  pendant trois (3) ans d\u2019un individu \u00e9tranger naturalis\u00e9 ha\u00eftien
  sans une autorisation r\u00e9guli\u00e8rement accord\u00e9e par l\u2019Autorit\u00e9
  comp\u00e9tente. Quiconque perd ainsi la nationalit\u00e9 ha\u00eftienne, ne peut
  pas la recouvrer. \u00bb\\nRouzier tombe dans la cat\u00e9gorie b de la Constitution.
  S\u2019il d\u00e9missionne et aille en proc\u00e8s pour tenter de recouvrer la nationalit\u00e9
  haitienne int\u00e9grale , il devrait attendre une longue proc\u00e9dure , la justice
  pourrait decider de consid\u00e9rer les pr\u00e9visions constitutionnelles appliqu\u00e9es
  pour un autre cat\u00e9gorie et il devra alors attendre 5 ans apr\u00e8s pour \u00eatre
  \u00e9ligible a occuper une telle fonction en Ha\u00efti . La loi est dure mais
  c\u2019est la loi. C\u2019est une question de principe qui concerne la R\u00e9publique.
  Le Parlement ne devrait pas se fermer les yeux.\\n@ Mr. Sorel,\\nJe suis un Dessalinien
  et par-dessus tout un noiriste qui croit dans le pouvoir de la majorit\u00e9. Cependant,
  la majorit\u00e9 a eue le pouvoir depuis plus de six d\u00e9cennies ; qu\u2019est
  ce qu\u2019on a fait ? Les indicateurs socio-\u00e9conomiques sont l\u00e0 pour
  t\u00e9moigner leur m\u00e9diocrit\u00e9 dans la gestion des deniers publics. Je
  profite pour r\u00e9pondre \u00e0 Sorel Jacinthe, comme Je l\u2019ai toujours dit
  \u00e0 mes amis/ coll\u00e8gues, le probl\u00e8me d\u2019Ha\u00efti n\u2019est pas
  au fond un probl\u00e8me politique, mais un probl\u00e8me de Gestion. Si c\u2019est
  bien Monsieur Rouzier qui aura cette possibilit\u00e9 d\u2019apporter ce changement
  tant attendu par ce peuple meurtri, qu\u2019il sera le bienvenu. Mr Sorel, si le
  peuple a fait choix d\u2019un Sweet Micky, par d\u00e9duction, c\u2019est que le
  peuple est bel et bien fatigu\u00e9 avec vous (ses politiciens noirs de la classe
  moyenne qui ne voient que vos int\u00e9r\u00eats mesquins et non l\u2019int\u00e9r\u00eat
  de la majorit\u00e9 noire). Si j\u2019\u00e9tais \u00e0 la place de Mr. Sorel, je
  resterais la bouche cousue apr\u00e8s l\u2019\u00e9lection de Sweet Micky. C\u2019est
  bien qu\u2019il a fait son mea culpa, mais cela ne doit pas rester \u00e0 ce stade,
  ses messieurs qui sont aux timons des affaires depuis plus de Vingt ans doivent
  tirer leur r\u00e9v\u00e9rence, aussi simple que cela.\\nGrenn se ti kokorat ou
  ye et ou pa anyen nan cervel ou. se manche w ka mache deriere mouin. mais mwen pap
  mache derire timone comme w. d\u2019ailleurs se you ti neg so meme jan avek w. sa
  ou k itil peye apre boule caoutch pou li. koko rat\\njan grenn ap pale-a o wi (se
  on travay nou vin fe pou retire peyi kraze santi sa)mwen te ka konprann se Rouzier
  kap pale wi,men par edukasyonlse sur li pe tap pale konsa.\\nNan politik pa gen
  fe kado non.si sa te fasil konsa OBAMA ta gentan fe tout sa li te promet yo rebubliken
  yo pa ta metel nan ti soulyel.lipa gen majorite-a moun kap viv amerika yo konnen
  sam map di la.gen bagay se nan konpromi pou li fet.epi se on kestyon de loi,konstitution.sinon
  se pou tout inite chita lakay yo pou ou we si 3 depute miky yo plus zanmil yo ratifye
