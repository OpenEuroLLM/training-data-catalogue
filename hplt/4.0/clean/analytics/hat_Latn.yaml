  nan alantou 300 milyon zloti Polon\u00e8 (73 milyon ero) ki gen ladan Afrykarium
  a, premye Oseyaneri a nan Pol\u00f2y, yon etablisman inik nan mond lan, dedye s\u00e8lman
  nan flora ak fon Afriken yo \\\"\\nNouvo bilding nan bati espesyalman nan kay Afrykarium
  a se 160 m\u00e8t nan long\u00e8 ak 54 m\u00e8t nan laj\u00e8 e li gen yon wot\u00e8
