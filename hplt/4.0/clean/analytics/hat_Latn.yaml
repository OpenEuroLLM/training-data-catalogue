  e deside de desten tout l\u00f2t moun.\\nKonklizyon: Lespwa nan yon mond ki ka e
  dwe chanje\\nJounen jodia, plis ank\u00f2 ke y\u00e8 oubyen anvany\u00e8, e l\u00e8
