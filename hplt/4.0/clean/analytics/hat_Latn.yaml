  kalite dosye pwogram nan ta dwe f\u00e8 rech\u00e8ch pou jwenn ak \\\"nanNext\\\"Bouton
  se aktif, klike sou li pou li ale nan pwochen etap la nan s\u00f2sye a enp\u00f2te.\\n-
  Pwogram rech\u00e8ch yo pou dosye nan kote adr\u00e8s la ki espesifye (ou ka mete
  fen nan pwosesis rech\u00e8ch la nan nenp\u00f2t moman pa klike a \\\"Avote\\\"Bouton)
  epi montre rezilta rech\u00e8ch la. Ou kapab dezaktive dosye yo neses\u00e8 many\u00e8lman
  oswa itilize ch\u00e8k la Tout dezaktive / tout bouton nan t\u00e8t yo nan fen\u00e8t
  la. Yon fwa f\u00e8, kontinye nan pwochen etap la nan pwosesis la enp\u00f2te pa
  klike sou \\\"aNext\\\"Bouton.\\n- Outlook Import S\u00f2sye ofri anpil opsyon tretman
  done ak filt\u00e8 ki ka itilize pou amann akor-pwosesis la enp\u00f2te. Ou ka s\u00e8vi
  ak youn nan Prereglaj yo ki disponib oswa chwazi anviw\u00f2nman koutim. Si ou pa
  fin asire osij\u00e8 anviw\u00f2nman yo ou ta dwe chwazi import anl pespektiv, jis
  kite yo chanje epi kontinye nan pwochen etap la nan s\u00f2sye an.\\n- Chwazi depo
  nan destinasyon pou done yo enp\u00f2te. Sa ka la swa default pespektiv depo, yon
  ki deja egziste pst dosye oswa yon nouvo pst dosye. Si yon dosye pst se modpas-pwoteje,
  ou pral bezwen antre nan modpas la nan yon jaden ki koresponn pi wo a jaden a dosye
  destinasyon. Yon fwa f\u00e8, klike sou \\\"K\u00f2manse\\\"A k\u00f2manse nan Anl
  pespektiv pwosesis konv\u00e8syon.\\n- Etap final la nan s\u00f2sye a p\u00e8m\u00e8t
  ou pran yon gade nan bout\u00e8y la, sesyon-an enp\u00f2te pwogram ki te jis ranpli.\\nPou
  plis enf\u00f2masyon sou importation dosye anl nan pespektiv ak l\u00e8 l s\u00e8vi
  av\u00e8k S\u00f2sye Import pespektiv, Ale sou sit ofisy\u00e8l la ak videyo ki
  anba la a. Li genyen ladan li yon BECA de karakteristik Import pespektiv S\u00f2sye
  epi yo montre kouman import anl pespektiv nan fason ki pi efikas.\"", "\"\u2014pa
  TontonGuy\\nL\u00e8 yon j\u00e8n tifi etidyan blanch te aproche Malcolm X e mande
  li ki sa li ka f\u00e8 pou l ede koz p\u00e8p nwa ameriken an, misye te reponn li
  li ta preferab pou etidyan an ale nan \u00abmilye blan yo\u00bb pou li ede chanje
  sist\u00e8m enjistis ke blan yo tabli a. Pres\u00e8p dizon sila a pa gen ankenn
  moun ki pi aplike li ke Jean-Paul Sartre ak Simone de Beauvoir, yon kouplay de de
  nan pi gran filoz\u00f2f Lafrans akouche depi tout listwa li. Sa Malcolm X te vle
  di nan parab\u00f2l sa a se: se pa pat\u00e8nalism ak charite kretyen kap kapab
  demantibile sist\u00e8m opresyon ki ekziste a; sa ap rive s\u00e8lman l\u00e8 klas
  ak p\u00e8p domine yo yomenm \u00f2ganize pou yo goumen e chanje sitiyasyon an,
  epitou l\u00e8 moun ak sekt\u00e8 pwogresis ki s\u00f2ti nan milye sa yo yomenm
  pran konsyans e goumen pou chanje pw\u00f2p sist\u00e8m ke yomenm tou ka privilejye
  andann lan.\\nJean-Paul Sartre (1905\u20131980) te yon loraj kale depi li te toupiti.
  Misye te gen s\u00e8lman douz zan l\u00e8 li te ekri premye liv li, de ti roman,
  Pour un Papillon, Le Marchand de braises, kote li dekri (e kritike antreliy) milye
  sosyal e familyal li tap viv la. An 1943, nan tyouboum pery\u00f2d fachis e Dezy\u00e8m
  g\u00e8 mondyal nan Ew\u00f2p, Sartre pibliye yon trete filozofik, L\u2019\u00catre
  et le N\u00e9ant, ki rejte tout ide otorite, tout sist\u00e8m alyenasyon ak dominasyon,
  e tout bary\u00e8, strikti sosyal, politik e entelekty\u00e8l ki ekziste pou anpeche
  moun \u00abviv lib\u00e8te yo\u00bb. Liv la te f\u00e8 yon pak\u00e8t bri nan lemond
  e li vin pwopaje mouvman filozofik yo rele \u00abEkzistansyalism\u00bb la.\\nT\u00e8z
  fondamantal ekzistansyalism la se deklarasyon li ke \u00abekzistans presede (vin
  anvan) esans\u00bb yon pozisyon ki ranv\u00e8se radikalman kwayans filozofik tradisyon\u00e8l
  la depi tan Platon (427\u2013347 anvan tan Jezikri) ki te toujou mete \u00abesans\u00bb,
  s\u00e8tadi yon swadizan karakt\u00e8 ideyal, predet\u00e8mine, p\u00e8manan, nati
  moun, ki k\u00f2mkwa kondisyone definitivman kondwit lavi yo. Sartre pat dak\u00f2
  ak t\u00e8z sa a, li refite li pou l deklare ke okontr\u00e8 ekzistans, s\u00e8tadi
  kondisyon pratik moun ap viv, vin anvan esans yo, otreman di, kondisyon pratik lavi
  yon moun vin anvan sipozisyon karakt\u00e8 ideyal, predet\u00e8mine nati moun lan.
  Pozisyon filozofik sa a te deja mete misye nan preske menm dyeksyon av\u00e8k Karl
  Marx, ki li te di filoz\u00f2f yo te pase tw\u00f2p tan ap divage sou \u00abesans\u00bb
  mond la: li l\u00e8 pou yo chanje li!\\nSartre itilize (e metrize) plizy\u00e8 f\u00f2m,
  medy\u00f2m e disiplin entelekty\u00e8l pou li pwopaje z\u00e8v li: roman, teyat,
  kritik liter\u00e8, biografi liter\u00e8, otobiografi, es\u00e8 (etid) politik,
  jounalism, filozofi, elatriye. E misye te maton e kones\u00e8 nan tout nan yo. Paekzanp,
  byenke plis moun te konnen misye akoz py\u00e8s teyat li (pami yo Les Mains sales,
  Le Diable et le Bon Dieu, Les S\u00e9questr\u00e9s d\u2019Altona) e z\u00e8v politiko-filozofik
  li (L\u2019\u00catre et le N\u00e9ant, Critique de la Raison Dialectique, Les Situations,
  elatriye), misye te resevwa Pri Nob\u00e8l la an 1964 pou z\u00e8v literati li,
  patikily\u00e8man pou roman La Naus\u00e9e, Les Chemins de la libert\u00e9, e pou
  sitou Les Mots, yon otobiografi ki s\u00e8lman kouvri douz premye ane lavi Sartre,
  e ke tout moun konsidere kou yon chef d\u2019\u0153uvre, yon chel\u00e8n liter\u00e8
  klasik. Li deklare nan liv sa a ke li te deside pou l pa kw\u00e8 nan Bondye ak
  relijyon depi l\u00e8 li te toupiti: Granm\u00e8 li ak granp\u00e8 l konn pase tout
  tan yo sou tab dine lakay yo ap f\u00e8 diskisyon sou kil\u00e8s nan relijyon yo
  a (youn te katolik, l\u00f2t la te pwotestan) ki pi bon. Tibon\u00f2m Sartre konkli
  si y ap diskite konsa a sou kil\u00e8s ki pi bon, tou de dwe pa bon!\\nK\u00f2m
  nou konnen, Sartre refize asepte Pri Nob\u00e8l la; e sa s\u00e8lman nan limenm
  te f\u00e8 yon gwo eskandal nan milye liter\u00e8 nan lemond antye, paske se te
  yon bagay ra pou yon moun refize Pri Nob\u00e8l la, yon konsekrasyon prestijye ke
  tout moun ta renmen resevwa! Sartre jistifye rejetasyon li de Pri Nob\u00e8l la
  pa fason klas dirijan entelekty\u00e8l ewopeyen yo itilize li pou yo f\u00e8 pwopagann
  kont peyi sosyalis yo; li kritike lef\u00e8tke yo pa janm bay yon ekriven ki sot
  nan rejim kominis yo Pri a. Epitou Sartre mande komite jij nan Stockholm yo \u00abkil\u00e8s
  ki bay yo dwa ak otorite pou yo deside de val\u00e8 ak enp\u00f2tans l\u00f2t ekriven?\u00bb.
  Misye panse ke sa tou se yon l\u00f2t f\u00f2m kolonyalism kiltir\u00e8l. Finalman,
  Sartre di li konsidere tit Pri Nob\u00e8l la limenm, d\u00e8y\u00e8 non yon ekriven,
  yon pretansyon mov\u00e8z fwa, yon operasyon piblisite ki \u00abf\u00e8 presyon\u00bb
  sou lekt\u00e8 yo pou yo bay liv la ak ot\u00e8 a enp\u00f2tans menm l\u00e8 tou
  l\u00e8 de ka medy\u00f2k.\\nYoun nan bagay ki te remakab ka Jean-Peaul Sartre,
  s\u00e8ke menm l\u00e8 tout moun te konsidere l kou nons\u00e8lman youn nan pi gwo
  pans\u00e8 ewopeyen, men tou kou \u00abkonsyans venty\u00e8m sy\u00e8k\u00bb la,
  dapr\u00e8 dizon Herbert Marcuse, limenm tou yon l\u00f2t gwo filoz\u00f2f venty\u00e8m
  sy\u00e8k la, Sartre te f\u00e8 jwenn tou zaksyon l av\u00e8k lapaw\u00f2l nan pwoj\u00e8
  lib\u00e8te li te kw\u00e8 ladann lan. Paekzanp, nons\u00e8lman misye te patisipe
  nan gran mouvman rezistans kont okipasyon nazi a sou Lafrans, men li kontinye mennen
  zaksyon militan kont sist\u00e8m enjistis, rasis ak opresyon klas dominan frans\u00e8
  e oksidantal yo jiska lanm\u00f2 li an 1980. Twa sem\u00e8n s\u00e8lman anvan l
  mouri, nan yon ent\u00e8vyou 3-pati nan revi Le Nouvel Observateur, l\u00e8 Benny
  Levy te mande Sartre ki sa li panse de boujwazi frans\u00e8 a, misye te reponn ke
  youn nan konviksyon jen\u00e8s li li vle mouri av\u00e8 l se rayisman li te toujou
  genyen pou boujwazi dominan, ipokrit e pretansye ki ekziste nan lemond yo. Diran
  tout vi li, Sartre patisipe, rele, joure, bay kout men, angaje l, kontribye nan
  preske tout lit liberasyon non s\u00e8lman travay\u00e8, imigre e klas oprime an
  Frans e nan l\u00f2t peyi oksidantal yo, men tou nan lit liberasyon p\u00e8p ak
  peyi ty\u00e8smond yo kont dominasyon boujwazi neo-kolonyalis oksidantal yo.\\nChimen
  angajman politik Sartre kannale l tou nan kan opozisyon kont lag\u00e8 gouv\u00e8nman
  meriken an kont p\u00e8p Vyetnam lan: diran lag\u00e8 a Sartre ak filoz\u00f2f angle
  a, Bertrand Russell, prezide yon tribinal ent\u00e8nasyonal politiko-senbolik, rele
  Tribinal Russell, ki jije e kondane krim kont limanite f\u00f2s milit\u00e8 meriken
  yo tap koze ka p\u00e8p vyetnamyen an. Pandan menm tan an li denonse tou l\u00f2t
  lag\u00e8 enperyalis ki tap mennen kont aspirasyon liberasyon p\u00e8p afriken yo
  e kon politik dominasyon gouv\u00e8nman meriken an an Amerik latin, patikily\u00e8man
  nan Kiba kote Sartre ak de Beauvoir ale vizite Castro ak Che Guevara (1961) pou
  yo pote solidarite yo ak lit anti-enperyalis kiben an.\\nSa yo te rele Lag\u00e8
  Aljeri a (1945\u20131962) vin youn nan gwo koz Sartre angaje l tout antye. Li nons\u00e8lman
  ekri prefas liv t\u00e8tchaje, labib antikolonyalis Frantz Fanon an, Les Damn\u00e9s
  de la Terre, yon liv e prefas ki f\u00e8 Ew\u00f2p reyaksyon\u00e8 tranble e ki
  f\u00e8 anpil moun pran konsyans sou malveyans gouv\u00e8nman enperyalis oksidantal
  yo, men tou Sartre patisipe aktivman nan rezistans kont lag\u00e8 a, li denonse
  koupab yo e rele pou tout moun vin bay solidarite yo nan rezistans lit liberasyon
  p\u00e8p aljeryen an. Eleman makouto-fachis milye ent\u00e8vansyonis anti-aljeryen
  klas politik frans\u00e8 yo jete bonm sou kay misye plizy\u00e8 fwa akoz de aktivite
  militan l; e se pa chans li te sove.\\nNou vle souliye tou kons\u00e8p n\u00e8f,
  orijinal, Fanon devlope sou vyolans nan liv sa a, kote li di ke vyolans kolon yo
  ap maspinen sou kolonize yo se yon mwayen sistematik pou eseye rive dezimanize yo,
  pou f\u00e8 yo p\u00e8di nanm moun yo; li kontinye pou l di ke, nan yon t\u00e8l
  kondisyon, kont-vyolans oubyen vyolans anti-vyolans b\u00f2 kote kolonize yo kont
  vyolans kolonizat\u00e8 yo, vin tounen yon zaksyon ki \u00abre-imanize\u00bb kolonize
  yo, ki rebay yo plas yo pami moun. Sartre ba l repondonn e ajoute ke vyolans sila
  a, se yon \u00abvyolans liberat\u00e8\u00bb, yon vyolans kreyatif, nan menm sans
  Malcolm X te rele kont-vyolans nwa oprime yo, yon \u00abvyolans moun entelijan\u00bb.\\nRelasyon
  ant \u00abLib\u00e8te total\u00bb sartriyen an e Praxis marxis\\nApre Sartre f\u00e8
  par\u00e8t roman La Naus\u00e9e a (1938), teknik ekri roman vin boulv\u00e8se pa
  nons\u00e8lman kalite istil Sartre anplwaye nan jan l ekri l, men tou paske karakt\u00e8
  santral liv la, yon nonm yo rele Roquentin, se yon figi ki si konpleks, si temer\u00e8,
  ke l\u00e8 l ap pale e dekri sitiyasyon \u00abalyenasyon\u00bb, dezesperasyon, absidite,
  \u00abkontenjans\u00bb (santiman vid, anyen-anyen, santiman bagay san zenp\u00f2tans,
  ki pa neses\u00e8), li t ap viv e obs\u00e8ve yo, li f\u00e8 l av\u00e8k yon lisidite
  e sans kritik ekstra\u00f2din\u00e8, tr\u00e8 paf\u00e8, ki f\u00e8 ankenn moun
  pa ka deside si misye se yon fou lage oubyen sil se yon devin\u00e8 k ap dezabiye
  salte, opresyon ak absidite yo rele lavi a. Anpil moun tou te ka panse ke Roquentin
  se yon revolisyon\u00e8 rev\u00e8 ki tap s\u00e8lman radote sou ideyal lib\u00e8te
  e sou absidite, sou\u00abangoisse\u00bb, k\u00e8-mare, nilite lavi. Sartre kontinye
  f\u00e8 menm obs\u00e8vasyon sa yo nan L\u2019\u00catre et le N\u00e9ant (1943),
  men li rive pi lwen nan liv sa a pou li montre ke kons\u00e8p \u00ablib\u00e8te
  total\u00bb la se posiblite moun toujou genyen, nan kelkeswa sitiyasyon trajik yo
  ladann lan, pou yo revandike lib\u00e8te yo. Misye di \u00abyon moun ka toujou f\u00e8
  yon bagay valab, pou t\u00e8t li oubyen pou l\u00f2t moun, nan kelkeswa sitiyasyon
  tyouboum li ladann lan\u00bb.\\nMen l\u00e8 Sartre reyalize ke \u00ablib\u00e8te
  total\u00bb moun lan ap revandike a ka vin paw\u00f2l nan van nan yon sosyete kote
  machin politiko-ekonomik la la pou oprime endividi ak gwoup moun, misye ajoute,
  nan yon dezy\u00e8m gwo t\u00e8ks filozofik ki rele Critique de la Raison Dialectique
  (\u00abKritik Rezon Dyalektik\u00bb, 1960), ke kons\u00e8p ak ideyal lib\u00e8te
  a dwe toujou akonpaye pa yon \u00abangajman pratik\u00bb, yon praxis revolisyon\u00e8,
  ki alafwa endividy\u00e8l e kolektif, e ki rekon\u00e8t ke moun pa p\u00e8di lib\u00e8te
  yo paske yon l\u00f2t gwoup moun pa renmen bobin t\u00e8t endividy\u00e8l yo: Moun
  p\u00e8di lib\u00e8te yo paske yo f\u00e8 pati de yon gwoup osnon klas sosyal ki
  ap ranpli yon fonksyon pitimi-san-gad\u00f2 nan sist\u00e8m eksplwatasyon politik,
  ekonomik, sosyal e ideolojik ki ekziste a. Se nan liv \u00abKritik Rezon Dyalektik\u00bb
  la ke Sartre vin jwenn men nan lamen av\u00e8k filozofi marxis la; li anplwaye li
  kou sa li rele a yon \u00abzouti endispansab pou chanjman istorik\u00bb. Anbisyon
  misye pou liv sa a, se te pou l eseye mete sou pye yon \u00abfondasyon solid pou
  yon antwopoloji sist\u00e8m sosyal e istorik yo\u00bb. Kouw\u00e8 Karl Marx anvan
  li te devwale tout kamouflaj, mekanis pwodiksyon ak eksplwatasyon sist\u00e8m kapitalis
  la e te mande pou tout travay\u00e8 ak oprime \u00f2ganize e ini yo pou kraze sist\u00e8m
  opresyon an, Sartre montre pak\u00e8t posiblite revolisyon\u00e8 ki ekziste pou
  gwoup ak klas oprime yo depase limitasyon alyenasyon an; li montre kouman yon bon
  sist\u00e8m solidarite ka f\u00e8 devlope mwayen endispansab yo pou demantibile
  sist\u00e8m opresyon/alyenasyon an.\\nMenmsi premis (batis teorik) ideyalis \u00ablib\u00e8te
  total\u00bb filozofi ekzistansyalis la pat two diferan de premis-batis marxis la,
  ki li plase r\u00e8v li nan yon sosyete kominis ideyal, kote endividi ak gwoup oprime
  yo vin libere t\u00e8t yo de yon kondisyon chozifye, yon kondisyon \u00abmachandiz
  nan mache\u00bb (reifye, objektifye) klas opres\u00e8 yo te plase yo, e vin tabli
  nan plas li yon sosyete re-imanize, otantikman libere, kote pwodikt\u00e8 yo gen
  kontr\u00f2l sou pw\u00f2p destine yo. Men kote ekstravagans teorik ekzistansyalism
  la vin pwogrese e vin vr\u00e8man jwenn praxis marxis la, se l\u00e8 Sartre vin
  asepte priyorite zaksyon kolektif revandikatif, \u00f2ganize, gwoup oubyen klas
  oprime yo genyen parap\u00f2 ak \u00abzak lib\u00bb yon endividi. Sartre ekri plizy\u00e8
  liv ak etid pou l te montre evolisyon panse ekzistansyalis la b\u00f2 dyeksyon yon
  refleksyon ak zaksyon politik \u00f2ganize, pami yo, L\u2019Existentialisme est
  un humanisme, e Qu\u2019est-ce-que la litt\u00e9rature? Nan denye liv site la a,
  Sartre denonse ekriven japrouv, lach e dekorat\u00e8 tradisyon\u00e8l yo ki f\u00e8men
  zye yo sou enjistis sosyal yo; li mande pou entelekty\u00e8l yo angaje yo politikman
  paske se s\u00e8l fason z\u00e8v yo ka gen ankenn val\u00e8!\\n\u00abKritik Rezon
  Dyalektik\u00bb la se youn nan pi gwo labib filozofik ki ekziste e ki montre kouman
  gwoupman moun ki an rebelyon ka \u00abf\u00e8 listwa\u00bb e chanje anviwonnman
  yo oubyen chanje pa anviwonnman yo. Nan liv sa a, Sartre jwenn konpl\u00e8tman dyalektik
  lib\u00e8te total ekzistansyalism lan av\u00e8k dyalektik jistis pwoblematik marxis
  la nan yon sent\u00e8z (men-kontre) ki louvri chan posiblite ak p\u00e8spektiv tou
  de filozofi yo. Malgre ke liv la se yon etid filozofik sou listwa ki konsidere sij\u00e8
  pase oubyen abstr\u00e8, Sartre debat e predi nan li de nan gwo evenman politik
  (e istorik) ane 1950\u20131960 yo: Revolisyon kiben an (oubyen s\u00e8ten pratik
  guerillero-konbatan castris yo) e mouvman revolisyon\u00e8 etidyan iniv\u00e8site
  an Frans yo, ke moun plis konnen sou non Me-68. Sartre montre konpreyansyon, risk,
  kouraj, solidarite ak frat\u00e8nite, e santiman kreyasyon ki genyen e ki endispansab
  pou f\u00e8 \u00abyon gwoup ki ap pran dife revolisyon\u00e8\u00bb (\u00abun groupe
  r\u00e9volutionnaire en fusion\u00bb) vin kreye rap\u00f2 sere ak det\u00e8minasyon
  ki f\u00e8 lit la konsolide. Revolisyon kiben an ilistre t\u00e8z sa nan fason pwosesis
  revolisyon\u00e8 a dewoule depi nan koumansman l. Men yon l\u00f2t fenom\u00e8n
  politik e istorik Sartre preske pwofetize nan liv sa a, se desounman ak vole-gag\u00e8
  ki te fin pran gouv\u00e8nman santral Lafrans la devan rebelyon ak tibilans gwoup
  anraje etidyan yo an me 1968. L\u00e8 Cohn-Bendit rele e di ke \u00abtout bagay
  posib\u00bb e ke se imajinasyon menm ki vin opouvwa, Sartre ba l repondonn paske
  li te deja di sa nan liv sa a ke tout zaksyon revolisyon\u00e8, kelkeswa lokalize
  li ka lokalize, rann nan limenm tout bagay posib pa \u00abposiblite konsyantizasyon
  e re-kreyasyon\u00bb zaksyon an ka debranle; li louvri yon \u00abchan posiblite\u00bb.
  Byenke Me-68 vin revele l yon rebelyon tiboujwa ki vin finalman konf\u00f2me l av\u00e8k
  establishment dominan franse a, rebelyon an nan limenm te louvri yon \u00abchan
  posiblite\u00bb ki pat ase eksplwate pa gwoupman sosyal oprime sosyete frans\u00e8
  a. Se posiblite, potansy\u00e8l sa a ki f\u00e8 anpil moun te rele mouvman revolt
  istorik etidyan me-68 an, yon \u00abrevolisyon sartriyen\u00bb.\\nAn n f\u00e8 remake
  tou de l\u00f2t liv Sartre ki revolisyone jan moun te konn ekri biografi liter\u00e8:
  Saint Genet, Com\u00e9dien et Martyr (1952) e L\u2019Idiot de la famille/Gustave
  Flaubert (1972). Nan premye a Sartre devwale pow\u00e8t reb\u00e8l Jean Genet (1910\u20131986)
  bay piblik la av\u00e8k si t\u00e8lman pwofond\u00e8 ke Genet pase plis ke dis ane
  ak yon \u00abblokaj mantal\u00bb ki anpeche l ekri. Genet tou pat nenp\u00f2te ki:
  yon omoseksy\u00e8l, ansyen prizonye pou v\u00f2l e vakabon ki pa janm gen yon kay
  pou l rete, li ekri sepandan yon z\u00e8v powetik e teyatral ki ranv\u00e8se e demantibile
  fason moun w\u00e8 pretansyon boujwa sosyete boujwa franse a. Pami liv misye ekri
  genyen, roman powetik Notre Dame des Fleurs ouswa Miracle de la Rose, epitou yon
  grann kantite z\u00e8v teyatral kouw\u00e8 Les Bonnes, Haute Surveillance, Le Balcon,
  elatriye. Olyeke misye gen lawont pou eksperyans ak kondisyon lavi li, li asime,
  asepte, glorifye kondisyon an nan tout liv li pibliye. Anplis, tout ewo liv misye
  yo se yon bann moun degrade oubyen sosyete a degrade (v\u00f2l\u00e8, masisi, blof\u00e8,
  prizonye, lwijanboje, pwostitye, elatriye) ke misye prezante tankou moun ki gen
  \u00ablagras, espland\u00e8, siblimite\u00bb, moun ki gen yon val\u00e8 moral sipery\u00e8
  ki dwe respekte!\\nL\u00f2t liv nou dwe remake a, se biografi liter\u00e8 Sartre
  ekri sou ekriven Gustave Flaubert a (1821\u20131880), L\u2019Idiot de la famille,
  ki li tou se yon chel\u00e8n liter\u00e8. Nan liv sa a Sartre kontinye e devlope
  pi lwen envansyon metodolojik li te koumanse nan liv sou Genet a: kote li vle tabli
  karakt\u00e8 yon nonm pa mwayen sa li rele a yon \u00abpsikanaliz ekzistansy\u00e8l\u00bb
  ki analize e chache konprann \u00abtout dimansyon\u00bb endividi a. Sartre montre
  tou nan liv sa a tout meprizman li pou Flaubert: li di li rann Flaubert reskonsab
  de represyon ak masak kont revolisyon\u00e8 mouvman yo rele Lakomin Pari a (1871),
  yon rebelyon ki te deklennche pou chanje lavi, paske Flaubert pat leve yon dw\u00e8t
  li pou l defann travay\u00e8 an revolt yo. Li kalifye Flaubert de \u00abboujwa gwo
  k\u00f2l\u00e8t lach e satisf\u00e8\u00bb.\\nPou plizy\u00e8 zane anvan lanm\u00f2
  Sartre an avril 1980, anpil pwom\u00e8s revolisyon\u00e8 li te toujou kw\u00e8 nan
  yo te vin yon ti jan fane, akoz nons\u00e8lman rezilta politik travay boulon-sere,
  politik andigman (endiguement) f\u00f2s oksidantal reyaksyon\u00e8 yo kont eksperyans
  revolisyon\u00e8 nan lemond yo, men tou akoz de enpas, ech\u00e8k, anboujwazman
  e limitasyon kay anpil mouvman revolisyon\u00e8 ki te ekziste yo. Linyon Sovyetik
  limenm te vin tounen yon sist\u00e8m biwokratik, \u00abtotalit\u00e8\u00bb, fatige
  e san zavni ki vin diskredite, avili, pwoj\u00e8 liberasyon orijin\u00e8l ki te
  fonde Leta sovyetik la. Sepandan, menm l\u00e8 li kontinye denonse fayit Linyon
  Sovyetik vizavi pwom\u00e8s revolisyon bolchevik la, Sartre te toujou defann li
  kont zak mov\u00e8z fwa kan enperyalis oksidantal la, ki li se kont r\u00e8v, ideyal
  ak fondasyon revolisyon\u00e8 istorik sosyete sovyetik la yomenm li tap goumen pou
  l kontrekare e def\u00e8t.\\nS\u00e8l kritik serye nou ka f\u00e8 sou Sartre vizavi
  denonsman li de mankman rejim biwokratize nan Lew\u00f2p-de-L\u00e8s yo, se lef\u00e8tke
  li pat f\u00e8 yon gran diferans ant sitiyasyon peyi sila yo e sitiyasyon peyi Kiba.
  Menmsi nou rekon\u00e8t val\u00e8 sip\u00f2 Sartre bay revolisyon kiben nan yon
  moman enp\u00f2tan kote enperyalism meriken an te vle toufe li nan ze, nou twouve
  ke kritik sev\u00e8 Sartre f\u00e8 sou Kiba yo alafen, paekzanp l\u00e8 l vin asepte
  kritik alam\u00f2d tiboujwa parizyen yo ki te vle asimile Kiba ak rejim totalit\u00e8
  ew\u00f2p-de-l\u00e8s yo, wi nou twouve li te yon ti jan p\u00e8di kap li. Paske,
  kontr\u00e8man ak rejim sosyalis Ew\u00f2p-de-L\u00e8s yo, revolisyon kiben an se
  te yon revolisyon popil\u00e8 otantik ki f\u00e8 yon pak\u00e8t mirak chanjman pozitif
  pou p\u00e8p kiben an, e ke pwobl\u00e8m prensipal li se lef\u00e8tke enperyalism
  meriken pat janm asepte p\u00e8di privil\u00e8j li e kontinye ane apre ane, jiska
  jounen jodia, ap sabote eksperyans liberasyon\u00e8l p\u00e8p kiben an.\\nMen, malgre
  konsta negatif Sartre vin f\u00e8 sou febl\u00e8s p\u00e8f\u00f2mans rejim etabli
  nan kan yo te rele \u00abkan sosyalis\u00bb la pou met sou pye yon vr\u00e8 sosyete
  sosyalis, li pat janm p\u00e8di konfyans li nan posiblite ak nesesite pou eleman
  alyene e oprime yo, nan tout sosyete, \u00f2ganize yo pou demantibile sist\u00e8m
  opres\u00e8 a. Li mouri ret kw\u00e8 ke endividi ak gwoup sosyal yo toujou gen dwa,
  nesesite, posiblite e mwayen pou yo goumen pou chanje lavi, kouw\u00e8 Rimbaud ta
  di.\\nYon fanm vanyan total-kapital\\nSimone de Beauvoir (1908\u20131986) te konpay\u00e8l
  Sartre pou plis ke senkant tan, depi l\u00e8 yo te premye rankontre, an 1929, kan
  yo te j\u00e8n etidyan nan iniv\u00e8site Pari, jiska lanm\u00f2 Sartre an 1980.
  Manmz\u00e8l se yon fanm vanyan ki te f\u00e8 pw\u00f2p non pa l ak z\u00e8v pa
  l nan relasyon l av\u00e8k Sartre. Kouw\u00e8 Sartre, de Beauvoir te eksele nan
  plizy\u00e8 f\u00f2m liter\u00e8 e entelekty\u00e8l: roman, es\u00e8 (etid) filozofik,
  teyat, kritik liter\u00e8, es\u00e8 politik, memwa, elatriye. Roman li yo (paekzanp
  L\u2019Invit\u00e9e oubyen Les Mandarins) te f\u00e8 yon pak\u00e8t bri nan lemond
  liter\u00e8 a. Yo konsidere de Beauvoir tou kou youn nan pi gran memoryalis ep\u00f2k
  apre Dezy\u00e8m lag\u00e8 mondyal la an Frans. Twa memwa (m\u00e9moires) mamz\u00e8l
  ekri, M\u00e9moires d\u2019une jeune fille rang\u00e9e, La Fleur de l\u2019\u00e2ge
  e La Force des choses, konsidere jounen jodia kou twa z\u00e8v klasik, san konte
  yon es\u00e8 obs\u00e8vasyon sou Lachin, La Longue marche, ki te louvri konpreyansyon
  anpil moun sou pwoblematik revolisyon\u00e8 a nan Lachin. Men z\u00e8v manmz\u00e8l
  ki te yon gwo zen nan listwa politiko-filozik ep\u00f2k la, se definitivman Le Deuxi\u00e8me
  Sexe, yon liv t\u00e8t-chaje ki demanbre tout vye konsepsyon moun te genyen sou
  sa yo rele \u00abkondisyon feminin\u00bb la, s\u00e8tadi fason dominasyon, derespektasyon,
  eksplwatasyon e meprizman sosyete patriyakal (gason-se-m\u00e8t) la tabli pou l
  kenbe fanm sou kontr\u00f2l depi koumansman listwa lavi moun.\\nEfektivman liv Le
  Deuxi\u00e8me Sexe la pa yon liv kouw\u00e8 tout l\u00f2t liv. Malgre plizy\u00e8
  diskisyon, deba, etid ki f\u00e8t, e plizy\u00e8 l\u00f2t liv e etid liv la enfliyanse
  e ki s\u00f2ti depi l\u00e8 l te s\u00f2ti (1949), \u00abDezy\u00e8m S\u00e8ks\u00bb
  (oubyen \u00abKeksyon Fanm\u00bb), rete kritik ki pi radikal ki f\u00e8t sou eksplwatasyon
  fi pa gason e pa sosyete. Nan liv la Simone de Beauvoir nons\u00e8lman montre kouman
  konsepsyon (e kondisyon feminin la limenm) se yon \u00abenvansyon kiltir\u00e8l\u00bb,
  men tou li dekri e devwale pratik tradisyon\u00e8l sosyal, relijye, politik e mekanis
  sosyo-ekonomiko-kiltir\u00e8l yo ki konbine pou pwodwi \u00abenvansyon\u00bb sila
  a. An gwo, de Beauvoir montre ke sist\u00e8m politiko-sivilizasyon\u00e8l klas eksplwat\u00e8
  yo (ki kontrole pa gason) met sou pye a pou yo domine lemond f\u00e8 yo rive, sinikman,
  def\u00e8 l\u00f2d natir\u00e8l la yon fason ki refasone w\u00f2l, aktivite, dwa
  e desten fanm, nan manny\u00e8 pou yo vin jwe yon w\u00f2l enfery\u00e8, pou yo
  s\u00e8vi senpleman kou \u00absip\u00f2\u00bb, kou obj\u00e8 seksy\u00e8l oubyen
  kou bijou ankadreman pou satisfaksyon bezwen egoyis, pwisans p\u00e8son\u00e8l ak
  dwa providansy\u00e8l gason chwazi pou t\u00e8t pa yo. De Beauvoir montre ke lanmou
  menm se yon pwodwi eksplwatasyon, youn nan \u00abatifis\u00bb, py\u00e8j, magouy
  gason klas dominan yo envante pou garanti pwoj\u00e8 kontr\u00f2l ak eksplwatasyon
  yo genyen pou r\u00e8s limanite. An gwo, lanmou vin tounen yon kategori politik.
  F\u00f2 n di tou ke liv \u00abDezy\u00e8m S\u00e8ks\u00bb la te gen yon enfliyans
  sou non s\u00e8lman devlopman lide sou fanm, men tou sou yon seri de revandikasyon
  e zaksyon pratik ki ede chanje anpil pratik diskriminasyon kont fanm.\\nRelasyon
  mennaj e otonomi p\u00e8son\u00e8l\\nYoun nan asp\u00e8 ki te tr\u00e8 enpresyonan
  lakay de filoz\u00f2f sa yo, se kouman yon rive konf\u00f2me vi prive, piblik e
  p\u00e8son\u00e8l yo av\u00e8k filozofi politik yo tap prekonize a. Konsepsyon yo
  sou lanmou oubyen relasyon mennaj, paekzanp, gen yon nouvote parap\u00f2 ak sa l\u00f2t
  moun te toujou kw\u00e8, esepte pet\u00e8t filozofi Fourrier a osnon sa ki te rele
  spiralism la, diran XVIII-\u00e8m ak XIX-\u00e8m sy\u00e8k ewopeyen an, ki li te
  mande pou yon liberasyon total de lanmou, de seksyalite e de obligasyon parantal.
  Konsepsyon Sartre ak de Beauvoir la gen yon dyalektik av\u00e8k de mouda: premye
  a di ke lanmou se yon ipokrizi sosyal ki baze sou yon relasyon e ideoloji de \u00abposesyon\u00bb,
  de pwopriyete, kote b\u00e8l vizyon romantik e fantastik sou m\u00e8v\u00e8yman
  lanmou kache d\u00e8y\u00e8 li yon itilizasyon \u00abmachandiz-nan-mache\u00bb,
  yon pratik twokay, kote lanmou limenm vin tounen yon komodite, yon \u00abmwayen
  echanj\u00bb nan sist\u00e8m kapitalis alyenasyon an. Dezy\u00e8m mouda dyalektik
  la se kwayans pwofon Sartre ak de Beauvoir genyen nan lanmou, santiman yo pou b\u00e8lte,
  atachman yo pou ideyal e kapasite jenewozite lanmou, s\u00e8tadi sans solidarite
  \u00f2ganik, men nan lamen, san nan san, resp\u00e8 ak resp\u00e8, lib\u00e8te ak
  lib\u00e8te, ki ka ekziste nan relasyon fanm ak nonm oubyen tout l\u00f2t relasyon
  moun ak moun. L\u00e8 yo denonse sa yo rele a \u00absimagri boujwa\u00bb nan fason
  klas dominan yo \u00f2ganize (e beni) eksplwatasyon e objektifikasyon fanm pa gason,
  yomenm yo chache viv pw\u00f2p vi mennaj ant yomenm nan resp\u00e8 prensip sa yo
