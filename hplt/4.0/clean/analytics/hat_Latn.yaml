  tout l\u00f2t opsyon petinan.\\n- Remake ke si ou vle import anl pespektiv e pou
  prez\u00e8ve estrikti nan katab, asire w ke w prepare dosye yo sou kondwi difisil
  ou an davans. Sa pral asire ke yo pral byen konv\u00e8ti nan dosye lap\u00f2s nan
  pespektiv dosye a destinasyon pst. Si ou vle pwogram lan pou f\u00e8 rech\u00e8ch
