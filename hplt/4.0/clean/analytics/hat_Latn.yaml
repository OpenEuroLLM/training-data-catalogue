  sou kontenjans, sou malsite, sou malvi e sou trajedi ki jodia ap dekonstonbre kalite
  lavi nou.\\nSimone de Beauvoir ak Jean-Paul Sartre gen yon enfliyans im\u00f2t\u00e8l,
