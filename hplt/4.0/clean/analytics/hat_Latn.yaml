  Sartre an avril 1980, menmsi lemond antye te voye reprezantan ak kondoleyans yo
  ba li.\\nAn n di an pasan ke ant\u00e8man Sartre te youn nan pi gwo ant\u00e8man
  ki te janm chante nan tout listwa politiko-liter\u00e8 p\u00e8p franse a. Moun te
