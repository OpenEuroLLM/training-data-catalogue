  l Marie Claude Bayard te pataje sou rezo sosyal yo.\\nOdette Roy Fombrun ale pou
  fen ane 2022 an e kite d\u00e8y\u00e8 l yon peyi t\u00e8t anba kote pratikman anyen
  pa p mache. Ekriven an ki pa t janm yon manm aktif nan lavi politik anndan peyi
  an pa t sispann reve yon Ayiti mey\u00e8.\\nFacebook Comments\"", "\"Nan Pol\u00f2y,
  depi nan fen 2014, zou Wroclaw la ofri Afrykarium a, yon oceanarium, premye a nan
