  na nos consejo di hoben pa comparti cu nos nan pensamento y nan contribucion den
  e momentonan aki. Danki tambe ta bai na nos partnernan y coleganan di e veld social
  pa hacie posibel cu nos por a dirigi algun mucha/ hoben serka boso pa ayudo. Danki
  na tur nos frontlinernan pa para cla pa duna nos ciudadanonan cuido y proteccion.
  Danki na tur docente cu a keda brinda nos muchanan y hobennan educacion for di cas.
  Danki na e Covid-19 Crisisteam pa permiti Fundacion Telefon pa Hubentud Aruba sigui
  opera. Danki Aruba completo pa evita cu e virus a sigui plama.\\nE pandemia di Covid-19
  tawata tin y keto bai tin impacto ariba e bida di nos tur. Sin lubida nos muchanan
  y hobenan cu diripiente tin hopi pregunta tocante na scol, deporte, amigonan, relacion
