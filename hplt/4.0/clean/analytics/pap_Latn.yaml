  e preocupacionan di nos muchanan y hobenan.\\nUn biaha mas, y e biaha aki durante
  un pandemia a ser demostra e importancia di un telefon pa ayudo di mucha.\"", "\"E
  mih\u00f3 sitionan di its - enkuesta i estad\u00edstika\\nTambe ta liber di unico,
