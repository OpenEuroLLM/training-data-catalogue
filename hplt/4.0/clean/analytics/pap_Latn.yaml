  "\"Durante di un anochi pa sera e a\u00f1a 2022, Partido AVP a tene un actividad
  special den cua a haci entrega di e \u201cPREMIO BON COMUN\u201d. Cu e principionan
  Christian Democrata di partido AVP den mente y e metanan di \u201cBON COMUN\u201d
  su dilanti, partido AVP a introduci e premio BON COMUN pa duna reconocemento na
  hende y organisacionnan cu den nan trabou diario of den nan iniciativanan pa nos
  comunidad, ta biba e idealnan di sirbi interes general, sin interes of beneficio
  propio. Nos comunidad chikito tin hopi hende cu den nan trabou, den nan tempo liber,
  den nan hobby y den actividadnan riba propio iniciativa, ta haci un sin fin di cos
  pa otronan den comunidad, sin cu nan ta spera di haya algo bek. Nan ta haci e cosnan
  aki cu amor, cu dedicacion y cu un motivacion simpel di haci bon pa otro y contribui
  na un miho bida y un miho comunidad. Partido AVP kier stimula e actitud di sirbishi
  boluntario aki. Cu e premio di reconocemento di \u201cBON COMUN\u201d kier gradici
  e hendenan y organisacionnan pa loke nan a y ta haci y stimula nan ta sigui cu nan
  bon trabou.\\nPROME RECIPIENTENAN\\nE prome recipientenan di e premio \u201cBon
  Comun\u201d ta bin di tur skina di nos pais y di practicamente tur sector di bida.
  Nan ta ehempelnan di ciudadanonan cu di nan propio boluntad ta traha pa interes
  general.\\nMonique Trappenberg ta cabesante di scol basico Rosario College. Ela
  ricibi e premio di reconocemento pa su bon trabou como maestro, den scol y pafo
  di scol. Monique a accepta e premio pa tur e maestronan di su scol, cu hunto ta
  haci e experencia di ense\u00f1ansa pa tur nan alumnonan uno special.\\nIrene Dake
  ta un conocido lider deportivo specialmente activo den futbol infantil. E ta hopi
  activo tambe den Club RCA. Den bida diario Irene Dake ta yuda hende spontaneamente
  den tur forma cu por. Irene a ricibi e Premio Bon Comun pa tur esaki y specialmente
  pa su dedicacion incansabel pa e muchanan.\\nErick Gomez ta simbolo di boluntarismo
  na Aruba. E a ricibi e premio pasobra den tur loke e ta haci como boluntario e ta
  personifica e nificacion di \u201cbon comun\u201d: duna di Bo mes sin busca of spera
  niun beneficio pa Bo mes.\\nSilo Tromp ta conoci como trainer di futbol, pero e
  ta haci hopi mas cu djis train y organisa su club Nacional. Silo a haya e reconocemento
  di Premio Bon Comun pa tur e a\u00f1anan cu den forma ehemplar, continuo y cu amor
  ta dedica na guia hobennan den deporte y den nan bida.\\nZelda Steenen, un juffrouw
  di scol di ense\u00f1ansa special ta bon conoci pa e forma cu e ta traha incansabel
  y cu un sentido di responsabilidad grandi pa tur su muchanan. Pa su servicio na
  nos comunidad sin niun interes propio el a ricibi e reconocemento di ta un bon ehempel
  di balor di \u201cbon comun\u201d\\nDeaxo Croes a bira e simbolo di disciplina,
  persistencia y dedicacion continuo pa henter un generacion di hobennan cu ta busca
  direccion y stabilidad den un mundo cada dia mas complica. Pa su contribucion incalculabel
  pa inspira hobennan y su contribucion na otronan den nos comunidad cu su landamento
  di distancianan largo, Deaxo a ricibi e reconocemento cu e premio \u201cbon comun\u201d.\\nAnouk
  Balentina, un se\u00f1ora profesional hoben y persistente, a lanta para apesar di
  tur contratiempo y resistencia, pa lucha pa un medio ambiente mas limpi y sostenibel.
  E tin hopi a\u00f1a ta lucha pa un forma mas limpi y responsabel di deshaci di desperdicio
  na Aruba, specialmente na e dump na Parkietenbos. Pa su curashi y persistencia na
  interes di nos comunidad, Anouk a ricibi e premio \u201cbon comun\u201d.\\nFundacion
  pa nos Comunidad\\nE iniciativa pa yuda otronan y e sentido di responsabilidad pa
  tur hende den nos comunidad ta wordo ilustra perfectamente den e trabou di e FUNDACION
  PA NOS COMUNIDAD. Pa hopi a\u00f1a, e organisacion aki ta yuda miles di individuo
  y famianan cu ta cay den pobresa y no por cubri e necesidadnan mas basico riba nan
  mes. Pa e bunita trabou na servicio di nos comunidad, FPNC a ricibi e reconocemento
  aki di premio \u201cbon comun\u201d.\\nJean-Miguel Loepstok y Jeanuar Loepstok ta
  dos ruman hoben cu na e edad hoben ya ta demostra un disponibilidad spontaneamente
  pa yuda otro hende y sirbi esnan rond di nan sin spera nada pa nan mes. Cu esaki
  nan ta yena nos cu speransa cu e balor di sirbi sin interes propio lo sigui biba
  y crece den nos comunidad. Pa esaki nan na ricibi e premio \u201cbon comun\u201d
  2022.\\nAdonsito Croes\\nIncansablemente y cu un alegria contagioso Adonsito Croes
  ta dedica su tempo na desaroyo y diberticion di mucha y hobennan den nos comunidad,
  sin spera niun elogio of beneficio pa esaki. Tanto den scol como maestro, como pafo
  di scol, e ta sirbi nos comunidad den e forma ehemplar aki. Pa esaki e a ricibi
  e reconocemento di e premio \u201cbon comun\u201d.\\nJareth y Tristan Vermeulen\\nDos
  ruman deportista cu ta destaca den nan ramo di deporte, pero tambe pa nan trabou
  boluntario cu hobennan, ta demostra e balornan di sirbi como bon ehempel y di sirbi
  otro sin interes propio. Pa esaki Jareth y Tristan a ricibi e premio \u201cbon comun\u201d.\\nGiovanni
  Villamizar\\nHunto cu otro hobennan e a scoge pa bira polis y sirbi nos comunidad
  den su trabou y pafo den comunidad. E sirbishi aki di traha sin busca beneficio
  of reconocemento propio ta e motibo pakico Giovanni a ricibi e premio \u201cbon
  comun\u201d.\\nMelvin Dabian\\nComo organisado y guia pa hoben y adulto den deporte
  y ehercicio Melvin Dabian ta wordo mira como un ehempel pa guia y yuda otronan den
  su tempo liber, sin busca niun interes propio. Pa esaki Melvin Dabian a ricibi e
  premio premio \u201cbon comun\u201d cu gradicimento y estimulo pa e sigui cu e bon
  trabou aki.\\nKaryme Acosta\\nHoben, deportista y activo den yuda spontaneamente
  den comunidad ta loke ta caracterisa Karyme awor caba. E ta un deportista prometedor,
  pero mas aun e ta promete di ta un ciudadano cu semper ta cla pa yuda otronan sin
  busca of spera nada pa su mes. Pa e actitud aki cu ta ilustra e espirito di sirbishi,
  e ta ricibi e premio \u201cbon comun\u201d.\\nSaraquita Offringa\\nSu triunfonan
  di mas cu 20 a\u00f1a a inspira hende y hobennan rond di mundo. Su actividadnan
  boluntario cu hobennan ta motiva nos cu hendenan asina exitoso ta dedica nan tempo
  liber pa yuda comunidad den formanan bunita sin busca beneficio of interes propio.
  Pa esaki Saraquita a ricibi e premio \u201cbon comun\u201d.\\nKamilah Dammers\\nKamilah
  a logra exitonan grandi den ultimo a\u00f1anan den su ramo di deporte di \u201cbowling\u201d.
  Cu esaki e a motiva otronan pa haci deporte. Su iniciativanan pa dedica tempo di
  su mes pa guia otro hobennan sin interes propio ta e motibo pakico a reconoce e
  dedicacion di Kamilah cu e premio \u201cbon comun\u201d.\\nJourraine Halabi\\nComo
  enfermera e ta traha incansabel y cu profesionalismo y dedicacion pa sirbi enfermonan
  na Aruba. Pa su coleganan y pa enfermonan e ta e ehempel di sirbi otronan cu amor,
  sin importa ta ken of den cua situacion. E sirbishi na otronan den forma excepcional
  aki ta e motibo pakico Jourraine a ricibi e premio \u201cbon comun\u201d.\\nTerrence
  Ras\\nE ta maneha un negoshi chikito cu tin cu lucha pa tene cabes riba awa den
  tempo dificil. Apesar di esey e a dedica tempo y recursonan di su negoshi pa crea
  facilidadnan cu ta yuda otro hende biba miho. E ta haci esaki sin busca beneficio
  propio of reconocemento. A reconoce e bon trabou di Terrence Ras y su compania na
  sirbishi di nos comunidad cu e premio \u201cbon comun\u201d.\\nJeannine Rodriguez\\nE
  ta haci su trabou diario den un forma ehemplar, semper cu entusiasmo y dedicacion
  continuo. Cu esey e ta demostra cu por sirbi nos comunidad sin interes propio y
  cu entusiasmo den nos trabou mes. Pa su dedicacion y gana di sirbi otronan sin busca
  beneficio propio a reconoce Jeannine cu e premio \u201cbon comun\u201d.\\nBrian
  Dorothal\\nPa un hoben cu tin hopi posibilidad su dilanti scohe pa sirbi su comunidad
  den e ramo dificil di husticia ta remarcabel. Brian a haci esaki ora ela scohe pa
  bira polis. E ya a demostra un gana di sirbi su comunidad sin busca elogio of beneficio
  propio. Den su trabou e kier sigui demostra esaki. Ta pesey a reconoce y stimula
  e gana di sirbi si interes propio cu e premio \u201cbon comun\u201d.\\nAnnelien
  Tromp-Diaz\\nPersistencia y dedicacion ta loke Annelien Tromp-Diaz a y ta sigui
  demostra cu mas di 40 a\u00f1a di guia y educacion di mucha muhernan hoben den \u201cpadvinderij\u201d.
  Tur siman pa tur e a\u00f1anan aki caba e ta dedica su tempo liber pa guia y educa
  mas cu 150 mucha muhernan den diferente districto di Aruba. Pa e dedicacion y sirbishi
  boluntario aki e a wordo reconoci y gradici cu e premio \u201cbon comun\u201d.\\nIcho
  Matos\\nConoci como masahista, Icho ta yuda otronan den tur forma cu e por. Ehemplar
  den su trabou y dedica den sirbi otronan sin busca niun beneficio propio, ta loke
  ta haci cu Icho ta un di e prome recipientenan di e premio \u201cbon comun\u201d
  2022.\"", "\"BARCELONA \u2013 E strea internacional di tennis professional Rafael
  Nadal a anuncia cu esaki ta su ultimo a\u00f1a professional. \u201c Mi ta considera
  esaki como mi ultimo a\u00f1a y mi kier disfruta di cada momento\u201d Nadal a bisa
  dialuna durante un conferencia di prensa na Barcelona. E la anuncia su participacion
  diamars awor na e torneo ATP na Barcelona. Ta su prome participacion despues di
  a retira tres luna pasa di e torneo na Australia. E ganador di 22 titulo grandslam,
  a dicidi ultimo momento pa participa e siman aki. E tenista di 37 a\u00f1a di edad
  mester a sacrifica varios torneo debi na su condicion fisico cu no tabata optimal.
  Ultimo tempo e ta sufriendo di basta lesion y a indica a\u00f1a pasa caba cu esaki
  por ta su ultio a\u00f1a. Awe e la confirma cu esaki enberdad ta su ultimo a\u00f1a
  hungando tennis professional.\\nORANJESTAD - E a\u00f1a aki Aruba International
  Regatta lo tuma luga riba 28, 29 y 30 di juni 2024, banda di Surfside beach patras
  di Neptali Henriquez Speeltuin. Esaki lo bira di diescuater edicion y preparacion
  ta den ful swing.\\nATLANTA \u2013 E number riba uniform di baseball professional
  di e Arubiano Chadwick Tromp a crea un tipo di controversia recientemente na Merca.
  Pa stra\u00f1o cu por zona, a relaciona su number 45 riba su uniform, combina cu
  su fam, cu e presidente number 45 di Merca, cu tambe tin e fam, aunke skirbi diferente.
  Donald Trump tabata e di 45 presidente Mericano. Y ta conoci cu ora cu e mester
  a tira e prome bala, e tabata bisti e uniform cu e number 45. Den e caso aki, e
  Arubiano a haye den un tangana sin sa. Tromp a sigura prensa Mericano cu e no a
  tuma e number ey pa haci un gestion politico. De hecho, e ta sigura cu e no a ni
  conecta e dos cosnan cu otro. Cu e tin e fam Tromp (cu na ingles por wordo relata
  como Trump), y e number 45, ta puro coincidencia, Tromp a sigura tur hende. \u201cSemper
  nan a grita Tromp 45, pero nunca mi a pone nan hunto. Mi a kere cu tabata solamente,
  Chadwick Tromp, number 45\u2019. Segun e portal The Athletic, Trump a pidi pa un
  cambio di number di 48 pa sea 14 of 60. Pero esey no tabata posibel pues e la haya
  e number 45. Tromp a bisa cu e ta gusta e number, pero no tin niun interes politico.\\nORANJESTAD
  \u2013 E keeper internacional, e Arubiano Jean Marc Antersijn ta considera e yamada
  di Patrick Kluivert (otro futbolista internacional renombra) pa e hunga pa e seleccion
  di Corsou como un di su momentonan mas grandi di su carera. Durante e programa Noticiacla
  LIVE diahuebs anochi, e la comparti cu periodista y moderador Tito Lacl\u00e9, e
  momento aki cu e la experencia algun a\u00f1a atras. Pa wak e programa completo,
  click AKI.\\nORANJESTAD \u2013 Cu e ultimo prestacion di e conocido coredor di Aruba
  Lana Gobert na e Tokio Marathon, e cantidad di Arubiano riba a muraya mundial di
  fama di Marathon mundial ta aumenta na 3. E otro dosnan ta e conocido Michel la
  Haye y Wilfredo Ras. E siman aki Gobert a comparti e logro aki riba us pagina, cu
  awor su nomber tambe ta aparece entre e grandinan cu a participa na tur e 6 marathonan
  mundial conoci cu ta e marathonnan di New York, Boston , Berlin, Chicago, London
  y Tokyo. E a\u00f1a aki Gobert a logra e ultimo marathon aki pa completa e circulo
  di 6 marathon mayor. Hunto cu esaki, e ta bira e prome coredor femenino representando
  Aruba den e asina yama Abbott Major Marathon 6 star series!\\nMIAMI/ ORANJESTAD
  \u2013 Pa prome biaha den historia, Aruba ta co-anfitrion di e torneo Damas U15
  di Concacaf. Asina a keda anuncia na Miami diahuebs ultimo. E weganan lo tuma lugar
  entre 5 y 11 di augustus 2024. Aruba lo ta anfitrion di e liga C, Trinidad Liga
  B y Costa Rica A. Un total di 35 pais miembro a informa cu nan ta interesa pa participa
  den e weganan aki. Tur tres liga lo inclui un parti di grupo y un parti di knockout
  y corona su campeon. E cantidad di ekipo pa liga lo keda deterina basa riba e ranking
  di Concacaf Woman\u2019s U-17 Ranking di maart 2024 y e number final di participante.\"",
  "\"DEN HAAG - Sekretario di Estado Van Huffelen di Asuntu Interno i Relashon den
  Reino a nombra sr. E.E. (Edison) Rijna komo representante spesial na Hulanda Karibense
  pa fondonan di Union Europeo, Fondonan di Nashonnan Uni i asuntunan ekon\u00f3miko
  pa loke ta trata Latino Am\u00e9rika. Sr. Rijna ta kumins\u00e1 dia 18 aprel 2023
  den su funshon nobo i na mes momentu lo baha komo gezagh\u00e8ber di Entidat P\u00fabliko
  Boneiru.\\nKu su nombramentu komo representante spesial den e a\u00f1anan binidero
  e gezagh\u00e8ber aktual di Boneiru lo enfok\u00e1 entre otro riba mih\u00f3 akseso
  na fondonan di Union Europeo (EU) i Nashonnan Uni (VN) pa e islanan di Hulanda Karibense
  (Boneiru, Saba i Sint Eustatius). E lo s\u00f2ru di manten\u00e9 kontakto ku komishon
  Europeo na Bruselas i organisashonnan afili\u00e1 na VN ku ta relevante pa Hulanda
  Karibense. Aki e lo identifik\u00e1 proyektonan ku lo brinda oportunidat nobo na
  nos islanan.\\nBanda di esei komo representante spesial pa relashon ekon\u00f3miko
  pa Latino Am\u00e9rika e lo guia mishonnan ekon\u00f3miko pa i di Latino Am\u00e9rika
  i Am\u00e9rika Sentral. Meta di e mishonnan aki lo ta pa duna kompania i otro organisashonnan
  di Hulanda Karibense mih\u00f3 akseso na merkadonan den serkania i pa lanta interes
  serka paisnan den bisindario pa invert\u00ed i hasi negoshi na Hulanda Karibense.
  Un vol\u00famen mas grandi di hasi negoshi i invert\u00ed ta yuda fortalesa ekonomia
  di e islanan.\\nSekretario di estado van Huffelen ta entusiasm\u00e1 ku e nombramentu:
  \u201cMi ta hopi kontentu ku sr. Rijna a asept\u00e1 e reto aki. Ku su v\u00e1rios
  a\u00f1anan di eksperensia komo gezagh\u00e8ber i ku un ret internashonal amplio
  den region, mi ta konvens\u00ed ku komo representante spesial e por ta di gran nifikashon
  pa e islanan i Hulanda. Den su r\u00f2l nobo e por duna un aporte importante na
  akseso na fondonan di EU i VN, oument\u00e1 prosperidat i amplia e base ekon\u00f3miko.
  Nos ta gradesido pa sr. Rijna su gran esfuerso has\u00ed komo gezagh\u00e8ber di
  Boneiru.\u201d\\nSr. Rijna ta gezagh\u00e8ber for di 2014. Na 2020 a bolbe nombr\u00e9
  pa un periodo di 6 a\u00f1a komo gezagh\u00e8ber. Pa mas ku un a\u00f1a kaba e ta
  alabes Territorial Authorized Officer (TAO) pa Boneiru na Union Europeo: \u201cDen
  mi r\u00f2l di representante spesial mi por eksplor\u00e1 posibilidatnan nobo pa
  Boneiru, Saba i Sint Eustatius pa koperashon internashonal. Dor di nos relashon
  ku EU, tin hopi oportunidat ku nos por probech\u00e1 di dje. Esaki ta konta tambe
  pa algun organisashon ku ta kai bou di Nashon Uni ku por nifik\u00e1 hopi pa nos
  islanan. Mi ta kontentu di por bai traha riba relashonnan frukt\u00edfero ku v\u00e1rios
  partido enbolb\u00ed. \u201d\\nE nombramentu aki ta drenta na vigor riba 18 di aprel
  2023. For di e momentu ei sr. Nolly Oleana lo fungi komo gezaghebber interino te
  na momentu ku termin\u00e1 e proseso di solisitut pa un gezaghebber nobo. NOTA:
  E texto ta scirbi den Papiamento fonetico di Corsou.\\nCARACAS \u2013 Segun Guardia
  Costera di Venezuela, na 2022 un total di 48 persona a muri purbando di yega islanan
  ABC. Asina e portal La Patilla ta raporta. E cifra a keda suministra den e informe
  anual di e institucion, entrega na Parlamento di Hulanda, via minister Hulandes
  di defensa Kasja Ollogren. Segun e documento, un 11 persona mas ainda ta registra
  como \u2018desapareci\u2019. E documento no ta specifica e nacionalidad di e personanan
  aki. Entre Januari y December 2022, Guardacosta a detene 170 persona cu tabata purba
  yega e islanan di un forma iregular, sin documentacion cu por a permiti nan keda.
  Tambe ta mustra cu e trafico of contrabanda di persona a aumenta na 2022 compara
  cu e a\u00f1anan anterior, ora cu a relaha e control implanta pa asina impedi e
  extencion di Covid19. \u201cE cantidad di migrante indocumenta haya pa Guarda Costa
  tabata mas cu na 2021. Como tal e ministerio di defensa Hulandes a recomenda un
  monitoreo mas preciso di hende rescata den e area di servicio aeronautica di rescate
  (SAR), cu ta yega e islanan den forma independiente, y ta muri of disparce\u2019.
  E mesun rapport ta indica cu den henter e Cuenca di Caribe, 287 persona a disparce
  a\u00f1a pasa so.\\nORANJESTAD - Aruba Tourism Authority a conmemora e 40 a\u00f1a
  di existencia di su oficina na Colombia e siman aki. Na e ocasion special aki a
  reflexiona riba tur e exito alcansa durante e ultimo decadanan y alabes a reconoce
  y gradici tur partner y colaborador cu a haci e logro aki posibel.\\nBOGOTA \u2013
  Diaranson Minister di economia di Aruba Geoffrey Wever a inaugura e \\\"Aruba Office\\\"
  na Holland House Colombia. Durante un ceremonia cu presencia di embahador Sr. Ernst
  Noorman, directeur Jan-Willem van Bokhoven, presidente di Kamer van Koophandel Gavril
  Mansur, directora di Departamento di Asuntonan Economico Maria Dijkhoff-Pita, y
  e delegacion comercial di Aruba, e \\\"Aruba Office\\\" na Holland House a bira
  un hecho pa asina facilita comercio entre Aruba y Colombia.\\nCARACAS - Union Panamericano
  y di Caribe pa Derecho Humano (Pacuhr) ta profundamente preocupa pa e impacto cu
  e reapertura di frontera cu Venezuela por tin pa cu e Venezolanonan den situacion
  migratorio \u2018iregular\u2019. Asina e instancia aki a bisa pa medio di un comunicado.
  \u201c Nos preocupacon ta centralisa den e apertura di e frontera di Aruba y Corsou
  cu Venezuela, y cu esaki por genera aprehencion masivo y expulsion di Venezolanonan
  den situacion migratorio iregular, cu ta crea un inopservancia di ordenamiento huridico
  internacional\u201d. Nan ta representa como 89 organisacion di Sociedad civil na
  Merca, Caribe y Europa. E gobiernonan di e islanan ABC, Venezuela y Hulanda a subraya
  e aspectonan posi tivo di e reapertura, specialmente e parti comercial. \u201cSinembargo
  no a ofrece mucho detaye di con nan lo atende cu e crisis migratorio.\\nSABA \u2013
  Secretario di estado Hulandes Alexandra van Huffelen a yega e isla di Saba despues
  di a bishita Bonaire, como part di ssu bishita na e islanan BES pa e.o. cera conoci
  cu e gobiernonan local instala despues di e ultimo eleccion na maart 2023. Awe diaranson
  anochi nan ta biaha pa Statia riba e Makana Ferry. E mandatario ta caba su bishita
  di e islanan na St Maarten pa reuni cu e tres gobernadornan di Aruba, Corsou y St
  Maarten.\\nDEN HAAG \u2013 Secretario di estado Hulandes Alexandra van Huffelen
  a inicia un bishita di un siman na islanan BES y St Maarten, esta Bonaire, Saba,
  Statia y St Maarten. Esaki ta e prome bishita desde cu e islanan BES tabatin nan
  eleccion insular na maart ultimo. Durante e bishita aki e mandatario lo cera conoci
  cu e gobiernonan insular nobo di cada isla.\""]'
