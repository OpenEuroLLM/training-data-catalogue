  Prome premio\\nE Mio Wireless Point Series di Palo Marga ta den su recta final y
  ta birando dia pa dia mas interesante. Pa loque ta trata e categoria IHRA Summit
  Series Box cos por cambia un ora pa otro como cu e promer lugar y e\"", "\"Suzy
  Camelia-R\u00f6mer: Pol\u00edtikonan, inkluso ministernan, tambe tin derechinan
  fundamental ku meres\u00e9 protekshon den un estado di derecho demokr\u00e1tiko.\\nSuzy
  Camelia-R\u00f6mer, komo minister den gabinete di Rhuggenaath, tambe a bira blanko
  di atakenan baho di sr. Monk i konsorsio. Klaramente, e ophetivo di sr. Monk ta
  pa krea deliberadamente un im\u00e1gen korupto di su oponentenan pol\u00edtiko i
  gabinete Rhuggenaath. Riba 1 di \u00f2ktober 2020, na n\u00f2mber di sra. S.F.C.R\u00f6mer,
  e tim di abogado Sr. A. Henriquez y Sra. Sr. O. Kostrzweski, relashon\u00e1 ku e
  echonan kastigabel komet\u00e9 dor di sr. C. Monk (i otronan) kontra sra. R\u00f6mer,
  a entreg\u00e1 un keho na Ministerio P\u00fabliko pa atend\u00e9 ku shete (7) delito
  komet\u00e9 kontra di dje. Den poko palabra ta trata di denunsi\u00e1nan falsu,
  insulto, kalumnia i difamashon. Ademas, riba 16 di \u00f2ktober 2020 sra. R\u00f6mer
  a manda Ministerio P\u00fabliko un petishon pa atend\u00e9 e denunsi\u00e1nan falsu
  di sr. Monk kontra di dje ku urgensia. Tambe sra.R\u00f6mer a dirig\u00ed riba mes
  fecha un karta na gobi\u00e8rnu, pa k\u00f2rd\u2019\u00e9 riba su deber pa proteh\u00e1
  tur siudadano, inkluso pol\u00edtikonan, i tambe su deber pa formul\u00e1 lei i
  maneho ku e fin ei. Suzy R\u00f6mer i PIN ta dese\u00e1 pa pronto mira un akshon
  desisivo di parti di Ministerio P\u00fabliko i gobi\u00e8rnu pa proteh\u00e1 partisipashon
  pol\u00edtiko i demokrasia den nos pais.\\nE presentashon sistem\u00e1tiko di denunsia
  falsu dor di sr. Monk i konsorsio tin e karakter di denunsia sistem\u00e1tiko, falsu
  i difamatorio. E modus operandi (M.O.) ta konos\u00ed : e ta anunsi\u00e1 e denunsi\u00e1nan
  durante entrevistanan radial i ta entreg\u00e1 nan deliberadamente den presensia
  di medionan di komunikashon na Landsrecherche of serka di e edifisio di Hof van
  Justitie, kaminda Procureur General tambe ta ubik\u00e1.\\nRepresentante di medionan
  di komunikashon ta para kla na e lug\u00e1 ku un k\u00e1mara, mi\u00e9ntras ku sr.
  Monk ta aserka ku b\u00f2shi di ordners bou di su brasa. Seguidamente sr. Monk ta
  hasi su deklarashonnan akusante i defamatorio dilanti k\u00e1mara kontra di e ministernan
  ku e ta akus\u00e1 falsamente, inklusivo kontra sra. R\u00f6mer. Ku e b\u00f2shi
  di papel e ta pretend\u00e9 di tin prueba di su akusashonnan falsu. E pr\u00e1ktika
  deskrib\u00ed di sr. Monk ta da\u00f1a di forma inrasonabelmente i inhustamente
  e bon n\u00f2mber i tacha honor di e ministernan. Despues di e presentashon di e
  denunsi\u00e1nan e ta sigui ripit\u00ed i enfatis\u00e1 e denunsi\u00e1nan falsu
  den media pa asina enfatis\u00e1 e persepshon ku nan a komet\u00e9 delitonan penal.
  Riba 30 di s\u00e8pt\u00e8mber 2020, sr. Monk a trese durante e programa radial
  \u2018Enfoke\u2019 di Radio MAS 99.7 FM, ku e i/o su fundashon \u2018Fundashon Hustisia
  pa Un i Tur\u2019, di kua e mes i un kompa\u00f1ero kandidato riba lista di KDNT
  ta forma e direktiva, te awor a present\u00e1 bintidos (22) denunsia (a base di
  lokual e la bisa nos a konta ta 24) i e ta preparando seis (6) denunsia mas. Seg\u00fan
  Sr. Monk, lo siguiente ta e denunsi\u00e1nan ku nan a hasi te awor:\\n- a) Eugene
  Rhuggenaath, Prom\u00e9 Minister, Minister di Asuntunan General: 4 denunsia;\\n-
  b) Armin Konket, Minister di Atministrashon, Planifikashon i Servisio: 2 denunsia;\\n-
  c) Quincy Girigorie, Minister di Hustisia: 2 denunsia;\\n- d) Kenneth Gijsbertha,
  Minister di Finansa: 3 denunsia;\\n- e) Marilyn Alcal\u00e1-Walle, (ex) Minister
  di Edukashon, Siensia, Kultura i Deporte: 1 denunsia;\\n- f) Suzy Camelia-R\u00f6mer,
  (ex) Minister di Sal\u00fa, Medio Ambiente i Naturalesa: 6 denunsia;\\n- g) Hensley
  Koeiman, Minister di Desaroyo Sosial, Trabou i Bienestar: 2 denunsia;\\n- h) Steven
  Martina, Minister di Desaroyo Ekon\u00f3miko: 2 denunsia i 1 denunsia na Korte di
  Hustisia;\\n- i) Zita Jesus-Leito, Minister di Tr\u00e1fiko, Transporte y Planifikashon
  Urbano: 2 denunsia.\\nMi\u00e9ntras tantu, Ministerio P\u00fabliko (OM) a kombert\u00ed
  den parti indeseabel di e aktividatnan pol\u00edtiko di Sr. Monk. Ta mas ku kla
  ku di dia ku sr.Monk i konsorsio ta realis\u00e1 e atakenan sistem\u00e1tiko ku
  e intenshon pa sirb\u00ed nan mes interesnan pol\u00edtiko i di nan Partido ku meta
  pa da\u00f1a n\u00f2mber di integrantenan pol\u00edtiko di Kabinet Ruggenaath i
  (eks) ministernan individual.\\nTa bon pa se\u00f1al\u00e1 ku un denunsi\u00e1 kontra
  di un hende no ta nifik\u00e1 ku e persona ta kulpabel. Inkluso design\u00e1 un
  persona komo sospechoso dor di Ministerio P\u00fabliko no ta mas ku indikashon di
  e posibilidat, esta un sospecha, ku e persona por a hasi su mes kulpabel na un echo
  kastigabel i ku ta bai investig\u00e1 esaki. Ta solamente wes por determin\u00e1
  si un hende ta kulpabel.\\nAdemas di e delitonan komet\u00e9 pa Sr. Monk i konsorsio
  kontra e personanan kontra kua e la hasi denunsi\u00e1nan falsu, e \u00f3rden hur\u00eddiko
  demokr\u00e1tiko ta keda gravemente menas\u00e1 pa nan. Pasobra despues di tur kos,
  e derechinan fundamental rekonos\u00e9 den e Tratado di Derechi Sivil i Pol\u00edtiko
  (BUPO) y e Tratado Europeo di Derechi Humano (EVRM) di e (ex) ministernan a keda
  gravemente viol\u00e1.\\nPa proteg\u00e9 e derechinan di e siudadanonan, gobi\u00e8rnu
  mester traha lei i maneho pa atend\u00e9 ku e lei di Integridat di (kandidato) Minister;
  i lei i maneho pa atend\u00e9 ku denunsi\u00e1nan kontra ministernan. Ministerio
  P\u00fabliko a se\u00f1al\u00e1 e nesesidat di debate pol\u00edtiko pa aklar\u00e1
  e lei.\\nRaad voor de Rechtshandhaving tambe a mustra riba e fayonan den e lei inkluso
  violashon di Areglo di Estado, i tratadonan di Derechi Humano (EVRM) i di Derecho
  Sivil i Pol\u00edtiko (BUPO). E debate ainda no a tuma lug\u00e1, aunke PIN komo
  partido a traha dos konsepto di lei i un moshon. E echo ku e partidonan di oposishon
  den parlamento tampoko ta kontribu\u00ed na un debate pol\u00edtiko riba e tema
  ta di spera den e kultura partidista di K\u00f2rsou, pero no ta motibu sufisiente
  pa gobi\u00e8rnu no proteh\u00e1 e derechi di su siudadanonan.\\nE falta de kapasidat
  humano serka Ministerio P\u00fabliko i Landsrecherche ku ta stroba nan pa hasi nan
  trabou, mester keda resolv\u00e9 pa gobi\u00e8rnu. Un ousensia mas largu di un investigashon
  \u00f2f un desishon riba e denunsi\u00e1nan falsu ta hopi da\u00f1ino pa e personanan
  konsern\u00ed. Gobi\u00e8rnu di K\u00f2rsou ta mustra muchu tiki komprenshon pa
  e da\u00f1o sosial, emoshonal, sikol\u00f3giko i e menasa f\u00edsiko komo resultado
  di e denunsi\u00e1nan falsu. V\u00e1rios biaha a arest\u00e1 sospechosonan pa menasa
  motiv\u00e1 pa e akusashonnan falsu aki kontra di mandatarionan. E echo ku e outoridatnan
  konsern\u00ed no ta atend\u00e9 e denunsi\u00e1nan aki lih\u00e9, ta kontribu\u00ed
  na e da\u00f1o aki.\\nNa mes momentu, e denunsi\u00e1nan falsu i sistem\u00e1tiko
  ta menas\u00e1 nos demokrasia i ta kousa da\u00f1o grave na e im\u00e1gen di atministrashon
  p\u00fabliko di K\u00f2rsou internamente i internashonal.\\nSuzy Camelia-R\u00f6mer:
  Politici, waaronder ministers, hebben ook grondrechten die bescherming verdienen
  in een democratische rechtstaat.\\nOok Suzy Camelia-R\u00f6mer is als minister in
  het kabinet Rhuggenaath, doelwit geworden van het kwaadaardig politiek bedrijf van
  de heer Monk c.s., bestaande uit stelselmatig beledigen, smaden, lasterlijk en publiekelijk
  aanklagen van ministers om percepties te scheppen die niet op feiten berusten. Het
  doel van Monk is duidelijk, bewust een corrupt beeld cre\u00ebren van zijn politieke
  tegenstanders, het kabinet Rhuggenaath. Namens mevrouw S.F.C. R\u00f6mer hebben
  de advocaten, mr. A. Henriquez en mw. mr. O. Kostrzweski, op 1 oktober 2020, terzake
  het strafbaar handelen van de heer C. Monk (e.a.) aangifte met betrekking tot het
  plegen van zeven (7) strafbare feiten gedaan. Het gaat, kort samengevat, om het
  doen van valse aangifte, belediging, smaad, smaadschrift, laster, lasterlijke aanklacht
  en lasterlijke verdachtmaking. Daarnaast is op 16 oktober jl. het Openbaar Ministerie
  aangeschreven met het verzoek spoedig uitspraak te doen over de door Monk c.s. tegen
  mw. R\u00f6mer valselijk ingediende aangiften. De regering is eveneens op 16 oktober
  2020 aangeschreven ten einde die te wijzen op haar plicht tot bescherming van alle
  burgers, waaronder politici, en de plicht daartoe wetgeving en beleid te formuleren.
  Suzy R\u00f6mer en PIN wensen spoedig een daadkrachtig optreden van het Openbaar
  Ministerie en de Regering te zien, omwille van het beschermen van de politieke participatie
  en democratie in ons land.\\nHet stelselmatig indienen van valse aangiften door
  de heer Monk c.s., heeft het karakter van stelselmatige, valse en lasterlijke aangiften.
  De modus operandi is bekend: de aangiften worden tijdens radio-interviews aangekondigd
  en vinden bewust plaats in aanwezigheid van de media ter hoogte van de Landsrecherche
  op de Scharlooweg of nabij het gebouw van het Gemeenschappelijk Hof van Justitie,
  alwaar ook de Procureur- Generaal zetelt. Vertegenwoordigers van de media staan
  ter plekke met camera opgesteld, terwijl Monk met een ordnermap onder de arm komt
  aanlopen. Monk legt vervolgens ten overstaan van de camera beschuldigende verklaringen
  af ten aanzien van de bij zijn valse aangiften betrokken ministers, waaronder ondergetekende.
  Daarbij heeft hij stapels papier onder de arm als gepretendeerde bewijs van door
  de ministers gepleegde strafbare feiten. Door deze meermalen door de heer Monk tentoongestelde
  handelswijze worden de ministers, waartegen de aangiften worden gedaan op onredelijk
  wijze in hun goede naam en eer geschaad. Na het indienen van aangiften wordt de
  kwaadaardige daad tijdens radio-interviews herhaald en aangedikt om de perceptie
  te benadrukken dat er strafbare feiten zijn gepleegd. Op 30 september 2020 verklaarde
  de heer Monk tijdens het radioprogramma \u2018Enfok\u00e9\u2019 op Radio MAS 99.7
  FM, dat hij/of zijn stichting \u2018Fundashon Hustisia pa Un i Tur\u2019, waarvan
  hij en een medekandidaat op de kiezerslijst van de politieke partij \u2018K\u00f2rsou
  die Nos Tur\u2019 de bestuurders zijn, inmiddels twee\u00ebntwintig (22) klachten/aangiften
  (bij telling hieronder is dat 24) hebben ingediend en dat hij nog zes (6) aangiften
  voorbereidt. Volgens de heer Monk zijn de volgende aangiften tot nu toe:\\n- Eugene
  Rhuggenaath, Minister-President, Minister van Algemene Zaken: 4 aangiften;\\n- Armin
  Konket, Minister van Bestuur, Planning en Dienstverlening: 2 aangiften;\\n- Quincy
  Girigorie, Minister van Justitie: 2 aangiften;\\n- Kenneth Gijsbertha, Minister
  van Financi\u00ebn: 3 aangiften;\\n- Marilyn Alcal\u00e1-Walle, (voormalig) Minister
  van Onderwijs, Wetenschap, Cultuur en Sport:\\n1 aangifte;\\n- Suzy Camelia-R\u00f6mer,
  (voormalig) Minister van Gezondheid, Milieu en Natuur: 6 aangiften;\\n- Hensley
  Koeiman, Minister van Sociale Ontwikkeling, Arbeid en Welzijn: 2 aangiften;\\n-
  Steven Martina, Minister van Economische Ontwikkeling: 2 aangiften en beklag bij
  het Hof;\\n- Zita Jesus-Leito, Minister van Verkeer, Vervoer en Ruimtelijke Planning:
  2 aangiften;\\nHet Openbaar Ministerie (OM) is ondertussen een ongewenst onderdeel
  van het politiek bedrijf van de heer Monk gemaakt. Duidelijk is dat Monk c.s. deze
  stelselmatige aangiften doen met de bedoeling om hun partij politieke belangen te
  dienen door het schaden van de reputatie van de (oud)leden van kabinet Rhuggenaath.
  Vermeldt moet worden dat aangiften tegen een persoon niet betekent dat een persoon
  schuldig is. Zelfs het aanmerken van een persoon als verdachte door OM is niet meer
  dan het aangeven van de mogelijkheid, een vermoeden, dat iemand zich aan een strafbaar
  feit heeft schuldig gemaakt, hetwelk verder wordt onderzocht. Het is uiteindelijk
  alleen de rechter die zich over schuld of onschuld kan uit te spreken.\\nNaast de
  strafbare feiten die door de heer Monk c.s. jegens personen worden gepleegd, wordt
  de democratische rechtsorde grovelijk door hen ondermijnd. Immers worden fundamentele
  rechten op grond van het Verdrag inzake Burger en Politieke Rechten (BUPO) en het
  Europees Verdrag voor de Rechten van de Mens (EVRM) van de (gewezen) ministers,
  ernstig geschonden.\\nDe regering dient ter bescherming van deze rechten van burgers,
  wetgeving en beleid met betrekking tot de Landsverordening integriteit (kandidaat-)ministers
  en overigens met betrekking tot aangiften betreffende gezagdragers te maken. Het
  Openbaar Ministerie heeft op de noodzaak van het politiek debat gewezen ter verduidelijking
  van de bepalingen van de Landsverordening integriteit (kandidaat-)ministers. Ook
  de Raad voor de Rechtshandhaving en de Raad van Advies hebben op gebreken in de
  wet en zelfs op de schending van de Staatsregeling, EVRM en BUPO-verdragen gewezen.
  Dat debat heeft nog niet plaatsgevonden, alhoewel de politieke partij PIN met de
  samenwerkende partijen daartoe voorbereidingen hebben getroffen, een motie en een
  aantal concept-ontwerpen van wetgeving hebben opgesteld. Dat oppositie partijen
  in de Staten ook weinig bijdrage leveren aan een politiek debat over het onderwerp,
  is in de partijpolitieke cultuur op Cura\u00e7ao te verwachten maar onvoldoende
  reden om van overheidswege de rechten van burgers niet te willen beschermen.\\nHet
  capaciteitsgebrek welke het Openbaar Ministerie en de Landsrecherche belemmeren
  in hun werkzaamheden, dient door de regering opgelost te worden. Het langer uitblijven
  van onderzoek of van een uitspraak met betrekking tot deze valse aangiften, is schadelijk
  voor de betreffende politieke gezagsdragers. De regering van het land Cura\u00e7ao
  geeft blijk van onvoldoende inzicht in de maatschappelijke, emotionele, psychologische
  schade en fysieke bedreiging die het gevolg is van de valse aangiften. Meermalen
  zijn verdachten wegens bedreiging ingegeven door dit soort aantijgingen van bestuurders
  aangehouden. Het niet prompt afdoen van deze aangiften aan de betrokken personen
  en hun familie draagt bij aan deze schade.\\nTegelijkertijd bedreigen genoemde valse
  en stelselmatige aangiften de democratische rechtsorde en brengen grote schade aan
  het imago van het openbaar bestuur van Cura\u00e7ao, zowel intern als internationaal.\\nYou
  must log in to post a comment.\"", "\"\u201cSerka Se\u00f1or mi ta na pas, manera
