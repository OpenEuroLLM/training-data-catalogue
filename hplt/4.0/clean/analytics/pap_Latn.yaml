sample: '["\"Ta manera algo cu ta sumamente na moda, a tuma luga un biaha mas kibramento
  di bentana di auto.\\nHendenan den vecindario ta sumamente fada cu cada biaha na
  e mesun sitionan y riba e mesun strip ladronnan ta haya ta bon pa distrui propiedad
  di hende y bay cu nan pertenencianan.\\nE biaha aki un biaha mas ta na Sultan, caminda
  un dama a bay un comemento, lagando su tas den auto y na momento cu el a sali for
  di e luga, el a bin haya e sorpresa cu antisocialnan a kibra drenta den su auto
  y bay cu su tas cu 5 mil florin den dje. Claramente esaki ta algo cu mester sigui
  pone atencion riba dje, pasobra ya ta varios dia, pa nos bisa siman tras di otro,
  cu antisocialnan ta kibra bentana di auto y ta horta cos di hende.\"", "\"A kita
  reibeweis di shof\u00f9r ku a abus\u00e1 di alkoh\u00f2l\\nORANJESTAD.- Ayera Aruba
  tambe tabatin un selebrashon grandi den kuadro di karnaval. Ayera a tuma lug\u00e1
  e asina yama \u2018fakkel\u2019. E parada di hendenan ku lus a bira konos\u00ed
  komo un di esnan mas ekon\u00f3miko pa partisip\u00e1 na dje. Hendenan lokal i turistanan
  ta balia den kaya tras di e tr\u00f9knan ku muzik.\\nKuerpo Polisial di Aruba tratando
  na ha\u00f1a un Aruba ku mas \u00f3rden P\u00fabliko i m\u00e9nos aksidente deb\u00ed
  na mal uso di alkoh\u00f2l a tene un kontrol severo atrobe riba kaya. Den esaki
  a deten\u00e9 11 persona, esei ta m\u00e9nos kompar\u00e1 ku e a\u00f1a Prom\u00e9.\\nDurante
  i despues di \u2018fakkel\u2019 a parti un total di 28 but pa esnan ku a surpas\u00e1
  e velosidat m\u00e1ksimo, e velosidat tabata varia di 105 te ku 126 km ku hendenan
  tabata kore. Tur a ha\u00f1a but. E kontrolnan a tuma lug\u00e1 na e asina yama
  \u201cGreen corridor\u201d direkshon Playa na altura di rot\u00f2nde Seru Tijshi.\\nDurante
  di e parada \u2018Unidad Motorisa\u2019 a kontrol\u00e1 tambe di forma preventivo
  den lug\u00e1nan di parker rond\u00f3 di e aktividat i a logra deten\u00e9 un sospechoso
  pa kiebro den outo.\\nDespues di e parada tabain en total 7 detenshon di shof\u00f9rnan
  ku a kore outo bou di influensia di alkoh\u00f2l. Asta tabatin un kaso ku a surpas\u00e1
  tur l\u00edmite. Den e kaso ei e shof\u00f9r tabatin un nivel inkreibel haltu den
  su sanger (1160 ug/L). Mesora outoridatnan a tuma desishon ku ta kita su reibeweis
  pa un periodo basta largu (+/- 8 luna).\"", "\"Bo ke kumins\u00e1 skibi bo plan
  di negoshi pero bo no sa kon pa hasi esaki? E \u2018e-learning\u2019 aki bo ta guiabo
  stap pa stap den skibimentu di bo pan di negoshi. E kurso aki ta yudabo pensa tokante
  di bo negoshi: kiko bo ke hasi, dikon bo ke hasie i kiko ta nesesario pa kuminsa?\\nKomplet\u00e1
  bo plan di negoshi ku e \u2018e-learning\u2019 aki!\\n- Skibi bo plan di negoshi
  stap pa stap\\n- Pensa tokante bo plan nan i kronketis\u00e1 nan den e plan di negoshi\\n-
  Kurso gr\u00e1tis \u00f2nlain\\n- Sigui e kurso na bo kuminiensia\\n- \u2018E-learning\u2019
  kaminda bo ta skibi bo propio plan di negoshi;\\n- Kompletamente adapt\u00e1 pa
  e empresario chik\u00ed i independiente;\\n- E ta stimul\u00e1 bo pensamentu i ta
  enkurash\u00e1 bo pa konkretis\u00e1 bo plan nan;\\n- E plan di negoshi por keda
  uz\u00e1 mesora pa un aplikashon pa kr\u00e9dito na Qredits;\\n- E \u2018e-learning\u2019
  ta dura mas \u00f2f m\u00e9nos 15 ora.\\nUn \u2018e-learning\u2019 ta un kurso \u00f2nlain
  ku bo por traha riba kualke k\u00f2mpi\u00fcter \u00f2f \u2018tablet\u2019 i bo
  no ta mar\u00e1 na un tempu spes\u00edfiko. E \u2018e-learning\u2019 semper ta un
  kombinashon di teoria, tareanan, eh\u00e8mpelnan, t\u00e8stnan, i v\u00eddeonan.
  E konosementu i eksperensia di diferente profeshonal tantu paden i paf\u00f3 di
  Qredits, a keda uz\u00e1 pa krea e \u2018e-learning\u2019. E \u2018e-learning\u2019
  ta konsist\u00ed di diferente m\u00f3dulo i ta f\u00e1sil pa bo manten\u00e9 un
  bista riba bo progreso \u00f2f unda pa kontinu\u00e1.\\nKiko bo mester?\\nE \u2018e-learning\u2019
  ta funshon\u00e1 riba un k\u00f2mpi\u00fcter, un l\u00e8pt\u00f2p, i un \u2018tablet\u2019.
  Si bo ta uzando un \u2018pop-up blocker\u2019, ta nesesario pa bo paga esaki.\"",
  "\"Boneiru ta sigui bria komo un di e destinashonnan t\u00f2p pa sambuy\u00e1, ora
  ku e isla a logra gana 12 diferente premio den e asina yam\u00e1 Readers\u2019 Choice
  Awards di\u2026\\nCategory Archives: Ekonomia\\nResientemente Overheidsgebouwen
  N.V. (BOG) i Janesloot N.V. a firma un kontrato pa desaroyo di un Resort nobo na
  Boneiru, kual lo karga e n\u00f2mber \u201cTime To Smile Chogogo Dive &\u2026\\nDespues
  di yegada di e avion di Sky High Aviation na aeropuerto Flamingo djabi\u00e8rn\u00e8
  m\u00e8rdia, a sigui un konferensha di prensa. Tabata e representante di Sky High
  Aviation aki na\u2026\\nDespues di basta esfuerso, awe prom\u00e9 ku m\u00e8rdia
  e kompania di aviashon di Rep\u00fablika Dominikana, Sky High Aviation a ateris\u00e1
  riba e pistanan di Flamingo Airport na Boneiru. E kompania\u2026\\nDirektor di Tourism
