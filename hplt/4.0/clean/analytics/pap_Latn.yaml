  e importancia pa un pais tin un telefon pa ayudo di mucha y hoben. E a\u00f1a aki
  mas cu nunca e importancia di ayudo via telefon y via internet na nos muchanan y
  hobenan tur rond di mundo y tambe na Aruba a ser demostra. Durante e pandemia di
  Covid-19 miyones di mucha, hoben y adolecente a ser yuda door di un di e 173 telefon
  pa ayudo di mucha rond di mundo. Tur parti di mundo, incuyendo Telefon pa Hubentud
  Aruba a keda brinda informacion, proteccion, ayudo y sosten durante e pandemia di
