  bo ta , bo ta bon kuida\\nCondolencia na sobra famianan\\ndi parti bo iha Jurgen
  Daal i famia\\nGecontroleerd na joe, I famianan di Erna, mita desea boso hopi forsa.\\nKu
  Erna sosega na pas.\ud83e\udd40\ud83d\ude4f\\nRoxanne de Jongh\\nProfundo kondolenaia
  ku fayesimentu di Erna.\\nMi ta Korda Erna di tempu ku nos a bai skol!!\\nPas na
  su alma\\nCondoleer ku e perdida\\nHopi forza\\nElvia Jeandor\\nCondoleer Michael
  i hopi forsa pa e famianan ku a keda atras.\\nIlsmarie Pieternella\"", "\"E wega
  entre SV Caiquetio y SV Dakota den siman 16 aki ta un chens pa Dakota subi bek na
  prome luga riba e table di posicion, apesar cu por ta temporario, wardando resultadonan
  di Estrella y Nacional den nan weganan pendiente di e jornada 16. Caiquetio ta casi
  sigur den e play-off di promocion-degradacion ta biniendo di un contundente victoria
  riba Riverplate den siman 15, ta hungando pa honor pero tambe pa preparacion pa
  logra keda den division di honor pa e siguiente temporada.\\nDakota ta cuminsa e
  wega di biaha den atake di hopi velocidad, Caiquetio su strategia ta di sinta warda
  defende bon y hasta ocasionalmente press Dakota un poco mas ariba, tratando di desekilibra
  nan wega, ocasionalmente ataka tambe. Tin biaha dominio di bala y hasta control
  di wega no ta suficiente pa gana un wega. Dakota tabatin tur esey, toch e gol no
  a yega pa basta largo, y ora un gol no ta yega tin biaha sin pasenshi frustracion
  sa drenta sin cu bo kier. Caiquetio su tactica tabata \u201cspot on\u201d, Dakota
  cu bala y iniciativa pero sin yegada di calidad, ni peligroso. Mester remarca cu
  e Dakota actual no ta mesun Dakota di e prome mita di e temporada actual, nos sa
  cu e ekipo tabata solido na cuminsamento di temporada, nan tabata score hopi mas
  gol te cu e punto ey y solido den prome luga, nan golnan a somenta, e average di
  gol pa wega ta awor 1.42 vs 2.40 den e prome round di temporada, un caida significante.
  E perdida di Jesus Pe\u00f1ate a hasi tal impacto? Paso toch Pe\u00f1ate no tabata
  score hopi gol, pero nos por deduci si cu Pe\u00f1ate lo tabata crea hopi mas yegada
  y chens pa su oncena, esey falta awo actualmente pa e Dakoteronan y pa nan aspiracion
  pa gana un campeonato. Halftime a bay aden sin gol, un tremendo logro te na e punto
  ey pa Caiquetio y mas frustracion pa e \u2018geel cu pretonan\u2019.\\nE di dos
  tempo a cuminsa sorpresivamente cu Caiquetio den atake y peligroso tambe pa colmo,
  un ekipo mentalmente renoba y dicidi pa competi cuerpo a cuerpo cu cualke ekipo.
  Asina a cuminsa un \u2018toma y dame\u2019 entre e dos contrincantenan, Caiquetio
  a defende hopi bon y tin biaha hasta a bay den atake si nan a mira e chens. Un Dakota
  cada biaha mas nervioso y sin precision husto pa via di e tactica di Caiquetio.
  Dakota a hasi algun cambio tambe en busca di solucion, despues por a wak si cu Dakota
  a cuminsa organisa nan mes mihor cu mihor pasenan for di minuut 65 n\u2019ey. Cu
  miho yegadanan e chens nan di Dakota a mehora, pero, di gol nada ainda. Toch tabatin
  un milager chikito ainda pa Dakota, un penalty na minuut 73, sin duda algun bon
  cobra pa e referee ne momento ey. Ricky Hodge a tira e penalty y pase na banda di
  e portero di Caiquetio pa e gol di bentaha. E wega a sigui na mesun ritmo pa un
  paar di minuut mas, Caiquetio purbando di empata e wega tambe, un bon prestacion
  di e ekipo di Paradera. E ultimo 10 pa 15 minuut di e contienda aki si nos por bisa
  cu cos a bay hopi for di man riba veld cu accion nan anti-futbol, e hungado nan
  a perde disciplina, tabatin hugadanan duidelijk di carchi, ta parce cu algun hungado,
  especialmente di Dakota, tabata busca intencionalmente pa haya carchi, momentonan
  scur y dudoso cu ta perhudica nos futbol, referee cu a trata di hasi lo miho posibel
  pero toch a perde control di e wega y autoridad riba veld, pero tambe mester awo
  revisa e reglanan di disciplina y procedimiento di con ta trata cu acumulacion di
  caarchinan. Apesar cu a anuncia 5 minuut di tempo extra despues di e 90 minuut reglamentario,
  a hunga solamente 2 di eseynan, dus, wega a caba prome cu tempo tambe pa colmo,
  disgustando e ekipo di Caiquetio y su fanaticadan, paso, nan tabata ainda cu chens
  pa empata e wega, \u201cQuo Vadis\u201d futbol Arubano??\\nResultado final Dakota
  1 Caiquetio 0. Ricky Hodge ta nos \u2018man of the match\u2019. Dakota asina ta
  temporariamente na prome luga cu 35 punto, Caiquetio cu 8 punto oficialmente ta
  evita degradacion automatico y ta bay hunga play-off di promocion-degradacion na
  final di temporada.\"", "\"A\u00f1a pasa ainda Aruba tabata goza di un outlook positivo
  di Fitch Rating. Den su evaluacion di e maneho actual di e Gobierno nobo, Fitch
  a yega na e conclusion cu e Gobierno actual no ta bay alcansa e normanan cu e Gobierno
  anterior a palabra cu Hulanda. Esaki ta e motibo principal pa a cambia e outlook
  di Aruba di positivo pa negativo.\\nFitch ta bisa literalmente:\\nThe Negative Outlook
  reflects substantial deviation from previously established fiscal deficit targets.\\nDesde
  a\u00f1a 2015 e presupuesto di Aruba mester cumpli cu normanan cu tin den e ley
  di CAFT. Na 2015 e norma tabata 3.7% y e Gobierno anterior a logra esaki. Na 2016
  e tabata 2% y esey tambe a wordo alcansa. Esaki a worde certifica dor di CAFT y
  Algemene Rekenkamer. Na 2017 e Gobierno anterior te cu mita di a\u00f1a, segun CAFT,
  tabata riba curso di lo por a alcansa e norma di 2017 cu ta 0.5%. Tur esaki a cambia
  cu e Presupuesto cu e gobierno nobo a cambia.\\nSituacion a bira aun pio awo cu
  e Gobierno actual a dicidi cu nan no ta bay logra e norma stipula den e ley di CAFT
  pa 2018, cu ta 0.5%. Fitch ta menciona cu esaki ta e mayor motibo pa a cambia e
  outlook di positivo pa negativo.\\nThe Negative Outlook reflects substantial deviation
  from previously established fiscal deficit targets.\\nTambe FITCH ta expresa preocupacion
  pa cu e falta di claridad riba e refeneria. Un punto cu tambe ta resalta ta cu FITCH
  ta premira un posibel conflicto entre Gobierno di Aruba y Gobierno di Reino.\\nBao
  di e capitulo di RATING SENSITIVITIES e rating agency ta bisa cu un di e factornan
  cu por conduci na empeora e rating di Aruba aun mas awor cu Gobierno no kier atene
  su mes na e normanan di CAFT, ta un conflicto cu Reino.\\nLiteralmente Fitch ta
  bisa: cu un di e factornan cu por\\ntrigger a negative rating action is a deterioration
  in the institutional relationship between Aruba and the Netherlands.\"", "\"Diahuebs
  atardi, manera a keda indica den nos edicion anterior, ex-minister Otmar Oduber
  a tene un conferencia di prensa na unda el a libra silencio, despues di tres a\u00f1a
  tocante caso Flamingo, caso cu a cuminsa cu entrada hudicial na cas di Oduber dia
  24 di juni 2020.\\nInicialmente, manera Oduber a splica, caso Flamingo a cuminsa
  cu alrededor di shete acusacion, y despues a keda cu dos acusacion den su contra,
  estafa y soborno. Manera ta conoci caba, y segun Oduber tambe a recorda, parlamentario
  Marisol Lopez-Tromp a entrega keho oficial na Ministerio Publico contra Oduber,
  tambe aldrededor di shete y na final un so a keda, cu ta e acusacion spookambtenaar.\\nOduber
  ta remarca cu a presenta un documento den su contra den cual ta indica cu el a duna
  tereno pa construccion di e hotel banda di aeropuerto y cu a duna tereno tambe na
  familiar, Venezolano, di e do\u00f1o di hotel.\\nEl a enfatisa, pa loke ta e proyecto
  di e hotel banda di aeropuerto cu a cuminsa na 2015, cu e tempo ey e no tabata minister
  di infrastructura mas, pues no tin posibilidad cu e por a haci locual tabata acus\u2019e
  di dje. El a sigui indica cu banda cu e no e tabata minister, e tereno en cuestion,
  segun Oduber, ta indica ta un tereno eigendom tambe.\\nMinisterio Publico a insisti
  cu mester cera Oduber back pa motibo cu nan tabatin hopi testigo pa scucha den e
  caso ainda, y Ministerio Publico a pidi un total di 16 mas di extension, hues a
  duna ocho dia pa realisa tur interogacion necesario pa termina cu e parti aki di
  e caso.\\nOduber ta enfatisa cu durante ningun di su interogacionnan nan a puntr\u2019e
  tocante soborno, cu tabata un di e acusacionnan inicial di caso Flamingo.\\n\u201cKico
  a pasa, full caso Flamingo a cambia y bira un caso di rabia di Marisol. Esey so,
  nada mas. Boso sa kico ta mi suerte? Den dos a\u00f1a cu mi tabata Minister di Infrastructura,
  tur e acusacionnan ta bisa cu ta Venezolanonan a paga pa haya tereno, Otmar Oduber
  no a duna ni un Venezolano un tereno erfpacht durante e dos a\u00f1a ey,\u201d el
  a subraya.\\nEl continua bisando cu landsrecherche a drenta su cas riba un 24 di
  juni, y aworaki e caso di Flamingo a bira tocante un acusacion haci dia 24 di juli.\\nEl
  a remarca tambe cu durante e dianan cu a pidi pa extension, un total 16 dia cu Ministerio
  Publico a haya pa motibo di COVID, un biaha so a interog\u2019e y despues a lag\u2019e
  liber riba e di cinco dia.\\nOduber a sigui splica cu na momento cu el a sali for
  di KIA, di biaha el a entrega un keho back contra di Lopez-Tromp pasobra, segun
  e ta indica, e keho cu Lopez-Tromp a entrega den su contra ta basa riba mentira.
  \u201cDen e caso aki nan a cuminsa kibra mi financieramente, da\u00f1a mi negoshinan,
  perhudica mi negoshinan dramaticamente,\u201d el a expresa.\\nOduber a bisa cu na
  december ultimo autoridadnan a yam\u2019e pa mas pregunta, pero ya no tabata mas
  tocante e keho di Lopez-Tromp, sino nan cuminsa puntr\u2019e di un cantidad di diferente
  otro cos, cu segun e ta enfatisa, no ta cuadra.\\nSr. Vito Carlo, abogado di Oduber
  a, a enfatisa cu aworaki ya no por yama e caso aki Flamingo mas. \u201cSi yega asina
  leu cu e caso mester bay corte, e no lo ta caso Flamingo,\u201d el a indica.\\nPa
  loke ta e casonan pendiente cu ta involucra Oduber, Carlo a splica cu e casonan
  lo bin dilanti prome cu e wordo declara liber, e denuncia cu Oduber mes a haci contra
  Marisol Lopez-Tromp. Aworaki e caso ta den man di Ministerio Publico pa dicidi si
  nan ta persigui Lopez-Tromp of no.\\nDen e otro caso di Oduber ta mesun situacion,
  tin un denuncia di Lopez-Tromp contra Oduber, a haci investigacion y aworaki cu
  investigacion a cera, landsrecherche mester manda dossier pa Ministerio Publico
  y na su turno Ministerio Publico ta bay dicidi, riba e meritonan di e dossier, si
  tin base legal pa persigui Sr. Oduber.\\nContestando pregunta di prensa tocante
  e declaracion di Prome Minister Evelyn Wever-Croes ken a declara durante conferencia
  di prensa cu algun di ex-ministernan di Infrastructura, entre nan Otmar Oduber,
  ta sospechoso den caso penal tocante corupcion di tereno y cu lo depolitisando DIP,
  Oduber a contesta: \u201cSi Minister Presidente a declara esey, e sa algo mas cu
  mi anto.\u201d\\nEl a splica cu e no tin caso di sospecho contra su persona, relaciona
  na DIP en todo caso, pero si tabatin momento cu preguntanan cu a wordo haci pa loke
  ta su maneho tempo e tabata encarga cu e departamento en cuestion.\\n\u201cCon bo
  por papia di depolitisa un departamento si tur siman bo ta reuni cu e hefe y dun\u2019e
  instruccion, y no por otro pasobra ta e Minister ta responsabel pa ley. E no tin
  sentido pa depolitisa, si tanten cu no privatisa, independisa e departamento, e
  minister ta keda politicamente responsabel pa e departamento,\u201d el a enfatisa.\"",
  "\"ORANJESTAD \u2013 Recientemente Respaldo a presenta na su stakeholders y invitadonan
  e Aspiracion 2030 y nan Logo Nobo.\\nE directora di Respaldo se\u00f1ora Caroline
  Hart a haci un presentacion na e diferente stakeholders cu ta traha cu Respaldo
  riba e tereno di salud mental. Na e ocasion aki tabata presente nos Prome Minister
  se\u00f1ora Evelyne Wever-Croes y Minister Rocco Tjon, kende ta Minister di Husticia
  y Asuntonan Social cu alabes ta e Minister encarga cu e cartera di Salud Mental.\\nSe\u00f1ora
  Caroline Hart a elabora riba e plannan pa futuro di Respaldo.E aspiracion cu Respaldo
  tin pa cu tratamento di su clientenan y di su empleadonan. E rol cu Respaldo kier
  tin den futuro pa cu e comunidad di Aruba.\\nE plannan no ta solamente pa brinda
  un miho servicio na e comunidad di Aruba den e area di Salud Mental, pero pa eleva
  e calidad di e servicio en general, como tambe riba tereno di sostenebilidad y inclusividad
  den Salud Mental. Ta di suma importancia pa cuminsa cu e trabou internamente unda
  cu e empleadonan ta central y ta hunga un rol hopi importante pa na final Respaldo
  por brinda nos comunidad e servicio di calidad cu ta necesario.\\nSe\u00f1ora Hart
  a informa tambe di e projectonan cu Respaldo ta ehecutando actualmente pa asina
  por logra e metanan di futuro. E projectonan ta inclui, training pa e personal,
  servicionan nobo, colaboracion cu otro organisacionnan local y internacional como
  tambe sistemanan automatisa.\\nRiba e anochi aki tambe Respaldo a presenta su Logo
  Nobo. E logo nobo di Respaldo ta un simbolo poderoso cu visualmente ta duna bida
  na e meta principal, e vision y balornan basico. Cada elemento den e logo a ser
  dise\u00f1a pa refleha e compromiso na cuido di salud mental y e meta pa un Aruba
  mentalmente mas sano.\\nE significado di e logo den su totalidad ta representa e
  Aspiracion 2030 di Respaldo cual ta: \u201cRumbo pa un organisacion di salud mental
  specialisa profesional y sostenibel pa un Aruba mentalmente sano\\\". E man cu ta
  sostene e celebro ta personifica e mision pa traha hunto cu y rond di e cliente,
  poniendo semper nan bienestar na prome lugar. E strepinan cu ta conecta ta subraya
  e importancia di cooperacion, den Respaldo su organisacion y tambe cu e socionan,
  pa por ofrece un cadena di cuido sin obstaculo.\\nE colornan y simbolonan den e
  logo ta refleha tambe e ambicion pa sostenibilidad: Respaldo ta busca pa contribui
  na e ''2030 Agenda for Sustainable Development Goals'' di Nacionnan Uni, cu un enfoke
  riba salud mental sostenibel y un maneho sostenibel di su organisacion.\\nE logo
  aki ta mas cu solamente un imagen visual; e ta un resumen di ken Respaldo ta como
  organisacion, kiko nan ta persigui y con nan ta conecta cu e comunidad cu nan ta
  sirbi. E ta representa e entrega continuo pa duna cuido di calidad halto, empatico
  y sostenibel na tur hende na Aruba.\\nPa mas informacion di Respaldo, semper por
  bishita su rednan social riba LinkedIn, Facebook y Youtube, Respaldo Aruba.\\nORANJESTAD
  - Dia 28 di februari a tuma lugar e lansamento oficial di Plataforma Pashentnan
  di Aruba. Sr. mr.dr.Jayburtt Dijkhoff cu ta presidente di Fundacion SIKI a enfatisa
  cu esaki ta un evento historico pa Aruba. Ta trata di un plataforma unda cu tur
  pashent di Aruba por expresa nan preocupacion- y remarcanan pa asina contirbui na
  un mihor cuido medico. Fundacion SIKI ta un organisacion non-profit cu ta boga pa
  empodera e individuo y stimula cambio social positivo. E ta haci esaki a travez
  di curso, investigacion y avtividadnan cu ta trece cambionan constructivo den sociedad.
  Un tema di enfoke di e fundacion ta e derechonan di pashent. A publica un buki y
  a duna hopi charla gratis pa stimula esaki, pero a yega tempo pa bai pa e siguiente
  nivel. P''esey a yega na un plataforma di pashent. Aruba no ta cla ainda pa un asociacion
  of federacion, pero si ta cla pa participa y contribui den un forma liber y igual
  pa tur persona. E plataforma ta logra su funcion pa medio di 3 punto: 1) un vocero
  pa pashent, 2) un pataforma digital y 3) centralisa e organisacionnan di pashent.
  Sr. Dijkhoff a presenta e vocero di Plataforma Pashentnan di Aruba, kende ta sra.
  Nurianne Arias. Sra. Arias ta un docente den maneho adminstrativo na Universidad
  di Aruba, ta studiando pa su PhD, y ta un activista pa cuido di diabetes y pashentnan
  en general pa hopi a\u00f1a. E escohencia pa un profesional di e caliber aki no
  tabata dificil, specialmente mirando e pasion cu sra. Arias tin pa e pashent y su
  cuido. Sra. Arias lo fungi como e bos di e pashentnan di Aruba den cuadro di combersacion
  y dialogo cu entre otro ''Kwaliteitsraad'' di Gobierno y otro entidad di salud di
  Aruba. E Kwaliteitsraad ta un organo nobo den cual tur reglanan tecnico y consehonan
  importante tocante cuido di salud ta wordo formalisa. Awor e Plataforma Pashentnan
  di Aruba ta drenta e fase di sigui plama e noticia aki y encurasha tur hende pa
  join e grupo aki riba Facebook groups: Pashentnan di Aruba. Tambe lo bai planea
  pa invita tur e organisacionnan di pashent join un otro canal di e plataforma. Adicionalmente
  ta preparando pa acerca hendenan grandi cu no tin facebook pa join via un canal
  alternativo. Esaki lo wordo anuncia pronto.\\nORANJESTAD - Aruba Tourism Authority
  (A.T.A.) ta mira atras riba su participacion integral den e temporada di Carnaval
