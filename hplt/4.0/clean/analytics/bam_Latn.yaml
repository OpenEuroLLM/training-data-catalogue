  seli dumuni k\u025b. I \u0272\u025b b\u025b c\u025b min taat\u0254 la, o ye Juda
  Isikari\u0254ti ye. A taara a f\u0254 sarakalasebagaw ye, u b\u025b se ka Yesu min\u025b
  cogo min na.\\nTile kelen o don \u0272\u025b, Juda taara sarakalasebagaw f\u025b
  ka nin kuma f\u0254 u ye: \u2018Aw b\u025bna mun di ne ma, ni ne ye aw d\u025bm\u025b
  ka Yesu min\u025b?\u2019 U ko: \u2018Warij\u025b bisaba.\u2019 O kos\u0254n Juda
  b\u025b taa u f\u025b sisan walisa ka Yesu y\u0254r\u0254 jira u la. Yala o t\u025b
  kojuguba ye wa?\\nT\u025bm\u025bnkan seli dumuni k\u025bra kaban. Nka Yesu ye dumuni
  w\u025br\u025b ko sigi sen kan. O tun ye dumuni k\u025br\u025bnk\u025br\u025bnnen
  d\u0254 de ye. A ye nburukun d\u0254 ta ka a di a ka cidenw ma, k\u2019a f\u0254
  u ye ko: \u2018Aw ye nin dun bawo nin ye ne farikolo bisigi ye min b\u025bna di
  aw kos\u0254n.\u2019 A tilala ka jifilen d\u0254 ta, diw\u025bn tun b\u025b min
  k\u0254n\u0254, k\u2019o fana di u ma, k\u2019a f\u0254 ko: \u2018Aw ka nin min,
  bawo nin ye ne joli bisigi ye min b\u025bna b\u0254n aw kos\u0254n.\u2019 Bibulu
  b\u025b o dumuni wele ko \u2018Matigi ka fana\u2019\\nIsra\u025blkaw tun b\u025b
  T\u025bm\u025bnkan seli dumuni k\u025b walisa k\u2019u hakili jigin a la ko tuma
  min na Ala ka m\u025bl\u025bk\u025b \u2018t\u025bm\u025bna\u2019 olu ka sow kunna
  Misira, a ye Misirikaw ka du kelen-kelen b\u025b\u025b den f\u0254l\u0254 faga.
  Nka sisan, Yesu b\u2019a f\u025b a n\u0254f\u025bm\u0254g\u0254w hakili ka jigin
  ale la ani a ye a ka \u0272\u025bnamaya di u kos\u0254n cogo min na. O de y\u2019a
  to Yesu y\u2019a f\u0254 u ye ko u ka o dumuni k\u025br\u025bnk\u025br\u025bnnen
  ko k\u025b san o san.\\nU tilalen k\u0254 Matigi ka fana dumuni na, Yesu y\u2019a
  f\u0254 a ka cidenw ye ko u kana siran, u ka fanga s\u0254r\u0254 dannaya la. O
  k\u0254f\u025b, u ye d\u0254nkiliw da Ala ye ka b\u0254 ka taa. Su tun janfara kos\u025bb\u025b.
  A b\u025b i ko miniwi tun t\u025bm\u025bna kaban. An k\u2019a laj\u025b u taara
  y\u0254r\u0254 min na sisan.\\nMatiyu 26:14-30; Luka 22:1-39; Yuhana tilay\u0254r\u0254ba
  13nan ka n\u2019a bila 17nan na; 1 K\u0254r\u025bntekaw 11:20.\\n\u019dininkaliw\\n-
