  I ka Matiyu 26:14-30 kalan.\\nMatiyu 26:15 b\u2019a jira cogo di ko Juda y\u2019a
  dab\u0254 a kama ka Yesu janfa?\\nYesu joli b\u0254nni ye kuntilenna fila dafa.
