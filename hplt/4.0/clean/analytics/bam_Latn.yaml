  d\u0254w b\u025b se ka o baara teliya. Nin baara in nafa ka bon k\u025br\u025bnk\u025br\u025bnnenya
  la m\u0254g\u0254 minnu bolo, minnu mago b\u025b teliya la ka taa Vietnam, wa u
