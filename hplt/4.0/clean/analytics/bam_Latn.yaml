  \u0426i \u043faTp\u044d\u0431Ha kiTa\u0439ckiM Typ\u044bcTaM Bi\u0437a \u0434\u043b\u044f
  \u045ee\u0437\u0434y \u045e B\u2019eTHaM? Tak, kiTa\u0439cki\u044f Typ\u044bcT\u044b
  \u043faBiHH\u044b aTp\u044bMa\u0446b Bi\u0437y \u043fepa\u0434 a\u0434\u2019e\u0437\u0434aM
  y B\u2019eTHaM.\\nZergatik pentsatu behar dute Txinako turistek Vietnam bisitatzea?
  Vietnamek bidaia-esperientzia paregabea eta anitza eskaintzen du, ziur asko txinatar
  turisten bihotzak liluratuko dituena. Hona hemen Vietnam bere bidaia-zerrendaren
  buruan egon behar den arrazoi sinesgarri batzuk: Txinako turistek Sarrera Bisa bat
  behar al dute Vietnamera sartzeko? Bai, Txinako turistek visa bat lortu behar dute
  Vietnamera abiatu aurretik.\\n\u00c7inli turistl\u0259r niy\u0259 Vyetnama s\u0259f\u0259r
  etm\u0259yi d\u00fc\u015f\u00fcnm\u0259lidirl\u0259r? Vyetnam \u00e7inli turistl\u0259rin
  q\u0259lbini ovsunlayacaq unikal v\u0259 m\u00fcxt\u0259lif s\u0259yah\u0259t t\u0259cr\u00fcb\u0259si
  t\u0259klif edir. Vyetnam\u0131n s\u0259yah\u0259t paketl\u0259ri siyah\u0131s\u0131nda
  birinci yerd\u0259 olmas\u0131n\u0131n b\u0259zi inand\u0131r\u0131c\u0131 s\u0259b\u0259bl\u0259ri
  bunlard\u0131r: \u00c7inli turistl\u0259r Vyetnama daxil olmaq \u00fc\u00e7\u00fcn
  giri\u015f vizas\u0131 t\u0259l\u0259b edirl\u0259rmi? B\u0259li, \u00c7inli turistl\u0259rd\u0259n
  Vyetnama getm\u0259zd\u0259n \u0259vv\u0259l viza almas\u0131 t\u0259l\u0259b olunur.\"",
  "\"''''Air France\\\" y''a ka sanf\u025b taamaw j\u0254 f\u0254l\u0254 ni Mali jamana
  ye\\nA j\u025bns\u025bnna :\\nKaridon na farafinna tilebinyanfan jamanaw ye \u0272angili
  kologiriman caman ta ka Mali jamana s\u025bg\u025br\u025b. O \u0272angiliw c\u025bla
  sanf\u025b siraw b\u2019o la. Yala o siraw datuguli Mali \u0272\u025bn, o b\u025b
  mun de ti\u0272\u025b sanf\u025b tagama ni seginna Mali n\u2019o jamanaw c\u025b
  ?\\nC\u00e9d\u00e9ao jamanaw ka \u0272i b\u0254 Lagine na olu b\u025b\u025blaj\u025blen
  ka sanf\u025b siraw datugulen don Mali \u0272\u025bn. Ka fara o kan \\\"AIR France\\\"
  fana y\u2019a ka sanf\u025b siraw datugu arabadon. O k\u025bra sababu ye ka y\u025bl\u025bma
  caman don sanf\u025b taga ni ka segin na Mali n\u2019o jamana ninnu ni \u0272\u0254ng\u0254n
  c\u025b.\\nPankurun minnu b\u025b jigin Mali la, olu hak\u025byaw d\u0254g\u0254yalenba
  donnin wagati la. A b\u025b se kana ni k\u0254l\u0254l\u0254 jum\u025bnw de ye,
  an ka j\u025bn ka Issa Drago lam\u025bn ale ye Burkina cak\u025bda minnu b\u025b
  sanf\u025b dugutagalaw ka dugutagako \u0272anab\u0254 o \u0272\u025bm\u0254g\u0254
  ye.\"", "\"Don baara\\nbolodalenw k\u0254f\u025b, minisirilaj\u025b j\u025bnna ni
  :\\n- poroze\\nsariya d\u0254w ye ;\\n- ka m\u0254g\u0254\\nd\u0254w sugandi ka
  bila j\u0254y\u0254r\u0254 d\u0254w la ;\\n- ani ka\\nkuma\u0272\u0254g\u0254nya
  d\u0254w lam\u025bn.\\nSARIYAKOW\\nDAKUN NA\\n1. Basigi ni siwiliw lakananni minisiri
  ka\\nlaselis\u025bb\u025bn kunkan, minisirilaj\u025b j\u025bnna :\\na. ni dekere
  poroze d\u0254\\nye, min b\u025b bugunnatig\u025bs\u025bb\u025bn walima kariti biyometiriki
  fangabulonya ;\\nb. ni dekere poroze d\u0254 ye, min b\u025b faso t\u0254g\u0254la\\npasip\u0254ri
  fangabulonya.\\nWalasa ka se\\nka hadamadenw taa ka segin n\u0254g\u0254ya kannabila
  k\u0254n\u0254 Saheli kungo basigiko nasira\\nla, saheli kungo k\u0254nfederas\u0254n
  t\u0254ndenjamanaw jamanakuntigiw y\u2019a \u014baniya ka\\ndugutaas\u025bb\u025bnw
  ni bugunnatig\u025bs\u025bb\u025bnw k\u025br\u025bnk\u025br\u025bn, k\u2019u mab\u025bn
  AES k\u0254n\u0254.\\nKabini b\u025bn\\nk\u025bra u mab\u025bncogow kan Burukina
  Faso, Mali ani Niz\u025bri basigi minisiriw f\u025b\\nnowanburukalo tile 22 san
  2024 Bamak\u0254, saheli kungo jamanaw ka k\u0254nfederas\u0254n\\n\u0272\u025bm\u0254g\u0254ba
  ye dugutaas\u025bb\u025bn d\u0254 fagabulonya awirilikalo tile 18 san 2025, saheli\\nkungo
  jamanaw t\u0254g\u0254 la, min b\u025b wele \u00ab e-passeport\\nAES \u00bb ani
  saheli kungo k\u0254nfederas\u0254n jamanaw t\u0254g\u0254la bugunnatig\u025bs\u025bb\u025bn
  d\u0254, min\\nb\u025b wele \u00ab Carte d\u2019Identit\u00e9 biom\u00e9trique\\nAES
  \u00bb.\\nDugutaas\u025bb\u025bn\\nin ni bugunnatig\u025bs\u025bb\u025bn in dilanni
  ka k\u025b\u0272\u025b ni di\u0272\u025b siwiliko pankurunf\u025btaamako\\nhak\u025bw
  ye bugunnatig\u025bs\u025bb\u025bnkow ni dugutaas\u025bb\u025bnkow la.\\nDugutaas\u025bb\u025bnw\\nni
  bugunnatig\u025bs\u025bb\u025bnw cogoyaw mab\u025bnni b\u2019a to b\u025bnkans\u025bb\u025bn
  min b\u025bna k\u025b u ka se ka k\u025b AES t\u0254g\u0254 la, o b\u025b waleya
  ni\\npasip\u0254ri ani bugunnatig\u025bs\u025bb\u025bn dilanni ye, k\u2019u taamasiy\u025bnw
  k\u025b ka k\u025b\u0272\u025b ni AES\\nk\u0254nfederas\u0254n cogoya ye.\\nDekere\\nporoze
  ninnu, b\u025bn k\u025bra minnu kan, u b\u2019a to dugutaas\u025bb\u025bn ni bugunnatig\u025bs\u025bb\u025bn\\nbasigilenw
  ka s\u0254r\u0254 ka bila sigidalam\u0254g\u0254w ka bolo kan walasa ka se ka y\u025bl\u025bma\\n\u0272uman
  don k\u0254l\u0254sili ani hadamadenw taa ka segin cogoya la ani ka jigisigi k\u025b\\nm\u0254g\u0254w
  taa ka seginw na u kuntilennaw ka d\u0254n.\\n2. k\u0254kankow ni di\u0272\u025b\\nt\u0254nbaw
  c\u025b ko\u0272\u025bnab\u0254 minisiri ka laselis\u025bb\u025bn kunkan, minisirilaj\u025b
  j\u025bnna ni sariya\\nporoze d\u0254w ye juruko b\u025bnkans\u025bb\u025bn d\u0254
  kunkan, min bolon\u0254bilala Bamak\u0254 feburuyekalo\\ntile 20 san 2023, Mali
  g\u0254f\u025br\u025bnaman ni Afiriki yiriwali nafolo c\u025b, d\u0254 farali\\nkolog\u025bl\u025bya
  fanga kan baloko ni balocogo \u0272uman basigili la, o porogaramu dakun\\n2nan musakako
  la saheli kungo k\u0254n\u0254.\\nN\u2019o\\nb\u025bnkans\u025bb\u025bn in ye, Afiriki
  yiriwali nafolo b\u025bna u ka wari miliy\u0254n 25 juru don Mali\\ng\u0254f\u025br\u025bnaman
  na n\u2019o b\u025b b\u025bn sefawari miliyari 21 ani miliy\u0254n 340 ani ba 100
  ma.\\nPorogaramu\\nin waleyali , n\u2019o ye juru in takun ye, a b\u2019a to d\u0254
  ka se ka fara waati kuntaala\\njan k\u0254n\u0254, s\u025bn\u025b-jirituru-baganmara
  ani m\u0254nni s\u0254r\u0254 j\u0254l\u0254k\u0254 nafa kan saheli kungo\\nk\u0254n\u0254,
  ka d\u0254 fara d\u0254nniyaw kan m\u0254g\u0254w mab\u025bnni na ni waatiy\u025bl\u025bma
  faratikow\\nfaamuyacogo \u0272uman ye ani ka d\u025bm\u025bn don d\u0254 b\u0254li
  la waatiy\u025bl\u025bma k\u0254l\u0254l\u0254 jugu fanga\\nla.\\n3. Dugubaw j\u0254li,
  soko, dugukoloko, jamana\\ndugukolo lab\u025bnni ani jama minisiri ka laselis\u025bb\u025bn
  kunkan, minisirilaj\u025b j\u025bnna ni\\ndekere poroze d\u0254w ye dugukolo d\u0254w
