  musaka kan san 2026 kama ;\\n- ka j\u025bn ni\\nbaara s\u0254r\u0254 n\u2019a musaka
  latilennen ye dakun V la ;\\n- ka dusu\\ndon t\u0254ndenjamanaw k\u0254n\u0254,
  u ka d\u025bm\u025bn don cak\u025bda dakun V baara k\u025btaw musako la ;\\n- ka\\nkuntilennadij\u025bkulu
  \u0272\u025bm\u0254g\u0254ya di Mali ma san 2 sarati kuntaala k\u0254n\u0254, k\u2019o
  damin\u025b\\nzuw\u025bnkalo tile 26 san 2025 la.\\nMali\\nsugandira fana ka k\u025b
  di\u0272\u025b wariko kalany\u0254r\u0254 Afiriki tilebinyanfan t\u0254g\u0254 la,
  o\\nkuntilennadij\u025bkulu \u0272\u025bm\u0254g\u0254 ye san kelen kuntaala kama.\\n3.
  Dugujuk\u0254r\u0254f\u025bnko\\nminisiri ye minisirilaj\u025b lad\u0254nniya Liputako-Guruma
  jamanakuntigiw\\nani/minisiri\u0272\u025bm\u0254g\u0254w ka laadalat\u0254nsigi
  8nan yiriwaliko la, o k\u025bli la wiziyo-k\u0254nferansi\\nf\u025b zuluyekalo tile
  11 san 2025.\\nLiputako-Guruma\\njamanaw ka j\u025bkulu yiriwaliko la, o la\u0272inin
  ye ka yiriwali ani basigi mab\u025bnnen \u0272\u025btaa\\nsabati ni dugujuk\u0254r\u0254f\u025bnw,
  kuranko, jiko ani baganmara ni m\u0254nni donni ye ba la\\nt\u0254ndenjamana saba
  ninnu k\u0254n\u0254.\\nZenerali\\ndarim\u025b Abudurahamani Tiyani Niz\u025bri
  jamanakuntigi ni Liputako-Guruma j\u025bkulu\\n\u0272\u025bm\u0254g\u0254 fana don,
  Zenerali darim\u025b Asimi Goyita ni saheli kungo jamanaw ka\\nk\u0254nfederas\u0254n
  \u0272\u025bm\u0254g\u0254 fana don ani Kapit\u025bni Ibarahimu Tarawele Burukina
  Faso\\njamanakuntigi, olu ye laj\u025bba 8nan in k\u025b.\\nA don laj\u025b\\nbaara
  bolodalenw tun ye k\u025br\u025bnk\u025br\u025bnnenya la, Liputako-Guruma j\u025bkulu
  yiriwali\\nkama, o k\u025bli AES k\u0254nfederas\u0254n fangabulon d\u0254 ye.\\nJamanakuntigiw\\nka
  laj\u025bba, a k\u025blen k\u0254 ka kow cogoya d\u0254n yiriwali kunkan Liputako-Guruma
  k\u0254n\u0254 o\\nseereyas\u025bb\u025bnw f\u025b, ani minisirilaj\u025b 13nan
  min k\u025bra Bamak\u0254 m\u025bkalo tile 24 san 2025, a ye b\u025bnkan nafama
  caman ta, k\u025br\u025bnk\u025br\u025bnnenya\\nla :\\n- Liputako-Guruma\\nj\u025bkulu
  y\u025bl\u025bmani ka k\u025b yiriwali porozew n\u2019a porogaramuw waleyali cak\u025bda
  ye ka\\nk\u025b\u0272\u025b n\u2019a kuntilennaw ye ani k\u0254nfederas\u0254n minisirilaj\u025b
  ka \u0272\u025bm\u0254g\u0254ya k\u0254n\u0254 ;\\n- Liputako-Guruma\\nj\u025bkulu
  yiriwaliko la, o s\u025bg\u025bs\u025bg\u025bli ;\\n- waatilat\u025bm\u025bn\\nmara\u0272\u025bm\u0254g\u0254
  d\u0254 sugandili kalo 6 sarati kuntaala kama, min b\u2019o bay\u025bl\u025bmani
  in\\nk\u025b minisirilaj\u025b ka \u0272\u025bm\u0254g\u0254ya k\u0254n\u0254.\\nLaj\u025bba
  senf\u025b,\\nfuranc\u025blafanga jamanakuntigi y\u2019a jira ko Liputako-Guruma
  j\u025bkulu yiriwali kama,\\no bay\u025bl\u025bmani ka k\u025b yiriwali porozew
  n\u2019a porogaramuw waleyali cak\u025bda ye, o b\u2019a\\nto saheli kungo jamanaw
  ka k\u0254nfederas\u0254n ka se ka a lab\u025bncogo, a musakako ani\\nporozew ni
  porogaramuw waleyacogo k\u0254l\u0254si k\u0254nfederas\u0254n k\u0254n\u0254.\\n4.
  K\u025bn\u025byako ni hadamadenya\\nyiriwali minisiri ye minisirilaj\u025b lad\u0254nniya
  banako cogoya la an ka jamana k\u0254n\u0254,\\nk\u025br\u025bnk\u025br\u025bnnenya
  la, f\u025bn ma fara sumayaba bana ka m\u0254g\u0254 min\u025bnen hak\u025b kan
  ka sanga\\nni a d\u0254g\u0254kun t\u025bm\u025bnnen in cogoya ye.\\nFuranc\u025blafanga\\njamanakuntigi
  b\u2019a \u0272inin sigidalam\u0254g\u0254w f\u025b, u ka y\u025br\u025btanga ani
  banaw kunb\u025bnni\\nf\u025b\u025br\u025bw matarafa.\\nBamak\u0254, zuluyekalo\\ntile
