  si di \u0272inini k\u025bcogo b\u025b\u025b la.\\nNi i ye g\u0254f\u025br\u025bnaman
  ka siti sugandi, i b\u025bna se ka i ka visa \u0272inini kuntigiya dafalen s\u0254r\u0254.
