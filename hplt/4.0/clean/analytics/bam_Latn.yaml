  turisiw b\u025b se ka f\u025b\u025br\u025b fila s\u0254r\u0254 walasa ka visa s\u0254r\u0254:
  ka \u0272inini k\u025b g\u0254f\u025br\u025bnaman ka siti kan walima ka d\u025bm\u025b
