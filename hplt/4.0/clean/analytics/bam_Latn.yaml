  j\u025bnna, kabini an ka\\njamana ka y\u025br\u025bta san f\u0254l\u0254w la, ni
  sariya n\u00b062-67/AN-RM min tara utikalo tile 09\\nsan 1962, baarako taabolo kan
  Mali k\u0254n\u0254 ani sariya n\u00b062-68/AN-RM min tara\\nutikalo tile 09 san
  1962, hadamadenya sini\u0272\u025bsigi kan Mali k\u0254n\u0254.\\nO sariya\\nninnu
  waleyali y\u2019a to d\u0254 ka se ka b\u0254 baara kasaaraw fanga la ani banaw
  baaraw\\nf\u025b, ani ka y\u025bl\u025bma \u0272uman don o kow tali la ba la. O
  siratig\u025b la, sababu caman, i\\nn\u2019a f\u0254 f\u025b\u025br\u025b kuraw
  \u0272\u025btaa, olu ye y\u025bl\u025bma don baara k\u025bcogo la di\u0272\u025b
  k\u0254n\u0254\\nd\u0254\u0254nin-d\u0254\u0254nin ni n\u0254g\u0254ya donni ye
  farati kuraw wulili la, ka k\u0254r\u0254lenw to u cogo\\nla.\\nWalasa ka se\\nka
  d\u0254 fara baara farati kuraw \u0272\u025bsigili fanga kan ani ka y\u025bl\u025bma
  \u0272uman don\\nbaarak\u025blaw lakananni sariyako cogoya la, g\u0254f\u025br\u025bnaman
