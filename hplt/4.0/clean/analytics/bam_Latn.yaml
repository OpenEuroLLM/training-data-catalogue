  si s\u0254r\u0254 miniti laban na.\\nA nafa ka bon fana k\u2019a d\u0254n ko Vietnam
  jamana ka b\u0254n\u0254g\u0254la, i ka visa \u0272inini b\u025b k\u025b y\u0254r\u0254
  min na, o t\u025b baara k\u025b sibiridonw, dimansiladonw na, Vietnam jamanadenw
  ka foroba lakanabagaw ka laadala donw na (Awirilikalo tile 19), ani jamana seliw.
  O k\u0254r\u0254 ye ko ni i ka visa \u0272inini binna nin don ninnu d\u0254 la kelen
  na, baara waati b\u025bna janya ka k\u025b\u0272\u025b ni o ye.\\nNi i b\u2019i
  ka taama boloda Vietnam, a nafa ka bon i k\u2019i janto jamana ka seliw la walasa
  ka i y\u025br\u025b tanga g\u025bl\u025bya si ma i ka sigi waati la. Jamana seli
  minnu b\u025b k\u025b Vietnam jamana na, olu fil\u025b nin ye, Sinuwa turisiw ka
  kan ka minnu d\u0254n:\\nO jamana seliw waatiw la, a nafa ka bon k\u2019i ka taama
  boloda ka k\u025b\u0272\u025b n\u2019o ye, bawo jagok\u025by\u0254r\u0254 d\u0254w
  ni turisiw ka y\u0254r\u0254 d\u0254w b\u025b se ka datugu walima ka baarak\u025bwaati
  danmad\u0254w s\u0254r\u0254. A ka \u0272i ka laj\u025b k\u025b ni baarak\u025bda
  t\u0254g\u0254ba d\u0254 ye min k\u025br\u025bnk\u025br\u025bnnen don Vietnam taamako
  la walasa ka kunnafoni kuraw ni d\u025bm\u025b s\u0254r\u0254.\\nTuma d\u0254w la,
  ko d\u0254w b\u025b se k\u2019a \u0272ini i f\u025b i ka visa s\u0254r\u0254 joona
  ka taa Vietnam. A k\u025bra jago taama ye miniti laban na wo, a k\u025bra lafi\u0272\u025bb\u0254
  lab\u025bn ye wo, sugandiliw b\u025b yen Sinuwa turisiw f\u025b walasa k\u2019u
  ka visa s\u0254r\u0254 joona. A k\u025bcogo fil\u025b nin ye:\\nSani i ka taama
  damin\u025b Vietnam, s\u025bb\u025bn nafama damad\u0254w ni kunnafoni d\u0254w b\u025b
  yen, Sinuwa turisiw ka kan ka minnu lab\u025bn u ka Vietnam e-visa \u0272inini kama:\\nWalasa
  ka Vietnam visa \u0272ini ka \u0272\u025b \u025bnt\u025brin\u025bti kan, Sinuwa
  turisiw ka kan ka s\u025bb\u025bn nafama fila bila a kan:\\nSinuwa turisiw ka kan
  k\u2019u ka pasip\u0254ri kunnafonidilan \u0272\u025b min s\u025bg\u025bs\u025bg\u025bra.
  Nin s\u025bb\u025bn in nafa ka bon kos\u025bb\u025b bawo a b\u025b d\u025bm\u025b
  ka kunnafoniw s\u025bg\u025bs\u025bg\u025b minnu b\u025b s\u0254r\u0254 visa \u0272inini
  s\u025bb\u025bn k\u0254n\u0254. Walasa ka \u0272inini k\u025bcogo \u0272\u025b,
  Sinuwa turisiw ka kan k\u2019a laj\u025b ko s\u025bb\u025bn min s\u025bg\u025bs\u025bg\u025bra,
  o b\u025b se ka kalan, ko a j\u025blen don, wa ko \u0272\u025b b\u025b\u025b b\u025b
  a k\u0254n\u0254. A ka kan fana ka pasip\u0254ritigi ka foto jira, a y\u025br\u025b
  ka kunnafoniw, ani OACI ka layiniw.\\nF\u025bn minnu ka kan ka k\u025b walasa ka
  Pasip\u0254ri kunnafoniw \u0272\u025b kopi skanlen s\u0254r\u0254:\\nWalasa ka pasip\u0254ri
  kunnafonidilan \u0272\u025b skanlen kopi wajibiyalenw dafa, Sinuwa turisiw ka kan
  k\u2019a laj\u025b ko nin kunnafoni ninnu b\u025b ye ka j\u025bya:\\nSinuwa turisiw
  fana ka kan ka ja d\u0254 bila k\u0254sa in na walima foto min bonya b\u025b se
  pasip\u0254ri ma (4x6cm). Nin foto in b\u025b k\u025b f\u025b\u025br\u025b ye walasa
  ka \u0272ininik\u025bla ka m\u0254g\u0254ya s\u025bg\u025bs\u025bg\u025b, k\u2019a
  laj\u025b ko foto b\u025b b\u025bn m\u0254g\u0254 ma min b\u025b pasip\u0254ri k\u0254n\u0254.\\nPortrait
  Photo wajibiyalenw Sinuwa turisiw f\u025b:\\nSinuwa turisiw ka kan ka nin sariya
  ninnu labato ja foto in kama:\\nSisan, i k\u025blen k\u0254 ka \u0272ininiw d\u0254n
  minnu ka kan, an k\u2019an y\u025br\u025b fili Vietnam e-visa \u0272inini taabolo
  la senf\u025b-senf\u025b \u025bnt\u025brin\u025bti kan:\\nVietnam visa \u0272inini
  s\u025bb\u025bn dilen k\u0254f\u025b \u025bnt\u025brin\u025bti kan, Sinuwa turisiw
  b\u025b se k\u2019u ka e-visa cogoya laj\u025b ni nin f\u025b\u025br\u025b ninnu
  ye:\\nNi u b\u025b Vietnam visa \u0272ini \u025bnt\u025brin\u025bti kan, a nafa
  ka bon Sinuwa turisiw k\u2019a faamu ko \u0272inini b\u025b\u025b t\u025b s\u0254n.
  Gof\u025br\u025bnaman ka baarak\u025blaw b\u2019u y\u025br\u025b ka sariyaw ni sariyaw
  sigi senkan walasa ka \u0272inini kelen-kelen b\u025b\u025b jatemin\u025b. Nka,
  f\u025b\u025br\u025b d\u0254w b\u025b yen i b\u025b se ka minnu tig\u025b walasa
  ka i ka s\u0254nni k\u025bcogo \u0272\u025b. F\u025bn minnu ka kan ka k\u025b, olu
  lis\u025bli fil\u025b nin ye:\\nSinuwa turisiw f\u025b minnu b\u2019a f\u025b ka
  visa s\u0254nni k\u025bcogo g\u025bl\u025bya, g\u025bl\u025bya t\u025b min na, o
  de ka \u0272i kos\u025bb\u025b ka baarada d\u0254 ta. O baarada ninnu b\u025b nafa
  caman di minnu b\u2019a to u ka kiliyanw ka se ka baara k\u025b cogo la min t\u025b
  f\u025bn ti\u0272\u025b:\\nKa fara o kan, baarada minnu t\u0254g\u0254 ka di, olu
  b\u025b nafa w\u025br\u025b di, n\u2019o ye ka visa teliya baara k\u025b. Ni k\u0254r\u0254t\u0254ko
  don, u b\u025b se k\u2019i ka visa teliya o don kelen na, sanga 4 k\u0254n\u0254,
  walima hali sanga 2 k\u0254n\u0254. O b\u2019a to i b\u025b se k\u2019i ka visa
  s\u0254r\u0254 waati b\u025bnnen na, hali n\u2019i ka waati ka surun.\\nNi i ye
  i ka visa s\u0254nni s\u0254r\u0254 ka taa Vietnam, a nafa ka bon i ka kunnafoni
  b\u025b\u025b laj\u025b si\u0272\u025b fila walasa ka a d\u0254n ko fili walima
  fili si t\u025b yen. O b\u025bna aw d\u025bm\u025b ka g\u025bl\u025bya si s\u0254r\u0254
  aw selen. Nin ye s\u025bg\u025bs\u025bg\u025bli s\u025bb\u025bn ye min b\u025b se
  ka k\u025b Sinuwa turisiw bolo u ka visa s\u0254nni s\u0254r\u0254len k\u0254f\u025b:\\nNi
  i tugura nin s\u025bg\u025bs\u025bg\u025bli s\u025bb\u025bn in k\u0254, i b\u025b
  se ka k\u025b sababu ye ka ko k\u025blenw k\u025b cogo n\u0254g\u0254man na ani
  g\u025bl\u025bya t\u025b min na, k\u2019a s\u0254r\u0254 i b\u025b Vietnam jamana
  c\u025b\u0272i laj\u025b.\\nVietnam e-visa \u0272inini b\u025b se ka k\u025b wale
  duman ye Sinuwa turisiw bolo minnu b\u2019a f\u025b ka taa nin jamana c\u025b\u0272i
  in na. Nka, tuma d\u0254w la, mago b\u025b k\u025b ka f\u025bn d\u0254w Changer
  walima ka f\u025bn d\u0254w s\u025bm\u025bntiya e-visa \u0272inini na. O cogo la,
  a b\u025b se ka g\u025bl\u025bya ka d\u025bm\u025b wajibiyalen s\u0254r\u0254 ka
  b\u0254 g\u0254f\u025br\u025bnaman ka siti kan. Walasa ka Sinuwa turisiw d\u025bm\u025b
  minnu b\u025b nin ko ninnu kunb\u025bn, an ye \u0272ininkali minnu k\u025bra sanf\u025b,
  an ye olu lis\u025bli lab\u025bn, ka ladilikanw di d\u025bm\u025b s\u0254r\u0254li
  kama.\\nI n\u2019a f\u0254 Sinuwa turisi, a b\u025b se ka k\u025b f\u025bn ye min
  b\u025b m\u0254g\u0254 dusu ti\u0272\u025b k\u2019a ye ko i ka Vietnam e-visa b\u025b
  baara la hali bi k\u2019a s\u0254r\u0254 i b\u0254li don b\u025b ka surunya. O cogo
  la, a ka \u0272i ka d\u025bm\u025b \u0272ini baarak\u025bda d\u0254 f\u025b min
  t\u0254g\u0254 ka di, walima ka kuma im\u025bri lad\u025br\u025bsi la min t\u0254g\u0254
  ye ko info@vietnamimmigration.org. U b\u025b se ka bilasirali k\u025b o baara teliyacogo
  kan ani k\u2019a laj\u025b ko i ka e-visa lab\u025bnnen don a waati la i ka pankurun
  boli kama. Aw k\u2019a k\u0254l\u0254si ko wari d\u0254 b\u025b se ka b\u0254 o
  baara in na.\\nMisaliw b\u025b k\u025b, wa ni i ye kunnafoni ti\u0272\u025bnenw
  di i ka e-visa \u0272inini kan, o b\u025b se ka k\u025b haminanko ye. N\u2019i ye
  Sinuwa turisi ye min ye fili k\u025b i ka e-visa \u0272inini na, a nafa ka bon i
  ka ko in \u0272\u025bnab\u0254 joona. Walasa ka kunnafoniw latilen, an b\u2019a
  \u0272ini i f\u025b i ka kuma baarak\u025bda d\u0254 f\u025b min t\u0254g\u0254
  ka di walima i ka i bolo digi info@vietnamimmigration.org kan walasa ka d\u025bm\u025b
  s\u0254r\u0254. U b\u025b se k\u2019i bilasira f\u025b\u025br\u025bw la minnu ka
  kan walasa k\u2019i ka \u0272inini s\u025bb\u025bn ladilan.\\nTuma d\u0254w la,
  i ka e-visa \u0272inini s\u025bb\u025bn dilen k\u0254f\u025b, i b\u025b se k\u2019a
  ye ko i ka kan ka f\u025bn d\u0254w s\u025bm\u025bntiya walima ka f\u025bn kuraw
  k\u025b. I n\u2019a f\u0254 Sinuwa turisi, i b\u025b se k\u2019i y\u025br\u025b
  \u0272ininka ni f\u025b\u025br\u025b b\u025b yen k\u2019i ka application (application)
  s\u025bm\u025bntiya. O cogo la, a ka \u0272i i ka d\u025bm\u025b \u0272ini baarak\u025bda
  t\u0254g\u0254ba d\u0254 f\u025b walima ka bataki ci info@vietnamimmigration.org
  walasa ka d\u025bm\u025b \u0272ini i ka e-visa \u0272inini s\u025bb\u025bn ladilanni
  na. U b\u025b se ka bilasirali wajibiyalenw di i ma ani ka d\u025bm\u025b don walasa
  i ka \u0272inini s\u025bb\u025bn b\u025b kunnafoni \u0272umanw jira.\\nLab\u025bnw
  b\u025b se ka Chang\u00e9, wa i n\u2019a f\u0254 Sinuwa turisi, i b\u025b se k\u2019a
  ye ko i sera Vietnam ka k\u0254n don \u0272\u025b min f\u0254ra i ka e-visa s\u025bb\u025bn
  kan. Ni aw mago b\u025b ka nali don Changer, an b\u2019a \u0272ini aw f\u025b aw
  ka kuma baarak\u025bda d\u0254 f\u025b min t\u0254g\u0254 ka di walima ka aw bolo
  digi info@vietnamimmigration.org kan walasa ka d\u025bm\u025b s\u0254r\u0254. U
  b\u025b se k\u2019i bilasira i ka nadon don s\u025bm\u025bntiyacogo la i ka e-visa
  kan, walasa ka doncogo \u0272uman sabati Vietnam jamana k\u0254n\u0254.\\nA man
  teli ka k\u025b ko taama bolodalenw b\u025b Chang\u00e9, wa i n\u2019a f\u0254 Sinuwa
  turisi, i b\u025b se k\u2019a ye ko i b\u025b don Vietnam ka t\u025bm\u025b kurunbonkariy\u0254r\u0254
  w\u025br\u025b f\u025b ka t\u025bm\u025b kurunbonkarila kan min kof\u0254len b\u025b
  i ka e-visa s\u025bb\u025bn kan. O cogo la, an b\u2019a \u0272ini aw f\u025b aw
  ka d\u025bm\u025b \u0272ini baarak\u025bda t\u0254g\u0254ba d\u0254 f\u025b walima
  ka kuma info@vietnamimmigration.org f\u025b walasa ka dondaw latilen. U b\u025b
  se ka bilasirali wajibiyalenw di aw ma walasa ka don Vietnam jamana k\u0254n\u0254,
  g\u025bl\u025bya t\u025b min na.\\nN\u2019i ye Sinuwa turisi ye min ka kan ka kunnafoniw
  s\u025bm\u025bntiya i ka e-visa \u0272inini s\u025bb\u025bn dilen k\u0254f\u025b
  g\u0254f\u025br\u025bnaman ka siti kan, a b\u025b se ka k\u025b g\u025bl\u025bya
  ye ka d\u025bm\u025b wajibiyalen s\u0254r\u0254. O cogo la, an b\u2019a \u0272ini
  aw f\u025b aw ka taa baarak\u025bda t\u0254g\u0254ba d\u0254 la walima ka taa info@vietnamimmigration.org
  f\u025b walasa ka d\u025bm\u025b s\u0254r\u0254. U b\u025b se ka bilasirali wajibiyalenw
  di i ma ani k\u2019i d\u025bm\u025b ka i ka e-visa \u0272inini ladilancogo \u0272\u025bnab\u0254.\\nVietnam
  visa s\u0254r\u0254li \u025bnt\u025brin\u025bti kan Sinuwa turisiw ye o man kan
  ka k\u025b ko g\u025bl\u025bn ye. Ni i ye laadilikanw labato minnu f\u0254ra sanf\u025b
  ani ka d\u025bm\u025b \u0272ini baaradaw f\u025b minnu b\u025b se ka da i kan, i
  b\u025b se ka d\u0254 fara i ka visa \u0272inini \u0272\u025btaa hak\u025b kan kos\u025bb\u025b.
  U ka d\u0254nniya, baarak\u025bmin\u025bn minnu b\u025b se ka baara k\u025b ni u
  ye, ani baara teliyalenw f\u025b, baaradaw b\u025b a to ko g\u025bl\u025bya t\u025b
  u la, ka s\u0254nni garanti, ani ka visa di waati b\u025bnnen na. O la sa, i ka
  taama boloda Vietnam ni da\u014baniya ye, k\u2019a d\u0254n ko i ka visa \u0272inini
  b\u025b bolo \u0272umanw na.\\nN\u0254ti:\\nI n\u2019a f\u0254 Sinuwa turisi min
  b\u025b Vietnam e-visa \u0272ini g\u0254f\u025br\u025bnaman ka siti kan, a nafa
  ka bon i k\u2019a d\u0254n i b\u025b se ka d\u025bm\u025b \u0272ini y\u0254r\u0254
  min na n\u2019i b\u025b g\u025bl\u025byaw s\u0254r\u0254 walima n\u2019i mago b\u025b
  ka f\u025bn d\u0254w Changer i ka \u0272inini na. Ni i ye i bolo da baarak\u025bda
  t\u0254g\u0254ba d\u0254 kan walima ka kuma info@vietnamimmigration.org f\u025b,
  i b\u025b se ka d\u025bm\u025b s\u0254r\u0254 i mago b\u025b min na walasa ka taama
  k\u025bcogo \u0272uman ni degun t\u025b min na. Aw k\u2019a k\u0254l\u0254si ko
  wari b\u025b se ka b\u0254 aw ka \u0272inini \u0272\u025bnab\u0254li la. Aw hakili
  to a la ko ni d\u025bm\u025b \u0272uman dira aw ma, aw b\u025b se ka nafa caman
  s\u0254r\u0254 aw ka Vietnam e-visa la ani ka kabako b\u025b\u025b diyab\u0254 nin
  jamana in b\u025b se ka minnu di.\\n\u0427aMy kiTa\u0439ckiM Typ\u044bcTaM BapTa
  pa\u0437r\u043be\u0434\u0437e\u0446b Mar\u0447\u044bMac\u0446b HaBe\u0434a\u0446b
  B\u2019eTHaM? B\u2019eTHaM \u043fpa\u043faHye yHika\u043bbH\u044b i pa\u0437HacTa\u0439H\u044b
  Bo\u043f\u044bT \u043fa\u0434apo\u0436\u0436a\u045e, \u044fki, HecyMHeHHa, \u043fakapae
  c\u044dp\u0446\u044b kiTa\u0439ckix Typ\u044bcTa\u045e. Bocb Heka\u043bbki \u043fepakaHa\u045e\u0447\u044bx
  \u043fp\u044b\u0447\u044bH, \u0447aMy B\u2019eTHaM \u043faBiHeH \u0431\u044b\u0446b
