  p\u0254sitikow ma, o j\u025bkulu\\nm\u0254g\u0254 Mali la : Isiyaka ALIHABIBU, sariyakow
  d\u0254nbaa \u014bana.\\nKUMA\u019d\u0186G\u0186NYAW\\nDAKUN NA\\n1. Baarako, g\u0254f\u025br\u025bnaman
  baara ani\\nhadamadenya f\u0254kab\u025bn minisiri ka laselis\u025bb\u025bn kunkan,
