  fiy\u025bw : Kayi ta m231,98 ; Sikaso ta m278,48 ; Segu ta m211,49 ; Tumutu ta m244,54
  ;\\nGawo ta hm21 ani m217,99. Cak\u025bda min b\u025b wele tubabukan na\\n\u025bnsititi
  pedagoziki di Mali, o b\u025b k\u025bn\u025b ninnu kan.\\nM\u0186G\u0186 D\u0186W\\nSUGANDILI
  KA BILA J\u0186Y\u0186R\u0186 D\u0186W LA\\nMinisirilaj\u025b\\nye nin m\u0254g\u0254
  ninnu sugandi ka bila j\u0254y\u0254r\u0254 d\u0254w la :\\nKUNNAFONI,\\nNUMERIKI
