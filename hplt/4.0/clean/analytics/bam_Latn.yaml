  ka taa lasigidensow walima lasigidensow la.\\nVietnam visa min b\u025b s\u0254r\u0254
  \u025bnt\u025brin\u025bti kan, n\u2019a b\u025b f\u0254 fana ko Vietnam e-Visa,
