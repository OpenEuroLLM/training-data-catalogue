  k\u025b \u025bnt\u025brin\u025bti kan, ani minnu b\u025b visa wajibiyalenw faamuya
  ka \u0272\u025b.\\nFaan w\u025br\u025b f\u025b, baarada t\u0254g\u0254ba d\u0254w
  k\u025br\u025bnk\u025br\u025bnnen don visa \u0272ininiw \u0272\u025bnab\u0254li
  la Sinuwa turisiw t\u0254g\u0254 la. U b\u025b wari caman \u0272ini nka u b\u025b
  d\u025bm\u025b ni bilasirali nafamaw di o baara b\u025b\u025b k\u0254n\u0254. Ni
