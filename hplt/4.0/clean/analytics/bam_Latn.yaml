  sinsinna o kan. Jaabili la, Kolon\u025bli-maz\u0254ri Amadu\\nMakan Sidibe y\u2019a
  jira k\u2019o ye ti\u0272\u025b ye. \u00abO la, munna e ye min\u025bn\u0272inins\u025bb\u025bn\\nbolon\u0254bila
  o kan ?\u00bb, K\u0254k\u025b Kulubali y\u2019o \u0272ininkali k\u2019a la.\\nWariko
  ni min\u025bnko \u0272\u025bm\u0254g\u0254ba k\u0254r\u0254 in ko wari sarali yamaruya
