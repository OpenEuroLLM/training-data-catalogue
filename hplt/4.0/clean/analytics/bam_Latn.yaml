  ye? A b\u025b ta mun k\u025b?\\n- T\u025bm\u025bnkan dumuni seli k\u025bra kaban
  tuma min na, Yesu ye dumuni k\u025br\u025bnk\u025br\u025bnnen jum\u025bn ko sigi?\\n-
