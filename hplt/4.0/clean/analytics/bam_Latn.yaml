  b\u025b k\u025b Sinuwa turisiw ye, o ye nin ye:\\nA nafa ka bon k\u2019a d\u0254n
  ko nin sara ninnu b\u025b se ka Chang\u00e9, o la a ka \u0272i i ka sisan hak\u025bw
  s\u025bg\u025bs\u025bg\u025b sani i k\u2019i ka s\u025bb\u025bn di. Ka fara o kan,
