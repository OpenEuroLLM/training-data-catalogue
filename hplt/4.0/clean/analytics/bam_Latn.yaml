  den af\u0254, ni k\u025bna n\u2019i k\u0254n, i mo k\u025b\u025b ka g\u025bn na
  b\u0254k\u0254 ka.\"", "\"EDITORIAL\\nTitle: U.S. Suspends Central American Asylum
  Agreements\\nDATE: 02/16/2021\\nNi ye lameriki fanga ka hakilinaw ye ka a lasse
  aw ma.\\nLameriki djamana ye danssigui ke danatigueli la, ka tila ka, fitine sababou
  be mogow mounou force ka ou ka djamana bila kata sigui djamana were konow tounga
  la, ne a be wele nanzara kan na, ko asile, siraw dayelen, ben kan ne baragniongonya
  toumbe ou ni djamanaw mounou tchiewla la: Salvator, Guatemala, ani Honduras, min
  bena ke barakegniongon siraw folow ye, ou ni djamanaw kofolenw tchiew la ou ka siguidaw
  konow, ne a lagnini kera president Joe Biden fe.\\nLamriki ni Guatemala djamana
  ye bolonow bila ke ben kan gafe min na la, san bafila ni tani kononton watila, kera
  sababou ye Lameriki ka Salvador a ni Honduras djamanaw denw bolilen fitine gniew
  kata tounka lagniniw ke, ne ou ye Lameriki djamana kokodougou dantchiew tigue bila
  kata ou gniamadogow folo Guatemala djamana kan. Lameriki djamanw tila bolonow bila
  ke o ben kan gniongon naw la ou ni Salvator ni Honduras fene tchiew la, nga masse
  ka la waleya.\\nFevrier kalo tile fila gafe ka layini belebele ye de, ka, koun kelen
  min be mogow bila tounka la taw la, kele ka o ban, ne djamanaw nounou ka bara ke
  ben kan seben, kan kelen ye, yassa ka tounkan lataw diatew bow, ne ka Lameriki ngou
  kan kokodougou, ne a tchiamantchiew yan fanw marayoro djamanaw konow, tounka tama
  ani ka a tounka la ta denw ka lagniniw la time lameriki ngoun kan marayoro djamanaw
  dantchiew la ne hakilimaya ye.\\nKa nogow bow a la, Ministri Antony Blinken ka fow
  la kounafoni seben kono, ni tabolo te waleyaw ye mounou be a yira kafow ko Lameriki
  dantchiew dayelen ne dow. Hakadja an danatiguelen donw ka sharia sen mounou be lakana
  ko gniouman ni yamarouyaw kouraw finssin ka ou dayelen Ameriki marayorow ngoun kan,
  Etats Unis ye Djamana ye, dantchiew ni sharia be min bolo, ne ou ka kan ka lawaleya,
  ka a labato. A ye a fara a kan: \u201cAn be lahidou di ka haquew la kegnie ani ka
  mine ko gniouman di mogow o mogow be mine an nga djamanaw datchiew la ma. Nga mounou
  be fe ka danssago ka an nga dantchiew diagoya sagon, be ou yere ni ou ka dembayaw
  bila gueleya baw de konow.\u201d\\nBiden ka fanga ka diatew la, moyen werew be mounou
  be baragniongonya nogoya ou ni ou djiegniongon djamana fanga tchiewla yassa ka tounka
  la ta baraw lateme kogniouman, ou ka marayoro konow. etat unis be sinsin o baragniongonya
  siraw kan ka demin lasse ke o djamana fangaw ma, yassa ka diagoya tounga la taw
  kele kassoro ou ma don ni guelen da ou nkoun kan, komi yere be coronavirus kelili
  lagniniw. \u00ab kada an nga djiegnionya ketchiogow kan, Ministri Blinken ka fow
  la, an ka demin min be ou ka baraw sinsin be tow sen na, o dow be ke ni djinye bangniouman
  ke ton baw ka baraw sinsinli ye\u201d.\\nEtats-Unis djamana dananatiguelen donw
  ka kele ke ka diagoya tounka lata, ani tounka ngassang, ni youroukou-youroukou o
  ban. Ni beladjielen be lateme ni tounkan la denw force lenw ka haquew bognia ye.
  Lameriki djamana danatiguelen donw fene ka ba donw ou ni ou djiegniongon djamanaw
  ka bara siraw bowlen korow la, yassa ka ou ka marayorow ngoun kan fasso djama mogow
  ka haquew la sabati li ko gniouman waleya.\\nNi toun ye Lameriki Djamana ka fanga
  ka hakilinaw ye.\"", "\"E KA denmis\u025bn laj\u025b min b\u025b ka kuma c\u025bk\u0254r\u0254baw
  f\u025b. C\u025bk\u0254r\u0254ba ninnu ye karam\u0254g\u0254w ye Alabatoso k\u0254n\u0254
  Jerusal\u025bm. C\u025bnin ye Yesu de ye. Sisan a si ye san 12 ye.\\nKaram\u0254g\u0254w
  kabakoyara kos\u025bb\u025b k\u2019a ye ko Yesu b\u025b f\u025bn caman d\u0254n
  Ala ko la, ani f\u025bnw kan minnu s\u025bb\u025bnnen b\u025b Bibulu k\u0254n\u0254.
  Nka, mun na Yusufu ni Mariyama t\u025b yan? Olu b\u025b min? An ka o jaabiw \u0272ini
  \u0272\u0254g\u0254n f\u025b.\\nSan o san, Yusufu b\u025b taa ni a ka denbaya ye
  Jerusal\u025bm, seli d\u0254 la, min b\u025b wele ko T\u025bm\u025bnkan seli. Ka
  b\u0254 Nazar\u025bti ka na Jerusal\u025bm, o sira ka jan kos\u025bb\u025b. Mobili
  t\u025b m\u0254g\u0254 si bolo. T\u025br\u025bn fana t\u025b yen. O bolif\u025bnw
  tun t\u025b yen o waati la. M\u0254g\u0254 fanba tun b\u025b taama u sen de la.
  U tun b\u025b tile saba \u0272\u0254g\u0254n k\u025b sira la sani u ka se Jerusal\u025bm.\\nYusufu
  ka denbaya bonyara sisan. D\u0254g\u0254k\u025bw ni d\u0254g\u0254musow b\u025b
  Yesu bolo, Yusufu ni Mariyama ka kan ka u jan to minnu na. O san na, Yusufu ni Mariyama
  ani u denw ye sira jan min\u025b walisa ka segin u ka so Nazar\u025bti. Olu f\u025b,
  Yesu ni taamak\u025bla w\u025br\u025bw tun b\u025b \u0272\u0254g\u0254n f\u025b
  sira kan ka na. Nka, u j\u0254ra tuma min na tile bintuma na, u ma Yesu ye. U y\u2019a
  \u0272ini u som\u0254g\u0254w ni u teriw c\u025b la, nka Yesu ni olu si tun t\u025b
  \u0272\u0254g\u0254n f\u025b. U seginna u k\u0254 Jerusal\u025bm walisa ka Yesu
  \u0272ini.\\nU labanna ka Yesu ni kar\u0254m\u0254g\u0254w s\u0254r\u0254 kuma na
  Alabatoso k\u0254n\u0254. A tun b\u025b ka u lam\u025bn ani ka u \u0272ininka. Yesu
  ka hakilitigiya tun ye m\u0254g\u0254 b\u025b\u025b kabakoya. Nka, Mariyama ko:
  \u2018Ne den, mun na i ye nin k\u025b an na? Ne ni i fa b\u025b\u025b j\u0254r\u0254len
  b\u025b ka i \u0272ini.\u2019\\nYesu y\u2019a jaabi ko: \u2018Mun na aw b\u025b
  ka ne \u0272ini? Aw t\u2019a d\u0254n ko ne ka kan ka s\u0254r\u0254 ne Fa ka so
  k\u0254n\u0254 wa?\u2019\\n\u0186w\u0254, Yesu tun b\u025b se ka kalan Ala ko la
  y\u0254r\u0254 min na, a tun ka di a ye ka k\u025b o y\u0254r\u0254 la. An b\u025b
  se ka kalan Ala ko la y\u0254r\u0254 min na, yala an fana t\u2019a f\u025b ka k\u025b
  o y\u0254r\u0254 la wa? Yesu seginna tuma min na Nazar\u025bti, a tun b\u025b taa
  laj\u025bw la d\u0254g\u0254kun o d\u0254g\u0254kun. O laj\u025bw tun dab\u0254ra
  Ala bato kama. Ikomi Yesu tun b\u025b a tulomaj\u0254 tuma b\u025b\u025b, a ye Bibulu
  k\u0254n\u0254ko caman d\u0254n. An fana ka k\u025b i ko Yesu. An ka a ladege.\\nLuka
  2:41-52; Matiyu 13:53-56.\\n\u019dininkaliw\\n- Yesu si ye san joli ye ja kan yan?
  A b\u025b y\u0254r\u0254 jum\u025bn na yan?\\n- Yusufu ni a ka denbaya tun b\u025b
  mun k\u025b san o san?\\n- Yusufu ni Mariyama k\u025blen k\u0254 ka tile kelen k\u025b
  taama na walisa ka segin u ka so, mun na u seginna kokura Jerusal\u025bm?\\n- Yusufu
  ni Mariyama ye Yesu s\u0254r\u0254 min? Mun ye m\u0254g\u0254w kabakoya o y\u0254r\u0254
  la?\\n- Yesu ye mun f\u0254 a ba Mariyama ye?\\n- Tuma min na an b\u025b \u0272ini
  ka Ala d\u0254n, cogo jum\u025bn na an b\u025b se ka Yesu ladege?\\n\u019dininkali
  w\u025br\u025bw\\n- Luka 2:41-52 kalan.\\nHali ni Sariya tun b\u2019a wajibiya c\u025b
  d\u0254r\u0254n ka na seliw la san o san, Yusufu ni Mariyama tun b\u025b min k\u025b,
  o ye ko ladegeta \u0272uman ye bi bangebagaw bolo, cogo di? (Luka 2:41; Dut. 16:16;
  31:12; Nt. 22:6)\\nYesu y\u2019a jira ko\u0272uman denmis\u025bnw na, u b\u025b
  se ka s\u0254n u bangebagaw ka kuma na, cogo jum\u025bn na? (Luka 2:51; Dut. 5:16;
  Nt. 23:22; Kol. 3:20)\\n- I ka Matiyu 13:53-56 kalan.\\nYesu baden naani minnu t\u0254g\u0254
  b\u025b Bibulu k\u0254n\u0254, olu ye j\u0254n ni j\u0254n ye? K\u0254f\u025b, fila
  k\u025bra baarak\u025bmin\u025bn ye Krec\u025bn j\u025bkulu k\u0254n\u0254 cogo
  di? (Mat. 13:55; K\u025bw. 12:17; 15:6, 13; 21:18; Gal. 1:19; Yak. 1:1; Jude 1)\"",
