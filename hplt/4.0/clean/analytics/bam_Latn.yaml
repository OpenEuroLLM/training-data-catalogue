  Sikaso\\ns\u025br\u025bkili k\u0254n\u0254, titirif\u0254nse n\u00b0209 Segu s\u025br\u025bkili
  k\u0254n\u0254, titirif\u0254nse n\u00b0341 Tumutu\\ns\u025br\u025bkili k\u0254n\u0254
