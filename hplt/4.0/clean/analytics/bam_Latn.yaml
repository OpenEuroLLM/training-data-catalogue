  ka b\u025bnkans\u025bb\u025bn n\u00b0155 la basigi ani k\u025bn\u025bya baara\\nla
  ani san 2022 b\u025bnkans\u025bb\u025bn, o b\u025bnkan kof\u0254len in kunkan, min
  b\u2019a wajibiya\\nt\u0254ndenjamana kelenna kan, k\u2019a ka faso politiki lab\u025bn
  basigi ani k\u025bn\u025bya baara\\nla, o kan.\\nG\u0254f\u025br\u025bnaman,\\nwalasa
  ka se ka wasa k\u025b o wajibi in na ani k\u2019a disi da baara \u0272umanko g\u025bl\u025bya\\nsuguya
  b\u025b\u025b la, a ye faso politiki lab\u025bn basigi nani k\u025bn\u025bya baara
  la o kan, min\\nb\u025bna k\u025b fara \u0272\u0254g\u0254n kan k\u025bn\u025b ye
  jamana ka hakilila b\u025b\u025b la basigi ani k\u025bn\u025bya\\nbaara la, o kunkan.\\nO
  politiki\\nin la\u0272inin ye ka Hadamaden lakanan baara\\nla ni baara faratiw \u0272\u025bsigili
  ye, ka d\u0254 b\u0254 baara kasaaraw la ani banaw baara f\u025b\\ncak\u025bda b\u025b\u025b
  la ; hali s\u0254r\u0254 minnu t\u025b sariya k\u0254n\u0254 ulu la, ani ka y\u025bl\u025bma
  \u0272uman\\ndon s\u0254r\u0254 k\u025bcogo la.\\nO b\u025b jamana\\nj\u0254li kura
  sinsinb\u0254l\u0254 k\u025br\u025bnk\u025br\u025bnnenw hukumu k\u0254n\u0254, \u00ab
  Mali kura \u0272\u025btaasira ka b\u025bn\\nsan 2063 ma \u00bb, faso ka f\u025b\u025br\u025b
  \u0272\u025btaa ni yiriwali kuntaala jan san 2024-2033 kama,\\nani baara \u0272uman
  s\u0254r\u0254li \u0272\u025btaa porogaramu.\\nFaso ka\\nbasigi ani k\u025bn\u025bya
  baara la, o politiki sinsinnen b\u025b la\u0272inin k\u025br\u025bnk\u025br\u025bnnen
  4 kan\\nani ka b\u0254 ni baara waleyali f\u025b\u025br\u025b d\u0254 ye san 2025-2029
  kama.\\n2. nafoloko ni wariko\\nminisiri ye minisirilaj\u025b lad\u0254nniya :\\na.
  Laj\u025bba min b\u025b k\u025b\\nAfiriki asuransiko minisiriw f\u025b, o kunc\u025bkan
  na a t\u0254ndenjamanaw f\u025b, min k\u025bra zuluyekalo\\ntile 10 san 2025, Lome
  Togo faaba la.\\nO laj\u025bba\\nf\u0254l\u0254 in, san 2025 ta senf\u025b, u ye
  ninnu f\u025bs\u025bf\u025bs\u025b :\\n- desanburukalo\\ntile 17 san 2024 laj\u025bba
  seereyas\u025bb\u025bn ;\\n- laj\u025bba\\nt\u025bm\u025bnnen b\u025bnkanw n\u2019a
  la\u0272ininw waleyalen b\u025b ka se hak\u025b min ma ;\\n- ko d\u0254nbaa\\n\u014banakulu
  ka seereyas\u025bb\u025bn san 2024 kunkan.\\nMinisirilaj\u025b\\nj\u025bnna ni Afiriki
  asuranko minisiriw ka laj\u025bba sekeret\u025bri zenerali ka\\nseereyas\u025bb\u025bnw
  k\u0254n\u0254kow ye san 2024 kunkan.\\nMinisirilaj\u025b\\nye fana, :\\n- y\u025bl\u025bma
  don\\nAfiriki asuransiko minisiriw kunkansariya cogoya la ;\\n- ka j\u025bn ni\\ntaabolow
  ye, minnu b\u025b y\u025bl\u025bma don ani ka dafali k\u025b Afiriki asuranko minisiriw
  ka\\nko\u0272\u025b dantig\u025bli sariya la \u00ab Zoni CIMA k\u0254n\u0254, k\u025br\u025bnk\u025br\u025bnnenya
  la, min b\u025b wari\\ns\u0254r\u0254 cogo jugu, kojugubak\u025b musakali ani k\u025bl\u025bmin\u025bn
  juguw j\u025bns\u025bnni k\u025bl\u025b.\\nb. di\u0272\u025b wariko ni sekow\\nyiriwali
  maray\u0254r\u0254 cak\u025bda Afiriki tilebinyanfan t\u0254g\u0254 la, o ka j\u025bkulu
  min\\n\u0272\u025bsinnen b\u025b kuntilennadi ma, o ka laj\u025bba 35nan b\u025bnkanw,
  n\u2019a laj\u025b k\u025bra zuw\u025bnkalo\\ntile 25 ka se 26 ma san 2025, Nuwakis\u025bti
  Moritani faaba la.\\nDi\u0272\u025b wariko\\nmaray\u0254r\u0254 cak\u025bda sekow
  yiriwali la Afiriki tilebinyanfan f\u025b, o b\u025b d\u025bm\u025bn don d\u0254\\nfarali
  la sekow kan jamana 10 k\u0254n\u0254 ani\\nUEMOA fangabulon d\u0254w la, i n\u2019a
  f\u0254 Afiriki tilebinyanfan bankiba (BCEAO) ani\\nUEMOA kolatig\u025bj\u025bkulu.\\nKuntilennadij\u025bkulu\\nmin
  \u0272\u025bsinnen b\u025b taasira k\u025br\u025bnk\u025br\u025bnnenw donni ma ani
  ka d\u025bm\u025bn don cak\u025bda la a\\nkarankow dantig\u025bli la. A b\u025b
  a f\u025bla fana f\u0254 san baara bolodacogo ani baara s\u0254r\u0254\\nn\u2019a
