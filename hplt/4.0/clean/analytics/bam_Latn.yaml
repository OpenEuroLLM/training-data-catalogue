  b\u025b wele s\u025btanburukalo tile 22, o wulikaj\u0254w k\u025bra an ka jamana
  k\u0254n\u0254..\"", "\"TILE fila t\u025bm\u025bnen k\u0254f\u025b, alamisadon suf\u025b,
