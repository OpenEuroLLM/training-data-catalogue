  sefawari miliyari 64 \u0272\u0254g\u0254nna,\\no taara finiw, dalanw, m\u0254g\u0254donim\u0254biliw,
  adw daf\u025b.\\nD\u0254kala Yusufu JARA\\nBembablin DOUMBIA\\nA kof\u0254len don
