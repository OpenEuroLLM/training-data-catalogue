  baara la, o jatelen b\u025b i n\u2019a f\u0254 hadamadenya hak\u025b d\u0254, y\u025bl\u025bma
  \u0272uman\\ndoncogo baara k\u025bcogo la, k\u2019a to sanga\u0272\u0254g\u0254nya
  ka lawuli cak\u025bdaw c\u025b ani u ni faso\\nnafoloko cak\u025bda c\u025b.\\nWalasa
