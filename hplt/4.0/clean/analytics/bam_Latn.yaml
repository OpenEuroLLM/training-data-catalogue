  f\u025b ka l\u0254k\u0254ya d\u0254 d\u0254mbwana\\nN\u2019a be b\u0254 b\u025bm\u025b
  l\u0254n, i yera i ka ba bi t\u00ec ninsira f\u025b k\u0254f\u025b yama d\u0254mbi
  j\u0254na yi feere. S\u0254la ni m\u0269nna j\u0254si ni sisi fa i n\u2019a k\u0254
  k\u025bn\u025b baara ye ferana. Nna ni ani d\u0254mbi t\u025b ka k\u0254 f\u0254,
  i no no duuru na an j\u0254r\u0254. I ka k\u0254\u0493aHa ka k\u0254 max ya j\u025bg
