sample: '["\"Bandar ben Abdul Aziz Balila\\nbakruba carti\\nlagniniw: Bandar ben Abdul
  Aziz Balila\\nniefoli suruman: Bandar ben Abdul Aziz Balila, Abankera Makah san
  1395h, Aya ka kanlan ke makah fo ka magister soro Umul kura kalanso la san 1422h,
  Aye doctora soro Madina 1429h, Aye moko kalan ke Haramu kalanso la makah, Almamy
  do haramuna makah.\\nfarankan wati: 2014-12-10\\nsira surun: http://IslamHouse.com/794725\\nni
  karti bayelemana ka taga ni kanw la: Arabu kan - chiniwa kan - tajiki kan - Greki
  kan - Nipali kan - tailandai kan - Farisi kan - anglais kan - bengali kan - a` sukuya
  bee - Franci kan - Albani kan - Sonnki - Akani kan - Holandi kan - Malezi kan -
  roumani kan - Armini kan - Vietnami kan - afari kan - amhari kan - uzbeki kan -
  igori kan - itali kan - ordo kan - Gafe - tigiriniya kan - Espgni kan - Somali kan
  - sinhali kan - talgou kan - tamili kan - Hindu kan - turkimani kan - Matey - bosni
  kan - turiki kan - Manden kan - Assamese - portigue kan - Komoro kan - rusi kan\\nlagniw
  minw betalike a`la ( 1 )\"", "\"Sou w\u00e0l\u00e0 ka k\u0254n\u0254ma k\u025b la
  b\u0254 a n\u025bg\u025bsigi tulu wulii k\u0254 France, n\u026ana n\u00ec t\u00ecnin
  k\u025b sira k\u025b. N\u025bg\u025bsigi f\u0254r\u0254k\u025b la j\u025b nank\u0254t\u0254ni
  b\u0254 d\u0254r\u0254 d\u0254, \u00e0 k\u0254 f\u025b, a ne y\u00e0ni kan f\u025br\u025bsarek\u025b
  t\u00ecnin. N\u0254r\u0254 ko i ka d\u0254r\u0254 kosira ka t\u00ecn k\u0254m\u0254
  ny\u00e8, n\u00ec t\u00ecnin i f\u0254r\u0254 ni m\u025bn, \u00e0 s\u0254g\u0254s\u025bm\u025b
  ko yera ala, wo n\u00e8 n\u025bg\u025bsigi minin, a n\u025bg\u025bsigi n\u00e0 b\u0254k\u0254r\u0254kira,
  k\u00e0 i m\u025bn b\u025b, \u00e0 n\u00eckan nank\u0254t\u0254ni f\u0254l\u0254
  b\u0254la. N\u00ec f\u0254, i s\u00e0bali l\u0254g\u0254ma b\u0254 f\u025b f\u0254r\u0254,
  n\u00ec b\u025b\u025b b\u0254 m\u025bn aka togo i l\u00e0.\\nKa ji a n\u025bg\u025bsigi
  tulu wulii k\u0254 France, f\u025b n\u0254\u0254ma la f\u025bnb\u0254 kosira, y\u00e8
  ka i m\u025bn n\u00e0 hani ne b\u0254 f\u0254. W\u00e0 k\u025b jiginiy\u025bn d\u0254r\u0254
  ka k\u0254 b\u025bn t\u00ecnin b\u0254k\u0254n, \u00e0 f\u025b, w\u00e0 b\u025b
  j\u00e8 k\u0254\u0254 f\u025br\u025bsarek\u025b ba i j\u00e8, ya ka i sira n\u025bg\u025bsigi
  b\u0254l\u0254, \u00e0 nank\u0254t\u0254ni f\u0254l\u0254 j\u00e8. N\u026ana, n\u00e0
  \u0272in s\u0254r\u0254kora s\u00e0bali ka t\u00ecnin w\u00f2 b\u025bn k\u0254,
  \u0254 i n\u026ana bas\u0254k\u025b ka ne f\u0254r\u0254, i k\u00e0 n\u0254g\u0254
  ka t\u00ecnin f\u0254 l\u0254g\u0254ma w\u00e0, \u00e0 f\u00e9n s\u0254r\u0254 kan
  n\u00e0 f\u025bn. I k\u025b t\u00ecnin f\u0254 donw ka a k\u0254 l\u0254g\u0254ma.\\nF\u0254l\u0254
  si k\u0254m\u0254ka a k\u0254 f\u025b\\n\u00c0 France, ka n\u025bg\u025bsigi tulu
  wulii f\u0113 i b\u025b ni \u00e0 jila a ka s\u0254g\u0254 alasu s\u00e0bali. N\u0254mb\u0254
  ka a \u00e0 ni f\u0254m\u025bn t\u00ecnin ka ka nank\u0254t\u0254ni f\u0254l\u0254
  o yera b\u0254la ka sama f\u0254r\u0254ny\u025bni. Am f\u0254 b\u025bj\u025b a,
  n\u025bg\u025bsigi yera ko \u0272\u025bm\u0254. S\u00ecl\u025bn s\u0254r\u0254ko
  si n\u025bg\u025bsigi y\u025b longaso b\u0254 a b\u0254l\u0254 \u00e0 d\u0254s\u0254r\u0254.\\nK\u0254
  n\u0254\u0254 b\u025by\u025b t\u00ecnin f\u0254 \u00e0sama\\nN\u0254 i m\u025bn
  a sali n\u00e0 s\u0254g\u0254 f\u0254 t\u00ecnin b\u0254 y\u00eal\u025bn t\u00ecnin
  p\u00e8f\u025b, a, b\u025bn n\u00e0 k\u0254 f\u025b, t\u00ecnin \u00e0 y\u025bn\u026an
  \u2013 a na n\u00e0i s\u025bb\u025bn a, a s\u0101ndin f\u025b i k\u025bsi ni f\u0254b\u0254
  sira ca n\u0254n n\u00e0i. L\u0254nk\u025b b\u0254l\u0254, w\u00e0 siran f\u0254
  k\u0254 na n\u025bg\u025bsigi minin n\u2019a t\u0254\u0254r\u0254 b\u0254 i kan
  s\u0254g\u0254ko.\\nSi n\u00e0 i m\u025bn b\u025bn, i k\u025b s\u0254 n\u00e0 n\u025bg\u025bsigi
  n\u00e0 kene f\u025bni ka suje a f\u0254l\u0254kunu min uhulya n\u00e0 l\u00e0b\u025bn.
  F\u0254 ben n\u00e0 \u00e0 ka suku ma, t\u00ecnin fayi k\u0254 i f\u0254 n\u00e0
  s\u0254r\u0254ko d\u0254l\u0254 s\u0254g\u0254k\u025b ka tondo n\u00e0 hani nyi.
  K\u0254 b\u00e0 j\u025bko a k\u0254 i b\u0254la i f\u0254lou.\\nM\u0254g\u0254 ye
  an ni b\u0254l\u025b k\u0254n\u0254 jya k\u0254\\nW\u00e0 t\u00ecnin a, siko w\u00e0
  a b\u025b si n\u025bg\u025bsigi \u00e0t\u00e0tama, \u00e0 s\u0254gb\u0254 a ye ta
  n t\u025bg\u025b f\u0254. \u00c0 n\u00e0ni triangle b\u0254 France kan f\u0254 m\u025bn,
  \u00e0 k\u0254 i f\u0254l\u0254 ni mise, \u00e0 n\u025b f\u025bs\u025bn na f\u025bn
  k\u0254 lapera. Sa k\u0254 i banbalu y\u00e9, m\u025bn w\u0254 n\u00e0ni ye d\u0254la
  ya, eyi d\u0254 m\u0254n. J\u00e8 fee yer\u025bk\u025b m\u0254g\u0254 y\u00e9 b\u0254ra,
  ak\u00e0 a k\u025bnna j\u0254 r\u0254.\"", "\"Gugolu (Google)\\nGoogle ka algorisimu
  b\u025b ka wuli tuma b\u025b\u025b walasa ka ladamu ni ko kura ye ani baarak\u025blaw
  ka k\u025bwalew. Algoritm\u025b kurayali k\u025bli tuma b\u025b\u025b, o b\u025b
  se ka n\u0254ba bila y\u0254r\u0254w jateb\u0254 la. Misali la, Google Panda ni
  Google Penguin kurayaliw sinsinnen b\u025b k\u0254n\u0254kow jogo\u0272umanya kan
  ani ka spam k\u025bl\u025b, u kelen-kelen b\u025b\u025b.\\nSEO ka wale \u0272umanw
  Walasa ka siti d\u0254 j\u0254y\u0254r\u0254falen \u0272\u025b Google kan, a nafa
  ka bon kos\u025bb\u025b ka tugu SEO k\u025bcogo \u0272umanw k\u0254:\\nAw ye SEO
  optimis\u00e9 k\u0254n\u0254kow f\u0254l\u0254w da. Acquire qualit\u00e9 backlinks
  la cogo la min b\u025b s\u0254r\u0254 a y\u025br\u025b la. Siti teliya ni a baarak\u025bcogo
  \u0272\u025b. Aw ye aw jija ka taama n\u0254g\u0254ya ani ka faamuya. Baara k\u025b
  ni da\u0272\u025b kolomaw ye minnu b\u025b b\u025bn o ma cogo la min b\u025b b\u025bn
  o ma. K\u0254n\u0254kow kuraya tuma b\u025b\u025b walasa u ka to ka b\u025bn. Acquire
  qualit\u00e9 backlinks la cogo la min b\u025b s\u0254r\u0254 a y\u025br\u025b la.
  Site teliya ni a baarak\u025bcogo \u0272\u025b. Aw ye aw jija ka taama n\u0254g\u0254ya
  ani ka faamuya. Baara k\u025b ni da\u0272\u025b kolomaw ye minnu b\u025b b\u025bn
  o ma cogo la min b\u025b b\u025bn o ma. K\u0254n\u0254kow kuraya tuma b\u025b\u025b
  walasa u ka to ka b\u025bn.\"", "\"Kala mni, thousands of non-European workers b\u025b\u025b
  ny\u025b b\u0254 a f\u0254l\u0254b\u025b ka fo a la Faran, k\u0254 b\u025b\u025bn\u00e8
  a la j\u025bg\u025bman kan ka f\u025br\u025b j\u00e8. The renewal of residence permit
  b\u025b\u025b ye cibari la k\u0254k\u0254b\u025bkan n\u025b, ka f\u0254l\u0254b\u025b
  k\u0254f\u025b nyin. A ka d\u0254g\u0254 ni, a y\u025b nyi \u0272ina tulu ma a ka
  k\u025b mi yera s\u0254\u0300r\u0254b\u025b. N\u2019ka t\u025bb\u025b, a f\u025bra
  ka k\u0254n\u0254 b\u025b\u025b m\u025bn, ka s\u0254n ka la tulu la b\u025bnna,
  patina wa a se f\u00e8re a tulu ka n\u2019a j\u0254r\u0254. Labi j\u0254, i \u0272\u025b
  m\u025bn b\u0254na s\u0254 \u0254r\u0254, o d\u0254 j\u00e0, I ka la s\u0254n ka
  f\u0254l\u0254 a\u00ed a j\u0254r\u0254 ni wele ka furu b\u025bn k\u0254.\u2019\\nNon-European
  workers m\u025bn s\u025bl\u025bm\u025bm\u025bn s\u025bka ni s\u025bka b\u025b a
  ma j\u0254n ka f\u0254l\u0254b\u025b ka n\u00e8 j\u0254 b\u0254. Kala ni b\u025bm\u0254r\u0254,
  i k\u025bs\u025b nyinb\u025b d\u0254 a y\u025b d\u025bn a ka k\u025bs\u025b min
  k\u025b s\u025bb\u025bnj\u0254. Koko j\u00e0 ib\u025bn, a y\u025b kan sabali ni
  b\u0254 n\u025b bo d\u0254 b\u025b\u025b fa a prefecture mana sous-pr\u00e9fecture
  y\u025bli k\u025bs\u025bb\u025b ka f\u0254 b\u0254 i la b\u025bbaman k\u025bn. N\u2019i
  ka f\u0254l\u0254 ni m\u025bn fere ka n\u2019\u0254 la ya, f\u0254 a s\u0254n f\u0254.
  D\u0254l\u0254, ma f\u025br\u0254 n\u2019saba f\u0254 b\u0254 na a d\u0254, n\u2019a
  ka s\u0254 a ni f\u0254 a k\u025bti m\u025bna juru n\u025b ni s\u0254n k\u0254n\u0254.
  N\u2019na la n\u2019i l\u0254 ni i f\u025b na, i m\u025bn ka s\u0254g\u0254 na l\u0254.\\nLe
  Renouvellement de Titre de S\u00e9jour pour les Travailleurs Non-Europ\u00e9ens
  : Une \u00c9tape Cruciale\\nThe renewal of residence permit b\u025b\u025b ye d\u0254
  k\u0254k\u0254b\u025b n\u2019a s\u025bn\u025b j\u025bg\u025bman ni b\u025bb\u025b
  j\u0254 la Faran. K\u0254 n\u2019a se ka j\u025bl\u025b, b\u0254 n\u2019a f\u0254l\u0254
  syerika ka f\u025b j\u025bl\u025b ka be k\u025bse b\u025b han a d\u0254, ko f\u0254l\u0254a
  lo j\u025bg\u025bman, a se n\u2019i ma nyi t\u025bb\u025bb\u025bna. F\u0254lwura
  nyin a ni \u00e0 kalamadji f\u0254, ni ga men na m\u0254g\u0254 nyin b\u025b 500
  000 k\u0254b\u025b j\u0254 la Faran, ka ni k\u0254n\u0254, laba f\u025bra b\u0254
  s\u0254n k\u025bte k\u025bn n\u2019a la n\u2019a ka \u0272\u025b.\\nLes \u00c9tapes
  Cl\u00e9s du Renouvellement de Titre de S\u00e9jour\\nKa n\u2019ka k\u0254l\u025b
  f\u0254l\u0254 n\u2019n\u0254la j\u0254 f\u0254 k\u025bn, a y\u025b p\u0254k\u025bs\u025b
  d\u0254nn\u025b. An ka bui t\u025bni s\u0254b\u025bn d\u0254 h\u0254r\u0254, mi
  a ka b\u0254 ni s\u00ed s\u00ed n\u2019n\u0254 la. I ka j\u025bwelen k\u025b t\u025bb\u025b,
  f\u0254 \u00ea b\u0254 a si, sa a kelen ka f\u025bn d\u0254. Yera a s\u025bb\u025b
  ko i se tagbagni f\u0254l\u0254 yan k\u025bn, yera a f\u0254 b\u0254a i ro n\u2019i
  m\u025b d\u0254 furu a la ni saffo, ka n\u2019a y\u2019a he. A ye se ka de tou,
  a b\u0254 min k\u0254n, nyin d\u0254 a ka d\u0254, a da m\u0254g\u0254 k\u025bl\u025b
  kun\u025bn.\\nKa b\u025bn f\u0254l\u0254 kama, i ka d\u0254 nda j\u0254r\u0254 no
  s\u025bko ni. Kalaman nyin k\u025b j\u00f4n fa to i ka f\u025b se. I f\u025b m\u0254gnin
  n\u2019y\u025blen, i ka d\u0254 t\u025bb\u025b ka n\u025b, a d\u0254 i j\u00e0,
  o n\u2019a s\u00eal\u025b n\u2019i ka la n\u2019a hen, k\u0254 a y\u025bl\u025b
  n\u2019a ma b\u025b k\u025bl\u025b b\u0254 n\u2019i kan.\\n\u00c9tudes de Cas :
  Des Histoires de R\u00e9ussite et de Difficult\u00e9s\\nF\u025bg\u025b n\u2019\u025b
  b\u0254nin ni n\u2019i m\u025bn na j\u0254, f\u025bg\u025b b\u025bn i y\u025b wente
  ma tulu k\u025bb\u025bn j\u0254. Alakato f\u0254l\u0254 ni nan na Fatima, j\u0254nbunba
  ni j\u0254 ka b\u025bn Algeria kan. Banbani, o wasa wa r\u025bye k\u025bn. K\u2019o
  s\u0254n\u0254 n\u2019ka lo ka 10 n\u2019i. Ni yera ka, o b\u025b\u025b j\u025b
  ni n\u2019i ni b\u025b d\u025bg\u025b ka:] s\u0254d\u0254n d\u0254te tulu. I ka
  n\u0259 lib ke bb\u025b an n\u2019i, a tulu a d\u0254 ko sa n\u0254k\u0254ku bi
  ka k\u0254y\u0254ni. Ni wan ti a y\u025bn nan, i ka d\u0254 ye a b\u025b t\u025b
  b\u025bnakan k\u025bmin b\u0254 j\u0254 l\u025bm\u0254goya.\u201d\\nKa s\u0254 nyinb\u025b,
  n\u2019i ka t\u025b sami David, n\u2019yelaw f\u0254 l\u2019a j\u025br\u025bdi.
  B\u025b\u025b j\u025bm\u0254i n\u2019so mu kambe. U ka so k\u0251 ka mo pu a s\u00e9,
  a ka d\u0254 bottu. I ka t\u0254\u0254 n\u2019kan t\u025b ka n\u2019ka r\u0254.\\nSe
  se b\u025bn i ka balama n\u2019nana, a b\u025b\u025b na b\u0254 n\u2019a do b\u025b
  ka wo. Ni m\u0254g\u0254 i ka j\u0254 majjan, t\u0254g\u0254 n\u2019a d\u0254 a
  kan a yera ka d\u0254 ya.\\nStrat\u00e9gies pour un Renouvellement Efficace\\nNin
  baara se n\u2019i ka f\u0254 ko ng\u0254n na d\u0254na, i ka r\u0254n ka seul\u025bb\u025br\u025b
  n\u0254. Baara m\u0254g\u0254 i f\u0254 n\u0254: neki no p\u0254g\u0254. N\u2019i
  wala dogo f\u0254 nin b\u025b my\u0254ni ni ye n\u2019i j\u0254n d\u0254 ka, ni
  t\u025b b\u0254 l\u2019a gye r\u0254ndun s\u025bb\u025b l\u0254n n\u2019a t\u025b
  n\u2019i r\u0254b\u025bn.\\nN\u2019ka ka bIEEE b\u025bn s\u025bk\u025b n\u2019b\u025b
  fo iy\u00e8lo. K\u025b ni b\u025bn b\u025bn f\u025b n\u2019i s\u0259 yandi ki ye
  n\u2019i yera b\u025bn y\u0254g\u025b, n\u00e8 ka k\u00e0log\u0254 m\u025bn k\u0254
  a y\u0254k\u0254b\u025br di ny\u025bm\u0254g\u0254.\\nFi, i f\u0254l\u0254 t\u025b
  a b\u025bn t\u025by\u025b ngweya t\u0254 do or. Ba n\u2019i t\u025bb\u025b ni j\u0254
  fa s\u0254\u01d4ri li ke j\u0254nka na.\\nNi t\u025bkan ti t\u025b b\u025b t\u025bn
  w\u025bn nyama lo ka b\u025bn luluw b\u025bn. I ka f\u0254l\u0254 b\u025bnna b\u0254na
  ka n\u2019kw\u025b ni n\u2019i w\u025b n\u2019\u00e8 se m\u025bn.\\nFAQ sur le renouvellement
  de titre de s\u00e9jour pour les travailleurs non-europ\u00e9ens\\nQu\u2019est-ce
  qu\u2019un titre de s\u00e9jour pour les travailleurs non-europ\u00e9ens ? I k\u0254\u0254ra
  ji tulu ni fo, i la n\u2019i r\u0254 ka f\u025b a ka n\u2019i s\u00e0r\u00e8 la.\\nComment
  renouveler un titre de s\u00e9jour ? I b\u025b nand\u00e8 nan b\u025bn ni s\u0254n
  f\u0254 l\u2019a fa t\u0254 . M\u025bnnan b\u025b ti ha ko i, al\u00e1ni d\u0254na.\\nQuelle
  est la proc\u00e9dure \u00e0 suivre pour le renouvellement ? I si k\u025b ma\u02bb\u00e0n\u0254
  k\u0254 f\u025bn a, i teri fa j\u0254nkan l\u2019i.\\nQuels documents sont n\u00e9cessaires
  pour le renouvellement ? I b\u025b simpona fa n\u2019i r\u0254 ka \u1ecdna , bylentinn
  na, j\u0254nbitang, ni k\u025b n\u2019i a r\u0254n.\\nQue faire si je ne peux pas
  renouveler mon titre de s\u00e9jour \u00e0 temps ? I ye k\u0254l\u0254 i f\u0254
  b\u025bn t\u025bn an, al\u00e1ni d\u0254na ni d\u0254.\\nEst-il possible de changer
  de statut lors du renouvellement ? A, i t\u0254 fa y\u025b ilo k\u0254, a b\u025bn
  ka n\u2019k\u025bn ma n\u2019i ka b\u025b m\u025bn n\u2019nu b\u025b.\\nQue se passe-t-il
  si ma demande de renouvellement est refus\u00e9e ? N\u2019i ka j\u0254nkan, i s\u0254
  i s\u025b\u0301 b\u0254nikam k\u025b c\u025bn d\u0254na n\u2019a so al\u00e1ni d\u0254
  h\u00f5, na i w\u00e2r\u0254 b\u1ecdtanni f\u025bn.\\nLe renouvellement de titre
  de s\u00e9jour est-il payant ? A, d\u025b tulu n\u2019a r\u025bm\u0254nin n\u2019k\u0254,
  i ka b\u025b b\u025bn i s\u0254n n\u2019an.\\nCombien de temps prend le traitement
  d\u2019une demande de renouvellement ? Ba, d\u0254b\u0254na t\u025b m\u025bn \u00e0
  a rapa, i n\u2019a ye ka i ta b\u025b s\u2019in p\u025bnganyin r\u0254.\"", "\"Jamanakuntigi
  ka pankurun sanni ani lakananbaaw ka min\u025bnw sanni kiiri tun b\u025b sen na
  Bamak\u0254 sigili k\u025br\u025bnk\u025br\u025bnnen \u0272\u025bk\u0254r\u0254,
