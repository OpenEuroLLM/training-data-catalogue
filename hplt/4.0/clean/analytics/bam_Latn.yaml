  se ka k\u025b sugandili \u0272uman ye i bolo.\\nNka, n\u2019i b\u025b nafa don d\u0254nnik\u025blaw
  ka d\u025bm\u025b na, hakilisigi la, ani nafa w\u025br\u025bw la i n\u2019a f\u0254
