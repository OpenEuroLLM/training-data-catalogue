  nka u b\u025bna baaraw damin\u025b waati min kokura o ma f\u0254. U ka baaraw j\u0254li
  kun, a jira la s\u025bb\u025bn k\u0254n\u0254, minisiriw ka \u0272\u0254g\u0254n\u0272\u025b
  k\u0254f\u025b, k\u0254 politikik\u025bbagaw n\u2019u j\u025b\u0272\u0254g\u0254nw
  ka k\u025bwale juguw de b\u025b ka caya jamana k\u0254n\u0254. O de kama u ye nin
  f\u025b\u025br\u025b ta k''u ka baaraw laj\u0254 f\u0254l\u0254. Maraj\u025bkulu
  ka kumalasela, colonel Abdoulaye Ma\u00efga, y''a jira k\u0254 sigikafow b\u025b
  senna jamana k\u0254n\u0254, politikik\u025bbagaw fana ka la\u0272ini t\u025b foyi
  ye furanc\u025b fanga ban waati, n''o ye mars kalo tile 26 ye k\u0254 ka labato.
  O kama marabagaw y''a jira ko sigikafo nafama min b\u025b senna malidenw ni \u0272\u0254g\u0254n
  c\u025b, walasa b\u025bn ka k\u025b \u0272aniya \u0272umanw ka ta, k\u0254 mankan
  ka k\u025b f\u0254\u0272\u0254g\u0254nk\u0254 k\u0254n\u0254.\\nAlamisadon avril
  kalo tile 11 san 2024 la, t\u0254n min fana b\u025b kunnafonisow hak\u025bw kolosiliw
  kama Mali la, n''o ye Haute Autorit\u00e9 de la Communication (HAC) ye, y''a f\u0254
  s\u025bb\u025bn k\u0254n\u0254 kunnafonidisow la, k\u0254 kunnafonidilaw b\u025b\u025b
  (arajo, television, kunnafonidis\u025bb\u025bnw ani minnu b\u025b kunafonidi bololo
  sira f\u025b) u ka politikit\u0254nw ka baaraw laseli b\u0254li b\u025b\u025b dabila.
  HAC y\u2019a \u0272\u025bf\u0254 c\u0254g\u0254min, k''a ka latig\u025b in b\u025b
  talik\u025b ka \u0272\u025bsi marabagaw ka \u0272aniya in labatoli de ma, n''u ye
  politikit\u0254nw ka baaraw b\u025b\u025b laj\u0254 jamana k\u0254n\u0254.\\nTiambel
  Guimayara koni bolo, kunnafonis\u025bb\u025bn min togo \\\"La Voix du Mali\\\" o
  \u0272\u025bm\u0254g\u0254 don, k''u ma sigi nin \u0272aniya in ma, nka o b\u025bna
  ta k''a ka kan, bawo \u0272aniya b\u0254ra HAC de f\u025b, n''o ye kunafonidilaw
  ka cak\u025bda ye, n''a b\u025b kolosiliw k\u025b kunnafonidilaw kan ani k''u ka
  hak\u025bw latanga jamana k\u0254n\u0254. Wa n''o k''u ka politikit\u0254nw ka baaraw
  b\u0254li dabila kunafonidisow la, i na f\u0254 marabagaw y''a f\u0254 c\u0254g\u0254min
  o ka kan. Tiambel Guimayara nin VAO Afrique ka kuma\u0272\u0254g\u0254nya senf\u025b,
  a y\u2019a \u0272\u025bf\u0254 ko nin \u0272aniya in s\u0254r\u0254la s\u0254s\u0254li
  g\u025bl\u025bn de la, bawo politikit\u0254nw tun b\u025b ka jira k\u0254 furanc\u025b
  fanga waati sera dan na, mars kalo tile 26 san 2024 la. O mankanw k\u0254s\u0254n
  furanc\u025b fanga \u0272\u025bm\u0254g\u0254w fana ye nin \u0272aniya ta ka politikitonw
  ka baaw laj\u0254 f\u0254l\u0254.\\nK\u0254 sariya min ye politikit\u0254nw ka baaraw
  laj\u0254, n''o tun ma k\u025b politikit\u0254nw caman b\u025bna laj\u025bw de k\u025b,
  wa o laj\u025bw fana t\u025b se ka k\u025b nin kunnafonidilaw ma wele. O kama, \u00ab
  La Voix du Mali \u00bb kunafonis\u025bb\u025bn \u0272\u025bm\u0254g\u0254, Tiambel
  Guimayara k\u0254 furanc\u025b fanga \u0272\u025bm\u0254g\u0254w fana y''o de jat\u025bmin\u025b
  k\u0254 wulikaj\u0254w b\u025b s\u0254n ka caya jamana k\u0254n\u0254 politikik\u025bbagaw
  f\u025b, k''u dusumakasi jira kunafonidisow la, n''o fana b\u025b son ka k\u025b
  kololo were ye jamana ma. O de kama furanc\u025b fanga ye nin latig\u025b ta.\\nTiambel
  Guimayara hakili la, \u00ab politikit\u0254nw fana ka kan ka kuma\u0272\u0254g\u0254n\u0272a
  k\u025b u ni furanc\u025b fanga c\u025b, i na f\u0254 sira y''a f\u0254 c\u0254g\u0254min
  na, walasa ka b\u025bn waati kan kalataw ka k\u025b \u00bb.\\nS\u0254r\u0254dasiw
  tun ka kan ka lab\u025bn sabati walasa ka fanga di siwili d\u0254 ma mars kalo tile
  26 la, nka halisa u b\u025b fanga la. \u00ab A ka kan ka kuma\u0272\u0254g\u0254n\u0272a
  k\u025b furanc\u025b fanga in ban waati kan, o nafa ka bon k\u0254s\u025bb\u025b\u00bbTiambel
  Guimayara ka kuma f\u0254 la.\\nForum\"", "\"Nafolo Baara niokoyaw\\nbakruba carti\\nlagniniw:
  Nafolo Baara niokoyaw\\nniefoli suruman: ni walandaw be ladjelike fen wo fen be
  talike nafolo baara niokoyala ani a kitiw inafo: diako an riba ani nafolo faleni
  ani diako ben kanw ani sani makutu fe ani djuru ani tonomada ani djuruw yelemali
  moko were kan na, dieniokonya diakola, ani sikan, ani diyin yini,ani lami niokoyali
  ani sene niokoyali ani ken sarala, ani tu tikelian ani dimali ani bla kun koroli
  ani kalifa ani nioko dan ani nioko dan kaalafilila, ani k''a fin bila allah k''a
  sira kan ani yere la dieya\\nsira surun: http://IslamHouse.com/810108\\nni karti
  bayelemana ka taga ni kanw la: Arabu kan - bengali kan - igori kan - anglais kan
  - Hindu kan - Holandi kan - uzbeki kan - bosni kan - tailandai kan - tajiki kan
  - Franci kan - Nipali kan - chiniwa kan - Farisi kan - a` sukuya bee - Vietnami
  kan - Greki kan - afari kan - Gafe - ordo kan - Somali kan - Espgni kan - Manden
  kan - sinhali kan - talgou kan - tamili kan - Malezi kan - Akani kan - turiki kan
  - Albani kan - amhari kan - Assamese - muri - tigiriniya kan - indonesi kan - chirkisi
  kan - Makdoni kan\"", "\"I n\u2019a f\u0254 di\u0272e jamana t\u0254w, an ka jamana
  ye muso t\u0254g\u0254ladon la\u0272enamaya jumadon marisikalo tile 8 san 2024 seko
  ni d\u0254nko soba la. Masalakun min tara, o tun ye : Muso j\u0254y\u0254r\u0254
  forobakow k\u0254n\u0254 : disidakow, g\u0254leya ni n\u0254g\u0254yaw, ka mine
  di\u0272e masalakun ma, n\u2019o ye : ka baara ke musow ka ko n\u0254g\u0254yali
  la, k\u2019a taacogo sennateliya. Muso t\u0254g\u0254ladon la\u0272enamayali daminena
  Mali k\u0254n\u0254 kabini san 1994, kas\u0254r\u0254 a juj\u0254nna ni Sikago izini
  baarakela musomanw ka murutili ye san 1857 Lamerikenjamana na, walasa ka se ka yelema
  \u0272uman don u ka \u0272enamaya kecogo la. A kera fangabulon ye k\u2019a kof\u0254
  san 1977 di\u0272e t\u0254nba ONU fe, k\u2019a wele muso t\u0254g\u0254ladon di\u0272e
  k\u0254n\u0254 ; n\u2019a tubabukan da\u0272e surun ye (JIF) ye. A be dab\u0254
  o kelennin bonya kama, ka wulikaj\u0254 ke waleya minnu sera ka ke a ko la politiki
  ni nafolo kunda, seko ni d\u0254nko ani hadamadenya la ka \u0272esin musow ma, ani
  ka ko goninw da kene kan, min be se k\u2019a to damake\u0272e ka sabati cew ni musow
  ce yiriwaliko bee la. O ye koba ye, min ka fisa muso bee ma, i kera m\u0254g\u0254
  suguya o suguya ye, ka b\u0254 jamana o jamana na, wa fana ka ke jekulu suguya o
  suguya la : g\u0254ferenamanw, demendonjekuluw, foroba ni kenyereye. Marisikalo
  tile 8 ye damakasili ani lafaamuyali kene ye jamana k\u0254n\u0254 ani di\u0272e
  k\u0254n\u0254 muso dabolo kan, ani ka dantigeli ke, baara minnu sera ka waleya
  ani minnu tora kebali ye \u0272etaako la damake\u0272eni sabatili nasira la ce ni
  muso ce di\u0272enatige yiriwaliko bee la. \u019dinan marisikalo tile 8 masalakun
  b\u2019a k\u0254r\u0254 s\u0254r\u0254 jamana j\u0254li kura poroze k\u0254n\u0254
  Mali kura s\u0254r\u0254li la. A d\u0254nnen don ko an ka jamana k\u0254n\u0254,
  balanba min dalen don damake\u0272eni s\u0254r\u0254baliya \u0272e ce ni muso ce
  yanni san 2030, o ye a ko\u0272e bee waleyali musakantanya ye. O sababu d\u0254
  ye kele min be jamana k\u0254n\u0254 kabini san 2012. Maliden, kerenkerennenya la
  musow, olu de mu\u0272unnen don kosebe kele in k\u0254n\u0254. O siratige la, je
  kera ka waleya minnu ke baara kebaaw fe, olu ka kan k\u2019an bali ka musow to u
  yere bolo u dabolo jugu k\u0254n\u0254. Hakili ka kan ka to a la, ka baara ke ka
  \u0272esin musow ma. O ye hadamadenya hakew ani hadamaden bee mineni kelen ye, o
  taabolo ye. Musaka fana ka don ce ni muso damake\u0272eni waleyaw dafe. Geleyaw
  ni f\u0254\u0272\u0254g\u0254nk\u0254w k\u0254l\u0254l\u0254 juguba be musow ni
  musomanninw ka \u0272enamaya kecogo kan. U be taama u cogoya kan kosebe, don kerenkerennen
  in kolabenkulu ka f\u0254 la. J\u0186Y\u0186R\u0186 KA BON KOS\u0190B\u0190- A b\u2019a
  \u0272inin muso ni den ani denbaya \u0272etaa minisiriso ka demen, ani musot\u0254n
  fen o fen te politikit\u0254n ye musow damake\u0272ebaliya n\u2019u ka faantanya
  keleli la. \u019dinan masalakun sugandili ye wele ye ka taa fara\u0272\u0254g\u0254nkan
  ma, min b\u2019a to an be se ka geleyaw yelema ka ke herew ye ani ka yelema \u0272uman
  don ce ni muso fila bee dabolo la. Don kerenkerennen in masalakun be musow j\u0254y\u0254r\u0254
  d\u0254g\u0254ya kof\u0254 kosebe benkantakuluw k\u0254n\u0254 forobakow ni politikikow
  la. Kas\u0254r\u0254, musow ni denmisenw j\u0254y\u0254r\u0254 ka bon kosebe sendonni
  na ani j\u0254y\u0254r\u0254\u0272ininninaw senk\u0254r\u0254madonni na politiki
  nasira la. Nka, olu de kelen don denkerefew ye j\u0254y\u0254r\u0254kow ni benkanta
  temensiraw k\u0254n\u0254. Dan sigilen don j\u0254y\u0254r\u0254w ni benkantakuluw
  las\u0254r\u0254li la u bolo. Ka fara o kan, kolabenkulu ka f\u0254 la, kas\u0254r\u0254
  f\u0254\u0272\u0254g\u0254nk\u0254w k\u0254l\u0254l\u0254ba be musow kan. U lakananni
  f\u0254\u0272\u0254g\u0254nk\u0254w k\u0254n\u0254 ani u sendonni ben ni lafiya
  s\u0254r\u0254li hakililaw la ani f\u0254\u0272\u0254g\u0254nk\u0254w dalasali la,
  wolomani \u0272esinnen b\u2019u ma. Politiko, s\u0254r\u0254 ni hadamadenya ani
  seko ni d\u0254nko cogoya be ka balan da musow ni denmisenw sendonni \u0272e ben
  ni lafiya s\u0254r\u0254li ani politiki temensiraw las\u0254r\u0254li la, ka dinge
  dunba senni fasodenw ka la\u0272ininw ni ketaw ani mara kecogo jaabiw ce. A gerente
  d\u0254w ye wariko, denmisenninw donni furu la joona, garijege s\u0254r\u0254li
  joona, kalanbaliya, \u0272angatawalew ka \u0272esin musow ma, ani musow yere dabaliya
  \u0272\u0254g\u0254n na. Nin gerente minnu be u ka kalanko fana na, o k\u0254l\u0254l\u0254
  juguba ye kunnafoni las\u0254r\u0254baliya ye u fe, u ka fesefeseli sekow jirali
  la kuma\u0272\u0254g\u0254nw kene kan. Nin gerente ninnu sababu ye hadamadenya ani
  seko ni d\u0254nko doni girinya y\u2019u kan, ka fara laadaw doni kan musow ni musomanninw
  kan an sigidaw la. Mali k\u0254n\u0254, jekulu min \u0272esinnen be kunnafoniw kafoli
  ma baaraw feereko ani jatew s\u0254r\u0254li ma ce ni muso kan, o y\u2019a jira,
  ko muso hake te temen 28,1% kan foroba cakedaw la. O jate min f\u0254len file jamana
  kan, damake\u0272ebaliya min be ce ni muso ce sugandiliko la ka bila j\u0254y\u0254r\u0254w
  la, o t\u2019o la. Muso t\u0254g\u0254ladon la\u0272enamayali, be s\u0254n k\u2019a
  to, dabali j\u0254nj\u0254nw ka tige o damake\u0272ebaliya filiw latilenni na. O
  be ke ni kalan, musow tali baaraw la ani balan minnu dalen b\u2019u \u0272e hadamadenya
  ni seko ni d\u0254nko fe, k\u2019o walon ka b\u0254 yen ; misali la, i n\u2019a
  f\u0254 musow balili taamaw na. La\u0272inin fana ye musow sugandili ye ka ke maray\u0254r\u0254w
  g\u0254fereneriw ye ani k\u2019u ke jamana ka hakew lafasabaaw ye ; n\u2019o ye
  porokireriw ye tubabukan na. U sugandili ka ke jamana t\u0254g\u0254la lasigidenw,
  perefew ani baarakekuluw \u0272em\u0254g\u0254w (sefu de kabine) ye. Damake\u0272ebaliya
  dabilali ce ni muso ce, o kuntilennaseben ka kan ka waleya a \u0272ema ani cogoya
  \u0272uman na Mali kalata temensiraw, politikiko yelemaw ani mara k\u0254n\u0254.
  O be s\u0254n ka ke sababu ye, damake\u0272ebaliya min be ce ni muso ce, k\u2019o
  dabila, ka musow ni musomanninw ka senyerek\u0254r\u0254 \u0272etaa sabati, damake\u0272e
  ka se ka don u ce. Don kerenkerenni muso t\u0254g\u0254 la di\u0272e k\u0254n\u0254,
  o ka kan ka bange yelema \u0272uman donni na musow ka politikiko sank\u0254r\u0254tali
  la, ani u sendonni forobakow la. O siratige la, damakasili bena ke ka \u0272esin
  benkantalaw ma, min b\u2019a to sariya n\u00b0 2015-052 min tara desanburukalo tile
  18 san 2015, o ka se ka waleya. O sariya in de be ce ni muso damake\u0272eni dabaliw
  \u0272etaa kof\u0254, j\u0254y\u0254r\u0254w las\u0254r\u0254li la kalataw ni sugandiliw
  fe. Wulikaj\u0254ba bena ke o sariya in carinni kama. Musow aw ni seli duman Mali
  k\u0254n\u0254 an\u2019a k\u0254kan ! Mariyamu A. TARAWELE et\\nD\u0254kala Yusufu
  Jara\\nMinisiriw ka t\u025bm\u025bnni k\u0254f\u025b, Zenerali dediwis\u0254n Abudulayi
  Mayiga tun ye m\u0254g\u0254 welelen ye Mali Kura Taasira 3 j\u025bmukan k\u025bn\u025b
  kan telewis\u0254nsoba la sibiri t\u025bm\u025bnnen in na, ka j\u025bmukan in sigili
  kunc\u025b. Minisiri\u0272\u025bm\u0254g\u0254 da sera sisan masalakun g\u025bl\u025bn
  caman ma, j\u0254y\u0254r\u0254 saba b\u2019ale min kelen .\\nKunnafoni, numeriki
  s\u0254r\u0254 ni fanga ka baara y\u025bl\u025bma kura minisiri tun ye m\u0254g\u0254
  welelen ye Mali Kura Taasira 3 j\u025bmukan k\u025bn\u025b kan, min lab\u025bnna
  Mali kunnafoni lat\u025bm\u025bnni n\u2019a gansili cak\u025bda (SMTD) la Kati sira
  la. O cogoya la, Alihamudu Agi Iliy\u025bni da sera ko j\u0254nj\u0254nba saba ma,
  minnu b\u2019a k.\\nFuru \u0272\u0254g\u0254n fatuli ye ko ye, min degun ka bon
  kos\u025bb\u025b an sigida la furusira k\u0254n\u0254 c\u025byanfan ani musoyanfan.
  Wa furu kura s\u0254r\u0254li a tigilam\u0254g\u0254 d\u0254 f\u025b, o ka g\u025bl\u025bn
  n\u2019a t\u0254 b\u025b\u025b ye, ka da hakilila juguw kan.\\nMali furanc\u025blafanga
  jamanakuntigi Zenerali darim\u025b Asimi Goyita, tarata, sariya n\u00b02025-029/
  min tara zuluyekalo tile 08 san 2025 y\u025bl\u025bma donni na furanc\u025blafanga
  taabolo la, o waleyali yamaruya di, a ma d\u0254g\u0254kun kelen b\u0254 bulonba
  j\u025bnnen k\u0254 n\u2019a ye..\\nAla kana a k\u025b, n\u2019o t\u025b ni jisonko
  k\u025bra, denbaya d\u0254w b\u025b u sigiy\u0254r\u0254w bila. D\u0254w y\u025br\u025b
  fana b\u2019u sigi ka Ala mak\u0254n\u0254, ko a mana \u0272\u025b cogo min na.\\nTaamako
  cak\u025bdaw ka f\u0254 la, kasaara seereyas\u025bb\u025bn (PV) dilanni de b\u025b
  waati jan ta. O de kos\u0254n k\u2019u b\u025b se ka d\u0254 da kalo kan tuma d\u0254w
  la fo ka se san ma, k\u2019a s\u0254r\u0254 asurelen ma bila a hak\u025b k\u0254n\u0254.\"",
  "\"N\u0190G\u0190B\u0186\\nF\u0254l\u0254f\u0254l\u0254 numuw tun b\u025b n\u025bg\u025b
  b\u0254 dugukolo juk\u0254r\u0254 cogo di? Numuc\u025b tun b\u025b taga kongokolo
  k\u0254n\u0254 ka yaala ka y\u0254r\u0254w fl\u025b fl\u025b. A b\u025b se y\u0254r\u0254
  d\u0254 la, a b\u025b n\u025bg\u025b kasa m\u025bn. A b\u025b n\u025bg\u025b tamasiy\u025bn
  ye kulu kan i n\u2019a f\u0254 sisi finman. A b\u025b n\u025bg\u025b nyanyini kas\u0254r\u0254
  ka numu t\u0254w wele k\u2019o dinga sogin. O b\u025b dinga sogin f\u0254 ka taga
