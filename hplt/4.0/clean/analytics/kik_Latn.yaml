  k\u0169ringana na ma\u0169nd\u0169 mar\u0129a mageka h\u0129nd\u0129 ya M\u0169thenya
  wa G\u0169tuan\u0129ra.\\nM\u0169thenya wa G\u0169tuan\u0129ra n\u0129 \u0169kaahe
  and\u0169 bilioni nying\u0129 mweke wao wa mbere wa kw\u0129ruta ig\u0169r\u0169
  r\u0129gi\u0129 wendi wa Ngai na g\u0169t\u0169\u0169ra k\u0169ringana naguo. \u0168guo
  n\u0129 kuuga at\u0129 \u0169rutani m\u0169nene m\u0169no n\u0129\u0169gakor\u0169o
  \u0169g\u0129thi\u0129 na mbere. \u2018And\u0169 ar\u0129a magat\u0169\u0169raga
  mab\u0169r\u0169ri [ma th\u0129] magait\u0129ka kw\u0129ruta \u0169horo wa \u0169thingu.\u2019
