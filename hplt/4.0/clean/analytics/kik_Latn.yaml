  k\u0129nene, k\u0129er\u0169, o nake \u0169r\u0129a wag\u0129ikar\u0129ire, nayo
  th\u0129 o na ig\u0169r\u0169 ik\u0129\u0169r\u0129ra \u0169thi\u0169 wake, g\u0169k\u0129aga
  k\u0169r\u0129a ing\u0129ikara. Ning\u0129 ng\u0129ona ar\u0129a maanakua, o ar\u0129a
  anene na ar\u0129a anyinyi, mar\u0169ngi\u0129 mbere ya g\u0129t\u0129 k\u0129u
  g\u0129a \u0169thamaki; na g\u0169k\u0129hing\u0169r\u0169o mabuku. O nar\u0129o
  ibuku r\u0129ng\u0129 r\u0129k\u0129hing\u0169r\u0169o, n\u0129r\u0129o ibuku r\u0129a
