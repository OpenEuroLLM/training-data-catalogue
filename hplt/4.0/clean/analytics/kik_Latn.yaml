  kwa ihinda ria kiumia kiwme iguru rigie ciiko ciako cia wamukiri mahaki kuuma kuri
  ngari cia ukui barabara-ini nene ya kuuma Thika guthii Garissa, kuria marahobanirio
  na kimanjika kia makiria ma ngiri 12,000 mbeca iria EACC yugite ni cia mahaki.\\nMungururirio
  uyu wa kuhitana na maabitha a borithi na makiria aria makoretwo makiamukira heheto
  kuuma kuri muingi honge-ini itiganite wambiririo kunyitithio thing\u2019a ni ruhonge
