sample: '["\"1I, Paul, am writing this letter. Silas and Timothy join me in writing.\\nWe
  are sending this letter to you, the members of the church in Thessalonica. You belong
  to God the Father and the Lord Jesus Christ.\\nMay grace and peace be given to you.\\nPaul
  Gives Thanks for the Thessalonians\u2019 Faith\\n2We always thank God for all of
  you. We keep on praying for you. 3We remember you when we pray to our God and Father.
  Your work is produced by your faith. Your service is the result of your love. Your
  strength to continue comes from your hope in our Lord Jesus Christ.\\n4Brothers
  and sisters, you are loved by God. We know that he has chosen you. 5Our good news
  didn\u2019t come to you only in words. It came with power. It came with the Holy
  Spirit\u2019s help. He gave us complete faith in what we were preaching. You know
  how we lived among you for your good. 6We and the Lord were your examples. You followed
  us. You welcomed our message even when you were suffering terribly. You welcomed
  it with the joy the Holy Spirit gives. 7So you became a model to all the believers
  in the lands of Macedonia and Achaia. 8The Lord\u2019s message rang out from you.
  That was true not only in Macedonia and Achaia. Your faith in God has also become
  known everywhere. So we don\u2019t have to say anything about it. 9The believers
  themselves report the kind of welcome you gave us. They tell about how you turned
  away from statues of gods. And you turned to serve the living and true God. 10They
  tell about how you are waiting for his Son to come from heaven. God raised him from
  the dead. He is Jesus. He saves us from God\u2019s anger, and his anger is sure
  to come.\\n11:1 At\u0169m 2:24; Arom 1:18N\u0129 ithu\u0129 Pa\u0169l\u0169 na Sila,
  na Timotheo,\\nTwand\u0129k\u0129ra kanitha wa Athesalonike mar\u0169a maya \u0169r\u0129a
  \u0169r\u0129 th\u0129in\u0129 wa Ngai Ithe wit\u0169 o na Mwathani Jes\u0169 Krist\u0169.\\nWega
  na thay\u0169 wa Ngai irog\u0129a na inyu\u0129.\\nG\u0169cookia Ngaatho n\u0129
  \u0169nd\u0169 wa W\u0129t\u0129kio wa Athesalonike\\n21:2 Arom 1:8; Arom 1:10N\u0129t\u0169cookag\u0129ria
  Ngai ngaatho h\u0129nd\u0129 ciothe n\u0129 \u0169nd\u0169 wanyu inyuothe, t\u0169k\u0129m\u0169gwetaga
  mahooya-in\u0129 mait\u0169. 31:3 Agal 5:6; 1Athe 3:6R\u0129r\u0129a t\u0169k\u0169m\u0169hoera
  t\u0169r\u0129 mbere ya Ngai o we Ithe wit\u0169-r\u0129, n\u0129t\u0169ririkanaga
  t\u0169teg\u0169tigith\u0129ria w\u0129ra wanyu \u0169r\u0129a uuman\u0129te na
  gw\u0129t\u0129kia, na kw\u0129nogia kwanyu k\u0169r\u0129a k\u0169rehagwo n\u0129
  wendani, o na g\u0169kir\u0129r\u0129ria kwanyu, k\u0169r\u0129a kuuman\u0129te
  na k\u0129\u0129r\u0129g\u0129r\u0129ro th\u0129in\u0129 wa Mwathani wit\u0169 Jes\u0169
  Krist\u0169.\\n41:4 Akol 3:12N\u0129g\u0169korwo, ari\u0169 na aar\u0129 a Ithe
  wit\u0169 inyu\u0129 mwendetwo n\u0129 Ngai, ithu\u0129 n\u0129t\u0169\u0169\u0129
  at\u0129 n\u0129mwathuurirwo n\u0129we, 5tond\u0169 \u0168horo-\u0169r\u0129a-Mwega
  t\u0169hunjagia, t\u0169tiam\u0169reheire \u0169r\u0129 o ciugo theri, no twam\u0169reheire
  \u0169r\u0129 na hinya, na \u0169r\u0129 na Roho M\u0169theru, o na \u0169r\u0129
  na ihooto itang\u0129thanganio. Ning\u0129 inyu\u0129 n\u0129m\u0169\u0169\u0129
  \u0169r\u0129a twaikaraga na inyu\u0129 n\u0129 \u0169nd\u0169 wa k\u0169m\u0169guna.
  61:6 1Akor 4:16; At\u0169m 17:5-10; 2Akor 6:10Inyu\u0129 mwatu\u0129kire a kw\u0129gerekania
  na ithu\u0129, o na m\u0169g\u0129tu\u0129ka a kw\u0129gerekania na Mwathani, o
  na g\u0169tu\u0129ka mwar\u0129 na m\u0129nyamaro m\u0129ing\u0129, n\u0129mwam\u0169k\u0129rire
  \u0169horo wake m\u0169r\u0129 na g\u0129keno k\u0129r\u0129a k\u0129heanagwo n\u0129
  Roho M\u0169theru. 71:7 1Tim 4:12Na n\u0129 \u0169nd\u0169 \u0169cio m\u0169g\u0129tu\u0129ka
  k\u0129onereria k\u0169r\u0129 and\u0169 ar\u0129a othe met\u0129k\u0129tie k\u0169u
  Makedonia, o na Akaia. 81:8 Arom 1:8Naguo \u0169horo wa Mwathani n\u0129wahunjire
  uum\u0129te k\u0169r\u0129 inyu\u0129, na to Makedonia na Akaia gwiki, no r\u0129r\u0129,
  o na w\u0129t\u0129kio wanyu th\u0129in\u0129 wa Ngai n\u0129\u0169menyekete k\u0169nd\u0169
  guothe. N\u0129 \u0169nd\u0169 \u0169cio t\u0169tibataire kuuga \u0169nd\u0169 \u0169horo-in\u0129
  \u0169cio, 91:9 1Akor 12:2; Math 16:16n\u0129g\u0169korwo and\u0169 o ene n\u0129o
  maheanaga \u0169horo wa \u0169r\u0129a mwat\u0169nyiitire \u0169geni. N\u0129maheanaga
  \u0169horo wa \u0169r\u0129a mwagar\u0169r\u0169k\u0129ire Ngai, m\u0169g\u0129tigana
  na m\u0129hianano n\u0129guo m\u0169tungatag\u0129re Ngai \u0169r\u0129a \u0169r\u0129
  muoyo na \u0169r\u0129a wa ma, 10na mwetag\u0129r\u0129re M\u0169ri\u0169 oime ig\u0169r\u0169,
  \u0169r\u0129a aari\u0169kirie kuuma k\u0169r\u0129 ar\u0129a aku\u0169, nake n\u0129we
  Jes\u0169, \u0169r\u0129a \u0169t\u0169honokagia kuuma k\u0169r\u0129 mang\u02bc\u0169r\u0129
  mar\u0129a magooka.\"", "\"Mundumurume wa ukuru wa miaka 27 na uria wekinyirie mbere
  ya maavitha a vorithi vuva wa ndumiriri kuuga ari umwe wa ekuirwa mugwanja a ntharikiro
  cia ugaidi niurekereretwe.\\nMundumurume uyu na uria uramenyekana ta Robert Gathongo
  Ngunjiri ekinyirie mbere ya maavitha a vorithi muthenya wa alamisi vuva wa mbica
  yake kuthiururuka ni umwe wa aria maavitha a vorithi maracarania nao.\\nKomanda
  wa sub-county ya Nyeri Paul Kuria na uria wiigite varaca na ndeto ino augite ndeto
  iria irakuruvania Ngunjiri na ugaidi itiaumire oviciri yake nwati oviciri ya maavitha
  a kuthuthuria wiki nai [DCI].\\nWauguo Kuria augite mundumurume uyu athitagitwe
  na mavitia ma wii wa kiavinya mwaka wa 2014 nwati akirekererwa vuva wa gucokia cira
  riko.\\nNa riu athuthuria a wiki nai maracarania na Abdurahman Hija na ritwa ria
  gutwirwa Mnubi na uria wikaraga kauntiri ya Nyeri na uria urekuirwa gukorwa ari
  umwe wa ekuirwa a ugaidi tauniri ya Nyeri.\\nHija wauguo arekuirwa gukorwa atorokere
  Somalia na kwiingiria gikundiri kia Al-shabaab mbere ya acokete vururi wa Kenya
  mwaka wa 2016.\\nMaavitha a kuthuthuria eki nai wauguo maraugite Ngunjiri ari umwe
  wa ekuirwa anana na aria matumitwe ni gikundi kia Al-shabaab vururiri wa Kenya niguo
  kunyita andu migwate.\\nEkuirwa engi aria maracaranwa nao ni Abdikadir Mohamed Abdikadir
  na uria arerikana gukorwa agikiruvanwa na kuvanga ntharikiro cia Dusit mwaka wa
  2019 na 2020 wa undumwe na ,Peter Gichungu, Mohamud Abdi, Kassim Musa, Mohamed Ali
  Hussein, Ahmed Mohamed, na Erick Njoroge.\\n-Mwende Jackie\\n-Mbica irutitwe online\"",
  "\"President William Ruto kuhuthira iceera riake Bururi-ini wa Japan hari kuuha
  aigithia bururi-ini ucio guuka guku bururi-ini na kuigithia kuo.\\nWritten by Kayu
  Digital Team on February 8, 2024\\n- NAIROBI & ENVIRONS 91.0 | MT KENYA REGION 91.1FM\\nPresident
  William Ruto niathiite na mbere na kuhuthira iceera riake Bururi-ini wa Japan hari
  kuuha aigithia bururi-ini ucio guuka guku bururi-ini na kuigithia kuo. President
  hamwe na minister wa Wonjoria Rebecca Miano makirira onjoria a bururi ucio riera
  riega ria wuigithia. Miano akigathiriria bururi wa kenya na njira nene na makiria
  thiini wa wonjoria.\"", "\"Ona gutuika mbura nene iria ikoretwo igithii nambere
  kura icigo ngurani guku bururi-ini ni ironeka guthii ikihugagia ,aikari a icigo
  itiganite cia bururi matigitwo magitara hathara nene thutha wa muiyuro wa maii guthukangia
  nyumba,migunda ona gutiga andu aingi makuite.\\nItuura-ini ria Kirima ward-ini ya
  Kiamaina thiini wa gicigo kia umbunge kia Bahati county ya Nakuru aikari maraikara
  na guoya wa kuhingiririo micii-ini thutha wa barabara iria mahuthagira gutuika undu
  uria urituhitie migendere mwena ucio.\"", "\"TH\u0128IN\u0128 wa Bibilia yaku-r\u0129,
  Thaburi 83:18 \u0129ta\u0169r\u0129two at\u0129a? Bibilia ya G\u0129k\u0169y\u0169
  yugaga \u0169\u0169: \u201cN\u0129guo mamenye at\u0129 wee, o wee w\u0129tagwo JEHOVA,
  nowe wiki \u0168r\u0129a-w\u0129-Ig\u0169r\u0169-M\u0169no o ig\u0169r\u0169 r\u0129a
  th\u0129 yothe.\u201d \u0168ta\u0169ri \u0169ng\u0129 wa Bibilia uugaga \u0169nd\u0169
  \u0169haanaine na \u0169cio. No r\u0129r\u0129, ata\u0169ri aing\u0129 matih\u0169thag\u0129ra
  r\u0129\u0129twa Jehova, ithenya r\u0129a \u0169guo mah\u0169thag\u0129ra mar\u0129\u0129twa
  ma \u0169nene ta \u201cMwathani\u201d kana \u201cNgai.\u201d N\u0129 r\u0129\u0129twa
  r\u0129r\u0129k\u0169 r\u0129ag\u0129r\u0129ir\u0169o g\u0169kor\u0169o m\u0169hari-in\u0129
  \u0169cio? N\u0129 r\u0129\u0129twa r\u0129a \u0169nene \u0129 kana n\u0129 r\u0129\u0129twa
  Jehova?\\nM\u0169hari \u0169cio \u0169raria \u0169horo wa r\u0129\u0129twa r\u0129o
  r\u0129ene. Th\u0129in\u0129 wa K\u0129hibirania g\u0129a tene k\u0129r\u0129a k\u0129ah\u0169th\u0129rir\u0169o
  kwand\u0129ka g\u0129cunj\u0129 k\u0129nene k\u0129a Bibilia-r\u0129, r\u0129\u0129twa
  r\u0129a mwanya r\u0129a Ngai we mwene n\u0129r\u0129o r\u0129koragwo ho. R\u0129and\u0129kagwo
  \u0169\u0169 na ndemwa cia K\u0129hibirania: \u05d9\u05d4\u05d5\u05d4 (YHWH). R\u0129\u0129twa
  r\u0129u na G\u0129k\u0169y\u0169 kaing\u0129 r\u0129and\u0129kagwo \u201cJehova.\u201d
  R\u0129\u0129twa r\u0129u hihi r\u0129onekaga th\u0129in\u0129 wa m\u0169hari o
  \u0169mwe tu wa Bibilia? Aca. R\u0129onekaga th\u0129in\u0129 wa Maand\u0129ko ma
  K\u0129hibirania ma tene hakuh\u0129 maita 7,000!\\nR\u0129\u0129twa r\u0129a Ngai
  n\u0129 r\u0129a bata at\u0129a? Ta w\u0129cirie \u0169horo wa ihoya r\u0129r\u0129a
  Jesu Kristo aaheanire r\u0129 ta k\u0129onereria. R\u0129ambag\u0129r\u0129ria \u0169\u0169:
  \u201cIthe wit\u0169 w\u0129 ig\u0169r\u0169, r\u0129\u0129twa r\u0129aku n\u0129r\u0129am\u0169r\u0169o.\u201d
  (Mathayo 6:9) Thutha-in\u0129 Jesu aahoire \u0169\u0169 k\u0169r\u0129 Ngai: \u201cAwa,
  k\u0129goocithie r\u0129\u0129twa r\u0129aku.\u201d Ngai aam\u0169cokeirie akiuga
  \u0169\u0169 kuuma ig\u0169r\u0169: \u201cN\u0129nd\u0129r\u0129goocith\u0129tie,
  o na n\u0129ngar\u0129goocithia r\u0129ng\u0129.\u201d (Johana 12:28) Hatar\u0129
  nganja-r\u0129, r\u0129\u0129twa r\u0129a Ngai n\u0129 r\u0129a bata m\u0169no ma.
  No n\u0129 k\u0129\u0129 g\u0129g\u0129t\u0169m\u0129te ata\u0169ri amwe maage k\u0169h\u0169th\u0129ra
  r\u0129\u0129twa r\u0129u th\u0129in\u0129 wa \u0169ta\u0169ri wao wa Bibilia, na
  hand\u0169 ha r\u0129o makah\u0169th\u0129ra mar\u0129\u0129twa ma \u0169nene?\\nK\u0169roneka
  ta k\u0169r\u0129 na it\u0169mi ig\u0129r\u0129 njega. K\u0129a mbere, and\u0169
  aing\u0129 moigaga at\u0129 r\u0129\u0129twa r\u0129u r\u0129tiag\u0129r\u0129ire
  k\u0169h\u0169th\u0129r\u0169o tond\u0169 \u0169m\u0169th\u0129 g\u0169ti\u0169\u0129kaine
