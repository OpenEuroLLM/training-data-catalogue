  Felix Koskei na Munene wa borithi Japheth Koome gukinyiriria ritana kuri borithi
  matigane na ciiko ici kaiamana.\"", "\"WEE w\u0129ciragia m\u0169thenya wa g\u0169tuan\u0129ra
