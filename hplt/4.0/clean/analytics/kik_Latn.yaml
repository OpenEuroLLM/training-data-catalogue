  ciake itikagu\u0169rio.\\n21 No m\u0169nd\u0169 o wothe w\u0129kaga ma\u0169nd\u0169
  mar\u0129a mag\u0129r\u0129ire n\u0129 okaga \u0169theri-in\u0129, n\u0129guo ci\u0129ko
  ciake imenyeke at\u0129 ci\u0129k\u0129two k\u0169ringana na wendi wa Ngai.\u201d\\n22
  Thutha \u0169cio, Jesu na arutwo ake mag\u0129thi\u0129 Judea m\u0129g\u0169nda-in\u0129,
  na ag\u0129ikara nao k\u0169u kwa ihinda, na n\u0129 aabatithanagia.\\n23 No Johana
  o nake n\u0129 aabatithanagia th\u0129in\u0129 wa Ainoni hakuh\u0129 na Salimu,
  tond\u0169 k\u0169u n\u0129 kwar\u0129 na ma\u0129 maing\u0129, na and\u0169 n\u0129
  maathiaga na makabatithio;\\n24 n\u0129 g\u0169kor\u0169o h\u0129nd\u0129 \u0129yo
  Johana ndaaik\u0129tio korokoro-in\u0129.\\n25 Na r\u0129r\u0129, arutwo a Johana
  mak\u0129g\u0129a ngarari na M\u0169yahudi \u0169mwe ig\u0169r\u0169 r\u0129gi\u0129
  gw\u0129theria.\\n26 Thutha \u0169cio mag\u0129thi\u0129 k\u0169r\u0129 Johana mak\u0129mw\u0129ra:
  \u201cRabii, m\u0169nd\u0169 \u0169r\u0129a mwar\u0129 nake m\u0169r\u0129mo wa
  Jorodani, \u0169r\u0129a wee warutire \u0169ira ig\u0169r\u0169 r\u0129ake, n\u0129
  arabatithania, na and\u0169 othe marathi\u0129 k\u0169r\u0129 we.\u201d\\n27 Nake
  Johana ak\u0129macokeria ak\u0129meera: \u201cM\u0169nd\u0169 ndang\u0129g\u0129a
  na k\u0129nd\u0169 o na k\u0129mwe tiga aheir\u0169o kuuma ig\u0169r\u0169.\\n28
  Inyu\u0129 ene m\u0169r\u0129 aira a \u0169r\u0129a ndoigire at\u0129, \u2018Ti
  ni\u0129 Kristo, \u0129nd\u0129 n\u0129 g\u0169t\u0169mwo nd\u0169m\u0129two nj\u0169ke
  mbere yake.\u2019\\n29 M\u0169nd\u0169 o wothe \u0169r\u0129 na m\u0169hiki n\u0129we
  m\u0169hikania. No r\u0129r\u0129a m\u0169rata wa m\u0169hikania aar\u0169gama hakuh\u0129
  nake na aigua ak\u0129aria, n\u0129 akenaga m\u0169no n\u0129 k\u0169igua m\u0169gambo
  wa m\u0169hikania. N\u0129 \u0169nd\u0169 \u0169cio, g\u0129keno g\u0129akwa n\u0129
  g\u0129kinyan\u0129ru.\\n30 \u0168cio no m\u0169haka athi\u0129 na mbere kuongerereka,
  \u0129nd\u0129 ni\u0129 no m\u0169haka thi\u0129 na mbere k\u0169nyiha.\u201d\\n31
  \u0168r\u0129a um\u0129te ig\u0169r\u0169 akoragwo ar\u0129 m\u0169nene g\u0169k\u0129ra
  ar\u0129a ang\u0129 othe. \u0168r\u0129a um\u0129te th\u0129 oim\u0129te th\u0129in\u0129
  wa th\u0129 na aragia ma\u0169nd\u0169 ma th\u0129. \u0168r\u0129a um\u0129te ig\u0169r\u0169
  akoragwo ig\u0169r\u0169 r\u0129a ar\u0129a ang\u0129 othe.\\n32 Arutaga \u0169ira
  ig\u0169r\u0169 r\u0129a ma\u0169nd\u0169 mar\u0129a onete na akaigua, no g\u0169tir\u0129
  m\u0169nd\u0169 w\u0129t\u0129kag\u0129ra \u0169ira wake.\\n33 M\u0169nd\u0169 o
  wothe w\u0129t\u0129k\u0129r\u0129te \u0169ira wake n\u0129 et\u0129k\u0129r\u0129te
  at\u0129 Ngai n\u0129 wa ma.\\n34 N\u0129 g\u0169kor\u0169o \u0169r\u0129a \u0169t\u0169m\u0129two
  n\u0129 Ngai aragia ciugo cia Ngai, tond\u0169 We aheanaga roho ateg\u0169thima.\\n35
  Ithe n\u0129 endete M\u0169ri\u0169 na n\u0129 am\u0169heete \u0169nene ig\u0169r\u0169
  r\u0129a indo ciothe.\\n36 \u0168r\u0129a wonanagia w\u0129t\u0129kio har\u0129
  M\u0169ri\u0169 ar\u0129 na muoyo wa tene na tene; \u0169r\u0129a \u0169taath\u0129kag\u0129ra
  M\u0169ri\u0169 ndakoona muoyo, \u0129nd\u0129 marakara ma Ngai mat\u0169\u0169raga
  ig\u0169r\u0169 r\u0129ake.\"", "\"Maabithaa 4 kurugama mbauini umuthi thutha wa
  kuhobanirio makiamukira mahaki barabaraini\\nWritten by Kayu Digital Team on October
  9, 2023\\n- NAIROBI & ENVIRONS 91.0 | MT KENYA REGION 91.1FM\\nMabithaa ana a borithi
  a ruhonge rwa traffick nimatanyitwo gukinyio igoti-ini umuthi uua ri thutha wao
