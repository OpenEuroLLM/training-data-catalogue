  mwaganu ang\u0129igu\u0129r\u0169o tha-r\u0129, ndang\u0129\u0129ruta \u0169horo
  wa \u0169thingu; o na ar\u0129 b\u0169r\u0169ri \u0169r\u0129a w\u0129kagwo ma\u0169nd\u0169
  ma \u0169thingu-r\u0129, no gw\u0129ka ar\u0129\u0129kaga and\u0169 ma\u0169nd\u0169
  moru, na ndar\u0129 hingo akona \u0169karu wa Jehova.\u201d And\u0169 acio aganu
  makaninwo kaimana h\u0129nd\u0129 \u0129o ya M\u0169thenya wa G\u0169tuan\u0129ra.\\nM\u0169thenya
  \u0169cio wa G\u0169tuan\u0129ra \u0169g\u0129\u0169ka g\u0169thira-r\u0129, and\u0169
  ar\u0129a magaakor\u0169o matigar\u0129te \u2018magaacoka muoyo\u2019 k\u0169na
  mar\u0129 and\u0169 akinyan\u0129ru. (K\u0169gu\u0169r\u0129rio 20:5) Kwoguo h\u0129nd\u0129
  ya M\u0169thenya wa G\u0169tuan\u0129ra and\u0169 n\u0129 magaacokerio \u0169kinyan\u0129ru
  \u0169r\u0129a maar\u0129 naguo mbere. (1 Akorintho 15:24-28) G\u0169gaacoka k\u0169g\u0129e
  na igerio r\u0129a m\u0169thia. Shaitani n\u0129 akaarekererio kuuma k\u0129oho-in\u0129
  g\u0129ake na et\u0129k\u0129rio agerie k\u0169h\u0129tithia and\u0169 rita r\u0129mwe
  r\u0129a m\u0169thia. (K\u0169gu\u0169r\u0129rio 20:3, 7-10) Ar\u0129a makaaregana
  nake n\u0129 magaakenera k\u0169hingio gwa k\u0129\u0129ran\u0129ro g\u0129k\u0129
  k\u0129a Bibilia: \u201cAr\u0129a athingu n\u0129o makagaya th\u0129, na g\u0169t\u0169\u0169ra
  mam\u0129t\u0169\u0169re o nginya tene.\u201d (Thaburi 37:29) \u0128\u0129, M\u0169thenya
  wa G\u0169tuan\u0129ra \u0169gakor\u0169o \u0169r\u0129 k\u0129rathimo k\u0169r\u0129
  and\u0169 othe ehokeku!\\n^ kib. 1 Ha \u0169horo w\u0129gi\u0129 Hari-Magedoni rora
