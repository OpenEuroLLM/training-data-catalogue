  mar\u0129a maand\u0129k\u0129two mabuku-in\u0129 macio, o k\u0169ringana na ma\u0169nd\u0169
  mao mar\u0129a maaneka.\u201d M\u0169tuan\u0129ri \u0169cio \u0169gwetetwo hau n\u0169\u0169?\\nJehova
  Ngai n\u0129we M\u0169tuan\u0129ri cira \u0169r\u0129a m\u0169nene bi\u0169 wa and\u0169.
  No we n\u0129ahean\u0129te w\u0129ra \u0169cio wa g\u0169tu\u0129ra and\u0169 cira.
  K\u0169ringana na At\u0169mwo 17:31, m\u0169t\u0169mwo Paulo oigire at\u0129 Ngai
  \u201cn\u0129 g\u0169tua atu\u0129te m\u0169thenya \u0169r\u0129a agatu\u0129ra
  and\u0169 cira na k\u0129hooto, ar\u0129a mat\u0169ire g\u0169k\u0169 th\u0129 guothe,
  na \u0169nd\u0169 wa M\u0169nd\u0169 \u0169r\u0129a athur\u0129te.\u201d M\u0169tuan\u0129ri
  \u0169cio \u0169thuur\u0129two n\u0129 Jesu Kristo \u0169r\u0129a wari\u0169kirio.
  (Johana 5:22) No r\u0129r\u0129, M\u0169thenya wa G\u0169tuan\u0129ra \u0169kaamb\u0129r\u0129ria
  r\u0129? \u0168gaakor\u0169o \u0169igana at\u0129a?\\nIbuku r\u0129a K\u0169gu\u0169r\u0129rio
  r\u0129onanagia at\u0129 M\u0169thenya wa G\u0169tuan\u0129ra \u0169kaamb\u0129r\u0129ria
  thutha wa mbara ya Hari-Magedoni, r\u0129r\u0129a m\u0169tabar\u0129re wa Shaitani
  g\u0169k\u0169 th\u0129 \u0169kaanangwo. * (K\u0169gu\u0169r\u0129rio 16:14, 16;
  19:19\u201320:3) Thutha wa Hari-Magedoni-r\u0129, Shaitani na ndaimono ciake makaahing\u0129r\u0169o
  th\u0129in\u0129 wa irima r\u0129tar\u0129 g\u0129turi kwa ihinda r\u0129a m\u0129aka
  ngiri \u0129mwe. H\u0129nd\u0129 \u0129o ar\u0129a 144,000 a g\u0169thi\u0129 matu-in\u0129
  magatu\u0129ka atuan\u0129ri cira, na \u201cmagathamakaga hamwe na Kristo m\u0129aka
  ngiri.\u201d (K\u0169gu\u0169r\u0129rio 14:1-3; 20:1-4; Aroma 8:17) M\u0169thenya
  wa G\u0169tuan\u0129ra ti \u0169nd\u0169 \u0169geekwo na ihenya th\u0129in\u0129
  wa mathaa 24. N\u0129 ihinda r\u0129a m\u0129aka ngiri \u0129mwe.\\nH\u0129nd\u0129
  \u0129o ya m\u0129aka ngiri-r\u0129, Jesu Kristo \u2018agaacirithia and\u0169 ar\u0129a
  mar\u0129 muoyo o na ar\u0129a maku\u0129te.\u2019 (2 Timotheo 4:1) \u201cAnd\u0169
  ar\u0129a mar\u0129 muoyo\u201d n\u0129 \u201ck\u0129r\u0129nd\u0129 k\u0129ing\u0129
  m\u0169no\u201d k\u0129r\u0129a g\u0129kaahonoka Hari-Magedoni. (K\u0169gu\u0169r\u0129rio
  7:9-17) M\u0169t\u0169mwo Johana ning\u0129 n\u0129oonire \u201car\u0129a maanakua
  . . . mar\u0169gam\u0129te mbere-in\u0129 ya g\u0129t\u0129 k\u0129r\u0129a g\u0129a
  \u0169thamaki\u201d g\u0129a g\u0169tuan\u0129ra. O ta \u0169r\u0129a Jesu eeran\u0129ire-r\u0129,
  \u201car\u0129a othe me th\u0129in\u0129 wa mb\u0129r\u0129ra makaigua m\u0169gambo
  [wa Kristo], na moime kuo\u201d na nj\u0129ra ya k\u0169ri\u0169kio. (Johana 5:28,
  29; At\u0169mwo 24:15) No magaatu\u0129r\u0169o k\u0169ringana na ma\u0169nd\u0169
  mar\u0129k\u0169?\\nK\u0169ringana na k\u0129oneki k\u0129a m\u0169t\u0169mwo Johana-r\u0129,
  \u2018kwahing\u0169rir\u0169o mabuku\u2019 na \u201caku\u0169 mag\u0129tu\u0129r\u0169o
  matu\u0129ro mao na ma\u0169nd\u0169 mar\u0129a maand\u0129k\u0129two mabuku-in\u0129
  macio, o k\u0169ringana na ma\u0169nd\u0169 mao mar\u0129a maaneka.\u201d Mabuku
  macio hihi maand\u0129k\u0129two \u0169horo wa ma\u0169nd\u0169 mar\u0129a and\u0169
  ar\u0129a aku\u0169 meek\u0129te tene? Aca, and\u0169 matigatu\u0129r\u0169o k\u0169ringana
  na ma\u0169nd\u0169 mar\u0129a meekire matanakua. T\u0169menyaga \u0169guo at\u0129a?
  Bibilia yugaga \u0169\u0169: \u201cM\u0169nd\u0169 \u0169r\u0129k\u0129tie g\u0169kua
  \u0169guo n\u0129atu\u0129two m\u0169thingu agatigithanio na w\u0129hia.\u201d (Aroma
  6:7) Kwoguo ar\u0129a makaari\u0169kio magaacoka muoyo matar\u0129 na mehia. N\u0129
  \u0169nd\u0169 \u0169cio no m\u0169haka mabuku macio makor\u0169o monanagia maathani
  mang\u0129 ma Ngai. N\u0129getha and\u0169 ar\u0129a makahonoka Hari-Magedoni na
  ar\u0129a makari\u0169kio mat\u0169\u0169re tene na tene-r\u0129, no nginya magaath\u0129k\u0129ra
