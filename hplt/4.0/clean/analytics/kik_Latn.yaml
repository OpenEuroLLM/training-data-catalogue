  ang\u0129 matu\u0129r\u0169o k\u0169herithio tene na tene. No Bibilia yugaga \u0169nd\u0169
  ng\u0169rani na \u0169cio ig\u0169r\u0169 r\u0129gi\u0129 ihinda r\u0129u. Kiugo
