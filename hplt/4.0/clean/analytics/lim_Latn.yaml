sample: '["\"Nye artikels\\nN\u00e5 navigaty springen\\nN\u00e5 s\u00f6ken springen\\n-
  11:23, 19 jul 2021 Albertkanoal (geskydenisse | bewark) [720 bytes] Daanol (Maked
  d\u00f6\u00e4r et oaversetten van de syde \\\"Albertkanaal\\\") Etiketten: Inholdoaversetting
  ContentTranslation2 oorsprungelik anmaked as \\\"Albertkanaal\\\"\\n- 12:14, 13
  jul 2021 Bj\u00f6rn Kuipers (geskydenisse | bewark) [1.202 bytes] Woolters (Nye
  syde: ''Bj\u00f6rn Kuipers (Oldensaele, 1973) is nen neaderlandsken skeidsrechter
  in et betaald vootbal en underneamer. Hee leidet wedstryden in de Eyredivisy en
  up europeesk niveau. Hee warket altyd med deselvde grensrechters: Sander van Roekel
  en Erwin Zeinstra. == Pers\u00f6\u00f6nlik == Kuipers deade ''Facilitair management''
  studeren an Hougeskole Diedenoort in Wageningen. D\u00e5rup g\u00fcng hee van 1999
  t\u00f6t 2001 n\u00e5r de ...'') Etiket: Visuele tekstverwarker\\n- 19:32, 11 jul
  2021 Sk\u00f6ppingen (geskydenisse | bewark) [2.648 bytes] Woolters (Nye syde: ''''''''Sk\u00f6ppingen''''''
  (D\u00fc\u00fctsk: ''''Sch\u00f6ppingen'''') is ne d\u00fc\u00fctske gemeynde. Et
  ligt in et westelike M\u00fcnsterland in et noordwesten van den deylst\u00e5t Noordryn-Westfalen.
  Et h\u00f6yrt by an Kreis Borken in et regierungsbezirk M\u00fcnster. De gemeynde
  hevt 6820 inwoaners (up 31 december 2018). De gemeynde Sk\u00f6ppingen hevt ne uppervlakde
  van 68,9 km\u00b2, wat slim grout is in verholding med et laege inwoanertal. Med
  ne d\u00f6\u00e4rsneyde l...'')\"", "\"Hallo luuj,\\nNooit gedach det ich mich hie
  nog ins aan uch k\u00f3s veursjtelle. \u2018t Waas tiedes ein intervaltraining in
  \u2018t Dalheimerbos, toen miene fietskammeraod Steffert te Meij mich vroog of ich
  adjudant w\u00f3l waere van de nuje d\u00f3rstlustige hoogheid van de Kaketoes.
  Eerlik gezag waas ich op dees formele vraog al een bietje veurbereid...\\nRudi haaj
  eerder bie mich al ins de temperatuur opgenaome, omdet d\u2019r wit det ich van
  feeste haaj, mer neet zo van die verplichtinge. Ich h\u00f6b \u2018m toen gezag
  det ich hie pas serjeus euver w\u00f3l naodinke es \u2018t ouch ech zo weid waas.\\nIch
  k\u00f3s \u2018t netuurlik neet laote dit thoes ouch al ins veurzichtig in de weik
  te ligke, omdet ich dit neet allein kin besjlisse. Thekla zoog det geliek zitte.
  Toen Rudi mich ein paar waeke later zag det d\u2019r mich neudig haaj, k\u00f3s
  ich geliek z\u00e8gke det d\u2019r op mich k\u00f3s raekene en det veer d\u2019r
  same ein groot fees van gaon make! Get det waal aan \u00f3s is toevertroewt.\\nAls
  aajste broor kin ig Rudi al vanaaf zien geboarte. Hae haet altied teage mig op gekeke,
  noe is der eine kop groter en kiek ig taege hem op.\\nGebaore b\u00f6n ich aan de
  voot van de Galgeberg en op de Heinsbergerwaeg opgegreujt toetdet ich zellef k\u00f3s
  vlege. Ich b\u00f6n same mit mien vruike Thekla gelandj in Melick, wo ver inmiddels
  al ellef jaor wone. Same h\u00f6bbe veer twee prachtige dochters, Luna van 8 en
  Yfke van 5. Mien cente verdeen ich bie Boels verhuur.\\nVeur de miense die \u2018t
  mesjien neet (meer) weite, in 1985 b\u00f6n ich sjoolprins gewaes op de Alfonsusjool.
  Miene spreuk van toen is noe nog d\u00f6ks van toepassing: \u2018Mit Erwin van de
  Kepel, gaeve veer um ein lel. Alaaf.\u2019\\nSjoon det veer eine vastelaovend aan
  de Kepel ins op dees meneer moge mitmake.\\nVastelaovesgroete,\\nAdjudant Erwin\\nBeste
  vastelaovesvierders,\\nSjoon om mich aan uch te moge veursjtelle.\\nMiene naam is
  Marcel Silkens. Ich b\u00f6n 43 jaor geleje \u00f3nger aan de voot van de Galgenberg
  gebaore en nao ein paar jaor 300 maeter wiejer oppe hook van de Heinsbergerwaeg
  en de Petrus Polliussjtraot groot getaoge. Ich b\u00f6n de middelste van de drie
  breurs Silkens.\\nEs oer Kepelse j\u00f3ng ging ich nao de Alfonsussjool, zoot ich
  bie scouting Pater Bleijs en deende ich de m\u00e8s aan de Kepel. Zellefs mien veurtgezat
  \u00f3ngerwies h\u00f6b ich gevolg op \u2018t Sjoolpaad. Noe nog b:on ich sjteunend
  lid van de Kepelse motorklup MCCA.\\nNao 32 jaor aan de Kepel te h\u00f6bbe gewoond
  en wie alle boewgr\u00f3ndj allang vergaeve waas, b\u00f6n ich in Herte t\u00f6sse
  de Waterratte gaon wone. Ich woon same mit mien Ruivers maedje Evelien Boonen en
  same zeen veer verriek mit twee prachtige kienjer. Julia van 9 jaor, det al jaore
  ein rol vervuld in de Kienjer Musical bie D\u2019n Uul en Daan van 7 jaor, dae dink
  det \u2018t \u2018t ganse jaor door vastelaovend is.\\nVeer zeen gewindj om es femilie
  tiedes de vastelaovend t\u00f6sse de aktiviteite van versjillendevereiniginge te
  bewaege. Mer dit jaor is det angers. Wie sjoon is \u2018t om mit alle breurs en
  kameraod Sjra same oppe buun te sjtaon en \u2018t sjpektakel ins vanoet \u2018t
  vereinigingslaeve mit te make \u00f3nger de vlag van de Kaketoes. ch gaon \u2018t
  mitmake!\\nIn \u2018t dageliks laeve b\u00f6n ich werkzaam es serviceplanner bie
  Frissen Intern Transport in Valkenburg. Wiezo werke in Valkenburg? In \u2018t Bourgondische
  zuje goje ze de tent nog toe mit vastelaovend! Ein ech femiliebedrief wo oze dorslustige
  hoogheid Rudi es balieverkaupmitwirker bie Frissen Groen Techniek is gesjtart en
  later es vertaegew\u00e4\u00f6rdiger van graasmeijers en grondjverzatmesjiener.
  Mer ja, es graassjpesjalis vonj d\u2019r ein paar jaor geleje netuurlik greuner
  graas!\\nIch gaon nog gaer aaf en toe op sjtap en haaj van ein feesje oppe tied.
  Allein mein ich altied det ich toet \u2018t lets m\u00f3t blieve (femiliekwaol).
  Sjp\u00f3rte doon ich ouch, en waal winjtersjp\u00f3rte. Eder jaor vertrekke veer
  ein waekske mit eine groep men (de meiste aad-Kepelse) nao Oosteriek om te snowboarde.
  Dus, lets jannewarie m\u00f3t de prins mich effe misse, want dan b\u00f6n ich op
  trainingskamp.\\nVastelaovend viere zit mich van j\u00f3ngs aaf aan in \u2018t blood.
  Ich kin mich neet heuge det ich ein jaor h\u00f6b euvergesjlage. Lang geleje waas
  ich al adjudant van de jeugdprins oppe legere sjool en ein jaor later waas ich zellef
  jeugprins van KSV Swift. Dit jaor z\u00f3l ich de grootste prins van Remunj letterlik
  en figuurlik ongersjteune.\\nMaak der allemaol eine sjone tied vanne!\\nToet sjnel\\nAdjudant
  Marcel\\nDaag Kepel,\\nWilt geer weite: waem ich b\u00f6n, wo ich woon, bie waem
  ich heur, en waem ich h\u00f6b gemaak? Kiek dan mer tr\u00f6k in de gezet van 2018.
  Op det gebied is d\u2019r nieks verangerd en ich haaj neet van herhaolinge\u2026\\n\u2018t
  Waas weer ins eine typische typische klusmiddaag mit \u2018de blauwe\u2019 (Tom
  Jacobs, prins 2018, red.). Eers get plenk sjildere bie \u2018m, bie mich get aete
  en aansjloetend tegels plekke en tot sjl\u00f3t vanzelfsjpraekend evaluwere mit
  ein glaeske beer. Veer zote net es miene tillefoon geit. Steffert Te Meij versjeen
  in mien sjermpke. Zo naief es ich b\u00f6n naem ich op en Steffert begint zien verhaol.
  Pas op \u2018t moment det Steffert \u2018t waord \u2018veurgenger 2020\u2019leet
  valle dach ich, ich m\u00f3t effe pleite hie. Dalik wit de blauwe al wie en waat.
  Wie Steffert mich vroog om es adjudant de nuje veurgenger bie te sjtaon dach ich
  metein: \u2018Nae, det doon ich neet. Geine zin in, \u2018t is te rap nao 2018.
  Mer ich wilde det neet zo direk bringe, wo-op ich aangoof d\u2019r euver nao te
  m\u00f3tte dinke.\\n\u2018t Thoesfront zag metein \u2018jao, det m\u00f3s se doon\u2019.
  Ich bleef d\u2019r bie det ich \u2018t neet wilde doon, haaj anger planne en zoog
  \u2018t ouch neet gebeure. Mer nao \u2018t weekend waas ich d\u2019r oet : ich doon
  \u2018t allein es dae pesoon heel dich bie mich sjteit. Op dit moment zeen det mien
  broor en \u2018Mesjiener\u2019 (Rudi Silkens, red.). En ich waas d\u2019r ouch heilig
  van euvertuug det die \u2018t neet z\u00f3lle waere. Zeker Mesjiener neet. Dae haet
  ouch grenze, dach ich.\\nIch sjr\u00f3k mich dan ouch kepot wie ich heurde det ich
  dus mit ging doon in t sjpeel. \u2018t Kwartje veel in eerste instansie neet. \u2018t
  M\u00f3sde effe lanje. En aangezeen veer eine lange veurgenger h\u00f6bbe, doerde
  det waal effe. Mer nao de eerste vergadering waas \u2018t dudelik. Ich h\u00f6b
  d\u2019r zin in en veer dinke det alles geit...\\nEsse mich of Rudi 25 jaor geleje
  gezag haajs det veer same \u2018t prinselik gezelsjap van 2020 z\u00f3lle zeen,
  dan haje veer dich veur gek verklaord en mesjien nog erger. Nae, veer ware neet
  bepaold vrunj. Det is noe waal angers. Ich h\u00f6b altied aangegaeve det Rudi noe
  eindelik mien grepkes begriep. Versjtand kump mit de jaore z\u00e8gke ze waal ins\u2026\\nZo
  h\u00f6bbe veer in \u2018t verleje v\u00e4\u00f6l samegewerk in h\u00e4\u00f6f.
  Wobie Rudi altied op \u2018t mesjienke zoot, aanwiezingen zoot te gaeve en vertelde
  det d\u2019r \u2018t zjwaor haaj. De angere, ich de aezel, waas aan \u2018t sj\u00f6ppe
  en \u2018t maore om de planning van meneer kloppend te kriege. Dao op ein moment
  waas d\u2019r op de knieje ein zandjbed aan \u2018t make. Ich zoog zien \u2018sjpaarp\u00f6tje\u2019
  en sjnapde metein waat ich m\u00f3s doon. Zo sosjaal es ich b\u00f6n goojde ich
  \u2018m get zandj in de v\u00f3t. Det haaj ich neet m\u00f3tte doon. Nao eine houp
  gesjelj en getier zoot d\u2019r weer tr\u00f6k op zien mesjienke en dao is d\u2019r
  sindsdeen noojt meer vanaaf gek\u00f3mme. De naam sljavedriever waas gebaore. \u2018t
  Is ein good j\u00f3nk en veer kinne good mit ein euverwaeg.\\nVastelaovend same!\\nAdjudant
  Sjra\"", "\"Allard I (Schmitz)\\nAllaar Alaaf!\\n\u201cNur vom Feinsten\u201d en
  doorgaon toet \u2019t gaetje \u2013 Wiej sjoon \u2019t toch is om eine Remunjse
  jong te zeen in de bleuj van zien laeve \u2013 wiej ooze nuuje Prins, Allard I,
  Schmitz!\\nOze nuje veurgenger sjrief zich Allard Schmitz. Allard is 31 jaor, eine
  r\u00f6stige, besjaafde gas. Oojt m\u00f3sde hae oet Remunj vertr\u00e8kke, mer
  nao veer jaor is hae tr\u00f6kgek\u00f3mme \u00f3mdetter det w\u00f3l, haet d\u2018r
  zich \u201cgesetteld\u201d en wil noojt meer weg.\\nGaef \u2018m ins \u00f3ngeliek.
  Hae woont in hertje sjtad, aan ein van de sjoonste sjtraote, in ein mit sjmaak ingerich
  hoes. Hae laef dao same mit Suzanne Vaessen, zien vrundjin, en d\u00f6chterke Charlotte,
  det 2 waert mit de vastelaovend. En wiej \u2019t zo oetkump waert in de zomer oppernuuj
  de ooievaar verwach en z\u00f3lle ze mit zien vere zeen. Allard haet de beste vrunj
  diej me zich winse kint. Same mit de vrouwluuj zeen ziej eine hechte troep.\\nSins
  ein jaor is hae eige baas. Es door de wol gev\u00e8rfde boewkundige regelnaef is
  hae dr\u00f6k bezig veur partekelere en bedrieve, diej hae gaer alles oet de h\u00e8nj
  nump waat mit boewe te make haet. Allard haet zien zaekskes dus prima \u00f3ppe
  riej sjtaon, neet in de l\u00e8ste plaats \u00f3mdet hae dit jaor baovenop det allemaol
  ouch nog ins Prins is. De Prins en zien maedje zeen vastelaovesvierders van \u2019t
  zuverste water!\\nDe Sjuur\\nAllard Hubertus Elisabeth Schmitz waerde gebaore in
  1978, \u2019t jaor van de WK-finale en de opzeenbarende gijzelinge. Zien weeg sjt\u00f3ng
  in Maerem. Opa en Oma hadde dao ein kefee: De Sjuur. De Oude Borg, wo ziene Pap
  zellef ouch nog ein tied gewoond haet, waas de sjpeelplaats van zien kienjerjaore.
  Hae wit nog alles euver de vastelaovend es menke. Mit keep, septer en m\u00f6ts
  rende hae verkleijd es Prinske door De Sjuur. Euver det saort dinger gesjpraoke
  \u2026\\nAmersfoort en tr\u00f6k\\nWiej zien elders oetein ginge vertrok hae op
  zien 8ste mit zien Mam en z\u00f6ster nao Herte. Op zien 13e kreeg ziej ein baan
  in Amersfoort! De j\u00f3ng verhoesde mit. Zien \u201cballingsjap z\u00f3l veer
  j\u00e4\u00f6rkes doere. 17 Jaor waas hae wiej hae besjloot \u00f3m tr\u00f6k te
  gaon nao zien gebaortesjtreek \u00f3mdet hae zich hiej meer op zien gemaak veulde.
  Es prakties ingesjt\u00e8lde j\u00f3ng v\u00f3nj hae al flot ziene waeg in de Boewkundige
  sjoling aan de MTS.\\nGreuje in \u2018t wirk\\nDaonaeve waas \u2019t aanpakke. Allard
  ziene eerste baas waas ein instjallasiebedrief. Nao ein paar jaore kwaam Allard
  aevel biej Tom Loven terech, wo zien krach herkind waerde. Zien gaaf kreeg de ruumte
  \u00f3m zich flot te \u00f3ntwikkele, in de praktiek van \u2019t bedrief en in de
  sjoolbanke. De Prins sj\u00f6pde \u2019t toet \u201clogistiek manager\u201d van
  \u2019t aannaemingsgedeilte en droog op \u2019t l\u00e8s de verantjwaordelikheid
  veur \u2019t planne van \u2019t werk van 70 miense. Alles kwaam op ziene bero biejein:
  teikeninge, miense, matriejale, \u2019t k\u00f3ntak \u00f3ngerein.\\nAllard kiek
  voldaon tr\u00f6k op ziene tied biej Loven, wo d\u2019r euverigens ouch Vors Sybaer
  leerde kinne. \u2018t Waas ein fantasties bedrief. Sjoon ware projekte wiej \u2019t
  inrichte van de Remunjse sjtumlokale, \u2018t hoog water, en verboewinge zo es Hamers,
  Doedels, \u2018t Kelderke, de Kieksjop en Halfords, \u00f3m mer get te neume. Aevel
  ouch boete Remunj haet d\u2018r al duchtig sjpaore naogelaote.\\nEige baas\\nInj
  2008 zag Allard ziene wirkgaever \u201ctabee\u201d \u00f3m veur zich zellef te beginne.
  Tom had \u2018t bedrief verlaote, \u2018t bedrief waas verangerd en de tied waas
  riep \u00f3m toch ins get veur zich zellef te beginne. Hae waogde dus de sjprunk
  en dao haet hae gein sekonde sjpiet van gehad. Hae maak noe \u00f3nger eige naam
  boewprojekte veur partekelere en bedrieve. Projekte diej get ekstraas van \u2018m
  vraoge en wo dr\u00f6k op sjteit, det zeen veur hem de krinte in de mik. Dan waere
  de sjpraekwaordelikke moewe opgesjtruip. Het perfeksjonisme det Allard Schmitz aan
  de daag ligk waert door de klantje ongeluifelik gewaardeerd.\\nZate hermeniej\\nVanaaf
  \u2019t jaor detter toeskwaam maakde Allard serjeus werk van ziene vastelaovend.
  Vanaaf det mement haet d\u2018r geine vastelaovend euvergesjlage.\\nDe eerste tied
  vierde hae \u2019t fees nog in Maerum mit zien naeve. Dao zoot d\u2018r ouch eine
  tied in ein zaate hermeniej diej geine naam had. De hermeniej had eine tr\u00f3mmeleer
  dae noojt van ophaje weite w\u00f2l. Op \u2019t inj van de daag ging zien geroeffel
  de luuj zo op de zenewe wirke det me \u2018m de tr\u00f3mmelsjtekke aafnoom en doormidde
  brook. Mit plekbandj waerde de kl\u00f6ppelle weer aaneingezat en \u2019t fees ging
  roeffelend wiejer. Dae tr\u00f3mmeleer waas hae.\\nObere\\nR\u00f3ndj 2000 waas
  Allard mit de vastelaovend d\u00f6ks te vinje achter de gaam van Alleben\u00e4\u00f6r
  en De Post. \u201cIn de horeca wirke mit de vastelaovend is gaaroet neet vervaelend.
  Achter de gaam h\u00f6bse ein idiejaal plaats \u00f3m dich \u2019t gans sjpeel ins
  good te bekieke\u201d, zaet t\u2018r.\\nIn diej jaore gebeurde \u2019t ouch det
  hae op vastelaoveszaoterdaag \u00f6rges op sjtraot ein aad camouflage-net v\u00f3nj.
  Es sjtroek verkleijd leep hae daomit drie daag door de sjtad.\\nSuzanne\\nWeer ein
  paar j\u00e4\u00f6rkes wiejer leerde Allard zien maedje kinne, en mit Suzanne kwaam
  ein sjone troep vastelaovend vierende vrunj in zien laeve wovan d\u2019r noe drie
  zien adjudante waere.\\nSuzanne is ein door en door Remunjs maedje det de kos verdeent
  es sjeijingsavvekaot biej Hameleers, Van den Boomen en Stevens avvekaote. \u2018t
  Is eine echte vastelaovesgek det in zien wilj jaore achter de Uuleprins aanjoog
  \u00f3m gek\u00f6s te waere, det biej eder Masterbaere-b\u00e0l van de pertiej waar,
  det mit zien vrundjinne ein rol aafsjprook en diej \u2019t gans fees door volheel.
  Eine keer ware ze sjoonheidsjpesjalis. Toen haet \u2019t de Prins de naegel geknip
  en gelak. Dae Prins waas Sybaer I.\\nSuzanne loog mit 40 graode koors in \u2018t
  bed wiej Allard gevraog waerde of hae Prins w\u00f3l waere. \u2018t Waas in eine
  sjlaag baeter wiej \u2019t det van hem heurde. Waat eine kedo: \u201ceine Prins
  gans veur dich zellef \u201c!\\nPergram\\nEs veer de nuje Prins vraoge wiej zien
  vastelaovespergram d\u2019r normaal gesjpraoke oetzuut, haolt t\u2018r ins deep
  aom en begint t\u2018r te vert\u00e8lle (waat hiejnao kump is ein langk verhaol
  det hae toch k\u00f3rt hilt): \u201cDonderdaagaovend Kwartjesbal in de Amstelclub.
  Vriejdaag nao \u2018t wirke nao de Sjolefestasie. Zaoterdaag mitwirke aan de SjtasieFestasie
  en daonao door nao de Amstel en de Tram \u00f3m te viere. Z\u00f3ndaagmorge k\u00f3ffie
  drinke en ein b\u00f3tterhemke aete mit vrunj, vrouwluuj en kienjer biej Braam oppe
  beugelbaan. Daonao deenblajertr\u00e8ffe biej de Tram en daonao de resepsie van
  de Prins. Kuukskesmaondaag sjprik vanzellef, Opt\u00f2ch kieke en dan toet wied
  in de nach op sjtap. Dinsdaags de Sirk, de Tram, Bacchus, aaftraeje Jeugprins, aaftraeje
  van de grote Prins, en \u00f3m twee oere nao de Amstelclub wo ederein zich tr\u00f6f
  veur de ontlajing. Dao is \u2019t dan baeregezellig. Goonsdaags heringesj\u00e8lle
  in Amstel, Uulen\u00e8s of de Tram. En altied doorgaon toet \u2019t gaetje: det
  m\u00f3t!\u201d Sjoon is det \u2018r onnog zaet: \u201cVeur mich moogde \u2019t
  r\u00f6stig langer doere.\u201d \u2026\\nVeurgenger\\nAllard geit Remunj regere
  \u00f3nger eine nog neet oetgegaeve naam: Allard I. In zien liefsjpreuk, \u201cAlaar
  Alaaf\u201d, sjpeelt hae mit ziene naam. Allards hoesorde is ein liene z\u00e8kske
  mit houter boewsjteinkes, ein verwiezing nao zien vak.\\nDe Prins zal waere biegesjtaon
  door drie Adjudante: Roel Stroeken, Jeroen Opheij en Lars Heuvelmans, bekinde Remunjse
  sjtraotv\u00e8rkes, Uule en Aad-Masterbaere (!). In v\u00e4\u00f6l zake (hoes koupe,
  trouwe, kienjer kriege) zeen ziej \u2018m veurgegaon, aevel in ein dink neet: Allard
  is noe Prins, veurgenger van de heel bups. Prins en Adjudante zalle \u2019t fees
  aevel aangaon es vrunj en ouch de maedjes zalle h\u00e4\u00f6r pertiejke mitsjpele.
  \u2018t Euverligk en veurbereijinge h\u00f6bbe al v\u00e4\u00f6l plezeer gebrach.
  Sjeff\u00e4\u00f6r is de\\nPrins zien sjoonvader, John Vaessen.\\nVol verwachting\\nEs
  veurg\u00e8nger in \u2019t Vastelaoves-sjpeel wil ich d\u2019r op de juuste memente
  zeen en de miense enthousias make. Geer kint d\u2019r zeker van zeen: ich zal alles
  d\u2019r oet haole. Det zaet Allard. Zinge kint \u2018r, danse is gein perbleem
  en hae geit door toet \u2019t gaetje. Ein bietje pien, det heurt d\u2018r biej \u2026\\nPerseunlik\\nAan
  \u2019t inj van dit verhaol nog get perseunlikke dinger.\\n- Sjterrebeeld: Kreef.\\n-
  Lekkerste aete: De \u201cspareribs\u201d van Faubourg, en boete de Franse keuke
  nieks biejz\u00f3njers behalve eigelik alles.\\n- Elfde van de Ellefde: K\u00f6lle
  (en blieve sjlaope).\\n- Meziek: Van klassiek toet K\u00f6lsje teun (diej leedjes
  kint hae allemaol).\\n- Fekansie: Sjpaanje, Cote d\u2019Azur.\\n- Sjport: vreuger
  handjbal, noe tennisse en golf.\\n- Auto: Range Rover (aevel veurluipig nog effe
  Volvo).\\nDeze vastelaovend waert \u201cnur vom feinsten!\u201d Dao kint geer op
  boewe!\\nJPh\\n\u2019t Nuuje Zjwetskammezaol waerd op donderdaag 7 jannewarie aangebaoje
  aan Prins Allard I tiedes De Aovend van de Prim\u00e4\u00f6r, Uulenes, aanvangk
  20.11 oere, entree gratis.\"", "\"Posterholt \u2013 Op z\u00f3njig 19 jannewari
  waerde in ein boemvol KA-hoes \u2019t nuuje Prinsepaar vanne Feesnaeskes oetgerope:
  Prins Luuk I (Mingers) en Prinses Guusje (Bindels)! (foto het prinsenpaar met \u2018steunpilaren\u2019)\\nPrins
  Luuk is van Erik van Sjra van de Lange van de Borgh en van Truus van Harrie van
  Baeres en van Yvonne van Lei van Bair van Tom van \u2019t Keutelsjtr\u00e4\u00f6tje
  en van Gertie van Peter van Roubroeks oppe Boumsjtraot.\\nOos prinses is Guusje
  van Vincent van Frans de landjmaeter oet Valkeberg en Nettie van de boerderie oet
  Waterval en van Joyce van Graadje van de Borgh en Marie van Puil oet Azerao.\\nDit
  geweldige sjtel regeert mit de sjpreuk:\\nVan de Boumsjtraot toet oppe Donck,\\nHawte
  de Naeskes de Vastelaovend jonk!\\nPrins Luuk en Prinses Guusje waere \u00b4t k\u00f3mmende
  jaor ongersjteund door Vors Fenne (van der Velden), adjudante Danny (van Riet) en
  Zo\u00eb (Willems), Nar Raf (Veelen), \u00f3s Dansmarietsjes en netuurlik de Raod
  van Ellef. Veer gaon d\u2019r same mit de Dorsjvlaegels en Biem\u00f6sje eine hele
  sjone Vastelaovend van make!\"", "\"Oetreike Veldeke Oeuvrepries aon De Drekskaters\\nDe
  Venlose formatie De Drekskaters krijg dit jaor de Veldeke Oeuvrepries vaan \u2019t
  Limburgse Leed. De gr\u00f3p, dee al decennialang actief is weurt m\u00e8t de pries
  ge\u00eferd veur zien umvaankriek oeuvre en zien verdeenste veur \u2019t Limburgse
  leed. De band oontvingk de pries op donderdag 14 september tijdens de \u2018veurpreufnach\u2019
  vaan de Nach van \u2019t Limburgse Leed bij \u2018ne speciaolen aovend in kaffee
  De Blauwe Trap in Venlo. Vaanaof 20.30 oor weure De Drekskaters in \u2019t zunneke
  gezat en oontvaange ze d\u2019n Oeuvrepries. De band trejt deen aovend ouch op.
  D\u2019n aovend is \u2019ne sponsoraovend en aovend veur de vrun vaan de Nach vaan
  \u2019t Limburgse Leed meh is ouch touwgaankelek veur ander ge\u00efntr\u00e8sseerde.\\nDe
  Drekskaters\\nDe Drekskaters is d\u2019n awste en nog ummertouw actieve Venlose
  dialekband. De gr\u00f3p woort in 1982 opgeriech es The Thrashcats meh in 1984 woort
  de naom veranderd in De Drekskaters. In datzelfde jaor versjijnt d\u2019n debuutsingle
  \u2018Rok en Rool duit \u2019t gans\u2019. Rock\u2018n\u2019Roll en Rockabilly v\u00f6rme
  de roejen draod in de loupbaon vaan De Drekskaters, meh ouch ander meziekstijle
  speule \u2019n rol. En dao is nog eine stabiele factor: alles weurt gezoonge in
  \u2019t Venloos dialek. Tot de klassiekers behure n\u00f3mmers wie \u2018In dees
  stad\u2019, \u2018Blief vaan mien beer \u2018, \u2018St\u00f6k in miene geter\u2019
  en netuurlek de Venlose revue cover \u2018Getske van gel\u00f6k\u2019. Optrejjes
  vaan de energieke Drekskaters swinge nog altied: de band steit, ouch daankzij de
  zoe herkinbare zaank vaan Marco Schell, wie \u2019n hoes en w\u00e8t al decennialaank
  euveral sfeer te bringe. De zouws De Drekskaters zelfs kinne besjouwe es de moojer
  vaan alle Venlose dialekbands: edere lateren act is zoonder twiefel sjatpliechteg
  aon de gr\u00f3p dee neet weg te dinke is oet de lokaol meziekscene. De huidege
  formatie besteit oet Marco Schelle, Roger Cornelisse, Myl\u00e8ne Schrijen, Werner
  van Gool, Charles Coppens en Duncan Tilmans.\\nMotivering Dialekvereineging Veldeke
  Venlo\\nVeldeke Venlo veurzitter Bas Vissers: \u201cDe Drekskaters, dat is boe de
  Venlose dialekmeziekgolf zienen oersprunk heet. Ze h\u00f6bbe ein vaan de ierste
  stein gelag veur \u2019t tegenwoordeg bouwwerk vaan de Venlose dialekmeziek. Zie
  zien de inspiratie gewees veur hiel get gr\u00f3ppe die nao hun zien gekoume, die
  ouch weer ander weeg zien ingeslage. De Drekskaters h\u00f6bbe altied hunnen eige
  rockabillystijl behawwe en eus Venlose taol verriek m\u00e8t flink get sjoen w\u00e4\u00f6rd
  en oetdr\u00f6kkinge die min of mie aon hun zien goon touwbehure: \u2018ein st\u00f6k
  in miene geter\u2019 en \u2018blief van mien beer\u2019 weure bekans otomatisch
  gekoppeld aon dees formatie. Ouch zien zie e soort breujn\u00e8s gewees vaan talent:
  oet hun midde zien hiel get gooj muzikante gebore en dees muzikante h\u00f6bbe weer
  eleminte vaan hunne stijl m\u00e8tgenome nao de gr\u00f3ppe boe ze noe in speule.
  Kort gezag: De Drekskaters, es weegbereiiers veur d\u2019n alternatieve Venlose
  meziek boete de vastelaovend, verdene deze pries es geinen andre gr\u00f3p. \u2019t
  Is daan wel \u2018nen oeuvrepries, meh veer hope netuurlek tot zie hun instruminte
  nog lang neet opberge en nog tot in lengde vaan jaore wijergoon. Veer zien d\u2019n
  oeuvrepries daan ouch es \u2018ne Veuraldoorgoonpries.\u201d\\nReactie vaan De Drekskaters\\nDe
  bandlede reageerde blij verras naotot ze door Veldeke Venlo woorte benaoderd. Ze
  veule ziech vertg\u00f6ld m\u00e8t de pries en zien gruuts tot hun oeuvre op dees
  meneer bekroend weurt. Ze nudege daan ouch ederein dee de band e werm hart touwdreug
  um op 14 september aonwezeg te zien bij de oetreiking en dao ouch te koume genete
  vaan e spetterend optrejje.\"", "\"Vastelaoves- en Ontsjpanningsvereiniging De Kaketoes
  is statutair opgerich op 15 jannewarie 1956 bie Kefee De Post aan de Kapellerlaan.
  ''t Waord Kaketoes is toet sjtandj gek\u00f3mme oet de w\u00e4\u00f6rd KA (pel),
  KE (mp), TOES. Wiej later begin jaore ''60 de wieke Kitskesberg en Heide waerde
  geboewd, zeen ouch dees onger de vleugels van De Kaketoes opgenaome.\\nEs logo waerde
  vriewaal vanzelfsjpraekend veur de vogel \\\"Kaketoe\\\" gekaoze; ''t orizjeneel
  logo waerd nog altied gebroek in de uniformering.\\nToet en mit ut jaor 1968 kinde
  de vereiniging geine Prins, mer eine Prizzedent es veurgenger. De eerste Prizzedent
  waas Jan 1 ( de Wilde ). De achtergrondj hiejvan is det in dae tied eigelik mer
  \u00e9ine Prins in Remunj waas, namelik dae van VV D''n Uul. De Prizzedente waerde
  in de beginjaore ouch ge\u00efnsjtalleerd door de V\u00f3rs van D''n Uul. Vanaaf
  1969 kinne de Kaketoes toet op de daag van vandaag eine Prins es veurgenger.\\nIn
  eerste insjtansie opgerich om op ein plezerigge meneer same Vastelaovend te viere,
  greujde de vereiniging al sjnel oet toet ein volwaerdige vastelaovesvereiniging,
  dae sosjsaal en cultureel ein biedraag g\u00f6f aan de gemeinsjap.\\nVanaaf de oprichting
  zeen de Kaketoes herkinbaar aan de rooj / blouwe uniformering van de Raod van Ellef,
  w\u00e8lke, waal in versjillende hoedanigheje, al die jaore is gebleve. Dees kleure
  k\u00f3mme euveral in tr\u00f6k, wiej de uniformering van de neet RVE leje ( m\u00f6tse,
  hesjes ), medaaliejs etc.\\nAl vriej vreug ( vanaaf 1959 ) brach de vereiniging
  jaorliks ein vasteloavesgezet oet, dae binne de wieke waerde verk\u00f3ch. Ouch
  dees tradisiej waerd toet op de daag van vandaag veugezat, get wo veer erreg greuts
  op zeen.\\n''t Eerste juubeleijem ( 1 x 11 joar ) waerd bereik in 1967 mit es Juubelei-jeprizzedent
  Peter 1 ( Munnix ), dae later ouch nog veurzitter van de vereiniging is gewaes en
  neturelik ein van de gr\u00f3tste initiators van de Kaketoegezet. Hae ontveel \u00f3s
  vlak veur het 4 x 11 juubelei-jem. Al greujende waerd in 1978 het 2 x 11 ja\u00f3rig
  juubeleijem bereik, eine mielpaol veur de Kaketoes, want in dit juubelei-jemjaor
  met Juubeleijemprins Ton 1 ( de Bock ) waerd ''t Kaketoebeeld op ''t veldj veur
  de Kapel in ''t Zand onthuld. In dees jaore waerd de vereiniging geleid door de
  Grootv\u00f3rs van Remunj, Bair Cox. Wiej deze halverwaege de jaore ''80 waeges
  serjeuse zeekte zien funksie m\u00f3s neerligke en vlak daornao sjt\u00f3rf, noom
  Paul der Kinderen ''t sjtekske van dem euver, aevel neet es V\u00f3rs, mer es veurzitter
  van de vereiniging. Dees funksie haet hae toet ''t begin van de jaore ''90 uitgeveurd,
  wiej ouch hae \u00f3s helaas ontveel. Toet 2006 kinne de Kaketoes geine v\u00f3rs,
  mer eine veurzitter es ein van de veurgengers van de vereiniging. Mer de Kaketoes
  zolle de Kaketoes neet zeen, es veer neet zo noe en dan ins get nuujts doon. Op
  11 november 2006 is Marc Allers \u00e9s eerste V\u00f3rs van VV de Kaketoes ge\u00efnstalleerd.\\nIn
  1989 waas het tied veur ''t 3 x 11 ja\u00f3rig juubeleijem met Juubeleijemprins
  Huub 1 ( Salden ). Ein beeld waas dr al, ''t waas aevel tied veur modernisering
  van de uniforme. In det jaor waerde de bekinde rooj slipjes en nuuj m\u00f6tse veur
  de Raod van Ellef ingeveurd. Ouch zeen dr in d\u00e9t jaor kleinere beeldjes gemaak,
  diej waat toen zeen oetgereik aan edereen dae de Kaketoes een werm hert toedroge.\\nJaomer
  gen\u00f3g m\u00f3ste veer in 1991 oetwieke nao de aaj I.T.O. sjool mit \u00f3s
  grote aktiviteite; de zaal van de famfaar, wo al die jaore de aktiviteite waerde
  gehaaje, waerde aafgebraoke. Gel\u00f6kkig k\u00f3ste veer in 1993 terech in de
  aula van de MAVO aan ''t Sjoolpaad. Dees aula z\u00f3l oeteindelik besjtump waere
  es nuuj gemeinsjapshoes van de Kapel. Oeteindelik waerd in 1995, door eendrachtige
  samewirking van alle vereiniginge aan de Kapel, ein nuuj gemeinsjapshoes gerejaliseerd
  aan ''t Sjoolpaad, wodoor alle Kapelse vereiniginge weer ein sjoon en grote lokaasiej
  haaje veur h\u00e4\u00f6r aktiviteite.\\nZo zeen veer aangelandj biej ''t 44-ja\u00f3rig
  besjtaon van de Kaketoes in 2000, mit es Juubeleijemprins Jos IV ( Vervuurt ). Dit
  juubeleijem is gevierd mit es doelsjtelling: \\\"De ganse gemeinsjap haet fees !\\\"
  De uniformering waerde up to date gebrach en veur ederein van jonk toet aad waerde
  aktiviteite georganiseerd. Hoogtepunt woor beveurbeeld de juubelei-jemm\u00e8s in
  de Kapel in ''t Zandj, dae in ''t remunjs dialek waerde gehaaje. Vanaaf dae tijd
  waerd jaoreliks ein waek veur de vastelaovend een dialekm\u00e8s gehaaje in samewirking
  mit de vastelaovesvereiniginge de Kitsuule en Koelbertus, diej ouch h\u00e4\u00f6re
  basis h\u00f6bbe in Remunj Zuid.\\nEin anger hoogtepuntj waerde verzorreg door de
  club van Aad Prinse van de Kaketoes: Ein eigese vereinigingsvlag, dae \u00f3nger
  ''t vastelaovessezoen aan sjteeds meer hoezer in Remunj en wied daoboete greujts
  wappert.\\nDe Kaketoes zeen neet allein \u00f3nger de vastelaovestied ( 11 november
  t/m asgoonsdaag ) bezig, mer ouch daoboete. In dezen tied waere alle eige ( vasteloaves
  ) aktiviteite georganiseerd, wiej beveurbeeld ''t oetbringe van de Kaketoegezet,
  de Kienjermiddaag, de jaorelikse Boerebroelof op vastelaovesdinsdaag en natuurlik
  ''t Prinsematinee ( 2de zondaag in jannewarie ) wo de nuuj veurgengers bekind waere
  gemaak en h\u00e4\u00f6r resepsie op vastelaovesz\u00f3ndaag.\\nOuch waerd beveurbeeld
  door \u00f3nger meer de enveloppeaksie al jaorelank biejgedrage aan ''t jaorlikse
  oetsjtepke veur de aajere en kranke luuj oet \u00f3s riek mit behulp van De Zonnebloem,
  mitgewirk aan de organesaasie en oetveuring van de Wiekfeeste Kapel in ''t Zand
  ( Oranjemert, Kepelse Kirmes en Braderie ) en wiejer euveral wo een beroop op \u00f3s
  waerd gedaon.\\nEder vereiniging m\u00f3t mit h\u00e4\u00f6re tied mitgaon en de
  Kaketoes loupe daomit d\u00f6ks veurop; D\u00f6k trendsettend mit aktiviteite en
  de organisaasie daovan, mit leje en v\u00e4\u00f6l anger luuj boete de vereiniging
  die eine bandj mit mekaar en mit de gemeinsjap h\u00f6bbe dae d''r veur zorreg det
  zowaal vereiniging es gemeinsjap jonk van geis en sjerp blief. Z\u00f3nger gemeinsjap
  gein vereiniging; Eine prins, toch de belangriekste persoon \u00f3nger ein vereinigingsjaor,
  is in de eerste plaats reprizzentant van \u00f3s gemeinsjap, daonao pas van de vereiniging.\"",
