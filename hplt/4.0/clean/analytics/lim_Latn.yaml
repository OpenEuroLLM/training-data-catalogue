  LA BAMBA - ZOMER INNE KOP\\n- JO SMEETS - ALLES GOOD?!\\n- FRANS CROONENBERG - VANDAAG
  WILLE V''R VIERE\\n- KATJA HENZ - DANS M\u00c8T MIECH\"", "\"Karnevalszoondig is
  in Mh\u00e8\u00e8r altied d''r daag vur de keender. JeugdPreenses Serena I hat ut
  dan och vur ut zigke dizzen daag. Um ing oor sjnoones, nao ut sjpek en ei ee\u00ebte
  verzamelt d''r Groete Raod mit de Groete Preenses Rianne I in kaffie Quaante. En
  es och de blaoskapel zoewiet is gunt veer nao de JeugPreenses um die aggen hoes
  aaf te hoo\u00eble.\\nDaonao gunt veer mit d\u00e8\u00e8 gaanse sjtoet \u00e8 bezeukske
  bringe an un aantal owwer inwoenersj va Mh\u00e8\u00e8r. Wie deer in de Sjravelerregezit
  al hubt kinne le\u00ebze hoeve dat neet per s\u00e9 de allerowste inwoenersj te
  zie. Zie kriege dan ing aubade aggen hoes en natuurlik ing decoraassie van os JeugPreenses.
  Dit um de verboondenh\u00e8\u00e8d tussje joonk en oad tot oetdrukking te bringe
  in dizze Vastenaovestied.\\nDaonao gunt veer op d''r zaal aa en dao is dan ozze
  bekinde sjpringmiddig vur de jeug mit pannekeuk, grabbelton en nog vanalles. Es
  arties hub veer dit jaor Sven ohne Girls oetgenuudigd um de sjtimming dreen te bringe
  en te haote.\\nD''r mondig van de Karneval is d''r groete daag van de Mh\u00e8\u00e8rder
  Karneval. Dan g\u00e8\u00e8t namelik d''r Groete Optoch oet. Os Hoege Hoeglustigh\u00e8de,
  Groete en Jeug-Preenses zalle dan eeder op hunne \u00e8\u00e8ge Preensessewage in
  triomftoch dur ut d\u00f6rp geveurd were. Veuraaf gegange dur alle Sjravelerre eeder
  mit hun \u00e8\u00e8ge Vastenaoveskreaassies.\\nVerget uch neet op te ge\u00ebve
  op Karnevalszotterdig.. En nem dan och ut insjriefformeleer mit wat deer in de Sjravelerregezit
  kint veende.\\nDe routte van d''r optoch is ezoe:\\nNao d''r optoch zal in d''r
  zaal nog wier gesjpronge en geKarnevalt were. Edere groep of wagel of einzelg\u00e4nger
  d\u00e8\u00e8 in d''r Optoch is mitgewes kriet oet han van os Preensepaar ing oorkonde
  en same mit os Preenses Rianne I zal eeder\u00e8\u00e8n dan unne taost oetbringe
  op de Mh\u00e8\u00e8rder Karneval.\\nOp zotterdig 9 fibberwarie is beneump en aangesjtild
  es Preenses Karneval 2019 in ut Sjravelerreriek: PREENSES RIANNE ut Uursjte !!!
  Nao ing prachtige Groete Zitting is Rianne Vandewall oetgerope tot Preenses va Mh\u00e8\u00e8r.
  Preenses Rianne is g\u00e8ne oonbekinde in ut d\u00f6rp. Zie is al \u00e8 paar kiere
  koniingin van de sj\u00f6tteriej gewes en is marketenster bie diezelfde sj\u00f6tteriej.
  In ut gewoene l\u00e8ve werkt zie in d''r Hoftempel van de Sjravelerre, Kaffie Quanten,
  m\u00e8 vanaaf noe pus esjelegonsdig zal zie dao neet v\u00f6\u00f6l pilskes tappe.
  Es Preenses zal zie in d''r hoftempel van de Sjravelerre zelf verzurgt were. Preenses
  Rianne I is mama van twie kling Preenseskes Veerle en Mara. Same mit JeugPreenses
  Serena I zal Preenses Rianne uvver ut Sjravelerre-riek goe regere dit sezoen. Mansluuj
  hoat uch mer vas want mit dis twie vrolluuj an ut roer van de kommende Vastenaovend
  god deer ut nog zjoer kriege. Preenses Rianne I is unne rasechte Karnevalist. Dat
  zit dao noe \u00e8\u00e8mol in de femillie want pa Huub wor in 1995 Preens van de
  Sjravelerre en broor Luc in 2017. De Karneval i Mh\u00e8\u00e8r kint dus beginne
  !!\\nOp Karnevalsdensdig wurd um twelluf oor prussies ut Sjravelerreleech gedoofd
  dur ozze Groete Preens en Preenses same mit de JeugPreenses. M\u00e8 vurdat ut zoewiet
  is bel\u00e8\u00e8f veer nog unne oonvervaalsjde Mh\u00e8\u00e8rder Vastenaovend
  in kaffie Quaante. Naodat ut Sjravelerreleech oet is gunt waal alle mutsje aaf,
  m\u00e8 da gunt veer toch nog effe wier...\\nUt aafsjlete van de Vastenaovend 2019
  zal gebeure mit de geweldige feestband Los Canonnos\\nZotterdig 9 fibberwarie. Natuurlik
  howt deer dizze datum al in d\u2019r agenda sjtoe. D\u00e8\u00e8 sjt\u00e8\u00e8t
  namelik in eedere agenda.... M\u00e8 natuurlik howt deer dao och al in koolittere
  \u201cGroete Zitting\u201d biegesjre\u00ebve. Jazekker, eeder jaor driej we\u00ebke
  vur de Vastenaovend wurd in Mh\u00e8\u00e8r de Groete Zitting gehaote op zotterdigaovend.
  Mit artieste van wiet boete g\u2019n d\u00f6rp, artieste van roontelum ut d\u00f6rp
  en artieste va \u00e8\u00e8ge d\u00f6rp. En dat allemaol ter iere van os aaftr\u00e8\u00e8jend
  Preensepaar Marc I en Silvie I.\\nDaansgroep Jump kint op dizzen aovend natuurlik
  neet oontbre\u00ebke. M\u00e8\u00e8dsjes va Mh\u00e8\u00e8r en och m\u00e8\u00e8dsjes
  va boete Mh\u00e8\u00e8r zalle uch betovere mit hunne prachtige daans.\\nDan zal
  de buut midde op ut podium gedrage were want dan is ut tied vur ing buut van Hub
  Stassen oet Voelender. Es buuttereedner hat d\u2019r Hub al bewe\u00ebze dat \u00e8
  bie d\u2019r top va Limburg huurt, m\u00e8 hee is d\u2019r litste tied och ummer
  dikser te bewoondere es presentator van Buuttetreffes (oonder aandere i Voere).
  Dat \u00e8 dao bie zieng aan\u2013 en aafkondiginge diks humoristischer is es de
  buuttereedners zelf, dat zet genog uvver Hub Stassen. Op de Groete Zitting dus in
  de buut !\\nOs ''ow'' JeugPreenses Lotte I van verl\u00e8\u00e8je jaor zal dizzenaovend
  och in heur nopjes zie, want heur collega\u2019s van Daansgroep de Waggelerre va
  Voere zalle och acte de pr\u00e9sence ge\u00ebve op dis zitting. Mierdere kiere
  Belsj \u00e9n Europees Kampioen, z\u00f3\u00e9 diks zelfs dat ze oetgesjejd zunt
  mit tille, en dan hie bie os op de Groete Zitting ter iere van os Groet Preensepaar,
  m\u00e8 och \u00e8 bieteke vur JeugPreenses Lotte.\\nDan mot veer effe kieke of
  ut daak van d\u2019r zaal good vas zit aandersj g\u00e8\u00e8t dat daak gaans d\u2019rvanaaf
  es veer ut optr\u00e8\u00e8je kriege van La Bamba. In 2013 winnaar van ut LVK mit
  \u201cL\u00e8\u00e8f, Limburg l\u00e8\u00e8f\u201d. M\u00e8 och titels es \u201cKnoakeh\u00e8\u00e8l
  op dat v\u00e8\u00e8l\u201d en \u201cWaste hie zuus dat zuuste neureges\u201d zalle
  uch neet oonbekind in de oere kleenke. La Bamba zit och in 2019 wer in de hof-fiale
  van ut LVK mit \u201cUvver hoonderdeozend jaor\u201d.\\nEs de rus nao La Bamba wer
  \u00e8 bieteke is trukkgekierd is ut tied vur de Oad-Preense um de buhne te betr\u00e8\u00e8je.
  Os Oad Preense Garde hat op ut jubileumfi\u00ebs unne sjalger aangebooje an de Karnevalsvereniging
  en d\u00e8\u00e8 wurd op de zitting opnuuj gepresenteerd. D\u2019r teks van dit
  leedsje kint deer in dis gezit nog truukveende.\\nEs litste optr\u00e8\u00e8je vurdat
  Preens Marc en Preenses Silvie gunt aaftr\u00e8\u00e8je krieg veer zoe wie dat al
  vur d\u2019r 34e kier g\u00e8\u00e8t: D\u2019r D\u00f6rpskroniek ! Dao hoef wier
  g\u00e8ne oetlik bie !\\nPreens Marc en Preenses Silvie zalle dan hun verseersele
  behuurend bie hun Preens-zie motte aafge\u00ebve en is ut wer gewoen Mar en Silvie.\\nDe
  Oad-Preense zalle dan nao de pauze d\u2019r vur zurrege dat d\u2019r nuuje hiersjer
  uvver ut Sjravelerre-riek dur d\u2019r zaal op richting buhne g\u00e8\u00e8t en
  dan is ut de taak vur Vorst Jos um dem of die nao v\u00f6\u00f6re te lotte komme.\\nOch
  dit jaor wurd de Groete Zitting wer muzikaal oondersjteund dur os \u00e8\u00e8ge
  Bergweider Musikanten. Ze zunt zoonder oongelukke truuk-gekomme oet Oosterriek dus
  die hubbe ammezjuur tot ut verrik !\\nVeer weunsje uch alvas:\\nV\u00f6\u00f6l plezeer
  op os Zitting !\"", "\"Vriedaag 20 jannewari is in ein bomvolle Brasserie de Witte
  ti\u00e8des de 1 e edisie van D\u2019n Joeks-Tam-Tam \u00f3s nieje jeugtrio oetgerope.
  Prins Tren I (Geurts) zweijt dit jaor same met zien adjudante Noud (Collin) en Gio
  (Van de Kamp) de scepter euver \u2018t jeugwienri\u00e8k.\\nPrins Tren I is 11 jaor
  geleje gebaore in \u2018t stedje van lol en plezeer. Same met ziene pap Nik, zien
  mam Ingrid en zien zuske Fleur woe\u00ebnt hae al ein paar jaor op de Dokter Blumenkampstraot
  inVenlo. Hae zit op de Schoe\u00ebl aan de Viever in groep 8. Zien hobby\u2019s
  zien voetballe, game en met zien vrinde aafspraeke. \u2019t Meiste is hae te vinde
  op de voetbalvelde van FCV of op \u2019t schoe\u00eblplein. De vastelaovend is umal
  van j\u00f3ngs aaf aan gelierd. Opt\u00f3ch loupe in de stad, nao de jeugmiddaag
  van De Wien, recepties bezeuke en heerlik 3 daag vastelaovend viere in \u00f3s stedje
  van lol en plezeer. Binne De Wien is hae zeker genne vraemde. Allebei zien opa\u2019s
  ware al ens adjudant, eine opa ouk prins en vors en ouk ziene pap m\u00f3ch oe\u00ebts
  de hoe\u00ebgste scepter zweie beej de Wien. As j\u00f3nge j\u00f3ng ging hae al
  met eur mei nao De Wien en druimde hae um net als eur oe\u00ebts ens prins te zien.\\nAdjudant
  Noud is gebaore op 7 september 2011 in Venlo. Wie hae zes waeke ald waas m\u00f3ch
  hae al mei op de Boerebroelofsfoto beej \u2018t gezelschap van de femilie Pollux
  wao zien mooder Broed waas en ziene pap Bode. Opgegreujd in Venlo-Oe\u00ebs, woe\u00ebnt
  hae sinds veurig jaor op de Herungerstraot. Hae zit in \u2018t letste jaor van de
  basisschoe\u00ebl op de Talentecampus Venlo. Ziene vreeje tied bestaet hae zoe\u00eb
  vuuel meugelik aan zien allergroe\u00ebtste hobby: voetbal. Alleriers neteurlik
  as actief voetballer beej FCV, wao hae de andere twie\u00eb hiere van \u2018t trio
  van kin. Naeve voetbal speult hae gaer op de Xbox of op de Playstation, en is hae
  ouk nog ens vaste supporter van VVV, wao ik dit jaor ouk ballej\u00f3ng meug zien.
  Ouk de vastelaovend zit beej mich in \u2019t blood. Zoe\u00ebwaal van pap as van
  mam ziene kant zien d\u2019r mich al vuuel veurgegaon in ein dreejspan of in ein
  andere belangrieke vastelaovesrol. Zien zus Tessa is momenteel dansmerieke beej
  Jocus Toek\u00f3ms en zelf haet hae dao ouk nog effe as jeug-Gardis r\u00f3nd geloupe.\\nAdjudant
  Gio haet auk de vastelaoveslaefti\u00e8d van 11 jaor. Hae woe\u00ebnt same mit zien
  pap, mam en zien zuske Abby op de Straolsewaeg in \u2018t Moeraskwaakersri\u00e8k
  in \u2018t Ven. Zien Hobby\u2019s zien lol maake mit zien vrinde, Game, en dan veural
  Fifa speule, teikene en boetespeule. In de zomer geit hae gaer visse. Zien allergrutste
  Hobby is voetbal, vanaaf zien 4 e laevesjaor is hae gaon voetballe beej FCV. Aafgelaupe
  April is hae gescout door Fortuna Sittard en in augustus haete de transfer gemak
  van FCV naor Fortuna Sittard.\\nDit alles wuurt \u00f3g meigegaeve onder eure prinselikke
  liefspreuk:\\nMit de bal aan de voot en de scepter in de hand\\nZette weej dit jaor
  alles aan de kant\\nDeze Vastelaovend gaon weej dreej daag lang veurop\\nEn zette
  weej de tent ens efkes duchtig op de kop\\nOuk hebbe zeej ein eige leedje. Luuster
  ut heejonder,\"", "\"Kaolmonoxied\\nDit artikel is gesjreve in ''t Sint-Joasters.
  ''t Weurt gewaardeerd \u00f3m in dit artikel ''t Sint-Joasters aan te hauwe of aan
  te gaeve welk anger dialek gebroek is.\\nKaol(stof)monoxied of kaoledamp is ''n
  anorganische verbinjing van zoerstof en kaolstof mit de formuul CO; ''t \u00f3ntsteit
  \u00f3nger anger door \u00f3nv\u00f3lstenjige verbranjing van kaolstof. Kaolmonoxied
  is vergiftig, kl\u00e4\u00f6rloas en r\u00e4\u00f6kloas en hiedoor hi\u00e8l gevi\u00e8rlik.\\n''t
  Gaas is vergiftig doordet ''t zich v\u00e4\u00f6l sterker aan roaj bloodkl\u00e4\u00f6rstof
  (hemoglobine) bindj es zoerstof, wodoor ''t hemoglobine gein zoerstof mi\u00e8r
  kan verveure. \u00d3mdet kaolstof vreuger in de vorm van steinkaol ''n wichtige
  brandjstof waas veur ''t verwurme van hoezer, wobie d\u00f6kker \u00f3ngel\u00f6kke
  veurk\u00f3mme bie slech-\u00f3ngerhaoje sjaorstein en kachele, steit kaolmonoxied
  ouch bek\u00e8ndj es kaoledamp; gooj l\u00f3chaafveur kan z\u00f3n \u00f3ngel\u00f6kke
  aevel mekkelik veurk\u00f3mme.\\nOuch rouke kan ''n eff\u00e8k h\u00f6bbe op de
  wiev\u00e4\u00f6lheid aan kaolmonoxied in ''t blood; roukers h\u00f6bbe dao namelik
  mi\u00e8r van in ''t blood.\"", "\"De evenredigheid vaan Ziene W\u00e8l moot passe
  aon d''n tied\\nTied is evenredig aon Ziene W\u00e8l\\nDe hegemonie euver ''t m\u00f3nnumint
  D''n Tied\\nis eveneins door Slevenier gesjreeve\\nIn D''n Tied drejjt de noe bestaonde
  klok tied neet mie door\\nOp die sj\u00f6pping zal die klok veur altied st\u00e8l
  blieve stoon\\nen noets mie wijer goon\\nIn D''n Tied is ''t \\\"Zijn\\\", altied\\nVeur
  edere vas-staonde sj\u00f6pping ''t f\u00f3ndemint\\nIn D''n Tied heers\\nMach Vrijheid,
  Mach Sjoenegheid, Mach Zelfstandegheid\\nIs r\u00f6s, vrei en contentegheid ummertouw
  aon eder z''n zij\\nIs ''t Doen hielemaol in ballans m\u00e8t de beweging\\nNeet
  geboonde aon de noe bestaonde tied\\nDat Doen gief aon ''t gehiel nog groetere glans\\nIs
  alles vaan die sj\u00f6pping vas-staond\\nVeur altied bestaond\\nVeurtsjreidende
  tied liet ontstoon\\nen liet ummertouw ouch weer vergoon\\nIn veurtsjreidende tied
  is altied de traon en de pijn\\nDrejjt die klok tied oonbermechteg door\\nIn edere
  gesjaope wereld\\nvaan ''t minsekeend zien twie ringe tied\\nAon veurtsjreidende
  tied geboonde\\nAllebei\\nDe Aleinege W\u00e8t moot in ein vaan die twie ring weure
  gevoonde\\nIn ''t middelpunt is de door Slevenier gesjreeve W\u00e8t \\\"Het Elkander\\\"\\nZier
  v\u00e4\u00f6le leevens zien gegeeve um de ziel te laote vinde\\n''t alles beslissende
  etik\u00e8t, De W\u00e8t\\n''t Momint vaan \\\"Vergelding\\\" op dees Eerd\\ntoent
  ''t sleete vaan d''n ierste rink\\nM\u00e8t zwoer, wied dragende geb\u00e4\u00f6rtenisse\\nM\u00e8t
  noets en nimmer getoende geliekenis\\nD''n ierste rink tied weurt aofgeslote\\n''t
  Begin vaan d''n twiede rink\\nVeur de mins op dees Eerd d''n alles beslissende\\nD''n
  ierste rink tied, ''ne groete ruime cirkel\\nm\u00e8t v\u00e4\u00f6l speulruimte
  veur plant bies stein en mins\\nD''n aofstand nao ''t middelpunt, ''ne lange aof
  te l\u00e8gke weeg\\nD''n twiede rink tied, ''ne zier kleine beslote cirkel\\nD''n
  aofstand nao ''t middelpunt, ''ne zier korte aof te l\u00e8gke weeg\\n''ne Rink
  m\u00e8t gein inkele speulruimte\\nIn veurtsjreidende tied zier begrens\\n''t Is
  de wereld vaan de Machte dee ''t moote vinde vaan de W\u00e8t\\nouch op dee weeg
  neet verzwijg\\nAllein de mins zal door d''n twiede rink tied moote goon\\nPlant
  bies en stein zalle dee weeg mage euversloon\\nDe w\u00e8l vaan de zoe metein euvergebleeve
  mins moot passe\\naon D''n Tied vaan Ziene W\u00e8l\\nAon elke Mathematische W\u00e8t
  moot in groetsheid weure voldoon\\nVind \\\"De W\u00e8t\\\" en D''n Tied is vaan
  diech\\naltied aon diene kant\\nNeet gevoonde\\nd''n plaots in D''n Tied veur altied
  vakant\\nVasgeboonde op ''n aander eerd aon veurtsjreidende tied\\nVeur altied\"",
  "\"Zoals te lezen op de blog van Jeker Jazz, Maastricht maakt zich op voor Jeker
  Jazz in oktober:\\n\u201d music and having a good time as an experience you share
  with others\u201d\\nDe video van Lincoln High School Alumni Jazz Band Reunion Rehearsing
  in East St louis is daarvan een mooie illustratie.\\nPingback: Kapper blues In Maastricht
  | Afrosalon | extensions, weave, dreads, haar, manicure en cosmetica\\nPingback:
  Roy Hargrove Quintet In Maastricht | Afrosalon | extensions, weave, dreads, haar,
  manicure en cosmetica\"", "\"Nosferatu: Phantom der Nacht\\nTe zien bij LAB111\\n,
  dinsdag 14 januari 12:20\\nRegisseur en acteurs\\nWerner Herzog (regisseur), Klaus
  Kinski, Isabelle Adjani, Bruno Ganz, Roland Topor, Walter Ladengast, Martje Grohmann,
  Carsten Bodinus, Beverly Walker, Jacques Dufilho, Clemens Scheitz, John Leddy, Rudolf
  Wolf, Stefan Husar, Lo van Hensbergen, Johan te Slaa, Jan Groth, Bo van Hensbergen,
  Claude Chiarini, Margiet van Hartingsveld, Tim Beekman, Roger Berry Losch, Rijk
  de Gooyer, Dan van Husen, Werner Herzog\"", "\"De Veldeke Pluum geit dit jaor nao
  Luuk Hendriks. Det gebeurde op z\u00f3ndaag 13 april in Bibliorura. Luuk is emes
  dae veur de Limburgse taal- en volkskultuur van grote beteikenis is. Op zien eige
  meneer levert hae \u2019n belangrieke biedraag aan \u2019t Remunjse gemeinsjapslaeve.\\nHae
  is \u00f3ndanks zien j\u00f3nge laeftied al jaore sjriever, naokieker en lid van
  de hoofredaksie bie \u2019t Zjwetskammezaol en hoofriddakt\u00e4\u00f6r van de Uulewapper.
  Alle twee de beukskes zeen oetgaves van VV D\u2019n Uul. Ouch is hae al sins 2020
  betr\u00f3kke bie de Sjnapsnaze, de kinjer van VV D''n Uul. Veur ''t naokieke van
  ''ne tekst kins se altied bie Luuk terech. Daonaeve is t''r ouch vriewilliger bie
  Roermond In Tune, ''n platform wo muzikante, podia en publiek zich kint vinje.\\nVeur
  ''t Zjwetskammezaol ging Luuk beveurbeeld veur \u2018n interview nao oze nuje bussjop.
  Ein van zien vraoge waas, of veer \u2019m nog \u00f6rges mit de vastelaovend z\u00f3lle
  zeen. Mgr. Ron van den Hout haaj dao nog neet euver naogedach, maar hae zag det
  hae in eder geval nao de optoch z\u00f3l kieke. Dae trok toch door de Paredisstraat!\\nVerder
  maakde Luuk veur de Uulewapper e nuuj Remunjs Laesplenkske. Hie-op sjt\u00f3nge
  de w\u00e4\u00f6rd: p\u00f6tje sjerre, kelderverke, p\u00f3mpesjtein, sjloetsjpang,
  klitsreem, taot, aomezeik, sjmiespele, kallebas, pens\u00f3rgel, op de huukskes,
  foepnaas, zjwaegel, sjtaekbaere, b\u00e4\u00f6ke, muuskebelle, kloeke en doorsjlaag.
  Dees w\u00e4\u00f6rd waerde sjoon aangekleijd mit gooj foto\u2019s. En det alles
  in good Remunjs gesjreve. Luuk is geweun emes dae veur Remunj g\u00f3ldj waerd is.
  Hae wilt de klein \u00f3ngerdeile oet oze kultuur neet verlaore laote gaon. Luuk
  is nog erg j\u00f3nk, 22 jaor, maar sjrief Remunjs wie eine aje. Veer kinne nog
  v\u00e4\u00f6l van ''m verwachte. Op zo emes zeen veer greuts en Luuk Hendriks krieg
  daor\u00f3m de 21e Veldeke Pluum. Laura Theunissen haaj \u2019n sjoon gedich euver
  en veur \u2018m gemaak. De Prinsekepel van D\u2019n Uul, wo Luuk ouch lid van is,
  brach \u2018m totaal \u00f3nverwachs e sirrenaatje. De aanwezige k\u00f3ste nao
  aafloup nog de tentoonsjt\u00e8lling euver de Remunjse taal bekieke, die nog altied
  in de bibliotheek te zeen is.\\n\u00ab Tr\u00f6k\"", "\"Veer Prins Tim I, van CV
  de Berggeite, zoon van Sjaak en Janny Wolfhagen van ut Maolbrook en groote broor
  van Noortje.\\nLid van CV de Berggeite, beugelclub ut Braetje en centefoekser biej
  sj\u00f6tterie Prins Hendrik.\\n&\\nPrinses Claudine, dochter van Jos en Toos Frenken
  oet Hirkebosj\\nLid van CV de Berggeite, veurzitter biej de jeugraod en lid van
  sj\u00f6tterie Prins Hendrik.\\nTrotse aajers van Daan en Imke\\nVerklaore biej
  de scepter vanne Berggeite en de grasie van Vors Jaimy en Veurzitter Thijs\\nTen
  1ste Det veer Prins Ralf I en Prinses Maud dankbaar zeen veur ut grote festijn en
  det idderein nog biejein is.\\nTen 2de Det veur allebei neet gebaore en getaoge
  zeen in Berg, maar maximaal zeen ge\u00efntegreerd\\nTen 3de Det ut dit jaor dubbel
  fees is oppe Reutjesweg 29 en ut aaf en toe passe en maete zal waere\\nTen 4de Det
  \u00f4s adjudanten allemaal ervaring h\u00f6bbe binne de raod en weete wiej ut sjpelke
  wirk\\nTen 5de Det veer eine dr\u00f6kke agenda hadde tusse mei en noe om alles
  geregeld te kriege\\nTen 6de Det veer dees daag aaf en toe ein knipaug gaeve, nao
  \u00f4s sterre dao baove\\nTen 7de Det veer nao 5 keuningstitels kinne geneete van
  dae eine prinse titel\\nTen 8ste Inne maot laupe ein heel opgave zal zeen en veer
  de polonaise den ouch zulle waardere\\nTen 9de Det veer zonger blessures ut eind
  van de vastelaovend haole\\nTen 10de Det veer en \u00f4s adjudanten gein zang talenten
  zeen, maar waal ein nummer inein geboeks h\u00f6bbe.\\nTen 11de Veer same mit alle
  Berggeite en berggeitjes d\u2019r eine sjoone vastelaovend van gaon make.\\nVeer
  zulle dan auch regere mit de sjpreuk\\n\u201cVeer sjeete \u00f4s de vastelaovend
  door\u201d\"", "\"Amerika\\nDit artikel is gesjreve (of beg\u00f3s) in ''t Mestreechs.
  Laes hie wie v''r mit de versjillende saorte Limburgs \u00f3mgaon.\\nAmerika, soms
  de Amerika''s, is de samevattende naom veur de twie continente Noord-Amerika en
  Zuid-Amerika. Hunne naom oontliene ze aon d''n oontd\u00e8kkingsreizeger Amerigo
  Vespucci, dee begin z\u00e8stienden iew de k\u00f6s vaan Brazili\u00eb verk\u00f3s
  en, in tegest\u00e8lling tot Columbus, devaan euvertuig waor e nui continent te
  h\u00f6bbe gevoonde. Tot deep in d''n twintegsten iew zaog me Amerika es ei continent
  (in ''n indeiling die vief continente umvatde en Antarctica oetsloot); fysisch-geografisch
  gezeen is dat neet zjus umtot Zuid-Amerika pas vrij recint tege Noord-Amerika is
  aongekoume. Dit rizzelteerde in de Groete Amerikaanse Oetwisseling. De mins heet
  Amerika pas vrij laat in bezit genome; de oersprunkeleke bewoeners vaan Amerika
  weure Indiaone geneump. Allewijl is de bulk vaan de bevolking vaan Europese en/of
  Afrikaanse aofkoms.\\nInhawd\\nPaleogeografie[bewirk | br\u00f3n bew\u00e8rke]\\nGeologisch
  gezeen zien Noord- en Zuid-Amerika twie versj\u00e8llende continente. ''t Noorde
  - in paleogeografische contex d\u00e8ks Laurenti\u00eb geneump - hoort nao ''t oetereinvalle
  vaan Pangea tot Laurazi\u00eb. Al op ''t memint tot Pangea definitief oetereinveel
  beg\u00f3s Laurazi\u00eb ziech wijer te splitse en v\u00f6rmde ziech d''n Atlantischen
  Oceaon. Tot 55 mieljoen jaor tr\u00f6k zaot ''t nog aon Europa vas. Sindsdeen is
  Noord-Amerika wel noe en daan nog verboonde gewees m\u00e8t Siberi\u00eb, door de
  Beringlandbr\u00f6gk, dee pas sinds ''t ind vaan de l\u00e8sten iestied (12000 jaor
  geleie) euverstruimp is.\\nDe historie vaan Zuid-Amerika is gans aanders. Dit hoort
  bij ''t zuielek continent Gondwanaland. Nog mie es Laurazi\u00eb beg\u00f3s dit
  continent al direk wijer te sj\u00e4\u00f6re. De sjeiing t\u00f6sse Zuid-Amerika
  en Afrika waor evels neet vaan d''n einen op d''n aanderen daag geb\u00e4\u00f6rd;
  dit beg\u00f3s in ''t zuie en ''t zouw mieljoene jaore dore ietot ze tot twie apaarte
  continente oetgreujde. Zelfs daonao zaot ''t nog vas aon Antarctica; ''n situatie
  die pas 23 mieljoen jaor tr\u00f6k opheel (opening vaan de Straot Drake). Sinds
  zien breuk m\u00e8t Afrika dreef Zuid-Amerika gestiedegaon riechting Noord-Amerika.
  Wie ''t dao aonkaom bleef iers nog ''n ziestraot euver, meh door groete volkanische
  activiteit v\u00f6rmde ziech de Landbr\u00f6gk vaan Panama. Sindsdeen v\u00f6rme
  de Amerika''s ''n einheid.\\nPaleontologie[bewirk | br\u00f3n bew\u00e8rke]\\nDe
  v\u00f6rming vaan de landbr\u00f6gk had groete gevolge veur de fauna vaan de Amerika''s.
  Noord-Amerika had door de br\u00f6gk m\u00e8t Azi\u00eb wezelek dezelfde biestesoorte
  es Eurazi\u00eb. Zuid-Amerika evels had door zien mieljoene jaore vaan isolemint
  ''ne gans unieke fauna, m\u00e8t Xenarthra en Buildiere (de landmassa waor langen
  tied euver Antarctica m\u00e8t Australi\u00eb verboonde). Door de landbr\u00f6gk
  k\u00f3ste de bieste vaan allebei de kante noe d''n aander zie terrein kolonisere.
  De soorte oet ''t noorde, die ziech euver e v\u00e4\u00f6l groeter gebeed hadde
  verspreid, waore evels v\u00e4\u00f6l competitiever es die vaan Zuid-Amerika, die
  rillatief na\u00efef mote zien gewees. Zoe storve binne inkel doezende jaore v\u00e4\u00f6l
  typisch Zuid-Amerikaanse soorte oet. Sommege helen ''t evels wel; ''n inkel femilie
  migreerde zelfs nao Noord-Amerika (de opossums).\\nWie euveral op de wereld heet
  de koms vaan de mins veur ''t oetsterve vaan v\u00e4\u00f6l inheimse soorte gez\u00f6rg,
  en wie gebrukelek waor ''t veural de megafauna dee dao-oonder lijde. Zoe heet me
  fossiele vaan diverse reuzeluiaarde gevoonde, die veur jegers m\u00e8t waopes gemekeleke
  doele waore.\\nHistorie[bewirk | br\u00f3n bew\u00e8rke]\\nPrehistorie[bewirk |
  br\u00f3n bew\u00e8rke]\\nEuver de kolonisatie vaan de Amerika''s door de mins is
  nog v\u00e4\u00f6l oonbekind. D''n ierste oonumstrejje cultuur is de Cloviscultuur,
  die me op naoventrint 13.000 jaor geleie kin datere. Deze cultuur verspreide ziech
  de koumende hoonderde jaore euver gans Amerika; ze weure geach de veurawwers vaan
  de mieste inheimse volker te zien. Wie ze ziech verspreid h\u00f6bbe is neet ummer
  dujelek; neve archeologie beujt ouch de taolwetensjap inziech in dat probleem (al
  kin die wetensjap neet wijer es e paar doezend jaor tr\u00f6kloere). Later kaome
  nog aander volker nao ''t continent, boe-oonder de Eskimo''s. Allemaol weure ze
  geach via Siberi\u00eb nao de Amerika''s te zien gekoume.\\nOontwikkeling vaan diverse
  culture[bewirk | br\u00f3n bew\u00e8rke]\\nM\u00e8t de koms vaan de mins begint
  de Precolumbiaansen Tied, dee - v\u00e4\u00f6lz\u00e8gkend - indeg m\u00e8t de Europese
  oontd\u00e8kking vaan ''t continent. De oontwikkeling vaan de diverse volker leep
  wied oeterein. Sommege bleve jegers-verzaomelere, meh de mieste lagte ziech wel
  touw op landbouw. Euver ''t algemein leefde me in tribaol samelevinge.\\nBesjavinge
  wie veer ze verstoon oontstoonte op twie plaotse. In Midde-Amerika bouwde de Maya''s
  ''n cultuur op die vaanaof 250 n.Chr. tot groete bleuj kaom. Hun cultuur zouw tot
  aon de koms vaan de Europeaone vaan groeten invlood blieve. Zjus noordelek daovaan,
  in ''t huieg Mexico, kaome diverse culture op die culmineerde in ''t mechteg riek
  vaan de Azteke. D''n aandere kern vint me in ''t Andesgebergde. Hei gaof ''t al
  hiel vreug (3500 v.Chr.) de Norte Chicobesjaving, meh de bekindste cultuur is ''t
  Incariek, wat millennia daonao woort gev\u00f6rmp en ziech hel verweerde tege Europese
  euverheersing. Ouch de Muiscacultuur in ''t huieg Colombia maag neet weure vergete.\\nEuropese
  oontd\u00e8kking en kolonisatie[bewirk | br\u00f3n bew\u00e8rke]\\nAl in ''t jaor
  1000 landde ''n Ieslandse expeditie oonder Leif Eriksson in Newfoundland, wat heer
  Vinland neumde. De Vikinge vestegde ziech dao ouch kort, in e d\u00f6rpke wat allewijl
  L''Anse aux Meadows weurt geneump. Rekent me Greunland ouch tot de Amerika''s, daan
  moot me zelfs ''n generatie wijer tr\u00f6k: Leif ziene pa Erik de Roeje oontd\u00e8kde
  dat eiland al en z\u00f6rgde ouch veur koloniste. De kolonie in Vinland heel ''t
  mer kort, meh op Greunland zouw de Europeaone tot nao 1500 blieve.\\nMe is evels
  gewoen um de Europese oontd\u00e8king vaan Amerika in 1492 te l\u00e8gke. In dat
  jaor perbeerde ''n Spaonse expeditie oonder Christoffel Columbus ''n alternatief
  route nao Indi\u00eb te vinde (boe de Portugeze kort daoveur de weeg nao hadde gevoonde).
  Heer landde op ''n eilendsje vaan de Bahama''s (welk perceis is neet bekind). Zelf
  meinde heer Indi\u00eb te h\u00f6bbe gevoonde, meh volgende oontd\u00e8kkingsreize
  nao ''t gebeed trokke dat in twievel. In ''t Verdraag vaan Tordesillas (1494) woort
  de verkinning vaan en hande m\u00e8t ''t nui gebeed aon de Spanjole touwgeweze.
  Allein ein oostelek puntsje kaom aon Portugal touw. In de iewe die volgde versjeen
  ''t nui continent op de kaarte.\\nSpaanje en Portugal waore veural in Zuid- en Midde-Amerika
  ge\u00efntresseerd. Aonvenkelek waore zeker de Spanjole veural oet op sjatte - v\u00e4\u00f6l
  Amerikaanse volker k\u00f3ste gein iezer en maakde in plaots daovaan gebruuk vaan
  goud en z\u00e8lver. ''t Aztekeriek veel in 1521, ''t Incariek heel ''t nog tot
  1533. De inheimse bevolking woort en masse oetgemaord, meh d''n echte massamaordeneer
  waore diverse krenkdes oet d''n Awwe Wereld boe de Indiaone geine weerstand tege
  hadde. Zoe raakde groete gebeje al veur 1600 bekaans oontvolk.\\nSindsdeen gebruukde
  de Europeaone de Amerika''s veural veur de landbouw. Inheimse plante, meh veural
  s\u00f3kkerreet, woort in groete plantages verbouwd en lucratief verhandeld. De
  arbeid heiveur kaom vaan slaove oet Afrika, boe keuninge al sinds de vieftienden
  iew m\u00e8t de Europeaone handelde. Allewijl make zwarte, zeker in gebeed boe oets
  plantagelandbouw is bedreve, e groet deil vaan de plaotseleke bevolking oet.\\nDe
  intresse in Noord-Amerika waor in ''t begin minder groet. ''t Klimaot waor keulder
  en neet gesjik veur de s\u00f3kkerbouw. In ''t zuie vaan ''t continent k\u00f3s
  nog wel katoen weure verbouwd. Veurnaomste kolonisator waor Ingeland, al waagde
  ouch Fraankriek en Nederland ziech dao. De Noord-Amerikaanse kolonies woorte later
  populair oonder landverhuizers.\\nOonaofhenkelekheid[bewirk | br\u00f3n bew\u00e8rke]\\nTegen
  ''t ind vaan d''n achtienden iew woort de band t\u00f6sse de Europese koloniste
  en de moojerlen minder. 13 Ingelse kolonies verklaorde ziech in 1776 oonaofhenkelek
  es de Vereinegde Staote vaan Amerika. Daonao volgde oonras in diverse Spaonse kolonies.
  In Ha\u00efti waoren ''t zelfs de slaove die ziech vaan Fraankreik aofsjeide en
  ''ne staot stiechde. Ouch Brazili\u00eb maakde ziech los vaan Portugal. Canada evels
  woort pas in d''n twintegsten iew oonaofhenkelek.\\nDe Vereinegde Staote greujde
  in de loup vaan de negentienden iew tot de groetste regionaol mach; in d''n iew
  dee volgde zelfs tot de groetste mach vaan de wereld. ''t Land stoont v\u00e4\u00f6l
  Spaonstaolege len bij in hunne strijd veur oonaofhenkelekheid, meh mingde ziech
  daonao zelf intensief in de binnelandse politiek vaan die len.\\nAllewijl laot Amerika
  ziech cultureel in drei groete gebeje verdeile: Ingelstaoleg Amerika (Canada en
  de Vereinegde Staote), Latiens Amerika (Midde- en Zuid-Amerika, m\u00e8t oetzundering
  vaan de Guyana''s) en ''t Caribisch gebeed. D''n invlood vaan de inheimse bevolking
  is allein in ''t binneland vaan Zuid-Amerika (Paraguay, Bolivia en deile vaan Peru)
  en in ''t uterste noorde vaan wezelek belaank; daoboete leve ze d\u00e8ks in rizzervaote.\"",
  "\"Friends\\nDit artikel is gesjreve (of beg\u00f3s) in ''t Zjwaams. Laes hie wie
  v''r mit de versjillende saorte Limburgs \u00f3mgaon.\\nFriends is ''n Amerikaanse
  tillevizieserie gemaak door David Crane en Marta Kaufmann, oorsjpronkelik oetgez\u00f3nje
  door NBC en geproduseerd door Warner Bros., Television en Bright/Kaufmann/Crane
  Productions. In de Vereinegde Staote kwoom de eerste aaflevering, The One Where
  Monica Gets A Roommate, baeter bekend es The One Where It All Began, op 22 september
  1994 oppe tillevizie. De letste aaflevering, The Last One, waerde in de Vereinegde
  Staote op 6 mei 2004 oetgez\u00f3nje.\\nInhawd\\nInhaad[bewirk | br\u00f3n bew\u00e8rke]\\nDe
  serie dreijt om ein groep van zes vrunj: Rachel Green, Ross Geller, Monica Geller,
  Chandler Bing, Joey Tribbiani en Phoebe Buffay. De zes twintjigers wone en w\u00e8rke
  in Manhattan, New York. Es ''t verhaol begint, haet Rachel net h\u00e4\u00f6r verloofde
  Barry veur ''t altaar achtergelaote en is ziej same gaon wone mit h\u00e4\u00f6r
  beste vriendin oet h\u00e4\u00f6r kienjertied, Monica. ''t Tweetal woont in ein
  vledding taengeneuver det van Chandler en Joey en ze tr\u00e8kke v\u00e4\u00f6l
  op mit Monica''s broor Ross, dae pasgeleje gesjeije is van zien lesbiese echgenote.
  Daonaeve is d''r Phoebe, Monica''s eks-hoesgenote. ''t Verhaol sjpeelt zich aaf
  in versjillende vleddinge. Veural in det van Monica waerd v\u00e4\u00f6l belaefd,
  mer ouch in det van Ross en det van Chandler en Joey. Daonaeve bringe ze ouch v\u00e4\u00f6l
  tied door in ''t koffiehoes om de hook van h\u00e4\u00f6r vleddinge, Central Perk.\\nNaodet
  ze nao de sjtad is verhoes, krieg Rachel h\u00e4\u00f6r eerste baantje es serveerster
  in ''t koffiehoes. Later waert ziej assistente veur ''n inkouper en personal shopper
  biej Bloomingdale''s en daonao inkouper veur Ralph Lauren. Monica zeukt nao h\u00e4\u00f6r
  sukses in de eerste sezoene, mer vinjt oeteindelik werk es sjef-kok in ein gerespekteerd
  resterant. Chander werkt ziene waeg omhoog in de informatieverwerking, mer kriegt
  in de letste twee sezoene ein baan in de reklamewerreld, naodet hae ontsjlaag haet
  genaome biej zien veurige baan. Nao ''n wisselend suksesvolle karri\u00e8re, krieg
  Joey oeteindelik ein vaste baan biej ein soap, wovan hae eerder in de serie ontsjlage
  woor. Hae haet ouch v\u00e4\u00f6l biejbaantjes, wor\u00f3nger ''t ''ontklauwe''
  van katte. Paleontoloog Ross waert in sezoen zes oeteindelik hoogleraar. Phoebe
  haaj werk es masseuse en singer/songwriter. Ziej haaj echter net wiej Joey ouch
  v\u00e4\u00f6l biejbaantjes.\\nDe verhaollien volgt de knipperleechrelasie t\u00f6sse
  Ross en Rachel en later in de serie ouch ein \u00f3ntwikkelende relasie t\u00f6sse
  Chandler en Monica.\\nDe serie gebroekt non-stop humor (mit lachbenj) diej meistal
  gein relasie haet mit ''t plot. Sommige grappe h\u00f6bbe te make mit seksualiteit,
  politiek en insinuaties. ''t Programma richtte zich vaak op serieuze kantje, zo-es
  breuke t\u00f6sse koppels. Ironie, veurnamelik de inbring van akteur Matthew Perry,
  waert vaak gebroekt. D''r waert ouch v\u00e4\u00f6l gebroek gemaakt van running
  gags euver de versjillende personages.\\nDe serie goof akteurs diej in ''t verleje
  aktief wore de kans om weer regelmaotig in de sjienwerpers te sjtaon. Elliott Gould
  sjpeelde de vader van Ross en Monica. Marlo Thomas (bek\u00e8nd van That Girl) sjpeelde
  Rachels moder. De themameziek van de serie, I''ll Be There for You van The Rembrandts,
  waerde ein grote hit naodet ein dj oet Tennessee same mit The Rembrandts ein track
  maakte 3 minute en ''t op de radio aafsjpeelde. In de Vereinegde Staote kwoom ''t
  oeteindelik op nummer 17 in de Billboard Top 100.\\nDe populariteit van de serie
  waas zo groot det de zes hoofr\u00f3lsjpelers aan ''t inj van de serie 1 miljoen
  dollar per aaflevering betaald krege. Advertenties tiedens de letste aaflevering,
  diej door 53 miljoen miense bekeke waerde, kostten in de Vereinegde Staote 2 miljoen
  dollar veur ein spotje van 30 sekonde.\\nProductie[bewirk | br\u00f3n bew\u00e8rke]\\nAl
  sjpeelt de serie zich aaf in Manhattans Greenwich Village, is d''r opgenaome in
  Californi\u00eb. De boetekantj van ''t gebouw is echter waal gefilmd in Manhattan,
  op Grove en Bedford Street in the Village. Gein inkele sc\u00e8ne wo-in de akteurs
  te zeen zin, is opgenaome in New York. Zelfs de aopening van ''t programma is opgenaome
  in ein fontein op ''t terrein van Warner Bros in Californi\u00eb.\\nGedurende bienao
  ''t ganse eerste sezoen woor d''r gein sjtraot boete Central Perk, sjlechs ein gesjilderde
  achtergrondj. De crew haaj de rame wazig gemaak en haaj inkele plantje veur de rame
  gezat om dit te verberge.\\n''t Merendeil van de sitcom waert veur ''n laif-publiek
  gefilmd. Allein tiedens ''t filme van de cliffhangers waert ''t publiek oet de sjtudio
  verwijderd, zodet de oetk\u00f3ms van de cliffhanger neet bekend zou waere.\\nAafleveringe[bewirk
  | br\u00f3n bew\u00e8rke]\\nEin aantal sc\u00e8nes diej opgenaome ware zin later
  verwijderd (sommige daovan zin te bekieke op YouTube). In de aaflevering The One
  Where Rachel Tells, wo Monica en Chandler op huweliksreis gaon, is Monica jaloers
  op ''n anger pas getrouwd koppel. Det sjtuk verving ''n angere sc\u00e8ne, dae d''roet
  geknip woor. In dae sc\u00e8ne maakt Chandler ein grap euver det hae bomme biej
  zich zou h\u00f6bbe, woorop hae door de bewaking opgepak waert. Dae sc\u00e8ne is
  d''roet geknip omdet dae twee waeke nao 11 september zou waere oetgezonje.\\nR\u00f3lverdeiling[bewirk
  | br\u00f3n bew\u00e8rke]\\nCox waerde eers gevraogd veur de r\u00f3l van Rachel,
  mer euvertuugde de producers d''r later van det h\u00e4\u00f6r perseunlikheid baeter
  paste biej ''t personage Monica, de rol diej de producers eers haaje oetgekaoze
  veur Jennifer Aniston. Aniston vonj echter ouch det ziej eerder gesjikt waas veur
  Rachel den veur Monica.\\nDe programmaserie waerde ouch b\u00e8kend door h\u00e4\u00f6r
  ongebroekelikke saamheurige akteursploog. De zes hoofr\u00f3lsjpelers sjpanden zich
  d''r veur in om te zorge det neet ein van de sjpelers ging euverheerse. Ein veurbeeld
  hiejvan is det ziej allemaol ofwaal neet, ofwaal veur dezelfde kattegerie van ''n
  priesoetreiking genommineerd wilde waere. Ze wilde ouch allemaol ''tzelfde salaris.
  De akteurs waerde zelfs zon goje vrunj det gasakteur Tom Selleck zich soms zelfs
  boetegesjlaote veulde.\\n''t Personage Ursula (Phoebes tweelingz\u00f6ster) versjeen
  veur ''t eers in de sitcom Mad About You es serveerster. Kudrow sjpeelde Ursula
  in zowaal Mad About You es in Friends. De makers van de serie wore aanvankelik neet
  van plan om veur Phoebe ein tweelingz\u00f6ster te make, mer ze voogde ''t personage
  toe om oet te ligke wor\u00f3m Kudrow versjeen in twee series op dezelfde zender.
  Op ''n bepaald moment versjene Mad About You en Friends in de Vereinegde Staote
  zelfs allebei oppe donderdigaovindj.\\nHoofr\u00f3lle[bewirk | br\u00f3n bew\u00e8rke]\\nBelangriekste
  biejr\u00f3lle[bewirk | br\u00f3n bew\u00e8rke]\\nCulturele impakt[bewirk | br\u00f3n
  bew\u00e8rke]\\nFriends haet op sommige gebiedde zien biejdrage geleverd aan de
  cultuur, veurnamelik op ''t gebied van taal en mode. ''t Gebroek van \\\"so\\\"
  es de beteikenis veur \\\"very\\\" en \\\"really\\\" (veurnamelik in de Vereinegde
  Staote) is neet oetgevonje door ein sjriever van Friends, mer ''t is waal zo det
  ''t grote gebroek van ''t waord in de serie ''t gebroek in ''t alledaagse laeve
  haet bevorderd. Daonaeve waert ''t hel kake van de zin I know! (in de serie veurnamelik
  door Monica) vaak gebroekt. De serie haaj daonaeve ouch ein impakt oppe mode en
  haordracht. ''t Kapsel van Rachel waerde v\u00e4\u00f6l gekopieerd. Joey Tribbiani''s
  aopeningszin How you doin''? waerde ein populaire aopeningszin in de Vereinegde
  Staote. De serie waas ouch de inspirasie veur de culturele meme van de gelamineerde
  lies.\\nDe oetsjpraok \\\"Ross en Rachel\\\" waert ouch vaak gebroek om ein knipperleechrelasie
  mit ein \\\"gesjiedenis\\\", of in ein situasie as \\\"Zit geur noe ech oetrein
  of es Ross en Rachel oetrein?\\\". Deze grap waert ouch gebroek in Scrubs. De sjoonmaker
  besjrieft J.D.''s relasie es \\\"neet ech Ross en Rachel\\\", waat echter bliek
  te gaon euver twee angere werknaemers in ''t ziekehoes.\\nKieksiefers in de Vereinegde
  Staote[bewirk | br\u00f3n bew\u00e8rke]\\nDe 66 minute doerende letste aaflevering
  waerd door Entertainment Tonight genumd es ''t grootste tv-moment van ''t jaor 2004
  en ''t waas ''t op ein nao b\u00e8s bekeke programma. ''t Enige programma mit meer
  kiekers waas de Super Bowl. ''t Versjloog echter neet de kieksiefers diej de angere
  finale-aafleveringe kriege, wiej M*A*S*H (106 miljoen), Cheers (80,4 miljoen) of
  Seinfeld (76,3 miljoen). ''t Waas zelfs neet de meist bekeke aaflevering van Friends.
  Det woor namelik ein aaflevering oet sezoen 2, The One After the Superbowl, dae
  oetkwaam op 28 jannewarie 1996 en 52,9 miljoen kiekers trok. Tiedens ''t 2001-2002
  sezoen waas Friends ''t b\u00e8s bekeke programma van de Vereinegde Staote.\\nFriends
  in Nederlandj en Belsj[bewirk | br\u00f3n bew\u00e8rke]\\nIn Nederlandj waerde de
  serie oetgezonje door \u00f3nger angere Veronica, NET 5, Yorin, RTL 5 en Comedy
  Central. In 2000 won de serie ein Zilvere Televizier-Tulp veur ''t beste boetelandjse
  programma van det jaor.\\nIn Belsj waert de serie oergezonje door de Vlaamse zender
  VIER. Vreuger waerde Friends oetgezonje op VIJF.\\nSins 1 jannewarie 2018 is de
  komplete serie te zeen op Netflix in Belsj en Nederlandj.\\nSpin-off[bewirk | br\u00f3n
  bew\u00e8rke]\\nJoey[bewirk | br\u00f3n bew\u00e8rke]\\nNao ''t inj van de serie
  in 2004 waerde de spin-off Joey gemaak. Van de 46 gemaakte aafleveringe z\u00f3nj
  NBC d''r sjlechs 38 oet, en op 15 mei 2006 veel ''t dook.\\nPrieze[bewirk | br\u00f3n
  bew\u00e8rke]\\n- 2003 - Outstanding Guest Actress in a Comedy Series - Christina
  Applegate\\n- 2002 - Outstanding Comedy Series\\n- 2002 - Outstanding Lead Actress
  in a Comedy Series - Jennifer Aniston\\n- 2000 - Outstanding Guest Actor in a Comedy
  Series - Bruce Willis\\n- 1998 - Outstanding Supporting Actress in a Comedy Series
  - Lisa Kudrow\\n- 1996 - Outstanding Directing for a Comedy Series - Michael Lembeck
  (voor The One After the Superbowl)\\n- 2003 - Best Performance by an Actress in
  a Television Series, Musical or Comedy - Jennifer Aniston\\nPeople''s Choice Awards\\n-
  2004 - Favorite Television Comedy Series\\n- 2004 - Favorite Female Television Performer
  - Jennifer Aniston\\n- 2003 - Favorite Television Comedy Series\\n- 2003 - Favorite
