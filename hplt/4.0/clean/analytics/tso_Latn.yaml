  Loko va swi twa, va tsaka naswona va n\u2019wi tshembisa ku n\u2019wi nyika mali
  ya silivhere.+ Kutani a sungula ku lava ndlela leyinene yo n\u2019wi xenga.+\\n12
  Kutani hi siku ro sungula ra swinkwa leswo-ke-comela,+ leri hi ntolovelo va endlaka
  xitlhavelo xa gandzelo ra paseka ha rona, vadyondzisiwa+ vakwe va ku eka yena: \u201cXana
  u lava leswaku hi ya ku lunghisela kwihi laha u nga ta dyela kona paseka?\u201d+\\n13
  Hiloko a rhuma vadyondzisiwa vakwe vambirhi a ku eka vona: \u201cYanani emutini,
  naswona mi ta hlangana ni munhu a rhwale khuwana ra mati.+ Mi n\u2019wi landzela,\\n14
  naswona laha a nga ta nghena kona, byelani n\u2019wini wa yindlu mi ku, \u2018Mudyondzisi
  u ri: \u201cRi kwihi kamara ra vaendzi ra mina leri ndzi nga dyelaka eka rona paseka+
