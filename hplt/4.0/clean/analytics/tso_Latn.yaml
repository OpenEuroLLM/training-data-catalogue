  matlhelo hinkwawo. 14Leswi a fanelaka ku swi humesa leswaku swi va mhamba leyi hiseriwaka
  HOSI Xikwembu, hi leswi: Mpambani, ni mafurha hinkwawo lama khomaneke ni swa le
  ndzeni, 15ni tinso hi timbirhi ka tona, ni mafurha ya kona; tinso leti ti fanele
  ku tsemiwa swin''we ni tlhelo lero saseka ra xivindzi. 16Kutani muprista \u00fa
  ta swi hisa ehenhla ka alitari, swi va swakudya leswi hisiwaka, leswi ku nun''hwela
  ka swona ku tsakisaka.Van''wana va ri: leswi ku nun''hwela ka swona ku tsakisaka
  HOSI Xikwembu Mafurha hinkwawo i ya HOSI Xikwembu. 17Hinkwako lomu mi nga ta va
  mi tshama kona, mi nga tshuki mi dya mafurha kumbe ngati. Nawu lowu, mi fanele ku
  wu landza, n''wina ni vatukulu va n''wina hilaha ku nga heriki.\u201d\"", "\"Xana
