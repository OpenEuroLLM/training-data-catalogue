  hi byoxe.\"", "\"Bibele Eka Web Site Leyi\\nVUHUNDZULUXERI BYA MISAVA LEYINTSHWA
  BYA MATSALWA YO KWETSIMA\\n14 Kutani paseka+ ni nkhuvo+ wa swinkwa leswo-ke-comela
