sample: '["\"N\u2019wina va ririmi ra Xitsonga, mi hlayisekile eka xikongomelo xa
  mina xa xikaya. A ndzi nga ku yisi kahle ndza ku vona leswaku ku fikeleriwa loko
  hi vona vonele. Vonele hi swipimelo leswi nga tsariwa ku rhangela, hi swipimelo
  leswi nga vuyeleriwa ku vona ndlela yo antswa ya vutomi. Loko hi vona vonele, ku
  na mahlanguti ya nkoka ku tlula ku antswisa vutomi bya hina.\\nParafino vonele yi
  ta va yona mahungu eka xiyimo xa xin\u2019wana na xin\u2019wana xa vutomi bya hina.
  Loko hi vilerisiwa hi Parafino vonele, hi nga endla swo tala swa ku endla swin\u2019wana.
  Swikongomelo swa hina swi endla leswaku hi fikelela xikombiso lexi hi xikongomelo
  xa hina. Loko hi vulavula hi vonele, hi ta va na xikongomelo xa ku vona leswaku
  sweswo swi ta fika eka hinkwaswo leswi hi faneleke ku swi endla.\\nParafino vonele
  yi hlaya mahungu ya hina hi leswi humelelaka hi ku vona vonele. Loko hi vona vonele,
  hi ta twa vutlhari bya vutomi bya hina. Ku fika loko hi kuma n\u2019wana wa hina,
  Parafino vonele yi ta endla leswaku hi fikelela xikombiso xa le henhla xa ku tirhisa
  vonele. Loko hi vilerisiwa hi Parafino vonele, hi ta twa vutlhari bya vutomi bya
  hina hi xikongomelo xa xin\u2019wana na xin\u2019wana.\\nLoko hi vulavula hi Parafino
  vonele, hi ta khensa ku ya emahlweni. Ku hava munhu loyi a nga ta yimela ntsena
  eka vonele leyi. Ku endleka ku vonele ku ta va xikombiso xa ntirho lexi hi xikongomelo
  xa hina xi nga ta endla ku va xihundla. Parafino vonele yi ta ku pfuna ku tirhisa
  vonele eka nkarhi wa vutomi bya hina.\\nHi nga vona leswaku Parafino vonele yi ta
  va yona n\u2019wana wa vutomi bya hina. Hi nga khensa eka timhaka to tala to vona,
  ku kongoma, na swilaveko leswi hi nga na swona. Sweswo i ku vumba n\u2019wana wa
  vutomi bya hina.\\nXikombiso xa leswi i xa ku tiva xikongomelo xa hina. Ku va xikombiso
  xa hina xa Parafino vonele xi fikile ku endla leswaku hi humelela eka vutomi bya
  hina. Loko hi vona vonele, hi ta famba eka ndlela leyi hi nga ta tirha ha yona.
  Hi ta va na swivutiso leswi hi nga na swona eka ku tirhisa vonele.\\nKu tirha sweswi
  i xikombiso xa leswi hi faneleke ku swi endla. Parafino vonele yi ta va xikombiso
  xa leswi. Hi nga swi endlisa njhani? Hi nga endla njhani? Ku khensa ku yini? Sweswo
  swi ta endla leswaku hi humelela eka vutomi bya hina.\\nNdza khensa Parafino vonele,
  ndza khensa leswi hi faneleke ku swi endla eka vutomi bya hina. Ndza khensa ntsena
  leswi vonele yi endla eka hina. Vonele i xikongomelo xa hina xa vutomi lebyi byi
  kongomisiwaka hi voko bya hina. Hinkwaswo leswi hi faneleke ku swi endla i ku kuma
  vutomi bya hina byi endliwa hi vonele. Parafino vonele yi ta pfuna hi ku kuma vutomi
  lebyi byi languteriweke ku vutlhari bya hina.\\nA ndza tshemba leswaku hi nga hava
  ku tiva vutlhari bya vutomi bya hina. Parafino vonele yi ta endla leswaku hi tiva
  leswaku ku va xikombiso xa hina xa vutomi bya hina xi nga hava xikombiso. Yi ta
  pfuna hi ku kongomisa vutlhari bya hina eka nkarhi lowu faneleke. Ku tirha sweswi
  i xikombiso xa leswi hi faneleke ku swi endla.\\nNdza khensa Parafino vonele eka
  vutomi bya hina. Sweswi a ndzi nga swi endlisa njhani, ndza va khensa ku vona leswaku
  vonele yi ta endla leswaku hi famba eka ndlela leyi hi nga ta tirha ha yona. Ku
  va xikombiso xa vutomi lebyi byi faneleke. Ku tiva vutlhari bya vutomi bya hina.
  Ku hlaya xivangelo xa hina xa ku tirhisa vonele. Ku hlaya xivangelo xa Parafino
  vonele.\\nNdza khensa Parafino vonele eka xikongomelo xa hina. Vonele i nchumu wa
  hina, vutlhari bya hina, na xikombiso xa hina. Loko hi vona vonele, hi ta pfuna
  hi ku endla leswaku vutomi bya hina byi humelela. Parafino vonele yi ta va xikombiso
  xa ntirho lexi hi xikongomelo xa hina. Yi ta va xikombiso xa vutomi lebyi byi faneleke.
  Loko hi vulavula hi Parafino vonele, hi ta fanela ku vulavula hi\"", "\"Evandlheni
  rin\u2019wana ni rin\u2019wana ku ni huvo ya vakulu leyi ri langutelaka. Mavandlha
  ya kwalomu ka 20 ma vumba xifundzha naswona swifundzha swa kwalomu ka 10 swi vumba
  muganga. Ku ni vakulu lava endzelaka mavandlha nkarhi na nkarhi, va vuriwa valanguteri
  va xifundzha ni valanguteri va muganga.\\nNkongomiso wa Bibele ni swiletelo swi
  huma eka Huvo leyi Fumaka, ku nga vanhu lava ku nga khale va ri Timbhoni lava sweswi
  va nga eyindlu-nkulu ya misava hinkwayo leyi nga le Brooklyn, eNew York.\u2014Mintirho
  15:23-29; 1 Timotiya 3:1-7.\\nDYONDZA SWO TALA\\nI VAMANI LAVA ENDLAKA KU RHANDZA
  KA YEHOVHA NAMUNTLHA?\\nHa hlangana leswaku hi dyondza Matsalwa hi tlhela hi khutazana.
  U ta amukeriwa hi mandla mambirhi!\"", "\"81\\nNkarhi wun''wana, Elixa a tsundzuxa
  wansati loyi n''wana wa yena a a pfuxiwile eku feni, a ku ka yena: \u201cSuka u
  famba swin''we ni va ndyangu wa wena, u ya tshama lomu swi kotekaka, hikuva HOSI
  Xikwembu xi lerisile leswaku ku ta va ni dyandza etikweni leri, naswona ri ta va
  etikweni ku ringana malembe ya 7.\u201d 2Wansati a endla hilaha munhu wa Xikwembu
  a n''wi byeleke hakona: A suka a famba, yena ni va ndyangu wa yena, va ya tshama
  malembe ya 7 etikweni ra Vafilista va ri valuveri. 3Kuteloko malembe lawa ya 7 ma
  hundzile, wansati a vuya hi le tikweni ra Vafilista, kutani a ya vonana na hosi,
  a kombela ku tlhelela emarhumbini ya yena, ni ku tlheriseriwa masimu ya yena.\\n4Siku
  ra kona, hosi a yi vulavula na Gehazi nandza wa munhu wa Xikwembu, yi kombela ku
  runguleriwa leswo hlamarisa hinkwaswo leswi Elixa a swi endleke. 5Gehazi a a ri
  karhi a rungulela hosi ta n''wana loyi a pfuxiweke eku feni hi Elixa, kutani mana
  wa n''wana wa kona o tshuka a humelela entsindza, a ta kombela ku tlhelela emarhumbini
  ya yena ni ku tlheriseriwa masimu ya yena. Gehazi a ku ka hosi: \u201cWe hosi n''wini
  wanga, wansati loyi Elixa a nga pfuxa n''wana wa yena eku feni hi yena loyi, ni
  n''wana wakwe hi yaloyi!\u201d 6Kuteloko hosi yi vutisisile loyi wansati, yena a
  yi rungulela hinkwaswo. Kavaloko hosi yi vitana un''wana wa valanguteri, yi n''wi
  lerisa yi ku: \u201cManana loyi, \u00fa fanele ku tlheriseriwa swa yena hinkwaswo,
  a nyikiwa ni hinkwaswo leswi nga tshoveriwa emasin''wini ya yena, ku sukela loko
  a rhurhile etikweni leri, ku fikela namuntlha.\u201d\\n7Siku rin''wana, Elixa a
  endzela Damaska. Enkarhini wolowo, Bene-Hadada, hosi ya le Siriya, a a vabya. Loko
  va n''wi tivisa leswaku munhu wa Xikwembu \u00fa fikile, 8Bene-Hadada a lerisa Hazaele,
  a ku: \u201cTeka nyiko, u ya hlanganisa munhu wa Xikwembu, kutani u n''wi vutisa
  makungu ya HOSI Xikwembu, ku twa leswaku xana ndzi ta hola evuvabyini lebyi bya
  mina xana ke?\u201d 9Hazaele a teka tinyiko ta swilo hinkwaswo swa risima swa le
  Damaska, a rhwexa tikamela ta 40, a famba na swona a ya hlanganisa Elixa. Loko a
  hlanganile na Elixa, a vulavula a yimile emahlweni ka yena, a ku: \u201cNandza wa
  wena Bene-Hadada hosi ya Vasiriya \u00fa ndzi rhumile ka wena ku ta vutisa leswaku
  xana \u00fa ta hola evuvabyini bya yena xana?\u201d 10Elixa a n''wi hlamula a ku:
  \u201cFamba u ya n''wi byela leswaku loko ku ri ku hanya, \u00fa ta hanya; kambe
  mina ndzi kombisiwileVan''wana va ri: u ya n''wi byela u ku: \u2018U nga ka u nga
  holi\u2019, hikuva mina ndzi kombisiwile ... hi HOSI Xikwembu leswaku \u00fa ta
  fa hakunene.\u201d 11Kavaloko munhu xa Xikwembu a khanyanisa mombo, a honokela Hazaele
  a ko a n''wi khomisa tingana; kutani munhu wa Xikwembu a sungula ku rila. 12Hazaele
  a vutisa a ku: \u201cXana u rilela yini, wee n''wini wanga?\u201d Elixa a hlamula
  a ku \u201cNdza rila, hikuva ndzi tiva leswo biha leswi u nga ta swi endla eka Vaisraele:
  U ta herisa makhokholo ya vona hi ndzilo; u ta tlhava majaha ya vona hi fumu, u
  phyandlasa swihlangi swa vona, u handzula makhwiri ya vavasati va vona lava tikeke.\u201d
  13\\nHazaele a hlamala, a ku: \u201cXana ndzi mani mina nandza wa wena ku endla
  leswo chavisa swonghasi; mina a ndzi munhu wa nchumu!\u201d Kambe Elixa a hlamula
  a ku: \u201cHOSI Xikwembu xi ndzi kombisile leswaku u ta va hosi ya Vasiriya.\u201d
  14Kavaloko Hazaele a hambana na Elixa, a tlhelela eka n''wini wa yena. Loko a fikile,
  Bene-Hadada a n''wi vutisa a ku: \u201cXana Elixa \u00fa te yini eka wena?\u201d
  Hazaele a hlamula a ku: \u201c\u00da ndzi byele leswaku, ku hanya u ta hanya.\u201d
  15Kambe, hi siku leri tlhandlamaka, Hazaele a teka xinkumbana, a xi peta ematini,
  a khubumeta nhloko ya hosi, a yi pfala moya yi kondza yi fa.\\n16Hi lembe ra vuntlhanu
  ra ku fuma ka Yoramu n''wana Akabu etikweni ra Israele, Yehoramu n''wana Yoxafati
  a vekiwa hosi etikweni ra Yuda.Van''wana va ri: ku rhanga ku fuma Yoxafati etikweni
  ra Yuda, kutani ku vekiwa Yehoramu n''wana Yoxafati a va hosi 17Yehoramu a a ri
  ni malembe ya 32 loko a sungula ku fuma, kutani a fuma malembe ya 8 a ri eYerusalema.
  18Yehoramu a hanya hi tindlela ta tihosi ta Israele ku fana ni va ndyangu wa Akabu,
  hikuva nsati wa yena a a ri N''wa-Akabu. Kutani Yehoramu a endla leswo biha emahlweni
  ka HOSI Xikwembu. 19\\nHambiswiritano, hikwalaho ka Davhida nandza wa xona, HOSI
  Xikwembu a xi lavanga ku herisa Yuda; xi tshembisile leswaku rixaka ra Davhida ri
  nga ka ri nga tekeriwi vuhosi ni siku ni rin''we.\\n20\\nEnkarhini wa Yehoramu,
  vanhu va tiko ra Edomu va hundzukela mfumo wa tiko ra Yuda, va tihlawulela hosi
  ya vona. 21Hiloko Yehoramu a ya hlasela muti wa Seyira, a ri ni makalichi ya yena
  hinkwawo. Vaedomu van''wana va va rhendzela, kutani Yehoramu a pfuka nivusiku a
  dlaya Vaedomu lava, a dlaya ni vafambisi va makalichi ya vona; kambe mavuthu ya
  yena ma tsutsumela emakaya.Van''wana va ri: kambe va rhendzeriwa hi Vaedomu; va
  hluriwa hi vona, kutani mavuthu ma tsutsumela emakaya 22Ku sukela siku rero, Vaedomu
  a va ha fumiwanga hi tiko ra Yuda, ku fikela namuntlha. Enkarhini wolowo, muti wa
  Libina na wona wu hundzukela tiko ra Yuda. 23Mintirho leyin''wana ya Yehoramu, ni
  hinkwaswo leswi a swi endleke, swi tsariwile eka \u201cBuku ya Matimu\u201d ya tihosi
  ta Yuda. 24Yehoramu a tietlelela, a lahliwa ni vakokwa wa yena emutini wa Davhida,
  kutani Ahaziya n''wana wa yena a sala a fuma.\\n25Hi lembe ra vu-12 ra ku fuma ka
  Yoramu n''wana Akabu hosi ya tiko ra Israele, Ahaziya n''wana Yehoramu a sungula
  ku fuma etikweni ra Yuda. 26Ahaziya a a ri ni malembe ya 22 loko a sungula ku fuma,
  a fuma lembe rin''we ntsena a ri eYerusalema. Mana wa yena a a ri Ataliya, ntukulu
  wa Omri hosi ya Israele. 27Ahaziya na yena a hanya hi tindlela ta va ndyangu wa
  Akabu: A endla leswo biha emahlweni ka HOSI Xikwembu ku fana ni ndyangu wa Akabu,
  hikuva a a ri mukon''wana wa vona.\\n28Ahaziya a famba swin''we na Yoramu n''wana
  Akabu, va ya hlasela Hazaele hosi ya le Siriya eRamoto-Giliyadi, kambe Vasiriya
  va n''wi boxa timbanga enyimpini. 29Kutani Yoramu a tlhelela eYizriele, a ya tshunguriwa
  timbanga leti a nga tlhaveteriwa tona hi Vasiriya eRhama, siku leri a nga lwa na
  Hazaele hosi ya le Siriya. Ahaziya n''wana Yehoramu hosi ya Yuda a ya endzela Yoramu
  n''wana Akabu eYizriele, a ya n''wi pfuxela eku vabyeni ka yena.\"", "\"\u201cLeswaku
  Xikwembu xi va swilo hinkwaswo eka vanhu hinkwavo.\u201d\u20141 KOR. 15:28.\\n1.
  I swilo swihi swo tsakisa leswi \u201cntshungu lowukulu\u201d wu nga ta tiphina
  ha swona?\\nANAKANYA hi swilo hinkwaswo leswinene leswi hulumendhe leyi nga ni matimba,
  leyi nga ni mufumi wo lulama ni la nga ni ntwela-vusiwana yi nga ta swi endlela
  vanhu eka malembe ya gidi. \u201cNtshungu lowukulu\u201d lowu nga ta pona \u2018nhlomulo
  lowukulu\u2019 wu ta tiphina hi swilo sweswo leswinene loko ku ta va ku herisiwe
  mafambiselo lawa yo biha ya swilo hi ku helela.\u2014Nhlav. 7:9, 14.\\n2. I yini
  leswi vanhu va swi tokoteke eka malembe ya 6 000 lama hundzeke?\\n2 Eka malembe
  ya 6 000 lama hundzeke, vanhu va ringete ku tifuma naswona sweswo swi endle leswaku
  vanhu va xaniseka swinene. Khale ka khaleni Bibele yi te: \u201cMunhu [u fuma] munhu
  ku n\u2019wi endla swo biha.\u201d (Ekl. 8:9) I yini leswi hi swi vonaka namuntlha?
  Ku ni tinyimpi ni ku pfukela mimfumo ni swiphiqo swo fana ni vusweti, vuvabyi, ku
  onhiwa ka mbango, ku cinca ka maxelo ni swin\u2019wana. Vatirhela-mfumo va lemukise
  leswaku ku ta va ni vuyelo byo biha swinene loko hi nga endli ku cinca lokukulu
  hi tlhela hi tshika ku onha misava.\\n3. Ku ta endleka yini hi nkarhi wa Mfumo wa
  Gidi ra Malembe?\\n3 Ehansi ka mfumo wa Yesu Kreste, Hosi leyi nga Mesiya ni lava
  144 000 lava nga ta fuma na yena, Mfumo wa Xikwembu wu ta lunghisa ku onhiwa hinkwako
  loku endliweke eka vanhu ni laha misaveni. Hi nkarhi wa Mfumo wa Gidi ra Malembe,
  ku ta hetiseka xitshembiso xa Yehovha Xikwembu lexi chavelelaka lexi nge: \u201cNdzi
  tumbuluxa matilo lamantshwa ni misava leyintshwa; swilo swo sungula a swi nge tsundzukiwi,
  hambi embilwini a swi nge ti.\u201d (Esa. 65:17) Hi swihi swiendlakalo swo hlamarisa
  leswi nga ta endleka enkarhini lowu taka? Rito ra Xikwembu ra vuprofeta ri nga hi
  pfuna ku twisisa leswaku hi swihi swiendlakalo swoleswo leswi hlamarisaka, hambileswi
  swi \u2018nga si voniwaka.\u2019\u20142 Kor. 4:18.\\n\u2018VA TA AKA TINDLU VA TLHELA
  VA RIMA MASIMU YA VHINYA\u2019\\n4. Hi swihi swiphiqo swo kuma ndhawu yo tshama
  eka yona leswi vo tala va langutaneke na swona namuntlha?\\n4 Un\u2019wana ni un\u2019wana
  u lava ku va ni yindlu ya yena, ndhawu leyi yena ni ndyangu wa yena va nga ta titwa
  va sirhelelekile. Kambe emisaveni ya namuntlha, swa tika ku kuma ndhawu yo tshama
  eka yona. Vanhu va fumbane emadorobeni lama teleke hi vanhu. Vo tala va tshama emikhukhwini
  kumbe emiakweni ya khale leyi thyakeke. Va vona onge a swi nge koteki leswaku va
  va ni tindlu ta vona vini.\\n5, 6. (a) Esaya 65:21 na Mikiya 4:4 ti ta hetiseka
  njhani? (b) Hi nga yi kuma njhani mikateko yoleyo?\\n5 Loko Mfumo wa Xikwembu wu
  fuma misava, un\u2019wana ni un\u2019wana u ta va ni yindlu ya yena, hilaha swi
  profetiweke hakona hi Esaya loko a ku: \u201cKunene va ta aka tindlu va tshama eka
  tona; kunene va ta rima masimu ya vhinya va dya mihandzu ya wona.\u201d (Esa. 65:21)
  Kambe, ku ni swo tala leswi hi nga swi langutelaka ku tlula ku va ni tiyindlu ntsena.
  Namuntlha, vanhu van\u2019wana va tshama etindlwini ta vona naswona van\u2019wana
  va ni tindlu letikulu swinene. Kambe va vilerisiwa hileswaku a va nge he swi koti
  ku hakelela tindlu ta vona hikwalaho ka swiphiqo swa timali kumbe va vilerisiwa
  hileswaku makhamba ma ta tshova ma yiva. Ehansi ka Mfumo wa Xikwembu a nga kona
  la nga ta vilela hi swilo sweswo. Muprofeta Mikiya u tsale a ku: \u201cEntiyisweni
  va ta tshama, un\u2019wana ni un\u2019wana ehansi ka murhi wakwe wa vhinya ni le
  hansi ka nkuwa wakwe, a ku nge vi na munhu loyi a va chavisaka.\u201d\u2014Mik.
  4:4.\\n6 Loko hi lava ku hanya ehansi ka Mfumo wa Xikwembu hi fanele hi endla yini?
  I ntiyiso, hinkwerhu ka hina ha yi lava ndhawu yo tshama eka yona. Kambe a hi fanelanga
  hi tikarhatela ku kuma tindlu leti hi ti lavaka sweswi, kumbexana hi ku nghena eswikweletini
  leswikulu, hi ta va hi tlharihile loko hi hanya hi ndlela leyi kombisaka leswaku
  hi dzikise mianakanyo ya hina eka xitshembiso xa Yehovha. Tsundzuka leswi Yesu a
  swi vuleke hi yena n\u2019wini, u te: \u201cTimhungubye ti ni mincele ni tinyenyana
  ta tilo ti ni byetlelo, kambe N\u2019wana wa munhu a nga na ndhawu yo veka nhloko
  yakwe.\u201d (Luka 9:58) Yesu a a ta va a akile kumbe a xave yindlu yo saseka swinene
  ku tlula ya munhu un\u2019wana ni un\u2019wana. Ha yini a nga swi endlanga sweswo?
  Yesu a a nga lavi ku tinghenisa eka swilo leswi a swi ta n\u2019wi sivela ku rhangisa
  Mfumo evuton\u2019wini bya yena. Xana hi nga swi kota ku landzela xikombiso xa yena
  kutani hi hlayisa tihlo ra hina ri olova\u2014hi nga teki swilo leswi vonakaka swi
  ri swa nkoka swinene evuton\u2019wini ivi swi hi vangela ku vilela?\u2014Mat. 6:33,
  34.\\n\u201cMHISI NI XINYIMPFANA SWI TA DYA SWIN\u2019WE\u201d\\n7. Yehovha u lerise
  yini malunghana ni vuxaka bya vanhu ni swiharhi?\\n7 Loko Yehovha a sungula ku vumba
  swilo laha misaveni, vanhu u va vumbe eku heteleleni. U byele Mutirhi wa yena la
  nga ni Vuswikoti, Yesu, xivangelo xo va a vumba vanhu a ku: \u201cA hi endle munhu
  hi xifaniso xa hina, a fana na hina, naswona a va fume tinhlampfi ta lwandle ni
  swivumbiwa leswi hahaka swa matilo ni swifuwo ni misava hinkwayo ni xiharhi xin\u2019wana
  ni xin\u2019wana lexi famba-fambaka ehenhla ka misava.\u201d (Gen. 1:26) Xisweswo,
  u lerise Adamu na Evha leswaku va khathalela swiharhi ni ku swi fuma, naswona eku
  heteleleni vanhu hinkwavo a va ta fuma swiharhi.\\n8. I mahanyelo wahi ya swiharhi
  lama tolovelekeke namuntlha?\\n8 Xana swa koteka leswaku vanhu va fuma swiharhi
  hinkwaswo va tlhela va va ni ku rhula na swona? Vanhu vo tala va swi rhandza swifuwo
  swa vona, swo fana ni timbyana ni swimanga. Kambe ku vuriwa yini hi swiharhi swa
  nhova? Xiviko xin\u2019wana xi ri: \u201cVan\u2019wasayense lava hanyeke ekusuhi
  swinene ni swiharhi swa nhova ni ku dyondza mahanyelo ya swona va kume leswaku swiharhi
  hinkwaswo leswi mamisaka swi ni mintlhaveko.\u201d Ha swi tiva leswaku swiharhi
  swa chava kumbe ku hlundzuka loko swi xungetiwa, kambe xana swi nga swi kota ku
  kombisa rirhandzu? Xiviko xexo xi ya emahlweni xi ku: \u201cLoko swiharhi leswi
  mamisaka swi kurisa vana va swona swi kombisa rirhandzu lerikulu.\u201d\\n9. Malunghana
  ni swiharhi, i ku cinca kwihi loku hi nga ku langutelaka?\\n9 Hikwalaho a hi fanelanga
  hi hlamala loko Bibele yi vula leswaku ku ta va ni ku rhula exikarhi ka vanhu ni
  swiharhi. (Hlaya Esaya 11:6-9; 65:25.) Ha yini? Tsundzuka leswaku loko Nowa ni ndyangu
  wa yena va huma engalaveni endzhaku ka Ndhambi, Yehovha u te: \u201cXivumbiwa xin\u2019wana
  ni xin\u2019wana lexi hanyaka emisaveni . . . [xi] ta hambeta [xi] chava ni ku tshuka
  hikwalaho ka n\u2019wina.\u201d Sweswi swiharhi swo tala swa baleka swi ya tumbela
  loko swi vona vanhu. (Gen. 9:2, 3) Kambe Yehovha a nga ku susa ku chava koloko,
  leswaku ku va ni vuxaka exikarhi ka vanhu ni swiharhi hilaha a leriseke hakona eku
  sunguleni. (Hos. 2:18) Mawaku ntsako lowu nga ta kumiwa hi vanhu hinkwavo lava nga
  ta hanya emisaveni hi nkarhi wolowo!\\n\u201cXI TA SULA MIHLOTI HINKWAYO\u201d\\n10.
  Ha yini vanhu va rila?\\n10 Loko Solomoni a vone \u201cswiendlo hinkwaswo swa ku
  tshikilela leswi endliwaka ehansi ka dyambu,\u201d u titshandzile a ku: \u201cWaswivo,
  mihloti ya lava va tshikileriwaka, kambe a va nga ri na muchaveleri.\u201d (Ekl.
  4:1) Namuntlha swilo swi tano kumbe swi nyanye ku tlula mpimo. I mani eka hina la
  nga tshamangiki a rila hikwalaho ka xivangelo xo karhi? I ntiyiso, minkarhi yin\u2019wana
  ha rila loko hi tsakile. Kambe minkarhi yo tala, hi rila loko timbilu ta hina ti
  vavisekile.\\n11. Hi rihi rungula leri nga eBibeleni leri ku khumbaka mbilu?\\n11
  Anakanya hi timhaka to tala leti hi hlayaka ha tona eBibeleni ta vanhu lava rileke.
  Loko Sara a fa a ri ni malembe ya 127, \u2018Abrahama u fikile a ta ba nkosi wa
  Sara ni ku n\u2019wi rila.\u2019 (Gen. 23:1, 2) Loko Nawomi a lelana ni tinhlomi
  ta yena timbirhi leti a ti ri tinoni, \u201cva [sungule] ku tlakusa marito ya vona
  va rila,\u201d kutani va tlhela \u201cva tlakusa marito ya vona va rila hilaha ku
  engetelekeke.\u201d (Rhu. 1:9, 14) Loko Hosi Hezekiya a vabya swinene naswona a
  vona leswaku u ta fa, u khongele eka Xikwembu kutani \u201ca rila swinene,\u201d
  naswona Yehovha u vone mihloti ya yena kutani a n\u2019wi tshungula. (2 Tih. 20:1-5)
  Nakambe xana u kona la nga khumbekiki loko a hlaya rungula ra ku va muapostola Petro
  a landzula Yesu? Loko Petro a twa nkuku wu ringa u \u201c[humele] ehandle, a rila
  hi xiviti.\u201d\u2014Mat. 26:75.\\n12. Mfumo wa Gidi ra Malembe wu ta wu tisa njhani
  ntshunxeko wa xiviri eka vanhu?\\n12 Hikwalaho ka swilo swo tala swo biha leswi
  humelelaka, vanhu va lava ku chaveleriwa ni ku ntshunxiwa. Hi nkarhi wa Mfumo wa
  Gidi ra Malembe, Xikwembu \u201cxi ta sula mihloti hinkwayo ematihlweni ya vona,
  rifu a ri nge he vi kona, hambi ku ri ku kolola, ni xirilo ni xitlhavi a swi nge
  he vi kona.\u201d (Nhlav. 21:4) Swa tsakisa ku tiva leswaku a ku nge he vi na ku
  kolola, xirilo ni xitlhavi nileswaku Xikwembu xi tshembisa ku herisa nala lonkulu
  wa vanhu ku nga rifu. Sweswo swi ta endleka njhani?\\n\u2018HINKWAVO LAVA NGA EKA
  MASIRHA-BAKO YA XITSUNDZUXO VA TA HUMA\u2019\\n13. Ku sukela loko Adamu a dyohile,
  rifu ri va khumbe njhani vanhu?\\n13 Ku sukela loko Adamu a dyohile, rifu ri fume
  tanihi hosi eka vanhu. Ri ve nala la nga hluriwiki, naswona a nga kona munhu la
  tswariweke a ri ni xidyoho la nga ri balekelaka, kasi ri vanga maxangu ni gome lerikulu.
  (Rhom. 5:12, 14) Entiyisweni, \u201chikwalaho ko chava rifu,\u201d vanhu va timiliyoni
  va le \u2018vuhlongeni vutomi bya vona hinkwabyo.\u2019\u2014Hev. 2:15.\\n14. Ku
  ta humelela yini loko rifu ri nga ha ri kona?\\n14 Bibele yi vulavula hi nkarhi
  lowu \u2018rifu tanihi nala wo hetelela ri nga ta herisiwa.\u2019 (1 Kor. 15:26)
  I mintlawa yimbirhi yi nga ta vuyeriwa. \u201cNtshungu lowukulu\u201d lowu hanyaka
  sweswi wu ta pona ivi wu nghena emisaveni leyintshwa naswona wu ta kota ku hanya
  hilaha ku nga heriki. Eka vanhu va tibiliyoni lava feke swi ta koteka leswaku va
  pfuxiwa eku feni. Xana wa yi vona ndlela leyi un\u2019wana ni un\u2019wana wa lava
  va \u201cntsungu lowukulu\u201d a nga ta va a tsake ha yona loko a hoyozela lava
  va pfuxiweke eku feni? Loko hi hlaya rungula leri nga eBibeleni hi vukheta malunghana
  ni vanhu lava pfuxiweke eku feni, hi ta swi twisisa leswaku swi ta va njhani loko
  vanhu va pfuxiwa enkarhini lowu taka.\u2014Hlaya Marka 5:38-42; Luka 7:11-17.\\n15.
  U ta titwa njhani loko u vona un\u2019wana wa varhandziwa va wena lava feke a pfuxiwa
  eku feni?\\n15 Anakanya hi xiga lexi nge, \u201ca va nga ha tikoti hi ku tsaka lokukulu\u201d
  ni lexi nge, \u201cva sungula ku vangamisa Xikwembu.\u201d Loko a wu ri kona eka
  swiendlakalo sweswo, kumbexana na wena a wu ta va u titwe hi ndlela leyi fanaka.
  Hakunene, swi ta hi tsakisa ni ku hi nyanyula swinene loko hi vona varhandziwa va
  hina lava feke va pfuxiwa eku feni. Yesu u te: \u201cNkarhi wa ta lowu hinkwavo
  lava nga eka masirha-bako ya xitsundzuxo va nga ta twa rito ra yena kutani va huma.\u201d
  (Yoh. 5:28, 29) A nga kona ni un\u2019we wa hina la tshameke a vona swilo leswi;
  hakunene ku ta va swin\u2019wana swa \u2018swilo leswikulu leswi nga voniwiki,\u2019
  ku nga xin\u2019wana xa swiendlakalo leswikulu leswa ha ta humelelaka.\\nXIKWEMBU
  XI TA VA \u201cSWILO HINKWASWO EKA VANHU HINKWAVO\u201d\\n16. (a) Ha yini hi fanele
  hi hisekela ku vulavula hi mikateko leyi hi nga si yi kumaka? (b) Pawulo u te yini
  leswaku a khutaza Vakreste va le Korinto?\\n16 Vanhu lava tshamaka va tshembekile
  eka Yehovha eminkarhini leyi yo tika va ta va ni vumundzuku lebyinene! Hambileswi
  hi nga si yi kumaka mikateko leyikulu, loko hi tshama hi ri karhi hi anakanya ha
  yona swi ta hi pfuna leswaku hi dzikisa mianakanyo ya hina eka swilo leswi nga swa
  nkoka hakunene naswona hi ta hambeta hi tirhela Yehovha ni ku papalata ku kavanyetiwa
  hi mafambiselo lawa ya swilo. (Luka 21:34; 1 Tim. 6:17-19) A hi tiyimiseleni ku
  vulavula hi ntshembo wa hina wa nkarhi lowu taka loko hi va ni vugandzeri bya ndyangu,
  loko hi vulavula ni vamakwerhu niloko hi vulavula ni swichudeni swa hina swa Bibele
  ni vanhu lava tsakelaka. Leswi swi ta endla leswaku ntshembo lowu wu va wa xiviri
  eka hina. Muapostola Pawulo u va khutaze hi ndlela yoleyo Vakreste-kulobye. Marito
  ya yena ma va pfune leswaku va anakanya hi swilo leswi nga ta humelela emakumu ka
  Mfumo wa Kreste wa Gidi ra Malembe. Ringeta ku anakanya hi leswi marito ya Pawulo
  ma vulaka swona lama kumekaka eka 1 Vakorinto 15:24, 25, 28.\u2014Yi hlaye.\\n17,
  18. (a) Yehovha a a ri \u201cswilo hinkwaswo eka vanhu hinkwavo\u201d hi ndlela
  yihi eku sunguleni ka matimu ya vanhu? (b) Yesu u ta tirhisa yini ku kondletela
  ku rhula ni vun\u2019we?\\n17 A ku na ndlela yin\u2019wana yo hlamusela ndlela leyi
  vutomi byi nga ta va xiswona emakumu ka gidi ra malembe ku tlula marito lama nge,
  \u201cleswaku Xikwembu xi va swilo hinkwaswo eka vanhu hinkwavo.\u201d Xana sweswo
  swi vula yini? Anakanya hi nkarhi lowu hundzeke aEdeni loko vanhu lava hetisekeke,
  Adamu na Evha, va ha ri xiphemu xa ndyangu wa Yehovha wo rhula. Yehovha Hosi leyi
  Lawulaka, a a swi fuma hi ku kongoma swivumbiwa hinkwaswo leswi a swi vumbeke, ku
  nga khathariseki leswaku swi hanya etilweni kumbe emisaveni. A swi kota ku vulavula
  na yena hi ku kongoma, swi n\u2019wi gandzela ni ku katekisiwa hi yena. A a ri \u201cswilo
  hinkwaswo eka vanhu hinkwavo.\u201d\\n18 Vuxaka byolebyo byo rhula byi kavanyetekile
  loko Sathana a kucetele vanhu leswaku va xandzukela Yehovha. Kambe ku sukela hi
  1914 Mfumo wa Mesiya a wu teka magoza lama faneleke leswaku wu kondletela ku rhula
  ni vun\u2019we. (Efe. 1:9, 10) Hi nkarhi wa Mfumo wa Gidi ra Malembe, swilo swo
  hlamarisa leswi sweswi swi nga \u201cvoniwiki\u201d swi ta endleka. Kutani ku ta
  fika \u201cmakumu,\u201d ku nga ku hela ka Mfumo wa Kreste wa Gidi ra Malembe. Endzhaku
  ku ta endleka yini? Hambileswi Yesu a nyikiweke \u201cvulawuri hinkwabyo etilweni
  ni le misaveni,\u201d a nga titlakusi. A nga tiyimiselanga ku teka xikhundlha xa
  Yehovha. Hi ku titsongahata u ta \u201cnyiketa mfumo eka Xikwembu tlhelo Tata wa
  yena.\u201d U ta tirhisa xikhundlha xa yena xo hlawuleka ni vulawuri bya yena \u201cleswaku
  ku vangamisiwa Xikwembu.\u201d\u2014Mat. 28:18; Filp. 2:9-11.\\n19, 20. (a) Hinkwavo
  lava hanyaka eMfun\u2019weni wa Xikwembu va ta swi kombisa njhani leswaku va amukela
  mfanelo ya Yehovha yo va fuma? (b) Hi swihi swilo swo hlamarisa leswi hi nga ta
  swi tsakela enkarhini lowu taka?\\n19 Hi nkarhi wolowo, hinkwavo lava nga ta va
  va hanya emisaveni ehansi ka Mfumo wa Xikwembu va ta va va hetisekile. Va ta landzela
  xikombiso xa Yesu naswona leswi va titsongahataka, va ta tsakela ku amukela mfanelo
  ya Yehovha yo va fuma. Loko va kombisa leswaku va lava Yehovha a va fuma, va ta
  wu hlula ndzingo wo hetelela. (Nhlav. 20:7-10) Endzhaku ka sweswo, vaxandzuki hinkwavo,
  ku nga khathariseki leswaku i tintsumi kumbe i vanhu, va ta loviseriwa makumu. Hakunene
  wolowo wu ta va nkarhi wo tsakisa! Un\u2019wana ni un\u2019wana endyangwini wa Yehovha,
  etilweni ni laha misaveni u ta n\u2019wi dzunisa naswona Yehovha u ta va \u201cswilo
  hinkwaswo eka vanhu hinkwavo.\u201d\u2014Hlaya Pisalema 99:1-3.\\n20 Xana swilo
  swo hlamarisa leswi Mfumo wa Xikwembu wu nga ta swi endla ku nga ri khale swi ku
  susumetela ku dzikisa mianakanyo ya wena ni ku endla matshalatshala leswaku u endla
  ku rhandza ka xona? Xana u ta papalata ku hambukisiwa hi ntshembo ni nchavelelo
  swa mavunwa swa misava ya Sathana? Xana u ta tiyisa xiboho xa wena xo seketela vuhosi
  bya Yehovha? Onge swiendlo swa wena swi nga kombisa leswaku u navela ku endla tano
  hilaha ku nga heriki. Kutani u ta va ni lunghelo ro va ni ku rhula ni ntshamiseko
  ku nga ri malembe ya gidi ntsena kambe hilaha ku nga heriki!\"", "\"Bibele Eka Web
  Site Leyi | VUHUNDZULUXERI BYA MISAVA LEYINTSHWA BYA MATSALWA YO KWETSIMA\\n1 Mina
  Pawulo na Timotiya, mahlonga+ ya Kreste Yesu, eka vakwetsimi hinkwavo evun\u2019weni
  na Kreste Yesu lava nga eFilipiya,+ swin\u2019we ni valanguteri ni malandza ya vutirheli:\\n2
  Onge mi nga va ni musa lowu nga faneriwiki ni ku rhula loku humaka eka Xikwembu
  Tata wa hina ni le ka Hosi Yesu Kreste.+\\n3 Ndzi nkhensa Xikwembu xa mina nkarhi
  hinkwawo loko ndzi mi tsundzuka+\\n4 eka xikombelo xin\u2019wana ni xin\u2019wana
  xa mina lexi ndzi xi endlelaka n\u2019wina hinkwenu,+ ndzi ri karhi ndzi endla xikombelo
  xa mina hi ntsako,\\n5 hikwalaho ka munyikelo+ lowu mi wu endleke eka mahungu lamanene
  ku sukela eka siku ro sungula ku fika enkarhini lowu.\\n6 Hikuva ndza tiyiseka hi
  leswi, leswaku loyi a sunguleke ntirho lowunene eka n\u2019wina u ta wu heta+ ku
  fikela esikwini+ ra Yesu Kreste.\\n7 Swi lulamile eka mina ku ehleketa leswi malunghana
  na n\u2019wina hinkwenu, hikwalaho ka leswi mi nga embilwini+ ya mina, hinkwenu
  mi hlanganyela+ na mina eka musa lowu nga faneriwiki, etimpecanini ta mina ta khotso+
  ni le ku lweleni+ ni le ku simekeni ka mahungu lamanene hi nawu.+\\n8 Hikuva Xikwembu
  i mbhoni ya mina ya ndlela leyi ndzi mi navelaka ha yona hi xinakulobye lexikulu+
  xo fana ni lexi Kreste Yesu a nga na xona.\\n9 Kutani leswi ndzi hambetaka ndzi
  swi khongelela hi leswi, leswaku rirhandzu ra n\u2019wina ri ya ri andza+ ngopfu
  hi vutivi lebyi kongomeke+ ni ku twisisa+ loku heleleke;\\n10 leswaku mi tiyiseka
  hi swilo+ swa nkoka swinene, leswaku mi pfumala xivati+ ni ku ka mi nga va khunguvanyisi+
  van\u2019wana ku fikela esikwini ra Kreste,\\n11 ni leswaku mi tala mbhandzu wo
  lulama,+ lowu taka ha Yesu Kreste, ku va ku vangamisiwa ni ku dzunisiwa+ ka Xikwembu.\\n12
  Kutani ndzi navela leswaku mi tiva, vamakwerhu, leswaku timhaka ta mina a ti endlanga
  swin\u2019wana handle ka leswaku mahungu lamanene+ ma ya emahlweni,\\n13 lerova
  timpecana+ ta mina ti tiviwa+ erivaleni hi ku fambisana na Kreste exikarhi ka Varindzi
  hinkwavo va Mufumi-nkulu ni lavan\u2019wana hinkwavo;+\\n14 naswona vo tala va vamakwerhu
  eHosini, lava titwaka va tiyiseka hikwalaho ka timpecana ta mina ta khotso, va kombisa
  xivindzi lexikulu xo vulavula rito ra Xikwembu handle ka ku chava.\\n15 I ntiyiso,
  van\u2019wana va chumayela Kreste hi mona ni nkwetlembetano,+ kambe van\u2019wanyana
  va chumayela hi ku tirhisa vunene.+\\n16 Lava va le ndzhaku va twarisa Kreste erivaleni
  hi rirhandzu, hikuva va swi tiva leswaku ndzi vekiwe laha leswaku ndzi lwela+ mahungu
  lamanene;\\n17 kambe lavo sungula va swi endla hi ku kanetana,+ ku nga ri hi nsusumeto
  wo tenga, hikuva va ehleketa ku ndzi pfuxela nhlomulo+ etimpecanini ta mina ta khotso.\\n18
  Kutani ku vuriwa yini? A ku na nchumu, handle ka leswaku hi ndlela yin\u2019wana
  ni yin\u2019wana, hambi hi vukanganyisi+ kumbe hi ntiyiso, Kreste u twarisiwa erivaleni,+
  kutani ndza tsaka ha swona. Entiyisweni, ndzi ta hambeta ndzi tsaka,\\n19 hikuva
  ndza swi tiva leswaku leswi swi ta tisa ku ponisiwa ka mina hi xikombelo+ xa n\u2019wina
  ni ku nyikiwa moya wa Yesu Kreste,+\\n20 hi ku pfumelelana ni ku langutela+ ka mina
  hi mahika ni ku tshemba+ leswaku a ndzi nge khomiwi hi tingana+ hi ndlela yihi ni
  yihi, kambe leswaku hi ntshunxeko wo vulavula+ Kreste u ta twarisiwa sweswi hi miri+
  wa mina, hambi hi vutomi kumbe hi rifu,+ ku fana ni le nkarhini hinkwawo lowu hundzeke.\\n21
  Hikuva eka mina ku hanya i Kreste,+ kutani ku fa+ i mpindzulo.\\n22 Kutani loko
  ku ri ku hambeta ndzi hanya ndzi ri wa nyama, sweswo i mihandzu ya ntirho wa mina+\u2014kasi
  nchumu lowu ndzi nga wu langaka a ndzi wu boxi.\\n23 Ndzi tshikeleriwa hi swilo
  leswi swimbirhi;+ kambe leswi ndzi swi navelaka i ku ntshunxiwa ni ku va na Kreste,
  hikuva leswi, hakunene, swi antswa ngopfu.+\\n24 Hambiswiritano, swa fanela swinene
  leswaku mina ndzi tshama ndzi ri wa nyama hikwalaho ka n\u2019wina.+\\n25 Kutani,
  leswi ndzi tiyisekaka hi leswi, ndza swi tiva leswaku ndzi ta xwa+ ni ku tshama
  na n\u2019wina hinkwenu leswaku mi endla nhluvuko+ ni ku kuma ntsako lowu fambisanaka
  ni ripfumelo ra n\u2019wina,\\n26 leswaku ku khana ka n\u2019wina ha Kreste Yesu
  ku khapakhapa loko ndzi tlhela ndzi va na n\u2019wina.\\n27 Ntsena tikhomeni hi
  mukhuva lowu fanelaka+ mahungu lamanene malunghana na Kreste, leswaku, hambi ndzi
  ta ndzi ta mi vona kumbe ndzi nga vi kona, ndzi twa hi ta swilo leswi khumbaka n\u2019wina,
  leswaku mi yima mi tiyile hi moya wun\u2019we, mi pfunana hi moya-xiviri+ wun\u2019we
  ku lwela ripfumelo eka mahungu lamanene,\\n28 naswona hambi hi ndlela yihi mi nga
  tshukisiwi hi vakaneti+ va n\u2019wina. Nchumu lowu i xitiyisekiso xa ndzoviso eka
  vona, kambe eka n\u2019wina i xa ku ponisiwa;+ naswona xikombiso lexi xi huma eka
  Xikwembu,\\n29 hikuva n\u2019wina mi nyikiwe lunghelo hikwalaho ka Kreste, ku nga
  ri ro veka ripfumelo+ ra n\u2019wina eka yena ntsena, kambe ni ku xaniseka+ hikwalaho
  ka yena.\\n30 Hikuva mi ni nyimpi yo fana ni leyi mi yi voneke malunghana na mina+
  ni yo fana ni leyi mi twaka ha yona sweswi malunghana na mina.+\"", "\"Bibele Eka
  Web Site Leyi\\nVUHUNDZULUXERI BYA MISAVA LEYINTSHWA BYA MATSALWA YO KWETSIMA\\n18
  Yehovha a ya emahlweni a byela Muxe a ku:\\n2 \u201cByela vana va Israyele u ku
  eka vona, \u2018Hi mina Yehovha Xikwembu xa n\u2019wina.+\\n3 Mi nga tshuki mi endla
  hi ku landza ndlela leyi tiko ra Egipta, leri a mi tshama eka rona, ri endlaka ha
  yona;+ ni ndlela leyi tiko ra Kanana ri endlaka ha yona laha ndzi mi yisaka kona,
  mi nga tshuki mi endla ha yona;+ mi nga tshuki mi famba hi ku landza milawu ya vona.\\n4
  Mi fanele mi hetisisa swiboho swa mina swa vuavanyisi+ naswona mi fanele mi hlayisa
  milawu+ ya mina leswaku mi famba eka yona.+ Hi mina Yehovha Xikwembu xa n\u2019wina.\\n5
  Mi fanele mi hlayisa milawu ya mina ni swiboho swa mina swa vuavanyisi, leswi loko
  munhu o swi endla, a faneleke a tlhela a hanya ha swona.+ Hi mina Yehovha.+\\n6
  \u201c\u2018Mi nga tshuki mi tshinela eka munhu wihi ni wihi warikwenu, exakeni
  rin\u2019wana ni rin\u2019wana rakwe leswaku mi funungula vuhava+ byakwe. Hi mina
  Yehovha.\\n7 U nga tshuki u funungula vuhava bya tata+ wa wena ni vuhava bya mana
  wa wena. I mana wa wena. U nga tshuki u funungula vuhava byakwe.\\n8 \u201c\u2018U
  nga tshuki u funungula+ vuhava bya nsati wa tata wa wena. I vuhava bya tata wa wena.\\n9
  \u201c\u2018Loko ku ri vuhava bya makwenu wa xisati, n\u2019wana wa tata wa wena
  wa nhwanyana kumbe n\u2019wana wa mana wa wena wa nhwanyana, hambi a velekiwe endyangwini
  wa ka n\u2019wina kumbe a velekiwe ehandle ka wona, u nga tshuki u funungula vuhava
  bya vona.+\\n10 \u201c\u2018Loko ku ri vuhava bya n\u2019wana wa nhwanyana wa n\u2019wana
  wa wena wa jaha kumbe n\u2019wana wa nhwanyana wa n\u2019wana wa wena wa xisati,
  u nga tshuki u funungula vuhava bya vona, hikuva i vuhava bya wena.\\n11 \u201c\u2018Loko
  ku ri vuhava bya n\u2019wana wa nhwanyana wa nsati wa tata wa wena, n\u2019wana
  wa tata wa wena, yena a ri makwenu wa xisati, u nga tshuki u funungula vuhava byakwe.\\n12
  \u201c\u2018U nga tshuki u funungula vuhava bya makwavo wa xisati wa tata wa wena.
  I xaka lerikulu ra tata wa wena.+\\n13 \u201c\u2018U nga tshuki u funungula vuhava
  bya makwavo wa xisati wa mana wa wena, hikuva i xaka lerikulu ra mana wa wena.\\n14
  \u201c\u2018U nga tshuki u funungula vuhava bya makwavo wa tata wa wena. U nga tshuki
  u tshinela eka nsati wakwe. I hahani+ wa wena.\\n15 \u201c\u2018U nga tshuki u funungula
  vuhava bya nhlomi+ ya n\u2019wana wa wena. I nsati wa n\u2019wana wa wena. U nga
  tshuki u funungula vuhava byakwe.\\n16 \u201c\u2018U nga tshuki u funungula vuhava
  bya nsati wa makwenu.+ I vuhava bya makwenu.\\n17 \u201c\u2018U nga tshuki u funungula+
  vuhava bya wansati ni n\u2019wana wakwe wa nhwanyana. U nga tshuki u teka n\u2019wana
  wakwe wa nhwanyana loyi a beburiwaka hi n\u2019wana wakwe waxinuna ni n\u2019wana
  wakwe wa nhwanyana loyi a beburiwaka hi n\u2019wana wakwe waxisati leswaku u funungula
  vuhava bya vona. I maxaka lamakulu. I ku tikhoma ko biha.+\\n18 \u201c\u2018U nga
  tshuki u teka wansati u engetela eka makwavo wa xisati ku ri ku phikizana+ hi ku
  funungula vuhava byakwe, hileswaku handle kakwe hi nkarhi wa ku hanya kakwe.\\n19
  \u201c\u2018U nga tshuki u tshinela eka wansati hi nkarhi wakwe wa switlhandla+
  wa ku pfumala ku tenga leswaku u funungula+ vuhava byakwe.\\n20 \u201c\u2018U nga
  tshuki u humesela mbewu ya wena ya vununa eka nsati wa nakuloni leswaku u va la
  nga tengangiki hi yona.+\\n21 \u201c\u2018U nga tshuki u pfumelela ku nyiketeriwa+
  ka vana va wena eka Moleke.+ U nga tshuki u nyamisa+ vito ra Xikwembu xa wena hi
  ndlela yoleyo. Hi mina Yehovha.+\\n22 \u201c\u2018U nga tshuki u etlela ni waxinuna+
  ku fana niloko u etlela ni wansati.+ I nchumu lowu nyenyetsaka.\\n23 \u201c\u2018U
  nga tshuki u humesela mbewu ya wena eka xiharhi+ xihi ni xihi leswaku u va la nga
  tengangiki hi yona, naswona wansati a nga tshuki a yima emahlweni ka xiharhi leswaku
  a tivana na xona.+ I ku onha leswi nga swa ntumbuluko.\\n24 \u201c\u2018U nga tshuki
  u tiendla la nga tengangiki hi xin\u2019wana ni xin\u2019wana xa swilo leswi, hikuva
  matiko lawa ndzi ma hlongolaka emahlweni ka n\u2019wina ma tiendle lama nga tengangiki+
  hi swilo leswi hinkwaswo.\\n25 Hikwalaho tiko a ri tenganga, kutani ndzi ta tisa
  nxupulo ehenhla ka rona hikwalaho ka xihoxo xa rona naswona tiko ri ta hlanta vaaki
  va rona.+\\n26 N\u2019wina mi fanele mi hlayisa milawu ya mina ni swiboho swa mina
  swa vuavanyisi,+ mi nga tshuki mi endla xihi ni xihi xa swilo leswi nyenyetsaka
  hinkwaswo, hambi i munhu la tumbulukeke kwalaho kumbe i muluveri la luveleke exikarhi
  ka n\u2019wina.+\\n27 Hikuva vanhu va tiko lava a va ri emahlweni ka n\u2019wina
  va endle+ swilo leswi nyenyetsaka hinkwaswo lerova tiko a ri tenganga.\\n28 Kutani
  tiko a ri nge mi hlanti hikwalaho ka ku ri nyamisa ka n\u2019wina hi ndlela leyi
  fanaka, hikuva kunene ri ta hlanta matiko lawa a ma ri emahlweni ka n\u2019wina.+\\n29
  Loko mani na mani o tshuka a endla xin\u2019wana xa swilo hinkwaswo leswi nyenyetsaka,
  moya-xiviri lowu swi endlaka wu fanele wu dlayiwa eka varikwavo.+\\n30 Mi fanele
  mi hetisisa mfanelo ya n\u2019wina eka mina leswaku mi nga hambeti mi endla hi ku
  ya hi mikhuva yihi ni yihi leyi nyenyetsaka, leyi endliweke emahlweni ka n\u2019wina,+
  leswaku mi nga tiendli lava nga tengangiki ha yona. Hi mina Yehovha Xikwembu xa
  n\u2019wina.\u2019\u201d\"", "\"51Xikwembu xi ku ka mina: \u201cWena munhu, tiendlele
  rikari hi banga ro kariha, u ri tirhisa ku byewula misisi ni malebvu, misisi ya
  kona u yi pima exikalwini, u yi avanyisa hi swiputsa swinharhu. 2Xiputsa lexo rhanga,
  u ta xi hisa exikarhi ka muti, loko valala va ta va va sukile va nga ha wu rhendzeli;
  xiputsa xa vumbirhi, u ta xi tsemelela hi banga u ri karhi u famba-famba ehandle
  ka muti; xiputsa lexo hetelela, u ta xi tshika xi haha emoyeni, kutani mina ndzi
  ta hlomula fumu ra mina ndzi xi sala ndzhaku. 3Kutani u ta teka misisinyana leyi
  saleke, u yi phutsela u yi hoxa exikhwameni; 4eka yona, u ta pambula yin''wana,
  u yi hoxa endzilweni yi tshwa; ndzilo wa kona wu ta hangalaka wu hisa Vaisraele
  hinkwavo!\\n5\u201cMina HOSI N''wini wa hinkwaswo ndzi vurisa sweswo ndzi ri: Muti
  wa Yerusalema, ma wu vona. Ndzi wu vekile exikarhi ka matiko, kutani wona ma wu
  rhendzerile. 6Vaaki va muti lowu va arile ku yingisa swiletelo swa mina ni milawu
  ya mina; va endlile leswo homboloka ku tlula vamatiko hinkwavo lava va akelaneke
  na vona; hakunene Vaisraele va cukumetile swiletelo swa mina ni milawu ya mina,
  va ala ku swi yingisa. 7Hikokwalaho mina HOSI N''wini wa hinkwaswo ndzi vulavula
  na n''wina va le Yerusalema, ndzi ri: Mi vanhu vo karhata ku tlula vamatiko lava
  akelaneke na n''wina. Mi arile ku yingisa milawu ni swiletelo swa mina; a mi swi
  hlayisanga, mi tsandzeka ni ku hlayisa milawu leyinene ya vamatiko.Van''wana va
  ri: kambe mi landzelela mikhuva ya vamatiko lava akelaneke na n''wina 8Leswi timhaka
  ti nga yimisa leswi, mina HOSI N''wini wa hinkwaswo ndzi tiyisa leswaku ndzi ta
  lwa na n''wina, mina hi ndzexe; ndzi ta mi ba vamatiko hinkwavo va ri karhi va swi
  vona. 9Ndzi ta mi endla leswi ndzi nga si tshamaka ndzi swi endla eka vanhu van''wana,
  naswona a ndzi nga ha tlheli ndzi swi endla; ndzi ta mi ba hikwalaho ka manyala
  hinkwawo lawa mi ma endleke: 10\\nExikarhi ka n''wina, ku ta va ni vatatana van''wana
  lava nga ta dlaya vana va vona va va dya; naswona ku ta va ni vana van''wana lava
  nga ta dlaya vatata wa vona va va dya. Kutani lava nga ta pona exikarhi ka n''wina,
  ndzi ta va hangalasa va ya ematlhelweni hinkwawo ya misava. 11Mina HOSI N''wini
  wa hinkwaswo, ndza tiboha hi ku hlambanya ndzi ri: Leswi mi nyamiseke Tempele ya
  mina hi swilo swa n''wina leswo nyangatsa ni manyala ya n''wina, ndzi ta mi byewula
  tinhloko, ndzi nga ha mi tsetseleli kumbe ku mi twela vusiwana. 12Ndzi ta mi avanyisa
  hi mintlawa minharhu: Vanhu va ntlawa wo sungula va ta fa hi mintungu, va dlayiwa
  hi tindlala exikarhi ka n''wina. Va ntlawa wa vumbirhi va ta dlayiwa etinyimpini
  loko valala va hlasela muti wa n''wina. Kutani va ntlawa wo hetelela, ndzi ta va
  hangalasa va ya ematlhelweni hinkwawo ya misava, kutani ndzi ta hlomula fumu ra
  mina ndzi va hlongorisa.\\n13\u201cVukari bya mina byi ta pfurha byi ya emahlweni;
  ndzi ta mi ba ndzi vuyelela, kutani loko swilo leswi swi humelela, mi ta swi tiva
  leswaku loyi a vulavulaka, hi mina HOSI ya rilaveta. 14We Yerusalema, ndzi ta ku
  hundzula rhumbi ni xihlekiso eka vaakelani va wena ni ka vahundzi va ndlela hinkwavo.
  15Vanhu lava akelaneke na wena va ta ku hlekula va ku rhuketela, kutani u ta hundzuka
  xikombiso xo chavisa exikarhi ka vanhu, hikuva va ta vona ndlela leyi ndzi ku avanyisaka
  ni ku ku ba ha yona, eku hlundzukeni ka mina lokukulu. Ndzi vula sweswo mina HOSI.
  16Loko ndzi mi copa hi miseve ya mina leyi dlayaka, mi ta fa mi hela, mi herisiwa
  hi ndlala leyi ndzi nga ta mi vangela yona; ndlala ya kona yi ta ya yi kula swakudya
  swi ko swi nga ha kumeki emutini wa n''wina. 17\\nNdzi ta vanga ndlala ndzi tisa
  ni swiharhi swa nhova, kutani swilo leswi swi ta dlaya vana va n''wina. Mi ta wela
  hi mintungu, mi hlaseriwa hi tinyimpi leti ndzi nga ta mi rhambela tona. Ndzi vula
  sweswo mina HOSI.\u201d\\n61HOSI Xikwembu xi vulavula na mina, xi ku: 2\u201cWena
  munhu, languta leswi humelelaka etintshaveni ta Israele, kutani u twarisa mahungu
  ya mina, 3u byela tintshava leti ni swintshabyana swa kona, u lerisa ni minkova
  ni timbala leswaku swi yingisa rito na mina leri nge: \u2018Vonani, ndzi ta mi vangela
  tinyimpi, mina hi xiviri, ndzi onhetela switsunga swa n''wina swa vukhongeri bya
  hava. 4Ndzi ta herisa tialitari ta n''wina ta magandzelo ya nyama ni ta mirhi ya
  risuna, ndzi ti faya. Varikwenu lava khongelaka swikwembu swa swifaniso, ndzi ta
  va dlayela emahlweni ka swifaniso swa kona. 5Mintsumbu ya n''wina Vaisraele ndzi
  ta yi cukumeta emahlweni ka swikwembu leswi swa hava, ndzi ta sala ndzi hangalasa
  ni marhambu ya kona kusuhi ni tialitari ta n''wina. 6Tivani leswaku hambi mi nga
  tshama kwihi na kwihi, miti ya n''wina yi ta hlaseriwa; switsunga swa vukhongeri
  bya hava ni tialitari ta kona swi ta hirimuxiwa swi hundzuka marhumbi; swikwembu
  swa swifaniso swi ta fayiwa, ku herisiwa ni tialitari ta mirhi ya risuna, kutani
  ntirho wa mavoko ya n''wina wu ta hela.Van''wana va ri: hikuva swi mi vangela nandzu
  7Loko mintsumbu yi ta ku n''wal\u00e1l\u00e1l\u00e1, exikarhi ka n''wina, mi ta
  pfumela leswaku HOSI hi mina!\u2019\\n8\u201cHambiswiritano, ndzi ta tshika van''wana
  va n''wina va hanya; va ta pona ku dlawa, va hangalasiwa va ya ematikweni mambe,
  9kutani varikwenu lava, lava nga ta va va ponile ku dlawa, va ta ndzi anakanya loko
  va ri evukhumbini exikarhi ka vamatiko. Va ndzi vavisile ngopfu,Van''wana va ri:
  Ndzi ta va twisa ku vava hikuva timbilu ta vona ti ndzi tshikile ti ndzi fularhela;
  va langutile eka swikwembu swa vona swa hava, mina va nga ha ndzi tshembi. Kambe
  eku heteleleni va ta tisola ehenhla ka mintirho ya vona leyo homboloka ni manyala
  ya vona hinkwawo, 10kutani va ta tiva leswaku HOSI Xikwembu hi mina! Loko ndzi vula
  leswaku ndzi ta va vangela makhombo, a ndzi vungunyi!\u201d\\n11HOSI N''wini wa
  hinkwaswo \u00fa vurisa sweswo \u00fa ri: \u201cRhwalani mavoko mi cina-cina, mi
  rila mi ku \u2018Yo!\u2019 hikuva Vaisraele va herisiwa hi matlhari ni tindlala
  ni mintungu, hikwalaho ka manyala hinkwawo lawa va ma endleke. 12Lava nga ya tumbela
  kule va ta fa hi ntungu, lava lwaka kusuhi ni muti va ta dlawa hi matlhari; kutani
  lava nga ta sala emutini va rhendzeriwe hi valala,Kumbe: va titwa va hlayisekile
  vona va ta fa hi tindlala. Hi swona leswi ndzi nga ta va vangela swona eku hlundzukeni
  ka mina, 13kutani mi ta tiva leswaku HOSI Xikwembu hi mina! Lava gandzelaka swikwembu
  swa swifaniso, va ta dlayeriwa emahlweni ka swona; mintsumbu ya vona yi ta cukumetiwa
  kusuhi ni tialitari ta vona, yi kumeka eswitsungeni hinkwaswo, ni le tinhlohlorhini
  hinkwato ta tintshava, ni le murhini wun''wana ni wun''wana lowu tlhumeke, ni le
  hansi ka minkuhlu, ti nga tindhawu hinkwato leti Vaisraele va gandzelaka swikwembu
  swa vona swa swifaniso eka tona, loko va swi humesela magandzelo layo nun''hwela.
  14Ndzi ta tshambuluta voko ra mina ndzi va ba; ndzi ta hlasela tiko ra vona ni miti
  ya yona, ndzi swi onhetela, ku sukela emananga ya le dzongeni ku ya fika emutini
  wa Ribila le n''walungwini;Van''wana va ri: ku sukela emananga ya Dibilata kutani
  va ta tiva leswaku HOSI Xikwembu, hi mina!\u201d\\n71HOSI Xikwembu xi vulavula na
  mina xi ku: 2\u201cWena munhu, byela vaaki va tiko ra Israele leswaku mina HOSI
  N''wini wa hinkwaswo ndzi ni rito eka vona leri nge:\\n\u201c \u2018Tiko ra hela,
  ni sweswi ri herile\\nematlhelweni hinkwawo ya rona.\\n3Na n''wina Vaisraele ma
  hela!\\nEku hlundzukeni ka mina, ndzi ta mi tela,\\nndzi mi avanyisa hikwalaho ka
  mikhuva ya n''wina leyo biha,\\nndzi mi bela manyala ya n''wina hinkwawo.\\n4Ndzi
  nga ka ndzi nga mi rivaleli,\\na ndzi nga mi tweli vusiwana;\\nndzi ta mi ba hikwalaho
  ka mikhuva ya n''wina leyo biha,\\nndzi mi bela manyala lama nga kona ka n''wina,\\nkutani
  mi ta tiva leswaku HOSI Xikwembu, hi mina!\u2019 \u201d\\n5HOSI N''wini wa hinkwaswo
  \u00fa vurisa sweswo \u00fa ri:\\n\u201cKhombo lerikulu ra ta, ri le ndleleni.Van''wana
  va ri: Makhombo ma ta hi ku landzelelana, ma le ndleleni\\n6Tiko ra hela, ni sweswi
  ri herile,\\nna n''wina ma sungula ku hela.\\nMakumu ya fikile!\\n7N''wina vaaki
  va tiko, ku hela ka n''wina ku fikile,\\nnkarhi wa kona hi wona lowu;\\nri tile
  siku ra mpfilumpfilu,\\nni ra ku hela ka minkulungwana emagangeni.\\n8Eku hlundzukeni
  ka mina lokukulu,\\nndzi ta mi ba ku nga ri khale;\\nndzi ta mi avanyisa hikwalaho
  ka mikhuva ya n''wina leyo biha,\\nndzi mi bela manyala ya n''wina hinkwawo.\\n9Ndzi
  nga ka ndzi nga mi rivaleli,\\na ndzi nga mi tweli vusiwana;\\nndzi ta mi bela mikhuva
  ya n''wina leyo biha\\nni manyala lama nga kona eka n''wina,\\nkutani mi ta tiva
  leswaku loyi a mi baka, hi mina HOSI!\\n10\u201cVonani nkarhi wa ta, ni sweswi wu
  fikile,\\nnkarhi wa ku herisiwa ka Vaisraele,\\nhikuva va tsakela ngopfu ku xanisa
  van''wana,\\nni ku tikurisa ka vona ku ya ku engeteleka.\\n11Kambe tihanyi ta vona
  ti ta va vangela maxangu layo chavisa,\\na ku nga poni na un''we wa vona;\\nmintshungu
  ya vona yi ta hangalaka,\\nni mpfumawulo wa kona wu ta miyetiwa;Kumbe: rifuwo ra
  vona ni ku dzuneka ka vona swi ta hangalaka\\nvukosi bya vona byi ta hela byi ku
  bi!Van''wana va ri: a va nga riliwi, kumbe: a va nga kumi ku wisa\\n12Nkarhi wa
  ta, ni siku ri fikile,\\nlaha muxavi a nga ta ka a nga ha tsaki,\\nni laha muxavisi
  a nga ta ka a nga vileli,\\nhikuva vukari bya mina byi ta wela mintshungu ya Vaisraele.\\n13Leswi
  muxavisi a swi xaviseke,\\na nge he tlheli a swi kuma,Vonani Levhitika 25:28, milawu
  ya lembe ra Jubili\\nhambiloko yena ni muxavi va nga hanya kun''we malembe yo tala,\\nhikuva
  vukari bya Xikwembu byi ta ba mintshungu ya Vaisraele,\\na byi nga hundzuki:Van''wana
  va ri: hikuva xivono ehenhla ka mintshungu ya Vaisraele xi tiyile, a xi nga hundzuki\\nHinkwavo
  va dyohile, va ta lahlekeriwa hi vutomi.\\n14Mhalamhala yi biwile,\\nmavuthu hinkwawo
  ma hlomile matlhari,\\nkambe a ku humi munhu a ya enyimpini,\\nhikuva vukari bya
  mina HOSI\\nbyi le henhla ka mintshungu ya Vaisraele.\u201d\\n15HOSI Xikwembu xi
  engeta xi ku:\\n\u201cEnhoveni, ku ta lwiwa,\\nmintungu ni tindlala swi ta wela
  Yerusalema;\\nlava lwaka nyimpi ehandle va ta dlawa hi valala,\\nni lava nga sala
  emutini, va ta herisiwa hi tindlala ni mintungu.\\n16Lava poneke ku fa,\\nva ta
  tsutsuma va ya etintshaveni,\\nva ri karhi va rila hinkwavo kukota matuva ya le
  minkoveni,Van''wana va ri: va ta rila kukota matuva ya le minkoveni, va dlayiwa
  hinkwavo\\nhinkwavo va tisola hi leswi va dyoheke.\\n17Hinkwavo va ta tsemeka nhlana,\\nva
  nga ha tikoti hi ku chava.\\n18Va ta ambala swa nkosi,\\nva khomiwa hi ku rhurhumela;\\nhinkwavo
  va ta vonaka va ri ni tingana,\\nva byewula tinhloko hi ku rila.\\n19Va ta cukumeta
  silivhere ya vona etaleni,\\nnsuku wa vona wu hundzuka thyaka;\\nrifuwo leri ra
  vona ri nge va kutsuli\\nesikwini leri ndzi nga ta va hlundzukela mina HOSI;\\na
  va nga koti ku dya rona va xurha,\\nva nge tati makhwiri ya vona ha rona.\\nHakunene,
  silivhere ni nsuku\\nhi swona leswi swi va dyohiseke:\\n20Ha swona, va tiendlele
  vuhlalu lebyo saseka, va tinyungubyisa ha swona;\\nva tivumbele ha swona swikwembu
  swa manyala leswi swi ndzi hlundzukisaka;\\nhikokwalaho ndzi ta hundzula rifuwo
  ra vona\\nri va thyaka ntsena.\\n21Ndzi ta ri nyiketa emavokweni ya vamatiko va
  ri teka,\\nswigevenga swo huma kule swi ta ri phangha, swi tlanga ha rona.\\n22Ndzi
  ta languta etlhelo ndzi nga endli nchumu,\\nloko valala va hlasela xivandla xa mina
  xo saseka,\\nni loko vanhu va tihanyi va nghena ka xona va xi onhetela.\\n23\u201cFulani
  tinsimbhi mi endla tinketani,Hileswaku tinketani ta lava nga ta yisiwa evukhumbini\\nhikuva
  tiko ri tele vadlayi,Kumbe: vanhu lava nga avanyiseriwa rifu va tele etikweni\\nni
  mintirho ya tihayi yi tate Yerusalema.\\n24Hikokwalaho ndzi ta tisa vamatiko lavo
  karhata ngopfu,\\nva ta teka tindlu hinkwato ta muti.\\nNdzi ta pfala nomo wa lava
  tivulaka tinhenha,\\nndzi onhetela ni tindhawu leto hlawuleka ta muti.\\n25Esikwini
  ra maxangu, loko va lava ku rhula,\\nva nga ka va nga ku kumi.\\n26Makhombo ma ta
  khandzakanya,\\nmahungu ya wona ma landzelelana.\\nLava kombelaka swivono eka vaprofeta,
  a va nga swi kumi,\\nvaprista a va nga ha dyondzisi milawu,\\nni vakulukumba va
  ta tshika ku tsundzuxa van''wana.\\n27Mufumi wa tiko \u00fa ta rila nkosi,\\ntindhuna
  ta yena ti hela matimba,\\nni vaaki va tiko va oma swirho hi ku chava.\\nNdzi ta
  va endla leswi va endleke van''wana,\\nndzi va avanyisa hi maavanyisele ya vona,\\nkutani
  va ta tiva leswaku HOSI Xikwembu, hi mina!\u201d\"", "\"U VELEKIWE HI 1911\\nU KHUVURIWE
  HI 1952\\nMATIMU YAKWE HI KU KOMISA A a ri murhangeri wa ntlawa wa tinsulavoya kambe
  u hetelele a va xirho xa Komiti ya Rhavi.\\nSIKU rin\u2019wana, Makwerhu Sormin
  u vitaniwe hi Mukongomisi loyi a nga ni Vutivi eka hofisi ya gqwetankulu.\\nMukongomisi
  u te: \u201cU huma laha Indonesia, ndzi byele ntiyiso. Xana Timbhoni ta Yehovha
  ti endla yini laha Indonesia?\u201d\\nMakwerhu Sormin u hlamule a ku: \u201cU nge
  ndzi ku byela matimu ya mina. Ndzi tshame ndzi va murhangeri wa ntlawa wa tinsulavoya
  kambe sweswi ndzi dyondzisa vanhu Bibele. Hi leswi Timbhoni ta Yehovha ti swi endlaka
  laha Indonesia, ti pfuna swigevenga leswaku swi va vaakatiko lavanene.\u201d\\nEndzhakunyana
  Mukongomisi loyi a nga ni Vutivi u vule leswi: \u201cNdzi twa vanhu vo tala va rila
  hi Timbhoni ta Yehovha. Ndza swi tiva leswaku i vukhongeri bya kahle hikuva byi
  pfune Nkulukumba Sormin leswaku a cinca.\u201d\"", "\"Tsalwa leri ri nyika nxaxamelo
  wo koma wa timfanelo na vutihlamuleri lebyi u nga na byona loko u karhi u teka xiave
  eka ndzingeto wa swa vutshunguri wa Netiweke ya Ndzingeto wa Murhi wa Nsawutiso
  wa HIV (HIV Vaccine Trials Network (HVTN)). Xikongomelo xa Tsalwa leri ra Timfanelo
  na Vutihlamuleri i ku pfuna vatekaxiave va ndzavisiso ku titekela swiboho na hi
  ku tirhisana na vatirhi va ndzavisiso. Hlaya fomo yo nyika mpfumelelo ku kuma mahungu
  hi xitalo.\\nTimfanelo ta Mutekaxiave\\nTanihi mutekaxiave eka dyondzo ya ndzavisiso
  leyi fambelanaka na HIV/AIDS ya HVTN, u na mfanelo yo:\\n- Tiva mahungu hinkwawo
  lama tivekaka, ku katsa na mixungeto na mivuyelo leyi nga vaka kona ya ku teka xiave
  eka ndzavisiso, u hlamuseriwa swona hindlela leyi u nga ta yi twisisa. U ta byeriwa
  hi mahungu man''wana na man''wana mantshwa lama nga ta kumeka hi nkarhi wa ndzavisiso.\\n-
  Hlamuriwa swivutiso hinkwaswo.\\n- Ala ku teka xiave kumbe ku tshika ndzavisiso
  nkarhi wun\u2019wana na wun\u2019wana. U nga ala ku teka xiave eka milavisiso yin''wana
  na yin''wana yo landzelerisa leyi u nga hlamuseriwaka hayona. A wu nga lahlekeriwi
  hi timfanelo tihi kumbe tihi leti nga hlamuseriwa eka tsalwa leri loko u ala ku
  teka xiave eka ndzavisiso kumbe loko u wu tshika.\\n- Mbangu wa ndzavisiso lowu
  nga riki na xihlawuhlawu. Leswi u swi hlawulaka, mikoka, ripfumelo, na ndhavuko
  swa wena swi ta hloniphiwa hi vanhu lava fambisaka ndzavisiso.\\n- Hundziseriwa
  ku ya kuma switsundzuxo, nseketelo, mirhi, na vukorhokeri bya vutshunguri, bya mavabyi
  lama u nga vaka na wona hi nkarhi wa ndzavisiso, ku katsa na HIV.\\n- Kuma mpfuno
  wo ahlula swiphiqo leswi fambelanaka na ku hanyisana na vanhu van''wana na/kumbe
  xihlawuhlawu. Hi mpfumelelo wa wena, hi nga vulavurisana na vanhu lava u hi kombelaka
  leswaku hi tihlanganisa na vona leswaku hi va hlamusela hi vutekaxiave bya wena
  eka ndzavisiso.\\n- Kuma ntshungulo wa ku vaviseka loku vonakaka, loko ko va kona,
  eka ku vaviseka kun''wana na kun''wana loku nga fambelanaka na swimakiwa kumbe maendlelo
  ya ndzavisiso ku nga ri hikokwalaho ka swivangelo swin''wana, hilaha swi hlamuseriweke
  hakona eka fomo yo nyika mpfumelelo ya ndzavisiso. Ku na mali yo hakelela vutshunguri
  bya ku vaviseka ka muxaka lowu. Ntlawa lowu langutisisaka timhaka ta vuhlayiseki
  ta ndzavisiso wu teka xiboho xa loko ku vaviseka ku fambelana na ndzavisiso. U nga
  kombela leswaku xiboho xi langutiwa nakambe loko u nga pfumelelani na xona. Eka
  timhangu tin''wana, swi nga endleka mali yi nga ringani ku hakelela vutshunguri
  hinkwabyo. Mitlawa leyi tikatsaka eka ndzavisiso yi ta kombela mali yin''wana loko
  swi fanerile, kambe a hi tiyisisi leswaku yi ta kumeka. Vatirhi va ndzavisiso va
  wena va ta ku nyika mahungu hi xitalo eka mhaka leyi nakona va ta hlamula swivutiso
  swihi kumbe swihi leswi u nga vaka na swona kumbe va ku hlanganisa na munhu loyi
  a thwaseleke ku hlamula swivutiso swa wena.\\n- Endliwa mikambelo ya mahala no nkahoxeko
  wa ntlulelo wa HIV hi nkarhi wa ndzavisiso. Loko, emakumu ka ndzavisiso, u ri na
  mbuyelo wa nkambelo lowu kombaka leswaku u na HIV leyi vangiwaka hi ximakiwa xa
  ndzavisiso ku nga ri ntlulelo wa HIV, u ta endliwa mikambelo yo landzelerisa etliliniki
  ya ndzavisiso kumbe hi ku tirhisa vukorhokeri byo kambela bya HVTN ku fikela loko
  mivuyelo yi nga ha kombi ku va u ri na HIV.\\n- Kuma mpfuno eka ku fikelela vutinyiketeri
  bya ndzavisiso. U ta nyikiwa nxaxamelo wa tiayitheme leti nga kona ta wena hi ndhawu
  ya wena.\\n- Va na xihundla. Mivulavurisano na tirhekhodo mayelana na wena na vutekaxiave
  bya wena eka ndzavisiso swi ta avelaniwa ntsena loko swi fanerile ku endla ndzavisiso,
  kumbe hilaha swi lavekaka hakona ku ya hi nawu. Hlaya fomo yo nyika mpfumelelo ya
  ndhawu ya wena ku kuma mahungu hi xitalo.\\n- Nyikiwa xikhadana xa vutitivisi xa
  ndzavisiso lexi kombaka leswaku u le ka ndzavisiso. Xikhadana lexi xi nga bohiki
  xi ta katsa nomboro ya riqingho na/kumbe adirese ya munhu loyi a nga nyikaka mahungu
  yo engetela.\\n- Hlayisa timfanelo ta xinawu ta wena. Tanihi mutekaxiave wa ndzingeto,
  a wu lahlekeriwi hi timfanelo tihi kumbe tihi ta wena.\\n- Byeriwa loko u kumile
  placebo kumbe ximakiwa lexi lavisisiwaka loko ndzavisiso wu hela, kumbe loko swi
  laveriwa swa vutshunguri.\\n- Byeriwa hilaha ndzavisiso wu fambaka hakona, ku byeriwa
  leswaku mivuyelo ya ndzavisiso yi ta kumeka rini, na ku leswaku mutirhi wa ndzavisiso
  a ku tivisa na ku ku hlamusela mivuyelo ya ndzavisiso.\\n- Tiva loko ku ri na tihakelo
  leti fambelanaka na vutekaxiave na loko ku ri leswaku u ta ririsiwa eka vutekaxiave
  bya wena.\\nVutihlamuleri bya Mutekaxiave\\nTanihi mutekaxiave wa dyondzo ya ndzavisiso
  leyi fambelanaka na HIV/AIDS ya HVTN, u na vutihlamuleri byo:\\n- Langutisisa no
  kombisa ku twisisa eka matheriyele hinkwayo leyi u nga nyikiwa yona, ku katsa na
  matsalwa yo nyika mpfumelelo. Kombela ku hlamuseriwa mahungu man''wana na man''wana
  lama u nga ma twisisiki u nga si pfumela ku teka xiave eka ndzavisiso. Naswona u
  nga vutisa swivutiso nkarhi wun''wana na wun''wana wa ndzavisiso.\\n- Teka xiboho
  hi ku twisisa hi loko u lava ku teka xiave eka ndzavisiso lowu endzhaku ka ku pima
  mixungeto na mivuyelo. Swi na nkoka ku tiva leswaku ndzavisiso wu vulavula hi yini.
  Vatirhi va ndzavisiso va ta ku pfuna haswona. Loko swi ta ku pfula ku teka xiboho,
  vulavula na vanhu lava u va tshembaka na ku va hlonipha hi hiloko ku teka xiave
  eka ndzavisiso swi ku lulamerile.\\n- Byela vatirhi va ndzavisiso hi xihatla hilaha
  swi kotekaka hakona loko u tokota xihlawuhlawu na/kumbe ku vavisiwa emoyeni hi vanhu
  van''wana loku u ehleketaka leswaku ku fambelana na vutekaxiave bya ndzingeto bya
  wena.\\n- Ka u nga nyikeli ngati, swirho kumbe swihalaki swin''wana swa miri hi
  nkarhi wa ndzavisiso.\\n- Endlisa swikambelo swa HIV eka ndhawu ya ndzavisiso ntsena
  loko ndzavisiso wu nga si hela. Vulavula na vatirhi va ndzavisiso loko u fanele
  kumbe ku kamberiwa eka ndhawu yin''wana.\\n- Ka u nga vi muyimana loko ku ri na
  nkoteka wa leswaku swi nga va tano, swi papalati hi nkarhi wa ndzavisiso hi ku tirhisa
  tindlela to sivela mbeleko leti tirhaka kahle. Vatirhi va ta languta tindlela to
  sivela mbeleko ta kahle na wena.\\n- Ya eka maendzo ya wena ya ndzavisiso. Byela
  vatirhi va ndzavisiso hi xihatla hi laha swi kotekaka hakona loko u lava ku cinca
  siku ro voniwa.\\n- Khoma vatirhi va ndzavisiso hi nhlonipho.\\n- Va na xihundla
  hi vutekaxiave bya va''wana eka ndzavisiso.\\n- Nyika vatirhi va ndzavisiso mahungu
  lama fambelanaka na ndzavisiso yo helela no lulama. Byela vatirhi va ndzavisiso
  hi ku cinca kun''wana na kun''wana ka mahungu ya vutihlanganisi kumbe rihanyu ra
  wena.\\n- Landzelela swileriso swa mutirhi wa ndzavisiso hilaha u kotaka hakona.
  Tirhisana na vatirhi va ndzavisiso leswaku rihanyu na nhlayiseko wa wena swi tshama
  swi ri kahle hi nkarhi wa ndzingeto.\\n- Byela vatirhi va ndzavisiso hi xihatla
  hilaha swi kotekaka hakona loko u nga ha koti ku ya emahlweni kumbe loko u kunguhata
  ku tshika vutekaxiave bya ndzavisiso bya wena.\\nVutihlamuleri bya Vatirhi va Ndzavisiso\\nVatirhi
  va HVTN, ku katsa na Mulavisisinkulu wa le ka tliniki leyi, va na vutihlamuleri
  byo:\\n- Tihlanganisa na muganga hi timhaka leti fambelanaka na ndzavisiso na ku
  tiyisisa vuyimeri byo twisiseka bya vatekaxiave eka ndzingeto wa swa vutshunguri.\\n-
  Tihlamulela no kuma mahungu eka huvo leyi lawulaka ndzavisiso, tanihi Bodo yo Langutisisa
  ya swa Vandla (Institutional Review Board (IRB)) kumbe komiti ya langutisisa matikhomele
  lamanene ya ndzavisiso.\\n- Kuma mpfumelelo eka vatekaxiave wo endla migingiriko
  kumbe minghenelelo leyi fambelanaka na ndzavavisiso hinkwayo. Loko ku ri na ku cinca
  ka nkoka, mpfumelelo wa vatekaxiave lava nga eka ndzavisiso wu ta laveka nakambe.\\n-
  Fambisa ndzavisiso hi matikhomele lamanene, ku katsa na ku sirhelela timfanelo,
  swihundla na vukahle bya vatekaxiave lava nga eka dyondzo ya ndzavisiso. Emakumu
  ka ndzavisiso, vatirhi va ndzavisiso va na vutihlamuleri byo tivisa vatekaxiave
  hi swimakiwa leswi va nga swi kuma na ku tivisa vatekaxiave na muganga hi mivuyelo
  ya dyondzo ya ndzavisiso.\\n- Hundzisela vatekaxiave laha swi nga fanela, ku ya
  kuma switsundzuxo, vukorhokeri byo sivela HIV, na/kumbe vukorhokeri bya swa miehleketo
  loko swi laveka hi nkarhi wa ndzavisiso.\\n- Hlamula swivutiso na swivilelo swa
  vatekaxiave va ndzavisiso hinkwaswo hi nkarhi lowu nga fanela.\\n- Khoma vatekaxiave
  va ndzavisiso hi nhlonipho.\"", "\"Bibele Eka Web Site Leyi\\nVUHUNDZULUXERI BYA
  MISAVA LEYINTSHWA BYA MATSALWA YO KWETSIMA\\n7 Endzhaku ka sweswo Yehovha a ku eka
  Nowa: \u201cNghena engalaveni, wena ni hinkwavo vandyangu+ wa wena, hikuva eka xitukulwana+
  lexi, ndzi vone wena u lulamile emahlweni ka mina.\\n2 Eka xiharhi xin\u2019wana
  ni xin\u2019wana lexi tengeke u ta teka nkombo-nkombo, nkombo swa matsune na nkombo
  swa nkati;+ eka xiharhi xin\u2019wana ni xin\u2019wana lexi nga tengangiki u ta
  teka swimbirhi ntsena, xa matsune ni xa nkati;\\n3 nakambe eka swivumbiwa leswi
  hahaka swa matilo u teka nkombo-nkombo, nkombo wa minkuku na nkombo wa mimbhaha,+
  leswaku u londzovota vana va swona va hanya ehenhla ka vuandlalo bya misava+ hinkwayo.\\n4
  Hikuva emasikwini ya nkombo lama taka ndzi ta nisa mpfula+ ehenhla ka misava ku
  ringana masiku ya 40 ni vusiku+ bya 40; kutani ndzi ta herisa xilo xin\u2019wana
  ni xin\u2019wana lexi nga kona lexi ndzi xi endleke ehenhla ka vuandlalo bya misava.\u201d+\\n5
  Hiloko Nowa a endla hinkwaswo hilaha Yehovha a n\u2019wi leriseke hakona.\\n6 Nowa
  a a ri ni malembe ya 600 hi vukhale loko ku va ni ndhambi ya mati emisaveni.+\\n7
  Kutani Nowa a nghena engalaveni ni vana vakwe ni nsati wakwe ni vasati va vana vakwe,
  va nghena na yena mati ya ndhambi+ ma nga si fika.\\n8 Eka xiharhi xin\u2019wana
  ni xin\u2019wana lexi baseke ni le ka xiharhi xin\u2019wana ni xin\u2019wana lexi
  nga basangiki ni le ka swivumbiwa leswi hahaka ni hinkwaswo leswi famba-fambaka
  ehenhla ka misava,+\\n9 swi nghena haswimbirhi-mbirhi endzeni ka ngalava, eka Nowa,
  xa xinuna ni xa xisati, hilaha Xikwembu xi leriseke Nowa hakona.\\n10 Endzhaku ka
  masiku ya nkombo, mati ya ndhambi ma na ehenhla ka misava.\\n11 Elembeni ra vu-600
  ra ku hanya ka Nowa, en\u2019hwetini ya vumbirhi, hi siku ra vu-17 ra n\u2019hweti,
  esikwini rero swihlovo hinkwaswo swa xidziva lexikulu xa mati swi boxeka swi pfuleka,
  kutani tinyangwa ta ndhambi ya matilo ti pfuleka.+\\n12 Maboboma ya mpfula ma chululekela
  ehenhla ka misava, masiku ya 40 ni vusiku+ bya 40.\\n13 Hi siku rero, Nowa a nghena
  engalaveni+ na Xeme na Hamu na Yafeta, vana+ va Nowa, ni nsati wa Nowa ni vasati
  vanharhu va vana vakwe, va nghena na yena;\\n14 vona ni xivandzana xin\u2019wana
  ni xin\u2019wana hi ku ya hi muxaka+ wa xona, ni xifuwo xin\u2019wana ni xin\u2019wana
  hi ku ya hi muxaka wa xona, ni xiharhi xin\u2019wana ni xin\u2019wana lexi kokovaka
  ehenhla ka misava hi ku ya hi muxaka+ wa xona, ni xivumbiwa xin\u2019wana ni xin\u2019wana
  lexi hahaka hi ku ya hi muxaka+ wa xona, nyenyana yin\u2019wana ni yin\u2019wana
  ni xivumbiwa+ xin\u2019wana ni xin\u2019wana lexi nga ni timpiko.\\n15 Kutani swi
  ya haswimbirhi-mbirhi eka Nowa, endzeni ka ngalava, swa mixaka hinkwayo ya nyama
  leyi a yi ri ni matimba ya vutomi+ eka yona.\\n16 Kutani leswi nghenaka, swi nghena
  ku ri xa xinuna ni xa xisati xa muxaka wun\u2019wana ni wun\u2019wana wa nyama,
  hilaha Xikwembu xi n\u2019wi leriseke hakona. Endzhaku ka sweswo Yehovha a n\u2019wi
  pfalela nyangwa.+\\n17 Ndhambi yi va kona masiku ya 40 ehenhla ka misava, naswona
  mati ma ya ma engeteleka, ma sungula ku tlakula ngalava kutani yi papama ehenhla
  ka misava.\\n18 Mati ma ya ma tala ngopfu kutani ma engeteleka swinene ehenhla ka
  misava, kambe ngalava yi famba ehenhla ka vuandlalo bya mati.+\\n19 Mati ma funengeta
  misava swinene lerova tintshava hinkwato to leha leti a ti ri ehansi ka matilo hinkwawo
  ti funengetiwa.+\\n20 Mati ma ti hundza hi swisungunu swa 15, kutani tintshava ti
  funengetiwa.+\\n21 Hikwalaho nyama hinkwayo leyi a yi hanya emi-saveni yi lova,+
  swivumbiwa leswi hahaka ni swifuwo ni swivandzana ni mintlhambi hinkwayo leyi a
  yi famba swin\u2019we emisaveni ni vanhu+ hinkwavo.\\n22 Hinkwaswo leswi a swi ri
  ni ku hefemula ka matimba ya vutomi etinhompfini ta swona, ku nga hinkwaswo leswi
  a swi ri emisaveni, swi fa.+\\n23 Kutani a herisa xilo xin\u2019wana ni xin\u2019wana
  lexi a xi ri kona ehenhla ka vuandlalo bya misava, ku sukela eka munhu ku ya eka
  xiharhi, ni swiharhi leswi famba-fambaka ni swivumbiwa leswi hahaka swa matilo,
  swi herisiwile emisaveni;+ ku lo pona+ Nowa ntsena ni lava a va ri na yena engalaveni.\\n24
  Mati ma ya emahlweni ma funengeta misava masiku ya 150.\"", "\"Profesa Massimo Tistarelli
  i mutivi wa sayense eYunivhesiti ya Sassari eItaly. I un\u2019wana wa vahleri va
  timagazini tinharhu ta sayense leti hangalasiwaka emisaveni hinkwayo naswona yena
  swin\u2019we ni van\u2019wana va tsale swiviko leswi tlulaka dzana swa ndzavisiso
  wa timhaka ta sayense. U dyondza ndlela leyi vanhu va swi kotaka ha yona ku xiya
  swikandza swa van\u2019wana swin\u2019we ni ku endla swilo leswi tikombaka swi olova
  swo tanihi ku qhavulela bolo. Kutani u endla fambiselo ro vona ra tirhoboto leri
  tirhaka ku fana ni ra hina. Mutsari wa Xalamuka! u n\u2019wi vutise hi ta ripfumelo
  rakwe ni hi ta ntirho wakwe tanihi mutivi wa sayense.\\nA wu nghena kereke yihi
  loko wa ha ri ntsongo?\\nVatswari va mina a va ri Makhatoliki kambe a va nga yi
  ekerekeni. Loko ndza ha ri jaha, a ndzi pfumela eka dyondzo ya leswaku Xikwembu
  a xi kona. A ndzi dyondzisiwe leswaku swilo leswi hanyaka swi lo tiendlekela naswona
  sweswo ndzi swi teke ku ri ntiyiso. Kambe hambileswi a ndzi nga pfumeli leswaku
  ku ni Muvumbi loyi a vumbeke vanhu, a ndzi pfumela leswaku ku fanele ku ri ni nchumu
  wo karhi lowu tlakukeke ku tlula hina. Leswaku ndzi tiva nchumu wolowo, ndzi kambisise
  vukhongeri bya Vubudha, bya Vuhindu ni bya Vutao, kambe tidyondzo ta byona a ti
  swi hlamulanga swivutiso swa mina.\\nI yini leswi ku susumeteleke ku rhandza sayense?\\nKu
  sukela evutsongwanini, a ndzi tsakisiwa hi michini. A ndzi hamba ndzi tlhantlha
  switlangisi swa mina swa gezi ndzi tlhela ndzi swi hlanganisa. Nakambe a ndzi hamba
  ndzi vutisa Tatana loyi a a ri munjhiniyara wa michini ya fambiselo ro vulavurisana
  swivutiso swo tala malunghana ni ndlela leyi swiya-ni-moya ni tinqingho swi tirhaka
  ha yona.\\nWu katsa yini ntirho wa wena tanihi mutivi wa sayense?\\nNdzi dyondzele
  ku va munjhiniyara wa swa elektroniki eYunivhesiti ya Genoa naswona ndzi endle ndzavisiso
  malunghana ni ndlela leyi ndzi nga antswisaka ha yona matirhelo ya tirhoboto leswaku
  ndzi ta kuma digri. Ndzi dyondze ngopfu hi vuswikoti bya munhu byo vona ni ku kuma
  tindlela to kopa vuswikoti byebyo leswaku ndzi byi tirhisa eka tirhoboto.\\nHa yini
  vuswikoti bya hina byo vona byi ku tsakisa?\\nHikuva byi rharhangane hi ndlela leyi
  hlamarisa naswona a byi katsi mahlo ntsena, byi katsa ni ku hlamusela leswi hi swi
  vonaka. Hi xikombiso, xiya leswi humelelaka loko u qhavulela bolo. Loko u ri karhi
  u tsutsuma leswaku u yi qhavulela, rivoni ra tihlo ra wena ri ta hundzisa xifaniso
  xa bolo ri xi yisa eka retina. Xifaniso xexo xi ta famba-famba eka retina ya wena
  hi ku ya hi mafambelo ya bolo ni ya tihlo ra wena. Entiyisweni, hi ntolovelo u dzikisa
  tihlo ra wena eka bolo. Kutani xifaniso xa yona xa yima eka retina ya wena loko
  ndhawu leyi nga endzhaku ka yona yi vonaka yi ri eku fambeni.\\nHi nkarhi lowu fanaka,
  fambiselo ra wena ro vona ri hlayela rivilo ra bolo ni lomu yi kongomeke kona. Lexi
  hlamarisaka hileswaku ku hlayela koloko ku sungula eka retina loko tihlo ra wena
  ri ri karhi ri pima mafambelo ya bolo ni ndhawu leyi nga endzhaku ka yona. Kutani
  nsiha wa le tihlweni wu rhumela rungula leri kumiweke hi retina ebyongweni bya wena
  naswona byona byi tlhela byi kambisisa rungula rero ivi byi ku byela leswaku u qhavulela
  bolo yoleyo. Ndlela leyi endlelo rero hinkwaro ri rharhanganeke ha yona ya hlamarisa
  swinene.\\nI yini leswi ku susumeteleke ku pfumela eka Muvumbi?\\nHi 1990, ndzi
  hete tin\u2019hweti to hlayanyana edorobeni ra Dublin le Ireland, ndzi ri karhi
  ndzi endla ndzavisiso eKholichi ya Trinity. Loko mina ni nsati wa mina Barbara hi
  ri endleleni yo tlhelela ekaya, hi vulavule hi vumundzuku bya vana va hina. Hi tlhele
  hi teka xiboho xo endzela sesi wa mina loyi a nga Mbhoni ya Yehovha. Sesi u ndzi
  nyike buku leyi nge Life\u2014How Did It Get Here? By Evolution or by Creation?
  leyi kandziyisiweke hi Timbhoni. Ndzavisiso lowu dzikeke lowu endliweke ebukwini
  yoleyo wu ndzi hlamarise ngopfu. Kutani ndzi xiye leswaku ndzi pfumele eka dyondzo
  ya ku tiendlekela ka swilo handle ko rhanga hi ku kambisisa loko byi ri kona hakunene
  vumbhoni lebyi yi seketelaka. Hi xikombiso, a ndzi tibyela leswaku dyondzo leyi
  a yi seketeriwa kahle hi masalela ya swilo leswi feke. Kambe a swi tano. Kutani
  loko ndzi hambete ndzi kambisisa dyondzo leyi, ndzi ye ndzi khorwiseka leswaku vanhu
  lava yi dyondzisaka va tirhisa mavulavulelo yo tikukumuxaka lama nga sekeriwangiki
  helo.\\nNdzi anakanye hi ntirho wa mina wo endla tirhoboto. Xana i ntirho wa mani
  lowu a ndzi ri eku wu kopeni?\\nKutani ndzi anakanye hi ntirho wa mina wo endla
  tirhoboto. Xana i ntirho wa mani lowu a ndzi ri eku wu kopeni? A ndzi nge pfuki
  ndzi endle rhoboto leri kotaka ku qhavulela bolo ku fana ni munhu. Rhoboto ri nga
  kunguhatiwa ku qhavulela bolo, kambe ehansi ka swiyimo leswi hleriweke ntsena. A
  ri nge swi koti ku yi qhavulela ehansi ka swiyimo leswi yi nga endleriwangiki swona.
  Vuswikoti bya hina byo dyondza byi tlakuke swinene ku tlula bya muchini naswona
  michini leyi tolovelekeke yi ni vaendli va yona! Mhaka leyi ko va yin\u2019wana
  ya timhaka to tala leti ndzi susumeteleke ku gimeta hileswaku ku fanele ku ri ni
  Muvumbi loyi a hi vumbeke.\\nHa yini u ve Mbhoni ya Yehovha?\\nXivangelo xin\u2019wana
  hileswi mina na Barbara a hi rhandza maendlelo ya tona lama dzikeke yo dyondza.
  Ngopfu-ngopfu a ndzi tsakisiwa hi ndzavisiso lowu endliweke eminkandziyisweni ya
  tona. Ndzavisiso lowu dzikeke wu va koka rinoko vanhu vo fana na mina, lava lavaka
  ku tiva swilo hi vuenti. Hi xikombiso, ndzi sungule ku byi tsakela swinene vuprofeta
  byo tala lebyi nga eBibeleni. Ku dyondza ha byona swi ndzi khorwisile leswaku hakunene
  Bibele yi tsariwe hi Xikwembu. Hi 1992, mina na Barbara hi khuvuriwile tanihi Timbhoni
  ta Yehovha.\\nXana dyondzo ya wena ya sayense yi tsanise ripfumelo ra wena?\\nEmatshan\u2019weni
  ya sweswo, dyondzo ya sayense yi tiyise ripfumelo ra mina. Hi xikombiso, xiya ndlela
  leyi hi kotaka ku xiya swikandza swa van\u2019wana ha yona. Ricece ri nga kota ku
  xiya swikandza swa vanhu endzhakunyana ka tiawara ri velekiwile. Mina na wena hi
  nga namba hi xiya munhu loyi hi n\u2019wi tivaka, hambiloko a ri exikarhi ka ntshungu.
  Hi nga ha kota ku vona loko a tsakile kumbe a nga tsakanga. Kambe swi nga ha endleka
  hi nga swi tivi nikatsongo leswaku ku kota ku xiya swikandza swa vanhu hi ndlela
  yoleyo swi katsa ku kambisisa rungula ro tala ngopfu hi rivilo lerikulu swinene.\\nNdza
  khorwiseka hi ku helela leswaku fambiselo ra hina ro vona i nyiko ya risima leyi
  humaka eka Yehovha Xikwembu. Tinyiko takwe, leti katsaka Bibele, ti ndzi susumetela
  ku n\u2019wi nkhensa ni ku byela vanhu van\u2019wana ha yena. Phela, miehleketo
  ya mina yi ndzi byela leswaku u faneleriwa hi ku fundzhiwa hikwalaho ka swilo leswi
  a swi endleke.\"", "\"Muapostola Pawulo u tsale leswaku Yehovha a \u201cnge mi tshiki
  mi ringiwa hi ndlela leyi tlulaka leswi mi nga swi tiyiselaka.\u201d (1 Kor. 10:13)
  Xana leswi swi vula leswaku Yehovha u yi vona ka ha ri emahlweni miringo leyi hi
  nga yi tiyiselaka kutani a hlawula leyi hi faneleke hi langutana na yona?\\nLoko
  mhaka leyi a ku ri ntiyiso anakanya ndlela leyi a yi ta khumba vutomi bya hina ha
  yona. Hi xikombiso, a hi nge n\u2019wana wa makwerhu un\u2019wana u tisungile kutani
  makwerhu loyi a tivutisa a ku: \u2018Xana Yehovha u kambisise ka ha ri emahlweni
  kutani a vona leswaku mina ni nsati wa mina hi ta ri tiyiselela rifu ra n\u2019wana
  wa hina? Xana leswi swi endleke hileswi Xikwembu xi voneke leswaku hi ta swi kota
  ku swi tiyiselela?\u2019 Xana ku ni xivangelo lexi twalaka xo tshemba leswaku Yehovha
  u kunguhata ka ha ri emahlweni leswi nga ta endleka evuton\u2019wini bya hina?\\nKu
  anakanyisisa hi marito ya Pawulo lama nga eka 1 Vakorinto 10:13, swi endla hi vula
  leswaku a ku na xivangelo lexi nga eMatsalweni xo tshemba leswaku Yehovha u kambela
  ka ha ri emahlweni miringo leyi hi nga kotaka ku yi tiyisela kutani a hlawula leyi
  faneleke yi hi wela. A hi kambisiseni swivangelo swa mune leswi nga endlaka hi vula
  tano.\\nXo sungula, Yehovha u nyike vanhu ntshunxeko wo tihlawulela. U lava leswaku
  hi tihlawulela ndlela leyi hi lavaka ku hanya ha yona. (Det. 30:19, 20; Yox. 24:15)
  Loko hi hlawula ndlela leyinene, Yehovha u ta hi kongomisa. (Swiv. 16:9) Kambe loko
  hi hlawula ndlela yo biha hi ta tshovela leswi hi swi byaleke. (Gal. 6:7) Loko ku
  ri leswaku Yehovha wa hi hlawulela miringo leyi hi faneleke hi langutana na yona,
  swi ta vula leswaku a hi na wona ntshunxeko wo tihlawulela.\\nXa vumbirhi, Yehovha
  a nga hi sirheleli eka \u201cnkarhi ni xiendlakalo lexi nga languteriwangiki.\u201d
  (Ekl. 9:11) Timhangu to chavisa ti nga hi wela hikwalaho ka leswi hi nga ha vaka
  hi ri endhawini leyi nga fanelangiki hi nkarhi lowu nga fanelangiki. Yesu u vulavule
  hi mhangu leyi khumbeke vanhu va 18 lava weriweke hi xihondzo kutani va fa naswona
  u vule leswaku rifu ra vona a ri vangiwanga hi Xikwembu. (Luka 13:1-5) Kutani a
  swi twali ku vula leswaku Xikwembu xi kunguhata ka ha ri emahlweni leswaku i mani
  loyi a faneleke a fa kumbe a hanya eka timhangu to tano leti ngo tiendlekela.\\nXa
  vunharhu, un\u2019wana ni un\u2019wana wa hina wa katseka eka swihehlo swa Sathana
  leswi khumbaka mhaka ya ku tshembeka. Tsundzuka leswaku Sathana u sole vanhu hinkwavo
  lava tirhelaka Yehovha, a vula leswaku a va nge swi koti ku tshama va tshembekile
  eka yena loko va langutane ni miringo. (Yobo 1:9-11; 2:4; Nhlav. 12:10) Loko Yehovha
  a a hi hlawulela miringo leyi faneleke yi hi wela hikwalaho ka leswi a vonaka leswaku
  a hi nge swi koti ku yi tiyiselela, sweswo a swi ta vula leswaku Sathana a a tiyisile.\\nXa
  vumune, Yehovha u hlawula ku nga tivi swilo hinkwaswo leswi nga ta hi endlekela.
  Mhaka ya leswaku Xikwembu xi tiva miringo leyi nga ta hi endlekela yi nga ha kombisa
  leswaku xi fanele xi tiva swilo hinkwaswo hi vumundzuku bya hina. Kambe vonelo ro
  tano a ri humi eMatsalweni. Xikwembu xi nga swi kota ku tiva vumundzuku bya hina.
  (Esa. 46:10) Kambe Bibele yi kombisa leswaku xa hlawula leswi xi lavaka ku swi tiva
  hi leswi nga ta endleka enkarhini lowu taka. (Gen. 18:20, 21; 22:12) Xi endla sweswo
  hikwalaho ka leswi xi xiximaka ntshunxeko wa hina wo tihlawulela. Xana leswi a hi
  swona leswi a hi ta swi langutela eka Xikwembu lexi minkarhi hinkwayo xi tirhisaka
  matimba ya xona hi ndlela leyi faneleke?\u2014Det. 32:4; 2 Kor. 3:17.\\nKutani hi
  fanele hi ma twisisa njhani marito ya Pawulo lama nge: \u201cXikwembu . . . a xi
  nge mi tshiki mi ringiwa hi ndlela leyi tlulaka leswi mi nga swi tiyiselaka\u201d?
  Eka tsalwa leri, Pawulo a a vulavula hi leswi Yehovha a swi endlaka loko hi ri emiringweni
  ku nga ri loko yi nga si hi wela. Marito ya muapostola Pawulo ma hi tiyisekisa leswaku
  hambi ho wela hi ndzingo wihi na wihi evuton\u2019wini, Yehovha u ta hi seketela
  ntsena loko hi tshembela eka yena. (Ps. 55:22) Hi ta kambisisa swivangelo swimbirhi
  leswi paluxaka xivangelo xa ku va Pawulo a vule marito lawa.\\nXo sungula, miringo
  leyi hi langutanaka na yona yi \u201c[tolovelekile] evanhwini.\u201d Minkarhi yo
  tala miringo leyi hi langutanaka na yona ya fana ni leyi vanhu van\u2019wana va
  langutanaka na yona. Hi nga swi kota ku yi tiyiselela miringo yo tano loko hi titshega
  hi Xikwembu. (1 Pet. 5:8, 9) Loko Pawulo a tsala marito lama nga eka 1 Vakorinto
  10:13 a a kombetela eka miringo leyi Vaisrayele va langutaneke na yona loko va ri
  emananga. (1 Kor. 10:6-11) Vaisrayele a va ta swi kota ku yi tiyiselela miringo
  yoleyo. Ku ringana minkarhi ya mune, Pawulo u vule leswaku \u201cvan\u2019wana va
  vona\u201d a va yingisanga. Lexi twisaka ku vava, Vaisrayele van\u2019wana va tikhome
  hi ndlela yo biha hikuva a va nga titsheganga hi Xikwembu.\\nXa vumbirhi, \u201cXikwembu
  xa tshembeka.\u201d Ndlela leyi Xikwembu xi tirhisaneke ni vanhu va xona ha yona
  yi kombisa leswaku xi kombisa rirhandzu ra xona ro tshembeka eka \u201clava va xi
  rhandzaka ni lava va hlayisaka milawu ya xona.\u201d (Det. 7:9) Mhaka leyi yi kombisa
  leswaku minkarhi hinkwayo Xikwembu xi hetisisa leswi xi swi tshembisaka. (Yox. 23:14)
  Loko hi kambisisa ndlela leyi Yehovha a va khomeke ha yona vanhu lava n\u2019wi
  rhandzaka ni ku n\u2019wi yingisa, hi nga tiyiseka leswaku u ta hetisisa switshembiso
  leswimbirhi loko hi langutana ni miringo: (1) A nge yi pfumeleli yi hi tikela lerova
  hi nga swi koti ku yi tiyisela naswona (2) \u2018u ta hi nyika ndlela yo huma\u2019
  eka yona.\\nYehovha u va nyika njhani ndlela yo huma emiringweni lava titshegaka
  ha yena loko va langutane ni miringo? I ntiyiso leswaku loko a swi lava a nga yi
  susa miringo yoleyo. Kambe tsundzuka marito ya Pawulo lama nge: \u201c[Yehovha u]
  ta mi nyika ndlela yo huma, leswaku mi kota ku swi tiyisela.\u201d Kambe minkarhi
  yo tala u hi nyika \u201cndlela yo huma\u201d hi ku hi nyika leswi hi swi lavaka
  leswaku hi kota ku tiyisela. Anakanya hi tindlela tin\u2019wana leti Yehovha a hi
  nyikaka ndlela yo huma ha tona:\\nWa hi \u201c[chavelela] enhlomulweni wa hina hinkwawo.\u201d
  (2 Kor. 1:3, 4) Yehovha a nga rhurisa mianakanyo ya hina, timbilu ta hina ni ndlela
  leyi hi titwaka ha yona hi ku tirhisa Rito rakwe, moya lowo kwetsima ni swakudya
  swa moya leswi hlonga ro tshembeka ri hi phamelaka swona.\u2014Mat. 24:45; Yoh.
  14:16; Rhom. 15:4.\\nA nga hi kongomisa hi ku tirhisa moya lowo kwetsima. (Yoh.
  14:26) Loko hi langutana ni miringo, moya lowo kwetsima wu nga hi pfuna ku tsundzuka
  Matsalwa ni misinya ya milawu leswaku hi endla swiboho leswinene.\\nA nga tirhisa
  tintsumi leswaku ti hi pfuna.\u2014Hev. 1:14.\\nA nga hi pfuna hi ku tirhisa vamakwerhu
  lava hi marito ni swiendlo swa vona va nga va ka \u201cmpfuno lowu tiyisaka\u201d
  eka hina.\u2014Kol. 4:11.\\nXana marito ya Pawulo lama nga eka 1 Vakorinto 10:13
  ma vula yini? Yehovha a nga hi hlawuleli miringo leyi hi faneleke hi langutana na
  yona. Kambe loko hi weriwa hi miringo, hi nga tiyiseka hi leswi: Loko hi tshemba
  Yehovha hi ku helela a nge yi pfumeleli miringo leswaku yi hi tikela lerova hi nga
  swi koti ku yi tiyisela. Minkarhi hinkwayo u ta hi nyika ndlela yo kota ku langutana
  na yona leswaku hi tiyisela. Marito lawa ma chavelela hakunene!\"", "\"Bibele Eka
  Web Site Leyi | VUHUNDZULUXERI BYA MISAVA LEYINTSHWA BYA MATSALWA YO KWETSIMA\\n3
  Xo hetelela, vamakwerhu, yanani emahlweni mi hi khongelela,+ leswaku rito ra Yehovha+
  ri hambeta ri famba hi rivilo+ ni ku vangamisiwa tanihi leswi entiyisweni swi nga
  tano eka n\u2019wina;\\n2 ni leswaku hi kutsuriwa eka vanhu+ lava vavisaka ni lava
  hombolokeke, hikuva ripfumelo a hi ra vanhu+ hinkwavo.\\n3 Kambe Hosi ya tshembeka,
  yi ta mi tiyisa ni ku mi sirhelela eka lowo homboloka.+\\n4 Ku tlula kwalaho, hi
  ni ku tiyiseka+ eHosini malunghana na n\u2019wina, leswaku ma swi endla swilo leswi
  hi swi lerisaka+ ni leswaku mi ta ya emahlweni mi swi endla.\\n5 Onge Hosi yi nga
  ya emahlweni yi kongomisa timbilu ta n\u2019wina hilaha ku humelelaka leswaku mi
  rhandza+ Xikwembu ni leswaku mi tiyisela+ hikwalaho ka Kreste.\\n6 Sweswi ha mi
  lerisa,+ vamakwerhu, hi vito ra Hosi Yesu Kreste, leswaku mi hambana+ ni makwerhu
  un\u2019wana ni un\u2019wana la fambaka hi ndlela leyi nga hlelekangiki+ naswona
  a nga fambiki hi ku ya hi ndhavuko lowu mi wu amukeleke eka hina.+\\n7 Hikuva n\u2019wina
  ma yi tiva ndlela leyi mi faneleke mi hi+ tekelela ha yona, hikuva a hi tikhomanga
  hi ndlela leyi nga hlelekangiki exikarhi ka n\u2019wina+\\n8 naswona a hi dyanga
  swakudya mahala+ hambi ku ri eka mani. Ku hambana ni sweswo, hi ku tikarhata+ ni
  hi ntirho wa matimba, vusiku ni nhlikanhi a hi tirha leswaku hi nga tikirheti ndzhwalo
  wo tika hambi ku ri eka mani wa n\u2019wina.+\\n9 Ku nga ri leswaku a hi na mfanelo,+
  kambe leswaku hi tinyikela ku va xikombiso eka n\u2019wina leswaku mi tekelela hina.+\\n10
  Entiyisweni, ni loko ha ha ri na n\u2019wina, a hi tshamela ku mi lerisa+ hi ku:
  \u201cLoko munhu a nga lavi ku tirha, ni ku dya a nga tshuki a dya.\u201d+\\n11
  Hikuva hi twa leswaku van\u2019wana va famba hi ndlela leyi nga hlelekangiki+ exikarhi
  ka n\u2019wina, a va tirhi nikatsongo kambe va nghenelela eka leswi nga va khumbiki.+\\n12
  Vanhu vo tano hi va lerisa ni ku va khongotela eka Hosi Yesu Kreste leswaku loko
  va tirha hi ku rhula va ta dya swakudya leswi va tikumelaka+ swona hi voxe.\\n13
  Loko ku ri n\u2019wina, vamakwerhu, mi nga tshiki ku endla leswi lulameke.+\\n14
  Kambe loko munhu a nga yingisi rito+ ra hina hi papila leri, tshamani mi n\u2019wi
  funghile,+ tshikani ku tihlanganisa na yena,+ leswaku a ta khomiwa hi tingana.+\\n15
  Hambiswiritano mi nga n\u2019wi teki a ri nala, kambe hambetani mi n\u2019wi tsundzuxa+
  kukotisa makwenu.\\n16 Onge Hosi ya ku rhula yi nga mi nyika ku rhula nkarhi hinkwawo
  hi tindlela+ hinkwato. Hosi a yi ve na n\u2019wina hinkwenu.\\n17 Hi lawa marungula
  ya mina Pawulo, lama tsariweke hi voko+ ra mina, leswi nga mfungho epapileni rin\u2019wana
  ni rin\u2019wana; leyi hi yona ndlela leyi ndzi tsalaka ha yona.\\n18 Musa lowu
  nga faneriwiki+ wa Hosi ya hina Yesu Kreste a wu ve na n\u2019wina hinkwenu.\"",
  "\"XANA i swa nkoka leswaku vito ra Xikwembu ri humelela eBibeleni? Swi le rivaleni
  leswaku Xikwembu xi lava leswaku ri humelela. Vito ra xona, hilaha ri kombisiwaka
  hakona hi tinhlanga ta mune ta Xiheveru leti vuriwaka Tetragrammaton, ri humelela
  minkarhi ya kwalomu ka 7 000 eka matsalwa yo sungula ya Xiheveru lawa hi ntolovelo
  ma vuriwaka Testamente ya Khale. *\\nVakambisisi va Bibele va pfumela leswaku vito
  ra Xikwembu ra humelela eka Testamente ya Khale kumbe eMatsalweni ya Xiheveru. Hambiswiritano,
  vakambisisi vo tala va ehleketa leswaku a ri nga humeleli eka matsalwa yo sungula
  ya Xigriki lama tsariweke hi voko lama vitaniwaka Testamente Leyintshwa.\\nKutani,
  mutsari wa tibuku ta Testamente Leyintshwa a a endla yini loko a tshaha swiyenge
  swa matsalwa ya Testamente ya Khale leswi nga ni tinhlanga ta mune ta Xiheveru leti
  yimelaka vito ra Xikwembu? Emhakeni leyi, vahundzuluxeri vo tala va tirhisa rito
  \u201cHosi\u201d ematshan\u2019weni ya vito ra Xikwembu. Bibele ya Vuhundzuluxeri
  Bya Misava Leyintshwa Bya Matsalwa Yo Kwetsima a yi wu landzeli mukhuva lowu lowu
  tolovelekeke. Yi tirhise vito ra Yehovha minkarhi ya 237 eka Matsalwa ya Vukreste
  ya Xigriki kumbe Testamente Leyintshwa.\\nHi swihi swiphiqo leswi vahundzuluxeri
  va Bibele va hlanganaka na swona loko va fanele va teka xiboho xo va va tirhisa
  vito ra Xikwembu eka Testamente Leyintshwa? Xana swi kona swivangelo leswi twalaka
  swo tirhisa vito ra Xikwembu eka xiphemu lexi xa Matsalwa yo Kwetsima? Naswona ku
  tirhisiwa ka vito ra Xikwembu eBibeleni swi ku khumba njhani?\\nXiphiqo Xa Vuhundzuluxeri\\nMatsalwa
  ya Testamente Leyintshwa lama tsariweke hi voko lawa ma nga kona namuntlha, a hi
  wona lawa yo sungula. Matsalwa yo sungula lama tsariweke hi Matewu, Yohane, Pawulo
  ni van\u2019wana a ma tirhisiwa swinene naswona sweswo swi endle leswaku ma hatla
  ma hlakala. Hikwalaho ku endliwe tikopi ta wona, naswona loko tikopi teto ti hlakala
  ku tlhele ku endliwa tin\u2019wana. To tala ta tikopi ta magidi ta matsalwa ya Testamente
  Leyintshwa leti nga kona namuntlha, ti tsariwe kwalomu ka malembe-xidzana mambirhi
  endzhaku ka loko lawa yo sungula ma tsariwile. Swi tikomba onge hi nkarhi wolowo,
  lava a va kopa matsalwa lama tsariweke hi voko a va siva vito ra Xikwembu leri tsariweke
  hi tinhlanga ta mune ta Xiheveru hi rito ra Xigriki leri nge Ku\u2032ri\u00b7os
  kumbe Ky\u2032ri\u00b7os leri vulaka leswaku \u201cHosi,\u201d kumbe va kope eka
  matsalwa lawa a ma nga ha ri na rona vito ra Xikwembu. *\\nLoko muhundzuluxeri se
  a tiva sweswo, u fanele a tiyiseka loko ku ri ni vumbhoni lebyi tiyeke bya loko
  hakunene vito ra Xikwembu a ri ri kona eka matsalwa yo sungula ya Xigriki. Xana
  byi kona vumbhoni byebyo? Kambisisa timhaka leti landzelaka:\\nLoko Yesu a tshaha
  matsalwa ya Testamente ya Khale kumbe a hlaya eka wona, u tirhise vito ra Xikwembu.
  (Deteronoma 6:13, 16; 8:3; Pisalema 110:1; Esaya 61:1, 2; Matewu 4:4, 7, 10; 22:44;
  Luka 4:16-21) Emasikwini ya Yesu ni vadyondzisiwa vakwe, vito ra Xikwembu a ri humelela
  eka matsalwa ya Xiheveru lama kopiweke lawa hakanyingi a ma vitaniwa Testamente
  ya Khale, hilaha ninamuntlha ma vitaniwaka hakona. Hambiswiritano, ku ringana malembe-xidzana
  yo tala vakambisisi a va ehleketa leswaku vito ra Xikwembu leri tsariweke hi tinhlanga
  ta mune ta Xiheveru a ri nga ri kona eka matsalwa yo sungula ya Xigriki ya vuhundzuluxeri
  bya Septuagint bya Testamente ya Khale swin\u2019we ni le ka matsalwa yo sungula
  ya Testamente Leyintshwa. Kutani exikarhi ka lembe-xidzana ra vu-20, vakambisisi
  va kume nchumu lowu nga tolovelekangiki\u2014swiphemu swin\u2019wana swa vuhundzuluxeri
  bya Xigriki bya Septuagint bya le minkarhini ya Yesu. Swiphemu sweswo swi ni vito
  ra Xikwembu leri tsariweke hi tinhlanga ta Xiheveru.\\nYesu u tirhise vito ra Xikwembu
  a tlhela a ri tivisa van\u2019wana. (Yohane 17:6, 11, 12, 26) Yesu u vule hi ku
  kongoma a ku: \u201cNdzi te hi vito ra Tatana.\u201d U tlhele a kandziyisa leswaku
  mintirho yakwe a a yi endla \u2018hi vito ra Tata wakwe.\u2019 Entiyisweni vito
  ra Yesu ri vula leswaku \u201cYehovha I Muponisi.\u201d\u2014Yohane 5:43; 10:25.\\nVito
  ra Xikwembu ri humelela eka Matsalwa ya Xigriki ri tsariwe hi ndlela yo ri komisa.
  Eka Nhlavutelo 19:1, 3, 4, 6, vito ra Xikwembu ri vumba xiga lexi nge \u201cAleluya.\u201d
  Rito leri hi ku kongoma ri vula \u201cDzunisani Yah!\u201d Rito leri nge Yah i vito
  ra Yehovha leri komisiweke.\\nMatsalwa ya khale ya Vayuda ma kombisa leswaku Vakreste
  lava nga Vayuda a va ri tirhisa vito ra Xikwembu ematsalweni ya vona. Buku yin\u2019wana,
  leyi nga ni milawu yo tala leyi vuriweke hi nomu leyi nga hetiwa ku tsariwa kwalomu
  ka 300 C.E., yi vula leswi malunghana ni matsalwa ya Vukreste lama hisiweke hi Savata:
  \u201cTibuku ta Vaevhangeli ni tibuku ta va-minim [lava ku ehleketiwaka leswaku
  i Vakreste lava nga Vayuda] a ti hisiwe. Kambe a ti hisiwe laha ti nga kona, . .
  . tona ni leti nga ni Vito ra Xikwembu.\u201d (The Tosefta) Buku leyi yi tlhela
  yi tshaha marito ya Rabi Yos\u00e9 wa Mugaleliya loyi a hanyeke eku sunguleni ka
  lembe-xidzana ra vumbirhi C.E., a ri karhi a vula leswaku emasikwini man\u2019wana
  ya vhiki \u201cun\u2019wana a a tsema swiphemu swa wona [matsalwa ya Vukreste] leswi
  nga ni Vito ra Xikwembu kutani a swi veka kun\u2019wana kutani laman\u2019wana hinkwawo
  ma hisiwa.\u201d Xisweswo, ku ni vumbhoni lebyi tiyeke bya leswaku Vayuda lava hanyeke
  hi lembe-xidzana ra vumbirhi C.E. a va pfumela leswaku Vakreste va tirhise vito
  ra Yehovha ematsalweni ya vona.\\nVahundzuluxeri Va Yi Tamele Njhani Mhaka Leyi?\\nXana
  Bibele ya Vuhundzuluxeri Bya Misava Leyintshwa hi yona ntsena leyi tlheriseleke
  vito ra Xikwembu endhawini ya rona loko ku hundzuluxeriwa Matsalwa ya yona ya Xigriki?
  Doo! Hikwalaho ka vumbhoni lebyi nga laha henhla, vahundzuluxeri vo tala va Bibele
  va gimete hileswaku vito ra Xikwembu ri fanele ri tlheriseriwa loko va hundzuluxela
  Testamente Leyintshwa.\\nHi xikombiso, Tibibele ta Testamente Leyintshwa ta tindzimi
  to tala ta le Afrika, ta le Amerika, ta le Asia ni ta le swihlaleni swa lwandle
  ra Pacific ti tirhisa vito ra Xikwembu minkarhi yo tala. (Vona chati eka tluka 21.)
  Tin\u2019wana ta Tibibele teto ta ha ku humelela sweswinyana, to fana ni ya Rotuman
  (1999), leyi tirhiseke vito ra Jihova minkarhi ya 51 eka tindzimana ta 48 eka Testamente
  Leyintshwa, ni ya Batak-Toba (1989) ya le Indonesia, leyi tirhiseke vito leri nge
  Jahowa minkarhi ya 110 eka Testamente Leyintshwa. Vito ra Xikwembu ri tlhele ri
  humelela eka Tibibele ta Xifurwa, Xijarimani ni Xipaniya. Hi xikombiso, Pablo Besson
  u hundzuluxele Testamente Leyintshwa hi Xipaniya eku sunguleni ka lembe-xidzana
  ra vu-20. Bibele leyi a yi hundzuluxeleke yi tirhisa vito leri nge Jehov\u00e1 eka
  Yudha ndzimana 14, naswona eka tinhlamuselo ta le hansi ta kwalomu ka dzana u ri
  tsale hi ku kongoma vito ra Xikwembu hambileswi ri nga tsariwangiki eka tindzimana
  hi toxe.\\nLaha hansi ku ni swikombiso swin\u2019wana swa Tibibele ta Xinghezi leti
  tirhiseke vito ra Xikwembu eka Testamente Leyintshwa:\\nA Literal Translation of
  the New Testament . . . From the Text of the Vatican Manuscript, leyi hundzuluxeriweke
  hi Herman Heinfetter (1863)\\nThe Emphatic Diaglott, leyi hundzuluxeriweke hi Benjamin
  Wilson (1864)\\nThe Epistles of Paul in Modern English, leyi hundzuluxeriweke hi
  George Barker Stevens (1898)\\nSt. Paul\u2019s Epistle to the Romans, leyi hundzuluxeriweke
  hi W. G. Rutherford (1900)\\nThe Christian\u2019s Bible\u2014New Testament, leyi
  hundzuluxeriweke hi George N. LeFevre (1928)\\nThe New Testament Letters, leyi hundzuluxeriweke
  hi J.W.C. Wand, Bixopo wa le London (1946)\\nSweswinyana, Bibele leyi dumeke ya
  New Living Translation ya 2004 yi vule leswi eka xingheniso xa yona ehansi ka nhloko-mhaka
  leyi nge \u201cKu Hundzuluxela Mavito Ya Xikwembu\u201d: \u201cHi ntolovelo a hi
  nga cinca-cinci loko hi hundzuluxela vito ra Xikwembu (YHWH) hi ku \u2018HOSI,\u2019
  hi ri tsala hi maletere lamakulu lama tolovelekeke eka Tibibele ta Xinghezi. Matsalelo
  lawa ma ta endla leswaku ri hambana ni vito leri nge \u2018adonai, leri hi ri hundzuluxeleke
  hi ku \u2018Hosi.\u2019\u201d Kutani loko yi vulavula hi Testamente Leyintshwa,
  yi ri: \u201cRito ra Xigriki leri nge kurios ri hundzuluxeriwa hi ndlela leyi fanaka
  minkarhi hinkwayo ri va \u2018Hosi,\u2019 kambe ri hundzuluxeriwa ntsena ri va \u2018HOSI\u2019
  kun\u2019wana ni kun\u2019wana laha matsalwa ya Testamente Leyintshwa ma tshahaka
  matsalwa ya Testamente ya Khale hi ku kongoma naswona eka matsalwa wolawo ri tsariwa
  hi maletere lamakulu.\u201d (Marito lawa hi lo voyamisa.) Hikwalaho vahundzuluxeri
  va Bibele va swi xiya leswaku vito ra Xikwembu (YHWH) ri fanele ri tsariwa eka matsalwa
  lama tshahiweke ya Testamente Leyintshwa.\\nLexi tsakisaka, xihlamusela-marito xin\u2019wana
  xi vula leswi ehansi ka nhloko-mhaka leyi nge, \u201cVito Ra Xikwembu Eka Testamente
  Leyintshwa\u201d: \u201cKu ni vumbhoni byin\u2019wana bya leswaku Vito ra Xikwembu,
  Yahweh, ri humelela eka mintshaho yin\u2019wana kumbe hinkwayo ya Testamente ya
  Khale eka Testamente Leyintshwa loko tibuku ta Testamente Leyintshwa ti tsariwa
  ro sungula.\u201d (The Anchor Bible Dictionary) Nakambe mukambisisi George Howard
  u ri: \u201cLeswi vito ra Xikwembu a ra ha tsariwile eka Tibibele ta Xigriki leti
  kopiweke [Septuagint] leti a ti vumba Matsalwa ya kereke yo sungula, swa twala ku
  pfumela leswaku loko vatsari va Testamente Leyintshwa va tshaha Matsalwa a va tirhisa
  vito ra Xikwembu eka matsalwa ya Bibele.\u201d\\nSwivangelo Swimbirhi Leswi Khorwisaka\\nKutani
  swi le rivaleni leswaku Bibele ya Vuhundzuluxeri Bya Misava Leyintshwa a hi yona
  yo sungula ku tirhisa vito ra Xikwembu eka Testamente Leyintshwa. Ku fana ni muavanyisi
  loyi a vitaniweke leswaku a ta avanyisa nandzu laha ku nga riki na timbhoni leti
  swi voneke hi mahlo, Komiti Ya Vuhundzuluxeri Bya Bibele Ya Misava Leyintshwa yi
  byi kambisise hi vurhon\u2019wana vumbhoni hinkwabyo bya nkoka. Hi ku ya hi vumbhoni
  lebyi kumiweke, yi endle xiboho xo tirhisa vito ra Yehovha eka Bibele ya yona ya
  Matsalwa ya Vukreste ya Xigriki. Xiya swivangelo swimbirhi leswi twalaka leswi endleke
  leswaku yi endla tano.\\n(1) Vahundzuluxeri va pfumela leswaku leswi Matsalwa ya
  Vukreste ya Xigriki a ma ri xiphemu lexi huhuteriweke xa Matsalwa ya Xiheveru lama
  kwetsimaka, a swi nga twali ku va vito ra Yehovha ro na swi pfuketana ri nyamalala
  eka matsalwa wolawo.\\nHa yini xiboho xexo lexi va xi tekeke xi ri lexi twalaka?
  Exikarhi ka lembe-xidzana ro sungula C.E., mudyondzisiwa Yakobo u byele vakulu va
  le Yerusalema a ku: \u201cSamiyoni u rungule hi rixaladza ndlela leyi Xikwembu xi
  hundzuluxeleke ha yona nyingiso wa xona ro sungula ematikweni leswaku xi humesa
  eka wona vanhu va vito ra xona.\u201d (Mintirho 15:14) Xana swa twala eka wena leswaku
  Yakobo a a ta vula marito wolawo loko ku ri leswaku a a nga ri kona munhu ni un\u2019we
  hi lembe-xidzana ro sungula loyi a a tiva vito ra Xikwembu kumbe ku ri tirhisa?\\n(2)
  Loko ku tshuburiwe matsalwa lama kopiweke ya Septuagint lama nga ni vito ra Xikwembu
  ematshan\u2019weni ya vito leri nge Ky\u2032ri\u00b7os (Hosi), swi ve erivaleni
  eka vahundzuluxeri leswaku tikopi ta Matsalwa yo sungula ya Xigriki lawa a ma ri
  kona eminkarhini ya Yesu\u2014ni ya Xiheveru\u2014a ma ri ni vito ra Xikwembu.\\nSwi
  tikomba onge mukhuva lowu nga xi xiximiki Xikwembu wa ku susa vito ra xona eka matsalwa
  yo sungula ya Xigriki lama tsariweke hi voko, wu sungule endzhaku ka minkarhi ya
  Yesu. Xana wena u yi vona njhani mhaka leyi? Xana Yesu ni vaapostola vakwe va endle
  hi ku landza mukhuva lowu?\u2014Matewu 15:6-9.\\n\u201cLoyi A Vitanaka Vito Ra Yehovha\u201d\\nEntiyisweni
  Matsalwa hi woxe ma swi veka erivaleni leswaku Vakreste vo sungula a va ri tirhisa
  vito ra Yehovha ematsalweni ya vona, ngopfu-ngopfu loko va tshaha swiyenge swa Testamente
  ya Khale leyi a yi ri ni vito rero. Kutani a swi kanakanisi leswaku Bibele ya Vuhundzuluxeri
  Bya Misava Leyintshwa yi ni swivangelo leswi twalaka swo vuyisela vito ra Xikwembu
  leri nge Yehovha eka Matsalwa ya Vukreste ya Xigriki.\\nMhaka leyi yi ku khumba
  njhani? Loko muapostola Pawulo a tsundzuxa Vakreste va le Rhoma, u tshahe Matsalwa
  ya Xiheveru a ku: \u201cUn\u2019wana ni un\u2019wana loyi a vitanaka vito ra Yehovha
  u ta ponisiwa.\u201d Kutani a vutisa a ku: \u201cVa ta n\u2019wi vitanisa ku yini
  loyi va nga pfumelangiki eka yena? Hilaha ku fanaka, va ta pfumerisa ku yini eka
  loyi va nga twangiki nchumu hi ta yena?\u201d (Varhoma 10:13, 14; Yuwele 2:32) Tibibele
  leti tirhisaka vito ra Xikwembu laha ku faneleke, ti ku pfuna leswaku u tshinela
  eka Xikwembu. (Yakobo 4:8) Hakunene i lunghelo lerikulu eka hina ku va hi pfumeleriwa
  ku tiva vito ra Xikwembu, leri ku nga Yehovha, ni ku tlhela hi ri vitana.\\n^ ndzim.
  2 Tetragrammaton yi kombetela eka maletere ya mune, YHWH, lama yimelaka vito ra
  Xikwembu hi Xiheveru. Hi ntolovelo ri hundzuluxeriwa ri va Yehovha kumbe Yehova
  hi Xitsonga.\\n^ ndzim. 7 Loko u lava rungula leri engetelekeke malunghana ni leswaku
  ha yini vito ra Xikwembu ri siviwe hi rito leri nge \u201cHosi,\u201d vona broxara
  leyi nge Vito Ra Xikwembu Leri Nga Ta Tshama Hi Masiku, eka tluka 23-27, leyi kandziyisiweke
  hi Timbhoni ta Yehovha.\"", "\"31\u201cLoko munhu a humesa magandzelo ya xinakulobye
  hi xin''wana xa swifuwo swa yena leswikulu, \u00fa fanele ku pambula lexi nga solekiki
  xa xinuna kumbe xa xisati, a ya na xona emahlweni ka HOSI Xikwembu. 2Kutani \u00fa
  ta tlhandleka voko enhlokweni ya xifuwo enyangweni ya Ntsonga lowo Hlawuleka, a
  xi tlhavela kwalaho. Vaprista, va nga vana va Aroni, va ta teka ngati ya xifuwo,
