  cyawe kigaragara nyuma y''isuzuma rikorwa na IGIHE.com , Murakoze!\"", "\"Abanyarwanda
  babiri barimo Uhiriwe Byiza Renus na Muhoza Eric bashyikirijwe ibihembo na CANAL+
  biherekejwe n\u2019ifatabuguzi ry\u2019umwaka wose nyuma yo kwitwara neza mu isiganwa
