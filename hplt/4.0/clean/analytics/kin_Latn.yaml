  KUGURISHA BISHYUSHYE BIKURIKIRA Zahabu Icapa Impapuro z''umukara n''umweru\"", "\"U
  Rwanda rushobora guhabwa ibihano, nibahamwa n\u2019ikirego barezwe nyuma y\u2019umukino
  waruhuje n\u2019ikipe yo mu gihugu cya Benin.\\nMugihe byari bitarasobanuka, Mu
  marushanwa yo gushaka itike y\u2019igikombe cya Africa CAN2023, Izabera muri Cote
  D\u2019Ivoire umwaka utaha, amavubi amaze gukusanya amanota 3 mu mikino 4.\\nKuri
  stade yitiriwe Pele ya Kigali (KIGALI PELE STADIUM) Amavubi yanganyije na Benin
  igitego kimwe kuri kimwe. Abakunzi b\u2019ikipe y\u2019igihugu Amavubi ntibishimiye
  uwo musaruro, gusa Benin ntiyabahaye agahenge ko kubitekerezaho, kuko yahise itanga
  ikirego mu mpuzamashirahamwe y\u2019umupira w\u2019amaguru muri Africa, cyatuma
  amavubi aba ayanyuma mu itsinda.\\nBenin yatanze ikirego ku mukinnyi Muhire Kivin
  ukina hagati mu ikipe y\u2019igihugu Amavubi, wakinishijwe kandi afite amakarita
  2 y\u2019umuhondo.\\nKomiseri mbere y\u2019umukino yari yavuze ko umukino utemerewe
  gukina ari SAHABO Hakim gusa.\\nAya makarita ni imwe yahawe Amavubi atsindwa na
  Senegal ku munota wa 69, niyo yabonye Amavubi anganya na Binin ku munota wa 53.\\nIbi
  bije nyuma y\u2019uko Muri 2014, nyuma y\u2019umukino na Congo Brazzaville, umutoz
  Claude Leroy yavuze ko Abanyarwanda batakwishima kuko hari ikirego cya Dady Birori
  ufite amazina menshi ibi byatumye Amavubi yamburwa itike yari yabonye.\\nN\u2019ubwo
  Amavubi nta tike arabona, Muri 2023, umutoza wa Benin yavuze ko bareze kuko Muhire
  Kevin yabonye amakarita 2 y\u2019umuhondo yarangiza agakinishwa.\\nIgihe ikirego
  cyakwemerwa Amavubi azahita aterwa mpaga iyashyira mu kaga Aho wahita uba undi mwaka
  w\u2019umukara ku Mavubi n\u2019abanyarwanda.\\nNSENGIYUMVA Jean Marie Vianney\"",
  "\"Perezida Paul Kagame yavuze ko Repubulika Iharanira Demokarasi ya Congo nidasenya
  FDLR nk\u2019uko bikubiye mu masezerano, bizasaba u Rwanda gukomeza guhangana n\u2019iki
  kibazo rukoresheje uburyo rusanzwe rubikoramo.\\nGusenya FDLR ni imwe mu ngingo
  zikubiye mu masezerano u Rwanda na RDC byashyizeho umukono i Washington ku wa 27
  Kamena 2025.\\nUyu mwanzuro wafashwe nyuma y\u2019uko u Rwanda rugaragaje ko uyu
  mutwe wiganjemo abagize uruhare muri Jenoside yakorewe Abatutsi mu 1994, wahawe
  rugari muri RDC kandi biteje ikibazo ku mutekano warwo.\\nMu kiganiro Perezida Kagame
  yagiranye n\u2019abanyamakuru kuri uyu wa Gatanu tariki 4 Nyakanga 2025, yabajijwe
  icyo u Rwanda ruteganya gukora mu gihe RDC yaba idasenye FDLR.\\nMu gusubiza, Perezida
  Kagame yavuze ko FDLR nidasenywa u Rwanda ruzakomeza guhangana n\u2019iki kibazo
  rukoresheje uburyo rusanzwe rukoresha.\\nAti \u201cIkibazo cya FDLR nikiramuka kidakemuwe
  kandi twarashyizeho uburyo bwo guhangana na yo mu masezerano, ibyo bizaba bivuze
  ko FDLR izakomeza kubaho, n\u2019ikibazo kizakomeza kubaho kandi u Rwanda ruzakomeza
  gukora icyo rukwiriye gukora mu gihe FDLR iri hafi n\u2019imipaka yacu, nta bufindo
  bushobora gukoreshwa (mu gukemura ikibazo), ahubwo igikenewe ni ugukora icyo ukwiriye
  gukora mu gukemura ikibazo.\u201d\\nPerezida Kagame yavuze ko u Rwanda rwiteguye
  gukora ibyo rwasabwe.\\nAti \u201cTwagaragaje ikibazo cyacu kandi dushingiye kuri
  ibyo hari ibyo twemeye gukora kandi tukabikorana n\u2019abandi, kandi ibyo tuzabikora,
  ntabwo uzigera ubona u Rwanda rudashyira mu bikorwa ibyo rwemeye gukora, ntabwo
  uzigera ubibona. Ariko urundi ruhande ni rutabikora, rukadubiza mu bibazo, tuzasabwa
  guhangana n\u2019ibyo bibazo nk\u2019uko nubundi tumaze igihe duhangana nabyo.\u201d\\nUmukuru
  w\u2019igihugu yagaragaje ko bibaho kenshi ko hari uruhande rushobora kutubahiriza
  ibyemejwe.\\nAti \u201cAmasezerano yo arahari, mu masezerano hari ibyo abayashinzwe
  bemera gukora buri umwe ku giti cye cyangwa gukorana hamwe. Ntabwo rero iteka abantu
  bose bakoresha ukuri cyangwa bavugisha ukuri no mu byo bemeye ku mugaragaro.\u201d\\n\u201cAriko
  navuga ko ku ruhande rw\u2019u Rwanda tuzakora ibyo twemeye uko bishoboka, ariko
  bimwe bihera ku byo abandi bakora twemeranyije, iyo badakoze ibyo twemeranyije ubwo
  birumvikana ko bifite ingaruka ku byo natwe tugomba gukora, twemeye kubikora kandi
  tuzabikora ari uko abandi na bo bujuje uruhande rwabo. Ibi nibidakorwa tuzakomeza
  gushakisha inzira iyo ari yo yose, igihe inzira itaraboneka yo gukemura ibibazo
  uko bikwiriye kuba bikemuka, u Rwanda na rwo ruzakomeza gukora ibishoboka byose
  kugira ngo rurinde Abanyarwanda, rurinde igihugu, aho kubura umutekano bitewe n\u2019uko
  abandi twumvikanye batuzuza ibyabo bya ngombwa. \u201d\\nPerezida Kagame atangaje
  ibi nyuma y\u2019igihe gito Umujyanama wa Perezida wa Leta Zunze Ubumwe za Amerika
  mu bufatanye na Afurika, Massad Boulos, agaragaje ko idashidikanya ku bushake bwe
  bwo kubahiriza ibikubiye muri aya masezerano.\\nAti \u201cPerezida Kagame yagaragaje
  ko yiteguye gushyira mu bikorwa iby\u2019aya masezerano y\u2019amahoro, yashimangiye
  ko ashyigikiye kurangiza mu mahoro iyi ntambara.\u201d\\nBoulos yagaragaje ko kandi
  Perezida Kagame ashyigikiye ibiganiro bya Doha.\\nbiri guhuza M23 na Leta ya RDC\\nPerezida
  Kagame yagaragaje ko abantu bakunze kwibasira aya masezerano yagizwemo uruhare na
  Amerika, ari abashakaga inyungu z\u2019ubukungu gusa nubwo ikibazo cyaba kitakemutse.\\nAti
  \u201cAbantu bakunze kwibanda cyane ku bijyanye n\u2019ubukungu ku bw\u2019impamvu.
  Ntekereza ko bamwe mu babigiramo uruhare mu karere, cyangwa abarebwa n\u2019ikibazo,
  batekerezaga kubyaza umusaruro uwo mutungo, kuko batekereza ko uwo mutungo ukurura
  abantu babaga bameze nk\u2019abawusheta bavuga bati nzaguha iki, nawe ugenzure ibi.
  Ariko abo baba bameze nk\u2019abasheta ntabwo bashakaga igisubizo kirambye cy\u2019ibibazo
  bitugiraho ingaruka mu karere, bashakaga kubona inyungu kurenza abo bahanganye nabo
  ndetse bagatanga utuntu tugamije kuryoshya abantu, bakavuga bati mudufashe gukemura
  ibi, mudufashe guhangana na AFC/M23 cyangwa u Rwanda, abanzi bacu, ubundi abantu
  bagakururwa n\u2019ibyo.\u201d\\nUmukuru w\u2019igihugu yashimangiye ko ubuhuza
  bwa Amerika bushingiye ku guhuza ibi bintu bitatu.\\nAti \u201cUbuyobozi bwa Trump
  bwakomeje kureba uruhurirane rw\u2019ibi bintu bitatu mu bibazo bigomba gukemuka,
  ibya politike, iby\u2019umutekano n\u2019ubukungu, mu gihe mu mitwe y\u2019abandi
  batekerezaga gusa ibijyanye n\u2019ubukungu.\u201d\\nNi ingingo Perezida Kagame
  agarutseho nyuma y\u2019igihe gito u Rwanda na Amerika bishyize umukono ku masezerano
  y\u2019amahoro, mu muhango wabereye i Washington D.C.\\nAmasezerano yasinywe arimo
  ingingo zigaruka ku kubaha ubusugire bwa buri gihugu no gukumira amakimbirane. Arimo
  kandi guhagarika imirwano, kwambura intwaro no gushyira mu buzima busanzwe imitwe
  itari iya leta yitwaje intwaro.\\nArimo gushyiraho itsinda rihuriweho rigenzura
  ibijyanye n\u2019umutekano, gufasha mu gucyura impunzi, gushyigikira ubutumwa bw\u2019Ingabo
  za Loni ziri muri RDC [Monusco] no gushyiraho uburyo bw\u2019imikoranire mu by\u2019ubukungu
  mu karere.\"", "\"26/10/2018, Ikiganiro mwateguriwe kandi mugezwaho na Tharcisse
  Semana\\nNyuma y\u2019uko atugejejeho uko yarusimbutse inshuro zirenze ebyiri zose,
  aho yagombaga kwicirwa i Kibungo cyangwa hakurya y\u2019umupaka w\u2019u Rwanda
  muri Tanzaniya (kanda hano wongere wumve ubuhamya bwe niba waracikanwe: Ukuri k\u2019Ukuri:
  Umunyamakuru Cassien Ntamuhanga aradusobanurira ifatwa rye n\u2019inzira ye y\u2019umusaraba\u2026),
  ubu noneho Cassien Ntamuhanga aratugezaho imibereho ye yo muri gereza n\u2019ukuntu
  yashoboye guca mu irihumye uburinzi bwa gereza.\"", "\"Iyi nguzanyo BBOXX yayihawe
  n\u2019Ikigega gitera Inkunga Imishinga yo gusakaza umuriro udafatiye ku muyoboro
