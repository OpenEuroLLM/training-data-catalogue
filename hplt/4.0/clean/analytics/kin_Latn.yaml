  yerekana umwe mu basirikare ba RDF afite imbunda ku rutugu ari no gukingira umuturage.
  Ni ifoto yafashwe...\\nUrupfu rwa Kabaka Jay Polly, abahanzi bashya bakunzwe nka
  Ariel Wayz, Juno Kizigenza, Niyo Bosco, Koffi Olomide, Ikanzu ya Miss Ingabire Grace
  muri Miss World ni...\\nPacifique Nshizirungu wari umaze igihe aba mui Uganda yishwe
  mu buryo bw\u2019amayobera n\u2019abantu bitwaje imbunda, bamusanze kuri sitasiyo
  ya lisansi mu gace ka Kiryandongo, arimo guha...\\nIbiro by\u2019Umushinjacyaha
  mukuru w\u2019Amerika byatangaje ko Amerika yambuye ubwenegihugu umugabo wari wariyise
  Peter Kalimu, ariko amazina ye ari Fidele Twizere. Bivugwa ko byakozwe nyuma y\u2019uko
  hari...\"", "\"Muri iri serukiramuco hahuriramo abakora filime bo mu bihugu bitandukanye
  byo muri Afurika no hanze yayo. Iry\u2019uyu mwaka riteganyijwe guhera ku wa 21
  kugeza ku wa 27 Kanama 2021.\\nMuri iri serukiramuco hazabaho ibiganiro mpaka, kwerekana
  filime n\u2019ibihe byo kumenyana ku baryitabiriye n\u2019ibindi.\\nAbazitabira
  iri serukiramuco kandi bazitabira n\u2019isoko riteganyijwe kubera mu Rwanda kuva
  ku wa 24 kugeza ku wa 26 Kanama, rijyanye no kugurisha ibihangano rizwi nka DISCOP
  Market in Africa rizaba riba ku nshuro ya 25. Rizabera muri Kigali Convention Centre.\\nIki
  gikorwa kizitabirwa n\u2019abantu batandukanye bazaturuka mu bihugu 84 byiganjemo
  ibivuga Igifaransa. Hazaba harimo inzobere mu bijyanye n\u2019imyidagaduro, siporo,
  filime ndetse n\u2019itangazamakuru.\\nUbufatanye bwa MAAFF n\u2019abategura iki
  gikorwa cya DISCOP, buzafungurira amarembo abasanzwe mu ruganda rwa sinema bazaba
  bari muri iki gikorwa ndetse babe babona umuyoboro wo kugurishirizaho ibihangano
  byabo no kumenyana n\u2019abandi bantu batari basanzwe baziranye bakora mu mwuga
  wa sinema.\\nTr\u00e9sor Senga utegura Mashariki Africa Film Festival yavuze ko
  ubu bufatanye bufite ikintu gikomeye buvuze kuri Afurika.\\nAti \u201cNi igihe cyo
  kwerekana icyo Umugabane wa Afurika ushobora gutanga, ndetse amajwi menshi yabo
  kuri uyu mugabane akaba agiye kumvwa. Abaguzi mpuzamahanga ndetse n\u2019umubare
  munini w\u2019abantu ku Isi yose bazabiha umwanya.\u201d\\nMashariki Africa Film
  Festival yatangijwe ku mugaragaro mu 2014. Ni rimwe mu maserukiramuco akomeye mu
  Rwanda. Iri serukiramuco ngarukamwaka ryatangijwe hagamijwe kumenyekanisha filime
  zikorerwa muri Afurika n\u2019izo mu Rwanda hagamijwe kuzikundisha Abanyafurika
  n\u2019Isi yose muri rusange.\\nIryaburijwemo umwaka ushize ryagombaga kuba guhera
  tariki 21 kugeza ku wa 27 Werurwe 2020. Ryasubitswe filime zigera mu 218 zamaze
  kwiyandikisha zisaba kuzitabira iri serukiramuco.\\nTANGA IGITEKEREZO\\nAMATEGEKO
  AGENGA IYANDIKA RY''IGITEKEREZO CYAWE\\nWitandukira kubijyanye n''iyi nkuru; wikwandika
  ibisebanya, ibyamamaza cyangwa bivangura; wikwandika ibiteye isoni, Wifuza kubona
