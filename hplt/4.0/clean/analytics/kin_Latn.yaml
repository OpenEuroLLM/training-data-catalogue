  bidakurikijwe igitekerezo cyanyu gishobora kutagaragara hano cyangwa kigasibwa.\\nIgitekerezo
  cyawe kigaragara nyuma y''isuzuma rikorwa na IGIHE.com , Murakoze!\"", "\"Doha,
  Qatar \u2013 Nyuma y\u2019isinywa ry\u2019amasezerano y\u2019ibanze (Accord de Principe)
  hagati ya Leta ya Repubulika Iharanira Demokarasi ya Congo (RDC) n\u2019Umutwe wa
  Alliance Fleuve Congo (AFC/M23), hatangajwe ingingo umunani umutwe wa M23 usaba
  Leta ya Congo gushyira mu bikorwa, nk\u2019urufunguzo rwo kubaka icyizere no gutegura
  ibiganiro bya politiki birambye.\\nIzi ngingo zatangajwe na Lawrence Kanyuka, Umuvugizi
  wa AFC/M23, avuga ko zigamije kwimakaza umwuka w\u2019ubwizerane n\u2019ubufatanye
  mu biganiro bitegerejwe, bigomba kuganisha ku mahoro arambye mu Burasirazuba bwa
  Congo.\\nDore ingingo 8 umutwe wa M23 usaba Leta ya Congo kubahiriza:\\n- Itangazo
  ryemewe rya Perezida F\u00e9lix Tshisekedi ryerekana ubushake bwa politiki bwo kugirana
  ibiganiro bitaziguye na AFC/M23.\\n- Gusubiramo icyemezo cyafashwe n\u2019Inteko
  Ishinga Amategeko ya RDC ku wa 8 Ugushyingo 2022, no gukuraho ibihano byose byafatiwe
  AFC/M23.\\n- Gukuraho burundu ibihano by\u2019urupfu, ibirego n\u2019impapuro zo
  guta muri yombi abari n\u2019abahoze muri AFC/M23.\\n- Gurekura vuba abagaragajwe
  nk\u2019abafunzwe bazira gukekwaho gukorana na AFC/M23 (aba ni abasivile n\u2019abasirikare),
  kandi bahabwe indishyi z\u2019ibyo babuze n\u2019agaciro kabo.\\n- Gufatira ibihano
  amagambo n\u2019ibikorwa by\u2019urwango, cyane cyane ibyibasira bamwe kubera inkomoko
  yabo, ururimi bavuga cyangwa ukwitirirwa imyumvire yo kuvugu\\n- Kurandura ivangura
  rishingiye ku moko no kwimika ihakana ry\u2019ubwenegihugu, rishingiye ku ndangamuntu
  cyangwa inkomoko.\\n- Kongera gufungura serivisi zose za Leta mu bice bigenzurwa
  na AFC/M23 \u2013 harimo amabanki, gasutamo, n\u2019impushya z\u2019ingendo.\\n-
  Gusubiza umutungo n\u2019ibikoresho byambuwe AFC/M23 no gushyira umukono ku masezerano
  y\u2019ihagarikwa ry\u2019imirwano (Ceasefire) hagati y\u2019impande zombi.\\nIby\u2019ingenzi
  bikubiye mu \u201cAccord de Principe\u201d yasinyiwe i Doha\\nAmasezerano y\u2019ibanze
  yashyizweho umukono n\u2019impande zombi agamije kwerekana ubushake bwo gukemura
  intambara ya Congo mu nzira ya politiki. Ibirimo birimo:\\n- Gushyiraho inzego z\u2019ubufatanye
  zishingiye ku biganiro bihamye.\\n- Kugarura impunzi no gukemura ikibazo cy\u2019amoko
  ateshwa agaciro.\\n- Gusaranganya ubutegetsi n\u2019ubukungu ku buryo buri muturage
  yisanga muri Leta.\\n- Gutegura uburyo bwo guhagarika imirwano no kubungabunga uburenganzira
  bwa muntu.\\nGusa ihagarikwa ry\u2019imirwano (ceasefire) ntabwo rirubahirizwa\\nNubwo
  imwe mu ngingo nkuru z\u2019amasezerano ari ihagarikwa ry\u2019imirwano, ibikorwa
  bigaragara ku butaka birerekana ko iyi ngingo itubahirizwa. Mu ntara za Nord-Kivu
  haracyakomeje imirwano hagati y\u2019ingabo za Leta (FARDC), AFC/M23 n\u2019abafatanyabikorwa
  b\u2019Impuzamashyaka (Wazalendo), bikaba bigaragaza ibibazo bikomeye mu gushyira
  mu bikorwa ibikubiye mu masezerano.\\nAbaturage n\u2019imiryango mpuzamahanga barasaba
  ubushake nyabwo\\nImiryango iharanira amahoro, uburenganzira bwa muntu n\u2019abaturage
  bibasiwe n\u2019intambara mu Burasirazuba bwa Congo barasaba Leta ya RDC kwitwararika
  ibyo AFC/M23 isaba, kugira ngo ibiganiro birambye bishoboke. Basaba cyane ko ihagarikwa
  ry\u2019imirwano, ifungurwa ry\u2019abo bafunzwe n\u2019ireme ry\u2019ubwenegihugu
  bihabwa agaciro nk\u2019inkingi y\u2019amahoro arambye.\\nYanditswe na: Igicumbi
  News\\nKomeza kudukurikira kuri www.igicumbinews.co.rw kugira ngo ubone amakuru
  yizewe.\"", "\"Mu gihe akarere ka Afurika y\u2019Uburasizuba gakungahaye ku bijyanye
  n\u2019umutungo kamere, hagiye hasinywa amasezerano mpuzamahanga yo kubyaza iyo
  mitungo umusaruro ariko ugasanga amwe muri ayo masezerano atazanira inyungu ibihugu
  byayasinye.\\nNi muri urwo rwego I Kigali hateraniye abanyamategeko baturutse mu
  bihugu bya Tanzania, Uganda n\u2019u Rwanda mu mwiherero bazahugurirwamo ibijyanye
  no gukora amasezerano cyane cyane mu bijyanye no kubyaza inyungu imitungo kamere
  y\u2019ibihugu byabo ariko ayo masezerano akaba akozwe mu buryo azanira inyungu
  mbere na mbere igihugu. Iyi nama izamara iminsi 5, yatangiye kuri uyu wa mbere tariki
  07/08/2017 ariko Kenya ntiyitabiriye iki gikorwa kubera ko muri iki cyumweru iki
  gihugu kizaba gihugiye ku matora.\\nAya mahugurwa yafunguwe ku mugaragaro na Minisitiri
  w\u2019Ubutabera Johnston Busingye, yateguwe na East African Bank ari nayo itera
  inkunga imishinga iremereye iteza imbere ubukungu nk\u2019ubucukuzi bw\u2019amabuye
  y\u2019agaciro, kubaka imihanda, ubucukuzi bw\u2019ibituruka kuri peteroli n\u2019indi
  mishanga minini amabanki menshi adakunze kujyamo. Kubera ko iyi mitungo akenshi
  iba ari imitungo kamere y\u2019ibihugu, leta niyo itanga amasezerano yo kubyaza
  umusaruro iyo mitungo, ni muri urwo rwego hari igihe umutungo kamere ushobora gutwarwa
  ku buryo butungura igihugu, bityo abanyamategeko bakaba bagiye kwiyungura ubumenyi
  mu gukora amasezerano meza atabogamye ariko areba inyungu z\u2019igihugu cyawe.\\nIyi
  nama kandi yitabiriwe DLA Piper, ikompanyi y\u2019abongereza ifite uburambe mu bijyanye
  n\u2019amategeko iyi niyo iri buhugure aba banyamategeko bitabiriye aya mahugurwa
  azamara iminsi 5. Ibi bizafasha mu gutuma ibi bihugu byo muri Afurika y\u2019Uburasirazuba
  ibihugu bizajya biba byizeye abantu bagiye kubihagararira mu gihe bigeye gusinya
  amasezerano ashingiye ku bucuruzi bwo kubyaza umusaruro umutungo kamere.\\nMinistiri
  Johnston Busingye yasobanuye neza ko iyo amasezerano akozwe nabi bituma imishinga
  imwe n\u2019imwe ihomba cyangwa ikadindira ibi kandi bikaba byanahenda abaturage,
  cyane cyane ko iyo umushoramari ahenzwe bituma n\u2019umuguzi wa wundi wo hasi ari
  we uhendwa kurushaho. Abajijwe niba mu Rwanda haba hari amasezerano yagenze nabi,
  Ministiri Johnston Busingye yahise atangariza abanyamakuru ko hashize amezi 3 gusa
  u Rwanda rutsinze ikompanyi yari yahawe amasezerano yo gucukura gaz methane, guhera
  muri 2003 kugeza muri 2017 akaba aribwo ikibazo kirangijwe n\u2019inkiko.\\nIbi
  bigaragaza ko aya masezerano atari yizweho ku buryo bwungura impande zombi ndetse
  leta ntibuze kuba yarahatakarije umutungo isiragira mu nkiko. Minisitiri yavuze
  ko gukora amasezerano buri munsi bikubera isomo ku masezerano azakurikiraho. Niyo
  mpamvu amasezerano yakurikiyeho ku bya Gaz methane yahise atanga umusaruro kuko
  ubu abanyarwanda batangiye gucana babikesheje gaz methane.\\nTANGA IGITECYEREZO\"",
  "\"Duherukana Mama Mutesi ari kumubaza akazi yagiye gukora gatuma agenda atavuze\\nMutesi:
  Erega mama nagiye nanjye ntazi akazi nzakora ako ariko kandi na none sinari nzi
  ko ndi bukabone niyo mpamvu nagiye ntasezeye. Gusa nyine nakabonye nabikubwiye,
  nzagatangira ejo mu gitondo. Rero nagirango udakomeza guhangayika, uramuke\\nMama
  Mutesi: Banza unsubize ibyo nakubajije wa mukobwa we. Akazi ugiye gukora ko numva
  uri kugatsinda ni uburaya, ni ubuyaya se, ni kazi nyabaki?\\nMutesi: Mama ngiye
  kujya nkora mu kabari ariko nyine\\nYabaye atararangiza kuvuga ahita amuca mu ijambo\\nMama
  Mutesi: Nyine nyine iki? Nagorwa nagorwa Madarina. Yezu Kirisitu wabambwe koko ubu
  nakubyariye iki? Nagatangaye akazi Rufonsina yakurangira? Ubu ugiye kujya wirirwa
  mu mpenure uhenera umuhisi n\u2019umugenzi, abagabo bagukorakora mu mabere, bagusimburanaho
  nk\u2019intebe ya moto koko? Niko wabuze iki koko hano gituma ujya ishyanga gukora
  amahano? Umva, niba udashaka guhinga garuka mu rugo ujye wirirwa wicaye ariko rwose
  sinshaka pee.\\nMutesi: Ariko se mama ni nde wakubwiye ko abakora mu kabari bose
  bambara impenure cyangwa ari ko abagabo babakorakora? Iyo ni imyumvire ishaje rwose.
  Akazi kose ni akazi gapfa kuba gusa kakwinjiriza amafaranga. Rwose humura nzitwara
  neza kandi umwana w\u2019abandi wikomeza kumwishyiramo si we wanshutse ndi mukuru
  nzi gutekereza. Uramuke rero ninzajya mbona akanya nzajya mbavugisha. Kandi nimpembwa
  nzahita nza kubasura.\\nYahise akupa, nuko umukecuru asigara aganira na Kagabo\\nMama
  Mutesi: Niko Kaga, uranyumvira mushiki wawe koko? Ngo gukora mu kabari? Mwene Silasi
  ntiyaje atwite? Ntiyakoraga mu kabari? Wa mukobwa wo kwa Rwajekare, ntibavuga ko
  buriya kungana kuriya ari SIDA arwaye. Yayivanye hehe? Reba wa mukobwa wo kwa so
  wanyu. Ntabyaye kabiri aza akajugunyira nyina? None nanjye najyaga mbaseka bigiye
  kumbaho koko kubera mushiki wawe utumva?\\nKagabo: Ariko mama ndumva udakwiye guhangayika.
  None se ko uvuze abo, ngaho noneho reba kwa Safari. Umukobwa wabo ntabujirije inzu?
  Ntakora mu kabari se? Ejobundi si bwo yashyingiwe ubu si umugore mwiza? Reba ntuza
  uriya, Chantal wo kwa Sipiriyani. Iwabo ntihari inka ntibabaye abatunzi hari ukigura
  amata ntugenda bakaguha nk\u2019abaguha amazi? Chantal ntakora mu kabari se? Hari
  umwana wamubonanye cyangwa inda? Rero niba warareze neza cyangwa nabi ahubwo ubu
  ugiye kugaragara nigaramiye. Bayimutwika abantu baguseka ngo wareze nabi. Ahubwo
  aho kumubwira nabi wari ukwiye kumuha inama y\u2019uko azitwara. None se ubu wa
  mwarimukazi utuye hepfo hano ko yatwaye inda hari akabari akoramo? Hano kwa Yozefu
  umukobwa wabo yatwaye inda hari ahantu ajya ajya ntava mu murima ajya muri repetisiyo
  no mu misa? Mama umuntu ni we ubwe akazi kararengana\\nMama Mutesi: Cyakora wa mugani
  ibyo umbwiye ni byo. Burya umaze gukura sha. Ngaho rero urabona mushiki wawe ntagihari
  ni twe gusa dusigaye hano. Ubu se ko ubona akagongo kamaze gucika ntazabasha kwihina
  nkiza imyanda, urugo ntirugiye kuba itongo mwana wa? Gucana mu ziko byo urabizi,
  amazi uzayazana. Ibindi se yakoraga bizakorwa na nde? Gusa ndahangayitse mwana wa.
  Yambwiye ko agiye gukora mu kabari ibikoba birankuka. Icyo azanzanira nzacyakira
  na yombi.\\nKagabo: Mama wihangayika jyewe sindi umunenganenzi urabizi. Gukiza imyanda
  se bizananira? Uzanseka ko ndi gukubura azaze anyake umweyo abe ari we uhakubura.
  Ibyo na byo. Jyewe rwose sintinya amaso y\u2019abantu. Abahungu bamwe bajya bansetsa
  ngo hari imirimo y\u2019abakobwa da. Mba mbona ntayibaho. Yego nyine ahari yaba
  ahari kandi nabwo ashobora kuba ananiwe cyangwa yarwaye. Ubwo se narindira igihe
  abonekera koko? Reka jyewe si uko nteye rwose mama. Humura rwose. Ahubwo se ya nyana
  ko nabonye yarinze, tuzakura hehe ikimasa? Cya kindi cyo kwa Kalisa ngo barakigurishije.
  Ubwo nzaterera impinga njye kwa Karasanyi se?\\nMama Mutesi: Ahubwo uranyibukije
  koko. Dukwiye kuyibangurira vuba dore ni ko gatungo gasigaye wenda twakongera tukazahuka.
  Iriya nshege se si yo yamazeho amatungo none ukuntu yagiye amaze kunyihenuraho ngo
  namubyariraga iki?\\nKagabo: Mama byihorere wikiyongerera ibibazo utari bubikemure.
  Ubwo rero ndabyuka njya kubangurira, nimvayo nzaza nteke wenda uzahingura byahiye.
  Reka rero nigire kuryama mama. Kandi ujye wibuka gukinga dore uwakingaga yagiye.\\nBagiye
  kuryama, ndetse no kwa Mutesi na Fofo na bo ubwo bamaraga kuganira bararyamye. Nuko
  bucyeye\\nFofo: Ese muko ko utabyuka ngo witegure? Wowe ubwo uzashobora akazi?\\nMutesi:
  Sha ubu buriri uwaburyamamo ntiyabyuka pee. Sinari nzi ko bwanakeye maze.\\nFofo:
  Byuka rero utanyishinga jyewe ndakora ijoro uyu munsi. Ubanze ukorope muri salon,
  hanze ndahikoropera nimbyuka nta kibazo\\nYarabyutse aritegura, akora isuku, nuko
  amaze kwambara agana ku kazi. Hari hafi ntibyari ngombwa kuba yatega.\\nYahageze
  boss atarahagera, aba yicaye aho, yitaruye abandi bari bari gukora isuku. Bose wabonaga
  bari kumwibazaho, nuko umwe muri bo, bakunze kwita Karashika aramwegera\\nKarashika:
  Bite se ko uri hano?\\nMutesi: Ntegereje boss\\nKarashika: Ese ni wowe uje mu kazi?\\nMutesi:
  Yego ni jyewe\\nYahise ahindukirira bagenzi be ariyamirira cyane\\nKarashika: Mundebere
  uyu muvantara ngo aje gukora hano pee. Ubu se wowe ni nde uzasukira inzoga ngo ayemere?
  Yego agasura uragafite ariko imyambarire yawe izagukoza isoni\\nYari akivuga ibyo,
  Boss aba arahageze bose bahita bakorana umwete dore ko bamutinyaga kubi. Yari umugabo
  utavuga menshi kandi utihanganira amafuti.\\nBoss: Niko sha, harya ngo witwa nde?\\nMutesi:
  Nitwa Mutesi\\nBoss: OK. Ngaho ngwino tuvugane ibyerekeye akazi. Abandi namwe mukore
  vuba duftanye akanama gato\\nBinjiye mu biro bya boss, nuko aricara baravugana ibyerekeye
  umushahara, amasaha y\u2019akazi n\u2019ibindi byose byerekeye akazi. Umukobwa byose
  yarikirizaga dore ko umushahara utari muto. Ubwo boss yamubajije niba hari amafaranga
  akeneye yo kwiyitaho, undi amubwira ko atayakeneye ariko boss amubwira ko agomba
  guhindura imyambarire byibuze akagura udupantalo, ko ingutiya yambaye itajyanye
  n\u2019akazi. Arangije yongeraho irindi jambo\\nBoss: hanyuma kandi, hano mu kazi
  agaciro ka mbere gafitwe n\u2019umukiriya, kuko ni we utuma uhembwa. Kumusuzugura
  cyangwa kumuha serivisi mbi ushobora no guhita wirukanwa. Ikindi ukwiye kwitaho
  no kuzirikana, nzakikubwira nutangira guseriva. Ubu uraba ukora muri comptoir imbere
  no mu gikoni. Hari ikibazo waba ufite?\\nMutesi: None se boss, ubu umukiriya azankora
  mu mabere nemere ngo ni ukugirango ativumbura?\\nBoss se aramusubiza gute? Tuzabibona
  mu gace ka 5\\nBIRAMAHIRE Francois Jassu\\nEEEE!!!!!\\nLikeLike\"", "\"Related Posts\\n-
