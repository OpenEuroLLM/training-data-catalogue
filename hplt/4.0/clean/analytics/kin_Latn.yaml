  yibanda ku bantu badafite umuriro w\u2019amashanyarazi cyane cyane abatuye mu cyaro.\\nIyi
  sosiyete ikomoka mu Bwongereza, yatangiye gukorera mu Rwanda muri Mata 2014, kuri
  ubu ifite ahantu hacururizwa ibikoresho byayo hatandukanye mu gihugu.\\nTANGA IGITEKEREZO\"",
  "\"Urwego rushinzwe Imfunga n\u2019abagororwa rwatangaje ko umugabo witwa Simbarikure
  Theodore wari uherutse gutoroka Gereza ya Rusizi, yongeye gufatwa agerageza guhunga
  igihugu yerekeza muri Uganda.\\nUmuvugizi wa RCS, Sengabo Hillary yagize ati \u201cUmugororwa
  witwa Simbarikure Theodore, wari watorotse Gereza ya Rusizi tariki ya 2 Mutarama
  2017 twaraye tumufashe agerageza kujya Uganda.\u201d\\nSimbarikure ni mwene Ntibyingingwa
  na Mukangoboka. Yavutse mu mwaka wa 1976, akaba yari yarakatiwe imyaka 15 y\u2019igifungo,
  azira icyaha cy\u2019ubujura bwifashishije ibikangisho.\\niyo anshaka nkamunyuza
  panya road se nikibwa kiba atageze zambarara uganda kontqkibazo kobatikompirika\"",
  "\"Uzamberumwana Pacifique wiyeguriye muzika nka Oda Paccy akaba umuraperi ukomeye
  yongeye guca igikuba muri iki cyumweru ubwo yongeraga gushyira hanze amafoto agaragara
  yikinze ikoma ku gitsina hari ibice bimwe bigaragara.\\nUyu muhanzikazi avuga ko
  kwifotoza kwe ari ibintu yapanze ibintu atemeranya na gafotozi we uhamya ko ariwe
  wamugiriye inama yo kutifoza atandaraje kuko ariyo gahunda yari yajyanye.\\nAganira
  na KT Radio yahakanye yivuye inyuma ibyavuzwe na Luqman Mahoro umufutozi wa IGIHE
  wari wahawe icyaraka cyo gufotora Oda Paccy.Ibi abitangaje nyuma y\u2019uko uyu
  Luqman atangaje ko yahuye n\u2019imbogamizi ubwo yashakaga gufotora uyu mukobwa.\\nYavuze
  ko uburyo yashakaga kwifotozamo butari bwiza agahitamo ko bajya inama bukaba bwahinduka,
  bagakoresha ubundi bwihariye butandukanye n\u2019ubwo bari bateguye.\\nAbajijwe
  niba nta mbogamizi yaba yarahuye nazo mu gihe yafataga ariya mafoto yagize ati\u201dByabayeho
  bitewe n\u2019uko uburyo bwa mbere Paccy yashakaga ntabwo njye bwari kumfasha, kwari
  ukwambara nyine ubusa nka kuriya hejuru agakingaho uturabyo, hasi akicara asa nk\u2019utandaraje
  agashyiramo ikirabyo.\u201d\\nYunzemo ati\u201dHasi aho handi hari ibindi bahashyize,..
  nsanze ntacyo byari kumfasha niko gutekereza njye buriya buryo ndagenda nca ririya
  koma ndarimuha \u2018nti byibuza wenda iri ryamfasha, ganira n\u2019uyu mugenzi
  wawe mwazanye agufashe njye ndaza nje gufotora mwasoje kwitegura\u2019. Hari ukuntu
  umuntu aba atumva neza context y\u2019uburyo yatangamo message ye mugafatanya kubishyira
  ku murongo ni ibyo byangoye birangira twanzuye kuriya nyine.\u201d\\nOda Paccy ku
  mugoroba wo kuri uyu wa gatandatu tariki 30 Nzeri 2017, yavuze ko ibyo uyu wamufotoye
  yatangaje atari byo kuko yari yapanze uburyo agomba kwifotozamo kandi akaba ari
  bwo yakoresheje.\\nYakommeje avuga ko nta nka yaciye amabere kandi akaba kuri we
  atumva icyo abantu bita ubusa. Ngo yibona mu ifoto yifotoje nta hantu abona harimo
  yambaye ubusa cyangwa yica umuco Nyarwanda kuko nta kintu na kimwe kigaragaza imyanya
  ye y\u2019ibanga.\\nAha yaboneyeho guhamya ko uretse no kuba yari ameze kuriya yari
  yambaye iyindi myenda[umwenda w\u2019imbere wo hasi ndetse n\u2019isutiye].\\nAti\u201d
  Nahisemo iriya foto kubera ko umuhanzi aba agomba kugira uburyo butandukanye yamamazamo
  ibikorwa bye, hagomba kubaho impinduka n\u2019ubwo ikintu gishya abantu badashobora
  guhita bacyakira. Iyi foto wenda ntago ijyanye n\u2019indirimbo cyane gusa buri
  gihe ntago ibyo umuntu yaririmbye mu ndirimbo aribyo agaragaza , ku ifoto iyitegura.\u201d\\nYongeye
  ati\u201cUbu se urugero ufite indirimbo ivuga ibintu bijyanye no gushya wakwifotoza
  ifoto uri mu muriro? Njye ntago nemeranya n\u2019abavuga ko nta kintu nari nambaye
  kuko imbere ya ririya koma hari harimo imyenda y\u2019imbere.\u201d\\nKu wa kane
  tariki 28 Nzeri 2017, nibwo ifoto ya Oda Paccy yikinze ikoma ku gitsina yakwirakwijwe
  ku mbuga nkoranyambaga.Iyi foto yayifotoje mu rwego kumenyekanisha indirimbo ye
  nshya yise Order yahuriyemo n\u2019itsinda rya Urban Boys .Ni indirimbo iri gukorwa
  mu buryo bw\u2019amajwi na Junior Multi System izajya hanze vuga aha.\\nAriko yajya
  mumigina nahandi nkaho KO ariho abamamaza ibikorwa byabo nka biriya nyine baba\\nBirababaje
  cyane kubona kwambara ubusa ntacyo bibwiye ODA PACCY.Cyokora siwe wenyine.\\nAbantu
  bashakisha ifaranga,mu buryo bushoboka bwose.Niyo mpamvu basambana,abandi bagakora
  coup d\u2019\u00e9tat,abandi bakiba,etc..Nkuko 2 Petero 2:12 havuga,abantu bameze
  nk\u2019INYAMASWA zitagira ubwenge,zitegereje kubagwa.Ni muli ubwo buryo imana izarimbura
  abantu bose bibwira ko ubuzima gusa ari:amafaranga,shuguri,sex,politike,etc...Ibyo
  bizaba ku munsi w\u2019imperuka uri hafi.Imana izasigaza gusa abantu bake bayumvira,bature
  mu isi izaba Paradizo,abandi ibajyane mu ijuru,kuko hazabaho Ijuru rishya n\u2019isi
  nshya nkuko Bible ivuga muli 2 Petero 3:13.Aho gupinga ibi duhora tubabwira,mukwiye
  GUHINDUKA,kugirango muzabone ubuzima bw\u2019iteka.Abantu bose bibera mu byisi gusa,ntabwo
  bazabona ubuzima bw\u2019iteka.\\nByisomere muli 1 Yohana 2:15-17.Ikibabaje nuko
  abenshi mupinga ibyo tubabwira,nyamara iyo mupfuye,mukemera ibyo bababeshya ko muba
  \\\"mwitabye imana\\\".Ni ikinyoma.Abantu bashaka imana bakiriho,bazazuka ku munsi
  w\u2019imperuka.\\nIbyo ni YESU ubwe wabyivugiye (Yohana 6:40).\"", "\"Ni amabwiriza
  yashyizweho kuri uyu wa 18 Mutarama n\u2019Inama y\u2019Abaminisitiri yateranye
  hifashishijwe ikoranabuhanga, ikayoborwa na Perezida Paul Kagame, aho yategetse
  ko Umujyi wa Kigali ushyirwa muri Guma mu Rugo y\u2019iminsi 15, kugira ngo inzego
  z\u2019ubuzima zibashe gukurikirana neza imiterere y\u2019ubwandu bwa Coronavirus
  mu gihugu \u201cbugeze ku gipimo giteye inkeke mu Murwa Mukuru w\u2019u Rwanda\u201d.\\nAya
  mabwiriza yagombaga guhita atangira kubahirizwa, gusa yasanze hari abantu bamwe
  batari mu bice bashobora kumaramo iminsi 15, ari nayo mpamvu umunsi wa mbere wa
  Guma mu Rugo wahariwe gufasha abantu kugera aho bumva bamara iminsi 15 ya Guma mu
  Rugo.\\nMu gitondo cyo kuri uyu wa Kabiri, muri gare zihuza Umujyi wa Kigali n\u2019ibindi
  bice by\u2019igihugu hazindukiye urujya n\u2019uruza rw\u2019abantu benshi bashakaga
  kujya mu ntara ku mpamvu zitandukanye.\\nInzego z\u2019ibanze, izishinzwe umutekano,
  urubyiruko rw\u2019abakorerabushake ndetse na RURA, bakomeje gufasha abari muri
  gare ya Nyabugogo aho bari gufashwa kubahiriza amabwiriza arimo kwambara neza agapfukamunwa,
  guhana intera ndetse no gukaraba amazi meza n\u2019isabune, mu gihe bategereje gutangira
  ingendo zabo.\\nUmuyobozi wa Serivisi zo gutwara Abantu n\u2019Ibintu muri RURA,
  Anthony Kulamba yavuze ko uyu munsi wose wahariwe gufasha abantu bajya mu ntara
  gutaha ariko bakaba basabwa gukomeza kubahiriza amabwiriza yo kwirinda COVID-19.\\nYagize
  ati \u201cBahawe uburenganzira kugira ngo bakoreshe uyu munsi tubashakire uko bagenda
  buri muntu agende neza agere mu Karere aho atuye amahoro. Ni amahirwe yahawe abagomba
  kujya mu ntara kugira ngo bagende.\u201d\\nRURA yasabye abaturage gukoresha uyu
  munsi bahawe kugira ngo ibibazo byose bishobora gutuma batubahiriza ibyemezo by\u2019Inama
  y\u2019Abaminisitiri byategetse ko Umujyi wa Kigali ushyirwa muri gahunda ya Guma
  mu rugo bikurweho.\\nKulamba yavuze ko \u201cNiba tuvuze uyu munsi ni uyu munsi,
  nibawukoreshe kugira ngo iminsi isigaye twubahirize ibyemezo by\u2019Inama y\u2019Abaminisitiri
  mu rwego rwo kwirinda COVID-19, kandi n\u2019aho baraba bari mu rugendo cyangwa
  n\u2019ahandi bari ni ukubibutsa ko ikintu gikomeye cyane ari ukwirinda bakarinda
  n\u2019abandi.\u201d\\nUmuvugizi wa Polisi y\u2019Igihugu, CP John Bosco Kabera,
  yaraye avuze ko Polisi iza gufasha abantu batunguwe n\u2019aya mabwiriza, ku buryo
  bari bugere iyo bagomba kuba bari amahoro.\\nYagize ati \u201cTuzafasha abantu bashobora
  kuba batunguwe n\u2019aya mabwiriza bari ahantu hatandukanye bifuza kuba bari ahantu
  mu by\u2019ukuri bumva bamara icyo gihe cy\u2019iminsi 15, iki ni icyemezo kigomba
  kwihutirwa.\u201d\\nCP Kabera yavuze kandi ko abantu bakwiye kubanza bagatekereza
  ku ngendo bateganya gukora niba koko ziri ngombwa cyangwa hari ubundi buryo bashobora
  gukora bagafasha mu kubahiriza amabwiriza yashyizweho.\\nAmafoto: Niyonzima Moise\\nTANGA
  IGITEKEREZO\\nAMATEGEKO AGENGA IYANDIKA RY''IGITEKEREZO CYAWE\\nWitandukira kubijyanye
  n''iyi nkuru; wikwandika ibisebanya, ibyamamaza cyangwa bivangura; wikwandika ibiteye
  isoni, Wifuza kubona byihuse ibivugwa/ibisubizo ku gitekerezo cyawe, andika email
  yawe ahabugenewe. Ibi bidakurikijwe igitekerezo cyanyu gishobora kutagaragara hano
  cyangwa kigasibwa.\\nIgitekerezo cyawe kigaragara nyuma y''isuzuma rikorwa na IGIHE.com
  , Murakoze!\""]'
