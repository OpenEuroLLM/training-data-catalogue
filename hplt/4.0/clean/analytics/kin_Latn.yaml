sample: '["\"Kwihutisha Prototyping no Kubisabwa Umusaruro wa\\nKwikora\\nInganda\\nSerivisi
  zacu zo gukora\\namasezerano yo gukora neza-gukora ibicuruzwa byicyuma, iyi nzira
  iruta ubwinshi, itanga ubuziranenge buhoraho mubice byose.\\nKugera kubishushanyo
  mbonera, bigoye hamwe no gusya, guhindukira, na nyuma yo gutunganywa, nibyiza kuri
  prototipes zombi hamwe nibice byicyuma bikora.\\nTekinike ihendutse yo gukora kimwe,
  ibice birebire mubikoresho bitandukanye, bigahindura umusaruro mwiza no gukoresha
  ibikoresho.\\nItanga ubworoherane mugukora ibyuma bisobanutse neza bigenewe porogaramu
  zitandukanye, byemeza guhuza n''imihindagurikire.\\nGukata lazeri nibyiza mugukora
  ibice bigoye nibigize ibice byuzuye kandi bisukuye neza.\\nIyi nzira ningirakamaro
  mugukora ibice bifite impande zifatika neza, bituma biba ngombwa mugukora ibice
  biramba kandi bikora mubikorwa bitandukanye.\\nZhonghui itanga ibice byabumbwe hamwe
  nibikoresho byikiraro, byatejwe imbere kubyara umusaruro mwinshi kandi bifite ireme.\\nGushyiramo
  ibishushanyo ni tekinike yo gutera inshinge zirimo gutera inshinge hafi ya plastiki
  cyangwa icyuma gishyirwa mu cyuho. Kwinjiza byashyizwe mbere mumyanya yububiko,
  nyuma yo guterwa plastike.\\n- 1 KwandikaSerivisi zacu zihuse zihuta zitanga uburyo
  bwiza kandi buhendutse bwo gukora moderi zo kwipimisha byihuse. Kuri iki cyiciro,
  turatanga ibisubizo byoroshye bya prototyping kugirango uhuze ibisabwa byihariye.
  Mugukoresha ibikoresho bikoresha neza nuburyo bwo kubyaza umusaruro, tuzana ibicuruzwa
  byawe byanyuma-byanyuma mubikorwa.\u25cf Umubare muto wa prototyping hamwe nigihe
  gito cyo gutera inkungaIgikoresho cyihuse cyo kwihuta gushushanyaProt Porotipire
  ikora yo kwerekana icyerekezoKwemeza vuba igitekerezo\\n- 2 Kwemeza Ubwubatsi no
  KwipimishaKora imikorere ishingiye kubikorwa byihuse kandi neza, kwemeza imikorere
  ya prototype yujuje ibisabwa bisanzwe. Kuri Zhonghui, dukora prototypes ikora, byoroshye
  kumenya no kwirinda ingaruka mugushushanya. Nubwo iyi nzira ikenera inshuro nyinshi
