  kiri mu nzira yo gutera imbere. Yagize ati: \u201cigihe cyose tekinoloji izana inyungu;
  ariko igihe cyose izo nyungu zitari kuri gahunda zishobora zahungabanya ubukungu,
  uburezi n\u2019umuco wacu.\u201d\\nYakomeje avuga ko iri tegeko rizafasha u Rwanda
  mu kugenzura uruvangitirane rwa serivisi zitangwa binyuze mu ikoranabuhanga. Biteganyijwe
  ko mu ntangiriro z\u2019umwaka utaha wa 2012 ariho iri tegeko rizatangira gushyirwa
  mu bikorwa.\\nEmmanuel N. Hitimana\"", "\"\\\"Isazi yimije urutare, maze iriyamirira
  cyane igira iti : Bizafata aha Mana!\\\" Kuri uyu wa Gatatu taliki ya 21/08/2019,
  Paul Kagame na Yoweli Kaguta Museveni banyarukiye muri Angola maze biyemeza gushyira
  umukono ku masezerano yo guhosha amakimbirane ari hagati y''abo bombi. Nyuma yo
  gushyira umukono kuri ayo masezerano ,imvugo ya Paul Kagame n''ibisobanuro Olivier
  Nduhungirehe yahaye umunyamakuru wa radiyo mpuzamahanga y''abongereza BBC Gahuzamirango
  kuri ayo masezerano, ubona harimo gushidikanya mu ishyirwa mu bikorwa ryayo! Ese
  ayo masezerano azajya mu bikorwa? Ni aha Mana nka yasazi yimije urutare!\\nImbere
  ya perezida wa Angola Joao Louren\u00e7o, F\u00e9lix Tshisekedi Kilombo wa RD. Congo
  na Denis Sassou Nguesso wa Congo Brazza; Paul Kagame na Yoweli Kaguta Museveni bahagurutse
  bombi bashyira umukono ku masezerano bari bamaze kumvikanaho bahujwe na bariya ba
  perezida uko ari 3, baze gushyira umukono kuri ayo masezerano, bahise bahana umukono
  barasuhuzanya bombi! Ibihugu bya Uganda n''u Rwanda bifitanye amakimbirane aturuka
  ku birego buri wese ashinja undi: Uganda ishinja u Rwanda kuba rwohereza intasi
  muri Uganda muri gahunda yo guhungabanya umutekano w''icyo gihugu; Uganda kandi
  ikaba ishinja u Rwanda kuba rwarafunze umupaka uhuza ibihugu byombi; rukabuza ibicuruzwa
  bya Uganda kujya mu Rwanda ndetse rukanabuza abaturage barwo kujya muri Uganda!
  Naho u Rwanda rwo rukaba rushinja Uganda gufunga abanyarwanda bajyayo, gufasha imitwe
  irwanya u Rwanda no gufatira amabuye y''agaciro u Rwanda runyuza muri icyo gihugu
  rugiye kuyagurisha mu mahanga!\\nMu itangazo risoza inama yahuje bariya bakuru b''ibihugu
  uko ari 5, nyuma yo gushyira umukono ku masezerano y''ubwumvikane hagati ya Kagame
  na Museveni, ikinyamakuru \\\"independent\\\" cyandikirwa mu Bwongereza cyashyize
  ahagaragara itangazo rikubiyemo ingingo z''amasezerano Museveni na Kagame bumvikanyeho,
  arizo izi zikurikira:\\n1.Abakuru b''ibihugu byombi, bumvikanye ko bagomba kubaha
  ubusugire bwa buri gihugu ndetse bakubaha n''ubusugire bw''ibihugu bihana imbibi
  n''ibihugu byabo.\\n2.Kwirinda gushyigikira ibikorwa bishobora guhungabanya umutekano
  wa kimwe mu bihugu byabo ndetse n''iby''abaturanyi. Kuri iyi ngingo, ibihugu byombi
  bigomba kwirindi gutera inkunga cyangwa se guha ubufasha ubwo aribwo bwose imitwe
  irwanya ubutegetsi bwa kimwe muri ibyo bihugu no kwirinda ibikorwa byo gucengeza
  intasi mu kindi gihugu.\\n3.Kurengera no guha uburenganzira busesuye bwo kwishyira
  ukizana abaturage ba buri gihugu batembera mu kindi cyangwa banyura muri ibyo bihugu
  mu gihe bubahirije amategeko y''igihugu barimo.\\n4.Gufungura imipaka ihuza ibihugu
  byombi mu gihe cya vuba kandi ibikorwa n''imirimo y''ubuhahirane n''ubucuruzi yari
  isanzwe ikorerwa kuri iyo mipaka n''abaturage b''ibihugu byombi igakomeza gukorwa
  nk''uko yakorwaga mbere y''uko ubwumvikane bucye buvuka hagati y''ibihugu byombi.
  Abaturage b''ibihugu byombi kimwe n''ibintu byabo bakagira uburenganzira bwo kwambuka
  imipaka y''ibihugu byombi nta nkomyi!\\n5.Guteza imbere umuco w''ubwumvikane n''ubworoherane
  usanzwe uranga abanyafurika n''akarere kose mu guteza imbere muri rusange ubufatanye
  mu byerekeranye n''umutekano, politiki, ubucuruzi , ubufatanye mu muco no guterana
  inkunga mu iterambe ry''ibihugu.\\n6.Gushyiraho komisiyo ihuriweho n''ibihugu byombi
  igomba gukurikirana ishyirwa mu bikorwa ry''aya masezerano. Iyo komisiyo igomba
  kuyoborwa na ba ministre b''ububanyi n''amahanga b''ibihugu byombi kandi ikaba igomba
  kuba irimo ba ministre b''ubutegetsi bw''igihugu n''abakuru b''iperereza b''ibihugu
  byombi.\\n7.Kumenyesha buri gihe abakuru b''ibihugu b''abahuza b''iyi mishyikirano
  (Angola + RDC) intera izaba yagezweho mukuyashyira mu bikorwa.\\nDukurikije izi
  ngingo zashyizweho umukono na Kagame na Museveni, biragaragara ko ingingo nyinshi
  zayo zihuye n''ibitekerezo cyangwa se ibisobanuro leta ya Uganda yatangaga buri
  gihe cy''uburyo ikibazo cy''ubwumvikane bucye Uganda ifitanye na leta ya Paul Kagame
  cyakemuka. Uganda yasabye kenshi ko umupaka uhuza ibihugu byombi ugomba gufungurwa,
  abaturage bagahahirana bisanzwe kandi abanyarwanda bari ku butaka bwa Uganda bakubaha
  amategeko y''icyo gihugu. Nta nkunga nimwe Uganda yigeze iha abatavuga rumwe n''ubutegetsi
  bwa Kagame, kuburyo bigaragara ko aya masezerano ari intsinzi kuri Museveni. Abakurikiranira
  hafi politiki y''i Kigali bemeza ko Paul Kagame nta mahitamo afite yo gukomeza kwi
  nangira mu gufunga umupaka uhuza u Rwanda na Uganda kuko inzara imereye nabi abanyarwanda
  benshi bahahiraga muri Uganda kandi ubukungu bw''u Rwanda bukaba bugeze aharindimuka!\\nNubwo
  bimeze gutyo ariko, mu ijambo Kagame yavuze nyuma y''amasezerano, humvikanamo ko
  ubushyamirane afitanye na Museveni butarangiye! Kagame yagize ati :\\\"Aya masezerano
  dushyizeho umukono ni intango igomba kudufasha gukomeza ibiganiro byo gukemura ibibazo
  dufitanye na Uganda\\\"! Ibi bikaba bishaka kumvikanisha ko ikibazo cy''ubwumvikane
  bucye hagati ya Kagame na Museveni kitarangiye! Umunyamabanga wa leta muri ministeri
  y''ububanyi n''amahanga ya Kagame Olivier Nduhungirehe, yabwiye BBC ko gushyira
  umukono kuri ayo masezerano ari igikorwa kimwe, ko no gufungura umupaka nawo ari
  ikindi gikorwa, yakomeje avuga ko umupaka uhuza u Rwanda na Uganda utazafungurwa
  kuberako hashyizwe umukono kuri ariya masezerano ko ahubwo bazategereza ko Uganda
  iyashyira mu bikorwa! Ku kibazo umunyamakuru yongeye kubaza Nduhungirehe niba umupaka
  w''u Rwanda na Uganda uzafungurwa, Nduhungirehe yamusubije ko umupaka w''u Rwanda
