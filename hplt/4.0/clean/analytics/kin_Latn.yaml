  5 Umusaruro rusangeNtukigere winjira mubikorwa byinshi hamwe nogutanga byihuse ibice
  bikoresha amaherezo no guhuza ibipimo byubuziranenge bwawe mubikorwa bya Zhonghui.
  Fata imashini zawe za robo zikoreshwa muburyo bushya hamwe nubuhanga bugezweho bwo
  gukora. Itsinda ryinzobere zacu zikora kugirango ibicuruzwa byawe byujuje ubuziranenge
  nibikorwa bisabwa, kugumya ibiciro bike no kuyobora ibihe bigufi.Ibice byiza-byiza,
  umusaruro-witeguyeMachine Gutunganya neza hamwe no kwihanganira gukomeyeOperations
  Ibikorwa byo gutunganya inyandiko ntagereranywaSisitemu yo kugenzura ubuziranenge
  bwuzuye\"", "\"Itangazo rya Minisante ryo kuri uyu wa Kane, tariki ya 23 Nyakanga
  2020, ryerekanye ko abagaragayeho Coronavirus mu gihugu bakuwe mu duce two mu Ntara
  y\u2019Uburengerazuba no mu Mujyi wa Kigali.\\nRigira riti \u2018\u2018Abarwayi
  bashya bagaragaye Kigali:7 (abapimiwe mu duce turi mu kato), Rusizi:7, Nyamasheke:7.\u2019\u2019\\nMu
  bantu 231 186 bose bamaze gupimwa Coronavirus mu Rwanda kuva umurwayi wa mbere agaragaye
  mu gihugu ku wa 14 Werurwe 2020, abantu 1710 barayanduye mu gihe 889 basezerewe
  mu bitaro nyuma yo gukira, bakanapimwa bagasangwa nta virusi bagifite mu mibiri
  yabo. Abakirwaye bitabwaho byihariye ni 816 mu gihe batanu bitabye Imana.\\nIbimenyetso
  bya Coronavirus birimo inkorora, ibicurane, guhumeka bigoranye n\u2019umuriro. Yandura
  binyuze mu matembabuzi aturuka mu myanya y\u2019ubuhumekero.\\nAbaturarwanda basabwa
  gukomeza kubahiriza amabwiriza ya Leta hitabwa cyane cyane ku gukaraba intoki kenshi
  n\u2019amazi n\u2019isabune, kwambara udupfukamunwa n\u2019amazuru mu gihe umuntu
  avuye mu rugo cyangwa ahuye n\u2019abantu benshi.\\nCoronavirus yagaragaye bwa mbere
  mu Mujyi wa Wuhan mu Bushinwa mu Ukuboza 2019; kuri ubu 15 530 121 bamaze kuyandura
  ku Isi yose, barimo 633 034 yahitanye na 9 446 618 bamaze kuyikira.\\n23.07.20 \u2013
  Covid-19 Amakuru Mashya | Update\\n*Kigali:7 (abapimiwe mu duce turi mu kato/testing
  in areas under lockdown), Rusizi:7, Nyamasheke:7 pic.twitter.com/VDduVtADRz\\n\u2014
  Ministry of Health | Rwanda (@RwandaHealth) July 23, 2020\\nTANGA IGITEKEREZO\\nAMATEGEKO
  AGENGA IYANDIKA RY''IGITEKEREZO CYAWE\\nWitandukira kubijyanye n''iyi nkuru; wikwandika
  ibisebanya, ibyamamaza cyangwa bivangura; wikwandika ibiteye isoni, Wifuza kubona
  byihuse ibivugwa/ibisubizo ku gitekerezo cyawe, andika email yawe ahabugenewe. Ibi
  bidakurikijwe igitekerezo cyanyu gishobora kutagaragara hano cyangwa kigasibwa.\\nIgitekerezo
  cyawe kigaragara nyuma y''isuzuma rikorwa na IGIHE.com , Murakoze!\"", "\"Guverinoma
  y''u Rwanda irizeza Abanyarwanda ko ishyize imbaraga nyinshi mu kubaka ibyumba by''amashuri
  mu rwego rwo gukemura ibibazo birimo ubucucike bw''abana mu mashuri ndetse n''ikibazo
  cy''abagikora ingendo ndende bajya ku ishuri.\\nIbi byatangajwe Minisitiri w''Intebe
  Dr Edouard Ngirente, ubwo kuri uyu wa Gatandatu yari mu Karere ka Nyagatare muri
  gahunda yo gutangiza ku mugaragaro igikorwa cyo kubaka ibyumba by''amashuri bisaga
  ibihumbi 22 bizubakwa hirya no hino mu gihugu.\\nMinisitiri w\u2019Intebe Dr Edouard
  Ngirente ni we watangirije ku mugaragaro iki gikorwa mu Karere ka Nyagatare by\u2019umwihariko
  mu Murenge wa Tabagwe ku ishuri ribanza rya Kabirizi, ariko no mu tundi turere twose
  tw\u2019igihugu iki gikorwa na ho cyatangijwe.\\nIbyumba by\u2019amashuri ibihumbi
  ma kumyabiri na bibiri magana atanu\\nna bitanu (22 505) ni byo bikenewe kugira
  ngo hakemurwe ikibazo by\u2019ubucucike mu\\nmashuri, ndetse n\u2019icya bamwe mu
  bana bagikora ingendo ndende bajya ku kwiga.\\nMinisitiri w\u2019Intebe Dr Edouard
  Ngirente avuga ko Guverinoma y\u2019u Rwanda ishyize imbaraga zidasanzwe mu gukemura
  burundu kandi mu gihe gito ibibazo byose bikibangamiye imyigire y\u2019abana bikagira
  n\u2019igaruka ku ireme ry\u2019uburezi, binyuze mu muvuduko wo kubaka ibi byumba
  by\u2019amashuri ubundi byagombaga gutwara imyaka ibiri.\\nYagize ati \\\"Iyo gahunda
  yo kubaka amashuri icyarimwe kandi menshi, abanza n''ayisumbuye irasubiza ibibazo
  byinshi bishingiye ku ireme ry''uburezi ariko iby''ingenzi navuga ni bitatu: icya
  mbere ni ukugabanya umubare w''abana biga mu ishuri rimwe kugira ngo ishuri ryigemo
  bakeya bashobora kwigishwa mwarimo agashobora kubacunga neza no kubakurikirana.
  Ibyo ari byo twita kugabanya ubucucike mu mashuri. Ikibazo cya kabiri dusubiza ni
  ukugabanya ingendo ndende abana bakora bajya mu mashuri. Icya gatatu ni ukorohereza
  mwarimu wigisha. Nk''uko mubizi, umwarimu wigisha abana 100 mu ishuri rimwe biramugora
  kurusha uwigisha 50 cyangwa 40. Muri iyi gahunda yo kubaka amashuri dutekereza ko
  irangira vuba mu mezi atarenze atatu tkubaka amashuri arenze ibihumbi 10. Guverinoma
  y''u Rwanda yabishyizemo imbaraga nyinshi cyane kandi inzego zose turafatanyije.\\\"\\nAkarere
  ka Nyagatare ni ko Karere kazubakwamo ibyumba by\u2019amashuri byinshi mu gihugu
  hose, aho biteganyijwe ko hazubakwa ibigera ku 1 240. Bishingiye ku miterere yako
  ndetse no kuba ari ko Karere kanini mu Rwanda kandi kanatuwe cyane, ni nako kagaragaramo
  ku buryo bw\u2019umwihariko ibibazo by\u2019ubucucike bw\u2019abanyeshuri ndetse
  n\u2019ikibazo cy\u2019abana bagikora ingendo ndende bajya kwiga.\\nBamwe mu batuye
  aka karere bagaragaza ko bene ibi bibazo bigira ingaruka zikomeye ku myigire y\u2019abana
  babo.\\nKugeza ubu mu Rwanda habarurwa abana barenga miliyoni ebyiri n\u2019igice
  biga mu mashuri abanza, ndetse n\u2019abasaga ibihumbi 600 biga mu mashuri yisumbuye.
  Icyumba kimwe cy\u2019ishuri mu bigera ku bihumbi 22 505 bizubakwa hirya no hino
  mu gihugu cyagenewe intebe 23 kikazigirwamo n\u2019abanyeshuri 46.\\nMuri iyi gahunda
  yo kubaka ibyumba by\u2019amashuri, Guverinoma y\u2019u Rwanda ivuga ko mu gihugu
  hose hazubakwamo amashuri 81 y\u2019imyuga yiyongera ku yari asanzwe, nkuko bikubiye
  muri gahunda ya Guverinoma y\u2019imyaka irindwi.\\nMinisitiri w''Intebe yagize
  ati \\\"Ubu rero muri iyi gahunda yo kubaka amashuri, turubaka amashuri 81 y''imyuga
  yiyongera ku yandi yari asanzwe ku buryo ahantu hari hasanzwe ishuri ryiga imyaka
  12 twongeraho imyuga umwana urangije imyaka 9 akaba yakomereza imyuga aho ngaho
  cyangwa akaba yakwiga ibindi bisanzwe, akaba afite amahitamo.\\\"\\nUretse ibi byumba
  by\u2019amashuri, mu gihugu hose hazanubakwa ubwiherero bugera ku bihumbi 31 932.
  Leta y\u2019u Rwanda ivuga ko hakenewe uruhare rukomeye rw\u2019abaturage n\u2019izindi
  nzego mu kwesa uyu muhigo. Minisiteri y\u2019Uburezi yo ivuga ko ubu bwiyongere
  bw\u2019ibyumba by\u2019amashuri buzatuma n\u2019umubare w\u2019abarimu nawo wiyongera,
  aho kuva mu kwezi kwa Cyenda ubwo amashuri azaba asubukuwe, hazakenerwa abarimu
  abagera ku bihumbi 29 biyongera ku bari basanzwe.\\nValens NIYONKURU\"", "\"Rayon
  Sports yatangiye ibiganiro na rutahizamu w\u2019umuhanga witwa Man-Ykre Dangmo ukinira
  ikipe ya Colombe Sporting Club ibarizwa mu Cyiciro cya Mbere mu gihugu cya Cameroon.\\nUyu
  mukinnyi w\u2019imyaka 23 y\u2019amavuko, yari mu bakinnyi babanzaga mu kibuga mu
  Ikipe y\u2019Igihugu ya Cameroon mu irushanwa rya CHAN 2020 ryabereye muri iki gihugu
  kuva tariki 16 Mutarama kugeza tariki 7 Gashyantare 2021.\\nMan-Ykre Dangmo ukina
  nka rutahizamu wo hagati cyangwa agakina nka rutahizamu wo ku mpande, biravugwa
  ko yatangiye kugirana ibiganiro na Rayon Sports mu mpera z\u2019icyumweru gishize,
  na nubu impande zombi zikaba zitari zumvikana.\\nAmakuru twamenye ni uko uyu mukinnyi
  ari gusaba kugurwa miliyoni 30 z\u2019Amanyarwanda agasinya imyaka ibiri, gusa ikipe
  ya Rayon Sports yo ntabwo yiteguye kurenza miliyoni 15 z\u2019Amanyarwanda.\\nMan-Ykre
  Dangmo Ngnowa Hapmo yavutse tariki 29 Nzeri 1997, asanzwe ari umukinnyi ngenderwaho
  mu ikipe ya Colombe Sporting Club, ndetse akaba ari umukinnyi watangiye gufatisha
  umwanya mu Ikipe y\u2019Igihugu y\u2019abakina imbere mu gihugu.\\nMu gihe bitaba
  bikunze ko Rayon Sports yumvikana n\u2019uyu rutahizamu, yiteguye guhita ishaka
  undi mukinnyi usatira izamu aho Moussa Camara wanyuze muri iyi kipe ariwe uhabwa
  amahirwe, gusa hari n\u2019andi makuru avugwa ko ishobora kuzatizwa ba rutahizamu
  babiri na Raja Athletic Casablanca yo muri Morocco.\"", "\"Muri serivisi iyi banki
  itanga yifashishije ikoranabuhanga usanga ahenshi hakoreshwa imashini izwi nka \u2018POS\u2019
  ifasha umukiliya kwishyura ibicuruzwa mu maguriro atandukanye atiriwe akora ku mafaranga.\\nIyi
  mashini Ecobank irayisanganywe ariko mu rwego rwo kurushaho guha abakiliya bayo
  serivisi nziza ijyanye n\u2019igihe, yahisemo kuyivugurura, iyishyira mu buryo bugezweho
  bwa \u2018Pax Android\u2019.\\nIkoze mu ikoranabuhanga rigezweho rya \u2018touch
  screen\u2019, ndetse ibasha kubika umuriro igihe kirekire.\\nAkarusho kayo ni uko
  ifata internet ya 4G iri ku muvuduko wo hejuru kandi ijyamo sim card ebyiri, iyo
  imwe umuvuduko wayo uri hasi, ihita ifata ifite uri hejuru bitagusabye kujya guhindura
  ibizwi nka \u2018Auto switching.\u2019\\nIyi POS ushobora kuyikoresha nka telefoni
  kuko ifite n\u2019aho wafatira amafoto n\u2019ibindi bigaragara kuri telefoni zigezweho
  birimo \u2018applications\u2019.\\nUmwihariko w\u2019iyi mashini watuma buri muntu
  wese ayitunga ni uko ikora ku makarita yose yaba aya Ecobank cyangwa ay\u2019izindi
  banki.\\nHari abantu bajya bagira impungenge mu gukoresha ikoranabuhanga kuko baba
  batizeye umutekano w\u2019amafaranga yabo, iyi POS nshya ikoze mu buryo umutekano
  wayo uri hejuru kuko iyo ushyizemo umubare w\u2019ibanga ntawe ubasha kuwigana ko
  iyo igikorwa cyarangiye imibare iza ku kirahure irahinduka.\\nKu bacuruzi bakenera
  kubika amakuru y\u2019ibyakozwe, iraborohereza kuko ibasha kuyabika mu gihe cy\u2019amezi
  atanu, bakabasha no kuyareba batagiye kuri banki.\\nKu mucuruzi wifuza kuyitunga
  asabwa kuba afite konti muri Ecobank n\u2019utayifite akagana ishami akayifungurirwa
  ndetse n\u2019icyangombwa cya RDB, ubundi agasaba iyi POS ku ishami rya Ecobank
  rimwegereye akayihabwa ku buntu.\\nUmuyobozi ushinzwe Serivisi zo kwishyura hakoreshejwe
  Ikoranabuhanga muri Ecobank Rwanda Plc, Joselyne Mutesi, yabwiye IGIHE ko iyi POS
  yashyizweho kugira ngo borohereze abakiliya kubona serivisi z\u2019imari bakoresheje
  ikorabuhanga ryizewe.\\nYagize ati \u201cIyi POS yorohereza abakiliya kwishyura
  mu maguriro atandukanye hatabayeho guhererekanya amafaranga, kandi yorohereza n\u2019abacuruzi
  kwishyurwa ku buryo bworoshye kand bwihuse.\\n\u201cIkindi kandi amafaranga yawe
  aba afite umutekano, kuko igihe cyose wishyuwe agera kuri konti yawe bitagusabye
  gutwara amafaranga mu ntoki ndetse no kuba watakaza umwanya uyajyanye kuri banki.\\\"\\nKugeza
  ubu Ecobank ikorera mu bihugu 33 bya Afurika birimo u Rwanda, Uganda, u Burundi,
  Kenya, Tanzania, Guinea-Bissau, Sierra Leone, Liberia, C\u00f4te d\u2019Ivoire,
