sample: '["\"La tri dividoj, Ekstra Furiozeco, Nova lerneja plata akvo freestyle;
  Gor\u011da Stilo, Pli malnova lerneja granda aero movoj & Ondi\u011da rajdarto;
  Kaj Virinoj-a kuris varmojn \u0109iuj mateno. La konkurso estis proksima kaj ago
  plenplenigita. La Ekstra Furiozeco estis plenigita kun imponaj movoj vidita de centoj
  sidita en la stadiono de rokoj \u0109e la \u201cJibe--torium.\u201d La Gor\u011do
  [\u2026]\\nKategorio: Freestyle Furiozeco\\nNord-Ameriko-a superega freestyle evento
  estas revenanta al la Gor\u011do post 5 Jara manko. La freestyle konkurso estos
  kombinita kun Granda Aera konkurso, Mezuris uzanta la plej lastan en 3D movi\u011do
  spuranta teknologion de Xensr. Kaj por \u0109iuj vi sinjorinoj tie, \u0108i tie-a
  \u015danco akiri grandan interkonsenton sur kelkaj nova [\u2026]\\nAfter a 5 year
  hiatus, the Freestyle Frenzy is returning to the Hatchery thanks to the AWT, Xensr,
  and the CGWA. Organizers are looking forward to bringing a big show to the Washington
  side of the Columbia River Gorge. Adding to the excitement of a freestyle contest,
  will be a big air jump off contest. [\u2026]\"", "\"Komunumoj de Marne\\nJen listo
  de la 611 komunumoj de la franca departemento Haute-Marne, la\u016dalfabete. La
  nombro aktualas komenco de 2023, post kiam komence de la jaro la eksaj komunmoj
  Binson-et-Orquigny, Reuil und Villers-sous-Ch\u00e2tillon fuziis al nova unuo C\u0153ur-de-la-Vall\u00e9e
  (en 2007 ankora\u016d estis 619 komunumoj).\\nATENTU: La komunumoj de 1000 a\u016d
  pli da lo\u011dantoj la\u016deble \u0109iuj ricevu artikolon. Por komunumetoj de
  signife malpli ol 1000 lo\u011dantoj tio ne sencas, kaj en la departemento ekzistas
  multaj vila\u011detaj komunumoj kun malpli ol 100 vila\u011danoj (la komunumo Rouvroy-Ripont
  havas 3, tri!). Tial forpreni\u011du la ru\u011daj ligiloj de tiuj ekstreme malgrandaj
  administraj unuoj (ofte sen foto, kutime sen reta ligilo), kiuj probable en la venontaj
  jaroj ankora\u016d transformi\u011dos al iom pli grandaj \\\"novaj komunumoj\\\".\\nSe
  komunumo havas malpli ol 1000 lo\u011dantojn, liste aldoni\u011du la ekzakta nombro
  de lo\u011dantoj la\u016d la stato de 2020 (se artikolo de aparte eta komunumo jam
  fari\u011dis, \u011di kompreneble restos, kaj unuope \u0109iam anka\u016d eblas
  fari pliajn artikolojn - povas esti ke iu konata esperantisto a\u016d mondkonata
  verkisto lo\u011das en vila\u011deto de 20 lo\u011dantoj kaj oni sentas bezonon
  havi tian vila\u011dan artikolon):\\n(CAC) Kunurba komunumo de Ch\u00e2lons-en-Champagne,
  kreita en 2000.\\n(RM) Kunurba komunumo de Reims, kreita en 2004 kaj renomita \\\"Reims
  M\u00e9tropole\\\" en 2006.\"", "\"Enhavtabelo\\n\u011cengis-\u0124ano\\nKiel unu
  viro alti\u011dis de nomada kamparano al gvidanto de la plej granda tera imperio
  en la tuta monda historio? Kiel brutala milit\u0109efo estigis epokon de paco kaj
  komerco inter foraj landoj, efike revigligante la ligon inter E\u016dropo kaj Orienta
  Azio? \u0108i tiu estas la rakonto de \u011cingis-\u0124ano, senkompata konkerinto,
  kiu gvidis hordojn da \u0109evaldorsaj militistoj al batalo por establi la potencan
  Mongolan Imperion. Da\u016dre legu por lerni pli pri liaj Biografio, Konkeroj, kaj
  pli.\\nBiografio de \u011cingis-\u0124ano\\n\u011cingis-\u0124ano (1162-1227) naski\u011dis
  en nomada tribo en nuntempa Mongolio, proksime de la norda limo kun Rusio. La mongola
  socio en kiu \u011cingis-\u0124ano estis naskita estis rajdita kun proksimbatalo
  inter multaj rivalaj klanoj. Por plimalbonigi la aferojn, la tero estis severa kaj
  malvarma, postulante multon da tiuj kiuj volis pluvivi.\\nLa nomo de la \u0124ano:\\nLa
  naski\u011dnomo de \u011cingis-\u0124ano estis Temujin Khan, kun la signifo ''for\u011disto''
  a\u016d ''fero''. Li poste heredus la honoran nomon \\\"Chinggis Khan\\\" (kun la
  signifo \\\"Universala Reganto\\\") post unui\u011do de la plej granda parto de
  Mongolio. Tra arabaj tradukoj kiuj ne posedis \\\"ch\\\" en sia literumo, Chinggis
  transformis kun tempo en Genghis, la nomon kiun la plej multaj homoj uzas hodia\u016d
  por rilati al la viro nomita Temujin. Por la celoj de \u0109i tiu artikolo, li estos
  referita kiel \\\"\u011cengis-\u0124ano\\\".\\nVivkrono de \u011cingis-\u0124ano\\n-\\n1162
  p.K.:\u011cingis-\u0124ano estas naskita en nomada mongola tribo.\\n-\\n1171 p.K.:
  \u011cingis-\u0124ano kaj lia familio estas forlasitaj de sia tribo.\\n-\\n1187
  p.K.: Kolektante malgrandan forton sub li, \u011cingis-\u0124ano savas sian edzinon
  Borte de kaptiteco.\\n-\\n1206 p.K.: \u011cingis-\u0124ano unuigas Mongolion per
  konkero kaj aliancoj.\\n-\\n1214 p.K.: Zhongdu, \u0109efurbo de la Dinastio Jin,
  estas maldungita fare de \u011cingis-\u0124ano.\\n-\\n1219 p.K.: \u011cingis-\u0124ano
  invadas la regnojn de Mezoriento.\\nVidu anka\u016d: Konfuceismo: Kredoj, Valoroj
  & Originoj -\\n1227 p.K.: \u011cingis-\u0124ano mortas post vundi\u011do pro defalado
  de sia \u0109evalo.\\nGengis-\u0124ano Frua Vivo\\n\u011cingis-\u0124ano la\u016ddire
  venis el la utero kun sangokoagula\u0135o en sia dekstra mano, anta\u016dsigno en
  mongola socio. Kiam \u011cingis i\u011dis adoleskanto, lia patro instigis lin geedzi\u011di
  kun knabino de alia tribo nomita Borte. La patro de Genghis estis venenita fare
  de rivala klano kaj la geedzi\u011do estis prokrastita. Sen ilia sa\u011de influa
  patriarko, la familio de \u011cingis-\u0124ano estis forlasita fare de sia tribo
  en 1171 p.K. kaj forlasita por pluvivi sole sur la brutala azia stepo.\\nFig. 1-
  Juna \u011cingis-\u0124ano en kaptiteco.\\nLa filoj de la familio pa\u015dis al
  la mantelo, \u0109iu preta preni gvidadon. Dum disputo kun unu el liaj duonfratoj,
  \u011cingis-\u0124ano pafis kaj mortigis lin per arko kaj sago, malka\u015de asertante
  sian dominecon ene de sia familio. \u011ci estis lia unua el multaj mortigoj.\\nPostmallonga
  okaza\u0135o kie Genghis estis kaptita kaj evitis la clu\u0109es de rivala klano,
  la juna viro estis finfine en stabila pozicio por geedzi\u011di kun Borte, lia fian\u0109ino.
  Borte poste naskus la \u0109efajn kvar filojn de \u011cingis-\u0124ano.\\nMongolia
  vivo skribe:\\nGranda parto de la informoj pri la vivo de \u011cingis-\u0124ano
  devenas de Sekreta Historio de la Mongoloj, kiu estis skribita en la 13-a jarcento
  de nekonata mongolo. a\u016dtoro post la morto de \u011cingis-\u0124ano. Poste,
  \u011di estis konservita kaj tradukita en la \u0109inan fare de la Yuan-dinastio.
  La epopeo malfermi\u011das kun mita raporto pri la origino de \u011cingis-\u0124ano
  sed da\u016dras en bonega detalo kiel raporto pri la vivo de \u011cingis-\u0124ano,
  la mongola vivstilo, kaj gravaj historiaj okaza\u0135oj implikantaj la mongolojn.
  Dum kelkaj historiistoj diskutas \u011dian precizecon, aliaj, kiel ekzemple Ren\u00e9
  Grousset, asertas \u011dian historiecon kaj la\u016ddas la laboron por \u011dia
  valoro en komprenado de mongola kulturo.\\nNe povante preni pa\u016dzon, la edzino
  de \u011cingis-\u0124ano anka\u016d estis kaptita de liaj kontra\u016duloj. Li voja\u011dis
  de tribo al tribo, utiligante la helpon de aliancanoj kaj lokaj \u0109efoj tra diplomatio,
  devigo, kaj forto. \u011cingis-\u0124ano reprenis sian edzinon. Samtempe, la alti\u011danta
  milit\u0109efo komencis realigi siajn kapablojn en gvidado kaj bataltaktikoj. Malgranda
  armeo jam sekvis lin.\\nGengis-\u0124ano Later Life\\nKun multaj triboj jam unuigitaj
  sub li, \u011cingis-\u0124ano da\u016drigisabsorbi aliancanojn kaj rivalojn en Mongolio
  en sian popolon. \u0108iu venko pliigis lian senkompatan reputacion kaj la grandecon
  de lia \u0109evaldorsa armeo. \u011cingis anka\u016d havis lertecon por administrado,
  nomumante gvidantojn en sia armeo per meritokratio , ne genealogia hereda\u0135o,
  kiel estis mongola kutimo. Tra taktika disciplino, politika manipulado, kaj kultura
  toleremo, la tribo de \u011cingis-\u0124ano i\u011dis frakasa sukceso.\\nMeritokratio:\\nSistemo
  de nomumitaj oficialuloj bazita sur ilia merito, a\u016d pruvitaj kapabloj\\nEn
  1206, \u011cingis-\u0124ano konkeris \u0109iujn rivalajn tribojn kaj estis deklarita
  la granda gvidanto de Mongolio . La konkerado tamen ne \u0109esis tie. Dum la venontaj
  du jardekoj, li gvidis \u015dajne nehaltigeblajn atakojn en kompromisojn de Orienta
  E\u016dropo \u011dis \u0108inio. \u0108iu kontra\u016dulo ricevis du opciojn: submeti\u011di
  al la invadaj mongoloj kiel vasalo al nova imperio, a\u016d morti. Malamikoj estis
  severe punitaj kaj aliancanoj bele rekompencitaj de la Granda \u0124ano.\\nFig.
  2- Portretpentra\u0135o de \u011cingis-\u0124ano.\\nPost kiam liaj kontra\u016duloj
  estis konkeritaj, \u011cingis-\u0124ano efektivigis flekseblajn kaj toleremajn politikojn
  kiuj certigis ilian kontenton ene de sia granda imperio, pruvante esti inda reganto
  same kiel militisto. En 1227, \u011cingis-\u0124ano mortis pro vundoj ka\u016dzitaj
  de estado \u0135etita per sia \u0109evalo rajdante por disbati alti\u011dantan reziston
  en Xi Xia.\\nKonkeroj de \u011cingis-\u0124ano\\n\u011cingis-\u0124anokonstruis
  sian imperion per da\u016draj konkeroj kaj politikaj aliancoj dum vivda\u016dro
  de milito. La mapo malsupre montras liajn konkerojn en \u0108inion kaj okcidentajn
  teritoriojn.\\nFig. 3- Mapo de la Invadoj de \u011cingis-\u0124ano.\\nMongolia Unui\u011do\\n\u011cengis-\u0124ano
  pasigis la plimulton de siaj 30-aj jaroj unuigante la malsimilajn mongolajn klanojn
  kaj alportante malgrandajn proksimajn regnojn sub sian pugnon. Batalo post batalo,
  li venkis sian plej grandan mongolan rivalon kaj iaman sangofraton Jamukha, plue
  solidigante sian rajton regi. Post venkado de la rivalaj tataroj, Kereyids, Merkids,
  kaj Naimans anta\u016d 1206, \u011cingis-\u0124ano kreis novajn le\u011dojn kaj
  tradiciojn por kontroli la \u0109irka\u016d unu milionon da homoj sub li.\\nKonkero
  de \u0108inio\\nLa unua celo de la \u0109ina konkero de \u011cingis estis la regno
  de Xi Xia (la sama lando al kiu li rajdis kiam li mortis). Post sukcese sie\u011dado
  de Xi Xia kaj postulado de tributo, \u011cingis atakis la Dinastion Jin de \u0108inio.
  Denove, la malamikoj de la \u0125ano rifuzis submeti\u011di. Anta\u016d 1214, la
  \u0109efurbo Zhongdu (nuntempa Pekino) estis maldungita fare de la mongolaj kavaleriohordoj.
  Multaj miloj estis bu\u0109itaj en la sangaj atakoj de \u011cingis-\u0124ano. Populacioj
  en Xi Xia kaj la Dinastio Jin estis grave reduktitaj dum tiu tempo.\\nSe vi ne estus
  farinta grandajn pekojn, Dio ne estus sendinta sur vin punon kiel mi.\\n-\u011cengis\u0125ano\\nKonkero
  de Centra Azio kaj laMezoriento\\nLa mongoloj rajdis en Kara-Khitan \u0124anlandon
  en Mezazio en 1216, rapide senpovigante sian tre mal\u015datan gvidanton kiu persekutis
  la islaman lo\u011dantaron en sia regno. Konkeri \u0109i tiun regnon malfermis la
  pordegojn al la Proksima Oriento.\\n\u011custe kiom brutalaj estis la mongoloj kiam
  invadis novajn teritoriojn?\\nOni postulis de mongolaj soldatoj liveri dekona\u0135on
  al \u011cingis-\u0124ano; ri\u0109a\u0135oj, virinoj, sed \u0109efe, mortoj. Post
  konkerado de nacio, \u0109iu mongola soldato ofte estis postulata por ekzekuti nekredeblaj
  dudek kvar kaptitajn civitanojn. Prenu, ekzemple, la masivan invadon de \u011cingis-\u0124ano
  al la urbo Urgen\u0109. Se liaj kvindek mil viroj estus postulataj por ekzekuti
  po dudek kvar civitanojn, e\u0109 miliono da homoj povus esti ekstermitaj dum la
  konkero.\\nKomence, \u011cingis-\u0124ano volis establi pacajn komercajn vojojn
  kun la re\u011doj de Mezoriento. Post kiam ili senkapigis liajn ambasadorojn en
  1219 p.K., \u0125ano lan\u0109is invadon de 200,000 rajdantoj en la teron de la
  Khwarazmian Imperio. Uzante brutalajn taktikojn kaj e\u0109 \u0109inajn sie\u011darmilaron,
  \u011cingis-\u0124ano bu\u0109is siajn malamikojn en la Proksima Oriento. Kamparoj,
  konstrua\u0135oj, kaj tutaj populacioj estis senkompate detruitaj.\\nAtingoj de
  \u011cingis-\u0124ano\\n\u011cingis-\u0124ano establis la plej grandan apudan teran
  imperion en la homa historio, etendi\u011dante de la Kaspia Maro \u011dis \u0108inio
  kaj super du kontinentoj. Ofterigardita kiel la plej granda armea komandanto de
  homa historio, \u011cingis-\u0124ano utiligis pafarkistojn sur \u0109evaldorso,
  akutan taktikan adaptadon, timon kaj konstantan premon por sukcesi pri siaj multaj
  sangaj konkeroj.\\nFig. 4- Portempa palaco de \u011cingis-\u0124ano en Hebei, \u0108inio.\\nPost
  komencaj konkeroj, la vivo en la Mongola Imperio estis paca kaj tolerema, ofte rigardata
  kiel la Pax Mongolica de historiistoj. Regnoj estis permesitaj reteni sian lingvon,
  religion, kaj kulturon, kaj komerco prosperis la\u016d la Silka Vojo denove. \u011cingis-\u0124ano
  mem rekomendis por legopovo kaj malpermesis proksimbatalon, \u015dtelon, kaj la
  vendadon de virinoj en la Mongola Imperio.\\nPax Mongolica:\\nPeriodo de paco kaj
  stabileco en E\u016drazio dum la 13-a kaj 14-a jarcentoj, post la komencaj konkeroj
  de la mongoloj.\\nDevenoj de \u011cingis-\u0124ano\\nAnta\u016d lia morto, \u011cingis-\u0124ano
  faris planojn distribui kontrolon de la Mongola Imperio al siaj elstaraj filoj.
  Li dividis siajn terojn inter siaj filoj Jo\u0125i, Tolui, \u0124agataj kaj Ogedei.
  Ogedei i\u011dus la nova Granda \u0124ano \u011dis 1241. Jardekojn poste, la nepo
  de \u011cingis-\u0124ano Kublai Khan gvidus legendajn konkerojn en \u0108inion kaj
  Japanion, faligante la \u0109inan Dinastion Song kaj establante la Yuan-dinastion.
  La posteuloj de la Granda \u0124ano da\u016drigis sian hereda\u0135on de konkero
  kaj e\u016drazia dominado.\\n\u011cengis-\u0124ano - \u015closila\u0135oj\\n- \u011cengis-\u0124anoestis
  senkompata mongola milit\u0109efo kiu sukcese konkeris teron de la Kaspia Maro \u011dis
  \u0108inio.\\n- La taktikoj kaj metodoj de \u011cingis-\u0124ano estis troe brutalaj,
  bu\u0109ante milionojn dum liaj multaj konkeroj.\\n- Post konkeroj, \u011cingis-\u0124ano
  estis sufi\u0109e malsevera pri siaj regatoj. Ili povis plejparte konservi sian
  lingvon, religion, kaj kulturon, kondi\u0109e ke ili ofertis tributon kaj impostojn
  al la Granda \u0124ano.\\n- Komerco prosperis la\u016d la Silka Vojo dum la regado
  de \u011cingis-\u0124ano. Varoj, religioj kaj kulturoj sekure voja\u011dis grandajn
  distancojn tra E\u016drazio.\\n- La filoj de \u011cingis-\u0124ano heredis dividojn
  de lia granda imperio. Elstaraj inter ili estis Ogedei Khan kaj Kublai Khan, kiuj
  da\u016drigis sukcesajn konkerojn por la Mongola Imperio.\\nReferencoj\\n- Figo
  3 Mongola Invada Mapo (//commons.wikimedia.org/wiki/File:Genghis_Khan_empire-en.svg)
  de Bkkbrad (/ /commons.wikimedia.org/wiki/User:Bkkbrad), licencita fare de CC-BY-SA-2.5,2.0,1.0
  (//creativecommons.org/licenses/by-sa/1.0/, //creativecommons.org/licenses /by-sa/2.0/,
  //creativecommons.org/licenses/by-sa/2.5/).\\n- Fig 4 Provizora Palaco de \u011cingis-\u0124ano
  (//commons.wikimedia.org/wiki/File:Gengis_Khan_temporary_palace .JPG) de FangHong
  (//commons.wikimedia.org/wiki/User:Fanghong), licencita de CC-BY-SA-3.0 (//creativecommons.org/licenses/by-sa/3.0/deed.en).\\nOftaj
  Demandoj pri Genghis\u0124ano\\nKial \u011cingis-\u0124ano estas tiel fama?\\n\u011cengis-\u0124ano
  establis la plej grandan teran imperion en la monda historio per brutalaj konkeroj
  kaj relative justa traktado de siaj regatoj. Lia imperio etendi\u011dis de Orienta
  E\u016dropo \u011dis \u0108inio.\\nKiu venkis \u011cingis-\u0124anon?\\n\u011cengis-\u0124ano
  perdis batalojn dum sia potenco, sed neniu malvenko estis fina. Li da\u016drigis
  sukcesajn kampanjojn kontra\u016d eksterlandaj regnoj \u011dis sia hazarda morto
  en 1227.\\nKiuj estas la posteuloj de \u011cingis-\u0124ano?\\n\u011cengis-\u0124ano
  havis milojn da infanoj dum siaj konkeroj. Elstaraj inter liaj infanoj estis Jochi,
  Tolui, Chagatai, kaj Ogedei. Lia nepo, Kublai Khan, anka\u016d estis sukcesa mongola
  milit\u0109efo.\\nKiuj estas la \u0109efaj atingoj de \u011cingis-\u0124ano?\\n\u011cengis-\u0124ano
  establis la plej grandan terbazitan imperion en la homa historio. Li konkeris terojn
  en \u0108inio, Mezazio kaj Mezoriento. Lia granda regno revigligis la Silkvojon
  kaj komercon inter okcidenta kaj orienta E\u016drazio.\\nKiel estis venkita \u011cingis-\u0124ano?\\nVidu
  anka\u016d: Frederick Douglass: Faktoj, Familio, Parolado & Biografio\u011cengis-\u0124ano
  neniam estis finfine venkita en batalo kontra\u016d siaj malamikoj. Li falis de
  sia \u0109evalo en 1227 kaj mortis pro rezultaj vundoj. Liaj filoj heredis lian
  vastan imperion.\"", "\"Enkonduko\\nLa plene a?tomata AC-tensioreguligilo de la
  serio AVR estas nove desegnita produkto bazita sur la serio SVC. Kun bonaj funkcioj,
  kiel tempoprokrasto, trotensio, subtensio ktp., la uzo de relajso-?altilo, elira
  transformilo, rapida respondo kaj malalta energikonsumo povas esti vaste uzata kie
  necesas stabila tensio, kiel en hejmoj, hospitaloj, oficejoj, industriaj a?tomatigoj
  kaj pli.\\nEnkonduko\\nLa servo-speca pendanta a?tomata AC-tensio-stabiligilo de
  la serio TSD estas nova kaj perfekta dezajno bazita sur la produktoj de la serio
  SVC. ?i havas bonegajn funkciojn kiel protekton kontra? supertensio, subtensio,
  ?efan protekton kaj a?tomatan konstantan tensio-?ovon. La pendanta instalado povas
  efike uzi la spacon, glatan aspekton kaj koloron, kaj povas doni al uzantoj senton
  de korpeco. ?i povas esti vaste uzata en la plej multaj situacioj kiel hejmo, hospitalo,
  oficejo kaj kie necesas tensio-stabileco.\\nEnkonduko\\nPlena a?tomata tensioreguligilo
  de la serio SVC konsistas el kontakta a?totransformilo, servomotoro, a?tomata kontrola
  cirkvito ktp. Kiam la tensio a? ?ar?o de la reto ?an?i?as, la a?tomata prova kontrola
  cirkvito sendas signalon al la servomotoro, ?ustigas la pozicion de la memkupliga
  tensioreguligilo por la karbona broso, tiel ke la elira tensio atingas stabilan
  staton.\\n?i tiu produkto havas sendistordan ondformon, fidindan funkciadon, longda?ran
  funkciadon kaj aliajn karakteriza?ojn, kiel ekzemple tempoprokraston, troan tension,
  subtensian protekton. ?i povas esti vaste uzata en elektro, kiu bezonas stabilan
  tension, ?i estas ideala tensio-stabiligita provizo por certigi la normalan funkciadon
  de elektra ekipa?o.\\nLa trifaza AC-tensiostabiligilo SBW estas al?ustigebla a?tomata
  tensiokompensa reguliga aparato. Kiam tensio de la subtena reto ?an?i?as pro la
  influo de la ?ar?a kurento, ?i a?tomate reguligas la eliran tension por certigi
  la normalan funkciadon de la elektraj ekipa?oj. Kompare kun aliaj specoj de tensiostabiligilo,
  ?i tiu serio havas grandan kapaciton, altan efikecon, neniun ondforman misprezenton,
  stabilan tensioreguligon kaj aliajn avanta?ojn. ?i subtenas vastan ?ar?aplikon,
  tujan tro?ar?on kaj kontinuan longda?ran laboron, manan/a?tomatan ?altilon, kaj
  anka? povas provizi a?tomatan protekton kontra? trotensio, manko de fazo, fazordo
  kaj ma?inaj difektoj.\\nKonvene kunmetu kaj fidinde funkciigu (povas esti cifereca
  ekrano / analoga ekrano).\"", "\"MULTAJ, nome maldekstruloj, da\u016dre kredas ke
  oni \u015dan\u011dos la e\u016dron. Ke oni iros de la nuna e\u016dro de malabundo
  al e\u016dro fine renovigota, progresema kaj sociala. Tio ne okazos. Sufi\u0109us
  elvoki la foreston de politika levilo en la nuna e\u016dropa mon-unio.por ekkompreni
  tion. Sed tiu maleblo dedukti\u011das \u0109efe de multe pli forta argumento, kiu
  esprimi\u011das kvaza\u016d silogisme.\\nUnua premiso : la nuna e\u016dro venas
  el konstrua\u0135o, kies efiko, kaj e\u0109 \u011dia intenco, estas, ke \u011di
  donas \u0109ian kontentigon al la kapital-merkatoj kaj ke \u011di organizas ties
  regadon super la e\u016dropaj ekonomiaj politikoj. [1] Kroma premiso : \u0109ia
  projekto de signifohava transformo de la e\u016dro estas per si mem projekto de
  malmuntado de la financmertata potenco kaj de elpelo de la internaciaj investistoj
  el la kampo de konstruado de publikaj politikoj. Do, konkludoj : 1-e, neniam la
  merkatoj lasos trankvile ellabori\u011di, sub siaj okuloj, projekton kies evidenta
  celo estas retiri ilian disciplinigan povon ; 2-e, ekde kiam tia projekto komencus
  akiri e\u0109 se nur malmultan politikan konsiston kaj \u015dancon reali\u011di,
  \u011di stumblus kontra\u016d fortega spekulado kaj kontra\u016d akra merkata krizo,
  kiukiu ne lasus la tempon necesan por por instituciigi alternativan monkonstruon
  kaj kies sola eliro, en la ur\u011do, estus reveni al la naciaj monoj.\\nTiu maldekstro,
  kiu da\u016dre kredas je la \u015dan\u011do, havas do nur la elekton inter la senfina
  senpoveco \u2026 a\u016d la reveno al la nacia mono, kvankam \u011di asertas voli
  eviti tion, ekde kiam kiam \u011dia transformo-projekto de la e\u016dro komencu
  esti konsiderata serioza ! Tamen oni devus ankora\u016d interkonsenti pri kion signifas
  \u0109i tie \u201ela maldekstro\u201d : certe ne la Socialista Partio (PS), kiu
  apena\u016d ankora\u016d rilatas kun la ideo de maldekstro, nek la sendistinga homamaso
  de e\u016dropismo, kiu, silenta a\u016d beata dum du jardekoj, ekmalkovris la makulojn
  de sia kara projekto kaj rimarkas, konsternite, ke \u011di ja povus dispeci\u011di.
  Sed oni ne kompensas en mallonga momento tiom longan periodon de feli\u0109a intelekta
  dormo. Do, la konkuro al la savtabuloj komenci\u011dis kun la malmildo de veki\u011do
  en plena nokto, en miksa\u0135o de paniketo kaj totala senprepariteco.\\nEnvere,
  la magraj ideoj, al kiuj la e\u016dropismo alkro\u0109as siajn lastajn esperojn,
  ne estas pli ol malplenaj vortoj : e\u016drobonds, \u201eekonomia regado\u201d a\u016d,
  ankora\u016d pli bone, \u201edemokratia salto\u201d \u2012 la\u016d la maniero de
  Fran\u00e7ois Hollande kaj Angela Merkel, oni vidas de \u0109i tie la himnon al
  la \u011dojo \u2012, kartonaj solvoj la\u016d la Potemkin-maniero [2], de tiuj,
  kiuj neniam volis sindemandi, tial ver\u015dajne neniam ion ajn komprenos. Eble,
  cetere, temas malpli pri kompreni ol pri koncedi. Fine koncedi la apartecon de la
  e\u016dropa konstruo kiel gigantan operacion de politika tromporabo.\\nSed pri kia
  tromp\u015dtelo temis, precize ? Nek pli nek malpli ol la popola suvereneco. La
  maldekstro de la dekstro, \u011disoste e\u016dropisma, rekoneblas interalie per
  tio ke \u011di havas sangajn orelojn kiam \u011di a\u016ddas la vorton suvereneco,
  kiun \u011di tuj deklasas kiel \u201eismo\u201d : suverenismo. Stranga\u0135o estas,
  ke tiu \u201emaldekstro\u201d e\u0109 ne momenton pensas ke \u201esuvereneco\u201d,
  unue komprenata kiel suvereneco de la popolo, estas nur alia nomo de la demokratio
  mem. \u0108u eblas, ke kiam tiuj uloj diras \u201edemokratio\u201d, havas ion tute
  alian en sia menso ?\\nPer ia senvola konfeso, \u0109iukaze, la rifuzo de la suvereneco
  estas klare la rifuzo de la demokratio en E\u016dropo. \u201eretiri\u011do en nacion\u201d
  estas tiam la vorto kiel birdtimigilo destinita forgesigi tiun etan foreston. Oni
  la\u016dte bruas pri la 25 elcentoj da vo\u0109oj de la Nacia Fronto, sed sen iam
  demandi sin, \u0109u tiu nivelo \u2012 efektive alarmiga ! \u2012 ne havas iun rilaton,
  kaj e\u0109 sufi\u0109e proksiman, kun la detruado de la suvereneco, ne kiel mistika
  ekzalto de la nacio, sed kiel kapablo de la popoloj mastri sian sorton.\\nKio restas
  efektive de tiu kapablo, en konstrua\u0135o kiu konscie decidis per konstitucia
  vojo senefikigi la ekonomiajn politikojn \u2012 bu\u011detajn kaj monajn \u2012
  per tio, ke \u011di submetis ilin al reguloj de a\u016dtomata konduto enskribitaj
  en la traktatoj ? La defendintoj de la \u201ejes\u201d al la E\u016dropa Konstitucia
  Traktato (EKT) de 2005 \u015dajnigis ne vidi, ke la centra argumento de la \u201ene\u201d
  sidis en la parto III, ja akirita jam per la traktatoj de Mastri\u0125to (1992),
  Amsterdamo (1997) kaj Nico (2001), sed kiu ripetis tra \u0109iuj \u0109i konfirmoj
  la propran skandalon de la liberigo de la publikaj politikoj el la centra kriterio
  de demokratio : la postulo de konstantaj kontesteblo kaj inversigeblo.\\n\u0108ar
  jam ekzistas nenio por kontesti, nek e\u0109 por diskuti, kiam oni decidis skribi
  \u0109ion unu fojon por \u0109iuj en nemoveblaj traktatoj. Monpolitiko, mastrumado
  de la bu\u011deta instrumento, nivelo de publika en\u015duldi\u011do, formoj de
  financado de deficitoj : \u0109iuj \u0109i fundamentaj leviloj estis poreterne firme
  fiksitaj. Kiel eblus diskuti pri la dezirata nivelo de inflacio, se tiu estis konfidita
  al sendependa centra banko kaj fortran\u0109ita de \u0109io ? Kiel eblus diskuti
  pri bu\u011deta politiko, se \u011dia struktura bilanco estas anta\u016ddeterminita
  (\u201eora regulo\u201d) kaj \u011dia kuranta bilanco plafonigita ? Kiel decidi
  pri malagnosko de \u015duldo, kiam la \u015dtatoj ne povas plu financi sin alie
  ol sur la kapitalmerkatoj ?\\n\u0108ar ili alportis e\u0109 ne la plej etan respondon
  al tiuj demandoj, a\u016d pli \u011duste pro la implica aprobo, kiun ili donas al
  tiu konstitucio-stato, la malabundaj etaj eltrovoj estas kondamnitaj sisteme maltrafi
  la centran problemon.\\nTiel oni demandas sin, kian sencon povus havi la ideo de
  \u201eekonomia regado\u201d de la e\u016drozono, tiu reklambalono, kiun la Socialista
  Partio flirtigas jam de dudek jaroj, kiam, \u011duste, estas jam nenio por regi,
  \u0109ar la tuta regebla materio estis forrabita de reganta diskuto kaj en\u015dlosita
  en la traktatoj.\\nLa e\u016dro-obligacioj (e\u016drobonds) [vd sube], siavice,
  prezentitaj kiel granda salto anta\u016den pro la financa rafini\u011do \u2012 en
  tio ili cetere kongruas kun la e\u016dropa strategio de \u201ete\u0125nika\u201d
  en\u0109eni\u011do \u2012, havas neniun el la proprecoj, kiujn iliaj konceptintoj
  imagas. Germanio, kiu \u011duas la plej malaltajn interezkvotojn kiam \u011di pruntas
  el la merkatoj, vidas tre bone, kion kostus al \u011di se \u011di farus komunajn
  subskribojn kun la mizeruloj de la Sudo. Eble \u011di akceptus, nome de la \u201eprogresigenda
  e\u016dropa idealo\u201d, kun prezo, kiun \u011di tutcerte postulus, kiel kontra\u016dparton
  por sia enga\u011di\u011do en la financa mutualigo, nome drakonan krompagon en formo
  de superrigardo kaj enmiksi\u011do en la naciajn ekonomiajn politikojn \u2012 precize
  en la sama maniero en kiu \u011di trudis tiujn politikojn, pere de la traktatoj
  kaj la paktoj \u2012 en la momento kiam oni eniros la monan mutuali\u011don.\\nLa
  pasio de la okul-ka\u015diloj\\nTio signifas, ke anstata\u016d e\u0109 nur iomete
  mildigi la politikajn makulojn de la nuna e\u016dropa konstrua\u0135o, la e\u016dro-obligacioj
  male donos al ili \u011dis nun nekonatan profundi\u011don. Kiu povus e\u0109 nur
  por momento imagi, ke Germanio konsentus eniri la me\u0125anismon de financa solidareco
  de mutualigita \u015duldo, do esti a\u016dtomate devigata pagi en kazo de nepagopovo
  de unu el la membroj, sen postuli, per la trukoj de fortigita Komisiono, drastan
  kaj konstantan rajton enrigardi, krome kun proceduro de kuratoreco \u0109e la plej
  eta devoji\u011do de unu el la \u201epartneroj\u201d ? La akrigo de la devigoj al
  a\u016dtomata gvidado, kaj formoj de \u011deneraligita \u201etriopigo\u201d - ekkuratorado
  de la \u015dtatoj fare de la Komisiono, la E\u016dropa Centra Banko (ECB) kaj la
  Internacia Monfonduso (IMF) -, estas la nure atendebla rezulto de la e\u016dro-obligacioj.
  Tio estus precize la profundigo de la politika krizo en kiu E\u016dropo jam estas
  dronanta \u2026\\nEn tiu afero, Germanio estas la origino de la principo de \u011deneraligita
  senposedigo de suvereneco, kiun \u011di konsideras la sola permesebla solvo, se
  temas pri dividi ekonomian sorton, kaj anta\u016d \u0109io monan, kun aliaj \u015dtatoj,
  pri kiuj \u011di opinias, ke ili povas uzi sian suverenecon nur por la pleja malbono.
  Do, \u011denerala senpovigo ! Restas viva nur \u2026 la suvereneco germana, kiu
  estis sen\u015dan\u011de transportita en la e\u016dropajn ekonomiajn kaj monajn
  instituciojn.\\nLa terurkrioj, kiuj respondas al \u0109ia kritiko al Germanio, tiam
  sinsekvas kun tia kli\u015do ke ili fine diras pli pri tiuj, kiuj elkrias ilin ol
  pri la temo mem. Kiel ofte en la inversigitaj formoj de rasismo, kiuj pensas ke
  ili neas sin mem, se ili montras amikecojn tro brue por esti honestaj, povus esti
  ke tiuj, kiuj estas plej turmentataj de la germana demando, estas \u011duste tiuj
  kiuj sponte elkrias sian germanomanion kiel rifuzon de \u0109ia analizo.\\n\u0108e
  egala distanco disde la kontra\u016daj polusoj de filio kaj de fobio, kie oni estas
  tre certa ke nenia sekreta interkonsento povas prosperi, estas la loko por objektiva
  analizo de la strukturaj kompleksoj, de la historiaj hereda\u0135oj kaj de la rilatoj
  de kongrueco a\u016d de malkongrueco, kiuj rezultas el \u011di, kiam temas pri kune
  vivigi malsamajn landojn en grado de integri\u011do iom progresinta. Ekzemple oni
  vere devas \u015dategi okul-ka\u015dilojn por ne vidi, ke Germanio konstruis al
  si kolektivan kredon \u0109irka\u016d la mono, kiu levas \u011din al tiom alta principo,
  ke la plej eta cedo simple maleblas al \u011di. Se \u011di akceptis transiri en
  la e\u016dro-sistemon, \u011di faris tion nur sub la nepra kondi\u0109o ke \u011di
  povu dikti al la e\u016dropa valuto \u011dian institucian ar\u0125itekturon, pa\u016dsitan
  la\u016d \u011dia propra.\\nKe Germanio perdi\u011dis en la (mal\u011dusta) ideo
  ke \u011dia hiperinflacio de 1923 estis la anta\u016d\u0109ambro de la naziismo,
  kvankam la deflacio de 1931 estis tio multe pli ver\u015dajne, nenia argumento helpas
  : \u011di kredas tion, kaj \u011di agas konforme al tiu kredo. Neniu povas ripro\u0109i
  al \u011di ke \u011di havas tre apartan koncepton pri tio, kio mona ordo devas esti,
  kaj ke \u011di rifuzas eniri ordon alian. Sed oni certe povas ripro\u0109i al Berlino
  ke \u011di trudas siajn fiksajn ideojn al \u0109iuj ! Kaj kvankam estas tute allasebla
  lasi Germanion sekvi siajn monajn obsedojn, estas tute same allasebla ne deziri
  sekvi ilin kun \u011di. Precipe kiam tiuj monaj principoj ne ta\u016dgas por la
  ekonomiaj kaj sociaj strukturoj de la ceteraj landoj kaj, kiel oni aktuale vidas,
  kondukas kelkajn el ili en la katastrofon.\\n\u0108ar iuj membro\u015dtatoj bezonas
  devaluton ; iuj, lasi la deficitojn profundi\u011di ; iuj, malagnoski parton de
  sia \u015duldo ; aliaj, inflacion. Kaj \u0109iuj bezonas anta\u016d \u0109io ke
  tiuj aferoj refari\u011du objektoj de ebla demokratia diskuto ! Sed la germanaj
  principoj, enskribitaj en la traktatojn, malpermesas tion \u2026\\nKe oni ne havas
  kialon por esperi la \u201edemokratian salton\u201d proponatan de Hollande kaj Merkel,
  estas certe e\u016dfemismo. La reaktivigo de federisma projekto restas \u0109iukaze
  unu el la plej malklaraj horizontoj, se oni ne diris, en kio \u011di konsistus kaj
  se oni ne faris la klopodon ekzameni \u011diajn kondi\u0109ojn de ebleco. Oni devus
  unue peti la adeptojn de la federisma projekto montri al ni la miraklon kiu igus
  Germanion akcepti ke \u0109iuj \u0109i demandoj ree eniru la rondon de demokratia
  diskutado kaj decidado, kiujn \u011di metode klopodis ekskludi el \u011di ; poste
  demandi ilin, \u0109u ili pensas, ke federismo, al kiu estas da\u016dre konstitucie
  malpermesata debati pri tiuj demandoj, restus la\u016d ili \u201edemokratia salto\u201d.
  [3]\\nPro la plezuro de penso-eksperimento ni tamen koncedu al ili la hipotezon
  de federacia e\u016dropa demokratio tute ekipita, kun e\u016dropa le\u011da povo
  inda je tiu nomo, kompreneble dukamera, dotita je \u0109iuj prerogativoj, elektata
  en universala vo\u0109donado, kiel anka\u016d la e\u016dropa registaro (pri kiu
  oni cetere ne scias la formon, kiun \u011di povus alpreni). La demando, kiun oni
  metus al \u0109iuj, kiuj tiel revas \u201e\u015dan\u011di E\u016dropon por superi
  la krizon\u201d [4] estus tiam la sekva : \u0109u ili imagas, ke Germanio submeti\u011dus
  al la le\u011do de la e\u016dropa plimulto, se hazarde la suverena parlamento decidus
  repreni en sian kompetenton la Centran Bankon, la eblecon de mona financado de la
  \u015dtato a\u016d la senplafonigon de la bu\u011detaj deficitoj ? Por la \u011deneraleco
  de la argumento oni aldonu, ke la respondo \u2012 evidente negativa \u2012 estus
  la sama, espereble !, se tiu sama le\u011do de e\u016dropa plimulto trudus al Francio
  la kompletan privatigon de la sociala sekureco. Kion oni estus a\u016ddinta, se
  Francio trudintus al E\u016dropo sian propran formon de sociala sekureco, kiel Germanio
  trudis sian monan ordon, kaj se, kiel Germanio, farintus el tio ultimaton ? \u2026\\nDo,
  necesas ke la in\u011denieroj de federismo fine perceptu, ke la formalaj institucioj
  de la demokratio neniel konformas al la koncepto, kaj ke ne ekzistas demokratio
  vivanta, nek ebla, sen fono de kolektivaj sentoj, kiu sole kapablas konsentigi la
  malplimultojn al la le\u011do de la plimulto. Sed \u011duste tio apartenas al la
  speco de aferoj, kiujn la altaj funkciuloj \u2012 a\u016d la ekonomikistoj \u2012
  sen ajna politika kulturo, kaj kiuj konsistigas tamen la esencan parton de la nacia
  a\u016d e\u016dropa politika personaro, ne kapablas vidi. Tiu intelekta nesufi\u0109o
  provizas al ni regule tiajn instituciajn monstrojn, kiuj scias nenion pri la principo
  de suvereneco, kaj la \u201edemokratia salto\u201d anonci\u011das jam tute senscia
  pri la pasiecaj kondi\u0109oj de la demokratio kaj pri la malfacilo plenumi ilin
  en plurnacia kadro.\\nMemorante, ke la reveno al la naciaj monoj plenumas ilin \u0109iujn
  kaj estas te\u0125nike praktikebla, kondi\u0109e, ke \u011di estas akompanata de
  la ta\u016dgaj flankaj disponoj (aparte regado de kapital-movoj [5]), oni povas
  ne tute forlasi la ideon fari ion en E\u016dropo. Ne unuecan monon, \u0109ar tiu
  postulus a\u016dtentikan politikan konstruon, kiu estas en la momento ne atingebla.
  Komuna mono, male, tio estas esplorenda ! Des pli ke la bonaj argumentoj de formo
  de e\u016dropigo restas, kompreneble sub la rezervo ke la maloportuna\u0135oj ne
  estu pli grandaj ol la avanta\u011doj \u2026 Nu, tiu bilanco fari\u011das favora
  se, anstata\u016d pri unusola mono, oni pensas pri mono komuna, tio estas e\u016dro
  dotita de naciaj reprezentantoj : e\u016dro-frankoj, e\u016dro-pesetoj ktp. Tiuj
  naciaj nomoj de la e\u016dro ne estas rekte inter\u015dan\u011deblaj ekstere (en
  dolarojn, en juanojn ktp), nek inter si. \u0108iuj inter\u015dan\u011doj internaj
  kaj eksteraj okazas tra nova E\u016dropa Centra Banko, kiu laboras kiel ia \u015dan\u011doficejo
  (vidu \u201eInterna kaj ekstera inter\u015dan\u011debloj en komunan monon\u201d),
  sed \u011di estos sen ajna povo de mona politiko. Tiu estos redonota al naciaj centraj
  bankoj, pri kiuj la registaroj ju\u011dos, \u0109u ili volas ree ekregi a\u016d
  ne.\\nLa ekstera inter\u015dan\u011deblo, rezervita al la e\u016dro, [6] okazas
  klasike sur la merkatoj de internacia inter\u015dan\u011do, do je fluktuantaj kvotoj,
  sed tra la E\u016dropa Centra Banko (ECB), kiu estas la sola intervenanto por la
  e\u016dropaj agantoj (publikaj kaj privataj). Male, la inter\u015dan\u011deblo interna,
  tiu de la naciaj reprezentantoj de la e\u016dro inter si, okazas nur \u0109e la
  gi\u0109eto de la ECB kaj je \u015dan\u011dkvotoj fiksaj, deciditaj politike.\\nRehavo
  de la primona suvereneco\\nJen ni estos do liberigitaj je la merkatoj de intere\u016dropa
  mon\u015dan\u011do, kiu estis la origino de periodaj monkrizoj en la epoko de la
  E\u016dropa Monsistemo [7] kaj protektataj kontra\u016d la merkatoj de ekstere\u016dropaj
  \u015dan\u011doj per la intera rolo de la nova e\u016dro. Tiu duobla eco estas la
  forto de la komuna mono.\\n\u0108ar la fantasmo de \u201ea\u016dtomata\u201d konver\u011do
  de la e\u016dropaj ekonomioj nun forvapori\u011dis, ni scias, ke iuj ekonomioj bezonas
  devaluti \u2012 des pli en la nuna krizo ! Nu, la ebleco de interna konverteblo
  de la komuna mono havas la grandegan virton ke \u011di denove ebligas tiujn devalutojn,
  sed en kalma etoso. La sperto de la 1980-aj kaj 1990-aj jaroj sufi\u0109e montris
  la maleblon de ordonitaj \u015dan\u011d-al\u011dustadoj sub la senkateni\u011do
  de komplete liberaligitaj financmerkatoj. La interna kalmo de e\u016dropa monzono
  seni\u011dinta je la plago de la \u015dan\u011dmerkatoj transdonas nun la devalutojn
  al procezoj tute politikaj, kie la inter\u015dtata intertraktado havas la taskon
  interkonsenti pri nova skalo de egalvaloro.\\nKaj ne nur la devalutoj ! \u0108ar
  la tuta\u0135o konfigureblus la\u016d la International Clearing Union proponita
  de Kejnzo [8] en la jaro 1944, kiu, krom la eblecon devaluti donitan al la landoj
  kun fortaj eksteraj malekvilibroj, planis anka\u016d trudi revaluton al la landoj
  kun fortaj plusoj. En tia sistemo, kiu trudas la\u016dgradajn retaksadojn tra serio
  de pluso-sojloj (ekzemple je 4 elcentoj de la malneta enlanda produkto, poste 6
  elcentoj), Germanio devintus de longa tempo akcepti altigon de sia e\u016dro-marko,
  kaj per tio subteni la postulon en la e\u016drozono, do partopreni en la reduktado
  de \u011diaj internaj malekvilibroj. Tiamaniere reguloj de \u015dan\u011d-al\u011dustigoj
  anstata\u016das en la intertraktado la anta\u016dvideblan malbonan volon de la kroma\u0135-landoj
  \u2026\\nLa novliberala kate\u0125ismo hurlas \u201eneefikeco\u201d kaj \u201einflacio\u201d
  ekde kiam \u011di a\u016ddas la vorton \u201edevaluto\u201d. Koncerne la neefikecon
  ni diru, ke la logiko ne estas \u011dia forta flanko. \u0108ar la devaluto estas
  \u011duste tio, kion \u011di mem postulas ! Kun la nuanco, ke \u011di pledas por
  la devaluto interna, pere de la salajroj \u2012 kaj per la senlaboreco, kiu premas
  sur la salajrojn ! \u2012, anstata\u016d la devaluto ekstera, tiu de la \u015dan\u011dokvotoj.
  Do struktura al\u011dustigo anstata\u016d al\u011dustigo per la \u015dan\u011dokvotoj
  \u2026 Se ili elirus el la e\u016dro por resti solaj kun sia propra mono, la germanoj
  rapide rimarkus tion, \u0109ar ili vidus, ke en du tagoj da revaluto de la nova
  germana marko nuli\u011dus jardeko da salajra striktado \u2026\\nKoncerne la inflacion,
  kiu postulus preferi la unuan al\u011dustigon al la dua, \u011di estas ektoplasmo
  en periodo kiu estas pli minacata de deflacio (malalti\u011do de la \u011denerala
  preznivelo), almena\u016d same dan\u011dera, kaj kiu fakte postulus kontrolatan
  inflacion, e\u0109 se nur por mildigi la realan pezon de la \u015duldo.\\nSed \u0109u
  tiu efiko de reala mildigo ne estus dominata de la valoralti\u011do de nia ekstera
  \u015duldo pro la devaluto mem ? Devaluti je 10 elcentoj kontra\u016d la dolaro,
  tio estas, me\u0125anike, pligrandigi je 10 elcentoj nian \u015duldon esprimitan
  en dolaroj. Tamen, kiel montris Jacques Sapir, [9] 85 elcentoj de la franca \u015duldo
  estas kontraktitaj la\u016d la franca juro kaj estos pagendaj en e\u016dro-frankoj,
  do sen ajna efiko sekve al devaluto. La celo de komuna mono estas \u0109iukaze multe
  pli vasta ol nur la restarigo de la eblecoj de devaluto, pri kiu eblas samtempe
  diri ke \u011di estas, speciale en la aktuala periodo, vivnecesa grado de libereco,
  sed certe ne la universala solvo. Eliri el la nuna e\u016dro estas multe malpli
  afero de makroekonomio \u2012 \u011di estas tutcerte tia ! \u2012 ol de konformi\u011do
  al la nepra imperativo de demokratio, kiu nomi\u011das \u201epopola suvereneco\u201d.\\nDum
  la pasiecaj kondi\u0109oj de ebleco de tiu popola suvereneco je supernacia nivelo
  estas ankora\u016d malproksimaj, tiam la realismo ordonas plimodestigi la pretendojn
  de la \u201ee\u016dropa ambicio\u201d ; tio ne signifas forlasi \u011din tute. \u011ci
  devus ekzemple esti kiom eble plej vigle da\u016drigata en \u0109iuj kampoj aliaj
  ol ekonomiaj \u2012 tio estu dirita kontra\u016d la ripro\u0109oj de \u201eretiri\u011do
  en la nacion\u201d. Koncerne la pure ekonomian ambicion, necesas anka\u016d scii,
  kun kiu oni sekvas \u011din. Certe ne dudekokope a\u016d deksepope, grandaj nombroj
  \u015dajne faritaj nur por garantii la plej grandan malbonon ! Decidaj estas la
  objektivaj rilatoj de kongrueco, kiuj anta\u016dkondi\u0109as minimuman homogenecon
  de la vivoformoj \u2012 samaj ideoj, a\u016d ideoj proksimaj, pri la socia modelo,
  pri la zorgo pri la medio, ktp \u2012, kaj anta\u016da interkonsento pri la grandaj
  principoj de ekonomia politiko. Tiujn kohera\u0135ojn ver\u015dajne, por komenci,
  povas atingi nur malgranda nombro de \u015dtatoj. Kaj ne estas mal\u011duste, ke
  ili povas kelkfoje aprezi sin reciproke surbaze de konver\u011daj indikiloj \u2026
  sed ne de tiuj de la mastri\u0125ta traktato.\\nSe necesas ekzemple starigi grandan
  merkaton kiel bazon por la komuna mono, oni devus en \u011din enigi nur ekonomiojn
  kiuj havas similajn sociproduktajn modelojn kaj, la\u016d tio, najbarajn kostostrukturojn.
  Do, en tiun novan ekonomian kaj monan E\u016dropon allaseblus nur landoj, kies meza
  a\u016d minimuma salajro ne estus malpli alta ol 75 elcentoj \u2012 a\u016d ia ajn
  alia determinenda sojlo \u2012 de la mezumo de la mezaj a\u016d minimumaj salajroj
  de la ceteraj membro\u015dtatoj. Kaj tiu kompleta e\u016dropo-rekonstruado estus
  okazo por forlasi samtempe de la mona kaj financa ortodokseco, de la \u011deneraligita
  sktruktura al\u011dustigo, kaj la malutilojn de la \u00ab nedistordita \u00bb konkurenco,
  kiu mem tiel bone akordi\u011das kun \u0109iuj strukturaj, sociaj kaj mediaj distordoj,
  kaj kiu reale intencas funkciigi ilin kun la plej granda perforto.\\n\u011custe
  \u0109i tie ni revenas al la silogismo de la komenco : la ideo iri de la nuna e\u016dro
  al nova kaj progresema e\u016dro estas malplena revo. La\u016d sia konstruo, se
  \u011di estas progresema, la financmerkatoj, kiuj havas aktuale \u0109iun povon,
  ne lasos \u011din alveni. La alternativo estas do la sekva : a\u016d la definitiva
  en\u015dlimi\u011do en liberalan e\u016dron mar\u011dene modifitan de duaklasaj
  trova\u0135oj ; a\u016d fronta kolizio kun la financo, kiu tutcerte venkos \u2026
  kaj \u011duste per tio perdos \u0109ion, \u0109ar \u011dia \u201evenko\u201d detruos
  la e\u016dron kaj kreos precize la kondi\u0109ojn de rekonstruado, kie la merkatoj,
  \u0109i-foje, estos ekskluditaj !\\nTamen estas tute certe, ke tiu deviga reveno
  al la naciaj monoj, kiu sonas kiel fiasko, havos deprimajn politikajn efikojn, kiuj
  por certa momento pezos sur \u0109ia projekto de e\u016dropa relan\u0109o. Pro tio,
  se \u0109iaj aliaj aferoj restas sen\u015dan\u011daj, la ver\u015dajneco de tia
  relan\u0109o, \u0109e normala templimo, dependos esence de la maniero la\u016d kiu
  oni eliras el la e\u016dro. Meti e\u016dropan politikan energion en rezervon por
  trairi la periodon de la naciaj monoj implicas do decidi \u201efali sur la komunan
  monon\u201d, t.e. provoki la deflagron de la merkatoj per anoncado de tiu projekto,
  firme metante \u011din kiel politikan projekton de kelkaj e\u016dropaj landoj, anstata\u016d
  doni al tiu alfronti\u011do nur la sensekvan rezulton de naciaj monoj. Do, se oni
  ne evitas la revenon al la naciaj monoj, la maniero tien reveni determinas la eblon
  ree ekiri de tie !\\n\u0108iukaze, se oni ne volas la grandan definitivan anestezon
  de la kontra\u016dsociala e\u016dro, oni revenos tien. Jen la puno por konstrua\u0135o
  nekapabla evolui, \u0109ar \u011di senigis al si mem \u0109ian gradon de libereco.
  La ultrarigidaj konstrua\u0135oj povas nur rezisti, tiom longe kiom ili ne devas
  alfronti tro grandajn eksterajn koliziojn, a\u016d rompi\u011di ; sed ne al\u011dusti\u011di.\\nAtaki
  la koron de la konstrua\u0135o\\nLa e\u016dropistoj protestos dirante ke ilia amata
  E\u016dropo, male, ne \u0109esas progresi. La E\u016dropa Fonduso de Financa Stabileco
  (EFFS), la e\u016dropa me\u0125anismo de stabileco (EMS), a\u0109eto de \u015dtata
  \u015duldo fare de la ECB [10], banka unio : tiom da avancoj certe iom dolore akiritaj,
  sed ja realaj ! Malfeli\u0109e, kaj sen surprizo, neniu el ili atakas la koron mem
  de la konstrua\u0135o, tiu malmola kerno, el kiu venas \u0109iuj depresiaj kaj kontra\u016ddemokratiaj
  efikoj : elmeto de la ekonomiaj politikoj al la financmerkatoj, sendependa centra
  banko, kontra\u016dinflacia obsedo, a\u016dtomata al\u011dustigo de la deficitoj,
  rifuzo konsideri ilian financadon per monkreado. Pro tio, la \u201eavancoj\u201d
  restas periferiaj, flika\u0135oj por al\u011dustigi, tiel kiel ili povas, la katastrofajn
  sekvojn, kiujn la \u201ekoro\u201d, granita kaj sanktigita, ne \u0109esas produkti.
  Flikante la efikojn kaj neniam volante ataki la ka\u016dzojn, E\u016dropo do persistas.
  Nekapabla je la plej eta baza revizio, kaj nekonscia pri la fakto, ke la rompo estas
  la sola destino kiun \u011di donas al si.\\nFr\u00e9d\u00e9ric LORDON.\"", "\"Ami\u015do
  (angle Amish) estas la nomo de anabaptista (protestanta) kaj menonitdevena, kristana
  komunumo vivanta en Nordameriko. La anoj de la grupo estas samenomataj kiel la grupo.
  \u011ciaj setlejoj estas disaj en 22 \u015dtatoj de Usono kaj en la provinco Ontario
  en Kanado. La membroj de la Ami\u015do-komunumo estas konataj kiel homoj kiuj konservas
  simplan vivstilon, tradician vesta\u0135on kaj evitas uzi modernan teknologion.\\nLa
  origino de la Ami\u015do estas en Svislando kaj Germanio. \u011cis la 17-a jarcento,
  la ami\u015doj estis parto de la menonitoj. La membroj de la komunumo estis diskriminaciitaj
  kaj persekutitaj fare de kaj la religia establado kaj la politika establado en Svislando
  kaj Germanio. Multaj unue enmigris al Alzaco kaj Palatinato, kie ekzistis malpli
  severa diskriminacio, kaj tiam dum la 18-a jarcento ili plejparte enmigris al Usono.
  La enmigrintoj eklo\u011dis en la \u015dtato de Pensilvanio, de kie ili poste disvasti\u011dis
  al aliaj landoj en Nordameriko.\\nLa principoj de la Ami\u015doj estas bazitaj sur
  apartigo de la mondo kaj \u011diaj tradicioj kaj enfermi\u011do en la komunumo kaj
  familio, \u011dis la punkto de bojkoto kaj ekskomuniki familianojn kiuj ne sekvas
  la vivstilon. \u011ciaj membroj vivas en fermitaj, plejparte agrikulturaj komunumoj.
  Malgra\u016d \u0109io \u0109i, la Ami\u015doj kredas je la devo elekti religion
  libervole. Komunumaj membroj, atinginte la a\u011don de plenkresko, estas postulataj
  por akcepti la religian enga\u011di\u011don pro elekto post periodo, kio estas speco
  de rito de transigo (nomita Rumspringa). Dum tiu \u0109i periodo \u2013 kiu da\u016dras
  plurajn monatojn a\u016d pli \u2013 la junulo, kiu atingas plenkreskon , liberi\u011das
  de la le\u011doj de la socio kaj de la eklezio \u011dis tiam li fine akceptas la
  religiajn devontigojn kaj refoje bapti\u011das. Ami\u015doj rekomendas modestan
  vivstilon kaj \u011denerale evitas uzi modernan teknologion. En transporto, ili
  da\u016dre uzas \u0109eval-tirantan \u0109aron anstata\u016de de a\u016dtoj. La
  viroj kreskigas barbon sed razas siajn lipharojn. Kiel parto de la principo de modesteco,
  la virinoj ne portas juvelojn.\\nE\u0109 en Usono, kiel rezulto de ilia kredo je
  dia regado sole, kaj tial ilia manko de fido al la \u015dtato kaj \u011diaj institucioj,
  ili sindetenas de partoprenado en nacia a\u016d \u015dtata politika agado a\u016d
  vo\u0109donado en baloto, kaj pro pacifistaj kialoj ne ali\u011das al la sekurecaj
  ta\u0109mentoj. En la prezidant-baloto de 2020, la komunumestroj anoncis, ke unufoje
  por \u0109iam, ili partoprenos en la baloto favore al la kandidato Donald Trump,
  \u0109ar li promociis la konservativan ideologion en Usono dum \u0109iuj jaroj de
  sia prezidanteco.. Taksoj de 2017 taksas ke ekzistas nuntempe 318,000 Ami\u015doj.\\nFruaj
  ami\u015daj kutimoj[redakti | redakti fonton]\\nKaj ami\u015doj kaj menonitoj estas
  pacistoj. Ami\u015doj frue diferenci\u011dis el la menonitoj en tio, ke la ami\u015doj
  malpermesis la portadon de vesta\u0135oj kun butonoj, dum la menonitoj permesis
  ilian portadon. Por la ami\u015do, la butono estis simbolo de la armeo, \u0109ar
  tiuepoke estis la armeanoj, kiuj unue portis butonojn. Ankora\u016d hodia\u016d,
  la ami\u015doj ne portas eksterajn jakojn kun butonoj.\\nAlia frua kutimo, kiu apartigis
  la ami\u015dojn el la menonitoj (kaj la unua kialo por la disi\u011do de 1693) estis
  la insisto de la ami\u015doj aserti la eviton (izoladon) de membroj, kiuj elektis
  forlasi la sekton. La ami\u015doj favoris striktan praktikadon de la evito de \u0109i
  tiuj eks-membroj. La menonitoj, tamen, ne strikte devigis al \u0109i tiun praktiko.\\nAlia
  kutimo plu estas la izolado de la komunumo de la ekstera mondo, kiel sekurigo por
  la fido kaj \u011dia vivstilo, kaj kontra\u016d la malbonoj de la moderna mondo.\\nHistorio[redakti
  | redakti fonton]\\nLa ami\u015doj estas la idoj de svisaj anabaptistoj, kies origino
  dati\u011das de 1525, unu jaron post la komenco de la ribelo de germanaj kamparanoj.
  Tio estis kamparanribelo, en kiu Marteno Lutero subtenis la nobelulojn kontra\u016d
  la kamparanoj. Rezulte, la socio estis preta por \\\"dua reformacio\\\". La anabaptismo
  unue naski\u011dis en Zuriko, Svislando, kaj poste \u011di disvasti\u011dis \u011dis
  Nederlando. Kontra\u016de al kelkaj anabaptistaj grupoj pli nordaj (ekzemple tiuj
  en Munstero), la svisaj anabaptistoj estis ekde la komenco pacifistaj (vidu la konfesion
  de Schleitheim). Pro siaj kredoj je senperforto kaj rebaptado, la svisaj anabaptistoj
  treege suferis la persekutojn de la lokaj a\u016dtoritatoj. La persekutado venis
  same el la protestantoj, kiel el la katolikoj.\\nFine de la 17-a jarcento, la anabaptistoj,
  kiuj dume nomis sin Menonitoj la\u016d la nederlanda anabaptista gvidanto Menno
  Simons, komencis fu\u011di el Svislando amase. Ili trovis rifu\u011dejon en la Palatinato
  kaj en Alzaco. Estas tie en Alzaco, kie la ami\u015doj disi\u011dis de la menonitoj.\\nLa
  ami\u015da divido estis gvidita de Jakob Ammann. La ami\u015doj aparti\u011dis el
  la menonitoj en 1693 en Alzaco. Le disi\u011do vidis Jakob Ammann prediki novan
  reiron al pli rigora kaj ne-mondema vivstilo. La plejmulto el la menonitoj, kiuj
  elektis sekvi Jakob Ammann, estis svisaj menonitaj rifu\u011dintoj en Alzaco. Kelkaj
  menonitoj en Svislando kaj en Palatinato elektis anka\u016d sekvi Jakob Ammann,
  sed tie ili reprezentis minoritaton el la menonitoj.\\nDum en Alzaco kaj en Palatinato
  ekzistis pli da tolero por la svisaj anabaptistoj ol en ilia hejmlando Svislando,
  \u0109i tiuj teritorioj estis jam ne pacaj. Fakte, Alzaco kaj la Palatinato, kun
  ilia situo en la koro de E\u016dropo esti\u011dis la bastiono por multaj el la militoj
  de la 17-a jarcento. Post jardekoj de milito la ami\u015doj, la menonitoj kaj iliaj
  najbaroj estis pretaj forlasi la teritorion kaj sin turni al Ameriko. \u0108ar dum
  la jaroj de milito la rikoltoj estis bruligitaj kaj la malsatego ka\u016dzis e\u0109
  kanibalismon inter la kamparanoj.\"", "\"unue, Vigorun sendrata ra\u016dpo trun\u0109ilo
  signife plibonigas laborefikecon. Kompare kun la tradicia mana malherba metodo,
  la teleregata trudherbo kapablas rapide kaj precize kompletigi la sarkigon de grandaj
  areoj, kio multe reduktas la sekvaron. \u011cia efika klingoteknologio kaj potenca
  potenca sistemo igas la sarkigan procezon pli rapida kaj pli \u011disfunda.\\nAlirebla
  Vigorun sendrata ra\u016dpo herba tran\u0109ilo \u0108ina Fabrikisto Kun Plej Bona
  Prezo Interrete Por Vendo\\nDue, la Vigorun sendrata ra\u016dpo trun\u0109ilo havas
  bonegan adapteblecon. \u0108u \u011di estas plata herbejo, ruli\u011danta montoflanko
  a\u016d kompleksa hortikultura medio, la Remote Control Weeder povas trakti \u011din
  facile. \u011cia fleksebla manovra sistemo kaj forta obstaklo-transpaso igas \u011din
  kapabla labori stabile en diversaj terenoj kaj medioj.\\n- r/c gazontondilo kun
  ne\u011dplugilo ne\u011dklingo ne\u011d\u015dovelilo ne\u011dforiga ma\u015dino\\n-
  plej bona prezo \u0108inio senpilota foriga roboto por vendo\\n- senpilota robota
  ne\u011da puriga ma\u015dino por vendo de \u0109ina fabrikanto-fabriko\\n- fabriko
  rekta vendo malalta prezo a\u0109etu interretan sendratan ne\u011dforigan roboton\\n-
  Vigorun sendrata ra\u016dpo herba tran\u0109ilo por vendo\\nAliflanke, la Vigorun
  sendrata ra\u016dpo trun\u0109ilo estas tre oportuna por funkcii. Uzantoj povas
  facile kontroli la veturdirekton, rapidecon kaj fal\u0109an altecon de la ma\u015dino
  per la teleregilo, sen neceso rekte tu\u015di la ma\u015dinon a\u016d efektivigi
  tedan manan operacion. \u0108i tiu teleregilo ne nur reduktas laborintensecon, sed
  anka\u016d plibonigas funkcian sekurecon.\\nKrome, la Vigorun sendrata ra\u016dpo
  trun\u0109ilo anka\u016d havas la avanta\u011don de media protekto kaj energi\u015dparo.
  \u011ci uzas altnivelan elektran teknologion a\u016d hibridan sistemon, kiu havas
  pli malaltan energikonsumon kaj emisiojn kompare kun tradiciaj fuelherbhakistoj.
  \u0108i tio ne nur helpas redukti energikonsumon, sed anka\u016d plenumas la mediprotektan
  koncepton de moderna socio.\\nLaste sed ne malpli, la Vigorun sendrata ra\u016dpo
  trun\u0109ilo anka\u016d havas lar\u011dan gamon de aplikoj. \u0108u en hejmaj \u011dardenoj,
  parkoj kaj verdaj spacoj, a\u016d grandaj kamparoj kaj fruktoplantejoj, teleregitaj
  sarkiloj kapablas elfari bonegajn sarkigajn efikojn. \u011ciaj efikaj, oportunaj
  kaj sekuraj trajtoj igas \u011din grava ilo en moderna \u011dardenado kaj agrikulturo.
  Ni ser\u0109as agentojn, distribuistojn kaj komercistojn de teleregla gazontondilo
  tra la tuta mondo. Se vi havas pliajn demandojn a\u016d bezonas helpon, bonvolu
  ne hezitu kontakti nin.\"", "\"La 30-an de oktobro estas la datreveno de la morto
  (en 1956) de la hispana verkisto la\u016d malproksima itala deveno P\u00edo Baroja
  y Nessi (1872-1956) it.wikipedia.org/wiki/P%C3%ADo_Baroja eo.wikipedia.org/wiki/P%C3%ADo_Baroja
  konata precipe pro la verko \u201cEl \u00e1rbol de la ciencia\u201d (La arbo de
  la sciado). Tre kompleksa personeco, ema al skeptikismo kaj pesimismo, Baroja, kvankam
  naski\u011dinta kaj parte\u2026 Legu plu P\u00edo Baroja\\nLa 24-an de a\u016dgusto
  estas la datreveno de la naski\u011do (en 1899) de la argentina verkisto kaj poeto
  Jorge Francisco Isidoro Luis Borges Acevedo, konata kiel Jorge Luis Borges (1899-1986)
  it.wikipedia.org/wiki/Jorge_Luis_Borges eo.wikipedia.org/wiki/Jorge_Luis_Borges
  fama precipe pro siaj fantastaj rakontoj, tiom ke per la adjektivo \u00abborgeseca\u00bb
  oni difinas koncepton pri la vivo kiel fikcia realo \u015dajnigata vera.\u2026 Legu
  plu Jorge Luis Borges\"", "\"Vi eble #a?di tre pri la #man?a?o kiu efektive estas
  nutraj dinamoj kaj provizi vin kun #?iuj specoj de nutrado kiu estas postulita por
  vi. ?i #anka? helpas fari viajn ostojn forta kaj teni vin for de kelkaj de la kronikaj
  malsanoj. Sed vi estos surprizita scii pri la fakto ke la novaj studoj trovis ke
  estas kelkaj mirindaj #man?a?o kiu efektive povas helpi vin akiri sveltan.\\n#?I
  tie estas la mirinda listo de 12 Ekstraj #man?a?o akiri pli sveltan korpon:\\nNigraj
  faboj :Nigraj faboj povas provizi vin proksimume 15 Gramoj de proteino. La alia
  afero kiu estas tiel bona pri nigraj faboj estas ke ?i doesn?? Donas vin ajna nedezirata
  saturita grason, Kiu estas donaco en abunda kvanto en aliaj proteinaj fontoj kiel
  #ru?a viando.\\nAvenoj :Avenoj konsistas de fibro, which can keep you active throughout
  the day. By taking only half a cup, Vi estas prenanta proksimume 4.6 Gramoj de hardita
  amelo, Kiu ne nur akcelas vian metabolon sed #anka? brulas dikan.\\nBlueberries\\nKvankam
  ?i provizas vin 80 Kalorioj, ?i #anka? donas vin 4 Gramoj de amelo, Kiu faras #?i
  tiu apartan produkton tre kalkuli amikan. Blueberries estas #anka? sciita por ilia
  anti-#maljuni?i #nemovebla?o.\\nBrokolo:Brokolo povas plenigi vin supre kun fibroj
  de donanta vin nur 30 Kalorioj. Brokolo povas esti prenita #amba? kuirita kaj kruda
  kaj ?i estas #anka? tre helpema en malhelpo de kancero.\\nBruna rizo:Bruna rizo
  estas granda alternativo #anstata? blanka rizo. Denove duona taso de bruna rizo
  donos vin 1.7 Gramoj de hardita amelo,Kiu kiel menciita #anta?e, Helpoj en la metabolo
  kaj la brulvundo de graso. Alia #avanta?o de bruna rizo estas ke kvankam ?i plenigas
  supre vian stomakon, ?i provizas vin kun malalta kalorio kiu estas tre bona por
  via cifero.\\nGrapfruktoj:#Tio ?i estas unu el la plej bonegaj produktoj por via
  peza perdo. Se vi #man?i grapfruktojn #tuj anta? #man?o por semajno, Vi havas bonan
  #?anco perdi pri funto de via pezo. #Konstrua?aro kiu estas donaco en la grapfruktoj
  povas malaltigi la nivelon de insulino kiu estas dika entenanta hormono, thus resulting
  in weight loss. It consists of 90 Procento de akvo,Kiu povas helpi plenigi supre
  vian stomakon facile. #?I tiu estas #anka? tre bona fonto de proteino.\\nRenaj faboj\\nrenaj
  faboj #a? la #ru?a faboj povas proponi vin proksimume 5 Gramoj de proteino kaj fibro
  por servanta. #?I tiu faboj estas #anka? #ri?a en hardita amelo kies utiloj estas
  jam menciita sur.\\nMigdaloj\\n#Tio ?i estas alia mirinda #man?a?o kiu povas helpi
  en la peza perdo pro la sana graso ?i enhavas. Studo montris ke homoj kiu aldonis
  nuksojn kiel migdaloj en ilia #?iutaga dieto perdis pli da pezo ol tiuj kiu #anstata?igi
  la migdalojn kun la pezaj kaloriaj biskvitoj.\\nVerda teo\\nLa bona afero pri verda
  teo estas ?i hidratoj via korpo nur kiel akvo kaj povas plenigi vin supre facile.
  ?i #anka? enhavas antioksidantojn kiu helpo en brulanta grasojn kaj kaloriojn. Studo
  montris ke se vi prenos verdan teon kvin oble tago, Vi efektive duobligos la rapidon
  de via peza perdo.\\nBananoj\\nVi povas diri bananon estas la slimming ekstra #man?a?o.
  Legomo, Meznivela sized banano enhavas pri whooping 12.5 Gramoj de hardita amelo
  kiu helpas en via metabolo. #E? matura banano povas provizi vin proksimume 5 Gramoj
  de hardita amelo.\\n#Oran?o\\nKvankam ?i enhavas nur 59 Kalorioj, ?i enhavas multan
  fibron,Kiu helpos plenigi vin supre kaj #man?i malpli. ?i rangoj inter la supro
  de la plej pleniganta #man?a?o. #Oran?o povas esti tre efikaj se aldonita la pezan
  perdan dieton.\\nPomoj\\nKvankam ?i donas vin nur 95 Kalorioj, meznivela-sized pomo
  enhavas pri kvar gramoj de fibro. Lastatempaj studoj #anka? montrita ke pliiganta
  por taga konsumado de fibro povas helpi vin perdi pli da pezo.\"", "\"William R.
  HARMON (naski\u011dis en 1927 en El Dorado, Kansaso) estis usona esperantisto. Li
  lo\u011dis longan tempon en norda Kalifornio. Li forpasis la 27an de novembro 2019
  en maljunulejo en suda Oregono, Usono.\\nLi transloki\u011dis al Kalifornio en 1938.
  Dum la dua mondmilito li estis militmaristo, plejparte en la Atlantiko kaj Mediteranea
  Maro. De 1949 li profesii\u011dis en la transporta fako, unue \u0109e la Fervojo
  Santa Fe dum 17 jaroj kaj poste kun diversaj martransportaj kompanioj. Li emeriti\u011dis
  en 1990 de Matson Navigation Company kiel Vicprezidanto kaj estro de la fako pri
  tarifoj. Krom edzino Lusi, lia familio konsistas el tri filoj, sep genepoj kaj sep
  pragenepoj.\\nLi esperantisti\u011dis en 1939 en Los-An\u011deleso de instruisto
  s-ro John Clewe. Li estis aktiva en la Esperanto-Klubo de Los-An\u011deleso \u011dis
  milita servo en la Usona Militmaristaro ekde 1944, li kunfondis Esperanto-klubon
  en Long Beach, Kalifornio kun William O. Wanzer. Li instruis Esperanton sur milit\u015dipo
  USS Franklin D. Roosevelt inter 1945 kaj 1947, kontaktante multajn esperantistojn
  en E\u016dropo, Afriko kaj Brazilo dum tiu tempo.\\nDum trijara lo\u011dado en Japanio
  1972-75, li estis aktiva en diversaj Japanaj Esperanto-organizoj. Li ofte prelegis,
  vizitis \u0108inion plurfoje, en unu okazo helpe al la planado de la Pacifika Konferenco
  en Qingdao, \u0108inio en 1992. Aktiva en la Usona nacia organizo ELNA ekde tuj
  post ties komenco en 1952, li establis la iaman Centran Oficejon de ELNA en Kalifornio
  en 1975. Li estis estrarano de ELNA 1958-1960 kaj 1966-1997, entute 35 jarojn; prezidanto
  de ELNA 1976-1981; kaj estrarestro 1965-1967. ELNA nomis lin Honora Membro en 1992.\\n\u0108efdelegito
  de UEA en Usono ekde 1987, li \u0109eestis multajn Universalajn Kongresojn kaj lia
  edzino Lusi reprezentis la Usonan Esperantistaron kiel Komitatano A de UEA. Ekde
  1993 li estis dum 6 jaroj kunordiganto de la Elekto-komisiono de UEA. UEA nomis
  lin Honora Membro de UEA en 1998.\\nLi verkis anglalingvan Historio de la Esperanto-Ligo
  por Norda Ameriko (2002). Li ofte servis kiel interpretisto en esperantistaj voja\u011dgrupoj
  kaj \u0109e publikaj prezentadoj. Li tradukis en Esperanton du gravajn verkojn de
  \u0108efo Luther Standing Bear, Mia indiana knabeco (My Indian Boyhood) kaj Historietoj
  de la Siuoj (Stories of the Sio\u016d), amba\u016d publikigitajn de Eldonejo Bero.\\nMesa\u011do
  okaze de la Internacia Tago de Edukado, 24 januaro 2021\\nGazetaraj Komunikoj n-ro
  926 (2021-01-21)\\nMesa\u011do de UEA okaze de la Tago de Holoka\u016dsta Memoro,
  27 januaro 2021\\nGazetaraj Komunikoj n-ro 925 (2021-01-20)\\nProponoj por la hibrida
  IKU en Belfasto bonvenaj \u011dis 31.1.2021\\nGazetaraj Komunikoj n-ro 924 (2021-01-18)\\nEsperantologio,
  la faka revuo de CED, bonvenigas recenzojn pri libroj\\nGazetaraj Komunikoj n-ro
  923 (2021-01-17)\\nInterkultura Novelo-Konkurso (INK) havas F. Lorrain kiel prezidanton
  kaj N. Ruggiero kiel sekretarion\\nGazetaraj Komunikoj n-ro 922 (2020-12-28)\"",
  "\"Maria Jo\u00e3o Pires\\nWikipedia''s Maria Jo\u00e3o Pires as translated by GramTrans\\nMaria
  Jo\u00e3o Alexandre Barbosa Pires ( La portugala: [m\u0250\u02c8\u027ei\u0250 \u0292w\u0250\u0303\u0169\u032f
  \u02c8pi\u027e\u0268\u0283] ; naskita 23 julion 1944) estas klasika pianisto.\\nMuzikaj
  studoj\\nPires estis naskita en Lisbono, Portugalio. \u015cia unua recitalo estis
  en la a\u011do de kvin, kaj en la a\u011do de sep \u015di jam ludis Mozart pianokon\u0109ertojn
  publike. Du jarojn poste \u015di ricevis la pintpremion de Portugalio por junaj
  muzikistoj. En la sekvaj jaroj, \u015di studis kun Campos Coelho \u0109e la Lisbona
  Konservatorio, prenante kursojn en kunmeta\u0135o, teorio, kaj historio de muziko.
  \u015ci da\u016drigis she studojn en Germanio, unue en la Musikakademie de Munkeno
  kun Rosl Schmidt kaj tiam en Hanovro kun Karl Engel.\\nKariero\\nInternacia famo
  venis en 1970, kiam \u015di venkis en la Beethoven Bicentennial Competition en Bruselo.
  Poste \u015di rezultis kun gravaj orkestroj en E\u016dropo, Ameriko, Kanado, Israelo
  kaj Japanio, interpretante verkojn de Bach, Beethoven, Schumann, Schubert, Mozart,
  Brahms, Chopin kaj aliaj klasikaj kaj romantikaj komponistoj.\\n\u015cia profesiismo
  realigis tutmondan rekonon kiam filmo (de 1999) estis desegnita al la atento de
  la gazetaro kaj i\u011dis virusen 2013. \u0108e la komenco de tagmezkoncerto en
  Amsterdamo, \u015di ekkomprenis ke \u015di ekzercis por malsama Mozart-kon\u0109erto
  de tiu la orkestro komencis ludadon; rapide renormali\u011dante, \u015di ludis la
  kon\u0109erton de memoro.\\nPires farita \u0109e la BBC Finbaloj en 2010. En intervjuo
  anticipe, \u015di diris ke post 60 jaroj da recitaloj kaj koncertoj \u015di havis
  detran\u0109adon siaj prezentoj sed estis nedeviga koncerne emeriti\u011don.\\nDe
  2012 \u011dis 2016, \u015di estis majstro en Lo\u011dejo \u0109e la re\u011dino
  Elisabeth Music Chapel en Waterloo, Belgio, kie \u015di donis pianolecionoj kaj
  majstraj klasoj \u011dis junaj talentaj pianistoj de refoje la mondo. Por kreskigi
  junajn muzikistojn, \u015di lan\u0109is la Partituran Projekton.\\nRegistradoj\\nPires
  rezultas kiel soloartisto kaj en \u0109ambra muziko. \u015cin multaj sukcesaj registradoj
  inkludas prezentojn de la \\\" Lunbrilo \\\" kaj aliaj sonatoj per Beethoven, Le
  Voyage Magnifique (la kompletaj impromptuj de Schubert), nokturnoj kaj aliaj verkoj
  de Chopin, kaj Mozart-triopojn kun Augustin Dumay ( violono) kaj Jian Wang ( violon\u0109elo).\\n\u015ci
  gajnis la Pessoan Premion en 1989, kaj fondis la Belgais Centron por Studo de la
  Artoj en 1999.\\nGramofono selektis \u015diajn registradojn de la Chopin nokturnoj
  kiel la plej bona versio havebla: \\\"mi havas neniun heziton en deklarado de Maria
  Jo\u00e3o Pires - pianiston sen spuro de narcisismo - inter la plej elokventaj majstro-muzikistoj
  de nia tempo.\\\" (Bryce Morrison).\\nAlia de \u015diaj aklamitaj registradoj estas
  Mozart: La Pianaj sonatoj. La\u016d la Pingveno-Gvidisto, \\\"Mario Jo\u00e3o Pires
  estas stilisto kaj bona Mozartian. \u015ci \u0109iam estas rafinita ankora\u016d
  neniam havante mankon en klasika sento, kaj \u015di havas decidan fantazion. \u015ci
  frapas idealan ekvilibron inter sinteno kaj esprimplena sentemo, perante senton
  de spontaneco en \u0109io kion \u015di prias.\\\"\\n[ tiu cita\u0135o bezonas a
  cita\u0135on ] Parta diskografio\\n- Chopin, Schubert, Mozart med mere: Kompleta
  Concerto Recordings sur Deutsche Grammophon 2014\\n- Chopin, Schubert, Mozart med
  mere: Kompleta Solo Recordings sur Deutsche Grammophon 2014\\n- Mozart: Lieder kaj
  Arias [Akompananto al Barbara Hendricks] [EMI]\\n- Mozart: Piano Sonatas Complete
  (Denon)\\n- Beethoven: Pianokon\u0109ertoj 3 & 4 (2014, Onyx Classics)\\n- Mozart:
  Pianokon\u0109ertoj 14, 17, 21, & 26 (2013, Deutsche Grammophon)\\n- Schubert (2013,
  Deutsche Grammophon)\\n- Chopin (2008, Deutsche Grammophon)\\n- Beethoven: Pianaj
  sonatoj (2001, Erato)\\n- Schumann: Pianokon\u0109erto, Pianokvinteto (2000, Deutsche
  Grammophon)\\n- Chopin: Pianokon\u0109ertoj 1 & 2 (1999, Erato)\\n- Franck, Debussy:
  Violonsonatoj; Disnodigi: Lulkanto; Habanera; Tzigane (1996, Deutsche Grammophon)\\n-
  Mozart: Piano Sonatas K. 281, K. 282, K. 533/K. 494 (1993, Deutsche Grammophon)\\n-
