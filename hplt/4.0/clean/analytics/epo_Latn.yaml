  viva\\\"konversacio.\\nMalkovri, kio estas ebla kaj kio ne estas, kaj petu vian
  demandon.\\nKiam respondojn amasigis sufi\u0109e, ni alportos ilin al la bazo de
  kono. Ni provu legi. iuj la demandoj, sed mi ne povas promesi, ke respondos al \u0109iu
  el ili. \\\"Nu, kial ne.\\\" Por ajna demandoj vi povas trovi la respondon en aliaj
  fontoj, kaj kelkaj estas ne ta\u016dga por \u0109i tiu kolumno. Ekzemple, ni ne
  planas anonci \u0109i tie la \u0135eto de novaj produktoj a\u016d diskuti anta\u016de
  kovris temoj (sed ni povas klarigi kelkajn demandojn pri \u011di.). E\u0109 se ni
  ne estas kapabla respondi al la demando, ni ankora\u016d preni en konto kaj doni
  al la dungitoj kiuj okupi\u011das pri la interesa temo. Se vi valoras konkurenciva
  teamo ludas, kial vi estas kontra. Kun li, teamoj estus multe pli facile kunordigi.
  En la pasinteco nia sinteno al la vo. o konversacio estis determinita de la fakto,
