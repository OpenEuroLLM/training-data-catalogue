  la fontan dokumenton, enmeti la dosieron kiel ligilon.\\nPor enmeti tutan tekstan
  dokumenton kiel ligilon\\n-\\nMetu la kursoron en la dokumento kien vi volas enmeti
  la dosieron.\\n-\\nElektu menuerojn Enmeti - Sekcio.\\n-\\nTajpu nomon en la kadro
