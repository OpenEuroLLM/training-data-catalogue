  li nur ru? i? i furioze, kaj kiam liaj amikoj premo al li paroli al \u015di, li
  nur balbutas,\\\"li venos \u0109i tien pli ofte,\\\"tiel malalta ke li petas \u015din
  por ripeti \u011din, kiam li forkuras. La tipoj de blankaj viroj, muskola kaj muta,
  ili ne estas altiritaj al Aziaj knabinoj. Ili estas tro okupata postkuranta leggy
  blondulinoj, kiuj uzas tro multe tan kaj Tory Burch apartamento. Blanka masklo tipoj
  kiu altiras Aziaj knabinoj tendencas esti maldika, gruo-kiel, kaj kiam en la lastaj
  jaroj ili havas karakterizan linion de ru\u011deta, mallonga-cropped hair. Ili portas
  okulvitrojn kaj legis tre bone. Male al Aziaj homoj, kies ideo de bona dato estas
  la knabino vidis lin tu\u015di \u011din, kaj tiam man\u011das vesperman\u011don
  \u0109e la francaj Vjetnama restoracio\\\"Fusion\\\".\\nVi estas tre familiara kun
  la historio kaj kulturo de via lando, kaj kelkaj homoj parolas la lokan lingvon
  pli bone ol vi, kiuj iris al Kolegio a\u016d vivis tie dum almena\u016d unu jaro.\\nAziaj
  knabinoj trovos ? i tiu intereso en ilia hejmo kulturo amba\u016d konsolanta kaj
  flata. Ili vidas tion kiel reflekto de ilia intelekta scivolemo pri la profundo
  de la blanka dato. \u0108i-tio reflektas sian mankon de entuziasmo. Kontraste Azianoj,
  kiu, la\u016d iliaj avoj, havas ilia vosto defalas, kiam vi pa? o en la kuirejon,
  blankaj viroj \u015datas kuiri \u011din. Tio signifas ke virinoj ne nur devas iri
  al la kuirejo. Ekde Aziaj knabinoj emas kredi, ke homoj devus servi kun iliaj manoj
  kaj piedoj, ili estas surprizitaj se iliaj blanka viro ankora\u016d proponas al
  kuiri vesperman\u011don por ili. Aziaj knabinoj kreski supre kun gepatroj kiuj Esprimas
  ilian amon por havi tegmento super iliaj kapoj kaj la man\u011da\u0135o sur la tablo.
  \u011ci estas atendita ke ili venos al la konkludo, ke lia amo, se \u011di ne estas
  aprobita por adopto. Dum ? e unue Vi povus akiri iom konfuzita kiam Via blanka amiko
  diras al Vi, ke li bezonas al\\\"procezo Viajn sentojn,\\\"balda\u016d Vi?? l ?
  ati tiaj aferoj (kune kun abstrakta akvarelo pentrarto, poezio, kaj semajnaj vizitoj
