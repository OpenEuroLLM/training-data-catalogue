  diri ''saluton'' al novaj amikoj kaj rilatoj. Renkonti novajn Singles en via areo.\\nBlankaj
  viroj parolas al bela Azia knabino en la trinkejo\\nKelkaj kruco-kultura rilatoj
  estas pli \u0109iea ol paro de blanka Aziaj knabinoj, plej ofte trovita en urboj,
  kiel San Francisco kaj Seatlo\\nKio estas \u011di proksimume blankaj viroj kiu,
