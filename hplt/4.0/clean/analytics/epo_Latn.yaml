  dosieron.\\n-\\nElektu menuerojn\\n-\\nTrovu la tekstdokumenton kiun vi volas enmeti,
  kaj tiam alklaku la butonon Akcepti.\\nLa enhavo de la teksta dokumento enfiksi\u00c4as
