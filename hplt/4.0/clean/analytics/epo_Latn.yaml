  por pli efika lukto kontra\u016d la malamikoj sur la vojo al la kastelo de ludanto.\\n\u0108efaj
  karakteriza\u0135oj:\\n-\\nGranda nombro de niveloj kun kreskanta komplekseco\\n-\\nUnika
