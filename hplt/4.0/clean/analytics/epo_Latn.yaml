  inter siaj propraj kulturoj kaj tiuj kiu elmigris al ili. Tio estas kial tiel multaj
  de vi trovas vin mem ruinigata iom princinoj. Iri al Bangkok a\u016d Bali a\u016d
  Bagan kaj tie vi trovos kvalito \u0108inaj knabinoj amase, \u0109iuj sur ferio kaj
  ? iu ser partio. Vi anka? povus renkonti kelkaj Koreoj kaj la Japana, sed \u011di
  estas \u0108inaj knabinoj, kiuj konsistigas la vastan plimulton de tiuj tagoj. Sendependa
  \u0108inaj turistoj estas virinoj (knaboj devas resti \u0109e hejmo kaj gajni monon
  tiel ke ili povas pagi por la domo kaj a\u016dto, kiu estas grava por tie \u0109iam
  esti virino). Plejparto de \u0109i tiuj knabinoj estas de granda besto urboj, kaj
  ili povas almena\u016d parolas racia angla.\\nLa Departemento de turismo en Tajlando,
  ekzemple, aktive promocias individuajn oficejo knabinoj de Honkongo kaj \u015canhajo,
  kaj Bangkok estas plena de ili.\\nSe vi ne kredas min, provu legi la Mandarena de
  Darby Jones elekto. Plej bone de \u0109iuj en mezlernejo a\u016d Kolegio. Mi renkontis
  mian edzinon kiam mi estis studento, \u015di estis la plej juna.\\nPlejparto de
  niaj amikoj kaj kolegoj miaj amikoj estas Azia blanka paroj kiuj renkontis en mezlernejo.\\nMultaj
  koreaj familioj estas izolita kaj ksenofobia, precipe la unua generacio de enmigrintoj,
  kiu povas esti problemo. Tamen, viaj filoj kaj filinoj havas aliajn ideojn, kiel
  mi povas konfirmi per akademiaj kaj komercaj amikoj. Tamen, ne tiri konkludojn nur
  \u0109ar de la ha\u016dto tono kaj epopeo sulkoj. Se vi estas juna sufi? a aspekto
  por\\\"knabinoj\\\"- vi ver\u015dajne trovos, ke vi estas simple konsiderita Okcidenta,
  kiel vi ne povas esti flatita per tiuj kiuj estas altiritaj al via\\\"ekzota beleco\\\".
  Mi dirus, ke tio \u0109i estas kiel ili kutime traktas sin mem, same kiel \u0109iuj
  aliaj virinoj. \u011ci estas plej bona por simili ion rasisma kun unua dato kun
  P. Chang kaj tiam nova Jackie Chan filmo. Vi ver\u015dajne havas sufi\u0109e da
  man\u011da\u0135o \u0109e hejmo \u0109iuokaze, mi scias, mi scias. Kvankam mi povas
  diri al vi se vi komencas parolanta al \u0108ina knabino, diru al ili: Ni kokino
  mir (prononcita: genuo - kiam vi povas, vi povas diri ke sono devus iri malalta
  kaj tiam alta). \u011ci signifas ke \u015di estas bela Se vi estas Ora.\\nVideo
  babilejo Datado la Datado de la nova generacio\\nLi trovos vin la perfekta partnero
  do vi ne havas horojn por konsideri la profiloj de aliaj homojNur respondi al kelkaj
  simplaj demandoj a\u016d submeti\u011di al testo de kongrueco, kaj la unika algoritmo
  proponos vin kunuloj. En E\u016dropo kaj Ameriko, proksimume de geedzi\u011doj post
  kiam renkontanta en linio. Socia statuso a\u016d a\u011do ne estas restrikto ejoj
  de Datado estas amba\u016d junan kaj malnova. Sur la Interreto por akiri acquainted
  estas multe pli simpla kaj pli sekura ol en la laboro, en la trinkejo a\u016d sur
  la strato. Video babilejo por Datado estas centoj de miloj de viroj kaj virinoj
  de malsamaj partoj de la lando.\\nInteresaj homoj povas esti trovita de la \u0109efurbo
  al la plej malgrandaj vila\u011doj.\\nElspezi minuton por respondi kelkajn demandojn
  kaj trovi ekstere kiun estas preta renkonti kun vi. Pro tio ke iu ajn uzanto povas
  tuj renkonti, invitante ilin sur dato ekzemple, proponas romantika vesperman\u011do
  en la restoracio, aran\u011di unua dato al la kinejo, a\u016d e\u0109 preni romantikan
  voja\u011don al Parizo. Ni promesas al video Babilejo por Dati i. iu trovos unu
  paro.\"", "\"Aran\u011doj:\\nNia voja\u011do, de mi kaj mia fratino, al Esperantujo
  fakte komenci\u011dis de la vizito de ne esperanto-parolantaj amikoj. Mia rusa amiko
  nuntempe lo\u011das kaj skribas doktoran disertacion en Germanio, kaj li invitis
  min. En Berlino ni renkonti\u011dis kun li kaj lia amiko. Per bicikloj ni, Arkadij
  kaj Henning traveturis ver\u015dajne la tutan Berlinon kaj ege impresi\u011dis!
  Unue \u0109ar germanoj \u015dparas energion kaj ne uzas \u011din, kiam ne estas
  bezonate. Ekzemple, en la por\u0109o lumas nur dum kelkaj minutoj kaj poste la lumo
  a\u016dtomate mal\u015dalti\u011das. En la trajnoj pordoj malfermi\u011das nur se
  vi premas la butonon. Tio pla\u0109is al ni, oni devas \u015dpari energion. Kaj
  bicikli en Germanio estas ege mojose, estas multaj biciklaj vojoj kaj e\u0109 en
  la metroo oni povas kunporti biciklon.\\nNin tre impresis en Berlino moderna pre\u011dejo,
  kiu estas griza kaj ne tro interesa ekstere, sed ege bela interne kaj aspektas tute
  malsame ol kutimaj pre\u011dejoj. Tra multaj kvadrataj fenestretoj oni vidas lumon
  kaj tio vere bele aspektas. Sed sur la fotoj ne videblas plene \u011dia beleco.\\nCetere
  en Berlino estas multegaj belaj lokoj, sed estas malfacile rakonti pri \u0109io
  interesa.\\nPost Berlino ni veturis al la urbo Halle. \u011ci estas tute alia, sed
  anka\u016d pla\u0109a, ege kvieta kaj trankvila urbo. Tie ni e\u0109 vizitis du
  muzeojn, la urban muzeon kaj la muzeon de Beatles.\\nBeda\u016drinde ni ne sukcesis
  eniri la Planetarion, sed ekstere \u011di aspektas bele kaj havas mojosan sunan
  horlo\u011don.\\nEn Halle ni iomete rememoris la rusan lingvon kaj forveturis al
  sekva urbo, kie ni ekparolis Esperanton. Wolfgang (Lupiro) proponis al mi anta\u016d
  FESTO fari kunvoja\u011don, kaj ni venis al li. Mi \u011dojas ke en lia librovendejo
  mi povis a\u0109eti libron en la germana por iam praktiki la lingvon. Kaj ni ekvidis
  unue la urbon, kie vere preska\u016d ne lo\u011das rusoj. Anta\u016de en Germanio
  ni povis rimarki ke lo\u011das vere multaj rusoj tie, sed en T\u00fcrkheim, \u015dajne
  estas proksimume du.\\nVeturado al FESTO ne estis facila, \u0109ar da\u016dris ege
  longe. Sed ni veturis tra vidindegaj lokoj \u2013 multaj vojpasejoj en la Alpoj.
  Rigardante al la fotoj ne eblas diskuti pri beleco de ili. Kaj certe ne eblas ne
  danki Lupiron, kiu stiris tiel longe, kaj laci\u011dis multe pli ol ni.\\nKiam ni
  alvenis al la loko, \u011dojo pro la renkonti\u011do kun geamikoj tamen forigis
  la lacon. Kaj e\u0109 restis iom da man\u011do por ni. Ni fakte venis al la gastejo
  tiel subite kaj malfrue, ke ni nur metis nian baga\u011don en la \u0109ambron, iris
  man\u011di kaj poste tuj al la interkona vespero.\\nDum la interkona vespero ni
  finfine eksciis la tutan programon de FESTO. \u0108io estis ege strikte planita
  kaj ni ne havis e\u0109 unu liberan horon! (:D \u015derco sed...) Fakte estis tiel
  malgra\u016d ke vere nur koncertoj kaj ekskursoj estis planitaj. Ni mem povis aldoni
  ion al la programo kaj neniam enuis. Ni kelkfoje iris (ege longe!) kaj veturis (multe
  pli rapide) al la lago, kie estis belaj cignoj, anasoj kaj stranga sablo.\\nNi organizis
  dufoje aligatorejon, kaj dua aligatorejo estis amuzega dank''al Da\u015da Zelenina
  el \u0108eljabinsk. En la gastejo ni povis ludi tablopilkon (kiu estis fakte fu\u015de
  farita) kaj normale faritan badmintonon. Certe krom \u0109io estis granda plezuro
  konati\u011di kun novaj homoj, trovi novajn amikojn. Tiel vere ne eblis havi tempon
  por dormi, tutan FESTOn ni festis:)\\nDum la FESTO okazis multaj koncertoj. Regeo
  de Zhou Mack Mafuilla estis tre bona, ni multege dancis. Sekvan tagon ni \u011duis
  bonegan muzikon de Espo Despo kaj poste pezan rokon de la franca grupo Sto\u00efc
  Drama.\\nLa 20-an de au\u011dusto nin dancigis Dol\u0109amar. Kaj certe ne eblas
  ne mencii la plej atenditan de mi Jonny M. Li kantis multajn novajn kantojn kiuj
  impresis per vortoj, pozitiveco kaj pacemo.\\nSekvajn koncertojn mi fakte ne \u0109eestis,
  \u0109ar promeni en la nokta Metabief estis ege bele, \u0109arme kaj romantike.\\nUnufoje
  ni voja\u011dis per malnova vaportrajno al iu stranga akvo. Oni diris ke \u0109iujn
  12 minutojn en la akvo io okazas, sed okazis nenio. Naive geesperantistoj la\u016d
  sia inklino esperis pri io neordinara, sed la akvo nur iomete gluglis. Tamen estis
  interese veturi per tiel malnova trajno, ni povis provi senti nin homoj de alia
  jarcento.\\nE\\nAnkora\u016d dum FESTO estis ekskurso al La\u016dzano. Sed ni ne
  veturis kun la tuta grupo, \u0109ar Leo proponis veturigi nin per sia a\u016dto,
  kaj ni promenis tra La\u016dzano kvinope: mi, Lena, Andr\u00e9, Leo kaj Julia. Dufoje
  ni e\u0109 renkontis alian promenantan esperantistan grupon. La lago en La\u016dzano
  estas ege bela, ni tagman\u011dis tie kaj tagman\u011digis paserojn. La urbo mem
  estas anka\u016d bela sed multekosta. Bon\u015dance dum FESTO ni lo\u011dis en Francio,
  sed ne en Svislando :D.\\nDum FESTO estis ege bona gufujo. Ni sidis \u0109e la fajro,
  babilis, iuj muzikis per kalimba, kaj ni havis lumantajn ringojn (dank''al Andi)
  kaj \u011duis la belegan stelan \u0109ielon. Revenante al la gastejo ni a\u016ddis
  sonoriletojn de bovinoj.\\nEn la gastejo ni \u0109iam havis bongustegajn man\u011da\u0135ojn,
  kaj mirinde, iam \u011di estis tajlanda. Tion rimarkis Andr\u00e9, kiu unufuje subite
  ekbabilis kun kuiristo tajlande, kaj la kuiristo rakontis ke li studis la kuirarton
  en Tajlando. La tajlanda kaj franca man\u011da\u0135oj estis amba\u016d bongustaj.
  Krom tio ni miris pro ege malgranda matenman\u011do, ni havis nur kafon/teon/lakton
  kaj panon kun marmelado. Mal\u011dojinte pri tio ni kun Andr\u00e9 a\u0109etis maizflokojn
  kaj \u0109iutage \u011duis pri pli granda matenman\u011do. Kaj mi miris pri tio
  ke la francoj \u0109iam trinkas akvon. Dum la tagman\u011do kaj vesperman\u011do
  ni trinkis nur \u011din. Kaj \u0109iam havis diversajn froma\u011dojn.\\nEntute
  mi ege \u011dojis partopreni FESTOn, neimageble \u011dojis. Al mi mankas nun multaj
  personoj, kaj mi esperas ke ni renkonti\u011dos sekvontsomere. Kaj mi pensas ke
  tia libera programo mojosas! Kaj certe estis plezuro \u0109iutage a\u016dskulti
  bonan esperantan muzikon kaj a\u0109eti KD-ojn. Mi pensas ke \u0109iu muzikema kaj
  dancema esperantisto devegas veturi al FESTO, mi veturus tien denove.\\nRevenante
  hejmen mi ne povis imagi kiel mi kapablos denove paroli kaj pensi ruse, kiel mi
  povos ne vidi \u0109iujn FESTanojn. Sed al kelkaj mi povis ne tuj adia\u016di, \u0109ar
  ni denove veturis kun Wolfgang kaj krom ni en la a\u016dto veturis Andr\u00e9 kaj
  \u015caci. Estis ege malmulte da spaco, sed mi dormis la tutan veturadon kaj ver\u015dajne
  lacis malpli ol \u0109iuj. Matene Wolfgang veturigis nin \u011dis la stacidomo en
  Buchloe kaj mi, Lena kaj Andr\u00e9 forveturis al M\u00fcnchen. Estis mojose havi
  eblecon ekvidi ankora\u016d unu urbon. Komence, \u0109irka\u016d la stacidomo M\u00fcnchen
  aspektis ne tro bele, sed kiam ni atingis la urbocentron, ni ekvidis vere belan
  ar\u0125itekturon. Ni vidis belajn domojn, fontanojn, stratojn kaj parkon. Malfeli\u0109e,
  vespere ni devis forflugi, sed ni sidis \u011dis la lasta ebleco trapasi pasportkontrolon
  en flughaveno kaj babilis pri \u0109io. Kaj krom \u0109io ni subite veturis per
  la unua klaso, kaj e\u0109 ne devis krompagi, tial en la aviadilo mi komforte ekdormis
  pensante pri la bonega voja\u011do kaj novaj geamikoj.\\nJana Husanova\\nJekaterinburg
  /Rusio/\"", "\"Markandeya Purana\\nWikipedia''s Markandeya Purana as translated
  by GramTrans\\nLa Markandeya Purana (\u092e\u093e\u0930\u094d\u0915\u0923\u094d\u0921\u0947\u092f
  \u092a\u0941\u0930\u093e\u0923, IAST: M\u0101rka\u1e47\u1e0deya Pur\u0101\u1e47a)
  estas sanskrita teksto de hinduismo, kaj unu el la dek ok gravaj Puranaj. [1] [2]
  La titolo de la teksto Markandeya rilatas al sa\u011dulo en hindumitologio, kiu
  estas la centra karaktero en du legendoj, unu ligis al \u015civao kaj aliaj al Vishnu.
  [3] La Markandeya teksto estas unu el la Puranaj al kiu mankas sekta prezento de
  ideoj en favoro de iu akurata dio, [2] [3] kaj estas rare legi ajnan dia\u0135on
  estantan cititaj a\u016d dia\u0135opre\u011doj en la tuta teksto.\\nLa Markandeya
  Purana estas ver\u015dajne unu el la plej malnova en Purana \u011denro de hindua
  literaturo, inter la plej interesaj kaj gravaj, \u015dtatoj Ludo Rocher. [2] \u011ci
  estas fama pro inkludi la Devi Mahatmyan ene de \u011di, la plej malnovan konatan
  diserta\u0135on pri Devi (diino) kiel la Supera Vero kaj kreinto de la universo.
  [2] [3] [6] La teksto estas konsiderita centran tekston de la hindua Diin-rilata
  Shaktismo tradicio, kun speciala esprimo de respekto por la virineca. [6] [7] Devi
  Mahatmya de la Markandeya Purana ofte estas vicigita en kelkaj hinduaj tradicioj
  por esti same grava kiel la Bhagavad Gita.\\nLa pluekzistantaj manuskriptoj de tiu
  Purana havas 137 \u0109apitrojn, de kiuj \u0109apitroj 81 tra 93 estas la Devi Mahatmya.
  [9] Tradicio kaj kelkaj mezepokaj epoktekstoj asertas ke la Markandeya Purana havas
  9,000 versojn, sed pluvivaj manuskriptoj havas proksimume 6,900 versojn. [10] La
  teksto prezentas varian vicon da temoj, [1] [11] [12] kun socikulturaj informoj
  kaj simbolecon por vedaj ideoj kaj metafizikan penson.\\nDato\\nLa Markandeya teksto
  estas ver\u015dajne unu el la plej maljunaj Puranaj en hinduismo. [2] [15] La literatura
  stilo kaj enhavo de la teksto, en kio la fruaj \u0109apitroj legis kiel aldono por
  la hindua eposa Mahabharato igis akademiulojn sugesti ke \u011di estas frua kunmeta\u0135o
  kiu ver\u015dajne sekvis la epopeon.\\nLa Markandeya Purana, \u015dtatoj Wendy Doniger,
  estas ver\u015dajne de \u0109. 250 p.K., kun la escepto de la Devi Mahatmya, kiun
  \u015di datas al \u0109. 550 p.K. [15] Aliaj akademiuloj anka\u016d sugestis ke
  partoj de tiu Purana ekzistita ekde la tria jarcento. [16] En kontrasto, Nileshvari
  Desai indikas ke la plej malnova de recentaj manuskriptoj ver\u015dajne estas de
  la 7-ajarcenta CE.\\nLa teksto anka\u016d estis datis kun la helpo de epigrafika
  indico. [2] [17] La Dadhimati Mata surskribo, ekzemple estis datita por esti de
  608 p.K., kaj tiu surskribo estas cita\u0135o de \u0109apitro 10 el la Devi Mahatmya
  (91-a \u0109apitro de la Purana). Tio indikas tiun tiun parton de la teksto ekzistita
  ekde la 6-a jarcento p.K. [2] [17] Kompleta Palmfoliomanuskripto de la teksto estis
  malkovrita en Nepalo, kaj estis datita al 998 p.K. [14] Simile, la frua 8-ajarcenta
  teksto Malatimadhava de Bhavabhuti-referencoj Devi Mahatmya, kiu implicas la tekston
  estis establitaj kaj en cirkulado flank tiam. Aliaj akademiuloj lokis \u011din inter
  4-a- \u011dis 6-ajarcenta CE. [18] La ideo de Goddess kiel la supera, \u015dtatoj
  John Lochtefeld, ver\u015dajne ekzistis anta\u016d la 6-ajarcenta ol la kunmeta\u0135dato
  de Devi Mahatmya, \u0109ar \u011di aperas en tiel plene evoluigis formon en la teksto.\\nKiel
  \u0109iuj Puranaj, la Markandeya Purana, havas komplikan kronologion. Dimmitt kaj
  van Buitenen deklaras ke \u0109iu el la Puranaj estas enciklopedieca en stilo, kaj
  estas malfacile konstati kiam, kie, kial kaj de kiu tiuj estis skribitaj: [19]\\n\u0108ar
  ili hodia\u016d ekzistas, la Puranaj estas plurtavola literaturo. \u0108iu titolita
  laboro konsistas el materialo kiu kreskis per multaj surkreska\u0135oj en sinsekvaj
  historio la\u016d epokoj. Tiel neniu Purana havas ununuran rendevuon de kunmeta\u0135o.
  ( ... ) \u011ci estas kvaza\u016d ili estus bibliotekoj al kiuj novaj volumoj estis
  ade aldonitaj, ne nepre \u0109e la fino de la breto, sed hazarde.\\nLoko\\nLa plej
  frua versio de la Makandeya Purana, kun Devi Mahatmya, estis ver\u015dajne kunmetita
  proksime de la Narmada rivero, en okcidenta Hindio.\\nEnhavo\\nTiu Purana havas
  137 \u0109apitrojn, de kiuj \u0109apitroj 81 tra 93 estas la Devi Mahatmya. [9]
  La teksto malfermi\u011das kun la Mimamsa fondinto Jaimini petanta al salvio Markandeya
  respondojn al kelkaj demandoj levitaj per la Mahabharato, sed neniam traktita en
  \u011di. [21] Markandeya asertas ke li bezonas iri kaj elfari kelkajn vedajn ritojn,
  kaj sugestas Jaimini por renkonti\u011di supren kun kvar sa\u011daj birdoj kiuj
  vivas en la Vindhya intervalo. [21] Jaimini renkontas la birdojn. La birdoj respondas
  liajn demandojn, kiuj konstituas \u0109apitrojn 4 \u011dis 45 el la Markandeya Purana.
  [21] [22] Tiu diskuto teksas en morala instrukcia\u0135o kun mitologio, [4] la teorio
  de Karma, Sansaro, Dharma kaj Shraddha versoj de tekstoj kiel ekzemple la Mahabharato
  kaj la Gautama Dharmasutras.\\nLa teksto prezentas it Yoga filozofion en \u0109apitroj
  39 \u011dis 43, kaj asertas ke estas la pado akiri memkomprenon kaj liberigon (
  Moksha), tiel venkante preter Karma. [23] La Yoga diskutoj, la portretado kaj liaj
  jogo-instruo de Dattatreya ene de la Markandeya Purana, \u015dtatoj Rigopoulos,
  estas esence tiuj de Jnana jogo, kaj tiu emfazo de Jnana ene de nedualo ( Advaita
  Vedanto) kadro karakterizas Dattatreya \u0109ie en la teksto. [24] Pli \u011denerale,
  la Markandeya Purana, kune kun Vishnu , Vayu , Narada kaj Kurma Puranaj, \u015dtatoj
  Shasrabudhe, havas \\\"unmistakingly la Advaita\\\" (ne-dualisma) regiono, kiuj
  ver\u015dajne reflektas la Advaita tradicion anta\u016d la tempoj de Adi \u015cankara.\\nLa
  pli postaj \u0109apitroj anka\u016d estas donacoj kiel konversacio inter la birdoj
  kaj salvio Markandeya, sed la sa\u011dulo estas la primara parolanto en \u0109apitroj
  45-80 kaj 94-137. [21] Tiu \u015daltilo en stilo, \u015dtatakademiuloj, estas ver\u015dajna
  \u0109ar tiu parto estas la pli malnova kerno de la Purana. [26] Tiu parto konsistas
  el genealogio, manvantaras, geografio kaj \u0109apitroj gloranta dio Surjo (sundio).\\nDevi
  Mahatmya\\nLa Devi Mahatmya, la\u016dlitere \\\"glorado a\u016d la\u016ddoj de la
  diino\\\", konstituas \u0109apitrojn 81 \u011dis 93 el la Markandeya Purana. [6]
  \u011ci estas la primara bhakti teksto de tiuj kiuj honoras Durga a\u016d Chandi
  kiel la Shakti. [8] Tiu teksto estas studita sur sia propra, kaj foje titolita kiel
  Saptasati a\u016d Chandi-mahatmya a\u016d Chandipatha. [8] \u011ci estas precipe
  populara en orientaj statoj de Hindio, kiel ekzemple Okcident-Bengalio kaj Odisha.\\nLa
  Devi Mahatmya malfermi\u011das kun la legendo de du viroj, de tre malsamaj fonoj
  (oni re\u011do, alia komercisto) kiuj renkontas en la arbaro, elpelita fare de siaj
  partneroj kaj familio, tiam ekzilita. [8] Tamen, asertas la teksto, la du malkovras
  ke ili amba\u016d zorgas pri la socia bonfarto de tiuj kiu elpelis ilin. [8] Ili
  scivolas kial ili da\u016dre zorgas. Ili renkontas salvion Medhas por respondoj.
  La sa\u011dulo respondas ke tio estas la naturo de ekzisto, \u0135us observas la
  malsatajn birdojn kiuj kolektas semojn, kaj malgra\u016d esti malsataj tiuj birdoj
  faligas la semojn en la bekojn de siaj beboj. [8] Tio estas la potenco de la diino,
  \u015dia manifesti\u011do en naturo kaj \u0109ie, unu kiu povigas aldonojn, ankora\u016d
  anka\u016d povigas liberigon, asertas la tekston. [27] La du viroj volas scii pli
  pri tiu diino. La Devi Mahatmya kiun parto de tiu Purana priskribas al la diino
  kun teologiaj kaj filozofiaj regiono temigis la virinecan.\\nSocikulturaj informoj\\nLa
  teksto prezentas varian vicon da temoj inkluzive de socio, religio kaj mitologio.
  [12] Enkonstruita en \u011diaj \u0109apitroj estas informoj pri familio, geedzi\u011do,
  societa vivo, robo, man\u011da\u0135o, dogano, ceremonioj, pezoj kaj iniciatoj,
  sociaj kutimoj, pozicio de virinoj, kosmogonio, eskatologio, geografio, fla\u016dro
  kaj fa\u016dno konata kaj pripensita grava en antikva hinda socio kune kun mitologio
  kaj teologio.\\nWendy Doniger deklaras ke la Markandeya Purana defias kelkajn el
  la kontekstaj supozoj pri la mezepoka hinda socio en unua-jarmilo. \u015ci skribas,
  en she analizo de \u0109apitroj 10 kaj 11 el la teksto kiu diskutas it teorion de
  embrievoluo kaj en kio la Purana asertas ke la kontribuo de virino al la evoluo
  kaj la sano de feto estas esenca, [noto 1]\\nLa superrego de la patro en la kreado
  de la korpo, ke sur Manu insistas, estas \u0109i tie lumba\u0135o ne nur per la
  rolo de la patrino en kontribuado al la fizika substanco de la korpo, sed anka\u016d
  per la rolo de la embrio mem.\\nInfluo\\nLa Chandi di Var en Dasam Granth - sekundara
  skriba\u0135o de Sikhism, \u015dtato Louis E. Fenech kaj W. H. McLeod, estas alportita
  de la Markandeya Purana.\\nLa Devi-mahatmya parto de la teksto estas deklamita dum
  Durga Puja festivalo, en Durga temploj de Hindio.\\nManuskriptoj\\nLa tri fruaj
  presitaj eldonoj de tiu teksto distingi\u011das unu de la alia. La Calcutta eldono
  fini\u011das subite en \u0109apitro 136, forlasante la rakonton de Dama duonvoje.
  La Bombay- kaj Poona eldonoj havas kompletan rakonton de Dama, kiu fini\u011das
  en \u0109apitro 137.\\nLa teksto estis tradukita en la anglan per multaj, inkluzive
  de tiuj de C.C. Mukherjee (1893) kaj F. E. Pargiter. [35] Tamen, \u015dtatoj Coburn,
  la fokuso de Pargiter estis rekonstruo de la politika historio de Hindio, ne kiun
  aliaj kontentigas de la Purana. [36] La laboro kaj konkludoj de Pargiter estis vaste
  kontestitaj, post kiam li publikigis sian tradukon en 1904.\\nBona traduko de la
  Devi Mahatmya teksto ene de la Markandeya Purana, \u015dtatoj Gregory Bailey, estis
  publikigita en 1991 fare de Thomas Coburn.\\nVidu anka\u016d\\nNotoj\\n- The Markandeya
  Purana states, \\\" for what the woman eats and drinks goes into the embryo''s womb,
  and the living creature''s body is strengthened and nourished by that so that it
  grows \\\" .\\nReferencoj\\n- a Dalal 2014, p. 246.\\n- a Rocher 1986, pp 191-192.\\n-
