  "\"Bible ku Enternete | BIBLE\u2014NKUDIMUINU WA BULONGOLODI BUPIABUPIA\\nMujiki
  wa Asafa.+\\n82 Nzambi udi wimana mu disangisha dia Nzambi;+Udi ulumbuluisha munkatshi
  mua banzambi ne:+\\n2 \u201cNenutungunuke ne kulumbuluisha ne kansungansunga+Ne
  kutua ku tshia bantu babi too ne d\u00eeba kayi?+ (Sela)\\n3 Lumbuluilayi bapuekele
  ne badi bafuishe batatuabu.+Kosayi bilumbu bia badi kabayi ne dikuatshisha ne bakengi
  mu mushindu muimpe.+\\n4 Sungilayi bapuekele ne bapele;Nubapandishe mu tshianza
  tshia bantu babi.\u201d\\n5 Ki mbamanye ne ki mbajingulule nansha;+Badi benda batambakana
  mu m\u00eedima;Bishimikidi bionso bia buloba bidi bienda binyukudibua.+\\n6 \u201cNdi
  muambe ne: \u2018Nuenu nudi banzambi,+Buonso buenu nudi bana ba Mutambe Bunene.\\n7
  Kadi nenufue anu mutu bantu bafua;+Nenukuluke anu bu mukokeshi mukuabu yonso eu!\u2019\u201d+\\n8
  Jukaku, wewe Nzambi, ulumbuluishe buloba,+Bualu bisamba bionso mbiebe.\"", "\"Bible
  ku Enternete | BIBLE\u2014NKUDIMUINU WA BULONGOLODI BUPIABUPIA\\n34 D\u00eeyi dia
  Yehowa diakalua kabidi kundi, diamba ne:\\n2 \u201cMuana wa muntu, amba m\u00eayi
  a buprofete afikila balami ba mikoko ba Isalele. Amba m\u00eayi a buprofete, ne
  ambila balami ba mikoko abu ne: \u2018Monayi tshidi Mukalenge Mutambe Bunene Yehowa
  wamba: \u201cDiakabi dikale kudi balami ba mikoko ba Isalele+ badi badidiisha bobu
  nkayabu! Ki ntshisumbu tshia mikoko tshidi balami ba mikoko ne bua kudiisha+ anyi?\\n3
  Nudi nudia mafuta, nuvuala miosa ya mikoko, ne nushipa nyama wa manyi a bungi,+
  kadi kanuena nudiisha tshisumbu tshia mikoko+ to.\\n4 Kanuena bakoleshe nyama udi
  mutekete, buondope udi usama, basuike udi mutapike tshilamba, bapingaje idi mipambuke
  anyi bakebe udi mujimine+ to; kadi, nudi bayikokeshe ne malu makole ne tshikisu.+\\n5
  Ke bualu kayi bakayitangalaja bualu kakuvua mulami;+ bakayitangalaja ne kuluayi
  biakudia bia nyama yonso ya tshisuku ya mu mpata.\\n6 Mikoko yanyi ivua itambakana
  pa mikuna minene yonso ne pa mukuna mukese mutumbuke wonso; mikoko yanyi yakatangalaka
  pa buloba bujima, kakuyi muntu udi uyikeba anyi udi uyilonda bua kuyipeta.\\n7 \u201c\u2018\u201cNunku,
  nuenu balami ba mikoko, umvuayi d\u00eeyi dia Yehowa:\\n8 \u2018\u201cBushuwa, bu
  mundi ne muoyo,\u201d ke mudi Mukalenge Mutambe Bunene Yehowa wamba, \u201cbu mudi
  mikoko yanyi milue nyama ya kukuata, biakudia bia nyama yonso ya tshisuku ya mu
  mpata, bualu kakuvua mulami wa mikoko, ne balami banyi ba mikoko kabavua bakebe
  mikoko yanyi; kadi, bakatungunuka anu ne kudidiisha bobu nkayabu ne kabavua badiishe
  mikoko yanyi,\u201d\u2019\\n9 nunku, nuenu balami ba mikoko, umvuayi d\u00eeyi dia
  Yehowa.\\n10 Monayi tshidi Mukalenge Mutambe Bunene Yehowa wamba: \u2018Ndi tshilumbu
  ne balami ba mikoko aba, nembalumbuluishe bua mikoko yanyi, nembipate bua kabadiishi
  mikoko yanyi,+ ne balami ba mikoko aba kabakudidiisha kabidi bobu nkayabu to. Nensungile
  mikoko yanyi mukana muabu, ne kayakuikala kabidi biakudia biabu nansha.\u2019\u201d\\n11
  \u201c\u2018Bualu monayi tshidi Mukalenge Mutambe Bunene Yehowa wamba: \u201cMmeme
  eu, ne meme nkayanyi nenkebe mikoko yanyi, ne nenyilame.+\\n12 Nendame mikoko yanyi
  bu mulami wa mikoko udi mupete mikoko yende ivua mitangalake ne udi uyidiisha.+
