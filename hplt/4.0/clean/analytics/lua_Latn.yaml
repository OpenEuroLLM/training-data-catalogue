  ne pabuipi ne miaba yonso ya kusombela ya mu buloba.\\n14 Nenyidiishile mu mpata
  muimpe, ne buloba budiyi idiila nebuikale pa mikuna mitumbuke ya Isalele.+ Neyilale
  muomu amu, mu buloba buimpe bua kudiila,+ ne neyidiile mu mpata mimpe pa mikuna
  ya Isalele.\u201d\\n15 \u201c\u2018\u201cMeme nkayanyi nendiishe mikoko yanyi,+
  ne meme nkayanyi nenyiladike,\u201d+ ke mudi Mukalenge Mutambe Bunene Yehowa wamba.\\n16
  \u201cNenkebe udi mujimine,+ nempingaje udi mupambuke, nensuike udi mutapike tshilamba,
  ne nenkoleshe udi mutekete; kadi, nembutule udi ne manyi ne udi ne bukole. Wowu
  au nengudiishe dilumbuluisha.\u201d\\n17 \u201c\u2018Kadi nuenu, mikoko yanyi, monayi
  tshidi Mukalenge Mutambe Bunene Yehowa wamba: \u201cNkadi pa kukosa tshilumbu pankatshi
  pa mukoko ne mukoko mukuabu ne pankatshi pa bimpanga bia mikoko ne mbuji ya mpumbu.+\\n18
  Kudiila mu mpata mitambe buimpe ki nkunukumbane anyi? Nudi kabidi ne bua kudiatakaja
  mpata yenu idi mishale ne makasa enu anyi? Nuenu bamane kunua m\u00e2yi matoke t\u00f2\u00f2,
  nudi ne bua kunyanga m\u00e2yi nuadiata ne makasa enu anyi?\\n19 Mpindieu mikoko
  yanyi idi ne bua kudiila mu mpata mudiatakaja kudi makasa enu ne kunua m\u00e2yi
  manyanga ne didiatakaja dia makasa enu anyi?\u201d\\n20 \u201c\u2018Nunku, monayi
  tshidi Mukalenge Mutambe Bunene Yehowa ubambila: \u201cMmeme eu, meme nkayanyi nenkose
  tshilumbu pankatshi pa mukoko udi ne manyi ne mukoko udi munyane,\\n21 bualu, nuakatungunuka
  ne kuyisakila ne lubese luenu ne dikaya, ne nuakatungunuka ne kutua yonso ivua isama
  nsengu yenu too ne panuvua bayitangalaje miye miaba mikuabu.\\n22 Nempandishe mikoko
  yanyi, ne kayakulua kabidi tshintu tshia kukuata bua kudia+ to; ne nenkose tshilumbu
  pankatshi pa mukoko ne mukoko mukuabu.\\n23 Nenyijudile mulami umue,+ muena mudimu
  wanyi Davidi,+ ne yeye neayidiishe. Yeye muine neayidiishe ne nealue mulami wayi.+\\n24
  Meme, Yehowa, nendue Nzambi wayi,+ ne muena mudimu wanyi Davidi nealue mfumu munkatshi
  muayi.+ Meme muine, Yehowa, ngudi muakule.\\n25 \u201c\u2018\u201cNempunge nayi
  tshipungidi tshia ditalala,+ ne nengumbushe nyama ya luonji ya tshisuku mu buloba,+
  bua yoyi imone mua kusomba talalaa mu tshipela ne kulala mu metu.+\\n26 Nenyivuije
  yoyi ne tshitupa tshidi tshinyunguluke mukuna wanyi dibenesha,+ ne nendokeshe mvula
  mu tshikondo tshiende. Mabenesha nealoke bu mvula.+\\n27 Mitshi ya mu mpata neyikuame
  bimuma biayi, ne buloba nebupatule mamuma abu,+ ne yoyi neyisombe mu buloba talalaa.
  Nunku, neyifike ku dimanya ne: meme ndi Yehowa pandi ntshibula mitshi yayi ya tshikokedi+
  ne nyisungila kudi bavua bayikuate ku bupika.\\n28 Kayakulua kabidi tshintu tshia
