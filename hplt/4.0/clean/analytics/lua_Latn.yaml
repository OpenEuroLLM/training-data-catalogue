sample: '["\"Bible ku Enternete | BIBLE\u2014NKUDIMUINU WA BULONGOLODI BUPIABUPIA\\n39
  Tshikondo atshi Melodaka-baladana mukalenge wa Babilona, muana wa Baladana, wakatumina
  Hezikiya+ mikanda ne dipa, bualu uvua mumvue ne: uvua musame ne mumvue bimpe.+\\n2
  Hezikiya wakabakidila ne disanka, kubalejaye nzubu wende wa tshibutshilu tshia bintu
  biende bia mushinga:+ arjan, or, mafuta a mutshi wa bome ne mafuta makuabu a mushinga,
  bia mvita biende bionso, ne bintu bionso bivua mu bibutshilu biende. Kakuvua tshintu
  tshivua Hezikiya kayi mubaleje mu nzubu muende ne mu bukalenge buende buonso to.\\n3
  Pashishe muprofete Yeshaya wakabuela kudi mukalenge Hezikiya, kumuebejaye ne: \u201cBantu
  aba bavua bamba tshinyi? Mbafumine penyi?\u201d Ke Hezikiya kuamba ne: \u201cMbafumine
  ku buloba bua kule, ku Babilona.\u201d+\\n4 Pashishe wakebeja ne: \u201cMbamone
  tshinyi mu nzubu muebe?\u201d Hezikiya kuandamuna ne: \u201cMbamone bintu bionso
  bia mu nzubu muanyi. Kakuvua tshintu nansha tshimue tshimvua tshiyi mubaleje mu
  bibutshilu bianyi to.\u201d\\n5 Ke Yeshaya kuambila Hezikiya ne: \u201cUmvua d\u00eeyi
  dia Yehowa wa biluilu,\\n6 \u2018Mona! Matuku adi alua, ne bionso bidi mu nzubu
  muebe ne bionso bidi bankambua bebe badibutshile too ne dituku edi nebaye nabi mu
  Babilona. Kabakushiya tshintu nansha tshimue,\u2019+ ke mudi Yehowa wamba.+\\n7
  \u2018Nebangate bamue ba ku bana bebe bawalela, nebalue bena mudimu ba mu dibalasa
  dia mukalenge wa Babilona.\u2019\u201d+\\n8 Ke Hezikiya kuambila Yeshaya ne: \u201cD\u00eeyi
  dia Yehowa diudi muambe ndimpe.\u201d Pashishe yeye kuamba kabidi ne: \u201cBualu
  nekuikale ditalala ne dishindama tshikondo tshintshidi ne muoyo.\u201d+\"", "\"-\\nKinshasa
  : utungunuka ne luendu luenda lua mudimu mu matunga a mukua mufika , Felix Tshisekedi
  Tshilombo mufika ku Brazzaville mu ditunga dia congo dishiya dia musulu wa congo
  .\\n-\\nKinshasa: Ndituku kayi dikala mfumu wa ditunga mua kuteka ministre kavula
