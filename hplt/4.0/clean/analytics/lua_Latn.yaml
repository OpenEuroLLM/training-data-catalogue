  ba tshipuita anyi majorite parlementaire . koku kakuyi majorite parlementaire to
  . Mfumu wa ditunga udi ne tshia kusungula muntu ( Informateur )udi ne tshia kukeba
  tshibungu eshi .\\n-\\nKinshasa: Lelu ki dituku didi tshimamuenda wa bukalenga tshia
  mu tshimenga tshia kinshasa bitabuja ne bajadika mandat a ba tshipuita kunyima kua
  mudimu muenza kudi kasumbu ka pabuaku kavua kbanjija .\\n-\\nLubumbashi: Ba mpulushi
  ba mine bavua bakuata tones binunu 35 bia mabanji a muishi mua bulola Cobalt ne
  cuivre bivua biba kudi bena ditunga dia chine pamua ne bamua bena congo .\\n-\\nKananga
  : Ku kasai central , bantu bavua biba bintu mu lupangu lua chute katende bavua babalekela
  kudi munena umua wa ba mpulushi . Bionso ebi kunyiama kua bobu bamana kumupesha
  makuta . ki bua tshinyi mfumu wa kabukulu wa mu groupement Beena Kalubi dienda Zacharie
  Tshipamba Tshiakosa udi ulomba dkuata dia munena wa ba mpulushi ewu . kadi yeya
  muina udi wamba ne bintu bivua biba mbilama mu bilo bienda.\\n-\\nBunia : Nsombelu
  wa bena ku Ndo mu territoire wa Djugu udi wa kanyawu kunyima kua diosha misoku yabu
  20 kuenza mbingu isatu kudi bena mutumba nabu bena Walendu Pitsi. balombodi ba misoku
  eyi badi bela lubila kudi bena bukalenga ne bena moyi mulenga .\\n-\\nKinshasa:
  Mu tshimenga tshia kinshasa , bena mudimu ba SCPT uvua kale poste , mbapingana ku
