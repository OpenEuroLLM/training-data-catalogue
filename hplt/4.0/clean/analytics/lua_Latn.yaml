  kutuadijabu kuamba ne: \u201cYone kavua muenze tshimanyinu nansha tshimue to, kadi
  malu onso avua Yone muambe bua muntu eu avua malelela.\u201d+\\n42 Bantu ba bungi
  bakamuitabuja muaba au.\"", "\"Muyishi : Jean-Paul Lupemba Tshitenda\\nMuledibwa
