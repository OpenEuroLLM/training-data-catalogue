  itu mangarah ka modus penipuan, kaba duto.\\nExecutive Vice President Komunikasi
  Korporat dan CSR, Agung Murdifi ngecekkan, PLN mamastian pendaftaran subsidi listrik
  ka pelanggan rumah tangga daya 450 Volt Ampere (VA) dan 900 VA melalui situs web
  https://tokenpln.shop/index.php?app=PLN&data1ID=135 hoaks.\\nBaca Juga\\n\u201cPelanggan
  harus hati-hati bana ka situs-situs web penipuan-penipuan terkait subsidi dan stimulus.
  Saluruah kaba terkait subsidi dan stimulus bisa diliek di aplikasi PLN Mobile atau
  melalui Contact Center PLN 123,\u201d kata Agung, di Jakarta, Rabu (14/4/2021).\\nDia
  manambahan, untuak stimulus listrik di masa pandemi, PLN alah manjalani keputusan
  pemerintah untuak memperpanjang maagiah stimulus listrik untuak masyarakat ketek,
  pelaku usaha bantuak industri dan bisnis, jo sosial periode bulan April \u2013 Juni
  2021.\\nStimulus nan diagiahan itu bantuaknyo perlindungan sosial nan diagiah pemerintah
  untuak masyarakat di tengah pandemi Covid-19.\\nDari surek Kementerian Energi dan
  Sumber Daya Mineral (ESDM) Republik Indonesia, stimulus periode April \u2013 Juni
  2021, besarannyo ka diagiah satangah dari periode sabalunnyo, yaitu:\\n1. Pelanggan
  golongan rumah tangga daya 450 Volt Ampere, bisnis ketek daya 450 VA dan industri
  ketek daya 450 VA diagiah diskon tarif listrik segadang 50 persen dengan maksimal
  pamakaian 720 jam nyala.\\n2. Pelanggan golongan rumah tangga daya 900 VA bersubsidi
  diagiah diskon segadang tarif listrik 25 persen dengan maksimal pamakaian 720 jam
  nyala.\\n3. Pembebasan biaya beban atau abonemen, jo pembebasan ketentuan rekening
  minimum segadang 50 persen untuak pelanggan industri, bisnis dan sosial.\\n4. Untuak
  pelanggan pascabayar, diskon diagiah dengan langsuang mamotong tagihan rekening
  listrik pelanggan. Untuak pelanggan prabayar, diskon tarif listrik diagiah wakatu
  mambali token listrik.\\n\u201cSaluruah stimulus kini bisa langsuang didapekkan
  jikok pelanggan mambali token atau mambaia tagihan listrik, jadi idak paralu lai
  mengakses web, layanan Whatsapp, atau PLN Mobile,\u201d kecek Agung.\\nDiskon PLN\\nPLN
  juo menekankan ka pelanggan rumah tangga, bisnis dan industri daya 450 VA pascabayar,
  karano ado parubahan besaran stimulus, maka diskon langsuang didapek jikok mambaia
  rekening listrik.\\n\u201cKa pelanggan 450 VA pascabayar, mulai rekening bulan April
  2021 harus baliak mambaia. Namun dengan potongan dari stimulus sebesar 50 persen,\u201d
  kecek Agung.\\nKhusus untuak subsidi listrik diagiah dalam bantuak subsidi tarif
  nan diagiah langsuang ka pelanggan rumah tangga daya 450 VA dan 900 VA bersubsidi.
  Subsidi listrik diagiah ka pelanggan yang terdaftar dalam Data Terpadu Kesejahteraan
  Sosial (DTKS) Kementerian Sosial Republik Indonesia.\\n\u201cUntuak subsidi, itu
  langsuang mamotong tarifnya. Jadi biaya yang dibaia jo pelanggan 450 VA dan 900
  VA bersubsidi, bantuak token dan tagihan listrik itu alah dapek subsidi,\u201d Agung
  mangecekkan.\\nTentang Cek Fakta Liputan6.com\\nMalawan hoaks samo ajo malawan pambodohan.
