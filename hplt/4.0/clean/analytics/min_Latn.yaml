  "\"BESTLIRIKLAGU.COM \u2013 Berikut adalah paparan mengenai lirik Dek Ulah Kubik
  Mato yang dibawakan oleh Ridho Zulma.\\nCando si bisu barasian\\nIndak lah tantu
  ka di sampaikan\\nUlah di kubik kubik mato\\nLasak mangulik ngulik raso\\nUlah di
  kubik kubik mato\\nLasak mangulik ngulik raso\\nDima lah hati nan ka sanang\\nSiang
  jo malam uda tabayang\\nMambuek denai rindu rindu\\nAntah pabilo ka batamu\\nMambuek
  denai rindu rindu\\nAntah pabilo ka batamu\\nJikok basuo hati bakato\\nMuluik takunci
  lidah tak baraso\\nBak rupo patuang indak ba nyao\\nTagak tamanuang duduak baitu
  pulo\\nLai di tagah hati kareh juo\\nLai di rubah pangana di kapalo\\nBukan nyo
  hilang indak tabayang\\nKiro nyo bajadi tapikia uda surang\\nRaso raso kini basarang
  di dado\\nBak cando tangguli bapintak saka nyo\\nNyampang santano lai kandak jadi
  nyato\\nSanang sanang hati sajuak nan kiro kiro\\nDemikian lirik \u2018Dek Ulah
  Kubik Mato\u2019 sebagaimana di atas.\\nCredit:\\nJudul : Dek Ulah Kubik Mato\\nVoc
  : Ridho Zulma\\nCipt : Rozac Tanjung\\nArr : Aditya Fajrul\"", "\"Fasisme\\nFasisme
  adolah ideologi nan didasaan pado prinsip kapamimpinan jo otoritas nan absolut nan
  mano parintah pamimpin jo kapatuahan balaku tanpa pangacualian. Pantiang bana untuak
  ideologi fasis, karano ideologi ko salalu mambayangkan adonyo musuah, sainggo pamimpin
  jo tantara aruih kuaik manjago negara. Gerakan iko mampunyoi satu tujuan: mahancuan
  musuah, di mano musuah dikontruksikan dalam karangko konspirasi atau ideologi lain.
  Dalam caro bapikia fasis, musuah barado di mano-mano, baiak di madan parang maupun
  dalam bangso surang sabagai elemen nan indak sasuai jo ideologi fasis. Dalam ideologi
  fasis, akibaiknyo adolah individualisitas manusia ilang, jo pangikuik manjadi massa
  nan saragam di mano individu hanyo manjadi alaik untuak mancapai tujuan garakan
  fasis tasabuik.\\nGarakan fasis tamasuak adolah garakan radikal ideologi nasionali
  otoriter politik. Dalam ideologo fasis, massa indak dibulihan mampunyoi identitas
  nan baragam jo wajib saragam. Individualitas ilang karano kabhinekaan dilarang,
  ancuanyo identitas individu badampak massa mangambang nan dipimpin dek pamimpin
  kharismatik jo kakuasaan absolut.\"", "\"Dalam ilmu fisika, energi mekanik adolah
  jumlah energi potensial jo energi kinetik . Prinsip konservasi energi mekanik manyatokan
  baso jikok suatu sistem nan terisolir hanyo tunduak pado gaya konservatif, mako
  energi mekanik adolah konstan. Jikok suatu benda bagerak ka arah nan balawanan jo
  gaya barasiah konservatif, mako energi potensial akan maningkek; dan jikok laju
  (bukan kecepatan ) benda barubah, mako energi kinetik benda juo barubah. Namun,
  dalam sagalo sistem nan nyato, gaya nonkonservatif, sarupo gaya gesekan, akan timbua,
  tapi jikok gadangnyo indak diacuahkan, energi mekanik barubah saketek dan konservasinyo
  marupoan pendekatan nan baguno. Dalam tabrakan elastis, energi kinetik dikonservasi,
  tapi dalam tabrakan indak elastis babarapo energi mekanik dapek diubah manjadi energi
  termal . Kasataraan antaro energi mekanik nan hilang jo paningkekan suhu ditamukan
  dek James Prescott Joule .\\nTampilan\"", "\"Helikopter militer adolah helikopter
  nan khusus dibuek atau dikonversi untuak digunokan dek pasukan militer. Misi helikopter
  militer iyolah fungsi dari desain atau konversi. Panggunoan nan paliang umum dari
  helikopter militer iyolah transportasi pasukan, dek tu helikopter transportasi dapek
  dimodifikasi atau diubah untuak malakuan misi lain ajak combat search and rescue
  (CSAR), medical evacuation (MEDEVAC), pos komando udaro, atau bahkan diparsanjatoi
  jo sanjato untuak manyorang target darek. Helikopter militer khusus dimaksuikan
  untuak malakuan misi tatontu. Contoh helikopter militer khusus iyolah helikopter
  sorang, helikopter observasi dan helikopter parang anti-kapa salam.\\nHelikopter
  militer dikalompokkan sasuai jo kagunoan utamo inyo. Militer Amerika Sarikat punyo
  sistem klasifikasi universal sahinggo mamudahkan manganali paruntuakan sabuah helikopter.\\nTadapek
  babarapo klasifikasi helikopter iyolah: A \u2013 Attack (sorang), C \u2013 Cargo
  transport, H \u2013 Search and Rescue, R \u2013 Reconnaissance (pangintai), S \u2013
  Anti-kapal selam, M \u2013 Multi-mission atau multi-poran, T \u2013 Trainer, dan
  U \u2013 Utility.\\nCiek dari helikopter sorang nan populer iyolah AH-1 Huey Cobra.
  Helikopter iko banyak digunoan katiko Porang Vietnam. Cobra mulonyo dikambangkan
  untuak manjadi helikopter ringan dan mudah dikandalikan untuak mambao parsanjatoan
  ringan. AH-1 kudian batambah tingkatannyo manjadi Cobra Super nan mambao 24,15 cm
  roket Hydra dan misil anti tank Tube-launched Optically-tracked Wire-to-command-Link
  (TOW). Sadang, AH-64 Apache dirancang sabagai panghancua tank. Helikopter iko mambao
  meriam 30 mm dan dapek pulo mambao 16 roket Hellfire atau 76 roket 70mm.\\nTraining
  helikopter atau TH, digunoan untuak latihan militer. Bell TH-67 digunoan dek Angkatan
  Darek AS untuak malatih pilot, samantaro variasi Angkatan Lauik iyolah TH-57.\\nNan
  paliang dikana dari helikopter transportasi atau kargo militer iyolah helikopter
  rotor gando CH-46 Sea Knight. CH-47 Chinook marupoan helikopter rotor dan masin
  gando nan digunoan baiak sabagai pangangkuik kargo dan pasukan.\\nBabarapo helikopter
  militer mangalami modifikasi supayo dapek digunoan dalam babagai kaparoluan. Sabagai
  contoh, UH-60L Blackhawk marupoan versi modifikasi dari Anti-Submarine SH-60 Skyhawk.
  Helikopter tasabuik dapek juo dimodifikasi manjadi helikopter sarba guno MH-60G
  Pave Hawk saroto HH-60J Jayhawk punyo Coast Guard.\\nBabagai tipe helikopter diateh
  punyo guno babedo jo platform masin nan samo. Di antaro sadonyo jinih, helikopter
  multi-poran dapek dikatoan paliang baguno dan paliang fleksibel. Helikopter ajak
  MH-60G dapek malakuan misi infiltrasi ajak mandarekan pasukan khusus dan tabang
  pado sagalo cuaco. Sadang MH-60L marupoan Blackhawk nan alah ditingkekan spesifikasinyo
  sahinggo dapek baporan sabagai helikopter sorang jiko diparolukan.\"", "\"Gulai
  jariang marupuoan masakan nan babahan jariang nan diolah jo caro digulai. Dalam
  variasinyo, gulai jariang juo dicampua jo pucuak ubi jo ikan teri. Gulai ko bakuah
  bawarna kuniang kamerahan dek pacampuan bumbu kunyik jo lado giliang. Bahan-bahan
  nan digunoan kutiko mambuek gulai jariang yaitu, jariang nan indak terlalu mudo
  jo indak terlalu tuo. Samantaro untuak bumbu gulainyo tadiri dari santan, kunyik,
  bawang merah, bawang putiah, lado merah, katumba, langkueh, asam kandih, sarai,jo
  sipadeh.[1]\\nCaro mambuek gulai jariang yaitu abuih jariang sampai ampuak talabiah
  dahulu. Giliang bawang merah, bawang putiah, sipadeh, kunyik, jo lado sampai aluih.
  Campuan bumbu aluih jo santan, masak sampai mandidiah. Kutiko manjarangan santan
  aduak lambek-lambek jo taruih manaruih supayo indak pacah kuah.[2] Masuak an jariang,
  pucuak ubik, teri kutiko santan mandidiah. Tambahan sarai jo asam kandih, jarangan
  sampai jariang jo sayua ampuak.[3]\\n- Times, I. D. N.; Rosadi, Amir. \\\"Resep
  Gulai Jariang yang Pedas Gurih, Bikin Nambah Terus!\\\". IDN Times (dalam bahasa
  Indonesia). Diakses tanggal 2021-06-08.\\n- \\\"Tips Memasak Santan agar Teksturnya
  Tak Pecah dan Bercita Rasa Creamy\\\". kumparan (dalam bahasa Indonesia). Diakses
  tanggal 2021-06-08.\\n- Mustinda, Lusiana. \\\"7 Jenis Gulai Enak dari Minang, Mana
  yang Kamu Suka?\\\". detikfood (dalam bahasa Indonesia). Diarsipkan dari versi asli
  tanggal 2021-06-08. Diakses tanggal 2021-06-08.\"", "\"1Dek karano itu, oih sudaro-sudaro
  ambo nan tacinto, bakcando itulah andaknyo angku-angku iduik, jo sacaro sabana-bana
  ba iman kapado Tuhan. Ambo taragak sangaik jo angku-angku! Angku-angkulah kabanggaan
  ambo nan mambuwek ambo bagadang ati.\\n2Sudari Euodia jo sudari Sintike! Ambo sabana
  mamintak, supayo sudari sahati sabagai urang-urang nan sa iman.\\n3Kabake kanti
  ambo nan satiya, ambo mamintak pulo, supayo angku mambantu kaduwo urang padusi tu.
  Inyo lah bakarajo kareh samo-samo jo ambo, untuak mambaritokan Injil nan dari Allah;
  samo jo si Klemen, sarato jo kasadonyo urang nan lain bagai, nan bakarajo samo-samo
  jo ambo. Namo urang-urang tu ado tatulih di Kitab Kahidupan.\\n4Mudah-mudahan angku-angku
  tatap basukocito, dek karano angku-angku iduik lah basatu jo Tuhan. Sakali lai ambo
  katokan: basukocitolah!\\n5Andaknyo kasadonyo urang dapek maliyek, tingkah laku
  angku-angku nan elok ati. Dek karano, indak ka lamo lai Tuhan datang.\\n6Janlah
  ado ciyek juwo nan dikuwatirkan. Dalam sagalo parkaro, badowalah, sampaikanlah pintak
  angku-angku kapado Allah. Apo nan angku-angku paralukan, tataplah ma agiah tawu
  kapado Allah, sarato batarimo kasih lah.\\n7Mako aman santoso nan dari Allah, nan
  indak mungkin dapek dipahami dek manusia, ka manjago ati sarato jo pikieran angku-angku,
  nan lah basatu jo Isa Almasih.\\n8Akienyo sudaro-sudaro, isilah pikieran angku-angku
  jo parkaro-parkaro nan ba arago, nan patuik dipuji, iyolah parkaro-parkaro nan bana,
  nan ta aromaik, nan adie, nan suci, nan manih, sarato jo nan baiak.\\n9Karajokanlah
  apo nan lah angku-angku paraja-i, sarato jo apo nan lah angku-angku tarimo dari
  ambo; biya dari kato-kato ambo, ataupun dari karajo-karajo ambo. Allah tampaik asanyo
  aman santoso, ka manyaratowi angku-angku.\\n10Dalam iduik ambo nan basatu jo Tuhan,
  ambo maraso bahagia sangaik, dek karano sasudah baitu lamo, mako kinikolah baru
  talakik baliak di angku-angku, untuak mamikiekan ka adaan ambo. Mukasuik ambo indak
  mangatokan, baraso angku-angku lah malupokan ambo doh; angku-angku iyo layi mamparatikan
  ambo, tapi angku-angku indak ado kasampatan untuak ma ujuikkannyo.\\n11Ambo bakato
  bakcando iko, indak dek karano ambo bakakurangan doh, ambo lah baraja maraso cukuik
  jo apo nan ado.\\n12Ambo lah mancubo iduik sagalo sayuik, lah mancubo pulo iduik
  balabiah-labiah. Ambo lah tawu rasiyonyo, untuak ma adok-i sagalo macam ka adaan;
  biya dalam ka adaan kayo, ataupun dalam ka adaan bansaik, biya dalam ka adaan mewah,
  ataupun dalam ka adaan bakakurangan.\\n13Jo kudaraik nan dibari dek Isa Almasih
  kabake ambo, ambo punyo kakuatan untuak ma adok-i sagalo macam ka adaan.\\n14Tapi
  angku-angku lah manolong ambo, dalam ambo kasusahan; apo nan angku-angku pabuwek
  tu, adolah sasuatu nan baiak.\\n15Oih sudaro-sudaro urang Filipi! Angku-angku sandiri,
  tawu bana baa ka adaan ambo, kutiko barangkek dari Makedonia dulu, kutiko partamu-tamu
  Injil tu ambo baritokan, angku-angku sajolah jamaat nan mambantu ambo; angku-angku
  sajolah jamaat nan sato mangicok, labo jo rugi samo-samo jo ambo.\\n16Kutiko ambo
  di Tesalonika, ambo mamaralukan bantuan, lah labiah dari sakali angku-angku mangirin
  bantuan kabake ambo.\\n17Itu bukan ba arati, baraso ambo hanyo niyo manarimo pambarian.
  Nan ambo inginkan iyolah, supayo ambo dapek maliyek asie-asie nan manambah ka untuangan
  angku-angku.\\n18Ambo lah manarimo kasadonyo -- malah labiah daripado cukuik! Kasadonyo
  pambarian nan angku-angku kirin kabake ambo, lah ambo tarimo dari si Epafroditus.
  Kiniko ambo lah punyo sagalo sasuatu, apo nan ambo paralukan. Sagalo pambarian nan
  dari angku-angku tu, adolah bakcando baun nan arun dari karoban nan dipasambahkan
  kapado Allah, nan ditarimo dek Allah jo sanang ati.\\n19Allah nan ambo sambah, kakayoan-Nyo
  nan malimpah dalam Isa Almasih, ka mancukuikkan sagalo kaparaluan angku-angku.\\n20Tapujilah
  Allah Bapak kito salamo-lamonyo! Amin.\\n21Sampaikanlah salam ambo kabake sadonyo
  umaik Allah, nan basatu jo Isa Almasih. Tarimo pulolah salam dari sudaro-sudaro
  kito, nan ado samo-samo jo ambo disiko.\\n22Kasadonyo umaik Allah di kota ko, tarutamu
  urang-urang nan dari istana Kaisar, bakirin salam pulo kabake angku-angku.\\n23Mudah-mudahan
  Tuhan Isa Almasih mambarakaik-i angku-angku kasadonyo. Salam aromaik dari kami,
  Paulus sarato jo Timotius\"", "\"Denaiko tau maukua Jo bayang..manolah mungkin tinggi
  katajangkau.\\nSadangkan adiak urang nan tapandang .\\nMungkin bamimpi Adiak Kaden
  pinang\\nCw\\nJikok bakureh Iyo sakuaik tanago..jikok maanta handak lah sampai sampai..usah
  manyarah jikok balun kalah..patahan kan Cinto Jo kasiah sayang..\\nCo\\nAlah jaleh
  si ikan sapek..usah di samokan Jo kalui\\nAlah jaleh denaiko bansaik..tak mungkin
  adiak kamamakai\\nCw\\nJikok hati nan alah Kanai..Denai tak mamandang dek harato\\nAsakan
  Uda lai basungguah sungguah..\\nDen tarimo apo adonyo\\nNOTICE : Jika masih terdapat
  konten lirik yang kurang benar, silahkan Anda hubungi admin via WA 085203781053.
  Jangan lupa untuk share ke teman Anda melalui media social di bawah ini.\"", "\"Oi
  adiak nan manih baa bainai kuku kiniko\\nPalawan dunia rang bacincin ameh yo di
  jarinyo\\nPalawan dunia rang bacincin ameh yo di jarinyo\\nUda sangko adiak lah
  ka baralek jo urang lain\\nAlun lai oi uda alun taniaik di hati ambo\\nUmua alun
  cukuik badan nan sadang yo basikola\\nKok iyo malawan dunia rang banyak bacincin
  ameh\\nTarimolah cincin untuak diak sayang tando pangikek\\nTakuik den kok hilang
  tagamang jari bacincin ameh\\nIndak ka tagamang bialah uda nan malakekkan\\nKok
  lai namuah bana diak manarimo cincin pangikek\\nIndak nan sasuai di jari ambo apo
  ka dayo\\nJikok yo baitu di batin sajo janji dipadu\\n[kembali ke atas]\\n(Ciptaan
  Masroel Mamudja, Dipopulerkan oleh Upik Saunang dan Andi Mulya)\\n\u00a9ourtesy
  of http://laguminanglamo.wordpress.com/\\nPengunjung Terbaru\"", "\"Institut Teknologi
  Bacharuddin Jusuf Habibie nan disingkek ITH[2][3] adolah Perguruan Tinggi Negeri
  nan barado di Kota Parepare, Sulawesi Selatan, Indonesia. Didirian badasarkan Paraturan
  Presiden Nomor 152 Tahun 2014 tentang Pendirian Institut Teknologi Bacharuddin Jusuf
  Habibie (Lembaran Negara Republik Indonesia Tahun 2014) nan ditetapan Presiden Republik
  Indonesia Susilo Bambang Yudhoyono dan diundangkan pado tanggal 17 Oktober 2014.
  Kampus Institut Teknologi Bacharuddin Jusuf Habibie atau ITH mulai baoperasi atau
  manarimo mahasiswa baru pado taun 2022. Salain ITB, ITS, ITERA jo ITK, kini Pamarentah
  Indonesia mampunyoi limo Institut Teknologi nan bastatus Negeri.\\nHabibie Center
  malalui Direktur Komunikasi, Andi Makmur Makka pado 9 Desember 2004 mampunyoi rencana
  untuak mambangun perguruan tinggi di kota kalahiran B. J. Habibie di lokasi Gedung
  Pemuda Parepare. Rencana pandirian tasabuik akan dilaksanakan pado taun 2005. Tadapek
  2 alternatif bantuak perguruan tinggi nan akan didirikan yakni STIE (Sekolah Tinggi
  Ilmu Ekonomi) kok indak politeknik.[4]\\nIde pandirian Institut, bamulo katiko Presiden
  Indonesia Susilo Bambang Yudhoyono bakunjuang ka Parepare, pado 20 Februari 2014.
  Susilo Bambang Yudhoyono badiskusi jo Walikota Parepare Taufan Pawe mangenai ide
  untuak mambangun Perguruan Tinggi Negeri di Kota tasabuik.\\nSakitar 6 bulan sasudahnyo,
  pado 28 Agustus 2014, pambangunan gedung rektorat Institut Teknologi Habibie diresmian
  dek mantan Presiden ka-3 B. J. Habibie nan balokasi di Jalan Pemuda.[5] Kamudian
  Institut Teknologi Habibie barubah manjadi Institut Teknologi Bacharuddin Jusuf
  Habibie disingkek ITH malalui Peraturan Presiden Nomor 152 Taun 2014 pado 17 Oktober
  2014.\\nTujuah taun sasudah pandirian ITH, ditabikan peraturan kelembagaan jo tata
  karajo malalui Peratura Menteri Pendidikan dan Kebudayaan Republik Indonesia, Nomor
  21 Tahun 2021 pado tanggal 4 Agustus 2021, Organisasi dan Tata Kerja. Mako mulai
  tanggal 14 Agustus 2021 sacaro resmi Institut Teknologi Bacharuddin Jusuf Habibie
  mulai baroperasi.[6]\\nPado 4 Oktober 2021, Ansar Suyuti ditetapkan sebagai Rektor
  Institut Teknologi Jusuf Habibie malalui Keputusan Menteri Pendidikan, Kebudayaan,
  Riset dan Teknologi Republik Indonesia, Nomor 67373/MPK.A/KP.07.00/2021, tentang
  Pengangkatan Rektor Institut Teknologi Bacharuddin Jusuf Habibie periode 2021 -2025.[7]\\nITH
  manyalanggaroan 2 jurusan dengan 11 program studi nan ado di bawahnyo. Program studi
  nan ado di ITH badasarkan jurusannyo masiang-masiang antaro lain:[8]\\n- Matematika\\n-
  Sistem Informasi\\n- Bioteknologi\\n- Sains Aktuaria\\n- Sains Data\\n- Ilmu Komputer\\n-
  Teknologi Pangan\\n- Teknik Metalurgi\\n- Teknik Sistem Energi\\n- Teknik Sipil\\n-
  Arsitektur\\nNamun, saat iko ITH sadang malakuan proses panambahan 1 jurusan baru
  jo 9 program studi baru lainnyo.\\n- \\\"Dikti.go.id \u2013 Kampus Institut Teknologi
