  "\"Serabi adolah marupoan jajanan pasa tradisional nan barasa dari Indonesia. Serabi
  barasa dari bahaso Jao nan barasa dari kati \\\"rabi \\\" nan barartian '''' kawin
  \\\". hal iko mungkin dek proses mambueknyo nan sabanta dan indak talalu lamo sahinggo
  urang-urang Jao manyabuiknya sabagai Serabi (seperti proses sekali kawin). Di Jawa
  Barat serabi dikana dengan nama surabi atau sorabi. Di Jawa, serabi umumnyo disajikan
  jo isian gulo atau manisan lainnyo. Tapi jo urang Sunda serabi ko disajikan jo oncom
  dan asinan lainnyo. Serabi ko biasonyo di jua padi pagi hari nan dimasak di tungku,
  sahonggo manghasilkan baun nan khas. Kadang talua ayam nan alah dikocok dimasuakkan
  ka dalam adonan nan sadang dimasak. Sairiang jo perkembangan zaman, banyak nan yang
  alah ber-inovasi jo serabi ko dengan manambahan isian atau topping kadalam serabi
  tasabuik seperti keju, karambia, sosis, mayones untuk mangubah bahwa serabi ko adolah
  makan urang manangah kabawah. Kini serabi alah terkenal dengan isi nan bavarisi
  dan tasaba di kota-kota gadang sarupo Jakarta, Bandung, dan Bogor.[1]\\nSejarah[suntiang
  | suntiang sumber]\\nSerabi berasa dari bahaso Sunda yaitu \\\"sura\\\" nan barati
  gadang. Serabi atau surabi (dalam bahaso sunda) adolah makanan atau lanjo pasa khas
