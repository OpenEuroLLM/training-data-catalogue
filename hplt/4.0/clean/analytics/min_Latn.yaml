  Diakses tanggal 13 Maret 2022.\\n- \\\"Institut Teknologi Habibie\\\". Institut
  Teknologi Habibie. Diakses tanggal 2023-06-21.\"", "\"Di muko palanta lapau ubek
  Mak Sati tabantang spanduk babunyi:\\nSELAMAT DATANG PESERTA DISKUSI PIL KADA. (tanggal
  14? 5 ? 2010, pukua 13.00, sudah Jumahat)\\nMak Sati ko, ado-ado sajo nan dibueknyo.
  Baliau pandai mamanfaatkan situasi, sahinggo aktivitas baliau tu hiduik.\\nKatiko
  pamarentah merencanakan Pil Kada, Mak Sati lah mandahului jo diskusi.\\nTapi itu
  alun tantu samo jo Pil Kada pamarentah. Mungkin Mak Sati promosi ubek kada. Nan
  rancak awak singgah sabanta supayo jaleh di awak apo bana mukasuik spanduk nan dipasang
  Mak Sati; Sutan Kayo manangahi karaguan rombongan.\\n\\\"Assalamualaikum\\\" Alaikumsalam,
  si Usuik nan manjawab. Mak Sati indak nampak.\\n\\\"Di maa Mak Sati Suik?\\\" Ajo
  Udin batanyo.\\nAdo di dalam; masuaklah! Dari dalam lapau Mak Sati manyambuik nan
  datang sambia manyalami surang-surang.\\nTamu lah duduak di tampaek masiang-masiang.
  Mak Sati lansuang ka kurisi tinggi.\\nMak Sati mamuloi. \\\"Baa, labiah saputaran
  indak tampak puncak iduang angku-angku. Kama sajo bakaliaran?\\\" Bak caro ikolah
  Mak Sati, kami cuma indak singgah saja katiko lalu di muko kadaiko. Indomo manjawab
  mawakili kasadonyo.\\n\\\"Kini apo carito angku-angku? Sia nan ka maanta kecek,
  silakan\\\".\\nIndomo manggaregeh mangecek manyampaikan mukasuik rombongan.\\n\\\"Macamko
  Mak Sati. Kami nak tahu makasuit isi spanduk nan tapasang di muko tu. Kini kami
  datang nak batanyo, apokah Mak Sati mempromosikan sejenis ubek kada nan ka dijua
  atau diskusi tantang pamilihan kapalo daerah.\\\"\\nBaiklah angku-angku. Ambo ucapkan
  tarimo kasih karano syaraf angku-angku tagisia dek kalimaek spanduk.\\nDangakan
  elok-elok, awak mulai diskusi awal hari ko juo.\\nIsi spanduk tu adolah kreasi Mak
  Sati surang. Nan ka dibicarokan khusus pil kada awak, untuak paubek kada urang Sumbar
  nan daerah kekuasaannyo barado di Minangkabau.\\nSelaku urang Minangkabau, tantu
  awak harus taimbau mampaeloki nan rusak, apolai nan manyangkuit nasib anak-kamanakan
  nan barado di kampuang.\\nKarano kato pil dari bahaso Balando, nan lah manjadi bahaso
  kito, tantu awak lah mangarati apo makasuitnyo.\\nDari segi bahaso Pil Kada aratinyo
  ubek kada.\\nKada ado duo macam.\\n1. Kada nan sabana kada, yaitu panyakik kulik
  nan namonyo bamacam-macam, sarupo, tukak, pakuang, kurok. Urang kanai panyakik kada
  dapek digambarkan jo kato-kato; alah ditukak jo ditekong, kanai pakuang-baliliaran,
  kini barumah di tapi ayia.\\n2. Nan kaduo, kada dalam arati kiasan, yaitu kada dakam
  utak. \\\"Utaknyo di kada\\\", mukasuiknyo urang tu bodoh, indak bisa babuek nan
  batua, pikiaran condoang ka nan jahek.\\nNan ado dalam spanduk , dalam pangaratian
  nomor duo yaitu kiasan. Diskusi pil kada akan diarahkan, untuak malihek tando-tando
  urang nan indak bakada utaknyo atau kalau tampak tando-tando bakada utaknyo jaan
  sampai dipiliah.\\nJadi hasil diskusi iko, nanti akan menghasilkan tando-tando urang
  nan indak bakada dan mancubo mengetahui tando-tando utak bakada tu! Jikok tando-tando
  samacam itu ado di salah surang calon kapalo daerah, inyo jan sampai dipiliah, Pono
  mancubo maresume.\\nAmbo tambahi. Ajo Udin maagiah filsafat , aratie nyo awak maingekkan
  wae sabalun kanai.\\nBatua, iyo itu bana, jawab Mak Sati.\\nMateri diskusi alah
  disiapkan Usuik. Kok lah salasai diolah, disarahkan ka tim sukses.\\nUsuik, cobo
  bao kamari ramuan pil kada. Agiah sabungkuih surang, iko babantuak resep.\\nDek
  karano resepko indak dari doto, tapi dari Mak Sati sahinggo awak masiang-masiang
  dapek mambaco.\\nSetelah dibagikan, si Usuik mambacokan resep.\\nNan lain manyimak.\\nResep
  pertamo tantang kamampuan raso seorang kapalo daerah.\\n1. Kapalo daerah harus mamiliki
  kategori sarupo kayu gadang di tangah padang.\\nBatangnyo tampaek rang basanda,
  ureknyo tampaek rang baselo, dahannyo tampaek urang bagantuang, daunnyo tampaek
  bataduah diari hujan, tampaek balinduang di ari paneh, buahnyo elok dimakan.\\n2.
  Harus arif bijaksano. Tau diereng dengan gendeang, tau di ribuik ka mandingin\\n3.
  Indak sombong, gapuak indak mambuang lamak, cadiak indak manjua kawan\\n4. Harus
  adia, manimbang samo barek, maukua samo panjang\\n5. Harus jujur, bulek indak basandiang,
  indak manuhuak kawan sairiang\\n6. Disiplin, batanggo naik, bajanjang turun, kusuik
  manyalasai, karuah mampajaniah.\\nResep nan kaduo tantang kamampuan pareso nan harus
  dimilikinyo. Kini jaman globalisasi kato urang. Dunia alah manjadi satu dalam bidang
  informasi dan transportasi, lalu manyusul pulo bidang-bidang lainnyo pada kehidupan
  manusia maso kini.\\nKapalo daerah harus mangarati pulo tantang masalah iko.\\nKini
  kamajuan diukua, jo kemampuan Sumber Daya Manusia manusianyo.\\nKapalo daerah Sumbar
  nan ka datang haruslah urang nan mangarati bana tantang konsep dan keuntungan industri
  otak nan digagas pak Emil Salim.\\nJadi bukan urang nan hanyo sibuak mamikiakan
  industri \\\"gulai utak\\\" untuak menservis wisatawan!\\nDaerah Sumbar secara budaya
  dan SDA pendukuang saroto geografisnyo indak cocok untuak industri-industri hiburan
  semacam itu.Kok inyo mangundang penanam modal industri tekhnologi canggih pertanian-peternakan,
  dan pendidikan, hal iko indak masalah dek awak.\\nTapi kalau mangundang penanam
  modal untuak industri industri permen, rokok sarato karaoke, jo panti pijat, itu
  namonyo mambao panyakik untuak anak-kamanakan.\\nTamasuak pulo barang-barang nan
  lah bisa dibuaek dek urang kampuang sarupo kecap, sabun, kopi indak paralu didatangkan
  urang dari lua.\\nJaan sampai kapalo daerah indak mangarati permasalan sarato parubahan
  sarupo itu. Contoh keteknyo tantang internet sebagai sarana gratis atau katokanlah
  murah untuak mendapek informasi atau ilmu pangatuhuan ko. Kapalo daerah awak nan
  lalu-lalu, alun ado nan manaruah perhatian serius untuak pemanfaatannyo.\\nIyoko
  duo resep atau resep raso jo pareso. Bahas surang-surang, karano angku-angku punyo
  labiah dari ambo nan hanyo tamat sakolah desa jaman saisuak.\\nAngku nan balimo
  tacatat sebagai peserta diskusi. Hasilnyo nanti awak sarahkan manjadi baka Tim Sukses.\\nJadilah
  Mak Sati. Sutan Kayo mintak pulang. Ibarat kapa lah manapi, ibarat golek lah tibo
  di nan data. Dari spanduk lah tantu jantan batinonyo. Kami balimo lah dicatat si
  Usuik sebagai peserta.\\nAsalamualaikum ww. Tiok urang basalam jo Mak Sati.\\nDikarang
  oleh : N. I. St. Sati jo Admin\"", "\"Intro F C G C F C G C G C sabalun uda.. F
  basosok denai uda jo sia.. G manjalin cinto.. C kasih jo sayang katokanlah da..
