sample: '["\"Kota (\u5e02 shi ) adolah ciek dari tingkatan unit administrasi di Jopang.
  Kota punyo level nan satingkek jo kota ketek (\u753a machi ) dan desa (\u6751 mura
  ). Nan manjadi pambedo kota jo kota ketek dan desa iyolah sacaro administrasi kota
  indak barado di dalam suatu distrik (\u90e1 gun ). Sabagaimano halnyo definisi administratif
  lainnyo, hal tasabuik tatuang pado Hukum Otonomi Lokal nan ditotapkan pado taun
  1947.\\nPado umumnyo, sabuah kota ketek atau desa dapek manjadi sabuah kota jiko
  populasinyo maningkek malabihi 5.000 jiwa, dan sabuah kota dapek (tapi indak pasti)
  manjadi sabuah kota ketek atau desa jiko populasinyo bakurang hinggo di bawah 5.000
  jiwa. Kota jo populasi labiah dari 200.000 jiwa dapek maningkek levelnyo manjadi
  ciek dari tigo status khusus: kota khusus, kota inti, atau kota tapiliah.\"", "\"Gelaran
  Tabligh Akbar yang dihelat Pimpinan Daerah Muhammadiyah (PDM) Kota Padang dalam
  rangka peringatan puncak Milad Ke-111 Muhammadiyah Tingkat Daerah Kota Padang diapresiasi
  Wali Kota Padang Hendri Septa.\\n12 November 2023\\nAnggota Dewan Perwakilan Daerah
  Republik Indonesia (DPD RI) Leonardy Harmainy Dt. Bandaro Basa, S.IP, MH hadir membuka
  Open Tournament Sepak Takraw DPD Pekat IB Padang Pariaman di Lapangan Takraw Kampung
  Caniago Korong Sungai Dandang, Nagari III Koto Aur Malintang Selatan, Sabtu (11/11/2023).\"",
