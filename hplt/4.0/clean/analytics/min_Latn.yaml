  atau Gu\u01cengf\u01d4 \u5e7f\u5e9c/\u5ee3\u5e9c adolah sub-grup Cino nan ba\u00e2sa
  dari Guangdong, Cino Salatan. Urang Guangfu umumnyo takana jo istilah Urang Guangdong
  atau Urang Kanton. Di Asia\\nTenggara, tamasuak Indonesia, acok disabuik sabagai
  Urang Konghu. Urang Guangfu ado duo pangelompokan nan babeda sasuai jo daerah asal
  dan pamakaian dialeknyo. Sabananyo Katon adolah untuk panyabutan dalam bahaso inggrih
  untuk kota Guangzhou.\\nSalah satu nan mambuek urang Katon ko tanamo adolah caronyo
  datang ka Indonesia, pado awalnyo urang-urang katon banyak datang ka Indonesia sabagai
  tukang kayu, dan makanan nan tanamo dari urang kato kini adoah Dim Sum[1]\\nPertama
  adolah kalompok Xiayi nan labiah umum dianggap sabagai urang Guangfu. Leluhurnyo
  adolah urang Baiyue. Dengan Guangzhou sabagai pusat, tasebar di sakitar daerah delta
  Sungai Zhu Jiang, mode Hongkong, Foshan, Nanning dan sebagainya, jo dialek bahaso
  Yue sabagai bahaso ibu. Kaduo adalah kalompok Guangyi nan mancakup sadolah keturunan
  nan ba dialek bahaso Yue di sadolah Provinsi Guangdong dan bahkan bagian dari daerah
  di Provinsi Guangxi.\\nSadangkan untuak Cino parantauan, hanyo kenal dan punyo ciek
  pangaratian tentang daerah asalnyo yaitu daerah Guangdong jo bahaso dialeknyo yang
  awak sebut sabagai bahaso Konghu.[1]\\nCiri nan paliang mancolok dari urang Kanton
  adolah bahaso nan dipakai dek urang tu. bahaso kanton takenal jo bahaso gaul dan
  slang words. bahaso kanton indak dialek bahaso Mandarin, malainkan bahaso surang.
  Bahaso ko dipakai di Cino salatan jo marupokan asal dari babarapo istilah bahaso
  Cino nan babedo.[2]\\nBahaso kanton adolah salah ciek dialek bahaso Cino Yue nan
  dipakai di Hong Kong dan Makau. Samantaro di Guangdong dan Guangxi, Mandarin dipakai
  sabagai bahaso rasmi di sikolah dan kantua. Untuak komunikasi sahari-hari, inyo
  manggunoan bahaso Kanton.[3]\\nManuruik penelitian ahli bahaso di Cino, bahaso nan
  di gunoan urang-urang Koaton iko marupoan ciek dari bahaso nan tatuo nan masih basiso,
  bahaso iko duunyo digunoan pado maso dinasti Tang. Saat kini ko tahituang sakita
  80 juta urang nan manggunoan di dunia, dan panggunoan bahaso Katon ko labiah banyak
  dari pado panggunoan bahaso Hokkian nan tahituang sakita 40 juta panutua di dunia.[4]\\nDaerah
  delta Sungai Zhu Jiang mencakup daerah Huizhou, Shenzhen, Dongguan, Guangzhou, Zhongshan,
  Zhuhai, Jiangmen, Zhaoqing, Hongkong dan Macau. Mangrupokan salah ciek daerah paliang
  padet panduduak di Cino. Tarutamo dearah Shenzhen, Dongguan dan Guangzhou marupokan
  daerah nan paliang awal dibukak sabagai daerah perekonomian khusus di Cino.[5]\\nHuizhou
  punyo sajarah nan sangaik lamo, dari dulu alah takenal jo julukan daerah takenal
  di Lingnan dan pintu daerah Yue timur. Kini marupokan salah ciek markas produk elektornik
  di Cina. Sadangkan Shenzhen nan kini manjadi sister city jo kota Batam, marupokan
  sabuah daerah ekonomi khusus nan baru dibuek dan mulai dibangun pado tahun 1979
  atas ide dari Deng Xiaoping. Dalam jangka wakatu hanyo 28 tahun, Shenzhen kini alah
  manjadi daerah tujuan bisnis maupun wisata utamo di Cina. Kota Shenzhen punyo latak
  geograpi nan sangaik strategis karano basabalahan langsuang jo Hongkong. Sabananyo
  jo kota Zhuhai nan basabalahan langsuang jo Macau.[5]\\nDongguan basamo-samo jo
  Nanhai, Shunde dan Zhongshan mandapek julukan sabagai ampek macan ketek Provinsi
  Guangdong. Sadangkan Guangzhou, nan marupokan ibu kota dari Provinsi Guangdong,
  jo julukan sabagai Pintu Utama Selatan Tiongkok, marupokan pusat politik, ekonomi,
  ilmu pengetahuan dan transportasi di Tiongkok Selatan. Guangzhou kini marupokan
  kota katigo tagadang di Cinokok setelah Shanghai dan Beijing. Dan pado tahun 2010
  marupokan kota palaksanaan ASEAN Games nan ke 16.[5]\\n- \\\"Suku Tionghoa di Indonesia;
  Hokkian, Hakka, Kanton, Tiochiu, Hainan\\\". TIONGHOA.INFO (dalam bahasa Inggris).
