  pintu cinto.. Outro F C G C F C G C G Fadeout\\nDISCLAIMER Indonesiachord is focused
  on providing song\u2019s lyrics and chords as an appreciation to the authors and
  composers who have dedicated their life in music industry, especially in Indonesia.
  All lyrics and their chords are originally derived from trusted sources and also
  from our contributors. The copyright of all songs and lyrics are owned by their
  respective authors, artists, and music labels.\"", "\"Si Kamba Padang Laweh Jo Rimbo
  Sasek\\nOleh : Hamza Afra Joneidi (Mahasiswa Sastra Minangkabau FIB Unand)\\nPada
  maso dulu, tadapeklah surau tuo di nagari Padang Laweh, Kabupaten Sijunjung. Surau
  tu manjadi tampaik manuntuik ilmu agamo dek anak-anak sarato tampek baraja silek
  untuak paga diri diwakatunyo kagadang bisuak. Surau tu iolah punyo angku nan banamo
  Angku Satiah. Umua nan sampai 60 tahun, mambuek daguaknyo jadi ladang dek urek gigi
  atau jangguik. Putiah rambuik angku tu, acok tatutuik dek kupiah nan indak pernah
  lapeh jak lakek di kapalo.\\nPadang Laweh iolah nagari nan banyak carito ghoibnyo.
  Dakek surau Angku Satiah tu, tapeknyo di balakang surau. Tadapeklah rimbo gadang
  nan jarang diinjak dek urang kampuang. Konon caritonyo, rimbo tu acok disabuik dek
  urang rami jo Rimbo sasek (rimbo maliang). Ikolah nan mambuek urang sakampuang indak
  talok mancari kayu ka dalam rimbo tu. Kabanyo, kalau sakali masuak ka rimbo tu,
  indak bisa pulang awak dibueknyo.\\nSuatu maso, habih hari baganti bulan, habih
  bulan baganti tahun. Lahialah anak kamba jak di induak nan barumua 36 tahun. Anak
  Kamba nan lahia tu manjadi anak kaduo jo katigo dalam kaluarga tu. Induak nan banamo
  Sipina jo lakinyo nan banamo si Bujang Itam, maagiah namo anak kambanya tu jo Yoga
  Yogi. Di sikolah mulai tabukak carito Rimbo Sasek jo si Kamba panamu jalan untuak
  ka pulang.\\nSuatu hari, Amak Yoga Yogi pai ka sawah untuak manyiang padi nan sadang
  tumbuah jo rumpuik lia. Sambia tu pulo Sipina \u201cmanyiang padi, ikan tabawok
  pulang\u201d. Karano, di sawah Sipina tu, aia nyo tamasuak dalam. Jadi anak ikan
  (ikan inuak-inuak) banyak nan iduik di aia sawah tu, bisa ditangguak katiko sadang
  manyiang padi.\\nSalain Sipina pai ka sawah, laki Sipina biasonyo pai manakiek gatah
  jak pagi hinggo patang. Ikolah laki nan tamasuak pakarajo, \u201cpai pagi, pulangnyo
  patang\u201d. Jadi anak kambanyo tu biaso ditingga karano umuanyo lah masuak 12
  tahun. Jadi, salamo urang tuonyo karajo, si Kamba bisa pai main ka rumah kawan-kawannyo
  sasudah pulang sikolah.\\nSuatu katiko, lah pulang sikolah taragaklah Si Kamba pai
  main ka surau tuo nan ado di nagari nyo tu. Salain taragak, anak-anak tu nio basobok
  pulo samo angku nan tingga di surau tu. Tujuannyo untuak mamintak diajaan mangaji
  surek sarato silek. Karano anak-anak nagari Padang Laweh tu, keteknyo lah harus
  tau jo ilmu surek tambah saketek ilmu silek.\\nKatiko sumbahyang zuhur lah salasai.
  Sampai lah Si Kamba samo duo kawannyo di surau tu. Namo kawan Yoga Yogi tu iolah
  Isik jo Dito. Masuaklah ampek sakawan tu ka surau untuak basobok jo angku nan dicari.
  Kironyo, dek mulo langkah pakai Bismillah, basobok lah anak-anak tu jo Angku Satiah
  nan dicari.\\n\u201cAssalamu\u2019alaikum\u201d anak-anak mengecekan salam basamo-samo.\\n\u201cWaalaikumussalam\u201d
  Jawek Angku Satiah\\n\u201cPak Angku, kami nio mancari pak angku bana mah. Kami
  nio baraja samo Pak Angku\u201d Kecek Yoga sambia mancaliak salayang ka kawan-kawannyo.\\n\u201cIyo
  Pak Angku, kami nio baraja ngaji surek sarato silek\u201d Kecek Isik sambia manyambuang
  kecek Yoga.\\nSabalun dijawek dek Angku Satiah, surau tu lah ado pulo di isi dek
  anak-anak nan baraja ngaji sarato silek sarupo nan dimintak dek ampek sakawan tu.
  Rancaknyo, anak-anak nan mangaji tu harus lalok di surau malam hari, siang buliah
  pulang kok taragak basobok samo urang tuonyo atau pulang minta bareh nan lah habih.\\n\u201cRancaklah
  kok lai sarupo itu. Tapi kalian barampek harus lalok di surau salamo mangaji samo
  ambo. Lai talok dek kalian tu?\u201d jawek sarato tanyo baliak Angku Satiah.\\n\u201cLai
  Pak Angku. Tambah pulo, kami lah di suruah lo dek urang gaek kami untuak mulai ka
  surau. Bia kok lah gadang bisuak, indak jadi urang binguang\u201d. Yogi jo Dito
  nan manjawek.\\n\u201cSarupo carito Buyuang Lelan\u201d Sambuang Isik.\\n\u201cJadilah
  kok sarupo itu. Tapi ciek nan indak ambo buliahan. Jan sakali-kali kalian masuak
  ka rimbo nan dibalakang surau ko. Karano rimbo di balakang ko iolah rimbo sasek,
  rimbo maliang. Sakali kalian masuak ka rimbo tu, dak ka pulang kalian di buweknyo
  do\u201d Kecek Angku Satiah sambiah manunjuak ka balakang suraunyo tu.\\nTangango
  lah ampek sakawan tu. Karano, salamo anak-anak tu bamain di dakek rumahnyo, indak
  pernahtadanga dek anak-anak tu manganai carito rimbo sasek tu do . Akhinyo, anak-anak
  tu samo-samo manggeleng manuruikan kecek Angku Satiah.\\nKatiko ilmu nan dituntuik,
  tantulah elok nan ka jadi buahnyo. Sampailah saminggu sasudah anak-anak tu datang
  ka surau, akhirnyo tibolah maso panyarahan murid dek urang tuo ka Angku Satiah.
  Makan basamo sarato pitih sapiah lah salasai di tarimo jo dikarajoan dek Angku Satiah
  jo urang tuo anak-anak nan baru masuak. Kini jadilah ampek sakawan tu, anak-anak
  surau nan lah siap lalok jauah jak di urang tuonyo.\\nbaraja ngaji Iqra\u2019, Al
  Qur\u2019an, Kitab Kuniang, Kitab PQ, Kitab kailani sarato jo mutasyar iolah ilmu
  nan diajaan ka anak-anak surau dek Angku Satiah. Indak lupo bacoan sambahyang sarato
  rukun-rukunnyo. Anak-anak baru di aja dek anak nan lah satahun di surau tu, anak
  nan satahun di aja dek anak-anak nan lah duo tahun mangaji, anak-anak nan duo tahun
  diaja dek anak-anak nan lah tigo tahun lamonyo mangaji. Anak-anak nan tigo tahun
  ko lah nan di aja langsuang dek Angku Satiah.\\nLah hampia satangah tahun lamo mangaji,
  taingek lah baliak carito rimbo sasek tu dek si Kamba katiko lah kan lalok. Tibolah
  pangana di aka anak-anak cadiak tu, dek apo bisa disabuik jo rimbo sasek rimbo balakang
  surau ko? Apo nan ado dalam rimbo tu. Sampai-sampai lah jam 2 malam, baru lalok
  anak-anak tu.\\nHari akok (ahad) iolah hari libur dek anak-anak surau jak di siang
  hinggo malamnyo. Karano Angku satiah satiok minggu pulang pulo ka rumahnyo. Jadi
  surau tinggalah anak-anak nan indak pulang karumah urang tuonyo. Hari ko lah carito
  masuak rimbo sasek dimulai dek si kamba. Parangai anak-anak lah nan tajadi, kadang
  takuik bana kadang barani bana, kadang picayo bana kadang indak bana.\\n\u201cGa,
  kalau wak cubo masuak ka rimbo tu ba a nyo? masalah nyo, kalau di caliak rimbo tu
  biaso se nampaknyo lah. Kalau takuik tasasek, wak masuak tapi-tapi rimbo se lah
  mah\u201d. Kecek Yogi mambawok.\\n\u201cTapi, den tu agak takuik-takuik juo mah,
  Gi. Sobok nyo wak baduo se nyo. Kawan-kawan lain lah pulang ka rumah nyo pagi tadi.
  Kito kan lah pulang lo Akok patang ko. Jadi kok dinanti kawan-kawan lainnyo ba a?
  beko jam tigo tu, anak-anak tu lah tibo di surau liak mah\u201d. Jawek Yoga sambia
  maangkek bahunyo sarupo urang takuik.\\n\u201cRancak lah kini se lai, Ga. kini lai
  pagi lo. Kalau jam tigo, rimbo tu beko galok dek bayang-bayang surau ko. Tambah
  takuik lah wak dibuweknyo beko mah. Lagian Kok dipikia-pikia, ba a dek kan tasasek
  lo wak tu. Beko wk rambah samak tu pakai ladiang ko. Tu kalau lah nio pulang, turuik
  se jalan nan lah pasa dek rambahan ladian tadi tu\u201d.Jawek Yogi sambia mambiak
  ladiang surau untuak mangapiang kayu tu.\\n\u201clai dak berang beko Angku atau
  tuo-tuo kito tu, Gi?\u201d Tanyo Yoga ciek lai.\\n\u201cIndak lah nyo. Kini kan
  sadang pagi baru mah. Alun ado urang-urang tu kan datang ka surau lai do. Tanang
  se lah. Panek rasonyo, indak ado yang dikarajoan\u201d. Jawek Yogi.\\nAkhirnyo,
  dek tanyo Yoga tajawek taruih. Sapakaik lah anak-anak tu masuak ka rimbo balakang
  surau tu. Karano Yoga lah tabwok-bawok lo dek pikiran kambarannyo nan sadang basamangaik
  tu. Tantunyo takuik sarato binguang, bacampu jadi ciek di hati si kamba tu. Tapi
  masuak juo lah anak kamba tu sambia marambah samak nan ado di mukonyo. Gunonyo jaleh,
  untuak jalan pulang beko katiko lah nio kalua jak di rimbo.\\nAlun 15 minik masuak
  ka rimbo tu, lah samakin dalam samak-samaknyo. Dek lah peneh marambah samak jak
  ka masuak tadi, si kamba lah nio kalua. Tantunyo ikuik jalan na lah di rambah tadi.
  Dek pakak jo kareh angok, tantulah buruak nan katajadi. lah dituruik jalan nan alah
  di rambah tadi, kironyo tibo pulo baliak di tampek kudian anak tu baranti. Kironyo
  rimbo, lah mamuta-mutaan jalan si kamba. Di ulang sakali, duo kali, tigo kali, sampai
  babole-bole kali. Indak juo basobok jalan kalua do. Tantunyo manyasa di dalam hati,
  ikolah akibaik indak mandangan kecek guru surang.\\nAnak ketek ditangah rimbo tantulah
  banyak malang nan katajadi. Ikolah nan tapikie dek si kamba. Sampailah isak tangih
  kalua jak di mulai anak-anak tu. Indak tantu kan manga di dalam rimbo tu. Hari lah
  baranjak siang, tapi azan zuhur indak bakumandang juo. Tapikie lah dek si Yogi untuak
  mamanjek batang kayu nan tinggi dakeknyo tu.\\n\u201cGa, kito panjek batang kayu
  ko lah. Beko bisa kito caliak, dima latak surau kito sabananyo\u201d. Kecek Yogi
  Mambawok manjek.\\n\u201cJadi lah, Gi.\u201d jawek yoga sambia menyeka aia matonyo.\\nMamanjeklah
  anak kamba tu. indak lamo sudah tu, tibolah kaduo anak-anak tu hampia dipucuak kayu
  gadang nan nyo panjek. Dicaliaklah sakaliliang rimbo tu, sambia mamuta kapalo kakida
  jo kakanan. Harok mancaliak atok surau nan tabuek jak di ijuak anau, kironyo hanyo
  rimbo gadang sajauh mato mancaliak. Tabikklah takuik anak-anak tu. \u201cLah putuih
  tampek bagantuang, lah habih tampek balinduang\u201d. Indak cukuik isak jo tangih,
  hariak-mahariak sajadi-jadinyo, indak mambawok elok ka anak tu.\\nIkolah pasan nan
  paralu di ingek dek anak nan kareh kapalo. Jan sakali-kali malawan kecek guru, apolai
  dalam agamo indak dibuliahan bana. Karano barujuang pado Narako. Tasintak lah anak
  kamba tu jak di diamnyo salamo di batang kayu. Turun lah anak tu, makasuik nio maulang
