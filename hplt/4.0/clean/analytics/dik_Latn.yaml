  w\u00ebn Malaleel, w\u00ebn Kenan, 38w\u00ebn Enok, w\u00ebn Theth, w\u00ebn Adam
  w\u00ebn Nhialic.\"", "\"Ji\u00eb\u00ebm de pi\u0254\u0308u n\u00eb telepuunic n\u00eb
  ajui\u025b\u0308\u025b\u0308r de w\u025b\u0308\u025b\u0308r (TIS) de thookic\\nAkut
  de 1800RESPECT al\u00e4\u00e4u en\u0254\u014b kedhi\u025b paan de Australia k\u0254c
  ci yaa\u014b y\u00f6k n\u00eb bi\u00e4k de rum de di\u00e4\u00e4r ku ku\u0254\u0308c
  ce\u014b ku t\u0254\u014b baai. K\u0254c c\u00ef pi\u0254\u0308\u0254\u0308c ku
  c\u00efk luui ar\u00eb\u00ebt aye k\u0254c j\u00e4\u00e4m pi\u0254\u0308\u0254th,
  n\u00eb w\u00ebl ku kony k\u00eb k\u0254c b\u00efk \u0263\u00e4n ke ku\u0254\u0254ny
  y\u00f6k n\u00eb ye bi\u00e4k\u00eb. Ajui\u025b\u0308\u025b\u0308r\u00eb at\u0254\u0308
  n\u00eb th\u025b\u025b yiic kee 24 n\u00eb k\u00f6\u00f6l t\u00f6kic, n\u00eb nin
  kee dherou n\u00eb wikic.\\nTelepun de w\u025b\u0308\u025b\u0308r de thook ee \u0263\u0254\u0308\u0254\u0308r
  n\u00eb n\u00efniic kee 7 ku n\u00eb th\u025b\u025b yiic kee 24 (TIS National) at\u0254\u0308
  ke l\u00e4\u00e4u ke c\u00efn w\u00ebu k\u0254\u0254r ke t\u00eb yup y\u00efn akut
  de 1800RESPECT.\\nAgo ye k\u00ebn\u00eb juiir:\\nC\u0254l 1800RESPECT n\u00eb 1800
  737 732 ku thi\u025b\u0308c duw\u00ebr de thok. Duji\u00ebm de pi\u0254\u0308u ab\u00eb
  ajuiir looi, ka\\nC\u0254l akut de w\u025b\u0308\u025b\u0308r de thook (TIS) n\u00eb
  131 450 ku thi\u025b\u0308c ke b\u00efk akut de 1800RESPECT k\u0254\u0308\u0254\u0308r
  y\u00ef.\\nJi\u00eb\u00ebm de pi\u0254\u0308u t\u0254\u0308 online de akut de 1800RESPECT
  ayen\u00eb jam n\u00eb tho\u014b de de\u014blith.\\nNa n\u0254\u014b k\u00eb n\u00e4k\u00eb
  ke y\u00ef c\u0254l 000 b\u00eb bolith b\u025b\u0308n.\\nNa k\u0254\u0254r ba yup
  n\u00eb telepun c\u00efn g\u00e4\u00e4u ke y\u00ef c\u0254\u0308t\u00eb n\u00eb
  TTY ka n\u00eb National Relay Service, t\u00ef\u014b Calls to emergency services\"",
  "\"Aluk Akec Mabior\\nAluk Akec Mabior adhi\u00ebth p\u025b\u025bi niin 8, P\u025bn\u00ebrou
  1994. Yen ee duri\u00e4\u014b de ad\u00ef\u00efrc\u00f6k piny de Pagu\u00f6t Thud\u00e4n
  k\u00ebdet\u00f6k c\u00ef adiir loi keye lu\u0254i\u00ebci\u025b\u014b ku ye raan
  t\u00f6\u014b akutam\u00ebtuuk de Al-Merreikh SC Parut de Thud\u00e4nic. Aluk Akec
  ag\u0254l tuukden n\u00eb lu\u0254i\u00ebci\u025b\u014b adiirc\u00f6k piny de Parut
  \u00eb Thud\u00e4n ke Pagu\u00f6t Thudan k\u00ebc nh\u00f6ml\u00e4\u00e4u gu\u0254
  y\u00f6k. N\u00eb 2009, go Aluk dhuk pagu\u00f6t. N\u00eb ru\u0254\u0308n 2012,
  ka Aluk l\u0254 Salaam Aweil, na ye run 2014 ac\u00ef\u00ef \u0263aac t\u00ebn\u0254\u014b
  Malakia. \u0194\u0254n tuuk Aluk Juba keye am\u00ebtuuk de Malakia, go aci\u025bthlu\u0254i
  de adiirc\u00f6k Paguot Thudan detic l\u0254n l\u00ebu yen r\u0254t ku pu\u0254th
  ap\u025bidit b\u00eb Aluk tuuk kek\u00eb Akutam\u00ebtuuk ad\u00ef\u00efrc\u00f6k
  wutic de Paguot Thud\u00e4n. Malakia ac\u00eb Aluk b\u025bn \u0263aac t\u00ebn\u0254\u014b
