  raan th\u00efn amaatnhom yic (a partner in a partnership)\\n- raan muk m\u00e4kt\u00e4b
  \u00eb amaatnhom c\u00ef looi l\u00f6\u00f6\u014b (an unincorporated association).\\nK\u0254c
