sample: '["\"1Ye\u014b\u00f6 buk j\u00e4l lueel rin Abaram wund\u00eft th\u025b\u025br
  k\u0254c Itharel? Ye\u014b\u00f6 c\u00ef rot looi t\u00ebn\u00eb ye? 2Na Abaram
  la k\u00ebn\u00eb c\u00ef looi b\u00ef yen la c\u00f6k t\u00ebn\u00eb Nhialic, \u014bu\u0254\u0308t
  ala k\u00ebn\u00eb ye yen nhiam. Ku ac\u00ef\u00ef loi k\u00ebl\u00e4 t\u00ebn\u00eb
  Nhialic. 3C\u00efm\u00ebn ye w\u00ebl c\u00ef g\u0254\u0308t ath\u00f6r th\u025b\u025br
  w\u00ebl Nhialic yic ye lueel \u00ebl\u00e4, \\\"Abaram ac\u00ef Nhialic gam ku
  rin gamde ac\u00ef Nhialic c\u0254l ala c\u00f6k t\u00ebn\u00eb ye.\\\" 4Raan luui
  aye ri\u0254p, ku w\u00eb\u00ebu ye ye ri\u0254p aacie mi\u0254\u0308c, ari\u00f6pden
  c\u00ef yen luui. 5Ku raan cie luui la gam t\u00ebn\u00eb Nhialic, Nhialic yen k\u0254c
  c\u00ef k\u00e4r\u025bc looi c\u0254l aala c\u00f6k, ke gamde yen \u00eb ye c\u0254l
  ala c\u00f6k t\u00ebn\u00eb Nhialic. 6Ku Debit ac\u00ef w\u025b\u0308t th\u00f6\u014b
  kek \u00eb w\u025b\u0308t k\u00ebn\u00eb lueel w\u00e4\u00e4r yen jam rin raan mit
  pu\u0254\u0308u c\u00ef Nhialic gam ke la c\u00f6k t\u00ebn\u00eb ye, ke cie lu\u0254i
  pu\u0254th ye looi, 7\\\"K\u0254c mit pu\u0254\u0308th aa k\u0254c c\u00ef Nhialic
  aw\u00e4cken p\u00e4l piny, ku wuuny adumu\u0254\u0308\u0254\u0308mken wei. 8Raan
  mit pu\u0254\u0308u ee raan c\u00ef B\u025b\u0308ny b\u00ef ku\u025b\u0308n gu\u0254\u0308p
  k\u00e4r\u025bc c\u00ef looi.\\\" 9Ye mi\u025bt pu\u0254\u0308u c\u00ef Debit jam
  k\u00ebn k\u0254c Itharel \u00eb r\u00f6t? Acie k\u00ebden kep\u025b\u0308c. Ee
  k\u00ebn k\u0254c cie k\u0254c Itharel aya, ku wek aa we yeku l\u025b\u0308k k\u00eb
  cuk y\u00f6k ath\u00f6r w\u00ebl Nhialic yic, rin ac\u00ef w\u025b\u0308t c\u00ef
  g\u0254\u0308t th\u025b\u025br lueel l\u0254n, \\\"Abaram ac\u00ef Nhialic gam,
  ku gamde ac\u00ef yen a raan la c\u00f6k t\u00ebn\u00eb Nhialic.\\\" 10Ye n\u025bn
  yen looi k\u00ebn\u00eb rot? Loi rot tue\u014b w\u00e4\u00e4r k\u00ebc Abaram \u014boot
  aye w\u00e4\u00e4r c\u00ef ye \u014boot? Ee tue\u014b, acie \u014bu\u0254\u0308t
  c\u00f6k ci\u00eb\u00ebn. 11Ku \u014bu\u0254\u0308tden j\u0254l ye l\u0254\u0308k
  \u014boot ci\u00eb\u00ebn, aye nyu\u0254\u0254th l\u0254n gam Abaram ac\u00ef Nhialic
  ye gam ke ye raan la c\u00f6k t\u00ebn\u00eb ye tue\u014b w\u00e4\u00e4r k\u00ebc
  ye cak \u014boot. Ku k\u00ebl\u00e4, Abaram \u00eb wund\u00eft k\u0254c c\u00ef
  Nhialic gam, ku aaye gam ke ye k\u0254c la c\u00f6k t\u00ebn\u00eb ye c\u0254k al\u0254n
  k\u00ebc ke \u014boot. 12Ku yen \u00eb wund\u00eft k\u0254c c\u00ef \u014boot aya.
  Ku acie rin c\u00ef ke \u014boot, ee rin c\u00ef kek dh\u00ebl p\u00efr gam th\u00f6\u014b
  ke p\u00efr w\u00e4da Abaram bu\u0254\u0254th yic w\u00e4\u00e4r k\u00ebc ye cak
  \u014boot. 13Nhialic ac\u00e4 Abaram th\u0254n ku m\u00efth b\u00ef l\u0254\u0308k
  dhi\u00eb\u00ebth l\u0254n b\u00ef pinynhom a k\u00ebden. Nhialic ak\u00ebc ath\u00f6n
  k\u00ebn\u00eb looi rin theek Abaram l\u00f6\u014b, ee rin c\u00ef yen gam, ku gam
  yen ac\u00ef yen a raan la c\u00f6k t\u00ebn\u00eb Nhialic. 14Rin na ye k\u00eb
  ye Nhialic th\u0254\u0308n k\u0254c g\u00e4m k\u0254c l\u00f6\u014b theek, ke gam
  ac\u00efn w\u025b\u0308tde yic, ku c\u00efn k\u00ebpu\u0254th t\u0254\u0308 ath\u00f6n
  Nhialic yic. 15L\u00f6\u014b \u00eb r\u025b\u0308\u025b\u0308c pu\u0254\u0308u Nhialic
  b\u025b\u0308\u025b\u0308i, ku t\u025b\u0308 c\u00efn yic l\u00f6\u014b, ac\u00efn
  l\u00f6\u014b ye dh\u0254\u0308l yic. 16Nhialic \u00eb loi ath\u0254\u0308nde rin
  gam ku rin dh\u025b\u0308\u025b\u0308\u014bde, b\u00ef ath\u0254\u0308nde a k\u00ebn
  yic t\u00ebn\u00eb m\u00efth b\u00ef l\u0254\u0308k dhi\u00eb\u00ebth t\u00ebn\u00eb
  Abaram \u00ebb\u00ebn. Ku acie t\u00ebn\u00eb k\u0254c la l\u00f6\u014b \u00eb r\u00f6t,
  ee t\u00ebn\u00eb k\u0254c c\u00ef gam aya c\u00efm\u00ebn Abaram. Rin Abaram yen
  \u00eb w\u00e4dan w\u025b\u0308ikua \u0263odhie, 17c\u00efm\u00ebn c\u00ef ye g\u0254\u0308t
  ath\u00f6r th\u025b\u025br w\u00ebl Nhialic yiic \u00ebl\u00e4, \\\"Y\u00efn aca
  looi ba ya wun k\u0254c wu\u0254\u0308t ju\u00ebc.\\\" Abaram ac\u00ef ya W\u00e4da
  Nhialic nhom, Nhialic c\u00ef gam, Nhialic yen k\u0254c c\u00ef thou c\u0254l aben
  p\u00efr, ku w\u025b\u0308t ye lueel ke liu th\u00efn c\u0254l aloi rot. 18Abaram
  ac\u00ef gam ku \u014b\u025b\u0308\u025b\u0308th k\u00eb c\u00efn k\u00eb \u014b\u0254\u0308th
  th\u00efn, ku yen ac\u00ef yen b\u025b\u0308n a wun k\u0254c wu\u0254\u0308t ju\u00ebc
  c\u00efm\u00ebn c\u00ef Nhialic ye l\u025b\u0308k ye \u00ebl\u00e4, \\\"K\u0254ckun
  b\u00ef l\u0254\u0308k dhi\u00eb\u00ebth aab\u00ef ju\u00ebc ka b\u00ef ci\u025b\u0308t
  ku\u025bl.\\\" 19W\u00ebn c\u00ef Abaram cak dhi\u0254p \u00eb ru\u0254\u0308nke
  aa c\u00eft bu\u0254\u0254t, ku \u014bic l\u0254n ti\u025b\u014bde Thara ke c\u00ef
  dhi\u0254p ke k\u00ebc dhi\u00ebth, ke \u014bot k\u00ebc dh\u0254\u0308r gamde yic.
  20Ku r\u00eb\u00ebr ke \u014b\u0254\u0308th ku c\u00ef\u00ef diu ath\u00f6n Nhialic,
  ku gamde ac\u00ef ye b\u025b\u0308n yi\u00ebk ri\u025bl ku leec Nhialic. 21Ee \u014bic,
  ke c\u00efn diu l\u0254n b\u00ef Nhialic la ri\u025bl b\u00ef k\u00eb c\u00ef th\u0254n
  dhi\u025bl looi. 22Ku \u00eb yen ac\u00ef Nhialic Abaram gam ke ye raan la c\u00f6k
  t\u00ebn\u00eb ye. 23Ku w\u00eblk\u00e4, \\\"Yen ac\u00ef gam ke ye raan la c\u00f6k,\\\"
  aa k\u00ebc g\u0254\u0308t ri\u025bnke \u00eb rot. 24Aake g\u025b\u0308t ri\u025bnkua
  \u0263ok k\u0254c b\u00ef Nhialic gam aya ke \u0263o la c\u00f6k, \u0263ok k\u0254c
  ye gam l\u0254n yen Nhialic yen c\u00ef Jethu B\u00e4nyda j\u0254t thou yic. 25Yen
  ac\u00ef c\u0254l athou rin adumu\u0254\u0308\u0254\u0308mkua, ku j\u0254t b\u00ef
  p\u00efr b\u00ef \u0263o c\u0254l aala c\u00f6k t\u00ebn\u00eb Nhialic.\"", "\"Pawut
  Lol\\nPawut Lol: Lol ee pawun t\u00f6\u014b \u00eb Paguot Thudan kathi\u025b\u0308roukub\u025b\u0308t
  (28) w\u00e4\u00e4r cii b\u025b\u0308ny Kiir yam ak\u00f6l\u00ebrou, ru\u0254\u0308n
  tiim kaarou kuthi\u00e4rkudhi\u00ebc pen\u00ebthi\u025b\u0308r 2/K\u00f6n/2015.
  Pawut Lol at\u0254\u0308 l\u0254\u0308k \u00eb Bahr el Ghadhal aba\u014b\u00eb parutcu\u0254l
  \u00eb Paguot Thudan. Pawut Lol athi\u00f6k kepan yee c\u0254\u0254l Paank\u0254c
  Ci\u025bl de Aprika aba\u014b\u00eb pacu\u0254l, Thud\u00e4n aba\u014b\u00eb parut,
  pawut Awiel aba\u014b\u00eb pabak, ku pawut Wau aba\u014b\u00eb paguotbak.\\nWaar
  th\u025b\u025br ak\u00f6l\u00eb 2/K\u00f6n/2015, b\u025b\u0308nymacbaai Thalva Kiir
  \u00eb May\u00e4rd\u00eft aci l\u00f6\u014b yam l\u00f6\u014b b\u00eb Pawuut thi\u00e4r
  ci g\u0254\u0308t w\u00eblmacyic tekiic arak 28, ago na\u014b Pawut thi\u00e4rkub\u025b\u0308t.
  Pawuut ju\u025b\u0308c t\u0254\u0308thin yak\u00f6l\u00eb acii ketekthook \u00eb
  ku\u025btku\u025bt. Pawuut k\u0254\u0308k cit Pawun\u00eb Lol aa cie\u014b ku\u025btku\u025bt
  ku\u0254\u0308t cimin Dinka ku Partit. Pawun\u00eb Lol ee pawun t\u00f6\u014b \u00eb
  Pawuut w\u00e4\u00e4r cii piac yam. Kiir aci ye nhom b\u025bn tak ku \u0263\u025b\u0308th
  l\u00f6\u014b den w\u00e4r ci yam n\u00eb \u0263\u00f6n\u00ebl\u00f6\u00f6\u014b
  e rin b\u00ebl\u00f6\u014b k\u00ebn\u00eb g\u00e4tpiny ku b\u00eb w\u00eblmac waar
  yic.Naa w\u00ebn l\u0254 p\u025bi \u00eb thi\u025b\u0308rkut\u00f6k b\u025b\u0308n,
  go k\u0254c \u0263\u00f6n\u00ebl\u00f6\u00f6\u014b de Paguot Thudan b\u025b\u0308ny
  Kiir yi\u025b\u0308k ri\u025bl bi yenke Pawuut yam cak. Raan yee c\u0254\u0254l
  Ridhik Dhakariya Hathan aci jal b\u025bn kuany bi yaa b\u025b\u0308nypawun\u00eb
  Lol n\u00eb pen\u00ebthi\u00e4r kurou, ak\u00f6l\u00eb 24 ru\u0254\u0308n tiim karou
  ku thiar kudhi\u00ebc. W\u00ebn cin\u00eb yeen t\u025b\u0308\u025b\u0308mbei, Pawut
  lol aci jal b\u025b\u0308n tekic bi yaa ar\u0254\u0308mb\u025b\u0308i kaa 11, ku
  keek aye aba\u014b\u00eb 180 ar\u0254\u0308mb\u025b\u0308i t\u0254\u0308 pan \u00eb
  JunubThudan ab\u025b\u0308n. Keek ar\u0254\u0308mb\u025b\u0308i kaa 11 k\u00e4k\u00eb,
  an\u0254\u014b Eri, Gomjuer Pacu\u0254l, Gomjuer Pabak, Korok Pabak, Korok Pacu\u0254l,,
  Kuru Majakbai, Marialbai, Malual Parut, Malual Calic ku j\u0254l yaa Ringi. Genamatnhom
  de Pawut Lol aye c\u0254\u0254l Raga, Paguot Thudan. Raga yen ee pen ditbet\u025b\u025bm
  n\u00eb Pawutic, ku yeen aaye cie\u014b k\u0254c ju\u025b\u0308c ap\u025bi tine
  Pawut th\u025b\u025br w\u00e4\u00e4r ye c\u0254\u0254l W\u025b\u0308t\u1e27\u025b\u0308n
  Bahr El Ghadhal. P\u025bn k\u0254\u0308k t\u0254\u0308 n\u00eb pawun\u00eb lolic
  aye Gothi\u014ba ku Deim Dhubeer. Translated by Joseph Makuur Gai Lueeth MBBS.\"",
  "\"Pi\u00f6cemanhraan\\nPi\u00f6cemanhraan ee pi\u00f6c koc. Pi\u00f6cemanhraan
  ee pi\u00f6cekapir ku pi\u00f6c\u00ebk\u00e4th\u025b\u025br. Pioce\u014bicka\u014b
  ee hok kuony be ten reer koc theer thin pinynhom. Koc c\u00eb pioc piocmanhraan
  ayoopwel tau r\u00eb\u00ebr koc thiin y\u00e4kol ku tau r\u00eb\u00ebr koc thiin
  th\u025b\u0308\u025b\u0308r. Ayoopwel geeth yakolic ku baai ta aheer ku koc cie\u014bthin.
  Awelyoop akut kocic ku tay\u00eb koc tie\u014b kaam winhoor ku piir. Ka ku loi e
  piocemanhraan \u00eb koc kony riin ne l\u00eb ka c\u00ef y\u00f6k theer pioce\u014bicka\u014b.
  To\u014b thiok ciyok \u00eb piocemanhraan \u00eb dhuk cien waartheer dheel ke \u014biec
  loi puor koc cie\u014b r\u00f6\u00f6k America. Piocemanhraan ac\u00eb kaar araak
  \u014buan kakciwecbei. Kakciwecbei ta cit tan cie\u014b koc th\u025b\u0308\u025b\u0308i
  th\u00efn. Koc kuen kak koc th\u025b\u0308\u025b\u0308r aka tueny \u014bic kak cit
  abiany tony wela abuoc weth. piocemanhraan ku guop. \u00eb pioc raan ku \u014bic
  ta y\u00eb koc ku guop raan kayic waar kaamic. Koc kuen guop koc akuen ja\u014b,
  agok ku laai kok. Cie\u014b piocemanhraan et\u00ebn piir koc thiin yakol ku tan
  piir koc thiin th\u025b\u0308\u025b\u0308r.\"", "\"1\u0194\u0254n yen ru\u0254\u0308\u0254\u0308n
  thi\u00e4\u00e4r ku dhi\u00ebc ke Tiberi\u00f6th ye b\u025b\u0308ny, ku Pilato ke
  ye b\u025b\u0308nyd\u00eft mac Judia, Antip\u00e4th \u0194\u00ebrot \u00eb ye b\u025b\u0308ny
  Galilia ku Pilipo w\u00e4m\u00ebnh \u00eb mac Ituria kek Trakonitith, ku Lithaniath
  \u00eb ye b\u025b\u0308ny Abilene, 2ku Anath kek Kaipa aake ye b\u00e4nyd\u00eft
  k\u00e4k Nhialic. T\u025b\u0308\u025b\u0308n\u00eb, ke Nhialic l\u00ebk w\u025b\u0308t
  Joon w\u00ebn Dh\u00e4karia t\u0254\u0308 roor. 3Go Joon b\u025b\u0308\u025b\u0308i
  t\u0254\u0308 w\u00e4r Jordan y\u0254u ku\u025bny yiic ke w\u00eb\u00ebt k\u0254c,
  \\\"P\u00e4lk\u00eb lu\u0254i k\u00e4r\u025bc, ku calk\u00eb r\u00f6t aa mu\u0254c
  nh\u00ef\u00efm, rin b\u00ef adumu\u0254\u0308\u0254\u0308mkun p\u00e4l piny t\u00ebn\u00eb
  we.\\\" 4C\u00efm\u00ebn c\u00ef ye g\u0254\u0308t ath\u00f6r Ithaya yic raan k\u00e4k
  Nhialic t\u00ef\u014b \u00ebl\u00e4, \\\"Raan k\u00e4kki\u025b\u0308 t\u00ef\u014b
  ab\u00ef k\u00ebc\u00eft l\u0254\u0308\u0254\u0308r gut yic b\u00ef yen k\u0254c
  caal t\u025b\u0308de \u00eb rot, ku l\u00ebk keek \u00ebl\u00e4, ''Gui\u025brk\u00eb
  dh\u00ebl \u00eb B\u025b\u0308ny, lu\u0254ik\u00eb dh\u0254\u0308lke b\u00efk la
  c\u00f6k. 5Th\u0254\u0308nyk\u00eb \u0263\u0254\u0308n la ti\u00e4m piny ku dhu\u0254\u0308kk\u00eb
  \u0263\u0254n th\u00f6ny nh\u00ef\u00efm piny, ku c\u0254\u0308kk\u00eb dh\u00ebl
  cie yic neer, ku th\u0254\u0308\u0254\u0308\u014bk\u00eb dh\u0254\u0308l la yiic
  \u014b\u0254ny nh\u00ef\u00efm. 6Ku raan \u00ebb\u00ebn, ab\u00ef t\u025b\u0308
  ye Nhialic \u0263ook lu\u00e4k th\u00efn t\u00ef\u014b!'' \\\" 7Ku l\u00ebk k\u0254c
  ju\u00ebc b\u0254\u0308 t\u00ebn\u00eb ye b\u00ef ke b\u025b\u0308n mu\u0254\u0254c
  nh\u00ef\u00efm, \\\"Awek dhi\u00ebnh k\u00e4pi\u025bny! Ye\u014ba l\u00ebk we b\u00e4k
  kat k\u00ebr\u025b\u025bc b\u0254\u0308? 8Lu\u0254ik\u00eb k\u00e4k ye nyooth l\u0254n
  c\u00ef wek mu\u0254\u0308l k\u00e4r\u025bc yak\u00eb ke looi. Ku du\u0254\u0308kk\u00eb
  wepu\u0254\u0308th t\u0254\u014b ku lu\u025blk\u00eb \u0263ok aa m\u00efth Abaram.
  Al\u025b\u0308k we l\u0254n al\u00ebu Nhialic b\u00ef aleelk\u00e4 c\u0254l aaye
  m\u00efth Abaram. 9Ku \u00ebm\u00ebn y\u00ebp ac\u00ef ther b\u00ef ke tiim yep,
  rin na ye tim cie lu\u0254k, ka yep ku cu\u025bt \u00eb m\u025b\u025bc.\\\" 10Go
  th\u00e4n aw\u00ebn Joon thi\u00eb\u00ebc \u00ebl\u00e4, \\\"Na ye k\u00ebya, buk
  \u014b\u00f6 looi?\\\" 11Go Joon b\u025b\u0308\u025b\u0308r, \\\"Raan la al\u025b\u0308th
  karou, adhil t\u00f6k yi\u00ebk raan c\u00efn alath, ku raan la mi\u00ebth adhil
  looi k\u00ebya.\\\" 12Go k\u0254c aju\u00ebr kut b\u025b\u0308n t\u00ebn\u00eb ye
  aya b\u00ef ke b\u025b\u0308n mu\u0254\u0254c nh\u00ef\u00efm, ku thi\u00ebck\u00eb,
  \\\"Raan pi\u00f6\u00f6c buk \u014b\u00f6 looi?\\\" 13Go l\u025b\u0308k ke, \\\"Du\u0254\u0308kk\u00eb
  w\u00eb\u00ebu ye l\u00f6\u00f6m \u00eb ru\u00eb\u00ebny t\u00ebn\u00eb k\u0254c.\\\"
  14Go apuruuk b\u025b\u0308n ku thi\u00ebck\u00eb \u00ebl\u00e4, \\\"Na \u0263ook,
  buk \u014b\u00f6 looi?\\\" Go l\u025b\u0308k ke, \\\"Du\u0254\u0308kk\u00eb k\u0254c
  ye rum, ku du\u0254\u0308kk\u00eb k\u0254c ye gaany w\u025b\u0308t \u00eb lueth,
  ku yak\u00eb pu\u0254\u0308th la yum ari\u0254\u0308pdun yic.\\\" 15Go \u014b\u00e4thden
  j\u00e4l d\u00eft, ku yek\u00eb tak l\u0254n nad\u00eb ke mony ab\u00ef dhi\u025bl
  a Raan c\u00ef Nhialic l\u0254c ku d\u0254\u0254c. 16Go Joon l\u025b\u0308k ke \u00ebb\u00ebn
  \u00ebl\u00e4, \\\"Wek aa ya mu\u0254\u0254c nh\u00ef\u00efm p\u00efu \u00eb path,
  ku raan d\u00eft ku ril ap\u025bi t\u00ebn\u00eb \u0263a ab\u0254\u0308, raan na
  c\u0254k aa warke ka c\u00e4 l\u00ebu ba ke d\u0254\u0308k. Ku \u00eb yic \u0263\u025bn
  ac\u00ef\u00ef path ba l\u00ebu, ba ya alu\u0254nyde. Ku yeen ab\u00ef k\u0254c
  k\u0254\u0308k weyiic mu\u0254\u0254c nh\u00ef\u00efm W\u00ebi Nhialic, ku mu\u0254\u0254c
  k\u0254c k\u0254\u0308k nh\u00ef\u00efm \u00eb mac. 17Yeen ac\u00eft raan muk l\u0254k
  k\u00e4m ye rap k\u0254\u0308\u0254\u0308m, b\u00ef rap tek thook kek mi\u00ebl.
  Ku wiiu rap ku t\u0254\u0308u ke. Ku y\u0254\u0254t mi\u00ebl many cie thou.\\\"
  18W\u00ebl k\u0254\u0308k c\u00eft k\u00e4kk\u00e4 aac\u00ef Joon l\u025b\u0308k
  k\u0254c ap\u025bi b\u00ef yen W\u025b\u0308t Pu\u0254th Yam pi\u0254\u0308\u0254\u0308c
  th\u00efn. 19Ku Joon \u00ebc\u00ef Antip\u00e4th \u0194\u00ebrot, b\u025b\u0308ny
  Galilia j\u00e4\u00e4m gu\u0254\u0308p k\u00e4r\u025bc ap\u025bi, rin c\u00ef yen
  \u0194\u00ebrodia ti\u014b w\u00e4m\u00ebnh rum b\u00ef ya ti\u025b\u014bde, ku
  looi k\u00e4ju\u00ebc r\u025bc k\u0254\u0308k aya. 20Go Antip\u00e4th \u0194\u00ebrot
  Joon mac, ku k\u00ebn\u00eb \u00eb k\u00ebr\u025b\u025bc d\u025b\u0308t c\u00ef
  mat k\u00e4racken c\u00ef looi yiic. 21Naw\u00ebn c\u00ef th\u00e4n aw\u00ebn mu\u0254\u0254c
  nhom \u00ebb\u00ebn, ku Jethu ke c\u00ef mu\u0254\u0254c nhom aya. Kaam w\u00ebn
  r\u00f6\u00f6k yen ke nhial liep rot. 22Ku b\u0254\u0308 W\u00ebi Nhialic yenhom
  kec\u00eft kuur \u00eb dit. Ku pi\u014b r\u00f6l Nhialic nhial ke lueel, \\\"Y\u00efn
  \u00eb manhdi\u025b\u0308n nhiaar. \u0194\u025bn amit pu\u0254\u0308u kek y\u00ef.\\\"
  23W\u00e4\u00e4r j\u0254\u0254k Jethu pi\u0254\u0308\u0254\u0308cde c\u00f6k, ke
  ru\u0254\u0308nke aake ye thi\u00e4rdi\u00e4k. Ku \u00eb ye raan \u00ebb\u00ebn
  tak l\u0254n \u00eb yen w\u00ebn Jothep, w\u00e4\u00e4r w\u00ebn \u0194eli, 24w\u00ebn
