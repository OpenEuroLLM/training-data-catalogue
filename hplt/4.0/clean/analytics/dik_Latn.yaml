  ru\u025bl t\u00f6\u00f6\u014b \u00eb di\u00e4k ak\u00f6l ku w\u025b\u0308\u025b\u0308r.\\n13
  Ku jal jat \u0263anyin, ke ye acu yen ti\u025b\u0308\u014b ke p\u00e4r nhial, ku
  pi\u025b\u014b ke c\u00f6t r\u00f6ld\u00eft ap\u025bi ku lueel, \u201cYe k\u00ebr\u025b\u025bc
  \u00eb d\u00e4! Ye k\u00ebr\u025b\u025bc \u00eb d\u00e4 t\u00ebn\u00eb k\u0254c
  \u00eb pinynhom rin aab\u00ef k\u00e4r\u025bc y\u00f6k, t\u025b\u0308 le atuuc k\u0254\u0308k
  kadi\u00e4k k\u025b\u014b kooth yiic.\u201d\"", "\"L\u00ebk ye lueth ku yith n\u00eb
  bi\u00e4k de tuaany \u00eb Coronavirus (COVID-19)\\nLUETH: Y\u00efn al\u00ebu ba
  tuaany \u00eb coronavirus lu\u0254\u0308i y\u00eflac \u00eb w\u025bl ke antibiotics
  (w\u025bl \u00eb tuaany awu\u0254\u0254k nyaai) ka antimalarial (w\u025bl \u00eb
  mal\u00e4riya)\\nYIC: Yen ac\u00efn w\u025b\u0308l abirgu\u0254\u0308p ka y\u00eflac
  de tuaany \u00eb coronavirus.\\nk\u0254c \u00eb wal g\u00f6\u00f6rc\u00f6k \u00eb
  pinynhom alui ar\u00ebt b\u00efk w\u025b\u0308l abirgu\u0254\u0308p yen\u00eb tuaany
  ti\u025b\u025bt roor looi. K\u0254c ju\u025b\u0308c them w\u025bl abirgu\u0254\u0308p
  at\u0254\u0308 \u00ebm\u025bn n\u00eb dh\u00f6l de th\u00ebm \u00ebyic \u00eb wal.
  T\u00ebd\u0254\u0308, acie nyicku ye kaam y\u00efnd\u00ef b\u00ef lon ajui\u025b\u025br
  \u00eb wal nyaai.\\nk\u0254c \u00eb wal g\u00f6\u00f6rc\u00f6k alui aya b\u00efk
  t\u00eb w\u025bl \u00eb yam ku t\u0254\u0308\u0254\u0308 k\u00eb \u00ebm\u025bn
  kek l\u00ebu b\u00efk kony \u00eb yilac de coronavirus. c\u00eftm\u025bn de, w\u025bl
  \u00eb yilac de tu\u025bny \u00eb rim yiic ye c\u0254\u0254l remdesivir, ac\u00ef
  gam am\u025b\u0308\u025b\u0308th n\u00eb Australia yic b\u00ef k\u0254c c\u00ef
  tuaany de COVID-19 t\u00f6k ar\u00ebt ke d\u0254m. w\u025bl k\u0254\u0308k k\u0254\u0254r
  kek c\u00f6k an\u0254\u014biic w\u025bl \u00eb tuaaany \u00eb yomthook, w\u025bl
  \u00eb mal\u00e4riya ku HIV. Keek acie l\u00ebu b\u00efk coronavirus lu\u0254\u0308I
  y\u00eflac kua al\u00ebu b\u00efk cin \u00eb k\u0254c d\u0254m tuaany kek tekic
  ku j\u0254l ya t\u00f6k \u00eb tu\u025bny c\u00ef tu\u0254\u0308l\\nYen athiekic,
  \u00ebk\u025by\u025b, ba r\u0254t g\u00ebl lu\u0254\u0308\u0254\u0308I\u00eb tiitroor
  acu\u0254l nhom ku ci\u025b\u0308n acu\u0254l ne ku\u025br \u00eb w\u00eb\u00ebi,
  ye r\u0254t m\u025b\u025bc roor, r\u025b\u0308\u025b\u0308r \u00eb baai ku c\u0254k
  r\u0254t athem na bec y\u00efn gu\u0254\u0308p, ku cie\u014b alanh \u00eb kum \u00eb
  nyin na t\u0254\u0308 y\u00efn \u00eb baai l\u0254\u014b tek tuaany r\u0254t piny
  th\u00efn ar\u00ebt, \u00ebjik t\u00eb ril yen yic ba m\u025b\u025bc \u00eb r\u0254twei
  t\u00ebn\u00eb k\u0254c k\u0254\u0308k ya lu\u0254\u0308\u0254\u0308I nhom.\\nLUETH:
  M\u00efth kek aye ye coronavirus \u2018t\u025bkpiny ar\u00ebtic\u2019\\nYIC: Na
  c\u0254k m\u00efth ya nyic l\u0254n yekek rui ku k\u00e4m \u2018t\u025bkpiny ar\u00ebtic\u2019,
  c\u00eftm\u025bn de ju\u025b\u0308i, kaye tuaany de COVID-19 nyu\u0254\u0254th \u00ebm\u025bn
  aye lueel l\u0254n ye awu\u0254\u0254k \u00eb k\u025bm \u00eb m\u00efth n\u00eb
  thukulic acie ku\u0254\u0308tic. D\u0254\u0308 t\u0254\u0308, yen ac\u00efn k\u00ebn\u00eb
  nyu\u0254\u0254th t\u00ebd\u0254\u0308 \u00eb pinynhom l\u0254n tek \u00eb piny
  \u00eb tuaany tu\u0254\u0308l n\u00eb kuer \u00eb m\u00efth. T\u00eb c\u0254k yen
  r\u0254t ya l\u00ebu, k\u025b\u0308k \u00eb yith nyu\u0254\u0254th ab\u025b\u0308n
  aye lueel l\u0254n cie yekek COVID-19 t\u025bkpiny ar\u00ebtic.\\nLUETH: Australia
  acie l\u00ebu b\u00efk k\u025b\u0308k ak\u00efm \u00eb y\u00eflac ku k\u025b\u0308k
  \u00eb ku\u0254\u0254ny (makana aw\u00eb\u00ebi ku\u0254nyth\u00efn, ka yen\u00eb
  ke wuumkum, k\u025b\u0308k \u00eb them)\\nYIC: Australia ac\u00ef luui ab\u00ef
  tiam n\u00eb t\u00ebk \u00eb yic de tuaany, k\u00eb ye \u00eb k\u00e4n lueel l\u0254n
  c\u00ef \u0263ok k\u0254c ju\u025b\u0308c dur bec ab\u00ef b\u025b\u0308\u025b\u0308I
  ak\u00efm thi\u00e4\u014b cu\u0254\u0308k aloi r\u0254t.\\n\u0263ok an\u0254\u014b
  kaju\u025b\u0308c \u00eb lu\u0254i de ak\u00efm at\u0254\u0308 Australia, kek\u00eb
  kaju\u025b\u0308c aye looi n\u00eb Australia ku tek \u00ebkek piny Australia yic
  n\u00eb th\u00e4\u00e4 thook ab\u025b\u0308n. C\u00eftm\u025bn, k\u025b\u0308k \u00eb
  y\u00eflac c\u00ef kek kutnh\u00ef\u00efm baai ac\u00ef d\u00f6\u014b kake ju\u025b\u0308c
  apu\u0254th ku ac\u00ef ka w\u025b\u0308r bak de bianabur thi\u025b\u0308rnyi\u025bny
  ke al\u025b\u0308th \u00eb kum \u00eb nyin c\u00ef ke juiir \u00eb b\u00ef\u00ef
  n\u00eb run de 20201 yic.\\nakutnh\u00ef\u00efm \u00eb luup de nhom t\u00ebn\u00eb
  akuma de k\u0254c Australia, n\u0254\u014biic, Communicable Diseases Network Australia
  (akutnhom \u00eb tueny-tueny yeke wu\u0254\u0254k Australia) ku Public Health Laboratory
  Network (Akut de ti\u025b\u0308\u025b\u0308\u014b ke rim \u00eb pialgup \u00eb ju\u00e4\u00e4c)
  aye mat ak\u00f6lk\u00f6l b\u00efk ajui\u025b\u025br de k\u025b\u0308k ath\u00ebm
  \u00eb tuaany de COVID-19 ya dhuk \u00eb t\u00ef\u014b, b\u00ef looi ago ya ath\u00ebm
  thiekic yen b\u00ef ya looi t\u00ebn\u00eb ku\u0254\u0254ny \u00eb dhuk \u00eb nhom
  de pialgup da t\u00ebn\u0254\u014b tuaany de COVID-19 kuany baai yic.\\nLUETH: B\u025b\u0308\u025b\u0308I
  ak\u00efm ke Australia acie l\u00ebu b\u00efk cin \u00eb k\u0254c ju\u025b\u0308c
  d\u0254m tuaany \u00eb coronavirus yen juak yic ke l\u00ebu.\\nYIC: Australia ac\u00ef
  luui ab\u00ef tiam n\u00eb t\u00ebk \u00eb yic de tuaany, k\u00eb ye \u00eb k\u00e4n
  lueel l\u0254n c\u00ef \u0263ok k\u0254c ju\u025b\u0308c dur bec ab\u00ef b\u025b\u0308\u025b\u0308I
  ak\u00efm thi\u00e4\u014b cu\u0254\u0308k aloi r\u0254t. Australia an\u0254\u014b
  b\u025b\u0308\u025b\u0308I ak\u00efm \u00eb pialgup t\u0254\u0308 nh\u00ef\u00efm
  tue\u014b kek c\u00ef r\u00f6t juiir b\u00efk kaju\u025b\u0308c m\u025bt \u00eb
  th\u00efn yu\u00efc kek n\u00eb th\u00e4\u00e4 de tuaany \u00eb COVID-19 kuany baai
  kek na ye k\u0254\u0254r. k\u00e4n an\u0254\u014bic ri\u025bl l\u00ebu b\u00efn\u00eb
  ag\u025bn \u00eb panak\u00efm k\u0254\u0308k mat th\u00efn, k\u025b\u0308k \u00eb
  lu\u0254i ak\u00efm, kaye k\u0254\u0254r panak\u00ef\u00efm, ku k\u0254c \u00eb
  y\u00eflac ak\u00efm looi n\u00eb kuer m\u025b\u0308n \u00eb cin\u00eb kaam de akuma
  \u00eb k\u0254c Australia, Akumaa ke state ku territory ku bak \u00eb yilac de y\u00efk
  \u014b\u025bk.\\nLUETH: Thi\u00f6\u00f6k \u00eb k\u025b\u0308\u014b thook n\u00eb
  l\u00e4\u00e4t karou ab\u00ef tekpiny de tuaany \u00eb coronavirus c\u0254k ak\u00e4\u00e4c\\nYIC:
  T\u025b\u0308\u025b\u0308u \u00eb g\u00ebl \u00eb k\u0254c n\u00eb l\u00e4\u00e4t
  karou ka di\u00e4k ku ny\u025b\u025bi g\u00ebl ku dhuk k\u0254c \u00eb p\u00ef\u00efr
  th\u025b\u025bric acie b\u00ef tekpiny \u00eb tuaany de COVID-19. c\u0254k ak\u00e4\u00e4c.\\nK\u0254c
  ju\u025b\u0308c c\u00ef tuaany de COVID-19 ke d\u0254m aye gup na\u014b c\u00eft
  \u00eb b\u00ebc kor ka liu k\u00eb. K\u00ebr\u025b\u025bc y\u00f6k k\u0254c n\u00eb
  thi\u00f6\u00f6k \u00eb thok de k\u025b\u0308\u014b ee l\u0254n k\u0254c c\u00efn
  gup c\u00eft \u00eb tuaany de COVID-19 al\u00ebu b\u00efk k\u0254c k\u0254\u0308k
  c\u0254k awu\u0254\u0254k \u00eb tuaany t\u00eb c\u00efn\u00eb k\u025b\u0308\u014b
  ri\u025b\u0308\u025b\u0308c ab\u025b\u0308n liep b\u00ef \u0263\u0254\u0308\u0254\u0308r
  n\u00eb th\u00f6k de g\u00ebl \u00eb c\u00e4th.\\nKuer pu\u0254th ar\u00ebt b\u00ef
  kony n\u00eb cu\u0254\u0308k tekpiny \u00eb tuaany de COVID-19 ee b\u00ef tiitroor
