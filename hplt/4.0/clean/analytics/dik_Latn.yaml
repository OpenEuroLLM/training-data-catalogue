  ye r\u0254t m\u025b\u025bc roor, r\u025b\u0308\u025b\u0308r \u00eb baai ku c\u0254k
  r\u0254t athem na bec y\u00efn gu\u0254\u0308p, ku cie\u014b alanh \u00eb kum \u00eb
  nyin na t\u0254\u0308 y\u00efn \u00eb baai l\u0254\u014b tek tuaany r\u0254t piny
  th\u00efn ar\u00ebt t\u00eb ril yen yic ba m\u025b\u025bc \u00eb r\u0254twei t\u00ebn\u00eb
  k\u0254c k\u0254\u0308k ya lu\u0254\u0308\u0254\u0308I nhom t\u00eb cien r\u0254t
  ye l\u00ebu.\\nK\u0254c ku\u025bk nyin lu\u0254i \u00eb pialgup k\u0254c ab\u00ef
  g\u025b\u0308k kake bu\u0254th d\u00f6m \u00eb tuaany c\u00f6k ak\u00f6lk\u00f6l
  n\u00eb Australia yic ku yen \u00eb te looi awu\u0254\u0254k r\u0254t th\u00efn.
  Keek ab\u00ef k\u0254c l\u025b\u0308k ka c\u00efk y\u00f6k n\u00eb ku\u00ebny \u00eb
  c\u00f6k yic n\u00eb k\u00eb c\u00eft l\u00f6\u014b \u00eb yam ka g\u00ebl \u00eb
  k\u0254c kek b\u00ef t\u00e4\u00e4u piny. Kuat \u00eb raan ab\u025b\u0308n apu\u0254th
  b\u00ef ya r\u00eb\u00ebr ke nyic g\u00ebl \u00eb k\u0254c t\u0254\u0308 \u00eb
  m\u025bn n\u00eb l\u0254 t\u00ebn\u00eb www.australia.gov.au.\\nLUETH: Th\u00ebm
  \u00eb kuat de raan ab\u025b\u0308n ab\u00ef tekpiny de tuaany \u00eb coronavirus
  c\u0254k ak\u00e4\u00e4c\\nYIC: Ath\u00ebm acie tekpiny \u00eb tuaany ye c\u0254k
  ak\u00e4\u00e4c.\\nT\u00f6\u014b de ka thiekiic t\u00ebn\u00eb g\u00ebl de ku muk
  \u00eb nhompiny de tuaany \u00eb COVID-19 aye yi\u025b\u0308k th\u00e4\u00e4, aye
  th\u025bm dh\u00f6l ku nyi\u025bc them pu\u0254th l\u0254c\u00f6k. Them \u00eb ti\u025b\u0308\u025b\u0308\u014b
  de tuaany athiekic n\u00eb nyi\u025bc lu\u025bl \u00eb t\u00eb c\u025bth tuaany
  th\u00efn, l\u00ebk de k\u00eb looi r\u0254t ku ajui\u025b\u025br \u00eb mu\u0254\u0308\u0254\u0308k
  de ku\u00ebny \u00eb c\u00f6k, ku th\u00f6k de n\u00eb dhuk \u00eb nyinpiny awu\u0254\u0254k
  \u00eb k\u0254c k\u025bm.\\nT\u00ebd\u0254\u0308, ath\u00ebm c\u00efn tuaany \u00eb
  COVID-19 c\u00ef y\u00f6k k\u00e4n acie nyu\u0254\u0254th l\u0254n l\u00ebu ben
  ci\u025b\u0308n ker\u025b\u025bc y\u00f6k y\u00efn ka k\u00ebr\u025b\u025bc y\u00f6k
  k\u0254c k\u0254\u0308k. Y\u00efn al\u00ebu b\u00ef y\u00ef them ku y\u00f6k COVID-19
  ke liu \u00eb gu\u0254\u0308p n\u00eb th\u00e4\u00e4 c\u00efn thi\u00e4\u00e4k kek\u00eb
  SARS-CoV-2 (rui kek ye tuaany de COVID-19 j\u0254\u0254k) kua y\u00efn ak\u00ebn
  c\u00eft \u00eb tuaany gu\u0254\u0308r nyu\u0254\u0254th. Yen \u00ebk\u00eb yen
  yic thi\u025bk ar\u00ebt ba tiit acu\u0254l roor ya looi ku r\u00eb\u00ebr kay\u00ef
  mec yic kek\u00eb k\u0254c k\u0254\u0308k, ku r\u00eb\u00ebr baai y\u00efle t\u00eb
  n\u0254\u014b yen k\u00eb thiekic l\u0254 k\u0254\u0254r. ka looi k\u00e4k, at\u00f6k
  kek\u00eb ath\u00ebm \u00eb gu\u0254\u0308p c\u00ef juiir akony k\u0254c n\u00eb
  g\u00ebl \u00eb tekpiny \u00eb tuaany cie COVID-19 \u00eb ku tu\u025bnytu\u025bny
  k\u0254\u0308k aya, cot g\u00f6r \u00eb konykony \u00eb k\u025b\u0308k \u00eb pialgup
  ke k\u0254c Australia nyinpiny.\\nTi\u025b\u0308m \u00eb mu\u0254\u0308\u0254\u0308k
  de t\u00ebde pialgup de ju\u00e4\u00e4c t\u00eb ju\u025bk k\u0254c d\u0254m tuaany
  kek ku tek r\u0254t piny \u00eb \u0263\u00e4n w\u00ebn t\u025b\u0308\u025b\u0308k
  thook ak\u0254\u0254r b\u00ef ath\u00ebm ya dhil \u00eb lu\u0254\u0254i apu\u0254th
  b\u00ef t\u00e4\u00e4u \u00eb kaam de mu\u0254\u0308\u0254\u0308k \u00eb tuaany
  tek r\u0254t piny ku g\u00ebl lu\u0254i de \u0263\u00e4n \u00eb th\u00ebm de tu\u025bnytu\u025bny
  ku ri\u025bl t\u0254\u0308 kek\u00eb \u0263\u00e4n \u00eb th\u00ebm\\nTh\u00ebm
  c\u00ef t\u025b\u0308\u025b\u0308knhom de k\u0254c Australia c\u00efn gup c\u00eft
  \u00eb tuaany yek\u00eb nyu\u0254\u0254th acien\u00eb k\u0254c ye ri\u025b\u025bl
  pu\u0254\u0308th b\u00efk ya looi. Ajui\u025b\u025br \u00eb th\u00ebm \u00eb gu\u0254\u0308p
  k\u00e4n acie yic t\u00ebn\u00eb tekpiny \u00eb tuaany ku acie kuer pu\u0254th yen\u00eb
  w\u00ebu t\u00ebn\u00eb ny\u00efc de t\u00eb c\u025bth tuaany \u00eb k\u0254c k\u025bm.
  aye akum de k\u0254c Australia nyic l\u0254n l\u00ebu b\u00ef ath\u00ebm \u00eb
  k\u0254c c\u00efn gup c\u00eft \u00eb tuaany na\u014b k\u00eb looi n\u00eb \u0263\u00e4n
  k\u0254\u0308k t\u00ebn\u00eb muk \u00eb nhom piny \u00eb tuaany ku w\u025b\u0308t
  \u00eb nyint\u00ef\u00eft. Kek \u00eb \u0263\u00e4n k\u00eb an\u0254\u014biic ajui\u025b\u025br
  \u00ebt\u00eb c\u00ef tuaany thi\u025b\u0308I piny, k\u0254c kek l\u00ebu b\u00ef
  tuaany ke dar ar\u00ebt t\u00eb tek yen r\u0254t piny t\u00ebn\u00eb \u0263\u00e4n
  c\u00efn k\u00ebdit c\u00ef r\u0254t looi th\u00efn, k\u0254c kek l\u00ebu b\u00efk
  yii\u0254 thi\u0254\u0308k ar\u00ebt kek\u00eb t\u00eb t\u0254\u0308 tuaany th\u00efn,
  ku k\u0254c kek t\u0254\u0308 t\u00eb tek tuaany r\u0254t piny th\u00efn ar\u00ebt
  kek ye ya k\u0254c ni\u0254p aya t\u00ebn\u00eb tuaany t\u00f6k r\u00ebt na wu\u0254\u0254k
  kek.\\nAkuma de k\u0254c Australia ag\u025b\u0308k keye ajui\u025b\u025br \u00eb
  th\u00ebm \u00eb gup lueel keye k\u00eb pu\u0254th, n\u0254\u014biic ath\u00ebm
  \u00eb gu\u0254\u0308p n\u00eb \u0263\u00e4n \u00eb lu\u0254i t\u00ebn\u00eb k\u0254c
  c\u00efn gup c\u00eft \u00eb tuaany, b\u00ef juiir ke c\u00ef laaric kek\u00eb k\u0254c
  mac lon de pialgup \u00eb ju\u00e4\u00e4c ku k\u0254c looi lon \u00eb nyuuth de
  ti\u025b\u0308\u025b\u0308\u014b \u00eb tu\u025bnytu\u025bny yiic. Yen \u00eb k\u00e4n
  ee looi apu\u0254th b\u00ef ku\u025br tu\u0254\u0308\u0254\u0308m ku luui k\u00eb
  ar\u00ebt kek yeke lu\u0254\u0308\u0254\u0308i. n\u00eb l\u00ebk ju\u025b\u0308c
  t\u00ebn\u00eb k\u00eb looi akuma de k\u0254c Australia n\u00eb l\u0254\u0254\u014b
  ath\u00ebm c\u00ef thi\u00e4i piny t\u00ebn\u00eb k\u0254c c\u00efn gup c\u00eft
  \u00eb tuaany, alim ba t\u00ef\u014b \u00eb Department of Health website.\\nLUETH:
  Ka yen\u00eb them acie \u00e4th\u00ebm l\u0254c\u025b\u0308p ye b\u025b\u0308\u025b\u0308i\\nYIC:
  N\u00eb Australia yic<, ath\u00ebm de tuaany \u00eb COVID-19 aye ath\u00ebm l\u0254c\u025b\u0308p
  b\u025b\u0308\u025b\u0308i. ku\u025br yen\u00eb jke them ab\u025b\u0308n yeke lu\u0254\u0308\u0254\u0308I
  Australia ac\u00ef kek c\u0254\u0308kpiny \u00eb them ar\u00ebt. Kek ag\u025b\u0308k
  kake ye ti\u025b\u0308\u014b dh\u00f6l n\u00eb Therapeutic Goods Administration
  (TGA) (amatnhom mac ka yen\u00eb them \u00eb k\u0254c gup) ku ajui\u025b\u025br
  \u00eb dhil \u00eb m\u025bt r\u00f6t n\u00eb th\u00f6\u00f6\u014b de ka yen\u00eb
  ke k\u0254c them gup yen c\u00ef juiir \u00eb lu\u0254i keye k\u00eb yen\u00eb SARS-CoV-2
  (rui kek ye tuaany de COVID-19 j\u0254\u0254k).\\nN\u00eb Australia yic, laboratory-based
  polymerase chain reaction testing (PCR) ee nyi\u025bc them ar\u00ebt t\u00eb luui
  yen b\u00efn\u00eb SARS-CoV-2 t\u00f6k ar\u00ebt c\u00ef wu\u0254\u0254k \u00eb
  gu\u0254\u0308p du yic, ku ak\u0254\u0254r b\u00ef kaye l\u00f6\u00f6m n\u00eb ku\u025br
  \u00eb w\u00eb\u00ebi ya nyaai b\u00efn\u00eb ke ath\u00ebm looi. Ath\u00ebm \u00eb
  PCR aye l\u0254 nyeei ar\u00ebt ku aye ka thii kor ye t\u0254\u0308 n\u00eb gu\u0254\u0308p
  du yic kek nhi\u025b\u025br SARS-CoV-2 kek n\u00eb k\u025b\u0308k ath\u00ebm n\u00eb
  w\u00eb\u00ebi c\u00ef ku\u0254\u0308\u0254\u0308tic.\\nKuat \u00eb lon de ath\u00ebm
  ye yam t\u00ebn\u00eb Australia aye k\u0254\u0254r b\u00ef ka\u014b ya themic apu\u0254th
  n\u00eb TGA b\u00ef looi ago nyi\u025bc ya luui ku ye kapu\u0254th y\u00f6k n\u00eb
  th\u00ebmic ku ju\u025bk b\u00ef\u00ef de yic n\u00eb dh\u00f6l \u00eb l\u00f6\u014b.
  N\u00eb l\u00ebk pu\u0254c b\u025brpiny t\u00ebn\u00eb ath\u00ebm de tuaany \u00eb
  COVID-19 at\u0254\u0308 th\u00efn n\u00eb webthiaat de Australian Register of Therapeutic
  Goods yic. Alim ke nem n\u00eb : www.tga.gov.au/covid-19-test-kits-included-artg-legal-supply-australia.\\nLUETH:
  tuaany de Coronavirus ee w\u025b\u025bt\\nYIC: Tuaany de COVID-19 aye j\u0254\u0254k
  n\u00eb coronavirus (SARS-CoV-2), yen ye bak \u00eb kuat d\u00eft de rui kek l\u00ebu
  b\u00efk awu\u0254\u0254k \u00eb tuaany de w\u00eb\u00ebi b\u025b\u0308\u025b\u0308I
  t\u00ebn\u00eb k\u025bc ku l\u025b\u0308\u025b\u0308i. awu\u0254\u0254k k\u00e4k
  al\u00ebu b\u00efk yiic kut j\u0254\u0254k n\u00eb k\u00eb cie t\u0254\u0308k l\u0254
  n\u00eb tuaany t\u00f6k ar\u00ebt. Tuaany \u00eb COVID-19 ee r\u0254t t\u025bkpiny
  \u00eb k\u025bm ke k\u0254c n\u00eb kuer thuthuei ye l\u00f6\u00f6ny piny ku kuer
  \u00ebk\u025b\u0308 ye \u014b\u0254\u0254t nh\u00ef\u00efm c\u00ef ya wu\u0254\u0254k.\\nN\u00eb
  Australia yic, Victorian Infectious Diseases Reference Laboratory (VIDRL) yen t\u0254\u0308
  the Peter Doherty Institute for Infection and Immunity, ee ye k\u00eb tue\u014b
  de ath\u00ebm \u00eb ri\u025bm ak\u00ebnbaai de china b\u00ef tuaany de SARS-CoV-2
  ya week thok. VIDRL ar\u0254m tuaany c\u00ef r\u0254t wel kek\u00eb \u0263\u00e4n
  ath\u00ebm \u00eb ri\u025bm ke k\u0254c Australia k\u0254\u0308k, World Health Organization
  (man\u025b\u0308th\u025b\u0308ma muk pialgup \u00eb piny nhom) ku b\u025b\u0308\u025b\u0308I
  k\u0254\u0308k, b\u00efk ajui\u025b\u025br \u00eb lu\u0254i \u0263\u00e4th tue\u014b,
  c\u00f6kpiny de k\u00eb looi ku th\u00ebm \u00eb yic de ath\u00ebm \u00eb gup t\u00ebn\u00eb
  tuaany de COVID-19.\\nAustralia amigu\u0254\u0308p b\u00ef ku\u0254ny n\u00eb akutnhom
  n\u0254\u014b k\u00eb nyick\u00eb de \u0263\u00e4n \u00eb ti\u025b\u0308\u025b\u0308\u014b
  \u00eb ri\u025bm yiic ke ju\u00e4\u00e4c ku k\u025b\u0308k \u00eb y\u00efk \u014b\u025bk
