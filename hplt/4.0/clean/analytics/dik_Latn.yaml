  lac\u00f6k luth\u00efn an\u0254\u014bic:\\n- lu\u0254i \u00eb akutnh\u00ef\u00efm
  lui b\u00efk g\u025bm ku guirk\u00eb t\u00ebn lu\u0254i t\u00eb k\u0254c lui w\u00ebn
  yen piath ku ac\u00efn k\u00ebrac t\u00ebn pialw\u00ebi\\n- lu\u0254i \u00eb akutnh\u00ef\u00efm
  lui b\u00efk dai ye pialw\u00ebi \u00eb k\u0254c c\u00ef lu\u00f6i ku k\u00e4k j\u0254\u0308\u0254\u0308r
  lu\u0254i yic eb\u00ebn\\n- lu\u0254i \u00eb akutnh\u00ef\u00efm lui b\u00efk nyu\u0254th
