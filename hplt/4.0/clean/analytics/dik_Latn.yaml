  ya ked\u00eft rac ap\u025bi.\\nK\u00e4k \u00eb awu\u00f6c \u00eb n\u00e4k raan t\u00ebn
  lu\u0254i\\nK\u00e4k \u00eb awu\u00f6c yam n\u00e4k raan t\u00ebn lu\u0254i aye:\\n-
  raan l\u00ebu b\u00ef kuum adh\u00efl akutnhom ted\u00e4 ke raan w\u00ebn k\u00ebc
