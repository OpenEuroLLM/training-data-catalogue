  akutnh\u00ef\u00efm lu\u0254i akuma (government entities).\\nB\u00e4\u00e4ny\\nB\u00e4\u00e4ny
  \u00eb akutnhom lu\u0254i l\u00f6\u00f6\u014b, akutnh\u00ef\u00efm r\u0254\u0254m
