  thath. Yen aya e k\u0254c ku\u0254ny cok aguir t\u00ebn\u00eb abek\u00f6\u00f6k.\\nThukul
  k\u00e4k t\u00ebt Tasmania\\nPi\u00f6c k\u00e4k t\u00ebt n\u00eb Launceston\\nK\u00e4k
  pi\u00f6c akut nhom k\u0254\u0308k\\nMat\u00ebm \u00eb pi\u00f6\u00f6c Tasmania\\nBa
  nu\u025bt t\u00ebn\u00eb k\u00e4k pi\u00f6\u00f6c akut nhom n\u00eb Tasmania\\nK\u00e4k
  t\u00ebtTasmania\\nL\u00ebk e ku\u0254ny akuma \u00eb pi\u00f6\u00f6c k\u00e4k t\u00ebt
  ku pi\u00f6c n\u00eb Tasmania.\"", "\"Kanye West\\nKanye Omari West (dhi\u00ebth
  P\u025bn\u00ebdhetem ak\u0254l 8, 1977), raan Amer\u00efka pan Chicago, ee ari\u00e4\u014bti\u00f6n
  \u0263ip\u0263op, mag\u0254\u0308tdi\u025bt, mab\u00ebk\u00e4\u014bbei \u00eb d\u00f6m\u00ebdi\u025bt
  [record producer], madiir \u00eb c\u00e4that\u00ef\u00efp [movies], raanguirji\u025bk,
  ku maguiirk\u00e4cie\u014b. L\u025bcde ac\u00eb l\u0254 nhial ru\u0254\u0308n 2000
  ci\u025blic. Akuut\u00ebdi\u025btke tue\u014b karou, The College Dropout (\\\"Ap\u00e4lg\u00e4\u00e4t
  \u00eb \u0194\u00f6nd\u00eft\\\") ku Late Registration (\\\"G\u00ebtpiny c\u00eb
  Gau\\\") ac\u00eb k\u00e4leec\u00eblonpath [awards] juac (adekic Grammys kadhetem)
  y\u00f6k, ku ac\u00ef leec n\u00eb k\u0254c yee t\u00efo\u014bdh\u00eb\u00eb\u014b
  [m\u00e4dhik\u00e4] laathic ku ac\u00eb ti\u025bm ar\u00ebt ay\u025b lo\u014b de
  \u0263\u025b\u025bc n\u00eb d\u00f6m\u00ebdi\u025btke. West aya an\u0254\u014b de
  akutm\u025b\u0308tloiweu \u00eb d\u00f6m\u00ebdi\u025bt c\u0254l GOOD Music. Ab\u00ef\u00efduar\u00eb
  ku r\u025b\u0308\u025b\u0308\u014b\u00eb\u0263\u025b\u025bc\u00eb ye k\u00f6\u00f6r-ayu\u00e4\u00e4l.
  Kin \u00eb k\u00f6\u00f6r-ayu\u00e4\u00e4l ac\u00eb t\u00efc n\u00eb k\u0254\u0308\u0254\u0308th
  ke akuut\u00ebdi\u025btken tue\u014b kadi\u00e4k k\u0254\u0254th ku n\u00eb din
  t\u00f6k k\u0254u aya c\u0254l \\\"Stronger\\\" (\\\"Ari\u025bl Ap\u025b\u00ef\\\").
  Ru\u0254\u0308n 2008 ac\u00ef akuut\u00ebdi\u025bt\u00eb ka\u014buan b\u025b\u0308n
  bei, 808s & Heartbreak (\\\"808s ku Dhienpu\u0254\u0308u\\\"). Ru\u0254\u0308n 2010
  ac\u00ef akuut\u00ebdi\u025bt\u00eb kadhi\u00ebc b\u025b\u0308n bei, c\u0254l Words
  (W\u00ebl), ku ru\u0254\u0308n 2013 akuut\u00ebdi\u025bt\u00eb kadhetem, Yeezuz.
  Yeezuz ac\u00ef ben dhuuklaath apath y\u00f6k n\u00eb k\u0254c yee tu\u00f6ndh\u00eb\u00eb\u014b
  laathic.\\nP\u00efrden tue\u014b[cokic | cok t\u00ebn\u00eby\u00f6kic]\\nWest ac\u00eb
  dhi\u00ebth n\u00eb amidhi\u00eb\u00ebth k\u0254c col tokaamiccielic [middle-class]
  pan Atlanta, Georgia. Yen kek\u00eb man aac\u00eb k\u0254\u0308k Chicago \u0263\u0254n
  yen ru\u0254\u0308nke di\u00e4k. Yen ac\u00eb g\u0254\u0308l b\u00eb k\u00ebp dh\u00eb\u014b
  g\u0254\u0308t keye ru\u0254\u0308n dhi\u00ebc. Kanye kek\u00eb man aac\u00eb j\u0254l
  Nanji\u014b, China waar yen ru\u0254\u0308nke thi\u00e4\u00e4r. N\u00eb ru\u0254\u0308n
  1997, West ac\u00eb g\u0254l b\u00eb teet\u00eby\u00ef\u025bu pi\u00f6\u00f6c n\u00eb
  American Academy of Art (\u0194\u00f6nd\u00eft \u00eb Teetdh\u00eb\u014b de Amerik\u00e4)
  n\u00eb pan Chicago. N\u00eb kaam thiin c\u00f6k ac\u00eb t\u00ebde g\u00e4\u00e4r
  waaric b\u00eb l\u0254 Chicago State University (\u0194\u00f6nd\u00eft Pawut Chicago)
  b\u00eb pi\u00f6cde ru\u0254k l\u0254\u014b Tho\u014bd\u00ef\u014bl\u00efth. Na
  wen c\u00eb ruon 20 \u0263\u00f6nd\u00eft paal b\u00eb nyin tuir n\u00eb ti\u00f6ndh\u00eb\u00eb\u014b.\"",
  "\"G\u0254\u0308c \u00ebk\u00eb c\u00ef g\u0254\u0308t\\naba\u014b PDF t\u00ebn\u00eb
  ap\u00e4m k\u00ebn\u00eb (29kb)\\nL\u00e4t de k\u0254cd\u00eft pi\u0254\u0308c ador
  kapu\u0254th ju\u025b\u0308c ye ke y\u00f6k n\u00eb pi\u00f6c \u00eb k\u0254cd\u00eft
  yic t\u0254\u0308 n\u00eb Australia.\\nThukul de k\u0254c cie\u014b baai ac\u00ef
  liep thok t\u00ebn\u00eb k\u0254c kek n\u0254\u014b run ku\u0254\u0308tiic ku n\u0254\u014b
  k\u00eb thukul wu\u00e4\u00e4c . \u00cb ru\u0254\u0308n t\u00f6kic bu\u0254t de
  al\u00efb de k\u0254c ke Australia aye kuen \u00eb ku\u025br n\u00eb lu\u0254\u0308i
  tajir kueen, pu\u0254\u0308r, ku\u025br \u00eb lu\u0254i, k\u0254mpu\u0254\u0308ta,
  d\u00eb\u00ebt ku thuur, di\u025b\u0308r, pial de gup, th\u00e4t, ku thook n\u00eb
  kuer de akutnh\u00ef\u00efm \u00eb k\u0254c cie\u014b baai ye pi\u00f6\u00f6c .\\nThukul
  \u00eb k\u0254c ke baai ac\u00efn w\u00ebu ju\u025b\u0308c yeke k\u0254\u0254r ku
  yen aye gam n\u00eb kuer pu\u0254th tu\u0254\u0308\u0254\u0308m ke k\u0254c, n\u0254\u014biic
  thukuul d\u00eft ke k\u0254c cie\u014b baai, \u0263\u00f6\u00f6t ak\u025b\u025bthnh\u00ef\u00efm,
  \u0263\u00f6\u00f6t ke ath\u00f6r ku TAFE. \u0194\u00e4n ye abak\u00f6\u00f6k ke
  k\u025b\u0308k ku\u0254\u0254ny y\u00f6k th\u00efn k\u0254\u0308k aye thukul gam,
  ku kek al\u00ebu b\u00efk y\u00efn kony n\u00eb y\u00f6k de k\u0254\u0308\u0254\u0308th
  tu\u0254\u0308\u0254\u0308m kek\u00eb k\u0254\u0254r. Y\u00efn al\u00ebu ba r\u0254t
  mat n\u00eb akutnhom de pol yic, w\u025b\u0308kc\u0254p de k\u00f6l t\u00f6k, ka
  ye k\u0254\u0308\u0254\u0308th \u00eb l\u00e4\u00e4t ka p\u025b\u0308i ju\u025b\u0308c.\\nThukul
  ke k\u0254c cie\u014b baai k\u00ebn\u00eb ke yi\u025b\u0308k ri\u025bl (k\u0254\u0308\u0254\u0308th
  c\u00efn ny\u00efny d\u00ef\u00eft ye l\u0254 y\u00f6k th\u00efn nhi\u00e4k) al\u00ebu
  b\u00efk ya kuer pu\u0254th juiir l\u0254 \u00eb thukul tue\u014b d\u0254\u0308
  yic, luui, ka g\u025b\u0308\u025b\u0308r \u00ebk\u00eb ca nyic. K\u0254\u0308\u0254\u0308th
  cekic al\u00ebu b\u00ef y\u00efn kony ba na\u014b ny\u00efny \u00eb t\u00eb\u00ebt
  de yam ka ku\u025br \u00eb pi\u00f6cd\u00eft, kuany k\u00ebn\u00eb pu\u0254\u0308n
  du c\u00f6k, c\u0254\u0308k \u00eb ku\u025br kuk \u00eb jam piny, ku ye r\u0254\u0308m
  ken\u00eb k\u0254c \u00eb dhi\u00ebnh du\u0254\u0308n. Y\u00efn ab\u00ef t\u00eb
  ye thukuul Australia luui th\u00efn nyic ar\u00ebt j\u0254k deet \u00eb pu\u0254\u0308u
  b\u00efn lu\u0254i ku pi\u00f6c kuanyc\u00f6k n\u00eb kuer \u00eb yam.\\nBa\u014b
  pu\u0254th n\u00eb c\u00e4th dun \u00eb p\u00efr de pi\u00f6c b\u025b\u0308ric!\"",
  "\"22\\n1 Ku ben atuny nhial \u0263a nyu\u0254\u0308th w\u00e4r c\u00ef thi\u00e4\u014b
  p\u00efu \u00eb p\u00efr la k\u00efrk\u00efr ap\u025bi b\u0254\u0308 t\u00ebn\u00eb
  th\u00f6ny Nhialic ku Manh Am\u00e4\u00e4l,\\n2 ke ku\u00eb\u00ebr geeu g\u00ebk
  ci\u025bl yic. Ag\u00f6r \u00eb w\u00e4r l\u0254\u014b ku l\u0254\u014b, ak\u025b\u0308\u025b\u0308c
  tim \u00eb p\u00efr th\u00efn, tim lu\u0254k \u00eb p\u025b\u025bi thok \u00ebb\u00ebn
  ru\u0254\u0308\u0254\u0308n t\u00f6k yic, ku k\u0254c wu\u0254\u0308t \u00ebb\u00ebn
  aa yi\u025b\u0308thke l\u00f6\u00f6m b\u00ef kek \u0263\u0254\u0308nt\u00f6\u00f6k
  aa c\u0254l adem, ku tu\u025bny k\u0254\u0308k aya.\\n3 Ac\u00efn d\u025b\u0308t
  m\u025b\u025bn Nhialic b\u00ef r\u00eb\u00ebr ye gen k\u00ebn\u00eb yic. K\u0254c
  Nhialic ku th\u00f6ny Nhialic kek th\u00f6ny Manh Am\u00e4\u00e4l kek aa r\u025b\u0308\u025b\u0308r
  th\u00efn, ku k\u0254c \u00eb Nhialic kek aab\u00ef ye aa door.\\n4 K\u0254ck\u00e4
  aab\u00ef Nhialic aa t\u00ef\u014b ku rin Nhialic ab\u00ef g\u00e4t kenh\u00ef\u00efm
  tue\u014b.\\n5 Ab\u00ef ci\u025b\u0308n cu\u0254l \u00eb piny ye gen yic. K\u0254c
  \u00eb r\u00eb\u00ebr th\u00efn aac\u00ef\u00ef b\u00ef w\u00efc ru\u025bl ak\u0254\u0308l,
  t\u025b\u0308d\u00eb ke ye many b\u00ef piny mer yen w\u00efck\u00eb. Rin Nhialic
  yen ab\u00ef ya ru\u025blden. Aab\u00ef r\u00eb\u00ebr th\u00efn ke ye b\u00e4ny
  ak\u00f6lri\u00eb\u00ebc \u00ebb\u00ebn.\\nB\u025b\u0308n \u00eb Jethu\\n6 Go atuuc
  l\u025b\u0308k \u0263a, \u201cKuat k\u00e4k ca t\u00ef\u014b ku pi\u014b ke aa yith
  \u00ebb\u00ebn. Ku B\u025b\u0308ny Nhialic yen W\u025b\u0308ike \u0263\u00e4th \u00eb
  k\u0254c k\u00e4k Nhialic t\u00ef\u014b gup, yen ac\u00e4 atu\u0254\u0308nyde tu\u0254\u0308\u0254\u0308c
  b\u00ef kacke nyu\u0254\u0308th k\u00e4k b\u00ef r\u00f6t looi ye n\u00efnk\u00e4.\u201d\\n7
  Aye Jethu lueel \u00ebl\u00e4, \u201cDhi\u025blk\u00eb pi\u014b apath! \u0194\u025bn
  ab\u0254\u0308 \u00ebm\u00ebn! K\u0254c mit pu\u0254\u0308th aa k\u0254c thek k\u00e4k
  c\u00ef lueel ath\u00f6r k\u00ebn\u00eb yic \u00ebb\u00ebn!\u201d\\n8 Ee \u0263\u025bn
  Joon \u0263\u025bn a \u0263a p\u00ef\u014b ku ti\u025b\u0308\u014b k\u00e4kk\u00e4.
  T\u025b\u0308w\u00ebn c\u00ef \u0263\u025bn ke pi\u014b ku ti\u025b\u0308\u014b
  ke, ke \u0263a gut \u0263anhi\u0254l piny yec\u00f6k ku du\u0254\u0254r atuny w\u00ebn
  nyuth \u0263\u025bn k\u00e4kk\u00e4.\\n9 Go jal l\u025b\u0308k \u0263a, \u201cDuk
  loi k\u00ebya! \u0194\u025bn alony c\u00efm\u00ebndu, ku mi\u025b\u0308thakui k\u0254c
  k\u00e4k Nhialic t\u00ef\u014b, ku k\u0254c \u00ebb\u00ebn k\u00e4k t\u0254\u0308
  ath\u00f6r yic theek. Dor Nhialic!\u201d\\n10 Ku l\u00ebk \u0263a, \u201cDuk k\u00e4k
  c\u00ef g\u0254\u0308t ath\u00f6r k\u00e4k Nhialic k\u00ebn\u00eb yic thian t\u00ebn\u00eb
  k\u0254c, rin c\u00ef piny thi\u0254\u0308k ke th\u00f6k.\\n11 Ku k\u0254c k\u00e4r\u025bc
  looi aab\u00ef \u014bot ke la tue\u014b ke looi k\u00e4r\u025bc, ku k\u0254c c\u00ef
  w\u025b\u0308t J\u0254\u014brac gam aab\u00ef \u014bot loik\u00eb k\u00ebya. Ku
  k\u0254c \u00eb luui k\u00e4path aab\u00ef ya luui k\u00e4path. Ku k\u0254c Nhialic
  aab\u00ef la tue\u014b ke luui Nhialic.\u201d\\n12 Aye Jethu lueel \u00ebl\u00e4,
  \u201cPi\u025b\u014bk\u00eb apath \u0263\u025bn ab\u0254\u0308 \u00ebm\u00ebn thiin,
  \u0263\u025bn ab\u0254\u0308 ba k\u0254c b\u025b\u0308n ri\u0254p, t\u025b\u0308d\u00eb
  ke \u0263a t\u00ebm k\u0254c awu\u0254\u0308c th\u00f6\u014b kek k\u00eb c\u00ef
  \u014b\u025bk looi th\u025b\u025br w\u00e4\u00e4r.\\n13 Ee \u0263\u025bn j\u0254\u0308k
  \u00eb c\u00f6k ku \u0263\u025bn th\u00f6k \u00eb k\u00e4\u014b.\\n14 \u201cK\u0254c
  mit gup aa k\u0254c c\u00e4 al\u00e4thken l\u0254\u0254k ri\u025bm Manh Am\u00e4\u00e4l,
  rin aab\u00ef la yic b\u00efk m\u00efth tim p\u00ef\u00efr cam, ku aala yic aya
  b\u00efk la gen Nhialic \u00eb yam.\\n15 K\u0254c t\u0254\u0308 g\u025bu k\u0254\u0308u
  aa k\u0254c pan mac, k\u0254c c\u00ef kegup yi\u00ebk acu\u0254l rin theek kek j\u0254\u014brac,
  k\u0254c n\u00e4k \u00eb k\u0254c, ku k\u0254c \u00eb jam lueth, ku k\u0254c luui
  k\u00e4k bal aac\u00ef\u00ef k\u0254\u014b la \u00eb gen k\u00ebn\u00eb yic ac\u00efn.\\n16
  \u201cAye Jethu lueel \u00ebl\u00e4, \u0194\u025bn ac\u00e4 atu\u0254\u0308nydi\u025b\u0308
  tooc b\u00ef k\u00e4kk\u00e4 b\u025b\u0308n l\u025b\u0308k we, wek akuut c\u00ef
  gam. \u0194\u025bn \u00eb kuat dhi\u00ebnh b\u025b\u0308ny\u014baknhom Debit, ee
  ci\u00eb\u00ebr bak piny \u00eb ru\u025bl b\u025b\u0308\u025b\u0308i.\u201d\\n17
  Aye W\u00ebi Nhialic ku k\u0254c Nhialic kek c\u00eft nyan thiak \u00eb Manh Am\u00e4\u00e4l
  lueel, \u201cB\u00e4k!\u201d Ku kuat raan pi\u014b \u00eb k\u00ebn\u00eb adhil lueel
  aya, \u201cB\u00e4k!\u201d Na le raan n\u025b\u0308k rou ke b\u0254\u0308, kuat
  raan n\u025b\u0308k rou ab\u00ef dek p\u00efu p\u00ef\u00efr \u00eb path.\\nTh\u00f6k
  \u00eb w\u00ebl\\n18 \u0194\u025bn Joon, \u0263\u025bn al\u00ebk kuat raan pi\u014b
  \u00eb w\u025b\u0308t k\u00ebn\u00eb pu\u0254\u0308u \u00ebb\u00ebn, na le raan
  ju\u025bk k\u00ebde th\u00efn ka b\u00ef Nhialic tu\u0254\u0308c k\u00e4r\u025bc
  c\u00ef g\u0254\u0308t ath\u00f6r k\u00ebn\u00eb yic.\\n19 Ku na le raan ny\u025b\u025bi
  w\u025b\u0308t t\u00f6k kam w\u00ebl t\u0254\u0308 ath\u00f6r w\u00ebl c\u00ef nyu\u0254\u0308th
  \u0263\u025bn yic, ke Nhialic ab\u00ef yinyden b\u00ef t\u025b\u0308k ye m\u00efth
  tim \u00eb p\u00ef\u00efr yic, ku la gen yam, c\u00ef ke g\u0254\u0308t ath\u00f6r
  k\u00ebn\u00eb yic, nyaai t\u00ebn\u00eb ye.\\n20 Ku Jethu raan l\u00ebk k\u0254c
  k\u00e4kk\u00e4 \u00ebb\u00ebn aye lueel, \u201c\u0194\u025b\u0308\u025b\u0308-\u0263\u025b\u0308\u025b\u0308!
  \u0194\u025bn ab\u0254\u0308 \u00ebm\u00ebn!\u201d K\u00ebya, ee t\u025b\u0308de.
  B\u00e4\u00e4r B\u025b\u0308ny Jethu!\\n21 B\u00ef dh\u00eb\u00eb\u014b B\u025b\u0308ny
  Jethu r\u00eb\u00ebr kek k\u0254c \u00eb Nhialic. Yenakan.\"", "\"Y\u00e4cpou\\nY\u00e4cp\u00efu
  [cholera n\u00eb th\u00f6\u014b D\u00ef\u014bl\u00efth] ee tu\u00ebny kocli\u00e4p
  t\u00eb ci abu\u00f6t Maguat-Pou ye cak. Ee c\u00efnkor yen ayee d\u0254m. K\u00eft
  \u014bic ap\u025b\u0308i eyaa ciith pi\u00e9u ap\u025b\u0308i. R\u025b\u0308\u025b\u0308cde
  ap\u025b\u0308i, ciith ee yec\u00f6k r\u025b\u025bk abi raan thou kamkor rin \u00eb
  d\u00f6upiuguop.\\nY\u00e4cpou ee tuany de runth\u025b\u025br. W\u00eblcig\u0254t
  de y\u00e4cpou (n\u00eb th\u00f6\u014b Sanskrit) aaci y\u00f6k g\u00f6lcok runbu\u0254t
  yekek dhiec YKD (Yecu K\u00ebc Dhieth). W\u00eblth\u025b\u025bric eb\u00ebn, ano\u014b
  m\u025b\u014bbei ju\u00ebc ku akumpiny de y\u00e4cpou ci r\u00f6t loi.\\nAbu\u00f6t
  Ma\u014buat-Pou ano\u014b kuat (mecthok) ju\u00ebc. Ab\u00ebk ken aa ci\u00e9k tu\u00ebny
  riliic tene k\u00f6k. Rin\u00ebken, k\u0254c k\u00f6k ci li\u00e4\u00e4p y\u00e4cpou
  aa cin kiit \u00e9 tuany; k\u0254c k\u00f6k aa na\u014b kiit cie r\u00ebc ap\u025b\u0308i,
  ku k\u00f6k aa na\u014b kiit r\u00ebc ap\u025b\u0308i.\\nY\u00e4cpou a\u014bot ye
  liaap \u0263\u00f4n ju\u00ebc de pinynhom. Th\u00f6\u014bkou n\u00eb 2010 aye luel
  ula raan kam mali\u00f6n ka 3 agutci mali\u00f6n ka 5 aaye y\u00e4cpou d\u0254m
  ru\u00f6n thok eb\u00ebn, ku 58,000\u2013130,000 aathou ne tueny kene ruon eb\u00ebn.
  Yak\u00f6l\u00eb, y\u00e4cpou aye c\u0254l a\u0263u\u0254kthai. Kuyenaya, ag\u00e4k
  apei ne b\u025b\u025bi cilatue\u014b yiic, alo\u014bdietde ne m\u00efth yic.\\nCi\u00ebk
  de Y\u00e4cpou[cokic | cok t\u00ebn\u00eby\u00f6kic]\\nK\u0254c aa y\u00e4cpou y\u00f6k
  ne dhel c\u00e4\u00e4m de c\u00e4m aye d\u00ebk de piu no\u014b acu\u0254l. K\u0254c
  n\u00ebk y\u00e4cpou aa ciith ap\u025bi, ku abu\u00f6t de y\u00e4cpou ee r\u00ebr
  p\u00efr ne w\u00ebric. Ne b\u00eb\u00ebi latue\u014b yic, arakthok, acin liucuol
  path. Y\u00e4cpou ee thiai t\u00e4lee c\u00efth li\u00e4p kek piu ye k\u0254c k\u00f3k
  gem.\\nCim\u00ebn\u00eb, t\u00e4le acu\u0254l (w\u00eb\u00ebr raan) la \u0263et
  w\u00e4r ye k\u0254c ju\u00ebc gem thin, k\u0254c aaye y\u00e4cpou d\u0254m t\u00e4le
  kek:\\n- Dek piu ne w\u00e4r k\u00ebn\u00eb yic\\n- Cam mi\u00ebth cik lok kou w\u00e4ric\\n-
  Cam r\u00ebc ci\u00eb\u014b w\u00e4r k\u00ebn\u00eb yic, t\u00e4 k\u00ebc yen \u014bi\u025bc
  thaal ar\u00ebk bi abu\u00f6t y\u00e4cpou n\u0254k.\\nK\u00ebn\u00eb ee yen ci\u00ebk
  ne y\u00e4cpou g\u00e4\u00e4k ap\u025bi t\u00ebn\u00eb b\u00eb\u00ebi cilatue\u014b.
  K\u0254c cam miithwiir cim\u00ebn\u00eb ju\u00e4l bii bei pi\u025b\u0308u no\u014bic
  abu\u00f6t y\u00e4cpou ku go tu\u0254\u0254c dukan b\u00ebi cilatue\u014b.\""]'
