  good luck\\nPosted by politically incorrect | May 16, 2013, 6:03 pm\"", "\"AGLUKAT
  ita nga aldaw ti School Year 2018 \u2013 2019. Sisasagana kadin dagiti eskuela-publiko,
  mangisursuro, estudiante ken nagannak iti panangrugi ti klase?\\nInrakurak ni Education
  Secretary Leonor Briones a nakasaganan dagiti school buildings ken dadduma a pasilidad
  iti panaglukat ti klase iti Kindergarten \u2013 Grade 12 iti pagilian kalpasan ti
  pannakaisayangkat ti Brigada Eskwela iti napalabas a lawas.\\nKabayatan ti innem
  nga aldaw a Brigada Eskwela, naipakita manen ti panagtitimpuyog dagiti agpapaay
  iti DepEd, nagannak ken dagiti adda iti komunidad. Panagkaykaysa ken panagtitinnulong
  iti pannakasimpa ken pannakadalus dagiti pasdek ken siled pagadalan, ken panagtitinnulong
  kadagiti magastos a kasapulan iti panangisagana kadagiti eskuela tapno nagin-awanton
  dagiti estudiante no sumrekda kadagiti eskuelaan.\\nNagkas-ang laeng ta dagiti nagannak
  dagiti estudiante nga adu kadakuada dagiti narigat ti panagbiagna ti agkokontribusion
  tapno laeng makagatangda kadagiti kasapulan a mangpapintas kadagiti siled ken pasdek
  pagadalan a sakup ti DepEd kabayatan a nagadu nga ahensia ti gobierno dagiti saanda
  nga ammo ti pangipapaayanda dagiti pondoda. Adda dagiti nagannak nga agbibingay
  iti igatangda iti pinta tapno mapinturaan dagiti nangirngir a pasdek. Adda dagiti
  kameng ti Parents, Teachers and Community Association dagiti pang-publiko a pagadalan
  nga agkokontribusion tapno makagatangda iti lansa, semento, kayo ken galba tapno
  masimpa dagiti pagadalan, kabayatan a nagadu dagiti proyekto dagiti ahensia ti gobierno
  nga awan mamaayna, kas kadagiti white elephant projects, ken dagiti nabiit pay a
  nabangon nga imprastraktura a saan pay a naabrot ngem sigud a masukatanda.\\nMairaman
  ti pannakapadur-as ti edukasion a prioridad ti administrasion ni Presidente Rodrigo
  Duterte nga ik-ikkan dakkel a a pondo tapno mapadur-as ti kalidad ti adal iti Pilipinas.
  Dayta pay ti gapu a naadaptar ti Kindergarten to Grade 12 Program tapno makapada
  ti Pilipinas iti international standard ti kalidad ti edukasion. Dakkel a pondo
  ti mayal-alokar iti DepEd a maus-usar para iti sueldo dagiti mangisursuro, pannakabangon
  ken pannakamantiner dagiti pasdek ken pasilidad, ken pannakagatang ken pannakasaluad
  dagiti alikamen ken kasapulan iti pagadalan. Ngem apay a maipabaklay pay laeng kadagiti
  nagannak ken mangisursuro dagiti dadduma a paggastosan dagiti pagadalan kas ti sueldo
  dagiti para dalus wenno utility worker, pagbayad ti koriente, ken igatang kadagiti
  gripo, bentilador ken dadduma pay nga alikamen.\\nMapaliiw nga adu latta dagiti
  pangpubliko nga eskuela iti nagduduma a paset ti pagilian dagiti agsagsagaba iti
  problema iti kinadaan dagiti pasdek, kinakirang dagiti pasilidad, tugaw, ken dadduma
  pay a kasapulan iti eskuela. Adu pay laeng a public schools kadagiti nauneg a barangay
  dagiti agkurang ti mangisursuro ken awanan kadagiti natalged nga school buildings.\\nAdu
  dagiti eskuela kadagiti nasulinek a lugar ti agkurkurang dagiti siled-pagadalan
  ken kinaawan ti koriente tapno dagiti mangisursuro ket makaaramatda kadagiti moderno
  nga audio-visual aid, ken dagiti estudiante ket mapadasanda ti kabaruanan a teknolohia,
  ti panagaramat ti computer ken nagduduma a gadget tapno maadalanda iti kabaruanan
  a siensia ken teknolohia.\\nIta a panaglukat ti klase ita a tawen, masubok manen
  ti anus ken dedikasion dagiti mangisursuro kas maikadua a nagannak dagiti adalanda
  tapno matubayda nga agbalin a namnama ken pagsanggiran iti masakbayan. Narigat a
  propesion ti panangisuro kadagiti ubbing ken agtutubo ta kasapulan daytoy ti adu
  nga anus iti panangiwanwan kadagiti dagmel ken nasukir nga adalan nangruna kadagiti
  agpapaay kadagiti public schools. Nagasgasat ketdi dagiti mangisursuro kadagiti
  pangpubliko a pagadalan ngem dagiti mangisursuro kadagiti pribado nga eskuela ta
  nangatngato nga amang ti sueldoda. Ngem saan laeng a nangato a sueldo ti pagubbogan
  ti ragsak dagiti mangisursuro; kangrunaanna no makitada nga agballigi wenno agbalin
  a nasayaat dagiti adalanda.\\nIti iseserrek wenno panagsubli dagiti estudiante kadagiti
  pagadalan ket dakkel nga akem ken karit kadakuada ta narigat ti agadal. Kasapulan
  daytoy iti anus, sakripisio ken disiplina. Nasken ti panagadalda tapno maisagana
  ti naraniag a masakbayanda, ken ti masakbayan ti pamiliada ken ti pagilian. Nagasat
  dagiti ubbing ken agtutubo nga adda gundawayda nga agbasa ta adu dagiti kapatadanda
  dagiti saan a makastrek iti pagadalan uray napalaus ti tarigagayda ngem saanda a
  makapagbasa gapu iti nakaro a rigat ken dadduma pay a tubeng iti panagadalda.\\nNaindaklan
  a sakripisio dagiti nagannak ti panangisakadda kadagiti annakda tapno masagutanda
  iti nasaysayaat a masakbayan nangruna itan ta rumigrigat ti panagbiag. Awan samiren
  dagiti nagannak a rigat tapno maipaayanda iti adal dagiti annakda ta dayta ti kapatgan
  a maipatawidda a saanto a pulos a mapukaw iti tungpal biagda.\\nIti pannakagun-od
  ti edukasion, nasken ti panagtitimpuyog ti gobierno ken dagiti amin a maseknan iti
