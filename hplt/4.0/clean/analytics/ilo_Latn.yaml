  Asset Privatization Trust \u2013 dagiti mekanismoti burukrasya tapno ipatungpal
  ti pribatisasyon.Idi 1991 ket impasa a linteg ni Cory ti LocalGovernment Code ken
  ti patakaran a devolutiona nangipasa kadagiti LGU ti responsibilidad kenmagastos
  para kadagiti pangpubliko a pasilidad apangsalun-at manipud tukad probinsya agpababa.Idi
  panawen ni Ramos a naitakder ti Philhealthken naibuelo ti panangilako iti dadduma
