  (Fax)\\nOras ti Opisina\\nLunes agingga iti Biernes\\n7:30 a.m. agingga iti 12:00
  p.m. ken 1:30 p.m. agingga iti 5:00 p.m.\"", "\"Kenya\\nTi Kenya (// wenno //),
  opisial a ti Republika ti Kenya, ket maysa a pagilian idiay Daya nga Aprika a naisanglad
  idiay ekuador. Adda ti Taaw Indiano iti abagatan a daya, daytoy ket nabeddengan
  babaen ti Tanzania iti abagatan, ti Uganda iti laud, ti Abagatan a Sudan iti amianan
  a laud, ti Etiopia iti amianan ken ti Somalia iti amianan adaya. Ti Kenia ket adda
  ti kalawa ti daga iti 580,000 km2 ken ti populasion ti sumurok a 43 a riwriw nga
  agtataeng. Ti pagilian ket nainaganan manipud ti Bantay Kenya, ti maysa a nasingsangayan
  a dulon ken maikadua kadagiti kangatuan a tuktok ti bantay idiay Aprika. Ti kapitolio
  ken kadakkelan a siudadna ket ti Nairobi.\\nTi Kenya ket adda ti napudot ken nadam-eg
  a klima iti igid ti aplayana ken ti Taaw Indiano, nga agbalbaliw ti nabaknang kadagiti
  kaatapan a karuotan a sabana nga agpauneg ti kadagaan a mapan idiay kapitolio. Ti
  Nairobi ket adda ti nalamiis a klima a lumamlamiis pay no umas-asideg idiay Bantay
  Kenya, nga adda dagiti tallo nga agtultuloy a gora ti niebe a tuktok. Ti napudot
  ken nadameg atropikal a klima ket gaparang manen iti kaunegan amapan idiay danaw
  Victoria, sakbay a mapan iti kalalainganna a kabakiran ken katurturodan a luglugar
  idiay lumaud a rehion. Dagiti rehion ti Amianan a Daya idiay igid ti pagbeddengan
  ti Somalia ken Etiopia ket namaga ken namaga bassit a luglugar nga adda kasla desierto
  a langa ti daga. Ti Danaw Victoria, ti maikadua a kadakkelan a nasadiwa a danum
  a danaw iti lubong (kalpasan ti Danaw Superior idiay Estados Unidos ken Kanada)
  ken ti kadakkelan a tropikal a danaw iti lubong, ket mabirukan idiay abagatan a
  laud ken nakibinningayan ti Uganda ken Tanzania. Ti Kenia ket naindayegan para kadagiti
  safari ken dagiti reserba ti nadumaduma a kita ti kaatapan a kas ti Daya ken Laud
  a Nailian a Parke ti Tsavo, ti Maasai Mara, Nailian a Parke ti Nakuru, ken ti Nailian
  a Parke ti Aberdares.\\nTi rehion ti Nalatak a Dandanaw ti Aprika, a daytoy ket
  nakaikamengan ti Kenia, ket nakakitan kadagiti panagtaeng ti tao manipud idi paset
  ti panawen ti Akinbaba a Paleolitiko. Ti Bantu a panagpadakkel ket nakaabut ti lugar
  manipud idiay Laud-Tengnga nga Aprika babaen ti umuna a milenia AD, ken dagiti pagbeddengan
  ti moderno nga estado ket buklenna dagiti pagsasabtan ti Niger-Kongo, Nilo-Sahara
  ken Apro-Asiatiko nga etno-linguistiko a luglugar ti kontinentet, a mangaramid ti
  Kenia ti maysa nga adu ti kulturana a pagilian. Ti kaadda dagiti Europeano ken Arabo
  idiay Mombasa ket napetsaan manipud idi Nasapa a Moderno a paset ti panawen, ngem
  ti Europeano a panagsuksukisok iti kaunegan ket nangrugi laeng idi maika-19 a siglo.
  Ti Britaniko nga Imperio ket nangipatakder ti Protektorado ti Daya nga Aprika idi
  1895, a naamammoan manipud idi 1920 a kas tiKenia Kolonia. Ti nawaya a Republika
  ti Keniaa ket nabangon idi Disiembre 1963. Kalpasan ti maysa a reperendum idi Agosto
  2010 ken ti panakaampon ti maysa a baro a batay-linteg a nangsukat ti daan a tinawidan
  idi napawaya manipud ti Britaniko, ti Kenia tattan ket nabingbingay kadagitib 47
  a kondado a nawaya manipud ti Nailian a gobierno ken agikedkedengda kadagiti pannakibiang
  a naibatay ti konsultasion ken panagtitinnulong. Dagiti kondado ket tinurayan babaen
  ti panagbutos kadagiti gobernador ken nawaya nga agtigtignay manipud ti sentro a
  gobierno idiay Nairobi.\\nTi kapitolio, a Nairobi, ket isu ti rehional a sentro
  ti komersio. Ti ekonomia ti Kenya ket isu ti kadakkelan babaen ti GDP idiay Daya
  ken Tengnga nga Aprika.[5][6] Ti agrikultura ket isu ti nangruna a agpatpatrabaho
  ken ti pagilian ket tinawtawid nga agiluluas ti tsia ken kape, ken ti pay kinaudi
  dagiti nasadiwa a sabong idiay Europa. Ti serbisio nga industria ket maysa a nagruna
  a mangpatpatarya ti ekonomia. Ti Kenia ket maysa a kameng ti Komunidad ti Daya nga
  Aprika.\\nDagiti nagibasaran[urnosen | urnosen ti taudan]\\n- ^ Batay-linteg (2009)
  Art. 7 [Nailian, opisial ken dadduma pay a pagsasao] \\\"(1) Ti nailian apagsasao
  ti Republika ket Kiswahili. (2) Dagiti opisial a pagsasao ti Republika ket ti Kiswahili
  ken Inggles. (3) Ti Estado ket Nasken a\u2013-\u2013- (a) mangipatakder ken agsalaknib
  ti dibersidad ti pagsasao ti tattao ti Kenya; ken (b) mangipatakder ti panagrang-ay
  ti panag-usar kadagiti patneng a pagsasao, ti Senial apagsasao ti Kenia, Braille
  ken dagiti daddum apay a porma ti pannakisao ken dagiti teknolohia a maserrekan
  ti tattao nga adda dagiti disabilidad.\\\"\\n- ^ Kenya 2009 a Populasion ket pagtaengan
  a senso. knbs.or.ke\\n- ^ a b c d \\\"Kenya\\\". Internasional a Pundo ti Panguartaan.
  Naala idi 19 Abril 2012.\\n- ^ \\\"Reporta ti Panagrangrang-ay ti Nagtagitaoan 2011\\\".
  Nagkaykaysa a Pagpagilian. 2011. Naala idi 2 Nobiembre 2011.\\n- ^ Ti Etiopia a
  GDP a bileg ti panagggatang idi 2010: 86 bilion. Imf.org (2006-09-14). Naala idi
  9 Abril 2012.\\n- ^ Ti Kenya a GDP a bileg ti panaggatang idi 2010: 66 Bilion. Imf.org
  (2006-09-14). Naala idi 9 Abril 2012.\\nDagiti silpo ti ruar[urnosen | urnosen ti
  taudan]\\nDagiti midia a mainaig ti Kenya idiay Wikimedia Commons\\n- Gobierno\\n-
  Panakangiwat ti Gobierno Opisina ti Pannakangiwat ti Republika ti Kenya.\\n- Gobierno
  ti Kenia Opisial a sitio.\"", "\"1No maipapan iti yaay ni Apotayo a Jesu-Cristo
  ken iti pannakaurnongtayo tapno addatayto iti sidongna, kakabsat, dawatenmi kadakayo
  2a dikay koma mariribukan wenno madanagan iti maibagbaga a dimtengen ti Aldaw ti
  Apo. Kunkunada a kasta ti naibagami bayat ti panangaskasabami wenno panagsuratmi.
  3Dikay paallilaw iti siasino man iti uray ania a wagas. Ta dinto dumteng dayta nga
  Aldaw no di mapasamak ti Yaalsa a maibusor iti Dios ken panagparang ti Managdakdakes
  a naituding a mapan idiay infierno. 4Kontraennanto amin a pagrukbaban dagiti tattao
  ken amin a bambanag nga ibilangda a nadiosan. Isaadnanto ti bagina iti ngatoenda
  amin ket sumrekto pay nga agtugaw iti Templo ti Dios, sananto ibaga nga isu ti Dios.
  5Imbagakon amin dagitoy idi addaak iti dennayo. Diyo kadi malagip? 6Ngem adda mangigawgawid
  iti pannakapasamakna, ket ammoyo no ania dayta. Ngarud, iti naituding a tiempo,
  agparangto ti Managdakdakes. 7Madaman nga agtartrabaho ti Palimed ti Kinadakes,
  ngem santo la agsardeng inton maikkat ti manglaplapped. 8Kalpasanna, agparangto
  ti Managdakdakes, ngem inton umay ti Apo Jesus papatayennanto babaen iti pug-awna
  ken dadaelennanto babaen iti makapurar a raniag ti panagparangna. 9Umayto ti Managdakdakes
  nga addaan iti pannakabalin ni Satanas. Agaramidto kadagiti amin a kita ti milagro
  ken kadagiti makaallilaw a pagilasinan ken datdatlag. 10Aramatennanto ti amin a
  kita ti dakes a pangallilaw kadagiti mapukaw. Mapukawdanto ta dida inawat ken impatpateg
  ti kinapudno a makaisalakan koma kadakuada. 11Daytoy ti gapuna a ti Dios ibaonna
  ti pannakabalin ti biddut nga agtrabaho kadakuada tapno patienda ti ulbod. 12Agbanagto
  a maukom dagiti amin a di namati iti kinapudno, ta ad-adda nga inayatda ti basol.
  13Masapul a kanayon nga agyamankam iti Dios gapu kadakayo, kakabsat, dakayo nga
  ay-ayaten ti Apo. Ta dakayo ti pinili ti Dios kas umuna a maisalakan babaen iti
  bileg ti Espiritu a mangpasanto kadakayo ken babaen iti pammatiyo iti kinapudno.
  14Inayabannakayo ti Dios iti daytoy a kasasaad babaen iti Naimbag a Damag nga inkasabami
  kadakayo. Wen, inayabannakayo a makipagtagikua iti dayag ni Apotayo a Jesu-Cristo.
  15Isut\u2019 gapuna, kakabsat, nga agtalinaedkayo a natibker ket salimetmetanyo
  dagiti kinapudno nga insuromi kadakayo babaen iti panangaskasabami ken iti suratmi.
  16Sapay koma ta ni Apotayo a Jesu-Cristo a mismo ken ti Dios nga Amatayo, a nagayat
  ken mangted kadatayo iti agnanayon a tured ken nasayaat a namnama babaen iti paraburna,
  17patureden ken papigsaennakayo a kanayon nga agaramid ken agsao iti naimbag.\"",
  "\"Idi ubing pay ti buridekmi a babai, ni Berkeley, nangrugiak nga agusar iti reading
  glasses\u2015ti kita nga ag-zoom in ken ag-magnify iti amin a banag. Maysa nga aldaw,
  bayat ti panagtugawmi nga aggigiddan nga agbasa iti libro, kinitak nga addaan ayat
  ngem addaan met liday gapu ta kasla alisto unay a dimmakkel. Napanunotko, \u201cSadino
  ti napanan ti panawen? Dimmakkelen!\u201d\\nIdi intag-ayko ti reading glasses-ko
  tapno punasak ti lua, naamirisko, \u201cAgurayka\u2014saan a dakdakkel; dagitoy
  laeng anteohos! Bay-anen!.\u201d\\nNo dadduma makitatayo laeng dayta asideg, napadakkel
  a view dagiti ay-ayatentayo. Ita, awisenkayo nga ag-zoom out ken kumita iti sabali
  a lens\u2014ti agnanayon a lens a mangipokus iti dakkel a ladawan, dakkel nga estoriayo.\\nIdi
  damo nga ipapan ti tao iti law-ang, awan ti tawa dagiti di nataming a rocket. Ngem
  babaen ti mision ti Apollo 8 nga agturong iti bulan, addan dagiti astronaut. Bayat
  panagtayab iti law-ang, nasdaawda iti bileg a makakita iti dagatayo ket innalada
  daytoy nakaskasdaaw a ladawan, a nangawis iti atension ti intero a lubong. Napadasan
  dagita nga astronaut ti rikna a nabileg unay isu a naikkan iti bukodna a nagan:
  ti Overview Effect.\\nTi panangbuya manipud iti baro a vantage point balbaliwanna
  ti amin. Kinuna ti maysa a biahero iti law-ang iti daytoy \u201cpabassitenna dagiti
  bambanag iti kadakkel a pagarupenyo a makontrol ti amin. \u2026 Maaramidtayo daytoy.
  Kappia iti daga\u2014awan problema. Mangted daytoy iti tattao iti dayta a kita ti
  enerhia \u2026 dayta a kita ti bileg.\u201d1\\nKas tattao, addaantayo iti naindagaan
  a pannirigan, ngem makita ti Dios ti dakkel a pakabuklan ti uniberso. Makitana ti
  amin a parsua, amintayo, ken napnuan namnama.\\nPosible kadi a rugian ti kumita
  a kas panagkita ti Dios bayat ti biag iti rabaw daytoy a planeta\u2014a riknaen
  daytoy nakaskasdaaw ? Patiek a mabalintayo, babaen ti mata ti pammati, nga i-zoom
  out ken kitaentayo ti bagitayo ken pamiliatayo nga addaan namnama ken rag-o.\\nUmanamong
  dagiti nasantuan a kasuratan. Kuna ni Moroni kadagiti adda pammatida a \u201cnalabes
  ti kapigsana\u201d a \u201cpudno a nakitada \u2026 nga addaan mata ti pammati, ket
  naragsakda.\u201d2\\nAddaan mata a naipokus iti Mangisalakan, nariknada ti rag-o
  ken ammoda daytoy kinapudno: Gapu ken ni Cristo, agballigi amin. Amin a pakadanaganyo
  dakayo ken dakayo ken dakayo agbalinto a nasayaat ti amin! Ket dagiti kumita nga
  addaan mata ti pammati mariknada nga agsayaat itan.\\nNapadasak ti rigat ti senior
  year-ko idi haiskul idi diak agar-aramid iti nasayaat a pili. Malagipko a nakitak
  ni nanangko nga agsangsangit, ken pampanunotek no naupayko. Iti dayta a kanito,
  madanaganak amangan ta napukawnan ti namnamana kaniak, ket dinan marikna ti namnama
  a makapagsubliak.\\nNgem ad-adda a nasanay ni tatangko nga ag-zoom out ken mangala
  iti atiddog a view. Naadalna iti padasna a ti panagdanag ket marikna unay a kasla
  ayat, ngem saan nga agpada.3 Inusarna ti mata ti pammati tapno makitana nga agballigi
  ti amin, ket ti manamnama a wagasna ti nangbalbaliw kaniak.\\nIdi nagturposak iti
  haiskul ken napanak iti BYU, sinuratannak ni tatangko, mangipalpalagip kaniak no
  asinoak. Isu ti cheerleader-ko, ken kasapulan ti amin ti cheerleader\u2014smaysa
  a tao a di mangibagbaga kenka, \u201cDika agtaray iti napardas\u201d; siaayat nga
  ipalagipda kenka a kabaelam.\\nImpagwadan ni tatang ti tagainep ni Lehi. Kas ken
  ni Lehi, ammona a dikayo kumamat kadagiti patpatgenyo a makarikna a napukawda. \u201cAgtalinaedkayo
  iti yanyo ket awaganyo ida. Inkayo iti kayo, agtalinaed iti kayo, itultuloyyo a
  kanen ti bunga ket, siisemkayo, itultuloy nga ayaban dagiti ay-ayatenyo ken ipakitayo
  babaen ti pagwadan a ti pannangan iti bunga ket naragsak a banag!\u201d4\\nDaytoy
  bisual a ladawan ti nakatulong kaniak kadagiti naliday a kanitok idi addaak iti
  kayo, a mangmangan iti bunga ken agsangsangit gapu ta madanaganak; ken pudno, anian
  a nakatulong dayta? Ketdi, pilientayo ti namnama\u2014namnama iti Namarsua ken iti
  tunggal maysa, a mangpabileg iti kabaelantayo ti agbalin a nasaysayaat ngem ita.\\nNabiit
  kalpasan ti ipupusay ni Elder Neal A. Maxwell, dinamag ti reporter iti barona no
  ania ti kailiwna unay. Kinunana a kailiwna dagiti pangrabii iti balay dagiti dadakkelna
  gapu ta kanayon a namati kenkuana ni tatangna.\\nDaytoy met ti panawen a yaay iti
  balay dagiti nataengan nga annakmi iti pangrabii iti Domingo a kakuyog dagiti assawada.
  Bayat ti lawas, inlistak iti panunotko dagiti banag a maipalagipko kadakuada iti
  Domingo, kas iti \u201cMabalinyo ti agtinnulong a mangaywan kadagiti ubbing no addakayo
  iti pagtaengan\u201d wenno \u201cDiyo liplipatan ti dumngeg a nasayaat.\u201d\\nIdi
  nangngegak ti komento ni Brother Maxwell, diakon inaramid ti napanunotko, isu a
  no makitak dagiti annakko iti dayta ababa laeng nga oras iti linawas, naipamaysak
  ti pasnekko iti adu a positibo a banag a siguden nga ar-aramidenda. Idi pimmusay
  ti inauna nga anakmi, ni Ryan, kalpasan ti sumagmamano a tawen, malagipko a siyayaman
  a naragragsak ti panawen a panagtitiponmi.\\nSakbay a makilangentayo iti maysa nga
  ipatpateg, maisaludsodtayo iti bagitayo ti \u201cMakatulong kadi wenno makasair
  ti aramidek wenno ibagak?\u201d Dagiti saotayo adda dakkel nga epektona iti tao,
  ket dagiti miembro ti pamilia kasla pisarra a tao, a nakatakder iti sangotayo a
  kunkunada, \u201cIsuratyo ti makunayo kaniak!\u201d Dagitoy a mensahe, naigagara
  man wenno saan, mangipanamnama ken mangparegtada koma.5\\nTi trabahotayo saan koma
  a mangisuro iti tao a lumasat iti narusanger a paset a dakes wenno makapaupay. Iti
  manmano a gundaway matignaytayo a mangatur, ngem kanayon koma nga ibagatayo kadagiti
  ipatpategtayo dagiti mensahe nga il-iliwenda a mangngegan; \u201cMarikna ti pamiliatayo
  a naan-anay ken kumpletoda gapu ta addakayo ditoy.\u201d \u201cMaipatpategka iti
  unos ti biagmo\u2014ania man ti mapasamak.\u201d\\nNo dadduma, kasapulantayo ti
  pannakipagrikna ngem ti balakad; idedengngeg ngem iti lektura; maysa a dumngeg ken
  masdaaw, \u201cAnia koma ti mariknak a sawen iti kaisasaoda laeng?\u201d\\nLaglagipen,
  inikkannatayo ti Dios ti pamilia a pagpanunotantayo iti bambanag, isu a di laeng
  posible dagiti biddut nga addang ken di husto a panagkuentatayo, ngem nalabit. Ket
  di kadi makaay-ayo no, iti gibus ti biagtayo, makitatayo a dagita a relasion, uray
  dagiti mapannubok a kanito, ket mismo a nakatulong kadatayo nga agbalin nga ad-adda
  a kas iti Mangisalakantayo? Tunggal narigat nga interaksion ket gundaway a mangadal
  no kasano ti agayat iti naun-uneg a lebel\u2014lebel ti Dios.6\\nAg-zoom out-tayo
  a mangkita iti relasion ti pamilia kas nabileg a gundaway a pangisuruan kadatayo
  iti leksion nga immayantayo ditoy no umaytayo iti Mangisalakan.\\nAkuentayo, iti
  natnag a lubong, awan ti wagas tapno agbalin a perpekto nga asawa, nagannak, anak,
  apoko, mannursuro, wenno gayyem\u2014ngem minilion a wagas ti panagbalin a nasingpet.7
  Agtalinaedtayo iti kayo, makiranudtayo iti ayat ti Dios, ken ibinglay daytoy. Babaen
  ti panangitag-ay iti tattao iti lawlawtayo, aggigiddantayo a ngumato.\\nDaksanggasat,
  ta di umdas ti lagip ti pannangan iti bunga; agtultuloytayo koma a makiranud iti
  wagas a mangipuesto manen iti lenstayo ken mangikonekta kadatayo iti nailangitan
  nga overview babaen ti panagbasa iti nasantuan a kasuratan, a napno iti lawag, a
  mangpapanaw ti sipnget; agtultuloytayo iti kararagtayo. Ditoy a mapalukneng ti puspuso,
  ken mangrugi a makakitatayo kas iti Dios.\\nKadagitoy maudi nga aldaw, nalabit ti
  kadakkelan a trabahotayo ket kadagiti ay-ayatentayo\u2014nasingpet a tattao nga
  agnanaed iti dakes a lubong. Ti namnamatayo ti mangbaliw iti wagas a panangkitada
  iti bagida ken ti kinasiasinoda. Ken babaen daytoy a lens ti ayat makitada no asinonto
  ti pagbalinanda.\\nNgem di kayat ti kabusor nga agkukuyogtayo wenno dagiti ipatpategtayo
  nga agawid. Ket gapu ta agbibiagtayo iti planeta a naibegkes iti panawen ken bilang
  ti tawen,8 pagtalinaeden ti kabusor ti pudno unay a rikna ti buteng. Narigat a makita,
  no naka-zoom intayo, napatpateg ti direksiontayo ngem ti kapartaktayo.\\nLaglagipen,
  \u201cNo kayatyo ti agalisto, agmaymaysakayo. No kayatyo ti umadayo, aggigiddankayo.\u201d9
  Ti Dios a pagrukbabantayo saan a naibegkes iti panawen. Makitana no asino a talaga
  dagiti ipatpategtayo, no asinotayo a talaga.19 Isu a naanus Isuna kadatayo, a mangnamnama
  nga agiinnanustayo.\\nAwatek nga adda dagiti kanito a ti daga, ti temporal a taengtayo,
  kasla maysa nga isla ti ladingit\u2014kanito nga adda maysa a matak ti pammati ken
  maysa a matak ti aglulua.11 Ammoyo kadi daytoy a rikna?\\nKastoy ti riknak iti Martes.\\nMabalintayo
  kadi ketdi a pilien ti kababalin ti propetatayo no ikarina dagiti milagro iti pamiliatayo?
  No aramidentayo, dumakkel ti rag-otayo uray no kumaro ti riribuk. Ikarkarina a mabalin
  a mapadasan ti epekto ti overview itan, ania man dagiti kasasaadtayo.12\\nTi kaadda
  daytoy mata ti pammati itan ket maipada iti pammatitayo sakbay nga immaytayo ditoy
  a planeta. Makitana ti napalabas ti kinaawan sigurado ti maysa a kanito, a palugodannatayo
  nga \u201cagragsak nga aramiden ti amin dagiti naipakumit iti bilegtayo; kalpasanna
  agtakdertayo.\u201d13\\nAdda kadi narigat iti biagmo ita, maysa a banag a pakadanagam
  a saan a marisut? No awan ti mata ti pammati, mabalin a kasla napukawen ti Dios
  ti panangkita iti bambanag, ket pudno kadi dayta?\\nWenno nalabit a mabutengka unay
  a dumaliasat a maymaysa iti daytoy narigat a panawen, ngem kayatna a sawen a binaybay-annaka
  ti Dios, pudno kadi dayta?\\nPaneknekak a kabaelan ti Mangisalakan, gapu iti Pannubbotna,
  a pagbalinen a bendision ti ania man a pannubok a mapaspasaranyo. Inikkannatayo
  iti kari nga \u201caddaan iti katulagan a di mabaliwan\u201d a no ipasnektayo ti
  agayat ken sumurot Kenkuana, \u201camin a banag no [naparigatantayo] agtitinnulongdanto
  para iti pagimbagan[tayo].\u201d14 Amin a banag.\\nKet gapu ta annaknatayo ti katulagan,
  makiddawtayo daytoy a manamnama a rikna itan!\\nIdinto a ditayo perpekto a pamilia,
  maaramidtayo a perpekto ti ayattayo iti dadduma agingga nga agbalin a kanayon, di
  agbalbaliw, ania man a kita ti ayat\u2014ayat a mangsuporta iti panagbalbaliw ken
  mangpalugod iti panagdur-as ken panagsubli.\\nAramid ti Mangisalakan a pagsublien
  dagiti ipatpategtayo. Daytoy ti aramidna ken panawenna . Daytoy ti aramidtayo a
  mangipaay iti namnama ken puso a pagawidanda. \u201cAwanantayo iti turay [ti Dios]
  a mangkondena wenno ti bilegna a mangsubbot, ngem nadutokantayo a mangaramat iti
  ayatna.\u201d15 Insuro pay ni Presidente Nelson nga ad-adda a kasapulan ti dadduma
  ti ayattayo ngem ti panaghusgatayo. \u201cNasken a padasenda ti natarnaw nga ayat
  ni Jesucristo a maipakita iti balikas ken aramid[tayo].\u201d16\\nTi ayat ti banag
  a mangbalbaliw iti puspuso. Daytoy ti katarnawan a motibo ti amin, ken marikna ti
  dadduma. Kumpettayo kadagitoy sao ti propeta a naidiaya 50 a tawen ti naglabas:
  \u201cAwan pagtaengan a mapaay malaksid no di agkagumaan.\u201d17 Awan duadua, dagiti
  agayat unay ken kapautan ti mangabak!\\nKadagiti pamilia iti daga, ar-aramidentayo
  ti inaramid ti Dios kadatayo\u2014a mangitudtudo iti dalan ken mangnamnama a mapan
  dagiti ay-ayatentayo iti dayta a direksion, nga ammo a pilida ti dalan a pagdaliasatanda.\\nKet
  no lumasatda iti sabali a bangir ti belo ket umasidegda iti ayat a mamagtarigagay
  iti nailangitan a taengda,18 patiek a pamiliar ti rikna gapu ta naayatda ditoy.\\nUsarentayo
  koma dayta overview lens ket kitaen dagiti tao nga ay-ayaten ken kadennatayo kas
  agkakadua iti daytoy napintas a planetatayo.\\nDakayo ken siak? Maaramidtayo daytoy!
  Makakapet ken makanamnamatayo! Makapagtalinaedtayo iti kayo, makiranud iti bunga
  a siiisemtayo, ken ti Silaw ni Cristo iti matatayo agbalin koma a banag a pangnamnamaanda
  iti kasipngetan nga orasda. Ket no makitada ti lawag a maiparangarang iti rupatayo,
  maallukoydanto. Makatulongtayo ngarud a mangipokus manen iti atensionda iti sigud
  a paggapuan ti ayat ken lawag, \u201cti naraniag ken bituen ti agsapa,\u201d ni
  Jesucristo.19\\nPaneknekak a daytoy\u2014amin daytoy\u2014ket agbalinto a nasaysayaat
  nga amang ngem iti mapanunottayo! Buyogen ti mata ti pammati ken ni Jesucristo,
  makitatayo koma a nasayaatto ti amin iti kamaudiananna ken mariknatayo a nasayaatto
  itan. Iti nagan ni Jesucristo, amen.\"", "\"Surat iti akin-aramid: Manipod mangiturturay
  a partido agingga\u2019t partido nga naipaigid, dakami nga adda\u2019t Partido Liberal
  ket madama nga agararamid ti nauneg a pannakaisao kadagiti myembro mi ken dadduma
  nga maseknan tapno agkakaysa kami nga makabukel iti estratehiko nga pagturungan.
  Dagitoy dagiti umuna nga kapanunutak kas panagturongtayo iti importante nga ehersisyo
  nga kas panangamiris ken agturong iti masakbayan nga aksyon.\\nIti intero nga lubong,
  iti kultura ti demokrasya \u2013 anus, debate, ken awanan-armas nga kinapudno \u2013
  ket kumapkapsot ken dagiti tendensiya a naranggas nga panagturay ket agpangpangato.
  Ditoy Pilipinas, daytoy nga kasasaad ket maysa a paset iti kolektibo nga pannakaabak
  dagiti lider iti gimong (iti politika, kadagiti relihiyoso, iti negosyo, ken dadduma
  nga grupo sibiko) tapno mangruk-at iti pagilyan manipod kadagiti panagiggem ti nakaro
  nga dinastiya a politikal ken pang-ekonomiya, ken tapno baliwan iti nakusel nga
  demokrasya tayo nga mapan iti maysa nga mangtungpal ti madi pay a napasamak nga
  promesa ti 1986 nga EDSA People Power Revolt.\\nNo man pay nakaungar ti ekonomya
  manipod iti nasayud nga panagtakaw ni Marcos iti pagbagasan ti pagilyan, agnanayon
  pay dagiti kangrunaan nga parikot ti kinakurapay, kinaawan ti panagpapada, ken pannangiparit
  (exclusion). Iti tengnga ti nagado nga kinaawan ti trabaho, mapwersa dagiti trabahador
  nga agubra kadagiti narurugit, napeggad, narigat, ken kaadwan ket saan nga permanente
  nga trabaho (kaadwan idiay ballasiw-taaw) urayno malappedan dagiti karbengan da
  iti panagtrabaho nga kas agorganisa, iti seguridad ti panagpatingga\u2019t trabaho,
  ken iti disente nga trabaho. Ti programa nga reporma iti agraryo ket dakkel nga
  pannakaupay, kadagiti mabisbisinan nga mannalon, kadagiti nakurapay, ken dagiti
  awanan ti daga/wenno pagsapulan nga adda\u2019t naimbag a pasweldo. Nariwriw iti
  agnaed kadagiti nagdudugyot a kondisyon nga nganngani awan dagiti kangrunaan a kasapulan
  tapno mabiag nga adda\u2019t dayaw da. Ado dagiti agbalin nga agpipidot ti basura
  ken aglako ti maiparit nga droga tapno laeng mabiagda. Agnanayon nga pabor dagiti
  paglintegan maipapan ti panagbuwis ken dadduma nga pang- ekonomiya (aglalo iti panagpatungpal)
  para kadagiti nagbabaknang launayen, ken saan nga parehas para kadagiti adda ti
  middle class ken adda pay iti nababbaba a tukad. Agtultuloy iti sistematiko nga
  panagtakaw nga mangirareb iti pannabangkrap ti pondo\u2019t pagilyan agraman ti
  moralidad. Saan nga nagballigi dagiti nagsasaruno nga gubyerno a mangted iti trabaho,
  makan, pagtaengan, panagtaripato ti salun-at, edukasyon, ken daduma nga serbisyo
  publiko para kadagiti ordinaryo nga Pilipino. Saan nga naipatungpal iti pagilyan
  nga Pilipinas iti panangiwaras ti kinabaknang ken makaited iti agpapada nga panaggun-od
  ti sweldo, oportunidad, ken serbisyo.\\nIti uneg ti panawen nga nalpas iti EDSA,
  ti Partido Liberal ket nagbalin a parte iti napaungar nga demokratiko nga paspasdec
  (institutions), nangnangruna nga awan panagsabalina maipapan ti ideolohiya kadagiti
  dadduma nga partido a politikal, kaadwan nga lider na ket naikkat manipod kadagiti
  peggad nga inaldaw a masangwanan dagiti ordinaryo nga tao.\\nKasta met, iti teknolohiya,
  iti globalisasyon, ken iti panagbaliw ti klima (climate change) ket napardas nga
  mangsuksukat iti lubong nga kas ammotayo. Dagiti robot ken artificial intelligence
  ket mangited iti baro nga sakop iti trabaho \u2013 ken iti klase ken pakailasenan
  (identity) nga nakasilpo ditoy. Iti kinakbaknang ngarud iti poder ket kumarkaro
  nga maummong kadagiti sumagmamano a tao, nga mangperdi iti nakapsot nga pannakareppet
  ti gimong ken panagtalna iti ekonomiya. Iti nalinis nga angin, iti nalinis nga danom,
  ken maarado nga daga \u2013 nga kangrunaan a kasapulan para iti pannakasalbar ti
  tattao \u2013 ket bumasbassit ken agbalbalin nga nangina a magatang. Iti kombinasyon
  dagitoy ket kangrunaan nga nangpabaliw iti langa ti politika iti intero nga lubong.
  Iti panagtipon dagiti nalaka nga telepono ken pannakagun-od ti social media ket
  nangpalubos kadagiti interesado nga grupo nga nangiruar kadagiti troll armies ken
  websites nga adda\u2019t palso nga damdamag na nga iso\u2019t nangbukel ti opinyon
  ngem saan nga pudno, kasta met iti nangimpluwensya kadagiti delikado nga tungtungan
  kas iti Brexit ken pananglibac ti climate-change ken kadagiti mapaspasamak kaskuma
  dagiti dadduma nga panagbotos ti pagilyan national elections.\\nIti populismo ken
  iti kabagyan na \u2013 iti panangikuspil ti dadduma a puli (racism), pasismo, ken
  panagsobra wenno extremism \u2013 ket gumapo ditoy nga makaburibor a baro nga lubong.
  Iti kinadesperadoda, dagiti tao ket mapan iti daan, pamilyar, ken nakarkaro nga
  kinaulpit nga kagagalad iti panagaturay ti politika, maallilaw da nga daytoy iti
  mangisalbar kanyada manipod iti nalidem nga masakbayan. Iti tulong ti social media,
  dagiti napadas-ti-panawen nga linteg ti propaganda ket mangpalibeg kadagiti linya
  nga aggudwa iti kinapudno ken kinaulbod. Iti maysa, daytoy a baro nga teknolohiya
  ket mangar aramid iti nakarkaro nga kinaawan pasensiya wenno saan ket publiko nga
  nakurangan ti panangamiris nga mangar-arakup kadagiti nakired a lider nga mangipaay
  kadagiti banbanag kasukat dagiti nadayaw, \u2018disente\u201d a makabael nga agannad.\\nMaisupiat
  ditoy nga langa, kasapulan iti Partido Liberal nga mabaliwan iti pakaipapananna.\\nIti
  Partido Liberal ket parte iti nalawa nga tignayan a socio-political nga nangsupyat
  iti diktadura a Marcos. Ngem iti kinatakneng na iti panangallilaw ken kinakuraddog
  ket agtultuloy. Tallo pulo nga tawen manipod idi tinalawan ni Marcos ti unget dagiti
  umili idi 1986, iti bangkay na ket naipunponen kaabay dagiti agpaypayso nga bannuar
  ti pagilyan, gapo iti baon ni Presidente Rodrigo Duterte. Iti Partido Liberal iti
  kauunaan nga nangibaga iti nadagop nga pungtot ti pagilyan iti kastoy nga insulto
  iti pakasaritaan dagiti pasamac (history) tayo.\\nNgem nakarkaro pay iti mabalin
  nga panagsubli\u2019t bileg dagiti Marcos iti partikular, wenno iti naulpit nga
  panagturay kadagiti sapasap, ti karit iti Partido ket gun-oden ti sibubukel nga
  hustisya nga maipapan ti gimong. Ti kayat nga sawen daytoy ket dagdagos nga isardeng
  ken ilinteg dagiti epekto ti politika nga suportado ti agturay (patronage politics)
  ken aglalo pay, iti naturay nga sistema a geopolitikal maipapan ti gimong ken pang-ekonomiya
  nga nangpaneknek nga awan ibibyangna daytoy kadagiti kasapulan dagiti tao ken iti
  masakbayan ti lubong.\\nKas Partido nga nagturay iti kalkalpas nga innem a tawen,
  iti kauunaan nga panawen ti asideg singkwenta a tawen nga nagserbi ti maysa a miyembro
  na kas Presidente ti Republika, nakabaelan iti panguluan ti Partido Liberal nga
  mangpabiag kadagiti bukel iti anti-diktadurya, maka-demokrasya (mangsupyat ti tulong
  ti agturay) nga naimula manipod kalpasan iti EDSA. Sinango na iti nakaro nga kinakurapay
  ken kinaawan gundaway nga makaala kadagiti serbisyo nga maipapan ti salun-at ken
  edukasyon babaen, maikadwa dagiti dadduma pay, ti panangpalawa ti programa nga Conditional
  Cash Transfer, ken iti panangipasa ti Reproductive Health Act ken iti linteg maipapan
  ti Sin Tax, dagiti buwis manipod kadagitoy ket agtultuloy nga mangpondo iti programa
  nga Universal Health Care. Iti napigsa nga napasdec na nga mangsupyat ti panagtakaw,
  buyot para iti panangsungbat ti responsibilidad, ken kampanya para iti mannakilaok
  nga demokrasya ket nangited iti awan pay nakaaramid nga panagngato ti badyet para
  kadagiti serbisyo maipapan ti gimong nga awan iti panangngato ti buwis manipod iti
  sweldo ken iti rebolusyonaryo ken manangwaya nga programa ti Bottom-up Budgeting.
  Naipakulongna met ti dagiti nalatac a mannanakaw, mairaman iti maysa nga dati a
  Presidente. Iti natured nga tarigagay na para iti capia mainaig iti Moro Islamic
  Liberation Front ket nakaurnong ti respeto ken pannakisali iti sangkalungoban a
  komunidad. Iti aramid na nga nalinis a panaggubyerno ket nangibalin iti Pilipinas
  nga paborito dagiti gangannaet nga negosyante ken turista. No man pay kasta, dagitoy
  nga balligi ket naganos pay laeng idi inpasa iti panguluan ti poder mapan iti baro
  a gubyerno. Agtultuloy a proseso ti demokrasya. Kasapulan ti panawen tapno tumubo
  dagitoy nga reporma para iti nasisita wenno natalna nga panagapit manipod iti panagdakkel
  ti ekonomiya ken talna ti politika tapno makaaramid ti nasustansya wenno saan nga
  makumes nga progreso para iti kinakurapay, kinaawan ti panagpapada, ken pannangiparit
  (exclusion) \u2013 iti uray anya nga administrasyon.\\nSaan nga maaramid dagitoy
  iti Partido Liberal laeng. Labes dagiti nagbeddengan (borders) ti pagilyan, kasapulan
  nga makikadwa daytoy iti sangkalubongan a demokrasya, iti climate defense, ken kapada
  nga tignayan dagiti aktibista nga mangsangsango kadagiti awan patenggana a problema
  iti tattao, agrugi iti pannakidangadang para iti kinapudno, ti pinakaimportante
  nga pundasyon ti hustisya ken kappia. Kasano ngarod nga makaabante ti panguluan
  ti Partido Liberal? Agpapan iti nalawag a dalan para ti masakbayan, iti Partido
  ken iti lideratona ket agkasapulan nga agsubli iti napalabas. Kasapulan nga mapantayo
  iti baba, makisao kadagiti babassit a sektor, ken agbalin nga pudpudno a partido
  ti tattao. Kasapulan tayo dagiti tao nga mangparegget kadagiti uubbing nga tao,
  mainayon dagiti maawagan nga millenials, nga agbalin a managtignay nga umili nga
  siaannugot nga makikadwa a mangtabas iti nasingsingpet nga masakbayan. Kasapulan
  nga maamwan ken maawatan tayo dagiti dakkel a pagtuokan dagiti tattao ken kinakurapay,
  ken suktan tayo dagitoy agturong iti kappia ken panagrang-ay. Kasapulan tayo nga
  ruk-atan dagiti tattao tapno rumang-ayda ken mapadakkel iti middle class. Kasapulan
  tayo nga usaren dagiti prinsipyo iti mannakitipon a demokrasya ken panagkaykaysa,
  karbengan dagiti tattao ken hustisya nga maipapan ti gimong, kinasirib nga mangsalaknib
  iti aglawlaw ken kabaelan nga masustena ti sanikua (sustainability), ken respeto
  iti panagsasabali (diversity). Ket ditoy nalpas-a-kinapudno tayo, napeligro, ken
  narikut nga kasasaad, agkaykaysa tayo nga labanan dagiti trolls, naulbod nga damdamag,
  ken kinaulbod iti naklaro ken napapati nga panagkita iti masakbayan, nga addaan
  awan-bannog ken nakired a determinasyon, ken addaan kinapudno na naipeksan iti sangaribo
  a kanito.\\nKasapulan nga gandaten iti Partido Liberal ti pangpanggep ken panangpapigsa
  iti kolektibo nga estratehiya ken aksyon para iti demokrasya a nakasentro kadagiti
  tattao, dayta ket, demokratiko nga panagtagikua ken kontrol kadagiti sentral ken
  nasisita para iti panangsustini iti biag: angin, danom, daga, enerhiya, trabaho,
  panagbalay, panagsalaknib iti salun-at, edukasyon, transportasyon, ken daddumapay.
  Kasapulan nga aramidenna nga mangdasar iti alternatibo nga sistema maipapan ti gimong
  ken pang-ekonomiya nga mangited kadagiti kasapulan ti tao ken pagilyan, nga adda\u2019t
  kapanunotan para iti panangpasubli a kapasidad iti aglawlaw. Maysa a sistema nga
  mangsupapak kadagiti kangrunaan nga karbengan dagiti umili ken mangbigbig iti panagtagibi
  da iti law-ang (nature). Maysa a sistema nga mangbigbig nga iti pananakasalbar,
  iti dignidad, ken iti panangpasayaat iti tao ket nakasilpo iti biag ti komunidad,
  ken kangrunaan iti biag ti lubong.\"", "\"VIGAN CITY \u2013 Walupulo ket maysa nga
  iskolar ti immawat iti alawansda idi Abril 21 iti DWRS ditoy.\\nPersonal nga inawat
  dagiti iskolar ti P2,500 nga alawansda manipud ken ni Cong. Ronald Singson.\\nSegun
  ken Singson, nupay aggapu iti opisinana ti pondo para iti nasao nga scholarship,
  adda nabuangay a grupo a mangproseso kadagiti aplikante para iti scholarship ta
  dina kayat nga adda maibabalaw a pabpaboran daytoy a programana.\\n\u201cDaytoy
  ket tulong a pinansial kadagiti deserving students ket saan ngarud a mabalin a mamantsaan
  iti politika,\u201d kinuna ni Singson.\\nAddanto pay sumaruno nga 85 nga iskolar
  nga umawat iti alawans.#\\nComments are closed.\"", "\"(L-R) Romeo Acyangan, LDRRMO;
  Donnie Valdez, Marvin Casion, Jonathan Ananey, Jayson Rivera, Julius Ticuala, Johnray
  Sanchez\\nIdi Octobre 28-30, 2019 naiganuat iti Skills Training on Basic Emergency
  Response babaen iti Local Government Unit ken Bureau of Fire Protection tapnu maiyammo
  kadagiti Day Care Teachers, Brangay Health Workers, Barangay Nutrition Scholar ken
  estudiyante nga nagapu iti Saint Agnes School, Cervantes National High School ken
  Alternative Learning System. Iti kadawyan nga kapasidad iti emergency response,
  ken impormasyon ti panagsagana sakbay adda didigra ket importante tapnu agbalin
  da nga epiktibo a boluntaryo ken agresponde iti bukod da nga komunidad ken aglawlaw.\\nIdi
  madama ti Training\\nIdi met Nobyembre 25-27, 2019 iti Rescue Team ti Cervantes
  ket nagpartisipar iti 5th Governor\u2019s Rescuelympics idiay siyudad ti Vigan,
  Ilocos Sur.\"", "\"Hmm \u2026 ti browser mo ket daan unayen.\\nPabaroen tayo ti
  browsermo tapno maganasam iti napaspaspas, ken nataltalgen nga kapadasan ayan iti
  site.\\nPannakaikari\\nDagiti pammataudan a tumulong kenka a mang-navigate iti doble
  a pannakakualipika iti Medicare ken Medicaid\\nAlaem ti libre a giya iti doble a
  plano\\nAmin a masapul a maammoam maipapan kadagiti Doble a Plano kadagiti Nasingsingayan
  nga Kasapulan a napaminsan, nanam-ay a giya.\\nDagiti doble\u2019t-pakaikarianna
  a plano iti salun-at ket para kadagiti tattao nga addaan iti Medicaid ken Medicare.
  Kitaem no matun-oymo dagiti makalikaguman.\\nNu kapaset a kualipikadoka iti doble
  para iti Medicare ken Medicaid, mabalin a makaalaka iti ad-adu a benepisio iti Doble
  a Plano Kadagiti Espesial a Kasapulan ngem iti Original Medicare\\nAmmoen ti maipapan
  iti Kanayonan a Tulong ti Medicare ken dagiti dadduma a programa a mabalin a makatulong
  a mangpalaka iti pannakasaklaw iti seguro ti salun-at para kadagiti tattao nga addaan
  iti nababa a kita\\nKalpasan ti Abril 1, 2023, masapulto nga isertipika manen dagiti
  umaw-awat iti Medicaid ti masakupan ti seguro-da ken mabalin a minilion a tattao
  ti makatakwat a napukawda dagiti benepisioda iti Medicaid.\\nAnia ti nagdumaan ti
  buo ken paset a dua\u2019t pakaikarianna, ken kasano a makatulong a makissayan ti
  cost sharing iti gasto dagiti benepisio ti Medicare?\\nKasapulan dagiti miembro
  ti Dual Special Needs Plan (D-SNP) a pagtalinaeden ti masakupan da iti Medicaid,
  wenno mabalin a mapukaw ti masakupan da iti dua a plano iti salun-at da.\\nMaysa
  a kabuklan nga kapanunutan nu kasano a makatulong ti panagpalawa iti Medicaid iti
  panangipaay iti seguro ti salun-at para kadagiti tattao a nababa ti kitana. Sinno
  dagiti agbenepisyo manipud iti panagpalawa iti Medicaid ken ania ti law-ang iti
  saklaw (coverage gap) ti Medicaid?\\nPannakaikari\\nDaytoy a link ket maar-aramid
  a sidadaan tapno makaala ka iti impormasion manipud iti maikatlo a partido a website.
  Daytoy a link ket naipaay laeng kas panglakaan ken saan a panangiyendorso ti linaon
  ti maikatlo a partido a website wenno aniaman kadagiti produkto wenno serbisio a
  naidiaya iti dayta a website. Saankami a responsible para kadagiti produkto wenno
  serbisio a naidiaya wenno ti linaon dagiti aniaman a naikamang a website wenno aniaman
  a link a nailaon iti nai-link a website. Saankami nga agaramid ti aniaman a pakdaar
  maipapan ti kalidad dagiti produkto wenno serbisio a naidiaya, wenno ti linaon wenno
  kinaumiso dagiti materiales kadagitoy a website.\"", "\"SIUDAD ITI SAN FERNANDO,
  La Union, May 22 (PIA) -- Nangidiaya ti Overseas Workers Welfare Administration
  Regional Welfare Office I (OWWA RWO1) iti sangapulo ket dua nga eskolarsyip para
  kadagiti annak dagiti mangmangged ti ballasiw taw wenno Overseas Filipino Workers
  babaen ti Dependent Scholarship Program.\\nNangidiayada ti tulong pinansyal para
  kadagiti depedent nga aktibo a miembro ti OWWA a ti sueldo na ket saan a ngumatu
  ti US0 a kas nakasaad diay bisa ti kontratada a nagtrabaho, kuna ni OWWA-RWO1 Labor
  Communications Officer Amapola Z. Villar.\\nSIUDAD ITI SAN FERNANDO, La Union, Mayo
  16 (PIA) -- Nagsanay dagiti kameng ti pulis ditoy La Union ti panagpatubo ti maimula
  kayo wenno seedling production a kas paset ti pinirmaanda a Memorandum of Agreement
  ti nagbaetan ti Department of Environment and Natural Resources \u2013 Ecosystem
  Research and Development Sector (DENR-ERDS) ken ti Philippine National Police (PNP)
  para ti panagsuportada ti National Greening Program (NGP).\\nSYUDAD ITI SAN FERNANDO,
  La Union, May 10 (PIA) -- Agarup 6,096 nga agtutubo ditoy rehiyon ti agtrabaho ita
  a panawen ti tikag babaen ti expanded Government Internship Program (GIP) ti Department
  of Social Welfare and Development (DSWD).\\nDagiti nakipaset nga indibidwal ket
  dagiti out-of-school-youth, saan a nakapagturpos ken nakaturpos ti kurso nga awanan
  pagsapulan na nga agtawen ti 18 agingga 30 ti tawenna.\\nSIUDAD TI SAN FERNANDO,
  La Union, Mayo 6 (PIA) -- Nakaawat iti tulong pinansyal dagiti benepisiaryo ti Pantawid
  Pamilyang Pilipino Program (4Ps) manipud ti Department of Social Welfare and Development
  (DSWD).\\nAgarup P160.6 milyones ti total a naited kadagiti 77,713 a pamilya manipud
  ti nadumaduma a probinsiya ditoy rehiyon.\\nDaytoy nga programa iti 4Ps ket gandatna
  a makatulong babaen ti pinansiyal nga aspeto, nangnangruna kadagiti marigrigat a
  Pilipino ken makatulong met tapno mapasayaat ti salun-at da, nutrisyon ken edukasyon
  a kas maysa nga estratehiya tapno magun-od ti pagilian iti Millennium Development
  Goals agingga 2016.\"", "\"a protected area iti Balbalasang-BalbalanNational Park.
  Paset ti panaglarga ti drillingexploration na iti tri-boundary ti Conner-Pinukpuk,
  ken Balbalan, ti panangitakderiti pasilidad idiay Tabuk, Kalinga nga awanti building
  permit ken pammalubos dagitiresidente. Nakaala met daytoy ti Free, Priorand Informed
  Consent (FPIC) iti maysa paynga aplikasyon para iti eksplorasyon babaeniti panagpasuksok
  ken panangikari kadagititrabaho ken proyekto a maipatungpal kanono mapalubosan ti
  eksplorasyon kadagiti lugar.Ti Phelps Dodge ken Malibato Inc,agpada a subsidyaryo
  ti Free Port Mc Moranket agtultuloy latta ti drilling operations daidiay Quirino,
  Ilocos Sur ken idiay Kalingaiti laksid ti panangsupyat ti umili iti lugar.Idiay
  Mankayan, Benguet maysa nga aldawkalpasan ti SONA ni Pnoy, simmangpet ti 22polis
  ken militar ken dua a bus a nagluganan tisecurity ti Lepanto a nanggandat a mangrakrakiti
  barikada sadiay. Ti barikada ket pito a bulana nakatakderen kas pananglaban ti umili
  itidrilling exploration ti Lepanto ken kasosyo daytoya kompanya a South-African.Kabayatan
  na, naaprubaran ti innem (iti 11 amaiplamplano) a geothermal plants a mangpatauditi
  nasurok a 280 megawatts iti Cordillera,kangrunaanen ti Chevron. Adda met naaprubaraniti
  Cordillera a 35 hydropower dam a mangpataud itikabuklan a 326.8 megawatts. Daytoy
  nga enerhiyaket saan a para kadagiti nakurapay nga awanan tikuryente kadagiti nasulinek
  a lugar ti Cordillerano di ket mailako kadagiti syudad iti dadduma paya paset ti
  Luzon iti uneg ti plano nga WholesaleElectricity Spot Market (WESM).Us-usaren ti
  gobyerno a rason ti pagsayaatan tiumili, panangaywan iti kalikasan, ken panangipangatoiti
  pastrek ti gobyerno para iti sustenable a panagdurasti ekonomya. Ngem iti esensya
  ket saan abalbaliwan daytoy ti oryentasyon a liberalisasyon itiindustriya ti panagminas
  ken panangted-wayawaya itipanagkontrol dagiti lokal nga agpupuonan. Nalawagnga iyun-una
  ti rehimen nga US-Aquino ti interesdagiti ganggannaet ken iwalwalin na dagiti lehitimoa
  panawagan iti karbengan iti daga, rekurso, kenpagbiagan ti nailian a minorya.Iti
  Politika: Risiris dagiti agturturay a pulitikoken kumarkaro a panaglabsing iti karbengan-taoIti
  yaasideg ti Eleksyon 2013, makitan tinadumaduma a wagas dagiti madama a nakatugawa
  politiko tapno agkalap ti butos para iti re-eleksyonda. Ti umad-adu nga al-alaen
  da a kaswal ngaempleyado manipud iti barbaryo, panangiruarti babassit a pondo para
  iti imprastruktura, kenpanangpili kadagiti benepisyaryo ti 4Ps basar iti nosiasino
  ti sigurado a pumabor iti panagtaray da, ketsumagmamano laeng kadagiti addang da.
  Dagiti metagam-ambisyon a makatugaw iti puesto ket agararikattotnga usaren amin
  a mabalin a wagas tapnomakaurnong ti suporta a kas iti panangmaksimisaiti intero
  a klan, dagiti kumare ken kumpare, kdpy.Ngem nakatugaw man iti poder wenno saan,agpapada
  nga agus-usar da ti panangallilawwenno panagranggas, wenno kombinasyon tidua. Agduduma
  laeng iti tukad ti panangusarkadagiti taktika basar iti rekurso da. Saan amailibak
  ti panagrimbaw ti armas ken goons,panagkukumplot dagiti politiko ken PNP/AFP,ken
  mismo a COMELEC kadagiti pagar-arian amunisipalidad dagiti politiko a warlord.8
  DANGADANG HUNYO-HULYO 2012\\nIdiay Ilocos, agtaltalinaed ti panagar-ari dagitidati
  a dinastiya a Singson iti Ilocos Sur, dagitiMarcos iti Ilocos Norte, ken Ortega
  iti La Union.Namnamaen nga iggeman latta dagiti nabilegdagiti posisyon da isu nga
  isuda latta ti tumarayiti umas-asideg nga eleksyon. Naaweng ti damagnga agsinnukat
  ti puesto iti kina-gobernador kenkongreswoman ti agina nga Imee ken ImeldaMarcos
  inton 2013.Iti Cordillera, agtultuloy nga agpalpalawa kenagkunkonsolida ti Liberal
  Party (LP), ti partidoni Pnoy. Itay Hunyo ket nagsapata ti 300 baro amiembro daytoy.
  Iggem itan ti LP ti mayorya dagitipolitiko iti Cordillera a dati a domdominaran
  tiLakas-Kampi ni Gloria Arroyo. Kagudua dagitimayor ti munisipalidad, lima iti pito
  a kongresman,ken innem iti pito a gobernador ket adda iti unegti LP. Sisteman dagiti
  madama nga agturturayken dagiti agkalikagum a makatugaw iti puesto tipannakitipon
  iti agdama a dominante a partidogapu iti namnamaen da a pondo para iti kampanyaken
  akomodasyon.Bogus a Regional Autonomyken RepormismoKagiddan ti panagsagana dagiti
  politiko itiEleksyon 2013 ti panangiduron iti bogus a RegionalAutonomy (RA) babaen
  iti House Bill 5595 itiKongreso idi Disyembre 2011 ken Senate Bill 3115itay Pebrero
  2012. Ti maikatlo a draft ket nagrikusenkadagiti probinsya ti Cordillera iti panangidauloti
  Regional Development Council ken ni MayorMauricio Domogan ti Baguio City.Iti kalkalpas
  a selebrasyon ti reaksyunaryo agobyerno iti bersyon da ti \u2018Cordillera Day\u2019
  itay Hulyo2012, nangipaduyakyaken ti panagsuporta dagitikangrunaan a tradisyunal
  a politiko (trapo) iti RA.Maibilang kadagitoy da Gov. Eustaquio Bersamin tiAbra,
  Rep. Eleanor Bagtang ti Apayao, Gov. Elias BulutJr. ti Apayao, Rep. Maximo Dalog
  ken Gov. LeonardMayaen ti Mountain Province, Gov. Eugene Balitang tiIfugao, ken
  Acting Gov. Sonny Mangaoang ti Kalinga.Ti bogus nga RA kano ti sungbat iti nabuntogken
  saan a sustenido a panagdur-as ti ekonomyati Cordillera. Ngem ti regional autonomy
  nga iyababantedagiti oportunista a politiko, iti esensya,ket panangkamat laeng iti
  alokasyon ti badyet,DANGADANG HUNYO-HULYO 2012no adda, ken independyente nga istruktura
  kenpanangimaton. Nayon pay, aw-awisen daytoyti sumagmamano a propesyunal ken daddumapay
  nga akintengnga a puersa tapno tumulong itiad-adda a panagtakaw iti rehiyon. Ti
  gakat a bogusnga RA ket mangmangted laeng ti artipisyal arupa ti awtonomya bayat
  a saan a sungsungbatandaytoy dagiti pundamental a problema a ramutti panagrigrigat
  ken panangidadanes iti nailian aminorya.Kas iti panangusar iti bogus nga RA kas
  rupati panagdur-as, agtultuloy dagiti repormista aproyekto ken programa a kas iti
  Second CordilleraHighland Agricultural Resource ManagementProject (CHARMP 2), 4Ps,
  Peace Zone, Payapaat Masaganang Pamayanan (PAMANA) kenLocal Integration Program
  (LIP) ti Office of thePresidential Adviser on the Peace Process (OPAPP).Dagitoy
  ket pamuspusan tapno iyadayo ti umiliiti panangdaliasat iti dalan ti rebolusyonaryo
  apanagbalbaliw. Maibilang met kadagiti repormistaa grupo a mangitantandudo ti linya
