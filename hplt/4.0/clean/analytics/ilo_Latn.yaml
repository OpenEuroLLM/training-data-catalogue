  itipanangilako kadagiti agas-botika ken ramit itimedikal, kasapulan man a talaga
  wenno saan.Manipud pay idi panawen ti diktadura aMarcos, paseten ti pribatisasyon
  kadagiti kondisyona mainaynayon iti Structural Adjustment Program(SAP) a masapul
  a maipatungpal tapno makautangmanipud iti International Mo net ary Fund ken WorldBank
