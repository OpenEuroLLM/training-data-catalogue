  tilumaban.12 DANGADANG HUNYO-HULYO 2012\\nNaipasngay idiay Sinait, Ilocos Sur ni
  Rodel\u201cKa Bunso\u201d Corpus. Nagtaud isuna iti pamilyaa nakurapay a mannalon
  isu a makitaltalon da.Gapu iti daytoy, namulat isuna iti nakaro a pyudala panaggundaway
  ken kinaulpit ti dakes a gimong.Agprotprotesta isuna iti kinabulok ti gimong ngemawan
  ti direksyon, isu a naiduron isuna kadagitiaramid nga anti-sosyal.Idi maammuan na
  ti ilablaban tirebolusyonaryo a tignayan, naguyod a permi tiinteres na aglalo iti
  NPA, nga iti daydi a panawenket rumegregta manen iti lugar da. Ngem gapu tasaan
  a direkta a sakup ti NPA ti ayan na, saan anadalapus ti panagorganisa ni Ka Bunso.
  Gapu itidaytoy, isu mismo ti nagbirok kadagiti kakaduatapno sumampa.Tawen a 2006
  idi sumampa ni Ka Bunso. Urayno kabarbaro a kameng, dagus a naisabak isunakadagiti
  labanan, sumagmamano kadagitoy ketdepensiba. Iti laksid ti nairteng nga atake tikabusor,
  nagtalinaed a nangato ti mannakilabana pakinakem na. Maysa a rinnupak idi 2007ti
  nakaro a nakasugatan ti ima na. Nabayag tiproseso ti panagpaimbag na a nangpakaro
  itigagar na nga agsubli iti yunit. Napalalo ti ragsakna a tumipon ken agakem kadagiti
  rebbengenkas hukbo. Idi makasubli iti Hukbo, determinadoa mangpapartak iti panagimbag
  ti ima natapno dagus a makaiggem ti armas. Kabayatanna, imbukbok ni Ka Bunso ti
  panawen na itipanangipatungpal iti dadduma a trabaho a kasiti panaggawaing masa
  ken kadagiti teknikal atrabaho ti hukbo. Nalatak met kenni Ka Bunsoti gagar a kanayon
  a makipulapol iti masa.Ni Melvin\u201cKa Omeng\u201dDehikasyonPermi ti ayat na a
  makiistorya ken agpropagandaiti masa.Ni Ka Bunso ket nalaing nga S4 manipud ititukad
  tim, iskwad, platun agingga iti kompanya.Impatungpal na a nasayaat ti naited a rebbengenna
