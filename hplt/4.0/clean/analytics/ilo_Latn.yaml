  a dagiti patakaran ken programadaytoy ket nakasilpo iti patakaran ti pribatisasyon.Nalatak
  kadagitoy ti Health Development Projecta pinonduan ti World Bank ti $70 milyon idi
  1989,Health Sector Development Program a pinonduan tiAsian Development Bank ti $200
  milyon idi 2004,ken National Sector Support for Health Reform apinonduan ti World
  Bank ti $110 milyon idi 2006.Ipaspasaknap met dagiti imperyalista apagilian ti maysa
  a sistema a pangsalun-at anakasentro iti ospital, agas-botika, ken doktor. Titalmeg
  ket iti panangagas iti panawen nga addasakiten (curative) imbes nga iti panangpapigsati
