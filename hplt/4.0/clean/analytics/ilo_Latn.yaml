  HUNYO-HULYO 2012 11\\nMartir ti RebolusyonNaindaklan a Panangidaton ti Biagmaikapat
  a pasetITI MAUDI A PASET TI PANANGBIGBIG KADAGITInadayaw a martir ti Tineg 8, isarsarming
