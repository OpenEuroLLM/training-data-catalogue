  "\"Angola\\nTi Angola, opisial a ti Republika ti Angola (Portuges: Rep\u00fablica
  de Angola, panangibalikas: [\u0281\u0268\u02c8publik\u0250 d\u0268 \u0250\u0303\u02c8\u0261\u0254la];[5]
  Kikongo, Kimbundu, Umbundu: Repubilika ya Ngola), ket maysa a pagilian idiay akin-abagatan
  nga Aprika a naibeddengan babaen ti Namibia iti abagatan, ti Demokratiko a Republika
  iti Kongo iti amianan, ken ti Zambia iti daya; ti laud na a pantar ket addan idiay
  Taaw Atlantiko iti Luanda a kas ti kapitoliona a siudad.\\nDagiti nagibasaran[urnosen
  | urnosen ti taudan]\\n- ^ Population Forecast to 2060 by International Futures
  hosted by Google Public Data Explorer\\n- ^ a b c d \\\"Angola\\\". Internasional
  a Pundo ti Panguartaan. Naala idi 8 Oktubre 2011.\\n- ^ \\\"Gini Index\\\". World
  Bank. Naala idi 2 Marso 2011.\\n- ^ \\\"2014 Human Development Report Summary\\\".
  United Nations Development Programme. 2014. pp. 21\u201325. Naala idi 27 Hulio 2014.\\n-
  ^ Daytoy ket ti pannakabalikas idiay Portugal; idiay Angola daytoy ket maibalikas
  a kas naisurat\"", "\"No pudno ti nakalapna nga impormasion, ti mountain ranges
  wenno taratar dagiti bantay a mangsakop ti Bantay Kuntirad ket nagtunged iti batog
  dagiti dua a dadakkel ken nagtimmukel a tangrib, a kunam la no paris a mata a mangtantannawag
  ti kabaybayan. Dayta a lugar ket iti lauden ti Bantay Kimmallugong, agarup sumurok-kumurang
  a dua gasut a metros manipud iti ayanna. Agarup met iti sumurok-kumurang a dua a
  kilometro ti baet ti kabambantayan ken ti paris a tangrib iti baybay.\\nSinakayan
  ni Rino ti motorsiklona, ket kinamangnan iti takdang iti asideg-batog dagiti dua
  a tangrib. Iti igid a kakandarumaan, a nagpuesto ken mangpaliiw ti kabaybayan. Iti
  ababa a pannao, nasken nga aglemmeng, uray ti motorsiklona ket adda iti abayna,
  a madadaan nga aramatenna no nasken. Awan met ti matatao iti lugar ta adayo kadagiti
  kabalbalayan.\\nNgem awan iti karkarna a mapaliiwna iti naglabas a sumagmamano a
  minutos. Inruarna iti backpackna ti gadget a mangammo kadagiti nadumaduma nga elemento
  iti aglawlaw. Nasken laeng a tingitingen ken amiris dagitoy, tapno masaluadanna
  iti inna pakaisagmakan. Adu dagiti nagrehistro iti gadgetna a kinaadda dagiti elemento
  wenno dagiti datdatlag a parsua, ngem saan a mangipaay dagitoy iti kinadamsak, isu
  a binay-anna latta metten ida nga agpaliiw met no ania ti paliiwenda. Ngem iti panangidasig
  ni Rino, sumagmamano kadagiti elemento iti saan a maisina dagiti matada ken ni Rino.
  Iti pattapatta ni Rino, palpaliiwenda la ketdi no ania ti aramidenna dita. Binay-an
  lattan ni Rino dagiti elemento ket iniddepna payen ti gadget ken insubli iti uneg
  ti backpack ket intuloyna iti nagpaliiw.\\nMangngegna ti uni dagiti kuriat, riari
  ken dadduma pay a mangrabrabii. Mamitlo metten a naimatanganna ti nalabit a puwwek
  iti law-ang \u2013 imbasarna ti pattapattana iti kinaawan sabali a nocturnal a tumatayab
  no di puwwek ken kas iti paliiwna iti panagkayabkab daytoy. Naulimek ti kabaybayan
  ta nakaturog dagiti dalluyon. Agin-inana met ti pul-oy isu nga awan iti marikna
  a kayab, a kas mapaliiw kadagiti naingpis ken babassit a bulbulong dagiti muyong
  ken kaykayo a dida pulos aggunay wenno kas iti dati nga aramidda, makipagkumpas
  koma iti sala ti pul-oy.\\nNagkidem ni Rino tapno pabilgenna pay ti bukodna nga
  aura, ta dinto ket masikapan ti bileg ti sipnget, ta di met masasaan wenno awanen
  ti kinaadda dagiti pasurot ti sipnget nga agpalpaliiw iti suli, nupay naynay ketdi
  a lissian dagitoy a pasurot ti sipnget isuda nga addaan iti naidumduma talugading;
  nupay kasta, saan amin a pasurot ti sipnget ket aglisi, ta adda latta dagiti barisuwweng
  a mangipakita iti kabaelanda ken makipinnadas iti bileg ti Lawag, a kas ken ni Rino
  ken dagiti kameng ti Annabo. Pinalidemna met laeng ti aurana.\\nMadamdama pay, dua
  nga orasnan nga agpalpaliiw, segun iti relos iti punguapunguanna. Namulagatnna a
  naitapawen iti Bantay Kimmallugong ti umis-isem ken nakamulagat a kabus. Awan a
  pulos ti milat ti tangatang. Timminggaw ti konsierto dagiti riari ken andidit. Anian
  a nagdaeg a buya ti nakaparsuaan! Dumuyaw-bimmalitok ti lawag ti kabus a bulan.
  Masirayan dagiti kangrunaan nga elemento ti lubong: ti daga, ti danum iti kabaybayan,
  mariknanan ti gunaygunay ti agmurmuray nga angin.\\nSimmeksek iti muging ni Rino,
  ket naiyesngawna: \u201cYanna ti elemento ti apuy?\u201d Inwarasna ti panagkitana
  ngem napaay. Ngem kellaat a napakudkud iti di met nagatel a teltelna idi mataldiapanna
  ti bassit nga apuy iti tuktok ti Bantay Kuntirad.\\n\u201cNagkangelak metten\u2026!\u201d
  kinunana nga inkatawa. Pinaliiwna ti apuy iti Bantay Kuntirad, madamdama pay, agiddep-aglawag
  iti sumagmamano a daras agingga iti saanen a makita.\\n\u201cAnia ti kayatna nga
  ipasimudaag?\u201d Dinamagna iti bagina. Nagrupanget ni Rino, dina pulos mabatok
  ti kaipapanan wenno ti gunay ti nakaparsuaan. Iti panunot ni Rino, nalabit a nalpasen
  ti senario? Tinangadna ti umis-isema kabus, ti nakaturog a kabaybayan ken ti dipay
  namurmurayan a pul-oy ngem dina mabasa ti mensaheda.\\n\u201cAnia ti sumaruno a
  senario?\u201d Ngem awan iti mapaliiw ni Rino. Inkeddengnan iti agawid. Sinakayanna
  ti motorsiklona. Ngem nailabeg idi makangngeg iti kanabsuok. Nagpaliiw, adda manen,
  umas-asideg, iti naminsan pay a kanabsuok, naimatangannan ti datdatlag a parsua,
  nga itan, addan iti takdang a sisasango iti Bantay Kuntirad.\\nSaan pay nga agkidem
  ni Rino a mangmatmatmat ti datdatlag a parsua. Dina pulos mailadawan no ania dayta
  a parsua, dina mainaganan. Intayok ti mugingna kadagiti nabasbasana a libro dagiti
  nadumaduma nga ayup ngem awan iti kasta a naikur-it wenno nasukisok. Datdatlag a
  talaga ken naidumduma.\\nLimmagto ti ayup ken nagdisso iti agarup a sangapulo a
  metro. Pinagandar ni Rino ti motorsiklona, insilawna ket sigagagar a nangkamang
  ti ayan ti datdatlag nga ayup.\\nNagbalaw ti datdatlag nga ayup iti kinaadda ti
  sumungad a motorsiklo. Sinangona daytoy. Dagiti matana ket limmagbaga iti natayengteng
  a kunam la no bumegbeggang. Nagsardeng ni Rino iti agarup lima a metro iti nagbaetanda,
  iniddepna ti silaw ngem saan ti makina ti motorsiklo. Lalo pay a timmarnaw ti nalabaga
  a mata ti ayup, manipud iti ngiwatna, in-inut a nagruar iti apuy agingga iti agtultuloyen
  a nagruar ken ngumayngayebngeb. Iti pattapatta ni Rino, sidadaan ti ayup a makiranget
  kenkuana iti kanito nga umasideg ken agdangran.\\nImmisem ket nangilangangil ni
  Rino. Imparabawna ti kanawan a dakulapna iti batog ti pusona, inunnatna-a-pasango
  ti kanigid ngem nakatakder ti dakulap ken nagdidippit dagiti ramramayna, nagkidem
  tapno parangrangenna ti aura ti bagina, sa kalpasanna, nagmulagat met laeng a sikikita
  iti datdatlag nga ayup. Nagpinnaliiw ti narangrang a bagi ken umap-apuy a bagi.
  Madamdama pay, in-inut a nagpukaw ti apuy iti ngiwngiw ti ayup, limmidem dagiti
  matana ngem saan nga aggunggunay a kasla agpalpaliiw met iti aramiden ni Rino.\\nNagtantanamitim
  ni Rino, sa kalpasanna, in-inut a nagpukaw ti aurana wenno lawag nga agtaud iti
  bagina, inin-inutna nga imbaba dagiti takkiagna. Pinaliiwna ti datdatlag nga ayup
  ket pilitna nga inmarka iti mugingna: kasla kanggaro, atitiddog-nawalat dagiti dua
  a sakana a makinlikud ket nalagip ni Rino ti talugading ti praying mantis nga addaan
  met iti atitiddog a saka nga isu iti usarenda no lumagtoda iti nakaad-adayo. Iti
  panunot ni Rino, kastoy daytoy a datdatlag a parsua, isu a no lumagto ket nangato
  ken adayo iti inna pagdissuan. Ab-ababa dagiti sakana iti masanguanan. Immaratiddog
  ti ngiwngiwna. Immatidddog met ti ipusna a nalukmeg iti puon sa in-inut a bimmassit
  agingga iti kutit daytoy nga ayan ti nagkuntirad a kasla iti sima wenno ankla. Awanan
  dutdut ti nangisit a bagina, immaratiddog dagiti nawalat ken kuntirad a lapayagna.
  Iti pay paliiw ni Rino, natatadem la ket dagiti agpapada a ngipen daytoy ta nakanganga
  pay laeng ti ngiwngiw ti datdatlag nga ayup. Kasla katayag ti gagangay a baka wenno
  nuang ngem naingpis-narapis ti bagina. Iti lawag ti mulagat ken umis-isem a bulan,
  maripar ni Rino nga atitiddog dagiti nagbakkog a kuko ti datdatlag a parsua.\\n(ADDA
  TULOYNA)\\nComments are closed.\"", "\"Hypocalymma cordifolium\\nTi Hypocalymma
  cordifolium ket ti sebbangan ti mula iti pamilia ti Myrtaceae nga endemiko iti Akinlaud
  nga Australia.[1]\\nTi nalinteg wenno agdalapdap a bassit a mula ket kadawyan nga
  agtubo iti katayag iti 0.2 aginggana iti 2 metro (0.7 iti 6.6 ft) ngem mabalin a
  makaabot iti katayag iti 6 metro (20 ft). Dayto ket agsabong iti pagbaetan ti Septiembre
  ken Pebrero ken agpataud kadagiti derosas-puraw a sabong.\\nMabirukan daytoy kadagiti
  natiempuan a nabasa a lugar kadagiti igid ti nagayusan ti waig siti igid ti aplaya
  kadagiti rehion ti Great Southern ken South West iti Akinlaud nga Australia nga
  idiay ket agtubo kadagiti nadarat aginggana iti nadara-nasekka a daga kadagiti granito
  wenno laterito.[1]\"", "\"PADPADAYAWANNATAYO ti Namarsua ta impaayannatayo iti di
  magatadan a sagut a wayawaya a mangngeddeng. Kasta met, sibubuslon a bembendisionanna
  dagidiay naimpusuan a mangus-usar iti wayawayada a mangngeddeng agpaay iti pudno
  a panagdayaw ken dagidiay mangikagkagumaan a mangsantipikar iti nasantuan a naganna
  ken mangsupsuporta iti nadayag a panggepna. Saan a kayat ni Jehova ti mapilpilit
  a panagtulnog. Imbes ketdi, napateg kenkuana ti situtulok a panagserbi a nabuyogan
  iti pudpudno nga ayat ken nauneg nga apresasion.\\nKas pagarigan, idi adda dagiti
  Israelita iti let-ang ti Sinai, imbilin ni Jehova a mangaramidda iti maysa a lugar
  a pagdayawan kenkuana. Kinunana: \u2018Mangalakayo iti kontribusion agpaay ken Jehova.
  Tunggal maysa a situtulok ti pusona iyegna koma dayta kas kontribusion ken Jehova.\u2019
  (Ex. 35:5) Mabalin nga ited ti tunggal Israelita ti aniaman a kabaelanna, ket ti
  tunggal boluntario a kontribusion\u2014aniaman dayta wenno kasano man ti kaaduna\u2014mabalin
  a mausar iti mayanatup a pamay-an tapno maibanag ti panggep ti Dios. Ania ti inaramid
  dagiti Israelita?\\n\u201cTunggal maysa a tinignay ti pusona\u201d ken \u201ctunggal
  maysa a ginutugot ti espirituna\u201d nangipaayda iti boluntario a daton buyogen
  ti \u2018situtulok a puso.\u2019 Situtulok nga impaay dagiti lallaki ken babbai
  ti banag nga adda kadakuada para iti trabaho ni Jehova: maisab-it nga arkos, aritos,
  singsing, balitok, pirak, gambang, asul a sinulid, delana a purpura, eskarlata a
  material, napino a lienso, dutdot ti kalding, lallalat ti kalakian a karnero a natinaan
  iti nalabaga, lallalat ti foka, kayo ti akasia, napapateg a batbato, balsamo, ken
  lana. Idi agangay, ti impaayda ket \u2018immanay a maipaay iti isuamin a trabaho
  nga aramiden, ket aglaplapusanan.\u2019\u2014Ex. 35:21-24, 27-29; 36:7.\\nSaan a
  dagiti material a daton ti ad-adda a nagragsakan ni Jehova no di ket ti kinatulok
  dagidiay nangsuporta iti nasin-aw a panagdayaw. Natignay pay dagiti Israelita a
  mangipaay iti panawen ken pigsada. \u201cAmin dagiti babbai a masirib ti pusoda
  nagtibbida babaen ti im-imada,\u201d kuna ti salaysay. Wen, \u201camin dagiti babbai
  a tinignay ti puspusoda buyogen ti kinasirib tinibbida ti dutdot ti kalding.\u201d
  Kasta met, impaayan ni Jehova ni Bezalel iti \u2018kinasirib, pannakaawat ken pannakaammo
  ken tunggal kita ti kinasigo iti panagtrabaho.\u2019 Kinapudnona, impaay ti Dios
  ti abilidad a kasapulan da Bezalel ken Oholiab tapno maaramidda ti amin a trabaho
  a naited kadakuada.\u2014Ex. 35:25, 26, 30-35.\\nIdi inawis ni Jehova dagiti Israelita
  a mangipaay iti donasion, naan-anay a nagtalek a \u201ctunggal maysa a situtulok
  ti pusona\u201d ket sumuporta iti pudno a panagdayaw. Sibubuslon a binendisionanna
  dagidiay situtulok ti pusona babaen ti panangiwanwan ken panangipaayna kadakuada
  iti aglaplapusanan a rag-o. Impakita ngarud ni Jehova a no bendisionanna ti kinatulok
  dagiti adipenna, siguraduenna a maipaay kadakuada ti aniaman a kasapulanda tapno
  maitungpalda ti pagayatanna. (Sal. 34:9) Sigurado a bendisionannaka ni Jehova bayat
  a situtulok ken naimpusuan nga agserserbika kenkuana.\"", "\"SAAN koma a maartapan
  ti kinasiglat, kired ken determinasion dagiti atleta a Pilipino nga agballigi kadagiti
  pakisalipanda nga agduduma nga ay-ayam iti 30th Southeast Asian Games (SEA Games)
  tapno magun-od ti Pilipinas ti kampeonato iti daytoy nga internasional a torneo.\\nAdu
  man dagiti timmaud nga isyu ken kontrobersia iti pannakaangay ti SEA Games iti maikapat
  a gundaway iti Pilipinas, nasken ti panangsuporta dagiti umili kadagiti kadaraan
  nga atleta iti pannakisalipda tapno mangabak ken agballigida kadagiti paay-ayam
  a pakisalisalanda ket saan a masayang dagiti nagadu a pondo iti panagsanay dagiti
  atleta ken panagsangaili ti pagilian iti daytoy naindaklan a torneo a pagsasalipan
  dagiti 11 a pagilian a nangrugi idi Nobiembre 30 agingga inton Disiembre 11.\\nIti
  sango dagiti adu a kontrobersia iti pannakaangay ti maika-30 SEA Games ket nasken
  a lipaten pay laeng dagiti Pilipino nga atleta dagiti pamilawan, panaguyaw ken kritisismo
  dagiti umili iti nagduduma a pagilian a makisalisal iti torneo.\\nNasakit man nga
  awaten ti kinapudno, ngem saan a mailibak a maapektaran dagiti Pilipino kadagiti
  nagadu a timmaud a kontrobersia sakbay ti pormal a panangrugi ti SEA Games sadiay
  Philippine Arena, Bocaue, Bulacan.\\nNaglak-am ti Philippine SEA Games Organizing
  Committee (PHISGOC), maysa a private foundation nga idauluan ti Chairman a ni House
  Speaker Alan Peter Cayetano, ken kangrunaan a maseknan iti pannakaangay ken panagsangaili
  ti SEA Games iti Pilipinas ita a tawen.\\nKrinitikar ni Senate Minority Leader Franklin
  Drilon ti nasurok a P50 Million ti balorna a SEA Games cauldron sadiay New Clark
  City, Capas, Pampanga a saan a maikanatad kabayatan a nagadu dagiti ad-adda a nasisita
  a paggastosan ta dayta a gatad ken makaipatakderen iti 50 a classrooms.\\nSakbay
  ti pormal a rugi ti SEA Games, timmaud dagiti reklamo iti kaaddayo dagiti venues
  ken naikamakam ken saan a pannakaileppas dagiti sports facilities a pakaangayan
  dagiti adu a paay-ayam iti nagduduma a lugar iti Luzon kangrunaanna iti Metro Manila,
  Bulacan, Pampanga, Tarlac, Subic, Tagaytay, Laguna, ken dadduma pay a lugar.\\nAdda
  met dagiti ganggannaet a delegado a nagreklamo bayat ti isasangbayda iti Ninoy Aquino
  International Airport, hotel accomodations, transportasion, nakaro a trapiko ken
  dadduma pay nga isyu. Immagal met dagiti foreign media para iti accrediations iti
  coverage. Nagreklamo pay dagiti dadduma a Pilipino ken ganggannaet nga atleta gapu
  iti saan a nasustansia a taraon a naidasar kadakuada kas ti sida nga itlog ken kikiam.\\nIti
  sango dagita a reklamo, nagpadispensar ni Speaker Cayetano gapu kadagiti nagkurangan
  ti organizing committee iti naan-anay a panagsagana iti SEA Games. Impasingkedna
  nga ikagumaanda a masangaili a nasayaat dagiti amin a delegado ken atleta iti torneo.\\nNaglak-am
  ti kritisismo ti PHISGOC gapu kadagiti kontrobersia a mabalin a mangapektar kadagiti
  atleta a Pilipino kas host ti torneo. Inrakurak ni Presidential Spokesman Salvador
  Panelo a paimbestigar ni Presidente Rodrigo Duterte no adda napasamak a kurapsion
  iti panag-host ti Pilipinas iti SEA Games kalpasan a timmaud dagiti nagadu a kontrobersia.
  Uray ti Senado, nakiddaw ti panagimbestigarda kalpasan ti SEA Games.\\nInrakurak
  ni sigud a Philippine Sports Commission (PSC) Commissioner ken sigud a Bacolod City
  Rep. Monico Puentevella ti kinaawan ti padas ken nakurang a panagsagana iti pannakaangay
  ti 30th SEA Games iti Pilipinas ta saan koma pay a batang dagiti Pilipino ti ag-host
  ita a tawen, ngem gapu iti panagsanud ti Brunei a pakaangayan koma ti torneo ket
  nagboluntario ti Pilipinas nga ag-host ita a 2019.\\nNi Puentevella ket kongresista
  ken sigud a PSC Commissioner idi naangay iti Manila idi 2005 ti 23rd SEA Games a
  nagkampeonan ti Pilipinas. Binabalawna ti kinakurang ti panagsagana ken kinaawan
  iti padas ken kinaadu dagiti nanggamulo iti 30th SEA Games B ti PHISGOC para ti
  panag-host ken kadagiti pasilidad; ti POC para ti panagpili ken panagsanay dagiti
  atleta, ken ti PSC para ti pannakaisagana ti pondo ti gobierno. Inrakurakna a napunduan
  ti PHISGOC iti nasurok a P7 Billion para ti panagsangaili, kalaksidan pay iti P13.5
  Billion a pondo para kadagiti nabangon ken napabaro a pasilidad. Inkomparana ti
  pondo a nausar idi 2005 SEA Games iti Manila a nagkampeon ti Pilipinas, a P500 Million
  a pondo laeng ti nausar ngem awan ti timmaud a nadagsen nga isyu ken problema ta
  mismo a beterano iti sports events dagiti nagmanehar iti torneo, ti PSC ken POC.\\nMangnamnama
  ni Puentevella nga agballigi ti Pilipinas a makagun-od ti kampeonato ita a SEA Games
  ta inkagumaan ti PSC ken POC a manayonan dagiti sports ken events a maisayangkat
  B manipud 40 ket nagbalinen a 56 B a dagitoy a nainayon ket paglaingan dagiti Pilipino
  nga atleta. Dinayawna ti POC iti panangibaonda kadagiti atleta nga agsanay kadagiti
  sabali a pagilian tapno ad-adda a lumaingda iti pannakasalisalda.\\nMaikapaten ita
  a gundaway a maangay ti SEA Games iti Pilipinas B idi 1981 a maikatlo ti pagilian
  iti overall standing; 1991 a maikadua a puesto; ken idi 2005 nga overall champion.\\nIdi
  2017 29th SEA Games sadiay Kuala Lumpur, nagun-od ti Pilipinas ti maika-4 a puesto,
  sinarunona ti Malaysia, Indonesia ken Thailand nga overall champion.\\nIta a 2019
  a maangay manen ti SEA Games iti Pilipinas ken ad-adun nga amang dagiti atleta ken
  baro nga sports a pakisalipan ken paglaingan dagiti Pilipino, manamnama nga isuda
  ti agkampeon iti laksid dagiti adu nga iysu iti torneo. Magun-odda laeng ti kampeonato
  babaen ti agkaykaysa a suporta\\ndagiti Pilipino.\"", "\"Komentario ni Christine
  Marie Verzosa\\nKamaudiananna, dimteng met laengen ti naatap a kappia iti Muslim
  Mindanao. Kas inwaragawag ni Presidente Benigno Aquino III iti telebision, nagkinnaawatanen
  ti gobierno ken ti secessionist group Moro Islamic Liberation Front (MILF) ket pagsaritaandan
  ti pannakapataud ti Bangsamoro Autonomous Region.\\nNaatap la unay ti kappia iti
  Mindanao iti uneg ti uppat a pulo a tawen a nakatayan ti rinibribu a katao ken nakadadaelan
  ti saan a mabilang a sanikua ken nakabusbosan ti gobierno iti linaklaksa a pisos
  gapu iti saan a mamingga a nadara a dangadang iti nagbaetan ti MILF ken dagiti soldado
  ti turay.\\nKuna ti presidente a ti kangrunaan iti panagsabat ti dua a dakulap ket
  ti pannakasubbot ti naimameg nga ekonomia iti abagatan a paset ti pagilian ken pannakaited
  iti nasirsirnaat a masakbayan dagiti agindeg. Kasapulan unay\u00a0 ti pannakaadda
  ti kapkapnekan a sapasap nga autonomous region a naibasar iti konstitusion ti pagilian.\\nMabasa
  iti 1987 Constitution a masapul a maaddaan iti autonomous government iti Muslim\u00ac\u2020
  Mindanao ken iti Cordilleras. Iti Article X, Section 15\u00ac\u2020 (Local Government
  Code), kunana: \u201a\u00c4\u00faThere shall be created autonomous regions in Muslim
  Mindanao and in the Cordilleras consisting of provinces, cities, municipalities,
  and geographical areas sharing common and distinctive historical and cultural heritage,
  economic and social structures, and other relevant characteristics within the framework
  of this Constitution and the national sovereignty as well as territorial integrity
  of the Republic of the Philippines.\u201a\u00c4\u011a\\nMangipaneknek a maysa a
  konstitusional a kalintegan ti pannakaadda ti autonomous region.\\nNupay addan napataud
  nga Autonomous Region for Muslim Mindanao (ARMM), saan unay a naballigian daytoy
  ta adda latta susik iti pannakaisikkir ti nalawlawa ken nawaywaya a konsepto. Tapno
  agpatinggan ti awan mamaayna a nadara ken nadagem a dangadang, naited dagiti nasisita
  a kasapulan tapno agsabat ti dua a dakulap a nangituding ti pannakabukel iti suroten
  a dana tapno mabukel ti Bangsamoro Autonomous Region. Buklen dagiti Muslim ken dagiti
  non-Islamic minority iti ka-Mindanaoan ti Bangsamoro.\\nNapagtutulagan ti panagkaykaysa
  ti gobierno ken secessionist group sadiay Kuala Lumpur, Malaysia. Tapno mapatalgedan
  ti saritaan dagiti dua, napirmaan ti katulagan idi Oktubre 15 sadiay Manila a sinaksian
  a mismo ti presidente.\\n\u201cThis framework agreement is about rising above our
  prejudices. It is about casting aside the distrust and myopia that has the plagued
  efforts of the past,\u201d inwaragawag ti presidente babaen ti broadcast media iti
  Malaca\u221a\u012aang a sinaksian dagiti amin a kameng ti gabinetena.\\n\u201cThis
  agreement creates a new political entity and it deserves a name that symbolizes
  and honors the struggles of our forebears in Mindanao and celebrates the history
  and character of that part of our nation. That name will be Bangsamoro,\u201d impaganetget
  ti presidente.\\nTi kinaadda ti katulagan ti mangipasigurado iti pannakaisardeng
  ti nadara a dangadang ken umaddang para iti nasirsirnaat nga agsapa a nabayagen
  a naipaidam iti ka-Musliman. Bareng saanen a masurotan ti implementasion ti napagtutulagan
  ti dana a\u00a0 nagnaan dagiti nalpay nga abaga kadagiti napalpalabas a tungtongan-kappia.\\nTi
  political will ti presidente ti kangrunaan a naisaruag a nangisulong iti dur-asan
  ti saritaan, ket saan met a nagsagaba iti pannakaupay\u201a\u00c4\u0112 nagbannawag
  ti tiansa a maragpat ti tartarigagayan a kappia ken panagdur-as iti Mindanao.\\nNabaknang\u00a0
  ti Mindanao iti natural resources ngem saan pay unay a na-explore gapu iti amak
  dagiti kapitalista a mairamanda iti mapaspasamak a nadara a rinnupak. No maparang-ay
  dagitoy agkalkalaegan a resources, possible nga itag-ayna ti nakananama nga ekonomia
  saan laeng sadiay a deppaar no di ket kangrunaan ti pagilian; no di man agbalin
  daytoy a tigre nga ekonomia iti Asia.\\nMapapati la unay nga addaan ti Mindanao
  iti $312 billion mineral wealth a masarakan iti mismo a lugar iti nadara a dangadang.
  Lalo iti partena iti Sulo nga ayan ti naitudo a nabaknang nga oil, gas ken mineral
  deposits.#\""]'
