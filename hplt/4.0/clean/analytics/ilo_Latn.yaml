  ti maysa a bulok a gimong. Maysadaytoy a nalatak a pagpapadaan da iti laksid tiagduduma
  a dasig a nagtaudan da.Ni Edgardo \u201cKa Recti\u201d Balbin ket nagtaud itidasig
