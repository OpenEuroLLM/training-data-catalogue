sample: '["\"Ilokano iti Del Pilar, Libertad kenGangalan. Kalpasan na, inserrekna
  iti proyekto a bio-ethanol tikaaduan a dagdaga. Buklis ngaasu-aso ti Ecofuel Land
  Development,ti kompanya a mangimatmatoniti panangpilit kadagitimannalon tapno iyawat
  da ti dagada ken mamulaan ti unas.Maangot latta ti dakes apanggep iti likod ti peace
  zone. Nodagitoy ti mangyuna, di kad''nalawag nga awan kappia, no diket panangagum
  iti dagdaga?Kappia dagiti sumagmamanoWen, nalawag a kasta. Ta tipeace zone ket paset
  tisangapagilian nga Oplan Bayanihan(OpB), ti oplan ti agdama arehimen US-Aquino
  a mangrarautita iti umili a Pilipino. Iti OPB,talmeg ti gobyerno ti pammaranga \\\"kinadur-as
  ken kappia,\\\" bayata sige latta ti operasyon a kombat,saywar ken paniktik laban
  iti umili.Kakuyog ti amin nga ahensyati gobyerno kadaytoy nga oplan.Isu nga adda
  ti 4Ps, ''tay binulankano a panangduol iti kuartakadagiti mapili a marigrigat apamilya.
  Adda pay dagiti itamborda a nagduduma a proyekto.Daytoy ti reseta ti rehimen Aquinoiti
  \\\"panagdur-as.\\\" Ngem basariti mapaspasamak ita, dagitiidurduron da ket proyekto
  amanang-agum iti daga kas tiproyekto a bio-ethanol.Panagpatakder kadagitirangtay,
  kalsada wenno dama nakasuero met iti dayuhan apautang. Panangidiaya tinalalawa a
  dagdaga ti mannalonpara iti dadakkel a korporasyon,kas ti paper mill iti Cauayan,
  Isabela.Iti likudan dagitoy amin, ti\\\"kinadur-as,\\\" kuarta ken ganansyaket iyawid
  dagiti agpupuonan,iyuneg iti bulsa da, ken pespesenda manipud iti daga, ling-et
  kenpigsa ti umili. Agtalinaed a saan amasolbar dagiti kangrunaan aparikut ti masa
  a Pilipino. Awanlatta ti mapagbiagan a daga, awantalged iti panagubra, awanserbisyo-pangkagimungan
  a dumanonkadakuada. Ti reseta tigobyerno nga agas ti \\\"panagduras,\\\"ket mangpapatay
  met gayamti tattao.Panagranggas, saan apanagdur-asTapno di tay'' makariri, pumuestodagiti
  army. Ti kappia itiuneg ti peace zone ket aglaon tinabusalan ken nalukloko ngaumili.
  Iti uneg ti peace zone,sumaknap dagiti repormista kenkontra-rebolusyonaryo a grupokas
  ti PADER. Ipasaknap da tipanangnamnama iti agdama agobyerno, saan nga iti militante
  apanaglaban.Mausar met ti proyekto a4Ps. No saan kano a suportaran timasa dagiti
  proyekto, maikkat idakas \\\"benepisyaryo\\\" ti 4Ps. Amindagitoy ket pangbatog
  da kadagitipudno a militante nga organisasyondagiti masa. Kas pangarigan,idi Disyembre
  10, naginrarali metdagiti puersa ti 4Ps, ALAMATKA,ken ethanol. Panggep da ngaawanen
  ti rali ti militante aDanggayan dagiti Mannalon tiIsabela (DAGAMI).Iti peace zone,
  pumuesto kenumadu dagiti pumakat a CommunityPeace and DevelopmentTeams wenno CPDT
  kadagitibaryo. Dagitoy dagiti dati ngaRSOT nga agnaed iti kabalbalayan;aginsisingpet
  ken agintutulong itimasa, bayat ipatpatungpal da tipanagsiim ken panangranggas itibumaryo.
  Kastoy ti kapadasandagiti masa a nalpasan ti CPDT itiBarangay Ueg, Bitabian, SanPablo,
  San Pedro, Marannao, DelPilar, Daragutan East, ken DaragutanWest.Nalawag a masapul
  alabanan ti gandat a pagbalinen a\\\"peace zone\\\" ti San Mariano kenaniaman pay
  nga ili iti rehion. Tipudno a mangted talnaken kappia iti umili ket tipanangrisut
  kadagiti basarana problema ti kagimungan.No mapunas tipananggundawaydagiti imperyalistaken
  lokal a kakumplotda, ti kappia ketibungan to ti kagimungana nawaya, narangayken
  nainkalintegan. --B4\\nNaguilian, IsabelaSangagasut nga ektarya adaga, ag-agumen
  dagiti DyNasurok sangagasut nga ektarya a daga a pagbibiagan dagitimannalon iti
  Barangay Quinalabasa, Minanga ken Cabaruan,Naguilian ti ag-agumen ti pamilya Dy.
  Kakumplot da itipananggamgam dagiti ahensya ti gobyerno a kas ti Department ofAgrarian
  Reform (DAR) ken Department of Environment and NaturalResources (DENR).Tawen 1950
  pay a nabukatan,napusisyonan ken napadur-asdagiti mannalon dagitoy a dagdaga.Namulaan
  ken nagbiaganda no pay nakarigrigat ti kasasaadken awan ti uray aniaman atulong
  a naited ti nasukan-sukata rehimen.Ngem kas ti kaaduan na apasamak, ti bigbigen
  ti gobyernonga addaan karbengan iti dagaket saan a dagiti tao a nagling-etken nagpadur-asmeyor
  ti Cauayan City, Isabela kenkabsat ni gubernador Bodji Dy.Gapu iti koneksyon iti
  dinastiyaa Dy, kuarta ken impluwensiya,pinasingkedan ti DAR a kukuadagiti agkabsat
  ti daga uray noawan ti titulo ken aniaman pay apammaneknek. Napan pay nagreklamodagiti
  mannalon itinapasuksukan a DENR ngem kaskasdinga awan sungbat da.mannalon iti mismo
  a puesto da.Maikkan da laengen kano ti talloa tawen tapno pumanaw. Saan abale, kuna
  da, ta saan da kanometten agsingir ti abang kadaytaa tallo a tawen. Napatakyas tipamilya
  Durugnan iti 5.8 ektarya,pamilya Magaway iti maysa ketkagudua nga ektarya, pamilyaEsteban
  iti dua ektarya ken adupay a pamilya.Ita a tawen, inagaw pay niCecil Dy ti lima
  nga ektarya a dagati pamilya Espiritu. Dayta a komanket 61 tawen a tagikua ti pamilyaEspiritu,
  manipud pay kadagitiappo da a naggapu pay iti Camalaniugan,Cagayan. Idi Mayo, kalpasanti
  panagapit da ket pilit apinatraktor ni Conchita Palencia tidaga da. Saan a dinengngeg
  tiagkabsat ti dawat dagiti mannalona maikkan pay ida ti uray tallolaeng nga apitan
  nga agtalinaed.Kalpasan na a trinaktor ti komanket impangta na nga isaruno tidua
  ket kagudua pay ngaektarya a namulaan ti kamote.kadaytoy, no di ket dagiti taonga
  addaan bileg ken kuarta.Indeklara ti agum nga agkabsat aCecil Dy ken Conchita La
  MadridPalencia a kukua da kano ti daga.Ni Cecil ket asawa ni Benjamin Dy,Napilitan
  dagiti mannalonnga agabang iti daga a dinalusanken nabayag a nagbannugan da.Nagitulod
  da ti muerto kada apitan.Bumagyo man wenno matikagan,gudduaan da ti apit dagitibukatot
  nga agkabsat.Idi 2009, patakyasen mettenda Dy ken Palencia dagitiAgburburek ti pungtotdagiti
  mannalon a maagagumanti daga. Pinullo atawen a nangiyuli da ti nagbannugannga abang
  itimansyon dagiti asyendero a Dyken Palencia, mapatalaw kenmapukawan da pay ti kakaysunaa
  pagbiagan. Nalawag a mangirurrurumenken mananggundawayti \u2018reporma iti daga\u2019
  ti reaksyunaryoa gobyerno. Rumbenglaeng ti organisado a panaglabanda tapno ilaban
  ti karbengan itidaga a kasilpo ti karbengan ngaagbiag. --B5\\nDaga ken serbisyo,
  saan a paltog,ti masapul dagiti IsabelinoMaudi a lawas ti Nobyembre idi naaprubaran
  ti maysa aresolusyon a gumatang ti gobyerno probinsyal ti Isabelakadagiti armas
  nga aggatad ti tallo a milyon a pisos. Sinabatti adu a dillaw ken protesta ti umili
  nga Isabelino daytoy a gandat.Ti pananggatang ti igam ketkangrunaan nga induron
  kenipatungpal ti gubernador tiIsabela a ni Faustino \u201cBodji\u201d Dy III.Ni
  Bodji Dy ti agdama a pannakabagiti dinastiya a Dy a nabayagennga agturturay iti
  probinsya.Ti parbo ni Dy, mausar kanodagiti armas iti \u201cproteksyon\u201ddagiti
  napapateg a pasdek kenahensya iti Isabela. Ngem nousigen a nalaing, ti addang ketpaset
  ti panangtungpal iti planoti rehimen Aquino, panagsaganapara iti masungad nga eleksyon,ken
  panangpatangken iti mananglipita panagari na.Pakaroen na ti panagtiktikken panangranggas.Mayannurot
  iti OplanBayanihan ti agdamaa rehimen Aquino,dagiti armas ketmausar iti pammutbutengken
  panagranggaskadagitiumili a lumablabaniti manangparigat agobyerno. Madlaw amanaynayunan
  ita tipuersa ti pulis kensoldado iti syudadken aw-away\u2014kas tiPolice Auxiliary
  Unitsiti barbaryo, ken PublicOrder and Safety Units(POSU) kadagiti ili. Ti POSU
  ketpuersa kano a pang-trapiko;ngem iti kapadasan, instrumentodaytoy ti dinastiya
  iti mananglipita panagari, kas ti ProvincialSecurity Group ken uray ti SpecialWeapons
  and Tactics (SWAT).Kayatna a sawen, maitutokdagiti armas laban iti lumablabannga
  umili tapno makatuloy dagitiproyekto a manangdadael itikabiagan ken aglawlaw. Kas
  itiganggannaet a panagminas,logging, ken nadumaduma a proyektoa mangag-agum iti
  daga itiIsabela.Dagiti armas ket sigurado amainayon iti napumpunnon ngaarmori ken
  personalnga army ti dinastiyaa Dy. Mausar nadayta itipanagpostura laban kadagitikabusor
  iti pulitika.Lalo a panagrigat dagitiIsabelino. Husto laeng ti kananakemdagiti umili
  a sumupsupyatiti panaggatang ni Dy iti armas.Apay nga adda kuarta ti gobyernopara
  iti bala ken paltog, idinto anasurok sangamilyon a tao timarigrigat iti Isabela?
  Idi maikaduaa lawas ti Nobyembre, immutangda Dy ti dua milyon para kanokadagiti
  \u201cpangpadur-as a proyekto.\u201dKalpasan ti dua lawas, gimmatangda met ti armas
  ngaaggatad tallo milyon!Saplit iti rupa dagiti umilidaytoy nga addang ti dinastiya
  Dy.Kalpasan ti bagyo a Pedring, Quielken ti nepnep ti Disyembre, nagaduti agkasapulan
  ti tulong kumati gobyerno. Adu dagiti nadadaela balbalay, eskuela, rangtay kendadduma
  pay a pasdek. Permi analugi dagiti mannalon a nakalamidad.Adu met dagiti mangmanggeda
  naggapu sadiayMiddle East a napukawan tikabiagan. Nakirang pay dagitiserbisyo iti
  salun-at kenedukasyon itikaaduan a baryoiti probinsya.Sinnuman ngaagusig, nalawag
  asaan nga armas tirumbeng a paggastoanita, nga awanpay ti uray makan tikaaduan.7\\nMangpakaro
  ti krimen kenkontra-rebolusyon. Maysa a pambarni Dy a sungbat daytoy itiumad-adu
  a krimen iti Isabela.Ngem dagiti mapasamak a panagtakaw,holdap, pinnatayan kendadduma
  pay a kapada ketkangrunaan nga idurduron tibuksit a mabisbisinan. Inggana asaan
  a marisut ti kinarigat, ngaisu\u2019t puon ti kriminalidad, agtalinaeda bulok ti
  intero a kagimungan.Ket saan a masolbar daytoyti gobyerno a mangrangranggas.No ti
  rebolusyonaryo atignayan met ti pakausaran dagitinayon nga armas, napaneknekanmetten
  iti pakasaritaan a ti balligiti gubat ket saan nga agbasar itikinaadu laeng ti paltog.
  Ta idurduronpay ngarud ti kinaranggasti gobyerno dagiti adu nga umili itidalan ti
  rebolusyon.Kasapulan a risuten tibasaran a parikut ti umili iti Isabelaken intero
  a pagilian. Maited tikarbengan iti daga, tulong pangkabiagan,serbisyo a pangkagimunganken
  kappia babaen tipanagsardeng dagiti operasyonmilitar. Masapul a bantayan tipudno
  a gandat ti dinastiya Dy, tasaan a rumbeng nga agsubli tipanawen ti Martial Law.
  Kadaydia panawen, napasamak ti adu apanaglabsing iti karbengan tao.Sigurado a dakes
  ti mapasamakno maipaima ti adu a paltogkadagiti puersa a nabartek iti bilegken kuarta.Rumbeng
  met a lagipen ni Dyti adal ti pakasaritaan a naramananenti dinastiya da. Kabaelan
  tiumili a rippuogen ti rinuker kenbulok a panagturay ti sinnomannga agin-aari, uray
  kasano\u2019t kaaduti armas a tengngel na. --B8Dagiti aksyon militarti NPA iti DisyembreDua
  a pulis ken lima a soldado ti natay, ken dua pay a soldado tinasugatan, iti kabuklan
  dagiti taktikal nga opensiba ngainsayangkat ti NPA ditoy rehion iti bulan ti Disyembre.Cagayan.
  Idi Disyembre 13, dinusa dagiti partisano ti Danilo BenCommand (DBC)-NPA ti maysa
  a napeklan a paniktik ti kabusor, niSPO2 Joseph Arcibal, iti sentro ti Piat, Cagayan.
  Ni Arcibal, anakadestino iti Public Safety Company ti Philippine National Police-Piat,
  ket napaneknekan a nagbasol iti panangtiktik kadagitirebolusyonaryo a puersaiti
  nasao nga ili.Sinango dagiti kakaduadagiti nagsuportaa puliskalpasan a natayni Arcibal.
  Maysapay a pulis tinatay.Sakbay tipannusa, idi Disyembre11, pinaputukanti maysaa
  tim ti DBC-NPA tidetatsment ti 77 th Infantry Battalion ken CAFGU sadiay BarangayGagabutan,
  Rizal, Cagayan idi Disyembre 11, 2011. Saan pay a matukoyno mano dagiti natay wenno
  nasugatan a kabusor, idinto nga awannadangran a kakadua.Dawat dagiti masa ti pannakadusa
  kadagiti kabusor. Sumursurotda iti operasyon militar a no sadinno, adu a mannalon
  ti ranggasanken butbutngen da. Manipud nagkampo da iti baryo, naperwisyodagiti tattao
  iti panagputok-putok da iti tengnga ti kabalbalayan,panangipasaknap ti panagbartek,
  panagsugal ken panagtakaw timanok.Isabela. Idi Disyembre 15, inambus ti Reynaldo
  Pinon Command-NPA ti 40-katao a tropa ti 51st Reconnaisance Company iti babaen ti5th
  Infantry Division, 3:30 ti malem sadiay Barangay San Jose, SanMariano, Isabela.
  Nakaro a nasugatan dagiti soldado a da CorporalJoel Ibus ken PFC Joel Arce. Uray
  no inlemmeng dagiti militar ti bilang(maituloy iti panid 8...)\\nMonte Alto, dinusa
  ti BTCGapu iti panaglabsing iti paglintegan ti rebolusyonaryo a gubyerno ti umili
  kanaig ti panagsaluad itikabakiran ken panangbigbig iti karbengan iti daga dagiti
  mannalon, dinusa ti Benito TesorioCommand-NPA ti Monte Alto Timber Resources Corporation
  (MATRC).Pinuoran dagiti kakadua tidua a six-by-six nga trak niBarangay Captain Virgilio
  Lorenzoidi Disyembre 5, 2011, 12:30 ti aldawsadiay Barangay Linumot, Jones,Isabela.
  Dagitoy a trak ket maararamatiti panagbunag ti kayo tiMATRC. Enero 2010 pay a nagtrosoti
  MATRC iti Jones kenEchague iti 8,000 ektarya akonsesyon na.plot na dagitipulitiko
  ken kapitalistaiti Isabelaa kas dagubernadorBodjieDy kenJosephTan, ti kapitalistaa
  makinkukua itiBrostan Construction andDevelopment Company.Inallilaw ti Monte Alto
  tibumaryo babaen iti kari a simpaenda ti kalsada ken maaddaan da titrabaho. Ngem
  iti atiddog a(Dagiti aksyon militar ti NPA...)dagiti nadangran iti benneg da,nakita
  dagiti masa a natay pay tilima a soldado. Tapno kaluban tipannakaabak, nagulbod
  ti 51 st ReconCoy nga awan ti natay, ken takiag ken imalaeng ti sugat dagiti soldado.Dagiti
  nasugatan ket innala dagitihelikopter ti militar, sa da ginuwardiyaanbayat a maag-agasan
  sadiayCauayan Medical Center.Ti 51 st Recon Coy, nga idadauluan da1Lt Caba\u00f1es
  ken 1Lt De Ocampo, ket karamankadagiti tropa ti 5th ID a mangirusrussuat ti combat
  operations.Uray no nagideklara ti sispayr ti rehimen Aquino manipud Disyembre16,
  nagrugi ti search-and-pursuit operations ti 5 th ID iti San Marianokadaydiay nga
  aldaw. Napaneknekan nga ubbaw ken pabanglo laeng tinakuna a sispayr. Innayon pay
  ti 5 th ID a pinasuporta ti maysa a seksyonti 17 th IB a nakadestino iti kaabay
  a probinsya ti Cagayan. --BTi MATRC ket kukua niSammy Ong, maysa a dakkel akapitalista
  a taga-China. Tinawennga agawid isuna\u2019t China tapnoidulin na sadiay ti ganansya
  na.Nasinged a gayyem ken kakumkapadasanda, awan met naipaayna a trabaho wenno nasayaat
  akalsada para kadagiti bumaryo.Kagiddan na, pinawilan ti gobyernoken dagiti kapitalista
  itilogging ti naruay nga umili ngaagtarikayo uray bassit laeng, patipanaguway ken
  panaganupkadagiti saklaw ti konsesyon da.Maipalagip nga iparparit tireaksyunaryo
  a linteg nga agumaken agtroso dagiti umili kadagitiinawagan da a kas \u201creserba
  akabakiran.\u201d Ngem iluklukat met tigobyerno dagitoy iti awan sardaya panagrames
  dagiti kapitalista itilogging babaen ti IntegratedForest Management Agreement(IFMA).
  Iti nalawa a panagtrosodagiti kapitalista, daddadaelen dati kabakiran nga isu\u2019t
  bubon tipagbiagan ken natural a kinabaknang.Kada tawen, 200,000 ektaryati kabakiran
  ti kalkalboen kenburburaken dagiti kompanya itilogging ken panagminas iti sibubukela
  pagilian. --B9\\nTuladen tayo ni Ka EfiNagiggem isuna ti armas agingga\u2019t maudi
  nga anges, tapnomaipagballigi ti gubat ti umili. Pammadayaw ti PartidoKomunista
  ti Pilipinas-Cagayan Valley kenni Kadua nga DanielImperial, mangmangged pangkultura,
  kadre ti PartidoKomunista ken mannakigubat ti NPAAgladladingit ti sibubukel a rebolusyonaryo
  a puersa tirehiyon iti ipupusay ni Daniel \u201cKa Efi\u201d Imperial ken tallopay
  a kakadua kalpasan ti pannakilaban da kadagitiberdugo a puersa ti 17 th IB sadiay
  Barangay San Miguel,Baggao, Cagayan idi Oktubre 26, 2011. Padayawan tayo ni KaEfi\u2014nalaing
  a kabataan a kadre, opisyal ti hukbo ti umili,patpatgen a gayyem ken kadua ti masa
  a mannalon.Nayanak isuna sadiay adayoa lugar ti Tabaco, Albay, Bicol idiAgosto 23,
  1982, iti maysa anagtengnga a petiburges a pamilyanga pasig a nagtignay itirebolusyon.
  Nagadal ti kolehiyo itiUniversity of the Philippines-College of Music. Pagay-ayat
  na timusika, istorya ken lakwatsa idi,kas ti gagangay nga estudyante.Nagbalin nga
  aktibista ket kimmuyogiti nalawa a tignayantapno mapadisi ti bulok a rehimenEstrada.
  Inadal na ti kasasaad tinalawa nga umili, nakipagmartsaiti kalsada, nakipagbiag
  kadagitimarigrigat. In-inut a nagbalin a dikadawyana tao ti dati a gagangaya petiburges.Idi
  2002, nagdesisyonngarud ni Ka Efi a rummuar itieskuelaan tapno mapan iti kaawawayan.Tinallikudan
  na ti edukasyoniti unibersidad tapno makapagadalti nangatngato a kaamuan,\u2018tay
  kaamuan a maadawmanipud iti pannakipagbiag itimasa a mannalon kas hukbo timannalon.10Damo
  a nagtignayiti kabukbukel idi aplatun ti Reynaldo PinonCommand-NPA sadiay Tengnganga
  Isabela. Inawagan ti masaidiay kas Ka Emil ken Ka Dione.Immakem kas Cultural Officer,
  S4,ED Officer ken kagawad tiRegional Propaganda-CulturalBureau iti nagduduma a panawen.Nalaing
  nga agkansyon ni KaEfi; maysan kadagiti kalaingan asinger-kompositor iti rehion
  tayo.Nalaka kuma ti agambisyon abumaknang ken lumatak ti maysaa kas kenkuana. Ngem
  rebolusyonaryonga artista ni Ka Efi\u2014inusar na ti talento na tapnokansyonen
