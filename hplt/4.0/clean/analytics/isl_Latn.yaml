  \u00ed Stangarhyl 4 kl. 16-17 \u00ed dag.\\nHugmyndin a\u00f0 fundinum er a\u00f0allega
  s\u00fa a\u00f0 efna til umr\u00e6\u00f0u og sko\u00f0a \u00fdmsa fleti \u00e1 m\u00e1lum
