  og pr\u00e9dikar. F\u00e9lagar \u00far k\u00f3r \u00c1rb\u00e6jarkirkju lei\u00f0a
  s\u00f6ng og organisti er Gu\u00f0mundur \u00d3mar \u00d3skarsson. Kaffi og me\u00f0l\u00e6ti
  eftir stundina.\\nSameiginleg \u00fatigu\u00f0s\u00fej\u00f3nusta \u00c1rb\u00e6jar-,
