  a\u00f0 helstu atvinnuvegunum enda \u00feeir hreyfiafli\u00f0.\\nMatv\u00e6lar\u00e1\u00f0herrasettin\u00fdlegafram
  s\u00fdn \u00e1 matv\u00e6laframlei\u00f0slu \u00e1ri\u00f0 2040 og \u00fear segir
  \u00ed fj\u00f3r\u00f0a li\u00f0:\\n\u201eMatv\u00e6laframlei\u00f0sla er kol efnishlutlaus
