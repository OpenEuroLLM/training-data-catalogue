  \u00e1n hl\u00edf\u00f0arb\u00fana\u00f0ar\\n- Tveir f\u00e1 14 millj\u00f3nir kr\u00f3na\\n-
  Leita fer\u00f0asj\u00f3\u00f0s fj\u00f6lskyldunnar\\n- Fali\u00f0 vald yfir \u00edslenskum
  m\u00e1lum\\n- M\u00e1lmveski gera ekkert gagn\\n- \u201e\u00deetta er kl\u00e1rlega
  margfalt brot\u201c\\n- Fj\u00f6gurra \u00e1ra fangelsi fyrir nau\u00f0gun\"", "\"Ver\u00f0br\u00e9fafyrirt\u00e6ki\u00f0
  einkennist af hlutverki s\u00ednu sem millili\u00f0ur. Millili\u00f0ur \u00e1 milli
  seljenda og kaupenda \u00e1 fj\u00e1rm\u00e1lam\u00f6rku\u00f0um. L\u00f6gleg framkv\u00e6md
  starfsemi \u00feess er h\u00e1\u00f0 sam\u00feykki fr\u00e1 var\u00fa\u00f0areftirliti
  og skilavaldi. \u00cd Frakklandi eru fr\u00f6nsk samt\u00f6k fj\u00e1rm\u00e1lamarka\u00f0a
  (AMF) fyrir \u00feessa heimild. \u00cd \u00feessari grein segjum vi\u00f0 \u00fe\u00e9r
  allt sem \u00fe\u00fa \u00fearft a\u00f0 vita um ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6ki.\\nSkilgreining
  og einkenni ver\u00f0br\u00e9fafyrirt\u00e6kis\\nVi\u00f0 getum ekki tala\u00f0
  um ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6ki \u00e1n \u00feess a\u00f0 v\u00edsa
  til hlutabr\u00e9famarka\u00f0arins sj\u00e1lfs. Larousse or\u00f0ab\u00f3kin skilgreinir
  kauph\u00f6llina sem sta\u00f0ur, opinber bygging \u00fear sem kaupmenn, mi\u00f0larar,
  rekstrara\u00f0ilar mi\u00f0larafyrirt\u00e6kja hittast til a\u00f0 stunda vi\u00f0skipti
  s\u00edn. \u00deetta f\u00f3lk stundar vi\u00f0skipti e\u00f0a fj\u00e1rm\u00e1lavi\u00f0skipti.
  \u00cd efnahagslegum og fj\u00e1rhagslegum skilningi er hlutabr\u00e9famarka\u00f0urinn
  opinber e\u00f0a sj\u00e1lfseignarstofnun sem gerir kleift a\u00f0 uppg\u00f6tva
  og birta ver\u00f0 sta\u00f0la\u00f0ra eigna.\\n\u00dea\u00f0 gerir einnig m\u00f6gulegt
  a\u00f0 grei\u00f0a fyrir skiptum vi\u00f0 fulln\u00e6gjandi \u00f6ryggi fyrir kaupanda
  og seljanda. Ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6ki tilnefnir \u00fev\u00ed
  fyrirt\u00e6ki sem hefur heimild til a\u00f0 starfa \u00e1 fj\u00e1rm\u00e1lam\u00f6rku\u00f0um
  fyrir h\u00f6nd vi\u00f0skiptavina sinna. \u00deessar a\u00f0ger\u00f0ir eru ger\u00f0ar
  me\u00f0 sendingu pantana. \u00dea\u00f0 getur einnig veitt mikla vir\u00f0isaukandi
  \u00fej\u00f3nustu.\\nHver er tilgangur ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6kis?\\nLa
  Bourse er marka\u00f0ur sem tengir umbo\u00f0smenn sem \u00feurfa fj\u00e1rm\u00f6gnun
  vi\u00f0 umbo\u00f0sa\u00f0ila sem hafa \u00feessa fj\u00e1rm\u00f6gnunargetu. Fj\u00e1rm\u00f6gnunartilbo\u00f0i\u00f0
  kemur fr\u00e1 fyrirt\u00e6kjum e\u00f0a r\u00edkjum sem \u00feurfa \u00e1 \u00fev\u00ed
  a\u00f0 halda. Til a\u00f0 gera \u00feetta gefa \u00feeir \u00fat fj\u00e1rm\u00e1laver\u00f0br\u00e9f
  sem fj\u00e1rfestar kaupa. Hva\u00f0 eftirspurnina var\u00f0ar kemur h\u00fan fr\u00e1
  f\u00f3lki sem hefur fj\u00e1rm\u00f6gnunargetu og vill fj\u00e1rfesta. \u00deetta
  f\u00f3lk getur veri\u00f0 einstaklingar, fyrirt\u00e6ki e\u00f0a r\u00edki. Almennt
  s\u00e9\u00f0 eru \u00feeir sem hafa mestan fj\u00e1rfestingarvald \u00e1 fj\u00e1rm\u00e1lam\u00f6rku\u00f0um
  fagfj\u00e1rfestar. Me\u00f0 \u00f6\u00f0rum or\u00f0um, bankar, tryggingaf\u00e9l\u00f6g,
  fj\u00e1rfestingarsj\u00f3\u00f0ir, l\u00edfeyrissj\u00f3\u00f0ir.\\nA\u00f0ger\u00f0ir
  sem framkv\u00e6mdar eru til a\u00f0 fj\u00e1rfesta fyrirt\u00e6ki \u00feitt \u00ed
  kauph\u00f6llinni\\nLeyfi\u00f0 sem \u00fear til b\u00e6r stofnun gefur \u00fat
  gerir ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6kjum kleift a\u00f0 sinna eftirfarandi
  starfsemi:\\n- M\u00f3ttaka og sendingu pantana fyrir h\u00f6nd \u00feri\u00f0ja
  a\u00f0ila;\\n- Framkv\u00e6md fyrirm\u00e6la fyrir h\u00f6nd \u00feri\u00f0ja a\u00f0ila;\\n-
  Vi\u00f0skipti fyrir eigin reikning;\\n- eignasafnsstj\u00f3rnun fyrir h\u00f6nd
  \u00feri\u00f0ja a\u00f0ila;\\n- Fj\u00e1rfestingarr\u00e1\u00f0gj\u00f6f;\\n- St\u00f6\u00f0ugt
  grip;\\n- \u00d3\u00e1byrg\u00f0 fj\u00e1rfesting;\\n- \u00c1byrg\u00f0 sta\u00f0setning;\\n-
  R\u00edkisstj\u00f3rn marghli\u00f0a vi\u00f0skiptakerfis.\\nSannpr\u00f3funara\u00f0ger\u00f0ir
  fyrir \u00fatg\u00e1fu sam\u00feykkis \u00ed\\n\u00c1\u00f0ur en \u00feetta leyfi
  er gefi\u00f0 \u00fat, framkv\u00e6mir var\u00fa\u00f0areftirlits- og skilavaldi\u00f0
  eftirfarandi a\u00f0ger\u00f0ir til sannpr\u00f3funar:\\n- Gakktu \u00far skugga
  um a\u00f0 skr\u00e1\u00f0 skrifstofa og stj\u00f3rnendur vi\u00f0komandi ver\u00f0br\u00e9fafyrirt\u00e6kis
  s\u00e9u me\u00f0 l\u00f6gheimili \u00e1 yfirr\u00e1\u00f0asv\u00e6\u00f0inu;\\n-
  Gakktu \u00far skugga um a\u00f0 varanlegt stofnf\u00e9 s\u00e9 n\u00e6gilegt og
  a\u00f0 fj\u00e1rmagn s\u00e9 a\u00f0laga\u00f0 fyrirhuga\u00f0ri starfsemi;\\n-
  Sta\u00f0festu au\u00f0kenni og g\u00e6\u00f0i beinna og \u00f3beinna hluthafa,
  svo og magn \u00fe\u00e1ttt\u00f6ku \u00feeirra;\\n- Athuga\u00f0u a\u00f0 skilvirk
  stj\u00f3rnun starfseminnar s\u00e9 trygg\u00f0 af a\u00f0 minnsta kosti tveimur
  a\u00f0ilum. \u00deekking \u00feeirra, reynsla og f\u00e6rni \u00fearf a\u00f0 koma
  \u00e1 framf\u00e6ri hver fyrir sig og sameiginlega sem og frambo\u00f0 \u00feeirra.
  Ennfremur tryggir \u00fea\u00f0 a\u00f0 \u00feetta f\u00f3lk hafi \u00fea\u00f0
  or\u00f0spor sem nau\u00f0synlegt er fyrir starfsemi s\u00edna;\\n- Kanna hvort
  yfirmenn lykilstarfssvi\u00f0a standist kr\u00f6fur um g\u00f3\u00f0an or\u00f0st\u00edr,
  \u00feekkingu, reynslu og f\u00e6rni;\\n\u00deessi stofnun tekur einnig tillit til
  hlutverka Trygginga- og samtryggingaeftirlitsins e\u00f0a ACAM.\\nAf hverju a\u00f0
  setja fyrirt\u00e6ki \u00feitt e\u00f0a n\u00fdtt fyrirt\u00e6ki \u00e1 kauph\u00f6llina?\\nTilgangur
  ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6kis er a\u00f0 framlei\u00f0a h\u00e1markstekjur
  af fj\u00e1rmagni me\u00f0 \u00fev\u00ed a\u00f0 nota stefnu sem gerir minnstu \u00e1reynslu
  og minnstu \u00e1h\u00e6ttu. Allt \u00feetta \u00e1 me\u00f0an \u00fe\u00fa dreifir
  eignasafninu \u00fe\u00ednu. Til \u00feess hefur veri\u00f0 sett upp dagskr\u00e1
  fyrirt\u00e6kja. \u00dea\u00f0 er dagatal fyrir fj\u00e1rfesta sem undirstrikar
  alla \u00fe\u00e1 \u00fe\u00e6tti sem b\u00faist er vi\u00f0 hj\u00e1 fyrirt\u00e6kjum
  sem skr\u00e1\u00f0 eru \u00ed kauph\u00f6ll. \u00deetta sn\u00fdst me\u00f0 \u00f6\u00f0rum
  or\u00f0um um a\u00f0 tryggja a\u00f0 fj\u00e1rfestar s\u00e9u uppl\u00fdstir um
  hreyfingar fyrirt\u00e6kja sem koma inn \u00e1 hlutabr\u00e9famarka\u00f0inn.\\nHvernig
  fer fyrirt\u00e6ki \u00e1 marka\u00f0?\\nIPO er fj\u00e1rhagsleg vi\u00f0skipti
  sem felast \u00ed \u00fev\u00ed a\u00f0 setja ver\u00f0br\u00e9f fyrirt\u00e6kja
  til s\u00f6lu \u00e1 hlutabr\u00e9famarka\u00f0i. Fj\u00e1rhagslegt ver\u00f0br\u00e9f
  er skilgreint sem ver\u00f0br\u00e9f sem h\u00e6gt er a\u00f0 skipta um \u00e1 fj\u00e1rm\u00e1lam\u00f6rku\u00f0um.
  \u00dea\u00f0 veitir handhafa s\u00ednum r\u00e9tt \u00e1 framt\u00ed\u00f0arfj\u00e1rstreymi.
  \u00dea\u00f0 getur veri\u00f0 skuldatrygging sem getur veri\u00f0 ve\u00f0skuld
  e\u00f0a skuldir tengdar eiginfj\u00e1rhlutum eins og skuldabr\u00e9f e\u00f0a hlut.\\nHlutur
  fyrir sitt leyti er fj\u00e1rhagslegt \u00f6ryggi sem er hluti af st\u00f6\u00f0ugu
  hlutaf\u00e9 \u00feess f\u00e9lags sem gaf \u00fea\u00f0 \u00fat. \u00deegar \u00fe\u00fa
  kaupir \u00fea\u00f0 ver\u00f0ur \u00fe\u00fa hluthafi og \u00fear af lei\u00f0andi
  eigandi fyrirt\u00e6kisins allt a\u00f0 \u00feeim fj\u00f6lda hluta sem \u00fe\u00fa
  hefur keypt. Skuldabr\u00e9f er hluti af l\u00e1ni sem gefi\u00f0 er \u00fat af
  fyrirt\u00e6ki, opinberri stofnun e\u00f0a af r\u00edkinu. Me\u00f0 \u00fev\u00ed
  a\u00f0 fj\u00e1rfesta \u00ed skuldabr\u00e9funum veitir kaupandi f\u00e9laginu
  l\u00e1n og gerist s\u00ed\u00f0an kr\u00f6fuhafi \u00e1 \u00fea\u00f0. \u00cd skiptum
  fyrir \u00feetta l\u00e1n f\u00e6r kaupandinn reglulega vexti, einnig kalla\u00f0ir
  \u201eafsl\u00e1ttarmi\u00f0i\u201c.\\nReglur um vir\u00f0ingu fyrir fyrirt\u00e6ki
  sem kemur inn \u00ed kauph\u00f6llina\\nFyrirt\u00e6ki sem vilja fara \u00e1 marka\u00f0
  til a\u00f0 fj\u00e1rmagna v\u00f6xt sinn ver\u00f0a a\u00f0 fylgja str\u00f6ngum
  reglum. \u00dear \u00e1 me\u00f0al eru:\\n- Settu fram \u00fdmsa \u00e1rsreikninga
  s\u00edna \u00ed fullkomnu gagns\u00e6i;\\n- \u00dathluta l\u00e1gmarkskv\u00f3ta
  ver\u00f0br\u00e9fa til hvers fj\u00e1rfestis;\\n- Veittu hlutaf\u00e9 til einkafj\u00e1rfesta
  (ekki atvinnumanna) allt a\u00f0 10%. Og aftur, \u00feetta hlutfall er mismunandi
  eftir markmarka\u00f0inum;\\n- Settu fyrsta ver\u00f0 \u00feess undir \u00e1kve\u00f0nu
  hlutfalli af l\u00e1gmarkskaupver\u00f0i.\\nEftir \u00feessum reglum b\u00e6tast
  a\u00f0rir vi\u00f0 eftir \u00fev\u00ed hva\u00f0a hlutabr\u00e9famarka\u00f0i er
  um a\u00f0 r\u00e6\u00f0a. \u00deetta er:\\n- Eurolist: a\u00f0almarka\u00f0ur \u00ed
  Evr\u00f3pu;\\n- Euronext Growth: hentugra fyrir \u00f6rt vaxandi l\u00edtil og
  me\u00f0alst\u00f3r fyrirt\u00e6ki;\\n- Euronext Access: valinn hlutabr\u00e9famarka\u00f0ur
  fyrir ung fyrirt\u00e6ki me\u00f0 mikla m\u00f6guleika.\\nSumar IPO-a\u00f0fer\u00f0ir\\nA\u00f0
  lokinni sannpr\u00f3fun \u00e1 \u00fev\u00ed a\u00f0 fari\u00f0 s\u00e9 a\u00f0
  \u00f6llum reglunum sem kve\u00f0i\u00f0 er \u00e1 um af samt\u00f6kum franskra
  fj\u00e1rm\u00e1lamarka\u00f0a eru IPO-heimildir fyrir ums\u00e6kjandafyrirt\u00e6ki\u00f0
  gefnar \u00fat. S\u00ed\u00f0an er \u00fea\u00f0 millili\u00f0ur sem kallast skr\u00e1ningarstyrktara\u00f0ili
  sem stj\u00f3rnar \u00fatbo\u00f0inu fyrir fyrirt\u00e6ki\u00f0 og skilgreinir ver\u00f0
  \u00feess samkv\u00e6mt nokkrum m\u00f6gulegum a\u00f0fer\u00f0um. Sum st\u00f3r
  fyrirt\u00e6ki setja samkeppnisbann \u00ed samninga starfsmanna sinna til a\u00f0
  verjast \u00feeim \u00ed framt\u00ed\u00f0inni.\\nOpi\u00f0 ver\u00f0tilbo\u00f0
  (OPO)\\n\u00deessi a\u00f0fer\u00f0 er oftast notu\u00f0. H\u00e9r \u00fearf \u00fea\u00f0
  fyrirt\u00e6ki sem vill fara \u00e1 marka\u00f0inn millig\u00f6ngua\u00f0ila. \u00deetta
  er fj\u00e1rm\u00e1lastofnun sem myndar sj\u00e1lft \u201ebankasamband\u201c. Allir
  f\u00e9lagsmenn \u00e1byrgjast hver fyrir sig a\u00f0 tilteki\u00f0 magn hlutabr\u00e9fa
  s\u00e9 sett hj\u00e1 starfsst\u00f6\u00f0vum. \u00deeir safna sparna\u00f0inum
  til a\u00f0 koma \u00feeim \u00e1 fj\u00e1rm\u00e1lamarka\u00f0i. \u00deessar starfsst\u00f6\u00f0var
  eru kalla\u00f0ar fagfj\u00e1rfestar. Ver\u00f0i\u00f0 sem h\u00e9r er sett fer
  eftir eftirspurn. \u00deessi IPO a\u00f0fer\u00f0 er mj\u00f6g oft \u00e1samt svok\u00f6llu\u00f0u
  \u201etrygg\u00f0ri fj\u00e1rfestingu\u201c tilbo\u00f0i.\\nFast ver\u00f0tilbo\u00f0
  (OPF)\\n\u00deegar um er a\u00f0 r\u00e6\u00f0a \u00feessa m\u00e1lsme\u00f0fer\u00f0
  er \u00fea\u00f0 fj\u00e1rm\u00e1lastofnunin sem setur, \u00ed samkomulagi vi\u00f0
  f\u00e9lagi\u00f0, ver\u00f0 hlutarins fyrir \u00fatbo\u00f0i\u00f0. Hver p\u00f6ntun
  h\u00e9r hefur sama ver\u00f0. Og magn hlutabr\u00e9fa sem \u00e1 a\u00f0 gefa \u00fat
  fer eftir frambo\u00f0i og eftirspurn. \u00dea\u00f0 er a\u00f0 segja magn pantana
  sem berast fr\u00e1 tvenns konar fj\u00e1rfestum: einstaklingum og fagfj\u00e1rfestum.\\nL\u00e1gmarksver\u00f0stilbo\u00f0
  (OPM)\\n\u00deessi IPO a\u00f0fer\u00f0 er svipu\u00f0 uppbo\u00f0i. H\u00e9r er
  a\u00f0eins teki\u00f0 vi\u00f0 einum p\u00f6ntunarflokki fyrir h\u00e1marksver\u00f0
  og l\u00e1gmarksver\u00f0. Og upph\u00e6\u00f0in er mismunandi eftir fj\u00f6lda
  pantana sem berast.\\nBein tilvitnun\\n\u00deessi a\u00f0fer\u00f0 er sjaldan notu\u00f0,
  vegna \u00feess a\u00f0 \u00fea\u00f0 krefst \u00feess a\u00f0 setja fj\u00f6lda
  \u00fatgefinna ver\u00f0br\u00e9fa og l\u00e1gmarksver\u00f0 fyrirfram.\\nS\u00e9rst\u00f6k
  skilyr\u00f0i fyrir inng\u00f6ngu \u00ed kauph\u00f6llina fer eftir markmarka\u00f0inum\\n-
  Fyrirt\u00e6ki sem koma inn \u00e1 hlutabr\u00e9famarka\u00f0inn ver\u00f0a a\u00f0
  fylgja str\u00f6ngum reglum. Hins vegar getur \u00fea\u00f0 veri\u00f0 mismunandi
  eftir markmarka\u00f0i.\\n- Fyrir fyrirt\u00e6ki sem mi\u00f0a vi\u00f0 Eurolist
  ver\u00f0a \u00feau a\u00f0 hafa framleitt samst\u00e6\u00f0ureikninga. \u00deetta
  me\u00f0 l\u00f6ggildingu endursko\u00f0anda \u00ed a\u00f0 l\u00e1gmarki 3 \u00e1r
  fyrir bei\u00f0ni.\\n- Fyrirt\u00e6ki sem vilja skr\u00e1 sig \u00e1 Euronext Growth
  ver\u00f0a a\u00f0 fylgja reikningsskilaskyldum sem Kauphallarnefndin (COB) setur.
  Auk \u00feess mega \u00feeir ekki innihalda sam\u00feykkis\u00e1kv\u00e6\u00f0i
  \u00ed rekstri s\u00ednum.\\n- Fyrir fyrirt\u00e6ki sem vilja vera skr\u00e1\u00f0
  \u00e1 Euronext Access ver\u00f0a \u00feau a\u00f0 eiga eigi\u00f0 f\u00e9 a\u00f0
  minnsta kosti 1,5 millj\u00f3n evra. A\u00f0 auki ver\u00f0a \u00feeir a\u00f0 gefa
  \u00fat a\u00f0 minnsta kosti 10.000 hluti sem eru a\u00f0 l\u00e1gmarki 20% af
  hlutaf\u00e9nu e\u00f0a 5 millj\u00f3nir evra fyrir a\u00f0 minnsta kosti 50% hlutafj\u00e1raukningu.
  \u00dear a\u00f0 auki mi\u00f0a \u00feessar a\u00f0st\u00e6\u00f0ur a\u00f0 \u00f6ryggi
  fj\u00e1rfesta andsp\u00e6nis ungum fyrirt\u00e6kjum.\\n- R\u00e9tt er a\u00f0 taka
  fram a\u00f0 \u00fea\u00f0 er hinn markver\u00f0i hlutabr\u00e9famarka\u00f0ur sem
  \u00e1kve\u00f0ur hvort taka skuli vi\u00f0 IPO ums\u00f3kn f\u00e9lagsins. Auglj\u00f3slega
  eftir eftirlit og leyfi fr\u00f6nsku samtaka fj\u00e1rm\u00e1lamarka\u00f0a. \u00deetta
  \u00fe\u00fd\u00f0ir a\u00f0 eftirlit og heimild AMF veitir k\u00e6randa ekki sj\u00e1lfvirkan
  r\u00e9tt til a\u00f0gangs a\u00f0 hlutabr\u00e9famarka\u00f0i.\\nAf hverju a\u00f0
  skr\u00e1 fyrirt\u00e6ki \u00e1 Ver\u00f0br\u00e9fa\u00feingi?\\n- Fyrir fyrirt\u00e6ki\u00f0
  gerir IPO \u00fea\u00f0 m\u00f6gulegt a\u00f0 hagr\u00e6\u00f0a efnahagsl\u00edkani
  \u00feess me\u00f0 \u00fev\u00ed a\u00f0 for\u00f0ast l\u00e1n sem g\u00e6ti veri\u00f0
  verulegt. \u00dea\u00f0 er l\u00edka lei\u00f0 til a\u00f0 finna fj\u00e1rm\u00f6gnun
  og f\u00e1 st\u00f6\u00f0ugt rei\u00f0uf\u00e9 fr\u00e1 \u00fdmsum a\u00f0ilum.
  \u00deessar tekjulindir \u00ed pers\u00f3nu fj\u00e1rfesta leyfa ekki a\u00f0eins
  v\u00f6xt fyrirt\u00e6kisins heldur stu\u00f0la einnig a\u00f0 opnun n\u00fdrra
  skrifstofur.\\n- \u00deessir tekjustofnar gera fyrirt\u00e6kinu einnig kleift a\u00f0
  fj\u00e1rmagna \u00fer\u00f3unarstefnu s\u00edna og takast \u00e1 vi\u00f0 \u00e1skoranir
  \u00feess. Auk \u00feess hefur f\u00e9lag skr\u00e1\u00f0 \u00ed kauph\u00f6ll meiri
  tr\u00faver\u00f0ugleika mi\u00f0a\u00f0 vi\u00f0 \u00f3skr\u00e1\u00f0a samkeppni.
  Hins vegar er skr\u00e1ning \u00e1 hlutabr\u00e9famarka\u00f0i ekki \u00e1h\u00e6ttulaus
  og fer einnig eftir stundum \u00f3fyrirsj\u00e1anlegum ver\u00f0sveiflum.\\nHvernig
  \u00e1 a\u00f0 taka \u00fe\u00e1tt \u00ed IPO og kaupa hlutabr\u00e9f?\\nFrambo\u00f0
  og eftirspurn m\u00e6tast \u00e1 hlutabr\u00e9famarka\u00f0i. \u00dea\u00f0 er sta\u00f0urinn
  \u00fear sem fj\u00e1rfestar kaupa og selja hlutabr\u00e9f og skuldabr\u00e9f sem
  eru \u00ed almennum vi\u00f0skiptum. Ver\u00f0br\u00e9f hafa einkunn sem skilgreinir
  s\u00f6luver\u00f0 \u00feeirra og kaupver\u00f0. \u00deannig a\u00f0 kaup e\u00f0a
  sala hlutabr\u00e9fa og skuldabr\u00e9fa \u00e1 hlutabr\u00e9famarka\u00f0i krefst
  \u00feess a\u00f0 b\u00e6\u00f0i fj\u00e1rfestir og seljandi gefi p\u00f6ntun.\\nHi\u00f0
  s\u00ed\u00f0arnefnda inniheldur uppl\u00fdsingar eins og e\u00f0li vi\u00f0skiptanna
  (sala e\u00f0a kaup), magn hlutabr\u00e9fa e\u00f0a skuldabr\u00e9fa sem vi\u00f0skiptin
  eiga vi\u00f0 sem og frestinn sem p\u00f6ntunin ver\u00f0ur a\u00f0 berast. \u00deegar
  fj\u00e1rhagslegt ver\u00f0br\u00e9f kemur inn \u00e1 hlutabr\u00e9famarka\u00f0inn
  er \u00fev\u00ed \u00fathluta\u00f0 marka\u00f0svir\u00f0i. \u00deetta gildi er
  stillt \u00ed samr\u00e6mi vi\u00f0 sambandi\u00f0 milli frambo\u00f0s og eftirspurnar.
  \u00deetta \u00fe\u00fd\u00f0ir a\u00f0 \u00e1 tilteknu augnabliki mun \u00fea\u00f0
  jafngilda \u00fev\u00ed ver\u00f0i sem h\u00e6gt er a\u00f0 skipta mestum fj\u00f6lda
  ver\u00f0br\u00e9fa \u00e1.\\nHlutverk styrktara\u00f0ila skr\u00e1ningar og lokastig
  skr\u00e1ningar\\n\u00deessi millili\u00f0ur er kalla\u00f0ur \u201eskr\u00e1ningarstyrktara\u00f0ili\u201c,
  \u00fea\u00f0 er a\u00f0 segja fj\u00e1rfestingar\u00fej\u00f3nustua\u00f0ili. N\u00e1nar
  tilteki\u00f0 er \u00e1byrg\u00f0ara\u00f0ili skr\u00e1ningar \u00e1byrgur fyrir
  \u00fev\u00ed a\u00f0 setja hlutabr\u00e9fin \u00e1 s\u00f6lu og endursko\u00f0a
  samninga me\u00f0 a\u00f0sto\u00f0 s\u00e9rh\u00e6f\u00f0ra l\u00f6gfr\u00e6\u00f0inga.
  A\u00f0 virkja b\u00f3khaldsfr\u00e6\u00f0inga sem bera \u00e1byrg\u00f0 \u00e1
  \u00fev\u00ed a\u00f0 fari\u00f0 s\u00e9 a\u00f0 reglum (samst\u00e6\u00f0ureikningum,
  vottor\u00f0um osfrv.). Lokaskrefi\u00f0 ver\u00f0ur a\u00f0 velja IPO m\u00e1lsme\u00f0fer\u00f0ina.
  \u00dea\u00f0 eru nokkrar a\u00f0fer\u00f0ir: opi\u00f0 ver\u00f0tilbo\u00f0, fast
  ver\u00f0tilbo\u00f0, l\u00e1gmarksver\u00f0tilbo\u00f0 og bein ver\u00f0tilbo\u00f0.\\nGj\u00f6ld
  sem tengjast hlutafj\u00e1r\u00fatbo\u00f0i fyrirt\u00e6kis sem ver\u00f0ur opinbert\\n-
  Kostna\u00f0ur vi\u00f0 IPO er mismunandi eftir nokkrum forsendum. Me\u00f0al \u00feessara
  vi\u00f0mi\u00f0a h\u00f6fum vi\u00f0: eiginleika starfseminnar, marka\u00f0inn
  sem fyrirt\u00e6ki\u00f0 vill fara inn \u00e1, fj\u00f6lda millili\u00f0a sem taka
  \u00fe\u00e1tt \u00ed innlei\u00f0ingunni (fj\u00e1rm\u00e1lastofnanir, b\u00f3khaldsgj\u00f6ld,
  endursko\u00f0endur, l\u00f6gfr\u00e6\u00f0ingar, fj\u00e1rm\u00e1lar\u00e1\u00f0gjafar
  ...).\\n- Athuga\u00f0u einnig \u00fe\u00f3knun sem tengist IPO sem \u00e6tti ekki
  a\u00f0 vanr\u00e6kja. Auk \u00fe\u00f3knunar millili\u00f0a \u00fearf a\u00f0 taka
  tillit til nokkurra \u00fe\u00f3knunar: \u00fe\u00f3knun fj\u00e1rfestinga\u00fej\u00f3nustuveitanda
  (PSI) er 1.5 til 3% af rekstrinum. \u00de\u00f3knun \u201eskr\u00e1ningarstyrktara\u00f0ila\u201c
  sem er um \u00fea\u00f0 bil 2% af upph\u00e6\u00f0inni sem safna\u00f0 var, auk
  \u00e1skriftar upp \u00e1 nokkra tugi \u00fe\u00fasunda evra \u00e1 \u00e1ri.\\n-
  Annan IPO kostna\u00f0 ver\u00f0ur a\u00f0 taka s\u00e9rstaklega tillit til af fyrirt\u00e6kinu:
  breytingar \u00e1 lagalegri sam\u00fej\u00f6ppun eins og endursko\u00f0un samninga,
  breyting \u00e1 st\u00f6\u00f0u ef nau\u00f0syn krefur, l\u00f6gfr\u00e6\u00f0ilegar
  \u00fattektir (\u00e1 milli 50.000 og 200.000 evrur), \u00fe\u00f3knun til AMF (a\u00f0
  fr\u00e1dregnu en 5.000 evrur). \u00dea\u00f0 er einnig samskipti fj\u00e1rhagslegra
  \u00fe\u00e1tta fyrirt\u00e6kisins (meginreglan um gagns\u00e6i) sem getur veri\u00f0
  \u00e1 bilinu 50.000 til 150.000 evrur.\\nNi\u00f0ursta\u00f0a\\nA\u00f0 lokum er
  ver\u00f0br\u00e9fami\u00f0lunarfyrirt\u00e6ki fj\u00e1rfestingarf\u00e9lag me\u00f0
  sam\u00feykki AMF til a\u00f0 dreifa \u00fdmsum fj\u00e1rm\u00e1la\u00fej\u00f3nustu.
  \u00datbo\u00f0 \u00feessa fyrirt\u00e6kis er fj\u00e1rm\u00e1lastarfsemi, vegna
  \u00feess a\u00f0 h\u00fan felst \u00ed s\u00f6lu \u00e1 hlutabr\u00e9fum \u00feess
  e\u00f0a hlutabr\u00e9fum \u00e1 hlutabr\u00e9famarka\u00f0i. Vi\u00f0 t\u00f6lum
  \u00fe\u00e1 um ver\u00f0 \u00e1 hlutabr\u00e9famarka\u00f0i. \u00deetta mi\u00f0ar
  a\u00f0 \u00fev\u00ed a\u00f0 eigna marka\u00f0svir\u00f0i til ver\u00f0br\u00e9fs
  sem gefi\u00f0 er \u00fat af fyrirt\u00e6ki. Til a\u00f0 n\u00e1 \u00feessu fram
  \u00fearf \u00fatgefandi fyrirt\u00e6ki a\u00f0 uppfylla \u00e1kve\u00f0nar skyldur
  og veita b\u00f3khaldsuppl\u00fdsingar er var\u00f0a vi\u00f0skipti \u00feess.\\nMe\u00f0
  \u00fev\u00ed a\u00f0 vera skr\u00e1\u00f0 \u00ed kauph\u00f6ll hefur fyrirt\u00e6ki
  a\u00f0gang a\u00f0 eigin fj\u00e1rmagnsmarka\u00f0i til a\u00f0 afla fj\u00e1r
  og fj\u00e1rmagna \u00feannig \u00fer\u00f3un s\u00edna. Til a\u00f0 fara \u00e1
  marka\u00f0 \u00fearf fyrirt\u00e6ki a\u00f0 \u00e1kve\u00f0a \u00fearfir s\u00ednar
  og \u00e1kve\u00f0a hversu miki\u00f0 \u00fea\u00f0 vill afla fj\u00e1r \u00e1 fj\u00e1rm\u00e1lam\u00f6rku\u00f0um.
  \u00deessi opnun fj\u00e1rmagns fyrir almenningi og fyrir fj\u00f6lm\u00f6rgum m\u00f6gulegum
  fj\u00e1rfestum (starfsm\u00f6nnum, einstaklingum, stofnunum) er s\u00e9rstaklega
  l\u00f6ng og fl\u00f3kin a\u00f0ger\u00f0 \u00ed framkv\u00e6md. \u00deess vegna
  geta a\u00f0eins fyrirt\u00e6ki sem skapa n\u00e6gilega umtalsver\u00f0a veltu krafist
  \u00feess.\\nHvernig \u00e1 a\u00f0 fj\u00e1rfesta \u00e1 hlutabr\u00e9famarka\u00f0i?\\nFj\u00e1rfesting
  \u00e1 hlutabr\u00e9famarka\u00f0i er a\u00f0 kaupa e\u00f0a selja ver\u00f0br\u00e9f
  \u00e1 hlutabr\u00e9famarka\u00f0i. Oftast ver\u00f0a \u00fea\u00f0 hlutabr\u00e9f
  fyrirt\u00e6kja, \u00fea\u00f0 er hlutabr\u00e9f skr\u00e1\u00f0ra fyrirt\u00e6kja
  \u00ed kauph\u00f6ll. \u00deessi ver\u00f0br\u00e9f eru keypt \u00fdmist \u00e1
  a\u00f0almarka\u00f0i e\u00f0a eftirmarka\u00f0i.\\nHva\u00f0 er opinbert fyrirt\u00e6ki?\\n\u00dea\u00f0
  er fyrirt\u00e6ki sem setur sig \u00e1 hlutabr\u00e9famarka\u00f0 til a\u00f0 selja
  ver\u00f0br\u00e9f s\u00edn. \u00deessum ver\u00f0ur \u00fathluta\u00f0 marka\u00f0svir\u00f0i.
  \u00deetta gildi, sett samkv\u00e6mt reglum um frambo\u00f0 og eftirspurn, er h\u00e1\u00f0
  breytingum.\\nGetur fyrirt\u00e6ki fj\u00e1rfest \u00e1 hlutabr\u00e9famarka\u00f0i?\\nAllir
  geta fj\u00e1rfest \u00e1 hlutabr\u00e9famarka\u00f0i. Jafnvel fyrirt\u00e6ki geta
  fj\u00e1rfest \u00e1 hlutabr\u00e9famarka\u00f0i. Til a\u00f0 gera \u00feetta notar
  \u00fea\u00f0 millili\u00f0i.\"", "\"Snemma \u00e1 f\u00f6studagsmorgun var \u00f6kuma\u00f0ur
  st\u00f6\u00f0va\u00f0ur \u00e1 Eyrarbakkavegi \u00e1 milli Eyrarbakka og Selfoss.
  \u00cd lj\u00f3s kom a\u00f0 \u00ed bifrei\u00f0 hans var talsvert magn, um eitt
  k\u00edl\u00f3 af kannabisefnum.\\nMa\u00f0urinn var handtekinn og f\u00e6r\u00f0ur
  \u00ed fangageymslu.\\nFrekari ranns\u00f3kn leiddi \u00ed lj\u00f3s a\u00f0 ma\u00f0urinn
  var a\u00f0 koma fr\u00e1 geymsluh\u00fasn\u00e6\u00f0i \u00ed \u00deorl\u00e1ksh\u00f6fn
  \u00fear sem kannabisr\u00e6ktun haf\u00f0i veri\u00f0 \u00ed gangi. \u00dear var
  n\u00fdafsta\u00f0in r\u00e6ktun og af ummerkjum a\u00f0 d\u00e6ma m\u00e1tti \u00e6tla
  a\u00f0 veri\u00f0 v\u00e6ri a\u00f0 flytja r\u00e6ktunina \u00e1 annan sta\u00f0.\\nS\u00e1
  handtekni vi\u00f0urkenndi a\u00f0 hafa veri\u00f0 a\u00f0 a\u00f0sto\u00f0a f\u00e9laga
  sinn vi\u00f0 a\u00f0 flytja efnin \u00far geymsluh\u00fasn\u00e6\u00f0inu en hann
  hafi ekki komi\u00f0 a\u00f0 r\u00e6ktuninni sj\u00e1lfri.\\nM\u00e1li\u00f0 er
  \u00ed ranns\u00f3kn og efnin ver\u00f0a send til efnaranns\u00f3knar.\"", "\"\u201ePers\u00f3nulega
  hef \u00e9g aldrei skili\u00f0 af hverju vi\u00f0 \u00cdslendingar horfum ekki meira
  til F\u00e6reyja sem er fr\u00e1b\u00e6r eyja og geggja\u00f0 skemmtilegt f\u00f3lk
  me\u00f0 hrikalega g\u00f3\u00f0an bj\u00f3r, hvort sem hann er \u00e1 vellinum
  e\u00f0a ekki,\u201c er me\u00f0al \u00feess sem stendur \u00ed Bak\u00fe\u00f6nkum
  Fr\u00e9ttabla\u00f0sins \u00ed morgun. Bjarni Karlsson prestur l\u00fdsir \u00fear
  fyrirmyndarstemningu \u00e1 knattspyrnuleikjum \u00ed F\u00e6reyjum. Ekki s\u00edst
  er hann \u00e1n\u00e6g\u00f0ur me\u00f0 a\u00f0 seldur er bj\u00f3r \u00e1 leikjunum
  en \u00e1 Laugardalsvellinum s\u00e9 bara bj\u00f3r fyrir VIP-gesti. Pistillinn
  er skrifa\u00f0ur \u00ed tilefni af \u00fev\u00ed a\u00f0 framundan er bikar\u00farslitaleikurinn
  \u00ed F\u00e6reyjum en \u00fear \u00fej\u00e1lfar \u00cdslendingurinn Heimir Gu\u00f0j\u00f3nsson
  anna\u00f0 li\u00f0i\u00f0 sem \u00fear keppir, HB.\\nS\u00e9ra Bjarni fer einnig
  \u00f3f\u00f6grum or\u00f0um um umgj\u00f6r\u00f0ina \u00ed bikarkeppninni \u00e1
  \u00cdslandi og segir a\u00f0 \u00cdslendingar standi F\u00e6reyingum langt a\u00f0
  baki hva\u00f0 var\u00f0ar umgj\u00f6r\u00f0 um bikar\u00farslitaleiki.\\n\u00cd
  lokin skrifar Bjarni:\\n\u201e\u00c9g held a\u00f0 KS\u00cd \u00e6tti a\u00f0 skella
  s\u00e9r \u00e1 laugardaginn og sj\u00e1 Heimi Gu\u00f0j\u00f3nsson og f\u00e9laga
  \u00ed HB og l\u00e6ra hvernig eigi a\u00f0 halda bikar\u00farslitaleik. \u00dev\u00ed
  \u00fea\u00f0 ver\u00f0a n\u00e1nast pott\u00fe\u00e9tt fleiri \u00e1 \u00feeim
  leik en \u00e1 bikar\u00farslitaleiknum h\u00e9r heima.\u201c\\n\u00dea\u00f0 s\u00e9rkennilega
  vi\u00f0 \u00feessi skrif er a\u00f0 s\u00e9ra Bjarni Karlsson hefur aldrei \u00e1\u00f0ur
  skrifa\u00f0 um knattspyrnu \u00ed pistlum s\u00ednum en hann fjallar gjarnan um
  jafnr\u00e9ttism\u00e1l og alvarleg \u00fej\u00f3\u00f0f\u00e9lagsvandam\u00e1l.
  \u00de\u00e1 er mj\u00f6g \u00far karakter a\u00f0 sj\u00e1 prestinn m\u00e6la me\u00f0
  bj\u00f3rdrykkju \u00e1 knattspyrnuleikjum.\\n\u00cd lj\u00f3s hefur komi\u00f0
  a\u00f0 um mist\u00f6k var a\u00f0 r\u00e6\u00f0a og var birtur rangur h\u00f6fundur
  vi\u00f0 greinina. R\u00e9ttur h\u00f6fundur er \u00ed\u00fer\u00f3ttafr\u00e9ttama\u00f0urinn
  Benedikt B\u00f3as Hinriksson. Pistilinn m\u00e1 lesa h\u00e9r.\\nBjarni Karlsson
  hefur h\u00famor fyrir \u00feessum mist\u00f6kum \u00fev\u00ed hann skrifar \u00e1
  Facebook-s\u00ed\u00f0u s\u00edna:\\n\u201eJ\u00e6ja, \u00fea\u00f0 er b\u00fai\u00f0
  a\u00f0 grenja af hl\u00e1tri h\u00e9r \u00ed morguns\u00e1ri\u00f0. Aftan \u00e1
  Fr\u00e9ttabla\u00f0inu eru bak\u00feankar eigna\u00f0ir m\u00e9r \u00fear sem \u00e9g
  hr\u00f3sa F\u00e6reyskum bj\u00f3r og tala um hve \u201egeggja\u00f0 gaman\u201c
  \u00fea\u00f0 er a\u00f0 fara \u00e1 knattspyrnuleiki \u00ed \u00de\u00f3rsh\u00f6fn!\u201c\"",
