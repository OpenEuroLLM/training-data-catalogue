sample: '["\"17 N\u00f3vember 2009 12:00\\n\u00c1rlegur fundur l\u00f6greglunnar og
  hreppsnefndar Kj\u00f3sarhrepps var haldinn \u00ed \u00c1sgar\u00f0i \u00ed g\u00e6r
  en fundinn s\u00e1tu jafnframt nokkrir fulltr\u00faar \u00far f\u00e9lagsm\u00e1lanefnd
  hreppsins. A\u00f0 vanda var fari\u00f0 yfir \u00fer\u00f3un brota \u00ed sveitarf\u00e9laginu
  sem er \u00fea\u00f0 f\u00e1mennasta \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu
  en \u00edb\u00faar \u00feess voru 196 \u00ed \u00e1rslok 2008. \u00der\u00e1tt fyrir
  f\u00e1menni\u00f0 er sv\u00e6\u00f0i\u00f0 v\u00ed\u00f0femt og hefur l\u00edka
  \u00e1kve\u00f0na s\u00e9rst\u00f6\u00f0u af \u00feeim s\u00f6kum. Eins og alltaf
  eru Kj\u00f3sverjar h\u00f6f\u00f0ingjar heim a\u00f0 s\u00e6kja en \u00feeir bu\u00f0u
  gestum upp \u00e1 flatk\u00f6kur me\u00f0 hangikj\u00f6ti og brau\u00f0 me\u00f0
  reyktum laxi og svo var drukki\u00f0 kaffi me\u00f0 \u00fev\u00ed. \u00c1 t\u00edmabili
  leit reyndar \u00fat fyrir a\u00f0 l\u00f6greglustj\u00f3ri og f\u00f6runeyti hans
  k\u00e6mist ekki \u00e1 fundinn \u00fev\u00ed l\u00f6greglub\u00edllinn \u00feeirra
  bila\u00f0i \u00e1 lei\u00f0inni. Var gripi\u00f0 til \u00feess r\u00e1\u00f0s a\u00f0
  f\u00e1 annan b\u00edl \u00ed sta\u00f0inn og komst h\u00f3purinn \u00e1 lei\u00f0arenda.
  Fundurinn h\u00f3fst \u00fev\u00ed nokkru \u00e1 eftir \u00e1\u00e6tlun en \u00fea\u00f0
  kom ekki a\u00f0 s\u00f6k enda eru Kj\u00f3sverjar ekkert a\u00f0 \u00e6sa sig yfir
  sm\u00e1munum.\\nL\u00edkt og fyrri \u00e1r eru afbrot \u00ed Kj\u00f3sarhreppi
  mj\u00f6g f\u00e1t\u00ed\u00f0 og \u00feau m\u00e1 telja \u00e1 fingrum annarrar
  handar. Raunar haf\u00f0i einn fundarmanna \u00e1 or\u00f0i a\u00f0 \u00fea\u00f0
  v\u00e6ru engin vandam\u00e1l \u00ed Kj\u00f3sarhreppi og undir \u00fea\u00f0 m\u00e1
  taka. \u00d3l\u00f6gleg me\u00f0fer\u00f0 skotvopna kom \u00fe\u00f3 til umr\u00e6\u00f0u
  en ekki ver\u00f0ur samt s\u00e9\u00f0 a\u00f0 \u00fea\u00f0 s\u00e9 s\u00e9rstakt
  \u00e1hyggjuefni \u00e1 sv\u00e6\u00f0inu. Helsta vandam\u00e1li\u00f0 vir\u00f0ist
  hinsvegar sn\u00faa a\u00f0 hra\u00f0akstri en bifhj\u00f3lamenn eiga \u00fea\u00f0
  til a\u00f0 fara heldur geyst um Kj\u00f3sarhrepp \u00e1 sumrin og vi\u00f0 \u00fev\u00ed
  hefur l\u00f6greglan brug\u00f0ist. \u00dea\u00f0 sem var fundarm\u00f6nnum einna
  efst \u00ed huga sn\u00fdr \u00fe\u00f3 ekki beint a\u00f0 l\u00f6greglunni heldur
  forr\u00e1\u00f0am\u00f6nnum fjarskiptafyrirt\u00e6kja. Kj\u00f3sverjum \u00feykir
  s\u00edmasambandi\u00f0 \u00ed sveitinni ekki n\u00f3gu gott og segja a\u00f0 ekki
  n\u00e1ist samband vi\u00f0 gsm-s\u00edma \u00e1 m\u00f6rgum st\u00f6\u00f0um. \u00deessu
  vilja \u00feeir koma \u00ed lag og benda \u00e1 \u00f6ryggissj\u00f3narmi\u00f0
  hva\u00f0 \u00fea\u00f0 var\u00f0ar og undir \u00fea\u00f0 m\u00e1 taka.\\n\u00dea\u00f0
  var \u00c1rni \u00de\u00f3r Sigmundsson, a\u00f0sto\u00f0aryfirl\u00f6greglu\u00fej\u00f3nn
  og st\u00f6\u00f0varstj\u00f3ri \u00e1 l\u00f6greglust\u00f6\u00f0 4, sem f\u00f3r
  yfir t\u00f6lfr\u00e6\u00f0ina me\u00f0 Kj\u00f3sverjum en hana m\u00e1 n\u00e1lgast
  \u00ed heild sinni me\u00f0 \u00fev\u00ed a\u00f0 smella h\u00e9r. \u00c1rni kynnti
  einnig til s\u00f6gunnar ni\u00f0urst\u00f6\u00f0ur \u00far k\u00f6nnun um reynslu
  \u00edb\u00faa h\u00f6fu\u00f0borgarsv\u00e6\u00f0isins af l\u00f6greglu, \u00f6ryggi
  og afbrotum. K\u00f6nnunin var framkv\u00e6md \u00ed vor en hana m\u00e1 n\u00e1lgast
  \u00ed heild sinni me\u00f0 \u00fev\u00ed a\u00f0 smella h\u00e9r. A\u00f0sto\u00f0aryfirl\u00f6greglu\u00fej\u00f3nninn
  og Stef\u00e1n Eir\u00edksson l\u00f6greglustj\u00f3ri r\u00e6ddu einnig um helstu
  breytingar sem hafa or\u00f0i\u00f0 hj\u00e1 emb\u00e6ttinu undanfari\u00f0 og \u00fe\u00e6r
  v\u00e6ntingar sem menn hafa, m.a. um aukna s\u00fdnilega l\u00f6gg\u00e6slu.\\nFundarmenn
  voru 20 talsins en einn \u00feeirra l\u00e9t s\u00e9r f\u00e1tt um finnast \u00fe\u00f3tt
  nokkrir einkenniskl\u00e6ddir l\u00f6greglumenn \u00far h\u00f6fu\u00f0borginni
  v\u00e6ru \u00ed heims\u00f3kn. \u00deetta var hann Birgir Mikkael J\u00f3hannesson,
  9 m\u00e1na\u00f0a sn\u00e1\u00f0i sem kom \u00e1 fundinn me\u00f0 \u00f6mmu sinni,
  henni Gu\u00f0n\u00fdju \u00cdvarsd\u00f3ttur \u00ed Flekkudal en \u00feau m\u00e1
  einmitt sj\u00e1 saman \u00e1 mynd h\u00e9r efst \u00e1 s\u00ed\u00f0unni. \u00c1
  fundum \u00ed haust og vetur hefur f\u00f3lk \u00e1 \u00fdmsum aldri komi\u00f0
  til fundar vi\u00f0 l\u00f6gregluna en Birgir er s\u00e1 langyngsti! Kannski ver\u00f0ur
  hann bara l\u00f6gregluma\u00f0ur s\u00ed\u00f0ar meir. Eins og \u00e1\u00f0ur kom
  fram var fundurinn haldinn \u00ed \u00c1sgar\u00f0i en \u00fear var starfr\u00e6ktur
  sk\u00f3li \u00ed eina t\u00ed\u00f0. Miklar endurb\u00e6tur hafa fari\u00f0 fram
  \u00ed \u00c1sgar\u00f0i og h\u00fasi\u00f0 er or\u00f0i\u00f0 hi\u00f0 gl\u00e6silegasta
  en \u00fear er hreppsskrifstofan n\u00fa til h\u00fasa.\"", "\"Orlofseignir \u00ed
