  og \u00e6tla m\u00e1 a\u00f0 h\u00fan s\u00e9 mest fyrst og l\u00edtil sem engin
  eftir \u00e1kve\u00f0inn \u00e1rafj\u00f6lda.\\nMismunur \u00e1 grunng\u00f6gnum
  losunarb\u00f3khalds og ofangreindum t\u00f6lum \u00far n\u00fdjum innlendum ranns\u00f3knum
  er svo mikill a\u00f0 \u00fe\u00f6rf \u00e1 frekari ranns\u00f3knum vir\u00f0ist
  auglj\u00f3s. \u00ddmsir \u00fe\u00e6ttir geta valdi\u00f0 \u00feessum mikla mun.
  \u00dev\u00ed er ef til vill n\u00e6rt\u00e6kast a\u00f0 velta fyrir s\u00e9r hva\u00f0
  gerist \u00ed raun \u00feegar land er framr\u00e6st og s\u00ed\u00f0an teki\u00f0
  til r\u00e6ktunar. \u00c6tla m\u00e1 a\u00f0 fyrst eftir framr\u00e6slu s\u00e9
  veruleg kolefnislosun \u00feegar auki\u00f0 loft kemst a\u00f0 efstu jar\u00f0l\u00f6gum
  framr\u00e6sta landsins. L\u00edklegt er a\u00f0 me\u00f0 hverju \u00e1ri sem l\u00ed\u00f0ur
  dragi \u00far kolefnislosun \u00fev\u00ed laust kolefni \u00ed efstu l\u00f6gum
  gengur til \u00feurr\u00f0ar en kolefni \u00ed ne\u00f0ri l\u00f6gum \u00feornar
  minna og sumarhitinn n\u00e6r best til efstu laganna. L\u00edkur vir\u00f0ast \u00fev\u00ed
  \u00e1 a\u00f0 kolefnislosun fr\u00e1 eldri framr\u00e6slu (30 \u00e1ra?) s\u00e9
  l\u00edtil. H\u00e9r ver\u00f0ur a\u00f0 hafa \u00ed huga a\u00f0 yfir 90% af \u00edslenskri
  framr\u00e6slu er eldri en 30 \u00e1ra.\\n\u00deegar framr\u00e6st land er teki\u00f0
  til r\u00e6ktunar hefst jafnan kolefnisbinding \u00ed efstu jar\u00f0l\u00f6gum
  (5 cm?).\\nN\u00fdleg safngreining \u00e1 fj\u00f6lda ranns\u00f3knani\u00f0ursta\u00f0na
  alls sta\u00f0ar a\u00f0 \u00far heiminum s\u00fdnir a\u00f0 b\u00fafj\u00e1r\u00e1bur\u00f0ur
  eykur mj\u00f6g \u00ed kolefnisfor\u00f0a jar\u00f0vegs og enn frekar ef einnig
  er borinn \u00e1 tilb\u00fainn \u00e1bur\u00f0ur (Gross, Glaser 2021). \u00c1hrifin
  eru mest hlutfallslega \u00ed k\u00f6ldu loftslagi og \u00fear sem kolefnisinnihald
  jar\u00f0vegsins er mj\u00f6g l\u00e1gt (\u00deS og fl 2022).\\nRaunh\u00e6ft vir\u00f0ist
  \u00fev\u00ed a\u00f0 \u00e6tla a\u00f0 \u00ed t\u00fanum sem framr\u00e6st voru
  fyrir nokkru (30 \u00e1r?) og hafa s\u00ed\u00f0an veri tekin til r\u00e6ktunar
  og fengi\u00f0 b\u00fafj\u00e1r\u00e1bur\u00f0 lengi s\u00e9 \u00ed raun \u00e1rleg
  kolefnisbinding en ekki 19,5 tn CO2 losun \u00e1 ha.\\nKolefnisjafnv\u00e6gi \u00ed
  landb\u00fana\u00f0i er vel l\u00fdst me\u00f0 eftirfarandi setningu:\\nKolefnishlutleysi
  v\u00edsar til \u00feess a\u00f0 losun og binding kolefnis s\u00e9 \u00ed jafnv\u00e6gi,
  \u00fe.e. a\u00f0 losun kold\u00edox\u00ed\u00f0s og annarra gr\u00f3\u00f0urh\u00fasalofttegunda
  s\u00e9 ekki meiri en \u00fea\u00f0 magn kolefnis sem fjarl\u00e6gt er \u00far andr\u00famsloftinu,
  t.d. me\u00f0 \u00fev\u00ed a\u00f0 binda \u00fea\u00f0 \u00ed jar\u00f0vegi e\u00f0a
  gr\u00f3\u00f0ri e\u00f0a me\u00f0 \u00f6\u00f0rum h\u00e6tti.\\n\u00cd \u00fev\u00ed
  lj\u00f3si er vert a\u00f0 velta fyrir s\u00e9r e\u00f0li hey\u00f6flunar me\u00f0
  grasr\u00e6kt. \u00c1 t\u00fanum \u00ed g\u00f3\u00f0ri r\u00e6kt (me\u00f0 b\u00fafj\u00e1r\u00e1bur\u00f0i)
  eru fjarl\u00e6g\u00f0 \u00ed heyi a.m.k. 4 tonn \u00feurrefnis af hverjum ha. Kolefnisinnihald
  heys er n\u00e1l\u00e6gt 45% \u00feurrefnis sem svarar til a\u00f0 bundin s\u00e9u
  og flutt burt um 1,8 tn C (\u00edgildi 6,6 tn CO2) af ha \u00e1rlega. \u00de\u00e1
  er \u00f3tali\u00f0 \u00fea\u00f0 sem binst \u00ed r\u00f3tum og jar\u00f0vegi.
  Til samanbur\u00f0ar m\u00e1 nefna a\u00f0 vaxtarmikill sk\u00f3gur er talinn binda
  \u00e1rlega 6\u201310 tn CO2/ha yfir vaxtarskei\u00f0i\u00f0.\\nS\u00e9 hluta heysins
  skila\u00f0 landinu aftur sem b\u00fafj\u00e1r\u00e1bur\u00f0i, gjarnan 2-3 tonn
  \u00fee/ha, myndar verulegur hluti \u00feess jar\u00f0veg og \u00fear me\u00f0 verulega
  kolefnisbindingu.\\nBindist helmingur b\u00fafj\u00e1r\u00e1bur\u00f0arins \u00ed
  jar\u00f0vegi g\u00e6tu bundist af ofangreindu magni um 0,6 tn C/ ha \u00e1rlega
  sem svarar til bindingar 2,2 tn CO2/ha. \u00de\u00e1 eru \u00f3talin j\u00e1kv\u00e6\u00f0
  \u00e1hrif b\u00fafj\u00e1r\u00e1bur\u00f0ar \u00e1 kolefnisbindingu grasr\u00f3ta
  og annarra l\u00edfvera \u00ed jar\u00f0vegi.\\nGrasr\u00e6kt \u00e1 \u00feegar
  framr\u00e6stu landi til framlei\u00f0slu sau\u00f0fj\u00e1rafur\u00f0a g\u00e6ti
  \u00fev\u00ed veri\u00f0 virk lei\u00f0 til kolefnisbindingar.\\n\u00datreikningar
  \u00e1 losun metan\\n\u00cd umfj\u00f6llun um kolefnisbindingu sau\u00f0fj\u00e1rr\u00e6ktar
  er losun metan talin valda miklum gr\u00f3\u00f0urh\u00fasa\u00e1hrifum vegna sterkra
  \u00e1hrifa \u00feess. \u00deetta er a\u00f0eins r\u00e9tt a\u00f0 vissu marki \u00fev\u00ed
  metan CH4 er mj\u00f6g \u00f3st\u00f6\u00f0ug lofttegund og kolefni\u00f0 umbreytist
  \u00ed CO2 \u00e1 n\u00e1l\u00e6gt 10 \u00e1rum. Fr\u00e1 atvinnuvegi sem hefur
  veri\u00f0 \u00ed jafnv\u00e6gi s\u00ed\u00f0ustu 10 \u00e1r hverfur \u00fev\u00ed
  \u00e1rlega jafn miki\u00f0 metan \u00far andr\u00famslofti og kemur inn. \u00deessu
  er \u00e1g\u00e6tlega l\u00fdst af J\u00f3ni Gu\u00f0mundssyni-Greining \u00e1 losun
  gr\u00f3\u00f0urh\u00fasalofttegunda fr\u00e1 \u00edslenskum landb\u00fana\u00f0i-
  Lbh\u00cd 2016 en \u00fear segir:\\n\u201eSameindar\u00feyngd CH4 er um 16 en sameindar\u00feyngd
  CO2 um 44. Vi\u00f0 umbreytingu CH4 \u00ed CO2 (oxun og vatnsmyndum vir\u00f0ist
  stu\u00f0ullinn \u00fev\u00ed n\u00e1l\u00e6gt 44/16 = 2,75 en ekki 25 eins og gert
  er r\u00e1\u00f0 fyrir \u00ed mati \u00e1 loftslags\u00e1hrifum CG4 losunar. Er
  \u00fe\u00e1 horft til \u00feess a\u00f0 CH4 ey\u00f0ist \u00e1 10\u201312 \u00e1rum
  og s\u00e9 atvinnugrein \u00ed jafnv\u00e6gi ey\u00f0ist jafn miki\u00f0 og losnar
  af CH4.\u201c\\nVi\u00f0 mat \u00e1 loftslags\u00e1hrifum metan fr\u00e1 sau\u00f0fj\u00e1rr\u00e6kt
  vir\u00f0ist \u00fev\u00ed r\u00e9tt a\u00f0 margfalda magn metan me\u00f0 2,75
  \u00ed sta\u00f0 25 sem v\u00ed\u00f0ast vir\u00f0ist gert.\\nSamanbur\u00f0ur mismunandi
  reiknistu\u00f0la\\n\u00cd n\u00f3vember 2017 var birt sk\u00fdrsla unnin af R\u00e1\u00f0gjafarmi\u00f0st\u00f6\u00f0
  landb\u00fana\u00f0arins (RML) a\u00f0 bei\u00f0ni umhverfis- og au\u00f0lindar\u00e1\u00f0uneytisins,
  nefnist sk\u00fdrslan Losun gr\u00f3\u00f0urh\u00fasalofttegunda fr\u00e1 landb\u00fana\u00f0i.
  Svo sem v\u00e6nta m\u00e1tti bygg\u00f0i sk\u00fdrslan \u00e1 opinberum losunarstu\u00f0lum
  verkbei\u00f0anda og er n\u00e1nast \u00e1n fyrirvara um \u00f6ryggi stu\u00f0la
  en sl\u00edka fyrirvara er \u00fe\u00f3 v\u00ed\u00f0a a\u00f0 finna \u00ed grunng\u00f6gnum
  sem sk\u00fdrslan byggir \u00e1. \u00cd inngangi sk\u00fdrslunnar segir:\\n\u201e\u00c1\u00e6tla\u00f0
  er a\u00f0 h\u00fan n\u00fdtist sem grunnur \u00ed vegv\u00edsi um minnkun \u00e1
  losun gr\u00f3\u00f0urh\u00fasalofttegunda fr\u00e1 landb\u00fana\u00f0i \u00e1
  \u00cdslandi.\u201c\\nFjalla\u00f0 er um tv\u00f6 sau\u00f0fj\u00e1rb\u00fa \u00ed
  sk\u00fdrslunni og fer h\u00e9r \u00e1 eftir \u00ed t\u00f6flu 1 endurreikningur
  \u00e1 losun gr\u00f3\u00f0urh\u00fasalofttegunda fr\u00e1 \u00feeim b\u00fdlum,
  me\u00f0 \u00feeim reiknistu\u00f0lum sem r\u00f6kstuddir hafa veri\u00f0 h\u00e9r
  a\u00f0 ofan. S\u00e1 endurreikningur er birtur, me\u00f0 g\u00f3\u00f0f\u00faslegu
  leyfi vi\u00f0komandi b\u00e6nda, til a\u00f0 s\u00fdna hve miklu mismunandi stu\u00f0lar
  breyta, breyttar t\u00f6lur eru sk\u00e1letra\u00f0ar og feitletra\u00f0ar.\\nSvo
  sem fram kemur \u00ed t\u00f6flunni gj\u00f6rbreyta endursko\u00f0a\u00f0ir reiknistu\u00f0lar
  reiknu\u00f0u kolefnisjafnv\u00e6gi sau\u00f0fj\u00e1rframlei\u00f0slu vi\u00f0komandi
  b\u00faa, s\u00e9u \u00feeir raunh\u00e6fir vir\u00f0ist au\u00f0velt a\u00f0 n\u00e1
  kolefnishlutleysi sau\u00f0fj\u00e1rb\u00faa me\u00f0 skynsamlegri b\u00fastj\u00f3rn.\\nVart
  \u00fearf a\u00f0 fj\u00f6lyr\u00f0a um ska\u00f0leg \u00e1hrif \u00feess a\u00f0
  nota rangar a\u00f0fer\u00f0ir vi\u00f0 \u00fatreikninga \u00e1 kolefnislosun/bindingu
  \u00ed sau\u00f0fj\u00e1rr\u00e6kt. \u00deeim \u00e1hrifum er ef til vill best l\u00fdst
  me\u00f0 eftirfarandi tilvitnun \u00ed Morgunbla\u00f0i\u00f0:\\n\u201eFr\u00e6\u00f0imenn
  vi\u00f0 Landb\u00fana\u00f0ar h\u00e1sk\u00f3la \u00cdslands hafa \u00feannig reikna\u00f0
  \u00fat a\u00f0 losun vi\u00f0 framlei\u00f0slu \u00e1 einu k\u00edl\u00f3i af \u00edslensku
  lambakj\u00f6ti s\u00e9 svipu\u00f0 og af flugfer\u00f0 fr\u00e1 \u00cdslandi til
  meginlands Evr\u00f3pu\u201c (\u00d3lafur Stephensen Mbl. 17.12. 2022).\\nSau\u00f0fj\u00e1rb\u00e6ndur
  geta ekki s\u00e6tt sig vi\u00f0 a\u00f0 or\u00f0spor atvinnugreinarinnar ver\u00f0i
  ey\u00f0ilagt me\u00f0 illa r\u00f6kstuddum lykilt\u00f6lum og villandi t\u00falkun
  annarra talna.\""]'
