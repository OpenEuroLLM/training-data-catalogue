  almennt s\u00e9u einar 9 \u00fe\u00fas. kr. st\u00f3r hluti sem \u00feurfi a\u00f0
  velta mj\u00f6g v\u00f6ngum yfir.\\n\u00c9g hef \u00e1tt tal um \u00feetta vi\u00f0
  okkar \u00e1g\u00e6ta formann fjvn., sem a\u00f0 sj\u00e1lfs\u00f6g\u00f0u g\u00e6tir
  \u00feeirrar skyldu sinnar a\u00f0 halda \u00ed hva\u00f0 hann getur, en \u00fea\u00f0
  er oft erfitt um vik. M\u00e9r hefur veri\u00f0 svara\u00f0 til af honum og fleirum
  \u00ed fjvn.: Vi\u00f0 h\u00e6kku\u00f0um drj\u00fagum framlag til Kvenf\u00e9lagasambands
  \u00cdslands og Kvenf\u00e9lagasamband \u00cdslands \u00e1 a\u00f0 geta mi\u00f0la\u00f0
  kvenf\u00e9lagasamb\u00f6ndunum \u00fati um landi\u00f0 einhverju af \u00feeim fj\u00e1rmunum
  sem til \u00feess fellur \u00e1 fj\u00e1rl\u00f6gum r\u00edkisins. En \u00e1 s\u00ed\u00f0asta
  \u00e1ri nam fj\u00e1rveiting til Kvenf\u00e9lagasambands \u00cdslands 150 000 kr.
  H\u00fan er h\u00e6kku\u00f0 \u00ed \u00e1r \u00far 150 000 \u00ed 210 000. Sta\u00f0reyndin
  er hins vegar s\u00fa, a\u00f0 \u00ed ums\u00f3kn Kvenf\u00e9lagasambands \u00cdslands
  til fjvn. er fari\u00f0, \u00ed mj\u00f6g vel sundurli\u00f0a\u00f0ri fj\u00e1rhags\u00e1\u00e6tlun,
  fram \u00e1 358 000 til a\u00f0 geta sta\u00f0i\u00f0 undir \u00feeirri starfsemi
  sem Kvenf\u00e9lagasamband \u00cdslands innir af h\u00f6ndum, m.a. \u00ed rekstur
  lei\u00f0beiningarst\u00f6\u00f0var h\u00fasm\u00e6\u00f0ra, sem \u00e9g hika ekki
  vi\u00f0 a\u00f0 segja a\u00f0 gegnir mj\u00f6g \u00fe\u00f6rfu og mikilv\u00e6gu
  hlutverki, enda er annr\u00edki\u00f0 \u00fea\u00f0 miki\u00f0 \u00e1 \u00feessari
  skrifstofu, sem ekki er h\u00e6gt peningaleysis vegna a\u00f0 halda opinni nema
  h\u00e1lfan daginn, a\u00f0 h\u00fan f\u00e6r vart anna\u00f0 \u00f6llum \u00feeim
  bei\u00f0num um uppl\u00fdsingar og lei\u00f0beiningar sem b\u00e6\u00f0i var\u00f0a
  heimilisrekstur, innkaup til heimila og allt a\u00f0 \u00fev\u00ed l\u00fatandi.
  \u00dearna er \u00fev\u00ed virkilega enginn h\u00e9g\u00f3mi \u00e1 fer\u00f0.
  \u00dea\u00f0 er \u00fev\u00ed t\u00f3mt m\u00e1l a\u00f0 tala um a\u00f0 Kvenf\u00e9lagasambandi\u00f0
  geti mi\u00f0la\u00f0 kvenf\u00e9lagasamb\u00f6ndunum \u00fati um land.\\n\u00dea\u00f0
  er l\u00edka bent \u00e1 kvenf\u00e9l\u00f6gin. Kvenf\u00e9l\u00f6gin geta borga\u00f0
  til sinna f\u00e9laga --- er sagt. \u00dea\u00f0 er alveg r\u00e9tt, enda gera \u00feau
  \u00fea\u00f0 og gera \u00fea\u00f0 \u00ed vaxandi m\u00e6li. Me\u00f0al annars
  leggja \u00feau hvert sinn skerf til Kvenf\u00e9lagasambands \u00cdslands til \u00feess
  a\u00f0 \u00fea\u00f0 geti sinnt s\u00ednu hlutverki a\u00f0 sinna \u00fdmiss konar
  fr\u00e6\u00f0slustarfsemi og menningarstarfsemi. \u00dea\u00f0 er ekki bara \u00fea\u00f0
  sem var\u00f0ar heimilisst\u00f6rf innan veggja heimilisins. \u00deau hafa fj\u00f6lmargt
  \u00e1 sinni stefnuskr\u00e1; gar\u00f0yrkju, sk\u00f3gr\u00e6kt og \u00fear fram
  eftir g\u00f6tunum. A\u00f0 \u00f6llu sem l\u00fdtur a\u00f0 framf\u00f6rum og \u00e9g
  vil segja betra og fegurra mannl\u00edfi vinna kvenf\u00e9l\u00f6gin. \u00deau gera
  \u00fea\u00f0 h\u00e1va\u00f0alaust, eins og \u00e9g sag\u00f0i, \u00e1n \u00feess
  a\u00f0 \u00e6tlast til \u00feess a\u00f0 \u00feeim s\u00e9 hr\u00f3sa\u00f0 e\u00f0a
  h\u00e6lt fyrir \u00fea\u00f0.\\n\u00c9g hef veri\u00f0 br\u00fdnd \u00e1 \u00fev\u00ed
  sem sj\u00e1lfst\u00e6\u00f0isma\u00f0ur, a\u00f0 \u00e9g vilji vera a\u00f0 s\u00e6kja
  um styrk til r\u00edkisins til a\u00f0 halda uppi frj\u00e1lsu f\u00e9lagsstarfi.
  \u00deetta er a\u00f0 vissu leyti r\u00e9tt athugasemd. En \u00e9g l\u00edt ekki
  \u00e1 \u00feetta sem fj\u00e1rf\u00falgur til a\u00f0 halda uppi f\u00e9lagsstarfinu.
  \u00c9g l\u00edt \u00e1 \u00feetta sem hvatningu og sm\u00e1stu\u00f0ning vi\u00f0
  mikilv\u00e6gt \u00e1hugamannastarf. \u00dea\u00f0 er fj\u00f6ldinn allur af f\u00e9l\u00f6gum
  inni \u00e1 fj\u00e1rl\u00f6gum sem n\u00fdtur sm\u00e1stu\u00f0nings fr\u00e1 r\u00edkinu
  einmitt \u00feess vegna. \u00dea\u00f0 er ekki veri\u00f0 a\u00f0 standa undir \u00feeirra
  starfi, heldur vi\u00f0urkenna \u00fea\u00f0 og \u00f6rva f\u00e9lagsmenn til frekari
  d\u00e1\u00f0a. \u00dea\u00f0 er \u00feetta sem fyrir m\u00e9r vakir me\u00f0 flutningi
  \u00feessarar litlu breytingartill\u00f6gu, a\u00f0 \u00feessu merka starfi, sem
  \u00edslenskar konur \u00fati um allar bygg\u00f0ir landsins vinna \u00ed \u00fe\u00e1gu
  g\u00f3\u00f0ra \u00fej\u00f3\u00f0\u00ferifam\u00e1la, s\u00e9 ekki gleymt.\\n\u00c9g
  vil l\u00edka minnast s\u00e9rstaklega \u00e1 \u00ed \u00feessu sambandi a\u00f0
  \u00feetta eru f\u00e9l\u00f6g sem standa utan vi\u00f0 alla flokksp\u00f3lit\u00edk.
  \u00dearna taka konur h\u00f6ndum saman alveg \u00e1n tillits til \u00feess hva\u00f0a
  p\u00f3lit\u00edskum flokki \u00fe\u00e6r tilheyra. \u00c9g ver\u00f0 a\u00f0 segja
  a\u00f0 \u00fea\u00f0 f\u00e6ri betur ef vi\u00f0 \u00cdslendingar g\u00e6tum v\u00ed\u00f0ar
  liti\u00f0 framhj\u00e1 flokksp\u00f3lit\u00edkinni og unni\u00f0 saman \u00e1n
  tillits til hennar a\u00f0 \u00feeim m\u00e1lum sem vi\u00f0 \u00feurfum a\u00f0
  n\u00e1 fram.\\nHerra forseti. \u00c9g skal ekki or\u00f0lengja \u00feetta frekar
  h\u00e9r. \u00c9g vona a\u00f0 \u00feessi litla tillaga nj\u00f3ti skilnings hv.
  al\u00fem. \u00c9g held h\u00fan kollvarpi ekki fj\u00e1rhag r\u00edkisins og \u00e9g
  held h\u00fan s\u00e9 sanngj\u00f6rn og r\u00e9ttm\u00e6t. \u00c9g \u00e6tla a\u00f0
  brottfelling \u00feessara li\u00f0a af fj\u00e1rl\u00f6gum \u00e1 \u00e1rinu 1982
  s\u00e9 til komin fyrir hugsunarleysi e\u00f0a jafnvel vang\u00e1 fremur en vanmat
  \u00e1 hinu gagnmerka og \u00f3eigingjarna starfi \u00edslenskra kvenf\u00e9laga
  fram \u00e1 \u00feennan dag.\"", "\"Hvernig Starlink g\u00e6ti gj\u00f6rbylt vi\u00f0leitni
  vegna hamfara\\nStarlink, brei\u00f0bandsnet\u00fej\u00f3nustan sem byggir \u00e1
  gervihnattar\u00e1sum fr\u00e1 SpaceX, hefur tilhneigingu til a\u00f0 gj\u00f6rbylta
  vi\u00f0leitni til hamfara. Me\u00f0 getu til a\u00f0 veita \u00e1rei\u00f0anlegan,
  h\u00e1hra\u00f0a interneta\u00f0gang \u00ed afskekktustu og \u00f3ge\u00f0s\u00e6lustu
  umhverfi, hefur Starlink m\u00f6guleika \u00e1 a\u00f0 breyta leik \u00ed h\u00f6rmungavi\u00f0br\u00f6g\u00f0um.\\nStarlink
  er n\u00fa \u00ed beta-fasa, \u00fear sem \u00fe\u00fasundir notenda \u00ed Bandar\u00edkjunum,
  Kanada, Bretlandi og \u00f6\u00f0rum l\u00f6ndum hafa \u00feegar n\u00fdtt s\u00e9r
  \u00fej\u00f3nustuna. Markmi\u00f0i\u00f0 er a\u00f0 veita \u00fej\u00f3nustu hvar
  sem er \u00ed heiminum \u00e1 endanum. \u00deetta hef\u00f0i s\u00e9rstaklega \u00e1hrif
  \u00e1 n\u00e1tt\u00faruhamf\u00f6rum, \u00feegar hef\u00f0bundin samskiptanet geta
  or\u00f0i\u00f0 ofhla\u00f0in e\u00f0a jafnvel fari\u00f0 ni\u00f0ur.\\nMe\u00f0
  Starlink g\u00e6tu fyrstu vi\u00f0brag\u00f0sa\u00f0ilar fengi\u00f0 a\u00f0gang
  a\u00f0 mikilv\u00e6gum uppl\u00fdsingum og samr\u00e6mt ney\u00f0ar\u00e1\u00e6tlanir,
  jafnvel \u00e1 sv\u00e6\u00f0um \u00fear sem engin \u00f6nnur samskipti eru. Til
  d\u00e6mis g\u00e6tu ney\u00f0arstarfsmenn fengi\u00f0 a\u00f0gang a\u00f0 raunt\u00edmag\u00f6gnum
  um hamfarir, svo sem vindhra\u00f0a, fl\u00f3\u00f0astig og a\u00f0rar mikilv\u00e6gar
  m\u00e6likvar\u00f0ar. \u00deessi g\u00f6gn g\u00e6tu veri\u00f0 notu\u00f0 til
  a\u00f0 uppl\u00fdsa r\u00fdmingar\u00e1\u00e6tlanir og a\u00f0rar mikilv\u00e6gar
  \u00e1kvar\u00f0anir.\\nStarlink g\u00e6ti einnig veri\u00f0 nota\u00f0 til a\u00f0
  veita a\u00f0gang a\u00f0 fjarl\u00e6gri l\u00e6knishj\u00e1lp. \u00deetta v\u00e6ri
  s\u00e9rstaklega hagkv\u00e6mt \u00ed dreifb\u00fdli \u00fear sem a\u00f0gengi a\u00f0
  l\u00e6knis\u00farr\u00e6\u00f0um getur veri\u00f0 \u00f3fulln\u00e6gjandi. Me\u00f0
  Starlink g\u00e6tu l\u00e6knar og hj\u00fakrunarfr\u00e6\u00f0ingar nota\u00f0 fjarl\u00e6kningar
  til a\u00f0 veita fjar\u00fej\u00f3nustu og tengja sj\u00faklinga vi\u00f0 s\u00e9rh\u00e6f\u00f0a
  um\u00f6nnun.\\nA\u00f0 auki g\u00e6ti Starlink veri\u00f0 nota\u00f0 til a\u00f0
  veita a\u00f0gang a\u00f0 mikilv\u00e6gri \u00fej\u00f3nustu eins og bankastarfsemi,
  menntun og samskiptum. \u00deetta g\u00e6ti veri\u00f0 bj\u00f6rgunarl\u00edna fyrir
  \u00fe\u00e1 sem ver\u00f0a fyrir h\u00f6rmungum og hj\u00e1lpa \u00feeim a\u00f0
  f\u00e1 a\u00f0gang a\u00f0 \u00feeim \u00farr\u00e6\u00f0um sem \u00feeir \u00feurfa
  til a\u00f0 endurbyggja l\u00edf sitt.\\nStarlink er enn \u00e1 frumstigi, en m\u00f6guleikinn
  \u00e1 a\u00f0 gj\u00f6rbylta hamfarahj\u00e1lp er auglj\u00f3s. Me\u00f0 getu til
  a\u00f0 veita h\u00e1hra\u00f0anettengingu jafnvel \u00e1 einangru\u00f0ustu og
  \u00f3ge\u00f0sj\u00fakustu sv\u00e6\u00f0um g\u00e6ti Starlink veri\u00f0 breytileiki
  fyrir ney\u00f0arvi\u00f0brag\u00f0sa\u00f0ila og \u00fe\u00e1 sem ver\u00f0a fyrir
  hamf\u00f6rum.\\nKanna\u00f0u m\u00f6guleika Starlink til a\u00f0 tengja fjarsamf\u00e9l\u00f6g
  vi\u00f0 nau\u00f0synlegar au\u00f0lindir\\nLofor\u00f0i\u00f0 um Starlink, net\u00fej\u00f3nustu
  sem byggir \u00e1 geimnum, b\u00fain til af SpaceX, hefur veri\u00f0 \u00ed heimsfr\u00e9ttum
  undanfarna m\u00e1nu\u00f0i \u00feegar fyrirt\u00e6ki\u00f0 undirb\u00fdr sig fyrir
  uppsetningu gervihnattakerfis s\u00edns. R\u00e6tt hefur veri\u00f0 um m\u00f6guleika
  Starlink me\u00f0 tilliti til getu \u00feess til a\u00f0 veita f\u00f3lki \u00ed
  dreifb\u00fdli og afskekktum samf\u00e9l\u00f6gum um allan heim h\u00e1hra\u00f0anettengingu.\\nN\u00fa
  eru margir farnir a\u00f0 \u00edhuga hvernig Starlink g\u00e6ti veri\u00f0 nota\u00f0
  til a\u00f0 tengja \u00feessi samf\u00e9l\u00f6g vi\u00f0 nau\u00f0synlegar au\u00f0lindir
  eins og heilsug\u00e6slu, menntun og efnahagsleg t\u00e6kif\u00e6ri.\\n\u00cd Bandar\u00edkjunum
  hefur Federal Communications Commission (FCC) lagt til \u00e1\u00e6tlun um a\u00f0
  nota Starlink til a\u00f0 tengja \u00f3\u00fej\u00f3nu\u00f0 bandar\u00edsk samf\u00e9l\u00f6g
  vi\u00f0 interneti\u00f0. Samkv\u00e6mt \u00e1\u00e6tluninni mun FCC leggja fram
  allt a\u00f0 16 milljar\u00f0a Bandar\u00edkjadala \u00e1 n\u00e6sta \u00e1ratug
  til a\u00f0 a\u00f0sto\u00f0a vi\u00f0 a\u00f0 fj\u00e1rmagna uppsetningu \u00e1
  gervihn\u00f6ttum Starlink. Fj\u00e1rmunirnir ver\u00f0a nota\u00f0ir til a\u00f0
  veita sk\u00f3lum \u00e1 landsbygg\u00f0inni, b\u00f3kas\u00f6fnum og heilsug\u00e6slua\u00f0ilum
  neta\u00f0gang.\\nAuk \u00feess a\u00f0 veita a\u00f0gang a\u00f0 mennta- og heilsug\u00e6sluau\u00f0lindum
  g\u00e6ti Starlink einnig veri\u00f0 nota\u00f0 til a\u00f0 opna efnahagsleg t\u00e6kif\u00e6ri
  fyrir f\u00f3lk \u00ed afskekktum samf\u00e9l\u00f6gum. Til d\u00e6mis g\u00e6tu
  fyrirt\u00e6ki nota\u00f0 Starlink til a\u00f0 stunda netvi\u00f0skipti, sem gerir
  \u00feeim kleift a\u00f0 n\u00e1 til vi\u00f0skiptavina um allan heim.\\nMargir
  s\u00e9rfr\u00e6\u00f0ingar eru bjarts\u00fdnir \u00e1 m\u00f6guleika Starlink til
  a\u00f0 breyta l\u00edfi f\u00f3lks \u00ed afskekktum samf\u00e9l\u00f6gum. Hins
  vegar hafa sumir vara\u00f0 vi\u00f0 \u00fev\u00ed a\u00f0 kostna\u00f0urinn sem
  fylgir uppsetningu og vi\u00f0haldi gervihnattakerfisins g\u00e6ti veri\u00f0 ofvi\u00f0a.\\nA\u00f0eins
  t\u00edminn mun lei\u00f0a \u00ed lj\u00f3s hvort Starlink mun geta veitt \u00fe\u00e1
  tengingu sem fjarl\u00e6g samf\u00e9l\u00f6g \u00feurfa til a\u00f0 f\u00e1 a\u00f0gang
  a\u00f0 nau\u00f0synlegum au\u00f0lindum. En ef t\u00e6knin gengur vel g\u00e6ti
  h\u00fan opna\u00f0 heim m\u00f6guleika fyrir f\u00f3lk um allan heim.\\nN\u00fdttu
  Starlink litla bi\u00f0t\u00edma fyrir mann\u00fa\u00f0ara\u00f0sto\u00f0\\nM\u00f6guleikinn
  \u00e1 neti me\u00f0 litla bi\u00f0t\u00edma er ekki lengur fjarl\u00e6gur draumur.
  \u00de\u00f6kk s\u00e9 Starlink verkefni SpaceX er f\u00f3lk um allan heim fari\u00f0
  a\u00f0 upplifa kraftinn \u00ed samskiptum me\u00f0 litla bi\u00f0t\u00edma. \u00deessi
  t\u00e6kni hefur ekki a\u00f0eins m\u00f6guleika \u00e1 a\u00f0 gj\u00f6rbylta n\u00fat\u00edma
  samskiptum heldur g\u00e6ti h\u00fan einnig haft varanleg \u00e1hrif \u00e1 mann\u00fa\u00f0ara\u00f0sto\u00f0.\\nNettenging
  Starlink me\u00f0 litla bi\u00f0t\u00edma er f\u00e6r um a\u00f0 skila hra\u00f0a
  allt a\u00f0 30 Mbps, sem gerir notendum kleift a\u00f0 hla\u00f0a ni\u00f0ur og
  senda miki\u00f0 magn af g\u00f6gnum me\u00f0 l\u00e1gmarks t\u00f6fum. \u00deetta
  g\u00e6ti veitt br\u00e1\u00f0nau\u00f0synlegri aukningu \u00e1 mann\u00fa\u00f0ara\u00f0sto\u00f0
  \u00fear sem \u00fea\u00f0 myndi gera hra\u00f0ari mi\u00f0lun mikilv\u00e6gra uppl\u00fdsinga.
  Til d\u00e6mis v\u00e6ri h\u00e6gt a\u00f0 deila l\u00e6knisfr\u00e6\u00f0ilegum
  g\u00f6gnum flj\u00f3tt \u00e1 milli hj\u00e1lparstarfsmanna, sem gerir kleift a\u00f0
  f\u00e1 hra\u00f0ari vi\u00f0brag\u00f0st\u00edma. A\u00f0 auki v\u00e6ri h\u00e6gt
  a\u00f0 dreifa fj\u00e1rhagsa\u00f0sto\u00f0 hra\u00f0ar og n\u00e1kv\u00e6mari
  og veita nau\u00f0synlega a\u00f0sto\u00f0 til \u00feeirra sem ver\u00f0a fyrir
  \u00e1hrifum n\u00e1tt\u00faruhamfara.\\nA\u00f0rir kostir internets me\u00f0 litla
  bi\u00f0t\u00edma g\u00e6tu einnig gagnast mann\u00fa\u00f0ara\u00f0sto\u00f0. Me\u00f0
  hra\u00f0ari tengingarhra\u00f0a hef\u00f0u hj\u00e1lparstarfsmenn a\u00f0gang a\u00f0
  \u00e1rei\u00f0anlegri samskiptum, sem gerir \u00feeim kleift a\u00f0 samr\u00e6ma
  vi\u00f0leitni s\u00edna betur. A\u00f0 auki myndi nettenging me\u00f0 litla bi\u00f0t\u00edma
  veita nau\u00f0synlegan a\u00f0gang a\u00f0 afskekktum sv\u00e6\u00f0um, sem gerir
  hj\u00e1lparstarfsm\u00f6nnum kleift a\u00f0 n\u00e1 betur til \u00feeirra sem \u00feurfa
  \u00e1 \u00fev\u00ed a\u00f0 halda.\\nL\u00edti\u00f0 leynd internet Starlink hefur
  tilhneigingu til a\u00f0 gj\u00f6rbylta mann\u00fa\u00f0ara\u00f0sto\u00f0 me\u00f0
  \u00fev\u00ed a\u00f0 veita hra\u00f0ari og \u00e1rei\u00f0anlegri a\u00f0gang a\u00f0
  mikilv\u00e6gum uppl\u00fdsingum. \u00deegar t\u00e6knin heldur \u00e1fram a\u00f0
  \u00fer\u00f3ast g\u00e6ti h\u00fan einn daginn veitt \u00feeim sem ver\u00f0a fyrir
  \u00e1hrifum n\u00e1tt\u00faruhamfara nau\u00f0synlega aukningu, sem gerir hj\u00e1lparstarfsm\u00f6nnum
  kleift a\u00f0 samr\u00e6ma vi\u00f0leitni s\u00edna betur og koma nau\u00f0synlegri
  a\u00f0sto\u00f0 til \u00feeirra sem \u00feurfa \u00e1 a\u00f0sto\u00f0 a\u00f0
  halda.\\nHvernig Starlink getur hj\u00e1lpa\u00f0 til vi\u00f0 a\u00f0 sigrast \u00e1
  truflunum \u00ed fjarskiptainnvi\u00f0um\\nStarlink, gervihnattanetkerfi \u00e1
  l\u00e1gum j\u00f6r\u00f0u sem \u00fer\u00f3a\u00f0 er af SpaceX, hefur reynst \u00f3metanlegt
  t\u00e6ki til a\u00f0 sigrast \u00e1 truflunum \u00ed fjarskiptainnvi\u00f0um. Kerfi\u00f0
  notar st\u00f3rt stj\u00f6rnukerfi gervihnatta, sem gerir \u00fev\u00ed kleift a\u00f0
  veita f\u00f3lki \u00e1rei\u00f0anlega net- og samskipta\u00fej\u00f3nustu \u00e1
  hva\u00f0a sv\u00e6\u00f0i sem er, jafnvel ef n\u00e1tt\u00faruhamfarir, hry\u00f0juverka\u00e1r\u00e1s
  e\u00f0a \u00f6nnur r\u00f6skun ver\u00f0ur.\\nGeta Starlink til a\u00f0 veita interneta\u00f0gang
  \u00e1 afskekktum og erfi\u00f0um sv\u00e6\u00f0um, sem og l\u00edtil leynd, gerir
  \u00fea\u00f0 a\u00f0 kj\u00f6rinni lausn til a\u00f0 tryggja a\u00f0 f\u00f3lk
  \u00e1 vi\u00f0komandi sv\u00e6\u00f0um geti haldi\u00f0 sambandi vi\u00f0 umheiminn.
  \u00deetta er s\u00e9rstaklega mikilv\u00e6gt \u00e1 t\u00edmum kreppu og hamfara,
  \u00feegar samskipti og uppl\u00fdsingar eru nau\u00f0synlegar fyrir \u00f6ryggis-
  og hj\u00e1lparstarf.\\nKerfi\u00f0 er einnig flj\u00f3tt a\u00f0 ver\u00f0a ein
  \u00e1rei\u00f0anlegasta netlausn fyrir dreifb\u00fdli og afskekkt samf\u00e9l\u00f6g,
  sem oft skortir a\u00f0gang a\u00f0 hef\u00f0bundnum fjarskiptainnvi\u00f0um. \u00deetta
  er s\u00e9rstaklega mikilv\u00e6gt fyrir samf\u00e9l\u00f6g \u00ed \u00fer\u00f3unarl\u00f6ndum,
  \u00fear sem a\u00f0gangur a\u00f0 internetinu getur veri\u00f0 mikilv\u00e6gur
  fyrir menntun, heilsug\u00e6slu og efnahags\u00fer\u00f3un.\\nEnnfremur, al\u00fej\u00f3\u00f0leg
  umfang Starlink og tilt\u00f6lulega l\u00e1gur kostna\u00f0ur gera \u00fea\u00f0
  a\u00f0la\u00f0andi valkostur fyrir stj\u00f3rnv\u00f6ld og fyrirt\u00e6ki sem vilja
  b\u00e6ta fjarskiptainnvi\u00f0i s\u00edna. Me\u00f0 \u00fev\u00ed a\u00f0 bj\u00f3\u00f0a
  upp \u00e1 \u00e1rei\u00f0anlega og hagkv\u00e6ma lausn getur Starlink hj\u00e1lpa\u00f0
  til vi\u00f0 a\u00f0 tryggja a\u00f0 fyrirt\u00e6ki og stj\u00f3rnv\u00f6ld geti
  haldi\u00f0 sambandi jafnvel \u00fe\u00f3tt truflanir ver\u00f0i.\\n\u00c1 heildina
  liti\u00f0 hefur Starlink reynst d\u00fdrm\u00e6tt t\u00e6ki til a\u00f0 sigrast
  \u00e1 truflunum \u00ed fjarskiptainnvi\u00f0um. Me\u00f0 \u00fev\u00ed a\u00f0
  veita a\u00f0gang a\u00f0 internetinu \u00e1 afskekktum og erfi\u00f0um sv\u00e6\u00f0um,
  auk \u00feess a\u00f0 veita \u00e1rei\u00f0anlega og hagkv\u00e6ma lausn fyrir b\u00e6tta
  fjarskiptainnvi\u00f0i, getur Starlink hj\u00e1lpa\u00f0 til vi\u00f0 a\u00f0 tryggja
  a\u00f0 f\u00f3lk geti haldi\u00f0 sambandi jafnvel \u00e1 krepput\u00edmum.\\nMat
  \u00e1 \u00e1hrifum Starlink \u00e1 afhendingu mann\u00fa\u00f0ara\u00f0sto\u00f0ar\\nSem
  aflei\u00f0ing af \u00f6rum vexti gervitunglabygg\u00f0a interneti\u00f0na\u00f0arins
  eru \u00e1hrif Starlink \u00e1 afhendingu mann\u00fa\u00f0ara\u00f0sto\u00f0ar \u00ed
  auknum m\u00e6li sko\u00f0u\u00f0.\\nStarlink er net\u00fej\u00f3nusta sem byggir
  \u00e1 gervihn\u00f6ttum sem var hleypt af stokkunum af SpaceX, geimk\u00f6nnunar-
  og geimframlei\u00f0andanum sem stofna\u00f0 var af frumkv\u00f6\u00f0linum Elon
  Musk. Me\u00f0 \u00fev\u00ed a\u00f0 bj\u00f3\u00f0a einstaklingum og fyrirt\u00e6kjum
  \u00f3d\u00fdran og h\u00e1hra\u00f0an neta\u00f0gang hefur \u00fej\u00f3nustan
  \u00feegar haft veruleg \u00e1hrif \u00e1 daglegt l\u00edf.\\nHins vegar er r\u00e9tt
  a\u00f0 byrja a\u00f0 kanna hugsanlegar aflei\u00f0ingar \u00feess fyrir afhendingu
  mann\u00fa\u00f0ara\u00f0sto\u00f0ar. Mann\u00fa\u00f0arhj\u00e1lparsamt\u00f6k
  treysta \u00e1 skj\u00f3tan, \u00e1rei\u00f0anlegan og \u00f6ruggan neta\u00f0gang
  til a\u00f0 samr\u00e6ma hamfaravi\u00f0br\u00f6g\u00f0, afhenda sj\u00fakrag\u00f6gn
  og millif\u00e6ra f\u00e9.\\nN\u00fdlegar ranns\u00f3knir hafa s\u00fdnt fram \u00e1
  a\u00f0 h\u00e1hra\u00f0a internet\u00fej\u00f3nusta Starlink g\u00e6ti skipt sk\u00f6pum
  fyrir a\u00f0sto\u00f0 vi\u00f0 afhendingu. L\u00e1ggjalda neta\u00f0gangur Starlink
  me\u00f0 gervihn\u00f6ttum g\u00e6ti veri\u00f0 mj\u00f6g gagnlegur fyrir dreifb\u00fdli
  og afskekkt sv\u00e6\u00f0i, \u00fear sem hef\u00f0bundinn neta\u00f0gangur er oft
  takmarka\u00f0ur e\u00f0a enginn. \u00dej\u00f3nustan g\u00e6ti einnig b\u00e6tt
  tengingar \u00e1 hamfarasv\u00e6\u00f0um, \u00fear sem skemmdir \u00e1 innvi\u00f0um
  geta trufla\u00f0 neta\u00f0gang.\\n\u00dear a\u00f0 auki g\u00e6ti l\u00edtil leynd
  \u00e1 gervihnattabundnu interneti Starlink gert hra\u00f0ari og \u00e1rei\u00f0anlegri
  samskipti \u00ed kreppua\u00f0st\u00e6\u00f0um. \u00deetta er s\u00e9rstaklega mikilv\u00e6gt
  fyrir fjarl\u00e6kninga\u00fej\u00f3nustuna sem ver\u00f0ur s\u00edfellt mikilv\u00e6gari
  til a\u00f0 veita l\u00e6knishj\u00e1lp \u00e1 afskekktum sv\u00e6\u00f0um.\\n\u00der\u00e1tt
  fyrir \u00feennan hugsanlega \u00e1vinning eru enn nokkur atri\u00f0i sem vekja
  \u00e1hyggjur. Til d\u00e6mis eru spurningar um hagkv\u00e6mni \u00feess a\u00f0
  nota Starlink fyrir mann\u00fa\u00f0ara\u00f0sto\u00f0. Einnig eru spurningar um
  \u00f6ryggi neta\u00f0gangs me\u00f0 gervihn\u00f6ttum, sem og m\u00f6guleika hans
  \u00e1 truflunum \u00e1 \u00f6nnur fjarskiptakerfi.\\n\u00dea\u00f0 er lj\u00f3st
  a\u00f0 frekari ranns\u00f3kna er \u00fe\u00f6rf til a\u00f0 meta \u00e1hrif Starlink
  \u00e1 afhendingu mann\u00fa\u00f0ara\u00f0sto\u00f0ar. \u00cd millit\u00ed\u00f0inni
  \u00e6ttu mann\u00fa\u00f0arsamt\u00f6k a\u00f0 vera me\u00f0vitu\u00f0 um hugsanlegan
