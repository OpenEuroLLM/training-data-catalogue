  \u00fat af veginum vi\u00f0 Hafnarfjall\\n- G\u00f3\u00f0a ve\u00f0ri\u00f0 komi\u00f0
  fyrir 17. j\u00fan\u00ed\\n- Vilja a\u00f0 vegurinn liggi um Teigssk\u00f3g\\n-
