  Springs: Vel metnar orlofseignir\\nGestir eru samm\u00e1la: \u00deessi gistia\u00f0sta\u00f0a
  er vel metin vegna sta\u00f0setningar, hreinl\u00e6tis og annars.\\nFj\u00f6lbreyttar
  orlofseignir\\nF\u00e1\u00f0u eins miki\u00f0 pl\u00e1ss og \u00fe\u00e9r hentar.\\nColorado
