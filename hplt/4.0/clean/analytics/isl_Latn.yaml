  \u00ed Skagafir\u00f0i, \u00ed K\u00fdrholti og \u00ed Hegranesi (Langt\u00edmatap
  kolefnis \u00ed framr\u00e6stu r\u00e6ktarlandi).\\nMe\u00f0altal m\u00e6linga \u00ed
  K\u00fdrholti s\u00fdndu 5,1 tn CO2 \u00e1rlega me\u00f0allosun \u00e1 ha fr\u00e1
  framr\u00e6slu fyrir 70 \u00e1rum. \u00cd Hegranesi virtist \u00e1rleg me\u00f0allosun
  1,0 tn CO2/ ha yfir 55 \u00e1ra t\u00edmabil. R\u00e9tt er a\u00f0 nefna a\u00f0
  \u00ed ranns\u00f3knum Gunnhildar voru efstu 5 cm jar\u00f0vegs \u00ed framr\u00e6sta
  landinu undanskildir og kolefnisbinding vegna r\u00e6ktunar \u00fev\u00ed raunar
  ekki inni \u00ed ni\u00f0urst\u00f6\u00f0um. \u00dev\u00ed m\u00e6lir ranns\u00f3knin
  ekki mismun nett\u00f3losunar \u00ed framr\u00e6stu og \u00f3framr\u00e6stu landi.\\nMe\u00f0altal
  \u00feessara \u00feriggja ni\u00f0ursta\u00f0na s\u00fdnir um 4,1 tn CO2/ha \u00e1rlega
