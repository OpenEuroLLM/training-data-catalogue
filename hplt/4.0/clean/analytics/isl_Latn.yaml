  af 5 \u00ed me\u00f0aleinkunn, 118 umsagnirThe Cozy Yellow Cottage\\n24. feb. \u2013
  3. mar.\\nStutt yfirgrip \u00e1 orlofseignum sem Colorado Springs hefur upp \u00e1
  a\u00f0 bj\u00f3\u00f0a\\nHeildarfj\u00f6ldi eigna\\n3,6 \u00fe. eignir\\nGisting
  me\u00f0 s\u00e9rstakri vinnua\u00f0st\u00f6\u00f0u\\n2,1 \u00fe. eignir eru me\u00f0
  s\u00e9rstaka vinnua\u00f0st\u00f6\u00f0u\\nGisting me\u00f0 sundlaug\\n120 eignir
  me\u00f0 sundlaug\\nG\u00e6lud\u00fdrav\u00e6n gisting\\n1,2 \u00fe. g\u00e6lud\u00fdrav\u00e6nar
  eignir\\nFj\u00f6lskylduv\u00e6n gisting\\n2,2 \u00fe. fj\u00f6lskylduv\u00e6nar
  eignir\\nHeildarfj\u00f6ldi umsagna\\n199 \u00fe. umsagnir\"", "\"Alls er keppt
  \u00ed 37 greinum karla og kvenna. Auk \u00feess sem sigurvegari \u00ed hverri grein
  hl\u00fdtur \u00cdslandsmeistaratitil, hlj\u00f3ta stigah\u00e6stu li\u00f0in \u00ed
  karla- og kvennaflokki og sameiginlega s\u00e9rstakar vi\u00f0urkenningar. Einnig
  ver\u00f0a veittar s\u00e9rstakar vi\u00f0urkenningar til \u00feeirra konu og karls
  sem vinna bestu afrekin \u00e1 m\u00f3tinu, skv. al\u00fej\u00f3\u00f0legri stigat\u00f6lfu.\\nFlest
  okkar besta f\u00f3lk m\u00e6tir til leiks, \u00fear \u00e1 me\u00f0al \u00c1rmenningarnir
  \u00feau \u00c1sd\u00eds Hj\u00e1lmsd\u00f3ttir (spj\u00f3tkast) og \u00d3\u00f0inn
  Bj\u00f6rn \u00deorsteinsson (k\u00faluvarp). An\u00edta Hinriksd\u00f3ttir sem
  var\u00f0 Heimsmeistari 17 \u00e1ra og yngri og Evr\u00f3pumeistari 19 \u00e1ra
  og yngri \u00ed 800 m hlaupi \u00ed fyrra sumar mun hlaupa 1500 m \u00e1 m\u00f3tinu
  og gera \u00fear atl\u00f6gu a\u00f0 \u00cdslandsmeti Ragnhei\u00f0ar \u00d3lafsd\u00f3ttur,
  4:14,94 m\u00edn, fr\u00e1 \u00e1rinu 1987. Hafd\u00eds Sigur\u00f0ard\u00f3ttir
  tekur \u00fe\u00e1tt \u00ed 5 greinum \u00e1 m\u00f3tinu. \u00cd langst\u00f6kki
  mun h\u00fan reyna vi\u00f0 l\u00e1gmark \u00e1 Evr\u00f3pumeistaram\u00f3ti\u00f0
  sem fer fram \u00ed Z\u00fcrich seinna i sumar og \u00ed \u00fer\u00edst\u00f6kki
  mun h\u00fan gera atl\u00f6gu a\u00f0 \u00cdslandmeti Sigr\u00ed\u00f0ar \u00d6nnu
  Gu\u00f0j\u00f3nsd\u00f3ttur fr\u00e1 \u00e1rinu 1997 og er 13,18 m. Hafd\u00eds
  mun jafnframt hlaupa 100 m hlaup, 200 m hlaup og 400 m hlaup. Einnig m\u00e6ta til
  leiks \u00ferautarf\u00f3lki\u00f0 \u00feau Sveinbj\u00f6rg Zophon\u00edasd\u00f3ttir
  \u00far FH og Einar Da\u00f0i L\u00e1russon \u00far \u00cdR. Einar Da\u00f0i mun
  keppa \u00ed 5 einstaklingsgreinum og Sveinbj\u00f6rg \u00ed 4.\\nMeistaram\u00f3ti\u00f0
  ver\u00f0ur s\u00ed\u00f0asta m\u00f3t \u00feeirra sem fara \u00e1 Heimsmeistaram\u00f3t
  19 \u00e1ra og yngri sem fer fram \u00ed Eugene, Oregon, 20. \u2013 27. j\u00fal\u00ed
  en meiri hluti h\u00f3psins heldur utan strax \u00e1 m\u00e1nudag. \u00deetta eru
  \u00feau Hilmar \u00d6rn J\u00f3nsson, \u00cdR, sem keppir \u00ed sleggjukasti karla,
  Sindri Hrafn Gu\u00f0mundsson \u00far Brei\u00f0abliki sem m\u00e6tir \u00cdR-ingnum
  og EM faranum Gu\u00f0mundi Sverrissyni \u00ed spj\u00f3tkasti og spretthlaupararnir
  J\u00f3hann Bj\u00f6rn Sigurbj\u00f6rnsson \u00far UMSS og Kolbeinn H\u00f6\u00f0ur
  Gunnarsson \u00far UFA. Einnig er An\u00edta me\u00f0al HM faranna en h\u00fan keppir
  \u00ed 800 m hlaupi i Eugene.\\nN\u00e1nari uppl\u00fdsingar er a\u00f0 finna \u00e1
  m\u00f3taforriti FR\u00cd og \u00farslit ver\u00f0a birt beint \u00e1 netinu\"",
  "\"Erf\u00f0av\u00edsir\\nErf\u00f0av\u00edsir e\u00f0a gen er b\u00fatur DKS kjarns\u00fdrunnar,
  sem inniheldur uppl\u00fdsingar um byggingu og eiginleika einstakra st\u00f3rsameinda
  og \u00fear me\u00f0 eiginleika fruma og l\u00edfveru. Erfitt hefur reynst a\u00f0
  skilgreina Gen. Lengi voru gen skilgreind sem s\u00e1 hluti erf\u00f0aefnis sem
  var umrita\u00f0ur yfir \u00ed RNA, sem var s\u00ed\u00f0an \u00fe\u00fdtt \u00ed
  pr\u00f3t\u00edn, og au\u00f0vita\u00f0 \u00fe\u00e6r ra\u00f0ir sem nau\u00f0synlegar
  voru fyrir stj\u00f3rn \u00e1 umritun, verkun og tj\u00e1ningu. Ranns\u00f3knir
  s\u00fdna a\u00f0 sum gen eru ekki \u00fe\u00fddd \u00ed pr\u00f3t\u00edn, \u00fear
  sem RNA afrit af \u00feeim \\\"starfa\\\" \u00ed frumunni. Til \u00feessa h\u00f3ps
  tilheyra tRNA gen, rRNA gen, snRNA gen og s\u00ed\u00f0an n\u00fduppg\u00f6tva\u00f0ar
  sameindir sem kallast ncRNA (non coding RNA). Undir \u00feetta falla miRNA, piwiRNA
  og lincRNA.\"", "\"Um svi\u00f0setningu \u00deorleifs Arnar Arnarssonar \u00e1 Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki \u00ed \u00dej\u00f3\u00f0leikh\u00fasinu 2014.\\nGreinin er bygg\u00f0
  \u00e1 fyrirlestri sem haldinn var \u00ed Leikh\u00faskaffi \u00ed Ger\u00f0ubergi
  25.febr\u00faar 2015 \u00fear sem spjalla\u00f0 var um leiks\u00fdninguna.\\n\u00deegar
  fjalla \u00e1 um leiks\u00fdninguna Sj\u00e1lfst\u00e6tt f\u00f3lk sem frums\u00fdnd
  var \u00e1 j\u00f3lum 2014 \u00ed \u00dej\u00f3\u00f0leikh\u00fasinu, ver\u00f0ur
  a\u00f0 hafa \u00ed huga a\u00f0 h\u00fan er sj\u00e1lfst\u00e6tt listaverk sem
  bygg\u00f0 er \u00e1 \u00feremur meginsto\u00f0um. \u00cd fyrsta lagi byggir verki\u00f0
  \u00e1 samnefndri sk\u00e1lds\u00f6gu Halld\u00f3rs Laxness, \u00ed \u00f6\u00f0ru
  lagi \u00e1 leikger\u00f0 sem \u00fer\u00edr h\u00f6fundar eru skrifa\u00f0ir fyrir,
  \u00feeir Atli Rafn Sigur\u00f0arson, \u00d3lafur Egill Egilsson og S\u00edmon Birgisson
  og \u00ed \u00feri\u00f0ja lagi \u00e1 svi\u00f0setningu og leikstj\u00f3rn leikstj\u00f3rans.
  A\u00f0 b\u00faa til leiks\u00fdningu upp \u00far jafn margradda og marglaga b\u00f3k
  sem \u00fear a\u00f0 auki hefur or\u00f0i\u00f0 langa vi\u00f0t\u00f6kuhef\u00f0
  \u00ed menningu okkar, hl\u00fdtur a\u00f0 vera fl\u00f3ki\u00f0 ferli ekki s\u00edst
  \u00feegar haft er \u00ed huga a\u00f0 h\u00f6fundarnir kj\u00f3sa a\u00f0 spanna
  allar fj\u00f3rar b\u00e6kur s\u00f6gu Halld\u00f3rs \u00e1 einu s\u00fdningarkv\u00f6ldi.
  H\u00f6fundar leikger\u00f0arinnar velja \u00e1kve\u00f0i\u00f0 sj\u00f3narhorn
  \u00e1 st\u00f3rvirki Halld\u00f3rs, hva\u00f0a s\u00f6gu \u00e1 a\u00f0 draga saman
  til s\u00fdningar \u00e1 leiksvi\u00f0inu, stytta textann og ra\u00f0a honum upp
  \u00e1 n\u00fdtt og mynda \u00feannig leikh\u00e6ft s\u00fdningarhandrit. \u00cd
  stuttu m\u00e1li leggja \u00feeir \u00e1herslu \u00e1 fj\u00f6lskylduharmleik Bjarts
  og \u00e1takanleg samskipti hans vi\u00f0 s\u00edna n\u00e1nustu, heimilishar\u00f0stj\u00f3rann
  og k\u00fagarann Bjart. \u00deegar leikger\u00f0in er lesin er alls ekki h\u00e6gt
  a\u00f0 sj\u00e1 fyrir s\u00e9r s\u00fdninguna sem s\u00ed\u00f0an var\u00f0 til
  \u00e1 leiksvi\u00f0inu, enda eru engar lei\u00f0beiningar hvorki til leikstj\u00f3ra
  n\u00e9 annarra h\u00f6funda og leikara uppf\u00e6rslunnar, engar \u00fatsk\u00fdringar
  um \u00fatf\u00e6rslu \u00e1 leiksvi\u00f0inu, a\u00f0eins texti Halld\u00f3rs.
  \u00cd honum felst a\u00f0 sj\u00e1lfs\u00f6g\u00f0u a\u00f0alinneignin fyrir svi\u00f0sh\u00f6fundana
  ef ekki fj\u00e1rsj\u00f3\u00f0ur og innihald hans \u00fearf ekki a\u00f0 t\u00edunda
  h\u00e9r, flestir \u00e6ttu a\u00f0 \u00feekkja hann. Inneign svi\u00f0sh\u00f6fundanna
  var\u00f0ar fyrst og fremst leiktextann sj\u00e1lfan og hugmyndir a\u00f0 leikgj\u00f6rningum
  og \u00fatf\u00e6rslu \u00e1 leiksvi\u00f0inu eins og s\u00ed\u00f0ar ver\u00f0ur
  viki\u00f0 a\u00f0. Me\u00f0fer\u00f0 og t\u00falkun \u00e1 efni og pers\u00f3num
  Halld\u00f3rs er hinsvegar alfari\u00f0 \u00e1 hendi svi\u00f0sh\u00f6fundanna og
  leikaranna. \u00dea\u00f0 er \u00feeirra a\u00f0 skapa lifandi listaverk upp \u00far
  textanum \u00e1 leiksvi\u00f0inu. Svi\u00f0setningin sj\u00e1lf ver\u00f0ur \u00fev\u00ed
  allt annar vefur en b\u00e6\u00f0i textavefur leikger\u00f0arinnar og b\u00f3karinnar.
  H\u00e9r er or\u00f0i\u00f0 vefur nota\u00f0 sem anna\u00f0 heiti yfir \u00feann
  texta sem leiks\u00fdningin er en hann er jafnframt \u00fe\u00fd\u00f0ing \u00e1
  leiktexta yfir \u00ed svi\u00f0stexta.\\nFyrir \u00e1hugaf\u00f3lk um leikh\u00fas
  er afar freistandi a\u00f0 r\u00fdna \u00ed \u00feennan vef me\u00f0 augum s\u00fdningargreiningar,
  \u00fe.e. a\u00f0 sko\u00f0a fagurfr\u00e6\u00f0i, hugsun og stefnu svi\u00f0setningarinnar
  \u00e1 hennar eigin forsendum og sem sj\u00e1lfst\u00e6tt listaverk. Til \u00feess
  \u00fearf a\u00f0 horfa oft \u00e1 vi\u00f0komandi s\u00fdningu, leyfa s\u00e9r
  a\u00f0 greina svi\u00f0slausnir me\u00f0 a\u00f0fer\u00f0um svi\u00f0slistafr\u00e6\u00f0a,
  gera tilraun til a\u00f0 t\u00falka \u00fea\u00f0 sem fyrir augu ber, \u00fev\u00ed
  leikh\u00fasi\u00f0 sem listform er \u00fer\u00e1tt fyrir allt lifandi sj\u00f3nr\u00e6nn
  mi\u00f0ill eins og fram kemur \u00ed upprunalega gr\u00edska or\u00f0inu \u201e\u00feeatr\u00f3\u201c,
  sem er dregi\u00f0 af s\u00f6gninni a\u00f0 sj\u00e1 (1). \u00deetta vill oft gleymast
  \u00ed umfj\u00f6llun gagnr\u00fdnenda sem sitja fastir \u00ed greiningu \u00e1
  skrifa\u00f0a leiktextanum en eiga erfi\u00f0ara me\u00f0 a\u00f0 sj\u00e1 og greina
  gildi sj\u00f3narspilsins sem leikstj\u00f3rinn og hans listr\u00e6na teymi eru
  \u00e1byrg fyrir. \u00deetta \u00e1 hvergi betur vi\u00f0 en \u00feegar leikger\u00f0ir
  eru samdar upp \u00far jafn \u00feekktum og umdeildum sk\u00e1lds\u00f6gum og Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki; \u00fev\u00ed allir vildu Bjart kve\u00f0i\u00f0 hafa. Hann er ekki
  a\u00f0eins trag\u00edsk hetja sem allir hafa s\u00edna sko\u00f0un \u00e1 og \u00feykjast
  \u00feekkja \u00fat \u00ed gegn, \u00fej\u00f3\u00f0areign sem vitna\u00f0 er til
  vi\u00f0 \u00fdmis t\u00e6kif\u00e6ri jafnt \u00ed listum sem p\u00f3lit\u00edk,
  heldur er hann n\u00e1nast helgimynd.\\n\u00deannig m\u00e1 segja a\u00f0 b\u00e6\u00f0i
  b\u00f3kin Sj\u00e1lfst\u00e6tt f\u00f3lk, a\u00f0alpers\u00f3na hennar Bjartur
  \u00ed Sumarh\u00fasum svo og h\u00f6fundurinn Halld\u00f3r Laxness hafi fengi\u00f0
  \u00e1 sig helgimyndarstimpil og vissan r\u00e9tttr\u00fana\u00f0 me\u00f0al almennings\\nMe\u00f0
  or\u00f0inu helgimynd sem er \u00fe\u00fd\u00f0ing \u00e1 gr\u00edska or\u00f0inu
  \u201e\u00edkon\u201c, er \u00e1tt vi\u00f0 yfirf\u00e6r\u00f0a merkingu hugtaksins
  \u00e1 okkar d\u00f6gum en \u00fea\u00f0 er nota\u00f0 um \u00fdmis menningarleg
  fyrirb\u00e6ri og einstaklinga sem ver\u00f0a \u00e1berandi \u00ed \u00fej\u00f3\u00f0f\u00e9lagi
  og fj\u00f6lmi\u00f0lum. \u00deannig m\u00e1 segja a\u00f0 b\u00e6\u00f0i b\u00f3kin
  Sj\u00e1lfst\u00e6tt f\u00f3lk, a\u00f0alpers\u00f3na hennar Bjartur \u00ed Sumarh\u00fasum
  svo og h\u00f6fundurinn Halld\u00f3r Laxness hafi fengi\u00f0 \u00e1 sig helgimyndarstimpil
  og vissan r\u00e9tttr\u00fana\u00f0 me\u00f0al almennings. \u00cd helgimyndinni
  felast fastm\u00f3ta\u00f0ar hugmyndir og vi\u00f0teknar sko\u00f0anir um vi\u00f0komandi
  listamann e\u00f0a listaverk, jafnvel tilbei\u00f0sla. S\u00e1 sem fer gegn \u00feeim
  sko\u00f0unum er \u00fev\u00ed kalla\u00f0ur helgimyndabrj\u00f3tur af \u00fev\u00ed
  hann r\u00eds upp gegn vi\u00f0teknum vi\u00f0horfum og r\u00e9tttr\u00fana\u00f0i
  \u00e1 tilteknum menningarlegum fyrirb\u00e6rum.\\nMiskunnarleysi vi\u00f0 vi\u00f0fangsefni\u00f0\\nH\u00f6fundarnir
  a\u00f0 leiks\u00fdningu \u00dej\u00f3\u00f0leikh\u00fassins \u00e1 Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki h\u00f6f\u00f0u m\u00f6guleika \u00e1 a\u00f0 kynna s\u00e9r fyrri leikger\u00f0ir
  og uppsetningar bygg\u00f0ar \u00e1 b\u00f3k Halld\u00f3rs, margv\u00edslegar t\u00falkanir
  og hugmyndir um s\u00f6guna, ekki s\u00edst a\u00f0als\u00f6guhetjuna Bjart en kusu
  a\u00f0 n\u00e1lgast efnivi\u00f0inn me\u00f0 \u00f6\u00f0rum h\u00e6tti \u00fear
  sem fj\u00f6lskyldusaga Bjarts, samskipti hans vi\u00f0 s\u00edna n\u00e1nustu eru
  h\u00f6f\u00f0 \u00ed brennidepli. \u00deeir ger\u00f0ust helgimyndabrj\u00f3tar,
  risu ekki a\u00f0eins upp gegn vi\u00f0teknum sko\u00f0unum \u00e1 Bjarti og s\u00f6gu
  hans, heldur einnig gegn vi\u00f0teknum sko\u00f0unum um leikh\u00fasi\u00f0 og
  leikara \u00feess, sem eru l\u00edka helgimyndir \u00ed augum almennings \u00ed
  merkingunni h\u00e9r a\u00f0 ofan. Um \u00feetta segir leikstj\u00f3rinn \u00deorleifur
  m.a. \u00ed leikskr\u00e1:\\n\u00cd \u00feessari s\u00fdningu \u00e1 Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki er m\u00edn kynsl\u00f3\u00f0 a\u00f0 r\u00edsa gegn \u00e1kve\u00f0num
  hugmyndum og hef\u00f0 og \u00fea\u00f0 er kjarninn \u00ed \u00feessari s\u00fdningu.
  S\u00fa t\u00falkun okkar \u00e1 Sj\u00e1lfst\u00e6\u00f0u f\u00f3lki sem mun blasa
  vi\u00f0 \u00e1 leiksvi\u00f0inu er sprottin upp \u00far okkar samt\u00edma, og
  hef\u00f0i a\u00f0 \u00f6llum l\u00edkindum ekki komi\u00f0 fram fyrr. Gott leikh\u00fas
  er miskunnarlaust vi\u00f0 vi\u00f0fangsefni sitt, samf\u00e9lagi\u00f0 og t\u00edmann.\\nS\u00fa
  spurning sem \u00f3neitanlega vaknar h\u00e9r, er hvort \u00deorleifi Erni Arnarsyni
  hafi tekist a\u00f0 b\u00faa til gott leikh\u00fas me\u00f0 miskunnarleysi s\u00ednu
  gagnvart vi\u00f0fangsefninu? Og \u00fe\u00e1 hva\u00f0a merkingu ber a\u00f0 leggja
  \u00ed \u201egott leikh\u00fas\u201c? Er gott leikh\u00fas f\u00f3lgi\u00f0 \u00ed
  \u00fev\u00ed miskunnarleysi sem \u00fearf til a\u00f0 brj\u00f3ta ni\u00f0ur helgimyndir
  \u00feess?\\nFyrsta helgimyndabrot leikstj\u00f3rans \u00ed \u00feessu tilviki er
  vali\u00f0 \u00e1 a\u00f0alleikaranum sem \u00fearf a\u00f0 bera s\u00fdninguna
  uppi, \u00fe.e. hlutverk Bjarts, sem allir hafa fastm\u00f3ta\u00f0ar sko\u00f0anir
  \u00e1. Atli Rafn Sigur\u00f0arson er ekki \u00fea\u00f0 tr\u00f6ll a\u00f0 bur\u00f0um
  sem f\u00f3lk tengir gjarnan vi\u00f0 b\u00f3ndann \u00ed Sumarh\u00fasum og fyllir
  ekki vi\u00f0 fyrstu s\u00fdn upp \u00ed \u00fe\u00e1 mynd sem f\u00f3lk hefur um
  \u00feann leikara sem leika \u00e1 \u00feessa helgimynd jafnvel \u00fe\u00f3tt ekki
  s\u00e9 miki\u00f0 um l\u00fdsingar \u00e1 l\u00edkamlegu atgervi hans af h\u00e1lfu
  Halld\u00f3rs. Reyndar er engar beinar l\u00fdsingar a\u00f0 finna \u00e1 \u00fatliti
  Bjarts, \u00e1 einum sta\u00f0 er hann \u00fe\u00f3 sag\u00f0ur brei\u00f0axla og
  me\u00f0 tr\u00f6llslegar hendur og skegg \u00ed andliti. Og kannski fyllir Atli
  Rafn ekki heldur upp \u00ed myndina af \u00feeim st\u00f3rleikurum sem hafa leiki\u00f0
  Bjart \u00e1 undan honum eins og R\u00f3bert Arnfinnsson, Arnar J\u00f3nsson og
  Ingvar Sigur\u00f0sson. Atli Rafn er engu a\u00f0 s\u00ed\u00f0ur einn af helstu
  \u201est\u00f3rleikurum\u201c sinnar kynsl\u00f3\u00f0ar og hefur \u00e1\u00f0ur
  leiki\u00f0 a\u00f0alhlutverk \u00ed uppf\u00e6rslu \u00deorleifs Arnar \u00e1 Englum
  alheimsins sem hlaut miki\u00f0 lof gagnr\u00fdnenda og miklar vins\u00e6ldir \u00e1horfenda
  (2).\\nAnna\u00f0 helgimyndabrot leikstj\u00f3rans og leikmyndah\u00f6fundar, Vytautas
  Narbutis, felst \u00ed umgj\u00f6r\u00f0 leiks\u00fdningarinnar, m\u00farnum sem
  umlykur kotb\u00fdli Bjarts \u00fear sem fegur\u00f0 \u00edslenskrar n\u00e1tt\u00faru
  eins og Halld\u00f3r l\u00fdsir henni er fjarverandi, lj\u00f3tleikinn allsr\u00e1\u00f0andi
  og \u00e1horfendur snu\u00f0a\u00f0ir um allt \u00fea\u00f0 sem einkennir \u00edslenska
  \u00f6r\u00e6fafegur\u00f0, v\u00ed\u00f0\u00e1ttu og fjarl\u00e6g\u00f0ina sem
  gerir fj\u00f6llin bl\u00e1 og mennina mikla. \u00deri\u00f0ja helgimyndabroti\u00f0
  felst s\u00ed\u00f0an \u00ed a\u00f0 leyfa s\u00e9r a\u00f0 tengja efnahags\u00e1standi\u00f0
  \u00e1 \u00cdslandi \u00e1 undanf\u00f6rnum \u00e1rum vi\u00f0 velti\u00e1rin sem
  Halld\u00f3r Laxness l\u00fdsir \u00ed fj\u00f3r\u00f0u b\u00f3kinni af Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki me\u00f0 \u00fdmis konar upp\u00e1t\u00e6kjum, v\u00edsunum \u00ed samt\u00edmann
  og spuna. \u00deegar betur er r\u00fdnt \u00ed h\u00f6fundarverk leikstj\u00f3rans
  og \u00fe\u00e6r a\u00f0fer\u00f0ir sem hann hefur beitt til \u00feess a\u00f0 hr\u00f3fla
  vi\u00f0 r\u00e9tttr\u00fana\u00f0i og helgimyndum kemur \u00ed lj\u00f3s a\u00f0
  miskunnarleysi hans vi\u00f0 vi\u00f0fangsefni\u00f0 \u00e1 fyrst og s\u00ed\u00f0ast
  r\u00e6tur a\u00f0 rekja til \u00feess miskunnarleysis sem Halld\u00f3r Laxness
  sj\u00e1lfur s\u00fdndi eigin vi\u00f0fangsefni. H\u00e9r er \u00fea\u00f0 einungis
  gert s\u00fdnilegra en nokkru sinni fyrr. Sj\u00e1lfst\u00e6tt f\u00f3lk \u00e1
  leiksvi\u00f0inu ver\u00f0ur fyrst og fremst a\u00f0 hryllingss\u00f6gu \u00ed Sumarh\u00fasum
  sem Halld\u00f3r var fyrstur til a\u00f0 skapa.\\nSegja m\u00e1 a\u00f0 sonurinn
  fremji \u00fev\u00ed t\u00e1knr\u00e6nt f\u00f6\u00f0urmor\u00f0 me\u00f0 \u00fev\u00ed
  a\u00f0 h\u00e6\u00f0ast a\u00f0 st\u00f3rleikaranum sem er farinn a\u00f0 spila
  golf \u00e1 gamals aldri og augl\u00fdsir temp\u00fard\u00fdnur fyrir bakveika g\u00f3\u00f0borgara.\\nEins
  og \u00e1\u00f0ur sag\u00f0i er varla a\u00f0 finna eitt or\u00f0 e\u00f0a \u00e1bendingu
  til leikstj\u00f3rans \u00ed leikger\u00f0inni um hvernig beri a\u00f0 svi\u00f0setja
  textann og a\u00f0eins \u00e1 einum sta\u00f0 er b\u00e6tt inn texta \u00ed hina
  skrifu\u00f0u leikger\u00f0 sem ekki er eftir Halld\u00f3r sj\u00e1lfan. Um er a\u00f0
  r\u00e6\u00f0a texta \u00ed fyrsta hluta verksins (Landn\u00e1msma\u00f0ur \u00cdslands)
  \u00fear sem Bjartur er l\u00e1tinn segja: \u201eV\u00e6ri \u00e9g ekki sk\u00e1ld,
  v\u00e6ri \u00e9g ge\u00f0sj\u00faklingur\u201c og b\u00e6ndurnir Einar \u00ed Undirhl\u00ed\u00f0
  (Eggert \u00deorleifsson) og \u00d3lafur \u00ed Ystadal (P\u00e1lmi Gestsson) spyrja
  leikarann Atla Rafn hvort hann s\u00e9 ekki a\u00f0 leika \u00ed vitlausu leikriti
  og uppskera hl\u00e1tur \u00e1horfenda sem allir eru me\u00f0 \u00e1 n\u00f3tunum
  eftir a\u00f0 Atli Rafn sl\u00f3 \u00ed gegn sem P\u00e1ll \u00ed Englum alheimsins
  en \u00fear var sami leikstj\u00f3ri \u00e1 fer\u00f0 og s\u00f6mu leikger\u00f0arh\u00f6fundar,
  a\u00f0 \u00d3lafi Agli Egilssyni undanskildum. A\u00f0 v\u00edsu bresta leikarar
  s\u00ed\u00f0ar \u00fat \u00ed spunaleik og leyfa s\u00e9r \u00fe\u00e1 a\u00f0
  gantast me\u00f0 nokkrar helgimyndir \u00far leikh\u00fasinu eins og Arnar J\u00f3nsson
  (Hreppstj\u00f3rinn \u00e1 \u00datirau\u00f0sm\u00fdri) sem er ekki a\u00f0eins
  \u00fej\u00f3\u00f0leikari heldur \u00fej\u00f3\u00f0r\u00f6dd sem augl\u00fdsingai\u00f0na\u00f0urinn
  \u00edslenski hefur virkja\u00f0 af alefli \u00ed s\u00edna \u00fe\u00e1gu. Leikstj\u00f3rinn
  \u00deorleifur \u00d6rn, er sonur Arnars J\u00f3nssonar og \u00ed leikskr\u00e1
  s\u00fdningarinnar gerir hann m.a. grein fyrir \u00fev\u00ed a\u00f0 me\u00f0 uppsetningunni
  \u00e1 Sj\u00e1lfst\u00e6\u00f0u f\u00f3lki vilji hann brj\u00f3ta ni\u00f0ur \u00fe\u00e1
  leikh\u00fashef\u00f0 sem fa\u00f0ir hans hefur veri\u00f0 hluti af undanfarna \u00e1ratugi
  sem fastr\u00e1\u00f0inn leikari vi\u00f0 \u00dej\u00f3\u00f0leikh\u00fasi\u00f0
  og v\u00edsar \u00fe\u00e1 l\u00edklegast til \u00feess a\u00f0 Arnar J\u00f3nsson
  l\u00e9k Bjart \u00ed tveggja hluta leikger\u00f0 eftir s\u00f6gunni 1997 (3). Segja
  m\u00e1 a\u00f0 sonurinn fremji \u00fev\u00ed t\u00e1knr\u00e6nt f\u00f6\u00f0urmor\u00f0
  me\u00f0 \u00fev\u00ed a\u00f0 h\u00e6\u00f0ast a\u00f0 st\u00f3rleikaranum sem
  er farinn a\u00f0 spila golf \u00e1 gamals aldri og augl\u00fdsir temp\u00fard\u00fdnur
  fyrir bakveika g\u00f3\u00f0borgara. Kaldh\u00e6\u00f0ni sonarins ver\u00f0ur enn
  sk\u00fdrari \u00feegar haft er \u00ed huga a\u00f0 Arnar tilheyr\u00f0i \u00e1
  yngri \u00e1rum einum helsta kjarna r\u00f3tt\u00e6kra svi\u00f0slistamanna \u00e1samt
  eiginkonu sinni \u00de\u00f3rhildi \u00deorleifsd\u00f3ttur leikstj\u00f3ra. Saman
  stofnu\u00f0u \u00feau m.a. Al\u00fe\u00fd\u00f0uleikh\u00fasi\u00f0 en \u00fea\u00f0
  var hugsa\u00f0 sem frams\u00e6ki\u00f0 p\u00f3lit\u00edskt leikh\u00fas og andsvar
  vi\u00f0 \u00fareltum og gamaldags hef\u00f0um \u00ed \u00edslensku samf\u00e9lagi
  og leikh\u00fasi.\\nLeikh\u00fas sem v\u00edsar \u00ed sj\u00e1lft sig\\nMe\u00f0
  \u00feessu upp\u00e1t\u00e6ki \u00deorleifs sk\u00edn \u00ed metaleikh\u00fasi\u00f0
  svokalla\u00f0a, erfingjar leikh\u00fassins (sem eru reyndar fleiri en \u00deorleifur
  \u00d6rn eins og viki\u00f0 ver\u00f0ur a\u00f0 s\u00ed\u00f0ar) gera athugasemdir
  vi\u00f0 framlag foreldranna sem eru ekki lengur jafn byltingarsinna\u00f0ir \u00ed
  listinni og \u00feeir voru. Me\u00f0 metaleikh\u00fasi er \u00e1tt vi\u00f0 leikh\u00fas
  sem storkar og \u00f6grar hef\u00f0bundnum hugmyndum okkar um hi\u00f0 dramat\u00edska
  leikh\u00fas \u00fear sem leikpers\u00f3nur og athafnir \u00feeirra virka sem spegill
  \u00e1 gj\u00f6r\u00f0ir, tilfinningar og \u00fej\u00e1ningar \u00e1horfenda. Metaleikh\u00fasi\u00f0
  er hugtak sem kom fram snemma \u00e1 sj\u00f6unda \u00e1ratug s\u00ed\u00f0ustu
  aldar, sm\u00ed\u00f0a\u00f0 af bandar\u00edska leikh\u00fasmanninum Lionel Abel
  en hann var b\u00e6\u00f0i leiksk\u00e1ld og gagnr\u00fdnandi. Metaleikh\u00fasi\u00f0
  v\u00edsar \u00ed sj\u00e1lft sig, br\u00fdtur oft ni\u00f0ur \u00f3s\u00fdnilegan
  vegginn (oft nefndur fj\u00f3r\u00f0i veggurinn) milli leiksvi\u00f0s og \u00e1horfenda,
  \u00e1varpar \u00fe\u00e1 og blandar \u00feeim gjarnan inn \u00ed leikinn \u00e1
  svi\u00f0inu. Metaleikh\u00fasi\u00f0 er \u00fev\u00ed \u00e1kve\u00f0in a\u00f0fer\u00f0
  vi\u00f0 sk\u00f6pun leiks\u00fdningar (4).\\nLeikh\u00fasi\u00f0 er fyrirb\u00e6ri/listform
  sem l\u00fdtur eigin l\u00f6gm\u00e1lum, vettvangur \u00fear sem h\u00e6gt er a\u00f0
  s\u00fdna okkur \u00ed sm\u00e6kka\u00f0ri mynd s\u00fdnishorn af s\u00f6gu, samf\u00e9lagi,
  sj\u00e1lfsmynd og heimsmynd mannkyns me\u00f0 \u00fdmiss konar a\u00f0fer\u00f0um.
  Listamenn leikh\u00fassins hafa vali\u00f0 leikh\u00fasi\u00f0 sem vettvang til
  a\u00f0 tj\u00e1 sig um heiminn og upplifun s\u00edna af honum (reynslu/tilfinningar)
  og vita undirni\u00f0ri a\u00f0 leikh\u00fasi\u00f0 er takm\u00f6rkunum h\u00e1\u00f0
  af \u00fev\u00ed a\u00f0 \u00fea\u00f0 er blekking, tilb\u00fainn gerviveruleiki
  sem getur aldrei endurspegla\u00f0 \u00feann st\u00f3ra veruleika sem r\u00edkir
  utan \u00feess, ekkert frekar en veruleika heillar sk\u00e1lds\u00f6gu \u00e1 bor\u00f0
  vi\u00f0 Sj\u00e1lfst\u00e6tt f\u00f3lk.\\nH\u00f6fundar Sj\u00e1lfst\u00e6\u00f0s
  f\u00f3lks eru s\u00e9r fyllilega me\u00f0vita\u00f0ir um \u00feessa sta\u00f0reynd
  og nota hana sem a\u00f0fer\u00f0 til tj\u00e1ningar \u00e1 s\u00f6guefni s\u00ednu.
  \u00deeir hafa s\u00fdnt \u00fea\u00f0 \u00e1\u00f0ur eins og \u00ed Englum alheimsins
  \u00fear sem \u00e1horfendum var hva\u00f0 eftir anna\u00f0 ger\u00f0 grein fyrir
  a\u00f0 \u00feeir v\u00e6ru staddir \u00ed \u00dej\u00f3\u00f0leikh\u00fasinu sem
  a\u00f0alpers\u00f3nan, ge\u00f0sj\u00faklingurinn P\u00e1ll, haf\u00f0i leigt til
  a\u00f0 segja s\u00f6gu s\u00edna \u2013 Afhverju \u00e6tti ge\u00f0sj\u00faklingur
  ekki a\u00f0 geta leigt \u00dej\u00f3\u00f0leikh\u00fasi\u00f0 til a\u00f0 fagna
  sj\u00e1lfum s\u00e9r eins og bankastj\u00f3rinn fyrrverandi sem h\u00e9lt upp \u00e1
  afm\u00e6li sitt \u00fear og f\u00e9kk til li\u00f0s vi\u00f0 sig \u00f3tal listamenn.
  Hugmyndin um a\u00f0 leigja \u00dej\u00f3\u00f0leikh\u00fasi\u00f0 undir s\u00edna
  eigin \u00e6vis\u00f6gu er kannski fengin \u00fea\u00f0an? S\u00f6mulei\u00f0is
  m\u00e1tti finna r\u00edka me\u00f0vitund sama leikstj\u00f3ra um blekkingare\u00f0li
  leikh\u00fassins \u00ed svi\u00f0setningu hans \u00e1 P\u00e9tri Gaut \u00e1 Listah\u00e1t\u00ed\u00f0
  2012, s\u00fdningu sem kom hinga\u00f0 fr\u00e1 Sviss. M\u00f6rgum kann a\u00f0
  \u00feykja \u00feetta helst til sj\u00e1lfhverft og fullmikil endurtekning hj\u00e1
  leikstj\u00f3ranum, jafnvel klisja og \u00fea\u00f0 m\u00e1 til sanns vegar f\u00e6ra.
  Leikstj\u00f3rinn vill minna sj\u00e1lfan sig \u00e1 a\u00f0 hann er fyrst og fremst
  leikh\u00fasma\u00f0ur sem \u00e1 r\u00e6tur a\u00f0 rekja til leikh\u00fassins,
  hann ver\u00f0ur a\u00f0 taka uppruna sinn \u00ed s\u00e1tt og gera sig gildandi
  sem sj\u00e1lfst\u00e6\u00f0an leikh\u00fasmann \u00f3h\u00e1\u00f0 arfleif\u00f0
  og helgimynd foreldranna. Fa\u00f0irinn hefur leiki\u00f0 P\u00e9tur Gaut og m\u00f3\u00f0irin
  sett \u00fea\u00f0 \u00e1 svi\u00f0 \u00ed sama leikh\u00fasi. \u00c1 vissan h\u00e1tt
  m\u00e1 skynja \u00feessa tilhneigingu til a\u00f0 skilja sig fr\u00e1 foreldrum
  s\u00ednum og fj\u00f6lskyldu b\u00e6\u00f0i \u00ed leikger\u00f0 og uppsetningu.
  Og \u00ed \u00fev\u00ed sambandi eru allir \u00feeir sem \u00e1 undan honum hafa
  gengi\u00f0 \u00ed leikh\u00fasinu og hann \u00fearf a\u00f0 sigrast \u00e1, ekki
  a\u00f0eins foreldrar og leikh\u00fasfj\u00f6lkyldan sem hann tilheyrir heldur ekki
  hva\u00f0 s\u00edst Halld\u00f3r Laxness sj\u00e1lfur.\\n\u00deegar vins\u00e6lt
  d\u00e6gurlag \u201e\u00de\u00fa komst vi\u00f0 hjarta\u00f0 \u00ed m\u00e9r\u201c
  (5) eftir eina af \u00feekktustu helgimyndum af\u00fereyingarmenningu samt\u00edmans,
  P\u00e1ls \u00d3skars Hj\u00e1lmt\u00fdssonar, hlj\u00f3mar \u00far h\u00e1t\u00f6lurum
  leikh\u00fassins er \u00fea\u00f0 til a\u00f0 minna okkur \u00e1 a\u00f0 vi\u00f0
  erum st\u00f6dd \u00ed leikh\u00fasi \u00fer\u00e1tt fyrir allt, vi\u00f0 erum ekki
  a\u00f0 horfa \u00e1 framsetningu veruleikans og ekki einu sinni eftirl\u00edkingu
  af honum. Vi\u00f0 erum a\u00f0 horfa \u00e1 sj\u00e1lfst\u00e6tt listaverk sem
  a\u00f0eins tj\u00e1ir eina s\u00fdn af sk\u00e1ldu\u00f0um veruleika sem heitir
  Sj\u00e1lfst\u00e6tt f\u00f3lk. \u00cd leikh\u00fasinu er allt leyfilegt, ekki s\u00edst
  \u00e1 \u00feessum sta\u00f0 \u00ed leiknum \u00feegar langt er li\u00f0i\u00f0
  \u00e1 s\u00fdninguna og Bjartur er a\u00f0 gera \u00fat af vi\u00f0 okkur me\u00f0
  hranaskap og tilfinningakulda gagnvart s\u00ednum n\u00e1nustu. \u00dea\u00f0 er
  sk\u00f6mmu eftir a\u00f0 Bjartur hefur me\u00f0 h\u00f6rku reki\u00f0 barnunga
  og barnshafandi d\u00f3ttur s\u00edna \u00c1stu S\u00f3llilju (Elma Stefan\u00eda
  \u00c1g\u00fastd\u00f3ttur) a\u00f0 heiman. Lagi\u00f0 sem P\u00e1ll \u00d3skar
  flytur er hi\u00f0 fullkomna stu\u00f0lag en inniheldur jafnframt tilfinninga\u00ferunginn
  texta:\\nOg \u00feegar \u00fe\u00fa komst inn \u00ed l\u00edf mitt breyttist \u00e9g.\\n\u00de\u00fa
  komst, \u00fe\u00fa komst vi\u00f0 hjarta\u00f0 \u00ed m\u00e9r.\\n\u00c9g \u00feori
  a\u00f0 m\u00e6ta hverju sem er.\\n\u00de\u00fa komst \u00fe\u00fa komst vi\u00f0
  hjarta\u00f0 \u00ed m\u00e9r.\\nLagi\u00f0 f\u00e6r tv\u00f6falda merkingu \u00feegar
  \u00fea\u00f0 er nota\u00f0 \u00ed s\u00fdningunni; annarsvegar \u00fej\u00f3nar
  \u00fea\u00f0 \u00feeim tilgangi a\u00f0 vera tenging milli \u00feri\u00f0ju og
  fj\u00f3r\u00f0u b\u00f3kar (Erfi\u00f0ir t\u00edmar og Velti\u00e1r) en um lei\u00f0
  a\u00f0 fagna uppgangst\u00edmum \u00ed samf\u00e9laginu, l\u00edkt og bankamenn
  hrunsins ger\u00f0u \u00feegar \u00feeir keyptu til s\u00edn heimsfr\u00e6g poppgo\u00f0
  til a\u00f0 skemmta s\u00e9r \u00ed gr\u00f3\u00f0\u00e6rinu mikla sem leitti til
  bankahrunsins 2008. Hins vegar virkar texti lagsins eins og kaldh\u00e6\u00f0nisgusa
  eftir a\u00f0 Bjartur hefur reki\u00f0 \u00c1stu S\u00f3llilju a\u00f0 heiman, \u00fev\u00ed
  h\u00fan kom j\u00fa vi\u00f0 hjarta\u00f0 \u00ed honum \u00fer\u00e1tt fyrir allt.
  Bjartur er tilfinningavera, ekki bara kaldur og miskunnarlaus \u00ferj\u00f3skuhaus,
  hann er mannlegur og breyskur. \u00dearna birtist okkur aftur miskunnarleysi leikstj\u00f3rans
  vi\u00f0 vi\u00f0fangsefni sitt, hann leyfir s\u00e9r a\u00f0 gantast me\u00f0 tilfinningar
  Bjarts og \u00c1stu S\u00f3llilju sem \u00ed raun elska hvort anna\u00f0 sem fa\u00f0ir
  og d\u00f3ttir en geta ekki tj\u00e1\u00f0 \u00fea\u00f0 af einl\u00e6gni hjartans.\\nH\u00e9r
  er metaleikh\u00fasi\u00f0 nota\u00f0 sem \u201ecomic relief\u201c e\u00f0a gamansamur
  l\u00e9ttir til a\u00f0 hj\u00e1lpa \u00e1horfandandum a\u00f0 me\u00f0taka harminn
  og hryllinginn sem \u00e1 eftir a\u00f0 koma, nokku\u00f0 sem vi\u00f0 \u00feekkjum
  fr\u00e1 Shakespeare t.d. \u00ed dyravar\u00f0arsenunni \u00ed Macbeth. Bertolt
  Brecht kom svo me\u00f0 s\u00edna versj\u00f3n eins og fr\u00e6gt er, Verfremdungseffektinn
  e\u00f0a fjarl\u00e6gingar\u00e1hrif/framandgervingu sem \u00e1tti a\u00f0 koma
  \u00ed veg fyrir a\u00f0 \u00e1horfendur lif\u00f0u sig of n\u00e1i\u00f0 inn \u00ed
  tilfinningar leikpers\u00f3nanna \u00e1 kostna\u00f0 hugsunar og \u00edgrundunar.
  Me\u00f0 \u00fev\u00ed a\u00f0 rj\u00fafa framvinduna \u00ed fr\u00e1s\u00f6gninni
  sem \u00e1horfendur hafa \u00feegar lifa\u00f0 sig inn \u00ed og setja inn leikatri\u00f0i,
  s\u00f6ng e\u00f0a anna\u00f0 sem \u00ed fyrstu vir\u00f0ist alls \u00f3vi\u00f0komandi
  leiks\u00fdningunni en er \u00fe\u00f3 \u00ed e\u00f0li s\u00ednu \u00e1kve\u00f0i\u00f0
  \u201ekomment\u201c \u00e1 s\u00f6mu fr\u00e1s\u00f6gn, f\u00e6r \u00e1horfandinn
  t\u00e6kif\u00e6ri til a\u00f0 sj\u00e1 og skynja hana \u00far vissri fjarl\u00e6g\u00f0.
  Fj\u00f6lskylduharmleikurinn \u00ed Sumarh\u00fasum sem birtist okkur \u00e1 leiksvi\u00f0inu
  einkum \u00ed sambandi Bjarts og \u00c1stu S\u00f3llilju er af s\u00f6mu st\u00e6r\u00f0argr\u00e1\u00f0u
  og harmleikur L\u00e9s og Cordel\u00edu e\u00f0a Kreons og Ant\u00edg\u00f3nu ef
  \u00fat \u00ed \u00fe\u00e1 s\u00e1lma er fari\u00f0 og hann myndar annan \u00e1sinn
  \u00ed framvindu s\u00f6gunnar.\\nAndst\u00e6\u00f0an vi\u00f0 Sumarh\u00fasaf\u00f3lki\u00f0,
  fj\u00f6lskyldan \u00e1 \u00datirau\u00f0sm\u00fdri sem er tengd Bjarti og fj\u00f6lskyldu
  hans \u00f3rj\u00fafanlegum b\u00f6ndum er hinn \u00e1sinn. Um \u00feessa tvo fj\u00f6lskyldup\u00f3la
  og st\u00f6\u00f0u \u00feeirra \u00ed samf\u00e9laginu hverfist s\u00e1 heimur sem
  birtist okkur \u00e1 leiksvi\u00f0inu. Helstu \u00e1t\u00f6kin \u00ed \u00feessum
  fj\u00f6lskyldum fara fram milli Bjarts og Rau\u00f0sm\u00fdrarmadd\u00f6munnar
  (Tinna Gunnlaugsd\u00f3ttir), hina alltumlykjandi \u00fej\u00f3\u00f0m\u00f3\u00f0ur
  sem \u00feykist kunna a\u00f0 r\u00e1\u00f0a undirs\u00e1tum s\u00ednum heilt. Tinna
  er tv\u00edm\u00e6lalaust ein af helgimyndum leikh\u00fassins r\u00e9tt eins og
  Arnar, fyrst sem leikkona og s\u00ed\u00f0ar sem leikh\u00fasstj\u00f3ri og \u00fev\u00ed
  var \u00fea\u00f0 rakin og afar frumleg hugmynd \u00fer\u00e1tt fyrir ramakvein
  \u00ed fj\u00f6lmi\u00f0lum a\u00f0 l\u00e1ta hana leika hlutverk Rau\u00f0sm\u00fdrarmadd\u00f6munnar
  og ekki hva\u00f0 s\u00edst opna s\u00fdninguna \u00e1 Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki \u00ed sj\u00e1lfri forsetast\u00faku leikh\u00fassins sem er einmitt
  s\u00e1 sta\u00f0ur \u00ed \u00e1horfendasalnum sem sta\u00f0festir innbygg\u00f0a
  st\u00e9ttaskiptinguna \u00ed leikh\u00fasstofnuninni sem er sm\u00e6kku\u00f0 mynd
  af heimi og samf\u00e9lagi. \u00deegar s\u00fdningin fer svo \u00far b\u00f6ndunum
  vi\u00f0 upphaf Velti\u00e1rakaflans leikur leikstj\u00f3rinn s\u00e9r aftur a\u00f0
  helgimyndum leikh\u00fassins, Rau\u00f0sm\u00fdrarmaddaman \u00ed upphlut og kr\u00edn\u00f3l\u00edn
  breytist \u00ed \u00fej\u00f3\u00f0leikh\u00fasstj\u00f3rann Tinnu (\u00fe\u00e1verandi
  og fyrrverandi) sem strunsar um me\u00f0 svartan plastpoka og hreinsar upp drasli\u00f0
  eftir fyller\u00edi\u00f0 \u00e1 svi\u00f0inu \u00fear sem ekki er lengur veri\u00f0
  a\u00f0 fara me\u00f0 texta eftir Halld\u00f3r Laxness heldur vanvir\u00f0a stofnunina
  me\u00f0 \u201e\u00f3merkilegu\u201c d\u00e6gurlagi og f\u00edflal\u00e1tum. Og
  \u00fea\u00f0 eru einmitt \u00feau tv\u00f6, Tinna og Arnar alias hreppstj\u00f3rahj\u00f3nin/leikh\u00fashj\u00f3nin/leikh\u00fasforeldrarnir
  sem hneykslast hva\u00f0 mest \u00e1 upp\u00e1t\u00e6ki \u201eerfingjanna\u201c
  en sonur Tinnu, \u00d3lafur Egill Egilsson er einn af h\u00f6fundum leikger\u00f0arinnar
  og leikur hlutverk kennarans \u2013 Og fyrst veri\u00f0 er a\u00f0 r\u00e6\u00f0a
  um erfingja leikh\u00fassins og fj\u00f6lskyldutengslin, S\u00edmon Birgisson einn
  af h\u00f6fundum leikger\u00f0arinnar og n\u00faverandi dramat\u00fargur \u00dej\u00f3\u00f0leikh\u00fassins
  er br\u00f3\u00f0ursonur \u00d3lafs Hauks S\u00edmonarsonar sem um \u00e1rabil var
  mest leikni leikritah\u00f6fundur leikh\u00fassins. En \u00feetta er \u00cdsland,
  litla \u00cdsland, litla tj\u00f6rnin me\u00f0 st\u00f3ru fiskunum og svo hunda\u00fe\u00fafan.
  Svok\u00f6llu\u00f0 h\u00e1menning og l\u00e1gmenning takast \u00e1 \u00ed miskunnarleysi
  gagnvart texta Halld\u00f3rs, helgimyndabroti\u00f0 heldur \u00e1fram, n\u00fd kynsl\u00f3\u00f0
  hefur rutt s\u00e9r til r\u00fams og notast vi\u00f0 a\u00f0fer\u00f0ir sem ekki
  falla endilega \u00ed krami\u00f0 en um lei\u00f0 eignar h\u00fan s\u00e9r r\u00e9ttinn
  til a\u00f0 t\u00falka menningararfinn me\u00f0 eigin h\u00e6tti.\\nFagurfr\u00e6\u00f0i
  lj\u00f3tleikans\\nEn helgimyndabroti\u00f0 n\u00e6r lengra og d\u00fdpra, \u00fea\u00f0
  er ekki einungis yfirbor\u00f0skenndar tikt\u00farur e\u00f0a st\u00e6lar \u00ed
  ungri leikh\u00faskynsl\u00f3\u00f0 sem vill sl\u00e1 \u00e1horfandann utanundir.
  Bakvi\u00f0 hverja hugmynd og gj\u00f6r\u00f0 \u00ed svi\u00f0setningunni leynist
  texti Halld\u00f3rs Laxness, andr\u00fam \u00feess t\u00ed\u00f0aranda, \u00fej\u00f3\u00f0f\u00e9lags\u00e1stands
  og mannl\u00edfs sem honum t\u00f3kst a\u00f0 l\u00fdsa me\u00f0 \u00f3sviknum sk\u00e1ldskap
  og kaldh\u00e6\u00f0ni \u00ed s\u00f6gunni st\u00f3ru um samb\u00fdli Bjarts vi\u00f0
  hei\u00f0i, sau\u00f0kind og samf\u00e9lag. Og \u00fea\u00f0 samb\u00fdli er s\u00ed\u00f0ur
  en svo fagurt eins og l\u00f6g\u00f0 er \u00e1hersla \u00e1 \u00ed allri svi\u00f0smynd
  og umgj\u00f6r\u00f0 s\u00fdningarinnar \u00e1 svi\u00f0i \u00dej\u00f3\u00f0leikh\u00fassins.
  \u00c1 me\u00f0an Halld\u00f3r Laxness stillir fegur\u00f0 n\u00e1tt\u00faru \u00ed
  textanum upp \u00e1 m\u00f3ti lj\u00f3tleika mannsl\u00edfsins velur leikstj\u00f3rinn
  a\u00f0 s\u00fdna okkur \u00fea\u00f0 s\u00ed\u00f0arnefnda \u00ed \u00f6llu s\u00ednu
  veldi og hafna um lei\u00f0 andst\u00e6\u00f0unni og fyrir \u00fe\u00e1 s\u00f6k
  hlaut s\u00fdningin gagnr\u00fdni, \u00fea\u00f0 vanta\u00f0i fegur\u00f0ina \u00ed
  hana. En \u201efegur\u00f0\u201c s\u00fdningarinnar felst \u00fe\u00f3 einkum \u00ed
  fagurfr\u00e6\u00f0i sem kenna m\u00e1 vi\u00f0 lj\u00f3tleika, grimmd og \u00fargang
  sem er tv\u00edm\u00e6lalaust h\u00f6fundareinkenni leikstj\u00f3rans b\u00e6\u00f0i
  h\u00e9r og \u00ed fyrri s\u00fdningum hans. Me\u00f0 henni r\u00eds hann upp me\u00f0
  gr\u00f3teskum h\u00e6tti gegn nat\u00faralist\u00edskum leik og rauns\u00e6islegri
  framsetningu \u00e1 efninu \u00ed \u00f6llu tilliti og sver sig \u00ed \u00e6tt
  vi\u00f0 byltingarmenn \u00ed leikh\u00fasi eins og Antonin Artaud.\\nMe\u00f0 fagurfr\u00e6\u00f0i
  lj\u00f3tleikans er \u00e1tt vi\u00f0 \u00e1kve\u00f0na a\u00f0fer\u00f0 \u00ed
  listsk\u00f6pun sem storkar hef\u00f0bundnum og vi\u00f0teknum hugmyndum um fegur\u00f0
  og fegur\u00f0arsmekk. Skynjun flestra \u00e1 fegur\u00f0 r\u00e6\u00f0st af \u00feeirri
  \u00e1n\u00e6gjutilfinningu og gle\u00f0i sem fegur\u00f0in ein og s\u00e9r veitir
  og byggir \u00e1 vissum formreglum, innra samr\u00e6mi og skipul\u00f6g\u00f0u kerfi
  \u00e1 me\u00f0an lj\u00f3tleikinn veldur truflun \u00ed skynjuninni, \u00f3rei\u00f0u
  og upplausn kerfa og tilfinningalegum \u00f3notum og \u00f3\u00e1n\u00e6gju. Fagurfr\u00e6\u00f0i
  lj\u00f3tleikans sem a\u00f0fer\u00f0 getur \u00fe\u00f3 engu a\u00f0 s\u00ed\u00f0ur
  fyllt okkur vissri vitsmunalegri \u00e1n\u00e6gju sem felst \u00fe\u00e1 a\u00f0allega
  \u00ed a\u00f0 ver\u00f0a vitni a\u00f0 \u00feeirri fegur\u00f0 sem b\u00fdr \u00ed
  framsetningu vi\u00f0komandi listamanns, framsetningu sem eltist ekki vi\u00f0 fyrirfram
  \u00e1kve\u00f0inn og sam\u00feykktan fegur\u00f0arsmekk vi\u00f0takandans (6).\\n\u00dea\u00f0
  er ekki beinl\u00ednis hei\u00f0r\u00edkja \u00edslenskrar n\u00e1tt\u00faru og
  v\u00ed\u00f0ernis sem blasir vi\u00f0 augum \u00feegar tjaldi\u00f0 er dregi\u00f0
  fr\u00e1 eftir upphafsatri\u00f0i\u00f0 \u00fear sem br\u00fa\u00f0j\u00f3nin Bjartur
  og R\u00f3sa (Vigd\u00eds Hrefna P\u00e1lsd\u00f3ttir) standa framan vi\u00f0 tjaldi\u00f0
  undir innbl\u00e1sinni heilla\u00f3skar\u00e6\u00f0u Rau\u00f0sm\u00fdrarmadd\u00f6munnar
  um d\u00e1semdir sveitas\u00e6lunnar. Gr\u00ed\u00f0arlega h\u00e1r veggur sem bygg\u00f0ur
  er \u00ed h\u00e1lfhring \u00e1 svi\u00f0inu, steypugr\u00e1r a\u00f0 lit, t\u00e1knar
  umhverfi Bjarts (fjallam\u00farar hei\u00f0innar) og fj\u00f6lskyldu hans. \u00deau
  h\u00faka og hokra undir \u00f3kleifum virkism\u00far helsisins sem Bjartur misskilur
  sem sj\u00e1lfst\u00e6\u00f0i. Sumarh\u00fas eru \u00e1 botni \u00feessa virkis,
  fj\u00f6lskylda hans \u00e1 samf\u00e9lagsbotninum, \u00fea\u00f0 \u00fe\u00fd\u00f0ir
  ekki a\u00f0 reyna a\u00f0 klifra upp eins og s\u00fdndi sig margoft \u00ed leiks\u00fdningunni.\\n\u00c1
  m\u00farnum eru a\u00f0eins tvennar dyr, \u00f6nnur lei\u00f0ir inn \u00ed fort\u00ed\u00f0ina,
  torfb\u00e6inn aldagamlan, hin inn \u00ed framt\u00ed\u00f0ina og frelsi\u00f0,
  en \u00fe\u00e6r dyr er \u00fev\u00ed mi\u00f0ur a\u00f0eins h\u00e6gt a\u00f0 opna
  a\u00f0 utanver\u00f0u og af \u00f3s\u00fdnilegu valdi. Milli \u00feessara tveggja
  t\u00edma fort\u00ed\u00f0ar og framt\u00ed\u00f0ar fer n\u00fat\u00edminn fram
  \u00fe.e. allt l\u00edf Bjarts og fj\u00f6lskyldu hans \u00e1 leiksvi\u00f0inu.\\nM\u00farinn
  getur einnig t\u00e1kna\u00f0 \u00fea\u00f0 innra fangelsi sem Bjartur hefur skapa\u00f0
  me\u00f0 \u00ferj\u00f3sku sinni, hann getur einnig veri\u00f0 samf\u00e9lagsfangelsi\u00f0
  sem er hnepptur \u00ed sem f\u00e1t\u00e6klingur og \u00fea\u00f0 er fyllilega gefi\u00f0
  \u00ed skyn me\u00f0 eftirlitssv\u00f6lum sem liggja h\u00e1tt uppi me\u00f0fram
  \u00f6llum veggnum og a\u00f0eins f\u00f3lk af h\u00e6rri st\u00e9tt, fangaver\u00f0ir
  f\u00e1t\u00e6klinganna, (eftirlitssamf\u00e9lagi\u00f0) geta gengi\u00f0 \u00e1
  eins og fj\u00f6lskyldan \u00e1 \u00datirau\u00f0sm\u00fdri.\\nEn veggurinn getur
  l\u00edka veri\u00f0 legveggur, m\u00f3\u00f0url\u00edfi\u00f0 sj\u00e1lft, s\u00fa
  j\u00f6r\u00f0 sem allt mannl\u00edf s\u00e6kir upphaf sitt til. \u00c1 \u00feeim
  vegg speglast b\u00e6\u00f0i fort\u00ed\u00f0ar- og framt\u00ed\u00f0ardraugar,
  martra\u00f0arkennt l\u00edf sem eitt sinn var lifa\u00f0 \u00ed hei\u00f0inni og
  hefur skili\u00f0 eftir sig galdra og draugagang. \u00deetta er s\u00fdnt me\u00f0
  vide\u00f3list Rimas Sakalauskas, sem varpa\u00f0 er \u00e1 vegginn og minnir stundum
  \u00e1 tv\u00ed- og \u00fer\u00edv\u00edddar s\u00f3narmyndir af f\u00f3strum \u00ed
  m\u00f3\u00f0urkvi\u00f0i sem taka \u00e1 sig fur\u00f0usk\u00fdra mannsmynd. Fort\u00ed\u00f0ardraugarnir
  eru au\u00f0vita\u00f0 \u00feau K\u00f3lumkilli og Gunnv\u00f6r sem eiga ekki svo
  l\u00edtinn \u00fe\u00e1tt \u00ed hugsun og tilfinningal\u00edfi Sumarh\u00fasaf\u00f3lksins,
  framt\u00ed\u00f0ardraugarnir eru \u00f6ll \u00f3f\u00e6ddu b\u00f6rnin \u00ed Sumarh\u00fasum
  sem m\u00f6rg hver deyja drottni s\u00ednum strax vi\u00f0 f\u00e6\u00f0ingu.\\n\u00deegar
  l\u00ed\u00f0a tekur \u00e1 s\u00fdninguna getur steyptur veggurinn \u00ed vissri
  l\u00fdsingu t\u00e1kna\u00f0 h\u00fasbyggingar\u00e1r\u00e1ttu og h\u00fasn\u00e6\u00f0iss\u00f6gu
  \u00cdslendinga alla tuttugustu \u00f6ldina og \u00feannig kallast s\u00fdningin
  \u00e1 vi\u00f0 samt\u00edma okkar, vistarb\u00f6nd h\u00fasn\u00e6\u00f0isskuldanna
  sem meirihluti \u00fej\u00f3\u00f0arinnar hefur komi\u00f0 s\u00e9r upp me\u00f0
  a\u00f0sto\u00f0 bankanna. \u00c1horfendur lokast inni \u00ed leikh\u00fasinu me\u00f0
  Bjarti og fj\u00f6lskyldu hans undir yfir\u00feyrmandi m\u00farnum sem skapar tilfinningu
  af \u00f3\u00fe\u00e6gilegri innilokunarkennd eftir \u00fev\u00ed sem l\u00ed\u00f0ur
  \u00e1 s\u00fdninguna. Sumarh\u00fasafj\u00f6lskyldan lokast inni undir b\u00e6jarfjallinu
  \u00ed hei\u00f0inni, lokast inni \u00e1 \u00cdslandi.\\n\u201eMa\u00f0ur kemst
  ekki burt. \u00dea\u00f0 er l\u00edfi\u00f0\u201c eins og \u00c1sta S\u00f3llilja
  segir sj\u00e1lf (7). Og enginn kemst burt fr\u00e1 Bjarti, \u00fea\u00f0 deyr allt
  \u00e1 undan honum. Undir m\u00farnum fer svo hryllingsl\u00edfi\u00f0 fram \u00fear
  sem fj\u00f6lskyldan rennur saman vi\u00f0 j\u00f6r\u00f0 og n\u00e1tt\u00faru,
  bl\u00f3\u00f0 og skepnur, veruleika og martr\u00f6\u00f0. \u00deetta sj\u00e1um
  vi\u00f0 hva\u00f0 eftir anna\u00f0 \u00ed s\u00fdningunni og oft af miklu miskunnarleysi
  og grimmd enda gerir Bjartur s\u00e1ral\u00edtinn mun \u00e1 m\u00f6nnum og skepnum
  \u00ed s\u00f6gu Halld\u00f3rs, sau\u00f0kindin er jafnvel \u00e6\u00f0ri manneskjunni.
  Allt og allir ver\u00f0a vi\u00f0f\u00f6ng Bjarts, allt sem gerist \u00ed Sumarh\u00fasum
  er \u00ferj\u00f3sku hans og misskilinni sj\u00e1lfst\u00e6\u00f0isbar\u00e1ttu
  um a\u00f0 kenna. Barnungir synir hans (\u00de\u00f3rir S\u00e6mundsson, Snorri
  Engilbertsson, Arnmundur Ernst Bachmann), renna saman vi\u00f0 kotb\u00fdli\u00f0,
  k\u00fara \u00e1 torf\u00feaki, hnipra sig saman eins og hungra\u00f0ir rakkar undir
  b\u00e6jarvegg. Amman Hallbera (Gu\u00f0r\u00fan S. G\u00edslad\u00f3ttir) er gersamlega
  samgr\u00f3in vi\u00f0 b\u00e6inn og f\u00e6rir sig varla af b\u00e6jarhellunni
  alla s\u00fdninguna, segir f\u00e1tt, hugsar \u00fev\u00ed meir og fylgist me\u00f0
  \u00f6llu sem fyrir augu ber r\u00e9tt eins og h\u00f6fundurinn sj\u00e1lfur Halld\u00f3r
  Laxness, enda er h\u00fan a\u00f0 lesa Laxness alla leiks\u00fdninguna \u00fat \u00ed
  gegn. H\u00fan er a\u00f0eins gestur \u00ed Sumarh\u00fasum, ta\u00f3\u00edsk pers\u00f3na
  sem yljar s\u00e9r vi\u00f0 minninguna um s\u00f3larl\u00f6gin \u00ed Ur\u00f0arseli
  \u00fear sem h\u00fan bj\u00f3 um \u00e1ratuga skei\u00f0.\\nVi\u00f0 f\u00e1um
  ekki a\u00f0 sj\u00e1 leikh\u00faslegar \u00fatg\u00e1fur af \u00edslensum kotb\u00e6
  \u00ed \u00fej\u00f3\u00f0h\u00e1ttast\u00edl, enga ba\u00f0stofu, ekkert kaffi
  sem drukki\u00f0 er \u00far venjulegum bollum og kleinurnar eru maula\u00f0ar beint
  upp \u00far plastpokanum \u00far B\u00f3nus. Leikmunadeildin f\u00e6r \u00f6nnur
  verkefni, kaffi\u00f0 stendur \u00ed st\u00f3rum m\u00e1lmbr\u00fasum upp vi\u00f0
  m\u00farinn eins og finna m\u00e1 \u00ed fyrirt\u00e6kjum og stofnunum, kaffi\u00f0
  er drukki\u00f0 \u00far plastm\u00e1lum og au\u00f0vita\u00f0 er j\u00f3lamaturinn
  hj\u00e1 Bjarti 1944 r\u00e9ttirnir, matur fyrir Sj\u00e1lfst\u00e6\u00f0a \u00cdslendinga
  sem er jafn kaldh\u00e6\u00f0nislegt og titillinn \u00e1 sk\u00e1lds\u00f6gunni.\\n\u00cd
  velti\u00e1rakaflanum er drukkinn bj\u00f3r \u00far \u00e1ld\u00f3sum og \u00fea\u00f0
  gerir kennarinn l\u00edka \u00feegar hann birtist berklaveikur og alkoh\u00f3l\u00edsera\u00f0ur
  \u00e1 leiksvi\u00f0inu. Allt eru \u00feetta \u00fe\u00f3 sm\u00e1atri\u00f0i (sem
  sumir l\u00e9tu \u00fe\u00f3 fara \u00ed taugarnar \u00e1 s\u00e9r) \u00ed samanbur\u00f0i
  vi\u00f0 leikgj\u00f6rningana sem margir hverjir eru grafnir upp \u00far l\u00fdsingum
  Halld\u00f3rs en er alls ekki a\u00f0 finna \u00ed leikger\u00f0inni \u00fev\u00ed
  eins og \u00e1\u00f0ur sag\u00f0i er ekki neinar lei\u00f0beiningar til leikstj\u00f3ra
  \u00fear. \u00cd leikgj\u00f6rningunum gengur leikstj\u00f3rinn alla lei\u00f0 \u00ed
  miskunnarleysinu vi\u00f0 vi\u00f0fangsefni sitt enda er \u00fea\u00f0 fyrst og
  fremst hlutverk hans a\u00f0 umbreyta leikger\u00f0inni \u00ed \u00fer\u00edv\u00ed\u00f0an
  svi\u00f0ssk\u00e1ldskap.\\nSvi\u00f0smyndlist og gj\u00f6rningar\\nSem d\u00e6mi
  um \u00fe\u00e1 leikgj\u00f6rninga sem ver\u00f0a til \u00e1 leiksvi\u00f0inu og
  sty\u00f0jast vi\u00f0 hugmyndir sem s\u00f3ttar eru \u00ed texta Halld\u00f3rs
  m\u00e1 nefna atri\u00f0i \u00ed fyrsta hluta s\u00fdningarinnar \u00feegar hin
  barnshafandi og vann\u00e6r\u00f0a R\u00f3sa (Vigd\u00eds Hrefna P\u00e1lsd\u00f3ttir)
  fyrri kona Bjarts, sl\u00e1trar upp\u00e1haldgimbrinni hans, Gullbr\u00e1, og atar
  sig bl\u00f3\u00f0i hennar af \u00e1fergju. Um lei\u00f0 opnast framt\u00ed\u00f0ardyrnar
  \u00ed h\u00e1lfa g\u00e1tt og \u00ed sterkri, hv\u00edtri hli\u00f0arl\u00fdsingu
  birtist sj\u00e1lf Rau\u00f0sm\u00fdrarmaddaman og starir inn \u00ed skerandi lj\u00f3si\u00f0.
  Blundandi og b\u00e6ld rei\u00f0i R\u00f3su \u00ed gar\u00f0 fr\u00faarinnar er
  svi\u00f0sett me\u00f0 v\u00edsan og stu\u00f0ningi \u00ed texta Halld\u00f3rs:\\n\u201e\u2026hana
  haf\u00f0i veri\u00f0 a\u00f0 dreyma fr\u00fana \u00e1 \u00datirau\u00f0sm\u00fdri,
  h\u00fan fann a\u00f0 h\u00fan haf\u00f0i eitthva\u00f0 a\u00f0 baki s\u00e9r sem
  var\u00f0a\u00f0i allan hreppinn, henni \u00fe\u00f3tti h\u00fan hafa skori\u00f0
  fr\u00fana \u00e1 \u00datirau\u00f0sm\u00fdri \u00e1 h\u00e1ls\u201c(8)\\nR\u00f3sa
  drekkur \u00ed sig bl\u00f3\u00f0 Rau\u00f0sm\u00fdrarmadd\u00f6munnar me\u00f0
  f\u00f3rninni \u00e1 Gullbr\u00e1. \u00deegar Bjartur kemur heim \u00far eftirleit
  \u00e1 fj\u00f6llum og R\u00f3sa f\u00e6rir honum skanka af gimbrinni sem h\u00fan
  hefur sl\u00e1tra\u00f0 sem hann st\u00fdfir als\u00e6ll \u00far hnefa, liggur R\u00f3sa
  \u00e1 fj\u00f3rum f\u00f3tum og \u00fer\u00edfur upp bl\u00f3\u00f0i\u00f0 eftir
  sl\u00e1trunina. Bjartur \u00fearf a\u00f0 \u00e9ta on\u00ed sig s\u00ednar eigin
  b\u00e1biljur um sj\u00e1lfst\u00e6\u00f0i \u00e1n \u00feess a\u00f0 hafa hugmynd
  um \u00fea\u00f0. \u00deegar Bjartur skilur R\u00f3su eina eftir \u00ed kotinu og
  r\u00ed\u00f0ur \u00e1 hreind\u00fdrstarfinum yfir J\u00f6kuls\u00e1 \u00e1 Fj\u00f6llum,
  f\u00e6\u00f0ir R\u00f3sa st\u00falkubarni\u00f0 \u00c1stu S\u00f3llilju me\u00f0
  vi\u00f0eigandi alv\u00f6ru\u00f3pum, standandi upp vi\u00f0 b\u00e6jarl\u00e6kinn
  sem rennur ni\u00f0ur eftir mi\u00f0jum m\u00farnum. Bjartur er ekki fyrr farinn
  af b\u00e6 en inn l\u00e6\u00f0ist barnsfa\u00f0ir R\u00f3su, Ing\u00f3lfur Arnarson
  J\u00f3nsson (Stef\u00e1n Hallur Stef\u00e1nsson) \u00e1n \u00feess a\u00f0 \u00e1horfendur
  ver\u00f0i hans varir. Hann borar s\u00e9r \u00ed gegnum l\u00edti\u00f0 op/gat
  h\u00e1tt uppi vinstramegin \u00e1 m\u00farnum og stillir s\u00e9r upp \u00e1 eftirlitssv\u00f6lunum
  beint fyrir ofan R\u00f3su. \u00deegar f\u00e6\u00f0ingarhr\u00ed\u00f0irnar n\u00e1
  h\u00e1marki sleppir hann (s\u00e6\u00f0isgjafinn) taki af n\u00f6ktu og bl\u00f3\u00f0ugu
  kornabarni (mj\u00f6g sannf\u00e6randi br\u00fa\u00f0ul\u00edki) sem lendir \u00ed
  fangi R\u00f3su. Me\u00f0 \u00feessu fullkomnast verkna\u00f0ur hans, hann hefur
  l\u00e6tt \u00ed hana s\u00e6\u00f0i sem n\u00fa er or\u00f0i\u00f0 fullbur\u00f0a
  og \u00e1 eftir a\u00f0 skipta sk\u00f6pum fyrir \u00e1framhald s\u00f6gunnar. \u00c1
  sama h\u00e1tt er snilldarleg innkoma kennarans (\u00d3lafur Egill Egilsson) \u00fatf\u00e6r\u00f0
  seinna \u00ed verkinu \u00e1n \u00feess a\u00f0 vi\u00f0 ver\u00f0um \u00feess v\u00f6r.
  Hann skr\u00ed\u00f0ur inn um sama op/gat \u00e1 m\u00farnum eins og skr\u00edmsli
  e\u00f0a skord\u00fdr inn um veggjarglufu sk\u00f6mmu eftir a\u00f0 Bjartur yfirgefur
  b\u00f6rnin til a\u00f0 afla tekna \u00ed \u00feorpinu. Hj\u00e1 Halld\u00f3ri er
  \u00feetta gat \u00e1 m\u00farnum hola \u00ed snj\u00f3skafli sem liggur inn \u00ed
  Sumarh\u00fasab\u00e6inn:\\n\u201eEru ekki dyr \u00e1 b\u00e6num? spur\u00f0i gesturinn.
  Nei, s\u00f6g\u00f0u \u00feau, en \u00fea\u00f0 er hola ni\u00f0r\u00ed skaflinn.
  Vilji\u00f0 \u00fei\u00f0 lei\u00f0beina m\u00e9r sem fyrst inn\u00ed holuna, sag\u00f0i
  gesturinn\u201c (9)\\nAftur l\u00e6\u00f0ist hi\u00f0 \u201eilla\u201c s\u00e6\u00f0i
  inn \u00e1 leiksvi\u00f0i\u00f0, s\u00e6\u00f0i sem \u00e1 eftir a\u00f0 valda st\u00e6rstu
  dramat\u00edsku straumhv\u00f6rfunum \u00ed framvindu s\u00f6gunnar. \u00deegar
  kennarinn misnotar/nau\u00f0gar \u00c1stu S\u00f3lilju fyrir opnum tj\u00f6ldum
  \u00fe\u00e1 flettir leikarinn af henni h\u00e1rinu svo undir sk\u00edn \u00ed lj\u00f3st
  barnsh\u00e1ri\u00f0 enda er \u00c1sta S\u00f3llija enn barn a\u00f0 aldri \u00feegar
  \u00feessi atbur\u00f0ur \u00e1 s\u00e9r sta\u00f0. \u00deessa gj\u00f6r\u00f0 m\u00e1
  einnig skilja sem h\u00f6fu\u00f0le\u00f0ri barnsins hafi veri\u00f0 flett af enda
  l\u00edkir Halld\u00f3r verkna\u00f0i kennarans vi\u00f0 sl\u00e1trun:\\n\u201eHenni
  fanst s\u00e9r hef\u00f0i veri\u00f0 sl\u00e1tra\u00f0. L\u00edkami hennar var eins
  og bl\u00f3\u00f0runni\u00f0 sundurhluta\u00f0 kj\u00f6t\u201c (10)\\nEf til vill
  m\u00e1 segja a\u00f0 lj\u00f3tleiki mannl\u00edfsins \u00ed \u00feessari uppf\u00e6rslu
  n\u00e1i h\u00e1marki s\u00ednu \u00ed t\u00falkun \u00d3lafs Egils \u00e1 berklaveika,
  drykkfellda kennaranum. S\u00fa mynd sem hann dregur upp af mannr\u00e6ksninu er
  \u00f6ll \u00fathugsu\u00f0 og \u00feaulunnin me\u00f0 n\u00e1kv\u00e6mri l\u00edkams-
  og raddbeitingu sem f\u00e6r h\u00e1rin til a\u00f0 r\u00edsa \u00e1 \u00e1horfendum.
  Um lei\u00f0 er varla h\u00e6gt a\u00f0 verjast hl\u00e1tri, vandr\u00e6\u00f0alegum
  hl\u00e1tri sem a\u00f0eins ver\u00f0ur til \u00feegar ma\u00f0ur ver\u00f0ur vitni
  a\u00f0 yfirgengilegri skringiheg\u00f0un sem \u00ed \u00feessu tilviki lei\u00f0ir
  til gr\u00f3frar misnotkunar og s\u00e1larmor\u00f0s. Anna\u00f0 d\u00e6mi sem s\u00fdnir
  hvernig leikstj\u00f3ri s\u00fdningarinnar vinnur me\u00f0 hugmyndina um samruna
  manns og skepnu er \u00feegar Finna (Lilja N\u00f3tt \u00de\u00f3rarinsd\u00f3ttir)
  f\u00e6\u00f0ir honum enn eitt andvana barni\u00f0. \u00c1 leiksvi\u00f0inu sj\u00e1um
  vi\u00f0 leikkonuna standa upp vi\u00f0 m\u00farinn og sn\u00faa baki \u00ed okkur
  \u00e1 me\u00f0an Bjartur fer uppundir pils hennar til a\u00f0 n\u00e1 \u00ed barni\u00f0
  r\u00e9tt eins og hann v\u00e6ri a\u00f0 emb\u00e6tta \u00e6r \u00ed sau\u00f0bur\u00f0i.
  Og \u00feegar hann hefur grafi\u00f0 barni\u00f0 \u00ed moldinni \u00e1 leiksvi\u00f0inu
  \u00fear sem \u00fer\u00edr krossar vitna um fyrri barnadau\u00f0a \u00e1 b\u00e6num,
  \u00fe\u00e1 kafar hann aftur undir pils konu sinnar til a\u00f0 draga \u00far henni
  bl\u00f3\u00f0uga fylgjuna sem hann grefur l\u00edka me\u00f0 berum h\u00f6ndum
  s\u00ednum. Finna seinni kona Bjarts rennur hreinlega saman vi\u00f0 k\u00fana B\u00fakollu
  sem fj\u00f6lskyldunni er gefin af hreppstj\u00f3ranum \u00e1 \u00datirau\u00f0sm\u00fdri
  \u00ed \u00f3\u00fe\u00f6kk Bjarts. \u00c1 afar sk\u00fdran og t\u00e1knr\u00e6nan
  h\u00e1tt er Finna f\u00e6r\u00f0 \u00ed skrokksh\u00fa\u00f0ina af B\u00fakollu
  af sj\u00e1lfum hreppsstj\u00f3rasyninum. Of langt gengi\u00f0 g\u00e6ti sumum fundist
  en allt er \u00feetta vandlega undirbyggt me\u00f0 texta Halld\u00f3rs sem l\u00e6tur
  Bjart horfa \u00f6fundaraugum \u00e1 samband Finnu og B\u00fakollu me\u00f0 eftirfarandi
  h\u00e6tti sem eiga me\u00f0 s\u00e9r samband sem hann hefur engan a\u00f0gang a\u00f0:\\n\u201eOg
  annan morgun, \u00feegar Bjartur kom \u00fat, fann hann konu s\u00edna hj\u00e1
  k\u00fanni, h\u00fan var b\u00fain a\u00f0 emb\u00e6tta hana og st\u00f3\u00f0 vi\u00f0
  hli\u00f0ina \u00e1 henni \u00e1 b\u00e1snum, kl\u00f3ra\u00f0i henni og tala\u00f0i
  vi\u00f0 hana\u201c (11)\\nBjartur sj\u00e1lfur gerir l\u00edtinn greinarmun \u00e1
  konu og k\u00fdr og hann finnur ekki heldur gu\u00f0 \u00ed k\u00fanni sem Finna
  gerir l\u00edkt og Hind\u00faar. Hans gu\u00f0 er \u00ed sau\u00f0kindinni sem er
  \u00e6\u00f0ri en allar k\u00fdr heimsins samanlag\u00f0ar. K\u00fdrin er \u00f3\u00fe\u00f6rf,
  fyrirfer\u00f0armikil og \u00e9tur \u00fear a\u00f0 auki fr\u00e1 rollunum hans.
  \u00dea\u00f0 \u00fearf a\u00f0 losna vi\u00f0 sl\u00edkar skepnur \u00far Sumarh\u00fasum.\\n\u00deegar
  Bjartur manar son sinn Helga (\u00de\u00f3rir S\u00e6mundsson) til a\u00f0 sl\u00e1tra
  k\u00fanni B\u00fakollu, fremur Helgi m\u00f3\u00f0urmor\u00f0 \u00ed t\u00e1knr\u00e6nni
  merkingu. Hann stingur j\u00fagrin \u00e1 k\u00fanni \u00e1 hol en \u00feau hanga
  um h\u00e1ls leikkonunnar eins og vi\u00f0b\u00f3t vi\u00f0 hennar eigin brj\u00f3st
  og um lei\u00f0 og fyrsta hn\u00edfsstungan h\u00e6fir \u00feau, v\u00e6tlar bl\u00f3\u00f0
  \u00fat um munnvik Finnu.\\nDau\u00f0i Helga elsta sonar Bjarts og \u00fatf\u00e6rsla
  hans \u00e1 leiksvi\u00f0inu er \u00ed fullu samr\u00e6mi vi\u00f0 \u00fea\u00f0
  sem leikstj\u00f3rinn hefur lagt upp me\u00f0, hann t\u00falkar endalok pers\u00f3nunnar
  afar djarflega. Samkv\u00e6mt Halld\u00f3ri ver\u00f0ur Helgi \u00fati eftir dularfullu
  \u00e6rdr\u00e1pin \u00ed Sumarh\u00fasum en \u00ed uppf\u00e6rslu \u00deorleifs
  Arnar fer ekki milli m\u00e1la a\u00f0 Helgi fremur sj\u00e1lfsmor\u00f0. Hann steypir
  yfir sig f\u00f6tu fullri af bl\u00f3\u00f0i og situr eftir \u00fea\u00f0 sem hr\u00e6
  albl\u00f3\u00f0ugur upp vi\u00f0 m\u00farinn en \u00e1 honum hefur veri\u00f0 skrifa\u00f0
  st\u00f3rum \u201egraffiti\u201c bl\u00f3\u00f0st\u00f6fum: K\u00f3lumkilli var
  h\u00e9r. Enginn \u00fearf a\u00f0 efast um endalok Helga, hann er barni\u00f0 \u00ed
  h\u00f3pnum sem fer fyrstur \u00ed hundana, barni\u00f0 sem ekki \u00feolir meira
  af har\u00f0\u00fd\u00f0gi, \u00fer\u00e6lkun og einangrun Bjarts.\\nK\u00f3lumkilli
  var h\u00e9r\\n\u00c1 sama h\u00e1tt og K\u00f3lumkilli r\u00ed\u00f0ur r\u00f6ftum
  \u00ed s\u00f6gunni um Bjart \u00ed Sumarh\u00fasum m\u00e1 segja a\u00f0 hann geri
  \u00fea\u00f0 l\u00edka \u00ed svi\u00f0setningu \u00deorleifs Arnar. H\u00fan er
  dimm og draugaleg a\u00f0 \u00fev\u00ed leyti a\u00f0 h\u00fan magnar upp texta
  Halld\u00f3rs og b\u00fdr til \u00far honum miskunnarlausan leikh\u00fasgj\u00f6rning
  sem oft er b\u00fdsna hrollvekjandi og veldur \u00f3notum hj\u00e1 \u00e1horfandanum.
  H\u00fan gefur fyrirheit um a\u00f0 n\u00fdtt leikh\u00fas s\u00e9 \u00ed f\u00e6\u00f0ingu,
  leikh\u00fas sem ber ekki \u00f3ttablandna vir\u00f0ingu fyrir \u00feekktum helgimyndum
  \u00ed menningu okkar. H\u00fan leyfir s\u00e9r a\u00f0 ganga \u00e1 skj\u00f6n
  vi\u00f0 eldri t\u00falkanir, leita a\u00f0 n\u00fdjum a\u00f0fer\u00f0um til a\u00f0
  tj\u00e1 og endurskapa b\u00f3kmenntaarfinn \u00e1 leiksvi\u00f0i.\\nMe\u00f0 \u00fev\u00ed
  a\u00f0 fara \u00f3v\u00e6ntar lei\u00f0ir er saga Halld\u00f3rs opnu\u00f0 me\u00f0
  n\u00fdjum lykli. S\u00e1 lykill veitir a\u00f0gang a\u00f0 fleiri h\u00f3lfum s\u00f6gunnar
  og \u00fe\u00fd\u00f0ir hana yfir \u00e1 leiksvi\u00f0i\u00f0 \u00e1n \u00feess
  a\u00f0 \u201emilda\u201c hinn upprunalega texta. Inni \u00ed h\u00f3lfunum sem
  n\u00fdir lyklar opna, m\u00e1 sko\u00f0a or\u00f0in \u00ed texta Halld\u00f3rs
  upp \u00e1 n\u00fdtt og l\u00e1ta \u00feau f\u00e6\u00f0a af s\u00e9r lifandi myndlistar-
  og leikgj\u00f6rninga \u00ed svi\u00f0setningunni. Miskunnarleysi leikstj\u00f3rans
  gagnvart vi\u00f0fangsefninu skilar s\u00e9r \u00ed \u00f3v\u00e6ntu helgimyndarbroti
  \u00e1 leiksvi\u00f0inu sem er ni\u00f0urnj\u00f6rva\u00f0 me\u00f0 \u00e1kve\u00f0inni
  fagurfr\u00e6\u00f0i eins og h\u00e9r hefur veri\u00f0 s\u00fdnt fram \u00e1. A\u00f0fer\u00f0in
  og stefnan er sk\u00fdr, h\u00e9r er enginn r\u00e9tttr\u00fana\u00f0ur \u00e1 fer\u00f0inni
  (nema vi\u00f0 sj\u00e1lfan sig) heldur \u00e1framhaldandi leit a\u00f0 merkingu
  me\u00f0 \u00e1herslu \u00e1 fj\u00f6lskyldus\u00f6gu Bjarts.\\n\u00dea\u00f0 m\u00e1
  vel vera a\u00f0 \u00feetta hafi ekki veri\u00f0 Bjartur allra e\u00f0a \u00feau
  Sumarh\u00fas sem f\u00f3lk haf\u00f0i \u00ed huga, hva\u00f0 \u00fe\u00e1 \u201er\u00e9ttur\u201c
  skilningur \u00e1 s\u00f6gu Halld\u00f3rs. Hinsvegar kemst ma\u00f0ur ekki burt
  fr\u00e1 Bjarti e\u00f0a hans Sumarh\u00fasum ekkert frekar en \u00c1sta S\u00f3llilja.
  Hann fylgir manni lengi eftir a\u00f0 leiks\u00fdningunni l\u00fdkur. K\u00f3lumkilli
  leikh\u00fassins var \u00f6rugglega h\u00e9r. Miki\u00f0 hef\u00f0i \u00fe\u00f3
  veri\u00f0 gaman ef s\u00f3larlagi\u00f0 hennar Hallberu \u00ed Ur\u00f0arseli hef\u00f0i
  fengi\u00f0 a\u00f0 brj\u00f3tast \u00ed gegnum glufu \u00e1 steinsteypum\u00farnum
  svona \u00ed bl\u00e1lokin \u00feegar lj\u00f3st er, a\u00f0 allt sem Bjartur hefur
  tr\u00faa\u00f0 \u00e1 og tali\u00f0 l\u00edf sitt sn\u00faast um, er fari\u00f0
  veg allrar veraldar.\\nVar \u00feetta gott leikh\u00fas? Hva\u00f0 er gott leikh\u00fas?
  Er \u00fea\u00f0 a\u00f0 f\u00e1 margar Gr\u00edmutilnefningar e\u00f0a bara eina,
  eins og \u00ed \u00feessu tilviki? Eitt er v\u00edst, leiks\u00fdningin Sj\u00e1lfst\u00e6tt
  f\u00f3lk var \u00f3v\u00e6gin vi\u00f0 vi\u00f0fangsefni sitt, \u00fea\u00f0 f\u00f3r
  fram \u00e1kve\u00f0i\u00f0 helgimyndabrot, h\u00fan \u00feor\u00f0i a\u00f0 s\u00fdna
  okkur lj\u00f3tleikann \u00ed s\u00f6gu Halld\u00f3rs og umfram allt \u2013 h\u00fan
  vakti upp s\u00edgildu spurningu sem aldrei ver\u00f0ur h\u00e6gt a\u00f0 svara
  til fullnustu. Hva\u00f0 er gott leikh\u00fas?\\nEftirm\u00e1l\\n(1) S\u00fdningargreining
  m\u00edn er bygg\u00f0 \u00e1 \u00feremur s\u00fdningum sem \u00e9g s\u00e1 af Sj\u00e1lfst\u00e6\u00f0u
  f\u00f3lki \u00ed jan\u00faar, febr\u00faar og mars 2015.\\n(2) Englar alheimsins,
  leiks\u00fdning \u00e1 st\u00f3ra svi\u00f0i \u00dej\u00f3\u00f0leikh\u00fassins
  2013 ger\u00f0 eftir samnefndri sk\u00e1lds\u00f6gu Einars M\u00e1s Gu\u00f0mundssonar.\\n(3)
  S\u00fa leikger\u00f0 var eftir Kjartan Ragnarsson sem einnig var leikstj\u00f3ri.
  Leikger\u00f0in var \u00ed tveimur hlutum og Ingvar E. Sigur\u00f0arson l\u00e9k
  Bjart yngri \u00e1 me\u00f0an Arnar J\u00f3nsson l\u00e9k Bjart eldri.\\n(4) Forskeyti\u00f0
  ,,meta\u201d er gr\u00edskt a\u00f0 uppruna og \u00fe\u00fd\u00f0ir ,,eftir\u201d
  e\u00f0a ,,utan vi\u00f0\u201d og \u00ed samhengi leikh\u00fassins er \u00e1tt vi\u00f0
  efni sem er b\u00e6tt vi\u00f0 og stendur utan vi\u00f0 a\u00f0alfefni e\u00f0a
  eiginleika \u00feess verks sem teki\u00f0 er til s\u00fdningar.\\n(5) Lagi\u00f0
  var fyrst flutt af hlj\u00f3msveitinni Hjaltal\u00edn og er eftir Togga en textinn
  er eftir P\u00e1l \u00d3skar.\\n(6) Sj\u00e1 n\u00e1nar Mojca Kuplen: The Aesthetics
  og Ugliness \u2013 A Kantian Perspective. Proceedings of the European Society for
  Aesthetics vol. 5 2013. S\u00f3tt \u00e1 veraldarvefinn www.eurosa.org \u00ed ma\u00ed
  2015.\\n(7) Halld\u00f3r Laxness. Sj\u00e1lfst\u00e6tt f\u00f3lk. Reykjav\u00edk
  2007. Vaka Helgafell. Bls. 375.\\n(8) Ibid. Bls. 84. Undirstrikun m\u00edn.\\n(9)
  Ibid. Bls. 342. Undirstrikun m\u00edn.\\n(10) Ibid. Bls. 373. Undirstrikun m\u00edn.\\n(11)
  Ibid. Bls. 199. Undirstrikun m\u00edn.\"", "\"Tekjur r\u0137kissj\u00f3\u0161s voru
  samkv\u0119mt fj\u012frlagafrv. \u0137 haust \u012f\u0119tla\u0161ar 106 milljar\u0161ar
  436 millj. og gj\u00f6ldin r\u015bmir 110 milljar\u0161ar. Hallinn var \u012f\u0119tla\u0161ur
  3,7 milljar\u0161ar e\u0161a t\u0119pir 4. L\u012fnt\u00f6kur voru \u017e\u012f
  \u012f\u0119tla\u0161ar 13 milljar\u0161ar og \u017ear af voru 9 til afborgana af
  l\u012fnum.\\nN\u015b sl. f\u00f6studag, 5. des., m\u0119lti h\u0119stv. forsrh.
  fyrir bandorminum svokalla\u0161a en \u0137 honum var s\u012f ni\u0161urskur\u0161ur
  \u0137 frumvarpsformi sem bo\u0161a\u0161ur var \u0137 fj\u012frlagafrv. upphaflega
  auk \u017cmissa annarra lagabreytinga sem engan veginn geta talist til r\u012f\u0161stafana
  \u0137 r\u0137kisfj\u012frm\u012flum. Sem d\u0119mi um \u017ea\u0161 eru breytingar
  \u012f l\u00f6gum um kosningar til Al\u017eingis sem engu skila \u0137 r\u0137kiskassann
  \u012f n\u0119sta \u012fri.\\n\u0136 fyrradag komu svo loks fram hugmyndir r\u0137kisstj\u00f3rnarflokkanna
  um sparna\u0161 og ni\u0161urskur\u0161 til \u017eess a\u0161 n\u012f m\u0119tti
  til\u0119tlu\u0161um \u012frangri \u0137 samningu fj\u012frlaga eins og a\u0161
  haf\u0161i veri\u0161 stefnt, \u017e.e. a\u0161 fj\u012frlagahallinn yr\u0161i ekki
  yfir 4 milljar\u0161ar e\u0161a n\u012fnar tilteki\u0161 3,7. \u017da\u0161 vir\u0161ist
  vera heilagt markmi\u0161 hj\u012f h\u0119stv. r\u0137kisstj\u00f3rn a\u0161 fj\u012frlagahallinn
  ver\u0161i 4 milljar\u0161ar. Vissulega v\u0119ri gott ef \u017ea\u0161 markmi\u0161
  n\u0119\u0161ist. En ekki finnast m\u00e9r efnahagsr\u012f\u0161stafanir r\u0137kisstj\u00f3rnarinnar,
  sem n\u015b hafa liti\u0161 dagsins lj\u00f3s, v\u0119nlegar til \u012frangurs.
  Eins og \u00e9g sag\u0161i \u012f\u0161an, markmi\u0161in eru g\u00f3\u0161 ef \u017eau
  eru sko\u0161u\u0161 ein og s\u00e9r en ver\u0161a heldur \u00f3tr\u015bver\u0161ug
  ef \u017eau eru sko\u0161u\u0161 \u0137 samhengi vi\u0161 \u017ea\u0161 sem er a\u0161
  gerast \u0137 \u017ej\u00f3\u0161f\u00e9laginu. Ef vi\u0161 l\u0137tum til sj\u012fvar\u015btvegsins
  sem allt okkar efnahagsl\u0137f byggist \u012f, \u017ear sem um er a\u0161 r\u0119\u0161a
  78% af \u00f6llum okkar \u015btflutningi, \u017e\u012f er \u015btliti\u0161 ekki
  bjart. \u0136 sumar kom \u015bt sk\u017crsla Hafranns\u00f3knastofnunar um \u012fstand
  helstu nytjafiska vi\u0161 \u0136sland og aflahorfur fiskvei\u0161i\u012frin 1991--1992.
  \u017dar kom \u017ea\u0161 fram a\u0161 n\u017cli\u0161un v\u0119ri l\u0137til \u0137
  \u017eorski og \u012frgangarnir 1986--1990 v\u0119ru allir mj\u00f6g l\u00e9legir.
