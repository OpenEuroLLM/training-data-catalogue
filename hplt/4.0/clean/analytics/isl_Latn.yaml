  Starlink sem byggir \u00e1 gervihn\u00f6ttum.\\nLestu meira => Hlutverk Starlink
  \u00ed mann\u00fa\u00f0ara\u00f0sto\u00f0\"", "\"Forngerlar\\nForngerlar, fyrnur[1]
