  \u00fej\u00f3nar og pr\u00e9dikar,. H\u00e6gt er a\u00f0 komast [...]\"", "\"H\u00f6fum
  \u201eefni \u00e1 a\u00f0 laga gallana \u00e1 kerfinu\u201c\\n\u201e\u00c9g \u00e6tla
  a\u00f0 r\u00e6\u00f0a um vinnumarka\u00f0inn, l\u00edfeyriskerfin og l\u00edfeyrisr\u00e9ttindin
