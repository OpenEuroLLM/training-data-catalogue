  \u00e1 \u00fdmsum ger\u00f0um b\u00fasv\u00e6\u00f0a.\\nTengt efni[breyta]\\nTenglar[breyta]\\n-
  V\u00edsindavefurinn: \u201eHva\u00f0 geti\u00f0 \u00fei\u00f0 sagt m\u00e9r um
  fornbakter\u00edur?\u201c\\n- V\u00edsindavefurinn: \u201eHva\u00f0 eru hvera\u00f6rverur?\u201c\\n-
  \u00d6rverufr\u00e6\u00f0i (\u00d6RV1103)\\n- Introduction to the Archaea\"", "\"Helgistund
