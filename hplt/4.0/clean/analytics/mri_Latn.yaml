  awhi kiore*1)\\nRaina hononga 13.Conveyor:2 Pcs\\n14.Raina whakatika tawh\u0101
  kamera:1 PC(Plug*3)\\n15.Handle:2 PCS(M4*6 screw*6)\\n16.Seal mowhiti o te kai:
  10 Pcs\\nWhakap\u016bt\u0101tanga\\nRohe e tika ana + Awhe Whakapuru\\nNga Taipitopito
  o roto o te PNP\\nTuatoru-Waahi Whakauru Hononga Aunoa Mai i te maui ki te Matau,
  PCB Aunoa\\nServo Motor+Arahi Rerewe\\n0201 Whakaturanga Whakanoho\"", "\"I te R\u0101horoi
  po, London kaiwhakatairanga Mark Lyon e Billy James-Elliott kawea te hui Ingarangi
  tuatahi ki te ng\u0101 toru wahine p\u0101ngia mekemeke ngaio, Heoi ki te whakatutuki
  i tenei tuatahi h\u012btori m\u014d Women o Mekemeke, te one t\u0101imu''a, fakangofua
  ia nei hui i te taha o te Mekemeke Commission Malta, i ki patua te taumata maere
  o te raweketia, i tetahi atu whakahaere mekemeke me ratou mau hoa melo EBU.\\nEngari
  i te noho i runga i te t\u014drangap\u016b, kia mihia ia katoa e whai w\u0101hi
  i roto i te atamira o tenei hui h\u012btori, kahore atu na i to nga kaimekemeke
  w\u0101hine, i tangohia e wahi.\\nTeam Mua GB kaipara (Putt koperea, Hammer Whiu
  me poro\u0101whio), Hanga o Peckham Shaunagh Brown tona tuatahi ngaio ki hoa debutant
  Xena Ball o Ireland.\\nBrown i te ngoikoretanga matua, te ia anake te ao kaimekemeke
  Wahine e whakataetae i roto i te wehenga Cruiserweight, na roto i te ia ki te whawhai
  i roto i te wehenga taumahamaha ki te hoariri etahi e rima tekau pauna taimaha atu
  ia.\\nKo peka te a''ee ko te pihikete, kihai i puta te Londoner plucky kia fazed
  i katoa e p\u0101 ana ki te rerek\u0113tanga taimaha, i roto i te meka wawe ki runga
  ki taua mea, ko tango ia i te whawhai ki te Ball o Ireland.\\nBall, he kaimekemeke
  taitamariki classy ki ringcraft pai ko rite matika rite mai ratou, ihirangi ki te
  tuku mai i te Londoner mua, i mua i takahi i mua ki rawa, tino tere fWhakaritenga
  ringa rua ki te faahepo i Brown hoki ki nga taura, puta noa i te a''ee.\\nBrown
  i te aro ki te rerek\u0113tanga i waenganui i te rahi ia me tona hoariri, taea ki
  te pana Ball atu i okioki i runga i ona p\u016bkenga mekemeke pai ki te pouaka a
  ia ara i roto i te ati.\\nI muri rauna e wha o mariko mahi mutu-kore, piro kaitautoko
  Lee Murtagh te a''ee i manakohia o te Ireland Xena Ball 40-36, te kupu tika, kahore
  feaa, engari e kore e tino whakaatu i te kounga o te pai Brown o ki te mahi taumahatanga.\\nHinga
  K\u014dm\u0101m\u0101 Sam Smith i Leeds, Ko muri i roto i te mahi Yorkshire, nei
  i muri i kore iti iho i te whitu huringa o hoariri i roto i te mata ki runga ki
  te whawhai po, fehangahangai i Riga he debuting Alina Lisova i Latvia.\\nSmith,
  nei i roto i tona aito a''ee beat o mua ite Zsofia Bedo ki te mau i te taitara International
  Masters K\u014dm\u0101m\u0101, mooni Raniera Lisova, haehae ana i te kotiro Latvian
  debuting motu ke, me te tu ia ia i roto i tika meneti kotahi me tekau h\u0113kona
  o te a tawhio tuatahi.\\nKo te a''ee wahine whakamutunga o te po kite Woolwich,
  Ingarangi a London #1 runga (E rua Super wh\u0101 ko Pauna-hoki-Pauna) me te kingi
  MBC International Super wh\u0101 Champion Marianne Marston, i roto i te rounder
  aito-kore ono.\\nKa rite ki te Sam Smith, Marianne i maha huringa o te hoariri,
  e iwa i roto i tona take unuhia atu, i roto i te hanga ki runga, me te pae hopea
  fehangahangai Riga, A Latvia Jekaterina Lecko, nei i roto i te Hune whawhai o Germany
  Alice Melina Kummer mo Tiamana te taitara K\u014dm\u0101m\u0101.\\nWhakat\u016bt\u016b
  iho Lecko te catwalk rite ko ia he tauira, ahakoa Marston, he tauira t\u016bturu
  o mua, hanga nui atu tona tomokanga i roto i te aratau whawhai, wahia tahi ona karapu
  rite whakaae ki te whakahari o te tautoko i te ope wahine nui i roto i te haereraa
  i te.\\nKo te rerek\u0113tanga i waenganui i te rua ko noa atu kitea, no te nekehia
  atu Marianne tautoko ia taimaha T-Shirt ki te whakaatu ia fakam\u0101toato pipiripia
  Force.\\nHaere Marston tonu i runga i te ino, Lecko akina ki te whakawhirinaki i
  runga i akiritia atu tona werohanga i roto i te kaha rua ki te \u0101rai i te Londoner
  whiwhi i roto i te wh\u0101nuitanga, Marston kore anake ka i roto i te wh\u0101nuitanga,
  engari ka timata ia kotahi i reira hoatu i te he haapiiraa mekemeke Latvian te ia
  pea ki te wareware i roto i te ia.\\nTe huri t\u0101tai haere Lecko ki rere atu
  ano taua, Heoi ko o te taumata i taua e ko ia taea ki te kati iho ringcraft o Marston
  ka hatepea atu i tetahi huarahi e mawhiti, i mua i te t\u0101rua i te Latvian i
  runga ki te taura ki te whakaeke ringa rua nanakia, te hua i tahoroa m\u014d Lecko
  i tonoa ki te koaka ki noa e rima h\u0113kona e toe o te a tawhio tuatahi.\\nT\u012bmata
  Marston te tuarua i roto i rite rua ki te tuatahi, tango i te whawhai ki a Lecko,
  nei ka timata inaianei i whiua e ringa matau nui i roto i te ngana ki te pupuri
  i Marston i te kokoru.\\nKi tenei rauhanga te oreraa, e tika ana ki te kaupapa teitei
  o Marston, An\u014d Lecko ki te haere haere e p\u0101 ana ki, i oreore i te Londoner,
  ko kotahi ano taea ki te hatepea atu te whakakai me aua te Latvian ki te taura,
  ka timata tetahi huaki ringa rua, Lecko katoa e taea e ko hipokina ake me tumanako,
  tera e Kilisimasi Marston ia i roto i, e kore a muri i ia te mea he pakeke, ehara
  i te mea ko te whakaaro i taua ara te reira, marere kaitautoko Ken Curtis i roto
  i a poipoia atu te a''ee ki te whakaora Lecko i te knockout k\u012b, i runga i te
  tohu kotahi meneti, me te rima tekau tuarua o te rua o a tawhio noa.\\nI muri i
  te Kaiwhakatairanga hui korero Mark Lyons poto e p\u0101 ana ki p\u0101ngia e toru
  nga Women o.\\n\\\"Tuatahi hiahia ana ahau ki te whakawhetai ki te kaimekemeke katoa
  i tangohia e wahi i roto ii teie p\u00f4 o te whakaatu me te tikanga o taku katoa
  o ratou, OK farii ahau e kore i etahi o nga hoariri kati ki te taumata o to tatou
  kaimekemeke, engari e kore e ko e tetahi o te tetahi he whawhai.\\nE kore e taea
  e ahau te whakawhetai Xena, Jekaterina ko Alina nui mo te tiaki i te p\u0101ngia
  wahine, katoa marere enei tamahine i roto i i te meneti whakamutunga i muri i te
  maha wawau o faaho''i faahou te tika ki tuma i tetahi atu whakahaere.\\nKo peka
  haere enei kotiro, ka ora te whakaaturanga, a i te whakahaere ia tatou ki te hanga
  h\u012btori, Ko tatou te tuatahi ki te whai p\u0101ngia e toru wahine i runga i
  te hui mekemeke pro UK.\\nFakat\u0101utaha ahau whakaaro o Shaunagh whawhai ki a
  Xena ko te tu i roto i a''ee, no te mea e kore e tika i haere te reira i te tawhiti,
  engari no te mea ko te reira i te whawhai fantastic, ahakoa i reira ki te whawhai
  i taumahamaha rite reira he kore atu Cruiserweights i roto i te ao.\\nUa pouri ahau
  mo Sam, Ko Alina te ara ngawari rawa hoki te tangata o ona p\u016bkenga, te taua
  ki a Jekaterina, e kore ia ko tata ki te piha o te toa Marianne tika kia whawhai.\\nKo
  te tino rerek\u0113tanga ko to tatou kotiro tino he ngaio i roto i nga ara, faaineine
  ratou no te whakataetae i roto i rite te ara ano i rite te kaimekemeke toa.\\nTitiro
  i Marianne, Ngakau rua ahau i reira he maha nga kaimekemeke toa e whai he taua tinana
  faahotu e, e kotiro he m\u014dkihi waru, Ko ia hei whakaako ia kotahi i nga ra me
  te r\u0101kau hei \u0113tahi kaimekemeke toa tino p\u016bmanawa ki te whakarite
  me te whakaatu i te reira.\\nKo ahau whakakake ki te whai i enei kotiro whawhai
  i runga i to tatou kaupapa me kore e taea e tatari mo te muri, to ratou tautoko
  i fantastic, kahore i kite ahau i pera maha mata''ita''i wahine i te k\u0113mu mekemeke
  i mua i.\\nHurihia i runga i Oketopa 23RD Fafau atu nei au i reira e p\u0101ngia
  atu wahine i runga i taua whakaaturanga rawa \\\".\"", "\"1. (verb) (-hia,-ina)
  to remove (a covering), show (cards), uncover, expose, unveil.\\nN\u0101, kia m\u014dhio
  t\u0101tou, ko ng\u0101 t\u012bwaiwaka e t\u012btakataka nei ka hura r\u0101 hoki
  ng\u0101 hukumaro ki runga, ka riro ko te upoko ki raro (TTT 1/10/1929:1086). /
  Now, we should know that fantails flit about opening their tail feathers up and
  with their head going down.\\nmaiki, tango, tauwehe, m\u0101kerekere, whakahorohoro,
  unuunu, h\u012bkaro, huaranga, opeope, k\u0101haki, hiki, tohu, tiata, whakaatu,
  whakaariari, whakaaturanga, whakaari, whakaatuatu, whakakite, tohutohu, t\u012btohu,
  mataraharaha\\n2. (noun) exposure.\\nM\u0101 te kaihopu whakaahua e whiriwhiri m\u0113n\u0101
  m\u0101na tonu e tohu te huranga, ar\u0101, te roa e huaki ana te k\u014dpani kia
  uru ai te aho, m\u0101 te p\u016b whakaahua r\u0101nei e tohu (RTA 2014:143). /
  It is for the photographer to decide if she herself will select the exposure, that
  is the length of time that the shutter is open so that the light enters, or the
  camera automatically does it.\\n1. (verb) be separated, disengaged, removed, stripped
  off - only used in this passive form.\\nHeoi, ka hoki te wahine pononga. Ka noho
  te tuahine o Tiki. K\u012bhai an\u014d i ngaro atu i tua i te more, ehara kua heuea
  atu e te wahine ng\u0101 k\u0101kahu o Oneone (JPS 1952:190). / And so the female
  servant went back. Tiki''s sister remained. The servant had not disappeared round
  the headland before she had stripped off Oneone''s garments.\\n1. (verb) to be excited,
  angry, fanatical, impassioned, passionate, ardent, fervent - sometimes written as
  two words, i.e. manawa wera.\\nHe tangata kaha a Arapeta ki te whawhai i ng\u0101
  kaupapa i manawawera ai ia (TTR 1998:178). / Albert was a strong fighter for causes
  he was passionate about.\\n2. (noun) anger, excitement, volatile nature.\\n3. (noun)
  type of haka with no set movements performed especially at tangihanga, unveilings
  and after speeches.\\n(Te K\u014dhure Textbook (Ed. 2): 69;)\"", "\"Ko te hinu MCT
  he tino rongonui mo ona huanga ngako-tahu me te ngawari te keri. He maha nga tangata
  e aro ana ki te kaha o te hinu MCT ki te tautoko i o raatau whainga tinana ma te
  whakapai ake i te whakahaere taumaha me te mahi whakakori tinana. Ka taea e nga
  tangata katoa te painga o ona painga mo te ngakau me te roro.\\nHe aha te whakamahi
  mo?\\nI te nuinga o te wa, ka whakamahi nga tangata i te MCT hei awhina mo:He raruraru
  te tango ngako, mat\u016bkai raneiTe taumahatangaTe whakahaere hiahiaHe kaha ake
  mo te korikori tinanaTe mumura.\\nHE AHA TE MCT OIL?\\nKo nga MCT he \\\"pai ake
  mo koe\\\" nga ngako, ina koa ko nga MCFA (wakawa ngako mekameka-waenganui), aka
  MCTs (medium-chain triglycerides). E wha te roa o nga MCT, mai i te 6 ki te 12 waro
  te roa. Ko te \u201cC\u201d te tikanga o te waro:\\nC6: waikawa potae\\nC8: waikawa
  caprylic\\nC10: waikawa potae\\nC12: waikawa lauric\\nKo te roa o te reo ka whakawhiwhia
  ki nga MCT nga paanga ahurei. He tere, he pai hoki te huri ki te kaha, na reira
  ka iti ake te huri ki te ngako tinana. Ko te \\\"te nuinga o te reo\\\" o nga waikawa
  ngako-mekameka, ko te C8 (waikawa caprylic) me te C10 (waikawa capric) MCTs, he
  tino painga me te rua i roto i te MCT Oil. (\\\"RUA\\\" Raina Whakaputa ka taea
  ki te 98% te ma o C8 & C10)\\nNo hea?\\nKo te hinu MCT he mea hanga mai i te hinu
  kokonati, hinu pata nikau ranei. He MCT kei roto.\\nKo te huarahi e whiwhi ai te
  tangata i te hinu MCT mai i te hinu kokonati, hinu pata nikau ranei na roto i te
  tikanga e kiia nei ko te hautanga. Ka wehe tenei i te MCT mai i te hinu taketake
  me te whakakoi.\\nW\u0101 tuku: Nov-19-2022\"", "\"Ko te yoga sivananda, he momo
  rereke o te yoga tuku iho, i hangaia e Swami Vishnudevananda, i nga tau 50, i reira
  ka whakangawarihia e ia nga whakaakoranga o te yoga tuku iho kia tere ai te whiwhi
  painga tinana me te hinengaro, i roto i tenei tuhinga ka ako koe mo tenei kaupapa.\\nTohutoro\\nWhakamaramatanga
  o Yoga Sivananda\\nKo tenei momo o te yoga tuku iho he putake i roto i nga whakaakoranga
  a te Kaiwhakaako Swami Vishnudevananda, i te tau 1957. Ko te whainga matua ki te
  hanga i te ako he pai ake te uru atu ki te ao o te Tai Hauauru, kia taea ai e koe
  te whakangawari i nga tikanga o te yoga, ka tere ake te eke ki te kikitanga o te
  tinana me te wairua.\\nKei roto ko te tuku tikanga tuku iho me te matarohia ki te
  hatha yoga, he mea motuhake e taea ai te tangi me te whakaroa i te tinana, na te
  mea he ahua uaua ake i roto i tona ahua. asanas me te manawa. I roto i te take o
  te sivananda yoga, ka kitea ko nga whakaakoranga a te kaiako i whai tika ki te whakarite
  hononga ki nga tangata noa.\\nKo te pupuri i ana tikanga me ana korero i runga i
  nga maapono taketake ko te manawa, te whakakorikori, te whakangawari, te whakaaroaro
  me te kai, me enei kupu i whakawhiwhia e Swami nga taputapu ki nga mano tangata.\\nI
  roto i ana kaupapa matua ko te kawe i nga mea katoa el ao enei taputapu tawhito,
  kia whiwhi ai i nga painga nui o te tinana me te hinengaro, i reira ka ngana etahi
  ki te whakamahi hei rongoa mo etahi mate. (Tirohia te tuhinga Yoga)\\nHe ngaru\\nE
  kiia ana ko te pranayamas, he waahanga o nga kaupapa matua mo te mahi o nga asanas,
  ka mahia i roto i te riipene me te hohonu, kaore i te tere me te tino marino, ka
  tukuna e ratou te pai o te oxygenation o te whakaaro me te awhina nui ki te whakahou
  i te tinana.\\nTe whakangahau\\nI whakawhiwhia ki te ingoa savasana, he tikanga
  e rapuhia ana kia waiho te tinana i roto i te ahua pumau me te tino marie, na tenei
  tikanga ka whiwhi te ngakau marie katoa, ka tae ki te waahi kore o te whakang\u0101
  ka tae tatou ki te waahi pono. Tuhinga o mua .\\nKai\\nHe mea tino nui ki te whakakotahi
  i enei maataapono taketake katoa me te kai taurite, tata katoa te whakakore te waipiro,
  te kai maori ranei, te karo i te nui o te paraoa, te kai i te nui o nga huawhenua,
  kia pai ai te kai o te kai.\\nMeditaci\u00f3n\\nKo tenei taputapu e pa ana ki whakaaro
  pai, e awhina ana ki te whakahaere i te ahotea, na roto i te marino o te hinengaro,
  ka puta mai te auahatanga o te whakaaro i te wa e watea ana te hinengaro ka waiho
  ki te taha nga mahi kino katoa kei roto i o tatou hinengaro.\\nKa tutuki tenei mahi
  ma te whakakore i enei whakaaro, me hanga, me whakauru ranei ki roto i o tatou maharatanga,
  ka puta ki te maramatanga ka noho hei wahanga o te tangata i te wa e whakahaerea
  ana nga huihuinga.\\nAsana\\nKa whakaarohia ko nga tuunga i roto i te Yoga, me tetahi
  o nga maataapono taketake o Sivananda yoga, he pai ake taatau ki te whakawh\u0101nui
  ake i tenei kaupapa na te mea ko tetahi o nga mea tino nui me te tino tohu mo te
  ahurea yoga katoa, ko tona hiranga ko te hanganga taketake mo te hinengaro- hononga
  tinana.\\nI etahi wa, ka whakaarohia ano nga mahi motuhake, e taea ai te whakatuu
  i te hononga o te tangata wairua ki te tinana tinana, kia taea ai e te whakamahi
  te tangata ki te whakakii me te whakataurite i nga kaha kore e tau ana e raru ai
  te tinana me te hinengaro i roto i tona oranga.\\nHe wahanga enei o tetahi o nga
  maapono taketake o tenei momo yoga me etahi atu taputapu e awhina ana ki te whakapai
  ake i ta tatou huarahi ki te whakarite i a tatou ano mo te oranga, te hanga mapi
  mo nga ahuatanga rereke rawa atu i nga mea i whakaarohia e nga tikanga tuku iho.\\nKo
  nga asanas i roto i te sivananda yoga he mahinga o nga mahi me mahi tonu ki te timata
  ki te hono atu ki te taha wairua, ka mau mai i nga painga nui mo te wa poto mo te
  ahua o te tinana, he uaua nga uaua, he waatea nga nerves me te whirihora e te tinana
  nga tikanga kano mate. kia taurite te hauora.\\nI roto i te nuinga o nga asanas
  e whakamahia ana i roto i te Sivananda yoga, kei a matou etahi he mea nui ano hoki
  i roto i te yoga tuku iho.Heoi, i whakawhanakehia e te Kaiwhakaako Swami he raupapa
  o nga asanas taketake kia kore ai nga tangata e raruraru i roto i to raatau whanaketanga
  me te whakamahinga.\\nSirshasana\\nI whakaarohia ko te kuini o asanas, ko tenei
  tuunga tetahi o nga mea tino nui mo nga tuunga hurihuri, ko tana whakamaoritanga
  mai i te Sanskrit te tikanga \\\"Tautoko me te tautoko\\\", na reira he tuunga mahunga
  me te tautoko o nga ringa, kei reira e mau ana te te taumaha katoa o te tinana.\\nKo
  tenei tuunga ka poauau te tini i te mea e whakaponohia ana ka taka te taumaha o
  te tinana ki runga i te mahunga, engari ehara tenei i te mea, ko nga tautoko o nga
  ringaringa ka riro katoa te taumaha o te tinana. I te mea ka huri ke te tuunga,
  ka taea e ia te rere toto ki te mahunga, ka taea te whakatuwhera i te chakra Sahasrara.\\nKo
  tehea te pokap\u016b o te whakaaro nui me te wairua wairua o te tangata, te whakaputa
  i te hononga o te upoko ki te whenua, ka taea te tuku i nga raruraru, te whakaora
  i te ahotea me te whakaora i o tatou kaha, i muri mai ka kite tatou i te raupapa
  e tu ana i te wa o te mahi sivananda yoga tenei t\u016b\\nSarvangasana\\nKo tenei
  tuunga ka mahia i runga i nga pakihiwi, ka anga ki mua o te tinana, ki mua o te
  tinana, ka kiia ko te turanga rama na te mea he mea nui te pout\u016b kia taea ai
  te whakawhanake, e 6 ana momo rerekee me whakawhanake i te wa e riro mai ai nga
  taumata. o te tohungatanga.\\nKo te tuunga tetahi o nga mea tino nui i roto i nga
  huringa yoga, a ko te mea ngawari ki te mahi, ko etahi atu tuunga hurihuri ka timata
  mai i a ia, na reira i kiia ai ko te whaea o nga huringa. He hononga tata ki te
  ahua o te maunga (Tadasana), ka awhina i te whakataurite i nga wai o te tinana,
  a, ko te kaupapa matua mo te whakang\u0101 hinengaro.\\nI roto i nga momo rereke
  o te turanga rama kei a maatau e whai ake nei:\\n- Ardhana Sarvangasana\\n- Niralamba
  Sarvangasana\\n- Salamba Sarvangasana\\n- Eka Pada Sarvangasana\\n- Padma Sarvangasana\\nKaore
  i te t\u016btohutia mo te hunga hapu me te hunga he mate ngakau, mo te hunga neke
  atu i te 70 tau te pakeke, engari ka taea e nga tangata e mau ana te ahua o te tinana,
  ahakoa te pakeke, te whakawhanake i tenei asana whakamihiihi.\\nhalasana\\nKa kiia
  ko te waahi parau, ka timata koe mai i te tuunga savasana, katahi ka hikina o waewae
  ka tata ki to tinana me te totoro paku, kei runga tonu i to mahunga. E rua nga ahuatanga
  o tenei tuunga me te maha o nga momo rereke (P\u0113r\u0101 i te asana katoa), i
  waenga i nga putanga e rua ko te mea tino ngawari ka mahia me nga ringa totoro.\\nKo
  te putanga tuarua he iti ake te uaua ki te pa atu nga ringa ki nga waewae, ka kiia
  he waahi hurihuri o te yoga, (I te wa kei runga ake te ngakau i te mahunga), ka
  whakamahia i etahi wa ki te whakarite i tetahi atu waahi. He maha nga wa ka whakamahia
  e te hunga timata i tenei tohungatanga.\\nKo nga momo rereke e whakawhiti ana i
  nga tuunga o nga ringa me nga waewae, i te taurite tonu me te tinana, ka awhina
  nga whakarereketanga ki te whakangawari i nga uaua me te whiwhi i nga painga o te
  hauora o te roro, ko tetahi o nga painga nui.\\nKa awhina ano hoki ki te whakapakari
  i te tuara, te whakataurite i te tuunga me etahi waa ka whakakore i te scoliosis.
  Mo nga ringaringa he mea nui ano hoki, na te mea ka kaha me te kaha, mo te rohe
  o te puku ka awhina ki te whakapakari i nga whekau kei roto i taua waahi, me te
  whakapai ake i te nakunaku.\\nMatsyasana\\nKa kiia ko te tuunga o te ika, ko te
  tuara ka anga whakamuri, ko nga waewae kei roto i te turanga lotus, ka kiia na te
  mea ki te mahia i roto i te wai ka ngawari te rewa. Na tona turanga aerodynamic,
  pera i era atu o nga asanas, he maha nga rereke o tenei tuunga.\\nI roto i nga painga
  tino nui e homai ana e tenei tuunga ki a tatou ko te whakatikatika i nga raruraru
  me nga rereketanga o te pou i roto i te tuara. Ko te tuku i te ahotea na roto i
  nga uaua uaua, ka aro nui ki te whakatikatika i nga tuara, e awhina ana ki te whakataurite
  i nga raruraru mai i te kaki ki te coccyx.\\nMai i te tirohanga wairua, ma tenei
  tuunga ka taea e tatou te piki ake ki te taumata tino teitei e whakahoahohia ai
  nga chakras ngakau, e arahi ana i te kaha o roto ki te kaki, te tuara me te pokohiwi.
  Ko tenei asana te mea tuatahi ki te whakatika i nga raru o te tuara.\\nPaschimottanasana\\nE
  mohiotia ana e te ingoa o \\\"The seated clamp\\\", he tuunga e whakamahia ana hei
  totoro i te tuara, me kaha to whakaaro me te whakahaere i to manawa i runga i te
  tikanga; Ka mahia ma te totoro o nga waewae ki te teitei me te kawe i tetahi wahanga
  o te tinana ki mua, ka mau nga waewae me nga ringa me te kawe i te mata ki nga turi.\\nHe
  mea tino nui tenei tuunga ki te whakangawari i nga uaua o nga waewae, ma te hinengaro
  ka awhina i te whakataurite i nga waahi o te hinengaro koretake, ka tino awhina
  ki te tuku i nga raruraru me nga raruraru; Mena ka whakamahia tika, ka kitea nga
  ahunga whakamua nui i roto i ta tatou whakatau i etahi ahuatanga o te ao.\\nHe rereke
  nga ahuatanga o te tuunga, me whakakiia ki te manawa tino hoha, i nga taumata teitei
  ka eke te whakang\u0101 o te whakang\u0101, i reira ka roa te roa o ia kaimahi i
  roto i te okiokinga.\\nBhujangasana\\nKo te tuunga Cobra, he tuunga tino rawe, ahakoa
  te ahua ngawari, ka whara i te taumata uaua, ko tona ingoa i whakamaoritia ko \\\"Cobra\\\",
  he ahua rite ki te tuunga o te nakahi i te wa e noho ana ia i roto i te tuunga parepare.
  . Ko te tikanga ko te toronga i te tuara kia pakeke ki te taumata o te coccyx.\\nKei
  te arotahi ki te whakapakari i nga uaua o te gluteus me te tuara, kaua e mau te
  tuunga mo te neke atu i te 30 h\u0113kona, katahi ka rerekee, ka whakahoki ano ranei
  i runga i te raupapa whakangungu, ka whai hua tonu ki te tuara, ka awhina i te whakapakari
  i nga ngongo. , nga pakihiwi me te puku.\\nHe pai te rere o te toto ki nga whekau
  kei roto i te puku, e tere ai te hauora. I roto i nga take a-iwi-a-hinengaro, he
  mahi ki te whakaiti i te taumahatanga o te ahotea o ia ra, e taunaki ana mo nga
  turoro mate huango, engari ka aukatihia mo te hunga e mate ana i tetahi mate, i
  etahi atu mate.\\nsalabhasana\\nKa kiia ko te mawhitiwhiti, he mawhitiwhiti ranei,
  he tu ka mahia i runga i te anga ki raro, katahi ka ata haere ki te hiki i te taha
  o runga me te taha o raro, kia tau katoa te kaha ki roto i te puku. Ehara i te mea
  he tino uaua te tuunga, hei karo i nga whara me ata mahi me te aro nui.\\nKei a
  ia etahi momo rereke e kii ana ki te hunga timata ki te hapai i tetahi waewae i
  ia wa, ko te ahua pai ko te ahua o te lobster kei raro iho te mahunga i te teitei
  o nga waewae.\\nKo te manawa me te kuk\u016b te tino turanga e taea ai e koe te
  mahi i tenei asana, me ruruku nga ringa ki nga waewae kia rapua he waahi o te taurite,
  ka taea e te whakangawari te whakatutuki i nga whaainga. (Tirohia te tuhinga: tau
  o aquarius)\\nI roto i nga painga tino nui ka taea e tenei asana te homai ki a tatou
  ko te whakang\u0101 o nga uaua o te hope, te whakaongaonga o te punaha o te ngakau
  aroha, ka awhina ki te tuku i te pouri me te mangere o te tinana me te hinengaro.\\nDhanurasana\\nKo
  te ahua o te kopere, ko tona ingoa he rite ki te kopere, ko nga waewae me te rama
  he tohu pere me nga ringaringa he taura. E ai ki te korero i hangahia tenei tuunga
  kia puta ai te kaha me te kaha o nga whakaaro me nga whakaaro.\\nKa whakakaha me
  te awhina i te hinengaro ki te tuku korero pai kia rite ki te tere me te tere o
  te pere, no reira ko tana hononga nui ki te kopere, me awhina nga nekehanga o te
  awangawanga ki te hanga i tenei tirohanga.\\nE rapu ana ia ki te kimi i te toenga
  tika ma te whakapau kaha, he tuunga tino whakamere me kaha te tinana ki te aukati
  i te taumahatanga o te pehanga, me whakahaere te manawa me te kawe haere ki te tinana
  kia taea ai e ia te tuku atu i nga taumahatanga katoa ki te tinana me te hinengaro.
  , ki muri ka tukuna tahi me nga poke e mahia ana e te tinana ake.\\nKakasana\\nKa
  karangahia ano ko Bakasana, ko te ahua o te koroke ranei, koinei tetahi o nga asana
  e whakahaere ana i te kaupapa o te pauna tinana, ka whai kaha ki nga ringa me nga
  ringaringa, a, i roto i nga take hinengaro he awhina nui ki te whakataurite i nga
  kare-a-roto, nga kare-a-roto me nga ahuatanga.\\nKa mahia tenei tuunga i runga i
  nga tohutohu a te kaiwhakaako, na te mea ko te tino uaua o tenei tuunga ko te pupuri
  i te taurite. Hei timata, me noho te tangata ki raro, me tuwhera nga ringa me te
  okioki ki te whenua, me tuwhera ano nga turi me te pouaka ki waenganui i a raua.\\nKa
  okioki ano te pito o nga waewae ki runga i te whenua i mua i te tiimata i te nekehanga
  e kawe ai tatou ki te tuunga e tika ana, katahi ka anga whakamua te rama, ka mau
  tonu te mahunga ki mua, ka aro tonu ki tetahi waahi motuhake; katahi ka timata ratou
  ki te hiki i o ratou waewae iti, me te whakapau kaha ki te whakatutuki i te turanga
  e tika ana.\\nHe mea nui ki te tango i etahi manawa puhoi me te kore e pouri; me
  u tonu te titiro ki te waahi, ka piko nga tuke me nga turi ki runga i te haurua
  o runga o nga ringaringa, ka mau tonu te tuunga kia tika.\\nKei roto i nga painga
  o tenei tuunga ko te whakapakari i nga ringaringa me nga ringaringa, ka mau tonu
  te tinana i roto i te taurite o te hinengaro me te tinana, ka whakahohehia te aukati
  o te tinana e taea ai e tatou te pa atu ki nga ahuatanga o ia ra me te kaha ake.\\nmayurasana\\nE
  kiia ana ko te ahua o te Peacock, he asana ano hoki, kei reira te turanga matua
  ko nga ringaringa, e whiwhi ana i nga pehanga katoa me te kaha o te tinana. Ko tenei
  tuunga ka whakatau i te mana whakahaere ko te pakari, ka awhina i te whakataurite
  i te kaha o te hinengaro i te wa e pa ana ki nga ahuatanga pehanga, e whakamahia
  whanuitia ana e te maha o nga tangata taumata teitei e mau ana i nga tuunga whakahaere.\\nE
  whakaponohia ana koinei tetahi o nga asana tawhito e pa ana ki nga mea e taurite
  ana, kei te noho te tinana i te tuunga whakapae, engari he rereke nga ahuatanga
  o te tuunga e pa ana ki nga tangata e timata ana ki te mahi yoga. , a etahi kua
  whai wheako me te wa ki te mahi i te tohungatanga.\\nPadahastasana\\nKoia tetahi
  o nga tuunga tuarua e whakamahia ana i nga huihuinga yoga Sivananda, ka mahia ma
  te whakaroa i te tinana ki mua, katahi ka mau nga ringa ka mau nga waewae ka rukuhia
  te mahunga ki waenga i nga waewae, kia tere ai te whakang\u0101. .\\nKa awhina tenei
  asana ki te whakarite i te whakahaerenga o te rere toto ki te rohe thoracic me nga
  waewae, ko te pupuhi e mahia ana me nga ringa ki muri o taua mea, ka awhina i te
  tangi me te whakakore i etahi raruraru vascular, engari kaore i te tino t\u016btohutia
  mo nga tangata. me nga raruraru ngakau.\\nTrikonasana\\nKoia tetahi o nga mea e
  tino taunakitia ana kia whakamutua te wahanga whakamutunga, he ahua tapatoru e tino
  awhina ana ki te whakangawari i nga uaua o te tinana katoa, he tuunga tu, kei reira
  nga ringa e toronga tuwhera ana ka hanga he momo tapatoru.\\nHe mea nui tenei tuunga
  i te mutunga o nga huihuinga, na te mea ka taea e ia te whakatuwhera me te whakangawari
  i nga uaua katoa e mahi ana me te whakapau kaha i te wa o te huihuinga, me noho
  nga nekehanga mo tona whakatutukitanga, me te manawa maeneene me te taurite. (tirohia
  hoki Yoga nidra)\\nNga painga o te Sivananda Yoga\\nKa whakaarohia he punaha yoga
  tino whai kiko, kei reira nga turanga tekau ma rua taketake me te ngawari ka taea
  e nga tangata te whakatutuki i te pauna hinengaro, wairua me te tinana; Ka awhina
  ano ki te whakatutuki i nga painga nui e awhina tonu ana ki te whakanui ake i te
  kounga o te oranga o te tangata, i roto i nga painga tino nui kei a matou:\\n- Te
  aukati i nga mate, penei i te r\u016bm\u0101tiki, te rewharewha kaha, te mate huango,
  me etahi atu.\\n- Ka whakatuwherahia nga hongere hiko e taea ai te whakahohe i te
  punaha aroha me te whakawhanake i nga momo whakahaere whaiaro me te kano kano tinana.\\n-
  Ka whakapakari i nga uaua me nga whekau o roto.\\n- Ka awhina i te whakamaarama
  i te hinengaro, ka puta nga whakaaro kino, ko te whakangawari te mea tino whakaihiihi
  ki te whakatutuki i tenei pauna.\\n- Ka whakanui ake i te oranga me te kaha o te
  tangata, ka whakaiti i te tupono ka pa ki nga mate.\\n- Ka whakaw\u0101tea i ng\u0101
  p\u016bkahukahu o ng\u0101 t\u0101oke kino, ko ng\u0101 tikanga manawa e pupuri
  ana i enei whekau ki te mahi tonu ka whakapaehia me te ruruku, e awhina ana ki te
  whakawhanake i a raatau mahi ma te tino taurite.\\n- I runga i te taumata wairua,
  taumata o conciencia teitei ake.\\n- Ka whakaihiihi i te aro ki nga mahi katoa\\n-
  Ka whakawhanakehia he taumata whakangawari nui, i te nuinga o te wa ka whakaitihia
  nga whakaaro kino, ka ata noho te hinengaro, ka ara ake ki te taumata marino.\\n-
  He hoa kaha ki te patu i te pouri, te ahotea me te awangawanga.\\n- Ka pupuri i
  nga taumata ora i muri i ia wahanga.\\n- Whakahohe i te tukanga whakahou, na roto
  i te whakahohe i nga rauropi kore utu.\\n- Ka whakanui ake i te nekehanga hinengaro
  o te tinana katoa.\\n- Ka whakahohehia te 7 chakras, he mea tino awhina ki te whakawhanake
  me te whakarei ake i te kaha o roto o te tinana.\\nSivananda Yoga Ashram\\nKo te
  ashram te waahi e whakahaerehia ana nga huihuinga yoga, he takenga mai i roto i
  te karakia Hindu, a kua noho hei turanga mo te kawe i nga mahi a Yoga Sivananda
  mo nga tau maha; He waahi whakaaroaro me te whakangawari, kei reira nga kaiako (e
  noho ana i etahi wa) e whakahaere ana i nga mahi wairua katoa.\\nKo enei waahi ka
  whai waahi ki te tuku i nga kaupapa ako me nga whakaakoranga mahi mo te yoga mo
  te tangata, engari mo nga tangata katoa; i etahi, ka whakawhiwhia nga awheawhe me
  nga akoranga e pa ana ki te sivananda yoga.\\nKo etahi o Ashram kei te pupuri i
  nga ari\u0101 tuku iho e pa ana ki a raatau mahi, he rite tonu ki nga whare karakia
  o nga wa o mua, i etahi whenua tuku iho e mahia ana tenei rereketanga o te yoga,
  ka whakamahia hei waahi, whare noho, kura tae atu ki nga pokap\u016b hohipera iti.\\nKo
  etahi atu e tuwhera ana ki nga tangata katoa, ahakoa he aha te whakapono me te iwi.
  Mo nga manuhiri e kaha ana ki te utu mo nga whakapono whakapono, ko te hiahia anake
  ko te whakaute mo nga whakaurunga me nga mea kei roto i nga waahi.\\nKo nga Ashrams
  kei te pupurihia e te takoha a nga mema o nga huihuinga me nga tangata e haere mai
  ana ki te tono i tetahi ratonga, i etahi taone ka awhina ratou i nga tangata he
  raruraru hauora; Ehara enei i nga waahi karakia, e mohiotia ana he waahi rongoa
  wairua.\\nYoga Sivananda i Argentina\\nNa te haerenga a Swami Vishnudevananda ki
  Amerika ki te Tonga i nga tau 90, i timata nga mahere ki te kawe mai i a Sivananda
  yoga ki te nuinga o nga whenua o te rohe. Ko Argentina tetahi o nga tangata tuatahi
  ki te whakauru i te Ashar ki roto Buenos Aires, mai i tera wa ka hangaia etahi atu
  kura yoga, engari ka roa ka ngaro.\\nI tenei wa e rua nga kura yoga Sivananda puta
  noa i te motu, ko te tuatahi me te mea matua ko \\\"Sivananda International Yoga
  Center\\\" kei roto i te taone nui, i waenga i nga huarahi o S\u00e1nchez me Berm\u00fadez,
  2372, i Barrio Norte.\\nHe wharangi Tukutuku ta ratou, he imeera, ka taea e koe
  te hono atu ki a raatau, kei a raatau ano nga hononga hapori e taea ai e te hunga
  kaing\u0101kau ki te whai ngawari ki nga mahi a tenei Whare nui.\\nKo te peka o
  te Pokap\u016b kei Neuqu\u00e9n, Te Rioja Ko te nama 425-8300 Argentina, he tino
  pai hoki a Ashar, ka tae mai nga tangata ki te whakawhanake i a raatau mahi; Ka
  taea te whakap\u0101 atu ma to imeera ka kitea i runga i te Ipurangi, ma nga momo
  whatunga hapori rereke ranei.\\nNeke atu i te 20 tau enei kaupapa e haere ana, kua
  mau tonu na te hiahia o te tini o nga tangata ki te kawe i enei mahi, neke atu i
  te 50.000 nga kaiuru kua rehita kua tohatohahia ki nga momo pokapu.\\nHe hononga
  te Whare ki \\\"The International Sivananda Yoga Vedanta Centers\\\", kei Kanata;
  Waihoki, ko te tari matua i Buenos Aires te miihini matua mo te whanaketanga o Sivananda
  yoga i etahi atu whenua o Amerika Latina, penei i Brazil, Colombia, Chile me Uruguay.\\nSivananda
  Yoga i Inia\\nKo te Yoga i roto i tetahi o ona ahuatanga he pakiaka i Inia, i whanau
  ai tenei ako, i whakawhanakehia, i whakawh\u0101nuihia, i tenei ra e mahihia ana
  e te neke atu i te 200 miriona nga tangata o te ao, kaore tenei momo rereke i te
  tino rongonui i taua whenua, ahakoa ko te nuinga. rongonui i te ao.\\nKo tana kaihanga
  i tino rapu ki tenei waa, ki te kawe mai i a Sivananda Yoga ki te ao katoa, engari
  i Inia he nui atu i te 250 Ashar e awhina ana i te maha o nga akonga pono o tenei
  ako, puta noa i te motu ka kitea e koe nga kura yoga, e mahi ana i tenei momo.\\nMai
  i te tau 1959, i te wa i ako te kaihanga a Swami Vishnudevananda i nga maataapono
  a Swami Sivananda, ka timata ia ki te whakatu i nga turanga i muri i tana mahi mo
  te neke atu i te 10 tau, ka whakatau ka kawea ki te Hauauru katoa hei awhina i nga
  tangata o aua whenua. (Tirohia te tuhinga Yin yoga)\\nMe pehea te whakahaere i tetahi
  huihuinga Sivananda Yoga?\\nKo te mea nui ki te whakahaere i tetahi huihuinga yoga
  ko te tuatahi ko te whakatau ka uru koe ki tetahi ao rereke, ka taea te whakarereke,
  te whakakotahi ranei nga tauira wairua me te whakapono i roto i o tatou hinengaro,
  me tino marama kei te rapu nga rongoa. ki te whakawh\u0101nui ake i to maatau mohiotanga
  mo o tatou hinengaro.\\nKo nga waahi ka uru ki nga meneti o te whakatapu, mo tetahi
  wa, ka whakawhirinaki ki te manawanui, ka taea e ia kaiuru te noho hei tohunga,
  hei tauira riterite ranei ki tenei mahi. Na i roto i te huihuinga Sivananda Yoga,
  whakauruhia nga mahinga e whai ake nei i nga wa katoa ka tae koe ki te Ashnar.\\nKo
  nga tuunga taketake 12 e tika ana kia mahia i runga i te tino ota kei raro iho nei,
  me rapu wawe mo tona mutunga, te whakang\u0101 me te manawa me horopeta kia kore
  ai e mutu te huihuinga i roto i te ngenge.\\n- timata, whakangawari tuatahi\\n-
  Huinga mai i te 8 ki te 10, me nga Mihi Ra\\n- 5 meneti te whakataa\\n- Te whakamahana
  ko te hiki ake i nga waewae\\n- 5 meneti te whakataa\\n- Whakaarahia nga waewae
  e rua\\n- 5 meneti whakang\u0101\\n- Turanga Mahunga Tuatahi (Sirshasana)\\n- 5
  meneti te whakataa\\n- Ko te tuunga tuarua o te toenga i runga i nga pakihiwi (Sarvangasana)\\n-
  Turanga Tuatoru (Halasana)\\n- 5 meneti te whakataa\\n- Tuatoru Ika Tuatoru (Matsyasana)\\n-
  5 meneti te whakataa\\n- Turanga tuarima, Piko Whakamua (Paschimotthanasana)\\n-
  3 meneti te whakataa\\n- Tuatoru Cobra pose (Bhujangasana)\\n- 3 meneti whakang\u0101\\n-
  Turanga mawhitiwhiti tuawhitu (Salabhasana)\\n- 3 meneti te whakataa\\n- 8th Kopere
  (Dhanurasana)\\n- 3 meneti te whakataa\\n- 9th Crow Pose (Kakasana)\\n- Te whakang\u0101
  me te t\u016b o te Embryo\\n- Turanga Piko Whakamua (Mayurasana)\\n- 3 meneti te
  whakataa\\n- 10am t\u016b (Padahastasana)\\n- 3 meneti whakang\u0101\\n- Turanga
  Tapatoru 11 (Trikonasana)\\n- 12 ra Te whakang\u0101 whakamutunga (Savasana).\\nKarekau
  he wa kua whakaritea mo tenei mahi, engari ka taea te roa i waenga i te 70 me te
  90 meneti, he nui te wa mo te tangata ki te whakaoti i te rongoa me te kore e puta
  he raruraru hinengaro, tinana ranei. Ka mutu te huihuinga me te manawa hohonu o
