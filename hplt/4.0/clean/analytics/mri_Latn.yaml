sample: '["\"Te ture potae pahikara o Dallas - te whakautu i nga paatai\\nHe mea ture
  te eke pahikara kaore he potae i Dallas?\\nPotaeTure\\nHe ture te whakahaere mo
  nga taangata katoa ahakoa he reanga,pahikara kahore hemau ana i tepotaeki te kore
  e tukuna e te ture taone nui.\\n(Waiata kita hiko) (Motopaika motopaika) - I enei
  ra he maha nga taangata i konei i Donut i eke o ratou motupaika ki te tari. (Tere
  te motopaika) (waiata puoro) Me pehea taku mahi i tenei? Ana, haere mai ki ahau
  i te wa e mohio ana ahau me pehea te hono ngatahi ai ki te whakaaturanga wira e
  rua. Hopukia o pukamahi ka penapenahia, na te mea i te mutunga o tenei waahanga
  ka whiwhi o maatau raihana motopaika.\\nI hiahia ahau ki tetahi motupaika mai i
  taku tamarikitanga. Ana mena he taiohi koe i te mutunga o nga tau 90 ranei i te
  timatanga o te 2000 kaore i te tae ki te motocross, kaore pea he pini i a koe. (Joy
  Music) Ko Travis Pastrana i peke i tana pahikara ki San Francisco Bay.\\nNa James
  Stewart i hanga te Bubba Scrub. E te tangata, he pai enei taangata. Ko nga motopaika
  tetahi taha rereke o te taputapu, a, he hapori kua hiahia ahau ki te uru atu mo
  etahi wa.\\nKo nga mea tuatahi, i mua o ta maatau korero mo te haere ki te kaihokohoko,
  rapu tonu i a Craigslist ki te hoko i to pahikara tuatahi ka tiro mena kei te tino
  hiahia koe i tetahi pahikara. He whakawaiihara nga motopaika. Ko te ahua o te herekore
  me te utu iti mo te tere tere, ko te whakaaro kia kaua rawa e rapu waahi waahi.\\nHe
  pai te tangi, ehara? Ana, ka taea e enei katoa te haere wawe atu mena ka eke koe
  ki te kaikoi ka kitea ehara i a koe. Na ki te whakatau koe ki te tiki me te whiwhi
  raihana motupaika, ko te mahi hei whai ake ko te whakangungu motupaika. (puoro koa)
  I mahi taatau takitahi mai i te Akomanga: M1 i konei i LA iti atu te utu i te akoranga
  a-roopu ko te kowhiringa iti ake.\\nI tenei ra ka ako taatau me pehea te whakahaere
  i te pahikara, ka ako taatau peeke i te pahikara ka haere ma te whakamatautau whakahi.
