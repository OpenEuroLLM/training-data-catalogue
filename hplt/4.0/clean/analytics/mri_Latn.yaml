  i nga tohutohu a to taakuta me te tiaki i to hauora kanohi.\\nKa taea e koe te painga
  mai i nga painga ma te whakapiri mai ki a maatau.\\n\u2022 100% Taurangi utu pai\\n\u2022
  Kare koe e tutaki ki nga utu huna.\\n\u2022 Te whakawhiti kore utu ki te taunga
