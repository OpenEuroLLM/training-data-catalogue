  me te rite ki te mahere pai o te ao. Kaore tenei ahua e poke i te tangata. Kei roto
  i te taha kaore e tino kitea ana o te ao. Ko te raina wehenga e rere ana i roto
  i nga karaehe tinana e wha o te ahi, te hau, te wai, te whenua, na ko nga waahanga
  o nga roera e wha kei roto i tenei waahanga tuatahi.\\nKo te momo tuatahi, kaore
  i te poke, me te maori, kaore e rapua, kaore ano hoki i te mohio ki te taangata.
  Ko tenei momo tohu ko nga waahanga motuhake o te tangata \u2014 ahi, hau, wai, engari
  na te mea i ahua ai ia, kua tipu he tangata whakaaro. Ko tenei kaupapa tuatahi e
  wha o nga akomanga e whakatutukihia ana te ture; He pononga ratou na te ture. I
  etahi wa e kiia ana he anahera, he minita ranei na te Atua. E kitea ana he mohio
  ke atu i nga taangata katoa. He ahua nui to ratou, a ka taea, ka taea, korero ki
  te tangata e pa ana ki nga ture me te ao o te ao me ona hurihanga, he tohu ano tera
  i tua atu i ana mahi whakamiharo. Heoi kaore enei mea parakore i te ngakau. Ko to
  ratau whakaaro, to ratau maamaa - koinei te mea ngaro-ehara i a raatau. Ko te Matauranga
  o te Ao. Ka urupare ratau ki reira, na te mea kei reira, na te mea kaore i roto
  i a ratau te raru me te motuhake o te hinengaro takitahi. Ehara enei i nga anahera
  whakakeke; o ratou te mau melahi maitai o te mau haapaoraa e te mau peu tumu. Ka
  riro ratou hei taangata i etahi wa; katahi ka mutu ratou ko nga anahera pai. Ko
  enei, ko te momo tuatahi, ko nga mea o te taha kaore e tino kitea.\\nE toru nga
  roopu o enei wehenga, kei roto katoa i te waahanga o te whenua.\\nKo te wehenga
  tuatahi, ko nga mea kaore i tino kitea, ka kiia ko nga waahanga o runga; ko nga
  roopu e toru o te wehenga tuarua, i te waahanga kua kitea o te ao, ka kiia ko nga
  waahanga o raro. Ko nga mea iti o raro e kawe ana i nga ture whaitake me nga kawanatanga
