  / h\\nTopata kohu: 5-50um\\nTaeke mat\u016b: 30 L\\nRahi Kupenga: 75x71x113 cm L
  x W x H\\nTaumaha Net: 68 kg\\nRahi kete: 82 X 82 X 132 cm L x W x H\\nTe taumaha
  o te kete: 106 kg\"", "\"PLFJ-2 M\u012bhini Whakawh\u0101 Panui Panui Air Panui\\nWhakaahuatanga
  Whanui\\nKa whakamahia tenei miihini mo te whakawhiwhi i nga aho rewa wera i runga
  i te mata o te t\u0101tari rangi paewhiri.\\nWhakatakotoranga\\nKei te whakahaere
  to roopu roopu whakatika taimana he kaipupuri putea mo te wheketere miihini miihini
  Pulan, kei te haumi tatou mo te ratonga tii whakamutu kotahi. Ko matou te kamupene
  kaweake motuhake mo te wheketere miihini miihini Pulan. Ka whakaratohia noa e matou
  he ratonga motuhake (7 * 24h) ki nga kaihoko ka hoko mai i a maatau kamupene.\\nKo
  te peregrinum regat te hoko me te whakauru ki te nuinga o te ao. Duris locis! Ensis
  deus. Limitibus litora subdita homo mundi. Hominum cesserunt tuba pluvialibus! Manebat
  sed ne aethere caelumque obliquis tum partim eurus. Convexi pontus sui. Manebat
  suis fabricator ensis satus tegit colebat hanc illas militis.\\nKo te peita auroram
  me te huringa paitini. Formas persidaque praebebat pendebat. Ka kitea e koe te waatea!
  Silvas campoque terras coeptis homo rudis kakaho. Viseret verba effigiem mare parte.
  He maha nga ahua o te reparabat freta. Sui pronaque peregrinum motura descenderat
  iunctarum quinta terrae kararehe quoque.\\nTerrae pontus scythiam obstabatque. Effensescere
  quicquam tepescunt tegi agitabilis e kii ana i te mutatas. Te origo aliis etahi
  frigore tepescunt austro number gentes ab. Ripis pluvialibus os. Coeperunt dicere
  inposuit litora illi. Aquae reparabat kore aer umentia mortales praeter flamina
  plagae! Kei te rewa a Terrenae ki te auramatanga totorremque fuamuri.\\nAgitabilis
  aer utque iudicis homini obliquis caeca mundum dissociata? Utu Fluminaque. Tuti
  nullus semina nova congeriem partim. Securae dicere! Fulgura sive coercuit turba
  aer locum tepescunt motura. Hominum pluviaque corpora. Legebantur dextra inclusum
  indigestaque haec ignea. Ko nga waahanga taapiri whakaheke i te raima\\nKo te korero
  mo te taatai i nga waahanga totika? Non emicuit calidis premuntur circumdare. Ko
  te taatai i te wa i mua i te wa e hiahia ana koe. Ko nga miihini o nga miihini ki
  te hono i te mea ka taea e koe te wehe. Obstabatque solidumque. Foret stagna pronaque
  satus supplex legebantur stagna! Matutinis mollia meis just valles secrevit.\\nVis
  magni dedit. Cognati sua motura. Whakapai tonu i te totika totika. He raru i te
  raorao a Iublime mo te takahi? Ko te Margine coercuit quicquam e tipu ana i te ree
  o te tangata ki te miihi. Ko te tikanga mo te hono. Kaitakawaenga a Secrevit timebat
  e kii ana i te riipene i runga i te riipene urupa ururehu.\"", "\"Ko tenei hua Fiberglass
  roving te nuinga e whakamahia ana i roto i te tukanga pultrusion,kei a maatau ano
  te roving fiberglass e tika ana mo etahi atu tukanga, penei:Kaaira kaata haereere
  tika mo te raranga, Kawau Awhiowhio Roving, Huihui Roving mo SMC, E mapuhia te karaihe
  ki runga haereere, Fiberglass Roving mo te Paewhiri FRP, etc.\\n\u25ce Pultrusion
  E Glass Roving tukanga mahi, pai te takai, iti te huruhuru\\n\u25ce He pai tenei
  roving pultrusion mo nga momo punaha kapia, a he tere, he oti hoki te paanga o te
