sample: '["\"5 Kristu hanatutusula hanga tuwahilile ni utuswilo wacho. Kashika, manenu
  nguu, kanda nulinjisa cheka nawa ku kanga ya undungo.\\n2 Talenu! Yami Paulu, ngunambe
  kuli yenu ngwami, nyi manupwisa ngalami, yize Kristu alingile kuyichi kanuyukisa.
  3 Ngunashindakenya cheka nawa ngwami, mutu mweswe yoze malipwisa ngalami, chamutamba
  kumanununa Shimbi jeswe. 4 Yenu waze nwakufupa kupwa akwa-ululi kupalikila mu shimbi,
  hinwalihandununa ni Kristu, hinwalichiza ku chawana chenyi cha keke. 5 Mba hakutwala
  kuli yetu, kupalikila mu spiritu, tunashimbwila ni mbunge yeswe ululi uze wakwiza
  mumu lia ufulielo. 6 Mumu, kuli tumbaji a Kristu Yesu, chipwe ungalami, chipwe ulima,
  kuyishi ni ulemu niumwe. Alioze, chuma chilemu chili ufulielo uze wakwiza mumu lia
  zango.\\n7 Yenu nwapwile ni kuzomboka kanawa. Mba iya wanukwikile kununga ni kwononokena
  umwenemwene? 8 Malongeso a waze anukwikile kakatukile kuli yoze unanutambika. 9
  Futunwiso yikepe, yakufutunwisa mwaha weswe. 10 Ngunafuliela ngwami, yenu waze nunalinungu
  ni Mwene, kunuchi kupwa ni manyonga eka. Alioze, yoze wakunupinjisa, 11 Kashika
  mandumbu, hakutwala kuli yami, nyi te ngunachinungu ni kwambujola hakutwala ku ungalami,
  kachi kanguhungumionene. Chipwe malongeso jami hakutwala ku kufwa cha Yesu ha mutondo*
  wa lamba, kachi kalemekene nawa atu. 12 Ngunazange hanga atu waze ananulweze ngwo,
  katamba kunupwisa ngalami, alipwise* ene kuhiana.\\n13 Mandumbu, yenu anutambikile
  ku utuswilo. Kashika, kanda numona utuswilo wacho ngwe jila ya kulingilamo usolo
  wa ku musunya. Alioze, mumu lia zango, kalakalenu ngwe ndungo umwe kuli mukwo. 14
  Mumu Shimbi jeswe jinamanunuka mu Shimbi yimuwika, ngwo: \u201cZanga mwenyembo we
  ngwe chize wakulizanga yena mwene.\u201d 15 Alioze, nyi yenu munununga ni kulilemeka
  ku mbunge, ni kulimika umwe ni mukwo, kanyamenu. Mumu nyi ka, munulinongesa yenu
  ene.\\n16 Kashika, ngunambe ngwami: Nungenu ni kwenda mu spiritu, mba kunuchi kumanununa
  usolo wa musunya. 17 Mumu musunya ni usolo wawo kuwakulimika ni spiritu, ni spiritu
  neyo yakulimika ni musunya. Yino yuma yiali kuyakulimika chimwe ni chikwo. Kashika
  yenu kunushi kulinga yuma yize nwakuzanga kulinga. 18 Chikwo nawa, nyi spiritu muyinusongwela,
  kunushi mushi lia shimbi.\\n19 Yitanga ya musunya yakusoloka zwalala. Yitanga yacho
  yili: Utanji,* luchisa, yitanga ya sonyi, 20 kukombelela mahamba, kupanda,* kole,
  vunda, ukwa, ufwatulo, kulitachika, kulihandununa, kukaula malongeso ja atu, 21
  chipululu, kuzengewa, yiwanyino ya chimbangwinya, ni yuma yikwo ngwe yino. Ngunanutoweza
  hakutwala ku yuma yino ngwe chize naliangile kunutoweza ngwami, waze akulinga yuma
  yino, kechi kahinga Wanangana wa Zambi.\\n22 Alioze muhuko wa spiritu uli uno: Zango,
  uwahililo, sambukila, kulihumikiza,* utu, upeme, ufulielo, 23 kushimbika ni kusuula.
  Kukushi shimbi niyimwe yize yakulimika ni yitanga yacho. 24 Chikwo nawa, tumbaji
  twa Kristu Yesu, hanahachila ha mutondo mijimba yo ya shili ni usolo wo upi.\\n25
  Nyi mututwama kulita ni spiritu, tunungenu nawa ni kwenda kulita ni spiritu. 26
  Kanda tupwa akwa-kuzo, kanda tulitesa umwe ni mukwo, chipwe kulivwila chipululu
  umwe ni mukwo.\"", "\"\u201cMweswe mazanga kuheha mapwa chiswale; yoze mazanga vinyu
  ni maji kechi kupwa pichi.\u201d\\nYishima 21:17\\n\u201cMukwa kutambula mukuli
  mapwa ndungo ya mwenya mukuli.\u201d\\nYishima 22:7\\n\u201cIya hakachi kenu, nyi
  kanazange kutunga kaposhi, chitangu kechi kutwama hanga alule ndando, amone nyi
  kali ni mbongo jinakumbana ja kumuhwisa, nyi ka? Nyi ka, iye masa fundamentu, alioze
  kechi kuhasa kumuhwisa, mba atu eswe waze mapalika, ha kuchimona maputuka kumuseha,
  ni kwamba ngwo: \u2018Wolo-o!\\nLunga yono kanakaputuka kutunga, alioze kahashile
  kuhwisa.\u2019\u201d\\n\u201cMuze hakuta, iye yamba kuli tumbaji twenyi ngwenyi:
  \u2018Kungenu yihanda yize yasalaho hanga tuhone kukisa nichimwe.\u2019\u201d\"",
  "\"Tunyongenu ngwe tuli mu mbonge ya Yeriku. Mbonge yacho te yatwama mu chifuchi
  cha Kanana, atu jamo te keshi kufuliela Yehova. Pwo yoze te akuvuluka ngwo Rahape
  te mwe atwama.\\nMuze te uchili kanuke, iye kevwile sango ja chize Mose atetele
  Kalunga-Lwiji-Muchila ni kusongwela A-Izalele hanga atuhuke mu Engitu. Iye kevwile
  nawa chize Yehova akwashile A-Izalele hanga akumbe jita kuli akwa kole jo. Haliapwila
  iye hevwa ngwo A-Izalele hasa chilombo cho hakamwihi ni Yeriku!\\nRahape kaswekele
  ngendeshi mumu iye yafuliela Yehova\\nHa umwe ufuku, A-Izalele aali yaya ni kwendesa
  mbonge ya Yeriku. Ayo yaheta ndo ku zuwo lia Rahape. Iye yaatambula kanawa, nawa
  ayo yatwama ku zuwo lienyi. Ha ufuku, mwanangana wa Yeriku yanyingika ngwo mu mbonge
  muli amwe ngendeshi, nawa ngwo ayo kaya ku zuwo lia Rahape. Kashika mwanangana yatumako
  amwe malunga hanga aakwate. Rahape yasweka ngendeshi jacho aali ha fulumba lia zuwo
  lienyi nawa yamba kuli malunga waze mwanangana atumine ngwenyi: \u2018Ngendeshi
  te kuno ali, alioze atuhukanga kulu mu mbonge. Nyi nwaakaula haliapwila, munuhasa
  kwaakwata!\u2019 Yena unanyingika mumu liaka Rahape anakasweka ngendeshi?\\nMuze
  ngendeshi te kanda achikatuka ku zuwo lia Rahape, ayo yamulakenya ngwo iye ni asoko
  jenyi makaalamwina muze Yeriku mayinongesa. Yena unanyingika yize ayo ambile kuli
  Rahape hanga alinge?\\nHa kupalika cha amwe matangwa, A-Izalele yajinga mbonge ya
  Yeriku, ni kuhola kulu. Ayo yayijinga ha matangwa asambano, kamuwika ha tangwa.
  Alioze ha tangwa liamuchishimbiali, ayo yajinga mbonge ha yisuho shimbiali. Mba
  hi ayo eswe yakololoka chikolo. Hohene, Yehova yapuzula yipanga ya mbonge ya Yeriku.
  Alioze zuwo lili ni lwoji muchila haze lia kapenda liso kupuzuka! Yena muhasa kumona
  zuwo liacho ha chizulie?\\nYiKa yena muhasa kulilongesa hali Rahape?\u2014 Rahape
  yafuliela Yehova ha mukunda wa kunyingika yuma yeswe ya ukomokeso yize Yehova alingile.
  Ni unalilongesa yuma yinji yaukomokeso hakutwala kuli Yehova. Ni yena unafuliela
  Yehova ngwe chize Rahape alingile?\\nTANGA MU MBIMBILIYA YE\\nYoshua 2:1-24; 6:1-5,
  14, 15, 20-25\\nA-Hepreu 11:31\"", "\"Kuli jila jinji ha JW Library jakufupilamo
  yize unazange kutanga. Jila jacho jili ha kasha yize muyisoloka helu muze mutanga
  kapitulu hanji mutwe wa pande.\\nMuhasa kupola mbutau aji jili helu hanga uwane
  jila jimwe jize jili ha kasha yacho.\\nFollow these instructions to customize your
  reading experience:\\nAlumuna Limi\\nMuhasa kwalumuna Iimi ha kapitulu hanji mutwe
  wa pande uze unatange.\\nPola ha mbutau malimi umone malimi eswe ali ni sango jize
  unatange. Malimi wa kutanga yisuho yinji kali helu lia akwo. Muhasa nawa kuwana
  limi nyi musoneka limi liacho.\\nMalimi waze kanda uchichiza kama, kali ni chilayi
  cha lelwa. Pola ha limi hanga uchize mukanda. Muze mukanda wacho hiwanjila ha makina
  ye, lelwa mulijimuka. Pola cheka ha limi mba utange.\\nAlumuna Sona\\nMuhasa kwalumuna
  kutohwa cha sona kulita ni chize unazange.\\nPola mbutau ya kutohwesa nayo sona
  Text Settings, hi swenyesa mufunda hanga ukehese hanji utohwese sona. Au we utohwe
  akusa mu mikanda yeswe yili mu katalilo yono.\\nAlumuna Yizulie Hanji Sona\\nMikanda
  yimwe muhasa kuyitanga ngwe yizulie hanji sona. Pola mbutau yalita hanga usakule
  mutapu uze unazange.\\nMutapu wa Yizulie: Mutapu wa yizulie wakusolola mafwo ngwe
  chize ali ha mukanda. Amwe kakuzanga mutapu awu ha mikanda yili ngwe mukanda wa
  miaso, hanga amone usongwelo wa miaso.\\nMutapu wa Sona: Mutapu wa sona wakusolola
  yisoneko ya Mbimbiliya yize mutu mahasa kwazulula ni kutohwesa sona.\\nAzulwila
  mu . . .\\nAzulwila mu . . . muyikukwasa kwazulula mikanda ha JW Library mu aplikativa
  jeka.\\nPola ha Azulwila mu . . . hanga umone yikuma yikwo yiliko. Chakutalilaho,
  muhasa pola mbutau Azulula ha Online Library hanga wazulule lifwo unatange mu Watchtower
  ONLINE LIBRARY.\\nAlumuna Mwakufupila Yisoneko\\nMuze mu pola chisoneko cha Mbimbiliya
