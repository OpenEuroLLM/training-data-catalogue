  18 Mumu kutushi kulihulikila ha yuma yize yakumoneka, alioze ha yuma yize kuyishi
  kumoneka. Mumu yuma yize yakumoneka yili ya mashimbu akehe wika, alioze yize kuyishi
  kumoneka yili ya mutolo.\"", "\"Nyingika chize kukunguluka chetu chapwa. Wana chihela
  cha kulikungulwila chize chili hakamwihi ni kuze watwama.\\nYika Yakulingiwa ha
  kukunguluka chetu?\\nYela ja Yehova kakulikungulula kaali ha poso hanga awayile
  Zambi. (A-Hepreu 10:24, 25) Ha kukunguluka chacho chize mutu mweswawo mahasa kupwaho,
  twakulilongesa yize Mbimbiliya yakwamba ni chize mutuhasa kukaula malongeso jamo
  ku mwono wetu.\\nKanji-kanji ha kukunguluka chacho, waze aliho no mahasa kukumbulula,
  ngwe chizechene chakulingiwa mu yimwe kalasa. Kukunguluka chakuputuka ni mwaso ni
  kulemba, ni ha kuhwa che chakulingiwa.\\nKuwafupiwile kupwa Chela cha Yehova mba
  upwe ha kukunguluka chetu. Tunanusanyika nulieswe hanga nupwe ha kukunguluka chetu.
  Kukunguluka chetu chapwa chawana, chikwo nawa keshi kwitaho mbongo.\"", "\"Tanga
  Uputukilo 25:29-34 hanga umone nyi Esau ni Yakomba kakwachile yiyulo ya mana.\\nWana
  sango jinji ha kuhengola lusango mweswe. Yika yaliangile kulingiwa kuli ayo? (Uputu.
  25:20-28) Yika yalingiwile hanyima?\u2014Uputu. 27:1-46.\\nHengwola tuyikuma tuli
  ha lusango wacho. Ha mashimbu jacho, ulite uka ni yiteli yize apwile nayo mwana
