  nembojerovi\u00e1vo\\nV\\nAhupi che po ha amomaitei \u00d1ande Ru Guas\u00fape\\nOme\u2019\u00eare
  ch\u00e9ve t\u00e1va por\u00e2ite che renda\u011duami\\nApe che avy\u2019a ha ahecharamo
  ko che rekoha\\nAk\u00f3inte ojaj\u00e1iva ko yv\u00e1ga gu\u00fdpe che t\u00e1va
  por\u00e2\\nKapiata, t\u00e1va ymaiteguare ha ko\u2019\u00e1\u011dagu\u00e1va\\nNd\u00e9ve
  rohayh\u00fagui\u2026 nd\u00e9ve a\u00f1ak\u00e2ity che t\u00e1va por\u00e2\\nNo
  hay comentarios:\\nPublicar un comentario en la entrada\"", "\"domingo, 6 de junio
  de 2010\\nREUNI\u00d3N MENSUAL EN EL ATENEO PARA CELEBRAR LA VICTORIA\\nREUNI\u00d3N
  PARA CELEBRAR LA VICTORIA\\n1. AYVU\u2019APOKUAA MBO\u2019ESYRY (CURSO DE TERMINOLOG\u00cdA)\\n2.
  ATENEO ATY JEPIVEGUA (REUNI\u00d3N MENSUAL DEL ATENEO)\\nLeer original (hacer clic)
  en: http://groups.google.com.py/group/guarani-nee/web/reunin-mensual-del-ateneo-para-festejar-la-victoria\\nEl
  domingo 6 de junio de 2010, de 7 a 14 horas, el ATENEO DE LENGUA Y CULTURA GUARANI
  llev\u00f3 a cabo en su Sede Central \u201cGuarani R\u00f3ga\u201d, ubicada en la
  Ciudad de Fernando de la Mora; otra clase del CURSO DE TERMINOLOG\u00cdA GUARANI-CASTELLANO,
  del cual participan numerosos directores y docentes del ATENEO. Heta S\u00e2mbyhyh\u00e1ra
  ha Mbo\u2019eh\u00e1ra ATENEO-ygua o\u00f1ehekombo\u2019e ko mbo\u2019esyry rupive
  oikuaapor\u00e2v\u00e9vo \u00f1e\u2019\u00ea ha \u00f1e\u2019\u00eandy \u00f1ane
  Ava\u00f1e\u2019\u00eamegua (\u00f1e\u2019\u00ea re\u00f1\u00f3i, rembiasa, \u00f1emohenda,
  \u00f1e\u2019\u00ea\u2019asa ha he\u2019is\u00e9va).\\nPosteriormente, ya en la
  REUNI\u00d3N MENSUAL, los Directores y docentes del ATENEO DE LENGUA Y CULTURA GUARANI
  hicieron una evaluaci\u00f3n del reciente CONGRESO DE EDUCACI\u00d3N BILING\u00dcE
  convocado por el Ministerio de Educaci\u00f3n y la Comisi\u00f3n Nacional de Bilinguismo,
  los d\u00edas 3 y 4 de junio de 2010. Todos hicieron referencia a la exitosa gesti\u00f3n
  del grupo que llev\u00f3 a obtener las reivindicaciones propuestas. Opavavete omomba\u2019eguasu
  umi mba\u2019e ojehupyt\u00fdva \u00f1ane Ava\u00f1e\u2019\u00eame \u011duar\u00e2.
  Heta ary MEC omboykes\u00e9kuri Guarani \u00f1e\u2019\u00eame ha hekovia ha h\u00e9rape
  ombo\u2019e jopara ha ohaivaipa umi arandukaku\u00e9ra. P\u00e9ina ko\u2019\u00e1\u011da,
  ko amandaje rupive, oje\u2019e MEC-pe tekotev\u00eaha ombo\u2019e hekopete \u00f1ane
  Ava\u00f1e\u2019\u00ea ha avei tekotev\u00eaha omyatyr\u00f4 umi aranduka vaikue.\\nA
  modo de recordaci\u00f3n, a continuaci\u00f3n incluimos los aspectos m\u00e1s resaltantes
  que se reivindicaron para el Guarani en dicho Congreso:\\n1. MEC omombareteveva\u2019er\u00e2
  Guarani \u00f1e\u2019\u00ea tekombo\u2019\u00e9pe \u2013 El MEC deber\u00e1 fortalecer
  a la Lengua Guarani en la Educaci\u00f3n.\\n2. MEC ome\u2019\u00eava\u2019er\u00e2
  aravo joja Guarani ha Espa\u00f1a \u00f1e\u2019\u00eame opavave mbo\u2019esyry ha
  mbo\u2019er\u00e2me \u2013 El MEC otorgar\u00e1 igual carga horaria al Guarani y
  al castellano en todos los cursos (grados) y asignaturas.\\n3. MEC -o\u00ee meve
  Guarani \u00d1e\u2019\u00ea Atyha- oipuruva\u2019er\u00e2 hekopete Guarani Achegety
  oguerek\u00f3va 33 tai, o\u00f1anduk\u00e1va 33 taipu Ava\u00f1e\u2019\u00eamegua.
  El MEC -hasta la creaci\u00f3n de la Academia de Lengua Guarani- respetar\u00e1
  el sistema ortogr\u00e1fico del Guarani fundado en las 33 letras que representan
  a los 33 fonemas\\n4. MEC omboykeva\u2019er\u00e2 jehe\u2019a rei ha tekotev\u00ea\u2019\u1ef9va
  (jopara) ombo\u2019\u00e9va Guaran\u00edr\u00f4 ha hendagu\u00e9pe ombo\u2019eva\u2019er\u00e2
  hekopete Guarani \u00f1e\u2019\u00ea. El MEC excluir\u00e1 la ense\u00f1anza del
  jehe\u2019a (jopara) indiscriminado e innecesario que actualmente ense\u00f1a como
  Guarani; y en su lugar ense\u00f1ar\u00e1 correctamente la lengua Guarani.\\n5.
  MEC omyatyr\u00f4 ha ombopyahuva\u2019er\u00e2 umi aranduka ojehaivaip\u00e1va Guaran\u00edme
  \u2013 El MEC deber\u00e1 corregir (reelaborar) los textos mal elaborados y mal
  escritos en Guarani\\n6. MEC ohekombo\u2019e ha ombokatupyryva\u2019er\u00e2 hetave
  mbo\u2019eh\u00e1ra Guarani ha Espa\u00f1a \u00f1e\u2019\u00eame \u2013 El MEC promover\u00e1
  la formaci\u00f3n y capacitaci\u00f3n de m\u00e1s docentes de Guarani y castellano.\\n7.
  MEC omoingovejeyva\u2019er\u00e2 Mbo\u2019eh\u00e1ra I\u00f1e\u2019\u00eak\u00f4iva
  Aty \u2013 El MEC deber\u00e1 reactivar la Red de Educadores Bilingues.\\n8. MEC
  ombokatupyryva\u2019er\u00e2 t\u00fava ha syku\u00e9rape \u00f1ane Ava\u00f1e\u2019\u00eame
  ha upeichah\u00e1pe toikuaa por\u00e2 hiku\u00e1i mba\u2019\u00e9repa tekotev\u00ea
  o\u00f1embo\u2019e Guarani, avei ikatuha\u011du\u00e1icha ha\u2019eku\u00e9ra oipytyv\u00f4
  hekopete i\u00f1emo\u00f1ar\u00e9pe \u2013 El MEC deber\u00e1 concienciar a los
  padres y madres acerca de la importancia del Guarani en la educaci\u00f3n; de manera
  que ellos tambi\u00e9n puedan ayudar a sus hijos en el aprendizaje del Ava\u00f1e\u2019\u00ea.\\n9.
  To\u00f1emoha\u2019e\u00f1o, tojehupive S\u00e2mbyhyh\u00e1ra Guas\u00far\u00f4
  ha to\u00f1emombareteve MEC ryep\u00fdpe pe \u00d1e\u2019\u00eak\u00f4i Rekombo\u2019e
  Renda \u2013 Que se independice, se eleve a Direcci\u00f3n General y fortalezca
  al Departamento de Educaci\u00f3n Biling\u00fce, en la estructura del MEC.\\nPosteriormente,
  se present\u00f3 el XXV SEMINARIO NACIONAL SOBRE AN\u00c1LISIS DEL BILINGUISMO PARAGUAYO
  que tendr\u00e1 lugar en Villarrica, el domingo 27 de junio de 2010; y cuyo afiche
  es el siguiente:.\\nEl ATENEO DE LENGUA Y CULTURA GUARANI\\nInvita al\\nVIGESIMOQUINTO
  SEMINARIO NACIONAL SOBRE AN\u00c1LISIS DEL BILINGUISMO PARAGUAYO\\nCiudad de Villarrica\\nDOMINGO
  27 DE JUNIO 2010\\nHorario: 07:30 a 16:30 horas.\\nCosto: 25.000 (Con certificado
  por 20 horas y materiales did\u00e1cticos)\\nInformes e inscripci\u00f3n\\nATENEO
  DE LENGUA Y CULTURA GUARANI \u2013 Tel: 021-520.276; o la REGIONAL VILLARRICA DEL
  ATENEO \u2013 Tel: 0541-40.170\\nCorreo Electr\u00f3nico: ateneoguarani@tigo.com.py\\nPor
  \u00faltimo, se record\u00f3 a todos que siguen abiertas las inscripciones para
  el CURSO DE INFORM\u00c1TICA EN GUARANI, bajo la direcci\u00f3n de Fernando David
  Villalba. Este curso formar\u00e1 a los interesados en diferentes aspectos (dactilograf\u00eda,
  procesadores de textos, software para escribir en Guarani, elaboraci\u00f3n de power
  point y acceso y uso de Internet, entre otros). P\u00e9icha, ATENEO omo\u00f1epyr\u00fb
  pete\u00ee tape pyahu ha tekotev\u00eava. Taha\u2019eha\u2019\u00e9va (mbo\u2019eh\u00e1ra
