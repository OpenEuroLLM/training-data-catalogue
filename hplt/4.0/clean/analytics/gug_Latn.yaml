  japich\u00e1pe, up\u00e9va opyta ojesap\u00e9j\u00e1pe, ja ndaiyai ichupe omo\u00f1epysang\u00e1
  jagu\u00e2 ambuepe.\\n11. Oime ramo o\u00f1amotare\u0177va japich\u00e1pe up\u00e9va
  oi i\u00f1ypyt\u00fbj\u00e1pe, ja oico pyt\u00fbnguype, ja ndoicuaai mamo rupipa
  ojo jina, omo\u00f1ypyt\u00fbj\u00e1 reje jesa pe pyt\u00fb.\\n12. Che arajauca
  pe\u00eame co cuatia \u00f1e\u00ea, che ra\u0177cuera, pene angaipa o\u00f1embo\u00ed
  jague reje J\u00e9ra rupi.\\n13. Arajauca co cuatia \u00f1e\u00ea pe\u00eame pe\u00eacuera
  t\u00favape, pe\u00ea peicuaaj\u00e1 reje Upe oim\u00e9vape i\u00f1ypyrumb\u0177
  guive. Arajauca co cuatia \u00f1e\u00ea pe\u00eame, pe\u00eacuera caria\u0177 cuerape,
  pende puaca jague reje pe mbaepochy reje. Arajauca vaecue pe\u00eame cuatia \u00f1e\u00ea
  pe\u00eame, pe\u00eacuera che ra\u0177cuera, peicuaaj\u00e1 reje pe T\u00favape.\\n14.
  Arajauca vaecue pe\u00eame cuatia \u00f1e\u00ea, pe\u00eacuera tuvacuera, pe\u00ea
  peicuaaj\u00e1 reje Upe oic\u00f3vape i\u00f1ypyrumb\u0177 guive. Arajauca vaecue
  pe\u00eame cuatia \u00f1e\u00ea, pe\u00eacuera caria\u0177, pene mbaraete retej\u00e1
  reje, ja pe T\u00fbp\u00e2 \u00d1andey\u00e1ra \u00d1e\u00ea iyaj\u00e1 reje pende
  pyape, ja pe\u00eacuera pende puaca jague reje pe mbaepochy reje.\\n15. Ani pejayju
  umi ybyp\u00f3ra cuera recope, ja mbaeve ybyarigua. Oime ramo pete\u00eeva ojayj\u00fava
  ybyp\u00f3racuera reco, ndaiyai ipy\u00e1pe ojayj\u00fa jagu\u00e2icha pe T\u00favape.\\n16.
  Opambae oimeva ybyari, umi jeco va\u00edr\u00e2 \u00f1ande rete rupigua, umi jeco
