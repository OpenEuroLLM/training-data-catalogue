  hay comentarios:\\nPublicar un comentario en la entrada\"", "\"La toma de Samaklay
  por los Bolivianos, gener\u00f3 la reacci\u00f3n ciudadana. As\u00ed, el d\u00eda
  22 de octubre del a\u00f1o 1931, el Centro de Estudiantes Universitarios dirigido
  por Agust\u00edn \u00c1vila convoc\u00f3 a una marcha desde la Plaza Uruguaya. Y
  as\u00ed ocurri\u00f3, la manifestaci\u00f3n fue hasta el Palacio de Gobierno y
  al no encontrar al Presidente Jos\u00e9 P. Guggiari, recorri\u00f3 las calles y
  lleg\u00f3 hasta su domicilio, donde se pronunciaron discursos y apedrearon la casa
  de Guggiari. Finalmente, los manifestantes fueron dispersados por la polic\u00eda.
  Ho\u2019\u00e1vo Samaklay Bolivia pogu\u00fdpe, \u00f1ane ret\u00e2ygua huguy raku
  opyt\u00e1vo. Up\u00e9icha, \u00e1ra 22 jasypa ary 1931-pe, Temimbo\u2019e Mbo\u2019ehaovusugua
  Aty omyak\u00e2va Agust\u00edn \u00c1vila ojap\u00f3kuri \u00f1ehen\u00f3i pete\u00ee
  \u00f1emongu\u2019eguasur\u00e2 os\u00eatava Uruguay Okarus\u00fagui. Ha up\u00e9icha
  ojeh\u00fakuri, upe \u00f1emongu\u2019e oh\u00f3kuri Mburuvichapav\u00ea Ogavusu
  peve ha ndojuh\u00faimar\u00f4 up\u00e9pe Mburuvichapav\u00ea Jos\u00e9 P. Guggiari-pe,
  oguat\u00e1kuri tapeku\u00e9rare ha o\u011duah\u00eakuri h\u00f3ga peve, up\u00e9pe
  ojejap\u00f3kuri heta \u00f1e\u2019\u00easyry ha ojapi hiku\u00e1i it\u00e1pe Guggiari
  r\u00f3ga. Ipah\u00e1pe, tahachiku\u00e9ra omosarambipa chupeku\u00e9ra.\\nAl d\u00eda
  siguiente, 23 de octubre, los estudiantes del COLEGIO NACIONAL DE LA CAPITAL y de
  la Escuela Normal se movilizaron para exigir la defensa del Chaco y para protestar
  por la represi\u00f3n policial del d\u00eda anterior, acompa\u00f1ados de sus profesores,
  obreros, ancianos, mujeres, j\u00f3venes y ni\u00f1os. Fueron hasta los diarios,
  arrojaron piedras a la casa de los liberales y llegaron al Palacio de Gobierno.
  En un momento, los estudiantes atropellaron el cord\u00f3n policial y fueron hacia
  la escalera de acceso al despacho presidencial. Se descontrol\u00f3 la situaci\u00f3n
  y la guardia presidencial respondi\u00f3 con una r\u00e1faga de ametralladora. El
  presidente Jos\u00e9 P. Guggiari orden\u00f3 el cese del fuego. M\u00e1s tarde,
  Guggiari refugiado en la Escuela Militar, deleg\u00f3 la presidencia a Emiliano
  Gonz\u00e1lez Navero. Al frente de aquella gran movilizaci\u00f3n marcharon los
  directivos del Centro de Estudiantes del CNC: \u00c1vila, Garay, Riquelme, F\u00faster,
  Valle, G\u00f3mez y Esp\u00ednola, entre otros, enarbolando la bandera del Centro,
  que qued\u00f3 rota y manchada de sangre. \u00c1ra upeigu\u00e1pe, 23 jasypa, temimbo\u2019eku\u00e9ra
  COLEGIO NACIONAL DE LA CAPITAL ha Escuela Normal-pegua o\u00f1emongu\u2019eje\u00fdkuri
  ojerure ha\u011dua Ch\u00e1ko yvy pysyr\u00f4 ha ombotove ha\u011dua tahachi \u00f1embyepoti
  guasu oikova\u2019ekue upe \u00e1ra mboyve, hendiveku\u00e9ra oguat\u00e1kuri imbo\u2019eharaku\u00e9ra,
  mba\u2019apoh\u00e1ra, ituj\u00e1va, ku\u00f1a, mit\u00e2rusu ha mit\u00e2. Oh\u00f3kuri
  hiku\u00e1i o\u00f1e\u00f1anduk\u00e1vo momaranduhaku\u00e9ra renond\u00e9pe, ojap\u00edkuri
  it\u00e1pe chovyku\u00e9ra r\u00f3ga ha o\u011duah\u00eakuri Mburuvichapav\u00ea
  Ogavusu peve. Sapy\u2019ami rire, temimbo\u2019eku\u00e9ra ojapyhara tahachiku\u00e9ra
  jejoko ha oh\u00f3makatu hiku\u00e1i jupiha gotyo o\u00eeh\u00e1me mburuvichapav\u00ea
  koty. Upe sarambi oikoku\u00e9vo mburuvichapav\u00ea \u00f1angarekoharaku\u00e9ra
  o\u00f1epyr\u00fbkuri ombokapu o\u00f1emongu\u2019\u00e9va \u00e1ri. Mburuvichapav\u00ea
  Jos\u00e9 P. Guggiari ojokouka \u00f1embokapu. Uperiremi, Guggiari oka\u00f1yva\u2019ekue
  Guarini Mbo\u2019ehao (Escuela Militar)-pe, oheja Emiliano Gonz\u00e1lez Navero
  pogu\u00fdpe tet\u00e2 s\u00e2mbyhy. Omotenond\u00e9kuri upe \u00f1emongu\u2019e
  guasu Temimbo\u2019e Atyha CNC-pegua rendotaku\u00e9ra: \u00c1vila, Garay, Riquelme,
  F\u00faster, Valle, G\u00f3mez ha Esp\u00ednola, hetave apyt\u00e9pe, oguerah\u00e1va
  yvatete Atyha poyvi, ikuapa ha huguyp\u00e1va opyt\u00e1vo.\\nDiez estudiantes del
  Colegio Nacional de la Capital fueron asesinados aquel triste d\u00eda: Julio C\u00e9sar
  Franco, Ismael Gonz\u00e1lez, Benigno Gonz\u00e1lez, Ra\u00fal Roig Ocampo, Marcial
  M\u00e9ndez, Liberato Ru\u00edz R\u00edos, Alfredo Gonz\u00e1lez Taboas, Celestino
  Ram\u00edrez, Eugenio G\u00f3mez y Seraf\u00edn O. Vidal, y un anciano desconocido
  que vend\u00eda pororo en la plaza. Pa temimbo\u2019e Colegio Nacional de la Capital-pegua
  ojejuk\u00e1kuri upe \u00e1ra ityre\u2019\u0177et\u00e9vape: Julio C\u00e9sar Franco,
  Ismael Gonz\u00e1lez, Benigno Gonz\u00e1lez, Ra\u00fal Roig Ocampo, Marcial M\u00e9ndez,
  Liberato Ru\u00edz R\u00edos, Alfredo Gonz\u00e1lez Taboas, Celestino Ram\u00edrez,
  Eugenio G\u00f3mez ha Seraf\u00edn O. Vidal, ha pete\u00ee karai tujami ohepyme\u2019\u00eavajepi
  pororo upe okarus\u00fape.\\nEn recordaci\u00f3n a aquel luctuoso acontecimiento
  y en homenaje a los ca\u00eddos, el Centro de Estudiantes del Colegio Nacional de
  la Capital pas\u00f3 a denominarse \u201c23 de octubre\u201d, y tambi\u00e9n lleva
  ese nombre la m\u00e1xima condecoraci\u00f3n que dicho Centro otorga a los egresados
  destacados del CNC. Ogueromandu\u2019\u00e1vo upe mba\u2019e vaiete ha ohechakua\u00e1vo
  umi ojejukava\u2019eku\u00e9pe, Temimbo\u2019e Atyha Colegio Nacional de la Capital-pegua
  upe guive ojehero \u201c23 de octubre\u201d, ha avei ogueraha upe t\u00e9ra pe pyti\u2019ajegua
  tuichav\u00e9va upe Atyha ome\u2019\u00eavajepi CNC temimbo\u2019ekue poravopyr\u00e9pe.\\nOhai:
