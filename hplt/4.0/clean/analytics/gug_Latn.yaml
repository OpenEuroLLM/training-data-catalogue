  oguereko ta''\u00e3nga Frida Kahlo reheguaCommons.\"", "\"LECTURAS LUNES VIG\u00c9SIMA
  S\u00c9PTIMA SEMANA\\nLECTURA PETE\u00ceHA:\\n\u00d1ahend\u00fata Tup\u00e3 \u00d1andej\u00e1ra
  \u00d1e\u2019\u1ebd San Pablo ohai va\u2019ekue Galacia gu\u00e1pe 1, 6-12\\nChe
  peh\u1ebdngueku\u00e9ra: Che mbopy\u2019and\u00fdi pe\u00f1e momombyry pya\u2019ete
  hague Tup\u00e3 \u00d1andej\u00e1ragui, pene ren\u00f3i va\u2019ekue ohechauk\u00e1vo
  pe\u1ebdme ipy\u2019a por\u00e3 Jesucristo rupi, ha pehasa hague ambue marand\u00fape.
  A\u00f1eteh\u00e1pe, ndaha\u2019\u00e9i oim\u00e9va ambue marandu.\\nOim\u00e9nte
  niko umi pene moak\u00e3 tav\u00fdva ha omboais\u00e9va Jesucristo marandu por\u00e3.
  Ha oim\u00e9r\u00f5 ohenduk\u00e1va pe\u1ebdme marandu ndaha\u2019\u00e9iva ore
  romoas\u00e3i va\u2019ekue, toho a\u00f1a ret\u00e3me. Mar\u00e3ve ndoik\u00f3i
  che ramo, t\u00e9r\u00e3 pete\u0129 Tup\u00e3 \u00d1andej\u00e1ra remimbou ramo.
  Ha\u2019\u00e9ma hagu\u00e9icha voi pe\u1ebdme Ko\u2019\u00e1g\u00e3 ha\u2019e jevy
  pe\u1ebdme: Oim\u00e9r\u00f5 omosaramb\u00edva pende apyt\u00e9pe marandu por\u00e3
  ndaha\u2019\u00e9iva pe oguah\u1ebdma va\u2019ekue pe\u1ebdme, toho a\u00f1a ret\u00e3me.\\nChe
  ndahek\u00e1i yvyp\u00f3ra ojuhu por\u00e3 che rembiapo, Tup\u00e3 \u00d1andej\u00e1ra
  ojuhu por\u00e3nte che aipota. Che ndahek\u00e1i apyta por\u00e3 yvyp\u00f3ra ndive.
  Apyta por\u00e3se rire, ndaha\u2019\u00e9i va\u2019er\u00e3 mo\u2019\u00e3 Jesucristo
  rembigu\u00e1i. Peikua\u00e1ke k\u00f3va, che peh\u1ebdngueku\u00e9ra: pe marandu
  por\u00e3 che amoas\u00e3iva, ndaha\u2019\u00e9i yvyp\u00f3ra ojapo va\u2019ekue.
  Noguah\u1ebdi ch\u00e9ve ha ndaikua\u00e1i va\u2019ekue mba\u2019eveichagua yvyp\u00f3ragui.
  Jesucristo ite voi katu oikuaauka va\u2019ekue ch\u00e9ve.\\nTup\u00e3 \u00d1andej\u00e1ra
  \u00d1e\u2019\u1ebd.\\nSALMO \u00d1EMBOHOV\u00c1I 110, 1-2. 7-9. 10c\\nOpavave:
  Tup\u00e3 \u00d1andej\u00e1ra ndahesar\u00e1iri i\u00f1e\u2019\u1ebd marangat\u00fagui\\nChe
  py\u2019aite guive arohory Tup\u00e3 \u00d1andej\u00e1rape,\\naty guasu ha hekojoj\u00e1va
  atyh\u00e1pe.\\nTuich\u00e1ko h\u00edna umi Tup\u00e3 \u00d1andej\u00e1ra rembiapokue,\\nha
  umi oguerojepy\u2019a mongeta hese. O.\\nA\u00f1ete ha teko joja pegua meme hembiapokue,\\nhembiapoukap\u00fdre
  jajerovia kuaa.\\nA\u00f1ete ha tekojoj\u00e1pe o\u00f1embohapo,\\nha nai\u00f1ambu\u00e9i
  ch\u00e9ne araka\u2019eve. O.\\nHet\u00e3 gu\u00e1pe ha\u2019e oguenoh\u1ebd jejopy
  va\u00edgui,\\nha ome\u2019\u1ebd i\u00f1e\u2019\u1ebd opa \u00e1rape guar\u00e3.\\nTup\u00e3
  \u00d1andej\u00e1ra niko imarangatu ha jakyhyjeha.\\nTo \u00f1emomba\u2019e guasu
  Tup\u00e3me opa \u00e1ra. O.\\nALELUIA Jn 13, 34\\nAleluia.\\nAme\u2019\u1ebd pe\u1ebdme
  pete\u0129 tembiapoukapy pyahu: pejoahu ojoapyt\u00e9pe, Che pohayhu hagu\u00e9icha.\\nAleluia.\\nEVANGELIO\\nKo\u2019\u00e1g\u00e3
  \u00f1ahend\u00fata \u00d1andej\u00e1ra Jesucristo rekove ha hemimbo\u2019e San
  Lucas omombe\u2019u h\u00e1icha 10, 25-37\\nUpe ramo pete\u0129 Mois\u00e9s rembiapoukapy
  mbo\u2019eha oho o\u00f1e\u2019\u1ebd Jes\u00fas ndive, ha oha\u2019\u00e3 hagu\u00e3
  ichupe oporandu: Mbo\u2019eh\u00e1ra, mba\u2019e piko ajapo va\u2019er\u00e3 areko
  hagu\u00e3 jeikove opa\u2019\u1ef9va?\\nJes\u00fas he\u2019i ichupe: Mba\u2019\u00e9pa
  o\u0129 tembiapoukap\u00fdpe? Mba\u2019e piko pehech\u00e1va kuati\u00e1pe?\\nUpe
  Mois\u00e9s rembiapoukapy mbo\u2019eha he\u2019i: Ehayhu Tup\u00e3 nde J\u00e1rape
  ne nde py\u2019a ite guive, ne \u00e1nga rugua guive ha opa ne arandukue reheve,
  ha ehayhu nde rapich\u00e1pe rejehayhu h\u00e1icha nde. Ha Jes\u00fas katu he\u2019i:
  Ere por\u00e3, rejap\u00f3r\u00f5 up\u00e9icha, reikov\u00e9ta.\\nPe tembiapoukapy
  mbo\u2019eha katu, omo\u0129 por\u00e3s\u00e9vo imba\u2019e porandu, he\u2019i Jes\u00faspe:
  Ha m\u00e1va piko pe che rapicha?\\nAip\u00f3r\u00f5 Jes\u00fas he\u2019i ichupe:
  Pete\u0129 karia\u2019y oguata oh\u00f3vo Jerusal\u00e9n rap\u00e9guio Jeric\u00f3
  gotyo, ha pete\u0129 mondaha aty ohape joko ichupe, ha oipe\u2019a ichugui ijao
  peve. Oinup\u00e3 hiku\u00e1i ha oheja ichupe omano ha noman\u00f3ime. Peichah\u00e1gui
  rei pete\u0129 pa\u2019i ohasa upe rupi, ha ohech\u00e1vo ichupe ojere ichugui ha
  oh\u00f3nte ha ndopyt\u00e1i. Pete\u0129 lev\u00edta avei oguah\u00eb up\u00e9pe,
  ha ohecha vove, ojere ichugui ha oh\u00f3nte avei tenonder\u00e3.\\nPete\u0129 kuimba\u2019e
  Samariagua katu, oh\u00f3va h\u00edna upe tape up\u00e9vare avei, ohech\u00e1vo
  oiporiahuvereko ichupe. O\u00f1emboja hese, oipohano \u00f1andyry ha v\u00ednope
  ha ojokua ichupe umi ojekutu hague rupi. Up\u00e9i ohupi ichupe ikavaju tee \u00e1ri,
  ogueraha pete\u0129 \u00f3ga ojepytah\u00e1pe ha o\u00f1angareko hese.\\nUpe riregua
  ko\u2019\u1ebdme, upe Samariagua oguenoh\u1ebd mok\u00f5i \u00e1ra mba\u2019apokue
  repy ha ome\u2019\u1ebd upe \u00f3ga j\u00e1rape, ha he\u2019i ichupe: E\u00f1angareko
  ko karia\u2019\u00fdre. Ndohupityp\u00e1ir\u00f5 viru, che ahepyme\u2019\u1ebdta
  nd\u00e9ve up\u00e9i ajev\u00fdvo. Ha n\u00e9i, m\u00e1vapa ko\u2019\u00e3vagui,
  nd\u00e9ver\u00f5 guar\u00e3 pe karia\u2019y rapicha, ohape joko va\u2019ekue umi
  mba\u2019e vai apoha? Upe Mois\u00e9s rembiapoukapy mbo\u2019eha he\u2019i: Pe oiporiahuvereko
  va\u2019ekue ichupe.\\nJes\u00fas katu he\u2019i ichupe: N\u00e9i, tereho ha ejapo
  nde ave up\u00e9icha.\\n\u00d1andej\u00e1ra Jesucristo \u00d1e\u2019\u1ebd\"", "\"Asunci\u00f3n,
  Agencia IP.- Polis\u00eda Caminera he\u2019i kuri arapok\u00f5indy ohas\u00e1vape,
  900 tapichaku\u00e9ra o\u00f1emulta kuri ambue control-pe ojejap\u00f3va \u00f1ane
  ret\u00e3 pukuku\u00e9pe. Avei, oikuaaka hiku\u00e1i 35 tapicha oka\u2019\u00fava
  omboguata jave ikami\u00f5.\\nUp\u00e9icha avei, ojejoko kuri 127 kami\u00f5 ha
  16 m\u00f3to. Umi multa ojejap\u00f3va kuri, 95 ha\u2019e oh\u00f3va tenonde gotyo
  ndaha\u2019\u00e9ih\u00e1pe ha 8 katu ha\u2019e kami\u00f5 ndorek\u00f3iva ch\u00e1pa.\\nPatricia
  Ferreira, mba\u2019apoh\u00e1ra Polis\u00eda Caminera-gua, omombe\u2019u oipytyv\u00f5
  hiku\u00e1i avei 29 accidente oik\u00f3vape: 12 oheja da\u00f1o material a\u00f1\u00f3nte,
  17 oheja herido ha 5 tapicha oman\u00f3va.\\nMinisterio de Obras P\u00fablicas y
  Comunicaciones (MOPC) omomba\u2019eguasu tet\u00e3yguaku\u00e9rape to\u00f1e\u00f1angareko
  omboguata jave tape rehe, ani oiko accidente tr\u00e1nsito-pe.\"", "\"Ohai: David
