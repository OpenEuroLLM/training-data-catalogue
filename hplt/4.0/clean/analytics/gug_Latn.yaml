  jha ipepope che pey\u00fa INTRO: ( A C#m Bm E ) A REPETE INICIO AO FIM SOLO FINAL:
  A E A\"", "\"Frida Kahlo\\nMagdalena Carmen Frida Kahlo Calder\u00f3n (T\u00e1va
  M\u00e9hiko; 6 jasypok\u00f5i 1907-13 jasypok\u00f5i 1954),[1] ojekua\u00e1va chupe
  oparupi Frida Kahlo ramo, ha''e akue \u00f1emongolo apoh\u00e1ra M\u00e9hiko pegua
  heraku\u00e3it\u00e9va i\u00f1emoha''ang\u00e1re ojehechah\u00e1pe mba''\u00e9ichapa
  ha''e oiko ha mba''\u00e9ichapa oiko het\u00e3 rekoha.[2] Hembiapokue niko omombe''u
  hekove rembiasa ha pe ombohasa''as\u00fdva chupe. Ojapo 150 tembiapokue, tuichait\u00e9pe
  o\u00f1emoha''anga ijehegui, umi ta''ang\u00e1pe ojehechah\u00e1pe hasyite chupe
  oikove hag\u0303ua.\\nOhasa asy hekove pukuku\u00e9vo ojehu sapy''\u00e1gui mba''e
  vai chupe imit\u00e3r\u00f5 ha heta \u00e1ra aja o\u00f1eno va''er\u00e3 hup\u00e1pe
  ikang\u00fdgui, up\u00e9vare ohasa va''er\u00e3 32 pire\u00f1ekyt\u0129 rupive o\u00f1epohano
  por\u00e3ve hag\u0303ua.[3] Ha''e niko oiko hekope''\u1ef9, hekove ijojaha''\u1ef9va.[3]
  Frida ha im\u00e9na rembiapokue, \u00f1emongolo apoh\u00e1ra Diego Rivera, o\u00f1omokyre''\u1ef9
  hiku\u00e1i. Ohayhuite hiku\u00e1i M\u00e9hiko ypykue rembiapopor\u00e3 ha ogueraha
  hembiapoku\u00e9pe umi mba''e, up\u00e9icha avei omokyre''\u1ef9 hiku\u00e1i tembiapopor\u00e3
  apoh\u00e1ra ambu\u00e9va M\u00e9hiko ret\u00e3me.\\nAry 1939-pe oho Hy\u00e3sia
  ret\u00e3me ohechauka hag\u0303ua hembiapokue, karai Andr\u00e9 Breton ojerur\u00e9gui
  chupe, ha''e niko he''i Kahlo-pe ha''angaku\u00e9ra reko \u00absurrealista\u00bb,
  Kahlo katu he''i chupe ndaha''\u00e9iva up\u00e9icha hembiapoku\u00e9pe nomoha''ang\u00e1igui
  umi mba''e k\u00e9pe ojehech\u00e1va, omoha''anga katu hekove tee. Oikove aja hetaite
  tembiapopor\u00e3 apoha omomor\u00e3 chupe, techapyr\u00e3me Pablo Picasso, Vasili
  Kandinski, Andr\u00e9 Breton, Marcel Duchamp, Tina Modotti ha Concha Michel, ko''\u00fdte
  heraku\u00e3 por\u00e3ve hembiapokue ha''e omano rire, tuichait\u00e9pe 1980 aryku\u00e9ra
  pukuku\u00e9vo ha 1990 aryku\u00e9ra \u00f1epyr\u0169me.\\nMandu''apy[jehaijey |
  editar c\u00f3digo]\\n- \u00abEl Coraz\u00f3n de Frida - Magdalena Carmen Frida
  Kahlo Y Calder\u00f3n 1907-1954\u00bb. Ojehech\u00e1kuri \u00e1rape: 4 de abril
  de 2017.\\n- Barrag\u00e1n, Almudena (13 de julio de 2017). \u00abLa muerte de Frida
  Kahlo, el nacimiento de un icono pop\u00bb. El Pa\u00eds. Ojehech\u00e1kuri \u00e1rape:
