  ramo, up\u00e9va oico vaer\u00e2 jec\u00f3pe, Jae oico jagueicha jecoit\u00e9pe.\\n7.
  Che rayjup\u00e1ra cuera, nda ipyaj\u00fav\u00e1i co tembiapoucap\u0177 ja\u00e9uc\u00e1va
  pe\u00eame co cuatia \u00f1e\u00ea rupi, pe tembiapoucap\u0177 ymaguar\u00e9nte
  vo\u00ed pe\u00eacuera voi pejend\u00fa vaecue i\u00f1ypyrumb\u0177 guive. Pe tembiapoucap\u0177
  ymaguare up\u00e9a voi upe \u00f1e\u00ea pejendu voi vaecue.\\n8. Upeicha rejeve
  ja\u00e9uc\u00e1 aina cuatia \u00f1e\u00eame tembiapoucap\u0177 ambue ipyaj\u00fava
