sample: '["\"O\u00ef niko \u00f1ande apyt\u00e9pe ojup\u00edva oipytyv\u00f6 hagu\u00e4
  het\u00e4me ha katu, amo ipah\u00e1pe, o\u00f1epypytyv\u00f6 ha''e, oipytyv\u00f6
  ita''\u00fdra, itaj\u00fdra, hembireko ha isosioku\u00e9rapente.\\nJahecha jaik\u00f3vo
  mba''\u00e9ichapa Parlamento ha ambue instituciones p\u00fablicasku\u00e9rape ojepuru
  \u00f1ande pl\u00e1ta o\u00f1embohetave hagu\u00e4 empleado publicoku\u00e9ra. Um\u00edvape
  \u00f1ande japaga isu\u00e9ldo japag\u00e1gui impu\u00e9sto.\\nUmi o\u00efva yvate,
  oguerek\u00f3va poder, o\u00f1embokokuete Estado koku\u00e9re. Oipuru imba''eku\u00e9rar\u00f6
  gu\u00e1icha. Omoinge omoinges\u00e9va, ome''\u00ebuka chupeku\u00e9ra su\u00e9ldo
  kyra kyra.\\nUpe aja katu heta \u00f1ane ret\u00e4ygua okar\u00far\u00f6ntema okar\u00fava,
  imboriahuetev\u00e9va o\u00efgui oisyrykup\u00e1va umi imba''eku\u00e9ra r\u00e4ngue.\\nOjepur\u00fagui
  hendape''\u00ff pe viru Ministerio de Hacienda ombyat\u00fdva impuestoku\u00e9ragui
  ndajaguerek\u00f3i hetave hospital, no\u00f1emyatyr\u00f6i eskuelaku\u00e9ra ochororop\u00e1va
  okyvove ha ndojasfalt\u00e1i \u00f1ande rape jaju ha jaha pya''eve hagu\u00e4 opa
  rupi.\\n\u00c4 mba''e he''iseh\u00edna Paraguay imboriahuveha o\u00efgui jatevuita
  ohuguy''\u00f3va chupe, okamb\u00fava hese \u00e1ra ha pyhare.\\nAg\u00e4 jatevuku\u00e9ra
  r\u00e9ra os\u00ebmba oik\u00f3vo. Ha ojetyvyro hiku\u00e1i. Peichanteva''er\u00e4voi.
  Hi''\u00e4 ko oik\u00f3va ndopare\u00edri pe t\u00e9ra jekua\u00e1pente. Hi''\u00e4
  hasypeve o\u00f1andumi avei hiku\u00e1i ojap\u00f3r\u00f6 ojapo''\u00ffva''er\u00e4
  ndopytare\u00edriha. Jahechase ojekastigam\u00edr\u00f6 omomboriahuv\u00e9va Paraguay.\"",
  "\"FIFA Tembiesar\u00e1i Yvypav\u1ebd 2014\\nFIFA Tembiesar\u00e1i Yvypav\u1ebd
  2014 (Copa do Mundo FIFA 2014, poytuga\u00f1e''\u1ebdme) ha''e akue upe 20ha vakapipopo
  \u00f1embosar\u00e1i hetatet\u00e3rehegua kuimba''erehegua ojapova FIFA rehe, pe
  Vakapipopo Tembiesar\u00e1i Yvypav\u1ebd. Ojejapo Pindorama ret\u00e3me, \u00e1ra
  12 jasypote\u0129 guive \u00e1ra 13 jasypok\u00f5i peve ary 2014-jave, Pindorama
  ojapo mok\u00f5iha jey pete\u0129 FIFA Tembiesar\u00e1i Yvypav\u1ebd, upear\u00f5
  \u00d1embyam\u00e9rika ojapo 5ha jey pete\u0129 tembiesar\u00e1i.\\nAry 2004-jave,
  FIFA oiporavo akue yvyrusu \u00d1embyam\u00e9rika ojapo hag\u0303ua Tembiesar\u00e1i
  Yvypav\u1ebd 2014. Oimera\u1ebd tet\u00e3 oguerohory ramo jepe oikuaavo pe marandu,
  Brasil ha Kolombia he''\u00edva mante oipot\u00e1va ojapo pe Tembiesar\u00e1i, \u00e1ra
  18 jasypak\u00f5i ary 2006-jave. Ha upei, Kolombia oheja, ha opyta mante Brasil
  ojejapo hag\u0303ua. \u00c1ra 30 jasypa ary 2007-jave, FIFA he''i akue ha omo\u00f1e''\u1ebd
  ha''eteh\u00e1pe Brasil ojap\u00f3va Tembiesar\u00e1i Yvypav\u1ebd 2014. [1]\\nTet\u00e3
  Alema\u00f1a ipu''ak\u00e1va, irundyha jey, o\u00f1eha''\u00e3ta ha''eteh\u00e1pe
  FIFA Tembiesar\u00e1i Yvypav\u1ebd 2018, ojejap\u00f3va Rrusia ret\u00e3me, ipu''aka
  mok\u00f5iha ha''e Argentina.\\nKo tembiesar\u00e1ipe ojeporu pete\u0129h\u00e1me
  ta''angam\u00fdi apu''apop\u00f3gua, he''\u00edva apu''apopo oike hupytur\u00e3me,
  kombutad\u00f3ra rupive ha ta''angam\u00fdi rupive. [2]\\nTembikuaa''aty rechaukaha\\nTenda
  ojap\u00f3va jeporavo[jehaijey | editar c\u00f3digo]\\nCONMEBOL ha UEFA ha''e um\u00edva
  opu''ak\u00e1va mante FIFA hechaukaha. \u00d1embyam\u00e9rika opu''aka 9 hechaukaha
  mbohapy tet\u00e3me: Pindorama ipu''ak\u00e1va 5 hechaukaha, Urugu\u00e1i ipu''ak\u00e1va
  mok\u00f5ime ha Argentina mok\u00f5ime avei. H\u00e1katu, FIFA Tembiesar\u00e1i
  Yvypav\u1ebd ojejapo irundy \u00d1embyam\u00e9rikape (Urugu\u00e1i, Brasil, Chile
  ha Argentina, umi FIFA Tembiesar\u00e1i Yvypav\u1ebd 1930, FIFA Tembiesar\u00e1i
  Yvypav\u1ebd 1950, FIFA Tembiesar\u00e1i Yvypav\u1ebd 1962 ha FIFA Tembiesar\u00e1i
  Yvypav\u1ebd 1978), ha Europa ojejapo 10 FIFA Tembiesar\u00e1i Yvypav\u1ebd katu.\\n\u00c1ra
  7 jasyapy ary 2004-jave, FIFA omo\u00f1e''\u1ebd akue Conmebol het\u00e3ngu\u00e9ra
  ikat\u00fava ojapo pe tembiesar\u00e1i pav\u1ebd. Up\u00e9vare, \u00e1ra 17 jasyapy,
  Conmebol he''i oipot\u00e1va Brasil ojejapor\u00e3 Tembiesar\u00e1i 20ha.\\nFIFA
  hi''arapapaha rupive, tet\u00e3ng\u00e9ra hera\u00f1emoguapy ojejapor\u00e3 pe tembiesar\u00e1i
  o\u00f1epyr\u0169 \u00e1ra 5 jasypak\u00f5i ary 2006-jave ha opa \u00e1ra 18 jasypak\u00f5i.
  Up\u00e9va aja, Brasil ha Kolombia oteraguapy ojejapor\u00e3 pe tembiesar\u00e1i,
  \u00e1ra 13 ha \u00e1ra 18, h\u00e1katu, Kolombia oheja, \u00e1ra 11 jasyrundy ary
  2007-jave.\\nO\u00f1emohend\u00e1va[jehaijey | editar c\u00f3digo]\\nArange[jehaijey
  | editar c\u00f3digo]\\nTembiesar\u00e1i o\u00f1emohenda akue ojejapo hag\u0303ua
  \u00e1ra 12 jasypote\u0129 guive \u00e1ra 13 jasypok\u00f5i peve ary 2014-jave,
  umi arapok\u00f5indy aty mich\u0129 mboyve Europa het\u00e3ngu\u00e9ra hembiesar\u00e1i
  vakapipopo kuimba''e rehegua, ha araro''\u00fdre Pindoramagua ha opa Yvy ipeh\u1ebdngue
  \u00f1emby gotyo.\\nT\u00e1va ojejap\u00f3va[jehaijey | editar c\u00f3digo]\\nAry
  2006-jave, pete\u0129 kuatia\u00f1e''\u1ebd Brasil-gua o\u00f1e''\u1ebd akue t\u00e1va
  Rio de Janeiro, S\u00e3o Paulo, Porto Alegre, Belo Horizonte ha t\u00e1va Bel\u00e9m
  ha''eta nunga umi t\u00e1va ikat\u00fava ojejapo tembiesar\u00e1i ku\u00e9ra. H\u00e1katu
  umi t\u00e1va ku\u00e9ra ndorekoi vaekue vakapipopo \u00f1eha''\u00e3 renda ipor\u00e3eterei,
  ha ojogapo va''er\u00e3 t\u00e9r\u00e3 omopor\u00e3 va''er\u00e3.[3]\\n\u00c1ra
  31 jasypo ary 2009-jave, FIFA Atykatuete omo\u00f1e''\u1ebd umi 12 t\u00e1va ku\u00e9ra
  ojejap\u00f3va tembiesar\u00e1i kuera. Belo Horizonte, Brasilia, Cuiab\u00e1, Curitiba,
  Fortaleza, Manaos, Natal, Porto Alegre, Recife, Rio de Janeiro, Salvador (Bah\u00eda)
  ha S\u00e3o Paulo ojeporav\u00f3va,[4] ha Bel\u00e9m, Campo Grande, Florian\u00f3polis,
  Goi\u00e2nia, Macei\u00f3 ha Rio Branco ndoiporav\u00f3iva.[5] Vakapipopo \u00f1eha''\u00e3
  renda o\u00f1emopor\u00e3, ha t\u00e1va Brasilia-pe, Cuiab\u00e1, Manaus ha Natal-pe,
  ojogapo vakapipopo \u00f1eha''\u00e3 renda pyahu. T\u00e1va Recife mante ojogapo
  pyahuete.\\nUmi 12 t\u00e1va ku\u00e9ra o\u0129ha ko tys\u00fdipe. Umi \u00f1e''\u1ebd
  karap\u00e3, he''ise vakapipopo \u00f1eha''\u00e3 renda pyahu.\\nAty o\u00f1eha''\u00e3va[jehaijey
