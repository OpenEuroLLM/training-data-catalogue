  25Opaichav\u00e9vo ndoicoi jendive imembyr\u00e1 peve. Ja omboj\u00e9ra pe imemby
  cuimbaepe Jes\u00fas.\"", "\"Tuminguaave''\u1ef9\\nTuminguaave''\u1ef9 (karai\u00f1e''\u1ebd:
