  Jesucr\u00edsto \u00d1e\u2019\u1ebd.\\nOpavave: Romomba\u2019e guasu nd\u00e9ve,
  \u00d1andej\u00e1ra Hesukr\u00edsto.\"", "\"Jahechami\\nTeju jagua\\nHa\u2019e Tau
  ha Kerana memby ypykue. Ko mymba tuicha ha ivaietere\u00edva, hete teju ha i\u00f1ak\u00e3
  jagua. Oje\u2019e hese oguerekoha ipogu\u00fdpe itakua ha avei o\u00f1angarekoha
  yvaku\u00e9ra rehe.\\nMb\u00f3i tu\u2019\u0129\\nTau ha Kerana memby mok\u00f5iha.
  Hete ojogua mb\u00f3ipe ha ijuru ha\u2019ete tu\u2019\u00ee. Mb\u00f3i tu\u2019\u00ee
  o\u00f1angarek\u00f3je umi mymba oik\u00f3va yvy \u00e1ri ha \u00fdpe oikokua\u00e1va
  rehe.\\nMo\u00f1\u00e1i\\nHa\u2019e h\u00edna Tau ha Kerana memby mbohapyha. Mbohapy
  hague, umi \u00f1u ha yvytyjere, ipokov\u00edvare ija\u2019\u00e9va ha mondaha pytyv\u00f5h\u00e1ra.
  Ha\u2019e karai guasu umi \u00f1\u00fare ha o\u00f1angareko yvytu ha guyraku\u00e9ra
  rehe; ha\u2019eichagua ndaip\u00f3ri umi tend\u00e1re.\\nJasy jatere\\nTau ha Kerana
  memby irundyha. Ko mit\u00e3\u2019i yv\u00e1gaicha hesa hovy as\u00fdva ha kuarahy
  mimb\u00edcha i\u00f1ek\u00e3rague sa\u2019yju. Mich\u0129 ramo jepe mborayhu a\u00f1et\u00e9gui
  henyh\u1ebd ha oguah\u1ebdvo asajepyte os\u1ebd omosarambi, yvoty rop\u00e9icha,
  mborayhu eirete. Oje\u2019e hese op\u00edvo oikoha opa rupiete ha ip\u00f3pe ogueraha
  ka\u2019a rak\u00e3 peh\u1ebdngue ome\u2019\u1ebdva ichupe mba\u2019e kuaaita.\\nKurupi\\nTau
  ha Kerana memby poha. Ha\u2019e ndajeko pete\u0129 karia\u2019y karape\u2019i oik\u00f3va
  asajepyte ka\u2019agu\u00fdre ka\u00f1yh\u00e1pe. Oik\u00f3je ohape ra\u2019ar\u00f5
  mit\u00e3ku\u00f1a os\u1ebdva asajerei h\u00f3gagui.\\nNdaip\u00f3ri ku\u00f1ata\u0129
  o\u00f1anise\u2019\u00ffva ahech\u00e1vo karia\u2019y vaiete. Kurupi ojura katuete
  ha ogueraha ka\u2019aguy hesak\u00e3h\u00e1pe kapi\u2019ipe hovy\u0169 ha hyaku\u00e3vure\u00edva
  \u00e1ri arair\u00f5 ombotarova t\u00e9r\u00e3 ojuka peve.\\nAo ao\\nTau ha Kerana
  \u00f1emo\u00f1are pote\u0129ha. Oje\u2019e niko Ao ao oikoha kure ka\u2019agu\u00fdcha,
  aty at\u00fdpe o\u00f1ondive, ha oikoha yvyp\u00f3ra ro\u2019\u00f3re. Up\u00e9vare
  oiko tapia ko\u2019\u00e3va rapyku\u00e9ri.\\nO\u0129 ramo ojup\u00edva yvyra rak\u00e3re
  ani hagu\u00e3 Ao ao ho\u2019u chupe, pindo m\u00e1tare ojup\u00edvare katu mba\u2019eve
  ndojap\u00f3i, ku oguerokor\u00f5gu\u00e1icha heseku\u00e9ra kurundu.\\nLuis\u00f5\\nTau
  ha Kerana memby pok\u00f5iha. Ha\u2019e pete\u0129 mymba jagu\u00e1pe ojogu\u00e1va,
  ivai, hesa vera ha i\u00f1ak\u00e3 guasu. Pyhare pyt\u00e9vove oho ojapajer\u00e9i
  te\u2019ongue \u00e1ri, up\u00e9vare hesa\u2019yju ha ine.\"", "\"LECTURAS DEL DOMINGO
  3\u00b0 DE ADVIENTO\\nLECTURA PETE\u00ceHA:\\nKo\u2019\u00e1g\u00e3 \u00f1ahend\u00fata
  Tup\u00e3 \u00d1andej\u00e1ra \u00f1e\u2019\u1ebd Isa\u00edas aranduk\u00e1pe o\u0129
  h\u00e1icha 35, 1-6a.10\\nTa hory yvy ojeiko\u2019\u1ef9ha ha yvy i\u00f1apek\u00e3mb\u00e1va,
