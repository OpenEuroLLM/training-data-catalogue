  Che peh\u1ebdngueku\u00e9ra, pene mandu\u2019\u00e1ke umi maranduh\u00e1ra rehe
  o\u00f1e\u2019\u1ebd va\u2019ekue \u00d1andej\u00e1ra r\u00e9rape, ha\u2019eku\u00e9ra
  heta mba\u2019e ogueropu\u2019aka va\u2019ekue.\\nTup\u00e3 \u00d1andej\u00e1ra
  \u00d1e\u2019\u1ebd.\\nOpavave: Romomba\u2019e guasu nd\u00e9ve, \u00d1andej\u00e1ra.\\nALELUIA
  Is 61, 1\\n\u00d1andej\u00e1ra esp\u00edritu o\u0129 che pype,\\nHa\u2019e che mbou
  agueru hagu\u00e3 marandu pyahu mboriahuku\u00e9rape.\\nEVANGELIO\\nMarandu por\u00e3
  \u00d1andej\u00e1ra Jesucr\u00edsto rekove ha hemimbo\u2019e San Mateo omombe\u2019u
  h\u00e1icha 11, 2-11\\nOpavave: Romomba\u2019e guasu nd\u00e9ve, \u00d1andej\u00e1ra.\\nJuan
  Baut\u00edsta o\u0129va up\u00e9r\u00f5 k\u00e1rselpe, ohendu umi mba\u2019e Cristo
  ojap\u00f3va. Up\u00e9mar\u00f5 omondo idis\u00edpuloku\u00e9ra apyt\u00e9gui Jes\u00fas
  rend\u00e1pe. Ha\u2019eku\u00e9ra oporandu chupe: \u2013 Nde piko h\u00edna pe Juan
  he\u2019i va\u2019ekue outaha, t\u00e9r\u00e3pa roha\u2019ar\u00f5 va\u2019er\u00e3
  ambu\u00e9pe.\\nJes\u00fas he\u2019i chupeku\u00e9ra: \u2013 Tapeho peje Ju\u00e1npe
  ko\u2019\u00e3 mba\u2019e pe\u1ebd pehech\u00e1va ha pehend\u00fava pe\u00edna.\\nPemombe\u2019u
  chupe ohecha\u2019\u1ef9va ohecha jeyha, paral\u00edtiko oguata por\u00e3ha, lepr\u00f3so
  okueraha, ohendu\u2019\u1ef9va ohendu jeyha, oman\u00f3va oikove jevyha ha imboriah\u00favape
  o\u00f1ehendukaha marandu por\u00e3. Ha ovy\u2019ait\u00e9ne umi norreneg\u00e1iva
  che rehe che kuaa rire.\\nJuan remimbo\u2019eku\u00e9ra ohoku\u00e9vo, Jes\u00fas
  o\u00f1epyr\u0169 o\u00f1e\u2019\u1ebd hese opavav\u00e9pe, ha he\u2019i: \u2013
  Pe\u1ebd pes\u1ebd ramo guare peho desi\u00e9rtope, mba\u2019e pehecha hagu\u00e3pa
  peho ra\u2019e. Pehech\u00e1pa ra\u2019e taku\u00e1ra yvytu ombovav\u00e1va.\\nNah\u00e1niri.
  Maer\u00e3 aipo ramo peho. Peh\u00f3pa pehecha pete\u0129 kuimba\u2019e o\u00f1emonde
  jeguap\u00e1vapa. Pe\u1ebd niko peikuaa por\u00e3 umi o\u00f1emonde jegu\u00e1va
  oikoha mburuvicha guasu ku\u00e9ra r\u00f3gapente. Amo ipah\u00e1pe, mba\u2019e
  aipo ramo pes\u1ebd pehecha. Pete\u0129 prof\u00e9tape, aj\u00e9pa.\\nUp\u00e9icha
  a\u00f1ete. Ha pejuhu pete\u0129 mba\u2019e guasuv\u00e9va prof\u00e9tagui katu.
  Juan rehe niko \u00d1andej\u00e1ra \u00d1e\u2019\u1ebdme he\u2019i: \u201cChe amondo
  che \u00f1e\u2019\u1ebd rerahaha ne renonder\u00e3, ombosako\u2019i hagu\u00e3 nd\u00e9ve
  nde raper\u00e3.\u201d\\nA\u00f1eteh\u00e1pe ha\u2019e pe\u1ebdme, ndaip\u00f3ri
  yvyp\u00f3raku\u00e9ra apyt\u00e9pe mba\u2019e guasuv\u00e9va Juan Baut\u00edstagui.
  Op\u00e1ichavo, pe mich\u0129v\u00e9va \u00d1andej\u00e1ra Rr\u00e9ino pe, up\u00e9va
  mba\u2019e guasuve chugui.\\n\u00d1andej\u00e1ra Jesucr\u00edsto \u00d1e\u2019\u1ebd.\\nOpavave:
  Romomba\u2019e guasu nd\u00e9ve, \u00d1andej\u00e1ra Hesukr\u00edsto.\"", "\"A\\nN\u00edvel:
