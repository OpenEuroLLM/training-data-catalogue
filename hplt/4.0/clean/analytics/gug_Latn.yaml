  roicuaa ji\u00e1ra paj\u00e1maj\u00e1, Jaecuera os\u00ea ramo yepe ore apytegui,
  ndajaei orerejegua yepe.\\n19. Jaecuera ore rejegua rire mo jiar\u00e9 rae orendive.
  Umiva os\u00ea vaecue oyecua\u00e1uc\u00e1 jagu\u00e2 nda opavavei umichagua ore
  rejeguaj\u00e1.\\n20. Pe\u00eacuera pe\u00f1emongara\u00ed o\u00f1emona pyr\u00e9icha
  \u00f1and\u0177pe pe imarangat\u00fava rupi ja opavave peicuaa jec\u00f3pe opambae.\\n21.
  Arajauca ramo yepe pe\u00eame co cuatia \u00f1e\u00ea, ndajaei peicuaa-\u0177-j\u00e1reje
  co \u00f1e\u00ea a\u00f1etegua gui, peicuaaj\u00e1 rejente vo\u00ed, ja peicuaaj\u00e1
  reje ndip\u00f3rij\u00e1 mbaeveichagua yap\u00fa a\u00f1etegua rejeguava.\\n22.
  \u00bfMavapa upe iyap\u00fava? Pe omom\u00e2r\u00e2vante Jes\u00faspe ja jeiva Jae
  ndajaeij\u00e1 Cristo. Cova pe Cristo reje iya\u00e9-\u0177-va, pe omom\u00e2r\u00e2va
  pe T\u00fava ja pe Ta\u0177rape.\\n23. Oime ramo omom\u00e2r\u00e2va pe Ta\u0177rape,
  up\u00e9va nda pe T\u00fava rejegu\u00e1vai; upe omombe\u00fava pe Ta\u0177ra rejeguaj\u00e1,
  up\u00e9va pe T\u00fava rejegu\u00e1nte avei.\\n24. Ja pe pe\u00eacuera pejend\u00fa
  vaecue i\u00f1ypyrumb\u0177 guive topyta umimbae pendepyape. Jiar\u00e9 ramo pendepype
  co pejendu vaecue i\u00f1ypyrumb\u0177 guive, pe\u00eacuera avei pende ar\u00e9ne
  pe Ta\u0177ra ja pe T\u00fava rejeguava ramo avei.\\n25. Cova voi pe o\u00f1ecuame\u00ea
  mbyr\u00e9 Jae oicuame\u00ea vaecue \u00f1andeve pe tecov\u00e9 iyapyra-\u0177-va
  yaicove tapia jagu\u00e2.\\n26. Coambae ja\u00e9uc\u00e1 pe\u00eame co cuatia \u00f1e\u00ea
  rupi umi penemboyabys\u00e9va reje.\\n27. Pe\u00eame voi iya gueteri upe puaca pe
  pe\u00f1emongara\u00ed jague Ja\u00e9rupi, ja upeareje na peic\u00f4tev\u00eai avave
  pene mboe vaer\u00e2 reje. Upea rangue co pe\u00f1embo puacaj\u00e1 rupi, Ja\u00e9
  pene mboe opa mbae reje. Cova a\u00f1ete nda yapuiri, ja up\u00e9va penemboe jagueicha
  pe\u00ea pepyta Jesegua ramo.\\n28. Ja coanga, che ra\u0177cuera mimi, pepytaite
  Jesegua ramo, icatu jagu\u00e2 sapya oyejechauca yeby ramo gu\u00e2r\u00e2 Jae,
  \u00f1ande yayerovia \u00f1ande poyju\u0177jape, ja anichene jagu\u00e2 \u00f1a\u00f1emot\u00ee
  iy\u0177pype ou yeby rire.\\n29. Pe\u00ea peicuaa jaicha vo\u00ed Jae jecoitepeguaj\u00e1,
