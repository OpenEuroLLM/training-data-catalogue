  omohechauk\u00e1va[jehaijey | editar c\u00f3digo]\\nApu''apopo[jehaijey | editar
  c\u00f3digo]\\nMarandu pete\u0129ha o\u00f1e\u00f1e''\u1ebdva apu''apopo pyah\u00fava
  FIFA Tembiesar\u00e1i Yvypav\u1ebd 2014-pegua \u00e1ra 2 jasyporundy ary 2012-jave,
  FIFA, Atyvete Ojejap\u00f3va Tembiesar\u00e1i ha Adidas omboh\u00e9ra eteh\u00e1pe
  pe apu''apopo ojepur\u00fava: \\\"Adidas Brazuca\\\". Oiporavo 1 119 539 kuimba''e
  ha ku\u00f1a oikov\u00e9va Pindorama oiporavo hag\u0303ua apu''apopo h\u00e9ra,
  t\u00e9ra \u00abBrazuca\u00bb ipu''aka 70 % oiporav\u00f3va hese, upear\u00f5 omyengovia
  pe apu''apopo \\\"Adidas Jabulani\\\".[6][7]\\nT\u00e9ra ambu\u00e9va ikatu ojeporav\u00f3va:
  \u00abBossa Nova\u00bb ha \u00abCarnavalesca\u00bb. Opa t\u00e9ra ikatu ojeporavo
  akue ou Pindorama hekotee.[8] Pe t\u00e9ra opu''ak\u00e1va, \u00abBrazuca\u00bb,
  he''ise Vrasil hekotee por\u00e3.[7]\\nK\u00f3va tembiasa ohasa Vrasil-pe ha''e
  jeporavo pete\u0129ha apu''apop\u00f3pe guar\u00e3 FIFA-pegua, opaite tembiesar\u00e1i
  ojejap\u00f3va vaekue ndoiporav\u00f3i hi''apu''apopo h\u00e9ra, tapicha ku\u00e9ra
  oiporavo pete\u0129h\u00e1me Vrasil-pe.[6]\\nFIFA Tembiesar\u00e1i Yvypav\u1ebd
  2014, tembiesar\u00e1i 22ha vakapipop\u00f3gui, atyvete Adidas ome''\u1ebd apu''apopo
  \u00f1eha''\u00e3h\u00e1ra o\u00f1embosar\u00e1i hag\u0303ua ary 1970-guive.[8]\\nKo
  \u00f1e''\u1ebd \u00abBrazuca\u00bb tapichaku\u00e9ra Vrasil-gua oipuru omboh\u00e9ra
  m\u00e1va ohe\u00f1\u00f3i Vrasil ret\u00e3me. Upear\u00f5 \\\"Brazuca\\\" he''ise
  \\\"Vrasil-gua\\\".[9]\\n\u00abChe vy''aeterei tapicha ku\u00e9ra Vrasil-gua ikatu
  oiporav\u00f3gui mba''e omohechaukaete pe tembiesar\u00e1i h\u00e9ra. Che aimo''\u00e3
  pe apu''apopo Brazuca heraku\u00e3r\u00e3 mbukuh\u00e1pe ijoaju ambue apu''apopo
  pav\u1ebd heraku\u00e3va, apu''apopo Tango-icha Argentina-pe ary 1978-jave ha pe
  apu''apopo Azteca-icha M\u00e9jiko-pe ary 1986-pe\u00bb[7]\\nPo''areruha[jehaijey
  | editar c\u00f3digo]\\nFIFA ha Atyvete Ojejap\u00f3va Tembiesar\u00e1i omohechauka
  pete\u0129 mymba po''areruha (mask\u00f3ta) pete\u0129 tatu juehegua oikov\u00e9va
  Vrasil ret\u00e3me mante (pe Tatu ka''at\u0129nga).\\nT\u00e9le hechauka h\u00e9rava
  \\\"Fant\u00e1stico\\\", ohas\u00e1va TV Globo rupive opa arate\u0129me, omohechauka
  pete\u0129h\u00e1me pe mymba''i po''areruha, vakapipopo ha''\u00e3h\u00e1ra Ronaldo
  omohechauka, karai vakapipopo ha''\u00e3h\u00e1ra heraku\u00e3va Vrasil-gua ha o\u0129va
  Atyvete Ojejap\u00f3va Tembiesar\u00e1i-pe.\\n\u00ab\\\"Che vy''aeterei amomaite\u00edgui
  pe mymba''i tenondeguaite 2014-pegua \u2013he''i Ronaldo opukavy\u2013, \u00f1andemoha''ang\u00e1ta
  upe mok\u00f5i ar\u00fdpe. Ipy''amongetaha katuete heta mit\u00e3me ha mit\u00e3
  vakapipopo ha''\u00e3h\u00e1ra Vrasil-pe, ha Yvypav\u1ebdme, ohayhuetere\u00edgui
  ivakapipopo \u00f1eha''\u00e3 ha het\u00e3\\\".\u00bb\\nFIFA henda intern\u00e9pe,
  tapicha ku\u00e9ra ikato oiporavo akue mymba''i h\u00e9rar\u00e3. Mbohapy t\u00e9ra
  ikatu ojeporav\u00e9va ha''e akue: Amijubi \u2013omohechauk\u00e1va tekohayhu ha
  vy''a, o\u00fava mok\u00f5i \u00f1e''\u1ebd amizade ha j\u00fabilo he''is\u00e9va
  tekohayhu ha vy''a\u2013 ha mok\u00f5i t\u00e9ra ambu\u00e9va omohechauka tekor\u00e3ndy
  \u00f1e\u00f1angareko: Fuleco ha Zuzeco.\\nMymba po''areruha ojoaju ambue mymba
  po''areruha ndie, Zakumi (Tembiesar\u00e1i Yvypav\u1ebd 2010 Yvyafrika ret\u00e3me),
