  ramo umi ohecha\u2019\u1ef9va ohech\u00e1ta, ha umi ohendu\u2019\u1ef9va ohend\u00fata,
  paral\u00edtico guas\u00faicha o\u00f1an\u00edta ha i\u00f1e\u2019\u1ebdng\u00fava
  vy\u2019\u00e1gui osapuk\u00e1ita.\\nOu jev\u00fdta umi \u00d1andej\u00e1ra oipysyr\u00f5va;
  ha oik\u00e9ta Si\u00f3npe sapuk\u00e1i ha vy\u2019a p\u00f3pe, ombojevygui ichupeku\u00e9ra
  vy\u2019a ijapyra\u2019\u1ef9va. Vy\u2019a ha tory omoir\u0169ta ichupeku\u00e9ra,
  ha mombyry opyt\u00e1ta pyah\u1ebd ha vy\u2019a\u2019\u1ef9.\\nTup\u00e3 \u00d1andej\u00e1ra
  \u00d1e\u2019\u1ebd.\\nOpavave: Romomba\u2019e guasu nd\u00e9ve, \u00d1andej\u00e1ra.\\nSALMO
  \u00d1EMBOHOV\u00c1I 146, 6-10\\nOpavave: \u00d1andej\u00e1ra, eju ore salva.\\n\u00d1andej\u00e1ra
  niko nopyr\u00fci va\u2019ekue i\u00f1e\u2019\u1ebd rehe,\\nO\u00f1emo\u0129 uvei
  ojejopy va\u00edva yke rehe,\\nomongaru i\u00f1embyah\u00fdivape.\\n\u00d1andej\u00e1ra
  opoiuka umi i\u00f1apyt\u0129mb\u00fdpe ojeguerek\u00f3va. O.\\n\u00d1andej\u00e1ra
  omonguera umi ohecha\u2019\u1ef9vape ha ohecha jevy,\\n\u00d1andej\u00e1ra omopu\u2019\u00e3
  umi ikang\u00fdvape,\\n\u00d1andej\u00e1ra ohayhu umi heko joj\u00e1vape,\\n\u00d1andej\u00e1ra
  o\u00f1angareko umi mombyryguare. O.\\nItyre\u2019\u1ef9 ha im\u00e9na man\u00f3vape
  ha\u2019e oipytyv\u00f5.\\nHeko va\u00edva rape katu ombotyai.\\n\u00d1andej\u00e1ra
  niko mburuvicha guasu tapiaite guar\u00e3.\\nOis\u00e3mbyhy Si\u00f3n, nde Tup\u00e3
  opaite \u00e1rape. O.\\nLECTURA MOK\u00d5IHA:\\n\u00d1ahend\u00fata Tup\u00e3 \u00d1andej\u00e1ra
  \u00d1e\u2019\u1ebd Santiago kuatia\u00f1e\u2019\u1ebdme o\u0129 h\u00e1icha 5,
  7-10\\nChe peh\u1ebdngueku\u00e9ra, peha\u2019ar\u00f5 kuaa ou peve \u00d1andej\u00e1ra
  Jesucr\u00edsto. Pema\u2019\u1ebdmina mba\u2019\u00e9ichapa umi o\u00f1emit\u00fdva
  oha\u2019ar\u00f5 kuaa ama, up\u00e9i omono\u2019\u00f5 hagu\u00e3 ikoga\u2019a.
  Pe\u1ebdke avei peha\u2019ar\u00f5 kuaa ha ani pene kangy, vok\u00f3i et\u00e9nte
  niko ou jev\u00fdta \u00d1andej\u00e1ra Jesucr\u00edsto.\\nChe peh\u1ebdngueku\u00e9ra,
  ani pe\u00f1omo\u0129 va\u00edtei, ani hagu\u00e3 avei pe\u1ebd penembojovake yv\u00e1pe.
