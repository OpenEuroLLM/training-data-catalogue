  \u1215. \u1218. \u12a3.\\nGezae November 29, 2014\\nI know that the most basic component
  of freedom of expression is the right of freedom of speech and write. The right
  to freedom of speech or write allows individuals to express themselves or others
  without interference or constraint. But I also believe this is a malice statement
  made with knowledge of falsity and grossly negligent without concern whether it
  was true or false. For sure it is purposely desired to inflict injury or political
  harm on Mesfun-Hagos particular and EPDP in general either because of a hostile
  impulse or out of deep-seated meanness. However this kind of statement is not good
  for our struggle for democratic change in Eritrea. Sorry, this is my assessment
  BRO.\\nYohannes Almaz November 29, 2014\\nHi readers\\nThis is the never-ending
  venomous derogatory politics of Eritreans who label themselves as freedom fighters.
  What\u2019s going with those people, why don\u2019t you leave Mesfin Hagos alone
  or if you have the evidence and means to charge him, he is in Germany. He is also
  willing to face justice at any lever and anywhere. Let me tell you, Mesfin doesn\u2019t
  give a sheet on those barkers, if you are trying to use the scare tactic; we are
  aware of you strategy. Your blame game tactic is already proven to be the most distractive,
  helps nobody except the dictator and created distrust among Eritreans. Therefore,
  I advice you to stop pointing at Mesfin, Semere kesete, Daniel, Dr Assefaw, group
  Medrek and others. Unfortunately, those targeted happen to be from non-Akelegizay
  and sends wrong message to Non-akeleguzay peace loving people. From my experience,
  Adhanom had done so many countless mistakes in his struggle against dictator but
  he is less criticized because he has the immunity from his brothers. The more you
  point your finger on those people you are polarizing the people instead of uniting,
  so you are directly supporting Isaias. I can\u2019t trust opposition any more, its
  made to self distract and hatred driven. I think the opposition is worse than the
  dictator, if happen to overthrow the dictator, I can predict worst human right violation
  against certain group of people which Mesfin and the likes came from.\\nHere is
  the way out of this dilemma, stop pointing at people, especially those of non- Akeleguzay,
  because by defaming them you are losing the ground to reach the people who are scared
  to trust you. People from Hamasien and Seraye don\u2019t like Isaias but scared
  of your ill intention and decided to stick with him.\\nYohannes Almaz Tekie\\nQuazen,
