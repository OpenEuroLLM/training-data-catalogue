  : La duchessa di Galliera, MMascarino ....................... \u201c 78\\nALLEGATO
  1 - Giardelli Paolo, Si comincia da una figlia... , Le Mani.\\nIl titolo, per essere
  compreso come detto popolare, va preceduto da dalla prima parte che inizia: \u201cper
  fare una bella famiglia\u2026\u201d. Ed \u00e8 la femmina, che tiene il bandolo
  di tutto il libro.\\nIn quei tristi anni relativi al 1800 e dopo (e tristi perch\u00e9
  nelle campagne spesso i maschietti a quattro anni gi\u00e0 dovevano, scalzi, diventar
  uomini; e le bambine donne), impostare una famiglia era un grossissimo grattacapo,
  anche se l\u2019unico mezzo consentito per \u201ccontinuare la specie\u201d. Per
  il duro lavoro nei campi o per la consegna dell\u2019eredit\u00e0 e del lavoro,
  occorrevano figli maschi. Le femmine, un po\u2019 per antica usanza, per la loro
  debolezza nelle occupazioni fisiche, per le gravidanze e per la dote necessaria
  a sposarle, non erano del tutto gradite. Per\u00f2, se si iniziava con una femmina,
  ci si consolava con l\u2019avere una \u2018sostituta alla mamma\u2019; una che avrebbe
  garantito l\u2019attenzione alla prole successiva anche quando la madre fosse divenuta
  inabile o \u2018mancata di parto\u2019.\\n\u2018Il capo sono io, ma chi comanda
  \u00e8 mia moglie\u2019; cos\u00ec recitava un detto recente; ma non \u00e8 sempre
  stato cos\u00ec. Basta andare indietro di un secolo e gi\u00e0 erano tempi in cui
  i diritti delle donne non esistevano e, di conseguenza, il maschio portava nel bene
  e nel male ma unilateralmente il peso e la responsabilit\u00e0 di tutte le decisioni
  fondamentali.\\nTutte, eccetto la sessualit\u00e0 e le sue conseguenze. Queste sole
  erano in consegna alle femmine. Per\u00f2 garantite ed inquadrate da rigidissime
  regole: produrre figli ed educarli erano il naturale obbligo loro affidato; e come
  hobby, lavorare in casa. Cos\u00ec, poco spazio avevano quelle che incappavano nei
  confini del lecito e peggio per chi ne usciva: i casi di sterilit\u00e0, di violenze,
  di \u2018ragazze madri\u2019, di aborti, di adozioni forzate; ma anche il sesso
  dei neonati, le malattie, l\u2019insegnamento delle regole, tutto era a loro carico.\\nL\u2019Autore,
  forte di una vasta ricerca pluriennale nel territorio Ligure, fa con fredda lucidit\u00e0
  una mai descritta carrellata delle prospettive di vita di quei tempi in campagna.
  Semplici, idilliache, in mezzo alla natura; i bambini che giocavano con poco, si
  addormentavano con dolci o terrificanti ninne-nanna, si premiavano con delle noccioline
  e spesso neanche andavano a scuola. Ma ahiloro! facevano della fame, vivevano la
  miseria nella sporcizia senza igiene, pativano il freddo, la fame, le botte, le
  malattie, le guerre, le cattiverie proprie dell\u2019 ignoranza degli ambienti gretti
  e superstiziosi; e spesso erano venduti.\\nNon \u00e8 per\u00f2 solo triste narrativa,
  ma vera storia. Specie dei piccoli centri, dei paesi pi\u00f9 o meno sperduti sui
  monti, dove la vita scorreva quotidianamente nel lavoro e nel rispetto di antiche
  tradizioni. E conclude con tutta una serie di gustosissime filastrocche, alcune
  in dialetto locale, da non perdere.\\nALLEGATO 2 - Mario Carboni, un secolo di solidariet\u00e0
  a Sestri Ponente, storia della Croce Verde, nuova,Ata.\\nL\u2019Aot\u00f4 definisce
  o so travaggio unn-a carell\u00e2 de \u00e7ent\u2019anni de sto\u00eea e vitta de-a
  P.A. Cr\u00f4xe Verde de Sestri. Ma in realt\u00e6 legibile in senso ci\u00f9 vasto:
  un secolo de vitta italiann-a e zeneize, con l\u2019\u00e9uggio sestrexe; a sottoline\u00e2
  comm-e a vitta de-a delegaion ea e a l\u2019\u00e8 stretamente leg\u00e2 a quela
  de-a Grande Zena, seppur mantegnindo unn-a personale autonomia che a favorisce la
  conserva\u00e7ion de unn-a ben precisa personalit\u00e6 da qu\u00e6 i sestreisi
  de ancheu van fieri.\\nNon solo a Cr\u00f4xe Verde quindi, che o l\u2019\u00e8 o
  personaggio prin\u00e7ip\u00e2 do libbro; ma t\u00fbtte e realt\u00e6 sestrexi in
  to loro evolvise, leg\u00e6 a-a trasforma\u00e7ion industriale e cantieristica.
  Da l\u2019ini\u00e7iale \u2018o ci\u00f9 piccin commune do Regno\u2019 a un di centri
  ci\u00f9 determinanti pe o varo do Rex e a cult\u00fba operaia. Quela che l\u2019Aot\u00f4
  ciamma \u2018a stupenda aventu\u00e2 visci\u00fba da-i sestrexi in \u00e7ent anni\u2019,
  se leze scorrevolmente anche f\u00eaua da Sestri perch\u00e9 qu\u00e6si tutti i
  let\u00f4i l\u2019ha vix\u00fba personalmente.\\nALLEGATO 3 - I Parchi, di Marcella
  Rossi\\nLa A Compagna ha presentato a dicembre il libro \u201cI Parchi\u201d, scritto
  dalla socia vitalizia e console Marcella Rossi, quinto della collana \u201cQuaderni
  genovesi di lingua e letteratura\u201d della nostra Associazione.\\nE\u2019 un testo
  frutto di colloqui avuti con anziani personaggi di Nervi , e racconta i settant\u2019anni
  che testimoniano il passaggio dal privato al pubblico di un tesoro inestimabile.\\nLa
  pubblicazione \u00e8 impreziosita dalle illustrazioni di calcografie originali degli
  allievi dell\u2019Accademia Ligustica di Belle Arti - Corso del prof. Nicola Ottria,
  oggetto di una mostra temporanea a Palazzo Ducale.\\nIl tema \u00e8 attuale. Escluse
  le polemiche e le malinconie sui Parchi di Nervi, prossimi ad essere riqualificati,
  l\u2019attenzione \u00e8 posta sulla comprensione dei meccanismi tecnici e culturali
  che un tempo mantenevano in vita questo patrimonio storico botanico, per recuperarne
  i fattori positivi e i criteri utili per un duraturo restauro, conoscere le esperienze
  passate per interpretare il presente e guardare al futuro.\\nIl titolo generico
  esprime l\u2019intenzione di prendere i Parchi Storici di Nervi a modello dell\u2019universale
  significato di parco e di considerare l\u2019importanza che il tema parco-giardino
  assume nella cultura genovese e ligure.\\nNon solo. Si intende partire da una realt\u00e0
  locale di spicco e fama per affrontare l\u2019urgente tema dell\u2019uso corretto
  degli spazi pubblici. Le interessanti testimonianze, riportate dall\u2019autrice
  con una scrittura snella e vitale, rappresentano un necessario punto di partenza
  per capire il significato e l\u2019utilizzo dei nostri parchi storici e costituiscono
  un approccio concreto per dare il giusto valore a un patrimonio culturale che potrebbe
  perdersi.\\nCi si pu\u00f2 procurare il libro in Sede o durante le conferenze \u201cI
  marted\u00ec\u201d. Presto si potr\u00e0 trovare alla libreria \u201cPorto Antico\u201d
  e alla libreria \u201cL\u2019altra met\u00e0 del cielo\u201d a Nervi, dove verr\u00e0
  nuovamente presentato.\\nALLEGATO 4 - VIAGGIO SENTIMENTALE di Piero Pastorino Editore
  De Ferrari \u2013 2007 - Pagine 152.\\n\u00c9mmo ri\u00e7ev\u00fbo p\u00ea inricch\u00ee
  a nostra biblioteca, o libbro \u201cViaggio sentimentale nella Grande Genova\u201d,
  edito postumo da l\u2019edit\u00f4 De Ferrari, scr\u00eeto da Piero Pastorino, grande
  giornalista xeneise pluripremiou, aut\u00f4 di \u00e2tri libbri a tema locale, scomparso
  in to 2006.\\nIn te so paggine, l\u2019Autou percore a \u00e7it\u00e6 da ponente
  a levante e in to interno, sofermandose p\u00ea ogni Comunn-e \u2013 aborrisce a
  parolla delegation \u2013 da V\u00f6tri a sant\u2019Il\u00e2io, a Pontedeximo e
  a Struppa \u2013 precisando in ta prefazion che Zena, unica \u00e7it\u00e6 italiann-a
  a no l\u2019ha unn-a periferia ma a l\u2019\u00e8 l\u2019union de tante diverse
  anime; p\u00ea ciasched\u00fbnn-a de-e qu\u00e6 o se sofferma a d\u00eascrivine
  episodi caratteristici, vi\u00e7ende umann-e, personaggi, dinastie imprenditori\u00e0li,
  f\u00e6ti inediti e curiosi, tutti scr\u00eeti co.o tratto veloce e sintetico, ma
  coinvolgente, tipico de o bon giornalista che con poche parolle o sa trasmette a
  partecipation emotiva mista a ciaessa de-a cronaca. Insomma, no a stoia d\u00ee
  singoli borghi; ma un rapporto amicale con ciasched\u2019un de l\u00f2, in moddo
  da compil\u00e2 un \u201cviaggio sentimentale\u201d.\\nAbbiamo ricevuto per arricchire
  la nostra la biblioteca, il libro \u201cViaggio sentimentale nella Grande Genova\u201d,
  edito nel 2007 da De Ferrari, scritto da Piero Pastorino, grande giornalista pluripremiato
  genovese, gi\u00e0 autore di altri tre libri a tema locale, scomparso nel 2006.\\nIl
  testo, presentato alla Berio nel marzo 2008, costa 16 euro.\\nNelle 152 pagine,
  l\u2019Autore scorre la citt\u00e0 da ponente a levante e nell\u2019interno, soffermandosi
  per ogni Comune \u2013 aborrisce il termine delegazione \u2013 da Voltri a Sant\u2019Ilario,
  a Pontedecimo ed a Struppa \u2013 precisando in prefazione che Genova, unica citt\u00e0
  italiana, non ha periferia ma \u00e8 l\u2019unione di tante anime diverse; per ciascuna
  delle quali si sofferma a descriverne episodi caratteristici, vicende umane, personaggi
  e dinastie imprenditoriali. In genere fatti inediti e curiosi, tutti scritti col
  tratto veloce e sintetico, ma coinvolgente, tipico del buon giornalista che con
  poche parole sa trasmettere la partecipazione emotiva mista alla chiarezza della
  cronaca.\\nInsomma, non la storia dei singoli borghi, da affidare a testi storici
  pi\u00f9 approfonditi; ma un rapporto amicale con ciascuno di essi, in modo di compilare
  un \u201cviaggio sentimentale\u201d; come guardando le strade e le case, percorrendo
  la citt\u00e0 a piedi o in tram. \u00c9 riuscito nell\u2019intento di farci conoscere
  meglio casa nostra; e cosa graditissima, arricchiti, a farcela amare un pochino
  di pi\u00f9.\\nEzioBaglini Inviato a Paolo GPiana\\nALLEGATO 5 - Bampi, Franco \u2013
  Nuovo Dizionario Italiano \u2013 Genovese \u2013 Illustrato e commentato.\\nNuova
  Editrice Genovese. Ottobre 2008. pagine 448 \u2013 Euro 14,50\\n- Bampi Franco \u2013
  Graf\u00eea ofi\u00e7i\u00e2 \u2013 opuscolo n. 1 della \u2018Collana Bolez\u00f9mme\u2019\\nSociet\u00e0
  Editrice Sampierdarenese. Gennaio 2009. pag.36 - Euro 3,00\\nCon dui diversi edit\u00f4,
  o nostro Prescid\u00e9nte \u2013 sensibile ci\u00f9 che mai all\u2019\u00fbzo do
  dial\u00e9tto \u2013 o l\u2019ha\\nRecentemente publicou dui travaggi suvia o tema
  a coeu: o \u201cNuovo... ...; e l\u2019opuscolo \u201cGrafia ...\u201c.\\nNo l\u2019\u00e9
  mai as\u0153 sottolini\u00e2 l\u2019inport\u00e0nsa de simili publicazioin, in epoca
  in cui l\u2019uso do\\ndial\u00e9tto tende inesorabilmente a entr\u00e2 in te nozioin
  storiche do \u201cperd\u00f9o irrimediabilmente\u201d; e -\\ndimmoselo ciaeo \u2013
  pe c\u00f3lpa nostra (incapacitae e/o indolenza). In meno de ottant\u2019anni, o
  l\u2019\u00e8 st\u00e6to\\nda primma l\u2019italian che o l\u2019ha emarginou drasticamente
  l\u2019\u00f9so commune; poi in te neuve\\ngenera\u00e7ioin o l\u2019ha peggiorou
  a situasion l\u2019uso de l\u2019ingleise; \u00f3ua, novello Attila, lingui\u00e7ida,
  o l\u2019\u00e9 a\\ntelematica (computer e SMS), incapace de espr\u00ecmme a muxicalit\u00e6
  do nostro lengo\u00e0ggio.\\nFranco Bampi o l\u2019ha vosciu risal\u00ec a chinn-a
  semplificando a o maximo: primma o vocabolaio, che o\\nl\u2019\u00e9 \u201citalian-zeneize\u201d,
  speculare a o Casaccia, o qu\u00e6 o l\u2019\u00e8 part\u00eco da-a necesit\u00e6
  d\u2019insegn\u00e2 l\u2019italian; poi\\na \u201cGrafia\u201d che respetando e-esigense
  de l\u2019Acad\u00e9mia Ligustica do Br\u00e9nno\u201d o l\u2019ha cercou de port\u00e2
  a-\\nO minimo e regole, a grafia, i ac\u00e9nti; tutti osdtici a-o moderno moddo
  de esprimmise\\nd\u00e2 quindi a-a nostra lengua semplici regole, sfoltie a-o maximo
  ma \u00e2tret\u00e0nto sufi\u00e7\u00e9nti a f\u00e2la\\nl\u00eaze e scr\u00eeve
  univocamente; gestibili fa\u00e7ilm\u00e9nte con \u2018na rapida let\u00fba. Dov\u00e9ivan
  \u00ease uz\u00f2u\u00ea da\\ntutti, po\u00eati, m\u00f9xicisti, ato\u00ee, p\u00f2polo
  com\u00f9n. E-e dui publica\u00e7ioin purian \u00ease a barca de\\nsarvat\u00e0ggio
  che a porti\u00e2 a riva l\u2019uso do zeneise parl\u00f2u e scr\u00eeto.\\nPertanto,
  no purian manc\u00e2 in nisciunn-a libreria di quei che veramente amman Zena.\\nO
  l\u2019\u00e8 infine doveroso da p\u00e0rte m\u00e6 \u2013 anche contro a voent\u00e6
  de l\u2019Aut\u00fb \u2013 sotoline\u00e2 che, pe\\nambedui e publicazioin \u2013
  comme anche o libbro \u2018i Parchi\u2019 de-o console Marcella Rossi\\nPatrone,
  recensio o meise passou \u2013 nisciun vantaggio economico o l\u2019\u00e8 and\u00e6to
  a-i Aotoi che han\\ndevol\u00fbo o benefi\u00e7io a l\u2019Associazion e a-e poscibilit\u00e6
  de fal\u00e7ile acquisto, esendo mir\u00e6 a-o\\nspantegamento in t\u00f9tte e c\u00e2ze,
  e no a \u2018n\u2019edi\u00e7ion de l\u00f9sso.\\nI libbri porian \u00ease acquist\u00e6
  in te librerie; l\u2019opuscolo anche in te edicole, ordinandoli; oppure\\nprenotandoli
  a-i \u201cMartedi\u201d in to palasso Ducale\\nALLEGATO 6 - DIZIONARIO DELLA CULTURA
  BRIGASCA di Massajoli Pierleone\\nVol. IV. - Edizioni dell\u2019Orso \u2013 2008
  \u2013 pag.345\\nIn territorio italiano \u00e8 posizionata all\u2019estremo occidentale
  delle Alpi Marittime; ma per la massima parte \u00e9 sconfinante in Francia. Comunque,
  la popolazione di Briga ha conservato, per nostra fortuna e per loro bravura, una
  forte personalit\u00e0 ed ascendente italiano \u2013 come cultura, tradizioni, dialetto
  -. Dimostrati con la regolare uscita della rivista \u201cil Nido d\u2019Aquila\u201d
  e con i precedenti volumi relativi al \u201clessico\u201d, alla \u201cgrammatica\u201d
  ed alle \u201cvoci della tradizione\u201d. Ultimo questo IV volume, il Dizionario
  di Cultura Brigasca (ovvero \u201cglossario etnolinguistico comparato, delle Alpi
  Liguri Marittime\u201d). In esso viene allargata la ricerca, conoscenza e mantenimento
  anche dei dialetti vicini Tendasco, Saorgino-Fontanenco, Breglienco, Olivettese
  e di etimi di tutta la val Roia.\\n\u00c9 con opere come queste, che si mantiene
  viva la Liguria ed i Liguri.\\nALLEGATO 7 - il poeta di Savona Giuseppe Cava (Beppin
  da Ca) , Di Milazzo Giuseppe \u2013 Sabatelli ed. 2007\\nPersonaggio ben conosciuto
  \u2018o Beppin\u2019 per numerose edizioni di poesie e narrativa, in dialetto ed
  in italiano, storica e giornalistica, sui quotidiani genovesi. Epicentro, Savona.\\nMa
  la prefazione del libro allerta, e chiama ad una approfondita lettura del libro
  perch\u00e9 quell\u2019uomo descritto fino ad oggi da numerosa saggistica, quale
  autore sensibile, romantico, poetico, il vate di Savona, \u00e8 in realt\u00e0 solo
  la punta dell\u2019iceberg. Perch\u00e9 Beppin era s\u00ec vulcanico, granitico,
  volitivo, creativo; ma con un \u201cdifetto\u201d per il quale definirlo scomodo
  \u00e8 dir poco: un controcorrente storico.\\nUn rispettoso, ma pugnace e convinto
  anarchico, antimilitarista e anticlericale.\\nC\u2019\u00e8 da leggere il libro,
  per sapere come da buon lottatore ha orgogliosamente superato in maniera brillante
  l\u2019amputazione di un arto; convissuto una societ\u00e0 bigotta e giolittiana;
  maldigerito una guerra mondiale ed una dittatura.\\nE questo, perch\u00e9 essere
  stato costantemente \u2018uno stonato, fuori del coro\u2019, nonch\u00e9 aver provato
  anche un po\u2019 di carcere e di domicilio coatto.\\nALLEGATO 8 - Davide Roscelli
  - Cristoforo Colombo, archeologia della scoperta \u2013\\ned. Bastogi.2006 \u2013
  pagg. 240\\nMi ho conosci\u00fbo personalmente o dot\u00f4 Davide Roscelli a-i Martedi
  da-A Compagna a-o Ducale, quande, ottanteseienne o l\u2019\u00e9 vegn\u00fbo a tegn\u00ee
  na conferensa su Cristoforo Colombo.\\nChi \u00e0mma a st\u00f4ia e i l\u00ecbbri,
  no po\u00ea non con\u00f3sce i s\u00f4 n\u00f9merosi precedenti trav\u00e0ggi, molti
  punt\u00e6 a Zena e a Liguria\\nDe o nostro concittadin Colombo, anpiscima e univers\u00e2le,
  \u00e0 l\u2019\u00e8 a bibliografia: migliaia de tratt\u00e2ti in tutte e lengue,
  han analisou in to dettaggio a s\u00f2 st\u00f6ia: a famiggia e a personn-a, a \u00e7itt\u00e6
  de nascita e-a vitta, a scoverta e i tri\u00f6nfi, e motificazi\u00f6n e a morte.
  Eppure, gh\u2019\u00e8 sempre da scrov\u00ee quarcosa de n\u00eauvo.\\nInf\u00e6ti
  Roscelli descrive o grande amir\u00e0lio con un t\u00e0ggio introspetivo difer\u00e9nte
  da-i \u00e4tri. Gi\u00e0 ari\u00easce a-incurios\u00ee o let\u00f4, da-a copertinn-a,
  stuzzicandolo con ci\u00f9 notissie: a famiggia, poich\u00e9 i Cristoforo Colombo
  son ci\u00f9 d\u2019un, e di essi dui, anche lou distinti amir\u00e0li; \u00e2tra,
  che o l\u2019\u00e8 in graddo de d\u00ec a d\u00e6ta de nascita (e, a pag. 192,
  anche l\u2019arbo genealogico). No basta. Poich\u00e9 p\u00ea comprende un personaggio
  l\u2019\u00e8 indispensabile inser\u00eelo in to periodo da so v\u00ectta, Roscelli
  precisa in to sottot\u00ectolo che o libbro mira anche ad analizz\u00e2 a \u201carcheologia
  de a scoverta, e de-e civilt\u00e6 amerinde\u201d. Non \u00fbrtima \u2018chicca\u2019
  un-a vasta e completa iconografia, spieg\u00e2 d\u00ee vari ritr\u00e6ti de Colombo.\\nALLEGATO
  9 - Parolle de Z\u00eana, Franco Bampi \u2013 editrice S.E.S. 2009 \u2013 pp.36\\nD\u00f2ppo
  Graf\u00eea ofi\u00e7i\u00e2, o nostro Prescidente ha f\u00e6to sciort\u00ee o seg\u00f3ndo
  volummetto de-a \u201cCollana Bolez\u00f9mme\u201d, co-o beneplacito de l\u2019Academia
  Lig\u00f9stica do Br\u00e9nno. Poche pagine, ma d\u00e9nse de parolle zen\u00e9izi
  scr\u00eete in grafia ofi\u00e7i\u00e2, suddivise in temi, un pe ogni faci\u00e2ta;
  cosci, l\u00e9zendo un-a pagina a-o gi\u00f3rno, in poco tempo e in forma demo\u00e2nte,
  se inpara un vasto vocabolaio con parolle ad \u00fbzo apropriou.\\nALLEGATO 10 -
  La gatta turchina e il gatto vagabondo, Paolo Lingua \u2013 editore De Ferrari2009
  \u2013\\nRomanzo-favola che ha da metafora alla nostra vita cittadina, dalla politica
  delle scelte alle difficolt\u00e0 quotidiane, che ruotano attorno ad una storia
  d\u2019amore tenerissima.\\nALLEGATO 11 - Gli Scolopi in Liguria, scelte artistiche
  e iconografiche, Margherita Priarone \u2013 De Ferrari 2009 \u2013 pagg.80\\nUn
  affascinante saggio, riportante la propria indagine svolta sia sull\u2019esistenza
  dei padri Scolopi, dal 1621 a Carcare e poi anche a Genova; sia sui legami di committenza
  con famiglie di rilievo dell\u2019aristocrazia locale; e sia sulle chiese e scelte
  artistiche che le hanno arredate.La Professoressa ha cos\u00ec evidenziato un primato
  della Liguria per l\u2019attivit\u00e0 svolta dai Padri sia a livello educativo
  ed istruttivo popolare tramite istituti gratuiti, e sia a livello artistico ed architettonico.\\nALLEGATO
  12 - Liguria \u2013 Ville, Parchi, Giardini \u2013 editore DeFerrari . 2008 \u2013
  pagine 64.\\nDescrizione-guida ai ventisette pi\u00f9 belli della Regione, compreso
  l\u2019orto botanico di Genova e de La Spezia.\\nALLEGATO 13 - Da Nonna a Nipote,
  lezione di cucina e di vita, Maria Grazia Daniele, editrice De Ferrari, 2009, pagg.
  120.\\nAccostare ricette e ricordi, \u00e8 un\u2019operazione riuscita a Maria Grazia
  Daniele, novella cuoca a vantaggio della nipotina Alice; forse proprio in virt\u00f9
  di un passato familiare tradizionalista maturato in esperienza artistica di figurinista
  e poi di politico \u2013 quale impegnata senatrice -.\\nDopo aver presumibilmente
  girato il mondo per motivi professionali, ha raccolto una serie di ricette che spaziano
  dai bucatini all\u2019amatriciana al limoncello; dalla toscana \u2018ribollita\u2019
  al filetto in crosta alla Wellington; dal pesto alla genovese...col basilico di
  Teglia e per gli gnocchi, allo \u2018stocche\u2019 cucinato con ricetta capace di
  convertire un agnosta del pesce nordico.\\nBell0\u2019approccio in cucina. Ci trasmette
  che ogni ricetta non \u00e8 riportata a caso o in ordine alfabetico, ma seguendo
  un filo ben preciso di ricordi, motivazioni e sentimenti i quali, appare evidente,
  aggiungono al gusto una forza misteriosa e potente.\\nALLEGATO 14 - Sentiero delle
  Terre alte, itinerario escursionistico nell\u2019entroterra del Ponente Savonese,
  Dario Ottonello, per la Comunit\u00e0 Montana Pollupice, ed. Coop. Strade, pagg.
  96\\nALLEGATO 15-, Baccio Emanuele Maineri, patriota e poligrafo, GLuigi Bruzzone
  tipog. Litografia Ligure, 1999, pagg. 320.\\nL\u00f2u de ri\u00e7erca suvia un personnaggio
  ligure, da-a vitta visci\u00fba intensamente, qu\u00e6 patriota e poligrafo de Toi\u00e0n;
  e comme gh\u2019\u00e0 abitu\u00f4 in te so esplora\u00e7ioin o studioso Bruzun,
  ricca de particol\u00e2ri t\u00f9tti rilev\u00ea da precisa e picat\u00fbosa documenta\u00e7ion.\\nALLEGATO
  16 - Bibliografia Speleologica Ligure, AA.VV., Cooptipograf, 2006, pag.224 con CD\\nInpegnativo
  l\u00f2u de cataloga\u00e7ion, pe specialisti. Pe pochi, ma tutti de \u00e8rto liv\u00e9llo
  na\u00e7ionale.\\nALLEGATO 17 - Obiettivo su Recco, una storia in mille foto, E.Razeto,
  S.Pellegrini, ed.Microart\u2019s 1986, pagg. 542\\nRazeto o l\u2019\u00e8 \u201cPremio
  Vito Elio Petrucci 2009\u201d riconosciu da-a Compagna. So e foto in to libbro:
  un susseguise de imm\u00e0gini, de-a Recco pregu\u00e6ra, a-traverso i bonbardamenti
  a tap\u00eato do 1943, a-a Recco d\u2019ancheu; da-o garibaldin De Lucchi a-a Pro
  Recco canpion de ballan\u00eauo; da-i velieri in cant\u00ea in scia m\u00e6nn-a
  a-e f\u00e8ste patronali. Gli A\u00f4toi forniscian unn-a cosc\u00ec ricca carrell\u00e2
  de immagini de-a loro \u00e7ittadinn-a, da elev\u00e2 o libbro a fonte fondamentale
  de-a cult\u00fba storica locale.\\nALLEGATO 18 - Garibaldi e la Liguria, Erio Bertorello
  e Giulio Fiaschini, ed. Sabatelli per Soc.Operaia Universale \u201cGiuseppe Mazzini\u201d
  di San Pier d\u2019Arena, 2009, pag.174\\nQuest\u2019opera, a l\u2019\u00e8 nasciua
  pe onor\u00e2 o segondo \u00e7entenaio de-a nascita do nostro conterraneo, socio
  onorario de-a Socj\u00eat\u00e6 sanp\u00eadeninn-a, curatto da-i dui suvia \u00e7it\u00e6
  e con la moltepli\u00e7e colabora\u00e7ion de-o studioso Emilio Costa, mai troppo
  elogi\u00f4 pe a so vasta c\u00fbltua, modestia e produ\u00e7ion. A veu evidenzi\u00e2
  e molteplici testimonianse de-a predile\u00e7ion de Garibaldi verso i \u00f2per\u00e2i,
  in ti qu\u00e6 o scorgieva e v\u00eae molle neces\u00e2ie a f\u00e2 scatt\u00e2
  a \u2018reden\u00e7ion\u2019 de l\u2019Italia, a scapito di-i intelletuali (i ci\u00f9
  numerosi tra i Mille) ma testimoni de \u2018n c\u00eato sociale moderou tendensialmente
  favoevole a-a politica conservatrice. Garibaldi e Zena o l\u2019\u00e8 st\u00e6to
  un binomio determinante pe o generale, e San P\u00ea d\u2019Aenn-a unn-a fucinn-a
  logistica, pe \u2013 a-a finne - ariv\u00e2 a-l\u2019Unit\u00e6 de-a Patria, asc\u00ec
  se sotta l\u2019egida di Savoia.\\nALLEGATO 19 - I sciantilin (le calosce), Enrico
  Scaravelli, commedia genovese in tre atti \u2013 Consulta Ligure delle Associazioni,
  ODV Onlus 2008 \u2013 pp.48.\\nALLEGATO 20 - Le poesie di un emigrato, Lorenzo Maritano
  (L\u00f9ensu), Centro Storico Pietrese e Gente de Liguria \u2013 pp. 220\\nALLEGATO
  21 - L\u2019Oltregiogo, una terra strategica per l\u2019Italia, F.Monteverde \u2013
  De Ferrari 2006 \u2013 pagg. 160.\\n- Limonte, Franco Monteverde, De Ferrari 2008.
  pag. 224\\nDono dell\u2019Aot\u00f4. Dui studdi con temi riproposti e dibatt\u00fbi
  a m\u00e0zzo 2009, a-i \u201cMartedi de ACompagna\u201d.\\nALLEGATO 22 - A-a reversa,
  in pr\u00f6za zeneize \u00e0 riso raeo, Mangini GianFranco ed. Frilli 2009, pag.
  156\\nDono dell\u2019Aot\u00f4. Comensa o libbro, co-o cap\u00ectolo titol\u00f2u
  \u00abE reixe - ...inte \u2018nn\u2019atra lengua no poieva scrive...\u00bb.; e
  p\u00f6co d\u00f2ppo anc\u00f2n \u00abMae poae e c\u00f6se o \u00ea capiva: \u201cL\u2019\u00e8
  m\u00ebgio parl\u00e2ghe ben in zeneize, che m\u00e2 in italian. L\u2018\u00e8 cosc\u00ec
  che son nasci\u00fao zeneize. Sempre m\u00ebgio de ninte\u00bb. E cosc\u00ec o va
  avanti a roa libera a narr\u00e2 a so stoia e quella ant\u00eega, a stoia do Balilla
  e a v\u00ectta de Zena, da go\u00e6ra, de m\u00e9istri e de let\u00eaatua (o so
  mest\u00ea) e se domanda se a Zena se parli\u00e0 ancon zeneize.\\nO commento scr\u00eeto
  da-o nostro Prescidente o l\u2019\u00e9 st\u00e6to \u201cdrento gh\u2019\u00e9 de
  t\u00f9tto\u201d.\\nALLEGATO 23 - Un secolo di solidariet\u00e0 a Sestri Ponente,
  Mario Carboni ed. Nuova ATA, 2003, per contro della Pubblica Assistenza Croce Verde,
  pag. 350. (vedi allegato n. 2)\\nL\u2019autore Mario Carboni, definisce il suo lavoro
  un \u2018diario storico\u2019: una carrellata, anno dopo anno, di cento anni di
  storia e vita della P.A. Croce Verde sestrese. Ma in realt\u00e0 leggibile in senso
  pi\u00f9 vasto: un secolo di vita italiana e genovese, con l\u2019occhio sestrese;
  capace di sottolineare come la vita della delegazione era ed \u00e8 strettamente
  legata a quella di tutta la Grande Genova, seppur mantenendo una personale autonomia
  che favorisce la conservazione di una ben precisa personalit\u00e0 di cui i sestresi
  di oggi vanno fieri.\\nNon solo la Croce Verde quindi, che \u00e8 il personaggio
  principale del libro; ma tutte le realt\u00e0 sestresi nel loro evolversi, soprattutte
  quella enorme locale di trasformazione industriale e cantieristica, e nell\u2019essere
  coinvolte dalle vicende regionali e nazionali. Dall\u2019iniziale \u2018pi\u00f9
  piccolo comune del Regno\u2019 ad uno dei centri pi\u00f9 determinanti d\u2019Italia
  per il varo del Rex e la cultura operaia, la quale\\nultima \u00e8 un tutto dire
  sulla qualit\u00e0 condizionante la politica e la vita del Paese.\\nConciso ma preciso,
  nel libro si leggono molti personaggi ed avvenimenti collaterali, politici,\\nludici,
  storici e culturali che hanno fatto la cronaca e la storia: dal terremoto di Messina,
  al tribunale di Norimberga, alla zanzara tigre.\\nQuella che l\u2019Autore definisce
  \u2018la stupenda avventura vissuta dai sestresi in cento anni\u2019, si legge scorrevolmente
  anche fuori da Sestri per i numerosi richiami alla vita genovese in genere ed oltre,
  e che qualsiasi lettore, da un certo punto in poi, ha vissuto personalmente.\\nMa
  ripeto, non sfugge il sottile messaggio del desiderio di conservazione di una propria
  individualit\u00e0, leggendo ripetutamente come i sestresi sono riusciti a stare
  al passo con la storia e nel contempo realizzare innumerevoli iniziative, affrontandole
  e superandole con spirito proprio.\\nALLEGATO 24 - \u201cIl Bugiardino\u201d, 2010,
  lunario agenda delle terre liguri, Consorzio della Quarantina, formato 10x15, pp.
  130.\\nInt\u2019o libretto se peu l\u00eaze inumerevoli not\u00ec\u00e7ie popol\u00e2ri
  cintad\u00ecnn-e tipiche d\u2019un lun\u00e2io, \u00f9tili asc\u00ec comme diario,
  calend\u00e2io, pe-i trav\u00e0ggi in canp\u00e0gna, pe ril\u00eaze inte c\u00e9ighe
  da mem\u00f6ia i santi patroni, i merco\u00e9i, ....\\nA publica\u00e7ion, t\u00eepica
  e intregamente ligure, a percore a tradi\u00e7ion us\u00e2 da-o 1474, e poi anc\u00f3
  into sete\u00e7ento con-o Chiaravalle e inte l\u2019oto\u00e7ento co-i \u201cLun\u00e2i\u201d
  do \u2018sci\u00f4 Tocca\u2019 e do \u2018sci\u00f4 Reg\u00ecnn-a\u2019, di qua\u00e6
  o veu \u00ease l\u2019erede.\\nALLEGATO 25 - Un ligure contro Toro Seduto, U.Torretta
  ediz. Liberodiscrivere. 2009, pp.102.\\nO protangonista se ciamma Gustin Luigi Devoto,
  e o se diciara zeneize, do 1851. In realt\u00e6, ri\u00e7erche de l\u2019Aot\u00f4,
  o fan nasciuo de Borgo\u00eauvo de Mez\u00e0nego, donde o s\u2019\u00e8a emigrou,
  ancun banb\u00ecn, a New York. Cosc\u00ec, e ri\u00e7erche \u00e0n scoverto a so
  cari\u00eara militare: non s\u00f4lo l\u2019aruolamento\\ninto legendario 7\u00b0
  Cavaler\u00eea inte l\u2019anno 1873, ma asc\u00ec a so prezensa inta bat\u00e0ggia
  de Little Big Horn, donde i nativi Sioux \u00e0n sconf\u00eeto o generale Custer
  e o so rezimento. E \u00e2tretanto presente a-oa legendaio insegoimento d\u00ee
  Nez Perc\u00e9. Fin a-o congedo, avegn\u00eeo a-a fin de l\u2019anno 1878.\\nPe
  tutti chi \u00e0n amou i films de \u2018cavalli e p\u00fba\u2019, o l\u2019\u00e8
  \u2018n libbro da l\u00eaze inte\u2019n sci\u00f2u e da tegn\u00ee in bibblioteca,
  pe d\u00e2 reale dimen\u00e7ion a-a fantasia.\\nALLEGATO 26 - Il Forte del Castel
  di Gavi, Armando DiRaimondo Erga, 2008, pp.322.\\nNostro soccio da anni, o Di Raimondo
  no l\u2019\u00e8 n\u00e9uvo a scr\u00eeve di libbri dopo approfond\u00eete ri\u00e7erche
  inti archivi, musei, parocchie e consultando singoli colt\u00f4i de stoia tra Z\u00eana
  e Torin che o l\u2019avesse noti\u00e7ie utili.\\nO l\u2019\u00e0 prodotto un belo
  vo\u00f9umme, ricco de detagi\u00ea not\u00ec\u00e7ie (\u00f2spiti\\nilustri, condi\u00e7ion
  de vitta, epidem\u00eee, vest\u00ee e uniformi, ecc.) e asc\u00ec inmagini\\nde
  Gavi che a l\u2019ea, da-o \u00c7inque\u00e7ento, rocaforte defin\u00eea \u2018ci\u00e2ve
  d\u2019a\u00e7esso\u2019 a-i terit\u00f6i de-a Republica de Z\u00eana da-a parte
  de l\u2019Oltrez\u00f4vo; sempre a primm-a a sub\u00ee i vari tentat\u00eevi da
  agrescion di Savoia. L\u2019Aot\u00f4 fa parte de unn-a asocia\u00e7ion che a desidera
  f\u00e2 de-a fortessa un polo de atra\u00e7ion turistica, doppo anni e anni de abandon.\\nALLEGATO
  27 - Gli anni di Savignone, Guglielmo Tealdi, Bruzzone ed., 2009, pp.148\\n\u201cOgnid\u00f9n
  o dovieva scr\u00eeve e proprie mem\u00f6ie\u201d: cosc\u00ec qu\u00e6xi o l\u2019ini\u00e7ia
  a prefa\u00e7ion, specificando \u2018mem\u00f6ia\u2019 e non \u2018aotobiograf\u00eea;
  definendo a seconda qu\u00e6 \u2018narcisistica descri\u00e7ion\u2019 mentre a primm-a
  a l\u2019\u00e8 narra\u00e7ion ci\u00f9 orient\u00e2 a-i l\u00eaughi, ambienti,
  tempi e amici\u00e7ie f\u00eaua de s\u00e9 stessi.\\nO l\u2019\u00e8 cosc\u00ec
  o raconto do Mino, pi\u00e2xevolmente lezibile, con epi\u00e7entro o periodo do
  fascismo, vis\u00e7i\u00fbo a Savignon. Tutti i abitanti e i sfol\u00e6 inta zona,
  o peu r\u00e9conosce e personn-e e avenimenti.\\nALLEGATO 28 - Corpus delle uniformi
  civili, Carla Cavelli Traverso, De Luca ed., 2009, pp. 104.\\nRicamente ilustr\u00f2u
  e document\u00f2u in 25 anni de cataloga\u00e7ion da parte do Servi\u00e7io Colt\u00fba
  da Region, o libbro o descrive i vest\u00ee indos\u00e6 da-i fon\u00e7ionai de Corte
  e do Stato, into periodo XVIII-XX secolo. A-a pari de uniformi militari, l\u2019\u00ea
  asc\u00ec ean sog\u00e8te a severa e precisa normativa, pe fa individo\u00e2 o fun\u00e7ionaio
  che a l\u2019indos\u00e0va, a so categor\u00eea de apartegnen\u00e7a, graddo, fun\u00e7ion
  e responsabilit\u00e6. A fantas\u00eca a no l\u2019\u00e0 limiti.\\nALLEGATO 29
  - Banca delle tradizioni, Maurizio Sentieri, ed. DeFerrari, 2009, pp.96.\\nLibbro
  de gastronom\u00eca, con sottotit\u00f2lo \u201cri\u00e7ette (no solo) liguri e
  sav\u00f4i de vitta\u201d. Ma no l\u2019\u00e8 un semplice libbro de ri\u00e7ette;
  ma a testimoniansa autenticamente arecug\u00e9ita into terito\u00eeo de l\u2019antica
  Republica de Z\u00eana, de cult\u00fba alimentare \u201cin via de estin\u00e7ion\u201d.
  Inf\u00e6ti e ri\u00e7ette present\u00ea, son fr\u00fbto de \u2018na ri\u00e7erca
  dexenn\u00e2, coordin\u00e2 da l\u2019Aot\u00f4, unica a livello na\u00e7ionale,
  e rapresenta a rescoverta e valorisa\u00e7ion de-e v\u00e0rie \u00fbzanse alimentari.\\nALLEGATO
  30 - C\u2019era una volta il Costa del Sol, fra cronaca e fantasia, Umberto Gugliotta,
  ed. De Ferrari, collana Sestante, 2009, pp.96.\\nInto 1994, a Sanna, un incendio
  doloso o l\u2019\u00e0 destr\u00fbto o brigantin \u2018Costa do Sol\u2019 arivou
  in avar\u00eca vint\u2019anni primm-a. O stupendo v\u00e9iero e o so capitan son
  st\u00e6ti \u00f2g\u00e9tto de cosc\u00ec contrastanti sentimenti, e noti\u00e7ie
  de vicende misteriose, da intr\u00e2 into mito de-e stoie do m\u00e2, donde veit\u00e6
  e fantasia se mesccian asemme. L\u2019Aot\u00f4, savoneise d\u2019ado\u00e7ion,
  doppo meticolose ri\u00e7erche, analisi di documenti e giornali de l\u2019epoca,
  o l\u2019\u00e0 recostru\u00eeo a st\u00f6ia do veliero, cosc\u00ec da forn\u00ee
  a-o let\u00f4 de noti\u00e7ie ci\u00f9 v\u00eae e prov\u00ea.\\nALLEGATO 31 - Poggio
  e san Bernardo di Favaro storia di due borghi e di una chiesa, AA.VV., ed.Bogliasco
  2009, p.208\\nPierLuigi Gardella, premio DeMartini 2009, co-o Centro studi Storie
  di Jeri, \u00e0n coordinou a reda\u00e7ion de o libbro rigoardante dui fra\u00e7ion
  suviastanti Bogiasco e, comme sottolinea o titolo, con unn-a sola g\u00eaxa. A scignific\u00e2to
  de unn-a unit\u00e6 de valigien, ch\u2019a du\u00e2 da ci\u00f9 de quattro\u00e7ent\u2019anni.\\nSt\u00f6ia
  e toponomastica, personn-e, tradi\u00e7ion e sagre, so\u00e7iet\u00e6 sportive e
  servi\u00e7i sociali descr\u00eeti into libbro, dimostran a capa\u00e7it\u00e6 de
  queste comunit\u00e6 a organizase e rendise parte vitale no solo da st\u00f6ia locale
  ma asc\u00ec de quella do zeneizou.\\nALLEGATO 32 - Ayron Xavi, Jennifer Della Rocca,
  ed. SES\\ndoppo o primmo libbro titolou Xaron Xavi, stanpou into 2008, o l\u2019\u00e8
  sciotio pe i carateri de a SES de San P\u00ea d\u2019\u00c6nn-a, e pe man de \u2018na
  figgetta de disett\u2019anni, o segondo volumme de avent\u00fbe into spa\u00e7io
  galatico. Con fervida fantaxia, se incroxa scitoa\u00e7ion inpreveddibili, boin
  sentimenti mescci\u00e6 a-i grammi, mondi n\u00eauvi e diversci, tutto capa\u00e7e
  de tegn\u00ee adescia l\u2019aten\u00e7ion fin a-a finne do libbro\\nALLEGATO 33
  - A volo di gabbiano, storia e amore tra Genova e Palermo, Oriati Mirco, Rizuto
  Rossana S.E.S. Societ\u00e0 Editrice Sampierdarenese, 2010, p. 160.\\n\u2019Na c\u00f3bia
  de inamo\u00e6, o m\u00e0sccio zen\u00e9ize e a f\u00ecggia de Pal\u00e8rmo, into
  parl\u00e2se e into scrov\u00ee e seu \u00e7it\u00e6 d\u00f4ve s\u00f3n nasci\u00fbi,
  s\u2019ac\u00f2rzan di prof\u00f3ndi lig\u00e0mmi che un\u00ecscian a st\u00f6ia
  e a v\u00ectta di do\u00ee capol\u00eaughi.\\nA c\u00f6sa \u00f2rigin\u00e2le do
  libbro a l\u2019\u00e9 qu\u00e9lla d\u2019av\u00e9i introd\u00fbto \u2013 a-o prin\u00e7\u00ecpio
  de \u00f2gni cap\u00ectolo \u2013 \u2019na d\u00f4ce nara\u00e7i\u00f3n da pr\u00f2pia
  scov\u00e8rta de c\u00f3bia, sego\u00eea da-a constata\u00e7i\u00f3n st\u00f2rica
  de \u2019n inc\u00f3ntro za visci\u00fbo tra e d\u00f4e \u00e7it\u00e6, no s\u00f4lo
  pe-i ant\u00eeghi tr\u00e0feghi mercant\u00eeli ma \u00e0nche perch\u00e9 i \u00e7itad\u00ecn
  che se s\u00f3n frasfer\u00eei da \u2019n p\u00f2sto a l\u2019\u00e2tro se v\u00eauan
  b\u00e9n. S\u2019intr\u00e9ssa cosc\u00ec a st\u00f6ia di do\u00ee gal\u00e0nti
  con qu\u00e9lla de d\u00f4e \u00e7it\u00e6 e di seu monum\u00e9nti. Sta scov\u00e8rta
  chi a stupi\u00e2 asc\u00ec i zen\u00e9ixi, che no son abito\u00e6 a l\u00eaze a
  pr\u00f2pia st\u00f6ia cont\u00e2 da \u2019n \u00e2tro p\u00f3nto de v\u00ecsta.\\nALLEGATO
  34 - Mussolini e la sua Liguria, Marco Massa DeFerrari ed., 2009, p. 123\\nO l\u00ecbbro
  o c\u00f3nta a cr\u00f2naca de d\u00f4e v\u00ecxite do ditat\u00f4 in Lig\u00f9ria
  e di rap\u00f2rti ch\u2019o l\u2019\u00e0 tegn\u00fbo co-a n\u00f2stra t\u00e6ra.
  Dr\u00e9nto se gh\u2019atr\u00eauva \u2019na Z\u00eana d\u2019\u00e2tri t\u00e9npi
  tra sper\u00e0nse, \u00f2pere p\u00f9bliche e sc\u00e9ne do reg\u00ecmme. E se gh\u2019atr\u00eauva
  a n\u00f2stra Ascoci\u00e7i\u00f3n asc\u00ec. Za sav\u00e9imo, da-i docum\u00e9nti
  che gh\u2019\u00e9mmo i n S\u00eade, che d\u00f2ppo p\u00f6chi \u00e0nni da-a n\u00e0scita,
  i s\u00f2cci da Compagna \u00eaan ci\u00f9 de trentam\u00eclla. L\u2019\u00e9 ci\u00e6o
  che i t\u00e9npi c\u00e0ngian: l\u2019ingonbr\u00e0nte pres\u00e9nsa de R\u00f3mma
  (e di rom\u00e2ni), l\u2019imigra\u00e7i\u00f3n do d\u00f2ppo go\u00e6ra e a st\u00f6ia
  ci\u00f9 recente \u00e0n \u00e6go\u00f2u l\u2019am\u00f4 e l\u2019inter\u00e9sse
  pe Z\u00eana e-e seu tradi\u00e7io\u00ecn. Ma, c\u00f3mm\u2019o scr\u00eeve o Prescid\u00e9nte
  un pr\u00ecmma p\u00e0gina, chi cons\u00e8rva qu\u00e9sto sentim\u00e9nto ant\u00eego,
  no d\u00eave mol\u00e2, ma o se d\u00eave d\u00e2 da f\u00e2 pe f\u00e2 torn\u00e2
  a Lig\u00f9ria a l\u2019\u00f6n\u00f4 do m\u00f3ndo.\\nALLEGATO 35 - Mirette Tanska
  Cambiaso, A.Di Raimondo ed. Erga, 2010, pag. 64\\nA l\u2019\u00e8 \u2018na st\u00f6ia
  ci\u00f9 v\u00eaa de-a fantax\u00eea, scoverta da-o nostro soccio \u00e7ercando
  inti archivi. O zeneize marcheize Lo\u00eegi Cambiaso, o sp\u00f4za a-a finn-e do
  1800 a zovenixima baronessa de origini polacche; a-a porta inta rexidensa de Gavi
  e o l\u2019avi\u00e2 trei figgi. Ma o fut\u00fbro o l\u2019\u00e8 fosco pe tutti:
  a zovena a l\u2019intra gradatamente inte \u2018na fase de instabilit\u00e6 mentale,
  con esprescioin artistiche pregevoli ma \u2018n conportamento non conforme a-a dignit\u00e6
  de-a nobile famiglia.\\nNe cosegoi\u00e2 pe l\u00ea e \u2018n-a figgia, un recovio
  coatto into l\u2019uspi\u00e2 de Quarto, quando al\u00f4a no l\u2019aveiva fun\u00e7ioin
  de c\u00fbra ma solo de alontanamento so\u00e7iale.\\nTutto o l\u2019\u00e8 descr\u00eeto
  con sobria documenta\u00e7ion asc\u00ec fotografica, obiettiva parte\u00e7ipa\u00e7ion
  emotiva, fluidit\u00e6 narativa sensa orpelli. O se l\u00eaze d\u2019un sciou pe
  cerc\u00e2 e modalit\u00e6 de-a prevista d\u00f4sa concluxon.\\nALLEGATO 36 - Il
  patrimonio artistico di Banca Carige, sculture, ceramiche, stampe, arredi, salvadanai;
  G.RotondiTerminiello e Coll.; 2009 Silvana ed.; pag. 384.\\nPonderoso vol\u00f9mme
  che o conpl\u00eata quello de l\u2019anno passou che o l\u2019aveiva catalogou dip\u00ecnti
  e disegni (tra i qu\u00e6 asc\u00ec quelli de-a nostra Elena Pongiglione). Molto
  cur\u00f2u inta grafica, stanpa, foto, o l\u2019\u00e8 conpletou da \u2019na minuziosa
  descri\u00e7ion e cataloga\u00e7ion de-e \u00f2pere d\u2019\u00e0rte che fan parte
  de-a cole\u00e7ion in pos\u00e8sso do Ente. Alegh\u00e6 asc\u00ec a biografia di
  artisti, o glossaio e indici.\\nArich\u00ee continoamente questa cole\u00e7ion,
  acatando neuve \u00f2pere prod\u00fbte in ogni setou de-a creativit\u00e6 umann-a,
  e rese reperibili into merc\u00f2u antiqu\u00e2io, o fa parte de \u2018na specifica
  politica mi\u00e2 a conserv\u00e2 e impresios\u00ee a defini\u00e7ion de Zena, \u00e7it\u00e6
  de-a cult\u00fba.\\nALLEGATO 37 - Partigiano a Triora, Maria Rosa Acri, (romanzo
  per ragazzi), De Ferrari ed., 2009, pag. 96.\\n\u201cPe figeu\u201d; se preciza,
  perch\u00e9 l\u2019eroe o l\u2019\u00e8 un bagarillo de d\u00f4zze anni, che o \u2018sente\u2019
  de dovei an\u00e2 a f\u00e2 parte de-a Resistenza. O sc\u00e0pa da-o col\u00e8gio
  e da-a \u00e7it\u00e6 e sale i sent\u00ea verso Tri\u00eaua, asunando o conzon\u00eanto
  avent\u00fboso con i partigen. E brut\u00fbe de \u2018na go\u00e6ra spi\u00eat\u00e6ta
  inte l\u2019 anno 1944, non adata a\u2019n figeu, modifican e ridimensinan i seu
  progeti. Unn-a avent\u00fba fin\u00eca con \u2018na reti\u00e2ta. Ma o l\u2019\u00e8
  o spirito ch\u2019o o conta, e che sai\u00e2 de giustifica\u00e7ion sensa rinpianti
  o seu retorno in col\u00e8gio.\\nQuarche pagina a-a finne, dedic\u00e2 a \u2018schede
  de aprofondimento\u2019 di t\u00e8mmi descr\u00eeti into raconto, permettan de megio
  cap\u00ee a situa\u00e7ion ch\u2019a fa da scena a l\u2019avent\u00fba do figeu.\\nALLEGATO
  38 - CD, intitol\u00f4 \u201cBatte in Val Polcevera un cuore per l\u2019Africa\u201d
  contenente 22 canzoin, I \u201cZoeni\u201d de ACompagna, goid\u00e6 da F.Noceti
  e GB Montaldo,\\nMolte xeneixi, de montagna, spirituals, trei de opera classica
  e asc\u00ec \u201c Ma se ghe p\u00e9nso\u201d interpretou da Feipin, a l\u2019\u201dAve
  Maria zeneize\u201d cant\u00e2 da-o \u201cPiccolo coro Monte Bianco\u201d; \u201cM\u00e2
  de Zena\u201d d\u00ee Giovani Canterini di Sant\u2019Olcese ; a Traviata do coro
  Cycnus, ... ). O guagno o l\u2019ani\u00e2 in beneficenza, pe e mixioin da Repubblica
  Centro Africana. In copertinn-a, troneggia o nostro logo e a scr\u00eeta \u201ca
  cura dell\u2019Associazione A Compagna - sezione Liscet\u201d.\\nALLEGATO 39 - Giuseppe
  Marzari un uomo in frac, Cesare Viazzi, ed. De Ferrari, 2010, pag. 88, con CD\\nInta
  stoiografia d\u00ee grendi comici xeneixi (Dapporto, Villaggio, a Baistrocchi, pe
  \u00e7it\u00e0ne trei de \u00e7ento; con o so \u2018scio Ratella\u2019 o l\u2019\u00e8
  st\u00e6to defin\u00eeo o po\u00e6 do Gabibbo), o Marzari o p\u00e2 o meno apariscente
  e quindi coloc\u00f2u solo doppo Govi; foscia perch\u00e9 a sei vitta artistica,
  \u00e2tret\u00e0nto ricca e spontanea, a l\u2019\u00e0 trovou inti urtimi tempi
  magi\u00f4 frequenta\u00e7ion a-a radio e a-a discofrafia, ci\u00f9 che into palcoscenico
  o a-a TV.\\nA nostra asocia\u00e7ion A Compagna a l\u2019\u00e0 istitu\u00eeo un
  annoale premio a-o so nomme pe i artisti; asc\u00ec quest\u2019anno esso o veni\u00e2
  consegnou a-o vin\u00e7it\u00f2u into proximo meise de giugno into ti\u00e2tro da
  Zovent\u00fb; e o nostro Prescidente o l\u2019\u00e0 arich\u00eeo o volumme che
  recensemmo, analisando o so parl\u00e2, defin\u00eco \u2013 e o ne spiega o perch\u00e9
  \u2013 mod\u00e9llo pe chi o dexidera parl\u00e2 o v\u00eao zeneize.\\nSe l\u00eaze
  int\u2019un lampo, ma poi bezeugna st\u00e2 a sent\u00ee ben o CD; e pe chi o veu,
  studi\u00e2lo scciupando da-o r\u00eee.\\nALLEGATO 40 - Finollo dal 1899, Giovanni
  Meriana, ed. De Ferrari, 2009, pag. 84\\nSon vegn\u00fbi a descrive o personaggio,
  a seu arte e o so neg\u00f2\u00e7io, atirando l\u2019aten\u00e7ion e viva coixit\u00e6
  de t\u00f9tti i presenti a-un \u2018Martedi de A Compagna\u2019 a-o Ducale, gest\u00eeo
  da-a nostra ecletica console Marcella Rossi Patrone. Chi o l\u2019\u00e8 st\u00e6to
  Mano\u00e6lo Finollo, stilista, artigian do bello vest\u00ee e dell\u2019eleg\u00e0nsa
  into campo de st\u00f2ffe, cam\u00eexe e crov\u00e2te, a Zena e feua, o san tutti
  quelli che \u00e0n am\u00f4 de vestise ben.\\nALLEGATO 41 - Partigiani una storia
  di uomini, Sandro Antonini, De Ferrari Ed., 2010, pag.554\\nL\u2019aotorevolezza
  de l\u2019Antonini suvia l\u2019argomento Rexist\u00e9nsa, pur non avendola vix\u00fba
  personalmente, ma studi\u00e2, aprofond\u00eea e analiz\u00e2 a trav\u00e8rso ri\u00e7\u00e8rche,
  docum\u00e9nti, interviste, a l\u2019\u00e8 st\u00e6ta premi\u00e2 da-o \u2018Gruppo
  ricerche civilt\u00e0 ligure\u2019 co-o \u2018premio von Palazzolo\u2019; e \u00f2ua
  a se arichisce con questa neuva publica\u00e7ion.\\nQuesto o l\u2019\u00e8 un v\u00eao
  libbro de stoia, into qu\u00e6 vegnan descr\u00eeti inte\u2019n setou a St\u00f6ia
  de a Rexistensa \u2013 con e premesse, i difi\u00e7ili ini\u00e7i, i primi reparti,
  a giusti\u00e7ia partigianna, a division Garibaldi; inte \u2018n atro e Imagini;
  a-a fin a Mem\u00f6ia con sei raconti de \u2018personaggi\u2019 ezenplari.\\nALLEGATO
  42 - Penscei... parolle (pensieri... parole), Vincenzo Bolia, Montedit ed. 2010,
  pag.152\\nQuesto libbro de poexie, a-a so segonda edi\u00e7ion, quarched\u00f9nn-a
  scr\u00eeta in italian con a fronte a let\u00fba in zeneize-albenganese; quarched\u00f9nn-a
  in ingleise, \u00e2tre in \u201czeneize de zena o veo in graf\u00eea ofi\u00e7i\u00e2.
  Dedich\u00e6 a-i so pensc\u00eai; a de pregh\u00eae molto senplici, de cheu; e molte
  a-a-Liguria.\\nALLEGATO 43 - Svelati i segreti di Cristoforo Colombo, AMSalone e
  ACalcagno, ed. Brigati, 2009, pag. 384\\nTramezo a-i milioin de libbri che parlan
  de Crist\u00f2ffa Colombo, se pensava co-o Taviani d\u2019avei razonto \u2019n ponto
  d\u2019arivo decizivo: Colombo o l\u2019ea nasciuo de Zena, in barba a tutti-i atri
  Stati che pretendeivan ch\u2019o fise nasciuo da liatri.\\nE invece... Oua a Salon
  e o Calcagno metan e c\u00f6se in ci\u00e6o (p\u00f2-u momento... perch\u00e9 do
  doman no gh\u2019\u00e9 seguessa): mentre ean apreuvo a \u2019na ri\u00e7erca pe
  riabilit\u00e2 a figua de Benardo Colombo de Cogheuo e aspirante a l\u2019eredit\u00e6
  do Crist\u00f2ffa, to-u li che da-i archivi de Spagna, de Zena e de Cogh\u00eauo
  l\u2019\u00e9 s\u00e2t\u00f2u feua numeroxi documenti coevi, da-i qu\u00e6 \u00e0n
  acapio ch\u00f2-u Colombo, o navigat\u00f4, o l\u2019ea nasciuo into borgo main\u00e2
  da Rivea de Ponente. Senpre zeneize, s\u2019acapisce, perch\u00e9 \u2018Cugureo\u2019
  o fava parte do Dominio da Republica; per\u00f2 no da \u00e7it\u00e6 de Zena.\\nI
  do\u00ee aoto\u00ee metan anche in ci\u00e6o che de Crisf\u00f2ffa Colombo ghe n\u2019ea
  ci\u00f9 d\u2019un, con poca diferensa d\u2019et\u00e6. Sta cosa chi a l\u2019aiva
  creou tra i ri\u00e7ercato\u00ee \u2019na bella confuxon: s\u2019ea dito c\u00f6se
  inbarassanti e s\u2019ea ariv\u00f2u anche a f\u00e2se concluxoin.\\nNoiatri, che
  semmo let\u00f4i apascion\u00e6, ma no storichi de profescion, da \u2019na parte
  sta notissia ne p\u00e2 ch\u2019a scceuppe comme \u2018na \u201cbomba\u201d, da
  l\u2019\u00e2tra pensemmo che segge megio \u201cpigi\u00e2 in p\u00f6 de tenpo\u201d.
  Ma questo o no n\u2019\u00e9 inpedisce de d\u00ee che, comme socci da Compagna,
  \u2019na seguessa ghe l\u2019emmo: a Salon a l\u2019\u00e9 a-o de d\u2019ato de
  ogni sosp\u00e8tto d\u2019avei vosciuo f\u00e2 \u2019n \u2018scoop\u2019 \u00f2,
  pezo, de diciara\u00e7ioin a-a bisc\u00f6chinn-a che no segian prov\u00e6 da documenti
  scriti.\\nPe questo niatri pigemmo pe bon quello che i do\u00ee studioxi \u00e0n
  scrito, in ateiza che a comunit\u00e6 scentifica e o Comun de Zena digan a seu.
  F\u00e6to sta che doppo quarche meize da-a publica\u00e7ion do libbro tutto taxe:
  o l\u2019\u00e9 \u2019n moddo de d\u00ee che gh\u2019\u00e0n raxon?\\nPe concludde
  n\u2019\u00e9 cao sotolini\u00e2 o preggio de l\u2019opera che, oltre a \u2019n\u2019anpia
  apendice de documenti regest\u00e6 e trascriti, a n\u2019\u00f6fre \u2019na nutria
  bibliografia e \u2019n c\u00f2modo indice analitico; o libbro o gh\u2019\u00e0 \u2019na
  bella veste tipografica, o l\u2019\u00e9 stanp\u00f2u in sce do pap\u00ea de preggio,
  con carateri ci\u00e6i e splendide t\u00f6e.\\nALLEGATO 44 - Pegi, nomen a fontibus,
  A.VV. del Centro Universitario del Ponente, ed. Erga, 2010, pag. 242\\nQuande se
  veu inandi\u00e2 \u2019n libbro pe proponn-e a-i leto\u00ee \u2019n\u2019opera conpleta,
  ch\u2019a l\u2019afronte \u2019n argomento in t\u00fbtta a seu complescit\u00e6,
  ma ch\u2019a segge asc\u00ec de gradevole let\u00fba, se pensa a \u2019n libbro
  p\u00e6gio a quello stanp\u00f2u da-a ERGA dove, in sce de belle pagine patin\u00e6
  tramezo a-e qu\u00e6 gh\u2019\u00e9 misso de belle figue asc\u00ec, se gh\u2019atreuva
  \u2019na aprofondia testimoniansa de gexe de P\u00eagi, da-a seu origine a-a giorn\u00e2
  d\u2019ancheu, con ben ben di riferimenti a-a st\u00f6ia de l\u2019ilustre borgo.\\nConplimenti
  aloa a-o Centro Universitaio do Ponente e a t\u00fbtta a seu reda\u00e7ion pe-o
  feli\u00e7e exito de l\u2019opera; chi veu ben a Zena no peu no avei inta seu biblioteca
  un libbro comme sto chi ch\u2019o testim\u00f2nia, tra e atre c\u00f6se, comme i
  zeneixi sentivan cosc\u00ec f\u00f2rte o senso do bello inte l\u2019arte che gh\u2019ea
  cao mostralo inte tutti i p\u00f2sti da Liguria, anche inte quelli che aloa ean
  borghi.\\nALLEGATO 45 - L\u2019artigianato in Liguria, ieri e oggi, Maurizio Lamponi,
  ed. ERGA, 2011, pagg. 312\\nEnexima corpoza fadiga do n\u00f2stro s\u00f2ccio (\u00f2ltre
  sciuscianta publica\u00e7ioin) e anche questa de grande interesse e de ci\u00f9
  anpio resp\u00eeo perch\u00e9 a conta e a spiega \u2013 d\u00f2ppo rigoroza ri\u00e7erca
  \u2013 quello ch\u2019o l\u2019\u00e9 un tesci\u00fbo baze da so\u00e7i\u00eat\u00e6
  ligure: l\u2019artigianato; saiva a d\u00ee o travaggio do singolo \u00e7itadin
  che o d\u00e0 lustro, o qualifica e o rende produtiva tutta a region. Def\u00e6ti
  vegne descr\u00eeto a vitta e l\u2019inpreiza de tanti liguri, e seu reixe, i costummi,
  e uzanse, e tradi\u00e7ioin, e pascioin che qualifican o seu travaggio comme unico
  a-o mondo. Se n\u00f2tta \u2013 co-in p\u00f6 de dizaponto pe Zena \u00e7it\u00e6
  \u2013 che i liguri artigian son ci\u00f9 tenacemente rexistenti inti centri ci\u00f9
  picin da region; f\u00f2scia perch\u00e9 la a vitta a score ci\u00f9 a mez\u00fba
  d\u2019ommo, \u00f2 f\u00f2scia perch\u00e9 e grendi \u00e7it\u00e6 se dan prevalentemente
  a l\u2019industria e a-o seu g\u00eeo d\u2019afari. De longo da elogi\u00e2 a qualit\u00e6
  da stanpa de l\u2019Edit\u00f4, atento a sodisf\u00e2 e antighe ezigense de l\u2019estetica
  e da sensibilit\u00e6 editoriale con quelle moderne do risparmio pe poei ariv\u00e2
  a \u2019n pr\u00eaxo finale conveniente.\\nALLEGATO 46 - \u201c...Italia chiam\u00f2\u201d,
  Maria Teresa Caprile e Francesco De Nicola, De Ferrari ed., 2010, pagg. 240\\nDa-o
  verso do Mameli, a parte \u2019na carel\u00e2 de raconti \u2013 da-i primmi m\u00f6ti
  a-o neuvo mil\u00e9nio \u2013 de tanti aoto\u00ee, pasando a traverso l\u2019Unit\u00e6,
  doe go\u00e6re mondiali co-o vint\u00e9nio into m\u00eazo, fin a-o \u201cboom\u201d
  e a soci\u00eat\u00e6 di consummi. Qu\u00e6xi \u2019n \u00e7enten\u00e2 tra po\u00eati,
  narato\u00ee, aotobi\u00f2grafi, sagiamente altern\u00e6, rendan agevole e scorevole
  a let\u00fba de quarche brano pe v\u00f2tta, pe avei, cian cianin, \u2019na panoramica
  de \u00e7ento\u00e7inquant\u2019anni de st\u00f6ia italiann-a.\\nALLEGATO 47 - Le
  ardesie della Liguria, dalla geologia all\u2019arte, Remo Terranova, Erga ed., 2010,
  pag. 224\\nPresent\u00f2u inta solita elegante veste grafica, l\u2019urtimo travaggio
  do profes\u00f4 Terranova ch\u2019o l\u2019\u00e9 \u2013 comm\u2019o n\u2019\u00e0
  cont\u00f2u a \u2019n Marted\u00ec in Compagna a Paxo, dov\u2019o l\u2019\u00e9
  st\u00e6to ben ben aplaud\u00eeo \u2013 particolarmente afe\u00e7ion\u00f2u a ste
  pr\u00eee, da quande comme ge\u00f2logo o l\u2019\u00e0 frequent\u00f2u e n\u00f2stre
  montagne pe studi\u00e2 e r\u00f2cce e i miner\u00e2li. O libbro o ne conta tutta
  a sto\u00efa da ci\u00e0ppa: da-i rilievi tecnici a-i primmi utilizzi preromani;
  da-i d\u00e6ti statistici a quelli sugestivi do trasp\u00f2rto a valle; da-e moderne
  industrie pe l\u2019estra\u00e7ion a l\u2019utilizzo pratico e artistico, finn-a
  a-a v\u00eaa scult\u00fba. Un libbro pe studioxi, visti i aprofond\u00eei d\u00e6ti
  tecnici geol\u00f2gico-minerari; ma asc\u00ec pe-i escursionisti de valadde liguri;
  pe-i cotrut\u00f4i consider\u00f2u a grande posciblit\u00e6 de utilizzo; pe-i apascion\u00e6
  de antropologia che peuan analiz\u00e2 o risv\u00f2lto sociale (giamin, reizeghi
  e mout\u00eee); e, a-a fin, comme dito za into titolo, pe-i artisti.\\nALLEGATO
  48 - Storia di Genova, Enzo Marciante, ed. Coedit 2010, pag. 224\\nA-o sci\u00f4
  Marciante perdonemmo d\u2019avei \u2019ncomens\u00f2u o libbro parlando de \u201cl\u2019erto
  Mediteranio\u201d qu\u00e6xi ascordandose che o n\u00f2stro o s\u2019\u00e9 da senpre
  ciam\u00f2u \u201cMare Ligure\u201d. Ma sto pec\u00f2u chi gh\u00f2-u perdonemmo
  perch\u00e9 o l\u2019\u00e9 veniale, e sorviatutto perch\u00e9 l\u00e9 o l\u2019\u00e9
  tr\u00f2ppo bravo e perch\u00e9 i seu disegni son ... no tr\u00f2ppo b\u00e8lli,
  ma beliscimi: precizi, cur\u00e6 inti particolari, con ilustra\u00e7ioin spiritoze
  e ir\u00f2niche tipiche do zeneize: bat\u00fba fresca e sccetta, mai f\u00eaua de
  mez\u00fba. A sto\u00efa de Zena a l\u2019\u00e9 cont\u00e2 co-e vignette tipiche
  di f\u00f9metti; sti chi \u2013 a \u2019na primma eugi\u00e2 e perch\u00e9 atenti
  a leze o t\u00e8sto \u2013 p\u00e0n \u2019na senplice e piaxevole raprezenta\u00e7ion
  da realt\u00e6; ma se un o l\u2019amia ci\u00f9 da-a vixin (personalmente, quande
  gh\u2019\u00f2 avuo bizeugno de rilas\u00e2me, o prov\u00f2u a color\u00e2li co-i
  penarelli: aloa un o s\u2019ac\u00f2rze che son de \u2019na precixon m\u00e2vegioza):
  e esprescioin de facce, i costummi, i anbienti, e creuze, i archeb\u00fbxi, e scene
  panoramiche... pe \u00f2gni c\u00f6sa se intoisce un-o studio tut\u2019\u00e2tro
  che fa\u00e7ile da imagin\u00e2 e da realiz\u00e2. Cosc\u00ec l\u2019asedio da Lanterna,
  a Mel\u00f6ia, i Fieschi, o Barbarossa, e tanti \u00e2tri epiz\u00f2ddi, cont\u00e6
  da-o n\u00f2nno Arturin e da-o porpo, son o megio m\u00f2ddo pe avixin\u00e2 i figeu
  e i n\u00eavi a-a n\u00f2stra st\u00f6ia; magara lezendo insemme a loiatri de m\u00f2ddo
  che \u2013 apenn-a lascian o libbro pe n\u2019\u00e2tro zeugo \u2013 no ne p\u00e2
  veo de po\u00e9iselo g\u00f6d\u00ee in santa paxe e con grande sodisfa\u00e7ion
  de l\u2019anima. \u2019Na main\u00eaa moderna pe senti l\u2019orgheuggio d\u2019\u00ease
  zeneixi. Se inta vostra libraia manca o libbro do Marciante, aloa ve manca a fantaxia
  da sto\u00efa de Zena.\\nALLEGATO 49 - L\u2019acquedotto storico di Genova, Luciano
  Rosselli, ed. Nuova Editrice Genovese, 2009, pagg. 256.\\nArich\u00eeo de trexentosciusciantun
  belle e nitide fotografie e de \u2019na cronologia ch\u2019a l\u2019incomensa da
  l\u2019anno 1071 pe ariv\u00e2 a-o 2009, se peu leze a descri\u00e7ion e a st\u00f6ia
  do cond\u00fbto do rifornimento idrico do levante da \u00e7it\u00e6: l\u2019inzegno
  e brav\u00fba tecnica che, ancon a-i n\u00f2stri tempi, a r\u00eaze i sconvolgimenti
  da moderna espanscion da \u00e7it\u00e6.\\nALLEGATO 50 - L\u2019insurrezione genovese
  del 1849, il generale La Marmora bombarda e saccheggia la citt\u00e0, Franco Bampi
  e Gilberto Oneto, il Cerchio, 2010, pag. 134.\\nA covertinn-a a l\u2019inganna:
  l\u2019ir\u00f2nica caregat\u00fba do generale La Marmora co-e man e diviza insangoin\u00e6
  a fa pens\u00e2 a \u2019n libbro satirico \u00f2 macabro. A lezilo, invece, un o
  s\u2019ac\u00f2rze ch\u2019o l\u2019\u00e9 \u2019na seria dizamina \u2013 asci\u00ec
  cronol\u00f2gica - di f\u00e6ti ch\u2019\u00e0n asmort\u00f2u into sangoe l\u2019insure\u00e7ion
  di Zeneixi contra i Savoia. In discuscion no gh\u2019\u00e9 solo o metodo da brutale
  represcion, za grave e vergognozo, quante ciut\u00f2sto, ancon ci\u00f9 gr\u00e2ve,
  l\u2019avei tax\u00fbo, anzi ignor\u00f2u do tutto finnn-a a can\u00e7el\u00e2 e
  a elimin\u00e2 da i libbri de sto\u00efa un pesante epizodio d\u2019un popolo, comme
  se mai o fose avegnuo. O no l\u2019\u00e9 do revizionismo f\u00e6to tanto pe f\u00e2lo,
  ma a l\u2019\u00e9 \u2019n\u2019ezigensa da cult\u00fba moderna, democratica, ch\u2019a
  no consente ci\u00f9 \u2019na vixon unilaterale, tipica di regni totalitari e de
  ditat\u00fbe, ma a pretende che segge descr\u00eeta a veit\u00e6, con tutti i seu
  risvolti.\\nALLEGATO 51 - A Compagna, O pescafigeu, ed. S.E.S., 2010, pag.128\\nProm\u00f2ssa
  da A Compagna e finan\u00e7i\u00e2 da-a Region Liguia, questo libbro o conpleta
  o prog\u00e8tto pil\u00f6ta pe mostr\u00e2 o zeneize inte scheue elementari \u2013
  e niatri speremmo che a c\u00f6sa a no finisce chi. A-a fin da f\u00f6a i libbri
  consegn\u00e6 a-e dire\u00e7ioin did\u00e0tiche de sch\u00eaue elementari, pe d\u00e2li
  a-i meistri e quindi a tutte e classe (ci\u00f9 \u00f2 meno 1200 into Comun de Zena),
  son ben s\u00eai: e chi o l\u2019\u00e0 acet\u00f2u de f\u00e2 a sperimenta\u00e7ion
  o gh\u2019avi\u00e2, pe-a classe, in p\u00f6 de c\u00f2pie in ci\u00f9. O Pescafigeu
  o n\u00e0sce da \u2019n travaggio de volontariato \u2013 a benefi\u00e7io da n\u00f2stra
  Asocia\u00e7ion \u2013 ch\u2019o vedde, pe primma c\u00f6sa, i inconparabili disegni
  da n\u00f2stra vice prescidente Elena Pongiglione, che fan da coredo a-i scr\u00eeti
  di n\u00f2stri s\u00f2cci: \u00f2gnun de liatri o l\u2019\u00e0 port\u00f2u o seu
  contrib\u00fbto con de f\u00f6e, di raconti, de noti\u00e7ie st\u00f2riche, a descri\u00e7ion
  de n\u00f2stre tradi\u00e7ioin, e biografie de zeneixi il\u00fbstri. Tutto queste
  c\u00f6se chi son scrite in forma senplice pe figeu e deuviando a graf\u00eea ofi\u00e7i\u00e2.\\nALLEGATO
  52 - Loenso e Lucia i sposo\u00e9i impromissi, Nino Durante, ed. Nuova Editrice
  Genovese, 2009, formato 17x24, illustr. originali di Gonin, pagg.176. In rimma zeneize
  a n\u00f6ta vicenda a l\u2019\u00e9 trasport\u00e2 in c\u00e2za nostra, zugando
  asc\u00ec suvia de asocia\u00e7ioin f\u00f2niche (tipo Como-Zena, Lecco \u2013 Recco);
  cosc\u00ec o libbro o l\u2019incomensa parafrasando i famoxi versci \u201cQuello
  rammo do golfo de Zena / ch\u2019o l\u2019amia a mezogiorno, tra P\u00f2rtofin e
  a Lanterna, ...\u201d. Gh\u2019en tutti: o Loenso e a Lu\u00e7ia, o curatto don
  Cl\u00f2udio e l\u2019Agneize, o Niggio e l\u2019Inomin\u00f2u; ciassa Banchi e
  via Pr\u00e8 ... Gustoxiscima let\u00fba de \u2019na st\u00f6ia antiga trasform\u00e2
  in neuva, perch\u00e9 trasport\u00e2 a Zena e scrita co-a gra\u00e7ia de versci
  scorevoli e in bella rimma. Nino Durante, fervidiscimo poeta, cantaot\u00f4, scrit\u00f4
  zeneize, do 2001 o l\u2019\u00e9 st\u00e6to insign\u00eeo do n\u00f2stro \u201cPremio
  Marzari\u201d.\\nALLEGATO 53 - Mura e fortificazioni di Genova, Riccardo Dellepiane,
  ed. Nuova Editrice Genovese, 2008, pagg. 318\\nSegonda edi\u00e7ion de \u2019n\u2019opera
  fondamentale \u2013 pe-a precixon de fonti st\u00f2riche, tante ilustra\u00e7ioin,
  \u2019na ricca apendice \u2013 pe conosce e n\u00f2stre fortifica\u00e7ioin che,
  comme a st\u00f6ia da Republica de Zena a l\u2019insegna, no servivan pe agred\u00ee
  i \u00e2tri ma pe difendise contra i tanti nemixi, con scistemi da tegn\u00ee agiorn\u00e6
  de v\u00f2tta in v\u00f2tta. P\u00f6i, con l\u2019inven\u00e7ion de neuve armi \u2013
  sempre ci\u00f9 distr\u00fbtive \u2013 l\u2019\u00e9 vegnuo inutile tegn\u00eele
  in deuvia; e quello o l\u2019ea o tenpo che a Repubblica \u2013 da poco \u2013 a
  no gh\u2019ea ci\u00f9. Ma liatre gh\u2019en de longo, e coninuan a atravers\u00e2
  a \u00e7it\u00e6 armeno finn-a a che o spa\u00e7io o no serve pe quarc\u00f6s\u2019atro,
  mentre i f\u00f2rti lasci\u00f9 \u2019n \u00e7imma di monti, son abandon\u00e6 a
  l\u2019incuria e a l\u2019ignoransa de tanti.\\nALLEGATO 54 - Gabriele D\u2019Annunzio
  il \u201cgenovese\u201d, Anita Ginella Capini, De Ferrari ed. 2010, pag.144\\nO
  D\u2019Annunzio, se sa, o l\u2019\u00eaa \u2019n inprevedibile e poliedrico personaggio,
  \u201c\u2019n ommo no com\u00fbne, da-e mille facce e maschere\u201d; personalit\u00e6
  difi\u00e7ile da defin\u00ee e da descrive, anche a posteriori e sorviatutto in
  scintexi. Da-o libbro sci\u00f2rte feua \u2019na rela\u00e7ion poeta-Zena che a
  va a-o de la di eventi conosciui \u2013 tipo \u2018e giorn\u00e6 de Quarto\u2019
  \u2013 o de quelli meno conosciui e privatiscimi, ma p\u00f6co scignorilmente divulgh\u00e6
  (acus\u00f2u in Parlamento d\u2019avei lasci\u00f2u da pag\u00e2 o conto inte l\u2019albergo
  dove o l\u2019aveiva sogiorn\u00f2u ... in compagnia de doe \u2018gentildonne\u2019
  no qualifich\u00e6). Framezo a anedoti e riferimenti varri, trovemmo asc\u00ec di
  ritr\u00e6ti de nostri personaggi inportanti che \u201cs\u2019insinoan\u201d in
  \u00e7erti periodi salienti da vitta do poeta: Govi e Vassallo, Spensley e Baistrocchi,
  e \u00e2tri ancon. Inta senplicit\u00e6 de l\u2019edi\u00e7ion, i carateri e a stanpa
  do De Ferrari son de longo quelli, imancabilmente nitidi e precizi.\\nALLEGATO 55
  - La lunga crociata dei genovesi (1097-1110), Remo Viazzi, ed. De Ferrari 2010,
  pagg.126\\nNo l\u2019\u00e9 \u2019n c\u00e2xo, se a nascita e o sviluppo da Compagna
  Communis a coicidde con l\u2019\u00f2rganiza\u00e7ion da primma Crox\u00e2: anche
  sensa documenti scr\u00eeti, no peu no \u00easighe \u2019na corela\u00e7ion; basta
  pens\u00e2 che i zeneixi doveivan avei valut\u00f2u ben l\u2019inpegno ch\u2019o
  l\u2019avieiva conport\u00f2u a spedi\u00e7ion sensa av\u00eai a-a baze \u2019n\u2019asocia\u00e7ion
  e union de intenti e de pratica. Ommi e navi; ma suviat\u00f9tto famigge (Da Volta,
  Spinola, de Castro, ecc.) che p\u00e0gan o trasp\u00f2rto di sordatti co-a cappo
  Ghigermo Embriaco, pe avei, a-o ritorno, e \u00e7enie do Batista, l\u2019avert\u00fba
  de neuve stradde in sci\u00f4 Mediteranio; pe poei, a-a longa, go\u00e2gn\u00e2
  ben ben de palanche.\\nALLEGATO 56 - Genova tra ottocento e novecento, AA.VV., volume
  IV il Porto, Nuova Editrice Genovese 2010, pag. 256.\\nO volumme quattro, dedic\u00f2u
  a \u201co P\u00f2rto\u201d o l\u2019\u00e9 l\u2019urtimo di libbri da serie de fotografie
  de Z\u00eana e de seu delega\u00e7ioin scat\u00e6 into periodo euto\u00e7ento-neuve\u00e7ento.\\nGustoxi
  ac\u00e9nni st\u00f2richi e ben 347 foto, con panorammi e a Madonna, pala\u00e7\u00e7i
  e emigranti, distru\u00e7ioin da gu\u00e6ra e ricostru\u00e7ioin, personaggi vegi
  e neuvi, nave picinn-e e grendi transatlantici; da-o progetto de \u2019n\u2019idrov\u00eca
  verso a valle do Po a l\u2019aeroporto: \u2019na carel\u00e2 ch\u2019a testimonia
  l\u2019evolu\u00e7ion do p\u00f2rto, ma ch\u2019a l\u2019ingheugge emotivamente
  tutti quelli che, super\u00e2 \u2019na \u00e7erta et\u00e6, han visciuo de personn-a
  i vari eventi fotograf\u00e6 e sapientemente descr\u00eeti. L\u2019edi\u00e7ion
  a l\u2019\u00e9 ben cur\u00e2: carateri de stanpa nitidi e che se lezan ben, pap\u00ea
  patin\u00f2u e vegie foto in gianco e neigro.\\nALLEGATO 57 - Gh\u2019ea \u2018na
  votta... favole popolari in lingua genovese, Nino Durante, ERGA ed 2010, con CD,
  pag. 48\\nSto chi o l\u2019\u00e9 o terso libbro de f\u00f6e scr\u00efto da-o Durante
  e, comme i atri do\u00ee, o contegne tr\u00e6 f\u00f6e. Se e l\u00eazei a-i nevi
  e a-e nesette, de seguo ve dian: \u201cnonno/a, perch\u00e9 mi racconti le favole
  in genovese?\u201d E aloa voiatri rispondiei: \u201cperch\u00e9 cosc\u00ec, non
  solo te l\u00eazo \u2019na f\u00f6a, ma d\u00e6to che o zeneize o l\u2019\u00e9
  \u2019na lengoa ch\u2019a te deve intr\u00e2 into cheu, fasso in m\u00f2ddo che
  questa c\u00f2cina, \u2019na v\u00f2tta che ti ghe l\u2019\u00e6 drento, da grande
  a te rendi\u00e2 no solo orgogliozo d\u2019ese nasciuo a Z\u00eana ma anche de longo
  al\u00eagro e gioiozo perch\u00e9 sta chi a l\u2019\u00e9 muxica nostr\u00e2!\u201d\\nALLEGATO
  58 - Il paradiso dietro l\u2019angolo, san Fruttuoso di Camogli, Carla Scarsi, ERGA
  ed., con DVD, pag. 96.\\nTutti prov\u00eammo nostalgia e \u2019n cao areg\u00f2rdo
  pe-i p\u00f2sti donde semmo cresci\u00fbi, e pe-a gente co-a qu\u00e6 al\u00f4a
  \u00e9mmo spartio gi\u00f6ie e alegria, dolori e esperiense. Pe quelli ch\u2019\u00e0n
  avuo a fortunn-a de frequent\u00e2 da bagarilli a baia de P\u00f2rtof\u00ecn, o
  do\u00e7e sav\u00f4 de quelli areg\u00f2rdi o vegne ancon ci\u00f9 do\u00e7e pe-a
  belessa do scito, ancon ancheu conserv\u00f2u \u2013 gra\u00e7ie a-o FAI, Fondo
  per l\u2019ambiente italiano \u2013 comme un v\u00eao \u201cparadizo de der\u00ea
  a-o canto\u201d do promont\u00f6io.\\nPe chi, magara comme turista, o l\u2019\u00e9
  an\u00e6to a vixit\u00e2 l\u2019ant\u00eega aba\u00e7ia armeno \u2019na v\u00f2tta,
  l\u2019\u00e9 fa\u00e7ile intr\u00e2 into spirito di raconti, sciben che no son
  f\u00e6ti da seu vitta, anche pe via do dischetto ch\u2019o ne permette de rivedde
  d\u2019in caza quelli beliscimi p\u00f2sti.\\nALLEGATO 59 - Moderno Dizionario Rapido
  genovese-italiano, italiano-genovese, in graf\u00eea ofi\u00e7i\u00e2, con la pronuncia
  di tutte le parole, completo di rimario genovese. Franco Bampi, Stefano Lusito,
  Sotto l\u2019egida della A Compagna, ed. ERGA 2011, pag. 176.\\nQuesto \u201cDi\u00e7ion\u00e2io
  Rapido\u201d o l\u2019ea za st\u00e6to stanp\u00f2u do 1995, in sce ini\u00e7iativa
  do grande animat\u00f4 de l\u2019Erga: o Marcello Merli. O prescidente da Compagna
  d\u2019al\u00f4a, l\u2019indimenticabile Gi\u00f6xepin Roberto, o l\u2019aiva concesso
  o patrocinio cosc\u00ec che o l\u2019ea sciort\u00eeo sotta l\u2019egida da Compagna.\\nA
  figgia do Marcello, Roberta, a l\u2019\u00e0 atrov\u00f2u into prescidente Franco
  Bampi e into soccio Steva Lusito \u2013 un zo\u00eano pr\u00f2scimo a l\u2019ezamme
  de maturit\u00e6, esperto de zeneize \u2013 i do\u00ee colaborat\u00f6i pe ristanp\u00e2
  o libbro ancon sotta l\u2019egida da Compagna. Quarc\u00f6sa per\u00f2 l\u2019\u00e9
  cangi\u00f2u: a graf\u00eea de par\u00f2lle a l\u2019\u00e9 a graf\u00eea ofi\u00e7i\u00e2;
  gh\u2019\u00e9 in bello prof\u00ee do Carlo Piero Pessino \u2013 primmo curat\u00f4
  do \u201cDi\u00e7ion\u00e2io\u201d \u2013 scrito da-o Cesare Viazzi; e o contegn\u00fbo
  o l\u2019\u00e9 st\u00e6to anpli\u00f2u in m\u00f2ddo da rende o \u201cDi\u00e7ion\u00e2io\u201d
  e o \u201cRim\u00e2io\u201d ci\u00f9 conscistente. In concluxon o \u201cDi\u00e7ion\u00e2io\u201d,
  in volumetto de dimenscioin e prexo contegn\u00fbi, o se presta ben pe ese in riferimento
  pe tutti quelli che no veuan perde a nostra antiga parl\u00e2 zeneize.\\nALLEGATO
  60 - I love Liguria, AA.VV., ed. Erga, 2011, pag. 216.\\nIni\u00e7iando con D\u00f4saiga,
  con testo in italian e ingleise, unn-a conpleta carel\u00e2 d\u00ee paizi de l\u2019Entrot\u00e6ra
  ligure e de l\u2019Oltrez\u00f4vo, con brevi ma inportanti comunica\u00e7ioin st\u00f6iche-geografiche,
  eventi, sagre e monumenti da vedde, compresi valadde, parchi natur\u00e2li e muz\u00eai.\\nTante
  noti\u00e7ie utili, intramisse con belle fotograf\u00eee e articoli a tema, firm\u00e6
  da n\u2019portanti aot\u00f4i qu\u00e6 o da npiatri ben conosci\u00fbi R.Bixio con
  rela\u00e7ion su \u201cLiguria invisibile\u201de o R.Terranova suvia e \u201cardesie\u201d;
  V.Pronzati con t\u00fbtto e de ci\u00f9 su l\u2019\u00eauio, pesto e o vin; e A.
  De Pascale suvia o \u201cMuseo archeologico de Fin\u00e2.\\nInutile perch\u00e9
  consueta, a bella gr\u00e0fica e carta uz\u00e2 dall\u2019Edit\u00f4, sempre \u2018super\u2019,
  a-a pari qualit\u00e6 di testi.\\nALLEGATO 61 - Piccoli martiri, Francesca Di Caprio
  Francia, ed. Citt\u00e0 del Silenzio, 2011, pag. 152.\\nPo\u00e9mmo uz\u00e2 con
  vanto a parolla \u201c\u00e7ivilt\u00e6 ocidentale\u201d, anot\u00e2ndo che, se
  ancon \u00e7ento anni fa \u2013 o foscia poco de ci\u00f9 \u2013 anche in essa a
  ci\u00e2ga do sfrutamento di minori ea unn-a prassi, e oua po\u00e9mmo d\u00ee:
  anul\u00e2.\\nA l\u2019\u00e8 st\u00e6ta unna conquista lenta, favor\u00eca da numerosi
  fat\u00f4i esterni a-o temma, ma che tutti \u00e0n contribo\u00eeo a agoant\u00e2
  l\u2019exito, reso \u2018diritto\u2019 da Lezze do Stato.\\nO libbro ini\u00e7ia
  con unna fondamentale premessa: a mem\u00f6ia do pas\u00f2u pe \u2018n megio avegn\u00ee;
  e o finisce con unna breve riflescion che, oviamente, a l\u2019\u00e8 da l\u00eaze,
  perch\u00e9 o programma o l\u2019\u00e8 tutt\u2019\u00e2tro che fin\u00eeo: a ci\u00e2ga
  a l\u2019existe ancon into mondo, asc\u00ec poco lontan da noiatri. Gh\u2019\u00e8
  ancon molto da travaggi\u00e2: tutti. Lezendo o libbro se n\u2019acapisce a portata.\\nALLEGATO
  62 - Progetto Sch\u00eaue de Z\u00eana, 2010-2011, realizou con a Region Liguria.\\nEmmo
  concluso l\u2019impegno preizo con a Region e into spirito do nostro mandato, de
  spanteg\u00e2 o zeneixe inti zo\u00eani.\\nTutti i sei libbri son st\u00e6ti consegn\u00e6
  a t\u00fbtte e classi de sch\u00eaue elementari de Z\u00eana.\\nBen sciuscianta
  insegnanti se son present\u00e6 voent\u00e6i pe utilis\u00e2 \u2013 doppo un corso
  con loiatri - i libbri co-i scolari\\nA fadiga a l\u2019\u00e8 st\u00e6ta tanta,
  ma a sodisfa\u00e7ion d\u2019avei f\u00e6to unn-a grande opera\u00e7ion , degna
  de \u2018n Consolato che o fon\u00e7ionna e de grande risp\u00eatto so\u00e7iale
  e asociativo, ghe f\u00e2 proc\u00eade a testa erta pe o ben da Compagna.\\nTutti
  i aot\u00f4i e disegnat\u00f4i de tutti i opuscoli e libbri, \u00e0n travaggiou
  gratuitamente de badda, e asc\u00ec chi l\u2019\u00e0 camall\u00e6 sch\u00eaua pe
  sch\u00eaua, a unico go\u00e2gno da nostra Asocia\u00e7ion.\\nTutto quanto d\u00e6to
  a-e scheue, no l\u2019\u00e8 in vendita a-o publico; ma se e richieste sai\u00e0n
  tante, poriemo procede a \u2018na ristampa pe noiatri.\\nALLEGATO 63 - Di terra,
  di mare, Oriati Mirco, Rizzuto Rosanna, ed. S.E.S. 2011, pagg. ___\\nI d\u00fbi
  Aot\u00f4i, \u2018re\u00e7idivi\u2019 doppo avei gi\u00e0 editou un libbro intitolou
  \u201cA volo di gabbiano\u201d descr\u00eevente un paralelismo tra Zena e Palermo,
  \u00e7it\u00e6 di origine di d\u00fbi sposi, torn\u00e2n presentando un bello\\nvolumme
  con tema \u00e7entrale a g\u00eaxa da \u00c7ella de San P\u00ea d-\u00c6nn-a.\\nDe
  n\u00eauvo, son riosc\u00eei a-atrov\u00e2 \u2018na formula che a rende lat\u00ecn
  a let\u00fba asc\u00ec da sto\u00efa\\nde l\u2019edifi\u00e7io into contesto da
  sto\u00efa europea; asc\u00ec l\u2019elenco de-inumerevoli opere d\u2019\u00e0rte
  conserv\u00e6 da-e origini medievali (comme a g\u00eaxetta de s.Agostin \u2013 che
  pe i sanpedeinin gh\u2019ea za a-i tempi de Liutprando inte l\u2019anno 725 - anche
  se i afreschi e-e pr\u00eee atoali resalgan a-o XIII secolo; e comme a pr\u00eea
  con desegnou o Cristo con e spinn-e e a cr\u00f4xe, e che o l\u2019\u00e8 o santo
  patron protet\u00f4 de a \u00e7it\u00e6 de San P\u00ea d\u2019\u00c6nn-a).\\nI dui
  raconti, intress\u00e6 con unn-a nara\u00e7ion fantaxiosa de vitta visciua inte
  varie epoche, da personne sampedeinne lighe-\u00e6 l\u2019unna co l\u2019atra da
  un ben preciso ogetto che o passa di man in man finn\u2019ai tempi d\u2019ancheu.\\nALLEGATO
  64 - Il vallo ligure la linea difensiva allestita dalle forze nazifasciste... ,
  Gabriele Faggioni, ed. Ligurpress 2010, pag. 288.\\nA cavallo tra o 1943 e o 44,
  a po\u00eea de\u2019n desbarco de Ale\u00f2ui in sce coste liguri, consegoensa asc\u00ec
  do smacco de inpun\u00eei bombardamenti navali, e f\u00f2rse nazifasciste \u00e0n
  desemenou a costa con bater\u00eee de canoin, bunker, mi\u00e2ge antidesbarco arich\u00eei
  de f\u00ee spigou e metraggiatrici.\\n\u00d6ua tutte ste opere se confondan co-o
  verde di promont\u00f6i, inte isolette e art\u00fbe de riv\u00eae, specie donde
  ghe fuse unn-a spi\u00e2gia da qu\u00e6 pouei progred\u00ee e ariv\u00e2 a-i Apen\u00ecn.
  Tutto un ampio progetto specifico difensivo, pontualizou zona pe zona, renforsabile
  co\u2019n tr\u00eano armou.\\nA ri\u00e7erca dell\u2019Aot\u00f4 fogalissa tutti
  i siti de difeiza, spe\u00e7ificando a qualit\u00e6 de l\u2019armamento e-e strut\u00fbe\\nALLEGATO
  65 - AA.VV., Quaderni di Storia Locale, ed. Me.Ca.\\nO \u2018Centro Studi di Jeri\u2019,
  nasciuo e operante a Bogiasco da-o 2006, o l\u2019\u00e8 promot\u00f4re de mostre,
  de riordino di archivi e o l\u2019\u00e0 editou di libbri. Tra i qu\u00e6, ogni
  anno, con l\u2019etichetta di \u201cQuaderni\u201d, o publica numerosi travaggi
  de ri\u00e7erca archivistica e into terit\u00f6io, di qualificati studiosi, riferibili
  a-a sto\u00efa, personn-e e tradi\u00e7ioin de Bogiasco e di \u00e4tri due comuni
  vixinni S\u00f6i e Pr\u00eea Ligure.\\nTra i aot\u00f4, conpare Paolo Giacomone
  Piana, nostro soccio e redatt\u00f4 do bolletin; tra i prezentatoi l\u00eazemmo
  asc\u00ec o nomme do nostro presidente Bampi; tra i titoli di Martedi a Paxo se
  son intraten\u00fbi con \u2018na conferenza o 5 de arv\u00ee do 2011.\\nPurtroppo,
  a nostra biblioteca no possiede tutta a produ\u00e7ion editoriale de questa fertile
  asocia\u00e7ion.\\nALLEGATO 66 - Fortificazioni in Liguria dal XVIII secolo alla
  Grande Guerra, Mauro Minola, Claudio Arena, Beppe Ronco, ed. Ligurpress 2009, pag.236.\\nDoppo
  \u2018n-a breve ma precisa puntualisa\u00e7ion suvia o significato, diferense \u2013
  esempio, tra campo trin\u00e7erou e bateria coraz\u00e2, tra artiglierie montann-e
  e da costa \u2013 o travaggio de cataloga\u00e7ion e descri\u00e7ion f\u00e6gto
  da-i Aoto, cored\u00e6 da belle e limpide fotografie, mette in luce che in Liguria
  ghe son \u00e7irca quaranta forti e fortificaioin spantegh\u00e6 inti punti strategici
  da region, a sbaramengto de valli, passi e cit\u00e6; a-i qu\u00e6 ghe son da azonze
  un\u2019altra chinzenna in sci cucuzzoli di monti de Z\u00eana.\\nA-o conto, ghe
  son da azunze unn-a trentenna de baterie, alcune caserme, ridoute o bastion.\\nTanti
  forti porian ese meta de escursionisti e caminatoi di sent\u00ea de l\u2019Apenin;
  ma son punti basilari pe i studiosi de stoia locale, specie de-e localit\u00e6 de
  confinne, coinvolti into corso di eventi politici , da periodica instabilit\u00e6
  politica \u00e7entrale, da invasioin, da pi\u00f9 vaste opera\u00e7ioin militari
  de conquista con, da immagin\u00e2, suprusi, battaglie ed assedi, per evitare i
  quae e fortifica\u00e7ioin ean punto di guarnigioin e rapresentavan relativa sicurezza.\\nALLEGATO
  67 - Antartide 1975/76 storia di una spedizione geologica, alpinistica, subacquea,
  esplorativa, Terranova Remo, Erga 2011, pagg. 168\\nGrande firma quella do nostro
  soccio, in canpo scentifico e coltu\u00e2le na\u00e7ionale, che o l\u2019\u00e0
  recentemente publicou un \u00e2tro libbro, sempre spa\u00e7iando inta so qualit\u00e6
  de geologo, stavotta in sce t\u00e6re ... ov\u00eao in sci giassi dell\u2019Antartide.
  Spedi\u00e7ion f\u00e6ta tanti anni fa, ma da aregord\u00e2 petrch\u00e9 premessa
  de sucessivi sviluppi scentifici e de ri\u00e7erca.\\nEmo\u00e7ionante o capitolo
  dedicou a-i animali: tutti conosci\u00fbi into nomme, ma sempre \u2019str\u00e2ni\u2019
  pe noiatri, abitu\u00e6 ai climmi c\u00e2di: cosc\u00ec i pinguinn-i, f\u00f6che,
  ota-ie, cormorain, pro\u00e7ela\u00eee finn-a e sconosci\u00fbe, pe mi, squa.\\nLibbro
  interesante, scr\u00eeto con a saga\u00e7e capa\u00e7it\u00e6 de mescol\u00e2 i
  dati scentifici con queli narativi, da perm\u00e9tte unn-a let\u00fba scorevole
  e no pezante: cosc\u00ec a descri\u00e7ion tecnica a l\u2019\u00e8 altern\u00e2
  con a nara\u00e7ion de \u2019na deposi\u00e7ion de \u2018na Madonninn-a do duomo
  de Milan a 33 m. de profondit\u00e6 inte e acque gelide; o rili\u00eavo de ciante
  fosiliz\u00e6, o studio de vulcan, alcuni ancun attivi; e scal\u00e6 inti gias\u00ea.\\nA
  editrice Erga se vanta avei incluso o libbro inte \u2018n-a colann-a dedic\u00e2
  ai temi de-a geografia, geologia e architet\u00fba antica, tra i qu\u00e6 o libbro
  de l\u2019atro nostro soccio Armando di Raimondo con tema o fortili\u00e7io de Gavi.\\nALLEGATO
  68 - Montagni Claudio, il Battistero di san Giovanni in san Lorenzo a Genova, Colombo
  Grafiche 2011, pagg. 200\\nUnn-a inportante \u00e9quipe d\u2019esperti, a l\u2019\u00e0
  conpl\u00eat\u00f2u o restauro do Batist\u00eaio de san Gio\u00e2ne; \u00e9vento
  non solo determinante pe-o scignific\u00e2to e a qualit\u00e6 do munumento into
  contesto do nostro Duomo, ma asc\u00ec perch\u00e9 o l\u2019\u00e0 portou a-a d\u00e8scoverta
  de numerose e ingarbugi\u00ea vi\u00e7ende st\u00f6iche e architetoniche che se
  son sorvaposte inti secoli pas\u00f2i, obligandoli a elucubr\u00e6 ri\u00e7erche,
  asc\u00ec documentali, e asc\u00ec tecniche de urtima genera\u00e7ion (tra e qu\u00e6,
  pe esenpio, a capa\u00e7it\u00e6 de d\u00e6t\u00e2 \u2013 con minimo scarto de\\naproscima\u00e7ion
  \u2013 unn-a malta o un mon). Tutto o l\u2019\u00e8 descr\u00eeto into libbro, conpletou
  a ci\u00f9 m\u00e0n con articoli de Clario Di Fabio, Giorgio Rossini, Elena Leoncini,
  Daniela Pittaluga, Lauro Magnani e da-o meximo Aot\u00f4; e con, a-a finn-e, unn-a
  anpia documenta\u00e7ion fotografica a colori.\\nALLEGATO 69 - Le operazioni aeronavali
  nel mar Ligure 1940-1945, Gabriele Faggioni, Alberto Rosselli, Ligurpress 2011,
  pagg. 192.\\nSe o titolo o dixe za tutto a-i apascion\u00e6 da st\u00f6ia da go\u00e6ra
  visci\u00fba into m\u00e2 Ligure, e se da-i do\u00ee aoto\u00ee poemo solo asp\u00eat\u00e2se
  e megio informa\u00e7ioin e de ci\u00f9 precize de d\u00e6to che son za conosci\u00fbi
  pe-e seu publica\u00e7ioin, n\u2019aprofit\u00e9mmo aloa pe intrategnise in pitin
  in sci\u00e2 Ligurpress. A l\u2019\u00e9 \u2019na caza editri\u00e7e ch\u2019a vanta
  oltre \u00e7inquanta libbri con tema Zena e a Liguria: da-i f\u00f2rti, tenplari
  e balestr\u00ea a-a cuxinna; da-e str\u00eee, stregoin e fantastiche mag\u00eee
  a-i eventi da go\u00e6ra; da-e goidde do terit\u00f6io atoale a-a seu preist\u00f6ia.\\nA
  veste grafica a l\u2019\u00e9 inportante, ben cur\u00e2 e as\u00e6 sodisfacente
  pe-a qualit\u00e6 do pap\u00ea e da scrit\u00fba: in bello travaggio editoriale
  a \u2019n prexo contegn\u00fbo. L\u2019\u00e9 cosc\u00ec poscibile pe tutti de arich\u00ee
  a seu biblioteca con di belli libbri in sce di argomenti interesanti e soviat\u00f9tto
  ben document\u00e6 a tema locale regionale.\\nALLEGATO 70 - Dall\u2019alba del Risorgimento
  all\u2019Unit\u00e0 d\u2019Italia, E. Baglini, F. Bampi, E. Gaggino, F. Lottero,
  F. Majocco, A.G. Remedi, S.E.S. 2011, pagg.158\\nDi aoto\u00ee, ben quattro son
  s\u00f2cci de \u201cA Compagna\u201d. Son an\u00e6ti a ravat\u00e2 tanto da poei
  dimostr\u00e2 l\u2019inportante parte\u00e7ipa\u00e7ion a-o grande evento de l\u2019Unit\u00e6
  da parte do borgo de San P\u00ea d\u2019\u00c6nn-a, poi \u00e7it\u00e6 aotonoma,
  e de san Teod\u00f6o, sest\u00ea de Zena, oua rion\u00eei inte \u2019n unico Municipio.
  Parte\u00e7ipa\u00e7ion at\u00eeva, comme dimostra o busto da covertinn-a, dedic\u00f2u
  a-o pluridecor\u00f2u St\u00eava Lagorara, prezente insemme a tanti \u00e2tri garibaldin
  into camposanto da Castagna, dove gh\u2019\u00e9 asoter\u00f2u adreit\u00fba quarche
  garibaldin ch\u2019o no l\u2019\u00e9 riport\u00f2u inti elenchi ofi\u00e7i\u00e2li.
  Parte\u00e7ipa\u00e7ion organizat\u00eeva e ideologica: patrioti fucil\u00e6; ospitalit\u00e6
  a-e truppe fran\u00e7eixi che co-a fer\u00f4via anian a fin\u00ee inta grande carneficinn-a
  de Solferin; i operai da SMS Universale, prezenti a Sapri e p\u00f6i copromot\u00f4i
  da partensa di Mille; l\u2019acheugge i tanti patrioti profughi \u00f2 ezili\u00e6;
  a dedica do tiatro a-o mazinian Gustavo Modena; e d\u00f2nne con r\u00f2lli solo
  aparentemente segond\u00e2i.\\nL\u2019identit\u00e6 de \u2019na \u00e7it\u00e6 a
  l\u2019\u00e0 reixe ben ciant\u00e6, comme queste, cont\u00e6 into libbro.\\nALLEGATO
  71 - Uniti nell\u2019Italia unita, Tringali Sebastiano, Ames 2011, pagg. 240\\nD\u00f3n
  da n\u00f2stra s\u00f2ccia, a Socj\u00eat\u00e6 Oper\u00e2ia Univers\u00e2le de
  San P\u00ea d\u2019\u00c6nn-a. Gh\u2019\u00e9 descr\u00eeto in m\u00f2ddo pontoale
  o mondo do travaggio manoale, visto da-a parte de l\u2019oper\u00e2io zeneize, de
  asocia\u00e7ioin fraterne e cooperative; de l\u2019instru\u00e7ion e-a colt\u00fba
  do popolo; da parte\u00e7ipa\u00e7ion a-o processo unita\u00eeo: partez\u00e2 con
  Mazzini e Garibaldi; do seu unico patrimonio: o travaggio.\\nL\u2019\u00e9 de seg\u00fbo
  \u2019na man\u00eaa diversa de vedde l\u2019Unit\u00e6 na\u00e7ionale, rispetto
  a quella de solito proposta inte sch\u00eaue e da-a colt\u00fba st\u00f2rica clascica.
  Ma no meno inportante perch\u00e9 in fondo, son st\u00e6ti loiatri a an\u00e2 a
  conb\u00e0tte \u00f2 a travaggi\u00e2; loiatri l\u2019Unit\u00e6 no solo l\u2019\u00e0n
  pens\u00e2, ma soviatutto l\u2019\u00e0n f\u00e6ta inte oficinn-e o in sc\u00ee
  canpi de bataggia co-i garibaldin.\\nConcludde o libbro \u2018la novella di Masino\u2019,
  cont\u00e2 in fumetto da-o Lucca De Santis.\\nALLEGATO 72 \u2013 O Prin\u00e7ip\u00ecn,
  De Saint-Exup\u00e9ry Antoine, con acquer\u00e8lli de l\u2019aot\u00f4, tradu\u00e7ion
  da-o fran\u00e7eize a-o zeneize de Alessandro (Lusciandro) Garibbo, ed. Tintenfass
  2011, pag.96\\nL\u2019aot\u00f4 fran\u00e7eize o l\u2019\u00e0 scr\u00eeto questo
  raconto do 1943, into pin da gu\u00e6ra, d\u00f2ppo ch\u2019o l\u2019ea ritorn\u00f2u
  da quella recente de Spagna e primma de mo\u00ee sconparindo durante \u2019n x\u00eauo
  de recogni\u00e7ion. Da li in avanti tutti i figeu \u2013 ma asc\u00ec chi bagarillo
  o no l\u2019\u00e9 ci\u00f9 \u2013 \u00e0n f\u00e6to con questo t\u00e8sto un di
  ci\u00f9 belli x\u00eaui che se peu f\u00e0 co-a fantax\u00eea, un de quelli ch\u2019o
  t\u2019aresta pe senpre inta mem\u00f6ia d\u2019aveilo f\u00e6to. A dimostra\u00e7ion
  che \u2019n tutti i recanti do mondo e gente s\u2019aseunan e m\u00e6xime c\u00f6se
  se suger\u00eee da st\u00f6ie de fantax\u00eea ma asc\u00ec costrut\u00eeve.\\nO
  Garibbo o l\u2019\u00e0 curou a verscion in zeneize trad\u00fbxendo diretamente
  da-o fran\u00e7eize, pe ese o ci\u00f9 fedele poscibile a l\u2019originale. O scrit\u00f4
  fran\u00e7eize o l\u2019\u00e0 concentr\u00f2u drent\u2019a-o t\u00e8sto a seu morale
  de grande civilt\u00e6 e, pe quello ch\u2019avegniva aloa into mondo, in pitin dizincat\u00e2.
  No l\u2019\u00e9 fa\u00e7ile concentr\u00e2 in p\u00f6che righe i val\u00f4i esen\u00e7iali
  de \u2019na so\u00e7i\u00eat\u00e6 a mez\u00fba d\u2019\u00f2mmo, comme o dov\u00e9i,
  a fraternit\u00e6, a solidariet\u00e6, o prin\u00e7ipio che a l\u2019\u00f2mmo \u2013
  s\u2019o se priva da dignit\u00e6 e de l\u2019etica \u2013 ghe vegne o cheu arso\u00eeo
  e o rende dezerto o mondo; perch\u00e9 \u00f2gni \u00f2mmo o l\u2019\u00e9 ligou
  a-i atri co-in ligamme cosc\u00ec streito ch\u2019o ghe fa conosce che e c\u00f6se
  ci\u00f9 senplici son e ci\u00f9 belle e che a feli\u00e7it\u00e6 consciste into
  f\u00e2 feli\u00e7e i \u00e2tri. Concetti difi\u00e7ili da spieg\u00e2 a \u2019n
  figeu; megio quindi se mostr\u00e6 indiretamente co-ina f\u00f6a dove ogni figeu
  o pensa d\u2019ese l\u00ea o Prin\u00e7ipin, finn-a a acap\u00ee che o Prin\u00e7ipin
  o no se n\u2019\u00e9 and\u00e6to ma o l\u2019\u00e9 senpre chi, da ognidun de niatri.\\nALLEGATO
  73 \u2013 il Monte di Piet\u00e0 di Gavi della Confraternita di N.S. Assunta dei
  Turchini, Armando Di Raimondo, Erga ed., 2011, pag. 208\\nUn n\u00eauvo libbro do
  nostro soccio, ch\u2019o l\u2019alterna ri\u00e7erche inti archivvi zeneixi \u2013
  za publich\u00e6 into nostro boletin \u2013 e o seu vive inte l\u2019Oltrezovo,
  t\u00e6ra de ant\u00eega apartenensa zeneize.\\nSe se conscidera che tanto materi\u00e2le
  d\u2019archivio o l\u2019\u00e9 an\u00e6to destr\u00fbto, a seu ricostru\u00e7ion
  di f\u00e6ti \u2013 a ci\u00f9 preciza poscibile \u2013 a mostra i colegamenti con
  Zena e i paixi vexin, comme, prezenpio, \u2019na dona\u00e7ion a \u2019n\u2019uspi\u00e2
  de San P\u00ea d\u2019\u00c6nn-a, e no solo. In ci\u00f9 a dimostra e a valorizza
  comme o l\u2019ea l\u2019anbiente, a vitta, e opere, o bello e o br\u00f9tto, tutto
  fedelmente document\u00f2u da l\u2019ativit\u00e6 do Banco di pegni. A forsa de
  l\u2019aot\u00f4 a l\u2019\u00e9 st\u00e6ta quella de no avei f\u00e6to di aridi
  elenchi ma d\u2019avei saci\u00fbo trasform\u00e2 \u2019na profonda cult\u00fba
  in sce queste primitive istitu\u00e7ioin de carit\u00e6 cristiann-a inte \u2019na
  let\u00fba latinn-a e gradevole.\\nALLEGATO 74 \u2013 Peagna\\nScr\u00eeve de Peagna
  in poche r\u00eeghe? Gh\u2019\u00f2ri\u00e9iva \u2019n libbro solo pe-o terit\u00f6io:
  a valadda Ib\u00e0, pinn-a de piante e de fi\u00f4ri mediteranei; opure pe-o paizetto
  medievale a-e spalle do \u00c7ei\u00e2, ricco de sto\u00efa, de tradi\u00e7ioin
  antighiscime e dove ancon ancheu a vitta a score into scilen\u00e7io di ol\u00eevi
  con l\u2019antiga carma e o ritmo di paixi agricoli; opure solo pe-a g\u00eax\u00e9tta,
  quella n\u00eauva comme anche quella ant\u00eega con i seu afreschi.\\nA noiatri
  interesan sorvetutto i libbri; e al\u00f4a t\u00f2-u li che semmo ospit\u00e6 inte
  de stansie co-i sofiti de moin e f\u00e6ti a veia, \u00f2 inte \u2019na cazetta
  riamodern\u00e2 de ci\u00f9 cen, co-i vani t\u00fbtti pin de libbri ben catalog\u00e6
  e ordin\u00e6 finn-a-o sof\u00eeto e da-o cian teren finn-a a-o te\u00eeto (da-o
  terasin do quae, a botti, se peu pas\u00e2 inte quelli di atri vexin: qu\u00e6xi
  \u2019na preuva scilen\u00e7ioza de fiduccia, sostegno e amici\u00e7ia) \u00f2 inti
  gr\u00e9ndi saloin de caza Aicardi donde l\u2019\u00e9 ospit\u00f2u e misso in mostra
  ci\u00f9 de dexemilla volummi a tema ligure, che fan de Peagna a capit\u00e2le do
  libbro regionale (ma asc\u00ec do basso Piemonte, da Sardegna e da Franza confinante)
  e ritreuvo inportante da cult\u00fba ligure.\\nDa-o 1982 (l\u2019anno primma l\u2019ea
  st\u00e6to fond\u00f2u l\u2019asocia\u00e7ion \u201cAmixi de Peagna\u201d) i tenaci
  e convinti volont\u00e2i goid\u00e6 da-o pareco pr\u00e6 Fiorenso Gerini, se son
  inser\u00eei inta Consulta Ligure e \u00e0n d\u00e6to vitta a-a f\u00eaa-merc\u00f2u
  do libbro ligure (ma asc\u00ec emeroteca, pinacoteca e videoteca). F\u00f2scia manco
  loiatri se l\u2019ean inmagin\u00f2u de poei divent\u00e2 \u2019n centro de prestiggio
  interna\u00e7ionale \u2013 antiga voca\u00e7ion di liguri \u2013 pe mostr\u00e2
  l\u2019educa\u00e7ion da sto\u00efa e da colt\u00fba civica e tradi\u00e7ionale
  da n\u00f2stra t\u00e6ra.\\nAnemmo tutti a Peagna donque, a-a proscima rasegna anoale,
  parte\u00e7ipando a-e ser\u00e2te colturali de fin agosto-primmi de setenbre; e
  in particolare a-a \u00e7eim\u00f2nia finale co-a consegna do premio Anthia.\\nALLEGATO
  75- Le mie prime 100 parole in Zeneize, Matteo Merli, Franco Bampi, Fabbrica Musicale
  editore, 2012, con CD, pag.48\\nR\u00eccco de ilustra\u00e7io\u00ecn co-e qu\u00e6
  zug\u00e2, ma asc\u00ec da color\u00e2 \u00f2 da \u2018trad\u00fbe\u2019, o libr\u00e9tto
  o l\u2019\u00e9 \u2019n b\u00f3n strum\u00e9nto pe t\u00f9tti qu\u00e9lli che gh\u2019\u00e0n
  di f\u00ecggi \u00f2 di n\u00eavi (d\u00ecmmo da-i \u00e7\u00ecnque a-i d\u00f3zz\u2019\u00e0nni),
  pe mostr\u00e2ghe \u2013 inte \u2019n m\u00f2ddo divert\u00e9nte \u2013 a l\u00e9ngoa
  zen\u00e9ize. Ma no se f\u00e9mmo de il\u00f9xo\u00ecn: \u00e0nche pe-i genito\u00ee,
  e n\u00f2nne e i n\u00f2nni no l\u2019\u00e9 che s\u00e9gge t\u00f9tto f\u00e0\u00e7ile;
  \u00f6ri\u00e2 d\u00ee che li\u00e2tri asc\u00ec pori\u00e0n atrov\u00e2 \u00f9tile
  qu\u00e9sto l\u00ecbbro pe comens\u00e2 a scr\u00eeve in zen\u00e9ize, mag\u00e2ra
  d\u00f2ppo av\u00e9i consult\u00f2u in di\u00e7ion\u00e2io e in mano\u00e2le de
  graf\u00eea.\\nALLEGATO 76 - Nino Bixio e \u2018le questioni del mare\u2019, Armando
  Fioravanti e Virgilio Bozzo, ed. Giammar\u00f2, 2011, pag. 128.\\nO 29 de novenbre
  do 2011, o sci\u00f4 Virgilio Bozzo o l\u2019\u00e0 tegn\u00fbo \u2019na conferensa
  in sci\u00f4 m\u00e6ximo tema a-i \u201cMarted\u00ec in Compagna\u201d.\\nPe ini\u00e7iat\u00eeva
  de l\u2019Istituto Tecnico di Trasporti e Logistica \u2018san Z\u00f2rzo\u2019 de
  Zena e Camoggi, into corso de l\u2019anno do 150enaio de l\u2019Unit\u00e6, l\u2019ea
  st\u00e6to publicou o libbro ch\u2019o mette in ci\u00e6o \u00e7erti aspetti da
  poliedrica fig\u00fba de l\u2019eroe ligure: co-o rac\u00f2nto da seu vitta; di
  seu interventi comme Parlamentare; di rap\u00f2rti co-o m\u00e2 a-i tempi de l\u2019avert\u00fba
  de Suez. O libbro o se conclude con unze schede (dove tra e atre c\u00f6se se mostra
  e seu nave asc\u00ec) e co-in\u2019anpia bibliografia.\\nALLEGATO 77 - Escursioni
  e campagne geologiche guidate, Remo Terranova, ed. Erga, 2011, pagg.148\\nMi penso
  che a segge esperiensa de t\u00f9tti, avei notou \u2013 caminando pe i sent\u00ea
  di nostri monti \u2013 a miriade de rocce, conforma\u00e7ioin diverse, a strati,
  riseu, gran\u00eeti di ci\u00f9 tanti colori donde o verde spesso o prevale, intenso
  o variegou. A coiozit\u00e6 de conosce o scignific\u00e2to e l\u2019origine de \u2018ste
  pr\u00eee o de \u2018ste conforma\u00e7ioin a l\u2019\u00e8 forte, ma asc\u00ec
  a l\u2019\u00e8 erta a dificolt\u00e6 de inparali.\\nO libbro, rivolto a-i studenti
  di corsci de laurea in Scense Geologiche o Naturali e Geografia, con i soliti belli
  tratti tipografici a-i qu\u00e6 semmo abitu\u00ea da-a casa editri\u00e7e Erga,
  insegna 46 qualit\u00e6 de rocce in \u00e2tretanti siti de-a Liguria, comunemente
  visciui, comme e 5 T\u00e6re, a valadda da Fontan-abonn-a, a valadda d\u2019Aveto,
  e altre in moddo semplice, fotograficamente ben ilustrou a colori, tali da ese capii
  asc\u00ec da \u2018n non profescionista e da-i amiratoi de-a complescit\u00e6 de
  Mamma Nat\u00fba.\\nALLEGATO 78 - La duchessa di Galliera, Maria Brignole Sale De
  Ferrari (Genova, 1811 \u2013 Parigi, 1888), Marcella Mascarino, Liberodiscrivere,
  2011, pagg. 378.\\nPe voei ben intensamente a \u2019na personn-a, a \u2019na bestia,
  a \u2019na \u00e7it\u00e6, l\u2019\u00e9 indispensabile \u00e7erc\u00e2 de conoscila
  o ci\u00f9 a fondo poscibile, co-a totale disponibilit\u00e6 de g\u00f6d\u00eene
  preggi e soport\u00e2ne i difetti. Anche pe conosce Zena peu no \u00ease abasta
  gj\u00e2 pe-i caroggi, studi\u00e2 a seu sto\u00efa, ami\u00e2 i seu palassi, gust\u00e2
  a fugassa e-e trenette co-o pesto. Pe conosce Zena, sorvet\u00f9tto da-o ponto de
  vista coltur\u00e2le, l\u2019\u00e9 neces\u00e2io inpar\u00e2 a conosce asc\u00ec
  i seu personaggi perch\u00e9 son st\u00e6ti l\u00f4 che co-a seu personalit\u00e6
  \u00e0n contribo\u00eeo a carateriz\u00e2 questa \u00e7it\u00e6.\\nQuindi no fermemose
  solo a Mazin e Garibaldi, ma infricemoghe asc\u00ec a famiggia de Rafaele De Ferrari,
  e in particol\u00e2re seu mog\u00ea, a duchessa Maria Brignole Sale, a qu\u00e6,
  co-e seu dona\u00e7ioin, a l\u2019\u00e0 permisso a-a n\u00f2stra Zena de f\u00e2
  \u2019n enorme s\u00e2to de qualit\u00e6, cosc\u00ec da metila tra e primm-e da
  Na\u00e7ion, vixin a-e ci\u00f9 fam\u00f4ze \u00e7it\u00e6 d\u2019arte, pe magnificensa
  e bel\u00e9ssa. Tanto per f\u00e2 di ezenpi, devimo a loi\u00e2tri s\u2019emmo posci\u00fbo
  ingrand\u00ee o p\u00f2rto cosc\u00ec da divent\u00e2 o megio d\u2019Italia; i palassi
  Rosso e Gianco co-i quaddri do Van Dick, do Murillo e do Rubens; trei uspi\u00e6:
  sant\u2019Andr\u00eea e san Filippo (o Gal\u00eaa) e C\u00f4n\u00e2; a grande villa
  a V\u00f4tri; e primme tr\u00e6 caze popolari. Into contesto da seu \u00e9poca,
  e vicende da famiggia \u2013 descr\u00eete da l\u2019Aotrice d\u00f2ppo avei lez\u00fbo
  \u00e7entan\u00e6a de letere e de documenti \u2013 ne mostran i perch\u00e9 de tanta
  e gener\u00f4zit\u00e6 che no ghe n\u2019\u00e9 de p\u00e6gia; enexima dimostra\u00e7ion
  che, se i zeneixi son universalmente conosci\u00fbi comme avari, in realt\u00e6
  e in silen\u00e7io, sensa troppo sci\u00e2to, son tra i ci\u00f9 generozi e parte\u00e7ipi
  de necesit\u00e6 di \u00e2tri.\"", "\"[pronuncia]\\nL''Apenin, i munti che cumme
  in fii de sche\u014b\u014ba i trav\u00e9rsan t\u00fctta l''Italia, i cum\u00e9nsan
  da u T\u00fcrchin, dedatu a Vutri, pe and\u00e0 a L\u00fcsci\u00e0ndria *. Quarchedun
  u piensa che u numme u ne vegne da Pen, diu l\u00edgure de selve e di munti, cusc\u00ec
  cumme u munte Penna, u P\u00e9nice e i Pentemin.\\nQueste p\u00e0gine ch\u00ed i
  l''en dedich\u00e8 a u primmu tuccu d''Apenin, quellu setentriunale, in r\u00f6u
  de munti e vall\u00e8 spart\u00ede inte quattru pruvince e regiu\u00edn diferenti:
  Zena (Lig\u00fcria), L\u00fcsci\u00e0ndria (Piemunte), Pavia (Lumbardia) e Piaxensa
  (Milia-Rumagna). Mascimamente, per\u00f3, l''\u00e8 na zona in cun e me\u00e9xime
  \u00fczanse (a gente a metteiva u gr\u00e0n e e patate e a c\u00fcggeiva e castagne,
  i tegnivu crave e vacche e i feivu i paixi inte quellu moddu) ci\u00f9 sc\u00edmili
  tra vall\u00e0 e vall\u00e0 ci\u00fcttostu che versu a cian\u00fca e u ma. Questi
  ligammi i l''en belli cei in ta m\u01d8xica tradissiunale pupulare, che cusc\u00ec
  l''an ciam\u00e0 de Quattru Pruvince: u moddu ci\u00f9 gi\u00fcstu pe parl\u00e0
  de sti p\u00f3sti.\\nIna tera de punti\\nSe sa che l''imaginasiun da gente a l''ac\u00fcbbia
  l''edificasiun de in punte a l''interventu dest\u00fcrbante du diau, e l''\u00e8
  f\u00e0ssile capine u perch\u00e8: i punti i l''azonzu, u diau u l''\u00e8 \\\"quellu
  ch''u sparte\\\". In ta cult\u00fca pupulare ci\u00f9 fullettu dest\u00fcrbante
  che incarnasiun du m\u00e0 veru e pr\u00f3priu, u diau u l''insinua, in cu u su
  fa negativu, l''inm\u00e0gine da cuntradissiun ascusa in t\u00fctte e assiu\u00edn
  vut\u00e8 a \u00fcn\u00ed, a cavarc\u00e0, a travers\u00e0. In fondu, a s\u00f6
  disper\u00e0 uppuzixun aa creasiun de cuntatti, z\u00fcnte, cum\u00fcnicassiu\u00edn,
  a l''ascunde in valuu: a difeiza de l''identit\u00e8 e spesifisit\u00e8, per\u00f3
  scheita in tu malinteizu de serase a l''atru, de in ref\u00fcu assol\u00fcu e st\u00e9rile.\\nSe
  u punte g\u00f6bbu de B\u00f6bbiu, cu l''\u00fcnisce e riive upposte da Tr\u00e9bbia,
  u m''\u00e0 s\u00fcggeriu queste cunsciderassiu\u00edn, l''\u00e8 perch\u00e8 in
  queste vall\u00e8, che uramai ciamemmu \\\"de Quattru Pruvince\\\", s''arescea in
  pin a cunplessit\u00e8 di tanti cuntradit\u00fai temmi de \u00fcniun e cunflitu,
  ciavuja e scangiu, avert\u00fca e isulamentu. Vall\u00e8 percurse da stre millenaje,
  vie marenche e vie da s\u00e0, tra men\u00fcssie de gea e curenti d''\u00e8gue,
  uup\u00fcre trai b\u00fctti de creste, d''az\u00fcrru e verde, speg\u00e8 a nord
  in nebie de cian\u00fca o a s\u00fcd in tu resplanduu di\u00e0fanu de na lengua
  de m\u00e0. Vall\u00e8 n''uuta de antighe sulidariet\u00e8, cunsuet\u00fcdini cum\u00fcnitaje,
  ampi\u00e9ssa de sc\u00f6sse, rich\u00e9ssa d''\u00e8gue. Ma anche de tere lunta\u014b\u014be
  e sciti dezerti, de vitte fr\u00fcst\u00e8 in se urizunti sempre paegi, de rivalit\u00e8
  antighe e sang\u00fcnente. Vall\u00e8 anc\u00f6` fete de selve sp\u00e9sse, paixi
  aruin\u00e8 duv''\u00e0 guagnu e spi\u014b\u014be, ser\u00e8 in tu l\u00fcvegu de
  l''abandun.\\nPaolo Ferrari Mag\u00e0\\n(Dalla val Trebbia alle \\\"molte province\\\"
  = World music magazine. 62 : 2003.10. p 5-7)\"", "\"Greene Vardiman Black\\nGreene
  Vardiman Black (1836 - 1915) o l''\u00e8 st\u00e6to un dentista americano, consciderou
  o po\u00e6 da sciensa odontoiatrica moderna. O no l'' ha seguio di st\u00fcdi regolari:
  o l'' ea autodidatta, essendo and\u00e6to a sc\u00f6a no ci\u00fc de vinti meixi.
  Dall'' et\u00e6 de 17 anni o l'' ha comin\u00e7ou a f\u00e4 pratica in to st\u00fcdio
  do fr\u00e6, Thomas G. Black, che o l'' ea mego, standoghe 4 anni. Poi o s'' \u00e8
  misso a f\u00e4 o dentista doppo un corso de 4 meixi, e doppo esse st\u00e6to -
  sempre pe pochi meixi - ascistente de un atro profescionista, J.C. Speer. Doppo
  avei combatt\u00fco in te a guera \u00e7ivile americanna, o s''\u00e8 stabilio a
  Jacksonville in te l'' Illinois, dove o s''\u00e8 dedicou \u00e4 ri\u00e7erca e
  \u00e4 pratica dell''odontoiatria. O l'' ha st\u00fcdiou l'' odontoiatria avendo
  a dispozision un solo libbro in sce l'' argomento. E regole definie da Black pe
  a preparasion de cavit\u00e6 in ti denti cari\u00e6 ( i cosciditi Prin\u00e7ip\u00ef
  de Black) son rest\u00e6 valide figna squ\u00e6xi \u00e4 giorn\u00e4 d'' anc\u00f6,
  s\u00fcper\u00e6 solo da o re\u00e7entiscimo svil\u00fcppo di materiali compoxiti.
  Comunque anche attualmente, sci\u00fcbben solo in parte, queste regole mantegnen
  o s\u00f6 scignificou. Un'' atra cosa che i dentisti moderni devan a Black a l''\u00e8
  a clascificasion di tipi de lesioin cariose segundo a forma e a pozision.\\nI Prin\u00e7ip\u00ef
  de Black[mod\u00ecfica | mod\u00ecfica wikit\u00e8sto]\\n- Ottegn\u00ef a forma
  de contorno richiesta.\\n- Ottegn\u00ef a forma de rexistensa richiesta.\\n- Ottegn\u00ef
  a forma de ritension richiesta.\\n- Ottegn\u00ef a forma de conveniensa richiesta.\\n-
  Elimin\u00e4 a dentinna cari\u00e4 che a fisse eventualmente rest\u00e4 in cavit\u00e6.\\n-
  Rifin\u00ef e pareti de smalto.\\n- Nettezz\u00e4 a cavit\u00e6.\"", "\"CANTO TREDICESIMO\\nARGOMENTO\\nDoppo
  d\u2019avei mostr\u00f3\u00f9 con sovraumana\\nVirt\u00f9 l\u2019Angeo a l\u2019Eroe
  tante st\u00fbpende\\nCose e bellezze, che l\u2019Americana\\nRegion ricca e vastiscima
  a comprende;\\nO gh\u2019indica unn-a serie lunga e strana\\nDe fut\u00fbre politiche
  vicende\\nDa maexima, e i eroi ci\u00f9 rinom\u00e6,\\nChe in quella han comhatt\u00fbo
  pe-a libert\u00e6.\\n1\\nL\u2019Eroe da-\u00f4 so pensceo profondo e tristo\\nD\u00e4
  voxe de l\u2019Arcangeo \u00f4 l\u2019\u00eba riscosso:\\nD\u2019un mondo n\u00eauvo,
  l\u00ea \u00f4 ghe dixe, acquisto\\nPe-\u00f4 vegio immenso, un breve schisso, un
  sbosso\\nImperfetto, Colombo, ti \u00e6 z\u00e0 visto;\\nAoa ti conosci\u00e6 cosc\u00ec
  a l\u2019ingrosso\\nE scene varie e i atti, a-i qu\u00e6 s\u00e4 averta\\n(N\u00eauvo
  teatro stupendo) a to scoverta.\\n2\\nSaiva cosa superflua \u00f4 voe\u00ee predite\\nQuanto
  ti p\u00eau pronostic\u00e2 ti stesso;\\nChe quando i ammirabili e infinite\\nRegio\u00een
  e t\u00e6re doppo \u00f4 bon successo\\nDa to impreisa a l\u2019Europa s\u00e4n
  descrite:\\nPe gloria e avidit\u00e6 subito e spesso\\nSeguiti\u00e2n n\u00eauve
  pubbliche e private\\nSped\u00efzioin i to indizii e e to pedate.\"", "\"CUMPAGNIA
  d\u2019i VENTEMIGLIUSI\\nS T A T \u00dc T U\\n- SCOPI -\\nArt. 1 - A \u201cCumpagnia
  d\u2019i Ventemigliusi\u201d, fund\u00e0 int\u2019u 1927, a se prupune de mantegne
  vivi u parla\u2019 e e tradissiun de Ventemiglia, de fa\u2019 cunusce a sou st\u00f6ria,
  difende i soi mun\u00fcmenti, e sou belesse nat\u00fcrali e d\u2019agi\u00fct\u00e0
  t\u00fcte e inissiative pe\u2019 u sou prugressu.\\nArt. 2 - L\u2019assuciassiun
  a nu\u2019 l\u2019\u00e0 scopu de l\u00fccru, dunca, e ativit\u00e0 cult\u00fcrali
  i seran delongu impruntae e ispirae a \u2018stu principiu. Base, fundamentale de
  l\u2019ativit\u00e0 assuciativa a l\u2019\u00e8 u vuluntariatu che, uperandu isc\u00ec
  cun s\u00f2di p\u00fcbrichi, u porta avanti in serviziu suciale. Se duvesse paresce
  avansi de gestiun, i seran impiegai pe\u2019 e ativitae fut\u00fcre.\\n- SOCI -\\nArt.
  3 - Pe\u2019 divent\u00e0 Soci d\u2019a Cumpagnia bes\u00f6gna:\\na) esse nasci\u00fci
  a Ventemiglia o essighe dumici\u0159iai aumancu da vint\u2019ani o esse figliu de
  paire e de maire uriginari d\u2019a Zona Intemelia,\\nb) parla\u2019 u ventemigliusu,
  o fa\u2019 u puscibile pe\u2019 parlaru,\\nc) esse presentau da in Sociu.\\nArt.
  4 - I purreran domand\u00e0 l\u2019iscrissiun \u00e2 \u201cCumpagnia d\u2019i Ventemigliusi\u201d
  isc\u00ec canti, nu\u2019 atr\u00f6vanduse inte cundissiun d\u2019u precedente articulu:\\na)
  i sece iscriti d\u2019\u00e2 nasciun intu Cum\u00fcne de Ventemiglia.\\nb) i sece
  figli de paire e maire residenti a Ventemiglia.\\nc) i fasse parte d\u2019e Seziui
  d\u2019a \u201cCumpagnia\u201d.\\nd) i travaglie, a calunche titu\u0159u, p\u2019i
  scopi asuciativi.\\ne) i dimustre interesse pe\u2019 a st\u00f6ria, e tradissiui
  e u dialetu de Ventemiglia.\\nf) i vive inta Zona Intemelia e i s\u2019interesse
  de a vita d\u2019a \u201cCumpagnia\u201d e d\u2019e sou ativit\u00e0.\\nU Cunsegliu
  u decide de l\u2019acetassiun d\u2019i Soci, nu\u2019 duvendu rende raixun d\u2019e
  sou decisiun.\\nArt. .5 - I Soci i s\u2019impegna a paga\u2019 t\u00fcti i ani a
  tessera, ch\u2019a ghe vegnir\u00e0 present\u00e0 da in\u2019incarregau d\u2019a
  \u201cCumpagnia\u201d. A quota assuciativa a nu\u2019 l\u2019\u00e8 trasmiscibile
  e a nu\u2019 l\u2019\u00e8 sugeta a rival\u00fctassiun.\\nArt. 6 - I Soci i l\u2019\u00e0n
  diritu de votu intu Parlamentu urdinario, isc\u00ec in caixu de partecipassiun tempuranea
  \u00e2 vita asuciativa, za\u2019 ch\u2019i duveran porze a sou ativit\u00e0 suciale,
  cume a chela d\u2019e seziui, a titu\u0159u assul\u00fctamente de bada.\\n- SEZIUI
  -\\nArt. 7 - Pe\u2019 purta\u2019 a bon fin i scopi assuciativi a \u201cCumpagnia\u201d
  a se servir\u00e0 d\u2019\u00ea sou Seziun:\\na) d\u2019a CUMPAGNIA d\u2019u TEATRU
  VENTEMIGLIUSU\\nb) de l\u2019 ACADEMIA VENTEMIGLIUSA de Cult\u00fcra Intemelia\\nc)
  d\u2019a Curale in cust\u00fcme CUMPAGNIA CANTANTE\\nd) d\u2019i CENTRI de CULT\u00dcRA
  DIALETALE inte sc\u00f6re\\ne) d\u2019a Rapresentativa cum\u00fcnale SBANDIERANTI
  d\u2019i SESTEI\\nf) d\u2019a CUMPAGNIA BA\u0158ESTREI\\ng) de ciache autra inissiativa
  decisa dau Parlamentu d\u2019i Soci e dau Consegliu Diretivu.\\nA \u201cCumpagnia
  d\u2019i Ventemigliusi\u201d a l\u2019\u00e8 rapresenta\u2019 inte l\u2019 \u201cENTE
  AGOSTO MEDIEVALE\u201d e int\u2019a \u201cCONSULTA LIGURE\u201d dau Consule Rapresentante
  o da in sou de\u0159egau.\\nArt. 8 - T\u00fcte e Seziun d\u2019a \u201cCumpagnia\u201d
  i seran aministrae autonumamente da in Diret\u00f9 e da in Segretariu, numinai au
  dedrente d\u2019i Soci.\\nArt. 9 - E Seziui d\u2019a \u201cCumpagnia\u201d i nu\u2019
  pureran persegue scopi ch\u2019i sece in cuntrastu cun cheli stat\u00fctari e i
  l\u2019averan numa\u2019 l\u2019obrigu de presenta\u2019, ciache anu, inta re\u00fcniun
  de Cunsegliu d\u2019u mese de marzu, ina relassiun de l\u2019ativit\u00e0 cund\u00fcta
  e de chela, de mascima ch\u2019intenderan prud\u00fcxe inte l\u2019anu che vegnir\u00e0.
  E ativit\u00e0 d\u2019a \u201cCumpagnia\u201d e d\u2019e sou Seziui i vegniran faite
  cunusce ai Soci atraversu a pubricassiun de articuli inscia stampa lucale.\\n- ORGANI
  -\\nArt. 10 - A Cumpagnia a l\u2019\u00e8 aministra\u2019 da:\\na) U Parlamentu,
  furmau da l\u2019assemblea de t\u00fcti i Soci, ch\u2019a dev\u2019esse rad\u00fcna\u2019
  ciache trei ani, pe\u2019 l\u2019apr\u00f6vassiun d\u2019i conti e l\u2019elessiun
  d\u2019u n\u00f6vu Cunsegliu; isc\u00ec i scangiamenti au Stat\u00fctu e a quota
  d\u2019a tessera i duveran esse apr\u00f6vai da in Parlamentu.\\nb) U Cunsegliu,
  u l\u2019\u00e8 furmau da s\u00e9ze Cunsegliei numinai dau Parlamentu e, cume membri
  de diritu, dai Consuli unurari, numinai dau Parlamentu pe\u2019 i sou meriti specia\u0159i
  in favu\u2019 d\u2019a Cumpagnia; dai Diretui e dai Segretari d\u2019e Seziui, cusc\u00ec
  cume dai De\u0159egai d\u2019u Consule Rapresentante.\\nc) U n\u00f6vu Cunseglio
  cusc\u00ec furmau, u numiner\u00e0 in Consule Rapresentante, cu\u2019e funziui de
  Presidente d\u2019a \u201cCumpagnia\u201d, trei Consuli cun funziui de Vicepresidenti,
  cun incarreghi stabi\u0159\u00ee dau Cunsegliu; in Can\u00e7el\u00e9, in Segretariu
  e in Casc\u00e9, ri\u00fcn\u00eci intu Bur\u00f2.\\nd) U Console Rapresentante u
  c\u00fbrdina u regulare funsiunamentu d\u2019e ativit\u00e0 suciali, isc\u00ec versu
  terze persune, u purrer\u00e0 isc\u00ec ass\u00fcme t\u00fcti cheli pruvedimenti
  de caratere straurdinariu, cun l\u2019obrigu de riferine au Cunseglio, inta prima
  re\u00fcniun mensi\u0159e uti\u0159e.\\ne) I Consuli i duveran aministra\u2019 au
  megliu i incarreghi re\u00e7ev\u00fci, cum\u2019i purreran sustit\u00fc\u00ec u
  Rapresentante, inti caixi cunsent\u00ee, esercitandune e funziui.\\nf) U Can\u00e7el\u00e9
  u l\u2019\u00e0 in cunsegna l\u2019archiviu cu\u2019i libri d\u2019i verbali. U
  redige i verbali, pruvedendu a l\u2019esec\u00fcssiun d\u2019e delibere. In caixu
  d\u2019impedimentu u vegnir\u00e0 sustit\u00fciu dau Segretariu.\\ng) U Segretariu
  u l\u2019\u00e0 in c\u00fcstodia a sede suciale e u purrer\u00e0 assorve ai compiti
  d\u2019u Can\u00e7el\u00e9, cume a specia\u0159i mandai re\u00e7ev\u00fci da parte
  d\u2019i Consuli.\\nh) U Casc\u00e9 u c\u00fcstudisce i sodi e ciache autru valure
  d\u2019a Cumpagnia, uc\u00fcpanduse d\u2019u patrimoniu e d\u2019a cuntabilit\u00e0,
  in ci\u00fc de predispune i bi\u0159an\u00e7i.\\nArt. 11 - U Cunsegliu diretivu
  u duver\u00e0 redige u bi\u0159an\u00e7u cuns\u00fcntivu e chelu preventivu, pe\u2019
  trei ani, ch\u2019i duver\u00e0n esse presentai au Parlamentu urdinariu pe\u2019
  purr\u00e9 esse cuns\u00fcrtai dai asuciai ch\u2019i ne fasse richi\u00e9sta e messi
  in apruvassiun. A cuntabilit\u00e0 anu pe\u2019 anu a dev\u2019esse messa in apruvassiun
  inta reuniun de Cunsegliu d\u2019u mese de setembre.\\nArt. 12 - U Parlamentu u
  duver\u00e0 esse convucau cun invitu scritu, inte ciache caixu, mandau pe\u2019
  posta a t\u00fcti i Soci e cu\u2019a p\u00fcblicassiun insci\u2019a stampa lucale.
  U Cunsegliu u se ri\u00fcnir\u00e0, in ad\u00fcnansa urdinaria, ciache \u00fcrtimu
  l\u00fcnesd\u00ec de t\u00fcti i mesi e u purrer\u00e0 esse ri\u00fcniu, in ad\u00fcnansa
  straurdinaria dau Consule Rapresentante, cun invitu scritu. T\u00fcte e ad\u00fcnanse
  i seran va\u0159ide calunche sece u n\u00fcmeru d\u2019i Soci presenti. Sece int\u2019e
  re\u00fcniui d\u2019u Parlamentu che inte chele d\u2019u Cunsegliu se duver\u00e0
  parla\u2019 puscibirmente in ventemigliusu. Au cumens\u00e0 de ciache re\u00fcniun
  d\u2019u Cunsegliu, se duver\u00e0 leze u verbale d\u2019a re\u00fcniun precedente,
  pe\u2019 cuntrula\u2019 l\u2019andamentu d\u2019e cose ch\u2019i s\u2019eira decise.
  Int\u2019a relassiun, present\u00e0 dau Cunsegliu au Parlamentu, se duver\u00e0
  arregorda\u2019 l\u2019ativit\u00e0 de ciach\u2019un d\u2019i Consuli e d\u2019i
  Cunsegliei in favu\u2019 d\u2019a \u201cCumpagnia\u201d, cume pe\u2019 chela d\u2019e
  Seziun.\\nArt. 13 - L\u2019\u00e8 vietau destreb\u00fc\u00ec, isc\u00ec in modu
  indiretu, uti\u0159i o avansi de gestiun, e mancu fundi, ris\u00e9rve o capitali,
  sarvu diverse impusissiun de l\u00e9ge. A disgregassiun d\u2019a Cumpagnia a purrer\u00e0
  esse delibera\u2019 dau Parlamentu cun a magiuransa d\u2019i trei carti d\u2019i
  Soci, inta prima cunvucassiun e de calunche sece u n\u00fcmeru d\u2019i Soci inta
  segunda convuca, pe\u2019 ina data diversa. Pe\u2019 contra u patrimoniu u duver\u00e0
  esse devu\u0159\u00fcu a asuciassiui cun e m\u00e9ixime fina\u0159it\u00e0, o autrimenti
  pe\u2019 fina\u0159it\u00e0 de p\u00fcbrica \u00fcti\u0159it\u00e0.\\nArt. 14 -
  Pe\u2019 cantu u nu\u2019 l\u2019\u00e8 espressamente previstu dau presente stat\u00fctu,
  cume pe\u2019 cheli d\u2019\u00ea rispetive sessiun, i sun va\u0159ide e norme de
  l\u00e9ge vigenti in mat\u00e9ria.\\n* * * * * * * * * * * * * * * * * * * * * *
  * * * * * * * * * * * *\\nU presente Stat\u00fcto, redatu in catorze articuli, u
  l\u2019\u00e8 staitu apr\u00f6vau, a l\u2019\u00fcnanimit\u00e0 d\u2019i presenti,
  dau Parlamentu straurdinariu, regularmente cunvucau dau Consegliu Diretivu, in data
  31 de marsu d\u2019u 2001, a catr\u2019ure de dopusdern\u00e0, inta sede d\u2019a
  Cumpagnia, duverta inte Ventemiglia, in via G. Mazzini au n\u00fcmeru 12.\"", "\"de
  figgi\u00f6. I ci\u00fc vegi gh\u2019aivan quattorz\u2019anni: i ci\u00fc zueni
  ghe n\u2019aivan \u00f6ttu ape\u00f1a. Inte stradde, \u2018n\u2019allegria, \u00fcn
  fracassu, \u00fcn sciaatu da an\u00e2 f\u00f6a de cascia! Bande de battuxi dapert\u00fcttu:
  chi z\u00fcgava a-i c\u00e0llai, chi a-e ciappe, chi a-a balla, chi anava in bicicletta,
  chi survia \u2018n cavallin de legnu: questi z\u00fcgavan a l\u2019orbettu; quelli
  atri se scurivan: di atri, vestii da pagia\u00e7\u00e7i, mangiavan a stuppa a\u00e7eiza:
  chi re\u00e7itava, chi cantava, chi fava i sati murtali, chi se demuava a camin\u00e2
  cu-e muen in t\u00e6ra e-e ganbe per l\u2019aia: chi ariguava u \u00e7erciu, chi
  passagiava vestiu da generale cun l\u2019ermu de pap\u00ea e u squadrun de cartapesta:
  chi rieiva, chi sbragiava, chi ciammava, chi ciucava de muen, chi sciguava, chi
  fava u versu da galli\u00f1a quand\u2019a l\u2019ha f\u00e6tu l\u2019\u00f6vu: insumma
  \u2018na caladda, \u00fcn tremel\u00f6iu, \u00fcn burdellu du di\u00e2u, da duveise
  mette u cutun inti uege pe nu arest\u00e2 insurdii. In sce t\u00fctte e cia\u00e7\u00e7e
  se veddeiva di tiatrin de teja, gremenii de bagarilli da-a matin a-a seja, insce
  t\u00fctte e miagie de caze se ghe lezeiva scritu cu-u carbun de belliscime cose
  cumme queste: viva e demmue! (invece de demue); nuemana sceua (invece de n\u2019uemu
  an\u00e2 a-a sc\u00f6a); abassu Larin Mettica (invece de l\u2019aritmettica) e di
  atre sciu\u00ee cunscimmile.\\nU Pinocchiu, u Muchettu e t\u00fctti i atri figgi\u00f6,
  ch\u2019aivan f\u00e6tu u viagiu cu l\u2019\u00f4mettu, ape\u00f1a ebban missu u
  p\u00ea drentu a \u00e7itt\u00e6, s\u2019infi\u00f2n s\u00fcbbitu in mezu a-a gran
  barunda; e inte pochi men\u00fcti, cumm\u2019\u00e9 fa\u00e7\u00e7ile inmagin\u00e2siou,
  f\u00fcn s\u00fcbbitu amixi de t\u00fctti. Chi ci\u00fc feli\u00e7e, chi ci\u00fc
  cuntentu de liatri?\"", "\"Carcolo do scistema de trave de un teito \u00e0 anca\\nPe
  fav\u00f4, indic\u00e2 e dimenscioin ne\u00e7ess\u00e4ie in millimetri\\nY - ertixe
  do teito\\nX - longhixe da casa\\nZ - larghezza da casa\\nC - dimenscion minima
  de sciortia de crenatue\\nU - Larghessa do trave\\nW - Spessore de trave\\nS - Passo
  de trave\\nO1 - Larghezza de pannelli de guaina\\nO2 - Spessore da scheda de guaina\\nR
  - Passo de tornamento\\nCapa\u00e7it\u00e6 de programma\u00e7ion.\\nCarcolo da struttua
  da trave.\\nDetermin\u00e2 a quantit\u00e6 ne\u00e7ess\u00e4ia de matei\u00e6 da
  constru\u00e7ion pe-e trave.\\nDetermin\u00e2 o volumme de schede de guaina.\\nDimenscioin
  esatte de tutte e parte do scistema de trave.\\nDisegni dettaggi\u00e6 d''un teito
  \u00e0 l''anca, trave, guaina.\"", "\"Campionato italian do Zeugo do ballon\\nO
  Campionato italian do Zeugo do ballon o l''\u00e8 l''insemme di tornei na\u00e7ionali
  istitu\u00ef da-a FIGC. I campionati son suddivixi e organizz\u00e6 in 10 levelli,
  i primmi 4 son inquadr\u00e6 inte l''area do profescionismo, invece i atri 6 son
  pe i dilett\u00e0nti. A Liga Na\u00e7ion\u00e2 Profescionisti a l''organizza e a
  dirizze i doi maggioi campionati, a Serie A e a Serie B, mentre a Liga Italian-a
  do Ballon Profescionistico a l''organizza e a dirizze a Serie C1 e C2, o ter\u00e7o
  e o quarto livello do profescionismo. I diversci campionati a carattere dilettantistico
  son organizz\u00e6 da-a Liga Na\u00e7ion\u00e2 Dilett\u00e0nti, tra i qu\u00e6 a
  Serie D, o quinto livello do ballon italian.\"", "\"cia. Ro boja me l\u2019h\u00e0
  f\u00e6ta giusto in quello tempo, che stava \u00e0 ciattell\u00e2 con quello pe\u00e7\u00e7o
  d\u2019ase de m\u00e6 figgio. V\u0153uggio and\u00e2 aora aora subito \u00e0 ra
  Giusti\u00e7ia: v\u0153uggio f\u00e2 d\u00e2 ra corda \u00e0 tutta ra casa, \u00e0
  re donne, \u00e0 ri servito\u00ee, \u00e0 m\u00e6 figgio, \u00e0 m\u00e6 figgia,
  \u00e0 mi m\u00e6ximo. Quanta gente insemme! Ognun de quelli che veddo l\u00ec,
  me fa sospett\u00e2: o me p\u00e2 ro m\u00e6 laddro. Eh, de cose parlellan l\u00e0
  z\u00f9? de quello chi m\u2019ha arr\u00f3bao? Cose fan quelli trei lasci\u00f9?
  non sareivan miga ri m\u00e6 laddri? ma t\u00e8, se son depenti. Per carit\u00e6,
  ve ro domando \u00e0 tutti, se sei n\u0153uva dro m\u00e6 laddro, d\u00edmero. St\u00e6
  attenti s\u2019o sciortisse de l\u00ec sotta. Me guardan tutti, e se ne rian. Ghe
  scometto, che han tegnuo tutti man all\u2019assassinamento. An-nimo, presto in Rota,
  un Scrivan, l\u2019Avvocato fisc\u00e2, un-na squaddra de sbirri, ra sveggia, re
  forche, ro boja. V\u0153uggio f\u00e2ri appic\u00e2 tutti; e se non tr\u0153uvo
  ri m\u00e6 din\u00e6, m\u2019appicco mi tr\u00e6 votte.\"", "\"Wt/lij/par\u00f2lla\\nL\u00ecgure[edit
  | edit source]\\nEtimolog\u00eea[edit | edit source]\\nDa-o lat\u00ecn volg\u00e2re
  *paraula, da-o lat\u00ecn t\u00e0rdo parabola (\u201cparag\u00f3n; par\u00e0bola\u201d),
  da-o gr\u00eago ant\u00eego \u03c0apaBo\u03bb\u03ae (parabol\u1e17).\\nPron\u00f3n\u00e7ia[edit
  | edit source]\\n- IPA: /pa\u02c8r\u0254lla/\\n- X-SAMPA: [pa\\\"rOlla]\\nN\u00f3mme[edit
  | edit source]\\npar\u00f2lla f (plur\u00e2le par\u00f2lle, diminut\u00eevo parol\u00ecnn-a
  \u00f2 parol\u00e9tta, acrescit\u00eevo parol\u00f3nn-a, pegiorat\u00eevo parol\u00e0ssa)\\n-
  L''unit\u00e6 de lengo\u00e0ggio ci\u00f9 pic\u00ecnn-a che a l''\u00e0 ''n s\u00e9nso.\\n-
  L''unit\u00e6 ci\u00f9 pic\u00ecnn-a de ''na l\u00e9ngoa parl\u00e2 che a l''\u00e0
  ''n scignific\u00e2to particol\u00e2, conp\u00f3sta de un \u00f2 ci\u00f9 so\u00ecn.\\n-
  L''unit\u00e6 ci\u00f9 pic\u00ecnn-a de ''na l\u00e9ngoa scr\u00eeta che a l''\u00e0
  ''n scignific\u00e2to particol\u00e2, conp\u00f3sta de \u00f9nn-a \u00f2 ci\u00f9
  l\u00e9tie.\\n- ''Na s\u00e9rie de l\u00e9tie, sc\u00ecnboli \u00f2 so\u00ecn che
  a se peu conscider\u00e2 ''na c\u00f6sa izol\u00e2, \u00e0nche se a no l''\u00e9
  parte de ''na l\u00e9ngoa o no scign\u00ecfica n\u00ecnte.\\n- O f\u00e6to \u00f2
  l''\u00e0tto do parl\u00e2.\"", "\"A neuva diga foranea a no l\u2019\u00e8 un ponto
  d\u2019arrivo ma a partensa do sviluppo\\nD\u00f2ppo tanti anni finarmente se procede
  co-a progetta\u00e7ion da neuva diga foranea. \u00c0 distansa de 145 anni da quande
  o Ducca De Ferr\u00e6 o l\u2019\u00e0 misso \u00e0 dispoxi\u00e7ion 20 milioin de
  lie pe protezze e rilanci\u00e2 o p\u00f2rto de Zena, e \u00e0 26 da-a riforma di
  enti portuali do 1994, semmo torna davanti \u00e0 unn\u2019occaxon st\u00f2rica
  de repiggio inte l\u2019attivit\u00e6 econ\u00f2mica a ci\u00f9 importante da \u00e7itt\u00e6
  e da region. Gra\u00e7ie asc\u00ec a-i fondi europ\u00ebi do Recovery Fund (500
  milioin in sce a-o manco 1.000 de costo), sai\u00e0 donca poscibile allontan\u00e2
  de \u00e7entan\u00e6a de metri a diga, in particol\u00e2 rispeto a-a z\u00f6na de
  San P\u00ea d\u2019\u00c6\u00f1a, donde no l\u2019\u00e9 gu\u00e6i che l\u2019\u00e9
  st\u00e6to inaugurou o terminal container Bettolo, assegnou in concescion \u00e0
  MSC fin a-o 2045, za costou 250 milioin e restou fermo pe di anni.\\nUn deluvio
  de din\u00e6 pubrichi, che de seguo portian grande benefi\u00e7io \u00e0 chi gestisce
  o trafego di container de quelli terminal e \u00e0 chi ghe fornisce i servi\u00e7i
  access\u00f6i. Ma perch\u00e9 sto sviluppo econ\u00f2mico o se transforme inte un
  progresso so\u00e7iale diffuso no dovemmo vedde o spostamento da diga comme un ponto
  d\u2019arrivo, ma comme un ponto de partensa de un aggiornamento do disegno e de
  capa\u00e7it\u00e6 do p\u00f2rto e do seu rapp\u00f2rto co-a \u00e7itt\u00e6.\\nComme
  o l\u2019\u00e0 sottoliniou giustamente o zeneise Mario Sommariva inta seu primma
  intervista da neo-prescidente do p\u00f2rto da Spezza, \u201cl\u2019unit\u00e0 di
  misura del rendimento di un porto non sono le tonnellate di merci, ma i posti di
  lavoro che genera\u201d. O spostamento da diga per\u00f2 o l\u2019\u00e9 \u00e0
  benefi\u00e7io solo che de un segmento do p\u00f2rto, i terminal container de San
  P\u00ea d\u2019\u00c6\u00f1a, che an un rapp\u00f2rto de addetti pe metro quaddro
  inferi\u00f4 \u00e0 peto de atre attivit\u00e6 comme a navalmeccanica, ch\u2019a
  ghe n\u2019\u00e0 tr\u00e6 v\u00f2tte tanto. De f\u00e6ti, con tutto che o trafego
  via container o segge l\u2019unico che o l\u2019\u00e9 cresciuo insemme a-i passagg\u00ea
  d\u00f2ppo a crixi econ\u00f2mica, questo o no l\u2019\u00e0 megioou l\u2019occupa\u00e7ion
  into p\u00f2rto de Zena, che a l\u2019\u00e9 cresciua solo de l\u20191% in 13 anni.
  In ci\u00f9, o futuo do p\u00f2rto commerciale o l\u2019\u00e9 delongo de ci\u00f9
  con\u00e7entrou inte man de p\u00f6chi, segge da-o lato di lavorato\u00ee, donde
  l\u2019occupa\u00e7ion a l\u2019\u00e9 sempre ci\u00f9 prec\u00e4ia, segge da-o
  lato de impreise, donde i imprendito\u00ee locali an ormai venduo e seu concescioin
  a-e multina\u00e7ion\u00e6 da logistica. O p\u00f2rto o resta formalmente de tutti,
  ma i affari v\u00ebi son st\u00e6ti quelli di priv\u00e6 con costi pubrichi. A ministra
  di transp\u00f2rti a l\u2019\u00e0 de f\u00e6ti promisso de mette i din\u00e6 che
  manca rispeto a-i fondi europ\u00ebi, pe complet\u00e2 l\u2019\u00f2pera. L\u2019investimento
  do stato o resta donca nettamente prevalente. Anche i effetti in sce l\u2019induto
  son sempre ci\u00f9 ac\u00e7entr\u00e6 e bas\u00e6 in sci\u00e2 rendia. O studdio
  de impatto econ\u00f2mico f\u00e6to da-a AdSP o rileva che a filiera portuale a
  genera o 10,8% do val\u00f4 azzonto region\u00e2, ma solo l\u20198,3% de l\u2019occupa\u00e7ion;
  de sto val\u00f4 azzonto o 60,9% o resta \u00e0 l\u2019interno de attivit\u00e6
  portuali e subito der\u00ea o sett\u00f4 ch\u2019o ne trae maggi\u00f4 vantaggio
  o l\u2019\u00e9 quello imobiliare, con o 9,6%, tanto che e attivit\u00e6 profescionali
  ne ott\u00ebgnan solo che l\u20191,2%.\\nZena a p\u00e2 donca destin\u00e2 \u00e0
  unn\u2019economia do post-travaggio, divisa sempre de ci\u00f9 tra i rentier e i
  suscidi\u00e6, divixon no solo econ\u00f2mica, ma anche geografica vista a netta
  distin\u00e7ion tra un Ponente postindustriale e \u00e0 servi\u00e7io da logistica,
  e un Levante \u00e0 voca\u00e7ion turistica e resciden\u00e7iale. insomma, questa
  accelera\u00e7ion spedia do capitalismo tecnol\u00f2gico, incangio che a-o so\u00e7ialismo,
  a l\u2019\u00e9 apreuvo \u00e0 port\u00e2ne verso unna me\u00f1a de neofeudaleximo.
  Esc\u00ec ben che o travaggio o no l\u2019\u00e9 finio: con ars\u00e2 o sguardo
  a-a dimenscion glob\u00e2 o numero de colletti bleu e gianchi o l\u2019\u00e9 in
  crescio constante, semplicemente no ch\u00ec.\\nAloa, tornando a-a diga e sciortindo
  da-a l\u00f2gica picci\u00f1a de an\u00e2 apreuvo solo o container dovi\u00ebscimo
  riflette in sc\u00ea tante opportunit\u00e6 conlaterale che peuan deriv\u00e2 da
  sto sf\u00f2rso de inzegneria e de din\u00e2: se pense pe exempio \u00e0 l\u2019opportunit\u00e6
  de gener\u00e2 energia rinnovabile, co-o m\u00f6to ondoso, e con l\u2019e\u00f2lico,
  a-a poscibilit\u00e6 de sponci\u00e2 o p\u00f2rto verso o m\u00e2 e liber\u00e2,
  \u00f2 a-o manco scistem\u00e2 torna quelle \u00e4ie de confin sofferte, comme longom\u00e2
  Canepa e i dep\u00f2xiti de Mortiou, a-a ne\u00e7escit\u00e6 urgente de ammodern\u00e2
  i spa\u00e7i ILVA garantindo a mascima operativit\u00e6 \u00e0 l\u2019acciaieria,
  ma trovando de neuve scinergie, comme l\u2019\u00e9 st\u00e6to pe-e turbi\u00f1e
  de Ansaldo Energia, e \u00e7erc\u00e2 de trov\u00e2 ciufito che se peu unna z\u00f6na,
  anche feua da-a region, pe organizz\u00e2 un retrop\u00f2rto efficientemente collegou,
  \u00e0 l\u2019opportunit\u00e6 de destin\u00e2 parte di ritorni derivanti da-o crescio
  do commercio verso i territ\u00f6i ci\u00f9 corpii da-e servit\u00f9 industriale
  pe rendili torna vivibili. Che a diga a segge donca un ponto de partensa, no de
  arrivo.\""]'
