sample: '["\"Demoghe sci\u00f9 re s[c]ciappe un bon Cavallo.\\nMa l''\u00e8 un sato
  in tr''un ballo,\\nE za veggo re muse persuase\\nDe scusaro, con d\u00ed: l''\u00e8
  un trotto d''aze.\\nDa puoe s''in quelle case,\\nO boschi dond''Appollo ha ro s\u00f2
  imperio,\\nCelebran dro Cavallo ro misterio,\\nS''adoran ro misterio\\nDro Cavallo
  re muse, cr\u00e9 me vuoeggio\\nCh''ancon quello dell''aze gh''impe l''oeggio.\\nSonetto\\nRa
  marotia, ra cura, o testamento,\\nE ra morte dell''aze havei descrito\\nSci\u00f3
  Giurian, e havei cos\u00ec ben dito,\\nChe ben v''intende qua se vuoeggie fuoento.\\nRo
  parl\u00e1 vostro puro comme argento,\\nFa gust\u00e1 ro piccante, e l''erudito,\\nCh''havei
  caccio\u00f9 in questo vostro scrito,\\nOnde st\u00e9 in pruoeva a forza d''argomento.\\nSe
  in l''aze vuoi mettei tanta prudenza,\\nChe vanto puo\u00e9 daremmo a ri serpenti;\\nChe
  son prudenti per commun sentenza.\\nL''aze no, ma sei vuoi ch''havei ri denti,\\nPer
  adent\u00e1 chi ha poca conscienza,\\nE cognosce ri furbi, e ri leventi.\"", "\"Venerd\u00ec
  24 de mazzo do 2019: po\u00eaxie, tiatro, manifesta\u00e7ioin e youtuber\\nSta v\u00f2tta
  chi \u00f2 proposto pe-a tradu\u00e7ion in zeneize tr\u00e6 c\u00f6se coioze. Ti-\u00ea
  chi.\\nArcobal\u00e9n e archin\u00e7\u00ea.\\nO pertuzo de l\u2019agoggia (cruna
  in italian) in zeneize o se ciamma fo\u00e0mme.\\nA par\u00f2lla italiann-a carrucola
  a se tradue t\u00e0ggia. A c\u00f6sa coioza a l\u2019\u00e9 che de s\u00f2lito t\u00e0ggia
  o l\u2019\u00e9 o nomme d\u00e6to a-a c\u00f2rda da destende.\\nDurante a trasmiscion
  l\u2019\u00e9 sciortio feua de c\u00f6se interesanti. Intanto o nomme Claudio che
  a l\u2019antiga o se diva Cr\u00f2udio. P\u00f6i o nomme zeneize do Monte Reale
  ch\u2019o l\u2019\u00e9 Mont\u00ee\u00e2 (a \u2018i\u2019 a va dita longa; donque
  a pronon\u00e7ia a l\u2019\u00e9 differente da monti\u00e2 = monter\u00e0, salir\u00e0).
  L\u2019\u00e9 st\u00e6to anche dito a beliscima esprescion dev\u00easan ch\u2019a
  l\u2019\u00e9 \u2019na metatexi de d\u00eavan \u00ease (devono essere). Emmo parl\u00f2u
  do segag\u00ecn (falciatore) e da fienagi\u00f3n (fienagione).\\nConcluddo co-o
  \u00e7it\u00e2 i do\u00ee zoeni youtuber, \u00f2spiti da trasmiscion, che mettan
  e seu c\u00f6se in sci\u00f4 can\u00e2 Jordan Verallo, che se son inpegn\u00e6 a
  trov\u00e2 in m\u00f2ddo, da mette in sce Youtube e ch\u2019o fon\u00e7ionn-e, pe
  mette co\u00e6 a-i zoeni de inprende o zeneize. Tanti ouguri!\\nAlegri!\"", "\"Erodoto\\nEr\u00f2doto
  (gr. \u201bHp\u03cc\u03b4oto\u03c2, lat. Herod\u014ftus). - Storico grego (Alicarnasso
  tra 490 e 480 a. C. - Atene 424 circa).\\nO fu esule a Samo, da p\u0153u o torn\u00f2
  in patria quande caze'' a tirannide, e de l\u00ec o se rec\u00f2 a Atene, dove o
  conobbe e o l''ammir\u00f2 Pericle e o fu amigo de Sofocle; da Atene o s''allontan\u00f2
  pe piggi\u00e2 parte a-a fonda\u00e7ion da colonia panellenica de Turii (446 \u00f2
  444) e pe i so molti vi\u00e6gi (a Samo, into Ponto, in Traxa, in Macedonia, in
  Cirenaica, in Egitto e inte l''impeo Perscian; questi doi urtimi into 448 circa);
  l''\u00e8 controverso se Erodoto o l''agge visto pe davei tutti i paixi descriti:
  foscia o complet\u00f2 i so apponti de vi\u00e6gio con de notizie desonte da de
  fonte scrite.\\nL''\u0153uvia storica de Erodoto a fu divisa inte 9 libbri da-i
  grammatichi Lusciandrin; tarda a l''\u00e8 a denomina\u00e7ion di libbri co-o nomme
  de n\u0153uve Muse.\\nDoppo o proemmio in sce-e origine mitiche da lotta fra Axia
  e Oropa,\\no libbro 1\u00b0 o contegne a stoia di Liddi e di Perscien scin a-a morte
  de Ciro,\\no 2\u00b0 a stoia de l''Egitto scin a-a sottomiscion de questo a Canbise,
  success\u00f4 de Ciro.\\nO 3\u00b0 o nara a stoia do regno de Canbise e da p\u0153u
  de Daio scin a-a so spedi\u00e7ion scitica. Questa a l''\u00e8 compreisa, co-ina
  digrescion in sce-i Sciti,\\ninto 4\u00b0, ch''o nara asc\u00ec a spedi\u00e7ion
  do satrapo Ariande contra \u00c7ire\u00f1e con digrescioin in sce-a stoia de \u00c7ire\u00f1e
  e da Libbia.\\nO 5\u00b0 o nara a rebellion di Ioni scin a-a morte de Aristagora
  con de longhe digrescioin in sce-a stoia de Sparta e Atene.\\nInto 6\u00b0 l''\u00e8
  narao a sottomiscion da Ionia e e impreize di Perscien contra a Grecia scin a-a
  battaggia de Maato\u00f1a.\\nO 7\u00b0 o comprende a spedi\u00e7ion de Serse scin
  a-a battaggia de Termoppile.\\nInte l''8\u00b0 gh''\u00e8 e battagge de l''Artemixio
  e de Salami\u00f1a scin a-o termine do primmo anno da gu\u00e6ra,\\ne into 9\u00b0
  e battagge de Platea e de Micale scin a-a preisa de Sesto.\\nA spieg\u00e2 l''ampiezza
  e o numero de digrescioin inte l''\u0153uvia de Erodoto, s''\u00e8 pensao che o
  l''avesse composto de tratta\u00e7ioin separ\u00e6 (\u03bb\u03ccYo\u03b9) in sce-i
  scingoli popoli, da p\u0153u fuse no troppo abilmente inte un''\u0153uvia continnoa
  (A. Sch\u00f6ll, A. Bauer). Di atri invece ritegnan che o motivo condutt\u00f4 o
  foise una stoia da Perscia e di vari popoli che fun in contatto con quella e che
  da p\u0153u o cian de l''\u0153uvia o mutesse scin a trasform\u00e1se inte ''na
  stoia da lotta tra Greghi e barbai, quande o successo de parte za composte in sce-e
  gu\u00e6re grego-perscia\u00f1e o spinse l''aot\u00f4 a po\u00f1e in particol\u00e2
  resato queste lotte che occupan a meit\u00e6 circa de l''intrega \u0153uvia (G.
  De Sanctis). Comme fonte scrite Erodoto o \u00e7itta in doi soli l\u0153ughi Ecateo;
  ma o riporta in tante \u00f3caxoin di informa\u00e7ioin or\u00e6. Pe a battaggia
  de Salami\u00f1a influin \u00e7ertamente i \\\"Perscien\\\" de Eschilo. De ciu,
  di documenti epigraffichi, epigrammi, oraccoli fun de seguo doeuvi\u00e6 da Erodoto
  che into complesso o l''attinse sorvetutto a-a tradi\u00e7ion or\u00e2. De fronte
  a-e tradi\u00e7ioin Erodoto, p\u00f9 astegnindose da una critica espli\u00e7ita,
  o l''esercita effettivamente inta sele\u00e7ion m\u00e6xima de quelle, t\u00e1votta
  solo in base a di motivi esteio\u00ee e sentiment\u00e6.\\nErodoto o riconosce a
  grandioxit\u00e6 de vittoie greghe, ma into complesso l''epopea na\u00e7ion\u00e2
  ellenica, pe-a qu\u00e6 i Greghi vin\u00e7ettan i Perscien, a-o lascia freido. O
  sentimento da superiorit\u00e6 da civilt\u00e6 grega in sce-a barbarica o manca
  in Erodoto tanto che i antighi m\u00e6ximi o ciammon \\\"filobarbao\\\". A l''\u00e8
  invece ci\u00e6a a tenden\u00e7a politica de Erodoto a glorific\u00e2 Atene e i
  Atenieixi ch''o conscidera liberato\u00ee da Grecia, rappresentando invece into
  moddo ciu odioso i so avversai inta gu\u00e6ra do Peloponneso: Tebe e Corinto. No
  cosc\u00ec avverso o l''\u00e8 a-i Sparten di qu\u00e6 o riconosce a prodezza, p\u00f9
  tendendo a mettili in cattiva luxe a peto di Atenieixi. I concetti religioxi de
  Erodoto son soventi contraddittoi: de votte i miti son ra\u00e7ionalizz\u00e6, di
  atre Erodoto o se mostra estremamente credulo de fronte a di oracoli, prodixi e
  s\u0153unni profetichi. Caratteristega a l''\u00e8 l''importan\u00e7a ch''o d\u00e0
  a l''invidia divi\u00f1a (\u03d5\u03d1\u03ccvo\u03c2 \u03d1e\u1ff6v) a qu\u00e6
  a l''intervegne pe umili\u00e2 o mort\u00e2 che troppo o s''inna\u00e7a.\\nO dialetto
  ionico o l''ofre a Erodoto un mezo de esprescion ricco e malliabile inte un stile
  semplixe ch''o l'' amma a paratasci ciu che l''ipotasci, sen\u00e7a frexi, ma con
  una malia ch''a fa de l''\u0153uvia storica una lettua attraentiscima. O pregio
  artistego de so stoie, fu d\u00eeto, o l''\u00e8 inte l''unit\u00e6 de interesse
  uman e into ritmo narrativo co-o qu\u00e6 o va aproeuvo a-i f\u00e6ti, e battagge,
  i aneddoti e e scingolarit\u00e6 di costummi e de lezze.\\nO so retr\u00e6to co-a
  barba idealizzao o l''\u00e8 noto da varie coppie de un origin\u00e2 creao doppo
  a morte. Inte l''erma de Nappoli, iscrita, o l''\u00e8 accobbiao a Tucidide.\"",
  "\"L\u00e8ngoa ligure antiga\\nL''Ant\u00eego L\u00ecgure a l''\u00eaa unn-a l\u00e9ngoa
  parl\u00e2 da-i L\u00ecguri Ant\u00eeghi. Gh''\u00eaa varie f\u00f3rme distinte
  da-e varie provinse d''ancheu de Zena, Spesa, Sann-a e Imperia.\\nGh''\u00e9 d\u00f4e
  teor\u00eee in sci\u00e2 nat\u00fba da L\u00e8ngoa L\u00ecgure Ant\u00eega. A primma
  a l''\u00e9 a teor\u00eca de l''origine \\\"anaria\\\": p\u00e2 che o l\u00ecgure
  de quella v\u00f2tta no f\u00efse ''na l\u00e9ngoa europea, ma ch''a segge vegn\u00fba
  da-e l\u00e9ngoe che se parlavan into Mediterraneo primma de l''ar\u00eevo di Indeuropei.
  Nino Lamboglia o l''\u00e9 st\u00e6to \u00fbn di primmi a scr\u00eeve ''sta teor\u00eea.
  L''\u00e4tra a l''\u00e9 a teor\u00eea de l''or\u00ecgine \\\"celtica\\\"; a L\u00e8ngoa
  L\u00ecgure Ant\u00eega a sai\u00e9va ariv\u00e2 in Italia co'' i Celti into V secolo
  a.C.\\nPar\u00f2lle[mod\u00ecfica | mod\u00ecfica wikit\u00e8sto]\\nArcunn-e par\u00f2lle
  de L\u00ecgure Ant\u00eego:\"", "\"Antonio Gramsci\\nAntonio Gramsci (Ales, prov.
  de Cagliari, 22 Zenn\u00e4 1891 - Romma, 27 Arv\u00ef 1937) o l'' \u00e8 st\u00e6to
  un politico e intellettuale, segretaio do Partio Comunista d'' Italia dao 1924 ao
  1927.\\nBiografia[C\u00e0ngia | modifica sorgente]\\nNasci\u00fco da famiggia p\u00f2via,
  de re\u00e7ente origine albaneise da-a parte paterna (o discendeiva da un prof\u00fcgo,
  scappou dall'' Epiro a causa de un-a guera, comme l\u00eb maeximo o dixe in te unna
  de s\u00f6 Lettere dao car\u00e7ere), o l'' ha posci\u00fco frequent\u00e2 l'' \u00dcniverscit\u00e6
  de Torin grassie a un-a borsa de st\u00fcddio. Da p\u00f2co avanti l''inissio da
  Primma Guera mondiale o lascia i st\u00fcddi pe d\u00e2se a-a politica. Insci''a
  stampa so\u00e7ialista o l''inissia a p\u00fcbblic\u00e4 scr\u00eeti, fra i quali
  ghe n''\u00e8 anche de critica teatrale. O l'' \u00e8 fra i promotoi di Conseggi
  de fabbrica torineixi. Int''o 1919 insemme a Palmiro Togliatti o fonda o giorn\u00e2
  \\\"Ordine Nuovo\\\". A Livorno int''o 1921 Gramsci o l'' \u00e8 tra i fundatoi
  do Partio Comunista. In seguito, o se reca in Ruscia dove o conosce o Lenin e dove
  o se sposa con Giulia Schucht da-a quae o l''avi\u00e2 dui figgi. Torn\u00f2u in
  patria do 1924, o l'' \u00e8 eletto dep\u00fctou e o fonda o quotidian L'' Unit\u00e0.
  A novembre do 1926 o vegne arrestou e condannou da-o Tribunale Speciale fascista
  a 24 anni de prexon. I atti do pro\u00e7esso rivelen l''assol\u00fca infondatessa
  de accuse de sedission; Gramsci o l'' \u00e8 st\u00e6to imprexon\u00f2u solo perch\u00e8
  Mussolini o l''aeva ordinou: bez\u00f6gna imped\u00ef a questo \u00e7ervello de
  funsionn\u00e4 pe armeno dex''anni. In prexon a Turi e a Civitavecchia, a seu salutte
  a l''e sempre p\u00ebzo. In te i \u00fcrtimi tempi da seu vitta ghe vegne permisso
  de c\u00fcrase int''a clinica romann-a Quisisana, dove o concl\u00fcdde a seu existensa.
  Malgraddo e difficolt\u00e6 o riesce, anco in prixion, a impegn\u00e4se int''o st\u00fcddio
  e int''e l''analisi, comme testim\u00f2nnian i testi scr\u00efti inte quelli anni,
  che spassien inte n''infinit\u00e6 d''argomenti politici e st\u00f2rici.\\nI scr\u00efti[C\u00e0ngia
  | modifica sorgente]\\nE Lettere dal carcere son prin\u00e7ipalmente un documento
  uman, pe quante notevole, ma a filosofia do Gramsci a vegne esposta prin\u00e7ipalmente
  int''i Quaderni dal Carcere, sarv\u00e6 grazie a-a dedission da c\u00fcgn\u00e2
  Tatiana Schucht. O Gramsci o l'' ha inserio o marsismo int''a tradission italiann-a,
  e se confrontava co-i problemmi concreti da nostra nassion e e seu reixe storiche.
  Quando o riconosce i meriti a-o storicismo do Benedetto Croce, o Gramsci o se ne
  destacca profondamente quando o fa not\u00e2 che quella do pensat\u00f6 napolitan
  a l'' \u00e8 un-a filosofia speculativa, dao carattere metafixico. Ao materialismo
  dialettico marxista e leninista Gramsci o l''azzunze a teoria dell''egemonia, che
  differensia classe dominante e classe dirizente. A diression a permette de costru\u00ef
  o dominio; se a classe dominante a perde a capa\u00e7it\u00e6 de dirize, a s\u00f6
  egemonia a va in crizi. Porri\u00e4 continu\u00e2 o dominio pe un \u00e7erto tempo,
  ma int''o v\u00f6u de diression che se sai\u00e4 creou gh''\u00e8 z\u00e1 i prez\u00fcpposti
  pe a rivolussion. In rapp\u00f2rto a \u00e4tre interpetrassioin do marxismo, de
  longo dogmatiche e meccani\u00e7istiche, a do Gramsci a se caratterizza pe sei sempre
  attenta a-a realt\u00e6 e ae differense st\u00f2riche, nassionai, curt\u00fcrai,
  comme se vedde presempio int''o gi\u00fcdissio crittico che o l''ha dou a prop\u00f2zito
  do livro de Bucharin Insc''a teoria do materialismo st\u00f2rico. O Gramsci, ch''o
  ripiggia o Machiavelli, o vedde o partio rivolussionario comme un Moderno Principe,
  intendendo cosci che l''assion politica a deve sei o ris\u00fcltou de un st\u00fcddio
  s\u00e7ientifico da realt\u00e6 dove se opera.\\nBibliografia[C\u00e0ngia | modifica
  sorgente]\\n- A. Gramsci, Lettere dal carcere, Palermo 1996\\n- A. Gramsci, Quaderni
  dal carcere, Torin 2007\\n- N. Bobbio, Saggi su Gramsci, Milan 1990\"", "\"Giuseppe
  Conte\\nGiuseppe Conte (Volturara Appula, 8 ag\u00f3sto 1964) o l''\u00e9 ''n politico
  e giur\u00ecsta italian. O l''\u00e9 o vint\u00eaximo-n\u00f6no Prescidente do Conseggio
  di Ministri Italian e cappo do g\u00f4verno itali\u00e0n da-o 1 de z\u00fbgno 2018.
  O s\u00eau g\u00f4verno o l''\u00e9 st\u00e6to sostegn\u00fbo da-o Movimento 5 Stelle[1]
  e da-a L\u00e9ga N\u00f2rd[2] da-o 1 de z\u00fbgno 2018 a-o 5 de sett\u00e9nbre
  2019 (G\u00f4verno Conte I), m\u00e9ntre da-o 5 d\u00ea settenbre 2019 a-a giorn\u00e2
  d''ancheu o l''\u00e9 sostegn\u00fbo da-o Movimento 5 St\u00e9lle, da-o Part\u00eeo
  Democratego (Partito Democratico), da L\u00ecberi e P\u00e6gi (Liberi e Uguali,
  LEU), da It\u00e0lia V\u00eeva e da \u00fbnna p\u00e2rte do Gr\u00fbppo M\u00e9sccio
  (G\u00f4verno Conte II).\"", "\"Lezze\\nLezze\\nIndi\u00e7e\\nDritocangia\\nDrito
  constitu\u00e7ion\u00e2cangia\\nIn via gener\u00e2, l\u2019atto de un organo (monocratico
  \u00f2 collegi\u00e2) investio da cosc\u00ec dita fon\u00e7ion legislativa. A differen\u00e7a
  da consoetuddine, ch''a nasce spontaniamente inta societ\u00e6, a lezze a l''\u00e8
  un atto voentaio, caratterizao da-a generalit\u00e6 e da l''astrate\u00e7\u00e7a,
  saiv''a d\u00ee da-o f\u00e6to ch''a l''agge di destinatai indetermin\u00e6 (generalit\u00e6
  comme impersonalit\u00e6) e da-o f\u00e6to ch''a segge suscetibbile d''ese apric\u00e2
  un nummero indefinio de votte, inte tutti i caxi rentranti inta previxon normativa
  (astrate\u00e7\u00e7a comme ripetibilit\u00e6).\\nA lezze a l''\u00e8 st\u00e6ta
  conscider\u00e2 a fonte do drito pe antonomaxa; inte ''na prospettiva giuspoxitivistega,
  an\u00e7i, o drito o s''identifichi\u00e6 co-a lezze. Storicamente, a l''ha ricoverto
  un rollo importante inte l''ambito de desp\u00e6ge esperien\u00e7e giuriddiche,
  sciben che l''\u00e8 solo con l\u2019et\u00e6 moderna che s''\u00e8 affermao l\u2019idea
  da lezze comme fonte primaia. Inte l''ambito de l''esperien\u00e7a roma\u00f1a,
  de f\u00e6to, a lex a se contraponeiva a i atre fonte do drito (qu\u00e6 l\u2019interpretatio
  prudentium e i mores), sciben vadde aregordao che, mentre inta Repubbrica e into
  Prin\u00e7ipato o termine o l''ea riservao escluxivamente a-e delibia\u00e7ioin
  di asembree popol\u00e6, into tardo impeo, invece, con l\u2019esprescion leges,
  d\u0153uvi\u00e2 in contrapoxi\u00e7ion a iura, s''indicava e constitu\u00e7ioin
  imperi\u00e6. Questo duppri\u00e7e aspetto (democratego e assolutistego) o transp\u00e2
  da doi notti brocardi, un de Gaio (lex est quod populus iubet atque constituit),
  l\u2019atro de Ulpian (quod principi placuit legis habet vigorem). Asc\u00ec inte
  l''ambito de l''esperien\u00e7a mediev\u00e2, a lex, qu\u00e6 atto voentaio, a se
  contraponeiva a l''interpretatio e a-a consuetudo. Otr''a \u00e7o, se ritegniva
  che questa a no fois''atro che deciarativa da lezze divi\u00f1a.\\nCo-a forma\u00e7ion
  di Stati moderni e a rivendica\u00e7ion do monopollio do poei legislativo qu\u00e6
  atributo da sovranit\u00e6, a lezze a v\u00e8gne a fonte suprema do drito, in quante
  inmedi\u00e2 manifesta\u00e7ion da voent\u00e6 do sovran (esprescion de questa preminen\u00e7a
  son, prez., l\u2019art. 1 e seg. de dispoxi\u00e7ioin prelimin\u00e6 a-o codi\u00e7e
  \u00e7iv\u00ee italian do 1942). Co-o superamento de monarchie assolue e l\u2019avento
  do Stato liber\u00e2 de drito, a poxi\u00e7ion da lezze into scistema de fonte a
  no cangia, percose a-a voent\u00e6 individo\u00e2 do monarca se sostituisce a voent\u00e6
  gener\u00e2 da na\u00e7ion (\u00f2 do poppolo) ch''a s''esprimme trammite questa
  (cfr. l\u2019art. 6 da D\u00e9claration des droits de l\u2019homme et du citoyen
  do 1789; l\u2019art. 4 da D\u00e9claration des droits de l\u2019homme et du citoyen
  do 1793; l\u2019art. 6 da D\u00e9claration des droits de l\u2019homme et du citoyen
  do 1795), tant\u2019\u00e8 che se p\u0153u parl\u00e2 do Stato de drito do 19\u00b0
  sec. comme de ''n Stato legislativo, saiv''a d\u00ee de ''na forma de Stato incentr\u00e2
  in sce l''assolua preminen\u00e7a da lezze gener\u00e2 e astr\u00e6ta, produto da
  libbera discuscion parlament\u00e2. Emblemattiche, in questo senso, son st\u00e6te
  i anallixi de O. B\u00e4hr, R. von Mohl, J. Bentham e de B. Constant. Tuttavia,
  con l\u2019avento de Constitu\u00e7ioin reddene e do scindacato de constitu\u00e7ionalit\u00e6
  de lezze, a lezze a l''ha perso importan\u00e7a, a fav\u00f4 da m\u00e6xima Constitu\u00e7ion,
  e \u00e7erti studioxi son zonti a aferm\u00e2 che e lezze saieivan tutte vincol\u00e6
  a-o fin de realiz\u00e2 a Constitu\u00e7ion: a legisla\u00e7ion, quindi, a no sai\u00e6
  ciu ''na fon\u00e7ion libbera, ma discre\u00e7ion\u00e2, scindacabbile da-a Corte
  constitu\u00e7ion\u00e2 pe i eccesci de poei che ne porieivan vi\u00e7i\u00e2 a
  legittimit\u00e6.\\nUn urtei\u00f4 fatt\u00f4 ch''o l''ha contribuio a trasform\u00e2
  a fon\u00e7ion legislativa into corso do 20\u00b0 sec. a l''\u00e8 st\u00e6ta a
  grado\u00e2 perdia di caratteri tippichi de generalit\u00e6 e astrate\u00e7\u00e7a,
  e a-o dilag\u00e2 de cosc\u00ec dite lezze-provedimento: a prasci italia\u00f1a,
  in particol\u00e2, a l''ha visto i\u00f1umieivi caxi de discipri\u00f1e legislative
  tranxitoie e retroattive, nonch\u00e9 de lezze d''intervento ponto\u00e2 inti raporti
  econommichi, de lezze contegninte di programmi delimit\u00e6 into tempo, \u00f2,
  a-a dreitua, de lezze sostan\u00e7ialmente ad personam. T\u00e2 prasci, nonostante
  e crittiche manifest\u00e6 da parte da dotri\u00f1a \u2013 presempio, da V. Crisafulli
  \u2013 a no l''\u00e8 st\u00e6ta avers\u00e2 da-a giurispruden\u00e7a constitu\u00e7ion\u00e2,
  pe quante con\u00e7erne a legisla\u00e7ion, segge stat\u00e2 che region\u00e2, a
  qu\u00e6 a l''ha amisso asc\u00ec a poscibilit\u00e6 di espropia\u00e7ioin ope legis.
  D\u2019atra parte, a perdia di caratteri de generalit\u00e6 e astrate\u00e7\u00e7a
  da lezze a l''ea st\u00e6ta individo\u00e2 da di studioxi \u2013 tra i qu\u00e6
  H.J. Laski, Neumann e Forsthoff \u2013 comme conseguen\u00e7a inevitabbile do passaggio
  da-o Stato liber\u00e2 de drito a-o Stato democrattico de massa.\\nDrito interna\u00e7ion\u00e2
  e comunitaiocangia\\nReciam\u00e2 ciu votte into tittolo III, cappo I, art. 13-17,
  da lezze 218/1995, a lezze strangea a l''asumme relevan\u00e7a con rifeimento a-a
  tecnica do rimando, disciprin\u00e2 a l''art. 13 da lezze \u00e7it\u00e2. Quande
  inti articcoli succescivi da lezze l''\u00e8 reciamao a lezze strangea, se tegne
  conto do rimando \u0153uviao da-o drito interna\u00e7ion\u00e2 privao strang\u00ea
  a-a lezze de ''n atro Stato: 1) se o drito de t\u00e2 Stato o l''a\u00e7etta o rimando;
  2) se se tratta de rimando a-a lezze italia\u00f1a. L\u2019aprica\u00e7ion de t\u00e2
  dispoxi\u00e7ion a l''\u00e8 tuttavia escruza inti caxi inti qu\u00e6 segge e parte
  a \u00e7erne a lezze strangea ch''a sai\u00e2 a l\u00f4 apric\u00e2 (art. 13). O
  scistema de drito interna\u00e7ion\u00e2 privao o stabilisce o prin\u00e7ippio de
  l''inguan\u00e7a tra a lex fori e a lezze strangea. L\u2019a\u00e7ertamento da lezze
  strangea o l''\u00e8 comp\u00edo d\u2019\u00f3f\u00ec\u00e7\u00e7io da-o giuddi\u00e7e
  (art. 14). Quante stabilio a l''art. 14 o se reconliga a-o poei-dovei do giuddi\u00e7e
  d''a\u00e7ert\u00e2 d\u2019\u00f3fi\u00e7\u00e7io e circostan\u00e7e che giustiffican
  l\u2019aprica\u00e7ion da lezze strangea: se cosc\u00ec no foise, sai\u00e6 comme
  atribo\u00ee a-e parte a facort\u00e6 de \u00e7erne e norme strangee apricabbile.
  A t\u00e2 fin questo o p\u0153u vaise, otra che di strumenti indic\u00e6 da-e conven\u00e7ioin
  interna\u00e7ion\u00e6, de informa\u00e7ioin aquixie pe o trammite do ministeio
  de Gra\u00e7\u00e7ia e giusti\u00e7\u00e7ia; o p\u0153u atresci interpel\u00e2 di
  esperti \u00f2 institu\u00e7ioin specializ\u00e6. Se o giuddi\u00e7e o n''ariesce
  a a\u00e7ert\u00e2 a lezze strangea indic\u00e2, manco con l\u2019agiutto de parte,
  o l''apprica a lezze reciamm\u00e2 mediante di atri critei de conligamento eventoalmente
  previsti pe a m\u00e6xima ipottexi normativa. In mancan\u00e7a s''apprica a lezze
  italia\u00f1a. A lezze strangea a l''\u00e8 interpret\u00e2 segondo i prin\u00e7ippi
  interpretativi de l''ordenamento a-o qu\u00e6 a norma a l''apartegne (art. 15).
  O giudi\u00e7e italian o l''\u00e8 tegnuo quindi a apric\u00e2 a lezze strangea
  comme fai\u00e6 o giuddi\u00e7e de l''ordenamento d''apartenen\u00e7a. D''atro canto,
  a lezze strangea a no l''\u00e8 apric\u00e2 se i so effetti son contrai a l''orde
  pubbrico (art. 16). O rifeimento o l''\u00e8 a l''orde pubbrico interna\u00e7ion\u00e2
  ch''o l''impedisce e turbative do nostro ordenamento derivante da l''aprica\u00e7ion
  de norme strangee contraie a-i prin\u00e7ippi fondament\u00e6 de l''ordenamento
  italian. No se tratta, quindi, de ''n giudi\u00e7\u00e7io de valuta\u00e7ion in
  sci\u00e2 lezze \u00e2tr\u00fbi, bensci in sc\u00ee effetti che questa a p\u0153u
  avei in ambito interna\u00e7ion\u00e2. In scintexi, se a norma ch''a l''apartegne
  a l''ordenamento giuridico strang\u00ea a conten di prin\u00e7ippi che no p\u0153uan
  ese apric\u00e6 into nostro ordenamento giuriddico, a dev''ese dezapric\u00e2. De
  conseguen\u00e7a, in t\u00e2 ipottexi s''apprica a lezze reciam\u00e2 mediante di
  atri critei de conligamento previsti pe a m\u00e6xima ipottexi normativa. In mancan\u00e7a
  de t\u00e6 conligamenti se deve necessaiamente apric\u00e2 a lezze italia\u00f1a.
  L''\u00e8 f\u00e6to sarvo a prevalen\u00e7a de norme italia\u00f1e che, in conscidera\u00e7ion
  do so ogetto e do so scopo, dev''esan apric\u00e6 nonostante o reciammo a-a lezze
  strangea (art. 17). Infin, a lezze strangea a l''\u00e8 d\u0153uvi\u00e2 into regime
  di raporti patrimoni\u00e6 tra conniugi e pe quante concerne a sepaa\u00e7ion person\u00e2
  e a solu\u00e7ion do matrimonio. O regime di rapporti patrimoni\u00e6 fra coniugi
  regolao da ''na lezze foresta o l''\u00e8 \u00f3pon\u00ecbbile a-i ter\u00e7i solo
  se questi n''aggian avuo conoscen\u00e7a \u00f2 l''aggian ignorao pe so corpa. Relativamente
  a-i driti reali insce di ben inmobbili, l\u2019oponibilit\u00e6 a l''\u00e8 limit\u00e2
  a-i caxi inti qu\u00e6 s\u00e6 st\u00e6to rispetao e forme de pubri\u00e7it\u00e6
  prescrite da-a lezze do Stato into qu\u00e6 i ben s''atr\u0153uvan (art. 30, 1).
  A separa\u00e7ion person\u00e2 e a solu\u00e7ion do matrimonnio, quande no seggian
  previsti da-a lezze strangea apricabbile, son regol\u00e6 da-a lezze italia\u00f1a
  (art. 30, 2).\\nDrito canonnegocangia\\nO drito canonnego o l''\u00e8 caratterizao
  da-a conforma\u00e7ion da lezze, unitaiamente conscider\u00e2, inte doi groppi de
  norme: e norme de drito uman e e norme de drito divin. T\u00e6 norme p\u0153uan
  ese eman\u00e6 comme lezze scrita (ius scriptum) \u00f2 comme consoetuddine (ius
  non scriptum). E norme scrite son indri\u00e7\u00e6 a-a comunit\u00e6 comme ''n
  comando (iussum) in vista do ben comun di fedeli, unitaiamente conscider\u00e6 (propter
  bonum subditorum) e no za in conscidera\u00e7ion do vantaggio che ne p\u0153u deriv\u00e2
  a l''aotorit\u00e6 ch''a-o l''ha d\u00e6to. A lezze canonnega a p\u0153u ese proman\u00e2
  solo da ''n sogetto idonnio a d\u00e2la (legitimi principis). Circa l\u2019ogetto
  da lezze canonnega no vigge un prin\u00e7ippio gener\u00e2 ch''o ne fisse in assoluo
  i contegnui speciffichi; tuttavia, into Codi\u00e7e de drito canonnego existe de
  norme che riaferman pe scingole mateie a competen\u00e7a da Gexa, prez. pe quant''aten
  a discipri\u00f1a do matrimonnio di battez\u00e6 (can. 1073), l\u2019acatto e l\u2019aministra\u00e7ion
  di ben tempor\u00e6, l\u2019institu\u00e7ion de sc\u0153ue d''ogni orde e grao (can.
  800).\\nPe quanto ategne a l''obrigatoiet\u00e6, l''\u00e8 sogetto a-e lezze puamente
  eclexasteghe (non includente i precetti de drito divin) i battez\u00e6 inta Gexa
  catollica (cosc\u00ec dito criteio ecclexologgico, ch''o l''escludde i membri de
  comunit\u00e6 crestia\u00f1e non catolliche) che godan de suffixente uzo de raxon
  (cosc\u00ec dito criteio psicologgico) e aggian compio o settimo anno de et\u00e6
  (criteio cronologgico). De norma, no s''amette ignoran\u00e7a \u00f2 er\u00f4 circa
  a lezze canonnega, ma l''\u00e8 tuttavia scuzabbile l\u2019er\u00f4 de f\u00e6to
  (scin a pr\u0153uva do contraio), sarvo pe e lezze inabilitante \u00f2 irritante
  (can. 15).\\nA lezze canonnega a vegne port\u00e2 a conoscen\u00e7a di sogetti a-i
  qu\u00e6 a l''\u00e8 indri\u00e7\u00e2 a traverso a promurga\u00e7ion (can. 8) e
  l\u2019inser\u00e7ion inti atti da Sedia Apostollica (Acta Apostolicae Sedis commentario
  officiali, AAS), ch''a g''ha val\u00f4 asc\u00ec comme pubrica\u00e7ion. Questa
  a l''intra in vig\u00f4 solo doppo trei meixi da-a so promurga\u00e7ion (periodo
  de vacatio legis), sarvo che a lezze m\u00e6xima a prevedde desp\u00e6gio terme
  (ciu \u00f2 meno breve).\\nA lezze canonnega a l''\u00e8 effica\u00e7e into tempo
  e into spa\u00e7\u00e7io. Quanto a-o primmo aspetto, pe questa v\u00e2 o prin\u00e7ippio
  gener\u00e2 de l''inretroattivit\u00e6, sarvo e derroghe espresse into can. 9. Circa
  l\u2019effica\u00e7it\u00e6 into spa\u00e7\u00e7io, e lezze univers\u00e6, vallide
  pe tutti i fedeli, ovunque s''atr\u0153uvan, se distingoan da-e lezze particol\u00e6,
  che se prezumman apricabbile solo sciu base teritoi\u00e2 e non person\u00e2, into
  senso che l''\u00e8 sogetto a-a lezze de ''n determinao teritoio (a diocexi) i fedeli
  che gh''aggian o domi\u00e7illio \u00f2 o squ\u00e6xi domi\u00e7illio e contempoa\u00f1iamente
  se ghe tr\u0153uvan de f\u00e6to. No son tegnui a l''oservan\u00e7a de queste norme
  foresti e nomadi \u00f2 vagabondi.\\nA lezze canonnega a l''\u00e8 sogetta a interpreta\u00e7ion,
  ch''a l''\u00e8 dita aotentica s''a proma\u00f1a da-o legislat\u00f4, particol\u00e2
  se posta in ese da l''aotorit\u00e6 aministrativa in sce ''n scingolo caxo, e dotrinaia
  s''a p\u0153u d\u00e2 l\u0153ugo a ''n\u2019evento\u00e2 consoetuddine. De norma
  a lezze canonnega a p\u0153u ese abrog\u00e2 da ''na lezze posteri\u00f4; l\u2019abroga\u00e7ion
  a se dixe espressa (can. 20) quande a n\u0153uva lezze a l''aferma espli\u00e7itamente
  che a precedente a l''\u00e8 abrog\u00e2 (derogatio), ta\u00e7\u00e7ita quande risurta
  incompatibbile con quest\u2019urtima \u00f2 quand''a discipri\u00f1a ex novo e de
  mainea integrale tutta a mateia ogetto da lezze precedente (abrogatio). A lezze
  univers\u00e2, a meno che no segge espressamente previsto, a no derroga aff\u00e6to
  e lezze particol\u00e6 \u00f2 speciale. Into dubbio a lezze preexistente a no se
  prezumme mai abrog\u00e2 e, pe quante poscibbile, a dev''\u00ease armoniz\u00e2
  co-a precedente norma\u00e7ion.\\nFixica e filozofiacangia\\nNorma da-a qu\u00e6
  l''\u00e8 regolao un determinao f\u00e6to \u00f2 fenommeno natur\u00e2. Into lenguaggio
  scientiffico, lezze a l''\u00e8 a preciza\u00e7ion do moddo co-o qu\u00e6, in de
  determin\u00e6 circostan\u00e7e, saiv''a d\u00ee poste determin\u00e6 caoze, se
  ripete \u00e7erti fenommeni comme effetto de quelle. Questo l''\u00e8 veo segge
  che a lezze a se riferisce solo ch''a-i aspetti qualitativi do ligamme (lezze qualitativa)
  segge ch''a se traduxe inte ''na rela\u00e7ion quantitativa intercorente tra grande\u00e7\u00e7e
  che intervegnan inti fenommeni conscider\u00e6 (lezze quantitativa). Una lezze a
  p\u0153u esprimme de rela\u00e7ioin de natua astr\u00e6ta e gener\u00e2 (lezze asciomattiche
  che no descendan da di enon\u00e7i\u00e6 ciu generali: prez., a lezze de inverse
  inta logica matematica); opp\u00f9 de rela\u00e7ioin de ciu \u00f2 meno diretta
  deriva\u00e7ion speriment\u00e2 (lezze empiighe: prez., a lezze de van der Waals;
  lezze statisteghe: prez., a lezze de distribu\u00e7ion di erro\u00ee). Se ''na lezze,
  qualunque segge a so natua e a so origgine, a g''ha validit\u00e6 gener\u00e2 a
  ri\u00e7eive o nomme de prin\u00e7ippio, mentre l''\u00e8 ciu apropiao parl\u00e2
  de lezze quande questa a g''ha ''n contegnuo ciu restreito (prez., lezze di gaz
  perfetti). A lezze a l''\u00e8 otr''a \u00e7o ''na condi\u00e7ion, \u00f2 ''n insemme
  de condi\u00e7ioin, a-e qu\u00e6 deve sodisf\u00e2 di determin\u00e6 enti \u00f2
  grande\u00e7\u00e7e: prez., una lezze oaia imposta a-o moto de ''n ponto, a lezze
  de ''na for\u00e7a ecc.\\nSci ben che remonte originaiamente a-o pensceo grego l\u2019idea
  che o mondo natur\u00e2, in analogia con quello uman, o segge governao da de lezze,
  l''\u00e8 soltanto in eppoca moderna che nasce o concetto de lezze natur\u00e2,
  inteiza comme rela\u00e7ion constante (a l''uzo formul\u00e2 matematicamente) tra
  di fenommeni distinti \u00f2 tra aspetti de ''n m\u00e6ximo fenommeno, a qu\u00e6
  scoverta a rapresenta o compito speciffico da scien\u00e7a. Caratteristega de ''na
  lezze natur\u00e2 a l''\u00e8 l\u2019universalit\u00e6, oss\u00e6 o so ese vallida
  sen\u00e7a ecce\u00e7ioin pe ''na totalit\u00e6 de caxi de ''n \u00e7erto ambito.
  Se e lezze scientiffiche seggian asc\u00ec provviste de necescit\u00e6, otra che
  d''universalit\u00e6, o l''\u00e8 problema variamente dibattuo. D. Hume, e qu\u00e6
  texi han influen\u00e7ao gran parte de conce\u00e7ioin poxitivisteghe \u0153utto\u00e7entesche
  e n\u0153uve\u00e7entesche, o negava recizamente l\u2019existen\u00e7a de ''na connescion
  necessaia tra di eventi da-a qu\u00e6 succescion constante s''origini\u00e6 l\u2019idea
  de ''na rela\u00e7ion caozale: e lezze caosale esprimieivan soltanto de regolarit\u00e6
  empiighe. Insci-\u00e2 base de l''anallixi humia\u00f1a, A. Comte, J.S. Mill e i
  empiristi contempoa\u00f1ei han consciderao e lezze natur\u00e6 (caosale e no caosale)
  comme di aser\u00e7ioin ch''esprimman nint\u2019atro che de concomitan\u00e7e regol\u00e6
  ricavabbile empiricamente e enon\u00e7iabbile trammite de conrela\u00e7ioin fon\u00e7ion\u00e6,
  non ascimilabbile a di asser\u00e7ioin mod\u00e6 de necescit\u00e6. Nonostante arcu\u00f1e
  influente texi in sci\u00f4 carattere conven\u00e7ion\u00e2 de lezze scientiffiche
  (specce de E. Le Roy) \u00f2 in sci\u00e2 so natua de rela\u00e7ioin scimbolliche,
  ni vee ni fase, ma soltanto ciu \u00f2 meno adegu\u00e6 a esprimme \u00e7erti d\u00e6ti
  speriment\u00e6 (P. Duhem), e discuscioin c''han avuo ciu vasta eco inta filozofia
  da scien\u00e7a do N\u0153uve\u00e7ento son st\u00e6te quelle interne a-o neopoxitivismo,
  e se deve a C.G. Hempel e E. Nagel i magio\u00ee tentativi pe defin\u00ee a no\u00e7ion
  de lezze scientiffica.\\nLenguistegacangia\\nDa-o 19\u00b0 sec. o concetto de \u2018lezze\u2019
  (tod. Gesetz) o vegne d\u0153uviao, metaforicamente, into campo da lenguistega storica
  pe indic\u00e2 ''n sviluppo de natua regol\u00e2 e scistematica, privo dunque d''ece\u00e7ioin,
  tranne quelle spiegabbile comme effetto de di condi\u00e7ionamenti particol\u00e6.
  Una lezze a p\u0153u rifeise a qualunque sett\u00f4 de ''na lengua, da-a fonologia
  (lezze fonetica) a-a morfologia e a-a scintasci (prez. a lezze de Wackernagel pe
  l\u2019ind\u0153\u00fcropeo antigo \u00f2 a lezze Tobler-Mussafia pe e lengue roman\u00e7e).\\nA
  lezze fonettica (ted. Lautgesetz) a constitoisce o tipo ciu frequente e importante
  de lezze lenguistega. A codiffica di sviluppi fonologgichi regol\u00e6 \u2013 \u2018ineccepibbili\u2019
  inta defini\u00e7ion di Neogramattichi \u2013 into corso de l''evolu\u00e7ion storica
  de ''na lengua \u00f2 into passaggio da ''na fase preistorica a u\u00f1a document\u00e2.
  Tra e ciu notte de ciu che 20, individu\u00e6 inte lengue indo\u0153\u00fcropee,
  gh''\u00e8 e lezze de Grimm, rifeie a-e ocluxive germa\u00f1iche, a lezze de Grassmann,
  ch''a l''interessa i aspi\u00e6 greghe e sanscrite, a lezze de Lachmann, che into
  latin a reggola a quantit\u00e6 vocallica inti parti\u00e7ippi perfetti. Verso a
  fin do 19\u00b0 sec. l\u2019ineccepibilit\u00e6 de lezze fonetiche a fu revoc\u00e2
  in dubbio da romanisti e dialetolloghi, a part\u00ee da H. Schuchardt, insci-\u00e2
  base de l''inregolarit\u00e6 e da varia\u00e7ion tippiche de lengue e dialetti roman\u00e7i;
  anc\u0153u se p\u0153u ritegn\u00ee, con W. Belardi, che e lezze fonettiche no seggian
  un tr\u00e6to univers\u00e2, ma tr\u0153uvan ina motiva\u00e7ion a l''interno de
  speciffiche struttue lenguisteghe, comme quelle de lengue indo\u0153\u00fcropee
  antighe.\\nReligioncangia\\nInte l''Antigo Testamento, o concetto de lezze o g''ha
  ''n scignificao \u00easen\u00e7ialm\u00e8nte religiozo, comme insemme de norme rivel\u00e6
  direttamente da D\u00ea a-o poppolo ebraico; in particol\u00e2 in questo l''\u00e8
  d\u00e6to o nomme de T\u014dr\u0101h \u00f2 lezze a-o Pentate\u00fcco, into qu\u00e6
  l''\u00e8 contegnuo a parte fondament\u00e2 de queste norme. D\u2019atra parte t\u014dr\u0101h
  o g''ha an\u00e7itutto o scignificao de \u2018insegnamento\u2019 (per ecelen\u00e7a)
  e lezze inte di caxi o l''\u00e8 scinonnimo de Sacra Scritua: Salmi 1; 19, 8-15
  e 119. Into Pentate\u00fcco a lezze quindi, sen\u00e7a distingue tra sacro e profan,
  a no contegne solo de dispoxi\u00e7ioin regolatrixe di rapporti umoen, ma an\u00e7itutto
  a definisce i rapporti tra Yahweh e Israele, ligandose streitamente a l''idea de
  \u2018patto\u2019 \u00f2 \u2018alian\u00e7a\u2019 tra D\u00ea e o so poppolo. A
  s''esprimme daprimma oralmente, de man in man, in sce di caxi particol\u00e6, pe
  o trammite di sacerdoti e di profeti; quindi a vegne redatta pe tappe succescive
  fin a-a codifica\u00e7ion into c\u00e0nnone biblico, assumendo progrescivamente
  un carattere assoluo.\\nContra l\u2019assolutizza\u00e7ion da lezze polemizza indirettamente
  Gexo inti Vangeli: segge con l\u2019adot\u00e2 di comportamenti de gran libert\u00e6
  ap\u00e8 de institu\u00e7ioin (o sabbo, o divor\u00e7io, o Tempio) e de perso\u00f1e
  giudic\u00e6 impue da-a lezze (levroxi, samariten, pubrichen ecc.) segge co-o subordin\u00e2
  a lezze a-a predica\u00e7ion do regno de D\u00ea e a l''acugen\u00e7a da so m\u00e6xima
  perso\u00f1a. Da parte so Paolo, oponendose a-i giud\u00ea-crestien che favan coexiste
  a fe'' in Cristo con l\u2019oservan\u00e7a da T\u014dr\u0101h, o tratta espli\u00e7itamente
  o tema de l''inutilit\u00e6 da lezze e di \u0153uvie da questa comand\u00e6 into
  processo da giustifica\u00e7ion denanti a D\u00ea (Gal. 2,16; Rom. 3,28): \u00abO
  terme da lezze o l''\u00e8 Criste\u00bb (Rom. 10,4).\\nReferen\u00e7ecangia\\nwww.treccani.it\"",
  "\"Monegheximo\\nMonegheximo - complesso fenommeno religiozo pe-o qu\u00e6, inte
  magio\u00ee religioin, di individdoi s''alonta\u00f1an da-a consueta vitta sociale,
  pe realiz\u00e2 into moddo ciu completo i prin\u00e7ippi da fe'' in vitta solitaia
  (anacoretismo) \u00f2 in vitta de comunit\u00e6 (cenobitismo).\\nTipi de monegheximo[C\u00e0ngia
  | modifica wikitesto]\\nInte l''induismo se riscontra segge o fenommeno de l''anacoretismo,
  pe-o qu\u00e6 di scingoli individdoi se retian a vive in solitudine dedicandose
  a-a contempla\u00e7ion e a-a mortifica\u00e7ion da carne, segge quello do cenobitismo,
  a l''uzo intorno a ''n meistro de vitta sprito\u00e2 che, co-a renon\u00e7ia do
  mondo, o l''aseg\u00fbe a sarve\u00e7\u00e7a a-i discippoi. Questi devan pratic\u00e2
  povert\u00e6 e vitta itinerante rifugiandose inti monest\u00ea solo in caxo de necescit\u00e6.
  O monest\u00ea jainistego o se destacca da l''induismo pe mao scistemati\u00e7it\u00e6
  organizativa: i mo\u00f1eghi jainisti (s\u0101dhu), dopp''in periodo d''ini\u00e7ia\u00e7ion,
  vivan in convento sotta a guidda de ''n meistro de vitta sprito\u00e2. Fra i an\u00e7ien
  vegne eletto un cappo aministrativo e disciprin\u00e2 (\u0101ch\u0101rya), a-o qu\u00e6
  ogni mo\u00f1ego o l''\u00e8 tegnuo a f\u00e2 a so confescion.\\nO monest\u00ea
  o costituisce a spi\u00f1a dors\u00e2 do buddismo, fando remont\u00e2 a so origgine
  a-o Budda m\u00e6ximo ch''o l''a\u00e7et\u00f2 fra i so monneghi de gente d''ogni
  casta sociale, rendendo a tutti poscibbile a perfe\u00e7ion monastega co-a prattica
  da povert\u00e6, a renon\u00e7ia a-i ben monden e a medita\u00e7ion. In origine
  viventi in cabanne \u00f2 in caverne, i mo\u00f1eghi budisti han da p\u0153u construio
  di monest\u00ea, di qu\u00e6 molti \u00e7ellebri pe riche\u00e7\u00e7a, bele\u00e7\u00e7a
  artistega e sci\u00f1a pe possan\u00e7a politica. Pe l\u2019intr\u00e2 inta vitta
  monastega o buddismo o l''exigge, co-o consenso di genito\u00ee pe i mino\u00ee,
  a sola espli\u00e7\u00e7ita recesta, doppo a qu\u00e6 l\u2019aspirante, ammisso
  a ''n periodo de novi\u00e7iato, o renon\u00e7ia a ogni so possesso, a l''inf\u0153ua
  de ''na copetta e trei sai (a l''uzo de c\u00f4 giano). I so voti, per\u00f2, e
  i so impegni no son mai inrevocabbili, percose o monego buddista o l''\u00e8 delongo
  libero de torn\u00e2 a-o mondo.\\nInto crestianeximo, o monest\u00ea o l''ebbe e
  so primme gren esprescioin inte l''anacoretismo de s. Antogno, meistro in Egitto
  de ''na gran quantit\u00e6 d''ermitti, a-i qu\u00e6 s''ascianca pe importan\u00e7a
  e nummero di discippoi o cenobitismo de s. Pacomio inte l''ata Tebaide durante o
  4\u00b0 secolo. A ter\u00e7a importante manifesta\u00e7ion do monest\u00ea ciu antigo
  fun e laore bizanti\u00f1e. Tutte queste forme exigeivan o completo destacco da-o
  mondo e ''na severa discipri\u00f1a de vitta (zazun prolongao, astinen\u00e7ia da-i
  \u00e7ibbi carnei, perfetta castit\u00e6). Diffuzose inte l''Axia Min\u00f4, o monest\u00ea
  o ghe pigi\u00f2 p\u00ea, specce inta forma cenobittica, da qu\u00e6 o ciu gran
  teorico o fu san Baxiio de Cezarea, e o l''ebbe pe seccoli ''na noteive scioitua,
  curmin\u00e2 inti gren monest\u00ea de Costantinoppoli e inta complessa organiza\u00e7ion
  monastega do Monte Athos. Importao da l''Oriente a-a fin do 4\u00b0 sec., o monest\u00ea
  otra ch''a Romma, pe l\u2019exempio e l\u2019impurso de san Gi\u0153umo, o s''aferm\u00f2
  in Itallia, in Gallia, in Affrica, in Spagna, in Irlanda. A tutte queste forma\u00e7ioin
  monasteghe impoze lentamente, ma tena\u00e7emente e dueivemente, a so impronta a
  reggola de san Beneito che, continoando a megio tradi\u00e7ion do monest\u00ea orient\u00e2,
  a se ne distingue per\u00f2 nettamente pe a so modera\u00e7ion inte prattiche ascettiche,
  pe l\u2019acento\u00e2 capa\u00e7it\u00e6 organizativa, pe l\u2019importan\u00e7a
  d\u00e6ta a-a preghea canonnega, pe l\u2019obrigo da stabilit\u00e6 do mo\u00f1ego
  into monest\u00ea, ma mascime pe-o riconoscimento de l''importan\u00e7a do travaggio
  segge mano\u00e2 (travaggio agricolo) segge inteleto\u00e2 (studdio, transcri\u00e7ion
  di codexi). Inti secoli o monest\u00ea beneitin, pu arestando identico a l\u00ea
  m\u00e6ximo inte so linnie fondament\u00e6, o l''ha saciuo adatt\u00e2se a i exigen\u00e7e
  storriche che de votta in votta han imposto de riforme. Cosc\u00ec, contra o relasci\u00e2se
  da discipri\u00f1a monastega fin da-o 779 s. Beneito d\u2019Aniane o reize ciu severo
  l\u2019ascetismo da reggola beneiti\u00f1a. Inti primmi dexenni do 10\u00b0 sec.
  invece, pe costito\u00ee ''na sada unit\u00e6 contra o prepoei da fe\u00fcdalit\u00e6
  laica, Cluny, desligandose da-a dipenden\u00e7a da-i veschi e sottoponendose direttamente
  a-a Curia roma\u00f1a, o l''origin\u00f2 a riforma clunia\u00e7ense. A questa se
  contrapoze da p\u0153u o movimento \u00e7ister\u00e7ense, ch''o l''ebbe o so ciu
  ato esponente in san Benardo de Ciaravalle. Riforma do monest\u00ea beneitin son
  i cam\u00e2do\u00e8ixi e i \u00e7ertoxin, senscibbili a i exigen\u00e7e de l''ermitismo,
  i vallombrozen ecc.\\nReferen\u00e7e[C\u00e0ngia | modifica wikitesto]\\nwww.treccani.it\"",
  "\"no bes\u0153ugna d\u00e2 mente \u00e0 re lengue catt\u00ede, e \u00e0 quelli
  che \u00e7ercan de pre\u00e7ipit\u00e2 ri ommi dra m\u00e6 f\u00e6ta con dre box\u00ede
  e dre farsit\u00e6; prech\u00e8 bes\u0153ugner\u00e6 tagli\u00e1ghene un parmo,
  e ci\u00f9 un semezzo.\\nGhig. Re cattive lengue, n\u00e8? pi\u00e7\u00e7afron!
  No t''h\u00f2 trovao sci\u00f9 ro f\u00e6to, che ti me scannavi un-na pegora?\\nMart.
  In m\u00e6 zuramento, l''ho ama\u00e7\u00e7\u00e2 prech\u00e8 na o morisse, sci\u00f4.\\nGhig.
  O che birbo! che mascar\u00e7on! amma\u00e7\u00e7\u00e2ra perch\u00e8 a no morisse?\\nMart.
  Sci\u00f4 s\u00ec, prech\u00e8 a no morisse de marott\u00eda, prech\u00e8 in t\u00e2
  caxo bes\u0153ugna sotterr\u00e2ra \u00e0 ro c\u00e1\u00e7iggion d\u2019un \u00e6rboro,
  pre f\u00e2ne liamme, sci\u00f4 patron; e pre questo gi ama\u00e7\u00e7o primma
  ch''i m\u0153uran.\\nGhig. (contrafacendolo) Gi ama\u00e7\u00e7o avanti chi m\u0153uran..
  treit\u00f4, assassin.. bestie, che me fan ra lan-na da f\u00e2 ri panni, che \u00e0
  ri gonzi ghe vendo per Inghilterra \u00e0 un pe\u00e7\u00e7o ro parmo.. l\u00eavateme
  davanti, mascar\u00e7on, laddro, \u00e7ento vinti pegore in un meize.\\nMart. Ve
  sconzuro, sci\u00f4 patron, ch\u2019i guastavan ri atre, credeime.\\nGhig. Ti te
  n''accorzer\u00e6 doman davanti \u00e0 ro P\u00f3ist\u00e6..\\nMart. Sci\u00f4 patron
  caro, ve porressi content\u00e2 d''aveime scciappao ra tiesta e rotto gi osse\"",
