  ajnfachowo7, cho\u0107 niyftorych moge przestarszy\u0107 mlyko kokosowe abo pasta
  curry, ale dzisiaj take rzeczy to idzie kupi\u0107 we ko\u0142\u017cdym8 wiynkszym
  sklepie, a smak, jaki potyn m\u014dmy, je niy do opedzynia9 \ud83d\ude09 Co potrza?
  500 [\u2026]\\nZarozki1 trza2 pedzie\u01073, \u017ce tak po pro\u0142wdzie4 to \u017cech
  niy sprawdzo\u0142, czy w tym mojim gorku b\u014d\u0142a5 kura abo kokot, ale jakosik
  mi te miano tak lepi pasowa\u0142o- niyftorzi6 by pedzieli: licentia poetica. Apfylziny
  ju\u017c na same sp\u014dmniynie7 nos8 rozgrzywaj\u014dm bez te dyszczowe9, jesiynne
  abo zimowe dni. A zo\u0142za10 je tak dobro, \u017ce nawet talyrz [\u2026]\\nSz\u0142o
  by pedzie\u01071, \u017ce to s\u014dm2 take krewetki choby3 po grecku, bo wciep4
  \u017cech tam ty\u017c trocha fety. Z krewetk\u014dma niy ma kans5 roboty, a do
  tego jeszcze s\u014dm zdrowe. A szpinat\u2026 dlo niyftorych6 bajtli7 to taki trocha
  bebok8 i jo\u0142 ty\u017c musza pedzie\u0107, \u017ce jak \u017cech go kedyj\u015b
  na jakyj sto\u0142\u014dwce dosto\u0142, to do [\u2026]\\nJak sie tak sp\u014dmna1,
  jake b\u014d\u0142o2 moje ulubi\u014dne jedzynie za bajtla3, to na zicher4 b\u014d\u0142y
  to buchty u \u014d\u0142my5 Albiny, a d\u014d nich zawsze b\u014d\u0142 ty\u017c
  k\u014dmpot ze jagod\u014dw. Moja Muter ich niy robi\u014d\u0142a, bo pada\u0142a6,
  \u017ce ro\u0142z zrobi\u014d\u0142a i jyj niy wysz\u0142o i ju\u017c jakosik tak
  przesta\u0142a pr\u014dbowa\u0107. Mie7 sie na te buchty zbiyra\u0142o [\u2026]\\nBania
  idzie odmiynia\u0107 bez wszyjske przipadki i miysza\u0107 ze wszyjskimi warzyw\u014dma1
  i przipraw\u014dma, kere2 W\u014dm3 przid\u014dm4 do gowy. Po\u0142ra5 zup\u014dw
  ze bani\u014dm ju\u017c \u017cech sam6 wciep7, ale ta lista baje8 jeszcze dugo9.
  Ta zupa je tak prosto do zrobiynia, \u017ce nawet kucho\u0142rze ze dw\u014dma lewymi
  rynkami byd\u014dm10 umieli j\u014dm narychtowa\u010711. Do\u014212 \u017cech sam
  ziel\u014dno\u0142 pasta [\u2026]\\nTo je1 zupa, kero2 mogecie3 bez lato zrobi\u0107
  ze \u015bwiy\u017cych t\u014dmat\u014dw4, a bez zima bydzie5 to nojlepsze sp\u014dmniynie6
  lata. Je fajnie ar\u014dmatyczno, gibko7 sie j\u014dm robi, a do tego mogecie trocha
  poszpanowa\u0107, jak przidzie do Wo\u0142s bezuch8 i zaserwowa\u0107 im zupa ze
  apfylzin\u014dm9\u2013 keby10 W\u014dm sie chcia\u0142o, mogecie jeszcze j\u014dm
  przistroi\u0107 takim ma\u0142ym \u015blizykym11 apfylziny. [\u2026]\"", "\"Ajax
  Amsterdam\\nAjax Amsterdam (uoficjalno abrewjacyjo AFC Ajax) \u2013 to je \u0144iderlandzki
  fusbalklub ze Amsterdamu kery d\u017aer\u017cy erbizna po klubje Union Amsterdam
  (1883-1896)[2]. Uod rok\u016fw 60. XX st. mo nojwiyncy titl\u016fw we \u0143iderlandach.
  Ajax sztyry razy wygro\u0142 UEFA Champions League, 33 razy b\u016f\u0142 majstrym
  \u0143iderland\u016fw, a 18 razy wygro\u0142 puhar u\u016fnygo kreju[3].\\nUod 1996
  roku Ajax d\u016fmowe szpile gro na Amsterdam ArenA.\\nTre\u015b\u0107\\nFarby[edytuj
  | sprowjej zdrz\u016fd\u0142o]\\nPjyrwy fusbalorze Ajaxu byli uoblyczy\u0144i na
  czorno-czyrwj\u016fno. Terozki s\u016fm to bjo\u0142e hymdky ze czyrwj\u016fnym
  pasym, a druge uoblyczy\u0144i je modre[4].\\nProducentym stroj\u016fw Ajaxu je
  fyrma Adidas uod 2000 roku, a szponsorym uod pa\u017ad\u017aer\u0144ika 2008 fyrma
  AEGON[5]\\nGyszichta[edytuj | sprowjej zdrz\u016fd\u0142o]\\nWe 1883 roku za\u0142o\u017c\u016fno
  fusbalklub uo mja\u0144e Union Amsterdam, \u0144yskorzi zmjy\u0144\u016fno mjano
  manszaftu na Footh-Ball Club Ajax. We klubje tym grali yno karlusy sztela. Klub
  tyn przetrwo\u0142 yno do 1896, bo regjyr\u016fnek Amsterdama zlikwidowo\u0142 szpilplac.\\nAtoli
  18 marca 1900[1] Floris Stempel za\u0142o\u017c\u016f\u0142 uod nowa klub, kery
  mjanowo\u0142 \u015be Amsterdamse Voetbal Bond Ajax (AVB Ajax) i u\u016fn uosto\u0142
  pjyrszym prezesym tego manszaftu. 29 wrze\u015bnia 1900 roku rozegrali pjyrszy szpil.
  W 1906 roku Ajax Amsterdam wygro\u0142 pjyrwsze trofeum - tur\u0144ej uo Z\u0142oty
  Krzi\u017c (Gouden Kruis). We 1908 dosz\u0142o do fuzji ze manszaftym uo mja\u0144e
  Holland i postanowj\u016fno zmjy\u0144i\u0107 mjano na Amsterdamsche Football Club
  Ajax. We 1911 roku postowj\u016fno szat\u0144e, a Stadj\u016fn m\u016fg\u0142 p\u016fmje\u015b\u0107i\u0107
  ju\u017c 10000 lud\u017a\u016fw. We tym samym roku awansowali do nojwy\u017cszej
  ligi, nale dwa lata \u0144yskorzi \u015b \u0144ij \u015ble\u0107eli.\\n1 lipca 1915
  roku trynerym zosto\u0142 Anglik John \\\"Jack\\\" Reynolds. Nojpjyrw awansowo\u0142
  do nojwy\u017cszej ligi i wygro\u0142 Puhar \u0143iderland\u016fw, a potym zdob\u016f\u0142
  5 majstr\u00f3w \u0143iderland\u016fw. We: 1919, 1920, 1931, 1937 i 1939. Po woj\u0144e
  we 1947 Ajax, kerego trynerem b\u016f\u0142 Reynolds, za\u015b zdob\u016f\u0142
  majstra[6].\\nWe 1957/1958 Ajax rozegro\u0142 pjyrwsze szpile we Puharze Ojropy,
  kaj uodpadli we \u0107wyr\u0107finale. We pjyrszej halbje lot 60. pracowo\u0142o
  sztyrych tryner\u016fw: Vic Buckingham, Keith Spurgeon, Joseph Gruber a Jack Rowley.
  We roku 1962 wygroli Puhar Intertoto graj\u016fnc we finale s Feyernoordym Rotterdamym,
  a 28. moja 1969 Ajax gro\u0142 szpil we Finale Puharu Majstr\u016fw na Estadio Santiago
  Bernab\u00e9u ze AC Milanym, nale przegroli 1:4. We 1972 roku wygrali Puhar Europy
  ze Interym Medjolan, a rok \u0144yskorzi powt\u016frzyli sukces a wygrali we finale
  ze Juventusym.\\nWe latach 80. szczeg\u016flnym uo\u015b\u016fng\u0144yn\u0107ym
  b\u016f\u0142o wygra\u0144e Fina\u0142u Puharu Zdobywc\u00f3w Puhar\u016fw 13 moja
  1987. Trynerym b\u016f\u0142 Leo Beenhakker.\\nW 1991 roku trynerym zosto\u0142
  Louis van Gaal. W 1992 zdob\u016f\u0142 Puhar UEFA, a we 1995 i 1996 wygro\u0142
  ze Ajaxem Liga Majstr\u00f3w. We sez\u016f\u0144e 1996/1997 Ajax przeklud\u017a\u016f\u0142
  \u015be na Amsterdam ArenA, a ze manszaftu uodesz\u0142o wiela kluczowych fusbalok\u016fw,
  takich kej: Finidi George, Nwankwo Kanu, Edgar Davids i Michael Reiziger. Po tym
  sez\u016f\u0144e uodszed\u0142 van Gaal.\\nWe XXI w. Ajax bestowo\u0142 uodnosi\u0107
  sukcesy, a trynerzy czynsto \u015be zmjy\u0144ali. D\u016fminowa\u0107 zacz\u016fn
  PSV Eindhoven. Nale we sez\u016fnie 2005/2006 zdobyli Puhar \u0143iderland\u00f3w,
  a we 2011 i 2012 roku Ajax zosto\u0142 majstrym \u0143iderland\u016fw ze trynerym
  Frankiem de Boer, kery je trynerym do dzi\u015boj. Je u\u016fn downym fusbalokem
  Ajaxu i FC Barcel\u016fny[2][7].\\nKibice[edytuj | sprowjej zdrz\u016fd\u0142o]\\nWe
  czasach II wojny \u015bwjatowej fusbalplac Ajaxu b\u016f\u0142 blisko dzielnicy
  \u017cydowskij. Skuli tego terozki kibice wywieszaj\u016fm fany ze Gwjozdami Dawida
  i mjan\u016fjom swoich fusbalok\u016fw: \\\"Joden! Joden!\\\" (\u015bl. \u017bydzi!
  \u017bydzi!)[8].\\nRywalym Ajaksu uod wjelu lat je Feyenoord Rotterdam. Szpile Ajaxu
  ze Feyenoordem Rotterdam s\u016fm nojciekawszymi szpilami we Eredivisie mjanowane
  Klassieker[9]. Uostatnimi laty wa\u017cnymi szpilami dla Ajaxu s\u016fm ty\u017c
  szpile ze PSV Eindhoven, kere \u0144yroz decyduj\u016fm uo majstru \u0143iderland\u016fw.\\nChronologijo
  tryner\u016fw[edytuj | sprowjej zdrz\u016fd\u0142o]\\nChronologiczny spis tryner\u016fw
  Ajaxu uod 1910 roku [10]\\nNojwjyncyj tor\u016fw we lidze we farbach Ajaksu[edytuj
  | sprowjej zdrz\u016fd\u0142o]\\nStan na 27 sierpnia 2010[4]\\nNojwjyncyj szpil\u016fw
  we lidze we farbach Ajaksu[edytuj | sprowjej zdrz\u016fd\u0142o]\\nStan na 27 sierpnia
