  moja \u014c\u0142ma ze [\u2026]\"", "\"Ojropa to je nojmy\u0144szy ze Gaileowych
  k\u015byn\u017cyc\u016fw Jowisza. B\u016f\u0142 u\u016fn uodkryty uod Galilea we
  1610 r., bez optikru\u00f9a, kero s\u016fm sk\u016fnsztruowo\u0142. Jego mjano bjere
  \u015be uod Ojropy, kero we mitologiji b\u016f\u0142a libst\u016fm uod Jowisza.
  Te mjano nado\u0142 Simon Marius, cho\u0107a Galileo mjo\u0142 ganc inksze idyje.
  Mjarkuje \u015be, i\u017ce pod lodow\u016fm powjyrzch\u0144\u016fm k\u015byn\u017cyca
  je uocyan wody, kery \u0144y zamarzo, bo je uogrzywany skuli tar\u0107o gynerowanego
