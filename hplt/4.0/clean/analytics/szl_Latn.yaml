sample: '["\"\u015awjynto noc Noc sie ju\u017c zrobi\u0142a Gwjozdeczki blyskaj\u00f3m
  Jozef i Maryja W Betlejym mjyjsca szukaj\u00f3m Wszyndzi je ciasnota Do nich mjyjsca
  ni ma Co terozki poczn\u00f3m Jak ju\u017c noc i cima Kaj\u015b tam kole mjasta
  Szopka uwidzieli Chocio\u017c je niechersko \u0141odpoczynek byd\u00f3m mjeli Nie
  twa\u0142o to wjela Ani\u00f3\u0142 \u0142oznajmuje \u017be P\u00f3nb\u00f3czek
  s nieba Na \u015bwjat [\u2026]\\nRozma\u0144ci ludzie P\u00f3nb\u00f3czek mo rozma\u0144to
  rasa Jedyn je szpetny,a inkszy sama krasa S\u00f3m tacy co poradz\u00f3m mi\u0142owa\u0107
  A inksi yno drugich szterowa\u0107 S\u00f3m tacy co drugim pomogaj\u00f3m I tacy,co
  sztyjc szkamraj\u00f3m Jedni by inkszych w \u0142y\u017cce wody utopili Cho\u0107by\u015b
  pod i tak by cie smolili Ludzie i ludziska na \u015bwjecie mjyszkaj\u00f3m Bo s
  P\u00f3mb\u00f3czka woli [\u2026]\\nZW\u00d3NTPIYNIE W nocy mi \u015bniy\u0142a
  sie jako\u015b pla\u017ca, na mokrym piosku widza dwa \u015blady. Dwa, bo\u015b
  Ty przi mnie, kludzisz pod pa\u017ca, boch jes niymocny, niy dow\u00f3m rady. Z
  co\u0142kigo \u017cycio widza \u0142obrozki na ekranie nieba, tak choby w kinie.
  \u0141od narodzynio, a\u017c do terozki, a w ko\u017cdyj chwili, Ty \u017ce\u015b
  b\u00f3\u0142 przi mie! [\u2026]\\nMojimu bratu Mja\u0142a jo braciszka Braciszka
  jednego Ale wziyna go Bozinka Do domka swojego Cho\u0107 jeszcze bu\u0142 m\u0142ody
  I mjo\u0142 sam wygody Zostawj\u00f3\u0142 mateczka I swo cha\u0142upeczka Na niebo
  zagl\u00f3nd\u00f3m Gwjozdki tam wygl\u00f3nd\u00f3m Mo\u017cno to braciszek ? Posy\u0142o
  mi kusiczek ! Chocio\u017c tynskno za nim To je taki \u017cyci Pjyrsze sie rodzicie
  Potym \u0142odchodzicie Urszula [\u2026]\\nDobry Bo\u017ce Dobry Bo\u017ce ,prosza
  Ciebje Ty\u015b wysoko je tam,w niebje Tu na ziymja sie podziwej ! I anio\u0142o\u00f3w
  n\u00f3m posy\u0142ej ! Co by n\u00f3m sam pomoga\u0142y I \u0142od z\u0142ego \u0142ochrania\u0142y
  Bo tu tela pokuszynio ! Czartowego je zwodzynio ! \u0141o P\u00f3nbuczku ! ty sie
  zlituj ! I ko\u017cdego do sia przytul ! Bo cz\u0142ek [\u2026]\\nSen o Aniele Gdy
  spa\u0142am Anio\u0142a we \u015bnie widzia\u0142am Cudna posta\u0107 by\u0142a
  jego Nie mog\u0142am oderwa\u0107 wzroku swego Cho\u0107 wszystko tylko si\u0119
  \u015bni\u0142o My\u015bla\u0142am,\u017ce realne to by\u0142o To dotyk mi nieznanego
  Tak bardzo wesz\u0142o do serca mego A gdy rano si\u0119 obudzi\u0142am Otoczona
  niebia\u0144sk\u0105 mi\u0142o\u015bci\u0105 by\u0142am I to ju\u017c we mnie zosta\u0142o
  Bo w sercu [\u2026]\"", "\"Popularne rymy do\\nRymy do klejnotach\\nAbbotach, agorotach,
