  http://english.ajax.nl/web/show/id=47817\"", "\"DZIYN WSZYSTKICH SWIYNTYCH Jak co
  roku, tak i dzisiej swiyntujymy Dziyn Zmarlych. W tyn szczegolny dziyn wspominomy
  naszych Bliskich, Przijocieli i Znajomych, kerzy odeszli. Kozdy z nos musiol kedys
  pozegnac kogos kochanego, kozdy z nos przezywol zaloba w sercu. Piyrwy laziolo sie
  na kerchow, strojolo groby zielonymi astami, stowialo kwiotki i swiyciolo swiyczki,
  blank normalne [\u2026]\\nPrzemijanie Trzimej sie tato Dekom usnytych li\u015bci
  przikryty idzie spa\u0107 kiyrchow \u0107mokiym kolybany, chocio\u017c tu pusto
  przi \u015bwiy\u017cym grobie stoji som jedyn fest zastarany. I wto mu tera wczas
  rano podo gorkigo tyju szolka na \u015bniodani, i ciep\u0142e \u017cym\u0142y prosto
  \u0142od piekorza, powiy: stary stowej do\u015b tego spanio . \u0141osto\u0142 som
  jak ta sztacheta w [\u2026]\"", "\"Dw\u00f3ch kumpli:- A ty si\u0119 czujesz Europejczykiem?-
  A sk\u0105d, w og\u00f3le.- Ale przecie\u017c urodzi\u0142e\u015b si\u0119 w Europie.-
  I co z tego. Jak si\u0119 kura w stajni urodzi, to te\u017c nie znaczy, \u017ce
  jest koniem Haaaaa(*-*)\\nLatowy wjecz\u00f3r S\u0142\u00f3neczko idzie ku zachodowi
  Kaj\u015b kryje sie ju\u017c za lasym Na niebje chmurki p\u0142ywaj\u00f3m Szumne
  farby dowaj\u00f3m Cichutko i bez wjaterku Ptoszki na str\u00f3mach \u015bpjywaj\u00f3m
  Z wjeczora ,jak to z wjeczora \u0141uzaj\u015b kopruchy lotaj\u00f3m Cho\u0107 s\u0142\u00f3nko
  ju\u017c spa\u0107 wandruje Ziymja \u0142okrywo ju\u017c \u0107mok Wjecz\u00f3r
  sie pjykny rychtuje Posiedzie\u0107 ,pogoda\u0107 by\u015b m\u00f3g Korzystej s
  [\u2026]\\nCiotki Moja ciotka Tila dobro gospodyni \u0142ona siedzi na wysiadach
  a gowjyd\u017a mo w siyni A ciotka Zaleczka kupi\u0142a se beczka kapusta w ni ukisi\u0142a
  ale ji nigdy nie warzy\u0142a Grubo ciotka Berta wszyndzi sadzi merta na \u0142okna
  j\u00f3m postawja\u0142a a podlywa\u0107 zap\u00f3mnia\u0142a Ciotka Maryj przyjecha\u0142a
  szprymy se zaj\u015b pozbjyra\u0142a nic \u017codnymu nie pedzia\u0142a i [\u2026]\"",
  "\"Idzie to ty\u017c posucha\u0107 na\\nwww.ojgyn.blog.onet.plTo b\u014d\u0142o
  jakosik bez zima. Kio\u0142zdn\u014d\u0142ech sie stopier\u014d\u0144sko sam na
  Krojcce i ze sakramynckim pier\u014dnowaniym wkarow\u014f\u0142ech we chopa, \u0142oblecz\u014dnego
  we taki szykownisty pelcmantel, hut i ze br\u014dnotn\u014dm aktyntasz\u014dm w
  gracy.\\n\u2013 Wyb\u014fcz\u014dm mi \u0141\u014dni... \u0142o sto pier\u014dn\u014dw!
  To ty Erich? Tela l\u014ft...\\n\u2013 A witej Ojgyn!\\n\u2013 Kaj\u015b ty sie
  sam straci\u014d\u0142 chopie, u mie na Pniokach? \u0141o\u017cyni\u014d\u0142e\u015b
  to sie yntlich? Dziecka jakesik ju\u017c m\u014fsz?\\n\u2013 Ja Ojgyn, \u0142obabi\u014d\u0142ech
  sie ale... dziecek za pier\u014dna niy kca mie\u0107!\\n\u2013 A po jakiymu Erich,
  czamu?\\n\u2013 An\u014d, p\u014dd\u017a wlejzymy kajsik do szynku to ci powia.\\nWlej\u017ali
  my do moji zwykowyj kaczmy, Erich \u0142obsztalow\u014f\u0142 laga (a co, st\u014f\u0107
  go na to, dupny dyrechtor), zicli my kole hajc\u014dnga i napoczn\u014d\u0142 \u0142ozprawia\u0107:\\n\u2013
  Wiysz moja star\u014f poswa\u0142a mie ci kesjik do zupermarkytu po spraw\u014dnki.
  Nakupi\u014d\u0142ech wszyjskigo jak przin\u014fle\u017ci i \u2013 jak ci to tam
  maj\u014dm we zwyku \u2013 nafolowali mi to do roztomajtych nyl\u014dnbojtl\u014dw,
  ep\u014dw. B\u014d\u0142o \u0142\u014dnych do kupy siedym abo \u0142oziym, po p\u014fra
  kilo k\u014d\u017cd\u014f. Coby je wszyjske wyjmn\u014d\u0144\u0107 ze auta, zebra\u0107
  aktyntasza, coch j\u014dm mi\u014f\u0142 we robocie, zawrzi\u0107 auto i dokula\u0107
  sie do d\u017awiyrzy mojij siyni, wyk\u014fza\u0142o sie wyzwaniym bezma\u0142a
  nad moje siy\u0142y. Alech sie dokwanck\u014f\u0142, stan\u014d\u0142ech przi d\u017awiyrzach
  i rzi\u0107 k\u014dmini\u014frzow\u014f blach\u014dm \u0142obit\u014f. Ani si\u014dngn\u014d\u0144\u0107
  do d\u014dmof\u014dnu, ani klucy ze kabzi wyjmn\u014d\u0144\u0107... m\u014dgbych
  ci sie wetn\u014d\u0144\u0107, i\u017cech wygl\u014dnd\u014f\u0142 jak \u0142ostatni
  ciu\u0107mok i gramla\u0142a.\\n\u2013 N\u014d, chopie, i tak sie drugda moge przitrefi\u0107,
  iste, co\u015b spraw\u014dnki zrobi\u014d\u0142.\\n\u2013 Aaa, dej pok\u014dj Ojgyn!
  Jakosik d\u017awign\u014d\u0142ech rynka, naszpanow\u014f\u0142ech muskle... si\u014dngn\u014d\u0142ech
  zw\u014dnka. Sto pier\u014dn\u014dw pikulik\u014dw... \u017c\u014fdnego niy ma we
  cha\u0142pie.\\nPrzek\u0142\u014fd\u014f\u0142ech nece z rynki do rynki i przekr\u014fcz\u014d\u0142ech
  chopie wszelijake barijyry b\u014dlu \u0142obrzinanych palc\u014dw. Gor\u014dnczkowo
  lew\u014dm grac\u014dm wyci\u014dngech kluce i napoczn\u014d\u0142ech \u0142otwiyra\u0107
  d\u017awiyrze, kejech poczu\u0142, i\u017cech niy ma sam s\u014dm. Blank za plecami
  p\u014fruch snopli z gracami w kabzach \u0142od jakigosik czasu filowa\u0142o na
  tyn m\u014dj \u201esurvival\u201d, na ta moja szko\u0142a przetwani\u014f.\\nMi\u014f\u0142ech
  mazel, uda\u0142o mi sie yntlich \u0142ozewrzi\u0107 te d\u017awiyrze. Balansjyr\u014dw\u014f\u0142ech.
  Jedn\u014dm sz\u0142ap\u014dm szperow\u014f\u0142ech d\u017awiyrze, coby sie niy
  zawrzili, a drug\u014dm podpiyr\u014f\u0142ech te epy \u2013 ze mokr\u014dm \u0142od
  szwajsu fres\u014dm ze gor\u014dnczkow\u014dm uwijaczk\u014dm przek\u0142\u014fd\u014f\u0142ech
  tasie, coby wyglajchowa\u0107 \u0142obci\u014dn\u017cyni. N\u014d, istny cyrkus
  na k\u014d\u0142kach!\\nN\u014d, i yntlich b\u014d\u0142ech fertig wlyj\u017a\u0107
  do siyni, chocia tak do \u0142ostatka niy b\u014d\u0142ech pewny e\u017ali mi sie
  to ud\u014f bez uszczyrbku dl\u014f spraw\u014dnk\u014dw. Grac\u014dw mojich blank
  ju\u017cech niy czu\u0142. Kukn\u014d\u0142ech na tych \u0142ochyntoli.\\n\u2013
  Panoczku! A mo\u017cno w\u014fs w czymsik sp\u014dm\u014dc, co gizdy? \u2013 wycedzi\u014d\u0142ech
  n\u014fjbarzij jad\u014dwicie jakech ino poradzi\u014d\u0142.\\n\u2013 N\u014d,
  to\u015b sie m\u014dg napocha\u0107! \u2013 rzykn\u014d\u0142ech kamratowi.\\n\u2013
  E tam, mie ju\u017c b\u014d\u0142o wszyjsko jedno. Na tych iptowatych fresach \u0142odmalowa\u0142o
  sie zestarani. Jakesik abfale pomy\u015bl\u014dnku zag\u014d\u015bciyli we jejich
