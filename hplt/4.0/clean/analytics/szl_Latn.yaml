  z tych \u00f4statnich jeszcze trocha narychtowa\u01079. Co z tego wy\u0144dzie10?
  \u00d4bejrzymy11 za szej\u015b12 miesiyncy \ud83d\ude09 Co potrza? 1 kg pozimek
  1 szkl\u014dnka cukru 1 [\u2026]\\nA z tym dro\u017cd\u017cowym to b\u014d\u0142o
  tak: prziszo\u0142 ro\u0142z1 hydraulik sprawdzi\u0107 instalacja i jak \u0142obejrzo\u0142
  pusto\u0142 blacha, to jakosik my sie dali do go\u0142dki2 \u0142o pieczyniu. I
  \u0142on tu narozki pado\u01423, \u017ce mo\u0142 taki recept4 na dro\u017cd\u017cowe,
  co to jego \u201ebabcia robi\u0142a 100 lat przed wojn\u0105\u201d- pedzio\u0142
  tak, bo to b\u014d\u0142 hadziaj5, ale \u017ce recept [\u2026]\"", "\"Dziwno Przygoda\\nPrzysze\u0142
  berkmon na szychta na gruba\\nza robota se chwyciy\u0142,pot mu \u015bciyko z czo\u0142a.\\nMaszyny
  huczom \u015bwiat\u0142ym lampy migajom\\nwszyscy robiom,od roboty se niy ociongajom.\\nBerkmonowi
  roztoma\u0144te my\u015bli przez g\u0142owa przelecom\\ndzwigo g\u0142owa, zaglondo,
  czorne \u015bciany wynglo \u015bwjycom.\\nPrzyglondo si\u0119 i co\u015b jakby posta\u0107
  w tym blasku widzi,\\nbiere i o\u015bwjytlo to miejsce i pjyko pani widzi.\\nPrzelynkniony
  kto to,a\u017ce na kolana pado,\\ni przed pjyknom paniom swoja g\u0142owa schylo.\\nZmiarkowol
  \u017ce to \u015bwjynto Barbara stoji,\\n\u017ce to Ona go ochronio i \u017ce on
  tu z jeji woli.\\nNaroz s\u0142yszy jak pjyknie do niygo godo,\\npowjydz ludziom
  co mi se niy podobo.\\nS\u0142owami mi serce raniom, a to mie boli,\\njo se przeca
  tu opiekuja z wami w doli i niydoli.\\nBerkmonie mom pro\u015bba wielko do ciebie\\npowjydz
  im niech pohamujom w przeklinaniu siebie.\\nBo Pomboczek, ty\u017c kora\u0107 umjy
  ludzi,\\nodbiere im mowa \u017ce ani s\u0142owa nie wys\u0142owi.\\nNie rzycza se
  tego,a\u017ce to wszyscy wjycie,\\nby mie obra\u017cano kej tu fedrujecie.\\nBerkmon
  z pochylonom g\u0142owom s\u0142ocho i przytakuje,\\nw tym do\u015b go za ramiono
  szarpie, zdziwjony czuje,\\nJerona stowej,co ci to je ?naroz s\u0142yszy,\\na on
  z wra\u017cynio co to by\u0142o ledwo dyszy.\\nNic,nic,ju\u017c stowom do kamrata
  zdziwjonygo godo,\\nprzyrzeko se \u017ce nie zaklnie, i za robota se chyto.\\nOd
  dzisio upomni ko\u017cdygo do bydzie przeklino\u0142,\\ndy\u0107 taki przyrzeczyni
  \u015bw, Barbarze do\u0142.\\nMaria Kostrzewa\"", "\"Weronika Bilska\\nUrodzona
