  fika fazi pa poi kumida na casa, teve um dia ki txiga di trabadja na casa di um
  homi ki muda nha rumu, des di primeru dia n odja ma \u00e9 kria algu ku mi. Tevi
  um dia ke fla ma npodi ganha mutu mais ki kel ke sta dam pa dia, nfazi nka intendi,
  \u00e9 kontinua ta insiste, ta kre pegan, nta rejeita. Tevi um dia ki nha fidju
  fika doente, y nstaba sem dinhero, pai di nha fidju nunka ka liga cuida di menino,
  tudu mi ki tem ki resolve, vida di m\u00e3e solteira k facil, perante tantos dificuldade,
  nkaba pa bai na proposta di nha patron, kaba pa envolve kol, y ke dia nsai di la
  ku dinhero ki nta ganhaba na 1 semana di trabadju, ku consencia um poku pesado,
  mas pa otu lado aliviado pamodi nta resolveba problema di paga consulta y exame
  pa cuida di nha fidju. Foi si kin kumesa ta envolve ku homes pa dinheru, es ta fla
  vida facil, mas pami nunka ka ta ser facil. \u00e9 ka vida kin pensaba pa mi, mas
  situason tenem ainda nisso, ku speransa di um dia inviste na negocio y sai disso,
