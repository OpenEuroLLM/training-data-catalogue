sample: '["\"Paradu mi e som\\nN''ata pensa na nha vida\\nN''ata xinti cada vez maz
  pertu di partida\\nForca ka sta na mi\\nN''perdi na bu dispidida\\nKa tem costura
  ou penso\\nLigadura pa nhas frida\\nMama querida\\nN''sabi mo ka kria\\nPa staba
  na kel merda di rotina\\nMa si n''oia pa traz nada nu ka tem nez vida\\nE tudo kel
  ki n''fazi foi pa adjuda noz familia\\nPara pensa analisa\\nMa vida li e foda\\nMa
  tem muitos ki ata brinca\\nDipos di um x di fadja\\nBu conversa e lixo nigga\\nKuze
  ku fazi di bu vida\\nCartas foi bo ki baradja\\nBanca stau dentu barriga\\nKo eskeci
  na kel festa kem ki dau bebiba\\nE na kel otu dia kem ki dau prato comida\\nKem
  ki da bu ganza ti bu cabe\u00e7a rebira\\nTudo cenas ki nu pasa nem nka sta acredita\\nE
  ami na correria ma nka sa ta avanca\\nE nha pensamento tipo ki dja cansa\\nDentu
  nha zona cada um ta fazi pa si pan\u00e7a\\nPor isso ki nha firma ta bulli sem tolerancia\\nSi
  bu sta dentu dele ka bu perdi bu esperanca\\nNu ta fazi shit ku cabeca e poku confian\u00e7a\\nA
  pala di kel merda la n''podi flabu ma nha cabeca\\nMuda ku rapa di infancia\\nEz
  tenta siparanu ka resulta nigga\\nEz tenta imitanu kuza sai fadjadu nigga\\nKa tem
  comparacon si bu kre fala di nhas nigga\\nN''ta lembra na inicio\\nModi ki nu comeca\\nSi
  hoje ami sta si\\nNhoz ki muda nha cabeca\\nSi na rap era so mi\\nDja n''cagaba
  pa esa merda\\nMa nu sta pa li\\nJogo limpo barri mesa\\nE ami\\nAmi e di kez ki
  ta espera pa poera baxa\\nDentu di bairro cuidado ku kenha e ku ta bafa\\nDjobi
  ku kenha e ku ta lida e ku kenha ku desabafa\\nPamodi bu ka ta mora sozinho dentu
  bu casa\\nTrocado nu ta fazi ma nu kre papel\\nE nos maneira pensa e pouku argem
  ki ta entendel\\nE facil bu critica un vida ki bu ka vivel\\nMa antes bu apontanu
  o dedo\\nOiia kuze ku sta nel...\\nKa bu rebaixa kel otu\\nBu podi bem mestel\\nBaixada
  nha firmaaa\\nFiel\\nTropa n''teni mangadel\\nBXD sa ta cria ti dentu di IPL\\nNu
  sta tudo na campo ma so 11 e ki ta juga\\nAmi e kel avancado ti baliza um gajo fura\\nKantu
  golo ki dja n''marca ma depois rapa kre luta\\nBarrera BXD sta fudido pa dirrubaaaaa\\nFIRMA\"",
  "\"\\\"Nha fidju sa precisa di ajuda\\\"\\n\\\"Boa tarde e ku txeu tristeza quin
  sa ben fala d es minino li, minino de txeu alegria, de txeu vontadi d vivi de anda
  d brinca e sa passa pa poblema d saud e que si mae sata sufri djuntu ku el ... e
  ten poblema de paralizia selebral e sa nes moment internadu, und si mae sa ta pidi
  tudu alguen pa djudal pmd e ca ten ninguen pa djudal e sa passa pa txeu difikuldad.
  Minis nu djudal ku pouku que nu podi e que nu teni e in ta pid tudu mundu pa partilha
  es publicasao li pa quenha que podi djudal pa djudal si nome e Djina Mett e ta mora
  na txada santo antonio si contato e 9951495. nu djudal nu partilha es publicasao
  e obrigado a todos\\\"\\nCOMMENTS\"", "\"quarta-feira, 6 de outubro de 2010\\nTENTATIVA
  2\\nL\u00edngua Materno: ki scrita ki papiar\\nTentativa 2\\nSempre falado na nesesidadi
  di no avansa ku studo di nos l\u00edngua i tudo otus kuza m\u00e1s capaz di medjora-l
  at\u00e9 ser encontrado um forma aseit\u00e1vel pa nos tudo. Uns i otus sta pustado
  na kel ideia li, \u00e9 serto, mas inda kuza sta npatado sem pode atxado um rezultado
  concreto. Ten fidjus di terra ki m\u00f3re ta difendi um determinado ponto de vista,
  mas tambe tem otos ki inda sta bibo ki ta difendi pontos di vista diferenti, i keli
  tambe \u00e9 normal. Ideia ma no debe toma alfabeto portug\u00eas como referensia
  \u00e9 um sa\u00edda ki nunca foi posto di lado. Tudo muto certo. M\u00e1 tem otos
  sa\u00edda. V\u00e1rios. Ezemplo \u00e9 txeu nes mundo fora. Povo \u00f3 populass\u00e3o
  criolo ka \u00e9 s\u00f3 n\u00f3s na mundo.\\nEuj\u00e9nio Tavares i Prdro Cardozo
  \u00e9 di k\u00eas ki foi primeiro a pensa na escrebe i a kestiona utilizass\u00e3o
  di nos l\u00edngua escrito na papel i na midida di s\u00eas pensar \u00eas da um
  grandi contributo. Pa nos fica claro modi ki es ta pensaba. Otos letradus b\u00e1
  m\u00e1s lonji moda Nho Baltazar, moda Nho Armando Napole\u00e3o, moda Sejio Fruz\u00f3ni
  i Luis Romano i otos. \u00cas es d\u00e2 grandi contributo, dexando s\u00eas tistimunho.
  M\u00e1 tem otos ki papia mariado i mariadon pr\u00f3pi. Se calhar Cabo Verdi pa
  \u00eas era s\u00eas ilha di naturalidadi, ignorando indemeno Santiago, talves conchedo
  s\u00f3 pa fla ki flado, em tomado Praia como tudo ilha. \u00c9 bom ki no sabe um
  kuza. Tem stranjero ki prende nos l\u00edgua fora di li, studal i difendi teze na
  altos universidadi dundi ki es studa, moda Merca. \u00cas \u00e9 primero a fla ma
  nos l\u00edngua studado e prendedo como debe ser \u00e9 um l\u00edngua igual a tudo
  l\u00edngua di mundo.\\nMas, se calhar, como nos Santu-l Casa ka ta faze milagre
  porisso tem kuzas ki ta rola-no na ponta nariz no ka ta consigi odja-l pam\u00f3di
  odjo no ta tene na caza genti.\\nAmi dja-m flado dja, ma criolo bale s\u00f3 pa
  sta na cantiga i ki fora de-l \u00e9 pa cada um fica na di sel, pam\u00f3di criolo
  \u00e9 conberssu di rubera, conberssu di sukupira, ku pilorinho, pa andansa sient\u00edfico
  nau. Sobri kel ideia li, mi m\u00e9 n \u00e1txa ma ka val\u2019a pena kestiona nem
  gasta argumento ku el, pabia \u00e1txa riba d\u2019atx\u00e1du, \u00e9 sima p\u00e9
  di L\u00e9pu ta t\u00e9pu-t\u00e9pu. Poi p\u00e9 tra p\u00e9 fica la m\u00e9. Dja-m
  flado dj\u00e2 ma poesia a s\u00e9rio na criolo ma \u00e9 kuza dif\u00edsil di consige
  pam\u00f3di ma se recurso \u00e9 limitado. Claro ki \u00d3 \u00e9 \u00fanico letra
  ki p\u00e9 di burro ta dexa marcado na txon, m\u00e1 como transporte el \u00e9 nhako
  sirbidor. Limiti \u00e9 conformi no dezafia nos cabessa. Tem algem ki el \u00e9
  limiti di si propi crescimento.\\nNton nes cazo nhas livro ninhum ca tem poesia,
  \u00fa ki ta significa ma \u00e9 impossivel tem literatura na criolo. Pam\u00f3di
  ? Literarura \u00e9 construido atrav\u00e9s di um l\u00edngua screbedo na se midjor
  forma. Assi, des manera kuza ta bira conplicado m\u00e9, at\u00e9 pa ntende. Mi
  na kel poco ki mim ta odja, n ta \u00e1txa ma \u00e9 ka di oji ki n\u00f3s \u00e9
  \u00fanico cazo di tem \u201c profetas sem p\u00e9 na si poial\u201d sima ki ar,
  terra, mar, sol, s\u00e9u, \u00e1gua, leti, alma, vida, \u00e9 ka t\u00e1nto di
  mesmo kont\u00e1nto, sima ki trabadja, furta, m\u00f3ri, conta mintira, fala di
  vida di alg\u00e9m, mata ka \u00e9 um processo rasiossinado e feto na criolo.\\nNha
  catxorinho na caza ta ntenden muto ki bem. Si n da-l ordi na frans\u00eas \u00e9
  capaz di \u00e9 ladra-m mostrando ma mim sta xuxa ku el. Portanto, conf\u00f3rmi
  nu julga nos cabessa assi nu ta julgado tambe. \u00c9 di dreto ku mariado ki nos
  tudo dja nu txiga ti pundi ki nu sta. \u00c9 ka deturpa portug\u00eas ki \u00e9
  papia criolo i nen \u00e9 ka uza palavra b\u00f3ss dento di criolo, ki ta da pa
  fla ma nu ta rikisse nos l\u00edngua. Palavra ta ncaxa. Sim! M\u00e1 el \u00e9 purbado
  sima purba sal na comida. Palavra tomado pa di nos \u00e9 tem ki significa ku naturalidadi,
  pa \u00e9 podi tem un star pac\u00edfico na matriz di l\u00edngua.\\n\u00c9 ku screbedoris
  di criolo ki nu ta caba pa afina escrita e si regras pamodi \u00e9 el ki ta caba
  pa aponta poss\u00edvel caminho i \u00e9 el ki tem responsabilidadi di sprumenta
  validadi di proposta t\u00e9cnico ki ta fazedo pam\u00f3di escrebe \u00e9 u mesmo
  ki ezerssita um l\u00edngua moda trovadores ta faze screbendo versos de ses melodia
  i canta-l.\\nN atxa oportuno i interesanti traze Dotora Dulce Duarte na undi ki
  \u00e9 ta mostra se viz\u00e3o t\u00e9cnico sobre alguns kuza ki debe ta ser encontrado
  um resposta dreto. El \u00e9 ta poi seginte kest\u00e3o: Tem \u00f3 ka tem oto manera
  di fla klel fraze li\u2026\u2026 \u201c\u00e9 un sforsu imensu ki ta envolve un
  verba avultadu\\\" \\\"\u00fa ki sta fundamentalmenti en kauza \u00e9 nos sobrevivensia
  komu povu\\\". Claro ma tem ki tem. \\\"\u00e9 um kuza puxado ki ta pidi txeu dinhero\\\"
  ou \\\"\u00e9 um trabadjo ki takusta txeu dinhero\\\" o inda: \\\"u ki ta da ki
  pensa \u00e9 modi ki nu ta sobrevive como povo... \\\" ki sta en djogu \u00e9 modi
  ki nu ta sobrevive como povo\\\". Es \u00e9 um assunto ki nu tem ki djobe-l dreto
  pamodi um kuza \u00e9 tra di portug\u00eas i otu kuza \u00e9 fla \u00fa ki meste
  ser flado di nos manera.\\nAlguns ezenplo abssurdo di tenta criola palavras: Indipendensa,
  ispis\u00edfiku, pesua, filiz\u00f3fiku, karaktiristika, posivimenti, dizanvolve,
  induvidu, konsakuensa etc. Kes tipo di criatividadi li ki ta caba pa ser rid\u00edculo
  i \u00e9l ta caba pa cria inimigos di scrita di criolo ki pa mi el tem si ronco
  e si rosto certo.\\nNo sprumenta l\u00e9 kes linha li ki poetas screbe pa cada um
  tra si concluz\u00e3o:\\n\\\"Alma ku xintidu na txuba e mininu nobu sen batismu
  e padja na bentu ta badja\\\" Dani Spinola.\\n\\\"La pundi ki odju ka ta fila odja
  \u00e9 la ki tenpra sta \u00e9 la ki ser bira serteza\\\" Ariki Tuga Badiu Branku.\\n\\\"Tardi
  kai sukuru fitxa pretu finu noti \u00e9 dobra na garganta prumeru galu\\\" B.K.\\n\\\"Nunka
  n kontob margura d''nha vida nes mar de kriste nes s\u00e9u d''munde nha kretxeu\\\"Kanabrava.\\n\\\"Rotxa
  skreve na seu y trovon ma relonpeg skreve na boka de pove\\\" Corsino Fortes .\\\"\\n\u201cSopra
  bu f\u00faria kenta petu toma un pinginhu pa dabu spritu\\\" David Hopffer.\\nSem
  coment\u00e1rios:\\nEnviar um coment\u00e1rio\"", "\"Am n ben d t\u00e9ra lonji
  F C G d t\u00e9ra lonji di li Am dja n ten and\u00e1du mundu F C G m\u00e1 n k\u00e1txa
  un lug\u00e1r s\u00e1bi si Am F a-mi \u00e9 fidju di r\u00f3txa C G ki b\u00e9ntu-l\u00e9sti
  fulia na m\u00e1r Am F d\u00e9ntu mi ten d\u00e9s ilia C G k\u00e1bu-verdi, k\u00e1bu-verdi
  Am la na nha t\u00e9ra lonji F C G lam\u00e9ntu di povu foi txeu Am konsi\u00e9nsia
  grita \u00f3ra Fm C G i un di ses v\u00f3s foi kabral Am F n\u00f3s \u00e9 fidjus
  di r\u00f3txa C G ki b\u00e9ntu-l\u00e9sti fulia na m\u00e1r Am F d\u00e9ntu n\u00f3s
  tudu \u00e9 ilia C G k\u00e1bu-verdi, k\u00e1bu-verdi Dm E7 palan s\u00f3 ta sp\u00e9ra
  txuba Dm E7 txiku, nh\u00e9la ku ses uril Dm E7 tufuka dja bendi si pexi Dm E7 oji
  b\u00e9nta txiga lisboua Dm E7 filisi\u00e1nu txora sod\u00e1di Dm E7 beny g\u00e1nha
  totob\u00f3la Dm E7 (Am/A5) es vida \u00e9 sima mar\u00e9 ku kada \u00e1nu ta nasi
  sper\u00e1nsa di odja az\u00e1gua ben tr\u00e1s di simentera pa vida bai m\u00e1s
  su\u00e1vi si, m\u00e1s d\u00f3xi si pa kada un ki kr\u00e9 es txon\\nIf you can
  not find the chords or tabs you want, look at our partner E-chords. If you are a
  premium member, you have total access to our video lessons.\\nIf you find a wrong
  Bad To Me from Mayra Andrade, click the correct button above.\"", "\"D.Arlindo Gomes
  Furtado foi hoji consagradu cardeal, num cerim\u00f3nia na Bas\u00edlica di S\u00e3o
  Pedro, na Vaticano, na presen\u00e7a di papa Francisco.\\nD.Arlindo ki \u00ea bispo
  di Santiago, bira hoji primeru cardeal cabo-verdiano na Vaticano.\\nEl \u00e9 um
  di kes 20 novu cardeal,ki consagra hoji, 15 d\u00eas ten poder di vota pa skodji
  proximu Papa.\\nNa cerim\u00f3nia staba presente Primeiro-ministru, Jos\u00e9 Maria
  Neves na representa Estado di Cabo Verde.\\nTambe cerca di 500 caboverdianos bai
  sisti es momento hist\u00f3rico, ki staba la, era kriolus ki sta emigrado na Italia,e
  alguns \u00e9 caboverdiano ki viaja di otrus pa\u00edses di Europa e otrus bai di
  Cabo Verde pa ba sisti es cerimonia.\\nNa sa\u00edda di bas\u00edlica, novu Cardeal
  caboverdiano fika mas di meia hora na Pra\u00e7a di S\u00e3o Pedro na kumprimenta
  si conterr\u00e2neos caboverdianos.\\nD.Arlindo fla \u201cnu sta tudu emocionado,
  gra\u00e7as a Deus pa nu kontinua assi, ku motivu pa nu vive ku alegria.\u201d\\nAlguns
  caboverdianos ki staba presente komesa na grita ta ponta pa D.Arlindo \u2018Papa,
  Papa\u2019.\\nCardeal D.Arlindo ri, \u00ea responde \u201c ka \u00ea proibido sunha\u201d.\\nE
  \u00ea fla na jornalistas: \u201cNa Igreja nu ka ta busca estatuto, nu ka ta busca
  poder, nu ka ta busca t\u00edtulo, nos tudu nu sta li pa nu sirbi, pa testemunha
  Jesus Cristo, pa nu kria fraternidade.\u201d\\nCardeal caboverdiano finda, ta pidi
  pa Nhord\u00eas kontinua na aben\u00e7oa Cabo Verde,e \u00ea deseja pa caboverdianos
  bira cada vez mas unidu ku kumpanheru.\\nD. Ildo Fortes, bispo di Mindelo tambe
  kompanha cerim\u00f3nia na Bas\u00edlica di S\u00e3o Pedro e \u00ea mostra si \u201cgrande
  gratidon e alegria\u201d pamodi D. Arlindo Furtado bira cardeal, \u00ea fla \u201cnos
  \u00ea um pa\u00eds pikinote, nu sta espadjadu na mundu, mas sta li centenas e centenas
  di caboverdianos ki ben pa sisti es acontecimento, ki pa n\u00f4s \u00e9 hist\u00f3rico\u2026\u00c9
  mutu bonito di odja\u201d.\\nD. Arlindo Furtado \u00e9 gosi cardeal-presb\u00edtero,
  ku t\u00edtulo di igreja de S\u00e3o Tim\u00f3teo, na Roma.\"", "\"Por: Marciano
  Moreira*\\nTCV ta transmiti prugrama notisiozu \u201cCABO VERDE magazine\u201d tudu
  dia util di 17H00-18H00 ku ripitison 07H00 di palmanhan. Es prugrama e na nos lingua
  maternu (lkv). Desdi abril di 2017 na rubrika \u201cLINGUA MATERNU\u201d di es prugrama
  i tudu kuarta-fera, N ta papia sobri lkv duranti serka di 5 minutu.\\nNa sekson
  di \u201cNotas\u201d di nha perfil na facebook, dja N kria post \u201cTCV \u2013
  CABO VERDE magazine \u2013 LINGUA MATERNU\u201d (https://tinyurl.com/y9kjuajk),
  undi N ten stadu ta inseri link di vidiu ku kada partisipason dimeu. Pa kada vidiu,
  N ta indika se rispetivu data, tema i minutu undi N ta komesa ta papia. Pa txiga
  nes post, ba na google i skrebe: cabo verde magazine lingua maternu Si leitor abri
  un di es vidius a partir di un iphone, ti ki vidiu komesa ta roda, leitor ta toka
  2 bes riba di vidiu, ta parse boton ki ta mostra kantu tenpu dja el roda i, ku dedu,
  leitor ta leba es boton pa minutu ki N ta komesa papia. Si leitor abri vidiu a partir
  di un konputador, logu ki vidiu komesa ta roda, ta parse boton ki ta mostra kantu
  tenpu dja el roda i, ku kursor, leitor ta leba es boton pa minutu ki N ta komesa
  papia. Asin, leitor ka meste spera ti txiga minutu ki N ta komesa papia.\\nDja N
  faze 60 i tal aprizentason. Nes aprizentasons, objetivu foi da telespetador fundamentus
  sientifiku pa el fika ta xinti mas grandesa ku lkv i ta difende se liberdadi linguistiku
  midjor.\\nNa kes aprizentason inisial, N papia sobri orijen di lkv. Spesifikamenti,
  N aborda es temas li: orijen di lkv; provas ma kriansas ta kria lingua; prova ma
  kriansa purtuges asves ta inpididu di uza lojika linguistiku inatu; etimolojia di
  dialetu; kauzas di surjimentu di dialetus; surjimentu di dialetus na lkv; kontributu
  di skravus libertu pa nu ten so 1 lingua li na Kabu Verdi; kauzas ki obriga skravus
  libertu ba di Santiagu pa otus ilha; otus grupu dialetal i linguistiku eurupeu ki
  partisipa na povuamentu di nos tera; provas ma vinda di skravus ka provoka surjimentu
  di diferensas dialetal na lkv; reperkuson linguistiku di ivoluson rasial i sosial
  li na Kabu Verdi atraves di sekulus; nos falar e o ka e dialetu di purtuges?; alguns
  prekonseitu ma nos falar e dialetu di purtuges; manba nos falar e purtuges mal papiadu?;
  manba nos falar ka ten gramatika?; manba faktu di kuazi tudu palavra di nos falar
  ben di purtuges ta bira nos falar dialetu di purtuges?; manba kada Kabuverdianu
  ta papia di se manera?; i manba so falar ki ten padron e ki e lingua?\\nNa 2\u00ba
  fazi di nhas aprizentason, N mostra lugar di lkv na seiu di se familia linguistiku.
  Spesifikamenti, N aborda es temas li: kuze ki linguas kriolu ten di kumun?; pamodi
  ki linguas sima di-nos ta txomadu kriolus?; kas lingua kriolu ta izisti na mundu?;
  kriolus di bazi leksikal purtuges; kriolus afro-purtuges; kriolus afro-purtuges
  di Golfu di Gine; nhos djobe si nhos ta ntende kriolu santumensi?; manba kriolu
  santumensi e dialetu di purtuges?; foru e mas un prova ma nu ten so 1 lingua; relason
  entri lkv ku kriolu di Gine-Bisau; relason entri lkv ku papiamentu; mas un prova
  di interkonprienson entri papiamentu i lkv; orijen di papiamentu; frakezas di alguns
  tioria sobri orijen di papiamentu; statutu di papiamentu; alfabetu di papiamentu
  (Kurasau); Seselwa (kriolu di Seixelis); lkv versus seselwa; orijen di kriolus \u2013
  tioria monojenetiku / di releksifikason; lkv versus tioria monojenetiku.\\nPur fin,
  N aborda es temas li: kuze ki Cabral fla sobri lkv? (2 aprizentason); lkv na Konstituison
  (15 aprizentason); i lkv na lei di bazis di sistema idukativu.\\n*Marciano nha Ida
  padri Nikulau Ferera\\n(Publicado no ANA\u00c7\u00c3O impresso, n\u00ba 581, de
  18 de Outubro de 2018)\"", "\"Si bu poder da bu ajuda\\n\\\"Oi pessoal\\nEs bebe
  li \u00e9 nha visinho di Monte Vermelho Palmarejo praia.\\nEl txoma Isa\u00edas
  el nace prematuro\\nGossim el teni 1 mes e 15 dia.\\nEl sa morado cu se tia fatima
  de contacto (9120496 play)\\nDjel tem 15 dia cu se tia li.\\nE se mai staba internado
  mas eh caba pa morri es sabado li, unton inda e ta bebe so kel leite nutriben (qui
  e muito caro).\\nUnton se tia sa pidi ajuda ku qualquer cuza, Unton quenha qui podi
  ajuda podi liga pa nha numero tmb (5821839 swag)\\nObgd desde j\u00e1\\\"\\nFonte:KK\\nCOMMENTS\"",
  "\"Gil partilha video ku es discri\u00e7on: \\\"Li sta mensagem di nha m\u00e3e
  ki sta temi pa nha vida. Dja tchiga hora di nhos obi kuze sta passa. Nta pidi Deus
  pa continua ta dan vida y saudi.\\\"\\nNa video senhora Armandinha sta mostra preocupado
  ku vida de Gil. \u00c9 sta avisa ma Maria Julia ku si marido teni um plano e armadilha
  contra Gil, ki ta poi vida di es si fidju em prigu.\\nSegundo \u00e9 xplika, es
  situason ki sta kontisi \u00e9 pamodi es ta bai tribunal devido pr\u00e9dio de Gil
  Semedo ki si filha Maria Julia kr\u00e9 toma e por isso Maria Julia sta tenta trapadja
  Gil.\\nOdja Video\\nPOL\u00c8MIKA SOBRE PR\u00c8DIO DI QUEBRA CANELA\\nAssuntu ki
  teni es dos irmons Semedo Moreira ku problema entre \u00e9s, sta relacionado ku
  um pr\u00e9dio ki foi construido dja ten alguns anus na Quebra Canela na cidade
  de Praia.\\nAlguns meses atr\u00e1s dja nu tinha publicado sobre es assuntu, dipos
  ki nu recebe um mensagem ku titulo \u201dGIL SEMEDO burlado pela propria irma Maria
  Julia\u201d.\\ntexto:dypk\\nCOMMENTS\"", "\"Nunka nka pensaba sta nes vida,\\nNu
  tevi um conversa ku um jovem ki sta na vida di prostituison, na conversa \u00e9
  ta mostra me ka tem txeu orgulho disso mas ma por agora \u00e9 sta leba si vida
  si y ma um dia \u00e9 ta kre sai. Nu ta bem relata u ke fla na primera pessoa, claro
  sem revela si nome, pamodi \u00e9 ka danu es direito\\nNunka nka pensaba sta nes
  vida, mas situason di vida lebam pa es kaminho, mi nta trabadjaba komu domestica
  ou diarista, nta limpaba na casa di pessoas, alves ta kuzinha. Sempre ndedica nisso,
