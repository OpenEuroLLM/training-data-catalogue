  "\"Ivan \u00ea un di kes centenas ou milhares di fidju di cabo-verdianos nascidos
  na \u201cTuga\u201d ki ta vivi sen \u201cidentidade\u201d.\\nIvan ten 8 anu, \u00ea
  fidju + pikinoti di Ana Cardoso imigranti cabo-verdiana di 43 anu ki dja ten 33
  ta vivi na Portugal.\\nIvan \u00ea un di kes centenas ou milhares di fidju di cabo-verdianos
  nascidos na \u201cTuga\u201d ki ta vivi sen \u201cidentidade\u201d. Postu di ladu.
  Excluidos di sociedade. Pa si mai kel li \u00ea un situason kruel, dezumanu. Injusto.
  Pa Ana Cardoso tudu crian\u00e7as ki naci na Portugal debia ten nacionalidade portuguez.
  Autom\u00e1ticamente.\\nAP\u00c1TRIDAS\\nTen cazu di crian\u00e7as ki nen ka ten
  registo di nascimento. \u00ca sima ki es ka existe. Es ka ten Patria. Txeu centros
  di saude ou estabelecimento di ensino ka ta kre recebez pamodi es ka ten documentason.
  Ou numero di Seguran\u00e7a Social.\\nAna Cardoso ten 4 fidju tudu nascidos na Portugal
  ( era 5 mas un f\u00e9mia morri na un acidente di carro). \u00ca fla ma si fidjus
  kria revoltadus , \u201cun sentimento di revolta ki al vez pessoas ka ta entendi\u201d.
  Sima Ruben por exemplo. Ruben \u00ea si fidju matxu di 20 anu. Si sonho era ser
  jugador di futebol mas na tudo clubes ki \u00ea bati na porta es pidil carton di
  cidadon portuguez. Ruben so tinha c\u00e9dula di nascimento. Hoje Ruben e \u201ccidadon\u201d
  mas ti inda e sta revoltadu. Sen trabadju y sen un profison, \u00ea ta kr\u00e9
  kulpa si mai ku pai pa es situason. Mas nau. Ana ta fla ma entri papel y sobreviv\u00e9ncia
  di si fidjus sempri \u00ea opta pa sobrevivencia. Entre nacionalidade y dexa si
  fidjus passa fomi \u00ea fla ma \u00ea opta pa da fidjus kumida. \u00ca si ki \u00ea
  kria Nicole, ki hoje teni 17 anu. Desejo di Nicole era entra na un curso di restaurason
  na Lisboa, mas \u00ea ka aceitadu pamodi \u00ea ten so passaporte cabo-verdiano.
  Si fidju-f\u00e9mia + grandi ten 26 anu, \u00ea mai di 2 fidju. Tambe nunca \u00ea
  ka konsigui nacionalidade.\\n200 EUROS\\n\u00ca ki pa \u201crequizita\u201d di nacionalidade
  ta kusta 200 euros, pa alen di gastus ku papelada . Ana nen sempri ka tevi es dinhero
  disponivel, el ki ta ganha 600 euros como empregada di limp\u00e9za nun Hotel di
  Lisboa. Si marido ta trabadja na obra. Dia sin dia nau. Di forma ki so poku a poku
  \u00e9 ki Ana podi considji \u201cnacionaliza \u201d tudu si fidjus. Primero foi
  Ruben, la pa fin d\u2019ano \u00ea fla ma \u00ea ta pruveita dinhero di subsidio
  di Natal pa \u00ea legaliza Ivan. Mesmo si es alimenta so di spagheti ku ketchup.\\nPRUCESSO
  VICIADU\\nSta en kurso na Portugal um campanha pa legaliza crian\u00e7as indocumentadus
  di origen cabo-verdiano . Es \u00ea milhares segundo Alto Comissariado para as Migra\u00e7\u00f5es
  (ACM) mas ti es mumento so da entrada uns 10 pedidos di nacionalizason.\\nPamodi?
  Pamodi familias ka teni dinhero pa paga. Maioria di es crian\u00e7as e fidju di
  imigrantis indocumentados ki teni prublema na ranja trabadju na es \u201cmumento
  di crizi\u201d. \u00ca um circulo viciozu : Sen documentos es ka podi trabadja,
  sen trabadju es ka podi ranja dinhero pa documentos ou pa da entrada a prucesu di
  ses fidju. fonte:ondakriolu\\nCOMMENTS\"", "\"Por: Marciano Moreira*\\nUn amiga
  dimeu odja Ant\u00f3nio Sim\u00f5es na txon ta spera anbulansia. N ta dexa leitoris
  ku alguns informason adisional ki es amiga da-m, vistu pertinentis dizinformason.\\nIfetivamenti,
  alguns meiu di kumunikason sosial ten stadu ta spadja alguns informason ki ka ta
  koresponde a verdadi a rispeitu di es kasubodi, dizignadamenti sobri lokal undi
  kontese es kasubodi. Pabia N ta akredita na nha fonti i nha fonti tistimunha ku
  ses 2 odju alguns faktu pertinenti, N ta ben partilha es faktus ku nhas leitor.\\nAnt\u00f3nio
  Sim\u00f5es da Costa dadu kasubodi frenti di Beramar Grill / Beramar Hotel. Beramar
  Grill- / Beramar Hotel ta fika na extremu sul di Txan d\u2019Areia, djuntu di rotunda
  ki ta dividi tranzitu ki ta ba di Plateau entri kel tranzitu ki ta subi prinsipal
  ranpa di Txada Santantoni i kel tranzitu ki ta ba Prainha. Via ki ta ba Prainha,
  ta kontinua ti Palmareju i, di Palmareju, ti Sidadela. N sa ta papia di ranpa di
  Txada Santantoni ki ba tirmina na Restaurante O Poeta, ranpa ki e, rialmenti, prinsipal
  asesu pa Txada Santantoni. Es rotunda ta fika frenti di entrada prinsipal di staleirus
  di obras di konpleksu turistiku di Djeu di Santa Maria.\\nKonven sklarese kes ki
  ka konxe sidadi di Praia dretu, ma Txada Santantoni ku Palmareju e kes 2 prinsipal
  bairu di Sidadi di Praia di pontu di vista populasional. Plateau e sentru di Sidadi
  di Praia, undi sta grandi parti di lojas i ripartisons di Stadu.\\nSim\u00f5es dadu
  kasubodi banda 13H00, istu e, di dia ku 7 ora sol. El dadu kasubodi na ultimu sabadu
  antis di fin anu, istu e, na dia 29 di dizenbru di 2018. Na mumentu ki Praiensis
  sa ta ultimaba konpras di fin di anu. Purtantu, di pontu di vista di muvimentu di
  karus, ex-jugador di Benfica dadu kasubodi na un di kes zona i mumentu mas muvimentadu
  di sidadi di Praia \u2013 na enkruzilhada di kes 3 prinsipal bairu di sidadi di
  Praia (Txada Santantoni, Palmareju i Plateau).\\nAnt\u00f3nio Sim\u00f5es nase na
  dia 14 di dizenbru di 1943, istu e, el dadu kasubodi na mes ki el konpleta 75 anu
  di idadi. Na kel mumentu di kasubodi, el staba djuntu ku se mudjer. Pabia ka sabeda
  kas ferimentu ki el panha, tranziuntis ka mexe nel na txon, mas dilijensia pa anbulansia
  ben sokore-l. Istu e, el fika na txon duranti algun tenpu. I tranziuntis faze dretu,
  pois ben diskubridu mas tardi ma Ant\u00f3nio Sim\u00f5es tevi un fratura na anka\u2026\\nNa
  kel rotunda undi Sim\u00f5es dadu kasubodi, ten un kamara di vijilansia. Purtantu,
  Sim\u00f5es dadu kasubodi serka di 50 metru di un di kes serka di 600 kamara di
  vijilansia resentimenti instaladu na nos sidadi na anbitu di prujetu sidadi suguru.\\nI
  Pulisia Nasional konsigi kasa kes 2 kasubodista na pokus ora i konsigi, outrusin,
  rekupera kes kuza ki es 2 kasubodista roba.\\nNu sta peranti un verdadi makabru:
  es 2 kasubodista ka kustuma inda ku es sistema di vidiu vijilansia instaladu li
  na Praia di Santa Maria di Vitoria; i, nes kazubodi, es dexa Kabuverdianus tristi
  i envergonhadu pa sisi.\\nDeus grasa Sim\u00f5es sa ta rekupera dretu, dipos di
  operason ki el fazedu na anka na dia 31 di dizenbru di 2018 la Purtugal!\\nSim\u00f5es,
  un strela di futibol, ki kontribui, djuntu ku lendariu Eus\u00e9bio, pa Purtugal
  alkansa 3\u00ba lugar na Mundial di Futibol di Inglatera na 1966! Na kel Kopa undi
  Sim\u00f5es mete Brazil golu ku rei di bola \u2013 Pel\u00e9 \u2013 na seleson!
  Enfin, Sim\u00f5es, algen ki dja da amantis di disportu-rei txeu alegria! Kasubodistas
  debeba ama-l!\\nSim\u00f5es, nu ta pidi-bu diskulpa! Nos solidariedadi! Forsa!\\n*Marsianu
  nha Ida padri Nikulau Ferera\"", "\"A Abadia Rural\\nAbadia Rural ta dedikason pa
  importason i distribuison di produtos di vidro, espesialmenti botis i fraskus, djuntu
  ku se tapa, kapsula i materi\u00e1l pa apikultura.\\nA empriza ten un portf\u00f3lio
  diversifikadu di altu qualidade i kreatividade, se prinsipal klientis \u00ea produtoris
  i komersiantis di binhu, likor, azeti di azeti, d\u00f4s i mel, apikulturoris, lojas
  di lembransas i organizadoris di iventus.\\nAbadia Rural \u00ea repres\u00e9ntanti
  ekskluzivu di Swienty, i tanb\u00ea \u00ea repres\u00e9ntanti di Bruni i Kefla,
  ku \u00ea renomadu fabrikantis europeus di materi\u00e1l pa apikultura i botis i
  fraskus di vidro.\\nPa sirbi se klientis di un forma midjor, a empriza oferese d\u00f4s
  forma di vendas: un di artikulus di stock, pa entrega imediatu i otu atrav\u00e9s
  di katalogus ku artikulus pa entrega m\u00e1s tardu, sujeitu a kantidadi m\u00ednimu
  di vendas i pedidu di or\u00e7amentu.\\nAbadia Rural ta faze spedison di kualker
  kantidadi di merkadoria pa kualker parti di pa\u00eds (inklindu ilhas) i pa Europa.
  Nu entantu, el tanb\u00ea ta bendi materi\u00e1l pa otus lugaris di mundu, komu
  Angola, Kabu Verdi i Muzambiki, mandandu materi\u00e1l pa transit\u00e0riu skodidu
  pa klienti.\\nNa loja sentral, klientis pode atxa varyadus amostras di produtos
  i senpri dispunibilidade pa da m\u00e1s informasons.\\nVizita-nu o kontakta-nu!\"",
  "\"1, 2. Kuz\u00ea ki txeu algen ta pergunta?\\nUN TENPORAL ta distrui un sidadi,
  un \u00f3mi ta entra na un igreja ku un pist\u00f3la i el ta mata un monti algen.
  Un mai ta m\u00f3re di un du\u00e9nsa ki ka ten kura i el ta dexa sinku fidju.\\n2
  \u00d3ras ki ta kontise disgrasas sima kes li, monti algen ta pergunta: \u201cPamodi?\u201d
  Txeu algen ta pergunta pamodi ki mundu sta xeiu di \u00f3diu i sufrimentu. I bo?
  Dja bu kustuma faze es pergunta?\\n3, 4. (a) Kuz\u00ea ki Habacuque pergunta Jeov\u00e1?
  (b) Modi ki Jeov\u00e1 responde-l?\\n3 B\u00edblia ta p\u00e2pia di pesoas ki tinha
  f\u00e9 na Deus i ki tanb\u00ea fazeba es pergunta. Pur iz\u00e9nplu, prof\u00e9ta
  Habacuque pergunta Jeov\u00e1: \u2018Pamodi ki bu sta dexa-m odja maldadi? I pamodi
  ki bu sta seta abuzu di puder? Pamodi ki N sta odja distruison i viol\u00e9nsia?
  I pamodi ki ten txeu g\u00e9ra i konfuzon?\u2019 \u2014 Habacuque 1:3.\\n4 Modi
  ki Jeov\u00e1 responde-l? Na Habacuque 2:2, 3, Jeov\u00e1 promete ma el ta rezolveba
  kes prubl\u00e9ma. Jeov\u00e1 ten txeu amor pa pesoas. B\u00edblia ta fla ma el
  ta preokupa ku nos. (1 Pedro 5:7) Nu pode ten sert\u00e9za ma \u00f3diu ki Deus
  ten pa sufrimentu \u00e9 m\u00e1s txeu ki di nos. (Isa\u00edas 55:8, 9) Nton, pamodi
  ki ten txeu sufrimentu na mundu? Nu ben odja kuz\u00ea ki B\u00edblia ta fla.\\nPAMODI
  KI TEN TXEU SUFRIMENTU?\\n5. (a) Kuz\u00ea ki txeu relijion ta fla sobri sufrimentu?
  (b) Kuz\u00ea ki B\u00edblia ta fla sobri kel-li?\\n5 Txeu b\u00eas pastoris di
  igrejas, padris i x\u00e9fis di relijion ta fla ma tudu kuza ki ta kontise \u00e9
  di vontadi di Deus. Alguns ta fla ma tudu kuza ki ta kontise ku un algen, ti m\u00e9smu
  disgrasa, dja staba skrebedu pa Deus i ma nunka nu ka ta pode ntende pamodi. Otus
  ta fla ma \u00f3ras ki un kriansa m\u00f3re \u00e9 Deus ki toma-l, pamodi el sta
  ta mesteba m\u00e1s un anjinhu na S\u00e9u. M\u00e1 ninhun di kes kuza li \u00e9
  ka verdadi. Deus nunka ka ta faze kuzas mariadu kontise. B\u00edblia ta fla: \u2018Deus
  verdaderu nunka ka ta faze kel ki \u00e9 mau, Tudu-Poderozu nunka ka ta faze kel
  ki \u00e9 mariadu!\u2019 \u2014 J\u00f3 34:10.\\n6. Pamodi ki monti algen ta kulpa
  Deus pa tudu sufrimentu ki ten na mundu?\\n6 Monti algen ta kulpa Deus pa tudu sufrimentu
  ki ten na mundu, pamodi es ta atxa ma \u00e9 Deus ki sta ta governa mundu. M\u00e1
  nu prende na kap\u00edtlu 3, ma \u00e9 Satan\u00e1s ki sta ta manda na mundu.\\n7,
  8. Kal ki \u00e9 alguns di kes motivu di ten txeu sufrimentu?\\n7 Un di kes motivu
  di ten txeu sufrimentu \u00e9 pamodi sima B\u00edblia ta fla-nu, \u2018mundu interu
  sta na puder di Malvadu.\u2019 (1 Jo\u00e3o 5:19) Satan\u00e1s \u00e9 un governanti
  viol\u00e9ntu i mau. El \u2018sta ta ngana mundu interu\u2019. (Apocalipse 12:9)
  Monti algen sta ta faze sima el. Pur isu, es mundu sta xeiu di mintira, \u00f3diu
  i maldadi.\\n8 Otu motivu di ten txeu sufrimentu na mundu \u00e9 pamodi pekadu.
  Adon ku Eva pasa pekadu pa tudu ses fidjus. Pamodi pekadu, pesoas ta poi otus algen
  ta sufri. Es ta atxa ma es \u00e9 m\u00e1s inportanti ki otus algen. Kel-li ta p\u00f4-s
  ta briga, ta ba pa g\u00e9ra i ta maltrata otus. (Eclesiastes 4:1; 8:9) Inda un
  otu motivu di ten txeu sufrimentu \u00e9 pamodi \u2018t\u00e9npu i inprevistu\u2019
  \u00f4 kuzas ki nu ka ta pode kontrola. (Eclesiastes 9:11) Asidentis i otus kuza
  mariadu ta kontise ku un algen pamodi el ta sta na mau lugar i na mau \u00f3ra.\\n9.
  Pamodi ki nu pode ten sert\u00e9za ma Deus ten un bon motivu pa dexa sufrimentu
  kontise?\\n9 Sufrimentu nunka ka ta ben di Jeov\u00e1. El \u00e9 ka kulpadu, \u00f3ras
  ki algen ta maltrata otus, ta g\u00e9ra i ta faze krimi. \u00c9 ka Deus ki ta poi
  disgrasas kontise, sima tremor di t\u00e9ra, tenporal i txuba ki ta faze txeu stragu.
  M\u00e1 talv\u00eas bu ta pergunta: \u2018Si Jeov\u00e1 \u00e9 Tudu-Poderozu pamodi
  ki el ta dexa kes kuza li kontise?\u2019 Nu sabe ma Deus ta preokupa txeu ku nos.
  Nton, el debe ten un bon motivu pa dexa sufrimentu kontise. \u2014 1 Jo\u00e3o 4:8.\\nPAMODI
  KI DEUS TA DEXA SUFRIMENTU KONTISE?\\n10. Kuz\u00ea ki Satan\u00e1s fla k\u00f3ntra
  Jeov\u00e1 na jardin di \u00c9den?\\n10 Na jardin di \u00c9den, Diabu ngana Adon
  ku Eva. Satan\u00e1s fla-s ma Deus ka sta governaba dretu i ma el staba ta sukundi
  algun kuza ki \u00e9ra bon pa Adon ku Eva. Satan\u00e1s kr\u00ea pa es kriditaba
  ma es ka mesteba di Deus pa governa-s i ma el ta governaba midj\u00f3r ki Jeov\u00e1.
  \u2014 G\u00e9nesis 3:2-5; djobe p\u00e1rti PRENDE M\u00c1S nu 27.\\n11. Ki pergunta
  nu meste responde?\\n11 Adon ku Eva ka obi ku Deus, es bira k\u00f3ntra el. Es atxa
  ma es tinha direitu di disidi pa ses kab\u00e9sa kuz\u00ea ki \u00e9ra dretu i kuz\u00ea
  ki \u00e9ra mariadu, pa es fazeba kel ki es kr\u00ea. Modi ki Deus ta provaba ma
  Adon ku Eva ka tinha razon?\\n12, 13. (a) Pamodi ki Jeov\u00e1 ka distrui Adon ku
  Eva l\u00f3gu ki es peka? (b) Pamodi ki Jeov\u00e1 dexa Satan\u00e1s i umanus governa?\\n12
  Jeov\u00e1 ka distrui Adon ku Eva l\u00f3gu ki es peka. Pamodi? Pamodi Jeov\u00e1
  dja flaba es pa es tinha fidju i pa es intxiba T\u00e9ra. Nton, Jeov\u00e1 dexa
  Adon ku Eva ten fidju i dip\u00f4s ses fidjus ta ben skodjeba si es ta obiba ku
  Deus \u00f4 ku Satan\u00e1s. Jeov\u00e1 s\u00e9npri ta kunpri se vontadi, ka ta
  nporta kuz\u00ea ki Diabu tenta faze pa trapadja. \u2014 G\u00e9nesis 1:28; Isa\u00edas
  55:10, 11.\\n13 Satan\u00e1s diz\u00e2fia Jeov\u00e1 na fr\u00e9nti di milhons di
  anju. (J\u00f3 38:7; Daniel 7:10) Nton, Jeov\u00e1 da Satan\u00e1s un t\u00e9npu
  pa el mostra modi ki el ta governaba pesoas. I el dexa umanus faze ses pr\u00f3pi
  gov\u00e9rnu ku ajuda di Satan\u00e1s. Jeov\u00e1 dexa kel-li kontise pa tudu algen
  fika ta sabe si \u00f3mis i Satan\u00e1s ta governa midj\u00f3r ki el \u00f4 nau.\\n14.
  Kuz\u00ea ki fika provadu na tudu es t\u00e9npu ki \u00f3mis ku Satan\u00e1s sta
  governa?\\n14 Ninhun manera di governa ki \u00f3mis dja sprimenta tudu es t\u00e9npu
  ka da s\u00e9rtu. Kel-li ta prova ma Satan\u00e1s \u00e9 mintirozu. Umanus meste
  di ajuda di Jeov\u00e1. Prof\u00e9ta Jeremias tinha razon kantu el fla: \u2018Jeov\u00e1,
  N sabe dretu ma \u00f3mi \u00e9 ka donu di se kaminhu. Nen el \u00e9 ka kap\u00e1s
  di gia se kab\u00e9sa.\u2019 \u2014 Jeremias 10:23.\\nPAMODI KI TI INDA JEOV\u00c1
  STA TA SP\u00c9RA?\\n15, 16. (a) Pamodi ki Jeov\u00e1 sta ta dexa sufrimentu kontise
  pa txeu t\u00e9npu? (b) Pamodi ki Jeov\u00e1 inda ka konpo kes kuza mariadu ki sta
  kontise?\\n15 Pamodi ki Jeov\u00e1 sta ta dexa sufrimentu kontise pa txeu t\u00e9npu?
  Pamodi ta leba t\u00e9npu pa sabe si un gov\u00e9rnu \u00e9 bon \u00f4 nau. I t\u00e9npu
  sta ta mostra ma gov\u00e9rnu di Satan\u00e1s ka ta pode rezolve prubl\u00e9mas.
  \u00d3mis dja sprimenta tudu tipu di gov\u00e9rnu, m\u00e1 ninhun di es ka da s\u00e9rtu.
  Nb\u00f3ra si\u00eansia i tekinolojia dja dizenvolve, m\u00e1 sim\u00e9 injustisa,
  pobr\u00e9za, krimi i g\u00e9ra sta ta bira kada b\u00eas m\u00e1s txeu. Kel-li
  ta mostra klaru ma \u00f3mis ka ta konsigi governa ses kab\u00e9sa sen ajuda di
  Deus. M\u00e1 pamodi ki Deus ka ta kaba pelom\u00e9nus ku disgrasas?\\n16 Deus ka
  ta faze kel-li. Pamodi si el konpo kes kuza mariadu el sta ta djuda Satan\u00e1s
  governa. I asi, \u00f3mis pode pensa ma es sta ta governa dretu sen ajuda di Deus.
  M\u00e1 kel-li \u00e9 mintira. Jeov\u00e1 nunka ka ta djuda Diabu nen el ka ta poi
  pesoas ta kridita na mintira. \u2014 Hebreus 6:18.\\n17, 18. Modi ki Jeov\u00e1
  ta ben konpo tudu kes kuza mariadu ki Satan\u00e1s faze?\\n17 Jeov\u00e1 pode konpo
  tudu kes kuza mariadu ki Satan\u00e1s i algen dja faze? Sin. Deus ta pode faze tudu
  kuza. Jeov\u00e1 sabe na ki t\u00e9npu ki ta fika provadu ma Satan\u00e1s \u00e9
  mintirozu. Dip\u00f4s Jeov\u00e1 ta ben faze T\u00e9ra bira un para\u00edzu, sima
  el kreba d\u00e9sdi kom\u00e9su. Kes algen ki m\u00f3re ta ben vive otu b\u00eas.
  (Jo\u00e3o 5:28, 29) Du\u00e9nsa ku m\u00f3rti ka ta ben ten m\u00e1s. Jeov\u00e1
  ta ben uza Jizus pa konpo tudu kes kuza mariadu ki Satan\u00e1s faze. (1 Jo\u00e3o
  3:8) Nu ta fika kontenti pamodi pax\u00e9nxa di Jeov\u00e1 dexa kuzas txiga ti nos
  t\u00e9npu i g\u00f3si nu ten xansi di konxe-l i disidi si nu ta obi ku el. (L\u00e9
  2 Pedro 3:9, 10.) \u00c9 klaru ki ti inda nu sta sufri. M\u00e1 Jeov\u00e1 ta da-nu
  forsa pa nu aguenta prubl\u00e9mas. \u2014 Jo\u00e3o 4:23; l\u00e9 1 Cor\u00edntios
  10:13.\\n18 Jeov\u00e1 ka ta obriga ningen pa obi ku el. El faze-nu di manera ki
  nu ta pode skodje kuz\u00ea ki nu kr\u00ea faze. Nu ben odja modi ki kel-li \u00e9
  un grandi prezenti ki Jeov\u00e1 da-nu.\\nKUZ\u00ca KI BU TA DISIDI?\\n19. (a) Ki
  prezenti Jeov\u00e1 da-nu? (b) Pamodi ki es prezenti ta p\u00f4-nu fika kontenti?\\n19
  Nos \u00e9 ka sima animal ki ka ten kapasidadi di pensa. (Prov\u00e9rbios 30:24)
  Tanb\u00ea nos \u00e9 ka sima m\u00e1kina, ki meste di un algen pa kontrola-l. Jeov\u00e1
  da-nu liberdadi pa nu skodje kuz\u00ea ki nu kr\u00ea, pamodi el kr\u00ea pa nu
  ser fil\u00eds. Asi, nu ta konsigi skodje ki tipu di algen ki nu ta ser, ken ki
  ta ser nos amigu i kuz\u00ea ki nu ta faze na nos vida. Jeov\u00e1 sabe ma es liberdadi
  ta dexa-nu fil\u00eds.\\n20, 21. Kal ki \u00e9 midj\u00f3r disizon ki bu pode toma
  na bu vida?\\n20 Jeov\u00e1 kr\u00ea pa nu ama-l. (Mateus 22:37, 38) El ka kr\u00ea
  pa nu sirbi-l k\u00f3ntra nos vontadi. El da-nu liberdadi pa nu disidi kuz\u00ea
  ki nu kr\u00ea. Tudu pai ta fika kontenti \u00f3ras ki se fidju ta fla-l di korason:
  \u201cPap\u00e1 N ta ama-u\u201d. Jeov\u00e1 tanb\u00ea ta fika kontenti \u00f3ras
  ki nu ta skodje ama-l i sirbi-l. Satan\u00e1s i Adon ku Eva disidi na ka obi ku
  Jeov\u00e1. I bo? Kuz\u00ea ki bu ta disidi faze?\\n21 Midj\u00f3r disizon ki bu
  pode toma \u00e9 sirbi Jeov\u00e1. Milhons di algen dja disidi faze vontadi di Deus
  i es nega sigi Satan\u00e1s. (Prov\u00e9rbios 27:11) Sima dja nu prende, Deus sta
  ben kaba ku tudu sufrimentu i el sta ben bira T\u00e9ra un para\u00edzu. Kuz\u00ea
  ki nu meste faze pa nu sta la? Na kap\u00edtlu 12 nu ta ben sabe resp\u00f3sta di
  kel pergunta li.\"", "\"ter\u00e7a-feira, 18 de dezembro de 2012\\nSUNHO DI \\\"BOLTIA
  QUINTAL\\\"...\\nNHU BRINGELA ENTRA FULU NA UM TABERNA I PIDI TRIS COPO DI CANA
