  ponitur ab illo capitulo. Attende his etc. vsque ibi. Haec et his similia etc.\\n\u00b6
  Tertia conclusio. Consecratione transsubstantiatur panis et mutatur in communione.
  Dicit conclusio quod panis et vinum transubstan\u00ac tiantur in corpus et sanguinem
