  et spolia accipiat: dimitto sibi gloriam victoriae legatur solum 2. q. 1. arti.
  praesentis dist. et videbis doc. subhastam vibrare in hostes: et in fugam conuerte
  re.\\n\u00b6 Secunda conclusio. Corpus chri / et sti et potuit prius esse sub sacramento:
  quam nasci de vergine et eidem competere operationes absolu te et moueri. Ista conclio
  tres habet particulas. Prima dicit quod christus prius potuit esse sub sacramento
  quam nasci de virgine. Patet quando existentia est indifferens ad duos modos sicut
  potest haberi sub vno modo sic sub alio aeque primo: sed corpus christi est indifferens
  ad esse naturaliter: et esse in sacramento: ergo sicut modo prius habet esse. naturale
  quam sacramentale: sic potuit econuerso. Secunda pars dicit quod ille ope rationes
  absolute que competunt ei in caelo competunt in sacramento. Patet quia praecedunt
  esse in: ideo non variantur propter posterius. Tertia particula dicit quod corpori
  christi in sacramento competit moueri: patet: vbi est hostia ibi est corpus christi:
  postia autem aliquando elevatur a sacerdotealiquando deprimitur.\\n\u00b6 Tertia
  conclusio est haec: christus in sacramento sic quid potest tran mutare vt ab intellectu
  aut sensu non bto videri nequeat: sed beto intellectu. Ista conclusio tres habet
  particulas. Prima dici quod christus in sacramento aliquod potest mouere: ista patet:
  quia anima christi non debet priuari illa potem tia quam habet angelus: sed angelus
  qui non est in loco circumscriptiue habet potentiam motiuam corporalium et aliquando
  mouet: vt partet. ergo etc. et hoc aliquando apperuit in subtractione aut remotione
  hostiae subita aliqua de causa. Secunda pars dicit quod ab intellectu aut se su
  non beato videri nequit. Tertia quod ab in tellectu beato: de intellectu probat
  tho. in praesenti dist. arti. 4. q. 4. quia est obiectum fidei: potest tamen cognosci
  a bato: et hoc actu beatifico: quia eorum quae enigmatice videm tur in via: succedit
  cognitio clara. Fratet richardus in praesenti dist. arti. 5. q. 1. aliter pro bat
  primum: quia scilicet lumen naturale non attingit ad cognitionem istius existentiae:
  sed quantum ad secundum discordat: quia dicit quod non tantum beatus potest videre
  in verbo sed in genere proprio: quia quamuis huiusmodi existentia ex cedat facultatem
  luminis naturalis non tantu facultatem luminis gleiae: de sensu vero di stinguit
  idem Rich. arti. 5. q. 2. de visu glorioso et non glorioso: iterum de videre naturaliter
  et gloriosae vel miraculosae neutur potest videre corpus christi in eucharistia
  na turaliter. Ratio tho. ar. 4. q. 1. quia non potest esse tactus ibi sine quo non
  est actio naturalis in corporibus Secunda ratio eiusdem ibidem quia color respicit
  quantitatem pro per se subiecto: corpus autem christi ibi non habet ordinem ratione
  quantitatis: igitur nec ratione coloris. Addit frater Rich. vbi supa quod nec lumen
  glsiae corporale potest attingere rem non existentem alicubi: cuiusmodi est corp
  christi: vt hc. Addit idem vbi. supra. quod nec per miraculum: quia non potest eleuari
  oculus ad cognoscendum existentia substantiae separate: quem modum habet corpus
  christi vt hic. Pro hac vltima conclusione videatur articulus tertius doc. sub.
  in tribus quastionibus et istis rationibus in praesenti distin. quia venit finis
  papiri. Quo ad tertiuarticulum sunt tres difficu tates: iuxta tres conclusioes.\\n\u00b6
  Prima dif ficultas. Si deus potest facere vnum cor pus esse vbique. Dicit franciscus
  de maronis in praesenti distin. quod sic: exquo est indeter minatum ad postora loca
  eiusdem rationis.\\n\u00b6 Sed cunda difficultas. Si potuit christus in carnari
  in virgine dato quod prius fuisset il sacramento in antiquo testamento. Dico qua
  non quasi iam fuisset vnio.\\n\u00b6 Tertia di ficultas vtrum illa potentia motiua
