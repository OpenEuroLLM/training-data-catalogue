  Secunda vt sit ordinata: hac de causa confusum non est positum: et confusio non
  est positio. Tertia vt sit per manens: ideo teimpus non est positio dato quod esset
  continuum: et haec positio aliquando vocatur mo dus quantitatis extense.\\n\u00b6
