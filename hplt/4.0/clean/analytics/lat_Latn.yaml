sample: '["\"Industry knowledge\\nQuid est tarpaulin fabricae iactaret?\\nObductis
  tarpaulin fabricae genus est gravis officii, IMPERVIUS materiae quae tarps vel opercula
  ad varias applicationes conficiendas adhibetur. Texendo basim fabricatur, ut polyester
  vel polyethylene, et deinde iacuit aquaticae materiae, ut PVC, PU, vel PE. Litura
  tutelam ab elementis praebet, eamque idoneam ad usum tempestatum asperis tempestatibus
  usibus aptam facit. Fabrica tarpaulin obducta fieri potest in amplis ponderibus
  et magnitudinibus, secundum usum intentum, et adiectis stratis roborari ad extra
  vires et diuturnitatem. Communiter usus est pro operculis aliquet, scaphis, aliis
  vehiculis, necnon pro tentoriis, velamentis, aliisque structuris velitibus.\\nQuae
  sunt praecipuae possessiones, considerare cum eligendo iactaret tarpaulin fabricae
  .\\nCum eligens\\niactaret tarpaulin fabricae plures praecipuae proprietates sunt
  considerare secundum intentionem usus. Hic sunt aliquae proprietates clavis memorabiles:\\nFortitudo:
  Fortitudo fabricae magni momenti est curare ut usum intentum sustinere possit, ut
  resistat laceratio vel punctura. Id est proprie distrahendi vires metiri vel lacerare
  vires.\\nDiuturnitatem: Durabilitas fabricae magni momenti est ut elementa sustinere
  possit, ut nuditate solis, venti, pluviae, vel oeconomiae. Hoc proprie mensuratur
  secundum abrasionem resistentiae vel resistentiae tempestatis.\\nIMPERVIUS: Si tarpaulin
  ad usum velit, IMPERVIUS esse debet, ut contenta protegat. Hoc typice mensuratur
  secundum resistentiam aquae vel pressurae hydrostaticae.\\nUV resistentia: Si tarpaulin
  solis luci patebit, resistentiam habebit UV ne degradatio et decoloratio per tempus.
  Hoc typice mensuratur secundum stabilitatem UV vel colorfastitudinem.\\nResistentia
  flamma: Si tarpaulin in ambitibus cum periculo ignis adhibebitur, flammae resistentiam
  habere debet ne ignitionem et flammarum propagationem minuat. Haec proprie mensuratur
  secundum resistentiam flammae vel retardationis ignis.\\nPondus: Pondus fabricae
  magni momenti est considerare, praesertim si tarpaulin adhibebitur ad vecturam vel
  ad actiones velit. Fabricae leviores ad tractandum faciliores sunt, dum graviores
  textilia plus firmitatis et tutelae offerunt.\\nFlexibilitas: Flexibilitas fabricae
  magni momenti est ut facile plicari et convolvi possit ad reposita et translationem.
  Hoc proprie mensuratur secundum flexibilitatem vel mollitiem.\\nSpirabilitas: Si
  tarpaulin ad organismos viventium vel ad VENTILATIONIS fines adhibebitur, aliquem
  gradum respirationis habere debet ut aer et umor per fabricam transire possint.
  Hoc est typice mensuratum secundum aeris permeability vel vaporum permeability.\"",
  "\"Table of Contents\\nCommentarius in Libros Sententiarum\\nLiber 1\\nLiber 2\\nLiber
  3\\nLiber 4\\nDistinctio. 10. illidit pernitiosum errore eorum qui dicunt christum
  non veraciter esse in sacrameto eucharistiae: CUnt item alii praecedentium insani
  am trascendentes: qui dei virtutem etc. Hic signatur. 10. distin. huius quarti:
  quae ita habet continuari ad praecedentes Nam postquam in praecedenti distin. magister
  elisit errorem quantum ad cibum sumentem: Nunc in praesenti distin. confutat risorem
  quantum ad christum cibantem: dicebant enim tales christum non esse vere in sacramento.
  Et habet diuidi praesens dist. in tres partes principales. In prima error collocatur.
  In secunda error confirmatur. In tertia error reprobatur. prima in principio. secunda
  ibi. Qui errandi occasionem etc. tertia ibi. Quo rum perfidiam etc. Prima manente
  indiuisa: secunda in tres partes diuiditur. In prima erroris ponit fundamentum.
  In secunda erroris peruertit commentum. In tertia consolidat suum firmamen tum.
  prima in principio. secunda ibi. Quae ex eadem ratione. Tertia ibi. Ait enim Aug.
  etc. Rursus prima et secunda partibus indiuisis manentibus. tertia in tres partes
  diuiditur. In prima auctoritas contra se scribitur. In secunda dubie tas ex dictis
  oritur. In tertia facilitas verius onnditur. prima in principio. secunda ibi. Dein
  de addit etc. tertia ibi. Attende his diligenter etc. Haec est diuisio praesentis
  dist. etc.\\n\u00b6 Quaestio haec declarat perlucide quo christus contineatur sub
  spe panis et vini et habetur a sco. per noue q. huius di. et multorum doctorum opiniones
  reprobantur quas posui in decisionibus nostris 2x N expsco sub speiebus posito competat
  motus aut vi sio. Et arguitur tripliciter ad partem falsam\\n\u00b6 Primo quod piscophus
  non est realiter sub specibus panis et vini. Si corpus xpiscpi esset ibi: aut quantum
  aut non quantum: neutrum est dicendum. igitur. Paior patet ex primo principio. Minor
  probatur: primo non est quantum: quia tunc specie panis excederet: quod non est
  verum: quia in aere propinqui speci non est christus nec non quantum: quia tunc
  ibi non viueret dicente hilosopho in principio. 2 de anima: quod anima est actus
  corporis organici: et per consequens quanti.\\n\u00b6 Secundo arguitur quod christus
  non possit moueri in eucharistia: Christus sper est in caelo: ergo non mouetur in
  eucharistia. Assumptum patet per Aug. de conse. dist. 2. c. Prima quidem heres.
  donec finiatur secluenum sur u est dominus. patet consequenta: quia in motu locali
  de qua loquimur oportet dimittere locum a quae: et venire ad locum ad quem.\\n\u00b6
  Tertio arguitur quod chritus potest videre oculo corporali in sacramento: nulla
  perfectio deperditur christo: ex hoc quod est sub sacramento. ergo potest videre
  vt in sacro. Assum ptum patet. alioquin opera maxime benignitatis operando punirentur.
  consequenta patet. quia sicut intellectio est perfectio intellectus: sic visio corporali
  pculi.\\n\u00b6 In oppositum pro primo. Hoc est cormeum. Et. Caro mea vere est cibus:
  pro secundo quod moueatur: est auctoritas philosophi. 2. thop. Motis nob mouentur
  omnia quae sunt in nobis: igitur ad motum hostiae mouetur christus pro tertio: quia
  vi sio corporalis non fit nisi a potentia habente organa seu organo habente modum
  extensiuum: quod non est in proposito.\\n\u00b6 In ista quaesti. sunt tres articuli
  declarandi Primus est terminorum declaratiuus Quorum Secundus est quaestionis responsiuus\\n\u00b6
  Primus terminus positio: habet autem capi tribus binariis positio secundum libros
  varios. Est enim positio grammaticalis: et est quando vnam vocalem duplex imme diate
  consonans sequitur: et tunc vocalis praecedens po sitione producitur: ne aliud impediat:
  et dicitur thesis in greco. Secunda positio est de li. thop. vnde in primo illius
  positionem diffiniens philosophus dicit: posi tio est acceptio alterius extranei
  in philosophia: hoc modo dicimus haec est positio tho. haec bonauem. haec auerroys.
  et reliqua similia: vnde hoc modo qua sunt communia alicui scientie non dicuntur
  positiones: sed verius dignitates: vt deum esse in theologia subie ctum non dicitur
  positio: sed dignitas: et huius positio dicitur aut potest dici suppositio: de qua
  agit phi lo. in. 1. poste. et tunc esset auferesis quae caput tollit dectois vt
  conias pro Iecommunias: et staci pro eustacius: vt in li. poste. limitetur suppositio
  pro eo quod est sub dignitate: et ab ea euidemter progreditur. Tertio dicitur potes
  idem quod dispositio et est de li. priorum. Unde aristo. in primo similsum diffiniens
  dicit: similsus est oaeno in qua quaibusdam po sitis necesse est aliud euenire per
  ea quae posita sunt: quid est positis aut posita: nisi dispo sitis aut disposita
  scilicet in modo et in figura. Quarto dicitur positio: vt idem sit quod essendi
  po sitio: cui non esse opponitur: et a qua venit positiuum: et hoc modo illius quod
  habet esse nobilius positiuum nobilior est positio quam ex toto nihil exterminat.
  Quito dicitur positio apud gilber. porre tani vnum sex principiorum: quam gilb.
  pictaui. episcopus diffiniens dicit. Positio est quadam partium sit et geniationis
  ordinatio: in quo breviter tangit tria. Primn positionis genus dum dicit: positio
  est quadam situs: sicut homo est quoddam animal: non tamen omne animal: sic positio
  et situs: totum enim situatur non tamen proprie ponitur sed partes sic situantur
  quod ponuntur. ideo secundo additum est partium sed quia positio est naturalium
  non proprie arti ficialium quae ad libitum collocantur dicente in arte poetica flacto
  horatio: Pictoribus at que poetis semper fuit equa potestas quodli pet audendi:
  ideo additum est tertio et geniati onis ordinatio: et haec positio est quidam re
  spectus extrinsecus adueniens fundatus in posito terminatus ad locum longe altius.
  De huiusmodi positione in suis praedicamentis de positione et hoc habitu frater
