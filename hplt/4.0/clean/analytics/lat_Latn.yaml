  "\"Postea quaeritur utrum poena Christi fuit satisfactoria pro omni poena. Tria
  enim sunt genera poenarum: una originalis: alia actualis, quae infligitur peccatori;
  tertia de qua dicit Beda , scilicet infirmitas, ignorantia, malitia, concupiscentia.
  Haec quatuor sunt contracta. Quaeritur ergo si poena Christi pro omnibus fuit satisfactoria.\\nVidetur
  quod non, quia qua ratione deleretur una, et aliae. Sed poena originalis fuit deleta
  per illam ; ergo et reliquae. Sed infirmitas et ignorantia remanent post baptismum:
  ergo non fuit pro omnibus satisfactoria.\\nContra: omnes creaturas praecellit Christus
  secundum quod homo ; ergo oblatio vitae illius fuit optima oblatio, et odor illius
  fuit suavissimus Domino ;ergo mors illius sufficienter satisfecit pro omni poena.\\nContra:
  mors illa fuit spiritualis, qua scilicet mortui fuerunt filii Adae quia fuit in
  anima ; mors autem Christi fuit in carne ; ergo non fuit satisfactoria pro illa,
  quia illa fuit maior, quia fuit in separatione a Deo.\\nRespondeo: In poena satisfactoria
  duo sunt: voluntas et poena: non oportet ergo quod poena Christi maior sit quam
  illa pro qua satisfecit. Fuit enim in Christo separatio anirnae a carne, et compassio
  separationis: et praeterea dolor pro peccato humani generis, sine quo non esset
  satisfactum etiam cum aliis duobus, sicut patet in vera contritione. Licet patiar
  poenam in corpore, et compatiar illi poenae in anima, nisi adhuc sit dolor de peccato,
  non est vera satisfactio. Licet autem poena Christi non fuit maior quam poena pro
  qua fuit satisfactum, tamen voluntas Christi excellebat poenam originalis peccati,
  quae fuit in separatione a Deo. Voluntas autem haec secuta est ex coniunctione humanae
  naturae cum divina: unde congrue fuit satisfactoria pro separatione humanae a divina.
  Dico ergo quod haec satisfactio non tantum fuit propter separationem quae fuit in
  carne, vel propter compassionem separationis: sed propter voluntatem Christi, quae
  fuit ex coniunctione humanitatis cum divinitate, fuit satisfactum pro separatione.
  Haec enim voluntas fuit nobilissima .\\nAd hoc quod obicitur, quod non fuit satisfactum
  pro omni poena (105), dico quod quoad causalitatem satisfecit pro omnibus poenis.
  Omnis autem illa poena deleta est, quae non ordinat ad meritum: sed illae quae ordinant
  ad meritum remanent, sicut mors, concupiscentia, ignorantia, infirmitas. Ignorantia
  enim facit quod homines laborent ad acquirendum scientiam, et ita merentur: item
  facit quod homines humilientur. Unde huiusmodi poenae remanserunt ut homines luctarentur,
  et luctando mererentur. Unde, licet passio Christi sit sufficiens causa delendi
  omnes poenas, non tamen delentur omnes in praesenti, quia hoc non esset nobis utile.\"",
