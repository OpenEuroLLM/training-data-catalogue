  disponimus. Preview this item Preview this item.\"", "\"Semitae excavatoriae\\nSegmenta
  gummi excavatorisPars magni momenti sunt instrumentorum excavatorum, praebentes
  tractionem, stabilitatem et firmitatem in variis condicionibus operationis. Ex mixtura
  gummi optima factae et nucleo metallico interno roboratae ad robur et flexibilitatem.
  Formam calcandi habentes, omnibus terris aptatam, perturbatione soli minima. Variis
  latitudinibus et longitudinibus praesto sunt ut variis exemplaribus excavatorum
  aptentur.\\nSemitae e caucciu fabricatae excavatoriae in constructione, hortis ornandis,
  demolitionibus et agricultura adhibentur. Aptae sunt ad laborandum in variis superficiebus,
  inter quas sunt lutum, glarea, saxa et pavimentum. Ideales sunt spatiis angustis
  et locis delicatis ubi ferreae traditionales damnum inferre possunt. Comparatae
  cum ferreis trabibus, facultas agilitatis augetur, pressio soli minuitur, et perturbatio
  loco ad minimum redigitur. Commoditatem operatoris emendat et vibrationem sonitumque
  durante operatione minuit. Sumptus sustentationis minuunt et periculum laedendi
  superficies pavimentatas deminuunt. Flotationem et tractionem in terra molli vel
  inaequali augent, efficaciam generalem machinae emendantes. Pondus machinae aequaliter
  distribuit, pressionem soli minuens et perturbationem soli minuens. Optimum tenacitatem
  et imperium praebet, praesertim cum in superficiebus declivibus vel difficilibus
  laboratur. Superficies delicatas, ut asphaltum, prata et semitas, a damno durante
  operatione protegit.\\nSumma summarum,vestigia excavatorumSuperiorem tractionem,
  perturbationem soli imminutam, et versatilitatem in variis terris offerunt, quae
  eas ad operationes excavationis et constructionis efficaces et parvi impactus reddunt.\\nCommoda
  productorum nostrorum\\nChangzhou Hutai Rubber Track Co., Ltd. est societas in fabricatione
  et venditione specializata.vestigia excavatoris e caucciuet stipites cinguli e caucciu.
  Plus quam habemusOcto anniexperientiae fabricationis in hac industria et magnam
  fiduciam in productione productorum et cura qualitatis habemus. Producta nostra
  praecipue alia commoda habent:\\nMinus damni per circuitum\\nSegmenta gummea terram
  mollem minus quam segmenta ferrea ex rotis sulcos perfodiunt et viam minus quam
  segmenta ferrea laedunt. Segmenta gummea herbam, bitumen, et alias superficies delicatas
  protegere possunt, damnum solo minuentes propter naturam mollem et elasticam gummi.\\nVibratio
  parva et sonitus humilis\\nPro machinis in locis frequentibus operantibus, cinguli
  excavatorum parvorum minus strepituosi sunt quam cinguli ferrei, quod commodum est.
  Comparati cum cingulis ferreis, cinguli e gummi minus strepitus et minus vibrationis
  in operatione producunt. Hoc adiuvat ad meliorem condicionem operandi et perturbationem
  incolis et operariis circumstantibus minuit.\\nOperatio celeris\\nSegmenta excavatoria
  e gummi permittunt machinam celerius quam segmenta ferrea moveri. Segmenta e gummi
  bonam elasticitatem et flexibilitatem habent, ita celeritatem motus maiorem ad certum
  gradum praebere possunt. Hoc ad meliorationes efficientiae in quibusdam locis constructionis
  ducere potest.\\nResistentia ad attritionem et anti-senescentia\\nSuperiorvestigia
  minifossaeVarias condiciones operandi difficiles sustinere possunt, atque tamen
  propter validam resistentiam ad detritionem et proprietates anti-senescendi stabilitatem
  ac diuturnam retinere.\\nPressio terrae humilis\\nPressio ad terram machinarum vestigiis
  gummi instructarum relative humilis esse potest, circiter 0.14-2.30 kg/CMM, quae
  est causa praecipua usus eorum in solo humido et molli.\\nTractio optima\\nFossatrix
  per terras asperas facilius navigare potest propter tractionem suam auctam, quae
  ei permittit duplo plus ponderis quam vehiculum rotatum eiusdem magnitudinis trahere.\\nQuomodo
  vestigia excavatorum conservanda sunt?\\n1. Cura et purgatio:Segmenta e gummi excavatorum
  saepe purganda sunt, praesertim post usum, ut arena, sordes, et alia sordes accumulatae
  removeantur. Utere instrumento aqua repleto purgationis vel tormento aquario altae
  pressionis ad purgandas segmenta, praecipue attendens ad sulcos et alias areas parvas.
  Dum purgas, cura ut omnia omnino exsiccentur.\\n2. Lubricatio:Nexus ferriviae fossoris,
  rotae dentatae, et aliae partes mobiles omnes regulariter lubricandae sunt. Flexibilitas
  catenae et rotae dentatae conservatur et detritio minuitur per usum lubricantis
  idonei. Attamen, ne oleum superficies e caucciu fossoris contaminet, praesertim
  cum reficitur vel oleo uteris ad catenam transmissionis lubricandam.\\n3. Tensionem
  adapta:Fac ut tensio cinguli gummei specificationibus fabricatoris respondeat, eum
  regulariter inspiciendo. Cinguli gummei regulariter aptandi sunt, quia si nimis
