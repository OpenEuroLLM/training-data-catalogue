  incre dibile non erit si factor omnipotens cogitatur: non erit impossibile quicquid
  erit: haec ille. Facile est hoc concipere scandenti tertium caelum vt multiplicato
  posteriori rema neat prius immultiplicatum: eadem enim albedo multis albedinibus
