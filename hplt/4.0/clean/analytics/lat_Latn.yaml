  quod tangitur est actus: ex quo infertur primo quod motus non est non ens: quia
  actus positiuum dicit. Secundo quod non est alteritas: quia vt scribit philosophus
  in post predicamentis: motus sunt sex species quarum alteratio vna est ex qua est
  alteritas. motus igitur est genus alteritatis seu altera tionis. Tertio quod non
  est inequalitas: quia proprie inequalitas in solo predicamento quantitatis reparitur:
  non sic motus: hee. 3. opiniones sua habent fundamenta: tamen sunt falsae: dato
  quod vergat aliqualiter in non ens et mobile altere tur et sic fiat inequile neutrum
