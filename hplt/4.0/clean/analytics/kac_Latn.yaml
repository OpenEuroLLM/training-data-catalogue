  masha sha bang ai lam koi na.\\n- Shana hkying; 11:00Pm to Hpang Jahpawt hkying;
  3:00Am Sin (Liver) tinggyeng bungli galaw aten,\\n-Shana hkying 11:00Pm a hpang
  daw aten hpang hkrat nna yup ze ai, n yup ai sha nga ai hpe koi na, yup sana. Hkying
  11:00Pm to 1:00Am Shagri, Hkying 3:00Am to 5:00Am Sinwawp mung tinggyeng bungli
  galaw la aten re majaw hkru hkru yup ya ra ai.\\nRef. Professor Daw Khin Phyu\"",
  "\"Myen ni a shingdu lam maumwi mausa hpe hkaja yu ai shaloi, prat 4 ginhka tawn
  ai hpe mu lu ai. (1) Anoratha prat, (2) Bayinnawng prat, (3) Alongphaya prat, (4)
  Shanglawt lu ai shani kaw na dai ni du hkra na prat ni rai nga ai. Prat 1-3 gaw-gap
  ai kaw lawu ga na bum nga masha ni a ginra ni hpe zing la nna masha ni hpe gaw Myen
  ni ra sharawng ai hku asung jashawn wa masai. Raitim dai bum nga masha ni a lam
  gaw shanhte a maumwi mausa kaw ntsun shalawm ai sha, Myen ni ram nna gaw-gap wa
  lu ai hpe sha shadan shadawng wa masai.\\nLARAM AI WUNPAWNG MYUSHA NI A LAM:- 1885
  ning kaw British ni Myenmung ting hpe zing la ai hpang, bum nga masha ni a ginra
  ni hpe matut zing bang wa ai shaloi, kaga amyu in British hpe hkap gasat ai lam
  n-galaw ma ai raitim, anhte Wunpawng Myusha ni gaw 30 ning grup yin laja lana hkap
  gasat ai lam, mungkan majan (I) kaw magrau grang let sinna mungdan hkan e gara hku
  gasat du hkawm ai lam, Myen ni woi shang wa ai Japan ni gaw British ni hpe Myenmung
  kaw na gasat shapraw kau sai raitim, Wunpawng Myusha ni gaw Japan ni hpe htunghpau
  sinat hte hkap gasat nga ai hpe mu ma ai shaloi, British hte American ni gaw India
  kaw nna Myenmung de bai shang wa nna Wunpawng myusha ni hpe hpyen hpaji loi li sharin
  ya nhtawm jak sinat ni jaw dat ai hte Japan ni hpe Myenmung kaw nna gara hku gawt
  shapraw kau lu ai lam, shing re ai laram a majaw Myen hte bum nga masha ni yawng
  kalang ta shanglawt lu na matu Gen. Aung San gaw Wunpawng Myusha ni hpe garum hpyi
  ai lam, Myenmung shanglawt lu ai hte lawu ga hkan e gasu wa ai Myen Communist hpung
  ni hpe mung, Jinghpaw dap ni e shagrawt kau ai lam, Myenmung ting hpe bum nga masha
  rawt malan hpung ni e zing la nna Yangon sha ngam sai ten hta U Nu hpe Yangon asuya
  nga nna jahpyak shamying hkrum ai shaloi, 3 ya laman Jinghpaw dap ni e hkye la ya
  sai. Shing re ai Wunpawng Myusha ni a laram ai hpe Myen ni a matu gaw chyeju dum
  na malai na chying hkrit hpa rai wa sai.\\nWunpawng Myusha ni gaw Myen hpe gade
  lang hkye la wa sai raitim bum nga masha ni lu ging ai ahkaw ahkang n jaw ai majaw
  1961 ning kaw rawt malan hpang wa sai. Dai shaloi Myenmung a Commander-In-Chief
  rai nga ai Gen. Ne Win gaw grai hkrit kajawng mat sai rai nna, bum nga masha ni
  hpe shamyit kau lu na matu shawng nnan e, 1962 ning hta U Nu asuya hpe daru magam
  zing la nu ai. Myen asuya ni asak matut hkrung lu na matu ra ahkyak dik ai ten ni
  hta Wunpawng Myusha ni hpe hpyen masa, mungmasa kaw asung jashawn ngut sai rai nna,
  ya gaw shamyit kau na mahtang ladat shaw masai. Ahkyak ai gaw, KIO hpe sha n rai,
  npawt nhpang rai nga ai Wunpawng Myusha ni hte hpawn lu shamyit kau jang gaw kaga
  ngam nga ai ni hpe matut shamyit na matu lit nli na sai, nga nna myit la manu ai.
  Shing rai prat (4) hta mung prat (1-3) na zawn bum nga masha ni a amying shingteng
  ni Myenmung a maumwi mausa kaw na shamyit kau lu na matu hkyen wa sai. Dai majaw
  1963 ning hta Wunpawng Myusha ni hte KIO hpe shawng shamyit kau na matu masing shalat
  masai.\\n(1) Makam masham lam hpe dumbru dumbra galaw dat ai hte kahkyin gumdin
  lam lu jahten sai.\\n(2) Hpakant hpe gat lawk shatai nna nanghpam malu masha shabra
  dat ai hte aten kadun laman Wunpawng Myusha ni kani ya byin wa sai.\\n(3) Mokong,
  Monyin, Hpakant hkan e AIDS ana kanu ni shabra dat ai hte amyu hpe jahten sharun
  lu ai ana ahkya ni chyam bra wa sai. Kaga ladat ni law law nga ai raitim ndai myu
  masum gaw na chying ahkyak ai masing a npawt nhpang rai nga ai.\\nHpang na aten
  ni hta Ne Win hpe nra sharawng ai General ni nga wa ma ai raitim, bum nga masha
  ni hpe shamyit kau nna Burmanization masing awngdang wa lu hkra shalat tawn ai Ne
  Win a ladat hpe gaw dai ni du hkra tup hkrak hkan shadik shatup wa masai.\\nKIO
  HTE CPB MILITARY ALLIANCE GALAW:- Aten ladaw hte grup yin a masa hta hkan nna KIO
  gaw CPB hte Military Alliance galaw nna hpyen man bung ai Myen hpyen asuya hpe pawng
  gasat na matu myit hkrum nhtawm hpyen hpaji ni mung jahtuk shabung wa nga magang
  sai. Dai shaloi Myen hpyen asuya a matu na chying hkrit hpa byin wa ai. Madung gaw
  KIO hte CPB hpyen man pawng dat ai hte Miwa gaw KIO hpe laknak ntaw ntsang jaw na
  rai nna, shawng de British hte American ni Kachin hpe laknak jaw dat ai hte Japan
  ni hpe Myenmung kaw nna lu gasat shapraw dat ai hpe mu wa sai zawn, ndai lang gaw
  Myen ni asum hkam ra ai baw rai wa na sai nga nna asan sha mu wa masai. Dai majaw
  hpyen asuya gaw shi a hpyen rai nga ai Miwa hte lawan ladan jahkau la nna hpu nau
  Wa hpung hpe asung jashawn ai ladat hte 1989 ning hta CPB ni hpe daru magam zing
  la manu ai. Tau nau nna hkyen tawn sai hte maren Wa hpyen hpung gaw Myen hpyen dap
  hte gap hkat jahkring nna Wa ni hpe sut masa ahkaw ahkang amyu myu jaw let shabyawng
  kau masai.\\nGAP HKAT JAHKRING:- KIO maram yu dat ai shaloi, aten galu gasat poi
  shang wa ai rai yang, KIO gaw Myen hpyen dap hpe ndang ai zawn, Myen hpyen dap mung
  KIO hpe nlu shamyit kau ai majaw, lahkawng maga de sum kaba byin wa na hpe mu wa
  sai. Grau sum na gaw mungmasha ni rai wa na re. Dai majaw hpyen masa hpe shazim
  tawn nna mungmasa hku majan matut gasat na matu daw dan nhtawm 1994 ning kaw gasat
  jahkring tawn masai. Mungmasa majan gasat na matu constitution rai nnga ai majaw
  asuya hte pawng nna National Convention kaw constitution jawm ka wa ai rai yang
  2008 ning kaw ka ngut nna mungmasa hku matut gasat hkat na matu Kachin State Progressive
  Party (KSPP) ngu ai mungmasa party hpe hpaw dat sai. Myen gaw Wunpawng Myusha ni
  a hpyen masa hte mungmasa hpe hkrit tsang nga ma ai majaw myu lahkawng yan hpe shamyit
  kau lu na matu KIO hpe Border Guard Force (BGF) galaw shangun nna KSPP hpe gaw ra
  lata poi shang na ahkang n jaw ai.\\nTHEIN SEIN ASUYA:- 2011 March 30 ya shani Thein
  Sein asuya lung wa sai. Dai asuya gaw mungdan kata kaw mung, shinggan kaw mung Myen
  asuya hpe ninghkap nga ai ni hpe simsa lam galaw na matu ndau nga masai. Rawt malan
  hpung ni hte gap hkat jahkring tawn na lam tam wa masai. Raitimung mungdan ting
  hta hpyen masa hte mungmasa kaw hkam dahka nga ai simsa lam lu wa na matu gaw, 1963
  ning kaw ladat shaw hpang wa sai hte maren Wunpawng Myusha ni hte simsa lam la tawn
  sai KIO hpe shawng shamyit kau ra ai, nga nna jahtuk magang sai hte maren shadik
  shatup galaw hpang wa masai. KIO hpe hpyen masa hku lu shamyit kau ai hte kaga rawt
  malan hpung ni gaw hpung langai a hpang langai asum hkam wa sana rai nna, dai rawt
  malan hpung ni hpe kam hpa nga ai Ma Kaw mung rawt malan hpung ni a ntsa e myit
  mada shara n nga sai majaw mungmasa shaga ai hta n-gun kya wa na sai nga nna tak
  la ai.\\nUNFC HPAW SHABAWN:- KIO woi ningbaw ai UNFC hpe woi hpaw shabawn dat ai
  shaloi Myen hpyen asuya hpe bai kajawng shangun sai. Dai majaw hpu nau Wa ni UNFC
  kaw nsa shang lawm hkra shawng de dawm la kau sai ahkaw ahkang amyu myu bai jaw
  nna kalang mi bai shalen la lu masai. Matut nna UNFC hpe jahten sharun kau lu hkra
  ladat amyu myu hte shakut nga masai.\\nMAJAN HPANG:- Ku Kang hpung hpe nhtoi 3 ya
  hte shamyit kau wa sai. Wunpawng ramma ni hpe yu yang 70% daram gaw kani ya, tsa
  ya, AIDS ana kanu ni byin ma sai zawn, KIA hpyen la ni hta mung kani ya law mat
  sai majaw naw lang mai ai laknak pala ni gaw nanghpam malu masha hte galai lu kau
  sai rai nna, lang n mai sai laknak ni sha lu na masai. Shing rai KIA hpyen la nnan
  sa galaw na matu ramma ni mung ndum shamyi si htum ma masai. Raitimung KIO ginra
  gaw dam ai majaw tsep kawp zing la na matu 10 ya na na re, nga nna maram nhtawm
  2011 June 9 ya shani e gasat hpang wa masai. KIA hpyen hpung ni hpe Chemical laknak
  ni hte hkan gasat ai zawn, mare, yi sun hkauna hkan tam lu tam sha nga ai mungmasha
  ni hpe mung hkan gap sat hkawm ai hta n-ga, Yello Rain ngu ai chemical laknak hte
  mung matut manoi gasat wa masai raitim nlu dang la ai hta n-ga, Myen maga de hpyen
  hpung hkying kaba hkrat sum wa ai majaw ladat nnan bai shaw manu ai.\\nMa Kaw hpe
  lu abawk la ai hte sinna masha ni jawm madi shadaw wa na mara ai. Dai shaloi rawt
  malan hpung ni yawng mung gasat jahkring kau wa na mara ai, nga nna kam let ta tut
  galaw wa ma ai rai yang, kaja nan kaga hpu nau rawt malan hpung ni gaw satan wa
  gunglau ai mahkrun kaw hkan gashawt nang mat wa masai. Shing rai satan wa gaw KIO
  hpe simsa lam mahtan masu nna ta tut kaw gaw lawu ga na shi a hpyen hpung ni hpe
  KIO ginra de sa bang dingyang rai laknak n hpai ai mungmasha in hpe hkan zingri
  roirip sat hkawm wa sai.\\nMAJAN A MAHTAI:- Ndai majan a mahtai gaw, WP myusha ni
  hta na chying sum machyi wa sai. Raitim si htum wa nga ai kani ya, tsa ya, AIDS
  ana kanu ni hpe shabran dat shangun nna tinang a asak hte amyu hpe aten dep makawp
  maga la lu na matu masawp dep ai laknak ni magra jum nhtawm gasat bang wa nga ga
  yang, mungdan kata hkan, maigan mungdan hkan shawng de dumbru dumbra rai ninghkap
  hkat nga ai myutsaw sha ni gaw kahkyin ai shawang myit hte tinang a hkum hpe tinang
  nan lit jaw la nhtawm byin mai ai shara kaw lit shang jum nga masai.\\nWP MYUSHA
  NI RA SHARAWNG AI HKRANG:- Bum nga masha ni yawng ra sharawng ai gaw Panglong myit
  hkrum ga sadi kaw rawng ai hte maren Munghpawm Myenmung hpe gaw-gap nna rapra ai
  tara npu e uphkang sa wa na hpe jawm ra sharawng nga ma ai. Raitimung ta tut galaw
  sa wa ai Myen asuya a lai gaw myu langai (unitary) hkrang hpe tawk hprut lang wa
  ai gaw Myenmung shanglawt lu ai shani kaw na rai wa sai. Magyi magaw re ai hpri
  tawng hpe malan la na matu gaw n-yak ai. Raitim magaw ai hpun tawng hpe malan la
  na matu gaw n byin ai.\\nLahta kaw tang madun wa sai masa hta hkan nna byin mai
  na lam yan hpe lata ra saga ai. Mungkan grup yin na myutsaw hpu nau ni a ningmu
  hpe maram yu yang, ganoi tsa htam hpring ngu na daram gaw awmdawm ahkaw ahkang lu
  ai munghpawm mungdan hpe ra sharawng nga ma ai. Raitimung munghpawm myenmung hpe
  ra sharawng ai gaw loi li she arai nhten! Rai yang, yawng e jawm ra sharawng ai
  hpe lu wa na matu gaw dinglun hkat nga ai hte sha gaw lu wa na n re majaw hkum dek
  shagu atsam htum hte jawm shakut sa wa ra saga ai. Raitimung bum nga myusha in yawng
  lawm ai mungdan rai ra na re. Yaw shada tawn ai masing awngdang wa na matu bawng
  jahkrup ai shaloi, \u201cShing ngu yang Myen asuya n hkraw ya na ma ai majaw\u2026..\u201d
  ngu ai rai yang gaw, satan hpe asum jaw kau ai lachyum sha rai wa na re. Myen ni
  ding yang tsun chye ai ga hkaw, \u201cBum nga masha ni gaw myit hpraw san ai amyu
  ni rai ma ai\u201d nga ai re. Lachyum gaw, \u201cBum nga masha ni grai anya ma ai\u201d
  ngu ai lachyum rai nga ai hpe yawng chye nga chyalu re. Bum nga masha ni shanhte
  ra ai hte maren hkan madat ya hkra, jahkrit ai ladat, shamyawk ai ladat amyu myu
  lang dat ai hte bum nga masha ni gaw ntsen nga ninglen tinang maga de asum hkam
  nhtawm da sang kataw bang ya wa saga ai. Hpang de Myen in hte hkrum shaga ai shaloi
  Myen ni a akyang hte ladat ni hpe jai lang chye ra na masa nga ai.\\nMunghpawm Mungdan
  (Union of Ethnic Nationalities) kaw Unitary hkrang sha ra sharawng ai Myenmung nlawm
  ai. Ga shadawn, sumwum si langai hpe yu dat yang, ntsa lam na htat ai shan gaw kata
  na atum kaji hpe gayawp tawn nga ai. Lachyum gaw ntsa na shan gaw Munghpawm Mungdan
  rai nna, kachyi sha re ai atum gaw unitary hkrang hpe ra marit nga ai Myenmung rai
  nga ai. Myenmung a htingbu mungdan gaw Munghpawm Mungdan langai sha nga ai raitimung
  panglai ngu ai n nga ai. Panglai grup yin gaw moi chyaloi nhkoi kaw nna Munghpawm
  Mungdan e tsep kawp madu tawn da sai (Mon, Kayin, Yahkaing). Matse ai satan ni zing
  la kau ya ai hpe Mon, Kayin, Yahkaing ni a shingdu maumwi kaw mu lu nga ai. Shing
  rai kaga hpu nau ni yawng mung munghpawm mungdan hkrang hpe ra marit nga ma ai rai
  yang, satan gunglau ai hpe jan lu ai atsam n nga shajang ai majaw satan a npu e
  mayam naw tai shajang nga ga ai. Munghpawm Mungdan gaw lam shagu hta ra n rawng
  hkra hkumtsup nga ai majaw mungdan gaw-gap lu ai hpang aten gadun laman mungkan
  kaw na chying lu su simsa ai mungdan byin tai wa na re.\\nSATAN HPE MARA SHAGUN
  NA KUN? Sung sung myit yu yang satan wa gaw kaga masha ni hpe gunglau jahten sharun
  na matu lit nga ai hte maren shadik shatup sa wa nga ai majaw shi hpe mara shagun
  na lam n nga ai. Anhte mahtang Yehowa jaw da ya ai machye machyang hpe lang nna
  kahkyin gumdin ai n-gun hte tinang a amyu ni hpe makawp maga sa wa lu na matu lit
  nga ai hpe galaw na malai, satan wa a gunglau ai kaw hkan kataw hkawm nga ai aten
  naw rai nga ga ai. Tinang kaw ning ra nga ai hpe yin la nna gram sharai la na matu
  atsam rawng ai shani gaw satan hpe dang kau nna rawt jat wa na aten du sai, ngu
  nna hkam la ra saga ai.\\nMyutsaw hpu nau nlang hte satan a mayam prat kaw na lawt
  wa lu nna Munghpawm Mungdan hpe jawm gaw-gap na matu myit sharawng shajang nga sai
  hpe jut shagu de na shiga ni na lu nga air majaw n-gun lu ai. Mungkan ting kaw chyam
  bra nga ai hpu nau bum nga masha bawsang shagu chye na lawm hkra hkan htawn tsun
  ra saga ai. Shanhte dum hprang wa ai hpang gaw, shada matut kahte hkat ai ladat
  hte aten langai a laman e chyam bra wa nna maigan mungdan ni hte UN kaw na matut
  madi shadaw wa hkra tsang langai a hpang langai lahkam sa wa lu na re.\\nMUNGMASA
  NINGMU:- Mungmasa ngu ai gaw na chying dam lada ai majaw dam lada ai myit jasat
  hte shadik shatup nna tsun shaga ai jasat hpe na la ai ni hku nna myit hkrum ya
  mai na ma ai. Lai wa sai ten ni kaw bum nga masha ni hta, kaga masha ni a lam gaw
  tinang hte n seng ai zawn, kadai mung kade amyu a ginra, laili laika hte htunghking
  hpe sha ahkyak tawn wa saga ai. Raitimung satan wa gaw, shi a ginra hte htunghking
  gaw shi hte sha seng ai zawn, bum nga masha ni a ginra yawng mung shi hte sha seng
  ai, nga nna hkam la nhtawm ahkyak la sa ai nga yang, bum nga masha ni yawng hpe
  mayam lu yam sha nga ai gaw mau hpa n rai nga ai. Mungdan langai hpe madu lu na
  matu hkam la ra ai atsam gaw dai mungdan a madang hte bung pre ai hkam la lam lu
  ra ai hpe jawm chye nga chyalu rai na sai.\\nMasing kaba langai hpe myit shapraw
  la na matu gaw kade mi n yak nhten! Raitimung dai myit shapraw dat ai hpe galaw
  hpang na matu tawk hprut dawdan nna ta tut galaw hpang lu ai atsam gaw na chying
  yak ai. Law malawng gaw satan wa a gunglau ai hpe n jan lu ai majaw kataw mat nna
  shada dinglun mara shagun hkat ai de lam numshe shang mat chye ga ai. Kade rai nna
  ai laman shanglawt lu wa ai East Timor hte South Sudan a ntsa e maram yu yang, shanglawt
  lu ging ai shingdu maumwi ngang kang ai hta n-ga, maigan mungdan ni hte UN hpe matut
  mahkai ai hta htap htuk ai mahkrun hku sa wa lu ai hta hkan nna awngdang wa ma ai
  hpe maram lu ai. Anhte gaw-gap na Munghpawm Mungdan a lam ni gaw mungdaw shagu hta
  ngangkang ai shingdu labau ni nga nga shajang chyalu re.\\nMunghpawm Mungdan gaw-gap
  na hte seng nna ndai zawn rai ningmu garan kachyan galaw ai a npawt nhpang gaw,
  awmdawm ahkaw ahkang lu ai mungdan gaw-gap na matu shani shagu pru wa ai nsen ni
  na lu ai zawn, laili laika hkan e mung mu hti lu nga ai majaw tinang mung myit lawm
  wa let shang jahta lawm ai rai sai. Ndai ningmu a ntsa e grau hkumtsup dam lada
  ai madang hku mu lu ai hpaji ninghkring ni gaw ta tut jawm galaw lu na matu pri
  nen ai hkrang hpe shalat shapraw dat ai kaw atsang langai a hpang langai galaw awngdang
  wa na re, ngu nna shingran mu ai hpe myutsaw hpu nau ni myit yu na matu kamhpa let
  lajin dat ai.\\nGINCHYUM:- \u201cLagawn ai wa e, hkagyin hpang de sa su\u201d nga
  nna Ja Chyum mungga kaw matsun da nga ai. Yehowa kaw kamhpa let kyu hpyi ai hte
  maren, tinang a hkum hkrang n-gun atsam yawng hpe asung jashawn let shadik shatup
  sa wa yang sha awngdang wa mai ai hpe shadum da nga ai.\\nDai ni na ten hta WP Myusha
  ji nban yawng hte tsaw htum ai Yehowa kaw aja awa kyu jawm hpyi nhtawm gasat sa
  wa nga ai majan awngdang lam gaw bum nga masha myu bawsang yawng a matu rap ra ai
  munghpawm mungdan gaw-gap wa lu nna, Karai Kasang a mungdan hpe maden zinghka wa
  shangun lu ai mungdan hpe gaw-gap lu u ga matu, hkagyin zawn laram rawng ai n-gun
  hte atsam htum shakut sa wa ga law.\\nPyilan\\n12 February 2012\\n8 comments:\\nTsun
