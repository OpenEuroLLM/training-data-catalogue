sample: '["\"Hpungtang hpaji ginra\u666f\u9887\u79d1\u666e\\nSi shum hpe majoi n mai
  sha ai\\n\u5473\u7cbe\u4e0d\u80fd\u5403\u5f97\u8fc7\u591a\\nSishum go zolau myu
  mi re, madung go guansonna rai nga ai Sishum go simai mu na matu bang sha ai re,
  Mi\\n-\\n2015-01-30\u6881\u6cb3\u7b2c\u4e8c\u6279\u8001\u8336\u56ed\u6539\u9020\u6709\u5e8f\u63a8\u8fdb\\nLengho
  ginwang ni nambat lahkong ngu na magam madi shado lam-Hpalap yi dingsa gram lajang
  mu galo hpang wa\\n-\\n2015-01-30\u5168\u56fd\u4e13\u5bb6\u5b66\u8005\u7814\u8ba8\u6cbf\u8fb9\u5f00\u53d1\u5f00\u653e\u65b0\u8d8b\u52bf\\nShata
  12 nhtoi 23 ya ko nna 24 ya shani du, mungdan magam rapdo muhtam lom gok hte mungdo
  gaba asuya ni\\n-\\n2015-01-30\u4e2d\u592e\u519c\u6751\u5de5\u4f5c\u4f1a\u8bae\u5728\u4eac\u53ec\u5f00\\nGinjo
  hkaimu gahtong muhtam zuphpong shata 12 nhtoi 22 ya shani ko nna 23 ya shani du
  Bekyin ko hpo hpong\\n-\\n2015-01-30\u515a\u7684\u4f1a\u8bae\u7cbe\u795e\u8fdb\u50a3\u6751\\nWo
  Htun zuphpong mungga hton tsun dan nga ai Aga myu 5 htehko ndau ai hpung masha,
  mungdo asuya chyare\\n-\\n2015-01-30\u56fe\u7247\u65b0\u95fb\\nShata 12 nhtoi 21
  ya shana, Yinnan, Hongkong, Aumun re hkan na hkunghkrang shalik shakyang masha ni
  anhte mu\\n-\\n2015-01-30\u5dde\u5341\u56db\u5c4a\u4eba\u5927\u5e38\u59d4\u4f1a\u53ec\u5f00\u7b2c\u5341\u4e09\u6b21\u4f1a\u8bae\\nSakhkung
  mungdo ningdo mungchying sha gasa zuphpong gaba dinggrin salang rapdo nambat 13
  lang zuphpong hpe sha\\n-\\n2015-01-30\u9f9a\u656c\u653f\u8c03\u7814\u9f99\u745e\u516c\u8def\u8fdb\u5c55\u60c5\u51b5\\nKung
  Gyin Jin modo lam htu ai masa hkan sagon nga ai Shata 12 nhtoi 17 ya shani, mungdo
  pati rapdo mu\\n-\\n2015-01-30\u9884\u9632\u732a\u751f\u75c5\u76846\u79cd\u65b9\u6cd5\\nLama
  nang wa watung sha, wa hkye, n san seng wa tu n ra re manghkang pru jang go, sadi
  ra sai, ndai ni\\n-\\n2015-01-30\u5403\u7a7a\u5fc3\u83dc\u53ef\u964d\u8840\u7cd6\\nHkungsinzhai
  simai hta zhenwui su lo lo rong ai majo, pu kan shamot shadut, shat rin ai hta akyu
  rong rai\\n-\\n2015-01-30\u611f\u5192\u6709\u51e0\u79cd\\nHkron kap wo ana go grai
  na hkra tsi shamai wa yu ai hpang, mai wa ai n mu nga ai, shing rai nna wo a\\n-\\n2015-01-30\u8001\u5e74\u4eba\u4e0d\u80fd\u5403\u5f97\u51e0\u79cd\u65e9\u70b9\\nSak
  gaba masha ni a malu masha ko grai sadi ra ai, manap shat mung grai ahkyak ai, sak
  gaba masha ni mal\\n-\\n2015-01-30\u6cbb\u9ad8\u8840\u538b\u76848\u79cd\u65b9\u6cd5\\n(1)
  Kongkang hpa: Pot lom ai kongkang hke 120, n-gu ja hke 250 Kongkang hpe ta layung
  daram galu nna gash\\n-\\n2015-01-30\u5e38\u5403\u9ad8\u7cb1\u7ca5\u80fd\u51cf\u80a5\\nLama
  hkum hkrang shamu shamot nna hpum shagrit mayu ai rai yang, malu masha loi tek shingdang
  jang rai sai,\\n-\\n2015-01-30\u51ac\u5929\u62a4\u8eab\u7684\u996e\u98df\\nNingshung
  ta du sai hte maren, hkum hkrang shara shagu gashung hkra wa sai, dai majo sadi
  sahka ra sai Ra\\n-\\n2015-01-30\u5403\u67da\u5b50\u76ca\u5904\u591a\\nLuihpom si
  go anhte mayu e sha ai namsi myu mi rai nga ai, shi ko ntsin grai rong ai, lusha
  dat n-gun m\"", "\"Danai de Myen ni n shalai ai majaw hpyen yen buga masha 4,000
  jan Lido lam, Daihpa kaw chyat rawng taw nga ai lam chye lu ai.\\nYa ten du hkra
  Danai Hkalup, AG hte RC nawku hpung masum kaw hkap la tawn ai hpyen yen 1,000 jan
  re. Raitim shanhte hpe Danai kaw n tawn ai sha Kawng Ra de htawt kau na matu seng
  ang ai Danai hpyendap hte asuya ahkaw ahkang lu ni gaw nawku hpung ni de jahkring
  hkring sa matsun ai lam, nawku hpung ni tsun ai re.\\nMyen asuya Myen hpyendap matsun
  ai Nawnglung Kawng Ra mare gaw Danai mare n du shi ai deng 10 hta nga nna, majan
  ginra re majaw shimlam n nga ai shara re.\\nJune praw 5, bat Langai Ya jahpawt daw
  12:30 am daram hta, Nga Mai Kung (Awnglawt lam she) na Myen hpyendap ni Kawng Ra
  de laknak kaba 4 lang gap bun ai majaw Nbwi jan gaida hkan nu nta masha 3 hkala
  hkrum mat ai re.\\nDai shani kaw nna Nawnglung Kawng Ra mare masha ni yawng ngu
  na mung ni nawn ai Ting Kawk hte Danai de hprawng yen nga ai re.\\nHpyen yen buga
  masha ni ntsa Myen asuya Myen hpyendap a ganawn mazum ai sat lawat ntsa bat Kru
  Ya shani Danai de sa du gawan nna Myitkyina de bai du wa ai Jinghpaw Wunpawng Hkalup
  Hpung Ginjaw, KBC amu madu Rev. Dr. Hkalam Samson ndai zawn tsun ai.\\n\\\"Um anhte
  hpyendap ni shanhte shara la mayu na shakyin ai bungli re. Shanhte rai tim hpyendap
  chyu sha n re asuya hte pawng nna galaw ai bungli rai ma ai. Hpa majaw nga yang
  asuya de na uphkang ai ni lawm nna laika wa jahkrat ai re majaw shanhte a myit jasat
  gaw...anhte asan sha mu lu ai le. Anhte ni hpe dai zawn jamjau jaw ai. Rai na ding
  tawk hku wa mai ai ni hpe mung pat kau rai nna htaw nhtang hku wa. Rai nna Danai
  kaw mung hpyen yen n kam yu ai nga nna hpyendu kaba wa gaw dai kaw na gawt kau re
  ni...hpe yu shaloi gaw anhte mungshawa ni hpe grau nna Wunpawng sha ni hpe dingsa
  jamjau hkra galaw taw ai ladat langai re ngu nna asan sha dai hku mu mada ai.\\\"\\nYa
  ten majan ginra na n lu pru shi ai Hkalup hpung masha ni grai naw nga ai lam hpe
  Danai Buga Hkalup Hpung a mying n tsun mayu ai sara langai ndai zawn tsun ai.\\n\\\"N
  lu pru shi ai grai naw nga shi ai ga rai nga ai. Ya dai anhte Sut Chyai Ginra Nawku
  Hpung ngu Danai buga hkalup hpung a mare hpung langai hku di da ai ndai Sambra,
  Oi Law, N''grau Hkrat dai hkan na ni nan gaw pyi garai pyi n pru shi nga ai ya.
  Rai na pat maw kata na ni ma n pru shi ai grai naw nga ai. Ya pru ai ngu ai mung
  shanhte lam pat da ai majaw htaw...npu de na tsun ga nga yang gaw mawng-hku lam
  pung-tsan i dai hku pru wa ai sha re. Daihpa lam hku le.\\\"\\nWunpawng Mungdan
  Shanglawt Hpyendap, KIA Dung 14 ginra Nambyu hka mayan pat maw ja maw ni hta June
  praw 3 ya shani Myen asuya dap ni htu shang wa ai kaw nna majan byin wa ai re.\\nNambyu
  pat maw, ja maw na mungmasha ni yawng \u2018June 15 hpang jahtum pru\u2019 nga nna
  Danai hpyendap hte asuya a sadi jaw laika hpe June praw 5 ya shani nbungli hte agat
  jahkrat ai re. Rai nna, hpyen yen ni Danai de pru wa jang, ya ten du hkra lam hkap
  pat da ai re.\\nPopular\\nLatest\\n- KIO Ndau Shabra Laika, August 30 2010 (KNG
  TV) 31 Jan 2014\\n- 17 lang na Nhkum Hpunau ni a Manau Poi - 2010 (Ndau Laika) 7
  Apr 2010\\n- 2008 ''Jinghpaw Share Shagan'' (Sawk Madun Laika) 25 Dec 2008\\n- 2010
  Nov. 7 Myen Mung Ralata Poi Ntsa AKSYU A Ndau (Ndau Laika) 3 Nov 2010\\n- 2011 January
  10 Shatapru Manau Poi gara hku galaw na da law? (ningmu) (Ningmu) 30 Dec 2010\"",
  "\"\u65f6\u95f4:2020-01-20 16:30:08 \u6765\u6e90:\u5fb7\u5b8f\u56e2\u7ed3\u62a5\\nLaban
  bat mi jan gasat hkat saga ai, Japan hpyen ni panglai hka leng zon ganong bang wa
  mara ai, anhte Maulamyen ko galang bai chyi hkat saga ai. Man hkrum tut rai, kolan
  ri hte galun sat hkat, gamu ginchyup hkat, gawa amya hkat ga ai. Htingnut shara
  Sakhkung hka e pat kau ya sai majo, myit si myit htan gasat chyi hkat ga ai. Anhte
  kolan ri galun ai rangrut sharin la ai gasat hpaji hpe, dai lang akyu ram ram jashon
  sai hku re. Lahkong maga myi she hkye mat, nang si ngai hkrung go madu a atsam sha
  rai sai. Dai lang na majan hta, Jinghpo hpyen hte Golahka hpyen ni a majan atsam
  laksan mi dan leng pru wa sai.\\nNye myit hta, dingla ndai go gadai ganing rai gasat
  ai masha mying n rong ai, chyi hkat ai sha nga jang, gadai tsun ai maumui mung madu
  a mai shatai la ai ngu: Agu, nang nau ba sai, chyahkring mi sa la na nhten? Ngu
  ga do do dat ya nngai. Shi ta sha sharot nna bai matut tsun u ai.\\nJinghpo hpyenla
  marai latsa jan re ko na, Maji Tu ngu ai wa nambat langai kungkyang jan ai, nang
  hte maren sha Maji gasha re. Shi a nshi go galang hte galang Japan la ni a sinda
  de galun hkrai galun aprup ya, Japan la ni a sai go shi a hkum hta gatsit bun nna
  chyang kap mat sai. Ngai hta grau galu gaba ai Japan hpyenla langai e ngai hpe aga
  ko gamu apyet ton sai, ngai shi hpe ganing di nan n lu gamu gale ai majo, shi a
  gahpa npu ko ta ganu madi ton nna magra ton se ai, shaloi shi gaya sam ai, nreng
  go machyi ai kun, shi loimi gabrong wa jang ngai shi hte matum malai rai gamu gumchyup
  hkat nga ai laman, Maji Tu kagat wa nhtom, nshang na nshi tsut sho la nna, Japan
  la a palong kolan ko magra la nhtom, du hkot di gadoi di kau ya nu ai, shaloi Japan
  la de bo go aga hkan no chyai hkom nga ai, e gaja mani mayu na zon zon she re go
  e. Dai hku gasat chyi hkat to nga ai shaloi, gadai go hpyen, gadai go madu masha
  re n chye mat sai. Chyu pala marang htu ai zon ru, myok sanat gapo ai wanhkut majoi
  dun mat, sai hka she lui, hkrap nsen majon n chyi ngoi garu mat sai. Gap sat ai,
  gahtam sat ai, galun sat ai, kan gala ya nna pu kan gale abya mat ai, yu pyi she
  n gui mat ai go e. Aga ga, sai ra nau manam nna ngai nsa pyi n lu sa mat ai le.\\nMaho
  La Tsai a mayu shaga nga dangam grau krop wa sai, ngai grai myit lo wa ni ai, lama
  maumui garai n tsun ma yang mayu krop mat nna n mai shaga jang ganing di sana ngu,
  shi hpe no hkring la ga ngu galang bai tsun dat ni ai. Rai yang shi galang mi tsun
  tun to nga sai ga hko hpe nkam hkring sam ai, bai matut tsun mat wa nu ai.\\nWuitoliya
  sanghpo grai lawan nna sanghpo daru de got hkrat wa ra ai, ngai go anhte hpe majan
  sa gasat garum hkrat wa ai hpyenla hto sa wa sam ai ngu myit la nga let no yu nga
  yang, sanghpo ko nna mahkrai langai hka kau ko sho shawo dat sai, dai ten na nye
  myit go, anhte hpe garum sa ai hpyen ni yu wa nna, matse dik ai Japan hpyen ni hpe
  sa gasat shamyit na sha rai sai ngu gabu si wa ni ai, dai re wa, sanghpo kon masha
  langai mi mung n pru wa ai, la langai mi Inglik ga hku: \u201cHprong saga! Hprong
  saga! Lawan hprong saga! Sanghpo de lawan lung wa marit. Lawan mu! Lawan mu!\u201d
  Nga nna sha jahtau to nga sai. Maho La Tsai dai ko tsun du ai shaloi, ta lahkong
  hpe hkrupchya di la nna manai shala dat nu ai. Shi a myit hta daini du hkra myit
  n hkon ai zon re masa dan pra sai. Shi chyahkring mi don rai shinggan de na nbung
  n bung ai majo lap pyi n galang ai hpun ndung de yu let, nsen grau tso ai hku bai
  tsun bang wa ra ai.\\nMaji Tu hte an sanghpo de shingma yon rai, ga breng sanat
  hte Japan ni hpang de gap ahprup bun tik tik di saga ai, dai sha nrai \u201cMi esi\u201d
  ta bom mung Japan maling de gabai shapyen bun nna, Inglik hpyen, Yindiya hpyen hte
  manang ni hpe sanghpo de lawan shang nna hprong na hkinjang tam ya nga saga ai.
  Maji Tu an go jahtum e sang- hpo ko du ai re, sanghpo jak sharot ton sai, lai lakang
  dom la kau na ri ri sha rai sai, dai ten e Maji Tu nye ta na sanat ret gashun la
  nhtom, shi a hpri lakap zon ja ai ta hte ngai hpe sanghpo de magra gabai bang kau
  dat nhtom, shi hkrai sha kagyin kayang zon chyang gaput nang ai Japan ni hpang de
  yin rai, sanat ko chyu sha anyin bang la di bai gap ahprup bun dat, bom gabai bun
  rai kyin nga ai laman, sanghpo go nsa gaba makan sho let hkinggau n mu mada ai panglai
  de got hprong mat wa sai, ngai Maji Tu hpe ta galang ai hte, shaga ai hte di, lawan
  hkan gumhton shang wa rit ngu yang, sanat gap sharu ai nsen, bom gapo nsen, Japan
  hpyen ni a lawan hkan gap sat mu lo nga nna jahtau maron ai nsen ni, ngai mayu pyi
  gale mat na daram jahtau ai nsen hpe gaput kau ya sai.\\nWanhkut hte numhpu alun
  rai mong ai gata e, Maji Tu go hpri shado zon panglai hkinggau e ading jan tsap
  let, sanat gap nna gahpa ladu ashong rai, sanat hpaihka ko wan aprip rai, sanat
  langai na pala ma jang la- ngai bai galai gap rai, shi hkrai gasat chyi nga ta sai.
  Japan hpyen ni Maji Tu hpe hkan shachyut htim gap nga ma ai, Maji Tu a shingdu de
  go gumshem hpyen ni hkan htu nang, shong lam de go shingbyi shara n nga ai, sanghpo
  hkom mat wa nna ngam da ai ayan akan re panglai hka leng sha rai mat sai. Ngai yu
  nga dangam shi bom gabai bun ma nu ai, pala mung gap ma nu ai. Sak- hkung hka hte
  Mali Nmai hka ndai ko wa zup nna, laying zon re hka man wa byin ai, ndai do kon
  go Saewun panglai ngu ai mying shamying kau sai. Maji Tu chyu pala gap ma kau rai,
  sanat gaman lang nna, dam lada ai panglai de yon rai hputdi let lamu mada nga ai
  ngu jang, chyahkring sha panglai de tsat lup gumhton bang mat wa nu ai. Dai shaning
  shi asak 41 ning sha no re. Anhte sanghpo ntsa kon shi hpang de salam jo kau da
  let, shi daram majan gap la- pyin ai wa n lu hprong lot ai ngu lahpot dum let, hkrap
  myiprui hte shi hpe salam jo ai lata grai na hkra nkam shayu la ga ai. Ngai chyahtam
  shi hte grau ganon nna, masin ram ram gaprep let yu nga ninglen, Japan hpyen ni
  a sanat go Maji Tu gumhton bang mat wa ai hka ko gade hkan gap sharut bun ai re
  pyi n chye mat sai. Myok hte wuitoliya sanghpo de hkan gap bun ai bom go, nbung
  hte gayop ai asin tong zon, sanghpo makau hkan hkrat gapo nna, hka leng e sanghpo
  wa ahtu ganong ganon dat jang, sanghpo mung gale galau nga wa sai, dai ten hta,
  panglai hka leng sanghpo ko ahtu ai nsen, la ni bai nhtang na nga dagam ai nsen,
  num ni gajong nna kyek maron ai nsen, ma ni ganu ni a maron nsen hpe na gajong nna
  kyek hkrap ai nsen ni, Manggala panglai hpunggo ting gachyi mat sai, Japan ni a
  myok nsen chyau me anhte hpe hkan sa ai zon, chyu pala ma ntsang, dingyang hkan
  gap nga ta masai. Maho La Tsai ndai ko tsun du jang, shi a wuman wa n tu mat ai
  n-gup hpe shatep kau dat nu ai.\\nMaji Tu a maumui nye masin hta ahtu ganan hkra
  tik tik rai, nsa gaba pyi nsa hkra madat la ngut ai shaloi, ngai agu e, Maji Tu
  go sanat e n gap hkra tim panglai ko tsot si mat na sai i ngu bai san dat ni ai.
  Shi mani sai rai bai tsun ai, ngai mung she mau sai, dai shani na Maji Tu a hkum
  hta nat shang sai nhten, shi a hpyenla manang ni yong, anhte ta latup shaja let,
  Maji Tu, anhte matai wa htang ya na yo, myit hkum garen ngu jahtau tsun nga ninglen,
  Japan hpyen ni a myok nsen ngoi ai nna mat sai. Dai shani go 1942 ning shata 1 nhtoi
  30 ya shani rai nga ai, bai dai shani go Japan ni Myen mung Maulamyen hpe gap zing
  la kau ai shani mung rai nga ai.\\nShi ngai hpe galo mada yu let:\u201cAnhte mare
  shinggan e du ai shaloi, manang ni hpe mare shingan e hkring nga ta shangun nna,
  ngai hkrai mare de shang wa ni ai. Mare shingnom ko nna nta langai mu mada ai hte,
  dai nta de hkre hkre sa wa nna, nta madu ni e ngu tsom ra lang shaga yang she, wa-ja
  la langai pru wa ra ai. Ngai shi hpe hpyi shon ai, ngai hpe du ni a nta de woi sa
  ni ngu nngai. Shi go ngai hpe du nta ndo e sa sa kau da nna bai nhtang mat wa sai.
  Ngai nta ndo kon nta madu ni hpe sa shaga jang, la langai mi pru wa ra ai, ngai
  hpe sa tau ai wa go gadai nrai, Lahpai Zau Jun she rai nga ai. Shi go ngai tsa wa
  a ganau sing sing re. Ngai sha ganu hpe go Lahpai Nang Kai ngu ai re. Ngai hkau
  Lahpai Zau Jun ngai hpe mu ai hte, ta lahkong hte shakram chyit rai: Lamu e, ngai
  hkau La Tsai nang ganing rai ndai hkan dam pru wa ai re ta? Nang hkrai sha kun?
  Gara kon pru wa ai rai n ta? Nga nji n-gu san bang wa sai.\u201d\\n\u201cAgu nang
  chye ai masha hte hkrum nna grai gabu kau sadong?\u201d\\n\u201cGabu dik go e, n
  myit madom ai le. Ngai shi hpe tsun dan ai, ngai go Yindiya Ganangata kon lam hkom
  nna wa ai re, anhte marai kru rai ga ai, shanhte mare shinggan e no makoi nga ta
  masai. Ngu jang she, Lahpai Zau Jun go, sasa, na manang ni hpe no sa woi la saga,
  ndai hkan Japan garai n nga ai, hpa n tsang ra ai nga tsun let, manang ni hpe sa
  tau la mat wa saga ai.\u201d\\n\u201cNang shang hkyem ai nta na du go n hpa du ni
  re ta?\u201d Ngai ga do bai hkan do kau dat ya se ai.\\n\u201cDu wa hpe Lahpai Hkun
  Nong ngu ai re. Lahpai Zau Jun an manang ni hpe sa woi la nna, du Lahpai Hkun Nong
  ni a htingnu de woi wa sai. Manang ni hpe wa sa kau da nna, an go mare shinggan
  de shim lam bai sa yu hkom ga ai. Shaloi shi tsun ai, anhte go Jinghpo dap hpo nna
  Japan gasat hkyem nga ga ai nga tsun jahta let, du nta de bai n htang wa ai shaloi,
  wa yo ten rai nga ai. Nta langai ko lai wa yang, gumgai langai wa bom gasha tsom
  ra mi yo nga nu ai, wa go langai mi joi shi jan jan rai sai, Lahpai Zau Jun gumgai
  jan ko anhte hpe do jo na matu wa gasha langai mari u ai. Gumhpro lap mi sha jo
  nna, ngai go nau yu matsan dum nna dengga langai bai jat jo da sai. Dai nta sha-
  brang gasha masum mali nga ai, Lahpai Zau Jun shabrang gasha ni hpe mung so woi,
  wa rim la rai du nta de la sa wa n htom, wa sat shadu ya mani ngu, wa madu gasha
  ni hpe nan gyau kau da rai, an go mare numshang shinggan de pru mat wa saga ai.\u201d\\n\u201cAgu
  nang mi sha tsun ai, Lahpai Zau Jun nang hte hkrum ai shaloi Japan n du ai, hpa
  n tsang ra ai nga sai, hpa majo nan mare shinggan hkan shim hkam lam bai sa hkan
  zoi yu ai rai?\u201d Ngai go dingla wa nau tsun lo wa nna mahkoi malap mali re kun
  ngu, ga do do dat ni ai.\\nShaloi shi bai tsun ai go:\u201cJapan n du ai ngu tim
  shara magup Japan ni a bat hkrai rai mat sai majo, galoi du na n chye rai maja ai
  le. Anhkau mare shinggan de sa du saga ai, shi ngai hpe hkau nang yu, n dai hkan
  majan shara galo yang mai na zon n rai a ni nga san nna, ngai shi hpe she mai le,
  ndai mare ting lunghton lungma hkrai pri, hpyen ni shang wa yang hkap gasat shanyop
  manu ai shara rai nga ai ngu tsun let, lunghton ntsa de mada dat yu yang, gatkung
  grai noi sumbyau nga ai. Ngai ndai mare hpe ganing ngu ai re ni ngu san yang, Lahpai
  Zau Jun shi mung mani sha du ai rai nna rai n san yu ai, n chye ai nga ai.\u201d\\nMaho
  La Tsai tsun yang, dai shana shan hkau du ai nta de bai nhtang wa nna, ndai mare
  a mying ganing ngu ai, masha gade, htinggo gade nga ai ni san jang, du wa Lahpai
  Hkun Nong tsun dan ai, mare dai go nlung nau lo, nlung shagu lagat noi ai majo,
  Lagat gahtong ngu ai re ngu shachyan dan sai da. Gahtong go htinggo 47 rai nna,
  sha- brang go mali shi jan nga ai, asak shi matsat ning a lahta de na mahkon sumshi
  jan nga ai, ngu shachyan dan manu ai da.\\nShaloi Lahpai Zau Jun du Lahpai Hkun
  Nong hpe shi go ndai shara hta hpyendap langai hpo na matu, shanhpro hpyendu ni
  shangun dat nna shong du sa ai lam tsun dan jang, du wa mung grai madi shado ai
  ga tsun nu ai.\\n\u201cDu nta ko, mahkon shabrang ni shat lajang jahkut ton nna,
  shana shat sha na matu do dap ko shat hkan ton ya masai. Anhte shat atsom n lu sha
  ai shi langai ya tup rai sai majo, shan sangau manam hkrup ai hte hkumbai she gapya
  wa saga ai. Wa shan sau shum ai bat hte si htu simai ni a bat manam hkrup ai hte,
  htingbu Wa du ai zon, si n tsang htim sha bang wa saga ai. Ngai go shat hpe galang
  ta htom sha yang n mai ai lam dum dat nna, gade sha mayu tim loi sharam nna sha,
  manang ni hpe mung nau hkum sha shalai ngu tsun na hkyen ai, shi jan ya ting shat
  n mu sha sai majo, lama hkum htom sha ngu yang ngai hpe mahtang myit n pyo na ngu
  n tsun sai. Maho La Tsai grai sha mayu ai sharam nna no sha nga yang, shi a manang
  ni marai manga go, shat sha nga ninglen, langai hpang langai dong dong rai si galau
  mat wa masai da. Nta madu du wa Lahpai Hkun Nong go ru sai du re hta n-ga, hpyen
  du mung go rai tim, ndai zon re lam garai n mu yu ai majo, mau gajong dung mat nu
  ai. (Bai matut hti ga)\"", "\"Radio Veritas Asia Buick St., Fairview Park, Queszon
  City, Metro Manila. 1106 Philippines | + 632 9390011-15 | +6329390011-15\\nVillanova
  Mare na San Pra ai Thomas a Poi Nhtoi (September 22) 22 September 2022\\nVillanova
  Mare na San Pra ai Thomas a Poi Nhtoi (September 22)\\nSan Pra ai Thomas hpe \u201cSpain
  Mung a Kasa, Apostle of Spain\u201d nga nna masat shagrau da nga ai. Shi gaw, mungkan
  a arung arai ni hpe tsep kawp ning dang kau nna laja lana tara shadik let nga ai
  wa rai nga ai. San Pra ai Thomas gaw, 1488 ning hta Spain Mungdan, Castile mare
  kaw shangai chyinghkai wa ai. Kanu yan Kawa gaw, grai myit su ai ni rai nna, Thomas
  hpe matsan masha ni a ntsa matsan dum myit tawn na matu myit jasat dawk bang ya
  kau da ma ai. Villanova mare kaw laika sharin hkaja la let, kaba wa ai majaw shi
  a mying kaw Villanova Mare ngu shalawm da ai rai nga ai.\\nSan Pra ai Thomas Shi
  a asak (15) ning, du ai shaloi Cardinal Sara Kaba Zimenez hpaw da ai Alcafa mare
  na, Dakkasu kaw laika matut sharin la ai hpang Ildefonso College kaw na M.A Janmaw
  gup la lu sai. Hpang de shi gaw, Philosophy \u201cMyit kung zet hpaji\u201d Sara
  mung tai wa sai rai nga ai.\\n1518 ning hta Salamanca mare na, Augustinian Jau wuhpung
  de shang mat wa nna, 1520 ning hta Jau tai wa nu ai. Shi gaw, bungli galaw shaja
  ai Sara langai mi mung rai nga ai. Mungkan arung arai ni hpe koi lu ai made koi
  nna, matsan mayan rai shanu nga lai wa sai. Saradaw aya dang da hkrum ai hpang mung,
  shi gaw grai kam ram ai wa re majaw, shi a manang Saradaw ni gaw shi hpe grai tsawra
  kamhpa ma ai. Saradaw Thomas gaw masha kaga ni a matu, sumnung shingdi myit, shagrit
  shanem ai myit jasat ni a kasi majing tai wa sai rai nga ai.\\nSan Pra ai Saradaw
  Thomas gaw, 1544 ning hta Valencia ginwang na Saradaw Kaba tai wa sai. Shi gaw,
  Hkamja lam n kaja mat ai majaw, Trent Zuphpawng kaba hta n lu lawm nna, shi a malai
  Huesca ginwang na Saradaw hpe lit shatsam dat wu ai.\\n1555 ning, September shata
  (8) ya shani hta Saradaw Thomas gaw, Madu kaw yup pyaw ban sa mat wa sai rai nga
  ai.\\nSaradaw Thomas n nga mat ai hpang, 1618 ning, October shata (7) ya shani hta,
  dai aten na, Wa Sarabyin Pawlu (5) kawn, Shi hpe A Lu ai Masha hku nna masat shagaru
  dat ya sai rai nga ai.\\nDai hpang, 1658 ning, November shata praw (1) ya shani
  hta, dai aten na Wa Sarabyin Alexander (7) kawn shi hpe San Pra ai Masha dang dat
  let, Shi a Poi Nhtoi hpe mung, September shata (22) ya shani masat shagrau dat ya
  sai rai nga ai.\\nDaini Nawku hpung gaw, Villanova Mare na San Pra ai Saradaw Thomas
  a Poi Nhtoi hpe galaw nga ga ai hte maren, Wa Saradaw Thomas zawn, anhte a myit
  masin hta mung, sumnung shingdi, shagrit shanem ai myit masin bang da nna, jet ai
  Hkristan prat hte sak hkrung hkawmsa nga ga law.\\nBy;\\nSister Rose Angeline Maran
  Nang Doi (SFX)\\nRVA-Kachin Service (Myitkyina)\\nAdd new comment\"", "\"August
