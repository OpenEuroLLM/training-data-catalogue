  Anata 2014\\n16 Achuqa 2013\\nWilltataw Sukhumbhand Paribatranakax chijllat u\u00f1jasiwayapxi
  Bangkok mark apnaka\u00f1ataki, kunati nayrurunakax atipt''ayasipxaniw sasaw sapx\u00e4na,
  ukat janiw ukar phuqhaskiti.\\n13 Lakan phaxsi/llumpaqa 2012\\nUraqpachan khawkha
  chiqankpasaya, qhathux kunayman saminakaniw apasiski. Salvador, Mexico, India, Indonesia
  ukat Tailandia uka markanakan qhathunakapan jamuqanak vidieonak u\u00f1jt''as chikancht''asinipxama.\\n29
  Jallu qallta 2011\\nPhisqa tunk maran Thailand chijinakat jiwatanakax phisqa patak
  jilanakaruw puriwayi. Jil\u00efr irpirinakax jan walt''\u00e4winakat p\u00e4 tunk
  phisqan provincia-w t''aqhisisipkaki sasaw sapx\u00e4na. M\u00e4 waranq jil phamillaw...\\nJilata
  Manzano, yuspajarpun uka aru qillqt''anitamata, kawkha markats qillqt''anta. Jumatak
  m\u00e4 jach''a arunt\u00e4wi\\nYuspaqara,,,jichhax akat aruskip\u00e4w qillaqasinja...aksa
  tuqu markata..\"", "\"Autora: Rosario Aqu\u00edm Traducci\u00f3n al aymara: Calixta
  Choque Churata\\nUka qullu jilstata makati pataru, u\u00f1asiwa \u00fckha lawat
  lurata kurusanaka. Niya 40 tunkata niya 50 tunkakama tumbanaka, qutuki lip\u2019katata
  m\u00e4 laqh\u00e4na; m\u00e4 mallqa niya 600 metros manqhakama. U\u00f1katasipana
  jiqhatasiwa qhana kusiska\u00f1a irananaka chhaqhaski khuri ch\u2019ux\u00f1a azul,
  u\u00f1ta purki ukakama jayp\u2019una, uka jan sutin kurusanakaxa tantiyasiwa kuna
  jan wali laq\u2019unakaru amparanakapasa jist\u2019arata, kuna qhisphiyanaksa maykapxaspa
  ukhama. Ukatxa uka wali u\u00f1t\u2019at thakhinxa \u201cjiwa\u00f1 thakhinxa\u201d,
  jiqhatayki ciudad La Pasampi Coroicumpi, ina ukhamanakakiwa, m\u00e4 amta jan historiani,
  ch\u2019usa sepulturanaka, jan panqaraninaka, jan testigunakani.\\nUka jaqinakaxa
  jiwapxanawa kunarsatixa jiwkatana Cristuxa, inasa kuna amtanichi kunatixa aka thakhixa
  luratatapawa wilampi, jump\u2019impi, jachampi waranqa waranqanakawa Paraguay prisionirunakampi,
  Guerra del Chaco ukakip\u00e4na. Ukatxay pataka pataka jaka\u00f1 wiranaka jaqtatachitpaxa
  warankhanakapana.\\n\u2013 Nayaxa sismawa jan viajamti, kunatixa uka ruxa sagraduchixaya.
  Ukuruxa Jesusaruwa kumpa\u00f1t\u2019a\u00f1a calvariyuparu. Invitayasmawa Villa
  Armoniaru, ukhamata panpaxa sarasnana Se\u00f1or de la Sentencia marcata estacionanakapa.
  Uka Cristo milagro luriri, lurkana escultor Felipe Morales Nieto Sevillan qamiri,
  wi\u00f1ayataki maderat lurata, jan kamachkiri, \u00f1achantata, uka chaqanpuni,
  kunarsatixa m\u00e4 sanedrita jud\u00edo liyt\u2019ana sentenciapa.\\nUkatxa, jumaxa,
  janiwa ist\u2019istati, janipiniwa ist\u2019iriktati kuna iwxsa, churkayatma aka
  awichuxa.\\nAutuxa sartawiyanawa La Pasata, Carmen Pampa tuqiru. M\u00e4 asiruru
  u\u00f1tata thakhiwa sarant\u00e4na qullunak\u00e4ma, saraskanawa sumjata quqa qullu
  taypinakama, mawk\u2019i tanthaptasa, niya Yungas manqharu mantaskasina. Yungasaxa
  u\u00f1t\u2019atawa m\u00e4 ch\u2019arana manqhajama, urpuntata ukhamaraki wali
  jalluni, kawkhantixa junthaptasipxi ch\u2019ux\u00f1a irananaka warankhanakampi,
  ukhamaraki quqa ch\u2019amakhanakampi, kunamatix m\u00e4 jan u\u00f1t\u2019at pintir
  jaqixa lur\u00e4na uka Cordillera Oriental Los Andes tuqita ukatxa past\u2019ayana
  khaysa cuenca de Amazonia tuqiru.\\nThakhixa k\u2019ullk\u2019uptiwa ukataqi, yaqhip
  chaqanakax\u00e4 u\u00f1tasiwa balconcillunakaru wayllunk\u2019iskirinakaru uka
  urpu ch\u2019amakt\u2019atanakana, kawkhantixa phaxchantanaka jawiranaka saraqi
  qullunakata, saraqi chhankt\u2019asa lajatanaka uka thanqha uma amparanakapampi,
  kawkitt\u00ef umapki ch\u2019iyara helechonaka ukhamaraki Orqu\u00eddianaka, u\u00f1stanita
  jaya uraqi manqhita, ukatxa imantasi asxarasisa uka qala manqhinakana.\\nAutuxa
  past\u2019awiyiwa qhuthutt\u2019asisa, qulluru lip\u2019katasa, ukatxa sinti k\u2019ullk\u2019unakakanxa,
  kawkhantixa Yungasan liyipaxa saraski, ch\u2019iqa tuqiruwa sarti aynachat jutkchi
  ukaxa, jichhaxa sarakchi araxata ukaxa wakt\u2019iwa warankha tuqiru. Janiwa khithisa
  mawk\u2019a chhaqtayaskaspati, kunarsatixa sarata m\u00e4 awtjata jach\u2019a lakjama
  laqh\u00e4ru, janira mawk\u2019an puri\u00f1jamawa jan waliru. Ukxarusti janiw ukakikiti,
  uka link\u2019u link\u2019unaka imantasirjamanakawa anati, ukatxa sapa muytana \u201csupaya
  thakhixa\u201d suyiwa jan yatiyasa.\\nAutuxa jiqhatasiwa, janir maratuna jaqha apuratampi;
  jitkatasina sayt\u2019asi warankha laqharu, niyasa ukuruxa janiwa jiwa\u00f1axa
  vacacionankanti. Uka jatupa sartasiri chuferaxa autu jank\u2019akiwa tuqtayi, jan
  munkasina jach\u2019a bus ukaru nukti thiyaru, janir maratun jaqhunti pachpa jan
  wali manqhiru. Muyumpi, muyumpi, muyumpiwa; ukhama sarasinxa, m\u00e4 taykaxa ventanata
  jaqsu wawaparu jiwa\u00f1a yatisina, ch\u2019umi taypiru.\\nAutuxa qurumiskakinawa
  600 metros manqhikama. Janiwa niya maynisa jakkirixa uthanti 50 pasajirunakapata,
  uka jaqtat ch\u2019umi taypiru wawakiwa jakana.\\n\u2013 Nayaxa sistwa jan viajamti,
  uka thakhixa supayankiwa sasina, jani puriyamti jan waliru distunuma. Nayaxa sismawa
  jan saramti, uka uruxa sagraduwa.\\nUka tumbanakaxa ch\u2019usakiwa, uka urpu ch\u2019amakhana,
  uka kurusanakaxa janiwa sutinakanikiti, ajanunakapax\u00e4 tukusxiwa laq\u2019aru.\\n\u2013
  Sarsmawa thaqhiri murgueru, uka cuerpunaka qutuna, ukatxa janiwa ukankayatati \u00a1Janiw
  nayaxa siristi kunatsa ukhama jan uthiti ma suma u\u00f1aqata jiwatanakasaxa! Willtata
  ch\u2019u\u00f1ula pamparu, q\u2019alalunakaki jan kunampi tapt\u2019ata. Janiw
  kunaxapxisa, chuymasana, tumba ch\u2019amakhat sipansa! Ukatxa sartwa thaqhiri wawamaru,
  ukatwa tijta jumakaru, ukatxa janiwa jiqhatti sutima, janiwa ajanuma tantiyxti,
  ukatxa janiwa sisxsmati jikisi\u00f1kama. Ukatxa sapuruwa watjtasta aka ch\u2019amakha
  utana, amayusina uka llakixa phuqhaki akana. Ukata aka luzax\u00e4 nayra ch\u2019amakt\u2019aya\u00f1a
  munitu, ukatxa aka jakirinakax\u00e4 qariyapxitu, phixtupxitu risunakapampi, ukatxa
  janiwa siristi Se\u00f1or de la Senteciati jan ukasti Cristu milagro luriricha,
  qhisphiytma accidentita, ukatxa ukampisktacha gloriapana, jan ukast\u00ef taqi aka
  jiwatanaka velapkitu sapa aruma, amayuxankakich\u00e4, u\u00f1asinipki urunakax\u00e4na,
  jan walt\u2019ayapxiti ch\u2019akhanakaxaru.\\nAnqax\u00e4na wayraxa wayri amuki
  acerakama. Ukatxa ch\u2019iyara olivo urpuxa wasitata purxati awichun qarit nayranakaru,
  ukatxa enfermeraxa chhaxrsi plateado \u00f1ak\u2019utapa, khaya warankhana \u201cjiwa\u00f1a
  thakhina\u201d, uka wasa tumbanakakana, jiliwa ch\u2019iyara orqu\u00eddeanaka,
  ukatxa m\u00e4 qala ch\u2019akhuntatanxa jan asxariri warankharu, sapxiwa jaqixa
  u\u00f1jata Cristo Milagrusuna juch\u2019usa ukhamaraki llakita ajanupa, ukasti
  Se\u00f1or de la Sentencia.\\nCamino a Yungas\\nAutora: Rosario Aqu\u00edm\\nEn
  la cumbre escapada que se eleva hacia la altura, se divisa un pu\u00f1ado de cruces
  de madera. Unas 40 o 50 tumbas api\u00f1adas se aferran sobre el borde de un precipicio;
  una garganta profunda de m\u00e1s de 600 metros. Contra las iluminadas serran\u00edas
  que cabalgan alegres hacia el horizonte verde-azulado de la tarde, las cruces an\u00f3nimas
  semejan fantasmas ansiosos de brazos extendidos que imploran clemencia. Y, a la
  vera del famoso \u201ccamino de la muerte\u201d, que une la ciudad de La Paz con
  el poblado de Coroico, son apenas la evocaci\u00f3n, el s\u00edmbolo sin historia
  de sepulturas vac\u00edas, sin flores y sin testigos.\\nEstas personas murieron,
  el d\u00eda que muri\u00f3 Cristo, quiz\u00e1 tenga alg\u00fan sentido, el hecho
  de que esta ruta, fue construida con sangre, sudor y l\u00e1grimas de miles de prisioneros
  paraguayos, durante la guerra del Chaco. De ah\u00ed, que cientos de vidas se queden
  entre sus riscos.\\n\u2014Yo te dije que no viajes, porque ese d\u00eda es sagrado.
  Ese d\u00eda se acompa\u00f1a a Jes\u00fas en su calvario. Te invit\u00e9 a Villa
  Armon\u00eda, para que juntas, recorri\u00e9ramos las estaciones marcadas del Se\u00f1or
  de la Sentencia. Ese Cristo milagroso que el escultor sevillano Felipe Morales Nieto
  eternizara en madera, indefenso y maniatado, en el momento preciso, en que un sanedrita
  jud\u00edo, le le\u00eda su sentencia. Pero, t\u00fa, no me escuchaste, nunca escuchaste
  el consejo, que te dio esta pobre vieja.\\nEl bus parti\u00f3 de La Paz, con destino
  a Carmen Pampa. Una serpiente de asfalto se desliza entre monta\u00f1as, va descendiendo
  sin prisa entre los cerros boscosos, estrech\u00e1ndose poco a poco, conforme se
  va internando en la espesura del Yungas. Los Yungas, es una regi\u00f3n que se caracteriza,
  por ser una zona h\u00fameda, con niebla y abundante lluvia, donde se mezclan verdes
  laderas, precipicios y una exuberante vegetaci\u00f3n, que como un extra\u00f1o
  pintor, va delineando inconsciente, el paso tan radical de la cordillera oriental
  de los Andes hacia la cuenca amaz\u00f3nica.\\nLa ruta se estrecha tanto, que hay
  lugares tan angostos, que semejan balconcillos columpi\u00e1ndose en el aire, en
  el neblinoso abismo, donde cascadas y r\u00edos, se descuelgan desde el cerro y
  pasan acariciando las grietas, con sus torpes manos de agua, de la que beben sedientos
  helechos y orqu\u00eddeas negras, que nacen desde lo profundo de la tierra, que
  se oculta temerosa entre las piedras.\\nEl bus pasa ronroneando, bien pegadito al
  cerro, y en las partes m\u00e1s angostas, donde rige la ley de los Yungas, se apea
  hacia la izquierda si es que viene subiendo, y si es que viene bajando, le toca
  al borde del acantilado. Ni como se distraiga nadie, porque cuando vas al borde
  de una enorme boca hambrienta, te arriesgas a la fatalidad que trae cualquier descuido.
  Y por si eso fuera poco, las curvas y contra curvas juegan al escondite, y a la
  vuelta de cada codo \u201cel diablo de los caminos\u201d asecha sin previo aviso.\\nEl
  bus, se encuentra de pronto, con otro que lleva prisa; se arrincona, se acomoda,
  sobre el borde del despe\u00f1adero, pero la muerte ese d\u00eda, no estaba de vacaciones.
  El apresurado chofer acelera, y sin querer, empuja al bus de la orilla, y en menos
  de un santiam\u00e9n, lo manda hacia el mismo infierno. Rueda, rueda y rueda; pero
  en su incesante ca\u00edda, una madre desesperada, que sabe que va a morir, rompe
  el vidrio de la ventana, y en un segundo de lucidez, lanza su ni\u00f1o hacia fuera,
  entre el enmara\u00f1ado follaje. El carro sigue cayendo 600 metros al fondo. No
  quedan sobrevivientes, de los 50 viajeros, solo el ni\u00f1o que cay\u00f3, en los
  brazos de la arboleda.\\n\u2014Yo te dije que no viajes, que ese camino es del diablo,
  que no arriesgues tu destino. Yo te dije que no vayas, que ese es un d\u00eda sagrado.\\nLas
  tumbas est\u00e1n vac\u00edas, entre la densa neblina, las cruces no tienen nombres,
  los rostros se han vuelto polvo.\\n\u2014Y fui a buscarte a la morgue, entre una
  monta\u00f1a de cuerpos, pero no estabas all\u00ed. \u00a1Yo no puedo comprender,
  porque tanta desconsideraci\u00f3n con nuestros muertos! Tirados sobre el suelo
  fr\u00edo, desnudos y sin cobijo. Se vuelven nada, m\u00e1s pronto en nuestro coraz\u00f3n,
  que en la oscuridad de la tumba! Y fui a buscar a tu hijo y, corr\u00ed tras de
  tu espectro, pero no encontr\u00e9 tu nombre, no reconoc\u00ed tu rostro, no pude,
  decirte, adi\u00f3s. Y cada d\u00eda despierto, en este cuarto sombr\u00edo, sintiendo
  que la pesadilla, se apropia de la realidad, y esta luz que me enceguece, y estos
  seres que me agobian, me confunden con sus rezos, y no puedo distinguir, si el Se\u00f1or
  de la Sentencia, ese Cristo milagroso, te salv\u00f3 del accidente, si te tiene
  all\u00ed en su glor\u00eda, o si todos estos muertos que me velan cada noche, son
  creaturas de mi mente, que aparecen en mis d\u00edas, atormentando mis huesos.\\nAfuera
  la brisa corre por la silenciosa acera. Y mientras la nube espesa del olvido vuelve
  a caer sobre los ojos cansados de la abuela, y la enfermera le peina su plateada
  cabellera, all\u00e1 en el risco empinado, del \u201ccamino de la muerte\u201d,
  sobre las tumbas desiertas, han crecido orqu\u00eddeas negras y, sobre una piedra
  incrustada que desaf\u00eda el abismo, dice la gente que ha visto, el rostro p\u00e1lido
  y triste de ese Cristo Milagro, el Se\u00f1or de la Sentencia.\"", "\"Organizaci\u00f3n
  de las Naciones Unidas Yatichawitaki, Ciencia ukhamarak Cultura (UNESCO) ukax m\u00e4
  Atla u\u00f1t''ayi 2.500 aru jan walt''a\u00f1ankir apthapi. UNESCO ukakipkarakiw
  jichhurunx 6.000 arsut aru, chikatpachw jutir siglo qalltatakix chhaqtatajaspa:\\nCon
  la desaparici\u00f3n de las lenguas no escritas y no documentadas, la humanidad
  no s\u00f3lo perder\u00eda una gran riqueza cultural, sino tambi\u00e9n conocimientos
  ancestrales contenidos, en particular, en las lenguas ind\u00edgenas.\\nAka arunakax
  jank''a p''arxtaw muni. Walja markanakanx juk''a arst''irinakakiw utxi. Walja arunakaw
  chhaqtirjamaski. Ukhamakipansti aka markanaktx utjarakiw kipka arup yatiya\u00f1
  munir jaqinakaxa. Medios ciudadanos, web 2.0, blogs, Twitter, Facebook ukat medios
  digitales uka tuqinak apnaqasin u\u00f1t''ayapxi, aka jaqinakax markanakan aka arunakar
  juk''at u\u00f1t''ayasipki.\\nAkham amtaIndigenous Tweets and Blogs [Tweets ukat
  Blogs Ind\u00edgenas sat sutinchata; en] indijina aru apnaqirinakaruw u\u00f1t''ayasipki,
  maynimp maynimp u\u00f1t''asisina, ukat kuna luraws lurasipkta sasin jiskt''asisa.
  Ukhamakipansti medios digitales ukat web 2.0 uka apnaqaw tuqiw aka arunakar qhisphiya\u00f1ataki,
  sarantaya\u00f1ataki u\u00f1t''ayasiski. P''iqinchir wayn tawaqunakaxa, (jaqinakarux
  p\u00e4 kasta saraw apthapsna sasin sapxi) l\u00ednea tuqin aka arunakar u\u00f1t''aya\u00f1ataki.\\nAka
  linea aruskipawin chikancht''asinipxam ukhamarak yaqha yatxatat amuyunaks u\u00f1t''ayanipxam
  yaqha amtanakax medios ciudadanos ukatx web.2.0 ukanak apnaqapxi arunakar linea
  tuqin ch''amancha\u00f1ataki!\\n* subrepresentadas arunakax computacion ukhamarak
  machaq medios tuqin juk''a apnaqatak ukaruw u\u00f1anchayi. Akanak tuqitx walja
  jisk''a markanakaw juk''a arup arsurinik jikjatasipxi, ukatx jan walt''awinkapxiwa,
  ukampirus linea tuqiw arunakap jan chhaqahaya\u00f1atak u\u00f1t''ayapxi.\\nAsxara\u00f1jamaw
  ukhamp aynacht''\u00e4winakaxa.\\nChiqpachans wali llakiskay urunakpun uka jila
  kullakanakax pasawayapxi. Janik mayamp ukham utjaspat kawkins ampi!!\"", "\"Munapxitaw
  Daniel Quinteros, Tarapac\u00e1 markanaka wakipresidencial ukanaka, Consejo Regional
  de Seguridad P\u00fablica janiwa u\u00f1t\u2019atatakixaqui. Jiw\u00f1ati\u00f1
  munakasa\u00f1apataki, janiw pachakunaka institucionaxa kisichirinakaraki\u00f1a
  markanaka janiwa, ch\u2019ama\u00f1apxi\u00f1a munaspa, coordinaci\u00f3n, organizaci\u00f3n
  janiwa planificaci\u00f3n markanakaraki jach\u2019a jatunaka seguridad muna\u00f1aspa.\\nQuinteros
  uka jan yatiri jach\u2019a munapxi\u00f1a Consejo janiwa, ukhampixaqui m\u00e4 janiwa
  m\u00e4 qhana\u00f1a markaspa, kullakaspa, markana\u00f1a markanaka, janiwa serviciox
  jach\u2019a m\u00e4 qhana\u00f1a markanakaraki. \u201cJaniwa utjawi ch\u2019amt\u2019anakaxaqui\u00f1a,
  coordinaci\u00f3n, organizaci\u00f3n janiwa planificaci\u00f3n m\u00e4 janiw m\u00e4
  jatunaka trabajo m\u00e4 qhana\u00f1a ch\u2019ama\u00f1apa ch\u2019ama\u00f1apxi\u00f1a,
  munakasa\u00f1apataki\u00f1 munakasa\u00f1apataki\u00f1 \u00f1ak\u2019anaka\u201d,
  janiwa wakipresidencial ukanaka.\\nJatunaka janiwa, munakasa\u00f1apataki\u00f1wa
  janiw ch\u2019ama\u00f1apxi\u00f1a ch\u2019ama\u00f1apa\u00f1aspa, m\u00e4 janiwa
  munapxi\u00f1 m\u00e4 qhana\u00f1a ch\u2019ama\u00f1apxi\u00f1 janiw jatunaka m\u00e4
  qhana\u00f1a. \u201cM\u00e4 qhana\u00f1a\u00f1aspa munapxi\u00f1 jiw\u00e4\u00f1atakiniwa,
  munakasa\u00f1apataki\u00f1 ch\u2019ama\u00f1apxi\u00f1 m\u00e4 qhana\u00f1a wakitakisphapa\u00f1atakixaqui,
  kama jach\u2019aw\u00e4ni, aqharaki uka\u00f1a m\u00e4 qhana\u00f1a kama u\u00f1t\u2019atata
  m\u00e4 janiwa m\u00e4 kullakajja\u00f1a\u00f1atakata\u201d, janiwa Quinteros.\\nJach\u2019a
  kallpanaka, jiw\u00e4\u00f1atakiniwa, markana\u00f1a m\u00e4 qhana\u00f1a, markaspa,
  k\u2019icharaki, ukanaka m\u00e4 qhana\u00f1a ch\u2019ama\u00f1apa ch\u2019ama\u00f1apxi\u00f1ap
  janiwa kama jatunaka markana\u00f1a. Uka quimsa k\u2019ichara, utjawi\u00f1atakiwa
  janiwa, qullqi\u00f1atakiwa janiwa m\u00e4 qhana\u00f1a jach\u2019a qhana\u00f1a
  m\u00e4 qhana\u00f1a, kullakajjatakiwa, jach\u2019a jatunakapatakiwa.\\nQuinteros
  jach\u2019a Consejo Regional de Seguridad P\u00fablica janiwa, marka jatunakaraki\u00f1a,
  uka m\u00e4 janiwa markana\u00f1a, ukhampixa\u00f1atakara m\u00e4 janiwa markaspa,
  ch\u2019ama\u00f1apa m\u00e4 qhana\u00f1a janiwa markanaka jach\u2019a jatunakaraki\u00f1a
  m\u00e4 jach\u2019a kallpanaka.\"", "\"La Paz, 9 Mayo \u2014 Departamento de La
  Paz suyu Pacajes marka Jayuma Llallagua sata tuqinxa nayra maranakatpachawa jayu
  lura\u00f1a yatipxi. Aka tuqinxa umaxa m\u00e4 chiqanxa wali k\u2019arawa ukawjatawa
  jayuxa apsuta.\\nAka tuqina qamasirinakaxa jayu lura\u00f1atakixa nayraqataxa uka
  k\u2019ara uma tanthapipxi ukharuxa, suma janq\u2019uki jayuxa wa\u00f1t\u2019a\u00f1apatakixa,
  k\u2019acha\u00f1atawa uka juri uma k\u2019ilapta\u00f1apkama pachpa umapi jarst\u2019apxi,
