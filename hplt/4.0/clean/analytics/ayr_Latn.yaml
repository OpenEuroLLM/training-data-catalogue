sample: '["\"Latest stories Aka tuqita Human Rights\\n17 February 2012\\nJichh\u00fcrunakax
  Iran-an jan jil\u00efr irpirnakan qhananchataw Internet-amp email-ampix chikatpach
  apaqti. Bloger-unakax anat phaxs tunka pusin ur jan munirinakan unxtas\u00efwinakapatapachaw
  sasaw sapxi.\\n31 January 2012\\n29 January 2012\\nBengasit m\u00e4 libia markankir
  warmix marka masinakaparuw anqajankir chachanakamp jaqichasitapat k''umi. Libiankir
  warminakan derchunakapax janiw chachanakan derechunakapamp kipkakiti sasaw Facebooktuqin
  m\u00e4 carata qilqatan u\u00f1t''ayatayna.\\n19 January 2012\\nMohammad Sadegh
  Honarvar Shojayi, blogger ukatx sacerdote ukjamax phas\u00fcru (lunes)16n urutw
  manq''at mutu\u00f1ar mantatayna. Fiscal General ukaw jist''antatayna sitio web
  reformista Kalameh ukan m\u00e4 jiskt''\u00e4wi luratapat juchanchasa.\\n9 January
  2012\\n30 November 2011\\nM\u00e4 jamuqaxa, m\u00e4 jisk''a imillax yantintawir
  jisk''a sullkitap q''ipiritayna ukwa u\u00f1acht''ayi, ukax u\u00f1t''ayiwa kunjams
  pata tuqinakanx jisk''a lalanakax jaytanukut u\u00f1jasi taqi ukanaka.\\n4 October
  2011\\nCochabamba markanx m\u00e4 vigilia ukaw utjawayi, 25ni uru sata qallta phaxsina,
  TPNIS ukat markachirinakax kayuk jutapki ukanakar yanapt''a\u00f1ataki. Tanatach\u00e4wit
  jamuq waraqt''ata foto-blogger Stephany Eguino del blog Pale Angel jupata.\\n29
  September 2011\\nAkaw Somayeh Tohidloo iran\u00ed blogueran arupaxa, akham phisqa
  tunk jawq\u2019a katuqasax aka Evin wata\u00f1 utana blog uksatuqiruw qillqt\u2019atana:
  Wali k\u2019uchikipxama, kunalaykutix jupanakax jisk\u2019acha\u00f1pun munanxa,
  sawapxama janchixpachaw usutu akham jisk\u2019acht u\u00f1jasitaxatxa.\\\"\\n28
  September 2011\\nBolivia markanx kunayman qutuchawinakaw jiltawayi, ukat yaqhax
  utjiwa wawanaka. Bloguerunaka, ukahamarak yatiyirinakas akxatwa wal arusipxi.\\nJilata
  Elias, walik aka qilqatx jaqukipt''antaxa, jallallt''atatawa,\"", "\"Aka qillqatax
  Relaciones Internacionales ukat Seguridad ukxat qillqt''atawa.\\nJanir willjktipan
  aka machaq mar sarqatarusti, columbiankir pallapallanakax m\u00e4 ch`axwaw phusilanakamp
  khaysa fuerzas armadas (FARC) uka jaqinakar qallantawayapxatayna Kha Chigorod\u00f3
  noroeste colombiana. Aka Ch`axw\u00e4wix qallantawayiw kunawrasatix Elda Ramires
  (sutichata Mayerly sasa) aka warmix farc ukan jiliri p\u2019iqinchiripawa, jupax
  m\u00e4 chacharuw druga alirikaspasa ukjamarus ala\u00f1s uka jaqix munkaspa ukjam
  amuyatayna ukjam amuyasinsti uka chachar jawsatayna. Druga alir jaqisti janiw narkutrafikantikataynati
  kunatix jupax polic\u00eda encubirto ukataynawa, ukat uka ch\u2019axwawix tunka
  pusini guerillas FARC jaqinakaw jiwaqawayapxi.\\nPhusilanakamp Ch\u2019axwawix qalltawayiwa
  kunawrasati colombian jiliri p\u2019iqinchiri tatamp farc ukankir jaqinakamp m\u00e4
  aruskipawinkasipkana ukja. Uka aruskipawisti qalltasiwayanwa maymara p\u00e4 waranqa
  tunka mayan mallki phaxsina. Nayrar suma sarantaya\u00f1atakix, p\u00e4 tunka uru
  saraqatar lapak phaxsit saraqataru FARC jaqinakax qhananchawayapxanwa sayt\u2019aya\u00f1a
  uka ch\u2019axwawi.\\nColombiano irpirin alto el fuego roto satak ukanakax colombianos
  bloguerunakaruw jan wali arxay\u00e4na. Jisnawa mayni bloggerux Colombia markanx
  arst''iwa kunats phisqh\u00efr FARC ukax wali asxarapach\u00e4na:\\nEl frente 5
  de las Farc era una especie de escuela de formaci\u00f3n de terroristas. Desde Efra\u00edn
  Guzm\u00e1n hasta Iv\u00e1n M\u00e1rquez, y desde la hoy desmovilizada \u201cKarina\u201d
  hasta el a\u00fan alzado en armas alias \u201cManteco\u201d [en], han pasado por
  el 5\u00b0 frente de las Farc, una estructura guerrillera vieja y belicosa que la
  madrugada del 31 de diciembre recibi\u00f3 otro golpe por parte de la Fuerza A\u00e9rea
  Colombiana en la \u201cOperaci\u00f3n Fortuna\u201d: un bombardeo que dej\u00f3
  al menos 14 bandoleros muertos y devuelve la esperanza de seguridad necesaria a
  los habitantes de una zona estrat\u00e9gica como es el Eje Bananero, que adem\u00e1s
  linda con el corredor que va desde la Serran\u00eda de Abibe y cruza siguiendo la
  ruta del R\u00edo Sucio hasta el Atrato Medio.\\nP\u2019iqinchir quinto Farc ukanakax
  m\u00e4 terroristanakan yatiqa\u00f1 utapakaspasa ukjamanwa . Efra\u00edn Guzm\u00e1n
  Iv\u00e1n M\u00e1rquez, ukjamarus \u201cKarina\u201d Alias \u201cManteco\u201d [en]
  satat saraqawayxiwa phisqa p\u2019iqinchirinaka FARCaru, jaya pacha tama jan wali
  guerrillanakax aka willjta tunka kimsan janir mar tukuykipan diciembre phaxsin m\u00e4
  jan walt\u2019aw katuqawayapxi kh\u00e4 Fuerza Aerea colombianunakata \u201coperaci\u00f3n
  Fortuna\u201d sata: m\u00e4 bombardeox tunka pusini jan wali jaqinak jaytawayi jiwata,
  ukat m\u00e4 kusisiwi puqut muxsa achu lurir jaqinakar churawayi kunati puqut achuyirin
  urqipanakax jikkatasiwayiwa k\u00e4 serran\u00eda Abibe ukjamarus jaqkattiwa jawira
  Suciot Atrato Mediokama.\\nMaysatxa, Camilo Raigozo aynacht\u2019awayiwa jiliri
  p\u2019iqinchir Santos kusisi\u00f1apa, kha guerrillerunakar jiwayaratampi ukar
  k''umi:\\nEl r\u00e9gimen que encabeza el presidente Santos se ha negado a parar
  la org\u00eda de sangre y muerte que enluta al pueblo colombiano, al no aceptar
  una tregua bilateral del fuego, ni siquiera para navidad y a\u00f1o nuevo. La insaciable
  sed de sangre de quienes detentan el poder lo impide.\\nKh\u00e4 r\u00e9gimen p\u2019iqinchir
  Santos tatax janiw jaysawaykiti kha wila wartawi, ukarusti llakimpi colombianunakar
  apxatawayi. Janiw aka amtawi bilateral ukar iyaw sa\u00f1 munkiti. ni navidadak
  ukjamararus machaq mar katuqa\u00f1atakisa.\\nHoracio Duquex kims\u00efr yatiyawin
  jiskt\u2019asiwa aka unilateralxat ukar Farc ukampita:\\nTal parece, por los datos
  que entregan los expertos [en] que hacen un seguimiento detallado de los combates,
  que en los primeros 30 d\u00edas el \u00e9xito ha sido rotundo. Se pas\u00f3 de
  190 combates y enfrentamientos mensuales a 26, 23 de los cuales tienen su origen
  en los grupos ajenas a los di\u00e1logos de Cuba. (\u2026) Incluso las empresas
  petroleras y las que explotan minerales han reportado un ambiente de mucho menos
  hostilidad.\\nUkax amuyasiwa, yatiyaw jaqkatir yatxatat jaqinakax sitat arkapxi
  aka ch\u2019axwawinakaru ukat ukjamarjamaw aka kimsa tunk urunakax wali aski yatiyawinak
  utjana. Ukjamarus jaqukiptawayiwa m\u00e4 patak llatunk tunka ch\u2019axwawinakaru
  sapa phaxsi kha p\u00e4 tunka suxtanita uka p\u00e4 tunka kimsa tunkata aka sartawinakax
  cubat jutataskaspasa ukjamawa, ukjamarus empresa petrolerunakamp qhuya apsurinakampix
  sapxiwa janiw kuna u\u00f1isiwis aksana utjiti, sasa.\\nFernando Doradox m\u00e4
  conveniencia aka ch\u2019axwawitak qillqawayi:\\nDe mantenerse o alargarse el per\u00edodo
  del cese de fuegos \u2013 m\u00e1s all\u00e1 de la \u00e9poca navide\u00f1a y festiva
  \u2013 la guerrilla de las FARC le estar\u00eda colocando toda la presi\u00f3n al
  gobierno de cara a concertar un cese de fuegos bilateral, lo que le dar\u00eda mayor
  empuje al proceso de Paz.\\nCh\u2019axwaw nayrar sarantatapat aka navidad urunakanxa
  Guerrilla Farc ukankirinakax jilir p\u2019iqinchir tatar wal jiykataspasa ch\u2019axwaw
  sayt\u2019a\u00f1apatak ukar nukt\u2019atakaspasa suma sarnaqa\u00f1atak utjkaspa
  ukjamaw amuyasi.\\nAmuyatjamarux colombia p\u2019iqinchir tatax FARC jaqinakarux
  aynachat\u2019aya\u00f1 munaspa yaqha kast amuyt\u2019awinakampi. Uk lurasinsti
  FARCankirinakax jisk\u2019ar tukuyatapxaspaw jan arskiri. Aka amuyt\u2019awix nayrar
  sarantayataspawa aka p\u00e4 waranqa tunka kimsa marana, suyt''\u00e4wix [eng] (lapaka)
  phaxsin m\u00e4 askich\u00e4wir puri\u00f1atakiwa.\\nKamisaki kullaka Rosmery, walik
  aka qillqatx jaqukpt\u2019antaxa, wali aski yati\u00e4winwa, nayarux wal muspayituna.\"",
  "\"Isturyanaka Aka tuqita Jamaica\\n1 Llamayu 2012\\nGlobal Collaborative ukan video
  waraqat u\u00f1t''ayata: One Day on Earth sutini, D\u00eda de la Tierra (22 uru
  qasawi phaxsit 2012 marana) ukar u\u00f1anchata. Videox jayllintirinakaru,...\\n27
  Llamayu 2011\\nYaqhip sectas religiosas ukanakax uraqix 21ni kurm\u00fcru uruw tukusjani
  sasaw sapx\u00e4na. Bloggers caribe\u00f1os ukanakax uka amuyux kunjams jaqinakar
  lup\u2019iyi jas ukjatwa qilqt\u2019apxi.\\nYo creo que ya deben estar prepar\u00e1ndose
  para el encuentro, que se llevar\u00e1 en Cochabamba-Bolivia,...\"", "\"Isturyanaka
  Aka tuqita Pol\u00edtica Ta anata phaxsi, 2016\\n18 anata phaxsi 2016\\n\u00ab100,000
  filipinuw jiwapxi, Jil\u00efr marka irpirin utanakapax laqayar tukutaw jiqhatasipxi
  ukat Manila markax janiw Perla del Orienten ukhamakxiti.\\n17 anata phaxsi 2016\\nMyanmar
  uksankir granjeros u\u00f1t''atanakaw yaqha markanakar sarxapxi, jupanakax aski
  jakaw jikxata\u00f1atakiw ukham sarxapxi. Akanx walja jamuqanakaw sudeste de Myanmar
  uksat u\u00f1acht''ayata.\\nWali askipuniw uraqpachan ukham may may markanakatpach
  irnqt''a\u00f1axa. Muy interesante trabajar sin importar las fronteras...\"", "\"Pay\u00efri
  ukhamarak kimsiri uru Cumbre de Medios Ciudadanos de Global Voices 2012 ukax qalltawayi
  ukatax kunjamti nay\u00efri urux arumar tukuykan ukhamarakiw tukuyawayxi: jaylliwimpi.
  Qhantati 9 pacharux taqiniw qunu\u00f1anakar qunt\u2019asxapx\u00e4na ukatx Sheru
  ni Sheru, uka jayllintiri tamaw mant\u2019anisin jayllint\u2019apx\u00e4na.\\nUkatax
  uka jayllintaw ist\u2019asax p\u2019artatakipxanwa ukharusti, Cumbre ukan chikancht\u2019asirinakaruw
  (presentes) pani Boukary Konat\u00e9 Mali ukankiriru ukhamarak Victoria Tinta Bolivia
  markankiriruw u\u00f1t\u2019ayapxi, panpachaniw Rising Voices ukat GV ukat beca
  uka atipt\u2019iripx\u00e4na . Jichhapachasti, Boukary-imp ukat yaqhanakampix Proyecto
  Segu Villages Connection ukwa sarantayasipki. Aka proyecto ukax Mali markan provincianakan
  yatiqa\u00f1 ukatax utjki ukanakan red uka apnaq\u00e4w yatichaski ukwa u\u00f1ji.\\nUkhamarusti,
  Victoria Tinta kullakax Bolivia markan jilasiwayatayna, aymara aru arst\u2019asina,
  Jach\u2019a yatiqa\u00f1 utan yatiqkasax internet apanaqa\u00f1wa yatintaxatayna,
  aymara marka, aru jach\u2019anchaya\u00f1ataki. Jichhasti Victoriax Jaqi Aru tamampiwa
  irnaqi, uka tamansti bloguerunakatak yatich\u00e4winakwa sarantayapxi, aymara arst\u2019irinakataki,
  amt\u00e4wipax red ukan aymara aru jach\u2019anchaya\u00f1awa.\\nUkharusti, Cumbre
  ukax kimsa aski quturuw jaljtawayi. Jillian York ukax akham \u201c\u00bfNos est\u00e1n
  vigilando?\u201d p\u2019iqinchaw sutin wakichaw apsuwayi, ukax vigilancia ukatuqitkamak
  mayni maynin amuyunakap u\u00f1stayi, Robert Faris, Centro Berkman de Internet ukat
  Sociedad ukan yatxatir irpirixa, uka qhana apnaq\u00e4win kamachinakapxat arst\u2019i,
  ukatx Afef Abrougui T\u00fanez markat ukat Mohamed El Gohary Egipto markatx yatiyirinakax
  jil\u00efr irpirin vigilancia corporativa ukanakxat u\u00f1t\u2019ayawapxi.\\nUka
  sesi\u00f3n ukanxa, yaqha panelista ukax medios de la salud ukxatwa arst\u2019i,
  yaqha tamasti Kenia marakan medios ciudadanos uka apnaq\u00e4witw aruskipaxi.\\nUkat
  m\u00e4 juk\u2019a samrt\u2019awitxa, Cumbre ukax pay\u00efr sesio ukampiw sarantawayi
  . Gilad Lotam, SocialFlow ukan sullka irpirixa, \u201cVisualizaci\u00f3n de la informaci\u00f3n\u201d
  ukxatawa arst\u2019i.\\nRebecca MacKinnon,GV ukan cofundadoraxa, ukax participaci\u00f3n
  ciudadana en el futuro de Internet, ukxtarakwa aruskipaw wakt\u2019ayi. Ukharusti
  kims\u00efri qutux unidad entre los medios ciudadanos locales ukat el mundo exterior
  ukxat aruskipa\u00f1atakiw wakt\u2019ayaraki.\\nChika uru manq\u2019\u00e4witxa,
  Cumbre ukax p\u00e4 sets ukampiw qallti, walja t\u2019aqanakat aruskip\u00e4winakampi,
  jisnawa China ukat \u00c1frica uka p\u00e4 markxata, warmi, tecnolog\u00eda, ukat
  recursos abiertos ukanakata. Tukuyarusti, Cumbre ukax jayllint\u00e4winakampiw keniana,
  Global Voices ukx amt\u2019awayapxi. Kunawsati Director Ejecutivonakax Ivan Sigal
  ukat Georgia Popplewell ukanakax Cumbre uka jist\u2019ant\u2019awayxapxi ukatx ukan
  chikancht\u2019asirinakax wali kusisitaw jayllint\u2019asin tukt\u2019ayawayxapxi.\\n\u00a1Jut\u00efr
  Cumbre ukanw jikisixapxa\u00f1\u00e4ni!\\nAsxara\u00f1jamaw ukhamp aynacht''\u00e4winakaxa.\\nChiqpachans
  wali llakiskay urunakpun uka jila kullakanakax pasawayapxi. Janik mayamp ukham utjaspat
  kawkins ampi!!\"", "\"\u00c9xodo 34\\nDiosan machak leyi churatapa\\n1Tatitusti
  Moisesarojj s\u00e4nwa:\\n\u2014Waquicham p\u00e4 kala tablanaca nayr\u00efr tablanac\u00e4qui
  uqhama, nayasti ucaruwa kellk\u00e4jja cawqu\u00efr arunactejj nayr\u00efr t''unjcta
  uca tablanacana kellkat\u00e4c\u00e4n uqhama. 2Uqhamarac waquichasim arumanthi wali
  alwata Sina\u00ed kolluru maqhatani\u00f1ataqui. Kollunsti wali alto chekaruwa nayarojj
  u\u00f1stit\u00e4ta. 3Jumampisti janiw qhitisa kollurojj maqhata\u00f1ap\u00e4quiti,
  ni kollunsa qhitisa utja\u00f1ap\u00e4quiti, uqhamarac kollu nayr\u00e4jjanjja janiwa
  ovejanacsa, ni vacanacsa awatipjja\u00f1am\u00e4quiti \u2014sasa.\\n4Ucatsti Moisesajj
  p\u00e4 tablanacwa kalata lur\u00e4na nayr\u00efr tablanacjama. Ucat khep\u00e4rmanthi
  wali alwatasti uca p\u00e4 kalat lurata tablanac apjjaruwayasinwa Sina\u00ed kolluru
  maqhat\u00e4na, cunj\u00e4mtejj Tatitojj sisc\u00e4na uqhamarjama. 5Ucatsti Tatitojj
  kenayanjamwa sarakan\u00efna. Ucat Moisesampi kollun parlasinsti sutipwa arsus\u00efna:
  6Tatitusti Moisesan nayrakatapanjja jach''atwa aqham sas art''as\u00efna:\\n\u2014\u00a1Dios
  Tatitusti, wi\u00f1ay jaquiriwa, uqhamarac qhuyapayasiriraqui. Janiw janc''aqui
  colerasir\u00efquiti, jan ucasti jach''a munasiriwa, uqhamarac chekaraqui! 7Waranka
  wawanacaman wawanacapataquisa pachpa cheka asqui munasiriqu\u00efscaniwa, uqhamarac
  perdonaraquiwa jan wali luratanacsa, jan wali amt\u00e4winacsa, take juchanacsa.
  Ucampis juchanirojj janiw jan mutuyasaqui jaytquiti, jan ucasti awquinacan juchanacapatjja
  mutuyiwa wawanacaparu, allchhinacaparu, allchhinacapan wawanacaparu, uqhamarac allchhinacapan
  allchhinacaparusa.\\n8Ucat Moisesajj m\u00e4quiw quillt''asisa p''eke parapsa orakeru
  alnokasin Tatituru yupaych\u00e4na:\\n9\u2014\u00a1Dios Tata! Nayasti juman qhuyapt''ayasi\u00f1amjja
  jicjjatwa, jichhasti nanacampi chicay saram. Chekpachansa aca jakenacajja juma contra
  tucurinac\u00e4pjjewa, ucampis perdonapjjetay nanacan jan walinac luratanacajjata,
  uqhamarac juchanacajjatsa, jumatacjama tuct''ayasay catokt''asjjapjjeta \u2014sasa.\\nWastat
  suma amt\u00e4wiru mantapjjatapa\\n(Dt 7.1-5)\\n10Tatitusti s\u00e4nwa:\\n\u201cJumanacasti
  ist''apjjam, nayasti m\u00e4 suma amt\u00e4wi lurta take jakenacaman u\u00f1jcata.
  Uqhamarac luraraqu\u00efwa walja muspharca\u00f1anaca, uqhamasti janiwa cawqha orakensa,
  ni cawqha marcansa lurat\u00e4quiti; jumanacasti cawqhanjjay jakenac taypina jicjjatasipjjch\u00efta
