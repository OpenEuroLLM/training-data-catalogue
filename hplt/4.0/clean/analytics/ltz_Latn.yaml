  P\u00e9iteng trenne sech mat 2:2 an d''Etzella Ettelbr\u00e9ck w\u00ebnnt zu Rouspert
  mat 3:0.\"", "\"Fir d\u00e9i sechst a lescht Regatta an European Circuit De Countdown
