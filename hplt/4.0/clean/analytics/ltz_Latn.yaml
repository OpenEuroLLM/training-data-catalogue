sample: '["\"\u00a9 Usch Thommes\\nD''Fola Esch an D\u00e9ifferdeng qualifiz\u00e9iere
  sech fir d''Europa Conference League a Wolz muss no der N\u00e9ierlag g\u00e9int
  Diddeleng am Barrage untrieden.\\nNodeems dem F91 Diddeleng de Championstitel nom
  29. Spilldag, opgrond vun der besserer Goldifferenz, scho bal net m\u00e9i ze huele
  war, hunn se d\u00ebst um leschte Spilldag mat hirer Victoire zu Wolz dann och offiziell
  gemaach. Fir den F91 ass d\u00ebst de 16. Championstitel zanter 2000 an domadder
  si se och fir d''Champions-League-Qualifikatioun qualifiz\u00e9iert.\\nFir Wolz
  dog\u00e9int bedeit d\u00ebs N\u00e9ierlag, datt se am Barrage mussen untrieden
  an domadder nach 1 Extra-Match spille mussen \u00e9ier sech entscheet ob se an der
  BGL Ligue bleiwen oder an d''\u00c9ierepromotioun erof mussen.\\nNieft Wolz muss
  och Hueschtert an de Barragematcher untrieden. Um leschte Spilldag konnte se zwar
