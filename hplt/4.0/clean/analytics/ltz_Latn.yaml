  deemno, datt den OGBL d\u2018Leit oprifft bei den EU-Wahle gutt uecht ze di wiem
  se hir St\u00ebmm zoudroen. D\u2018Wahlempfeelung l\u00e4it d\u00e4itlech bei deene
  Kandidaten d\u00e9i sech fir e m\u00e9i soziaalt Europa engag\u00e9ieren. Dat tr\u00ebfft
  erstaunlecherweis op all d\u2018Parteien zou, d\u00e9i sech zu L\u00ebtzebuerg fir
  d\u2018EU-Wahlen opgestallt hunn, firwat et net vu Muttw\u00ebll gewiescht wier
  d\u2018Kand beim Numm ze nennen\u2026\\nDe Gruef nees zousch\u00ebdden\\nGronds\u00e4tzlech
  awer bleift d\u2018Haaptgesch\u00e4ft vun der Gewerkschaft d\u2018Verdeedegung vun
  de sozialen Errongenschaften an d\u2018Antriede fir d\u2018Rechter vum Salariat.
  Den Andr\u00e9 Roeltgen w\u00e9ist nach emol drop hin, datt zu L\u00ebtzebuerg iwwer
  17% vun der Bev\u00eblkerung dem Aarmutsrisiko ausgesat sinn an d\u2018Erh\u00e9ijung
  vum Mindestloun, esou w\u00e9i zwee \u201enei\u201c Cong\u00e9sdeeg, n\u00ebmmen
  en Ufank k\u00ebnne sinn.\\nWoub\u00e4i de Staat (an do wou d\u00ebsen Haaptaktion\u00e4r
  ass) mat der Erh\u00e9ijung vun Taxen an/oder Tariffer d\u2018Hausse beim Mindestloun
  scho selwer nees agestach huet. D\u00ebs Consideratioun huet den Andr\u00e9 Roeltgen
  net ber\u00e9cksiichtegt, mee dofir nei Revendicatioune fir d\u2018Regierung virgestallt.
  Esou muss d\u2018Aarbechtsrecht dem digitalen Z\u00e4italter ugepasst an d\u2018Sozialvers\u00e9cherung
  gest\u00e4erkt ginn.\\nFoto: \u00a9 OGBL\"", "\"De Verband vun de L\u00ebtzebuerger
  Scouten (LS) an der Resistenz 1940-1945\\nDen 2. September 1939, hunn d\u00e4itsch
  Truppen Polen iwwerfall. Doduerch waren d\u00e9i Alli\u00e9iert, England a Frankr\u00e4ich
  laut Ofkommes mat Polen engag\u00e9iert, D\u00e4itschland de Krich ze erkl\u00e4ren,
  deen no an no zum 2. Weltkrich ausgewuess ass. Doduerch stong eist Land virun enger
  ongew\u00ebsser Zukunft.\\nAn d\u00ebser Perspektiv stong de Chefdag vun de L\u00ebtzebuerger
  Scouten de 16. September 1939 \u00ebnnert dem Motto \u00ab DER HEEMECHT ZE DENGEN\u00bb.
  Den deemolege Commissaire G\u00e9n\u00e9ral Aloyse Hentgen, huet en Appel un d\u2019Bereetschaft
  vun alle Chef a Rover geriicht an ausgeruff \u00ab d\u2019Scoute si mobilis\u00e9iert
  \u00bb. Dorop huet eng grouss Zuel vu Scouten d\u2019Eischth\u00ebllefscours\u00eb
  vum Roude Kr\u00e4itz besicht.\\nAn der Nuecht vum 9. op den 10. Mee 1940, hunn
  dem Hitler seng Arm\u00e9i\u00ebn och eist Land iwwerrannt, an dat trotz offiziellen
  Deklaratiounen deen Dag virdrun, d\u2019Neutralit\u00e9it vu L\u00ebtzebuerg ze
  respekt\u00e9ieren. Vun do u bis d\u2019Joer 1945 gouf eist kleng a friddlecht Land
  \u00ebnnerdr\u00e9ckt an terroris\u00e9iert mat dem Zil, L\u00ebtzebuerg fr\u00e4iw\u00eblleg
  oder gezwongen ze annekt\u00e9ieren. Fir dat m\u00e9i s\u00e9ier ze realis\u00e9ieren,
  gouf eist Land am August 1940 \u00ebnnert d\u2019Zivilverwaltung gestallt mat engem
  Gauleiter un der Sp\u00ebtzt.\\nVun do un, huet d\u2019l\u00ebtzebuerger Vollek
  der Nazityrannei d\u2019Stir gebueden. Hei e Saaz aus dem \u201eSicherheits-Bericht\u201c
  vum 25. Juni 1940, deen an eisem Statsarchiv \u00ebnner AEL-SD/A4/Bl.3 enregistr\u00e9iert
  ass an deem d\u2019Haltung vun den LS den Nazi vis-\u00e0-vis vun Ufank un esou
  festh\u00e4lt: \u201cInnerhalb der Schulen und Internate zeigen sich nach wie vor
  die katholische Pfadfinder als die fanatichsten Gegner deutsch-freundlich gesinnter
  Sch\u00fcler\u201c. Aus der individueller Resistenz ass gl\u00e4ich d\u00e9i organis\u00e9iert
  Resistenz entstan. Sou ass op Initiativ vun den dr\u00e4i Distriktscommissaire vun
  de L\u00ebtzebuerger Scouten , Tony NOESEN (Norden), Georges EVERLING (Zentrum)
  a Jang MULLER (S\u00fcden), de 15. Juli 1940 d\u00e9i \u00e9ischt L\u00ebtzebuerger
  Ls-Resistenzorganisatioun op d\u2019Bee gesat ginn. Kuerz duerno, de 15. August
  1940, kommen iwwer 40 Chef a Rover aus dem S\u00fcddistrikt zu Esch am W\u00ebllefcherssall
  \u00ebnnert der Grenzer Kierch zesummen, wou beschloss gouf, Resisitenz ze leeschten,
  mee d\u2019Bouwen aus dee\u00ebr gef\u00e9ierlecher Saach erauszehalen. Bei d\u00ebser
  Gelee\u00ebnheet hu si hiert Scoutsverspriechen op de l\u00ebtzebuerger F\u00e4ndel
  erneiert. Dat war deen \u00e9ischten Akt, vun der \u00e9ischter Resistenzorganisatioun.\\nDi
  meescht Truppen aus dem LS-Verband sinn esou w\u00e4it dat m\u00e9iglech war, mat
  hiren Aktivit\u00e9iten weidergefuer, bis den 23. August 1940 de \u00ab Stillhaltekommissar
  \u00bb \u00ebnnert aneren och d\u2019Scouten- a Guideverb\u00e4nn verbueden huet.
  Vun do u sinn uechter d\u2019Land aus den LS-Truppen kleng Resistenzgruppen entstan,
  d\u00e9i no an no zu enger gr\u00e9isserer Organisatioun zesummegewues sinn. Kuerz
  duerno sinn och nach aner Resistenzgruppen am Land gegr\u00ebnnd ginn.\\nAus dem
  Verschm\u00eblzen vun e puer patrioteschen Organisatiounen ass d\u2019LVL \u00ab
  L\u00ebtzebuerger Voll\u00e9kslegioun \u00bb am Abr\u00ebl 1941 ervirgaang. D\u2019Strukture
  vun der LVL ware villfach d\u00e9i vum L\u00ebtzebuerger Scoutsverband. Sou waren
  am ieweschte Legiounsrot dr\u00e4i Vertrieder vun den LS an ee Vertieder vun der
  LPL. Eischte President gouf de Georges EVERLING, dee no der Verhaftung vun deenen
  dr\u00e4i LS-Vertrieder , vum Lucien DURY, Scoutschef zu M\u00e4rel als President
  ersat gouf. An d\u00e4er Folleg huet sech d\u2019LVL als d\u00e9i bescht organis\u00e9iert
  Resistenzgrupp erwisen.\\nAn enger anerer Organisatioun, der LPL, huet och ee vun
  eise Commissairen an e puer Chef eng wesentlech Roll gespillt. \u00cbnnert dee\u00ebr
  selwechter Inspiratioun huet de Scoutchef vun D\u00e9iferdang, den Ady Claude, de
  Grupp LFK (L\u00ebtzebuerger Fr\u00e4iheets-K\u00e4mpfer) an d\u2019Liewe geruff.
  D\u00e9i meescht Organisatiounen hu wa noutwenneg zesummegeschafft.\\nDe Scoutissmus
  war fir d\u00e9i jonk M\u00e4nner eng gutt Schoul, well de Gr\u00ebnner a Chef Robert
  BADEN POWELL, si duerch seng Erz\u00e9iungsmethod ganz spezifesch op d\u2019Liewen
  an op hir Afferbereetschaft pr\u00e9par\u00e9iert hat. Esou waren si sech bewosst,
  wat dat gewotent \u00ab Spill \u00bb, op dat si sech agelooss hunn, matt sech br\u00e9nge
  k\u00ebnnt. Well dee klengste Feeler konnt d\u2019Deportatioun an e KZ, d\u2019\u00cbmmsiedlungslager
  mat der Famill, d\u2019Konfisk\u00e9iere vum Verm\u00e9igen, laang\\nPrisongsstrofen
  an esouguer d\u2019Doudestrof mat hire brutalste Vatianten no sech z\u00e9ien. Mir
  waren eis am kloren iwwert d\u2019Brutalit\u00e9it vum Nazigesetz an dach hu bis
  op w\u00e9ineg Ausnahmen ganz vill vun eise Chef, Aum\u00f4nieren a Rover, vill
  Cheftainen an och Scouten sech do wou et drop ukoum, g\u00e9int den Nazitrerror
  gest\u00e4ipt.\\nHei e puer Beispiller, d\u00e9i den Asaz an d\u2019Engagement vun
  den LS-Scouten am Krich illustr\u00e9ieren :\\nFir den 10. Oktober 1941 hat di d\u00e4itsch
  Zivilverwaltung eng \u00ab Personenstandsaufnahme \u00bb virgeholl, d\u00e9i direkt
  vun der Resistenz als verkappte Referendum erkannt gouf. D\u2019L\u00ebtzbuerger
  hunn sech zu 95% fir hir Nationalit\u00e9it ausgedr\u00e9ckt an hunn op de Formul\u00e4r
  dr\u00e4imol \u00ab l\u00ebtzebuergesch \u00bb amplaz \u00ab deutsch \u00bb geschriwwen.
  Fir d\u2019Preisen war dat en Debakel, fir d\u2019Resistenz e groussen Erfolleg,
  un deem d\u2019LS-Scouten e groussen Undeel haten, andeems si bei Dag a bei Nuecht
  dausende vun Trakten heemlech verdeelt hunn. D\u2019Naziverwaltung huet d\u00e9i
  Blamage doutgeschwiegen an dee verkappte Referendum virz\u00e4iteg ofgebrach. Dat
  war deen \u00e9ischte grousse Coup vun der Resistenz.\\nDen 31.8.1942, no der Af\u00e9ierung
  vun der \u00ab Wehrpflicht \u00bb fir D\u2019Joerg\u00e4ng 1920-1924 (sp\u00e9ider
  1925-1927), ass \u00ebnnert dem Impuls vun de Resistenzorganisatiounen e Generalstreik
  ausgel\u00e9ist ginn. Fir d\u00ebsen onerwaarte Voll\u00e9ksopstand vun deem klenge
  L\u00ebtzebuerg ze briechen, hun d\u2019Nazi\u00ebn d\u2019Standrecht ausgeruff,
  an deen Dag duerno gutt Patrioten als ofschreckend Massnahm ex\u00e9kut\u00e9iert,
  dor\u00ebnner och de Scoutchef Nikki KONZ. Fir vill vun eise Chef a Rover war dat
  de Wee an de Prisong, an d\u2019Konzentratiounslageren oder mat hirer Famill an
  Deportatioun, a fir d\u00e9i m\u00e9i jonk an e paramilit\u00e4rescht Stroflager.
  D\u2019Affer vun de Patriote waren net \u00ebmsoss, well fir keng weider Blamage
  ze risk\u00e9ieren, huet de Gauleiter d\u2019Joerg\u00e4ng 1918 an 1919 n\u00ebt
  agezun, w\u00e9i dat scho fir d\u2019Elsass a fir Lothr\u00e9ngen de Fall war.\\nEnn
  1942 an ufanks 1943 hunn e puer an den RAD (Reichsarbeitsdienst) ZWANGSrekrut\u00e9iert
  Jongen aus dem Lager PEENEM\u00dcNDE op der Insel Usedom un der Ostsee, \u00ebnnert
  hinnen den Henri ROTH an och zwee LS-Scouten, de Pir GINTER an de Lucien KOHN, ganz
  heemlech Skizzen an Erkl\u00e4rungen iwwert d\u2019Produktiounsplazen an d\u2019Ofschossrampen
  vun de V1 a V2-Rak\u00e9iten (Vergeltungswaffen) opgezeechent. Den Henri ROTH huet
  s\u00e9ng Skizz u s\u00e4i Papp Leo ROTH vun der LPL gesch\u00e9ckt. Dem Pir GINTER
  s\u00e9ng Opzeechnung gong un den Dr. SCHWACHTGEN vun der LVL an d\u00e9i vum Lucien
  KOHN gong un de Raymond HAGEN och vun der LVL. D\u00ebs dr\u00e4i Messagen sinn
  un d\u00e9i alli\u00e9iert Geheimd\u00e9ngschter viru geleed ginn. Duerch d\u00e9i
  dr\u00e4i Messagen haten d\u00e9i Alli\u00e9iert d\u2019Confirmatioun, datt eng
  aussergew\u00e9inlech a gef\u00e9ierlech Krichswaff a Pr\u00e9paratioun wier. PEENEM\u00dcNDE
  gouf am Juli 1943 schw\u00e9ier bombard\u00e9iert, sou datt d\u2019Entw\u00e9cklung
