  de Kampf g\u00e9int de Klimawandel, n\u00ebmmen eng vun den Erausfuerderungen duerstellt.\\nVer\u00e4nnerunge
  sinn ni einfach\\nAn hie weess dann och wou sech d\u2018Schwaachstelle vun d\u00ebsen
  Erausfuerderungen opdinn. Wann ee wierklech w\u00ebll, datt d\u2018Leit matmaachen,
  also eng Rei Gewunnechten \u201e\u00e4nneren\u201c, muss s\u00e9chergestallt ginn,
  datt och an Zukunft kee M\u00ebnsch op Mobilit\u00e9it muss verzichten an hire Besoin
  un Energie och bezuelbar bleift. Den Andr\u00e9 Roeltgen erwaart sech eng equitabel
  Verdeelung vun de K\u00e4schten\u2026\\nDat kl\u00e9ngt gutt, mee fir \u201ede klenge
  Mann\u201c mat an d\u2018Boot ze huele muss en d\u2018Politik zum \u00e9ischte Schratt
  beweegt kr\u00e9ien. Sollt et nees esou goen, datt Klimawandel an energetesch Transitioun
  um Bockel vum Salariat ausgedroe ginn, da kann een et och direkt si loossen. Um
  frans\u00e9ische Beispill g\u00ebtt demonstr\u00e9iert w\u00e9i d\u2018Vollek mat
  de F\u00e9iss sch\u00e4ert, wann et d\u00ebsem \u201epolitesch\u201c ze bont g\u00ebtt.\\nEinfach
  soe wie gemengt ass\\nAn dat huet den OGBL-President dann och esou betount: \u201eWa
  sech d\u2018Bierger musse mobilis\u00e9ieren, da muss datt och fir d\u2018Politiker
  g\u00ebllen\u201c. Laut dem Andr\u00e9 Roeltgen wier et n\u00e4mlech genee dat,
  wat de Populisten an d\u2018Kaarte spillt: vun de leit Saache verlaangen, d\u00e9i
  ee sech selwer awer net w\u00ebll operlee\u00eb loossen. Consider\u00e9iert een
