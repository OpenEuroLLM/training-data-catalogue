  s.f.\\nriderella, serie di eccessi irrefrenabili di riso\\nL'' AVARO\\n''L PI\u00d3GI\u00c0T\\n\u00b4N
  pi\u00f3gi\u00e0t l\u00e0 vend\u00fcut i s\u1e4d b\u00e9e e la f\u00e0c'' s-ci\u00e0
  ''n gr\u00e0nt gher\u00f9 d''\u00f2r; l\u00e8 ''nd\u00e0c'' s\u00e8nsa d\u00eci
