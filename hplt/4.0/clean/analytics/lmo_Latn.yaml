  "\"Pamela vir a La Plata, na cit\u00e9 cun un n miliun de abitanc a 60 km da Buenos
  Aires, capitala dl''Argentina. Chil\u00f3 \u00e9ra rovada dl 2007, do che ara \u00e2
  studi\u00e9 omeopatia a Minca. L''Argentina \u00e9 n stat olache al v\u00ebgn pratich\u00e9
  y inresc\u00ed d\u00ebr tr\u00f6p s\u00f6n l''omeopatia. Por devent\u00e9 omeopac,
  m\u00ebsson naota f\u00e1 le st\u00fcde de Medejina tradizionala, che d\u00f6ra
  6 agn. Spo \u00f3l ciam\u00f3 ester na spezialisaziun de tr\u00ebi agn, por pod\u00ebi
  cur\u00e9 cun ch\u00ebsta pratica de medejina alternativa. Dl 2013 \u00e1 Pamela
  met\u00fc s\u00f6 so st\u00fcde privat. Ara laora ince tla fondaziun olache ara
  \u00e1 fat la spezialisaziun, la Fundaci\u00f3n homeop\u00e1tica Vitalis, sci\u00f6che
  doturia y da n''ann inc\u00e1 ince sci\u00f6che insegnanta. L''Argentina vir al
  mom\u00ebnt nia situaziun pesocia liada al coronavirus. Danter povert\u00e9 y infeziuns
  \u00e1 le virus gauj\u00e9 de gran danns al''economia y ala soziet\u00e9.\\nI se
  \u00fan met\u00fc en contat cun Pamela y ti \u00fan fat na intervista che i pod\u00ebis
  l\u00ed tla ediziun stampada d''La Usc di Ladins da inc\u00f6, v\u00ebndres ai 7
  de ma. (kp)\\nL''ecuiliber de m\u00ebnt, corp y emoziuns tres l''omeopatia\\nPamela
  Pitscheider, doturia omeopata, vir dal 2007 inc\u00e1 tl''Argentina. Chil\u00f3
  \u00e1ra so st\u00fcde privat te ch\u00ebl che ara cur\u00ebia i pazi\u00ebnc cun
  la medejina alternativa. Ara laora ince tla Fundaci\u00f3n homeop\u00e1tica Vitalis,
  sci\u00f6che doturia y insegnanta. Te ch\u00ebsc mom\u00ebnt particolar l''unse
  contatada por od\u00ebi sci\u00f6che l''America dl S\u00fcd vir la pandemia\"",
  "\"Cuna\\nLa cuna o crovetta l''\u00e8 on leccin indove che se metten i fiolitt
  apena nassuu, fina a quand hinn minga grand assee per dorm\u00ec in d''on lecc normal.\\nI
  cunn gh''hann di spond bei volt, in manera de minga f\u00e0 borl\u00e0 gi\u00f2
  i bambitt intant che hinn dree a dorm\u00ec.\\nEl nomm[Mudifega | mud\u00ecfica
  ''l sorg\u00e8nt]\\nLa parolla cuna la riva direttament del latin cuna, con l''istess
  significaa. L''\u00e8 doperaa in tutt el nord Italia (piemontes cun-a, ligur chinn-a,
  venet cuna, forlan cune), in romanc grisgion (tgina, e ch\u00fcna sia in Puter che
  Vallader, parnnonziaa \u00e7\u00fcna assee simel la parnonzia lombarda [''kyna])
  e spagnoeu (cuna).\\nIn Italian se dopera el termen culla, derivaa del latin tard
  cun\u016dla (cio\u00e8 cuna piscinina)[1], che l''\u00e8 compagn del napoletan c\u00f2nnula.
  Ona forma de transizion in tra el termen toscan e quell gall-italegh l''\u00e8 ''l
  romagnoeu c\u00f3nla o c\u00f3ndla.\\nEl termen crovetta (e i s\u00f2 variant crovett,
  crevett, grevett, crovetta, grevetta, grovetta, crevetta[2][3]) l''\u00e8 spantegaa
  in del Canton Tesin, in de l''Ossola e in Val Vedasca. Se sa minga ben de ind\u00e8
  che ''l vegnaria el termen.\\nDe ''sti nomm deriven i verb cun\u00e0 e crovett\u00e0.\\nReferiment[Mudifega
  | mud\u00ecfica ''l sorg\u00e8nt]\\n- garzantilinguistica.it\\n- NavigAIS, carta
  numer 61.\\n- Vocabolario dei dialetti della Svizzera Italiana, volumm 84, pag.
  200.\"", "\"Program partides/programma partite/Spielplan Wengen by night\\nA chisc
  link chil\u00f2 dessot pon ciaf\u00e8 le cal\u00ebnder dles partides cun i gironi
  y le regolam\u00ebnt dl Torneo de N\u00f6t 2014, che gnar\u00e0 tign\u00ec in ch\u00ebsta
  sabeda ai 12/07/2014. A to p\u00eart in ch\u00ebsc ann \u00e9le 16 scuadres, cun
  les pr\u00fcmes partides che m\u00ebt man dales 18:00. Al v\u00ebgn daid\u00e9 record\u00e8
  de consegn\u00e9 la lista di sogadus dan la pr\u00f6ma partida de vigni scuadra.\\nLa
  festa metar\u00e0 bel man dales 17:00 cun Dj Elf che punsar\u00e0 a sciald\u00e8
  it le publich cun s\u00f6a m\u00fcjiga.\\nDales 22:00 v\u00ebgnel lasc\u00e8 od\u00ebi
  la partida por le 3\u02da y 4\u02da post danter Brasil y Olanda tl \\\"Bar Sport\\\".\\nAl
  \u00e9 preod\u00fc bel t\u00ebmp in sabeda y an spera che la plaza dal sport v\u00ebgnes
  iluminada in gran p\u00eart dala l\u00fcna colma!\\nL''U.S. La Val tol l''ocajiun
  por ringrazi\u00e9 bel danfora i sponsor por le ai\u00fct finanziar: L''Murin, Raiffeisen,
  Se.ve. Srl\\n---> programma partite/Spielplan\\n---> regolamento\"", "\"La Lucrezzia
  Borsgia (catalan: Lucr\u00e8cia Borja; Subiaco, 18 de avril del 1480 \u2013 Ferrara,
  24 de sgiugn del 1519) l''\u00e8 stada una nobela taliana de orisgen catalana. L\u2019era
  la terza fi\u0153ula inlesgitema del papa Lissander VI e de la s\u00f2 sgimaca Vanozza
  de\u2019 Cattanei. L\u2019\u00e8 retegnuda vuna di figure pussee contraverse del
  Renassiment talian.\\nPer mejor\u00e0 la s\u00f2 posizzion sozzial, la fameja de
  la Lucrezzia la gh\u2019ha rangiad devers mariozz per f\u00e0lla vegn\u00ec una
  sciora: in prenzipi l\u2019ha maridad el Sgiovann Sforza \u2013 scior de Pesaro
  e cont de Codegn\u0153ula \u2013 p\u0153u l\u2019ha tolt in marid el Fons d\u2019Aragona
  \u2013 duca de Bisceglie e prenzep de Salerno \u2013 e a la fenitiva l\u2019\u00e8
  vegnuda la mojer del Fons I d\u2019Est, duca de Ferrara. El prim mariozz l\u2019\u00e8
  stait trait a null, el segond l\u2019\u00e8 fenid ind el mazzament del s\u00f2 hom
  orchestrad del Zeser Borsgia[1] \u2013 fradell s\u00f2 de la Lucrezzia \u2013 e
  l\u2019ultem l\u2019\u00e8 stait un\u2019union de suzzess, ancaben che el terz marid
  la sprezzass a l\u2019inizzi e el fudess fanciss a marid\u00e0lla.[2] Impunemanch,
  l\u2019\u00e8 staita bona de f\u00e0gh desmenteg\u00e0 la s\u00f2 storia personal
  e i s\u00f2 mariozz fallad a la cort ferraresa, che, cont el temp, hann tacad vol\u00e9gh
  ben e a stim\u00e0lla per la s\u00f2 bellezza e i qualitaa che l\u2019insubiva.
  De facc, l\u2019era sperta fiss in politega e diplomazzia, insc\u00ec tanta che
  el marid el ghe fidava la ministrazzion del ducad quand ch\u2019el gh\u2019era minga.
  L\u2019\u00e8 staita p\u0153u anca una granda patrona de artista: l\u2019ha rezzevud
  a cort di poeta e umanista important, compagn del Lodovigh Ariost e del Peder Bemb.
  Ind la darera part de la s\u00f2 vida l\u2019\u00e8 vegnuda un cicinin una basa-balaustre
  e l\u2019ha tacad infinamai a socorrer i povarit.[1] L\u2019\u00e8 morta a trentan\u0153uv
  agn quand che l\u2019era in paj\u0153ula.\\nLa s\u00f2 figura l\u2019\u00e8 tencia
  de deverse nuanz ind el cors di moment storegh indova che la ven analizada. Ind
  el \u2019800, per esempi, C\u00e0 Borsgia l\u2019era retegnuda el simbol de la corruzzion
  sessual e di politeghe senza pietaa perpetrade di papa renassimentai. De sora maross,
  una sabetada de l\u2019epoca menada a voltra de la fameja del prim marid la smaggiava
  la s\u00f2 reputazzion con la cusazzion de inzest cont el fradell Zeser, a la qual
  gh''era sgiontada la fama de invelenidora portada de la tragedia tejatral Lucr\u00e8ce
  Borgia del Victor Hugo.[2] In quella manera ch\u00ec, la Lucrezzia l\u2019\u00e8
  staita sozziada a la figura de la femme fatale, o ben de una fomna senza vertuu
  che la toveva part ai crimen comiss de la s\u00f2 fameja.[3][4] Tamen, la storiografia
  suzzessiva l\u2019ha scurtad i dimension de quist aspet, cont el d\u00ec ch\u2019eren
  provabilment di brut sabetament nassud per n\u0153usegh a la s\u00f2 reputazzion
  per di reson politeghe.[3]\\n- Sarah Bradford, Lucrezia Borgia. La storia vera,
  Milano, Mondadori, 2005.\\n- Ivan Cloulas, I Borgia, Roma, Salerno Editrice, 1989.\\n-
  Roberto Gervaso, I Borgia, Milano, Rizzoli, 1977.\\n- Marion Hermann R\u00f6ttgen,
  I Borgia nella letteratura europea in Carla Alfano (a cura di), I Borgia: l''arte
  del potere, Roma, Regione Lazio-Presidenza della Giunta, 2002.\\n- Wikiquote el
  gh''ha dent citazzion de o su Lucrezzia Borsgia\\n- el gh''ha dent imagin o alter
  archivi su\"", "\"Tempesta\\nLa tempesta o tompesta o gragnoeula l''\u00e8 ona percipitazion
  atmosferega fada su de tancc tocchelitt de giazz a forma de sfera o trapeziodai,
  che vegnen gi\u00f2 di nigoi ciamaa cumulonemb.\\nLa p\u00f2 port\u00e0 di dagn
  bei grav ai camp e ai terren in general.\\nFormazion[Mudifega | mud\u00ecfica ''l
  sorg\u00e8nt]\\nLa tempesta la se forma se i corent ascensionai in d''on cumulonemb
  hinn fort assee; in quell cas ch\u00ec el suced che on primm nucli de giazz el vegna
  trasportaa su e gi\u00f2 in de la nigola, indove el se delegua cont alter rosc de
  giazz piscinitt e coi gott d''aqua, per poeu giazz\u00e0ss anm\u00f2 e vegn\u00ec
  semper pussee granda. Quand che i corent hinn pu bonn de lev\u00e0 su e tegn\u00ec
  i tocch de giazz (perch\u00e8 hinn devegnuu tropp grev), quei ch\u00ec croden gi\u00f2
  in terra; i rosc de partesei giazzaa che hinn minga bon de delegu\u00e0ss prima
  de vess rivaa gi\u00f2 in terra causen despess on mucc de dagn sia in di camp che
  in di center urban.\\nL''\u00e8 pussee probabel che la vegna gi\u00f2 d''estaa,
  anca se l''\u00e8 fada de giazz, gi\u00e0 che l''\u00e8 ona conseguenza de la caldura.\\nI
  grann de tempesta che borlen gi\u00f2 a temperadur alt hinn trasparent, perch\u00e8
  hinn senza i boll d''aria; quei che borla gi\u00f2 a temperadur pussee bass hinn
  bianch perch\u00e8, inscambi, ghe n''hann tant.\\nPrima e dopo che l''ha tempestaa,
  la temperadura la se sbassa in pressa (anca de des grad in mezora), perch\u00e8
  ''l giazz soled, per devegn\u00ec aqua, el ghe toeu via del calor a l''ambient,
  e in ''sta manera poeuden vessegh anca di grand aqueri.\\nEl nomm[Mudifega | mud\u00ecfica
  ''l sorg\u00e8nt]\\nEl nomm tempesta l''\u00e8 doperaa in quasi tutt el nord Italia
  e in romancc, foeura che de la Liguria (gragneua) e ona quai zona isolada. La variant
  tompesta l''\u00e8 tipega de la Provincia de Bressa, del Trentin e del Venet ocidental[1].\\nLa
  parolla gragnoeula inveci l''\u00e8 spantegada de ch\u00ec e de l\u00e0 in gir per
  la Lombardia e ''l rest del nord Italia, e la vegn del latin parlaa *grande\u014fla,
  deminutiv de grando, grandinis, e ''l va confrontaa con l''italian \\\"gragnola\\\"[2].
  El latin grando l''\u00e8 anca a la bas de la parolla italiana \\\"grandine\\\".\"",
