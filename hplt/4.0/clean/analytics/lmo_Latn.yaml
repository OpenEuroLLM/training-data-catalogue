  l\u00e8 torn\u00e1at a control\u00e0a, l\u00e0 id\u00fcut la t\u00e9ra mui\u00fcda
  e l''\u00f2r ''l gh''era ca p\u01dc; il\u00f9ra l\u00e0 cuminciat a \u00f3\u015b\u00e0a
  e a strep\u00e0s i cav\u00e9i.\\n\u00b4N galant\u00f3m ca''l pas\u00e0va par c\u00e0as
  de il\u00f3, l\u00e0 domand\u00e0at \u00b4l mut\u00ecf e p\u00f2\u00b4l lgh\u00e0
  d\u00ecc'':\\n\\\" Lament\u00e8t ca, f\u00e0a ca de ti \u00b4n \u00f3m ''ns\u00fcr\u00ect.
  M\u00e8t al s\u00f2 p\u00f2st ''n s\u00e0s e f\u00e0 c\u01dcnt de v\u00eci s\u00f3tr\u00e1at
  l''\u00f2r ca te ghar\u00e9e ''l st\u00e8\u015b tornac\u00fcnt.\\\"\\nM\u00f3r\u00e0l
  dela f\u00e0ola: A ch\u00e8 ''l serv\u00ecs \u00e8s sci\u00f3r, con t\u00e1ac''
  s\u00f2ldi, se p\u00f2 se ca b\u00f9u de \u00fcs\u00e0i ?\\n''Na \u00f2lta al s\u2019era
  r\u00f3t la campana de la g\u00e8sa de Cai\u00f6l e sic\u00f3me ai gheva ca i soldi
  par gi\u00fcstala ai seva ca come f\u00e0a. A \u2018n certo punto ''n caiol\u00e0t
  l\u2019a f\u00e0c\u2019 sta proposta:\\nM\u00e8 la liga co''na str\u00f2pa de b\u00e8dula
  e me la \u00f2lta col r\u00f3t en d\u00e8nt v\u00e8rs Valbusagia, l\u2019\u00e8
  miga necesari ca i busac\u2019 ai s\u00e8nt li n\u00f3si campani\u2026\\\"\"", "\"Anticiclon\\nI
  anticicl\u00f3n hinn di strutt\u00f9r che la soa pression atmosferega l\u2019\u00e8
  tal che i curv isobar (cio\u00e8 i curv a l\u2019ist\u00e8ssa pressi\u00f3n atmosferega)
  o i isoipsi (curv a l\u2019ist\u00e8ss geopotenzial), ch\u2019a hinn ci\u00f9s e
  concentrich, gh\u2019h\u00e0nn di val\u00f3r che vann su manem\u00e0n che de la
  periferia se va v\u00e8rs el dedenter indoe la pression la raggi\u00f2ng el so valor
  m\u00e0ssim. [1]\\nClassificazion[Modifega | mud\u00ecfica ''l sorg\u00e8nt]\\nI
  anticiclon hinn classific\u00e0a segond la s\u00f2 posizion in:\\n- Anticiclon permanent
  (o sub-tropicaj): hinn qu\u00e8j che se originen de la circolazion general de l''atmosfera
  intorna di 30-40\u00b0 de latitudin; [1]\\n- Anticiclon m\u00f2bil (o de saradura):
  hinn piazz\u00e0a infra i ciclon m\u00f2bil; [1]\\n- Anticiclon orografich: hinn
  qu\u00e8j che se ingeneren sora-vent risp\u00e8tt a \u2018na cad\u00e8na montagnosa
  in presenza de vent trasversaj a la barriera orografica. [1]\\nI anticicl\u00f3n
  hinn anca classific\u00e0a in anticiclon cald e anticiclon fr\u00e8cc a segonda
  che gh''ab\u00ecen denter aria puss\u00e9e calda o puss\u00e9e fr\u00e8ccia de qu\u00e8lla
  che la gh''\u00e8 intorna.\\nAnticiclon fr\u00e8gg e cald[Modifega | mud\u00ecfica
  ''l sorg\u00e8nt]\\nIn del center di anticicl\u00f3n (ma anca di ciclon) a gh\u2019\u00e8
  semper compresa de l\u2019aria puss\u00e8e calda opp\u00f9r puss\u00e9e fr\u00e8ggia
  de qu\u00e8lla che la gh\u2019\u00e8 intorna. Al fin che l\u2019anticlon el tenda
  a riforz\u00e0ss a l\u2019\u00e8 important che l\u2019aria calda la sia presenta
  a tutt i qu\u00f2t (anticiclon cald). Se gh\u2019h\u00e0nn denter l\u2019aria puss\u00e9e
  calda a tutt a qu\u00f2t, tenden a rinforz\u00e0ss perch\u00e9 ind l\u2019aria calda
  la pression la tend a sbass\u00e0ss men in pr\u00e8ssa con la qu\u00f2ta che in
  qu\u00e8lla fr\u00e8ggia (segond la formola ipsometrica). Se inscambi l\u2019aria
  fr\u00e8ggia l\u2019\u00e8 presenta al soeul (anticiclon t\u00e8rmich) alora i struttur
  anticicl\u00f2nic vegnen puss\u00e9e debol a \u2018nd\u00e0 su con la qu\u00f2ta.\\nAnticiclon
  fr\u00e8gg o anticiclon t\u00e8rmich[Modifega | mud\u00ecfica ''l sorg\u00e8nt]\\nI
  anticiclon fr\u00e8gg se ingeneren semper quand che \u2018l c\u00e0pita on raffreddament
  di strat de aria arent al soeul (a hinn donca ciam\u00e0a anticiclon t\u00e8rmich).
  In qu\u00e8ll caso ch\u00ec l\u2019aria puss\u00e9e fr\u00e8ccia l\u2019\u00e8 presenta
  dom\u00e0a al soeul e de conseguenza l\u2019anticiclon el ven puss\u00e9e debol
  a \u2018nd\u00e0 su in qu\u00f2ta indoe la circolazion la diventa cicl\u00f2nica.
  On esempi important de qu\u00e8ll tipo de anticiclon ch\u00ec a l\u2019\u00e8 qu\u00e8ll
  che \u2018l gh''\u00e8 sora i p\u00f2li e poeu in qu\u00f2ta (sora i 3000-4000 meter)
  el se trasforma in del v\u00f2rtes polar. Minga dom\u00e0 cheesch\u00ec, ma generalment,
  tucc i anticiclon che se foeurmen sora i regi\u00f3n fr\u00e8cc hinn de qu\u00e8ll
  tipo ch\u00ec (per esempi l\u2019Anticiclon russo e l\u2019Anticilon euro-asiatich
  e gh\u2019h\u00e0nn sora ona c\u00e8rta qu\u00f2ta di center de bassa pression.
  Di anticiclon fr\u00e8gg se foeurmen anca a scala loc\u00e0l, per esempi qu\u00e8j
  che se formen de n\u00f2tt in su la t\u00e8rraferma quand che la ven puss\u00e9e
  freggia risp\u00e8tt al mar, o al contrari in di or d\u00ecurni in sul mar e hinn
  responsabil di Bris de mar e de de t\u00e8rra. [2]\\nAnticiclon cald o anticiclon
  dinamich[Modifega | mud\u00ecfica ''l sorg\u00e8nt]\\nAi anticiclon cald ghe partegnen
  sia on quaj anticiclon permanent che ''l se forma sora i z\u00f2n indoe la superfice
  terr\u00e8ster a l\u2019\u00e8 puss\u00e9e calda (30-40\u00b0 de Latitudin), \u2018me
  per esempi l\u2019Anticiclon di Azzorre o l\u2019Anticiclon del Pacifich, sia tucc
  i anticiclon m\u00f2bil, ch\u2019a hinn qu\u00e8j che saren su \u2018na fam\u00e9ja
  de front. [3] Intorna di anticiclon din\u00e0mich se ingeneren de la vorticit\u00e0
  di corrent discendent.[4]\\nRiferiment[Modifega | mud\u00ecfica ''l sorg\u00e8nt]\\n-
  Mario Giuliacci (2010). Manuale di meteorologia (in italian). Alpha Test, 210-212.
  ISBN 88-483-1168-7.\\n- Mario Giuliacci (2010). Manuale di meteorologia (in italian).
  Alpha Test, 216. ISBN 88-483-1168-7.\\n- Mario Giuliacci (2010). Manuale di meteorologia
  (in italian). Alpha Test, 217. ISBN 88-483-1168-7.\\n- Mario Giuliacci (2010). Manuale
  di meteorologia (in italian). Alpha Test, 344. ISBN 88-483-1168-7.\"", "\"A La Ila
  tl gran salf dla Ciasa dla Cultura \u00e9l gn\u00fc met\u00fc a j\u00ec la pr\u00f6ma
  rapresentaziun dl teater dal titul \u201cI cin moschetiers ladins a la inrescida
  dl ladin perfet\u201d. Le toch de teater, scrit y men\u00e8 ite da Simon Kostner
  y Daria Valentin por le concurs scrit fora dala Uniun Ladins dla Val Badia dl 2002
  por cunt dla Union Generela \u00e0 do da depl\u00fc agn pod\u00fc gn\u00ec port\u00e8
  dant s\u00f6n palch.\\nAl \u00e9 dessig\u00fc st\u00e8 \u00f6na dles manifestaziuns
  pl\u00fc rapresentatives danter la linia de manifestaziuns ch\u2019\u00e9 gn\u00fcdes
  met\u00fcdes a j\u00ec por i 100 agn dala fondaziun dla \u201cUnion Ladina\u201d
  dl 1905 a Desproch.\\nLe teater \u00e9 gn\u00fc insign\u00e9 ite cun gran sav\u00ebi
  y pazi\u00ebnza da Simon Kostner y Irene Zingerle y cun l\u2019ai\u00fct de Hilda
  Pizzinini. La dificolt\u00e9 n\u2019\u00e9 dessig\u00fc gnanca stada picera por
  i aturs che gn\u00f4 da d\u00f6tes les 5 valades ladines por pod\u00ebi rapresent\u00e8
  le toch che tol en conscideraziun d\u00fcc i 5 idioms ladins dl Sela.\\nLe spetacul
  teatral \u00e0 or\u00fc rapresent\u00e8 la situaziun tles valades ladines dles Dolomites
  dl 2046.\\nI personaji prinzipai \u00e0 significativam\u00ebnter inom \u201cBadia\u201d,
  \u201cGherd\u00ebna\u201d, \u201cFascia\u201d, \u201cFodom\u201d y \u201cAmp\u00ebz\u201d
  y pro d\u2019\u00ebi \u00e9l ince s\u00fces f\u00f3menes. D\u00fcc deboriada \u00f4i
  porv\u00e8 de ciaf\u00e8 na soluziun ai problems dla mendranza ladina por porv\u00e8,
  magari, d\u2019arjunje ch\u00ebra unit\u00e9 aministrativa, mo ince danter les porsones,
  che indebl\u00ebsc tres depl\u00fc i ladins. I \u00f3mi dla politica n\u2019\u00e9
  nia por na unit\u00e9 ladina, gnanca canch\u2019 ara se trata de na unit\u00e9 culturala
  y les porsones sc\u00ebmples azeta dagnora pl\u00fctosc passivam\u00ebnter ci che
  v\u00ebgn fat fora pl\u00fc alalt.\\nAi protagonisc dl teater ti t\u00f3mel ite
  de j\u00ec s\u00f6n la piza dl Sela a daman\u00e8 do n cons\u00ebi al gran \u201cRet\u201d.
  Mo le gran \u201cRet\u201d n\u2019\u00e9 tla finada nia ater co na porsona sci\u00f6che
  tantes che sa indere da ti aconsi\u00e9 che la mi\u00f9 soluziun por tign\u00ec
  ad\u00f6m la mendranza \u00e9 che d\u00fcc s\u00fc compon\u00ebnc t\u00ebgnes ad\u00f6m
  y tires la corda dl med\u00e9mo vers.\\nLa dom\u00ebnia ai 25 de set\u00ebmber s\u2019\u00e0
  Giovanni Misch\u00ec y la Uniun di Ladins dla Val Badia cruzi\u00e9 de m\u00ebte
  a j\u00ec a San Martin (tl Istitut Ladin \u201cMicur\u00e0 de R\u00fc\u201d) l\u2019incuntada
  anuala di cronisc de Tirol (\u201cTiroler Chronistentreffen\u201d), olache al \u00e9
  rov\u00e9 adalerch 25 cronisc de S\u00fcd- y Nordtirol, le diretur dl Archif Provinzial
  dr. N\u00f6ssing y s\u00fca colaborad\u00ebssa Margot Pizzini che s\u2019\u00e0
  cruzi\u00e9 de ti men\u00e8 fora l\u2019invit y le program ai cronisc. S\u00f6n
  le program dl danmisd\u00e9 \u00eal preod\u00fc depl\u00fc interv\u00ebnc: le dr.
  N\u00f6ssing \u00e0 spligh\u00e9 l\u2019organisaziun y le funzionam\u00ebnt dl Archif
  Provinzial y d\u00e8 stlarim\u00ebnc sura le sost\u00ebgn che ti v\u00ebgn pit\u00e9
  ai cronisc de d\u00f6t Tirol. Lapr\u00f2 \u00e0l ince spligh\u00e9 y record\u00e8
  ci che \u00e9 important y ci che alda pro le la\u00fbr da cronist. Le dr. Hugo Valentin,
  presid\u00ebnt dl Istitut Ladin \u201cMicur\u00e0 de R\u00fc\u201d \u00e0 port\u00e8
  dant depl\u00fc informaziuns y chestiuns che reverda i Ladins dles Dolomites y \u00e0
  bai\u00e9 dl\u2019ativit\u00e9 dl Istitut Ladin. Hilda Pizzinini, presid\u00ebnta
  onorara dla Generela, \u00e0 spligh\u00e9 l\u2019imp\u00ebgn de ch\u00ebsta Uniun
  y dles seziuns de valada por mantign\u00ec l\u2019unit\u00e9 culturala y linguistica
  danter les valades ladines storiches. Werner Pescosta \u00e0 te so interv\u00ebnt
  fat n ressum\u00e9 di svilups storics y port\u00e8 dant i deboj\u00ebgns d\u2019al
  d\u00e9dainc\u00f6 dla mendranza ladina, por che ara pois mantign\u00ec sides l\u2019unit\u00e9
  culturala, mo ince d\u00f6ta la variet\u00e9 che desfarenzi\u00ebia imp\u00f2 ciam\u00f2
  vigni valada ladina dales atres. La dr. Ulrike Vittur \u00e0 spo port\u00e8 dant
  n ressum\u00e9 dl svilup dla cronica y dl\u2019ativit\u00e9 di cronisc tles valades
  ladines. Ara \u00e0 port\u00e8 dant contegn\u00fcs y carateristiches dl \u201cSas
  dla Crusc\u201d y dl \u201cCal\u00ebnder de Gherd\u00ebina\u201d che reporta oramai
  por tradiziun informaziuns sura i avenim\u00ebnc dl ann da denant, sozed\u00fcs
  tla Val Badia y te Gherd\u00ebna. La discusciun \u00e9 gn\u00fcda portada inant
  pro mar\u00ebna s\u00f6n le L\u00fcch de Vanc. Domisd\u00e9 \u00e9 la manifestaziun
  j\u00fcda inant cun la vijita al Museum Ladin a San Martin.\\n25 de set\u00ebmber
  2005\\nPor la sabeda y dom\u00ebnia (17 y 18 de set\u00ebmber) organis\u00ebia la
  Uniun Ladins Val Badia deboriada cun l\u2019Uniun Bal Popolar dui dis de festa da
  bal por i 20 agn dala fondaziun dl\u2019Uniun Bal Popolar dla Val Badia. Dl 1985
  \u00e2 la Uniun di Ladins d\u00e8 dantad\u00f6t n contribut finanziar y organisatif
  por daid\u00e9 m\u00ebt s\u00f6 l\u2019Uniun Bal Popolar, cossa che \u00e9 gn\u00fcda
  realisada dilan al interessam\u00ebnt en pr\u00f6ma porsona de Adalbert Piccolruaz
  de Badia y de Bruno Pizzinini da La Ila. Ded\u00f4 \u00e9 l\u2019Uniun da bal j\u00fcda
  inant do so tru y do 20 agn r\u00f6ia les d\u00f6es uniuns ind\u00f4 ad\u00f6m por
  organis\u00e9 deboriada ch\u00ebsta manifestaziun.\\nLa sabeda s\u00ebra (dales
  20.00) gnar\u00e0 inaugurada da n grup dal Friul \u2013 pl\u00fc avisa dai \u201cDanzerini
  Udinesi\u201d - y ded\u00f4 gnar\u00e0l present\u00e8 le liber \u201cL\u2019Uniun
  Bal Popolar compl\u00ebsc 20 agn\u201d y mostr\u00e8 zacotan de fotografies fora
  dl album dla Uniun. Do n bal che gnar\u00e0 port\u00e8 dant dal\u2019Uniun Bal Popolar
  sar\u00e0l n bal davert a d\u00fcc.\\nLa dom\u00ebnia gnar\u00e0l dit la m\u00ebssa
  tla dlijia da San Linert dales 10.30 (sce al \u00e9 bel t\u00ebmp sar\u00e0l na\u00f3ta
  na sfilada di grups da bal ca por San Linert \u2013 dales 10.15 y spo m\u00ebssa
  s\u00f6n paiun dla Ciasa Runcher). Ded\u00f4 sar\u00e0l les autorit\u00eas che porta
  so sal\u00fct, mar\u00ebna y esibiziun di grups da bal dles valades ladines y dl
  Friul cun la musiga di \u201cJobleri d\u2019 La Pli\u201d. D\u00fcc \u00e9 d\u00ebr
  bel invi\u00e0 da gn\u00ec!\\n17 de set\u00ebmber 2005\\nLa sabeda y dom\u00ebnia
  di 13 y 14 d\u2019agost \u00e9 n valg\u00fcgn m\u00ebmbri dl Cons\u00ebi dla Uniun
  di Ladins dla Val Badia j\u00fcs a Bregenz a ti ciar\u00e8 ala rapresentaziun dl
  \u201cTrobadour\u201d de Giuseppe Verdi s\u00f6n le palch realis\u00e9 aposta por
  ch\u00eb opera s\u00f6n le \u201cBodensee\u201d. S\u00f6n le tr\u00f9 da j\u00ec
  a Bregenz s\u2019\u00e0i archit\u00e9 a ti ciar\u00e8 al Stifts Stams, na dlijia
  y n conv\u00ebnt olache al gn\u00f4 sopol\u00ec i grofs de Tirol che ti scinc\u00e2
  tres ind\u00f4 scioldi y av\u00ebis, por che i pr\u00f4i y i patri che st\u00f4
  dail\u00f2 periass por \u00ebi y por s\u00fca anima tan d\u00ee che le conv\u00ebnt
  foss esist\u00ec. Insci\u00f6 arat\u00e2i de se garant\u00ec la vita eterna te para\u00eesc.
  Al d\u00e9dainc\u00f6 \u00e9 Stift Stams dantad\u00f6t conesci\u00fc por les cater
  scores de prestige che alda pro le conv\u00ebnt. I 7 aconsiadus dla Uniun che \u00e0
  tut pert a ch\u00ebsc iade cultural \u00e0 ince alb\u00fc l\u2019ocajiun de j\u00ec
  a H\u00f6chst (nia dalunc da Bregenz) a ti ciar\u00e8 ala bela dlijia de St. Johann,
  pro ch\u00ebra che Augustin Valentin da Porsen\u00f9 \u00e0 realis\u00e9 i confescionai
  y i tr\u00ebi alt\u00e0.\\n13 d\u2019agost 2005\\nLe v\u00ebndres ai 9 de j\u00fcgn,
  p\u00fcc dis do che al \u00e9 gn\u00fc fora la cronica dla Val Badia \\\"Sas dla
  Crusc\\\", \u00e9l gn\u00fc tign\u00ec la riuniun anuala di cronisc. Tratan l''incuntada
  \u00e9l gn\u00fc bai\u00e9 dla publicaziun, al \u00e9 gn\u00fc fat de vigni sort
  de conscideraziuns y valut\u00e9 sci\u00f6che an podess f\u00e0 da fa ciam\u00f2
  n vare inant por ci che reverda dantad\u00f6t la cualit\u00e9 di articui y dl liber
  en general. Al \u00e9 gn\u00fc bai\u00e9 dla gross\u00ebza dl liber che \u00e9 oramai
  rovada al limit cun passa 560 plates. Ti agn che v\u00ebgn messar\u00e0n dessig\u00fc
  se conzentr\u00e8 ciam\u00f2 depl\u00fc s\u00f6n la cualit\u00e9 dla publicaziun,
  ciaran che ara ne dev\u00ebntes nia ciam\u00f2 pl\u00fc grossa, ince deache ara
  dev\u00ebnta incompra da ti ciar\u00e8. Pro na buna c\u00ebna \u00e0 spo i cronisc
  pass\u00e8 deboriada na s\u00ebra plajora che d\u00ebida da cheri\u00e9 ch\u00ebl
  spirit de grup de ch\u00ebl che ara va deboj\u00ebgn por le bun garat\u00e8 de na
  publicaziun sci\u00f6che le \\\"Sas dla Crusc\\\".\\n9 de j\u00fcgn 2005\\nAi 6
  d\u2019aur\u00ec s\u2019\u00e0 n valg\u00fcgn rapresentanc dl monn dla cultura ladina
  incunt\u00e8 cun la dr.a Franceschini, returia dl''Universit\u00e9 da Porsen\u00f9,
  por sciacar\u00e8 fora n scagn de ladinistica tl\u2019Universit\u00e9 da Porsen\u00f9-Balsan.
  Ara se trata de na chestiun dass\u00ebnn importanta por le suravire y por le prestige
  dl lingaz ladin, dantad\u00f6t dal mom\u00ebnt che al ne ti v\u00ebgn pl\u00fc d\u00e8
  tan co deg\u00f6na lerch tl\u2019Universit\u00e9 da Desproch, olache le lingaz gn\u00f4
  coltiv\u00e9 cina dan da p\u00fcch a livel universitar. A Padova \u00e0 le ladin
  ince ma n\u2019importanza secundara. Por depl\u00fc \u00e9 le ladin da ciasa tles
  Dolomites y nia j\u00f6 por le talian o tl\u2019Austria. N scagn de ladinistica
  a Porsen\u00f9 \u00e9 ince important por al pois te n dagn\u00ec ester porsones
  cualificades che pois surant\u00f3 posc tl ciamp dl insegnam\u00ebnt cun na certa
  compet\u00ebnza ince por le ladin, la\u00fbrs de traduziun, da scr\u00ec libri y
  articui ti foliec por ladin y n gr\u00f6m d\u2019atri lapr\u00f2 che \u00e0 deboj\u00ebgn
  de n renovam\u00ebnt cualitatif. En ch\u00ebsc ann 2005, do che al \u00ea bele gn\u00fc
  bai\u00e9 cun l\u2019assessur provinzial ala cultura ladina dr. Florian Mussner,
  \u00e9l spo gn\u00fc a s\u2019al d\u00e8 na incuntada che an p\u00f2 defin\u00ec
  storica: i rapresentanc dla Uniun di Ladins dla Val Badia, promoturia dl''iniziativa,
  dr. Giovanni Misch\u00ec y le dr. Lois Trebo, la dr.a Rut Bernardi, rapresentanta
  dla Union di Ladins de Gherd\u00ebina, le dr. Otto Moling y la dr.a Claudia Canins
  Egger rapresentanc dla Uniun Maestri Ladins, le dr. Toni Sottriffer y le dr. Theodor
  Rifesser s\u2019\u00e0 incunt\u00e8 cun la returia dl\u2019universit\u00e9 por bai\u00e9
  dl argom\u00ebnt.\\nTi m\u00ebisc che v\u00ebgn gnar\u00e0l tut en conscideraziun
  la proposta a livel politich aministratif. Intratan \u00e9l bele gn\u00fc tign\u00ec
  depl\u00fc cursc de ladin tl\u2019Universit\u00e9 da Porsen\u00f9. Da sper\u00e9
  \u00e9l che la proposta de n scagn de ladinistica se concretis\u00ebises al pl\u00fc
  tosc...\\n6 d\u2019aur\u00ec 2005\\nEn v\u00ebndres, ai 25 de for\u00e0 \u00e9l
  gn\u00fc tign\u00ec la pr\u00f6ma riuniun dl cons\u00ebi n\u00fc dla Union Generela
  di Ladins dla Dolomites tl Hotel La Perla a Corvara. Le patrun de ciasa y presid\u00ebnt
  n\u00fc dla Generela Michil Costa \u00e0 tut ite te na manira originala y plajora
  i aconsiadus che sar\u00e0 ince s\u00fc colaboradus por i proscims tr\u00ebi agn.
  Do n discurs introdutif de presentaziun da pert dl presid\u00ebnt y spo di singui
  m\u00ebmbri dl cons\u00ebi, \u00e9son pass\u00e0 ala l\u00eeta di dui vize-presid\u00ebnc,
  sci\u00f6che le statut n\u00fc v\u00ebiga danfora. Sci\u00f6che vizepresid\u00ebnt
  che dess rapresent\u00e8 Fascia (provinzia de Tr\u00ebnt) \u00e9l gn\u00fc lit\u00e9
  al\u2019unanimit\u00e9 Riccardo Zanoner y sci\u00f6che vizepresid\u00ebnta che dess
  rapresent\u00e8 Fodom y Amp\u00ebz (provinzia de Belun) \u00e9l gn\u00fc lit\u00e9
  al\u2019unanimit\u00e9 Elsa Zardini. Tratan ch\u00ebsta pr\u00f6ma riuniun \u00e9l
  spo ince gn\u00fc nomin\u00e9 le diretur dla Generela: do na picia discusciun de
  valutaziun de candidac \u00e9l gn\u00fc fat y azet\u00e8 la proposta de David Lardschneider
  che \u00e9 atualm\u00ebnter redad\u00f9 dla Usc di Ladins a Urtij\u00ebi. Al messar\u00e0
  gn\u00ec tut s\u00f6 ti proscims m\u00ebisc na porsona che surantoles la redaziun
  de La Usc de Gherd\u00ebna.\\nDed\u00f4 \u00e9l gn\u00fc bai\u00e9 dles ativit\u00eas
  che v\u00ebgn portades inant tles singoles valades y di deboj\u00ebgns dla Generela
  y dla Ladinia en general, ince sce le punt pl\u00fc important \u00e9 st\u00e8 le
  program por le 2005, olache la Generela compl\u00ebsc 100 agn dala fondaziun. La
  pr\u00f6ma manifestaziun sar\u00e0 n conv\u00ebgn a Desproch, cit\u00e9 olache d\u00f6t
  cant \u00ea pi\u00e9 ia dan da 100 agn. Al tolar\u00e0 pert professurs y esperc
  de romanistica y al gnar\u00e0 present\u00e8 le liber sura les personalit\u00eas
  dles valades ladines.\\n25 de for\u00e0 2005\\nDo da n ann de transiziun por la
  Union Generela di Ladins dla Dolomites, olache al \u00e9 gn\u00fc laur\u00e8 fora
  n statut n\u00fc che t\u00ebgnes cunt dles esig\u00ebnzes modernes de ch\u00ebsta
  uniun y studi\u00e9 fora n sistem de bilanz forsc pl\u00fc adat\u00e8, \u00e9son
  en sabeda ai 12 de for\u00e0, en ocajiun dla riuniun generala, rov\u00e0 a \u00f6na
  de firm\u00e9 dan dal notar le statut n\u00fc. Mo la riuniun \u00e9 ince stada d\u00ebr
  importanta dal mom\u00ebnt che al \u00e9 gn\u00fc lit\u00e9 le presid\u00ebnt y
  le cons\u00ebi. Le candidat ala presid\u00ebnza che s\u2019\u00e0 present\u00e8
  te ch\u00ebsta ocajiun, sostegn\u00ec empr\u00f6maded\u00f6t dala Uniun di Ladins
  dla Val Badia, \u00e9 st\u00e8 Michil Costa da Corvara. \u00cbl \u00e9 n \u201eoutsider\u201c
  por ci che reverda la cultura ladina, mo bele te so discurs introdutif \u00e0l desmostr\u00e8
  so sav\u00ebi y s\u00fca ligr\u00ebza por ci che reverda nosc lingaz y nosta cultura
  de mendranza. Al \u00e0 port\u00e8 ince d\u2019atri ej\u00ebmpli de mendranzes europeiches
  che \u00e9 tla med\u00e9ma situaziun co ch\u00ebra di ladins dles Dolomites. Giovanni
  Misch\u00ec y Diego Clara \u00e0 te n so interv\u00ebnt ince alz\u00e8 fora les
  capazit\u00eas manajariales y organisatives de Michil, che al \u00e0 salp\u00fc
  da mostr\u00e8 s\u00f6 nia ma te so ciamp de la\u00fbr privat, mo dantad\u00f6t
  pro la Maratona dles Dolomites conesci\u00fcda lunc y lerch. Nia inultima \u00e9l
  ince gn\u00fc alz\u00e8 fora la sensibilit\u00e9 culturala desmostrada da Michil
  te depl\u00fc ocajiuns. J\u00fcda inant \u00e9ra cun na discusciun pl\u00fctosc
  v\u00eca cun domandes de vigni sort al candidat Michil Costa, por pass\u00e8 spo
  ala l\u00eeta. End\u00f6t \u00eal 33 m\u00ebmbri dles uniuns de valada pres\u00ebnc
  y che \u00e2 le d\u00ebrt da lit\u00e9. J\u00fcda fora \u00e9ra a ch\u00ebsta manira:\\nMichil
  Costa \u00e0 ciaf\u00e8 27 usc, Nani Pellegrini \u00f6na na usc y Ricardo Zanoner
  \u00f6na na usc. 3 \u00e9 stades les schedes blances y \u00f6na na scheda nula.
  Michil \u00e9 insci\u00f6 gn\u00fc aclam\u00e8 sci\u00f6che presid\u00ebnt n\u00fc
  dla Union Generela di Ladins dla Dolomites.\\n12 de for\u00e0 2005\"", "\"Carl de
  Provenza\\nEl Carl de Provenza (845-863) l''\u00e8 staa el primm re de la Provenza.\\nLa
  familia[Mudifega | mud\u00ecfica ''l sorg\u00e8nt]\\nEl Carl a l''era el terz fioeu
  de l''imperador del Sacher Roman Imperi Lotari I, e donca l''era nevod del Luis
  I el Religios (fioeu a soa voeulta de Carlomagn). La soa mader l''eva l''Ermengarda
  de Tours (...-851).\\nBiografia[Mudifega | mud\u00ecfica ''l sorg\u00e8nt]\\nEl
  Lotari I, primma de mor\u00ec, l''ha deciduu de divid el s\u00f2 regn, la Lotaringia
  (voeuna di tre part del Sacher Roman Imperi) in trii t\u00f2cch:\\n- Al maggior,
  el Luis II, l''ha daa el tr\u00f2n d''Italia e ''l titol imperial;\\n- Al segond,
  el Lotari II, l''ha daa la Frisia, i territ\u00f2ri tra ''l Reno e la S''celda,
  i mont Giura e la Sav\u00f2ia;\\n- Al Carl, la Provenza e ona part de la Borgogna
  al confin con la Sav\u00f2ia;\\nMa el Carl l''eva anm\u00f2 on bagaj, e l''eva anca
  epilettich. Per quest i s\u00f2 fradei hann cercaa a dagh el s\u00f2 territ\u00f2ri,
  ma i n\u00f2bil provenzai s''hinn rebellaa e l\u00f9 l''ha poduu rest\u00e0 re.\\nIn
  del 860 l''\u00e8 riessii a batt el s\u00f2 zio Carl II de Francia, che ''l voreva
  conchest\u00e0 la Provenza (anca se podom d\u00ec che ''l merit de la conservazion
  de l''indipendenza l''\u00e8 pu del s\u00f2 tutor, el cont Gerard II de Vienne,
  che l''era s\u00f2 zio).\\nQuand l''\u00e8 m\u00f2rt, in del 863, el regn l''\u00e8
  staa spartii tra el Lotari II e '' Luis II, che l''\u00e8 diventaa el noeuv re de
  Provenza.\"", "\"Schio\\nSchio (en v\u00e8neto: Schio; en c\u00ecmbro: Slait) l''\u00e8
  ''n c\u00fcm\u00fc itali\u00e0, de la regi\u00f9 del V\u00e8neto, en Pruv\u00ecncia
  de Vic\u00e8nsa. El g''ha presap\u00f3ch 37.281 abit\u00e0ncc, ''na superf\u00ecce
  de 67 km\u00b2 e ''na densit\u00e0 de 556 ab./km\u00b2. El cunf\u00ecna coi c\u00fcm\u00fc
  de Marano Vicentino, Monte di Malo, Posina, San Vito di Leguzzano, Santorso, Torrebelvicino,
  Valdagno, Valli del Pasubio, Velo d''Astico, Zan\u00e8.\\nSchio l''\u00e8 l'' t\u00e8rs
  c\u00fcm\u00fc per abit\u00e0ncc de la pruv\u00ecncia de Vic\u00e8nsa. L''\u00e8
  coloc\u00e0t a la ''mbocad\u00fcra de la Val Leogra e t\u00f6t ent\u00f9ren el g''ha
  ''n anfite\u00e0tro montagn\u00f9s che g''ha m\u00eca favur\u00ect le c\u00fclt\u00fcre
  contad\u00ecne e comerci\u00e0i, e g''ha ''nv\u00e9ce favur\u00ect el svel\u00f6p\u00e0s
  de le ''nd\u00fcstrie (surat\u00f6t ch\u00e8la de la lana). A schio dif\u00e0ti
  gh''\u00e8 la sede de la Lanerossi, fond\u00e0da de Alessandro Rossi, che l''\u00e8
  st\u00e0da per tat t\u00e9p l''azi\u00e8nda del set\u00f9r de la l\u00e0na pi\u00f6
  ''mport\u00e0nte del m\u00f3nt.\\nCit\u00e0 ''nzemel\u00e0de[Mudifega | mud\u00ecfica
  ''l sorg\u00e8nt]\\nGaler\u00eca fotogr\u00e0fica[Mudifega | mud\u00ecfica ''l sorg\u00e8nt]\"",
  "\"E siccome, se \u2019l fuss anca \u2019l d\u00efavol,\\nGh\u2019\u00e8 semper
  l\u2019obligh de contracambi\u00e0,\\nGh\u2019ha la consolazion de avegh sul tavol,\\nE
  de vessen fanatich,\\n615Fior de tocchej de carta aristocratich.\\nMa vegnend p\u0153u
  i familli al tu per tu\\nDe interrogass chi sien sti parentell,\\nSe strengen in
  di spall per no savell.\\n\u201cMi, de che l\u2019hoo daa a bajla, l\u2019hoo vist
  pu:\\n620E ti? \u2014 Mi a damm la mort so no chi \u2019l sia; \u2014\\nMi hoo mai
  sentii sto nomm in vita mia. \u2014\\nSpecciee che ghe sont su.\\nL\u2019\u00e8
  quel original,\\nQuel ganivell insc\u00ec complimentos\\n625Che fava el spiritos\\nE
  spiegava i sciarad in casa tal.\u201d\\nOmber di nost messee,\\nChe senza tanti
  smorfi n\u00e8 bambann\\nDisevev \u201cbonna fin e bon capp d\u2019ann\u201d,\\n630Come
  serev indree!\\nV\u00efolter ai vost d\u00ec\\nPer tutt biliett de sta giornada
  chi\\nCognossevev appenna el majstadin\\nDe la Dottrina, cont su scritt in fin:\\n635\u201cPregate
  per gli oziosi\u201d,\"", "\"La scontr\u00e8da al\u00f3 dal \u201cCiastel del Buonconsiglio\u201d
  averta dal vizepresident de la Provinzia Mario Tonina\\nN argoment de anchecond\u00ec,
  che l\u2019\u00e9 \u201cna testimonianza concreta de tant che l\u2019\u00e9 fondament\u00e8l
  no dem\u00f2 per noscia provinzia, ma ence per dut l Trentin. Se scomenza a rejon\u00e8r
  de dialoghes enscin dal titol de chesta scontr\u00e8da, e acioche se posse dialogh\u00e8r
  ben, ge vel se scut\u00e8r un co l\u2019auter, e tel medemo temp, ge vel se meter
  a la leta\u201d. Con chesta paroles l vizepresident de la Provinzia autonoma de
  Trent Mario Tonina l\u2019\u00e0 avert la quarta scontr\u00e8da de \u201cDialoghes
  co la mendranzes\u201d, che aea desche titol \u201cMendranzes: l valor de la desvalivanza
  linguistica e cultur\u00e8la e sie raport co la democrazia\u201d, che la \u00e9
  stata te la \u201cSala delle Marangonerie\u201d tel \u201cCiastel del Buonconsiglio\u201d
  en jebia ai 25 de november de domesd\u00ec.\\n\u201cRespet\u00e8r duc chi che f\u00e8sc
  p\u00e8rt de na soziet\u00e0 e esser bogn de favorir l dialogh l\u2019\u00e9 valores
  con chi che se mesura na democrazia partezip\u00e8da. Tel Trentin de l\u2019Autonomia
  e de l\u2019autogoern la partezipazion l\u2019\u00e9 bensegur n conzet che ne prem\u201d,
  l\u2019\u00e0 dit Tonina. \u201cSion scialdi spervaji che la democrazia no la vegn
  da l\u2019aut, dal cajo o da la circostanzes; la democrazia l\u2019\u00e9 n percors
  che va inant pian pian e che duc i membres de la soziet\u00e0 cogn f\u00e8r ensema.
  Dem\u00f2 a chesta vida se pel aer na democrazia dalbon partezip\u00e8da\u201d.\\nL
  confront l\u2019\u00e9 stat fat dintornvia chesta trei paroles: scombater, autodeterminazion,
  p\u00e8sc. \u201cParoles senestres, da dur\u00e8r con respet e con maniera. Paroles
  fortes\u201d, descheche l\u2019\u00e0 sotriss\u00e0 Tonina, rengrazian chi che \u00e0
  tout p\u00e8rt a la scontr\u00e8da. Anter chisc, Stefano Bruno Galli, assessor a
  l\u2019autonomia e cultura de la Region Lombardia e dozent de Storia de la dotrines
  e de la istituzions politiches de l\u2019Universit\u00e0 de Milan, Jens Woelk, dozent
  de la Scola de Studies Internazion\u00e8i de l\u2019Universit\u00e0 de Trent, enciari\u00e0
  dal responsabol de la scomenzadives en cont de mendranzes linguistiches e la enrescidora
  Roberta Medda-Windischer, de l\u2019Istitut sui deric de la mendranzes de l\u2019Eurac
  Research de Busan. N gran detelpai l ge \u00e9 stat sport a l\u2019editorialist
  e scritor afgan Alidad Shiri, moderator de la scontr\u00e8da, \u201cde chel che
  cognoscion la storia, dassen dramatica, ma ence piena de speranza\u201d, l\u2019\u00e0
  dit am\u00f2 l vizepresident.\\nAl tavolo dei relatori al quarto incontro \u201cDialoghi
  con le minoranze\u201d (Mario Tonina, vicepresidente della Giunta provinciale assessore
  all\u2019ambiente urbanistica e cooperazione) [ Archivio Ufficio Stampa PAT, CC
  BY SA 4.0]\\n\u201cChesta scomenzadiva l\u2019\u00e9 n obietif che se \u00e0 met\u00f9
  dant la Jonta provinzi\u00e8la, e che l ge \u00e9 stat dat s\u00f9 al Servije Mendranzes
  linguistiches locales e audit european acioche l vegne met\u00f9 a jir, per conferm\u00e8r
  n nef arvejinament envers la mendranzes linguistiches. Ajache sun nosc raion l\u2019\u00e9
  mendranzes linguistiches storiches, ladins, mochegn e zimbres, la scontr\u00e8des
  vel aprofondir l\u2019argoment pi\u00f9 univers\u00e8l de la mendranza, da ponc
  de veduda desferenc, col port\u00e8r dant apuntamenc ouc a duc i sentadins che \u00e0
  enteress en cont de la desvalivanza linguistica e cultur\u00e8la\u201d, l\u2019\u00e0
  despieg\u00e0 Tonina.\\nL\u2019\u00e9 stat tropes i argomenc che l\u2019\u00e9 vegn\u00f9
  fora da la scontr\u00e8da. Galli l\u2019\u00e0 record\u00e0 che lengaz, teritorie
  e cultura l\u2019\u00e9 la coorden\u00e8des de la mendranzes e che la costion del
  recognosciment de l\u2019autonomia la pel esser analis\u00e8da te desvaliva manieres,
  dal pont de veduda sociologich, storich e giuridich, ma a fondament de n recognosciment
  per i teritories che anchecond\u00ec te la T\u00e8lia volessa ru\u00e8r a na maor
  autonomia, se troa n at de lealt\u00e0 istituzion\u00e8la e de responsabilit\u00e0
  costituzion\u00e8la, record\u00e0 da l\u2019articol 116 de noscia Costituzion. Per
  Woelk l conzet de autodeterminazion \u201cl\u2019\u00e9 massa fort, miec partir
  con n conzet pi\u00f9 lijier, deche tro\u00e8r la felizit\u00e0, tegnir cont de
  la responsabilit\u00e0 de noscia dezijions, se realis\u00e8r ald\u00f2 de noscia
  idees recordan che i limic l\u2019\u00e9 i deric di etres e i besegnes de duc\u201d.
  Medda-Windischer l\u2019\u00e0 record\u00e0 enveze che se na comunit\u00e0 la \u00e9
  bona de tegnir permez l\u2019\u00e9 \u201cde gra a n balanzament anter desvalivanza
  e unit\u00e0. La gran endesfides globales les \u00e0 de besegn de n sforz spart\u00ec
  anter duc, ma aboncont no se cruzi\u00e8r de la desvalivanzes vel dir no tegnir
  cont de la mendranzes e no ru\u00e8r a chela unit\u00e0 che se volessa arjonjer\u201d.\\nTinultima
  l\u2019intervent de Shiri, che l\u2019\u00e0 cont\u00e0 a na vida scempia ma fona
  sia storia desche member de na mendranza etnica e religiousa, recordan dant sia
  bela infanzia, co la familia, la scola e tenc de amisc, che la \u00e9 stata dessat\u00e8da
  per semper de nef egn canche l\u2019\u00e0 perd\u00f9 sie p\u00e8re a cajon de n
  atentat e dap\u00f2 sia m\u00e8re, sia giava e sia sor end\u00e8na n bombardament
  di talebans. Dapod\u00f2 la cont\u00e0 de coche l\u2019\u00e9 sciamp\u00e0 da l\u2019Afghanistan
  per ru\u00e8r tel Pakistan e dap\u00f2 te l\u2019Iran, olache l\u2019\u00e9 dovent\u00e0
  enfug\u00e0 e olache l\u2019\u00e0 cogn\u00f9 se vadagn\u00e8r i scioldi per pa\u00e8r
  j\u00f9 i traficanc che ge aea empromet\u00f9 l\u2019ensomech de p\u00e8sc e ledeza
  te l\u2019Europa. D\u00f2 esser ru\u00e0 te la Turchia, l\u2019\u00e9 jit a p\u00e9
  set dis alalongia per ru\u00e8r te la Grecia e chi\u00f2 la dezid\u00f9 de arjonger
  la T\u00e8lia viajan tac\u00e0 sotite n Tir, con condizions estremes de fam e seit
  e cognan cerner de lasc\u00e8r a sie destin tropes compagnes de viac. \u201cTe la
  T\u00e8lia, de gra a sacotenc didamenc, son stat bon de f\u00e8r n percors scolastich
  e de ciap\u00e8r la laurea: a scola \u00e9 tro\u00e0 no dem\u00f2 n lech de aprendiment
  ma ence n laboratorie de umanit\u00e0\u201d, l\u2019\u00e0 dit. Te la d\u00ec internazion\u00e8la
  contra la violenza su la femenes, Shiri l\u2019\u00e0 vol\u00f9 record\u00e8r ence
  la condizion de la femenes te sie paisc, a 112 dis da canche i Talebans se \u00e0
  tout l poder te l\u2019Afghanistan. \u201cTropa families cogn vener sia fies a omegn
  gregn e adertura i orghegn per poder soraviver\u201d, l\u2019\u00e0 cont\u00e0,
  recordan per\u00f2 l coraje de la protesta che tanta autra femenes les porta inant
  con onor e determinazion.\\nTraduzion di Servijes Linguistics e Cultur\u00e8i del
  Comun general de Fascia\\n(Traduzione a cura dei Servizi Linguistici e culturali
