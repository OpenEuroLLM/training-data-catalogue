  l''\u00e8 l\u00fcnch inturnu aj 2.900 km e al quata suta un basin de 670.000 km\u00b2.
  L''\u00e8 v\u00fcn dii fi\u00fcmm cunt la purtada d''acqua p\u00fcssee granda al
