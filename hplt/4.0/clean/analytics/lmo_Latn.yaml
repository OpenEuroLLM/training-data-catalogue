sample: '["\"El corasg (ciamad anca valor o nom\u00e0 c\u0153ur[1]) l\u2019\u00e8
  la scerna e l\u2019intenzion de front\u00e0 dolor, patiment, priguer, inzertezza
  e sudizzion.\\nLa virt\u00f9 classega de la fortituden l\u2019\u00e8 despess voltada
  coma \u2018corasg\u2019, ancaben che a nivell concetual la t\u0153uva denter anca
  la perseveranza e la pazzienza.[2] In la zivilit\u00e0 ozzidental, i penser pussee
  important in sul corasg vegnen sgi\u00f2 di filosef classegh, compagn del Socret,
  Platon, Aristotel, anca se dei oltre figure post-classeghe compagn de San Tomas
  d''Aquin e del S\u00f8ren Kierkegaard hann, de tute i manere, tolt part in del desvilup
  del concet.\\nIn la mitologia ind\u00f9, se p\u0153ul trov\u00e0 un badaluch de
  esempi de corasg e valor, e fisegh, e morai. In di culture de l\u2019Orient Estrem,
  el test cines del Tao Te Ching l\u2019oferiss un bell poo de penser e ideje in sul
  corasg.\\nVos conrelade[Modifega | modifica ''l sorgent]\\nOlter proget[Modifega
  | modifica ''l sorgent]\\nReferenze[Modifega | modifica ''l sorgent]\\n- Cherubini,
  Francesco (1843). Vocabolario milanese\u2013italiano.\\n- Rickaby, John (1909).
  The Catholic Encyclopedia. New York: Robert Appleton Company.\"", "\"U decid\u00fc\u00fc
  da scrival in dialett,\\nCertament al sar\u00e0 mia perfett,\\nMett gio do rig in
  rima,\\nAnca se a sc\u00f6la sevi mia na scima.\\nGhemm bisogn t\u00fccc d''un maestru
  da nac a dree,\\nche al ma trasmeta la v\u00f6ia da fa, e da savee.\\nL\u2019amur
  par la t\u00e9ra, par i associazion di paisan\\nrop pratic, autentic, nustran.\\nDa
  pinin, l\u2019u pena cugnus\u00fc\u00fc,\\npodi mia di tanti ropp,\\nsentivi la
  sua passiun,\\nche certament al ma trasmet\u00fc\u00fc.\\nTanti i mezi d\u2019informaziun,\\ngiurnai,
  radio e televisiun.\\nAl gh\u2019era na gran cult\u00fcra,\\nmi podaru mai vess
  ala so stat\u00fcra.\\nI s\u00f2 prezius insegnament,\\ndala sc\u00f6la al lavur,\\ni\u2019\u00e8
  stai \u00fctii par tanta gent.\\ndai paisan, fin ai dutur.\\nRispet\u00e0 e cultiv\u00e0
  la t\u00e9ra,\\ne truv\u00e0 in di cicli da la nat\u00fcra,\\nuna soluziun vera,\\nquela
  giusta ad ogni ura.\\nP\u00fcrtropp o par fortuna, t\u00fcta la gent\\ndef lasaa
  stu munt un quai mument,\\nma se ghem vita a scamp\u00e0,\\npodarem forsi anca n\u00fcm
  come l\u00fc,\\nlassa n\u2019imprunta in sta societ\u00e0.\\nSperi sa sia ofend\u00fc\u00fc
  nis\u00fcn,\\nda ve fai sta breve oraziun.\\nL\u2019o faia anca par i nos vecc,\\nche
  inc\u00f6\u00f6 dismentigum tropp da spess.\"", "\"Conzert iubilar en v\u00ebndres
  ai 9 d''agost dales 20:30, te dlijia da La Val\\nAl \u00e9 recorc de t\u00ebmps
  pass\u00e1, indere ciam\u00f3 vis, chi che l''Orchestra Val Badia porta dant tl
  conzert de iubileum ai 9 d''agost dales 20:30 tla dlijia da La Val. Por le iubileum
  di 10 agn, na spazirada danterater cun les st\u00ebres dla musiga dl sisc\u00ebnt,
  da Antonio Vivaldi a Georg Friedrich H\u00e4ndel cina Johann Sebastian Bach. Da
  rich\u00ebza de ornam\u00ebnc y solenit\u00e9 dl''orchestra d''arch\u00ebc, ai passaji
  de gran virtuosit\u00e9 di solis\u0107 \u2013 la musiga baroca \u00e9 musiga alingrana,
  pl\u00ebna de ispiraziun. Vigni nota nes d\u00e1 l''idea de movim\u00ebnt, de abondanza
  y forsc sar\u00e1l val'' nota che portar\u00e1 pro a cheri\u00e9 n recort de na
  s\u00ebra da d''ist\u00e9. I s\u00ebis d\u00ebr bel invi\u00e1 al conzert. L''entrada
  \u00e9 l\u00ebdia.q\\nFerrari y i ani d''or dl Cavallino\\nAncunteda cun l autor
  Umberto Zapeloni te Tubl\u00e0 da Nives te S\u00eblva, ulache l v\u00ebn prejent\u00e0
  n mierculdi ai 7 de agost dala 21.00 l liber nuef n con'' dl mit dla Ferrari\\nL
  liber \u00e0 l titul \u00bbFerrari. Gli uomini d''oro del Cavallino\u2013Ritratti
  di nove eroici piloti che hanno fatto la storia della Ferrari e della Formula Uno.\u00ab
  L autor nst\u00ebs Umberto Zapeloni sar\u00e0 prej\u00ebnt. \u00cbl ie bele dai
  ani ''80 che ti sta do ala Formula 1, ntl\u00ebuta coche jurnalista de \u00bbil
  Giornale\u00ab. Zapeloni ie danter l auter nce stat vizediret\u00ebur de \u201eLa
  Gazzetta dello Sport\\\" y \u00e0 nce scrit plu libri. Atualm\u00ebnter \u00e0l
  na cunlaurazion cun plu zaites y cun \u00bbSky\u00ab y \u00bbMediaset\u00ab y scrij
  regulerm\u00ebnter sun l blog topspeed.blog.\\nLa prejentazion m\u00ebt man dala
  nuef dass\u00ebira. La ntreda ie debant.\\nFesta dla leterat\u00f6ra a Longega\\nCun\\nL''EPL
  \u2013 Ert por i Ladins invi\u00ebia ala festa dla leterat\u00f6ra cun auturs ladins
  y ala premiaziun dl Pest Angelo Trebo 2018, al intern dla mostra ContainErt a Longega,
  en sabeda ai 10 d''agost 2019, dales 17:00 inant. I recordun che i pes\u0107 dla
  ediziun 2018 ti \u00e9 g\u00fcs assegn\u00e1 dala juria menada da Roland Verra a
  chisc auturs: Jasmin Ferdigg (1. post), Andr\u00e9 Comploi (2. post), Mattia Maldonado
  y Rut Bernardi (ex aequo 3. post).\\nLe pest v\u00ebgn scrit fora dal''EPL dal 1997
  inc\u00e1 \u2013 cun tapa vigni tr\u00ebi agn.\\nHubert Dorigatti a ContainErt\\nLe
  ciantautur y chitarist blues d''ezeziun sonar\u00e1 a Longega ad\u00f6m cun Fabrizio
  Poggi (blues harp) y Matteo Giordani (percusciuns)\\nLe conzert de Hubert Dorigatti
  sar\u00e1 en sabeda, ai 10 d''agost, dales 19:30 inant (do la festa dla leterat\u00f6ra)
  tl areal dla mostra EPL-Ert por i Ladins \u00bbContainErt\u00ab a Longega.\\nEntrada
  debann!\\n\u00bbPlaj\u00ebis y duciaries\u00ab a Calfosch\\nEn mertesc ai 6 d''agost
  v\u00ebgnel ind\u00f4 met\u00fc a j\u00ed la degustaziun de pat\u00fcc duc s\u00f6n
  plaza de dlijia\\nS\u00f6n plaza de dlijia a Calfosch v\u00ebgnel met\u00fc a j\u00ed
  dales 17:00 ales 22:30 na degustaziun de pat\u00fcc duc y d''atres spezialit\u00e9s
  tradizionales. Al tol pert pl\u00fc eserzizi dl post: le hotel Gran Ciasa, le J\u00e4gerhof
  ad\u00f6m cun la \u00dctia Edelweiss, la bot\u00ebga de pat\u00fcc da mang\u00e9
  Costa, le restorant y pizzeria Salvan, le Berghotel Ladinia, la pension Garden,
  le restorant Stria, la bot\u00ebga Arte Costa y la \u00fctia Mesoles. La manifestaziun
  v\u00ebgn abelida cun musiga di grups Annika Borsetto, Louis & the Space Travellers,
  Burggr\u00e4fler Buam y El Dorado. Por i pl\u00fc pici v\u00ebgnel ince met\u00fc
  a j\u00ed animaziun, olache ai p\u00f3 s\u00e9 lasc\u00e9 dep\u00ebnje le m\u00fcs
  o sogh\u00e9 cun les fig\u00f6res de palons.\\nMarc\u00e9 por n bun fin\\nA La Val
  v\u00ebgnel organis\u00e9 n marc\u00e9 di p\u00f6resc, por daid\u00e9 f\u00e1 s\u00f6
  na scora tl Camerun. Al sar\u00e1 dai 18 ai 25 de agost\\nCh\u00ebsc ann v\u00ebgnel
  record\u00e9 i 20 agn dala mort de siur Heinrich Videsott. Por record\u00e9 so gran
  ej\u00ebmpl de vita, s\u00fca desponibilit\u00e9 de y n\u00f6t por i atri, s\u00fces
  mans y so c\u00f6r tres daverc por d\u00fcc, orunse daid\u00e9 cun nostes ofertes
  f\u00e1 s\u00f6 na scora tl Camerun. Te ch\u00ebsta tera de misciun \u00e1 laur\u00e9
  y pordich\u00e9 la parora de D\u00ee por tr\u00f6c agn le nu de siur Videsott \u2013
  siur Hans Kronbichler. Por c\u00f6ie ad\u00f6m ofertes v\u00ebgnel fat n marc\u00e9
  di p\u00f6resc a La Val, dai 18 ai 25 de agost, vigni de dales 8:00 ales 11:00 y
  dales 16:00 ales 19:00. Al v\u00ebgn peri\u00e9 do cosses de secunda man, che p\u00f3
  gn\u00ed cond\u00fctes tl pice salf a La Val, en v\u00ebndres ai 16 d''agost dales
  9:00 ales 12:00 y dales 14:00 ales 17:00. Por informaziuns pl\u00fc avisa p\u00f3n
  cherd\u00e9 s\u00f6 le 331 2719213. Dilan a d\u00fcc dl ai\u00fct.\\nSonns y li\u00ebndes
  te Fanes\\nPro la \u00dccia Lavarella \u00e9l ai 11 d''agost l''ev\u00ebnt \u00bbThe
  Fanes saga & his modern sound\u00ab, cun Simon Kostner, Lucia Kastlunger & la band
  dimonic, y Hubert Dorigatti\\nEn dom\u00ebnia ai 11 d''agost, danter les 2 y les
  5 domisd\u00e9, sar\u00e1l dan la \u00dccia Lavarella tla bela contrada de Fanes
  n conzert dald\u00f6t particolar, cun la musizista Lucia Kastlunger y s\u00fca band
  \u00bbdimonic\u00ab y le chitarist Hubert Dorigatti. Fora por le conzert condujar\u00e1
  l''atur Simon Kostner, che tolar\u00e1 ispiraziun dala musiga por cunt\u00e9 dl
  raiun de Fanes y de s\u00fces li\u00ebndes. L''ev\u00ebnt\\nJ\u00f6bia de Corvara\\nAi
  8 d''agost animaziun por pici y gragn tl z\u00ebnter da Corvara\\n\u00bbLa j\u00f6bia
  de Corvara\u00ab s\u00f6l program ai 8 de agost ti v\u00ebgn dedicada ai mituns.
  Dales 17:15 ales 19:15 y do c\u00ebna dales 21:00 ales 22:15 sar\u00e1l fora por
  le z\u00ebnter da Corvara de vigni sort de animaziun cun clowns, strinadus, face
  paiting y j\u00fcc. I grups \u00bbPamstiddn Kings\u00ab y \u00bbEl Dorado\u00ab
  se cruziar\u00e1 dl intratignim\u00ebnt musical y i mituns \u00e1 insci\u00f6 poscibilit\u00e9
  da pass\u00e9 n domisd\u00e9 y na s\u00ebra cun tr\u00f6p devertim\u00ebnt.\\nLa
  manifestaziun cun animaziun por mituns gnar\u00e1 ciam\u00f3 n iade met\u00fcda
  a j\u00ed ai 29 de agost. Pro vigni \u00bbJ\u00f6bia de Corvara\u00ab v\u00ebgn
  la strada prinzipala da Corvara stl\u00fcta al trafich dales 17:00 ales 22:30.\\nConzert
  de clavier tla nat\u00f6ra\\nLe \u00bbpianista fuoriposto\u00ab Paolo Zanarella
  sona tles contrades dolomitiches: ai 5, 6 y 7 d''agost\\nPaolo Zanarella \u00e9
  n musizist particolar: al porta dant conzerc de clavier te pos\u0107 nia da vignid\u00e9:
  tla nat\u00f6ra, s\u00f6n plazes y strades te cit\u00e9s, s\u00f6n punc y barches
  a Aunejia y tr\u00f6c d''atri ambi\u00ebnc. S\u00fca filosofia \u00e9 ch\u00ebra
  de port\u00e9 la musiga indlunch, ince te pos\u0107 olache an ne se l''aspeta nia.
  Porch\u00ebl s''al d\u00e9 inom \u00bbIl pianista fuoriposto\u00ab \u2013 le pianist
  viandant. En ch\u00ebsc iade \u00e9l la bela contrada dles Dolomites che i fej da
  cornisc a s\u00fc conzerc. En l\u00f6nesc ai 5 de agost sonar\u00e1l a La Crusc
  a Badia (sce al \u00e9 bur'' t\u00ebmp tl z\u00ebnter da San Ciascian); mertesc
  ai 6 d''agost gnar\u00e1 i pra da Rit anim\u00e1 dal sonn dl clavier (sce al \u00e9
  bur'' t\u00ebmp tl z\u00ebnter da La Val); l''ultim apuntam\u00ebnt \u00e9 en mercui
  ai 7 de agost ti pra sot ales cascades de Pisciad\u00fa a Calfosch (sce al \u00e9
  bur'' t\u00ebmp s\u00f6n plaza de comun a Corvara). D\u00fcc i amanc dla musiga
  y dla nat\u00f6ra \u00e9 invi\u00e1 ai conzerc, che m\u00ebt man dales 10:00 y jar\u00e1
  tres d\u00f6t le de cina ales 17:00.\\n\u00bbPeter Pan \u2013 en jore de soms\u00ab\\nMusical
  te cater lingac met\u00fc a j\u00ed dal Sorvisc ai Jogn Val Badia en colaboraziun
  cun le Cor di Jogn ProVoXis, ad\u00f6m cun mituns y mitans dla Val Badia. Premiera
  inc\u00f6 v\u00ebndres ai 2 d''agost\\nLa direziun musicala \u00e9 de Sofia Pisching,
  la rejia y coreografia de Barbara Comploi Rottensteiner, i cost\u00fcms de Maria
  Frenner, la scenografia de Ursula Tavella, l''assist\u00ebnza ala rejia de Nadia
  Gerstl, la coordinaziun de Stefanie Kaneider y les traduziuns por ladin de Pablo
  Palfrader.\\nS\u00f6n palch sar\u00e1l da od\u00ebi i protagonis\u0107: Arico Elisa,
  Bacher Aylin, Clara Luianta, Clara Moltina, Costabiei Aylin, Costalunga Marcus,
  Ferdigg Anna, Kostner Emily, Lezuo Mattia, Mohr Maximilian, Pescollderung Roman,
  Sogorka Emma, Ties Jan, Ties Andre.\\nDa pert dl Cor di Jogn ProVoXis: Canins Greta,
  Costalunga Miriam, Costalunga Tobias, Costner Christin, Dapoz Johanna, Frenademez
  Sara, Garriga Sivila Gemma, Kaneider Nicole, Pescollderungg Maddalena, Rottonara
  Luca, Tavella Ines, Tolpeit Daniel, Videssot Ilenia.\\nBand: Moling Matthias, Pedevilla
  Patrick, Willeit Daniel, Palfrader Marion, Verginer Peter, Kaneider Stefanie, Pisching
  Sofia.\\nLes rapresentaziuns \u00e9 inc\u00f6 v\u00ebndres ai 2 d''agost dales 19:30,
  indoman sabeda ai 3 d''agost dales 18:00 y en dom\u00ebnia ai 4 d''agost dales 15:00
  y dales 20:00, dagnora te Ciasa dla Cultura a La Ila. Les prenotaziuns v\u00ebgn
  tutes s\u00f6 tres SMS al nr. 335 5400890. Al \u00e9 da d\u00e9 dant\\nLa produziun
  \u00e9 dl Sorvisc ai Jogn Val Badia, cun le sost\u00ebgn finanziar dla Regiun Autonoma
  Trentin S\u00fcdtirol, Cassa Raiffeisen Val Badia, Alta Badia, le Comun de Badia
  y le Comun de Corvara.\\nLa Grupa Helios te Fascia\\nEn domenia ai 4 de aost i portar\u00e0
  dant l conzert \u00bbFeel the beat\u00ab te La Gran Ciasa a Soraga\\nL grop cognosci\u00f9
  de ciantarins e musizis\u0107 Helios de Ortijei rua per la pruma outa te Fascia
  en domenia ai 4 de aost. \u00bbFeel the beat\u00ab l''\u00e9 l titol del conzert
  che i joegn de Gherdena portar\u00e0 dant te la sala de La Gran Ciasa a Soraga da
  les 21:15. L conzert \u00e9 stat endrez\u00e0 da la Comiscion cultura de la parochies
  de Fascia en colaborazion con l Comitat Manifestazions de Soraga tel ch\u00e8der
  de la rassegna \u00bbIspirazions d''ist\u00e0 2019\u00ab.\\nLa Grupa Helios portar\u00e0
  te Fascia sia gaissa e sie entusiasm te n conzert endrez\u00e0 per chesta ocajion
  olache no menciar\u00e0 la cianties per ladin che \u00e9 states regoetes ence tel
  nef CD dal titol \u00bbSuvier\u00ab dat fora del 2017 ma ence toc de musega rock
  e pop. Na ocajion da no perder tant per ghes\u0107 che jent del post che podar\u00e0
  cognoscer e apriji\u00e8r la musega e la cianties de chest grop da talent.\\nL \u00bbSaslonch\u00ab
  de Vinzenz Senoner\\nLa pitures dl artista da Fussel ie da ud\u00ebi nchin ala fin
  dl m\u00ebns tla s\u00ebnta dla Cassa Raiffeisen a S. Cristina\\nN ucajion di 150
  ani dala prima arpizeda storica dl Saslonch, m\u00ebt Vinzenz Senoner da Fussel
  ora si pitures che reprej\u00ebnta nosc cr\u00ebp simbul tla galaria dla Cassa Raiffeisen
  a S. Cristina.\\nLa pitures ie unides realisedes dal artista n pert da Plesdinaz,
  dal meje de Fussel, via de viers dl Saslonch, ma nce da d''autra perspetives danter
  la plu beles te Gherd\u00ebina.\\n\u00bbUni di che n ti c\u00ebla al Saslonch iel
  autram\u00ebnter. Datrai iel daduman mpue'' fat ite cun nibl da bata, da mesd\u00ec
  via mpue'' da plueia y da s\u00ebira via luna in\u00f2 tres l sur\u00ebdl cun cul\u00ebures
  cuecenins. Samb\u00ebn che l Saslonch se muda nce ald\u00f2 dla sajons, se furnian
  uni iede mpue'' autram\u00ebnter. Y plu che n ti c\u00ebla, y plu bel che l ie!\u00ab
  nscila Vinzenz Senoner.\\nN possa j\u00ec a ti cial\u00e9 ala pitures dla mostra
  \u00bbSaslonch\u00ab nchin ai 30.08. ntan i orares de giaurida dla banca.\\nAl Plan:
  tr\u00ebi dis de festa\\nDai 2 ai 4 d''agost sar\u00e1l gran festa a Al Plan. La
  dom\u00ebnia ince cun la gran defilada dl R\u00ebgn de Fanes\\nTe ch\u00ebsc fin
  dl''edema lunch dal v\u00ebndres ai 2 d''agost ala dom\u00ebnia ai 4 \u00e1 la Musiga
  d''Al Plan le plaj\u00ebi da invi\u00e9 a tr\u00ebi dis de festa cun musiga y alegria,
  s\u00f6n plaza dl paiun de paisc. Le v\u00ebndres dales 21:00 inant sonar\u00e1
  la partyband \u00bbThe Jam''son\u00ab, la sabeda dala medema ora jar\u00e1 s\u00f6n
  paladina la \u00bbBlaskapelle Geh\u00f6rsturz\u00ab dal Tirol.\\nN program rich
  \u00e9l spo ince la dom\u00ebnia. An m\u00ebt man dales 11:00 cun le conzert dla
  musiga da Kaltern, por pass\u00e9 spo dales 14:00 ala gran defilada dles li\u00ebndes,
  che se sleria inc\u00ebr paisc. Dales 15:30 sonar\u00e1 la musiga da Luttach y dales
  17:00 la Musiga da Rina. Dales 19:00 inant \u00e9l spo musiga cun \u00bbDie Bergdiamanten\u00ab.\\nConzert
  dl trio \u00bbTreboton\u00ab\\nLe trio met\u00fc ad\u00f6m da Alex Trebo, Max Castlunger
  y Marco Stagni sona ai 9 d''agost tla curt dl Museum Ladin Ciastel de Tor\\nLe \u00bbTreboton
  Trio\u00ab invi\u00ebia a n conzert cinematich, eletro-acustich, en v\u00ebndres
  ai 9 d''agost dales 21:30 tl Museum Ladin Ciastel de Tor. Tla curt dl ciastel podar\u00e1n
  ald\u00ed composiziuns de Alex Trebo, che sonar\u00e1 le clavier acompagn\u00e9
  da Max Castlunger ales percusciuns/fabl\u00f3, y Marco Stagni al cuntrabas. Les
  melodies cun elem\u00ebnc eletronics y acustics ar\u00e1 ince contegn\u00fcs jazz
  y dla musiga \u00bbambient\u00ab. La s\u00ebra v\u00ebgn tignida en colaboraziun
  cun l''Assoziaziun Turistica Al Plan/San Martin y le Museum Ladin Ciastel de Tor.\\nMostra
  \u00bbMejes \u2013 Memoria de na cuntreda\u00ab\\nLa giaurida dla mostra dl Museum
  Gherd\u00ebina tla gran sala dla C\u00ebsa di Cungresc a Urtij\u00ebi ie n dum\u00ebnia
  ai 4 de agost dala 10:00\\nL Museum Gherd\u00ebina \u00e0 l plaj\u00ebi de Ve nvi\u00eb
  ala giaurida dla mostra \u00bbMejes de Gherd\u00ebina\u2013Memoria de na cuntreda\u00ab
  doduman dum\u00ebnia ai 4 de agost dala 10:00 tla gran sala dla C\u00ebsa di Cungresc
  a Urtij\u00ebi.\\nLa paroles de salut unir\u00e0 purtedes dai assess\u00ebures Daniel
  Alfreider y Manfred Vallazza, dal ambolt Tobia Moroder y dala presid\u00ebnta dl
  Museum Marie Theres Thaler.\\nLa mostra unir\u00e0 prejenteda dai autores Wolfgang
  von Klebelsberg, Paulina Moroder y V\u00e1clav \u0160ed\u00fd, cun reflescions de
  Annibale Salsa per la Fundazion Dolomites Unesco.\\nCurnisc mujighela dl Cor \u00bbSasslong\u00ab.\\nDo
  la giaurida ufiziela n ch\u00ebsc di resta la mostra davierta nchin la 16:00 cun
  ntreda debant.\\nOrar de giaurida dai 05.08. inant: da lunesc nchin sada dala 15:00-18:00,
  de dum\u00ebnia dala 10:00-12:30.\\nLa mostra sar\u00e0 da ud\u00ebi nchin ala fin
  de jen\u00e9 dl 2020, dan che la unir\u00e0 meneda ncant\u00ebur tla Elpes.\"",
  "\"Arno Kompatscher l \u00e0 envi\u00e0 via sie descors col ge d\u00e8r l benvegn\u00f9
  \u201ctel Sudtirol, tel cher de la \u00c8lpes e ades tel cher de ESUALP\u201d, a
  chi che \u00e0 tout p\u00e8rt, e l \u00e0 sotriss\u00e0 che soraldut te chesta particol\u00e8ra
  Region alpina \u201cdem\u00f2 col st\u00e8r adum e co la colaborazion se \u00e9
  bogn de ge f\u00e8r front a la endesfides del davegnir\u201d. E l \u00e9 apontin
  EUSALP che l se f\u00e8sc str\u00e8da semper de pi\u00f9 te la \u00c8lpes desche
  strument stabol e de cooperazion sorafora la seides\u201d. Kompatscher l \u00e0
  record\u00e0 che \u201cl obietif de la presidenza tali\u00e8na EUSALP 2022 l \u00e9
  chel de f\u00e8r dovent\u00e8r la Region alpina la pruma Macroregion Carbon Neutral
  te l\u2019Europa, ald\u00f2 di sistemes de stravardament per l tempram de l\u2019UE
  e l Green Deal european\u201d.\\nArgomenc prinzip\u00e8i: mudament climatich e stravardament
  del tempram\\n\u201cEnce l mudament climatich e l stravardament del tempram sar\u00e0
  i argomenc prinzip\u00e8i de noscia presidenza \u2013 l \u00e0 record\u00e0 l president
  -. L\u2019Agenzia per l\u2019Energia Alto Adige \u2013 Casa Clima la rec l\u2019Action
  Group \u2013 Energy de EUSALP e noscia vijion la \u00e9 chi\u00e8ra: col port\u00e8r
  inant na energia percacenta e na mudazion energetica volon ge f\u00e8r str\u00e8da
  a na Macroregion alpina Carbon Neutral\u201d. Kompatscher l se \u00e0 dit a una
  col tor ite de pi\u00f9 i Comuns ti prozesc de dezijion, desche pil\u00e8stres ti
  setores essenzi\u00e8i desche l\u2019efizienza energetica, l ressanament de frabica
  e la pianificazion teritori\u00e8la. L president l \u00e0 am\u00f2 sotriss\u00e0
  la emportanza del turism e de la mobilit\u00e0 sostenibola, de la cooperazion de
  la protezion zivila e te la gestion di risesc natur\u00e8i, te la pianificazion
  teritori\u00e8la e te la desvaliva doura di bos\u0107. Tel meter dant i obietives
  de EUSALP del an pass\u00e0, \u201cl trasport tras ferata, soraldut per chel che
  v\u00e8rda i viajes pi\u00f9 lonc, cognessa esser l fondament de n sistem de trasport
  sostenibol pi\u00f9 percacent, che se emprev\u00e8l de pi\u00f9 mesi desvalives
  e cole\u00e9.\\n\u201cLa Provinzia autonoma de Trent la \u00e9 onor\u00e8da de poder
  d\u00e8r sie contribut a la Presidenza tali\u00e8na EUSALP 2022\u201d l \u00e0 record\u00e0
  l assessor trentin Mirko Bisesti, e chesta l \u00e9 \u201cna oportunit\u00e0 emportanta
  per ge f\u00e8r front, con soluzions spartides anter duc, ai gregn mudamenc a livel
  global che raprejenta na bela endesfida per l svilup sostenibol de nesc raions\u201d.
  Tel 2022 ge vegnar\u00e0 dat na atenzion particol\u00e8ra ai joegn: \u201cUn di
  obietives prinzip\u00e8i de noscia Presidenza \u2013 l \u00e0 despieg\u00e0 Bisesti
  \u2013 sar\u00e0 chel de ge d\u00e8r l\u00e8rga ai joegn, acioche sie i protagonis\u0107
  tel meter adum n model de svilup de la regions alpines, se pojan sun sia competenzes
  per vid\u00e8r i prozesc de mudazion ecologica e tecnologica, per piss\u00e8r a
  de neva manieres per viver, lur\u00e8r, produjer e smendr\u00e8r la desferenzes
  anter zentres e periferies, zit\u00e0 e campagna. Ge vel donca mior\u00e8r l azes
  ai servijes e la mobilit\u00e0 sostenibola, e meter en esser na rei de zentres e
  regions da mont \u201cascortes\u201d e port\u00e8r inant la inovazion e la digitalisazion
  che tole ite dut l teritorie\u201d. \u201cEusalp l \u00e9 na comunit\u00e0 de 7
  Stac e 48 Regions e l \u00e9 l fondament de la cooperazion europe\u00e8na. Ensema
  podon ru\u00e8r a na colaborazion am\u00f2 pi\u00f9 fona per mior\u00e8r la calit\u00e0
  de vita del raion alpin e scurt\u00e8r la distanza anter l zenter e la val\u00e8des.
  La endesfides les \u00e9 sacotantes e emportantes, ma son spervajo che ensema saron
  bogn de ge f\u00e8r front\u201d l \u00e0 dit am\u00f2 Bisesti.\\nTe sie videomessaje
  la Comissaria per la Politica Region\u00e8la, Elisa Ferreira, l\u2019\u00e0 envi\u00e0
  la Regions alpines a lur\u00e8r ensema per ge f\u00e8r front a la endesfides del
  mudament climatich, che mascimamenter se veit te la regions da mont, col tor desche
  ejempie i modie europe\u00e8gn per renforz\u00e8r la coejion politica.\\nLa roda
  de la presidenza desche simbol de la tradizions e del moviment te la \u00c8lpes\\nL
  secret\u00e8r del Stat franzous Jo\u00ebl Giraud l \u00e0 port\u00e0 dant i doi
  egn de la presidenza franzousa de EUSALP. \u201cI raions alpins l \u00e9 na gran
  familia\u201d l \u00e0 despieg\u00e0 Giraud. Per esser touc en conscidrazion a Bruxelles
  l \u00e9 de gran emportanza che i raions alpins i se emprev\u00e8le de na ousc dem\u00f2
  e de gra a EUSALP l \u00e9 possibol meter a jir chesta cooperazion. End\u00e8na
  l event Giraud l \u00e0 pass\u00e0 l testamonech al president Kompatscher e al assessor
  Bisesti ge dajan la roda de la presidenza, na roda slovena simbol de la tradizion
  alpina.\\nTe sie videomessaje l minister di Afares Fores\u0107 Di Maio l \u00e0
  rengrazi\u00e0 i presidenc del Sudtirol, e del Trentin e per aer \u201cenjign\u00e0
  te pech temp la priorit\u00e8des e l program de Presidenza\u201d declaran che \u201cla
  T\u00e8lia la se enjigna a se tor su chesta enc\u00e8ria con gaissa e col voler
  ge d\u00e8r n contribut concret a la cooperazion te la Region alpina\u201d. L minister
  l \u00e0 met\u00f9 ju cater ponc, che l \u00e9 la priorit\u00e8des de la presidenza
  tali\u00e8na. Dantdaldut, renforz\u00e8r la governance de la Strategia per la Macroregion
  alpina con chela de mior\u00e8r la capazit\u00e0 de azion de EUSALP. Dapod\u00f2,
  tor su con determinazion la endesfida per ge f\u00e8r front al mudament climatich
  soraldut a cajon del efet negatif che entravegn te chesta region respet a la media
  globala. Terz pont, ge d\u00e8r maor l\u00e8rga e valuta ai joegn sentadins de la
  Macroregion alpina coi meter tel zenter de la dezijions che rev\u00e8rda sie davegnir.
  Pont cater, tor su la oportunit\u00e8des che vegn ca da la programazion di fons
  EU 2021 \u2013 2027 e da la cordanza coi \u201cPiani Nazionali di Ripresa e Resilienza\u201d,
  per realis\u00e8r la priorit\u00e8des de la Strategia. Di Maio l \u00e0 tro\u00e0
  fora Nizza e Milan desche sentes de la Strategia.\\nEnrico Giovannini, minister
  de la Infrastrutures e de la Mobilit\u00e0 sostenibola, l \u00e0 rengrazi\u00e0
  en direta i presidenc Kompatscher e Fugatti per aer tout su la presidenza sotrissan
  che ge pervegn a l\u2019Europa, dessema con EUSALP e sie minister, promuover la
  mobilit\u00e0 sostenibola estra che potenzi\u00e8r la linia de la ferata e de la
  str\u00e8da del Brener.\\nPer Reinhold Messner ge vel limit\u00e8r l trasport individu\u00e8l\\nTe
  sie descors \u201cDie Alpen in Europa\u201d (La \u00c8lpes te l\u2019Europa), Reinold
  Messner l \u00e0 port\u00e0 dant la storia e la gran emportanza de la \u00c8lpes,
  desche habitat, desche raion economich, desche destinazion turistica e desche arena
  sportiva. Messner l \u00e0 sotriss\u00e0 che l raion alpin no l tol ite dem\u00f2
  i monc, ma ence la zit\u00e8des, che comporta efec negatives pi\u00f9 grieves per
  l ecosistem alpin. L \u00e0 rejon\u00e0 del fenomen de la migrazion da la zones
  rur\u00e8les a la zit\u00e8des desche n pericol, domanan am\u00f2 apede de stravard\u00e8r
  l paesaje, ence col descoman\u00e8r ai turis\u0107 de dur\u00e8r l auto da p\u00e8rt
  de na soula jent.\\nTe sia prejentazion Thomas Egger, Co-Leader del Grop de Azion
  EUSALP 5 e diretor de la Sociazion svizera per la regions da mont SAB, l \u00e0
  despieg\u00e0 en gener\u00e8l l lurier di Gropes de Azion EUSALP.\\nRaprejentanc
  de nonzech al desch toron de EUSALP\\nTinultima i raprejentanc politics de EUSALP
  i \u00e0 rejon\u00e0 en ocajion del desch toron: - G\u00fcnther Platter, governador
  del Tirol l \u00e0 sotriss\u00e0 l\u2019emportanza de la generazions joenes e del
  stravardament del tempram: \u201cLa regions alpines cogn ge f\u00e8r front a de
  gran endesfides, per chest l \u00e9 de gran emportanza che, soraldut end\u00e8na
  l an european de la joent\u00f9, idees e vijions neves envers l davegnir les rue
  a EUSALP da man di joegn. Am\u00f2 apede, end\u00e8na la presidenza del Tirol del
  Arge Alp de chest an, se cruziaron soraldut de la defendura del tempram e de la
  natura, de la mobilit\u00e0 sostenibola, la inovazion e la enrescida. Cognon ge
  d\u00e8r a la Regions na ousc che abie fazion e se port\u00e8r dant a na vida unit\u00e8ra
  dedant ai goergn a al\u2019UE\u201d. L europarlament\u00e8r sudtiroleis Herbert
  Dorfmann l \u00e0 cont\u00e0 de la percezion de EUSALP tel Parlament european e
  l \u00e0 rejon\u00e0 de la metuda en doura de la tematiches EUSALP a livel european.
  Ira Carabetchi, raprejentanta del Consei di Joegn EUSALP del Sudtirol, l \u00e0
  rejon\u00e0 de la spetadives su EUSALP, de la partezipazion del Consei di Joegn
  e de la condizions che cogn esser acioche i joegn reste te la Region alpina. \u00c0
  tout p\u00e8rt ence Raffaele Cattaneo, assessor al Ambient e al Clima de la Region
  Lombardia e Barbara Zilli, assessora a la Finanzes de la Region del Friul.\\nMelanie
  Huml, Ministra di Afares europe\u00e8gn e internazionai de la Baviera, con coleament
  online, l \u00e0 record\u00e0 l valor enjont\u00e0 de EUSALP e de la Strategia per
  la Region del Danubie se pojan sul coordenament de la ressorses finanziaries.\\nL
  delegat per la val\u00e8des da mont e member del Consei region\u00e8l Auvergne-Rhone
  Alpes, Maurice Pannekoucke, ence el tras coleament online, l \u00e0 met\u00f9 al
  luster i suzesc e i ostacoi de la presidenza EUSALP spezifican la priorit\u00e8des
  che la strategia la dovessa port\u00e8r inant.\\nTraduzion di Servijes Linguistics
  e Cultur\u00e8i del Comun general de Fascia\\n(Traduzione a cura dei Servizi Linguistici
