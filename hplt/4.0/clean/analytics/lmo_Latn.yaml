  de Jamuna e la sa tr\u00e0 deent in del Gange, un''oltra la mantegn ul n\u00f2mm
  de Brahmaputra e la c\u00fcrva in direzziun s\u00fcdest. In t\u00fctt i modi i d\u00fc
  broch sa retruven un quaj chilometer dopu e sa tran deent insema in del Gulf del
  Bengala cunt un delta ca l''\u00e8 ul p\u00fcssee gross al muunt.\\nUl fi\u00fcmm,
  u mej la s\u00f2 part bassa, l''\u00e8 cunsiderada sacra daj Indu, anca se t\u00fctt
