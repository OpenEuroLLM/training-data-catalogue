  maar. Cum\u00e9 ca ul fi\u00fcmm al v\u00e0 f\u00f6ra dal Tibet, al sa sbassa de
  b\u00f2tt e in del staat de l''Arunachal Pradesh, dopu ca l''a ricev\u00fc\u00fc
  d\u00fc afl\u00fceent impurtaant (Dibang e Lohit) al sa slarga un bel pu'' (in d''un
  quaj t\u00f2cch al riva a v\u00e8ss larch 10 km) e al t\u00f6\u00f6 ul n\u00f2mm
  de Brahmaputra.\\nUna v\u00f6lta c''al riva in Bangladesh al sa spartiss in d\u00fc
