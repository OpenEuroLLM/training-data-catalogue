  Saus Pasifik.\\nMipela i stretim na putim pinis ol foto na infomesen long ol samting\\nbilong
  Koleksen i go long kompiuta detabes em Minpaku miusiam i\\nlukautim. Yu ken yusim
  Kontak fom bilong mipela bilong save moa long\\ndispela samting. Shuzo Ishimori
