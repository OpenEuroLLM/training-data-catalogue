  olsem Brown, husat i putim lekmak long histori.\"", "\"NESENEL EMTV NIUS HET TOKTOK
  LONG TOK PISIN:\\n16-pla asailam sika husat i stap long Mosbi, i tok wari i save
  kilim ol na tingting blong ol i no moa stret, long wanem ol i no save bai sindaun
  blong ol i orait, o nogat.\\nPolis Minista, JELTA WONG, i tok em bai strong yet
  long i mas i gat wok painimaut long watpo polis bareks long Bumbu long Lae, i kisim
  longpla taim tumas long pinisim.\\nNA LONG SPOTS NIUS,\\nNiupla rikrut blong SP
  PNG Hunters, em EPEL KAPINIAS. Em i gat 20 krismas, na i tok em i redi long Kwinslen
  Intras Supa Kap sisen.\"", "\"Wanpela koros namel long wanpela famili blong Aborigine
  na Pacific Island ibin kamap ken long Woodridge,saut blong Brisbane.\\nPolis riot
  skuad ibin go kamap long brukim dispela tupela grup taim wanpela pait ibin kamap
  samting olsem 5 kilok long Monday apinun\\nNa inogat arrest ibin kamap\\nWanpela
  koros ibin kamap namel long ol long wiken taim wanpela pait ibin kamap namel long
  famili blong tupela grup long Douglas Street na polis ibin arrestim tupla man.\\nPipol
  istap long dispela hap ibin tok ol bel koros namel long dispela grup ibin stap longpela
  taim nau stat long taim Richard Saunders,husait i wanpela Aborigine ibin dai long
  2008.\\nNa dispela koros blong ol igo bikpela ken long las mun bihain long daia
  blong wanpela yangpela boi Jackson Doolan,em train ibin kilim em bihain long em
  ibin stap insait long ol koros wantaim wanpela grup blong ol man long platform.\\nPolis
  bai holim toktok wantaim ol lida blong komuniti olsem wanpela wei long daunim dispela
  heve na oli tok polis patrol long dispela eria bai igo bikpela.\\nSuperintendent
  Noel Powers itok planti ol lokel pipol ilaikim gutpela sidaun na polis nau bai mekim
  olgeta samting oli ken long daunim dispela ol koros.\\n\\\"We work very closely
  with the access services, with all the respective agencies who deal with these areas,\\\"
  he said.\\n\\\"We''ve got a very good working relationship with these people to
  try to stop any simmering tensions that do come to the fore.\\n\\\"Unfortunately
  this one seems to be ongoing and we really are trying to work hard with the elders
  of both communities to try and get on top of it.\\\"\\nOl lida blong Aborgine ibin
  tok oli wari long dispela ol tingting nogut iwok long stap yet.\\nNa Queeland Premia
  Campbell Newman itok ol pait na trabel olsem inogat nid long en.\\n\\\"I just ask
  people to think about just cooling it down a bit.\\\"\"", "\"Wik\\nWik em i taim
  i gat seven de. Wanpela yia i gat 52 wik na wanpela o tupela de.\\nLong Tok Inglis,
  nem bilong ol de bilong wik i kam long got bilong pipel Nos, tasol sarere i kam
  long Saten, i got bilong pipel Rom. Long Tok Pisin, sampela nem bilong de i wankain
  nem long Tok Inglis, tasol nem bilong Trinde na Fonde i kamap bilong namba.\\nNem
  bilong sarere na sande wantaim i wiken.\\nLukim tu[senisim | edit source]\\nArapela
  websait[senisim | edit source]\\n- The Mysterious 7-Day Cycle (history with Christian
  editorial)\\n- The Week (part of Claus T\u00f8ndering''s Calendar FAQ)\\n(Dispela
  pes Wik em i liklik tumas. Yu inap raitim moa sapos yu laik halivim Wikipedia. Hau?)\"",
  "\"Supreme Court blong Vanuatu i aste tokaut long disisan blongen olsem foma praim
  minista, Charlot Salwai em ibin gilty long perjury or olsem em ibin giamanim kot.\\nNa
  kot bai tokaut long sentence or mekim save blongen long namba 3 day blong February,
  2021.\\nDispela keis we ibin karamapim tu ol sas olsem korapsen na bribery we former
  Opposition Leader husat inau Deputy Praim Minista, Ishmael Kalsakau em ibin bringim
  igo long kot.\\nKeis ia ibin kamap bihaim sampela tokwin long taim blong muvim wanpela
  motion blong no-confidence long Mr Salwai olsem Praim Minista long 2016.\\nSupreme
  Court ibin rausim pinis ol bribery na korapsen sas agensim Mr Salwai na sampela
  moa memba, tasol kot itok Mr Salwai i gilty long perjury.\\nDr Tess Newton Cain
  em Project Leader blong Pacific Hub long Griffith Asia Institute long Brisbane na
  bai em tok klia moa long wanem we ibin kamap long kot.\\nPlay\\nSpace to play or
  pause, M to mute, left and right arrows to seek, up and down arrows for volume.\\nSpace
  to play or pause, M to mute, left and right arrows to seek, up and down arrows for
  volume.\"", "\"\\\"Som det st\u00e5r skrevet: Det finnes ikke \u00e9n rettferdig,
  ikke en eneste\\\" Romerne 3:10\\n\\\"Alle har syndet og st\u00e5r uten \u00e6re
  for Gud.\\\" Romerne 3:23\\n\\\"For syndens l\u00f8nn er d\u00f8den, men Guds n\u00e5degave
  er evig liv i Kristus Jesus, v\u00e5r Herre.\\\" Romerne 6:23\\n\\\"Men Gud viser
  sin kj\u00e6rlighet til oss ved at Kristus d\u00f8de for oss mens vi enn\u00e5 var
  syndere.\\\" Romerne 5:8\\n\\\"For s\u00e5 h\u00f8yt har Gud elsket verden, at Han
  gav Sin S\u00f8nn, Den Enb\u00e5rne, for at hver den som tror p\u00e5 Ham, ikke
  skal g\u00e5 fortapt, men ha evig liv.\\\" Johannes 3:16\\n\\\"Dersom vi bekjenner
  v\u00e5re synder, er Han trofast og rettferdig, s\u00e5 Han forlater oss syndene
  og renser oss fra all urettferdighet.\\\" Johannes\u2019 f\u00f8rste brev 1:9\\n\\\"For
  dersom du med din munn bekjenner at Jesus er Herre, og i ditt hjerte tror at Gud
  oppreiste Ham fra de d\u00f8de, da skal du bli frelst; for med hjertet tror en til
  rettferdighet, og med munnen bekjenner en til frelse.\\\" Romerne 10:9\u201310\\n\\\"Men
  alle dem som tok imot Ham, dem gav Han rett til \u00e5 bli Guds barn, dem som tror
  p\u00e5 Hans navn.\\\" Johannes 1:12\\n\\\"Jesus sier til ham: Jeg er veien og sannheten
  og livet; ingen kommer til Faderen uten ved Meg.\\\" Johannes 14:6\\n\\\"For likesom
  Faderen oppvekker de d\u00f8de og gj\u00f8r levende, slik gj\u00f8r ogs\u00e5 S\u00f8nnen
  levende dem Han vil.\\\" Johannes 5:21\\n\\\"For av n\u00e5de er dere frelst, ved
  tro. Og det ikke av dere selv, det er Guds gave. Det er ikke av gjerninger, for
  at ikke noen skal rose seg.\\\" Efeserne 2:8\u20139\\n\\\"Jeg kunngj\u00f8r dere,
  br\u00f8dre, det evangelium som jeg forkynte dere, det som dere ogs\u00e5 tok imot,
  som dere ogs\u00e5 st\u00e5r fast i. (...) For jeg overgav dere blant de f\u00f8rste
  ting det som jeg selv mottok: At Kristus d\u00f8de for v\u00e5re synder etter Skriftene,
  og at Han ble begravet, og at Han oppstod p\u00e5 den tredje dag etter Skriftene.\\\"
  Paulus\u2019 f\u00f8rste brev til korinterne 15:1,3\u20134\\n\\\"Bekjenn derfor
  deres synder for hverandre og be for hverandre, for at dere kan bli helbredet! En
  rettferdig manns b\u00f8nn har stor kraft og virkning.\\\" Jakobs brev 5:16\\n\\\"Dere
  elskede! La oss elske hverandre! For kj\u00e6rligheten er av Gud, og hver den som
  elsker, er f\u00f8dt av Gud og kjenner Gud. Den som ikke elsker, kjenner ikke Gud,
  for Gud er kj\u00e6rlighet.\\\" Johannes\u2019 f\u00f8rste brev 4:7\u20138\\n\\\"S\u00e5
  m\u00e5 da dere, elskede, som forut vet dette, ta dere i vare s\u00e5 dere ikke
  blir revet med av de ugudeliges villfarelse og falle ut av deres egen faste stand.
  Men voks i n\u00e5de og kjennskap til v\u00e5r Herre og frelser Jesus Kristus! Ham
  v\u00e6re \u00e6ren b\u00e5de n\u00e5 og til evig tid! Amen.\\\" Peters andre brev
  3:17\u201318\\nPren Bilong Mi:Mi laik askim yu long dispela wanpela, nambawan askim,
  em i winim olgeta arapela askim bilong laip. Amamas bilong yu, o hevi bilong yu
  oltaim oltaim, bai I stap long bekim bilong yu nau. Askim em I olsem:God i bin kisim
  bek yu o nogat? Dispela askim i no askim long ol gutpela pasin bilong yu, o sapos
  yu memba bilong sios, nogat. Askim, em i olsem:God i kisim bek yu pinis o nogat?
  Yu save tru tru olsem taim yu dai, bai yu go long heven o nogat?\\nGod i tok: sapos
  yu laik i go long heven, yu mas kamap nupela gen [olsem pikinini]. Long Jon 3:7,
  Jisas i bin tokim Nikodimas olsem,\u201c . . . Yu mas kamap nupela gen[olsem pikinini].\u201d\\nLong
  Baibel, God i givim yumi rot bilongkamap nupela gen, o, rot bilong kisim bek manmeri.
  Dispela rot bilong God i isi. God inapkisim bekyu tude. Olsem wanem?\\nPren bilong
  mi, pastaim, yu mas luksave olsem,Yu sinman tru. Long wanem, Baibel I tok olsem,\u201c
  . . . olgetamanmerii bin mekim sin naoli kamap sot longmak bilongglori bilong God\u201d(Rom
  3:23).\\nDispela pasin bilong mekimsin i kotim yu pinis na yu mas i dai. Baibel
  i tok gen olsem,\u201c . . . pe bilong sin em i dai . . . \u201d(Rom 6:23).Dispela
  dai bai i kisim sinman i go long ples hel (hul paia), na em bai i stap longwe long
  God inap oltaim oltaim.\\nBaibel i tok gen olsem,\u201c . . . God i makim wanpela
  taim bilong ol man i mas i dai. Na bihain long dispela i gat kot\u201d(Hibru 9:27).\\nTasol
  Papa God i laikim yu tumasna Em I givim dispela, wanpela Pikinini tasol bilong Em,
  Jisas, bilong karim sin bilong yu na I dai long ples bilong yu(long diwai kros).
  Tok bilong Em yet i tok,\u201c . . . dispela Man i no bin save long sin,God i bin
  mekim Emistap sinman tru bilonghelpimyumi. Olsem na yumi ken kamap stretpela pasin
  bilong God insait long Kraist\u201d(2 Korin 5:21).\\nJisas i bin kapsaitim blut
  bilong Em na Em i dai. Baibel i tok,\u201cBlut i save givim laip long olgeta man
  . . . \u201d(Wok Pris 17:11).\\n\u201c . . . Na sapos blut i no kapsait, i no gat
  rot bilong tekewesin\u201d(Hibru 9:22).\\n\u201cTasol God i soim Em i laikim yumi
  tru olsem, taim yumi stap sinman yet,Kraist i bin i dai bilong kisim bek yumi\u201d(Rom.
  5:8).\\nGod i tok olsem Em i bin putim ol sin bilong yu na ol sin bilong mi antap
  long Jisas na Em (Jisas) i bin dai long ples bilong yu na mi bilong kisim bek yumi.
  Em i bin kamap sinman tru bilong kisim ples bilong yumi long diwai kros. Dispela
  em i tru. God i no inap giaman. Dispela samting God i mekim bilong yumi, yumi no
  inap tru i save long en, tasol i tru Em i mekim.\\nPren bilong mi, God\u201c . .
  . Em i givim strongpela tok long olgeta man long olgeta hap graun olsem, ol i mas
  tanim bel\u201d(Aposel 17:30).\\nDispela pasin bilong tanim bel em i olsem pasin
  bilong senisim tingting. Yumi mas I wanbel wantaim God olsem yumi wanwan man em
  i sinman. Tu, yumi mas wanbel wantaim God olsem Jisas i bin mekim wok antap long
  diwai kros bilong kisim bek yumi.\\nLong Aposel 16:30-31, man bilong lukautim kalabus
  long Filipai i bin askim Pol na Silas,\u201c . . . Tupela bikpela man, mi mas mekim
  wanem samtingnabaiGod i kisim bek mi? Na tupela i tok,Yumas bilip long Bikpela Jisas
  Kraist na bai God i kisim bek yu . . . \u201d\\nBilip tasol long Em olsem man husat
  i bin kisim sin bilong yu, na i dai long ples bilong yu. Bilip olsem ol i bin planim
  Em long matmat na God i bin kirapim bek Em.\\nDispela kirap bek bilong Jisas long
  matmat i strongpela mak tru bilong strongim bilip bilong ol manmeri husat i bilip
  long Em. Na ol i ken save olsem bai ol i kisim laip i stap gut oltaim oltaim, sapos
  ol i bilip long Em olsem Em wanpela tasol i Man bilong kisim bek ol.\\n\u201cTasol
  olgeta man i kisim Em, Em i givim namba long ol, bai ol i ken kamap ol pikinini
  man bilong God. Yes long ol man i bilip long nem bilong Em\u201d(Jon 1:12).\\nBaibel
  i tok,\u201cLong wanem husat i singaut long nem bilong Bikpela, bai God i kisim
  bek em\u201d(Rom 10:13).\\nDispela hap tok \u201chusat\u201d i karamapim yu, na
  dispela hap tok, \u201cbai i kisim bek,\u201d em i no tok \u2018ating\u2019 o, \u2018em
  inap\u2019, nogat. Dispela hap tok i tok stret olsem God bai i kisim bek yu.\\nTru
  tumas, yu yet i save olsem yu sinman. Nau tasol, long hap yu stap long en, yu ken
  senisim tingting bilong yu [tanim bel] na litimapim bel bilong yu i go long God
  long prea.\\nLong Luk 18:13, dispela sinman i bin prea olsem,\u201c . . . God,Yumas
  sori long mi, mi wanpela sinman.\u201dYu ken prea wankain olsem:\\n\u201cO, God,
  mi save olsem mi sinman. Nau mi bilip olsem Jisas i bin kisim ples bilong mi long
  diwai kros. Mi bilip tu olsem blut bilong Em i bin kapsait bilong mi; na dai, na
  matmat, na kirap bek bilong Em tu, Em i bin mekim bilong helpim mi. Olsem na nau
  mi kisim Em olsem Man bilong kisim bek mi. Tenkyu long lusim olgeta sin bilong mi,
  na givim mi dispela presen, em i laip i stap gut oltaim oltaim, long wanem yu God
  bilong marimari tru. Amen.\u201d\\nNau tasol yu mas bilipim tok bilong God na kisim
  dispela laip i stap gut oltaim oltaim. Bilip na bai God i kisim bek yu. I nogat
  wanpela sios, o arapela lain, o ol gutpela wok yu wokim inap kisim bek yu.Tingim,
  God tasol i save kisim bek man. Em tasol!\\nDispela rot bilong God bilong kisim
  bek manmeri long pe bilong sin i olsem: Yu sinman (meri). Olsem na sapos yu no bilip
  long Jisas, Husat i bin dai long diwai kros bilong kisim ples bilong yu, bihain
  long dai bilong yu, bai yu go long hel (hul paia) na stap oltaim oltaim. Tasol sapos
  yu bilip long Jisas, Em i bin dai, na ol i planim Em, na Husat i bin kirap bek long
  matmat bilong kisim bek yu, bai God i lusim ol sin bilong yu na bai Em I givim presen
  nating long yu;Em laip i stap gut oltaim oltaim, long bilip bilong yu tasol.\\nAting
  bai yu tok, \u201cTru tumas, dispela em I isi tumas.\u201d Yes, em i isi! Na em
  i tok tru bilong Baibel. Em i we (rot) bilong God bilong kisim bek manmeri.Pren
  bilong mi, yu mas bilip long Jisas na kisim Em olsem Em wanpela tasol inap long
  kisim bek yu.\\nSapos dispela rot bilong God i no klia tumas, mi laik bai yu ritim
  gen dispela liklik hap pepa. Yu noken malolo long ritim dispela liklik hap pepa
  inap long taim dispela toktok I klia long yu. Yu mas save olsem, tewel (soul) bilong
  yu i dia tumas na em i winim ol arapela samting bilong dispela graun.\\nBaibel i
  tok,\u201c . . . sapos wanpela man I kisim olgeta samting bilong dispela graun na
  lusim tewel bilong em yet, bai dispela i helpim em olsem wanem?\u201d(Mak 8:36).\\nYu
  mas save tru olsem God i kisim bek yu pinis. Sapos tewel (soul) bilong yu i lus
  olgeta,bai yu i no inap i go long heven. Olgeta samting yu wok hat long en bai i
  lus wantaim tu. Mi askim yu long bel bilong mi tru,Larim God i kisim bek yu nau
  tasol.\\nPawa bilong God yet bai i kisim bek yu, na lukautim yu, na mekim yu i stap
  strongpela Kristen. Long wanem Baibel i tok,\\n\u201c . . . I no gat wanpela traim
  i bin kamap long yupela, na dispela i narakain long ol traim i save kamap longolgeta
  man. Nogat. Tasol Godistap Man yu inap bilip long Em.NaEm i no larim wanpela traim
  i kamap long yupela inap long winim strong bilong yupela. Tasol baiEmi wokim rot,
  baiyupela i kenranawe long dispela traim, bai yupela inap sanap strong longen\u201d(1
  Korin 10:13).\\nYu noken bilip long laik bilong yu yet, long wanem ol laik bilong
  man i save senis klostu klostu. Bilip bilong yu i mas sanap long ol promis bilong
  God. Ol promis bilong God i no save senis. Bihain long taim God I kisim bek yu i
  gattripela samtingyu mas wokim olgeta de bilong kamap strong long laip bilong yu
  wantaim God.Beten\u2013 yu toktok long God.Ritim Baibelbilong yu \u2013 God I toktok
  long yu.Telimautim Gutnius\u2013 yu tokim ol arapela long God.\\nBilong soim bilip
  bilong yu long ol arapela, na soim olsem yu bihainim tok bilong Bikpela Jisas Krais,yu
  mas kisim baptais. Kwiktaim tru, yu mas go lotu long sios we ol brata na susa i
  bilip tru na bihainim tok bilong God.\u201cOlsem na yu no ken sem long testimony
  bilong Bikpela bilong yumi . . . \u201d(2 Tim. 1:8).\\nBaibel i tok,\u201cOlsem
  na wanem man i autimnem bilongMi long ai bilong ol manmeri, bai Mi tu autimnem bilongen
  long ai bilong Papa bilong Mi i stap long heven.\u201d(Matyu 10:32).\\nSampela hap
  tok long Baibel bilong helpim yu\\nJon 3:16, 1 Pita 2:24, Aisaia 53:6, Jems 1:15,
  Rom 10:9-10, Efesas 2:8-9, Gutpela Sindaun 27:1, 1 Korin 15:3-4, Jon 10:27-30, 1
  Jon 5:13,\\nSapos yu bin tanim bel long taim yu ritim dispela Gutnius pas, toksave
  long mipela, bai mipela tu i amamas wantaim yu.\\nCopyright: Robert Ford Porter,
