sample: '["\"Kirap long taim ol i bin opim the National Museum of Ethnology long\\nyia
  1977, dispela miusiam i save mekim bikpela wok long kisim save long\\ni stap bilong
  ol man long Oseania, na lukautim gut ol samting bilong\\ndispela hap. Long yia 1985-86,
  dispela miusiam i bin baim George Brown\\nKoleksen, em ol samting ol asples i save
  yusim long sindaun bilong ol,\\nlong the University of Newcastle on Tyne, long Inglan,
  UK. George\\nBrown, em i wanpela pasto na saveman, i bin mekim wok misineri bilong\\nlotu
  Mesodis long ol Pasifik Ailan, na long wankain taim, em i mekim\\nbikpela hatwok
  long bungim ol samting inap planti yia, na long dispela\\nrot, dispela koleksen
  i bin kamap. Dispela Koleksen i bikpela samting\\nlong sait bilong histori na kalsa.
  Dispela koleksen i bikpela samting\\ntu long narapela samting, bikos em i kamapim
  ples klia ol samting\\nbilong sindaun bilong ol asples na bilong wok misin em Mr.
  Brown i bin\\nraitim long ol buk bilong em. Na, em i bikpela sating tu long planti\\nmanmeri
  bilong ol Pasifik\\nailan bikos ol i ken lukluk na kisim ol save long ol sindaun
  bilong ol\\ntumbuna bilong ol yet.\\nPeter Matthews na Isao Hayashi\\nNational Museum
  of Ethnology, Osaka, Japan.\"", "\"Mipela i amamas long singautim yu long kam tua
  long ol ofis na ol faktori bilong prinim ol buk na magasin. Kisim save long ples
  na taim ol tua i kamap long en.\\nVenezuela\\nAv. Intercomunal La Victoria-El Consejo\\nFrente
  a La Mora II\\nLA VICTORIA 2121 ESTADO ARAGUA\\nVENEZUELA\\n+58 244-400-5000\\nOl
  tua\\nMande i go Fraide\\n8:00 a.m. i go 11:00 a.m. na 1:00 p.m. i go 4:00 p.m.\\nLongpela
  bilong tua em 1 aua\\nWok ol i mekim\\nTanim ol buk na nius bilong Baibel long tokples
  Sain Bilong Venezuela. Salim i go inap 27 ton buk na nius long 29 tokples long olgeta
  mun. Lukautim wok bilong winim 125,000 Witnes Bilong Jehova long Venezuela.\"",
  "\"MIRRORS: The Aborigine Poetry of Eldred Van-Ooy by Justin Spring - HTML preview\\nDownload
  the book in PDF, ePub, Kindle for a complete version.\\nMi saevi bainbai yu wetim
  long mi long wanples,\\nhed bilong yu em i-stapim haf long haus bilong rod ayan,\\nhors
  i-stap baek long yu, em i-saekim yu long dor.\\nNa olsem oltaim,\\ntaim mi helo
  long yu, mi singawtim yu \\\"Uncle\\\",\\nyu tokim mi yu no gat samting.\\nNa taim
  mi sidawn long haefsaid long yu,\\ngo haws bilong yu,\\nlaen go awtsaid long mifela
  olsem tudark rivar,\\nna hors lait long munmun long baeksaid,\\nmi no hirim singawt,
  tasol\\nsingawt long mifela i-stap.\\nNa bainbai taim fair bilong haus kamap\\nolsem
  longwe starstar\\nmi hirim tasol singawt bilong yu\\nem i-kamap na fal.\\nYu singim
  singawt bilong yu, em i-no gat frant, i-no gat ars.\\nYet mi kichim tok long singawt
  yu sing.\\nNa mi sing wantaim long yu.\\nLong wonam mi sing? Mi no saevi.\\nNa mi
  sing tu.\\nJAN 27, 1939\"", "\"Prea (4)\\nBikpela toktok mi laik mekim long dispela
  stadi namba 4 i olsem\u2026.\\nTaim yumi prea, yumi mas trastim God.\\nNa mi no
  minim olsem, yu mas trastim God long givim ol samting long yu olsem yu askim long
  Em. Nogat. Mi no tok long dispela samting. Yu save, sampela manmeri i tok olsem,
  \u201cTaim yu askim God long kisim sampela samting, orait yu mas bilip strong long
  bel bilong yu bai God i givim dispela samting long yu, na sapos yu bilip strong
  olsem, orait bai yu kisim ol dispela samting yu laik kisim. Na sapos yu no bilip
  strong olsem, orait yu no inap kisim.\u201d\\nMi tok pinis, mi no tok long dispela
  kain samting. Nogat. Toktok bilong mi i go long narapela sait olgeta.\\nMi tok olsem\u2026.\\nTaim
  yu prea yu mas trastim God long wokim rait disisen long askim bilong yu.\\nSampela
  taim yu bai askim God long givim sampela samting long yu. Na sampela taim God i
  ken i givim dispela samting long yu, tasol sampela taim God i no inap givim dispela
  samting long yu. Na sampela taim Em i ken i givim narapela samting olgeta long yu,
  samting yu no askim Em long en.\\nSampela taim yu ken i askim God long wokim ol
  sampela samting bilong yu. Na sampela taim God i ken i wokim ol samting olsem yu
  askim Em na sampela taim Em i no inap wokim dispela samting olsem yu askim Em. Na
  sampela taim Em i ken i wokim narapela samting olgeta long yu.\\nMi save prea long
  God i ken i lukautim mi na femili bilong mi taim mipela raun long rot na raun long
  taun. Mipela askim God long rausim ol raskol na ol i no ken i holim mipela na givim
  pret long mipela o bagarapim mipela. Na planti taim mipela save raun fri. Tasol
  sampela taim God i putim raskol i stap bilong wetim mipela na ol i hansapim mipela
  na mekim nogut long mipela. Olsem na, mi tok pinis, sampela taim God i no save mekim
  ol samting olsem yumi askim Em.\\nMi save long wanpela meri, em i prea na askim
  God long givim gutpela man long em na kamapim gutpela marit long marit bilong em.
  Tasol, man bilong em i mekim pasin pamuk na kisim narapela meri na em i save hambak
  long dispela meri. Yu save, God i no mekim ol samting olsem meri i bin askim Em.\\nNa
  olsem wanem? Olsem wanem, sampela taim God i no mekim ol samting olsem yumi askim
  Em? Olsem wanem God i ken i mekim ol narapela kain samting olgeta long yumi?\\nYumi
  mas klia olsem\u2026.\\nGod i no save wok bilong givim olgeta samting yumi askim
  long Em. Nogat. God i save wok long kamapim ol samting i gutpela tasol \u2013 ol
  samting i gutpela long laip bilong yumi na i gutpela bilong kingdom bilong Em.\\nLong
  Rom 8:28 i gat dispela toktok i stap\u2026.\\n28\u2026..God i save bosim olgeta
  samting bilong mekim gut long ol manmeri i lavim Em.\\nGod i save yusim pawa bilong
  Em bilong mekim gut long ol manmeri i lavim Em. Yu save, God i no tingting long
  givim ol samting yumi save askim long Em. Nogat. God Em tingting tasol long yusim
  pawa bilong Em bilong mekim gut long ol manmeri i lavim Em.\\nGod Em i dispela kain
  God \u2013 God Em i God bilong mekim gut long ol lain manmeri bilong Em. God i gat
  bikpela tingting long wokim ol samting i gutpela long laip bilong ol manmeri i lavim
  Em na i gutpela bilong kingdom bilong Em.\\nDispela em i wei bilong God \u2013 Em
  i save bosim na kontrolim olgeta samting bilong kamapim ol gutpela samting long
  yumi manmeri Em i bin makim na pasim long Krais.\\nEm olsem na sampela taim yumi
  askim God long wanpela samting o yumi askim God long wokim sampela samting bilong
  yumi, tasol God i gat narapela tingting \u2013 Em i laik wokim narapela samting
  long yumi bikos dispela narapela samting i gutpela moa long yumi na i winim ol sampela
  samting yumi bin askim long Em.\\nMi givim wanpela eksempel long yupela \u2013 bai
  mi stori long samting i bin kamap long aposel Pol.\\nOl birua bilong gutnius, ol
  birua bilong Pol, ol i arestim Pol na ol i salim em i go long bikpela taun Rom we
  ol i kalabusim em. Ol i kalabusim em long wanpela haus bilong king Sisar, na ol
  sikuriti lain bilong Sisar i sikuriti long Pol.\\nNa planti bilong ol lain bilong
  Pol ol i tingim olsem, Pol i stap long kalabus, olsem na, gutnius bai kalabus tu
  na wok bilong God i no inap i stap gut. Ol i tingim olsem dispela i no gutpela na
  ol i prea long God, bai God i ken i lusim Pol long kalabus na gutnius bai ron fri
  na wok bilong God bai i stap strong. Em olsem na ol i tingim olsem fridom bilong
  Pol i gutpela bilong Pol na i gutpela bilong wok bilong kingdom bilong God tu.\\nTasol
  God i gat narapela tingting. Olsem na God i larim Pol i stap long kalabus. Long
  wanem? God i larim Pol i stap long kalabus bikos God i laik mekim wok i gutpela
  moa yet. Harim tok bilong Pol long Filipai 1:12-14.\\n12Ol brata, mi laik bai yupela
  i save, dispela samting i bin kamap long mi em i no pasim gutnius. Nogat. Em i mekim
  gutnius i kamap strong. 13Olsem na, olgeta lain soldia bilong lukautim haus bilong
  Sisar, na olgeta narapela man tu, ol i save pinis olsem, mi stap long kalabus bikos
  mi pas long Krais. 14Na long dispela samting planti manmeri bilong BIKPELA i kisim
  strong na ol i raun na autim tok bilong God na ol i no pret nau.\\nYu klia? God
  i no rausim Pol long kalabus bikos God i laik ol sikuriti bilong kalabus i mas harim
  gutnius bilong Jisas na tanim bel na kam insait long femili bilong God \u2013 Na
  Em i laik Sisar yet i mas harim gutnius.\\nTaim Pol i stap insait long kalabus bilong
  Sisar, orait em i tokim olgeta manmeri long wok bilong Krais, na sampela bilong
  ol i tanim bel.\\nNa tu, taim ol narapela Kristen brata i lukim dispela wok bilong
  God long hauslain bilong Sisar, orait dispela i strongim ol na ol i strong moa yet
  long raun na autim tok bilong God. Ol i no pret moa long ol birua i laik putim ol
  long kalabus.\\nEm olsem na God i kamapim ol samting i gutpela moa taim Em i putim
  Pol long kalabus na Em i larim Pol i stap long kalabus.\\nYu save, sampela taim
  yumi bai askim God long wokim wanpela samting, tasol God bai wokim narapela samting
  bikos Em i laik wokim sampela samting i gutpela moa bilong yumi na bilong ol lain
  manmeri bilong Em. Em olsem na, long dispela as, yumi mas trastim God long wokim
  rait disisen long olgeta askim bilong yumi.\\nTaim yumi prea, orait yumi mas trastim
  God long ensaim prea bilong yumi long gutpela tingting na gutpela save bilong Em
  yet. Sampela taim God bai givim ol samting na wokim ol samting olsem yumi askim
  Em bikos Em i tingim dispela samting i gutpela. Tasol sampela taim Em bai givim
  na wokim narapela samting olgeta bikos Em i tingim dispela narapela samting i gutpela
  moa. Tasol wanem samting God i laik givim na wanem samting God i laik wokim, orait
  yumi pikinini bilong Em, yumi mas trastim God long wokim olgeta samting long gutpela
  wei tasol.\\nYumi mas amamas long God i wokim ol samting i gutpela moa long yumi
  na i gutpela moa long kingdom bilong Em.\\nYumi no ken i bel hat na straik long
  God olsem ol sampela manmeri i save mekim \u2013 em ol manmeri i no save long God.\\nMi
  bin harim wanpela stori \u2013 em i stori bilong wanpela pasta bilong sios. Dispela
  pasta, em i kisim bikpela sik na em i prea i go i go long God, bai God i ken i rausim
  dispela sik na em i ken i stap gut. Em i prea i go i go, tasol sik i stap i go i
  go yet. God i no rausim sik bilong em. Em olsem na pasta em i bel hat long God bikos
  God i no laik harim tok bilong em. Em i bel hat na em i tok swea long God na em
  i lusim bilip bilong em.\\nYu save, dispela pasta em i no trastim God long wokim
  rait disisen long em. Em i no trastim wei bilong God. Em i no save long wei bilong
  God, olsem na em i bel hat na em i straik long God.\\nLong bel bilong em ating dispela
  pasta man i kisim kain tingting olsem, \u201cSapos God Yu no givim samting olsem
  mi askim Yu, orait mi no inap pas long Yu moa, bai mi lusim Yu na mi stap nating
  \u2013 mi no laik Yu kisim sampela tingting bilong Yu yet, nogat, yu jas wokim samting
  olsem mi askim Yu, em tasol.\u201d\\nDispela pasta man em i no save long wei bilong
  God. Em i no laik bihainim wei bilong God na em i no laik trastim wei bilong God.
  Nogat. Em i laik God i bihainim wei bilong em tasol!\\nYumi lain manmeri bilong
  Jisas, plis yumi no ken i mekim pasin olsem dispela man. Yumi mas trastim God long
  wokim pasin i gutpela moa long yumi, maski dispela samting i givim amamas long yumi
  o em i givim hevi long yumi.\\nSampela taim God bai givim pen long yumi, tasol dispela
  samting tu em i gutpela moa long yumi na i gutpela moa long kingdom bilong God.\\nTingim
  aposel Pol. God i bin givim wanpela hevi long em. Baibel i tok, dispela hevi em
  bilong stopim Pol long mekim bikhet pasin. Yu tingim \u2013 aposel Pol em i wanpela
  bikpela wokman stret bilong God, tasol God i givim wanpela hevi long em bilong stopim
  em long mekim bikhet pasin! Lukim 2 Korin 12:7-10.\\n7God i bin soim mi ol gutpela
  gutpela samting tru, tasol nogut mi bikhet long dispela samting. Olsem na Em i givim
  wanpela sik long mi, i olsem nil i sutim bodi bilong mi. Dispela samting i wok olsem
  wanpela wokboi bilong Satan na i givim bikpela hevi stret long mi. 83-pela taim
  mi prea long BIKPELA long rausim dispela samting long mi. 9Tasol, Em i tokim mi
  olsem, \u201cGrasia bilong Mi em i inap bilong yu. Long wanem, strong bilong Mi
  i ken i wok moa taim strong bilong man i go daun.\u201d Olsem na, mi ken i amamas
  long ol samting long laip bilong mi i slekim strong bilong mi bikos taim mi no gat
  strong, strong bilong Krais i ken i stap wantaim mi. 10Long dispela as, bilong litimapim
  nem bilong Krais, mi amamas taim mi yet mi no gat strong, na ol man i sutim tok
  nogut long mi, na mi fesim ol kainkain hevi, na ol man i bagarapim mi nating, na
  mi fesim ol kainkain trabel. Long wanem, taim mi yet mi no gat strong, orait mi
  save kisim strong bilong Krais.\\nGod i bin soim planti gutpela samting long Pol
  \u2013 ol samting bilong gutnius na kingdom bilong God. Tasol nogut Pol i bikhet
  long dispela. Nogut Pol i kisim tingting olsem, \u201cAting mi wanpela strongpela
  man na God i soim ol dispela samting long mi.\u201d\\nPol yet i no strongpela man.
  Nogat. Wanem strong Pol i gat bilong autim tok bilong God, orait Krais yet i bin
  givim em.\\nGod i no laik Pol i bikhet long ol dispela samting Em i soim em. Nogat.
  God i laik Pol i daunim em yet na i klia olsem Krais i bin givim strong long em.
  God i laik Pol i mas tingting long sin bilong em na hau God i bin mekim grasia long
  em tasol na sevim em long feitful wok bilong Krais long diwai kros. Em olsem na,
  God i givim wanpela sik long Pol bilong slekim strong bilong Pol, bai Pol i tingting
  long strong Krais yet i bin givim em bilong autim tok bilong God.\\nNa dispela hevi
  em i gutpela samting bilong Pol. Long wanem, dispela hevi i helpim Pol holim gutpela
  tingting, na taim em i holim gutpela tingting, orait strong bilong Krais i wok moa
  insait long laip bilong Pol.\\nNa tingim dispela \u2013 i no wanpela man long ples
  i wokim posin long Pol na dispela sik i kamap long em. Nogat tru! God tasol i givim
  sik long Pol bilong mekim gutpela wok insait long laip bilong em \u2013 bilong givim
  gutpela tingting long em \u2013 bilong daunim strong bilong em \u2013 bai strong
  bilong Krais i ken i wok moa long laip bilong em.\\nTaim Pol i apim em yet, orait
  em i daunim Krais. Tasol taim em i daunim em yet, orait Krais i wok moa yet long
  laip bilong Pol na Em i yusim em long mekim gutpela wok moa long kingdom bilong
  God.\\nOlsem na, sampela taim yumi ken i askim God long rausim sik bilong yumi o
  rausim ol raskol long rot bai yumi go fri, tasol sampela taim God i ken i larim
  sik i stap o larim raskol i stap na Em i yusim dispela samting bilong mekim gutpela
  wok insait long laip bilong yumi.\\nYumi ken i trastim God, long wanem, save bilong
  God i winim save bilong yumi.\\nYumi mas klia olsem, save bilong God i winim save
  bilong yumi. God i gat save. Na yumi mas trastim Em tasol \u2013 Em i laik givim
  amamas long yumi o Em i laik givim pen wantaim, stil yumi ken i trastim pasin bilong
  Em.\\nGod tasol i bosim na kontrolim olgeta samting na Em i mekim olsem bikos Em
  i gat tingting long mekim gutpela wok insait long laip bilong yumi. God i ken i
  yusim olgeta samting bilong mekim gutpela wok long yumi. Yumi ken i trastim God.\\nEksempel
  bilong Habakuk.\\nBilong pinisim toktok mi laik soim pasin bilong wanpela profet
  bilong God \u2013 em i soim yumi gutpela tingting. Mi laik yumi i pas long feitful
  wok bilong Jisas yumi mas i stap olsem Habakuk.\\nGod i bin tokim Habakuk olsem,
  wanpela bikpela hevi bai kamap long hauslain bilong Habakuk. Habakuk i harim, na
  em i mekim dispela toktok long Habakuk 3:16-19\u2026.\\n16Mi harim pinis tok bilong
  BIKPELA na lewa bilong mi em i pam,\\nna maus bilong mi em i guria.\\nOl bun bilong
  mi i lus na mi no gat strong,\\nna lek bilong mi em i guria.\\nTasol, mi bai stap
  na wetim dispela samting nogut i laik kamap long ol i laik bagarapim mipela.\\n17Sapos
  ol diwai fik i no karim pikinini,\\nna ol diwai wain i no karim prut.\\nNa sapos
  ol diwai oliv i no karim gut ol kaikai,\\nna ol gaden i no kamapim kaikai.\\nNa
  sapos mipela i no gat sipsip i stap,\\nna mipela i no gat bulmakau i stap.\\n18Em
  i orait, mi bai amamas long BIKPELA.\\nNa mi bai amamas long dispela God bilong
  helpim mi.19BIKPELA Bilong Bosim Olgeta Samting Em bai strongim mi.\\nEm save mekim
  lek bilong mi i stap strong na mi no ken i pundaun.\\nEm save strongim mi na litimapim
  mi.\\nHabakuk i trastim God tasol, maski wanem kain hevi God i laik kamapim. Maski
  ol birua i kam distroim olgeta samting, Habakuk i trastim God tasol. Em i no krosim
  God. Em i no bel hat long God. Nogat. Em i trastim God na Em i askim God long helpim
  em i stap strong taim dispela hevi i kamap.\\nYumi mas trastim God olsem Habakuk
  na Pol i trastim God. Maski wanem samting i kamap long yumi, askim God long helpim
  yumi stap strong na bihainim Em i go i go i go olgeta.\\nTrastim God bikos God i
  promis olsem Em i bosim na kontrolim olgeta samting bilong mekim gut long olgeta
  manmeri i lavim Em. God yet i gat gutpela save. Olsem na wanem samting em i laik
  givim yumi o wokim long yumi, orait yumi trastim Em tasol.\\nTaim yu prea, orait
  yu trastim God long wokim rait disisen long askim bilong yu.\\nEm tasol.\"", "\"unfoldingWord
  32 - Jisas i Oraitim Man Wantaim Spirit Nogut Na Sik Meri\\n\u041f\u043baH-koHc\u043fekT:
  Matthew 8:28-34; 9:20-22; Mark 5; Luke 8:26-48\\nHoMep TekcTa: 1232\\n\u042f\u0437\u044bk:
  Tok Pisin (PNG)\\nAy\u0434\u0438Top\u0438\u044f: General\\n\u0426e\u043bb: Evangelism;
  Teaching\\nFeatures: Bible Stories; Paraphrase Scripture\\ncTaTyc: Approved\\nC\u0446eHap\u0438\u0438
  - \u044dTo ocHoBH\u044be \u0438HcTpyk\u0446\u0438\u0438 \u043fo \u043fepeBo\u0434y
  \u0438 \u0437a\u043f\u0438c\u0438 Ha \u0434pyr\u0438e \u044f\u0437\u044bk\u0438.
  \u0418x c\u043be\u0434yeT \u043fp\u0438 Heo\u0431xo\u0434\u0438MocT\u0438 a\u0434a\u043fT\u0438poBaTb,
  \u0447To\u0431\u044b c\u0434e\u043baTb \u043foH\u044fTH\u044bM\u0438 \u0438 akTya\u043bbH\u044bM\u0438
  \u0434\u043b\u044f ka\u0436\u0434o\u0439 ky\u043bbTyp\u044b \u0438 \u044f\u0437\u044bka.
  HekoTop\u044be \u0438c\u043fo\u043bb\u0437yeM\u044be TepM\u0438H\u044b \u0438 koH\u0446e\u043f\u0446\u0438\u0438
  MoryT Hy\u0436\u0434aTbc\u044f B \u0434o\u043fo\u043bH\u0438Te\u043bbHoM \u043fo\u044fcHeH\u0438\u0438
  \u0438\u043b\u0438 \u0434a\u0436e \u043fo\u043bHocTb\u044e \u0437aMe\u0449aTbc\u044f
  \u0438\u043b\u0438 o\u043fyckaTbc\u044f.\\nWanpela de Jisas wantaim ol disaipel
  i brukim raunwara na i go hapsait long bot long ples we ol Gerisen i stap long em.\\nTaim
  ol i kamap pinis long hapsait long raunwara, wanpela man i gat spirit nogut i ran
  i kam long Jisas.\\nDispela man i strong tumas olsem na i no gat wanpela man inap
  stiaim em. Maski ol man i save pasim han na lek wantaim sen, tasol em i save brukim
  ol.\\nDispela man i stap namel long matmat long dispela hap. Dispela man i save
  singaut bikmaus olgeta de na long nait. Em i no save pasim klos na katim skin bilong
  em wantaim ston gen na gen.\\nTaim dispela man i kam long Jisas, em i pundaun long
  skru long lek bilong em. Jisas i tokim spirit nogut, \u201cYu kamaut long dispela
  man!\u201d.\\nDispela man wantaim spirit nogut i singaut olsem, \u201cYu laikim
  wanem samting long mi, Jisas Pikinini bilong God Antap tru? Plis noken bagarapim
  mi!\u201d Na Jisas i askim spirit nogut, \u201cWanem em nem bilong yu?\u201d Em
  i bekim tok, \u201cNem bilong mi em Lijen, long wanem mipela i planti.\u201d (Lijen
  em wanpela grup i gat sampela tausen soldia long ami bilong Rom).\\nSpirit nogut
  i krai long Jisas, \u201cPlis noken salim mipela i go aut long dispela hap graun.
  I gat ol pik i kaikai i stap klostu long liklik maunten. Olsem na spirit nogut i
  krai long Jisas,\u201dPlis salim mipela i go insait long ol pik!\\\" Na Jisas i
  tok, \u201cI go.\u201d\\nOl spirit nogut i kamaut long dispela man na i go insait
  long ol pik. Ol pik i ran i go daun insait long raunwara na dring wara na i dai.
  Ol i klostu olsem 2000 pik.\\nTaim ol man husat i save lukautim pik i lukim wanem
  i kamap, ol i ran i go insait long taun na tokim olgeta manmeri wanem Jisas i mekim.
  Ol man long taun i kam na lukim dispela man husat i bin gat spirit nogut. Em i sindaun
  isi tru na pasim klos, na i stap olsem wanpela gutpela man.\\nOl man i pret nogut
  tru na askim Jisas long lusim ol na go. Olsem na Jisas i kalap long bot na redi
  long i go. Dispela man i bin gat spirit nogut i askim Jisas long go wantaim em.\\nTasol
  Jisas i tokim em, \u201cNogat, mi laik yu go long haus na tokim ol pren na famili
  bilong yu long olgeta samting God i bin mekim long yu na olsem wanem em i bin marimari
  long yu.\u201d\\nOlsem na dispela man i go na tokim olgeta manmeri long wanem Jisas
  i bin mekim long em. Olgeta lain husat i harim stori bilong em ol i kirap nogut
  na tingting planti.\\nJisas i go bek long narapela sait bilong raunwara. Bihain
  long em i kamap pinis long hap, planti manmeri i kam bung raunim em paspas klostu
  long em. Namel long ol manmeri i gat wanpela meri i gat sik we em i lusim blut inap
  12-pela yia. Em i baim olgeta mani em i gat long ol dokta long kamap orait, tasol
  sik i kamap bikpela moa.\\nEm i harim olsem Jisas i oraitim planti manmeri olsem
  na em i tingim, \u201cMi save sapos mi tasim hap klos bilong em bai mi kamap orait
  tu. Orait em i kam baksait long Jisas na tasim hap klos bilong Jisas. Taim em i
  tasim klos bilong Jisas blut i stop na em i kamap orait.\\nKwiktaim Jisas i save
  olsem pawa insait long em i go aut. Olsem na em i tanim na askim, \u201cHusat i
  tasim mi?\u201d Na ol disaipel i bekim tok, \u201cI gat planti manmeri i stap raunim
  yu na pas long yu. Bilong wanem na yu askim. \u2019Husat i tasim mi?\u201d\\nMeri
  i pundaun long skru klostu long Jisas, em i guria na pret nogut tru. Na em i tokim
  Jisas wanem em i bin mekim na em i kamap orait. Na Jisas i tokim em, \u201cBilip
  bilong yu i mekim yu i kamap orait. Yu go wantaim bel isi.\u201d\"", "\"1Bikpela,
  yu no ken lusim tingting long Devit na long olgeta wok em i bin mekim. 2Strongpela
  God bilong Israel, yu mas tingim gen ol promis Devit i bin mekim long yu. 3Em i
  tok olsem, \u201cMi no ken i go long haus na mi no ken slip long bet. 4Mi no ken
  malolo na slip yet. 5Pastaim mi mas wokim wanpela haus bilong Bikpela, Strongpela
  God bilong Israel, bai em i ken i stap long en. Na bihain bai mi malolo.\u201d 6Long
  Betlehem mipela i harim tok long Bokis Kontrak bilong Bikpela. Na mipela i lukim
  em i stap long graun bilong Kiriat Jearim. 7Na mipela i tok, \u201cGoan, yumi go
  long haus bilong Bikpela. Yumi go lotu klostu long sia king bilong en.\u201d 8Bikpela,
  yu kam wantaim Bokis Kontrak bilong yu na sindaun long ples malolo bilong yu. Dispela
  Bokis Kontrak em i mak bilong bikpela strong bilong yu. 9Yu ken helpim ol pris bilong
  yu, bai ol i mekim stretpela pasin oltaim. Na dispela pasin bilong ol i ken i stap
  olsem gutpela bilas bilong ol. Na ol manmeri bilong yu i ken amamas na singaut.
  10Bikpela, yu mas tingim wokman bilong yu, Devit, na yu no ken givim baksait long
  king yu yet yu bin makim. 11Bikpela, bipo yu bin mekim wanpela strongpela promis
  long Devit, na yu no inap senisim tok bilong yu. Yu bin tok olsem, \u201cMi bai
  mekim wanpela bilong ol lain pikinini bilong yu i kamap king. 12Sapos ol pikinini
  man bilong yu i bihainim kontrak bilong mi, na bihainim olgeta lo mi givim ol, orait
  bihain ol pikinini man bilong ol tumbuna bilong yu, ol tu bai i kamap king, i go
  inap olgeta taim bihain.\u201d 13Bikpela i makim Saion pinis olsem taun bilong en,
  na em i laik i stap oltaim long en. 14Em i tok, \u201cBai mi stap oltaim oltaim
  long dispela taun. Mi makim dispela ples bilong mi ken i stap king long en. 15Bai
  mi givim planti samting long Saion na bai ol manmeri i no inap sot long ol samting.
  Na bai mi givim kaikai long ol rabisman na ol bai i pulap tru. 16Bai mi givim wok
  long ol pris bilong Saion, bilong autim tok long mi save kisim bek ol manmeri bilong
  graun. Na ol manmeri bilong Saion i ken singim song na amamas na singaut. 17Bai
  mi kisim wanpela man long lain bilong Devit na mekim em i kamap king long dispela
  ples, na lain bilong en i no inap lus long dispela wok. 18Bai mi mekim ol birua
  bilong en i sem nogut, tasol ol lain manmeri em i bosim bai ol i kamap gutpela na
  i stap strong.\u201d\"", "\"Yusa:Wantok\\nMoning nau!\\nMi wok olsem administreta
  (sysop) long dispela Tok Pisin Wiktionary inap long 27 Disemba 2007.\\nAsples bilong
  mi emi Canberra, long Ostrelia. Tasol mi gat naraples asples tu nau, long ples Madina
  long Niu Ailan Provins. Em asples bilong meri bilong mi, na mitupela wokim wanpela
  haus pinis long peles. \\\"Niu Ailan bilas ples\\\" ia! Planti ol bratasusa tu ol
  istap long Mosbi na long peles.\\nMi stap long Mosbi long fopela yia pinis, stat
  long 1990 inap long 1994. Long dispela taim mi wok wantaim sampela ol liklik grup
  ol i wok long ol samtimg bilong giraun. Na tu mi wokim ol progrem bilong video na
  redio - ol advetismen, ol toksave bilong helt, na dispela kain samting.\\nMi save
  wok tu long ol narapela projek:\\n- tpi-wikipedia\\n- en-wikipedia\\n- de-wikipedia\\n-
  fr-wikipedia\\n- it-wikipedia\\n- simple-wikipedia\\n- meta\\n- commons\\n- BetaWiki\\n-
  wikitravel\\nPastaim mi yusim nem Mattandrews long hia, tasol nau mi save yusim
  dispela nem Wantok tasol.\"", "\"Saikolosi i save ol i lukluk long tingting bilong
  manmeri. Planti narapela kain long stadi lukluk tingting, olsem wanem pilosopi,
  theolosi, sosiolosi na moa. Tasol saikolosi i lukluk wantaim scientific method.\\nSaikolosi
  i kamap long tupela narapela stadi: pilosopi na save long laip. Bihain long manmeri
  i bin save samting inap long kru bilong het, neuron na pisiolosi bilong ol, manmeri
  i kamap inap stadim tingting wantaim saiens. Bipo, ol man bilong pilosopi i bin
  kamap long sampela theories tasol nogat saiens long em.\"", "\"36\\nPrea bilong
  ol Israel\\n1 God, yu Bikpela bilong heven na graun, lukluk long mipela na marimari
  long mipela, na mekim olgeta lain pipel i pret long yu.\\n2 Kirap na mekim save
  long ol haiden manmeri, bai ol i pilim strong bilong yu.\\n3 Bipo yu bin wok namel
  long mipela na ol manmeri i lukim biknem bilong yu. Orait nau tu yu mas wok namel
  long ol na bai mipela i ken lukim strong bilong yu.\\n4 Na bai ol i ken save olsem
  mipela i save, i no gat narapela God i stap. Yu Bikpela, yu wanpela God tasol.\\n5
  Soim gen strong bilong yu na wokim ol mirakel, na mekim bikpela pawa bilong yu i
  kamap ples klia.\\n6 Kirapim kros bilong yu, na autim belhat bilong yu long ol birua
  bilong mipela. Pinisim ol na yu no ken larim wanpela bilong ol i stap.\\n7 Hariap
  na tingim bikpela promis yu bin mekim. Na bai ol manmeri i ken stori planti long
  ol wok bilong yu.\\n8 Mekim save long ol birua i stap laip yet na kukim ol long
  paia. Na bagarapim ol dispela lain i save mekim nogut long ol manmeri bilong yu.\\n9
  Brukim het bilong ol bikman bilong ol birua. Long wanem, ol i save tok olsem, \u201cI
  no gat narapela lain i stap. Mipela tasol.\u201d\\n10 Bungim ol lain bilong Jekop
  bai ol i kamap wanpela lain, na bai ol i ken sindaun gut long graun bipo yu bin
  givim long ol.\\n11 Bikpela, mipela ol Israel i kisim nem bilong yu, na yu bin mekim
  mipela i stap namba wan pikinini bilong yu, olsem na yu mas marimari long mipela.\\n12
  Yu ken sori long Jerusalem, em i ples tru bilong yu. Na yu ken marimari long dispela
  ples yu save sindaun long en.\\n13 Pulimapim Saion long ol singsing bilong litimapim
  nem bilong yu, na mekim nem bilong yu i kamap bikpela long haus bilong yu.\\n14
  Sambai long ol lain manmeri bilong yu, em ol lain yu bin kamapim bipo yet. Na inapim
  ol toktok bilong yu ol profet i bin autim.\\n15 Givim gutpela pe long ol manmeri
  i wet long yu, na mekim ol tok profet i kamap tru oltaim.\\n16 Harim prea bilong
  mipela ol manmeri bilong yu, na inapim blesing Aron i bin givim long mipela.\\n17
  Olsem na bai ol manmeri long olgeta hap bilong graun i ken save olsem yu tasol yu
  God bilong i stap oltaim.\\nPasin bilong skelim ol samting\\n18 Ol manmeri i save
  kisim ol kain kain kaikai, tasol sampela kaikai i gutpela tru na i winim ol arapela.\\n19
  Maus i save pilim wanem abus i swit na wanem abus i no gutpela tumas. Olsem tasol
  ol manmeri i gat save ol i ken painimaut kwik wanem tok i tru na wanem tok i giaman.\\n20
  Ol manmeri i gat kranki tingting ol bai i kamapim planti hevi, tasol ol manmeri
  i gat save tru, ol bai inap long bekim ol kranki tok.\\nSkelim gut meri yu laik
  maritim\\n21 Man yet i mas painim meri bilong em. Tasol em i mas skelim gut wanem
  kain meri em i laikim.\\n22 Naispela pes bilong meri i save mekim man i amamas,
  na i save kirapim tru mangal bilong ol arapela man.\\n23 Na sapos meri i no save
  bikmaus nabaut long ol arapela, orait man bilong en i ken amamas.\\n24 Man i baim
  meri, em i kisim samting i nambawan tru. Long wanem, meri em i poroman na helpim
  bilong em.\\n25 Sapos gaden i no gat banis, em bai i bagarap. Olsem tasol, man i
  no marit em bai i kamap tripman nating.\\n26 Ol manmeri i no save laikim ol hambakman
  i save raun nating long taun.\\n27 Na tu, ol i no amamas long ol tripman i save
  slip nabaut na i no gat haus bilong ol.\"", "\"Kamano\\nKamano (Kamano-Kafe) em
  i wanpela tokples long Isten Hailans provins long Papua Niugini. Sampela ol lain
  i save kolim Kamano olsem tok ples Kafe.\\nSen bilong Sentens[senisim | edit source]\\nKamano
  Kafe i gat wanpela samting long grama bilong en na ol i kolim nem bilong em Sen
  bilong Sentens. Planti ol lain tok ples Papua i gat grama olsem dispela. Olsem,
  long tok ples Kamano, taim yu stori, yu mas usim wanpela kain tok bilong wok pastaim
  na narapela tok bilong wok bihain. Wanpela master i lainim tok ples Kamano na i
  tok olsem, tok ples Kamano i gat naispela grama olsem, long wanem long tok bilong
  wok i kamap pastim long stori, dispela tok bilong wok i soim yu husait wokim dispela
  wok na hamas manmeri i wokim. [1]. Wanpela sentens i kamap hia.\\nN\u00e4gra\\nI\\ntr-o-ge-nka,\\nleave-1P.SG-SR-B.2P.SG\\nk\u00e4gra\\nyou\\ntr-an-ke-no'',\\nleave-2P.SG-SR-B.3P.SG\\n\u00e4gra\\nhe\\ntre-''n-i-e\\nleave-PERF-3P.SG-IND\\n\\\"Mi
  go pinis, na yu go pinis, na em i go pinis.\\\"\\nReferences[senisim | edit source]\\n-
  Elliott, John (2017). \\\"Understanding preview-subject clause chains in Kamano
  Kafe\\\". University of Hawai''i at Manoa Working Papers\"", "\"Jisas I Kirap Long
  Matmat\\n\u0625\u0633\u062a\u0639\u0631\u0627\u0636: The facts of the resurrection
  in detail followed by an exhortation to be ready for His return. Note: The emphasis
  in this script can be especially useful for Catholics and Muslims.\\n\u0631\u0642\u0645
  \u0627\u0644\u0646\u0635: 110\\n\u0644\u063a\u0629: Tok Pisin: PNG\\n\u0627\u0644\u0641\u0643\u0631\u0629:
  Sin and Satan (Cleanse, purify, Judgement, Sin, disobedience, Heart, soul of man);
  Christ (Resurrection of Jesus, Saviour of Sinful Men, Death of Christ); Eternal
  life (Eternal / everlasting life); Living as a Christian (Forgiveness); Life event
  (Death); Bible timeline (End Time, Second Coming)\\n\u0627\u0644\u062c\u0645\u0627\u0647\u064a\u0631:
  Animist\\n\u0646\u0645\u0637: Dialog\\n\u0641\u0635\u064a\u0644: Bible Stories &
  Teac\\n\u0627\u0644\u063a\u0631\u0636: Evangelism\\n\u0646\u0635 \u0645\u0646 \u0627\u0644\u0625\u0646\u062c\u064a\u0644:
  None\\n\u062d\u0627\u0644\u0629: Approved\\n\u0647\u0630\u0627 \u0627\u0644\u0646\u0635
  \u0647\u0648 \u062f\u0644\u064a\u0644 \u0623\u0633\u0627\u0633\u0649 \u0644\u0644\u062a\u0631\u062c\u0645\u0629
  \u0648\u0627\u0644\u062a\u0633\u062c\u064a\u0644\u0627\u062a \u0641\u0649 \u0644\u063a\u0627\u062a
  \u0645\u062e\u062a\u0644\u0641\u0629. \u0648 \u0647\u0648 \u064a\u062c\u0628 \u0627\u0646
  \u064a\u0639\u062f\u0644 \u0644\u064a\u062a\u0648\u0627\u0626\u0645 \u0645\u0639
  \u0627\u0644\u0644\u063a\u0627\u062a \u0648 \u0627\u0644\u062b\u0642\u0627\u0641\u0627\u062a
  \u0627\u0644\u0645\u062e\u062a\u0644\u0641\u0629 \u0644\u0643\u0649 \u0645\u0627
  \u062a\u062a\u0646\u0627\u0633\u0628 \u0645\u0639 \u0627\u0644\u0645\u0646\u0637\u0642\u0629
  \u0627\u0644\u062a\u0649 \u064a\u0633\u062a\u0639\u0645\u0644 \u0628\u0647\u0627.
  \u0642\u062f \u062a\u062d\u062a\u0627\u062c \u0628\u0639\u0636 \u0627\u0644\u0645\u0635\u0637\u0644\u062d\u0627\u062a
  \u0648\u0627\u0644\u0623\u0641\u0643\u0627\u0631 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645\u0629
  \u0625\u0644\u0649 \u0634\u0631\u062d \u0643\u0627\u0645\u0644 \u0623\u0648 \u0642\u062f
  \u064a\u062a\u0645 \u062d\u0630\u0641\u0647\u0627 \u0641\u0649 \u062b\u0642\u0627\u0641\u0627\u062a
  \u0645\u062e\u062a\u0644\u0641\u0629.\\n1: Brata/wantok, mi laik tokim yu long wanpela
  samting i bin kamap bipo long dispela graun. Dispela samting em i gutpela na em
  i tru tumas. Bai yu ken save long em tu. Sapos yu bilip long dispela samting bai
  bel isi na amamas i kamap long yu.\\n2: Yu laik tokim mi long wanem samting?\\n1:
  Mi laik tokim yu long wanpela man nem bilong En Jisas. Jisas i bin kirap bek gen
  long matmat.\\n2: Mi ting Em i dai pinis long diwai kros, long taim bipo tru. Em
  i tru no nogat?\\n1: Yes, em i tru. Tasol Jisas Em i stap long matmat inap long
  tripela de na bihain i kirap bek gen.\\n2: Tasol dispela samting em i bilong bipo
  yet, na olsem wanem/hauset yu save dispela tok i tru?\\n1: Wanpela meri nem bilong
  em Maria, em i go long matmat wantaim sampela arapela meri. Ol i lukim matmat. Bipo
  draipela ston i karamapim hol bilong matmat. Ol i lukim ston i bin tekewe pinis.
  Baihain liklik Pita na Jon tu, i lukim matmat i op pinis.\\n2: Aiting sampela man
  i bin stilim bodi bilong Jisas.\\n1: Nogat, ol i no bin stilim bodi bilong En. I
  gat plenti soldia i stap was long dispela matmat.\\n2: Yu tok Jisas i bin kirap
  bek gen long matmat. I gat sampela manmeri i lukim Em, no nogat?\\n1: Yes, i gat
  plenti/sampela manmeri i bin lukim Jisas. Pastaim Maria i lukim Jisas long gaden
  bilong matmat. Pita na arapela manmeri i bin lukim Em tu. Na long narapela de bikpela
  lain manmeri i bin lukim Jisas.\\n2: Mi ting ol i lukim dewel/spirit tasol. Em i
  gat bodi olsem yumi no nogat?\\n1: Yes, bodi bilong Jisas i olsem bodi bilong man
  tru. Em i no dewel/spirit, nogat. Wanpela man Tomas i putim han long banis bilong
  Jisas. Long dispela taim Jisas i save tok na kaikai pis wantaim Pita. Man i no inap
  long putim han long wanpela dewel. Dewel i no inap long sindaun na kaikai pis na
  tromwe bun bilong pis.\\n2: Olsem wanem Jisas i kirap bek gen long matmat na save
  wokabaut nabaut? Mi no inap long save long dispela. Mi no bin lukim samting olsem
  bipo.\\n1: Em i tru. Tasol Jisas i nogat sin i stap long Em. Em i pikinini man bilong
  God. Na matmat i no inap long pasim Em. Jisas i bin soim ol, taim yumi dai pinis
  i no las samting. Huset manmeri i bin bilip long Jisas na bihainim tok bilong En,
  Jisas bai i kisim ol i go long heven.\\n2: Jisas i stap we nau?\\n1: Jisas , Em
  i stap long heven.\\n2: Em i stap long heven, a? Aiting Em i stap longwe long ol
  manmeri bilong En long dispela graun.\\n1: Nogat! Em i tru, Jisas i stap long heven,
  tasol Em i save stap tu long bel/tingting bilong ol manmeri bilong En. Em i save
  skulim/lainim yumi long laik/tingting bilong En. Olsem bai yumi ken wokabaut long
  stretpela pasin bilong God.\\n2: Jisas bai i kam bek gen, no nogat?\\n1: Yes, Jisas
  bai i kam bek gen. Em bai i kotim ol daiman, wantaim ol man i stap yet. Em bai i
  bungim ol haiden/man i no bilong Jisas, na ol i go long bikkot bilong God. Ol bai
  i kisim pe nogut long sin bilong ol/baiim wrong bilong ol. Manmeri i bin givim beksait
  long sin na givim bel long Jisas, bai ol i go stap long heven, oltaim.\\n2: Wanem
  taim bai Jisas i kam bek?\\n1: I nogat man i save long wanem taim bai Jisas Em i
  kambek. Jisas i tok yupela mas redi na was long/waitim Em. Sapos yumi no redi taim
  Em i kam, yumi gat sem. Yu yet mas askim Jisas nau long rausim sin bilong yu. Taim
  yu mekim olsem, yu kamap man bilong Jisas.\\n2: Mi ken givim bel long Jisas, olsem
  wanem?\\n1: Pre/beten/tok long Jisas olsem: \\\"O Bikpela Jisas, mi kam long yu
  nau. Yu rausim ol sin/pasin nogut bilong mi. Mi laik kamap man bilong yu. Mi laik
  bihainim tok bilong yu oltaim. Mi laik go long heven long taim mi dai pinis. Mi
  askim long nem bilong Jisas, Amen.\\\" Sapos yu beten olsem, bia God i harim beten
  bilong yu.\\n2: Tengkyu tru long dispela tok. Mi amamas tumas yu bin tokim mi olsem.
  Nau mi save pinis long rot i bringim mi long God.\"", "\"(Song 23)\\n1. Jehova em
  Wasman blong mi;\\nBai mi bihainim em yet.\\nEm save long laik na bel blong mi;\\nEm
  save long nid blong mi.\\nLong gutpla gras em bringim mi,\\nLong ples i nais tumas.\\nWantaim
  laikim em i stiaim mi\\nLong ples i gat bel isi.\\nWantaim laikim em i stiaim mi\\nLong
  ples i gat bel isi.\\n2. Rot bilong yu i nais tumas,\\nRot bilong yu stret tumas.\\nTingim
  nem blong yu na larim mi\\nLong wokabaut wantaim yu.\\nStik bilong yu ken stiaim
  mi\\nLong veli we em tudak,\\nMi no ken pret long wanpela man,\\nYu God na Pren
  blong mi.\\nMi no ken pret long wanpela man,\\nYu God na Pren bilong mi.\\n3. Jehova,
  yu Wasman blong mi;\\nYu go we bai mi go tu.\\nYu strongim na givim malolo;\\nYu
  givim ol samting tu.\\nYu God blong stap oltaim oltaim,\\nOlsem na mi bilip tru.\\nPasin
  laikim na lukaut bilong yu\\nStap wantaim mi oltaim.\\nPasin laikim na lukaut blong
  yu\\nStap wantaim mi long oltaim.\\n(Lukim tu Sng. 28:9; 80:1.)\"", "\"Long 2-pela
  wik nau yumi bin skelim tok bilong Jisas long sait bilong marit. Long fes wik yumi
  bin skelim ol lo bilong Jisas long sait bilong marit. Na long sekon wik yumi bin
  skelim tok bilong Jisas long sindaun bilong tupela insait long marit.\\nNau dispela
  wik yumi bai skelim tok bilong Jisas long sait bilong ol pikinini.\\nJisas i tok
  wanem long sindaun bilong pikinini insait long marit? Papamama i ken i mekim wanem?
  Pikinini i ken i mekim wanem? Jisas i tok wanem long lukautim pikinini? Nau yumi
  bai skelim ol dispela kain samting.\\nLong plen bilong God pikinini i mas kamap
  insait long marit.\\nGod i bin pasim Adam na Ivi long marit pastaim. Tupela i marit
  pastaim. Tupela i pas olgeta pastaim long marit. Na taim tupela i pas olgeta long
  marit, orait God i tokim tupela olsem, \u201cYutupela mas karim planti pikinini
  bilong yutupela yet.\u201d Jenesis 1:28.\\nLong dispela wei tasol pikinini i ken
  i kamap. God i laik pikinini i ken i kamap insait long marit na tupela marit i ken
  i lukautim pikinini. Long tingting bilong God na long plen bilong God pikinini i
  mas kamap insait long marit na tupela marit i lukautim pikinini God i givim tupela.\\nPikinini
  i kamap autsait long marit, orait dispela i no gutpela long ai bilong God. Em i
  no gutpela pikinini i kamap long paul pasin bilong tupela i no marit. Em i no gutpela
  long ai bilong God man na meri i slip wantaim pastaim na meri i kisim bel na bihain
  tupela i marit. God i no laikim dispela kain pasin. Ol dispela kain pasin em i paul
  pasin long ai bilong God.\\nGod i save pasim wanpela man na wanpela meri long marit,
  na insait long marit pikinini i ken i kamap, na tupela marit i ken i lukautim pikinini
  God i givim tupela. Dispela em i wei bilong God long sait bilong pikinini. Dispela
  wei em i bes we bikos em i plen bilong God bilong kamapim na lukautim pikinini.\\nNa
  dispela wei bilong God em i nambawan wei olgeta.\\nYu tingim. Taim tupela marit
  i pas gut tru insait long marit na tupela i kamap bes pren pinis, na man i lavim
  meri bilong em na meri i rispektim man bilong em, na tupela marit i sindaun gutpela
  tru long wei bilong God, orait taim pikinini i kamap em i kamap insait long gutpela
  samting stret na em bai amamas na i stap gut olgeta insait long dispela kain marit.
  Lukim Efesus 5:22-33.\\n22 Yupela meri i laik bihainim Bikpela, yupela mas i stap
  aninit long man bilong yupela. 23 Long wanem, man em i het bilong meri bilong em
  kain olsem Krais Em i het bilong sios. Sios em i bodi bilong Krais na Krais i bin
  mekim wok na sevim sios. 24 Na wankain olsem sios i save stap aninit long Krais,
  orait meri i mas i stap aninit long man bilong em long olgeta samting.\\n25 Na yupela
  man, yupela mas lavim meri bilong yupela olsem Krais i bin lavim sios. Em i bin
  lusim laip bilong Em yet bilong sevim sios. 26 Em i bin mekim olsem bilong mekim
  sios i kamap holi. Krais i bin wasim sios long wara na long tok bilong Em bilong
  mekim sios i kamap klin. 27 Em i mekim olsem bilong mekim sios i kamap naispela
  tru na i no gat mak nogut i stap long em na i no gat skin i slek na i no gat wanpela
  samting i spoilim em, na em i stap holi olgeta na em i no gat wanpela asua i stap.
  Krais i mekim sios i kamap naispela tru na Em i kisim sios i kam long Em yet. 28
  Na long dispela seim wei man i mas lavim meri bilong em olsem meri em i bodi bilong
  em yet. Man i lavim meri bilong em i olsem em i lavim em yet. 29 Yupela save olsem,
  wanpela man i no inap hetim bodi bilong em yet. Nogat. Em save givim kaikai na lukautim
  bodi bilong em wankain olsem Krais i mekim long sios. 30 Na yumi memba bilong bodi
  bilong Krais. 31 \u201cNa long dispela as, wanpela man bai lusim papa na mama bilong
  em, na em bai pas wantaim meri bilong em. Na tupela bai pas olgeta.\u201d (Jenesis
  2:24) 32 Dispela tok i dip tumas, tasol mi tok nau long Krais na sios bilong Em.
  33 Na yupela tu yupela mas lavim meri bilong yupela olsem yupela lavim yupela yet.
  Na meri i mas rispektim man bilong em. Efesus 5:22-33.\\n(Lukim Mak 10:6-8 tu. Na
  lukim tok bilong las wik \u201cJisas i tok wanem long Marit (2) \u201d.)\\nNa yupela
  save pinis long dispela samting. Taim sindaun bilong tupela marit i bagarap, na
  kros pait na toktok nogut na tok bilas i stap namel long papa na mama, orait pikinini
  i save kisim hevi bilong papamama bilong em na em tu em i sindaun nogut. Planti
  taim, taim papamama i kros pait, ol i kros tu long pikinini na ol i ken i paitim
  pikinini. Olsem na, yu save pinis, taim tupela marit i no sindaun gutpela, orait
  pikinini i save kisim hevi wantaim.\\nNa taim man i maritim 2-pela meri, orait kros
  pait i save kamap klostu klostu na tupela meri i no sindaun gutpela na tupela i
  tok baksait na tok bilas, na man i save paitim tupela meri na tokim tupela long
  sindaun gutpela. Na pikinini i stap insait long dispela kain marit ol i save kisim
  hevi long ol dispela samting.\\nYupela no ken tingim olsem pikinini i pasim ai tasol
  na em i no save. Nogat. Em save na em i ken i pilim hevi long pasin bilong papamama.
  Na taim em i kamap bikpela liklik, orait em bai hambak na les long papamama. Na
  bihain, taim em i kamap bikpela pinis, orait em bai i no inap rispektim papamama
  na em bai hambak moa yet.\\nOlsem na, wei bilong God i gutpela wei tru bilong kamapim
  na lukautim pikinini. Sapos papa i lavim mama na mama i rispektim papa na tupela
  i stap bes pren, orait pikinini i kamap insait long gutpela samting tru na em bai
  sindaun gutpela na kisim bikpela amamas. Na taim em i kamap bikpela liklik, orait
  em bai lavim na rispektim papamama bilong em.\\nOlsem na, sapos yu papa yu laik
  bihainim wei bilong God bilong lukautim pikinini, orait nambawan samting i olsem,
  yu lavim meri bilong yu.\\nNa sapos yu mama yu laik bihainim wei bilong God bilong
  lukautim pikinini, orait nambawan samting i olsem, yu rispektim man bilong yu na
  sindaun gutpela aninit long em.\\nSapos yutupela papamama i laik bihainim wei bilong
  God bilong lukautim pikinini, orait nambawan samting i olsem, yutupela i stap bes
  pren wantaim insait long marit bilong yutupela, na pikinini bilong yu bai sindaun
  insait long gutpela samting stret na kisim amamas, na em bai rispektim yutupela
  na em bai amamas long sindaun aninit long yutupela.\\nDispela em i bikpela samting.
  Dispela em i nambawan samting long wei bilong God bilong kamapim na lukautim pikinini.
  Tasol God i gat sampela toktok moa long sait bilong lukautim pikinini. Em i gat
  sampela stia toktok long sait bilong lukautim pikinini.\\nNau mi laik tokim yu long
  3-pela samting God i tokim papamama long mekim long sait bilong lukautim pikinini,
  na mi bai tokim yu long 1-pela samting God i tokim ol pikinini long sait bilong
  sindaun wantaim papamama. Em olsem na mi laik skulim yupela 4-pela samting.\\n1.
  Papamama i mas skulim pikinini long ol samting long sait bilong God.\\nLukim Efesus
  6:4.\\n4 Na yupela papa, yupela no ken i bagarapim tingting bilong pikinini bilong
  yupela na mekim ol i bel nogut. Nogat. Olgeta taim yupela mas trenim ol long bihainim
  Bikpela na skulim ol long olgeta tok bilong Em. Efesus 6:4.\\nPapamama i mas trenim
  pikinini long bihainim BIKPELA na skulim em long olgeta tok bilong BIKPELA.\\nSapos
  yu skulim pikinini bilong yu long ol samting long sait bilong wokim haus na bilong
  wokim gaden, na yu skulim ol long ol samting bilong kopi na lukautim kakaruk na
  ol kainkain samting olsem, orait dispela em i gutpela, tasol dispela i no nambawan
  samting. Nambawan samting yu ken i skulim pikinini bilong yu em i olgeta samting
  long sait bilong God.\\nYu ken i skulim pikinini bilong yu long wokim haus na gaden
  na ol samting bilong kopi na lukautim kakaruk, na em i ken i sindaun gutpela long
  ol dispela samting, tasol bihain em bai olsem wanem? Taim em i lusim dispela graun,
  orait em bai olsem wanem? Nogut em i sindaun gutpela long hia long dispela graun
  long ol sampela yia na bihain em i bagarap olgeta bilong oltaim oltaim.\\nEm olsem
  na, mobeta yu skulim ol long olgeta samting bilong God, na ol i ken i tanim bel
  na bilipim na trastim God long kisim bek ol long feitful wok bilong Jisas long diwai
  kros. Nambawan samting i olsem, yu mas skulim pikinini bilong yu long hau em i ken
  i kisim trupela laip long feitful wok bilong Jisas.\\nLong dispela as yu no ken
  i larim pikinini bilong yu i stap long han bilong narapela manmeri. Yu no inap save
  long wanem skul ol bai kisim long han bilong ol. Nogut ol i tisim pikinini bilong
  yu long givim baksait long trupela rot bilong God. Nogut ol tisim pikinini bilong
  yu long rongpela rot na ol i tingim olsem, God bai kisim bek ol long misin pasin
  o long baptais o long pasin bilong lukautim Sabat. Sapos ol i kisim na bihainim
  dispela kain tingting, orait bihain ol bai bagarap oltaim oltaim.\\nNa nogut yu
  yet yu tisim pikinini bilong yu long givim baksait long God. Sapos pasin bilong
  yu i wankain pasin bilong ol man i givim baksait long God, orait pikinini bai bihainim
  pasin bilong papamama na em bai givim baksait long God tu.\\nOlsem na, yupela papamama
  i laik trenim na skulim pikinini bilong yu na ol i bihainim BIKPELA, orait yupela
  yet yupela mas bihainim BIKPELA long olgeta samting long laip bilong yupela.\\nYupela
  papamama i bilipim na trastim God long kisim bek yupela long feitful wok bilong
  Jisas, orait yupela mas wok hat na trenim pikinini bilong yu long bihainim BIKPELA
  na skulim ol long olgeta trupela tok bilong Em.\\n2. Papamama i mas stretim pasin
  nogut bilong pikinini.\\nLukim Efesus 6:4 gen. Pasin bilong trenim pikinini i olsem,
  yu bai soim ol long rait wei long bihainim BIKPELA. Na taim ol i mekim pasin nogut,
  orait bai yu stretim ol.\\nSampela taim yu ken i toktok long ol pikinini bilong
  yu na stretim pasin bilong ol. Tasol, sapos ol i no harim tok bilong yu, orait yu
  ken i yusim stik (kanda) na stretim ol. Lukim Ol Provep 13:24.\\n24 Sapos papa i
  no givim kanda long pikinini man bilong em, orait em i no lavim pikinini bilong
  em,\\ntasol papa i lavim pikinini man bilong em, em i save strong long stretim pikinini.\\nNa
  yu save, taim yu stretim pikinini bilong yu long stik, orait em i ken i kraikrai
  nogut tru. Yu ken i sori long kraikrai bilong em, tasol yu mas i stap strong. Long
  wanem? Lukim Ol Provep 23:13-14.\\n13 Yu no ken i lusim pasin bilong stretim pikinini;\\nSapos
  yu givim kanda long em, em i no inap i dai.\\n14 Givim kanda long em,\\nna bai yu
  sevim laip bilong em long hel.\\nOlsem na, yupela papamama, yupela mas strong long
  stretim pikinini bilong yupela. Yupela no ken i sukasuka long kraikrai bilong ol.
  Nogut ol i lus long hel. Mobeta ol i kisim liklik hevi nau na bihain ol i ken i
  stap laip long heven.\\nLukim Ol Provep 22:15.\\n15 Longlong i pas tumas long bel
  bilong pikinini,\\ntasol kanda bilong stretim bai rausim dispela pasin longwe long
  em.\\nPapamama i mas wok long rausim pasin nogut bilong pikinini bilong ol. Sampela
  taim yu ken i toktok na stretim ol. Tasol, sampela taim yu mas yusim stik na stretim
  ol. Papamama i no ken i les long dispela wok.\\nTasol harim. Yu no ken i kilim pikinini
  bilong yu long stik. Yu mas yusim isi isi bilong givim sampela pen long em tasol,
  na yu no ken i paitim paitim em i go i go na bagarapim em. Nogat tru! Sapos yu bagarapim
  pikinini bilong yu long stik, orait yu gat rong na yu ken i sanap long ai bilong
  lo.\\n3. Papamama i no ken i bagarapim tingting bilong pikinini.\\nLukim Efesus
  6:4 gen. Papamama, yupela no ken i sikrapim bel bilong pikinini bilong yupela na
  mekim em i bel hat long yupela.\\nYupela mas sindaun isi wantaim pikinini bilong
  yupela. Yes, sampela taim yu mas givim hatpela toktok long em bilong stretim em.
  Na yes, sampela taim yupela mas givim kanda long em bilong stretim em. Na dispela
  em i orait bikos pikinini em i save olsem, em i wokim rong na yupela laik stretim
  em.\\nTasol, yupela mas lukaut, nogut yupela krosim em nating o yupela stikim em
  nating. Sapos yu stikim em nating, orait yu bai bagarapim bel bilong em na em bai
  bel hat long yu na em bai hetim yu. Na dispela em i no gutpela na em i asua bilong
  papamama tasol.\\nYu no ken i tok nogut long em. Yu no ken i semim em nating long
  ai bilong ol sampela manmeri. Yu no ken i kirapim bel hat bilong em nating na sindaun
  na lap long em na tok pilai long em. Dispela em i no wei bilong lukautim pikinini
  bilong yu.\\nYumi mas lavim pikinini bilong yumi na mekim gut long em. Na long dispela
  wei pikinini bai rispektim papamama na sindaun isi aninit long papamama.\\n4. Na
  pikinini i mas harim tok bilong papamama na sindaun gutpela aninit long papamama.\\nLukim
  Efesus 6:1-3.\\n1 Yupela pikinini i laik bihainim Bikpela, yupela mas bihainim tok
  bilong papamama bilong yupela. Long wanem, Dispela pasin em i rait olgeta. 2 \u201cRispektim
  papa na mama bilong yu.\u201d Dispela em i fes lo i gat promis i stap wantaim. 3
  \u201cYu mas mekim olsem bai yu ken i stap gut na yu ken i stap laip longpela taim
  long dispela graun.\u201d (Lo 5:16)\\nDispela tok i klia olgeta. Ol pikinini i mas
  bihainim tok bilong papamama bilong ol. Long wanem? Long ai bilong God dispela em
  i rait olgeta. God i laik pikinini i stap isi aninit long papamama na harim tok
  bilong tupela na bihainim tok bilong tupela.\\nLas toktok.\\nMi laik mekim wanpela
  toktok bilong kirapim strong bilong yupela na yupela bihainim dispela toktok nau
  yumi bin kisim.\\nLukim Ol Provep 29:17.\\n17 Stretim pikinini man bilong yu na
  em bai kamapim bel isi long yu;\\nem bai kamapim gutpela amamas long laip bilong
  yu.\\nYupela papa, lavim meri bilong yu, na yupela mama, rispektim man bilong yu,
  na yutupela sindaun isi wantaim na i stap bes pren wantaim. Skulim pikinini bilong
  yupela long olgeta samting long sait bilong God. Stretim pikinini bilong yupela
  taim ol i mekim pasin nogut. Yu no ken i bagarapim bel bilong pikinini bilong yupela
  na ol i bel hat long yupela. Na pikinini, yu rispektim papamama bilong yu.\\nYumi
  i laik bihainim Jisas, yumi mas lukautim pikinini bilong yumi olsem. Dispela em
  i wei bilong God long sait bilong lukautim femili. Na pikinini bilong yupela bai
  kamapim gutpela amamas long laip bilong yupela.\\nEm Tasol.\"", "\"Moning.\\nLas
  wik, long Buk Song 4, yumi bin skelim wanpela hevi i kamap long king Devit. (Lukim
  Sande Baibel Toktok \u2013 \u201cStretpela pasin bilong God.\u201d ) Ol sampela
  manmeri ol i mekim tok bilong daunim gutpela nem bilong Devit na ol i givim sem
  long em, tasol tok bilong ol i no gat as bilong em na ol i tok giaman na ol i daunim
  em nating. Ol i tok Devit i mekim pasin nogut, tasol Devit em i no mekim pasin nogut
  olsem ol i tok. Em olsem na Devit i pilim hevi long dispela samting ol i mekim long
  em, na em i prea long BIKPELA na tokim BIKPELA long hevi bilong em.\\nNa Devit em
  i save olsem, em i no stretpela man olgeta. Em i klia olsem, em i gat sin i stap
  long laip bilong em olsem olgeta manmeri i gat sin i stap long laip bilong ol. Tasol
  Devit em no wokim ol pasin nogut olsem ol sampela manmeri i tok. Ol i giaman na
  sutim tok nating long Devit na Devit i pilim hevi na sem long tok bilong ol.\\nNa
  yumi save long dispela kain pasin. Long wanem, sampela taim ol sampela manmeri i
  sutim giaman tok long yumi na daunim yumi long sampela samting yumi no bin wokim.
  Na dispela kain pasin i kamapim hevi long yumi tu na yumi save pilim sem long ai
  bilong ol manmeri bilong ples.\\nTasol planti taim tumas yumi bel hat na yumi sutim
  tok nogut i go bek long ol manmeri i sutim giaman tok long yumi. Yumi bel hat na
  mekim kros toktok na toktok planti bilong daunim manmeri i daunim yumi. Yumi mekim
  giaman tok tu bilong bekim bek manmeri i mekim giaman tok long yumi. Na sampela
  taim yumi pait na solapim manmeri i daunim gutpela nem bilong yumi.\\nNa taim yumi
  slip long bet bilong yumi, yumi tanim tanim na yumi tingting tingting long hau yumi
  ken i bekim bek long manmeri i sutim giaman tok long yumi. Tru tumas, yumi no slip
  isi. Nogat. Yumi tingting planti na wariwari i go i go painim tulait.\\nOl dispela
  kain pasin bilong yumi em i no gutpela pasin bilong ol manmeri i bilipim na trastim
  feitful wok bilong Jisas. Long Buk Song 4 Devit i tokim yumi long sampela samting
  i ken i helpim yumi lusim dispela kain bel hat nogut bilong yumi na yumi slip isi.\\nTingting
  long lavim bilong God long yu.\\nDevit i klia olsem bel hat bilong em i ken i kamapim
  sin. Taim ol manmeri i mekim giaman tok long em bilong daunim em, orait em i bel
  hat, na dispela bel hat bilong em i ken i kamapim sin long bel bilong em na long
  laip bilong em. Em olsem na Devit i skulim em yet na em i skulim yumi tu long tingim
  BIKPELA na long trastim BIKPELA. Na pasin bilong tingim na trastim BIKPELA em i
  gutpela pasin bilong manmeri i stap aninit long God. Dispela pasin em i gutpela
  pasin bilong yumi i bilipim na trastim na bihainim Jisas. Lukim lain 4-5.\\nDEVIT
  I RAITIM DISPELA SONG. EM BILONG MAN I BOSIM MUSIK NA I GAT OL MUSIK SAMTING I GAT
  STRING.\\n1 God, Yu yet Yu stretpela pasin bilong mi,\\nplis harim prea bilong mi
  taim mi singaut long Yu.\\nTaim mi stap insait long hevi Yu bin givim bel isi long
  mi.\\nPlis mekim grasia long mi na harim prea bilong mi.2 Yupela ol man, hamas taim
  bai yupela wok long daunim gutpela nem bilong mi na mekim mi sem?\\nHamas taim bai
  yupela laikim ol tok i no gat as bilong em i stap,\\nna hamas taim bai yupela bihainim
  ol giaman tok?\\n3 Tasol yupela mas save olsem, BIKPELA i bin makim ol manmeri i
  bihainim wei bilong God na ol i bilong Em stret;\\nBIKPELA i save harim mi taim
  mi singaut long Em.4 Yupela ken i bel hat, tasol yupela no ken i mekim sin.\\nTaim
  yupela slip long bet bilong yupela,\\norait, long bel bilong yupela, yupela skelim
  gut na yupela pasim maus.\\n5 Yupela mas mekim ofa i stretpela,\\nna putim trastim
  bilong yupela i go long BIKPELA.6 Planti manmeri i tok olsem, \u201cMipela laik
  lukim ol gutpela samting.\\nBIKPELA, mekim lait bilong fes bilong Yu i kamap long
  mipela.\u201d\\n7 Taim kaikai na wain i kamap planti long gaden, mi save kisim bikpela
  amamas.\\nTasol, amamas Yu bin putim long bel bilong mi em i winim tru dispela amamas.8
  Taim mi laik slip, bai mi bel isi na slip;\\nmi bai bel isi na slip bikos BIKPELA
  Yu tasol Yu lukautim mi. Buk Song 4:1-8.\\nTaim yumi pasim maus bilong bel bilong
  yumi (yumi no tingting planti moa) na yumi tingim BIKPELA na trastim BIKPELA, orait
  i olsem yumi wokim naispela ofa. Na naispela ofa em i rait pasin bilong ol manmeri
  bilong God. God i laik lukim dispela kain pasin i kamap long bel na tingting bilong
  ol lain bilong Em.\\nNa taim yumi tingim BIKPELA, orait yumi tingim lavim bilong
  BIKPELA long yumi. God Em i no kisim bek yumi nating. Nogat. Jisas Em i lusim laip
  bilong Em long diwai kros bilong baim bek laip bilong yumi. God i kisim bek yumi
  long feitful baim bek wok bilong Jisas long diwai kros. Na dispela i soim lavim
  bilong God long yumi i pas long Jisas na i bilipim na trastim na bihainim Em. Lukim
  tok bilong aposel Jon.\\n9 God i bin soim lavim bilong Em namel long yumi long dispela
  wei \u2013 Em i bin salim dispela wanpela Pikinini Man bilong Em i kam long dispela
  graun, bai yumi kisim laip long wok bilong Em. 10 Dispela em i lavim \u2013 yumi
  no bin lavim God, tasol Em i bin lavim yumi na Em i salim Pikinini Man bilong Em
  i kam na Em i dai bilong pinisim bel hat bilong God long sin bilong yumi. 1 Jon
  4:9-10.\\n13 Man i lusim laip bilong em yet bilong helpim ol frens bilong em, em
  i lavim ol tru, na i no gat wanpela lavim i winim dispela lavim. Jon 15:13.\\nTaim
  yu tingim lavim bilong God long yu, orait bel bilong yu bai i stap isi. Maski ol
  manmeri i mekim nogut long yu, yu ken i holim tingting olsem, \u201cBIKPELA i lavim
  mi na Em i lusim laip bilong Em bilong kisim bek laip bilong mi.\u201d\\nKing Devit
  na King Jisas.\\nTingim. Pasin ol sampela manmeri i bin mekim long king Devit, orait
  ol manmeri i bin mekim long King Jisas tu. Ol i sutim giaman tok long Jisas bilong
  daunim Em. Ol i daunim gutpela nem bilong Jisas na ol i tokim Jisas olsem, \u201cYu
  wokboi bilong Seten.\u201d Jisas Em i mekim gutpela pasin long planti manmeri na
  Em i stretim sik bilong ol, tasol ol manmeri ol i hetim Em na ol i pasim tok bilong
  kilim Em i dai. Tru, pasin ol i wokim long king Devit, orait ol i bin wokim long
  King Jisas tu.\\nNa pasin ol i mekim long Jisas em i no stret na i no gutpela. Nogat.
  Tasol Jisas i pasim maus na Em i karim ol dispela hevi. Long wanem? Em i lavim yumi
  na Em i kam bilong lusim laip bilong Em bilong baim bek laip bilong yumi sin manmeri.\\nLavim
  bilong God i kamapim trupela amamas.\\nSampela manmeri i laik God i wokim ol planti
  samting bilong ol. Lukim lain 6. Na Devit i amamas na tok tenkyu long God long ol
  samting God i wokim bilong em long hia long dispela graun. Lukim lain 7. Tasol,
  bikpela samting tru bilong Devit i olsem, God i lavim em na God i lukautim em long
  feitful baim bek wok bilong Jisas long diwai kros. Taim Devit i tingim dispela lavim
  bilong God long wok bilong Jisas, orait em i amamas na dispela amamas i winim olgeta
  amamas long ol samting bilong dispela graun.\\nTaim yu slip long bet bilong yu,
  orait yu lusim bel hat bilong yu, na yu pulimapim tingting bilong yu long lavim
  bilong God long yu long feitful baim bek wok bilong Jisas long diwai kros, na yu
  trastim dispela lavim na lukautim bilong BIKPELA, na yu slip isi.\\nGlenn.\"", "\"George
  Brown na koleksen bilong em\\nDispela hap bilong web sait i gat lista bilong ol
  narapela risos i\\ngivim save long George Brown na koleksen bilong em. Mipela i
