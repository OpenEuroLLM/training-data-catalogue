  le dishere dile masome ale supa le botlhano gammogo le bobedi tsa dipesente (75.2%)\\n-
  Capricorn Capital Limited - e nang le dishere tsa dipesente dile lekgolo\\n- Cyan
  ES Limited - e nang le dishere tsa dipesente dile lekgolo\\n- Namibia\\n- Bank Windhoek
  Holdings Limited - e nang le dishere tsa dipesente dile masome ale supa le boraro\\n-
  Bank Windhoek Limited - e nang le dishere tsa dipesente dile masome ale supa le
  boraro (73%)\\n- BW finance Limited - e nang le dishere tsa dipesente dile masome
  ale supa le boraro (73%)\\n- Welwitschia Nammic Insurance Brokers Limited -e nang
  le dishere tsa dipesente dile masome a matlhano le borataro le sephatlo sa bosupa
  (56.7%)\\n- Namib Bou Limited -e nang le dishere dile dipesente tsa masome ale supa
  le boraro\\n- Santam Namibia Limited -e nang le dishere tsa dipesente dile lesome
