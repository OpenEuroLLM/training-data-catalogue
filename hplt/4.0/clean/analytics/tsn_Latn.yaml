  dishere tsa dipesente dile masome a mane le bone le botlhano(44.5%)\\n- Cavmont
  Capital Bank - e nang le dishere tsa dipesente dile masome a mane le bone le botlhano(44.5%)\\nMaloko[fetola
  | Fetola Motswedi]\\nTempolete:Asof, Banka e nale moloko mo mafelong a latelang:
  [3]\\n- Lephata le Legolo - Main Mall, Gaborone\\n- Lephata la Game City Mall -
