  maaka\u2014o re solofetsa gore otla re naya \u201cbotshelo jo bo sa khutleng.\u201d\u2014Johane
  3:16.\\nSE O TLHOKANG GO SE DIRA\\nIthute gore Lefoko la Modimo la reng.\u2014Johane
