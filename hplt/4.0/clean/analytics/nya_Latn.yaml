  zaposachedwa, zida zopangidwa ndi zinthu zosiyanasiyana zopanda zitsulo zapangidwa,
  monga zoumba, galasi, mphira, mapulasitiki, ndi zina zotero.\\nMakamaka zosiyanasiyana
  pulasitiki hardware ntchito polyamide, polypropylene ndi mapulasitiki uinjiniya,
  monga hardware bafa ndi mipope hardware.\\nMankhwala apulasitikiwa samangokhala
