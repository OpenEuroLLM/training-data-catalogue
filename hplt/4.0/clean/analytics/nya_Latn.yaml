  kupondaponda.\\nEna amatengera kuponya, ndiyeno chopanda kanthu chimadulidwa.\\nZinthu
  zomalizidwa nthawi zambiri zimasonkhanitsidwa pambuyo pa chithandizo chapamwamba.\\nZopangira
  zazing''ono zopangidwa ndi pulasitiki zimatulutsidwa, jekeseni, zimawumbidwa ndikumalizidwa
  ndi kumaliza kapena kuchiritsa pamwamba.\\nMagwiridwe Ntchito ya hardware zomangamanga
  ayenera kuonetsetsa miyeso yolondola, mbali yeniyeni ndi zigawo zikuluzikulu, ndi
  maonekedwe ndi pamwamba ayenera kuwala ndi yunifolomu.\\nKuonjezera apo, mankhwala
  osiyanasiyana ali ndi zizindikiro zowongolera malinga ndi ntchito zawo.\\nZomangamanga
  hardware ndi mbali yofunika yopuma dongosolo mkati ndi zipangizo zosiyanasiyana
