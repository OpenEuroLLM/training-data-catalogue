  zili ndi tanthauzo lochepa chabe - sizilenga ufumu wa Mulungu, ndiponso siziupanga
  kukhala woona ndi woona. Komabe, iwo amaloza kuposa iwo okha ku zomwe zikubwera.
  Amapanga kusiyana pano ndi pano, ngakhale sangathe kukhudza chilichonse. Amangopanga
  wachibale osati kusintha kwenikweni. Izi zikugwirizana ndi cholinga cha Mulungu
  kwa Mpingo mu m\u2019badwo woipa uno. Ena, amene amakonda kumamatira ku lingaliro
  lachipambano kapena lachete, adzatsutsa izi ndi kutsutsa kuti sikoyenera kapena
  ayi konse koyenera kutchulidwa kuvala zizindikiro zomwe zimangonena za ufumu wamtsogolo
