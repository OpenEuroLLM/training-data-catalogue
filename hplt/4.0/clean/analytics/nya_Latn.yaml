  azipereka kwa mwiniwake wa ng\u2019ombeyo, koma iye azitenga nyama yakufayo.\\n35
  Ng\u2019ombe ya munthu ikavulaza ndi kupha ng\u2019ombe ya mnzake, pamenepo azigulitsa
  ng\u2019ombe yamoyoyo ndi kugawana ndalamazo, ndipo azigawananso yakufayo.+\\n36
  Kapena ngati ng\u2019ombe inali kudziwika ndi chizolowezi chogunda zinzake, koma
  mwiniwake sanali kuiyang\u2019anira,+ azipereka ndithu+ ng\u2019ombe kulipira ng\u2019ombe,
  ndipo azitenga yakufayo.\"", "\"Hardware, chabwino?\\nChiyambi cha Hardware\\n[mawu]
  zida zazing''ono\\nPinyinxio\\nw\\njn gulu\\nZogulitsa za hardware nthawi zambiri
  zimagawidwa m''magulu awiri: hardware yayikulu ndi hardware yaying''ono.\\nDawujin
