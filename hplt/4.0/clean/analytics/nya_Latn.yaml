  Zizindikiro zimenezi si maganizo chabe, mawu, malingaliro kapena munthu payekha,
  wauzimu weniweni. zokumana nazo. Zizindikiro za Chikhristu za chikhulupiriro zimachitira
  umboni mu nthawi ndi mlengalenga, mu thupi ndi mwazi, za yemwe Yesu ali ndi momwe
