  masinthidwe ochirikiza\u2014ngati sangathe kuwongolera dziko lapansi kapena kupangitsa
  ena kukhulupirira Mulungu. Chomwe zotsutsazi sizikuganizira, komabe, ndi mfundo
  yakuti zizindikiro zosonyezedwa, zanthawi yochepa komanso zocheperapo zomwe Akhristu
  angakhazikitse pano ndi pano sizingawonekere payekhapayekha ku ufumu wamtsogolo
  wa Mulungu. Kulekeranji? Chifukwa zochita za chikhristu zimatanthauza kutenga nawo
  mbali mu ntchito yosalekeza ya Yesu, mwa mphamvu ya Mzimu Woyera. Kupyolera mwa
  Mzimu Woyera timatha kulowa nawo mfumu mu ulamuliro wake pano komanso tsopano mu
  nthawi ino ya dziko loipa \u2013 nthawi imene idzagonjetsedwe. Ambuye wa ufumu wamtsogolo
  wa Mulungu akhoza kulowererapo mu m''badwo uno ndi kugwiritsa ntchito umboni wosonyezedwa,
  wanthawi yochepa komanso wanthawi yochepa wa mpingo. Izi zimabweretsa kusiyana kwachibale
  koma kowoneka bwino pano ndi pano, ngakhale sizikubweretsa kusintha kwakukulu komwe
  kumabwera ndi kukwaniritsidwa kwa ufumu wa Mulungu.\\nKuwala kwa ufumu wamtsogolo
  wa Mulungu kumatifikira ndi kutiunikira panjira yathu m\u2019dziko lamdimali. Monga
  momwe kuwala kwa nyenyezi kumaunikira mdima wa usiku, zizindikiro za Tchalitchi,
  zopezeka m\u2019mawu ndi m\u2019zochita, zimaloza ku ufumu wamtsogolo wa Mulungu
  mu kuwala kwadzuwa masana. Tizigawo tating''onoting''ono ta kuwala timakhala ndi
  zotsatira, ngakhale zitangotchulidwa, kwakanthawi komanso kwakanthawi. Kupyolera
  mu ntchito yachisomo ya Wamphamvuyonse timakhala zida zokhala ndi zizindikiro ndi
  maumboni athu, kutsogozedwa mukuchita kwa mawu a Mulungu ndi Mzimu Woyera. Munjira
  imeneyi tikhoza kukhudza anthu ndi kutsagana nawo ndi Khristu ku ufumu wake wamtsogolo.
  Mulungu mwini akugwira ntchito pano ndipo tsopano ufumuwo usanathe. Ndife akazembe
  a Khristu; chifukwa Mulungu amatichenjeza kudzera mwa ife (2. Akorinto 5,20). Kupyolera
  m\u2019mau olalikira, monga agwiritsiridwa ntchito ndi Mzimu Woyera, Mulungu amatheketsa
  kale anthu kupyolera mu chikhulupiriro chawo mwa mzimu, monga nzika za ufumu wamtsogolo
  wa Mulungu, kutengamo mbali mu ufumu umenewu (Aroma 1,16). Chikho chilichonse chamadzi
  choperekedwa m''dzina la Khristu sichimaperekedwa (Mateyu 10,42). Choncho sitiyenera
  kunyalanyaza zizindikiro kapena umboni wa okhulupirira a mpingo wa Mulungu monga
  zizindikiro zosakhalitsa, zowona kapena zizindikiro zosonyeza chinthu chomwe sichinakhale
  chenicheni. Kristu amawonjezera ntchito yathu yoika zizindikiro kwa iye mwini ndipo
  amagwiritsa ntchito umboni wathu kukokera anthu kukhala naye paubwenzi. Chotero
  amamva kukhalapo kwa ulamuliro wake wachikondi ndipo amapeza chisangalalo, mtendere
  ndi chiyembekezo kupyolera mu ulamuliro wake wolungama, wodzazidwa ndi chikondi.
