  malingaliro ndi kukonzekera, komanso mgwirizano wapagulu ndi anthu. Wamphamvuyonse
  akhoza kuwagwiritsa ntchito kudzera mwa Mzimu Woyera ndipo amachitanso izi kuti
  akwaniritse cholinga chawo: kutsogoza kwa Mulungu mwa Khristu. Mau oyamba oterowo
  amabala zipatso m\u2019mawonekedwe a kusinthika kumene kumadza pa kulapa (kulapa
  kapena kusintha kwa moyo) ndi chikhulupiriro, komanso m\u2019moyo wodzala ndi chiyembekezo
  cha ufumu wamtsogolo wa Mulungu.\\nChoncho timapereka nthawi yathu, mphamvu zathu,
  chuma chathu, luso lathu komanso nthawi yathu yaulere kuti tigwiritse ntchito. Timalimbana
  ndi mavuto a anthu ovutika m\u2019dziko lathu lino. Timalowererapo kuti tithandizire
  pazochita zathu komanso kudzipereka kwathu, komwe timagawana ndi anthu amalingaliro
  amodzi mkati ndi kunja kwa ma parishi athu. Kupangidwa kwa nkhawa zapadziko lapansi
  kumachitikanso mogwirizana ndi omwe sali m''madera awa. Umboni wathu wachikhulupiriro
  umene timatengera pa Tsono Funsani ukhoza kukhala wapayekha komanso wapakamwa, koma
  uyeneranso kuchitidwa poyera komanso pagulu. Pochita zimenezi, tiyenera kugwiritsa
  ntchito njira zonse zimene tingathe. Ndi zonse zimene tili nazo, kuchita ndi kunena,
  tikutumiza uthenga wofanana m\u2019njira zonse zofikiridwa kwa ife, kulengeza amene
  Mulungu ali mwa Kristu ndi kuti ulamuliro wake udzakhala wotsimikizirika ku ntha\u0175i
  zonse. Tikukhala pano ndi tsopano, ngakhale m\u2019dziko lauchimo, mu chiyanjano
  ndi Kristu ndi chiyembekezo cha kutha kwa ulamuliro wake. Tikukhala ndi chiyembekezo
  chakumwamba kwatsopano ndi dziko lapansi latsopano m\u2019nthawi ya dziko. Tikukhala
  mu nthawi ino podziwa kuti dziko lapansi likupita - chifukwa chifukwa cha mawu a
  Yesu Khristu ndi kulowererapo kwake, zilidi. Tikukhala m\u2019chitsimikizo chakuti
  ufumu wa Mulungu ukuyandikira mu ungwiro wake \u2013 chifukwa ndi momwe uliri!\\nChifukwa
  chake, opanda ungwiro, opanda ungwiro, komanso osakhalitsa, umboni womwe tili nawo
  ngati akhristu ndiowona mwanjira yoti umakhudza momwe zinthu ziliri panopo komanso
  ubale wathu wonse, ngakhale utakhala ufumu wa Mulungu wamtsogolo womwe wayandikira
  Pano ndipo pano suli pano changwiro, chosawonetsedwa m''zochitika zake zonse. Ndizowona
  mwanjira yoti, chifukwa cha chisomo cha Mulungu, timagawana ngati mbewu ya mpiru
  mu zomwe Wamphamvuyonse akuchita pakadali pano kudzera mwa Mzimu Woyera kuloza anthu
  kwa Yesu Khristu ndi ufumu wake wamtsogolo. Titha lero kulandira nawo madalitso
  ena aulamuliro wa Khristu ndi ufumu wake, malinga ndi chifuniro cha Mulungu, munjira
  zathuzathu komanso pagulu.\\nZoona zowululidwa\\nKuti izi zidziwike bwino, ziyenera
  kunenedwanso kuti ndi zomwe timachita sitikonzekeretsa maziko enieni a ulamuliro
  wa Khristu, kapena kuwulungamitsa. Mulungu, Atate, Mwana ndi Mzimu Woyera achita
  kale izi. Ufumu wamtsogolo wa Mulungu ndi wowona ndipo wakwaniritsidwa kale. Tikutsimikizika
  kuti abweranso. Titha kudalira. Izi sizidalira pa ife. Ndi ntchito ya Mulungu. Ndiye
  timakwaniritsa chiyani ndi umboni wathu, zizindikilo zomwe tapanga, pomwe ufumu
  wa Mulungu suzindikirika kapena kukhala zenizeni? Yankho ndilakuti zizindikiro zomwe
  tikupanga zikuwulula, mu zidutswa, ufumu wakudza wa Mulungu. Ntchito yathu yapano
  - mwayi wathu - ndikuchitira umboni, m''mawu ndi zochita, zenizeni za ufumu wa Mulungu.\\nNanga
  mapeto, kubweranso kwa Khristu, kudzachitika chiyani? Kubwera kwake kwachiwiri sikumapereka
  chenicheni ku ufumu wa Mulungu, ngati kuti unali ndi kuthekera kofunikira kufikira
  nthawiyo. Ndi zenizeni zenizeni lerolino. Yesu Khristu ali kale Ambuye, Mombolo
  wathu ndi Mfumu. Iye amalamulira. Koma ufumu wa Mulungu ukadali wobisika mpaka pano.
  Kukula kokwanira kwa ulamuliro wake sikukufika pamlingo wokwanira m\u2019ntha\u0175i
  ya dziko loipali. Khristu akadzabweranso, ufumu wa Mulungu udzaonekera mu ungwiro
  ndi zotsatira zake zonse. Kubwerera kwake kapena kuwonekeranso (parousia yake) kudzatsagana
  ndi vumbulutso kapena kuwululidwa (apocalypse) chowonadi ndi zenizeni za yemwe iye
  ali ndi zomwe wachita; panthawiyo chowonadi chenicheni cha yemwe Khristu ali ndi
  zomwe adzakhale iye. anatichitira ife, chifukwa cha chipulumutso chathu, chivumbulutsidwe
  kwa onse. Pamapeto pake zidzaululika chimene chinapanga munthu ndi utumiki wa Yesu
  Khristu. Ulemerero wa zonsezi udzawala paliponse ndipo motero kukulitsa zotsatira
  zake zonse. Nthawi yongopereka umboni, wongoyembekezera komanso wanthawi yochepa
  idzatha. Ufumu wa Mulungu sudzabisikanso. Tidzalowa kumwamba kwatsopano ndi dziko
  lapansi latsopano. Sipafunikanso chiphaso; pakuti tonse tidzayang''ana zenizeni
  m''maso. Zonsezi zidzachitika pa kubweranso kwa Khristu.\\nTsono moyo wachikhristu
  suli wokhudza kupanga ufumu wa Mulungu kugwira ntchito. Si ntchito yathu kutseka
  kusiyana pakati pa chenicheni cha dziko la uchimo ndi kuyenera kwa ufumu wa Mulungu
  pa dziko lapansi. Sikuli kupyolera mu zoyesayesa zathu za Wamphamvuyonse kuti iye
  amachotsa chenicheni cha chilengedwe chophwanyika, chotsutsidwa ndi kuchilo\u0175etsa
  m\u2019malo mwake ndi malingaliro abwino a dziko latsopano. Ayi, m\u2019malo mwake
  zili choncho kuti Yesu ndiye Mfumu ya mafumu onse ndi Mbuye wa ambuye onse ndi kuti
  ufumu wake \u2013 ngakhale udakali wobisika \u2013 ulikodi ndipo ulikodi. Masiku
  ano, dziko loipali lidzapita. Tsopano tikukhala, kunena kwake titero, m\u2019choonadi,
  m\u2019chisonyezero chovunda, chokhotakhota, chonama cha cholengedwa chopangidwa
  bwino cha Mulungu, chimene Kristu wachipezanso mwa kuchibwezeretsa panjira yolondola,
  chogonjetsa mphamvu za zoipa. Mwanjira imeneyi, likhoza kukwaniritsa cholinga chake
  choyambirira chokwaniritsa dongosolo la Mulungu. Chifukwa cha Khristu, zolengedwa
  zonse zidzamasulidwa ku ukapolo ndipo kubuula kwake kudzatha (Aroma 8,22). Khristu
  akupanga zonse kukhala zatsopano. Ndicho chenicheni chofunikira kwambiri. Koma chenicheni
  ichi sichinavumbulutsidwebe kwathunthu. Kale tsopano, mosonkhezeredwa ndi Mzimu
  Woyera wa Mulungu, tingathe kupereka umboni, kwakanthawi ndi kwakanthawi, m\u2019mbali
  zonse za moyo, ponena za chenicheni chamtsogolo chimenecho, ndipo pochita zimenezo
  sitichitira umboni za zotheka chabe, ndipo ndithudi ayi. chimodzi chimene ife tikuchizindikira,
  koma kwa Khristu ndi ufumu wake, umene tsiku lina udzawululidwa mu ungwiro. Chowonadi
  ichi ndi chiyembekezo chathu chovomerezeka - chomwe tikukhalamo lero, monga momwe
  timachitira tsiku lililonse.\\nChikhalidwe cha Dziko ndi Ndale Kodi zimenezi zikutanthawuza
  chiyani pankhani ya boma ndi ndale kwa Akristu amene amavomereza ulamuliro wa Kristu
  ndi kukhala ndi chiyembekezo cha ufumu wa Mulungu umene ukubwerawo? Vumbulutso la
  m''Baibulo siligwirizana ndi lingaliro la \\\"kulanda\\\" kwa Mkhristu chipani chilichonse
  cha ndale, dziko, kapena bungwe lomwe liri kunja kwa gulu lachipembedzo. Koma sizikufunanso
  kusokoneza - zomwe zikuwonetsedwa mu mawu akuti \\\"kupatukana\\\". Khristu analalikira
  kuti tisakhale otalikirana ndi dziko lauchimo ndi loipali (Yohane 17,15). Pamene
  anali ku ukapolo m\u2019dziko lachilendo, Aisrayeli anapatsidwa udindo wosamalira
  mizinda imene ankakhala9,7). Danieli anatumikira Mulungu pakati pa miyambo yachikunja
  ndikuthandizira pa izo, pamene nthawi yomweyo anali wokhulupirika kwa Mulungu wa
  Israeli. Paulo akutilimbikitsa kupempherera boma ndi kulemekeza mphamvu za anthu
  zimene zimalimbikitsa zabwino ndi kuletsa zoipa. Iye amatilangiza kuti tikhalebe
  ndi mbiri yabwino ngakhale pakati pa anthu amene sakhulupirira Mulungu woona. Mawu
  ochenjezawa akutanthauza kukhudzana ndi chidwi komanso kutengera udindo monga nzika
  komanso m''mabungwe - osati kudzipatula.\\nZimene Baibulo limaphunzitsa zimasonyeza
  kuti ndife nzika za nthawi ino. Koma panthawi imodzimodziyo, imalengeza kuti, chofunika
  kwambiri, ndife nzika za ufumu wa Mulungu. Paulo analemba m\u2019makalata ake kuti:
  \u201cSimulinso alendo ndi alendo, koma okhala m\u2019banja limodzi ndi oyera mtima
  ndi a m\u2019banja la Mulungu.\u201d ( Aefeso. 2,191) nati: \u201cKoma ife nzika
  zathu zili Kumwamba; kuchokera kumene tikuyembekezera Mpulumutsi, Ambuye Yesu Khristu.\u201d
  (Afilipi 3,20). Akhristu ali ndi unzika watsopano umene mosakayikira umatsogolera
  pa chilichonse cha dziko. Koma sizimachotsa ufulu wathu wakale wachibadwidwe. Pamene
  anali m\u2019ndende, Paulo sanakane kuti anali nzika ya Roma, koma anaugwiritsa
  ntchito kuti amasulidwe. Monga Akhristu, timaona unzika wathu wakale - pansi pa
  ulamuliro wa Khristu - ukugwirizana kwambiri ndi tanthauzo lake. Panonso timakumana
  ndi vuto lalikulu lomwe lingatipangitse kuthetsa vutolo mopupuluma kapena kuchepetsa
  vutolo. Koma chikhulupiriro, chiyembekezo, ndi chikondi zimatitsogolera kuti tipirire
  zovuta chifukwa cha kuchitira umboni za ufumu ndi umbuye wa Khristu.\\nKukhala nzika
  ziwiri\\nPotsatira mawu ofotokozera a Karl Barth a chiphunzitso cha m\u2019Baibulo
  ndi kulingalira chiphunzitso cha Tchalitchi m\u2019mibadwo yonse, zingawonekere
  kuti awo amene ali a Kristu ndi ufumu Wake m\u2019nyengo yamakono ino ali m\u2019mipingo
  i\u0175iri yosiyana kwambiri. Tili ndi unzika wapawiri. Mkhalidwe wovuta umenewu
  wa zinthu ukuwoneka wosape\u0175eka chifukwa chakuti umagwirizana ndi chowonadi
  chakuti pali mibadwo i\u0175iri yapadziko yoponderezedwa, koma potsirizira pake
  imodzi yokha, yamtsogolo, ndiyo idzalamulira. Ufulu wathu uliwonse umakhala ndi
  ntchito zomwe sitingathe kuzichotsa, ndipo n''zosakayikitsa kuti izi zikhoza kutsutsana
  wina ndi mzake. Makamaka, palibe chitsimikizo kuti palibe mtengo womwe udzalipidwe
  pokhudzana ndi udindowo. Chotero Yesu akulangiza ophunzira ake kuti: \u201cKoma
  chenjerani; Pakuti adzakuperekani ku mabwalo a milandu, ndipo adzakukwapulani m\u2019masunagoge,
  ndipo adzakutengerani kwa abwanamkubwa ndi mafumu chifukwa cha ine kukhale umboni
  kwa iwo.\u201d3,9). Mikhalidwe yofananayo, yosonyeza zimene zinachitikira Yesu mwiniyo,
  ikulondoleredwa m\u2019buku lonse la Machitidwe. Choncho mikangano yapakati pa maufulu
  a anthu awiriwa ingabuke, imene siingathe, ngati n\u2019komwe, kuthetsedwa kotheratu
  m\u2019dziko lino.\\nKuphatikiza ntchito ziwiri ndi malo amodzi owona\\nNdikofunikira
  kuzindikira momwe magawo awiriwa agwirizane moyenera. Nthawi zambiri sizothandiza
  kuwatenga ngati opikisana, ngakhale atakhala kuti nthawi zina amakangana. Sizothandizanso
  kuwawona motsatira dongosolo, momwe nthawi zonse pamakhala zofunikira ndikuyika
  zolemetsa zotsatirazi, zomwe zikutanthauza kuti chinthu chachiwiri kapena chachitatu
  kapena lingaliro limangogwiritsidwa ntchito zinthu zofunika kwambiri zisanachitike.
  Poterepa, zimakhalira kwa ambiri, mwinanso ambiri, pantchito zachiwiri zomwe zimasiyidwa
  ndikunyalanyazidwa.\\nKuphatikiza apo, sizomveka kusankha njira zosinthidwa pang''ono,
  motsatira momwe zinthu ziliri, malinga ndi zomwe zinthu zina zazing''ono zimachitidwa,
  chifukwa zimasungidwa kuzinthu zoyambirira. Malinga ndi njirayi, tiwonetsetsa kuti
  tikugwira ntchito zoyambilira mu parishiyo kuti tichitenso chilungamo pantchito
  zachiwiri za parishiyo, ngati kuti anali odziyimira pawokha ndikutsatira miyezo,
  miyezo, zolinga zawo zomwe zimatsimikizira momwe udindo umawonekera kunja kwa mpingo.
  Njira yotereyi imabweretsa chigawo chomwe sichichita chilungamo poti ufumu wa Mulungu
  walowa kale mdziko lino ndipo chifukwa chake tikukhala, tikulumikizana pakati pa
  nthawi. Lingaliro lazofunikira zamboni za tchalitchi nthawi zonse zimakhudza momwe
  timafikira ku sekondale, gulu lathu ladziko. Maofesi awiriwa amagundana, pomwe chiyembekezo
  chathu mu ufumu wamtsogolo wa Mulungu ndikuchitira umboni, zochita zathu zonse -
  kukhala izi patsogolo - ufumu wa Mulungu sudzakhalanso wobisika kapena wachiwiri.
  Poyang''anizana ndi ulamuliro wa Khristu komanso umodzi wamtsogolo womwe Mulungu
  amapereka kwa zolengedwa zonse ndi ungwiro wa zinthu zonse pansi pa Khristu monga
  Mfumu ya mafumu ndi Mbuye wa ambuye, dzina la Wamphamvuyonse ndilo pakati pazochitika
  zonse - pakati pa onse Ntchito zonse zaanthu ziyenera kukonzedwa, kupangidwa mwadongosolo
  ndi kukonza kuti zithandizire pomwepa, ndipo ziyenera kugwiranso ntchito. Lingalirani
  za Utatu wa Mulungu monga cholinga cha magulu angapo omwe amakhala pakatikati. Yesu
  Khristu ndi ufumu wake wamtsogolo ndiye likulu ili. Mpingo wa Khristu umamudziwa
  komanso kumamupembedza iye yekha ndipo umakhala mkati mwa bwalo lozungulira pakati.
  Mpingo umadziwa malo awa. Amadziwa za mawonekedwe a ufumu wamtsogolo. Chiyembekezo
  chake chimakhazikitsidwa pa malo otetezeka, ndipo ali ndi lingaliro lolondola la
  chikhalidwe cha chikondi, chachilungamo mpaka kuyanjana koona kwa anthu mwa Khristu.
  Utumiki wanu ndikuwulula malo apakatiwa ndikuyitanitsa ena kuti alowe mu bwaloli
  chifukwa ndilo gwero la moyo wawo ndi chiyembekezo. Onse akuyenera kukhala m''magulu
  onse awiri! Pakatikati pa kukhalapo kwawo ndi nthawi yomweyo pakatikati pa kupezeka
  kwa tchalitchiko, ngakhale ntchito yawo yokhulupirika imagwira ntchito kokha komanso
  koposa zonse kudera lonse. Malinga ndi kutha kwake, Mulungu mwa Khristu ndiye likulu
  la zolengedwa zonse motero m''magulu onse awiriwa. Yesu Khristu ndiye Mbuye ndi
  Muomboli wa zolengedwa zonse - zamphamvu zonse ndi ulamuliro, kaya ukudziwa kapena
  ayi.\\nParishi yakunja kwa mpingowu imatha kuganiziridwa ngati bwalo lozungulira
  lomwe lili patali kwambiri ndi bwalo lamkati la parishiyo. Sichimadziwa za malowo,
  kapena kuwazindikira, ndipo ntchito imene Mulungu wapereka sikutanthauza kuisonyeza.
  Cholinga chake sikutenga udindo wa parishi kapena kuyisintha (monga momwe adayesedwera
  ku Germany ya Nazi ndikuvomerezedwa ndi atsogoleri a tchalitchi cha Germany). Komabe,
  mpingo suyenera kutenga udindo wake monga mpingo waukulu, titero kunena kwake. Koma
  parishi ya m''madera ozungulira imagawana nawo malo omwewo, ndipo tsogolo lake likugwirizana
  ndi Yesu, Ambuye ali pamwamba pa nthawi zonse ndi malo onse, pa mbiri yonse ndi
  ulamuliro wonse. Mpingo wapachiweniweni monga tikudziwira suli wodziyimira pawokha
  kuchokera ku malo wamba, chowonadi chamoyo chomwe mpingo umazindikira ndi momwe
  ntchito yake yayikulu ya kukhulupirika ikugwira ntchito. ndi ulamuliro wake wamtsogolo.
  Ndipo imachita chilungamo pa ntchitoyi poyesa kupereka mawonekedwe mkati mwa mpingo
  waukuluwo ku machitidwe, mitundu ya anthu ndi kuthekera kolumikizana ndi anthu,
  zomwe - ngakhale mwanjira ina - zimatanthawuza zenizeni zenizeni. Zisonyezero za
  njira ya moyo imeneyi, zimene zimabwera m\u2019mbali zambiri za ntchito, zidzaonekera
  m\u2019makhalidwe achipembedzo kapena ofanana nawo. Koma iwo adzatha kufotokoza
  mosadziwika bwino, mosadziwika bwino, mwina osati motsimikiza komanso mopanda tanthauzo.
  Komabe, zimenezi ziyenera kuyembekezera. Mpingo waukulu suyenera kukhala mpingo.
  Koma liyenera kumapindula nalo mosalekeza, popeza kuti mamembala ake amayesetsa
  kuyankha mlandu kwa ilo komanso kwa Ambuye.\\nZizindikiro zofananira zoteteza ndi
  kuteteza\\nKuti tisunthire m''nthawi ino, nthawi yoipa yapadziko lonse lapansi imamveka
  bwino kwa iwo omwe ali mdera lino lokhalamo anthu omwe amayika chiyembekezo chawo
  mtsogolo mdziko lapansi ndipo amadziwa ndikupembedza malo okhala. Maziko aumulungu
  ndi magwero auzimu olumikizana momasuka ndi Mulungu, chifukwa cha Yesu Khristu,
  sanawululidwe kapena kugwiritsidwa ntchito mwaufulu kudzera muntchito zachitukuko
  zomwe zimachitika poteteza anthu ozungulira. Koma machitidwe, miyezo, mfundo, malamulo,
  malamulo, kukhala ndi mayendedwe mdera lonsezi zitha kulumikizidwa kapena, monga
  momwe ziliri, kuphatikiza ndi moyo womwe Mulungu watisungira mwa Khristu. Chisonkhezero
  chachikhristu chidzapangidwa kuti chiphatikize mwanzeru mbali yayikulu yaudindo,
  kuyesetsa kukhazikitsa momwe zingathere pakadali pano njira zamabungwe, mfundo ndi
  machitidwe omwe amagwirizana kwambiri ndi zolinga ndi njira za Mulungu - njira zomwe
  tsiku lina kuwululidwa ku dziko lonse lapansi. Titha kunena kuti mpingo, mpingo
  wokulirapo, umakhala ngati chikumbumtima. Imayesetsa kutchinjiriza tchalitchichi
  kuti chisapite patali ndi tsogolo la Mulungu komanso chikonzero cha anthu. Ndipo
  izi sizichita kudzera pakulalikira kwake kokha, komanso kudzera pakutengapo gawo,
  komwe mosakayikira sikungakhaleko popanda kulipira. M''mawu ndi zochita, amateteza
  komanso kusamalira, ngakhale nzeru, machenjezo ndi kudzipereka kwake nthawi zina
  amanyalanyazidwa kapena kukanidwa.\\nLolani zizindikiro zosadziwika za chiyembekezo\\nMamembala
  a mpingo akhoza kulemeretsa chikhalidwe chawo - monga mphamvu yoyendetsa galimoto
  kapena chitsanzo chowala - ndi zopindulitsa zakuthupi, komanso kudzera m''mabungwe
  opangidwa ndi kupanga zomwe zimadyetsedwa ndi Uthenga Wabwino wa Khristu. Koma umboni
  wotero udzangogwira ntchito ngati chilozero chosalunjika, kungochirikiza utumiki
  wachindunji ndi uthenga wa mpingo wonena za Mulungu mwa Khristu ndi kukhalapo ndi
  kudza kwa ufumu wake. Zochita za kulenga izi, zomwe zimakhala ngati zizindikiro
  zosalunjika, siziyenera kulowa m''malo moyo wa mpingo kapena uthenga wake wapakati
  ndi ntchito. Yesu, Mulungu kapena Malemba Opatulika mwina sadzatchulidwa konse.
  Gwero lomwe limadyetsa izi silimatchulidwa kawirikawiri (ngati lilibe), ngakhale
  kuti aura ya Khristu imamangiriridwa ku zochitika kapena kukwaniritsa. Pali malire
  ku maumboni osalunjika oterowo. Iwo mwina adzakhala osadziwika bwino poyerekeza
  ndi maumboni achindunji ndi ntchito ya Mpingo. Zotsatira zake mwina zitha kukhala
  zosagwirizana kwambiri ndi mawu atchalitchi ndi umboni. Nthawi zina malingaliro
  opangidwa ndi akhristu, omwe amakhudza ubwino wa onse, savomerezedwa ndi mabungwe
  a boma kapena achinsinsi, magulu a mphamvu ndi maulamuliro, kapena amakhala ndi
  zotsatira zochepa chabe. Ndiponso, zikhoza kukhazikitsidwa m\u2019njira zimene zingakhudze
  kwambiri ufumu wa Mulungu. Utumiki wa Chuck Colson''s Prison Fellowship, womwe umagwira
  ntchito m''ndende za boma ndi boma, ndi chitsanzo chabwino. Komabe, sikungayerekezedwe
  kuti ndi chikoka chochuluka bwanji chomwe chinganenedwe. Zina mwa zinthu zomwe zapindula
  zingakhale zosakhalitsa. Padzakhalanso zolephera. Koma amene amalandira maumboni
  osakhala achindunji amene\u0175a, amene amasonyeza\u2014ngakhale kuti ali kutali\u2014chifuniro
  cha Mulungu ndi chikhalidwe chake m\u2019njira imeneyi amasonkhanitsidwa ku mtima
  wa zimene mpingo umapereka. Umboni umagwira ntchito ngati kukonzekera ulaliki usanayambe.\\nNtchito
  yayikulu ya anthu oyandikana nawo ndikuwonetsetsa kuti pali bata komanso chilungamo
  kuti mpingo utha kuchita chilungamo pazochitika zake zofunika, zauzimu monga gulu
  lachipembedzo komanso mamembala ake azitha kuchitira umboni wawo wosagawanika mdera
  lonse. Izi zithandizira kuwonetsetsa kuti malamulo akutsata malamulo komanso chilungamo
  chaboma. Cholinga chidzakhala chokomera onse. Chisamaliro chimatengedwa kuti chisapezere
  mwayi ofooka ndi amphamvu.\\nZikuoneka kuti zimenezi n\u2019zimene Paulo anali kuganiza
  pamene, monga mmene tima\u0175elenga pa Aroma 13 , anafotokoza za udindo woyenela
  kwa akuluakulu a boma. Zingasonyezenso zimene Yesu ankatanthauza pamene ananena
  kuti: \u201cPatsani za Kaisara kwa Kaisara, ndi za Mulungu kwa Mulungu.\u201d (
  Mateyu 22,21), ndi zimene Petro anafuna kufotokoza m\u2019kalata yake: \u201cGonjerani
  ku machitidwe onse a anthu, chifukwa cha Ambuye; amene amachita zabwino\u201d (1.
  Peter 2,13-14 ndi).\\nWolemba Gary Deddo\""]'
