  koma sanandifotokozere chifukwa chomwe alibe zida zanga ndipo agulitsa.\\nKUSOWA
  KWA UTALIKI\"", "\"Kodi Nitrile Rubber ndi chiyani?\\nNitrile labala amapangidwa
  kuchokera ku butadiene ndi acrylonitrile ndi emulsion polymerization. Mafuta odzola
  amapangidwa makamaka ndi lotion polymerization pa kutentha kochepa. Choncho, kukana
  kwake kuvala ndi kukana kutentha kumakhala kolimba ndipo kumamatira kwake kuli bwino.
  Pang''onopang''ono imakhala zinthu zofunika kwambiri zotanuka m''magalimoto, ndege,
  petroleum, fotokopi, ndi mafakitale ena.\\nMonomer ya Butadiene ili ndi mitundu
  itatu yosiyana siyana: CIS, trans, ndi magulu owotchedwa 1,2. Nthawi zambiri, zinthu
  zopangidwa ndi mphira wa nitrile zimakhala pafupifupi 78%. Kuphatikiza apo, mawonekedwe
  ake a unyolo wa ma cell amakhala ndi gulu la cyano, kotero kukana kwake kwamafuta
  kuli bwino kuposa mphira wamba. Mapiritsiwa amaphatikizapo mphira wachilengedwe,
  mphira wa neoprene, ndi styrene-butadiene; Pakati pawo, kukana mafuta kumayang''ana
  kwambiri mafuta amchere, mafuta amadzimadzi, mafuta anyama ndi masamba, komanso
  zosungunulira.\\nKuchita bwino kwambiri kwa Nitrile ndikukana mafuta. Ndi kukana
  kwake kwamafuta, mphira wa nitrile nthawi zambiri umagwiritsidwa ntchito popanga
  zinthu za rabala zosagwira mafuta. Labala ya Nitrile imatha kugwiritsidwa ntchito
  kwambiri popanga zinthu zosiyanasiyana zamphira zosagwira mafuta, kuphatikiza ma
  gaskets osamva mafuta, manja, ma CD osinthika, payipi yosinthika, machira osindikizira
  ndi utoto, zida za mphira, etc.\\nUbwino wina wa mankhwala a mphira wa nitrile ndikuti
  ali ndi kutentha kwapamwamba kwambiri poyerekeza ndi ma rubber ena, ndipo kutentha
  kwawo kwanthawi yayitali kumatha kufika 120 \u2103; Kutentha kotsika kwambiri kwa
  galasi kumatha kufika -55 \u2103. Palinso zovuta zina. Nthawi yomweyo, ntchito yake
  yotchinjiriza si yabwino kwambiri ndipo kukhazikika kwake kumakhala kotsika.\\nKodi
  Silicone Rubber ndi chiyani?\\nDzina lachingerezi la silika gel ndi Silica gel kapena
  Silica, mankhwala opangidwa ndi mSiO2 nH2O, ndipo amathanso kutchedwa silika gel.
  Ndizinthu zokopa zomwe zimakhala ndi zochitika zambiri, ndipo mawonekedwe ake ndi
  amorphous. Gel silika nthawi zambiri mandala kapena yamkaka woyera granular olimba;
  Mapangidwewa ndi apadera ndipo amatsegula porous. Kapangidwe kameneka kamapereka
  zinthu zabwino zotsatsa zinthu zambiri, ndipo zimakhala ndi ma adsorption abwino.
  Kuphatikiza apo, itha kusinthidwanso kukhala hydrated silica gel, yomwe imakhala
  yolimba. Njira yeniyeni ndikuwonjezera sulfuric acid (kapena hydrochloric acid)
  ku njira yamadzimadzi ya sodium silicate mu static state. Kenaka yambani ma ion
  a electrolyte, monga Na + ndi SO42 - (Cl -) ndi madzi oyera. Pambuyo kuyanika, gel
  osakaniza a silica amatha kupezeka. Kufotokozera mphamvu ya kutengeka kwake, kutenga
  madzi mwachitsanzo, mphamvu ya adsorption imatha kufika pafupifupi 40% ndipo yamphamvu
  imatha kufika 300%. Chifukwa cha mawonekedwe a silika gel osakaniza, amatha kugwiritsidwa
  ntchito ngati kuyanika gasi, kuyamwa kwa gasi, kutaya madzi m''thupi, chromatography,
  chothandizira, ndi zina zotero. Ndipo pamagwiritsidwe ake enieni, mtundu wa gel
  osakaniza ndi wosiyana. Mwachitsanzo, cobalt chloride ikawonjezedwa: ndi buluu pamalo
  owuma, ofiira atatha kuyamwa madzi, ndipo angagwiritsidwe ntchito mobwerezabwereza.
  Ngati mukuyang''ana kuti mubweretse malonda apamwamba kwambiri a silicone mu bizinesi
  yanu, ganizirani Suconvey silicone mphira katundu wogulitsa mayankho opanga momwe
  mungapangire mapulojekiti anu otsatira kukhala opindulitsa!\\nChigawo chachikulu
  chomwe chili mu silika gel ndi silika. Mankhwala a silika ndi okhazikika. Sisungunuka
  m''madzi kapena kusakanikirana ndi madzi. Chifukwa cha mawonekedwe a silika, silika
  gel sikophweka kuwotcha ndipo katundu wake ndi wokhazikika. Panthawi yokonza, fumbi
  lomwe lili mumsonkhanowu liyenera kuyendetsedwa mkati mwa 10mg/m3. Panthawi imodzimodziyo,
  ogwira ntchito amafunika kulimbikitsa mpweya wabwino komanso kuvala masks. Kuonjezera
  apo, chifukwa cha mphamvu ya adsorption ya silika gel, n''zosavuta kuchititsa khungu
  la munthu kuuma, choncho ogwira ntchito ayenera kuvala zovala zodzitetezera panthawi
  ya ntchito kuti athetse kuyanika. Ngati mutaya gel osakaniza m''maso mwanu chifukwa
  chogwira ntchito mosasamala, muyenera kusamba m''maso ndi madzi ambiri. Pazovuta
  kwambiri, muyenera kupita kuchipatala munthawi yake. Monga tanena kale, mitundu
  ya silika gel osakaniza ndi osiyana pamikhalidwe ndi mayiko. Pakati pawo, gel osakaniza
  a buluu ali ndi kachulukidwe kakang''ono ka cobalt chloride, chomwe chingakhale
  poizoni. Choncho, m''pofunika kupewa kukhudzana ndi chakudya kapena inhalation.
  Akalowa m''thupi, m''pofunika kupita kuchipatala kuti akalandire chithandizo panthawi
  yake. Ngati silika gel osakaniza adsorbes madzi nthunzi kapena organics ena sing''anga
  pa kusintha, adsorption mphamvu yake akhoza kufooka, koma angagwiritsidwe ntchito
  pambuyo kubadwanso.\\nKodi Pali Kusiyana Kotani Pakati pa Nitrile Rubber ndi Silicone
  Rubber?\\nKusiyana kwa kapangidwe:\\n-Mitundu iwiri ikuluikulu ya mphira ndi silikoni
  ndi mphira wa nitrile. Onsewa ali ndi zinthu zawo zapadera zomwe zimawapangitsa
  kukhala oyenera ntchito zosiyanasiyana.\\nRabara ya silicone imapangidwa kuchokera
  ku polima wa silicon, mpweya, ndi zinthu zina, monga carbon ndi hydrogen. Ndi mphira
  wopangidwa womwe umasinthasintha, wokhazikika komanso wosamva kutentha. Itha kugwiritsidwa
  ntchito mumitundu yosiyanasiyana, monga machubu ndi ma hoses, zotchingira magetsi,
  zophikira, zida zamankhwala, ndi zomatira.\\nNitrile labala amapangidwa kuchokera
  ku copolymer ya acrylonitrile ndi butadiene. Ndi mphira wopangira mafuta osamva
  mafuta komanso amakhala ndi mphamvu zamakina. Itha kugwiritsidwa ntchito pazinthu
  zambiri pomwe kukana mafuta kapena mankhwala kumafunikira, monga zisindikizo zamainjini
  zamagalimoto ndi ma gaskets muzokonza mapaipi.\\nKusiyana kwa Properties:\\n-Silicone
  ndi mphira wa nitrile onse ndi ma elastomer opangira. Amagawana katundu wambiri,
  koma pali kusiyana kwakukulu pakati pawo.\\nKusiyanitsa kumodzi kofunikira ndikuti
  silikoni ndi polima, pomwe mphira wa nitrile ndi polima wachilengedwe. Kusiyana
  kumeneku kumabwera chifukwa chakuti silikoni imakhala ndi silicon - metalloid -
  monga msana wake, pamene msana wa mphira wa nitrile uli ndi maatomu a carbon.\\nMitundu
  yosiyanasiyana ya mphira wa silikoni ndi nitrile imapangitsa kuti pakhale kusiyana
  kwakukulu. Silicone ili ndi kachulukidwe kakang''ono kuposa mphira wa nitrile, kutanthauza
  kuti ndi yopepuka. Ilinso ndi modulus yapamwamba ya Young, kutanthauza kuti ndiyokhazikika.
  Mosiyana ndi izi, mphira wa nitrile uli ndi kukana bwino kwa abrasion komanso mphamvu
  yong''ambika kuposa silikoni.\\nPalinso kusiyana kwa magwiridwe antchito pakati
  pa zida ziwirizi. Silicone imatha kupirira kutentha kwambiri kuposa rabara ya nitrile
  - mpaka 204 \u00b0 C poyerekeza ndi 121 \u00b0 C ya rabara ya nitrile - zomwe zimapangitsa
  kuti zikhale zoyenera kugwiritsidwa ntchito m''malo otentha kwambiri monga magalimoto
  opangira magalimoto. Komano, mphira wa nitrile umagwira ntchito bwino kuposa silikoni
  potengera kukana kwamafuta ndi mafuta; itha kugwiritsidwanso ntchito pokhudzana
  ndi zakudya popanda kuopa kuipitsidwa.\\nKusiyana kwa Durability:\\n-Nitrile rabara
  ndi yotsika mtengo kuposa mphira ya silikoni, koma simatambasula kwambiri ndipo
  siikhalitsa. Rabara ya silicone ndi yokwera mtengo kuposa mphira wa nitrile, koma
  imakhala yotambasuka komanso yolimba.\\nKusiyana kwa Misozi Resistance:\\n-Mpira
  wa Nitrile uli ndi kutentha kwabwino kwa kutentha ndipo nthawi zambiri umagwiritsidwa
  ntchito pazinthu zomwe zimafunika kulimbana ndi kutentha kwakukulu, monga mitts
  ya uvuni ndi magolovesi. Koma kukana kutentha kwa mphira wa silicone ndikocheperako
  kuposa mphira wa nitrile, kutentha kwa mphira wa silicone nthawi zambiri kumakhala
  kocheperako kuposa mphira wa nitrile.\\nKusiyana kwa Abrasion Resistance:\\n-Zinthu
  ziwirizi nthawi zambiri zimagwiritsidwa ntchito limodzi chifukwa zimakhala ndi zinthu
  zosiyanasiyana zomwe zimatha kugwiritsidwa ntchito mosiyanasiyana. Mwachitsanzo,
  mphira wa nitrile ukhoza kugwiritsidwa ntchito pazinthu zomwe zimayenera kugonjetsedwa
  ndi mafuta kapena madzi, pamene mphira wa silikoni ndi woyenera kwambiri pazinthu
  zomwe zimayenera kukana dzimbiri.\\nKusiyana kwa Mapulogalamu:\\n-Kusiyanitsa kwakukulu
  pakati pa silicone ndi mphira wa nitrile ndikuti silicone ndi mphira wopangira,
  pomwe nitrile ndi mphira wachilengedwe. Izi zikutanthauza kuti mphira wa nitrile
  amapangidwa kuchokera ku latex, yomwe imachokera ku zomera, pamene silikoni imapangidwa
  kuchokera ku zipangizo zopangira.\\nKusiyana kumeneku kumapangitsa kuti pakhale
  zinthu zosiyanasiyana zamtundu uliwonse wa rabara. Mwachitsanzo, mphira wa nitrile
  umagonjetsedwa ndi mafuta ndi mankhwala kuposa silikoni. Silicone, kumbali ina,
  imakhala ndi kutentha kwambiri kuposa nitrile.\\nChifukwa chake, posankha pakati
  pa mphira wa silicone ndi nitrile kuti mugwiritse ntchito, ndikofunikira kuganizira
  kuti ndi zinthu ziti zomwe zili zofunika kwambiri pa ntchito yomwe muli nayo.\\nKusiyana
  kwa mtengo:\\n-Pali zifukwa zingapo zazikulu zomwe silicone imawononga ndalama zambiri
  kuposa mphira wa nitrile. Choyamba, silikoni ili ndi malo osungunuka kwambiri kuposa
  mphira wa nitrile, zomwe zikutanthauza kuti imatha kupirira kutentha kwambiri. Chachiwiri,
  silikoni imalimbana kwambiri ndi kuwonongeka kwa kuwala kwa UV ndi zinthu zina zachilengedwe.
  Pomaliza, silikoni ndi zinthu zotanuka kwambiri kuposa mphira wa nitrile, kutanthauza
  kuti imatha kutambasulidwa popanda kusweka.\\nKusiyana kwa kupanga:\\n-Rabara ya
  silicone ndi mphira wopangidwa kuchokera ku silikoni, polymer ya silicon ndi mpweya.
  Mapiritsi a silicone amagwiritsidwa ntchito kwambiri m''makampani chifukwa cha kusinthasintha
  kwawo komanso kukana kutentha kwambiri. Amagwiritsidwa ntchito m''chilichonse kuyambira
  ma gaskets ndi zisindikizo mpaka kutsekemera kwamagetsi ndi zipangizo zamankhwala.\\nRabara
  ya Nitrile, yomwe imadziwikanso kuti Buna-N kapena NBR, ndi mphira wopangidwa kuchokera
  ku nitrile, copolymer ya acrylonitrile ndi butadiene. Mapiritsi a nitrile sagonjetsedwa
  ndi mafuta, mafuta, ndi mankhwala ena. Amagwiritsidwa ntchito mu gaskets, zisindikizo,
  ma hoses, ndi zinthu zina zomwe zimafunikira kukana mafuta.\\nKusiyana kwa kukhazikika:\\nPankhani
  yokhazikika, zida ziwiri zodziwika bwino zomwe zimagwiritsidwa ntchito ndi silicone
  ndi mphira wa nitrile. Zida zonsezi zili ndi ubwino wake wapadera womwe umawapangitsa
  kukhala abwino kwa ntchito zosiyanasiyana. Pano pali tsatanetsatane wa kusiyana
  kwakukulu pakati pa zinthu ziwiri zokhazikika:\\n-Silicone imapangidwa kuchokera
  ku silicon, chinthu chomwe chimapezeka mwachilengedwe chomwe chimapezeka mumchenga
  ndi mwala. Komanso ndi chimodzi mwa zinthu zochulukirachulukira padziko lapansi.
  Izi zimapangitsa silicone kukhala chida chongowonjezedwanso.\\n-Mpira wa Nitrile
  umapangidwa kuchokera ku petroleum, chinthu chosasinthika. Komabe, mphira wa nitrile
  ukhoza kubwezeretsedwanso kuzinthu zatsopano kumapeto kwa moyo wake.\\n-Silicone
  imakhala ndi mpweya wochepa kwambiri poyerekeza ndi ma rubber ena opangira. M''malo
  mwake, kupanga silikoni kumatulutsa mpweya wochepera 60% kuposa kupanga mphira wa
  nitrile.\\n-Mpira wa Nitrile umalimbana kwambiri ndi kutentha kuposa silikoni, zomwe
  zimapangitsa kuti zikhale zabwino kwa ntchito zomwe kutentha kwakukulu kumadetsa
  nkhawa.\\n-Silicone imakhala ndi kutentha kosiyanasiyana (-40 \u00b0 C mpaka 230
  \u00b0 C), ndikupangitsa kuti ikhale yoyenera kuzizira komanso kutentha.\\n-Nitrile
  rabara imagonjetsedwa kwambiri ndi abrasion kuposa silikoni, zomwe zimapangitsa
  kuti zikhale zoyenera kwa ntchito zomwe zimadetsa nkhawa.\\nKusiyana kwa recyclability:\\n-Pali
  kusiyana kwakukulu pakati pa silicone ndi mphira wa nitrile, koma kusiyana kwakukulu
  ndikuti silikoni imatha kubwezeredwa pomwe mphira wa nitrile si. Silicone imatha
  kubwezeretsedwanso kudzera munjira yotchedwa pelletization, pomwe zinthuzo zimasungunuka
  ndikupangidwa kukhala ma pellets ang''onoang''ono omwe angagwiritsidwe ntchito kupanga
  zatsopano. Komano, mphira wa nitrile sungathe kubwezeretsedwanso motere chifukwa
  cha kapangidwe kake ka mankhwala. Izi zikutanthauza kuti mankhwala a rabara a nitrile
  akatayidwa, amathera kutayira komwe amatenga zaka zambiri kuti awonongeke.\\nUbwino
  ndi kuipa koyerekeza:\\nNitrile rabara ndi mphira wa silikoni ndi mitundu iwiri
  ya mphira yomwe imagwiritsidwa ntchito mosiyanasiyana. Labala ya Nitrile ndi yofewa,
  yosinthika kwambiri kuposa mphira ya silikoni, yomwe imapangitsa kuti ikhale yoyenera
  pazinthu zina. Rabara ya nitrile imakhalanso ndi moyo wautali kuposa mphira wa silikoni.
  Kusiyana kwakukulu pakati pa mphira wa nitrile ndi silicone ndi:\\nKutsiliza\\nNitrile
  ndi silikoni ndi mitundu iwiri ya mphira yomwe nthawi zambiri imagwiritsidwa ntchito
  pazinthu chifukwa imakhala ndi zinthu zosiyanasiyana. Nitrile rabara ndi mphira
  wolimba, wopangidwa ndi mphira wosasunthika ngati silikoni. Zimakhalanso zosavuta
  kusweka ndi kuwala kwa dzuwa kapena mpweya ndipo zimatha kutenthedwa (kupangidwa
