  amphaka a KT, mascots, zida zina, ndi zina zambiri.\\n13. Zokongoletsera za hardware\\nZopachika
  zovala, zingwe zomata, mphuno za zitseko, misomali yotsatsa, ma ducts a mpweya,
  zopachika zitsulo, miyendo ya kabati, mapulagi, ndodo zotchinga, mbedza za zovala,
