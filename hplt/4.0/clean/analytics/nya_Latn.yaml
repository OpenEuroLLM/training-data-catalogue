  ntchito, kupangitsa kuti zikhale zosavuta kaya muli kunyumba kapena popita.\\nKu
  AOSITE Hardware, ndi antchito athu aluso, ukadaulo wapamwamba, ndi kasamalidwe kadongosolo
  kamene kamathandizira kukula kosatha.\\nM\u2019madera-we usanthw&D: Zatsopano zaukadaulo
