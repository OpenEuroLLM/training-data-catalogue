sample: '["\"Pakugwiritsa ntchito ukadaulo watsiku ndi tsiku, kaya kunyumba popuma
  kapena kuntchito,\u2026\\nPali owongolera masewera ambiri, ma joystick, ndi zina.
  Koma palibe ngati kumva kwa chiwongolero chabwino cha PC kwa\u2026\\nMakoswe opanda
  zingwe ndi othandiza kwambiri, chifukwa amakulepheretsani \\\"kumangidwa\\\" ndi
  chingwe. Izi sizimangolola ntchito ...\\nKaya ndinu osewera kapena mumangosewera
  kamodzi pakanthawi, kapena mutakhala maola ambiri kutsogolo kwa ...\\nMakoswe amasewera
  ndichinthu chofunikira kwambiri pazithunzi kuti gulu likhale lokonzekera 100% pamasewera
  omwe mumakonda\u2026.\\nAnthu ambiri amayang''ana kwambiri kugula zida zamasewera
  kuti azichita bwino ndi masewera apakanema koma amaiwala ...\\nMalaputopu nthawi
  zina amagwiritsidwa ntchito zambiri osati kungolemba, monga kuwonera makanema, ngati
  pulogalamu yowonjezera ...\\nNthawi zambiri mumachoka kunyumba kapena kuyenda ndipo
  muyenera kunyamula laputopu yanu kumbuyo, njira yabwino yonyamulira ...\\nLachisanu
  Lachisanu ndiye nthawi yabwino kwambiri pachaka yogula zinthu zaukadaulo popeza,
  imatilola ...\\nPakadali pano, pomwe mukuwerenga izi kapena mukuwerenga zomwe zili
  mu M\u00f3vil Forum, mukukhazikitsa ...\\nAchinyamata omwe amakonda kuwerenga ndi
  ocheperako, makamaka chifukwa cha ...\"", "\"Kwa amalonda, kupeza chitetezo cha
  ndalama ndikofunikira kwambiri. Mukalowa mgwirizano ndi gulu lina, mukufuna kuwonetsetsa
  kuti mnzakeyo akukwaniritsa udindo wake wolipira mgwirizano. Ngati mupereka ndalama
  kapena mukugulitsa ndalama kuti mupindulitse munthu wina, mukufunanso chitsimikizo
  kuti ndalama zomwe mwapereka zidzabwezedwa. Mwanjira ina, mukufuna kupeza chuma.
  Kupeza chitetezo chachuma kumawonetsera kuti wobwereketsa ali ndi khola akazindikira
  kuti zomwe akufuna kunena sizikwaniritsidwa. Pali kuthekera kosiyanasiyana kwa amalonda
  ndi makampani kuti apeze chitetezo cha ndalama. Munkhaniyi, zovuta zingapo, escrow,
  (kampani ya makolo), chidziwitso cha 403, kubweza ngongole ndi chikole zidzakambidwa.\\n1.
  Ngongole zingapo\\nPankhani ya ngongole zingapo, zomwe zimatchedwanso kuti liwengo
  limodzi, palibenso cholankhula chilichonse chomwe chimaperekedwa, koma pali wokongoza
  mnzake amene amatenga nawo ngongole ena. Zovuta zingapo zimachokera palemba 6: 6
  Dutch Civil Code. Zitsanzo za mangawa angapo mkati mwamaubwenzi ndi omwe ali ndi
  mgwirizano wamilandu omwe ali ndi chindapusa cha ngongole za mgwirizano kapena owongolera
  bungwe lazamalamulo lomwe, pazinthu zina, lingakhale ndi mlandu payekha pazobweza
  zamakampani. Ngongole zingapo nthawi zambiri zimakhazikitsidwa ngati chitetezo pamgwirizano
  pakati pamapani. Lamulo lachithunzithunzi ndilakuti, ngati ntchito yomwe yachitika
  chifukwa cha mgwirizano itakhala ndi omwe ali ndi ngongole ziwiri kapena kupitilira
  apo, aliyense amakhala wodzipereka nawo gawo lofanana. Atha kungokakamizidwa kukwaniritsa
  gawo lawo la mgwirizano. Komabe, zovuta zingapo ndizosiyana ndi lamuloli. Pankhani
  ya ngongole zingapo, pali magwiridwe omwe amayenera kuchitidwa ndi omwe ali ndi
  ngongole ziwiri kapena zingapo, koma pomwe aliyense ali ndi ngongole angathe payekha
  kuchita zonse. Wokongoletsa amayenera kukwaniritsa mgwirizano wonse kuchokera kwa
  onse amene ali ndi ngongole. Chifukwa chake, wobwereketsa angasankhe yemwe ali ndi
  ngongole yomwe angafune kuyankha ndipo atha kufunsa ngongole yonse kuchokera kwa
  amene ali naye ngongole. Ngongole imodzi ikalipira ngongole yonse, amene ali naye
  mangawa alibe ngongole iliyonse.\\n1.1 Ufulu wothandizira\\nOmwe ali ndi ngongole
  amayenera kulipira wina ndi mnzake, choncho ngongole yomwe idalipira ngongole imodzi
  iyenera kuthetsedwa pakati pa onse omwe ali ndi ngongole. Uku kumatchedwa ufulu
  wofunsanso. Ufulu wobwerera ndi ufulu wa wobwereketsa kuti abweze zomwe walipira
  wina yemwe ali ndi mlandu. Ngati wokongoza ali ndi ngongole zonse zolipira ngongole
  ndipo amalipira ngongole yonse, amalandila ngongoleyo kuchokera kwa omwe ali nawo
  ngongole.\\nNgati ngongole sikufunanso kukhala ndi ngongole zonse zandalama zomwe
  adalowetsa limodzi ndi omwe ali ndi ngongole, atha kupempha wobwereketsa kalata
  kuti amuletse ngongole zingapo. Chitsanzo cha izi ndi momwe wokongoza ngongole alowa
  mgwirizano la ngongole yolumikizana ndi mnzake, koma akufuna kusiya kampani. Pankhaniyi,
  kuchotsedwa kolemba ngongole zingapo kuyenera kupangidwa nthawi zonse ndi wokongoza;
  Kudzipereka pakamwa kuchokera kwa anzanu omwe mwapanga nawo ngongole kuti adzabweza
  ngongole sikokwanira. Ngati inu amene muli ndi ngongole simungathe kukwaniritsa
  kapena simukukwaniritsa mgwirizano wapakamwa, wobwereketsa akhoza kukufunsani ngongole
  yonse.\\n1.2. Kufunika kwa chilolezo\\nWokwatirana naye kapena amene walembetsa
  naye ngongole yemwe ali ndi mangawa akulu amatetezedwa ndi lamulo. Malinga ndi nkhani
  ya 1:88 ndime 1 sub c Dutch Civil Code, wokwatirana amafunika chilolezo kuchokera
  kwa mnzake kuti achite nawo mapangano omwe amakhala ngati ali ndi ngongole naye,
  kupatula momwe amachitiranso kampani. Izi ndizomwe zimatchedwa kufunikira kovomerezeka.
  Nkhaniyi ikufuna kuteteza okwatirana pazinthu zalamulo zomwe zitha kubweretsa mavuto
  azachuma. Wobwereketsa atakhala ndi ngongole ndi mnzake pamlanduwo, zitha kukhala
  ndi zotsatirapo kwa wokwatirana naye. Komabe, pali zosiyana pazofunikira izi zovomerezeka.
  Malinga ndi nkhani 1:88 ndime 5 Dutch Civil Code, kuvomereza sikofunikira pamene
  wamkulu wa kampani yomwe ili ndi ngongole zochepa kapena kampani yabizinesi yocheperako
  (Dutch NV ndi BV) achita mgwirizano, pomwe director uyu ali yekha kapena onse ndi
  omwe amawatsogolera, omwe ali ndi magawo ambiri ndipo ngati mgwirizanowu udamalizidwa
  m''malo mwa bizinesi yabizinesi yakampaniyo. Mwa ichi, pali zofunikira ziwiri zomwe
  zikuyenera kukwaniritsidwa: director ndi director director komanso ambiri omwe ali
  ndi masheya kapena ali ndi magawo ambiri pamodzi ndi omwe amawatsogolera ndipo mgwirizanowu
  udamalizidwa m''malo mwa bizinesi yabizinesi yakampaniyo. Ngati izi sizikukwaniritsidwa
  zonse, chofunikira chovomerezekacho chimagwira.\\n2. Kutuluka\\nPaphwando pakafunika
  chitetezo kuti ndalama ziperekedwe, chitetezo ichi chimatha kuperekedwanso ndi escrow.
  [1] Escrow imachokera ku nkhani 7: 850 Dutch Civil Code. Timalankhula za escrow
  pomwe wina wadzipereka kwa wobwereketsa chifukwa chodzipereka chomwe chipani china
  (yemwe ali ndi ngongole yayikulu) ayenera kukwaniritsa. Izi zimachitika pomaliza
  mgwirizano wopita kukayenda. Gulu lachitatu lomwe limapereka chitetezo, limatchedwa
  guarantor. Wogwirizira amatenga udindo wake kwa wobwereketsa kwa wobwereketsa wamkulu.
  Wotsimikizira motero salola kuti akhale ndi ngongole yake, koma ngongole ya wina
  ndipo amatipatsa chitetezo chobwezera ngongoleyi. Wothandizira amakhalanso ndi ngongole
  ndi chuma chake chonse. Escrow itha kuvomerezedwa kuti ikwaniritse maudindo omwe
  alipo kale, komanso kukwaniritsa zomwe adzachite mtsogolo. Kutengera ndi mutu 7:
  851 ndime 2 Dutch Civil Code, maudindo amtsogolo akuyenera kukhazikitsidwa mokwanira
  pakadatha escrow. Ngati wobwereketsa wamkulu sangakwaniritse zomwe akukakamira kuchokera
  mgwirizanowu, wobwereketsa atha kumuuza wobwereketsa kuti akwaniritse izi. Malinga
  ndi nkhani 7: 851 Dutch Civil Code, escrow imadalira udindo wa wobwereketsa chifukwa
  chomwe escrow idamalizidwa. Chifukwa chake, kubwereketsa kumatha kukhalapo pomwe
  wobwerekayo wakwaniritsa zomwe wakakamiza kuchokera mgwirizanowu.\\nWobwereketsa
  sangangolankhula ndi wotsimikizira kuti alipire ngongoleyo. Izi ndichifukwa choti
  mfundo yotchedwa subsidiarity imagwira gawo limodzi la escrow. Izi zikutanthauza
  kuti wokongoza ngongole sangathe kukakamira chitsimikiziro chake kuti walipira.
  Choyamba, wotsimikizirayo sangakhale ndi mlandu wolipirira ngongole yayikulu isanakwaniritse
  zomwe akukwaniritsa. Izi zikuchokera palemba 7: 855 Dutch Civil Code. Izi zikutanthauza
  kuti wotsimikizika angathe kuimbidwa mlandu ndi wobwereketsa pokhapokha wobwereketsa
  atalankhula koyamba ndi yemwe ali ndi ngongole yayikulu. Wobwereketsa ndalama ayenera
  kuti adachita zonse zofunikira kuti akhazikitse kuti wobwereketsa, yemwe wotsimikizirayo
  adadzipereka, walephera kukwaniritsa udindo wake wolipira. Mulimonsemo, wobwereketsa
  ayenera kutumiza zidziwitso zakusokonekera kwa wokongoza wamkulu. Pokhapokha ngati
  wokongoza wamkuluyo akulephera kutsatira lamulo lakubwezera atalandira chidziwitso
  chokhacho, wobwereketsa angayankhe kwa guarantor kuti alandire ngongole. Komabe,
  wotsimikizirayo alinso ndi mwayi woti adziteteze motsutsana ndi zomwe wokhulupirira
  angongole. Kufikira izi, ali ndi chitetezo chofananira chomwe ali ndi ngongole yayikulu,
  monga kuyimitsidwa, kuchotsedwa pamilandu kapena kupempha chisawawa. Izi zikuchokera
  palemba 7: 852 Dutch Civil Code.\\n2.1 Ufulu wothandizira\\nWotsimikizira yemwe
  amalipira ngongole ya wokongoza ngongole, atha kubweza ngongoleyi kwa ngongole.
  Ufulu wothandizidwa motero umagwiranso ntchito pa escrow. Mu escrow, mawonekedwe
  apadera a ufulu wothandizawo amagwiranso ntchito, monga kudziyesa. Lamulo lalikulu
  ndikuti kufunsira kumatha kukhalanso pomwe kudaliridwako kulipidwa. Komabe, kuyamwa
  ndikusiyana ndi lamuloli. Pakuyamwa, zonena zimasinthidwa kukhala kwa mwini wake
  wina. Poterepa, chipani china kuposa wokongoza ngongole chimalipira zomwe wokongoza
  mnzake adachita. Mu escrow, kudzinenera kuti kulipidwa ndi wachitatu, yemwe ndi
  guarantor. Pakulipira ngongole, komabe, zonena motsutsana ndi wokongoza sizitayika,
  basi imasamutsidwa kuchokera kwa wobwereketsa kupita kwa guarantor yemwe adalipira
  ngongoleyo. Pambuyo pobweza ngongoleyo, wotsimikizirayo amatha kupita kukabweza
  ngongoleyo kwa amene wamupangira pangano la escrow. Kulembetsanso ndikutheka kokha
  pazochitika zomwe zimayendetsedwa ndi lamulo. Kulembetsa zokhudzana ndi escrow ndikotheka
  pamaziko 7: 866 Dutch Civil Code jo. nkhani 6:10 Code Lachi Dutch.\\n2.2 bizinesi
  ndi nyumba zazinsinsi\\nPali kusiyana pakati pa bizinesi ndi escrow wamba. Business
  escrow ndi escrow yomwe imamalizidwa pa ntchito yaukadaulo kapena bizinesi, escrow
  yapayokha ndi escrow yomwe imamalizidwa kunja kwa ntchito yaukadaulo kapena bizinesi.
  Bungwe lovomerezeka komanso munthu wachilengedwe akhoza kukhazikitsa mgwirizano
  wapadera. Zitsanzo za izi ndi kampani yogwirizira yomwe imamaliza mgwirizano ndi
  bank kuthandizira ndalama zomwe amapereka ndi makolo omwe amapanga pangano la escrow
  loti awonetsetse kuti ndalama za ngongole za mwana wawo ziperekedwa kubanki. Sikuti
  nthawi zonse escrow imayenera kumalizidwa m''malo mwa banki, ndizothekanso kulowa
  mapangano a escrow ndi ena obweza ngongole.\\nNthawi zambiri zimakhala zodziwika
  bwino ngati bizinesi kapena scrow yapayokha idamalizidwa. Ngati kampani ilowa mgwirizano
  wa escrow, bizinesi ya escrow imatha. Ngati munthu wachilengedwe atalowa mgwirizano
  wa escrow, nthawi zambiri pamakhala mgwirizano wapadera. Komabe, kuvomerezedwa kumatha
  kuchitika ngati wotsogolera wa kampani yaying''ono yamakampani wamba kapena kampani
  yochepetsetsa yazinsinsi atamaliza mgwirizano wa escrow m''malo mwa bungwe lalamulo.
  Mutu 7: 857 Dutch Civil Code ikuphatikiza zomwe zikutanthauza kuti kudziyimira payekha:
  kumalizika kwa secrow ndi munthu wachilengedwe yemwe sanachite nawo ntchito yake,
  kapena machitidwe wamba a kampani yochepetsera anthu wamba kapena ngongole zochepa
  pazokha kampani. Komanso, wotsimikizira ayenera kukhala woyang''anira kampaniyo,
  yekha kapena ndiomwe akuwongolera, azigawana kwambiri. Pali zinthu ziwiri zofunika
  kuchita:\\n- wotsimikizira ndiye woyang''anira ndipo ambiri amakhala ndi magawo
  ambiri kapena amagawana nawo\\n- escrow imamalizidwa m''malo mwa zochitika wamba
  zamakampani.\\nPochita izi, nthawi zambiri pamakhala woyang''anira wowongolera /
  ambiri omwe amalowa mu mgwirizano wa escrow. Woyang''anira / wothandizirana nawo
  ambiri amasankha momwe kampaniyo ingakhudzire kampaniyo, chifukwa mwina zitha kukhala
  kuti bankayo safuna kupereka ndalama popanda kumaliza mgwirizano wa escrow. Kuphatikiza
  apo, mgwirizano wa escrow, wotsilizidwa ndi director director / ambiri olandila,
  uyeneranso kuti unatsimikizidwa kuti zitheke. Komabe, izi ndizosiyana pachikhalidwe
  chilichonse ndipo lamulo silimanena kuti ''zochitika wamba zabizinesi''. Kuti muwone
  ngati escrow yatsirizidwa pamalingaliro abwinobwino a bizinesi, momwe milanduyo
  iyenera kuunikiridwa. Njira zonsezi zikakwaniritsidwa, bizinesi yamalonda imamalizidwa.
  Woyang''anira yemwe amaliza escrow sakhala woyang''anira kapena wolandila zochulukitsa
  kapena escrow sanamalizidwe kuti akwaniritse zochitika wamba, scrow yakumapeto imamalizidwa.\\nMalamulo
  owonjezera amagwira ntchito pa escrow yaumwini. Lamuloli limateteza kwa wokwatirana
  naye kapena wolembetsedwa kwa wotsimikizira payekha. Zoyenera kuvomerezedwa zomwe
  zimagwiranso ntchito kwa escrow apadera. Malinga ndi nkhani 1:88 ndime 1 sub c Dutch
  Civil code, wokwatirana ayenera kuvomerezedwa ndi mnzake kuti achite nawo mgwirizano
  womwe akufuna kumumanga ngati chitsimikizo. Chilolezo cha mnzake wa guarantor chimafunikira
  kuti alowe nawo pachigwirizano chovomerezeka cha escrow. Komabe, nkhani 1:88 ndime
  5 Dutch Civil Code ikutsimikizira kuti chilolezochi sichofunikira pomwe escrow imatsirizidwa
  ndi wotsimikizira bizinesi. Kutetezedwa kwa wokwatirana naye kwa guarantor kotero
  kumangogwirizana ndi mgwirizano wamseri.\\n3. Chitsimikizo\\nChitsimikizo ndi mwayi
  wina wopeza chitetezo kuti lipoti liperekedwe. Chitsimikizo ndi ufulu wachinsinsi,
  pomwe munthu wachitatu amatenga gawo lokhazikika pokwaniritsa kudzipereka pakati
  pa wobwereketsa ndi wobwereketsa. Chitsimikizo chimaphatikizapo kuti wachitatu akutsimikizira
  kukwaniritsidwa kwa zomwe wobwereketsa adzachite. Wogulitsayo adalipira ngongole
  ngati wobwerekedwayo sangathe kapena sangapereke. [2] Chitsimikizocho sichimayendetsedwa
  ndi lamulo, koma chitsimikizo chimamalizidwa mu mgwirizano pakati pa magulu.\\n3.1.
  Chowonjezera chitsimikiziro\\nKusiyana kungapangike pakati pa mitundu iwiri ya chitsimikiziro
  kuti athe kupeza chitetezo; chitsimikiziro chowonjezera ndi chitsimikiziro choperewera.
  Chitsimikiziro chowonjezera chimadalira kuchokera pa ubale pakati pa wokongoza ndi
  wokongoza. Powona koyamba, chitsimikiziro chowonjezera ndi chofanana kwambiri ndi
  escrow. Komabe, kusiyana kwake ndikuti wotsimikizira za zomwe angakwanitse sadzipereka
  kuti azigwira ntchito yomweyo monga wokongoza ngongole, koma kukakamiza kwake komwe
  kuli ndi magawo ena. Chitsanzo chosavuta cha izi ndi pamene wotsimikizira adzipereka
  kuti apereke tomato kwa wokongoza, ngati wokongoza sangakwaniritse udindo wake wopereka
  mbatata. Pankhaniyi, zomwe zili m''manja mwa wotsimikizirazi ndizosiyana ndi zomwe
  akukakamizani kukhala ndi ngongole. Komabe, izi sizikulepheretsa kuwona kuti pali
  mgwirizano waukulu pakati pa zomwe awiriwo adachita. Chitsimikiziro chowonjezerapo
  ndichowonjezera ku ubale pakati pa wokongoza ndi wokongoza. Komanso, zowonjezera
  zowonjezera nthawi zambiri zimakhala ndi ntchito ngati ukonde wachitetezo; pokhapokha
  ngati wokongoza wamkulu sangakwaniritse udindo wake, wotsimikizirayo amayitanidwa
  kuti achite zomwe adalonjeza.\\nNgakhale chitsimikizo sichinatchulidwe momveka bwino
  m''lamulo, nkhani 7: 863 Dutch Civil Code sichimangotanthauza zofunikira zonse.
  Malinga ndi nkhaniyi, zopereka zokhudzana ndi mseri yazinsinsi zimagwiranso ntchito
  pamapangano omwe munthu amachita ntchito inayake munthu wina akadzalephera kutsatira
  zomwe akukakamiza kwa wokongoza mnzakeyo. Zomwe zimakhudzana ndi escrow yapayokha
  zimagwiranso ntchito pazotsimikizira zomwe zimatsimikiziridwa ndi munthu payekha.\\n3.2
  Chitsimikizo\\nKuphatikiza pa chitsimikizo chowonjezera, timadziwanso chitetezo
  chachuma chotsimikizika chotsimikizika. Mosiyana ndi chitsimikiziro chowonjezera,
  chitsimikizo chotsimikizika ndikudzipereka kotsimikizika kwa guarantor kupita kwa
  wokongoza. Chitsimikizo ichi sichimakhala chopanda tsankho kuchokera pachibwenzi
  chapakati pa wokongoza ndi wobwereketsa. Pankhani ya chitsimikizo chotsimikizika,
  chitsimikizo chimadzipereka chodzipereka kuti akwaniritse ngongole, ngati angakwanitse.
  Kuchita uku sikugwirizana ndi mgwirizano wapakati pa wokongoza ngongole ndi wobwereketsa.
  Chitsanzo chodziwika bwino chotsimikizika ndi chitsimikizo cha banki.\\nChitsimikizo
  chotsiriza chikamalizidwa, wotsimikizirayo sangateteze ku chibwenzicho. Miyezo yotsimikizika
  ikakwaniritsidwa, wotsimikizira sangathe kuletsa kulipira. Izi ndichifukwa choti
  chitsimikizo chimachokera ku mgwirizano wina pakati pa wokongoza ndi guarantor.
  Izi zikutanthauza kuti wobwereketsa atha kuyankhulanso ndi wotsimikizira, osatumiza
  chizindikiritso cha wobwereketsa. Pomaliza chitsimikizo, wokongolayo amapeza chitsimikizo
  chachikulu kuti ngongoleyo imalipira iye. Kuphatikiza apo, guarantor alibe ufulu
  wakuyankha. Komabe, maphwando atha kuphatikiza njira zoteteza mu mgwirizano wotsimikizira.
  Mavuto azitsimikiziro zoyimilira sizichokera pamalamulo, koma akhoza kudzazidwa
  ndi maguluwo. Ngakhale wotsimikizirayo alibe ufulu wakuyenderanso molingana ndi
  malamulo, angathe kupezera njira zodzithandizira. Mwachitsanzo, chitsimikiziro chotsutsa
  chikhoza kutsirizidwa ndi wokongoza ngongole kapena chikalata chaumbanda chingapangidwe.\\n3.3
  Chitsimikizo cha kampani ya makolo\\nM''malamulo amakampani, chitsimikizo cha kampani
  yamakolo chimamalizidwa nthawi zambiri. Chitsimikizo cha kampani ya makolo chimaphatikizapo
  kuti kampani ya makolo imadzipereka kuti ikwaniritse zomwe kampani yothandizirayo
  ikufuna ngati kampaniyo singakwaniritse kapena ayi. Zachidziwikire, chitsimikizochi
  chingagwirizane ndi makampani omwe ali mgulu kapena omwe amakhala ndi kampani. Momwemo,
  chitsimikizo cha gulu ndichitsimikizo chodziwika. Komabe, nthawi zambiri pamakhala
  kuti palibe lingaliro loti ''mulipire kaye, kenako lankhulani'', pomwe guarantor
  amalipira ngongoleyo osayang''ana ngati pali zomwe anganene kwa wobwerekayo. Chifukwa
  cha ichi ndikuti wobwereketsa ndiye wocheperako wa guarantor; guarantor adzafuna
  kuwunika koyamba ngati pangakhale zotsimikizika. Komabe, ntchito ''yolipira yoyamba,
  kenako yankhulani'' itha kumangidwa kuti ikhale mgwirizano. Kupatula apo, maphwando
  amatha kupanga chitsimikizo malinga ndi zofuna zawo. Maphwandowa ayeneranso kudziwa
  ngati chitsimikizo chimangophatikiza chiphaso chobwezera kapena ngati chitsimikizo
  chikuyeneranso kukwaniritsa zina, chifukwa chake ndi chitsimikiziro chantchito.
  Kukula, kutalika kwake ndi momwe chitsimikizocho chimakhazikitsidwanso ndi maguluwo.
  Chitsimikizo cha kampani ya makolo chimatha kupereka yankho pomwe kampaniyo ikawonongeka,
  koma pokhapokha ngati kampani ya makolo singagwe limodzi ndi mabungwe ake.\\n4.
  403-mawu\\nMu gulu la makampani, zomwe zimatchedwa 403-statement zimaperekedwanso.
  Izi zikuchokera palemba 2: 403 Dutch Civil Code. Popereka mawu 403, othandizira
  omwe ali mgululi sakhudzidwa ndi zolemba zawo zokha. M''malo mwake, akaunti yophatikizidwa
  pachaka imakonzedwa. Ili ndi akaunti ya pachaka ya makampani makolo, momwe zotsatira
  zonse za othandizira zimaphatikizidwira. Kapangidwe ka akaunti yophatikizidwa pachaka
  ndikuti ndalama zonse, ngakhale zimagwira ntchito modziyimira pawokha, pamapeto
  pake zimagonedwa ndi oyang''anira ndi kampani yoyang''anira. 403-statement ndi unilateral
  law Act, pomwe pakudzipereka kodziimira pakampani ya makolo. Izi zikutanthauza kuti
  mawu 403 ndi kudzipereka kopanda kudzipereka. Chiwonetsero cha 403 sichimangoperekedwa
  ndi magulu akulu apadziko lonse lapansi; magulu ang''ono, mwachitsanzo omwe ali
  ndi makampani awiri abwinobwino, atha kugwiritsa ntchito mawu 403. Mfundo 403 ziyenera
  kulembedwa mu Trade Register ya Chamber of Commerce. Mawu awa akuwonetsa kuti ngongole
  zandalama zomwe kampaniyi imalembera ndi kuyambira tsiku liti.\\nMbali inayi ya
  mawuwo 403 ndikuti kampani ya makolo yomwe ili ndi mawuwa ikulengeza kuti ndi yomwe
  imayang''anira zomwe mabungwe awo amapereka. Kampani ya makolo ili ndi chindapusa
  cha ngongole zomwe zimachitika chifukwa chalamulo zabungwe lozithandizira. Zopindulitsa
  zingapo izi zikuphatikiza kuti wokongoza ngongole yemwe adapereka mawu 403 atha
  kusankha bungwe lomwe akufuna kuthana nalo pokwaniritsa zomwe akuti: kampani yomwe
  yamaliza mgwirizano woyamba kapena kampani ya kholo yomwe idapereka 403. Ndi ngongole
  zingapo izi, wokongoza amalipiridwa chifukwa chosamvetsetsa pazachuma chomwe amapereka
  mnzake. Pomwe mabizinesi omwe tawatchulawa amangokhala ndi ngongole kwa mnzake yemwe
  mgwirizano unatha, mawu a 403 amapangitsa kuti onse omwe ali ndi ngongole athandizidwe.
  Pangakhale ena obwereketsa omwe angayankhule ndi kampaniyo kuti akwaniritse zonena
  zawo. Mlandu womwe ungakhalepo kuchokera pamawu 403 ndiwofunika. Choipa cha izi
  ndikuti mawu a 403 akhoza kusokoneza gulu lonse pamene othandizira akukumana ndi
  mavuto azachuma. Wothandizira atasokonekera, gulu lonse litha.\\n4.1 Kubweza mawu
  403\\nNdizotheka kuti kampani ya makolo sikufunanso kukhala ndi ngongole pazobweza
  kapena ku zomwe amapereka. Izi zitha kukhala choncho pamene makampani makampani
  akufuna kugulitsa othandizira. Pofuna kuchotsa mawu a 403, njira yomwe ikuchokera
  palemba 2: 404 Dutch Civil Code ikuyenera kutsatiridwa. Njirayi imakhala ndi zinthu
  ziwiri. Choyamba, mawu 403 amayenera kuchotsedwa. Kulengeza kuchotsedwa kuyenera
  kuyikidwa mu Trade Register ya Chamber of Commerce. Izi zikutanthauza kuti kampani
  yothandizidwayo ilibe udindo uliwonse pakubwezera ndalama zothandizira kampaniyi.
  Komabe, malinga ndi nkhani yachiwiri: 2 ndime 404 Dutch Civil Code, kampani ya makolo
  ikhalabe ndi mangawa chifukwa cha milandu yomwe inalembedwa 2 isanachotsedwa. Mlanduwo
  umapitilizabe kukhala ndi ngongole zochokera m''mapangano omwe anamaliza atapereka
  mawu 403, koma asanapereke chilengezo chofuna kuchotsedwa. Izi ndikuti muteteze
  wokongoletsa, yemwe atha kukhala pachigwirizano ndikutsimikiza kwa mawuwo 403.\\nKomabe,
  ndizotheka kuthetsa ngongole zokhudzana ndi zochitika zamilandu zam''mbuyomu. Kuti
  tichite izi, njira zowonjezera, zochokera mulemba 2: 404 ndime 3 Dutch Civil Code,
  ziyenera kutsatiridwa. Mikhalidwe ingapo imagwira ntchito motere:\\n- othandizira
  sangakhalenso mgululi;\\n- chidziwitso cha cholinga chothetsa mawuwo 403 chiyenera
  kuti chinali chopezeka kuti chifufuzidwe ku Chamber of Commerce kwa miyezi yosachepera
  iwiri;\\n- osachepera miyezi iwiri ayenera kuti adadutsa chilengezochi atalengeza
  kuti achotse ntchito atayimitsidwa.\\nKuphatikiza apo, omwe amabwereketsa ngongole
  akadali ndi mwayi wotsutsa cholinga chothetsa zomwe 403 zimanena. Mfundo 403 zimatha
  kutha kutsutsidwa ngati palibe wotsutsa kapena wosagwirizana ndi nthawi yake kapena
  wotsutsa ngati walengeza kuti ndi wosavomerezeka ndi woweruza. Pokhapokha ngati
  zifukwa zokwanira kubwezeretsa ndikuchotsa mawuwo 403 zikwaniritsidwe, kampaniyo
  siikhalanso ndi ngongole iliyonse pazobweza. Ndikofunikira kuti kubwezeretsa ndikuchotsa
  ntchitoyi kuchitike mosamala; ngati kuchotsedwa kapena kuchotsedwa sikunachitikebe
  bwino, kampani ya kholo ikhoza kukhalanso ndi mlandu wa ngongole zothandizira zomwe
  zakhala zikugulitsidwa zaka zapitazo.\\n5. Ngongole ndi chikole\\nChitetezo cha
  zachuma chitha kupezekanso pokhazikitsa nyumba kapena chikole. Ngakhale mitundu
  iyi ya chitetezo zachuma imafanana kwambiri, pali zosiyana zingapo.\\n5.1. Ngongole\\nNgongole
  yanyumba ndi chitetezo chazachuma chomwe maphwando anganene. Ngongole imakhala kuti
  chipani chimodzi chimapereka ngongole ku chipani china. Pambuyo pake, ngongole yanyumba
  imalembedwa kuti apeze chitetezo pazachuma pobweza ngongoleyi. Ngongole yanyumba
  ndi ufulu wokhala ndi katundu womwe ungakhazikitsidwe pokhudzana ndi katundu wa
  wobwereketsa. Ngati wokongoza sangakwanitse kubweza ngongole yake, wobwereketsa
  atha kufunsa nyumbayo kuti akwaniritse zomwe akufuna. Zitsanzo zodziwika bwino za
  kubweza ngongole ndi mwininyumba yemwe wavomera kubanki kuti banki imupatsa ngongole
  ndiye agwiritse ntchito nyumba yake ngati chitetezo pobweza ngongoleyo. Komabe,
  izi sizitanthauza kuti ngongole yanyumba ikhoza kukhazikitsidwa kokha kudzera kubanki.
  Makampani ena komanso anthu ena amathanso kumalizitsa ngongole yanyumba. Matchulidwe
  mu ngongole zanyumba atha kukhala osokoneza. M''malankhulidwe abwinoko, phwando,
  mwachitsanzo, banki, limapereka ngongole kwa chipani china. Komabe, kuchokera pakuwona
  mwalamulo, wobwereketsa ndi amene amapereka ngongole, pomwe phwando lomwe limapereka
  ngongole ndiomwe amakhala. Bankiyo ndiye imasunga ngongole ndipo munthu amene akufuna
  kugula nyumba ndi yemwe amapereka ngongole yanyumba.\\nKhalidwe la chanyumba ndi
  chakuti ngongole zanyumba sizingathe kumangidwa pachilichonse; malinga ndi nkhani
  3: 227 Dutch Civil Code, ngongole yanyumba ikhoza kukhazikitsidwa kokha pazinthu
  zolembedwa. Malo olembetsedwa akagulitsidwa, kuperekako kuyenera kulembetsedwera
  m''marejista aboma. Pokhapokha kulembetsa kumeneku, malo olembetsedwa amapezedwa
  ndi wogula. Zitsanzo za malo olembetsedwa ndi malo, nyumba, mabwato ndi ndege. Galimoto
  si lolembetsedwa. Kuphatikiza apo, ngongole yanyumba ikhoza kukhazikitsidwa kokha
  kuti ipindule ndi ''chidziwitso chokwanira''. Izi zikuchokera palemba 3: 231 Dutch
  Civil Code. Izi zikutanthauza kuti ziyenera kukhala zowona bwino pofotokoza kuti
  ngongole yomwe yakhazikitsidwa ndiyotani. Ngati wobwereketsa ali ndi ziwonetsero
  ziwiri motsutsana ndi wokongoza, ziyenera kukhala zowonekera pofotokoza kuti ndi
  ziti mwa zomwe awiriwo amati ufulu wobwereketsa waperekedwa. Komanso, mwini wake
  wa nyumbayo yomwe kukhazikitsidwa nyumba yake ukhazikikebe; umwini sudutsa atakhazikitsa
  ufulu wobweza. Ngongole nthawi zonse imakhazikitsidwa ndikupereka chikalata chovomerezeka.\\nNgati
  wokongoza sangakwaniritse udindo wake wolipirira, wobwereketsa angathe kugwiritsa
  ntchito ufulu wake wogulitsa ngongoleyo mwakugulitsa malowo m''malo mwake momwe
  nyumba yomwe idakhazikitsidwira idakhazikitsidwa. Palibe lamulo laku khothi lofunikira
  pa izi. Izi zimatchedwa kuphedwa kumene ndipo zimachokera mulemba 3: 268 Dutch Civil
  Code. Ndikofunika kukumbukira kuti wobwereketsa amangogulitsa malowo kuti akwaniritse
  zomwe amafuna; sangayene malowo. Kuletsa uku kunanenedwa momveka bwino mu nkhani
  3: 235 Dutch Civil Code. Chofunikira kwambiri pobweza ngongole ndichakuti obweza
  ngongole amayang''ana kwambiri okongoletsa ena omwe akufuna kutenga malowa kuti
  akwaniritse zonena zawo. Izi zikugwirizana ndi nkhani 3: 227 Dutch Civil Code. Panthawi
  yomwe bankili imasungidwa, wobwereketsa ndalama sayenera kuganizira za anzawo omwe
  atenga ngongole, koma akhoza kungogwiritsa ntchito molondola ngongole yake yobweza.
  Ndiye woyamba kubwereketsa ndalama yemwe angakwaniritse zomwe amafuna ndi phindu
  kuchokera kugulitsa nyumba lolembetsedwa.\\n5.2. Lonjezo\\nUfulu wachitetezo womwe
  ungafanane ndi ngongole ndi chikole. Mosiyana ndi ngongole, chikole sichikhazikitsidwa
  pachuma chosasunthika. Komabe, chikhazikitso chitha kukhazikitsidwa pafupifupi pa
  katundu wina aliyense, monga katundu wosunthidwa, ufulu wokhala nawo kapena dongosolo
  komanso ngakhale mutagwiritsa ntchito katunduyo kapena ufulu. Izi zikutanthauza
  kuti chikhazikitso chikhoza kukhazikitsidwa pamagalimoto onse komanso pazambiri
  zomwe mungalandire kuchokera kwa omwe ali ndi ngongole. Wobwereketsa amakhazikitsa
  chikole kuti ateteze zomwe akufuna kuti zilipiridwe. Pangano lidzakwaniritsidwa
  pakati pa wokongoza ngongole (wopereka chikole) ndi wobwereketsa (wopereka chikole).
  Ngati wokongoza sangachite mogwirizana ndi zomwe walipira, wobwereketsa amakhala
  ndi ufulu wogulitsa malowo ndi kukwaniritsa zomwe amafuna ndi phindu lake. Wobweza
  akasiya kutsatira zomwe walipira, wobwereketsa amatha kugulitsa nyumbayo nthawi
  yomweyo. Malinga ndi nkhani 3: 248 Dutch Civil Code, palibe khothi lomwe limafunikira
  kuti izi zitheke, zomwe zikutanthauza kuti kuphedwa nthawi yomweyo kumagwira ntchito.
  Zofanana ndi ngongole yanyumba, wobwereketsa saloledwa kuvomereza malo omwe ufulu
  wa lonjezo umaperekedwa; angogulitsa malowo ndikungokwaniritsa zokhumba zake ndi
  phindu. Izi zikuchokera palemba 3: 235 Dutch Civil Code. Mwakutero, wobwereketsa
  yemwe ali ndi ufulu wolonjeza amakhala ndi mwayi wopitilira ngongole ena ngati abisa
  kapena ayimitsidwa kulipira. Komabe, zitha kukhala ndi vuto ngati chikole chaumboni
  kapena chosavomerezeka chatsirizidwa.\\n5.2.1 Chikole cha possessory ndi chikole
  chosadziwika\\nLonjezo laumwini limamalizidwa pamene nyumbayo ''ikuyang''aniridwa
  ndi wopereka chikole kapena wachitatu''. Izi zikuchokera palemba 3: 236 Dutch Civil
  Code. Izi zikutanthauza kuti katundu wolonjezedwayo amasamutsidwa kwa wokongoza;
  wobwereketsa amakhala ndi malo m''manja mwake panthawi yomwe wolonjezayo akhazikika.
  Lonjezo lokhazikitsidwa limakhazikitsidwa pobweretsa zabwino zomwe zikuyang''aniridwa
  ndi wobwereketsa. Wobwereketsa ayenera kusamalira nyumbayo ndipo mwina akuwongolera.
  Ndalama zokonza ziyenera kubwezeredwa ndi wobwereketsa.\\nKuphatikiza pa lumbiro
  laumboni, tili ndi lonjezo losavomerezeka, lomwe limanenedwanso kuti chikole monga
  cholowa. Izi zikugwirizana ndi nkhani 3: 237 Dutch Civil Code. Ngati chikole chosadziwika
  chikakhazikitsidwa, malowo samayang''aniridwa m''manja mwa wobwereketsa, koma chikalata
  chonena kuti chobisika sichikhazikitsidwa. Uwu ukhoza kukhala chikalata cha notarial
  komanso chikalata chaumwini. Komabe, chikalata chazokha chikuyenera kulembetsedwa
  ku notary kapena kwa msonkho. Malonjezo osagwiritsidwa ntchito nthawi zambiri amagwiritsidwa
  ntchito ndi makampani omwe amafuna kukhazikitsa lonjezo pamakina. Ngati makinawo
  akanakhala kuti abweretsedwa ndi amene wamukongoza, kampaniyo imalephera kuchita
  ntchito zake.\\nLonjezo lokhala ndi ufulu limapereka ufulu wolimba kuposa lumbiro
  losadziwika. Ngati chikole chaumboni chikaperekedwa, wobwereketsa amakhala ndi malowo
  kale. Izi sizili choncho pamene chikole chosadziwika chikakhazikitsidwa. Zikatero,
  wokongoza mnzake ayenera kukakamiza amene ali ndi ngongole kuti apereke katunduyo.
  Kodi ngongole ikakana izi, zingakhale zofunika kukakamiza kufalitsa uthenga wabwino
  kudzera m''khothi. Kusiyana kwa lumbiro loyenera kukhala ndi chikole chomwe sichinasungidweko
  kumathandizanso kuti bankirapuse komanso kuyimitsidwa pakubweza. Monga tafotokozera
  kale, wokongoza ali ndi ufulu kuphedwa nthawi yomweyo; angathe kugulitsa malowo
  nthawi yomweyo kuti akwaniritse zomwe akufuna. Komanso, omwe amasunga chikole amayang''ana
  kwambiri kuposa onse omwe ali ndi ngongole kubanki. Komabe, pali kusiyana pakati
  pa lumbiro lokhala ndi chikole ndi lonjezo losasankhidwa. Omwe ali ndi chikole chomwe
  ali nacho amakhala ndi chidwi kuposa oyang''anira msonkho pomwe wobwereketsa atawonongeka.
  Omwe ali ndi chikole chosadziwika sakhala oyang''anira msonkho; ufulu wa oyang''anira
  msonkho umapambana ufulu wa yemwe ali ndi chikole chosaululika pakubweza kwa yemwe
  ali ndi ngongole. Lonjezo lokhala ndi chuma limapereka chitetezo chambiri nthawi
  yobisika kuposa lumbiro losadziwika.\\n6. Kutsiliza\\nIzi pamwambazi zikuphatikizapo
  kuti pali njira zingapo zopezera chitetezo chachuma: zovuta zingapo, escrow, (kampani
  ya makolo) chitsimikizo, 403-statement, ngongole yanyumba ndi chikole. Mwakutero,
  chitetezo ichi nthawi zonse chimafotokozedwa muchigwirizano. Zachitetezo zina zandalama
  zitha kupangidwa mwanjira yopanda mawonekedwe, malinga ndi zofuna za maphwando omwewo,
  pomwe mabungwe ena azachuma amayendetsedwa ndi malamulo. Zotsatira zake, njira zosiyanasiyana
  zachuma zonse zimakhala ndi zabwino komanso zovuta. Izi zikugwira ntchito kwa onse
  mbali yomwe imafuna chitetezo komanso chipani chomwe chimapereka chitetezo. Zachitetezo
  zina zachuma zimapereka chitetezo chochuluka kwa wokongoza kuposa ena, koma amabwera
  ndi zovuta zina. Kutengera ndi momwe zinthu ziliri, njira yoyenera yachitetezo ikhoza
  kutha pakati pa magulu.\\n[1] Escrow nthawi zambiri amatchedwa chitsimikizo. Komabe,
  malinga ndi lamulo lachi Dutch, pali mitundu iwiri yazachitetezo chachuma yomwe
  imamasulira kuti chitsimikizo mu Chingerezi. Kuti nkhaniyi imveke, mawu oti escrow
  adzagwiritsidwa ntchito poteteza chuma.\\n[2] Mawu oti \\\"guarantor\\\" adatchulidwa
  ponyamula komanso chitsimikizo. Komabe, tanthauzo la mawuwa limadalira ufulu wachitetezo
  womwe ukukhudzidwa.\"", "\"PCD ma saw blades, omwe amadziwikanso kuti Polycrystalline
  Diamond saw blades, ndi zida zapadera zodulira zomwe zimapangidwa kuti zidulire
  bwino zida zolimba komanso zowononga. Wopangidwa kuchokera ku gulu la diamondi yopangidwa,
  macheka awa amapereka kulimba kwapamwamba komanso kukana kuvala, kuwapangitsa kukhala
  abwino kwa mafakitale omwe amafunikira kulondola komanso kulimba. M''nkhaniyi, tiwona
  mawonekedwe, ntchito, ndi ubwino wa macheka a PCD, kuwunikira chifukwa chake ndi
  chisankho chomwe chimakondedwa kwa akatswiri omwe amagwira ntchito ndi zida zovuta.\\nKumvetsetsa
  PCD Saw Blades\\nMasamba a PCD ndi zida zodulira zomwe zimaphatikiza Polycrystalline
  Diamondi (PCD) ngati zida zawo zazikulu. PCD ndi chida chopangidwa ndi diamondi
  chomwe chimaphatikiza kuuma kwakukulu ndi kulimba, ndikupangitsa kuti ikhale yoyenera
  kudula zinthu zolimba komanso zonyezimira monga zitsulo, konkire, ndi zophatikiza.
  Mosiyana ndi masamba amtundu wa carbide-nsonga, omwe amatha msanga akamadula zida
  zolimba, masamba a PCD amasunga kuthwa kwawo kwa nthawi yayitali.\\nMawonekedwe
  a tsamba la ma PCD amakhala ndi chitsulo chogwira ntchito kwambiri chokhala ndi
  zigawo za PCD zowotcherera kapena kuzingiriridwa pamwamba. Magawo a PCD awa amapangidwa
  pomanga tinthu tating''ono ta diamondi kukhala cholimba pansi pa kutentha kwakukulu
  ndi kupanikizika, kupanga chinthu chomwe sichimamva kuvala ndi kung''ambika.\\nZofunika
  Kwambiri pa PCD Saw Blades\\n1. Kukhalitsa ndi Moyo Wautali: Chimodzi mwazinthu
  zodziwika bwino za ma PCD ma saw ndi kutalika kwa moyo wawo. Kuuma kwa PCD kumapangitsa
  kuti tsamba la macheka likhalebe lakuthwa komanso lolondola kwa nthawi yayitali
  poyerekeza ndi masamba amtundu wa carbide kapena zitsulo.\\n2. Kudula Mwachidule:Masamba
  a PCD amadula bwino kwambiri, zomwe zimapangitsa mabala osalala, oyera opanda ma
  burrs kapena zolakwika. Mlingo wolondola uwu ndi wofunikira kwambiri pamagwiritsidwe
  ntchito pomwe ubwino wa malo odulidwa ndi ofunika kwambiri.\\n3. Kudula Kwambiri
  Mwachangu: Chifukwa chakuthwa kwawo komanso kuuma kwawo, masamba a PCD amatha kudula
  zida zolimba pa liwiro lalikulu. Izi zimapangitsa kuti ntchito ziwonjezeke komanso
  kuchepetsa nthawi yosinthira zida.\\n4. Kusamalira Kochepa:Chikhalidwe chosamva
  kuvala cha PCD chimatsimikizira kuti macheka amafunikira kusamalidwa pang''ono komanso
  kusinthidwa pang''ono, kuwapanga kukhala njira yotsika mtengo pakapita nthawi.\\n5.
  Kusinthasintha:Masamba a PCD akupezeka mu makulidwe ndi mapangidwe osiyanasiyana,
  kuwapangitsa kukhala oyenera kugwiritsa ntchito zosiyanasiyana m''mafakitale osiyanasiyana.\\nMapulogalamu
  a PCD Saw Blades\\nMasamba a PCD amagwiritsidwa ntchito kwambiri m''mafakitale omwe
  zinthu zimakhala zolimba komanso zovuta kuzidula. Nazi zina mwazomwe zimagwiritsidwa
  ntchito nthawi zambiri:\\n1. Kumanga matabwa:M''makampani opangira matabwa, masamba
  a PCD amagwiritsidwa ntchito podula matabwa olimba, matabwa a laminated, MDF, plywood,
  ndi zinthu zina zamatabwa. Amapereka mabala oyera, olondola ndi kuvala kochepa,
  kuchepetsa kusinthasintha kwa tsamba ndikuwonjezera zokolola.\\n2. Kudula Zitsulo:Zida
  za PCD zimagwiritsidwanso ntchito popanga zitsulo podula aluminiyamu, mkuwa, mkuwa,
  ndi zitsulo zina zopanda chitsulo. Kuthekera kwawo kukhalabe akuthwa ngakhale akudula
  zinthu zonyezimira kumawapangitsa kukhala abwino kwa izi.\\n3. Composites ndi Pulasitiki
  Kudula:Mafakitale omwe amagwira ntchito yopanga zida zophatikizika, magalasi a fiberglass,
  ndi mapulasitiki amapindula ndi kulondola komanso kulimba kwa macheka a PCD. Zidazi
  nthawi zambiri zimakhala ndi zovuta pakudula chifukwa cha kuuma kwawo, koma ma PCD
  amawona bwino pakuthana nawo mosavuta.\\n4. Kumanga ndi Kudula Mwala: Zomera za
  PCD ndizothandiza kwambiri pakudula konkriti, miyala, ndi phula, zomwe zimapangitsa
  kukhala chida chamtengo wapatali pantchito yomanga ndi kugwetsa. Kukhoza kwawo kulimbana
  ndi zovuta za zipangizozi kumatsimikizira kugwira ntchito kosasinthasintha.\\nUbwino
  Wogwiritsa Ntchito Masamba a PCD\\n1. Kupulumutsa Mtengo:Ngakhale masamba a PCD
  amatha kukhala okwera mtengo kwambiri kuposa macheka achikhalidwe, kutalika kwawo
  kwa moyo wawo komanso kutsika mtengo wokonza kumawapangitsa kukhala okonda ndalama
  pakapita nthawi.\\n2. Ubwino Wodula: Kuthwanima komanso kulimba kwa masamba a PCD
  kumabweretsa mabala apamwamba kwambiri, kuchepetsa kufunika komaliza kumaliza ndikuwongolera
  mtundu wonse wazinthu.\\n3. Kuchulukirachulukira:Kukhalitsa kwa ma PCD ma saw blades
  kumathandizira kuthamanga kwachangu komanso kuchepetsa nthawi yochepetsera, zomwe
  zimapangitsa kuti pakhale zokolola zambiri komanso zogwira mtima popanga.\\n4. Ubwino
  Wachilengedwe:Ndi moyo wawo wautali komanso kuchepa kwa kufunikira kosinthidwa pafupipafupi,
  masamba a PCD amathandizira kuchepetsa zinyalala komanso kugwiritsa ntchito zinthu
  zochepa, kuwapangitsa kukhala okhazikika pamabizinesi.\\nPCD saw blades ndi chisankho
  chabwino kwambiri kwa mafakitale omwe amafunikira zida zodula kwambiri. Kaya mukugwira
  ntchito ndi matabwa, zitsulo, zinthu zophatikizika, kapena konkriti ndi miyala,
  masambawa amapereka kulimba, kulondola, komanso luso lapadera. Ukadaulo wapamwamba
  wa PCD ma saw blades umatsimikizira kuti amakhala akuthwa ndikudula mphamvu kwa
  nthawi yayitali, zomwe zimapangitsa kuti achepetse mtengo, azigwira bwino ntchito,
  komanso kuti azidula bwino. Pamene mafakitale akupitirizabe kufuna kuchita bwino
  komanso kulondola pa ntchito yawo yodula, ntchito ya ma PCD saw blades idzapitirira
  kukula, kupereka njira zothetsera ntchito zosiyanasiyana.\\nNthawi yotumiza: Feb-21-2025\"",
  "\"Ili kuti nyumba ya panda wamkulu? \\\" \\\"Kodi ziphona zazikulu zimadya chiyani?\\\"
  \\\"Kodi panda wamkulu amadya makilogalamu angati tsiku limodzi?\\\" Pamalo pamwambowu,
  gulu la alendo komanso Casablanca nzika zakomweko zidafunsa mwininyumbayo mafunso
  awa ndi enanso.\\nPambuyo pochita masewera olimbitsa thupi a panda, mkati mwa panda
  yoyandikana ndi zojambula za DIY, akatswiri odziwa zaluso komanso anthu wamba adatenga
  nawo gawo pazithunzi zopanda panda za panda. Zojambulazo zidavoteledwa pompopompo
  ndipo zidaperekedwa bwino kwambiri ndi mphotho.\\nNdi chimphona panda monga malo
  ofikira mwambowu, ziwonetsero za Zachikhalidwe cha Sichuanalendo anali ndi chidwi
  ndi malo osiyanasiyana okongola komanso miyambo yosangalatsa.\\nMadzulo a June 11,
  nthawi yakomweko, mumzinda wodziwika bwino waku Moroccan wa Casablanca, unyinji
  wa alendo mazana ndi nzika zakomweko adasonkhana mkati mwa malo ogulitsira a Tachfine
  Center. Chomwe chidawakopa chidwi ndi ma panda osangalatsa odula zovala, gawo la
  mafunso ndi mayankho onena za panda zazikulu, ndi zojambula za panda. Zomwe zinali
  pamalopo zinali zosangalatsa ndipo ambiri \\\"adakonda\\\" mwambowu pamawayilesi
  ochezera. Izi zinali chabe chithunzithunzi cha zomwe zikuchitika mu 2018 Pulogalamu
  Yokongola ya Sichuan, Kuposa Pandas \\\"Sichuan Tourism Promotion ku Morocco.\\nSichuan
  Sikuti ndi nkhalango zokha zokha komanso ndimasamba ambiri abwino komanso zakudya
  zokoma. Otsatira a panda wamkulu adafotokoza izi Zachikhalidwe cha Sichuan malingaliro
  owoneka bwino komanso zikhalidwe monga Sichuan zakudya ndizovuta kwambiri, motero
  Sichuan ndichisankho choyenera kwambiri ngati komwe mukupita. Opezekapo ambiri amafuna
  kupeza Sichuan zokometsera zokopa alendo kuchokera ku panda zidachita mascots amakhalidwe
  abwino.\\nNtchito Yomanga Yogwirizana ya \\\"Belt and Road\\\", Dinani mu Kugwirizana
  Potheka mu Makampani Oyendera\\nZolemba za 2018 chikumbutso cha 60th chokhazikitsidwa
  kwa maubale pakati pa China ndi Morocco. M''zaka zaposachedwa, ubale wabwino komanso
  wogwirizana pakati pa mayiko awiriwa upitilizabe kupita patsogolo, ndipo mgwirizano
  ndi kusinthana m''magulu azachuma, malonda ndi zikhalidwe zalimbikitsidwanso mosalekeza.\\nMgwirizano
  wapakati Sichuan ndi Morocco imalemekezedwanso nthawi. Koyambirira kwa 2008, kutachitika
  chivomezi chowopsa komanso chowononga cha Wenchuan mu Sichuan, atsogoleri a Morocco
  adayimbira anzawo achi China kuti apereke chitonthozo, ndikutsatiridwa ndi chopereka
  cha USD 1 miliyoni kudera lomwe lakhudzidwa ndi tsoka. Mu 2016, mgwirizano wopanga
  maubwenzi apadziko lonse lapansi amzinda udasainidwa pakati Sichuan likulu Chengdu
  ndi mzinda wa Fez ku Moroko, ndipo atakhazikitsa mgwirizano pakati pa mizindayi
  maphwando awiriwa asinthana ndi kugwirira ntchito zosiyanasiyana monga zachuma,
  malonda, chikhalidwe, maphunziro, zokopa alendo komanso kusungitsa zolemba zakale.\\nZochitika
  zomwe zidachitika mchaka chatha kuphatikiza \\\"2017 Tianfu Culture Sabata\\\" mu
  Morocco, \\\"Lowani China, Experience Chengdu\\\" zikondwerero ndi chikondwerero
  cha ku China cha Chaka Chatsopano, komanso \\\"Sichuan Wokongola, Kuposa Pandas\\\"
  Kampeni Yotsatsa alendo ku Sichuan, zabweretsa kusinthana ndi ziwonetsero zambiri
  za Sichuan chikhalidwe ndi zokopa alendo kuti Morocco.\\nMonga mnzake wothandizana
  naye pomanga \\\"Belt ndi Road,\\\" Morocco ndi ofanana Sichuan popeza ilinso ndi
  malo ambiri a \\\"World Natural and Cultural Heritage\\\", motero zipani ziwirizi
  zikugawana kuthekera kwakukulu pakuchita mgwirizano ndikusinthana kokopa alendo
  padziko lonse lapansi. Yatsani June 12, nthawi yakomweko, Sichuan Tourism Marketing
  Group motsogozedwa ndi Fu Yonglin, director of Sichuan Tourism Development Commission,
  adayendera ku Fez Bureau of Tourism, komwe alendo aku China adayambitsa ndikulimbikitsa
  Zachikhalidwe cha Sichuan zothandizira zokopa alendo komanso adayitanitsa a Fez
  Bureau of Tourism ndi mabungwe oyendera madera kuti abwere Sichuan kuti mulimbikitse
  kulumikizana ndi mgwirizano.\\nLimbikitsani Kusinthana Kwachikhalidwe Chawo, Pangani
  Mapulani Olumikizana Pragmatic\\nPosachedwa, Fu Yonglin, director of Sichuan Tourism
  Development Commission, adatsogolera Sichuan Tourism Marketing Group kuti ichite
  zinthu zingapo polimbikitsa Sichuan chikhalidwe cha zokopa alendo komanso malonda
  ndi chuma mu nkhukundembo. pa June 8, Director Fu adatsogolera gululi kuti lichezere
  mwapadera ku Turkey Tourism Association, ndipo adalankhula ndi Kalay, membala wa
  Board of Directors komanso Berna Akar, Woyang''anira Dipatimenti Yachilendo. Magulu
  onse awiriwa adabweretsa zikhalidwe zawo zokopa alendo komanso zopangira zida zawo
  motsatana, ndipo adasinthana mozama momwe angagwirizanitsire bwino magawo ngati
  kupanga zinthu, alendo omwe akutulutsa komanso kutsatsa kophatikizika poyang''ana
  kwambiri pamalingaliro a \\\"Belt and Road\\\".\\nIbrahim Halil Kalay, membala wa
  Board of Directors of Turkey Tourism Association, adati ndizachuma komanso mitundu
  yambiri yazokopa alendo, Sichuan imakopa alendo ambiri aku Turkey. Msonkhanowu ndiwofunitsitsa
  kupanga nsanja yosinthana ndi mgwirizano pakukopa alendo pakati pa mbali ziwirizi,
  ndikulimbikitsa kufalitsa ndi kupititsa patsogolo Sichuan zokopa alendo, pofuna
  kulimbikitsa mgwirizano pakati pa mabizinesi ochokera mbali zonse ndikupanga alendo
  ambiri kuti azikacheza Sichuan.\\nChen Hongtao, wachiwiri kwa manejala wamkulu wa
  Sichuan China International Travel Agency Co, Ltd., m''malo mwa mabungwe ena atatu
  oyendera zokopa alendo, adatinso ali ofunitsitsa kugwirira ntchito limodzi ndi Turkey
  Entry & Exit Travel Agency pomanga mgwirizano wanthawi yayitali mgwirizano ndi mlatho
  waubwenzi pakati pa mbali ziwiri.\\nKampeni ya \\\"Kukongola kwa Sichuan, Kuposa
  Pandas\\\" ya Sichuan Tourism Promotion Campaign ikufuna kugwiritsa ntchito panda
  yayikulu ngati nthumwi yake podziwitsa anthu dziko lapansi Zachikhalidwe cha Sichuan
  zikhalidwe zachilengedwe ndi zokopa alendo, kwezani Zachikhalidwe cha Sichuan kutchuka
  kwapadziko lonse lapansi, kukulitsa kusinthana pakati Sichuan komanso padziko lonse
  lapansi pachikhalidwe, zokopa alendo, zachuma ndi malonda, ndikulimbikitsa kulumikizana
  ndi mayiko osiyanasiyana. Chiyambireni chaka chino, kampeni yokopa alendo ya Sichuan
  ya \\\"Beautiful Sichuan, More than Pandas\\\" yakhala ikuchitika kale m''maiko
  angapo monga Japan, nkhukundembo ndi Morocco. Ntchito zomwe zachitika pamsonkhanowu
  zakhala zosangalatsa komanso zopatsa chidwi, ndipo Sichuan zokopa alendo, monga
  zikuyimira panda yayikulu, zakopa chidwi cha akatswiri okaona malo, anthu wamba
  komanso atolankhani.\"", "\"Mayi anga atangotsala pang\u2019ono kubatizidwa mu 1941,
  bambo anga anawauza kuti: \u201cUkangobatizidwa ndikusiya!\u201d Koma mayiwo sanabwerere
  m\u2019mbuyo moti anabatizidwa posonyeza kuti adzipereka kwa Yehova. Zitatero, bambo
  anachokadi ndipo pa nthawiyo n\u2019kuti ndili ndi zaka 8 zokha.\\nKOMA ndinali
  nditayamba kale kuchita chidwi ndi mfundo za m\u2019Baibulo. Mayi anga ankalandira
  mabuku othandiza kuphunzira Baibulo ndipo ine ndinkakonda kwambiri mabukuwo, makamaka
  zithunzi zake. Bambo sankafuna kuti mayi azindiphunzitsa Baibulo. Koma ndinali ndi
  mafunso ambiri choncho bambo akachoka, mayi ankandiphunzitsa. Ndiyeno mu 1943, ndili
  ndi zaka 10, ndinabatizidwa ku Blackpool ku England.\\nNDINAYAMBA KUTUMIKIRA YEHOVA\\nKungoyambira
  nthawi imeneyo, ine ndi mayi tinkakonda kulowa mu utumiki. Tinkagwiritsa ntchito
  magalamafoni ndipo ankakhala akuluakulu komanso olemera kwambiri. Ena mpaka ankalemera
  makilogalamu 4.5. Komabe ineyo ngakhale kuti ndinali mwana, ndinkanyamula magalamafoniwa.\\nNdili
  ndi zaka 14 ndinkafuna kuyamba upainiya. Mayi anandiuza kuti ndilankhule ndi mtumiki
  wadera. Koma iye anandiuza kuti zingakhale bwino nditaphunzira kaye ntchito inayake
  yamanja kuti ndizidzatha kupeza kandalama kondithandiza. Ndinachitadi zimenezo.
  Nditagwira ntchito kwa zaka ziwiri, ndinafunsanso mtumiki wadera wina ndipo anandiuza
  kuti: \u201cUngathe kuyamba upainiya.\u201d\\nChoncho mu April 1949 ine ndi mayi
  tinagulitsa katundu wam\u2019nyumba mwathu ndipo wina tinangopatsa anthu. Titatero
  tinasamukira ku Middleton pafupi ndi mzinda wa Manchester n\u2019kuyamba upainiya.
  Patatha miyezi 4 ndinasankha m\u2019bale wina kuti ndizichita naye upainiya. Ofesi
  ya nthambi inatiuza kuti tisamukire ku mpingo wina wa ku Irlam womwe unali utangoyamba
  kumene. Koma mayi ndi mlongo wina ankachita upainiya mumpingo wina.\\nNgakhale kuti
  ndinali ndi zaka 17 zokha, ine ndi mnzanga uja tinapatsidwa udindo woti tizichititsa
  misonkhano ya mpingo chifukwa mu mpingowo munalibe abale audindo okwanira. Kenako
  ananditumiza ku mpingo wa Buxton komwe kunali ofalitsa ochepa ndipo kunkafunika
  thandizo. Ndimaona kuti zonsezi zinandithandiza kukonzekera maudindo a m\u2019tsogolo.\\nMu
  1951 ndinalemba fomu yopempha kuti ndipite ku Sukulu ya Giliyadi. Koma mu December
  1952 ndinaitanidwa kuti ndikalowe usilikali. Ndinayesa kudziteteza ponena kuti ndine
  mtumiki wa nthawi zonse. Koma akhoti anakana ndipo anagamula kuti ndikakhale kundende
  miyezi 6. Ndili kundendeko ndinalandira kalata yoti ndikalowe kalasi ya nambala
  22 ya Sukulu ya Giliyadi. Choncho mu July 1953 ndinakwera sitima yapamadzi, ulendo
  wopita ku New York ku sukuluyi.\\nNditafika ndinali ndi mwayi wokhala nawo pamsonkhano
  waukulu wa mutu wakuti, Anthu a Dziko Latsopano. Kenako ndinakwera sitima yapamtunda
  kupita ku South Lansing kumene kunkachitikira sukuluyi. Koma popeza ndinali nditangotuluka
  kumene kundende, ndinalibe ndalama zokwanira. Choncho nditatsika sitima ndinachita
  kubwereka ndalama kwa munthu wina kuti ndiwonjezere thiransipoti yokwerera basi.\\nANATITUMIZA
  KU PHILIPPINES\\nKu Sukulu ya Giliyadi tinaphunzira zinthu zambiri zimene zinatithandiza
  kuti \u2018tikhale zinthu zonse kwa anthu osiyanasiyana,\u2019 pochita utumiki wa
  umishonale. (1 Akor. 9:22) Titamaliza sukuluyi, ineyo, Paul Bruun ndi Raymond Leach
  anatiuza kuti tipite ku Philippines. Tinayembekezera kwa miyezi ingapo kuti tipeze
  ziphaso zoyendera. Kenako tinauyamba ulendo wa panyanja. Tinakwera sitima yopita
  ku Rotterdam, ndipo tinadzera kunyanja ya Mediterranean, kudutsa ku Suez Canal kukafika
  kunyanja ya India. Kuchoka pamenepa tinafika ku Malaysia kenako ku Hong Kong. Pamapeto
  pake tinafika ku Manila pa 19 November, 1954 moti tinayenda panyanja kwa masiku
  47.\\nTinkafunika kusintha kuti tizolowere chikhalidwe chatsopano, dziko lachilendo
  komanso kuti tiphunzire chinenero. Koma tonse atatu anatiika mumpingo wina wa mumzinda
  wa Quezon komwe anthu ambiri ankalankhula Chingelezi. Choncho panatha miyezi 6 tikungodziwa
  mawu ochepa chabe achitagalogi. Koma utumiki wathu wotsatira unatithandiza kuthetsa
  vutoli.\\nTsiku lina mu May 1955 titangofika kuchokera mu utumiki, ineyo ndi M\u2019bale
  Leach tinapeza makalata onena kuti taikidwa kukhala oyang\u2019anira dera. Pa nthawiyo
  n\u2019kuti ndili ndi zaka 22 zokha. Utumikiwu unandipatsa mwayi woti \u2018ndikhale
  zinthu zonse kwa anthu osiyanasiyana\u2019 m\u2019njira zinanso.\\nMwachitsanzo,
  ndinakamba nkhani yanga yoyamba yapoyera panja pa sitolo ina. Kenako ndinamva kuti
  ku Philippines ankaona kuti nkhani yapoyera inkayenera kukambidwa pabwalo. Ndikamayendera
  mipingo, ndinkakamba nkhani zapoyera m\u2019malo ngati m\u2019nyumba zikuluzikulu,
  m\u2019misika, m\u2019mabwalo a masewera, m\u2019mapaki komanso m\u2019mbali mwa
  misewu ikuluikulu. Nthawi ina ndili mumzinda wa San Pablo ndinalephera kukamba nkhani
  pamsika chifukwa cha mvula. Choncho ndinauza abale kuti tikakambire nkhaniyo mu
  Nyumba ya Ufumu. Pambuyo pake abale anafunsa ngati tingapereke lipoti loti pakambidwa
  nkhani yapoyera popeza sinakambidwe poyera.\\nNthawi zonse ndinkakhala m\u2019nyumba
  za abale. Abalewa analibe zinthu zambiri koma nyumba zawo zinali zaukhondo. Nthawi
  zambiri ndinkagona pamkeka ndipo pansi pa nyumbazi pankakhala pa matabwa. Kunalibe
  mabafa moti ndinaphunzira kusamba panja. Ndikamapita pazilumba zina ndinkayenda
  pa basi kapena pa boti. Pa nthawi yonse imene ndakhala ndikuchita utumiki, sindinakhalepo
  ndi galimoto.\\nKulalikira komanso kuchezera mipingo kunandithandiza kuti ndidziwe
  Chitagalogi. Sindinalowe m\u2019kalasi yophunzitsa chinenerochi koma ndinaphunzira
  kwa abale, mu utumiki komanso pamisonkhano. Abale anandithandiza kwambiri ndipo
  ndimayamikira zimene ankandiuza.\\nUtumiki wina umene ndinapatsidwa unandithandiza
  kuti ndisinthenso zinthu zina. Mu 1956 M\u2019bale Nathan Knorr atabwera ku Philippines
  ndinapemphedwa kuti ndizilankhula ndi atolankhani pamsonkhano.\\nNdinali ndisanagwirepo
  ntchitoyi koma abale ena anandithandiza. Pasanathe chaka, tinakhalanso ndi msonkhano
  waukulu ndipo kunabwera M\u2019bale Frederick Franz wochokera kulikulu. Ineyo ndinali
  woyang\u2019anira msonkhano. Pamene M\u2019bale Franz ankakamba nkhani yake, anavala
  zovala zomwe anthu a ku Philippines amakonda kuvala. Abale anasangalala kwambiri
  ndi zimenezi ndipo zinandiphunzitsa kuti ndiyenera kusintha kuti ndizigwirizana
  ndi anthu.Nditakhala woyang\u2019anira chigawo, ndinafunika kusinthanso zinthu zina.
  Pa nthawiyo tinkaonetsa filimu yakuti, Chimwemwe cha Anthu a Dziko Latsopano. Nthawi
  zina tinkaonetsa filimuyi panja choncho pankakhala tizilombo touluka tambirimbiri.
  Tizilomboti tinkatsatira kuwala ndipo tinkakakamira mupulojekita imene tinkagwiritsa
  ntchito. Chinali chintchito kuchotsa tizilomboti mupulojekitayo. Sizinali zophweka
  kuonetsa filimuyi koma tinkasangalala kuona mmene zinkathandizira anthu kudziwa
  gulu la Yehova.\\nAnsembe a Katolika ankaumiriza akuluakulu a boma kuti asatilole
  kuchita misonkhano yathu. Tikamachita msonkhano pafupi ndi matchalitchi awo, ankaimba
  belu pofuna kusokoneza msonkhanowo. Komabe ntchito yathu inapitiriza kuyenda bwino
  ndipo\\nanthu ambiri a m\u2019madera amenewo anayamba kulambira Yehova.UTUMIKI UMENE
  UNACHITITSA KUTI TISINTHE ZAMBIRI\\nMu 1959 ndinalandira kalata yondiuza kuti ndikayambe
  kutumikira ku ofesi ya nthambi mumzinda wa Quezon. Kumenekunso ndinaphunzira zambiri.
  Patapita nthawi, ndinapemphedwa kuti ndiziyendera abale ndi alongo m\u2019mayiko
  osiyanasiyana. Pa ulendo wina, ndinakumana ndi mlongo wina dzina lake Janet Dumond.
  Mlongoyu anali mmishonale ku Thailand. Tinayamba kulemberana makalata ndipo kenako
  tinakwatirana. Panopa tatumikira limodzi mosangalala kwa zaka 51.\\nNdayenda m\u2019mayiko
  okwana 33. Ndimasangalala kwambiri kuti utumiki umene ndinkachita poyamba paja unandithandiza
  kukonzekera kuti ndizichita zinthu bwino ndi anthu a mitundu yosiyanasiyana. Maulendo
  amene ndayenda andithandiza kudziwa zinthu za m\u2019mayiko osiyanasiyana ndipo
  ndatsimikiza kuti Yehova amakonda anthu a mitundu yonse.\u2014Mac. 10:34, 35.\\nTIMAFUNIKABE
  KUSINTHA ZINA NDI ZINA\\nKunena zoona ndimasangalala kwambiri kutumikira limodzi
  ndi abale a ku Philippines kuno. Panopa chiwerengero cha ofalitsa chawonjezeka ka
  10 tikayerekeza ndi mmene chinaliri pa nthawi imene ndinafika m\u2019dzikoli. Ine
  ndi mkazi wanga tikupitirizabe kutumikira panthambi. Ngakhale kuti ndakhala ku Philippines
  kuno kwa zaka zoposa 60, ndimakhalabe wokonzeka kusintha kuti ndigwirizane ndi zimene
  Yehova akufuna. Komanso tikuona kuti tiyenera kukhala ololera kuti tizitha kuchita
  zinthu mogwirizana ndi kusintha kumene kwachitika posachedwapa m\u2019gululi.\\nTimayesetsa
  kutsatira malangizo a Yehova ndipo izi zatithandiza kuti tizikhala mosangalala.
  Tikuyesetsanso kusintha zinthu zina ndi zina kuti tizitha kutumikira bwino abale
  athu. Cholinga chathu n\u2019chakuti tikhale \u201czinthu zonse kwa anthu osiyanasiyana\u201d
  pochita zilizonse zimene Yehova akufuna.\"", "\"Baibulo la pa Intaneti\\nBAIBULO
  LA DZIKO LATSOPANO LA MALEMBA OPATULIKA\\n21 \u201cNdipo izi ndizo zigamulo zoti
  uwaikire:+\\n2 \u201cUkagula kapolo wachiheberi,+ adzakhala kapolo wako kwa zaka
  6, koma m\u2019chaka cha 7 azimasuka ndipo azichoka osam\u2019lipiritsa.+\\n3 Ngati
  anabwera ali yekha, adzachokanso ali yekha. Ngati ali ndi mkazi, mkazi wakeyo adzapita
  naye.\\n4 Ngati mbuye wake wamupatsa mkazi n\u2019kubereka naye ana aamuna kapena
  aakazi, mkaziyo ndi ana ake adzakhala a mbuye wake,+ ndipo mwamunayo adzachoka yekha.+\\n5
  Koma kapoloyo akanena motsimikiza kuti, \u2018Ndimam\u2019konda kwambiri mbuye wanga,
  mkazi wanga ndi ana anga, ndipo sindikufuna kuchoka monga womasulidwa,\u2019+\\n6
  pamenepo mbuye wakeyo azibwera naye pafupi ndi Mulungu woona ndi kufika naye pachitseko
  kapena pafelemu. Akatero mbuye wakeyo amuboole khutu ndi choboolera, ndipo iye adzakhala
  kapolo wake moyo wake wonse.+\\n7 \u201cMunthu akagulitsa mwana wake wamkazi kukhala
  kapolo,+ sadzachoka mmene akapolo aamuna amachokera.\\n8 Ngati mbuye wake sanakondwere
  naye kuti akhale mkazi wake wamng\u2019ono+ koma wamulola kuwomboledwa, mbuyeyo
  alibe ufulu womugulitsa kwa anthu a mtundu wina chifukwa wam\u2019chitira zachinyengo.\\n9
  Koma akamupereka kwa mwana wake wamwamuna, azim\u2019patsa ufulu wonse umene umaperekedwa
  kwa ana aakazi.+\\n10 Mwana wamwamunayo akakwatira mkazi wina, woyambayo asaleke
  kum\u2019patsa chakudya, zovala+ ndi mangawa ake+ a mu ukwati.\\n11 Koma ngati sakum\u2019patsa
  zinthu zitatu zimenezi, mkaziyo achoke popanda kupereka chilichonse, popanda kumulipiritsa
  ndalama.\\n12 \u201cAmene wamenya munthu mpaka munthuyo kufa ayenera kuphedwa ndithu.+\\n13
  Koma ngati sanachite kum\u2019dikirira, ndipo Mulungu woona walola kuti mwangozi
  munthuyo afere m\u2019manja mwake,+ pamenepo ndidzakukonzerani malo amene angathawireko.+\\n14
  Munthu amene wapsera mtima mnzake mpaka kumupha mwachiwembu,+ ngakhale atathawira
  kuguwa langa lansembe kuti atetezeke, muzimuchotsa n\u2019kukamupha.+\\n15 Womenya
  abambo ake ndi mayi ake aziphedwa ndithu.+\\n16 \u201cWakuba munthu+ ndi kum\u2019gulitsa+
  kapena munthu amene wapezeka ndi munthu wobedwayo, aziphedwa ndithu.+\\n17 \u201cWotemberera
  bambo ake ndi mayi ake aziphedwa ndithu.+\\n18 \u201cAnthu akayamba kukangana, wina
  n\u2019kutema mnzake ndi mwala kapena khasu, mnzakeyo osafa koma wadwala ndipo wagona,\\n19
  akadzuka n\u2019kuyamba kuyendayenda kunja pogwiritsa ntchito ndodo, pamenepo amene
  anam\u2019tema uja salandira chilango. Koma adzapereka malipiro a nthawi imene wotemedwayo
  wakhala wosagwira ntchito, mpaka mnzakeyo atachiriratu.\\n20 \u201cMunthu akamenya+
  kapolo wake wamwamuna kapena wamkazi ndi ndodo, kapoloyo n\u2019kumufera, munthuyo
  azilangidwa ndithu.+\\n21 Koma ngati kapoloyo wakhalabe ndi moyo tsiku limodzi kapena
  masiku awiri, mbuye wakeyo sayenera kulangidwa chifukwa kapoloyo ndi chuma chake.\\n22
  \u201cAmuna akamamenyana ndipo avulaza kwambiri mkazi wapakati moti mkaziyo n\u2019kubereka
  mwana+ koma palibe amene wamwalira, wovulaza mkaziyo azimulipiritsa ndithu malinga
  ndi zimene mwiniwake wa mkaziyo angagamule. Azikapereka malipirowo kudzera mwa oweruza.+\\n23
  Ngati wina wamwalira, pamenepo uzipereka moyo kulipira moyo.+\\n24 Koma wina akavulaza
  mnzake koopsa, pazikhala diso kulipira diso, dzino kulipira dzino, dzanja kulipira
  dzanja, phazi kulipira phazi,+\\n25 kutentha ndi moto kulipira kutentha ndi moto,
  chilonda kulipira chilonda, kumenya kulipira kumenya.+\\n26 \u201cMunthu akamenya
  kapolo wake wamwamuna kapena kapolo wake wamkazi padiso n\u2019kumuvulaza kwambiri,
  azimasula kapoloyo ndi kumulola kuchoka monga malipiro a diso lake.+\\n27 Ndipo
  akagulula dzino la kapolo wake wamwamuna kapena la kapolo wake wamkazi, azimasula
  kapoloyo ndi kumulola kuchoka monga malipiro a dzino lake.\\n28 \u201cNg\u2019ombe
  ikagunda mwamuna kapena mkazi, munthuyo n\u2019kumwalira, ng\u2019ombeyo iziponyedwa
  miyala ndi kuphedwa+ ndithu, ndipo nyama yake isadyedwe. Zikatero mwiniwake wa ng\u2019ombeyo
  sayenera kulangidwa.\\n29 Koma ngati ng\u2019ombe inali ndi chizolowezi chogunda
  anthu ndipo mwiniwake anachenjezedwapo koma sanali kuiyang\u2019anira, ndiyeno yapha
  mwamuna kapena mkazi, ng\u2019ombeyo iziponyedwa miyala ndipo mwiniwakeyo aziphedwanso.\\n30
  Ngati waweruzidwa kuti apereke dipo, ayenera kulipira mtengo wonse wowombolera moyo
  wake umene amugamula.+\\n31 Kaya ng\u2019ombeyo inagunda mwana wamwamuna kapena
  mwana wamkazi, mwiniwake aziweruzidwa malinga ndi chigamulo chimenechi.+\\n32 Ngati
  yagunda kapolo wamwamuna kapena wamkazi, mwiniwake azilipira ndalama zokwana masekeli
  30+ kwa mbuye wa kapoloyo, ndipo ng\u2019ombeyo iziponyedwa miyala.\\n33 \u201cMunthu
  akasiya dzenje losavindikira, kapena akakumba dzenje koma osatsekapo, ndipo ng\u2019ombe
