  sub\u0254viwo gbl\u0254 n\u025b be: \u201cNa woadi \u0256etugbui leafe a\u0256e
  na m\u00edafe afet\u0254 fia la, ne w\u00f2an\u0254 fia la gb\u0254 an\u0254 edzi
  kp\u0254m. Aml\u0254 w\u00f2 ak\u0254nu; ekema dzo a\u0256o l\u00e3me na m\u00edafe
  afet\u0254 fia.\u201d\\n3 Eya ta wodi \u0256etugbui dzetugbe a\u0256e le Israel-nyigba
  blibo la kat\u00e3 dzi; eye woke \u0256e Sunamt\u0254 Abisag \u014bu, eye wokpl\u0254e
  v\u025b na fia la.\\n4 \u00d0etugbuia dze tugbe etefe mek\u0254 o; eye w\u00f2va
  zu fia la dzi kp\u0254la si sub\u0254n\u025b, ke fia la med\u0254 kplii o.\\n5 Le
  \u0263eyi\u0263i siawo kat\u00e3 me la, Adoniya, Hagit vi le e\u0256okui dom \u0256e
  dzi le gb\u0254gbl\u0254m be: \u201cNyee le fia \u0256u ge!\u201d Edi tasia\u0256am
  kple s\u0254dolawo kpakple \u014butsu blaat\u0254\u0303, ame siwo an\u0254 du fum
  le e\u014bg\u0254 la na e\u0256okui.\\n6 Ke Fofoa mehe nya \u0256e e\u014bu kp\u0254
  be, \u201cNu ka tae n\u00e8w\u0254 nu alea?\u201d o. Edze \u0256eka h\u00e3 \u014but\u0254,
  eye eyae dadaa dzi \u0256e Absalom yome.\\n7 Adoniya l\u00e9 nyaa kp\u0254 kple
  Yoab, Zeruya vi kple nun\u0254la Abiatar, eye wode edzi hedze eyome.\\n8 Ke nun\u0254la
  Zadok, Benaya, Yehoyada vi, nyagbl\u0254\u0256ila Natan, Simei, Rei kple David fe
  kal\u1ebdt\u0254wo ya mew\u0254 \u0256eka kple Adoniya o.\\n9 Eye Adoniya ts\u0254
  al\u1ebdwo kple nyiwo kple l\u00e3 damiwo sa v\u0254e le Zohelet-kpe si le En-Rogel
  xa la gb\u0254, eye w\u00f2kpe n\u0254viawo kat\u00e3, fiavi\u014butsuwo kat\u00e3
  kple Yuda \u014butsu siwo nye fia\u014bumewo kat\u00e3.\\n10 Ke mekpe nyagbl\u0254\u0256ila
  Natan kple Benaya kple \u014butsu kal\u1ebdt\u0254awo alo n\u0254via Salomo ya o.\\n11
  Eye Natan gbl\u0254 na Salomo dada Bat-Seba be: \u201cM\u00e8se be Adoniya, Hagit
  vi zu fia, ev\u0254 m\u00edafe afet\u0254 David menya naneke le e\u014bu oa?\\n12
  Eya ta va ma\u0256o a\u0256a\u014bu na w\u00f2, ne n\u00e0\u0256e w\u00f2 \u014but\u0254
  w\u00f2 agbe kple viw\u00f2 Salomo fe agbe.\\n13 Yi Fia David gb\u0254 n\u00e0gbl\u0254
  n\u025b be: \u2018Nye afet\u0254 fia, menye w\u00f2e ka atam na w\u00f2 d\u0254lany\u0254nu
  la be, \u201cViw\u00f2 Salomo ye azu fia \u0256e yonyeme, eye eyae an\u0254 nye
  fiazikpui dzi\u201d oa? Aleke w\u0254 w\u00f2nye Adoniyae va zu fia?\u2019\\n14
  Ne \u00e8le nu fom kple fiaa la, ekema nye \u014but\u0254 h\u00e3 mava afi ma, eye
  ma\u0256o kpe w\u00f2 nyawo dzi.\u201d\\n15 Eya ta Bat-Seba yi fia la gb\u0254 le
  efe x\u0254g\u00e3 me. Fia la tsi \u014but\u0254; eye Sunamt\u0254 Abisag le esub\u0254m.\\n16
  Bat-Seba b\u0254b\u0254 tsy\u0254 mo anyi \u0256e fia la \u014bkume, eye fia la
  biae be: \u201cNu ka dim n\u00e8le?\u201d\\n17 E\u0256o e\u014bu be: \u201cNye afet\u0254,
  w\u00f2 \u014but\u0254e ka atam na w\u00f2 d\u0254lany\u0254nu la le Afet\u0254
  w\u00f2 Mawu \u014bkume be, \u2018Viw\u00f2 Salomo ye azu fia \u0256e yonyeme, eye
  eyae ab\u0254b\u0254 n\u0254 nye fiazikpui dzi.\u2019\\n18 Ke az\u0254 kp\u0254
  \u0256a, Adoniya zu fia, ke nye afet\u0254 fia menya naneke tso e\u014bu o.\\n19
  Eye w\u00f2ts\u0254 nyitsuwo, l\u00e3 damiwo, kple al\u1ebd gbogbo a\u0256ewo sa
  v\u0254e, eye w\u00f2kpe fiavi\u014butsuwo kat\u00e3 kple nun\u0254la Abiatar kpakple
  a\u028bafia Yoab; ke mekpe w\u00f2 d\u0254la Salomo ya o.\\n20 Az\u0254 nye afet\u0254
  fia, Israel blibo la kat\u00e3 le asiw\u00f2nu kp\u0254m be n\u00e0gbl\u0254 ame
  si ab\u0254b\u0254 n\u0254 nye afet\u0254 fia fe fiazikpui dzi \u0256e eyome la
  na wo.\\n21 Ne menye nenema o la, ekema ne wonya ts\u0254 nye afet\u0254 fia ml\u0254
  t\u0254gbuiawo gb\u0254 ko la, woabu nye kple vinye Salomo siaa nugbe\u0256olawoe.\u201d\\n22
  Esi w\u00f2gale nufofo dzi kple fiaa la, nyagbl\u0254\u0256ila Natan h\u00e3 va
  do.\\n23 Enumake wogbl\u0254 na fia la be: \u201cKp\u0254 \u0256a, nyagbl\u0254\u0256ila
  Natan ye nye esi!\u201d Eye w\u00f2ge \u0256e eme heva fia la gb\u0254 hetsy\u0254
  mo anyi \u0256e fia la \u014bkume.\\n24 Eye Natan gbl\u0254 be: \u201cNye afet\u0254
  fia, w\u00f2 \u014but\u0254e gbl\u0254 be, \u2018Adoniya ye azu fia \u0256e yonyeme,
  eye eyae an\u0254 nye fiazikpui dzia\u2019?\\n25 Elabena egbe la, eyi \u0256awu
  nyitsuwo kple l\u00e3 damiwo kpakple al\u1ebd gbogbo a\u0256ewo ts\u0254 sa v\u0254e,
  eye w\u00f2kpe fiavi\u014butsuwo kat\u00e3 kple a\u028bak\u0254 la fe tat\u0254wo
  kpakple nun\u0254la Abiatar. Wole afi ma \u0256aa le nu \u0256um le nu nom le e\u014bkume,
  eye wole gb\u0254gbl\u0254m be: \u2018Fia Adoniya nen\u0254 agbe tegbee!\u2019\\n26
  Ke mekpe nye, w\u00f2 d\u0254la kple nun\u0254la Zadok kple Benaya, Yehoyada vi
  kpakple w\u00f2 d\u0254la Salomo ya o.\\n27 \u00d0e nye afet\u0254 fia \u0256e m\u0254
  \u0256e esia \u014bu, ev\u0254 m\u00e8na w\u00f2 d\u0254la nya ame si ab\u0254b\u0254
  n\u0254 nye afet\u0254 fia fe fiazikpui dzi \u0256e eyome oa?\u201d\\n28 Fia David
  \u0256o e\u014bu be: \u201cMiy\u0254 Bat-Seba nam.\u201d Ale w\u00f2ge \u0256e eme
  heva t\u0254 \u0256e fia la \u014bkume.\\n29 Eye fia la ka atam be: \u201cZi ale
  si Afet\u0254, ame si \u0256em tso nye xaxawo kat\u00e3 me le agbe la,\\n30 ale
  si tututu meka atam na w\u00f2 le Afet\u0254, Israel fe Mawu la \u014bkume be, \u2018Viw\u00f2
  Salomo ye azu fia \u0256e yonyeme, eye eyae an\u0254 nye fiazikpui dzi \u0256e tenyefe!\u2019
  la, nenemae maw\u0254e egbea.\u201d\\n31 Ale Bat-Seba b\u0254b\u0254 tsy\u0254 mo
  anyi \u0256e fia la \u014bkume gbl\u0254 be: \u201cNye afet\u0254 Fia David nen\u0254
  agbe tegbee!\u201d\\n32 Enumake Fia David gbl\u0254 be: \u201cMiy\u0254 nun\u0254la
  Zadok kple nyagbl\u0254\u0256ila Natan kpakple Benaya, Yehoyada vi nam.\u201d Eye
  woge \u0256e eme hedo \u0256e fia la \u014bkume.\\n33 Fia la gbl\u0254 na wo be:
  \u201cMikpl\u0254 miafe afet\u0254 fe sub\u0254viwo, eye mina vinye Salomo nado
  nye tedzis\u0254 la, ne miakpl\u0254e ayi Gihon.\\n34 Eye nun\u0254la Zadok kple
  nyagbl\u0254\u0256ila Natan nasi ami n\u025b le afi ma w\u00f2azu fia \u0256e Israel
  nu; eye miaku kp\u1ebd agbl\u0254 be: \u2018Fia Salomo nen\u0254 agbe tegbee!\u2019\\n35
  Emegbe miadze eyome, ne w\u00f2ava b\u0254b\u0254 n\u0254 nye fiazikpui la dzi;
  eye w\u00f2azu fia \u0256e tenyefe, eye ma\u0256oe w\u00f2azu kpl\u0254la \u0256e
  Israel kple Yuda nu.\u201d\\n36 Enumake Benaya, Yehoyada vi \u0256o e\u014bu na
  fia la be: \u201cAmen! Afet\u0254, nye afet\u0254 fe Mawu nena w\u00f2ava eme alea.\\n37
  Ale si Afet\u0254 n\u0254 kple nye afet\u0254 fia la, nen\u0254 kple Salomo h\u00e3
  nenema, eye nena efe fiazikpui nafo nye afet\u0254 Fia David fe fiazikpui ta.\u201d\\n38
  Eye nun\u0254la Zadok kple nyagbl\u0254\u0256ila Natan kple Benaya, Yehoyada vi
  kple Keretit\u0254wo kpakple Peletit\u0254wo yi, eye wona Salomo do Fia David fe
  tedzis\u0254 la, eye wokpl\u0254e yi Gihon.\\n39 Az\u0254 nun\u0254la Zadok ts\u0254
  l\u00e3dzo si me ami le la le agbad\u0254 la me, eye w\u00f2si ami na Salomo; eye
  woku kp\u1ebd la, eye ameawo kat\u00e3 gli kple dzidz\u0254 gbl\u0254 be: \u201cFia
  Salomo nen\u0254 agbe tegbee!\u201d\\n40 Emegbe duk\u0254 blibo la dze eyome, eye
  duk\u0254 la le dze kum hele dzidz\u0254 kp\u0254m etefe mek\u0254 o, ale be wofe
  \u0263lidodo la na anyigba fe.\\n41 Eye Adoniya kple efe ame kpekpe siwo kat\u00e3
  le e\u014bu la see, esime wo\u0256u nua v\u0254. Ke esi Yoab se kp\u1ebda fe \u0256i\u0256i
  ko la, ebia be: \u201cNu ka fe hoow\u0254w\u0254 sem mele le dua me?\u201d\\n42
  Esi w\u00f2gale nufofo dzi la, kp\u0254 \u0256a, nun\u0254la Abiatar vi Yonatan
  va do. Eye Adoniya gbl\u0254 be: \u201cGe \u0256e eme, elabena ame nyui n\u00e8nye,
  eye nya nyui ye n\u00e8hena van\u025b.\u201d\\n43 Ke Yonatan \u0256o e\u014bu na
  Adoniya be: \u201cGbe\u0256e! Nye afet\u0254 Fia David ts\u0254 Salomo \u0256o fiae.\\n44
  Eye fia la d\u0254 nun\u0254la Zadok kple nyagbl\u0254\u0256ila Natan kple Benaya,
  Yehoyada vi kple Keretit\u0254wo kpakple Peletit\u0254wo kpe \u0256e e\u014bu, eye
  wona w\u00f2do fia fe tedzis\u0254 la.\\n45 Eye nun\u0254la Zadok kple nyagbl\u0254\u0256ila
  Natan si ami n\u025b he\u0256oe fia le Gihon. Emegbe wodzo le afi ma kple dzidz\u0254,
  eye hoow\u0254w\u0254 x\u0254 dua me. Esiae nye \u0263li si miese.\\n46 Gawu la,
  Salomo b\u0254b\u0254 n\u0254 fiazikpui la dzi.\\n47 Gakpe \u0256e e\u014bu la,
  fia la fe sub\u0254viwo va di nyui na m\u00edafe afet\u0254 Fia David gbl\u0254
  be: \u2018W\u00f2 Mawu nena Salomo fe \u014bk\u0254 nade du, eye nena efe fiazikpui
  nafo w\u00f2 fiazikpui ta!\u2019 Eye fia la b\u0254b\u0254 ta \u0256e aba la dzi.\\n48
  Az\u0254 h\u00e3, fia la gbl\u0254 be: \u2018Woakafu Afet\u0254, Israel fe Mawu,
  ame si na ame si ab\u0254b\u0254 n\u0254 nye fiazikpui dzi la egbea, eye w\u00f2na
  nye \u014but\u0254 nye \u014bkuwo kp\u0254e!\u2019\u201d\\n49 Ale \u014b\u0254dzi
  l\u00e9 ame siwo kat\u00e3 Adoniya kpe la, eye wotso, eye wo domet\u0254 \u0256e
  sia \u0256e l\u00e9 efe m\u0254.\\n50 Eye v\u0254v\u0254\u0303 \u0256o Adoniya h\u00e3
  le Salomo ta. Eya ta etso yi \u0256al\u00e9 v\u0254samlekpui la fe dzowo.\\n51 Eye
  wova gbl\u0254e na Salomo be: \u201cKp\u0254 \u0256a, Adoniya le Fia Salomo v\u0254\u0303m;
  eye w\u00f2yi \u0256al\u00e9 v\u0254samlekpui la fe dzowo le gb\u0254gbl\u0254m
  be, \u2018Fia Salomo neka atam nam gb\u00e3, be yemats\u0254 yi awu yefe d\u0254la
  la o.\u2019\u201d\\n52 Salomo \u0256o e\u014bu be: \u201cNe ew\u0254 nu si dze la,
  ekema efe ta\u0256a \u0256eka h\u00e3 mage \u0256e anyigba o, ke ne wokp\u0254 nu
  si nye v\u0254\u0303 le eme la, ekema aku.\u201d\\n53 Fia Salomo d\u0254 woyi \u0256akpl\u0254e
  tso v\u0254samlekpuia gb\u0254 v\u025b. Eye w\u00f2va b\u0254b\u0254 \u0256e Fia
  Salomo \u014bkume, emegbe Salomo gbl\u0254 n\u025b be: \u201cYi afew\u00f2 me.\u201d\\n1
  FIAWO 2\\n1 Esi David fe ku\u0263i n\u0254 afe tum la, ede se siawo na via Salomo
  be:\\n2 \u201cNye ku\u0263i gogo. Eya ta s\u1ebd \u014bu, eye n\u00e0w\u0254 \u014butsu.\\n3
  \u00d0o to Afet\u0254 w\u00f2 Mawu ne n\u00e0z\u0254 le efe m\u0254wo dzi, n\u00e0l\u00e9
  efe \u0256o\u0256owo, sededewo kple \u028b\u0254nud\u0254dr\u0254\u0303wo me \u0256e
  asi, eye n\u00e0w\u0254 efe \u014bku\u0256odzinyawo dzi, abe ale si wo\u014bl\u0254e
  \u0256e Mose fe Se la me ene; ekema nu sia nu si n\u00e0w\u0254 kple afi sia afi
  si n\u00e0tr\u0254 \u0256o la, adze edzi na w\u00f2.\\n4 Eye Afet\u0254 aw\u0254
  efe nya si w\u00f2gbl\u0254 le \u014bunye la dzi be: \u2018Ne viw\u00f2wo akp\u0254
  wofe z\u0254z\u0254me dzi, eye woaz\u0254 le nyatefe me tso wofe dzi blibo kple
  wofe lu\u028b\u0254 blibo me le \u014bkunye me la, ekema w\u00f2 fomea me t\u0254
  siwo ab\u0254b\u0254 n\u0254 Israel fe fiazikpui dzi la nu matso o.\u2019\\n5 \u201cAz\u0254
  h\u00e3 \u00e8nya nu si Yoab, Zeruya vi w\u0254m la nyuie, nu si w\u00f2w\u0254
  Israel fe a\u028bafia eve siwo nye Abner, Ner vi kple Amasa, Yeter vi; ewu wo hek\u0254
  \u028bu \u0256i le \u014butifafa\u0263i abe a\u028baw\u0254\u0263ie ene, eye w\u00f2na
  \u028bu fo efe alidziblanu si le ali n\u025b kple af\u0254kpa si le af\u0254 n\u025b
  abe le a\u028ba me ene.\\n6 W\u0254 nu le w\u00f2 nunya nu, eye m\u00e8gana efe
  ta fow\u0254 nayi Tsi\u1ebdfe le \u014butifafa me o.\\n7 \u201cKe nyo d\u0254me
  na Gileadt\u0254 Barzilai viwo, ne woan\u0254 ame siwo \u0256ua nu le w\u00f2 kpl\u0254\u0303
  \u014bu la dome, elabena aleae wokpe \u0256e \u014bunye esime mesi le n\u0254viw\u00f2
  Absalom nu.\\n8 \u201cKp\u0254 \u0256a! Simei, Gera vi, ame si nye Benyamint\u0254
  tso Bahurim la, le gb\u0254w\u00f2. Eyae do \u0256i\u014bu nam, eye w\u00f2fo fi
  dem vevie le gbe si gbe meyina Mahanayim; ke esi w\u00f2va do gom le Yordan nu la,
  met\u00e0 Afet\u0254 n\u025b gbl\u0254 be, \u2018Nyemawu w\u00f2 kple yi o.\u2019\\n9
  Az\u0254 m\u00e8gagbe tohehe n\u025b o, elabena ame nyanu n\u00e8nye, eye \u00e8nya
  nu si n\u00e0w\u0254e la nyuie; eye n\u00e0na w\u00f2ats\u0254 ta fow\u0254 ayi
  Tsi\u1ebdfe kple \u028bu.\u201d\\n10 Eye wots\u0254 David ml\u0254 t\u0254gbuiawo
  gb\u0254, wo\u0256ii \u0256e David \u0191e Du la me.\\n11 David \u0256u fia \u0256e
  Israel dzi fe blaene. E\u0256u fia fe adre le Hebron, eye w\u00f2\u0256u fia le
  Yerusalem fe blaet\u0254\u0303 v\u0254 et\u0254\u0303.\\n12 Eye Salomo b\u0254b\u0254
  n\u0254 fofoa David fe fiazikpui dzi; eye vivivi la, efe fia\u0256ufe la va li ke.\\n13
  Le \u0263eyi\u0263i a\u0256e megbe la, Adoniya, Hagit vi va Salomo dada Bat-Seba
  gb\u0254. Eye ny\u0254nu la biae be: \u201c\u014autifafa yea?\u201d E\u0256o e\u014bu
  be: \u014autifafae.\u201d\\n14 Eye Adoniya gbl\u0254 be: \u201cNya a\u0256e le asinye
  na w\u00f2.\u201d Eya ta egbl\u0254 be: \u201c\u0191o nu.\u201d\\n15 Eye w\u00f2yi
  edzi be: \u201c\u00c8nya nyuie be t\u0254nyee w\u00f2le be fia\u0256ufea nanye hafi,
  eye Israel blibo la kat\u00e3 n\u0254 m\u0254 kp\u0254m be mazu fia; ke fia\u0256u\u0256ua
  yi \u0256e n\u0254vinye si me, elabena Afet\u0254 gb\u0254e w\u00f2tso be w\u00f2zu
  et\u0254.\\n16 Az\u0254 nu \u0256eka ko biam mele tso asiw\u00f2. M\u00e8gagbe o.\u201d
  Eye w\u00f2\u0256o e\u014bu be: \u201c\u0191o nu.\u201d\\n17 Eye w\u00f2yi edzi
  gbl\u0254 be: \u201cMe\u0256e kuku, gbl\u0254 na fia Salomo be w\u00f2ats\u0254
  Sunamt\u0254 Abisag nam ma\u0256e. Elabena magbe w\u00f2 nya o.\u201d\\n18 Bat-Seba
  \u0256o e\u014bu be: \u201cEnyo! Mayi a\u0256afo nu kple fia la \u0256e nuw\u00f2.\u201d\\n19
  Eye Bat-Seba va Fia Salomo gb\u0254 be yeafo nu n\u025b \u0256e Adoniya nu. Enumake
  fia la tso yi \u0256akpee heb\u0254b\u0254 n\u025b. Emegbe eb\u0254b\u0254 n\u0254
  efe fiazikpui la dzi, eye w\u00f2na wona zi fia dadaa w\u00f2b\u0254b\u0254 n\u0254
  efe \u0256usime.\\n20 Eye w\u00f2gbl\u0254 be: \u201cMabia nu vi a\u0256e tso asiw\u00f2.
  M\u00e8gagbe o.\u201d Eye fia la gbl\u0254 n\u025b be: \u201cDanye, bia; elabena
  nyemagbe o.\u201d\\n21 Eye w\u00f2gbl\u0254 be: \u201cNa woats\u0254 Sunamt\u0254
  Abisag ana n\u0254viw\u00f2 Adoniya w\u00f2a\u0256e.\u201d\\n22 Eye Fia Salomo \u0256o
  e\u014bu na dadaa be: \u201cNu ka tae n\u00e8le Sunamt\u0254 Abisag biam na Adoniya?
  Bia fia\u0256u\u0256ua h\u00e3 n\u025b elabena fonye w\u00f2nye, eye Abiatar kpakple
  Yoab, Zeruya vi la le efe akpa dzi xoxo.\u201d\\n23 Eye Fia Salomo t\u00e0 Afet\u0254
  gbl\u0254 be: \u201cMawu nefiam ne w\u00f2agafiam \u0256e edzi, ne menye \u0256e
  Adoniya bia nu sia \u0256e eya \u014but\u0254 fe agbe tefe o f\u0129!\\n24 Eya ta
  zi ale si Afet\u0254, ame si li kem ses\u0129e, eye w\u00f2na meb\u0254b\u0254 n\u0254
  fofonye David fe fiazikpui dzi, eya ame si na afem abe ale si tututu w\u00f2gbl\u0254e
  ene la le agbe la, woawu Adoniya egbea.\u201d\\n25 Enumake Fia Salomo d\u0254 Benaya,
  Yehoyada vi w\u00f2yi \u0256ada nu Adoniya fu anyi w\u00f2ku.\\n26 Eye fia la gbl\u0254
  na nun\u0254la Abiatar be: \u201cYi Anatot le w\u00f2 agblewo dzi! \u00c8dze ku,
  ke nyemawu w\u00f2 egbe sia o, elabena \u00e8ts\u0254 Afet\u0254 Dzi\u0256ulag\u00e3
  Afet\u0254 fe A\u0256aka la le fofonye David \u014bkume, eye \u00e8to fukpekpe siwo
  kat\u00e3 me fofonye to la me kplii.\u201d\\n27 Ale Salomo nya Abiatar, be w\u00f2aganye
  Afet\u0254 fe nun\u0254la az\u0254 o, ne w\u00f2ana Afet\u0254 fe nya si w\u00f2gbl\u0254
  \u0256e Eli fe afe la \u014bu le Silo la nava eme.\\n28 Esi nya la va \u0256o Yoab
  gb\u0254 la, Yoab si yi Afet\u0254 fe agbad\u0254 la me \u0256al\u00e9 v\u0254samlekpui
  la fe dzowo, elabena ede Adoniya dzi, togb\u0254 be mede Absalom ya dzi o h\u00e3.\\n29
  Eye wova gbl\u0254 na Fia Salomo be: \u201cYoab si yi Afet\u0254 fe agbad\u0254
  me, eye ele afi ma, le v\u0254samlekpui la xa.\u201d Eya ta Salomo d\u0254 Benaya,
  Yehoyada vi \u0256a hegbl\u0254 be: \u201cYi \u0256ada nui fu anyi!\u201d\\n30 Eya
  ta Benaya yi Afet\u0254 fe agbad\u0254 la me, eye w\u00f2gbl\u0254 n\u025b be: \u201cAle
  fia la gbl\u0254e nye esi, \u2018Do go!\u2019\u201d Ke egbl\u0254 be: \u201cGbe\u0256e!
  Afi siae maku \u0256o.\u201d Ale Benaya he gbe la v\u025b na fia la gbl\u0254 be:
  \u201cAle Yoab gbl\u0254e nye esi, eye ale w\u00f2\u0256o nya \u014bu namee nye
  esi.\u201d\\n31 Eye fia la gbl\u0254 n\u025b be: \u201cW\u0254 abe ale si w\u00f2gbl\u0254
  ene, eye n\u00e0da nui fu anyi; eye n\u00e0\u0256ii aha\u0256e \u028bu si Yoab k\u0254
  \u0256i madzemadzee la \u0256a le nye kple fofonye fe afe la dzi.\\n32 Afet\u0254
  ahe efe \u028bu ava eya \u014but\u0254 fe ta dzi, elabena ets\u0254 yi wu \u014butsu
  eve, siwo nye ame dz\u0254dz\u0254ewo henyo wui, ame siwo nye Israel fe a\u028bafia
  Abner, Ner vi kple Yuda fe a\u028bafia Amasa, Yeter vi, ev\u0254 fofonye David menya
  naneke tso e\u014bu o.\\n33 Wofe \u028bu agbugb\u0254 ava Yoab fe ta dzi kple efe
  dzidzimeviwo fe ta dzi tegbee; ke \u014butifafa atso Afet\u0254 gb\u0254 ava David,
  efe dzidzimeviwo, efe afe kple efe fiazikpui ya dzi tegbee.\u201d\\n34 Eye Benaya,
  Yehoyada vi yi \u0256ada nu Yoab fu anyi w\u00f2ku, eye wo\u0256ii \u0256e eya \u014but\u0254
  fe me le gbea dzi.\\n35 Eye fia la ts\u0254 Benaya, Yehoyada vi \u0256o a\u028bak\u0254
  la nu \u0256e etefe, eye fia la ts\u0254 nun\u0254la Zadok \u0256o Abiatar tefe.\\n36
  Eye fia la d\u0254 wo\u0256ay\u0254 Simei v\u025b, eye w\u00f2gbl\u0254 n\u025b
  be: \u201cTu x\u0254 na \u0256okuiw\u00f2 \u0256e Yerusalem afi sia, eye n\u00e0n\u0254
  afi ma; m\u00e8gado tso afi ma ayi afi bubu a\u0256eke o.\\n37 Gbe si gbe n\u00e0do
  go ahatso Kidron-t\u0254\u028bua la, ekema nyae be \u00e0ku. W\u00f2 \u028bu an\u0254
  w\u00f2 \u014but\u0254 w\u00f2 ta dzi.\u201d\\n38 Eye Simei \u0256o e\u014bu na
  fia la be: \u201cW\u00f2 nya la nyo. Ale si tututu nye afet\u0254 gbl\u0254 la,
  nenemae w\u00f2 sub\u0254vi aw\u0254.\u201d Eye Simei n\u0254 Yerusalem \u014bkeke
  ge\u0256e.\\n39 Gake le fe et\u0254\u0303 megbe la, Simei fe kluvi eve si yi Akis,
  Maaka vi si nye Gat fia gb\u0254. Esi wova toe na Simei be: \u201cKp\u0254 \u0256a!
  W\u00f2 kluviwo le Gat\u201d la,\\n40 Simei tso enumake, bla akpa na efe tedzi,
  eye w\u00f2yi Akis gb\u0254 le Gat be yea\u0256adi yefe kluviawo. Esi Simei yi \u0256akpl\u0254
  efe kluviwo tso Gat gb\u0254e la,\\n41 wova gbl\u0254 na Salomo be: \u201cSimei
  dzo le Yerusalem yi Gat gatr\u0254 gb\u0254.\u201d\\n42 Eye fia la d\u0254 woyi
  \u0256ay\u0254 Simei v\u025b, eye w\u00f2biae be: \u201c\u00d0e nyemena n\u00e8t\u00e0
  Afet\u0254, eye mexl\u0254\u0303 nu w\u00f2 be: \u2018Gbe si gbe n\u00e0do go ayi
  tefe bubu a\u0256e la, ekema nyae be \u00e0ku,\u2019 eye n\u00e8gbl\u0254 nam be,
  \u2018W\u00f2 nya la nyo, maw\u0254 edzi\u2019 oa?\\n43 Ekema nu ka tae m\u00e8w\u0254
  \u0256e Afet\u0254 fe atam la kple se si mede na w\u00f2 la dzi o?\u201d\\n44 Eye
  fia la gbl\u0254 na Simei be: \u201cW\u00f2 \u014but\u0254 \u00e8nya v\u0254\u0303
  siwo kat\u00e3 n\u00e8w\u0254 fofonye David la nyuie le w\u00f2 dzi me, Afet\u0254
  atr\u0254 v\u0254\u0303 mawo siwo n\u00e8w\u0254 la ava w\u00f2 \u014but\u0254 w\u00f2
  ta dzi.\\n45 Ke woayra Fia Salomo ya, eye David fe fiazikpui la ali ke le Afet\u0254
  \u014bkume tegbee.\u201d\\n46 Eye fia la \u0256e gbe na Benaya, Yehoyada vi w\u00f2do
  yi \u0256ada nui fu anyi w\u00f2ku.\\nAle fia\u0256ufe la li ke \u0256e Salomo si
  me.\\n1 FIAWO 3\\n1 Eye Salomo na sr\u0254\u0303\u0256ekadodo n\u0254 eya kple Egipte-fia
  Farao dome. E\u0256e Farao viny\u0254nu hekpl\u0254e va David \u0191e Du la me,
  eye w\u00f2n\u0254 afi ma va se \u0256e esime w\u00f2wu eya \u014but\u0254 fe x\u0254
  kple Afet\u0254 fe gbedox\u0254 la tutu nu he\u0256o gli \u0256e Yerusalem \u014bu
  godoo.\\n2 Ke duk\u0254 la gasaa v\u0254 le togb\u025bwo dzi, elabena va se \u0256e
  \u0263ema\u0263i la, wometu x\u0254 na Afet\u0254 fe \u014bk\u0254 la ha\u0256e
  o.\\n3 Eye Salomo yi edzi l\u0254\u0303 Afet\u0254 hez\u0254 le fofoa David fe \u0256o\u0256owo
  nu, negbe v\u0254wo ko w\u00f2sana hedoa dzudz\u0254 le togb\u025bwo dzi.\\n4 Eye
  fia la yi Gibeon be yeasa v\u0254 le afi ma, elabena eyae nye togb\u025b si x\u0254
  \u014bk\u0254 wu. Salomo ts\u0254 l\u00e3 akpe \u0256eka sa numev\u0254 le v\u0254samlekpui
  ma dzi.\\n5 Eye Afet\u0254 \u0256e e\u0256okui fia Salomo le dr\u0254\u0303e me
  le z\u00e3 me le Gibeon, eye Mawu gbl\u0254 n\u025b be: \u201cBia nu si mana w\u00f2.\u201d\\n6
  Salomo \u0256o e\u014bu be: \u201c\u00c8ve w\u00f2 sub\u0254la fofonye David nu
  ge\u0256e \u014but\u0254, elabena ez\u0254 le nyatefe kple dz\u0254dz\u0254enyenye
  kpakple dzi dzadz\u025b me le \u014bkuw\u00f2me. Eye n\u00e8gakp\u0254t\u0254 le
  enu vem ge\u0256e \u014but\u0254 va se \u0256e egbe sia, ale be n\u00e8na vi\u014butsui,
  ne w\u00f2ab\u0254b\u0254 n\u0254 efe fiazikpui dzi.\\n7 Az\u0254 la, Afet\u0254
  nye Mawu, w\u00f2 \u014but\u0254 \u00e8\u0256o w\u00f2 sub\u0254la fiae \u0256e
  fofonye David tefe, ev\u0254 \u0256evi dzaa ko menye, eye nutefekp\u0254kp\u0254
  mesu asinye o.\\n8 Eye w\u00f2 sub\u0254la le duk\u0254 si n\u00e8tia, si me t\u0254wo
  s\u0254 gb\u0254 ale gbegbe be womate \u014bu axl\u1ebd wo o, la dome.\\n9 Eya ta
  na dzi senug\u0254me w\u00f2 sub\u0254la, ne w\u00f2adr\u0254\u0303 \u028b\u0254nu
  w\u00f2 duk\u0254 la, ne w\u00f2ade vovo nyui kple v\u0254\u0303 dome; elabena ame
  kae ate \u014bu adr\u0254\u0303 \u028b\u0254nu w\u00f2 duk\u0254 si me t\u0254wo
  s\u0254 gb\u0254 alea la?\u201d\\n10 Nya la dze Afet\u0254 \u014bu be Salomo bia
  nu sia.\\n11 Eye Mawu gbl\u0254 n\u025b be: \u201cEsi n\u00e8bia nu sia, eye m\u00e8bia
  agbe didi alo bia kesin\u0254nuwo alo bia w\u00f2 fut\u0254wo fe ku o, ke bo\u014b
  n\u00e8bia nug\u0254mesese, ne n\u00e0te \u014bu adr\u0254\u0303 \u028b\u0254nu
  ta la,\\n12 maw\u0254 nu si n\u00e8bia la dzi. Mana dzi nyanu si sea nu g\u0254me
  la w\u00f2, ale be ale si ko ame siwo n\u0254 anyi do \u014bg\u0254 na w\u00f2 la
  domet\u0254 a\u0256eke mede nuw\u00f2 o la, nenemae ame a\u0256eke mava si ade nuw\u00f2
  o.\\n13 Gawu la, mats\u0254 nu si m\u00e8bia o h\u00e3 ana w\u00f2, kesin\u0254nuwo
  kple bubu siaa, ale be fia a\u0256eke made nuw\u00f2 le w\u00f2 agben\u0254\u0263i
  kat\u00e3 o.\\n14 Eye ne \u00e8z\u0254 nye m\u0254wo dzi hel\u00e9 nye \u0256o\u0256owo
  kple sededewo me \u0256e asi abe ale si fofow\u00f2 David z\u0254 ene la, ekema
  mana agbe didi w\u00f2.\u201d\\n15 Esi Salomo ny\u0254 la, ekp\u0254 be dr\u0254\u0303e
  w\u00f2nye. Eye w\u00f2va Yerusalem va t\u0254 \u0256e Afet\u0254 fe nubabla\u0256aka
  la \u014bg\u0254, eye w\u00f2sa numev\u0254wo kple \u014butifafav\u0254wo, eye w\u00f2\u0256o
  kpl\u0254\u0303 na efe d\u0254lawo kat\u00e3.\\n16 \u0194ema\u0263i la, gbolo eve
  va fia la gb\u0254, eye wova t\u0254 \u0256e e\u014bkume.\\n17 Ny\u0254nu gb\u00e3t\u0254
  gbl\u0254 be: \u201cMe\u0256e kuku, nye afet\u0254, nye kple ny\u0254nu sia m\u00edele
  x\u0254 \u0256eka me, eye medzi vi le egb\u0254 le x\u0254a me.\\n18 Esi medzi vi
  \u014bkeke et\u0254\u0303 megbe la, ny\u0254nu sia h\u00e3 dzi vi. Eye m\u00edele
  tefe \u0256eka; ame bubu a\u0256eke mele x\u0254a me kpli m\u00ed o, negbe m\u00ed
  ame evea ko.\\n19 Ny\u0254nu sia fe vi ku le z\u00e3 me, elabena eml\u0254 edzi.\\n20
  Eye w\u00f2f\u0254 le z\u00e3 titina hek\u0254 vinye le axanye esime w\u00f2 d\u0254lany\u0254nu
  le al\u0254\u0303 d\u0254m, eye w\u00f2k\u0254e ml\u0254 efe ak\u0254nu, eye w\u00f2k\u0254
  via kuku la va ml\u0254 nye ak\u0254nu.\\n21 Esi mef\u0254 \u014bdi be mana no vinye
  la, mekp\u0254 be eku. Eya ta mel\u00e9 \u014bku \u0256e e\u014bu nyuie le \u014bdi
  ma, eye mekp\u0254 be menye vi, si medzi lae nye ema o.\u201d\\n22 Ke ny\u0254nu
  kem\u025ba gbl\u0254 be: \u201cKpao, vinyee nye agbagbea, eye viw\u00f2e nye kukua!\u201d
  Gake ny\u0254nu gb\u00e3t\u0254 le gb\u0254gbl\u0254m be: \u201cKpao, viw\u00f2e
  nye kukua, eye t\u0254nyee nye agbagbea.\u201d Nenemae wo\u028bli nyaa le fia la
  \u014bkume.\\n23 Ml\u0254eba fia la gbl\u0254 be: \u201cAme si be, \u2018Vinyee
  nye agbagbea, eye viw\u00f2e nye kukua!\u2019 eye ame si h\u00e3 be, \u2018Kpao,
  viw\u00f2e nye kukua, eye vinyee nye agbagbea!\u2019\u201d\\n24 Eye fia la gbl\u0254
  be: \u201cMits\u0254 yi v\u025b nam.\u201d Eye wots\u0254 yi v\u025b na fia la.\\n25
  Fia la gbl\u0254 be: \u201cMife \u0256evi gbagbe la me \u0256e eve, eye mits\u0254
  af\u00e3 na ny\u0254nu \u0256eka, eye mits\u0254 af\u00e3 na ny\u0254nu evelia.\u201d\\n26
  Enumake ny\u0254nu si fe vie nye agbagbea la \u0256e kuku na fia la, elabena efe
  d\u0254me tr\u0254 \u0256e via \u014bu. Egbl\u0254 be: \u201cMe\u0256e kuku, nye
  afet\u0254! Mits\u0254 \u0256evi gbagbe la n\u025b! Migawui o.\u201d Gake ny\u0254nu
  kem\u025ba n\u0254 gb\u0254gbl\u0254m be: \u201cManye t\u0254nye o, eye manye t\u0254w\u00f2
  h\u00e3 o! Mife eme!\u201d\\n27 Tete fia la gbl\u0254 be: \u201cMits\u0254 \u0256evi
  gbagbe la na ny\u0254nu gb\u00e3t\u0254! Migawui o, eyae nye dadaa.\u201d\\n28 Eye
  Israel blibo la kat\u00e3 se afia si fia la tso, ale v\u0254v\u0254\u0303 \u0256o
  wo le fia la \u014buti, elabena wokp\u0254e be, Mawu fe nunya le eya amea me be
  w\u00f2ats\u0254 adr\u0254\u0303 \u028b\u0254nu dz\u0254dz\u0254e.\\n1 FIAWO 4\\n1
  Fia Salomo \u0256u fia \u0256e Israel blibo la kat\u00e3 dzi.\\n2 Efe dumeg\u00e3woe
  nye esi: Azariya, Zadok vi ye nye nun\u0254la;\\n3 Elihoref kple Ahiya, ame siwo
  nye Sisa viwo, nye agbal\u1ebd\u014bl\u0254lawo; Yehosafat, Ahilud vi nye nu\u014bl\u0254la;\\n4
  Benaya, Yehoyada vi le a\u028bak\u0254 la nu; Zadok kple Abiatar nye nun\u0254lawo;\\n5
  Azariya, Natan vi le d\u0254dzikp\u0254lawo nu; Zabud, Natan vi nye nun\u0254la
  kple fia x\u0254l\u0254\u0303;\\n6 Ahisar ye nye afedzikp\u0254la; eye Adoniram,
  Abda vi le dzizizid\u0254w\u0254lawo nu.\\n7 Salomo \u0256o d\u0254dzikp\u0254la
  wuieve \u0256e Israel blibo la kat\u00e3 nu, eye woawoe ts\u0254a nu\u0256u\u0256u
  van\u025b na fia la kple efe afemet\u0254wo. Wo domet\u0254 \u0256e sia \u0256e
  ts\u0254a nu\u0256u\u0256u van\u025b \u0263leti \u0256eka le fe \u0256eka me.\\n8
  Wofe \u014bk\u0254woe nye esi: Hur vi ye le Efrayim tonuto la nu;\\n9 Deker vi ye
  le Makaz, Saalbim, Bet-Semes kple Elon-Bet-Hanan nu;\\n10 Hesed vi ye le Arubot
  nu (et\u0254e nye Soko kple Hefer-nyigba blibo la kat\u00e3);\\n11 Abinadab vi ye
  le Dor togb\u025bwo kat\u00e3 nu (Eyae \u0256e Salomo viny\u0254nu Tafat);\\n12
  Baana, Ahilud vi ye le Taanak, Megido kple Bet-Sean blibo la kat\u00e3, si le Zaretan
  xa le Yezreel fe anyigbe, tso Bet-Sean va \u0256o Abel-Mehola yi Yokmeam nuto me
  la nu;\\n13 Geber vi ye le Ramot-Gilead nu (et\u0254e nye Manase vi Yair fe agbad\u0254k\u0254fe
  siwo le Gilead; eya kee le Argob nuto si le Basan nu, wonye du g\u00e3 blaade siwo
  \u014bu gli kple ak\u0254bligametiwo le);\\n14 Ahinadab, Ido vi ye le Mahanayim
  nu;\\n15 Ahimaaz ye le Naftali nu (eyae \u0256e Salomo viny\u0254nu bubu si nye
  Basemat);\\n16 Baana, Husai vi ye le Aser kple Bealot nu;\\n17 Yehosafat, Parua
  vi ye le Isakar nu; 18 Simei, Ela vi ye le Benyamin nu;\\n19 Geber, Uri vi ye le
  Gilead-nyigba, si nye Amori-fia Sihon kple Basan-fia Og fe anyigba la nu. D\u0254dzikp\u0254la
  \u0256eka le d\u0254dzikp\u0254la bubu siwo kat\u00e3 le anyigbaa dzi la nu.\\n20
  Yuda kple Israel s\u0254 gb\u0254 kpa\u014bkpa\u014b abe futake ene; eye wo\u0256ua
  nu noa nu hekp\u0254a dzidz\u0254.\\n21 Salomo \u0256u fia \u0256e fia\u0256ufewo
  kat\u00e3 dzi tso T\u0254sisi la nu va \u0256o Filistit\u0254wo fe anyigba kple
  Egipte fe lifo dzi. Wodz\u0254a nu n\u025b, eye wosub\u0254 Salomo le efe agbeme\u014bkekewo
  kat\u00e3 me.\\n22 Nu\u0256u\u0256u si Salomo hi\u00e3 le fias\u00e3 la me gbe sia
  gbee nye w\u0254 memee k\u0254r blaet\u0254\u0303 kple w\u0254 k\u0254r blaade,\\n23
  nyi dami ewo, nyi blaeve siwo wokpl\u0254 tso gbe\u0256ufe kple al\u1ebd alafa \u0256eka
  hekpe \u0256e zi, s\u00e3de, s\u1ebd kple xe damiwo \u014bu.\\n24 Elabena ekp\u0254
  \u014bus\u1ebd \u0256e nu sia nu si le T\u0254sisi la fe go si me la dzi, tso Tifsa
  va se \u0256e Gaza, ts\u0254 kpe \u0256e fia siwo kat\u00e3 le T\u0254sisi la fe
  go kem\u025b dzi, eye w\u00f2kp\u0254 tomefafa le efe nutoawo kat\u00e3 me godoo
  va kpe.\\n25 Yuda kple Israel n\u0254 \u014butifafa me, eye le Salomo fe \u014bkekewo
  kat\u00e3 me la, ame sia ame n\u0254 efe wainka kple efe gboti te b\u0254k\u0254\u0254,
  tso Dan va se \u0256e Beer-Seba.\\n26 Salomo w\u0254 s\u0254kpo akpe ene na efe
  tasia\u0256amwo, eye s\u0254 akpe wuieve n\u0254 esi.\\n27 D\u0254dzikp\u0254la
  siawo ts\u0254a nu\u0256u\u0256u van\u025b na Fia Salomo kple ame siwo kat\u00e3
  \u0256ua nu le Fia Salomo fe kpl\u0254\u0303 \u014bu. Wo domet\u0254 \u0256e sia
  \u0256e kple efe \u0263leti, eye wokp\u0254a egb\u0254 be naneke mehi\u00e3na o.\\n28
  Wots\u0254a fo kple gbe yia afi si wohi\u00e3 wo le na s\u0254wo kple s\u0254wo
  fe hawo, wo domet\u0254 \u0256e sia \u0256e w\u0254n\u025b abe ale si wo\u0256o
  n\u025b ene.\\n29 Eye Mawu na nunya kple nug\u0254mesese deto Salomo w\u00f2wu gb\u0254gbl\u0254,
  hekpe \u0256e dzi si sea nu g\u0254me ale gbegbe la \u014bu.\\n30 Salomo fe nunya
  fo \u0194edzefet\u0254wo kat\u00e3 fe nunya kple Egipte fe nunya blibo la kat\u00e3
  ta.\\n31 Enya nu wu ame bubu \u0256e sia \u0256e, enya nu wu Ezrahit\u0254 Etan
  kpakple Heman, Kalkol kple Darda, siwo nye Mahol viwo; efe \u014bk\u0254 ny\u0254
  le duk\u0254 siwo kat\u00e3 fo xl\u00e3 wo la dome.\\n32 Edo lo akpe et\u0254\u0303,
  eye efe hawo le akpe \u0256eka kple at\u0254\u0303.\\n33 Efoa nu tso atiwo \u014bu,
  tso seder si le Lebanon dzi va \u0256o isop gbe si miena \u0256e gli \u014bu la
  dzi; eye w\u00f2foa nu tso l\u00e3wo, xe dzodzoewo, nu siwo tana kple t\u0254mel\u00e3wo
  \u014bu.\\n34 Amewo tso duk\u0254wo kat\u00e3 me va se Salomo fe nunya, eye anyigbadzifia
  siwo kat\u00e3 se e\u014bk\u0254 h\u00e3 va se efe nunya.\\n1 FIAWO 5\\n1 Esi Tiro-fia
  Hiram se be wosi ami na Salomo w\u00f2zu fia \u0256e fofoa tefe la, ed\u0254 efe
  d\u0254lawo \u0256e Salomo gb\u0254, elabena Hiram nye David x\u0254l\u0254\u0303
  le efe agben\u0254\u0263i kat\u00e3.\\n2 Eya ta Salomo h\u00e3 d\u0254 ame \u0256o
  \u0256e Hiram be:\\n3 \u201c\u00c8nyae nyuie be fofonye David mete \u014bu tu x\u0254
  na Afet\u0254 efe Mawu la fe \u014bk\u0254 o, le esi woho a\u028ba ge\u0256e \u0256e
  e\u014bu le goawo kat\u00e3 me ta, va se \u0256e esime Afet\u0254 ts\u0254 efe fut\u0254wo
  de efe af\u0254 te.\\n4 Ke az\u0254 la, Afet\u0254 nye Mawu na gb\u0254\u0256emem
  godoo va kpe. Tsitretsi\u0256e\u014bula a\u0256eke meli o, eye v\u0254\u0303 a\u0256eke
  h\u00e3 meli o.\\n5 Eya ta me\u0256oe be matu x\u0254 na Afet\u0254 nye Mawu fe
  \u014bk\u0254, abe ale si Afet\u0254 do \u014bugbe na fofonye David ene be, \u2018Viw\u00f2
  si mats\u0254 a\u0256o w\u00f2 fiazikpui dzi \u0256e tew\u00f2fe lae atu x\u0254
  na nye \u014bk\u0254.\u2019\\n6 Eya ta de se na w\u00f2 amewo ne woatso sedertiwo
  nam le Lebanon. Nye sub\u0254viwo aw\u0254 d\u0254 kple w\u00f2 sub\u0254viwo, eye
  maxe home si n\u00e0di be woaxe na w\u00f2 sub\u0254viwo la na w\u00f2, elabena
  w\u00f2 \u014but\u0254 \u00e8nyae nyuie be m\u00eda domet\u0254 a\u0256eke menya
  atitsotso abe Sidont\u0254wo ene o.\u201d\\n7 Esi Hiram se Salomo fe nyawo la, dzi
  dz\u0254e \u014but\u0254, eye w\u00f2gbl\u0254 be: \u201cWoakafu Afet\u0254 egbea,
  elabena ena vi nyanu David \u0256e efe duk\u0254 g\u00e3 sia nu!\u201d\\n8 Eya ta
  Hiram d\u0254 ame \u0256o \u0256e Salomo, gbl\u0254 be: \u201cMese gbe si n\u00e8\u0256o
  \u0256em la. Mana woatso sedertiwo kple sesewutiwo abe ale si n\u00e8di ene.\\n9
  Nye sub\u0254viwo ats\u0254 wo tso Lebanon ava fu la nu, eye mabla wo tatata ato
  fu dzi ayi tefe si n\u00e0\u0256o nam. Eye mana woatu ka wo le afi ma, ne n\u00e0va
  f\u0254 wo adzoe. Eye w\u00f2 la, nu si medi be n\u00e0w\u0254 nam koe nye be, n\u00e0na
  nu\u0256u\u0256u nye afemet\u0254wo.\u201d\\n10 Ale Hiram na sedertiwo kple sesewutiwo
  ale si nu Salomo di lae.\\n11 Salomo h\u00e3 ts\u0254 lu k\u0254r akpe blaeve na
  Hiram be w\u00f2anye nu\u0256u\u0256u na efe afemet\u0254wo hekpe \u0256e amititsetse
  fe ami nyuit\u0254 k\u0254r blaeve \u014bu. Esiae Salomo naa Hiram fe sia fe.\\n12
  Afet\u0254 na nunya Salomo abe ale si w\u00f2do \u014bugbe n\u025b ene. Eye \u014butifafa
  n\u0254 Hiram kple Salomo dome, eye wobla nu kple wo n\u0254ewo.\\n13 Fia Salomo
  \u0256o amewo d\u0254 ses\u1ebd w\u0254lawoe le Israel kat\u00e3; ame akpe blaet\u0254\u0303
  ye wo\u0256o d\u0254 ses\u1ebd w\u0254lawoe.\\n14 E\u0256oa wo akpe ewoewo \u0256e
  Lebanon \u0263leti sia \u0263leti. Won\u0254a Lebanon \u0263leti \u0256eka, eye
  won\u0254a afe \u0263leti eve; eye Adoniram le d\u0254 ses\u1ebd w\u0254lawo nu.\\n15
  Agbated\u0254w\u0254la akpe blaadre kple kpekpala akpe blaenyi le Salomo si le towo
  dzi,\\n16 hekpe \u0256e Salomo fe ameg\u00e3 d\u0254dzikp\u0254la akpe et\u0254\u0303
  alafa et\u0254\u0303 siwo n\u0254 d\u0254a nu la \u014bu.\\n17 Eye fia la de se
  be woa\u0256e kpe g\u00e3 siwo nye kpe x\u0254asiwo, ne woats\u0254 kpe fufuwo a\u0256o
  x\u0254 la g\u0254me anyi.\\n18 Ale Salomo fe x\u0254tulawo kple Hiram fe x\u0254tulawo
  kpakple Gebalt\u0254wo tr\u0254 asi le kpewo kple atiwo \u014bu hena x\u0254 la
  tutu.\\n1 FIAWO 6\\n1 Le Israel-viwo fe \u028bu\u028bu tso Egipte-nyigba dzi fe
  fe alafa ene blaenyilia me, le Salomo fe fia\u0256u\u0256u \u0256e Israel dzi fe
  fe enelia me, le \u0263leti Ziv (si nye \u0263leti evelia) me la, ede asi x\u0254
  la tutu me na Afet\u0254.\\n2 X\u0254 si Fia Salomo tu na Afet\u0254 la didi ab\u0254klugui
  blaade, ekeke ab\u0254klugui blaeve, eye w\u00f2k\u0254 ab\u0254klugui blaet\u0254\u0303.\\n3
  Eye akpata si le gbedox\u0254 la \u014bg\u0254 didi ab\u0254klugui blaeve, eye w\u00f2s\u0254
  \u0256e x\u0254 la fe kekeme nu. Ek\u0254 ab\u0254klugui ewo, le x\u0254 la \u014bg\u0254dze.\\n4
  E\u0256e fesre siwo fe nu keke le gota hemia \u0256o \u0256e eme la \u0256e x\u0254
  la \u014bu.\\n5 Az\u0254 h\u00e3, e\u0256o gli fo xl\u00e3 x\u0254 la fe gliwo;
  ele gbedox\u0254 la fe gliwo kple x\u0254 ememet\u0254 la \u014bu godoo, ew\u0254
  x\u0254\u014bux\u0254ewo fo xl\u00e3 x\u0254 la fe gliwo godoo va kpe.\\n6 X\u0254\u014bux\u0254e
  g\u0254met\u0254 fe kekeme le ab\u0254klugui at\u0254\u0303, domet\u0254 fe kekeme
  le ab\u0254klugui ade, eye et\u0254\u0303lia fe kekeme le ab\u0254klugui adre, elabena
  e\u0256e kpuiwo \u0256e glia \u014bu fo xl\u00e3 x\u0254 la le gota, ale be woma\u014b\u0254
  x\u0254 la fe gliawo ats\u0254 naneke ade eme o.\\n7 Wots\u0254 kpe fufu siwo \u014bu
  wotr\u0254 asi le xoxo la tu x\u0254 lae, ale be womese zu alo f\u00eda alo gakpod\u0254w\u0254nu
  a\u0256eke \u014bk\u0254 le x\u0254 la tu\u0263i o.\\n8 X\u0254\u014bux\u0254e g\u0254met\u0254
  la fe m\u0254nu le x\u0254 la fe anyigbe gome, eye atrakpui g\u0254d\u0254\u0303g\u0254d\u0254\u0303
  a\u0256e yi domet\u0254 la me, eye tso domet\u0254 me w\u00f2yi et\u0254\u0303lia
  me.\\n9 Egayi x\u0254 la tutu dzi hewu enu, eye w\u00f2ts\u0254 sedertiwo kple seder\u028bufowo
  gb\u00e3 x\u0254 la.\\n10 Etu x\u0254\u014bux\u0254e siwo fe k\u0254k\u0254me le
  ab\u0254klugui at\u0254\u0303 la \u0256e x\u0254 blibo la kat\u00e3 \u014bu, eye
  wots\u0254 sedertiwo l\u00e9 x\u0254\u014bux\u0254eawo \u0256e gbedox\u0254 la \u014bu.\\n11
  Eye Afet\u0254 fe gbe va na Salomo be:\\n12 \u201cNe \u00e8z\u0254 le nye sewo nu,
  eye n\u00e8w\u0254 nye \u028b\u0254nud\u0254dr\u0254\u0303wo dzi hel\u00e9 nye m\u0254fiamewo
  kat\u00e3 me \u0256e asi hez\u0254 \u0256e wo nu la, ekema nye h\u00e3 maw\u0254
  \u014bugbe si medo na fofow\u00f2 David tso \u014buw\u00f2 le x\u0254 sia si tum
  n\u00e8le \u014bu la dzi,\\n13 man\u0254 Israel-viwo dome, eye nyemagbl\u1ebd nye
  duk\u0254 Israel \u0256i o.\u201d\\n14 Eye Salomo yi x\u0254 la tutu dzi, ne w\u00f2awu
  enu.\\n15 E\u0256o seder\u028bufowo \u0256e x\u0254 la fe gliwo \u014bu le eme.
  Ekl\u00e3 \u028bufo \u0256e x\u0254 la me tso anyigba yi \u0256at\u0254 dzisasr\u00e3tiawo,
  eye w\u00f2kl\u00e3 sesewu\u028bufo \u0256e x\u0254 la fe anyigba.\\n16 Ets\u0254
  seder\u028bufowo ts\u00f2 x\u0254a me le megbe l\u0254fo si keke ab\u0254klugui
  blaeve, tso anyigba yi \u0256at\u0254 dzisasr\u00e3tiawo, be w\u00f2anye x\u0254
  ememet\u0254, si nye K\u0254k\u0254efewo \u0191e K\u0254k\u0254efe la.\\n17 Gbedox\u0254
  la\u2014si nye x\u0254a fe akpa si le \u014bg\u0254\u2014le ab\u0254klugui blaene.\\n18
  Eye wo\u0256e n\u0254n\u0254metata siwo le abe gotsetsewo ene kple sefofo siwo ke
  la \u0256e sederti siwo wokl\u00e3 \u0256e x\u0254a me la \u014bu. Wo kat\u00e3
  nye sederti; eye kpe a\u0256eke men\u0254 dzedzem o.\\n19 Edzra x\u0254 ememet\u0254
  si le x\u0254a me la me \u0256o, ne woats\u0254 Afet\u0254 fe nubabla\u0256aka la
  ada \u0256e afi ma.\\n20 X\u0254 ememet\u0254 la didi ab\u0254klugui blaeve, ekeke
  ab\u0254klugui blaeve, eye w\u00f2k\u0254 ab\u0254klugui blaeve; efa sika nyuit\u0254
  \u0256e e\u014bu, eye w\u00f2kl\u00e3 seder\u028bufo \u0256e v\u0254samlekpui la
  \u014bu ke\u014b.\\n21 Salomo fa sika nyuit\u0254 \u0256e x\u0254 la me, eye w\u00f2tsi
  sikak\u0254s\u0254k\u0254s\u0254 \u0256e x\u0254 ememet\u0254 si me wofa sika \u0256o
  la \u014bg\u0254.\\n22 Efa sika \u0256e x\u0254 blibo la kat\u00e3 \u014bu kpe \u0256o;
  efa sika \u0256e v\u0254samlekpui si le x\u0254 ememet\u0254 gb\u0254 l\u0254fo
  la kat\u00e3 \u014bu.\\n23 Ets\u0254 amiti w\u0254 kerubi eve \u0256e x\u0254 ememet\u0254
  la me, wo domet\u0254 \u0256e sia \u0256e k\u0254 ab\u0254klugui ewo.\\n24 Kerubi
  la fe a\u028bala \u0256eka didi ab\u0254klugui at\u0254\u0303, eye efe a\u028bala
  evelia h\u00e3 didi ab\u0254klugui at\u0254\u0303. Tso efe a\u028bala \u0256eka
  nu va se \u0256e efe a\u028bala evelia nu le ab\u0254klugui ewo.\\n25 Kerubi evelia
  t\u0254 h\u00e3 le ab\u0254klugui ewo. Kerubi eveawo fe lolome kple n\u0254n\u0254me
  s\u0254.\\n26 Kerubi \u0256eka fe k\u0254k\u0254me le ab\u0254klugui ewo, eye kerubi
  evelia h\u00e3 t\u0254 le nenema.\\n27 Eye w\u00f2ts\u0254 kerubiawo \u0256o x\u0254
  ememet\u0254 la me; kerubiawo ke a\u028balawo me, ale be kerubi \u0256eka fe a\u028bala
  nu \u0256at\u0254 gli la le akpa \u0256eka, eye evelia h\u00e3 fe a\u028bala \u0256eka
  nu \u0256at\u0254 gli le akpa kem\u025ba, eye wofe a\u028bala emet\u0254wo va kpe
  wo n\u0254ewo le x\u0254 la titina.\\n28 Eye w\u00f2fa sika \u0256e kerubiawo \u014bu.\\n29
  Eye w\u00f2\u0256e kerubiwo kple detiwo kpakple sefofo siwo ke \u0256e x\u0254 ememet\u0254
  kple dodonux\u0254 la siaa fe gliwo \u014bu le wo me.\\n30 Eye w\u00f2fa sika \u0256e
  x\u0254 ememet\u0254 kple dodonux\u0254 la siaa fe anyigba.\\n31 Ets\u0254 amiti
  kpa \u028b\u0254truwo de x\u0254 ememet\u0254 la fe m\u0254nu, ede axadzis\u0254tiwo
  kple \u028b\u0254truti siwo x\u0254 glia fe titrime fe akpa at\u0254\u0303lia.\\n32
  Amitie w\u00f2ts\u0254 kpa \u028b\u0254tru agave la, eye w\u00f2\u0256e kerubiwo
  kple detiwo kpakple sefofo siwo ke la \u0256e wo dzi, efa sika \u0256e wo \u014bu;
  eye w\u00f2fo sika la te \u0256e kerubiawo kple detiawo \u014bu.\\n33 Le gbedox\u0254a
  fe m\u0254nu gome la, aleae w\u00f2ts\u0254 amiti kpa \u028b\u0254trutiawo wox\u0254
  akpa enelia.\\n34 Sesewuti wots\u0254 kpa \u028b\u0254tru eveawo. \u01b2\u0254tru
  \u0256eka fe aga eveawo trona le anyin\u0254wo dzi, eye \u028b\u0254tru evelia h\u00e3
  fe aga eveawo trona le anyin\u0254wo dzi.\\n35 Eye w\u00f2\u0256e kerubiwo kple
  detiwo kpakple sefofo siwo ke \u0256e wo \u014bu hefa sika \u0256e wo \u014bu.\\n36
  E\u0256o gli \u0256e x\u0254x\u0254nu emet\u0254 la; ets\u0254 kpe fufu \u0256o
  amli et\u0254\u0303, eye w\u00f2\u0256o sederti \u0256o\u0256o \u0256eka \u0256e
  edzi.\\n37 Wo\u0256o Afet\u0254 fe x\u0254 la g\u0254me anyi le fe enelia me, le
  dzinu Ziv me;\\n38 eye wowu x\u0254 bliboa kple efe akpa vovovoawo nu w\u00f2s\u0254
  \u0256e x\u0254a fe n\u0254n\u0254metataa nu, le fe wui\u0256ek\u025blia me, le
  dzinu Bul (si nye \u0263leti enyilia) me; fe adre s\u0254\u014b wots\u0254 tui.\\n1
  FIAWO 7\\n1 Salomo ts\u0254 fe wuiet\u0254\u0303 tu eya \u014but\u0254 fe x\u0254
  hafi wu enu ke\u014bke\u014b.\\n2 Eye w\u00f2tu Lebanon \u0191e Avex\u0254 la \u0256e
  sedertis\u0254ti siwo le agbaka ene me la dzi, eye woda sedertiwo \u0256e s\u0254tiawo
  dzi; x\u0254a didi ab\u0254klugui alafa \u0256eka, ekeke ab\u0254klugui blaat\u0254\u0303,
  eye w\u00f2k\u0254 ab\u0254klugui blaet\u0254\u0303.\\n3 Wokl\u00e3 sedertiwo \u0256e
  x\u0254 la fe da\u0256edzi siwo le s\u0254tiawo dzi la dzi; wofe xexl\u1ebdme le
  blaene v\u0254 at\u0254\u0303, wuiat\u0254\u0303 le agbaka \u0256eka me.\\n4 Fesre
  siwo le fesretiwo me hele agbaka et\u0254\u0303 me ke\u014b la le e\u014bu, eye
  fesreawo dze \u014bg\u0254 wo n\u0254ewo et\u0254\u0303et\u0254\u0303.\\n5 X\u0254m\u0254nuawo
  kple wofe \u028b\u0254trutiawo kat\u00e3 le dzogoe ene me, eye fesre siwo dze \u014bg\u0254
  wo n\u0254ewo et\u0254\u0303et\u0254\u0303 h\u00e3 le dzogoe ene me.\\n6 Etu S\u0254tiwo
  \u0191e Akpata la w\u00f2didi ab\u0254klugui blaat\u0254\u0303, eye w\u00f2keke
  ab\u0254klugui blaet\u0254\u0303, eye wogats\u0254 s\u0254tiwo tu akpata bubu si
  wogba la \u0256e S\u0254tiwo \u0191e Akpata la nu.\\n7 Az\u0254 h\u00e3 etu Fiazikpui
  \u0191e Akpata la, afi si w\u00f2adr\u0254\u0303 \u028b\u0254nu le\u2014eyae nye
  \u01b2\u0254nudr\u0254\u0303kpata la, eye wokl\u00e3 seder\u028bufo \u0256e eme
  tso anyigba yi \u0256at\u0254 dzisasr\u00e3tiawo.\\n8 Efe x\u0254 si me w\u00f2an\u0254
  le x\u0254x\u0254nu kem\u025ba la le adz\u0254ge tso Akpata la gb\u0254, eye w\u00f2tui
  abe Akpata la ke ene. Salomo tu x\u0254 si le abe Akpata sia ene na Farao viny\u0254nu
  si w\u00f2\u0256e la h\u00e3.\\n9 Kpe x\u0254asi siwo wofu \u0256e dzidze nu, eye
  wots\u0254 laxalaxa s\u1ebd wo \u014bkume kple wo k\u0254go w\u00f2zr\u0254\u0303
  lae wots\u0254 tu wo kat\u00e3, tso g\u0254me\u0256oanyi la dzi va \u0256o etamekpeawo
  dzi, tso gota va se \u0256e x\u0254x\u0254nu g\u00e3 la gb\u0254.\\n10 Wots\u0254
  kpe g\u00e3g\u00e3 x\u0254asiwo \u0256o x\u0254 la fe g\u0254me\u0256oanyiawo; \u0256ewo
  fe didime le ab\u0254klugui ewo, eye bubuwo le ab\u0254klugui enyi.\\n11 Kpe x\u0254asi
  siwo wofu le dzidze nu kpakple sedertiwo le dzi gome.\\n12 E\u0256o kpe fufu amli
  et\u0254\u0303 kple sederti \u0256o\u0256o \u0256eka fo xl\u00e3 x\u0254x\u0254nu
  g\u00e3 la godoo va kpe, abe ale si w\u00f2w\u0254 Afet\u0254 fe x\u0254 la fe x\u0254x\u0254nu
  emet\u0254 kple x\u0254 la fe akpata la ene.\\n13 Fia Salomo d\u0254 woyi \u0256akpl\u0254
  Hiram tso Tiro v\u025b.\\n14 Enye ahosi a\u0256e si tso Naftali-toa me la fe vi,
  eye fofoa nye Tirot\u0254 ak\u0254blinutula; eye w\u00f2y\u0254 f\u0169u kple nunya
  kple nug\u0254mesese kpakple sidzedze hena ak\u0254blinu \u0256e sia \u0256e w\u0254w\u0254.
  Ale w\u00f2va Fia Salomo gb\u0254, eye w\u00f2w\u0254 efe d\u0254wo kat\u00e3 n\u025b.\\n15
  El\u00f3lo ak\u0254bli ts\u0254 w\u0254 s\u0254ti eveawo; \u0256e sia \u0256e k\u0254
  ab\u0254klugui wuienyi, eye ka didime ab\u0254klugui wuieve ye akpe s\u0254tiawo
  domet\u0254 \u0256e sia \u0256e \u0256o.\\n16 Eye w\u00f2l\u00f3lo ak\u0254bli ts\u0254
  w\u0254 ta eve be woats\u0254 a\u0256o s\u0254tiawo tame. Ta \u0256eka k\u0254 ab\u0254klugui
  at\u0254\u0303, eye evelia h\u00e3 k\u0254 ab\u0254klugui at\u0254\u0303.\\n17 Wol\u0254\u0303
  ga\u0256\u0254wo, eye wogbi atsy\u0254\u0303\u0256onu siwo le abe k\u0254s\u0254k\u0254s\u0254wo
  ene \u0256e ta \u0256e sia \u0256e si le s\u0254tiawo dzi la \u014bu; adre le ta
  \u0256eka \u014bu, eye adre le ta evelia h\u00e3 \u014bu.\\n18 Eye w\u00f2w\u0254
  yevubo\u0256awo \u0256e agbaka eve me \u0256e ga\u0256\u0254awo domet\u0254 \u0256eka
  \u014bu, ne woaxe s\u0254tiawo fe tawo \u014bu; aleae w\u00f2w\u0254e \u0256e ta
  evelia h\u00e3 \u014bui.\\n19 Wow\u0254 dzogbenya fe n\u0254n\u0254me \u0256e ta
  siwo le s\u0254ti siwo le akpataa nu dzi la \u014bu, eye wok\u0254 ab\u0254klugui
  ene.\\n20 Taawo le s\u0254ti eveawo dzi, ga\u0256\u0254 le ta \u0256e sia \u0256e
  fe afi si le nogoo la \u014bu; eye yevubo\u0256a alafa eve le agbakawo me godoo
  le ta \u0256e sia \u0256e \u014bu.\\n21 Etu gbedox\u0254 la fe akpata la fe s\u0254tiawo.
  Etu \u0256usimes\u0254ti la hena \u014bk\u0254e be Yakin, eye w\u00f2tu miames\u0254ti
  la hena \u014bk\u0254e be Boaz.\\n22 Wow\u0254 dzogbenya fe n\u0254n\u0254me \u0256e
  s\u0254tiawo fe tawo \u014bu. Ale wowu s\u0254tiawo \u014bu d\u0254wo nu.\\n23 El\u00f3lo
  ga k\u0254\u0300 gaz\u0254 g\u00e3 la. Ele kotoo, eye tso efe to \u0256eka va se
  \u0256e to kem\u025b le ab\u0254klugui ewo, ek\u0254 ab\u0254klugui at\u0254\u0303,
  eye ka didime ab\u0254klugui blaet\u0254\u0303e akpee \u0256o.\\n24 N\u0254n\u0254metata
  siwo le abe gotsetse ene le k\u0254me n\u025b godoo va kpe, ewo le ab\u0254klugui
  \u0256eka \u0256e sia \u0256e me fo xl\u00e3 gaz\u0254 g\u00e3 la; gae wol\u00f3lo
  ts\u0254 w\u0254 n\u0254n\u0254metata siwo le abe gotsetse ene lae, eye wole agbaka
  eve me le e\u014bu, wok\u0254\u0300e kple z\u0254 la \u0256ekae.\\n25 Gaz\u0254
  la le nyitsu wuieve dzi, et\u0254\u0303 dze \u014bg\u0254 dziehe, et\u0254\u0303
  dze \u014bg\u0254 \u0263eto\u0256ofe, et\u0254\u0303 dze \u014bg\u0254 anyiehe,
  eye et\u0254\u0303 dze \u014bg\u0254 \u0263edzefe; eye gaz\u0254 g\u00e3 la le wo
  dzi, eye wo kat\u00e3 wotr\u0254 ag\u0254nu \u0256o \u0256e titina.\\n26 Gaz\u0254
  la tri asifome \u0256eka; eto le abe kplu fe to ene, eye w\u00f2\u0256i dzogbenyasefofo.
  Tsi baf akpe eve an\u0254 eme.\\n27 Ets\u0254 ak\u0254bli w\u0254 keke ewo. Keke
  \u0256e sia \u0256e fe didime le ab\u0254klugui ene, efe kekeme le ab\u0254klugui
  ene, eye w\u00f2k\u0254 ab\u0254klugui et\u0254\u0303.\\n28 Ale wow\u0254 kekeawoe
  nye esi: wots\u0254 ga gbadz\u025bwo xe wofe axawo dzi, eye wode ga gbadz\u025bawo
  gakpo siwo wots\u0254 tso ga wo n\u0254ewo me la dome.\\n29 Wo\u0256e dzatawo, nyitsuwo
  kple kerubiwo \u0256e ga gbadz\u025b siwo le gakpoawo dome la dzi, eye wo\u0256e
  wo \u0256e gakpo siwo wots\u0254 tso ga wo n\u0254ewo la h\u00e3 dzi nenema ke.
  Wow\u0254 sefofotsihewo \u0256e dzataawo kple nyitsuawo tame kple wo te.\\n30 Ak\u0254blif\u0254ti
  ene le keke \u0256e sia \u0256e te, eye ak\u0254bligakpowo le af\u0254tiawo dome,
  eye gakpo ene siwo le dzogoe eneawo dzi la l\u00e9 kekea \u0256e te. Anyin\u0254wo
  le ze la te, eye gae wol\u00f3lo ts\u0254 w\u0254 wo kple sefofotsihe siwo le axa
  \u0256e sia \u0256e.\\n31 Tso kekea nu le zea me le anyin\u0254awo dzi yi dzi le
  ab\u0254klugui \u0256eka; eye keke la nu le kotoo, eye w\u00f2le ab\u0254klugui
  \u0256eka kple af\u00e3, az\u0254 h\u00e3, wo\u0256e n\u0254n\u0254metatawo \u0256e
  zea nu. Eye ga gbadz\u025b siwo le zea nu fe k\u0254go le dzogoe ene me, womele
  kotoo o.\\n32 Af\u0254ti eneawo le axawo te, eye af\u0254til\u00e9nuawo l\u00e9
  \u0256e kekea \u014bu, af\u0254ti \u0256e sia \u0256e k\u0254 ab\u0254klugui \u0256eka
  kple af\u00e3.\\n33 Af\u0254tiawo le abe tasia\u0256amf\u0254tiwo ene. Gae wol\u00f3lo
  ts\u0254 w\u0254 wofe af\u0254til\u00e9nuawo, af\u0254tia me ga kotooawo, dometsogaawo
  kple dometsogakpefeawo kat\u00e3.\\n34 Gakpo ene siwo l\u00e9 kekea \u0256e te la
  le efe dzogoe eneawo dzi; eye wol\u00f3lo ga ts\u0254 k\u0254\u0300 wo kple keke
  la \u0256ekae.\\n35 Az\u0254 h\u00e3, wow\u0254 k\u0254 \u0256e keke la dzi, si
  k\u0254 ab\u0254klugui af\u00e3, eye w\u00f2le kotoo; le kekea fe dzigbe gome la,
  wol\u00f3lo ga k\u0254\u0300 efe k\u0254 fe dometsogaawo, ek\u0254goga gbadz\u025bwo
  kple keke la siaa \u0256ekae.\\n36 Az\u0254 h\u00e3, e\u0256e kerubiwo, dzatawo
  kple detiwo fe n\u0254n\u0254me \u0256e dometsogaawo kple ek\u0254goga gbadz\u025bwo
  \u014bu, \u0256e afi sia afi si tefe nya le ko, eye w\u00f2\u0256e sefofotsihewo
  \u0256e e\u014bu godoo.\\n37 Aleae w\u00f2w\u0254 keke ewoawo kat\u00e3e; gae wol\u00f3lo
  ts\u0254 k\u0254\u0300 wo kat\u00e3 wos\u0254, dzidzeme \u0256eka kple n\u0254n\u0254me
  \u0256ekae li na wo kat\u00e3.\\n38 Ets\u0254 ak\u0254bli w\u0254 ze ewo; zeawo
  domet\u0254 \u0256e sia \u0256e x\u0254a tsi baf blaene. Wo domet\u0254 \u0256e
  sia \u0256e le ab\u0254klugui ene. Ze \u0256eka le keke ewoawo domet\u0254 \u0256e
  sia \u0256e dzi.\\n39 Az\u0254 ets\u0254 keke at\u0254\u0303 da \u0256e x\u0254
  la fe \u0256usime, eye w\u00f2ts\u0254 at\u0254\u0303 da \u0256e x\u0254 la fe miame,
  ets\u0254 gaz\u0254 g\u00e3 la \u014but\u0254 da \u0256e x\u0254 la fe \u0256usime
  le anyiehe\u0263edzefe gome.\\n40 Hiram w\u0254 zewo, sofiwo kple agba goboewo h\u00e3.
  Ml\u0254eba Hiram wu d\u0254 siwo kat\u00e3 w\u00f2w\u0254 le Afet\u0254 fe x\u0254
  la \u014bu na Fia Salomo la nu.\\n41 Ew\u0254 s\u0254ti eveawo kple ta mligo siwo
  le s\u0254ti eveawo dzi; ga\u0256\u0254 eve siwo le ta mligo eve siwo le s\u0254tiawo
  dzi;\\n42 yevubo\u0256a alafa eneawo be woan\u0254 ga\u0256\u0254 eveawo \u014bu,
  ew\u0254 yevubo\u0256a siwo le agbaka eve me \u0256e ga\u0256\u0254 \u0256e sia
  \u0256e \u014bu be woatsy\u0254 ta mligo eve siwo le s\u0254ti eveawo dzi la \u014bu,\\n43
  keke ewoawo kple ze ewo siwo le kekeawo dzi;\\n44 Gaz\u0254 g\u00e3 la kple nyitsu
  wuieve siwo le gaz\u0254 la te;\\n45 dzofil\u0254gbaawo, sofiawo kple agba goboeawo
  kpakple nuzaz\u00e3 siwo kat\u00e3 Hiram ts\u0254 ak\u0254bli si \u014bu wozr\u0254\u0303
  la w\u0254 na Fia Salomo hena Afet\u0254 fe x\u0254 la.\\n46 Fia la na wol\u00f3lo
  ga k\u0254\u0300 wo \u0256e n\u0254n\u0254me si wots\u0254 anyi w\u0254 la me le
  Yordan-nuto la me, le Sukot kple Zaretan dome.\\n47 Salomo mena woda nuzaz\u00e3
  siawo kat\u00e3 o, elabena wos\u0254 gb\u0254 ale gbegbe. Womebu ak\u0254bli la
  fe kpekpeme o.\\n48 Salomo w\u0254 Afet\u0254 fe x\u0254 la me nuzaz\u00e3wo kat\u00e3:
  sikav\u0254samlekpui la kple sikakpl\u0254\u0303 si dzi \u014bkume\u0256obolo la
  n\u0254na;\\n49 ets\u0254 sika nyuit\u0254 w\u0254 aka\u0256itiawo, wo domet\u0254
  at\u0254\u0303 le \u0256usime, eye at\u0254\u0303 le miame le x\u0254 ememet\u0254
  la \u014bg\u0254; ets\u0254 sika w\u0254 sefofoawo, aka\u0256igb\u025bawo kple \u0256ovul\u00e3nuawo;\\n50
  ets\u0254 sika nyuit\u0254 w\u0254 gagbaawo, dzotsinuawo, agba goboeawo, kpluawo
  kple dzo\u0256enuawo; ets\u0254 sika w\u0254 x\u0254 ememet\u0254, si nye K\u0254k\u0254efewo
  \u0191e K\u0254k\u0254efe la, kple gbedox\u0254 la fe \u028b\u0254truawo fe megbegawo.\\n51
  Ale Fia Salomo wu d\u0254 siwo kat\u00e3 w\u00f2le be w\u00f2aw\u0254 le Afet\u0254
  fe x\u0254 la \u014bu la nu. Eye Salomo ts\u0254 nu siwo \u014bu fofoa David k\u0254
  la va da \u0256e eme; ets\u0254 klosalo kple sika kpakple nu bubuawo da \u0256e
  Afet\u0254 fe x\u0254 la fe kesin\u0254nudzra\u0256ofe.\\n1 FIAWO 8\\n1 \u0194ema\u0263i
  la, Salomo fo Israel fe ametsitsiwo, toawo fe tat\u0254wo kat\u00e3, Israel-viwo
  fe tat\u0254 siwo le wo fofowo fe afek\u0254wo nu la nu fu. Wova Fia Salomo gb\u0254
  le Yerusalem, ne woayi a\u0256ak\u0254 Afet\u0254 fe nubabla\u0256aka la tso David
  \u0191e Du si woy\u0254na be Zion la me v\u025b.\\n2 Israel \u014butsuwo kat\u00e3
  va fo fu \u0256e Fia Salomo gb\u0254 le dzinu Etanim me, le \u014bkekenyui si wo\u0256una
  le \u0263leti adrelia me la \u0256u\u0263i.\\n3 Israel fe ametsitsiwo kat\u00e3
  va, eye nun\u0254lawo k\u0254 A\u0256aka la.\\n4 Wok\u0254 Afet\u0254 fe A\u0256aka
  la kple takpegbad\u0254 la kpakple nu k\u0254k\u0254e siwo kat\u00e3 le agbad\u0254a
  me v\u025b. Nun\u0254lawo kple Lewi viwoe k\u0254 wo v\u025b.\\n5 Fia Salomo kple
  Israel fe ha blibo si woy\u0254 wova kpe ta \u0256e egb\u0254 la t\u0254 \u0256e
  A\u0256aka la \u014bg\u0254. Wots\u0254 al\u1ebd kple nyi gbogbo, siwo womate \u014bu
  abu alo axl\u1ebd o la, sa v\u0254e.\\n6 Ale nun\u0254lawo k\u0254 Afet\u0254 fe
  nubabla\u0256aka la va da \u0256e en\u0254fe, le x\u0254 ememet\u0254, si nye K\u0254k\u0254efewo
  \u0191e K\u0254k\u0254efe la me, le kerubiawo fe a\u028balawo te.\\n7 Kerubiawo
  keke wofe a\u028balawo \u0256e A\u0256aka la n\u0254fe, ale be kerubiawo tsy\u0254
  A\u0256aka la kple e\u014bu kpoawo dzi le dzi gome.\\n8 Kpoawo didi, ale be woate
  \u014bu akp\u0254 wofe nugb\u0254 tso K\u0254k\u0254efe si le x\u0254 ememet\u0254
  \u014bg\u0254 la me, gake womate \u014bu akp\u0254 wo tso gota o. Eye wole afi ma
  va se \u0256e egbe sia.\\n9 Naneke mele A\u0256aka la me o, negbe kpe gbadz\u025b
  eve, siwo Mose ts\u0254 de eme le Horeb, esi Afet\u0254 bla nu kple Israel-viwo
  esime wotso Egipte-nyigba dzi gb\u0254na la ko.\\n10 Esi nun\u0254lawo do le k\u0254k\u0254efea
  la, alilikpo y\u0254 Afet\u0254 fe x\u0254 la ta\u014b. 11 Eye nun\u0254lawo mete
  \u014bu n\u0254 te be woasub\u0254 o le alilikpo la ta, elabena Afet\u0254 fe \u014butik\u0254k\u0254e
  y\u0254 Afet\u0254 fe x\u0254 la ta\u014b.\\n12 \u0194ema\u0263i Salomo gbl\u0254
  be: \u201cAfet\u0254 gbl\u0254 be yean\u0254 bluk\u0254 tsi\u0256itsi\u0256i me.\\n13
  Mete \u014bu tu x\u0254 be w\u00f2anye n\u0254fe nyui na w\u00f2, tefe si n\u00e0n\u0254
  \u0256aa.\u201d\\n14 Az\u0254 fia la tr\u0254 dze \u014bg\u0254 Israel fe ha blibo
  la kat\u00e3 heyra wo esime Israel fe ha bliboa le tsitrenu.\\n15 Eye w\u00f2gbl\u0254
  be: \u201cWoakafu Afet\u0254, Israel fe Mawu, ame si \u014but\u0254 ke nu do \u014bugbe
  na fofonye David, eye w\u00f2to eya \u014but\u0254 fe asi dzi na w\u00f2va eme,
  gbl\u0254 be,\\n16 \u2018Tso gbe si gbe mekpl\u0254 nye duk\u0254 Israel tso Egipte
  la, nyemetia du a\u0256eke le Israel-toawo kat\u00e3 me be woatu x\u0254, si \u014bu
  nye \u014bk\u0254 an\u0254 le afi ma o, ke metia David be w\u00f2an\u0254 nye duk\u0254
  Israel nu.\u2019\\n17 Eye fofonye David di vevie tso dzi me be yeatu x\u0254 na
  Afet\u0254, Israel fe Mawu la, fe \u014bk\u0254.\\n18 Ke Afet\u0254 gbl\u0254 na
  fofonye David be, \u2018\u00c8di vevie tso dzi me be yeatu x\u0254 na nye \u014bk\u0254
  la, eye enyo \u014but\u0254 be n\u00e8di tso dzi me be yeaw\u0254 esia.\\n19 \u00d0eko
  w\u00f2 \u014but\u0254 m\u00e0tu x\u0254 la o, ke bo\u014b vi si woadzi na w\u00f2
  lae atu x\u0254 na nye \u014bk\u0254.\u2019\\n20 Afet\u0254 w\u0254 \u014bugbe si
  w\u00f2do la dzi, elabe mex\u0254 \u0256e fofonye David tefe heb\u0254b\u0254 n\u0254
  Israel fe fiazikpui la dzi, abe ale si Afet\u0254 do \u014bugbee ene. Metu x\u0254
  na Afet\u0254, Israel fe Mawu la, fe \u014bk\u0254,\\n21 eye mew\u0254 tefe na A\u0256aka,
  si me Afet\u0254 fe nu, si w\u00f2bla kple m\u00eda t\u0254gbuiwo esime w\u00f2kpl\u0254
  wo tso Egipte-nyigba dzi gb\u0254nae le la, \u0256e afi ma.\u201d\\n22 Eye Salomo
  t\u0254 \u0256e Afet\u0254 fe v\u0254samlekpui la \u014bg\u0254 le Israel fe ha
  blibo la \u014bkume, eke efe ab\u0254wo me \u0256o \u0256e dzifo,\\n23 eye w\u00f2gbl\u0254
  be: \u201cOo Afet\u0254, Israel fe Mawu, Mawu a\u0256eke mele abe w\u00f2 ene le
  dzifo afi m\u025b alo anyigba dzi afii o, \u00e8w\u0254na \u0256e w\u00f2 nubabla
  dzi eye n\u00e8vea w\u00f2 sub\u0254la siwo z\u0254na le \u014bkuw\u00f2me kple
  wofe dzi blibo la nu.\\n24 \u00c8w\u0254 \u014bugbe si n\u00e8do na w\u00f2 sub\u0254la
  fofonye David la dzi. \u00c8ts\u0254 w\u00f2 nu do \u014bugbe, eye n\u00e8to w\u00f2
  asi dzi na w\u00f2va eme egbe sia.\\n25 Az\u0254 Oo Afet\u0254, Israel fe Mawu,
  w\u0254 \u014bugbe si n\u00e8do na w\u00f2 sub\u0254la fofonye David la dzi, esi
  n\u00e8gbl\u0254 be, \u2018Ne viw\u00f2wo kp\u0254 wofe z\u0254z\u0254me dzi eye
  woz\u0254 le \u014bkunyeme abe ale si n\u00e8z\u0254 le \u014bkunyemee ene la, ekema
  w\u00f2 fomea me t\u0254 siwo ab\u0254b\u0254 n\u0254 Israel fe fiazikpui dzi la
  nu matso le \u014bkunyeme o.\u2019\\n26 Eya ta Oo Israel fe Mawu, me\u0256e kuku,
  na \u014bugbe si n\u00e8do na w\u00f2 sub\u0254la fofonye David la nava eme.\\n27
  \u201cKe \u0256e Mawu ate \u014bu an\u0254 anyigba dzi nyatefea? Kp\u0254 \u0256a!
  Dzifowo, \u025b\u0303, dzifowo fe dzifo g\u0254\u0303 h\u00e3 melolo na w\u00f2
  o; \u028buu keke w\u00f2ahanye x\u0254 sia, si metu la?\\n28 Az\u0254, Oo Afet\u0254,
  nye Mawu, tr\u0254 \u0256e w\u00f2 sub\u0254la fe gbedodo\u0256a \u014bu, eye n\u00e0w\u0254
  efe biabia be n\u00e0ve ye nu la dzi, ne n\u00e0se kokofofo kple gbe si dom w\u00f2
  sub\u0254la le \u0256a le \u014bkuw\u00f2me egbea.\\n29 Na w\u00f2 \u014bkuwo nan\u0254
  \u028bu\u028bu \u0256e x\u0254 sia \u014bu z\u00e3 kple keli, \u0256e tefe si \u014bu
  n\u00e8gbl\u0254 le be, \u2018Nye \u014bk\u0254 an\u0254 afi ma\u2019 la \u014bu,
  ne n\u00e0\u0256o to gbe si w\u00f2 sub\u0254la atr\u0254 mo \u0256e tefe sia ado
  \u0256a.\\n30 Eye ne w\u00f2 sub\u0254la kple w\u00f2 duk\u0254 Israel tr\u0254
  mo \u0256e tefe sia do gbe \u0256a bia be n\u00e0ve yewo nu la, n\u00e0\u0256o to
  wo, eye n\u00e0see le n\u0254w\u00f2fe le dzifo; \u025b\u0303, ne n\u00e0see ahats\u0254e
  ake.\\n31 \u201cNe ame a\u0256e w\u0254 nu v\u0254\u0303 \u0256e ehavi \u014bu,
  eye wobia tso esi be w\u00f2aka atam fu edzi, eye w\u00f2ka atam ts\u0254 bla e\u0256okui,
  eye w\u00f2va w\u00f2 v\u0254samlekpui la \u014bg\u0254 le afe sia me esime atam
  si w\u00f2ka la le edzi la,\\n32 ekema n\u00e0see le dzifo, eye n\u00e0de nu nya
  la me ahadr\u0254\u0303e na w\u00f2 sub\u0254lawo, eye n\u00e0bu f\u0254 ame v\u0254\u0303\u0256i
  la be e\u0256i f\u0254, ne n\u00e0na nu si w\u00f2w\u0254 la nava eya \u014but\u0254
  fe ta dzi, eye n\u00e0tso afia na ame dz\u0254dz\u0254e la, ne n\u00e0\u0256o etefe
  n\u025b \u0256e efe dz\u0254dz\u0254enyenye nu.\\n33 \u201cNe w\u00f2 duk\u0254
  Israel fe fut\u0254wo si wo, le esi wole nu v\u0254\u0303 w\u0254m \u0256e \u014buw\u00f2
  atra\u0256ii ta, eye wotr\u0254 va gb\u0254w\u00f2, eye wokafu w\u00f2 \u014bk\u0254,
  do gbe \u0256a bia be n\u00e0ve yewo nu le afe sia me la,\\n34 ekema n\u00e0see
  le dzifo, eye n\u00e0ts\u0254 w\u00f2 duk\u0254 Israel fe nu v\u0254\u0303 la ake,
  eye n\u00e0kpl\u0254 wo agb\u0254e va anyigba si n\u00e8ts\u0254 na wo t\u0254gbuiwo
  la dzi.\\n35 \u201cNe dzifowo nu tu, ale be tsi megale dzadzam o, le esi wole nu
  v\u0254\u0303 w\u0254m \u0256e \u014buw\u00f2 atra\u0256ii ta, eye wotr\u0254 mo
  \u0256e tefe sia do gbe \u0256a hekafu w\u00f2 \u014bk\u0254, eye wotr\u0254 tso
  wofe nu v\u0254\u0303wo me le esi n\u00e8b\u0254b\u0254 wo \u0256e anyi ta la,\\n36
  ekema n\u00e0see le dzifo, eye n\u00e0ts\u0254 w\u00f2 sub\u0254lawo, w\u00f2 duk\u0254
  Israel, fe nu v\u0254\u0303 ake, elabena \u00e0fia m\u0254 nyui si dzi woato la
  wo; eye n\u00e0na tsi nadza \u0256e w\u00f2 anyigba si n\u00e8ts\u0254 na w\u00f2
  duk\u0254 w\u00f2zu wofe domenyinu la dzi.\\n37 \u201cNe d\u0254 to le anyigba la
  dzi, d\u0254v\u0254\u0303 va, nukuwo hl\u0254\u0303 alo dze heteku, \u028betsuviwo
  alo \u028betsuvi gbl\u1ebdnuwo do; ne wofe fut\u0254wo \u0256e to \u0256e wo le
  wofe du a\u0256e me le anyigba la dzi, alo ne d\u0254v\u0254\u0303 bubu \u0256e
  sia \u0256e fomevi alo d\u0254l\u00e9le a\u0256e \u0256e fu na wo la,\\n38 gbe ka
  kee ame a\u0256e alo w\u00f2 duk\u0254 Israel blibo la ado \u0256a o, amenuveve
  ka kee woabia o, (elabena wo domet\u0254 \u0256e sia \u0256e nya vevesese si le
  dzi me n\u025b) ne woke wofe ab\u0254wo me \u0256o \u0256e x\u0254 sia gb\u0254
  la,\\n39 ekema n\u00e0see le n\u0254w\u00f2fe le dzifo, eye n\u00e0ts\u0254 ake,
  eye n\u00e0w\u0254 edzi; n\u00e0\u0256o etefe na ame sia ame \u0256e efe z\u0254z\u0254me
  nu, elabena \u00e8nya efe dzi (w\u00f2 \u0256eka koe nya amegbet\u0254viwo kat\u00e3
  fe dzi),\\n40 ne woav\u0254\u0303 w\u00f2 le \u014bkeke siwo kat\u00e3 wole agbe
  le anyigba si n\u00e8ts\u0254 na m\u00eda t\u0254gbuiwo la dzi.\\n41 \u201cEye ne
  amedzro a\u0256e h\u00e3, ame si metso w\u00f2 duk\u0254 Israel me o, ke bo\u014b
  etso anyigba didi a\u0256e dzi va le w\u00f2 \u014bk\u0254 ta,\\n42 (elabena woase
  w\u00f2 \u014bk\u0254 g\u00e3 la kple w\u00f2 asi ses\u1ebd kpakple w\u00f2 ab\u0254
  si n\u00e8do \u0256a la \u014bk\u0254), eye w\u00f2va hetr\u0254 mo \u0256o \u0256e
  x\u0254 sia gb\u0254 do gbe \u0256a la,\\n43 ekema n\u00e0see le n\u0254w\u00f2fe
  le dzifo, eye n\u00e0w\u0254 nu siwo kat\u00e3 amedzroa bia w\u00f2 la n\u025b;
  ne anyigbadziduk\u0254wo kat\u00e3 nadze si w\u00f2 \u014bk\u0254 la, ne woav\u0254\u0303
  w\u00f2, abe ale si w\u00f2 duk\u0254 Israel v\u0254\u0303a w\u00f2e ene, ne woadze
  sii be, w\u00f2 \u014bk\u0254e woy\u0254 \u0256e x\u0254 sia si metu la \u014bu.\\n44
  \u201cNe w\u00f2 duk\u0254 ho a\u028ba \u0256e wofe fut\u0254 a\u0256e \u014bu le
  m\u0254 si dzi n\u00e8d\u0254 wo \u0256o, eye wotr\u0254 mo \u0256o \u0256e du si
  n\u00e8tia kple x\u0254 si metu na w\u00f2 \u014bk\u0254 la \u014bu hedo gbe \u0256a
  na w\u00f2, Afet\u0254 la,\\n45 ekema n\u00e0se wofe gbedodo\u0256a kple wofe kokofofo
  be n\u00e0ve yewo nu la le dzifo, eye n\u00e0w\u0254 nu si s\u0254 la na wo.\\n46
  \u201cNe wow\u0254 nu v\u0254\u0303 \u0256e \u014buw\u00f2 (elabena amegbet\u0254
  a\u0256eke meli si mew\u0254a nu v\u0254\u0303 o), eye dzi ku w\u00f2 \u0256e wo
  \u014bu, eye n\u00e8\u0256e asi le wo \u014bu na fut\u0254wo, eye wo\u0256e aboyo
  wo yi fut\u0254 la fe anyigba dzi, e\u0256anye didife alo kpuife o;\\n47 eye wony\u0254
  le wo \u0256okuiwo me le anyigba si dzi wo\u0256e aboyo wo yii la dzi, wotr\u0254
  \u0256e \u014buw\u00f2 eye wo\u0256e kuku be n\u00e0ve yewo nu le ame siwo \u0256e
  aboyo wo la fe anyigba dzi, gbl\u0254 be, \u2018M\u00edew\u0254 nu v\u0254\u0303,
  m\u00ededa vo; eye m\u00edew\u0254 nu tovo,\u2019\\n48 eye wotr\u0254 \u0256e \u014buw\u00f2
  kple wofe dzi blibo kple wofe lu\u028b\u0254 blibo le wofe fut\u0254 siwo \u0256e
  aboyo wo la fe anyigba dzi, eye wotr\u0254 mo do \u0256e anyigba si n\u00e8ts\u0254
  na wo t\u0254gbuiwo kple du si n\u00e8tia kpakple x\u0254 si metu na w\u00f2 \u014bk\u0254
  la \u014bu hedo gbe \u0256a na w\u00f2 la,\\n49 ekema n\u00e0se wofe gbedodo\u0256a
  kple wofe kokofofo be n\u00e0ve yewo nu la le n\u0254w\u00f2fe le dzifo, eye n\u00e0w\u0254
  nu si s\u0254 la na wo,\\n50 eye n\u00e0ts\u0254 ake w\u00f2 duk\u0254 si w\u0254
  nu v\u0254\u0303 \u0256e \u014buw\u00f2 la, eye n\u00e0ts\u0254 wofe vo siwo kat\u00e3
  woda \u0256e \u014buw\u00f2 la ake. N\u00e0na wofe nu naw\u0254 nublanui na ame
  siwo \u0256e aboyo wo, ne woave wo nu\\n51 (elabena w\u00f2 duk\u0254 kple w\u00f2
  domenyinu wonye, ame siwo n\u00e8kpl\u0254 tso Egipte, tso gal\u00f3lokpo me).\\n52
  W\u00f2 \u014bkuwo nan\u0254 \u028bu\u028bu \u0256e w\u00f2 sub\u0254la fe kuku\u0256e\u0256e
  be n\u00e0ve ye nu kple w\u00f2 duk\u0254 Israel fe kuku\u0256e\u0256e be n\u00e0ve
  yewo nu la \u014bu, eye n\u00e0\u0256o to wo \u0263esia\u0263i si woy\u0254 w\u00f2.\\n53
  Elabena Oo Afet\u0254 Dzi\u0256ulag\u00e3 Afet\u0254, w\u00f2 \u014but\u0254e \u0256e
  wo \u0256e vovo le anyigbadziduk\u0254wo kat\u00e3 dome be woanye w\u00f2 domenyinu,
  abe ale si n\u00e8gbl\u0254e to w\u00f2 sub\u0254la Mose dzi esime n\u00e8kpl\u0254
  m\u00eda t\u0254gbuiwo tso Egipte gb\u0254nae ene.\u201d\\n54 Eye esi Salomo nya
  do gbe sia \u0256a na Afet\u0254 hebia amenuveve sia v\u0254 ko la, etso \u0256e
  tsitrenu le Afet\u0254 fe v\u0254samlekpui la \u014bg\u0254, afi si w\u00f2dze klo
  \u0256o heke efe ab\u0254wo \u0256o \u0256e dzifo.\\n55 Eye w\u00f2tso hek\u0254
  gbe dzi ses\u0129e yra Israel fe ha blibo la kat\u00e3 gbl\u0254 be:\\n56 \u201cWoakafu
  Afet\u0254, ame si na gb\u0254\u0256emefe efe duk\u0254 Israel, abe ale si w\u00f2do
  \u014bugbee ene. Nya \u0256eka p\u025b h\u00e3 medo kpo emevava le \u014bugbe nyui
  siwo kat\u00e3 w\u00f2do to esub\u0254la Mose dzi la me o.\\n57 Afet\u0254 m\u00eda
  Mawu la nen\u0254 kpli m\u00ed, abe ale si ko w\u00f2n\u0254 kple m\u00eda t\u0254gbuiwo
  ene. Mega\u0256e asi le m\u00eda \u014bu alo agbl\u1ebd m\u00ed \u0256i o.\\n58
  Netr\u0254 m\u00edafe dzi \u0256e e\u0256okui \u014bu, be m\u00edaz\u0254 le efe
  m\u0254wo kat\u00e3 dzi, eye m\u00edal\u00e9 efe sededewo kple efe \u0256o\u0256owo
  kpakple efe \u028b\u0254nudr\u0254\u0303\u0256o\u0256o siwo w\u00f2ts\u0254 na m\u00eda
  t\u0254gbuiwo w\u00f2nye sedede la me \u0256e asi.\\n59 Eye nye nya siawo, siwo
  mets\u0254 fo koko na Afet\u0254 be w\u00f2ave nunye la, nan\u0254 Afet\u0254 m\u00eda
  Mawu la \u014bkume z\u00e3 kple keli, ne w\u00f2adr\u0254\u0303 \u028b\u0254nu dz\u0254dz\u0254e
  na esub\u0254la kple efe duk\u0254 Israel gbe sia gbe, abe ale si w\u00f2hi\u00e3
  ene,\\n60 ne anyigbadziduk\u0254wo kat\u00e3 nadze sii be Afet\u0254e nye Mawu vav\u00e3
  la. \u00d0eke megali o!\\n61 Eya ta mina miafe dzi naku \u0256e Afet\u0254 m\u00eda
  Mawu la \u014bu bliboe, ne miaz\u0254 le efe \u0256o\u0256owo nu ahal\u00e9 efe
  sededewo me \u0256e asi, abe ale si w\u00f2le egbe sia ene.\u201d\\n62 Eye fia la
  kple Israel blibo si le e\u014bu la sa v\u0254 g\u00e3 a\u0256e le Afet\u0254 \u014bkume.\\n63
  Salomo ts\u0254 nyi akpe blaeve v\u0254 eve kple al\u1ebd akpe alafa \u0256eka blaeve
  sa \u014butifafav\u0254 na Afet\u0254; ale fia la kple Israel-viwo kat\u00e3 k\u0254
  Afet\u0254 fe x\u0254 la \u014bu.\\n64 Gbe ma gbe la, fia la k\u0254 x\u0254x\u0254nu
  si le Afet\u0254 fe x\u0254 la \u014bg\u0254 la titina \u014bu, elabena afi mae
  w\u00f2ats\u0254 numev\u0254 kple nu\u0256uv\u0254 kpakple \u014butifafav\u0254awo
  fe amiawo asa v\u0254e le, elabena ak\u0254bliv\u0254samlekpui si le Afet\u0254
  \u014bkume la le sue akpa na numev\u0254sa kple nu\u0256uv\u0254sa kpakple \u014butifafav\u0254sawo
  fe amiawo.\\n65 \u0194ema\u0263i la, Salomo kple Israel blibo la \u0256u \u014bkekenyui
  la, wonye ha g\u00e3 a\u0256e, tso Lebo-Hamat va se \u0256e Egipte-t\u0254\u028bu
  la nu, le Afet\u0254 m\u00eda Mawu la \u014bkume \u014bkeke adre eye woaga\u0256ui
  \u014bkeke adre bubu; wo kat\u00e3 le \u014bkeke wuiene.\\n66 Le \u014buf\u0254ke
  la, edo m\u0254 duk\u0254 la; eye woyra fia la hedzo yi wofe afewo me kple dzidz\u0254
  kpakple aseyetsotso le nu nyui siwo kat\u00e3 Afet\u0254 w\u0254 na efe sub\u0254la
  David kple efe duk\u0254 Israel la ta.\\n1 FIAWO 9\\n1 Esi Salomo wu Afet\u0254
  fe x\u0254 la kple fia fe x\u0254 la tutu nu, eye Salomo w\u0254 nu siwo kat\u00e3
  dzroe w\u00f2di be yeaw\u0254 v\u0254 ko la,\\n2 Afet\u0254 \u0256e e\u0256okui
  fia Salomo zi evelia, abe ale si w\u00f2\u0256e e\u0256okui fiae le Gibeon ene.\\n3
  Afet\u0254 gbl\u0254 n\u025b be: \u201cMese w\u00f2 gbedodo\u0256a kple koko si
  n\u00e8fo be woave ye nu la. Mek\u0254 x\u0254 sia si n\u00e8tu la \u014bu hets\u0254
  nye \u014bk\u0254 \u0256o afi ma tegbee, eye nye \u014bkuwo kple nye dzi an\u0254
  afi ma \u0263eawokat\u00e3\u0263i.\\n4 Ne \u00e8z\u0254 le \u014bkunyeme abe ale
  si fofow\u00f2 David z\u0254 le dzi dzadz\u025b kple dz\u0254dz\u0254enyenye me
  ene, eye n\u00e8w\u0254 nu siwo kat\u00e3 fe se mede na w\u00f2 la dzi, eye n\u00e8l\u00e9
  nye sewo kple \u028b\u0254nudr\u0254\u0303\u0256o\u0256owo me \u0256e asi la,\\n5
  ekema nye h\u00e3 mali ke w\u00f2 fia\u0256ufe fe fiazikpui \u0256e Israel dzi \u0256aa,
  abe ale si medo \u014bugbe na fofow\u00f2 David ene be, \u2018W\u00f2 fomea me t\u0254
  siwo ab\u0254b\u0254 n\u0254 Israel fe fiazikpui dzi la nu matso o.\u2019\\n6 Gake
  ne w\u00f2 kple viw\u00f2wo mietr\u0254 le yonyeme, eye miel\u00e9 nye sedede kple
  nye \u0256o\u0256o siwo mets\u0254 \u0256o mia \u014bkume la me \u0256e asi o, eye
  mieyi \u0256asub\u0254 mawu bubuwo hede ta agu na wo la,\\n7 ekema nye h\u00e3 ma\u0256e
  Israel \u0256a le anyigba si mets\u0254 na wo la dzi, eye mats\u0254 x\u0254 sia
  si \u014bu mek\u0254 na nye \u014bk\u0254 la afu gbe le \u014bkunyeme, eye Israel
  azu vlodonu kple al\u0254me\u0256enu le duk\u0254wo kat\u00e3 dome.\\n8 Eye x\u0254
  sia azu glikpo. Ame sia ame si ato e\u014bu ayi la fe nu aku w\u00f2alia aku agbl\u0254
  be, \u2018Nu ka tae Afet\u0254 w\u0254 anyigba sia kple x\u0254 sia alea?\u2019\\n9
  Eye woagbl\u0254 be, \u2018Esi wogbl\u1ebd Afet\u0254 wofe Mawu, ame si kpl\u0254
  wo t\u0254gbuiwo tso Egipte-nyigba dzi la \u0256i, eye woku \u0256e mawu bubuwo
  \u014bu, eye wode ta agu na wo hesub\u0254 wo la tae Afet\u0254 he v\u0254\u0303
  siawo kat\u00e3 va wo dzi \u0256o.\u2019\u201d\\n10 Le fe blaeve siwo Salomo ts\u0254
  tu x\u0254 eve siwo nye Afet\u0254 fe x\u0254 kple fia la fe x\u0254 fe nuwuwu la,\\n11
  Tiro-fia Hiram na sedertiwo kple sesewutiwo kpakple sika ale si nu Salomo di lae,
  eye Fia Salomo ts\u0254 du blaeve na Hiram le Galilea-nyigba dzi.\\n12 Eye Hiram
  tso Tiro va be yeakp\u0254 du siwo Salomo ts\u0254 n\u025b la \u0256a, ke womedze
  e\u014bu o.\\n13 Eya ta ebiae be: \u201cN\u0254vinye, du ka fomeviwoe nye esiawo
  n\u00e8ts\u0254 nam?\u201d Eye wona \u014bk\u0254 wo be Kabul-nyigba va se \u0256e
  egbe sia.\\n14 Le \u0263eyi\u0263i a\u0256e megbe la, Hiram \u0256o sika talento
  alafa \u0256eka blaeve \u0256e fia la.\\n15 Ke esiae nye d\u0254 si Fia Salomo zi
  amewo dzi wow\u0254 ts\u0254 tu Afet\u0254 fe x\u0254 la kple eya \u014but\u0254
  fe x\u0254 la, kpakple Kpo la, eye w\u00f2\u0256o gli \u0256e Yerusalem, Hazor,
  Megido kple Gezer \u014bu lae nye esi.\\n16 (Do \u014bg\u0254 la, Egipte-fia Farao
  ho va x\u0254 Gezer het\u0254 dzoe, eye w\u00f2wu Kanaant\u0254 siwo le dua me.
  Eye w\u00f2ts\u0254e do m\u0254 viany\u0254nu si nye Salomo sr\u0254\u0303.)\\n17
  Salomo tso Gezer, Anyigbe Bet-Horon,\\n18 Baalat kple Tamar si le gbedzi le efe
  anyigbaa dzi,\\n19 kple Salomo fe nudzra\u0256ofeduwo kat\u00e3, tasia\u0256amduwo
  kple s\u0254dolawo fe duwo kpakple nu siwo dzro Salomo w\u00f2di be yeatu \u0256e
  Yerusalem kple Lebanon kpakple anyigba blibo si dzi w\u00f2\u0256u la dzi.\\n20
  Ke ame siwo kat\u00e3 kp\u0254t\u0254 le Amorit\u0254wo, Hitit\u0254wo, Perizit\u0254wo,
  Hivit\u0254wo kple Yebusit\u0254wo dome, siwo menye Israel-viwo o la,\\n21 fe vi
  siwo kp\u0254t\u0254 \u0256e anyigbaa dzi, siwo Israel-viwo mete \u014bu tsr\u0254\u0303
  gbidigbidi o la, Salomo na wow\u0254 kluvid\u0254 ses\u1ebd va se \u0256e egbe sia.\\n22
  Ke Salomo mew\u0254 Israel-vi a\u0256eke kluvii o, elabena woawoe nye efe a\u028baw\u0254lawo,
  sub\u0254viwo, ameg\u00e3wo, asrafomeg\u00e3wo, kpakple tasia\u0256amdolawo kple
  s\u0254dolawo fe tat\u0254wo.\\n23 D\u0254dzikp\u0254la alafa at\u0254\u0303 blaat\u0254\u0303
  ye le Salomo fe d\u0254wo nu, eye woawoe le d\u0254w\u0254laawo nu.\\n24 Ke Farao
  viny\u0254nu la \u028bu le David \u0191e Du la me yi eya \u014but\u0254 fe x\u0254
  si Salomo tu n\u025b me; emegbe w\u00f2tu Kpo la.\\n25 Salomo saa numev\u0254wo
  kple \u014butifafav\u0254wo le v\u0254samlekpui si w\u00f2\u0256i na Afet\u0254
  la dzi zi et\u0254\u0303 le fe \u0256eka me, eye wodoa dzudz\u0254 le v\u0254samlekpui
  si le Afet\u0254 \u014bkume la dzi, eye w\u00f2wu x\u0254 la nu.\\n26 Fia Salomo
  kpa t\u0254dzi\u028buwo le Ezion-Geber, le Elot xa, \u0256e \u0191udz\u0129 la nu
  le Edom-nyigba dzi.\\n27 Eye Hiram \u0256o eya \u014but\u0254 fe sub\u0254vi siwo
  nye fudzid\u0254w\u0254la bibiwo la \u0256e t\u0254dzi\u028buawo me be woaw\u0254
  d\u0254 kple Salomo fe sub\u0254viwo.\\n28 Eye woyi Ofir \u0256ats\u0254 sika talento
  alafa ene blaeve tso afi ma v\u025b na Fia Salomo.\\n1 FIAWO 10\\n1 Esi Seba-fiany\u0254nu
  la se Salomo \u014bk\u0254 kple kadodo si le eya kple Afet\u0254 fe \u014bk\u0254
  dome la, eva be yeadoe kp\u0254 kple biabia ses\u1ebdwo.\\n2 Eye w\u00f2va Yerusalem
  kple ameha g\u00e3 a\u0256e \u014but\u0254 kple kpos\u0254, siwo ts\u0254 balsam-mi
  kple sika gbogbo a\u0256e \u014but\u0254 kpakple kpe x\u0254asiwo. Eva Salomo gb\u0254
  hegbl\u0254 nya siwo kat\u00e3 le efe dzi me la n\u025b.\\n3 Eye Salomo \u0256o
  efe nyawo kat\u00e3 \u014bu n\u025b. Nya a\u0256eke meli si me fia la mete \u014bu
  \u0256e n\u025b o.\\n4 Esi Seba-fiany\u0254nu la kp\u0254 Salomo fe nunya kat\u00e3
  kple x\u0254 si w\u00f2tu,\\n5 nu\u0256u\u0256u si n\u0254a efe kpl\u0254\u0303
  dzi, efe d\u0254lawo fe anyin\u0254n\u0254, ale si efe kpl\u0254\u0303\u014busub\u0254lawo
  sub\u0254nae kple wofe awuwo, efe ahakulawo kple efe numev\u0254 siwo w\u00f2sana
  edziedzi le Afet\u0254 fe afe la me la, gb\u0254gbl\u0254 bu \u0256ee.\\n6 Eye w\u00f2gbl\u0254
  na fia la be: \u201cNya siwo mese le nye anyigba dzi le nu siwo n\u00e8w\u0254 kple
  w\u00f2 nunya \u014bu la nye nyatefe.\\n7 Gake nyemex\u0254 wo dzi se o va se \u0256e
  esime nye \u014but\u0254 meva kp\u0254e kple nye \u014bkuwo hafi. Ke kp\u0254 \u0256a,
  womegbl\u0254 wofe af\u00e3 g\u0254\u0303 h\u00e3 nam o! \u0203o nya si wogbl\u0254
  le w\u00f2 nunya kple w\u00f2 kesin\u0254nuwo \u014bu mese la ta s\u00e3s\u00e3s\u00e3.\\n8
  Dzidz\u0254t\u0254woe nye w\u00f2 amewo, eye dzidz\u0254t\u0254woe nye w\u00f2 sub\u0254vi
  siwo le tsitre \u0256e \u014bkuw\u00f2me \u0256aa hesea w\u00f2 nunya!\\n9 Woakafu
  Afet\u0254, w\u00f2 Mawu, ame si \u014bu w\u00f2 nu nyo, eye w\u00f2ts\u0254 w\u00f2
  \u0256o Israel fe fiazikpui dzi. Esi Afet\u0254 ts\u0254 l\u0254l\u0254\u0303 mav\u0254
  l\u0254\u0303 Israel ta la, eya tae w\u00f2\u0256o w\u00f2 fiae be n\u00e0dr\u0254\u0303
  \u028b\u0254nu ahatso afia le dz\u0254dz\u0254enyenye me.\u201d\\n10 Eye w\u00f2ts\u0254
  sika talento alafa \u0256eka blaeve, balsam-mi gbogbo a\u0256e kple kpe x\u0254asiwo
  na fia la. Womegats\u0254 balsam-mi ma t\u0254gbi v\u025b w\u00f2s\u0254 gb\u0254
  de esi Seba-fiany\u0254nua na Fia Salomo la nu kp\u0254 o.\\n11 Hiram fe t\u0254dzi\u028bu
  siwo ts\u0254a sika tso Ofir la h\u00e3 ts\u0254 papawuti ge\u0256e \u014but\u0254
  kple kpe x\u0254asiwo tso Ofir v\u025b.\\n12 Eye fia la ts\u0254 papawutiawo w\u0254
  s\u0254tiwo na Afet\u0254 fe x\u0254 kple fia fe x\u0254 la, ets\u0254 wo w\u0254
  sa\u014bkuwo kple kasa\u014bkuwo h\u00e3 na hadzilawo. Womegats\u0254 papawuti siawo
  gbegbe v\u025b kp\u0254 o, eye womegakp\u0254 wo t\u0254gbi kp\u0254 va se \u0256e
  egbe sia o.\\n13 Fia Salomo h\u00e3 ts\u0254 nu sia nu si Seba-fiany\u0254nu la
  di kple nu siwo kat\u00e3 w\u00f2biae la n\u025b, kpe \u0256e nu siwo Fia Salomo
  \u014but\u0254 nyo d\u0254me ts\u0254 n\u025b la \u014buti. Emegbe eya kple e\u014bumewo
  gbugb\u0254 yi efe anyigba dzi.\\n14 Sika si vana na Salomo le fe \u0256eka me la
  fe kpekpeme le talento alafa ade blaade v\u0254 ade,\\n15 ke esiwo tso asitsala
  g\u00e3wo gb\u0254 kple vi\u0256e si wokp\u0254na tso nudzralawo kple Arabiat\u0254wo
  fe fiawo kat\u00e3 kpakple nutodzi\u0256ula siwo le anyigba la dzi gb\u0254 ya mele
  eme o.\\n16 Eye Fia Salomo ts\u0254 sika si wots\u0254 ga bubu tsakae la w\u0254
  akpox\u0254nu g\u00e3 alafa eve (sika sekel alafa ade ye wots\u0254 w\u0254 akpox\u0254nu
  g\u00e3 \u0256e sia \u0256e)\\n17 eye w\u00f2ts\u0254 sika si wots\u0254 ga bubu
  tsakae la w\u0254 akpox\u0254nu sue alafa et\u0254\u0303 (sika mina et\u0254\u0303
  ye wots\u0254 w\u0254 akpox\u0254nu sue \u0256e sia \u0256e). Eye fia la ts\u0254
  wo da \u0256e Lebanon \u0191e Avex\u0254 la me.\\n18 Az\u0254 h\u00e3, fia la ts\u0254
  nyi\u0256u w\u0254 fiazikpui g\u00e3 a\u0256e, eye w\u00f2fa sika nyuit\u0254 \u0256e
  e\u014bu.\\n19 Atrakpui ade le fiazikpui la \u014bu, eye wogba fiazikpui la tame
  kotoo le emegbe, ab\u0254\u0256ofe le fiazikpui la fe axawo kple eve, eye wow\u0254
  dzata eve \u0256e ab\u0254\u0256ofeawo xa.\\n20 Dzata wuieve le atrakpui adeawo
  dzi, \u0256eka le atrakpui \u0256e sia \u0256e fe axa si kple axa kem\u025b. Womew\u0254
  esia t\u0254gbi le fia\u0256ufe bubu a\u0256eke me kp\u0254 o.\\n21 Sikae wots\u0254
  w\u0254 Fia Salomo fe kpluwo kat\u00e3, eye sika nyuit\u0254e wots\u0254 w\u0254
  agba siwo kat\u00e3 le Lebanon \u0191e Avex\u0254 la me. Klosalonu a\u0256eke men\u0254
  anyi o, elabena le Salomo fe \u014bkekeawo me la, womebu klosalo \u0256e naneke
  me o.\\n22 Elabena Tarsis t\u0254dzi\u028buwo le fia la si le fu dzi kpe \u0256e
  Hiram fe t\u0254dzi\u028buwo \u014bu. Tarsis t\u0254dzi\u028buwo ts\u0254a sika,
  klosalo, nyi\u0256u, kesewo kple atsrimawo van\u025b zi \u0256eka le fe et\u0254\u0303
  me.\\n23 Ale Fia Salomo fe kesin\u0254nuwo kple nunya fo anyigbadzifia bubuwo kat\u00e3
  t\u0254 ta.\\n24 Eye anyigbadzit\u0254wo kat\u00e3 yia Salomo gb\u0254 be yewoase
  nunya si Mawu de dzi me n\u025b la.\\n25 Wo domet\u0254 \u0256e sia \u0256e ts\u0254a
  nunana siwo nye klosalonuwo, sikanuwo, awuwo, a\u028baw\u0254nuwo, balsam-mi, s\u0254wo
  kple tedzis\u0254wo vana n\u025b fe sia fe.\\n26 Eye Salomo fo tasia\u0256amwo kple
  s\u0254 ge\u0256ewo nu fu; eye tasia\u0256am akpe \u0256eka alafa ene kple s\u0254
  akpe wuieve n\u0254 esi, eye w\u00f2da wo \u0256e tasia\u0256amduwo me le tefe si
  gogo fia la le Yerusalem.\\n27 Fia la na klosalo b\u0254 \u0256e Yerusalem abe kpe
  ene, eye w\u00f2na sederti s\u0254 gb\u0254 ta\u014bta\u014b abe gboti siwo le Sefela
  ene.\\n28 Wokpl\u0254a s\u0254wo tso Egipte van\u025b na Salomo, eye fia la fe asihawo
  yina \u0256aflea s\u0254awo kple ga.\\n29 Tasia\u0256am \u0256e sia \u0256e si tso
  Egipte la x\u0254a klosalo alafa ade, eye s\u0254 \u0256eka x\u0254a klosalo alafa
  \u0256eka blaat\u0254\u0303; eye fia fe asitsalawo dzie Hitit\u0254wo fe fiawo kat\u00e3
  kple Siria-fiawo h\u00e3 tona flea wo.\\n1 FIAWO 11\\n1 Ke Fia Salomo l\u0254\u0303
  dutany\u0254nu ge\u0256ewo hekpe \u0256e Farao viny\u0254nu la \u014bu; eye ny\u0254nu
  siawo tso Moab, Amon, Edom, Sidon kple Het.\\n2 Wotso duk\u0254 siwo \u014bu Afet\u0254
  gbl\u0254 le na Israel-viwo be: \u201cMigayi wo dome o, eye woawo h\u00e3 nagava
  mia dome o; elabena woava tr\u0254 miafe dzi miadze wofe mawuwo yome\u201d la me.
  Ke Salomo ku \u0256e wo \u014bu, eye w\u00f2l\u0254\u0303 wo.\\n3 E\u0256e sr\u0254\u0303
  alafa adre siwo nye fia sr\u0254\u0303wo, eye efe ahi\u00e3wo le alafa et\u0254\u0303,
  eye \u028b\u025b\u028b\u025b\u028b\u025b la, sr\u0254\u0303awo tr\u0254 efe dzi.\\n4
  Esime Salomo tsi ku ameg\u00e3 la, sr\u0254\u0303awo tr\u0254 efe dzi w\u00f2dze
  mawu bubuwo yome, eye efe dzi meku \u0256e Afet\u0254 efe Mawu la \u014bu bliboe
  abe fofoa David fe dzi ene o.\\n5 Salomo dze Sidont\u0254wo fe mawun\u0254 Astoret
  kple Amonit\u0254wo fe mawu ny\u0254\u014bu Milkom yome.\\n6 Eye Salomo w\u0254
  nu si nye v\u0254\u0303 le Afet\u0254 \u014bkume, eye medze Afet\u0254 yome bliboe
  abe fofoa David ene o.\\n7 \u0194ema\u0263ie Salomo tu nuxefe na Kemos, si nye Moabt\u0254wo
  fe mawu ny\u0254\u014bu la, \u0256e to si dze \u014bg\u0254 Yerusalem la dzi, eye
  w\u00f2tui na Molek, si nye Amonit\u0254wo fe mawu ny\u0254\u014bu la h\u00e3.\\n8
  Aleae w\u00f2w\u0254 na dutany\u0254nu siwo kat\u00e3 w\u00f2\u0256e, siwo doa dzudz\u0254
  hesaa v\u0254 na wofe mawuwo la h\u00e3.\\n9 Eye dzi ku Afet\u0254 \u0256e Salomo
  \u014bu, elabena efe dzi tr\u0254 le Afet\u0254, Israel fe Mawu, ame si \u0256e
  e\u0256okui fiae zi eve la yome,\\n10 ev\u0254 w\u00f2nye ede se n\u025b le nu siawo
  \u014bu, be w\u00f2agadze mawu bubuwo yome o hafi. Gake mew\u0254 nu si fe se Afet\u0254
  de la o.\\n11 Eye Afet\u0254 gbl\u0254 na Salomo be: \u201cEsi n\u00e8w\u0254 nu
  sia, eye m\u00e8l\u00e9 nye nubabla kple nye se siwo mede na w\u00f2 la me \u0256e
  asi o ta la, madu fia\u0256ufe la le asiw\u00f2 ats\u0254 na w\u00f2 d\u0254lawo
  domet\u0254 \u0256eka.\\n12 Ke le fofow\u00f2 David ta nyemaw\u0254e le w\u00f2
  agben\u0254\u0263i o. Madui le viw\u00f2 si,\\n13 ke nyemele fia\u0256ufe blibo
  la kat\u00e3 du ge le esi o. Mats\u0254 to \u0256eka ana viw\u00f2 le nye sub\u0254la
  David kple Yerusalem si metia la ta.\u201d\\n14 Eye Afet\u0254 \u0256o tsitretsi\u0256e\u014bula
  a\u0256e \u0256e Salomo \u014bu, si nye Edomt\u0254 Hadad, si tso Edomt\u0254wo
  fe fiafome me.\\n15 Esi David \u0256u Edom dzi la, a\u028bafia Yoab yi be yea\u0256i
  ame tsia\u028bawo, eye w\u00f2wu \u014butsuwo kat\u00e3 le Edom.\\n16 (Elabena Yoab
  kple Israel blibo la kat\u00e3 n\u0254 afi ma \u0263leti ade va se \u0256e esime
  w\u00f2wu \u014butsuwo kat\u00e3 le Edom.)\\n17 Ke Hadad kple Edom \u014butsu siwo
  nye fofoa fe sub\u0254vi a\u0256ewo si yi Egipte; \u0263ema\u0263i la, Hadad nye
  \u0256evi dzaa ko.\\n18 Wodze m\u0254 tso Midian va Paran. Eye wokpl\u0254 \u014butsuwo
  \u0256e asi tso Paran va Egipte le Egipte-fia Farao gb\u0254, eye w\u00f2na afee,
  az\u0254 h\u00e3, ena nu\u0256u\u0256ui, eye w\u00f2na anyigbae.\\n19 Farao ve Hadad
  nu ale gbegbe be w\u00f2ts\u0254 eya \u014but\u0254 sr\u0254\u0303a, si nye fiasr\u0254\u0303
  Tahpenes n\u0254viny\u0254nu n\u025b w\u00f2\u0256e.\\n20 Emegbe Tahpenes n\u0254viny\u0254nu
  la dzi Genubat n\u025b, eye Tahpenes nyii le Farao fe me; eye Genubat n\u0254 Farao
  fe me le Farao vi\u014butsuwo dome.\\n21 Hadad se le Egipte be wots\u0254 David
  ml\u0254 t\u0254gbuiawo gb\u0254, eye be a\u028bafia Yoab h\u00e3 ku. Eya ta Hadad
  gbl\u0254 na Farao be: \u201cDo m\u0254m, ne mayi nye \u014but\u0254 nye anyigba
  dzi.\u201d\\n22 Ke Farao biae be: \u201cNu kae le hi\u00e3w\u00f2m le gb\u0254nye
  hafi n\u00e8di be yeadzo ayi w\u00f2 \u014but\u0254 w\u00f2 anyigba dzi?\u201d E\u0256o
  e\u014bu be: \u201cNaneke mehi\u00e3m o; gake me\u0256e kuku do m\u0254m ko.\u201d\\n23
  Mawu ga\u0256o tsitretsi\u0256e\u014bula bubu \u0256e Salomo \u014bu, si nye Rezon,
  Eliyada vi, si si le efe afet\u0254 Zoba-fia Hadadezer gb\u0254.\\n24 Efo amewo
  nu fu \u0256e e\u0256okui \u014bu hezu adzoha a\u0256e fe tat\u0254 esime David
  \u0256u Zobat\u0254wo dzi. Ml\u0254eba la wo\u028bu yi Damasko \u0256an\u0254 afi
  ma, eye w\u00f2zu fia le Damasko.\\n25 Eye Rezon va zu tsitretsi\u0256e\u014bula
  \u0256e Israel \u014bu le Salomo fe agbeme\u014bkekewo kat\u00e3 me ts\u0254 kpe
  \u0256e v\u0254\u0303 si Hadad n\u0254 Israel w\u0254m la \u014bu, Rezon l\u00e9
  fu Israel vevie esime w\u00f2n\u0254 fia \u0256um \u0256e Siria dzi.\\n26 Ame bubu
  h\u00e3e nye Yeroboam, Nebat vi, Efrayimt\u0254 si tso Zereda, eye w\u00f2nye Salomo
  fe d\u0254la; dadaa \u014bk\u0254e nye Zerua si nye ahosi a\u0256e. Eya h\u00e3
  dze agl\u00e3 \u0256e fia la \u014bu.\\n27 Nu si ta w\u00f2dze agl\u00e3 \u0256e
  fia la \u014bue nye esi: Salomo tu Kpo la, eye w\u00f2dzra fofoa David \u0191e Du
  la fe gliwo \u0256o.\\n28 Ke Yeroboam nye d\u0254w\u0254la vevi a\u0256e. Esi Salomo
  kp\u0254 be \u0256ekakpui la doa vevie d\u0254 la, ets\u0254e \u0256o d\u0254 ses\u1ebd
  siwo kat\u00e3 Yosef fe afe la w\u0254na la dzi kp\u0254lae.\\n29 \u0194ema\u0263i
  la, Yeroboam tso Yerusalem yina, eye nyagbl\u0254\u0256ila Ahiya, Silot\u0254 la,
  do goe le m\u0254a dzi. Ahiya do awu yeye a\u0256e, eye wo ame evea \u0256e\u0256e
  le gbea me.\\n30 Eye Ahiya l\u00e9 awu yeye si le e\u014bu la, eye w\u00f2dzee \u0256e
  akpa wuieve me.\\n31 Eye w\u00f2gbl\u0254 na Yeroboam be:\\n\u201cL\u0254 akpa ewo
  na \u0256okuiw\u00f2, elabena ale Afet\u0254, Israel fe Mawu la, gbl\u0254e nye
  esi: \u2018Kp\u0254 \u0256a, mele fia\u0256ufe la dum le Salomo si, eye mats\u0254
  to ewo ana w\u00f2.\\n32 Ke to \u0256eka akp\u0254t\u0254 n\u025b le nye sub\u0254la
  David kple Yerusalem, si nye du si metia le Israel-toawo kat\u00e3 dome la ta.\\n33
  Maw\u0254 esia elabena wogbl\u1ebdm \u0256i, eye wole ta dem agu na Sidont\u0254wo
  fe mawun\u0254 Astoret, kple Moabt\u0254wo fe mawu Kemos kpakple Amonit\u0254wo
  fe mawu Milkom, eye womez\u0254 le nye m\u0254wo dzi, be woaw\u0254 nu si le dz\u0254dz\u0254e
  le \u014bkunyeme, eye woaw\u0254 nye sewo kple nye \u028b\u0254nudr\u0254\u0303\u0256o\u0256owo
  dzi abe Salomo fofo David ene o.\\n34 Ke nyemax\u0254 fia\u0256ufe blibo la kat\u00e3
  le esi o, ma\u0256oe ameg\u00e3e le efe agbeme\u014bkekewo kat\u00e3 me, le nye
  sub\u0254la David si metia la ta, elabena ew\u0254 nye sededewo kple nye \u0256o\u0256owo
  dzi.\\n35 Ke max\u0254 fia\u0256u\u0256ua le via si, eye mats\u0254 to ewo s\u0254\u014b
  ana w\u00f2.\\n36 Mats\u0254 to \u0256eka ana via, ne aka\u0256i nakp\u0254t\u0254
  na nye sub\u0254la David \u0256aa le \u014bkunyeme le Yerusalem, du si metia na
  \u0256okuinye be mats\u0254 nye \u014bk\u0254 a\u0256o afi ma la ta.\\n37 Ma\u0256o
  w\u00f2 be n\u00e0\u0256u fia \u0256e nu siwo kat\u00e3 dzro w\u00f2 la dzi, eye
  \u00e0zu fia \u0256e Israel dzi.\\n38 Eye ne \u00e8w\u0254 nu siwo kat\u00e3 fe
  se mede na w\u00f2 la dzi hez\u0254 le nye m\u0254wo dzi, eye n\u00e8w\u0254 nu
  si le dz\u0254dz\u0254e le \u014bkunyeme hew\u0254 nye \u0256o\u0256owo kple nye
  sededewo dzi, abe ale si tututu nye sub\u0254la David w\u0254e ene la, ekema nye
  h\u00e3 man\u0254 kpli w\u00f2. Matso afe si an\u0254 anyi \u0256aa la na w\u00f2,
  abe ale si tututu metsoe na David ene, eye mats\u0254 Israel ana w\u00f2.\\n39 Mab\u0254b\u0254
  David fe dzidzimeviwo \u0256e anyi le wofe nu v\u0254\u0303\u0256i w\u0254w\u0254
  ta, ke manye tegbetegbee o.\u2019\u201d\\n40 Ke Salomo di be yeawu Yeroboam. Eya
  ta Yeroboam si yi Egipte-fia Sisak gb\u0254 le Egipte, eye w\u00f2n\u0254 Egipte
  va se \u0256e esime Salomo ku.\\n41 Salomo fe \u014butinya sus\u0254eawo, nu siwo
  kat\u00e3 w\u00f2w\u0254 hekpe \u0256e efe nunya \u014bu la, wo\u014bl\u0254 wo
  \u0256e Salomo fe \u014butinyagbal\u1ebd me.\\n42 Eye \u014bkeke siwo Salomo \u0256u
  fia le Yerusalem \u0256e Israel blibo la dzi la le fe blaene.\\n43 Eye wots\u0254
  Salomo ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e fofoa David \u0191e
  Du la me; eye via Rehabeam zu fia \u0256e etefe.\\n1 FIAWO 12\\n1 Rehabeam yi Sekem,
  elabena Israel blibo la va Sekem be yewoa\u0256oe fiae.\\n2 Esi Yeroboam, Nebat
  vi see (egan\u0254 Egipte elabena esi le Fia Salomo nu \u0256an\u0254 Egipte) la,\\n3
  wod\u0254 ame wo\u0256akpl\u0254e gb\u0254e. Emegbe Yeroboam kple Israel fe ha blibo
  la va Rehabeam gb\u0254 eye wogbl\u0254 n\u025b be:\\n4 \u201cFofow\u00f2 na m\u00edafe
  k\u0254kuti la kpe. Gake ne \u00e8na fofow\u00f2 fe d\u0254 ses\u1ebd kple k\u0254kuti
  kpekpe si w\u00f2\u0256o m\u00eda dzi la dzi \u0256e kp\u0254t\u0254 la, ekema m\u00edasub\u0254
  w\u00f2.\u201d\\n5 Eye w\u00f2\u0256o e\u014bu na wo be: \u201cMiyi miatr\u0254
  ava gb\u0254nye le \u014bkeke et\u0254\u0303 megbe.\u201d Ale duk\u0254 la dzo.\\n6
  Eye Fia Rehabeam de ada\u014bu kple ame tsitsi siwo n\u0254 fofoa Salomo \u014bu
  le efe agben\u0254\u0263i, gbl\u0254 be: \u201cA\u0256a\u014bu kae mia\u0256o be
  mats\u0254 a\u0256o nya \u014bu na duk\u0254 sia?\u201d\\n7 Wo\u0256o e\u014bu n\u025b
  be: \u201cNe \u00e8zu duk\u0254 sia fe d\u0254la egbea, eye n\u00e8w\u0254 nu si
  wobia w\u00f2 la dzi na wo, eye n\u00e8na \u014bu\u0256o\u0256o nyui a\u0256e wo
  la, ekema woasub\u0254 w\u00f2 \u0256aa.\u201d\\n8 Ke egbe a\u0256a\u014bu si ame
  tsitsiawo \u0256o n\u025b la, eye w\u00f2yi \u0256ade ada\u014bu kple \u0256ekakpui
  siwo nye ehati, siwo n\u0254a e\u014bu.\\n9 Eye w\u00f2bia wo be: \u201cA\u0256a\u014bu
  kae mia\u0256o be m\u00edats\u0254 a\u0256o nya \u014bu na duk\u0254 sia si gbl\u0254
  nam be: \u2018Na k\u0254kuti si fofow\u00f2 ts\u0254 \u0256o m\u00eda dzi la nan\u0254
  wodzoe na m\u00ed\u2019?\u201d\\n10 \u00d0ekakpui siwo nye ehatiwo la gbl\u0254
  n\u025b be: \u201cAle n\u00e0gbl\u0254 na duk\u0254 sia si gbl\u0254 na w\u00f2
  be, \u2018Fofow\u00f2 na m\u00edafe k\u0254kuti la kpe, ke w\u00f2 la, na w\u00f2an\u0254
  wodzoe na m\u00ed\u2019 lae nye esi: \u2018Nye asibid\u025b k\u0254toet\u0254 atri
  wu fofonye fe ali.\\n11 Fofonye ts\u0254 k\u0254kuti kpekpe \u0256o mia dzi, ke
  nye la, mana miafe k\u0254kuti la nakpe \u0256e edzi. Fofonye ts\u0254 atam fo mi,
  ke nye la, mats\u0254 atam si \u014bu nu t\u0254amewo le la afo mi.\u2019\u201d\\n12
  Eye Yeroboam kple duk\u0254 blibo la va Rehabeam gb\u0254 le \u014bkeke et\u0254\u0303a
  gbe, abe ale si fia la gbl\u0254 ene be: \u201cMitr\u0254 va gb\u0254nye le \u014bkeke
  et\u0254\u0303a gbe.\u201d\\n13 Eye fia la \u0256o nya \u014bu na duk\u0254 la kple
  ad\u00e3, eye w\u00f2gbe a\u0256a\u014bu si ame tsitsiawo \u0256o la.\\n14 Eye w\u00f2gbl\u0254
  na wo le \u0256ekakpuiawo fe a\u0256a\u014bu\u0256o\u0256o nu be: \u201cFofonye
  na miafe k\u0254kuti kpe, ke nye la, mana miafe k\u0254kuti la nakpe \u0256e edzi.
  Fofonye ts\u0254 atam fo mi, ke nye la, mats\u0254 atam si \u014bu nu t\u0254amewo
  le la afo mi.\u201d\\n15 Ale fia la me\u0256o to duk\u0254 la o, elabena Afet\u0254
  gb\u0254e w\u00f2tso be nyawo tr\u0254 alea, ne Afet\u0254 fe nya si w\u00f2gbl\u0254
  to Ahiya, Silot\u0254 la dzi na Yeroboam, Nebat vi la nava eme.\\n16 Esi Israel
  blibo la kp\u0254e be fia la me\u0256o to yewo o la, duk\u0254 la gbl\u0254 na fia
  la be: \u201cGome kae le David gb\u0254 na m\u00ed? Domenyinu a\u0256eke mele Isai
  vi la gb\u0254 na m\u00ed o. Oo Israel, yi w\u00f2 mawuwo gb\u0254. Az\u0254, David,
  kp\u0254 w\u00f2 afe gb\u0254!\u201d Ale Israel tr\u0254 yi wofe afewo me.\\n17
  Ke Rehabeam \u0256u fia \u0256e Israel-vi siwo le Yuda duwo me la dzi.\\n18 Emegbe
  Fia Rehabeam d\u0254 Adoram, si le dzizizid\u0254w\u0254lawo nu la \u0256a, ke Israel
  blibo la fu kpee w\u00f2ku. Ale Fia Rehabeam ge \u0256e efe tasia\u0256am me si
  yi Yerusalem.\\n19 Eye Israel-viwo dze agl\u00e3 \u0256e David fe afe la \u014bu
  va se \u0256e egbe sia.\\n20 Esi Israel blibo la nya se be Yeroboam tr\u0254 gb\u0254
  ko la, enumake wod\u0254 ame woyi \u0256ay\u0254e va ha la gb\u0254, eye wo\u0256oe
  fia \u0256e Israel blibo la nu. Ame a\u0256eke medze David fe afe la yome o, negbe
  Yuda-to la \u0256e\u0256e ko.\\n21 Esi Rehabeam va \u0256o Yerusalem la, enumake
  efo Yuda fe afe blibo la kat\u00e3 kple Benyamin-to la nu fu, wole a\u028baw\u0254la
  bibi akpe alafa \u0256eka blaenyi, be woaw\u0254 a\u028ba kple Israel fe afe la,
  ne woagbugb\u0254 fia\u0256ufe la ana Salomo vi Rehabeam.\\n22 Eye Mawu vav\u00e3
  la fe gbe va na Mawu vav\u00e3 la fe ame Semaya be:\\n23 \u201cGbl\u0254 na Rehabeam,
  Salomo vi, si nye Yuda-fia kple Yuda fe afe blibo la kat\u00e3 kple Benyamin kpakple
  duk\u0254 la me t\u0254 sus\u0254eawo be,\\n24 \u2018Ale Afet\u0254 gbl\u0254e nye
  esi: \u201cMigaho yi \u0256aw\u0254 a\u028ba kple mia n\u0254vi Israel-viwo o. Mia
  domet\u0254 \u0256e sia \u0256e negbugb\u0254 yi afe me, elabena gb\u0254nye w\u00f2tso
  be nu sia dz\u0254.\u201d\u2019\u201d Eya ta wow\u0254 \u0256e Afet\u0254 fe nya
  la dzi, eye wogbugb\u0254 yi wofe afewo me abe ale si Afet\u0254 gbl\u0254 na wo
  ene.\\n25 Eye Yeroboam gbugb\u0254 Sekem du la tso le Efrayim tonuto la me hen\u0254
  eme. Etso le afi ma yi \u0256agbugb\u0254 Penuel h\u00e3 tso.\\n26 Eye Yeroboam
  gbl\u0254 le efe dzi me be: \u201cAz\u0254 fia\u0256ufe la atr\u0254 ayi David fe
  me.\\n27 Ne duk\u0254 sia kp\u0254t\u0254 le Yerusalem yim be woa\u0256asa v\u0254
  le Afet\u0254 fe me la, ekema duk\u0254 sia fe dzi ava tr\u0254 \u0256e wofe afet\u0254
  Yuda-fia Rehabeam \u014bu. Woawum ahatr\u0254 ayi Yuda-fia Rehabeam gb\u0254.\u201d\\n28
  Eya ta fia la de ada\u014bu hew\u0254 sikanyivi eve, eye w\u00f2gbl\u0254 na duk\u0254
  la be: \u201cYerusalem yiyi ses\u1ebd na mi akpa. Oo Israel, w\u00f2 Mawu si kpl\u0254
  w\u00f2 tso Egipte-nyigba dzie nye esi.\u201d\\n29 Ets\u0254 sikanyivia \u0256eka
  \u0256o Betel, eye w\u00f2ts\u0254 evelia \u0256o Dan.\\n30 Eye nu sia kpl\u0254
  wo de nu v\u0254\u0303 me, eye duk\u0254 la yia keke Dan ke \u0256adea ta agu.\\n31
  Etu tadeagufewo \u0256e nuxefewo, eye w\u00f2ts\u0254 ame siwo menye Lewi viwo o
  la \u0256o nun\u0254lawoe.\\n32 Eye Yeroboam \u0256o \u014bkekenyui anyi \u0256e
  \u0263leti enyilia fe \u014bkeke wuiat\u0254\u0303lia dzi, abe ale si wo\u0256ua
  \u014bkekenyui le Yuda ene. Esa v\u0254 le v\u0254samlekpui si w\u00f2\u0256i \u0256e
  Betel la dzi na nyivi siwo w\u00f2w\u0254, eye w\u00f2\u0256o nuxefe si w\u00f2w\u0254
  la fe nun\u0254lawo be woasub\u0254 le Betel.\\n33 Eye w\u00f2sa v\u0254 le v\u0254samlekpui
  si w\u00f2\u0256i \u0256e Betel la dzi le \u0263leti enyilia fe \u014bkeke wuiat\u0254\u0303lia
  dzi, le \u0263leti si eya \u014but\u0254 tia la me; e\u0256o \u014bkekenyui na Israel-viwo,
  eye w\u00f2sa v\u0254 le v\u0254samlekpui la dzi, be yeado dzudz\u0254.\\n1 FIAWO
  13\\n1 Esime Yeroboam tsi tsitre \u0256e v\u0254samlekpui la gb\u0254 be yeado dzudz\u0254
  la, kp\u0254 \u0256a, Mawu fe ame a\u0256e tso Yuda va Betel le Afet\u0254 fe nya
  nu.\\n2 Eye w\u00f2do \u0263li \u0256e v\u0254samlekpui la ta le Afet\u0254 fe nya
  nu gbl\u0254 be: \u201cOo v\u0254samlekpui, v\u0254samlekpui! Ale Afet\u0254 gbl\u0254e
  nye esi: \u2018Kp\u0254 \u0256a! Wole \u014butsuvi a\u0256e dzi ge le David fe afe
  la me, si \u014bk\u0254 anye Yosiya! Ats\u0254 nuxefe fe nun\u0254la siwo le dzudz\u0254
  dom \u0256e dziw\u00f2 la asa v\u0254 \u0256e dziw\u00f2, eye w\u00f2at\u0254 dzo
  amefuwo \u0256e dziw\u00f2.\u2019\u201d\\n3 Eye w\u00f2w\u0254 dzesi gbe ma gbe
  gbl\u0254 be: \u201cDzesi si Afet\u0254 gbl\u0254e nye esi: Kp\u0254 \u0256a! V\u0254samlekpui
  la afe, eye dzofi siwo le edzi la akaka \u0256i.\u201d\\n4 Esi fia la nya se Mawu
  vav\u00e3 la fe ame la fe nya si w\u00f2do \u0263li gbl\u0254 \u0256e v\u0254samlekpuia
  \u014bu le Betel ko la, Yeroboam do asi \u0256a tso v\u0254samlekpuia dzi gbl\u0254
  be: \u201cMil\u00e9e!\u201d Enumake efe asi si w\u00f2do \u0256e egb\u0254 la dze
  ti, eye megate \u014bu hee \u0256e e\u0256okui \u014bu o.\\n5 V\u0254samlekpui la
  fe, eye dzofi kaka tso v\u0254samlekpui la dzi, le Mawu vav\u00e3 la fe ame la fe
  dzesi si w\u00f2gbl\u0254 le Afet\u0254 fe nya nu la nu.\\n6 Az\u0254 fia la gbl\u0254
  na Mawu vav\u00e3 la fe ame la be: \u201cMe\u0256e kuku, fo koko na Afet\u0254 w\u00f2
  Mawu be w\u00f2ave nunye, eye n\u00e0do gbe \u0256a \u0256e tanye, ne nye asi la
  naga\u0256\u0254 \u0256o nam.\u201d Eye Mawu vav\u00e3 fe ame la fo koko na Afet\u0254
  be w\u00f2ave enu, ale fia la fe asi la ga\u0256\u0254 \u0256o abe ts\u00e3 ene.\\n7
  Az\u0254 fia la gbl\u0254 na Mawu vav\u00e3 fe ame la be: \u201cVa m\u00edyi afe
  me, ne n\u00e0\u0256u nu, ne madi nane ana w\u00f2.\u201d\\n8 Ke Mawu vav\u00e3
  fe ame la gbl\u0254 na fia la be: \u201cNe \u00e8ts\u0254 w\u00f2 afe la fe af\u00e3
  nam h\u00e3 la, nyemayi kpli w\u00f2 o, eye nyema\u0256u abolo alo ano tsi le tefe
  sia o.\\n9 Elabena ale w\u00f2de se nam le Afet\u0254 fe nya nue nye esi: \u2018M\u00e8ga\u0256u
  abolo o, m\u00e8gano tsi o, eye m\u00e8gagbugb\u0254 to m\u0254 si n\u00e8to va
  la o.\u2019\u201d\\n10 Ale w\u00f2to m\u0254 bubu dzo, eye megbugb\u0254 to m\u0254
  si w\u00f2to va Betel la o.\\n11 Ke nyagbl\u0254\u0256ila tsitsi a\u0256e le Betel,
  eye via\u014butsuwo va gbl\u0254 nu siwo kat\u00e3 Mawu vav\u00e3 fe ame la w\u0254
  gbe ma gbe le Betel, kple nya siwo w\u00f2gbl\u0254 na fia la na wo fofo. Esi wogbl\u0254
  nu si dz\u0254 na wo fofo la,\\n12 wo fofo bia wo be: \u201cM\u0254 kae w\u00f2to?\u201d
  Eye via\u014butsuawo fia m\u0254 si Mawu vav\u00e3 la fe ame si tso Yuda va la to
  lae.\\n13 Az\u0254 egbl\u0254 na viawo be: \u201cMibla akpa na tedzi nam.\u201d
  Ale wobla akpa na tedzi la n\u025b, eye w\u00f2de edzi.\\n14 Edze Mawu vav\u00e3
  fe ame la yome, eye w\u00f2va ke \u0256e e\u014bu w\u00f2b\u0254b\u0254 n\u0254
  anyi \u0256e ati g\u00e3 a\u0256e te. Eye w\u00f2biae be: \u201cW\u00f2e nye Mawu
  vav\u00e3 la fe ame si tso Yuda laa?\u201d E\u0256o e\u014bu be: \u201cNyee.\u201d\\n15
  Eye w\u00f2gbl\u0254 n\u025b be: \u201cVa m\u00edyi afe me, ne n\u00e0\u0256u nu.\u201d\\n16
  Ke egbl\u0254 be: \u201cNyemate \u014bu agbugb\u0254 ayi kpli w\u00f2 alo aw\u0254
  \u0256e w\u00f2 amekpekpea dzi o, eye nyemate \u014bu a\u0256u nu kpli w\u00f2 alo
  ano tsi le tefe sia o.\\n17 Elabena wogbl\u0254 nam le Afet\u0254 fe nya nu be:
  \u2018M\u00e8ga\u0256u abolo alo ano tsi le afi ma o. Eye m\u00e8gagbugb\u0254 to
  m\u0254 si n\u00e8to yi la o.\u2019\u201d\\n18 Eye w\u00f2gbl\u0254 n\u025b be:
  \u201cNye h\u00e3 nyagbl\u0254\u0256ila menye abe w\u00f2 ke ene, eye mawud\u0254la
  a\u0256e fo nu kplim le Afet\u0254 fe nya nu gbl\u0254 be, \u2018Yi \u0256agbugb\u0254e,
  ne w\u00f2 kplii miayi afew\u00f2 me, ne w\u00f2a\u0256u abolo ahano tsi.\u2019\u201d
  (\u00d0e w\u00f2blee.)\\n19 Ale w\u00f2gbugb\u0254 kplii, ne w\u00f2a\u0256u abolo
  ahano tsi le efe me.\\n20 Esime wole kpl\u0254\u0303 \u014bu la, Afet\u0254 fe gbe
  va na nyagbl\u0254\u0256ila si tr\u0254e gb\u0254e la,\\n21 eye w\u00f2do \u0263li
  gbl\u0254 na Mawu vav\u00e3 fe ame si tso Yuda la be, \u201cAle Afet\u0254 gbl\u0254e
  nye esi: \u2018Esi n\u00e8gbe Afet\u0254 fe sedede la dzi w\u0254w\u0254, eye m\u00e8l\u00e9
  se si Afet\u0254 w\u00f2 Mawu de na w\u00f2 la me \u0256e asi o,\\n22 ke bo\u014b
  n\u00e8tr\u0254, eye n\u00e8\u0256u abolo heno tsi le tefe si \u014bu w\u00f2gbl\u0254
  le na w\u00f2 be, \u201cM\u00e8ga\u0256u abolo alo ano tsi o\u201d ta la, w\u00f2
  kukua made t\u0254gbuiw\u00f2wo fe y\u0254do me o.\u2019\u201d\\n23 Esi Mawu vav\u00e3
  fe ame la \u0256u abolo eye w\u00f2no nu v\u0254 la, nyagbl\u0254\u0256ila tsitsi
  la bla akpa na tedzi la na nyagbl\u0254\u0256ila si w\u00f2tr\u0254 gb\u0254e la.\\n24
  Eye w\u00f2dze m\u0254, gake dzata a\u0256e va do goe le m\u0254a dzi hewui. Eye
  efe kukua tsi m\u0254a dzi, eye tedzi la t\u0254 \u0256e egb\u0254; dzata la h\u00e3
  t\u0254 \u0256e ame kukua gb\u0254.\\n25 Ame siwo va le yiyim la, kp\u0254 be ame
  ku \u0256e m\u0254a dzi, eye dzata t\u0254 \u0256e ame kukua gb\u0254. Eye wova
  gbl\u0254 e\u014bu nya le du si me nyagbl\u0254\u0256ila tsitsia le la me.\\n26
  Esi nyagbl\u0254\u0256ila si tr\u0254e gb\u0254e tso m\u0254a dzi la see la, enumake
  egbl\u0254 be: \u201cMawu vav\u00e3 fe ame si gbe Afet\u0254 fe se dzi w\u0254w\u0254
  lae; Afet\u0254 ts\u0254e de asi na dzata w\u00f2vuvui hewui, le Afet\u0254 fe nya
  si w\u00f2gbl\u0254 n\u025b la nu.\u201d\\n27 Eye w\u00f2gbl\u0254 na via\u014butsuawo
  be: \u201cMibla akpa na tedzi la nam.\u201d Ale wobla akpa n\u025b.\\n28 Eye w\u00f2dze
  m\u0254 yi heva ke \u0256e ame kukua \u014bu le m\u0254a dzi, eye tedzi la kple
  dzata la t\u0254 \u0256e ame kukua gb\u0254. Dzata la me\u0256u ame kuku la o, eye
  mevuvu tedzi la h\u00e3 o.\\n29 Eye nyagbl\u0254\u0256ila la k\u0254 Mawu vav\u00e3
  fe ame la fe kukua \u0256o tedzi la dzi, eye w\u00f2k\u0254e gb\u0254 va eya \u014but\u0254
  fe du me, be w\u00f2afae, eye w\u00f2a\u0256ii.\\n30 Ets\u0254 ame kuku la ml\u0254
  eya \u014but\u0254 fe y\u0254do me; eye w\u00f2fae vevie be: \u201cAo, n\u0254vinye!\u201d\\n31
  Eye esi w\u00f2\u0256ii v\u0254 la, egbl\u0254 na via\u014butsuawo be: \u201cNe
  meku la, mi\u0256im \u0256e afi si wo\u0256i Mawu vav\u00e3 fe ame la \u0256o. Eye
  mits\u0254 nye fuwo da \u0256e efe fuwo xa.\\n32 Elabena nya si w\u00f2gbl\u0254
  le Afet\u0254 fe nya nu \u0256e v\u0254samlekpui si le Betel kple tadeagufe siwo
  wotu \u0256e nuxefe siwo kat\u00e3 le Samaria duwo me \u014bu la, ava eme.\u201d\\n33
  Le nu sia megbe g\u0254\u0303 h\u00e3 la, Yeroboam metr\u0254 tso efe m\u0254 v\u0254\u0303
  la dzi o, ke bo\u014b ega\u0256oa ame sia ame fomevi nuxefewo fe nun\u0254lawoe.
  Ame sia ame si l\u0254\u0303 la, e\u0256on\u025b hegbl\u0254na be: \u201cNezu nuxefeawo
  fe nun\u0254lawo domet\u0254 \u0256eka.\u201d\\n34 Yeroboam fe afe la fe nu v\u0254\u0303
  sia na wotsr\u0254\u0303 wo \u0256a gbidigbidi le anyigba la dzi.\\n1 FIAWO 14\\n1
  \u0194ema\u0263i la, Yeroboam vi Abiya dze d\u0254.\\n2 Eya ta Yeroboam gbl\u0254
  na sr\u0254\u0303a be: \u201cMe\u0256e kuku, tso n\u00e0tr\u0254 w\u00f2 dzedzeme,
  ne woaganya be Yeroboam sr\u0254\u0303 n\u00e8nye o, eye n\u00e0yi Silo. Kp\u0254
  \u0256a! Afi mae nyagbl\u0254\u0256ila Ahiya le. Eyae gbl\u0254 nam be mazu fia
  \u0256e duk\u0254 sia dzi.\\n3 Ts\u0254 abolo ewo kple akp\u0254n\u0254 kpakple
  anyitsigoe \u0256eka \u0256e asi, ne n\u00e0yi egb\u0254. Agbl\u0254 nu si ava dz\u0254
  \u0256e \u0256evia dzi la na w\u00f2.\u201d\\n4 Yeroboam sr\u0254\u0303 w\u0254e
  nenema. Eye w\u00f2tso heyi Silo, eye w\u00f2va Ahiya fe me. Ke Ahiya megale nu
  kp\u0254m o, elabena efe \u014bkuwo tsi le esi w\u00f2ku ameg\u00e3 ta.\\n5 Gake
  Afet\u0254 gbl\u0254 na Ahiya be: \u201cKp\u0254 \u0256a, Yeroboam sr\u0254\u0303
  gb\u0254na gb\u0254w\u00f2 be yeabia nya w\u00f2 tso via \u014bu, elabena edze d\u0254.
  Magbl\u0254 nu si n\u00e0gbl\u0254 n\u025b la na w\u00f2. Ne eva la, aw\u0254 e\u0256okui
  ame tut\u0254e.\u201d\\n6 Esi Ahiya nya se efe af\u0254zi ko la, egbl\u0254 be:
  \u201cGe \u0256e eme, Yeroboam sr\u0254\u0303. Nu ka tae n\u00e8w\u0254 \u0256okuiw\u00f2
  ame tut\u0254e? Wode gbe ses\u1ebd a\u0256e asi nam be magbl\u0254 na w\u00f2.\\n7
  Yi \u0256agbl\u0254 na Yeroboam be, \u2018Ale Afet\u0254, Israel fe Mawu la, gbl\u0254e
  nye esi: \u201cMedo w\u00f2 \u0256e dzi le w\u00f2 duk\u0254 la dome hets\u0254
  w\u00f2 \u0256o fia \u0256e nye duk\u0254 Israel nu.\\n8 Eye medu fia\u0256ufe la
  le David fe afe la si hets\u0254 na w\u00f2. Ke m\u00e8le abe nye sub\u0254la David,
  ame si w\u0254 nye sededewo dzi, eye w\u00f2dze yonyeme kple efe dzi blibo hew\u0254
  nu dz\u0254dz\u0254e s\u0254\u014b le \u014bkunyeme la ene o.\\n9 Ke bo\u014b \u00e8w\u0254
  nu v\u0254\u0303\u0256i wu ame siwo kat\u00e3 do \u014bg\u0254 na w\u00f2, eye n\u00e8w\u0254
  mawu bubu na \u0256okuiw\u00f2 eye n\u00e8ts\u0254 ga w\u0254 legbawo be n\u00e0ts\u0254
  ado dziku nam, eye n\u00e8tr\u0254 megbe dem.\\n10 Eya ta kp\u0254 \u0256a, mehe
  v\u0254\u0303 gb\u0254na Yeroboam fe afe la dzi, eye matsr\u0254\u0303 Yeroboam
  fe \u014butsuwo kat\u00e3, matsr\u0254\u0303 ame siwo nye w\u0254naman\u0254\u014but\u0254wo
  kple ame beliwo g\u0254\u0303 h\u00e3 \u0256a le Israel, eye makpl\u0254 Yeroboam
  fe afe la fiafiafia, abe ale si wokpl\u0254a m\u0129 \u0256a ke\u014bke\u014b ene.\\n11
  Yeroboam fe ame si aku \u0256e du me la, avuwo a\u0256ui; eye efe ame si aku \u0256e
  gbe me la, dzifoxewo a\u0256ui, elabena Afet\u0254e gbl\u0254e.\u201d\u2019\\n12
  \u201cTso n\u00e0yi afew\u00f2 me. Ne w\u00f2 af\u0254 nya \u0256o dua me ko la,
  \u0256evi la aku.\\n13 Eye Israel blibo la afae aha\u0256ii, elabena eya koe nye
  Yeroboam fe ame si woa\u0256i \u0256e y\u0254do me; elabena eya \u0256e\u0256e ko
  \u014bue Afet\u0254, Israel fe Mawu la kp\u0254 nu nyui a\u0256e le le Yeroboam
  fe me.\\n14 Afet\u0254 a\u0256o fia na e\u0256okui \u0256e Israel nu, ame si atsr\u0254\u0303
  Yeroboam fe afe la \u0256a tso \u014bkeke ma dzi, \u025b\u0303, tso fifi kura g\u0254\u0303
  h\u00e3.\\n15 Afet\u0254 asi Israel, abe a\u0256a si ya \u028bu\u028buna le t\u0254
  me ene, eye w\u00f2aho Israel \u0256a le anyigba nyui sia si w\u00f2ts\u0254 na
  wo t\u0254gbuiwo la dzi, eye w\u00f2aka wo ahl\u1ebd \u0256e T\u0254sisi la godo,
  elabena wow\u0254 Aserawo ts\u0254 do dziku na Afet\u0254.\\n16 Eye w\u00f2agbe
  nu le Israel gb\u0254 le Yeroboam fe nu v\u0254\u0303 siwo w\u00f2w\u0254 eye w\u00f2na
  Israel w\u0254 nu v\u0254\u0303 ta.\u201d\\n17 Ale Yeroboam sr\u0254\u0303 tso dze
  m\u0254 va Tirza. Esi w\u00f2\u0256o afea fe kpui nu ko la, \u0256evi la ku.\\n18
  Eye wo\u0256ii, eye Israel blibo la kat\u00e3 fae, le Afet\u0254 fe nya si w\u00f2gbl\u0254
  to efe sub\u0254la nyagbl\u0254\u0256ila Ahiya dzi la nu.\\n19 Ke Yeroboam fe \u014butinya
  sus\u0254eawo, ale si w\u00f2w\u0254 a\u028ba kple ale si w\u00f2\u0256u fiae la,
  kp\u0254 \u0256a, wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd
  me.\\n20 \u0194eyi\u0263i si Yeroboam \u0256u fia la le fe blaeve v\u0254 eve; emegbe
  wots\u0254e ml\u0254 t\u0254gbuiawo gb\u0254; eye via Nadab zu fia \u0256e etefe.\\n21
  Ke Rehabeam, Salomo vi zu fia le Yuda. Rehabeam x\u0254 fe blaene v\u0254 \u0256ek\u025b
  esime w\u00f2zu fia, eye w\u00f2\u0256u fia fe wuiadre le Yerusalem, si nye du si
  Afet\u0254 tia le Israel-toawo kat\u00e3 me be yeats\u0254 yefe \u014bk\u0254 a\u0256o
  afi ma. Rehabeam dada \u014bk\u0254e nye Naama, eye w\u00f2nye Amoni-ny\u0254nu.\\n22
  Eye Yuda w\u0254 nu si nye v\u0254\u0303 le Afet\u0254 \u014bkume, eye wots\u0254
  wofe nu v\u0254\u0303 siwo wow\u0254 la do dziku n\u025b wu wo t\u0254gbuiwo.\\n23
  Woawo h\u00e3 w\u0254 nuxefewo, tr\u0254\u0303s\u0254tiwo kple Aserawo \u0256e togb\u025b
  k\u0254k\u0254wo kat\u00e3 dzi kple ati dama \u0256e sia \u0256e te.\\n24 \u014autsu
  siwo gb\u0254 \u014butsuwo d\u0254na le gbedox\u0254 me g\u0254\u0303 h\u00e3 le
  anyigba la dzi. Wow\u0254 nu \u0256e duk\u0254 siwo Afet\u0254 nya le Israel-viwo
  \u014bg\u0254 la fe \u014buny\u0254nuwo kat\u00e3 nu.\\n25 Le Fia Rehabeam fe fia\u0256u\u0256u
  fe fe at\u0254\u0303lia me la, Egipte-fia Sisak ho \u0256e Yerusalem \u014bu.\\n26
  Eye w\u00f2l\u0254 Afet\u0254 fe afe la me kesin\u0254nuwo kple fia la fe afe me
  kesin\u0254nuwo dzoe. El\u0254 nu sia nu dzoe hekpe \u0256e sikakpox\u0254nu siwo
  kat\u00e3 Salomo w\u0254 la \u014bu.\\n27 Eya ta Fia Rehabeam w\u0254 ak\u0254blikpox\u0254nuwo
  \u0256e wo tefe, eye w\u00f2ts\u0254 wo de dz\u0254lawo fe tat\u0254 si dz\u0254a
  fia fe agbo nu fe dzikp\u0254kp\u0254 te.\\n28 \u0194esia\u0263i si fia la yi Afet\u0254
  fe afe la me la, dz\u0254lawo ts\u0254a wo, eye wogbugb\u0254a wo va dana \u0256e
  dz\u0254lawo fe x\u0254 la me.\\n29 Ke Rehabeam \u014butinya sus\u0254eawo kple
  nu siwo kat\u00e3 w\u00f2w\u0254 la, wo\u014bl\u0254 wo \u0256e Yuda-fiawo fe \u014butinyagbal\u1ebd
  me.\\n30 A\u028ba n\u0254 Rehabeam kple Yeroboam dome \u0263eawokat\u00e3\u0263i.\\n31
  Eye wots\u0254 Rehabeam ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e t\u0254gbuiawo
  gb\u0254 le David \u0191e Du la me. Dadaa \u014bk\u0254e nye Naama, Amoni-ny\u0254nu.
  Eye Rehabeam vi Abiyam zu fia \u0256e etefe.\\n1 FIAWO 15\\n1 Le Fia Yeroboam, Nebat
  vi, fe fe wuienyilia me la, Abiyam zu fia \u0256e Yuda dzi.\\n2 E\u0256u fia le
  Yerusalem fe et\u0254\u0303. Dadaa \u014bk\u0254e nye Maaka, eye w\u00f2nye Abisalom
  t\u0254gbuiy\u0254vi.\\n3 Ew\u0254 nu v\u0254\u0303 siwo kat\u00e3 fofoa w\u0254
  do \u014bg\u0254 n\u025b la ke, eye efe dzi meku \u0256e Afet\u0254 efe Mawu la
  \u014bu bliboe, abe ale si t\u0254gbuia David fe dzi ku \u0256e e\u014bu ene o.\\n4
  Ke le David ta Afet\u0254 efe Mawu na aka\u0256ii le Yerusalem, esi w\u00f2\u0256o
  via \u0256e eyome, be w\u00f2al\u00e9 Yerusalem \u0256e te.\\n5 Elabena David w\u0254
  nu si le dz\u0254dz\u0254e le Afet\u0254 \u014bkume, eye mete \u0256a le nu siwo
  fe se Mawu de n\u025b le efe agbeme\u014bkekewo kat\u00e3 me la domet\u0254 a\u0256eke
  \u014bu o, negbe le Hitit\u0254 Uriya fe nya la me ko.\\n6 Eye a\u028ba n\u0254
  Rehabeam kple Yeroboam dome le efe agbeme\u014bkekewo kat\u00e3 me.\\n7 Ke Abiyam
  \u014butinya sus\u0254eawo kple nu siwo kat\u00e3 w\u00f2w\u0254 la, wo\u014bl\u0254
  wo \u0256e Yuda-fiawo fe \u014butinyagbal\u1ebd me. A\u028ba n\u0254 Abiyam kple
  Yeroboam h\u00e3 dome.\\n8 Eye wots\u0254 Abiyam ml\u0254 t\u0254gbuiawo gb\u0254,
  wo\u0256ii \u0256e David \u0191e Du la me; eye via Asa zu fia \u0256e etefe.\\n9
  Le Israel-fia Yeroboam fe fe blaevelia me la, Asa zu fia le Yuda.\\n10 E\u0256u
  fia fe blaene v\u0254 \u0256ek\u025b le Yerusalem. Mamaa \u014bk\u0254e nye Maaka,
  Abisalom t\u0254gbuiy\u0254vi.\\n11 Asa w\u0254 nu si le dz\u0254dz\u0254e le Afet\u0254
  \u014bkume, abe t\u0254gbuia David ene.\\n12 Enya \u014butsu siwo gb\u0254 \u014butsuwo
  d\u0254na le gbedox\u0254 me \u0256a le anyigba la dzi, eye w\u00f2\u0256e legba
  ny\u0254\u014bu siwo kat\u00e3 t\u0254gbuiawo w\u0254 la \u0256a.\\n13 E\u0256e
  mamaa Maaka g\u0254\u0303 h\u00e3 \u0256a be w\u00f2aganye ny\u0254nufia az\u0254
  o, elabena ew\u0254 legba ny\u0254\u014bu a\u0256e na Asera sub\u0254sub\u0254.
  Asa mu efe legba ny\u0254\u014bu la fu anyi het\u0254 dzoe le Kidron-t\u0254\u028bu
  la me.\\n14 Ke wome\u0256e nuxefeawo \u0256a o. Gake Asa fe dzi ku \u0256e Afet\u0254
  \u014bu bliboe le efe agbeme\u014bkekewo kat\u00e3 me.\\n15 Eye w\u00f2ts\u0254
  nu siwo \u014bu fofoa k\u0254 kple nu siwo \u014bu eya \u014but\u0254 k\u0254, siwo
  nye klosalo kple sika kpakple \u014bud\u0254w\u0254nuawo va Afet\u0254 fe afe la
  me.\\n16 A\u028ba n\u0254 Asa kple Israel-fia Baasa dome le wofe agbeme\u014bkekewo
  kat\u00e3 me.\\n17 Eye Israel-fia Baasa ho \u0256e Yuda \u014bu, eye w\u00f2keke
  Rama \u0256e nu ne w\u00f2axe m\u0254 be ame a\u0256eke nagado alo ava Yuda-fia
  Asa gb\u0254 o.\\n18 Eya ta Asa ts\u0254 klosalo kple sika siwo kat\u00e3 sus\u0254
  \u0256e Afet\u0254 fe afe la fe kesin\u0254nudzra\u0256ofe kple fia fe afe la fe
  kesin\u0254nudzra\u0256ofe de efe d\u0254lawo si. Eye Fia Asa d\u0254 wo \u0256e
  Ben-Hadad, Tabrimon vi, Hezion vi, si nye Siria-fia si le Damasko la gb\u0254 gbl\u0254
  be:\\n19 \u201cNubabla le nye kpli w\u00f2 dome, en\u0254 fofonye kple fofow\u00f2
  dome. Mele nunana si nye klosalo kple sika sia \u0256om \u0256e w\u00f2. Va gbl\u1ebd
  nu, si n\u00e8bla kple Israel-fia Baasa la me, ne w\u00f2aho adzo le gb\u0254nye.\u201d\\n20
  Eya ta Ben-Hadad \u0256o to Fia Asa, eye w\u00f2d\u0254 efe a\u028bak\u0254wo fe
  tat\u0254wo \u0256e Israel duwo \u014bu, eye woyi \u0256asi Iyon, Dan, Abel-Bet-Maaka
  kple Kineret blibo la kat\u00e3 hekpe \u0256e Naftali-nyigba blibo la \u014bu.\\n21
  Esi Baasa see la, enumake edzudz\u0254 Rama tsotso, eye w\u00f2yi \u0256an\u0254
  Tirza.\\n22 Ke Fia Asa y\u0254 Yuda blibo la kat\u00e3 fo fu\u2014ame a\u0256eke
  meto le eme o\u2014eye woyi \u0256af\u0254 kpe kple ati siwo Baasa ts\u0254 n\u0254
  Rama tsomee la; eye Fia Asa ts\u0254 wo tso Geba du si le Benyamin kple Mizpa.\\n23
  Asa \u014butinya sus\u0254eawo kat\u00e3 kple efe kal\u1ebdw\u0254w\u0254wo kat\u00e3,
  nu siwo kat\u00e3 w\u00f2w\u0254 kple du siwo w\u00f2tso la, wo\u014bl\u0254 wo
  \u0256e Yuda-fiawo fe \u014butinyagbal\u1ebd me. Ke le efe ameg\u00e3ku\u0263i la,
  af\u0254d\u0254l\u00e9le a\u0256e va \u0256e fu n\u025b.\\n24 Eye wots\u0254 Asa
  ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e t\u0254gbuiawo gb\u0254 le
  t\u0254gbuia David \u0191e Du la me; eye via Yehosafat zu fia \u0256e etefe.\\n25
  Ke Yeroboam vi Nadab zu fia \u0256e Israel dzi le Yuda-fia Asa fe fe evelia me;
  eye w\u00f2\u0256u Israel dzi fe eve.\\n26 Ew\u0254 nu si nye v\u0254\u0303 le Afet\u0254
  \u014bkume, eye w\u00f2to fofoa fe \u028be me hez\u0254 le nu v\u0254\u0303 si w\u00f2ts\u0254
  he Israel de nu v\u0254\u0303 me la nu.\\n27 Eye Baasa, Ahiya vi, ame si tso Isakar
  fe afe la me, \u0256o nugbe \u0256e e\u014bu, eye Baasa wui le Filistit\u0254wo
  fe du Gibeton me esime Nadab kple Israel blibo la \u0256e to \u0256e Gibeton.\\n28
  Ale Baasa wui le Yuda-fia Asa fe fe et\u0254\u0303lia me, eye w\u00f2zu fia \u0256e
  etefe.\\n29 Esi w\u00f2zu fia ko la, etsr\u0254\u0303 Yeroboam fe afe blibo la.
  Mena ame a\u0256eke si me agbegb\u0254gb\u0254 le la kp\u0254t\u0254 \u0256i na
  Yeroboam o; etsr\u0254\u0303 wo kat\u00e3 gbidigbidi, le Afet\u0254 fe nya si w\u00f2gbl\u0254
  to efe sub\u0254la Ahiya, Silot\u0254 la, dzi nu.\\n30 Esia dz\u0254 le Yeroboam
  fe nu v\u0254\u0303 siwo w\u00f2w\u0254 ts\u0254 he Israel de nu v\u0254\u0303 me
  ta, elabena edo dziku na Afet\u0254, Israel fe Mawu la vevie.\\n31 Ke Nadab \u014butinya
  sus\u0254eawo kple nu siwo kat\u00e3 w\u00f2w\u0254 la, wo\u014bl\u0254 wo \u0256e
  Israel-fiawo fe \u014butinyagbal\u1ebd me.\\n32 Eye a\u028ba n\u0254 Asa kple Israel-fia
  Baasa dome \u0263eawokat\u00e3\u0263i.\\n33 Le Yuda-fia Asa fe fe et\u0254\u0303lia
  me la, Baasa, Ahiya vi, zu fia \u0256e Israel blibo la dzi le Tirza fe blaeve v\u0254
  ene.\\n34 Gake ew\u0254 nu si nye v\u0254\u0303 le Afet\u0254 \u014bkume, eye w\u00f2to
  Yeroboam fe \u028be me hez\u0254 le efe nu v\u0254\u0303 si w\u00f2ts\u0254 he Israel
  de nu v\u0254\u0303 me la nu.\\n1 FIAWO 16\\n1 Eye Afet\u0254 fe gbe va na Yehu,
  Hanani vi \u0256e Baasa \u014bu be:\\n2 \u201cMek\u0254 w\u00f2 \u0256e dzi tso
  ke me hets\u0254 w\u00f2 \u0256o kpl\u0254la \u0256e nye duk\u0254 Israel nu, ke
  n\u00e8to Yeroboam fe \u028be me, eye n\u00e8na nye duk\u0254 Israel w\u0254 nu
  v\u0254\u0303, ale be wots\u0254 wofe nu v\u0254\u0303wo do dziku nam.\\n3 Eya ta
  makpl\u0254 Baasa kple efe afe la \u0256a fiafiafia, eye maw\u0254 efe afe la abe
  Yeroboam, Nebat vi fe afe ene.\\n4 Baasa fe ame si aku \u0256e du me la, avuwo a\u0256ui;
  eye efe ame si aku \u0256e gbe me la, dzifoxewo a\u0256ui.\u201d\\n5 Ke Baasa \u014butinya
  sus\u0254eawo, nu siwo w\u00f2w\u0254 kpakple efe kal\u1ebdw\u0254w\u0254wo la,
  wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd me.\\n6 Eye wots\u0254
  Baasa ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e Tirza; eye via Ela zu
  fia \u0256e etefe.\\n7 Nyagbl\u0254\u0256ila Yehu, Hanani vi, dzi kee Afet\u0254
  fe nya to va \u0256e Baasa kple efe afe la \u014bu, le nu v\u0254\u0303\u0256i siwo
  kat\u00e3 w\u00f2w\u0254 le Afet\u0254 \u014bkume, esi w\u00f2ts\u0254 efe asinud\u0254w\u0254w\u0254
  do dziku n\u025b, ne efe afe nazu abe Yeroboam fe afe la ene, kple esi w\u00f2wu
  Nadab ta.\\n8 Le Yuda-fia Asa fe fe blaeve v\u0254 adelia me la, Ela, Baasa vi,
  \u0256u fia \u0256e Israel dzi fe eve le Tirza.\\n9 Efe d\u0254la Zimri, ame si
  nye tasia\u0256amwo fe af\u00e3 fe ameg\u00e3, \u0256o nugbe \u0256e e\u014bu, esime
  w\u00f2le Tirza heno aha mu le Arza si nye afedzikp\u0254la le Tirza la fe afe me.\\n10
  Eye Zimri va da nui fu anyi hewui le Yuda-fia Asa fe fe blaeve v\u0254 adrelia me,
  eye w\u00f2zu fia \u0256e etefe.\\n11 Esi w\u00f2zu fia heb\u0254b\u0254 n\u0254
  efe fiazikpui dzi teti ko la, etsr\u0254\u0303 Baasa fe afe blibo la kat\u00e3.
  Mekp\u0254t\u0254 \u014butsu, e\u0256anye efe fomet\u0254 loo alo ex\u0254l\u0254\u0303wo
  o domet\u0254 a\u0256eke \u0256i o.\\n12 Ale Zimri tsr\u0254\u0303 Baasa fe afe
  blibo la \u0256ikaa, le Afet\u0254 fe nya si w\u00f2gbl\u0254 \u0256e Baasa \u014bu
  to nyagbl\u0254\u0256ila Yehu dzi la nu.\\n13 Esia dz\u0254 le Baasa kple via Ela
  fe nu v\u0254\u0303 siwo kat\u00e3 wow\u0254, kple nu v\u0254\u0303 siwo wona Israel
  w\u0254, be wots\u0254 wofe legba ma\u0256inuwo do dziku na Afet\u0254, Israel fe
  Mawu la ta.\\n14 Ke Ela \u014butinya sus\u0254eawo kple nu siwo kat\u00e3 w\u00f2w\u0254
  la, wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd me.\\n15 Le
  Yuda-fia Asa fe fe blaeve v\u0254 adrelia me la, Zimri zu fia, eye w\u00f2\u0256u
  dzi le Tirza \u014bkeke adre, esime a\u028bak\u0254 la fu asa\u0256a anyi \u0256e
  Filistit\u0254wo fe Gibeton \u014bu.\\n16 A\u028bak\u0254 la se le asa\u0256a la
  me be: \u201cZimri \u0256o nugbe \u0256e fia la \u014bu hewui.\u201d Eya ta Israel
  fe a\u028bak\u0254 blibo la ts\u0254 a\u028bafia Omri \u0256o fiae \u0256e Israel
  dzi gbe ma gbe le asa\u0256a la me.\\n17 Omri kple Israel fe a\u028bak\u0254 blibo
  si le e\u014bu la dzo le Gibeton, eye woyi \u0256a\u0256e to \u0256e Tirza.\\n18
  Esi Zimri kp\u0254 be wox\u0254 dua ko la, eva fia fe afe la fe m\u0254\u0301 ses\u1ebd
  la me, eye w\u00f2t\u0254 dzo fia fe afe la \u0256e e\u0256okui dzi, eye w\u00f2ku.\\n19
  Esia dz\u0254 le efe nu v\u0254\u0303 siwo w\u00f2w\u0254, esi w\u00f2w\u0254 nu
  si nye v\u0254\u0303 le Afet\u0254 \u014bkume heto Yeroboam fe \u028be me, eye w\u00f2kpl\u0254
  Israel de nu v\u0254\u0303 me la ta.\\n20 Ke Zimri \u014butinya sus\u0254eawo kple
  nugbe si w\u00f2\u0256o la, wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd
  me.\\n21 \u0194ema\u0263ie Israel duk\u0254 la ma \u0256e akpa eve me. Duk\u0254
  la fe akpa \u0256eka dze Tibni, Ginat vi yome be yewoa\u0256oe fia, eye akpa evelia
  dze Omri yome.\\n22 Ml\u0254eba ame siwo dze Omri yome la \u0256u ame siwo dze Tibni,
  Ginat vi yome la dzi. Tibni ku \u0263ema\u0263i, eye Omri zu fia.\\n23 Le Yuda-fia
  Asa fe fe blaet\u0254\u0303 v\u0254 \u0256ek\u025blia me la, Omri zu fia he\u0256u
  Israel dzi fe wuieve. E\u0256u fia le Tirza fe ade.\\n24 Efle Samaria-to la le Semer
  si klosalo talento eve, eye w\u00f2tso du \u0256e to la dzi. Ena \u014bk\u0254 du
  la be Samaria, \u0256e Semer ame si t\u0254 to la nye ts\u00e3 fe \u014bk\u0254
  nu.\\n25 Omri yi edzi w\u0254 nu si nye v\u0254\u0303 le Afet\u0254 \u014bkume,
  eye w\u00f2w\u0254 nu v\u0254\u0303\u0256i wu ame siwo kat\u00e3 do \u014bg\u0254
  n\u025b.\\n26 Eto Yeroboam, Nebat vi fe \u028be me p\u025bp\u025bp\u025b, eye w\u00f2z\u0254
  le efe nu v\u0254\u0303 siwo w\u00f2ts\u0254 he Israel de nu v\u0254\u0303 me be
  wots\u0254 wofe legba ma\u0256inuwo do dziku na Afet\u0254, Israel fe Mawu, la nu.\\n27
  Ke Omri \u014butinya sus\u0254eawo kple nu siwo w\u00f2w\u0254 kpakple efe kal\u1ebdw\u0254w\u0254wo
  la, wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd me.\\n28 Eye
  wots\u0254 Omri ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e Samaria; eye
  via Ahab zu fia \u0256e etefe.\\n29 Ke Ahab, Omri vi zu fia \u0256e Israel dzi le
  Yuda-fia Asa fe fe blaet\u0254\u0303 v\u0254 enyilia me; eye Ahab, Omri vi \u0256u
  fia \u0256e Israel dzi le Samaria fe blaeve v\u0254 eve.\\n30 Ahab, Omri vi w\u0254
  nu si nye v\u0254\u0303 le Afet\u0254 \u014bkume wu ame siwo kat\u00e3 do \u014bg\u0254
  n\u025b.\\n31 Esi Yeroboam, Nebat vi la fe nu v\u0254\u0303 siwo kat\u00e3 eya h\u00e3
  w\u0254 la me\u0256i naneke n\u025b o ta la, e\u0256e Sidon-fia Etbaal viny\u0254nu
  Izebel h\u00e3, eye w\u00f2yi \u0256asub\u0254 Baal hede ta agu n\u025b.\\n32 Az\u0254
  h\u00e3, e\u0256i v\u0254samlekpui na Baal \u0256e Baal fe x\u0254 si w\u00f2tu
  \u0256e Samaria la me.\\n33 Ahab w\u0254 Asera h\u00e3. Eye Ahab w\u0254 nu ge\u0256e
  ts\u0254 do dziku na Afet\u0254, Israel fe Mawu la, wu Israel-fia siwo kat\u00e3
  do \u014bg\u0254 n\u025b.\\n34 Le efe \u014bkekeawo me la, Betelt\u0254 Hiel gbugb\u0254
  tso Yeriko du la. Esi w\u00f2\u0256o eg\u0254me anyi la, efe \u014bg\u0254gbevi
  Abiram ku, eye esi w\u00f2de agbo enu la, efe d\u0254ml\u0254ea Segub h\u00e3 ku,
  le Afet\u0254 fe nya si w\u00f2gbl\u0254 to Yosua, Nun vi, dzi la nu.\\n1 FIAWO
  17\\n1 Eye Eliya Tisbit\u0254, si tso Gilead-nyigba dzi la, gbl\u0254 na Ahab be:
  \u201cZi ale si Afet\u0254, Israel fe Mawu, ame si mesub\u0254na le agbe la, z\u00e3mu
  alo tsi madza le fe siawo me o, negbe le nye nya nu ko hafi!\u201d\\n2 Eye Afet\u0254
  fe gbe va n\u025b be:\\n3 \u201cDzo le afi sia, eye n\u00e0\u0256o ta \u0263edzefe
  gome a\u0256abe \u0256e Kerit-t\u0254\u028bu si le Yordan fe \u0263edzefe la to.\\n4
  N\u00e0no t\u0254\u028bu la me tsi, eye made se na akpavi\u00e3wo be woana nu\u0256u\u0256u
  w\u00f2 le afi ma.\u201d\\n5 Enumake eyi \u0256aw\u0254 abe ale si Afet\u0254 gbl\u0254
  ene; eyi \u0256an\u0254 Kerit-t\u0254\u028bu si le Yordan fe \u0263edzefe la to.\\n6
  Eye akpavi\u00e3wo ts\u0254a abolo kple l\u00e3 vana n\u025b le \u014bdi kple fi\u1ebd,
  eye w\u00f2noa t\u0254\u028bu la me tsi.\\n7 Ke le \u014bkeke a\u0256ewo megbe la,
  t\u0254\u028bu la mie, elabena tsi megadza \u0256e anyigba la dzi kp\u0254 o.\\n8
  Eye Afet\u0254 fe gbe va n\u025b be:\\n9 \u201cTso n\u00e0yi Zarefat, si nye Sidont\u0254wo
  fe du me, eye n\u00e0n\u0254 afi ma. Kp\u0254 \u0256a! Made se na ahosi a\u0256e
  le afi ma be w\u00f2ana nu\u0256u\u0256u w\u00f2.\u201d\\n10 Ale w\u00f2tso yi Zarefat.
  Esi w\u00f2va \u0256o dua fe agbo nu la, ekp\u0254 ahosi a\u0256e w\u00f2n\u0254
  nake f\u0254m. Eye w\u00f2y\u0254e gbl\u0254 be: \u201cMe\u0256e kuku, ku tsi vi
  a\u0256e \u0256e kplu me v\u025b nam mano.\u201d\\n11 Esi w\u00f2yina eku ge la,
  egay\u0254e gbl\u0254 be: \u201cMe\u0256e kuku, di abolo kak\u025b a\u0256e h\u00e3
  \u0256e asi v\u025b nam.\u201d\\n12 E\u0256o e\u014bu n\u025b be: \u201cZi ale si
  Afet\u0254 w\u00f2 Mawu le agbe la, abolo a\u0256eke mele asinye o, negbe w\u0254
  asi\u028blo \u0256eka koe le w\u0254ze me, kple ami vi a\u0256e le amigoe me. Eye
  meva nake f\u0254 ge, ne mayi a\u0256a\u0256a nane nye kple vinye\u014butsu m\u00eda\u0256u
  hafi aku.\u201d\\n13 Eye Eliya gbl\u0254 n\u025b be: \u201cM\u00e8gav\u0254\u0303
  o. Heyi n\u00e0w\u0254 abe ale si n\u00e8gbl\u0254 ene. Gake ts\u0254 nu si li la
  fe \u0256e m\u00e8 abolo nogoe nam gb\u00e3, eye n\u00e0ts\u0254e v\u025b nam. Emegbe
  \u00e0te \u014bu a\u0256a nane w\u00f2 kple viw\u00f2a mia\u0256u.\\n14 Elabena
  ale Afet\u0254, Israel fe Mawu la gbl\u0254e nye esi: \u2018W\u0254ze la ma\u0256i
  gb\u0254lo o, eye ami mav\u0254 le amigoe la me o, va se \u0256e gbe si gbe Afet\u0254
  na tsi dza \u0256e anyigba la dzi.\u2019\u201d\\n15 Eya ta eyi \u0256aw\u0254 abe
  ale si Eliya gbl\u0254 ene; eye ny\u0254nu la kple efe fomea kpakple Eliya wo\u0256ui
  \u014bkeke ge\u0256e.\\n16 W\u0254ze la me\u0256i gb\u0254lo o, eye ami mev\u0254
  le amigoe la h\u00e3 me o, le Afet\u0254 fe nya si w\u00f2gbl\u0254 to Eliya dzi
  la nu.\\n17 Le nu siawo megbe la, afen\u0254 la fe vi dze d\u0254, eye d\u0254a
  nu s\u1ebd ale gbegbe be efe gb\u0254gb\u0254 nu tso.\\n18 Eye w\u00f2bia Eliya
  be: \u201cOo, Mawu vav\u00e3 fe ame, nya kae le asiw\u00f2 \u0256e \u014butinye?
  \u00d0e n\u00e8va gb\u0254nye be yea\u0256o \u014bku nye vodada dzi nam ahawu vinyea?\u201d\\n19
  Ke egbl\u0254 n\u025b be: \u201cK\u0254 viw\u00f2 la nam.\u201d Eye w\u00f2x\u0254e
  le efe ak\u0254nu hets\u0254 yi x\u0254tax\u0254 si me w\u00f2le la me, eye w\u00f2ts\u0254e
  ml\u0254 eya \u014but\u0254 fe aba dzi.\\n20 Eye w\u00f2y\u0254 Afet\u0254 gbl\u0254
  be: \u201cOo Afet\u0254 nye Mawu, ahosi si gb\u0254 medze la h\u00e3e n\u00e8be
  yeaw\u0254 nu vevii, eye n\u00e0wu via?\u201d\\n21 Eye w\u00f2dra \u0256e \u0256evi
  la dzi zi et\u0254\u0303 hey\u0254 Afet\u0254 gbl\u0254 be: \u201cOo Afet\u0254
  nye Mawu, me\u0256e kuku, na \u0256evi sia fe agbe natr\u0254 ava eme.\u201d\\n22
  Afet\u0254 se Eliya fe gbe, eye \u0256evi la fe agbe tr\u0254 va eme, eye w\u00f2gb\u0254
  agbe.\\n23 Az\u0254 Eliya k\u0254 \u0256evi la \u0256i tso x\u0254tax\u0254 la me
  va afea me, eye w\u00f2ts\u0254e na dadaa gbl\u0254 be: \u201cKp\u0254 \u0256a,
  viw\u00f2 la le agbe.\u201d\\n24 Eye ny\u0254nua gbl\u0254 na Eliya be: \u201cAz\u0254
  menyae k\u0254t\u025b be Mawu fe amee n\u00e8nye, eye be Afet\u0254 fe gbe si le
  nuw\u00f2 la nye nyatefe.\u201d\\n1 FIAWO 18\\n1 Le \u0263eyi\u0263i a\u0256e megbe
  la, Afet\u0254 fe gbe va na Eliya le fe et\u0254\u0303lia me be: \u201cYi n\u00e0\u0256e
  \u0256okuiw\u00f2 fia Ahab, elabena mana tsi nadza \u0256e anyigba la dzi.\u201d\\n2
  Eya ta Eliya yi be yea\u0256e ye \u0256okui afia Ahab esime d\u0254toto la nu s\u1ebd
  le Samaria.\\n3 Eye Ahab y\u0254 efe afedzikp\u0254la Obadiya v\u025b. (Obadiya
  v\u0254\u0303a Afet\u0254 \u014but\u0254,\\n4 Esi Izebel n\u0254 Afet\u0254 fe nyagbl\u0254\u0256ilawo
  wum la, Obadiya kpl\u0254 nyagbl\u0254\u0256ila alafa \u0256eka yi \u0256a\u0263la
  \u0256e agado me blaat\u0254\u0303blaat\u0254\u0303, eye w\u00f2naa abolo kple tsi
  wo.)\\n5 Ahab gbl\u0254 na Obadiya be: \u201cYi \u0256atsa le anyigba la dzi, le
  tsidz\u0254fewo kat\u00e3 kple t\u0254\u028buwo kat\u00e3 me. \u00d0ewoh\u0129 m\u00edakp\u0254
  gbe na s\u0254awo kple tedzis\u0254awo be woatsi agbe, ne l\u00e3awo kat\u00e3 nagatsr\u0254\u0303
  na m\u00ed o.\u201d\\n6 Eye woma anyigba si dzi woatsa le la \u0256e wo n\u0254ewo
  dome. Ahab l\u00e9 efe m\u0254 ts\u0254, eye Obadiya h\u00e3 l\u00e9 efe m\u0254
  ts\u0254.\\n7 Esi Obadiya le m\u0254a dzi la, Eliya va do goe. Enumake ekp\u0254e
  dze sii, eye w\u00f2tsy\u0254 mo anyi gbl\u0254 be: \u201cNye afet\u0254 Eliya,
  w\u00f2e nye esia?\u201d\\n8 E\u0256o e\u014bu be: \u201cNyee. Yi \u0256agbl\u0254
  na w\u00f2 afet\u0254 be: \u2018Eliya le afii.\u2019\u201d\\n9 Ke egbl\u0254 be:
  \u201cNu v\u0254\u0303 kae mew\u0254 be n\u00e0ts\u0254 w\u00f2 d\u0254la ade Ahab
  si ne w\u00f2awu?\\n10 Zi ale si Afet\u0254 w\u00f2 Mawu le agbe la, duk\u0254 alo
  fia\u0256ufe a\u0256eke meli, si me nye afet\u0254 med\u0254 ame \u0256o be woadi
  w\u00f2 o. Ne wogbl\u0254 be: \u2018Mele afi sia o\u2019 la, enana fia\u0256ufe
  la kple duk\u0254 la kaa atam be yewomekp\u0254 w\u00f2 o.\\n11 Az\u0254 n\u00e8le
  gb\u0254gbl\u0254m be: \u2018Yi \u0256agbl\u0254 na w\u00f2 afet\u0254 be: \u201cEliya
  le afii.\u201d\u2019\\n12 Ne medzo le gb\u0254w\u00f2 ko la, Afet\u0254 fe gb\u0254gb\u0254
  ak\u0254 w\u00f2 adzoe ayi afi si nyemanya o; eye ne meva gbl\u0254e na Ahab, gake
  meke \u0256e \u014buw\u00f2 o la, awum godoo. Ev\u0254 w\u00f2nye w\u00f2 d\u0254la
  v\u0254\u0303a Afet\u0254 tso efe \u0256evime ke hafi.\\n13 \u00d0e womegbl\u0254
  nu si mew\u0254 esime Izebel n\u0254 Afet\u0254 fe nyagbl\u0254\u0256ilawo wum,
  ale si me\u0263la Afet\u0254 fe nyagbl\u0254\u0256ila alafa \u0256eka \u0256e agado
  me blaat\u0254\u0303blaat\u0254\u0303, eye men\u0254 abolo kple tsi nam wo la na
  nye afet\u0254 oa?\\n14 Ke az\u0254 n\u00e8le gb\u0254gbl\u0254m be: \u2018Yi \u0256agbl\u0254
  na w\u00f2 afet\u0254 be: \u201cEliya le afii.\u201d\u2019 Awum godoo.\u201d\\n15
  Ke Eliya gbl\u0254 be: \u201cZi ale si a\u028bak\u0254wo fe Afet\u0254, ame si mesub\u0254na
  le agbe la, ma\u0256e \u0256okuinye afiae egbea.\u201d\\n16 Eya ta Obadiya yi \u0256akpe
  Ahab hegbl\u0254e n\u025b, eye Ahab yi \u0256ado go Eliya.\\n17 Esi Ahab nya kp\u0254
  Eliya ko la, enumake Ahab biae be: \u201cW\u00f2, ame si he v\u0254\u0303 va Israel
  dzi lae nye esia?\u201d\\n18 E\u0256o e\u014bu be: \u201cMenye nyee he v\u0254\u0303
  va Israel dzi o, ke bo\u014b w\u00f2 kple fofow\u00f2 fe afee, le esi miegbl\u1ebd
  Afet\u0254 fe sededewo \u0256i hedze Baalwo yome ta.\\n19 Az\u0254 d\u0254 ame woayi
  a\u0256ay\u0254 Israel blibo la va fo fu \u0256e gb\u0254nye le Karmel To la gb\u0254
  hekpe \u0256e Baal fe nyagbl\u0254\u0256ila alafa ene blaat\u0254\u0303 kple Asera
  fe nyagbl\u0254\u0256ila alafa ene, siwo \u0256ua nu le Izebel fe kpl\u0254\u0303
  \u014bu la \u014buti.\u201d\\n20 Ale Ahab d\u0254 ame \u0256o \u0256e Israel-viwo
  kat\u00e3, eye wofo nyagbl\u0254\u0256ilawo nu fu \u0256e Karmel To la gb\u0254.\\n21
  Eye Eliya te \u0256e duk\u0254 blibo la \u014bu gbl\u0254 be: \u201c\u0194eka\u0263i
  miatsi evedomesi ase \u0256o? Ne Afet\u0254e nye Mawu vav\u00e3 la, ekema midze
  eyome; ke ne Baal ye la, ekema midze eyome!\u201d Ke duk\u0254a me\u0256o nya a\u0256eke
  \u014bu n\u025b o.\\n22 Eye Eliya gbl\u0254 na duk\u0254 la be: \u201cNye \u0256eka
  koe nye Afet\u0254 fe nyagbl\u0254\u0256ila si sus\u0254, ke Baal fe nyagbl\u0254\u0256ilawo
  ya le ame alafa ene blaat\u0254\u0303.\\n23 Az\u0254 mina woats\u0254 nyitsui eve
  v\u025b na m\u00ed, eye woawo natia nyitsui \u0256eka aflii a\u0256o nake dzi, ke
  womade dzo ete o. Nye h\u00e3 mawu nyitsui evelia ats\u0254 a\u0256o nake dzi, ke
  nyemade dzo ete o.\\n24 Miay\u0254 mia mawu la \u014bk\u0254, eye nye h\u00e3 may\u0254
  Afet\u0254 \u014bk\u0254. Mawu si ana dzo nafi\u00e3 v\u0254sal\u00e3a la, eyae
  nye Mawu vav\u00e3 la.\u201d Eye duk\u0254 blibo la kat\u00e3 \u0256o e\u014bu be:
  \u201cNya si n\u00e8gbl\u0254 la nyo.\u201d\\n25 Az\u0254 Eliya gbl\u0254 na Baal
  fe nyagbl\u0254\u0256ilawo be: \u201cMiawo mitia nyitsui \u0256eka gb\u00e3, eye
  miawui, elabena miawoe s\u0254 gb\u0254. Eye miy\u0254 mia mawu la \u014bk\u0254,
  gake migade dzo ete o.\u201d\\n26 Ale wol\u00e9 nyitsui si wots\u0254 na wo hewui,
  eye wole Baal \u014bk\u0254 y\u0254y\u0254 dzi tso \u014bdi va se \u0256e \u0263e\u0256ota,
  le gb\u0254gbl\u0254m be: \u201cOo Baal, t\u0254 na m\u00ed!\u201d Ke gbe a\u0256eke
  me\u0256i o, eye ame a\u0256eke met\u0254 o. Eye wole kpo tim le xl\u00e3 fom v\u0254samlekpui
  si wo\u0256i la.\\n27 Eye le \u0263e\u0256ota l\u0254fo la, Eliya de asi fewu\u0256u\u0256u
  me le wo \u014bu hegbl\u0254 be: \u201cMido \u0263li ses\u0129e! Elabena mawu w\u00f2nye!
  \u00d0ewoh\u0129 eyi \u014bugble me \u028b\u0129i, alo eyi nugodo. Alo \u0256ewoh\u0129
  ele al\u0254\u0303 d\u0254m, eye w\u00f2hi\u00e3 be woany\u0254e!\u201d\\n28 Ale
  wodo \u0263li n\u0254 ey\u0254m ses\u0129e, eye wots\u0254 h\u025b kple akpl\u0254
  n\u0254 wo \u0256okuiwo sim le wofe k\u0254nu la nu va se \u0256e esime \u028bu
  \u0256u\u0256u le wo \u014bu.\\n29 \u0194e tr\u0254, gake woyi edzi le nugbenugbe
  w\u0254m va se \u0256e fi\u1ebdnu\u0256uv\u0254sa\u0263i, ke gbe a\u0256eke me\u0256i
  o eye ame a\u0256eke met\u0254 o; ame a\u0256eke me\u0256o to o.\\n30 Az\u0254 Eliya
  gbl\u0254 na duk\u0254 blibo la be: \u201cMite va gb\u0254nye.\u201d Eye duk\u0254
  blibo la te va egb\u0254. E\u0256\u0254 Afet\u0254 fe v\u0254samlekpui si wogb\u00e3
  la \u0256o.\\n31 Eye Eliya ts\u0254 kpe wuieve le Yakob, ame si Afet\u0254 fe gbe
  va na be, \u201cIsrael anye w\u00f2 \u014bk\u0254\u201d la, fe vi\u014butsuwo fe
  toawo fe xexl\u1ebdme nu.\\n32 Eye w\u00f2ts\u0254 kpeawo \u0256i v\u0254samlekpui
  le Afet\u0254 fe \u014bk\u0254 me. Eye w\u00f2\u0256e \u028be si keke, ale be woate
  \u014bu af\u00e3 lu seya eve \u0256e eme la, fo xl\u00e3 v\u0254samlekpui la godoo.\\n33
  Emegbe e\u0256o nakeawo, eye w\u00f2fli nyitsui la ts\u0254 \u0256o nakeawo dzi.
  Az\u0254 egbl\u0254 be: \u201cMidu tsi k\u0254 \u0256e ze g\u00e3 ene me woay\u0254,
  eye mitr\u0254e k\u0254 \u0256e numev\u0254sal\u00e3 la kple nakeawo dzi.\u201d\\n34
  Eye w\u00f2gbl\u0254 be: \u201cMigaw\u0254e ake.\u201d Eye wogaw\u0254e. Eye w\u00f2gagbl\u0254
  ake be: \u201cMigaw\u0254e zi et\u0254\u0303lia.\u201d Eye wow\u0254e zi et\u0254\u0303lia.\\n35
  Ale tsi la gbagba \u0256e v\u0254samlekpui la \u014bu godoo, eye wok\u0254 tsi \u0256e
  \u028be la h\u00e3 me w\u00f2y\u0254.\\n36 Le fi\u1ebdnu\u0256uv\u0254sa\u0263i
  l\u0254fo la, nyagbl\u0254\u0256ila Eliya te va gbl\u0254 be: \u201cOo Afet\u0254,
  Abraham, Isak kple Israel fe Mawu, na woanyae egbea be w\u00f2e nye Mawu le Israel,
  eye menye w\u00f2 sub\u0254la, eye be w\u00f2 nya nue mew\u0254 nu siawo kat\u00e3
  le.\\n37 T\u0254 nam, Oo Afet\u0254! T\u0254 nam, ne duk\u0254 sia nanyae be w\u00f2,
  Afet\u0254, ye nye Mawu vav\u00e3 la, eye be w\u00f2e le wofe dziwo tr\u0254m \u0256e
  \u014buw\u00f2.\u201d\\n38 Eye Afet\u0254 fe dzo ge tso dzi va fi\u00e3 numev\u0254sal\u00e3
  la, nakeawo, kpeawo kple ke la, eye w\u00f2no tsi si le \u028bea me la ke\u014bke\u014b.\\n39
  Esi duk\u0254 blibo la kp\u0254e la, enumake wotsy\u0254 mo anyi gbl\u0254 be: \u201cAfet\u0254e
  nye Mawu vav\u00e3 la! Afet\u0254e nye Mawu vav\u00e3 la!\u201d\\n40 Eye Eliya gbl\u0254
  na wo be: \u201cMil\u00e9 Baal fe nyagbl\u0254\u0256ilawo! Migana wo domet\u0254
  \u0256eka h\u0254\u0303 h\u00e3 nasi o!\u201d Enumake wol\u00e9 wo, eye Eliya kpl\u0254
  wo yi Kison-t\u0254\u028bu la nu, eye w\u00f2wu wo le afi ma.\\n41 Az\u0254 Eliya
  gbl\u0254 na Ahab be: \u201cYi n\u00e0\u0256u nu ano nu, elabena mele tsidzadza
  g\u00e3 a\u0256e \u014bk\u0254 sem.\u201d\\n42 Eye Ahab yi be yea\u0256u nu ano
  nu. Ke Eliya yi Karmel To la dzi, eye w\u00f2b\u0254b\u0254 \u0256e anyigba hets\u0254
  mo de atame.\\n43 Eye w\u00f2gbl\u0254 na efe sub\u0254vi be: \u201cMe\u0256e kuku,
  lia toa, ne n\u00e0kp\u0254 fu gome \u0256a.\u201d Eye w\u00f2yi \u0256akp\u0254e
  hegb\u0254 va gbl\u0254 be: \u201cNaneke meli o.\u201d Eye w\u00f2gbl\u0254 zi gb\u0254
  zi adre be, \u201cGbugb\u0254 yi.\u201d\\n44 Esi w\u00f2yi zi adrelia la, egbl\u0254
  be: \u201cKp\u0254 \u0256a! Alilikpo vi a\u0256e si le abe ame fe asifome ene la
  le hohom tso fua me.\u201d Eye w\u00f2gbl\u0254 be: \u201cYi \u0256agbl\u0254 na
  Ahab be, \u2018Tsi l\u00e3wo \u0256e tasia\u0256am \u014bu! Tr\u0254 dzo kaba ne
  tsi g\u00e3 la nagasika w\u00f2 \u0256i o!\u2019\u201d\\n45 Kasia alilikpo xe dzifo
  \u014bkume tsi\u0256itsi\u0256i, ya n\u0254 fofom, eye tsi g\u00e3 a\u0256e dza.
  Ke Ahab do tasia\u0256am heyi Yezreel.\\n46 Afet\u0254 fe asi va Eliya dzi, eye
  w\u00f2bla ali dzi hefu du dze Ahab \u014bg\u0254 va \u0256o keke Yezreel ke.\\n1
  FIAWO 19\\n1 Ahab va gbl\u0254 nu siwo kat\u00e3 Eliya w\u0254 kple ale si w\u00f2wu
  nyagbl\u0254\u0256ilawo kat\u00e3 kple yi la na Izebel.\\n2 Eye Izebel d\u0254 ame
  \u0256o \u0256e Eliya be: \u201cMawuwo nefiam ne woagafiam \u0256e edzi, ne nyemew\u0254
  w\u00f2 ets\u0254 \u0263ealewo\u0263i abe wo domet\u0254 \u0256eka ene o f\u0129!\u201d\\n3
  Ale v\u0254v\u0254\u0303 \u0256o Eliya, eya ta esi dzo be yea\u0256e yefe agbe.
  Esi yi Beer-Seba, si le Yuda, ke egbl\u1ebd efe sub\u0254vi la \u0256e afi ma.\\n4
  Eye w\u00f2z\u0254 \u014bkeke \u0256eka fe m\u0254 yi gbedzi, eye w\u00f2va b\u0254b\u0254
  n\u0254 ati dodoe a\u0256e te. Eye w\u00f2bia be yeaku hegbl\u0254 be: \u201cEs\u0254
  gb\u0254! Oo Afet\u0254, \u0256e nye agbe \u0256a az\u0254, elabena nyemenyo wu
  t\u0254gbuinyewo o.\u201d\\n5 Eye w\u00f2ml\u0254 anyi d\u0254 al\u0254\u0303 \u0256e
  atia te. Kasia, mawud\u0254la a\u0256e va ka asi e\u014bu hegbl\u0254 n\u025b be:
  \u201cF\u0254 n\u00e0\u0256u nu.\u201d\\n6 Esi w\u00f2f\u0254 k\u0254 dzi la, ekp\u0254
  abolo nogoe le kpe x\u0254dzowo dzi eye tsize a\u0256e le efe tade. Eye w\u00f2\u0256u
  nu no nu; emegbe w\u00f2gaml\u0254 anyi.\\n7 Afet\u0254 fe d\u0254la la gava zi
  evelia heka asi e\u014bu gbl\u0254 be: \u201cF\u0254 n\u00e0\u0256u nu, elabena
  m\u0254 la ate \u0256e\u0256i \u014buw\u00f2.\u201d\\n8 Ale w\u00f2f\u0254, eye
  w\u00f2\u0256u nu no nu, eye nu\u0256u\u0256u sia do \u014bus\u1ebde w\u00f2z\u0254
  \u014bkeke blaene kple z\u00e3 blaene heva \u0256o keke Mawu vav\u00e3 la fe to
  Horeb gb\u0254 ke.\\n9 Eyi agado a\u0256e me le afi ma be yeatsi ad\u0254; eye kp\u0254
  \u0256a, Afet\u0254 fe gbe va n\u025b be: \u201cEliya, nu ka w\u0254m n\u00e8le
  le afi sia?\u201d\\n10 E\u0256o e\u014bu be: \u201cMe\u028b\u00e3 \u014bu \u0256e
  Afet\u0254, a\u028bak\u0254wo fe Mawu nu vevie; elabena Israel-viwo gbl\u1ebd w\u00f2
  nubabla la \u0256i, wogb\u00e3 w\u00f2 v\u0254samlekpuiwo, eye wowu w\u00f2 nyagbl\u0254\u0256ilawo
  kple yi ale be nye \u0256eka koe kp\u0254t\u0254. Az\u0254 wole nye agbe dim be
  yewoa\u0256e \u0256a.\u201d\\n11 Ke egbl\u0254 be: \u201cDo go, ne n\u00e0tsi tsitre
  \u0256e to la dzi le Afet\u0254 \u014bkume.\u201d Eye kp\u0254 \u0256a, Afet\u0254
  tso eme va yina, eye ya \u028budu\u028budu a\u0256e le towo fem hele agakpewo gb\u00e3m
  le Afet\u0254 \u014bg\u0254, ke Afet\u0254 mele ya la me o. Le ya la yome la, anyigba
  \u028bu\u028bu, ke Afet\u0254 mele anyigba\u028bu\u028bu la me o.\\n12 Le anyigba\u028bu\u028bua
  yome la, dzobibi va, ke Afet\u0254 mele dzo la me o. Eye le dzo la yome la, gbe
  b\u0254b\u0254e a\u0256e \u0256i blewu.\\n13 Esi Eliya nya see ko la, ehe nyagbl\u0254\u0256ila
  fe awu si w\u00f2do la tsy\u0254 mo, eye w\u00f2yi \u0256atsi tsitre \u0256e agado
  la nu. Eye gbe a\u0256e biae be: \u201cEliya, nu ka w\u0254m n\u00e8le le afi sia?\u201d\\n14
  E\u0256o e\u014bu be: \u201cMe\u028b\u00e3 \u014bu \u0256e Afet\u0254, a\u028bak\u0254wo
  fe Mawu nu vevie; elabena Israel-viwo gbl\u1ebd w\u00f2 nubabla la \u0256i, wogb\u00e3
  w\u00f2 v\u0254samlekpuiwo, eye wowu w\u00f2 nyagbl\u0254\u0256ilawo kple yi, ale
  be nye \u0256eka koe kp\u0254t\u0254. Az\u0254 wole nye agbe dim be yewoa\u0256e
  \u0256a.\u201d\\n15 Eye Afet\u0254 gbl\u0254 n\u025b be: \u201cDze m\u0254 n\u00e0gbugb\u0254
  ayi Damasko gbedzi. Ne \u00e8\u0256o la, n\u00e0si ami na Hazael w\u00f2azu fia
  \u0256e Siria dzi.\\n16 Eye n\u00e0si ami na Yehu, Nimsi t\u0254gbuiy\u0254vi, w\u00f2azu
  fia \u0256e Israel dzi; eye n\u00e0si ami na Elisa, Safat vi, tso Abel-Mehola, ne
  w\u00f2azu nyagbl\u0254\u0256ila \u0256e tew\u00f2fe.\\n17 Ame si asi le Hazael
  fe yi nu la, Yehu awui, eye ame si asi le Yehu fe yi nu la, Elisa awui.\\n18 Ke
  h\u00e3, mesus\u0254 ame akpe adre \u0256e Israel, ame siwo kat\u00e3 medze klo
  na Baal o, eye womegbugb\u0254 nu n\u025b o.\u201d\\n19 Ale w\u00f2dzo le afi ma,
  eye w\u00f2kp\u0254 Elisa, Safat vi la, esime w\u00f2ts\u0254 nyi eveve tefe wuieve
  le agble \u014bl\u0254m le e\u014bg\u0254, eye eya \u014but\u0254 le eve maml\u025bawo
  \u014bu. Eye Eliya yi egb\u0254 heda nyagbl\u0254\u0256ila fe awu la \u0256o \u0256ee.\\n20
  Eye Elisa gbl\u1ebd nyiawo \u0256i fu du kpl\u0254 Eliya \u0256o gbl\u0254 be: \u201cMe\u0256e
  kuku, na magbugb\u0254 nu na fofonye kple danye. Emegbe madze yow\u00f2me.\u201d
  Eye w\u00f2gbl\u0254 n\u025b be: \u201cYi n\u00e0gb\u0254; Nyemexe m\u0254 na w\u00f2
  o \u0256e!\u201d\\n21 Eye w\u00f2tr\u0254 le eyome \u0256al\u00e9 nyitsu eve, eye
  w\u00f2ts\u0254 wo sa v\u0254e hets\u0254 nyiawo fe k\u0254kutiawo w\u0254 nake
  ts\u0254 \u0256a l\u00e3 lae, eye w\u00f2ts\u0254e na ameawo wo\u0256u. Emegbe etso
  dze Eliya yome va n\u0254 esub\u0254m.\\n1 FIAWO 20\\n1 Az\u0254 Siria-fia Ben-Hadad
  fo efe a\u028bak\u0254wo kat\u00e3 nu fu hekpe \u0256e fia blaet\u0254\u0303 v\u0254
  eve kple wofe s\u0254wo kpakple tasia\u0256amwo \u014bu; eye w\u00f2yi \u0256a\u0256e
  to \u0256e Samaria be yeaw\u0254 a\u028ba kplii.\\n2 Eye w\u00f2d\u0254 amewo \u0256o
  \u0256e Israel-fia Ahab gb\u0254 le dua me be woagbl\u0254 n\u025b be: \u201cAle
  Ben-Hadad gbl\u0254e nye esi,\\n3 \u2018W\u00f2 klosalo kple sika nye t\u0254nye,
  eye sr\u0254\u0303w\u00f2wo kple viw\u00f2wo domet\u0254 nyuit\u0254wo nye t\u0254nye.\u2019\u201d\\n4
  Israel-fia \u0256o e\u014bu be: \u201cNye afet\u0254 fia, nye kple nye nuwo kat\u00e3
  nye t\u0254w\u00f2, le w\u00f2 nya la nu.\u201d\\n5 Emegbe d\u0254laawo gatr\u0254
  va gbl\u0254 be: \u201cAle Ben-Hadad gbl\u0254e nye esi, \u2018Med\u0254 ame \u0256e
  gb\u0254w\u00f2 be: \u201cTs\u0254 w\u00f2 klosalo, sika, sr\u0254\u0303w\u00f2wo
  kple viw\u00f2wo nam.\u201d\\n6 Ke ets\u0254 \u0263ealewo\u0263i la, mad\u0254 nye
  d\u0254lawo \u0256e gb\u0254w\u00f2, ne woaka w\u00f2 afe kple w\u00f2 d\u0254lawo
  fe afewo me tsitotsito, eye woal\u0254 w\u00f2 nu veviwo kat\u00e3 adzoe.\u2019\u201d\\n7
  Eye Israel-fia y\u0254 duk\u0254 la fe ametsitsiwo kat\u00e3 fo fu gbl\u0254 be:
  \u201cMibu e\u014bu, eye miakp\u0254e be, v\u0254\u0303 dim ame sia le be yeaw\u0254
  m\u00ed, elabena ed\u0254 ame \u0256e gb\u0254nye, be yeax\u0254 sr\u0254\u0303nyewo,
  vinyewo, nye klosalo kple nye sika, eye nyemete woe o.\u201d\\n8 Eye ametsitsiawo
  kat\u00e3 kple duk\u0254 blibo la gbl\u0254 n\u025b be: \u201cM\u00e8ga\u0256o toe
  o, eye m\u00e8gal\u0254\u0303 \u0256e edzi n\u025b o.\u201d\\n9 Eya ta egbl\u0254
  na Ben-Hadad fe d\u0254lawo be: \u201cMigbl\u0254 na nye afet\u0254 fia be, \u2018Nu
  siwo kat\u00e3 \u014buti n\u00e8d\u0254 ame \u0256o \u0256e w\u00f2 d\u0254la gb\u0254
  gb\u00e3 la, maw\u0254e, ke esia ya la, nyemate \u014bu aw\u0254e o.\u2019\u201d
  Eye d\u0254laawo dzo, eye wogbugb\u0254 gbe la yi n\u025b.\\n10 Eye Ben-Hadad d\u0254
  ame \u0256o \u0256ee gbl\u0254 be: \u201cMawuwo nefiam ne w\u00f2agafiam \u0256e
  edzi ne ke as\u0254 gb\u0254 \u0256e Samaria ale be nye a\u028baw\u0254lawo domet\u0254
  \u0256e sia \u0256e nax\u0254 asi\u028blo \u0256eka g\u0254\u0303 h\u00e3 f\u0129!\u201d\\n11
  Israel-fia h\u00e3 \u0256o e\u014bu be: \u201cMigbl\u0254 n\u025b be: \u2018Ame
  si do a\u028bawu megafo adegbe le e\u0256okui \u014bu abe ame si \u0256e a\u028bawu
  \u0256i la ene o.\u2019\u201d\\n12 Esi w\u00f2se nya siawo, esime eya kple fiaawo
  le aha nom le agbad\u0254wo me ko la, egbl\u0254 na efe a\u028baw\u0254lawo be:
  \u201cMidzra \u0256o miadze wo dzi!\u201d Eye wodzra \u0256o \u0256e dua dzi dzedze
  \u014bu.\\n13 Ke nyagbl\u0254\u0256ila a\u0256e va Israel-fia Ahab gb\u0254 gbl\u0254
  be: \u201cAle Afet\u0254 gbl\u0254e nye esi, \u2018\u00c8kp\u0254 ameha g\u00e3
  sia kat\u00e3? Kp\u0254 \u0256a, mets\u0254 wo le asi dem na w\u00f2 egbea, ne n\u00e0dze
  sii be, nyee nye Afet\u0254.\u2019\u201d\\n14 Eye Ahab bia be: \u201cAme ka dzi
  w\u00f2ato?\u201d E\u0256o e\u014bu be: \u201cAle Afet\u0254 gbl\u0254e nye esi,
  \u2018Ato ameg\u00e3 siwo le nutoawo dzi \u0256um la fe \u0256ekakpuiwo dzi.\u2019\u201d
  Eye w\u00f2gabia be: \u201cAme kae adze a\u028ba la g\u0254me?\u201d E\u0256o e\u014bu
  be: \u201cW\u00f2e!\u201d\\n15 Eye Ahab xl\u1ebd ameg\u00e3 siwo le nutoawo dzi
  \u0256um la fe \u0256ekakpuiawo, wole ame alafa eve blaet\u0254\u0303 v\u0254 eve;
  le woawo megbe la, exl\u1ebd Israel-viwo fe a\u028bak\u0254 blibo la kat\u00e3,
  wole ame akpe adre.\\n16 Eye woho le \u0263e\u0256ota, esime Ben-Hadad kple fia
  blaet\u0254\u0303 v\u0254 eve siwo le kpekpem \u0256e e\u014bu la no aha mu le agbad\u0254wo
  me.\\n17 Esime ameg\u00e3 siwo le nutoawo dzi \u0256um la fe \u0256ekakpuiwo tre
  dodo tso dua me la, enumake Ben-Hadad d\u0254 amewo \u0256o \u0256a. Eye wova gbl\u0254
  n\u025b be: \u201cSamaria-\u014butsuwo ho gb\u0254na.\u201d\\n18 Eye w\u00f2gbl\u0254
  be: \u201cNe \u014butifafa tae woho \u0256o la, mil\u00e9 wo agbagbee; eye ne a\u028ba
  tae woho \u0256o h\u00e3 la, mil\u00e9 wo agbagbee.\u201d\\n19 Gake esi ameg\u00e3
  siwo le nutoawo dzi \u0256um la fe \u0256ekakpuiawo kple a\u028bak\u0254 si le wo
  yome do go tso dua me la,\\n20 wo domet\u0254 \u0256e sia \u0256e wu ame si l\u0169
  \u0256e edzi. Siriat\u0254wo si, eye Israel ti wo yome, ke Siria-fia Ben-Hadad do
  s\u0254 hesi kple s\u0254dola a\u0256ewo.\\n21 Israel-fia la ho yi \u0256atsr\u0254\u0303
  s\u0254dolawo kple tasia\u0256amdolawo, eye w\u00f2si Siriat\u0254wo etefe mek\u0254
  o.\\n22 Emegbe nyagbl\u0254\u0256ila la va Israel-fia gb\u0254 gbl\u0254 n\u025b
  be: \u201cYi n\u00e0dzra \u0256o nyuie, eye n\u00e0bu e\u014bu akp\u0254 nu si w\u0254
  ge n\u00e0la, elabena le fe si gb\u0254na fe g\u0254medzedze la, Siria-fia aho \u0256e
  \u014buw\u00f2.\u201d\\n23 Ke Siria-fia \u014bumewo gbl\u0254 n\u025b be: \u201cTowo
  fe Mawue wofe Mawu la nye. Esia tae wo\u0256u m\u00eda dzi \u0256o. Gake ne m\u00edekpe
  a\u028ba kpli wo le gbadzafe la, m\u00eda\u0256u wo dzi.\\n24 Nu si n\u00e0gaw\u0254e
  nye esi: \u00d0e fiawo kat\u00e3 \u0256a le wo n\u0254fewo, ne n\u00e0ts\u0254 nutodzi\u0256ulawo
  a\u0256o wo tefe.\\n25 Az\u0254 \u0256e a\u028bak\u0254 si fe xexl\u1ebdme s\u0254
  kple a\u028bak\u0254 si tsi a\u028ba la na \u0256okuiw\u00f2 hekpe \u0256e s\u0254wo
  kple tasia\u0256amwo fe xexl\u1ebdme mawo tututu \u014bu. Eye na m\u00edaw\u0254
  a\u028ba kpli wo le gbadzafe, m\u00eda\u0256u wo dzi godoo.\u201d Eya ta ese wofe
  gbe, eye w\u00f2w\u0254e nenema p\u025bp\u025bp\u025b.\\n26 Le fe si kpl\u0254e
  \u0256o fe g\u0254medzedze la, Ben-Hadad fo Siriat\u0254wo nu fu, eye w\u00f2ho
  yi Afek, be yeaw\u0254 a\u028ba kple Israel.\\n27 Ke wofo Israel-viwo h\u00e3 nu
  fu hena nu\u0256u\u0256u wo, eye woho yi wo kpe ge. Esi Israel-viwo yi \u0256afu
  asa\u0256a anyi \u0256e wo \u014bg\u0254 la, won\u0254 abe gb\u0254\u0303ha sue
  eve ene, ev\u0254 Siriat\u0254wo gbagba \u0256e anyigba la kat\u00e3 dzi.\\n28 Eye
  Mawu vav\u00e3 la fe ame la va gbl\u0254 na Israel-fia la be: \u201cAle Afet\u0254
  gbl\u0254e nye esi, \u2018Esi Siriat\u0254wo be: \u201cTowo fe Mawue Afet\u0254
  nye, eye menye bali me Mawue w\u00f2nye o\u201d ta la, mats\u0254 ameha g\u00e3
  sia kat\u00e3 ade asi na w\u00f2, ne miadze sii be, nyee nye Afet\u0254.\u2019\u201d\\n29
  Eye wofu asa\u0256a anyi dze \u014bg\u0254 wo n\u0254ewo \u014bkeke adre, eye a\u028ba
  la fe ati le \u014bkeke adrea gbe. Israel-viwo wu Siriat\u0254wo fe a\u028baw\u0254la
  af\u0254z\u0254la akpe alafa \u0256eka le \u014bkeke \u0256eka dzi.\\n30 Ke ame
  siwo sus\u0254 la si yi Afek dua me. Gake gli la mu dze ame akpe blaeve v\u0254
  adre, siwo sus\u0254 la dzi. Ben-Hadad \u014but\u0254 si, eye w\u00f2va du la me
  heva b\u00e8 \u0256e x\u0254 ememet\u0254 a\u0256e me.\\n31 Eye e\u014bumewo va
  gbl\u0254 n\u025b be: \u201cKp\u0254 \u0256a, m\u00edese be, Israel fe afe la fe
  fiawo nye fia siwo kp\u0254a nublanui na ame. M\u00ede\u0256e kuku, na m\u00edasa
  akpanya \u0256e ali, eye m\u00edasa ka \u0256e ta, ne m\u00edado ayi Israel-fia
  gb\u0254. \u00d0ewoh\u0129 ax\u0254 w\u00f2 \u0256e agbe.\u201d\\n32 Ale wosa akpanya
  \u0256e ali, eye wosa ka \u0256e ta heva Israel-fia gb\u0254 gbl\u0254 be: \u201cW\u00f2
  sub\u0254vi Ben-Hadad be, \u2018Me\u0256e kuku, na matsi agbe.\u2019\u201d E\u0256o
  e\u014bu na wo be: \u201cEgale agbea? N\u0254vinyee w\u00f2nye.\u201d\\n33 Eya ta
  \u014butsuawo ts\u0254e be dzesi nyui a\u0256ee, eye wox\u0254 efe nyaa dzi se,
  eye wogagbl\u0254 be: \u201cNyatefee, n\u0254viw\u00f2e Ben-Hadad nye.\u201d Egbl\u0254
  na wo be: \u201cMiyi \u0256akpl\u0254e v\u025b.\u201d Eye Ben-Hadad va egb\u0254,
  enumake Ahab na w\u00f2\u0256o tasia\u0256am la.\\n34 Eye Ben-Hadad gbl\u0254 n\u025b
  be: \u201cDu siwo fofonye x\u0254 le fofow\u00f2 si la, magbugb\u0254 wo ana w\u00f2,
  eye \u00e0te \u014bu atu asiwo na \u0256okuiw\u00f2 le Damasko abe ale si fofonye
  w\u0254 le Samaria ene.\u201d\\nEye Ahab \u0256o e\u014bu be: \u201cLe nubabla sia
  ta ma\u0256e asi le \u014buw\u00f2.\u201d\\nEye w\u00f2bla nu kplii he\u0256e asi
  le e\u014bu w\u00f2dzo.\\n35 Eye \u014butsu a\u0256e tso nyagbl\u0254\u0256ilawo
  fe viwo dome gbl\u0254 na ex\u0254l\u0254\u0303 le Afet\u0254 fe nya nu be: \u201cMe\u0256e
  kuku, fom.\u201d Ke \u014butsua gbe efofo.\\n36 Eya ta egbl\u0254 n\u025b be: \u201cEsi
  m\u00e8\u0256o to Afet\u0254 fe gbe o ta la, kp\u0254 \u0256a, ne \u00e8nya dzo
  le gb\u0254nye teti ko la, dzata awu w\u00f2.\u201d Esi w\u00f2dzo le egb\u0254
  la, dzata a\u0256e va dze edzi hewui.\\n37 Egakp\u0254 \u014butsu bubu, eye w\u00f2gbl\u0254
  n\u025b be: \u201cMe\u0256e kuku, fom.\u201d Eye \u014butsua foe de abi e\u014bu.\\n38
  Eye nyagbl\u0254\u0256ila la yi \u0256at\u0254 \u0256e m\u0254 to n\u0254 fia la
  lalam, eye w\u00f2ts\u0254 nu bla \u014bkume be woagadze si ye o.\\n39 Esi fia la
  tso eme va yina la, edo \u0263li \u0256o \u0256e fia la gbl\u0254 be: \u201cW\u00f2
  sub\u0254vi yi a\u028ba la fe ses\u1ebdafe; eye kp\u0254 \u0256a, \u014butsu a\u0256e
  kpl\u0254 ame a\u0256e tso a\u028bakpefea v\u025b nam hegbl\u0254 be: \u2018Dz\u0254
  \u014butsu sia \u014bu. Ne ebu la, woats\u0254 w\u00f2 agbe a\u0256o efe agbe tefe,
  alo n\u00e0xe klosalo talento \u0256eka.\u2019\\n40 Eye esi w\u00f2 sub\u0254vi
  n\u0254 nu w\u0254m le afii kple afi m\u025b la, kasia ame la si dzo.\u201d Eye
  Israel-fia gbl\u0254 n\u025b be: \u201cNenemae woadr\u0254\u0303 \u028b\u0254nu
  w\u00f2; w\u00f2 \u014but\u0254 \u00e8bu f\u0254 \u0256okuiw\u00f2 xoxo.\u201d\\n41
  Eye w\u00f2\u0256e nua \u0256a le \u014bkume kaba, eye Israel-fia la kp\u0254e dze
  sii be enye nyagbl\u0254\u0256ilawo domet\u0254 \u0256eka.\\n42 Eye nyagbl\u0254\u0256ilaa
  gbl\u0254 n\u025b be: \u201cAle Afet\u0254 gbl\u0254e nye esi: \u2018Esi n\u00e8\u0256e
  asi le \u014butsu si megbl\u0254 be woatsr\u0254\u0303 la \u014bu w\u00f2si ta la,
  w\u00f2 agbe ax\u0254 \u0256e efe agbe tefe, eye w\u00f2 duk\u0254 ax\u0254 \u0256e
  efe duk\u0254 tefe.\u2019\u201d\\n43 Eye Israel-fia la yi efe afe me le Samaria,
  nya la te \u0256e edzi, eye w\u00f2l\u00e9 blanui.\\n1 FIAWO 21\\n1 Le nu siawo
  megbe la, nya a\u0256e dz\u0254 ku \u0256e waingble a\u0256e si nye Yezreelt\u0254
  Nabot t\u0254 la \u014bu; waingble la le Yezreel, le Samaria-fia Ahab fe fias\u00e3
  la xa.\\n2 Eye Ahab gbl\u0254 na Nabot be: \u201cTs\u0254 w\u00f2 waingble la nam
  ne mats\u0254 aw\u0254 amab\u0254e, elabena ete \u0256e nye afe \u014bu. Eye na
  mats\u0254 waingble bubu si nyo wui la a\u0256o etefe na w\u00f2. Alo ne edze \u014buw\u00f2
  la, maxe ga home si w\u00f2ax\u0254 la na w\u00f2.\u201d\\n3 Ke Nabot \u0256o e\u014bu
  na Ahab be: \u201cMes\u0254 le Afet\u0254 \u014bkume be mats\u0254 t\u0254gbuinyewo
  fe domenyinu la ana w\u00f2 o.\u201d\\n4 Eya ta Ahab yi afe me, nya la te \u0256e
  edzi eye w\u00f2l\u00e9 blanui, le ale si Yezreelt\u0254 Nabot \u0256o nya \u014bu
  n\u025b be, \u201cNyemats\u0254 t\u0254gbuinyewo fe domenyinu la ana w\u00f2 o\u201d
  la ta. Eyi \u0256aml\u0254 anyi \u0256e efe aba dzi hetr\u0254 mo \u0256e aga, eye
  w\u00f2gbe nu\u0256u\u0256u.\\n5 Sr\u0254\u0303a Izebel va egb\u0254 hebiae be:
  \u201cNu ka tae n\u00e8l\u00e9 blanui hegbe nu\u0256u\u0256u?\u201d\\n6 E\u0256o
  e\u014bu n\u025b be: \u201cElabena megbl\u0254 na Yezreelt\u0254 Nabot be, \u2018Ts\u0254
  w\u00f2 waingble la nam mafle. Alo ne \u00e8l\u0254\u0303 la, na mats\u0254 waingble
  bubu ana w\u00f2 \u0256e etefe.\u2019 Ke egbl\u0254 be: \u2018Nyemats\u0254 nye
  waingble la ana w\u00f2 o.\u2019\u201d\\n7 Sr\u0254\u0303a Izebel gbl\u0254 n\u025b
  be: \u201cMenye w\u00f2e nye fia le Israel dzi \u0256um oa? F\u0254 n\u00e0\u0256u
  nu, eye dzi nadz\u0254 w\u00f2. Mats\u0254 Yezreelt\u0254 Nabot fe waingble la ana
  w\u00f2.\u201d\\n8 Eya ta e\u014bl\u0254 agbal\u1ebdwo le Ahab fe \u014bk\u0254
  me hets\u0254 fia la fe \u014bk\u0254sig\u025b tre wo nu, eye w\u00f2\u0256o agbal\u1ebdawo
  \u0256e ametsitsiawo kple bubume siwo le Nabot fe du la me.\\n9 Ke e\u014bl\u0254
  \u0256e agbal\u1ebdawo me be: \u201cMi\u0256e gbef\u00e3 nutsitsid\u0254, eye mina
  Nabot nan\u0254 duk\u0254 la \u014bg\u0254.\\n10 Eye mina \u014butsu yakame eve
  nab\u0254b\u0254 n\u0254 e\u014bg\u0254, eye woatso enu be: \u2018\u0203o fi de
  Mawu kple fia la!\u2019 Eye miakpl\u0254e ado goe ne miafu kpee w\u00f2aku.\u201d\\n11
  Ale dua me \u014butsuwo, ametsitsiawo kple bubume siwo n\u0254 dua me la, w\u0254
  abe ale si tututu wo\u014bl\u0254e \u0256e agbal\u1ebd siwo Izebel \u0256o \u0256e
  wo me ene.\\n12 Wo\u0256e gbef\u00e3 nutsitsid\u0254, eye wona Nabot n\u0254 duk\u0254
  la \u014bg\u0254.\\n13 Eye \u014butsu eve siwo nye yakamewo va n\u0254 anyi \u0256e
  e\u014bg\u0254 eye wotso Nabot nu le duk\u0254 la \u014bkume be: \u201cNabot fo
  fi de Mawu kple fia la!\u201d Emegbe wokpl\u0254e yi dua godo \u0256afu kpee w\u00f2ku.\\n14
  Eye wod\u0254 ame \u0256o \u0256e Izebel be: \u201cWofu kpe Nabot w\u00f2ku.\u201d\\n15
  Esi Izebel nya se be wofu kpe Nabot w\u00f2ku ko la, egbl\u0254 na Ahab be: \u201cTso
  n\u00e0x\u0254 Yezreelt\u0254 Nabot fe waingble si w\u00f2gbe be yemats\u0254 ana
  w\u00f2 n\u00e0fle o la, elabe Nabot megale agbe o, eku.\u201d\\n16 Esi Ahab nya
  se be Nabot ku ko la, Ahab tso enumake yi Yezreelt\u0254 Nabot fe waingble la me
  be yeax\u0254e w\u00f2azu ye t\u0254.\\n17 Ke Afet\u0254 fe gbe va na Eliya Tisbit\u0254
  la be:\\n18 \u201cTso n\u00e0yi a\u0256ado go Israel-fia Ahab, si le Samaria. Ele
  Nabot fe waingble si me w\u00f2yi be yeax\u0254 la me.\\n19 Gbl\u0254 n\u025b be,
  \u2018Ale Afet\u0254 gbl\u0254e nye esi: \u201c\u00c8wu ame tso, eye n\u00e8gax\u0254
  efe nu h\u00e3 w\u00f2zu t\u0254w\u00f2a?\u201d\u2019 Eye n\u00e0gbl\u0254 n\u025b
  be, \u2018Ale Afet\u0254 gbl\u0254e nye esi: \u201cAfi si avuwo \u0256u\u0256\u0254
  Nabot fe \u028bu le la, afi mae avuwo a\u0256u\u0256\u0254 w\u00f2 h\u00e3 w\u00f2
  \u028bu le.\u201d\u2019\u201d\\n20 Eye Ahab gbl\u0254 na Eliya be: \u201cOo nye
  fut\u0254, \u00e8ke \u0256e \u014bunyea?\u201d E\u0256o e\u014bu be: \u201cMeke
  \u0256e \u014buw\u00f2. \u2018Esi n\u00e8ts\u0254 v\u0254\u0303w\u0254w\u0254 \u0256o
  d\u0254e le Afet\u0254 \u014bkume ta la,\\n21 kp\u0254 \u0256a, mehe v\u0254\u0303
  gb\u0254na dziw\u00f2, eye makpl\u0254 yow\u00f2me fiafiafia, eye matsr\u0254\u0303
  Ahab fe \u014butsuwo kat\u00e3, ame siwo nye w\u0254naman\u0254\u014but\u0254wo
  kple ame beliwo g\u0254\u0303 h\u00e3 \u0256a le Israel.\\n22 Eye maw\u0254 w\u00f2
  afe abe Yeroboam, Nebat vi, fe afe kple Baasa, Ahiya vi, fe afe ene, le dziku si
  n\u00e8do nam hena Israel w\u0254 nu v\u0254\u0303 la ta.\u2019\\n23 Eye ale Afet\u0254
  gbl\u0254 le Izebel h\u00e3 \u014bue nye esi: \u2018Avuwo a\u0256u Izebel ke\u014bke\u014b
  le Yezreel-nyigba dzi.\\n24 Ahab fe ame si aku \u0256e du me la, avuwo a\u0256ui;
  eye efe ame si aku \u0256e gbe me la, dzifoxewo a\u0256ui.\\n25 Nyatefee, ame a\u0256eke
  megan\u0254 anyi kp\u0254 abe Ahab ene, ame si ts\u0254 nu si nye v\u0254\u0303
  le Afet\u0254 \u014bkume la w\u0254w\u0254 \u0256o d\u0254e, le esi sr\u0254\u0303a
  Izebel foe \u0256e enu ta o.\\n26 Ew\u0254 \u014buny\u0254nu wu, le esi w\u00f2dze
  legba ny\u0254\u014buwo yome, abe ale si Amorit\u0254 siwo Afet\u0254 nya le Israel-viwo
  \u014bg\u0254 la kat\u00e3 w\u0254 la ene.\u2019\u201d\\n27 Esi Ahab nya se nya
  siawo ko la, edze efe awuwo, ta akpanya, eye w\u00f2tsi nu d\u0254, etsi akpanya
  me d\u0254, eye w\u00f2n\u0254 yiyim kpookpookpoo.\\n28 Eye Afet\u0254 fe gbe va
  na Eliya Tisbit\u0254 la be:\\n29 \u201c\u00c8kp\u0254 ale si Ahab b\u0254b\u0254
  e\u0256okui le \u014bkunyemea? Esi w\u00f2b\u0254b\u0254 e\u0256okui le \u014bkunyeme
  ta la, nyemahe v\u0254\u0303 la v\u025b le e\u014b\u0254li o. Mahe v\u0254\u0303
  la ava efe afe la dzi le via \u014b\u0254li.\u201d\\n1 FIAWO 22\\n1 A\u028ba megan\u0254
  Siria kple Israel dome o fe et\u0254\u0303 s\u0254\u014b.\\n2 Le fe et\u0254\u0303lia
  me la, Yuda-fia Yehosafat yi Israel-fia gb\u0254.\\n3 Israel-fia gbl\u0254 na e\u014bumewo
  be: \u201cMienya be m\u00eda t\u0254e Ramot-Gilead nyea? Ev\u0254 m\u00edele hehem
  \u0256e megbe le ex\u0254x\u0254 le Siria-fia si \u014bu.\u201d\\n4 Eye w\u00f2bia
  Yehosafat be: \u201c\u00c0ho a\u028ba kplim \u0256e Ramot-Gilead \u014bua?\u201d
  Yehosafat \u0256o e\u014bu na Israel-fia la be: \u201cNye kpli w\u00f2 la, ame \u0256ekae
  m\u00edenye. Nye duk\u0254 la, w\u00f2 duk\u0254e. Nye s\u0254wo la, w\u00f2 s\u0254woe.\u201d\\n5
  Gake Yehosafat gbl\u0254 na Israel-fia be: \u201cMe\u0256e kuku, bia gbe Afet\u0254
  gb\u00e3.\u201d\\n6 Eya ta Israel-fia la fo nyagbl\u0254\u0256ilawo nu fu, woan\u0254
  ame alafa ene, eye w\u00f2bia wo be: \u201cMaho a\u028ba \u0256e Ramot-Gilead \u014bu
  loo alo matasia?\u201d Eye wo\u0256o e\u014bu n\u025b be: \u201cHo yi, eye Afet\u0254
  ats\u0254e ade asi na fia la.\u201d\\n7 Ke Yehosafat gbl\u0254 be: \u201c\u00d0e
  Afet\u0254 fe nyagbl\u0254\u0256ila a\u0256eke megale afi sia oa? Mina m\u00edabia
  gbe eya h\u00e3 kp\u0254.\u201d\\n8 Eye Israel-fia \u0256o e\u014bu na Yehosafat
  be: \u201cAme \u0256eka gali si gb\u0254 m\u00edabia gbe Afet\u0254 le; ke mel\u00e9
  fui, elabena megbl\u0254a nya nyui a\u0256eke \u0256i le \u014bunye o, negbe nya
  v\u0254\u0303wo ko, eyae nye Mikaya, Yimla vi.\u201d Ke Yehosafat gbl\u0254 be:
  \u201cFia megagbl\u0254 nya ma o.\u201d\\n9 Eya ta Israel-fia la y\u0254 fia\u014bume
  \u0256eka gbl\u0254 be: \u201cYi \u0256akpl\u0254 Mikaya, Yimla vi, v\u025b fifi
  laa.\u201d\\n10 Ke Israel-fia kple Yuda-fia Yehosafat le wofe fiawuwo me, eye wo
  domet\u0254 \u0256e sia \u0256e b\u0254b\u0254 n\u0254 efe fiazikpui dzi le nukufofe
  le Samaria dua fe agbo nu, eye nyagbl\u0254\u0256ilawo kat\u00e3 n\u0254 nya gbl\u0254m
  \u0256i le wo \u014bkume.\\n11 Eye Zedekiya, Kenaana vi la, ts\u0254 ga w\u0254
  l\u00e3dzowo, eye w\u00f2gbl\u0254 be: \u201cAle Afet\u0254 gbl\u0254e nye esi,
  \u2018Esiawoe n\u00e0ts\u0254 atu Siriat\u0254wo va se \u0256e esime n\u00e0tsr\u0254\u0303
  wo ke\u014bke\u014b.\u2019\u201d\\n12 Eye nyagbl\u0254\u0256ila bubuawo kat\u00e3
  h\u00e3 n\u0254 nya \u0256eka ma ke gbl\u0254m \u0256i be: \u201cHo yi Ramot-Gilead,
  eye adze edzi na w\u00f2; Afet\u0254 ats\u0254e ade asi na fia la.\u201d\\n13 Ame
  d\u0254d\u0254 si yi Mikaya y\u0254 ge la gbl\u0254 n\u025b be: \u201cKp\u0254 \u0256a!
  Nyagbl\u0254\u0256ilawo kat\u00e3 fe nu s\u0254, eye wogbl\u0254 nya nyui na fia
  la. Me\u0256e kuku, na w\u00f2 h\u00e3 w\u00f2 nya nan\u0254 abe wo t\u0254 ene,
  eye n\u00e0fo nu nyuie.\u201d\\n14 Ke Mikaya gbl\u0254 be: \u201cZi ale si Afet\u0254
  le agbe la, nya si Afet\u0254 agbl\u0254 nam lae magbl\u0254.\u201d\\n15 Esi w\u00f2va
  fiaa gb\u0254 la, fia la biae be: \u201cMikaya, m\u00edho a\u028ba \u0256e Ramot-Gilead
  \u014bu loo alo m\u00edtasia?\u201d E\u0256o e\u014bu enumake be: \u201cHo yi, eye
  \u00e0\u0256u dzi; Afet\u0254 ats\u0254e ade asi na fia la.\u201d\\n16 Eye fia la
  biae be: \u201cZi neni g\u0254\u0303 mana n\u00e0ka atam be n\u00e0gbl\u0254 nyatefe
  s\u0254\u014b ko nam le Afet\u0254 fe \u014bk\u0254 me?\u201d\\n17 Eya ta egbl\u0254
  be: \u201cMekp\u0254 Israel-viwo kat\u00e3 kaka \u0256e towo dzi, abe al\u1ebd siwo
  nu kpl\u0254la a\u0256eke mele o ene. Afet\u0254 gbl\u0254 be: \u2018Afet\u0254
  a\u0256eke mele wo nu o. Wo domet\u0254 \u0256e sia \u0256e negbugb\u0254 yi afe
  me le \u014butifafa me.\u2019\u201d\\n18 Eye Israel-fia la gbl\u0254 na Yehosafat
  be: \u201cNyemegbl\u0254e na w\u00f2 be, \u2018Magbl\u0254 nya nyui a\u0256eke \u0256i
  le \u014bunye o, negbe nya v\u0254\u0303wo ko\u2019 oa?\u201d\\n19 Mikaya gagbl\u0254
  be: \u201cEya ta se Afet\u0254 fe nya: Mekp\u0254 Afet\u0254 w\u00f2b\u0254b\u0254
  n\u0254 efe fiazikpui dzi, eye dzifo\u028bak\u0254 blibo la kat\u00e3 t\u0254 \u0256e
  egb\u0254, le efe \u0256usime kple efe miame.\\n20 Eye Afet\u0254 bia be, \u2018Ame
  kae aflu Ahab, ne w\u00f2aho ayi a\u0256atsi a\u028ba le Ramot-Gilead?\u2019 Ame
  si gbl\u0254 be ale, eye ame kem\u025b be ale.\\n21 Ml\u0254eba gb\u0254gb\u0254
  a\u0256e te va het\u0254 \u0256e Afet\u0254 \u014bkume gbl\u0254 be, \u2018Maflui.\u2019
  Afet\u0254 biae be, \u2018Aleke n\u00e0w\u0254e?\u2019\\n22 E\u0256o e\u014bu be,
  \u2018Mayi a\u0256azu beblegb\u0254gb\u0254 le efe nyagbl\u0254\u0256ilawo kat\u00e3
  fe nu me.\u2019 Eye w\u00f2gbl\u0254 be, \u2018\u00c0te \u014bu aflui, eye \u00e0kp\u0254
  dzidzedze h\u00e3. Heyi \u0256aw\u0254e nenema.\u2019\\n23 Eye Afet\u0254 ts\u0254
  beblegb\u0254gb\u0254 de w\u00f2 nyagbl\u0254\u0256ila siawo kat\u00e3 fe nu me,
  ev\u0254 w\u00f2nye Afet\u0254 \u0256o v\u0254\u0303 \u0256e \u014buw\u00f2.\u201d\\n24
  Eye Zedekiya, Kenaana vi, te va fo tome na Mikaya gbl\u0254 be: \u201cM\u0254 kae
  Afet\u0254 fe gb\u0254gb\u0254 la to dzo le gb\u0254nye hafi va fo nu kpli w\u00f2
  ya?\u201d\\n25 Mikaya \u0256o e\u014bu be: \u201cKp\u0254 \u0256a! Gbe si gbe n\u00e0ge
  \u0256e x\u0254 ememet\u0254 me be yeabe la, \u00e0kp\u0254 m\u0254a.\u201d\\n26
  Eye Israel-fia la \u0256e gbe be: \u201cMil\u00e9 Mikaya yi \u0256ade dunun\u0254la
  Amon kple fiavi Yoas si.\\n27 Eye migbl\u0254 na wo be, \u2018Ale fia la gbl\u0254e
  nye esi: \u201cMits\u0254 ame sia de gax\u0254 me, eye mina abolo vi a\u0256e kple
  tsi vi a\u0256e koe va se \u0256e esime magb\u0254 le \u014butifafa me.\u201d\u2019\u201d\\n28
  Ke Mikaya \u0256o e\u014bu be: \u201cNe \u00e8tr\u0254 gb\u0254 le \u014butifafa
  me la, ekema Afet\u0254 mefo nu kplim o.\u201d Eye w\u00f2gbl\u0254 kpee be: \u201cMi
  duk\u0254wo kat\u00e3, mide dzesii!\u201d\\n29 Ke Israel-fia kple Yuda-fia Yehosafat
  ho yi Ramot-Gilead.\\n30 Eye Israel-fia gbl\u0254 na Yehosafat be: \u201cMatr\u0254
  nye dzedzeme ahayi a\u028ba la nu, ke w\u00f2 la, n\u0254 w\u00f2 fiawu me.\u201d
  Ale Israel-fia la tr\u0254 efe dzedzeme heyi a\u028ba la nu.\\n31 Ke Siria-fia de
  se na efe tasia\u0256am-meg\u00e3 blaet\u0254\u0303 v\u0254 eveawo be: \u201cMigaw\u0254
  a\u028ba kple ame ts\u025b alo ame \u014bkuta a\u0256eke o, negbe Israel-fia la
  ko.\u201d\\n32 Esi tasia\u0256am-meg\u00e3wo kp\u0254 Yehosafat ko la, wogbl\u0254
  be: \u201cEyae nye Israel-fia la!\u201d Eya ta wotr\u0254 \u0256e e\u014bu be yewoaw\u0254
  a\u028ba kplii; eye Yehosafat de asi \u0263lidodo me be woax\u0254 na ye.\\n33 Esi
  tasia\u0256am-meg\u00e3wo kp\u0254 be menye Israel-fia lae o ko la, wogbugb\u0254
  le eyome enumake.\\n34 Ke \u014butsu a\u0256e vu efe da me hedae \u0256e yame ko,
  eye a\u014butr\u0254a va te Israel-fia le efe gawua kpefe. Eya ta fia la gbl\u0254
  na efe tasia\u0256amdola la be: \u201cTr\u0254, n\u00e0kpl\u0254m dzoe le a\u028bagbea
  dzi, elabena mex\u0254 abi vevie.\u201d\\n35 Wow\u0254 a\u028ba la \u014bkeke bliboa
  kat\u00e3, eye wol\u00e9 fia la \u0256e tsitrenu le efe tasia\u0256am la me w\u00f2dze
  \u014bg\u0254 Siriat\u0254wo. Efe abia \u0256u\u0256u \u028bu \u0256e a\u028batasia\u0256am
  la me, eye w\u00f2ku le fi\u1ebd me.\\n36 Le \u0263e\u0256oto l\u0254fo la, \u0263li
  \u0256i ses\u0129e le asa\u0256a la me be: \u201cAme sia ame neyi efe du me! Ame
  sia ame neyi efe anyigba dzi!\u201d\\n37 Fia la ku eye wok\u0254e va Samaria; wo\u0256i
  fia la \u0256e Samaria.\\n38 Esi wova kl\u0254 a\u028batasia\u0256am la le Samaria-ta
  to la, avuwo va \u0256u\u0256\u0254 efe \u028bu, eye gbolowo va le tsi le afi ma
  le Afet\u0254 fe nya si w\u00f2gbl\u0254 la nu.\\n39 Ke Ahab \u014butinya sus\u0254eawo
  kple nu siwo kat\u00e3 w\u00f2w\u0254, nyi\u0256ux\u0254 si w\u00f2tu kple du siwo
  kat\u00e3 w\u00f2tso la, wo\u014bl\u0254 wo \u0256e Israel-fiawo fe \u014butinyagbal\u1ebd
  me.\\n40 Eye wots\u0254 Ahab ml\u0254 t\u0254gbuiawo gb\u0254; eye via Ahaziya zu
  fia \u0256e etefe.\\n41 Ke Yehosafat, Asa vi, zu fia \u0256e Yuda dzi le Israel-fia
  Ahab fe fe enelia me.\\n42 Yehosafat x\u0254 fe blaet\u0254\u0303 v\u0254 at\u0254\u0303
  esime w\u00f2zu fia, eye w\u00f2\u0256u fia fe blaeve v\u0254 at\u0254\u0303 le
  Yerusalem. Dadaa \u014bk\u0254e nye Azuba, Silhi viny\u0254nu.\\n43 Eto fofoa Asa
  fe \u028be me. Mete \u0256e aga o, ke bo\u014b ew\u0254 nu si le dz\u0254dz\u0254e
  le Afet\u0254 \u014bkume. Gake wome\u0256e nuxefewo \u0256a o, eye duk\u0254 la
  gasaa v\u0254 hedoa dzudz\u0254 le nuxefewo kokoko.\\n44 \u014autifafa n\u0254 Yehosafat
  kple Israel-fia dome.\\n45 Ke Yehosafat \u014butinya sus\u0254eawo, efe kal\u1ebdw\u0254w\u0254wo
  kple ale si w\u00f2w\u0254 a\u028bae la, wo\u014bl\u0254 wo \u0256e Yuda-fiawo fe
  \u014butinyagbal\u1ebd me.\\n46 E\u0256e \u014butsu siwo gb\u0254 \u014butsuwo d\u0254na
  le gbedox\u0254 me, siwo sus\u0254 le fofoa Asa \u014b\u0254li la h\u00e3 \u0256a
  le anyigba la dzi.\\n47 Ke fia a\u0256eke men\u0254 Edom o; fiatefen\u0254lae n\u0254
  dzi \u0256um le afi ma.\\n48 Yehosafat d\u0254 Tarsis t\u0254dzi\u028buwo be woayi
  a\u0256ats\u0254 sika tso Ofir v\u025b, ke womete \u014bu de o, elabena t\u0254dzi\u028buawo
  gb\u00e3 le Ezion-Geber.\\n49 \u0194ema\u0263ie Ahaziya, Ahab vi, gbl\u0254 na Yehosafat
  be: \u201cNa nye d\u0254lawo nan\u0254 t\u0254dzi\u028buawo me ayi kple w\u00f2
  d\u0254lawo,\u201d gake Yehosafat mel\u0254\u0303 o.\\n50 Eyome wots\u0254 Yehosafat
  ml\u0254 t\u0254gbuiawo gb\u0254, wo\u0256ii \u0256e t\u0254gbuiawo gb\u0254 le
  t\u0254gbuia David \u0191e Du la me; eye via Yehoram zu fia \u0256e etefe.\\n51
  Ahaziya, Ahab vi, zu fia \u0256e Israel dzi le Samaria le Yuda-fia Yehosafat fe
  fe wuiadrelia me, eye w\u00f2\u0256u Israel dzi fe eve.\\n52 Ew\u0254 nu si nye
  v\u0254\u0303 le Afet\u0254 \u014bkume, eye w\u00f2to fofoa kple dadaa kpakple Yeroboam,
  Nebat vi, si he Israel de nu v\u0254\u0303 me la, fe \u028be me.\\n53 Esub\u0254
  Baal hede ta agu n\u025b, eye w\u00f2do dziku na Afet\u0254, Israel fe Mawu la,
