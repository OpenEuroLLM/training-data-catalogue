  \u014buti n\u00e0kpl\u0254m ayi na fofow\u00f2?\u201d\\n9 Yonatan \u0256o e\u014bu
  n\u025b be: \u201cNede megbe xaa be maw\u0254 nu ma t\u0254gbi \u0256e \u014buw\u00f2!
  Ne menyae be fofonye \u0256o tame v\u0254\u0303 \u0256e \u014buw\u00f2 la, \u0256e
  nyemagbl\u0254e na w\u00f2 oa?\u201d+\\n10 Eye David bia Yonatan be: \u201cNe fofow\u00f2
  da gbe \u0256e gb\u0254w\u00f2 \u0256e, ame kae agbl\u0254e nam?\u201d\\n11 Yonatan
  gbl\u0254 na David be: \u201cW\u00f2 ya va m\u00edayi gbe me.\u201d Ale wo kple
  eve la woyi gbe me.\\n12 Eye Yonatan gbl\u0254 na David be: \u201cYehowa, Israel
  fe Mawu la, nanye \u0256asefo, be ets\u0254 \u0263ealewo\u0263i, alo \u014bkeke
  et\u0254\u0303a gbe la, mate fofonye fe nu me ase. Ne susu nyui le esi \u0256e David
  \u014bu la, ekema \u0256e nyemad\u0254 ame \u0256e w\u00f2 woava gbl\u0254e na w\u00f2
  oa?\\n13 Ke ne fofonye di be yeaw\u0254 v\u0254\u0303 w\u00f2, gake nyemeva gbl\u0254e
  na w\u00f2 o hedo m\u0254 w\u00f2 le \u014butifafa me o la, ekema Yehowa nefia Yonatan,
  eye w\u00f2agafiae \u0256e edzi. Yehowa nen\u0254 kpli w\u00f2+ abe ale si w\u00f2n\u0254
  kple fofonye ene.+\\n14 Eye ne megale agbe la, \u0256e m\u00e0\u0256e Yehowa fe
  amenuveve afiam, eye ne meku h\u00e3 m\u00e0\u0256ee afiam oa?+\\n15 Eye w\u00f2
  amenuveve la nu megatso le afenye me o tegbee,+ ne Yehowa \u0256e David fe fut\u0254wo
  kat\u00e3 \u0256a le anyigba dzi g\u0254\u0303 h\u00e3.\u201d\\n16 Eya ta Yonatan
  bla nu kple David fe afe gbl\u0254 be, \u201cYehowa abia ak\u0254nta tso David fe
  fut\u0254wo si.\u201d\\n17 Ale Yonatan gana David ka atam n\u025b \u0256e l\u0254l\u0254\u0303
  si w\u00f2ts\u0254 l\u0254\u0303e la dzi, elabena el\u0254\u0303e abe ale si w\u00f2l\u0254\u0303
  eya \u014but\u0254 \u0256okui ene.+\\n18 Eye Yonatan gbl\u0254 n\u025b be: \u201cEts\u0254e
  nye dzinu yeye,+ eye woade dzesii be m\u00e8li o, elabena w\u00f2 zikpui atsi fuflu.\\n19
  Woagade dzesi w\u00f2 anyiman\u0254man\u0254 la wu le \u014bkeke et\u0254\u0303a
  gbe, eya ta yi afi si n\u00e8be \u0256o ts\u00e3 la, eye n\u00e0n\u0254 kpe sia
  xa.\\n20 Mada a\u014butr\u0254 et\u0254\u0303 \u0256o \u0256e kpea xa, abe nanee
  medzidze da ene.\\n21 Ne med\u0254 sub\u0254vi a\u0256e \u0256a la, magbl\u0254
  be: \u2018Yi \u0256adi a\u014butr\u0254awo.\u2019 Ne megbl\u0254 na sub\u0254via
  be: \u2018Kp\u0254 \u0256a! A\u014butr\u0254awo le axaw\u00f2 afii, f\u0254 wo\u2019
  la, ekema va, elabena zi ale si Yehowa le agbe la, efia be \u014buw\u00f2 fa, v\u0254\u0303
  a\u0256eke madz\u0254 \u0256e dziw\u00f2 o.\\n22 Ke ne megbl\u0254 na \u0256ekakpui
  la be: \u2018Kp\u0254 \u0256a! A\u014butr\u0254awo le \u014bg\u0254w\u00f2 \u0256aa\u2019
  la, ekema dzo, elabena Yehowa do m\u0254 w\u00f2.\\n23 Ke nya siwo nye kpli w\u00f2
  m\u00edegbl\u0254+ la, Yehowa nen\u0254 nye kpli w\u00f2 dome tegbee.\u201d+\\n24
  Eye David \u0263la e\u0256okui \u0256e gbea me. Esi dzinu yeye \u0256o la, fia la
  b\u0254b\u0254 n\u0254 efe zikpui dzi be yea\u0256u nu.+\\n25 Fia la b\u0254b\u0254
  n\u0254 tefe si w\u00f2n\u0254na edziedzi le glia \u014bu. Yonatan dze \u014bg\u0254e,
  eye Abner+ b\u0254b\u0254 n\u0254 Saul xa, ke David fe n\u0254fe ya tsi fuflu.\\n26
  Saul megbl\u0254 nya a\u0256eke gbe ma gbe o, elabena ebu be: \u2018Nanee dz\u0254,
  ale be e\u014bu mek\u0254 o.+ \u0190\u0303, anye e\u014butie mek\u0254 o.\u2019\\n27
  Eye le \u014bkeke evea gbe, si nye \u014bkeke si kpl\u0254 dzinu yeyea \u0256o dzi
  la, David fe n\u0254fe la gatsi fuflu kokoko. Eye Saul bia via Yonatan be: \u201cNu
  ka tae Isai+ vi la meva nua \u0256ufe ets\u0254 kple egbe siaa o?\u201d\\n28 Yonatan
  \u0256o e\u014bu na Saul be: \u201cDavid \u0256e kuku nam be ma\u0256e m\u0254 na
  ye yeayi Betlehem.+\\n29 Eye w\u00f2gbl\u0254 be: \u2018Me\u0256e kuku, na mayi,
  elabena m\u00edafe fomea le v\u0254 sa ge le dua me, eye n\u0254vinyee \u0256o du
  \u0256em. Eya ta ne \u00e8ve nunye la, ekema me\u0256e kuku, na mafu du ayi a\u0256akp\u0254
  n\u0254vinyewo \u0256a.\u2019 Esia tae meva fia fe kpl\u0254\u0303 \u014bu o \u0256o.\u201d\\n30
  Ale Saul do d\u0254medzoe \u0256e Yonatan \u014bu vevie gbl\u0254 n\u025b be: \u201cW\u00f2
  ny\u0254nu dzeagl\u00e3 fe vi, menyae nyuie be, \u00e8tia Isai vi la be n\u00e0ts\u0254
  ado \u014bukpe \u0256okuiw\u00f2, eye n\u00e0do \u014bukpe daw\u00f2.\\n31 Elabena
  \u014bkeke ale si Isai vi la le agbe le anyigba dzi la, w\u00f2 \u014but\u0254 kple
  w\u00f2 fianyenye la miali ke o.+ Eya ta d\u0254, ne woa\u0256akpl\u0254e v\u025b
  nam, elabena edze na ku.\u201d+\\n32 Ke Yonatan bia fofoa Saul be: \u201cNu ka tae
  woawui \u0256o?+ Nu kae w\u00f2w\u0254?\u201d\\n33 Enumake Saul da akpl\u0254 be
  yeat\u0254e,+ eye Yonatan dze sii be ye fofo \u0256oe kplikpaa be yeawu David.+\\n34
  Enumake dzi ku Yonatan vevie w\u00f2tso le kpl\u0254\u0303a \u014bu, eye me\u0256u
  abolo le dzinu yeye fe \u014bkeke evelia dzi o, elabena David fe nya la te \u0256e
  edzi,+ eye eya \u014but\u0254 fofoa do \u014bukpee.\\n35 Esi \u014bu ke la, Yonatan
  dze m\u0254 yi gbe me le tefe si eya kple David wo\u0256o \u0256i be yewoakpe le,
  eye \u0256ekakpui dzaa a\u0256e si nye efe sub\u0254vi la n\u0254 e\u014bu.+\\n36
  Eye w\u00f2gbl\u0254 na efe sub\u0254vi la be: \u201cMe\u0256e kuku, fu du yi \u0256adi
  a\u014butr\u0254 siwo da ge mala.\u201d Sub\u0254vi la fu du yi, eye Yonatan da
  a\u014butr\u0254 la to eta.\\n37 Esi sub\u0254via \u0256o afi si a\u014butr\u0254
  si Yonatan da la dze la, Yonatan do \u0263li \u0256e sub\u0254vi la yome gbl\u0254
  be: \u201cAlo menye a\u014butr\u0254 lae nye ema \u0256aa le \u014bg\u0254w\u00f2
  oa?\u201d\\n38 Eye Yonatan gado \u0263li ake \u0256e sub\u0254via yome be: \u201c\u00d0e
  abla! Nets\u0254! M\u00e8gat\u0254 o!\u201d Eye Yonatan fe sub\u0254vi la yi \u0256af\u0254
  a\u014butr\u0254awo heva efe afet\u0254 gb\u0254.\\n39 Ke sub\u0254via menya nu
  si le edzi yim o; negbe Yonatan kple David koe nya.\\n40 Emegbe Yonatan ts\u0254
  efe a\u028baw\u0254nuawo na efe sub\u0254vi la gbl\u0254 n\u025b be: \u201cTs\u0254
  wo yi dua me.\u201d\\n41 Esi sub\u0254via dzo la, David do go tso afi ma l\u0254fo,
  le anyiehe gome. Eye w\u00f2dze klo tsy\u0254 mo anyi zi et\u0254\u0303, eye wogbugb\u0254
  nu na wo n\u0254ewo hefa avi \u0256e wo n\u0254ewo dzi, ke David fe avifafa nu s\u1ebd
  wu.\\n42 Eye Yonatan gbl\u0254 na David be: \u201cHeyi le \u014butifafa me, elabena
  m\u00ed ame evea m\u00edeka atam+ le Yehowa fe \u014bk\u0254 me be: \u2018Yehowa
  nen\u0254 nye kpli w\u00f2 dome, eye w\u00f2an\u0254 nye dzidzimeviwo kple w\u00f2
  dzidzimeviwo dome tegbee.\u2019\u201d+Ale David tso dze m\u0254, eye Yonatan h\u00e3
  yi dua me.\"", "\"NE \u00c8KU, eye wogagb\u0254 agbe w\u00f2 \u0256e, aleke daw\u00f2
  aw\u0254? Akp\u0254 dzidz\u0254 \u014but\u0254! Gake \u0256e amesi ku la agate \u014bu
  agb\u0254 agbea? \u00d0e w\u00f2dz\u0254 kp\u0254a?\\nKp\u0254 \u014butsu ma, ny\u0254nu
  ma, kple \u014butsuvi ma \u0256a. \u014autsu lae nye nyagbl\u0254\u0256ila Eliya.
  Ny\u0254nu la, nye ahosi a\u0256e, si tso Zarpat, eye viae nye \u014butsuvi la.
  Gbe\u0256eka la, \u014butsuvi la dze d\u0254. D\u0254a ses\u1ebd ale gbegbe be w\u00f2ku.
  Eye Eliya gbl\u0254 na ny\u0254nu la be: \u2018Ts\u0254 \u0256evi la nam.\u2019\\nEliya
  k\u0254 \u0256evi la yi x\u0254tax\u0254 mee hets\u0254e ml\u0254 aba dzi. Edo gbe
  \u0256a be: \u2018O Yehowa, na \u0256evi sia nagagb\u0254 agbe.\u2019 Tete \u0256evi
  la de asi gb\u0254gb\u0254 me! Eye Eliya k\u0254e tso x\u0254tax\u0254a me \u0256i
  va anyi hegbl\u0254 na dadaa be: \u2018Kp\u0254 \u0256a, viw\u00f2 la gb\u0254 agbe!\u2019
  Esia tae dadaa kp\u0254 dzidz\u0254 alea gbegbe \u0256o.\\nYehowa fe nyagbl\u0254\u0256ila
  vevi bubu a\u0256e \u014bk\u0254e nye Elisa. Esub\u0254na abe Eliya fe kpe\u0256e\u014but\u0254
  ene. Gake emegbe la, Yehowa na Elisa h\u00e3 w\u0254 nukunuwo. Gbe\u0256eka la,
  Elisa yi Sunem, afisi ny\u0254nu a\u0256e nyo d\u0254me n\u025b le. Emegbe la, ny\u0254nu
  sia dzi \u014butsuvi.\\nGbe\u0256eka \u014bdi, esi \u0256evia tsi la, eyi fofoa
  gb\u0254 le agble me. Tete \u0256evia do \u0263li be: \u2018Nye ta le veyem!\u2019
  Wok\u0254 \u0256evia yi afemee, eye emegbe w\u00f2ku. Dadaa l\u00e9 blanui \u014but\u0254!
  Enumake w\u00f2yi \u0256ay\u0254 Elisa.\\nEsi Elisa va la, ek\u0254 \u0256evi kuku
  la yi x\u0254 mee. Edo gbe \u0256a na Yehowa hetsy\u0254 ak\u0254 \u0256e \u0256evi
  la dzi. Tete \u0256evi la x\u0254 dzo, eye w\u00f2ny\u00e8 zi adre. Dadaa kp\u0254
  dzidz\u0254 ale gbegbe esi w\u00f2va kp\u0254 be ye vi la gb\u0254 agbe!\\nAme ge\u0256e
  woku. Esia na wofe fomet\u0254wo kple x\u0254l\u0254\u0303wo l\u00e9 blanui vevie.
  \u014aus\u1ebd mele m\u00eda si be m\u00edaf\u0254 ame kukuwo o. Gake \u014bus\u1ebd
  le Yehowa si. Emegbe la, m\u00edasr\u0254\u0303 alesi w\u00f2af\u0254 ame akpeakpewo
  va agbe mee.\\nFiawo I, 17:8-24; Fiawo II, 4:8-37.\\nNyabiabiawo\\n- Amekawoe nye
  ame et\u0254\u0303 siwo le n\u0254n\u0254metataa me, eye nukae dz\u0254 \u0256e
  \u014butsuvia dzi?\\n- Gbe kae Eliya do \u0256a \u0256e \u0256evi la ta, eye nukae
  dz\u0254 emegbe?\\n- Eliya fe kpe\u0256e\u014but\u0254a \u014bk\u0254 \u0256e?\\n-
  Nukatae Elisa yi Sunem-ny\u0254nu a\u0256e feme?\\n- Nukae Elisa w\u0254, eye nukae
  dz\u0254 \u0256e \u0256evi kuku la dzi?\\n- Abe alesi w\u00f2dze le Eliya kple Elisa
  gome ene la, \u014bus\u1ebd kae le Yehowa si?\\nNyabiabia bubuwo\\n- Xl\u1ebd Fiawo
  I, 17:8-24.\\nAleke wodo Eliya fe to\u0256o\u0256o kple efe x\u0254se kp\u0254e?
  (Fia. I, 17:9; 19:1-4, 10)\\nNukatae x\u0254se si n\u0254 Zarpat-hosi la si \u0256e
  dzesi \u014but\u0254? (Fia. I, 17:12-16; Luka 4:25, 26)\\nAleke nusi tefe Zarpat-hosi
  la kp\u0254 na m\u00edekp\u0254 Yesu fe nya siwo le Mateo 10:41, 42 la fe nyatefenyenye
  dze sii? (Fia. I, 17:10-12, 17, 23, 24)\\n- Xl\u1ebd Fiawo II, 4:8-37.\\nNukae Sunem-ny\u0254nu
  la fia m\u00ed tso amedzrow\u0254w\u0254 \u014bu? (Fia. II, 4:8; Luka 6:38; Rom.
  12:13; Yoh. I, 3:17)\\nM\u0254 kawo nue m\u00edate \u014bu anyo d\u0254me na Mawu
  sub\u0254lawo le egbea? (D\u0254w. 20:35; 28:1, 2; Gal. 6:9, 10; Heb. 6:10)\""]'
