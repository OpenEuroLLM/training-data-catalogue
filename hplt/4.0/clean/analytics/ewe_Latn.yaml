  ame kukuwo \u0256e tsitre la nye Mawu fe l\u0254l\u0254\u0303\u0256e\u0256efia.
  Yesu gbl\u0254 be: \u201cMawu l\u0254\u0303 xexea ale gbegbe be w\u00f2ts\u0254
