  si li na kukuawo g\u0254me la, ele be m\u00edanya nu si tae amegbet\u0254wo kuna
  kple afi si ku dz\u0254 tso la gb\u00e3.\\nNu Ka Tae Amegbet\u0254wo Dzea D\u0254
  Hekuna?\\nEsime Yesu ts\u0254 amewo fe nu v\u0254\u0303wo ke wo la, wofe l\u00e3me
  s\u1ebd. Le kp\u0254\u0256e\u014bu me, esime wots\u0254 l\u00e3metutut\u0254 a\u0256e
  va Yesu gb\u0254 la, Yesu gbl\u0254 be: \u201c\u2018Kae b\u0254b\u0254 wu, be woagbl\u0254
