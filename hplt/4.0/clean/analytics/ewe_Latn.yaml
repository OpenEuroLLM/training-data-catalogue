  3:27, afi si gbl\u0254 be Sealtiel nye \u201cNeri vi,\u201d ev\u0254 Yekoniya ye
  dzi Sealtiel. (1 Kronika 3:17; Mateo 1:12) Edze f\u00e3a be Sealtiel \u0256e Neri
  viny\u0254nu a\u0256e si \u014bk\u0254 womey\u0254 o, si w\u0254e be w\u00f2zu Neri
  fe toy\u0254vi. G\u0254mesese ma ke nue wogbl\u0254 le be Yosef nye Eli \u201cvi\u201d
  le, elabena e\u0256e Eli viny\u0254nu Maria. Eya ta Luka fo nu tso fome si me Yesu
  dz\u0254 tso \u201cle \u014butil\u00e3 nu,\u201d le fome si me dadaa Maria dz\u0254
  tso la nu. (Romat\u0254wo 1:3) Ale Biblia na Yesu fe dzidzime \u014buti nyatakaka
  fomevi eve siwo le vevie la m\u00ed.\\nAma siwo wodea av\u0254 kple av\u0254 kawoe
  n\u0254 anyi le Biblia-\u014bl\u0254\u0263iwo?\\nAl\u1ebdfu ko\u014b ye woz\u00e3na
  ts\u0254 l\u0254\u0303a av\u0254wo le Titina \u0194edzefenutowo me le blema, eye
  nenema kee woz\u00e3a gb\u0254\u0303fu kple kpos\u0254fu h\u00e3. Av\u0254 siwo
  b\u0254 \u0263ema\u0263i wue nye l\u00e3fuv\u0254wo, eye Biblia fo nu tso al\u1ebdwo,
  fukoko na l\u00e3wo kple al\u1ebdfuv\u0254 \u014bu zi ge\u0256e. (1 Samuel 25:2;
  2 Fiawo 3:4; Hiob 31:20) Gbe si woy\u0254na be flaks, si le abe \u0256eti ene, si
  fe agble wodena le Egipte kple Israel lae wots\u0254 w\u0254a aklala. (1 Mose 41:42;
  Yosua 2:6) Le Biblia-\u014bl\u0254\u0263iwo la, an\u0254 eme be Israel-viwo medea
  \u0256etigble o, gake \u014a\u0254\u014bl\u0254awo \u0256ee fia be amewo z\u00e3n\u025b
  le Persia. (Esta 1:6) Seda nye av\u0254 x\u0254asi a\u0256e si kesin\u0254t\u0254wo
  z\u00e3na, eye an\u0254 eme be asitsala m\u0254z\u0254la siwo tso \u0194edzefe \u01b2\u0129
  ke la koe ts\u0254n\u025b van\u025b.\u2014Nya\u0256e\u0256efia 18:11, 12.\\nAgbal\u1ebd
  a\u0256e si fo nu tso Yesu kple e\u014b\u0254limet\u0254wo \u014bu la gbl\u0254
  be: \u2018L\u00e3fuwo n\u0254a amadede vovovowo me le dz\u0254dz\u0254me nu, tso
  esiwo fu tititi dzi va \u0256o esiwo ny\u0254\u0300 dzi.\u2019 (Jesus and His World)
  Gakpe \u0256e e\u014bu la, wodea ama l\u00e3fuwo zi ge\u0256e. Wo\u0256ea ama dz\u0129
  a\u0256e si x\u0254 asi \u014but\u0254 la tso fumeb\u0254b\u0254 fomevi a\u0256ewo
  me, eye wo\u0256ea ama siwo le dz\u0129, a\u014buti\u0256i\u0256i, bl\u0254 kple
  yib\u0254 la tso atiwo, atiwo fe kewo, a\u014bgbawo kple nu dzodzoe fomevi vovovowo
  me.\"", "\"Nu Si M\u00edesr\u0254\u0303 Tso Yesu Gb\u0254\\nLe M\u0254kp\u0254kp\u0254
  Si Li Na Kukuawo \u014au\\nYesu f\u0254 ame et\u0254\u0303 ya teti \u0256e tsitre,
  eye w\u00f2to esia dzi \u0256ee fia be m\u0254kp\u0254kp\u0254 li na kukuawo. (Luka
