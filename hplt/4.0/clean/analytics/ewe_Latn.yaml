  nu v\u0254\u0303wo ake le anyigba dzi . . .\u2019 eya ta egbl\u0254 na l\u00e3metutut\u0254a
  be: \u2018Tso, ts\u0254 w\u00f2 aba, eye n\u00e0yi afew\u00f2 me.\u2019\u201d (Mateo
  9:2-6) Nu v\u0254\u0303e he d\u0254l\u00e9le kple ku vae. Ame gb\u00e3t\u0254 Adam
  gb\u0254e m\u00edenyi nu v\u0254\u0303 fe dome tsoe.\u2014Luka 3:38; Romat\u0254wo
  5:12.\\nNu Ka Tae Yesu Ku \u00d0o?\\nYesu mew\u0254 nu v\u0254\u0303 kp\u0254 o.
  Eya ta medze be w\u00f2aku hafi o. Esi Yesu ku \u0256e m\u00eda ta la, exe m\u00edafe
  nu v\u0254\u0303wo fe fe. Egbl\u0254 be \u201cwoak\u0254 [yefe \u028bu] \u0256e
  anyi le ame ge\u0256ewo ta hena nu v\u0254\u0303wo fe ts\u0254ts\u0254ke.\u201d\u2014Mateo
  26:28.\\nYesu gbl\u0254 h\u00e3 be: \u201cAmegbet\u0254vi la va, menye be woasub\u0254
  ye o, ke bo\u014b be yeasub\u0254, eye yeats\u0254 yefe lu\u028b\u0254 ana w\u00f2anye
  tafe \u0256e ame ge\u0256ewo ta.\u201d (Mateo 20:28) Yesu y\u0254 fe si w\u00f2xe
  \u0256e amewo ta la be \u201ctafe,\u201d elabena e\u0256e ame bubuwo tso ku me.
  Yesu gbl\u0254 h\u00e3 be: \u201cNye la, meva be woakp\u0254 agbe, eye be woakp\u0254e
  w\u00f2as\u0254 gb\u0254.\u201d (Yohanes 10:10) Hafi m\u00edate \u014bu ase m\u0254kp\u0254kp\u0254
  si li na kukuawo g\u0254me nyuie la, ele be m\u00edanya n\u0254n\u0254me si me wole
  fifia h\u00e3.\\nNu Kae Dz\u0254na \u00d0e Ame Dzi Ne Eku?\\nEsi Yesu x\u0254l\u0254\u0303
  Lazaro ku la, Yesu gbl\u0254 nu si dz\u0254na \u0256e ame dzi ne eku. Egbl\u0254
  na efe nusr\u0254\u0303lawo be: \u201c\u2018M\u00eda x\u0254l\u0254\u0303 Lazaro
  le \u0256i\u0256im \u0256e eme, gake meyina [Betania], be ma\u0256any\u0254e tso
  al\u0254\u0303 me.\u2019 . . . Woawo wosusui be en\u0254 nu fom tso ale si woad\u0254
  al\u0254\u0303 a\u0256i \u0256e emee \u014bu. Eya ta Yesu \u028bu eme na wo k\u0254t\u025b
  az\u0254 be: \u2018Lazaro ku.\u2019\u201d Eya ta Yesu na w\u00f2dze k\u0254t\u025b
  be kukuawo le al\u0254\u0303 d\u0254m, eye womenyaa nu siwo le edzi yim o.\u2014Yohanes
  11:1-14.\\nYesu x\u0254l\u0254\u0303 Lazaro ku \u014bkeke enee nye ema hafi w\u00f2va
