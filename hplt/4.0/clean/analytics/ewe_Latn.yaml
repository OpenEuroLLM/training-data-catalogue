  me si gbl\u0254 be Lazaro gbl\u0254 nya a\u0256e tso n\u0254n\u0254me si me w\u00f2n\u0254
  le \u014bkeke ene mawo me \u014bu o. Esime Lazaro ku la, megan\u0254 agbe o, eye
  megan\u0254 naneke nyam h\u00e3 o.\u2014Nyagbl\u0254la 9:5, 10; Yohanes 11:17-44.\\nM\u0254kp\u0254kp\u0254
  Kae Li Na Ame Kukuwo?\\nKukuawo agb\u0254 agbe, eye m\u0254kp\u0254kp\u0254 asu
  wo si be woan\u0254 agbe tegbee. Yesu gbl\u0254 be: \u201cGafofo la gb\u0254na,
  esi me ame siwo kat\u00e3 le \u014bku\u0256odziy\u0254dowo me la ase [Yesu fe] gbe,
