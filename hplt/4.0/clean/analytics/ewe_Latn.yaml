sample: '["\"Hadede dzro koe sr\u0254\u0303\u0256e\u0256e nyea?\\n\u201cNu si Mawu
  bla \u0256ekae la, ame a\u0256eke negama eme o.\u201d\u2014Mateo 19:6.\\nNYA SI
  BIBLIA GBL\u0186\\nMawu mebua sr\u0254\u0303\u0256e\u0256e be enye hadede dzro a\u0256e
  ko o. Ke bo\u014b enye kadodo k\u0254k\u0254e si n\u0254a \u014butsu kple ny\u0254nu
  dome. Biblia gbl\u0254 be: \u201cTso nuw\u0254w\u0254wo fe g\u0254medzedze la, \u2018atsu
  kple asi [Mawu w\u0254] woe. Le esia ta \u014butsu agbl\u1ebd fofoa kple dadaa \u0256i,
  eye woa kple eve la woazu \u014butil\u00e3 \u0256eka\u2019 . . . Eya \u014buti nu
  si Mawu bla \u0256ekae la, ame a\u0256eke negama eme o.\u201d *\u2014Marko 10:6-9;
  1 Mose 2:24.\\nNya si nye \u201cnu si Mawu bla [alo te fo fu] \u0256ekae\u201d mefia
  be Mawue tiaa ame si ame a\u0256e ava \u0256e la n\u025b do \u014bg\u0254 o. Ke
  bo\u014b esi Biblia \u0256ee fia be W\u0254la lae nye sr\u0254\u0303\u0256e\u0256ewo
  G\u0254me\u0256oanyila la, ele kpe \u0256om edzi be sr\u0254\u0303\u0256e\u0256e
  menye \u0256o\u0256o si woafo asi o. Sr\u0254\u0303t\u0254 siwo bua wofe sr\u0254\u0303\u0256e\u0256e
  alea w\u0254n\u025b k\u0254k\u0254e henana w\u00f2nyea nubabla si n\u0254a anyi
  \u0256aa eye esia w\u0254n\u025b be woga\u0256on\u025b kplikpaa wu ts\u00e3 be yewofe
  sr\u0254\u0303\u0256e\u0256ea nakp\u0254 dzidzedze. Didi si le wo me be yewofe sr\u0254\u0303\u0256e\u0256ea
  nakp\u0254 dzidzedze la nu gas\u1ebdna \u0256e edzi wu ne wona Biblia fia m\u0254
  wo le agba si le wo dzi abe sr\u0254\u0303\u014butsu kple sr\u0254\u0303ny\u0254nu
  ene la ts\u0254ts\u0254 me.\\nNu kae nye sr\u0254\u0303\u014butsu fe \u0256ofe?\\n\u201c\u014autsue
  nye ta na sr\u0254\u0303a.\u201d\u2014Efesot\u0254wo 5:23.\\nNYA SI BIBLIA GBL\u0186\\nBe
  nuwo nayi edzi nyuie le fomea me la, ele be ame a\u0256e nan\u0254 anyi aw\u0254
  nyametsotso maml\u025ba. Sr\u0254\u0303\u014butsu sie Biblia ts\u0254 agban\u0254amedzi
  sia dee. Gake esia mefia be w\u00f2anye gagl\u00e3sudola alo \u014bl\u0254miw\u0254la
  o. Eye mefia h\u00e3 be w\u00f2a\u0256e ta le efe agban\u0254amedziwo te o, elabe
  esia ate \u014bu aw\u0254e be sr\u0254\u0303a magade bubu e\u014bu o, eye ate \u014bu
  ada agba dzodzro h\u00e3 \u0256e sr\u0254\u0303a dzi. Ke \u0256e Mawu di tso esi
  bo\u014b be w\u00f2aw\u0254 d\u0254 ses\u1ebd akp\u0254 sr\u0254\u0303a dzi ahade
  bubu e\u014bu abe x\u0254l\u0254\u0303 vevi kple ame si dzi woate \u014bu aka \u0256o
  wu ene. (1 Timoteo 5:8; 1 Petro 3:7) Efesot\u0254wo 5:28 gbl\u0254 be: \u201cSr\u0254\u0303\u014butsuwo
  nan\u0254 wo sr\u0254\u0303wo l\u0254\u0303m abe woawo \u014but\u0254wo fe \u014butil\u00e3wo
  ene.\u201d\\nSr\u0254\u0303\u014butsu si l\u0254\u0303 sr\u0254\u0303a vav\u00e3
  la dea asix\u0254x\u0254 a\u0256a\u014bu kple \u014butete siwo le sr\u0254\u0303a
  si \u014bu eye w\u00f2biaa efe susu le nyawo \u014bu le bubum\u0254 nu, veviet\u0254
  le nya siwo ku \u0256e fomea \u014bu la me. Mele be w\u00f2ate t\u0254 \u0256e efe
  susuwo dzi le esi w\u00f2nye fomea fe ta ta o. Esi mawuv\u0254\u0303la Abraham gbe
  a\u0256a\u014bu nyui a\u0256e si sr\u0254\u0303a \u0256o n\u025b le fomekuxi a\u0256e
  \u014bu dzi w\u0254w\u0254 la, Yehowa Mawu gbl\u0254 n\u025b be \u201c\u0256o to
  [sr\u0254\u0303w\u00f2].\u201d (1 Mose 21:9-12) Abraham w\u0254 \u0256e nya sia
  dzi \u0256okuib\u0254b\u0254t\u0254e eye esia na efe fomea kp\u0254 \u014butifafa
  hew\u0254 \u0256eka eye Mawu yra wo h\u00e3.\\nNu kae nye ny\u0254nu fe \u0256ofe
  le fomea me?\\n\u201cMi sr\u0254\u0303ny\u0254nuwo h\u00e3, mib\u0254b\u0254 mia
  \u0256okui na mia \u014but\u0254wo mia sr\u0254\u0303wo.\u201d \u20141 Petro 3:1.\\nNYA
  SI BIBLIA GBL\u0186\\nDo \u014bg\u0254 teti hafi Mawu naw\u0254 sr\u0254\u0303ny\u0254nu
  na \u014butsu gb\u00e3t\u0254 la, egbl\u0254 be: \u201cMenyo bena ame la natsi akogo
  o; maw\u0254 kpe\u0256e\u014but\u0254, si as\u0254 \u0256e e\u014bu la n\u025b.\u201d
  (1 Mose 2:18) Nyagbe \u2018s\u0254 \u0256e e\u014bu\u2019 fia nu si ana nane nan\u0254
  blibo. Esia fia be Mawu w\u0254 ny\u0254nu be w\u00f2anye \u014butsu fe kpe\u0256e\u014but\u0254
  si s\u0254 n\u025b bliboe ke menye be w\u00f2as\u0254 kple \u014butsu ahan\u0254
  ho \u028blim kplii o. Esi w\u00f2nye kpe\u0256e\u014but\u0254 si s\u0254 na \u014butsua
  ta la, woate \u014bu aw\u0254 d\u0254 si Mawu de wo si be woadzi viwo bena anyigba
  dzi nay\u0254 la nava eme.\u20141 Mose 1:28.\\nMawu na \u014butil\u00e3me\u014butete,
  susume\u014butete kple seselel\u00e3me\u014butete siwo s\u0254 nyuie ny\u0254nua
  ale be w\u00f2ate \u014bu aw\u0254 efe akpa dzi nyuie. Ne ew\u0254 \u014butete siawo
  \u014bu d\u0254 nyuie le l\u0254l\u0254\u0303 me la, akpe asi \u0256e efe sr\u0254\u0303\u0256e\u0256ea
  fe dzidzedzekp\u0254kp\u0254 \u014bu ge\u0256e eye w\u00f2ana sr\u0254\u0303a nakp\u0254
  dzidz\u0254 ahase le e\u0256okui me be yele dedie. Le Mawu \u014bkume la, ny\u0254nu
  nyui sia t\u0254gbi dze na kafukafu. *\u2014Lododowo 31:28, 31.\"", "\"Le agbledede,
  ab\u0254wo, kple avewo me la, d\u0254w\u0254nuwo zaz\u00e3 w\u0254a akpa vevi a\u0256e
  le alesi woakp\u0254 egb\u0254 be woz\u00e3 agblemenugbl\u1ebdnuwutikewo, gbewutikewo,
  kple amiwo nyuie eye wow\u0254a d\u0254 nyuie la me. D\u0254w\u0254nu siwo ame ge\u0256e
  l\u0254\u0303a zaz\u00e3 domet\u0254 a\u0256ewoe nye akplo siwo wots\u0254na fua
  gbe kple ak\u0254tagbal\u1ebdviwo fe atikewutikewo.\\nAkplo si wots\u0254na fua
  tsii nye agbledem\u0254\u0303 si woz\u00e3na le afisiafi si wow\u0254 be w\u00f2ana
  atike siwo wua nudzodzoeviwutikewo, ami, gbewutikewo, kple d\u0254l\u00e9kuiwutikewo
  w\u0254a d\u0254 nyuie wu. Enye asi alo m\u0254\u0303 si wots\u0254na fua gbe \u0256e
  megbe abe akplo ene, si w\u0254n\u025b be woate \u014bu ats\u0254e \u0256e asi \u014but\u0254
  eye efe asit\u0254tr\u0254 le b\u0254b\u0254e.\\nElektrik\u014bus\u1ebdtikewo nye
  d\u0254w\u0254nu siwo woate \u014bu az\u00e3 le m\u0254 vovovowo nu siwo woz\u00e3na
  ts\u0254 w\u0254a d\u0254 vovovowoe, tso dzadz\u025bnyenye kple dzadz\u025bnyenye
  dzi va \u0256o nudzodzoeviwo dzi kp\u0254kp\u0254 kple nutata dzi. Wofe d\u0254w\u0254w\u0254,
  wo zaz\u00e3, kple se\u0256ofewo g\u0254mesese le vevie \u014but\u0254 na atikewum\u0254\u0303
  nyuit\u0254 tiatia na w\u00f2 nuhiahi\u00e3wo kple ezaz\u00e3 nyuie.\\nLe egbegbe
  xexeame fe ab\u0254wo kple gbewo dzi kp\u0254kp\u0254 me la, tsidede agble nyuie
  le vevie wu ts\u00e3. Esi wole dzi tsim \u0256e tsizaz\u00e3 nyuie kple didi be
  gbe damawo kple ab\u0254wo le l\u00e3mes\u1ebd me \u014bu ge\u0256e wu ta la, ele
  be woatia tsidede agble fe akpa \u0256esia\u0256e nyuie ahal\u00e9 be n\u025b. Le
  ESS siwo s\u0254 gb\u0254 wu dome .\\nLe egbegbe xexeame fe gota gome dzadz\u025bnyenye
  kple bel\u00e9le na wo me la, d\u0254w\u0254nu eve \u0256e dzesi le wofe d\u0254w\u0254w\u0254
  nyuie kple wofe d\u0254w\u0254w\u0254 nyuie \u014bu: pressure washer kple power
  sprayer.\\nTrigger Sprayers nye d\u0254w\u0254nu siwo le afisiafi si wokp\u0254na
  le afewo kple d\u0254w\u0254fewo me le xexeame godoo, si woz\u00e3na na nusianu
  tso dzadz\u025bnyenye kple ab\u0254dzikp\u0254kp\u0254 dzi va \u0256o ame \u014but\u0254
  fe bel\u00e9lenamenuwo kple d\u0254w\u0254fewo fe d\u0254w\u0254w\u0254 dzi. Wofe
  a\u0256a\u014bu b\u0254b\u0254e si w\u0254a d\u0254 nyuie la na wohi\u00e3 vevie
  na tsiwo nana le m\u0254 si dzi woa\u0256u nu. H .\\nLe egbegbe agbledede, d\u0254w\u0254w\u0254
  nyuie, nuw\u0254w\u0254 p\u025bp\u025bp\u025b, kple nusiwo li tegbee fe xexeame
  la, wonye nu vevi siwo ana woaw\u0254 d\u0254 ge\u0256e wu eye woa\u0256e gazaz\u00e3wo
  dzi akp\u0254t\u0254. Esi agbledelawo va le t\u0254tr\u0254m \u0256e wofe atike
  sisi fe hiahi\u00e3wo gb\u0254 kp\u0254nu yeyewo \u014bu ge\u0256e wu la, d\u0254w\u0254nu
  siwo woate \u014bu az\u00e3 le m\u0254 vovovowo nu eye wow\u0254a d\u0254 nyuie
