  ke Luka fe Nyanyuigbal\u1ebda ya gbl\u0254 be Yosef nye \u201cEli vi.\u201d Nu ka
  tae w\u00f2dze abe wofe nyawo to vovo ene?\u2014Luka 3:23; Mateo 1:16.\\nMateo fe
  nu\u014bl\u0254\u0256ia gbl\u0254 be: \u201cYakob dzi Yosef,\u201d eye le afi sia
  la, ez\u00e3 Helagbe me nya a\u0256e si \u0256ee fia k\u0254t\u025b be Yakob ye
  nye Yosef fofo \u014but\u0254\u014but\u0254. Eya ta fome si me Yosef dz\u0254 tso,
  si nye David fe fiafomea \u014bue Mateo fe nu\u014bl\u0254\u0256ia fo nu tsoe. Eye
  esi Yosef si x\u0254 Yesu nyi la nye fome ma me t\u0254 ta la, esia w\u0254e be
  fianyenye fe gomea su Yesu si le se nu.\\nGake Luka fe nu\u014bl\u0254\u0256ia ya
  gbl\u0254 be: \u2018Yosef nye Eli vi.\u2019 Nya \u201cvi\u201d si w\u00f2z\u00e3
