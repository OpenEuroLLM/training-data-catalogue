  dzi edziedzi, abe ale si nye h\u00e3 men\u0254 ew\u0254m ts\u00e3 ene. Men\u0254
  agbagba dzem be ma\u0256e asi le nye numamea \u014bu, gake woawo h\u00e3 wo\u0256oe
  kplikpaa be yewoade af\u0254 atame nam. Me\u0256e nyaa dzi na ame si n\u0254 Biblia
  sr\u0254\u0303m kplim la be w\u00f2akpe \u0256e \u014bunye ahade dzi fo nam. Ex\u0254
  dzigb\u0254\u0256i \u0256o tom esime men\u0254 nye dzimenyawo gbl\u0254m n\u025b.
  Ez\u00e3 mawunyakpukpui siwo ku \u0256e nye kuxia \u014bu ts\u0254 fia ale si maw\u0254
  a\u0256u \u0256okuinye dzi lam, eye w\u00f2de dzi fo nam be man\u0254 gbe dom \u0256a
  na Yehowa madzudz\u0254madzudz\u0254e be w\u00f2akpe \u0256e \u014bunye.\u2014Psalmo
  119:37.\\nGbe \u0256eka, mey\u0254 nye d\u0254w\u0254hatiwo m\u00edekpe ta. Esi
  wova fo fu la, megbl\u0254 na wo be woana biya \u014butsuawo domet\u0254 eve siwo
  \u028bu eme be aha tsu nono zu numame na yewo ts\u00e3 la. Wo kat\u00e3 wox\u0254
  edzi be: \u201cAleke w\u0254 n\u00e0gbl\u0254 nya ma? \u014autsu siawo le agbagba
  dzem be yewoa\u0256u nu si zu numame na wo la dzi!\u201d Eya ta megbl\u0254 na wo
  be: \u201cAvu ma ke w\u0254m nye h\u00e3 mele.\u201d Tso gbe ma gbe dzi koa, wose
  eg\u0254me nam be avu blibo w\u0254m mele be ma\u0256u amama\u0256e\u0256enuw\u0254nawo
  kp\u0254kp\u0254 fe numamea dzi, eye womegafon\u025b \u0256e nunye be magatr\u0254
  \u0256e nye agben\u0254n\u0254 ts\u00e3t\u0254a \u014bu o.\\nMl\u0254eba le Yehowa
  fe kpekpe\u0256e\u014bu me la, medzudz\u0254 amama\u0256e\u0256enuw\u0254nawo kp\u0254kp\u0254.
  Le fe 1999 me la, mex\u0254 ny\u0254nyr\u0254 zu Yehowa \u00d0asefo, eye meda akpe
  na Mawu be w\u00f2gana m\u0254nukp\u0254kp\u0254m be man\u0254 agbe dzadz\u025b
  ahakp\u0254 dzidz\u0254 le agbe me.\\nFifia meva se nu si tae Yehowa l\u00e9 fu
  nu siwo me mefo \u0256okuinye \u0256o v\u0129i \u0263eyi\u0263i didi ma gbegbe \u0256o
  la g\u0254me. Esi w\u00f2nye Fofo l\u0254\u0303ame ta la, edi be yeakp\u0254 tanye
  tso nu siwo amama\u0256e\u0256enuw\u0254nawo kp\u0254kp\u0254 gbl\u1ebdna le ame
  \u014bu la si me. Lododowo 3:5, 6 me nyawo le etefe vav\u00e3! Afi ma gbl\u0254
  be: \u201c\u00d0o \u014bu \u0256e Yehowa \u014bu tso dzi blibo me, eye m\u00e8ga\u0256o
  \u014bu \u0256e w\u00f2 \u014but\u0254 w\u00f2 g\u0254mesese \u014bu o. L\u00e9
  \u014bku \u0256e e\u014bu le w\u00f2 m\u0254wo kat\u00e3 dzi, ekema ana w\u00f2
  m\u0254wo nadz\u0254.\u201d Menye \u0256eko Biblia me m\u0254fiamewo kp\u0254 tanye
  ko ev\u0254 o, ke wona mekp\u0254 dzidzedze \u014but\u0254\u014but\u0254 h\u00e3.\u2014Psalmo
  1:1-3.\\nVI\u00d0E SIWO MEKP\u0186:\\nTs\u00e3 la, meny\u0254a \u014bu \u0256okuinye,
  gake fifia ya mesena le \u0256okuinye me be bubu le \u014bunye eye nye dzi dze eme.
  Mele agbe dzadz\u025b n\u0254m, eye mekp\u0254e be Yehowa ts\u0254 nye nu v\u0254\u0303wo
  kem eye w\u00f2le kpekpem \u0256e \u014bunye. Le fe 2000 me la, me\u0256e Karolin,
  si nye Kristot\u0254 dzetugbe a\u0256e si l\u0254\u0303 Yehowa abe ale si nye h\u00e3
  mel\u0254\u0303 Yehowa ene. M\u00edeli \u0256ekae le \u014butifafa me. M\u0254nukp\u0254kp\u0254
  g\u00e3 a\u0256ee w\u00f2nye na m\u00ed be m\u00edele xexea me godoo fe Kristot\u0254wo
  fe hab\u0254b\u0254 dzadz\u025b si me t\u0254wo l\u0254\u0303 wo n\u0254ewo la me.\"",
  "\"Wickiana\\nWickiana nye nyadz\u0254dz\u0254wo fe fufofo ku\u0256e nusiwo le dz\u0254dz\u0254m
  fifia si s\u0254 kple nusiwo dz\u0254 le senturi wuiade lia me siwo n\u0254 ama\u014bgba
  deka dzi kple agbale gawo, m\u0254me nutatawo, azi nu \u014b\u0254\u014bl\u0254wo
  kple nutatawo. Fifiame gbale drodo nuwo nye nu vevit\u0254wo ku\u0256e nane siwo
  w\u0254 la nu, si wo y\u0254 le Switzerland be Reformation. Johann Jakob Wick (1522-1588),
  si megbe wots\u0254na nusiawo fe fufofo, nye Mawunun\u0254la le Predigerkirche eye
  won\u0254 kadodome kple Z\u00fcrich d\u0254y\u0254fe tso 1552 eye woga nye Archdeacon
  evelia le eyiyi ma me, kpe \u0256e nun\u0254le Grossm\u00fcnster le Z\u00fcrich
  tso 1557. E fofu eye wo\u0256o nyadz\u0254dz\u0254 gbale siawo \u0256e n\u0254n\u0254me
  nyuit\u0254 me le fe 1559 kple 1588 dome, ets\u0254 nububuwo ha de wo n\u0254fewo
  le fe 1505 l\u0254fo vase\u0256e 1559 le ye fe nufofuawo me.\"", "\"Ame kae nye
  Yosef fofo?\\nYosef, si nye atikpala le Nazaret lae x\u0254 Yesu nyi. Gake ame kae
  nye Yosef fofo? Yesu fe dzidzimenu\u014bl\u0254\u0256i si le Mateo fe Nyanyuigbal\u1ebda
