sample: '["\"Baibolo la pa Intaneti | MALEMBA GHAKUPATULIKA MU MANG''ANAMULIRO GHA
  CHARU CHIPHYA\\n15 Charu icho chikapelekeka+ ku fuko la Yuda mu mbumba zawo chikambira
  ku mphaka ya Edomu,+ mapopa gha Zini, m\u2019paka ku Negebu kumwera kwake.\\n2 Mphaka
  yawo ya kumwera yikambira ku chigoti cha Nyanja Yamchere,+ kufuma ku chinkhodyera
  chakulazga kumwera.\\n3 Ndipo yikalutilira kumwera m\u2019paka ku chikwezga cha
  Akirabimu,+ kujumpha ku Zini, na kukwera kufuma kumwera kuya ku Kadeshi-barineya,+
  kukafika ku Hezironi, m\u2019paka ku Adari, na kuzgokera ku Karika.\\n4 Yikajumphilira
  ku Azimoni+ m\u2019paka ku Dambo la Eguputo,+ ndipo mphaka yikamalira pa Nyanja.
  Iyi yika\u0175a mphaka yawo ya kumwera.\\n5 Mphaka ya kumafumiro gha dazi yika\u0175a
  Nyanja Yamchere m\u2019paka kuumaliro wa Yorodani, ndipo mphaka ya kumpoto yika\u0175a
  pa chinkhodyera cha nyanja, kuumaliro wa Yorodani.+\\n6 Mphaka yikakwera m\u2019paka
  ku Beti-hogila+ na kujumphilira kumpoto kwa Beti-araba,+ kufuma apo mphaka yikakwelera
  ku libwe la Bohani+ mwana wa Rubeni.\\n7 Mphaka yikakweraso ku Debiri pa Dambo la
  Akori+ na kuzgokera kumpoto kulazga ku Giligala,+ kuthyana na chikwezga cha Adumimu,
  kumwera kwa dambo, ndipo mphaka yikajumphilira kuya ku maji gha Eni-shemeshi,+ na
  kumalira pa Eni-rogeli.+\\n8 Mphaka yikakwelera ku Dambo la mwana wa Hinomu+ kuya
  ku chikhizga cha \u0174ayebusi+ kumwera, ndiko kuti, Yerusalemu.+ Mphaka yira yikajumphaso
  pachanya pa phiri ilo lathyana na Dambo la Hinomu kumanjiliro gha dazi, kuumaliro
  wa Dambo la Refayimu kumpoto.\\n9 Mphaka yika\u0175ikika kufuma pachanya pa phiri
  kuya ku mbwiwi za maji gha Nefutowa+ na kulutilira ku misumba ya Phiri la Efuroni,
  ndipo mphaka yika\u0175ikika pa Baala, ndiko kuti, Kiriyati-yerimu.+\\n10 Mphaka
  yikazgoka kufuma ku Baala kulazga kumanjiliro gha dazi kwa Phiri la Seyiri na kujumphilira
  ku chikhizga cha Phiri la Yerimu kumpoto, ndiko kuti, Kesaloni. Yikakhilira ku Beti-shemeshi+
  na kujumphilira kuya ku Timuna.+\\n11 Mphaka yikafuma pa chikhizga cha Ekironi+
  kumpoto, ndipo mphaka yika\u0175ikika pa Shikeroni na kujumphilira Phiri la Baala
  m\u2019paka ku Yabinele, ndipo mphaka yikamalira pa nyanja.\\n12 Mphaka ya kumanjiliro
  gha dazi yika\u0175a pa Nyanja Yikuru+ na mumphepete mwake. Iyi yika\u0175a mphaka
  ya mphapu ya Yuda kuyana na mbumba zawo kosekose.\\n13 Kalebi+ mwana wa Yefune wakamupa
  chiga\u0175a pakati pa mphapu ya Yuda kuyana na languro la Yehova kwa Joshuwa, chiga\u0175a
  ichi chika\u0175a Kiriyati-ariba (Ariba waka\u0175a wiske wa Anaki), ndiko kuti,
  Heburoni.+\\n14 Ntheura Kalebi wakachimbizgamo \u0175ana \u0175atatu \u0175a Anaki:+
  Sheshayi, Ahimani, na Talimayi,+ mphapu ya Anaki.\\n15 Penepapo wakakwera kufuma
  kura kuya ku \u0175anthu \u0175akukhala mu Debiri.+ (Pakwamba Debiri wakachemekanga
  na zina lakuti Kiriyati-seferi.)\\n16 Kalebi wakati: \u201cMunthu uyo watimbenge
  Kiriyati-seferi na kuwupoka, nimupenge mwana wane Akisa ku\u0175a muwoli wake.\u201d\\n17
  Ntheura Otiniyeli+ mwana wa Kenazi,+ munung\u2019una wa Kalebi, wakawupoka. Ndipo
  wakamupa Akisa mwana wake+ ku\u0175a muwoli wake.\\n18 Apo Akisa wakalutanga ku
  nyumba yake, wakachiska Otiniyeli kuti wapemphe munda kwa awiske. Penepapo Akisa
  wakakhira pa mbunda yake. Ntheura Kalebi wakati kwa iyo: \u201cKasi ukukhumbachi?\u201d+\\n19
  Iyo wakati: \u201cMunipe thumbiko, pakuti muli kunipa tumalo kumwera, munipeso Guloti-mayimu.\u201d
  Ntheura wakamupa Guloti Wakunena na Guloti Wakusika.\\n20 Ichi chika\u0175a chiharo
  cha fuko la Yuda kuyana na mbumba zawo.\\n21 Misumba yakuumaliro ya fuko la Yuda
  ku mphaka na Edomu+ kumwera yika\u0175a: Kabuzeli, Ederi, Yaguri,\\n22 Kina, Dimona,
  Adada,\\n23 Kedeshi, Hazori, Itinani,\\n24 Zifu, Telemu, Beyaloti,\\n25 Hazori-hadata,
  na Keriyoti-hezironi, ndiko kuti, Hazori,\\n26 Amamu, Shema, Molada,+\\n27 Hazara-gada,
  Heshimoni, Beti-peleti,+\\n28 Hazara-shuwala, Beyere-sheba,+ Biziyotiya,\\n29 Baala,
  Iyimu, Ezemu,\\n30 Elitoladi, Kesili, Horima,+\\n31 Zikilagi,+ Madimana, Sanisana,\\n32
  Lebayoti, Shilihimu, Ayini, na Rimoni.+ Misumba 29 pamoza na vikaya vyake.\\n33
  Mu Shefela+ muka\u0175a Eshitawoli, Zora,+ Ashina,\\n34 Zanowa, Eni-ganimu, Tapuwa,
  Enamu,\\n35 Yarimuti, Adulamu,+ Soko, Azeka,+\\n36 Sharayimu,+ Aditayimu, na Gedera
  na Gederotayimu. Misumba 14 na vikaya vyake.\\n37 Zenani, Hadasha, Migidala-gadi,\\n38
  Diliyani, Mizipe, Yokiteli,\\n39 Lakishi,+ Bozikati, Egiloni,\\n40 Kaboni, Lamamu,
  Kitilishi,\\n41 Gederoti, Beti-dagoni, Nama, na Makeda.+ Misumba 16 na vikaya vyake.\\n42
  Libuna,+ Eteri, Ashani,+\\n43 Ifita, Ashina, Nezibu,\\n44 Keyila, Akizibu, na Maresha.
  Misumba 9 na vikaya vyake.\\n45 Ekironi na mizi yake pamoza na vikaya vyake.\\n46
  Kwambira ku Ekironi kulazga kumanjiliro gha dazi, chiga\u0175a chose mumphepete
  mwa Ashidodi na vikaya vyake.\\n47 Ashidodi,+ mizi yake, na vikaya vyake. Gaza+
  na mizi yake, na vikaya vyake, kukhilira ku Dambo la Eguputo, Nyanja Yikuru, na
  chiga\u0175a chapafupi.+\\n48 Mu chiga\u0175a cha mapiri muka\u0175a Shamira, Yatiri,+
  Soko,\\n49 Dana, Kiriyati-sana, ndiko kuti, Debiri,\\n50 Anabu, Eshitemo,+ Animu,\\n51
  Gosheni,+ Holoni, na Gilo.+ Misumba 11 na vikaya vyake.\\n52 Arabu, Duma, Eshani,\\n53
  Yanimu, Beti-tapuwa, Afeka,\\n54 Humuta, Kiriyati-ariba, ndiko kuti, Heburoni,+
  na Ziyori. Misumba 9 na vikaya vyake.\\n55 Mawoni,+ Karimeli, Zifu,+ Yuta,\\n56
  Yezireli, Yokideyamu, Zanowa,\\n57 Kayini, Gibeya, na Timuna.+ Misumba 10 na vikaya
  vyake.\\n58 Halihulu, Beti-zuri, Gedori,\\n59 Marati, Beti-anoti, na Elitekoni.
  Misumba 6 na vikaya vyake.\\n60 Kiriyati-baala, ndiko kuti, Kiriyati-yerimu,+ na
  Raba. Misumba yi\u0175iri na vikaya vyake.\\n61 Mu mapopa muka\u0175a Beti-araba,+
  Midini, Sekaka,\\n62 Nibushani, Msumba wa Mchere, na Engedi.+ Misumba 6 na vikaya
  vyake.\\n63 Kweni \u0175analume \u0175a Yuda \u0175akatondeka kuchimbizga+ \u0174ayebusi+
  awo \u0175akakhalanga mu Yerusalemu.+ Ntheura \u0174ayebusi \u0175achali kukhala
  mukati mwa Yuda mu Yerusalemu m\u2019paka lero.\"", "\"VYARU 57\\n\u0174ANTHU 998,254,087\\n\u0174APHARAZGI
  4,154,608\\nMASAMBIRO GHA BAIBOLO 4,353,152\\n\u201cNisambirenge Pamoza na Iwe\u201d\\nIsmael,
  uyo wakukhala ku Mexico, wakaghanaghana vya ku\u0175azga Baibolo lose. Mu chaka
  chimoza, wakali\u0175azga ka\u0175iri. Kweni pamanyuma wakafwa maso. Pakati pajumpha
  vyaka, \u00c1ngel, yumoza wa \u0174akaboni \u0175a Yehova, wakakumana na Ismael
  ndipo wakamuphalira ivyo Chiuta walayizga. Ismael wakakhumba kuti wamanye vinandi,
  kweni wakati, \u201cIne nkhuwona yayi. Ntheura ninga\u0175azga yayi Baibolo.\u201d\\n\u00c1ngel
  wakamuphalira kuti, \u201cKudandawura yayi, nikusambizgenge ku\u0175azga vilembo
  vya Braille.\u201d\\nIsmael wakati: \u201cKasi ukumanya ku\u0175azga vilembo vya
  Braille?\u201d\\n\u00c1ngel wakati: \u201cYayi, kweni nisambirenge pamoza na iwe.\u201d
  Ismael wakagomezga yayi kuti \u00c1ngel wangachita nadi ivi kuti wawovwire iyo.
  \u00c1ngel wakawera kwawo, wakafufuza umo \u0175aku\u0175azgira vilembo vya Braille,
  ndipo wakalemba pa katoni tumadoti uto \u0175achibulumutira \u0175aku\u0175azga.
  Kufuma apo, wakamba kusambizga Ismael ku\u0175azga vilembo vya Braille. Nyengo yichoko
  waka, Ismael wakasambira alufabeti ya Braille, wakamba kwiza ku maungano, na ku\u0175azga
  mabuku ghithu gha vilembo vya Braille. Pasono \u00c1ngel wakusambira Baibolo na
  \u0175anthu \u0175anayi \u0175achibulumutira. \u0174anthu a\u0175a \u0175akutemwa
  kuyowoya vya Paradiso wamunthazi apo wose \u0175azamwambaso kuwona.\\nWakamumanya
  Yayi\\nViannei, mudumbu wa vyaka 14 wa ku United States, wakalemba kuti: \u201cMu
  kilasi, asambizgi awo \u0175akatisambizganga social studies \u0175akamba kuyowoya
  vya visopa. \u0174akatipempha kuti tizunurepo visopa ivyo tikuvimanya, ndipo ine
  nkhazunura \u0174akaboni \u0175a Yehova. \u0174anyane mu kilasi \u0175akaseka, \u0175akati
  tiku\u0175amalira waka nyengo yawo, tikuso\u0175a waka chakuchita, nakuti mabuku
  ghithu \u0175akutaya waka. Asambizgi nawo \u0175akayowoya viheni chomene vya \u0174akaboni
  \u0175a Yehova.\\n\u201cNtheura nkhalomba Yehova kuti wanipe nkhongono kuti nipharazge.
  Nkha\u0175aphalira kuti tikwenda mu nyumba zawo, kuti ti\u0175amalire waka nyengo
  yayi, kweni Yehova ndiyo wakutituma kuti ti\u0175ape ulongozgi uwemi wa mu Baibolo.
  Nkha\u0175apempha kuti \u0175angatayanga yayi mabuku agho tiku\u0175apa. Nkha\u0175aphaliraso
  kuti mabuku agha ghanga\u0175awovwira kuti \u0175asinthe umoyo wawo na ku\u0175aponoska.
  Asambizgi \u0175akaphepiska, ndipo \u0175akati para \u0174akaboni \u0175iza ku nyumba
  yawo \u0175amu\u0175apokelera, ku\u0175ategherezga na ku\u0175azga magazini ghithu.
  Nkhawonanga nga kuti \u0175akuchezgapo waka.\\n\u201cPakati pajumpha myezi yinayi
  tikakakumanaso, ndipo nkhazizwa kupulika kuti \u0175akusambira Baibolo. Pakati pajumphaso
  myezi 6, \u0175akiza pa sukulu na kunipenja kuti \u0175aniwonge chifukwa chakuti
  nkha\u0175apharazgira. Ine nkha\u0175amanyaso yayi chifukwa pa nyengo iyi \u0175akameta
  sisi na mwembe. Pasono asambizgi a\u0175a mbapharazgi \u0175ambura kubatizika.\u201d\\nKupharazga
  ku Amazon\\nChaka chamara, \u0175anthu \u0175a Yehova ku Brazil \u0175aka\u0175ikapo
  mtima kuti \u0175awovwire \u0175anthu mu chiga\u0175a chikuru cha Amazon. \u0174anthu
  \u0175anandi mu chiga\u0175a ichi \u0175aka\u0175avya mwa\u0175i wa kupulika makani
  ghawemi. Pakughanaghanira fundo iyi, Wupu Wakulongozga ukazomerezga kuti pa\u0175e
  upharazgi wapadera wa chaka chose kuti \u0175anthu \u0175a mu chiga\u0175a ichi
  \u0175apulike makani ghawemi.\\nOfesi ya munthavi yikasankha matawuni 53 agho ghali
  mu malo ghakupambanapambana mu chiga\u0175a chikuru cha Amazon ndipo yikapempha
  \u0175apharazgi \u0175a Ufumu kuti \u0175akapharazgeko. Mu myezi yinayi pera, \u0175apharazgi
  \u0175akujumpha 6,500 \u0175akachitapo kanthu pa pempho ili.\\nMu tawuni yakutali
  chomene ya Anam\u00e3, uko kuka\u0175avya \u0175apharazgi \u0175a Ufumu, \u0175abali
  na \u0175adumbu 10 \u0175akaluta na kukakhalako mazu\u0175a 11. \u0174abali a\u0175a
  \u0175akaga\u0175ira mabuku ghakujumpha 12,500 na kwambiska masambiro gha Baibolo
  pafupifupi 200, agho pasono \u0175akuchitira pa foni. Apo \u0175aka\u0175a kura,
  \u0175abali \u0175akachitangaso maungano. Pa ungano waumaliro pambere \u0175andafumeko,
  \u0175akakondwa kuwona \u0175anthu 90 awo \u0175akiza. Pasono tingayowoya yayi umo
  upharazgi uwu wawovwilira \u0175anthu mu chiga\u0175a ichi.\\nWakamuphalira vya
  jw.org\\nMu vyaka 6 ivyo vyajumpha, Jehizel na Mariana \u0175akusambira mu kilasi
  limoza ku Venezuela. Pakuti Jehizel ni Kaboni wa Yehova, kanandi Mariana wakamusekanga
  na kumunena. Mariana wakagomezganga kuti Jehizel wakumanya yayi kunjoya na umoyo.
  Zu\u0175a linyake, wati waneneka nyengo yitali, mudumbu withu wakakumbuka chinthu
  chinyake, ndipo wakati: \u201cMariana, uwone pa webusayiti yithu ya jw.org. Ulute
  pa \u2018Mavidiyo,\u2019 na kudofya kabokosi ka \u2018\u0174anyamata na \u0174asungwana.\u2019\u201d\\nMise
  yeneyira, Mariana wakayimbira foni Jehizel, ndipo wakati, \u201cSono namanya chifukwa
  icho ukuchitira vyose ivi.\u201d\\nJehizel wakapulikiska yayi, ndipo wakati, \u201cKasi
  ndikuti wambaso kuniseka?\u201d\\nMariana wakati: \u201cYayi, nikusekengeso yayi.
  Nati waka nikuwonge, chifukwa sono namanya kuti vinthu ivyo nkhaviwonanga nga \u2018nkhunjoya
  na umoyo\u2019 ndivyo vikuninjizga mu masuzgo.\u201d \u0174akapanga ndondomeko yakuti
  Mariana wasambirenge Baibolo mwakukhazikika, ndipo pasono wakwiza pa maungano ghose.\\nWakafumba
  Muliska\\nG\u00e9role waka\u0175a mulembi mu tchalitchi lakwake ku Haiti. Kweni
  wakazizikika chomene kuwona kuti \u0174akaboni \u0175a Yehova \u0175akazgora mafumbo
  ghake ghose kwizira mu Baibolo. Iyo na mwana wake msungwana \u0175akazomera kusambira
  Baibolo. \u0174akati \u0175akhorwa na ivyo \u0175akasambiranga, \u0175akapempha
  kuti \u0175asambirenge ka\u0175iri pa sabata.\\nWakati wasambira myezi yitatu, G\u00e9role
  wakaluta kwa muliska wa tchalitchi lakwake na kumufumba mafumbo ghanayi. Wakati:
  \u201cKasi ntchilimika wuli icho Yesu waka\u0175ikika ku\u0175a Themba? Kasi \u0175anthu
  \u0175awemi \u0175akuluta nkhu para \u0175afwa? Kasi \u0175aheni \u0175akuluta nkhu
  para \u0175afwa? Kasi Yesu wakafwira pa mphinjika panji pa khuni?\u201d Muliska
  uyu wakayowoya kuti wangazgora fumbo lachi\u0175iri na lachitatu pera. Wakati: \u201c\u0174akaboni
  \u0175a Yehova \u0175akuti \u0175anthu 144,000 ndiwo \u0175akuluta kuchanya. Ine
  nkhuti wose awo \u0175akuchita khumbo la Chiuta \u0175alutenge kuchanya. Kweni \u0175aheni
  \u0175amuphya mu moto wamuyirayira.\u201d Wakati wafumbika kuti walongore vesi la
  mu Baibolo ilo likukhozgera fundo iyi, muliska uyu wakatondeka. G\u00e9role wakakhu\u0175ara
  na mazgoro agha, kufuma apo waka\u0175ikapo mtima chomene kusambira Baibolo. Wakafuma
  mu tchalitchi lakwake, ndipo wakayowoya kuti wakasambira vinandi vya Baibolo mu
  myezi yitatu iyo wakasambiranga na \u0174akaboni \u0175a Yehova kuluska mu vyaka
  30 ivyo waka\u0175ira mu tchalitchi lake. G\u00e9role na mwana wake \u0175ali kubatizika
  sonosono apa, ndipo pasono \u0175akusambira Baibolo na \u0175anthu 23 mu muzi wawo.\"",
  "\"\u0174akaboni \u0175a Yehova \u0175angamovwirani makora kuti musambire ivyo Baibolo
  likusambizga. Kusambira Baibolo kungamovwirani kuti:\\nMu\u0175e \u0175akukondwa\\nMu\u0175e
  mubwezi wa Chiuta\\nMusambire ivyo Baibolo likulayizga kuti vizamuchitika kunthazi\\nPa
  peji ili\\nKasi \u0174akaboni \u0175a Yehova \u0174akuchita Wuli Pakusambizga Munthu
  Baibolo?\\nMunthu uyo wakumusambizgani Baibolo wamovwiraninge kuti mupulikiske makora
  ivyo Baibolo likuyowoya. Apo musambirenge Baibolo munthowa yakudumbiskana pakugwiliskira
  ntchito buku la Mungakondwa na Umoyo Kwamuyirayira! musambirenge ivyo Baibolo likusambizga
  kweniso umo lingamovwilirani pa umoyo winu. Kuti mumanye vinandi, wonelerani vidiyo
  iyi.\\nKasi nkhwenera kulipira kuti nisambire Baibolo?\\nYayi. Tikulondezga ulongozgi
  uwo Yesu wakaphalira \u0175asambiri \u0175ake, apo wakati: \u201cMukapokera kwawanangwa,
  pelekani kwawanangwa.\u201d (Mateyu 10:8) Awo \u0175amusambizganinge Baibolo tiku\u0175alipira
  ndalama yayi, ndipo tikuguliska yayi Baibolo panji buku la Mungakondwa na Umoyo
  Kwamuyirayira!\\nKasi munthu wakusambira nyengo yitali wuli?\\nKosi yose yili na
  masambiro 60. Mungasankha mwekha umo mungasambilira kuti mumalizge masambiro agha,
  kweni \u0175anthu \u0175anandi \u0175akutemwa kuti ti\u0175asambizgenge sambiro
  limoza panji kujumphira apa sabata yiliyose.\\nKasi ningachita wuli kuti nambe kusambira
  Baibolo?\\n1. Filing\u2019ani fomu pa intaneti. Tigwiliskirenge ntchito vinthu ivyo
  mwalemba vyakukhwaskana na imwe na chilato chakuti timutumirani munthu wakuti wasambirenge
  namwe Baibolo nga umo mwapemphera.\\n2. Munthu uyo wamusambizganinge Baibolo wakumanenge
  namwe. Musambizgi winu wa Baibolo wazamumulongosolerani ivyo mukwenera kukhazga
  apo mukusambira Baibolo ndipo wazamuzgora fumbo lililose ilo munga\u0175a nalo.\\n3.
  Imwe na munthu uyo wazamumusambizgani Baibolo muzamupanga ndondomeko ya umo mungasambilira.
  Mungasambira maso na maso panji kwizira pa telefoni, video call, kalata, panji imelu.
  Mungasambira kwa ora limoza, kweniso para mungakhumba mungasambira kwanyengo yichoko
  waka panji kujumphirapo kuyana na ndondomeko yinu.\\nKasi munganilongora dankha
  umo mukusambilira?\\nEnya. Kuti muwone , filing\u2019ani fomu iyo yili pa jw.org.
  Para mwakumana na munthu uyo wakukhumba kumusambizgani Baibolo, muphalirani kuti
  mukukhumba kuwona dankha umo sambiro likuchitikira kuti muwone usange vikumukondweskani
  panji yayi. Iyo wazamugwiliskira ntchito kabuku kakuti Mungakondwa na Umoyo Kwamuyirayira!
  ako kali na masambiro ghatatu, agho ghazamumuwovwirani kuti muwone usange vikunozga
  kusambira panji yayi.\\nPara nazomera kusambira Baibolo, kasi awo \u0175akunisambizga
  \u0175anichichizgenge yayi kuti ni\u0175e yumoza wa \u0174akaboni \u0175a Yehova?\\nYayi.
  \u0174akaboni \u0175a Yehova \u0175akutemwa kusambizga \u0175anthu Baibolo, kweni
  \u0175akuchichizga munthu waliyose yayi kuti wanjire mpingo wawo. M\u2019malo mwake,
  tikusambizga ivyo Baibolo likuyowoya, ndipo tikumanya kuti munthu waliyose wali
  na wanangwa wakusankha yekha ivyo wakukhumba kugomezga.\u20141 Petrosi 3:15.\\nKasi
  ningagwiliskira ntchito Baibolo lane?\\nEnya, mungagwiliskira ntchito Baibolo lililose
  ilo mwakhumba. Nangauli ise tikutemwa kugwiliskira ntchito Baibolo la Malemba Ghakupatulika
  mu Mang\u2019anamuliro gha Charu Chiphya ilo ndipusu kweniso lili kung\u2019anamulika
  makora, kweni tikumanya kuti \u0175anthu \u0175anandi \u0175akutemwa kugwiliskira
  ntchito Baibolo ilo \u0175ali kulizgo\u0175era kale.\\nKasi ningachemerako \u0175anyane
  pa sambiro la Baibolo?\\nEnya. Mungachemerako banja linu lose panji mubwezi winu
  waliyose uyo mwakhumba.\\nWuli usange nkhasambirapo Baibolo na \u0174akaboni \u0175a
  Yehova kumanyuma? Kasi ningasambiraso?\\nEnya. Unenesko ngwakuti, mungakondwa chomene
  umo mungasambilira pasono chifukwa vinthu vinyake ivyo tikusambizga vyasintha kuti
  vikolerane na umo vinthu viliri ku \u0175anthu pasono. Pasono sambiro la Baibolo
  ndakunozga chomene kweniso likuchitika munthowa yakudumbiskana kuluska umo vika\u0175ira
  kale.\\nKasi pali nthowa zinyake za umo munthu wangasambilira Baibolo kwambura munthu
  munyake wakuti wamusambizgenge?\\nEnya. Nangauli \u0175anthu \u0175anandi \u0175akusambira
  makora Baibolo usange pali munthu munyake waku\u0175asambizga, kweni \u0175anyake
  pakwamba \u0175akutemwa kusambira dankha pa\u0175ekha. Pali vinthu vinyake ivyo
  vingamovwirani kuti musambire Baibolo kwaulere pamwekha. Pasi apa pali vinthu vinyake
  ivyo vingamovwirani kuti musambire Baibolo:\\nKusambira Baibolo pa Intaneti. Kusambira
  Baibolo munthowa ya mafumbo na mazgoro, mungasanga mazgoro gha mafumbo ghanyake
  ghakuzirwa nga ghakuti: Kasi Chiuta ni njani? Chifukwa wuli pali masuzgo na vinthu
  viheni? Kasi Chiuta wazamuwuskapo masuzgo?\\nMavidiyo Ghakulongosora Baibolo. Mavidiyo
  ghafupi agha ghakulongosora vinthu vyakuzirwa ivyo Baibolo likusambizga.\\nMafumbo
  Agho Baibolo Likuzgora. Nkhani izi zikupeleka mazgoro ghanandi gha mafumbo agho
  ghali mu Baibolo.\\nMavesi gha mu Baibolo Ghalongosoreka. Manyani ng\u2019anamuro
  la mavesi na mazgu ghakumanyikwa chomene mu Baibolo.\"", "\"Musungwana wakutchuka
  pakwimba sumu za disco, Patricia Majalisa wasungikenge kwake ku Eastern Cape mu
  town ya Mdantsane ku South Africa mwahuno pa Chisulo.\\nBanja la chiponde uyu laphala
  kuti ndakuwonga chomene chifukwa cha wovwili wakufumila ku \u0175anthu \u0175aku
  Zimbabwe uko mwana wawo Patricia Majalisa watemwanga kuluta kukayimba\\nChiponde
  uyu wakatayika sabata yamala pa Chinayi ku St. Helen Joseph\u2019s hospital mu Johannesburg
  ku South Africa.\\nMulongozgi wake pa sumu za disco DJ Oska wayowoyapo mazgo ghakuti:\\nTapokelapo
  wovwili wa ndalama kufumila ku fans yake yaku vyalo va Nsmibia, Zimbabwe pamoza
  na Botswana awo \u0175alongola chitemwa chikulu pa muyimbi withu wakuno ku South
  Africa.\\nDJ Oska waphalaso kuti mudawuko wa nyifwa \u0175awuwaluzgenge pa YouTube
  pa channel ya BCM tv\\nPatricia wasungikenge ku Mdantsane township ku Eastern Cape
  pa Chisulo. Ti\u0175ikengepo munthavi (link) yakuti waliyose uyo wakukhumba kuwonelela
  mwambo wa nyifwa wangawulondezga. BCM tv yaku East London yiwoneskengeso ku Facebook
  Page ndipo link yisazgikengekoso\\nPatricia Majalisa wakababika pa 15 February 1967
  ndipo wakajoyina gulu la Splash ilo mweneko uyo wakayambiska waka\u0175a Dan Tshanda
  ndipo wakatayika chaka chamala. Kwene Majalisa wakayamba kutchuka apo wakafumyila
  album yake ya Solo zina lake lakuti cool down mu chaka cha 1986. Ma album ghanyake
  gha\u0175ili, Gimba na Witchdoctor ghakamupangila ndalama zakukwana R50,000\\nRelated
  Posts\\nMthunzi wafumiska kasumu kakunozga\\nBanthu bankhondi bakakika pavifukwa
  vya ufwiti\\nAdada Andrew Mtonga \u0175alengeska ku Mzuzu \u2013 Ephraim Mkali Banda
  ndimo wakutili\"", "\"Baibolo la pa Intaneti\\nMALEMBA GHAKUPATULIKA MU MANG''ANAMULIRO
  GHA CHARU CHIPHYA\\n-\\nMakalata ghamalumbo (1-3)\\n-\\n\u0174ate\u0175eti \u0175a
  phangano liphya (4-6)\\n-\\nPhangano liphya lili na uchindami ukuru (7-18)\\n3 Kasi
  tikwambaso kujilumba tekha? Panji kasi tikukhumbikwira makalata ghamalumbo pakwiza
  kwa imwe, panji ghakufuma kwa imwe, nga umo \u0175anthu \u0175anyake \u0175akuchitira?\\n2
  Imwe ndimwe kalata yithu,+ yakulembeka mu mitima yithu, iyo yikumanyikwa na ku\u0175azgika
  na \u0175anthu wose.\\n3 Pakuti mukulongoreka kuti ndimwe kalata ya Khristu yakulembeka
  na ise paku\u0175a \u0175ate\u0175eti,+ yakulembeka na inki yayi kweni na mzimu
  wa Chiuta wamoyo. Yili kulembeka pa malibwe ghapapati yayi,+ kweni pa malibwe ghathupi,
  pa mitima.+\\n4 Tili na chigomezgo ichi mwa Chiuta kwizira mwa Khristu.\\n5 Patekha
  tili \u0175akwenelera yayi kuchita mulimo uwu, kweni Chiuta ndiyo wakutovwira kuti
  ti\u0175e \u0175akwenelera.+\\n6 Ndiyo watizgora \u0175akwenelera ku\u0175a \u0175ate\u0175eti
  \u0175a phangano liphya,+ \u0175a malango ghakulembeka yayi,+ kweni \u0175a mzimu.
  Pakuti malango ghakulembeka ghakupeleka cheruzgo cha nyifwa,+ kweni mzimu ukuzgora
  munthu ku\u0175a wamoyo.+\\n7 Usange Dango ilo likupeleka nyifwa ndiposo ilo likalembeka
  pa malibwe+ likiza mu uchindami, mwakuti \u0175ana \u0175a Israyeli \u0175akatondeka
  kudodoliska chisko cha Mozesi chifukwa cha uchindami wa chisko chake,+ uchindami
  uwo ukenera kumara,\\n8 asi kupelekeka kwa mzimu+ ku\u0175enge na uchindami ukuru?+\\n9
  Usange Dango ilo likuti \u0175anthu mbakwananga+ lika\u0175a lauchindami,+ ipo milimo
  iyo yikovwira \u0175anthu kuti \u0175a\u0175e \u0175arunji yili na uchindami ukuru.+\\n10
  Malango agho ghaka\u0175a ghauchindami ghapokeka uchindami chifukwa cha uchindami
  uwo ukuluska igho.+\\n11 Pakuti usange malango agho ghakenera kumara ghakiza na
  uchindami,+ ipo phangano lasono liku\u0175a na uchindami ukuru.+\\n12 Pakuti tili
  na chigomezgo ichi,+ tikuyowoya na wanangwa ukuru,\\n13 ndipo tikuchita nga umo
  vika\u0175ira na Mozesi yayi apo wakadikanga chidiko pa chisko chake,+ mwakuti \u0175ana
  \u0175a Israyeli \u0175aleke kudodoliska pa malango agho ghakenera kumara.\\n14
  Kweni maghanoghano ghawo ghaka\u0175a ghanonono.+ Pakuti m\u2019paka mu zu\u0175a
  ili, chidiko chakuyana waka chikukhalilira kwambura kubenuka para \u0175aku\u0175azga
  phangano lakale,+ chifukwa chikuwuskikapo kwizira mwa Khristu pera.+\\n15 Nakuti
  m\u2019paka muhanya uno, nyengo yiliyose para mabuku gha Mozesi ghaku\u0175azgika,+
  chidiko chikubenekelereka pa mitima yawo.+\\n16 Kweni para munthu wang\u2019anamukira
  kwa Yehova, chidiko chikuwuskikapo.+\\n17 Yehova ni Mzimu,+ ndipo apo pali mzimu
  wa Yehova, pali wanangwa.+\\n18 Ndipo tose na visko vyambura kudika tiku\u0175aliska
  uchindami wa Yehova nga ni magilasi, ndipo tikuzgoreka ku\u0175a mu chikozgo chakuyana
  waka kufuma ku uchindami kuya ku uchindami, nga umo wakuchitira Yehova, uyo ni Mzimu.+\"",
  "\"Mu Julayi 1951, mpingo uchoko wa ku Jakarta ukawungana kuti upokelere Peter Vanderhaegen
  uyo waka\u0175a mishonale wakwamba kufika ku Indonesia. Pakufika kuumaliro wa chaka
  ichi, \u0175amishonale \u0175anyake 13 \u0175akufuma ku Australia , Germany, na
  Netherlands \u0175aka\u0175a kuti \u0175iza. \u0174amishonale a\u0175a \u0175akajumpha
  chi\u0175elengero cha \u0175apharazgi wose mu charu ichi.\\nFredrika Renskers, uyo
  waka\u0175a mishonale wakuyowoya Chidachi, wakati: \u201cNkhaghanaghaniranga umo
  namupharazgira na majesicha (mawoko) ku nyumba na nyumba. Kweni pakwamba nkhapharazganga
  mu chiyowoyero cha Chidachi chifukwa \u0175anthu \u0175anandi \u0175akayowoyanga
  chiyowoyero ichi.\u201d Ronald Jacka uyo wakafuma ku Australia wakati: \u201cTa\u0175anyake
  pakupharazga tikagwiliskiranga ntchito makadi agho tikalembangapo upharazgi ufupi
  mu chiyowoyero cha Chiindonesiya. Pambere nindagogode pa nyumba ya munthu, nkhawonanga
  dankha pa kadi na kusunga pa mtima mazgu.\u201d\\nPakuti \u0175amishonale a\u0175a
  \u0175akalongozganga makora, mu chaka chimoza pera chi\u0175elengero cha \u0175apharazgi
  chikakwera lu\u0175iro chomene kufuma pa 34 kufika pa 91. Pa Seputembala 1, 1951,
  ofesi ya Watch Tower Society yikajulika ku nyumba ya Andr\u00e9 Elias ku Central
  Jakarta. Ronald Jacka ndiyo wakala\u0175iliranga ofesi iyi (waka\u0175a mute\u0175eti
  wa munthavi).\\nMwa\u0175i Unyake Ukajulika\\nMu Novembala 1951, Peter Vanderhaegen
  wakatumika ku North Sulawesi uko Theo Ratu na muwoli wake \u0175akambiska kagulu.
  \u0174anthu \u0175anandi ku chiga\u0175a ichi \u0175akajichemanga kuti Mbakhristu
  ndipo \u0175akachindikanga chomene Mazgu gha Chiuta. \u0174anthu \u0175anandi \u0175akachemeranga
  \u0174akaboni mu nyumba zawo na ku\u0175apempha kuti \u0175a\u0175alongosolere visambizgo
  vya mu Baibolo. Kanandi \u0174akaboni \u0175akayambanga kudumbiskana na \u0175anthu
  10. Para pajumpha maminiti 15, paka\u0175anga \u0175anthu 50. Para ora likukwana,
  paka\u0175anga \u0175anthu 200 ndipo \u0175akafumanga mu nyumba na kuluta pa lu\u0175aza
  kuti \u0175alutilire kudumbiskana.\\nKukwambilira kwa 1952, Albert na Jean Maltby,
  \u0175akajura nyumba ya \u0175amishonale ku Surabaya, East Java, mu tawuni ya ku
  Indonesia. Kukizaso \u0175adumbu \u0175anyake 6 \u0175amishonale. Mazina ghawo ghaka\u0175a:
  Gertrud Ott, Fredrika Renskers, Susie Stoove, Marian Stoove, Eveline Platte, na
  Mimi Harp. Fredrika Renskers wakati: \u201c\u0174anthu \u0175anandi ku malo uku
  \u0175aka\u0175a \u0174asilamu kweni \u0175aka\u0175anga \u0175aubwezi. \u0174aka\u0175a
  nga kuti \u0175akalindizganga waka unenesko. Ntheura chika\u0175a chipusu kwamba
  kusambira nawo Baibolo. Mu vyaka vitatu pera, ku Surabaya kuka\u0175a mpingo wa
  \u0175apharazgi 75.\u201d\\nPanyengo yira, Musilamu munyake zina lake Azis wa ku
  Padang, West Sumatra, wakalembera kalata ofesi ya munthavi kupempha sambiro. Azis
  wakasambirapo na \u0175apayiniya \u0175a ku Australia mu chaka cha 1930 kweni wakamanyanga
  yayi uko \u0175amishonale a\u0175a \u0175aka\u0175a panyengo iyo charu cha Japan
  chikapoka malo agha. Zu\u0175a linyake wakasanga kabuku kakulembeka na \u0174akaboni
  \u0175a Yehova. Iyo wakalemba kuti: \u201cNkhati nawona adiresi ya ofesi ya ku Jakarta
  mu kabuku aka, nkha\u0175aso na njara yauzimu.\u201d Mwalu\u0175iro ofesi yikatuma
  mula\u0175iliri wa dera Frans van Vliet ku Padang kuti wakakumane na Azis. Mula\u0175iliri
  wa dera wakasanga kuti Azis wali kupharazgirapo Nazar Ris uyo wakakhalanga nayo
  pafupi ndipo wakagwiranga ntchito mu boma. Nazar Ris waka\u0175a na njara yauzimu.
  Wose \u0175a\u0175iri \u0175akazomera unenesko pamoza na mabanja ghawo. Nyengo yikati
  yajumphapo, Azis waka\u0175a mulara wakugomezgeka. Nazar Ris, waka\u0175aso mupayiniya
  wapadera, ndipo \u0175ana \u0175ake \u0175anandi Mbakaboni \u0175akulimbikira ute\u0175eti.\\nFrans
  van Vliet wakati wafika waka ku Padang, wakaluta kukakumana na mubali wakulopwa
  yura ndipo wakamusanga wakuzenga nyumba yakupangiramo mafuta ku Balikpapan, East
  Kalimantan. Frans wakamba kuluta na mbali uyu mu ute\u0175eti wa m\u2019munda na
  kumovwira kuti wasambirenge Baibolo na \u0175anthu \u0175anandi. Pambere Frans wandawelere
  ku Netherlands, waka\u0175a kuti wambiska kagulu ku Balikpapan.\\nNyengo yikati
  yajumphapo, mudumbu munyake uyo waka\u0175a kuti wabatizika waka, zina lake Titi
  Koetin wakasamukira ku Banjarmasin, South Kalimantan. Titi wakapharazgira \u0175abali
  \u0175ake mu muzi wa Dayak ndipo wakawovwira \u0175anandi kumanya unenesko. \u0174anthu
  \u0175anandi awo waka\u0175awovwira \u0175akawelera mu mizi yawo mukati mwa Kalimantan
  ndipo \u0175akambiska tumagulu uto tukakura na kuzgoka mipingo yikuru.\\nMabuku
  gha mu Chiindonesiya\\nNtchito yakupharazga yati yaluta panthazi chomene, \u0175abali
  \u0175akakhumbanga mabuku ghanandi gha mu Chiindonesiya. Mu 1951, buku lakuti Mulungu
  Akhale Woona likang\u2019anamurika mu Chiindonesiya. Kweni \u0175aboma \u0175akasintha
  kalembero ka masipeling\u2019i ya Chiindonesiya. Ntheura ofesi ya munthavi yikanozgaso
  vyakuti kabuku aka ka\u0175e na masipeling\u2019i ghaphya. * Buku ili likati lafumiskika,
  \u0175anthu awo \u0175akayowoyanga Chiindonesiya \u0175akalitemwa chomene.\\nMu
  1953, ofesi ya munthavi yikasindikizga magazini gha Gongwe la Mulinda ghakukwana
  250 mu Chiindonesiya. Aka kaka\u0175a kakwamba mu vyaka 12 kuti magazini gha chiyowoyero
  ichi ghasindikizgike. Magazini iyi yika\u0175a na mapeji 12 ndipo pakwamba muka\u0175a
  nkhani zakusambira pera. Pati pajumpha vyaka vitatu, magazini iyi yika\u0175a na
  mapeji 16 ndipo kampani yinyake ndiyo yikasindikizganga. Mwezi uliwose yikasindikizganga
  magazini 10,000.\\nMu 1957, Wukani! yikamba kusindikizgika mwezi uliwose mu Chiindonesiya.
  Mwalu\u0175iro \u0175akamba kusindikizga magazini gha Wukani! ghakukwana 10,000
  pa mwezi. Chifukwa cha kuchepa kwa mapepara ghakusindikizgira, \u0175abali \u0175akeneranga
  kusanga layisensi ku boma yakuchemeskera mapepara. Mulara wa boma uyo wakapokera
  kalata yakupempha layisensi, wakati: \u201cNkhuwona kuti magazini ya Menara Pengawal
  (Gongwe la Mulinda) njimoza mwa magazini ghawemi chomene kuno ku Indonesia. Ntheura
  nakondwa chomene kupulika fundo iyi, ndipo nimovwiraninge kuti musange layisensi
  yakuchemeskera mapepara ghakupangira magazini yinu yiphya iyi.\u201d\"", "\"DAVIDE
  wakaphapatizga mukati mwa \u0175asilikari awo \u0175akachimbiranga. \u0174asilikari
  a\u0175a \u0175aka\u0175a na wofi chomene apo \u0175akachimbiranga. Kasi \u0175akawopanga
  vichi? Davide wakwenera kuti waka\u0175apulikanga \u0175akuyowoya lizgu limoza mwakuwerezgawerezga.
  \u0174akayowoyanga vya munthu yumoza. Davide wakati wala\u0175iska, wakamuwona munthu
  uyo \u0175akanenanga. Munthu uyu wakimilira mu dambo, panji kaka\u0175a kakwamba
  kuti Davide wawone munthu wanthena.\\nWaka\u0175a Goliyati! Sono Davide wakamanya
  chifukwa icho \u0175asilikari \u0175akamuwoperanga munthu uyu. Chika\u0175a chimunthu
  chikuru na chitali. Uzito wake ukayananga waka na \u0175asilikari \u0175a\u0175iri
  \u0175ankhongono. Kweni wakavwara vyankhondo, ndipo waka\u0175a na nkhongono, kweniso
  wakumanya kurwa. Goliyati wakabechanga. Vimazgu vyake vikwenera kuti vikasunkhunya
  tumapiri apo wakanenanga \u0175asilikari \u0175a Israyeli pamoza na themba lawo,
  Sauli. Waka\u0175abechera kuti \u0175amutumire munthu kuti wakatimbane nayo, mbwenu
  nkhondo yimalirenge papo.\u20141 Samuyeli 17:4-10.\\n\u0174aisrayeli pamoza na themba
  lawo Sauli \u0175akati waka khumakhuma. Davide wakapulika kuti ivi vikachitika nyengo
  yitali, kujumpha mwezi. \u0174asilikari \u0175a \u0174afilisiti na \u0174aisrayeli,
  \u0175akakhala waka chete, apo Goliyati wakanyozanga zu\u0175a na zu\u0175a. Davide
  wakaseluka navyo. Chika\u0175a chinthu chakulengeska kuwona themba la Israyeli na
  \u0175asilikari \u0175ake, kweniso \u0175akuru \u0175a Davide \u0175atatu, \u0175akuchita
  wofi. Davide wakawona kuti Goliyati wakakhozganga waka soni \u0175asilikari \u0175a
  Israyeli yayi. Kweni wakanyozanga Yehova, Chiuta wa Israyeli. Kweni kasi Davide,
  mwana wa chee, wakachitachi? Kasi ise tingasambirako vichi ku chipulikano cha Davide?\u20141
  Samuyeli 17:11-14.\\n\u201cUMUPHAKAZGE, PAKUTI NI MWENEYUYU\u201d\\nTiyeni tiwone
  dankha ivyo vikachitika myezi yinandi kumasinda. Yika\u0175a nyengo yamise, ndipo
  Davide wakaliskanga mberere za awiske mumphepete mwa mapiri, kufupi na Betelehemu.
  Munyamata uyu wakababika makora chomene, waka\u0175a muswesi na wakujintcha. Panji
  waka\u0175a na vyaka vyapakati pa 13 na 19. Para wafwasa, wakalizganga bango. Wakakondwanga
  chomene na kutowa kwa chilengiwa cha Chiuta, ndipo waka\u0175a na luso pakwimba
  chifukwa wakayezgeleranga nyengo zinandi. Kweni mise yinyake, Davide wakachemeka.
  Awiske \u0175akatuma uthenga kuti walute lu\u0175iro ku nyumba.\u20141 Samuyeli
  16:12.\\nWakati wafika ku nyumba, wakasanga awiske \u0175akuchezga na mwanalume
  munyake muchekuru. Mwanalume uyu waka\u0175a Samuyeli, ntchimi yakugomezgeka ya
  Chiuta. Yehova wakamutuma Samuyeli kuti wakaphakazge yumoza wa \u0175ana \u0175a
  Yese kuti wa\u0175e themba lakulondezgapo la Israyeli. Samuyeli waka\u0175awona
  kale \u0175akuru \u0175a Davide 7. Kweni Yehova wakamuphalira kuti palije uyo wasankhapo.
  Davide wakati wafika, Yehova wakaphalira Samuyeli kuti: \u201cWuka, umuphakazge,
  pakuti ni mweneyuyu.\u201d Ntheura Samuyeli wakatora supa ya mafuta na kupungulira
  pa mutu wa Davide, uku \u0175akuru \u0175ake wose \u0175akuwona. Davide wakati waphakazgika,
  umoyo wake ukasinthirathu. Baibolo likuti: \u201cMzimu wa Yehova ukamba kumupa nkhongono
  Davide kwamba zu\u0175a lira kuya munthazi.\u201d\u20141 Samuyeli 16:1, 5-13.\\nKasi
  Davide wakamba ku\u0175a na mtima wakuti wa\u0175e themba nyengo yeneyiyo? Yayi,
  iyo wakalindilira kuti mzimu wa Yehova ndiwo umuphalire nyengo yakuti wambire ku\u0175a
  na mazaza. Pa nyengo iyi, wakalutilira kuliska mberere za awiske. Ntchito iyi wakayigwiranga
  na mtima wose kweniso mwachikanga. Vi\u0175eto vya awiske vikati viliwenge ka\u0175iri
  kose, pakwamba na nkhalamu ndipo pamanyuma na nkhalamira. Davide wakavichimbizga
  waka yayi vikoko ivi. Kweni wakalimbana navyo kuti wavikilire mberere za awiske.
  Wakakoma nkhalamu na nkhalamira, yekha na yekha.\u20141 Samuyeli 17:34-36; Yesaya
  31:4.\\nNyengo yikati yajumphapo, Davide wakachemekaso. Icho chikachitika ntchakuti
  Themba Sauli likapulika mbiri ya munyamata uyu. Pa nyengo iyi, Yehova wakaleka kumutemwa
  Sauli chifukwa chakuti wakamugalukira, nangauli waka\u0175a wachali wankhondo wankhongono.
  Kweniso Yehova wakawuskapo mzimu wake pa Sauli. Ntheura kanandi themba ili likasuzgikanga
  na mzimu uheni, lika\u0175a likali, likakayikiranga \u0175anthu, ndipo lika\u0175a
  lambembe. Para mzimu uheni wamwizira Sauli, wakajipulikangako makora para wapulika
  tusumu. \u0174antchito \u0175anyake \u0175a Sauli \u0175akapulika kuti Davide wakumanya
  chomene kwimba kweniso kurwa nkhondo. Ntheura \u0175akamuchema Davide, ndipo wakazgoka
  yumoza wa \u0175akwimba mu nyumba ya Sauli, kweniso wakunyamura vilwero.\u20141
  Samuyeli 15:26-29; 16:14-23.\\n\u0174anyamata \u0175angasambirako vinandi ku chipulikano
  cha Davide pa nkhani izi. Wonani kuti Davide wakachitanga vinthu ivyo vikamovwira
  kuti watemwenge Yehova. Wakazikira, ndipo wakasambira maluso agho ghakamovwira kuti
  walembeke ntchito. Kweni chikuru chomene ntchakuti wakalongozgekanga na mzimu wa
  Yehova. Ivi ni vinthu vyakuti tose tikwenera kusambirako.\u2014Mupharazgi 12:1.\\n\u201c\u0174ANTHU
  \u0174ALEKE KUTAYA MTIMA CHIFUKWA CHA IYO\u201d\\nApo wakate\u0175eteranga Sauli,
  kanandi Davide wakaweleranga kukwake kukaliska mberere, ndipo nyengo zinyake wakakhalangako
  nyengo yitali. Pa umoza wa maulendo agha ndipo Yese wakatuma Davide kuti wakawone
  \u0175akuru \u0175ake \u0175atatu, awo \u0175aka\u0175a ku nkhondo pamoza na Sauli.
  Davide wakapulikira, ndipo waka\u0175anyamulira vinthu \u0175akuru \u0175ake, wakalazga
  ku Dambo la Ela. Wakati wafika, wakazizwa kuwona kuti \u0175asilikari \u0175a magulu
  gha\u0175iri \u0175imilira waka, nga umo vyalongosolekera pakwamba. \u0174asilikari
  a\u0175a \u0175akafora sirya na sirya mu vikhizga vya dambo lisani lira.\u20141
  Samuyeli 17:1-3, 15-19.\\nDavide wakawona kuti ntchakupulikikwa yayi kuti vinthu
  vi\u0175e nthena. Kasi \u0175asilikari \u0175a Yehova, Chiuta wamoyo, \u0175akachitika
  wuli kopa munthu, wakusopa \u0175angoza futi? Davide wakawona kuti Goliyati wakanyozanga
  Yehova. Ntheura wakamba kuphalira \u0175asilikari kuti wangamarana nayo Goliyati.
  Nyengo yichoko waka, mukuru wake mulara Eliyabu, wakapulika ivyo Davide wakayowoyanga.
  Ntheura wakamukalipira na kumunena kuti wizira kuzakawona ivyo vikuchitika ku nkhondo.
  Kweni Davide wakazgora kuti: \u201cKasi nanangachi? Ine nafumbanga waka.\u201d Kufuma
  apo, wakalutilira kuyowoya na chikanga vyakuti wangathereska Goliyati, m\u2019paka
  munthu munyake wakakaphalira Sauli nkhani iyi. Themba likamuchemeska Davide.\u20141
  Samuyeli 17:23-31.\\nDavide wakalikhwimiska themba kuti wamalanenge nayo Goliyati.
  Wakati: \u201c\u0174anthu \u0175aleke kutaya mtima chifukwa cha iyo.\u201d Sauli
  na \u0175anthu \u0175ake \u0175akataya nadi mtima chifukwa cha Goliyati. Panyake
  \u0175akajiyaniskanga na chimunthu chikuru ichi, na kuwona kuti \u0175akamuweranga
  waka mu nganga. \u0174akaghanaghananga kuti wangasuzgika yayi ku\u0175akoma. Kweni
  ndimo Davide wakaghanaghaniranga yayi. Nga umo tiwonerenge, iyo wakaliwona munthowa
  yinyake suzgo ili. Ntheura wakajipeleka kuti wakatimbane na Goliyati.\u20141 Samuyeli
  17:32.\\nSauli wakakana, wakati: \u201cIwe ungarwa yayi na Mufilisiti uyu chifukwa
  ndiwe msepuka, ndipo Mufilisiti uyu ni msilikari kwamba pa wanichi wake.\u201d Kasi
  Davide waka\u0175a mwana nadi? Yayi, kweni kuti waka waka\u0175a wandafikepo pakuti
  wanganjira usilikari. Nakuti panji wakawonekanga mwana. Kweni Davide waka\u0175a
  kale munthu wachikanga ndipo pa nyengo iyi wakwenera kuti waka\u0175a na vyaka vyapakati
  pa 16 na 20.\u20141 Samuyeli 16:18; 17:33.\\nDavide wakamusimikizgira Sauli kuti
  waleke kumudelera, wakamulongosolera umo wakakomera nkhalamu na nkhalamira. Kasi
  apa wakajihayanga? Yayi. Davide wakamanyanga icho chikamovwira kuti wakome vikoko
  vira. Iyo wakati: \u201cYehova uyo wakanithaska ku njo\u0175e za nkhalamu na za
  nkhalamira wanithaskenge ku woko la Mufilisiti uyu.\u201d Sauli wakaso\u0175a chakuyowoya,
  mbwenu wakati: \u201cLuta, ndipo Yehova wa\u0175e nawe.\u201d\u20141 Samuyeli 17:37.\\nKasi
  namwe mungatemwa ku\u0175a na chipulikano nga ntcha Davide? Ipo wonani kuti chipulikano
  icho Davide waka\u0175a nacho ghaka\u0175a maghanoghano waka yayi. Waka\u0175a na
  chipulikano mwa Chiuta wake chifukwa cha ivyo wakamanyanga kweniso ivyo vikamuchitikirapo.
  Wakamanyanga kuti Yehova wakuvikilira kweniso wakufiska ivyo walayizga. Usange nase
  tikukhumba ku\u0175a na chipulikano chanthena, tikwenera kusambira vya Chiuta uyo
  wakuzunulika mu Baibolo. Usange tikuchita ivyo tikusambira, tiwonenge kuti viwemi
  ivyo tikusanga vikukhozga chipulikano chithu.\u2014\u0174ahebere 11:1.\\n\u201cYEHOVA
  WAKUPELEKENGE MU WOKO LANE\u201d\\nPakwamba, Sauli wakakhumbanga kumuvwalika Davide
  vyakuvwara vyake vya nkhondo. Vika\u0175a nga vya Goliyati, vika\u0175a vyamku\u0175a,
  ndipo panji vika\u0175aso na chilaya chachisulo, cha visulo vyakunjilirananjilirana.
  Kweni Davide wakati wavivwara na kuyezga kwenda, wakasanga kuti wangakwaniska yayi.
  Iyo waka\u0175a msilikari wambura kusambizgika, ntheura wakazgo\u0175era yayi kuvwara
  vyankhondo, chomenechomene ivyo Sauli wakavwaranga, pakuti waka\u0175a mutali chomene
  mu Israyeli mose. (1 Samuyeli 9:2) Davide wakavura vyose ndipo wakavwara malaya
  ghake agho wakaghazgo\u0175era, ghakuliskira vi\u0175eto.\u20141 Samuyeli 17:38-40.\\nDavide
  wakayegha ndodo yake iyo wakendanga nayo ku uliska, kasaka pa chi\u0175egha, na
  chakuponyera malibwe. Munthu wangawona nga kuti chakuponyera malibwe chika\u0175avya
  ntchito, kweni ndicho chika\u0175a chilwero chakofya chomene. Muliska wa vi\u0175eto
  wakachigomezganga chomene. Chakuponyera malibwe chika\u0175a cha tuvingwe tu\u0175iri
  twa vikumba ndipo kuumaliro chika\u0175a nga nkhathumbathumba. Munthu wakatoranga
  libwe na ku\u0175ika ku kathumba, wakazungunyanga chomene, mbwenu na kulekezga kachingwe
  kamoza. Libwe likafumanga umo ni ngozi. Chakuponyera malibwe chika\u0175a chakovwira
  chomene mwakuti mitundu yika\u0175angaso na \u0175asilikari \u0175anyake awo \u0175akagwiliskiranga
  ntchito vyakuponyera malibwe pera.\\nDavide wakati watora tunthu twake, wakachimbira
  kulazga kwa mulwani wake. Davide wakwenera kuti wakalombanga chomene apo wakasindamanga
  mu kamlonga kambura maji na kusora tumalibwe tunkhondi. Kufuma apo, wakanyamuka
  kuluta uko kuka\u0175a mulwani, wakachimbiranga.\\nKasi Goliyati wakati wuli wati
  wawona munthu uyo wakizanga kuti wazakatimbane nayo? Baibolo likuti: \u201cWakamupepura
  chifukwa Davide waka\u0175a waka msepuka muswesi, wakuwoneka makora.\u201d Goliyati
  wakachemerezga kuti: \u201cKasi nili ntche\u0175e ine, apo ukwiza kwa ine na tumaluswazu?\u201d
  Panji wakayowoya nthena chifukwa chakuti wakawona ndodo pera iyo Davide wakayegha,
  kweni chakuponyera malibwe wakachiwona yayi. Wakamunena Davide mu zina la \u0175achiuta
  \u0175a \u0174afilisiti ndipo wakati wapelekenge chitanda chake ku viyuni na vikoko
  vyamuthondo.\u20141 Samuyeli 17:41-44.\\nIvyo Davide wakazgora vikulongora kuti
  waka\u0175a nadi na chipulikano. Nangauli waka\u0175a munyamata, kweni wonani ivyo
  wakayowoya kwa Goliyati. Wakati: \u201cIwe ukwiza kwa ine na lupanga, na mkondo,
  kweni ine nkhwiza kwa iwe mu zina la Yehova wa mawumba, Chiuta wa \u0175ankhondo
  \u0175a Israyeli, uyo wamunyoza.\u201d Davide wakamanyanga kuti nkhongono za munthu
  na vilwero ni vyakuzirwa chomene yayi. Goliyati wakayuyura Yehova Chiuta, ndipo
  Yehova wakachitapo kanthu. Nga umo Davide wakayowoyera, \u201cnkhondo nja Yehova.\u201d\u20141
  Samuyeli 17:45-47.\\nDavide wakawona ukuru wa Goliyati na vilwero vyake. Kweni wakakhumba
  yayi kuti vimutenthemeske. Wakakhumba yayi kuchita ivyo Sauli na \u0175asilikari
  \u0175ake \u0175akachita. Davide wakajiyaniska na Goliyati yayi. Kweni wakayaniska
  Goliyati na Yehova. Goliyati wakimilira pakati pa \u0175asilikari \u0175anyake,
  utali wake mamita 2.9. Kweni kasi waka\u0175a kuti wangaluska Fumu ya chilengiwa
  chose? Mu maso gha Chiuta, nayo waka\u0175a nga ni mphazi, iyo Yehova waka\u0175a
  pafupi kuyitikinyura.\\nDavide wakachimbilira kwa Goliyati, wakatora libwe mu kasaka
  kake na ku\u0175ika ku chakuponyera. Wakachizungunya m\u2019paka chikalira vuvuvuvu!
  Goliyati nayo wakalotokera Davide, panji wakizanga mumanyuma mwa uyo wakamunyamuliranga
  chiskango. Panji utali ndiwo ukamuziyamo Goliyati, pakuti wakunyamura chiskango
  waka\u0175a mutali vi\u0175i yayi, ntheura paka\u0175a pakusuzga kuti wakwezge chiskango
  na kuvikilira mutu wa Goliyati. Ku mutu kura ndiko Davide wakadinika.\u20141 Samuyeli
  17:41.\\nDavide wakalekezga libwe lake. Likati waka ng\u2019wee kulazga kwa Goliyati.
  Yehova wakawoneseska kuti Davide waleke kuponya malibwe gha\u0175iri. Libwe likafikira
  pa chisko cha Goliyati kho, na mukati \u0175enu! Nyengo yeneyiyo Goliyati wakawa
  pasi dyonkho! Uyo wakamunyamuliranga chiskango wakwenera kuti wakati waka chibododo
  nipoka. Davide wakiza pafupi, wakatora lupanga lwa Goliyati, ndipo wakadumura mutu
  wa chinkhara ichi.\u20141 Samuyeli 17:48-51.\\nPaumaliro, Sauli na \u0175asilikari
  \u0175ake nkhongono zikizamo. \u0174akaskera \u0174afilisiti. Nkhondo yikanunkha,
  ndipo ivyo Davide wakaphalira Goliyati vikafiskika, apo wakati: \u201cYehova . .
  . wapelekenge mose imwe mu woko lithu.\u201d\u20141 Samuyeli 17:47, 52, 53.\\nLero,
  \u0175ate\u0175eti \u0175a Chiuta \u0175akurwa nkhondo ya vilwero yayi. Nyengo ya
  nkhondo iyi yili kujumpha. (Mateyu 26:52) Kweni tikwenera kuyezga chipulikano cha
  Davide. Nga ndiyo, tiwonenge Yehova kuti ngwanadi, nga ni Chiuta yekha uyo tikwenera
  kumute\u0175etera na kumopa. Nyengo zinyake tingawoneka \u0175achoko pakuyaniska
  na masuzgo ghithu, kweni masuzgo ghithu ngachoko pakuyaniska na nkhongono zambura
  chigoti za Yehova. Usange tasankha Yehova ku\u0175a Chiuta withu na ku\u0175a na
  chipulikano mwa iyo nga umo Davide wakachitira, mbwenu palije suzgo, panji nthangwanika
  iyo yingatiwiskira pasi. Palije icho chingamutonda Yehova.\"", "\"Baibolo la pa
  Intaneti\\nMALEMBA GHAKUPATULIKA MU MANG''ANAMULIRO GHA CHARU CHIPHYA\\n2 Penepapo
  Hana wakayowoya mu lurombo, wakati:\u201cMtima wane ukusekelera mwa Yehova,+\\nSengwe
  lane lakwezgeka mwa Yehova.\\nMulomo wane wayasamira \u0175alwani \u0175ane,\\nPakuti
  nkhusekelera mu milimo yinu yakuponoska.\\n2 Kulije munyake mutu\u0175a nga ni Yehova,\\nKulije
  munyake, kweni imwe pera,+\\nNdipo kulije jalawe lakuyana na Chiuta withu.+\\n3
  Mungalutiliranga kuyowoya mwakujikuzga chara,\\nKanthu kose kamtonyoro kangafumanga
  chara mu mulomo winu,\\nPakuti Yehova ni Chiuta wakumanya tunthu,+\\nNdipo milimo
  yikupimika makora chomene na iyo.\\n4 Mauta gha \u0175anthu \u0175ankhongono ghakuphyoka,\\nKweni
  awo \u0175akukhu\u0175ara \u0175akupika nkhongono.+\\n5 \u0174anthu awo \u0175akaryanga
  makora, sono \u0175akulimiska kuti \u0175asange chingwa,\\nKweni \u0175anjara \u0175aliso
  na njara chara.+\\nMwanakazi chumba wababa \u0175ana 7,+\\nKweni uyo waka\u0175a
  na \u0175ana \u0175anandi wakhala mawoko ghawaka.\\n6 Yehova wakukoma na kusungilira
  umoyo.\\nWakukhizgira munthu ku Dindi na kuwuskaso.+\\n7 Yehova wakukavuska munthu,
  ndipo wakusambazga.+\\nWakukhizga munthu, ndipo wakukwezga.+\\n8 Wakuwuska munthu
  wakuyuyuka pa fuvu.\\nWakunyamuska \u0175akavu pa vyoto,+\\nKuti wa\u0175akhazike
  pamoza na \u0175akaronga,\\nWaku\u0175apa chitengo cha ntchindi.\\nPakuti ivyo vikukhozga
  charu chapasi ni vya Yehova,+\\nNdipo waku\u0175ikapo dongo lavundira pa ivyo.\\n9
  Wakuvikilira malundi gha \u0175akugomezgeka \u0175ake,+\\nKweni \u0175aheni \u0175achetamiskikenge
  mu chisi,+\\nPakuti munthu wakutonda na nkhongono zake chara.+\\n10 Yehova waswenge
  awo \u0175akulimbana nayo.+\\nWadudumirenge kwimikana nawo kufuma kuchanya.+\\nYehova
  weruzgenge m\u2019paka ku vigoti vya charu chapasi,+\\nWapelekenge nkhongono kwa
  themba lake,+\\nNa kutumphuska sengwe la wakuphakazgika wake.\u201d+\\n11 Elikana
  wakaluta ku nyumba yake ku Rama. Kweni msepuka yura waka\u0175a mute\u0175eti wa
  Yehova+ pamaso pa Eli wasembe.\\n12 Sono \u0175ana \u0175a Eli \u0175aka\u0175a
  \u0175aheni.+ Yehova \u0175aka\u0175a nayo na ntchito yayi.\\n13 Ichi ndicho \u0175akachitanga
  na vinthu vya \u0175asembe vyakufuma ku \u0175anthu:+ Usange munthu wakupeleka sembe,
  mute\u0175eti wa wasembe wakizanga na chifoloko mu woko lake para nyama yikubwata
  pa moto,\\n14 wakachinjizganga mu m\u2019phika, nkhali, chimphani, panji mu buzi.
  Chilichose icho chifoloko chazuwura, wasembe wakatoranga ku\u0175a chake. Ndimo
  \u0175akachitiranga mu Shilo ku \u0174aisrayeli wose awo \u0175akizanga kura.\\n15
  Kweniso pambere munthu wandawotche mafuta,+ mute\u0175eti wa wasembe wakizanga na
  kumuphalira kuti: \u201cPeleka nyama kwa wasembe kuti wawotche. Wapokenge chara
  nyama yakuphika kwa iwe, kweni nyama yi\u0175isi pera.\u201d\\n16 Para munthu yura
  wakuti: \u201c\u0174asunkhizge dankha mafuta,+ kufuma apo mungatora yiliyose iyo
  mwakhumba,\u201d iyo wakatenge: \u201cYayi, nipa sono nthena. Usange yayi, nitolerenge
  nkholi.\u201d\\n17 Ntheura kwananga kwa \u0175ate\u0175eti kuka\u0175a kukuru chomene
  pamaso pa Yehova,+ pakuti \u0175anthu \u0175akayuyuranga sembe za Yehova.\\n18 Sono
  Samuyeli wakate\u0175eteranga+ pamaso pa Yehova, wakavwaranga efodi wasalu yiwemi,+
  nangauli waka\u0175a msepuka.\\n19 Kweniso anyina \u0175akamusoneranga chakuvwara
  chichoko cha mawoko ghafupi, ndipo \u0175akalutanga nacho kwa iyo chaka na chaka
  para \u0175aluta na afumu \u0175awo kukapeleka sembe za chaka na chaka.+\\n20 Eli
  wakatumbika Elikana na muwoli wake, wakati: \u201cYehova wakupe mwana kufuma mwa
  mwanakazi uyu mu malo mwa uyo mwapeleka kwa Yehova.\u201d+ Mbwenu \u0175akawelera
  kukwawo.\\n21 Yehova wakakumbuka Hana, mwakuti wakatoranga nthumbo.+ Wakababaso
  \u0175ana \u0175analume \u0175atatu na \u0175asungwana \u0175a\u0175iri. Msepuka
  Samuyeli wakalutilira kukura pamaso pa Yehova.+\\n22 Sono Eli waka\u0175a muchekuru
  chomene, kweni wakapulika vyose ivyo \u0175ana \u0175ake \u0175akachitiranga+ \u0174aisrayeli
  wose na umo \u0175akagoneranga na \u0175anakazi awo \u0175akate\u0175eteranga pa
  mulyango wa chihema chakukumanamo.+\\n23 Wakatenge kwa iwo: \u201cKasi mukuchitirachi
  vinthu vyanthena ivi? Pakuti ivyo nkhupulika vya imwe kufuma ku \u0175anthu wose
  ni viheni.\\n24 Yayi, \u0175ana \u0175ane, ivyo nkhupulika vikuyowoyeka pakati pa
  \u0175anthu \u0175a Yehova ni viwemi yayi.\\n25 Usange munthu wanangira munyake,
  yunji wangamu\u0175eyelelera kwa Yehova. Usange munthu wanangira Yehova,+ ni njani
  wangamulombera?\u201d Kweni \u0175akakana kupulikira awiskewo, chifukwa Yehova waka\u0175ikapo
  mtima kuti wa\u0175akome.+\\n26 Pa nyengo yira, msepuka Samuyeli wakalutilira kukura
  mu msinkhu, wakatemwekanga na Yehova na \u0175anthu wuwo.+\\n27 Munthu wa Chiuta
  wakiza kwa Eli, wakati kwa iyo: \u201cYehova wakuti: \u2018Asi nkhajivumbura ku
  nyumba ya wuso apo waka\u0175a muzga ku Eguputo mu nyumba ya Farawo?+\\n28 Nkhamusora
  kufuma pa mafuko ghose gha Israyeli+ kuti wate\u0175etere nga wasembe wane na kukwera
  pa jotchero lane+ kupeleka sembe, kotcha vyakununkhira, na kuvwara efodi pamaso
  pane. Nkhapeleka ku nyumba ya sekuru wako sembe zose zakotcha pa moto za \u0174aisrayeli.+\\n29
  Chifukwa wuli imwe mwa\u0175anthu mukupepura sembe na vyakupeleka vyane ivyo nkhayowoya
  kuti vipelekekenge mu malo ghane ghakukhalamo?+ Chifukwa wuli ukulutilira kuchindika
  \u0175ana \u0175ako kuluska ine pakujitutu\u0175iska na viga\u0175a viwemi chomene
  vya sembe yiliyose ya \u0175anthu \u0175ane Israyeli?+\\n30 \u201c\u2018Lekani mazgu
  gha Yehova Chiuta wa Israyeli ghakuti: \u201cNkhayowoya nadi kuti nyumba yako na
  nyumba ya sekuru wako yendenge pamaso pane nyengo zose.\u201d+ Kweni sono Yehova
  wakuti: \u201cNingachichita chara, chifukwa awo \u0175akunichindika ni\u0175achindikenge,+
  kweni awo \u0175akunipepura, \u0175ayuyulikenge.\u201d\\n31 Wona, mazu\u0175a ghakwiza
  apo nizamudumura nkhongono zako na za nyumba ya awuso, mwakuti mu nyumba yako muzamu\u0175avya
  munthu wakukhala m\u2019paka uchekuru wake.+\\n32 Ndipo uzamula\u0175iska pa mulwani
  mu malo ghane ghakukhalamo pakati pa viwemi vyose ivyo vikuchitikira Israyeli.+
  Munthu muchekuru wazamu\u0175amoso chara mu nyumba yako.\\n33 Munthu wakwako uyo
  nindamudumure kute\u0175etera pa jotchero lane wazamufu\u0175iska maso ghako na
  kukukhizgira chitima, kweni \u0175anandi \u0175a nyumba yako, \u0175anthu \u0175azamu\u0175akoma
  na lupanga.+\\n34 Icho chichitikirenge \u0175ana \u0175ako \u0175a\u0175iri, Hofini
  na Finehasi, chi\u0175enge chimanyikwiro kwa iwe: Wose \u0175a\u0175iri \u0175afwenge
  zu\u0175a limoza.+\\n35 Penepapo nizamujiwuskira wasembe wakugomezgeka.+ Wazamuchita
  kuyana na ivyo mtima wane ukukhumba. Nizamumuzengera nyumba yamuyirayira, ndipo
  wazamwenda pamaso pa wakuphakazgika wane nyengo zose.\\n36 Waliyose uyo wakhalengepo
  mu nyumba yako wizenge na kumusindamira kuti wapike ndalama na chingwa. Watenge:
  \u201cNkhumu\u0175eyani, munipeko mulimo wa usembe kuti niryengeko kachingwa.\u201d\u2019\u201d+\"",
  "\"Baibolo la pa Intaneti\\nMALEMBA GHAKUPATULIKA MU MANG''ANAMULIRO GHA CHARU CHIPHYA\\n-\\nUkotoli
  pa Giligala (1-9)\\n-\\nPaska lachitika; mana ghaleka (10-12)\\n-\\nKaronga wa nkhondo
  ya Yehova (13-15)\\n5 Mathemba ghose gha \u0174aamori+ agho ghaka\u0175a kumafumiro
  gha dazi kwa Yorodani, na mathemba ghose gha \u0174akenani+ agho ghaka\u0175a kufupi
  na nyanja, ghakati ghapulika kuti Yehova wakakamuska maji gha Yorodani panthazi
  pa \u0174aisrayeli m\u2019paka \u0175akambuka, mitima yawo yikasongonoka+ ndipo
  paka\u0175avya wakukhwima mtima chifukwa cha \u0174aisrayeli.+\\n2 Pa nyengo yira,
  Yehova wakati kwa Joshuwa: \u201cUpange vimayi vyamalibwe, ukotoreso+ \u0175analume
  \u0175a Israyeli kachi\u0175iri.\u201d\\n3 Ntheura Joshuwa wakapanga vimayi vyamalibwe
  na kukotora \u0175analume \u0175a Israyeli pa Gibeyati-haaraloti.+\\n4 Joshuwa waka\u0175akotora
  pa chifukwa ichi: \u0174analume wose pakati pa \u0175anthu awo \u0175akafuma ku
  Eguputo, \u0175analume wose \u0175a nkhondo, \u0175akafwira mu mapopa paulendo wakufuma
  ku Eguputo.+\\n5 \u0174anthu wose awo \u0175akafuma ku Eguputo \u0175akakotoleka,
  kweni \u0175anthu wose awo \u0175akababikira mu mapopa paulendo wakufuma kura \u0175akakotoleka
  yayi.\\n6 \u0174aisrayeli \u0175akenda vyaka 40+ mu mapopa m\u2019paka mtundu wose
  ukafwa, ndiko kuti, \u0175analume \u0175a nkhondo awo \u0175akafuma ku Eguputo,
  \u0175eneawo \u0175akapulikira yayi mazgu gha Yehova.+ Yehova waka\u0175alapira
  kuti \u0175amuchiwona yayi charu+ icho Yehova wakalapa ku \u0175asekuru \u0175awo
  kuti watipenge,+ charu icho mukwenda mkaka na uchi.+\\n7 Ntheura wakawuska \u0175ana
  \u0175awo mu malo ghawo.+ A\u0175a ndiwo Joshuwa waka\u0175akotora, \u0175aka\u0175a
  \u0175ambura kukotoleka chifukwa chakuti mu nthowa \u0175aka\u0175akotora yayi.\\n8
  \u0174akati \u0175amara kukotora mtundu wose, \u0175akakhala mu malo ghawo mu msasa
  m\u2019paka vilonda vikapora.\\n9 Penepapo Yehova wakati kwa Joshuwa: \u201cMuhanya
  uno nakunkhuzgira kutali namwe msinjiro wa Eguputo.\u201d Ntheura malo ghara ghakuchemeka
  Giligala+ m\u2019paka lero.\\n10 \u0174aisrayeli \u0175akalutilira kukhala mu msasa
  pa Giligala, ndipo \u0175akachita Paska namise pa zu\u0175a la 14 la mwezi,+ mu
  vidika vya Yeriko.\\n11 \u0174akamba kurya vipasi vya charu zu\u0175a lakulondezgapo
  \u0175ati \u0175achita Paska, chingwa chambura nthukumusi+ na tirigu wakukazinga,
  pa zu\u0175a lenelira.\\n12 Pa zu\u0175a lakulondezgapo \u0175ati \u0175aryapo vipasi
  vya charu, mana ghakaleka. \u0174aisrayeli \u0175akaryaso mana chara,+ kweni \u0175akamba
  kurya vipasi vya charu cha Kenani mu chaka chira.+\\n13 Apo Joshuwa waka\u0175a
  pafupi na Yeriko wakinuska maso ghake ndipo wakawona mwanalume+ wimilira panthazi
  pake, wali na lupanga mu woko lake.+ Joshuwa wakaluta kwa iyo, wakati: \u201cKasi
  uli ku chiga\u0175a chithu panji chiga\u0175a cha \u0175alwani \u0175ithu?\u201d\\n14
  Munthu yura wakati kwa iyo: \u201cYayi, kweni niza nga karonga wa nkhondo ya Yehova.\u201d+
  Penepapo Joshuwa wakawa kavunama na kumusindamira, wakati: \u201cKasi fumu yane
  yikukhumba kuyowoyachi kwa mute\u0175eti wake?\u201d\\n15 Karonga wa nkhondo ya
  Yehova wakamuzgora Joshuwa kuti: \u201cVura vilyato vyako ku malundi ghako, chifukwa
  malo agho wimilirapo ngatu\u0175a.\u201d Nyengo yeneyiyo, Joshuwa wakavura.+\"",
  "\"Mostafa Kamal Madbouly (Arabic: \u0645\u0635\u0637\u0641\u0649 \u0643\u0645\u0627\u0644
  \u0645\u062f\u0628\u0648\u0644\u064a; born 28 April 1966)[1][2] ni Prime Minister
  wa Egypt, wakugwira ntchito kuyambira 2018. Wakapelekeka na pulezidenti Abdel Fattah
  el-Sisi kuti walondezge Sherif Ismail pamanyuma pakuti boma lake lalekerathu nchito
  apo Sisi wakasankhikaso. Madbouly nayo waka\u0175a nduna ya nyumba mu boma la Sherif
  Ismail, ndipo nyengo yichoko waka waka\u0175a nduna ya boma.[3][4]\\nNtchito\\nMadbouly
  wakamalizga masambiro ghake ku Cairo University,[5] wakapokera digiri ya masters
  na PhD ku sukulu ya Engineering mu 1988 na 1997.\\nHousing and Building Research
  Center\\nMadbouly wakamba nchito yake ku boma la Housing and Building Research Center
  (HBRC), ndipo waka\u0175a mulongozgi wa Training and Urban Studies Institute.\\nGeneral
  Organisation for Physical Planning\\nKufuma mu Seputembala 2009 kufika mu Novembala
  2011, Madbouly waka\u0175a wapampando wa wupu wakuwona vya mapulani gha msumba,
  General Organisation for Physical Planning (GOPP) uwo ukakolerananga na Unduna wa
  Nyumba.\\nUnited Nations Human Settlements Program\\nKufuma mu Novembala 2012 mpaka
  Febuluwale 2014 waka\u0175a mulongozgi wa vyaru vya Arab pa United Nations Human
  Settlements Program.[6]\\nMinister of Housing\\nMu March 2014 Madbouly wakasankhika
  ku\u0175a nduna ya Nyumba, Utilities and Urban Communities. Madbouly adakhalabe
  paudindo pambuyo pa kusankhidwa kwa Sherif Ismail kukhala Prime Minister mu Seputembara
  2015. Apo waka\u0175a nduna ya vya nyumba, wakala\u0175iliranga mulimo wa Nyumba
  za \u0174anthu (uwo ukuchemekaso kuti Miliyoni ya Nyumba).[7]\\nApo waka\u0175a
  nduna ya vya nyumba, Madbouly waka\u0175aso mulongozgi wa mawupu ghanandi, kusazgapo
  New Urban Communities Authority (NUCA), wupu uwo ukwendeska ntchito za malo na nyumba
  ku Egypt. Ku malo agha, wakala\u0175iliranga mulimo wa kuzenga Nyumba ya Ufumu.\\nActing
  Prime Minister\\nMu Novembala 2017, Madbouly wakasankhika ku\u0175a nduna yapachanya
  panyuma pakuti Sherif Ismail wakaluta ku Germany kukalwara.[8]\\nNduna yikuru ya
  Egypt\\nPa 7 June 2018, Pulezidenti Sisi wakasankha Madbouly ku\u0175a Prime Minister,
  uyo wakalutizga Sherif Ismail uyo wakaleka nchito cifukwa cakuti Sisi wakasankhikaso
  mu chisankho cha pulezidenti. Pa 9 June, nduna yikuru Madbouly yikasintha nduna
  za Egypt, na kusinthiska nduna zinkhondi na zitatu. Pa zu\u0175a lenelira, nkhani
  zikalongosorekaso kuti Nyumba ya Malamulo ya ku Egypt yikakolerana na ndondomeko
  yake ya mafumu ghaphya. Pa 10 June, vikamanyikwa kuti \u0175anakazi \u0175ankhondi
  na \u0175atatu ndiwo \u0175ate\u0175eterenge mu boma lake.[9][10] Pa 13 June, \u0175akayowoya
  kuti Madbouly wasankha ma Deputy Ministers 13 mpaka 16 ndipo Madbouly na boma lake
  \u0175azamulayizgika na Sisi pa 14 June. Madbouly na wupu wake \u0175akalumbikika
  na Sisi pa 14 June. Kweniso wakulutilira ku\u0175a nduna ya vya nyumba. \u0174akapharazga
  kuti boma lizamupharazga fundo zake pa 23 June,[11][12][13][14] kweni muyowoyeri
  wa nyumba ya malango Salah Hassaballah wakati nkhani izi ni zautesi. Pa 23 June,
  Hassaballah wakayowoya kuti nangauli paka\u0175avya zu\u0175a ilo \u0175akanozga
  kuti \u0175apeleke ndondomeko iyi ku Nyumba ya Malamulo, kweni wakagomezganga kuti
  boma la Madbouly lizamupeleka ndondomeko iyi sabata yakulondezgapo, kweni boma ili
  likutondeka kunozga ndondomeko iyi pa nyengo iyo \u0175akanozga. Pa 30 June, boma
  likapharazga kuti Madbouly wazamupharazga fundo zake pa 3 July, kuti wakwaniriske
  malango gha boma.\\nPa Julayi 3, 2018, Madbouly wakalembeska ndondomeko yake ku
  nyumba ya malango ya Egypt. Mu mazgu agha, wakayowoya kuti 85% ya ndondomeko yake
  ya kusintha vinthu mu ndyali yili kufiskika. Kufuma apo, mazgu agha ghakatumizgika
  ku komiti ya pa nyumba ya malango iyo yikulongozgeka na wachi\u0175iri kwa mulongozgi
  wa nyumba ya malango, ndipo pamasinda \u0175akayowoyapo vya kugomezgeka. Ndime 146
  ya dango la chalo yikulongosora kuti nduna yikuru iyo yikwimikika sono yikwenera
  kuyowoya fundo zake ku nyumba ya malango, ndipo pamanyuma pake \u0175imiliri \u0175a
  nyumba ya malango \u0175akwenera kuvota pa fundo iyo, ndipo ivi vikwenera kuchitika
  mu mazu\u0175a 30. Pa 11 Julayi 2018, wachiwiri kwa mulongozgi wa nyumba ya malango
  ya Egypt, Al-Sayed Al-Sherif, uyo wakalongozga komiti ya nyumba ya malango iyo yikawona
  umo Madbouly wakasinthira fundo zake, wakapharazga kuti komiti yake yamalizga kusanda
  fundo izo Madbouly wakayowoya ndipo yikapempha kuti pa 15 Julayi pa\u0175e voti
  ya chigomezgo. Pa 25 July 2018, mazu\u0175a 10 kufuma pa zu\u0175a ilo \u0175akakhumbanga
  kuti Madbouly wakhazikiskike, nyumba ya malango ya Egypt yikazomerezga ivyo Madbouly
  wakakhumbanga.[15][16]\\nUkaboni\\n- \\\"Archived copy\\\". Archived from the original
