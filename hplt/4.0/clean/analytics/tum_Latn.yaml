  Colorado: Renner, 2014.\\nViga\u0175a vya kuwalo[lemba | kulemba source]\\nLua error:
  bad argument #2 to ''title.new'' (unrecognized namespace name ''Portal'').\"", "\"IVYO
  MUKWENERA KUMANYA\\nVilato ni maloto waka yayi, ni vinthu ivyo vingachitika nadi.
  Munthu wakwenera kunozgekera, kusintha vinthu vinyake kweniso ku\u0175ikapo mtima
  kuti wafiske vilato vyake.\\nVilato vinyake viku\u0175a vichokovichoko ivyo vingatora
  mazu\u0175a panji masabata ghachoko waka kuti uvifiske. Ndipo vinyake vingatora
  myezi, chaka, panji kujumphirapo. Kuti munthu wafiske vilato vikuruvikuru, wakwenera
  kufiska dankha vilato vichokovichoko.\\nCHIFUKWA WULI NTCHAKUZIRWA?\\nPara wamunthu
  ukufiska vilato vyako uku\u0175a wakukondwa, uku\u0175a paubwezi na \u0175anyako
  kweniso ukujikayikira yayi.\\nKujikayikira yayi: Para mwaji\u0175ikira vilato vichokovichoko
  na kufiska, mujikayikirenge yayi kuti mungatondeka kufiska vilato vinyake vikuruvikuru.
  Kweniso muku\u0175a na chikanga para mukulimbana na masuzgo gha zu\u0175a na zu\u0175a
  nga nkhuchichizgika na \u0175anyinu kuchita viheni.\\nKu\u0175a paubwezi: \u0174anthu
  \u0175akutemwa ku\u0175a paubwezi na awo \u0175ali na vilato ndipo \u0175aku\u0175ikapo
  mtima kuti \u0175avifiske. Nakuti kanandi ubwezi ukukhora para ukugwira na munthu
  uyo vilato vyake vikuyana na vyako.\\nKukondwa: Para wamunthu waji\u0175ikira vilato
  na kuvifiska uku\u0175a wakukondwa.\\nChristopher wakati: \u201cNkhutemwa kuji\u0175ikira
  vilato. Ntheura nkhu\u0175ikapo mtima kuti nivifiske. Ndipo para wafiska chilato
  chako ukujipulika makora, ndipo ungati \u2018Aa, nafiska nadi! Ivyo nakhumbanga
  vyafiskika.\u2019\u201d\\nFUNDO YA MU BAIBOLO: \u201cUyo wakula\u0175ilira mphepo
  wase\u0175enge yayi mbuto, ndipo uyo wakula\u0175iska pa mabingu wavunenge kanthu
  chara.\u201d\u2014Mupharazgi 11:4.\\nIVYO MUNGACHITA\\nYezgani masachizgo agha kuti
  mufiske vilato vinu.\\nSankhani. Lembani vilato vinu na kuvi\u0175ika mu ndondomeko,
  manyani icho mwambirenge kufiska pakwamba, pachi\u0175iri, pachitatu, kweniso na
  vinyake.\\nNozgekerani. Pa chilato chilichose, chitani vinthu ivi:\\n-\\nLembani
  deti ilo mukukhumba kuti mufiskire chilato chinu.\\n-\\nLembani ivyo muchitenge
  kuti mufiske.\\n-\\nLembani masuzgo agho mukuwona kuti mungakumana nagho na umo
  mungaghatondera.\\nYambanipo. Lekani kulindilira kuti vyose vyende dankha makora
  ndipo mwambepo. Jifumbani kuti, \u2018Kasi ntchivichi chakwamba icho ningachita
  kuti nifiske chilato chane?\u2019 Para mwachimanya, chitani. Wonani umo mwachitira
  pa chiga\u0175a chilichose.\\nFUNDO YA MU BAIBOLO: \u201cMaghanoghano gha munthu
  wachitatata ghakovwira kuti vinthu vyende makora.\u201d\u2014Zintharika 21:5.\"",
  "\"Telekomu likuyowoya za kuga\u0175ana uthenga pa mtunda ukuru kwizira mu nthowa
  za pa magesi, kusazgapo kutumizga mazgu, data, na vidiyo.\\nTelekomu likukhwaskana
  na kugwiliskira nchito vinthu vya tekinoloje kutuma na kupokera vimanyikwiro nga
  ni vya magesi, ungweru, panji magesi gha gha ginito, pa vyakupharazga vyakupambanapambana
  nga ni mawaya gha mku\u0175a, mikusa ya ungweru, panji vipata vyambura waya. Viga\u0175a
  vinyake vikusazgapo:\\n- Chakutumizga \u2013 Kusintha uthenga ku\u0175a chimanyikwiro.\\n-
  Nthowa yakutumizga \u2013 Kunyamura chimanyikwiro (mwachiyelezgero, makhebo, majigha
  gha pa wayilesi).\\n- Chopokera \u2013 Ici cikupangiska kuti cimanyikwiro ciwelere
  ku uthenga wakugwiliskirika nchito.\\nMbiri ya Telekomu yikutora vyaka vinandi,
  ndipo yikasintha kufuma ku nthowa zakale m\u2019paka pa mikwawo ya pa intaneti ghakuchimbira
  chomene mazu\u0175a ghano.\\n\u0174anthu \u0175akwambilira \u0175akagwiliskiranga
  ntchito:\\n- Vimanyikwiro vya josi \u2013 Kudumbiskana kwakuwoneka pa mtunda.\\n-
  Ng''oma \u2013 Vimanyikwiro vyakupulikira mu Afrika na Amerika.\\n- Nthowa za Semaphore
  \u2013 Kuwoneska kwakuthemba pa mbendera ku Europe (mu vilimika vya vikwi vya m''ma
  18).\\n- Nthowa zakutumizga makalata \u2013 Mauthenga ghakulembeka ghakupelekeka
  na \u0175akutumizga makalata.\\n- 1837 \u2013 Samuel Morse wakapanga Lamya ya magesi,
  iyo yikapangiska kuti \u0175anthu \u0175ayowoyanenge pa mtunda utali kwizira mu
  khodi ya Morse.\\n- 1876 - Alexander Graham Bell wakapanga Lamya yiphya, kuzomerezga
  kutumizgika kwa mazgu pa waya.\\n- Kumapeto kwa vilimika vya m''ma 19th century
  \u2013 Mafoni ghakukura, ndipo ghaku\u0175ika fawundeshoni ya mafoni gha mazu\u0175a
  ghano.\\n- M''ma 1890s - Guglielmo Marconi wakambiska kutumizga pa wayilesi, kupangiska
  kuti \u0175anthu \u0175ayowoyanenge kwambura waya.\\n- 1920s \u2013 Kupharazga kwa
  pa wayilesi ya malonda kwayamba.\\n- 1930s-1950s \u2013 kanema ya vithuzi yikuwoneka,
  kuphatikizapo vimanyikwiro vyakupulikika na vyakuwoneka kuti \u0175anthu \u0175anandi
  \u0175ayowoyanenge.\\n- Kukwambilira kwa vilimika vya m''ma 20th century \u2013
  Ma chubu gha vacuum (mavavu gha thermionic) ghakukuzga vimanyikwiro, vyakuzirwa
  chomene pa foni ya mtunda utali na makompyuta ghakwambilira.\\n- 1940s \u2013 Yikagwiriskirika
  nchito mu radar, wayilesi, na mirangura ghakwambilira pambere yindasinthike na ma
  transistor.\\n- M''ma 1960 \u2013 ARPANET, iyo yika\u0175a pakwamba pa Intaneti,
  yikupangika.\\n- 1970s-1980s - Kusintha kwa mapaketi na ndondomeko ya TCP / IP kukupangiska
  kuti data yi\u0175e yakuyana.\\n- 1990s \u2013 Webusayiti ya pa charu chose (WWW)
  yikupangiska kuti \u0175anthu \u0175anandi \u0175agwiriskirenge ntchito Intaneti.\\n-
  Mawaya gha mkuwa \u2013 Ma netiweki gha foni ghakwambilira (bandwidth yakucepa).\\n-
  Fiber optics (1980s-sono) \u2013 Kupangiska kuti data yitumizgike mwalu\u0175iro
  kwizira mu ma pulse gha ungweru.\\n- Kulutilira kwa waya \u2013 3G, 4G, na 5G vikusazgirako
  luwiro lwa data ya mafoni.\\n- Kudumbiskana kwa satellite \u2013 Kupharazga kwa
  pa charu chose kwa mazgu, TV, na Intaneti.\\n= Mazgu gha Ute\u0175eti mu Kuyowoyeskana
  = . Nthowa zakupharazgira pa foni zikuthemba pa fundo zakuzirwa zakukhwaskana na
  tekinoloje kuti zipharazge makora uthenga. Pansi apa pali fundo zikuru:\\nNthowa
  yakupharazgira pa foni yili na:\\n- Source \u2013 Kupanga data (mwachiyelezgero,
  mazgu gha munthu, kompyuta).\\n- Transmitter \u2013 Waku\u0175ika na kusintha chimanyikwiro
  kuti chitumizgike.\\n- Nthowa yakutumizga \u2013 Nthowa yakuwoneka panji yambura
  waya (mwachiyelezgero, fiber optics, ma wave gha pa wayilesi).\\n- Wakupokelera
  \u2013 Wakufumiska na kuwuskapo chimanyikwiro.\\n- Kufika \u2013 Wakupokelera waumaliro
  (mwachiyelezgero, foni, seva).\\n- Yikwimira data nga ni vimanyikwiro vyakulutilira
  (mwachiyelezgero, mafunde ya sine).\\n- \u0174akugwiliskira ntchito pa wayilesi/TV
  ya chikhalidwe na pa foni yakwambilira.\\n- Ku\u0175a wakusuzgika na phokoso na
  kunangika kwa chimanyikwiro pa mtunda.\\n- Ku\u0175ika data mu mawonekero gha binary
  ghakupatulika (0s na 1s).\\n- Uwemi wake:\\n- Kulimbana na phokoso lapachanya (kunozga
  kwakubudika nkhwamachitiko).\\n- Kusintha kwakukwana (mwachiyelezgero, TDM, kusintha
  kwa mapaketi).\\n- Kukhozgera kubisa na kufinya.\\n- Viyelezgero: Mapulogalamu gha
  pa Intaneti, TV ya digito, VoIP.\\nNthowa zikulongosora umo vimanyikwiro vikuthandazgikira:\\n-
  Nthowa zawaya\\n- Makhebo ghakupotoloka (mizere ya foni).\\n- Makhebo ghakukolerana
  (TV ya broadband).\\n- Fiber optics (data ya liwiro likuru).\\n- Nthowa zambura
  waya\\n- Mafupipafupi gha pa wayilesi (Wi-Fi, maselo).\\n- Ma maikolowevu (malinki
  gha pa satelayiti).\\n- Infrared (vipangizo vyakufupi).\\n- Vinthu vyakuzirwa: Bandwidth,
  kuchedwa, na chi\u0175elengero cha chimanyikwiro-ku-phokoso (SNR).\\nKusintha kwakusintha
  vimanyikwiro vyakunyamura kuti vi\u0175ikepo uthenga:\\n- Kusintha kwa Analog\\n-
  AM (Kusintha kwa Amplitude) \u2013 Kusintha kwa nkhongono ya chizindikiro.\\n- FM
  (Kusintha kwa pafupipafupi) \u2013 Kusintha kwa pafupipafupi.\\n- Kusintha kwa Digito\\n-
  ASK (Kusintha kwa Kusintha kwa Kiyi).\\n- FSK (Kusintha kwa pafupipafupi).\\n- PSK
  (Kusintha kwa Chiga\u0175a).\\n- QAM (Kusintha kwa Msinkhu wa Quadrature) \u2013
  Kuphatikizapo msinjiro / chiga\u0175a.\\n- Chilato: Kugwiliskira ntchito makora
  spectrum, kuchepeska phokoso, na kupanga vinthu vinandi.\\nMa netiweki ghakulumikizga
  vipangizo kuti \u0175asinthaniskenge data:\\n- LAN (Netiweki ya malo ghakukhalamo)
  \u2013 Pachoko (mwachiyelezgero, Wi-Fi ya ofesi).\\n- WAN (Netiweki ya Malo Ghakuru)
  \u2013 Yakukulu (mwachiyelezgero, Intaneti).\\n- Mapulogalamu \u2013 Malango ghakusinthaniska
  data (mwachiyelezgero, TCP/IP, HTTP).\\n- Nthowa zakusinthira \u2013\\n- Kusintha
  kwa dera (nthowa yakupatulika; mwachiyelezgero, foni ya chikhalidwe).\\n- Kusintha
  kwa mapaketi (data yikuga\u0175ika mu mapaketi; mwachiyelezgero, Intaneti).\\n-
  5G & Kupitilirapo - Kuchedwa kwakuchepa chomene, kuchitika kwapachanya kwa IoT /
  mtambo.\\nKupharazga pa foni kwasintha chuma, kuchezga na \u0175anthu, na kugwiliskira
  ntchito vyakupharazga pa charu chose. Pansi apa pali malo ghakuzirwa agho ghakukhwaska:\\n-
  Kuchita makora pa bizinesi:\\n- Kupangiska kuti \u0175anthu \u0175achitenge ntchito
  kutali, kuchepeska ndalama zakugwiriskira ntchito (mwachiyelezgero, kupanga makompyuta
  gha pa mtambo, VoIP).\\n- Kukura kwa malonda gha pa intaneti kwizira mu ndondomeko
  ya kulipira pa intaneti na kulongozgana kwa vyakupeleka.\\n- Nkharo ya \u0175akugula:\\n-
  Kuwonekera kwa mtengo (kuyezgelera kugula pa intaneti).\\n- Maute\u0175eti ghakukhumbikwa
  (mwachiyelezgero, kuga\u0175ana galimoto, mapulogalamu ghakupelekera vyakurya).\\n-
  Mpikisano wa Msika:\\n- Kuchepeska vipingo vyakunjilirapo vyakwamba (malonda gha
  pa intaneti, kufika pa charu chose).\\n- Kusokonezga mafakitale ghakale (mwachiyelezgero,
  kuse\u0175era na TV ya khebo).\\n- \\\"Kukura kwa GDP\\\":\\n- Ku\u0175ika ndalama
  mu vyakupangapanga vya mafoni kukupangiska kuti vinthu vi\u0175e makora (mwachiyelezgero,
  5G, fiber optics).\\n- Kupereka 4\u20136% ya GDP mu vyaru vyakutukuka (ITU data).\\n-
  Malonda gha pa charu chose:\\n- Kupangiska kuti \u0175anthu \u0175achitenge malonda
  ghakujumpha mphaka na umo \u0175akupelekera vinthu.\\n- Kupangiska kuti mafakitale
  ghakupeleka ntchito ku \u0175anyawo na ghakugwira ntchito kutali (mwachiyelezgero,
  wovwiri wa IT).\\n- Ntchito:\\n- Kupanga ntchito za tekinoloje yapachanya (\u0175anjiniya
  \u0175a pa intaneti, \u0175akupanga mapulogalamu gha kompyuta).\\n- Kuchepeska ntchito
  mu viga\u0175a ivyo vikugwira ntchito yayi (mwachiyelezgero, foni ya pa charu).\\n-
  Kulumikizana:\\n- Milatho yakuga\u0175ana ku mizi na mizinda (banki ya mafoni, telemedicine).\\n-
  Mapulatifomu gha social media ghakulongosoraso ubwezi na kuchitapo kanthu.\\n- Masambilo:\\n-
  Vipangizo vyakusambilira pa intaneti (MOOCs, vipinda vya masambiro vya pa intaneti).\\n-
  Kuga\u0175ikana kwa digito kukukhalilira chifukwa cha kufikapo kwambura kuyana.\\n-
  Kubisa & Chitetezo:\\n- Kukwera kwa nkha\u0175a pa kuswa kwa data na kuwonelera.\\n-
  Malango (e.g., GDPR) ghakuyezgayezga kuvikilira wanangwa wa awo \u0175akugwiliskira
  ntchito.\\n- Vyakusanguluska:\\n- Maute\u0175eti ghakuse\u0175era (Netflix, Spotify)
  ghakulamulira pa vyakupharazga vya chikhalidwe.\\n- Ivyo vikupangika na \u0175anthu
  (YouTube, TikTok) vikusintha umo \u0175anthu \u0175akupangira vinthu.\\n- Kuthandazga
  Nkhani:\\n- Kusintha kwa nyengo yeneco kwizira mu vithuzithuzi vya pa intaneti (X,
  Facebook).\\n- Masuzgo na uthenga uheni na kusankhana kwa algorithmic.\\n- Kuchita
  malonda:\\n- Malonda ghakulongozgeka mwakugwiliskira ntchito kusanda kwa data yikuru.\\n-
  Sinthani kufuma ku TV/kusindikizga ku malonda gha Google/Facebook.\\nMalango ghakukhwaskana
  na vyakuyowoyeskana ghakupangiska kuti \u0175anthu \u0175a\u0175e na mwa\u0175i
  wa kusanga vinthu mwaurunji, \u0175achitenge mpikisano, ndiposo kuti \u0175anthu
  \u0175avikilirike. Vinthu vinyake vyakuzirwa ni ivi:\\n- Mabungwe gha chalo:\\n-
  FCC (Komishoni ya Kupharazga ya Boma) \u2013 U.S. wakula\u0175ilira vya wayilesi,
  TV, na intaneti.\\n- Ofcom (UK) na ITU (Mgwirizano wa Kupharazga pa Mafoni pa Charu
  Chose) \u2013 Viga\u0175a vya pa charu chose.\\n- Ndondomeko:\\n- Net neutrality
  \u2013 Kukanizga \u0175a ISP kuti \u0175aleke kukanizga panji kukanizga ivyo vili
  mukati.\\n- Kuga\u0175ira kwa spectrum \u2013 Kula\u0175ilira ma frequency gha pa
  wayilesi kuti ghagwiriskike nchito pa foni/Wi-Fi.\\n- Malango gha vyakubisika:\\n-
  GDPR (EU) \u2013 Malango ghakukhozga ghakuvikilira data.\\n- CALEA (U.S.) \u2013
  Vinthu ivyo vikukhumbikwa kuti munthu wanjilirepo.\\nMa media gha mazu\u0175a ghano
  ghakuyowoyeskana ghakusazgapo hardware, ma network, na maute\u0175eti agho ghakupangiska
  kuti \u0175anthu \u0175alutilire kulumikizgana pa charu chose.\\n- Vyakuchitika
  vya pa msika mu 2023:\\n- Vipangizo vya mafoni: ~1.4 biliyoni mafoni ghakuguliskika
  chaka chilichose (Statista).\\n- Vinthu vyakupangika na 5G: $ 26B vyaku\u0175ika
  (2023).\\n- \u0174akuse\u0175era \u0175akuzirwa:\\n- Huawei, Ericsson, Nokia (vipangizo
  vya netiweki).\\n- Apulo, Samsung (vipangizo vyakuguliska).\\n- Kulamulira kwa mafoni:\\n-
  Kuchepa kwa mafoni gha pa charu; 6.9 biliyoni \u0175anthu \u0175akulembeska pa foni
  (ITU, 2023).\\n- VoIP (mwachiyelezgero, WhatsApp, Zoom) yikutimbanizga \u0175anyamura
  \u0175a chikhalidwe.\\n- 5G Kuga\u0175ira:\\n- 1.5 biliyoni 5G kulembeska kukulindilirika
  mu 2025 (Ericsson).\\n- Kusintha kwa Digito:\\n- TV ya analog yikafumiskikapo mu
  vyaru vinandi (mwachiyelezgero, U.S. 2009, EU 2012).\\n- DAB+ (Kupharazga kwa Mazgu
  gha Digito) kukunjira mu malo gha wayilesi ya FM.\\n- Mpikisano wakuse\u0175era:\\n-
  Ma podcast na Spotify vikususkana na wayilesi ya chikhalidwe.\\n- Ma TV gha vinjeru
  ghakusazgako Netflix, YouTube.\\n- Kufika pa charu chose:\\n- 5.3 biliyoni \u0175akugwiliskira
  ntchito (66% ya \u0175anthu \u0175a pa charu chose, 2023).\\n- Ma satelayiti gha
  Starlink na LEO ghakusazgirako mwa\u0175i wa ku mizi.\\n- Vya tekinoloje:\\n- Fiber-ku-Nyumba
  (FTTH) \u2013 50% ya broadband yakukhazikika mu vyaru vya OECD.\\n- Kuzomerezga
  IPv6 \u2013 Kuchepeska kutopa kwa adiresi.\\n- LAN (Netiweki ya Malo Ghakukhalamo):\\n-
  Kugwiliskira ntchito Ethernet/Wi-Fi (mwachiyelezgero, pa nyumba/mu ofesi).\\n- Likuchimbira
  mpaka 100 Gbps na fiber.\\n- WAN (Malo Ghakulu Netiweki ):\\n- Kulumikiza ma LAN
  mu misumba/vyaru (mwachiyelezgero, msana wa intaneti).\\n- Kuzomerezga kwa SD-WAN
  kukukwera chifukwa cha kukhozga mtambo.\\n- Goggin, Gerard, Global Mobile Media
  (New York: Routledge, 2011), p. 176. ISBN 978-0-415-46918-0.\\n- OECD, Universal
  Service and Rate Restructuring in Telecommunications, Organisation for Economic
  Co-operation and Development (OECD) Publishing, 1991. ISBN 92-64-13497-2.\\n- Wheen,
  Andrew. Dot-Dash to Dot.Com: How Modern Telecommunications Evolved from the Telegraph
  to the Internet (Springer, 2011).\\n- International Teletraffic Congress\\n- International
  Telecommunication Union (ITU)\\n- ATIS Telecom Glossary\\n- Federal Communications
  Commission\\n- IEEE Communications Society\\n- International Telecommunication Union\\n-
  Ericsson''s Understanding Telecommunications at the Wayback Machine (archived 13
  Epulelo 2004) (Ericsson removed the book from their site in September 2005)\"",
  "\"\u201c[Yehova] wakamuchemani kufuma mu chisi kwiza ku ungweru wake wakuzizwiska.\u201d\u20141
  PET. 2:9.\\nSUMU: 116, 102\\n1. Longosorani ivyo vikachitika apo Yerusalemu wakabwangandulikanga.\\nMU
  607 B.C.E., themba la Babuloni, Nebukadinezara Wachi\u0175iri, likatuma \u0175asilikari
  \u0175ake kuti \u0175awukire msumba wa Yerusalemu. Baibolo likuyowoya kuti \u0175anthu
  \u0175anandi \u0175akakomeka. Likuti: \u201cThemba [Nebukadinezara] likakoma \u0175anyamata
  \u0175awo na lupanga mu nyumba yawo yakupatulika. Waka\u0175achitira chiwuravi chara,
  kwali ni munyamata kwali mwali, muchekuru panji wakukokonyara. . . . Wakawotcha
  nyumba ya Chiuta waunenesko, wakabwangandura linga la Yerusalemu, wakawotcha na
  moto vigongwe vyake vyakukhora, wakaparanya chilichose cha mtengo wapatali.\u201d\u20142
  Mid. 36:17, 19.\\n2. Kasi Yehova wakati ntchivichi icho chizamuchitikira msumba
  wa Yerusalemu kweniso \u0174ayuda?\\n2 \u0174anthu awo \u0175akakhalanga mu Yerusalemu
  \u0175akeneranga kuzizwa yayi na kubwangandulika kwa msumba uwu. Chifukwa wuli?
  Chifukwa chakuti kwa vyaka vinandi pambere msumba uwu undaparanyike, ntchimi za
  Yehova zikachenjezga kale \u0174ayuda kuti para \u0175akulutilira kuswa Dango la
  Yehova, \u0175azamupelekeka mu mawoko gha \u0174ababuloni. \u0174ayuda \u0175anandi
  \u0175akeneranga kufwa na lupanga, ndipo awo \u0175apona \u0175akeneranga kutolekera
  ku Babuloni na kuka\u0175a \u0175azga umoyo wawo wose. (Yer. 15:2) Kasi umoyo uka\u0175a
  wuli ku wuzga? Kasi ivyo vikachitikira \u0175anthu ku wuzga ku Babuloni, vikachitikiraso
  \u0174akhristu? Usange ni nthena, pauli?\\nUMO \u0174AYUDA \u0174AKAKHALIRANGA KU
  WUZGA\\n3. Kasi wuzga wa ku Babuloni ukapambana wuli na wa ku Eguputo?\\n3 Ivyo
  ntchimi za Yehova zikayowoya vikavifiskika nadi. Yehova wakaphalira Yeremiya kuti
  walembe ivyo \u0174ayuda \u0175akeneranga kukachita para \u0175atolekera ku wuzga
  ku Babuloni. Yehova wakati: \u201cZengani nyumba [mu Babuloni] na kukhalamo. Pandani
  minda na kurya vipambi vyake. Kweniso muwukhumbire mtende msumba uwo namutoleraniko,
  muwulombere kwa Yehova, chifukwa para uli pa mtende, namwe mu\u0175enge na mtende.\u201d
  (Yer. 29:5, 7) \u0174ayuda awo \u0175akapulikira mazgu gha Chiuta, \u0175akakhalanga
  mwamtende ku Babuloni. \u0174ababuloni \u0175akapeleka wanangwa ku \u0174ayuda wakuchita
  vinthu vinyake ivyo \u0175akukhumba. \u0174ayuda \u0175aka\u0175a na wanangwa wakwenda
  mwakufwatuka mu ufumu wose wa Babuloni. Msumba wa Babuloni uka\u0175a chinyina cha
  malonda mu nyengo yakale. Mipukutu yinyake iyo yasangika mwasonosono yikulongora
  kuti \u0174ayuda \u0175anandi \u0175akasambira umo \u0175angachitira bizinesi ndipo
  \u0175anyake \u0175akasambira luso la vyakupangapanga. Nakuti \u0174ayuda \u0175anyake
  \u0175akasambazga. Ntheura wuzga wa ku Babuloni ukapambana chomene na wuzga uwo
  \u0174aisrayeli \u0175aka\u0175amo ku Eguputo.\u2014\u0174erengani Ekisodo 2:23-25.\\n4.
  Padera pa uchigaluka, kasi ni vichi vinyake ivyo vikapangiska \u0174ayuda kuleka
  kusopa Yehova?\\n4 \u0174ayuda \u0175aka\u0175a na vinthu vinandi vyakuthupi apo
  \u0175aka\u0175a ku wuzga. Kweni wuli pakuyowoya za umoyo wawo wauzimu? Tempile
  na jotchero la Yehova vika\u0175a kuti vyabwangandulika, kweniso \u0175asembe \u0175akachitanga
  makora yayi milimo yawo. \u0174ayuda \u0175anandi \u0175akatolekera ku wuzga chifukwa
  cha uchigaluka ndipo \u0175akeneranga nadi kulangika. Kweni \u0174ayuda \u0175anyake
  awo \u0175akatolekera ku wuzga na kusuzgika pamoza na \u0175anyawo, \u0175aka\u0175a
  \u0175akugomezgeka kwa Chiuta ndipo \u0175akeneranga kulangika yayi. Iwo \u0175akalutilira
  kupulikira Dango la Chiuta nanga ni apo \u0175aka\u0175a ku wuzga. Mwachiyelezgero,
  Daniyeli pamoza na \u0175anyake \u0175atatu, Shadireki, Misheki na Abedinego, \u0175akakana
  kurya vyakurya ivyo \u0174ayuda \u0175akakanizgika kurya. Kweniso Daniyeli wakalombanga
  kwa Chiuta nyengo zose. (Dan. 1:8; 6:10) Ndipouli, chika\u0175a chipusu yayi ku
  \u0174ayuda awo \u0175akawopanga Chiuta kuchita vyose ivyo Dango la Chiuta likayowoyanga
  chifukwa \u0175akazingilizgika na \u0175anthu \u0175akusopa vikozgo.\\n5. Kasi Yehova
  wakalayizga vichi \u0175anthu \u0175ake, ndipo ntchivichi icho chikachitika?\\n5
  Kasi \u0174aisrayeli \u0175akaghanaghananga kuti \u0175angazaka\u0175aso na mwa\u0175i
  wakusopa Yehova mwakufwatuka kweniso mwakuzomerezgeka? Kuyana na umo vinthu vika\u0175ira
  ku wuzga, \u0175akwenera kuti \u0175akakayikiranga chifukwa \u0174ababuloni \u0175akafwaturanga
  yayi \u0175azga \u0175awo. Kweni dango ili likamutondeska yayi Yehova kufiska ivyo
  wakalayizga \u0174ayuda. Iyo waka\u0175alayizga kale kuti wazamuwombora \u0175anthu
  \u0175ake ndipo waka\u0175awombora nadi. Uwu mbukaboni wakuti Yehova wakufiska vyose
  ivyo walayizga.\u2014Yes. 55:11.\\nMAZU\u0174A GHANO KE?\\n6, 7. Chifukwa wuli ntchiwemi
  kusandaso nyengo iyo \u0174akhristu \u0175aunenesko \u0175akanjilira mu wuzga wa
  Babuloni Mukuru?\\n6 Kasi yika\u0175apo nyengo yinyake apo \u0174akhristu \u0175aunenesko
  nawo \u0175aka\u0175a mu wuzga nga umo vika\u0175ira na \u0174ayuda ku Babuloni?
  Kwa vyaka vinandi, magazini ya Gongwe la Mulinda yalongosoranga kuti \u0174akhristu
  \u0175aunenesko \u0175a mazu\u0175a ghano \u0175akanjira mu wuzga wa Babuloni mu
  1918 na kufumamo mu 1919. Kweni kuyana na ivyo tidumbiskanenge mu nkhani iyi na
  yakulondezgapo, gulu la Yehova lawona kuti ntchiwemi kusandaso fundo iyi.\\n7 Ghanaghanirani
  fundo iyi: Babuloni Mukuru wakwimira visopa vyose vyautesi pa charu chapasi. Ntheura,
  para tingati \u0175ate\u0175eti \u0175a Yehova \u0175akanjira mu wuzga mu 1918,
  ndikuti munthowa yinyake \u0175ate\u0175eti a\u0175a \u0175aka\u0175a mu wuzga wa
  chisopa chautesi mu chaka ichi. Kweni maukaboni ghakulongora kuti \u0174akhristu
  \u0175akuphakazgika \u0175akamba kufwatuka ku wuzga wa Babuloni Mukuru pambere Nkhondo
  Yakwamba ya pa Charu Chose yindambe. Ntheura \u0174akhristu a\u0175a \u0175akanjira
  mu wuzga mu chaka ichi yayi. Nangauli \u0174akhristu \u0175akuphakazgika \u0175akasuzgikanga
  mu nyengo ya nkhondo yakwamba ya pa charu chose, kweni Babuloni Mukuru ndiyo wakapangiskanga
  masuzgo agha yayi. M\u2019malo mwake, \u0175aka\u0175a \u0175andyali awo \u0175akapangiskanga
  masuzgo agha. Ntheura vikuwonekerathu kuti \u0175anthu \u0175a Yehova \u0175akanjira
  mu wuzga wa Babuloni Mukuru mu 1918 yayi.\\nKASI \u0174AKANJIRA PAULI?\\n8. Longosorani
  umo Chikhristu chaunenesko chikatimbanizgikira. (Wonani chithuzi chakwamba.)\\n8
  Pa Pentekoste 33 C.E., \u0174ayuda \u0175anandi kweniso \u0175amitundu \u0175akaphakazgika
  na mzimu utu\u0175a. \u0174akhristu \u0175aphya a\u0175a \u0175akapanga \u201cmtundu
  wakusoleka, \u0175asembe na mafumu, mtundu utu\u0175a, \u0175anthu awo \u0175akwenera
  ku\u0175a \u0175apadera.\u201d (\u0174erengani 1 Petrosi 2:9, 10.) Pa nyengo iyo
  \u0175apositole \u0175aka\u0175a \u0175amoyo, \u0175akavikiliranga chomene \u0175anthu
  \u0175a Chiuta kuti \u0175aleke kutolera visambizgo vyautesi. Kweni, \u0175apositole
  \u0175akati \u0175afwa, pakawuka \u0175analume \u0175anyake awo \u0175akamba \u201ckuyowoya
  vinthu vyakubendera kuti \u0175aguzire \u0175asambiri kwa iwo.\u201d (Mil. 20:30;
  2 Tes. 2:6-8) \u0174anandi mwa \u0175analume a\u0175a \u0175aka\u0175a na maudindo
  mu mipingo ndipo \u0175akate\u0175eteranga nga mbalara, ndipo pamanyuma \u0175akamba
  kuchemeka kuti \u201cmabishopu.\u201d Ntheura pakapangika gulu la \u0175aliska awo
  \u0175akachemekanga na mazina ghapadera nangauli Yesu wakaphalira \u0175alondezgi
  \u0175ake kuti: \u201cMose muli \u0175abali.\u201d (Mat. 23:8) \u0174aliska a\u0175a
  \u0175akasambizganga vinjeru vya \u0175anthu nga ni vya Aristotle na Plato, ndipo
  pachoko na pachoko visambizgo ivi ndivyo vikanjira mu malo mwa visambizgo vyaunenesko
  vya mu Mazgu gha Chiuta.\\n9. Kasi Boma la Roma likachita nawo wuli \u0175akugaluka
  awo \u0175akajichemanga \u0174akhristu, ndipo chikachitika ntchivichi?\\n9 Mu 313
  C.E., Constantine, themba la ufumu wa \u0174aroma ilo likasopanga vikozgo likapeleka
  mazaza ku \u0175asopi \u0175autesi awo \u0175akajichemanga kuti Mbakhristu \u0175aunenesko.
  Kufuma waka panyengo iyi, Tchalitchi na Boma [\u0175andyali] \u0175ali paubwezi
  wakandapo nane nikandepo. Mwachiyelezgero, pamanyuma pa ungano uwo ukachitikira
  ku Nicaea, Constantine wakagamura kuti wasembe munyake zina lake Arius wanjire mu
  jele chifukwa cha kukana kuzomerezga kuti Yesu ni Chiuta. Pamasinda, Themba Theodosius
  Wakwamba uyo wakawusa kwamba mu 379 m\u2019paka mu 395 C.E., wakazomerezga Tchalitchi
  cha Katolika ku\u0175a tchalitchi lakumanyikwa chomene mu ufumu wose wa \u0174aroma
  nangauli mamembara ghake ghakachitanga vinthu vyaunyankhasi. \u0174anthu awo \u0175akusanda
  vya mbiri yakale \u0175akuti \u0175anthu \u0175a mu msumba wa Romu awo \u0175akasopanga
  vikozgo \u0175akamba kujichema \u0174akhristu mu vyaka vya m\u2019ma 300 C.E. Kweni
  unenesko ngwakuti \u0174akhristu \u0175atesi \u0175akakolerana na magulu gha \u0175anthu
  awo \u0175akasopanga \u0175angoza mu ufumu wa Roma na kupanga Babuloni Mukuru. Nangauli
  vika\u0175a nthena, kweni paka\u0175aso gulu lichoko la \u0174akhristu \u0175akuphakazgika
  ilo lika\u0175a nga ni \u201ctirigu\u201d ilo likasopanga Chiuta mwaunenesko. Pa
  nyengo iyi, mbanthu \u0175achoko chomene awo \u0175akategherezganga ivyo \u0174akhristu
  \u0175akuphakazgika a\u0175a \u0175akasambizganga. (\u0174erengani Mateyu 13:24,
  25, 37-39.) Ntheura \u0174akhristu \u0175aunenesko a\u0175a \u0175aka\u0175a nadi
  mu wuzga wa Babuloni Mukuru.\\n10. Kasi ntchivichi icho chikawovwira \u0175anthu
  \u0175a mitima yiwemi kukana visambizgo vyautesi?\\n10 Nangauli upusikizgi ukazara
  chomene, kweni \u0175anthu \u0175anandi \u0175aka\u0175azganga Baibolo mu Chigiriki
  na Chilatini. Ntheura \u0175aka\u0175a na mwa\u0175i wakupambaniska pakati pa visambizgo
  vya mu Baibolo na visambizgo vyautesi vya tchalitchi. Ivi vikapangiska kuti \u0175anyake
  \u0175ambe kukana visambizgo vyautesi chifukwa cha kumanya unenesko wa mu Baibolo.
  Kweni chika\u0175a chakofya kuvumbura pakweru ivyo munthu wasambira mu Baibolo ndipo
  \u0175anyake \u0175akakomekerangapo.\\n11. Kasi \u0175alongozgi \u0175a visopa \u0175akachita
  vichi kuti \u0175anthu \u0175anandi \u0175a\u0175avye mwa\u0175i waku\u0175erenga
  Baibolo?\\n11 Pakati pajumpha nyengo, \u0175alongozgi \u0175a matchalitchi \u0175akakanizga
  ntchito yakung\u2019anamura Baibolo kuya mu viyowoyero ivyo \u0175anthu \u0175anandi
  \u0175akayowoyanga. Ivi vikapangiska kuti \u0175alongozgi \u0175a tchalitchi na
  \u0175anthu \u0175anyake \u0175akusambira ndiwo \u0175a\u0175e na mwa\u0175i waku\u0175erenga
  Baibolo. Nangauli vika\u0175a nthena, mbalongozgi wose yayi awo \u0175aka\u0175erenganga
  na kulemba makora. Waliyose uyo wakasuskanga ivyo \u0175alongozgi a\u0175a \u0175akasambizganga,
  wakalangikanga kwazanimuwone. Lekani \u0174akhristu \u0175akuphakazgika \u0175akachitanga
  vinthu mwakuchenjera chomene para \u0175akukhumba kuwungana kuti \u0175asambire
  Mazgu gha Chiuta. Nga umo vika\u0175ira na \u0174ayuda awo \u0175akatolekera ku
  wuzga ku Babuloni, \u0174akhristu \u0175akuphakazgika awo \u0175aka\u0175a nga \u2018mbasembe
  na mafumu,\u2019 nawo \u0175akatondekanga kusopa Yehova mwakufwatuka. Pa nyengo
  iyi, \u0174akhristu \u0175akuphakazgika \u0175aka\u0175a nadi mu wuzga wa Babuloni
  Mukuru.\\nUNGWERU UKAMBA KU\u0174ALA\\n12, 13. Kasi ni vinthu wuli vi\u0175iri ivyo
  vikamba kufwatura \u0175anthu \u0175a Chiuta ku wuzga wa Babuloni Mukuru? Longosorani.\\n12
  Kasi \u0174akhristu \u0175aunenesko nawo \u0175akamanyanga kuti zu\u0175a linyake
  \u0175azamusopa Yehova mwakufwatuka kweniso mwakuzomerezgeka? Enya! M\u2019ma 1450
  C.E., ungweru wauzimu ukamba ku\u0175ala pachoko na pachoko. Pali vinthu vi\u0175iri
  ivyo vikawovwira chomene ku\u0175aliska ungweru wauzimu. Chakwamba, pakapangika
  matayipilayitala agho ghaka\u0175a ghapusu kwenda nagho. Pambere matayipilayitala
  ghandambe kupangika, \u0175anthu \u0175akachitanga kukopera Baibolo pa mawoko ndipo
  yika\u0175a ntchito yakuvuska chomene. Lekani Baibolo likasangikanga bweka yayi
  kweniso likaduranga chomene. \u0174anyake \u0175akuti vikatoranga myezi 10 kuti
  munthu uyo wakumanya makora chomene kukopera wamare kukopera Baibolo. Kweniso, vikumba
  ivyo \u0175akalembangapo vika\u0175a vyakudura. Kweni munthu uyo wakamanyanga makora
  tayipilayitala, wakakoperanga mwalu\u0175iro chomene chifukwa wakalembanga mapeji
  1,300 pa zu\u0175a.\\n13 Chinthu chachi\u0175iri icho chikawovwira paku\u0175aliska
  ungweru wauzimu m\u2019ma 1500-1600 C.E., chika\u0175a kung\u2019anamura Baibolo
  kuya mu viyowoyero ivyo \u0175anthu \u0175anandi \u0175akayowoyanga. \u0174anandi
  mwa \u0175anthu awo \u0175akang\u2019anamuranga Baibolo \u0175aka\u0175ikanga umoyo
  wawo pa ngozi chifukwa \u0175alongozgi \u0175a chisopa \u0175akakhumbanga yayi.
  Para Mkhristu waunenesko wasangika kuti wanyamura Baibolo, waka\u0175anga nga kuti
  wanyamura chilwero chakofya chomene icho \u0175alongozgi \u0175a chisopa \u0175akakhumbanga
  yayi kuchiwona. Kweni Baibolo likati lamba kusangika bweka, \u0175anthu \u0175anandi
  \u0175akamba ku\u0175erenga. Apo \u0175aka\u0175erenganga Baibolo, \u0175anyake
  \u0175akamba kufumba mafumbo nga ghakuti: Kasi ni mpha mu Baibolo apo pakuyowoya
  vya puligatoliyo? Kasi ni mpha apo Baibolo likuti tilipirenge \u0175aliska para
  \u0175alombera \u0175abali \u0175ithu awo \u0175ali kufwa, kweniso kuti tilipirenge
  \u0175apapa na \u0175alongozgi \u0175anyake \u0175alara\u0175alara? Ntheura \u0175alongozgi
  \u0175a chisopa \u0175akawonanga kuti uwu ni muyuyuro kweniso uchigaluka ukuru chomene
  para munthu wakufumba mafumbo ghanthena. Nakuti chika\u0175a chakofya chomene kufumba
  mafumbo \u0175alongozgi \u0175a chisopa. \u0174alongozgi \u0175a chisopa \u0175akalanganga
  waliyose uyo wakalongoranga kuti waku\u0175agalukira. \u0174anandi awo \u0175akakananga
  kulondezga visambizgo vya chisopa chautesi \u0175akatenge mbakugaluka. Visambizgo
  vinyake vya \u0175anthu ivyo \u0175alongozgi \u0175a chisopa \u0175akasambizganga
  vika\u0175a vya Aristotle na Plato. \u0174analume a\u0175a \u0175aka\u0175ako pambere
  Yesu wandababike. \u0174alongozgi \u0175a chisopa \u0175aka\u0175a na mazaza ghakuphalira
  Boma kuti likome \u0175anthu wose awo \u0175akatenge mbakugaluka. Chilato chawo
  chika\u0175a chakuti \u0175awofye \u0175anthu kuti \u0175aleke ku\u0175erenga Baibolo
  na kufumba mafumbo ghanandinandi. Kanandi chilato chawo chikafiskikanga. Kweni \u0175anyake
  \u0175aka\u0175a na chikanga ndipo \u0175akakana kofyeka na Babuloni Mukuru. Chifukwa
  chakuti \u0175akamba kumanya unenesko wa mu Baibolo, iwo \u0175akakhumbanga kuti
  \u0175asambire vinandi. Ntheura umu ndimo vikambira kuti \u0174akhristu \u0175aunenesko
  \u0175ambe kufwatuka ku wuzga wa chisopa chautesi, icho ni Babuloni Mukuru.\\n14.
  (a) Kasi \u0175anyake \u0175akachita wuli kuti \u0175a\u0175e na mwa\u0175i wakusambira
  na kupulikiska makora Baibolo? (b) Longosorani ivyo Mubali Russell wakachita kuti
  wasambire unenesko.\\n14 \u0174anthu \u0175anandi awo \u0175aka\u0175a na nyota
  yakumanya unenesko wa mu Baibolo \u0175akachimbilira ku vyaru vinyake uko \u0175alongozgi
  \u0175a chisopa \u0175aka\u0175asuzganga vi\u0175i yayi. Iwo \u0175akakhumbanga
  kuti \u0175a\u0175e na wanangwa waku\u0175erenga, kusambira, na kudumbiskana Baibolo.
  Chimoza mwa vyaru ivi chika\u0175a charu cha United States. Mu charu ichi ndimo
  Mubali Charles Taze Russell na \u0175anyake \u0175akambira kusanda Baibolo mwakupwelelera
  chakuumaliro wa 1800 C.E. Pakwamba, Mubali Russell wakakhumbanga kuti wamanye chisopa
  icho chikusambizga unenesko wa mu Baibolo. Wakayaniska ivyo Baibolo likusambizga
  na ivyo matchalitchi ghanandi ghakasambizganga. Pakati pajumpha nyengo yichoko waka,
  wakasanga kuti palijirethu chisopa chilichose icho chikulondezga ndendende ivyo
  Mazgu gha Chiuta ghakusambizga. Nyengo yinyake Mubali Russell wakakumana na \u0175alongozgi
  \u0175a visopa, ndipo waka\u0175a na chigomezgo kuti \u0175alongozgi a\u0175a \u0175azomerenge
  fundo zaunenesko za mu Baibolo izo iyo na \u0175asambiri \u0175anyake \u0175akasanga
  mu Baibolo. Kweniso Mubali Russell wakagomezganga kuti para \u0175alongozgi a\u0175a
  \u0175amanya fundo izi, \u0175amusambizga \u0175anthu mu matchalitchi ghawo. Kweni
  ivi vikakwiyiska waka \u0175alongozgi a\u0175a. \u0174asambiri \u0175a Baibolo \u0175akeneranga
  kumanya fundo yakuti: \u0174akhristu \u0175aunenesko \u0175akwenera yayi kukolerana
  na wose awo \u0175akudemelera ku chisopa chautesi.\u2014\u0174erengani 2 \u0174akorinte
  6:14.\\n15. (a) Kasi \u0174akhristu \u0175aunenesko \u0175akanjira pauli mu wuzga
  wa Babuloni Mukuru? (b) Kasi nkhani yakulondezgapo yizamuzgora mafumbo wuli?\\n15
  Mu nkhani iyi, tawona kuti \u0174akhristu \u0175aunenesko \u0175akanjira mu wuzga
  wa Babuloni Mukuru pamanyuma pakuti \u0175apositole wose \u0175afwa waka. Kweni
  pali mafumbo ghanandi agho tikwenera kusanga mazgoro ghake. Kasi pali ukaboni wuli
  unyake uwo ukulongora kuti \u0174akhristu \u0175akuphakazgika \u0175aka\u0175a kuti
  \u0175ambapo kale kufwatuka ku wuzga wa Babuloni Mukuru pambere chaka cha 1914 chindafike?
  Kasi mbunenesko kuti Yehova wakakwiyira \u0175ate\u0175eti \u0175ake chifukwa chakuti
  \u0175akapharazganga chomene yayi pa Nkhondo Yakwamba ya pa Charu Chose? Kasi \u0175abali
  na \u0175adumbu \u0175anyake pa nyengo iyi \u0175akathera na kunjira ndyali mwakuti
  Yehova wakaleka kukondwa nawo? Usange \u0174akhristu \u0175akanjira mu wuzga wa
  chisopa chautesi kwambira m\u2019ma 100 C.E., ipo mphawuli apo \u0175akafwatukira?
  Agha ni mafumbo ghakuzirwa chomene, ndipo ghakuzgoreka mu nkhani yakulondezgapo.\"",
  "\"Sumu 35 na Lurombo\\nMazgu Ghakwamba (Mamin. 3 panji kuchepera apa)\\nMAZGU GHA
  CHIUTA MBUSAMBAZI\\n\u201cYehova Wakukondwa na Munthu uyo Walapa Zanadi\u201d: (Mamin.
  10)\\n2 Mid. 33:2-9, 12-16\u2014Yehova wakamulongora lusungu Manase chifukwa wakalapa
  zanadi (w06 1/1 peji 17 ndime 6)\\n2 Mid. 34:18, 30, 33\u2014Para tiku\u0175azga
  Mazgu gha Chiuta na kughanaghanirapo, ghangatifika pamtima (w06 1/1 peji 17 ndime
  11)\\n2 Mid. 36:15-17\u2014Yehova wali na mphaka pa kulongora lusungu na kuzikira
  (w06 1/1 peji 17 ndime 8)\\nIvyo Tasambira: (Mamin. 8)\\n2 Mid. 33:11\u2014Kasi
  ni uchimi wuli uwo ukafiskika Manase wati watolekera ku Babuloni? (it-1-E peji 62
  ndime 2)\\n2 Mid. 34:1-3\u2014Kasi tikukhozgeka wuli na ivyo Yosiya wakachita? (w06
  1/1 peji 17 ndime 7)\\nKasi ivyo na\u0175azga mu Baibolo sabata iyi, vikunisambizgachi
  za Yehova?\\nKasi nasambira fundo wuli mu Baibolo sabata iyi izo ningakaphalirako
  \u0175anthu mu upharazgi?\\nKu\u0175erenga Baibolo: 2 Mid. 34:22-33 (Mamin. 4 panji
  kuchepera apa)\\nPHARAZGANI MWALUSO\\nPaulendo wakwamba: (Mamin. 2 panji kuchepera
  apa) Chiyelezgero. Ga\u0175irani magazini gha Gongwe la Mulinda. Pakuga\u0175ira,
  mudumbiskane mutu wa pa chikopi. Mufumbani fumbo lakuti muzakazgore para mwizaso.\\nUlendo
  Wakuwelerako: (Mamin. 4 panji kuchepera apa) Chiyelezgero. Weleraniko kwa munthu
  uyo mukamuga\u0175ira Gongwe la Mulinda. Mufumbani fumbo lakuti muzakazgore para
  mwizaso.\\nSambiro la Baibolo: (Mamin. 6 panji kuchepera apa) Yezgelerani umo mungasambilira
  Baibolo na munthu. (bh peji 9 m\u2019paka 10, ndime 6 na 7)\\nUMOYO WACHIKHRISTU\\nSumu
  77\\nKulapa Nkhwakuzirwa: (Mamin. 10) Nkhani. Yiyowoyeke na mulara. (w06 12/1 peji
  14 na 15, ndime 7 m\u2019paka 9)\\nUgowokerenge \u0174anyako. (Mamin. 5) Kudumbiskana.
  Wonelerani vidiyo ya mutu wakuti Ugowokerenge \u0174anyako. (Kuti musange vidiyo
  iyi, lutani pa jw.org/tum, ndipo wonani pa IVYO BAIBOLO LIKUSAMBIZGA > \u0174ANA.)
  Para mwamara kuwonelera, fumbani \u0175ana kuti \u0175ayowoye ivyo \u0175asambirapo.\\nSambiro
  la Baibolo la Mpingo: cl mutu 24 ndime 11-17 (Mamin. 30)\\nWeleranimo Ivyo Mwasambira
  na Kuyowoyapo Mwakudumura Ivyo Muzamusambira Sabata Yikwiza (Mamin. 3)\\nSumu 6
  na Lurombo\"", "\"Kasi \u0175anthu ndiwo \u0175akambiska vyakuti tisopenge?\\n\u0174ANTHU
  \u0174ANYAKE \u0174AKUGOMEZGA kuti \u0175anthu ndiwo \u0175akambiska vyakuti tisopenge.
  \u0174anyake \u0175akughanaghana kuti Chiuta wakugwiliskira ntchito chisopa kuti
  waguzire \u0175anthu kwa iyo. Kasi imwe mukuti wuli?\\nIVYO BAIBOLO LIKUYOWOYA\\nPali
  \u201ckusopa kwakutowa na kwambura kufipiskika panthazi pa Chiuta, Dada withu.\u201d
  (Yakobe 1:27) Chiuta ndiyo wakambiska kusopa kutu\u0175a panji kwaunenesko.\\nNI
  VICHI VINYAKE IVYO TIKUSAMBIRA MU BAIBOLO?\\nChisopa chikwenera kulondezga fundo
  za mu Baibolo kuti Chiuta wakondwe nacho.\u2014Yohane 4:23, 24.\\nVisopa ivyo vikwendera
  fundo za \u0175anthu ni vyawaka.\u2014Mariko 7:7, 8.\\nKasi ntchakukhumbikwa nadi
  kuti munthu wa\u0175e mu chisopa?\\nKASI MUNGATI WULI?\\nEnya\\nYayi\\nKwali\\nIVYO
  BAIBOLO LIKUYOWOYA\\n\u201cTiyeni tighanaghaniranenge na kuchiskana kuti titemwanenge
  na kuchita milimo yiwemi. Tingalekanga yayi kuwungana pamoza.\u201d (\u0174ahebere
  10:24, 25) Chiuta wakukhumba kuti \u0175anthu awo \u0175akumusopa \u0175awunganenge
  pamoza.\\nNI VICHI VINYAKE IVYO TIKUSAMBIRA MU BAIBOLO?\\nAwo \u0175akusopa Chiuta
  pamoza \u0175akwenera kugomezga vinthu vimoza.\u20141 \u0174akorinte 1:10, 11.\\n\u0174anthu
  awo \u0175ali mu chisopa icho Chiuta wakukondwa nacho \u0175aku\u0175a mu ubali
  wa pa charu chose.\u20141 Petrosi 2:17.\"", "\"Homo rhodesiensis ni zina ilo Arthur
  Smith Woodward (1921) wakalemba kuti Kabwe 1 (the \\\"Kabwe skull\\\" or \\\"Broken
  Hill skull\\\", also \\\"Rhodesian Man\\\"), ni fosili ya mu Middle Stone Age iyo
  yikasangika ku Broken Hill mine ku Kabwe, Northern Rhodesia (sono ni Zambia).[1]Mu
  2020, \u0175akawona kuti chiwangwa ichi chili na vyaka vyapakati pa 324,000 na 274,000.
  Paliso vinyama vinyake vyakale vyakuyana waka..[2]\\nHomo rhodesiensis s.s. appears
  to have diverged earlier than H. heidelbergensis s.s. (Mauer). H. rhodesiensis s.l.
  is now mostly considered a synonym of H. heidelbergensis s.l[3], or perhaps then
  slightly larger. Other designations such as Homo sapiens arcaicus[4] and Homo sapiens
  rhodesiensis[5] have also been proposed.\\nVinthu vyakusangika[lemba | kulemba source]\\nMu
  vyaka vya m''ma 1900, ku East Africa (Bodo, Ndutu, Eyasi, Ileret) na North Africa
  (Sal\u00e9, Rabat, Dar-es-Soltane, Djbel Irhoud, Sidi Aberrahaman, Tighenif) \u0175akasanga
  viswaswa vinandi ivyo vikuyana waka.[6]\\n- Kabwe 1, uyo wakuchemekaso kuti chiwangwa
  cha Broken Hill, panji \\\"Munthu wa ku Rhodesia\\\", wakimikika na Arthur Smith
  Woodward mu 1921 nga ni mtundu wa Homo rhodesiensis. \u0174asayansi \u0175anandi
  mazu\u0175a ghano \u0175akuleka kuzunura \\\"rhodesiensis\\\" na kumupa Homo heidelbergensis.[7]
  Chi\u0175aro ichi chikasangika mu mgodi wa Broken Hill mu chiga\u0175a cha Mutwe
  Wa Nsofu ku Northern Rhodesia (sono ni Kabwe, Zambia) pa Juni 17, 1921 na \u0175anthu
  \u0175a\u0175iri awo \u0175akagwiranga ntchito mu migodi. Padera pa chiwangwa, \u0175akasangaso
  chiwangwa cha munthu munyake, chiwangwa, chiwangwa cha msana, na viwangwa vi\u0175iri
  vya chigha.\\n- Chisko cha munthu wa ku Bodo: Chinthu ichi chika\u0175ako vyaka
  600,000 ivyo vyajumpha, ndipo \u0175anthu awo \u0175akalongozgekanga na Jon Kalb
  \u0175akachisanga mu 1976. Nangauli chiwangwa ichi chikayananga chomene na cha Kabwe,
  kweni Woodward wakaleka kugwiliskira ntchito mazina agha ndipo awo \u0175akaghasanga
  \u0175akaghanaghana kuti ni cha H. heidelbergensis. Vinthu ivi vikulongora kuti
  paka\u0175a kusintha pakati pa Homo ergaster na Homo sapiens.[8]\\n- Chisko cha
  ndutu, \\\"munthu wa ku nyanja ya Ndutu\\\" kumpoto kwa Tanzania, vyaka vyapakati
  pa 600,000 na 500,000 panji 400,000. Mu 1976 R. J. Wakayama Clarke wakalilemba kuti
  Homo erectus ndipo \u0175anthu \u0175akughanaghana kuti ndimo liliri, nangauli likuyana
  na Homo sapiens. Phillip Rightmire wakawona kuti ntchakwenelera kupima kuti H. sapiens
  ntchisomba cha ku Africa. Kuyana na umo mutu uliri, ni mamita 1,100. Nkhongono ya
  chi\u0175aro ichi na umo vikuwonekera, vikovwira kuti chi\u0175aro ichi chiwonekenge
  nga ntcha munthu. Ndipo mu buku linyake ilo likalembeka mu 1989, Clarke wakati:
  \\\"\u0174anthu awo \u0175akukhala mu nyengo yakale \u0175akuchemeka Homo sapiens
  cifukwa ca umo wongo wawo uliri\\\". Kweni Stinger (1986) wakayowoya kuti munthu
  uyo wali na chiwangwa ichi waku\u0175a na chiwangwa chakukhoma. Mu 2016, Chris Stringer
  wakalemba kuti chiwangwa ichi chika\u0175a cha Homo heidelbergensis/Homo rhodesiensis
  (chimanyikwiro icho chiku\u0175a pakati pa Homo erectus na Homo sapiens) m''malo
  mwa kwamba kwa H. sapiens, kweni wakuwona kuti chika\u0175a na \\\"viwangwa vyakuyana
  waka na vya Homo sapiens\\\" kuluska viwangwa vinyake vya Homo rhodesiensis. Chi\u0175aro
  cha mutu wa Saldanha icho chikasangika mu 1953 ku South Africa, ndipo chiku\u0175a
  kuti chili na vyaka pafupifupi 500,000, chikasintha katatu kufuma mu 1955 m''paka
  mu 1996.[9]\\nBodo cranium[lemba | kulemba source]\\nChisko cha Bodo ni viswaswa
  vya mtundu unyake wa \u0175anthu. Mu 1976 \u0175anthu \u0175anyake awo \u0175akalongozgekanga
  na Jon Kalb ndiwo \u0175akamusanga. Gulu la Rift Valley Research Mission likachita
  kafukufuku munyake uyo wakawovwira kuti \u0175asange vinthu vya ku Acheulean na
  viswaswa vya vinyama. Alemayhew Asfaw na Charles Smart ndiwo \u0175akamba kusanga
  visko vyapasi. Pakati pajumpha masabata gha\u0175iri, Paul Whitehead na Craig Wood
  \u0175akasanga chiga\u0175a chakunena cha chisko. Viga\u0175a vya chiwangwa ivi
  vikasangika mu mlonga wa Awash ku Ethiopia. Vinthu ivi vikasangika pa malo ghakuru
  chomene gha mchenga, ndipo vi\u0175iya vichoko waka ndivyo vikasangika pafupi na
  chitanda. Chiwangwa ichi chili na vyaka 600,000.[10]\\nObservation[lemba | kulemba
  source]\\nChi\u0175iya ichi chili na chi\u0175iya chikuru chomene icho chikuyana
  na msinkhu wake, ndipo chiku\u0175a pafupifupi 1250 cc (pakati pa ~1,200~1,325 cc).
  Chisko chili na chisko, chiwangwa chikuru cha kumaso, viga\u0175a vinyake vya pakati
  pa chiwangwa, na msana wakunthazi kwa chiwangwa. Utali, usani, na msinkhu wake ni
  masentimita 21, 15,87 na 19.05. \u0174asayansi \u0175akuti \u0175anthu \u0175a mtundu
  wa Bodo \u0175akakomanga nyama chifukwa \u0175akasanga nkhwantha za ku Acheulean
  na viwangwa vya nyama. Vinthu ivyo vikadumulika pa mutu wa Bodo vikulongora kuti
  thupi la munthu likafumiskikanga mwalu\u0175iro para wafwa. Vinthu ivyo vikulongora
  kuti thupi la munthu lika\u0175a na viga\u0175a vyakupambanapambana pa chiwangwa,
  vikulongora kuti munthu wakafumiskanga thupi lake mwadala. Vimanyikwiro vya kudumulika
  uku vika\u0175a pakati pa chi\u0175egha, ndipo \u0175asayansi \u0175akaghanaghananga
  kuti cifukwa ca kudumulira thupi lika\u0175a kuwuskamo chi\u0175egha.[11]\\nMorphology[lemba
  | kulemba source]\\nMphepete mwa chiwangwa cha Bodo nchitali comene ndipo pali viwangwa
  vikuruvikuru. Chi\u0175aro cha thupi la munthu icho chiku\u0175a pa malo ghakupambanapambana
  na thupi la munthu chikuwoneka makora chomene. Glabella njakuzingilizgika ndipo
  yikuwoneka makora. Nga ni Homo erectus, wongo wake ngwapacanya ndipo ukuwoneka nga
  ngwambura ntchito. Viwangwa ivi navyo ni vyakukhoma nga ni viwangwa vya Homo erectus.
  Chifukwa cha msana wake ukuru, wali na chi\u0175aro chikuru chomene icho chikulongora
  kuti wali na vi\u0175aro vinandi. Utali wa chi\u0175egha uwu ungamanya yayi chifukwa
  chiga\u0175a ichi nchambura kukwana. Nangauli chi\u0175aro ichi chikuso\u0175apo,
  kweni tingamanya vinandi vyakukhwaskana na chamoyo ichi para tingagwiliskira ntchito
  vi\u0175aro ivyo vikasangika mu 1981. Makuni gha mu mutu ghakutandazgika mwakuyana
  na umo munthu waliri sono. Chi\u0175aro cha chi\u0175aro ichi chili na chi\u0175aro
  chapachanya chomene icho chili mu viwangwa vya \u0175anthu mazu\u0175a ghano..[12]\\nEvolutionary
  significance[lemba | kulemba source]\\nChi\u0175iya ichi chili na kawonekero kachilendo,
  ndipo pali kukwesana pa nkhani ya ka\u0175irika\u0175iri. Chi\u0175aro ichi chikulongora
  kuti munthu wali na chisko chakuyana na cha \u0175anthu \u0175a mazu\u0175a ghano.
  Bodo na visomba vinyake vya \u0175anthu vya mu nyengo ya Pleistocene vikuwoneka
  kuti vikukolerana na \u0175anthu \u0175a mazu\u0175a ghano. Chifukwa chakuti \u0175anthu
  \u0175a mazu\u0175a ghano \u0175akuyana waka na \u0175anthu \u0175a ku Homo erectus,
  \u0175anthu \u0175anyake \u0175akuti chisko cha Bodo, kweniso \u0175anthu \u0175anyake
  \u0175a ku Homo heidelbergensis, \u0175aka\u0175a mu gulu la \u0175anthu awo \u0175akasintha
  kufuma ku \u0175anthu \u0175a ku Homo erectus mu nyengo ya Middle Pleistocene. Nangauli
  \u0175anthu a\u0175a \u0175akuyana, kweni pali mafumbo ghanandi ghakukhwaskana na
  uko kukafuma \u0175anthu \u0175a mtundu wa Homo heidelbergensis. \u0174anthu \u0175akughanaghana
  kuti visko vya \u0175anthu ivyo vikusangika mu viswaswa nga ni viwangwa vya Bodo
  ndivyo vikapangiska kuti \u0175anthu \u0175a mazu\u0175a ghano \u0175ambe ku\u0175a
  na thupi lakuyana na \u0175anthu \u0175a mu nyengo yakale.[13][14]\\nSimilarities
  between Bodo cranium and Kabwe cranium[lemba | kulemba source]\\nVinthu vinyake
  ivyo vikukolerana na visko vya Bodo na Kabwe ni ivi: Vinthu vyose vi\u0175iri ivi
  vili na mathupi ghakuyana waka na gha \u0175anthu \u0175a mazu\u0175a ghano. Viwangwa
  vyose vi\u0175iri vili na chiwangwa chikuru chomene. Vinthu vi\u0175iri ivi vikulongora
  kuti pali kukolerana pakati pa \u0175anthu \u0175a mtundu wa Homo erectus na Homo
  sapiens. Vinthu ivi vikukolerana na ivyo vikusangika mu vinyama vinyake vya mtundu
  wa Homo heidelbergensis. Viyuni vya mtundu wa Bodo na Kabwe vikuwoneka kuti ni vyakale
  comene cifukwa vili na mikhaliro yakuyana na ya \u0175anthu \u0175a mtundu wa Homo
  erectus. Kweni vyose vi\u0175iri vikupambana chomene na Homo erectus pa nkhani ya
  umo thupi liliri, nga ni umo viwangwa vyawo viliri, umo viwangwa vyawo viliri, umo
  chisko chawo chiliri, kweniso umo mphuno na mathupi ghawo ghaliri. Nangauli pali
  vinthu vinandi ivyo vikuyana, kweni pali vinthu vinyake ivyo vikupambana pakati
  pa vi\u0175eto ivi, kusazgapo chi\u0175aro chose cha mutu wa Bodo, comenecomene
  vi\u0175aro vya kumanyuma, ivyo ni vyakukhoma comene yayi pakuyaniska na vi\u0175eto
  vya Kabwe.[12]\\n\\\"Homo bodoensis\\\"[lemba | kulemba source]\\nMu 2021, Mirjana
  Roksandic na \u0175anyake \u0175a ku Canada \u0175akasachizga kuti mtundu wa H.
  heidelbergensis na \\\"H. rhodesiensis\\\" uleke kusangika, chifukwa zina lakuti
  rhodesiensis likuchindika Cecil Rhodes, munthu wa ku England, uyo wakakhumbanga
  kuti \u0175anthu \u0175a mitundu yinyake \u0175aleke ku\u0175a na wanangwa wa kusankha.
  \u0174akalemba kuti H. heidelbergensis yose ya ku Europe ni H. neanderthalensis,
  ndipo H. rhodesiensis \u0175akayipangiska ku\u0175a mtundu uphya uwo \u0175akawuchema
  kuti \\\"H. bodoensis\\\". \\\"H. bodoensis\\\" wakwimira \u0175anthu awo \u0175aliko
  sono, kweni wakusazgapo yayi \u0175anthu \u0175a mazu\u0175a ghano na \u0175anthu
  \u0175a ku Neanderthal. Iwo \u0175akaghanaghananga kuti \u0175anthu \u0175a mu nyengo
  ya Pleistocene \u0175akamba kusama chifukwa cha kusama kwa \u0175anthu \u0175a mu
  nyengo iyi. Stringer na \u0175anyake \u0175akakana ivyo \u0175akayowoya chifukwa
  \u0175akatondeka kulongosora umo fundo zawo zikovwilira..[15][16]\\nWonaniso[lemba
