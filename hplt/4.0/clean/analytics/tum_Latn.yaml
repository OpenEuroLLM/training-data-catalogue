  gha umo mungapharazgira na Gongwe la Mulinda kweniso umo mungalongosolera unenesko
  wa mu Baibolo wakukhwaskana na zina la Chiuta. Lembani masachizgo ghinu gha umo
  mungapharazgira.\\nUMOYO WACHIKHRISTU\\nKasi mungachita wuli maulendo ghakuwelerako?
  Kasi mungachita wuli maulendo ghakuwelerako? \u0174ani \u0175aubwezi, yowoyani icho
  mwiziraso \u0175ani na chilato\\nUMOYO WACHIKHRISTU\\nKasi ntchivichi chingatovwira
  kuti tilutilire ku\u0175a maso mwauzimu para vinthu vinyake vyasintha ivyo vingatimbanizga
  kusopa Yehova?\"", "\"Ku\u0175erengera kwa miyeso na makona a oblique riser\\nX
  - Kutambasuka kwa sitepe.\\nY - Utali wa sitepe.\\nF - Kuwoneska kwa sitepe.\\nZ
  - Sitepe kutalika.\\nA - Riser kutalika.\\nNkhongono za pulogiramu.\\nKu\u0175erengera
  kwa kukula na makona gha viga\u0175a vyakukwera vya masitepe gha masitepe.\\nMo
  mungagwiriskiya nchitu kulipira pa Intaneti.\\nMu\u0175erenge masitepe agho ghakumukwanani.
  Kuti mucite nthena, gwiliskirani nchito calculator yakukwana ya pa Intaneti ya masitepe.\\nIkani
  viga\u0175a vya sitepe kufuma pa chi\u0175erengero ichi.\\nLongosorani msinkhu wa
  riser blank.\\nDofyani batani lakuti Pendani.\"", "\"Miami (Mayami) mwalamulo City
  of Miami, ni msumba m''mphepete mwa nyanja na malo gha Miami-Dade County ku South
  Florida, United States of America. \u0174anthu \u0175akukwana 442,241 pa census
  ya 2020,[6] ni msumba waci\u0175iri uwo uli na \u0175anthu \u0175anandi comene mu
  Florida, pamanyuma pa Jacksonville. Ni msumba ukuru comene uwo uli na \u0175anthu
  6.14 miliyoni, ndipo ni msumba ukuru wacitatu pa misumba yinandi ya ku Southeast
  kweniso wacinayi pa misumba yinandi mu United States. Msumba uwu uli na nyumba zakudikanya
  zakujumpha 300, ndipo 58 mwa nyumba izi ni zakudikanya mamita 150.[13]\\nMiami ni
  msumba ukuru wa vya ndalama, malonda, mitheto, na malonda gha pa caru cose.[14][15]
  Chiga\u0175a cha Miami ndicho chili na ndalama zinandi chomene mu Florida, ndipo
  chi\u0175elengero cha ndalama izo \u0175anthu \u0175akuguliska mu charu ichi ni
  madola 344.9 biliyoni mu 2017.[16] Kuyana na kafukufuku wa UBS wa 2018 wa misumba
  77 ya pa caru cose, Miami ni msumba wacitatu wakuzirwa comene mu U.S. na wacitatu
  wakuzirwa comene pa caru cose pa nkhani ya nkhongono zakugulira. Miami ni msumba
  wa \u0175anthu \u0175achoko waka ndipo \u0175anthu \u0175a ku Hispanic na Latino
  \u0175alipo 310,472, panji 70.2 peresenti ya \u0175anthu wose \u0175a mu msumba
  uwu.\\nMsumba wa Miami uli na mabanki ghanandi comene mu U.S. ndipo muli makampani
  ghanandi ghakurughakuru.[17]Chiga\u0175a cha Umoyo chili na vipatala vikuruvikuru
  na maofesi gha vyaumoyo agho ghakukolerana na Yunivesite ya Miami, kusazgapo Jackson
  Memorial Hospital, chipatala chikuru chomene mu charu ichi. Miller School of Medicine,
  University of Miami''s academic medical center and teaching hospital, and others
  engaged in health-related care and research. Ku PortMiami, uko kuli dowoko la msumba
  uwu, ndiko \u0175anthu \u0175anandi \u0175akwendako pa charu chose. Ku Miami ndiko
  \u0175anthu \u0175anandi \u0175akuluta ku malo agha. Nyengo zinyake msumba wa Miami
  ukuchemeka \\\"Mulyango wa ku Latin America\\\" cifukwa ca malonda na mitheto iyo
  yikukolerana na caru ici.[18]\\nMu 2022, msumba wa Miami uka\u0175a wa nambara 7
  mu United States pa nkhani ya bizinesi, ndalama za \u0175anthu, kusinthana na \u0175anthu,
  kusangwa na vinthu vyakuthupi, na ndyali. Ni msumba waci\u0175iri uwo \u0175anthu
  \u0175anandi \u0175akuwungana mu U.S. pamanyuma pa New York City na \u0175anthu
  \u0175akujumpha 5 miliyoni.[19][20]\\nMazina gha malo[lemba | kulemba source]\\nZina
  la msumba uwu lili kufuma ku lizgu lakuti Mayaimi, ilo likung''anamura Nyanja ya
  Okeechobee, na zina la \u0175anthu \u0175a ku America awo \u0175akakhalanga kufupi
  na Nyanja iyi. Nyengo zinyake \u0175anthu \u0175akuchema Miami kuti The 305, Magic
  City, Gateway to Americas, Gateway to Latin America, Capital of Latin America na
  Vice City.[1]\\nMbili[lemba | kulemba source]\\n\u0174anthu \u0175a fuko la Tequesta
  \u0175akakhalanga mu chiga\u0175a cha Miami kwa vyaka pafupifupi 2,000 pambere \u0175andafike
  ku Europe. Mu muzi uwu muka\u0175a \u0175anthu \u0175anandi chomene, ndipo uka\u0175a
  wa m''ma 500-600 B.C.E. Uka\u0175a pa mlomo wa mlonga wa Miami. \u0174anthu \u0175akugomezga
  kuti fuko lose ili likaluta ku Cuba m''ma 1700.[21]\\nSettlement[lemba | kulemba
  source]\\nMu 1566, mulongozgi wa \u0175asilikari \u0175a ku Florida, Pedro Men\u00e9ndez
  de Avil\u00e9s, wakati malo agha nga Spain. Pakati pajumpha chaka chimoza, \u0175akazenga
  ofesi yinyake ya ku Spain. Spain na Britain \u0175akalutilira kulamulira Florida
  m''paka mu 1821, apo Spain yikapeleka charu ichi ku United States. Mu 1836, boma
  la United States likazenga Fort Dallas mumphepete mwa Mlonga wa Miami, kuti likhazikiske
  chiga\u0175a cha Florida, kweniso kuti likanizge na kufumiska \u0175anthu \u0175a
  mtundu wa Seminole. Ici cikapangiska kuti ku Miami ku\u0175e nkhondo yaci\u0175iri
  ya Seminole.\\nFounding[lemba | kulemba source]\\nMu msumba wa Miami ndimo muli
  waka msumba ukuru wa ku United States uwo uli kuzengeka na mwanakazi. Julia Tuttle,
  uyo waka\u0175a mulimi wa vipasi ndipo waka\u0175a musambazi wa ku Cleveland, ndiyo
  waka\u0175a mweneko wa malo agha. Kuumaliro wa vyaka vya m''ma 1800, malo agha ghakachemekanga
  kuti \\\"Biscayne Bay Country\\\". Mu nyengo ya kuzizima kukuru kwa mu 1894 na 1895,
  vinthu vikamba kwenda makora chomene mu msumba wa Miami. Pamanyuma, Julia Tuttle
  wakakhorweska Henry Flagler kuti wakhozge Florida East Coast Railway. Miami yikalembeka
  ku\u0175a msumba pa Julayi 28, 1896, ndipo \u0175anthu \u0175akukwana 300.[22]\\n20th
  century[lemba | kulemba source]\\nKukwambilira kwa vilimika vya m''ma 1900, \u0175anthu
  \u0175a ku Bahamas na \u0175a ku Africa awo \u0175akafuma ku America ndiwo \u0175aka\u0175a
  40 peresenti ya \u0175anthu \u0175a mu msumba uwu.:25 Apo \u0175eneco \u0175a nyumba
  \u0175akamba kulekera nyumba \u0175anthu \u0175a ku Africa awo \u0175akakhalanga
  mu viga\u0175a vyakuzingilizga Avenue J (iyo pamasinda yikazgoka NW Fifth Avenue),
  gulu la \u0175analume \u0175azungu awo \u0175aka\u0175a na miliko \u0175akenda mu
  ciga\u0175a ici na kucenjezga \u0175anthu kuti \u0175afumemo mu nyumba zawo panji
  \u0175abombe.:33\\nMu ma 1920, \u0175anthu \u0175anandi \u0175akakhalanga ku Miami,
  ndipo vinthu vikenda makora chifukwa \u0175anthu \u0175a kumpoto \u0175akasamira
  mu msumba uwu. Vinthu ivi vikapangiska kuti \u0175anthu \u0175aleke kugomezga fundo
  za Jim Crow. Mulara wa \u0175apolisi wa ku Miami, H. Leslie Quigg, wakabisanga yayi
  kuti iyo, nga ni \u0175apolisi \u0175anyake \u0175azungu \u0175a ku Miami, waka\u0175a
  mu gulu la Ku Klux Klan. Nchakukondweska kuti \u0175asilikari a\u0175a \u0175akalondezganga
  fundo za mu Baibolo. Mwaciyelezgero, Quigg \\\"wakathyapura mwanalume munyake wa
  mtundu unyake pa wumba cifukwa ca kuyowoya na mwanakazi muzungu\\\".[23]:53[24]\\nNkhondo
  ya ku Florida iyo yikachitika mu 1920, chimphepo cha Miami icho chikachitika mu
  1926, na suzgo likuru la vyachuma ilo likachitika mu 1930, vikapangiska kuti vinthu
  vileke kwenda makora. Nkhondo Yachi\u0175iri ya pa Charu Chose yikati yamba, msumba
  wa Miami ukazgoka msasa wa \u0175asilikari \u0175a boma la United States kuti \u0175avikilire
  msumba uwu ku sitima za pasi pa nyanja za Germany. Ici cikapangiska kuti \u0175anthu
  \u0175a mu msumba wa Miami \u0175asazgikire; mu 1940, mu msumba uwu muka\u0175a
  \u0175anthu 172,172. \u0174anthu awo \u0175akizanga mu tawuni iyi mu nyengo ya chiwuvi
  \u0175akayowoya kuti tawuni iyi yikakura chomene chaka na chaka mwakuti yika\u0175a
  nga ni maji.[25]\\nFidel Castro wakati wafika pa mazaza mu Cuba mu 1959, \u0175anthu
  \u0175anandi \u0175asambazi \u0175a ku Cuba \u0175akachimbilira ku Miami. Msumba
  uwu uka\u0175a wakuzirwa comene mu ma 1970, comenecomene mu 1972. Mu chiga\u0175a
  ichi muka\u0175a maungano gha Democratic na Republican National Convention mu 1972
  Presidential election. \u0174a Miami Dolphins nawo \u0175akalemba mbiri na nyengo
  yawo yambura kuthereskeka. Mu nyengo iyi, masukulu gha ku malo agha ghakasintha
  chomene ndipo msumba uwu uka\u0175a na \u0175anthu \u0175anandi. Miami nayo wakapangaso
  mabizinesi ghaphya na vinthu vinyake vyakukhozga umoyo wa \u0175anthu mu New South
  mu ma 1980 na 1990. Pa nyengo yeneyiyo pera, kumwera kwa Florida kuka\u0175a masuzgo
  ghanyake agho ghakamba chifukwa cha nkhondo ya kunjizga minkhwala yakuzweteska wongo.
  Nyengo zinyake paka\u0175anga mphindano pakati pa \u0175anthu \u0175a mitundu yakupambanapambana,
  kweni mu hafu yaumaliro ya m''ma 1900, msumba uwu ukazgoka msumba ukuru wa vyachuma,
  na wa mitheto. Ni msumba ukuru comene waci\u0175iri mu U.S. uwo \u0175anthu \u0175anandi
  \u0175akutemwa kuyowoya Cisipanishi (panji kuti ndiwo ukujumpha El Paso, Texas),
  ndipo ndiwo msumba ukuru comene uwo \u0175anthu \u0175anandi \u0175akutemwa kuyowoya
  Cuban-American.[26][27]\\nMakhalilo[lemba | kulemba source]\\nMzinda wa Miami uli
  pakati pa mapiri gha Everglades kumanjiliro gha dazi na Biscayne Bay kumafumiro
  gha dazi. Malo agha ghali pachanya pa nyanja mamita 1.8 mu viga\u0175a vinandi,
  chomenechomene mumphepete mwa nyanja. Malo ghapacanya comene ghakusangika mumphepete
  mwa Miami Rock Ridge, iyo yili kusi kwa chiga\u0175a chikuru ca kumafumiro gha dazi
  kwa Miami. Chiga\u0175a chikuru cha msumba uwu chili mumphepete mwa nyanja ya Biscayne
  Bay, iyo yili na virwa vinandi vyachilengiwa na vyakupangika. Mphepo ya Gulf Stream,
  iyo ni nyanja yakuzizima, yikwenda mtunda wa makilomita 24 kufuma ku mtunda wa ku
  mpoto, ndipo nyengo ya mu msumba uwu njakuzizima chaka chose.[28]\\nGeology[lemba
  | kulemba source]\\nMalibwe agho ghali pasi pa malo agha ghakuchemeka Miami oolite
  panji miyala ya malibwe ya ku Miami. Malibwe agha ghali na dongo litali chomene
  ndipo ghakukwana mamita 15. Malibwe gha ku Miami ghaka\u0175ako cifukwa ca kusintha
  kukuru kwa nyanja uko kukacitika mu nyengo ya ciwuvi. Vyaka 130,000 ivyo vyajumpha,
  maji gha mu nyanja ghakakwera mamita 8 kuluska umo ghaliri sono. Kumwera kose kwa
  Florida kuka\u0175a maji ghanandi yayi. Ku Florida kuka\u0175a malibwe ghanandi
  agho ghaka\u0175a pafupi na malo agho sono ni Miami na Dry Tortugas. Malo agho ghaka\u0175a
  kuseri kwa malibwe agha, ghaka\u0175a nyanja yikuru, ndipo malibwe gha miyala yakuchemeka
  Miami ghakafuma mu malo agha. Kwamba vyaka 100,000 ivyo vyajumpha, nyengo ya chiwuvi
  ya Wisconsin yikamba kuchepeska nyanja, ndipo pasi pa nyanja pakavumbukwa. Vyaka
  15,000 ivyo vyajumpha, maji gha mu nyanja ghaka\u0175a kuti ghajumpha pa mamita
  90 m''paka 110. Kufuma apo, nyanja yikakwera mwalu\u0175iro chomene, ndipo vyaka
  4,000 ivyo vyajumpha, yika\u0175a nga umo yiliri sono.[29]\\nPasi pa dambo ili pali
  maji gha Biscayne Aquifer, agho ghakwenda kufuma kumwera kwa chiga\u0175a cha Palm
  Beach m''paka ku Florida Bay. Likwiza kufupi comene na msumba wa Miami Springs na
  Hialeah. Chiga\u0175a chikuru cha Miami chikupokera maji kufuma ku Biscayne Aquifer.
  Chifukwa cha maji agha, ntchakusuzga kukumba pasi pa msumba uwu kwambura kukumana
  na maji. Pa cifukwa ici, misewu ya mu msumba wa Miami na yapafupi nayo njakukwezgeka.\\nChiga\u0175a
  chikuru cha kumanjiliro gha dazi kwa msumba uwu chili mumphepete mwa chiga\u0175a
  cha Everglades. Viyuni ivi vikunjira mu mizi ya ku Miami na mu misewu yikuruyikuru.[29]\\nCityscape[lemba
  | kulemba source]\\nNeighborhoods[lemba | kulemba source]\\nMiami yili kuga\u0175ika
  mu viga\u0175a vya kumpoto, kumwera, kumanjiliro gha dazi, na Downtown. Msumba uwu
  uli na chiga\u0175a chakuchemeka Downtown Miami, icho chili kumafumiro gha dazi
  kwa msumba uwu. Msumba wa Miami ndiwo ni msumba ukuru comene wa boma la Florida,
  ndipo uli na mabanki ghanandi, makhoti, malo ghakusungirako vinthu vya ndalama,
  malo ghakusangulukira, masukulu, mapaki, na \u0175anthu \u0175anandi. Mu Brickell
  Avenue ndimo muli mabanki ghanandi gha vyaru vyakupambanapambana mu United States.
  Kumpoto cha kumanjiliro gha dazi kwa Downtown kuli chiga\u0175a cha Health District,
  icho chili pakati pa chipatala cha Miami, maofesi gha kafukufuku na biotechnology,
  pamoza na vipatala nga ni Jackson Memorial Hospital, Bascom Palmer Eye Institute,
  na University of Miami''s Leonard M. Miller School of Medicine.[31]\\nKu chiga\u0175a
  cha kumwera kwa Miami kuli mizi ya Coral Way, The Roads, na Coconut Grove. Ku Coral
  Way kuli malo ghakukhalako agho ghakazengeka mu 1922 pakati pa Downtown na Coral
  Gables. Coconut Grove, yikazengeka mu 1825, ndipo yika\u0175a malo ghakusangwa na
  mizi. Mu msumba uwu ndimo muli Nyumba ya Ufumu ya Miami pa Dinner Key, Coconut Grove
  Playhouse, CocoWalk, na Coconut Grove Convention Center. Mu tawuni iyi muli malo
  ghanandi ghakusungirako vyakusanguluska, malo ghakurya, na mashopu. Coconut Grove
  yikumanyikwa na mapaki na minda yinandi, nga ni Vizcaya Museum, The Kampong, The
  Barnacle Historic State Park, na nyumba zinyake zinandi.\\nKu chiga\u0175a cha kumanjiliro
  gha dazi kwa Miami kuli viga\u0175a vya Little Havana, West Flagler, na Flagami.
  Nangauli nyengo yinyake chiga\u0175a ichi chika\u0175a cha \u0174ayuda, kweni mazu\u0175a
  ghano \u0175anthu \u0175akufuma ku Central America na Cuba ndiwo \u0175akukhala
  ku chiga\u0175a cha Miami.\\nKu chiga\u0175a cha kumpoto kwa Miami kuli Midtown,
  chiga\u0175a icho chili na \u0175anthu \u0175akupambanapambana. Chiga\u0175a cha
  Edgewater mu Midtown chili na nyumba zikuruzikuru ndipo kuli Adrienne Arsht Center
  for the Performing Arts. Wynwood ni ciga\u0175a ca luso ico cili na magalasi 10
  mu malo ghakusungiramo vinthu ghakale, kweniso vili na vithuzithuzi vikuru vyakutowa.
  \u0174anthu \u0175asambazi \u0175a ku Miami \u0175akukhala mu chiga\u0175a cha Design
  District na Upper Eastside, uko kuli nyumba zinandi za m''ma 1920 kweniso viyelezgero
  vya nyumba za miziyamu za ku Miami mu chiga\u0175a cha MiMo Historic District. Ku
  chiga\u0175a cha kumpoto kwa Miami kuli \u0175anthu \u0175anandi awo \u0175ali kufuma
  ku vyaru vya Africa na Caribbean, kusazgapo Little Haiti, Overtown (uko kuli Lyric
  Theater), na Liberty City.[31]\\nNyengo[lemba | kulemba source]\\nMiami wali na
  mphepo ya mphepo ya tropical monsoon (K\u00f6ppen climate classification Am) na
  chihanya chamoto na chakumera na nyengo yakuzizima.[32][33]\\nMsumba uwu uli pa
  mtunda wa nyanja, uli mumphepete mwa nyanja, uli pachanya pa Tropic of Cancer, ndipo
  uli pafupi na Gulf Stream. Nyengo yakuzizima, kufuma mu Disembala m''paka mu Malichi,
  kukuzizima chomene. Mwezi wa Janyuwale ndiwo ngwakuzizima chomene, ndipo zu\u0175a
  lililose \u0175akuzizima chomene. Kuzizima kwa nyengo ya chiwuvi kukuchepera 10
  \u00b0C kwa maora ghatatu panji ghanayi.\\nKu Miami kuli nyengo zi\u0175iri, nyengo
  yakuzizima na yakuzizima kufuma mu Meyi m''paka Okutobala, kweniso nyengo yakuzizima
  na yakuzizima kufuma mu Novembala m''paka Epulero. Mu nyengo yakuzizima na ya chivula,
  zu\u0175a lililose kukuwa \u0175aleza. Nyengo ya vula ku Miami yikulongosoreka kuti
  ni nyengo iyo chiwuvi chiku\u0175a pachanya pa 21 \u00b0C. Nyengo ya vula yikwamba
  pa zu\u0175a lakwamba, panji para pajumpha mazu\u0175a ghachoko waka. Mwakuyana
  waka, vula yikuchepa chomene ku Miami para vula ya muhanya yose yafika pa 21\u00b0C
  panji kusi. Kufuma mu 1956 m''paka mu 1997, nyengo ya chihanya yikambanga pa Epulero
  16 m''paka Juni 3. Mu vyaka ivi, nyengo ya chihanya yikamaranga pa Seputembala 24
  m''paka Novembala 1. Mu nyengo ya chihanya, matenthedwe ghakukhala pakati pa 80s
  mpaka 90s \u00b0 F (29-35 \u00b0 C) ndipo ghakukolerana na chithukivu chikuru, nangauli
  nyengo zinandi muhanya, chithukivu chikuchepeskeka na \u0175aleza panji mphepo ya
  mu nyanja iyo yikufuma ku Atlantic Ocean. Mu nyengo iyi, mu charu ichi mukulokwa
  maji ghanandi. Mu myezi yakuzizima, jumi likwenda kufuma pa 22\u00b0C mu Juni kufika
  pa 23\u00b0C mu Ogasiti.\\nPa Febuluwale 3, 1917, kukafika pa 27 \u00b0 F (\u22122.8
  \u00b0 C) m''paka pa 38 \u00b0 C pa Julayi 21, 1942. Nangauli ku Miami kulije malo
  agho kulipo chiwuvi kufuma apo \u0175akalembako, kweni mu malo ghanyake mu msumba
  uwu mukawa chiwuvi pa Janyuwale 19, 1977. Nyengo yakuzizima iyo yika\u0175ako mu
  United States mu Disembala 1989 yika\u0175a ya 45 \u00b0F (7 \u00b0C). Nyengo zinyake,
  mu usiku umoza, maji ghakututuka chomene ghaka\u0175anga madigiri 29. Ku\u0175apo
  kwa nyengo ya chihanya yikulongora kuti nyengo ya chihanya yikwenda makora.\\nNyengo
  ya chimphepo yikwamba pa Juni 1 m''paka pa Novembala 30, nangauli nyengo iyi yingajumpha.
  Nyengo yiwemi comene yakuti cimphepo ici cikhwaske msumba wa Miami ni apo nyengo
  ya ku Cape Verde yili paheni comene, pakati pa Ogasiti na kuumaliro wa Seputembala.
  Nangauli mu chiga\u0175a ichi vikusuzga chomene kuwona chimphepo chikuru, kweni
  chimoza chikachitika mu 1925 ndipo chinyake mu 1997. Pafupifupi 40% ya nyumba za
  ku Miami zili kuzengeka pa malo agho kuli maji ghanandi ndipo ni malo agho ghangabwangasuka.\\nMiami
  wali pasi pa chiga\u0175a cha 10b/11a cha dipatimenti ya vyakurya.\\nMiami njimoza
  mwa misumba yikuru ya mumphepete mwa nyanja ndiposo misumba yikuru-yikuru mu United
  States iyo yizamukhu\u0175ara comene na kusintha kwa nyengo. Kuyana na lipoti la
  2020 la bungwe la Resources for the Future, tawuni iyi njimoza mwa misumba iyo yili
  pangozi chomene. Mu 2070 maji gha mu nyanja ghazamukwera kufika pa masentimita 53
  m''paka 100 mu Miami, ndipo ivi vizamupangiska kuti ku\u0175e chimphepo chikuru,
  kututuka kwa maji, kweniso kuti maji gha mu tawuni ghaleke kwenda makora.[34][35][36]
  Vinthu vinyake ivyo vingachitika chifukwa cha kusintha kwa nyengo ni mphepo zinonono
  chomene na \u0175aleza \u0175akofya, ivyo vingapangiska chivula cha malibwe panji
  chimphepo chikuru. \u0174akuchitapo kanthu kuti \u0175avikilire malo agha, kusazgapo
  kunozga malo ghakuzingilizga nyanja na ku\u0175ikapo vigongwe, kuzengaso nyumba
  na misewu iyo njakukhora, na kunozga malo ghakukhalako nga ni malo ghakututuka.
  Mzinda wa Miami Beach wa\u0175ika ndalama zakukwana madola 500 miliyoni kuti uvikilire
  misewu, nyumba, na maji. Mtengo wa katundu mu msumba wa Miami ukuyana waka na mtengo
  wa katundu uyo wakusangika pa malo ghapacanya mu msumba uwu.[37]\\n\u0174anthu[lemba
  | kulemba source]\\nMiami ni msumba ukuru comene mu South Florida, msumba waci\u0175iri
  ukuru comene mu Florida, ndipo ni msumba ukuru comene uwo uli na \u0175anthu \u0175akujumpha
  6 miliyoni. Nangauli mu tawuni iyi muli \u0175anthu \u0175ambura kukwana 14 pa \u0175anthu
  wose awo \u0175akukhala mu tawuni iyi, kweni ni tawuni yichoko chomene pakuyaniska
  na misumba yinyake iyo yili pafupi na tawuni iyi. Mu tawuni iyi muli \u0175anthu
  \u0175anandi chomene kuluska mu chiga\u0175a cha Miami-Dade, icho ntchikuru chomene
  mu chiga\u0175a ichi.\\nMsumba uwu ukakura mwalu\u0175iro mu hafu yakwamba ya vyaka
  vya m''ma 1900, ndipo unandi wa \u0175anthu ukakura kufuma pa 1,681 pa nyengo ya
  kalembera wa mu 1900 kufika pa 249,276 pa nyengo ya kalembera wa mu 1950. Ichi chikapangiska
  kuti msumba uwu u\u0175e ukuru chomene mu Florida, ndipo ukalutilira ku\u0175a msumba
  ukuru m''paka apo msumba wa Jacksonville ukazomerezgekera kuti u\u0175e msumba umoza.
  Kufuma nyengo yira, msumba wa Miami ndiwo ni msumba ukuru comene waci\u0175iri mu
  Florida.\\nMu vyaka vya m''ma 1900, msumba uwu uka\u0175a na \u0175anthu \u0175achoko
  waka, ndipo mu ma 1950 na 1960, ukakura mwalu\u0175iro chomene. Msumba uwu ukakura
  na 34.3% mu vyaka vya m''ma 1950 na 1960, apo \u0175anthu \u0175akakwana 334,859
  pa kalembera wa mu 1970. Ndipouli, mu vyaka 30 vyakulondezgapo, msumba uwu ukakura
  waka na 8.2%, ndipo pa nyengo ya kalembera wa mu 2000, \u0175anthu \u0175akukwana
  362,470.\\nMu vyaka vya m''ma 2000 na 2010, \u0175anthu \u0175a ku Miami \u0175akamba
  kukura chomene chifukwa cha kuzenga nyumba zakudikanya mu Downtown Miami, Edgewater,
  na Brickell. Kafukufuku wakulongora kuti \u0175anthu awo \u0175akakhalanga mu tawuni
  (kufuma ku Brickell kumpoto m''paka ku Midtown Miami) \u0175akakura pafupifupi 40%
  pakati pa 2010 na 2018. Kufuma mu 2000 kufika mu 2010, \u0175anthu \u0175a mu msumba
  uwu \u0175akakura na 10.2% ndipo \u0175akafika 399,457 mu 2010. Mu ma 2010, chi\u0175elengero
  cha \u0175anthu mu tawuni iyi chikakwana 400,000, ndipo pa nyengo ya kalembera wa
  mu 2020, chikakura na 10.7%, kufika pa \u0175anthu 442,241.[50][51]\\nMu 1970, wupu
  wa Census Bureau ukati \u0175anthu \u0175a ku Miami \u0175aka\u0175a 45.3% \u0175a
  mtundu wa Hispanic, 32.9% \u0175a mtundu unyake, ndipo 22.7% \u0175aka\u0175a \u0175a
  mtundu wakuda. Kukura kwa \u0175anthu mu Miami kukapangika cifukwa ca \u0175anthu
  awo \u0175akasamukira mu msumba uwu kufuma ku viga\u0175a vinyake vya caru, m''paka
  mu ma 1960. Kwambira mu 1970 m''paka mu 2000, chi\u0175elengero cha \u0175anthu
  mu msumba uwu chikakhalilira waka, chifukwa \u0175anthu \u0175ambura kufuma ku Spain
  awo \u0175akakhalanga ku Miami \u0175akafumako ndipo \u0175anthu \u0175anandi \u0175akwiza
  kufuma ku Latin America, chomenechomene ku Cuba. Mu nyengo iyi, \u0175anthu \u0175anandi
  \u0175a ku Spain \u0175akakhazikika mu msumba uwu, ndipo mu 1985, msumba uwu ukasora
  meya wakwamba wa ku Cuba, Xavier Suarez.\\nMu 1990, \u0175anthu \u0175a mitundu
  yinyake awo \u0175akakhalanga mu msumba wa Miami \u0175aka\u0175a 90,000. Kweni
  kufuma nyengo yira, \u0175anthu \u0175a mitundu yinyake awo \u0175akukhala mu tawuni
  iyi \u0175akwamba kuchepa. Pa nyengo ya kalembera uyo wakachitika mu 2020, \u0175anthu
  \u0175akukwana 52,447, ndipo \u0175alipo 11.7% pera. Vinyake ivyo vikupangiska ni
  ndalama zinandi izo \u0175anthu \u0175akuguliska mu malo nga ni Liberty City na
  Little Haiti.[53][54]\\n\u0174anthu awo \u0175aka\u0175a \u0174achizungu yayi \u0175akamba
  kuchepa mu vyaka vya m''ma 1900, apo \u0175anthu \u0175a mu viga\u0175a vya kumanjiliro
  gha dazi na pakati pa Miami awo \u0175aka\u0175a \u0174achizungu \u0175akamba kuchepa.
  Ivi vikapangiska kuti \u0175anthu \u0175anandi \u0175ambe kusamira ku chiga\u0175a
  cha Downtown (kufuma ku Latin America pera yayi, kweniso ku United States). Ivi
  vikapangiska kuti \u0175anthu \u0175ambura kuzunura chiyowoyero cha Spain \u0175akwere
  kufuma pa 11.8% pa nyengo ya kalembera wa mu 2000 kufika pa 11.9% pa nyengo ya kalembera
  wa mu 2010. Pamanyuma pa ivi, \u0175anthu awo \u0175aka\u0175a \u0174achizungu yayi
  \u0175akakura mwalu\u0175iro chomene kuluska msumba wose mu ma 2010, ndipo pa nyengo
  ya kalembera wa mu 2020, \u0175anthu \u0174achizungu awo \u0175aka\u0175a \u0174achizungu
  yayi \u0175aka\u0175a 14.0% ya \u0175anthu \u0175a mu msumba uwu ndipo \u0175aka\u0175apo
  61,829, nambara iyo yika\u0175a yikuru chomene kwambira mu ma 1980. \u0174azungu
  \u0175a ku Miami awo mba Hispanic yayi \u0175akaluska \u0175a ku America awo mba
  Black.\\nMu 2010, \u0175anthu 34.4% \u0175a mu msumba uwu \u0175aka\u0175a \u0175a
  ku Cuba, 15.8% \u0175aka\u0175a \u0175a ku Central America (7.2% \u0175a ku Nicaragua,
  5.8% \u0175a ku Honduras, 1.2% \u0175a ku El Salvador, na 1.0% \u0175a ku Guatemala),
  8.7% \u0175aka\u0175a \u0175a ku South America (3.2% \u0175a ku Colombia, 1.4% \u0175a
  ku Venezuela, 1.2% \u0175a ku Peru, 1.2% \u0175a ku Argentina, 1.0% \u0175a ku Chile
  na 0.7% \u0175a ku Ecuador), 4.0% \u0175aka\u0175a \u0175a ku Spain panji \u0175a
  ku Latin America (0.5% \u0175a ku Spain), 3.2% \u0175aka\u0175a \u0175a ku Puerto
  Rico, 2.4% \u0175aka\u0175a \u0175a ku Dominican, ndipo 1.5% \u0175aka\u0175a \u0175a
  ku Mexico.\\nMu 2010, \u0175anthu 5.6% \u0175a mu tawuni iyi \u0175aka\u0175a \u0175a
  ku West Indian panji Afro-Caribbean American (4.4% \u0175a ku Haiti, 0.4% \u0175a
  ku Jamaica, 0.4% \u0175a ku Bahamas, 0.1% \u0175a ku British West Indian, na 0.1%
  \u0175a ku Trinidad na Tobago, 0.1% \u0175a ku West Indian), 3.0% \u0175aka\u0175a
  \u0175a ku Black Hispanics, ndipo 0.4% \u0175aka\u0175a \u0175a ku Sub-Saharan Africa.\\nMu
  2010, \u0175anthu \u0175a ku Europe (\u0175ambura kufuma ku Spain) \u0175aka\u0175a
  11.9% ya \u0175anthu \u0175a ku Miami. Pa \u0175anthu wose awo \u0175akakhalanga
  mu msumba uwu, 1.7% \u0175aka\u0175a \u0175a ku Germany, 1.6% \u0175a ku Italy,
  1.4% \u0175a ku Ireland, 1.0% \u0175a ku England, 0.8% \u0175a ku France, 0.6% \u0175a
  ku Russia, na 0.5% \u0175a ku Poland.\\nMu 2010, \u0175anthu \u0175a ku Asia ndiwo
  \u0175aka\u0175a 1.0% ya \u0175anthu \u0175a ku Miami. Pa \u0175anthu wose awo \u0175akakhalanga
  mu msumba uwu, 0.3% \u0175aka\u0175a \u0175a ku India/Indo-Caribbean (1,206), 0.3%
  \u0175aka\u0175a \u0175a ku China/Chinese Caribbean (1,804), 0.2% \u0175aka\u0175a
  \u0175a ku Philippines (647), 0.1% \u0175aka\u0175a \u0175a ku Asia (433), 0.1%
  \u0175aka\u0175a \u0175a ku Japan (245), 0.1% \u0175aka\u0175a \u0175a ku Korea
  (213), ndipo 0.0% \u0175aka\u0175a \u0175a ku Vietnam (125).\\nMu 2010, \u0175anthu
  1.9% \u0175akajiwonanga kuti mbakufuma ku America pera (kwali mba fuko wuli), apo
  0.5% \u0175aka\u0175a \u0175a ku Arabia.[80]\\nKuyana na kafukufuku uyo wakachitika
  mu 2014 na Pew Research Center, Chikhristu ndicho ntchisopa icho \u0175anthu \u0175anandi
  \u0175akulondezga mu Miami (68%), ndipo 39% \u0175akuyowoya kuti \u0175akusopa mu
  matchalitchi ghakupambanapambana agho ghanga\u0175a gha Chiprotesitanti, ndipo 27%
  \u0175akuti Mbakatolika.[82][83]Kufuma apo pali Chiyuda (9%); Chislamu, Chibuda,
  Chihindu, na visopa vinyake vinandi vili na \u0175anthu \u0175achoko; \u0175anthu
  21% \u0175akugomezga yayi kuti kuli Chiuta panji \u0175ali mu chisopa chilichose.\\nMu
  Miami muka\u0175a tchalitchi la \u0175asilikari \u0175a ku Norway kwamba mu ma 1980.
  Mu Novembala 2011, Mfumukazi Mette-Marit ya ku Norway yikajulira tchalitchi ili.
  Tchalitchi ili likazengeka kuti \u0175anthu 10,000 \u0175a ku Scandinavia awo \u0175akukhala
  mu Florida \u0175akhalengemo. Pa \u0175anthu a\u0175a, \u0175anthu 4,000 mba ku
  Norway. Kweniso tchalitchi ili ndakuzirwa comene ku \u0175anthu 150 \u0175a ku Norway
  awo \u0175akugwira nchito ku Walt Disney World ku Central Florida.[84]\\nKuyana
  na ndondomeko ya \u0175anthu awo \u0175alije pakukhala mu 2022, mu chiga\u0175a
  cha Miami-Dade muka\u0175a \u0175anthu 3,440 \u0175ambura pakukhala, ndipo 970 \u0175aka\u0175a
  mu misewu. Mu msumba wa Miami, muka\u0175a \u0175anthu 591 \u0175ambura pakukhala
  mu misewu, kufuma pa 555 mu 2021.[85]\\nChuma[lemba | kulemba source]\\nMiami ni
  msumba ukuru wa vyamalonda na vya ndalama ndipo uli na \u0175anthu \u0175anandi
  awo \u0175akuchita malonda. Kuyana na 2020 ranking of world cities undertaken by
  the Globalization and World Cities Research Network (GaWC) based on the level of
  presence of global corporate service organizations, Miami yikuwoneka kuti ni Beta
  + level world city, pamoza na Atlanta, Dallas, na Houston, kweni kuyana na census
  ya US pakati pa 2015 \u223c 2019, Miami yikuso\u0175a mu nkhani ya nyumba zakukhalamo,
  kompyuta na intaneti, masambiro ghakukhwaskana na digiri ya bachelor panji kujumpha,
  median household income, per capita income, uku yikufikapo pa chi\u0175elengero
  chikuru cha \u0175anthu mu ukavu. Miami wali na Gross Metropolitan Product (GMP)
  ya $257 billion, ndipo wali pa malo 11 mu United States na 20 pa caru cose.[86][87]\\nMakampani
  ghanandi ghakuru ghali na ofesi yawo mu Miami, kusazgapo Akerman LLP, Alienware,
  Arquitectonica, Brightstar Corporation, Celebrity Cruises, Carnival Corporation,
  Duany Plater-Zyberk, Greenberg Traurig, Inktel Direct, Lennar Corporation, Norwegian
  Cruise Line, Oceania Cruises, OPKO Health, Parkjockey, RCTV International, Royal
  Caribbean International, Sitel, Southern Wine & Spirits, Telemundo, Vector Group,
  Watsco na World Fuel Services. Makampani ghakujumpha 1,400 gha vyaru vyakupambanapambana
  ghali mu Miami, ndipo mabungwe ghanandi ghakuru gha pa caru cose ghali na ofesi
  yawo yikuru ku Latin America (panji maofesi gha mu viga\u0175a) mu msumba uwu kusazgapo
  Walmart. Kweniso, makampani agho ghali mu misumba yapafupi panji mu viga\u0175a
  vyambura kukolerana na boma vya Miami-Dade County ni Benihana, Burger King, Carnival
  Cruise Line, Navarro Discount Pharmacies, Perry Ellis International, Ryder, Sedano''s,
  UniM\u00e1s, na U.S. Banki ya Century.\\nMzinda wa Miami ndiwo ukwendeskeka chomene
  pa nkhani za TV, ndipo ndiwo msumba wakuzirwa chomene ku United States. Telemundo
  na UniM\u00e1s \u0175ali na ofesi yawo yikuru ku Miami. Ma studio gha Univisi\u00f3n
  na Telemundo ghakupanga mapulogiramu ghanandi gha pa TV, nga ni telenovelas, nkhani,
  mase\u0175ero, na ma talk show. Mu 2011, 85% ya mapulogiramu gha Telemundo ghaka\u0175a
  gha ku Miami. Miami nayo ni msumba wakuzirwa comene pa nkhani ya kwimba sumu. Msumba
  uwu uku\u0175aso na \u0175anthu \u0175anandi awo \u0175akujambura mavidiyo gha sumu
  na mafilimu.\\nMu vyaka vya m''ma 2000, msumba uwu uka\u0175a na katundu munandi
  chomene kufuma apo charu cha Florida chikambira mu 1920, ndipo msumba uwu uka\u0175a
  na nyumba zakukwana 100. Kweni \u0175akazenga 50 pera. Kuzenga nyumba zinandi mwalu\u0175iro
  kukapangiska kuti \u0175anthu \u0175anandi \u0175akhalenge mu mizi ya Miami, ndipo
  Downtown, Brickell, na Edgewater, ndiwo ghaka\u0175a malo agho ghakakura lu\u0175iro
  chomene mu msumba uwu. Msumba uwu uli na nyumba zakudikanya zakukwana 7 zakudikanya
  chomene mu Florida.\\nMu 2007, ku malo agha kuka\u0175a suzgo likuru chifukwa cha
  kunangika kwa nyumba. Nga ni viga\u0175a vinyake vya ku United States, vige\u0175enga
  vikusangika mu viga\u0175a vyakupambanapambana. Mu 2016, webusayiti ya 24/7 Wall
  Street yikalemba kuti msumba wa Miami ndiwo nguheni chomene ku United States, chifukwa
  \u0175anthu \u0175anandi \u0175akukhala mu misumba iyi.[88]\\nMalo gha ndege gha
  Miami International Airport (MIA) na PortMiami ghali na \u0175anthu \u0175anandi
  chomene mu charu ichi, chomenechomene awo \u0175akunjira mu vyaru vya South America
  na Caribbean. PortMiami ni dowoko la vyakurya vinandi comene pa caru, ndipo MIA
  ni dowoko la vyakurya vinandi comene ku Florida ndiposo ni cipata cikuru comene
  pakati pa United States na Latin America. Chifukwa cha nkhongono zake mu bizinesi
  ya vyaru vyakupambanapambana, ndalama na malonda, msumba uwu uli na mabanki ghanandi
  chomene gha vyaru vyakupambanapambana mu charu ichi, chomenechomene mu Brickell
  Avenue mu chiga\u0175a cha ndalama cha Brickell, Miami. Mu 2003, msumba wa Miami
  ndiwo ukachitiska ungano wa vyaru vya ku America.\\nKu Miami ndiko kuli National
  Hurricane Center na likuru la United States Southern Command. Kweniso msumba wa
  Miami ni msumba wa mafakitale, comenecomene wa malibwe na malo ghakusungiramo vinthu.
  Makampani agha ghaka\u0175a ku chiga\u0175a cha kumanjiliro gha dazi kwa msumba
  uwu kufupi na Doral na Hialeah.\\nKuyana na U.S. Mu 2012, msumba wa Miami ndiwo
  uka\u0175a na ndalama zinandi chomene pa misumba yikuruyikuru ya ku United States.
  Kweniso msumba wa Miami ngumoza mwa misumba yichoko chomene mu U.S. umo boma la
  mu msumba uwu likaleka kugwira ntchito mu 2001.\\nMu chiga\u0175a ichi muli nyerere
  zina lake Wasmannia auropunctata.[89]\\nPortMiami[lemba | kulemba source]\\nKu Miami
  kuli dowoko likuru comene la ku United States. Ni dowoko likuru comene pa caru,
  ndipo kanandi likucemeka \\\"Cruise Capital of the World\\\" na \\\"Cargo Gateway
  of the Americas\\\". Kwa vyaka vyakujumpha 10, msumba uwu uku\u0175a na ngala\u0175a
  zikuruzikuru na maboti ghakurughakuru. Mu 2017, dowoko ili likawovwira \u0175anthu
  5,340,559. Kweniso, dowoko ili ni limoza mwa dowoko la vinthu ivyo vikwenda chomene
  mu charu ichi, ndipo mu 2017 likapeleka matani 9,162,340. Pa vyaru vya ku North
  America, ni malo ghaci\u0175iri kufuma ku New Orleans'' Port of South Louisiana
  pa nkhani ya katundu uyo wakunjira mu vyaru vya Latin America. Mlonga uwu uli na
  malo ghakukwana maekala 2 ndipo uli na malo ghakukwelerako \u0175anthu 7. Charu
  cha China ndicho chikuguliska katundu munandi chomene mu dowoko ili. Mu Miami muli
  malo ghakurughakuru chomene pa charu chose agho muli maofesi gha Carnival Cruise
  Line, Celebrity Cruises, Norwegian Cruise Line, Oceania Cruises, na Royal Caribbean
  International. Mu 2014, Port of Miami Tunnel yikajulika, ndipo yikayaniska MacArthur
  Causeway na PortMiami.[90]\\nTourism and conventions[lemba | kulemba source]\\nKukopa
  \u0175alendo ni mwa makampani ghakuru comene gha Miami, ndipo uli na nchito zakujumpha
  144,800 mu Miami-Dade County.[91] Chifukwa chakuti tawuni iyi yikuzunulika kanandi
  waka mu sumu, mafilimu, na vinyake, yikumanyikwa pa charu chose. Mu 2016, msumba
  uwu ndiwo uka\u0175a na \u0175alendo \u0175anandi chomene kuluska msumba unyake
  uliwose wa ku United States, pamanyuma pa New York City. Mu 2017, \u0175anthu \u0175akujumpha
  15.9 miliyoni \u0175akiza ku Miami, ndipo ndalama izo \u0175akasanga zika\u0175a
  madola mabiliyoni 26.1.[92] Chifukwa cha mahotelo ghanandi na malo ghakusoperapo
  gha ku Miami Beach Convention Center, \u0175anthu \u0175anandi \u0175akutemwa kuluta
  ku maungano gha chiga\u0175a.\\nMalo ghanyake agho \u0175anthu \u0175akutemwa kuluta
  ku Miami ni South Beach, Lincoln Road, Bayside Marketplace, Downtown Miami, na Brickell
  City Centre. Chiga\u0175a cha Art Deco ku Miami Beach chikucemeka kuti ni cimoza
  mwa viga\u0175a vyakutowa comene pa caru cose cifukwa ca malo gha mase\u0175ero
  ghausiku, milyango ya nyanja, nyumba zakale, na mashopu. Vinthu ivyo vikuchitika
  chaka na chaka nga ni Miami Open, Art Basel, Winter Music Conference, South Beach
  Wine and Food Festival, na Mercedes-Benz Fashion Week Miami vikukopa \u0175anthu
  \u0175anandi ku msumba uwu.\\nMwambo[lemba | kulemba source]\\nMu msumba wa Miami
  muli \u0175anthu \u0175anandi awo \u0175akukhala mu vyaru vyakupambanapambana. Miami
  wakumanyikwa na zina lakuti \\\"Magic City\\\" cifukwa ca ku\u0175a na \u0175anthu
  \u0175anandi cifukwa ca ucoko wake ndiposo kukura kwake. Msumba uwu ngwakucemeka
  comene cifukwa ca nkhondo ya vyandyali iyo yikacitika mu ma 1980 ndiposo cifukwa
  ca kawonekero kake. Likumanyikwaso na zina lakuti \\\"Mzinda wa ku Latin America\\\"
  cifukwa ca \u0175anthu \u0175anandi awo \u0175akuyowoya Cisipanishi.[93][94]\\nMiami
  yika\u0175a malo gha mafilimu ghanandi na ma TV, kusazgapo Miami Vice, Cocaine Cowboys,
  Burn Notice, Jane the Virgin, Scarface, The Birdcage, Ace Ventura: Pet Detective,
  The Golden Girls, 2 Fast 2 Furious, na Dexter. Mase\u0175era gha pa vidiyo ghanandi,
  kusazgapo Hotline Miami, mase\u0175ero gha pa galimoto gha Gameloft gha Asphalt
  Overdrive, Scarface: The World Is Yours, na Vice City mu mase\u0175ero ghanandi
  gha pa vidiyo gha Grand Theft Auto, chomenechomene Grand Theft Auto: Vice City,
  ghakujintha pa Miami.[95]\\nEntertainment and performing arts[lemba | kulemba source]\\nPadera
  pa viphikiro ivyo vikuchitika chaka chilichose nga ni Calle Ocho Festival, ku Miami
  kuli malo ghanandi gha vyakusanguluska, malo ghakusungirako vinthu vyakale, malo
  ghakusungirako vinthu vyakale, na malo ghanyake ghakuchitirako vyakusanguluska.
  Malo ghaphya agho \u0175anthu \u0175akutemwa ku Miami ni Adrienne Arsht Center for
  the Performing Arts, uko kuli Florida Grand Opera, ndipo ni malo ghaci\u0175iri
  ghakuru comene ku United States pamanyuma pa Lincoln Center mu msumba wa New York.
  Ku malo agha, \u0175anthu \u0175akuchitako mase\u0175ero ghanandi gha opera, ballet,
  makonsati, na mase\u0175ero ghanyake ghakufuma mu vyaru vinandi. Malo ghanyake ghakusanguluskira
  mu Miami ni Olympia Theater, Wertheim Performing Arts Center, Fair Expo Center,
  Tower Theater, na Bayfront Park Amphitheater.\\nChiphikiro chinyake chakuzirwa ni
  Chiphikiro cha Mafilimu ku Miami, icho chikuchitika chaka chilichose kwa mazu\u0175a
  10 mu sabata yakwamba ya Malichi. Mu Miami muli mafilimu ghakujumpha 6.[96][97]\\nMu
  msumba wa Miami muli \u0175anthu \u0175anandi awo \u0175akwimba, \u0175akwimba,
  \u0175akwimba, na \u0175akwimba. Mu tawuni iyi muli mawupu ghanandi gha vyakwimba,
  ma symphony, na ma conservatory. Pa malo agha pali Florida Grand Opera, FIU School
  of Music, Frost School of Music, na New World School of the Arts.\\nMiami ni msumba
  ukuru wa mafashoni, uko kuli \u0175anthu \u0175akutemwa kujitozga na mawupu ghanyake
  ghakutozga. Mu msumba uwu mukuchitika viphikiro vinandi vya mafashoni, kusazgapo
  chiphikiro cha Miami Fashion Week na Mercedes-Benz Fashion Week Miami.\\nMiami yizamu\u0175a
  na sinema yakwamba pa Sabata, Julayi 25, 2020.[98]\\nMuseums and visual arts[lemba
  | kulemba source]\\nMuziyamu yinyake ya ku Miami muli Frost Art Museum, Frost Museum
  of Science, HistoryMiami, Institute of Contemporary Art, Miami Children''s Museum,
  P\u00e9rez Art Museum, Lowe Art Museum, na Vizcaya Museum and Gardens, National
  Historic Landmark iyo yili pa malo ghakujumpha 28 acre ku Coconut Grove.\\nCuisine[lemba
  | kulemba source]\\nVyakurya vya ku Miami vikulongora umo \u0175anthu \u0175akukhala,
  ndipo vyakurya vya ku Caribbean na Latin America vikukhwaska chomene. Pakusazga
  vyakurya vi\u0175iri ivi na vyakurya vya ku America, \u0175anthu \u0175a ku South
  Florida \u0175akamba kuphika vyakurya vyakupambanapambana. Chi\u0175iya ichi chili
  palipose mu Miami na South Florida ndipo mungachisanga mu malo ghakurya nga ni Pollo
  Tropical.\\n\u0174alendo \u0175a ku Cuba awo \u0175akaluta ku Miami mu ma 1960,
  ndiwo \u0175akambiska cakurya ici. \u0174akiza na cakurya ca usiku, ca Cuban espresso,
  ca Bistec de palomilla, na ca croquetas. Mazu\u0175a ghano, \u0175anthu \u0175akutemwa
  kugwiliskira ntchito makuni agha ndipo \u0175akughawona mu mawindo gha mashopu gha
  mu tawuni, chomenechomene kuwaro kwa mashopu na malo ghakurya.[99][100] Vinyake
  mwa malo agha, nga ni malo ghakurya gha Versailles mu Little Havana, ni malo ghakurya
  gha ku Miami. Mzinda wa Miami uli pa Nyanja ya Atlantic, ndipo uli na mbiri yakale
  ya kuzenga nyanja. Kweniso mu msumba uwu ndimo muli malo ghakurughakuru gha vyakurya
  nga ni Burger King na Benihana.\\nChiyowoyero[lemba | kulemba source]\\nMu chiga\u0175a
  cha Miami muli chiyowoyero chinyake chapadera icho \u0175anthu \u0175anandi \u0175akuyowoya.
  Chiyowoyero ichi chikamba kumanyikwa pakati pa \u0175anthu \u0175akufuma ku Spain
  awo \u0175ali kubabika mu vyaka vya m''ma 2000 na 2000, kusazgapo \u0175anthu \u0175akufuma
  ku Cuba awo \u0175akayowoyanga Chingelezi.[101] Chiyowoyero ichi chikukolerana na
  chiyowoyero cha ku America, kweni chili na vinyake ivyo vikusintha. Mwakupambana
  na viyowoyero vya ku Virginia Piedmont, Coastal Southern American, Northeast American,
  na Florida Cracker, \\\"Miami accent\\\" ni rhotic; kweniso yili na sumu na umo
  yikuyowoyekera.\\nIchi ni chiyowoyelo cha Chingelezi, ndipo ni chiyowoyelo cha \u0175anthu
  awo \u0175akusambira Chingelezi yayi; ntchakukwaniska kupambaniska chiyowoyelo ichi
  na chiyowoyelo cha \u0175anthu awo \u0175akuyowoya chiyowoyero chachi\u0175iri chifukwa
  chakuti \\\"Miami accent\\\" yiku\u0175a na viga\u0175a vyakupambanapambana: palije
  chiyowoyelo cha /\u025b/ panthazi pa chiyowoyelo cha /s/, \u0175anthu \u0175akuteta
  yayi /d\u0292/ na /j/, (nga ni Yale na jail), ndipo /r/ na /rr/ vikuyowoyeka nga
  ni alveolar approximant [\u0279] m''malo mwa alveolar tap [\u027e] panji alveolar
  trill [r] mu Cisipanishi.[102][103][104][105]\\nMase\u0175era[lemba | kulemba source]\\nMagulu
  gha mase\u0175ero ghanayi gha Miami ni Inter Miami CF ya Major League Soccer (MLS),
  Miami Dolphins ya National Football League (NFL), Miami Heat ya National Basketball
  Association (NBA), Miami Marlins ya Major League Baseball (MLB), na Florida Panthers
  ya National Hockey League (NHL). Miami Open, chiphalizgano cha tenesi chaka chilichose,
  chikachitikanga ku Key Biscayne pambere chindasamukire ku Hard Rock Stadium pamanyuma
  pakuti chiphalizgano ichi chikagulika na mwenecho wa Miami Dolphins Stephen Ross
  mu 2019. Mu tawuni iyi muli malo ghanandi ghakusungirako \u0175anthu, malo ghakusoperapo,
  na malo ghakusoperapo gofu. Kale mu misewu ya msumba uwu muka\u0175anga masitima
  gha magalimoto, chomenechomene Grand Prix of Miami, Grand Prix of Miami, na Grand
  Prix of Formula One.[106] Ku Homestead-Miami Speedway Oval ndiko kukuchitikira mase\u0175ero
  gha NASCAR.\\nThe Heat na Marlins \u0175akuse\u0175era mu msumba wa Miami, ku Miami-Dade
  Arena mu Downtown na LoanDepot Park mu Little Havana, mwakulondezgana. Marlins Park
  yikazengeka pa malo agho paka\u0175a sitediyamu yakale ya Miami Orange Bowl.\\nMiami
  Dolphins yikuse\u0175era pa Hard Rock Stadium mu chiga\u0175a cha Miami Gardens,
  apo Florida Panthers yikuse\u0175era kufupi na Sunrise pa FLA Live Arena. Inter
  Miami CF yikuse\u0175era pa DRV PNK Stadium ku Fort Lauderdale, kwa nyengo yitali
  mpaka apo chi\u0175anja cha mase\u0175ero chikapangikenge ku Miami. Miami FC ndi
  timu ina ya mpira yomwe imasewera mu USL Championship yachiwiri ya mpira wa US Professional.
  Mpingo uwu ukuchitiska mase\u0175ero gha kwawo pa Riccardo Silva Stadium pa campus
  ya Florida International University (FIU) ku Miami.\\nOrange Bowl, yimoza mwa mase\u0175ero
  ghakuru gha mu NCAA College Football Playoff, yikuse\u0175ereka pa Hard Rock Stadium
  nyengo yiliyose ya cihanya. Sitediyamu iyi yikachitiskaso mase\u0175ero gha Super
  Bowl. Mu chiga\u0175a cha Miami, mase\u0175ero agha ghakachitikapo maulendo 10.\\nKu
  Miami nako kuli magulu ghanandi gha mase\u0175ero gha ku koleji. Vinyake mwa vyaru
  ivi ni vya University of Miami Hurricanes, ivyo vili pa Hard Rock Stadium, na Florida
  International University Panthers, ivyo vili pa Ricardo Silva Stadium. Gulu la Hurricanes
  likuchita mpikisano mu Atlantic Coast Conference (ACC), apo gulu la Panthers likuchita
  mpikisano mu Conference USA ya National Collegiate Athletic Association.[107][108]\\nKu
  Miami nako kuli mahachi gha Paso Fino, ndipo pa malo agha pakachitikanga viphalizgano
  vya mahachi.\\nMiami ndi umoza mwa misumba 11 ya ku US iyo yizamuchitiska FIFA World
  Cup ya 2026.\\nIvi ni vyalo vikuruvikuru vya mase\u0175ero mu chiga\u0175a cha Miami:\\nMalo
  ghachisangalalo na mu mphepete mwa nyanja[lemba | kulemba source]\\nMsumba wa Miami
  uli na malo ghakupambanapambana agho ghakwendeskeka na National Park Service, Florida
  Division of Recreation and Parks, na City of Miami Department of Parks and Recreation.\\nNyengo
  ya ku Miami njakuthukira comene, ndipo yikovwira kuti munthu wacitenge vyakusanguluska
  vya kuwaro cilimika cose. Mu tawuni iyi muli malo ghanandi ghakuyezgera boti, milonga,
  mabayi, na nyanja ya Atlantic. Mu Biscayne Bay muli malibwe ghanandi agho ghakovwira
  kuti \u0175anthu \u0175anandi \u0175akondwenge na kusambira. Mu tawuni iyi muli
  malo ghakujumpha 80 ghakusungirako vyakurya.[112] Malo ghakurughakuru na ghakumanyikwa
  chomene nga ni Bayfront Park na Museum Park (ghaku\u0175a mu msumba wa Downtown,
  uko kuli Miami-Dade Arena na Bayside Marketplace), Tropical Park, Peacock Park,
  Virginia Key, na Watson Island.\\nMalo ghanyake agho \u0175anthu \u0175akutemwa
  kuluta ku malo ghakusangwa na vyakurya ghaka\u0175a Zoo Miami, Jungle Island, Miami
  Seaquarium, Monkey Jungle, Coral Castle, Charles Deering Estate, Fairchild Tropical
  Botanic Garden, na Key Biscayne.\\nMu 2020 ParkScore ranking yake, The Trust for
  Public Land yikati malo gha paki mu msumba wa Miami ghaka\u0175a malo gha 64 pa
  malo gha mapaki ghawemi chomene mu misumba 100 ya ku US, kufuma pa malo gha 48 mu
  2017. Msumba wa Miami ukawonekanga kuti uli na malo ghakukwana 2.6 acres, malo ghakukwana
  6.5%, 87% ya \u0175anthu awo \u0175akukhala mu msumba uwu \u0175akwenda maminiti
  10 kufuma ku malo agha, ndipo munthu waliyose wakugwiliskira ntchito ndalama zakukwana
  $48.39 pa malo agha.[113][114][115][116][117][118][119][120][121]\\nDango na boma[lemba
  | kulemba source]\\nBoma la msumba wa Miami likugwiliskira nchito ndondomeko ya
  meya na mwimiliri. Komiti ya tawuni iyi yili na \u0175anthu \u0175ankhondi awo \u0175akusankhika
  kufuma mu viga\u0175a ivyo vili na munthu yumoza. Komiti ya msumba ni wupu wakulongozga
  uwo uli na mazaza ghakufumiska malango, na kuchita milimo yose iyo yili kulembekera
  msumba. Mulara wa msumba wakusankhika na \u0175anthu wose ndipo wakusora mulongozgi
  wa msumba. Msumba wa Miami ukwendeskeka na meya Francis Suarez na makomiti 5 agho
  ghakula\u0175ilira viga\u0175a vinkhondi vya msumba uwu.[122] Maungano gha komiti
  iyi ghakuchitikira ku Miami City Hall, ku 3500 Pan American Drive pa Dinner Key
  mu chiga\u0175a cha Coconut Grove. Mu Nyumba ya Wupu Wakulongozga ya United States,
  boma la Miami likwimira \u0175a Republican Maria Elvira Salazar na Mario Diaz-Balart,
  pamoza na Democrat Frederica Wilson.\\nCity Commission[lemba | kulemba source]\\n-
  Francis Suarez \u2013 Mayor of the City of Miami\\n- Alex Diaz de la Portilla \u2013
  Miami Commissioner, District 1\\n- Sabina Covo \u2013 Miami Commissioner, District
  2\\n- Arts & Entertainment District, Brickell, Coconut Grove, Coral Way, Downtown
  Miami, Edgewater, Midtown Miami, Park West and the South part Upper Eastside\\n-
  Joe Carollo \u2013 Miami Commissioner, District 3\\n- Manolo Reyes \u2013 Miami
  Commissioner, District 4\\n- Coral Way, Flagami and West Flagler\\n- Christine King
  \u2013 Miami Commissioner, District 5\\n- Buena Vista, Design District, Liberty
  City, Little Haiti, Little River, Lummus Park, Overtown, Spring Garden and Wynwood
  and northern part of the Upper Eastside\\n- Arthur Noriega \u2013 City Manager\\n-
  Victoria M\u00e9ndez \u2013 City Attorney\\n- Todd B. Hannon \u2013 City Clerk\\nMasambilo[lemba
  | kulemba source]\\nColleges and universities[lemba | kulemba source]\\nChiga\u0175a
  cha Miami-Dade chili na \u0175ana \u0175a sukulu \u0175akujumpha 200,000 awo \u0175ali
  kulembeska ku makoleji na maunivesite gha mu chiga\u0175a ichi. Mu 2010, makoleji
  na maunivesite ghanayi ghakurughakuru mu msumba uwu, Miami Dade College, Florida
  International University, University of Miami, na Barry University, ghakafumiska
  \u0175ana \u0175a sukulu 28,000.\\nMu msumba wa Miami muli mawupu ghanandi agho
  ghakusambizga \u0175anthu ntchito za mawoko kweniso ghanyake ghakovwira \u0175anthu.
  Mwaciyelezgero, Per Scholas ni wupu uwo ukupeleka masambiro ghaulere ghakovwira
  kuti munthu wa\u0175e na mwa\u0175i wa kufiska viyezgelero vya CompTIA A+ na Network+
  kuti wasange nchito na kuzenga nchito.[123] [124][125]\\nMasukulu gha ku koleji
  na mayunivesite mu Miami na viga\u0175a vyapafupi:\\n- Barry University, Miami Shores\\n-
  Broward College, Fort Lauderdale\\n- Florida Atlantic University, Boca Raton\\n-
  Florida International University, University Park\\n- Florida Memorial University,
  Miami Gardens\\n- Keiser University, Fort Lauderdale\\n- Miami Dade College, Miami\\n-
  Miami International University of Art & Design\\n- Nova Southeastern University,
  Davie\\n- Palm Beach Atlantic University, West Palm Beach\\n- Palm Beach State College,
  Lake Worth Beach\\n- St. Thomas University, Miami Gardens\\n- Southeastern College,
  West Palm Beach\\n- Talmudic University of Florida, Miami Beach\\n- University of
  Fort Lauderdale, Lauderhill\\n- University of Miami, Coral Gables\\nPrimary and
  secondary schools[lemba | kulemba source]\\nSukulu za boma ku Miami zikulongozgeka
  na Miami-Dade County Public Schools, iyo ni sukulu yikuru comene mu Florida ndiposo
  yacinayi mu United States. Mu Seputembala 2008, sukulu iyi yika\u0175a na \u0175ana
  \u0175a sukulu 385,655 kweniso masukulu na malo ghakujumpha 392. Chiga\u0175a ichi
  ndicho chili na masukulu ghakurughakuru chomene gha \u0175anthu \u0175achoko waka
  mu charu ichi, ndipo \u0175ana \u0175a sukulu 60 pa 100 \u0175alipo \u0175a mtundu
  wa Hispanic, 28 pa 100 \u0175alipo \u0175a mtundu wa Black panji West Indian, 10
  pa 100 \u0175alipo \u0175a mtundu wa White (\u0175ambura kufuma ku Spain) ndipo
  2 pa 100 \u0175alipo \u0175a mitundu yinyake.\\nKu Miami kuli masukulu ghapachanya
  ghapachanya gha mu charu ichi, nga ni Design and Architecture High School, masukulu
  ghapachanya chomene mu charu ichi, MAST Academy, Coral Reef High School, masukulu
  ghapachanya ghapachanya ghapachanya ghapachanya gha 20 mu U.S., Miami Palmetto High
  School, na New World School of the Arts.[126] M-DCPS nayo njimoza mwa masukulu gha
  boma ghachoko waka mu United States agho ghakusambizga mu viyowoyero vi\u0175iri.\\nMu
  msumba wa Miami muli masukulu ghanandi gha Katolika, Chiyuda, na ghanyake. Mu tawuni
  iyi muli masukulu gha Katolika. Hugh Catholic School, St. Sukulu ya Agatha Catholic,
  St. Sukulu ya Theresa, Immaculata-Lasalle High School, Monsignor Edward Pace High
  School, Archbishop Curley-Notre Dame High School, St. Sukulu ya Brendan High, pamoza
  na masukulu ghanyake ghanandi gha Katolika.\\nMasukulu ghakusambizgira gha Katolika
  agho ghakulongozgeka na \u0175aliska \u0175a visopa ni Belen Jesuit Preparatory
  School na Christopher Columbus High School gha \u0175anyamata na Carrollton School
  of the Sacred Heart na Our Lady of Lourdes Academy ya \u0175asungwana.\\nMasukulu
  ghapadera gha ku Miami agho ghakusopa yayi ni Ransom Everglades, Gulliver Preparatory
  School, na Miami Country Day School. Masukulu ghanyake mu ciga\u0175a ici ni Samuel
  Scheck Hillel Community Day School, Dade Christian School, Palmer Trinity School,
  Westminster Christian School, na Riviera Schools.\\nSupplementary education[lemba
  | kulemba source]\\nHoshuko wa ku Miami, ni sukulu ya ku Japan ya nyengo yichoko
  waka ya \u0175anthu \u0175a ku Japan na \u0175anthu \u0175a ku Japan. Pakwamba,
  malo agha ghaka\u0175a ku Virginia Key, ku Rosenstiel School of Marine and Atmospheric
  Science. Pasono sukulu iyi yikucita masambiro mu Westchester ndipo yili na maofesi
  mu Doral.[127][128]\\nWayilesi[lemba | kulemba source]\\nMu msumba wa Miami ndimo
  muli misika yikuru ya TV mu charu ichi, ndipo ndiyo yikuru chomene mu Florida. Mu
  msumba wa Miami muli manyuzipepara ghanandi ghakuru. El Nuevo Herald ni nyuzipepara
  yikuru comene ya Cisipanishi. Nyuzipepara ya Miami Herald na El Nuevo Herald ni
  nyuzipepara zikuru comene za ku Miami na South Florida. Manyuzipepara agha ghakafumako
  ku nyumba yawo ya ku Downtown Miami mu 2013. Maofesi gha nyuzipepara agha sono ghali
  mu nyumba iyo kale yika\u0175a ya U.S. \u0174alongozgi \u0175a ku Southern Command
  \u0175ali mu Doral.[129][130]\\nManyuzipepara ghanyake ghakuru ni Miami Today, ku
  Brickell, Miami New Times, ku Midtown, Miami SunPost, South Florida Business Journal,
  na The Miami Times. Kweniso nyuzipepara yinyake ya Cisipanishi yakucemeka Diario
  Las Americas yikupharazga mu msumba wa Miami. Manyuzipepara gha \u0175ana \u0175a
  sukulu gha ku maunivesite gha ku malo agha ghaka\u0175a The Miami Hurricane, Florida
  International University''s The Beacon, Miami-Dade College''s The Metropolis, na
  Barry University''s The Buccaneer.\\nMagazini ghanandi ghakusindikizgika mu chiga\u0175a
  chose cha Miami, kusazgapo Miami Monthly, tawuni yimoza pera ya kumwera kwa Florida,
  na Ocean Drive.\\nMiami ni malo ghakusungirako ma TV ghakurughakuru gha pa caru
  cose, makampani ghakusungirako ma CD, makampani ghakupharazga, na maofesi gha kupanga,
  nga ni Telemundo, Univision, Univision Communications, Mega TV, Universal Music
  Latin Entertainment, RCTV International na Sunbeam Television. Mu 2009, Univision
  yikapharazga kuti yikukhumba kuzenga studio yiphya ku Miami, yakucemeka Univision
  Studios. Pa nyengo yasono, ofesi yikuru ya Univision Studios yili ku Miami, ndipo
  yikupanga mapulogiramu ghose gha pa wayilesi ya Univision Communications.\\nMiami
  ni msika ukuru comene wa mawayilesi wa nambara 12 na wa TV wa nambara 17 mu United
  States. Malo gha TV agho ghakupharazga mu chiga\u0175a cha Miami ni WAMI (UniM\u00e1s
  O&O), WBFS (Independent), WSFL (The CW), WFOR (CBS O&O), WHFT (TBN), WLTV (Univision
  O&O), WPLG (ABC), WPXM (Ion), WSCV (Telemundo), WSVN (Fox), WTVJ (NBC O&O), WPBT
  (PBS), na WLRN (PBS).[131][132][133]\\nTransportation[lemba | kulemba source]\\nKuyana
  na kafukufuku uyo wakacitika ku America mu 2016, \u0175anthu 72.3% awo \u0175akakhalanga
  mu msumba wa Miami \u0175akendanga pa\u0175ekha, 8.7% \u0175akendanga pa\u0175ekha,
  9% \u0175akendanga pa galimoto, ndipo 3.7% \u0175akendanga pasi. Pafupifupi \u0175anthu
  1.8% ndiwo \u0175akendanga pa galimoto, njinga yamoto, na njinga. Pa \u0175anthu
  awo \u0175akakhalanga mu msumba wa Miami, 4.5% \u0175akagwiranga nchito ku nyumba.
  Mu 2015, \u0175anthu 19.9% mu msumba wa Miami \u0175aka\u0175avya galimoto, ndipo
  mu 2016 \u0175akakhalapo 18.6%. Pa caru cose, ci\u0175elengero ici cika\u0175a 8.7
  peresenti mu 2016. Ku Miami, mu 2016, nyumba yiliyose yika\u0175a na magalimoto
  pafupifupi 1.24 pakuyaniska na nyumba yiliyose ya 1.8 pa charu chose.[134]\\nExpressways
  and roads[lemba | kulemba source]\\nMisewu ya Miami yikwenda mu mizere ya mizere
  ya Miami uko Flagler Street ndiyo yili kumafumiro gha dazi na kumanjiliro gha dazi
  ndipo Miami Avenue ndiyo yili kumpoto na kumwera. Khonde la Flagler Street na Miami
  Avenue lili pakatikati pa Downtown panthazi pa Downtown Macy''s (kale likuru la
  Burdine). Chiga\u0175a cha Miami chili na manambara mwakuti maadiresi ghose gha
  misewu kumpoto kwa Flagler Street na kumanjiliro gha dazi kwa Miami Avenue ghali
  na \\\"NW\\\". Pakuti malo ghake ghali ku Downtown, kufupi na mumphepete mwa nyanja,
  viga\u0175a vya \\\"NW\\\" na \\\"SW\\\" ni vikuru comene kuluska vya \\\"SE\\\"
  na \\\"NE\\\". Misewu yinandi, comenecomene misewu yikuru, nayo yikucemeka mazina
  (nga ni Tamiami Trail/SW 8th St), nangauli mwapadera, \u0175anthu \u0175anandi \u0175akugwiliskira
  nchito mazina agha.\\nMu chiga\u0175a ichi, misewu ya kumpoto na kumwera yikuchemeka
  makhoti misewu yikuru yikwenda mtunda wa kilomita yimoza. Mu misewu ya kumpoto na
  kumwera muli mabwalo 16, ndipo misewu ya kumafumiro gha dazi na kumanjiliro gha
  dazi yili na mabwalo 10. Misewu yikuru ya kumpoto na kumwera yikumalira pa \\\"7\\\"
  nga ni 17th, 27th, 37th/Douglas Aves., 57th/Red Rd., 67th/Ludlam, 87th/Galloway,
  na vinyake. (Chinthu chinyake chakuzirwa chomene ni 42nd Avenue, LeJeune Road, iyo
  yili pa malo gha hafu ya mtunda.) Misewu yikuru ya kumafumiro gha dazi na kumanjiliro
  gha dazi kumwera kwa Downtown njakupambanapambana na 16, nangauli malo ghakwamba
  gha ndondomeko iyi ni SW 8th St, hafu ya mtunda kumwera kwa Flagler (\\\"zeroth\\\")
  Street. Ntheura misewu yikuru yili pa 8th St., 24th St. / Coral Way, 40th St. /Bird,
  56th/Miller, 72nd/ Sunset, 88th/N. Kendall, 104th (pakwamba S. Kendall), 120th/Montgomery,
  136th/Howard, 152nd/Coral Reef, 168th/Richmond, 184th/Eureka, 200th/Quail Roost,
  216th/Hainlin Mill, 232nd/Silver Palm, 248th/Coconut Palm, etc., mu vyaka vya m''ma
  300. Mu gridi iyi, maadiresi gha vi\u0175elengero vyambura kwenelera ghali kumpoto
  panji kumafumiro gha dazi, ndipo gha vi\u0175elengero vyambura kwenelera ghali kumwera
  panji kumanjiliro gha dazi.\\nMisewu na misewu yose mu chiga\u0175a cha Miami-Dade
  yikulondezga mizere ya Miami, kupaturako vichoko waka, chomenechomene mu Coral Gables,
  Hialeah, Coconut Grove na Miami Beach. Malo ghanyake ghakuchemeka The Roads, cifukwa
  misewu yake yikufumako ku mizere ya ku Miami, ndipo yili na makona 45.\\nChiga\u0175a
  cha Miami-Dade chili na misewu yinayi ya Interstate Highways (I-75, I-95, I-195,
  I-395) na misewu yinandi ya U.S. Misewu yikuruyikuru, kusazgapo misewu ya ku United
  States Msewu wa 1, U.S. Msewu wa 27, U.S. Msewu wa 41, na U.S. Msewu wa 441.\\nSome
  of the major Florida State Roads (and their common names) serving Miami are:\\n-
  SR 112 (Airport Expressway): Interstate 95 to MIA\\n- Homestead Extension of Florida''s
  Turnpike (SR 821): Florida''s Turnpike mainline (SR 91)/Miami Gardens to U.S. Route
  1/Florida City\\n- SR 826 (Palmetto Expressway): Golden Glades Interchange to U.S.
  Route 1/Pinecrest\\n- SR 836 (Dolphin Expressway): Downtown to SW 137th Ave via
  MIA\\n- SR 874 (Don Shula Expressway): 826/Bird Road to Homestead Extension of Florida''s
  Turnpike/Kendall\\n- SR 878 (Snapper Creek Expressway): SR 874/Kendall to U.S. Route
  1/Pinecrest & South Miami\\n- SR 924 (Gratigny Parkway) Miami Lakes to Opa-locka\\nMiami
  yili na misewu yikuru yinkhondi na umoza iyo yikwenda pa Biscayne Bay, ndipo yikukolerana
  na chiga\u0175a cha kumanjiliro gha dazi kwa charu, na virwa vya kumafumiro gha
  dazi kwa nyanja ya Atlantic. Msewu wa Rickenbacker Causeway ndiwo uli kumwera chomene
  ndipo ukukumana na Brickell na Virginia Key na Key Biscayne. Msewu wa Venetian Causeway
  na MacArthur Causeway ukukumana na msumba wa Downtown na South Beach. Msewu wakuchemeka
  Julia Tuttle Causeway, uwo ukukolerana na Midtown na Miami Beach. Msewu wa 79th
  Street Causeway ukuyaniska Upper East Side na North Beach. Msewu wa Broad Causeway,
  ndiwo ni ucoko comene pa misewu yinkhondi na yimoza ya ku Miami ndipo ukukumana
  na North Miami na Bay Harbor Islands na Bal Harbour.\\nMu 2007, boma la Miami ndilo
  lika\u0175a na \u0175adokotala \u0175ankhaza comene mu United States. Kweniso msumba
  wa Miami ukucemeka kuti ni msumba wakofya comene ku \u0175anthu awo \u0175akwenda
  pasi mu United States.[135][136]\\nPublic transportation[lemba | kulemba source]\\nMtengatenga
  wa \u0175anthu mu Miami ukwendeskeka na Miami-Dade Transit na SFRTA, ndipo yikusazgapo
  njanji za \u0175anthu \u0175akufuma ku malo ghanyake (Tri-Rail), njanji zinonono
  zakwendeskeka mwalu\u0175iro (Metrorail), njinga ya \u0175anthu (Metromover), na
  mabasi (Metrobus). Mu msumba wa Miami muli \u0175anthu \u0175anandi chomene awo
  \u0175akwenda pa galimoto chifukwa \u0175anthu pafupifupi 17% \u0175akwenda pa galimoto
  zu\u0175a lililose. \u0174anthu \u0175anandi \u0175akwenda maminiti 90 pa sabata,
  ndipo 39% \u0175a awo \u0175akwenda pa galimoto \u0175akwenda maora ghakujumpha
  gha\u0175iri pa zu\u0175a. Pafupifupi munthu waliyose wakulindilira maminiti 18
  pa malo ghakugwilira ntchito ya mendero. Mtunda wa ulendo umoza na magalimoto ghakurughakuru
  ni makilomita 12.46, ndipo \u0175anthu 38% \u0175akwenda mtunda wa makilomita 13.8.[137]\\nMsewu
  wa Metro wa ku Miami uli na mizere yi\u0175iri na masiteshoni 23. Metrorail yikukolerana
  na viga\u0175a vya kumanjiliro gha dazi kwa tawuni ya Hialeah, Medley, na mukati
  mwa tawuni ya Miami na viga\u0175a vya The Roads, Coconut Grove, Coral Gables, South
  Miami, na Kendall mu tawuni kwizira mu viga\u0175a vya bizinesi vya Miami International
  Airport, Health District, na Downtown. Metromover, yeneiyo yikwenda pa malo ghapachanya,
  yikugwira nchito na masiteshoni 21 pa mizere yitatu yakupambanapambana mu msumba
  wa Downtown Miami, ndipo pali masiteshoni gha\u0175iri pa nyumba yiliyose pakati
  pa Downtown na Brickell. Ntchito zakupharazga zinandi zikovwirika na msonkho wa
  msonkho uwo ukupelekeka mu chiga\u0175a chose cha Miami-Dade.\\nTri-Rail, njanji
  iyo yikwendeskeka na South Florida Regional Transportation Authority (SFRTA), yikwenda
  kufuma ku Miami International Airport kumpoto kuya ku West Palm Beach, ndipo yikumalira
  pa malo 18.\\nMiami Intermodal Center ni malo ghakurughakuru ghakusungirako \u0175anthu,
  ndipo ghakusungirako magalimoto gha Metrorail, Amtrak, Tri-Rail, Metrobus, Greyhound
  Lines, ma taxi, magalimoto ghakuchita renti, MIA Mover, magalimoto gha\u0175ene,
  njinga na \u0175anthu \u0175akwenda pasi. Chipatala cha Miami Intermodal Center
  chikamara kuzengeka mu 2010, ndipo chikovwira \u0175anthu pafupifupi 150,000 awo
  \u0175akwenda mu chiga\u0175a cha Miami. Chigawo choyamba cha MiamiCentral Station
  chinamalizidwa mu 2012, ndipo gawo la Tri-Rail la Phase II linamalizidwa mu 2015,
  koma kumanga gawo la Amtrak kukuchedwabe.\\n\u0174apharazgi \u0175a\u0175iri \u0175aphya,
  Baylink na Miami Streetcar, \u0175ali kunozgekera. BayLink ndiyo yikeneranga kukolerana
  na South Beach, ndipo Miami Streetcar yikeneranga kukolerana na Midtown.\\nMiami
  ni malo gha kumwera uko Amtrak wakumalira maulendo ghake gha ku Atlantic Coast,
  ndipo pali mizere yi\u0175iri, Silver Meteor na Silver Star. Siteshoni ya Amtrak
  ya Miami yili mu chiga\u0175a cha Hialeah kufupi na Siteshoni ya Tri-Rail/Metrorail
  pa NW 79 St na NW 38 Ave. Ntchito yakunozga siteshoni ya Miami Central Station yizamwendeska
  maofesi ghose gha Amtrak kufuma ku malo agho ghalipo sono kuya ku malo ghakukhala
  \u0175anthu \u0175anandi. Malo agha ghakeneranga kuzengeka mu 2012, kweni ghakachedweskeka
  nyengo yitali.[138]\\nAirports[lemba | kulemba source]\\nMalo gha ndege gha ku Miami
  International Airport ndigho ni malo gha ndege gha ku Greater Miami Area. Chifukwa
  cha malo ghake ghakutowa, ndege iyi njimoza mwa ma eyapoti ghakurughakuru pa charu
  chose ndipo yikwenda na \u0175anthu \u0175akujumpha 45 miliyoni pa chaka. Malo agha
  ndigho ni malo ghakurughakuru gha ndege za American Airlines. Miami International
  ni ci\u0175anja ca\u0175iri cakudura comene ca \u0175anthu awo \u0175akwenda pa
  ndege mu Florida, ndipo ni ci\u0175anja cacitatu cikuru comene ca \u0175anthu awo
  \u0175akwenda pa ndege mu United States. Malo gha ndege gha Kennedy na Los Angeles.
  Malo ghakwendera ndege agha ghali na maulendo ghambura kuleka kuluta ku misumba
  yakujumpha 70 ku North na South America, Europe, Africa, Asia, na Middle East.\\nKweniso,
  ku Fort Lauderdale na ku Hollywood International Airport na ku Palm Beach International
  Airport nako kuli magalimoto ghanandi agho ghakwenda mu chiga\u0175a cha Miami.
  Miami-Opa Locka Executive Airport mu Opa-locka na Miami Executive Airport mu chiga\u0175a
  icho chili kumwera kwa Miami, ndipo yikwendeska ndege mu chiga\u0175a cha Miami.[139][140]\\nCycling
  and walking[lemba | kulemba source]\\nBoma la tawuni iyi, ilo muka\u0175a meya wakale
  Manny Diaz, likakolerana na fundo yakuti \u0175anthu \u0175akwendeska njinga mu
  Miami. Mu 2010, magazini ya Bicycling Magazine yikalemba kuti msumba wa Miami ndiwo
  uli pa nambara 44 pa misumba yose ya ku United States iyo yikutemwa kwenda pa njinga.\\nKafukufuku
  uyo wakachitika mu 2011, wakavumbura kuti msumba wa Miami ndiwo uli pa nambara 8
  pa misumba yikuruyikuru 50 ya ku United States.[141][142][143]\\nPublic safety[lemba
  | kulemba source]\\nUbale na vyaru vinyake[lemba | kulemba source]\\nSister cities[lemba
  | kulemba source]\\n- Agadir, Morocco (since 1995) [144]\\n- El Jadida, Morocco
  (since 1995)\\n- Barranquilla, Colombia (since 2015)[145]\\n- Bogot\u00e1, Colombia
  (since 1971)[146]\\n- Buenos Aires, Argentina (since 1979)[146]\\n- Kagoshima, Japan
  (since 1990)[146][147]\\n- Kaohsiung, Taiwan (since 1987) [148]\\n- Lima, Peru (since
  1977)[146]\\n- Madrid, Spain (since 2014)[146][149]\\n- Murcia, Spain (since 1993)
  [150]\\n- Nice, France (since 1986) [151]\\n- Palermo, Italy (since 1997)[152]\\n-
  Qingdao, China (since 2005)[146]\\n- Salvador da Bahia, Brazil (since 2006)[146]\\n-
  San Salvador, El Salvador (since 1991)[146]\\n- Santiago, Chile (since 1986)[146]\\n-
  Santo Domingo, Dominican Republic (since 1987)[146]\\n- Southampton, United Kingdom
  (since 2019)[153]\\nCooperation agreements[lemba | kulemba source]\\nNotable people[lemba
  | kulemba source]\\nVyakulemba[lemba | kulemba source]\\n- Bahamians were farming
  along the Miami River before 1830. Richard Fitzpatrick established a plantation
  there in 1830, but abandoned it when the Second Seminole War (1835\u20131843) began.
  The U.S. Army established Fort Dallas there in 1836, but left the fort in 1841.
  William English reopened Fitzpatrick''s plantation after the war and sold city lots,
  but left the area at the end of the 1840s. The Army returned to the fort in 1849\u20131851,
  and again for the Third Seminole War (1855\u20131858).[3][4]\\n- Mean monthly maxima
  and minima (i.e. the highest and lowest temperature readings during an entire month
