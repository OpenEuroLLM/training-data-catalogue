  aktiv\u016b darbeibu ve\u013cteja Z\u012bme\u013clatgolai. Upeitis pamat\u0161kola
  sadarbeib\u0101 ar Namaterialuos kulturys montuojuma centru \u201cUp\u012bte\u201d
  aicynoj sajust Ontona Sli\u0161\u0101na goru, p\u012bsadol\u016bt rod\u016b\u0161\u016bs
  dorbu konkurs\u0101.\\nKonkursa mierkis ir apl\u012bcynuot p\u012bdareibu i m\u012bleisteibu
  sovam dzymtajam n\u016bvodam i styprynuot latgalisk\u016b kulturidentitati.\\nKonkurs\u0101
  aicynuoti p\u012bsadaleit Vi\u013cakys, Ba\u013ctinovys, Ruguoju i Bolvu n\u016bvoda
  \u0161kol\u0101ni, kurim teik p\u012bduovuoti div aizdavumi:\\n1. Rod\u016b\u0161ais
  dorbs (eseja, miniatura i tt. dorbu var raksteit gon latv\u012b\u0161u litararaj\u0101,
  gon latgal\u012b\u0161u rokstu vol\u016bd\u0101) \u201cAsu lapnys, ka asu latgal\u012bts\u201d.\\nViertie\u0161ona
  byus pa vacuma grupom:\\n1.\u20134. klase dorbu var \u012bsn\u0113gt r\u016bkrokst\u0101,
  dorba lelums 1 A4 formata lopa\\n5.\u20137. klase dorbu \u012bsn\u0101dz datorrokst\u0101,
  dorba lelums 2 A4 formata lopas\\n8.\u201312. klase dorbu \u012bsn\u0101dz datorrokst\u0101,
  dorba lelums 3 A4 formata lopas\\n2. Zeimiejumu konkurss \u201cIlustraceja munam
  m\u012b\u013cuokajam O. Sli\u0161\u0101na dzej\u016b\u013cam\u201d. Zeimiejumu formats
  A3 lopa, tehnika piec izvielis. Zeimiejumam juodal\u012bk ilustr\u0101tais dzej\u016b\u013cs.\\nViertie\u0161ona
  byus pa vacuma grupom: 3\u20135 godi; 6\u20138 godi; 9\u201312 godi; 13\u201315
  godi; 16\u201319 godi.\\nKotrys \u0161kol\u0101ns var p\u012bsadaleit v\u012bn\u0101
  voi obej\u016bs konkurs\u016bs. Kotrys dalin\u012bks var \u012bsn\u0113gt na\u012br\u016bbe\u017euotu
  skaitu sovu dorbu.\\nDorbi juo\u012bsn\u0101dz da 2017. gada 9. janvara v\u012bn\u0101
  nu sev \u0101rtuok\u016bs veidu:\\n1. Upeitis pamat\u0161kol\u0101 kotru dorba d\u012bnu
  nu 9.00 da 16.00 \u0161koluotuojai Sandrai Buk\u0161ai;\\n2. Syut\u016bt pa postu:
  \u201cRod\u016b\u0161\u016bs dorbu konkursam\u201d Upeitis pamat\u0161kola, Stab\u013covys
  \u012bla 1, Upeite, \u0160kilbanu pogosts, Vi\u013cakys n\u016bvods, LV-4587\\n3.
  Rod\u016b\u0161\u016b dorbu var \u012bsn\u0113gt ari, syut\u016bt iz e-postu: upites.skola@inbox.lv\\nDorbam
  juodal\u012bk: \u0161kol\u0101na vuords, pavuorde, vacums, klase, vuiceibu \u012bstuode,
  \u0161koluotuoja vuords pavuorde, kontattelepons, e-posts.\\nN\u016bsl\u0101guma
  pasuokums i uzvar\u0101tuoju apbolvuo\u0161ona 2017. goda 18. janvar\u012b Upeit\u0113.\\nNaskaidreibu
  gad\u012bn\u012b zvaneit: Sandrai Buk\u0161ai 26307566 voi Ligitai Spridz\u0101nei
  29868786 voi raksteit iz e-postu: upites.skola@inbox.lv.\\nKomentari sl\u0101gti.\"",
  "\"Latgal\u012b\u0161u rokstu vol\u016bdys kursi byus. Ka nikas nan\u016bjuks, septembra
  3. nede\u013c\u0101. Suoks\u012bs ar Dr. philol. Annys Stafeckys informativ\u016b
  lekceju par myusud\u012bnu latgal\u012b\u0161u rokstu vol\u016bdu. Sekuos praktiskuos
  vol\u016bdys n\u016bdarbeibys kotru 2. nede\u013cu Mg. philol. Muorys Mortuz\u0101nis
  vadeib\u0101. Pa vydu varbyut byus v\u0113\u013c kaida lekceja par latgal\u012b\u0161u
  rokstu vol\u016bdys viesturi i atteisteibys prognozem.\\nPasn\u012bdziejis sarunuotys,
  papeira ir vasalys 3 pakys, printeram apmain\u0113sim k\u0101rtrid\u017eu. \ud83d\ude00\\nPagaidom
  informaceja gon nateik izplateita, part\u016b ka SIF ir problemys ar atskaitem,
  de\u013ctuo jim Va\u013csts kase napuorskaita naudu. Norvegejis i Briselis nauda
  na\u012b\u012bt SIF kont\u0101, a nu t\u012bnis NVO kont\u016bs. Va\u013csts kai
  vysod myusim ir unikala! Kur v\u0113\u013c \u016btru taidu rast.\\nLeidza ar t\u016b
  LgSC nazyna, kai samoksuos par biroja ustobys \u012bri, narunoj\u016bt par telpu
  \u012bri lekcejom i leluokim pasuokumim.\\nBet gon vyss tiks atrysynuots. Telpys
  pagaidom meklejam par ve\u013cti, a mo\u017e da tuo laika i SIF atrysynuos sovys
  b\u0101dys.\\nGols gol\u0101, LgSC vysu laiku ir iztics ar b\u012bdru podsv\u012bstim
  z\u012bduojumim papeira pakys voi capumu izskot\u0101 i sovus projektus realiziejs
  ce\u013coj\u016b\u0161aj\u0101 biroj\u0101 \u2013 pi kaida s\u0101t\u0101, dorb\u0101
  voi ma\u0161yn\u0101. Naudys niv\u012bnam nav bejs ni de\u013c kuo. Narunoj\u016bt
  par izsaimn\u012bkuo\u0161onu.\\nGryuteibys n\u016bryudej. Tai ka iz naudys tryukumu
  LgSC ver\u0101s ar zynomom ba\u017eom pret n\u016bsl\u0101gtajim leigumim, tok cytai\u017e
  najem c\u012b\u0161i golv\u0101.\\nKai viestej vaca LgSC gudreiba: \u201cNaudys
  taipat nabyus nikod.\u201d :O)\"", "\"\u201cBorowa Mc\u201d, gatavej\u016bt\u012bs
  20 godu jubilejis koncertam, sasadz\u012bduojuse ar Katr\u012bnu Dimantu\\nRokstu
  sagataveja: portals lakuga.lv\\nGatavej\u016bt\u012bs svieteit vosoru i \u201cBorowa
  Mc\u201d 20. dzim\u0161onys d\u012bnu, grupa izdavuse jaunu dz\u012bsmi \u201cPr\u016bjam
  juo\u012bt\u201d, informej tuos liders Aigars Run\u010dis. Dz\u012bsme ir parafraze
  par grupys 20 god\u016bs p\u012bdzeivuot\u016b, suoc\u016bt ar pyrmajim koncertim
  i jut\u016bni kulturys nom\u016bs vys\u0101 Latvej\u0101, da atmi\u0146u \u201ckai
  beja\u201d i puord\u016bmu \u201ckai byus\u201d.\\n\u201cDz\u012bsme nav par atsavadei\u0161onu,
  bet atmi\u0146om! \u201cPr\u016bjam juo\u012bt\u201d ir vuordi, k\u016b nagribi
  dzierd\u0113t, kod esi satics draugus i ba\u013c\u013coj\u012bs,\u201d soka grupys
  daleibn\u012bks i dz\u012bsmis teksta autors Aigars Run\u010dis. Dz\u012bsmi \u012braksteja
  Fakts (J\u0101nis \u0160m\u0113di\u0146\u0161), i \u012brokst\u0101 p\u012bsadola
  Katr\u012bna Dimanta, kas \u012bnas tautysdz\u012bsmis motivu i ir kai zamapzinis
  bolss, kas soka, ka ba\u013c\u013cuot v\u0113\u013c nav gona, vystik \u2013 juo\u012bt
  iz s\u0101tu. Dz\u012bsmis teksta video sataisejs Regn\u0101rs Rudus.\\nTai kai
  it\u016bgod grupa \u201cBorowa Mc\u201d svietej 20. dzim\u0161onys d\u012bnu, rudin\u012b
  pl\u0101nuoti vairuoki jubilejis koncerti, p\u012bm\u0101ram, 19. oktobr\u012b Latgolys
  viestn\u012bceib\u0101 \u201cGors\u201d, uz kur\u016b var jau n\u016bpierkt beletus.\\n\u201cPr\u016bjam
  juo\u012bt\u201d ir pyrmais grupys \u201cBorowa Mc\u201d singlys it\u016bgod, kas
  sekoj p\u0101r\u0146 izd\u016btajai dz\u012bsmei \u201cAtmosfera\u201d. Grupa \u201cBorowa
  Mc\u201d dybynuota 2004. god\u0101 i ir izdavuse treis studejis albumus. Zynomuokuos
  grupys dz\u012bsmis ir \u201cVysskaistuokai meiti\u0146ai\u201d, \u201cMa\u0146
  navajag\u201d, \u201cIededzies par Latviju\u201d i cytys. Grupa saj\u0101muse treis
  Latvejis Muzykys \u012brokstu goda bolvys. \u201cBorowa Mc\u201d dorboj\u0101s Aigars
  Run\u010dis, Guntra Kuzmina-Jukna i Ingars Gus\u0101ns.\"", "\"Sarm\u012bte Tr\u016bpa.
  Par babu, rudini i caurumu durovuos\\nStuosta autore: Sarm\u012bte Tr\u016bpa\\nSu\u0146s
  aizrej. Aizdz\u012bdoj gai\u013cs \u2013 v\u012bnu reizi, \u016btru, p\u012bkt\u016b.
  D\u012bna var \u012bsasuokt. Baba, izkuopuse nu \u012bsi\u013cdeituos gultys, kai
  pele skrubynuoj pa skapa atvi\u013cktni, makl\u0101dama ze\u010du. Solt\u0101 laik\u0101
  jei valk mugor\u0101 divejus bru\u0146\u010dus. Satausta skuste\u0146u skaudzi.\\n\u2013
  Pasaver, meite\u0146, voi nava jaunais? \u2013 Na\u012bs jau tuo pa s\u0101tu sanosuot.\\n\u2013
  Baba, de\u013ckam tev tik agri juosace\u013c? Baba, nu, kam tev tei spi\u013cka
  pi kopkys dasprausta? De\u013ckam tev t\u012b diveji bru\u0146\u010di vajadzeigi,
  plita jau kur\u012bs\u2026\\nAsu pam\u016bdynuota na\u0161alkt\u012b, i ma\u0146
  nikas napateik.\\n\u2013 A kurs te iz mane ver\u0101s, kurs manis radz? \u2013 baba
  sasasyrda i atsagu\u013c atpaka\u013c iz gultys \u2013 ar vysu pr\u012b\u0161kysautu
  i obejim bru\u0146\u010dim. I spi\u013cku, daspraustu pi kryu\u0161u kai bro\u0161u.
  \u2013 Nav jau nikaidi So\u010di.\\n\u2013 Es radzu, \u2013 soku. \u2013 I cyti
  jau ari nava okli.\\nBabai taida runa napateik i jei pagr\u012b\u017e ska\u013cuok
  radivi. A muns m\u012bgs ir pr\u016bm pavysam.\\nRadiv\u0113 jai daudz draugu, jei
  pazeist vysus piec bolsim \u2013 Ausmu Indriksoni, Dzintri Kol\u0101tu. T\u012b
  jai po\u0161i m\u012bluok\u012b. Baba zyna vysu par politikim, pensejom, tik t\u016b
  \u201cintern\u0101tu\u201d v\u0113\u013c da gola nasapr\u016bt. Kai tys tai var
  byut, ka par reizi kaids jem tai i syuta viestuli no v\u012bna pasau\u013ca mola
  iz cytu?\\nAgruok viestuli vajadz\u0113ja ko\u010d da Moskovys vi\u013cc\u012b\u0146a
  pyrmuo vagona posta \u0161kierbai n\u016bnest, ka grib\u0113ja, lai tei mudruok
  da Reigai teik. A niule sajiemiejs var\u016bt s\u0113d\u0113t ko\u010d Amerik\u0101
  voi Afrik\u0101 i \u016bksta napakustynuot, jau piec minota kluot atbi\u013cde.
  N\u0101, tys cylv\u0101ka pruotam tikpo\u0161 naizpr\u016btamai kai volkuot\u012bs
  pa Mienesi.\\nBabai pateik ce\u013cuot \u2013 i ar autobusim, i vi\u013cc\u012bnim.
  Jai pateik sajust jaunus smuordus, sadzierd\u0113t vol\u016bdys i riti\u0146u n\u016bm\u012bryn\u016b\u0161\u016b
  klab\u016b\u0146u. Tik kaidam vysod vajag v\u012bn\u0101 gol\u0101 j\u016b \u012bs\u0101dynuot
  vi\u013cc\u012bn\u012b i \u016btr\u0101 sagaideit. Taipat kai se\u0146uok tuos viestulis
  moskov\u012bt\u012b.\\nKotru d\u012bnu baba klausuos, cik pasaul\u012b daudz p\u016bsta
  i nam\u012bra, i n\u016braud par vysim b\u016bj\u0101 guoju\u0161im. Kotru d\u012bnu
  ir, par k\u016b rauduot. I kotru d\u012bnu ir, par k\u016b pasapr\u012bcuot. Gruomotys
  losa akt\u012bri pr\u012b\u0161k\u0101, Danilenko aizdz\u012bdoj. Kod \u013custe,
  jei padz\u012bdoj leidza. Baba grib, kab cyti ari pasaklausa. Jei pagr\u012b\u017e
  radivi ska\u013cuok, a kaids par reizi kluse\u0146om aizver ustobys durovys. \u2013
  Po\u0161i vaineigi, taids \u0161muks raidejums.\\nBet ari po\u0161am \u0161mukuokajam
  da\u012bt ko\u010d kod gols, kai vysam itam\u0101 dzeiv\u0113. I \u0161mukajom l\u012btom
  ve\u013c mudruok kai na\u0161mukajom. Babai vajag k\u016b navi\u0146 pastruoduot,
  navar jau vysu d\u012bnu tik pa gultu vi\u0146 vi\u013cuot\u012bs. Kai ar gludekli
  jei puorbrauc ar r\u016bku bryuni raibajam pr\u012bk\u0161in\u012bkam i taustuos
  iz vyrtuvis pusi.\\n\u0160udi\u0146 loba d\u012bna, dorbs atsar\u016bn. Iz greidys
  lelais kotlys, pylns cyukys galis. Mama \u012bsp\u012b\u017e babai r\u016bk\u0101
  osu nazeiti, \u012bl\u012bk kliep\u012b plastmasys b\u013c\u016bdu. Baba ar nazeiti
  mudri kosa gali nu kaula n\u016bst, tod apsyukoj kaulu, tik piec tam mat t\u016b
  span\u012b, byus Rek\u0161am. Es capu peir\u0101gus. Mama vuorej studzini.\\nTaidys
  d\u012bnys babai pa pruotam, kod vysi pi dorba, a ni va\u013coj\u0101s kotrys sov\u0101
  kokt\u0101. Dorba vysod da besa, tik acs vajag pace\u013ct. Baba i bez ocu ce\u013c\u0161onys
  zyna, kas doroms, tik niv\u012bns c\u012b\u0161i jim\u0101 nasaklausa. Tepat v\u0113\u013c
  t\u0101rzuoja, a, cikom baba da puorejim atsataustejuse, cikom kr\u0101sla atroduse
  ustobys kokt\u0101, vysi jau otkon nazkur pagaisu\u0161i. Kotrys iz sovu pusi izskraidelieju\u0161i.\\n\u2013
  Kai taidi \u017eurkal\u0101ni, \u2013 baba purpinej.\\nBet \u0161udi\u0146 babai
  loba d\u012bna. Galis b\u013c\u016bda pylna, Rek\u0161am kauli. Studzi\u0146s savuoreits.
  Es \u012bleju jai p\u012bna, \u012bsp\u012b\u017eu r\u016bk\u0101 pluoci\u0146a
  gobolu. Baba aizatausta iz sovu ustobu. Aiz l\u016bga jau malna nakts, rudin\u012b
  mudri satymst, a babai elektreibys navajaga. Jei apsas\u0101st iz kr\u0101sla i
  uzmaneigi puorbrauc ar r\u016bku golda molai, pastum tuo\u013cuok p\u012bna kr\u016bzi,
  satausta radivi i n\u016bsp\u012b\u017e tre\u0161\u016b p\u016bdze\u0146u. Vokora
  raidejums var suokt\u012bs.\\nKod baba jau beja n\u016bmyruse, beidz\u016bt atsazynu
  mamai ar t\u0113ti, ka tei beju es, kas deve\u0146dasmytaj\u0101 god\u0101 izsyta
  durovuos caurumu. Beju atguojuse nu \u0161kolys, a baba ustob\u0101 \u2013 aizmyguse
  voi klausejuos kai parosti sovus raidejumus, nalaide manis \u012b\u0161k\u0101.
  Baba gon beja pi\u013cneigi okla, tok dzierd\u0113ja labi. Syt\u016bs pi v\u012bnom
  durovom, pi \u016btrom, pi l\u016bga. Nikuo. Kai iz So\u010dim voi Mienesi aizce\u013cuojuse.
  Baba gon zynuoja stuosteit, ka iz Miene\u0161a nikuo naas\u016bt k\u016b redz\u0113t,
  tik puteklis vi\u0146. A da Malnajai jiurai reiz jau jei beja aizakiuluse \u2013
  ar vysu naredzie\u0161onu i tim p\u012bcim vuordim, k\u016b prota kr\u012bvyski.\\nGol\u0101,
  kai spieru aiz dusmem pa durovom, \u2013 po\u0161a puorsabeidu. Zuoboks gondrei\u017e
  \u012bspryuda caurum\u0101. Izbuo\u017eu r\u016bku cauri i pacie\u013cu nu \u012b\u0161kpusis
  izlykt\u016b krampi. Baba pat laikam puoruok naizabrein\u0113ja, kod pie\u0161ki
  jau stuovieju ustobys vyd\u0101. Ko\u010d vyspuor jei b\u012b\u017ei sasabeida,
  ka kaids kluse\u0146om beja dasalaviejs kluotu. Tai i dzeivuojom puors d\u012bnu
  ar caurumu durovuos, cikom atbrauca t\u0113te. Kod jis vaicuoja, kai tai gadej\u012bs,
  es tik paraustieju placus. Par caurumu durovuos babai nivins nikod tai ari napastuosteja.\"",
  "\"Roksta autore: Digne \u016adre, LU LFMI Latv\u012b\u0161u folklorys kruotuve,
  zynuotniskuo asistente\\nKat\u016b\u013cticeibys simbols Latgol\u0101 \u2013 ce\u013cmolu
  krysti\\nLatgolys kulturainovys tipiskuokais i reiz\u0113 kat\u016blisk\u016b ide\u0146titati
  apl\u012bcynoj\u016b\u0161ais Latgolys kulturainovys elements ir ce\u013cmolu krysti
  aba uora krucifiksi. T\u012b atsar\u016bn breiv\u0101 dob\u0101 vysaiduos v\u012btuos:
  ce\u013cu moluos i krystce\u013c\u016bs, s\u0101d\u017eu centr\u016bs i pi v\u012bns\u0101tom,
  bazneicom i kops\u0101tom. Taipo\u0161 vysaids ir ari ce\u013cmolu krystu vizualais
  t\u0101ls, muokslin\u012bciskais i tehniskais izpi\u013cdejums \u2013 nu atsevi\u0161ku,
  breivi stov\u016b\u0161u k\u016bka krystu leidz krucifiksim, kas n\u016bv\u012btuoti
  n\u016bjum\u0113s, \u012b\u017e\u016bguoti ar siete\u0146u ci kolonnom i lob\u012bkuortuotu
  apleicej\u016b vidi.\\nCe\u013cmolu krysti skaitomi par sakraluos arhitekturys objektim,
  kur\u016bs apsav\u012bnuoju\u0161ys religiskuos muokslys vierteibys i tautys amatn\u012bceibys
  prasmis. T\u012b apl\u012bcynoj kat\u016blisk\u016b tradiceju funkcionie\u0161onu
  tautys vid\u0113 i atsp\u012bge\u013coj Latgolys specifiskuos tradicejis, kas veidoju\u0161uos
  viesturisku apstuok\u013cu i cylv\u0101ku mej\u012bdarbeib\u0101 i puormontuotys
  nu paaudzis paaudz\u0113.\\nKulturys montuojums ir cylv\u0101ka gareiguos darbeibys
  l\u012bceiba material\u0101 voi namaterial\u0101 form\u0101. Latgolys ce\u013cmolu
  krysti ir kulturys p\u012bminekli, kur\u016bs radzami sasateik materialais i namaterialais
  kulturys montuojums. Senejuok\u012b krucifiksi globoj vierteigys l\u012bceibys par
  Latgolys \u012bdzeivuotoju amatn\u012bceibys i k\u016bktieln\u012bceibys prasmem,
  bet ituo montuojuma namaterial\u012b aspekti atsakluoj arvi\u0146 praktizeitaj\u0101
  maja dz\u012bduojumu tradicej\u0101.\\nMaja dz\u012bduojumi\\nMaja dz\u012bduojumi
  aba maja breivdobys d\u012bvakolpuojumi ir tradiceja, kas p\u0101dej\u016bs god\u016bs
  \u012bmontoj arvi\u0146 leluoku atpazeistameibu na vi\u0146 Latgol\u0101, bet ari
  cytv\u012bt Latvej\u0101. Dz\u012bduojumi teik skaiteiti par Latgolai i Aug\u0161zemei
  rakstureigu tradiceju, bet dz\u012bduots pi krystim teik ari K\u016brzemis pus\u0113
  pi suitu i nu 2015. goda ari Reig\u0101, Latvejis Etnografiskaj\u0101 breivdobys
  muzej\u0101. Radio \u201cMarija\u201c translacejis dz\u012bduojumu klausei\u0161on\u016bs
  n\u016bdr\u016bsynoj ari t\u012b\u0161aj\u0101 eter\u0101.\\nK\u016bp\u0101 ar myru\u0161\u016bs
  oficeju Latgol\u0101 i Aug\u0161zem\u0113 maja dz\u012bduojumi ir \u012bk\u013cauti
  Latvejis kulturys kanon\u0101. Ituos tautys religejis praksis aizsuokumi Latgol\u0101
  meklejami 19. godu symta \u016btraj\u0101 pus\u0113. Maja miene\u0161a rituali par
  g\u016bdu jumprovai Marejai \u012btver sev\u012b vairuokus aspektus: religisku p\u012bredzi,
  muzykalu baudejumu i socializie\u0161on\u016bs v\u012btej\u0101 k\u016bp\u012bn\u0101.\\nLai
  ari pasaruoda ba\u017eys par tradiceju puormontuo\u0161onu jaunuok\u016bs paaud\u017eu
  vyd\u0101, tai p\u012bv\u0101rstuo namaterialuo kulturys montuojuma pietn\u012bku,
  kai ari oficialuos bazneicys viereiba i i\u0146terese aktualizej it\u016b vaicuojumu.
  Par lobu tradicejis dzeivuotspiejai l\u012bcynoj ari aizvi\u0146 nu jauna veiduot\u012b
  \u012bsvieteit\u012b ce\u013cmolu krysti.\\nIr \u012brosts ce\u013cmolu krystus
  apsav\u0113rt kai Latgolys kulturys montuojumu, vystik t\u016bs n\u016bzeime akcentejama
  ari Latvejis m\u0101r\u016bg\u0101. Kotrs Latvejis regions ar sovys kulturainovys
  sovdabeibu veidoj k\u016bpej\u016b Latvejis kulturys montuojumu. Par kulturys montuojuma
  aizsardzeibu, praktisku saglobuo\u0161onu i izpieti Latvej\u0101 ryupej\u0101s Va\u013csts
  kulturys p\u012bminek\u013cu aizsardzeibys inspekceja.\\nKulturys p\u012bminek\u013ca
  aizsardzeiba Latvej\u0101\\nEiropys Pad\u016bmis Vyspuorej\u0101 konvencej\u0101
  par kulturys montuojuma vierteibu sab\u012bdreibai (2005) kulturys montuojums teik
  defin\u0101ts kai uzkruotu resursu k\u016bpums, kas sajimts montuojum\u0101 nu paguotnis
  i kas naatkareigi nu p\u012bdereibys individa i sab\u012bdreibys uztver\u0113 teik
  skaiteits par vierteibu, puorl\u012bceibu, zynuo\u0161onu, tradiceju atsp\u012bge\u013cuotuoju
  i paudieju. Tys \u012btver ari vidi, kas izaveiduojuse cylv\u0101ku i v\u012btu
  mej\u012bdarbeib\u0101, laikam \u012bm\u016bt. Saska\u0146\u0101 ar itaidu montuojuma
  izpratni dorboj\u0101s Va\u013csts kulturys p\u012bminek\u013cu aizsardzeibys inspekceja
  (VKPAI). Tei struodoj sab\u012bdreibys i\u0146teres\u0113s \u2013 apzynoj, aizsorgoj
  i pietej kulturys montuojumu, \u2013 kab saglobuotu t\u016b nuoku\u0161om paaudzem
  kai n\u016bzeimeigu cylv\u0101ka dzeivis kvalitatis faktoru.\\nLai ari ideja par
  kulturys montuojuma aizsardzeibu ir senuoka, pamats kulturys p\u012bminek\u013cu
  t\u012bsiskajai aizsardzeibai tyka radeits 1923. god\u0101, p\u012bjem\u016bt lykumu
  par kulturys p\u012bminek\u013cu aizsardzeibu. Tym\u0101 po\u0161\u0101 god\u0101
  tyka izveiduota P\u012bminek\u013cu va\u013cde \u2013 pyrmuo speciali kulturys p\u012bminek\u013cu
  aizsardzeibai paredz\u0101tuo instituceja Latvej\u0101. Kab n\u016bdr\u016bsynuotu
  kulturys montuojumu aizsardzeibu, tyka izveiduots aizsorgojam\u016bs p\u012bminek\u013cu
  saroksts, pyrm\u016b obejektu tym\u0101 \u012bk\u013caun\u016bt 1924. god\u0101.\\nMysu
  d\u012bnuos VKPAI turpynoj veiduot kulturys p\u012bminek\u013cu uzskaitis sarokstu.
  Kotram objektam teik da\u0161kierts aizsardzeibys numers, \u012bdol\u016bt t\u016bs
  grupuos \u2013 v\u012btejuos voi va\u013csts n\u016bzeimis p\u012bmineklis. \u012adalejums
  teik veiduots ari pa tipim, izdol\u016bt arheologejis, arhitekturys, industrialuos
  pi\u013cs\u0101tbyuvn\u012bceibys, viesturis i viesturisk\u016bs n\u016btykumu v\u012btys
  p\u012bminek\u013cus.\\nIt\u016bbreid va\u013csts aizsorguojom\u016bs kulturys p\u012bminek\u013cu
  sarokst\u0101 \u012bk\u013cauti vaira kai 9000 objektu. Kulturys p\u012bminek\u013cu
  aizsardzeibu n\u016bdr\u016bsynoj VKPAI p\u012bcys regionaluos n\u016bdalis. Latgolys
  regiona n\u016bda\u013ca atsar\u016bn R\u0113zekn\u0113. VKPAI ir atv\u0101rta dialogam
  ar sab\u012bdreibu i tuos leidzadaleibu. \u012ar\u016bsynuojums par kaida objekta
  \u012bk\u013cau\u0161onu va\u013csts aizsorgojam\u016bs kulturys p\u012bminek\u013cu
  sarokst\u0101 var \u012bt nu sevkurys \u012bi\u0146teres\u0101tys personys.\\nAr
  n\u016b\u017e\u0101lu juop\u012bzeist, ka Latgolys ce\u013cmolu krysti ir puorstuov\u0101ti
  vi\u0146 ar treis objektim. 1998. god\u0101 va\u013csts aizsorgojam\u016bs kulturys
  p\u012bminek\u013cu sarokst\u0101 kai va\u013csts n\u016bzeimis arhitekturys p\u012bmineklis
  tyka \u012bk\u013cauts Leimani\u0161\u0137u krucifikss (Nr. 6131), kas atsar\u016bn
  R\u0113zeknis n\u016bvoda Ka\u0146tin\u012bku pogost\u0101. 2015. god\u0101 sarokst\u0101
  tyka \u012bk\u013cauti v\u0113\u013c diveji objekti kai v\u012btejuos n\u016bzeimis
  arhitekturys p\u012bminekli nu R\u0113zeknis n\u016bvoda Feima\u0146u pogosta \u2013
  Feima\u0146u krucifiksa n\u016bjume (Nr. 9091) i obelisks \u201cKrusta nes\u0113js\u201d
  (Nr. 9092). Feima\u0146u krucifikss ir lobs p\u012bm\u0101rs tam, cik byutiskys
  kriterijs kaida objekta \u012bk\u013cau\u0161onai va\u013csts aizsorgojam\u016bs
  p\u012bminek\u013cu sarokst\u0101 ir tuo aute\u0146tiskums. Va\u013csts aizsardzeib\u0101
  it\u016bbreid atsar\u016bn Feima\u0146u krufiksa n\u016bjume i obelisks, bet na
  pats Kristus t\u0101ls, part\u016b ka tuo originals 1990. god\u0101 aizstuots ar
  k\u016bktieln\u012bka Ontona Ranc\u0101na veiduotu dorbu. Kulturys p\u012bminek\u013cu
  saglobuo\u0161onys byuteiba ir tuo pastuovei\u0161onys paildzynuo\u0161ona aute\u0146tisk\u0101,
  namaineit\u0101 veid\u016bl\u0101, piec \u012bspiejis vairuok sagoloboj\u016bt nu
  tuo originaluos substa\u0146cis. V\u012bns nu apdraudejumu kulturys p\u012bmineklim
  var byut nakvalitativi renovacejis dorbi. Senejuok\u012b k\u016bktieln\u012bceibys
  dorbi prosa eipa\u0161ys prasmis i zynuo\u0161onys. De\u013ctam VKPAI aizdavums,
  sasadorboj\u016bt ar kulturys p\u012bminek\u013cu eipa\u0161n\u012bkim, ir veicynuot
  iz tradicejom ba\u013csteitu meto\u017eu, materialu i \u012bma\u0146u izmontuo\u0161onu,
  apzynoj\u016bt \u012bspiejis tuos l\u012btuot myusu d\u012bnuos.\\nKurpin\u012bku
  krucifikss ce\u013c\u0101 iz \u012bk\u013cau\u0161onu aizsorgojum\u016bs kulturys
  p\u012bminek\u013cu sarokst\u0101\\nKulturys montuojums Latvej\u0101 ir daudz pla\u0161uoks
  nakai sarokst\u0101 \u012bk\u013cautais, i dorbs pi tuo apzynuo\u0161onys namiteigi
  turpynoj\u0101s. Ituo goda jun\u012b VKPAI ir suokta dorbu n\u016brise, kab va\u013csts
  aizsorgojam\u016bs kulturys p\u012bminek\u013cu sarokst\u0101 tyktu \u012bk\u013cauts
  Kurpin\u012bku krucifikss ar n\u016bjumi, kas atsar\u016bn R\u0113zeknis n\u016bvoda
  Rykovys pogosta Kurpin\u012bk\u016bs.\\nKurpin\u012bku krucifikss sovu atpazeistameibu
  \u012bmontuojs vairuoku \u012bmaslu de\u013c. Vysupyrms jau ar tuo vizual\u016b
  t\u0101lu \u2013 krysta n\u016bjume ar boltom kolonnom skaisti \u012bsak\u013caun
  apleicej\u0101 lauku ainov\u0101, veidoj\u016bt domina\u0146ti, kas pamonoma jau
  nu attuoluma. P\u012bminie\u0161onys v\u0101rts ir ari fakts, ka pi ituo krucifiksa
  fi\u013cmeitys ainys nu Juo\u0146a Strei\u010da 1991. god\u0101 uzjimtuos kinys
  \u201cCilv\u0113ka b\u0113rns\u201d. Kina veiduota piec Juo\u0146a Kl\u012bdz\u0113ja
  taida po\u0161a n\u016bsaukuma romana motivu, i \u012bspiejams, ka ituo ce\u013cmolys
  krysta izviele nav bejuse najau\u0161a, part\u016b ka k\u016bk\u0101 veiduotais
  Kristus t\u0101ls sovulaik as\u016bt atsarads Juo\u0146a Kl\u012bdz\u0113ja dzeda
  Donata Kl\u012bdz\u0113ja s\u0101tys pogolm\u0101. Pla\u0161uokys zinis par Kurpin\u012bku
  krucifiksu sov\u0101 gruomot\u0101 \u201cKok\u0101 cirst\u0101s cie\u0161anas. Krucifiksi
  Latgales ainav\u0101\u201d sn\u0113dzs k\u016bktieln\u012bks Ontons Ranc\u0101ns.\\nKurpin\u012bku
  krucifiksa ansambli veidoj bolti kruosuota myura n\u016bjumeite ar skuorda jumtu.
  Storp n\u016bjumis kolonnom \u012breikuots k\u016bka n\u016b\u017e\u016bguojums
  ar vuortenim. N\u016bjumis vyd\u0101 n\u016bv\u012btuots masivs \u016bzulk\u016bka
  krysts, kura gol\u016bs atsar\u016bn virpuotys k\u016bka l\u016bdis. Krystam p\u012bstyprynuots
  1898. god\u0101 veiduots Kristus t\u0101ls nu k\u016bka. Pi n\u016bjumis aizmugurejuos
  s\u012bnys pa kreisi atsar\u016bn Kristus, pa labi \u2013 Jumprovys Marejis sv\u0101tbi\u013cde.
  \u012ak\u0161pus\u0113 nalels ga\u013cde\u0146\u0161 i s\u016ble\u0146\u0161. Krucifiksa
  apleic\u012bne ir lab\u012bkuortuota i sak\u016bpta, \u012bk\u0161telpa r\u016btuota
  ar muoksleigim z\u012bdim. Nu k\u016bka veiduotais Kristus t\u0101ls ir uzskotoms
  p\u012bm\u0101rs tautys amatn\u012bceibys prasmem, lob\u012bkuortuotuo n\u016bjume
  l\u012bcynoj par tradicejis dzeivuotspieju i aktualitati ari myusu d\u012bnuos,
  bet k\u016bpejais ce\u013cmolys krysta ansamblis demonstrej kristeig\u016bs tradiceju
  funkcionie\u0161onu taut\u0101 Latgolai rakstureig\u0101 veid\u0101.\\nOntons Ranc\u0101ns
  n\u016bruoda, ka leidz ar Latvejis Tre\u0161uos atm\u016bdys laiku Kurpin\u012bku
  krucifiksa n\u016bjumeiti sak\u016bps i atjaunuojs natuoli dzeivoj\u016b\u0161ais
  zemn\u012bks Osvalds Salmanis. Itys p\u012bm\u0101rs apl\u012bcynoj kulturys montuojuma
  vierteibu.\\nKulturys p\u012bminek\u013cu aizsardzeibys sistemai ir juokolpoj cylv\u0101kim
  i sab\u012bdreibai, tei nav radeita, lai \u012br\u016bbe\u017euotu. Vystik juon\u016bruoda,
  ka kulturys p\u012bminek\u013cu statuss var byut zynoms apgryutynuojums tuo eipa\u0161n\u012bkim.
  Nare\u0161i kulturys p\u012bminekli \u012btver na vi\u0146 po\u0161u objektu, bet
  ari vidi ap t\u016b. P\u012bmineklim juobyun n\u016bdr\u016bsynuotai publiskai p\u012bejameibai
  i natrauc\u0101tai vizualai apskatei, de\u013ctam kotram nu tim teik n\u016bteikta
  aizsardzeibys zona. Tai teik n\u016bdr\u016bsynuota pasorguo\u0161ona nu naatbylst\u016b\u0161ys
  apbyuvis voi cytom p\u012bminekli degradej\u016b\u0161om darbeibom tuo tyvuokaj\u0101
  apleic\u012bn\u0113. Kulturys p\u012bminek\u013cu saglobuo\u0161onai juobyun saisteitai
  ar cylv\u0101ka dzeivis kvalitatis ce\u013c\u0161onu, i par p\u012bminekli juop\u012bzeist
  taidi objekti, kuri ir n\u016bzeimeigi sab\u012bdreibys ac\u012bs. Nav \u0161aubu,
  ka Latgolys ce\u013cmolys krysti taidi ir.\\nNa tikai Kurpin\u012bku krucifiksa,
  bet ari daudzu cytu Latgolys ce\u013cmolu krystu \u012bk\u013cau\u0161ana va\u013csts
  aizsorgojam\u016bs kulturys p\u012bminek\u013cu sarokst\u0101 ir pamats kulturviesturisku
  vierteibu saglobuo\u0161onai ilgterme\u0146\u0101. Va\u013csts aizsorgojamuo kulturys
  p\u012bminek\u013ca statusa p\u012b\u0161kier\u0161ona ir ituo objekta vierteibys
  manifestaceja, kas reiz\u0113 ar tradicejis funkcionie\u0161onu i atteisteibu t\u016bm\u0101r
  n\u016bdr\u016bsynoj sovys poguotnis sasn\u0101gumu g\u016bdynuo\u0161onu. Latgolys
  ce\u013cmolu krysti ir da\u013ca nu k\u016bpejuo Latvejis kulturys montuojuma. Itys
  montuojums ir myusu atbi\u013cdeiba, myusu aizdavums ir t\u016b saglobuot i n\u016bd\u016bt
  l\u012btuo\u0161on\u0101 nuoku\u0161om paaudzem.\\nKartenis: Kurpin\u012bku krucifikss,
  D. \u016adre\\nKomentari sl\u0101gti.\"", "\"R\u0113zekn\u0113 dzejiskys sarunys
