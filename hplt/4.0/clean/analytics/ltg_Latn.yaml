  kai ciersti\\npazeilei\u0161u\\ntev reitu byus laime\\n\u012bt saule iz pu\u0161d\u012bnis
  laiku\\nvieja apraut\u016bs dabas\u016bs grymst\\nreitu s\u016bl\u0113ja sut\u016bni,
  p\u0101rkiu\u0146a leitu i zibsni\\nreitu myusu vaira te nabyus\\nauto\u016bsta\\n\u013cauds
  sasastuoj, n\u016bsastuoj, skr\u012bn\\ntreisdesmit cat\u016brtais, treisdesmit
  p\u012bktais. sastais. septeitais. symtais\\nkurs v\u0113\u013c ar biletu?\\ns\u0101dv\u012btu
  nav! dabuosit stuov\u0113t\\npar \u0161a\u013cti jiusu ite vairs nabyus\\na nazkam
  te vysa dzeive\\nauto\u016bsta\\niz garmanis spielej vecs sierms i ar v\u012bnu
  kuoju\\ndasyt ritmu. golvu dam\u012bdz pi garmanis suonu\\njis varbyut t\u016b garmani
  atvede leidza\\npsrs\\nmes pasauli jaunu sev ce\u013csim\\nmes \u012bsuoksim jaunu
  dzeivi\\njam reitu byus septe\u0146desmit\\njis ite jau se\u0161desmit godu\\niz
  asvalta bol\u016b\u017eu m\u0101sli i spolvys\\nasnis iz s\u012bnys\\niztr\u012bpti
  a\u0161\u0146a i nuovis roksti\\nak jau pa nakti kaids kuov\u012bs\\nak jau ka izdzeivuoja.
  ak jau ite nu tierga\\nmelodeja\\n\u010deikst vaca kai \u017eyda roti\\nnu ve\u010da
  garmanis \u0161keibuos\\njam reitu byus septe\u0146desmit\\njis ite jau vysu dzeivi\\n2006.
  goda septembr\u012b\"", "\"Anotaceja\\nS\u0101bru regionu kulturys i izgleiteibys
  institucejis R\u0113zekn\u0113, Grod\u0146\u0101 i K\u0113dai\u0146\u016bs ir boguotys
  ar unikalu material\u016b i namaterial\u016b montuojumu, kas preze\u0146tej na vi\u0146
  sovys lokaluos, tok ari k\u016bpejuos vierteibys kulturvid\u0113.\\nProjekta rezultat\u0101
  \u012bcar\u0101ts izveidot inovativu kulturizgleiteibys i turisma produktu ar apv\u012bnuotu
  datu bazi \u2013 virtual\u016b muzeju, kas myusu d\u012bnom atbylst\u016b\u0161i
  i atraktivi paruoda da \u0161uo saleidzyn\u016b\u0161i statisk\u016b kulturviesturisk\u016b
  montuojumu i juo interpretaceju. Ar jaunuok\u016bs tehnologeju paleidzeibu izveiduots
  interaktivs, vysaidys leidza dorbuo\u0161onuos p\u012bduovoj\u016b\u0161s, jaunuokuos
  paaudzis interesem atbylst\u016b\u0161s, potencial\u016bs turistus aicynoj\u016b\u0161s
  i v\u012bgli l\u012btojams virtualais muzejs n\u016bdr\u016bsynuos internacionaluos
  datu bazis sasn\u0101dzameibu sab\u012bdreibai na vi\u0146 puorr\u016bbe\u017eu
  region\u016bs, a vys\u0101 \u0161k\u0101rsteikla vid\u0113.\\nVirtualuo muzeja izstruodis
  \u012btum\u0101 paradz\u0101ts reikuot konfere\u0146cis, izgleitoj\u016b\u0161us
  i p\u012bredzis apmainis seminarus, tradicionaluos kulturys pasuokumus sadarbeibys
  partneru region\u016bs. Apm\u0101ram 1600 unikalu \u0161kierk\u013cu i artefaktu
  aproksti i daudzpuseigs pasn\u012bg\u0161onys veids nu R\u0113zeknis Augst\u0161kolys,
  Latgolys Kulturviesturis muzeja, Maksima Bagdanovi\u010da muzeja (Grod\u0146a),
  K\u0113dai\u0146u Regionaluo muzeja datu bazem byus virtualuo muzeja pamats, k\u016b
  byut\u012bn\u0113 paradz\u0101ts papyldynuot i ar \u012bsaisteit\u016bs \u012bstuo\u017eu
  kulturviesturiskajom boguoteibom, i \u012bsaist\u016bt jaunus partnerus nu s\u0101bru
  regionu, tai n\u016bdr\u016bsynoj\u016bt kulturviesturisk\u016bs vierteibu sasn\u0101dzameibu,
  puormontuojameibu i izviertej\u016bt l\u012btuotuoju sn\u0101gt\u016bs komentarus.\\nProjekta
  mierkis\\nPamatmierkis \u2013 n\u016bdr\u016b\u0161ynuot materialuo i namaterialuo
  kulturys montuojuma vierteibu sasn\u0101dzameibu sab\u012bdreibai, izveidoj\u016bt
  virtual\u016b muzeju i papla\u0161ynoj\u016bt puorr\u016bbe\u017eu p\u012bredzis
  apmai\u0146u kulturizgleiteibys j\u016bm\u0101.\\nPamataizdavums \u2013 veiduot
  virtualu ekspoziceju, sasaist\u016bt pietn\u012bcysk\u016b i muzeju darbeibys praktisk\u016b
  p\u012bredzi, paruod\u016bt kulturviesturiskuos saiknis treju s\u0101bru va\u013cstu
  pi\u013cs\u0101tu storp\u0101 \u2013 Grod\u0146a, R\u0113zekne, K\u0113daini.\\nRezultati\\nGaidom\u012b
  rezultati:\\n- moderniz\u0101tys muzeja kruojuma saglobuo\u0161onys \u012bspiejis
  i pasalelynuojuse juo da\u012bmameiba sab\u012bdreibai\\n- spieceiguoka sadarbeiba
  pietn\u012bcyskaj\u0101, izgleitoj\u016b\u0161aj\u0101 i komunikacejis j\u016bm\u0101
  \u012bsaisteit\u016bs regionu kulturizgleiteib\u0101\\n- palelynuots pyrmreizej\u016bs
  muzeja apmakl\u0101tuoju skaits kotr\u0101 nu sadarbeibys partneru muzeju, eipa\u0161i
  jaun\u012b\u0161u auditoreja\\n- sataiseits inovativs kulturizgleitoj\u016b\u0161s
  turisma produkts \u2013 publiski da\u012bmams interaktivs virtualais muzejs\\n-
  \u012bspieja studej\u016b\u0161ajim i pietn\u012bkim izmontuot datu bazis pietn\u012bcyskajom
  vajadzeibom\\n- muzeja praksis i kulturizgleiteibys \u012bspiejis partneru teritorejuos\\nFaktisk\u012b
  rezultati:\\n\u2013 4 kulturys i izgleiteibys \u012bstuo\u017eu sataiseits virtualais
  muzejs ar 4 galerejom: \u201eLatgolys koncepti\u201d, \u201eLatgolys keramika\u201d,
  \u201eSenej\u012b omoti K\u0113dai\u0146\u016bs\u201d, \u201eGrodnis regiona literatura\u201d\\n\u2013
  3 muzeju \u012bsapazei\u0161onys videosi\u017eeti\\n\u2013 4 tradicionaluos kulturys
  pasuokumi kotr\u0101 nu daleibva\u013cstu: Latgolys P\u016bdn\u012bku d\u012bnys
  R\u0113zekn\u0113, Folklorys i omotu \u012bpazei\u0161ona K\u0113dai\u0146\u016bs,
  Multikulturaluos literaruos tradicejis Grod\u0146\u0101, literari muzykalais Andreja
  d\u012bnys pasuokums R\u0113zekn\u0113\\n\u2013 3 izgleitoj\u016b\u0161i seminari,
  pa v\u012bnam kotr\u0101 no daleibva\u013cstu\\n\u2013 p\u012bredzis apmainis brauc\u012bni,
  apsazynoj\u016bt kotra partnera kulturizgleitoj\u016b\u0161uos darbeibys specifiku\\n\u2013
  n\u016bsl\u0101guma konfere\u0146ce \u2013 projekta dorba produktu i pietejumu prezentacejis\\n\u2013
  k\u016bpeja projekta simbolika prezentacejis pr\u012b\u0161kmat\u016bs\\n\u2013
  renov\u0101tys muzeju telpys i jauns tehniskais apreikuojums\\nPasuokumi\\n2014.
