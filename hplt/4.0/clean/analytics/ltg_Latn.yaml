  paredz\u0113ts, ka no 1.maija pa\u0161reiz\u0113jais tarifs 81,13 EUR/MWh saruks
  l\u012bdz 65,86 EUR/MWh.\\nApspriest\\nAptauja\\nP\u0113c k\u0101diem krit\u0113rijiem
  J\u016bs izv\u0113laties produktus?\\nJaun\u0101kie koment\u0101ri:\\nKapusv\u0113tki
  Daugavpils novada draud\u017eu kaps\u0113t\u0101s\\nDaugavpil\u012b pieauga simtgadnieku
  skaits\\nTam minusotajam padoms.ja juns nepatik neviens mans komentars tak ludzu
  nelasiet.tak nav spiesta lieta.ir tak citi portali ko lasit.es personigi konentarus
  helasu vairs neviena portaaa..man tie neinteresee... S\u012bk\u0101k...\\nIepaz\u012bsti
  Daugavpili aizraujo\u0161\u0101 ekskursij\u0101 bez maksas\\nManai draudzenei berniba
  pagaja latgalee...ar kadu interesi es klausos vinas stastos..vina pec tehnikuma
  beigsanas tija nosuutita uz zemgali darbaa tur aprevcejas..bet lai kur cilveks hedzivotu
  latgaluesu sirsniba izpaludziba un krietnums nepazud. diakekts un latgaluesu daba
  .vinai tur ir zemes ipasums bet majas vairs nav un cilveki viens no otra dzivo vairaku
  km attalumaa..vina aizbrauc pue radiem uz kapusvetkiem..tie tur cienaa.apbrinoju
  tos cilvekus kuri apciemo savu dzimto novadu un vietu..to hedrikst sirdii pazaudet..jo
  tad tu pazaudee pats sevi. S\u012bk\u0101k...\"", "\"Ligita Spridz\u0101ne\\nLigita
  Spridz\u0101ne dzymuse 1979.goda 6.mart\u0101 Juo\u0146a i Leont\u012bnes Spridz\u0101nu
  kuplej\u0101 5 b\u0101rnu saimie. Ligita ir videjuo nu muosuom, kuo ari jai ir diveji
  vacuoki bruo\u013ci. Ligita pate ar\u012b ir p\u012bcu b\u0101rnu mamma. Mamma divejuom
  meituom i treis d\u0101l\u012bm.\\nVyd\u0161kolas izgl\u012bteibu \u012bguvuse Rekavas
  vyd\u0161kol\u0101. Pyrmuo r\u016bkdorbu \u0161koluotuoja beja Ausma Ivanova, kas
  \u0161kol\u0101 muoceja iz\u0161yut, adiet, tamburiet, kuo ari \u012bmuoceja t\u016b,
  ka sas\u012btu mazglu ai lylu pac\u012bteibu i m\u012bru var atbreivuot i dabuot
  valie, kuo ari t\u016b, ka mazgli s\u012bnuos dorb\u0101 kuram byus p\u012bkri\u0161ona.
  Pyrmuos au\u0161onas \u012bma\u0146as pamat\u0161kolas p\u016bsm\u0101 \u012bgiva
  nu Domicellas Buk\u0161as, kas vadeja au\u0161onas pulcini, kur tyka n\u016bausta
  ar irisa i k\u016bkvylnas d\u012bg\u012bm kruosaina golda sedzine. Vyd\u0161kol\u0101
  Ligita \u012bzamuoceja pie Anitas \u0160akinas (t\u0101din Pu\u017eules) ari \u0161yviejas
  profesiju i sa\u0146ieme sovu pyrm\u016b \u0161yviejas kvalifikaceju. Muoc\u016bt\u012bs
  \u0161yut Ligita saprota, ka \u012bceres, kas ir tov\u0101 golv\u0101 tu vari eistynuot
  pats, tuod\u0101 veid\u0101 tikt pi jauna \u0161muka un eipo\u0161a apgierba. Vyd\u0161kolas
  laik\u0101 tyka sa\u0161yuti \u017eetonu vokaram kostims i vyd\u0161kolas izlaiduma
  t\u0101rps i pat sa\u0161yuts miete\u013cs izmontoj\u016bt sovas babas Em\u012blijas
  Lo\u010dmeles mieteli i lylu r\u016btain\u016b lokatu.\\nPiec vyd\u0161kolas beig\u0161onas
  \u012bzastuoja Latvejas Sporta Pedagogejas akademij\u0101 sliepo\u0161onas katedr\u0101,
  kur izavieleja muociet\u012bs t\u016brismu. T\u012b jei \u012bgiva interesantu p\u012bredzi
  n\u016bmet\u0146u organizie\u0161on\u0101. L\u012b\u010dupie k\u016bp\u0101 ai pasniedzeju
  Arnoldu Br\u016bveru LSPA studenti organizeja da\u017euodas tematiskas n\u016bmetnes
  b\u0101rnim. Itei p\u012bredze c\u012b\u0161i labi n\u016bder ari Ligitas t\u0101dinej\u0101
  dorb\u0101 struodoj\u016bt Namaterialuos kulturas montojuma centr\u0101 \u201cUp\u012bte\u201d
  organizej\u016bt d\u012bnas i nakts tras\u012btes i uznam\u016bt gostus i t\u016bristus,
  kas brauc iz Up\u012bti \u012bzapazeit ai Up\u012btes kulturtelpu i aktivitatiem,
  kas veidoj Up\u012btes vidi. LSPA napabeidz\u016bt, Ligita \u012bzastuoja LU PPF
  (Latvejas Universitates pedagogejas i psihologejas fakultatie) i \u012bgiust muojtur\u012bbas,
  muojsaimn\u012bc\u012bbas i kulturas viestures \u0161koluotoja kvalifikaceju. LU
  au\u0161onas prasmes tyka papyldynuotas pi pasniedzejas Daces Pud\u0101nes. Kuo
  diplomdorbu temu izavieleja izpietiet celai\u0146u au\u0161onas viesturi i tradicejas
  Z\u012bme\u013clatgalie (\u201cDzimt\u0101 Zieme\u013clatgales novada au\u0161anas
  trad\u012bciju izp\u0113te un jostu au\u0161anas tehnikas apguve 8.klas\u0113 m\u0101jtur\u012bb\u0101,
  m\u0101jsaimniec\u012bb\u0101 un tehnolo\u0123ij\u0101s\u201d, 2007.god\u0101 pi
  diplomdorba vadietojas M\u0101r\u012btes Kokinas Lilo) Interesanti tys, ka pa temas
  izpietes laiku pi Ligitas n\u016bnuok kaimi\u0146\u016bs dzeivoju\u0161uos Marijas
  Buk\u0161as (17.06.1917.-19.08.2011.) au\u017eom\u012b stuovi, kur moza byudama,
  draudzej\u016bt\u012bs ai Marijas mozmeituom beja redziejuse, kuo Marija au\u017e.
  Jei beja moza auguma s\u012bve\u0146a, kas sov\u0101 au\u017eom\u016b stuovu ustob\u0101
  siedeja sov\u016bs au\u017eamej\u016bs stuov\u016bs, kuo princese tron\u0101, i,
  b\u0101rnim apleik \u010daloj\u016bt, auda greidcele\u0146us. Tym\u0101 vosor\u0101
  pi Ligitas montojum\u0101 n\u016bnuoca ari Bierzpils babas Hel\u0113nas Spridz\u0101nes
  (1910-2000) au\u017eom\u012b stuovi, kuo ari izkuop\u016bt muojas aug\u0161\u0101
  tyka atrosti ari \u016btras \u0160kilbanu babas Em\u012blijas Lo\u010dmeles (1910-1991)
  au\u017eom\u012b stuovi.\\nRokst\u016bt sovu diplomdorbu, prakses v\u012bta Ligitai
  beja Rekavas vyd\u0161kola, kur ar 5 burveiguom 8.klases meitu\u0161kuom brauca
  muoc\u012bbu ekskursej\u0101 iz An\u010dipovu pi Hel\u0113nas \u0160akinas iz celu
  j\u016bstu au\u0161onas meistarklasi. Aust cel\u016bs Hel\u0113na \u012bzamuocejuse
  pi sovas veira muotes. Hel\u0113nas austuos celu j\u016bstas c\u012b\u0161i pla\u0161i
  pazeist Up\u012btes kult\u016brtelp\u0101, j\u016b gondrei\u017e kotram Up\u012btes
  folkloristam ir Hel\u0113nas duovynuotuo j\u016bsta.\\nTod 2009. godie vareja suokt\u012bs
  lyl\u012bs ste\u013clu iznuoc\u012bns. P\u012bsaist\u016bt projektu, tyka sarunuota
  Iveta Gabr\u0101ne, kas \u012bruodeja Up\u012btes puses aust grib\u0101toj\u012bm
  gon auduma uzme\u0161onas, gon \u012bvilk\u0161onas, gon neitie\u0161onas, gon bierd\u0101
  sakuortuo\u0161onas i au\u0161onas pamatus. Up\u012btes tautas noms puorzavierte
  par au\u0161onas muoju. V\u012bnubreid au\u0161onas dorbi n\u016btyka pat 5 au\u017eamej\u016bs
  stuov\u016bs. Iz skatuves tyka \u012bkuortuoti matam\u012b stuovi. Pr\u012bk\u0161
  Up\u012btes tys beja kaut kas nabejs. Tod Ligita p\u012bnieme izaicynojumu p\u012bzadaliet
  \u201cSatiec savu meistaru\u201d ai lynu dv\u012b\u013cu au\u0161onas meistarklasiem
  Up\u012bt\u0113. N\u016btyka Andra Sli\u0161\u0101na Ze\u013c\u010du babas Hel\u0113nas
  Vizules aust\u016b lynu dv\u012b\u013cu izpiete i vareja suokt\u012bs au\u0161onas
  dorbi. Up\u012btie Ligitas vadeib\u0101 tyka austi ari vylnas lokati.\\nLigitai
  pateik ari adiet. Vyd\u0161kolas laik\u0101 adieti puorsvor\u0101 tyka d\u017eemperi.
  Kod b\u0101rni beja mozuoki tyka adietas ze\u010des. Adiet\u016b cymdu lyluok\u012bs
  izaicynojums beja Latvejas symtgades god\u0101, kod tyka n\u016badieti rokstain\u012b
  cymdi sov\u012bm mozuokej\u012bm b\u0101rn\u012bm, kur mozajai meitai Hel\u0113nai
  jei n\u016badeja piec atmi\u0146as sovas Bierzpils babas Hel\u0113nas adiet\u016b
  cymdu rokstu, k\u016b baba beja adejuse jai. Kod cymdi palyka mozi babas cymdu roksts
  nabeja izguojs nu golvas, tod Ligita suoka mekliet, voi roksts cymdam ir tuods,
  kuods ir Ligitai palics atmi\u0146\u0101. Nu babas adejumu klades tyka atsyutieti
  da\u017ei roksti, kuru storp\u0101, par lylu breinumu jai, \u012braudzeja t\u012b\u0161i
  t\u016b rokstu, kas jai beja palics atmi\u0146\u0101. Tyka izadieti vie\u013c v\u012bni
  cymdi leidz\u012bguos kruosuos, kuodas beja palyku\u0161as Ligitas atmi\u0146uos.
  Leidz\u012bg\u0101 rokst\u0101 ir izadeits vie\u013c v\u012bns lyluoks cymdu puors,
  k\u016b Ligita nosoj pate.\\nT\u0101din ik godi t\u016bp vie\u013c kuods cymdu puors,
  kas atr\u016bnams Mirdzas Slavas gruomat\u0101 \u201cLatvie\u0161u rakstainie cimdi\u201d.
  Ligitai ir apsa\u0146iemuse n\u016badiet vusus 20 cimdu rokstus, kas ir itam\u0101
  gruomat\u0101, kas ir nuoku\u0161i nu Bierzpils puses, kuo sovas babas Hel\u0113nas
  p\u012bmi\u0146ai. Itam\u0101 gruomat\u0101 k\u016bp\u0101 ir 38 cimdu roksti, kas
  nuok nu Bolvu n\u016bvoda. Vie\u013c v\u012bns lyls Ligitas adie\u0161onas izaicyonojums
  ir adietas jakas, kuru adie\u0161onai Ligitu \u012bdvesmuojuse Annele Sli\u0161\u0101ne.
  Nu Anneles Ligita ir \u012bzamuocejuse ari mazgluot \u0161mukas, kruosainas r\u016bkasspr\u0101dzes.\\nNu
  2002. goda vie\u013c v\u012bna lyla aizarau\u0161ona ir solmu pynumi. Lyluok\u012bs
  dorbs, kas n\u016bpeits ir rudzu solmu capure, k\u016b nosova Ontons Sli\u0161\u0101ns.
  Capure t\u0101din atsar\u016bn Ontona Sli\u0161\u0101na Up\u012btes kulturviestures
  muzeja kruojum\u0101.\\nKovid pandemijas laiks iedvesmova izpietiet vei\u017eu pei\u0161onas
  tehniku, kuod\u0101 ir peitas l\u012bpu l\u016bku veizes Up\u012btes pusie. Ligita
  soka, ka tei ari ir c\u012b\u0161i interesanta i aizrauj\u016b\u0161a n\u016bdarbe.
  Ite jei vie\u013c ir eksperimentie\u0161onas un att\u012bsteibas celie.\\n2020.goda
  janvarie \u012bzaguodova Toika digital\u016bs 24 nei\u0161u kuortu au\u017eom\u016bs
  stuovus. Te Ligita \u012bzapazyna ar Ilzi Mail\u012bti, kas beja atbraukuse iz Up\u012bti,
  lai salyktu kup\u0101 au\u017eom\u016b stuovu konstrukciju.\\n2022.god\u0101 beja
  \u012bzastuojuse au\u0161onas kr\u012bze. Lai tyktu nu tuos valie, Ligita brauca
  pi Ilzes Mail\u012btes iz \u0112rg\u013c\u012bm i t\u012b pavadeja 10 pylnas d\u012bnas
  au\u0161onas apmuoc\u012bbuos. Piec muoc\u012bbuom \u0112rg\u013c\u016bs, Ligita
  \u012bsuoka dorbu pi r\u016b\u017eu rokstu au\u0161onas, k\u016b \u012bdvesmova
  veira babas Hel\u0113nas Vizules aust\u012b r\u016b\u017eu de\u010di. Ligitas rod\u016b\u0161\u012bs
  r\u016b\u017eu lidojums beja pleds, piec tam tyka n\u016bausts, piec d\u0101la J\u0113kaba
  skices, aust\u012bs r\u016b\u017eu de\u010ds.\\nVusus it\u016bs godus Ligita Up\u012bt\u0113
  popularizei Z\u012bme\u013clatgales celai\u0146u au\u0161onu.\\nIz Up\u012bti, p\u012bzadaliet
  meistarklasies, brauc \u0161kol\u0101ni i aust muociet\u012bs gryb\u0101tuoji nu
  da\u017euoduom Latvejas v\u012btuom kuo ari nu uorzemiem. Suok\u016bt nu 2008.goda
  ir realizieti vairuoki projekti, kuru \u012btvar\u016bs interesent\u012bm ir muocieta
  Z\u012bme\u013clatgales celai\u0146u au\u0161ona. Ligita ir p\u012bzadalejuse \u201cSatiec
  savu meistaru\u201d, kura \u012btvor\u016bs ari uz Up\u012bti brauca cilv\u0101ki,
  kas gribieja \u012bzamuociet\u012bs aust j\u016bstas. Da\u017euodu projektu \u012btvar\u016bs
  ir tapu\u0161as j\u016bstas i celain\u012btes, ar kuruom n\u016bs\u012bt me\u017egi\u0146u
  ze\u010des, k\u016b valk pi sova tautas t\u0101rpa: folkloras k\u016bpas \u201cUp\u012bte\u201d
  dal\u012bbn\u012bki, Up\u012btes b\u0101rnu folkloras k\u016bpas dal\u012bbn\u012bki,
  Vi\u013cakas jaun\u012b\u0161u deju kolektiva meitenes. Ir pat bejs tuods \u201cv\u012bnas
  d\u012bnas maratons\u201d, kod vienas d\u012bnas garum\u0101 cel\u016bs au\u0161onas
  meistarklases t\u012bk n\u016bvad\u0101tas \u010detruom Vi\u013cakas n\u016bvoda
  \u0161koluom ar gondrei\u017e 200 dal\u012bbn\u012bk\u012bm (Rekavas vyd\u0161kol\u0101,
  Vidu\u010du pamat\u0161kol\u0101, Vi\u013cakas pamat\u0161kol\u0101 i \u017d\u012bguru
  pamat\u0161kol\u0101, 2019. goda n\u016bgalie.)\\nPi Ligitas iz celu au\u0161onas
  apmuoc\u012bbuom ari ir bejuse Evita Zaremba Kr\u012bgere, kas t\u0101din pate au\u017e
  da\u017euodas j\u016bsti\u0146as i ir izpietejuse i n\u016bauduse Vi\u013cakas i
  \u0160\u0137ilb\u0101nu puses celaines nu Latvejas Viestures muzeja kruojumu paraug\u012bm.\\nLigita
  ir auduse celaines cilv\u0101k\u012bm svareig\u012bm dzeives gadejum\u012bm kuo
  kuozas, krustabas voi krist\u012bbas.\\nLigitas veira muote Ir\u0113na Sli\u0161\u0101ne
  Up\u012btes pamat\u0161kolas b\u0101rnu folkloras k\u016bpas daleibn\u012bk\u012bm
  muoceja aust celu dekorus kuo virpu\u013cus, kur kuo audus \u012bauda smylgas voi
  smolkus salmi\u0146us. Ituodus celu dekorus t\u0101din ari muoca aust Ligita gost\u012bm,
  kas brauc iz Ontona Sli\u0161\u0101na Up\u012btes kulturviestures muzeju i p\u012bzadolas
  muzeja pedagogiskejuos programmuos.\\n\u201cKotrs dzeivie satykt\u012bs cylv\u0101ks
  ir viert\u012bba, kas ir atstuojuse da\u017euodus rokstus mun\u0101 personeibas
  veiduo\u0161on\u0101, kas turpyna veiduot munu dzeives musturu\u201d, tuo soka Ligita
  Spridz\u0101ne.\\nRoksts \u012bv\u012btuots 2022. goda decembrie\"", "\"R\u0113zekn\u0113
  atba\u013csteiti 9 moz\u012b kulturys i turisma projekti\\nN\u016bsasliedzs po\u0161va\u013cdeibys
  agenturys \u201cR\u0113zeknes Kult\u016bras un T\u016brisma centrs\u201d organiz\u0101tais
  kasgadejais Moz\u016bs kulturys i turisma projektu konkurss. Agenturys puorstuove
  Maija Upeniece informej, ka atba\u013csteiti deveni projekti i k\u016bp\u0101 p\u012b\u0161kierts
  finansiejums 7200 eiro apm\u0101r\u0101.\\nIt\u016bgod projektu konkurs\u0101 beja
  \u012bsn\u012bgti 16 projekti. Jem\u016bt v\u0101r\u0101 projektu izstruodis kvalitati
  i atbi\u013csteibu n\u016blykumam, ilgtspiejis pamatuojumu i ituogods izvierzeituos
  prioritatis atsp\u012bge\u013cuojumu \u2013 aktivys atpyutys vareibu palelynuo\u0161ona
  R\u0113zeknis pi\u013cs\u0101t\u0101 -, Kulturys komiseja n\u016bl\u0113me atba\u013csteit
  deve\u0146us projektus.\\nAtba\u013csteit\u012b projekti:\\n- Latgolys Kulturys
  centra izdevn\u012bceibys projekts \u201cLiterat\u016bras almanahs \u201cOl\u016bts\u201d
  21. laidiens\u201d \u2013 p\u012b\u0161kierti 400 eiro.\\nLiteraturys almanahs n\u016bdr\u016bsynoj
  latgal\u012b\u0161u raksteituos literaturys puormontuojameibu i atsp\u012bge\u013coj
  tuos leimeni it\u016b\u0161a\u013ct, \u012bpazeistynoj\u016bt \u0161kolu jaunatni
  i skaiteituojus ar kulturys procesim Latgol\u0101.\\n- B\u012bdreibys \u201cARAYAN\u201d
  projekts \u201c30. gadu ebreju kino\u201d \u2013 p\u012b\u0161kierti 450 eiro.\\nProjekta
  \u012btvor\u016bs tiks turpynuota tradicionaluos ebreju kulturys izpiete i klezmer
  muzykys vuicei\u0161onuos, n\u016bsl\u0101gum\u0101 demonstrej\u016bt malnbolt\u016b
  m\u0101m\u016b kinu dzeivuos muzykys pavadejum\u0101.\\n- B\u012bdreibys \u201cT\u0101lu
  skan\u201d projekts \u201cLatvijas elektronisk\u0101s m\u016bzikas m\u016bzi\u0137u
  skates \u201cB\u012bts manai paaudzei\u201d\u201d \u2013 p\u012b\u0161kierti 420
  eiro.\\nProjekt\u0101 paradz\u0101tuos muziku skatis planavuots reikuot pi\u013cs\u0101tys
  sv\u0101tku \u012btvor\u016bs, aicynoj\u016bt jaun\u016bs muzikus \u012bsasaisteit
  bez moksys i atkluoj\u016bt elektroniskuos muzykys daudzpuseibu.\\n- B\u012bdreibys
  \u201cEXCELSUS\u201d projekts \u201cXIII Starptautiskais akordeonistu plen\u0113rs
  \u201cGabrova \u2013 R\u0113zekne 2016\u201d\u201d \u2013 p\u012b\u0161kierti 1070
  eiro.\\nPleners veicynoj akordeonistu profesional\u016b pylnveiduo\u0161on\u016bs
  i styprynoj storptautysk\u016b sadarbeibu (Latveja, Zv\u012bdreja, S\u016bmeja,
  Kr\u012bveja), n\u016bsl\u0101gum\u0101 p\u012bduovoj\u016bt plenera dalin\u012bku
  koncertu.\\n- B\u012bdreibys \u201cJaunatnes \u010demod\u0101ns\u201d projekts \u201cPopieli\u0146a
  \u201cPa pasakas tak\u0101m\u201d\u201d \u2013 p\u012b\u0161kierti 450 eiro.\\nProjekta
  \u012btvor\u016bs tiks reikuots pasuokums 5.-8. kla\u0161u \u0161kol\u0101nim, veicynoj\u016bt
  b\u0101rnu aktivu leidzdaleibu i d\u016bm\u016bt vareibu realiz\u0113t rod\u016b\u0161uos
  idejis i izpaust sovus talantus.\\n- B\u012bdreibys \u201cSTOPTIME DANCE STUDIO\u201d
  projekts \u201cVektors kust\u012bbai\u201d \u2013 p\u012b\u0161kierti 400 eiro.\\nProjekts
  paradz n\u016borganiz\u0113t 4 bezmoksys aktivys atpyutys pasuokumus vysaida vacuma
  R\u0113zeknis dzeivuotuojim i car deju, sporta n\u016bdarbeibom i orientie\u0161onuos
  sp\u0113lem veicynuot i populariz\u0113t veseleigu dzeivisveidu.\\n- B\u012bdreibys
  \u201cLatgalie\u0161i\u201d projekts \u201cM\u0101kslinieka Osvalda Zvejsalnieka
  izst\u0101des \u201cR\u0113zekne\u201d katalogs\u201d \u2013 p\u012b\u0161kierti
  1761 eiro.\\nParadz\u0101tais katalogs paruodeis i apk\u016bpuos muokslin\u012bka
  O. Zvejsalnieka rod\u016b\u0161\u016b davumu glezn\u012bceib\u0101, sekmej\u016bt
  R\u0113zeknis atpazeistameibu storptautysk\u0101 m\u0101r\u016bg\u0101 car muokslys
