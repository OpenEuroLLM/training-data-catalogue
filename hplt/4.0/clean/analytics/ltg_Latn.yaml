  paviers\u012b\u0146u, modulaceju i zeimu. Sovpus koncert\u0101 itei beja v\u012bna
  nu viersyu\u0146u, kai ma\u0146 redz\u012bs. Leidzsvors, tys ir tys, par k\u016b
  juod\u016bmoj.\u201d\\nIeteikt\\nLatvijas Radio aicina izteikt savu viedokli par
