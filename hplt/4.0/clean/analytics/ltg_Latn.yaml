sample: '["\"\u0160udi\u0146, 16. novembr\u012b, 17:00 stu\u0146d\u0113s n\u016bteik
  asoc. prof. Lidejis Leikumys lekceja par latgal\u012b\u0161u rokstu vol\u016bdu
  i latgaliskajom izl\u016bksnem.\\n17:00 LNB, Barona \u012bla 14, 3. stuov\u0101,
  312. ustob\u0101.\\n23. i 30. novembr\u012b latgal\u012b\u0161u rokstu vol\u016bdys
  kursi LNB, Barona \u012bla 14, 3. stuov\u0101, 312. ustob\u0101.\\n17:00 n\u016bdarbeiba
  \u012bsuociejim\\n18:00 n\u016bdarbeiba tim, kas gryb \u012bsavuiceit raksteit\\nKa
  c\u012bnej sovu muotis, t\u0101va, dzeda, babys i sovu vol\u016bdu i gribi raksteit
  pareizi, Tev ir loba \u012bspieja \u2013 kaids vuica i pastuosta tai\u0161ni Tev.
  Nav po\u0161am juosam\u016bka saprast, kas i kai.\\nVoi Tu izmontoj vysys ituo laika
  \u012bspiejis kruot gudreibu? K\u016b ni k\u016bdis, ni ryuss maitoj.\\nPasuokumu
  atbolsta LNB i KKF, projekta vadeituoja Muora Mortuz\u0101ne.\\nVaira informacejis
  ite.\\n25. novembr\u012b LgSC brauc gost\u016bs da Jelgovys studentu.\\nOrganizej
  Krist\u012bne Makovska i Vita Bri\u0161ka.\\nP\u012bjimts jauns b\u012bdrs \u2013
  Juo\u0146s Pape\u0146\u0161.\\nJis gotovs \u012bsasaisteit b\u012bdreibys dorb\u0101.
  Varbyut tai\u0161ni jauni b\u012bdri nas jaunys idejis i azartu dareit i byut. Jau
  tradicionaluo Z\u012bmyssv\u0101tku \u010dyguon\u016bs \u012b\u0161ona it\u016bgod
  var\u0101tu n\u016btikt Aglyun\u0101, juo dzymtaj\u0101 v\u012bt\u0101.\\nLgSC ir
  sataisiejs blogu i roksta ari portal\u0101 www.lv.lv, k\u016b taisa SIA \u201cLatvijas
  V\u0113stnesis\u201d.\\nMes asam vysaidi, tok ir k\u016bpeigais \u2013 interese
  par Latgolu i latgalisk\u016b, c\u012bns pret vierteibom i dr\u016bsme d\u016bmuot
  cytai\u017e. Blog\u0101 ar laiku raksteis vairuok \u013cau\u017eu, niu Harija Biern\u0101na
  roksts par aktual\u016b temu \u2013 latgal\u012b\u0161u vol\u016bda Latvejis va\u013cst\u012b.\\nLatgalie\u0161u
  valoda k\u0101 latgalie\u0161u identit\u0101tes sast\u0101vda\u013ca ir kritiski
  noz\u012bm\u012bga latviskas Latgales saglab\u0101\u0161anai. Latgalie\u0161u valoda,
  kult\u016bra, pa\u0161apzi\u0146a ir t\u0101s latvie\u0161u tautas gar\u012bg\u0101s
  \u201czelta rezerves\u201d, kas noput\u0113ju\u0161as, aizmirstas un nenov\u0113rt\u0113tas
  ir gul\u0113ju\u0161as no pirm\u0101s republikas laikiem. Atz\u012bstot un nov\u0113rt\u0113jot
  latgalie\u0161us un vi\u0146u valodu, valsts pret\u012b sa\u0146ems entuziastisk\u0101kos
  un loj\u0101l\u0101kos pilso\u0146us, k\u0101di tai jebkad biju\u0161i. Latgalie\u0161u
  valodai jaun\u0101, valsts atz\u012bt\u0101 lom\u0101 ir potenci\u0101ls k\u013c\u016bt
  par to impulsu, kam sekos Latgales gar\u012bga un kultur\u0101la atdzim\u0161ana
  \u2013 priek\u0161noteikums, bez kura nav iedom\u0101jama novada saimniecisk\u0101
  izaugsme. Latgaliskums var k\u013c\u016bt par inovat\u012bvu un efekt\u012bvu Latvijas
  atbildi kr\u012bzei. Jaut\u0101jums tikai \u2013 vai valstij pietiks gudr\u012bbas
  to izmantot.\\nTurpynoj\u0101s b\u0101rnu i jaun\u012b\u0161u lob\u016bs stuostu
  konkurss.\\nN\u016bsl\u0101gums 21. decembr\u012b. N\u016blykumu varit puorskaiteit
  ite.\\nTok jau sajimtais pyrmais dorbs l\u012bcynoj \u2013 latgal\u012b\u0161u jaun\u012b\u0161i
  d\u016bmoj, roksta i cer. Sagatavej ari sovu stuostu! Lobuok\u012b stuosti iz\u012bs
  gruomot\u0101 jau pavasar\u012b.\"", "\"Kontakti\\nNed\u0113\u013cas skaitlis\\nPag\u0101ju\u0161i
  5 gadi kop\u0161 latus m\u016bsu makos un bankas kontos ir nomain\u012bju\u0161i
  eiro.\\nApspriest\\nAptauja\\nP\u0113c k\u0101diem krit\u0113rijiem J\u016bs izv\u0113laties
  produktus?\\nJaun\u0101kie koment\u0101ri:\\n\u0160odien un tagad: par atbalstu
  zemkop\u012bbas nozarei\\nVierteigs raidejums! S\u012bk\u0101k...\\nGrupa \\\"Latgalie\u0161u
  reps\\\" raid\u012bjum\u0101 pirmatska\u0146o dziesmu\\nNakri\u0161kon, you keids
  protav\u0101dars atsarodos:) mo\u0161ka zam tova klasifikatora nagova keidi vordu
  salykumi voi ska\u0146ys gobols? Pats izspr\u012bdi voi kur n\u016bzaklausieji?
  Sataisi lobok i tod runoi:) Nav k\u016b aplikt - pui\u0161i mala\u010di! S\u012bk\u0101k...\\nGrupa
  \\\"Latgalie\u0161u reps\\\" raid\u012bjum\u0101 pirmatska\u0146o dziesmu\\nTei
  nav hip-hopa apv\u012bneiba, pirmkuort! \u016atkuort, po\u0161i esot pretrun\u0101
  ar sovu jaun\u016b dz\u012bsmu.. Lobuok n\u016bmainit sovys ''''apv\u012bneibys''''
  n\u016bsaukumu iz nask\u016b solduoku. Yo! S\u012bk\u0101k...\"", "\"Voi Latgolys
  kulturv\u012btys ir b\u0101rnim i jaun\u012b\u0161im draudzeigys?\\nRokstu sagataveja:
  Laura Melne, portals lakuga.lv\\nRuod\u012bs, ka ar kotru godu vys leluoka viereiba
  teik p\u012bv\u0101rsta kulturys p\u012bduovuojumam b\u0101rnu i jaun\u012b\u0161u
  auditorejai. N\u016bzeimeiga l\u016bma tym\u0101 ir programai \u201cLatvijas skolas
  soma\u201d, tok tikpat svareigi d\u016bt vareibu b\u0101rnim i jaun\u012b\u0161im
  apmekl\u0113t kulturv\u012btys ari k\u016bp\u0101 ar saimi voi v\u012bnim po\u0161im.
  Sov\u0101 p\u012bredz\u0113 portalam lakuga.lv doluos \u010detru Latgolys kulturv\u012btu,
  kas eipa\u0161i d\u016bmoj par jaunuos audzis p\u012bsaistei\u0161onu, puorstuovi,
  taipat aicynuojom sovu redz\u012bni izsaceit ari myusu sekuotuojim socialaj\u016bs
  medej\u016bs, kab n\u016bskaidruotu, voi Latgolys kulturv\u012btys jim ruod\u012bs
  b\u0101rnim i jaun\u012b\u0161im draudzeigys.\\nNav \u0161vuorbu, ka vareibys apmekl\u0113t
  pasuokumus b\u0101rnim i jaun\u012b\u0161im Latgol\u0101 ir. Vaicuojumi drei\u017euok
  var\u0101tu byut par t\u016bs daudzumu i kvalitati. Myusu d\u012bnuos daudz vaira
  teik runuots par b\u0101rnu leidzdaleibys principu, k\u016b byutu labi \u012bv\u0101ruot
  sevkur\u0101 dzeivis situacej\u0101 \u2013 \u013caut b\u0101rnim po\u0161im \u012bsasaisteit
  l\u0101mumu p\u012bjim\u0161on\u0101 i izskaidruot kotru situaceju, kur\u0101 j\u012b
  \u012bsaisteiti. Leidzeigai ir ari ar kulturys p\u012bduovuojumu \u2013 tuo veiduotuoji
  nadreikst aizmierst, ka pasuokumi ir juoreikoj atbylst\u016b\u0161i b\u0101rnu i
  jaun\u012b\u0161u, na p\u012baugu\u0161\u016bs interesem, kod leidzdaleiba teik
  tik imit\u0101ta.\\nAt\u0161kireigu izpratni par b\u0101rnu i jaun\u012b\u0161u
  auditorejis uzrunuo\u0161onu paruodeja ari Latgolys viestn\u012bceib\u0101 \u201cGors\u201d
  p\u0101rnejuo gods beiguos n\u016btyku\u0161uo Latvejis Kulturys akademejis konference
  \u201cKult\u016bra re\u0123ionos: iesp\u0113jas, izaicin\u0101jumi un perspekt\u012bvas\u201d.
  V\u012bna nu tuos sekcejom beja ve\u013cteita tai\u0161ni jaun\u012b\u0161u auditorejai
  region\u016bs. Pane\u013cdiskusej\u0101 par b\u0101rnu i jaun\u012b\u0161u auditorejis
  \u012bsaisti p\u012bsadaleja L\u016bznovys mui\u017eys puorva\u013cdneica Iveta
  Bal\u010d\u016bne, t\u016breizejais Daugovpi\u013cs Kulturys pi\u013cs vadeituojs
  Harijs Vucins, L\u012bpuojis koncertz\u0101lis \u201cLielais Dzintars\u201d va\u013cdis
  l\u016bceklis Timurs Tomsons, Ventspi\u013cs koncertz\u0101lis \u201cLatvija\u201d
  va\u013cdis l\u016bcekle Sigita Migo\u013ca i programys \u201cLatvijas skolas soma\u201d
  vadeituoja Aija T\u016bna. Ka Bal\u010d\u016bne i Tomsons stuosteja par jaun\u012b\u0161u
  \u012bsaisti kulturv\u012btu darbeib\u0101 i gribie\u0161onu, lai j\u012b t\u012b
  jiut\u0101s gaideiti ari kasd\u012bn\u0101, uorpus pasuokumu, Vucins eisti naizprota,
  de\u013ckuo juorauga p\u012bsaisteit ari t\u016bs jaun\u012b\u0161us, kuri varbyut
  ari skaita, ka j\u016bs kultura nainteresej, ka apleik ir gona taidu, kuri aktivi
  \u012bsasaista pu\u013cce\u0146\u016bs i n\u016bdarbeibuos.\\nPortala lakuga.lv
  skaiteituoju aptaujis rezultati l\u012bcynoj, ka situaceja Latgolys kulturv\u012btuos
  nav \u012bpr\u012bcynoj\u016b\u0161a \u2013 70 % respondentu skaita, ka tamuos par
  b\u0101rnu i jaun\u012b\u0161u auditoreju nateik p\u012bteik\u016b\u0161i daudz
  d\u016bmuots.\\nKonkretuok vaicoj\u016bt, kurai vacuma grupai Latgolys kulturv\u012btuos
  var\u0101tu tikt p\u012bv\u0101rsta leluoka uzmaneiba, vysb\u012b\u017euok sajimtuo
  atbi\u013cde ir, ka vyds\u0161kol\u0101nim (31 %). Tuoli naatpal\u012bk ari suokum\u0161kol\u0101ni
  (28,6 %) i pamat\u0161kol\u0101ni (26,2 %).\\nRaug\u016bt vaira izzynuot par faktorim,
  kas veicynoj voi l\u012bdz apmekl\u0113t pasuokumus k\u016bp\u0101 ar sovys saimis
  b\u0101rnim i jaun\u012b\u0161im, atsakluoj vairuokys problemys. Vysb\u012b\u017euok
  portala lakuga.lv skaiteituoji izc\u0101lu\u0161i latgalisk\u016bs pasuokumu tryukumu
  \u2013 pasuokumi b\u0101rnim Latgol\u0101 puorsvor\u0101 n\u016bteik latv\u012b\u0161u
  literaraj\u0101 vol\u016bd\u0101, \u0161a\u013ctim vys v\u0113\u013c ari kr\u012bvyski.
  Taipat teik pastreipuots, ka daudzim b\u0101rnim jau nu agrys bierneibys radeits
  pr\u012b\u0161kstots, ka izaklaideit var \u0161k\u0101rsteikla vid\u0113, part\u016b
  reali pasuokumi ni b\u0101rnim, ni j\u016bs vacuokim nasaruod\u012bs vajadzeigi.
  \u012asacejumi kulturv\u012btom ir vysaidi, p\u012bm\u0101ram, da\u013cu pasuokumu,
  kuru mierkauditoreja ir vacuokuo audze, aizstuot ar pasuokumim b\u0101rnim, kam
  as\u016b\u0161uos n\u016btik\u0161onys \u201cir kek\u0161a piec, nanas ni va\u013cstiski,
  ni dv\u0113seliski nikaida p\u012bnasuma\u201d. Taipat ir aicynuojums vysus pasuokumus
  b\u0101rnim, pat sporta sp\u0113lis, vadeit latgaliski, lai b\u0101rni t\u012b var
  i klauseit\u012bs vol\u016bdu, i po\u0161i runuot. Uzsvoru vajadz\u0101tu ari vaira
  likt iz interaktivom n\u016btik\u0161onom, vairuoki \u012bsacejumi saisteiti ar
  folklorys pasuokumim, tradicional\u016bs omotu i viesturis \u012bpazei\u0161onu,
  latgal\u012b\u0161u literaturys popularizie\u0161onu b\u0101rnu vyd\u0101.\\nRakstn\u012bki,
  saimis i chill out styureits\\nV\u012bna nu kulturv\u012btu, kas naatkareigi nu
  pi\u013cs\u0101tys voi pogosta, kur atsar\u016bn, var\u0101tu byut b\u0101rnim i
  jaun\u012b\u0161im vysdraudzeiguokuo, ir biblioteka. T\u016b m\u0101dz apmekl\u0113t
  na tik, kab makl\u0101tu sev interesej\u016b\u0161ys gruomotys, tok ari sp\u0101l\u0101tu
  sp\u0113lis voi v\u012bnkuor\u0161i pas\u0101d\u0101tu i pakav\u0101tu laiku, p\u012bm\u0101ram,
  leidz tyvuokajam autobusam nu \u0161kolys iz s\u0101tu. Bibliotekys regulari rauga
  organiz\u0113t ari vysaidus pasuokumus, p\u012bm\u0101ram, sasatik\u0161onys ar
  literatim, tok na vysur regulari n\u016bteik ari atsevi\u0161ki pasuokumi b\u0101rnu
  i jaun\u012b\u0161u auditorejai.\\nV\u012bns nu pozitiv\u016bs p\u012bm\u0101ru
  ir Latgolys Centraluo biblioteka Daugovpil\u012b. Tuos filiale B\u0101rnu biblioteka
  \u201cZ\u012bl\u012bte\u201d jau \u010detrus godus piec kuortys eistynoj projektu
  \u201cTiekamies bibliot\u0113k\u0101! B\u0113rnu rakstnieki Daugavpil\u012b\u201d,
  k\u016b atbolsta Va\u013csts kulturkapitala fonds. Tys d\u016bd vareibu iz Daugovpili
  atbraukt b\u0101rnu i jaun\u012b\u0161u gruomotu autorim voi muokslin\u012bkim.
  \u201cDzeivuo saikne storp autoru i skaiteituoju (ari potencial\u016b skaiteituoju)
  d\u016bd t\u016b eipa\u0161\u016b kluotbyutnis sajiutu, paleidz \u012bpazeit jaunys
  personeibys, izzynuot gruomotu tap\u0161onys viesturi, \u012binteres\u0113t po\u0161am
  raudzeit ko\u010d k\u016b raksteit. Tycit ma\u0146, tys vyss veidoj jaunuos audzis
  d\u016bmuo\u0161onu, pasau\u013ca uztveri, varbyut kaids jau rauga izaviel\u0113t,
  k\u016b dareit nuok\u016btn\u0113. Itaidys sasatik\u0161onys ir gondrei\u017e kai
  byu\u0161ona cyt\u0101 realitat\u0113, kai p\u012bdzeivuojums, kur\u0101 grib\u012bs
  atsagr\u012bzt v\u0113\u013c i v\u0113\u013c,\u201d stuosta LCB filialis \u201cZ\u012bl\u012bte\u201d
  vadeituoja Dace Jakovele.\\nTaipat \u201cZ\u012bl\u012bte\u201d sastd\u012bn\u0113s
  organizej vysaiduokys aktivitatis saimem \u2013 literari tematiskus pasuokumus,
  bibliotekaruos stu\u0146dis, rod\u016b\u0161uos darbneicys, kvestus, rod\u016b\u0161ys
  sasatik\u0161onys ar Daugovpi\u013cs n\u016bvadn\u012bkim \u2013 dzejn\u012bkim,
  rakstn\u012bkim, muokslin\u012bkim. \u201cSaimis \u012bt kupl\u0101 skait\u0101,
  lai k\u016bp\u0101 ar cytom saimem l\u012btdereigi i sirsneigi pavadeitu laiku.
  \u012asaistom na tik gruomotu fragmentu ska\u013caj\u0101 skaitei\u0161on\u0101,
  meik\u013cu minie\u0161on\u0101, autoru dzeivis jubileju svietei\u0161on\u0101,
  bet ari Leluos tolkys n\u016bris\u0113s, pu\u010du d\u016bbis \u012bkuortuo\u0161on\u0101
  biblioteku pogolm\u016bs i tt.,\u201d bibliotekys daudzpuseig\u016b sadarbeibu ar
  saimem raksturoj Dace Jakovele. Latgolys Centraluo biblioteka n\u016bteikti as\u016bt
  v\u012bta, kur gaideiti na vi\u0146 \u010dakl\u012b gruomotu skaiteituoji. \u201cKotr\u0101
  filial\u0113 ir sovs chill out styureits, kur var pavadeit laiku \u2013 v\u012bn\u0101
  bibliotek\u0101 kaidam pateik \u012bkrist puf\u0101 ar teleponu r\u016bk\u0101,
  kaidam otkon pi sirds \u012bt golda voi datorsp\u0113lis ar draugim voi v\u012bnkuor\u0161i
  k\u016bp\u0101 byu\u0161ona sarunuos. Vysuos bibliotekuos ir ari n\u016bsaceiti
  klusais styureits, kur var pabyut divv\u012bntuleib\u0101 ar gruomotu,\u201d tai
  Dace.\\nNu pasuokuma sovejim leidz muzeja n\u016bdarbeibom\\nNu ituo gods suokuma
  vareibu vysjaunuokajai audzei \u012bpazeit latgal\u012b\u0161u tradicejis p\u012bduovoj
  muzejs \u201cOndrupinis lauku s\u0101ta\u201d. Mozuos tradiceju \u0161kolys mozajim
  idejis autore ir muzeja n\u016bvodpietneica Evija Ma\u013ckevi\u010da-Grundele.
  Jei stuosta: \u201cBierneib\u0101 daudz laika pavadeju k\u016bp\u0101 ar draugim
  i j\u016bs vacuokim. Mums beja taidys kai regularys naformaluos sa\u012b\u0161onys,
  eipa\u0161i z\u012bmys period\u0101, kab, p\u012bm\u0101ram, laist\u016bs nu kolna
  ar ragave\u0146om, gr\u012bzt\u016bs gr\u012bztaukuos, sp\u0101l\u0101tu sp\u0113lis
  voi v\u012bnkuor\u0161i jautri pavadeitu laiku. Niu, kod ma\u0146 po\u0161ai i ari
  munim draugim i lobim pazi\u0146om ir b\u0101rni leidzeig\u0101 vacum\u0101, gribiejuos
  itaidys byu\u0161onys k\u016bp\u0101 atkuortuot. Ituo gods suokuos sasazynuoju ar
  da\u017eim draugim i pazi\u0146om, kab noskaidruotu, voi jim byutu interese sasatikt,
  ko\u010d voi reizi mienes\u012b, kab myusu b\u0101rni k\u016bp\u0101 var jiedzegi
  i interesanti pavadeit laiku.\u201d Evija suokuse d\u016bmuot par senejom sp\u0113lem
  i tradicionalom izdareibom, k\u016b var\u0101tu k\u016bp\u0101 dareit, uzrunuojuse
  Ondrupinis lauku s\u0101tu \u2013 varbyut var izmontuot j\u016bs telpys? Sataisejuse
  ari simbolisku afi\u0161u, tok vyss jau izaviers tik n\u016bp\u012btnai, ka saj\u0101muse
  aicynuojumu padareit t\u016b par publisku n\u016btik\u0161onu. \u201cIz pyrm\u016b
  sa\u012b\u0161onu \u012bsaroda 14 pyrms\u0161kolys i suokum\u0161kolys vacuma b\u0101rni,
  kluotyn beja ari j\u016bs vacuoki. Sajiemu \u012bdr\u016bsynuojumu turpynuot it\u016b
  ideju atteisteit tuo\u013cuok kai realu vareibu tradicejom otkon \u012b\u012bt i
  tikt aktualiz\u0101tom saim\u0113s, kas ir pamatu pamats spieceigom k\u016bp\u012bnom
  i v\u012btejuo montuojuma saglobuo\u0161onai.\u201d Dorbu muzej\u0101 Evija suokuse
  tik pie\u010duok, part\u016b soka, ka \u201cmozuo ideja par v\u012bnkuor\u0161u
  saimu sa\u012b\u0161onu puortopa par praktisku tradiceju i prasmu izzinis pasuokumu
  cyklu.\u201d\\nKa suokum\u0101 par golvon\u016b mierkauditoreju tyka skaiteiti pyrms\u0161kolys
  vacuma b\u0101rni, kam tyvuokaj\u0101 apleic\u012bn\u0113 nav daudz n\u016bdarbeibu
  i pu\u013cce\u0146u uorpus izgleiteibys \u012bstuodem, tod jau pyrmaj\u0101 sasatik\u0161onys
  reiz\u0113 saprosts, ka vacuma r\u016bbe\u017ei nav juovalk \u2013 k\u016bp\u0101
  ar mozajim lobu pruotu aktivitat\u0113s \u012bsasaista ari vacuok\u012b bruoli i
  muosys, kas jau \u012bt \u0161kol\u0101. Sa\u012b\u0161onys n\u016bteik reizi mienes\u012b,
  tematiski tuos sasaist\u016bt ar aktual\u016b godskuortu voi dorbim tradicional\u0101
  lauku s\u0101t\u0101. Dorbuo\u0161onuos n\u016bteik kai muzej\u0101 vyd\u0101, tai
  uor\u0101. Pr\u012b\u0161kr\u016bceiba ir ari vareiba izmontuot pr\u012b\u0161kmatus
  nu muzeja kruojuma, kas paleidz stuosteit par senejim omotim i lauku dorbim. \u201c5-7
  godi ir tys vacums, kod b\u0101rnam izastruodoj i n\u016bsastyprynoj vierteibu sistema,
  izpratne par socialajom strukturom, tykumim i pasauli mums apleik. Identitatis i
  p\u012bdareibys sovam dzymtajam n\u016bvodam styprynuo\u0161ona k\u016bp\u0101 ar
  v\u012bnaud\u017eim i d\u016bmub\u012bdrim caur r\u016bta\u013com i k\u016bpeig\u016b
  dorbuo\u0161on\u016bs ar vacuokim \u013caun b\u0101rnam t\u016b suokt skaiteit par
  normu, i saskare ar tradiceju pal\u012bk par juo komforta zonu,\u201d ir puorl\u012bcynuota
  Evija.\\nB\u0101rnu ustoba, kulturys viestn\u012bku programa i belets par 5 eiro\\nPar
  b\u0101rnim i jaun\u012b\u0161im draudzeigu vidi rauga ryup\u0113t\u012bs ari Latgolys
  viestn\u012bceiba \u201cGors\u201d. Tam p\u012bm\u0101rus var atrast na tik koncertz\u0101lis
  repertuar\u0101, bet ari cytuos j\u016bmuos. P\u012bm\u0101ram, jau nu \u201cGora\u201d
  pyrmsuokumu tym\u0101 dorboj\u0101s b\u0101rnu ustob\u0101, kur p\u012baugu\u0161\u016bs
  uzraudzeib\u0101 var pamest b\u0101rnus, cikom j\u016bs vacuoki apmeklej pasuokumus,
  kas eisti nav p\u012bm\u0101ruoti vysjaunuokajai auditorejai. Tok, kab radeitu leluoku
  interesi tai\u0161ni par b\u0101rnu pasuokumim, p\u0101r\u0146 \u201cGor\u0101\u201d
  aizsuokta Moz\u016bs kulturys viestn\u012bku programa \u2013 sakruoj\u016bt zeim\u016bdze\u0146us
  par apmakl\u0101tajim pasuokumim, var tikt pi \u201cGora\u201d Mozuo viestn\u012bka
  g\u016bda i sajimt bolvu. Pyrmuo ituos aktivitatis sezona beja p\u0101rnejuo gods
  rudin\u012b, bet \u016btruo \u2013 ituo gods pavasar\u012b.\\n\u201cIdeja par programu
  roduos ar mierki uzteikt aktivuok\u016bs kulturys n\u016btik\u0161onu apmakl\u0101tuojus
  i r\u016bsynuot leluoku interesi i izpratni par vysaidom kulturys n\u016btik\u0161onom.
  10 godu laik\u0101 \u201cGora\u201d saimis pulks ir pasapla\u0161ynuojs i daudzim
  nu myusu ir aktuals vaicuojums \u2013 kur d\u016bt\u012bs ar sovom mozajom atlasem,
  patur\u016bt pruot\u0101, kab tys byutu saist\u016b\u0161i b\u0101rnam, kvalitativi
  i, v\u0101lams, ari tikt pi kaidys pal\u012bk\u016b\u0161ys atzinis dzeivei?\u201d
  stuosta Latgolys viestn\u012bceibys \u201cGors\u201d marketinga n\u016bdalis vadeituoja
  Santa K\u013cavi\u0146a.\\nRudi\u0146a sezon\u0101 vajadzeig\u016b zeim\u016bdze\u0146u
  skaitu beja sakruoju\u0161i 26 b\u0101rni, kas tyka pi Mozuo kulturys viestn\u012bka
  n\u016bzeimeitis i vareibys \u201cGor\u0101\u201d apmekl\u0113t kinu. \u201cSkaitom,
  ka tys ir pozitivs ruodeituojs, kai ari jutom ar kaidu pr\u012bcu b\u0101rni sajam
  sovu zeim\u016bdze\u0146u kart\u0113 i pietej, kurs tod byus j\u016bs nuoku\u0161ais
  kulturys pasuokuma apmekliejums. Tys ari beja mudynuojums vierzeit\u012bs tuo\u013cuok
  i turpynuot aizsuokt\u016b tradiceju,\u201d skaidroj Santa. Jei ari paturpynoj,
  ka \u201cGors\u201d pavysam n\u016bteikti sevi skaita par b\u0101rnim i jaun\u012b\u0161im
  draudzeigu i interesantu vidi: \u201cKotr\u0101 satura sapu\u013cc\u0113 c\u012bteigai
  izviertejam nuoku\u0161uos sezonys p\u012bduovuojumu, kab t\u012b k\u016b sev saist\u016b\u0161u
  atrostu i pavysam mozi, i ari jaun\u012b\u0161i.\u201d Taipat jaun\u012b\u0161im
  leidz 25 godu vacumam ir eipa\u0161a akceja \u2013 pierk\u016bt beletu iz pasuokumu
  stu\u0146di pyrma tuo suoku, belets moksoj vi\u0146 5 eiro. Tys vys atsat\u012bc
  tik iz po\u0161ys koncertz\u0101lis organiz\u0101tajom n\u016btik\u0161onom.\\nVareiba
  po\u0161im p\u012bsadaleit i veiduot saturu\\nJaun\u012b\u0161u auditorejai it\u016bpavasar
  vysleluok\u016b viereibu ve\u013ctej ari Rotko muzejs Daugovpil\u012b. Aprel\u012b
  t\u012b dorbu suocs muzeja Jaun\u012b\u0161u klubs, kas paradz\u0101ts vysmoz 15
  godu vacim jaun\u012b\u0161im, kurus interesej muoksla i dizains. Tuo daleibn\u012bkim
  byus vareiba breivpruoteigai \u012bsasaisteit muzeja kulturys i izgleiteibys pasuokumu
  organizie\u0161on\u0101 i paleidz\u0113t veiduot tam jaun\u012b\u0161im saist\u016b\u0161u
  saturu. Rotko muzeja izgleiteibys programu kuratore Mairita Folkmane stuosta, ka
  myusu d\u012bnuos muzejam juobyut vysom paaudzei atv\u0101rtai i maineigai institucejai,
  kas kai izgleitoj, tai ir ari breivuo laika pavadei\u0161onys v\u012bta: \u201cPart\u016b
  svareigi, kab jaun\u012b\u0161i \u012btu ar sovu iniciativu, gribie\u0161onu te
  pavadeit sovu laiku, byut p\u012bdareigim, kab j\u012b ite sasajustu kai s\u0101t\u0101
  \u2013 ka j\u012b ir vajadzeigi sovai pi\u013cs\u0101tai i sovam muzejam. Ari mums,
  muzeja darbin\u012bkim, ir svareigi, kab j\u012b te byutu. Tei ir taida obpusieja
  vajadzeiba.\u201d Leidzeigs jaun\u012b\u0161u klubs jau nu 2017. goda dorboj\u0101s
  Latvejis Nacionalaj\u0101 muokslys muzej\u0101. Daugovpil\u012b\u0161i nasliep,
  ka ir \u012bsadvasmuoju\u0161i nu tuo darbeibys, it\u016bvosor paradz\u0101ta ari
  p\u012bredzis apmainis sasatik\u0161ona jaun\u012b\u0161im Reig\u0101.\\nIz pyrm\u016b
  Rotko muzeja Jaun\u012b\u0161u kluba sasatik\u0161onu atguoju\u0161i vaira nakai
  20 jaun\u012b\u0161i. Diveju darbeibys miene\u0161u laik\u0101 jim jau bejuse vareiba
  n\u016bsaklauseit muzeja vadeituoja M\u0101ra \u010ca\u010dkys lekceju par laikmeteig\u016b
  muokslu, p\u012bsadaleit s\u012btsp\u012bdis apdrukys darbneic\u0101, v\u012bna
  nu jaun\u012btem ari po\u0161a sataisejuse kluba logo. Jaun\u012b\u0161i aktivi
  suoku\u0161i ari breivpruoteig\u016b dorbu muzej\u0101, p\u012bm\u0101ram, Muzeju
  nakt\u012b beju\u0161i \u012bsaisteiti pat 11 Jaun\u012b\u0161u kluba daleibn\u012bki.
  Jau it\u016bnede\u013c Jaun\u012b\u0161u klubam \u012bpl\u0101nuota sasatik\u0161ona
  ar muokslys terapeiti Margaritu Sto\u013carovu. Taipat jaun\u012b\u0161im ir vareiba
  po\u0161im organiz\u0113t sovus pasuokumus muzej\u0101, pyrmais var\u0101tu byut
  jau ju\u0146a beiguos. J\u012b po\u0161i ari veidoj Jaun\u012b\u0161u kluba saturu
  socialaj\u016bs medej\u016bs. Iz pr\u012b\u0161ku muzej\u0101 var\u0101tu byut ari
  jaun\u012b\u0161u veiduotys i vadeitys n\u016bdarbeibys vysaidom vacumu grupom.\\nRotko
  muzej\u0101 ari regulari n\u016bteik n\u016bdarbeibys b\u0101rnim nu septe\u0146u
  da v\u012bnpadsmit godu vacuma. T\u016bs temys \u012brostai teik sasaisteitys ar
  aktualajom Rotko muzeja ekspozicejom i izstuodem. Goda garum\u0101 jau vacuokim
  jaun\u012b\u0161im muzej\u0101 beja vareiba \u012bpazeit arhitekta profeseju \u2013
  reizi divej\u016bs miene\u0161\u016bs n\u016btyku\u0161ys sasatik\u0161onys \u2013
  rod\u016b\u0161uos d\u016bmu darbneicys ar jaunajim profesionalim. Tam \u012bdviesmis
  ol\u016bts bejuse ar Rotko muzeju c\u012b\u0161i saisteituo muokslin\u012bka P\u0113tera
  Martinsona personeiba \u2013 juo pamatprofeseja beja arhitekts. N\u016bsl\u0101dz\u016b\u0161uo
  sasatik\u0161ona ar dizaineru J\u0101ni Mercu paradz\u0101ta 27. jun\u012b.\\n\u0160a\u013ct\u012b,
  kod sasazvonu ar Mairitu Folkmani, jai s\u016bpluok ir v\u012bna nu Jaun\u012b\u0161u
  kluba daleibneicu \u2013 Laila. Pavaicoju ari juos redz\u012bni kai par Jaun\u012b\u0161u
  klubu, tai vareibom jaun\u012b\u0161im Daugovpil\u012b k\u016bpum\u0101. Laila stuosta,
  ka Rotko muzeju regulari apmekl\u0113juse ari \u012bpr\u012b\u0161k, tym\u0101 skait\u0101
  laik\u0101, kod vuicejus\u0113s b\u0101rnu muokslys \u0161kol\u0101, tok par Jaun\u012b\u0161u
  klubu izzynuojuse, pasasok\u016bt zi\u0146ai klasis WhatsApp \u010dat\u0101: \u201cTai
  ar draudzini atguojom iz Rotko muzeju. \u012apasazynom ar daudzim cylv\u0101kim,
  sovim v\u012bnaud\u017eim, kas ari interesej\u0101s par muokslu. Atrodom sev ko\u010d
  k\u016b k\u016bpeigu. Jau n\u016bvadejom k\u016bp\u0101 ari Muzeju nakti, kas beja
  loba p\u012bredze.\u201d Laila skaita, ka Daugovpil\u012b jaun\u012b\u0161im ir
  c\u012b\u0161i daudz vareibu: \u201cVarbyut tik jaun\u012b\u0161i na vysod var atrast
  tuos vareibys, part\u016b ka informaceju m\u0101dz izlikt Facebook, kam jaun\u012b\u0161i
  tik c\u012b\u0161i nasekoj leidza. Ko\u010d k\u016b jaunu mes izzynojam, pasasok\u016bt
  \u0161koluotuojim. Tod ari p\u012bsadolom. Kai \u012bsastuoju Rotko Jaun\u012b\u0161u
  klub\u0101, ma\u0146 suokus\u0113s c\u012b\u0161i aktiva dzeive i ir c\u012b\u0161i
  interesanti.\u201d\"", "\"V\u012bns jumts i k\u016bpeigi sp\u0101ki talantu izce\u013c\u0161onai
  \u2013 R\u0113zeknis Muokslys i dizaina \u0161kola svietej 65 godu jubileju\\nRokstu
  sagataveja: Laura Spundere, portals lakuga.lv\\nR\u0113zeknis Muokslys i dizaina
  \u0161kola (RMDS) 26. oktobr\u012b svieteis 65 godu jubileju ar absolventu saliduojumu
  i izstuodi divejuos v\u012btuos. Nu 2023. gods \u0161kola ir muokslys izgleiteibys
  kompetencis centra \u201cLatgolys Muzykys i muokslys vyds\u0161kola\u201d (LMMV)
  strukturv\u012bneiba. Sarun\u0101 ar MIKC LMMV direktoru Raimondu Arbid\u0101nu
  i RMDS strukturv\u012bneibys vadeituojis v\u012btineicu Krist\u012bni Binduku raudzejom
  dazynuot, kai ir muokslai i muzykai dzeivuot \u201czam v\u012bna jumta\u201d.\\nNu
  izveiduo\u0161onys 1959. god\u0101 \u0161kola ir profesionaluos karjerys \u0161yupe\u013cs
  daudzim pazeistamim muokslin\u012bkim i dizainerim, taipat ari n\u016bzeimeigs Austrumlatvejis
  kulturys i izgleiteibys centrys, kas ryupej\u0101s par muokslys izgleiteibys turpynuo\u0161onys
  n\u016bdr\u016bsynuo\u0161onu Latgol\u0101. Nu 2023. gods \u0161kola ir Muokslys
  izgleiteibys kompetencis centra \u201cLatgolys Muzykys i muokslys vyds\u0161kola\u201d
  (MIKC LMMV) strukturv\u012bneiba.\\nMuokslys izgleiteibys kompetencis centrys \u201cLatgolys
  Muzykys i muokslys vyds\u0161kola\u201d ir Kulturys ministrejis pak\u013cauteib\u0101
  as\u016b\u0161a izgleiteibys \u012bstuode, kura dorbu aizsuoce 2023. gods 1. august\u0101,
  reorganizej\u016bt Juo\u0146a Ivanova R\u0113zeknis muzykys vyds\u0161kolu i R\u0113zeknis
  Muokslys i dizainu vyds\u0161kolu (RMDS), ar mierki veicynuot kulturizgleiteibys
  atteisteibu Latgol\u0101 i vairuot kulturizgleiteibys presti\u017eu i konkur\u0113tvareibu.\\nKai
  soka MIKC LMMV direktors Raimonds Arbid\u0101ns, R\u0113zeknis Muokslys i dizaina
  \u0161kola sov\u016bs 65 god\u016bs ir \u012bkruojuse p\u012bredzi, \u0161kolys
  vadeibai i \u0161koluotuojim ir energeja, redz\u012b\u0146s par byu\u0161onu iz
  pr\u012b\u0161ku, ir jau padareit\u012b dorbi i taidi, kas v\u0113\u013c pl\u0101n\u016bs.
  \u201cAri apsav\u012bnuo\u0161ona ir juoiztver kai iz\u012b\u0161ona cyt\u0101 leimin\u012b.
  Apsav\u012bnoj\u016bt muzykai i muokslai k\u016bp\u0101, r\u016bn\u0101s jauns paviers\u012b\u0146s,
  ir jauni aizdavumi i jaunys atbi\u013cdeibys, spieja puorsameit vi\u0146 veicynoj
  pastuovie\u0161onys \u012bspiejis. Kulturizgleiteiba faktiski ir ari nacionaluos
  dr\u016bseibys vaicuojums, eipa\u0161i austrumu p\u012br\u016bbe\u017e\u0101,\u201d
  tai Raimonds Arbid\u0101ns. Jis pastreipoj, ka \u0161kol\u0101nim teik \u012baudzynuotys
  na vi\u0146 muokslu prasmis, tok i patriotismys. \u201cSapr\u016btams, ka apsav\u012bnuo\u0161ona
  beja izaicynuojums, tok kai muzykys, tai muokslys strukturv\u012bneibom ir sovys
  tradicejis, par p\u012bm\u0101ru, mes it\u016bgod nasvieteisim v\u012bna goda jubileju
  kai muokslu izgleiteibys kompetencis centrs, tok svieteisim 65 godus tai\u0161ni
  muokslys strukturv\u012bneibai, kam juos ir tradicejis, kuruos mums ir juoc\u012bnej,\u201d
  ar sovu redz\u012bni pasadola Raimonds Arbid\u0101ns. Te ari juosoka, ka R\u0113zeknis
  vyspuorejuos izgleiteibys \u012bstuod\u0113s absolventu vokori teik organiz\u0101ti
  kotru godu, sovpus obejuos itamuos kulturizgleiteibys \u0161koluos ir prakse svieteit
  opolys i pusopolys jubilejis.\\nRaimonds ari p\u012bzeist, ka p\u0101r\u0146, suoc\u016bt
  dorbu, \u0161kolu apsav\u012bnuo\u0161ona v\u0113\u013c redzejuos kai nazkas teoretiskys,
  tok niu, piec goda, teik struoduots pi c\u012b\u0161i praktisku l\u012btu, par p\u012bm\u0101ru,
  n\u016bteik dorbs pi RMDS renovacejis projekta tehniskuos izstruodis, kuru pl\u0101nuots
  suokt jau cytugod. Paradz\u0101ta vier\u012bneiga renovaceja, kas \u012btvers da\u017eaidus
  aspektus, tym\u0101 skait\u0101 syltynuo\u0161onu, jumta mai\u0146u, apkuris i ventilacejis
  n\u016bmai\u0146u i cytus dorbus. Raimonds pastreipoj, ka, tai\u0161ni pasasok\u016bt
  \u0161kolu apsav\u012bnuo\u0161onai, ir vareiba kvalitativuok izmontuot Eiropys
  Sav\u012bneibys strukturfondu leidzek\u013cus, ari RMDS renovaceja n\u016btiks,
  pasasok\u016bt tai\u0161ni tam.\\nRaimonds ari soka, ka izgleiteibys \u012bstuo\u017eu
  infrastruktura i ari vizualais skots ir c\u012b\u0161i n\u016bzeimeigs, kab byutu
  vareiba aizinteres\u0113t jaun\u012b\u0161us i kotru godu n\u016bkomplekt\u0113t
  kursus. Jis ari tur n\u016bceju, ka piec puora godu, kod tiks pabeigta renovaceja,
  byus sajiutams ari audziek\u0146u p\u012bplyudums.\\nRMDS strukturv\u012bneibys
  vadeituojis v\u012btineica Krist\u012bne Binduka stuosta, ka it\u016bgod nav bejs
  audziek\u0146u skaita krytuma, \u0161kolys vadeiba eipa\u0161i struodoj pi tuo,
  kab uzrunuotu t\u016b sab\u012bdreibys da\u013cu, kas ir \u012binteres\u0101ta vuiceit\u012bs
  muokslu. \u201cIr atsevi\u0161kys n\u016bdalis, iz kurom konkurss ir leluoks, i,
  sapr\u016btams, ka \u0161koluotuojam daudz v\u012bg\u013cuok ir struoduot ar b\u0101rnu,
  kurs ir izturiejs konkursu i de\u013ctam ir stypri motiv\u0101tuoks. Tok ir ari
  taidys n\u016bdalis, kur nav konkurencis na tik R\u0113zekn\u0113, bet i Latvej\u0101
  k\u016bpum\u0101, p\u012bm\u0101ram, var redz\u0113t, ka jaun\u012b\u0161im ir mozuoka
  interese par tekstilmuokslu, metalmuokslu, ari k\u016bkamatn\u012bceibu jaun\u012b\u0161i
  eipa\u0161i naizalosa.\u201d Krist\u012bne Binduka ari pastreipoj, ka kulturizgleiteibys
  \u012bstuod\u0113 audzynuo\u0161onys l\u012btys vys\u0101 atsa\u0161kir nu vyspuorizgleitoj\u016b\u0161\u016bs
  \u0161kolu \u2013 kulturizgleiteib\u0101 \u0161kol\u0101ni sajam na tik zynuo\u0161onys
  par zeimie\u0161onu, gleznuo\u0161onu, \u0161yu\u0161onu i tt., tok teik vuiceita
  ari lobys gaumis izjiuta, kas \u012bt paraleli ar att\u012bksmi pret va\u013csti,
  sab\u012bdreibu i sevi po\u0161u. \u201cMyusu \u0161kol\u0101 dorbs ar audzieknim
  ir daudzreiz individualuoks i t\u016b jiut ari po\u0161i audziekni. Ari vacuoki,
  kurim varbyut ir \u0161vuorbys, kur sovu b\u0101rnu \u201claist\u201d piec deveituos
  klasis, b\u012b\u017ei izalosa tai\u0161ni myusu \u0161kolu de\u013c juos individualuos
  p\u012bejis. Mes c\u012b\u0161i b\u012b\u017ei ari redzim piecteceibu \u2013 vuiceit\u012bs
  \u012bt myusu absolventu b\u0101rni, kuri att\u012bceigi turpynoj izgleiteibu konservatorej\u0101
  voi akademej\u0101, brauc iz uorzemem, taipat ari atsagr\u012b\u017e pi myusu i
  struodoj kai \u0161koluotuoji.\u201d\\n\u201cSapr\u016btams, ka nu suoku puormainis
  vysus b\u012bdynuoja, tok niu mums ir svareigi natier\u0113t energeju iz kaidu seikumu,
  ir juopuorkuop par kasd\u012bnys rutinai i juosaver iz pr\u012b\u0161ku, iz atteisteibu.
  Myusu \u0161kolys sauklis ir \u201cIzce\u013cam talantus\u201d, i pi tuo mums ari
  juostruodoj,\u201d stuosta Raimonds Arbid\u0101ns.\\nSovpus Krist\u012bne Binduka
  p\u012bbi\u013cst, ka RMDS jubilej\u0101 byus vareiba apsav\u0113rt publisk\u016b
  izstuodi Latgolys viestn\u012bceib\u0101 \u201cGors\u201d, bet absolventu saliduojumu
  \u0161kol\u0101 \u012bvadeis m\u016bdis skate, kura teik organiz\u0101ta kotra saliduojuma
  p\u012bcgad\u0113. Diplomdorbu kolekcejis byus kai eisa \u012bsavier\u0161ona \u0161udi\u0146d\u012bnys
  skaistuma izpratn\u0113. Interesanti, ka pasuokumu vadeis Kristaps Vi\u0161s, kurs
  ir RMDS absolvents i ari niulinejais muzykys strukturv\u012bneibys pasn\u012bdziejs.\\n26.
  oktobr\u012b sevkurs ir aicynuots iz svineig\u016b p\u012bjim\u0161onu i izstuodis
  \u201cSkolot\u0101js\u201d atkluo\u0161onu 15 stu\u0146d\u0113s Latgolys viestn\u012bceib\u0101
  \u201cGors\u201d. It\u016breiz RMDS jubilejis izstuod\u0113 g\u016bdynuos i izce\u013cs
  pedagogu \u012bgu\u013cdejumu muokslys izgleiteib\u0101 i l\u016bmu jaunajuos muokslin\u012bku
  paaudz\u0113s. Byus apsaverami beju\u0161\u016bs i as\u016b\u0161\u016bs RMDS pedagogu,
  taipat i absolventu, kas palyku\u0161i par muokslys j\u016bmu \u0161koluotuojim,
  muokslys dorbi. Sov\u0101 daudzveideib\u0101 j\u012b atkluos \u0161kolu caur laika
  ritiejumu.\\nPiec svineiguos p\u012bjim\u0161onys izstuod\u0113 vysi absolventi
  tiks sagaideiti RMDS telpuos (Bazneicys \u012bl\u0101 34, R\u0113zekn\u0113), kur
  nu 18 stu\u0146\u017eu n\u016btiks absolventu saliduojums (daleibys moksa \u2013
  10 eiro). T\u012b byus vareiba satikt sovus \u0161koluotuojus, \u0161kolys laika
  b\u012bdrus i apsav\u0113rt izstuodis \u201c\u0160koluotuojs\u201d \u016btru ekspoziceju.
  \u012asaras\u0161ona absolventu vokor\u0101 ar kluot\u012bnis registraceju gostu
  gruomot\u0101 byus varama nu 17 stu\u0146\u017eu. Absolventi teik aicynuoti aiz
  laika, da 21. oktobra, registr\u0113t\u012bs digitalaj\u0101 gostu gruomot\u0101,
  kas atr\u016bnama ITE.\\nNu \u0161kolys viesturis\\nR\u0113zeknis Muokslys i dizaina
  vysd\u0161kolys dzim\u0161onys laiks ir 1959. gods, kod Reigys l\u012bti\u0161kuos
  muokslys vyds\u0161kola attaiseja filiali Latgolys Kulturviesturis muzeja telpuos.
  Suokum\u0101 tei dorbuojuos ar divejom n\u016bda\u013com \u2013 Latgolai tradicional\u016b
  keramiku i t\u016blaik p\u012bpraseit\u016b dekorativ\u016b n\u016bformie\u0161onu.
  Leluokais n\u016bpalns \u0161kolys tap\u0161on\u0101 ir Voldem\u0101ram Kalpi\u0146am,
  ar kuru leidza struoduoja Juo\u0146s Puj\u0101ts, Leons Toma\u0161ickis, Imants
  \u017d\u016bri\u0146\u0161. Filialis vadeibu uzaj\u0113me v\u0101luok labi zynomais
  akvare\u013cgleznuotuojs Juo\u0146s Unda.\\n1969. god\u0101 \u0161kola palyka par
  R\u0113zeknis L\u012bti\u0161\u0137uos muokslys vyd\u0161kolu. Izgleiteibys \u012bstuodis
  jaunuo s\u0101ta tyka izcalta 1980. god\u0101, kod s\u016bpluok suoce dorbuot\u012bs
  ari B\u0101rnu muokslys \u0161kola. 1993. god\u0101 \u0161kola tyka reorganiz\u0101ta
  par R\u0113zeknis Muokslys koled\u017eu, pie\u010duok \u2013 par R\u0113zeknis Muokslys
  i dizaina vyds\u0161kolu (RMDV). Piecteceibu t\u012bpat R\u0113zekn\u0113 RMDV absolventim
  n\u016bdr\u016bsynoj Latvejis Muokslys akademejis Latgolys filiale i R\u0113zeknis
  Tehnologeju akademeja.\"", "\"Pi myusim Latgol\u0101! \u2013 14.02.2014. i 15.02.2014.\\nP\u012bduovojam
  n\u016bsaklauseit producentu grupys SIA \u201cLieti\u0161\u0137\u0101 Latgale\u201d
  taiseit\u016bs raidejumus \u201cPi myusim Latgol\u0101!\u201d.\\nP\u012bktd\u012bnis
  raidejum\u0101 teik n\u016bskaidruots, cik daudz jaunizveiduotuo va\u013cdeiba d\u016bmoj
  par Latgolu.\\nSastd\u012bnis raidejum\u0101 var izzynuot, kur vaicuojama folklorys
  k\u016bpys \u201cCeiruleits\u201d p\u012bv\u012bnuotuo vierteiba.\\nRaidejums \u201cPi
  myusim Latgol\u0101\u201d niu skan\u0113s radej\u0101 \u201cEf-Ei\u201d (FM 91,4
  R\u0113zekne) i \u201cDivu krastu radio\u201d (FM 96,9 J\u0101kubpi\u013cs, FM 90,1
  Daugovpi\u013cs):\\ncat\u016brtd\u012bn\u0113s 17:30, ar atkuortuojumim p\u012bktd\u012b\u0146
  10:30 i 19:30, sastd\u012b\u0146 11:00 viesteis par kulturys aktualitatem;\\np\u012bktd\u012bn\u0113s
  18:30, ar atkuortuojumu sastd\u012b\u0146 13:00 \u2013 nedelis aktualitatis;\\nsastd\u012bn\u0113s
  16:00, ar atkuortuojumu sv\u0101td\u012b\u0146 16:00 \u2013 nedelis interveja.\\n\u0112ter\u0101
  izskanieju\u0161\u016b raidejumu \u201cPi myusim Latgol\u0101\u201d klaus\u012bs
  ari latgale.lv, lakuga.lv,lietiskalatgale.lv.\\nRaidejuma veiduotuojim var sekuot
  ari socialaj\u016bs teikl\u016bs draugiem.lv i facebook.\"", "\"Latgolys \u016atrais
  kongress 1917. goda decembr\u012b\\nRoksta autors: J\u0101nis \u0160ili\u0146\u0161,
  viesturis zynuot\u0146u doktors, Latvejis Va\u013csts viesturis arhiva golvonais
  pietn\u012bks\\nCe\u013c\u0161 iz Latvejis viesturisk\u016b n\u016bvodu apv\u012bnuo\u0161onu
  beja vysai gars. Jau 19. godu symta \u016btraj\u0101 pus\u0113 jaunlatv\u012b\u0161i
  \u012br\u016bsynuoja sadaleit Vydzemis guber\u0146u, kur\u0101 \u012btylpa gon myusu
  d\u012bnu Vydzeme, gon Igauneja, i administrativi apv\u012bnuot ar K\u016brzemis
  guber\u0146u (tuos sastuov\u0101 beja K\u016brzeme, Zemgale i Sieleja). Pr\u012bk\u0161stots
  par Latvejis (tai latv\u012b\u0161u apdzeivuotuos zemis suoce saukt 19. godu symta
  60. god\u016bs) austrumu r\u016bbe\u017eim gon beja vysai naskaidrs.\\nLatgola t\u016blaik
  \u012btylpa Kr\u012bvejis imperejis Vitebskys guber\u0146\u0101 i dzeivuoja \u0161kierti
  nu tai sauktajom \u201cBaltejis guber\u0146om\u201d (K\u016brzemis, Vydzemis i Igaunejis).
  Latgol\u0101 dzeivoj\u016b\u0161\u016bs latv\u012b\u0161us parosti sauce par \u201cVitebskys
  latv\u012b\u0161im\u201d, i par jim tautiskuos atm\u016bdys laik\u0101 vydzemn\u012bki
  i k\u016brzemn\u012bki interes\u0113juos vysai moz. Latgol\u0101 beja cyts etniskais
  sastuovs, religeja, saimin\u012bkuo\u0161onys tradicejis, i pastuov\u0113ja ari
  \u201cdrukys aizl\u012bgums\u201d (l\u012bgums izmontuot lati\u0146u alfabetu).
  19. i 20. godu symta mej\u0101 Latgolys puorstuovu (\u012bv\u0101ruojamuokais nu
  j\u016bs beja Fra\u0146cs Trasuns) p\u012bsadalei\u0161ona Reigys Latv\u012b\u0161u
  b\u012bdreibys organiz\u0101tajuos vosoryys sapu\u013cc\u0113s beja ko\u010d kas
  eksotisks. J\u012b stuosteja par stuov\u016bkli Latgol\u0101 i raudzeja atguodynuot,
  ka austrum\u016bs nu Aiv\u012bkstis dzeivoj lela latv\u012b\u0161u tautys da\u013ca.
  De\u013c daudzu \u201cmuomu\u013cn\u012bku\u201d* tys beja puorsteigums. Fra\u0146cs
  Kemps, acimradz\u016bt gon nadaudz puorspeilej\u016bt, par it\u016b laikmatu v\u0101luok
  raksteja: \u201cLatgola tyka \u201catkluota\u201d kai sov\u0101 laik\u0101 Kolumbs
  atkluoja Ameriku. Bet nikaidys pr\u012bcys par it\u016b atkluo\u0161onu nabeja,
  pavysam \u016btrai\u017ei: latv\u012b\u0161u vold\u016b\u0161\u012b veiri pat n\u016bsabeida
  i nazynuoja, k\u016b ar latgal\u012b\u0161im \u012bsuokt.\u201d\\nKara i revolucejis
  l\u012bsm\u0113s\\nPyrmais pasau\u013ca kars radikali maineja it\u016b stuov\u016bkli.
  Latgal\u012b\u0161i v\u012bsm\u012bleigi p\u012bj\u0113me K\u016brzemis bieg\u013cus;
  s\u016bpluok puorej\u016bs latv\u012b\u0161u aktivi p\u012bsadaleja bieg\u013cu
  organizaceju darbeib\u0101; tyukst\u016b\u0161om stuojuos latv\u012b\u0161u strieln\u012bku
  bataljon\u016bs (v\u0101luok pulk\u016bs). Var\u0101tu saceit, ka kara l\u012bsmis
  sakaus\u0113ja \u0161kiert\u016b latv\u012b\u0161u naceju v\u012bn\u0101 vasalum\u0101.
  Par t\u016b l\u012bcynuoja ari Pyrmais Latgolys kongress, kas rysynuojuos R\u0113zekn\u0113
  1917. goda maja suokum\u0101, napylnus div miene\u0161us piec Februara (piec jaunuo
  stila \u2013 Marta) revolucejis i cara atsasacei\u0161onys nu tr\u016b\u0146a. Latgolys
  latv\u012b\u0161u vairuokums steidz\u0113s deklar\u0113t sovu gribie\u0161onu atsadaleit
  nu Kr\u012bvejis imperejis i p\u012bsav\u012bnuot sovu taut\u012b\u0161u apdzeivuotajom
  Baltejis guber\u0146om, lai izveiduotu v\u012bnuotu, autonomu Latveju. Park\u016b
  itaida steiga? Pastuov\u0113ja cereiba, ka jaunizveiduotuo Kr\u012bvejis Pagaidu
  va\u013cdeiba, kura vysmoz vuord\u016bs deklar\u0113ja tautu po\u0161n\u016bsacei\u0161onuos
  t\u012bseibu principu, var\u0101tu \u013caut Latgolys latv\u012b\u0161im p\u012bsav\u012bnuot
  sovu tautys bruo\u013cu apdzeivuotajom teritorejom. Latgola ilgst\u016b\u0161i beja
  c\u012btuse nu kulturaluos i religiskuos apsp\u012bsteibys, nu rusifikacejis politikys.
  Na ve\u013cti nacionaluos kusteibys pr\u012bk\u0161gol\u0101 beja n\u016bsastuoju\u0161i
  kat\u016b\u013cu muoceituoji. Kr\u012bvejis revolucej\u0101 tyka saskateits ilgi
  gaideitais \u201c\u012bspieju l\u016bgs\u201d, kab eistynuotu Latgolys atsadalei\u0161onu.
  D\u012bvam\u017e\u0101\u013c ni Georgejs \u013bvovs, ni Aleksandrs Kerenskis nagrib\u0113ja
  nikuo dzierd\u0113t par Latgolys praseibom.\\nOpozicej\u0101 beja n\u016bsastuojuse
  ari da\u013ca Latgolys mozokumtauteibu \u012bdzeivuotuoju i it sevi\u0161ki \u2013
  Fra\u0146cs Kemps ar sovim p\u012bkritiejim. In\u017eeners Kemps, leidzeigi cytim
  latv\u012b\u0161im, grib\u0113ja, lai Latgola atsadola nu Kr\u012bvejis. T\u016bm\u0101r
  jis nagrib\u0113ja izreizis p\u012bsav\u012bnuot \u201cbalt\u012b\u0161im\u201d.
  Juo izpratn\u0113 Latgolu apdzeivuoja atsevi\u0161\u0137a tauta \u2013 latgal\u012b\u0161i
  (tai\u0161ni Kempa aktivitatis it\u016b vuordu padareja popularu), kurim juodaboj
  autonomeja Kr\u012bvejis sastuov\u0101 i tikai piec tam juolem par sovu tuoluok\u016b
  liktini. Pyrmaj\u0101 Latgolys kongres\u0101 Kemps i juo p\u012bkritieji c\u012bte
  pi\u013cneigu sakuovi i ar \u0161kandalu pamete tuo n\u016brisis v\u012btu.\\nKuortejuo
  varys mai\u0146a\\nPiec dzi\u013cuos vi\u013c\u0161onuos Kr\u012bvejis Pagaidu va\u013cdeib\u0101
  Latgola ar lelom cereibom uztv\u0113re zi\u0146u par kuortej\u016b varys mai\u0146u
  Petrograd\u0101. 1917. goda novembr\u012b Kr\u012bvejis golvyspi\u013cs\u0101t\u0101
  apv\u0101rsumu veica lelyn\u012bki i mudri puorj\u0113me kontroli par p\u012bfrontis
  rajonim. Tys atsat\u012bce ari iz Latgolu, kur\u0101 disloceituo Kr\u012bvejis 5.
  armeja strauji lelin\u012bciskuojuos. Tyka izveiduoti jauni varys organi, i tam\u016bs
  \u012bsastuoja daudzeji nacionali n\u016bska\u0146uoti latgal\u012b\u0161i. Sevi\u0161ki
  daudz latv\u012b\u0161u tauteibys zemn\u012bku \u012bsastuoja R\u0113zeknis pad\u016bmis
  Izpi\u013cdkomitejis zemn\u012bku sekcej\u0101. Leidzeigi kai piec cara guoz\u0161onys,
  ari it\u016breiz latgal\u012b\u0161i steidz\u0113s sasaukt kongresu piec \u012bspiejis
  mudruok, kab, kai soka, koltu dze\u013czi, cikom tei korsta.\\nJauna kongresa sasauk\u0161onu
  grib\u0113ja gon F. Kemps, gon Latgolys Pagaidu zemis pad\u016bme, kurys darbeibu
  agruokuo vara nabeja atzynuse, gon lelin\u012bki. F. Kemps naivi cer\u0113ja, ka
  jam var\u0101tu izad\u016bt Latgolys nuok\u016btni \u012bvierzeit sev v\u0101lam\u0101
  gultn\u0113, lai gon novembra beiguos n\u016btyku\u0161uos Kr\u012bvejis Satversmis
  vielie\u0161onys beja nasu\u0161ys kuortej\u016b vi\u013c\u0161on\u016bs \u2013
  Kempa atba\u013csteituoji saj\u0113me nagaideiti moz bolsu. Pagaidu zemis pad\u016bme
  i nacionali n\u016bska\u0146uot\u012b latgal\u012b\u0161i cer\u0113ja beidz\u016bt
  suokt kaidus realus s\u016b\u013cus ce\u013c\u0101 iz Latgolys p\u012bv\u012bnuo\u0161onu
  puorejai Latvejai. Sovukuort lelin\u012bki (gon Vydzemis, gon Latgolys) saskateja
  itam\u0101 kongres\u0101 \u012bspieju apl\u012bcynuot sovu \u012btekmi i dabuot
  sab\u012bdreibys papyldu atbolstu, kura Latgol\u0101 tik c\u012b\u0161i tryuka.
  P\u012bm\u0101ram, Vydzemis lelin\u012bki 1917. goda 27. novembr\u012b konstat\u0113ja,
  ka \u201cLatgol\u0101 c\u012b\u0161i moz cylv\u0101ku, kas n\u016bstuot\u016bs iz
  \u0161kirys pri\u0146cipim, juo Latgol\u0101 stypra nacionaluo kusteiba \u2013 latv\u012b\u0161u-latgal\u012b\u0161u
  kusteiba\u201d.\\n\u016atruo kongresa organizei\u0161ona\\nLai gon lelin\u012bki
  vuord\u016bs osai kritiz\u0113ja Latgolys Pagaidu zemis pad\u016bmi kai bur\u017euazisku,
  tuos darbin\u012bki beja faktisk\u012b \u016atruo Latgolys kongresa organiz\u0101tuoji.
  Par p\u012bvadumu, laikroksts \u201cLaika Domas\u201d 1917. goda 13. decembr\u012b
  skaidri n\u016bruodeja, ka kongres\u0101 p\u012bsadaleja Pagaidu zemis pad\u016bme,
  lai gon oficiali iniciativa par kongresa sasauk\u0161onu guoja nu R\u0113zeknis
  Izpi\u013cdkomitejis pusis. Kongresa Organizacejis komitej\u0101 beja vairuoki nacionali
  n\u016bska\u0146uoti latgal\u012b\u0161i: Stanislavs Kambala, Valereja Seile i P\u012bters
  Lazd\u0101ns. Kongresu atba\u013csteja ari R\u0113zeknis apri\u0146\u010da komisars
  P\u012bters L\u012bpi\u0146\u0161, kurs beja F. Kempa p\u012bkritiejs. Acimradz\u016bt
  Kemps ar juo paleidzeibu cer\u0113ja eistynuot sovu programu.\\n\u016atrais kongress
  divej\u016bs aspekt\u016bs atsa\u0161keire nu Pyrmuo Latgolys kongresa. Vysapyrma,
  tam\u0101 aicynuoja p\u012bsadaleit lelu skaitu minorita\u0161u puorstuovu \u2013
  27 kr\u012bvus (16 pareizticeig\u012b i 11 vacticeibn\u012bki), 12 ebrejus, 5 p\u016b\u013cus
  i 2 boltkr\u012bvus. Taipat aicynuoja p\u012bsadaleit vysu n\u016bzeimeiguok\u016bs
  po\u0161puorva\u013cdis, sab\u012bdrisk\u016bs i ekonomisk\u016bs organizaceju puorstuovus.
  \u016atruo \u012bviereibys c\u012bneiguo at\u0161kireiba beja kat\u016b\u013cu gareidzn\u012bku
  tryukums decembra kongres\u0101. N\u0101, tys nabeja bazneickungu boikots, kuri
  beja faktisk\u012b \u012bpr\u012bk\u0161ejuo kongresa organizatori i vadeituoji.
  It\u016breiz, kab \u201cnakaitynuotu\u201d lelin\u012bkus, beja n\u016blamts lyugt
  bazneickungus nap\u012bsadaleit itam\u0101 pasuokum\u0101. Ari po\u0161u kongresu
  demonstrativi sareikuoja sv\u0101td\u012bn\u0113. V\u0101luok, jau piec kongresa
  n\u016bsl\u0101guma, prese ar gondarejumu raksteis: \u201cV\u0113\u013c var p\u012bzeimuot,
  ka itam\u0101 Kongres\u0101 daleibu naj\u0113me niv\u012bns bazneickungs. I labi
  padareis, ka ari iz nuoku\u0161\u016b kongresu nabrauks niv\u012bns. Lai pasauleig\u012b
  po\u0161i spr\u012b\u017e par Latgolys nuok\u016btni.\u201d\\nKongresa pyrmuo d\u012bna\\nVitebskys
  gubrenis latgal\u012b\u0161u apri\u0146\u010du pad\u016bmu kongress aba v\u012bnkuor\u0161i
  \u016atrais Latgolys kongress saguoja R\u0113zekn\u0113 1917. goda 16. decembr\u012b
  (piec vacuo stila 3. decembr\u012b). Pavysam iz t\u016b beja \u012bsarodu\u0161i
  345 delegati nu Daugovpi\u013cs, R\u0113zeknis i Ludzys apri\u0146\u010dim. Beja
  \u012bsarodu\u0161i ari Vydzemis puorstuovi \u2013 55 delegati. J\u016bs vyd\u0101
  beja treis leln\u012bciskuos Latvejis Pad\u016bmis (Iskolata) puorstuovi, kurys
  r\u016bkuos atsaroda diktatoriskuo vara Vydzem\u0113.\\nKongresa n\u016brisi 13
  stu\u0146d\u0113s atkluoja komisars P. L\u012bpi\u0146\u0161. Nuoku\u0161ais d\u012bnys
  kuorteibys punkts beja kongresa pr\u012bk\u0161s\u0101d\u0101tuoja vielie\u0161onys.
  Tys izraiseja lelu konfliktu, kuru ar lelom pyulem izadeve atrysynuot tikai desmit
  stu\u0146d\u0113s vokor\u0101, \u201ckod kongress beja pi\u013cneigi n\u016bgurs\u201d.
  Vysapyrma F. Kempa p\u012bkritieji nagrib\u0113ja atzeit sovu pretin\u012bku puorstuova
  Juo\u0146a Rubu\u013ca uzvaru. Kemps beja pasaryupejs par t\u016b, kab bolsuo\u0161onys
  rezultatus apk\u016bpuotu juo p\u012bkritieji, bet div bolsu p\u012btryuka, kab
  uzvar\u0101tu j\u016bs kandidats P. L\u012bpi\u0146\u0161.\\nNavar\u016bt n\u016bm\u012br\u0113t
  satrokuot\u016bs kongresa dalin\u012bkus, Rubu\u013cs atsauce sovu kandidaturu.
  \u201cPiec ilga tr\u016bk\u0161\u0146a\u201d par nuoku\u0161\u016b kandidadtu izvierzeja
  vydzemn\u012bku puorstuovi, Iskolata l\u016bcekli V\u012bksni\u0146u. Ari jis bolsuo\u0161on\u0101
  \u012bveice L\u012bpi\u0146u. Kempisti otkon suoce skali kl\u012bgt, apvainoj\u016bt
  V\u012bksni\u0146u, ka jis as\u016bt vyltvuords i jam naas\u016bt vajadzeig\u016bs
  pylnvaru, kab kandid\u0101tu iz kongresa pr\u012bk\u0161s\u0101d\u0101tuoja omotu.
  Cyti skali lomuoja L\u012bpi\u0146u. Prese v\u0101luok raksteja, ka cylv\u0101ku
  tr\u016bk\u0161\u0146uo\u0161onu naas\u016bt varieju\u0161i aptur\u0113t i \u201cstuov\u016bklis
  bejs taids, ka kotr\u0101 breid\u012b var\u0113ja n\u016btikt kau\u0161onuos\u201d.
  Lai n\u016bm\u012brynuotu delegatus, kongresu iz div stu\u0146\u017eu puortrauce.
  Golu gol\u0101 v\u0101l\u0101 vokor\u0101 par kongresa pr\u012bk\u0161s\u0101d\u0101tuoju
  \u012bviel\u0113ja F. Kempa p\u012bkritieju minorita\u0161u puorstuovi Mali\u0161enko.
  Kongresa prezidej\u0101 nu kotra apri\u0146\u010da \u012bviel\u0113ja v\u0113\u013c
  treis puorstuovus. J\u016bs vyd\u0101 beja gon lelin\u012bki, gon nacionali n\u016bska\u0146uoti
  latgal\u012b\u0161i.\\nKongresa \u016btruo d\u012bna\\n\u016atruo kongresa d\u012bna
  suoc\u0113s tai, it kai vysi byutu aizmiersu\u0161i par vakard\u012bnys nasaska\u0146om
  \u2013 prese raksteja, ka kongres\u0101 \u201cva\u013cdeja m\u016b\u017es gorastuov\u016bklis\u201d.
  Delegati v\u012bnuojuos par apsveikuma telegramys n\u016bsyutei\u0161onu Kr\u012bvejis
  pad\u016bmu va\u013cdeibai. Sekuoja V\u012bksni\u0146a referats par tuos \u0161a\u013cts
  politisk\u016b stuov\u016bkli. \u201cUorkuorteigi tr\u016bk\u0161\u0146ain\u0101
  kongres\u0101 \u012bsastuoja kopa klusums.\u201d Nacionali n\u016bska\u0146uot\u012b
  delegati ce\u0146t\u0113s tur\u0113t sovys emocejis pi sevis, kab otkon naizjauktu
  kongresa gaitu. J\u012b cer\u0113ja, ka lelin\u012bki beidz\u016bt var\u0101tu paleidz\u0113t
  Latgolu atdaleit nu Kr\u012bvejis. De\u013ctuo piec V\u012bksni\u0146a referata,
  daudzim par puorsteigumu, nikaidys debatis nasasuoce. Vuordu gon j\u0113me komisars
  L\u012bpi\u0146\u0161, kurs deve muoj\u012bni, ka V\u012bksni\u0146a \u012bsn\u0101gtuo
  rezoluceja \u201ckliboj\u016bt\u201d. Iz t\u016b delegati nu z\u0101lis atsaceja
  ar sauc\u012bnim: \u201cTu pats kliboj!\u201d Nikaida tuoluoka rezolucejis kritika
  nasekuoja, i t\u016b gondrei\u017e v\u012bnbolseigi kongress p\u012bj\u0113me.\\nTurpynojum\u0101
  kongress apspr\u012bde po\u0161u svareiguok\u016b d\u012bnyskuorteibys punktu \u2013
  Latgolys atsadalei\u0161onu nu Kr\u012bvejis i potencial\u016b p\u012bsav\u012bnuo\u0161onu
  Latvejai. Vysapyrma ar referatu par it\u016b vaicuojumu otkon uzastuoja V\u012bksni\u0146\u0161.
  Sekuoja c\u012b\u0161i osys debatis. L\u012bpi\u0146\u0161 i Kemps pazi\u0146uoja,
  ka j\u012b ari as\u016bt lelin\u012bki. Bet j\u016bs uzskoti \u012bv\u0101rojami
  atsa\u0161keire \u2013 piec j\u016bs d\u016bmu, Latgolu apdzeivoj\u016bt atsevi\u0161\u0137a
  tauta (\u201clatgal\u012b\u0161i\u201d) i tuos apdzeivuotuos teritorejis p\u012bv\u012bnuo\u0161ona
  Latvejai as\u016bt puoragra. Prese raksteja, ka itamuos debat\u0113s \u201ckempisti
  paruodeja sovu eist\u016b geimi. Ar kl\u012bg\u0161onu i lomuo\u0161on\u016bs teik
  izbeigtys debatis, i teik \u012bsn\u0101gtys div rezolucejis, v\u012bna nu referenta,
  \u016btra nu Kempa kunga pusis\u201d. Komisars L\u012bpi\u0146\u0161 gondrei\u017e
  voi rauduodams lyudz\u012bs kr\u012bvus i ebrejus atba\u013csteit j\u016bs poziceju.
  T\u016bm\u0101r ari it\u016breiz Kempa n\u016bmetne p\u012bdzeivuoja kaunpylnu sakuovi.
  Par Latgolys atsadalei\u0161onu nu Kr\u012bvejis i p\u012bsav\u012bnuo\u0161onu
  Latvejai n\u016bbolsuoja 202 delegati. Pret beja 74, bet atsatur\u0113ja 14. Aizasirdejs
  Kemps, leidzeigi kai Pyrmuo Kongresa laik\u0101, pamete tuo n\u016brisis v\u012btu.\\nAr
  Kempa aiz\u012b\u0161anu kongresa n\u016brise napalyka m\u012breiguoka. Pie\u0161ki
  naz nu kur\u012bnis (varbyut Kempa syuteits) \u012bsaroda 5. armejis Revolucionaruos
  kara komitejis pr\u012bk\u0161s\u0101d\u0101tuojs, kurs pazi\u0146uoja, ka 30 000
  veiru lelais R\u0113zeknis garnizons naatzeist\u016bt kongresa n\u016brisi i vysim
  juoizkleist. Delegatu reakceju iz itaidu pazi\u0146ojumu mes varim v\u012bgli \u012bsad\u016bmuot
  \u2013 suoc\u0113s tik lels tr\u016bksnis, ka armejis puorstuovs beja sp\u012bsts
  atsavai\u0146uot par sovu puordr\u016b\u0161\u016b pazi\u0146ojumu i steidzeigi
  pamest nav\u012bsm\u012bleiguos telpys. Piec tam Kempa atba\u013csteituoji, kuri
  nabeja sekuoju\u0161i sova lidera aiz\u012b\u0161onai, otkon sac\u0113le lelu tr\u016bksni
  i j\u016bs izadeve n\u016bm\u012brynuot vi\u0146 ar lelom pyulem.\\nP\u0101dejuo
  Kempa n\u016bmetnis cereiba tyka lykta iz leluokys \u012btekmis dabuo\u0161onu Latgolys
  Pad\u016bm\u0113, kuru kongress \u012bviel\u0113ja Latgolys Pagaidu zemes pad\u016bmis
  v\u012bt\u0101. Pavysam tuos sastuov\u0101 beja 36 l\u016bcekli (pa 12 nu kotra
  apri\u0146\u010da). Kempisti raudzeja dabuot lauku pogostu puorstuovu nap\u012blais\u0161onu
  pad\u016bmis vielie\u0161onuos: \u201cLai lobuok zemn\u012bki brauc\u016bt iz s\u0101tu.\u201d
  J\u012b labi zynuoja, ka tai\u0161ni lauku pogostu dzeivuotuoji beja leluok\u012b
  apsav\u012bnuo\u0161onys ar Latveju atba\u013csteituoji. T\u016bm\u0101r ari it\u016breiz
  Kempa n\u016bmetne p\u012bdzeivuoja zaudiejumu, nasaver\u016bt iz draudim i lomuo\u0161on\u016bs.\\nGolu
  gol\u0101 Latgolys Pad\u016bme tyka \u012bv\u0101l\u0101ta (nuoku\u0161aj\u0101
  d\u012bn\u0101 \u012bviel\u0113ja ari tuos Izpi\u013cdkomiteju). Kongress ari izdeve
  veikt pr\u012bk\u0161dorbus Latgolys atdalei\u0161onai nu Kr\u012bvejis i jauna
  kongresa sasauk\u0161onai 1918. goda janvara vyd\u0101, kab oficiali n\u016bform\u0101tu
  Latgolys apsav\u012bnuo\u0161onu ar puorej\u016b Latveju. Taipat kongress n\u016bl\u0113me
  izveiduot Latgol\u0101 sorkon\u016b gvardi aizmuguris apsorguo\u0161onai pret laupeituoju
  bandom.\\nPiec kongresa\\nPiec \u016atruo Latgolys kongresa n\u016bsl\u0101guma
  iz Petrogradu dev\u0113s latgal\u012b\u0161u zaldatu i matro\u017eu delegaceja.
  Tai beja izd\u016bts \u012bsn\u0113gt pad\u016bmu va\u013cdeibai Aloiza Boj\u0101ra
  sastuodeitu lyugumrokstu par latgolys atdalei\u0161onu nu Vitebskys gubernis, kai
  ari kongresa p\u012bjimtuos rezolucejis. Matr\u016b\u017eam Zn\u016bti\u0146am,
  kurs vadeja delegaceju, izadeve \u012bsn\u0113gt vysus dokumentus \u012ak\u0161l\u012btu
  tautys komisariat\u0101. 27. decembr\u012b komisariats izdeve reikojumu Nr. 92 par
  Daugovpi\u013cs, Ludzys i R\u0113zeknis apri\u0146\u010du atdalei\u0161onu nu Vitebskys
  gubernis. Latgal\u012b\u0161u ilgi gaideitais i ar lelom gryuteibom izceineitais
  mierkis beja sasn\u0101gts. Piec \u010detru d\u012bnu delegaceja atsagr\u012bze
  ar myn\u0101t\u016b l\u0101mumu R\u0113zekn\u0113.\\nLatgolys Pad\u016bme turpynuoja
  dorbuot\u012bs leidz 1918. goda janvaram. Latgal\u012b\u0161i p\u012bsadaleja Latvejis
  Struodn\u012bku, zaldatu i bezzemn\u012bku deputatu pad\u016bmu II kongres\u0101
  Valm\u012br\u0101. Iskolats sn\u0113dze gon materialu, gon organizatorisku atbolstu
  Latgolys Pad\u016bmei, gatavej\u016bt\u012bs obu n\u016bvodu apv\u012bnuo\u0161onai.
  T\u016bm\u0101r leidz faktiskai vysys Latvejis apv\u012bnuo\u0161onai beja juogaida
  v\u0113\u013c gondrei\u017e vasals gods. 1918. goda janvara Latgolys kongress tai
  ari nan\u016btyka, part\u016b ka tuo reikuo\u0161ona aizakav\u0113ja leidz Vuocejis
  armejis ofensivai februar\u012b.\\nGolu gol\u0101 Latvejis apv\u012bnuotuoji beja
  navys lelin\u012bki, bet gon Latvejis Tautys Pad\u016bme i K\u0101r\u013ca Ulma\u0146a
  Pagaidu va\u013cdeiba 1918. goda novembr\u012b, kas p\u012bj\u0113me i suoce dzeiv\u0113
  eistynuot att\u012bceigus l\u0101mumus.\\n*Muomu\u013cn\u012bks \u2013 Reigys latv\u012b\u0161u
  b\u012bdreibys b\u012bdrs, sab\u012bdriskys darbin\u012bks (leidz Pyrmajam pasau\u013ca
  karam)\\nKarteit\u0113s R\u0113zeknis pi\u013cs\u0101tys skoti 20. godu symta suokum\u0101,
  Latgolys Kulturviesturis muzeja kruojums.\"", "\"Kristaps Rasims i juo dorbi goda
  gr\u012bzum\u0101:\\n1. Raidiejumu cykla \u201cApce\u013co Latgolu ar Kristapu Rasimu\u201d
  \u012btvor\u0101, jis ar popularom Latvejis personeibom gasteja vysaiduos Latgolys
  v\u012btuos.\\n2. Raidiejum\u0101 latgaliski runuot ci sadz\u012bduot tyka mudynuoti
  taidi zynomi muokslin\u012bki kai Dons, Andris Bulis, Ralfs Eilands i cyti.\\n3.
  Juo darbeiba ar grupu \u201cBez PVN\u201d \u2013 koncerti, videoklips.\\n4. Daudzu
  pasuokumu vadei\u0161ona latgaliski, radzamuok\u012bs nu t\u012bm, \u201cLatgal\u012b\u0161u
  vol\u016bdys nakts\u201d \u012btvor\u0101.\\n5. Jezupa l\u016bmys atveiduotuojs
