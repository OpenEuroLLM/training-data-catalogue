  juobyut leidzsvor\u0101. Repertuar\u0101 juobyut dz\u012bsmem, kas ir vysim zynomys,
  tyma skait\u0101 tautysdz\u012bsmis. Mes te, \u0161kol\u0101, runuojom ari par t\u016b,
  ka nu nui, cik var dz\u012bduot \u201eKraukl\u012bts s\u0113\u017e ozol\u0101\u201d
