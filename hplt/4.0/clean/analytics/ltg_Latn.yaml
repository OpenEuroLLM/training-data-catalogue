  dzej\u016b\u013cu rokst\u0101 \u201cDZEJA. T\u0101raudu Ingrida: \u201c..ka var
  byut i tai\u201d\u201d.\"", "\"Sab\u012bdrisk\u016bs medeju sv\u0101tku studej\u0101
