  2015. god\u0101 atba\u013csteitais projekts \u201cNu reite\u0146a caldamuos\u2026
  Sievie\u0161u koris \u201eMedicus\u201d R\u0113zeknei\u201d. Foto nu \u201cMedicus\u201d
  arhiva.\"", "\"dasad\u016brt vacim failim ir kai dasad\u016brt se\u0146 pagaisu\u0161am
