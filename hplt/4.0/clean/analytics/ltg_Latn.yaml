  j\u012b \u012bsavuiceis. Tys ir v\u012bns. Sovpus par tom sare\u017egeitajom dz\u012bsmem
  ir tai, ka kors suokum\u0101 pukst i nasapr\u016bt, redz\u012bs, ka gryuts i tai,
