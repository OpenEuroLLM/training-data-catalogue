  iray impormasyon ya ipapasen ya personal ya data. Say terminon \u201cpersonal ya
  data\u201d ya nausar ed sayan Totontonen et ontutukoy ed saray impormasyon a singa
  say ngaran, e-mail address, address, numero na telepono, odino arum nin data ya
  nausar a pakabidbiran ed sika. Agla kaukolan so pangiter moy personal ya impormasyon
  no onla kad saray page na sayan website ya parad publiko. Kaiba ed tutukoyen ya
  \u201cwebsite\u201d iyan mismon website tan arum nin website mi, a singa say apps.jw.org,
  tv.jw.org, stream.jw.org, tan wol.jw.org.\\nIMPORMASYON ED DATA CONTROLLER\\nSayan
  website et kayarian na Watchtower Bible and Tract Society of New York, Inc. (\u201cWatchtower\u201d),
  sakey ya korporasyon ed New York ya aliwan parad negosyo tan onsusuporta ed saray
  aktibidad na Saray Tasi nen Jehova tan ed gagawaen dan panagbangat na Biblia. No
  nandesisyon kan man-open na account, mangiter na donasyon, man-request na panagaral
  na Biblia ya anggapoy bayar, odino antokaman so gawaen mon mankaukolan ya iter moy
  personal ya data, onaabuloy ka sirin ed sayan Totontonen, pati ed pangi-save mid
  satan ya data ed saray server ya walad United States of America tan ed pangala,
  pan-process, pangi-transfer, tan pangi-save ed personal a data ya inter mod Watchtower
  tan saray mitutulongan ya organisasyon ya onsusuportad Saray Tasi nen Jehova ed
  nanduruman bansa, tan gawaen mi labat iratan no kaukolan pian na-process so request
  mo. Say relihyoson organisasyon mi et walaan na saray nanduruman lokal ya ahensia
  ed interon mundo. Pian naprotektaan iray data, nayarin kaibad saraya iray lokal
  ya kongregasyon, branch office, tan arum nin mitutulongan ya organisasyon na Saray
  Tasi nen Jehova.\\nNanduruma iray data controller parad inter mon personal ya data,
  depende ed no antoy gawaen mo ed website mi. Singa bilang, no mandonasyon ka ed
  sakey a legal ya ahensia mi diad sakey a bansa, say ngaran tan contact information
  mo so iter ed satan ya legal ya ahensia pian usaren itan legan kan mandodonasyon.
