  toy totugtogen to odino igapo tod sakey a sonata kasanlilikna sananey lay isosuldong
  to.\\nMagmaalem so linawa ran sinmingger ed samay sa key a koral ta mapagpaga ran
  wadmay asawa ton may buayan inatey; et napnapnek so linawa ra ta kapag itagey day
  iket napnoy sira.\\nSi Tia Isabel so manggagangan a kuanto:\\n\u201cSatay ayungin
  mananam ya isegang; satay bonor para iskabitsi; say dalag tan bulanbulan ipisa.
