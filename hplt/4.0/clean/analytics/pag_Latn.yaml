sample: '["\"Antoy nagawad sikatayo no ompatey itayo?\\nAkin et ompapatey itayo?\\nNaikdan
  tayo kasi ilalo no naamtaan tayoy tua nipaakar ed patey?\\n1-3. Anto ray tepet na
  totoo nipaakar ed patey, tan anto ray ebat na nanduruman relihyon?\\nABAYBAYAG lan
  itetepet iratan na totoo. Importante iratan a tepet. Amin tayo et labay tayon naamtaan
  so ebat ed saratan.\\n2 Diad Kapitulo 5, inaral tayo no panon a say insakripisyo
  nen Jesu-Kristo ya bilay to so angiter ed sikatayo na ilalon manbilay ya tuloytuloy.
  Naamtaan tayo met so ibabaga na Biblia ya onsabi panaon et \u201canggapo lay patey.\u201d
  (Apocalipsis 21:4) Balet natan et ompapatey itayo nin amin. \u201cSaray mabilay
  et amta ra ya ompatey ira,\u201d so imbaga na matalinon Ari ya si Solomon. (Eclesiastes
  9:5) Labalabay tayon anggad posible et ondukey ni bilay tayo. Balet, siansian iisipen
  tayo no anto kasi nagawad sikatayo no ompatey itayo.\\n3 No ompatey iray inad-aro
  tayo, talagan maermen tayo. Tan nayarin nitepet tayo: \u2018Anto la kasi nagagawad
  sikara? Maniirap ira kasi? Babantayan da tayo kasi? Kasin natulongan tayo ra? Kasin
  nanengneng tayo lamet ira?\u2019 Nandurumay ebat na saray relihyon ed saratan a
  tepet. Wala ray mangibabagan no maong kan too, onla kad tawen balet no mauges ka,
  napoolan kad impierno. Ibabangat na arum a relihyon ya no walay ompatey, sikatoy
  onlad kawalaan na saray espiritu pian nakaiba to ray abaybayag lan inatey ya kapamilya
  tan kakanayon to. Ibabangat balet na arum ni ran relihyon ya no say sakey et ompatey,
  onlad mundo na inaatey pian diman naukom, insan sikatoy onalis-alis odino iyanak
  lamet ed sananey a laman.\\n4. Antoy pareparehon ibabangat na dakel a relihyon nipaakar
  ed ipapatey?\\n4 Nanduruma so ibabangat na saray relihyon balet saksakey so ideya
  ra\u2014walay walad sikatayo ya tuloytuloy nin manbilay anggano ompatey so pisikal
  a laman tayo. Ibabaga na amin lawarin relihyon nensaman tan natan, ya tuloytuloy
  tayo ni kunon manbilay ya makanengneng, makadngel, tan makapannonot. Balet, panon
  itan ya nagawa anta say pakalikna, pakadngel, pakanengneng, pakaangob, tan pakataway,
  pati say panagnonot et konektado ed utek? No ompatey so sakey, agla ongganay utek
  to. Say memorya, liknaan, tan amin a parte na laman tayo et agmisteryoson onggana
  ya bukor. Ontunda la iratan no agla onggaganay utek tayo.\\nANTON TALAGAY NAGAGAWA
  NO OMPATEY SO TOO?\\n5, 6. Antoy ibabangat na Biblia nipaakar ed kipapasen na saray
  inaatey?\\n5 Si Jehova, say nanggawa na utek na too, et aliwan misteryo ed sikato
  so nagagawad ipatey na too. Amta to no antoy tua, tan diad Salita to, say Biblia,
  et impaliwawa to so kipapasen na saray inaatey. Oniay malinew ya ibabangat na satan:
  No ompatey so too, sikatoy ontunda lan manbilay. Say patey so kabaliktaran na bilay.
  Saray inaatey et agmakanengneng, agmakadngel, tan agmakapan-isip. Anggapoy kabiangan
  tayo ya tuloytuloy nin manbilay no ompatey tayo. Anggapoy imortal ya kamarerwa odino
  espiritu tayo. *\\n6 Imbaga nen Solomon ya \u201csaray mabilay et amta ra ya ompatey
  ira, balet saray inatey et anggapon balot so amta ra.\u201d Insan to impaliwawa
  itan nen imbaga ton saray inatey et agda la nayariay mangaro odino manbusol tan
  \u201canggapo so kimey odino plano odino kakabatan odino karunongan diad Lubok.\u201d
  (Basaen so Eclesiastes 9:5, 6, 10.) Ibabaga met na Salmo 146:4 ya no ompatey so
  too, \u201cnaandi so nonot to.\u201d Aliwa itayon imortal tan ag-itayo tuloytuloy
  a manbilay no ompatey so laman tayo. Say bilay tayo et singa apoy na kandila. No
  naerep so apoy, ag-itan onlad sananey a lugar. Anggapo la itan.\\nNO ANTOY IMBAGA
  NEN JESUS NIPAAKAR ED PATEY\\n7. Panon ya impaliwawa nen Jesus so nipaakar ed kipapasen
  na saray inaatey?\\n7 Walay imbaga nen Jesus ed saray disipulo to nipaakar ed kipapasen
  na saray inaatey. Nen inatey so kabkabat ton si Lazaro, imbaga to: \u201cSay kaaro
  tayon si Lazaro et naugip.\u201d Say atalosan na saray disipulo ed imbaga nen Jesus
  et naugip labat si Lazaro, manpapainawa ta mansasakit. Aliway atalosan da. Oniay
  impaliwawa nen Jesus: \u201cInatey lay Lazaro.\u201d (Basaen so Juan 11:11-14.)
  Imanoen ya inkompara nen Jesus so patey ed ugip. Aglinmay Lazaro ed tawen odino
  diad mandarlang ya impierno. Agto apinengnengan iray anghel odino saray kakanayon
  ton abayag lan inatey. Si Lazaro et ag-inyanak lamet bilang sananey a too. Imbes,
  sikatoy nampainawa ed patey, ya singa araldalem so ugip to. Inkompara na arum nin
  teksto so patey ed ugip. Singa bilang, nen tinupak anggad inatey so disipulon si
  Esteban, imbaga na Biblia ya sikatoy \u201cnaugip.\u201d (Gawa 7:60) Ontan met,
  insulat nen apostol Pablo ya wala ray totoo ed panaon to ya \u201cnaugip lad patey.\u201d\u20141
  Corinto 15:6.\\n8. Akin et segurado tayon aglabay na Dios ya ompatey so totoo?\\n8
  Talaga kasin labay na Dios ya ompatey so totoo? Andi! Ginawa nen Jehova so totoo
  ya manbilay ya tuloytuloy diad dalin. Singa naaralan tayo lad sayan libro, inyan
  na Dios so inmunan sanasawan too diad marakdakep a paraiso. Ginawa to ran perpekto
  kanian ag-ira mansakit tan ontatken. Labay nen Jehova ya maong so pansumpalan da.
  Wala kasi maaron ateng ya labay ton manirap so ananak to lapud itatatken tan ipapatey?
  Siempre, anggapo! Inaro nen Jehova iray ananak to tan labay ton maliket iran naynay
  diad dalin. Oniay ibabaga na Biblia nipaakar ed saray totoo: \u201cInyan [nen Jehova]
  ni ingen so andi-anggaan ed puso ra.\u201d (Eclesiastes 3:11) Nen ginawa itayo na
  Dios, inyan tod puso tayo ya agtayo labay so ompatey. Tan sikato met so nanggaway
  paraan pian niiter itan ya pilalek ed puso tayo.\\nNO AKIN YA OMPAPATEY SO TOTOO\\n9.
  Antoy imbawal nen Jehova ed si Adan, tan akin et aliwan mairap ya unoren itan ya
  ganggan?\\n9 Akin balet et ompapatey so totoo? Pian naebatan itan, amtaen tayo ni
  no antoy agawa nen si Adan tan Eva ni labat so too diad dalin. Oniay ibabaga na
  Biblia: \u201cSi Jehova a Dios et pinatubo tod dalin so amin a kiew a makapaliket
  a nengnengen tan maabig a naakan.\u201d (Genesis 2:9) Balet walay sakey labat ya
  imbawal to. Imbaga nen Jehova ed si Adan: \u201cManlapud amin a kiew ed hardin et
  nayarian moy mangan na bunga anggad napesel ka. Balet agka nepeg a mangay bunga
  na kiew na pikakabat ed maong tan mauges, ta diad agew a pangan mo ed satan et seguradon
  ompatey ka.\u201d (Genesis 2:16, 17) Aliwan mairap ya unoren itan ya ganggan. Dakdakel
  iray kakiewan ya napangalaan nen Adan tan Eva na kanen da. Kanian pankanawnawa dan
  ipanengneng so pisasalamat dad samay angiter na amin ed sikara, pati say perpekton
  bilay da. No ontulok ira, ipapanengneng dan rerespetoen day autoridad na maaron
  Ama rad tawen tan labay day paibangat ed sikato.\\n10, 11. (a) Panon ya ag-inunor
  na inmunan sanasawa so Dios? (b) Akin et seryoson bengatla so ag-intulok nen Adan
  tan Eva?\\n10 Balet makapaermen ta pinili na inmunan sanasawa ya ag-unoren si Jehova.
  Panamegley na sakey ya uleg, tinepetan nen Satanas si Eva: \u201cTalaga ta\u2019n
  imbaga na Dios ya agkayo nepeg a mangay bunga na amin a kiew ed hardin?\u201d Inmebat
  si Eva: \u201cNayarian mi mangay bunga na saray kiew ed hardin. Balet oniay inkuan
  na Dios nipaakar ed bunga na kiew a walad pegley na hardin: \u2018Agkayo nepeg a
  mangan ed satan, andi, agyo nepeg a diwiten itan; ta no ontan so gawaen yo, ompatey
  kayo.\u2019\u201d\u2014Genesis 3:1-3.\\n11 Imbaga nen Satanas: \u201cSeguradon agkayo
  ompatey. . . . Amta na Dios a diad mismon agew a pangan yo ed satan et nalukasan
  iray mata yo tan magmaliw kayon singa Dios, ya amta yoy maong tan mauges.\u201d
  (Genesis 3:4, 5) Labay nen Satanas ya kombinsien si Eva ya parad pankaabigan toy
  pangan ed imbawal ya prutas. Singa ibabaga nen Satanas ya sarag nen Eva so mandesisyon
  no anto so duga tan aliwa; sarag ton gawaen no antoy labay to. Papalsaan met nen
  Satanas si Jehova ya intila To no antoy epekto na pangan ed prutas. Anisiay Eva
  ed si Satanas. Kanian amudbor na prutas tan kinan to. Insan inikdan to si Adan,
  tan angan met. Ag-ira ignorante ed ginawa ra. Amta ran say gagawaen da et amay mismon
  imbaga na Dios ya agda nepeg a gawaen. Nen kinan da may prutas, ginagala ran ag-unoren
  so sakey a simpli tan ag-ambelat ya ganggan. Agda nirespeto so Ama rad tawen tan
  say autoridad to. Anggapoy nibaraan dad satan ya ginawa ra ed maaron Amalsa ed sikara!\\n12.
  Antoy makatulong pian natalosan tayoy alikna nen Jehova nen agtinmulok si Adan tan
  Eva?\\n12 Niay sakey ya ilustrasyon: Antoy naliknam no say pinabaleg tan inasikasom
  ya anak et agto ka inunor, nirespeto, odino aaroen? Seguradon nasakitan ka. Isip
  mo pa labat so sakit ya alikna nen Jehova nen agtinmulok si Adan tan Eva.\\n13.
  Antoy imbaga nen Jehova ya nagawad si Adan no ompatey, tan antoy labay ya ibaga
  na satan?\\n13 Anggapo lay rason pian abuloyan nen Jehova ya tuloytuloy nin manbilay
  so agmatulok ya sanasawa. Inatey ira, ya singa imbaga to. Anggapo lay Adan tan Eva.
  Ag-ira linma ed kawalaan na saray espiritu. Segurado tayod satan ta imbaga nen Jehova
  ed si Adan nen tinepetan to ra nipaakar ed ginawa da. Imbaga na Dios: \u201cOmpawil
  ka ed dalin, ta ditan so angalaan ed sika. Lapud dabok ka, ompawil ka ed dabok.\u201d
  (Genesis 3:19) Ginawa na Dios si Adan manlapud dabok na dalin. (Genesis 2:7) Balet
  antis to \u2019tan, anggapoy Adan. Kanian, nen imbaga nen Jehova ya ompawil ed dabok
  si Adan, say labay Ton ibaga et ompawil ed dati, ya anggapoy Adan. Magmaliw ya anggapo
  lay bilay to ya singa dabok, ya angalaan ed sikato.\\n14. Akin ya ompapatey tayo?\\n14
  Mabilay ni komon natan si Adan tan Eva, balet inatey ira ta pinili ran ag-onuren
  so Dios, kanian nankasalanan ira. Say rason no akin ya ompapatey itayo et impatawir
  nen Adan ed amin ya anak to so kasalanan pati say patey. (Basaen so Roma 5:12.)
  Satan a kasalanan et singa atawir ya graben sakit tan agnapaliisan na anggan siopa.
  Say resulta to \u2019tan et patey, sakey ya sumpa. Say patey et sakey a kabusol,
  aliwan kaaro. (1 Corinto 15:26) Talagan misalsalamat tayo ta inter nen Jehova so
  dondon pian nisalba tayod satan ya makapataktakot ya kabusol!\\nMAKATULONG NO AMTA
  TAYOY TUA NIPAAKAR ED PATEY\\n15. Akin et naligliwa itayo no amta tayoy tua nipaakar
  ed patey?\\n15 Naligliwa itayo ed ibabangat na Biblia nipaakar ed kipapasen na inaatey.
  Singa naaralan tayo la, saray inaatey et agnaiirapan odino nasasakitan. Agtayo ra
  nepeg ya takotan ta agda itayo nasakitan. Agda kaukolan so tulong tayo tan agda
  itayo natulongan. Agtayo ra nakatongtong tan agda itayo met nakatongtong. Ibabaga
  na dakel ya lider na relihyon ya natulongan da kuno iray inaatey kanian babayaran
  ira na totoon manisia ed sikara. Balet no amta tayoy tua, ag-itayo naloko na saray
  mangibabangat ed saratan ya tila.\\n16. Siopay angimpluensya ed saray bangat na
  dakel a relihyon, tan panon?\\n16 Kasin say ibabangat na dakel ya relihyon nipaakar
  ed saray inaatey et mipara ed ibabangat na Biblia? Maslak et andi. Akin? Lapud saray
  bangat da et naimpluensyaan nen Satanas. Uusaren toy palson relihyon pian panisiaen
  so totoo ya no ompatey ira, manbilay ni ran siansia diad kawalaan na saray espiritu.
  Saya et tila ya ilalaok nen Satanas ed arum ni ran tila pian niyarawi toy totoo
  ed si Jehova a Dios. Panon?\\n17. Akin ya say bangat nipaakar ed impierno et mamauges
  ed si Jehova?\\n17 Singa naamtaan tayo la, ibabangat na arum a relihyon ya no ompatey
  so mauges ya too, onlad impierno pian tuloytuloy ya pairapen. Papaugesen na sayan
  bangat so Dios. Si Jehova et maar-aron Dios tan agton balot itan gawaen. (Basaen
  so 1 Juan 4:8.) Antoy naliknam no say sakey ya too et siniten toy lima na ugaw lapud
  benger? Narespetom kasi itan a too? Labay mo ni kasin kabaten? Seguradon andi! Ompan
  parad sika et marukruksa \u2019tan a too. Ontan so labay nen Satanas ya isipen tayo
  nipaakar ed si Jehova, ya tuloytuloy To kuno ya papairapen tan popoolan iray totoo!\\n18.
  Say pandayew ed saray inaatey et base ed anton tilan bangat na arum ya relihyon?\\n18
  Uusaren met nen Satanas so arum a relihyon pian ibangat ya no ompatey iray totoo
  et magmaliw iran espiritu, tan nepeg iran respetoen tan galangen na mabilay ya totoo.
  Base ed satan ya bangat, say espiritu na saray inaatey et magmaliw kunon makapanyarin
  kakaaro odino makapataktakot a kakabusol. Dakel so manisia ed sayan tila. Natatakot
  irad saray inaatey kanian papagalangan tan dadayewen da ra. Balet, ibabangat na
  Biblia ya saray inaatey et singa naugip, tan say nepeg labat ya dayewen tayo et
  say tuan Dios, si Jehova, say Amalsa tan mangiiter ed amin ya kaukolan tayo.\u2014Apocalipsis
  4:11.\\n19. Anto nin bangat na Biblia so natalosan tayo no amta tayoy tua nipaakar
  ed saray inaatey?\\n19 No amta tayoy tua nipaakar ed saray inaatey, ag-itayo nibalang
  na saray tilan bangat na arum ya relihyon. Ontulong met itan ed sika pian natalosan
  mo ni ray arum ya bangat na Biblia. Singa bilang, lapud atalosan mo ya saray inaatey
  et ag-oonla ed kawalaan na saray espiritu, magmaliw ya tudtua ed sika so promisa
  ya manbilay ya tuloytuloy diad paraison dalin.\\n20. Anton tepet so naebatan ed
  ontumbok ya kapitulo?\\n20 Nensaman et oniay intepet na maong ya toon si Job: \u201cNo
  ompatey so sakey a too, nabilay lamet kasi?\u201d (Job 14:14) Nabilay lamet kasi
  so inatey? Naligliwa tayo ed ibabangat na Biblia nipaakar ed satan, a singa naaralan
  tayo ed ontumbok ya kapitulo.\"", "\"\u201cSay labay ton ibagan tan,\u201d kuanton
  pinetek nen seminarista, \u201cso agto asalin balot so tinmubong ed simbaan kaleganay
  makasalanan ya inpanbilay to. No tungtongey tua agkon balot anengneng ya akiulop
  ed ontan lan karakel day buayan(1) onluloob ed simbaan.\u201d\\nAmaarap ira lamet
  sirin ed samay sakey a baklad tan angiparaan a piduay Andeng na panselaran.\\nOntatayagtag
  lay agew; mapalpalayupoy so siplog na dagem; naliliing iray daluyon a binelbinel
  ed liberliber ton may buaya, tan \u201cmansibuag na atagtagey iray burakan ya pankidiamay
  sinag na agew ed nambabangil iran kolor,\\\" unong na inkuanen omaanlong ya P. A.
  Paterno.\\nTinmobat lamet so tugtog: si Iday manotugtog na arpa tan saramay lalaki,
