  ed danum. Ititi tay urang! Saratay balanak ipolpog a seksekay kamatis so eges da
  insan balkoten irad bulong na ponti. Itilak yo ra tay arum a sira pian walay tapang
  ta makapoy no ekalen ya ami lugan to,\u201d kuanton inabot.\\nDiad saya nanpagilig
  laran sinmakbit dimad takel\\na kaibay daldalin nen Ibarra, ya kiew toray atatagey\\na
  masalsalompapak tan mamasiken lara. Dimad sirum\\nday kakiyewan ed abay na manages
  a kulos tan rosrosas\\nso angipaalageyan iray palapala ya pangogtoan da.\\n\u2014190\u2014\"",
  "\"Biblia Online | BALON MUNDO A PATALOS NA MASANTON KASULATAN\\n-\\nApaabig so
  mansasakit a laki diad Bethzatha (1-18)\\n-\\nSay autoridad nen Jesus et nanlapud
  Ama to (19-24)\\n-\\nNarengel na inaatey so boses nen Jesus (25-30)\\n-\\nPantasi
  nipaakar ed si Jesus (31-47)\\n5 Kasabi na piesta+ na saray Judio, tinmatdang si
  Jesus ed Jerusalem.\\n2 Diman ed Jerusalem diad asingger ed Puerta na Saray Karnero+
  et walay sakey a tiponan na danum a tatawagen ed Hebreo a Bethzatha, a walaay limaran
  portiko.\\n3 Akarukol ditan so amayamay a mansasakit, bulag, piley, tan saramay
  kinmekebet so lima odino sali ra.\\n4 \u2014\u2014\\n5 Balet walay laki ditan a
  38 taon lan mansasakit.\\n6 Sanen anengneng nen Jesus iyan laki ya akarukol, tan
  amta ton abayag lan mansasakit, inkuan tod sikato: \u201cLabay moy onabig?\u201d+\\n7
  Inmebat ed sikato imay mansasakit: \u201cKatawan, anggapoy mangilasur ed siak diad
  tiponan na danum sano nakikimbog la, balet sano onlasur ak la et walay sananey a
  makauna ed siak.\u201d\\n8 Inkuan nen Jesus ed sikato: \u201cAlagey ka! Libit moy
  dukolan mo tan manakar ka.\u201d+\\n9 Tan inmabig a tampol imay laki, tan nilibit
  toy dukolan to tan nanakar la.Agew na Sabaton ed saman.\\n10 Kanian imbaga na saray
  Judio ed samay apaabig a laki: \u201cSabaton natan, tan sebel a manlibit kay dukolan.\u201d+\\n11
  Balet sikatoy inmebat ed sikara: \u201cSamay amaabig ed siak et inkuan ton, \u2018Libit
  moy dukolan mo tan manakar ka.\u2019\u201d\\n12 Sikatoy tinepetan da: \u201cSiopa
  tay angibaga ed sikan, \u2018Libit mo itan tan manakar ka\u2019?\u201d\\n13 Balet
  agkabat na samay inmabig a laki no siopa imay anambal ed sikato, ta ag-aliklikas
  a linmaok si Jesus ed dakdakel a totoon wadman.\\n14 Kayari na satan et sikatoy
  anengneng nen Jesus diad templo tan inkuan tod sikato: \u201cNengneng mo, inmabig
  ka la. Agka la mankakasalanan, ta pian anggapoy nagawa ed sikan mas mauges.\u201d\\n15
  Linma iyan too ed saray Judio tan imbaga ton say amaabig ed sikato et si Jesus.\\n16
  Lapud saya, si Jesus et pinasegsegang na saray Judio, ta gagawaen to iraya legan
  na Sabaton.\\n17 Balet imbaga tod sikara: \u201cSay Amak et mankikimey ni anggad
  natan, tan ontan ak met.\u201d+\\n18 Kanian lalon pursigido iray Judio a mamatey
  ed sikato, lapud agto labat susumlangen so Sabaton noagta tatawagen to met ya Ama
  to so Dios,+ ya ipapara toy sarili to ed Dios.+\\n19 Inkuan nen Jesus ed sikara:
  \u201cIbagak ed sikayoy tua, agnagawaan na Anak so anggan sakey a bengatla unong
  ed dilin panlabayan to, noagta saman labat so nanenengneng ton gagawaen na Ama.+
  Ta antokaman a gagawaen na Ama, saraya so gagawaen met na Anak.\\n20 Ta aaroen na
  Ama so Anak+ tan ipapanengneng tod sikato so amin a gagawaen to, tan ipanengneng
  tod sikato iray kimey a babaleg nen saraya, pian onkelaw kayo.+\\n21 Ta no panon
  a papaolien na Ama iray inaatey tan bibilayen to ra,+ ontan met so Anak a bibilayen
  to so siopaman a labay to.+\\n22 Ta anggapon balot so uukomen na Ama, noagta inmatalek
  to lad Anak so amin a pangukom,+\\n23 pian igalang na amin so Anak a singa pangigagalang
  dad Ama. Siopaman ya agmangigalang ed Anak et agmangigagalang ed Ama ya angibaki
  ed sikato.+\\n24 Ibagak ed sikayoy tua, siopaman ya ondengel ed salitak tan manisia
  ed samay angibaki ed siak et walaan na bilay ya andi-anggaan,+ tan sikatoy agnaukom
  noagta alabasan to lay ipapatey tan mamapaarap lad bilay.+\\n25 \u201cIbagak ed
  sikayoy tua, onsabi oras, tan natan la itan, sano narengel na inaatey so boses na
  Anak na Dios, tan saramay dinmengel tan tinmulok et nabilay.\\n26 Ta say Ama et
  walaay pakayarin mangiter na bilay,+ tan inikdan to so Anak na pakayarin mangiter
  met na bilay.+\\n27 Tan sikatoy inikdan toy autoridad a mangukom,+ lapud sikato
  so Anak na too.+\\n28 Agyo pankelawan iya, lapud onsabi so oras a saray amin a walad
  pakanodnonotan iran lubok et narengel day boses to+\\n29 tan ompaway ira, saramay
  nanggaway maong et napaoli pian manbilay, tan saramay nanggaway mauges et napaoli
  pian naukom.+\\n30 Agak makapanggawa na anggan sakey a bengatla unong ed panlabayan
  ko. Mangukom ak unong ed narengel ko, tan say panangukom ko et matunong,+ ta say
  aanapen ko et aliwan say linawak, noag say linawa na samay angibaki ed siak.+\\n31
  \u201cNo siak labat so mantasi ed sarilik, aliwan tua so pantasik.+\\n32 Walay sananey
  a mantatasi nipaakar ed siak, tan amtak a say pantatasi to nipaakar ed siak et tua.+\\n33
  Angibaki kayo na totoo ed si Juan, tan tinasian toy katuaan.+\\n34 Anggaman ontan,
  agko la kaukolan so pantasi na too, balet ibabagak iraya pian nilaban kayo.\\n35
  Saman a too et singa silew a mandarlang tan maliwliwawa, tan diad antikey a panaon
  et labalabay yon panliketan a maong so liwawa to.+\\n36 Balet walaan ak na mas mabiskeg
  a prueba nen samay imbaga nen Juan a nanlapu ak ed Ama, ta saray mismon kimey ya
  ingganggan na Amak a sumpalen ko, sarayan kimey a gagawaen ko, so mamaneknek ya
  imbaki ak na Ama.+\\n37 Tan say Ama ya angibaki ed siak so mismon mantatasi ed siak.+
  Agyon balot nadngel so boses to odino anengneng so itsura to,+\\n38 tan anggapo
  ed puso yo so salita to, ta agyo panisiaan so mismon imbaki to.\\n39 \u201cUusisaen
  yo so Kasulatan+ ta iisipen yo a nawalaan kayoy bilay ya andi-anggaan ed panamegley
  na satan; tan satan a mismo so mantatasi nipaakar ed siak.+\\n40 Balet agyo labay
  so ondago ed siak+ pian nawalaan kayoy bilay.\\n41 Agko aanapen so panangigloria
  na totoo,\\n42 balet aliwa kayon ontan. Amtak ya anggapoy panangaro yod Dios.\\n43
  Linma ak dia ed ngaran nen Amak, balet agyo ak inawat. No walay sananey ya onsabi
  ed ngaran ton dili, sikatoy awaten yo.\\n44 Panon kayon manisia, anta aanapen yoy
  panangigloria na balang sakey tan agyo aanapen so gloria a manlalapud saksakey a
  Dios?+\\n45 Agyo iisipen ya akusaan ta kayo ed Ama; walay sakey a mangaakusa ed
  sikayo,+ si Moises, a sikatoy paniilaloan yo.\\n46 Diad tua, no anisia kayod si
  Moises, manisia kayo komon ed siak, lapud sikatoy nansulat nipaakar ed siak.+\\n47
  Balet no agyo panisiaan iray insulat to, panon yon panisiaan so ibabagak?\u201d\"",
  "\"Andi. Diad tua, nen naamtaan min dumad ibabaga na Biblia iray papanisiaan mi,
  inuman mi iratan.\\nDakel ya taon antis kamin angi-publish na New World Translation
  of the Holy Scriptures nen 1950, inaral mi lay Biblia. Inusar mi ray available ya
  bersion tan ditan so angibasiyan mid saray papanisiaan mi. Imanoey pigaran abayag
  lan papanisiaan na Saray Tasi nen Jehova, tan nengneng yo no kasin ontan ya talaga
  so ibabangat na Biblia.\\nPapanisiaan mi: Say Dios et aliwan Trinidad. Oniay imbaga
  na Hulyo 1882 ya Zion\u2019s Watch Tower: \u201cAmta na saray manbabasa ya manisia
  kamid si Jehova tan Jesus, tan say masanton Espiritu, balet agmin balot aawaten
  so agnibased Biblia ya bangat a saraya et taloran Dios ed saksakey a persona odino,
  sakey a Dios a taloran persona.\u201d\\nNo antoy kuan na Biblia: \u201cSi Jehova
  a Dios tayo sikato so sakey a Jehova.\u201d (Deuteronomio 6:4, Say Biblia, Philippine
  Bible Society) \u201cPara sikatayo saksakey so Dios, say Ama ya amalsa ed amin a
  bengatla tan manbibilay itayon para sikato. Saksakey met so Katawan, si Jesu-Kristo,
  a diad panamegley to apalsay amin a bengatla, tan diad panamegley to met manbibilay
  itayo.\u201d (1 Corinto 8:6, Maung a Balita) Imbagan mismo nen Jesus: \u201cSay
  Ama babaleg nen say siak.\u201d\u2014Juan 14:28, Say Biblia.\\nPapanisiaan mi: Aliwan
  tua so andi-anggaan a panamairap ed mandarlang ya impierno. Nibase ed Roma 6:23
  na King James Version so tema na Hunyo 1882 a Zion\u2019s Watch Tower a \u201cSay
  Bayar na Kasalanan et Patey,\u201d tan oniay nabasa: \u201cMalinew tan simpli itan
  ya katuaan. Balet makapakelaw ta dakel ed saray mangibabagan manisia ran say Biblia
  et Salita na Dios so kontran maong ed sayan malinlinew ya katuaan, tan ipipilit
  day papanisiaan da, tan ibabangat kuno na Biblia, a say bayar na kasalanan et andi-anggaan
  a panamairap ed mandarlang ya impierno.\u201d\\nNo antoy kuan na Biblia: \u201cSay
  toon mankasalanan sikato so ompatey.\u201d (Ezequiel 18:4, 20, Maung a Balita) Say
  dusa na saramay onkokontra ed Dios et aliwan andi-anggaan a panamairap, noagta \u201candi-anggaan
  a kaderal.\u201d\u20142 Tesalonica 1:9, Maung a Balita.\\nPapanisiaan mi: Say Panarian
  na Dios et tuan gobierno, aliwa labat a walad puso. Oniay imbaga na Disyembre 1881
  ya Zion\u2019s Watch Tower nipaakar ed Panarian na Dios: \u201cSiempre, kaibad kiletneg
  na sayan panarian so paneral ed amin a panarian diad dalin.\u201d\\nNo antoy kuan
  na Biblia: \u201cTan dia ed saray agew naani na saratan ya ar-ari, say Dios na tawen
  mamaalagey naani na sakey a panarian ya anggan kapigan agnaani naderal tan say pananguley
  to agnaani niiter ed sananey a baley. Balet buybuyaken to naani tan upoten to naani
  so saraya ya amin a panarian, et sikato so mansiansia lawas.\u201d\u2014Daniel 2:44,
  Say Biblia.\\nKasin uusaren na Saray Tasi nen Jehova so New World Translation pian
  nasuportaay papanisiaan da?\\nAndi. Uusaren mi nin siansia so nanduruman bersion
  na Biblia diad pampupulong mi. Diad tua, anggano mangiiter kami na libren New World
  Translation bilang kabiangan na libren programa na panangiyaral na Biblia, labay
  mi met ya iyaralan iramay mas labay day arum a bersion na Biblia.\"", "\"IMPORTANTE:
  DIAD PANGUSAR MOD WEBSITE MI TAN/ODINO DIAD PANGITER MOD SIKAMI NA ANGGAN ANTON
  PERSONAL YA DATA TUNGKOL ED SIKA, MALINEW YA ONAABULOY KA YA AMIN A PERSONAL YA
  DATA YA IN-SUBMIT MO ET SARAG MIN I-PROCESS ED PARAAN TAN GAGALA YA ADESKRIBE ED
  SAYAN TOTONTONEN ED PRIVACY TAN BILANG PANUMBOK ED SARAY ONAPLIKAN LEY TAN REGULASYON
  ED PERSONAL YA DATA.\\nSaray Totontonen ed Privacy\\nNengnengen met so\\nPANRESPETO
  ED PRIVACY\\nGagawaen mi anggaay nayarian min protektaan tan respetoen so privacy
  yo. Nabasa ed sayan Totontonen so gagala na personal ya data ya aalaen mi odino
