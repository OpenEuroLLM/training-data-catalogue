  Mo, Nob.\\nMaliket so Simplin Bilay, Mayo\\n\u2018Mas Maseseg tan Balo so Panangaro
  Mi\u2019 (1922 ya kombension), Mayo\\nSakey a Gawa na Kristianon Kaabigan, Okt.\\nTEPETEPET
  NA SARAY MANBABASA\\nAkin et mandumaan so insulat nen Mateo tan Lucas nipaakar ed
  impanugaw nen Jesus? Ago.\\nIpasen na sanasawan Kristiano ya say IUD et agkontra
  ed Kasulatan? Dis.\\nKaukolan ya walay kanepegan na sakey bilang panguloan pian
  magmaliw ya inmunan ateng na Mesias? Dis.\\nNayari kasi nawalaan na paltog pian
  protektaay sarili ed arum ya too? Hul.\\nSi Jehova et \u201cagto abuloyan a nipaarap
  kayod tukso ya agyo nayarian\u201d (1Co 10:13), Peb.\"", "\"\u2018Manmatalek ka
  ed Jehova ed simoon a pusom, tan agka onsasaral ed dilin pakatalos mo.\u2019\u2014ULI.
  3:5.\\n1, 2. Antoy nibagam ed panagdesisyon mo, tan antoy resulta na saratan?\\nINAGEW-AGEW
  itayon mandedesisyon. Antoy nibagam ed panagdesisyon mo? Wala ray arum ya sarasarag
  dan idesisyonay sarili da. Isipen dan kanepegan da itan, tan agda labay ya ipiya
  itan ed arum. Say arum balet et antakot ya manggaway importante iran desisyon. Kanian
  manaanap iray tulong diad saray libro odino diad arum a too tan igastosan da ni
  ingen pian makala iray nakaukolan dan simbawa.\\n2 Iisipen balet na dakel ed sikatayo
  ya wala ray agtayo kanepegan ya desisyonan, tan wala met iray sarag tayon desisyonan
  depende ed labay tayo. (Gal. 6:5) Balet siempre, amta tayon aliwan amin ya desisyon
  et makabat tan maabig so pansumpalan to.\\n3. Anto ran instruksion so tutumboken
  tayo sano mandedesisyon tayo, balet akin et ag-itan mainomay no maminsan?\\n3 Misalsalamat
  tayo ran lingkor nen Jehova ta inikdan to itayo na malinew iran instruksion ed saray
  importantin dedesisyonan ed bilay. No tumboken tayo iratan, makapanggawa tayo na
  saray desisyon ya mamaliket ed si Jehova tan parad pankaabigan tayo. Balet, ompan
  wala ray naeksperiensya tayon problema o situasyon ya anggapoy espisipikon simbawad
  Biblia. No ontan, panoy pandesisyon tayo? Alimbawa, amta tayo ya mauges so mantakew.
  (Efe. 4:28) Balet ibabaga na arum ya aliwa met a mauges so mangala na agmo gawa
  no talagan kakkaukolan mo odino agmet mabli. Panon itayon mandesisyon ed saray situasyon
  ya anggapoy malinew tan espisipikon ganggan ed Biblia? Antoy makatulong ed sikatayo?\\nMANDESISYON
  YA WALAY LIMPION PANAGNONOT\\n4. Antoy nayarin isimbawa na arum sano walay dedesisyonan
  tayo?\\n4 Sano nasalita tayod sakey ya agi ya walay importantin dedesisyonan tayo,
  ompan ibaga ton mandesisyon itayo ya walay limpion panagnonot. Duga itan ya simbawa.
  Ibabaga na Biblia ya agtayo bastabasta mandedesisyon. Nabasa tayo: \u201cNo magangganat
  kan manggawa, et kakulangan so nagunggonam.\u201d (Pro. 21:25, Maung a Balita) Balet
  antoy labay ya ibaga na pandesisyon ya walay limpion panagnonot? Kasin say labay
  ya ibaga na satan et mannonot tayon maong, agmanaapura, magmaliw ya realistiko,
  tan aralen so situasyon? Tua, importante irayan amin pian dugay desisyon tayo, balet
  wala ni mas nakaukolan.\u2014Roma 12:3; 1 Ped. 4:7.\\n5. Akin et aliwan perpektoy
  panagnonot tayo?\\n5 Anggapoy toon perpektoy panagnonot to. Lapud makasalanan itayon
  amin, aliwan perpekto so laman tan nonot tayo. (Sal. 51:5; Roma 3:23) Sakey ni,
  dati et agkabat na dakel ed sikatayo si Jehova tan saray matunong ya estandarte
  to lapud \u201cbinulag\u201d itayo nen Satanas. (2 Cor. 4:4; Tito 3:3) Kanian no
  ibase tayo labat iray desisyon tayo ed iisipen tayon duga tan praktikal, ompan aliwa
  nin siansiay desisyon tayo anggano ninonot tayon maong itan.\u2014Uli. 14:12.\\n6.
  Antoy makatulong pian nawalaan itayoy limpion panagnonot?\\n6 Aliwan perpekto so
  laman tan nonot tayo, balet si Aman Jehova et perpekto ed ami-amin. (Deu. 32:4)
  Makapaliket ta tutulongan to itayon manguman pian nawalaan itayoy limpion panagnonot.
  (Basaen so 2 Timoteo 1:7.) Bilang Kristiano, labay tayo ya limpio so panagnonot,
  panagkatunongan, tan kiwas tayo. Kanian nepeg tayon aralen ya kontroley panagnonot
  tan liknaan tayo pian naalig tayoy panagnonot, liknaan, tan kiwas nen Jehova.\\n7,
  8. Mangisalaysay na eksperiensya no panoy dugan pandesisyon anggano dedesdesen itayo
  na arum tan mairap so situasyon.\\n7 Niay sakey ya alimbawa. Dakel ya sanasawan
  mana-abroad so mangisesempet ed kapangiyanak ya anak da pian say mangasikaso et
  saray kakanayon da. Ontan so gagawaen da pian nitultuloy day mananap na pambilay
  ed abroad. * Naeksperiensya itan na sakey ya bii ya nananak ed arum ya bansa. Sanen
  kapananak to, ginmapon nanaral na Biblia tan inmaligwas ed espiritual. Sikato tan
  say asawa to et dedesdesen na saray kakaaro tan kakanayon da ya isempet imay ugaw
  ed saray bai tan laki to. Balet naaralan na sayan bii ya say inikdan na Dios na
  responsabilidad ya mangasikasod anak et say ateng. (Sal. 127:3; Efe. 6:4) Kasin
  mialig iyan bii ed gagawaen na arum ta singa atan so praktikal? Odino iyaplika toy
  nanaaralan tod Biblia anggano mairap tan ompan sikatoy balawen na arum? Antoy gawaen
  mo no sikay walad situasyon to?\\n8 Na-stress iyan bii lapud panedesdes na arum,
  kanian nampikasid si Jehova tan kinerew toy panangigiya to. Sanen intongtong to
  iyan problema to ed mangiyaaral ed sikato tan ed arum nin agagi ed kongregasyon,
  diman to atalosan no antoy panmoria nen Jehova. Ninonot to met so posiblin epekto
  ed emosyon na anak to no sikatoy ombaleg ya arawid atateng to. Kayari ton inaral
  ya maong so ibabaga na Biblia ya onaplikad situasyon to, nandesisyon ya agto isempet
  so ugaw. Nen naimano na asawan laki so insuportad sikara na saray agagi tan anengneng
  ton naaasikason maong so anak da, nampaiyaral met la tan iibaan to lan miaral so
  asawa to.\\n9, 10. Antoy labay ya ibaga na panagdesisyon ya limpioy panagnonot,
  tan panon tayon nagawaan itan?\\n9 Sakey labat itan ya alimbawa, balet ipapanengneng
  na satan ya say pandesisyon ya walay limpion panagnonot et ag-akadepende ed iisipen
  tayon praktikal odino ed ibabaga na arum ya duga. Say imperpekton nonot tan puso
  tayo et singa relo ya mapmaples odino matattantan. No paigiya tayod satan, aliway
  pansumpalan tayo. (Jer. 17:9) Kanian nepeg tayon seguroen ya say nonot tan puso
  tayo et igigiya na saray estandarte na Dios.\u2014Basaen so Isaias 55:8, 9.\\n10
  Maabig sirin no tumboken tayo iyan simbawa na Biblia: \u2018Manmatalek ka ed Jehova
  ed simoon a pusom, tan agka onsasaral ed dilin pakatalos mo. Dia ed saray amin a
  dalan mo sikato so bidbiren mo, et itonton to ray basbas mo.\u2019 (Uli. 3:5, 6)
  Ibabaga na sayan teksto ya \u2018agka onsasaral ed dilin pakatalos mo.\u2019 Insan
  to imbagan \u201c[si Jehova] so bidbiren mo.\u201d Sikato labat so walaay perpekton
  panagnonot. Kanian no walay dedesisyonan tayo, aralen tayoy ibabaga na Biblia pian
  naamtaan tayoy panmoria na Dios. Insan satan so nepeg ya pangibasiyan tayoy desisyon
  tayo. Ontan so panagdesisyon ya limpioy panagnonot\u2014say pangalig ed panagnonot
  nen Jehova.\\nIPASAL SO PAKAYARIN MANTALOS\\n11. Antoy nepeg ya gawaen na sakey
  no labay ton aralen so dugan panagdesisyon?\\n11 Aliwan mainomay ya aralen so dugan
  panagdesisyon tan anggan say mismon panumpal ed desisyon tayo. Lalo lan mairap iya
  ed saray balo nid katuaan odino saramay onaaligwas ni labat ed espiritual. Balet
  posible so itatken dad espiritual. Diad Biblia et tinukoy ira bilang \u2018melag
  ya ugugaw\u2019 ya aliling toy manaaral ni labat ya onakar. Diad unona et angkekelag
  ni kupbang na ugaw balet makaaral ya siansia no ipasal lan ipasal. Ontan met so
  nepeg a gawaen na sakey no labay ton aralen so dugan panagdesisyon. Imbaga nen apostol
  Pablo ya saray matatken ed espiritual et \u2018manguusar ed pakayari ran mantalos
  kanian nipapasal itan a mangibiig ed duga tan aliwa.\u2019 Ipapanengneng na salitan
  \u201cmanguusar\u201d tan \u2018nipapasal\u2019 ya kaukolan so tuloytuloy ya pansagpot,
  tan ontan so nepeg ya gawaen na saray balo ni.\u2014Basaen so Hebreos 5:13, 14.\\n12.
  Mangiter na alimbawa no panon tayon naaralan so dugan panagdesisyon?\\n12 Singa
  abitlad gapo, inagew-agew tayon mandedesisyon, melag man o baleg. Unong ed sakey
  ya research, masulok ya 40 porsiento na gagawaen tayo et base ed apasalan tayo tan
  agninonot ya maong. Alimbawa, kada kabuasan et mandedesisyon ka no antoy isulong
  mo. Ompan isipen mon agtanton importante itan ya desisyon, kanian agmo la nonoten
  a maong lalo la no manaapura ka. Balet diad tua, importantin isipen no kasin say
  isulong mo et manepeg ed sakey a lingkor nen Jehova. (2 Cor. 6:3, 4) No mangasaliw
  kay kawes, antoy sankanonot mo? Kasin no antoy uso, odino nononoten mo met no kasin
  masimpit tan sarag moy presyo to? No dugay panagdesisyon tayo ed sarayan melag a
  bengatla, nipapasal tayoy pakayari tayon mantalos, ya ontulong pian makapandesisyon
  tayoy duga ed mas baleg iran dedesisyonan.\u2014Luc. 16:10; 1 Cor. 10:31.\\nPABISKEGEY
  DETERMINASYON MON GAWAEN SO DUGA\\n13. Antoy makatulong pian nagawaan tayo so desisyon
  tayo?\\n13 Anggano duga so desisyon tayo, no maminsan et aliwan mainomay ya sumpalen
  itan. Alimbawa, wala ray labay da lan itunday panagsigarilyo da, balet agda nagagawaan
  ta kulang ira na determinasyon. Kaukolan ya mabiskeg so determinasyon tayon gawaen
  so desisyon tayo. Singa itan muscle na laman. No lanang ya nanausar, diman met lalon
  ombibiskeg. No matalag balet ya nanausar, onkapuy. Anto sirin so ontulong pian ombiskeg
  so determinasyon tayon gawaen so desisyon tayo? Kerewen tayoy tulong nen Jehova.\u2014Basaen
  so Filipos 2:13.\\n14. Akin et mabiskeg so determinasyon nen Pablo ya gawaen so
  nepeg ton gawaen?\\n14 Asali iyan mismo nen Pablo. Aminsan et oniay imbaga to: \u201cWalay
  pilalek kon manggawa na maong, balet ta agko nagawaan so labay ko.\u201d Amta to
  no antoy labay tan nepeg ton gawaen, no maminsan balet et irap ton gawaen. Inamin
  to: \u201cDiad inkatook et panlikliketan koy ganggan na Dios, balet nanenengneng
  ko ed laman ko so sananey a ganggan a misusumlangan ed ganggan na nonot ko tan itotonton
  to ak a magmaliw ya aripen na ganggan na kasalanan a walad laman ko.\u201d Labay
  kasin ibaga na saya ya anggapo lay nagawaan nen Pablo? Andi. Imbaga to: \u201cSalamat
  ed Dios diad panamegley nen Jesu-Kristo a Katawan tayo!\u201d (Roma 7:18, 22-25)
  Insulat to ni: \u201cTa diad amin a bengatla et ombibiskeg ak diad panamegley na
  samay mangiiter ed siak na pakayari.\u201d\u2014Fil. 4:13.\\n15. Akin et nepeg ya
  determinado itayon gawaen so duga?\\n15 Malinew sirin ya pian abobonan itayo na
  Dios, nepeg ya determinado itayon gawaen so duga. Nonoten imay imbaga nen Elias
  ed saray mandadayew ed si Baal tan apostatan Israelita diad Palandey Carmelo: \u2018Panon
  kabayag ya manpawilpawil kayod nankaduan kanonotan? No si Jehova so Dios, ontumbok
  kayo ed sikato; balet no si Baal, sirin ontumbok kayo ed sikato.\u2019 (1 Ara. 18:21)
  Amta na saray Israelita ya si Jehova labat so nepeg dan dayewen, balet \u2018nankaduay
  kanonotan\u2019 da. Nanengneng tayoy baleg a pandumaan ed si Josue, ya oniay imbaga
  tod saray Israelita pigaran taon lay apalabas: \u201cNo isipen yo a mauges so panlingkor
  ed si Jehova, manpili kayo ed sayan agew no siopa so panlingkoran yo . . . balet
  nipaakar ed siak tan say abung ko, manlingkor kami ed si Jehova.\u201d (Jos. 24:15)
  Antoy resulta na determinasyon nen Josue? Sikato tan saray kakaiba to et abendisyonan
  ya manayam ed Insipan a Dalin, \u201cdalin a panag-agusay gatas tan dilo.\u201d\u2014Jos.
  5:6.\\nMANDESISYON NA MAKABAT PIAN NABENDISYONAN\\n16, 17. Antoy maabig ya resulta
  no mandesisyon tayo unong ed panlabayan na Dios? Mangiter na alimbawa.\\n16 Walay
  brother ya agano ni labat ya abautismoan. Walay asawa to tan taloray anak da ya
  angkekelag ni. Sikatoy kokombinsien na katrabaho to ya onalis irad kompanyan mas
  baleg so sueldo tan mas dakel so benepisyo. Nannonot a maong so brother tan impikasi
  to itan. Anggano melag labat so sueldod trabaho to natan, anggapoy loob na Sabado-Simba
  kanian makakapiaral tan makakapanpulong kaibay pamilya to. Naisip ton no onalis
  na trabaho, naderal \u2019tan ya eskedyul da. Antoy gawaen mo no sikay walad situasyon
  to?\\n17 Ninonot na brother ya naapektoay espiritualidad to, kanian agto inawat
  so trabahon mas baleg so sueldo. Nagbabawian to kasi itan ya desisyon to? Andin
  balot. Amta ton mas importante parad sikaran pamilya so espiritual iran bendisyon
  nen say baleg a sueldo. Malikeliket iran sanasawa nen imbaga na panguloan ya anak
  dan bii a mantaon na samplora ya inar-aro to ran maong, pati ray agagi, tan si Jehova.
  Imbaga ton labay to lan idedikay bilay tod si Jehova tan manpabautismo. Seguradon
  naapresya ton maong so alimbawa na ama to lapud inyuna toy panlingkor ed si Jehova.\\n18.
  Akin et importante ya makabat so pandesisyon tayo diad inagew-agew?\\n18 Singa si
  Moises ya indaulo to ray Israelita diad kalawakan, pigaran dekada lan idadaulo nen
  Jesu-Kristo iray totoo na Dios ed sayan mundo nen Satanas. Tan singa si Josue ya
  angiloob ed saray Israelita diad Insipan a Dalin, akaparaan lay Jesus ya panganggaen
  iyan mauges a mundo tan iter ed saray papatumbok to so insipan ya balon mundo na
  inkatunong. (2 Ped. 3:13) Kanian agti la komon papawilen so datin panagnonot, ugali,
  kagagawa, tan panlabayan tayo. Saya la so panaon pian mas talosan no antoy labay
  na Dios ya gawaen tayo. (Roma 12:2; 2 Cor. 13:5) Komon ta napatnagan ed saray desisyon
  tan pipilien mo ya makanepegan ka parad andi-anggaan ya bendisyon na Dios.\u2014Basaen
  so Hebreos 10:38, 39.\"", "\"No iyaansakit itayo na Dios, akin et agto la patundaen
  so kaugsan tan paniirap?\\nAkin et segurado tayon manbibilay tayo lad kaunoran iran
  agew na sayan mundo?\\nPanon tayon amta ya nasumpal iray sipan na Biblia nipaakar
  ed Panarian na Dios?\\nKasin makatulong so Biblia ed sikatayo pian makagawa tayoy
  duga iran desisyon natan?\\nLapud inaro itayo na Amalsa, inter tod sikatayo iray
  ebat ed saratan tan ed dakel nin tepet. Pian natulongan kan naalmo iray ebat, onlad
  website mi ya www.jw.org/pag, ya denesinyo ya ontulong ed totoon naaralan da so
  Biblia.\\nDiad satan ya website, nanengneng mo iray activity, artikulo, audio tan
  video iran rekording, interbyu, tan nanduruman publikasyon, kaiba lay Biblia. Amin
  iratan et libre.\"", "\"Panon ya si Jesus et akapampulong ya impormal?\\n4:7\u2014Inggapo
  toy tongtongan diad inkerew toy danum ya inumen imbes ya ipaamta ton tampol so Panarian
  odino ibaga ton sikato so Mesias\\n4:9\u2014Agto hinusgaan imay Samaritana lapud
  lahi to\\n4:9, 12\u2014Nen aminpigan sinalambit na bii iray punto ya nayarin pansengegay
  sangsangan, mataktikan pinaliisan nen Jesus iratan ya isyu.\u2014cf 77 \u00b63\\n4:10\u2014Angusar
  na ilustrasyon ya imbase tod inagew-agew a kabibilay na bii\\n4:16-19\u2014Anggano
  imoral so kabibilay na bii, sikatoy trinato nen Jesus ya walaay dignidad\\nPanon
  ya nanengneng ed sayan agawa so kaimportantian na impormal a panagpulong?\"", "\"Bangued,
  Abra\\nSay Bangued sakey baley ed luyag na Abra na Region Administrativo na Cordillera
  na Filipinas. Sakey say kapital na Abra. Onong ed census 2000, walay populasyon
  to ya 38,965 ya too didad 7,971 ya pamilya.\\nListaan na barangay[edit | edit source]\\nSay
  Bangued walay 31 ya barangay.\\nSaray gawing ed labas[edit | edit source]\\n- Opisyal
  ya websayt na Baley na Bangued\\n- Philippine Standard Geographic Code\\n- Bangued:
  Your Ultimate Online Guide\\n- Bangued: Your Ultimate Online Guide (second link)\"",
  "\"Siopa odino anto so Diablo?\\nANTOY EBAT MO? Say Diablo et . . .\\nsakey ya espiritun
  persona\\nsimbolo na kaugsan a walad dalem na sakey a too\\nimahinasyon labat na
  too\\nNO ANTOY IBABAGA NA BIBLIA\\nSay Diablo et akitongtong ed si Jesus tan \u201ctinukso\u201d
  to. (Mateo 4:1-4) Kanian aliwan imahinasyon labat so Diablo, tan aliwan simbolo
  labat na kaugsan. Sikatoy sakey ya mauges ya espiritun persona.\\nANTO NI NAARALAN
  TAYOD BIBLIA?\\nSay Diablo et datin anghel, balet \u201cagnansiansia ed katuaan.\u201d
  (Juan 8:44) Nagmaliw ya matila tan nanrebelde ed Dios.\\nAkila so arum ya anghel
  nen nanrebelde si Satanas.\u2014Apocalipsis 12:9.\\nBubulagen na Diablo so kanonotan
  na totoo pian ag-ira manisia ya sikatoy wala.\u20142 Corinto 4:4.\\nKasin sarag
  na Diablo ya kontrolen so totoo?\\nIBABAGA NA ARUM ya aliwan tua ya sarag na Diablo
  ya kontrolen so totoo, balet say arum et natatakot ya ompan selepan ira na mauges
  iran espiritu. Parad sika ey?\\nNO ANTOY IBABAGA NA BIBLIA\\n\u201cSay interon mundo
  et walad pakayari na samay sakey a mauges.\u201d (1 Juan 5:19) Tua ya mabisbiskeg
  so impluensya na Diablo ed totoo, balet agto kokontrolen so kada too.\\nANTO NI
  NAARALAN TAYOD BIBLIA?\\nPapalingoen na Diablo iray totoo pian mas dakel so naimpluensyaan
  to.\u20142 Corinto 11:14.\\nNo maminsan et sarag ya kontrolen na mauges iran espiritu
  so totoo.\u2014Mateo 12:22.\\nDiad tulong na Dios, sarag mon \u2018sumpaen [o labanan]
  so Diablo.\u2019\u2014Santiago 4:7.\"", "\"5\\n1 Isonga niman, ali\u1e83en singa
  baga\u2010en kito ma ja inpokok ni bilin nonta bayag da, ta inbolos shakito nen
  Cristo. Jet eg to koston on\u2010oli kiton manngeshan mowan ni baga\u2010en. Isonga
  karejo itolok ja pesakbat shay digat ni bilin nonta bayag da son si\u2010kayo.\\n2
  Si\u2010kak si Pablo, jet sajay alin ikowan ko, ali\u1e83en pampamaayan: nemnemnem
  jo. No itolok joy kowan sha, ja onoren jo sota ogadi ni Hodiyos, enshi malay jo
  kaybibiyangan son Cristo. 3 Asan iyay pay i ikowan ko. Sota ira toon on\u2010onod
  ni sakey ya ogadi ni Hodiyos, may\u2010eshig ey singa naypagod ira ta mesepol la
  onoren shen emin sota bilin ni Hodiyos. 4 Sota toon kowan to ey say kosto\u2010an
  son Apo Shiyos ket, sota pengonod to ni kowan ni bilin ni Hodiyos, naysi\u2010jan
  et ngo mowan son Cristo, ta ibiyang toy kaasi nen Apo Shiyos. 5 Nem si\u2010katejo,
  \u1e83aray namnama tayo ey kosto\u2010an shakito di nen Apo Shiyos shi ka\u2010onoran
  na timpo, jet sotan i tayoka segsegsha ni olay. Wara sota Ispirito Santo nen Apo
  Shiyos son si\u2010katejo, tan \u1e83ara kito pay shi pamati, isonga sajay i itsora
  ni namnama tayo. 6 Jet no memati kito son Cristo, say epateg bengat ja nemnemen
  tayo, sota pamati son si\u2010kato. Ta sotan na pamati, si\u2010katoy kedepo\u2010i
  ni semek. No sota maypangkep ni pengonod nonta bilin ni Hodiyos, enshiy to naykamitan
  shi pamati son Cristo.\\n7 Makedsang met i pamatiyo son Cristo nonta pilmiro, nem
  \u1e83ara gayam i toon inpabaki son si\u2010kayo; isonga singa eg jo ma onoren sota
  intorok ka podno. 8 Sajay ya inpangawis sha son si\u2010kayo, esel sha bengat; ali\u1e83en
  edapo son Apo Shiyos ja engawis son si\u2010kayod koston pamati. 9 Asas jo, baka
  ma\u2010edinan kayo ni kowan sha, ta inges niyay sota kowan tayo ey, \u201cAngkena
  ootik ka bobod, edinan ton emin i kayboboran to.\u201d 10 Jet \u1e83aray namnamak
  son Apo Jesus ni maypangkep son si\u2010kayo ey sota kowan ko i pati\u2010en jo
  met laeng nem anongosto, ali\u1e83en sota kowan ni eshom. Jet sota toon emengadilaw
  son si\u2010kayo, kenshat ta shosa\u2010en ali nen Apo Shiyos, angken ngantoy katoo
  to.\\n11 Si\u2010kayon a\u2010akik shi pamati, no bilang ey si\u2010kak ket itorok
  pay laeng i maypangkep ni ogadi ni Hodiyos ja ikowan ko ey si\u2010kato et ngo mowan
  i epateg, istay eg sha\u2010ak pedigaten ni Hodiyos, ta enshiy kesekitan ni nemnem
  sha; ekak mengitosho nonta maypangkep ni koros nen Cristo. 12 Nem say kowan ko,
  angka et nem sota emengadilaw son si\u2010kayo, ma\u2010ma\u2010en sha sota ogadiren
  kogit: angken pankeponan sha shorog i bakdang sha!\\nE\u1e83aya kiton emati son
  Cristo, nem ali\u1e83en piyan ton a\u2010selen na bolos i pandeka tayo ni kompormi\\n13
  A\u2010akik shi pamati, say kabol la pinidi\u2010an shakejo so nen Apo Shiyos, say
  me\u1e83edja\u2010an kayo, nem sajay ya \u1e83aya, ali\u1e83en jo koma osalen shi
  pipiyan jon dag\u2010en ja ngaaw. No diket say pesing jo et mango, ipa\u2010sas
  joy semek jo ni sakey tan sakey son si\u2010kayo ni joka pantitinolong. 14 Ta sota
  emin na bilin nen Apo Shiyos, sakey bengat i esa\u2010nopan ton esel, jet si\u2010kato
  iyay: \u201cSemek moy kait mon too ja inges toy moka penmek ni bakdang mo.\u201d
  15 Nem no mankikinalat kayo ja singa aso, tan sekitan joy eshom, asas jo ta baka
  sheshalen joy joka pankagait.\\n16 Isonga kowan ko ey itodok joy Ispirito Santo
  nen Apo Shiyos ja mengiredan son si\u2010kayo, say eg jo onoren sota pipiyan ni
  bakdang jon dag\u2010en ja ngaaw. 17 Ta sota ngaaw wa pipiyan ni bakdang nga dag\u2010en,
  maykontra shi piyan ni Ispirito Santo. Sota piyan ni Ispirito Santo, eg ngo piyan
  ni bakdang nga dag\u2010en. Sajay ya showa, eg man\u2010inawatan, isonga emedingding
  sota piyan jon dag\u2010en ja mapteng. 18 Nem no sota Ispirito Santo nen Apo Shiyos
  i mengiredan son si\u2010kayo, e\u1e83aya kayo ma ta eg shakejo ma sekopan ni bilin
  nonta bayag da.\\n19 Sota aramid ja na\u2010alas ja pipiyan ni bakdang nga dag\u2010en,
  edawag, jet si\u2010kato ira jay: sota pemii ono kompormin ensekig ga aramid, pandeka
  ni ngaaw ja mengibiyang ni kowan ni eshom, 20 panshedjaw shi sinan shiyos, panmantala,
  sota igem, babakal, apal, bonget, isew, eg peki\u2010olnos shi eshom, 21 pengamkam
  ni kokowa ni eshom, panboteng, edaos ja pandadsak, tan \u1e83ara pay i eshom ma
  banag ja inges niyay ya ngaaw. Ipinshowak mowan iya inkowan ko nontan son si\u2010kayo,
  ey sota sajay i aramid to, eg ira mayda\u2010kam shi pantoshayan nen Apo Shiyos
  ali.\\n22 Nem sota toon kaishalan ni Ispirito Santo nen Apo Shiyos, iyay iray ma\u2010sas
  son si\u2010kato: semek, imdeng, talna, anos, pengaasi, mapteng nga nemnem, tan
  emepiyal pay; 23 amta ton memesinsiya ni eshom, tan amta ton tetngelen shorog i
  bakdang to. Sajay iren ogadi, emaytotop shi emin na bilin nen Apo Shiyos. 24 Sota
  toon \u1e83ara son Cristo Jesus, singa inpakilansara shi koros sota ngaaw wa ogadira,
  pati sota ngaaw ja istay pipiyan sha, jet inbiyang sha ma sotan iren ngaaw. 25 Jet
  sota Ispirito Santo nen Apo Shiyos i engi\u2010kan ni biyag tayo, isonga mesepol
  ngon si\u2010katoy mengiredan son si\u2010katejo. 26 Ali\u1e83en kito koma mandastog,
  ja mengi\u2010kan ni bongetan ni kait, ono mengi\u2010kan ni epalan to.\"", "\"Nen
  Disyembre 28, 2022, inaprobaan na Town Board na Ramapo so special permit parad construction
  project diad Ramapo. a Lapud sayan special permit, nayari lan usaren so property
  ya pampaalageyan na saray pasilidad ya kaukolan tayo. Ontan met, nayari lan ekalen
  iray kiew diad loob na property bilang preparasyon ed gawaen ya approval na Town
  Planning Board diad 2023. Lapud wala yan special permit, naiwasan so pakaabala na
  proyekto.\\nOniay imbaga nen Brother David Soto ya manlilingkor ed Construction
  Project Committee: \u201cMalikeliket kami nen naawat mi yan approval. Anggano wala
  ni ray kaukolan ya gawaen antis ya nigapo so aktual ya construction, segurado kami
  ya tuloytuloy ya bendisyonan nen Jehova iray sagpot tayo.\u201d\\nTime Line na Saray
  Agawa ed Construction Project Diad Ramapo\\nOktubre 5, 2019\\nInyanunsio na Mananguley
  ya Ulop so plano ya pankasakeyen lay amin ya media production tayo ed sakey a balon
  pasilidad diad Ramapo, New York\\nHunyo 26, 2020\\nPormal itayon nan-submit diad
  Ramapo Town Board\\nHulyo 8, 2020\\nSay unonan project meeting ya kaiba so Ramapo
  Town Board\\nMarso 31, 2021\\nAngi-submit tayo na Draft Environmental Impact Statement\\nMarso
  8, 2022\\nAngiter na permit so Town of Tuxedo Planning Board parad pamaawang tan
  pangipetek na dalan paonlad property diad Ramapo\\nMarso 12, 2022\\nInawat so Final
  Environmental Impact Statement\\nNobyembre 9, 2022\\nInaprobaan na Ramapo Town Board
  so balon ganggan pian nausar tayo so property ya pangipaalageyan na saray opisina
  tan residence\\nDisyembre 28, 2022\\nInaprobaan na Ramapo Town Board so special
  permit, pian nausar so property parad saray pasilidad tan nayari lan ekalen iray
  kiew\\nPending ni\\nSay approval na plano na interon site\"", "\"MANTULTULOY A MANBANTAY!\\nDiad
  2024 Summer Olympic Games, binilyon ya totoo so nambantay ed kompetisyon na saray
  atleta ya nanlapud 206 ya bansa. Balet niiter kasi na Olympics so kareenan tan pankakasakey?\\nWALA
  KASI NANDESINYO?\\nLegan ya nabubuo so agni niyanak ya ugaw, ondakel iray selula
  tan magmaliw iratan ya nilasus nilibo ya selula.\\nPANANGASAWA TAN PAMILYA\\nNo
  nanenengneng yon naiirapan so anak yo ed gagawaen to, kasin tulongan yo lan tampol?
  Odino kasin bangatan yoy anak yon agbasta-basta onsuko?\\nMANTULTULOY A MANBANTAY!\\nAgmantultuloy
  iray maruksan nagagawa ed politika tan inkaapag-apag na totoo. Ipapaliwawa na Biblia
  no panon iyan nagawa.\\nSAY PANAG-BANTAYAN\u2014PANARALAN YA EDISYON\\nKasin no
  maminsan et nanairapan kan tandaan so inaral mo? Anto sirin so gawaen mo pian agmo
  iratan nalingwanan?\"", "\"toray duan siko tod lamisaan. inepas to ra, inmokok lamet
  tan ontan ya aminniga.....\\n\u201cKagalgalang kora!\u201d kuanto nen akasalita
  ed bosis a makalkalna: \u201cnamnatalek ak ya amadagop ed sikayo ed sayan singbatan.
  . . ehem ! ehem ! . . . Palabasen tayoy pistay patron tin San Diego no k-12 ed sayan
  bulan. . . . ehem! ehem!.....k-2 la natan.....ehem; ehem!\u201d\\nNanokok diay pinaspasia
  na okok ya anawnawet tan amagamaga ya agto nituloy so pansasalita to.\\nInmalagey
  ed satan dimad bankon kawalaan day mamatatken so lakin sakey ya apataploy taon to
  ya nengneng toy ag mangitaltalek. Sikatoyay Kapitan Basilion mayaman, ya kaarap
  tod sakey ya asunto ed juzgado nen Don Rafael aman, sakey a toon diad pakaisip to
  et agni kinmorang ono binmolaslas so mundo nanlapod impatey nen Sto. Tomas de Aquino,
  tan nanlapo met ed dilin intonda ton nanaral ed kolegioy S. Juan de Letran(I) et
  manpapasuner so talbay katoowan.\\n\u201cKagalang kora, abuloyan yo ak pan mansalita
  nipaakar ed sakey a pamaakaran a napnoy kabaliksan,\u201d kuanto. \u201cOnona ak
  a mansalita anggaman dakel niray mas makankanepegan ed saray wadian akaarap, et
  yogonak ta diad magter kon pakatalus, no onia ran kipapasen say ononan mansalita
  aliwan kabaliksan toy sikatoy manonaan, tan ontan met a say naonor et agto talus
  so sikatoy sankasaginonoran. Sakey ni, saray bengat lan salitaen ko ontan lay tagey
  na kakanaan da ya ag ira nayarin ipaleen odino yalagar ed unor, kanian labay ko
  komoy mansalitad gapd pian niiter so\\nbelat dan kanepegan. Abuloyan yo ak pa sirin
  ya ono\\nnan mansalita ed sayan togiop ya anggaman wadia ran\\nakaarap so ankabli
  ran totoo ya singa di kagalang a\\nKapitan a peles, di Kapitan a nanpaso, pinablin
  kaarok a kasiporan a nanlapod inkaugaw mi, Don Julio ya\\nontan met a nankapitan,
  di Don Melchor a nibantog a\\nKapitan day cuadrilleros, tan arum nira, ya diad kakulangay
  tiempo et agko lara nabitla, balet ta nanengneng yon wadia met iran akaarap. Pikasik
  pa sirin ed\\nkablian yo ra, ya abuloyan yo ak a mansalita kasakbayan day arum.
  Mapalar ak kasin makagamor nian mag\\nter a kerew ko?\u201d\\n__________\\n(1) Colegio
  ya ikukurang day paparin Dominiko.\"", "\"Kasin idadasal mo met ya onsabi lay Panarian
  na Dios? Diad inlabas na nilasus iran taon, bibitlaen na minilyon iray salitan \u201cOnsabi
  komon so panarian mo\u201d no mandadasal ira. Akin et idadasal da itan? Lapud imbaga
  nen Jesus ed saray patumbok to ya ipikasi da so isabi na Panarian na Dios.\\nDiad
  gapo, ag-atalosan ya tampol na saray patumbok nen Jesus so amin ya detalye nipaakar
  ed satan ya Panarian. Aminsan et tinepetan day Jesus: \u201cKatawan, ipawil mo ta
  so panarian na Israel diad sayan panaon?\u201d Nayarin abigla ra lapud agdirektan
  imbaga nen Jesus no kapigan onsabi so Panarian na Dios. (Gawa 1:6, 7) Labay to kasin
  ibaga ya agtayo lan balot naamtaan no anto tay Panarian na Dios tan no kapigan itan
  onsabi? Andi!\\nMakatulong iyan isyu na Say Panag-bantayan pian naamtaan iray ebat
  ed sarayan tepet:\\nAkin et kaukolan tayo so Panarian na Dios?\\nSiopa so Ari ed
  Panarian na Dios?\\nKapigan uleyan na Panarian na Dios so dalin?\\nAntoy gawaen
  na Panarian na Dios?\\nAkin et importante ya suportaan la natan so Panarian na Dios?\\nAnto
  so Panarian na Dios?\"", "\"Petsa: Hunyo 14-16, 2019\\nLugar: Olympic Stadium diad
  Berlin, Germany\\nLenguahe na Programa: English, German, Russian\\nInmatendi: 37,115\\nAbautismoan:
  255\\nBilang na International Delegate: 5,000\\nImbitadon Branch: Brazil, Britain,
  Canada, Ecuador, Finland, Greece, Poland, Scandinavia, Slovenia, tan United States\\nEksperiensya:
  Nan-tour iray delegate ed sikat ya Pergamon Museum diad Berlin ta kaiba itan ed
  saray aktibidad da likud ed kombension. Onia so naobserbaan na sakey a guardia ed
  saray agagi ya binmisita ed museum: \u201cNaeekal lay ilalo na dakel a totoo ta
  anggapo so pananisia ra. Balet anengneng kod sikayo ya walay pananisia yo tan inar-aro
  yoy kada sakey.\u201d Onia so imbaga na sakey nin guardia: \u201cMaples ya onlabas
  so oras ed saray bisita ya singa sikayo, kanian ayos labat ed siak anggano man-overtime
  ak.\u201d\\nInabet na saray agagi ed Berlin iray delegate diad airport\\nSaray agagi
  diad paway na lugar na kombension\\nSaray delegate ya manpapalitrato, wala ray akasulong
  na national costume da\\nSi Brother Samuel Herd, ya membro na Mananguley ya Ulop,
  legan na sampot a paliwawa ed Sabado na ngarem\\nSaray delegate ya ondedengel ed
  programa diad English tan isusulat da iray naaralan da legan na sesyon. Duaran sister
  so aka-headset legan dan dedengelen so radio broadcast na programa\\nBabantayan
  na saray agagi so bautismo diad Sabado\\nManpapayapay iray inmatendin special full-time
  servant ed saray agagi diad pegley na pankombensionan legan na sampot ya agew na
  kombension\\nSay Berlin\u2019s Olympic Stadium, ya asumpal ya impaalagey nen 1936,
  litrato iya na unonan agew na kombension. Sayan stadium so inusar diad agnalingwanan
  ya internasyonal a kombension nen 1990, ya agawa kayari na inkagba na Berlin Wall\\nSaray
  delegate ya manpa-public witnessing diad arap na sikat ya Brandenburg Gate diad
  Berlin\\nNantitipon iray delegate diad Colonnade Courtyard, ya asingger ed Pergamon
  Museum\\nMantipak iray delegate diad sampot na evening gathering\"", "\"Si Sigmund
  Freud (/fr\u0254\u026ad/ FROYD, German: ; nianak si Sigismund Schlomo Freud; 6 Mayo
  1856 - 23 Setyembre 1939) et sakey ya Austrian neurologist tan nanmopag na psychoanalysis,
  sakey ya klinikal ya paraan pian nasukat tan manambal ed saray patolohiya ya ipapasen
  ya manlalapuan na saray kontrobersiya ed laman, diad panamegley na dialog ed pegley
  na pasyente tan psychoanalyst, tan pandumaan ya teoria na nonot panlalapuan na too.[2]\\nSi
  Freud et nianak ed Galician Jewish parents diad Moravian town na Freiberg, diad
  Austria. Sikatoy nagmaliw ya doktor na medisina nen 1881 diad University of Vienna.[3][4]
  Nen asumpal toy habilitasyon to nen 1885, sikatoy tinuro bilang docent ed neuropathology
  tan nagmaliw ya afilyan propesor nen 1902.[5] Si Freud so nanayam tan nanlingkor
  ed Vienna tan inletneg toy klinika to diman nen 1886. Kayari na impakeket na Alemanya
  ed Austria nen Marso 1938, tinaynan nen Freud so Austria pian makaliktar ed panamasegsegang
  na Nazi. Sikatoy inatey nen 1939 legan ton inilid United Kingdom.\\nDiad impangiletneg
  ed psicoanalysis, in-develop nen Freud iray therapeutic techniques a singa say pangusar
  na libre ya asosasyon tan say aka-discover ya transference, ya angiletneg na central
  role to ed analytic process. Say impangipawil nen Freud ed sexuality pian nibilang
  iray infantil ya porma to so amakiwas ed sikato ya ipaliwawa so Oedipus complex
  bilang manunan prinsipyo na teorya na psychoanalytical.[6] Say impan-analisa to
  ed saray panaginip bilang impangipagawa na pilalek so angiter ed sikato na saray
  modelon pan-analisa ed clinical analysis na pangipapasakbay na saray sintomas tan
  saray manunan mekanismo na panag-responsya. Diad sayan base et impaliwawa nen Freud
  so teorya to nipaakar ed ag-amta tan inyarum to so sakey a modelon mental ya kabiangan
  na id, ego tan super-ego.[7] Impaseguro nen Freud ya walay libido, seksual ya enerhiya
  ya uusaren na saray mental a proseso tan istruktura tan mangiter na erotiko iran
  panangalikdo, tan say sakey a panag-drive ed patey, say manunan panmoria, gura,
  agresyon, tan neurotiko iran kasalanan.[7] Diad saginonor ya kimey to, angipatnag
  si Freud na maawang ya interpretasyon tan kritikan nipaakar ed relihyon tan kultura.\\nSaray
  reperensiya[dumaen | dumaen so pinanlapuan]\\n- Halberstadt, Max (c. 1921). \\\"Sigmund
  Freud, half-length portrait, facing left, holding cigar in right hand\\\". https://www.loc.gov/item/98514770/.
  Nakuha noong 8 June 2017.\\n- Pick, Daniel (2015). Psychoanalysis: A Very Short
  Introduction. Oxford: Oxford University Press. Kindle Edition, p. 3.\\n- Noel Sheehy;
  Alexandra Forsythe (2013). \\\"Sigmund Freud\\\". Fifty Key Thinkers in Psychology.
  Routledge. ISBN 978-1-134-70493-4.\\n- Kandel, Eric R. (2012). The Age of Insight:
  The Quest to Understand the Unconscious in Art, Mind and Brain, from Vienna 1900
  to the Present, pp. 45\u201346. New York: Random House.\\n- Gay 2006, pp. 136\u201337.\\n-
  Jones, Ernest (1949). What is Psychoanalysis?, p. 47. London: Allen & Unwin.\\n-
  Mannoni, Octave (2015) [1971]. Freud: The Theory of the Unconscious, pp. 49\u201351,
  146\u201347, 152\u201354. London: Verso.\"", "\"Abra\\nSay Abra et kumatlo ya klase
  luyag na Cordillera Administrative Region, Pilipinas. Unong ed 2010 Census, say
  papulasyon to et 234,733 totoo.\\nWalay kabaleg tan sukat to ya 4,165.25 kilometro
  kuwadrado. Say dialling code to et 74. Say kapital to et Bangued.\\nSaray baley[edit
  | edit source]\\nSay Abra walay 27 ya baley.\\nSaray nipaway ya kawing[edit | edit
  source]\\n- Say Opisyal ya Websayt na Gobierno na Luyag na Abra\\n- abrenian.com
  The Most Read Online Community for Abrenians around the world - simple laeng lakay\"",
  "\"Salitan Iloko\\nSay salitan Iloko (salitan Iloko: Pagsasao a Iloko o Iloko o
  Ilokano) say salitan Sagor na Baybay na Luzon ya sanga na boleg ya salitan Ilokano.
  Onsulok ya marami so mansasalita. Saray mansasalita naananap ed Luzon tan Metro
  Manila ed sagor na Manila.\\nSaray kansyon na salitan Iloko[dumaen | dumaen so pinanlapuan]\\n-
  Manang Biday\\n- Duaya ni Ayyat (Dungdungwen Kanto)\\n- Pamulinawen\\n- Naraniag
  a Bulan\\n- Ti Ayat Ti Maysa Nga Ubing\\nThis article is a is a stub. You can help
  Wikipedia by expanding it.\""]'
