  da inganta hadin kai da karfafa hadin kai. \u201cA yau, muna kaddamar da ayyuka
  a sashen mu, wanda wani bangare ne na manufofinmu na bunkasa al\u2019adunmu. \u018aaya
  daga cikin irin wa\u0257annan ayyukan shine \u0257akin karatun digiri na gaba, don
  tallafawa jami''a a fannin gyare-gyare. \u201cMuna so mu goyi bayan duk wani abu
  da za mu iya yi don dorewar al\u2019adun Afirka da kuma tabbatar da an inganta shi
  da kuma kawo shi a fili, ba wai a raina shi ba, domin al\u2019adun kowace kasa na
  da matukar muhimmanci. Yana daga cikin al''adunmu don bayarwa, kai hannu da tallafi.
  \u201cBa za mu nade hannayenmu mu kalli yadda al\u2019adunmu ke rugujewa ba. \\\"Ka
  tuna cewa al''ada ce ke \u0199ayyade yadda mutum ke tafiyar da rayuwa, dangantaka
  da mutane kuma yana sa mutum ya sami nasara. Lokacin da kake da kyau, za ka iya
  ba da hanyarka cikin sau\u0199i da kyau sosai. \\\"Idan wani ya manta da al''adunsa,
  to mai yiyuwa ne irin wannan ya kasance a cikin ruwa kuma idan mutum ya tashi, to
  akwai matsala,\\\" in ji shi. Da yake magana game da ha\u0257arin wayewa kan al''ada,
  ya lura cewa matsalar wayewa, mai kyau kamar yadda ake iya gani, ta shiga cikin
  abubuwan cikin gida da ra''ayoyi. Ya ce zai zama abin dariya ga kowa ya yi wasa
  ko hakki na mutane, yana mai cewa kiyaye shi na asali, da gaske da kuma kiyaye mutuncin
  mutum a matsayinsa na al\u2019umma, shi ne ya zamanto maganin ci gaba cikin sauri.
  \u201cIdan har akwai wasu akidu, kan batun wayewa, babu laifi a kan hakan amma bai
  kamata hakan ya kawo mana illa ga fahimtarmu ba. Kuna zubar da abubuwan da ba su
  da amfani. \\\"Bai kamata in gwada zama dan kasar Sin ba, lokacin da nake dan Afirka
  amma zan iya duba abin da Sinawa ke yi wanda zai taimaka mini wajen inganta abin
  da nake da shi. \u201cBa ka dai ji an yi ruwan sama ba, ka yi gaggawar jefar da
  wanda ke cikin tukunyar ka, tun ma kafin ruwan sama ya zo. Hikima ce kawai a tara
  a tara. \\\"Ban damu da wayewa ba, abu ne mai kyau amma ba kwa watsi da abin da
  kuke yi ba ko kuma ku watsar da tushen ku da asalin ku saboda hakan,\\\" in ji shi.
  A cewarsa, ba zan ce ba saboda ina koyon turanci sannan na kawar da harshena na
  asali wato Yarbanci. \u201cKamar wauta ce. Ba zan yi watsi da al''adata ba saboda
  ina son samun na waje. \u201c\u0198asashen yammacin duniya suna nazari da kiyaye
  al\u2019adunsu. Don haka idan suna yin haka, me ya sa ba za su iya \u0199o\u0199arin
  fahimtar al''adata da kuma jin da\u0257in al''adunmu ba? Ya tambaya. Shi ma da yake
  nasa jawabin, Farfesa Douglas Anele, tsohon Shugaban Sashen Falsafa na Jami\u2019ar,
  ya ce ayyukan za su taimaka wajen saukaka ayyuka uku na kiran da suke yi a matsayin
  malamai, wadanda suka hada da koyarwa, koyo da kuma ci gaban al\u2019umma. \\\"Dole
  ne in ce mun yi matukar farin ciki kan wadannan kyawawan abubuwan da ke faruwa a
  sashen mu a yau. \u201cWannan shi ne saboda, duk da cutar ta Coronavirus (COVID-19),
  da jerin yajin aiki da kuma duk da tsananin rashin lafiyata, na sami damar cimma
  wasu ayyuka na gado, a matsayina na Shugaban Sashen Falsafa na wannan jami\u2019a.
  \u201cAyyukan su ne dakin taron karawa juna sani, wanda Cibiyar Nazarin Afirka da
  Kasashen waje, a nan Unilag, ta dauki nauyin gudanarwa, ta hannun Daraktan, Farfesa
  Muyiwa Falaiye. \u201cSai kuma, an sake gyara dakin karatunmu na Digiri na biyu
  ta Gidauniyar Otunba Francis Meshioye. A gaskiya, ina so in yi alfahari cewa Sashen
  Falsafa yana da mafi kyawun \u0257akin karatun digiri na biyu a cikin jami''o''in
  gwamnati a Najeriya a yau. \\\"Don haka ne na kawo wadanda suka gudanar da wasu
  ayyukan, abokaina da abokan aikina zuwa bikin kaddamarwa a yau,\\\" in ji Anele.
  Ya ce na ukun shi ne gyaran ofishin HOD da \u2018yan kadan na kayan aiki da asusun
  na sa. \u201cDon haka wadannan ayyuka uku ne da muke kaddamarwa a yau,\u201d inji
  shi. Anele ya lura cewa ayyukan za su kuma zama samfuri ga magajinsa don tabbatar
  da cewa sun bar aikin gado. \u201cBa koyaushe kan abin da za ku iya samu ba ne.
  Matsalar shugabanci a kasar nan ita ce, wadanda ke kan kujerar shugabancin kullum
  suna tunanin abin da za su iya samu. \u201cAmma a lokacin da kuka ajiye kanku a
  gefe, komai takura kudaden. Kuna iya tunanin, tun daga 2020 zuwa yanzu, na fuskanci
  \u0199alubale na kiwon lafiya kuma har yanzu ina iya sanya wa\u0257annan duka a
  wurin, \u201cIna jin yakamata ya zama abin koyi ga wasu su kwafa. \\\"Na yi nasara.
  Na mika sandar ga magajina. \\\"Don haka, zan ci gaba da tunatar da shi amma ingancin
  aikin da aka yi yana da \u0199arfi,\\\" in ji shi. Anele, ya lura cewa kayan daki
  a dakin karatun digiri na biyu da kuma ofishin HOD na iya wuce fiye da shekaru goma,
  saboda ya tabbatar da cewa an yi amfani da mafi kyau daidai da al''adar jami''a.
  Ya ce an nada shi HOD na sashen daga ranar 1 ga watan Agusta, 2019 zuwa 31 ga Yuli,
  2022, yana mai cewa shi da kansa zai tabbatar da cewa an kuma kula da kayayyakin.
  Mataimakin shugaban jami\u2019ar, Farfesa Oluwatoyin Ogundipe, ya yabawa gidauniyar
  bisa wannan karimcin, inda ya ce hakan ya yi dai-dai da manufofin gwamnatinsa na
  shirin \u201cP3P Initiative\u201d wanda shi ne: Zabi wani aiki, zabar mutum sannan
  a zabi. a Program. Ogundipe ya ce, wannan karimcin da gidauniyar ta yi zai kara
  inganta yanayin koyo ga daliban da suka kammala karatun digiri na biyu a sashen
  har ma da daliban da suka kammala karatu a shekarar karshe. \\\"Wannan duk game
  da shirin P3P ne da muke magana akai. Yana da duka game da tabbatar da cewa mun
  sami mafi kyawun wuri ga \u0257alibanmu don \u0199wararrun ilimi da \u0199ari. \\\"Muna
  bu\u0199atar \u0199arin wannan,\\\" in ji shi. (NAN)Ku kiyaye ayyukan jama\u2019a
  da sha\u2019awa \u2013 Uwargidan Gwamna ta bukaci al\u2019ummar Ebonyi Uwargidan
  Gwamnan Ebonyi, Misis Rachael Umahi, ta bukaci al\u2019ummar karamar hukumar Ohaozara
  ta jihar da su dauki nauyin gudanar da ayyukan jama\u2019a a yankinsu da kishi.\\nUmahi
  ya ba da wannan umarni ne a ranar Juma\u2019a yayin kaddamar da ayyukan da shugabar
  majalisar, Misis Nkechinyere Iyioku ta aiwatar. Uwargidan Gwamnan ta ce a ba da
  amanar ayyukan da arzi\u0199i domin amfanuwa, sha\u2019awa, dorewa da kuma inganta
  manufarta ga mazauna karkara. \\\"Hukumomin kananan hukumomi da jama''a su taimaka
  wajen kare wadannan ayyukan da sha''awar,\\\" in ji ta. Ta bayyana gamsuwarta da
  ayyukan tare da bayyana su a matsayin masu inganci da sana\u2019o\u2019in da al\u2019umma
  ke tafiyar da su. Sai dai ta bayyana shugabar a matsayin mai kwazo, wanda ikonsa
  shi ne cimma burin da aka sanya a gaba ga kungiyarsu da jama''arsu. \\\"Na yi imani
  da ra''ayoyinta da tunaninta a matsayinta na jagora,\\\" in ji Misis Umahi. Shugaban
  taron, Mista Austin Umahi, ya yaba wa shugabar bisa nuna gaskiya a cikin shugabancinta.
  Iyioku shi ma shugaban kungiyar kananan hukumomin Najeriya reshen Ebonyi, ya godewa
  gwamnati da masu ruwa da tsaki, mata da matasa bisa goyon bayan da suka bayar na
  ayyukan. \u201cIna alfahari da sarakunan gargajiya bisa gudunmawar da suke bayarwa.
  Na samu zaman lafiya, \u201din ji Iyioku. Kamfanin Dillancin Labaran Najeriya ya
  bayar da rahoton cewa, uwargidan gwamnan, ta kaddamar da wani gida mai zaman kansa
  na karamar hukumar Ugwulangwu a karamar hukumar Ugwulangwu. Sauran ayyukan sun hada
  da rijiyoyin burtsatse guda 45 da na hannu, da hanyoyin karkara da na baya, da shirye-shiryen
  noma da ilimi. ( Labarai\"", "\"Related Articles\\nSarkin Kano, Muhammad Sanusi
  na II, ya bayyana cewa matukar mutanen yankin Arewa ba su canja al\u2019adunsu ba
  to za su ci gaba da zama a cikin bakin talauci ne da ci baya.\\nSarkin ya yi wannan
  maganar ne a garin Gusau, babban birnin jihar Zamfara, a lokacin da ya halarci taron
  kaddamar da wata takarda da aka sanyawa suna \u201dGudummawar makarantun jami\u2019a
  wajen ci gaban kasa\u2019, wanda Dr Usman Bugaji ya gabatar a jami\u2019ar tarayya
