sample: '["\"Hukumar kiyaye hadura ta kasa (FRSC) reshen jihar Nija ta bayyana cewar
  akalla mutane biyar ne suka mutu a sakamakon wani hatsarin mota da ta auku a ranar
  Asabar a kan titin Lambata Kwakuri da ke karamar hukumar Gurara.\\nShugaban Shiyya
  na hukumar FRSC, Mr Yusuf Garba, shine ya shaida hakan wa kamfanin dillacin labarai
  ta Nijeriya a garin Minna a jiya Lahadi, ya ce hatsarin ta auku ne a tsakanin wata
  mota da kuma tifa.\\nYa ce, hatsarin wanda ya hada da wata mota mai launin fari
  BMW dauke da lamba BWR 264 SR da kuma wata Tifa Scana mai lamba ISR 16 DU.\\nShugaban
  jinyar ya bayyana cewar dukkanin mutane biyar da suke cikin mota BWM dukkaninsu
  sun mutu, inda ya kara da cewa dayan diraban da ya hatsarin ta rutsa da su wanda
  ya gamu da munanan raunuka tunin aka kaisa babban asibitin garin Suleja domin kula
  da lafiyarsa.\\nKamar yadda yake bayani, ya shaida cewar hatsarin ta auku ne a sakamakon
  tsula gudun tsiya da direbobin ke yi a wanda hakan babbar hatsari ne a direbobi.\\nYusuf
  Garba ya shaida cewar hukumarsu ta FRSC za ta ci gaba da bibiyar masu amfani da
  hanya domin tabbatar da cewar suna bin dokoki da ka\u2019idojin tuki domin kauce
  wa fadawa cikin hatsari.\\nGarba ya kuma kirayi masu amfani da titian da suke kokarin
  bin ka\u2019idojin kan hanya da kuma bin ka\u2019idodin da aka shimfida musu domin
  kauce wa fadawa cikin hatsari.\\n\u201cZa mu ci gaba da gudanar da aikinmu na sintiri
  a dukkanin manyan hanyoyi na tsawon 24 domin tabbatar da kare rayuka da lafiyar
  direbobi da facinjoji, ta hanyar tabbatar da cewar direbobi suna bin ka\u2019idojin
  tuki a kowani lokaci,\u201d In ji shi.\\nDaga nan kuma sai ya nemi mazauna jahar
  da suke hantsarin kai rahoton aukuwar kowace irin hatsari domin hukumarsu take zuwa
  domin kai agajin gaggawa don dauke marasa lafiya da kuma wadanda hatsari ta rutsa
  da su a kowani lokaci.\"", "\"Muna nazarin abin da Apple zai iya gabatar mana a
  taron na gaba a ranar 18 ga Oktoba. Lokaci ne na ...\\nA wannan makon zaku iya ajiye
  sabon Apple Watch Series 7, sabuntawa tare da canje -canje ka\u0257an. Za ku sami
  mai kyau ...\\nAbubuwan dubawa na farko game da sabon iPhone 13 da 13 Pro sun bayyana
  sarai: dalilan canzawa shine ...\\nBayan awanni 24 don narkar da duk abin da aka
  gabatar a taron Apple, mun bincika labaran da aka sanar tare da ...\\nTabbatacce:
  Apple zai ba da taron gabatar da iPhone 13 kai tsaye a ranar 14 ga Satumba daga
  ...\\nA wannan makon jarumin ya kasance Apple Watch, tare da leaks da yawa game
  da \u0199irarsa, allo, ayyuka ... Muna kuma magana game da ...\\nSashin farko na
  kakar 13th na kwasfan fayilolin Actualidad iPhone. Mun dawo kan kwasfan labaran
  mu na kai tsaye don yin magana ...\\nhttps://youtu.be/paVJIzrnQfc Esta semana hablamos
  de los problemas que muchos usuarios est\u00e1n teniendo con sus HomePod, tanto
  en la Beta de\u2026\\nhttps://youtu.be/NAFauEdnDuo A la espera de las grandes noticias
  de septiembre, el verano empieza con muchos rumores sobre nuevos productos. AirPods,\u2026\\nhttps://youtu.be/jhKTpIsp7nE
  Tras una semana probando las diferentes Betas de Apple os contamos nuestras primeras
  impresiones. Adem\u00e1s comentamos otras noticias de\u2026\\nhttps://youtu.be/8jjGKuFzgqE
  Tras el evento de presentaci\u00f3n que ha inaugurado la WWDC 2021 y en el que Apple
  nos ha desvelado\u2026\\nHighlightsididdigar rukuni\\n- Yadda ake sanin wane kamfanin
  iphone yake\\n- 10 na kowa matsaloli a kan iPhone 6 da yadda za a warware su\\n-
  Shin iPhone \u0257inku tana kashe yayin da har yanzu tana da \u0199arfin baturi?
  Anan mafita\\n- Yadda za a gyara matsalolin ha\u0257in Bluetooth a cikin iOS 10\\n-
  Wiseplay, duk tashoshin duniya akan wayarka ta hannu [TUTORIAL]\\n- Duk abin da
  kuke bu\u0199atar sani game da kulle iCloud don iPhone\\n- Farin ciki Chick, Mai-in-One
  emulator na iOS da Android wanda zaku so. [Koyarwar girkawa]\\n- Yadda ake yin wal\u0199iya
  a kan iPhone lokacin da suka kira ni\\n- Muna nazarin sabon iPod Touch 6G dalla-dalla\\n-
  Yadda zaka share hotunan ka har abada akan iPhone da iCloud\\n- Yadda ake nemo mamallakin
  iphone da aka rasa ko aka sata\\n- Yadda za a gyara \u0253acewa ko rashin daidaita
  lambobi tare da iCloud a cikin iOS 7.1.2\\n- Koyawa: Yadda ake cire geolocation
  na hotunan mu akan iPhone\\n- Koyawa: Yadda zaka Sauya Sakonnin Muryarka daga iPhone
  zuwa Kwamfuta\\n- Koyawa: Ta yaya za a san ko wani yana gano ku a ''Nemi Abokai
  Na''\"", "\"Lokacin da ma ya shude ta hanyar mahat, ma za ta kasance ma; amma ma
  za a ha\u0257e tare da mahat, kuma ya kasance mahat-ma.\\n\u2014The Zodiac.\\nTHE\\nWORD\\nADDU''A,
  MATA DA MAHATMAS.\\n(An kammala.)\\nDA batun batun tsabta, mutum zai koya game da
  batun abinci. Wanda zai shiga makarantar masarauta dole ne yasan menene bukatunsa
  na abinci, da kuma irin nau''in da yakamata a \u0257auka. Irin abincin da yake bu\u0199ata,
  don farawa, zai danganta ne ga tushen narkewar abinci da \u0199arfinsa. Wasu suna
  samun \u0257an \u0257an\u0257ano daga abinci mai yawa. ''Yan kalilan ne ke samun
  wadataccen abinci daga abinci kadan. Namiji ba zai dame shi ba shin alkama, buhun
  shinkafa, nama, kifi ko kwayoyi, shine abincin da ya dace dashi. Gaskiya zai gaya
  masa abin da yake bu\u0199atar ci. Irin nau''in abincin da ake bu\u0199ata don mutum
  da aka nada a cikin makarantar masters shine kalmomi da tunani.\\nKalmomi da tunani
  sun fi sauki ga yawancin mutane, amma za su yi wa almajiri. Su ne abubuwan da yake
  bu\u0199ata. Kalmomi da tunani abinci ne wanda mutum zai iya amfani da shi tun farko
  kuma kalmomi da tunani za ayi amfani dasu shekaru tun lokacin da ya wuce mutum.
  A halin yanzu, kalmomi basu da mahimmanci kuma sauti kawai ne, kuma tunani bazai
  sami wurin zama ba, kuma wucewa ta hanyar hankali. Yayin da mutum yake nazarin kalmomi
  ya kuma san ma''anarsu, to, suna a gare shi abinci. Tunda ya sami damar ganin sabbin
  abubuwa da tsoffin abubuwa a cikin kalmomin, sai ya dauki sabon rayuwar hankali.
  Ya fara tunani, kuma yana jin da\u0257in tunani kamar abincinsa. Yana da sabbin
  fa''idodi don maganin ciwan hancinsa.\\nA halin yanzu, tunanin mutane ba su iya
  narke kalmomi da rashi tunani ba. Amma yin wannan ya zama tabbaci ga wanda zai zama
  almajiri. Kalmomi da tunani sune abincinsa. Idan mutum ba zai iya \u0199ir\u0199irar
  su da kansa ba dole ne ya yi amfani da irin abubuwan da yake da shi. Hankali yakan
  karba, ya kewaya, ya digo shi ya kuma ci abincin ta hanyar karatu, sauraro, magana,
  da tunani. Yawancin mutane za su \u0199i shan kwayoyi da guba da abubuwan da ba
  za a iya ci ba kamar abinci tare da miya, salati da nama, don kada hakan ya haifar
  da rauni kuma ya bu\u0199aci likita; amma za su karanta tare da tabbaci sabon littafin
  rawaya da takarda dangi, tare da fya\u0257e, kisan kai, karkatarwa, cin hanci da
  rashawa da lalata abubuwan arziki da kuma fitowar sabon salo. Zasu saurari zage-zage
  da kushe wasu, da jin da\u0257in gulma a kan shayi ko teburin wasa, ko wasan opera
  ko bayan coci, kuma za su \u0253ata lokacin da suka dace cikin shirye-shiryen cin
  nasarar jama''a, ko tunanin sabbin hanyoyin kasuwanci a cikin iyakokin doka; Wannan
  da mafi yawan yini, kuma a cikin dare mafarkin su daga abin da suka ji da tunani
  da aikata. An yi abubuwa masu kyau da yawa kuma akwai kyawawan tunani da kalmomi
  masu da\u0257i. Amma hankali baya ha\u0253aka abincin da aka gauraya. Kamar yadda
  jikin mutum yake a irin abincin da yake ci, haka nan tunanin mutum yakan zama ne
  da kalmomi da tunanin wa\u0257anda yake tunani. Wanda zai zama almajirin masters
  yana bu\u0199atar abinci mai sau\u0199i na kalmomi masu bayyana da tunani mai kyau.\\nKalmomi
  sune masu kirkirar duniya, tunani kuma ruhi ne masu motsa su. Dukkanin abubuwa na
  zahiri ana ganin su kalmomi ne, kuma tunani suna rayuwa a cikinsu. Idan mutum yasan
  wani abu game da batun tsabta da abinci, lokacin da ya sami damar bambance wani
  bambanci tsakanin halayensa da wanda yake rayuwa dashi, jikinsa zai sami sabon ma''ana
  a gare shi.\\nMaza sun riga sun zama gwargwadon iko da tunani ko tunani kuma suna
  amfani da ita, kodayake da sauri. Da suka sami iko sosai, suna murna da ganin ta
  yin abubuwa, ba tambayar gaskiya ba. Yana iya kashe zafi da ba\u0199in ciki mai
  yawa kafin a fahimci cewa tunani na iya yin lahani kuma yana da kyau, kuma mafi
  cutarwa fiye da kyakkyawa za a yi ta amfani da tunani azaman motsin ikon motsawa
  sai dai idan an san hanyoyin tunani, dokokin da ke mulkinsu sun yi biyayya, kuma
  wa\u0257anda suke amfani da wannan ikon suna shirye su ci gaba da zuciya mai tsabta
  kuma ba sa arya.\\nTunani shine karfin da yake sa mutum yayi rayuwa daga rayuwa
  zuwa rai. Tunani shine sanadin abin da mutum yake a yanzu. Tunani shine karfi wanda
  ke haifar da yanayin da yanayinsa. Tunani ya samar masa da aiki da kudi da abinci.
  Tunani shine ainihin mai gina gidaje, jiragen ruwa, gwamnatoci, wayewar kai, da
  duniya kanta, da tunani yana rayuwa cikin wa\u0257annan duka. Tunani ba ya gani
  ta idanun mutum. Mutum yakan kalli idanunsa abubuwan da tunani ya gina; Yana iya
  ganin tunani yana rayuwa cikin abubuwan da ya gina. Tunani shine ma''aikaci koyaushe.
  Tunani yana aiki koda ta hanyar tunani wanda baya iya ganin tunani cikin abubuwan
  da ya gina. Yayinda mutum yake hango tunani a cikin abubuwa, tunani ya zama mafi
  kasancewa yanzu kuma ainihinsa. Wa\u0257anda ba za su iya ganin tunani a cikin abubuwa
  ba, dole ne su bauta wa \u0199ungiyar su na horo har sai sun iya, to, za su zama
  ma''aikata sai kuma daga baya ma''abuta tunani a maimakon su \u0253oye ta. Mutum
  bawa ne na tunani, koda yake yana da ra''ayin kansa majibinci. Tsarin manya-manyan
  abubuwa ya bayyana ne bisa umarnin tunaninsa, an canza koguna kuma an kawar da tuddai
  a tunaninshi, an kafa gwamnatoci da lalacewa ta hanyar tunanin sa, kuma yana tunanin
  shi ne shugaban tunani. Ya \u0253ace; kuma ya zo a sake. Sa''an nan, Ya halitta,
  kuma Ya \u0253ace; kuma duk lokacin da ya zo za a mur\u0199ushe shi, har sai ya
  koyi sanin tunani da zama cikin tunani maimakon fa\u0257ar sa.\\nKwakwalwar mutum
  shine mahaifar da yayi ciki kuma yake \u0257aukar tunaninsa. Don sanin tunani da
  yanayin tunani, dole ne mutum ya \u0257auki batun tunani da tunani game da shi da
  \u0199aunarsa da gaskiya da shi, da aiki da shi ta halal wanda batun kansa zai sanar
  da shi. Amma dole ne ya kasance gaskiya. Idan har ya bar kwakwalwarsa ta damawa
  da batutuwan tunani marasa kyau ga wanda ya zabi, zai kasance mai son mutane dayawa
  kuma zai daina zama mai son na hakika. Zuriyarsa za su zama lalata. Zai mutu, don
  tunani ba zai shigar da shi cikin sirrinsa ba. Ba zai ta\u0253a koyon ikon gaskiya
  da kuma dalilin tunani ba.\\nWanda zai yi tunani kawai lokacin da kuma tsawon lokacin
  da yake so ya yi tunani, ko kuma wanda yake tunani saboda kasuwancin sa ne ya yi
  tunani, ba ya cikin tunanin gaske, wato, ba ya bi ta hanyar samar da tunani kamar
  yadda ya kamata a kafa, kuma ba zai yi karatu ba.\\nTunani yana gudana yayin daukar
  ciki, gestation da haihuwa. Kuma yayin da mutum yayi tunanin aiwatar da tunani ta
  hanyar kwayar halitta kuma ya kawo shi haihuwa, to zai san karfin tunani, kuma tunani
  shine halitta. Don haihuwar tunani, dole ne mutum ya \u0257auki batun tunani dole
  ne ya zurfafa tunani a kansa kuma ya kasance gaskiya gareshi, har sai da zuciyarsa
  da kwakwalwarsa za su yi \u0257umi da shi kuma su tayar masa da hankali. Wannan
  na iya \u0257aukar kwanaki da yawa ko shekaru masu yawa. Lokacin da batunsa ya amsa
  da hankalin sa, to kwakwalwarsa tayi sauri kuma yana tunanin batun. Wannan \u0257ayan
  hoto kamar haske ne. Sanin kowa ne a gare shi, don haka ga alama. Amma har yanzu
  bai sani ba. Yana da kawai ilimin sa\u0199o na ilimi, da sauri kwaya mai tunani.
  Idan bai kula da shi ba kwaron zai mutu; kuma yayin da yake kasa samar da kwaya
  bayan kwaya to a karshe zai gagara yin tunanin tunani; kwakwalwarsa za ta zama bakarare,
  bakararre. Dole ne ya shiga cikin lokacin haihuwar tunani kuma ya kawo shi haihuwa.
  Mutane da yawa maza sun yi juna biyu kuma suna haihuwar tunani. Amma mutane kalilan
  za su haihu da kyau su kuma kawo su kyakkyawan tsari zuwa haihuwa, kuma ka\u0257an
  ne suke da ikon ko za su bi tsarin ci gaban tunani cikin ha\u0199uri, cikin sani
  da hankali har zuwa haihuwarsa. Lokacin da suka sami damar yin hakan, suna iya fahimtar
  rashin rayuwarsu.\\nWa\u0257anda ba za su iya tunanin tunani su kuma bi ta duk sauye-sauye
  da lokutan ci gabanta ba kuma su lura da haihuwarta da girma da \u0199arfi, bai
  kamata su raunana hankalinsu ba kuma su ci gaba da rayuwarsu ta hanyar nadama mara
  amfani da buri. Akwai wata hanyar da ta dace, ta hanyar da zasu zama masu girma
  don tunani.\\nHanyar da mutum zai sa ya girma da dacewa da tunani shine, da farko,
  sayan kuma sanya aikin tsarkakewa ga zuciya, kuma a lokaci guda don nazarin kalmomi.
  Kalmomi suna nufin ka\u0257an ne ga talakawa. Suna ma''ana da yawa ga wa\u0257anda
  suka san \u0199arfin tunani. Kalma kalma ce mai cike da tunani. Tunani ne da aka
  bayyana. Idan mutum ya dauki kalma daya ya faranta masa rai ya duba shi, maganar
  da ya dauka zata fada masa. Zai nuna masa kamanninsa da yadda aka yi shi, kuma wannan
  kalmar wacce a gabanta ta kasance mara sauti ce za ta ba shi ma''anarta a matsayin
  ladan aikin da ya kira ta da rayuwa da kuma ba shi abota. Kalma \u0257aya bayan
  \u0257ayan yana iya koya. Lexicons zai ba shi masaniya game da kalmomi. Marubutan
  da za su iya sa su za su sa shi kan sanannu. Amma shi da kansa dole ne ya za\u0253i
  haka a matsayin ba\u0199insa da sahabbansa. Zai zama sananne gareshi yayin da yake
  farin ciki tare da \u0199ungiyarsu. Ta haka ne mutum zai sami dacewa kuma ya kasance
  cikin shiri don yin tunani da tunani.\\nAkwai batutuwan tunani da yawa wa\u0257anda
  yakamata su shigo duniya, amma maza basu sami damar haihuwar su ba. Da yawa ana
  yin ciki amma ka\u0257an ne ake haife su. Zukatan maza ba uba ne da son rai ba kuma
  kwakwalwar su da zukatansu iyayen uwaye ne marasa gaskiya. Lokacin da kwakwalwar
  mutum tayi ciki, zaiyi farin ciki kuma lokacin haihuwa ya fara. Amma mafi yawa tunannin
  tunanin-har yanzu-haife shi ne ko kuma yana zubar da ciki saboda hankali da kwakwalwa
  marasa gaskiya ne. Tunanin da aka samu da kuma cewa shine ya shigo duniya kuma aka
  bayyana shi da kyau, yakan mutu mutuwa sau da yawa saboda wanda ke dauke da shi
  ya juyar da shi ga son zuciyarsa. Jin ikon, ya yi karuwanci da kayan nasa kuma ya
  juya ikon yin abin da ya cimma. Don haka da wa\u0257anda za su iya kawo tunanin
  duniya da zai yi kyau da nagarta, sun \u0199i haihuwar su kuma sun haifar da monstros
  a madadinsu wa\u0257anda ba su yi nasara ba kuma su mur\u0199ushe su. Wadannan abubuwa
  masu girman gaske suna neman \u0199asa mai amfani a cikin wasu tunanin mutane na
  son kai kuma suna cutar da lahani cikin duniya.\\nYawancin mutanen da suke tunanin
  cewa suna yin tunani ba sa tunani ko ka\u0257an. Basu iya haihuwa ko basu haihuwa
  ba tunani. Zukatansu sune kawai filin da aka shirya tunannin haihuwa da tunani mai
  \u0199arewa ko kuma wa\u0257anda suka wuce tunanin wasu mutane. Ba mutane da yawa
  a duniya masu tunani ne da gaske. Masu tunani suna ba da tunanin da ake yin amfani
  da su kuma ya inganta a fagen wasu hankalin. Abubuwan da mutane suke kuskure da
  wa\u0257anda suke tunanin suna tunani, ba tunani ne na gaskiya ba; watau ba a yin
  ciki da haihuwarsu. Yawancin rikice-rikice zai gushe yayin da mutane ke yin karanci
  game da abubuwa da yawa kuma suna \u0199o\u0199arin yin tunani game da abubuwa ka\u0257an.\\nBai
  kamata a raina jikin mutum ba, kada kuma a girmama shi. Dole ne a kula dashi, mutunta
  shi da daraja. Jikin mutum zai zama filin yakin sa da kuma yadda zai ci nasara,
  zauren shirye shiryensa na farawa, dakin mutuwarsa, da mahaifar haihuwarsa zuwa
  kowanne duniya. Jikin jiki kowane \u0257ayan wa\u0257annan.\\nMafi girma, mafi daukaka,
  mafi sirrin aiki da tsarkin aikin da jikin dan Adam zai iya aiwatarwa shi ne haihuwa.
  Akwai nau''ikan haihuwa wanda akwai yuwu ga jikin \u0257an adam ya bayar. A halin
  da yake ciki yanzu tana da ikon haihuwa kawai ta jiki, kuma ba koyaushe ya dace
  da wannan aikin ba. Jiki na zahiri zai iya haihuwar jiki madaidaici, kuma ta zahirin
  jiki na iya zama majibinci mai rai da jikin mahatma.\\nJikin jiki na ha\u0253aka
  da bayani a cikin yankin pelvic kuma an haife shi daga wurin jima''i. An ha\u0253aka
  jiki cikakke a cikin ciki kuma yana wuce bango na ciki. Jagora ne yake \u0257auka
  a cikin zuciya kuma yana hawa sama ta hanyar numfashi. Ana \u0257aukar gawar mahatma
  a kai kuma ana haife ta ta rufin kwanyar. Jiki na zahiri an haifeshi cikin duniyar
  zahiri. Haihuwar jiki mai kyau wacce aka haife ta zuwa duniyar sararin samaniya.
  Aka haife tsohuwar jiki a cikin duniyar tunani. An haifi jikin mahatma cikin duniyar
  ruhaniya.\\nMutanen ma''abota hankali wadanda suka yi zurfin tunani game da yuwuwar
  akwai wasu halittu kamar su adepts, masters ko mahatmas, amma wa\u0257anda yanzu
  sun yi imanin cewa larura ta bu\u0199ace su kuma mai yiwuwa ne, za su \u0199i fushi
  idan aka gaya musu cewa an haife su ta hanyar bango na ciki , mahaifa suna fitowa
  ne daga zuciya kuma cewa an haifi mahatma ta hanyar kwanyar. Idan akwai \u0199wararraki,
  masters da al''amuran dole ne su wanzu ta wata hanya, amma a cikin mafi girma, \u0257aukaka
  da \u0257aukaka, kuma mutum ya zama mai ikonsu da \u0257aukakarsu. Amma don yin
  tunanin haihuwar su ta jikin abokin aboki ko kuma jikin mutum, tunanin yana girgiza
  hankali ga hankalin mutum kuma furucin ba zai yiwu ba.\\nWa\u0257anda wa\u0257anda
  wannan alama alama m ba za a zargi. Ba\u0199on abu ne. Duk da haka haihuwa ta jiki
  kamar ba\u0199on take kamar sauran haihuwa. Amma idan za su koma cikin tunanin tunawa
  da shekarun yaransu, watakila za su iya tuna cewa a lokacin ne suka sami wani abin
  firgitarwa. Hankalinsu bai damu da tunanin kansu da kuma duniyar da ke kewayen su
  ba. Sun san cewa suna raye kuma sun zo daga wani wuri kuma sun gamsu da tunani har
  sai da wani \u0257an ya yi bayani, sannan kuma ana musu ba''a ko kuma yin \u0199arfin
  gwiwa don tambayar mahaifiya. Wa\u0257annan ranakun sun shude; muna rayuwa cikin
  wasu yanzu. Duk da haka, duk da cewa mun girma, amma har yanzu mu yara ne. Muna
  zaune; muna tsammanin mutuwa; muna \u0257okin mutuwa. Kamar yara, muna \u0257auka
  cewa zai iya kasancewa ta wata hanya ta banmamaki, amma ba damuwa game da hankalin
  mu. Mutane suna shirye su kasance dawwama. Hankali yayi tsalle a tunani. Ikklisiyoyin
  duniya sune abubuwan banmamaki ga muradin zuciyar mutum na rashin mutuwa. Kamar
  yadda yayin da yara, yanayinmu, \u0199warewarmu da ilmantarwa muke firgita da haihuwar
  haihuwar jikin mutum mara mutuwa. Amma tunani yayi sauki yayin da muke tsufa.\\nAlmajirin
  masters yana girmama jikinsa daban da lokacin da yake \u0257an duniya. Yayinda yake
  tsabtace zuciyarsa da gaskiya, kuma ba zai yi \u0199arya ba, zuciyarsa ta zama mahaifa,
  kuma cikin tsarkakakken tunani yana \u0257aukar tunani a cikin zuciyarsa; Yana \u0257aukar
  tunanin mai tunani. Wancan ne mafi girma a cikin kwanciyar hankali. Lokacin da take
  cikin nutsuwa zuciya zata zama mahaifa kuma tana da ayyukan mahaifar. A wa\u0257annan
  lokuta gabobin jikin mutum suna da ala\u0199a da juna ban da tsinkaye ta zahiri.
  Akwai hanya guda daya a duk al''adar haihuwa.\\nJikin jiki ba safai ake daukar cikinsa
  da tsabta ba. Yawancin lokaci suna kasancewa ne - saboda cikin rashin adalci \u2014
  wa\u0257anda aka haife su cikin azaba da tsoro, cuta ta same su kuma suka mutu.
  Da a ce za a sami jikin mutum cikin tsarkin rai, a kwashe shi lokacin haila zuwa
  haihuwa a cikin tsarkakakken yanayi, sannan kuma a hankali ake hada shi da mutane,
  to za a sami mazaje masu irin wannan karfin da karfin da mutuwa zata samu da wuya
  ya riske su.\\nDon a samar da jikin mutum da tsabta, mace da namiji dole su wuce
  tsawon lokacin yin tunani da shiri na jiki kafin a yarda da juna biyu. Lokacin da
  ake amfani da jikin mutum don halattaciyar doka ko wasu karuwanci, bai dace mu shigo
  da kayan jikin mutum da kyau zuwa cikin duniya ba. Don wani lokaci har yanzu jikin
  za su shigo cikin duniya kamar yadda suke yanzu. Zuciyar kirki tana neman halaye
  masu kyau wa\u0257anda zasu iya zama mutum. Amma dukkan jikin mutane da aka kera
  don masu jiran tsammani ne su shiga. Jiki daban-daban kuma masu halaye na jiki dole
  su kasance cikin shiri su jira nagartattun tunanin sabuwar tsere mai zuwa.\\nBayan
  \u0257aukar ciki ta jiki kuma kafin tayin ya \u0257auki sabon rai, zai sami kulawar
  cikin yanayin ciki. Bayan ya sami rai kuma har zuwa haihuwa, mahaifiyarsa ce take
  ciyar da ita. Ta hanyar jininsa an ciyar da tayin daga zuciyar mahaifiyarta.\\nA
  wani yanayin rikicewar ciki akwai canji dangane da gabobin. A lokacin haihuwa, lokacin
  da zuciya ta zama mahaifar mahaifiyar shirya jikin mahaifiya, to kai zai zama zuciyar
  da take ciyar dashi. Babban tunanin da aka yi tunaninsa a cikin zuciya ya wadatar
  da kansa har jiki ya girma ya \u0257auki sabon rai. Sannan shugaban, kamar yadda
  zuciya take, dole ne ya tanadi abincin da zai ha\u0257u da sabon jiki. Akwai kewaya
  tunani tsakanin zuciya da kai kamar yadda yake a tsakanin tayi da zuciyar mahaifiyarsa.
  Tayin jiki ne na jiki kuma yana ciyar da jini. Jikin Jagora jiki ne na tunani kuma
  dole ne ya ciyar da tunani. Tunani shine abincinsa kuma abincin da ubangiji yake
  ciyar dashi dole ne ya tsarkaka.\\nA lokacin da zuciya isasshe tsarkake yana kar\u0253ar
  yar \u0199waya mai sa alama daga rayuwarsa. Daga nan sai wani haske ya sauka ta
  hanyar numfashi wanda yake kara lalata kwayar cutar a cikin zuciya. A numfashi wanda
  ta haka ne numfashin mahaifinsa, maigidan, mutum kansa kansa hankali, ba jiki. Wani
  numfashi ne wanda yake lullube da numfashin huhu yana shigowa cikin zuciya ya gangaro
  da saurin sa kwayar cutar. Jiki mai girma ya hau kuma ana haifeshi ta hanyar numfashi.\\nAn
  \u0257auki jikin mahatma a kai yayin da kwayar cutar ta sa namiji da mace na wannan
  jikin da ake saduwa da ita daga sama. Lokacin da aka sami wannan babban ciki, kan
  zama cikin mahaifar inda akayi cikin ta. Kamar yadda a cikin ha\u0253akar tayin
  mahaifa ya zama mafi mahimmancin abubuwa a cikin jiki kuma dukkan jiki yana ba da
  gudummawarsa ta hanyar ha\u0253aka, don haka lokacin da zuciya ko kai suke aiki
  kamar mahaifa ana amfani da duk jikin ne da farko kuma bisa ga gudummawa don bayar
  da gudummawa ga goyon bayan zuciya da kai.\\nZuciyar da mutum bai riga ya shirya
  ya zama cibiyoyin gudanar da aiki don jikin babban malamin ba. Yanzu sune cibiyoyin
  daga inda ake haifar kalmomi da tunani. Zuciyar mutum ko ta kai kamar mahaifan mace
  ne wanda yake cikin su kuma ya ha\u0257u da abubuwa na rauni, \u0199arfi, kyau,
  iko, \u0199auna, laifi, mataimakin da duk abin da yake cikin duniya.\\nKwayoyin
  halittar sune wuraren haihuwa. Shugaban shine cibiyar samar da halitta. Ba za a
  iya amfani da shi irin wannan ta mutum ba, amma wanda zai yi shi mahaifar halitta
  dole ya girmama shi ya girmama shi. A halin yanzu, maza suna amfani da kwakwalwar
  su don zina. Lokacin da aka yi amfani da wannan amfanin, shugaban zai gaza haihuwar
  babban tunani ko kyakkyawan tunani.\\nWanda ya za\u0253i kansa a matsayin almajiri
  a makarantar masters, har ma ga kowane kyakkyawar manufa ta rayuwa, yana iya \u0257aukar
  zuciyarsa ko kan sa a matsayin masu siye da wuraren haihuwa na tunaninsa. Duk wanda
  ya ba da kansa a cikin tunani ga rai marar mutuwa, wanda ya san cewa zuciyarsa ko
  ta kansa tsattsarka ce, to ba zai iya rayuwa ta duniyar masu son rai ba. Idan yayi
  \u0199o\u0199arin yin duka biyun, zuciyarsa da ta kansa zasu zama kamar wuraren
  zina ko zina. Hanyoyin da ke haifar da kwakwalwa sune tashoshi wanda tunani mara
  kyau ya shiga don ma''amala da tunani. Wadannan tunani dole a kiyaye. Hanyar hana
  su ita ce tsaftace zuciya, za\u0253i za\u0253ar wa\u0257anda suka dace da tunani
  da kuma fa\u0257in gaskiya.\\nAna iya \u0257aukar shawarwari, masters da mahatmas
  azaman abubuwan tunani kuma zasu amfana ga mai tunani da tserensa. Amma wa\u0257annan
  batutuwan za su kasance da fa''ida ga wa\u0257anda kawai za su yi amfani da dalilinsu
  da kyakkyawar shawara a cikin shawara. Ba wata sanarwa da aka yi game da wannan
  al''amari da za a karba sai dai in ta bijiro wa tunani da zuciya a matsayin gaskiya,
  ko kuma sai an ba da tabbaci ta hanyar kwarewar mutum da lura da rayuwa, kuma da
  alama mai ma''ana kamar yadda ya dace da ci gaba, juyin halitta da ci gaba. na mutum.\\nLabaran
  da suka gabata kan kyawawan halaye, masters da mahatmasai na iya da amfani ga mai
  kyakkyawan hukuncin, kuma baza su iya cutar dashi ba. Hakanan suna iya kasancewa
  da fa''ida ga \u0257an fashin idan yabi shawarar da aka bashi kuma baya \u0199o\u0199arin
  aikata abubuwanda ya wadatar daga abubuwan da ya karanta amma wa\u0257anda ba a
  rubuce ba.\\nAn sanar da duniya game da adepts, masters da mahatmas. Ba za su buga
  gabansu a kan mutane ba, amma za su jira har mutane su rayu kuma su girma cikin
  ta. Kuma mutane za su rayu kuma su girma a ciki.\\nDuniya biyu suna neman shigarwa
  ko fitarwa a cikin tunanin mutum. A yanzu dan adam yana yanke shawarar wanne duniyan
  da zai fi so: duniyar tauraruwa ta hankali da duniyar tunani. Bai isa mutum ya shiga
  ba, amma zai koyi shiga daya. Ba zai iya shiga biyun ba. Idan ya yanke shawara game
  da duniyar ta zahiri da hankula kuma ya aikata hakan, zai zo gaban sanarwa game
  da ka''idoji, kuma a wannan rayuwar ko wadanda zasu zo ya zama almajircin su. Idan
  ya yanke shawara don ci gaban hankalinsa zai iya da gaske a lokacin da masanan zasu
  zo su gane shi, kuma ya zama almajiri a makarantarsu. Dukansu dole ne suyi amfani
  da hankalinsu; amma shi mai hankali zai yi amfani da hankalinsa don samun ko samar
  da abubuwan hankali kuma ya sami damar shiga duniyar hankali, kuma yayin da yake
  kokarin tunanin shi kuma ya ri\u0199e tunani a zuciyarsa kuma zaiyi aiki don samun
  \u0199ofar, duniya ta hankali, duniyar sama, za ta zama da gaske a gare shi. Zai
  daina zama hasashe kuma ana iya saninsa da gaskiya.\\nDuk wanda zai san masters
  ya shiga duniyar tunani dole ne ya bada ikon tunaninsa ga ci gaban tunaninsa, da
  yin kira cikin amfani da hankalin kwakwalwar sa ba tare da hankalin sa ba. Bai kamata
  ya yi watsi da duniyar hankali ba, duniyar taurari, amma idan ya fahimce shi to
  ya yi kokarin amfani da hankalinsa har sai ya shu\u0257e. A cikin tunani har ma
  ta \u0199o\u0199arin yin tunani game da duniyar tunani, hankali zai iya fahimtar
  sa.\\nSlightan ka\u0257an ka\u0257an, mayafi, ya raba tunanin mutum daga duniyar
  tunani, kuma kodayake yana nan da \u0199asar haihuwarsa, da alama ba\u0199on, ba\u0199on
  abu, ba a sani ba, ga \u0199aura. Mutum zai kasance cikin zaman hijira har sai ya
  sami aiki ya kuma biya fansa.\\nEndarshen.\"", "\"Wannan rukunin yanar gizon (wanda
  ake kira nan gaba \\\"wannan rukunin yanar gizon\\\") yana amfani da fasahohi kamar
  su cookies da kuma tags don amfanin inganta amfani da wannan rukunin yanar gizon
  ta abokan ciniki, talla bisa ga tarihin samun dama, fahimtar matsayin amfani da
  wannan rukunin yanar gizon, da sauransu. . Ta danna ma\u0253allin \\\"Amince\\\"
  ko wannan rukunin yanar gizon, kun yarda da amfani da kukis don dalilan da ke sama
  da kuma raba bayananku ga abokan hul\u0257armu da ''yan kwangila.Game da sarrafa
  bayanan sirriKa''idodin Sirrin Promungiyar Promungiyar Al''adu na Ota WardDa fatan
  za a koma zuwa.\\nBa ma kar\u0253ar sokewa ko canje-canje bayan an tabbatar da aikace-aikacen.\\nA
  ka''ida, ba ma kar\u0253ar dawowa ko musanya saboda jin da\u0257in abokin ciniki.\\nDa
  fatan za a tuntu\u0253e mu idan samfurin da aka kawo ya lalace ko ya lalace.Za mu
  mayar da martani bayan tabbatar da gaskiya.\\nZa mu tuntube ku daga adireshin da
  ke \u0199asa.Da fatan za a saita adireshin da ke tafe don samun karbuwa a kan kwamfutarka
  na sirri, wayar hannu, da sauransu, shigar da bayanan da ake bu\u0199ata, da nema.\\nForm
  aikace-aikace\\nShigar\\nTabbatar da abun ciki\\naika gaba daya\\n\u203bAbun bu\u0199ata
  ne, don haka a tabbatar kun cika shi.\"", "\"A farkon wannan mako mai karewa ne
  Gwamnan jihar Yobe, Alhaji Mai Mala Buni, ya tabbatar da nada Dakta Ali Abbas, a
  matsayin babban jami\u2019in da zai wakilci jihar Yobe a hukumar kula da bunkasa
  yankin arewa maso gabas (NEDC), kuma Ko\u2019odinatan ta a yankin (Yobe Focal Person
  and Coordinator). Wanda wannan matakin ya jawo jama\u2019ar jihar nuna matukar farin
  ciki da matakin tare da bayyana shi a matsayin wanda ya cancanta kuma kwararren
  da zai ba maras da kunya.\\nBugu da kari kuma, bayyana sunan Dakta Ali Ibrahim Abbas
  a wannan matsayi, ya jawo jama\u2019a sai gamsuwa suke yi dangane da shi, saboda
  kyakkywar mu\u2019amalar sa da jama\u2019a, kana da kwarewar sa kuma da sanin matsalolin
  al\u2019ummar yankin tare da fafutuka da fadi-tashin da ya dade yana yi wajen nema
  wa raunana da matasa yanci. Lamarin da zai taimaka wajen kasancewa babbar dama tare
  da aikin sake farfado da wannan yanki na arewa maso gabashin Nijeriya, wanda ya
  sha fama da matsalar tsaron Boko Haram.\\nLEADERSHIP A YAU JUMA\u2019A, ta fahimci
  yadda jama\u2019a da dama a jihar Yobe suka bayyana ra\u2019ayoyin su dangane da
  yadda Gwamna Buni ya nada Dakta Ali Abbas, a matsayin babban jami\u2019i kuma wakilin
  jihar Yobe a wannan hukumar, inda kuma suka danganta matashin da kokari da fadi-tashin
  ganin an samu ci gaban al\u2019ummar sa tare da burin sake farfado da harkokin ilimi,
  kiwon lafiya da inganta rayuwar kananan yara, mata da maras galihu, tare da kyautata
  yanayin walwalar jama\u2019a da tattalin arziki, wadanda matsalar tabarbarewar sha\u2019anin
  tsaron Boko Haram ta shafa a yankin arewa maso gabas.\\nAn haifi Dakta Ali Abbas
  garin Gashuwa ta karamar hukumar Bade, a jihar Yobe, a ranar 2 ga watan Yulin 1982.
  Kuma ya kammala karatun sa na sakandire (SSCE) a Federal Gobernment College Buni
  Yadi, wanda ya ba shi damar zarcewa jami\u2019ar Maiduguri (UNIMAID), inda ya samu
  digirin sa na farko a sha\u2019anin mulki (B. Sc Public Administration) a 2006.
  Daga bisani a 2008 kuma Ali Abbas ya yi Diploma \u2018Post Graduate\u2019 a fannin
  dabarun koyarwa (PGDE) duk a jami\u2019ar.\\nTafiyar Ali Abbas a fagen ilimi ta
  mika zuwa jami\u2019ar Bayero Kano domin yin digirin sa na biyu, a fannin ilimin
  kimiyyar siyasa (M.Sc Political Science) a shekarar 2014. Haka zalika kuma, a 2017
  ya sake cilla wa zuwa jami\u2019ar Putra da ke kasar Malaysia, inda ya yi dagirin-digirgir
  (PhD), yayin da ya kammala da sakamako mafi kyau (first-class), a fannin ilimin
  sha\u2019anin shugabanci da siyasa (Politics and Gobernment).\\nDakta Ali Abbas
  ya fara akin gwamnati a matsayin malamin makaranta, a shekarar 2006. Daga bisani
  kuma ya koma aiki da kwalejin ilimin jihar Yobe, Umar Suleiman College of Education,
  da ke Gashuwa; a matsayin malamin ba na din-din-din ba. Wanda daga baya ya zama
  cikakken malami a kwalejin (Assistant Lecturer). A 2008 Dakta Abbas ya samu aikin
  malamin jami\u2019ar jihar Yobe (YSU) a matsayin Graduate Assistant. Kuma tun daga
  wannan lokaci, ya yi aiki a bangarori daban-daban na jami\u2019ar, inda kuma shi
  ne shugaban sashen (HOD) fannin Public Administration a jami\u2019ar, daga 2011
  zuwa 2014- haka zalika kuma shi ne shugaban sashen fannin kimiyyar siyasa da sha\u2019anin
  shugabanci a jami\u2019ar, daga 2017 zuwa nada shi wannan sabon mukami. Sannan kuma
  babban malamin tuntuba na jami\u2019ar Gwamnatin Tarayya (Fuga) da ke Gashuwa.\\nDakta
  Ali Abbas ya taka muhimmiyar rawa a kasancewar sa malamin jami\u2019ar jihar Yobe
  wanda ya zauna matsayin mamba a kwamitoci daban-daban da jami\u2019ar ta sha kafa
  wa. Kana da jagorantar wasu aikace-aikacen da jami\u2019ar ta sa a gaba tare da
  jagorantar taimaka wa dalibai da kungiyoyi, a jami\u2019ar ci gaba.\\nA hannu guda
  kuma, Dakta Abbas ya shahara wajen al\u2019amurran rubuce-rubuce kula da gyare-gyaren
  mukalu da mujallu (Editor) a fannoni daban-daban na sha\u2019anin ilimi- a cikin
  gida da wajen Nijeriya. Sannan kuma matashi wanda ya sha gudanar da ayyukan binciken
  ilimi, a fannonin rayuwa, wadanda suka hada da \u2018ci gaban sha\u2019anin siyasa
  da shugabanci\u2019, \u2018yadda za a sake farfado da yankunan da matsalar tsaro
  ta shafa\u2019 a yankin arewa maso gabas da makamantan su. Wanda kuma dubun-dubatar
  jama\u2019a ke bibiyar rubuce-rubuucen sa a kafafen sadarwa na zamani.\\nMatashi
  Dakta Abbas, yana kula da wata cibiyar tuntuba wadda ya kafa, mai suna \u2018Sahara
  Integrated Consulting and Training\u2019 (SICAT), wadda ko shakka babu ya bayar
  da babbar gudumawa wajen horas da matasa hanyoyin cin gajiyar rayuwar su tare da
  muhimmancin kyautata mu\u2019amala da zaman tare, kuma mai shiga tsakani don sulhunta
  wasu rikita-rikirtar da kan taso a tsakanin al\u2019umma, bayar da sjawarwarin hanyoyin
  bunkasa ci gaba, ta hanyar shirya tarukan karawa juna-sani da fadakarwa, musamman
  a yankin arewa maso gabs da sauran bangarorin kasar nan.\\nHaka kuma, Dakta Abbas
  ya yi aiki da kungiyoyin ayyukan jinkai da bayar da tallafi na kasa da kasa, a cikin
  shekaru da dama, wadanda suka hada da irin su UNDP, UNICEF, WHO, Bankin Duniya,
  British Council DfID, Nigeria Stability and Reconciliation Programme (NSRP), North
  East Regional Initiatibe (NERI), National Agency for the Control of AIDS (NACA),
  Presidential Commission of North East Interbention (PCNI), Bictim Support Fund (BSF),
  da Multi-Sectoral Crisis Recobery Project (MCRP).\\nBaya ga haka kuma, Dakta Ali
  Abbas mabma ne a cibiyar kula da sha\u2019anin shugabanci ta kasa \u2018Fellow Chartered
  Institute of Administration\u2019 (FCIA), tare da cibiyoyin kwararru da kungiyoyin
  kasashen duniya daban-daban, wadanda suka hada da kungiyar daliban kimiyyar siyasa
  ta duniya (IPSA), International Society for Debelopment, Sustainability (ISDS),
  Institute of Registered Administratibe Managers ta Nijeriya (IRAMN), Nigeria Political
  Science Association (NPSA), da sauran su. Kana matashi mafi karancin shekaru wanda
  ya samu lambar girmama wa ta \u2018Nigeria Selfless Serbice Gold Award\u2019 (NISSGA).\\nDakta
  Ali Ibrahim Abbas sanannen hazikin matashi ne wanda ya yi fice a fadin yankin arewa
  maso gabas da ma arewacin Nijeriya baki daya a bangarorin sha\u2019anin rayuwa daban-daban,
  kuma mutum mai kishin kasar sa tare da al\u2019ummar sa. Wanda a zaben da ya gabata
  na 2019 ya rike matsayi da dama, da suka hada da Daraktan manufofi da tsare-tsaren
  kwamitin yakin neman zaben jam\u2019iyyar APC a jihar Yobe, tare da wasu kwamitoci
  da harokokin zaben gwamna da na shugaban kasa a babban zaben da ya gabata, na 2019.\\nA
  matsayin sa na kwararren masani; malamin jami\u2019a (PhD) kuma wanda ya rike mukamai
  da dama, a gwamnatance da a siyasance tare da mu\u2019amala da kungiyoyin bayar
  da tallafi sannan kuma wanda ya san matsalolin yankin arewa maso gabas, musamman
  yankunan da matsalar tsaron Boko Haram ta tagayyara. Har wala yau da kokari wajen
  hada hannu da karfe tare da gwamnatoci da kungiyoyi wajen sake farfado da yankin,
  ana sa ran nada Dakta Ali Ibrahim Abbas a matsayin babban jami\u2019i a wannan hukumar
  sake farfado da ci gaban yankin arewa maso gabas (NEDC) da Gwamna Mai Mala ya yi
  masa, zai bashi dama wajen taka muhimmiyar rawa ta hanyar yin amfani da basirar
  sa wajen yin aiki tukuru don ci gaban yankin.\"", "\"Kamfanin ba da shawara kan
