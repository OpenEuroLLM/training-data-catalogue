  da kahoni goma, kuma bisa kawunansa akwai kambi bakwai. Wutsiyarsa ta share sulusin
  taurari a sama ta jefar da su \u0199asa. (Rev 12: 3-4)\\nA cikin Babi na farko,
  St. John ya ga wahayin Yesu yana ri\u0199e da bakwai stars a hannun damansa:\\nStars
  taurari bakwai mala''ikun majami''u bakwai ne. (Rev. 1:20).\\nWata\u0199ila fassarar
  da masana littafi mai tsarki suka bayar ita ce cewa wa\u0257annan mala''iku ko taurari
  suna wakiltar bishops ko fastocin da ke jagorantar al''ummomin Kirista bakwai. Don
  haka, Paul VI yana magana ne akan ridda a cikin rukunin limaman da \u201caka kwashe\u201d.
  Kuma, kamar yadda muka karanta a 2 Tas 2, ridda ta gabaci kuma ta kasance tare da
  \u201cmai-mugunta\u201d ko ma\u0199iyin Kristi wanda Iyayen Cocin ma suka kira shi
  \u201cdabba\u201d a cikin Wahayin Yahaya 13.\\nJohn Paul II shima yayi kwatancen
  lokacinmu kai tsaye zuwa sura ta goma sha biyu ta Ruya ta Yohanna ta hanyar daidaitawa
  zuwa ya\u0199i tsakanin al''adun rayuwa da al''adar mutuwa.\\nWannan gwagwarmaya
  ta yi daidai da gwagwarmayar gwagwarmaya da aka bayyana a cikin [Rev 11: 19-12:
  1-6, 10 a kan ya\u0199in tsakanin \u201dmatar da ke sanye da rana\u201d da \u201cdragon\u201d].
  Yakin mutuwa a kan rayuwa: \u201cal\u2019adar mutuwa\u201d na neman \u0257ora kanta
  ne akan muradinmu na rayuwa, da rayuwa cikakke\u2026 -POPE JOHN PAUL II, Cherry
  Creek State Park Homily, Denver, Colorado, 1993\\nA zahiri, St. John Paul II ya
  bayyana a sarari zuwa nan gaba\u2026\\n\\\"\u0198iyayya,\\\" wanda aka annabta a
  farkon, an tabbatar da shi a cikin Apocalypse (littafin abubuwan da suka faru na
  \u0199arshe na Ikilisiya da duniya), wanda a ciki akwai alamar \\\"mace,\\\" a wannan
  lokacin \\\"an sa masa rana\\\" (Wahayin Yahaya 12: 1). -POPE YAHAYA PAUL II, Redemptoris
  Mater, n 11 (bayanin kula: rubutu a cikin kwaskwarimar kalmomin Paparoma ne)\\nHakanan
  Paparoma Benedict bai yi jinkiri ba ya shiga cikin yankin annabci na Wahayin da
  yake amfani da shi a zamaninmu:\\nWannan ya\u0199in da muka sami kanmu\u2026 [a
  kan] ikon da ke lalata duniya, ana maganarsa a cikin babi na 12 na Wahayin\u2026
  An ce dragon yana jagorantar babban rafin ruwa kan mace mai guduwa, don share ta\u2026
  Ina tsammanin cewa yana da sau\u0199i a fassara abin da kogin yake wakilta: wa\u0257annan
  ra\u0199uman ruwa ne suka mamaye kowa, kuma suke so su kawar da imanin Cocin, wanda
  kamar ba shi da inda zai tsaya a gaban ikon wa\u0257annan ra\u0199uman ruwa wa\u0257anda
  suka \u0257ora kansu a matsayin hanya \u0257aya tilo na tunani, shine kadai hanyar
  rayuwa. \u2014POPE BENEDICT XVI, zama na farko na taron majalisar dokoki na musamman
  akan Gabas ta Tsakiya, Oktoba 10, 2010\\nPaparoma Francis ya maimaita wadannan tunani
  lokacin da yake magana kai tsaye game da wani labari game da Dujal, Ubangijin Duniya.
  Ya kwatanta shi da zamaninmu da \u201cmulkin mallaka na akida\u201d wanda ke faruwa
  wanda ke bu\u0199atar kowa da kowa \u201c tunani guda. Kuma wannan tunanin shi ka\u0257ai
  ''ya''yan son duniya ne\u2026 Wannan\u2026 ana kiransa ridda. \u201d[1]Homily, Nuwamba
  18, 2013; Zenit\\n\u2026 Wadanda suke da ilimi, musamman ma albarkatun tattalin
  arziki don amfani da su, [suna da] mamayar birgewa a kan dukkan bil''adama da ma
  duniya baki daya\u2026 A hannun wa ne duk wannan karfin yake, ko kuma a karshe zai
  kare? Yana da ha\u0257arin gaske ga \u0199aramin \u0253angaren \u0257an adam ya
  same shi. \u2014KARANTA FANSA, Laudato zuwa '', n 104; www.karafiya.va\\nBenedict
  na 19 ya kuma fassara \u201cBabila\u201d a cikin Wahayin Yahaya XNUMX, ba a matsayin
  tsohuwar \u0199ungiya ba, amma yana magana ne game da biranen lalatattu, gami da
  na zamaninmu. Wannan gurbatarwar, wannan \u201cabin duniya\u201d - ne mai cike da
  son jin da\u0257i \u2014 ya ce, yana jagorantar \u0257an adam zuwa gare shi bautar.\\nThe
  Littafin Ru''ya ta Yohanna ya hada da cikin manyan zunubban Babila - alama ce ta
  manyan biranen duniya marasa addini - gaskiyar cewa tana kasuwanci da jiki da rayuka
  kuma tana daukar su a matsayin kayayyaki (cf. Rev 18: 13). A wannan mahallin, matsalar
  Magunguna kuma sun dawo da kansa, kuma da karfi yana fadada dorinar dorinar ruwa
  a duk duniya - bayyananniyar magana ta zaluncin mammon wanda ke lalata mutane. Babu
  wani abin farin ciki da ya isa, kuma yawan yaudarar maye ya zama tashin hankali
  wanda ke wargaza yankuna gaba\u0257aya - kuma duk wannan da sunan mummunar fahimtar
  freedomanci wanda a zahiri yana lalata freedoman Adam kuma yana lalata shi. \u2014POPE
  BENEDICT XVI, A yayin gaisuwar Kirsimeti, 20 ga Disamba, 2010; http://www.vatican.va/\\nBauta
  ga wa?\\nKYAUTA\\nAmsar, ba shakka, ita ce tsohuwar macijin, shaidan. Amma mun karanta
  a wahayin Yahaya cewa shaidan ya ba da \u201cikonsa, da kursiyinsa, da ikonsa mai
  girma\u201d ga \u201cdabba\u201d da ta tashi daga cikin teku.\\nYanzu, sau da yawa
  a cikin tafsirin mai matukar muhimmanci na tarihi, ana ba da \u0257an gajeren fassara
  ga wannan rubutu kamar yana nufin Nero ko wani mai tsanantawa na farko, saboda haka
  yana nuna cewa \u201cdabbar\u201d John ta riga ta zo ta tafi. Koyaya, wannan ba
  tsattsauran ra''ayi ba ne na Iyayen Cocin.\\nMafi yawan Iyaye suna ganin dabbar
  a matsayin wakiltar ma\u0199iyin Kristi: Misali Iranaeus, alal misali, ya rubuta:
  \u201cDabbar da ta tashi ita ce asalin mugunta da \u0199arya, don haka za a iya
  jefa cikakken ikon ridda da yake \u0199unshe cikin wutar tanderu. \u201d - cf. St.
  Irenaeus, Dangane da Heresies, 5, 29; Littafin Navarre, Wahayin, p. 87\\nSt. John
  ya siffanta dabbar ne wanda ya ga an ba ta \u201cBakin da ke fahariya da alfasha,\u201d
  kuma a lokaci guda, masarauta ce mai ha\u0257uwa. [2]Rev 13: 5 Har yanzu kuma, St.
  John Paul II kai tsaye yana kwatanta wannan \u201ctawayen\u201d da \u201cdabba\u201d
  ke jagoranta da abin da ke faruwa a wannan sa''ar:\\nAbun takaici, juriya ga Ruhu
  Mai Tsarki wanda St. Paul ya nanata a ciki da kuma girman ra''ayi kamar tashin hankali,
  gwagwarmaya da tawaye da ke faruwa a cikin zuciyar \u0257an adam, yana samuwa a
  cikin kowane zamani na tarihi kuma musamman ma a wannan zamanin. girman waje, wanda
  ke \u0257auka siffar kankare kamar yadda al''adun gargajiya da wayewa suka kunsa,
  a matsayin tsarin ilimin falsafa, akida, shirin aiki kuma don tsara halayen mutum.
  Ya kai ga bayyananniyar maganarsa a cikin jari-hujja, duka a tsarinta na asali:
  a matsayin tsarin tunani, da kuma a aikace: azaman hanyar fassara da kimanta gaskiya,
  haka kuma kamar yadda shiri mai dacewa. Tsarin da yafi bunkasa kuma ya haifar da
  mummunan sakamako sakamakon wannan nau''in tunani, akida da gur\u0253ataccen zance
  ne na jari-hujja da kuma zahiranci, wanda har yanzu ana san shi azaman mahimmin
  abu na Marxism. \u2014POPE YOHAN PAUL II, Dominum da Vivificantem, n 56\\nA zahiri,
  Paparoma Francis ya kwatanta tsarin yanzu - wani nau''in ha\u0257akar Kwaminisanci
  kuma jari-hujja- zuwa wani irin dabba cewa masu cin abinci:\\nA cikin wannan tsarin,
  wanda yake da cinye duk abin da ya tsaya a kan hanyar samun riba, duk abin da ke
  da rauni, kamar muhalli, ba shi da kariya a gaban bukatun wani tsarkake kasuwa,
  wanda ya zama kawai doka. -Evangelii Gaudium, n 56\\nYayin da yake har ila yau,
  Joseph Ratzinger ya ba da garga\u0257i game da wannan dabba - garga\u0257in da ya
  kamata ya dace da kowa a wannan zamani na fasaha:\\nApocalypse yayi magana game
  da abokin gaba na Allah, dabba. Wannan dabbar ba ta da suna, amma lamba ce [666].
  A [tsoratarwar sansanonin], sun soke fuskoki da tarihi, suna canza mutum zuwa adadi,
  suna rage shi zuwa wani babban injin. Mutum ba komai bane illa aiki.\\nA zamaninmu,
  kar mu manta cewa sun tsara kaddarawar wata duniyar da ke tattare da hadarin daukar
  nau''ikan sansanonin tattarawa, idan har aka amince da dokar injin duniya. Injinan
  da aka gina suna aiwatar da doka guda. Dangane da wannan dabarar, dole ne mutum
  ya fassara ta da kwamfuta kuma wannan zai yiwu idan aka fassara shi zuwa lambobi.\\nDabbar
  tana da lamba kuma tana rikida zuwa lambobi. Allah, duk da haka, yana da suna kuma
  yana kira da suna. Shi mutum ne kuma yana neman mutumin. \u2014Cardinal Ratzinger,
  (POPE BENEDICT XVI) Palermo, 15 ga Maris, 2000\\nA bayyane yake cewa, amfani da
  Littafin Ru''ya ta Yohanna zuwa zamaninmu ba wasa ba ne kawai, amma daidai yake
  tsakanin masu fashin baki.\\nTabbas, Iyayen Ikklisiyar Farko ba su yi jinkirin fassara
  Littafin Ru''ya ta Yohanna a matsayin hangen nesa cikin abubuwan da za su faru a
  nan gaba ba (duba Sake Kama da Timesarshen Zamani). Sun koyar, bisa ga al''adar
  rayuwar Cocin, cewa Babi na 20 na Wahayin Yahaya shine m abin da ya faru a rayuwar
  Ikilisiya, wani lokaci ne na alama na \u201cshekaru dubu\u201d wanda, bayan dabbar
  ta lalace, Kristi zai yi mulki cikin tsarkakansa a cikin \u201clokacin salama\u201d.
  A zahiri, yawancin wahayi na annabci na zamani yayi magana daidai game da sabuntawa
  mai zuwa a cikin Ikilisiyar da manyan matsaloli suka gabace shi, gami da ma\u0199iyin
  Kristi. Su hoton madubi ne na koyarwar Ubannin Ikilisiya na farko da kalmomin annabci
  na popes na zamani (Da gaske ne Yesu yana zuwa?). Ubangijinmu da kansa ya nuna cewa
  tsananin da ke zuwa na \u0199arshen zamani ba, saboda haka, yana nufin cewa \u0199arshen
  duniya ya kusa.\\nDole ne irin wadannan abubuwan su fara faruwa, amma ba nan da
  nan zai zama karshe ba. (Luka 21: 9)\\nA zahiri, jawabin Kristi game da \u0199arshen
  zamani bai cika ba har zuwa yanzu kawai yana ba da \u0199arshen wahayi game da wahayi.
  Anan ne annabawan Tsohon Alkawari da Littafin Ru''ya ta Yohanna suka ba mu \u0199arin
  fahimtar abubuwan da za su iya ba mu damar \u0253ata maganar Ubangijinmu, ta haka
  za mu sami cikakkiyar fahimta game da \u201c\u0199arshen zamani.\u201d Bayan duk
  wannan, har an gaya wa annabi Daniyel cewa wahayi na \u0199arshen da sa\u0199on
  \u2014 wa\u0257anda suke da madubi na wa\u0257anda ke cikin Apocalypse - za a hatimce
  su \u201char zuwa \u0199arshen zamani.\u201d [3]cf. Dan 12: 4; duba kuma Mayafin
  Yana Dagawa? Wannan shine dalilin da yasa Al''adar Tsarkaka da ci gaban koyaswa
  daga Iyayen Cocin ba makawa. Kamar yadda St. Vincent na Lerins ya rubuta:\\n\u2026
  Idan wani sabon tambaya ya taso wanda ba a ba da irin wannan shawarar ba, to ya
  kamata su koma ga ra''ayoyin Iyaye masu tsarki, na wadancan a kalla, wadanda, kowanne
  a lokacinsa da wurin sa, suka ci gaba da kasancewa cikin hadin kan tarayya da kuma
  na bangaskiya, an yarda da su a matsayin iyayengijin yarda. kuma duk abin da wa\u0257annan
  za a iya samun sun ri\u0199e, da hankali \u0257aya da kuma yarda \u0257aya, wannan
  ya kamata a lasafta gaskiyar koyarwar Katolika ta Cocin, ba tare da wata shakka
  ko \u0199ai\u0199ayi ba. -Na gama garina 434 AD, \\\"Domin tsufa da kuma Universality
  na Katolika Faith da Profane Novelties na All Heresies\\\", Ch. 29, n 77\\nDomin
  ba kowace maganar Ubangijinmu bace aka rubuta; [4]cf. Yawhan 21:25 an zartar da
  wasu abubuwa ta baki, ba kawai a rubuce ba. [5]gwama Matsalar Asali\\nNi da kowane
  kirista na asali muna da tabbacin cewa za a tayar da jiki na jiki wanda shekara
  dubu ke nan a sake gina shi, aka yi shi, da kuma fadada birnin, kamar yadda Annabawan
  Ezekiel, Isaias da sauransu\u2026. Wani mutum a cikinmu mai suna Yahaya, daya daga
  cikin Manzannin Kristi, ya karba kuma ya annabta cewa mabiyan Kristi za su zauna
  a Urushalima har tsawon shekara dubu, kuma daga baya duk duniya kuma, a takaice,
  tashin matattu na har abada da hukunci zai faru. \u2014L. Justin Martyr, Tattaunawa
  tare da Trypho, Ch. 81, Ubannin Coci, Tarihin Kiristanci\\nSHIN BA SA''BON RU''YA
  TA SHIGA LITTAFIN ALLAH NE BA?\\nMalaman Nassi da yawa sun nuna shi, daga Dr. Scott
  Hahn zuwa Cardinal Thomas Collins, cewa Littafin Ru''ya ta Yohanna ya yi daidai
  da Liturgy. Daga \u201cTsarin Yin Ibada\u201d a cikin surori na farko zuwa Liturgincin
  Kalmar ta hanyar bu\u0257ewar gungura a Babi na 6; da addu''o''in yanka (8: 4);
  \u201cAmin mai girma\u201d (7:12); amfani da turare (8: 3); candelabra ko fitila
  (1:20), da sauransu. Shin wannan ya saba wa fassarar wahayi game da abin da zai
  faru nan gaba?\\nAkasin haka, yana tallafawa gaba \u0257aya. A zahiri, wahayin Yahaya
  ya kasance daidai ne da Liturgy, wanda shine abin tunawa da rai na Son zuciya, Mutuwa
  da Tashin Kiyama na Ubangiji. Cocin kanta tana koyar da cewa, kamar yadda Shugaban
  ya fita, haka kuma Jiki zai ratsa ta sha''awarta, mutuwarsa, da tashinsa.\\nKafin
  zuwan Kristi na biyu Ikilisiya dole ne ta wuce ta gwaji na \u0199arshe wanda zai
  girgiza bangaskiyar masu bi da yawa Church Ikilisiyar za ta shiga \u0257aukakar
  mulkin ne kawai ta wannan Idin Passoveretarewa na \u0199arshe, lokacin da za ta
  bi Ubangijinta cikin mutuwarsa da Tashinsa. -Catechism na cocin Katolika, 675, 677\\nHikimar
  Allah ce kawai za ta iya yin wahayi zuwa ga Littafin Ru''ya ta Yohanna bisa ga tsarin
  Liturgy, yayin da a lokaci guda kuma ya bayyana shirye-shiryen ru\u0257ani na mugunta
  game da Amaryar Kristi da nasarorin da ta samu a kan mugunta. Shekaru goma da suka
  gabata, na rubuta jerin lafazin wannan kwatankwacin da ake kira Gwajin Shekara Bakwai.\\nTARIHI
  MAI TARIHI\\nFassarar nan gaba na Littafin Ru''ya ta Yohanna ba, don haka, ke\u0253ance
  mahallin tarihi. Kamar yadda St. John Paul II ya ce, wannan ya\u0199i tsakanin \u201cmacen\u201d
  da tsohuwar macijin \u201cgwagwarmaya ce da za ta ci gaba har tsawon tarihin \u0257an
  adam.\u201d[6]gwama Sabis Mater, n.11 Tabbas, Apocalypse na St. John shima yana
  magana game da wahala a zamaninsa. A cikin wasikun zuwa Ikklisiyoyin Asiya (Rev
  1-3), Yesu yana magana ne musamman ga Krista da Yahudawa na wancan lokacin. A lokaci
  guda, kalmomin suna ri\u0199e da garga\u0257i na yau da kullun ga Ikilisiya a kowane
  lokaci, musamman game da \u0199auna ta yi sanyi da bangaskiya mai \u0257umi. [7]gwama
  Soyayya Ta Farko A zahiri, na yi mamakin ganin daidaito tsakanin jawabin rufe Paparoma
  Francis ga taron majalisar Krista da wasi\u0199un Kristi zuwa ga majami''u bakwai
  (duba Gyara biyar).\\nAmsar ba wai littafin Ru''ya ta Yohanna ko dai na tarihi ko
  kuma na nan gaba kawai ba ne - a''a, duka biyun ne. Hakanan zai iya zama ya fa\u0257i
  game da annabawan Tsohon Alkawari wa\u0257anda kalmominsu ke magana game da takamaiman
  abubuwan da ke faruwa a cikin gida da kuma lokutan tarihi, kuma duk da haka, an
  rubuta su ta yadda har yanzu suna ci gaba da biyansu na gaba.\\nDomin asirin Yesu
  bai zama cikakke kuma an cika su ba. Su cikakke ne, hakika, a cikin Yesu, amma ba
  a cikin mu ba, wa\u0257anda suke membobinsa, kuma ba cikin Ikilisiya ba, wanda jikinsa
  ne mai ruhaniya. \u2014L. John Eudes, rubutun \\\"A kan mulkin Yesu\\\", Tsarin
  Sa''o''i, Vol IV, shafi na 559\\nLittafi kamar karkace yake cewa, yayin da yake
  zagayawa cikin lokaci, ana cika shi akai-akai, a matakai daban-daban. [8]gwama Da''irar\u2026
  Karkace Misali, yayin da sha''awar da tashin Yesu daga matattu ya cika kalmomin
  Ishaya game da Bawan da ke Wahala\u2026 bai cika game da jikinsa na Sihiri ba. Har
  yanzu ba mu kai ga \\\"cikakken adadi\\\" na Al''ummai a cikin Ikilisiya ba, da
  hira da Yahudawa, tashi da faduwar dabban, da sar\u0199ar Shai\u0257an, maido da
  zaman lafiya a duniya, da kuma kafa mulkin Kristi a cikin Ikilisiya daga bakin teku
  har zuwa ga\u0253ar teku bayan hukuncin masu rai. [9]gwama Hukunce-hukuncen Karshe\\nA
  kwanaki masu zuwa, dutsen gidan Ubangiji zai tabbata kamar dutse mafi tsayi kuma
  ya \u0257aga bisa tuddai. Dukan al''ummai za su kwarara zuwa gare shi\u2026 Zai
  yi hukunci a tsakanin al''ummai, ya kuma tsai da shawara ga mutane da yawa. Za su
  sa takubansu su zama garmuna, m\u0101su kuma su zama lauje; wata al''umma ba za
  ta tasar wa takobi a kan wata al''umma ba, ba kuwa za su yi horo don ya\u0199i ba.
  (Ishaya 2: 2-4)\\nCocin Katolika, wanda shine mulkin Kristi a duniya, an qaddara
  shi yada shi a cikin duka mutane da duka al''ummai\u2026 - POPE PIUS XI, Matakan
  Quas, Encyclic, n. 12, Disamba 11th, 1925; gani Matta 24:14\\nFansa zata cika ne
  kawai lokacin da duka mutane suka yi biyayya gareshi. --Fr. Walter Ciszek, Ya Shugabana,
  shafi. 116-117\\nLOKACIN KALLO DA ADDU''A\\nHar yanzu, hangen nesan wahayi ana daukar
  sa a matsayin haramtacce a tsakanin masanan Katolika kuma ana saurin watsar da su
  a matsayin \\\"paranoia\\\" ko \\\"abin mamaki.\\\" Amma irin wannan ra''ayi ya
  saba wa hikimar Iyaye na Ikilisiya:\\nA cewar Ubangiji, yanzu lokaci ne na Ruhu
  da kuma shaida, amma kuma lokaci ne da har yanzu ke cike da \\\"damuwa\\\" da kuma
  fitinar mugunta wacce ba ta ta\u0253ar da Ikklisiya da masu kawo ta cikin gwagwarmayar
  kwanakin \u0199arshe. Lokaci ne na jira da kallo. -Saukewa: CCC672\\nLokaci ne na
  jira da kallo! Jiran dawowar Kristi da jiran sa-shin dawowar sa ta biyu ne ko Zuwansa
  na sirri a \u0199arshen rayuwar rayuwarmu. Ubangijinmu da kansa ya ce \u201ckallo
  da addu''a!\\\"[10]Matt 26: 41 Wace hanya mafi inganci ke akwai don kallo da yin
  addu''a fiye da hurarriyar Maganar Allah, ha\u0257e da Littafin Ru''ya ta Yohanna?
  Amma a nan muna bu\u0199atar cancantar:\\n\u2026 Babu wani annabcin nassi da ya
  shafi batun fassarar mutum, don babu wani annabci da ya ta\u0253a zuwa ta hanyar
  nufin mutum; amma sai dai ''yan adam da Ruhu Mai Tsarki ya motsa sun yi magana a
  \u0199ar\u0199ashin ikon Allah. (2 Bit 1: 20-21)\\nIdan za mu kalli kuma mu yi addu''a
  tare da Maganar Allah, dole ne ya kasance tare da Ikilisiya wanda ya rubuta kuma
  ta haka ne masu fassara wannan Kalmar.\\nIs ya kamata a yi shelar Littafin, a ji
  shi, a karanta shi, a kar\u0253a kuma ana \u0199warewa a matsayin kalmar Allah,
  a cikin rafin Hadisan Apostolic wanda ba ya rabuwa da shi. \u2014POPE BENEDICT XVI,
  Bayanin Synodal Apostolic Gargadin, Domin Domini, n. 7\\nTabbas, lokacin da St.
  John Paul II ya kira samari su zama '''' masu tsaro na safe '''' a wayewar sabuwar
  karni, ''ya fa\u0257i musamman cewa dole ne mu \\\"kasance ga Rome da Ikilisiya.\\\"[11]Novo
  Millenio Inuent, n.9, Janairu 6th, 2001\\nDon haka, mutum na iya karanta littafin
  Ru''ya ta Yohanna da sanin cewa nasarar da Almasihu da Ikilisiyarsa za su samu a
  nan gaba da kuma kayar da ma\u0199iyin Kristi da Shaidan na yanzu da kuma nan gaba
  suna jiran cikar su.\\nLokaci yana zuwa, yanzu kuma ya yi, da masu sujada na gaskiya
  za su yi wa Uba sujada a Ruhu da gaskiya truth (Yahaya 4:23)\\nDa farko an buga
