  a sannu a hankali da kashi 3 a 2023 sakamakon koma bayan harkokin tattalin arziki
  da ke nuna lokutan sauyin siyasa a Nijeriya.\\nHaka kuma, ana sa ran za a samu koma
  bayan tattalin arzikin duniya a 2023 da kuma tasirinsa na ciniki da hada-hadar kudi.\\n\u201cBugu
  da kari, ci gaban zai haifar da mummunan tasiri ga manufar sake fasalin Naira da
