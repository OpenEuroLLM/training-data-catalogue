  iya daukar nauyinsu ba.\u201d\\nYa ce har sai mun canja wannan al\u2019adar ta mu
  tukunna yankin arewa zai samu cigaba.\\nA cewar shi, \u201cYankin arewa na da kashi
  80 na talauci, kudu kuma suna da kashi 20, saboda kawai mun dauki al\u2019adar auren
  mata da yawa da haifar yaran da baza mu iya daukar nauyinsu ba, a karshe sai dai
  mu bar su suna bara a tituna.\u201d\\nYa kara da cewa wasu mazajen za su saki matansu,
