  ya kamata a gurfanar da shi gaban kotu cikin sa\u2019o\u2019i 24.\\nSai dai hukumar
  a cikin wata sanarwa mai dauke da sa hannun mai magana da yawunta, Peter Afunanya,
  kuma ta aike wa ranar Lahadi, ta yi gargadin a kan kalaman da ba a tsare su ba game
  da kama Mista Mamu.\\n\u201cHukumar tsaro ta farin kaya (DSS) ta bibiyi, tare da
