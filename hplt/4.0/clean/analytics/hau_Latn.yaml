  auren mace fiye da daya, bayan dayar ma ba iya daukar dawainiyar ta suke yi ba,
  shi ne babban musabbabin da ya sanya yankin arewa zai ci gaba da zama a cikin rashin
  ci gaba da talauci.\\nYa ce: \u201cAkwai mutanen da basa iya ciyar da mace daya
