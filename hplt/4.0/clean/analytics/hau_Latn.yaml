  \u0627\u0644\u0645\u0632\u064a\u0640\u0640\u062f ...\\n...\\nWannan fassarar tana
  bukatar Karin bita da gyaran yare.\\nDaga Jarir bin Abdullah - yardar Allah ta tabbata
  a gare shi - ya ce: Mun kasance a gaban yini tare da Manzon Allah - Salatin Allah
  da amincin Allah su tabbata a gare shi - don haka wasu mutane tsirara suka zo wurinsa,
  suna mai da martani ga damisa ko bunnies. Shi da aminci ya tabbata a gare shi -
  a lokacin da ya gansu daga talaucinsu, ya shiga sannan ya fita, don haka ya yi umarni
  da kisan kai, sai ya ba da izini ya tsaya, sannan ya yi salla sannan ya yi huxuba,
  sai ya ce:\\\"Ya ku mutane, ku ji tsoron Ubangijinku wanda Ya halicce ku daga rai
  guda.\\\" A karshen Al-Hashr:(Ya ku wadanda suka yi imani, ku bi Allah da takawa,
  kuma bari rai ya ga abin da na gabatar gobe) Wani mutum ya bayar da sadaka daga
  kudinsa, daga direwarsa, daga tufafinsa, daga yakin adalcinsa, daga tsawar barawo
  - har ma ya ce - Bai iya mata ba, amma ta kasa aiki, daga nan sai mutane suka ci
  gaba har sai da na ga tarin abinci da sutura guda biyu, har sai da na ga fuskar
  Manzon Allah - tsira da amincin Allah su tabbata a gare shi. Ko kuma shekara mai
  kyau yana iya lada, da ladan aiki a bayansa, ba don ya shagaltar da ladansu wani
  abu ba, kuma a zamanin Musulunci shekara ce mara kyau kuma ta ragu, kuma nauyin
  aiki yana bayansa, ba wai don ya rage musu nauyi ba wani abu \u00bb. [Ingantacce
  ne] - [Muslim ne ya rawaito shi]\"", "\"- Wata matar aure a garin Kaduna ta yi karar
  mijinta a kotu tana neman a raba aurensu domin baya haihuwa\\n- Matar, Marwanatu
  Muhammad ta ce a shirye ta ke ta mayarwa mijinta, Iliyasu, N20,000 da ya biya sadakinta
  shekaru 10 da suka wuce\\n- A bangarensa, mijin, Iliyasu, ya ce yana bin Murwanatu
  bashin kudi N17,000 kuma ya nemi ta biya shi kafin su rabu\\nWata matar aure, Marwanatu
  Muhammad a ranar Litinin ta roki kotun Shari''a da ke zamanta a Rigasa Kaduna, ta
  raba aurenta da mijinta Iliyasu kan cewa ya gaza yi mata ciki, The Nation ta ruwaito.\\nA
  karar da ta shigar, Marwanatu, ta yi ikirarin cewa Iliyasu ya gaza yi mata ciki
  tunda suka yi aure shekaru 10 da suka shude a 2011.\\nDUBA WANNAN: Saurayina mai
  yara 6 ya bani bindigar kuma ina kungiyar asiri, Dalibar da ta kai bindiga makaranta\\n\\\"Ya
  taba yin aure a baya amma matarsa ta rabu da shi saboda baya haihuwa. Ina tunanin
  nawa zai banbanta amma ashe kuskure na yi,\\n\\\"Lafiya ta kalau ba ni da matsala.
  Bana ra''ayin cigaba da zaman auren. A shirye na ke in mayar masa kudin sadakinsa,
  N20,000,\\\" in ji ta.\\nKU KARANTA: Allah ya yi wa sarki mai sanda mai daraja ta
  \u0257aya rasuwa a Kwara\\nA bangarensa, Iliyasu ya ce yana bin wacce ta yi karar
  bashin N17,000 kuma yana son kotu ta taimaka ta karbo masa bashin.\\nTunda farko,
  Alkalin kotun Mallam Salisu Abubakar-Tureta ya umurci ma''auratan biyu su tafi asibiti
  a musu gwaji domin gano inda matsalar ya ke.\\nA wani labarin daban, Tsohon Ministan
  Wasanni da Matasa a Nigeria, Hon. Solomon Dalung ya ce an saka gurbataciyyar siyasa
  a cikin batun tsaro a Nigeria har da kai ga wasu kasuwanci suke yi da rashin tsaron.\\nA
  hirar da tsohon ministan ya yi da wakilin Legit.ng Hausa a ranar Alhamis 18 ga watan
  Fabrairu game da sace-sacen yara a makarantu, Dalung ya ce akwai batun sakacin tsaro
  daga hukumomi sannan akwai siyasa.\\nA cewar Dalong akwai wadanda suka mayar da
  rashin tsaro kasuwanci ta yadda idan an samu lafiya ba za su ci abinci ba.\\nAminu
  Ibrahim \u0257an jarida ne kuma \u0257alibi mai neman ilimi. Ya yi karatun digiri
  na farko a Jami''ar Ahmadu Bello Zaria, yanzu yana karatun digiri na biyu a Jami''ar
  Gwamnatin Tarayya da ke Dutse, Jihar Jigawa.\\nYa shafe tsawon shekaru 5 yana aikin
  jarida inda ya samu gogewa a \u0253angaren rubutun Hausa akan fanoni da suka shafi
  siyasa, mulki, wasanni, nishadi, da sauransu.\\nAminu Ibrahim ne ya samu lambar
  yabo na zakaran editan shekarar 2020.\\nZa''a iya bibiyarsa a shafinsa na Twitter
  a @ameeynu\"", "\"Gwamnan jihar Barno, Babagana Zulum ya jinjina wa wata malamar
  makarantar firamare dake jihar bisa maida hankali da tayi a wajen aikin ta na malunta.\\nWannan
  malama wacce \u2018yar asalin jihar Abia ce ta shekara 31 tana karantarwa a makarantar
  firamare na Kyarimi da ke Maiduguri.\\nKo da gwamna Zulum ya kai ziyarar bazata
  wannan makaranta da misalin karfe 6:30 na safe, sai ya iske babu kowa a makarantar,
  babu malami, ko dalibi ko da guda daya ne kuwa.\\nAmma kuma abin mamaki sai ya iske
  wata malama ita kadai tilo ta na zaune tana jiran dalibai.\\nGwamna Zulum ya tambaye
  ta ko \u2018yar asalin wane jiha ce ita? Sai ta shaida masa cewa ita \u2018yar asalin
  jihar Abia ce amma kuma ta shekara 31 tana karantarwa a jihar Barno.\\nDaga nan
  sai gwamna Zulum ya yaba mata sannan yayi mata kyauta kuma yayi mata albishir cewa
  lallai gwamnati ba za ta manta da ita ba ko bayan ta yi murabus a aiki sannan yayi
  mata dan ihsanin da ba a rasa ba.\\nMutane musamman \u2018yan asalin jihar Barno
  suna yabawa salon mulkin gwamna Zulum a jihar, inda suke cewa lallai tsohon gwamna
  Kashim Shettima ya yi musu zabin mutum nagari a matsayin gwamnan jihar.\\nZulum
  ya maida hankali matuka wajen inganta jihar da mutanen ta.\"", "\"Da marecan jiya
  ne Jami''an lafiya suka kwashe sa''o''i da dama suna aikin gwajin cutar akan fasinjojin
  wani jirgin sama, mallakar kamfanin Ethiopia wanda ya yada zango a birnin Adis Ababa
  bayan tasowar shi daga birnin Jeddah kafin ya sauka a Kano.\\nA wurin binciken Fasinjojin
  su kimanin 500 wakinlinmu Mahmud Ibrahim Kwari ya tattauna da wasu daga cikinsu.\\nSun
  sheda masa cewa yadda aka dinga gudanar da bincike a kansu, ko a filin jiragen saman
  Addis Ababa ba a gudanar da bincike kansu haka ba.\\nWannan matakin na zuwa ne kwannaki
  kadan bayan da aka samu bullar cutar Coronavirus ta farko a Najeriya.\\nLamarin
  ya saka tsoro a zukatan mutane da dama a kasar, duk da dai shugaba Muhammadu Buhari
  ya yi kira gare su, da su kwantar da hankulansu.\\nLatsa kasa domin sauraran muryoyin
  wadanda wakilinmu Mahmud Ibrahim Kwari ya yi hira da a filin jiragen saman.\\nFacebook
  Forum\"", "\"Daga CRI Hausa\\nMasu iya magana na cewa, gaskiya ba ta buya, ko min
  nisan dare, gari zai waye. Wannan karin magana ya dace da batun jihar Xinjiang ta
  kasar Sin.\\nTa yaya wasu yan siyasar kasar Amurka da na yammacin duniya suka kitsa
  karairayi kan batun Xinjiang? Kwanan nan ne wani rahoto na musamman da aka wallafa
  a tashar intanet ta jamiyyar Australian Citizens ya bada amsa kan wannan batu.\\nRahoton
  mai shafi 40, mai taken Xinjiang: Yankin yammacin kasar Sin dake tsakiyar Turai
  da Asiya, ya tona asirin Amurka da Birtaniya da wasu kasashen yammacin duniya, na
  nuna goyon-baya ga yan a-ware da masu aikata ayyukan taaddanci da zummar cimma muradun
  siyasa, da illata zaman lafiya da kwanciyar hankali a kasar Sin, tare kuma da kawo
  tsaiko ga ci gabanta.\\nRahoton ya ce, tun a shekara ta 2003, hukumar leken asirin
  Amurka wato CIA ta bada shawara cewa, lokacin da kasar take fuskantar rikici ko
  yin fito-na-fito da kasar Sin, za ta iya amfani da batun da ya shafi jihar Xinjiang
  don matsawa kasar Sin lamba. Tun shekara ta 2004 zuwa yanzu, gidauniyar dake rajin
  wanzar da demokiradiyya mai suna the national endowment for democracy ta Amurka
  ta samar da tallafin dala miliyan 8.76 ga masu yunkurin raba Xinjiang daga kasar
  Sin dake kasashen waje, don nuna adawa da manufofin gwamnatin kasar kan jihar Xinjiang.
  Har wa yau, a watan Nuwambar shekara ta 2020, yan siyasar Amurka sun cire kungiyar
  East Turkestan Islamic Movement, wadda kasashen duniya suka ayyana ta a matsayin
  kungiyar yan taadda, daga jerin sunayen kungiyoyin yan taadda, a wani yunkuri na
  marawa yan taaddan baya.\\nBugu da kari, duba da yadda kwalliya ta biya kudin sabulu
  ga gwamnatin kasar Sin a fannin daukar matakan yaki da ayyukan taaddanci, masu kyamar
  kasar Sin daga kasashen Amurka da Birtaniya sun yi fushi har sun kulla makarkashiya
  tare da wasu cibiyoyi don kitsa karairayi masu tarin yawa dangane da jihar Xinjiang
  a matsayin wai shaidu, da kuma hayar wasu kafofin watsa labaransu don yada rahotanni,
  da nufin jirkita gaskiya da shafawa gwamnatin kasar Sin bakin fenti.\\nRahoton nan
  ya kuma tona asirin wadannan mutane, tare da wallafa sunayen wasu cibiyoyi ko kungiyoyin
  da suke yunkurin yada jita-jita game da Xinjiang, ciki har da kungiyar Amnesty International
  dake Birtaniya, da kungiyar Human Rights Watch ta Amurka, da cibiyar nazarin manyan
  tsare-tsare da manufofi ta Australiya wato ASPI da sauransu.\\nKwanan nan ne, cibiyar
  ASPI ta bayyana cewa, wai an sake gina dimbin cibiyoyin da ake tsare mutane a sassa
  daban-daban a jihar Xinjiang, amma hakikanin gaskiya ita ce, kaso 90 bisa dari na
  hotunan wuraren da ta wallafa, ma\u2019aikatu da asibitoci da gidaje da shaguna
  ne.\\nA kasashen yammacin duniya, makircin da wasu masu adawa da kasar Sin suka
  kulla a bayyana ne yake. Kwanan nan ne kuma, aka wallafa wani hoton bidiyon da tsohuwar
  mai tafinta daga hukumar binciken manyan laifuffuka ta Amurka wato FBI, Sibel Edmonds
  ta shirya game da jihar Xinjiang, inda ba tare da wata rufa-rufa ba, ta furta cewa,
  Amurka na shirin yin amfani da dabarunta iri daya da wadanda suka shafi kasashen
  Afghanistan da Ukraine da Iraki a kan jihar Xinjiang ta kasar Sin, wato kirkiro
  karairayi da yada su. Amma duk da haka, Sibel Edmonds ta bayyana a shirin bidiyon
  cewa, bayanin da kasar Sin ta yi ya fi kama da gaskiya fiye da kalaman kasashen
  yamma.\\nTo, menene gaskiyar bayanan? Gani ya kori ji, in ji malam Bahaushe.\\nKwanan
  nan ne, wani shahararren mai hada gajerun shirin bidiyo daga kasar Isra\u2019ila,
  Raz Galor ya yi tattaki zuwa gundumar Shaya dake yankin Aksu na jihar Xinjiang,
  inda ya ganewa idanunsa yadda ake noman auduga ta hanyar zamani. Yayin da yake zantawa
  da kafar CMG, ya ce, abun da ya fi burge shi a ziyararsa jihar Xinjiang shi ne,
  kome lafiya kalau a wajen, kana, kowa na aiki tukuru don samun rayuwa mai dadi.\\nHar
  wa yau, wani dan asalin kasar Birtaniya wanda ya dade yana zaune a kasar Sin, Jason
  Lightfoot, ya wallafa wani bidiyo kwanan baya, inda ya tona asirin wasu kafafen
  yada labaran kasashen yamma na jirkita gaskiya, da kirkiro labaran bogi da nufin
  kawo illa ga zaman lafiya da kwanciyar hankali a kasar Sin.\\nBabu shakka, ana kara
  samun kasashen dake nuna goyon-baya ga kasar Sin kan batun jihar Xinjiang, al\u2019amarin
  da zai karyata jita-jitar da kasashen yammacin duniya suke yunkurin yadawa. (Mai
  Fassara: Murtala Zhang)\""]'
