  game da kalaman da ba a kiyaye ba game da masu sasantawa na garkuwa da jirgin kasan
  Kaduna\\nHukumar tsaro ta farin kaya, SSS, ta yi gargadi kan kalaman rashin tsaro
  da aka yi kan kama Tukur Mamu, wanda ya nada kansa a matsayin mai sasantawa tsakanin
  iyalan fasinjojin jirgin da aka sace da kuma \u2018yan ta\u2019adda.\\nAn kama Mista
  Mamu ne a filin jirgin sama na Alkahira a hanyarsa ta zuwa kasar Saudiyya don gudanar
  da aikin Hajji, inda aka tasa keyar shi zuwa Kano, inda nan take jami\u2019an SSS
  suka kama shi.\\nA baya dai wani malamin addinin musuluncin nan dake garin Kaduna,
  Sheikh Ahmad Gumi, ya bukaci hukumar SSS da ta saki Mamu, ko kuma ta gurfanar da
