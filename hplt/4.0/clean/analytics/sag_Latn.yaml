  TI NZAPA TI FINI DUNIA\\n-\\nJ\u00e9sus asava mbeni zo so mbage ti ter\u00ea ti
  lo akui (1-8)\\n-\\nJ\u00e9sus airi Matthieu (9-13)\\n-\\nT\u00ebn\u00eb na nd\u00f6
  ti mungo je\u00fbne (14-17)\\n-\\nMolenge ti Ja\u00efrus; mbeni wali andu yanga
  ti bongo ti J\u00e9sus (18-26)\\n-\\nJ\u00e9sus asava mbeni waziba nga mbeni koli
  so yanga ti lo akanga (27-34)\\n-\\nAl\u00ea ti kobe ni ayeke mingi, me azo ti kua
  ni ayeke mingi ape (35-38)\\n9 Tongaso, lo mont\u00e9 na y\u00e2 ti ng\u00f6, lo
  f\u00e2 ngu na lo gue na gbata ti lo.+\\n2 Na b\u00e2, ala yeke ga na lo mbeni zo
  so mbage ti ter\u00ea ti lo akui na so alango na nd\u00f6 ti kete gbogbo. Tongana
  J\u00e9sus ab\u00e2 mabe ti ala, lo tene na koli so mbage ti ter\u00ea ti lo akui
  so: \u201cGbu ngangu, molenge ti mbi. A pardonn\u00e9 siokpari ti mo awe.\u201d+\\n3
  Me ambeni scribe atene na b\u00ea ti ala: \u201cKoli so ayeke zonga Nzapa la.\u201d\\n4
  So J\u00e9sus ahinga apens\u00e9 ti ala, lo tene: \u201cNgbanga ti nyen ala yeke
  tene asioni t\u00ebn\u00eb na y\u00e2 ti b\u00ea ti ala?+\\n5 Na tapande, ti tene:
  \u2018A pardonn\u00e9 asiokpari ti mo awe,\u2019 wala ti tene: \u2018Londo, mo tambela,\u2019
  so wa si ayeke ngangu ape?+\\n6 Ye oko, ti tene ala hinga so a m\u00fb komandema
  na Molenge ti zo na nd\u00f6 ti sese ti pardonn\u00e9 siokpari. . .\u201d, lo tene
  na zo so mbage ti ter\u00ea ti lo akui so: \u201cLondo, mo m\u00fb kete gbogbo ti
  mo, mo gue na da ti mo.\u201d+\\n7 Lo londo, lo gue na da ti lo.\\n8 Tongana gb\u00e2
  ti azo ni ab\u00e2 ye so, mbeto asara ala, na ala m\u00fb gloire na Nzapa, lo so
  am\u00fb mara ti komandema tongaso na azo.\\n9 Tongana J\u00e9sus azia ndo ni si
  lo yeke hon, l\u00ea ti lo at\u00ef na nd\u00f6 ti mbeni koli so iri ti lo ayeke
  Matthieu, so ayeke duti na da ti rongo nginza ti imp\u00f4t. Lo tene na lo: \u201cM\u00fb
  peko ti mbi.\u201d Na mango t\u00ebn\u00eb so, lo londo, lo m\u00fb peko ti lo.+\\n10
  Na pekoni, na ngoi so lo yeke te kobe na y\u00e2 ti da ni, b\u00e2, gb\u00e2 ti
  azo ti rongo nginza ti imp\u00f4t nga na awasiokpari aga, na ala yeke te kobe na
  J\u00e9sus na adisciple ti lo.+\\n11 Me tongana aFarizien ab\u00e2 ye so, ala tene
  na adisciple ti lo: \u201cNgbanga ti nyen ma\u00eetre ti ala ayeke te kobe na azo
  ti rongo nginza ti imp\u00f4t nga na awasiokpari?\u201d+\\n12 Na mango ala, J\u00e9sus
  atene: \u201cAzo so ayeke na nzoni ter\u00ea ayeke na bezoin ti wanganga p\u00ebpe,
  me g\u00ef azo ti kobela.+\\n13 Ala gue agi ti hinga nda ti t\u00ebn\u00eb so atene:
  \u2018Mbi ye sarango nzoni b\u00ea na zo, me mbi ye sandaga p\u00ebpe.\u2019+ Ndali
  ti so mbi ga ti iri azo ti mbilimbili p\u00ebpe, me awasiokpari.\u201d\\n14 Na pekoni,
  adisciple ti Jean aga ahunda lo, atene: \u201cNgbanga ti nyen la si e na aFarizien
  e yeke m\u00fb je\u00fbne, me adisciple ti mo ayeke m\u00fb je\u00fbne ape?\u201d+\\n15
  Na nd\u00f6 ti t\u00ebn\u00eb so, J\u00e9sus atene na ala: \u201cNa ngoi kue so
  koli so am\u00fb wali fini fini+ angb\u00e2 na ter\u00ea ti akamarade ti lo, ala
  yeke na raison oko p\u00ebpe ti sara vundu. Me ambeni lango ayeke ga ande so a yeke
  zi lo na ter\u00ea ti ala;+ na ngoi ni so la si ala yeke m\u00fb je\u00fbne.\\n16
