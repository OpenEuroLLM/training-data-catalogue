  ni na fango t\u00ebn\u00eb?\\nDikongo Bible: (ahon pn. 4 p\u00ebpe) Ps 90:1-17\\nMA\u00cf
  AKODE TI FANGO T\u00cbN\u00cb TI MO\\nLeke akode ti fango na t\u00ebn\u00eb ti nze
  so: (pn. 15) Lisoro. Zia vid\u00e9o ti kode ti fango na t\u00ebn\u00eb oko oko,
  na pekoni sara lisoro na ndo ti akota t\u00ebn\u00eb ni. Wa aita ti leke akode ti
  fango na t\u00ebn\u00eb ti ala wani.\\nGIGI TI E TI CHR\u00c9TIEN\\nBezoin ti congr\u00e9gation:
  (pn. 5)\\n\u201cMa\u00ef akode ti fango t\u00ebn\u00eb ti mo: M\u00fb maboko na
