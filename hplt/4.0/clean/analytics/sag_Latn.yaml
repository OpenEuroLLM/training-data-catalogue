  b\u00ea ti ala na ndo ni? (w14 15/10 l. 10 par. 14; w07-F 15/7 32 par. 3-4)\\nPs
  90:10, 12\u2014Tongana nyen la e lingbi ti \u201cdiko l\u00e2 ti e, si e lingbi
  wara b\u00ea so ayeke na ndara\u201d? (w06 15/7 l. 13 par. 4; w01 15/11 l. 13 par.
  19)\\nNyen la dikongo Bible ti yenga so afa na mbi na ndo ti J\u00e9hovah?\\nAye
