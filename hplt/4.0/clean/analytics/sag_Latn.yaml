  so am\u00fb maboko lani na mbeni zo ti gue na li ni ti m\u00fb tere ti lo na Nzapa
  na ti wara bat\u00eame. Tongana nyen la mo tara lani ti ma\u00ef ndoye ti J\u00e9hovah
  na y\u00e2 ti b\u00ea ti zo so mo yeke manda Bible na lo? Tongana nyen la mo m\u00fb
  lani maboko na lo ti zia ambeni ye ti si d\u00e4 na lege ti yingo?\\nMandango Bible
  ti Congr\u00e9gation: (pn. 30) ia chap. 21 par. 1-12\\nKiri kete na ndo ti ye so
  ala manda nga fa ye so ala yeke b\u00e2 na yenga ti peko (pn. 3)\\nBia 137 na sambela\"",
  "\"16 Paul asi na Derb\u00e9 nga na Lystres. Na b\u00e2, mbeni disciple ayeke k\u00e2
  so iri ti lo ayeke Timoth\u00e9e. Lo yeke molenge ti mbeni wali Juif so am\u00e4
  na b\u00ea, me bab\u00e2 ti lo ayeke mbeni Grec.\\n2 Aita na Lystres nga na Iconium
  ayeke sara nzoni t\u00ebn\u00eb ti lo mingi.\\n3 Paul atene so lo yeke na nzara
  ti m\u00fb koli so na tere ti lo si ala gue. Tongaso lo m\u00fb Timoth\u00e9e na
  lo f\u00e2 lo na ganza ndali ti aJuif so ayeke na ando ni so, teti ala kue ahinga
  so bab\u00e2 ti lo ayeke Grec.\\n4 Tongana ala yeke hon na y\u00e2 ti agbata ni,
  ala yeke m\u00fb na ala so ayeke na ando ni ambela so abazengele nga na a-ancien
  so ayeke na J\u00e9rusalem am\u00fb ti tene ala sara ye alingbi na ni.\\n5 Tongaso
  acongr\u00e9gation angb\u00e2 ti kpengba na y\u00e2 ti mabe na wungo ti aita ni
  ayeke gue na li ni l\u00e2 na l\u00e2.\\n6 Na ndo ni, ala hon na y\u00e2 ti Phrygie
  nga na y\u00e2 ti kodoro ti Galatie, teti yingo vulu ake na ala ti sara t\u00ebn\u00eb
  so na y\u00e2 ti kodoro-komanda ti Asie.\\n7 Nga, tongana ala zu na Mysie, ala sara
  ngangu ti l\u00ef na Bithynie, me yingo ti J\u00e9sus am\u00fb lege na ala p\u00ebpe.\\n8
  Tongaso ala hon na tere ti Mysie na ala zu na Troas.\\n9 Na b\u00ef ni, mbeni ye
  asi na Paul tongana suma: mbeni koli ti Mac\u00e9doine ayeke luti na ayeke voro
  yanga na lo atene: \u201cGa na Mac\u00e9doine mo m\u00fb maboko na e.\u201d\\n10
  Gi so lo b\u00e2 suma ni awe, e gi lege ti l\u00ef na Mac\u00e9doine, teti e b\u00e2
  so Nzapa si airi e ti fa nzoni t\u00ebn\u00eb na ala.\\n11 Tongaso e londo na Troas,
  e m\u00fb l\u00ea ti ngu-ingo ni na e kpe gi kpengo juska e si na Samothrace, me
  na ndade ni e si na N\u00e9apolis.\\n12 E londo na ndo so e gue na Philippes, mbeni
  gbata so ayeke na gbe ti Rome na so ayeke kota gbata ti sese ti Mac\u00e9doine.
  E ngb\u00e2 na y\u00e2 ti gbata ni, na e sara ambeni lango kete na ndo so.\\n13
  Na l\u00e2 ti sabbat, e sigigi na yanga ti gbagba ti gbata ni so ayeke na tere ti
  mbeni kota ngu, ndo so e b\u00e2 e tene mbeni ndo ti sambela ayeke d\u00e4. E duti
  na e to nda ti sara t\u00ebn\u00eb na awali so abungbi fade na ndo ni so.\\n14 Na
  mbeni wali ayeke d\u00e4 so iri ti lo ayeke Lydie, lo yeke zo ti kango abengba bongo
  so avuko kete, lo yeke zo ti gbata ti Thyatire nga mbeni wavorongo Nzapa. Lo yeke
  m\u00e4 e nga J\u00e9hovah azi b\u00ea ti lo kota ti dengi m\u00ea na aye so Paul
  ayeke tene.\\n15 Tongana a batize lo, nga na azo ti da ti lo awe, lo voro yanga
  ti lo na e, lo tene: \u201cTongana ALA b\u00e2 so mbi yeke be-ta-zo na J\u00e9hovah,
  ALA ga na da ti mbi na ALA ngb\u00e2.\u201d Na lo sara kue si e gue na da ti lo.\\n16
  Na tongana e yeke gue na ndo ti sambela, mbeni maseka-wali so ayeke zo ti kua nga
  so ayeke na mbeni yingo na y\u00e2 ti lo, mbeni sioni yingo ti bango mbadi, atingbi
  na e. Lakue lo yeke ga na gb\u00e2 ti aye na awa ti lo na lege ti kua ti lo ti fango
  gigi ti kekereke na azo.\\n17 Maseka-wali ni angb\u00e2 lakue ti m\u00fb peko ti
  e na Paul na lo yeke dekongo, lo tene: \u201cAkoli so ayeke angb\u00e2a ti Nzapa
  so ayeke na nduzu na ndo ti aye kue, akoli so ayeke fa na ALA lege ti warango salut.\u201d\\n18
  Lo ngb\u00e2 gi ti sara tongaso teti alango mingi. Na nda ni, Paul awoko na t\u00ebn\u00eb
  ni awe si lo turn\u00ea, lo tene na yingo ni: \u201cMbi m\u00fb yanga na mo na iri
  ti J\u00e9sus Christ ti sigigi na y\u00e2 ti wali so.\u201d Na yingo ni asigigi
  na y\u00e2 ti lo t\u00e2 gi na ngbonga ni so.\\n19 Tongana awa ti lo ab\u00e2 so
  lege ti warango aye ti ala ni akanga awe, ala zia maboko na ndo ti Paul na Silas
  na ala gue na ala na ngangu na gara na ndo ti amokonzi,\\n20 na tongana ala gue
  na ala na gbele azo ti komande ti gbata ni, ala tene: \u201cAkoli so ayeke bi wusuwusu
  mingi na y\u00e2 ti gbata ti e, ala yeke aJuif,\\n21 na ala yeke fa ambeni ngobo
  so ndia am\u00fb lege na e p\u00ebpe ti yeda na ni na ti sara ye alingbi na ni,
  teti so e yeke aRomain.\u201d\\n22 Na gb\u00e2 ti azo ni alondo na tere ti ala.
  Na peko ti so azo ti komande ti gbata ni azi na ngangu abongo ti ala ti ndo ni na
  tere ti ala awe, ala m\u00fb yanga ti tene a pika ala na keke.\\n23 Tongana a pika
  ala mingi awe, ala bi ala na da ti kanga, na ala m\u00fb yanga na zo ti batango
  da ti kanga ni ti b\u00e2 ndo na ndo ti ala nzoni.\\n24 Teti so a m\u00fb yanga
  na lo tongaso, lo bi ala na da ti kanga ti y\u00e2 ni k\u00e2 na lo kanga gere ti
  ala ngangu na y\u00e2 ti akeke so a koro d\u00fb d\u00e4.\\n25 Me a si na b\u00ea
  ti b\u00ef tongaso, Paul na Silas ayeke sambela na ala yeke he bia ti sepela Nzapa.
  Biani, ambeni zo ti kanga ni ayeke m\u00e4 go ti ala.\\n26 Mo ye ti b\u00e2, sese
  ayengi ngangu, tongaso agere ti da ti kanga ni ayengi. Nga, ayanga-da ni kue azi
  gi hio tongaso, na azingiri so a kanga na ala kue azi at\u00ef.\\n27 Zo ti batango
  da ti kanga ni, tongana lo zingo na lango na lo b\u00e2 so ayanga ti da ti kanga
  ni azi, lo gboto \u00e9p\u00e9e ti lo na lo ye ti f\u00e2 tere ti lo, teti lo b\u00e2
  lo tene azo ti kanga ni akpe awe.\\n28 Me Paul adekongo na kota go, lo tene: \u201cSara
  sioni na tere ti mo p\u00ebpe, e kue la ge so!\u201d\\n29 Tongaso zo ti batango
  da ti kanga ni ahunda ti tene a ga na lo w\u00e2, lo l\u00ef na y\u00e2 ti da ni
  na loro, na so tere ti lo ayeke d\u00f6 dongo, lo t\u00ef na sese na gbele Paul
  na Silas.\\n30 Lo m\u00fb ala lo sigigi na ni na lo tene: \u201cAkota zo, a lingbi
  mbi sara nyen si a s\u00f6 mbi?\u201d\\n31 Ala tene: \u201cM\u00e4 na b\u00ea na
  Seigneur J\u00e9sus na fade a s\u00f6 mo, mo na azo ti da ti mo.\u201d\\n32 Na Paul
  na Silas atene t\u00ebn\u00eb ti J\u00e9hovah na lo nga na azo kue so ayeke na y\u00e2
  ti da ti lo.\\n33 Lo m\u00fb ala na ngbonga ni so na b\u00ef ni, lo sukula ak\u00e4
  ti ala; t\u00e2 gi na pekoni a batize lo na azo ti da ti lo kue.\\n34 Lo ga na ala
  na y\u00e2 ti da ti lo, lo leke table na gbele ala, na tere ti lo anzere mingi,
  lo na azo ti da ti lo kue, teti fadeso lo m\u00e4 na b\u00ea na Nzapa awe.\\n35
  Tongana ndo ahan awe, azo ti komande ti gbata ni atokua aturugu ti polisi ti tene
  na lo: \u201cMo zi akoli so.\u201d\\n36 Tongaso zo ti batango da ti kanga ni afa
  peko ti at\u00ebn\u00eb ti ala ni na Paul, lo tene: \u201cAzo ti komande ti gbata
  ni atokua azo ti tene a zi ALA. Tongaso, ALA sigigi ALA gue na siriri.\u201d\\n37
  Me Paul atene na ala: \u201cAla pika e na l\u00ea ti azo, e so a d\u00eb ngbanga
  fade na li ti e p\u00ebpe, e so e yeke aRomain, na ala bi e na da ti kanga. Na fadeso
  ala ye ti zia e na gigi na hondengo ni? E ke awe! Me zia ala wani aga asigigi na
  e.\u201d\\n38 Tongaso aturugu ti polisi ni afa peko ti at\u00ebn\u00eb so na azo
  ti komande ni. Tongana azo ti komande ni am\u00e4 so Paul na Silas ayeke aRomain,
  mbeto agbu ala mingi.\\n39 Ni la, ala ga ala voro yanga na Paul na Silas, na tongana
