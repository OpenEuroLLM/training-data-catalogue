  MO\\nLeke akode ti fango na t\u00ebn\u00eb ti nze so: (pn. 15) Lisoro. Zia vid\u00e9o
  ti kode ti fango na t\u00ebn\u00eb oko oko, na pekoni sara lisoro na ndo ti akota
  t\u00ebn\u00eb ni. Wa aita ti leke akode ti fango na t\u00ebn\u00eb ti ala wani.\\nGIGI
  TI E TI CHR\u00c9TIEN\\nBia 69\\n\u201cTongana e wara gi mbeni molenge na yanga-da
  ni\u201d: (pn. 5) Diskur.\\nBezoin ti congr\u00e9gation: (pn. 10) Mo lingbi ti soro
  ti sara lisoro na ndo ti ye ti manda so ayeke na y\u00e2 ti Annuaire. (yb16 59-62)\\nMandango
  Bible ti Congr\u00e9gation: (pn. 30) ia chap. 23 par. 15-29, dango b\u00ea ti l.
  204\\nKiri kete na ndo ti ye so ala manda nga fa ye so ala yeke b\u00e2 na yenga
  ti peko (pn. 3)\\nBia 13 na sambela\"", "\"Kusala\\nAchapitre\\nLi ti at\u00ebn\u00eb
  ni\\n-\\nVision so Corneille ab\u00e2 (1-8)\\nVision so Pierre ab\u00e2 na nd\u00f6
  ti anyama so a sara si aga nzoni awe (9-16)\\nPierre ague na ndo ti Corneille (17-33)\\nPierre
  afa nzoni t\u00ebn\u00eb so ab\u00e2 azo ti amara (34-43)\\n\u201cNzapa ayeke sara
  kangbi na popo ti azo p\u00ebpe\u201d (34, 35)\\nAzo ti amara awara yingo vulu na
  ala wara bat\u00eame (44-48)\\n-\\nKota dengo gaba na nd\u00f6 ti t\u00ebn\u00eb
  ti fango ganza na Antioche (1, 2)\\nA gue na t\u00ebn\u00eb ni na J\u00e9rusalem
  (3-5)\\nA-ancien na abazengele asara mbeni bungbi (6-21)\\nLettre so alondo na bebungbi
  (22-29)\\nAla gbanzi ter\u00ea ti ala na m\u00ean\u00eb (28, 29)\\nLettre so a tokua
  akpengba acongr\u00e9gation (30-35)\\nPaul na Barnabas am\u00fb lege nde nde ahon
  (36-41)\"", "\"1Zo so ama na be si ade ti kpengba pepe, ala yamba lo, ala kasa at\u00ebn\u00eb
  ti be ti lo pepe. 2Mbeni zo so ama na be abaa ti lo atene, ni lingbi ti te ye kue,
  me mbeni zo so ade ti kpengba pepe ayeke te ti lo gi akugbe ti kasa. 3Zo so ayeke
  te ye kue, alingbi lo baa tongana zo ti buba pepe zo so ayeke te gi ambeni ye; na
  mbage, zo so ayeke te ye kue, alingbi zo so ayeke te gi ambeni ye akasa lo pepe.
  Biani, Nzapa ayamba nga zo so ayeke te ye kue tongana zo ti lo. 4Mo yeke ti mo zo
  wa ti kasa zo ti kua ti mbeni zo nde? Ataa lo ngba na nduzu wala lo ti, so abaa
  gi wa ti lo. Fade lo yeke ngba na nduzu, ndali ti so Kota Gbia ayeke na ngangu ti
  sara si lo ngba na nduzu. 5Mbeni zo abaa mbeni lango tongana kota lango ahon atanga
  ni; mbeni zo abaa ti lo alango ni kue gi legeoko. Alingbi zo oko oko ahinga biani
  so t\u00ebn\u00eb ti be ti lo ayeke na legeni. 6Zo so abaa mbeni lango tongana kota
  lango ahon atanga ni, lo yeke sara tongaso ndali ti Kota Gbia; zo so ayeke te ye
  kue, lo yeke te ni ndali ti Kota Gbia, ngbanga ti so lo yeke mu singila na Nzapa.
  Zo so ayeke te ye kue pepe, lo yeke sara tongaso ndali ti Kota Gbia, ngbanga ti
  so lo nga, lo yeke mu singila na Nzapa. 7Biani, zo oko na popo ti e ayeke duti na
  fini gi ndali ti lo wani pepe, zo oko na popo ti e ayeke kui gi ndali ti lo wani
  pepe. 8Tongana e ngba na fini, e ngba ndali ti Kota Gbia; tongana e kui, e kui nga
  ndali ti Kota Gbia. Tongaso, ataa e ngba na fini wala e kui, e yeke azo ti Kota
  Gbia. 9Christ akui si na pekoni, lo kiri na fini titene lo duti Kota Gbia ti aku\u00e2
  na ti azo so angba na fini. 10Me mo, mo yeke kasa mba ti mo ngbanga ti nyen? Mo
  yeke baa amba ti mo tongana azo ti buba ngbanga ti nyen? Fade e oko oko kue, e yeke
  luti na le ti Nzapa titene lo f\u00e2 ngbanga ti e. 11Mbeti ti Nzapa atene: \u201cMbi,
  Kota Gbia so mbi yeke na fini, mbi deba, mbi tene: fade azo kue ayeke kuku na gbe
  ti mbi si azo kue ayeke gonda mbi Nzapa.\u201d 12Tongaso fade e oko oko kue, e yeke
  kiri t\u00ebn\u00eb na Nzapa na nd\u00f6 ti aye so kue e sara. 13Tongaso, alingbi
  e zia ti kasa amba ti e. Me ye so ala lingbi ti leke na be ti ala ayeke so: ala
  zia na dawa ti ita ti ala pepe mbeni ye so lo lingbi ti pika gere ti lo daa ti ti
  na ya ti siokpari wala mbeni ye so alingbi ti pusu lo ti sara sioni ye. 14Ti mbi,
  na lege ti gango so mbi ga oko na Kota Gbia J\u00e9sus, mbi hinga biani so mbeni
  ye oko so ayeke sioni ayeke daa pepe. Me tongana mbeni zo abaa mbeni ye tongana
  sioni, ye ni ayeke sioni gi na le ti zo ni. 15Tongana mba ti mo awara vundu ndali
  ti mbeni kobe so mo yeke te, so afa atene, mo sara ye na lege ti ndoye pepe. Zo
  so Christ akui ndali ti lo, alingbi mo buba lege ti lo ndali ti t\u00ebn\u00eb ti
  kobe pepe! 16Ye so ala baa tongana nzoni ye ndali ti ala, alingbi aga sioni ye na
  le ti amba ti ala pepe. 17Biani, Kodro-gbia ti Nzapa abaa t\u00ebn\u00eb ti tengo
  kobe wala t\u00ebn\u00eb ti nyongo ye pepe, me abaa t\u00ebn\u00eb ti sarango ye
  ti mbirimbiri, ti siriri na ti ngia so Yingo-Vuru ayeke mu na zo. 18Zo so ayeke
  sara kua na Christ tongaso, lo yeke nzoni na le ti Nzapa si azo ayeda na t\u00ebn\u00eb
  ti lo. 19Tongaso, alingbi e gi ye so ayeke ga na siriri si e oko oko kue, e kpengba
  na lege ti mabe. 20Ndali ti t\u00ebn\u00eb ti kobe, mo buba lege ti kua ti Nzapa
  pepe! Biani, kobe kue ayeke nzoni, me tongana aga mbeni ye so zo ayeke pika gere
  ti lo daa ti ti na ya ti siokpari, andaa tengo kobe ti mo ni aga ye ti sioni awe.
  21Ye so ayeke nzoni ayeke titene mo te nyama pepe, mo nyon samba pepe, so ti tene
  mo ke ti sara ye so kue ita ti mo alingbi ti pika gere ti lo daa ti ti na ya ti
  siokpari. 22Ye so mo hinga biani na be ti mo na nd\u00f6 ti ye so, t\u00ebn\u00eb
  ni angba na popo ti mo na Nzapa. Ti lo nzoni, zo so aye ti sara mbeni ye si lo bi
  t\u00ebn\u00eb na li ti wani pepe! 23Me zo so ayeke dekite na be ti lo ndali ti
  kobe so lo yeke te, Nzapa af\u00e2 ngbanga na li ti lo awe, ndali ti so sarango
  ye ti lo ayeke na lege ti mabe pepe. Biani, ye so kue zo asara na lege ti mabe pepe
  ayeke siokpari.\"", "\"Bible na ndo ti Internet | MBETI TI NZAPA TI FINI DUNIA\\n-\\nJacob
  na azo ti da ti lo kue ague na \u00c9gypte (1-7)\\n-\\nIri ti azo so ague na \u00c9gypte
  (8-27)\\n-\\nJoseph awara ter\u00ea na Jacob na Goshen (28-34)\\n46 Tongaso, Isra\u00ebl
  am\u00fb aye ti lo kue, lo t\u00ef na lege. Na ngoi so lo si na B\u00e9er-Sh\u00e9ba,+
  lo m\u00fb asandaga na Nzapa ti bab\u00e2 ti lo Isaac.+\\n2 Nzapa asara t\u00ebn\u00eb
  na Isra\u00ebl na b\u00ef na y\u00e2 ti vision, lo tene: \u201cJacob, Jacob!\u201d
  na lo yeda, lo tene: \u201cMbi la!\u201d\\n3 Lo tene: \u201cMbi yeke t\u00e2 Nzapa,
  Nzapa ti bab\u00e2 ti mo.+ Sara mbeto ti gue na \u00c9gypte p\u00ebpe, ndali ti
  so mbi yeke sara si mo ga kota mara k\u00e2.+\\n4 Mbi la mbi yeke gue legeoko na
  mo na \u00c9gypte, na mbi la mbi yeke m\u00fb mo ande ti kiri na mo.+ Joseph la
  ayeke leke ande l\u00ea ti mo.\u201d+\\n5 Na pekoni, Jacob alondo na B\u00e9er-Sh\u00e9ba
  lo hon; amolenge ti Isra\u00ebl ti koli ay\u00f4 bab\u00e2 ti ala Jacob, amolenge
  ti ala nga na awali ti ala na y\u00e2 ti apuse so Pharaon atokua ti y\u00f4 na lo.\\n6
  Ala m\u00fb anyama ti ala nga na aye ti ala so ala wara na sese ti Canaan. Ala gue
  ala si na \u00c9gypte, Jacob na ahale ti lo kue.\\n7 Lo ga na \u00c9gypte, lo na
  amolenge ti lo ti koli na ti wali kue nga na a-\u00e2ta ti lo kue, so ti tene lo
  na ahale ti lo kue.\\n8 Iri ti amolenge ti Isra\u00ebl ti koli, so ti tene Jacob
  na amolenge ti lo, so aga na \u00c9gypte+ ayeke so: Ruben, kozo molenge ni.+\\n9
  Amolenge ti Ruben ayeke Hanok, Pallu, Hesron na Carmi.+\\n10 Amolenge ti Sim\u00e9on+
  ayeke J\u00e9muel, Jamin, Ohad, Jakin, Zohar na Sha\u00fcl+ so mama ti lo ayeke
  mbeni wali ti sese ti Canaan.\\n11 Amolenge ti L\u00e9vi+ ayeke Guershon, Kohath
  na M\u00e9rari.+\\n12 Amolenge ti Juda+ ayeke Er, Onan, Sh\u00e9lah,+ P\u00e9r\u00e8s+
  na Z\u00e9rah.+ Me Er na Onan akui na sese ti Canaan.+Amolenge ti P\u00e9r\u00e8s
  ayeke Hesron na Hamul.+\\n13 Amolenge ti Issacar ayeke Tola, Puvah, Iob na Shimron.+\\n14
  Amolenge ti Zabulon+ ayeke S\u00e9r\u00e8d, \u00c9lon na Jahl\u00e9el.+\\n15 Amolenge
  ti L\u00e9a so lo d\u00fc na Jacob na Paddan-Aram la, nga na Dinah,+ molenge ti
  Jacob ti wali. Amolenge ti lo ti koli na ti wali kue ayeke 33.\\n16 Amolenge ti
  Gad+ ayeke Ziphion, Haggui, Shuni, Ezbon, \u00c9ri, Arodi na Ar\u00e9li.+\\n17 Amolenge
  ti Aser+ ayeke Imnah, Ishvah, Ishvi na B\u00e9riah; ita ti ala ti wali ayeke S\u00e9rah.Amolenge
  ti B\u00e9riah ayeke H\u00e9ber na Malkiel.+\\n18 Amolenge ti Zilpah+ la, so Laban
  am\u00fb lo na molenge ti lo L\u00e9a. Lo d\u00fc ala na Jacob: ala kue ayeke 16.\\n19
  Amolenge ti Rachel, wali ti Jacob, ayeke Joseph+ na Benjamin.+\\n20 As\u00e9nath,+
  molenge ti Potiph\u00e9ra pr\u00eatre ti On, ad\u00fc na Joseph Manass\u00e9+ na
  \u00c9phra\u00efm+ na kodro ti \u00c9gypte.\\n21 Amolenge ti Benjamin+ ayeke B\u00e9la,
  B\u00e9ker, Ashbel, Gu\u00e9ra,+ Naaman, \u00c9hi, Rosh, Muppim, Huppim+ na Ard.+\\n22
  Amolenge ti Rachel ti koli so lo d\u00fc ala na Jacob la: ala kue ayeke 14.\\n23
  Molenge ti Dan+ ayeke Hushim.+\\n24 Amolenge ti Nephtali+ ayeke Jahz\u00e9el, Guni,
  J\u00e9zer na Shillem.+\\n25 Amolenge ti Bilhah la, so Laban am\u00fb lo na molenge
  ti lo Rachel. Lo d\u00fc ala na Jacob: ala kue ayeke mbasambala.\\n26 Azo kue so
  asigi na y\u00e2 ti Jacob si ague na lo na \u00c9gypte ayeke 66; a diko awali ti
  amolenge ti Jacob na y\u00e2 ni p\u00ebpe.+\\n27 Amolenge ti Joseph so a d\u00fc
  ala na lo na \u00c9gypte ayeke use. Azo kue ti da ti Jacob so aga na \u00c9gypte
  ayeke 70.+\\n28 Jacob atokua Juda+ ti hon kozo ti lo ti tene na Joseph so lo yeke
  na lege ti guengo na Goshen. Tongana ala si na sese ti Goshen,+\\n29 Joseph ahunda
  ti tene a leke puse ti mbarata ti lo, na lo gue ti wara bab\u00e2 ti lo Isra\u00ebl
  na Goshen. Na ngoi so lo fa ter\u00ea ti lo na bab\u00e2 ti lo, hio lo t\u00ef na
  nd\u00f6 ti go ti lo na lo toto aninga.\\n30 Isra\u00ebl atene na Joseph: \u201cTi
  so ni so, mbi lingbi ti kui senge; mbi b\u00e2 l\u00ea ti mo awe, na mbi hinga so
  mo ngb\u00e2 na fini.\u201d\\n31 Joseph atene na aita ti lo ti koli nga na azo ti
  da ti bab\u00e2 ti lo, lo tene: \u201cMbi yeke gue ti fa peko ti ye ni na Pharaon,+
  mbi tene: \u2018Aita ti mbi ti koli na azo ti da ti bab\u00e2 ti mbi so ayeke lani
  na sese ti Canaan aga na mbi ge awe.+\\n32 Akoli ni ayeke aberger,+ ala yeke bata
  anyama,+ na ala ga na ataba na abagara ti ala nga na aye ti ala kue.\u2019+\\n33
  Tongana Pharaon airi ala na lo hunda ala, lo tene: \u2018Ala yeke sara kua ti nyen?\u2019\\n34
  Ala tene: \u2018E azo ti kua ti mo e yeke azo ti batango anyama ngbene ye so e yeke
  maseka juska fadeso, e na akotara ti e,\u2019+ tongaso si ala lingbi ti sara kodro
  na sese ti Goshen,+ ndali ti so zo kue so ayeke bata ataba ayeke sioni mingi na
  l\u00ea ti azo ti \u00c9gypte.\u201d+\"", "\"1So J\u00e9sus atene t\u00ebn\u00eb
  so kue awe, lo tene na adisiple ti lo: 2\u201cAla hinga kue, na ya ti lango use,
  fade matanga ti Pake ayeke duti daa. Fade a yeke mu Molenge ti Zo titene a f\u00e2
  lo na nd\u00f6 ti keke ti kroa.\u201d 3Tongaso akota wayango-sandaga na akangba
  ti azuife abongbi tere na ya ti gbagba ti kota wayango-sandaga so iri ti lo Kaife.
  4Ala leke t\u00ebn\u00eb ti gbu J\u00e9sus na lege ti mbeni mayere titene ala f\u00e2
  lo. 5Me ala tene: \u201cAlingbi e gbu lo na lango ti matanga pepe, ngbanga ti azo
  atomboka.\u201d 6So J\u00e9sus ayeke na Betanii, na ya ti da ti Simon, zo ti buruma,
  7mbeni wali aga nduru na tere ti lo na mbeni ngbenda ti yombo so ngere ni ayeke
  ngangu mingi; a sara ngbenda ni na mbeni t\u00eane so iri ni albatre. Lo tuku yombo
  ni na li ti J\u00e9sus, na ndembe so J\u00e9sus ayeke te kobe. 8So adisiple abaa
  ye ni tongaso, be ti ala aso si ala tene: \u201cNgbanga ti nyen si lo yeke buba
  yombo so tongaso? 9A lingbi fade ti ka ni na ngangu ngere si amu nginza ni na azo
  ti mawa pepe?\u201d 10J\u00e9sus ahinga t\u00ebn\u00eb so adisiple ni ayeke tene
  si lo tene: \u201cNgbanga ti nyen si ala yeke so li ti wali so tongaso? Ye so lo
  sara na mbi so ayeke ye ti nzoni. 11Biani, azo ti mawa ayeke duti lakue na popo
  ti ala, me ti mbi, mbi yeke duti lakue na popo ti ala pepe. 12Lo tuku yombo so na
  tere ti mbi ti leke mbi ti ku na ndembe so a yeke lu ande ku\u00e2 ti mbi. 13Mbi
  tene na ala taa-t\u00ebn\u00eb: na ndo so kue a yeke fa ande Nzoni T\u00ebn\u00eb
  so daa, na nd\u00f6 ti dunia kue, azo ayeke fa t\u00ebn\u00eb ti ye so wali so asara
  si azo ayeke dabe ti ala na lo.\u201d 14Tongaso, mbeni disiple oko na popo ti adisiple
  baleoko na use, so iri ti lo Judas Iskariote ague na ndo ti akota wayango-sandaga;
  15lo tene na ala: \u201cTongana mbi ka J\u00e9sus na ala, fade ala yeke mu na mbi
  nyen?\u201d Akota wayango-sandaga ni adiko ale ti nginza baleota si ala mu na lo.
  16Ti londo na ndembe ni so, Judas ato nda ti gi nzoni lege ti ka J\u00e9sus na ala.
  17Na kozo lango ti matanga ti Mapa so a sara na mama ni pepe, adisiple aga na tere
  ti J\u00e9sus si ala hunda lo, atene: \u201cMo ye e leke na mo kobe ti Pake na ndo
  wa?\u201d 18J\u00e9sus atene na ala: \u201cAla gue na ya ti gbata ni na ndo ti pakara
  tongaso; ala tene na lo: \u2018Wafango-ye atene: Ngbonga ti mbi aga nduru awe; mbi
  na adisiple ti mbi, e yeke sara ande matanga ti Pake na ndo ti mo.\u2019 \u201d
  19Adisiple asara ye ni gi tongana ti so J\u00e9sus amu yanga na ala si ala leke
  kobe ti Pake ni. 20Na lakui ni, J\u00e9sus na adisiple baleoko na use aduti ti te
  kobe. 21So ala yeke te kobe ni, J\u00e9sus atene na ala: \u201cMbi tene na ala taa-t\u00ebn\u00eb:
  mbeni oko na popo ti ala ayeke ka mbi.\u201d 22Vundu agbu be ti adisiple mingi si
  ala oko oko ato nda ti hunda lo, atene: \u201cKota Gbia, ayeke mbi?\u201d 23J\u00e9sus
  akiri t\u00ebn\u00eb na ala: \u201cZo so mbi na lo e yeke yoro maboko oko na ya
  ti sembe, lo laa lo yeke ka mbi. 24Fade Molenge ti Zo ayeke kui gi tongana ti so
  Mbeti ti Nzapa atene t\u00ebn\u00eb ni na nd\u00f6 ti lo; me mawa na zo so ayeke
  ka ande Molenge ti Zo ni so! Ti zo ni so, tongana a du lo fade pepe, ka ayeke nzoni
  mingi!\u201d 25Judas, zo ti kango J\u00e9sus amu t\u00ebn\u00eb si lo tene: \u201cWafango-ye,
  ayeke mbi?\u201d J\u00e9sus akiri t\u00ebn\u00eb na lo, atene: \u201cT\u00ebn\u00eb
  ni laa mo tene awe so.\u201d 26So ala yeke te kobe, J\u00e9sus amu mapa, lo mu singila
  na Nzapa; na pekoni lo f\u00e2 ya ni, lo mu na adisiple si lo tene: \u201cAla mu
  ni ate, so ayeke tere ti mbi.\u201d 27Na pekoni, lo mu kopo ti vin, lo mu singila
  na Nzapa si lo mu ni na ala, lo tene: \u201cAla kue anyon ni, 28ngbanga ti so ayeke
  mene ti mbi, mene so abongbi azo na Nzapa na ya ti mbuki; mene so atuku ndali ti
  gba ti azo titene azi siokpari ti ala. 29Mbi tene na ala: fade mbi yeke kiri ti
  nyon ngu ti le ti vinye pepe, ngbii asi na lango so fade mbi na ala, e yeke nyon
  fini vin na ya ti Kodro-gbia ti Nzapa, Bab\u00e2 ti mbi.\u201d 30Na peko ti so ala
  he bia ti gondango Nzapa awe, ala mu lege ti gue na hoto ti a-olive. 31Tongaso,
  J\u00e9sus atene na adisiple ti lo: \u201cGi na bi so, fade ala kue ayeke zia mbi
  ti hon, ngbanga ti so Mbeti ti Nzapa atene: \u2018Fade mbi yeke f\u00e2 wabatango-taba
  si ataba ni ayeke kangbi kirikiri.\u2019 32Me tongana mbi zingo ande na ku\u00e2,
  mbi yeke hon kozo ti ala na Galile.\u201d 33Pierre atene na lo: \u201cTongana azo
  kue azia mo ahon, fade mbi yeke zia mo oko pepe.\u201d 34J\u00e9sus akiri t\u00ebn\u00eb
  na lo: \u201cMbi tene na mo taa-t\u00ebn\u00eb: gi na bi so, kozo titene koli-kondo
  atoto, fade mo yeke bere t\u00ebn\u00eb ti mbi fani ota.\u201d 35Pierre atene na
  lo: \u201cTongana ayeke titene mbi na mo e kui, mbi yeke bere t\u00ebn\u00eb ti
  mo oko pepe!\u201d Adisiple ni kue atene gi oko t\u00ebn\u00eb so. 36J\u00e9sus
  na adisiple ti lo asi na mbeni ndo so iri ni Getsemane si lo tene na ala: \u201cAla
  duti na ndo so, mbi yeke gue k\u00e2 ti sambela.\u201d 37Lo mu Pierre na amolenge
  ti Zebede use na tere ti lo si lo na ala ague. Vundu ato nda ti gbu lo si mbeto
  asara lo ahon ndoni. 38Tongaso lo tene na ala: \u201cBe ti mbi ayeke na vundu mingi,
  mo baa mo tene, mbi ye ti kui kuingo; ala ngba na ndo so, mbi na ala, e lango pepe!\u201d
  39Lo hon yongoro kete, lo ti, lo kpo li ti lo na sese, lo sambela, lo tene: \u201cBab\u00e2
  ti mbi, tongana lege ayeke daa, ayeke nzoni kopo ti pasi so ahon yongoro na tere
  ti mbi. Me mbi ye pepe titene mo sara ye so be ti mbi aye, me mo sara gi ye so be
  ti mo aye.\u201d 40Na pekoni, lo kiri lo ga na mbage ti adisiple si lo wara ala
  na lango. Lo tene na Pierre: \u201cAla lingbi ti ngba na le ti ala tongaso ndali
  ti mbi na ya ti ngbonga oko pepe? 41Ala lango pepe! Ala sambela si ala ti na ya
  ti ye ti tarango be pepe. Yingo ti zo ayeke na nzara ti sarango nzoni ye, me zo
  ni ayeke na ngangu pepe.\u201d 42Lo kiri lo gue yongoro ti fani use ni si lo sambela,
  lo tene: \u201cBab\u00e2 ti mbi, tongana kopo so alingbi ti hon yongoro na tere
  ti mbi pepe si mo ye mbi nyon ni, ayeke nzoni mo sara gi ye so be ti mo aye!\u201d
  43Lo kiri lo ga na mbage ti adisiple ni si lo wara ala na lango, ngbanga ti so lango
  ahon nd\u00f6 ti ala. 44J\u00e9sus azia ala, lo kiri lo gue yongoro si lo sambela
  ti fani ota ni, lo tene gi oko t\u00ebn\u00eb so lo tene kozoni so. 45Lo kiri lo
  ga na mbage ti adisiple si lo tene na ala: \u201cAla ngba ti lango? Ala ngba ti
  wu tere ti ala? Ngbonga ni aga nduru awe; a yeke mu Molenge ti Zo ti zia lo na maboko
  ti azo ti siokpari. 46Ala londo e gue! Baa, zo ti kango mbi asi awe!\u201d 47So
  J\u00e9sus angba ti tene t\u00ebn\u00eb, Judas, mbeni oko ti adisiple baleoko na
  use asi; lo ga na azo gbani gbani na tere ti lo. Azo ni kue amu ayongoro zeme na
  akeke na maboko ti ala. Akota wayango-sandaga na akangba ti azuife laa atokua ala.
  48Judas, zo ti kango J\u00e9sus, afa na azo ni ye so fade lo yeke sara; lo tene:
  \u201cZo so mbi yeke su ande ngbangba ti lo, andaa lo laa. Ala gbu lo.\u201d 49Gi
  hio tongaso, Judas aga nduru na tere ti J\u00e9sus si lo tene na lo: \u201cWafango-ye,
  mbi bara mo!\u201d Na pekoni, lo su ngbangba ti lo. 50J\u00e9sus atene na lo: \u201cIta,
  mo sara ye so mo ga ngbanga ni so!\u201d Azo so amu peko ti Judas aga, ala zia maboko
  na nd\u00f6 ti J\u00e9sus si ala gbu lo. 51Mbeni disiple oko ti J\u00e9sus agboto
  yongoro zeme ti lo, lo de mbeni zo ti kua ti kota wayango-sandaga si lo f\u00e2
  m\u00ea ti lo. 52J\u00e9sus atene na lo: \u201cKiri yongoro zeme ti mo na plase
  ni, ngbanga ti so azo so kue af\u00e2 zo na yongoro zeme, fade ala yeke kui ku\u00e2
  ti yongoro zeme. 53Mo baa mo tene, mbi lingbi ti hunda na Bab\u00e2 ti mbi ti mu
  na mbi maboko pepe? Lo lingbi ti tokua na mbi fafadeso a-ange so wungo ti ala ahon
  wungo ti aturugu na ya ti akota bongbi baleoko na use. 54Tongana mbi iri a-ange
  ni, fade t\u00ebn\u00eb ti Mbeti ti Nzapa ayeke ga taa-t\u00ebn\u00eb tongana nyen?
  Mbeti ti Nzapa atene, fade ye ni ayeke duti tongaso.\u201d 55Na pekoni, J\u00e9sus
  atene na gba ti azo ni, atene: \u201cAla ga na ayongoro zeme na akeke ti gbu mbi,
  mo baa mo tene, mbi yeke zo ti nzi! Lakue mbi yeke duti na ya ti kota da ti Nzapa
  ti fa ye, me ala gbu mbi pepe! 56Me ye so kue asi tongaso si t\u00ebn\u00eb ti yanga
  ti awayanga-Nzapa so a su na mbeti ando so aga taa-t\u00ebn\u00eb.\u201d Tongaso
  adisiple kue azia lo si ala kpe ahon. 57Azo so agbu J\u00e9sus so ague na lo na
  Kaife, kota wayango-sandaga. Andaa awafango-ndia na akangba abongbi tere ti ala
  k\u00e2 awe. 58Pierre ague na peko ti J\u00e9sus, me lo yeke gue nduru nduru pepe;
  lo gue ngbii lo si na ya ti gbagba ti kota wayango-sandaga. Lo li si lo na azo ti
  kua ayeke duti na sese na ndo oko, lo yeke ku ti baa wala ye ni ayeke hunzi ande
  tongana nyen. 59Akota wayango-sandaga na azo kue ti Kota Bongbi ti Fango Ngbanga
  ayeke gi lege ti wara mbeni t\u00ebn\u00eb ti mvene ti bi na li ti J\u00e9sus, ti
  f\u00e2 ngbanga ti ku\u00e2 na li ti lo; 60me ala wara ni pepe, ataa so azo mingi
  aga na at\u00ebn\u00eb ti mvene ti bi na li ti lo. Ti hunzi na ni, ambeni koli use
  aga aluti 61si ala tene: \u201cKoli so atene lani, atene: \u2018Mbi lingbi ti kungbi
  kota da ti Nzapa si mbi yeke kiri ti leke ni na ya ti lango ota.\u2019 \u201d 62Kota
  wayango-sandaga alondo si lo tene na J\u00e9sus: \u201cMo yeke na t\u00ebn\u00eb
  ti kiri na ni pepe? T\u00ebn\u00eb ti nyen laa azo so ayeke tene na iri ti mo so?\u201d
  63Me J\u00e9sus azi yanga oko pepe. Kota wayango-sandaga atene na lo: \u201cMbi
  hunda na mo ti deba yanga ti mo, na iri ti Nzapa so ayeke na fini, mo tene na e:
  Mo yeke Mesii, Molenge ti Nzapa?\u201d 64J\u00e9sus akiri t\u00ebn\u00eb na lo:
  \u201cGi t\u00ebn\u00eb ni laa mo tene awe so. Me mbi tene na ala so fade ala yeke
  baa Molenge ti Zo aduti na tere ti Nzapa so ngangu ti lo ahon angangu kue; lo yeke
  duti na mbage ti maboko ti lo ti koli. Lo yeke londo na yayu, lo duti na nd\u00f6
  ti ambinda ti ga.\u201d 65Tongaso kota wayango-sandaga ni asuru ya ti bongo ti lo
  si lo tene: \u201cLo zonga Nzapa awe! E ye ti kiri ti hunda mbeni zo na t\u00ebn\u00eb
  ngbanga ti nyen? Ala ma zonga so lo zonga na Nzapa so awe! 66Ti be ti ala, ala tene
  nyen?\u201d Azo ni akiri t\u00ebn\u00eb na lo: \u201cLo lingbi na ku\u00e2!\u201d
  67Na pekoni, ala tuku ngu ti yanga ti ala na le ti lo si ala kpo lo na gobo, ambeni
  apika ngbangba ti lo, 68ala tene: \u201cMo so mo yeke Mesii so, sara tongana wayanga-Nzapa:
  fa na e, zo wa laa apika mo?\u201d 69Pierre ayeke duti na gigi na ya ti gbagba ni.
  Mbeni wali so ayeke sara kua k\u00e2 aga nduru na tere ti lo si atene na lo: \u201cMo
  nga, mo yeke mu peko ti J\u00e9sus, zo ti Galile so!\u201d 70Me Pierre abere na
  le ti azo kue, lo tene: \u201cMbi hinga t\u00ebn\u00eb so mo ye ti tene so pepe!\u201d
  71So Pierre amu lege ti gue na yanga ti gbagba, mbeni wali nde so ayeke sara kua
  k\u00e2 abaa lo si atene na azo so ayeke k\u00e2, atene: \u201cKoli so ayeke mu
  nga peko ti J\u00e9sus, zo ti Nazaret!\u201d 72Pierre akiri abere; lo deba yanga
  ti lo, lo tene: \u201cMbi hinga koli so oko pepe!\u201d 73Kete na pekoni, azo so
  ayeke k\u00e2 aga nduru na Pierre si ala tene na lo: \u201cTaa-t\u00ebn\u00eb, mo
  nga, mo yeke mbeni zo ti J\u00e9sus! Sarango t\u00ebn\u00eb ti mo aka mo awe.\u201d
  74Pierre ato nda ti deba yanga ti lo, atene: \u201cAyeke nzoni Nzapa af\u00e2 ngbanga
  na li ti mbi tongana mbi tene mvene! Mbi hinga koli so oko pepe!\u201d Gi na pekoni,
  koli-kondo atoto. 75Pierre adabe ti lo na t\u00ebn\u00eb so J\u00e9sus atene lani
  na lo, atene: \u201cKozo titene koli-kondo atoto, fade mo yeke bere t\u00ebn\u00eb
  ti mbi fani ota.\u201d Lo sigigi si lo toto ngangu mingi.\"", "\"- The Noble Quran\\n-
  Sunnah of Prophet Muhammad\\n- Islamic Creed\\n- Islamic Jurisprudence\\n- Virtues/Noble
  Characteristics\\n- Arabic Language\\n- Yanga ti Sango Wa fango tene ti nzapa :
  Mohamed Zakaria Wa fango tene ti nzapa : Mahamat Abdoulbassit Ibrahim B\u00e4ngb\u00efng\u00f6-peko
  ni (contr\u00f4le) : Mohamed Zakaria\\nFango tene na ndoti islam, a kota gere tene
  so si lotissa ani: 1-Guigui ti a arabo kojo ni si islam aga ( Avant Islam). 2-Tokwa
  ti a watoukwa ti nzapa kwe na azo ti ala 3- A gure okou (5) ti islam\\n- Yanga ti
  Sango\"", "\"4 Awa ti angb\u00e2a, ALA sara lakue na angb\u00e2a ti ALA ye so ayeke
  mbilimbili nga na lege ni, na hingango so ALA yeke nga na mbeni Wa ti ALA na yayu.\\n2
  ALA ngb\u00e2 lakue ti sambela. Na ndo ti t\u00ebn\u00eb ti sambela ni, zia l\u00ea
  ti ALA angb\u00e2 na zingo ni na ALA kiri singila;\\n3 na oko ngoi ni ALA sambela
  nga ndali ti e si Nzapa azi mbeni yanga-da na e ti fa t\u00ebn\u00eb ni nga ti fa
  na azo t\u00ebn\u00eb ti Nzapa so lo honde nda ni, t\u00ebn\u00eb so andu Christ,
  so ndali ni si mbi yeke na y\u00e2 ti zingiri,\\n4 tongaso si mbi fa t\u00ebn\u00eb
  ni na gigi tongana ti so a lingbi mbi fa ni na azo.\\n5 ALA ngb\u00e2 lakue ti sara
  ye na ndara na mbage ti azo so ayeke na gigi, na sarango kusala nzoni na ngoi ti
  ALA.\\n6 Zia lakue t\u00ebn\u00eb ti yanga ti ALA aduti nzoni, ALA zia ingo d\u00e4,
  si ALA hinga tongana nyen a lingbi ALA kiri t\u00ebn\u00eb na zo oko oko.\\n7 Tychique,
  ita ti mbi so mbi ndoye lo mingi, wakua be-ta-zo nga mba ti mbi ngb\u00e2a na y\u00e2
  ti Seigneur, ayeke fa ande na ALA t\u00ebn\u00eb ti aye kue so asi na mbi.\\n8 A
  yeke ti tene ALA hinga ye so asi na e na ti tene b\u00ea ti ALA ad\u00eb si mbi
  yeke tokua lo na ALA so,\\n9 lo na On\u00e9sime, ita ti mbi so ayeke be-ta-zo nga
  so mbi ndoye lo mingi, lo so lo yeke ti ALA k\u00e2. Fade aita so ayeke fa na ALA
  aye kue so asi ge.\\n10 Aristarque, mba ti mbi so a bi mbi na lo na kanga, atokua
  bara na ALA; Marc, fami ti Barnabas, abara ALA nga (lo la si a m\u00fb lani yanga
  na ALA ndali ti lo a tene: tongana lo si na ALA k\u00e2, ALA yamba lo nzoni),\\n11
  na J\u00e9sus, so a iri lo Justus; ala so ayeke ti azo so af\u00e2 ganza. Gi ala
  so si ayeke amba ti mbi wakua teti royaume ti Nzapa, na a yeke ala si aga awamungo
  maboko so akpengba mbi.\\n12 \u00c9paphras, lo so lo yeke ti ALA k\u00e2, mbeni
  ngb\u00e2a ti Christ J\u00e9sus, atokua bara na ALA. Lakue lo yeke tiri ngangu ndali
  ti ALA na y\u00e2 ti asambela ti lo ti tene na nda ni ALA ga azo so akpengba kue
  awe nga so am\u00e4 na b\u00ea ngangu na ye kue so b\u00ea ti Nzapa aye.\\n13 Mbi
  yeke tene nzoni t\u00ebn\u00eb ti lo, so lo yeke sara kua ngangu ndali ti ALA, ndali
  ti azo so ayeke na Laodic\u00e9e nga na ala so ayeke na Hi\u00e9rapolis.\\n14 Luc,
  wanganga so e ndoye lo mingi, atokua bara na ALA, D\u00e9mas kue abara ALA.\\n15
  ALA tene bara ti mbi na aita ti Laodic\u00e9e, ALA tene ni nga na ita-wali Nymphas
  nga na congr\u00e9gation so ayeke na y\u00e2 ti da ti lo.\\n16 Na tongana ALA diko
  mbeti so na popo ti ALA awe, ALA leke si a diko ni nga na y\u00e2 ti congr\u00e9gation
  ti aita ti Laodic\u00e9e na ALA diko nga mbeni mbeti ni so ayeke ti Laodic\u00e9e.\\n17
  Nga, ALA tene t\u00ebn\u00eb so na Archippe, ALA tene: \u201cMo zia l\u00ea ti mo
  lakue na ndo ti kusala so mo yeda ti wara ni na y\u00e2 ti Seigneur, si mo sara
  ni a hunzi.\u201d\\n18 So bara ti mbi Paul la, so mbi wani mbi s\u00fb na maboko
  ti mbi. ALA bi b\u00ea ti ALA lakue na zingiri so mbi yeke na y\u00e2 ni. Zia kota
  nzobe ti Nzapa aduti na ALA.\"", "\"\u201cNdo ti lingo\u201d ti J\u00e9hovah am\u00fb
  na e nzoni duti na lege ti yingo\\n91:1, 2, 9-14\\nLaso, a hunda na e ti m\u00fb
  tere ti e na Nzapa nga ti wara bat\u00eame tongana e ye ti duti na ndo ti lingo
  ti J\u00e9hovah\\nAzo so azia b\u00ea ti ala na Nzapa p\u00ebpe ahinga ndo ni so
  ape\\nAzo so ayeke na ndo ti lingo ti J\u00e9hovah azia p\u00ebpe si mbeni zo wala
  mbeni ye ayengi mabe ti ala nga na ndoye so ala yeke na ni na Nzapa\\nZo ti gbungo
  ndeke ayeke gi ti gbu e\\n91:3\\nAndeke ayeke sara ka ye na hange mingi na ayeke
  ngangu ti tene a gbu ala\\nAzo ti gbungo ndeke ayeke gi ti hinga asarango ye ti
  andeke nzoni si ala leke akode ti gbu na ala\\nSatan, so ayeke tongana zo ti gbungo
  ndeke, ayeke gi ti hinga awakua ti J\u00e9hovah nzoni si lo zia agbanda ti buba
  dutingo ti ala na lege ti yingo\\nAsioni gbanda osio so Satan ayeke sara na kua:\\nMbeto
  ti zo\\nSarango b\u00ea ti aye ti sese\\nAsioni ngia\\nMango tere p\u00ebpe so ayeke
  na popo ti azo\"", "\"1Mbi Paul, mbi yeke watokua ti J\u00e9sus Christ na peko ti
  yanga ti Nzapa, Wasongo e, lo na J\u00e9sus Christ so e zia be ti e kue na nd\u00f6
  ti lo. 2Mbi tokua mbeti so na mo Timoth\u00e9e so mo yeke taa molenge ti mbi na
  lege ti mabe. Ayeke nzoni Nzapa Bab\u00e2 na Kota Gbia ti e J\u00e9sus Christ asara
  nzoni be na mo, abaa mawa ti mo si amu na mo siriri! 3Tongana ti so mbi mu lani
  yanga na mo na guengo ti mbi na sese ti Masedoane, ayeke nzoni mo ngba na gbata
  ti Efeze. K\u00e2, ambeni zo ayeke fa ye so alingbi na t\u00ebn\u00eb ti Nzapa pepe.
  Alingbi mo ke na ala na kuru go ti fa aye ni so. 4Mo ke nga na ala titene ala zia
  be ti ala na nd\u00f6 ti ambai ti mvene wala na dikongo a-iri ti akotara gbani gbani.
  Aye so ayeke ga na bingbingo t\u00ebn\u00eb na popo ti azo, me nzoni lege so Nzapa
  aleke ndali ti zo, ala lingbi ti hinga ni na lege ti aye so pepe. Zo ayeke hinga
  nzoni lege ni gi na lege ti mabe. 5Nda ti yanga so mbi mu ayeke titene mo sara si
  ndoye akono, ndoye so aga na lege ti vurungo be, be so sioni ye oko ayeke daa pepe
  nga na taa mabe. 6Ambeni zo azia nzoni lege so awe, ala girisa lege na dikongo abuba
  t\u00ebn\u00eb. 7Ala tene, ala yeke awafango-ndia, me at\u00ebn\u00eb so ala yeke
  tene wala aye so ala yeke fa si yanga ti ala akpengba na nd\u00f6 ni so, ala ma
  nga ya ni oko pepe. 8E hinga e tene, ndia ayeke nzoni ye tongana e sara ye na ni
  na legeni. 9Alingbi e hinga ye so: azo so ayeke sara ye mbirimbiri, ndia ayeke ndali
  ti ala pepe; me ndia ayeke ndali ti azo so ake ti ma yanga, azo ti ngangu li, azo
  so ake t\u00ebn\u00eb ti Nzapa, azo ti sarango siokpari, azo so akpe ye ti Nzapa
  wala ye ti yingo pepe, azo so ayeke f\u00e2 abab\u00e2 na amama ti ala, azo ti fango
  zo, 10azo ti gingo wali wala gingo koli kirikiri, akoli so ayeke lango na amba ti
  ala akoli, azo so ayeke ka amba ti ala na ngbaa, azo ti mvene, azo so ayeke deba
  na t\u00ebn\u00eb ti mvene, ala na azo so ayeke sara ye so ayeke nde na fango ye
  so ayeke mbirimbiri. 11T\u00ebn\u00eb so alingbi na Nzoni T\u00ebn\u00eb so Nzapa
  azia na maboko ti mbi; t\u00ebn\u00eb ni ayeke t\u00ebn\u00eb ti Nzapa, lo so alingbi
  na gonda si azo ayeke tene nzoni t\u00ebn\u00eb ti lo. 12Mbi mu singila mingi na
  J\u00e9sus Christ, Kota Gbia ti e, ndali ti so lo mu na mbi ngangu, lo baa mbi tongana
  zo so lo lingbi ti zia be ti lo na nd\u00f6 ti lo, nilaa lo mu mbi na kua ti lo.
  13Mbi yeke kozoni zo ti zongango lo, zo ti sarango ngangu na lo, zo ti tiringo na
  lo. Me Nzapa abaa mawa ti mbi, ngbanga ti so ye so mbi yeke sara lani so, mbi hinga
  ni pepe si mbi de nga ti ma na be pepe. 14Kota Gbia ti e Christ J\u00e9sus asara
  nzoni be na mbi ahon ndoni: lo mu na mbi mabe na ndoye so aga na lege so mbi ga
  oko na J\u00e9sus Christ. 15T\u00ebn\u00eb so ayeke taa-t\u00ebn\u00eb, ayeke nzoni
  azo kue ayeda na ni na be ti ala kue: J\u00e9sus Christ aga na dunia so ti soo azo
  ti siokpari na ku\u00e2. Na popo ti azo ti siokpari ni, mbi laa mbi yeke kozo zo
  ni, 16me Nzapa abaa mawa ti mbi. Tongaso, J\u00e9sus Christ akanga be ti lo mingi
  ti ku mbi, mbi so mbi yeke kozo zo ti sarango siokpari. Mbi ga tapande ndali ti
  azo so ayeke ma na be ande na lo ti wara fini so angba lakue lakue. 17Ayeke nzoni
  azo ane Kota Gbia, ala gonda lo lakue lakue, lo yeke oko Nzapa, zo abaa lo pepe,
  lo yeke na fini lakue lakue, lo yeke Kota Gbia kpu na kpu! Amen. 18Timoth\u00e9e,
  molenge ti mbi, aye so mbi fa, mbi zia na maboko ti mo, alingbi na at\u00ebn\u00eb
  ti peko ti yanga ti Nzapa so azo atene na nd\u00f6 ti mo. Ayeke nzoni mo luti na
  nd\u00f6 ti at\u00ebn\u00eb ni ti tiri nzoni bira na legeni; 19mo bata mabe nzoni,
  mo duti na be so sioni ye oko ayeke daa pepe. Ambeni zo ake ti bata be ti ala nzoni,
  nilaa mabe ti ala ati. 20Himene na Alexandre ayeke na popo ti azo ni so. Mbi zia
  ala na maboko ti Satan titene ala manda ti kiri ti zonga Nzapa pepe.\"", "\"Bible
  na ndo ti Internet\\nMBETI TI NZAPA TI FINI DUNIA\\n14 ALA yamba zo so mabe ti lo
  akpengba kue p\u00ebpe, me ALA f\u00e2 ngbanga p\u00ebpe na ndo ti at\u00ebn\u00eb
  so lo yeke hunda na tere ti lo.\\n2 Mbeni zo ayeke na mabe ti te ye kue, me zo so
  awoko ate akugbe-kasa.\\n3 Zia zo so ayeke te ye ni ab\u00e2 zo so ayeke te ye ni
  p\u00ebpe tongana mbumbuse zo p\u00ebpe, nga zo so ayeke te ye ni p\u00ebpe af\u00e2
  ngbanga p\u00ebpe na li ti zo so ayeke te ye ni, teti Nzapa ayamba zo so awe.\\n4
  Mo yeke zo wa si mo f\u00e2 ngbanga na li ti zo ti kua ti mba ti mo? A yeke na gbele
  wa ti lo si lo yeke luti wala lo yeke t\u00ef. Biani, a yeke sara ande si lo luti,
  teti J\u00e9hovah alingbi ti sara si lo luti.\\n5 Mbeni zo ab\u00e2 ti lo mbeni
  lango tongana kota lango ahon mbeni. Mbeni nde ab\u00e2 ti lo mbeni lango ni tongana
  atanga ni kue. Zia zo oko oko ahinga na y\u00e2 ti li ti lo so ye ni ayeke biani
  tongaso.\\n6 Zo so ayeke bata mbeni lango, lo bata ni ndali ti J\u00e9hovah. Nga
  zo so ate ye, ate ye ndali ti J\u00e9hovah, ngbanga ti so lo m\u00fb singila na
  Nzapa. Na zo so ate ye p\u00ebpe, ate ye p\u00ebpe ndali ti J\u00e9hovah, me lo
  m\u00fb singila na Nzapa.\\n7 Biani, mbeni zo na popo ti e ayeke duti na fini gi
  ndali ti lo wani p\u00ebpe, nga mbeni zo na popo ti e ayeke kui gi ndali ti lo wani
  p\u00ebpe.\\n8 At\u00e2a tongana e duti na fini, e duti na fini ndali ti J\u00e9hovah,
  nga at\u00e2a e kui, e kui ndali ti J\u00e9hovah. Tongaso, at\u00e2a tongana e duti
  na fini wala e kui, e yeke ti J\u00e9hovah.\\n9 Teti a yeke ndali ti ye so si Christ
  akui na lo kiri na fini: ti tene lo duti Seigneur na ndo ti aku\u00e2 nga na ndo
  ti azo so ayeke na fini.\\n10 Me mo yeke f\u00e2 ngbanga na li ti ita ti mo ndali
  ti nyen? Wala mo yeke b\u00e2 nga ita ti mo tongana mbumbuse zo ndali ti nyen? Teti
  fade e kue a yeke iri e ti luti na gbele ngbanga ti Nzapa.\\n11 Teti a s\u00fb na
  Mbeti ti Nzapa, a tene: \u201cJ\u00e9hovah atene: \u2018Ti t\u00e2 t\u00ebn\u00eb
  ni, likuni oko oko kue ayeke kuku ande na gbele mbi, na yanga oko oko kue ayeke
  sepela ande Nzapa polele.\u2019 \u201d\\n12 Tongaso, fade zo oko oko na popo ti
  e ayeke kiri t\u00ebn\u00eb na Nzapa ndali ti lo wani.\\n13 Ni la, zia e f\u00e2
  ngbanga na li ti mba mbeni p\u00ebpe, me zia ALA m\u00fb desizion so: ti zia p\u00ebpe
  na gbele mbeni ita mbeni ye so lo yeke pika gere ti lo d\u00e4 wala mbeni ye so
  ayeke sara si lo t\u00ef.\\n14 Na y\u00e2 ti Seigneur J\u00e9sus, mbi hinga na mbi
  hinga biani mbi tene so mbeni ye ti salet\u00e9 tongaso ayeke d\u00e4 p\u00ebpe.
  Gi tongana mbeni zo ab\u00e2 so mbeni ye ayeke ye ti salet\u00e9, si na l\u00ea
  ti lo ye ni ayeke ye ti salet\u00e9.\\n15 Teti tongana ndali ti kobe ita ti mo awara
  vundu, mo yeke tambela mbeni p\u00ebpe alingbi na ndoye. Zia p\u00ebpe si na lege
  ti kobe ti mo, mo futi lege ti lo so Christ akui ndali ti lo.\\n16 Tongaso, nzoni
  ye so ALA yeke sara, ALA m\u00fb lege na azo ti tene sioni t\u00ebn\u00eb ni p\u00ebpe.\\n17
  Teti royaume ti Nzapa ayeke p\u00ebpe t\u00ebn\u00eb ti tengo ye na nyongo ye, me
  a yeke mbilimbili na siriri na ngia na lege ti yingo vulu.\\n18 Teti na ndo ti t\u00ebn\u00eb
  so, zo so ayeke sara kua na Christ tongana ngb\u00e2a, lo nzere na l\u00ea ti Nzapa,
  na azo ayeke b\u00e2 lo na nzoni l\u00ea.\\n19 Tongaso, zia e tomba peko ti aye
  so ayeke ga na siriri na aye so ayeke kpengba mba na popo ti e.\\n20 Mo zia ti futi
  kusala ti Nzapa gi ndali ti kobe. T\u00e2 t\u00ebn\u00eb, aye kue ayeke nzoni biani,
  me a yeke sioni na mbeni zo ti te ye na a sara si mba ti lo apika gere ti lo.\\n21
  A yeke nzoni mo te nyama p\u00ebpe wala mo nyon vin p\u00ebpe wala mo sara p\u00ebpe
  mbeni ye so ndali ni ita ti mo at\u00ef.\\n22 Mabe so mo yeke na ni, bata ni ndali
  ti mo na l\u00ea ti Nzapa. Ngia ayeke na zo so azia tere ti lo na gbe ti ngbanga
  p\u00ebpe ndali ti ye so lo yeda ti sara ni.\\n23 Me tongana lo yeke na kite, a
  f\u00e2 ngbanga na li ti lo awe tongana lo te ni ngbanga ti so lo te ni na mabe
  p\u00ebpe. Biani, ye kue so a sara ni na lege ti mabe p\u00ebpe ayeke siokpari.\"",
  "\"Bia 49 na sambela\\nAt\u00ebn\u00eb ti tongo nda ni (ahon pn. 3 p\u00ebpe)\\nANZONI
  YE SO AYEKE NA Y\u00c2 TI BIBLE\\n\u201cNgb\u00e2 na ndo ti lingo ti Lo Ti Nduzu
  Ahon Kue\u201d: (pn. 10)\\nPs 91:1, 2\u2014\u201cNdo ti lingo\u201d ti J\u00e9hovah
  am\u00fb na e nzoni duti na lege ti yingo (w10 1/2 l. 30 par. 10-11)\\nPs 91:3\u2014Tongana
  ti mbeni zo ti gbungo ndeke, Satan ayeke gi ti gbu e (w07 1/10 l. 28-32 par. 1-18)\\nPs
  91:9-14\u2014J\u00e9hovah ayeke ndo ti bata tere ti e (w10 1/1 l. 16-17 par. 13-14;
  w01 15/11 l. 19-20 par. 13-19)\\nGi anzoni ye so ayeke na y\u00e2 ti Bible: (pn.
  8)\\nPs 89:35-38\u2014Mbele wa la a sara t\u00ebn\u00eb ni na y\u00e2 ti avers\u00ea
