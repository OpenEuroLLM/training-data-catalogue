sample: '["\"Esk\u00ea e peut ti hinga t\u00e2 t\u00ebn\u00eb na ndo ti Nzapa?\\nNzapa
  asara t\u00ebn\u00eb \u00e2nd\u00f6 na azo. Lo sara kua na yingo vulu ti lo, so
  ti tene ngangu ti lo, ti zia apens\u00e9 ti lo na y\u00e2 ti li ti azo so as\u00fb
  lani Bible (2 Pierre 1:20, 21). E peut ti hinga t\u00e2 t\u00ebn\u00eb na ndo ti
  Nzapa, tongana e diko Bible.\\nNa y\u00e2 ti Bible, Nzapa afa aye mingi na ndo ti
  lo. Lo fa ndani so lo leke azo, nyen la lo yeke sara ande ndali ti azo nga ye so
  lo yeke ku na mbage ti e (Kusala 17:24-27). J\u00e9hovah aye ti tene e hinga t\u00e2
  t\u00ebn\u00eb na ndo ti lo..\\nNgbanga ti nyen la Nzapa andoye azo so aye ti hinga
  t\u00e2 t\u00ebn\u00eb na ndo ti lo?\\nJ\u00e9hovah ayeke Nzapa ti t\u00e2 t\u00ebn\u00eb,
  na lo tokua lani J\u00e9sus, so ayeke Molenge ti lo, ti ga ti fa t\u00e2 t\u00ebn\u00eb
  na azo. Ni la, azo so aye t\u00e2 t\u00ebn\u00eb aga lani na mbage ti J\u00e9sus
  (Jean 18:37). Nzapa aye ti tene mara ti azo tongaso avoro lo.\\nSatan Zabolo akanga
  lege na azo mingi ti hinga Nzapa, na fango na ala amvene na ndo ti Nzapa (2 aCorinthien
  4:3, 4). Azo so aye nzoni ye ape ayeda na afango ye ti mvene ni so (aRomain 1:25).
  Me, gb\u00e2 ti azo so aye nzoni ye awara lege ti hinga t\u00e2 t\u00ebn\u00eb na
  ndo ti Nzapa, na lege ti mandango Bible.\\nTI HINGA AMBENI T\u00cbN\u00cb\\nKAPA
  TI MANDANGO BIBLE\\nBible ayeke m\u00fb maboko laso na azo kutu na kutu na y\u00e2
  ti dunia kue ti wara akiringo t\u00ebn\u00eb na angangu t\u00ebn\u00eb so ala yeke
  hunda na y\u00e2 ti gigi ti ala. Mo nga kue mo ye ti duti na popo ti ala?\"", "\"1,
  2. (a) Aye wa la afa so Gbia ti e akomanse ti komande na ngu 1914? (b) E yeke b\u00e2
  ande nyen na y\u00e2 ti chapitre so?\\nSO E kiri e b\u00e2 ye so Royaume ti Nzapa
  asara na popo ti awato ti lo so, a kiri akpengba mabe ti e (Ps. 110:2). Gbia ti
  e abungbi gb\u00e2 ti azo so ayeke fa t\u00ebn\u00eb na b\u00ea ti ala kue. Lo sukula
  adisciple ti lo, lo sara si ala voro Nzapa nga asarango ye ti ala aga nzoni. At\u00e2a
  ngangu so awato ti Royaume ni asara ti kangbi y\u00e2 ti e, laso e kue, e yeke yanga
  oko. Aye ni so nga na ambeni ye ni nde so Royaume ni asara awe, so e londo ti b\u00e2
  ni, afa polele so ngbene ye na ngu 1914, Gbia ti e ayeke komande na popo ti awato
  ti Royaume ni.\\n2 Na y\u00e2 ti ngoi kete, Royaume ni ayeke sara ambeni kpengba
  mbeni ye ahon aye ni so. Royaume ni ayeke \u2018ga\u2019 ti neka awato ti lo (Mat.
  6:10; Dan. 2:44). Kozo ti tene ye ni so asi, ambeni kpengba ye ayeke si. A yeke
  nyen? Gb\u00e2 ti aproph\u00e9tie ti Bible akiri t\u00ebn\u00eb na hundango ndo
  so. Zia e b\u00e2 ambeni aproph\u00e9tie ni ti b\u00e2 aye wa la angb\u00e2 ti ku
  e.\\nAye so ayeke si kozo ti tene \u2018futingo aga gi hio tongaso\u2019\\n3. Kozo
  ye wa, so ayeke si ande, e yeke ku ni?\\n3 Tenengo t\u00ebn\u00eb ti siriri. Na
  y\u00e2 ti mbeti so bazengele Paul atokua na aita ti Thessalonique, lo fa kozo ye
  so ayeke si, so e yeke ku ni. (Diko 1 aThessalonicien 5:2, 3.) Na y\u00e2 ti mbeti
  so, Paul asara t\u00ebn\u00eb ti \u201cl\u00e2 ti J\u00e9hovah\u201d, so ayeke to
  nda ni na bira so a yeke ga na ni na tere ti \u201cBabylone, Ngangu gbata\u201d.
  (Apoc. 17:5) Ye oko, kozoni si l\u00e2 ti J\u00e9hovah ato nda ni, amara ayeke tene
  ande, \u201cSiriri na nzoni duti ayeke d\u00e4!\u201d T\u00ebn\u00eb so alingbi
  ti ndu gi t\u00ebn\u00eb oko so azo ni atene wala ambeni ngangu t\u00ebn\u00eb so
  ala yeke tene na peko ti tere. Akota zo ti abungbi ti nzapa ayeke duti na y\u00e2
  ni? Teti so ala yeke ti mbage ti dunia so, peut-\u00eatre ala yeke bungbi yanga
  ti ala oko ti tene \u201cSiriri, siriri\u201d. (J\u00e9r. 6:14; 23:16, 17; Apoc.
  17:1, 2). Sarango t\u00ebn\u00eb ti siriri na nzoni duti so ayeke duti ande mbeni
  kota ye so afa so l\u00e2 ti J\u00e9hovah aga nduru ti komanse awe. Awato ti Royaume
  ti Nzapa ayeke \u201ckpe ande oko p\u00ebpe.\u201d\\n4. So e gbu nda ti proph\u00e9tie
  ti Paul na ndo ti t\u00ebn\u00eb ti tenengo siriri na nzoni duti, a sara nzoni na
  e tongana nyen?\\n4 So e m\u00e4 y\u00e2 ti proph\u00e9tie so nzoni, ye ti nzoni
  wa e wara na pekoni? Paul atene: \u201cAla yeke na y\u00e2 ti bingo p\u00ebpe, si
  lango ni so anzi ala nzingo tongana ti so kota l\u00e2 ayeke nzi azo ti nzi\u201d.
  (1 aThes. 5:3, 4). Nde na tanga ti azo, e hinga ndo so aye so ayeke si laso ayeke
  gue ti hunzi d\u00e4. Proph\u00e9tie na ndo ti siriri nga na nzoni duti so ayeke
  si t\u00e2 mbilimbili tongana nyen? A lingbi e ku na e b\u00e2 tongana nyen la aye
  ni ayeke si. Ni la, \u201czia l\u00ea ti e angb\u00e2 na zingo ni na e zia li ti
  e kp\u00f4.\u201d\\nKota ye ti vundu ato nda ni\\n5. \u201cKota ye ti vundu\u201d
  ayeke to nda ni ande tongana nyen?\\n5 Bira na ndo ti abungbi ti nzapa. Dabe ti
  mo so Paul atene: \u201cNa ngoi so azo ni ayeke tene: \u2018Siriri na nzoni duti
  ayeke d\u00e4!\u2019 mo ye ti b\u00e2, futingo ayeke ga gi hio tongaso na ndo ti
  ala\u201d. Legeoko tongana ti so sungbango ti bekpa ayeke ga gi hio na peko ti w\u00e2
  ti bekpa, na peko ti so a yeke tene \u201cSiriri na nzoni duti ayeke d\u00e4!\u201d,
  \u201cfutingo ayeke ga gi hio tongaso\u201d. A yeke futi ande nyen? Kozoni, a yeke
  \u201cBabylone, Ngangu gbata\u201d, groupe ti abungbi ti vorongo nzapa ti wataka
  kue, so a hinga lo tongana \u201cwali-ndumba\u201d. (Apoc. 17:5, 6, 15) Futingo
  a-eglize nga na ambeni bungbi ti nzapa ayeke zi lege na \u201ckota ye ti vundu\u201d.
  (Mat. 24:21; 2 aThes. 2:8). Ti azo mingi, aye so ayeke nzi ala ande nzingo. Ngbanga
  ti nyen? Ngbanga ti so, ti si na ngoi ni so, wali-ndumba ni so ab\u00e2 tere ti
  lo tongana \u201cgbia-wali\u201d so ayeke \u201cduti na y\u00e2 ti mua l\u00e2 oko
  p\u00ebpe.\u201d Me, lo yeke b\u00e2 ande hio so confiance ti lo ni so ayeke na
  lege ni ape. A yeke futi lo hio, \u201cgi na y\u00e2 ti lango oko\u201d.\\n6. Zo
  wa la ayeke ga na bira na ndo ti \u201cBabylone, Ngangu gbata\u201d?\\n6 Zo wa la
  ayeke ga na bira so na ndo ti \u201cBabylone, Ngangu gbata\u201d? A yeke mbeni \u201cnyama
  ti ngonda\u201d so ayeke na \u201cadidi bale-oko.\u201d Buku ti Apocalypse afa so
  nyama ti ngonda so aye ti sara t\u00ebn\u00eb ti ONU. Adidi bale-oko ni aduti f\u00e4
  ti azo ti poroso ti laso so ayeke m\u00fb mbage ti \u201cbengba nyama ti ngonda\u201d.
  (Apoc. 17:3, 5, 11, 12). Futingo ni so ayeke duti ande tongana nyen? Amara so ayeke
  na y\u00e2 ti ONU ayeke m\u00fb ande amosoro ti wali-ndumba so kue, ala yeke futi
  lo nga \u201cala yeke gbi lo kue na w\u00e2.\u201d\\n7. Tongana nyen la at\u00ebn\u00eb
  ti J\u00e9sus na Matthieu 24:21, 22 aga t\u00e2 t\u00ebn\u00eb lani na ngoi ti akozo
  Chr\u00e9tien? A yeke ga ande t\u00e2 t\u00ebn\u00eb tongana nyen?\\n7 A kiri na
  alango ni nduru. Gbia ti e afa ye so ayeke si ande na y\u00e2 ti mbage ti kota ye
  ti vundu so. J\u00e9sus atene: \u201cNdali ti azo so a soro ala, fade a yeke kiri
  na alango ni so nduru.\u201d (Diko Matthieu 24:21, 22.) At\u00ebn\u00eb ti J\u00e9sus
  so aga lani t\u00e2 t\u00ebn\u00eb kete na ngu 66 na ngoi so J\u00e9hovah \u2018akiri
  na alango\u2019 ti bira ti aturugu ti Rome nduru (Marc 13:20). Ye so asara lani
  si aChr\u00e9tien na J\u00e9rusalem nga na Jud\u00e9e as\u00f6 ku\u00e2. Nyen la
  ayeke si ande na ndo ti sese kue na ngoi ti kota ye ti vundu? J\u00e9hovah, na lege
  ti Gbia ti e, ayeke \u2018kiri na alango\u2019 ti bira ti ONU, na tere ti abungbi
  ti Nzapa, si a futi p\u00ebpe t\u00e2 bungbi ti Nzapa legeoko na ati wataka. Tongaso,
  a yeke futi biani abungbi ti vorongo nzapa ti wataka me t\u00e2 bungbi ti Nzapa
  ayeke s\u00f6 ku\u00e2. (Ps. 96:5) Zia e b\u00e2 aye so ayeke si ande tongana mbage
  ti kota ye ti vundu so ahon awe.\\nAye so ayeke gue ngbii ti si na Harmagu\u00e9don\\n8,
  9. Aye ti ndima wa J\u00e9sus asara t\u00ebn\u00eb ni, nga tongana nyen la azo ayeke
  sara ye ande na bango ni?\\n8 Proph\u00e9tie ti J\u00e9sus na ndo ti l\u00e2 ti
  nda ni afa so ambeni kpengba ye mingi ayeke si na y\u00e2 ti ngoi so ayeke gue ti
  si na Harmagu\u00e9don. E yeke b\u00e2 ande akozo ye use. A sara t\u00ebn\u00eb
  ni use kue na y\u00e2 ti a\u00c9vangile ti Matthieu, Marc na Luc.\\n9 Af\u00e4 na
  l\u00ea ti nduzu. J\u00e9sus atene: \u201cFade l\u00e2 ayeke vuko, na nze ayeke
  su p\u00ebpe, na atongoro ayeke londo ande na nduzu ti t\u00ef.\u201d Ti t\u00e2
  t\u00ebn\u00eb ni, azo ayeke b\u00e2 ande ndo p\u00ebpe na mbage ti akota zo ti
  abungbi ti nzapa ti wara lumi\u00e8re teti so a yeke hinga ande ala tongaso ape.
  J\u00e9sus aye ti sara t\u00ebn\u00eb ti af\u00e4 so ahon gbungo li ti zo? Peut-\u00eatre
  lo ye ti tene tongaso (\u00c9s. 13:9-11; Jo\u00ebl 2:1, 30, 31). Tongana azo ab\u00e2
  aye so, ala yeke sara ye tongana nyen? Ala yeke duti ande na \u201ckota vundu\u201d
  ndali ti so \u201cala hinga p\u00ebpe mbeni ye ti sara\u201d. (Luc 21:25; Soph.
  1:17). Biani, awato ti Royaume, ti londo na \u2018agbia ti si na angb\u00e2a,\u2019
  \u201cayeke woko na mbeto nga na kungo aye so ayeke ga na ndo ti sese so azo ayeke
  d\u00e4\u201d, na ala yeke kpe ti honde tere ti ala. Me, ala yeke wara ande ape
  mbeni nzoni place ti honde tere ti ala si ala kpe ngonzo ti Gbia ti e.\\n10. J\u00e9sus
  ayeke d\u00eb ande ngbanga wa? Azo so ayeke na mbage ti lo nga na awato ti lo ayeke
  sara ande ye tongana nyen?\\n10 Fango ngbanga. Awato ti Royaume ti Nzapa kue ayeke
  b\u00e2 ande mbeni ye so ayeke si, so ayeke kiri ti kono mbeto ti ala ni. J\u00e9sus
  atene: \u201cala yeke b\u00e2 ande Molenge ti zo so ayeke ga na y\u00e2 ti ambinda,
  na kota ngangu nga na gloire.\u201d (Marc 13:26). Mbeni ye so ayeke si ande, so
  alondo na azo p\u00ebpe, ayeke fa ande so J\u00e9sus aga nduru awe ti f\u00e2 ngbanga.
  Na y\u00e2 ti mbeni oko mara ti proph\u00e9tie ni so na ndo ti l\u00e2 ti nda ni,
  J\u00e9sus afa ambeni nzene nzene ye na ndo ti fango ngbanga so ayeke si ande na
  ngoi ni so. E wara ni na y\u00e2 ti parabole ti angasangbaga na angasa. (Diko Matthieu
  25:31-33, 46.) A yeke tene ande so azo so am\u00fb gi mbage ti Royaume ti Nzapa
  ayeke \u201cangasangbaga\u201d nga ala yeke \u201cy\u00f4 li ti ala na nduzu\u201d,
  ndali ti so ala hinga so \u201cngoi ti zingo ala aga nduru awe.\u201d (Luc 21:28).
  Ye oko, a yeke tene so awato ti Royaume ni ayeke \u201cangasa\u201d na ala yeke
  \u201cpika tere ti ala ti fa so ala yeke na vundu\u201d, teti so ala hinga so ala
  yeke \u201cwara ku\u00e2 teti lakue lakue\u201d.\\n11. A lingbi e bata nyen na li
  ti e na ngoi so e yeke b\u00e2 t\u00ebn\u00eb ti aye so ayeke si ande?\\n11 Na peko
  ti so J\u00e9sus ayeke f\u00e2 ngbanga na ndo ti \u201camara kue\u201d, ambeni kpengba
  ye ayeke si kozo si Harmagu\u00e9don asi (Mat. 25:32). E yeke b\u00e2 use na popo
  ni: bira ti Gog nga bungbingo azo so a soro ala ti gue na yayu. Na ngoi so e yeke
  b\u00e2 aye so, a yeke nzoni e dabe ti e so Mbeti ti Nzapa afa p\u00ebpe mbilimbili
  ngoi so aye ni ayeke si ande na ni. Ti t\u00e2 t\u00ebn\u00eb ni, a manke mbeni
  oko ayeke si na ngoi so mbeni angb\u00e2 ti si.\\n12. Kota bira so Satan ayeke sara
  ande na tere ti Royaume ni ayeke so wa?\\n12 Kota bira. Gog ti Magog ayeke ga ande
  na bira na tere ti azo so a soro ala ti gue na yayu nga na amba ti ala ambeni ngasangbaga.
  (Diko \u00c9z\u00e9chiel 38:2, 11.) Bira so Satan ayeke ga na ni na tere ti Royaume
  ni, so akomanse kua awe, ayeke duti ande ndangba bira ti lo na y\u00e2 ti bira so
  lo yeke sara ni, ngbene ye so a tomba lo na yayu, na tere ti azo so a soro ala ti
  gue na yayu (Apoc. 12:7-9, 17). Mbilimbili, ngbene ye so a bungbi aChr\u00e9tien
  so a soro ala ti gue na yayu na y\u00e2 ti congr\u00e9gation ti aChr\u00e9tien so
  a sukula ala, Satan agi lakue ti futi guengo na li ni ti ala na lege ti yingo, me
  kue gb\u00e4 (Mat. 13:30). Ye oko, na ngoi so abungbi ti nzapa ti wataka kue ayeke
  d\u00e4 encore ape, awakua ti J\u00e9hovah ayeke ngb\u00e2 gi ala oko, mo b\u00e2
  mo tene \u2018akodoro so ayeke na gbagba ti bira p\u00ebpe.\u2019 Satan ayeke b\u00e2
  ande so mbeni pendere lege la azi na lo so. Lo yeke pusu asioni zo ti l\u00ef na
  y\u00e2 ti mbeni kota bira na ndo ti azo so am\u00fb mbage ti Royaume ni.\\n13.
  J\u00e9hovah ayeke sara ande nyen ndali ti awakua ti lo?\\n13 \u00c9z\u00e9chiel
  afa ye so ayeke si ande. Na ndo ti Gog, proph\u00e9tie ni atene: \u201cFade mo londo
  na ndo ti mo so ayo mingi na mbage ti nord ti ga, mo, na azo nde nde so ayeke na
  mo mingi, ala kue atambela na ndo ambarata, azo mingi mingi, aturugu ti ngangu;
  fade mo ga ti sara bira na azo ti Mbi.\u201d (\u00c9z\u00e9ch. 38:15, 16). J\u00e9hovah
  ayeke sara ande nyen na gbele bira so akpa mbeni ye so zo alingbi ti kanga lege
  na ni p\u00ebpe so? J\u00e9hovah atene: \u201cFade ngonzo ti Mbi ama asi na duhon
  ti Mbi. Fade Mbi iri \u00e9p\u00e9e.\u201d (\u00c9z\u00e9ch. 38:18, 21; diko Zacharie
  2:8.) J\u00e9hovah ayeke sara ye ande ndali ti awakua ti lo na ndo ti sese ge. Ge
  la bira ti Harmagu\u00e9don ayeke londo.\\n14, 15. Mbeni ye nde wa ayeke si ande
  kete na peko ti tongo nda ti kota bira ti Satan?\\n14 Kozo ti tene e b\u00e2 tongana
  nyen la J\u00e9hovah ayeke m\u00fb mbage ti awakua ti lo na ngoi ti bira ti Harmagu\u00e9don,
  zia e luti kete na e b\u00e2 mbeni kpengba ye nde so ayeke si. Ye ni so ayeke si
  ande na mbeni ngoi so ayeke na popo ti tongo nda ti kota bira ti Satan na tongo
  nda ti bira ti Harmagu\u00e9don. Tongana ti so e tene na paragraphe 11, use ye ni
  so ayeke bungbingo tanga ti aChr\u00e9tien so a soro ala, so angb\u00e2 na sese
  ge, ti gue na ala na yayu.\\n15 Bungbingo azo so a soro ala ti gue na yayu. Matthieu
  na Marc, ala use kue, asara t\u00ebn\u00eb ti ye so J\u00e9sus atene na ndo ti \u2018azo
  so a soro ala\u2019, aChr\u00e9tien so a soro ala ti gue na yayu. A zia ye so na
  popo ti aye so ayeke si kozo si Harmagu\u00e9don akomanse (B\u00e2 paragraphe 7.)
  Na sarango t\u00ebn\u00eb ti lo wani tongana Gbia, J\u00e9sus atene: \u201cFade
  lo yeke tokua a-ange, si ti londo na apupu osio, nga ti londo na nda ti sese ti
  si na nda ti yayu, ala yeke bungbi na ndo oko azo ti lo so a soro ala.\u201d (Marc
  13:27; Mat. 24:31). Bungbingo ye wa la J\u00e9sus ayeke sara t\u00ebn\u00eb ni so?
  Lo yeke sara p\u00ebpe t\u00ebn\u00eb ti ziango nzoroko, ti ndangba ni, na li ti
  aChr\u00e9tien so a soro ala ti gue na yayu, so ayeke si ngoi kete kozo si kota
  ye ti vundu akomanse (Apoc. 7:1-3). Nde na so, J\u00e9sus ayeke sara t\u00ebn\u00eb
  ti mbeni ye so ayeke si na ngoi so kota ye ti vundu ayeke si. Tongaso, \u00e2manke
  na mbeni ngoi na peko ti tongo nda ti kota bira ti Satan na ndo ti awakua ti J\u00e9hovah,
  a yeke bungbi ande na yayu tanga ti aChr\u00e9tien so a soro ala na lege ti yingo,
  so angb\u00e2 na ndo ti sese.\\n16. A-Chr\u00e9tien so a soro ala na lege ti yingo,
  so a zingo ala awe, a yeke sara ande nyen na ngoi ti bira ti Harmagu\u00e9don?\\n16
  Tongana nyen la bungbingo tanga ti aChr\u00e9tien so a soro ala ti gue na yayu andu
  ye so e yeke gue ti sara t\u00ebn\u00eb na ndo ni, so ayeke Harmagu\u00e9don? Ngoi
  so si a yeke bungbi na ala d\u00e4 afa so aChr\u00e9tien kue so a soro ala na lege
  ti yingo ayeke duti ande na yayu kozo si bira ti Nzapa, so ayeke Harmagu\u00e9don,
  ato nda ni. Na yayu, azo 144 000 so ayeke komande na tere ti Christ ayeke wara ande
  komandema ti y\u00f4 legeoko na J\u00e9sus \u201ckeke ti wen\u201d na tere ti awato
  ti Royaume ti Nzapa kue (Apoc. 2:26, 27). Na pekoni, na tere ti angangu ange, aChr\u00e9tien
  so a soro ala na lege ti yingo, so a zingo ala na ku\u00e2, ayeke m\u00fb peko ti
  Christ, Gbia so ayeke turugu, na ngoi so lo yeke tiri na gb\u00e2 ti aturugu, so
  alingbi ti diko wungo ti ala p\u00ebpe, so ayeke tuku na ndo ti awakua ti J\u00e9hovah
  (\u00c9z\u00e9ch. 38:15). Na ngoi so kota ngangu bira so ayeke si, and\u00e2 Harmagu\u00e9don
  alondo awe!\\nNdangba mbage ti kota ye ti vundu\\n17. Nyen la ayeke si ande na azo
  so ayeke tongana \u201cangasa\u201d na Harmagu\u00e9don?\\n17 Sarango ye alingbi
  na fango ngbanga. Bira ti Harmagu\u00e9don ayeke duti ande ndangba mbage ti kota
  ye ti vundu. Na ngoi ni k\u00e2, J\u00e9sus ayeke sara ande mbeni kua nde so a m\u00fb
  na lo. Na ndo ti kua ti lo ti Juge ti \u201camara kue\u201d, lo yeke ga nga ande
  Zo so ayeke sara ye alingbi na ngbanga so lo f\u00e2 lani na ndo ti azo, so ti tene
  azo kue so lo b\u00e2 ala lani tongana \u201cangasa.\u201d (Mat. 25:32, 33). Na
  \u201cyongoro \u00e9p\u00e9e so yanga ni aza\u201d, Gbia ti e ayeke \u201cd\u00eb
  amara na ni\u201d. T\u00e2 t\u00ebn\u00eb, azo kue so ayeke tongana angasa, a londo
  na \u201cagbia\u201d ti si na \u201cangb\u00e2a\u201d, \u201cayeke wara ku\u00e2
  teti lakue lakue\u201d.\\n18. (a) Ye ni ayeke duti ande tongana nyen ndali ti \u201cangasangbaga\u201d?
  (b) J\u00e9sus ayeke hunzi ande bira ni tongana nyen?\\n18 Ye ni ayeke duti ande
  tongana nyen ndali ti azo so J\u00e9sus ab\u00e2 ala tongana \u201cangasangbaga\u201d?
  Gb\u00e2 ti aturugu ti Satan ayeke d\u00f6 ande na gere ti ala p\u00ebpe \u201cazo
  mingi mingi\u201d so akpa \u201cangasangbaga\u201d so zo ti batango ala ayeke d\u00e4
  p\u00ebpe. Nde na so, ala yeke hon na y\u00e2 ti bira so awato aga na ni na ndo
  ti ala nga ala yeke \u2018sigigi na y\u00e2 ti kota ye ti vundu\u2019. (Apoc. 7:9,
  14) Na peko ti so J\u00e9sus as\u00f6 benda na lo futi awato ti Royaume ti Nzapa
  kue awe, lo yeke bi Satan na ad\u00e9mon ti lo na y\u00e2 ti kota d\u00fb. Ala yeke
  ngb\u00e2 ande na y\u00e2 ni teti ngu saki oko, mo b\u00e2 mo tene ala kui awe.\\nE
  yeke leke tere ti e tongana nyen?\\n19, 20. E lingbi ti manda nyen na lege ti at\u00ebn\u00eb
  so ayeke na \u00c9sa\u00efe 26:20 nga 30:21?\\n19 E yeke leke tere ti e tongana
  nyen ti ku na aye so ayeke si ande, so ayeke yengi ndo so? A ninga awe, mbeni Tour
  ti Ba Ndo asara t\u00ebn\u00eb so: \u201cMango yanga ayeke duti ye so a hunda ti
  wara salut.\u201d Ngbanga ti nyen? Kiringo t\u00ebn\u00eb ni ayeke na y\u00e2 ti
  t\u00ebn\u00eb ti gbotongo m\u00ea so J\u00e9hovah atene na aJuif so ayeke lani
  angb\u00e2a na Babylone. J\u00e9hovah atene so a yeke hon ande Babylone na ngangu.
  Me nyen la a lingbi awakua ti Nzapa asara ti leke tere ti ala ndali ti ye so ayeke
  si ande so? J\u00e9hovah atene: \u201cI ga, i azo ti mbi, i l\u00ef na da ti i,
  i kanga yanga ti da ti i na peko ti i; i honde tere ti i kete, juska ngonzo ahon.\u201d
  (\u00c9s. 26:20). B\u00e2 at\u00ebn\u00eb so J\u00e9hovah asara na kua: \u201cga,\u201d
  \u201cl\u00ef,\u201d \u201ckanga,\u201d \u201chonde.\u201d At\u00ebn\u00eb so kue
  afa so a yeke commandement la a m\u00fb so. A-Juif so abata acommandement so ayeke
  ngb\u00e2 na y\u00e2 ti da ti ala, yongoro na aturugu so as\u00f6 benda, so ayeke
  na gigi. Ni la, mango yanga la ayeke sara si ala s\u00f6 ku\u00e2. *\\n20 Nyen la
  e manda d\u00e4 nyen? Tongana ti awakua ti Nzapa ti giriri, tongana e bata acommandement
  ti J\u00e9hovah si e yeke s\u00f6 ande ku\u00e2 na y\u00e2 ti aye so ayeke si ande
  so (\u00c9s. 30:21). E yeke wara acommandement ni so na lege ti congr\u00e9gation.
  Ni la, e yeke sara kue ti m\u00e4 na ti yeda na b\u00ea ti e kue na fango lege so
  e yeke wara (1 Jean 5:3). Tongana e sara ni laso, e yeke duti ande nduru ti m\u00e4
  yanga hio si Bab\u00e2 ti e, J\u00e9hovah, nga na Gbia ti e, J\u00e9sus, abata e
  (Soph. 2:3). Batango ndo so ayeke m\u00fb lege ande na e ti b\u00e2 t\u00e2 na l\u00ea
  ti e tongana nyen la Royaume ti Nzapa ayeke futi biaku awato ti lo. A yeke duti
  ande mbeni ye so e yeke girisa ni l\u00e2 oko ape!\\n^ par. 6 E lingbi ti tene so
  a yeke na lege ni ti tene so futingo \u201cBabylone, Ngangu gbata\u201d andu mbilimbili
  futingo abungbi ti nzapa, me p\u00ebpe fango azo ti vorongo nzapa kue. Ni la, mingi
  ti azo so ayeke kozo na y\u00e2 ti Babylone ayeke hon na y\u00e2 ti futingo so nga,
  peut-\u00eatre dandara, ala yeke zi tere ti ala yongoro na abungbi ti nzapa, tongana
  ti so Zacharie 13:4-6 afa.\"", "\"A sara fadeso ngu oko na ndambo tongaso awe la
  si Jean Baptiste afa J\u00e9sus na azo tongana Kete taba ti Nzapa. Tongana J\u00e9sus
  akomanse lani kua ti fango t\u00ebn\u00eb, ambeni koli ayeda na b\u00ea ti ala kue
  ti ga adisciple ti lo. A yeke azo tongana Andr\u00e9, Simon Pierre, Jean, peut-\u00eatre
  Jacques (ita ti Jean), Philippe nga na Barth\u00e9lemy (so a iri nga lo Nathana\u00ebl).
  Tongana ngoi ayeke hon, ambeni zo nga nde am\u00fb peko ti J\u00e9sus.\u2014Jean
  1:45-47.\\nFadeso, J\u00e9sus aye ti soro abazengele ti lo. A yeke azo so ayeke
  duti ande nduru na lo mingi, nga so ayeke wara ande mbeni fango ye so ayeke nde
  mingi. Me kozo ti tene lo soro ala, J\u00e9sus ague na ndo ti mbeni hoto, peut-\u00eatre
  so ayo mingi ape na Kota ngu ti Galil\u00e9e, nduru na Caperna\u00fcm. K\u00e2,
  lo sambela na b\u00ef ni kue, ti hunda ndara ti Nzapa nga na tufa ti lo. Na ndade
  ni, lo iri adisciple ti lo na lo soro bale-oko na use na popo ti ala ti ga abazengele
  ti lo.\\nJ\u00e9sus asoro ala omene so a fa fade iri ti ala na nduzu ge so, nga
  lo soro Matthieu, koli so lo iri lani lo na place ti rongo nginza ti imp\u00f4t.
  Tanga ti ala oku so lo soro ala ayeke: Judas (so a iri nga lo Thadd\u00e9e nga so
  ayeke \u201cmolenge ti Jacques\u201d), Simon so ayeke zo ti Canaan, Thomas, Jacques
  molenge ti Alph\u00e9e nga na Judas Iscariote.\u2014Matthieu 10:2-4; Luc 6:16.\\nFadeso,
  ala bale-oko na use so ayeke gue na ando kue so J\u00e9sus ague d\u00e4, na J\u00e9sus
  ahinga ala kue nzoni mingi. Mingi na popo ti ala ayeke afami ti lo. Jacques na ita
  ti lo Jean ayeke at\u00e2 fami ti J\u00e9sus. Nga tongana ti so ambeni zo apens\u00e9,
  si tongana Alph\u00e9e ayeke ita ti Joseph, bab\u00e2 so abata lani J\u00e9sus,
  tongaso Jacques, so ayeke molenge ti Alph\u00e9e, ayeke nga mbeni fami ti J\u00e9sus.\\nMe
  J\u00e9sus abata iri ti abazengele ti lo so kue. Ka mo, mo lingbi bata iri ti ala
  na li? Mbeni ye so apeut ti aid\u00e9 mo, a yeke ti hinga so aSimon ayeke use, aJacques
  ayeke use nga aJudas ayeke use. Simon (wala Pierre) ayeke ita ti Andr\u00e9, nga
  Jacques (molenge ti Z\u00e9b\u00e9d\u00e9e) ayeke ita ti Jean. B\u00e2 ye so apeut
  ti aid\u00e9 mo ti bata iri ti abazengele miombe la. Atanga ni osio ayeke Matthieu,
  so ayeke zo ti rongo nginza ti imp\u00f4t, Thomas zo so mbeni l\u00e2 lo yeke d\u00eb
  kite ande na ndo ti J\u00e9sus, Nathana\u00ebl, lo so J\u00e9sus awara lani lo na
  gbe ti mbeni keke, nga Philippe so ayeke kamarade ti Nathana\u00ebl.\\nBale-oko
  na oko na popo ti abazengele ni alondo na Galil\u00e9e, kodro so J\u00e9sus akono
  d\u00e4. Nathana\u00ebl ayeke zo ti Cana. Philippe, Pierre na Andr\u00e9 ayeke azo
  ti Bethsa\u00efda. J\u00e9sus awara lani Pierre na Andr\u00e9 na ngoi so ala sara
  kodro na Caperna\u00fcm, ndo so amanke Matthieu alango d\u00e4. Jacques na Jean
  kue adoit ti lango na kodro ni so wala nduru na Caperna\u00fcm ni, na ala yeke sara
  kua ti gingo susu na ndo ni so. Judas Iscariote, so na pekoni a yeke k\u00e4 ande
  J\u00e9sus, adoit ti duti oko bazengele so ayeke zo ti Jud\u00e9e.\"", "\"Bible
  na ndo ti Internet | MBETI TI NZAPA TI FINI DUNIA\\n61 Yingo ti J\u00e9hovah, Seigneur
  ti dunia kue, ayeke na nd\u00f6 ti mbi,+ndali ti so J\u00e9hovah asoro mbi ti fa
  nzoni t\u00ebn\u00eb na azo so ab\u00e2 ter\u00ea ti ala kete.+\\nLo tokua mbi na
  azo so ayeke na k\u00e4 na b\u00ea ti ala ti sara si k\u00e4 ni am\u00fc,lo tokua
  mbi ti fa t\u00ebn\u00eb ti libert\u00e9 na angb\u00e2anga lo tokua mbi na azo ti
