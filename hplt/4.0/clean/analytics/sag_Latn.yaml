  ni, na ala yeke wara ti ala part ni use.+Ala yeke duti na ngia lakue lakue.+\\n8
  Mbi J\u00e9hovah, mbi ye fango ngbanga ti mbilimbili.+Mbi ke nzi nga na sarango
