sample: '["\"Okwiya kuwa kepitiyo Kumbundu lyo\u2026..www.GotQuestions.org!\\nVombwelo
  mwasoneh\u0129wa atendelo amela tu kwete Kumbundu:\\nApulilo akwete esilivilo lylwa\\nOkwete
  omwenyo Kopwi?\\nWa tambula ongecelo? Nambula ndati ongecelo ya Suku?\\nCa lomboloka
  ndati oku tava Yesu Kilistu Ndonjovoli yove?\\nOnjila Yeyovo oyo nye?\\nUkwakilistu
  oco nye?\\nAme nda kapa ekolelo lyange ku Yesu\u2026 kaliye nye?\\nApulilo a sole
  oku lingiwa olonjanja vyalwa\\nKuli Suku?\\nYesu Kilistu Eye Helie?\\nYesu Suku?
  Yesu wa la funda pamwe oku hoyela ocili cokuti Suku?\"", "\"Epulilo:\\nYesu Suku?
  Yesu wa la funda pamwe oku hoyela ocili cokuti Suku?\\nEtambululo:\\nVamwe pokati
  kava va likala elinga lyokuti Yesu Suku va lekisa ocisimilo cokuti Yesu lalimwe
  eteke a popele hati Eye Suku. Ocili okuti Embimbiliya lalimwe eteke lya lekisile
  Yesu oku linga hati \u201cAme Suku.\u201d Haimo lumwe, eci ka ci lomboloka okuti
  Yesu lalimwe eteke a fundile oku kala Suku.\\nYesu Suku? \u2013 Yesu wa funda okuti
  ame Suku.\\nVanja handi ndocindekase, olondaka vya Yesu Kilistu ko Yoano 10:30,
  \u201cAme la Isia tuamuamue\u201d. Etu tu sukila lika oku vanja ketambululo lya
  va Yundeya kovaso yolondaka Vyaye, oku kuliha okuti Eye wa kala loku funda okuti
  Eye Suku. Ovo va seteka oku U sas\u00f5la lovawe omo lyelinga eli mwele: \u201c\u2026Momo
  ove vumunu o lilingisa Suku\u201d (Yoano 10:33). Va Yundeya va kwata elomboloko
  liwa lyeci Yesu a kala loku funda \u2013 oku tyamela ku Suku. Eci Yesu a popya hati:
  \u201cAme la Isia tuamuamue,\u201d Eye wa kala loku popya hati Eye la Isya va tyamela
  kekalo limosi kwenda kocitwa cimosivo. Yoano 8:58 ocindekase cikwavo. Yesu wa popya
  hati: \u201cNdu sapuili siti, Ocili ocili osimbu Avirahama ka citiwile, ame, ame
  u!\u201d Eyi onjivaluko yo Etundilo 3:14 Eci Suku a lisitulula Eyemwele hati \u201cAME
  MUELE AME\u201d Va Yundeya vo yeva oku popya olondaka evi vo tambulula loku kwata
  vovawe loku u sas\u00f5la ha vo pondela eton\u00e3yi, ndomo Ocihandeleko ca Mose
  ca handelekele (Ovisila 24:16).\\nYesu Suku? \u2013 Olo\u00f1ame Vyaye vyO lombolola
  hati eye Suku.\\nYoano o pitulula ocisimilo pamwe esokolwilo lya Yesu oku tyamela
  ku Suku: \u201cNdaka (Yesu) wa kala Suku\u201d kwenje \u201cNdaka wa linga omunu\u201d
  (Yoano 1:1, 14). Ovinimbu evi vi lekisa ciwa okuti Yesu eye Suku vomunu. Ovilinga
  20:28 vi tu lombolwila hati: \u201cLilavi ene muele. Lavivo ocunda cosi Espiritu
  Sandu wo ci kapeli angombo, okuti vu lisa lisa ekongelo lia \u00d1ala lina a landa
  losonde yaye.\u201d Helye wa landa ekongelo losonde Yaye? Yesu Kilistu. Kwenda ocinimbu
  cimosi haco ci lombolola okuti Suku wa landa ekongelo Lyaye losonde Yaye mwele.
  Omo lyaco, Yesu eye Suku.\\nTomasi ondonge, ca tyamela ku Yesu wa kumbulula hati:
  \u201cA \u00d1ala yange, a Suku yange.\u201d (Yoano 20:28). Yesu ko lemelele. Tito
  2:13 li tu vetiya oku talamela oku iya kwa Suku yetu haye Onjovoli, Yesu Kilistu
  (Vanjavo ko 2 Petulu 1:1). Ku Va Heveru 1:8 oku tukula Yesu, Isya hati: \u201cOcalo
  cove a Suku, coloneke ka vi pui. Epangati liesunga olio epangati liusoma wove.\u201d
  Isya o tukula Yesu hati Suku, ci lekisa okuti Yesu ocili eye Suku.\\nKesituluilo,
  ungelo wa longisa upostolo Yoano oku fendela lika Suku (Esituluilo 19:10) Olonjanja
  vyalwa Vovisonehwa Yesu o tambula esivayo (Mateo 2:11; 14:33; 28:9, 17; Lukas 24:52;
  Yoano 9:38). Eye lalimwe eteke a lungwile pamwe oku lemela owi\u00f1i omo wa kala
  loku u fendela. Nda Yesu ka kale Suku, Eye nda wa lombolwila owi\u00f1i pamwe oku
  u lungula okuti ka u U fendela ndeci ungelo a ci linga kelivulu Lyesituluilo. Hacoko
  lika, kuli ovipama vyalwa vikwavo Vyovisonehwa vi lekisa okuti Yesu Suku.\\nYesu
  Suku? \u2013 Ekoka li lekisa okuti Yesu eye Suku.\\nEkoka lya velapo lyokuti Yesu
  eye Suku lyeli lyokuti, nda Eye ha Sukuko, olofa Vyaye nda ka vya swilepo okuti
  vi tela oku feta ekangiso lyakandu olwali wosi (1 Yoano2:2). Ociluvo ca lulikiwa,
  eci okuti nda oco ca kala Yesu nda ka kale Suku, nda ka ca telele oku feta ekangiso
  ka lipwi, lya kisikiwile ekandu li lingiwila Suku ka pwi. Te lika Suku eye o tela
  oku feta ekangiso eli ka lipwi. Te lika Suku eye wa tela oku upa akandu olwali (2
  Va Korindo 5:21), wa fa, kwenda wa pinduka, loku lekisa eyulo lyaye kekandu lo kokufa.\\nYesu
  Suku? Oco. Yesu Eyemwele wa lilombolola hati Ame Suku. Elyangiliyo lyeyovo li talavaya
  lika nda Yesu eye Suku. Yesu eye Suku wa linga omunu. Efetikilo haye Esulilo lyenda
  \u00f1o hu (Esituluilo 1:8; 22:13), kwenda Suku Onjovoli yetu (2 Petulu 1:1).\\nEnglish\\nYesu
  Suku? Yesu wa la funda pamwe oku hoyela ocili cokuti Suku?\"", "\"Embimbiliya li
  Tambulula Ndoco\\nUsoma wa Suku uviali wocili wa tumbikiwa la Yehova Suku. Vembimbiliya,
  \u201cUsoma wa Suku\u201d u tukuiwavo hati \u201cusoma wokilu\u201d momo u viala
  oku upisa kilu. (Mar. 1:\\nOwo u kuete ovina vialua via lisietah\u00e3la luviali
  womanu, pole, wa velapo uviali womanu.\\n- Olombiali. Suku wa n\u00f5la Yesu Kristu
  oku kala Ombiali Yusoma waye, kuenda wa eca kokuaye unene wa velapo okuti womanu
  u sule. (Mat. 28:\\n18) Omo Yesu o talavaya lika lunene waco oco a linge ovina viwa,
  ci lekisa okuti Ombiali yimue ya koleliwa haeye ukuahenda. (Mat. 4:23; Mar. 1: 40,
  41; 6: 31-34; Luka 7: 11- 17) Lekuatiso lia Suku, Yesu wa n\u00f5la omanu vo kolofeka
  viosi, vana va ka \u2018viala kumue laye kilu lieve\u2019 oku pisa kilu.\\n\u2014Esit.
  5: 9, 10. - Otembo u ka kala.\\nUsoma wa Suku ka u kasi ndowu womanu okuti, wimuha,
  momo \u2018lalimue eteke u ka ny\u00f5liwa.\u2019\\n\u2014Dan. 2:44. - Olonungi.
  Vana va linga ovina Suku a yongola, va pondola oku kala olonungi Viusoma wa Suku,
  okuti ka va n\u00f5liwa omo lioku tiam\u1ebdla kepata limue, ale kofeka yimue.\\n\u2014Ovil.
  10: 34, 35. - Ovihandeleko. Vovihandeleko (ale volonumbi) Viusoma wa Suku mua kongela
  ovina vialua okuti, ka vi tu tateka lika oku linga eci c\u0129vi, pole, vi tu lekisa
  ndomo tu pondola oku kala olonungi viwa. Embimbiliya li popia ndoco: \u201cYesu
  wo kumbulula hati, Sola \u00d1ala Suku yove lutima wove wosi lomuenyo wove wosi
  lolondunge viove viosi.\\nEci oco ocihandeleko cinene, haico catete. Kuenje cavali
  ca lisoka laco, ceci, okuti, Sola u o lisungue love ndeci o lisole ove muele.\u201d
  (Mat. 22:\\n37- 39) Oku sola Suku kuenda omanu ku vetiya olonungi Viusoma oku lingila
  ovina viwa vakuavo. - Elilongiso. Osimbu olonungi Viusoma wa Suku via velisapo elilongiso,
  vi longisavo omanu oku kapako olonumbi viaco.\\n\u2014Isa. 48: 17, 18. - Ocikundi.
  Ombiali Yusoma wa Suku, ka yi kisika olonumbi viawo lovina ka vi kuete esilivilo.
  Ovio vi t\u1ebdlisa ocipango ca Suku oku kongelamo ohuminyo yokuti vosi va lekisa
  ocisola va ka kala vofeka yelau palo posi otembo ka yi pui.\\n\u2014Isa. 35: 1,
  5, 6; Mat. 6:10; Esit. 21: 1-4.\"", "\"Kuakala ukuenje umue okuti, omo kasolele
  upange wokulima, wavanja upange vocakati kolupale waye. Vokuenda kuoloneke yu wainda
  lokulilongisa elimi lio''putu. Lo ame layo vo yafetika okuvokiya.\\nEteke limwe
  vokuenda oku\u00f1uala\u00f1uala wasokolola okulia osanji lovakamba vaye ko''nanya.
  Okuiya wosika ndona yaye hati:\\n- \u00d3 mulher, vou trazer meus migos. Tr\u00e1ta
  l\u00e1 aquilo (eye kalongisa oputu yaco ku''ndona)\\nVokutiuka weya apa lesanju
  lesolo kumosi. Pu\u00e3i hati ndivanjiliya pevindi, osanji alopo yeyi ivanja, kayapondelwe,
  kayatelekelwe.\\n- Mas, \u00f3 mulher, osanji kwayitelekele?\\n- Sio! - Ukai watambulula\\n-
  Mas eu n\u00e3o disse trata l\u00e1 aquilo?\\n- Oco mwele ndapanga. Omo okuti walinga
  heti tala tala kilu, ndasima siti ukuetu mbi wasakalala lombela. Oko mwele ndala\u00f1a
  loku tala tala kilu... ndamuna wacinuma.\\n(Wasapuila ko kota lyange Rosa Ngueve
  Gociante Patissa)\\nNenhum coment\u00e1rio:\\nPostar um coment\u00e1rio\"", "\"Onepa
  Hist\u00f3rico yo JW Library, yi soleka ovipama vialivulu levi Viembimbiliya wa
  tanga. O pondolavo oku talavaya layo nda o yongola oku tiukila vocisonehua wa tanga
  osimbu.\\nKuama olonumbi evi oco o talavaye lo Hist\u00f3rico:\\nTiukila ponepa
  Hist\u00f3rico\\nYelisa onepa yo Hist\u00f3rico\\nTiukila ponepa Hist\u00f3rico\\nTioka
  Kembimbiliya loku seya oco o tale ulala wovinimbu wa tanga ndopo. Tioka vocisonehua
  ale vocipama cimue ci kasi kulala wo Hist\u00f3rico oco o tiukileko.\\nTioka Palivulu
  oco o tale ulala wovipama vialivulu osi wa tanga ndopo. Tioka vocisonehua ale vocipama
  cimue ci kasi kulala wo Hist\u00f3rico oco o tiukileko.\\nYelisa Onepa yo Hist\u00f3rico\\nTioka
  Kembimbiliya ale Palivulu oco o yulule ulala wo Hist\u00f3rico. Tioka ponepa Limpar
  oco o yelise ulala waco.\\nOvimal\u1ebdho evi via sandekiwa kos\u00e3i ya Kupemba,
  yunyamo wo 2014 lo JW Library 1.2, okuti, vi likuata lo iOS 6.0 ale vikuavo. Nda
  kua muile ovimal\u1ebdho viaco, kuama olonumbi vocipama losapi hati: \u201c Fetika
  Oku Talavaya lo JW Library\u2014iOS,\u201d pokasapi hati: Obter os Recursos Mais
  Recentes.\"", "\"K''ulima wa 2004, ukuetu umwe tulisole wakuata ocipango co kusolekela
  ko elonga lyo visikilo (CD MP3). Pu\u00e3i vokuenda kuosimbu, ndaundikile elonga
  lyoviskilo kufeko umue ndatalavayile lahe, yu ndakuata ombinda yokuti ocikuata cange
  canyelela.\\nOsimanu yapita ndeti oco ukuenje umue atela okupapata vo computador
  imwe yanyolehele. Esanju lyaco linene calwa.\\nSali po ciwa\\nUm coment\u00e1rio:\\nAlthough
  we have differences in culture, but do not want is that this view is the same and
  I like that!\\nage of conan power leveling\\nPostar um coment\u00e1rio\"", "\"K\u0168L\u0128HISA
  eci omanu va kasi loku linga ndeti! Ovo va kasi loku fendela oci\u00f1uma\u00f1uma
  congombe. Momo lie?\\nEci Mose a kala komunda okatembo kamue, omanu va fetika oku
  popia hati: \u2018Ka tua k\u0169l\u0129hile eci ci kasi loku pita la Mose. Tu tungi
  osuku yimue yi tu songuila oku tunda vofeka yilo.\u2019\\nArone manji a Mose wa
  tava kondaka yaco. Wa sapuila omanu hati: \u2018Upi oving\u1ebdleng\u1ebdle viulu
  vi kasi kovatu\u0129 ene, vineni kokuange.\u2019 Eci va nena oving\u1ebdleng\u1ebdle
  viaco, Arone wa vi yengulula kuenje wa tunga lavio oci\u00f1uma\u00f1uma congombe.
  Noke va Isareli va fetika oku popia hati: \u2018U eye Suku yetu wa tu upa vofeka
  Yegito.\u2019 Ovo va linga ofesta yimue yinene kuenje va fendela oci\u00f1uma\u00f1uma
  caco.\\nEci Yehova a mola ovina viaco, weya oku tema calua kuenje wa sapuila Mose
  hati: \u2018Yayulako loka. Momo omanu va kasi loku linga eci c\u0129vi. Va yapuka
  vovihandeleko viange kuenje va li tungila oci\u00f1uma\u00f1uma culu.\u2019\\nMose
  wa loka komunda yaco lonjanga yalua. Eci a pitila ocipepi, wa mola ovilinga viaco
  via va Isareli. Omanu va kala loku imba kuenda oku piluka loku \u00f1uala \u00f1uala
  koci\u00f1uma\u00f1uma caco. Mose weya oku tema calua. Wa kupuila posi ovawe ovihandeleko
  kuenje a tetoka. Noke wa nya\u00f1ula oci\u00f1uma\u00f1uma caco culu kuenje wa
  ci yengulula. Wa ci keleketa ndosema.\\nOcili okuti, va Isareli va linga ocina cimue
  ka ca sungulukile. Mose wa sapuila alume vamue oco va kuate volosipata viavo. Wa
  popia lavo hati: \u2018Pondi omanu vosi va fendela oci\u00f1uma\u00f1uma.\u2019
  Alume vaco va ponda eci ci soka 3.000 komanu. Ovina evi vi lekisa okuti tu sukila
  lika oku fendela Yehova kuenda oku yuvula oku fendela olosuku viesanda.\\nEtundilo
  32:1-35.\\nApulilo\\n- Vociluvialuvia eci nye omanu va kasi oku linga? Kuenda momo
  lie?\\n- Momo lie Yehova a temelele? Kuenda nye Mose a linga poku mola eci omanu
  va kala loku linga?\\n- Mose wa sapuila alume vamue oku linga nye?\\n- Ulandu owu
  u tu longisa nye?\\nApulilo akuavo\\n- Tanga Etundilo 32:1-35.\\nUlandu owu u tu
  lekisa ndati ndomo Yehova a tenda oku tenga efendelo liocili leli liesanda? (Etu.
  32:4-6, 10; 1 Va Kor. 10:7, 11)\\nMomo lie Akrist\u00e3o va sukilila oku lunguka
  poku n\u00f5la olomapalo ndeci ovisikilo kuenda oku piluka? (Etu. 32:18, 19; Va
  Efe. 5:15, 16; 1 Yoa. 2:15-17)\\nEpata lia Lewi lia eca ndati ongangu yiwa koku
  lekisa esunguluko? (Etu. 32:25-28; Osa. 18:25)\"", "\"Ocisungo 70 Lohutililo\\nOlondaka
  Vioku Fetika (ka vi ka pitah\u00e3le akuk. 3)\\nOVOKUASI A SANGIWA VONDAKA YA SUKU\\n\u201cKu
  ka \u2018Lisandele Ovina Vinene\u2019\u201d: (Akuk. 10)\\nYer. 45:2, 3\u2014Ocisim\u0129lo
  ka ca sungulukile Baruki a kuata co kokela esumuo lekavo (jr kem. 104-105 ocin.
  4-6)\\nYer. 45:4, 5a\u2014Yehova wa lungula Baruki locisola (jr kem. 103 ocin. 2)\\nYer.
  45:5b\u2014Baruki omo lioku tiamisila utima kovina via velapo ca teyuila omuenyo
  waye (w16.07 kem. 4 ocin. 6)\\nOku Konomuisa Lutate Ovina vi Sangiwa Vembimbiliya:
  (Akuk. 8)\\nYer. 48:13\u2014Momo lie va Moavi va sukilile \u201coku kuatela Kemosi
  os\u00f5i\u201d? (it-3 kem. 359)\\nYer. 48:42\u2014Momo lie ocitumasuku ca Yehova
  coku ny\u00f5la o Moavi ci pamisila ekolelo lietu? (it-3 kem. 12 ocin. 6)\\nOku
  tangiwa Kuembimbiliya vosemana yilo kua ku longisa nye catiam\u1ebdla ku Yehova?\\nAtosi
  api akuavo wa limbuka voku tangiwa Kuembimbiliya vosemana yilo?\\nOku Tangiwa Kuembimbiliya:
  (ka ku ka pitah\u00e3le akuk. 4) Yer. 47:1-7\\nKAPAKO OLONUMBI EVI KUPANGE WOKU
  KUNDA\\nOmbangulo Yatete: (ka yi ka pitah\u00e3le akuk. 2) hf\u2014Linga epulilo
  limue li ku ecelela oku linga epasu.\\nEpasu: (ka li ka pitah\u00e3le akuk. 4) hf\u2014Linga
  epulilo limue li ku ecelela oku linga epasu likuavo.\\nElilongiso Liembimbiliya:
  (ka li ka pitah\u00e3le akuk. 6) lv kem. 199 ocin. 9-10\u2014Loku teta onimbu lekisa
  kondonge ndomo a linga ekonomuiso kocitangi cimue a kasi oku liyaka laco.\\nEKALO
  LIAKRIST\u00c3O\\nEne Amal\u1ebdhe\u2014Ko ka Lisandeli Ovina Vinene: (Akuk. 15)
  Ku lekisiwe ovideo losapi hati: Amal\u1ebdhe va Pula\u2014Nye Ndi Linga Komuenyo
  Wange?\u2014Oku Ivaluka (kuende ponepa olovideo AMAL\u1ebcHE).\\nElilongiso Liembimbiliya
  Vekongelo: (Akuk. 30) kr kem. 132-133, ocip. 13 ocin. 1-10\\nPitulula Ovina Tua
  Lilongisa Kuenda Lombolola Ovina tu ka Lilongisa Vosemana Yikuavo (Akuk. 3)\\nOcisungo
  17 Lohutililo\"", "\"TALA ndomo Paulu a kasi kalienge loku laviwa lasualali voko
  Roma. Eye omandekua. Kuenda okasi loku kevelela eci soma Kaisare a ko linga. Eci
  a kala vokayike, omanu va enda oku u nyula.\\nNoke yoloneke vitatu eci Paulu a pit\u0129la
  ko Roma, wa tuma oku vilikiya asongui vamue va Yudea. Kuenje va Yudea valua veyavo
  oku u nyula. Paulu wa va kundila eci catiam\u1ebdla ku Yesu kuenda usoma wa Suku.
  Vamue va tava kuenda va linga Akrist\u00e3o, pole vakuavo ka va tavele.\\nHandi
  vali, Paulu wa kundilavo asualali va kala loku u lava. Vokuenda kuanyamo avali a
  kala kumandekua, wa kundila omanu valua. Nda\u00f1o mu\u1ebdle vakuanjo ya Kaisare,
  va yevavo olondaka viwa Viusoma kuenda vamue pokati kavo va linga Akrist\u00e3o.\\nUkombe
  okasi ndeti loku soneha komesa wo k\u0169l\u0129ha? Onduko yaye Timoteo. Timoteo
  wa kalavo vokayike omo lioku kunda olondaka viwa Viusoma, pole noke wa yovuiwa.
  Eye weya oku kuatisa Paulu. Wa k\u0169l\u0129ha eci Timoteo a kasi loku soneha?
  Tu ci konomuisi.\\nIvaluka alupale oko Filipoi la Efeso Kesapulo 110? Paulu wa kuatisa
  oku sovola akongelo Vakrist\u00e3o valupale aco. Osimbu Paulu a kala vokayike, eye
  wa sonehela ovikanda Kuvamanji vaco. Ovikanda viaco vi kasi Vembimbiliya. Vitukuiwa
  hati, Va Efeso kuenda Va Korindo. Paulu o kasi loku sapuila eci Timoteo a sonehela
  Akrist\u00e3o voko Filipoi.\\nAkrist\u00e3o ko Filipoi va tatele Paulu locisola.
  Ovo vo tumisile olombanjaile osimbu a kala vokayike. Paulu o kasi loku eca olopandu
  kokuavo. Epafrodito eye wa ka tualele ombanjaile yaco. Pole, eye wa vela calua kuenda
  wa puluka oku fa. Cilo wa kaya kuenda oka tiukila konjo yaye. Eye okambata ukanda
  wa Paulu la Timoteo kuenda oka vi tuala ko Filipoi.\\nOsimbu Paulu a kala vokayike,
  wa soneha vali ovikanda vivali vi sangiwa Vembimbiliya. Umue wa u sonehela Akrist\u00e3o
  vo lupale luo Kolosai. Wa k\u0169l\u0129ha ndomo u tukuiwa? U tukuiwa hati, Va Kolosai.
  Ukanda ukuavo wa u sonehela umue kamba liaye wa kalavo vo lupale luo Kolosai. Onduko
  yaye Filemone. Vukanda waco wa popia eci catiam\u1ebdla kukuenje wa Filemone, o
  tukuiwa hati Onesimo.\\nOnesimo wa tilile ku Filemone kuenje wa endele ko Roma.
  Onesimo wa k\u0169l\u0129h\u0129le okuti Paulu wa kala vokayike. Paulu wo kundila
  eci eye a endele oku nyula vokayike. Noke Onesimo wa lingavo Ukrist\u00e3o. Eye
  wa sumuile calua omo a tilile. Wa k\u0169l\u0129ha eci Paulu a vangula vukanda a
  sonehela Filemone?\\nPaulu wa pinga ku Filemone oco a ecele Onesimo. Eye wa soneha
  hati: \u2018\u00d1asi loku u tiuwiya kokuove. Pole eye ka kala vali upika wove.
  Eye wa lingavo manji umue Ukrist\u00e3o uwa.\u2019 Eci Onesimo a tiukila ko Kolosai
  wambata ovikanda vivali. Ukanda umue wa tumiwile ku vamanji va Kolosai, ukuavo wa
  tumiwile ku Filemone. Filemone wa sanjukile calua eci a yeva okuti Onesimo upika
  waye wa linga Ukrist\u00e3o!\\nEci Paulu a sonehela va Filipoi kuenda Filemone,
  eye wa va sapuila olondaka viwa. Eye wa popia Kakrist\u00e3o va Filipoi hati: \u2018\u00d1asi
  oku u tumisi Timoteo. Pole ndopo njiya oku u nyuli.\u2019 Ku Filemone wa soneha
  hati: \u2018Njangiliyile ohondo ndikala.\u2019\\nEci Paulu a tunda vokayike, wa
  nyula valua vamanji Akrist\u00e3o ak\u00e3i lalume kovitum\u00e3lo vialua. Noke
  wa kapiwa vali vokayike ko Roma. Eye wa k\u0169l\u0129h\u0129le okuti oka pondiwa.
  Omo liaco, wa sonehela Timoteo kuenda wo vilikiya lonjanga. Paulu wa soneha hati:
  \u2018Suku ukuesunga, kuenda oka ndi sum\u0169l\u0169isa.\u2019 Eci papita anyamo
  amue noke yolofa via Paulu, o Yerusal\u00e3i ya ny\u00f5liwa vali la va Roma.\\nEmbimbiliya
  li tu sapuila ovina vialua. Yehova wa kuatisa upostolo Yoano oku soneha alivulu
  a sulako Embimbiliya oku kongelamo elivulu Liesituluilo. Elivulu eli li sapula eci
  catiam\u1ebdla kovina vikeya. Tu konomuisi eci ci keya kovaso.\\nOvilinga 28:16-31;
  Va Filipoi 1:13; 2:19-30; 4:18-23; Va Heveru 13:23; Filemone 1-25; Va Kolosai 4:7-9;
  2 Timoteo 4:7-9.\\nApulilo\\n- Helie Paulu a kundila osimbu a kala kumandekua ko
  Roma?\\n- Helie ukombe vociluvialuvia o kasi ndeti komesa? Kuenda nye a kasi oku
  lingila Paulu?\\n- Helie wa kala Epafrodito? Kuenda nye eye ambata eci a tiukila
  ko Filipoi?\\n- Momo lie Paulu a tumisilile ukanda ku kamba liaye Filemone?\\n-
  Nye Paulu a linga eci a tunda vokayike? Kuenda noke nye ca pita laye?\\n- Helie
  Yehova a tuma oku soneha elivulu lia sulako Liembimbiliya? Kuenda elivulu Liesituluilo
  li tu sapuila nye?\\nApulilo akuavo\\n- Tanga Ovilinga 28:16-31 kuenda Va Filipoi
  1:13.\\nNye Paulu a linga osimbu a kala kumandekua ko Roma? Kuenda ongangu yipi
  yekolelo eye a sila Akrist\u00e3o vekongelo? (Ovil. 28:23, 30; Va Fil. 1:14)\\n-
  Tanga Va Filipoi 2:19-30.\\nOlondaka vipi violopandu Paulu a sapuila Timoteo la
  Epafrodito? Kuenda tu kuete oku kuama ndati ongangu ya Paulu? (Va Fil. 2:20, 22,
  25, 29, 30; 1 Va Kor. 16:18; 1 Va Tes. 5:12, 13)\\n- Tanga Filemone 1-25.\\nPaulu
  wa tumile Filemone oku linga nye okuti ca sungulukile? Kuenda eci ci kala ndati
  ndonumbi kakulu vekongelo koloneke vilo? (File. 9; 2 Va Kor. 8:8; Va Gal. 5:13)\\nOlondaka
  via Paulu vi sangiwa kelivulu lia Filemone 13, 14 vi lekisa ndati okuti eye wa sumbile
  ovisim\u0129lo via vakuavo vekongelo? (1 Va Kor. 8:7, 13; 10:31-33)\\n- Tanga 2
  Timoteo 4:7-9.\\nEkolelo lie tu kuete ndeli lia Paulu liokuti Yehova oka tu sum\u0169l\u0169isa
  nda tu tua pandikisa toke kesulilo? (Mat. 24:13; Va Hev. 6:10)\"", "\"1, 2. (a)
  Nda wa k\u0169l\u0129ha onduko yomunu umue wa kem\u00e3la ci lomboloka h\u1ebd okuti
  wo k\u0169l\u0129ha ciwa? Ci lombolola. (b) Nye omanu va tava catiam\u1ebdla ku
  Yesu?\\nVOLUALI muli omanu valua va kem\u00e3la. Citava okuti wa k\u0169l\u0129ha
  onduko yomunu umue wa kem\u00e3la. Nda\u00f1o okuti wa k\u0169l\u0129ha onduko yaye,
  pole, ka ci lomboloka okuti wa k\u0169l\u0129ha ciwa omunu waco. Ka ci lombolokavo
  okuti wa k\u0169l\u0129ha ciwa ovina viosi viatiam\u1ebdla komuenyo waye kuenda
  ovituwa viaye.\\n2 Citava okuti wa yevele ale ovina viatiam\u1ebdla ku Yesu Kristu,
  nda\u00f1o okuti tunde eci a kala palo posi pa pita ale 2.000 kanyamo. Pole, omanu
  valua ka va k\u0169l\u0129h\u0129le ovina viatiam\u1ebdla ku Yesu. Vamue va siata
  oku popia vati, wa kala ulume umue uwa, vakuavo vati, wa kala uprofeto, kuenda vamue
  va tava okuti eye Suku. Ove nye o sima?\u2014Tala Etosi 12 kesulilo lielivulu lilo.\\n3.
  Momo lie ci kuetele esilivilo kokuove oku k\u0169l\u0129ha Yehova Suku kuenda Yesu
  Kristu?\\n3 Oku k\u0169l\u0129ha ocili catiam\u1ebdla ku Yesu ci kuete esilivilo
  lia velapo. Momo lie? Embimbiliya li tu sapuila hati: \u201cOmuenyo ko pui wowu,
  oku ku k\u0169l\u0129ha, ove lika vu Suku yocili, loku k\u0169l\u0129havo Yesu Kristu,
  u wa tuma.\u201d (Yoano 17:3) Nda wa k\u0169l\u0129ha ocili catiam\u1ebdla ku Yehova
  kuenda ku Yesu, o pondola oku kala otembo ka yi pui voluali luokaliye palo posi.
  (Yoano 14:6) Nda wa k\u0169l\u0129havo ovina viatiam\u1ebdla ku Yesu, ci ku kuatisa,
  momo eye wa lekisa ongangu yiwa ndomo tu pondola oku kala ciwa lomanu vakuavo kuenda
  oku va tata ciwa. (Yoano 13:34, 35) Kocipama 1, tua lilongisa ocili catiam\u1ebdla
  ku Suku. Cilo, tu konomuisa eci Embimbiliya li longisa catiam\u1ebdla ku Yesu.\\nTUA
  SANGA MESIYA!\\n4. Olondaka viokuti \u201cMesiya\u201d kuenda \u201cKristu\u201d
  vi lomboloka nye?\\n4 Osimbu Yesu ka citiwile, Embimbiliya lia popele hati, Yehova
  wa laikele oku tuma Mesiya ale Kristu. Ondaka \u201cMesiya\u201d ya tunda kelimi
  lio Heveru, kuenda ondaka \u201cKristu,\u201d ya tunda kelimi lio Helasi. Olondaka
  viaco vivali vi lomboloka okuti Suku wa laikele oku n\u00f5la Mesiya wa likuminyiwa,
  kuenda oku eca kokuaye ocikele cimue cilikasi. Mesiya o ka t\u1ebdlisa olohuminyo
  viosi via Suku. Yesu o pondolavo oku ku kuatisa cilo. Pole, osimbu Yesu ka citiwile
  handi, omanu va enda oku lipula vati: \u2018Helie o ka kala Mesiya?\u2019\\n5. Anga
  h\u1ebd olondonge via Yesu via tavele okuti eye Mesiya?\\n5 Olondonge via Yesu ka
  via kuatele atatah\u00e3i okuti, eye Mesiya una wa likuminyiwile. (Yoano 1:41) Simono
  Petulu, wa sapuilile Yesu hati: \u201cOve u Kristu.\u201d (Mateo 16:16) Tu pondola
  oku tava ndati okuti Yesu eye Mesiya?\\n6. Yehova wa kuatisa ndati vakuavitima via
  sunguluka oku limbuka Mesiya?\\n6 Osimbu Yesu ka citiwile, ovaprofeto va Suku va
  soneha ovina vialua via laikele oku kuatisa omanu oco va limbuke Mesiya. Ovina viaco
  via kuatisa ndati? Sokolola ndeci okuti wa tumiwa oku kopilila omunu umue kua k\u0169l\u0129h\u0129le
  pocitum\u00e3lo coku londela vokalela. Nda una wa ku tuma wa ku sapuila ovina viatiam\u1ebdla
  komunu waco, ci ku kuatisa oku u sanga. Cimuamue haico catiam\u1ebdla ku Yehova
  okuti, wa tuma ovaprofeto vaye oco va tu sapuile ovina Mesiya a laikele oku linga,
  kuenda eci ca laikele oku pita laye. Oku t\u1ebdlisiwa kuovitumasuku viaco, ku kuatisa
  omanu vakuavitima via sunguluka oku limbuka okuti Yesu eye Mesiya.\\n7. Ovitumasuku
  vipi vivali vi eca uvangi wokuti Yesu eye Mesiya?\\n7 Cilo tu konomuisa ovitumasuku
  vivali. Catete, eci kua kambele 700 kanyamo oco Yesu a citiwe, uprofeto Mika wa
  popele hati, Mesiya wa laikele oku citiwila vimbo limue litito lio Beteleme. (Mika
  5:2) Kuenje Yesu weya oku citiwila vimbo liaco! (Mateo 2:1, 3-9) Cavali, uprofeto
  Daniele wa popele hati, Mesiya wa laikele oku mol\u1ebdha kunyamo wa 29 K.K. (Daniele
  9:25) Kuli ovitumasuku vialua, pole vivali via tukuiwa ndeti vi eca uvangi wokuti
  Yesu eye Mesiya wa likuminyiwile.\u2014Tala Etosi 13 kesulilo lielivulu lilo.\\n8,
  9. Ovina vipi via pita eci Yesu a papatisiwa via eca uvangi wokuti eye Mesiya?\\n8
  Yehova wa situlula ovina vialua via eca uvangi wokuti, Yesu eye Mesiya. Eye wa likuminyile
  oku eca ku Yoano Upapatisi ondimbukiso yimue ya laikele oku u kuatisa oku limbuka
  Mesiya. Eci Yesu a endele ku Yoano oco a papatisiwe Volui Yord\u00e3o kunyamo wa
  29 K.K., Yoano wa mola ondimbukiso yaco. Embimbiliya li tu sapuila ulandu waco ndoco:
  \u201cNoke yoku papatisiwa, Yesu wa tunda vovava; ilu lia yuluka yu wa mola espiritu
  sandu lia Suku lia loka ndopomba kuenje lio wila. Tala! Kilu kua tunda ondaka yiti:
  \u2018U Om\u00f5lange wa soliwa, ndo sanjukila.\u2019\u201d (Mateo 3:16, 17) Eci
  Yoano a yeva ondaka loku mola ondimbukiso yaco, wa limbuka okuti Yesu eye Mesiya.
  (Yoano 1:32-34) Keteke liaco, Yehova wa waveka espiritu liaye ku Yesu, kuenje wa
  linga Mesiya. Omo liaco, Suku wa n\u00f5la Yesu oco a linge Usongui kuenda Osoma.\u2014Isaya
  55:4.\\n9 Ovitumasuku Viembimbiliya, olondaka via Yehova, kuenda ondimbukiso a ecele
  eci Yesu a papatisiwa, via eca uvangi wokuti, Yesu eye Mesiya. Pole, pi Yesu a tunda,
  kuenda wa kuata ovituwa vipi? Tu konomuisi eci Embimbiliya li popia.\\nPI YESU A
  TUNDA?\\n10. Nye Embimbiliya li tu longisa catiam\u1ebdla komuenyo wa Yesu osimbu
  keyile palo posi?\\n10 Embimbiliya li tu longisa okuti osimbu Yesu keyile palo posi
  wa kala kilu. Uprofeto Mika wa popele hati, Mesiya wa tunda \u201ckosi\u00e3h\u0169lu,
  koloneke viale.\u201d (Mika 5:2) Yesu olonjanja vialua wa enda oku popia hati, wa
  kala kilu osimbu ka citiwile palo posi ndomunu ukuetimba liositu. (Tanga Yoano 3:13;
  6:38, 62; 17:4, 5.) Osimbu Yesu keyile palo posi, wa kuatele ukamba umue ulikasi
  la Yehova.\\n11. Momo lie Yesu a soliwile la Yehova?\\n11 Yesu o soliwe calua la
  Yehova. Momo lie? Momo eye a lulika tete osimbu ka lulikile ovina viosi. Omo liaco,
  Yesu o tukuiwa hati, \u201cuveli woviluvo viosi.\u201d * (Va Kolosai 1:15) Yesu
  o soliwevo la Yehova, momo eye lika wa lulikiwa laye. Eli olio esunga lieci a tukuiwila
  hati, \u201cOm\u00f5laye wongunga.\u201d (Yoano 3:16) Yesu eye lika Yehova a n\u00f5la
  oco o kuatise koku lulika ovina viosi. (Va Kolosai 1:16) Yesu eye lika o tukuiwa
  hati \u201cNdaka,\u201d momo Yehova wa eca kokuaye ocikele coku eca esapulo, olonumbi
  kovangelo kuenda komanu.\\n12. Tua k\u0169l\u0129ha ndati okuti Yehova la Yesu omanu
  vamue va litepa?\\n12 Omanu vamue va tava kelongiso liokuti, Suku la Yesu vamuamue.
  Pole, Embimbiliya ka lilongisa ovina viaco. Omo okuti Embimbiliya li popia hati,
  Yesu wa lulikiwa, ci lekisa okuti wa kuata efetikilo. Pole, Yehova ululiki wovina
  viosi ka kuete efetikilo. (Osamo 90:2) Omo okuti Yesu Om\u00f5la wa Suku, lalimue
  eteke a setekele oku li sokisa la Suku. Embimbiliya lilongisa okuti, Isia wa velapo,
  pole, Om\u00f5la o sule. (Tanga Yoano 14:28; 1 Va Korindo 11:3.) Omo liaco, Yehova
  eye lika \u201cUkuonene wosi.\u201d (Efetikilo 17:1) Yehova wa velapo, kuenda eye
  ukuonene voluali luosi.\u2014Tala Etosi 14 kesulilo lielivulu lilo.\\n13. Momo lie
  Embimbiliya li popela okuti Yesu eye \u201cesetah\u00e3lo lia Suku una ka muiwa
  lovaso\u201d?\\n13 Yehova kumue Lom\u00f5laye Yesu va lingila kumosi ovopange vokuenda
  kuanyamo alua osimbu ilu longongo ka via lulikiwile handi. Ovo va li kuatela ocisola
  pokati! (Yoano 3:35; 14:31) Omo okuti Yesu wa setukula ciwa ovituwa via Isiaye,
  Embimbiliya liu tukula hati: \u201cEsetah\u00e3lo lia Suku una ka muiwa lovaso.\u201d\u2014Va
  Kolosai 1:15.\\n14. Om\u00f5la o soliwe wa Yehova wa citiwa ndati ndomunu ukuetimba
  liositu?\\n14 Om\u00f5la o soliwe wa Yehova wa lekisa onjongole yoku tunda kilu
  oco a citiwile palo posi ndomunu ukuetimba liositu. Ca lingiwa ndati? Yehova wa
  linga ocikomo coku sondolola omuenyo Wom\u00f5laye kilu, kuenje wa kapiwa vimo liufeko
  umue o tukuiwa hati Maria. Kuenje Yesu ka kuatele isia umue ukuetimba liositu. Omo
  liaco, Maria wa cita om\u00f5la umue wa lipua, kuenje wo luka onduko yokuti Yesu.\u2014Luka
  1:30-35.\\nYESU WA KUATA OVITUWA VIPI?\\n15. O pondola oku k\u0169l\u0129ha ndati
  ciwa Yehova?\\n15 O pondola oku lilongisa ovina vialua viatiam\u1ebdla ku Yesu,
  komuenyo waye, kuenda kovituwa viaye poku tanga Embimbiliya oku upisa kelivulu lia
  Mateo, lia Marko, lia Luka, kuenda lia Yoano. Alivulu aco a tukuiwa hati Avanjeliu.
  Omo okuti Yesu o kasi nda Isiaye, ovina o tanga vi ku kuatisavo oku k\u0169l\u0129ha
  ciwa Yehova. Eli olio esunga lieci Yesu a popela hati: \u201cWosi o mola ame, o
  molavo Isia.\u201d\\n16. Nye Yesu a longisa? Ovina a longisa pi via tunda?\\n16
  Omanu valua va siata oku tukula Yesu vati, \u201cUlongisi.\u201d (Yoano 1:38; 13:13)
  Pokati kovina vimue vi kuete esilivilo lia velapo Yesu a longisa, \u201colondaka
  viwa Viusoma.\u201d Usoma waco u lomboloka nye? U lomboloka uviali wa Suku u ka
  viala oluali luosi oku upisa kilu, kuenje u ka nenela asum\u0169l\u0169ho komanu
  vana va pokola ku Suku. (Mateo 4:23) Ovina Yesu a longisa via tunda ku Yehova. Omo
  liaco, Yesu wa popia hati: \u201cEci ndi longisa hacangeko, pu\u00e3i cu wa numa.\u201d
  (Yoano 7:16) Yesu wa k\u0169l\u0129h\u0129le okuti Yehova o yongola okuti, omanu
  vosi va yeva olondaka viwa viatiam\u1ebdla Kusoma Waye una u ka viala oluali luosi.\\n17.
  Pi Yesu a enda oku longisila? Momo lie a endela oku likolisilako calua oco a longise
  omanu?\\n17 Pi Yesu a enda oku longisila? Povitum\u00e3lo viosi a enda oku sanga
  omanu. Eye wa longisa vovaimbo, valupale, povitanda, povitum\u00e3lo viefendelo,
  kuenda volonjo. Yesu ka kuatele ocituwa coku kevelela okuti omanu veya kokuaye.
  Pole, wa enda oku va sandiliya. (Marko 6:56; Luka 19:5, 6) Yesu wa likolisilako
  oku pesila otembo yalua kupange woku longisa omanu. Momo lie? Momo, wa k\u0169l\u0129h\u0129le
  okuti Suku o yongola okuti o linga upange waco, kuenda olonjanja viosi wa lekisa
  epokolo ku Isiaye. (Yoano 8:28, 29) Yesu wa kundilavo omanu omo liohenda a va kuatela.
  (Tanga Mateo 9:35, 36.) Eye wa limbukile okuti asongui vatavo esanda ka va longasaile
  ocili catiam\u1ebdla ku Suku, kuenda Kusoma waye. Omo liaco, wa yonguile oku kuatisa
  omanu valua oco va yeve olondaka viwa.\\n18. Ovituwa vipi via Yesu o sole calua?\\n18
  Yesu wa kala ulume umue wa solele calua omanu kuenda wa enda oku va tata ciwa. Eye
  wa kala omunu umue wa sunguluka okuti ca lelukile oku sapela laye. Om\u00e3la va
  solelevo oku kala laye. (Marko 10:13-16) Yesu wa lekisile esunguluko komanu vosi.
  Eye ka solaile ovitukiko, kuenda ekambo liesunga. (Mateo 21:12, 13) Eci Yesu a kala
  palo posi, ak\u00e3i ka va kuatele omoko yoku kuata ovikele vimue, kuenda ka va
  sumbiwile. Pole, eye wa enda oku va tata ciwa kuenda wa lekisa esumbilo kokuavo.
  (Yoano 4:9, 27) Yesu wa enda oku lekisavo umbombe. Eteke limue ko\u00f1olosi wa
  sukula kolom\u00e3hi viovapostolo vaye okuti, upange waco wa enda oku lingiwa lika
  lapika.\\n19. Ovolandu api a lekisa okuti Yesu wa k\u0169l\u0129h\u0129le ovina
  omanu va sukilile? Wa va kuatisa ndati?\\n19 Yesu wa k\u0169l\u0129h\u0129le ovina
  omanu va sukilile kuenda wa yonguile oku va kuatisa. Ovina viaco via limbukiwa eci
  a kuatisiwa lunene wa Suku poku linga ovikomo vioku sakula omanu. (Mateo 14:14)
  Eteke limue ulume umue ukuavilundu wa endele ku Yesu kuenje wa popia hati: \u201cNda
  wa panga, \u00f1ayise.\u201d Evalo ulume waco a kuata kuenda ohali a tala via vetiya
  Yesu oku u kuatisa. Kuenje, wa lekisa ohenda kokuaye, kuenda wa yonguile oku u kuatisa.
  Omo liaco, Yesu wol\u00f5la eka liaye, wo lamba, kuenje wo sapuila hati: \u201cNda
  panga! Kaya.\u201d Noke ulume waco wa sakuiwa! (Marko 1:40-42) O pondola h\u1ebd
  oku sokolola esanju ulume waco a kuata?\\nOLONJANJA VIOSI WA LEKISA EKOLELO KU ISIAYE\\n20,
  21. Yesu wa lekisa ndati ongangu yiwa yoku pokola ku Suku?\\n20 Yesu wa lekisa ongangu
  yiwa yoku pokola ku Suku. Nda\u00f1o okuti wa liyaka lovitangi vialua, ale ovany\u00e3li
  vaye vo linga ovina ka via sungulukile, pole wamamako oku lekisa ekolelo ku Isiaye.
  Yesu ka lueyele eci Satana a seteka oku u yapuisa. (Mateo 4:1-11) Omo okuti vamue
  pokati kepata lia Yesu ka va tavele okuti wa kala Mesiya, va enda oku popia vati
  \u201cwa linga eyui,\u201d pole Yesu wamamako oku linga upange wa Suku. (Marko 3:21)
  Eci ovany\u00e3li va linga ku Yesu ovina ka via sungulukile, eye wamamako lekolelo
  ku Suku, kuenda lalimue eteke a setekele oku va linga cimue c\u0129vi.\\n21 Nda\u00f1o
  ceci Yesu a talisiwa ohali yalua toke kolofa, pole wamamako oku lekisa ekolelo ku
  Yehova. (Tanga Va Filipoi 2:8.) Sokolola epandi a lekisa keteke a fa. Yesu wa ambatiwa,
  olombangi viesanda vio lundila ovina ka lingile, wa pisiwa lolonganji vakuambambe,
  wa yoliwa epembe, wa tipuiwa lasualali, kuenda wa valeliwa kuti. Eci a kala oku
  fa wa kaluka hati: \u201cCa t\u1ebdlisiwa!\u201d (Yoano 19:30) Eci pa pita oloneke
  vitatu tunde eci a fa, Yehova wo pindula, kuenje wo w\u0129ha etimba liespiritu.
  (1 Petulu 3:18) Eci pa pita olosemana vimue Yesu wa tiukila kilu, kuenje \u201cwa
  tum\u00e3la kondio ya Suku,\u201d kuna a kevelela toke eci a vialekiwa komangu Yusoma.\\n22.
  Omo okuti Yesu wa lekisa ekolelo ku Isiaye, epuluvi lipi tu kuete cilo?\\n22 Omo
  okuti Yesu wamamako oku lekisa ekolelo ku Isiaye, tu kuetevo epuluvi lioku kuata
  omuenyo otembo ka yi pui voluali luokaliye palo posi, ndomo Yehova a ci likuminya.
  Vocipama ci ku\u00e3imo, tu ka konomuisa ndomo olofa via Yesu vi pondola oku t\u1ebdlisa
  ovina viaco oco tu kale komuenyo otembo ka yi pui.\\n^ tini. 11 Yehova o tukuiwa
  hati Isia, momo eye Ululiki. (Isaya 64:8) Yesu o tukuiwa hati, Om\u00f5la wa Yehova
  Suku momo wa lulikiwa laye. Ovangelo kumue la Adama va tukuiwavo vati, om\u00e3la
  va Suku.\u2014Yovi 1:6; Luka 3:38.\"", "\"Ceci o sukila oku linga\\nSokolola ndoco:
  Anga h\u1ebd, ovina wa siata oku linga vi vetiya olonjali viove oku ku kolela?\\nUpostolo
  Paulu wa soneha ndoco: \u201cTu likolisilako oku kala vakuacili kovina viosi.\\n\u201d
  (Va Heveru 13:18) Li pula ndoco: \u2018Anga h\u1ebd nda siata oku vangula ocili
  kolonjali viange, poku va sapuila ocitum\u00e3lo ngenda kuenda ovina ndi linga?\u2019\\nN\u00f5la
  onduko yimue ya lekisiwa pombuelo oco o lilongise kulandu waco.\\nLori Okuti okuete
  20 kanyamo Beverly Okuti okuete 15 kanyamo\\nLori\\n\u201cNda enda oku tumisa esapulo
  vuyombeki kukuenje umue nda solele. Eci olonjali viange via ci limbuka via ndi sapuila
  oco ndi liwekepo. Nda likuminya oku ci linga pole, sia ci lingile. Nda ci linga
  vokuenda kunyamo umosi. Nda enda oku u tumisa asapulo, olonjali viange via ci limbuka,
  nda pinga ongecelo loku likuminya oku liwekapo oku ci linga, pole nda amamako locituwa
  caco. Ovina viaco via amamako, kuenje olonjali viange ka via ndi kolelele vali!\\n\u201d\\nMomo
  lie o sim\u0129la okuti olonjali via Lori ka via kolelele vali kokuaye?\\nNda ove
  wa kalele olonjali via Lori, nye nda wa linga, kuenda momo lie?\\nLori nda wa lekisa
  ndati okuti ukualondunge eci olonjali via sapela laye onjanja yatete?\\nBeverly\\n\u201cOlonjali
  viange ka via ndi kolelele vali eci ndaenda oku va sapuila catiam\u1ebdla kakuenje,
  pole nda limbuka esunga liaco. Ndaenda oku linga ocitiokoso lakuenje vavali, okuti
  va kala akulu vange ci soka anyamo avali. Handi vali, ndaenda oku sapela lavo vo
  telefone olowola vialua, kuenda kovipito ndaenda oku sapela lika lakuenje vaco.
  Olonjali viange via ndi tambula o telefone vokuenda kuos\u00e3i yimosi kuenda ka
  va tavele okuti ndi kala kovitum\u00e3lo vina okuti akuenje vaco oko va kasi.\\n\u201d\\nNda
  wa kaile onjali ya Beverly, nye nda wa linga kuenda momo lie?\\nO sima h\u1ebd okuti
  olonjali via Beverly via tumbika ovihandeleko vialua kokuaye? Nda oco, momo lie?\\nNye
  Beverly a sukilile oku linga oco a koleliwe lolonjali viaye?\\nCeci o sukila oku
  linga oco o koleliwe vali\\nCeci o sukila oku linga\\nCatete, k\u0169l\u0129hisa
  ovina via koka okuti olonjali viove ka vi ku kolela vali.\\nOku tiukila konjo vowola
  ya sokiyiwa\\nOku t\u1ebdlisa olohuminyo viange\\nOku pit\u0129la vowola ya sokiyiwa\\nOku
  lekisa olondunge poku talavaya lolombongo\\nOku malusula ovopange\\nOku tunda pula
  okuti ka ci sukila oku ndi sakalaisa\\nOku yelisa ohondo yange\\nOku vangula ocili\\nOku
  talavaya lotelefone ale lo kombutador lonjila yimue ya sunguluka\\nOku tava okuti
  wa lueya kuenda oku pinga ongecelo\\nOvina vikuavo\\nCavali, n\u00f5lapo oku linga
  apongoloko. Kuata ocim\u00e3ho coku lekisa okuti wa koleliwa poku t\u1ebdlisa ovina
  wa n\u00f5la. Kuama onumbi Yembimbiliya yokuti: \u2018Luli omunu wosimbu, una wa
  tiam\u1ebdla kovituwa viene viosimbu.\\n\u2019 (Va Efeso 4:22) Vokuenda kuotembo
  oku kula kuove ku ka limbukiwa lomanu vakuavo oku kongelamo olonjali viove.\u20141
  Timoteo 4:15.\\nCatatu, sapela lolonjali viove ovina o yongola oku t\u1ebdlisa.
  Ku ka kisike okuti ovo va sukila oku kolela kokuove, pole lekisa esumbilo poku pula
  ocisim\u0129lo cavo catiam\u1ebdla kueci o sukila oku linga oco va ku kolele.\\nKuata
  utate: Ku ka lavoke okuti olonjali viove vi tava lonjanga. Ocili okuti, ovo va sukila
  oku k\u0169l\u0129ha nda o ka t\u1ebdlisa ovina wa likuminya. Kuama epuluvi liaco
  oco o lekise okuti wa koleliwa. Vokuenda kuotembo, citava okuti olonjali viove,
  vi ka kolela kokuove kuenda o ka kuata elianjo lialua. Eci oco ca pita la Beverly,
  wa tukuiwa kefetikilo. Eye wa popia hati: \u201cOku ny\u00f5la ekolelo olonjali
  va ku kuetele ca leluka, pole ka ca lelukile oku li tumbulula. Oloneke viosi ekolelo
  olonjali viange vi ndi kuetele li kasi oku li vokiya, kuenje ci ndi sanjuisa calua!\u201d\\nOku
  malusula: Nda olonjanja viosi wa koleliwa, ci tava okuti olonjali viove vi ka ku
  kolelavo.\"", "\"Etu tua sanjuka omo lioku kuatisa omanu vana va kuete onjongole
  yoku lilongisa Embimbiliya ale kupange wetu u kasi oku lingiwa koluali luosi. Kuama
  olonumbi vi ku\u00e3imo oco o sandiliye olombangi via Yehova kocitum\u00e3lo o kasi.\\nPinga
  elilongiso limue Liembimbiliya li lingiwa ocali\\nSandiliya Onjango yimue Yusoma
  Yolombangi Via Yehova\\nSandiliya eteke kuenda ocitum\u00e3o cohongele yocipito
  coku ivaluka olofa via Yesu ci lingiwa unyamo lunyamo\\nSandiliya ocitum\u00e3lo
  ku lingiwila ohongele yofeka Yolombangi Via Yehova\\nSandiliya vimue pokati kolofiliale
  vietu\\nTu telefonalele ale tu sonehele poku kuama onumbi yi sangiwa pombuelo\\nBelgium\\nEkongelo
  Liakrist\u00e3o lio Lombangi Via Yehova\\nrue d\u2019Argile-Potaardestraat 60\\nKO
  KRAAINEM B-1950\\nKO BELGIKA\\n+32 2-782-00-15\\nAlivala oku Nyula\\nSengunda Toke
  Vot\u00e3lo\\nKom\u1ebdle oku upisa kelivala 8:00 toke 12:00 kuenda kekumbi oku
  upisa kelivala 1:00 toke 5:00\"", "\"OVIPAMA VIA PITA, via lekisa okuti ovitangi
  vialua komuenyo, vi pondola oku koka okuti ka ci leluka oku pandikisa. Osimbu o
  pandikisa kovitangi viove, citava okuti o lipula nda omuenyo u kuete esilivilo ale
  nda kuli omunu umue wa ku kapako. Kolela okuti Suku o ku kuatisa oku liyaka lovitangi
  viove. Ove o kuete esilivilo kokuaye.\\nUsonehi Wosamo 86, wa situlula ekolelo a
  kuatele ku Suku poku popia hati: \u201cEteke liohali yange hu vilikiya momo o nambulula.\u201d
  (Osamo 86:7) O pondola oku lipula ndoco: \u2018Suku o ka nambulula ndati eci \u201cndi
  tala ohali?\u201d\u2019\\nNda\u00f1o Suku ka maliko ovitangi viove vonjanja yimosi,
  Embimbiliya li lekisa okuti eye o ku \u0129ha ombembua yovutima, oco yi ku kuatise
  oku pandikisa. Olio liti: \u201cKo ka sakalali locina cimue, pole, kovina viosi
  lolohutililo kuenda alombelo kumue lolopandu, apingilo ene a k\u0169l\u0129h\u0129we
  la Suku; kuenje ombembua ya Suku yina ya pi\u00e3la olondunge viosi, yi lava ovitima
  viene kuenda ovisim\u0129lo viene vu Kristu Yesu.\u201d (Va Filipoi 4:6, 7) Kul\u0129h\u0129sa
  ndomo ovinimbu Viembimbiliya viku\u00e3imo vi ku vetiya oku kolela okuti Suku o
  ku kuatisa.\\nSuku wa ku kapako\\n\u201cLayimue [Ongungu] yi ivaliwa la Suku. .
  . . Ene wa velipo okuti olongungu vialua vi sule.\u201d\u2014Luka 12:6, 7, petosi\\nK\u0168L\u0128H\u0128SA:
  Olongungu vi m\u00f5leha okuti ka vi kuete esilivilo, pole, Yehova o vi tata. Omanu
  va kuete esilivilo lialua kovaso a Suku okuti olongungu vi sule. Omanu ovo oviluvo
  via Suku vi kuete esilivilo lialua palo posi momo, va lulikiwa \u201clesetah\u00e3lo\u201d
  liaye kuenda va pondola oku kuata loku lekisa ovituwa vi kom\u00f5h\u0129sa via
  Suku.\u2014Efetikilo 1:26, 27.\\n\u201cA Yehova, ove wa \u00f1ul\u0129hisa, wa \u00f1uliha
  mu\u1ebdle. . . . Wa limbuka ovisimilo viange tunde kup\u00e3la. . . . \u00d1ul\u0129hise,
  a Suku. K\u0169l\u0129ha utima wange. Seteke. K\u0169l\u0129ha ovisim\u0129lo viange.\u2014Osamo
  139:1, 2, 23.\\nK\u0168L\u0128H\u0128SA: Suku wa ku k\u0169l\u0129ha ciwa. Eye wa
  k\u0169l\u0129ha ovisim\u0129lo viove kuenda asakalalo. Citava okuti omanu ka va
  kuata elomboloko liovitangi kuenda asakalalo wa siata oku liyaka lavio, pole, Suku
  o ku tata kuenda o yongola oku ku kuatisa. Omo liaco, omuenyo wove u kuete esilivilo.\\nOmuenyo
  Wove u kuete Esilivilo\\n\u201cYeva ohutililo yange, a Yehova. Uteto wange u pitile
  kokuove. . . . Mbonguile etui liove. Eteke mbilikiya nambulule lombili. . . . O
  yeva ohutililo yolosuke.\u201d\u2014Osamo 102:1, 2, 17.\\nK\u0168L\u0128H\u0128SA:
  Tunde kefekilo Yehova o lete asu\u1ebdlela osi omanu va siata oku lolula omo liohali.
  (Osamo 56:8) Mua kongela asuelela ove. Suku ivaluka ovitangi viosi wa siata oku
  liyaka lavio kuenda asu\u1ebdlela ove, momo o kuete esilivilo kokuaye.\\n\u201cKu
  ka yokoke, momo ndi Suku yove! Ame hu kolisa, hu kuatisa. . . . Momo ame Yehova,
  Suku yove. . . . Ame mu\u1ebdle mopia love siti, \u2018Ku ka kuate usumba, hu kuatisa.\u2019\u201d\u2014Isaya
  41:10, 13.\\nK\u0168L\u0128H\u0128SA: Suku o pondola oku ku kuatisa. Nda wa kupuka,
  eye o ku votola.\\nKuli Elavoko Liwa Lio Kovaso Yoloneke\\n\u201cOmo Suku a sola
  calua oluali, wa eca Om\u00f5laye wongunga, okuti wosi o kolela kokuaye ka ny\u00f5liwa,
  o kuata omuenyo ko pui.\u201d \u2014Yoano 3:16.\\nK\u0168L\u0128H\u0128SA: Ove o
  soliwe calua la Suku okuti wa e ca Om\u00f5laye, Yesu, ndocilumba kokuove. Ocilumba
  caco ca ecelela okuti o kuata omuenyo umue wesanju otembo ka yi pui. a\\nNda o kasi
  oku liyaka lovitangi vialua kuenda omuenyo wove u mol\u1ebdha ndu okuti ka u kuete
  esilivilo, lilongisa Embimbiliya kuenda pamisa ekolelo liove kelavoko liolohuminyo
  via Suku. Eci ci ka ku kuatisa oku kuata esanju komuenyo kuenda oku kolela okuti
  omuenyo u kuete esilivilo.\\na Oco o lilongise ovina vikuavo viatiam\u1ebdla konjila
  ndomo o kuatisiwa locilumba ca Yesu, tala ovideo losapi hati: https://www.jw.org/umb/olombangi-via-yehova/onjivaluko/ocipito-conjivaluko-violofa-via-yesu/Onjivaluko
  Yolofa Via Yesu, yi sangiwa vo www.jw.org. Tala ponepa KOKUETU > ONJIVALUKO.\"",
  "\"Anga Suku eye wa siata oku nena ohali voluali?\\nUsuanji upi wa pita vocumbo
  ce Edene?\\nSuku oka m\u00e3lako ndati ohali yomanu?\\nKOFEKA yimue kua pita uyaki,
  kuenje kua pondiwa olohuluwa vialua viomanu. Omanu vaco vana okuti ka va kaile asual\u00e3li,
  ndeci ak\u00e3i lom\u00e3la. Omanu vaco vosi va kendiwa veyambo limosi linene. Keyambo
  liaco va \u00f1ualisileko olondimbukiso. Kondimbukiso londimbukiso va soneheleko
  hati: \u201cMomo lie?\u201d Eci oco omanu va siata oku lipula eci uyaki, ocisalu,
  oku vela ale ungangala u ponda vangandiavo, u ny\u00f5la olonjo viavo kuenda eci
  u va kokela ovitangi vikuavo. Ovo va yongola oku k\u0169l\u0129ha esunga lieci olohali
  viaco via va vetela.\\n2 Momo lie Suku a kasi oku ecelela ohali? Yehova Suku ukuonenewosi,
  ukuacisola, ukuolo\u00f1o, haeye ukuesunga. Oco h\u1ebd, momo lie voluali mueyukila
  onya leci ka ca sungulukile? Wa lipulile ale kovina via soka ndevi?\\n3 Ca sunguluka
  h\u1ebd oku pula esunga lieci Suku a kasi oku ecelela ohali? Vamue va kala lohele
  yoku linga epulilo liaco. Momo va sima okuti, nda va linga epulilo liaco, ci lekisa
  okuti ekolelo liavo litito, ale ci lekisa etombo ku Suku. Pole, nda wa tanga Embimbiliya
  oka limbuka okuti omanu va sumbile Suku kosimbu, va lingilevo apulilo a soka nda-a.
  Ndeci uprofeto Havakuki wa pulile Yehova hati: \u201cO ndekisila nye ev\u0129ho?
  O mbanjisila nye ahuku? Momo ndete okuny\u00f5la lokupunda. Ema lia wenguka. Okuyaka
  kua katuka.\u201d\u2014Havakuki 1:3.\\n4 Anga Yehova wa kelohaila uprofeto Havakuki
  omo a linga apulilo aco? Sio, ko kelohailele. Handi wo tuma oku soneha apulilo aco
  Vembimbiliya. Suku wo kuatisavo oku kuata vali elomboloko kuenda wa pamisa ekolelo
  liaye. Yehova o yongolavo oku ku kuatisa konepa eyi. Ivaluka okuti Embimbiliya li
  popia hati, C\u201c[Suku] o vu lava.\u201d (1 Petulu 5:7) Suku o nyale vali enene
  ungangala kuenda ohali yosi ya siata oku iyililako okuti etu tumanu ci sule. (Isaya
  55:8, 9) Oco h\u1ebd nye voluali mueyukila ohali yakahandangala?\\nNYE KU KASILILI
  OHALI YALUA?\\n5 Omanu vakuatavo amue va siata oku enda kasongui kuenda kalongisi
  vatavo avo oku pula esunga lieci ku kasilili ohali yalua. Olonjanja vialua asongui
  vaco va tambulula hati, Suku eye wa panga okuti ku kala ohali. Vamue va tambulula
  hati, Suku wa sokiya ale tunde osimbu ndomo ovina viosi vi lingiwa nda\u00f1o mu\u1ebdle
  ovina v\u0129vi. Vakuavo va popia hati, olonjila via Suku ka vi k\u0169l\u00e3haisua.
  Ale va popia hati, Suku ambata omuenyo womanu lom\u00e3la oco a kale lavo kilu.
  Pole, ndomo wa lilongisa ale, Yehova Suku lalimue eteke a kokele eci c\u0129vi.
  Embimbiliya li popia hati: \u201cCi kale kup\u00e3la la T\u00f5lo oku limba kakandu
  [ale koku linga eci ka ca sungulukile].\u201d\u2014Yovi 34:10.\\n6 Wa k\u0169l\u0129ha
  esunga lieci omanu va siatela oku kapa ekandu Suku loku sima okuti eye o kasi oku
  koka ohali voluali? Olonjanja vialua, va ci lingila omo okuti ovo va sima hati Suku
  Ukuonenewosi, eye o kasi oku viala oluali lulo. Ovo ka va k\u0169l\u0129h\u0129le
  ocili ci sangiwa Vembimbiliya catiam\u1ebdla kondaka eyi. Ove wa lilongisa ocili
  caco Vocipama catatu celivulu lilo. U o kasi oku viala oluali lulo Satana Eliapu.\\n7
  Embimbiliya li popia hati: \u2018Oluali luosi lu kasi povaka eliapu.\u2019 (1 Yoano
  5:19) Eci o sokolola ondaka eyi, ku limbuka okuti eci ocili? Oluali lulo lua siata
  oku mol\u1ebdhisa ovituwa vimue vi lekisa okuti kuli umue ukuev\u0129ho o kasi \u201coku
  kemba oluali luosi.\u201d (Esituluilo 12:9) Satana ukuanya, ohembi, haeye ongangala.
  Eli olio esunga lieci oluali lu kasi oku vialiwa laye lueyukila onya, uhembi lungangala.
  Oco ku kasilili ndeti ohali yalua.\\n8 Esunga liavali lieci ku kasilili ohali, lia
  lomboluiwa Vocipama catatu celivulu lilo. Esunga liaco lieli okuti tunde eci Adama
  la Heva va linga ekandu, omanu vosi va linga vakuakandu. Omanu vakuakandu va sole
  calua oku liyakela oku viala. Kuenje ci nena uyaki kuenda ohali pokati komanu. (Ukundi
  4:1; 8:9) Ocina catatu ca siata oku nena ohali pokati komanu, cina ca tukuiwa Vembimbiliya
  hati, \u201cciya \u00f1o, ci veta \u00f1o.\u201d (Ukundi 9:11) Omo okuti Yehova
  hayeko o kasi oku viala oluali oco a lu teyuile, omanu pamue va tala ohali omo va
  kala pocitum\u00e3lo cimue ka ca sungulukile kowola yimue ka ya sungulukile.\\n9
  Ci tu lembeleka calua oku k\u0169l\u0129ha okuti Suku hayeko wa siata oku nena ohali.
  Eye hayeko wa siata oku nena uyaki, ungangala, \u0169vi kuenda ovilemawe via siata
  oku kokela omanu ohali. Pole, lopo tu sukila oku k\u0169l\u0129ha esunga lieci Yehova
  a kasi oku ecelela ohali. Omo okuti eye Ukuonenewosi, okuete unene woku tutuiya
  \u0169vi waco. Nye h\u1ebd ka ci lingila? Suku ukuacisola. Omo liaco, o kuete esunga
  lieci a kasi oku ci lingila.\u20141 Yoano 4:8.\\nKUA LINGIWA USUANJI\\n10 Oco tu
  sange esunga lieci Suku a kasi oku ecelela ohali, tu sukila oku sokolola konyima
  oku kua fetikila ohali. Eci Satana a yonja Adama la Heva oco va lueyele Yehova,
  eye wa linga usuanji. Satana ka kapele vatatah\u00e3i unene wa Yehova. Momo eye
  wa k\u0169l\u0129ha okuti unene wa Yehova ka u sokisiwa. Pole, wa kapa vatatah\u00e3i
  omoko ya Yehova yoku viala, poku lundila Suku okuti ohembi, kuenda o kasi oku limbika
  cimue ciwa komanu. Satana wa kala loku lekisa okuti Yehova ombiali y\u0129vi. (Efetikilo
  3:2-5) Satana wa sosuiya omanu okuti ovo va kala vali ciwa nda ka va vialiwile la
  Suku. Eci ca kala elaviso komoko ya Yehova yoku viala.\\n11 Adama la Heva va lekisa
  esino ku Yehova. Ca kala ndu okuti ovo va popia hati: \u201cKa tu sukila vali oku
  vialiwa la Yehova. Etu mu\u1ebdle tu li n\u00f5lela eci ciwa leci c\u0129vi.\u201d
  Oco h\u1ebd, Yehova nda wa tetulula ndati ocitangi caco? Eye nda wa lekisa ndati
  kovilulikilo viaye vi kuete olondunge okuti eci ovisuanji via linga c\u0129vi? Kuenda
  nda wa lekisavo ndati okuti oku viala kuaye oko kuwa? Umue pamue o popia okuti Suku
  nda wa ny\u00f5lele ovisuanji vonjanja yaco. Kuenje nda wa sovuile omanu vakuavo.
  Pole, Yehova ocipango caye ca kala okuti oluali lu yuka locitumbulukila ca Adama
  la Heva. Kuenda wa yonguilevo okuti va kala lelau kulo kilu lieve. (Efetikilo 1:28)
  Yehova otembo yosi o t\u1ebdlisa ocipango caye. (Isaya 55:10, 11) Oku ny\u00f5la
  ovisuanji vonjanja yaco, nda ka ca ecele etambululo katatah\u00e3i a votuiwa atiam\u1ebdla
  komoko ya Yehova yoku viala.\\n12 Konomuisa ocindekaise cimue. Sokolola okuti ulongisi
  umue o kasi oku lekisa kolondonge viaye ndomo a tetulula ocitangi cimue cat\u0129la.
  Pole, ondonge yimue ya nyanga haiyo ya huka, yi popia okuti onjila ulongisi a kasi
  oku kuama hayoko. Ondonge yaco yeca ocisim\u0129lo cokuti ulongisi ka t\u1ebdla
  oku tetulula ocitangi caco. Kuenje ondonge ya huka yi tamal\u00e3la loku popia okuti
  ya k\u0169l\u0129ha onjila yiwa yoku tetulula ocitangi caco. Vamue pokati kolondonge,
  va fetika oku sima okuti kamba liavo o kasi oku popia ocili. Kuenje va fetikavo
  oku huka. Oco h\u1ebd, ulongisi nda wa tetulula ndati ekatanga liaco? Nda okuti
  eye wa va tundisilile posamua, olondonge vikuavo nda via sima nye? Nda ka via sim\u0129le
  h\u1ebd okuti kamba liavo la vana va likongela kokuaye va kuete esunga? Olondonge
  viosi nda ka via sumbilile vali ulongisi. Nda via sima okuti ulongisi o kuete ohele
  yokuti ondonge yaco yika lekisa oku lueya kuaye. Nda ca sunguluka vali nda ulongisi
  wa ecelela okuti cimbuahuku o lekisa kolondonge vikuavo ndomo eye a tetulula ocitangi
  caco.\\n13 Yehova wa lingavo cimue ca soka ndeci ulongisi a linga ndeti. Ivaluka
  okuti vocumbo Cedene ka mua kaile lika ovisuanji. Olohuluwa viovangelo via m\u00f5lavo
  eci ca pitamo. (Yovi 38:7; Daniele 7:10) Onjila Yehova nda a kuama yoku tetulula
  usuanji wa lingiwa, nda yeya oku kuatisa ovangelo kuenda omanu. Oco h\u1ebd, nye
  Yehova a linga? Eye wa ecelela okuti Satana o lekisa ndomo eye a viala omanu. Suku
  wa ecelela okuti omanu va liviala ovo mu\u1ebdle lekuatiso lia Satana.\\n14 Ulongisi
  wo vocindekaise ca lekisiwa konano, wa k\u0169l\u0129h\u0129le okuti ndonge una
  wa huka kumosi la vana va likongela kokuaye ka va kuatele esunga. Pole, wa va \u0129ha
  epuluvi lioku lekisa nda onjila yavo yoku tetulula ocitangi caco yika kuatisa olondonge
  viosi. Olondonge vina okuti vakuacili, eci via mola okuti olondonge vina via huka
  ka via ci t\u1ebdlele, vieya oku limbuka okuti ulongisi eye lika o t\u1ebdla oku
  va songuila ciwa. Noke, ceya oku va lomboloka ciwa esunga lieci ulongisi ka tundisilile
  ovimbuahuku posamua. Cimuamue haico Yehova a linga. Eye wa k\u0169l\u0129h\u0129le
  okuti ovangelo lomanu vosi vakuesunga, vaka kuatisiwa poku mola okuti Satana lava
  va likongela kokuaye ka va t\u1ebdlele oku nena ekalo liwa. Kuenda vaka limbukavo
  okuti omanu ka va t\u1ebdla oku liviala ovo mu\u1ebdle. Ovo veya oku limbuka okuti
  eci Yeremiya a popele ocili mu\u1ebdle, poku popia hati: \u201cA Yehova, ndi ci
  okuti okuenda kuomunu ka ku kasi povaka aye mu\u1ebdle. Omunu enda ka t\u1ebdla
  eye mu\u1ebdle oku su\u00f1amisa okuenda kuaye.\u201d\u2014Yeremiya 10:23.\\nMOMO
  LIE OHALI YI KASILILI OTEMBO YALUA?\\n15 Oco h\u1ebd, nye Yehova a kasi oku ecelelela
  ohali otembo yakahandangala? Kuenda momo lie Suku ka tatekela okuti ovina v\u0129vi
  ka viya kokuetu? Tu konomuisi ovina vivali ulongisi wo vocindekaise ca tukuiwa konano
  ka lingile. Catete, eye ka tatekele ondonge ya huka oku lekisa esunga liaye. Cavali,
  ulongisi ka kuatisile ondonge ya huka oku lekisa esunga liaye. Cimuamue haico Yehova
  a linga. Kulivo ovina vivali eye ka lingile. Catete, eye ka tatekele Satana lava
  va likongela kokuaye oku lekisa nda alundi avo ocili ale esanda. Ca sukilile oku
  eca otembo yi t\u1ebdla yoku lekisa uvangi waco. Vokuenda kuanyamo, omanu va seteka
  ovoviali alua, kuenda va kasi oku amamako kovolo\u00f1o a\u00f1i a\u00f1i. Pole,
  ungangala, uhuk\u0169i, kuenda uyaki vi kasi oku livokiya. Ovoviali omanu cilo a
  limbukiwa okuti ka a t\u1ebdla oku nena ombembua lesunga.\\n16 Cavali, Yehova ka
  kuatisile Satana oku viala oluali lulo. Nda Suku wa tatekele ungangala, nda ka kaile
  h\u1ebd oku kuatisa ovisuanji? Nda eye wa ci lingile, nda ka ecele h\u1ebd ocisim\u0129lo
  cokuti omanu nda\u00f1o va liviala ovo mu\u1ebdle ka ku iyilila ovitangi? Nda Yehova
  wa ci lingile, eye nda wa kala ndohembi. Pole, \u201cSuku ka t\u1ebdla oku kemba.\u201d\u2014Va
  Heveru 6:18.\\n17 Oco h\u1ebd, \u0169vi weyilila kusuanji va lingila Suku uka amamako
  toke otembo yipi? Ndomo tua ci k\u0169l\u0129ha, Yehova ukuonenewosi. Eye o kuete
  unene woku mal\u00e3ko ohali yosi yomanu. Kuenda oka ci linga mu\u1ebdle. Ndomo
  tua ci lilongisa ale, eny\u00f5leho tu lete ndeti voluali lulo, lika pi\u00f1anyiwa
  lofeka yimue yeposo. Ekolelo kocilumba cocisembi ca Yesu lika tu yovola kakandu
  osi. Kuenje omanu ka va ka fa vali. Pu\u00e3i ava va fa, vaka pinduiwa. Noke Suku
  oka ecelela okuti Yesu \u201co ny\u00f5la ovilinga vieliapu.\u201d (1 Yoano 3:8)
  Yehova oka t\u1ebdlisa olohuminyo viaco viosi votembo yaye ya sokiyiwa. Tu eca olopandu
  kokuaye omo handi ka kunduile oluali lulo. Momo epandi liaye, lia tu \u0129ha epuluvi
  lioku lilongisa ocili kuenda lioku u vumba. (2 Petulu 3:9, 10) Kotembo yilo, Suku
  o kasi oku lavulula afendeli vaye vocili oco a va \u0129he ekuatiso lioku pandikisa
  kovitangi vi va veta voluali lulo luev\u0129ho.\u2014Yoano 4:23; 1 Va Korindo 10:13.\\n18
  Umue pamue o lipula okuti, Anga h\u1ebd nda kua kala ohali yosi eyi nda Suku wa
  lulikile Adama la Heva lonjila yimue okuti ka va lingi ekandu? Oco tu tambulule
  epulilo eli, tu sukila oku ivaluka ombanjaile Yehova a eca kokuetu.\\nOMBANJAILE
  SUKU A TU \u0128HA\\n19 Ndomo tua ci mola ale Vocipama cat\u00e3lo, omanu va lulikiwa
  lelianjo lioku lin\u00f5lela eci va yongola. O t\u1ebdla oku limbuka esilivilo liombanjaile
  yaco kokuetu? Suku wa lulika ovinyama vialua. Pole ovio, vi songuiwa lika lolondunge
  via lulikiwa lavio. (Olosapo 30:24) Omanu va siata oku panga ovi\u00f1uma\u00f1uma
  vimue okuti vienda. Pole, ovi\u00f1uma\u00f1uma viaco, vi linga \u00f1o eci via
  sokiyiwila oku linga. Nda Suku wa tu pangele ndovi\u00f1uma\u00f1uma viaco, ove
  nda wa ci sanjukila? Sio, nda kua sanjukile. Etu tua sanjuka omo tu kuete elianjo
  lioku n\u00f5la onjila tu kuama vomuenyo wetu, loku n\u00f5la akamba vetu kuenda
  ovina vikuavo. Etu tu sole oku lianja omo okuti Suku wa tu iha elianjo liaco.\\n20
  Yehova ka yongola okuti tu linga upange waye locikuk\u0169i. (2 Va Korindo 9:7)
  Sokolola \u00f1o handi, nye ci sanjuisa vali onjali? Om\u00f5la una o linga hati
  \u201ca m\u00e3i ale a tate hu sole,\u201d pole olondaka viaco onjali oyo yo vi
  longisa? Ale olondaka vina vi tunda kutima wom\u00f5la? Omo liaco, epulilo li votuiwa
  lieli: Oka ambata ndati omuenyo wove lelianjo Yehova a ku \u0129ha? Satana la Adama
  kuenda Heva, ka vopile esilivilo liwa kelianjo Suku a va \u0129hile. Ovo va likala
  oku pokola ku Yehova Suku. Nye ove oka linga?\\n21 Ove o kuete epuluvi lioku ambata
  ciwa omuenyo wove lelianjo Yehova a ku \u0129ha. Ove ci tava okuti o likongela kolohuluwa
  viomanu va tiam\u1ebdla ku Yehova. Ovo va kasi oku sanjuisa utima wa Suku. Momo
  va kasi oku lekisa uvangi wokuti Satana ohembi haeye ombiali yiv\u0129. (Olosapo
  27:11) Ove ci tava okuti o ci lingavo poku ambata omuenyo umue wa sunguluka. Eci
  cika lomboluiwa vocipama ciku\u00e3imo.\\nCECI EMBIMBILIYA LI LONGISA\\n- Suku hayeko
  o kasi oku koka ohali voluali. \u2014Yovi 34:10.\\n- Satana poku popia hati, Suku
  ohembi kuenda o kasi oku limbika cimue ciwa komanu, wa kapa vatat\u00e3hai omoko
  ya Yehova yoku viala. \u2014Efetikilo 3:2-5.\\n- Yehova oka tuma Om\u00f5laye, Soma
  Mesiya, oco a m\u00e3leko ohali yosi yomanu. \u20141 Yoano 3:8.\\nApulilo Elilongiso\\n1,
  2. Ohali yipi omanu va siata oku pita layo? Omo liohali yaco omanu va siata oku
  lipula ndati?\\n3, 4. (a) Nye ci lekisa okuti ca sunguluka oku pula esunga lieci
  Suku a kasi oku ecelela ohali? (b) Yehova o tenda ndati ungangala kuenda ohali?\\n5.
  Atambululo api a siata oku eciwa atiam\u1ebdla kohali yomanu? Pole nye Embimbiliya
  li longisa?\\n6. Momo lie omanu valua va siatela oku kapa ekandu ku Suku loku sima
  okuti eye o kasi oku koka ohali voluali?\\n7, 8. (a) Omanu voluali va siata oku
  lekisa ndati ovituwa viombiali yaluo? (b) Ekalo liomanu ka va lipuile lovina \u2018viya
  \u00f1o, vi veta \u00f1o\u2019 via siata oku vokiya ndati ohali yomanu?\\n9. Momo
  lie tua kolelela okuti Yehova o kuete esunga lieci a kasi oku ecelela ohali?\\n10.
  Nye Satana a kapa vatatah\u00e3i? Kuenda wa ci linga ndati?\\n11. Momo lie Yehova
  ka ny\u00f5lelele ovisuanji vocumbo Cedene?\\n12, 13. Lombolola esunga lieci Yehova
  a kasi oku ecelela Satana oku viala oluali lulo kuenda omanu oku liviala ovo mu\u1ebdle.\\n14.
  Ekuatiso lipi li tunda konjila Yehova a n\u00f5lapo yoku ecelela okuti omanu va
  liviala ovo mu\u1ebdle?\\n15, 16. (a) Momo lie Yehova a kasi oku ecelela ohali otembo
  yakahandangala? (b) Nye Suku ka tatekela ungangala?\\n17, 18. Nye Yehova aka linga
  l\u0169vi weyilila koku viala kuomanu lekuatiso lia Satana?\\n19. Ombanjaile yipi
  Yehova a tu \u0129ha? Kuenda momo lie yi kuetele esilivilo kokuetu?\\n20, 21. Ove
  o sukila oku ambata ndati omuenyo wove lelianjo Suku a ku \u0129ha? Kuenda momo
  lie o sukilila oku ci linga?\"", "\"\u201cVu sole Yesu Kristu nda\u00f1o ka wa lo
  moli. Nda\u00f1o ka vu u moli cilo, haimo vu u kolela.\u201d\\n1, 2. (a) Tu pondola
  ndati oku kuata omuenyo ko pui? (b) Nye ci tu kuatisa oku tiamisila utima kungende
  wetu?\\nECI tua linga Akrist\u00e3o vocili, ca kala ndu okuti tua fetika oku linga
  ungende umue. Nda tu amamako oku lekisa ekolelo ku Suku, poku linga ungende waco
  tu ka kuata onima yiwa, kuenje tu ka kala otembo ka yi pui. Yesu wa popia hati:
  \u201cU o pandakaisa toke kesulilo eye o popeliwa.\u201d (Mateo 24:13) Oco tu t\u1ebdlise
  ungende wetu tu sukila oku amamako oku lekisa ekolelo ku Yehova toke \u201ckesulilo,\u201d
  ci kale kesulilo liomuenyo wetu ale kesulilo lioluali lulo. Pole, tu sukilavo oku
  lavulula oco ka tu ka yapuisiwe loluali lulo. (1 Yoano 2:15-17) Tu tiamisila ndati
  utima kungende wetu?\\n2 Yesu wa tu sila ongangu yiwa. Eci tu tanga ovina Embimbiliya
  li popia catiam\u1ebdla kungende wa Yesu ale kekalo liomuenyo waye, tu pondola oku
  lilongisa ovituwa viaye. Kuenje, poku ci linga tu u kuatela ocisola kuenda oku kolela
  kokuaye. (Tanga 1 Petulu 1:8, 9.) Upostolo Petulu wa popia okuti Yesu wa tu sila
  ongangu oco tu yi kuame. (1 Petulu 2:21) Nda tua setukula ongangu ya Yesu, tu pondola
  oku pandikisa toke kesulilo. * (Tala etosi pombuelo yem\u1ebdla.) Vocipama ca pita
  tua lilongisa ndomo tu pondola oku setukula umbombe kuenda ohenda ya Yesu. Vocipama
  cilo tu lilongisa ndomo tu pondola oku setukula ut\u00f5i kuenda olondunge viaye.\\nYESU
  UKUOT\u00d5I\\n3. Ut\u00f5i u lomboloka nye, kuenda tu pondola oku u lekisa ndati?\\n3
  Ut\u00f5i ocituwa cimue ci pamisa ekolelo lietu, kuenda u tu kuatisa oku pandikisa
  eci tu liyaka lovitangi. Ut\u00f5i u tu kuatisavo oku teyuila ovina via sunguluka.
  U pondolavo oku tu kuatisa oku kuata epandi kuenda oku kolela Suku eci tu liyaka
  lalambalalo. Ut\u00f5i u sokisiwa loku lekisa esumbilo, elavoko kuenda ocisola.
  Ndamupi? Nda tu lekisa esumbilo woku sumuisa Suku, ka tu ecelela okuti usumba womunu
  u tu yula. (1 Samuele 11:7; Olosapo 29:25) Oku kuata elavoko ku Yehova ci tu kuatisa
  oku tiamisila utima wetu kovina vi keya kovaso yoloneke, okuti kovitangi vietu hakoko.
  (Osamo 27:14) Ocisola cocili ci tu vetiya oku lekisa ut\u00f5i nda\u00f1o ceci tu
  lambalaliwa. (Yoano 15:13) Tu pondola oku kuata ut\u00f5i poku kolela ku Yehova
  kuenda oku setukula Om\u00f5laye.\\n4. Yesu wa lekisa ndati ut\u00f5i eci a kala
  vonembele? (Tala ociluvialuvia kefetikilo liocipama cilo.)\\n4 Eci Yesu a kuata
  12 kanyamo wa lekisa ut\u00f5i eci a kala \u201cvonembele, kuenda wa tum\u00e3la
  pokati kalongisi.\u201d (Tanga Luka 2:41-47.) Alongisi vaco va k\u0169l\u0129h\u0129le
  ciwa Ocihandeleko ca Mose, pole, va k\u0169l\u0129h\u0129levo alongiso a va Yudea.
  Alongiso aco a enda oku tateka omanu oku pokola Kocihandeleko. Pole, Yesu ka ecelele
  okuti uk\u0169l\u0129h\u0129so walongisi vaco u tateka oku longisa. Eye ka kuatele
  usumba. Kuenje wa amamako loku \u201cva pula pula.\u201d Ocili okuti, Yesu ka lingile
  apulilo ana a siata oku lingiwa lom\u00e3la. Pole, tu pondola oku sokolola Yesu
  oku linga apulilo a vetiya alongisi vaco oku yevelela kuenda oku sokolola lutate.
  Nda\u00f1o alongisi va setekele oku pat\u00e3la loku linga apulilo, pole, ka va
  ci t\u1ebdlele. Omanu vosi va kala oku u yevelela oku kongelamo alongisi vaco, va
  kom\u00f5ha \u201colondunge viaye latambululo aye.\u201d Omo liaco, Yesu lut\u00f5i
  wa lua wa teyuila ocili ci sangiwa Vondaka ya Suku!\\n5. Volonjila vipi via litepa
  Yesu a lekisa ut\u00f5i vokuenda kupange waye woku kunda?\\n5 Yesu vokuenda kupange
  waye woku kunda, wa lekisa ut\u00f5i volonjila via litepa. Eye wa lekisa komanu
  okuti, asongui vatavo va kala oku va yapuisa lalongiso avo esanda. (Mateo 23:13-36)
  Yesu ka ecelele oku yapuisiwa loluali. (Yoano 16:33) Pole, nda\u00f1o lalambalalo
  wa amamako oku kunda. (Yoano 5:15-18; 7:14) Olonjanja vivali lut\u00f5i wa lua,
  wa yelisa onembele poku lupuisa omanu va kala oku v\u0129hisa efendelo liocili.\\nYesu
  lut\u00f5i wa lua wa sapuila kombonge ya velapo ya va Yudea hati, eye Kristu Om\u00f5la
  wa Suku\\n6. Yesu wa lekisa ndati ut\u00f5i keteke lia sulako liomuenyo waye palo
  posi?\\n6 Tu konomuisi ut\u00f5i Yesu a lekisa keteke lia sulako liomuenyo waye
  palo posi. Eye wa k\u0169l\u0129h\u0129le ovina via laikele oku pita noke lioku
  pakuiwa la Yuda. Osimbu va kala kondalelo yo Paskoa Yesu wa sapuila Yuda hati: \u201cEci
  o linga, ci linga lombili.\u201d (Yoano 13:21-27) Vocumbo co Gesemane, Yesu lut\u00f5i
  wa lilekisa kasualali veya oku u kuata. Nda\u00f1o okuti omuenyo waye wa kala kohele,
  wa teyuila olondonge viaye poku sapuila asualali hati: \u201cAlume ava va ende.\u201d
  (Yoano 18:1-8) Eci Yesu a pulisiwa lombonge ya velapo ya va Yudea, lut\u00f5i wa
  lua wa va sapuila hati, eye Kristu Om\u00f5la wa Suku. Eye ka kuatele usumba, nda\u00f1o
  okuti ocitunda cinene ca kala oku sanda onjila yoku u ponda. (Marko 14:60-65) Pole,
  Yesu wa amamako oku kolela ku Suku kuenje wa fila kuti. Noke eci a kala oku tula
  omuenyo, wa kaluka hati: \u201cCa maliwa!\u201d\\nSETUKULI UT\u00d5I WA YESU\\n7.
  Ene amal\u1ebdhe, nye vu yevi vutima omo lioku kala Olombangi Via Yehova, kuenda
  vu lekisi ndati okuti vukuot\u00f5i?\\n7 Tu pondola oku setukula ndati ut\u00f5i
  wa Yesu? Kosikola. Ene amal\u1ebdhe, vu lekisi ut\u00f5i poku sapuila kakamba vene
  vo kosikola kuenda komanu vakuavo okuti Vulombangi Via Yehova. Poku ci linga, o
  lekisa okuti wa sanjukila oku tukuiwa londuko ya Yehova, nda\u00f1o okuti o pembuiwa
  lomanu. (Tanga Osamo 86:12.) Omanu vamue va pondola oku ku vetiya oku tava kelongiso
  liokuti, ovina via tukuluka \u00f1o. Pole, o sukila oku kolela okuti eci Embimbiliya
  li popia catiam\u1ebdla koviluvo, viocili. Lekuatiso liombrochura losapi hati: A
  Origem da Vida \u2014 Cinco Perguntas Que Merecem Resposta, o pondola oku tambulula
  omunu \u201cwosi o pula oku k\u0169l\u0129h\u0129sa elavoko vu kasi lalio.\u201d
  (1 Petulu 3:15) Poku ci linga o kuata esanju omo lioku limbuka okuti, wa teyuila
  lut\u00f5i ocili Cembimbiliya!\\n8. Asunga api tu kuete oco tu kunde lut\u00f5i?\\n8
  Kupange wetu woku kunda. Omo okuti Tuakrist\u00e3o vocili, tu sukila oku amamako
  oku \u2018longisa ondaka ya Yehova lut\u00f5i.\u2019 (Ovilinga 14:3) Momo lie tu
  sukilila oku kunda lut\u00f5i? Catete, tua k\u0169l\u0129ha okuti ovina tu kunda
  vi sangiwa Vembimbiliya. Olondaka viaco viocili. (Yoano 17:17) Cavali, \u201cetu
  tu londingupange kumosi la Suku,\u201d kuenda eye, wa siata oku tu \u0129ha espiritu
  sandu oco li tu kuatise. (1 Va Korindo 3:9; Ovilinga 4:31) Catatu, tu sole Yehova
  lomanu, omo liaco tu vetiyiwa oku likolisilako oku sapuila komanu olondaka viwa.
  (Mateo 22:37-39) Omo okuti tu kuete ut\u00f5i, ka tu ka liwekipo oku kunda. Tua
  n\u00f5lapo oku longisa ocili komanu vana okuti asongui vatavo esanda, va siata
  oku \u201ctekav\u0129sa ovitima viavo,\u201d ale oku yapuisiwa. (2 Va Korindo 4:4)
  Nda\u00f1o okuti omanu valua ka va tava oku tu yevelela ale va tu lambalala, tu
  amamako oku kunda olondaka viwa.\\n9. Tu pondola oku lekisa ndati ut\u00f5i eci
  tu lambalaliwa?\\n9 Ceci tu lambalaliwa. Eci tu kolela Suku, eye o tu \u0129ha ekolelo
  kuenda ut\u00f5i woku pandikisa poku liyaka lovitangi. Nda umue ukuepata lietu wa
  fa, tu sumua, pole, ka tu pui elavoko. Tua kolela okuti, \u201cSuku ukuakulembeleka,\u201d
  o ka pamisa ekolelo lietu. (2 Va Korindo 1:3, 4; 1 Va Tesalonike 4:13) Nda tu kasi
  oku liyaka locitangi coku vela ale tua lemehiwa, tu yeva evalo, pole, tu yuvula
  oku sakuiwa lonjila yimue ka yi sanjuisa Suku. (Ovilinga 15:28, 29) Nda tua sumua,
  \u201covitima vietu vi tu veta evelo,\u201d pole, ka tu liwekapo. Momo tua kolela
  okuti, Yehova o kasi \u201cocipepi la vakuavitima via teka.\u201d * (Tala etosi
  pombuelo yem\u1ebdla.)\\nYESU UKUALONDUNGE\\n10. Nye ci lomboloka olondunge, kuenda
  Ukrist\u00e3o o lekisa ndati olondunge poku sapela?\\n10 Olondunge ulo\u00f1o woku
  tepisa pokati keci ciwa leci c\u0129vi, kuenda oku n\u00f5la oku linga eci ciwa.
  (Va Heveru 5:14) Ukrist\u00e3o ukualondunge o n\u00f5la onjila yu kuatisa oku pamisa
  ukamba waye la Suku. Eye ka popi olondaka vina vi sumuisa omanu vakuavo. Pole, o
  sanjuisa Yehova momo o n\u00f5la olondaka vi kuatisa vakuavo. (Olosapo 11:12, 13)
  Eye \u201co livala konye\u00f1o.\u201d (Olosapo 14:29) Eye \u201co su\u00f1amisa
  onjila yaye,\u201d okuti o n\u00f5la onjila ya sunguluka komuenyo waye. (Olosapo
  15:21) Tu pondola oku kala ndati vakualondunge? Tu ci linga poku lilongisa Ondaka
  ya Suku, kuenda oku kapako ovina tua lilongisa. (Olosapo 2:1-5, 10, 11) Tu pondolavo
  oku lilongisa kuenda oku setukula ongangu ya Yesu yoku lekisa olondunge.\\n11. Yesu
  wa lekisa ndati olondunge kolondaka viaye?\\n11 Yesu wa lekisa olondunge kovina
  viosi a popia levi a linga. Kolondaka viaye. Yesu poku kunda olondaka viwa, wa tukula
  olondaka via komoh\u0129sa olonjeveleli viaye. (Mateo 7:28; Luka 4:22) Olonjanja
  vialua wa tukula Ondaka ya Suku. Eye wa k\u0169l\u0129h\u0129le ciwa ovinimbu viovisonehua
  a sukilile oku tukula vapuluvi osi. (Mateo 4:4, 7, 10; 12:1-5; Luka 4:16-21) Omanu
  va kala oku yevelela eci Yesu a kala oku lombolola Ovisonehua, va vetiyiwa calua
  lolondaka viaye. Yesu noke liepinduko liaye, wa sapela lolondonge viaye vivali eci
  via kala oku enda kimbo lio Emausi. Eye wa situlula elomboloko liovisonehua via
  tiamisiwila kokuaye. Noke olondonge via popia hati: \u201cOvitima vietu ka via tokotele
  h\u1ebd osimbu a vangula letu vonjila, cina a tu situluila ovisonehua?\u201d\\n12,
  13. Ovolandu api a lekisa okuti Yesu wa enda oku livala konye\u00f1o loku lekisa
  esunguluko?\\n12 Kovisim\u0129lo kuenda kovituwa viaye. Olondunge via kuatisa Yesu
  oku \u201clivala konye\u00f1o.\u201d (Olosapo 16:32) Eye wa enda oku livala konye\u00f1o,
  kuenda \u2018wonjukile\u2019. (Mateo 11:29) Yesu olonjanja viosi wa lekisile epandi
  kolondonge viaye nda\u00f1o lakulueya avo. (Marko 14:34-38; Luka 22:24-27) Eye wa
  amamako oku lekisa epandi nda\u00f1o ceci a talisiwa ohali.\\n13 Olondunge via kuatisa
  Yesu oku lekisa esunguluko. Momo, wa kuata elomboloko Liocihandeko ca eciwile ku
  Mose, okuti co vetiya oku tata ciwa omanu. Sokolola ulandu wuk\u00e3i wa kuatele
  uvei woku \u201cpita osonde.\u201d (Tanga Marko 5:25-34.) Uk\u00e3i wa pita pokati
  komanu noke wa lamba kuwalo wa Yesu, kuenje wa sakuiwa. Ndomo ca lekisiwa Vocihandeleko,
  uk\u00e3i waco wa tendiwile okuti wa v\u0129hisua, omo liaco wa sukilile oku yuvula
  oku lamba vakuavo. (Ovisila 15:25-27) Pole, Yesu ka vanguile laye lonjila yimue
  yi sumuisa. Momo lie? Momo wa k\u0169l\u0129h\u0129le okuti, ovituwa ndeci: Ohenda
  kuenda ekolelo,\u2019 via kuatele esilivilo lia velapo, okuti oku pokola lika Kocihandeleko
  ci sule. (Mateo 23:23) Yesu lohenda yalua wa popia hati:\u201cAm\u00f5lange, ekolelo
  liove lia ku popela. Kuende lombembua. Uvei wove wa ku tunda.\u201d Ongangu yiwa
  ya Yesu yoku lekisa olondunge, yo vetiya oku kuata ohenda!\\n14. Nye Yesu a n\u00f5lelepo
  oku linga, kuenda wa tiamisilile ndati utima waye kupange woku kunda?\\n14 Kekalo
  liomuenyo waye. Ekalo liomuenyo wa Yesu lia lekisa okuti wa kala ukualondunge. Eye
  wa n\u00f5lelepo oku linga upange woku kunda. (Luka 4:43) Yesu wa kuamele onjila
  yo kuatisa oku tiamisila utima waye kupange waco kuenda oku t\u1ebdlisa ocikele
  caye. Wambatele omuenyo wa leluka oco a pesile otembo yalua kuenda ongusu kupange
  woku kunda. (Luka 9:58) Eye wa k\u0169l\u0129h\u0129le okuti wa sukilile oku pindisa
  omanu vakuavo, oco upange woku kunda wa amameko noke yolofa viaye. (Luka 10:1-12;
  Yoano 14:12) Yesu wa likuminya oku kuatisa olondonge viaye kupange woku kunda \u201ctoke
  kesulilo lioluali.\u201d\u2014Mateo 28:19, 20.\\nSETUKULI OLONDUNGE VIA YESU\\n15.
  Tu pondola oku lekisa ndati olondunge kolondaka vietu?\\n15 Tu pondola oku setukula
  ndati olondunge via Yesu? Volondaka vietu. Eci tu sapela la vamanjetu, tu sukila
  oku kuama olondaka vi va vetiya okuti, vina vi va sumuisa havioko. (Va Efeso 4:29)
  Eci tu sapela lomanu catiam\u1ebdla Kusoma wa Suku, olondaka vietu vi sukila oku
  \u201csingiwa lomongua,\u201d okuti oku sapela lonjila yimue ya sunguluka. (Va Kolosai
  4:6) Omo liaco tu sukila oku kuata elomboloko liovina omanu va sukila, eci va sole,
  kuenda tu n\u00f5la lutate olondaka tu popia. Nda tua n\u00f5la lutate olondaka
  vietu, omanu va tu yevelela, kuenda esapulo lietu li vetiya ovitima viavo. Eci tu
  va lomboluila ovina tua lilongisa tu sukila oku tanga Embimbiliya, momo Ondaka ya
  Suku yi kuete unene. Tua k\u0169l\u0129ha okuti esapulo Liembimbiliya li kuete unene
  ka u sokisiwa.\\n16, 17. (a) Tu lekisa ndati okuti tua siata oku livala konye\u00f1o
  kuenda tua sunguluka? (b) Tu amamako ndati oku tiamisila utima wetu kupange woku
  kunda?\\n16 Kovisim\u0129lo kuenda kovituwa vietu. Eci tu liyaka lovitangi, olondunge
  vi tu kuatisa oku kuata ovisim\u0129lo via sunguluka kuenda oku \u2018livala konye\u00f1o.\u2019
  (Tiago 1:19) Eci omanu va tu popia l\u00e3vi tu sukila oku k\u0169l\u0129h\u0129sa
  esunga lieci va popela olondaka viaco. Poku ci linga ci leluka oku va ecela loku
  yuvula oku va kuatela onye\u00f1o. (Olosapo 19:11) Oku kuata olondunge ci tu kuatisa
  oku lekisa esunguluko. Ka tu lavoka okuti vamanjetu va linga ovina via li pua. Pole,
  tu sukila oku ivaluka okuti, ovo pamue va kasi oku liyaka lovitangi ka tua k\u0169l\u0129h\u0129le.
  Omo liaco, tu lekisa onjongole yoku yevelela ovisim\u0129lo viavo. Kuenje tu yuvula
  oku va kisika oku tava lika kovisim\u0129lo vietu.\\n17 Kekalo liomuenyo wetu. Tua
  k\u0169l\u0129ha okuti oku kunda olondaka viwa esum\u0169l\u0169ho lia velapo tu
  kuete. Omo liaco, tu yongola oku n\u00f5la onjila yi tu kuatisa oku amamako oku
  tiamisila utima kupange woku kunda. Tua n\u00f5lapo oku pitisa kovaso upange wa
  Yehova komuenyo wetu. Omo liaco, tu ambata omuenyo wa leluka u tu kuatisa oku pesila
  otembo yalua kuenda ongusu yetu kupange woku kunda olondaka viwa osimbu esulilo
  ka lieyile.\\n18. Tu pondola oku amamako ndati oku linga ungende u tuala komuenyo
  ko pui, kuenda nye wa n\u00f5lapo oku linga?\\n18 Tua siata oku kuata esanju poku
  lilongisa ovituwa vimue via Yesu! Sokolola ndomo tu pondola oku kuatisiwa poku lilongisa
  ovituwa viaye vikuavo kuenda oku u setukula. Omo liaco, tu n\u00f5lipo oku setukula
  ovituwa via Yesu. Nda tua ci linga tu ka amamako oku linga ungende u tuala komuenyo
  ko pui, kuenje ukamba wetu la Yehova u pamisiwa.\\n^ tini. 2 Ukanda watete wa Petulu
  1:8, 9, wa sonehiwila Kakrist\u00e3o va kuete elavoko lioku ka kala kilu. Omo liaco,
  olondaka via Petulu vi tiamisiwilavo Kakrist\u00e3o va kuete elavoko lioku kala
  palo posi otembo ka yi pui.\\n^ tini. 9 Oco o k\u0169l\u0129he ovolandu omanu va
  lekisa ut\u00f5i eci va liyaka lovitangi, tala Utala Wondavululi 1 ya Cembanima
  yunyamo wo 2000 kelimi Lioputu, kem\u1ebdla 24-28; O Despertai! 22 ya Kupupu yunyamo
  wo 2003 kem\u1ebdla 18-21; kuenda O Despertai! 22 ya Susu yunyamo wo 1995, kem\u1ebdla
  11-15.\"", "\"(Ovilinga 17:7)\\n1. Yehova eye ukuakuyekisa.\\nWaca ombela lekumbi
  komanu.\\nO tu tata ciwa, ka kuete ocame;\\nO tu\u0129ha ovina via fina.\\nTu kuateli
  ocikembe ambombe,\\nTu setukuli ongangu ya Suku.\\nTu sum\u0169l\u0169isiwa la Yehova
  Suku,\\nTu kuati ohenda yocili.\\n2. Tu ka tambula onima yocili\\nEci tu kuatisa
  vana va suka.\\nOvingendeleyi, tu vi yekisivo,\\nLocisola tu vi kuatisi.\\nNda Ludia
  tu peyi tuti: \u201cWakombe.\u201d\\nTu va tambuli ciwa, konjo yetu.\\nIsietu Yehova
  wa k\u0169l\u0129ha vosi,\\nVa lingainga ohenda ndeye.\\n(Talavo Ovil. 16:14, 15;
  Va Rom. 12:13; 1 Tim. 3:2; Va Hev. 13:2; 1 Pet. 4:9.)\"", "\"OKU koka kupi ulume
  a sukila oku eca kuk\u00e3i waye? Omanu valua va tava okuti ocikele ca velapo culume
  oku talavaya oco a kuate olombongo okuti epata liaye li kolapo. Pole ak\u00e3i vana
  va mol\u1ebdha okuti va kuete ukuasi, va liyevite okuti ka va kolelepo kuenda ka
  va kuete esanju. Uk\u00e3i umue ko Espanya o tukuiwa hati, Rosa poku lombolola catiam\u1ebdla
  kulume waye wa popia hati: \u201cOmanu vo ko samua vo tenda okuti wa sunguluka calua,
  pole konjo ulume umue wa tema calua.\u201d Joy, uk\u00e3i umue ko Nigeria wa popia
  ndoco: \u201cUlume wange eci ndi pat\u00e3la ocisim\u0129lo caye, o ndi sapuila
  hati, \u2018Ove o sukila oku linga ovina viosi hu sapuila momo, ame ndulume wove.\u2019\u201d\\nNdamupi
  ulume a pondola oku t\u1ebdlisa ocikele caye coku kala ulume umue ukuacisola? Nye
  ulume a sukila oku linga oco onjo yaye yi linge ocitum\u00e3lo cimue ca koka, kuk\u00e3i
  waye?\u2014Ruti 1:9.\\nCECI EMBIMBILIYA LI POPIA CATIAM\u1ebcLA KOCIKELE CULUME\\nNda\u00f1o
  okuti ulume luk\u00e3i vamuamue kovaso a Suku pole, Embimbiliya li lekisa okuti
  omunu lomunu o kuete ocikele caye vepata. Elivulu lia Va Roma 7:2 li lekisa okuti
  uk\u00e3i o kuele o kasi vemehi \u2018liocihandeleko ca veyaye.\u2019 Ndeci ovisoko
  vialua vi n\u00f5la omunu umue oco a linge usongui wupange, Suku wa n\u00f5la ulume
  oco a linge utue wuk\u00e3i waye. (1 Va Korindo 11:3) Alume va kuete ocikele coku
  songuila vakuanjo yavo.\\nEne walume, vu sukila oku talavaya ndati locikele Suku
  a wihi? Embimbiliya li popia ndoco: \u201cSoli ak\u00e3i vene ndeci Kristu a sola
  ekongelo.\u201d (Va Efeso 5:25) Nda\u00f1o okuti Yesu Kristu lalimue eteke a kuelele,
  ongangu yaye yi pondola oku vu kuatisi oku kala alume vawa. Tu k\u0169l\u0129hisi
  ndomo ci lingiwa.\\nOMUENYO WA YESU\u2014ONGANGU YIMUE YA LIPUA KALUME\\nYesu wa
  enda oku lembeleka vakuavo loku va kuatisa. Yesu wa likuminyile komanu vosi va sumua
  haivo va lemiwa lovitangi viavo, hati: \u201cEnjui kokuange ... kuenje ndu kavuluisi.\u201d
  (Mateo 11:28, 29) Eye wa enda oku va kavuluisa kohali yavo kuenda wa va kuatisa
  oku kuata ukamba la Yehova. Omo liaco, omanu valua va vetiyiwa oku amela ku Yesu
  loku kolela okuti, o pondola oku va kavuluisa kohali yavo!\\nNdomo alume va setukula
  Yesu. K\u0169l\u0129h\u0129sa olonjila o pondola oku kuama oco u kuatise kovopange
  aye. Ak\u00e3i vamue va siata oku liyeya ndeci Rosa, wa popia hati: \u201cAme nda
  kala ndupika wulume wange.\u201d Pole, eci ca litepa la Kweku ulume umue o kuete
  olohuela viwa. Eye wa popia hati: Olonjanja vimue ndi pulisa uk\u00e3i wange ndomo
  ndu u kuatisa kovopange aye. Omo okuti, ndu u sole, ndi lieca olumue oco ndu kuatise
  kovopange o vonjo.\u201d\\nYesu wa kapeleko vakuavo kuenda wa kala ukuahenda. Uk\u00e3i
  umue ohuk\u0169i, vokuenda kueci ci soka 12 kanyamo wa tala ohali omo liocitangi
  cimue cuhayele. Eci a yeva okuti Yesu o kuete unene woku linga ovikomo, \u201cwa
  popia hati: \u2018Nda\u00f1o nda lamba \u00f1o kuwalo waye \u00f1aya.\u2019\u201d
  Eye wa kala locisim\u0129lo ciwa. Noke wamela ku Yesu, wa lamba kovinjenje viuwalo
  waye kuenje wa kaya. Omanu vamue nda\u00f1o va sima okuti uk\u00e3i waco ka lingile
  eci ca sunguluka, pole, Yesu wa limbuka okuti wa puile elavoko. a Omo liaco, lohenda
  yalua wo sapuila hati: \u201cAm\u00f5lange . . . uvei wove wa ku tunda.\u201d Eye
  ka yuvuile lika oku u kutisa os\u00f5i ale oku u vetela evelo, pole wa limbuka uvei
  waye. Ocili okuti Yesu wa kala ulume umue ukuahenda.\u2014Marko 5:25-34.\\nNdomo
  alume va setukula Yesu. Nda wa limbuka okuti uk\u00e3i wove wa sumua kapako ekalo
  liaye kuenda lekisa epandi. Seteka oku tenda ovina ndomo eye a vi tenda kuenda kuata
  elomboloko liesumuo liaye. Ricardo wa lombolola ndoco: \u201cEci ndi limbuka okuti
  uk\u00e3i wange o kasi oku tema lonjanga, ndi likolisilako oco si ka vangule ovina
  vi pondola oku vokiya onye\u00f1o yaye.\u201d\\nYesu wa enda oku sapela lolondonge
  viaye. Yesu wa enda oku sapela calua lakamba vaye. Eye wa popia hati: \u201cNdo
  sapuili ovina viosi nda yeva ku Tate.\u201d (Yoano 15:15) Ocili okuti, Yesu eteke
  limue wa yonguile oku kala li kaliaye kuenda oku likutilila. Pole eye wa enda oku
  situluila ovisim\u0129lo viaye kolondonge viaye. Vuteke waye wa sulako osimbu ka
  pondiwile ndondinga\u0129vi, wa va sapuila okuti \u2018wa sumua calua.\u2019 (Mateo
  26:38) Nda\u00f1o mu\u1ebdle ceci va enda oku linga ovina ka viusanjuisa, Yesu lalimue
  eteke a silepo oku vangula lavo.\u2014Mateo 26:40, 41.\\nNdomo alume va setukula
  Yesu. Poku sapela luk\u00e3i wove, u situluila ovisim\u0129lo viove kuenda eci o
  yevite. Pamue uk\u00e3i o liyeya okuti eci ulume waye a kasi lomanu vakuavo o sapela
  ciwa, pole eci a kasi konjo ka vangula. K\u0169l\u0129hisa ndomo Ana a liyeva eci
  ulume waye o situluila ovisim\u0129lo viaye. Eye wa popia hati: \u201cNda liyeva
  okuti ulume wange o ndi sole kuenda ca pamisa ukamba wange laye.\u201d\\nKu ka n\u00f5lepo
  ocituwa coku siapo oku vangula laye ndonjila yoku kangisa uk\u00e3i wove. Uk\u00e3i
  umue wa popia okuti, \u201culume wange nda wa tema, o pita oloneke vialua okuti
  ka vangula lame. Ocituwa caye ci ndi vetiya oku sima okuti ame \u00f1uete eko liaco
  kuenda sia kapiwileko.\u201d Uk\u00e3i o tukuiwa hati, Edwin wa siata oku likolisilako
  oku kuama ongangu ya Yesu. Eye wa popia hati: \u201cEci ndi tema, si tambulula vepuluvi
  liaco, pole ndi sanda epuluvi lia sunguluka oco tu vangula eci catiam\u1ebdla kocitangi
  caco.\u201d\\nJoy, wa tukuiwa kefetikilo, wa limbuka apongoloko ulume waye a linga
  tunde eci a fetika oku lilongisa Embimbiliya Lolombangi Via Yehova. Joy wa popia
  hati: \u201cUlume waye wa pongoloka kuenda o sanda oku likolisilako oku kala ulume
  umue ukuacisola poku setukula ongangu ya Yesu.\u201d Olohueli vialua voluali, via
  siata oku kuatisiwa poku lilongisa olonumbi Viembimbiliya. Ove h\u1ebd o yongola
  oku likongela kokuavo? O pondola oku pinga Kombangi yimue ya Yehova oco yi ku longise
  ocali Embimbiliya.\"", "\"Nda\u00f1o omanu vakuavo va ku yanduluka, kuli omunu umue
  okuti lalimue eteke a ka ku yanduluka. Omunu waco helie?\\nSoma Daviti wa popia
  hati: \u201cMomo tate la mai va njanduluka pu\u00e3i Yehova o nambula.\u201d\u2014Osamo
  27:10.\\nYehova, \u201cIsia yohenda kuenda Suku yelembeleko liosi, una o tu lembeleka
  kohali yetu yosi.\u201d \u20142 Va Korindo 1:3, 4.\\n\u201cOsimbu vu yeki kokuaye
  ovilemo viene viosi, momo eye o vu tati.\u201d\u20141 Petulu 5:7.\\nOco o lilongise
  ndomo Suku a yongola oku ku kuatisa, tanga ocipama 8 celivulu losapi hati, Sanjukili
  Omuenyo Otembo ka yi Pui! lia sandekiwa Lolombangi Via Yehova. Li sangiwavo vo www.jw.org\"",
  "\"Etambululo Liembimbiliya\\nOcili! Embimbiliya lia tunda ku \u201cSuku una o lembeleka
  vana va sumua.\u201d (2 Va Korindo 7:6) Nda\u00f1o okuti Embimbiliya helivulu limueko
  li lombolola catiam\u1ebdla kuveyi wowo\u00f1o, olio lia kuatisa ale omanu valua
  oku yuvula ovisim\u0129lo vioku li ponda. Olonumbi vi sangiwa Vembimbiliya vi pondolavo
  oku ku kuatisa.\\nOlonumbi vipi viwa Embimbiliya lieca?\\n\u25cf Situlula ovisim\u0129lo
  viove.\\nCeci Embimbiliya li popia: \u201cEkamba liocili li lekisa ocisola otembo
  yosi, kuenda olio li linga manjove kotembo yohali.\u201d\u2014Olosapo 17:17.\\nElomboloko
  liaco: Tu sukila ekuatiso lia vakuetu, nda tu kasi oku liyaka lovisim\u0129lo ka
  via sungulukile.\\nNda okuti ku sapuilako vakuene ovisim\u0129lo viove, ku ka t\u1ebdla
  oku yula ovisim\u0129lo v\u0129vi lika wove. Pole, nda o sapuilako ekamba liove,
  citava okuti ku yuliwa lovisim\u0129lo viaco kuenda o kuata ovisim\u0129lo via sunguluka.\\nSeteka
  ndoco: Etaili, sapela laumue ukuepata ale ekamba limue ove wa kolela. a Citava okuti
  o soneha ovisim\u0129lo viove.\\n\u25cf Sanda ekuatiso liolondotolo.\\nCeci Embimbiliya
  li popia: \u201cOmanu va kuete uhayele ka va sukila ondotolo, te vana va vela.\u201d\u2014Mateo
  9:12.\\nElomboloko liaco: Tu sukila oku sanda ekuatiso liolondotolo nda tu vela.\\nOvisim\u0129lo
  vioku lipond,a ondimbukiso yuvei wovowo\u00f1o. Ndeci ci pita luvei umue vetimba,
  ka tu sukila oku kuata os\u00f5i. Uvei wovowo\u00f1o kuenda woketimba u pondola
  oku sakuiwa.\\nSeteka ndoco: Sanda lonjanga ekuatiso liondotolo ya lo\u00f1oloha
  nda citava.\\n\u25cf Ivaluka okuti Suku wa ku kapako.\\nCeci Embimbiliya li popia:
  \u201cOlongungu vit\u00e3lo ka vi landisiwa h\u1ebd lovingangu vivali vi kuete esilivilo
  litito? Haimo lumue, layimue pokati kavio yi ivaliwa la Suku. . .. Ko ka kuati usumba;
  ene wa velipo okuti olongungu vialua vi sule.\u201d\u2014Luka 12:6, 7.\\nElomboloko
  liaco: Ove o kuete esilivilo lialua ku Suku.\\nPamue o sima okuti lomue wa kapako
  ovisim\u0129lo viove. Pole, Suku o lete ovina o kasi oku liyaka lavio. Eye wa ku
  kapako nda\u00f1o mu\u1ebdle ceci okuti ku kuete vali onjongole yoku kala komuenyo.
  Osamo 51:17 yi popia ndoco: \u201cA Suku, ove ku ka likala utima wa teka haiwo wa
  samba.\u201d Suku o yongola okuti o kala komuenyo momo o ku sole calua.\\nSeteka
  ndoco: Tala olonumbi Embimbiliya lieca vi lekisa okuti Suku o ku sole calua. Ndeci,
  tanga ocipama 24 celivulu Kuata Ukamba la Yehova.\\n\u25cf Likutilila ku Suku.\\nCeci
  Embimbiliya li popia: \u201cYeki kokuaye asakalalo ene osi, momo eye o vu tati.\u201d\u20141
  Petulu 5:7.\\nElomboloko liaco: Suku o yongola okuti u lomboluila ovisim\u0129lo
  viove kuenda ovina vi ku sakalaisa.\\nSuku o ku \u0129ha ombembua yovutima kuenda
  ongusu yoku amamako. (Va Filipoi 4:6, 7, 13) Eyi oyo onjila a siata oku kuama poku
  kuatisa vana va likutilila kokuaye lutima wosi.\u2014Osamo 55:22.\\nSeteka ndoco:
  Likutilila ku Suku olonjanja viosi. Tukula onduko yaye, Yehova kuenda u lomboluila
  ovisim\u0129lo viove. (Osamo 83:18) Pinga kokuaye oco a ku kuatise oku liyaka lovitangi
  viove.\\n\u25cf Sokolola kelavoko Liembimbiliya liokovaso yoloneke.\\nCeci Embimbiliya
  li popia: \u201cTu kuete elavoko liaco ndonjundo kovimuenyo vietu, lina lia kolapo
  hailio lia pama.\u201d\u2014Va Heveru 6:19, etosi.\\nElomboloko liaco: Ovisim\u0129lo
  viove vi pondola oku pongoloka ndeci onaviyu yimue yi kundoka lofela. Pole, elavoko
  li sangiwa Vembimbiliya, li pondola oku ku kuatisa oku kolapo.\\nElavo liaco haliuhembiko,
  pole, olio lia kunam\u1ebdla kohuminyo ya Suku yoku malako ohali.\u2014Esituluilo
  21:4.\\nSeteka ndoco: Lilongisa ovina vikuavo via tiam\u1ebdla kelavoko li sangiwa
  Vembimbiliya. Tanga ocipama losapi, \u201cO Pondola Oku Kolela Kekalo Liwa Lio Kovaso
  Yoloneke\u201d\\n\u25cf Linga ocina cimue ove o sole.\\nCeci Embimbiliya li popia:
  \u201cUtima umue wesanju u kasi ndovihemba vi kayisa.\u201d\u2014Olosapo 17:22.\\nElomboloko
  liaco: Oku linga ovina vi tu kokela esanju ci tu kuatisa kuhayele ale ketimba kuenda
  ci tu sanjuisa.\\nSeteka ndoco: Linga ocina cimue o sole calua. Ndeci, yevelela
  ovisikilo vina vi ku sanjuisa, tanga ulandu umue u vetiya ale oku linga omapalo
  yimue. O pondolavo oku kuata esanju lialua poku kuatisa vakuene, nda\u00f1o kovina
  vitito.\u2014Ovilinga. 20:35.\\n\u25cf Tata uhayele wove.\\nCeci Embimbiliya li
  popia: \u201cOku pokuisa etimba ku kuete esilivilo.\u201d\u20141 Timoteo 4:8.\\nElomboloko
  liaco: Oku pindisa etimba, oku pekela kuenda oku lia ciwa, ci tu kuatisa kuhayele.\\nSeteka
  ndoco: Seteka oku endela posi nda\u00f1o ceci ci soka akukutu 15.\\n\u25cf Ivaluka
  okuti ovisim\u0129lo kuenda ekalo liove vi pondola oku pongoloka.\\nCeci Embimbiliya
  li popia: \u201cKa wa k\u0169l\u0129h\u0129li ndomo omuenyo wene u ka kala h\u1ebdla.\u201d\u2014Tiago
  4:14.\\nElomboloko liaco: Ocitangi cimue o sima okuti cinene calua, ci pondola oku
  tetuluiwa.\\nNda\u00f1o okuti kua k\u0169l\u0129h\u0129le nda ovitangi o kasi oku
  liyaka lavio vi kasi ndu okuti ka vi kuete esulilo, pole, eteke limue vi kapuako.
  Omo liaco, sanda oku tetulula ocitangi caco. (2 Va Korindo 4:8) Citava okuti, ocitangi
  caco ci pongoloka vokuenda kuotembo, pole, nda wa liponda ku t\u1ebdla oku pongolola
  ovisim\u0129lo viaco.\\nSeteka ndoco: Tanga Vembimbiliya ovolandu omanu vamue va
  sumuile calua okuti, va yonguile oku fa kuenda k\u0169l\u0129h\u0129sa ndomo omuenyo
  wavo wa pongoloka vokuenda kuotembo okuti, olonjanja vimue ka va ci lavokaile. K\u0169l\u0129h\u0129sa
  ovolandu amue.\\nAnga h\u1ebd Embimbiliya li tukula omanu vamue va yonguile oku
  fa?\\nOcili. Embimbiliya li tu sapuila omanu vamue va popele vati, \u201cnjongola
  oku fa.\u201d Suku ka pisile omanu vaco, pole, wa va kuatisa. Eye o pondolavo oku
  linga ovina vimuamue love.\\nEliya\\n\u25cf Wa kala elie? Wa kala uprofeto umue
  ukuot\u00f5i. Pole, olonjanja vimue wa endavo oku yeva esumuo. Elivulu lia Tiago
  5:17 li popia ndoco: \u201cEliya wa kalavo omunu umue ndetu.\u201d\\n\u25cf Momo
  lie a yonguilile oku fa? Onjanja yimue, Eliya wa sim\u0129le okuti o kasi ulika,
  wa kuata usumba loku sima okuti ka kuete esilivilo. Eye wa pinga ndoco: \u201cA
  Yehova upa omuenyo wange.\u201d\u20141 Olosoma 19:4.\\n\u25cf Nye co kuatisa? Eye
  wa sapuila Yehova ovisim\u0129lo viaye. Suku wo lembeleka ndati? Suku wa lekisa
  okuti wa kapeleko Eliya kuenda wa lekisa kokuaye ovindekaise viunene Waye. Eye wa
  vetiya Eliya poku u sapuila okuti handi o kuete esilivilo. Handi vali, Suku wa eca
  kokuaye o\u00f1uatisi yimue ukuacisola haeye wa lo\u00f1oloha.\\n\u25b8 Read about
  ElijahTanga eci catiam\u1ebdla ku Eliya: \u20141 Olosoma 19:2-18.\\nYovi\\n\u25cf
  Wa kala elie? Yovi wa kala usongui umue wepata okuti ohuwasi kuenda wa kala ufendeli
  wa Suku ukuekolelo.\\n\u25cf Momo lie a yonguilile oku fa? Omuenyo wa Yovi wa pongoloka
  vocipikipiki kuenda wa pita lovina vialua v\u0129vi. Eye wa pumba ukuasi waye wosi.
  Om\u00e3la vaye vosi va fa locilunga cimue. Eye wa kuatiwa luvei umue uv\u0129.
  Noke, wa lundiliwa okuti eye mu\u1ebdle o kuete eko, omo liovitangi a kala oku pita
  lavio. Yovi hati: \u201cNda suvuka omuenyo wange; si yongola vali oku kala lomuenyo.\u201d\u2014Yovi
  7:16.\\n\u25cf Nye co kuatisa? Yovi wa likutilila ku Suku kuenda wa sapelavo lomanu
  vakuavo. (Yovi 10:1-3) Eye wa lembelekiwa calua lekamba limue ukuacisola Elihu,
  una wo kuatisa oku limbuka ocitangi caye lonjila yimue ya sunguluka. Handi vali,
  Yovi wa tava ekuatiso kuenda elembeleko lia Suku.\\n\u25b8 Tanga eci catiam\u1ebdla
  ku Yovi: Yov 1:1-3, 13-22; 2:7; 3:1-13; 36:1-7; 38:1-3; 42:1, 2, 10-13.\\nMose\\n\u25cf
  Wa kala elie? Mose wa kala usongui wa va Isareli kuenda uprofeto umue ukuekolelo.\\n\u25cf
  Momo lie a yonguilile oku fa? Mose wa kuata upange walua woku linga, va enda oku
  u popia l\u00e3vi kuenje co sumuisile calua. Noke wa pinga ku Suku hati: \u201cH\u0129se
  oku ndi ponda cilo.\u201d\u2014Atendelo 11:11, 15.\\n\u25cf Nye co kuatisa? Mose
  wa lomboluila Suku ovisim\u0129lo viaye. Suku wo kuatisa poku leluisa ocikele caye
  cupange kuenda oku tepulula esakalalo liaye.\\n\u25b8 Tanga eci catiam\u1ebdla ku
  Mose: Atendelo 11:4-6, 10-17.\"", "\"A\\nABA\\n, Rom 8:15 tu kaluka hati, A., a
