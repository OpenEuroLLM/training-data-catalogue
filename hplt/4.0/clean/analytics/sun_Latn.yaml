  biladil ''ajamiyyah. Jeung ngembeng cai talaga sawah nu ayana antara Hamdzan jeung
  Qumma di negri ajam (Iran). Harita lahir Kangjeng Rosul sateuacan fajar dina dinten
  Sen\u00e9n ping dua welas Robi''ul Awal taun Gajah, saperti nu katelah, y\u00e9n
  Allah parantos nolak tur ngajaga tanah Haram Mekkah tina serangan pasukan Gajah.\\nKangjeng
  Nabi Muhammad SAW t\u00e9h hiji jalmi nu sampurna, dedeg pangadegna, sa\u00e9 budi
  parangina tur kagungan sifat-sifat nu luhung. Kitu deui jangkungna sedeng, kulitna
  bodas semu beureum, dua socana lebar jiga nu dicelak, bulu socana kandel halisna
  melengkung sa\u00e9. Waosna rada carang bahanmna lebar, katangen sa\u00e9 tur pikaresepeun
  pameunteuna, sa\u00e9 taarna lir bulan sapasi, daa jabhatin hilaaliyyatin.\\nKangjeng
  Rosul, kasaurkeun og\u00e9 damisna lemes pangampungna bangir. Taktakna lega dua
  dampal pananganana rarubak, ramo-ramo pananganana ararageung sakedik, kandel rumbahna,
  mastakana seseg, rambutna pantes dugika cepilna.\\nWabaena katifaehi hootamun nubuwwati
  qod ''ammahun nuru wa''alahu. Sareng diantara dua walikatna aya cap kanabian nu
  pinuh ku cahya nu sumirat. Karingetna saperti mutiara sareng seungitna ngadalingding
  leuwih seungit batan minyak kasturi. Angkatna tungkul jiga nu angkat mudun ti tempat
  nu luhur. Sareng nalika panangan nu mulya t\u00e9h sasalaman jeung batur, nya kaangseu
  seungit ngadalingding sababaraha dinten lamina. Marahmay pameunteu nabi nu mulya
  sapertos bulan purnama. Satiap jalma nu kantos tepang sareng nabi, bakal nyarita
  : y\u00e9n kaula can pernah mendakan jalmi nu nyarupaan boh sam\u00e9m\u00e9hna
  atawa sanggeusna.\\nKitu deui, Nabi Saw, hiji jalmi nu tawadhu, handap asor, kersa
  ngom\u00e9an tarumpahna sareng ngajahit raksukanana sarta ngalad\u00e9nan kulawargana
  ku ahlak nu mulya. Anjeunna og\u00e9 resep ka fakir miskin, sok calik sasarengan
  jeung maran\u00e9hna. Anjeunna sering ngalayad nu teu damang jeung nganteurkeun
  ka kubur sareng teu pernah ngahina jeung nganggap sap\u00e9l\u00e9 ka jalma nu fakir.
  Tara n\u00e9mbongkeun sikep ng\u00e9wa. Teu gimir ku raja, ambek jeung rido anging
  karana Allah ta''ala. Dina kapamingpinana, Kangjeng Nabi teu resep migaw\u00e9 nu
  taya gunana, sareng pangheulana ngucapkeun salam mun patepang jeung batur. Resep
  gaul jeung jalma-jalma nu dipandang mulya, gaul jeung jalma-jalma nu boga pangkat
  luhur. Tara nyarios naon wa\u00e9 anging \u00e9ta cariosan t\u00e9h bener sarta
  cariosan nu dipikacinta tur dipikaridho Allah Swt.\\nKu kamulyaan sareng sa\u00e9
  budi parangina Kangjeng Rosul, tangtos ieu t\u00e9h kedah janten tuladan dina kahirupan
  urang salawasna. Naon margina? Tangtos upami dipatalikeun sareng mangsa kiwari,
  ahlak kamulyaan hiji jalmi seueur nu tebih tina ahlak Rosul. Padahal, saur Kangjeng
  Nabi nyalira, Innama bu\u2019itsu li utamimma makarimal akhlak. Sa\u00e9stuna kuring
  diutus ka ieu alam dunya, pikeun nyampurnakeun ahlak. Malihan, upama ngabandungan
  kaum rumaja kiwari, geuning seueur pikahariwangeun wungkul. Mupusti idola, keur
  jadi conto, mod\u00e9l kahirupanana, geuning lolobana ka bangsa jalmi nu tebih tina
  agama. Boa-boa generasi ayeuna, loba teu arapal ka sang idola sajagat, idola nu
  teu aya tandinganana Kangjeng Nabi Muhammad SAW. Upama kitu kanyataanana, saha atuh
  nu kedah tanggung jawab? Naha mung bisa nyalahkeun balukar globalisasi atawa kab\u00e9basan
  informasi?\\nSababiyah Ningkatna Kaimanan\\nSaparantosna urang terang ka Rosul Allah,
  sanaos terang kana lahir sareng sipatna, mugia wa\u00e9 tiasa janten sababiyah pikeun
  ningkatkeun kaimanan sareng katakwaan urang ka Allah Swt. Margi, mustahil cinta
