  tuluy nuwuhkeun rupa-rupa tutuwuhan nu subur saperti amparan sutra. Nalika \u00e9ta
  deui, sakab\u00e9h pangeusi bumi ngilu ngarasakeun kagumbiraan saperti tukang mabok
