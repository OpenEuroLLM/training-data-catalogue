  tea atuh anu di sebut opat teh? Jeung anu mana anu disebut kalima pancer-na? Urang
  mimitian tina nalungtik diri maca awak urang heulanan. Dina awak urang aya anu disebut
  sisi opat diman nangtung, nyakujur, siga urang kapanan boga sisi hareup, sisi tukang,
  sisi kenca jeung sisi katuhu. Tah eta teh kapanan opat sisi sanes? Ari anu kalima
  na mana? Anu kalimana mah nya kapanan awak urang anu ngabogaan sakabehna. Ieu dadaran
  kasar dina ngajelaskeun sisi anu ku para sepuh rada teu patos diebrehkeun gancang-gancang,
  kusabab dina ngaguar dadaran ieu estuning henteu mung sakadar bacaan lahir wungkul,
  da upami diteraskeun mah jujutananan nyaeta muka lawang lain ngeunaan kumaha carana
  apal kana awak urang, samemeh urang apal ka Pangeran urang.\\nUrang teraskeun, dina
  ieu bacaan [ maca= ningali tina sisi lain/ makna palsapah] sakabeh unsur anu aya
  di alam, anu dilakonan, kalawan talajak manusa sakabehna, eta teh mangrupa simbol
  dina hirup kumbuh kumelendang di ieu alam, geura urang baca sisi hareup teh kapanan
  pikahareupeun, sisi tukang mangsa anu geus dilakonan, sisi kenca, sisi kagorengan,
  sisi katuhu harti tina sisi alus , kabeh diawak urang. Kamana urang nyanghareup
  (hirup) didinya urang ngabogaan opat perkara anu pasti jadi kalawan ngahiji diawak
  urang, kumaha urang nyanghareupan isuk, kumaha urang ninggalkeun waktu lalakon anu
