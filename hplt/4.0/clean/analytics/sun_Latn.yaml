  Nabi SAW tur rusak sakab\u00e9h ramalan dukun jeung geumpeur pandita-pandita Nasroni.
  Jeung para ahli pangaweruh, kullu habrin khobiirin wa fiihulaa husnihi taah, pada
  karumpul ngobrolkeun kah\u00e9ranan sifat kahad\u00e9an nabi. Sareng diuningakeun
  ka ibuna, y\u00e9n sa\u00e9stuna anjeun nuju bobot hiji pamingpin alam sareng pangsa\u00e9-sa\u00e9na
  mahluk. Sareng upami tos ngalahirkeun pasihan nami Muhammad karana anjeunna bakal
  jadi jalmi nu pinuji. Nalika nuju dina kandungan k\u00e9n\u00e9h, nya Sayyid Abdullah
  pupus di Madinah. Saparantosna Siti Aminah sampurna kandunganana, dina maleman dilahirkeunana
  Kangjeng Nabi sumping widadari-widadari ti sawarga. Nya karaos ku ibuna y\u00e9n
  bad\u00e9 ngalahirkeun. Solallahu ''alaihi wasallam nuuron yatala la''u sanah. Nya
  lahir kangjeng Nabi kalayan cahaya nu gilang gumilang. Wamuhayya kassamsi mina mudi''u
