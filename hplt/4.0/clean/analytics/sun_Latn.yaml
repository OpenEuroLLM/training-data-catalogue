  mastakana tanggah ka langit nu luhur. Tempat dilahirkeunana Nabi t\u00e9h di hiji
  tempat nu kasohor dipikampungan di kota Mekkah. Hiji kota nu dilarang di dinya pikeun
  nuar tangkal jeung nyabut tutuwuhanna. Ieu t\u00e9h m\u00e9r\u00e9 pituduh kana
  kapamingpinan tur kaluhungan martabatna.\\nIbuna nyauran \u00e9yangna Abdul Muthollib
  nu keur ngurilingan Ka''bah. Nya gasik anjeunna ngabujeng kalayan pasemon nu pinuh
  ku kagumbiraan. Lajeng \u00e9yangna ngalebetkeun Nabi SAW kana Ka''bah nu Mulya
  lajeng ngado''a kalayan ihlas. Toyyiban dahinan makhulatan bikuhlil ''inaayah ''aenahu.
  Kacida seungitna nganggo minyak tur disipat dua socana. Wadoharo ''inda wiladatihi
  khowariku wa goroibu goibiyyah. Dina waktos dilahirkeunana Nabi SAW seueur kajadian-kajadian
  nu luar biasa sareng kajadian goib nu matak ah\u00e9ng. Ieu mangrupi katangtosan
  kanabianana iber, y\u00e9n anjeunna Nabi nu dipilih ku Allah Swt. Nya ti kawit dibabarkeunana
