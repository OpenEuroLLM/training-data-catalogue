  Muhammad SAW t\u00e9h lebet kana rukun iman nu ka opat.\\nNaon sababna iman ka Rosul
  kalebet kana kaimanan? Margi Rosulullah teu wungkul wajib aya jirimna, tapi og\u00e9
  alatan Rosul ngemban misi ajaran nu hak (bener) mungguh Allah. Ieu nu sacara filosofis,
  henteu wungkul urang percaya, tapi wajib apal sareng ngajalankeun ajaranana.\\nLir
  Bulan Purnama\\nKangjeng Nabi Muhammad SAW t\u00e9h putra Sayyid Abdulloh bin abdul
  Mutholib nu katelahna Syaibatul Hamda, nu sa\u00e9 budi parangina. Bin Hasim jujulukna
  Amru bin ''Abdi manaf jujulukna Muhiroh nu salamina na\u00e9k tingkat kumargi kaluhunganana.
  Kaluhurna deui, bin Qushayyi jujulukna Mujammi Qushayyi, maksadna padumukanana di
  Qudu''ah nu nyengceling, fi biladi qudi''atal qosiyyah. Dugi ka anjeunna diuihkeun
  deui ku Allah ka kota Haram Mekkah nu dimulyakeun sareng anjeunna tisa ngariksa
  dirina tina rupi-rupi larangan nu aya di kota Mekkah.\\nKa luhurna deui bin Kilab,
  bin Murrah bin Ka''ab bin Lu''ayyi bin Gholib bin Fihr sareng og\u00e9 namina Quraisy
  nya ka Fihr. Ieu nu salajengna dinisbatkeun suku bangsa Quraisy. Sareng turunan
  ka luhurna deui Malik bin Nadlr bin Kinanah bin Khuzaemah bin Munrikah bin Ilyas.
  Nya anjeunna nu pang payunna ngahadiahkeun Onta di Mekkah. Bin Mudlor bin Nizar
  bin Ma''adi bin Adnan nu saterusana ka Nabi Ismail a.s bin Nabi Ibrohim a.s.\\nNalika
  Allah Swt. hoyong nyiptakeun Nabi Muhammad SAW sareng parantos ngagelarkeun jasmani
  sareng rohani dina sifat bathiniahna, nya Allah ngalihkeun nur \u00e9ta kana tempatna,
  nya\u00e9ta kana rahim Siti Aminah Azzuhriyyah. Sareng Allah nu Maha Caket nu ngobulkeun
  do''a tos nangtoskeun y\u00e9n Siti Aminah t\u00e9h mangrupa Ibu nabi nu pinilih.\\nDi\u00e9mbarkeun
  ka satungkebing langit sareng bumi, y\u00e9n Nur kanabian parantos aya dina kandungan
  Ibuna. Kaayaan sarupa kitu t\u00e9h kacida dihareupkeunana ku sakur jalma nu hoyong
