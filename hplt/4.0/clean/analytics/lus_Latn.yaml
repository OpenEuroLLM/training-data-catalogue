sample: '["\"Latest News\\nSerchhip Sub-Hqrs. YMA huamchhunga YMA Branch hrang hrangte
  Mizo Infiamna chi hrang hrang hmanga an inelna tur, \u2018Aizawl DD Mizoram Indigenous
  Games 2024 (Inter-Branch YMA Competition, Serchhip District)\u2019 chu nimin khan
  Serchhip P&E Veng-a Leisekawt Mual-ah neih tan niin Vawiin hian zawhfel a ni ang.\\nDamdawi
  dawr khar phut\\n- Other Apps\\nSerchhip Sub-Hqrs. YMA chuan New Ser-chhip-a damdawi
  zawrhna dawr pakhat chu sawrkar in an License cancel-a an dawr kharna tura hun a
  pek a liam hnuah pawh an la khar loh avangin he dawr hi tun thla chhunga insingsa
  fela khar turin ngenna pek nise an ti a. Hemi chhunga an dawr hi an la khar lo a
  nih fo chuan a \\\\ul anga hmalak zui nise an ti bawk.\\nComments\\nPost a Comment\"",
  "\"Chibai ule. Puipun nikhuaa insiamthat kan ngaihna hrang hrang kan ngaihtuah ho
  dawn a, kan tih thinte, kan tih lai mekte leh kan la tih ngai lohte pawh a awm ang,
  insiamthat kan ngaihnaa insiamthat duhna rilru pu chung a lo ngaithla turin ka ngen
  nghal bawk che u a ni.Hmasawn zel tur kan nihna kawngah kan tih lai mekte, a tul
  dan azira thlak danglama a tha zawk pawm thei tura kan inbuatsaih loh chuan hmasawn
  a har hle dawn a ni.\\nMihring hi a huhova khawsa, inmamawh tawn vek kan ni a, chhiat
  ni leh that ni nei thei vek leh hunpui eng eng emaw nei vek kan ni. Kan awmna hmun
  leh kan hnam kalphung azirin puipun nikhua kan hman dan pawh a inang lo nain hnam
  changkang ber atanga a hnuaihnung ber pawhin a huhova intawhkhawm leh thil tih ho
  kan nei lo thei lo a ni. Kan nunphung a inang lo ang bawkin kan hunpui hman dan
  pawh a inang lova.\\nAmaherawhchu, eng hnam leh ramah pawh khawtlang mithmuha mawi
  leh kalphung fel zawk hi chu a awm hrim hrim a ni. Tunah hian hnam dangte dinhmun
  kan thlir dawn lova, keimahni hnam, Mizoten kan hun hman dan chungchang leh insiamthat
  kan ngaihna laite kan sawi mai dawn a ni.\\nPuipunna hmun han tih hian a huhova
  kan awmkhawmna hmun concert atanga Biak In thleng pawh huamin, Ruai thehna hmun
  lam pawh sawi kai ta ila a rem tho awm e. Kan punkhawmna hmun azirin kan chetphung
  tur lehincheina thleng pawhin a mawi leh tihawm tawk pawh a awm zel bawk a ni.\\n1.
  Vantlang punkhawmna : Hall-ah emaw vantlang hmun remchanga concert leh programme
  hlimawm lam kan hmanna hmun hi kan mize lanchhuahna kan ti dawn nge mizia kan hloh
  tamna hmun kan ti zawk ang. A huhova han awm tak avanga nungchang mawi thauhthlaa
  mahni duh ang anga khawsa ta mai hmuh tur an tam thei thin hle a ni. Stage lama
  item nei mek tan pawha nuam tih lohna rawih tur khawp a lo khawsa leh lo au tial
  ta ruai ruai lah bo lo. Mahni bula mite tan pawh kan hnawk ange tih lam ngaihtuah
  miah lova mahni nuam tih ang zawng zawnga khawsak hi kan bansan a hun ta khawp mai.
  Heng ho, mi zinga awm tak avanga nunphung hloh ta tlatte avang hian concert leh
  puipunna ilova kal hreh ngawih ngawih an tam ta hle a ni. Chuvangin bul a mite tana
  hnawksak leh mit khama khawsak loh hi kan zir a ngai hle a ni.\\nZuk leh hmuam chungchangah
  hian sorkar lam pawhin a dona lamah hma a la nasa hle a, Vantlang punkhawmnaah phei
  chuan a khap hmiah a ni. Puipunna hmuna meizial kan zuk hian a zu ve lote tan a
  hrehawmin natna kan thlen phah hial thei a ni tih hriain kan insum a tul takzet
  a, insum harsa ti tan pawh midang awm lohna hmun fianrial pan mai tur a ni. Tin,
  Tuibur leh Khaini hi a hmuam ve ngai lo tan chuan a rim a nain a rimchhe khawp mai.
  Mipui hu ringawt pawh tawrh harsa a nih tawh laia Khaini leh Tuibur rim nena a inchiah
  tawh phei chuan tawrh hrehawm tak a ni tawh thin a ni. Sawi tawh ang khian kan chak
  viaua\\nkan insum thei ngang lo a nih chuan miin a rim an hriat theih lohna hmun
  lam pan mai kha mi pangngai tih tur a ni mai.\\nKan telna programme-ah hian kan
  mil zawng leh tuipui zawng chauh chanvo kan hmu lo mai thei. Kan tuipui lem loh
  zawng tak pawh lo awm se, kan tuipui lohzia tilang lem lova kan lo dawnsawn thiam
  a pawimawh hle a ni. Programme-ah khan thusawina hun a awm a tul miau chuan thusawi
  turin a sawi mai ang a, kan lo ning a nih pawhin bengchheng lo siama, lo ngaihsak
  lohte hi a mawi lovin kan tih loh tawp tur a ni. Chanvo hrang hrang pawh hlim taka
  lo dawnsawna chanvo neitu tan nuam ti taka a tih theihna tur boruak kan lo siamsak
  a ngai a, hlim taka lo lawm kan tum miau chuan tih theih loh tak pawh a ni awm love.\\nConcert-na
  hmuna ruih nei leh nei chiah lote pawh hlim taka an lo lam tha ve mai mai a nih
  chuan a tha reng mai, mahse tlangnel zualpuiten stage lama lawn an lo tum phet thin
  hian mit a tikham takzet a, chanvo nei mekte pawh an tibuai nasa thin hle a ni.
  Kan mi ngaihsan zawng tak pawh nise chanvo an neih laia lo tibuai zawnga ngaihsan
  kher hi lo tum loh a tha khawp mai.\\nThusawi chungchangah hian thusawitute hriat
  tur pawimawh tak tak a awm. Thusawituin thu a sawiin a ma tan ni lovin lo pungkhawm
  mipuite tan a sawi thin a ni. Mipuite tana sawi a nih avangin mipuite rilru hneh
  thei zawng leh ngaithla lo thei lova siam kan tum a tul. Mahni tui zawng a nih avanga
  mahni inbunruahna ang maia ngai a a ngaithlatute lam ngaihtuah lek lova thu sawi
  a awm thei. Chuvangin, a ngaithlatuten an lo dawnsawn dan zir pah reng chungin thu
  sawia, hmaraw hrang hrang hmanga mipui hip tum a ngai thin. Tunlaiah chuan eng thu
  pawh nise a rei lutuk emaw aw ki ngai reng leh chetze ngai reng lantir chunga thu
  sawiin lawm a hlawh lem lo. Ngun taka mipui mar dek chunga tawi fel leh ngaihnawm
  taka sawi thiam tum a pawimawh hle a ni.\\nVantlang punkhawmna atana programme siam
  hi uluk a ngai khawp mai. Programme kan siam tam takte kan inbuatsaih ang hua hlawhtling
  leh si lote hi programme kan siam uluk loh vang a ni chawk. Kan intawhkhawmna hlawhtlin
  leh hlawhtlin loh chu programme kan duan tantirh laiah hian a innghat thui hle a
  ni. Miin in a sak dawn chuan engineer-te rawn a a lem nen a neih sa emaw a satu
  turin a sak tan hmain a sak pum dan tur thleng a rilrua a awm tawh angin programme
  kan siam laiin kan mitthla-ah a taka kan hman dan tur fiah takin kan hmu lawk thiam
  tur a ni. Tlachawp taka hun kan hman hian ninawm lamah a kal a, inbuatsaihna tha
  lo chuan min tihlawhchham nge nge thin a ni. Kan hun hman tur atan chuan eng nge
  kan mamawh a, engtianga inbuatsaih tur nge tih ngun taka ngaihtuahin kan mamawh
  tur zawng zawngte ziaka fimkhur tak leh tha taka kan bawhzui thin chuan ka hlawhtling
  nge nge thin a ni.\\nThlirtu awma programme kan siamah Hall-ah a ni emaw Television
  lama mite lo thlir tur a ni emaw hmuh a nuamin mit a la tur a ni. Eng programme
  pawh siam ila a hmuhnawm loh chuan a hlawhtling lo a ni mai. Stage a chettlat a
  ni emaw Video camera hmaah a ni emaw kan chanvo theuhte chu hneh tak leh thiam taka
  kan tih theih nan inbuatsaihna tha kan mamawh a, inbuatsaih mumal mang lova kan
  ti a nih chuan ninawmah kan chang mai thin a ni. Mizote hi hlim hmel pu thiam lo
  tak hnam kan ni em aw? ka ti thin. Kan zaipawl zaite, lamthiam ho lam leh zaithiam
  ho zaite thleng hian mahni chanvo titha viau si hmuh nuam leh lawi si lo kan tam
  khawp mai. Kan zai a nih chuan kan ka chauh a zai tur a ni lova kan mitmeng, kut
  leh ke thlengin kan tan tlantir tur a ni. kan lam a nih pawhin kan kutzungtang hmawr
  lamin kan lamtir bawk tur a ni. Hlim hmel hian tu pawi mah a sawi lova mi rilru
  a hneh theih daih zawk avangin chanvo kan tih laiin a tul hunah hlim hmel kan put
  thiam a tul hle a ni. Mipui hmaa kan ding tawh a nih chuan a tha thei ang ber a
  cheta mi thinlung hneh tura kan thiamna zawng zawng kan sawm khawm thiam a ngai.
  Tum hmur chung a lamte, hmelah engmah tilang lova thirtiang dawlh ang maia ding
  mar ut chunga zaite leh peih loh hmel leh zam hmel lutuka programme kan kaihhruai
  hian a hmuhnawm lova, a ninawm bawk thin a ni.\\n2. Chhiat ni a kan chetphungah
  hian sawi tur tam tak a awm thei awm e. Veng hran khaw hranah tihdan phung inang
  lo hlek hlek chu awm thin mahse, a bikin thalaite mawhphurhna lam erawh a inang
  tlangpui a ni. Kan tihtur kan tih loh chhuanlamah \u2018tunlaiah chuan mi kan buai
  tawh a\u2019 kan ti fo thin. Mahse, kan duhzawng kan tihna lamah erawh chhuanlam
  tur kan haihchham hle thung si thin a nih hi. Thalaite kut bik liau liau heng -
  Khawhar lenpui, khawhar inriah, thlan laih, zualkoa kal leh thingpui lumahte hian
  thalaite kan inthlahdah ta hle niin a lang. Midang tihtura kan ngaih theuh chuan
  tuinnge ti ta ang le? Chhiat nia kan inthlamuana tlawmngai taka kan inpuihbawm thin
  avang hian Mizo nih hi a nuam thin a ni. Thalai nisi khawhar in kal, Lumen leh thlan
  laih tum miah lo kan tam ta. Mahni chunga a tlak huna harh chhuah chauh kan tum
  a nih chuan kan ti dik hauh dawn lo a ni. Chhiatna hi tu chungah pawh thleng thei
  a nih avangin kan indawmkana kan inthlamuan tel tel hi kan tihmakmawh a ni, Mizo
  kan ni si a.\\n3. Biak In hi Mizote chuan kan inhmuhkhawm zinna ber a ni awm e.
  Kan Pathian biakna hmun a ni a, kan hun hman dan inang vek lo mahse kan chettlat
  dan tur erawh chu a danglam tam thei vak thung lo a ni. Pathian kan biakna hmun
  thianghlim a nih avanhg hian inhmeh leh inhmeh lo pawh a tam thei awm e. Mizote
  hi inchei ngaina leh incheina lamah pawh mahni dinhmun phu lova inchei uar hnam
  kan ni hial angem? Hnam tin hian kalphung kan nei theuhva mi hnam tih dan leh kan
  tih dan a inanloh avang maiin a tu zawk zawk pawh dik lo tih ngawt theih a ni lo.
  Hnampui zawkte chu Biak Inah pawh nise incheina hian a tibuai lem lova, ho taka
  inthuam chung pawhin an inkhawm mai thin tia a hriaten an sawi thin hi kan hre theuh
  awm e. Mahse, chu chu kan entawn ve zel a tul em? tih erawh mahni theuhva chhan
  turin dah ta ila. Mizo rilru atang thlirin Biak In chhungah engtiangin nge inchei
  thin tur ni ang? Tun dinhmunah chuan Mizo mipui thlirna atang chuan kan neih tawkah
  mawi hnai leh fai taka inchei thin nise tih hi a la lian ber rih niin a lang. Amaherawhchu,
  uchuak leh hmuh nuam lo, Biak Ina Pathian chibai buk nena inhmeh lo zet a inchei
  erawh a mawi lo hle ang. Kan neih ang tawkah a zahawm leh hmuh nuam kan thlir thiam
  a tul a, pawnfen chhing lutuk leh tight tak leh thawmhnaw rang riai ruai nen a Bazar
  a kal tur ang maia inchei chunga Biak Ina inkhawm hi tun dinhmunah chuan Mizote
  rilruin a la pawm meuh lo niin a lang.\\nMizo Kristiante hian hunpuiah ruaitheh
  hi kan uarin kan la ti zel dawn ni pawhin a lang. Kutpui ilote kan ur nasain ruai
  han theh ngeite hian a tikalhkim ve riau a ni. Amaherawhchu, kan nunphung a changkan
  ang zelin kan ruaitheh dan pawh kan her rem thiam a pawimawh. Hmanlaiah chuan \u2018fatu
  kut an ten ngai lo\u2019 lo ti thin pawh nise, tunlaiah chuan fatu kut pawh mihring
  kut, bal ve thei tho a nih avangin fatu lam pawh kan fimkhur lehzual a tul a ni.
  Mipui vantlang ei tur ruai buatsaih kan nih avangin in lama kan chet thianghlim
  ang bawka kan chet thianghlim a ngai a, kan phak tawkah tuihnai leh thianghlim taka
  siam kan tum tur a ni. Ka hmelhriat pakhat Sapram Hotel changkanga eisiam chuan,\u201d
  Ei siam tui dan ber chu kan thil siam ei turte kha kan thilsiamah kan hmangaih a
  ni tih kan tilang ang a, uluk tak a duhsakna nena kan siam hian a tui ber thin\u2019
  a ti. Ka pawm zawng tak a ni. Ruai fatu pawh ni ila kan thilsiam eitu turte hmangaih
  tak leh duhsak tak chunga ei tur kan siam a nih phawt chuan a thianghlim ang a,
  a tui em em dawn a ni.\\nA tawpna atan chuan Mobile phone chungchang hi ka han sawi
  tel hram teh ang. Mizoram-ah mobile phone kan hmanna a la rei lo ang huin hmang
  tangkaitu kan tamin kan nitin nunah a bet tel ve ta tlat mai. Kum 7 liam ta, kum
  2004 kum tantir khan kan ramah BSNL ten Mobile phone min chhawp ve chauh a, tunah
  chuan anni bakah Reliance, Airtel, Aircel, Vodafone, Tata Indicom leh Idea ten bu
  an rawn khuar ta luih luih mai a ni. India hmarchhak ram kilkhawr tak pawh tunlai
  thiamna technology hian min rawn luhchilh ve zel a, thil tangkai tak ni mahse, kan
  hman thiam loh chuan harsatna min thlentu a ni thei thung a ni.\\nMobile phone kan
  hman hian midang tan kan hnawksak dawn em? tih kan ngaihtuah reng a ngai. Mipui
  zinga ring tak taka tawnga phone hmante a mawi lova, inkawmkhawm nikhuaa mahni phone
  khala mahni khawvel hran lo din vete hi a mawi lo em em a ni. Biak In lam thleng
  pawhin mobile phone a nih tlat avangin kan pai lut a, Inkhawm laia a rik bengchhen
  tak thut avanga mualpho ta pawh kan tam awm e. Biak Inah kan pai lut lo thei lo
  a nih chuan a ri lova dah emaw tihhlum emaw theihnghilh loh a tul. Inkhawmna urhsun
  lai taka phone ri hian rilru a la peng a, inkhawm boruak a tibuai thei hial a ni.
  Kum upa lam deuh zingah mobile phone nei ve si khawih thiam tam lem lo an tam hle
  a, a ri lo tura kan dah thiam lo a nih chuan pai loh law law mai kha a tha ber a
  ni, midang kan tihbuai theih avangin. Inkhawm lai a ri ni mai lo, Thusawitu mobile
  phone lo ri ta thut pawh sawi tur a awm nual a ni, hei hi a mawi lova, pumpelhna
  kawng kan zawn hram hram a tul a ni. Mi changkang pui pui rorelna leh inkawmkhawmna
  pawimawhah pawh mobile phone tih rik inthlahrung miah lo an tam khawp mai, rorel
  laklawh lai leh inkhawm lai pawh ngai pawimawh lo ni awm taka ti ri vak vak leh
  chhang ta lawng lawng kan tam ta, awmdan mawi zirtir ngai tawh awm lo takte hi mobile
  phone avangin awmdan mawi kan zir thar leh a ngai ta a ni.\\nTin, mobile phone hian
  a bikin thalaite a tibuaiin an nunphung pawh a thlak danglam hial ta niin a lang.
  Zirlai tam tak mobile phone vanga an nih tur ang ni ta lo an tam ta. Lehkhazir aia
  mobile phone khawih ching, tawngkaa sawi ngam loh tur mobile phone hmanga sawi ta
  zuah zuah kan tam tak avangin kan nitin nun thleng hian a tha lo zawngin min nghawng
  mek a ni. A hun leh hmunah a nihna ang takin hmang ni ila thil tangkai leh tha tak
  mai hi a hun leh hmun kan hriat loh thin avangin min timualphotu leh harsatna min
  thlentu a ni ta fo mai, kan fimkhur tlan a ngai a ni e.\\nKan thil sawi tak zawng
  zawng khaikhawmna atan leh kan ngaihtuahna luah atana ka duh chu thil tha zawk kan
  ti duh a nih chuan insiamthat kan ngai a, hmasawn tur leh kan tih fo thin thil tha
  lo leh mawi lo ti lo tura kan danglam ngam a nih chuan kan ram hian hmasawn turin
  beiseina eng tak a nei a, mitin hian a tha zawnga kan insiamtha duh a nih chuan
  ram leh khawtlang nuam zawk kan nei thei reng a ni.\\nA ngaihnawmin ka pawm zawng
  tak a ni lawm. Keep it up\\nReplyDeleteMiropui i nih leh nih loh chu ka hre lo na
  a, he i thusawi tur erawh hi chu thusawi ropui tak a ni tih erawh ka chiang e. Thu
  tha tak tak phuh chhuak thei mitlemte zing ami i lo nih ngei dawn hi.\\nReplyDeleteHV.
  I ngaihnawm tihzawng a nih chuan ka lawm e.\\nReplyDeletecaribou: Min tizak mai
  dawn alawm mawle:)\\nVery khrum.\\nReplyDeleteA chhiar a nuamin zawm awm tak a ni.\\n...khrum\\nNia..Khrum
  :) I tilawmawm e.\\nReplyDeletesei thin ve le aw...\\nReplyDeleteThu tha tak hlir
  a ni. I sawi awm tak a nih hmelin ka hria.. :)\\nReplyDeleteI sawi rei awm hle mai..
  :P\\nenga018, 15mins vel sawi atana ka ziak a nia a sei lo thei lo.\\nReplyDeleteZaia,
  i tilawmawm e\"", "\"Sinlung Hills Council Chief Executive Member thar atan Biaknunga
  chu nimin khan Dr. Lalhriatzuali Ralte, IAS, Deputy Commissioner, Aizawl District
  chuan rinawmna thu tiamtirin a la lut.\\nSinlung Hills Council Chief Executive Member
  ni lai Lalthlamuana Hmar-in ni 10 November, 2021 a banna a thehluh avangin, ni 23
  November, 2021-a Sinlung Hills Council General Council Meeting-ah Biaknunga, Saiphai
  Council Constituency chu chuhtu awm lova tlinga puan a ni a. Sawrkarin a pawm hnuin,
  nimin khan Sinlung Hills Council CEM atan lakluh a ni ta a, he lakluhna inkhawm
  hi K.Vanlalthiana, Secretary, Sinlung Hills Council-in a kaihruai a ni.\\nBiaknunga
  hi Saiphai khuaa piang leh seilian a ni a, kum 1992 a\u1e6dangin HPC Underground
