  30 gennaio Milano, Legend Club\\n- 31 gennaio Roma, Largo Venue\\n*post in aggiornamento\\nLeggi
  anche Musica 2022: nuovi album in uscita\"", "\"Intervista cun Giuseppe Pepe Cor\u00f2ngiu
  in contu de s\u2019\u00f9rtimu libru suo e de sos fen\u00f2menos culturales chi
  ant produidu sa situatzione presente.\\n\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026.\\n-
  A dies de oe \u2013 Annotos pro una limba sarda cuntemporanea e tz\u00ecvica est
  s\u2019\u00f2pera tua in libreria dae carchi mese. In pagas par\u00e0ulas ite propones
  pro sa limba nostra?\\nProp\u00f2ngio de l\u2019ammodernare impreeende sas normas
  ortogr\u00e0ficas standard unit\u00e0rias e sos cultismos tecnicos internatzionales
  cando servint. Prop\u00f2ngio unu sardu modernu e funtzionale a s\u2019usu. Non
  fatzo petzi teoria, b\u2019at pr\u00e0tica meda. So contra a s\u2019idea de su sardu
  che traste antropol\u00f2gicu e dialetale. Chie est pro sas variantes ufitziales
  in realtade pensat a s\u2019italianu comente limba standard. Ma non l\u2019amitit.
  S\u2019ipocrisia non m\u2019agradat ca est un\u2019istrategia de eutanasia sighida
  pro totu sa chistione.\\n- Su libru tuo in prus de \u00e8ssere unu traballu t\u00e8cnicu
  e sag\u00ecsticu, est finas un\u2019\u00f2pera militante in intro de su Movimentu
  Lingu\u00ecsticu. Pro ite faghes riferimentu a Simon Mossa, Lussu e Lilliu prus
  de sos \u00e0teros?\\nCa Simon Mossa in sos Annos Sessanta de su Noighentos est
  su fundadore de su Movimentu L\u00ecngu\u00ecsticu e est su primu in \u00e8poca
  cuntemporanea a disinnare su sardu che limba unit\u00e0ria natzionale sena r\u00f9ere
  in sa trampa de su folklore. Intro milli cosas, traduet finas sos evang\u00e8lios
  in sardu illustre liter\u00e0riu dende un\u2019idea de limba natzionale a parre
  suo. A dolu mannu no est ren\u00e8ssidu a publicare si nuncas forsis s\u2019ist\u00f2ria
  de sa limba diat \u00e8ssere mudada. Lussu e Lilliu, mancari in ritardu, ant fatu
  meda pro sa limba sarda in su printz\u00ecpiu de sos annos Setanta. Aiant prest\u00ecgiu
  pol\u00ecticu e culturale, autoridade: ant legitimadu unu movimentu galu minore.
  E ant sestadu sa caminera de Simon: torrare a cuberare sa limba negada de una natzione
  sena istadu comente a sas \u00e0teras minorias europeas che a catalanos, bascos,
  corsos, gallesos, galitzianos, iscotzesos, friulanos, germ\u00e0nicos, otzitanos
  e \u00e0teros. Unu progetu de rivitalizatzione natzionale e lingu\u00ecstica in
  ue sa limba est su fundamentu de s\u2019autodeterminatzione. Su neosardismu de sos
  annos sighentes s\u2019isvilupat pro more de custa madrighe origin\u00e0ria internatzionale
  e libert\u00e0ria. Lussu podiat f\u00e0ghere de prus in su pustigherra e durante
  sa carriera sua longa. Si nd\u2019est abigiadu a betzu mannu; a onni manera fiat
  favorevole a s\u2019unificatzione e l\u2019iscriet craramente a Lilliu.\\n- Imbetzes
  posca ite c\u00e0pitat? Pro ite su progetu no andat a a dae in antis? Cales sunt
  sas currentes ideol\u00f2gicas in contu de limba sarda chi oe in die si gherrant
  a pare?\\nS\u2019argumentu de sa natzione sena istadu e cun sa limba negada no est
  cumpartzidu, a difer\u00e8ntzia de sa Catalugna, dae s\u2019intelletualidade regionale
  chi at seberadu s\u2019italianidade e cheret abbarrare italiana. Gasi comente no
  est cumpartzida sa l\u00ecnia indipendentista de Simon Mossa e sa \u201clingu\u00ecsticu-natzionale\u201d
  de Lilliu. Sa chistione de sa limba divenit una cuntierra sighida, unu Vietnam in
  ue sos intelletuales italianistas cuntrastant cun trintzeas (semper diferentes e
  sighidas) dial\u00e8ticas e pol\u00ecticas sos neosardistas. Su Partidu eg\u00e8mone
  de sa cultura, su PCI, si ponet de rugradis vietende e iscomunighende a totus sos
  de su Movimentu Lingu\u00ecsticu. Intelletuales medas timent, mudant opinione e
  in medas comintzant a chircare mediatziones. Pro custa intelletualidade contr\u00e0ria
  su sardu est unu dialetu e non una limba, su progetu de limba natzionale est un\u2019artifitzialidade
  e sa limba aut\u00f2ctona est unu fatu cunservadore e regressivu. B\u2019at una
  Manca puru chi aguantat: in su matessi PCI de base e in formatziones che a DP sarda
  de Pisu e Casula. In parallelu, no isco cantu in collegamentu, si isvil\u00f9pat
  una currente interna a su mundu culturale prus aberta a sa chistione lingu\u00ecstica:
  s\u2019antropol\u00f2gia italianista. Est diferente meda, comente raighinas pol\u00ecticos
  culturales, dae cussa de Simon Mossa: derivat dae su traballu de Pasolini, chi in
  It\u00e0lia si chesciaiat ca sa modernidade faghiat m\u00f2rrere sa tzivilidade
  rurale. Est unu pensamentu nost\u00e0lgicu, utopista anti urbanu e anti modernista.
  Non si depet tantu punnare a una limba natzionale sarda, cantu a sarvare sos s\u00ecngulos
  dialetos de ogni s\u00ecngula bidda comente memoria de sa tzivilidade pastorale
  e massarile cugutzada dae sa \u201ccat\u00e0strofe\u201d de sa contemporaneidade
  de s\u2019industria e de su turismu. No est importante tantu sa p\u00e0tria sarda,
  ma sa traditzione folk, populare de cada s\u00ecngulu territ\u00f2riu. De sa trib\u00f9-bidda.
  Su pastoralismu divenit sa bandera de s\u2019identidade.\\n- A cumintzos de sos
  annos 80 est essidu \u201cSos Sinnos\u201d, de Mialinu Pira. Ite influ\u00e8ntzia
  at tentu custa \u00f2pera in sa cuntzetzione chi sos sardos tenent de sa limba sarda?\\nManna
  manna. Pira, in printz\u00ecpiu fiat contra a sa limba sarda. Posca at megioradu,
  ma no est mai divenidu unu segundu Simon Mossa comente si podet cr\u00e8ere. S\u2019est
  frimmadu a su dialetu locale comente limba universale. Culturalmente podet andare,
  ma politicamente nono. At lassadu un\u2019eredade manna in sa cultura regionale
  ca fiat efetivamente un\u2019\u00f2mine de ist\u00f9dios fungudos e de ideas brillantes.
  Una lumera de abist\u00e8ntzia in una Sardigna pobera de provocatziones culturales.
  In vida per\u00f2 no aiat tentu su cunsideru chi at tentu pustis mortu, cando sa
  publicatzione p\u00f2stuma de su romanzu antropol\u00f2gicu \u201cSos sinnos\u201d
  est cointzisa cun su fr\u00e0igu de sa positzione de sa currente antropol\u00f2gica
  de su movimentu lingu\u00ecsticu. Una deviatzione dae su surcu de Simon Mossa (e
  de Su P\u00f2pulu Sardu) chi colaiat dae s\u2019internatzionalismu de sas natziones
  negadas a sa defensa de su ruralismu e de sas faeddadas suas particularegiadas.
  In pr\u00e0tica b\u2019est su tramudu dae sos bi\u00e0gios mediterraneos abertos
  de Simon Mossa a su vill\u00e0giu pastorale tancadu de Pira. A onni manera Pira
  divenit unu totem de s\u2019identidade biddaresa de sas zonas internas e gasi finas
  sos ep\u00ecgonos suos.\\n- Sa presentada de Bachis Bandinu in \u201cSos Sinnos\u201d
  nde faghet parte integrante e sustantziale. Cales sunt sas ideas de fundu isvilupadas
  dae s\u2019iscritore antrop\u00f2logu?\\nTi torro gratzias pro custa pregunta ca
  est de meda chi penso chi, in su rispetu de sa persone e de s\u2019\u00f2pera, siat
  s\u2019ora de n\u00e0rrere, cun umiltade e costrutividade, chi Bandinu est unu intelletuale
  istoricamente discut\u00ecbile, in su sensu chi tocat a disc\u00f9tere bene sas
  ideas e sa prassi pol\u00ectica chi at ispainadu e su rolu suo de leader e babbumannu
  de su Movimentu Lingu\u00ecsticu, Sardista e Indipendentista. Custu finas pro li
  torrare meressimentu de s\u2019import\u00e0ntzia chi at tentu e tenet, cosa chi
  at abbarrare e non ch\u00e8rgio negare, gasi comente su m\u00e8todu suo de influentziare
  pol\u00ectica e cultura. Bandinu iscriet s\u2019isterrida a custa \u00f2pera chi
  pro more chi est torrada a cuberare post mortem, e duncas finas incumpleta, est
  iscrita male, sena peruna coer\u00e8ntzia ortogr\u00e0fica. Un\u2019esempru de non
  sighire, naramus, postu per\u00f2 a lumera. Dae in cue, a ind\u00f2rriu de su totem
  Pira, si fraigat una positzione noa oposta a Simon Mossa. Si dat fundamentu a sa
  visione anti modernista e si sestant finas sas ideas fortes de custa visione alternativa
  antropol\u00f2gica de sa chistione de sa limba. Est una contzetzione totu in intro
  de l\u00f2gicas culturales demol\u00f2gicas, semi\u00f2ticas italianas (mescamente
  De Martino e \u00e0teros) chi per\u00f2 agatat sustegnu e cumpartzidura manna in
  s\u2019\u00ecsula ca cunsonat cun su localismu e munitzipalismu traditzionale e
  non ponet in duda sa filologia e dialetologia acad\u00e8mica chi pintat su sardu
  comente una limba arretrada, non natzionale ca divisa in variantes (e pensat in
  fines chi s\u2019italianu depet abbarrare sovraordinadu a su puzzle de limbas rurales
  sutastantes). In custa mirada, finas si cun atzentos e raighinas diferentes, si
  ponent \u00e0teros intelletuales contr\u00e0rios a una limba natzionale che a Giulio
  Angioni chi, pro totu sa vida sua, at a cuntierrare contra a s\u2019idea. \u201cLa
  scuola antropologica di Cagliari\u201d gasi si narat, si faghet mere de sa pol\u00ectica
  lingu\u00ecstica alternativa e influentziat meda s\u2019opinione p\u00f9blica e
  sa pol\u00ectica chi detzidit. Bastat a l\u00e8ghere sas rassignas de s\u2019imprenta
  de s\u2019\u00e8poca.\\n- In sos matessi annos est essidu \u201cS\u2019\u00e0rvore
  de sos tzinesos\u201d de Larentu Pusceddu. Ambos duos libros, li dant, a su sardu,
  su rolu de protagonista. Ma in manera diferente.\\nPusceddu est su chi pro primu
  p\u00f9blicat unu romanzu pol\u00ecticu in sardu iscritu cun s\u2019idea de una
  limba natzionale e non de unu limb\u00e0giu locale antropol\u00f2gicu. S\u2019operatzione
  de publicare a Pira est craramente pol\u00e8mica cun Pusceddu. Si discutit finas
  de chie aiat iscritu pro primu in realtade, si Pira o issu. Curiosamente nemos pensat
  ancora a torrare dae s\u2019ism\u00e8ntigu sos evang\u00e8lios de Simon Mossa. S\u2019autore
  de Oroteddi est finas atacadu publicamente in giornales pro comente at iscritu.
  Est una cumbata pro s\u2019egemonia interna. A cussu puntu su Movimentu Linguisticu
  est gia partzidu in duas: antropologia popolare versus normalizatzione unit\u00e0ria.
  Sa cuntierra at a durare e durat finas a oe cun corpos mannos, ambiguidades, mediatziones,
  derrotas e b\u00ecnchidas, e pass\u00e0gios finas dae unu fronte a s\u2019\u00e0teru.
  S\u2019iscola lingu\u00ecstica antropol\u00f2gica at unu vant\u00e0giu chi at \u00e8ssere
  detzisivu: su pensamentu suo no est anti sistema e est funtzionale imbetzes a s\u2019amasedamentu
  folkloristicu e paesanu de sas ist\u00e0ntzias natzionales sardas e a su mantenimentu
  de s\u2019italianu comente limba eg\u00e8mone finas cuntzedende a su sardu carchi
  isp\u00e0tziu minore folk (poesia, cantu e literadura mescamente). Si podet n\u00e0rrere
  chi est a s\u2019imbesse de s\u2019idea de Simon Mossa e finas de sa cuntzetzione
  gramsciana. In pr\u00e0tica est un\u2019interpretatzione mim\u00e8tica de s\u2019idea
  chi cunsentit un\u2019acordu, sena tropu gherras, cun su sistema italianista.\\n-
  E a dies de oe comente semus. Ite est capitadu?\\nCun sa lege 26 de su 1997 sa trintzea
  de sos contras si fiat assestada in sa contrapositzione \u201climba e cultura\u201d.
  E at bintu sa currente anti limba. Cun sa lege 482/99 de s\u2019istadu imbetzes
  s\u2019est isvilupadu unu movimentu lingu\u00ecsticu nou modernu e normalizadore
  chi pro una bindighina de annos at torradu a leare s\u2019\u00e0ndala de una limba
  istandardizada e cuntemporanea produende ufitzios, s\u00f2tzios, iscolas, m\u00e8dias,
  istrumentos tecnol\u00f2gicos, operas liter\u00e0rias de bundu, dib\u00e0titu mannu
  e\u2026 sa Limba Sarda Comuna, s\u2019\u00f9nica proposta de comintzu nou pro una
  limba natzionale sarda. A pustis de sa pol\u00e8mica tra su Serv\u00ectziu Limba
  Sarda e sas Universidades in contu de insingiare in sardu o in italianu, in su 2012,
  s\u2019est pesada una reatzione forte de s\u2019italianismu. Sa currente antropol\u00f2gica
  at apogiadu sa restauratzione de una politica lingu\u00ecstica amasedada in s\u2019usu
  de sos dialetos, in sa negatzione de sa Limba Comuna Natzionale e in s\u2019afortigamentu
  de sa divisione traditzionale tribale intre campidanesos e logudoresos. Neghende
  de facto s\u2019unidade. Est unu fatu chi in custu traballu, a bisu meu reatzion\u00e0riu,
  sa Fondazione Sardinia, apat tentu unu rolu forte de influ\u00e8ntzia politica e
  culturale cun sos guvernos regionales. Est craru chi sa lege 22/2018 est istada
  unu tentativu, renessidu solu in parte, de torrare in segus: si preferit oramai
  su cuntzetu de \u201climbas sardas\u201d e non de limba sarda unit\u00e0ria. Finas
  cun sa Cr\u00e8sia s\u2019est chircadu de imp\u00f2nnere unu bipolarismu lingu\u00ecsticu
  artifitziale.\\n- Ma pro sa limba impreada, totu custa contrapositzione, ite cunsegh\u00e8ntzias
  at?\\nCusta disamistade at minimadu sas fortzas complessivas de su Movimentu. Oe
  in die s\u2019idea de limba natzionale de Simon Mossa est in per\u00ecgulu, ma peus
  ancora mancat su dib\u00e0titu de unu tempus. Est esaltadu su cuntzetu omeop\u00e0ticu
  de sas variantes, gasi comente naraiat Angioni. Si insistit finas in sa promotzione
  de sa Die de sa Sardigna a pitzu de custa divisione tra logudoresu e campidanesu,
  dende fortza a fatziones negativas e de bassu livellu culturale chi ant giogadu
  a faghere sa gherra personale a sos de sa LSC. Custu fronte faghet su giogu de s\u2019ist\u00f2ria
  de sos colonizados. Nde essit a fora una pol\u00ectica lingu\u00ecstica prus p\u00f2bera,
  sena ambitziones, bona solu a memorial\u00ecstica personale, individuale, a sa po\u00e8tica
  de su vill\u00e0giu de Pira (o de Benvenuto Lobina) chi agradat meda a sos acad\u00e8micos
  sardos ca no istrobat su dom\u00ecniu primorosu de sos italianistas.\\n- Su l\u00e8ssicu
  traditzionale. Giustu est chi tzertas par\u00e0ulas t\u00ecpicas de una o pagas
  biddas abbarrent in s\u2019orizonte limitadu de sa particularidade locale, o no
  est m\u00e8gius chi s\u2019isp\u00e0inent, intrende in unu tzirc\u00f9itu prus mannu
  de comunicatzione in limba sarda?\\nA bisu meu custa est sa medida e finas sa met\u00e0fora
  pretzisa. Sos limb\u00e0gios si defensant m\u00e8gius cun una limba istandard chi
  regollet e magonit sa sienda de sas biddas e de sa literadura. Sas par\u00e0ulas
  totus in pare bi la faghent, cadaunu a contu suo nono. In su libru \u201cA dies
  de oe\u201d chirco de agiuare chie iscriet in sardu a f\u00e0ghere s\u00e8beros
  personales, ma segundu unu m\u00e8todu generale. No est beru chi sa LSC aurtit sas
  particularidades. A parte chi unu podet faeddaere e iscr\u00ecere in su dialetu
  de bidda sua cando cheret, gasi comente fatzo deo, ma in intro de sas normas iscritas
  chie si siat podet p\u00f2nnere su l\u00e8ssicu chi bolet, finas sos t\u00e8rmines
  prus curiosos de bidda sua. Bastu chi rispetent sas r\u00e8gulas de s\u2019ortografia.
  Gasi mi creo chi sa richesa de sas particularidades siat prus amparada cunforma
  a chie iscriet cun grafias personales imbentadas, non cumpartzidas dae autoridades
  e chi tz\u00ecrculant petzi in sa bidda matessi. Semus bidende esempros orrorosos
  finas legitimados dae su dinare regionale.\\n9)\\nSu traballu terminol\u00f2gicu.
  Cantu podet agiuare s\u2019isvilupu de limb\u00e0gios de setore chi nche colent,
  nessi a livellu ispetzial\u00ecsticu, sa frammentatzione dialetale?\\nSa terminollogia
  est sa base de subraviv\u00e8ntzia de una limba, ma meda de sos sardos non lu cumprendent.
  Sas universidades (chi sunt contras a s\u2019idea de una limba natzionale) galu
  oe non si sunt atretzadas e sighimus a t\u00e8nnere cumpet\u00e8ntzias ist\u00f2ricas
  e non de rivitalizatzione. Est craru chi sa visione antropol\u00f2gicu-filol\u00f2gica
  paret binchende petzi ca presentat su sardu folk e masedu comente agradat a su poderiu
  culturale primorosu. Su pensamentu de sos antrop\u00f2logos est perfetamente funtzionale
  a su mantenimentu de su sistema. E sos chi l\u2019adduint sunt cuncambiados cun
  sa legitimatzione sotziale de su rolu intelletuale issoro e cun una visibilidade
  medi\u00e0tica esagerada. Imbetzes sos chi cherent una limba natzionale sarda sunt
  aorados, delegitimados, emarginados e presentados comente \u201cestremistas\u201d
  chi non sunt a tretu de \u201dgestire\u201d ca \u201cbrigant\u201d. Ma, deo penso
  chi finas custa fase at a colare e s\u2019at a ren\u00e8ssere a f\u00e0ghere a cumpr\u00e8ndere
  m\u00e8gius sas resones \u201cnatzionales\u201d. Est una rivolutzione chi si depet
  \u00e0ere s\u2019atza de sighire cun coer\u00e8ntzia, mancari chi in minor\u00e0ntzia.
  Calicunu at iscritu chi sa cuntierra chi si nde pesat pro more de sa LSC non faghet
  a bajulare e chi sa paghe intro sardos est imbetzes su valore de acumprire. Deo
  non so de acordu, ca cussa no est paghe, ma isperd\u00ectziu de energias de sardidade,
  pro non n\u00e0rrere oportunismu. Mi diat pr\u00e0ghere si, movende dae custas timorias
  mias e dae su libru chi apo iscritu, su cunfrontu esseret torradu biu, finas ca
  no apo peruna beridade in busciaca, ma petzi gana meda de imparare e conn\u00f2schere.\\nIntervista
  de Salvatore Serra\\nLeave a comment\"", "\"I risultati: Garibaldi \u2013 Pasta
