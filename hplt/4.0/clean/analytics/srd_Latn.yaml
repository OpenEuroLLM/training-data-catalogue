  en m\u00fasica Italian musicare German in Musik setzen (um), vertonen.\"", "\"de
  M\u00e0uru Piredda\\nNon petzi leges pro su referendum\\nindipendentista. Su \u201cParlament\u201d
  at aprovadu una motzione presentada dae\\nsos populares in contu de pol\u00ectica
  \u00e8stera. L\u2019ant votada finamentas sos\\ndemocr\u00e0ticos de Puidgemont
  e sa manca riformista de Erc (est a n\u00e0rrere\\nsos de Junts pel S\u00ed). Contr\u00e0rios
  sos de Catalunya si que es pot e sos\\nanticapitalistas de sa Cup. De ite chistionat
  sa motzione? De deretos\\numanos violados in Venetzuela. Solidariedade, in antis
  de totu, \u00abcun\\ntotu sos presoneris pol\u00ecticos ventzuelanos\u00bb. Sa l\u00ecnia
  \u00abla votamus ma...\u00bb\\nl\u2019ant adotada JxS\u00ed (\u00abEmmo, ma su Pp
  no est solidale cun sos cundennados\\ncatalanos pro \u00e0ere aprontadu sas urnas
  de su 9N\u00bb) e sos sotzialistas\\n(\u00abSituatzione vulner\u00e0bile in Venetzuela
  ma viol\u00e8ntzias dae ambas\\npartes\u00bb). Sos contr\u00e0rios ant faeddadu
  de aus\u00e8ntzia de allegas in contu\\nde corrutzione e de gherras (Csqp) e de
  sovranidade de sa Rep\u00f9blica\\nbolivariana (Cup). Carles Riera - de sos comunistas
  indipendentistas -\\nat naradu chi \u00abin Venetzuela b\u2019at una gherra pro
  su prus giatzimentu\\nmannu de petr\u00f2liu in su praneta\u00bb e chi sa partida
  est \u00abintre sas classes\\npolulares e sas oligarchias\u00bb.\"", "\"Su monte
  ''e mesus\\nTue ses cuddu monte addisertatu\\nTottu roccas lanitas e pischinas\\nEstitu
  de piantas elichinas\\nDae battor muntagnas coronatu\\nNara, cantos e chie as ospitatu\\nChin
  bardanas recattos e rapinas\\nUe sintennet, grunitas chervinas\\nDae \\\"Pedde Niedda\\\"
  a \\\"Su Serratu\\\"\\nShaeres saeddu sa memoria,\\nMi dias narrere monte, cantu
  as bistu\\nPro ne dare a su munnu, sa notoria\\nDe sos cas intro e sinu custoditu\\nPicca
  sa pinna e fache un istoria\\nE nara chie ses monte lanitu\\nMontes solos , nieddos
  attumbatos\\nChi non bintrat nen sole ne ispera\\nArta e profunna tanes sa montera\\nSirte
  sicura de sos male amatos\\nInue soso bannitos taglionatos\\nTenene sotellu issoro
  ei sostera\\nA ba e torra chin sa banda intrea\\nCarranne porcos e boes furatos\\n\\\"S
  Aitu de su Chercu\\\" fachet porta\\nNe apparit sa prima piazza\\nCarraglios de
  cuare zente morta\\nAves rappazes, nidos in razza\\nInue est sa ladruncola raccorta\\n\\\"Su
  Serratu\\\", \\\"Su Fruschiu\\\" e \\\"Tramazza\\\"\\nMi natunu istasero a fine
  die\\nTi cheret a su monte su bannitu\\nAnnatu so e lacato ischitu\\nChin sa cungrega
  sua rie rie\\nVatu mat sedere, chenatu apo inie\\nPorcheddos cottos e vinu isquisitu\\nPoi
  modestamente mat pettitu\\nCazzones bellas pro sinnamorata\\nDadu ne lapo e in cussa
  nottata\\nSi mest fata sa cara in tela e nie\\nChintenno un eco, eh! Gesu Maria!\\nLi
  nesi, cussest omine morinne\\nE Mi risponnen, eh! Times sistria\\nEi su chervu in
  amore gruninne\\nNara cazzones e importatinne\\nChinoche est sa verrea cumpanzia\\nGhetateli
  de cussa malvasia\\nChi Crapinu nor morit de ispantu!\\nE jeo lir risponno attere
  tantu\\nGiuro chi non che torro atera via\"", "\"Santu Sperau. Bortadu dae Tiziana
  Sotgiu\\nSantu Sperau de Attilio Mastino est s\u2019art\u00ecculu beru chi aia bortadu
  pro Logosardinia n 1 Cabidanni 2008\\nSu beranu longu de Santu Sperau est cumintzadu
  como baranta annos, in su 1968, a pustis de su bi\u00e0giu de Pin\u00f9ccio Sciola
  in Ispanna e posca in una Parigi in alborotu pro su bentu de sa contestatzione de
  su maju istudentescu e a pustis in M\u00e8ssicu, in sa cherta de un\u2019edade m\u00ectica
  bisada e desigiada dae meda: cun custu vol\u00f9mene a incuru de Ott\u00e0vio Olita
  semus giutos a manu tenta in sas intervistas de medas protagonistas de tando a torrare
  a iscoberrer sas rajones pro sas cales sa bidda de massajos de su Campidanu s\u2019est
  ischidada dae unu sonnu millen\u00e0riu, cando totus sos abitantes suos de repente
  si sunt apassionados de arte, ant cr\u00e8tidu in sa revolutzione de s\u2019isc\u00e0ngiada
  de laras, sunt cr\u00f2mpidos a un\u2019\u00e0ndala culturale chi est istada puru
  un\u2019esperi\u00e8ntzia colletiva chi podimus reconnoscher intrada comomai in
  s\u2019ist\u00f2ria de Sardigna. Sas imm\u00e0gines in biancu e in nieddu de Nanni
  Pes faeddant prus de sas par\u00e0ulas cun una profundidade de pranu chi ispantat,
  faghent torrare a biver sos tempos colados de sa bidda de terra crua chijinada dae
  sa bisura de pant\u00e0sima chi de repente est dev\u00e8nnida bianca nida, at iscobertu
  torra sos colores, sas figuras, sas emotziones, at cundividu sa passione, sas curiosidades,
  sos dis\u00ecgios de unu piseddu comente \u00e0teros, cramadu a ghiare totu sa gente
  sua, chi no est abarrada pompiende ma s\u2019est fata amajargiare e puru seduire,
  at b\u00ecvidu e sufertu agiomai una maladia comente s\u2019esseret perseghidu dae
  un\u2019epidemia bona.\\nLeghende custas p\u00e0ginas m\u2019est b\u00e8nnidu a
  conca su fatu istraordin\u00e0riu contadu dae Luciano de Samosata in s\u2019abbistu
  vol\u00f9mene suo Come si deve scrivere la storia chi agiomai non tenet sos duam\u00ecgia
  annos suos: \u00abnarant chi in su tempus de su rennu de Lis\u00ecmaco a pustis
  de sa morte de Alessandro Magno, una maladia aiat fertu sos Abderitos, sos abitantes
  de Abdera, una tzitade de sa Tr\u00e0cia: pustis de esser andados a teatru e aer
  ascurtadu s\u2019atore tr\u00e0gicu Archelao chi retzitaiat s\u2019Andr\u00f2meda
  de Eur\u00ecpide, in antis totu paris aiant leadu sa calentura, forte de repente
  dae cando fiat intrada e a continu; pustis a probe a su de sete die unos cantos
  perdiant s\u00e0mbene meda dae nares, \u00e0teros fiant cobertos de suore, custu
  puru bundante, chi los aiant liberados dae sa frea. Aiant per\u00f2 bortuladu sos
  cherbeddos issoro. Totu difatis diliraiant pro sa trag\u00e8dia, sonaiant giambos
  e si pesaiant a tzich\u00ecrrios malos. Cantaiant mescamente sas monodias de s\u2019Andr\u00f2meda
  de Eur\u00ecpide e daiant un\u2019interpretesa canora a su chistionu de Perseo.
  E sa tzitade fiat prena de totus custos tragedos de su de sete die, biancos nidos
  e illangigados, chi a boghes postas tzichirriaiant unos cantos versos. E custu pro
  meda, finas a cando intradu s\u2019ierru cun fritu mannu los aiat bogados dae s\u2019ammachiadura
  issoro\u00bb.\\nSu male abder\u00ecticu, custa genia de pid\u00e8mia art\u00ecstica,
  si fiat ist\u00e8rrida in sos tempos de Luciano cando totu si sunt postos a iscrier
  s\u2019ist\u00f2ria e non bos p\u00e0rgiat feu si apo pensadu de lu cullegare cun
  sa passione repente e su berbore chi at fertu totu in unu sos abitantes de Santu
  Sperau, comente ipnotizados totus paris e tragiados in sa passione pro sa pintura
  e pro s\u2019arte.\\nCustu vol\u00f9mene costoit s\u2019ammentu de sas fases cuntrastadas
  de sa muda de s\u2019antiga bidda de massajos, trumentada a fitianu dae sos aundamentos
  de duos fr\u00f9menes, su Riu Mannu-Fl\u00f9mini e su Bonarba, caraterizada dae
  traditziones belle preist\u00f2ricas, dae un\u2019economia de c\u00e0mbiu torradu
  e de subrabiv\u00e8ntzia fundada subra traballos antigos, s\u2019andare a caddu
  de s\u2019\u00e0inu, su laore atidu in edade romana in un\u2019\u00ecsola chi fiat
  pro Cicerone unu de sos tria frumentaria subsidia rei publicae.\\nUna bidda chi
  a pustis at retzidu su cantada de sirena de su mitu, unu mess\u00e0giu de armonia,
  paghe e cultura, giutu dae sos artistas b\u00e8nnidos dae totu su mundu comente
  Eug\u00e8nio Barba cun su suo Odin Teatret, sos tedescos Elke Reuter, Rainer Pfnurr,
  s\u2019olandesu Meiner Jansen, s\u2019isv\u00ectzeru Otto Melcher, intre sos sardos
  Foiso Fois, Giorgio Princivalle, Primo P\u00e0ntoli, Gaetano Brundu, Giovanni Thermes,
  custos \u00f9rtimos caraterizados dae un\u2019astratismu forte e simbolismu: tando
  sos muros benint pintados de biancu, benint arrebussados sos matones de terra crua,
  sos carater\u00ecsticos ladiris chi ammentant una t\u00e8cnica edil\u00ectzia documentada
  in Sardigna dae s\u2019iscritore Pall\u00e0dio in su VI s\u00e8culu d.C., sos l\u00e0deres
  de arghidda e p\u00e0gia fatos in beranu e mentovados in su de lateribus faciendis.
  Arribant sos murales astratos, simb\u00f9listas, neorealistas, espressionistas,
  cubistas, chi faeddant de unu mundu prus mannu pro m\u00e8diu de imm\u00e0gines
  ischem\u00e0ticas ispiegadas a fitianu cun didasc\u00e0lias, una forma noa de epigrafia
  populare destinada a abarrare pagu. Ma s\u2019iscopu no est cussu de fagher galana
  una bidda fea, est mescamente cussu de agatare unu motivu pro unu mamentu mannu
  de partetzipatzione comunit\u00e0ria e de dibata subra s\u2019arte populare, in
  su matessi tempus s\u2019Ente Flumendosa bonificaiat su terrot\u00f2riu comunale
  e cumintzaiat sas canalizatziones chi galu oe cunsentint de abbare una camp\u00e0nnia
  chi frorit cun ispantu, cun sos frutor\u00e0rgios suos e sas camp\u00e0nnias losanas.\\nCustu
  no est per\u00f2 un\u2019obus tzelebrativu ca Ott\u00e0vio Olita est res\u00e8ssidu
  a beru a nde bogare s\u2019ispizu de sas pol\u00e8micas de tando, sas contierras
  intre artistas, sa duresa de un\u2019isc\u00f2ntriu chi at apassionadu e partzidu
  sa bidda, a su puntu chi b\u2019at calicunu chi tenet a dolu sos tempos in ue s\u2019amministratzione
  comunale de destra fiat contra a sos murales e a s\u2019arte.\\nApo tentu a notu
  sos cunsideros abbistos medas de Am\u00e0lia Schirru e de \u00e0teros intervistados,
  capatzos de dare una l\u00e8ghida non conventzionale de unu fatu art\u00ecsticu
  chi est istadu pro annos suta sos ogros de sos m\u00e8dios massivos e chi at cundidu
  medas \u00e0teras biddas dae Serramanna cun Ant\u00f2nio Ledda e Ferdinando Medda,
  a Villasor, a Org\u00f2solo cun Francesco Dal Casino, a sa matessi N\u00f9goro,
  a Ul\u00ecana, a Otieri, finas a arribare in su tempus de oe in Tinnura in Pran\u00e0rgia.\\nSu
  rolu de s\u2019imprenta a iscoberrer custu fatu, de su beranu de Santu Sperau est
  istadu de importu mannu, comente testim\u00f2niant Vittorino Fiori, Ott\u00e0vio
  Olita, Gianni Perrotti, R\u00f2molo Concas s\u2019ingorrosu, totu trisinados paris
  pro leare a cunsideru unu fen\u00f2menu \u00f9nicu chi partziaiat e apassionaiat.\\nSobrat
  in custas p\u00e0ginas sa figura carism\u00e0tica de Pin\u00f9ccio Sciola, a probe
  de sos maistros suos e metzenates, Foiso Fois, Guido Vascellari, in Salisburgo Em\u00eclio
  V\u00e8dova e pustis Gi\u00e0como Manz\u00f9: in sas par\u00e0ulas de chie l\u2019at
  connotu pitzinneddu, Pin\u00f9ccio aparessit sena mancu sas botas a sos pees, ma
  giai inghiriadu dae afetu, istima, isperu, afetzionadu a sa bida de sa bidda chi
  s\u2019isvilupat cun una sotzialidade ispantosa in sas chentinas e in sas coghinas,
  insertada in sa camp\u00e0nnia, ma in su matessi tempus prenu de curiosidade, desigiosu
  de lassare un\u2019istiga de sese subra cudda pedra chi pagas bortas s\u2019agatat
  in sas camp\u00e0nnias campidanesas: tando in antis de totus sa collidura de sas
  molas ispartighinadas in camp\u00e0nnia, leadas pro decorare sas pratzas, a pustis
  su traballu cun sos amigos, sas medas ideas istravanadas. E pustis sos bi\u00e0gios,
  a Firentze, in sa Madrid franchista in sa Moncloa, a Bartzellona, posca a Parigi,
  Salisburgo, in su M\u00e8ssicu a tesu in s\u2019iscola de D\u00e0vide \u00c0lfaro
  Siqu\u00e8iros, peri sugestiones visivas e ispintas chi andant dae s\u2019arte pre\u00b7columbiana
  a su realismu sotzialista. Pro Renata Serra, chi est s\u2019istudiosa chi pro sa
  prima borta at refl\u00e8tidu subra custos temas cun una prufundidade istraordin\u00e0ria,
  Sciola no assorbit a manera indistintiva cales si siant datos de sas culturas messicanas
  ma faghet un\u2019isseberu cussiente, chi ruet non subra sa figuratividade maya,
  chi si chirrat dae unu horror vacui acadriadu, dae unu decorativismu abejadu, dae
  unu barocu ante litteram, ma subra s\u2019edade m\u00ectica de s\u2019oro de s\u2019immagin\u00e0riu
  precolumbianu, subra s\u2019edade cl\u00e0ssica pro s\u2019elaboratzione de unu
  sistema eur\u00ectmicu de gr\u00ecllias geometrizantes intro ue s\u2019istruturat
  s\u2019imm\u00e0gine.\\nNomenadu ispetore archeol\u00f2gicu de sa Sobrintend\u00e8ntzia,
  Pin\u00f9ccio at tentu relatas cun sos prus cualificados istudiosos sardos, comente
  Giovanni Lilliu, Alberto B\u00f2scolo, e Salvatore Naitza, de su cale nos abarrant
  in custas p\u00e0ginas duas testimoni\u00e0ntzias pretziosas medas dae sa profundidade
  rara: deo ammento s\u2019amistade de Pin\u00f9ccio cun Renata Serra e cun Giovanna
  S\u00f2tgiu, chi m\u2019at fatu balangiare pro su coju meu su presente de un\u2019iscurtura
  de linna de mata de olia de una mama e de unu pitzinnu paris cun una pintura subra
  de su matessi sugetu, belle unu murale cun sas manos e sos pees isermorados comente
  in unu manifestu. E a pustis dae pagu una pedra musicale, chi remuno cun belosia
  tra Bosa e T\u00e0tari.\\nIntre sos estimadores de tando b\u2019at galu Gianfranco
  Pintore, diretore de su peri\u00f2dicu bil\u00ecngue Sa Sardigna, espressione de
  sa cooperativa, comente puru b\u2019ant sos medas artista trisinados paris in Santu
  Sperau, che Aligi Sassu, endiosadu de sa bidda pintada, gasi la fentomaiat, ma criticadu
  pro sos caddos suos dae sos piseddos de bidda, lestros a si m\u00f2ere a testimoniare
  comente si depet pintare de a beru. Pro su restu sunt b\u00e8nnidos in Santu Sperau
  pessones che Arnoldo Fo\u00e0 o D\u00e0rio Fo.\\nPin\u00f9ccio est istadu su motore
  pro sa muda de sa bidda sua, chi luego diventat bidda museu, cun su parcu megal\u00ecticu,
  sos murales, su tzineforum, su teatru, sa m\u00f9sica comente su jazz de Alberto
  Rodriguez, in unu ponner in fatu vulc\u00e0nicu e magm\u00e0ticu de propostas contradit\u00f2rias
  e confundidas, unas cantas giutas in antis e a pustis chirradas, moende dae ocasiones
  minores de abboju, una protzessione, sa festa de sa paghe, sas iscobertas archeol\u00f2gicas.
  Tando sa n\u00e0schida de sas cooperativas, sa bidda chi s\u2019aberit, sas domos
  chi cumintzant a acasagiare sos artistas, sas cortes, s\u2019impinnu pro defensare
  sa fisionomia de unu pobuladu p\u00f2beru ma prenu de sinn\u00ecficos e de ammentos,
  sas ostinatziones de sos amministradores tontos e incumpetentes.\\nB\u2019at de
  a beru pro su restu s\u2019iscontru cun sas autoridades locales e in su 1975 cun
  sa giunta munitzipale de destra, cun s\u2019interventu forte de sa politzia e de
  sos carabineris, sas compidadas e sas minatzas, su protzessu in dae in antis a su
  pretore de Decimomannu, chi aiat sinnadu puru su reconnoschimentu de su balore morale
  e culturale de sas initziativas e s\u2019impinnu pro defensare totus sas formas
  de espressione art\u00ecstica, trumentadas totora dae iscritas innoriadosas, dae
  sos torracontos, dae imb\u00ecdias locales. Infines sa falada a bellu chi atit Pin\u00f9ccio
  a dassare sa pol\u00ectica ativa mancari puru moderada e sardista e a si distingher
  semper prus a manera crara dae sas amistades cumpromitentes, dae sa b\u00e8nnida
  de amigos de sas brigadas rujas, dae sos assistentes de Toni Negri chi in cussos
  annos andaiant peri sa Sardigna, dae sas istrumentalizatziones pol\u00ecticas, in
  ue s\u2019est agatadu imbiscadu \u2013 iscrient Ant\u00f2nio Sciola e Nanni Pes
  \u2013 pro s\u2019ingenuidade manna, pro sa nidesa sua, pro sa cunfi\u00e0nsia sua
  in sos \u00e0teros. Issu etotu iscriet oe in die de aer arriscadu de nche la corpare
  in presone comente unu macu, sena s\u2019abigiare de sos per\u00ecgulos chi podiat
  agatare. Ma de prus m\u2019at ispantadu s\u2019asperesa de sos giud\u00ectzios de
  Primo Pantoli subra Pin\u00f9ccio, acusadu de esser politicamente nudda, un\u2019istintivu
  chi s\u2019est ghetadu a un\u2019ingenuidade manna.\\nNon mi paret giustu per\u00f2
  cussu chi iscriet Primo P\u00e0ntoli cun par\u00e0ulas de fogu subra su fatu chi
  Pin\u00f9ccio diat aer refudadu semper su mundu de sa cultura leende una positzione
  dudosa, pighende in n\u00f9mene de sa demagogia puru espressiones de s\u2019arte
  populare l\u00e8gias e iscadentes a aberu, renuntziende a su c\u00f2mpitu de sos
  intelletuales chi diat esser cussu de seberare e remunire. Mescamente non m\u2019at
  agradessidu s\u2019acusa de anti\u00b7acad\u00e8micu chi benit fata a s\u2019artista.
  Ch\u00e8rgio ammentare sos reconnoschimentos acad\u00e8micos de Pin\u00f9ccio, chi
  parent sutaistimados si si pensat a sa rete de amistades chi at contivigiadu e si
  deo etotu deghe annos a como comente pr\u00e8side de sa Facultade de L\u00ecteras
  e Filosofia de s\u2019Universidade de T\u00e0tari apo tentu manera de lu proponner
  pro unu cuntratu de insinnamentu a cost\u00e0giu de Aldo Sari e Gino Kalby, un\u2019ocasione
  pro fagher intrare \u00e0ghera noa in s\u2019Universidade chi in L\u2019Unione Sarda
  est istada apretziada dae Antonangelo Liori.\\nPrus in cuddae de Sciola, chi semper
  a cando essit pro sa fortza de s\u2019esempru e de sa testimoni\u00e0ntzia e pro
  s\u2019apretziamentu chi gosat a livellu internatzionale (bastis de pensare a sa
  relata cun su segret\u00e0riu generale de s\u2019UNESCO), si collit dae custas p\u00e0ginas
  su sentidu de una partetzipatzione populare manna, s\u2019ispizu de un\u2019\u00e0ndala
  corale, de una rebellia e de un\u2019ist\u00e0ntzia pol\u00ectica profunda, comente
  si s\u2019esserent torradas a ischidare fortzas dormidas ma medas bias, unu grustu
  de \u201cmilitantes\u201d detzisos a afirmare una bisura noa de sa bida e de su
  mundu, impreende sas carreras de sa bidda \u2013 iscriet galu Coroneo \u2013 comente
  s\u2019iscena de un\u2019ispet\u00e0culu, unu parcuisc\u00e8nicu abertu a totus.\\nEst
  malu a s\u2019isorber su nodu de custu libru, sa dimanda no espressada, si sos artistas
  chi ant pintadu sos muros de Santu Sperau chircarent de torrare a iscoberrer una
  traditzione locale o ch\u00e8rrerent trogonare e segare s\u2019antiga cultura isolana,
  si sos murales de sos primos tempos aerent carchi cosa cun s\u2019identidade sarda
  o si imbetzes bolerent rugrare custa aparten\u00e8ntzia a una cultura semper firma
  chi si diat cherrer fata de sil\u00e8ntzios e de iscurigore.\\nPrimo Pantoli non
  creet chi in Pin\u00f9ccio Sciola b\u2019apat carchi cosa de sardu e agatat de pagu
  importu annotare chi su traballare cun sa pedra potzat esser istadu isseberadu comente
  forma de arte pro ponner s\u2019artista in sa bia de sos fraigadores er\u00f2icos
  de sos nuraghes. B\u2019at in dae segus de custas osservatziones sa pol\u00e8mica
  betza e istantissa de s\u2019esist\u00e8ntzia de un\u2019arte sarda, pro su fatu
  chi puru sa Sardigna de parte de intro diat esser istada interessada dae una rete
  de relatas e de influ\u00e8ntzias b\u00e8nnidas dae foras, sena una forma aut\u00f2noma
  e originale de cultura. B\u2019at puru unu giud\u00ectziu de non creer subra s\u2019acad\u00e8mia
  de arte de T\u00e0tari, chi diat esser un\u2019istrum\u00ecngiu, mentras dae oe
  a pustis non si diat chistionare prus de arte Sarda ma de arte in Sardigna, segundu
  un\u2019espressione chi a mie non paret gosi s\u00e0bia de Vittorino Fiori. B\u2019at
  su pregiud\u00ectziu chi s\u2019arte protosarda siat istadu iconoclasta, anic\u00f2nica,
  inchelada de su totu e p\u00f2bera, semper a cando cun unu gustu est\u00e8ticu diferente
  meda dae cussu de su muralismu de su tempus de oe, prenu de bida de cuntrastos a
  su puntu de l\u2019acurtziare a su fumetu.\\nSu manniore de s\u2019interessu de
  sos artistas de Santu Sperau pro sa Sardigna in beridade non podet ponner ancu:
  diant bastare sas fotografias de sos artistas chi si cunfrontant con sos pitzinnos,
  sas relatas sotziales, s\u2019anonimadu o m\u00e8gius su colletivu de sas \u00f2beras,
  sas maneras de s\u2019espressare. Si cumintzat semper dae su reconnoschimentu de
  sa limba sarda, impreada pro esempru in L\u00e0coni in su1979 insu protzessu pro
  fagher unu murale contra sa lege. Ma sunt sas istruturas de sa sotziedade sarda
  chi essint a foras e si cunfrontant in sos muros, comente si su balore de s\u2019iss\u00e8beru
  de adatare sas pinturas in custa bidda, comente a pustis in Org\u00f2solo, diat
  fagher moer cada chistionu dae su reconnoschimentu de un\u2019autoctonia e de un\u2019identidade
  comente balores assolutos, a sos cales assotziare sa comunidade cun una partetzipatzione
  democr\u00e0tica, fundada subra sa paghe e subra s\u2019antimilitarismu che a Pratobello.
  Tando sos temas isseberados, su traballu, su pasu, sa festa, sos animales, una forma
  forte e colletiva de arte, unu laborat\u00f2riu figurativu de s\u2019identidade
  de massajos, iscoberta e balorizada ca tenet unu patrim\u00f2niu culturale finas
  a tando non cumpresu. Sa Sardigna tando comente polu pressiosu de una relata cun
  su cosmopol\u00ectismu de sos artistas e de sos sugetos trisinados umpare, comente
  espressione de s\u2019arte popularesca in relata a sos professionistas mannos.\\nOe
  Santu Sperau remonit pagas istigas de cussu tempus istraordin\u00e0riu, puru si
  su frorire de Bed & Breakfast, sa n\u00e0schida de s\u2019uf\u00ectziu tur\u00ecsticu
  gestidu dae sa cooperativa Fentanas, s\u2019isvilupu de su sistema cooperativu,
  rapresentant unu de sos efetos de una cr\u00e8schida chi est istada econ\u00f2mica
  puru, ma mescamente culturale, fundada subra sa fieresa de aparten\u00e8ntzia a
  una comunidade chi s\u2019est posta in sintonia cun sa probiana cabu de rennu Casteddu,
  chi est istadu su polu a tesu de riferimentu semper in s\u2019isfundu, sa mesura
  de su raportu intre sa periferia e su tzentru, intre sa camp\u00e0nnia e sa tzitade.\\nM\u2019at
  tocadu su coro sa testimoni\u00e0ntzia de Cenzo Porcu, orgolliosu pro sas par\u00e0ulas
  de su f\u00ecgiu chi at iscobertu carchi cosa de su babbu in onni cugione de Santu
  Sperau, una bidda chi custoit su sensu de unu beranu longu, chi at ischidu fraigare
  \u2013 iscriet Ott\u00e0vio Olita \u2013 una cossi\u00e8ntzia, su des\u00ecgiu de
  rescatu, su bis\u00f2ngiu de esser protagonista de s\u2019ist\u00f2ria pr\u00f2pia.\\nIn
  custas dies Pablo Volta at publicadu pro s\u2019Ilisso su vol\u00f9mene Sardegna
  come l\u2019Odissea: un\u2019\u00f2bera istraordin\u00e0ria iscrita in Santu Sperau,
  in ue su fot\u00f2grafu famadu \u00ectalu argentinu at isseberadu de biver dae su
  1987. Un\u2019obus chi cunfirmat comente pr\u00f2piu s\u2019incantu de sa Sardigna
  bista comente esperi\u00e8ntzia bera e comente mitu apat furadu su coro de sos artistas
  de tando.\\nCussa de sos \u00f2mines e de sas f\u00e8minas de Santu Sperau duncas
  no est istada como baranta annos un\u2019ammachiadura de si bergungiare, una maladia
  chi cundit e est fastigiosa: est istada mescamente s\u2019ocasione pro agatare sa
  sintonia intre sa bidda pitigheddedda de su Campidanu e su mundu de foras, mescamente
  intre s\u2019arte de oe e un\u2019ist\u00f2ria longa chi non s\u2019est ch\u00e8rfida
  rennegare pro peruna manera, ma de sa cale esser orgolliosos, cun una consapevoletza
  noa.\"", "\"Protestas cara sa s\u2019ambasciada italiana de T\u00f9nisi pro chi
