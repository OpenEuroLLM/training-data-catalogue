  "\"Genti meda eriseru pusti prangiu a s\u2019interru de Luca Pisano, su piciocu
  tortoliesu de digianoi annus bociu de sa meningite.\\nA is tres su baulu est intrau
  in sa cresia intregada a Santu Jorgi. Dd\u2019ant portau a pala is amigus, e ddu
  ant aspetau in s\u2019altari su predi, don Pisu, su predi beciu don Cabras e totu
  is chirichetus. a presu de su baulu si funt setzius su babbu e-i sa mama, Francu
  e Valeria Cocco, su fradigeddu, is nonnus e is tzius.\\nIn sa predica su predi at
  arregodau sa vida de su giovunu: \u201cSa vida nosta \u2013 at nau don Pisu de s\u2019altari
  \u2013 est sinnada, non de sa sorti legia ma de unu disegnu chi nos si boli beni.
  In sa tristura si frimaus e parit ca custus non si bogliant fairi biri s\u2019allirghia
  chi c\u2019est stetia\u201d.\\nFinas don Cabras at bofiu arregodai su studenti chi
  in lampadas at airi fatu s\u2019esami de maturidadi: \u201cS\u2019amori po sa vida
  de Luca at impestau a totus. Torraus gratzias a su Segnori po nos si dd\u2019airi
  fatu connosciri, mancai po pagu tempus\u201d.\\nPusti at pigau su fueddu unu professori
  de su liceu scientificu, sa scola de Luca: \u201cLuca \u2013 at nau \u2013 custu
  est feti unu asibiri e non unu saludu po sempiri. Tui non fus ma ses parti manna
  de sa vida nosta e de sa storia nosta. Ti boleus beni\u201d.\\nTotus poi prangiant
  candu finas su fradigeddu at bofiu saludai su fradi cun pagus fueddus: T\u2019apu
