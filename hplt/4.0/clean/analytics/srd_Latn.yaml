sample: '["\"-de Sarvadore Serra-\\nS\u2019edade m\u00e8dia est caraterizada dae relatziones
  \u201ccumplicadas\u201d intre sardos e \u00e0rabos, chi s\u2019ist\u00f2ria issoro
  intrat a pare cun sa n\u00e0schida e sa p\u00e8rdida de s\u2019indipend\u00e8ntzia
  de sa Sardigna.\\nA pustis de \u00e0ere cunchistadu su Nord \u00c0frica (intre sa
  medade de su s\u00e8culu VII e su cumintzu de su s\u00e8culu VIII), sos \u00e0rabos
  ant pessadu de s\u2019ispainare in sa pen\u00ecsula ib\u00e8rica. In su matessi
  tempus ant cumintzadu a pessare cun un\u2019interessu semper prus mannu a sa Sardigna,
  chi, paris cun sa C\u00f2rsica, rapresentaiat un\u2019avampostu istraordin\u00e0riu
  pro atacare sa pen\u00ecsula it\u00e0lica tzentrusetentrionale e sa Frantza meridionale.
  Pro custu sunt cumitzadas sas incursiones \u00e0rabas in s\u2019\u00ecsula nostra.\\nNon
  b\u2019at fontes ist\u00f2ricas diretas de sa cronologia de sas incursiones chi
  nos ant interessadu dae su s\u00e8culu VIII a su s\u00e8culu XI. Duncas tocat a
  cunfiare in sas ricostrutziones fatas dae ist\u00f2ricos \u00e0rabos chi sunt b\u00e8nnidos
  a pustis, mescamente sas de Ibn al Athir, v\u00ecvidu intre su s\u00e8culu XII e
  su s\u00e8culu XIII. Custas fontes mustrant, duncas, duas problem\u00e0ticas: sa
  prima est sa dist\u00e0ntzia temporale dae sos fatos reales; sa segunda est chi
  custos contos los faghet una ebbia de sas partes in c\u00e0usa. Semper e cando,
  resurtat chi sos \u00e0rabos ant fatu sos primos atacos a cumintzos de su su s\u00e8culu
  VIII, cando galu in Sardigna bi fiant sos bizantinos; s\u2019idea fiat a furare
  benes e a f\u00e0ghere presoneris de isfrutare comente iscravos; sa cosa deviat
  \u00e8ssere s\u00e8ria a beru si su re longobardu Liutprandu nch\u2019at mandadu
  gente a Casteddu pro si nche leare a Pavia sos restos de Sant\u2019Austinu.\\nUnu
  cambiamentu mannu b\u2019est istadu in su 753, cando sos \u00e0rabos no ant fatu
  petzi bardanas, ma paret chi apant creadu pres\u00ecdios in sa costa e apant sutapostu
  nessi una parte de su territ\u00f2riu a sa Gizyah, sa tassa chi sos non cunvertidos
  deviant pagare pro sighire a professare sa fide issoro. Si pessat chi custa situatzione
  siat durada deghinas de annos, si si cuns\u00ecderat chi non b\u2019at testimonias
  de incursiones fintzas a su cumintzu de su s\u00e8culu IX.\\nIn su 760, s\u2019Imperadore
  bizantinu Costantinu V at ammaniadu una flota pro parare fronte a sos \u00e0rabos
  in su Tirrenu, ma non s\u2019ischit si e comente custa initziativa at influidu in
  sa tranchillidade relativa de sas \u00f9rtimas d\u00e8cadas de su s\u00e8culu e
  si at liberadu sos sardos dae cussa tassa.\\nIn sos primos annos de su s\u00e8culu
  IX sunt istados sos \u00e0rabos de Ispagna, prus de una bia, a proare a f\u00e0ghere
  incursiones, ma sos sardos nche los faghiant torrare in palas; gasi resurtat dae
  sas ricostrutziones de Saxo Grammaticus, ist\u00f2ricu danesu de su s\u00e8culu
  XII, connotu meda ca at iscritu sas Gesta Danorum, dae ue Shakespeare at leadu su
  sugetu de s\u2019Amletu. Semper e cando, sa situatzione fiat s\u00e8ria: infatis,
  comente resurtat dae sos Annales de s\u2019ist\u00f2ricu francu Eginardu, chi at
  v\u00ecvidu in cussos tempos, unos cantos delegados sardos (legati sardorum de Carali
  civitate) in su 815 sunt tzucados a sa corte de Ludovicu su Piu pro pedire agiudu
  contra a su per\u00ecgulu de sos mussulmanos. Devet \u00e8ssere chi sos francos
  non sunt interv\u00e8nnidos in tempus, si mancu un\u2019annu a pustis b\u2019at
  \u00e0pidu una bardana in Casteddu, mancari chi, a pustis, sa flota \u00e0raba nche
  l\u2019at isp\u00e8rdida una traschia. A onni modu, in su 829, est b\u00e8nnidu
  a Sardigna su conte Bonif\u00e0tziu, respons\u00e0bile carol\u00ecngiu de sa defensa
  de su Tirrenu, e s\u2019asse cun s\u2019Imp\u00e8riu at dadu frutos bonos, si est
  a beru chi pro prus de unu s\u00e8culu non b\u2019at \u00e0pidu incursiones importantes;
  e custu mancari chi sa cunchista de sa Sitz\u00eclia dae bandas de sos \u00e0rabos,
  cumintzada cun s\u2019isbarcu in Mazara in su 827, apat truncadu pro semper sos
  cuntatos intre sa Sardigna e Bis\u00e0ntziu, agiuende cussu caminu de indipend\u00e8ntzia
  chi, in su giru de pagas deghinas de annos, nche diat \u00e0ere giutu a sa n\u00e0schida
  de sos Rennos, o Giuigados, sardos.\\nPro totu su s\u00e8culu X s\u2019ischit petzi
  de unu fatu grave, acunt\u00e8ssidu intre su 934 e su 935: sos \u00e0rabos in antis
  ant bardanadu in Sardigna, pustis sunt andados a G\u00e8nova e ant fatu su matessi.
  Cando fiant ghirende, ant distruidu una flota imbiada dae sos bizantinos ca l\u2019aiat
  pedida su re de It\u00e0lia Ugu de Proventza. Su tratadu de paghe firmadu dae s\u2019Imp\u00e8riu
  bizantinu e dae sos Omayyades de Ispagna in su 947 nch\u2019at torradu in su Tirrenu
  unu pagu de tranchillidade fintzas a s\u2019agabbu de su s\u00e8culu.\\nMa in su
  cumintzu de su mill\u00e8nniu nou sos sardos ant d\u00e8vidu parare fronte a su
  tentativu de invasione prus perigulosu dae bandas de su pr\u00ecntzipe (wali) de
  Denia e de sas Baleares Mujahid (chi in sa pen\u00ecsula it\u00e0lica li naraiant
  Muset(t)o o Muscet(t)o). Issu, iscravu afrancadu de or\u00ecgine islava, gr\u00e0tzias
  a sas calidades istraordin\u00e0rias suas, intelletuales e militares, at cumintzadu
  unu cursus honorum importante. In su 1015 at disinnadu un\u2019invasione de sa Sardigna
  cun s\u2019idea de bi p\u00f2nnere unos cantos pres\u00ecdios pro p\u00f2dere atacare,
  pustis, sas costas toscanas. S\u2019ispeditzione de Mujahid at leadu sos sardos
  a s\u2019iscunfiada e sa resist\u00e8ntzia improvisada (forsis dae su Gi\u00f9ighe
  de Torres, chi sos \u00e0rabos li naraiant Malut) no est barta a impeigare s\u2019ocupatzione
  de sa costa setentrionale de sa Sardigna; a su chi narant sos \u00e0rabos, su Gi\u00f9ighe
  etotu est mortu in sa batalla.\\nPustis su pr\u00ecntzipe est andadu chirru a sa
  costa it\u00e0lica de su Tirrenu setentrionale; at distruidu sa tzitade antiga de
  Luni; at bardanadu unu bighinadu de Pisa, boghende profetu dae su fatu chi mancaiat
  su bonu de sa flotta pisana, impinnada in Cal\u00e0bria contra a sos piratas saratzenos;
  in fines est torradu a sas bases sardas. Sos pisanos ant reagidu deretu: sunt isbarcados
  in su de Pasada, si sunt alliados cun sos sardos e ant ammaniadu sa contraofensiva.
  In su matessi tempus, Papa Beneitu VIII, dispr\u00e0ghidu meda pro sa distrutzione
  de Luni, at fatu a manera de f\u00e0ghere interv\u00e8nnere fintzas sos genovesos,
  dende vida a una casta de proa generale de sas Crotziadas venidoras. Sardos, pisanos
  e genovesos sunt resessidos in pagu tempus a nche dispatzare sos \u00e0rabos dae
  Sardigna. Mujahid at torradu a proare a inv\u00e0dere sa Sardigna, ma si nch\u2019est
  d\u00e8vidu tramudare a Bona (Ippona), da ue at sighidu a f\u00e0ghere atziones
  de pirateria, fintzas a cando, in su 1035 (o 1044), una flota sardu-pisana at distruidu
  totu sas naves suas e at ocupadu sa tzitade. Narant chi a Mujahid l\u2019at mortu
  unu sordadu sardu, e chi sa conca nche l\u2019ant artziada in sa nave ammiralla
  de sa flota giuigale, pro nche la fuliare, pustis, in mare.\\nA pustis de sa morte
  de Mujahid (e fintzas a cando, in su s\u00e8culu XV, non sunt cumintzadas sas bardanas
  de sos barbarescos), sos atacos \u00e0rabos a sas costas sardas si sunt limitados
  a atziones ispor\u00e0dicas de pirateria. Forsis est a pustis de su tentativu de
  Mujahid chi sas sedes de sas capitales giuigales nche las ant tramudadas a logos
  chi si podiant dif\u00e8ndere m\u00e8gius: dae Torres a \u00c0rdara, dae Tharros
  a Aristanis e dae Casteddu a Santa \u00ccgia.\\nDe seguru, in unu primu tempus sas
  bardanas de sos \u00e0rabos ant agiuadu s\u2019isvilupu indipendent\u00ecsticu de
  su guvernu de s\u2019\u00ecsula, chi s\u2019est incrarada a su mill\u00e8nniu nou
  cun una cuadripartzione giuigale cr\u00f2mpida; pustis, s\u2019alli\u00e0ntzia netzess\u00e0ria
  cun sas Rep\u00f9blicas Marinaras de Pisa e G\u00e8nova at abertu sa Sardigna a
  sas inger\u00e8ntzias issoro, chi in fines ant minadu s\u2019indipend\u00e8ntzia
  de sa terra nostra.\"", "\"10/10/18\\nMarilotti e M5s presentant unu disignu de
  lege pro tutelare sa limba sarda\\nSu senadore Gianni Marilotti (M5s) at presentadu
  unu disignu de lege pro sa rat\u00ecfica de sa Carta europea de sas limbas regionales
  o minorit\u00e0rias (aprovada in Strasburgo in su 1992, firmada dae 33 Istados de
  su Cuss\u00ecgiu de Europa e mai cunvalidada dae s''It\u00e0lia).\\nMarilotti at
  ascurtadu sa boghe de su movimentu lingu\u00ecsticu sardu chi dae tempus meda pedit
  sa rat\u00ecfica, chi at a afortigare sa lege 482/1999 e sa lege regionale noa faghende
  intrare sa limba in su mundu de s''amministratzione p\u00f9blica, de s''iscola e
  de sos m\u00e8dios massivos.\\nCustu ritardu de s''It\u00e0lia in sa rat\u00ecfica
  fiat istadu santzionadu finas dae s''Altu cummiss\u00e0riu pro sas minorias natzionales
  de s''Osce (Organizatzione pro sa seguresa e cooperatzione in Europa), ca sos p\u00f2pulos
  minorizados tenent deretu de mant\u00e8nnere sa cultura issoro.\\nMarilotti ispiegat
  chi, si su Ddl at a \u00e8ssere aprovadu, s''iscola p\u00f9blica nd''at a t\u00e8nnere
  profetu mannu ca in logos de bilinguismu pro mant\u00e8nnere sa dirig\u00e8ntzia
  bastant 400 alunnos (e non 600). In prus, s''ant a t\u00e8nnere finantziamentos
  chi ant a agiudare sas iscolas, s''amministratzione p\u00f9blica e sas televisiones
  e r\u00e0dios privadas.\\n\\\"Su de \u00e0ere depositadu custu Atu parlamentare
  - narat Marilotti - est pro me coronamentu de un''impignu chi aia leadu cun sos
  eletores. Torro gr\u00e0tzias a chie m''at dadu agiudu in custu traballu e in manera
  particulare a sos amigos Antoni N\u00e0tziu Garau e Diegu Corraine de sa SLS (Sotziedade
  pro sa limba sarda) e a Massimo Madrigale de s''Acad\u00e8mia de su sardu\\\".\\nNessun
