  Su pensu de Friedrich Wilhelm Joseph Schelling (1775-1854), est bortadu a interessos
  natural\u00ecsticos e est\u00e8ticos. Si sa sust\u00e0ntzia de Spinoza est su printz\u00ecpiu
  de s\u2019infinidade ogetiva e,\u2026\"", "\"Sorighe\\nSu s\u00f2righe o topi (Mus
  musculus, Linnaeus 1758), de sa familia Murudi, est unu mamiferu rotzigadore. Animaleddu
  de colore grigiu, cun runcu appuntidu, mustatzos, e coa longa. Esistit su sorighe
  de tzitade, che vivet in sas domos, ispetzialmentein in cussas betzas. Rotzigat
  totu su chi agatat e chi podet mandigare. B''est su sorighe de campagna, chi vivet
  in sos buscos, in sos campos e mandigat semenes e raighinas. Sunt preda de sos puzones
  predatores, de cussos chi catzana a de note e de sos chi catzana a de die. Bi sunu
  puru sos sorighes de fogna, pius russos( sa merdona, in campidanesu).\"", "\"Calendario-
