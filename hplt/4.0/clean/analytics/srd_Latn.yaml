  srd. Tradutziones Frantzesu reprocher Ingresu to fling in s.o.''s face Ispagnolu
  reprochar Italianu rinfacciare Tedescu vorhalten.\"", "\"Su Gazetinu, chen\u00e0bura
  30 de cabudanni de su 2022\\nSa Die mundiale de su coro, n\u00e0schida cun sa punna
  de informare e sensibilizare a is tzitadinos in contu de sa preventzione de is maladias
  cardiuvascolares, s\u2019at a f\u00e0ghere in Sardigna puru, gr\u00e0tzias a sa
  setzione regionale de s\u2019Ass\u00f2tziu natzionale de is m\u00e8igos cardi\u00f2logos
  de is ispidales, ghiada dae su cardi\u00f2logu de Aristanis Gianfranco Delogu, diretore
  de su repartu de Cardiologia de s\u2019ispidale de Santu \u2018\u00c8ngiu.\\nDelogu
  at naradu chi cun bator milliones de mortos \u00f2nnia annu, is maladias cardiuvascolares
  sunt pagu prus o mancu su 45 % de is c\u00e0usas de morte in Europa.\\n\u201cBis\u00f2ngiat,
  duncas, a informare sa populatzione in contu de is cosas chi ponent in arriscu su
  coro nostru\u201d, at regordadu. E s\u2019ocasione podet \u00e8ssere sa Die mundiale
  de su coro. S\u2019Anmco at a cuncordare duas coas de chida de preventzione, in
  Casteddu e in T\u00e0tari, cun su c\u00e0mion de su coro: unu mezu mannu chi s\u2019at
  a firmare in is pratzas. In Casteddu s\u2019apuntamentu est pro su 7, 8 e 9 de santugaine.
  In T\u00e0tari is datas ant a \u00e8ssere cussas de su 14, 15 e 16 de santugaine.\\nSu
  cardi\u00f2logu aristanesu at regordadu cale sunt is cosas chi favoressent de prus
  is maladias de su coro: su fumu de sigareta, su si nde abarrare s\u00e8tzidos e
  su f\u00e0ghere pagu movimentu, is mandiares ricos meda de grassos e de tz\u00f9curu,
  chi favoressent sa grass\u00e0ria.\\nFintzas sa pres\u00e8ntzia de \u00e0teras maladias
  faghet cr\u00e8schere s\u2019arriscu at naradu su cardi\u00f2logu, mentovende sa
  pressione arta, su diabete e su colesterolu artu.\\nIn sa carrera generale, duncas,
  s\u2019ambiente e s\u2019istile de vida, sa manera de b\u00ecvere, sunt de importu
  mannu.\\nSu cardi\u00f2logu presidente de s\u2019Anmco regionale at sutaliniadu
  s\u2019importu de sa cultura de sa defibrillatzione lestra e de s\u2019interessamentu
  de is m\u00e8igos de meighina generale.\\nSi si presentant is primos sinnales, non
  tocat a ddos trascurare. Un\u2019atentu particulare bolet dadu a su dolore in piturras
  e a su ritmu de su coro, chi si podet controllare fintzas ascurtende su burtzu.\\nAntoni
  N\u00e0tziu Garau\\nFaina fata cun s\u2019agiudu de sa Regione Sardigna \u2013 IMPRENTAS
