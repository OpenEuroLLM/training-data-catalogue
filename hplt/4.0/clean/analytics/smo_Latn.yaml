  le itu e agai i ai, o le a le gata i lea o le a le toe mananao tagata e galulue
  fa\u02bbatasi ma le faiga. E te fesoasoani i le tausia o le tino e ala i le tausisia
  lelei o le galue malosi o le radar. Ma afai e te teena, atonu e tatau ona faia ni
