  fa\u02bbaola ai le lumana\u02bbi o i latou ma lana fanau? O fea oi ai fitafita totoa?\\nO
  le a se mea e mafai ona e faia i le fa\u02bbatinoga? Na o nisi o faataitaiga: Aua
