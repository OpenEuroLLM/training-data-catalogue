  faatonu ola o Simon Wilkes.\\n\\\"Na matou fa\u02bbaaoga le URSA Broadcast mo le
  mauaina; i luma o le fale sa i ai se matou pusa tasi ma se tioata umi ma se masini
  faaopoopo Micro Studio Camera 4K ua tapunia i tafatafa o le kesi lelei, \\\"o lana
  faamalamalama mai lea. \\\"I le pito i luma o le tulaga, sa i ai se matou loli na
