  12G, HyperDeck Studio Pro ma isi mea uma Blackmagic Design Oloa maua i www.blackmagicdesign.com/media/images.\\nE
  tusa o le Blackmagic Design\\nBlackmagic Design faatupuina oloa faasa\u02bboina
  le vitio lelei aupito maualuga o le lalolagi, o mea pueata ata faafuainumera, correctors
