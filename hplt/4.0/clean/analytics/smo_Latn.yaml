  mo foai, ae toaitiiti lava e naunau e lagolagoina. O lea o le fesili o le mea e
  mafai ona e faia o le fesili muamua lea e tatau ona e fesili ifo ai ia te oe lava.
  Ae ui i lea, ou te fia liliu le fesili. \\\"O le a le mea e tupu pe afai e te le
  faia se mea?\\\". E mafai ona ou taliina lena fesili mo oe. Afai e leai se mea e
  te faia, e te mautinoa o oe ma lau fanau o le a nonofo i le falepuipui fa\u02bbamalosi
  (faitau lenei tusiga e uiga i lena). I totonu o se ofisa leoleo leoleo lea e vaavaaia
  ai mea uma ma tagata uma i soo se mea, ma e leai se tasi e mafai ona galue ma savavali
