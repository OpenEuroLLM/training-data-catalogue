  sa i ai se fa\u02bbatautaia o le telefoni pu\u02bbe ma se lima lima o kamela masini
  ua tu\u02bbuina i avanoa autu mo isi auala. \\\"\\nUa faaopoopo mai le Bad Weather
  of Jonathan Bandli: \\\"O le uiga lelei o nei kamera o se mea lea e lei oo muamua
  i ai le faaaliga; lelei i le maualalo o le malamalama ma sa latou taulimaina le
  tele o le tele o se laasaga tetele ma se ese\u02bbesega ese ma le matagofie. O la
  matou fofo na suia atoa ai le fa\u02bbamatalaga o le fa\u02bbamanatuga muamua o
  le fa\u02bbasalalauga i fa\u02bbatautaia o kamera. \\\"\\nO le kesi na gaosia ai
  60 mita mai le sikuea. \\\"Na na o le tasi le ato, ma o le pito i luga o le Teranex
  Express. Na matou tusia le tausamiga atoa i le 2160p24, ae le talafeagai mo nisi
  o isi sikoa faataamilo i le upega tafailagi, o lea na matou agai atu ai i 1080i
  e faaaoga ai le Teranex, \\\"o le tala lea a Simona.\\nFa\u02bbalagolago i le Mini
  Converter Optical Fiber 12G, o laina ta\u02bbavale taitasi na lafoina se fa\u02bbamatalaga
  i tua o fiva multimode i le ATEM Talkback Converter 4K na fa\u02bbamauina i le setup
  PPU. Na toe liliu i le SDI o na faailo na patipatiina i le ATEM Constellation 8K
  ma o le fa\u02bbaaliga na fa\u02bbafefiloi e fa\u02bbaaoga ai le ATEM 1 M / E Advanced
  Panel.\\nFai mai Jonathan, \\\"O se tasi o mea taua i le filifilia o le ATEM Constellation
  o lo oi ai o tatou tulaga faatonuina o le liliu mai i luga o mea uma. Fa\u02bbafefiloi
  tusiga ma fa\u02bbai\u02bbuga e masani lava o se mataupu i luga o mea tutupu, aemaise
  lava pe''\u0101 taulimaina punaoa mai fafo. O le iloaina e mafai ona tatou taulimaina
  soo se mea e o\u02bbo mai i lo tatou ala na ona tatou maua ai lena filemu o le mafaufau.
  Faatasi ai ma le Constellation o nofo i le fatu o la tatou fagotaga o lona uiga
  tatou te teu tupe sili ona lelei i le iloa o le a galue malosi mo le tele o tausaga
  a sau. \\\"\\nAta Tifaga\\nO ata o oloa o le Blackmagic URSA Broadcast, Micro Studio
  Camera 4K, ATEM Constellation 8K, ATEM 1 M / E Panel Maualuga, Puipuiga Puipuiga
