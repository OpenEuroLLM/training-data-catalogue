sample: '["\"Nema 11 (28mm) stepper afi\\n>> Fa''amatalaga Puupuu\\n>> Tusipasi\\n>>
  Fa''aeletise Parameter\\n>> Fa''asologa fa''apitoa fa''apitoa\\n>> 28HS2XX-1-4A
  afitusi ata tusi\\n>> Pi''o fa''alava\\nTulaga su''ega:\\nChopper taavale, afa micro-laasaga,
  ave voltage 24V\\n>> E uiga ia i matou\\nMatou te pipii i le tagata o tausia 1st,
  tulaga maualuga 1st, fa\u02bbaleleia atili, fa\u02bbaoga tutusa ma manumalo-manumalo
  mataupu faavae.Pe a galulue fa\u02bbatasi ma le tagata fa\u02bbatau, matou te tu\u02bbuina
  atu i tagata fa\u02bbatau le maualuga maualuga o le auaunaga.\\nUa matou maua tekinolosi
  gaosiga alualu i luma, ma tulituliloa fou i oloa.I le taimi lava e tasi, o le auaunaga
  lelei ua fa\u02bbaleleia ai le igoa lelei.Matou te talitonu afai lava e te malamalama
  i la matou oloa, e tatau ona e naunau e avea ma paaga ma i matou.Fa''atalitali i
  lau su''esu''ega.\"", "\"I le aso 7 o Iulai, na faia ai le fa''amoemoe fa''apitoa
  \\\"Soifuaga Soifua Maloloina\\\" i le WELL Living Lab (Saina).O le fa''amoemoe
  na fa''atulagaina fa''atasi e Delos ma Tongdy Sensing Technology Corporation.\\nI
  le tolu tausaga ua tuana''i, ua vala''aulia ai e le \\\"Healthy Living Symposium\\\"
  tagata popoto i fale ma pisinisi fa''asaienisi fa''alesoifua maloloina e fefa''asoaa''i
  ma fefa''asoaa''i manatu.Delos o se ta\u02bbita\u02bbi soifua maloloina i le lalolagi
  atoa ma se misiona e fa\u02bbaleleia le soifua maloloina ma le manuia i avanoa tatou
  te nonofo ai, galulue, a\u02bboa\u02bbo, ma ta\u02bbalo, fa\u02bbaauau pea ona ta\u02bbita\u02bbia
  le ta\u02bbita\u02bbiga o le ola maloloina, ma saofag\u0101 i le fa\u02bbaleleia
  o le soifua manuia o tagata.\\nI le avea ai ma fa\u02bbalapotopotoga fa\u02bbatasi
  o lenei mea na tupu, e tusa ai ma le mata\u02bbituina o le lelei o le ea i totonu
  ma le auiliiliga o fa\u02bbamaumauga, na faia ai e Tongdy Sensing se talanoaga faauo
  ma tagata atamamai ma pa\u02bbaga i le su\u02bbesu\u02bbeina o le lelei o le ea
  o fale lanumeamata ma le soifua maloloina.\\nTongdy ua taula\u02bbi i le mata\u02bbituina
  lelei o le ea talu mai le 2005. Faatasi ai ma le 16 tausaga o le poto masani, Tongdy
  o le tagata tomai faapitoa i lenei pisinisi ma le igoa lelei.Ma o lea ua avea Tongdy
  ma paionia alamanuia ma tekinolosi ta\u02bbuta\u02bbua ina ua mae\u02bba fa\u02bbata\u02bbita\u02bbiga
  fa\u02bbamalosia lelei ma fa\u02bbaoga umi i luga ole nofoaga.\\nE ala i le fa''aauauina
  o le aoina mai o fa''amaumauga o le lelei o le ea i le taimi moni i potu eseese
  o le WELL Living Lab, e fesoasoani Tongdy i le tu''uina atu o fa''amaumauga i luga
  ole laiga ma taimi umi ole lelei ole ea.E mafai e le Well Living Lab ona fa''atusatusa
  ma au''ili''ili ta''iala ta''itasi o le ea e aofia ai le PM2.5, PM10, TVOC, CO2,
  O3, CO, Temperature ma Relative Humidity, lea sa loloto mo su''esu''ega a Delos
  i le lumana''i i le fanua o le fale lanu meamata ma le soifua maloloina fa''atumauina.\\nI
  lenei mea na tupu, na fofogaina ai e Ms. Snow, Peresitene o Delos China, le lauga
  amata e ala i vitio mamao mai Niu Ioka.Fai mai a ia: \u201cO le Well Living Lab
  (Saina) ua fuafua e amata fausia i le 2017. I le amataga, sa feagai ma le tele o
  faigata ma luitau.Mulimuli ane, Well Living Lab o lo\u02bbo fa\u02bbaogaina i le
  2020 e ala i le fo\u02bbia o fa\u02bbafitauli fa\u02bbatekonolosi.Ou te fia fa\u02bbafetai
  mo le galue malosi a a\u02bbu paaga faigaluega ma le fa\u02bbamaoni o la matou paaga
  e pei o Tongdy Sensing Technology.E le gata i lea, ou te fia momoli atu la''u faafetai
  ia te outou uma mo le lagolago umi ia Delos ma WELL Living Lab (Saina) .Matou te
  tulimatai atu ma le faamaoni i le toatele ma le toatele o tagata e auai mai ia i
  matou ma tau mo le misiona o le ola maloloina.\\\"\\nO le sui auai o Ms.Tian Qing,
  e fai ma sui o Tongdy, na ia faailoa atu foi ana faafeiloaiga faamaoni ma le faafeiloaiga
  mafanafana i le auvalaaulia.I le taimi lava e tasi, na ia fai mai foi \\\"Tongdy\\\"
  o le a tuuto atu i le misiona o le ola maloloina, galulue faatasi ma paaga e saofag\u0101
  i le Healthy China 2030.\\nO Ms. Shi Xuan, Sui Peresetene Sinia o Delos China, na
  fa''alauiloaina le faug\u0101fale, atina''e tetele ma su''esu''ega a le WELL Living
  Lab (Saina).Sa ia fa''amoemoe e mafai ona tatou fa''aosofia le mafaufau ma le naunau
  o tagata mo le ola maloloina e ala i le fa''aauau su''esu''ega, ma va''ava''ai mo
  tuaoi ma teritori fou i le soifua maloloina.\\nMs. Mei Xu, Sui Peresetene o le IWBI
  Asia, fa''asoa fa''amatalaga fa''apitoa a WELL Living Lab (Saina).Na te tu\u02bbuina
  atu se fa\u02bbamatalaga fa\u02bbapitoa o le WELL Living Lab (Saina) fa\u02bbatasi
  ma le Ten Concepts of the WELL Healthy Building Standard (Ea, Suavai, Mea\u02bbai,
  Malamalama, Movement, Thermal Comfort, Acoustic Environment, Material, Spiritual,
  and Community).\\nMs.Tian Qing, Sui auai o Tongdy, faasoa mai le tele o faamatalaga
  e uiga i le auala e galue ai faamatalaga lelei o le ea i le faasaoina o le malosi,
  faamamaina ma le pulea i luga o le initoneti mai le itu o Tongdy''s ea mata\u02bbituina
  ma pulea, fa\u02bbata\u02bbita\u02bbiga fa\u02bbata\u02bbita\u02bbiga ma su\u02bbesu\u02bbega
  fa\u02bbamaumauga.Na ia fa''asoaina fo''i le talosaga mo le mata''ituina o le ea
  ile WELL Living Lab.\\nIna ua mae\u02bba le fonotaga, na fiafia tagata auai e asiasi
  i nisi o nofoaga tatala o le WELL Living Lab ma le tulaga tulaga ese 360-tikeri
  su\u02bbesu\u02bbega su\u02bbesu\u02bbe i luga o le taualuga o le fale.\\nO mata''itusi
  lelei o le ea a Tongdy e fa''apipi''i lelei ma le avanoa totonu ole WELL Living
  Lab.O fa''amaumauga fa''ainitaneti o lo''o tu''uina atu o le a maua ai fa''amaumauga
  autu mo su''esu''ega ma su''esu''ega i le lumana''i a le WELL Living Lab.\\nTongdy
  ma WELL o le a faaauau pea ona savavali i luga o tauau i luga o tauau, matou te
  talitonu o la latou taumafaiga soofaatasi e tulituliloa le ola maloloina o le a
  ausia ai le tele o taunu\u02bbuga ma maua ai se taunuuga fou.\\nTaimi meli: Iul-14-2021\"",
  "\"XMASTER FITNESS\\nE sili atu i le 10 tausaga le poto masani\\nFa''apolofesa Fa''ameaalofa
  Fa''atauva''a Mea Fa''atau Mea Fa''atau Mea\\nFaatatau ia tatou\\nO lo Tatou Taua\\nI
  le avea ai o se ta\u02bbuta\u02bbua ta\u02bbuta\u02bbua i alamanuia, Xmaster fitness
  ua fa\u02bbapitoa i le gaosiga o le mamafa fua fua fua e aofia ai ipu siisii mamafa,
  ipu fa\u02bbamalosi, pa\u02bbu, dumbbell ma Urethane oloa fa\u02bbasologa mo le
  sili atu i le 10 tausaga.\\nO la matou OEM brand-Xmaster ua fa\u02bbamaonia e le
  faitau afe o tagata fa\u02bbatau.O i matou o le fa''atau oloa autu mo nisi o fa''ailoga
  pito i luga i le alamanuia malosi.\\nO la matou fale gaosi 30,000 sikuea mita ua
  fa\u02bbapipi\u02bbiina i fale tekonolosi maualuga e gaosia ai oloa sili ona lelei
  mo matou tagata fa\u02bbaaloalogia.\\nFaatasi ai ma le sili atu ma le sefulu tausaga
  fa\u02bbapitoa i le atina\u02bbeina o metotia fou i falema\u02bbi fa\u02bbamalositino,
  matou te matua mitamita lava o lo\u02bbo matou fa\u02bbatumauina le aumaia o le
  tau sili i a matou tagata fa\u02bbatau.\\nMatou te fa\u02bbafeiloa\u02bbi ma le
  fa\u02bbamaoni e asiasi i la matou fale gaosimea.\\nTulaga lelei\\nMatou te le taofia
  le tulituliloaina o tulaga lelei mo a matou tagata fa\u02bbatau.\\nAmiotonu\\nTausia
  o le amiosa''o, manino feso''ota''iga, fa''atino tiute.\\nFa''afouga\\nFa\u02bbafouina
  i le atina\u02bbeina o oloa fou, Fa\u02bbasologa o laina gaosiga o masini.\\nTau
  Tauvaga\\nMatou te tulituliloaina i taimi uma fa\u02bbamanuiaga fa\u02bbatasi lea
  e aumaia ai i taimi uma oloa fa\u02bbatauva ia matou tagata fa\u02bbatau.\"", "\"Mo
  Bessie Tam, Polokalama Fa''atonu mo le San Francisco Public Utilities Commission
  (SFPUC) Wastewater Capital Improvement Program, o le a''oa''oina o se sailiga i
  le olaga atoa. Faitau fa''atasi mo se fa''atalanoaga fa''afiafia lea na te toe iloilo
  ai lana malaga fa''apolofesa, fa''amatala vaega e sili ona lu''itau o lana galuega,
  fa''asoa lana va''aiga mo le lumana''i o atina''e vai leaga, ma pa''i atu i auala
  sili e mafai ai e tama''ita''i (ma so''o se tasi, moni lava) ona amata. ma olaola
  i se galuega fa''ainisinia.\\nMai le Amataga - Mauaina o le poto masani ma le amataina
  o se galuega i le Inisinia Alamanuia\\nO le a le mea na muamua fa''aosofia ai lou
  fiafia ile inisinia?\\nE malie lava, ou te le iloa le uiga o le \u201cinisinia\u201d
  mo se taimi umi. A o ou tuputupu ae, sa ou fiafia i le faasaienisi ma le numera.
  O se vaega o lena mea o le faafetai ia Charles Hubert, o se faiaoga lelei o le AP
  Physics mai la''u aoga maualuga, ma o Mr. Hubert na fautua mai ou te manatu o le
  inisinia o la''u kolisi maualuga.\\nNa ia faamatalaina nisi o ituaiga eseese o inisinia,
  ma i le faagasologa o le aveesea o ituaiga e sili ona ou fiafia i ai, na ou filifilia
  ai le Civil and Environmental Engineering. O lena talanoaga ma lo''u faiaoga i le
  aoga maualuga o le mea lea na muai faaosofia ai lo''u fiafia i le inisinia.\\nFa''amatala
  lau malaga fa''apolofesa ina ia e o''o i le mea o lo''o e iai nei, o le Fa''atonu
  Polokalama Laumua mo le Polokalama Fa''aleleia o Tupe Fa''aletupe a le SFPUC.\\nOu
  te matua mitamita lava i lo''u \u201ctagata tupua\u201d ma sa ou auai i tulaga ma
  le Aai ma le Itumalo o San Francisco \u2013 amata i se galuega faainisinia ma ua
  avea nei ma Faatonu o Polokalama. Ae e le gata o a\u02bbu o se tagata faigaluega
  a le Aai ma o se tagata ua leva ona nofomau i San Francisco - o a\u02bbu foi o se
  tagata totogi fua!\\nO le mea na alualu i luma la\u02bbu atina\u02bbe o le galue
  i le Aai ma le Itumalo o San Francisco i le Malaevaalele Faavaomalo a San Francisco
  (SFO), amata mai i lo\u02bbu tausaga lona lua i le kolisi. Na mafai ona ou va\u02bbai
  pe fa\u02bbapefea ona galue mea i totonu o le ofisa o le ofisa ma ''au ma matagaluega
  eseese. Na ou faia ni uo se tele, talisapaia le au faufautua ma uo, ma sa matua
  fiafia lava i lo''u aafiaga faataitai.\\nA o ou i ai i le kolisi, sa ou auai foi
  i le Sosaiete a Tamaitai Inisinia, lea na ofoina atu avanoa tau galuega ma inisinia
  faapolofesa. Sa mafai ona ou fa''aataina le tele o inisinia i le ofisa o le MWH
  i Walnut Creek, CA, lea na ou maua ai se vaaiga sili atu i le itu tumaoti o le alamanuia.
  O nei aafiaga eseese na fa\u02bbamalosia ai lo\u02bbu naunau e tulituliloa se matata
  i le inisinia.\\nIna ua uma ona faauu ma le BS i le Civil and Environmental Engineering,
  na ou maua la\u02bbu galuega muamua i Dames ma Moore, o se kamupani faufautua inisinia
  i San Francisco. I faai\u02bbuga o vaiaso, sa matu\u0101 faatumulia ofisa e pei
  o le vaiaso, ma sa matu\u0101 mamafa le galuega. E ui sa faigata i nisi o taimi,
  o le galulue faatasi ma tagata tomai faapitoa o tomai faapitoa i tulaga faaitulagi
  po o le atunuu, sa matua aoga mo lo\u02bbu tuputupu a\u02bbe o galuega. A o ou i
  ai i Dames & Moore, sa vave ona ou alualu i luma mai se inisinia aufaigaluega i
  se matafaioi pule o galuega faatino. Ona ma\u02bbi faanoanoa ai lea o lo\u02bbu
  tina, ma na ou iloa ai e tatau ona suia le paleni o lo\u02bbu olaga faigaluega ...\\nNa
  ou manatua lo\u02bbu fiafia i lo\u02bbu taimi muamua ma le Aai, ma sa ou manuia
  i le toe fa\u02bbafaigaluegaina i le SFO o se Junior Engineer. Ina ua tupu le 9/11,
  sa tatau i galuega a le SFO ona fa\u02bbaitiitia tupe fa\u02bbaalu, ma na ou siitia
  atu i le SFPUC. Faatasi ai ma le SFPUC, na amata ai ona ou galue o se Inisinia Lagolago,
  sosoo ai ma le Pule Lagolago o Poloketi ae le\u02bbi avea ma Project Manager ma
  le Watershed Roads, Fences & Bridges Program i totonu o le Water Enterprise. O se
  fiafiaga tele lena, o le i ai i fafo ma galulue faatasi ma le au tausi vai i le
  Peninsula ma Sunol.\\nOna sosoo ai lea ma se afa e 100 tausaga na taia ai San Francisco
  ma mafua ai lologa i uta i le tele o pitonu\u02bbu i le Aai i le 2004, ma toe fa\u02bbafo\u02bbi
  e le SFPUC le taulaiga ma amataina se $150M Wastewater Capital Program. E oo atu
  i le 2005, na siitia au i le Project Manager 2 i lenei polokalame fou ma vaaia le
  silia ma le $70M o galuega faatino. I le aluga o taimi, sa ou galue i luga ma avea
  ma Sui Pule Sinia o le Poloketi mo le vaega o le vai otaota/aoina, vaavaaia isi
  pule o galuega e to''avalu na latou fa''atautaia fa''atasi le sili atu i le $2B
  o galuega tetele o le suavai leaga.\\nIa Iuni 2023, na amata ai la''u matafaioi
  i le taimi nei o le Polokalama Fa''atonu mo le Wastewater Capital Improvements Programs,
  lea na fa''amaonia talu ai nei e le SFPUC Commission mo le ~$6B i tupe fa''aleleia
  i le isi sefulu tausaga. O se tauia le alu atu mai le Pule Sinia Poloketi i le Polokalama
  Fa''atonu, ma ua ou matua fiafia lava i le malaga i le taimi nei. I la\u2019u galuega
  atoa i le SFPUC, o le vaaia o le toatele o taitai malolosi ma la latou taitaiga
  i le tele o tausaga ua fesoasoani ma musuia. Na faaosofia ai a\u02bbu e mana\u02bbo
  e ausia le tulaga tutusa o galuega ma musumusuga i la\u02bbu lava matata.\\nNa i
  ai ni tagata po''o se tagata nofofua muamua i lau galuega na faia se aafiaga taua
  i lau atina''e fa''apolofesa?\\nOu te manatu o a''u lava ua laki i le i ai o ni
  faataitaiga lelei i la''u galuega atoa. E faigata tele ona filifili na o le tasi!
  I le SFPUC lava ia, o tagata e pei o Karen Kubick, Manfred Wong, ma Johanna Wong
  sa avea ma supavaisa ma fa''ata''ita''iga mo a''u.\\nAfai e tatau ona ou filifilia
  na o le tasi, o le tagata na faia se aafiaga taua i le amataga o la\u02bbu galuega
  o Mr. Melvin Leong (Mel), le Sui Faatonu mo Fa\u02bbatonu Fa\u02bbatonu Vaega o
  Fa\u02bbatonu i le SFO, o le na fa\u02bbafaigaluegaina a\u02bbu o se tamaititi a\u02bboga
  i le SFO. Ia te a\u02bbu, o ia o le ta\u02bbita\u02bbi sili ona taua, o le sa i
  ai uma le agava\u02bba ma le mafanafana, ma feso\u02bbota\u02bbi atu i tagata faigaluega
  i vaega uma o le fa\u02bbalapotopotoga.\\nE oo lava i le avea ai ma se tagata a\u02bboga,
  na fa\u02bbamalieina a\u02bbu e Mel ou te savali atu i lona ofisa ma talanoa ia
  te ia e uiga i la\u02bbu galuega ma luitau (ioe, luitau o se tamaititi a\u02bboga!!
  LOL). O o''u faiaoga, o e sa faigaluega foi mo Mel, e masani ona fai mai ia te au
  ou te le malamalama i le tulaga ese o Mel i le avea ai ma o matou pule. Sa sa''o
  - Ou te le''i talisapaia atoatoa lona sitaili, uiga galue ma lona aafiaga i lena
  taimi. O lenei, ua ou iloaina le tulaga auro na ia faaalia manino mai.\\nFa''alauiloa
  le Polokalama Fa''alelei Fa''alelei (SSIP) - O se Tupe Fa''afaigaluega i le A''ai
  A''oga i le Lumana''i o Suavai Lafoa''i a San Francisco\\nNa fa''apei le avea ma
  vaega o le uluai atina''e ma le fa''alauiloaina o le SSIP?\\nO le uluai atinae ma
  le faalauiloaina o le Sewer System Improvement Program (SSIP) sa matua fiafia lava!
  O tagata uma i totonu ma fafo o le lala sooupu na mananao e avea ma vaega o le SSIP.
  O le agaga e uiga i le fatuina o se mea e sili atu nai lo i tatou, o le a avea i
  tatou ma se aiga, ma o nei manatu na fa\u02bbamalosia e o\u02bbu ta\u02bbita\u02bbi
  ma au tupulaga lea na sili atu ai le fiafia ma le tauia.\\nO le a sou manatu pe
  aisea e taua ai i tagata le mafaufau i le taua o le tatou alavai?\\nOu te tausua
  ma tamaiti a\u02bboga a\u02bbo\u02bboga e fa\u02bbapea afai e popole inisinia i
  Apple pe fa\u02bbafefea ona fa\u02bbaumatia otaota, e leai sa matou iPhone i aso
  nei. O le alavai i San Francisco, e pei lava o isi nofoaga i le lalolagi, o le faavae
  lea o le sosaiete faaonaponei. O le fa''aogaina lelei o le suavai ose auaunaga taua
  e fa''asa''oloto ai le taimi ma le malosi o tagata e fai ai isi mea, ma ola ai ma
  olaola.\\nE taua foi le manatua o le galue e puipuia ma faaleleia le alavai e mautinoa
  ai le soifua maloloina ma le saogalemu o tagata lautele. E puipuia ai le lelei o
  le suavai mo le siosiomaga ma e fa''avae i le auala tatou te ola ai i aso nei.\\nO
  le a lau va''aiga mo le lumana''i o atina''e vai leaga a San Francisco?\\nO la''u
  va''aiga e mo San Franciscans ma isi i le atunu''u atoa ia talisapaia le matou fa''aogaina
  o otaota vale - pe fa''afefea ona matou togafitia uma otaota ma vai af\u0101 i totonu
  o la matou masini. O le tu''ufa''atasi o sewer system e tu''u mai ai tulaga lelei
  ma lu''itau - va''ai i le matou Sewer System ma Afa. I la''u talanoaga ma San Franciscans,
  e le''i i ai se fa''afitauli ia te a''u e fa''amatala atu i tagata nofomau ma pisinisi
  e uiga i le taua o a tatou galuega tau suavai leaga. Ae ui i lea, o le \\\"sewer
  system\\\" e ese le faagaoioiga mai se \\\"sewer system\\\" o lo\u02bbo maua i le
  tele o isi vaega o le atunu\u02bbu, ma e tatau ona tatou faia se galuega sili atu
  e fa\u02bbamatalaina pe fa\u02bbapefea ona avea nei eseesega ma lu\u02bbitau tulaga
  ese i San Francisco.\\nA o''o ina faigata le aga''i atu, ia fai se fuafuaga!\\nE
  mafai ona e fa\u02bbamaonia se galuega fa\u02bbapitoa po\u02bbo se mea na ausia
  i lau matata e te fa\u02bbamaualuga ai? Na faapefea ona fesoasoani lenei mea i lou
  tuputupu a\u02bbe o se inisinia?\\nO mea uma na ou a\u02bboa\u02bboina, na ou a\u02bboa\u02bboina
  mai le \\\"North Shore to Channel Force Main Project\\\". O lenei poloketi na aofia
  ai le fausiaina o se malosiaga fou (paipa paipa) mai le Embarcadero i luga o le
  Maketi Street ma Mission Street ma faaiu i luma o le Rincon Center i le taulaga.
  O le poloketi muamua lea talu mai le 1980''s na aofia ai le fausiaina o se paipa
  fou i le taulaga o San Francisco.\\nE ala i lenei poloketi sa ou aoaoina ai le tele
  o mea. Ina ia fausia lenei poloketi, matou fa\u02bbamaopoopoina ma sili atu ma le
  10 fa\u02bbaoga tumaoti, SFMTA, pisinisi, le Federal Reserve, sui filifilia i le
  lotoifale, ma isi mea! O le vaega o le poloketi, la matou konekarate, ma isi lala
  sooupu a le Aai sa matua''i galue malosi i luga ma lalo uma. E tasi lava le matou
  sini \u2013 ia fausia lenei laina taua tele e momoli atu ai lapisi tu''ufa''atasi
  mo le itu i matu sasa''e o San Francisco i le fale gaosi otaota i le itu i sautesasae
  o le Aai, puipuia le soifua maloloina lautele ma le lelei o le vai o le Fagaloa.\\nE
  ala i lenei poloketi, na ou iloa ai e mafai e matagaluega a le Aai, tagata nofoia,
  pisinisi, atina\u02bbe, ma faipule ona ausia so\u02bbo se mea pe a tatou galulue
  fa\u02bbatasi ma se fa\u02bbamoemoega manino ma se sini.\\nO le a sau fautuaga mo
  tamaitai talavou o lo\u02bbo tulimata\u02bbia galuega i inisinia i aso nei?\\nMuamua,
  ou te fai atu, ou te fa\u02bbamalosia tagata uma e mafaufau i se matata i le inisinia.
  Ia te a\u02bbu, o inisinia o fa\u02bbafitauli fa\u02bbafitauli o lo\u02bbo fa\u02bbaogaina
  tekinolosi ma saienisi e foia ai fa\u02bbafitauli. Ou te manatu o le a le mea e
  avea ai se inisinia lelei o ni tagata fia iloa ma tatala mafaufau ma le fiafia i
  le foia o faafitauli, ma o lena mafaufau o le a fesoasoani i soo se tasi i la latou
  galuega inisinia.\\nNa ou a\u02bboa\u02bboina i la\u02bbu matata e t\u0101ua tele
  fesoota\u02bbiga lelei. Ole tele ole fofo ole a mana''omia le galulue fa''atasi
  ma isi ''au ma tagata, ma le tele o poloketi o se taumafaiga fa''avae. O le a ou
  ta\u02bbu atu i talavou fa\u02bbapolofesa e fiafia i le tulituliloaina o se matata
  i le inisinia e fa\u02bbatauaina lelei le galulue fa\u02bbatasi ma feso\u02bbota\u02bbiga
  fa\u02bbaopoopo i le itu fa\u02bbapitoa o latou su\u02bbesu\u02bbega. O se tasi
  lena o mafuaaga ou te fiafia tele ai i inisinia - e iai lava se faafitauli e foia.
  E iai lava le sini masani e mafai ona e galulue fa''atasi.\\nO a ni tulaga lelei
  po''o ni fa''aleleia atili ua e va''aia suiga i le fa''ainisinia o le laufanua mo
  tama''ita''i i le tele o tausaga? E fa''afefea ona fa''alauiloa atili e le alamanuia
  le DEI, le tu''ufa''atasiga lea na tatou talanoa ai muamua, aemaise lava mo tama''ita''i?\\nE
  mafai ona ou fai atu ma le mautinoa ou te vaai i le toatele o tamaitai i inisinia,
  pulega o galuega faatino, ma tulaga ta''ita''i iinei i le SFPUC. O se suiga tele
  lena ua ou matauina i le silia ma le 20 tausaga o lo''u galue i le alamanuia. O
  San Francisco e matua alualu i luma i le uiga matou te fa\u02bbamalosia le auai
  mai tagata uma. E tele a matou pa puipui i tulaga o a\u02bboa\u02bboga, eseesega,
  ma saunia se siosiomaga fa\u02bbapitoa mo le aufaigaluega e galulue ai.\\nIna ua
  ou vaai i tamaitai i matafaioi faaletaitai, sa matua faamalosiau lava ia te au i
  taimi uma. O nisi taimi na o le vaai atu i se tasi i se tulaga faaletaitai, e mafai
  ai e se tasi ona mafaufau e i ai se aso e mafai foi ona ou i ai iina. Ou te manatu
  e afua mai i avanoa faufautua. Fa\u02bbaalu taimi ma se tamaititi a\u02bboga, fa\u02bbaali
  atu ia i latou le itu fa\u02bbapitoa o galuega, a\u02bbo fa\u02bbamatalaina foi
  le taua o le galulue fa\u02bbatasi e taua tele.\"", "\"O le ulua\u02bbi fa\u02bbamatalaga
  tusia o le nu\u02bbu na amata mai le 1606. I le afa muamua o le 1th seneturi, o
  se tioata galuega a le aiga o Preissler o metallurgists galulue iinei.\\nI tausaga
  1938-1945, o le to\u02bbatele o tagata Siamani e tautala V\u00edtkovice e mai Nazi
  Siamani. Ina ua mae\u02bba le Taua Lona Lua a le Lalolagi, o le uluai faitau aofa\u02bbi
  o Siamani sa fa\u02bbafaigaluegaina iinei ma o tagata atoa na suia atoa. Talu mai
  lena taimi, o fale i le lotoifale o fale na fa\u02bbaaogaina tele mo fa\u02bbafiafiaga.\\nO
  le aso 5 o Aperila, 2017, na tuuina atu ai le fa\u02bbailoga a le nuu ma se fu\u02bba.\\nOle
  nu\u02bbu e aofia ai le tasi v\u0101ega vaega (V\u00edtkovice i le Giant Mountains)
  ma e le ''vaevaeina i ni vaega o le lotoifale. O le nuu o V\u00edtkovice lava e
  tu i luga o le auala II / 294 i le itu i saute sisifo o le cadastral, o lona itu
  i sisifo o le igoa Horn\u00ed V\u00edtkovice, isi nofoaga (tele nofoaga e iai nuu
  salalau) o loo igoa Lev\u00ednek, Z\u00e1kout\u00ed, Janova Hora, Mevald\u016fv
  Vrch, Skeln\u00e9 Hut\u011b,\u2026\"", "\"A\u2019o tapenapena le atunuu mo le Af\u0101
  Malosi o Amosa ananafi, sa ofoina atu e le Palemia o Tuilaepa Sa\u2019ilele Malielegaoi
  ana talosaga mai Niu Ioka. O loo filo o ia i ta\u2019itai mai le 175 atunuu o loo
  potopoto i lea nofoaga e saini le Feagaiga i Pale e uiga i le suiga o le tau, e
  avea ma feagaiga tau ma\u2019a faamanatu e avea ma ki o se laasaga i luma, aemaise
  ai lava le ulufale atu i totonu o tausaga o le malosi o i luma atu o fuafuaga.\\nO
  le sainia o lea feagaiga na faatino ananafi, e faamanatu ai le Aso o le Eleele.\\nI
  sana tautalaga e uiga i lea sainia o lea feagaiga, o le tamalii Samoa lea o loo
  tu i le foe o Malo Aufaatasi, le Failautusi Aoao o Tupua Ban Ki-moon-na ia viia
  lea sauniga e avea ma \u201cfaagasologa i luma tau le tala faasolopito. \u201cO
  le Feagaiga i Pale ua aiaia ai le mautinoa o le faiga faavae ma le faatonuga manino
  lelei e talosagaina e tagata faipisinisi, tagata lautele ma ta\u2019ita\u2019i o
  se atunuu. I le taimi nei la-e tatau ona tatou avatu se gaoioiga e faasino i le
  tau i le isi maualuga, o le faaaliga lea a Tupua.\\n\u201cO le faia o se galuega
  e uiga i le tau, matou te tuuina atu Sini Tau Atiina A\u2019e Faatumauina ma le
  Pepa o Galuega o le 2030. O malo o atunuu, setete ma le faa-itulagi, aai, le vaega
  o tagata faipisinisi, tagata teutupe faafaigaluega ma tagata lautele o le atunuu-e
  taua i latou uma lava mo le fo\u2019ia o faafitauli matui\u0101 ua aliali mai ona
  o le suiga o le tau. \u201cPulenuu mai le faitau afe ma afe o aai ua latou faaitiitia
  le kasa oona ma faamalosi a latou taumafaiga mo le faaitiiti o faafitauli ona o
  ia faalavelave. Ua matua gaoioi tagata lautele mo se taimi muamua. \u201cUa gaoisi
  e Kamupani tekonolosi tau le siosiomaga ma fuafua lelei le faaaogaina o le malosi
  e mafai ona toe faafou. O tagata teutupe faafaigaluega ua amata ona latou aveese
  tupe maua e matua tele mai teugatupe faafaigaluega mai le suau\u2019u mai le eleele.\u201d
  Ae peitai, e faigata le lagolago tau tupe, o le faaaliga lea a Tupua. \u201cE sili
  mamao atu i lo le $100 piliona-ma o le mea moni, e turiliona tala-o loo mana\u2019o
  mia e faatino ai se tamaoaiga lelei ma le malosi o le lalolagi.\\n\u201cO punavai
  o le malosi e mafai ona faatumauina e tatau ona vave fuafua ina ia talafeagai ma
  le manaomia faanatinati o le malosi o ona po ne ii totonu o le lalolagi tau ati
  a\u2019e. O La\u2019u Malosi e mafai ona Faatumauina mo taumafaiga uma o loo aoga
  i le toatele o outou ona outou faia.\\n\u201cO le Faatinoina o le Feagaiga i Pale
  e manaomia ai atunuu ina ia faatinoina a latou lava fuafuaga faale-atunuu o le tau,
  ma ia faateleina o latou mana\u2019o i le tele o taimi. Ou te ta\u2019utino atu
  ia te outou o le a faatino e Malo Aufaatasi le mea sili na te mafaia e lagolago
  ai Setete e Auai ina ia faatinoina nei fuafuaga.\u201d E tusa ai ma Tupua, i Lima
  ma Pale, o le Fuafuaga o Gaoioiga na faaalia ai le matafaioi a paaga o le tau ina
  ia matua faateleina a latou taumafaiga. \u201cO lenei aoauli o le a faapito i le
  faateleina o gaoioia ma faiga-paaga o i totonu o vaega e tolu tau gaoioiga; ia ia
  matua nofomau i lalo o le maualuga o le tau e 2 tikeri, ia una\u2019ia le faateleina
  ma ia tuliloa le atiina a\u2019e e taofia ai le tau. O gaoioiga a a le Saute-Saute
  e matua taua tele i le salaga o lea vaega.\\n\u201cO anapo na faatinoina ai e lo\u2019u
  ofisa faatasi ai ma le Ofisa o Malo Aufaatasi mo le South-South Cooperation-le \u201cFaatulagaina
  o le Southern Climate Partnership Incubator.\u201dO le ana faanatinatia taumafaiga
  ina ia faavaeina ma faatupe faiga-paaga o le Tau i totonu o atunuu tau atiina a\u2019e
  e lagolago a\u2019i Taumafaiga tau le faatumauina o atiina a\u2019e.\\n\u201cO lenei
  Tuufaatasiga o le a tilotilo taula\u2019i i le malosi e mafai ona toe faafou, aai
  lelei, faamatalaga tetele ma le tulaga lelei o le tau.\\nOu te una\u2019ia outou
  ina ia a\u2019oa\u2019o ni mea se tele ma auai. \u201cO le As\u014d e faasino i
  le aoaoina mai le tasi i le isi ina ia mafai ai ona saga faaleleia i tatou, \u2018alofia
  le toe fai o le mea e tasi, ma ia vave ona faateleina le saoasaoa, tulaga ma le
  tele ua \u2018ausia e paaga o le tau. \u201cOu te una\u2019ia outou uma ta\u2019ito\u2019atasi
  ina ia fiafia ma tau lagalaga. E leai so tatou taimi e tatau ona maumau-ma e anoano
  mea e mafai ona maua-e ala i le faateleina o le galuega tau le suiga o le tau.\u201dSa
  auai le Failautusi a le Iunaite Setete o John Kerry, ma si\u2019isi\u2019i lona
  afafine laititi, i le toatele o ta\u2019ita\u2019i o le lalolagi mo se sauniga e
  saini ai lea aofaiga o pepa mo faigamalo a le lalolagi. E le faapea ona toatele
  ni atunuu e sainia se feagaiga i le aso muamua na maua ai le avano. O Setete sa
  le mafai ona saini i le Aso Faraile ua tuuina atu i ai le tausaga e faatino ai lea
  tulaga. O le toatele ua i ai nei le mannatu o lea feagaiga o le tau o le a amata
  ona faamamaluina a\u2019o lei taitai ona aulia le aso e faamuta ai o le 2020. Fai
  mai nisi e mafai ona tupu i lenei tausaga.\\nIna ua mae\u2019a ona saini, e tatau
  i atunuu ona latou faamaonia aloa\u2019ia muamua le Feagaiga i Pale e ala ia latou
  taualumaga faale-atunuu. Fai mai Malo Aufaatasi e 15 atunuu, o le tele o i latou
  o setete o atumotu laiti ia o loo i lalo o le faamata\u2019u o le siitia o le maualuga
  o le suasami, na faatinoina lea tulaga i le Aso Faraile e ala i le tuuina atu o
  faatonuga e fai ai fesuiaiga.\\nO Saina, le atunuu maoa\u2019e o le lalolagi e afua
  mai ai le kasa oona, na ia folafola o le a na \u201cfaamae\u2019aina taualumaga
  tau lo latou lotoifale\u201d ona ia faamaonia loa lea o le Feagaiga i Pale a\u2019o
  lumana\u2019i ai le fono tele o le G-20 i Saina ia Setema.\\nSa vave ona faafetaia
  e Ban lea folafolaga. Fai mai Kerry ua \u201cmatua naunau lava le Iunaite Setete
  ina ia auai\u201d i lea feagaiga i le tausaga nei. O loo matamata mai le lalolagi
  ma le faanaunau:\\nFai mai latou o loo mata\u2019ituina lea tulaga afai e faamamaluina
  lea feagai i luma o Peresetene Obama ae na te le\u2019i tuua lona tofi ia Ianuari,
  o le a sili atu ona lavelave mo l\u0113 e suitulaga ia te ia ona alu ese mai lea
  maliega talu ai e fa tausaga e faagasolo ai e tusa ai ma tulafono a lea feagaiga.\\nO
  le sui o Saina mo mataupu e faasino i le Tau, o Xie Zhenhua, fai mai o loo faamoemoe
  lona malo o le a auai le Iunaite Setete i lea feagaiga o le tau \u201ci se taimi
  vave e mafai ai.\u201d Na tuuina atu e le Iunaite Setete lea feagaiga i totonu o
  faaupuga tau le tamaoaiga.\\n\u201cO le malosi o lenei feagaiga e faapea o le a
  le mea o le a mafai ai ona tatala ia sa\u2019oloto tagata faipisinisi,\u201d o le
  faaaliga lea a Kerry i le potopotoga, ma na ta\u2019ua ai e faapea o lenei tausaga
  o lea ua sauni atu e avea ma tausaga e sili ona vevela e pei ona faamaumauina.\\nO
  lea feagaiga o le a amata ona faamamaluina i le taimi lava e auai aloa\u2019ia le
  a itiiti mai o le 55 pasene o atunuu o le lalolagi e maua ai le kasa oona.\\nO se
  fuafuaa na fai e le World Resources Institute e faamautu i Uosigitonu na maua ai
  e faapea a itiiti mai o le 25 atunuu o loo fai ma sui o le 45 pasene o kasana oona
  i le lalolagi ua auai i lea feagaiga i le Aso Faraile pe ua noatia foi ina ia auai
  i se taimi vave.\\nFai mai le Peresetene o Falani o Francois Hollande, o ia lea
  na muamua ona sai i lea feagaiga, o le a na talosagaina le palemene ina ia faamaonia
  lea feagaiga i lenei vaitau o le tau mafanafana. O le Minisita o le siosiomaga o
  Falani o ia lea e pule i feutanaiga e faasino i le tau a le lalolagi.\\nUa le toe
  i ai se avanoa i le taimi nei e toe liliu ai i tua,\u201d o le faaaliga lea a Hollande
  i le potopotoga..Na folafola foi e le Palemia o Kanata o Justin Trudeau e faapea
  o le a faamaonia e lona atunuu le feagaigai i le tausaga nei. O isi atunuu na fai
  mai i le Aso Faraile ua i ai lo latou faamoemoe e auai i lea feagaiga i lenei tausaga-
  e aofia ai Mexico ma Ausetalia.\\nO lea sauniga o le tau na avatu faatasi ai se
  vaega tele o setete ia o loo i luga o isi mataupu-ia e ono mafai ona matua tete\u2019e
  lava i ai.\\nO le minisita o le va i fafo a Korea i Matu na auai i se faiga e le
  masani ai a Malo Aufaatasi ma saini i le Aso Faraile, ma le Peresetene o Zimbabwe
  o Robert Mugabe ma na matua patipatia ina ua na folafolaina, \\\"O le Ola lava ua
  i se tulaga faigata i totonu o lenei tauiviga. Ua ia i tatou le malosi e manumalo
  ai.\u201d\\nO Atunuu ia latou te le\u2019i faailoa atu latou te saini i lea feagaiga
  i le Aso Faraile e aofia ai nisi o atunuu tetele o le lalolagi e galuea\u2019ina
  le suau\u2019u, e aofia ai Saudi Arabia, Iraq, Nigera ma Kazakhstan, o le faaaliga
  lea a le World Resources Inititute.\\nO le Feagaiga i Pale, o le tali a le lalolagi
  i tau e sili ona vevela, siitia o le maualuga o le suasami ma isi lava faafitauli
  o le suiga o le tau, na ausia ia Tesema e tusa ai ma le fesili poo ai e tatau ona
  ia faia le a.\\nE tusa ai ma lea feagaiga, sa faatulaga e atunuu a latou lava fuafuaga
  mo le faaitiiti o le kasa oona o le kaponi ma isi lava kasa oona. O vaaiga tau sili
  e le o mausali faale-tulafono, ae tautau i atunuu ona tuuina atu faamatalaga ia
  i latou i le ta\u2019i 5 tausaga uma..\\nUa uma ona feagai setete ma le faigata
  ona toe fia o nisi mea. O fuafuaga ma suesuega faa-Saienesi ua faaalia ai le vaega
  muamua o fuafuaga ua ofo mai e atunuu i Pale ia e le fetaui ma le faamoemoe tu\u2019utu\u2019u
  \u2013loloa o le maliega mo vaitaimi uumi ina ia tausisia le vevela o le lalolagi
  i lalo ifo o le 2 tikeri le vevela (3.6 tikeri Fahrenheit), faatusatusa i taimi
  i luma atu o le taimi o oloa gaosia.\\nO le vevela e laugatasia ai le lalolagi ua
  loa ona \u2018a\u2019e i luga ma ua toetoe lava 1 le tikeri Celsiua. O le tausaga
  talu ai o le tausaga aupito i vevela lea ua faamauina. O le faatulagaina talu ai
  nei e tusa ai ma le fuafuaga a le Climate Interactive na faaalia ai i talosaga i
  Pale ua tuu atu ai le lalolagi i luga o se ala mo le 3.5 tikeri Celsius o le mafanafana.\\nO
  se faatulagaina e ese ai a le Climate Action Tracker, o se vaega lea a Europa, na
  valoia ai se mafanafana e 2.7 tikeri Celsiua.\\nPoo le a lava, fai mai saienesi
  o ona taunuuga e ono matua faigata lava i nisi nofoaga, e tafe ese ai uma ai meatot\u014d,
  tafega i le gataifale ma liua suavai ai le sami aisa i le Atika.\\n\u201cE le o
  se mea lelei lenei mo malo o tatou atumotu, a itiiti mai e le o le taimi nei,\u201d
  o le faaaliga lea a le taitaifono o Setete Tuufaatasi o Atumotu Laiti , le Peresetene
  o Nauru o Baron Divavesi Waqa i le potopotoga. \u201cO le galuega aupito i faigata
  o lea ua amata i le taimi nei.\u201d\\nA\u2019o faagasolo i luma le Feagaiga i Pale,
  o loo i ai ni tala fiafia, vevela uiga ese o le Lalolagi, le puna aupito i tele
  o kasa oona e gaosia e le tagata, na faaletonu i le tausaga talu ai e ui lava ina
  sa tupu pea le tamaoaiga o le lalolagi, e tusa ai ma se Sui Sooupu o se Internationa
  Energy Agency\\nAe poo le a lava, o sua\u2019u mai le eleele e matua faaaoga e le
  toatele i lo puna o malosi toe faafou e pei o le matagi ma le La.\\n*Lipoti faaopoopo
  mai le AAP\"", "\"Curling Iron O le nano airy curling iron fa\u02bbaaoga se fou
  fou ion ion tekonolosi. Tausia ia lamolemole lamolemole, lemu susulu curl mo se
  taimi umi. O le curling paipa ua uma ona faia se nano-sima ufiufi, lagona sili lamolemole.
  E fa\u02bba\u02bbofu le laulu ma le agamalu ma fa\u02bbavave i le ea mafanafana
  o iona le lelei. Fa\u02bbatusatusa i curling u\u02bbamea e aunoa ma le ea, e mafai
  ona e fa\u02bbaumaina i se la\u02bbau sili malie o le lauulu.O le lanu autu o le
  oloa e vaivai, mafanafana ma mama matte pa\u02bbepa\u02bbe, ma o le lanu lanu o
  lanu piniki auro.\"", "\"E lima itumalo na oo ane o latou sui, e aofia ai ma afioga
  I Faipule, e saini maliega tau tupe muamua o le Poloketi miliona tala.\\nO itumalo
  e aofia ai le Fono Faavae a le itumalo o Gagaifomauga 3.\\nGagaifomauga tolu o le
  itumalo lea o le Afioga I le Minisita o Faatoagama Faigafaiva, Laaulialemalietoa
  Polataivao Leuatea Fossie Schmidt, na Malaga mai ai matai, ole itumalo e aofia ai
  le failautusi a le fono faavae ole itumalo,\\nNa saunoa ai le Failautusi, \u201ce
  tai 10 uaea papovi 300mita a le ogaumu, e puipuia mai ai mea toto mai le faatamaia
  e meaituaolo ma manupalagi.\\n\u201cO le faamuamua o mea toto, I tiapula, e vave
  ona selesele ma toe kava mai ai le tupe lea na alu.\\nO isi itumalo ua saini foi
  vaega a latou miliona tala, e aofia ai le: Fono Faavae a Siumu. O lona Faipule,
  le Tofa a Tuu Anasii na Malaga mai ma le sui ole komiti a le Itumalo, mo le latou
  foi faamanuiaga.\\nO le fono faavae a le itumalo o Lefaga ma Faleaseela. O le faipule
  foi o le itumalo afioga a Masinalupe Makesi Masinalupe ma lona soatau na Malaga
  mai e saini le latou foi faamanuiaga.\\nOle Fono faavae a le itumalo o Anoamaa 1,
  o le afioga foi I le Faipule o le Itumalo afioga Aai\u2019asa Moefaauouo Tapua\u2019I
  Sepulona Moananu ma le sui o le komiti na saini .\\nMa le fono Faavae a le itumalo
  o Vaimauga 3, lea o loo faatalitali le latou Palota laititi I le vaiaso fou, na
  faato\u2019a umusa atu lana maota fou mo le ofisa faaitumalo I Vailima.\\nAe ua
  faamalieina le pulega ole miliona tala I lana tala o le tupe, ma fuafuaga alualu
  mamao, ma ua faamatuu atu loa iai I le aso, lesi vaega tupe e sosoo ai, le $150afe
  tala mo le faatupeina o galuega faasolo ole poloketi.\\nO le afioga ile Minsita
  o le Matagaluega o Tina ma Tamaitai ma Agafesoota\u2019I, , Leota Laki Sio ma le
  afioga I le Minisita o Tupe Mulipola Analosa Ale Molioo na fai ma sui o le malo
  I le fesagaiga, ma sui o itumalo ua saini isi laasaga o a latou tai miliona o le
  poloketi e alu sa\u2019o ai tupe I manaoga o tagata o loo ave iai le faamuamua a
  le malo.\"", "\"Suesuega Lab ofoina pulea, suesuega fanua ofoina taulima, ma suesuega
  fanua faafuainumera tuufaatasia pulea ma taulima i fua.\\nO suesuega mai i le tele
  o foliga eseese ma fuaitino. Ae, e ui lava i nei eseesega, ua maua suesue e fesoasoani
  e faatulaga o suesuega i se paluga i le va o lab suesuega ma suesuega fanua. O lenei,
  ae peitai, e tatau ona faatulaga foi suesue o suesuega i se paluga i le va o analog
  suesuega ma suesuega faafuainumera. O lenei avanoa mamanu e lua e faatafa-o le a
  fesoasoani e te malamalama ai i le malosiaga ma vaivaiga o auala eseese ma fautua
  atu ni vaega o avanoa silisili (Ata 4.1).\\nI le taimi ua tuanai, o le autu auala
  e faatulagaina suesue suesuega sa faatasi ai le tulaga lab-fanua. O le tele o suesuega
  i le faasaienisi lautele o suesuega lab mea faatino tamaiti malaga galuega uiga
  ese i se lab mo aitalafu ala. O lenei ituaiga o suesuega dominates suesuega i mataupu
  tau le mafaufau aua e mafai ai ona suesue e fatu lava togafitiga faapitoa ua fuafuaina
  ina ia tofotofoina manatu lava patino e uiga i amioga lautele. Mo faafitauli faapitoa,
  peitai, o se mea e lagona e se si ese e uiga i le tusia o faaiuga malosi e uiga
  i amioga faaletagata mai e tagata e le masani ai le faatinoina o sea galuega e le
  masani ai i sea tulaga e le masani ai. O nei popolega ua taitaiina atu ai i se gaoioiga
  i suesuega fanua. suesuega Field tuufaatasia le mamanu malosi o suesuega randomized
  pulea ma sili atu vaega sui o tagata auai, e faatinoina e sili atu galuega masani,
  i le sili tulaga faalenatura.\\nE ui lava ina manatu nisi tagata o suesuega lab
  ma fanua e pei ona tauva auala, e sili e mafaufau ia i latou e pei ona felagolagomai
  metotia ma eseese malosiaga ma vaivaiga. Mo se faataitaiga, Correll, Benard, and
  Paik (2007) faaaoga uma a lab faataitaiga ma se faataitaiga fanua i se taumafaiga
  e maua ai le faapogai o le \\\"faasalaga faatina.\\\" I le Iunaite Setete, tina
  maua ai se tupe e itiiti ifo nai lo tamaitai se fanau, e tusa lava pe le faatusatusaina
  o tamaitai i tomai e tutusa galulue i galuega faapena. E tele faamatalaga mafai
  ai i lenei mamanu, ma o se tasi o le ua biased galuega e faasaga i tina. (O le mea
  malie, o le faafeagai e foliga mai e moni mo tama: ua latou taumafai e maua le sili
  atu nai lo tutusa tagata se fanau). Ina ia mafai ona iloilo faaituau mafai e faasaga
  i tina, na tamoe Correll ma paaga suesuega e lua: o le tasi i le lab ma le tasi
  i le fanua.\\nSili, i le a lab faataitaiga ta\u02bbu Correll ma paaga i tagata auai,
  oe sa undergraduates le kolisi, sa le faafoeina o se kamupani fesootaiga amataga-ae
  faale-Kalefonia se galuega sailiga mo se tagata e taitai ona matagaluega maketi
  fou le Talafatai i Sasae. Na ta\u02bbu atu e faapea o le manao kamupani la latou
  fesoasoani i le faatonu faagasologa ma na talosagaina ai i latou e iloilo ai Toe
  faaauau le galuega o le tele o sui tauva le gafatia ma le e fua le sui tauva i le
  tele o itu e pei o lo latou le malamalama tamaiti o le vasega, mafanafana, ma le
  naunautai e galulue. Gata i lea, o le na fesili atu i tamaiti pe o le a latou pepa
  faataga o le aumaia o le tagata talosaga ma le mea o le a latou pepa faataga o le
  avea o se e amata totogi. O silafia e tamaiti o le vasega, ae peitai, na fausia
  faapitoa le Toe faaauau le galuega e tutusa vagana ai se mea se tasi: o nisi o le
  Toe faaauau le galuega faailo tina (e ala i le lisiina o le auai i se faalapotopotoga
  matua-faiaoga) ma o nisi e leai. maua Correll sa itiiti ono fautuaina tamaiti faatonu
  le tina ma ofoina atu o totogi amata pito i lalo. Gata i lea, e ala i se iloiloga
  faafuainumera o le gata i le faatulagaga ma le faaiuga e faatatau i le faatonu,
  na faamalamalama mai e tele maua Correll e tina tulaga le lelei e ala i le mea moni
  e faapea na faatulagaina tina i lalo i le tulaga o le agavaa ma le tautinoga. I
  se isi faaupuga, finau Correll o nei uiga o le faiga lea o loo mafatia tina. O lea,
  sa faatagaina e lenei faataitaiga lab Correll ma paaga e fua a causal aafiaga ma
  tuuina atu se faamatalaga e mafai ai mo lena tulaga.\\nO le mea moni, o se tasi
  atonu e masalosalo e uiga i le tusia o faaiuga e uiga i le maketi o galuega atoa
  US e faavae i luga o le faaiuga o ni nai selau undergraduates oe atonu e leai lava
  se galuega atoa taimi, ia na faafaigaluegaina tagata. O le mea lea, faia foi Correll
  ma paaga a faataitaiga fanua felagolagomai. Sa tali mai le suesue i le faitau selau
  o faasalalauina avanoa galuega i le auina atu i le tusi ma Toe faaauau le galuega
  taufaasese faavaa. E tali tutusa ma le mea o faaalia i le undergraduates, o nisi
  Toe faaauau le galuega faailo faatina ma o nisi e leai. maua Correll ma paaga sa
  itiiti ono tina e ona valaau atu i ai mo le faatalanoaga nai lo tutusa lava le agavaa
  o tamaitai fanau. I se isi faaupuga, galuega moni le faia o faaiuga faatupulaia
  i se tulaga faalenatura amio tele e pei o le undergraduates. Pe na latou faia ni
  faaiuga faapena mo le mafuaaga lava lea e tasi? Ae paga lea, tatou te le iloa. sa
  le mafai e le tagata su\u02bbesu\u02bbe i le fai atu i le tagata e ona galuega e
  fua le sui po o faamalamalama mai a latou faaiuga.\\nO lenei soa o suesuega faaalia
  se tele e uiga i suesuega lab ma fanua i aoao. suesuega Lab ofoina suesue latalata
  pulea atoa o le siosiomaga o loo faia auai faaiuga. O lea, mo se faataitaiga, i
  le faataitaiga lab, sa mafai ona faamautinoa Correll na faitau Toe faaauau le galuega
  uma i totonu o se nofoaga filemu; i le faataitaiga fanua, e mafai e le lava ua faitau
  nisi o le Toe faaauau le galuega. Gata i lea, ona auai i le faatulagaga lab iloa
  o loo suesueina i latou, e masani ona mafai ona suesue e aoina faamatalaga faaopoopo
  e mafai ona fesoasoani ia i latou ia malamalama pe aisea ua le faia tagata e auai
  latou faaiuga. Mo se faataitaiga, fesili Correll tagata auai i le faataitaiga lab
  e fua le sui tauva i itu eseese. O lenei ituaiga o faamatalaga faagasologa e mafai
  ona fesoasoani suesue malamalama i le auala i tua o le eseesega i le auala e tausia
  ai tagata o le vasega le Toe faaauau le galuega.\\nI le isi itu, o nei uiga tonu
  lava o le a ou le na faamatalaina o tulaga lelei ua manatu o nisi taimi foi tulaga
  le lelei. Suesue oe na sili fanua suesuega finau e mafai ona galue lava e ese tagata
  auai i suesuega lab pe a latou le matauina ma le totoa. Mo se faataitaiga, i le
  ono mate auai faataitaiga lab le sini o le suesuega ma suia a latou amioga ina ia
  aua e foliga mai biased. Le isi, o tagata suesue oe na mananao ia mafai ona finau
  o le suesuega fanua eseesega laiti i le Toe faaauau le galuega e mafai ona na o
  le tu atu i se mama, siosiomaga manu\u02bba lab, ma faapea ona a i-faatatau le faataitaiga
  lab le aafiaga o le tulaga faatina i faaiuga moni faatonu. Mulimuli ane, o le toatele
  proponents o suesuega fanua faitioina suesuega lab faalagolago i luga o tagata o
  le vasega ese lava: e matele tamaiti aoga mai i Sisifo, e a\u02bbotauina, Industrialized,
  Rich, ma atunuu Democratic (Henrich, Heine, and Norenzayan 2010) . O le suesuega
  e Correll ma paaga (2007) faaalia ai le soona lua i luga o le paluga lab-fanua.
  I le va o nei lua soona o loo i ai le tele o fuafuaga hybrid e aofia ai auala e
  pei o le aumaia e le tagata o le vasega i se lab po o le alu i le fanua ae ua i
  ai pea tagata o le vasega e faatinoina se galuega e le masani ai.\\nI le faaopoopo
  atu i le tulaga fanua-lab ua i ai i le taimi ua tuanai, o le tausaga faafuainumera
  o lona uiga o loo i ai nei suesue se vaaiga tele lona lua i lea suesuega e mafai
  ona fetuunai: analog-faafuainumera. E pei lava ona i ai ni suesuega mama lab, suesuega
  mama fanua, ma a o hybrids eseese i le va o le, o loo i ai o suesuega analog mama,
  mama o suesuega o komepiuta, ma a o hybrids eseese. O tricky e ofo atu se faamatalaga
  aloaia o lenei tulaga, ae o se faamatalaga galuega aoga o le suesuega atoatoa faafuainumera
  o suesuega o le faaaogaina o galuega faafuainumera e faafaigaluegaina tagata auai,
  randomize, laveai togafitiga, ma fua o taunuuga. Mo se faataitaiga, o le Restivo
  ma van Rijt de (2012) suesuega o barnstars ma Wikipedia o se faataitaiga atoatoa
  faafuainumera ona faaaoga faiga faafuainumera mo tagata uma e fa o nei laasaga.
  E faapena foi le atoatoa o suesuega analog o suesuega e le faaaogaina o galuega
  faafuainumera mo se tasi o nei laasaga e fa. O le tele o suesuega masani i mataupu
  tau le mafaufau o suesuega analog. I le va o nei soona lua o loo i ai se vaega o
  suesuega o faafuainumera o loo faaaogaina o se tuufaatasiga o faiga analog ma faafuainumera
  mo le laasaga e fa.\\nOna taua, o le avanoa e tamoe ai e le na o luga o le initoneti
  o suesuega faafuainumera. Suesue e mafai ona taufetuli vaega faafuainumera o suesuega
  i le faaaogaina o masini komepiuta i le lalolagi faaletino ina ia laveai togafitiga
  po o fua taunuuga. Mo se faataitaiga, suesue mafai ona e faaaogaina telefoni poto
  e laveai togafitiga po sensors i le siosiomaga fausia e fua ai taunuuga. O le mea
  moni, e pei ona o le a tatou mulimuli ane i lenei mataupu, ua uma ona faaaoga suesue
  mita mana aiga e fua ai taunuuga i suesuega e uiga i faiga masani faasosaiete ma
  le malosi le taumafaina e aofia ai 8.5 miliona o aiga (Allcott 2015) . A o faateleina
  tuufaatasia masini komepiuta i olaga o tagata ma sensors avea tuufaatasia i totonu
  o le siosiomaga fausia, o nei avanoa e tamoe vaega o suesuega faafuainumera i le
  a faateleina manino le lalolagi faaletino. I se isi faaupuga, o suesuega faafuainumera
  e le na o suesuega i le initoneti.\\nfaia faiga Faatekinolosi avanoa fou mo suesuega
  i soo se mea i le paluga lab-fanua. I suesuega mama lab, mo se faataitaiga, suesue
  mafai ona e faaaogaina faiga faafuainumera mo sili atu ona lelei fua o le auai ''amioga;
  se tasi o faataitaiga o lenei ituaiga o faaleleia fua o meafaigaluega sailia-mata
  lea e aiaia ai faiga tonu ma le faifai pea o nofoaga vaai. O le tausaga faafuainumera
  foi e faatupuina ai le avanoa e tamoe lab-e pei o suesuega i le initoneti. Mo se
  faataitaiga, faaaogaina vave ua suesue Amasone Turk masini (MTurk) e faafaigaluegaina
  tagata auai mo suesuega i le initoneti (Ata 4.2). fetaui MTurk \\\"galuega\\\" o
  loo i ai galuega e tatau ona maea i le \\\"tagata faigaluega\\\" e fia faamaea latou
  galuega mo le tupe. E le pei o maketi masani galuega, peitai, o le galuega e aafia
  ai e masani lava ona na o le manaomia ai ni nai minute e faamaea ai ma le atoa fegalegaleaiga
  i le va o tagata e ona galuega ma tagata faigaluega o tafailagi. Ona vaega mimics
  MTurk o suesuega o le totogi masani lab tagata e faamaea ai galuega o le a latou
  l\u0113 faia mo saoloto-e masani talafeagai mo nisi ituaiga o suesuega. O le mea
  moni, ua foafoaina MTurk le atinae eseese mo le puleaina o se vaitaele o tagata
  auai-sailia ma le totogiina o le aveina tagata-ma suesue lelei o lena atinae eseese
  e tata i se vailepa maua pea o tagata e auai.\\nfaia o suesuega Faatekinolosi e
  sili atu avanoa mo suesuega fanua-e pei o. e mafai ona ofoina atu o suesuega fanua
  Faatekinolosi faamatalaga malu lelei pulea ma le faagasologa ina ia malamalama i
  auala e mafai ai (e pei o suesuega lab) ma sili atu tagata auai eseese le faia o
  faaiuga moni i se siosiomaga o le lalolagi (e pei o suesuega fanua). I le faaopoopo
  atu i lenei tuufaatasiga o lelei uiga o suesuega muamua, o suesuega o fanua faafuainumera
  ofoina atu foi avanoa e tolu sa faigata i suesuega analog lab ma fanua.\\nMuamua,
  ae sili ona suesuega analog lab ma fanua i ai le faitau selau o tagata e auai, o
  suesuega o fanua faafuainumera mafai ona i ai le faitau miliona o tagata e auai.
  O lenei suiga i le fua o ona o nisi o suesuega faafuainumera e mafai ona tuuina
  atu faamatalaga i le o tau ma liuliuina. O le, o le taimi ua foafoaina suesue se
  atinae eseese faataitai, faateleina e le faateleina masani o le aofai o tagata auai
  o le tau. Faateleina le aofai o tagata o le vasega e se vaega o le 100 pe sili atu
  o le na o se suiga Aofaiga, o se suiga qualitative, aua e mafai ai ona suesue e
  aoao mea e ese mai suesuega (eg, heterogeneity o aafiaga togafitiga) ma taufetuli
  atoa eseese fuafuaga faataitai ( eg, suesuega vaega toatele). O lenei manatu e taua
  tele, o le a ou toe foi atu i ai i le faaiuga o le mataupu ina ua ou ofo atu fautuaga
  e uiga i le faia o suesuega faafuainumera.\\nLona lua, ae sili ona suesuega analog
  lab ma fanua faia auai o indistinguishable widgets, e masani ona faaaoga faamatalaga
  o suesuega fanua faafuainumera e uiga i tagata o le vasega i le mamanu ma le iloiloga
  vaega o le suesuega. O lenei faamatalaga, lea ua taua o faamatalaga muai togafitiga,
  e masani lava ona maua i suesuega faafuainumera ona latou faia i le siosiomaga fuaina
  atoatoa. Mo se faataitaiga, o se tagata suesue i le Facebook ua tele nisi faamatalaga
  togafitiga-muamua nai lo se tagata suesue le fuafuaina o se tulaga faatonuina faataitaiga
  lab ma undergraduates. O lenei faamatalaga muai togafitiga e mafai ai ona suesue
  e agai i tua atu o le taulimaina o le vasega e pei indistinguishable widgets. Sili
  patino, faamatalaga muai togafitiga e mafai ai fuafuaga-e faataitai sili atu le
  lelei o polokaina (Higgins, S\u00e4vje, and Sekhon 2016) ma tapulaa fuafuaina faafaigaluegaina
  o tagata o le vasega (Eckles, Kizilcec, and Bakshy 2016) -ma iloiloga-e sili atu
  ona ''anoa e pei estimation o heterogeneity o aafiaga togafitiga (Athey and Imbens
  2016a) ma fetuunaiga covariate mo le sa\u02bbo atoatoa faaleleia (Bloniarz et al.
  2016) .\\nLona tolu, ae o le tele o suesuega o lab analog ma fanua laveai togafitiga
  ma fua o taunuuga i se aofaiga matua faafeoma\u02bbi o taimi, o nisi o suesuega
  fanua faafuainumera aofia ai togafitiga e mafai ona tuuina atu i le taimi ma le
  aafiaga e mafai foi ona fuaina le aluga o taimi. Mo se faataitaiga, faataitaiga
  a Restivo ma van Rijt de ei ai le taunuuga fuaina i aso uma mo le 90 aso, ma o se
  tasi o le suesuega o le a ou ta\u02bbu atu ia te outou e uiga i se taimi mulimuli
  ane i le mataupu (Ferraro, Miranda, and Price 2011) Isi Auala taunuuga i luga o
  le 3 tausaga i le e ta\u02bbu leai se tau. Nei e tolu avanoa-tele, faamatalaga muai
  togafitiga, ma togafitiga longitudinal ma taunuuga faamatalaga-e sili ona taatele
  pe o suesuega o loo taufetuli i luga o taimi uma-i luga o fua faiga (tagai i le
  Mataupu 2 mo le sili atu i taimi uma-i luga o faiga fua).\\nA o suesuega faafuainumera
  fanua ofoina atu le tele o avanoa, latou faasoa atu foi nisi vaivaiga ma uma lab
  analog ma suesuega fanua. Mo se faataitaiga, e mafai ona faaaogaina o suesuega e
  suesue i le taimi ua tuanai, ma e mafai ona latou na faatatau le aafiaga o togafitiga
  e mafai ona faaseseina. Foi, e ui lava o suesuega ua mautinoa lava le aoga e taiala
  o faiga faavae, o le tonu le taitaiga e mafai ona latou ofoina atu o teisi faatapulaaina
  ona o faafitauli e pei o le faalagolago o le siosiomaga, faafitauli tausisia, ma
  aafiaga equilibrium (Banerjee and Duflo 2009; Deaton 2010) . Mulimuli ane, o suesuega
  o fanua faafuainumera faalautele le popolega tauleleia faia e suesuega fanua. Proponents
  o suesuega fanua pu lo latou tomai e faalavelave unobtrusively ma soo i faaiuga
  faatupulaia faia e le faitau miliona o tagata. O nei vaega ofoina nisi tulaga lelei
  faasaienisi, ae e mafai foi ona faia lavelave ethically suesuega fanua (mafaufau
  e uiga i ai e pei ona suesue le taulimaina tagata e pei o \\\"lab isumu\\\" i se
  tulaga matautia). Gata i lea, e faaopoopo atu i faaleagaina mafai ona auai, o suesuega
  o fanua komepiuta, ona o lo latou fua, e mafai foi ona sii i luga o popolega e uiga
  i le fa\u02bbalavelave o le galulue faiga lautele (eg, atugaluga e uiga i le faavevesia
  faiga taui a le Wikipedia afai tuuina Restivo ma van der Rijt tele barnstars) .\"",
  "\"I luga o lenei ''upega tafa\u02bbilagi fa\u02bbapea ma le tele o isi, e tele
  lava ina tusia e uiga i le fa\u02bbaleagaina i le lalolagi. O le tele o le aufaitau
  ua latou iloaina talu ai ua i ai se tasi i se mea pepa luga luga lea e galue agai
  i se malo o le lalolagi pe o lo\u02bbo aga\u02bbi malie malie atu tagata i le fa\u02bbauigaina
  o le tagata. O lona uiga o le a sili atu ona tatou tautau i luga o le initaneti
  ma tuufaatasia o tatou tino ma mafaufauga. Soo se tasi e manatu o lea saoasaoa o
  le a le alu pe tatau ona faia se isi taumafaiga, mo se faataitaiga lenei tusiga
  faitau. Atonu tatou te mafaufau pe o le a se mea sese i se malo o le lalolagi (e
  pei o le lenei tusiga) pe o\u02bbo foi i le transhumanism. Afai tatou te mafaufau
  nei i lena alualu i luma, e leai se mea sese. Se\u02bbi faapea tatou te manatu o
  le pito i luga o le elitist o le mea sili lea mo le tagata soifua, o mea uma e le
  leaga tele? So\u02bbo se tasi o lo\u02bbo manatu pea e le o iai se luga o le elitist
  pito i luga, atonu o se mea valea tele. O le mea lea e muamua ona tatou taulimaina
  le fesili pe oi ai se laupepa elitist e pulea ai atunuu ma malo i tua atu o vaaiga
  ma e malosi le malosi ia i latou e mafai ai ona latou faia ni taua, taaalo ituaiga
  uma e faasaga i le tasi ma taaalo i se taaloga o le ''vaeluaina ma puleaina atili
  le mana ma sili atu. E le gata i lea, tatou te va\u02bbava\u02bbai tutusa i atina\u02bbe
  faatekinolosi ma le auala e mafai ona fa\u02bbaaogaina ai e lenei ta\u02bbita\u02bbifiti
  lugaga e fa\u02bbafeiloa\u02bbi lemu tagata i se cyborg. E tasi le isi mea e fai
  i le isi?\\nO fesili fa\u02bbalavelave e masani ona faigata ona taliina. E mana\u02bbomia
  su\u02bbesu\u02bbega ina ia iloa ai o lo\u02bbo i ai se vaega o tagata o lo\u02bbo
  tamomoe i le lalolagi. Afai e te le faia lena mea, o lau ata o le mea moni atonu
  e fuafua tele i mea na e aoaoina i le a\u02bboga ma mea e te va\u02bbaia i le aufaas\u0101lalau.
  Mo se fa\u02bbata\u02bbita\u02bbiga, afai e te va\u02bbai i le talafaasolopito lata
  mai ma e le fa\u02bbagataina oe lava i Wikipedia, ae ia faia su\u02bbesu\u02bbega
  i isi tusitusiga fa\u02bbapitoa, atonu e te iloa o lo\u02bbo fausia le lalolagi
  e ala i fa\u02bbalapotopotoga e feso\u02bbota\u02bbi fa\u02bbatasi i totonu o le
  fa\u02bbatulagaina o le pyramid. E i ai le tele o fa\u02bbalapotopotoga e taua latou
  lava faalilolilo; sosaiete faalilolilo o igoa eseese ma matafaioi. O nei fa\u02bbalapotopotoga
  o lo\u02bbo galulue fa\u02bbatasi i le lalolagi atoa ma maua ai se tulaga fa\u02bbapitoa.
  A aunoa ma le tele naua o au fa\u02bbamatalaga, e mafai ona e iloa lena, mo se faataitaiga,
  o sui o aiga tautupu o ni sui o ia fa\u02bbalapotopotoga. O le mea moni, o ia fa\u02bbalapotopotoga
  ma a latou galuega e fa\u02bbaititia i le aufaas\u0101lalau. O Freemasonry, mo se
  fa\u02bbata\u02bbita\u02bbiga, o le mea muamua lava e fai mai o le ituaiga o ''au
  tama matutua'' ''aufaipese. Afai e te faia lau su\u02bbesu\u02bbega, o le ae iloa
  o lo\u02bbo i ai le tele o tua i tua. E mafai ona e o\u02bbo mai i le faaiuga o
  taua e pei o le taua muamua a le lalolagi ma le taua lona lua a le lalolagi na fuafua
  lelei i le latou fa\u02bbatinoga ma le taunu\u02bbuga.\\nO le taua muamua o le lalolagi
  atonu o le faamoemoe e faia le Malo o Ottoman (mo sina taimi) se ipu e itiiti ifo
  e tuu ai fanua mo le setete o Isaraelu i Palesitina; sui le Russian tsar ma se paionia
  Siona (Lenine) ma saunia le lalolagi mo le vaega 2 o le lisi o mataupu (Taua Lona
  II a le Lalolagi). O le taua lona lua a le lalolagi atonu o le faamoemoe e tuuina
  atu i tagata Iutaia o latou lava tulaga. Mo lenei, o se toe si\u02bbitia tele e
  tatau ona fa\u02bbamalosi. O le tulaga tatau mo lenei mea na puipuia e ala i le
  tausalaina o le faigata e uiga i le mea na faia e tagata Iutaia i le taulaga mu.
  E to\u02bbatele ua maliliu e tusa ai ma nisi e le o le tolauapiga a Auschwitz, ae
  i le taimi o le fasioti tagata i luga o le faitau aofa\u02bbi Siamani. E le gata
  i Rusia, ae sili atu i le 20 miliona na maliliu ai. O le misiona a Hitler e fai
  ai Rusia se ipu laitiiti e foliga mai o le a masalomia lona le manuia. O ai na auina
  atu ana ''au i le tau malulu malulu o Rusia e aunoa ma ni lavalava taumalulu? O
  le setete o Isaraelu sa faaalia i se taimi puupuu talu ona mavae le Taua lona Lua
  a le Lalolagi (1948). Pe na o le Hitler na o le tatau ona fai atu: \\\"Matou te
  le toe mananao i lenei mea\\\"? Ma e mafai ai ma le sa\u02bbo ma e aunoa ma se tetee
  ona avea ma amataga i le mea na manao moni ai Hitila, e pei o se malo o le lalolagi?
  O lea na faatuina ai le UN i 26 Iuni 1945. O le UN, o le mea moni, na faamoemoe
  e avea o se \\\"tino o le tino\\\" e puipuia ai se isi tagata sau\u0101 e pei o
  Hitler talu mai le tulai ae, ae i le taimi nei ua tatou vaaia le faateleina o le
  malosi o le UN. Ae ui i lea, e tupu le tupu. E sili ona tatou popole i faiga faaupufai
  O Le Hague ma atonu o sina mea laitiiti e uiga i Brussels. Brussels, i le ala, ia
  avea ma sili atu ma sili atu ona mamana ma moni lava o se laasaga vavalalata i le
  malo o le lalolagi.\\nIna ia mafai ona fa\u02bbamautuina se malo o le lalolagi,
  fa\u02bbatasi ma le 1 leoleo o le lalolagi, tupe 1 ma le 1 lafoga lafoga, lea e
  mafai ai e mea uma ma tagata uma i lalo o le fu\u02bba tutusa ma tutusa lotu o\u02bbo
  mai, o se faafitauli ogaoga e tatau ona fa\u02bbata\u02bbatia muamua. Mo lena mea,
  o nisi o au taaalo tetele malolosi e tatau ona tuuaia e le tasi le isi. O lenei
  vaega o le a fa\u02bbavae i luga o eseesega fa\u02bbalelotu ma o se vaega i luga
  o mafuaaga tau tamaoaiga: tupe, tapuaiga, mea gaosi, meaai, ma isi. Afai e tau taua
  mo lena mafuaaga, e tatau ona e mautinoa e leai se isi mafuaaga e tau ai. Afai o
  mea uma lava a tagata uma ma tagata uma e malie e uiga i se Atua, e uiga i tulafono
  ma tulafono ma e mafai ona e fuafua i luga o le lalolagi atoa, ua foia faafitauli.
  E sa\u02bbo?\\nO le tolu o taua i le lalolagi e foliga mai o se faafitauli le maalofia
  i le fuaitau ''Faafitauli, Tali, Fofo\\\". E tatau lava i le lalolagi ona o\u02bbo
  i le 1x o se faafitauli ogaoga, ma le popole ma le vevesi o se tali. Ona mafai ai
  lea e le vaega maualuga ona fatuina le ''Ordo ab Chao'' ma iu ai ina aumaia mea
  uma i lalo o pulega a le lalolagi. O lenei taua o le lalolagi 3e na valoia e le
  pito sili ona maualuga o Albert Pike i lana tusi i lana soa o Mazzini i le 1871.
  I totonu lena tusi na ia valoia foi le taua muamua ma lona lua o taua i le lalolagi.
  E toatele e fai mai e le o moni le tusi, ae o ona anotusi e foliga mai ua mautinoa
  lelei. O le taua a le lalolagi 3 o le a avea o se taua fa\u02bbalelotu. O se faafitauli
  sili lea, lea ua i ai nei se fofo sili i luga o le fata, e ta\u02bbua o se lotu
  fou i le lalolagi. Afai i le tulaga faaleatunuu, tamaoaiga, lotu poo isi mafuaaga
  o le mafua\u02bbaga o se taua, a mae\u02bba le taua o le lalolagi i le 3e, o le
  a mafai e le UN ona fai mai: \\\"Matou te le toe mananao i lenei mea\\\". Ona o\u02bbo
  mai ai lea o tagata uma i lalo o le pule a le lalolagi ma o mea uma e mafai ona
  tauivi o le a fa\u02bbaumatia. Leai se finau e uiga i tupe, punaoa, lotu ma mea
  e le mafai ona tatou mafaufauina. O se setete o le m\u0101l\u014d o le lalolagi
  e fa\u02bbamautinoa ma tutusa tulafono mo mea uma ma tagata uma.\\nI le taimi nei,
  ua uma ona faia le galuega i le lalolagi atoa i le soloia o tinoitupe ma o lo\u02bbo
  fa\u02bbaauauina le fa\u02bbalauiloaina o tekonolosi. O le numera ma le tuputupu
  ae o le manava o le initaneti o lona uiga, mo le augatupulaga lea ua fanau mai nei
  mea e le iloa o le a tu\u02bbuina atu, ae o le mea moni lava o le auala agai i le
  tasi telefoni numera. Mo se fa\u02bbata\u02bbita\u02bbiga, o le a mafai ona latou
  fa\u02bbatauina se mafaufauga faaopoopo po\u02bbo se fa\u02bbasologa o gaioiga mai
  kamupani e pei o Google moni augmented ua sili atu ona avea ma vaega o le olaga
  i aso taitasi ma o le a latou le toe galulue e ''ai. E le ona o latou valea, ae
  ona o tekinolosi ua fa\u02bbalauteleina i se auala e tumau ai le itiiti o galuega.
  O le a latou mafatia e tusa lava pe itiiti mai fa\u02bbama\u02bbi ma o le a mafai
  ona umi se taimi e ola ai o se taunuuga o atina\u02bbe i nanotechnology. O le malo
  o le lalolagi lea o le a o\u02bbo mai pe a mae\u02bba le taua o le lalolagi i 3e
  o le a mafai ona fa\u02bbaaogaina le tulaga o tekonolosi e fausia ai se lalolagi.
  Se vaaiga matagofie! O se tulaga taua i lenei tulaga e ono masalomia lou usitaia
  atoatoa o le mana\u02bbo o lenei tulaga maualuga. Afai e te le faia, o le ola e
  ono foliga faigata. So\u02bbo se tasi na va\u02bbai i le ata tifaga Elysium atonu
  e ono mafaufau i se mea itiiti iinei. E moni: o se masalosalo pe masalosalo. E mafai
  lava ona e manatu e leai se vaega e tasi o lo\u02bbo i ai ni fuafuaga leaga mo tagata
  soifua ma o mea fa\u02bbakinolosi e fa\u02bbaaogaina i le manuia o tagata soifua
  ma e na\u02bbo le lelei. Tuuina atu le pepelo o loo tatou vaaia i le tele o numera
  e uiga i le talafaasolopito ma mataupu o loo i ai nei, e foliga mai e itiiti le
  faatuatuaga i le vaega o tagata ua tatou vaai i ai nei i pito i luga o poloka tetele
  tetele. Aisea o le a suia faafuasei ai lena mea? O lea e foliga mai e itiiti le
  faamoemoe mo tagata soifua pe afai e te mafaufau i le aotelega puupuu o le lalolagi
  ma le otootoga o le lumana\u02bbi.\\nO le fesili e otometi ona tulai mai o le: \\\"O
  le a se mea e mafai ona tatou faia e uiga i ai?\\\"Ioe e masani lava ona ou fesiligia
  lena fesili. Ua ou galue mo le tele o tausaga e faamanatu ai i tagata tagata sauaga,
  pepelo ma fuafuaga leaga na faia e nei vaega. O la\u02bbu tala e iloilo ai le sini
  e faaosofia le tagata faitau e tilotilo i mea eseese nai lo le auala o loo tilotilo
  mai ai le aufaas\u0101lalau autu ia i tatou. Sa ou faia lenei mea ona o le tele
  o tagata. Ua ou maua le tele o le faalumaina ma le taufaaleaga. O le initaneti atoa
  ua tumu i mea. Ua toetoe lava a leiloloa mea uma ma tagata uma i le faia o lenei
