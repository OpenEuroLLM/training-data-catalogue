  mea eseese. Aumai oe lava ma ou uso a tagata i le taua o le tagata o tatou i ai.
  Aua e te pasi ma e te le o mafaufauina le suiga mai luga. Aua e te mafaufauina ni
  manatu e uiga i suiga mai isi: ia suia oe lava! Lagolago e ala i se faanatinati
  vave tupe e tasi le taimi o ...\\nO lenei tusiga o se fa\u02bbaliliuga mai le amataga
  o le 11 Ianuari mulimuli.\\nFaitau foi:\\npine: faaalia, faafitauli, tali mai, fofo,
