  manatu e mafai lava ona e mauaina se tikeri faapitoa o le saolotoga i lena mea,
  ona ou luiina lea oe ia faaaluina se itula e manaia ai; Fa\u02bbaalia sa\u02bbo
  oe lava. Mo se fa\u02bbata\u02bbita\u02bbiga, faitau le tusi a George Orwell 1984
  i se tasi taimi.\\nO le a se mea e mafai ona e faia e uiga i ai? Lagolago tagata
  oe taumafai e fafagu isi e ala i le tusitusi e uiga i ai (iinei of iinei). Taumafai
