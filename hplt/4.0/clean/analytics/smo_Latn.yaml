  tu\u02bbuina atu e le kamupani Bad Weather.\\nO le laasaga autu e tolu laupepa tutotonu
  tutotonu, faia o se tapoleni se tasi, o le ogatotonu o le mita 6 x 6 mita ma ta\u02bbitasi
  maualuga 3.6 x 6 mita maualuga. E lua 5.4 mita lautele i le 8.4 mita le maualuga
