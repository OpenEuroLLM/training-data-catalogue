  Ma o lea e mafai ai ona ou sau ma se lisi atoa o tagamea o galuega ma tulaga, lea
  e iloa ai e tagata uma le lagona masani e toe faalogo i lona mafaufau ma le toe
  galulue faatasi ma le mataupu ''Befehl ist Befehl''. Ua oo i le taimi e toe maua
  ai e tagata lo latou soifuaga ma e le toe na o le tilotilo i le mea na tupu mai
  ai lana galuega ma o le a le mea e mautinoa ai ua e malupuipuia mo oe lava ia. E
