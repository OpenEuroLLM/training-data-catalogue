  gauchiel. 38 Kane ji duto osechiemo moyieng\u02bc, ne giwito cham duto modong\u02bc
  e nam mondo yie odong\u02bc mayot. 39 Kane piny oseyawore, jokwang\u02bc ne ok ong\u02bceyo
