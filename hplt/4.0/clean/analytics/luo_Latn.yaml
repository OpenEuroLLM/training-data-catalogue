  e apise migosi Mwiti ne okoni ne ogolo chik ne ruothi [\u2026]\\nBy Alseba Akinyi
  Josir lwedo yore mag somo e sub county ma Bondo osingo nenoni jopuonjre duto manenie
  skunde duto odok kendo odhi nyime gi somo e gwengego. Kaluore kod jalup county commissioner
  ma Bondo Migosi Paul Wanyonyi, giikore mar nenoni nyithindo duto manenie skunde
  nyaka dwe mar adek higa mokalo kinde ma midhusi Mar [\u2026]\\nBy Moses Telloh Ywaruok
  e laro telo e dwond buch ODM bade ma Rongo ochako muoch e okang mar ariyo bang jaod
  bura ma Rongo migosi Paul ne luongo delegates mag dwond buch ODM bade ma Rongo e
  nyasi mar tarik 1/1/2021 dalane. Ethuolo ni ema ne onee ka jaod bura ma Rongo kod
  jagoro [\u2026]\\nBy Alseba Akinyi Jotend dhowedhe e sub county ma Rarieda okwa
  mondo gine ni gigolo oko nyithindo duto manie hik dhi skul e dhowedhe go. Kaluore
  kod jakom Mar West Asembo Beach Management Units Network Migosi Tobias Ong\u2019ar
  Aiko, mondo okel tich mayot ne jonyuol kaachiel kod piny owacho, jotend dhowedhe
  nyakato neni onge nyathi [\u2026]\\nBy Moses Omollo Obila e sub-county ma Awendo
  dhi nyime kod timo nonro mar yango thoo mar miyomoro ma ja higni 26 mane loo oiko
  e kar kunyo mula ma kanyasrega sub-location odiochieng ma nyoro e thuolo mane odhi
  mar temo manyo kidi ma iluongoni oyaro kama wachore ni ne okier ma onyumore ei bugo
  [\u2026]\"", "\"# 315 In Koso An\\n1. Ng`ato nodonj e ranga lulu e chieng`no,E chieng`no
  mond` one duong`no maritowa.In koso an? In koso an?Ng`at ma nolu yo mar dhahabu,Nenruok
  malich mobedo kanyo,Donjo e morno mwasewinjo;In koso an? In Koso an?\\n2. Ng`at
  ma nomor ka oselocho, e chieng`no,E chieng`no, noyud osimbo kod pak kuom Ruoth;In
  koso an? In koso an?Ng`at manone Ruodhwa man gi duong`,Ka oseloyo kuyo mar piny,Enobed
  mamor manyaka chieng`;In Koso an? In koso an?\\n3. Ng`at manower wendno mar locho,
  e chieng`no,E chieng`no, noriwre e wend jomosewar;In koso an? In koso an?Ng`at manochung`
  e dho nam rang`i,Nomosre kod osiepe mowar,Nobed e duong`no manyaka chieng`;In koso
  an? In koso an?\"", "\"Ee. Wayie kuom Yesu jal ma nowacho niya: \u201cAn e yo, kendo
  an e adiera, kendo an e ngima; ng\u2019ato ok bi ka Wuoro ma ok okadho kuoma.\\n\u201d
  (Johana 14:6) Wayie ni Yesu nowuok e polo mobiro e piny kendo ochiwo ngimane makare
  obednwa rawar. (Mathayo 20:28) Thone kendo chierne miyo joma keto yie kuome oyud
  ngima mochwere. (Johana 3:16) Bende wayie ni sani Yesu locho e polo kaka Ruoth mar
  Pinyruodh Nyasaye, ma en pinyruoth machiegni kelo kuwe e piny mangima. (Fweny 11:15)
  Kata kamano, waluwo kaka Yesu nowacho ni: \u201cWuora duong\u2019 moloya.\\n\u201d
  (Johana 14:28) Omiyo ok walam Yesu nikech ok en e Nyasaye Manyalo Duto.\"", "\"Wach
  sukari pod medo yudo paro buora nyaka sani e pachoka\u2026\\nWritten by Rodgers
  Ogongo on August 27, 2018\\nMp Gathoni Wamuchomba-Kiambu County/photo courtesy KNA.\\nKata
  obedo ni weche sukari osewacho e okenge buora,paropod medo mana wuok e wach onogo
  komakore gi kaka jotelo osebedo ka golo pach gi ewach onogo.\\nKwayo koro ogol ne
  piny owacho mondo one ni oketo mise ma biro konyo ting\u2019o malo kembe ma pachoka
  e geng\u2019o weche mwadu ma ikelo pachoka to ok giber kod ngima oganda kaka osegabedo
  ka wachore ni ginmwandu maok nikare.\\nKane giwuoyo e wachno,jood bura Dr Pamela
  Odhiambo-Migori county,Faith Gitau-Nyandaru kod Hyrine Kasalu-Makueni ne jolero
  ni ber ka piny owacho keto mise makare e ting\u2019o malo kembe mapachoka maloso
  mwandu e yor konyo chenro mag pur kod loso mwandu makare e pachoka.\\nNe ginyiso
  piny owacho mondo one kaka nyalo keto yore makare mar chiero kembe maloso sukari
  pachoka mar geng\u2019o midhiero makoro gisani okwako Kenya komakore gi weche sukari
  masani pod yuod seyo buora e pachoka.\\nBende paro kmakamano ne ogol kod Joad bura
  Gathoni Wamuchomba-Kiambu kod Dr Patrick Wainaina-Thika Town mane jowacho ni kaber
  to twak mar sukari dwoki e do bura mondo yangi adieri mar kaka sukari maricho ne
  odonjo pachoa.\\nJtelo go ne owacho ni nyaka sani mwandu maricho maok ni kare thoth
  pachoka ma kaber to piny owacho onego ogeng\u2019 gi mar chiwo thuolo makare ne
  mwandu molosi maber e pachoka ema usi ne Jokenya.\\nNe bende gigolo ranyisi mar
  Mchele kod modhi mag tedo mabende yande omaki ka owuok e pinje maoko mawachore ni
  ne ok ber kod ngima oganda.\"", "\"1, 2. Weche ne chalo nade kane Samuel wuoyo gi
  oganda Jo-Israel, to ang\u2019o momiyo ne dwarore ni okonygi gilok chunygi?\\nSAMUEL
  ne ng\u2019iyo Jo-Israel ma ne koro ochokore Gilgal kendo piny ne oling\u2019 thi.
  Samuel, janabi moluoro Nyasaye kendo ma nosebedo jang\u2019ad-bura kuom higni mang\u2019eny,
  ema noluongo ogandano. Nenore ni mano ne en kinde oro ma kaluwore gi kalendawa,
  ne en dwe mar abich kata mar auchiel; kendo ngano ne oseikore ne keyo. Ang\u2019o
  ma Samuel ne nyalo timo mondo ochop e chuny jogi?\\n2 Ogandano ne oramo ni gidwaro
  ruoth ma dhano mondo oloch e wigi. Kata kamano, ne ok ging\u2019eyo kaka kwayono
  ne en ketho maduong\u2019 e nyim Nyasaye kendo mano ne dhi nyiso achaye maduong\u2019
  ne Jehova Nyasachgi koda ne janabine. Kuom timo kamano, ne ginyiso ni ok gidwar
  Jehova obed Ruodhgi! Ang\u2019o ma Samuel ne nyalo timo mondo omi gilok chunygi?\\nNgima
  Samuel ka pod otin nyalo puonjowa kaka wanyalo tego yie kuom Jehova kata obedo ni
  olworwa gi jomaricho\\n3, 4. (a) Ang\u2019o momiyo Samuel ne owuoyo e wi kinde ma
  ne en rawera? (b) Ranyisi mar Samuel nyalo konyowa nade e kindewagi?\\n3 Samuel
  nowacho ne ogandano niya. \u201cAn aseti kendo lwar omako wiya.\u201d Nyaka bed
  ni yie wiye ma koro notimo lwar nomiyo jogo okawo wechego mapek. Kae to nomedo wacho
  niya: \u201cAsewuotho nyimu nyaka a tinna nyaka tinendeni.\u201d (1 Sam. 11:14,
  15; 12:2) Kata obedo ni Samuel noseti, wiye ne ok owil gi kinde ma ne en rawera.
  Pod ne onyalo paro maler gik ma ne otimore e kindego. Yiero ma ne otimo kane pod
  otin ne okonye nyiso yie e ngimane duto kendo chiwore chuth ne Jehova Nyasache.\\n4
  Samuel ne nyaka teg yiene kuom Nyasaye kata obedo ni kinde ka kinde joma ne olwore
  ne gin joma onge yie kendo maok ochung\u2019 motegno gi Nyasaye. Kindegi bende,
  ok yot bedo gi yie nimar wadak e piny ma ji onge yie kendo mopong\u2019 gi mibadhi.
  (Som Luka 18:8.) We wane ane gima wanyalo puonjore kuom ranyisi mar Samuel a e tinne.\\nNotiyo
  e \u201cNyim Jehova ka Pod En Nyathi\u201d\\n5, 6. Ere kaka ngima Samuel kane pod
  otin nopogore gi mar nyithindo mamoko, to ang\u2019o momiyo jonyuolne ne ni gadier
  ni ne idhi rite maber?\\n5 Ngima Samuel ka en nyathi ne opogore gi mar nyithindo
  mamoko. Mana matin bang\u2019 weyo dhoth, ka en jahigni adek kama, ne ochako tiyo
  e hekalu mar Jehova ma ne ni Shilo, makalo kilomita 30 kowuok dalagi ma ne ni Rama.
  Jonyuolne, Elkana gi Hanna, ne ochiwe ne Jehova mondo otine e migawo makende kaka
  Ja-Nazir e ngimane duto. * Be mano nyiso ni jonyuol Samuel ne ojwang\u2019e kendo
  ne ok ohere?\\n6 Ok en kamano kata matin! Ne ging\u2019eyo ni ibiro rit wuodgi maber
  ka en Shilo. Jadolo Maduong\u2019, Eli nochung\u2019 ne weche kuno, kendo Samuel
  ne dhi tiyo machiegni kode. Bende ne nitie mon mogwaro ma ne tiyo tije moko e hekalu,
  kendo ma ne nyalo konyo e rite.\u2014Wuok 38:8; Bura 11:34-40.\\n7, 8. (a) Jonyuol
  Samuel ne jiwe nade higa ka higa? (b) Ang\u2019o ma jonyuol e kindewagi nyalo puonjore
  kuom jonyuol Samuel?\\n7 E wi mano, Hanna gi Elkana wigi ne ok owil ngang\u2019
  gi wuodgi makayo ma Nyasaye nomiyogi e yo makende. Hanna nokwayo Nyasaye nyathi
  mawuoyi kosingore ni obiro chiwe mondo oti ne Nyasaye kuom ngimane duto. Higa ka
  higa kane Hanna dhi limo Samuel, noterone arwaka ma ne odhi tiyogo e hekalu. Onge
  kiawa ni wuoyi matinno ne mor ahinya gi limbego. Nyaka bed ni chunye ne bedo mamor
  kowinjo weche ma jonyuolne ne jiwego ka ginyise kaka tiyo ne Jehova e hekalu en
  gweth maduong\u2019.\\n8 Kindegi bende, jonyuol nyalo puonjore gik mang\u2019eny
  kuom Hanna gi Elkana. Kinde mang\u2019eny, jonyuol keto pachgi duto e miyo nyithindgi
  gige ringruok maok gikaw thuolo mar konyogi bedo gi winjruok gi Nyasaye. Jonyuol
  Samuel to ne oketo winjruokgi gi Nyasaye ema obed gima okwongo e ngima, kendo mano
  ne okonyo Samuel ahinya mondo obed ng\u2019at moluoro Nyasaye.\u2014Som Ngeche 22:6.\\n9,
  10. (a) Ler ane kaka hekalu ne chalo koda kaka Samuel ne winjo ka en kuno. (Ne bende
  weche moler piny.) (b) Nyalo bedo ni migepe mag Samuel noriwo tije mage, to iparo
  ni rowere me kindegi nyalo luwo ranyisine e yo mane?\\n9 Tem ane neno e pachi kaka
  wuoyino ne dongo ka en Shilo kendo bayo e gode manie alworano. Ka en e wi godego,
  nonyalo neno hekalu mar Jehova man Shilo ka ni piny, kendo tabernakel ne more ahinya.
  Tabernakel ne en kama ler. * Musa ema ne ochiko kaka ne onego oger tabernakel higni
  400 motelo. Kanyo e kama ne owal ne lamo Jehova e piny mangima.\\n10 Samuel nohero
  tiyo e hekalu. E weche ma ne ondiko bang\u2019e, wasomo niya: \u201cSamuel notiyo
  nyim Jehova ka pod en nyathi, moruakore gi efod mar katani.\u201d (1 Sam. 2:18)
  Nenore ni arwakano ne en ranyisi manyiso ni Samuel ne konyo jodolo e hekalu. Kata
  obedo ni ne ok en jadolo, Samuel ne nigi migepe moriwo yawo dhoute mag hekalu gokinyi
  kendo rito jaduong\u2019 Eli. Kata obedo ni nohero migepene, nitie gik ma ne ochako
  chando chunye. Weche ne ok dhi maber e od Jehova.\\nNosiko Koler Kata Obedo ni ne
  Olwore gi Jo Mibadhi\\n11, 12. (a) Hofni gi Finehas ne oketho e yo mane maduong\u2019?
  (b) Gin timbe mage maricho ma ne Hofni gi Finehas timo e hekalu? (Ne bende weche
  moler piny.)\\n11 Ka pod otin, Samuel noneno timbe maricho kod mibadhi mang\u2019eny.
  Eli ne nigi yawuoyi ariyo miluongo ni Hofni gi Finehas. Weche ma ne Samuel ondiko
  wacho niya: \u201cYawuot Eli ne joma acheje, ma ok dew Ruoth Nyasaye.\u201d (1 Sam.
  2:12, The Bible in Luo, 1976) Weche ariyogi omakore. Hofni gi Finehas \u201cne gin
  acheje\u201d\u2014tiende ni ne gin \u201cyawuoyi manono\u201d\u2014nikech ne ok
  giluoro Jehova. Ne ok gidewo kata matin chike makare mag Jehova koda dwache. To
  kanyo ema richogi duto nochakoree.\\n12 Chik Nyasaye ne nyiso achiel kachiel tije
  jodolo kod kaka ne onego gichiw misango e hekalu mar Nyasaye. Nitie gimomiyo Chik
  ne keto weche e yo ma achiel kachiel kamano. Misengnigo ne ochung\u2019 ne chenro
  mar Nyasaye mar weyo ne ji richogi mondo gibed joma ler ma Nyasaye nyalo gwedho
  kendo nyalo tayo. Kata kamano, Hofni gi Finehas noketo ne jodolo wetegi ranyisi
  marach ma gimiyo jodologo obedo joma ok nyis luor kata matin ne misengni ma ne ichiwo.
  *\\n13, 14. (a) Joma ne dhi e hekalu gi chuny maler ne winjo nade kuom gik maricho
  ma ne timore kuno? (b) Ere kaka Eli ne ok ochopo ting\u2019ne kaka wuoro kata ting\u2019ne
  kaka jadolo maduong\u2019?\\n13 Tem ane neno e pachi ka Samuel wuoyi ma rawera dhoge
  moko sama oneno richo madongogo kadhi nyime to onge ng\u2019ama timo gimoro. Nyaka
  bed ni ne oneno joma ng\u2019eny moriwo jochan, joma obolore, koda joma piny odiyo
  kabiro e hekalu mondo gilos winjruokgi gi Nyasaye kendo oteggi, to kar mano, ne
  gidok ka chunygi onyosore, ka giwinjo malit, kata ka giwinjo ni ochagi. Donge nyaka
  bed ni Samuel ne winjo marach koneno kaka Hofni gi Finehas nochayo chike Jehova
  kuom terore gi mon ma ne tiyo e hekalu? (1 Sam. 2:22) Nyalo bedo ni ne ogeno ni
  Eli ne dhi timo gimoro mondo orie wechego.\\nNyaka bed ni chuny Samuel ne chandore
  ahinya nikech gik maricho ma yawuot Eli ne timo\\n14 Eli ema ne owinjore olos wechego.
  Nikech ne en jadolo maduong\u2019, ne en gi ting\u2019 mar neno ni weche dhi maber
  e hekalu. Kendo kaka wuoro, en ema ne onego orie yawuotego. Timbe yawuoyigo ne hinyogi
  kendo ne hinyo joma ng\u2019eny mamoko bende. Eli ne ok ochopo ting\u2019ne kaka
  wuoro kata ting\u2019ne kaka jadolo maduong\u2019. Ne okwero yawuote mana e yo mayom
  yom. (Som 1 Samuel 2:23-25.) Kata kamano, ne dwarore ni omi yawuoyigo kum mager
  nimar richo ma ne gitimo ne owinjore mana gi tho!\\n15. Jehova nochiwo siem mane
  mager ne Eli, to Eli gi joode ne okawo siemno nade?\\n15 Weche nomedo bedo maricho
  mochopo kama Jehova ne ooro janabi moro moluong mana ni \u201cng\u2019at Nyasaye\u201d
  mondo omi Eli kum mager. Jehova nonyiso Eli niya: \u201cImiyo yawuoti duong\u2019
  moloya.\u201d Nikech mano, Nyasaye nokoro ni yawuot Eli ne dhi tho e odiechieng\u2019
  achiel kendo ni jood Eli ne dhi yudo masira maduong\u2019 ma gilal thuolo makende
  ma ne gin-go mar bedo jodolo. Be siem magerni nomiyo joodno olokore e yo moro amora?
  Muma nyisowa ni Eli kod yawuote ne ok olokore.\u20141 Sam. 2:27\u20133:1.\\n16.
  (a) Gin weche mage mwasomo e wi kaka Samuel ne dongo? (b) Ang\u2019o momiyo wechego
  moro chunyi? Ler ane.\\n16 Be weche maricho ma ne timoregi ne oloko kit Samuel?
  Ooyo, kinde ma ne weche richoeno, Samuel to ne dongo koluoro Nyasaye. E bug 1 Samuel
  2:18, wasomo ni Samuel notiyo e \u201cnyim Jehova ka pod en nyathi.\u201d Kata kane
  pod otin, gima ne duong\u2019 e ngima Samuel ne en tiyo ne Nyasaye. E kwan matindo
  21 mar sulano, wasomo ni nyathi ma \u201cSamuel nodongo e nyim Jehova.\u201d Kaka
  nomedo dongo, e kaka winjruokne gi Wuon mare me polo ne medo bedo motegno. Bedo
  gi winjruok machiegni kamano gi Jehova ema nyalo geng\u2019owa mondo kik wadonj
  e timbe maricho.\\n17, 18. (a) Ere kaka rowere ma Jokristo nyalo luwo ranyisi mar
  Samuel sama giromo gi tem mar donjo e timbe maricho? (b) Ang\u2019o manyiso ni Samuel
  noyiero yo makare?\\n17 Ne yot mondo Samuel opar ni nikech jadolo maduong\u2019
  gi yawuote ne timo richo, en be nonyalo timo gimoro amora ma chunye omiye. Kata
  kamano, gik maricho ma jomoko timo kata ka gin joma nigi migepe madongo, ok miwa
  thuolo mar timo kaka gin. E kindewagi, rowere mang\u2019eny ma Jokristo luwo ranyisi
  mar Samuel ka gidongo \u201ce nyim Jehova\u201d kata obedo ni moko kuom joma olworogi
  ok ketnegi ranyisi maber.\\n18 Nikech Samuel noyiero winjo Jehova, mano ne okonye
  nade? Wasomo niya: \u201cKendo nyathino Samuel nomedo dongo, nobedo ng\u2019a ma
  Jehova ohero, kod ji bende.\u201d (1 Sam. 2:26) Omiyo, joma nohero Samuel ne gin
  joma ne nyalo konye. Jehova owuon nohero wuoyini ahinya nikech chung\u2019ne motegno.
  Kendo kuom adier, Samuel nong\u2019eyo ni Nyasache ne dhi kawo okang\u2019 mondo
  orie weche ma ne timore Shilo. Kata kamano, nyalo bedo ni nopenjore ni mano ne dhi
  timore karang\u2019o. Chieng\u2019 moro gotieno, Samuel noyudo dwoko mag wechego.\\n\u2018Wachi,
  Jatichni Winjo\u2019\\n19, 20. (a) Ler ane gima notimore ne Samuel otieno moro e
  hekalu. (b) Ere kaka Samuel nong\u2019eyo ng\u2019ama ne luonge, to nonyiso Eli
  luor e yo mane?\\n19 Piny ne chiegni ru. Taya maduong\u2019 mar hekalu ne pod liel,
  kata kamano, pod mudho ne nitie. Ka piny pod oling\u2019 thi, Samuel nowinjo ka
  ng\u2019ato luonge. Noparo ni Eli, ma ne koro oti ahinya kendo wang\u2019e ne ok
  nen maber, ema ne oluonge. Samuel nochung\u2019 kendo \u201cnoringo ir\u201d jaduong\u2019no.
  Par ane ka wuoyino ringo gi tiende nono mondo owinj gima Eli ne dwaro? En gima ber
  ni Samuel ne onyiso Eli luor koda muolo. Kata obedo ni Eli ne timo gik maricho,
  pod ne en jadolo maduong\u2019 mar Jehova.\u20141 Sam. 3:2-5.\\n20 Samuel nochiewo
  Eli kowacho niya: \u201cEra ee; nikech iluonga.\u201d To Eli nokone ni ne ok oluonge
  kendo ni odog onindi. Samuel nochako owinjo duolno modhi ir Eli, kendo Eli nonyise
  ni odog onindi nikech ne ok oluonge. Notimore kamano kendo mar adek! Kanyo ema Eli
  nofwenyoe gima ne timore. Nofwenyo ni Jehova ne koro wuoyo gi joge kotiyo gi wuoyino!
  Nikech joge ne ong\u2019anjo, kinde mang\u2019eny nosekalo nyaka ne Jehova oornegi
  wach kokalo kuom jonabi. Eli nonyiso Samuel mondo odog onindi kendo, to wang\u2019ni
  nonyise dwoko mowinjore omi Jehova ka Jehova oluonge kendo. Samuel notimo kamano.
  Mapiyo nono, nowinjo kiluonge kendo ni: \u2018Samuel, Samuel!\u2019 Wuoyino nodwoko
  niya: \u2018Wachi; jatichni winjo.\u2019\u20141 Sam. 3:1, 5-10.\\n21. Ere kaka wanyalo
  winjo Jehova e kindegi, to ang\u2019o momiyo ber timo kamano?\\n21 Jehova noyudo
  jatich mawinje e dala mar Shilo. Kendo Samuel ne owinjo Jehova e ngimane duto. In
  be iwinjo Jehova kinde duto? Ok ochuno ni dwol moro owuo kodwa gotieno e yor hono
  mondo eka wawinj dwond Jehova. Kindewagi, wanyalo wacho ni dwond Nyasaye winjore
  kinde duto. Owuoyo kodwa kokalo kuom Wachne, ma en Muma. Kaka wamedo winjo Nyasaye
  kendo timo kaka odwaro, e kaka yiewa medo bedo motegno. To mano e gima notimore
  ne Samuel.\\n22, 23. (a) Ere kaka ote ma ne Samuel oluor wacho mokwongo nochopo
  kare? (b) Ang\u2019o manyiso ni Samuel nodhi nyime ng\u2019ere kaka ng\u2019at makare?\\n22
  Gima notimore Shilo e otienono nokelo lokruok maduong\u2019 e ngima Samuel. Kanyo
  ema nochako bedoe gi winjruok makende gi Jehova kobedo janabi mare kendo ng\u2019at
  mawuoyo e loye. Nyasaye nonyiso Samuel ni weche ma ne osekor e wi jood Eli ne koro
  chiegni timore. Samuel nokwongo oluor nyiso Eli ote mar Jehova. Kata kamano, nochoko
  chir monyiso Eli wechego, kendo Eli norwako kumno kobolore. Bang\u2019 kinde matin,
  weche duto ma Jehova nosekoro nochopo kare: Jo-Israel nokedo gi Jo-Filistia, noneg
  Hofni gi Finehas e odiechieng\u2019 achiel, kendo Eli owuon notho ka nonyise ni
  wasigu okawo Ark mar Jehova.\u20141 Sam. 3:10-18; 4:1-18.\\n23 Kata kamano, Samuel
  nodhi nyime bedo janabi moluoro Nyasaye. Muma wacho ni \u201cJehova ne ni kode,\u201d
  kendo medo wacho ni weche duto ma ne Samuel okoro notimore.\u2014Som 1 Samuel 3:19.\\n\u201cSamuel
  Nolamo Jehova\u201d\\n24. Bang\u2019 kinde, Jo-Israel noramo ni gidwaro ang\u2019o,
  to ang\u2019o momiyo mano ne en richo maduong\u2019?\\n24 Be Jo-Israel noluwo ranyisi
  mar Samuel ma gibedo joma oluoro Nyasaye kendo mochung\u2019 motegno? Ooyo. Bang\u2019
  kinde, ne ging\u2019ado ni ok gidwar ni janabi ema obednegi jang\u2019ad-bura. Ne
  gidwaro bedo kaka ogendni mamoko ma ne nigi ruoth ma dhano malocho e wigi. Jehova
  nonyiso Samuel ni otimnegi kaka ne gidwaro. Kata kamano, ne dwarore ni Samuel onyis
  Jo-Israel kaka ketho ma ne gitimo ne duong\u2019 e nyim Nyasaye. Ne giparo ni ne
  gitamore Samuel, to kare Jehova owuon ema ne gitamore! Omiyo, Samuel noluongogi
  gichokre Gilgal.\\n25, 26. Ka gin Gilgal, ere kaka Samuel nokonyo Jo-Israel mondo
  ofweny kaka ne gitimo ketho maduong\u2019 e wang\u2019 Jehova?\\n25 We wadog ane
  e weche ma nowuo kuomgi e chak sulani sama Samuel ne wuoyo gi Jo-Israel ma ne ochokore
  Gilgal. Ka gin kanyo, Samuel ma koro noseti noparo ne Jo-Israel kaka noseluoro Nyasaye
  e ngimane duto. Kae to wasomo kama: \u201cSamuel nolamo Jehova.\u201d Nokwayo Jehova
  mondo oor koth maduong\u2019 gi mor polo.\u20141 Sam. 12:17, 18.\\n26 Be koth maduong\u2019
  ne nyalo chwe e kinde mag oro? Gima kamano ne pok otimorega nyaka nene! Kapo ni
  ne giparo ni mano ne ok nyal timore kata ne ginyiero wachno, ne ok obudho. Matin
  nono, polo nolil. Yamo mager ne okutho ka polo to mor matek nyowuoyo. Kae to koth
  maduong\u2019 ne ochwe. Jogo notimo nade? \u201cJi duto noluoro Jehova gi Samuel
  ahinya.\u201d Koro, ne gifwenyo kaka ne gitimo richo maduong\u2019.\u20141 Sam.
  12:18, 19.\\n27. Jehova neno nade jogo maluwo ranyisi mar Samuel mar nyiso yie?\\n27
  Jehova, Nyasach Samuel, ema ne ochopo e chuny jong\u2019anjogo, to ok Samuel owuon.
  Samuel noketo yie kuom Nyasache a e tinne nyaka obedo moti. Kendo Jehova nogwedhe.
  Jehova pok olokore. Pod otego jogo maluwo ranyisi mar Samuel mar nyiso yie.\\n^
  par. 5 Ja-Nazir ne ni e bwo singruok ma ne oriwo kuong\u2019ruok ni ok gibi madho
  kong\u2019o kata lielo yie wigi. Thoth joma ne singore kamano, ne kuong\u2019ore
  e wechego mana kuom kinde matin, to joma nok kaka Samson, Samuel, gi Johana Jabatiso,
  ne obedo Jo-Nazir e ngimagi duto.\\n^ par. 9 Tabernakel kata sang\u2019tuari ne
  en hema maduong\u2019. Kata kamano, ne olose gi gik ma nengogi tek ahinya\u2014pien
  mayom, lewni motwang\u2019 maber, koda bepe ma nengogi tek ma oum gi fedha koda
  dhahabu. Sang\u2019tuarino ne nie laru kendo ne en kod altar moger maber michiwoe
  misengni. Kaka kinde ne medo kalo, ne omed ger ute mamoko ma jodolo ne nyalo tiyogo
  e bath hekalu. Nenore ni Samuel ne nindo e achiel kuom utego.\\n^ par. 12 Siganano
  nyiso yore ariyo ma ne ginyisogo achaye. Mokwongo, Chik ne nyiso achiel kachiel
  lemo mar misango ma ne onego omi jodolo ocham. (Rapar 18:3) To e hekalu, jodolo
  marichogo ne osieko gi tim moro marach ahinya. Ne ginyiso jotichgi ni ochwo uma
  maduong\u2019 e agulu michwakoe ring\u2019o mar misango, kendo gimoro amora ma ne
  umano ochwoyo ne gikawo! Mar ariyo, kane ji okelo misengnigi mondo owang\u2019 e
  altar, jodolo marichogo ne oro jatich mondo ochun ng\u2019at machiwo misangono omiye
  ring\u2019o mapod numu kata kapok owang\u2019 bor ne Jehova.\u2014Lawi 3:3-5; 1
  Sam. 2:13-17.\"", "\"8\\nYesu opidho ji alufu ang\u02bcwen\\n1 E kindego oganda
  maduong\u02bc machielo nochokore. To nikech ne gionge gi gima digicham, Yesu noluongo
  jopuonjrene ire mowachonegi niya,\\n2 \u201cAkecho jogi nikech koro gisebedo koda
  kae kuom ndalo adek to gionge gima digicham.\\n3 Ka agonyogi gidhi thuchegi ka gidenyo
  kama to ginyalo podho e yo, nikech moko kuomgi oa mabor.\u201d\\n4 Jopuonjrene nodwoke
  niya, \u201cEre kuma ng\u02bcato diyudie makati manyalo pidho jogi mayieng\u02bc
  e dier thim machal kama?\u201d\\n5 Yesu nopenjogi niya, \u201cUn gi makati adi?\u201d\\nNegidwoke
  niya, \u201cAbiriyo kende.\u201d\\n6 Nowachone ogandago mondo obed piny e lum. Bang\u02bc
  mano nokawo makati abiriyogo, kendo kane osegoyo erokamano, nong\u02bcingogi bang\u02bce
