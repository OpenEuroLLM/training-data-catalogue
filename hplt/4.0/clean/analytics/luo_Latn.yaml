sample: '["\"\u201cMad Nyasach kuwe omi ubed moikore gi gik mabeyo duto mondo utim
  dwache.\u201d\u2014HIB. 13:20, 21.\\nWER: 136, 14\\n1. Yesu nokawo mapek wach lendo
  e okang\u2019 ma romo nade? Ler ane.\\nYESU nohero wuoyo e wi Pinyruodh Nyasaye.
  Weche mondik e Muma nyiso ni nojiwo ahinya wach Pinyruoth moloyo gimoro amora. Nowuoyo
  e wi Pinyruodhno mokalo nyadi 100 kolendo. Wachno e ma nokawo mapek ahinya e ngimane.\u2014Som
  Mathayo 12:34.\\n2. Gin ji adi ma nyalo bedo ni ne nitie ka Yesu nogolo chik ma
  yudore e Mathayo 28:19, 20, to ang\u2019o momiyo wanyalo wacho kamano?\\n2 Bang\u2019
  kinde matin kosechier Yesu, noromo gi ji mokalo 500 ma ne dhi bedo joland wach Pinyruoth.
  (1 Kor. 15:6) Nyaka bed ni kinde ma noromoe gi jogo, e ma nochikogie ni galand ote
  Pinyruoth ne ji manie \u201cogendni duto,\u201d ma gie kindeno ne en tich matek
  ahinya! * Yesu nokoro ni tich maduong\u2019ni ne idhi tim nyaka \u201ce giko mar
  ndalo,\u201d to mano e gima osebedo ka timore. Nyaka bed ni in bende iriwo lwedo
  timo tich ma nokorni.\u2014Mat. 28:19, 20.\\n3. Gin gik mage adek ma osekonyowa
  lando wach maber?\\n3 Ka Yesu nosechiko jolupne odhi olendi, nosingonegi niya: \u201cAn
  kodu.\u201d (Mat. 28:20) Omiyo, en e ma nodhi tayo tij lendo ma ne idhi tim e piny
  mangima. Nyasachwa osemiyowa \u201cgik mabeyo duto\u201d ma konyowa timo tijno.
  (Hib. 13:20, 21) E sulani, wabiro nono adek kuom gik mabeyogi: (1) gige tich mosemiwa,
  (2) yore ma wasetiyogo, kod (3) tiegruok ma waseyudo. Mokwongo, non ane gige tich
  ma wasebedo ka watiyogo kuom higni 100 mosekalo.\\nRUOTH MIYO JOTICHNE GIGE TICH\\n4.
  Ang\u2019o momiyo wasetiyo gi gige tich mopogore opogore e tijwa mar lendo?\\n4
  Yesu noporo \u201cwach Pinyruoth\u201d gi kodhi ma ikomo e kit lowo mopogore opogore.
  (Mat. 13:18, 19) Japur nyalo tiyo gi gige tich mopogore opogore mondo oik puodho
  ne kodhi. E yo ma chalo kamano, Ruodhwa osemiyowa gige tich ma konyowa iko chuny
  ji tara gi tara ne wach Pinyruoth. Gige tich moko nokonyowa kuom higni pieche, kendo
  moko osebedo ka konyowa nyaka chil kawuono. Thoth gige tichgi osekonyowa mondo wamed
  bedo joland-injili molony.\\n5. Kad mar chiwo neno ne en ang\u2019o, to ne itiyo
  kode nade?\\n5 Achiel kuom gige tich ma ne konyo ji mang\u2019eny ochak lendo ne
  en kad mar chiwo neno (testimony card) ma joland Pinyruoth nochako tiyogo e higa
  mar 1933. Ne en kad moro matin ma lachne romo inj adek to borne inj abich, kendo
  noting\u2019o ote machuok mowuok e Muma. Kinde ka kinde, ne ilosoga kad manyien
  mondikie ote manyien. Tiyo gi kadgo ne yot! Owadwa miluongo ni C. W. Erlenmeyer
  ne jahigni apar kama ka nochako lendo gi kad. Owacho kama: \u201cNe wachakoga wuoyo
  ka wawacho niya, \u2018Be diher somo weche manie kadni?\u2019 Ka wuon ot nosesomo
  weche manie kad, ne wanyalo miye bugewa kae to watieko atieka koro wadhi.\u201d\\n6.
  Kad mar chiwo neno ne konyo e yo mane?\\n6 Kad mar chiwo neno ne konyo e yore mang\u2019eny.
  Kata obedo ni jomoko ne nyalo gombo timo tij lendo, moko kuomgi ne wigi kuot kendo
  ne gikia gima ne ginyalo wacho. Jomoko to ne nyalo wuoyo mathoth mokalo tong\u2019.
  Ne ginyalo nyiso wuon ot weche duto ma ne ging\u2019eyo mana kuom dakika manok,
  mak mana ni ne ok giti gi rieko! Mopogore gi mano, kad noting\u2019o weche machuok,
  moyier maber, kendo \u201cne wuoyo\u201d e lo jalendo.\\n7. Gin pek mage ma owetewa
  ne romogo kane gitiyo gi kad?\\n7 Tiyo gi kadno bende ne kelo pek moko. Nyaminwa
  Grace A. Estep ma osebedo Janeno kuom higni mang\u2019eny, nowacho kama: \u201cSeche
  moko, ne inyalo penjwa niya, \u2018Kadno wacho ang\u2019o? Ok inyisa anyisa gima
  owacho?\u2019\u201d E wi mano, weg udi moko ne ok nyal somo weche ma nondik e kadno.
  Jomoko to ne paro ni omigi kadno chuth, omiyo ne gidonjo gi kadno e ot kae to giloro
  dhoot. Ka wuon ot ne en ng\u2019at ma kwedowa, nonyalo kawo kadno moyiech ma tindo
  tindo. Kata obedo ni owetewa ne kalo e pek ma kamago, ne gidhi nyime lendo kendo
  ne ging\u2019ere kaka joland wach Pinyruoth.\\n8. Ler ane kaka thumb san ne itiyogo.
  (Ne picha manie chak sulani.)\\n8 Gir tich machielo ma notigo e higni mag 1930 kod
  chak higni mag 1940 ne en masin ma chalo thumb san (portable phonograph), ma owete
  moko ne luongo ni Harun nikech masindno ne wuoyo e logi kinde mang\u2019eny. (Som
  Wuok 4:14-16.) Ka wuon ot noyie, jalendo ne ketone twak moro mar Muma mar dakika
  machuok, kae to owene buge. Seche moko joot duto ne chokore mondo owinj twag Muma
  momaki. E higa mar 1934 riwruok mar Watch Tower Society nochako loso thumb san ma
  ng\u2019ato ne nyalo ting\u2019o kodhigo e tij lendo. Bang\u2019e, owetewa noloso
  twege 92 ma wuoyo e wi weche mopogore opogore.\\n9. Thumb san ne okonyo e okang\u2019
  ma romo nade?\\n9 Kane wuon ot moro miluongo ni Hillary Goslin owinjo achiel kuom
  twege ma nomakgo, nokwayo jalendo mondo okonye gi thumb sanno kuom juma achiel mondo
  odhi oket ne jirendene bende owinjie ote Pinyruoth. Ka ne jalendono odok, noyudo
  ji buora ma norwako wach ka rite. Bang\u2019 kinde, thoth jogo nochiwore mar tiyo
  ne Jehova kendo nyi Hillary ariyo nodhi e Skul mar Gilead mi oorgi e pinje mamoko
  kaka jomisonari. Mana kaka kad mar chiwo neno, thumb san bende nokonyo ji mang\u2019eny
  ochak tij lendo. Bang\u2019e, Ruoth ne dhi puonjo joge tij lendo kotiyo gi Skul
  mar Tij Nyasaye.\\nNE GITIYO GI YO MORO AMORA MA NYALORE MONDO GILEND NE JI\\n10,
  11. Ere kaka gasede kod redio ne konyo e lando adiera manie Muma, to ang\u2019o
  momiyo yoregi ne tiyo maber?\\n10 Ruoth osebedo ka tayo jotich Nyasaye sama gitiyo
  gi yore mopogore opogore e lando wach maber ne ji mathoth kaka nyalore. Mano ne
  en gima dwarore ahinya ka ne \u2018jotich nok.\u2019 (Som Mathayo 9:37.) E chak
  higni mag 1900, ne ilendo ka itiyo gi gaset (newspapers) kuonde ma jotich Jehova
  ne nokie mondo olend ne ji mathoth ma ne chopo irgi tek. Juma ka juma, Owadwa Charles
  Taze Russell ne oroga twag Muma ne jondik gaset. Kae to jondik gaset ne jandiko
  twegego e gasede ma ne isomo Amerka, Kanada, kod Ulaya. E higa mar 1913, twege Owadwa
  Russell ne chopo ne ji 15,000,000 ma ne somogi e gasede 2,000 mopogore opogore!\\n11
  Bang\u2019 tho Owadwa Russell, ne ochak ti gi yo machielo ma ne nigi nyak e lando
  wach maber. Tarik 16 April 1922, Joseph F. Rutherford nogolo achiel kuom twegene
  mokwongo e redio ne ji ma dirom 50,000. Kae to tarik 24 Februar 1924, ne wachako
  tiyo gi stesen marwa mar redio ma niluongo ni WBBR. Kaluwore gi yo manyienni mar
  chopo ne ji gi wach maber, The Watch Tower ma Desemba 1, 1924, nowacho kama: \u201cWan
  gadier ni redio ok bi miyo wati gi pesa mang\u2019eny kendo en yo maber mar lando
  adiera nyaka chop sani.\u201d Mana kaka gasede, redio bende ne konyo e lendo ne
  ji mang\u2019eny e gwenge ma joland Pinyruoth ne nokie.\\n12. (a) En yo mane mar
  lendo e lela ma iheroga? (b) En ang\u2019o ma nyalo konyowa loyo luoro ma wanyalo
  bedogo kuom wach lendo e lela?\\n12 Sani ijiwowa ahinya ni walend e lela to mano
  oriwo lendo e stend mag mtokni, stesen mag gach reru, kuonde michungoe mtokni, e
  ofise, kuonde ma ji mang\u2019eny yudore, kod e chirni. Kapo ni iwinjo kiluor tiyo
  gi yore mag lendogi, inyalo lemo kae to ipar matut kuom gima ne Angelo Manera, Jr
  mosebedo jarit-alwora kuom higni mang\u2019eny nowacho. Nowacho kama: \u201cNe wakawoga
  yo moro amora manyien mar lendo, kaka yo mar tiyo ne Jehova, mar nyiso ni wamakore
  kode, mar nyiso ka be waluwo tim makare, kendo ne wan gi siso mar nyiso ni waikore
  tiyone e yo moro amora ma nodwaro.\u201d Lendo ka watiyo gi yo moro manyien, to
  ahinya ahinya ka en yo ma ok wahero tiyogo, nyalo konyowa geno Jehova, wamed yie
  kuome kendo miyo winjruokwa kode obed motegno.\u2014Som 2 Jo-Korintho 12:9, 10.\\n13.
  Websaitwa mar jw.org konyowa nade e tij lendo, kendo en wach mane miseromogo seche
  ma inyiso ng\u2019ato websaitno?\\n13 Jolendo mang\u2019eny konyoga ji ng\u2019eyo
  websaitwa mar jw.org., kama ginyalo somoe kendo golo buge ma lero Muma e dhok mokalo
  700. Pile ka pile, ji mokalo 1,600,000 limoga websaitwa. Mana kaka redio ne timo
  chon, sani websaitwa miyo ji modak kuonde mosokore yudo wach maber.\\nTIEGO JOLAND
  WACH MABER\\n14. Ang\u2019o momiyo ne dwarore ni otieg joland Pinyruoth, to en skul
  mane mosebedo ka konyogi bedo jopuonj molony?\\n14 Waseneno moko kuom gige tich
  kod yore mosebed kitiyogo e lando wach maber. To nade tiegruok ma waseyudo? Tem
  ane paro gima ne nyalo timore ne owetewa machon ka gilendo to wuon ot ok yie gi
  gima owinjo e twak momaki e thumb san, kata kapo ni orwako weche mosomo e kad mar
  chiwo neno. Ne dwarore ni jolendo ong\u2019e kaka ne ginyalo loyo akwede e yo mariek
  kod kaka ne ginyalo bedo molony e puonjo joma orwako wach. Onge kiawa ni roho mar
  Nyasaye notayo Nathan H. Knorr mondo ofweny ni ne dwarore otieg jolendo ong\u2019e
  kaka ne ginyalo wuoyo gi ji ka gin e tij lendo. Ang\u2019o ma ne otim? E higa mar
  1943, ne ochak Skul mar Tij Nyasaye e kanyakla duto. Skundno osekonyowa mondo wabed
  jopuonj molony.\\n15. (a) Jomoko oseromo gi pek mage e seche ma gigolo twege e Skul
  mar Tij Nyasaye? (b) Ere kaka iseneno adiera mag singo Jehova ma yudore e bug Zaburi
  32:8?\\n15 Nokawo kinde malach mondo thoth owete gi nyimine obed gi chir mar wuoyo
  e nyim ji. Julio S. Ramu paro twak ma nokwongo golo e skul e higa mar 1944. Twagno
  ne wuoyo e wi ng\u2019at moro miluongo ni Doeg, ma nyinge yudore mana kuonde abich
  kende e Muma! Julio wacho kama: \u201cChongena ne tuomore, lwetena kod lekena ne
  tetni.\u201d Nomedo wacho ni nogolo twagno kotiyo mana gi ndiko abichka kende. Odhi
  nyime wacho niya: \u201cNagolo twak gi dakika adek. Kamano e kaka weche nobedona
  ka nahango wuoyo e nyim ji, to ok najok.\u201d Nyithindo bende ne odonjo e skul
  kata obedo ni golo twak e kanyakla ne ok gima yot ne moko kuomgi. Angelo Manera
  mosewuo kuome motelo, paro gima notimore kane nyathi moro matin ma eka nochako dhi
  e skul nogolo twage mokwongo. Owacho kama: \u201cNyathino ne luoro omako motoyo
  mana ywak. To nikech noramo ni nyaka ogol twagno, nogole koyuak ma nyaka otieko.\u201d
  Be dibed ni ok ichiwga dwoko kata timo gik moko e chokruoge nikech iluor kata ineno
  ni ok inyal? Kwa Jehova mondo okonyi loyo luoro ma in-go. Obiro konyi mana kaka
  nokonyo jopuonjre ma chon-go golo twege e Skul mar Tij Nyasaye.\u2014Som Zaburi
  32:8.\\n16. En tich mane maduong\u2019 ma Skul mar Gilead osebedo ka timo (a) kinde
  machon kod (b) chakre 2011?\\n16 Tiegruok ma jotich Jehova yudo ok en mana ma yudore
  e Skul mar Tij Nyasaye kende. Jomisonari kod jomamoko oseyudo tiegruok e Skul mar
  Gilead. Achiel kuom joma puonjo e skundno nowacho ni gima duong\u2019 ma skundno
  timo en \u201cjiwo jopuonjre mondo obed gi siso mar tiyo tij lando injili.\u201d
  Gilead nochakore e higa mar 1943, kendo chakre kindego owete gi nyimine mokalo 8,500
  oseyudo tiegruok e skundno. Jomisonari mosetieg e skund Gilead oseor e pinje ma
  dirom 170. Chakre higa mar 2011, joma iluongo e skundno gin mana joma osebedo ka
  tiyo ne Nyasaye gi thuologi duto e yore makende kaka jopainia makende, jorit-alwora,
  jo Bethel, kata jomisonari modhi lendo kuonde mamoko to pok odhi e skundno.\\n17.
  Tiegruok ma ji yudo Gilead osekonyo nade?\\n17 Tiegruok ma iyudo e Skul mar Gilead
  osekonyo nade? Ne ane ranyisini. E dwe mar Agost 1949, ne nitie jolendo matin ne
  apar ma gin jo Japan. E giko higano, jomisonari 13 moa Gilead ne lendo e pinyno
  gi kinda. Sani, nitie jolendo ma dirom 216,000 e piny Japan, kendo chiegni ni pasent
  42 kuomgi gin jopainia!\\n18. Moko kuom skunde mosekonyo Joneno omed bedo gi winjruok
  maber gi Nyasaye gin mage?\\n18 Skunde moko kaka Skul mar Tij Pinyruoth, Skul mar
  Jopainia, Skul mar Joland-Injili mar Pinyruoth, Skul mar Jorit-Alwora kod Mondegi,
  kod Skul mar Jokomiti Matayo Bad Ofis kod Mondegi, osekonyo owete gi nyimine e okang\u2019
  malach kendo osejiwo winjruokgi gi Jehova. Onge kiawa ni Ruoth dhi nyime tiego joge!\\n19.
  En wach mane ma Charles Taze Russell nowacho e wi tij lendo, to ere kaka wechenego
  osebedo adier?\\n19 Higni moloyo 100 osekalo nyaka ne chung Pinyruodh Nyasaye. Ruodhwa
  Yesu Kristo pod dhi nyime tiegowa. Kinde matin ka pok Charles Taze Russell otho
  e higa mar 1916, nofwenyo ni tij lendo ne idh tim e okang\u2019 malach miwuoro.
  Nonyiso osiepne moro niya: \u201cTijni medore mapiyo, to pod obiro dhi nyime medore,
  nikech tij lando \u2018injili mar pinyruoth\u2019 en gima onego oland e piny ngima.\u201d
  (Faith on the March, mondik gi A. H. Macmillan, ite mar 69) Nowacho adier! To mano
  kaka wamor ni Nyasach kuwe miyowa gik ma dwarore mondo watim tich ma jaberni! Kuom
  adier, omiyowa \u201cgik mabeyo duto\u201d ma wadwaro mondo watim dwache!\\n^ par.
  2 Nitie gima nyiso ni thoth joma ne nitie ka Yesu chiwo chikno nobedo Jokristo.
  Paulo luongogi ni \u2018owete 500\u2019 e barua ma nondiko ne Jo-Korintho. Bende
  nomedo wacho kama: \u201cThothgi pod ni kodwa, kata obedo ni moko kuomgi osenindo
  e tho.\u201d Omiyo, nenore ni Paulo kaachiel gi Jokristo mamoko mokwongo nong\u2019eyo
  thoth joma nowinjo achiel kachiel ka Yesu chiwo chikno.\"", "\"Wer 141 kod Lamo\\nWeche
  Michakogo (Dak. 3 kata matin ne mano)\\nMWANDU MA YUDORE E WACH NYASAYE\\n\u201cBe
  Ibiro Ketni Ranyisi kata alama mar Tony?\u201d: (Dak. 10)\\nEze 9:1, 2\u2014Nitie
  gik ma wanyalo puonjore kuom fweny ma Ezekiel noneno (w16.06 16-17)\\nEze 9:3, 4\u2014Joma
  oyie rwako wach mwalando ibiro ketnegi ranyisi mar tony e kinde masira maduong\u2019\\nEze
  9:5-7\u2014Jehova ok bi ketho joma beyo sama oketho joma richo\\nNono Puonj Manie
  Wach Nyasaye: (Dak. 8)\\nEze 7:19\u2014Ndikoni nyalo konyowa nade timo ikruok ne
  kinde mabiro? (w09 9/1 26 \u00b610)\\nEze 8:12\u2014Ere kaka ndikoni nyiso ni bedo
  ma onge yie nyalo miyo ng\u2019ato odonj e tim moro marach? (w11 4/15 26 \u00b614)\\nSomo
  mar Muma ma jumani opuonji wach mane e wi Jehova?\\nGin puonj mage mamoko ma iyudo
  e somo mar Muma ma jumani?\\nSomo mar Muma: (Dak. 4 kata matin ne mano) Eze 8:1-12\\nTIEGRI
  NE TIJ LENDO\\nLimbe Mokwongo: (Dak. 2 kata matin ne mano) Fwe 4:11\u2014Puonj Adiera.\\nDok
