  ni yie ikech ogandana. Mano e ywakna.\\n4 Nimar an kod ogandana oseng\u02bciew-wa
  mondo otiekwa kendo onegwa nyaka warum chuth. Ka dabed ni ong\u02bciew-wa mondo
  wabed wasumbini machwo gi mamon kende, to dine aling\u02bc aling\u02bca, nikech
  mano ok en gima dine achandogo ruoth.\u201d\\n5 Ruoth Ahasuerus nopenjo Esta ma
  mikache niya, \u201cEn ng\u02bca? Ng\u02bcatno ni kanye mosehedhore timo gima kamano?\u201d\\n6
