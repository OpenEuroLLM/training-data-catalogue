  le ma jocham jowadgi, Satan luro ne rombe, korito yudo thuolo moro amora mondo ongam
  jogo maok ong\u2019eyo kata mobayo yo. Mano e achiel kuom gimaduong\u2019ie moloyo
  mamiyo wadwaro siko machiegni ahinya gi kanyakla, kendo bedo e bwo \u2018Jakwath
  gi Jarit chunywa.\u2019 (1 Pet. 2:25) Kowuoyo e wi joma biro tony e sand maduong\u2019,
  Fweny 7:17 wacho ni: \u201cNyarombo [Yesu] . . . nobed jakwadhgi. Kendo notelnigi
  e sokini mag pi ngima, to Nyasaye noywe pi wang\u2019gi duto.\u201d En singo mane
  manyalo bedo maber maloyo mano?\\n18 Bang\u2019 nono migawo maduong\u2019 ma jodong-kanyakla
  chopo ka gin kaka jokwath, ber mondo wapenjre niya: Jodong-kanyakla nyalo timo ang\u2019o
  mondo gibed gadier ni girito rombe mag Yesu e yo mowinjore? Wabiro nono dwoko mar
  penjoni e sula maluwo.\"", "\"Acts 27 (BONLT)\\n1 Kane oseng\u02bcad wach ni onego
  okwang\u02bcwa wadhi Italia, Paulo kod joma otwe mamoko noketi e lwet jatend jolweny
