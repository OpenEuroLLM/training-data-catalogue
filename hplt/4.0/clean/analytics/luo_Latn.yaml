  oyudo gimadho divai chieng\u02bc mar ariyono, ruoth nopenjo mikache ma Esta niya,
  \u201cKwayoni en ang\u02bco? Kwaya akwaya ma kata ka en nus mar pinya to ibiro miyigo?\u201d\\n3
  Eka Esta ma mikach ruoth nodwoko niya, \u201cKa ayudo ng\u02bcwono e nyimi, yaye
