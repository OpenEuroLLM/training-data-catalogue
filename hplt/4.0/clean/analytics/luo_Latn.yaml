  "\"JOSHUA noyudo migawo mapek. Ne dwarore ni ota Jo-Israel nyaka e Piny ma Nosingi
  kata obedo ne nitie jowasigu kod gik mamoko ma ne nyalo geng\u2019ogi. Kata kamano,
  Jehova nonyiso Joshua ni ne odhi dhi maber gi migawono, kendo nojiwe niya: \u2018Bed
  gi teko kod chir. Luw chikena. Somgi odiechieng\u2019 gi otieno, kendo itim duto
  mondikie. E ka yoreni duto nobed maber, kendo inibed mariek.\u2019\u2014Jos. 1:7,
  8.\\nNikech wan be wadak e \u201ckinde matek ahinya,\u201d waromo gi pek moko. (2
  Tim. 3:1) Mana kaka Joshua, wan be wanyalo dhi maber ka waluwo weche ma Jehova nonyisego.
  Onego wasom Muma pile kendo wati maber gi puonj ma wayudo e iye sama wanyagore gi
  tembe.\\nKata kamano, thothwa nyalo yie ni ok wapuonjrega Muma kaka dwaher, kendo
  samoro puonjruok ok yotnwa ahinya. To nikech wang\u2019eyo ni puonjruok Muma nyalo
  konyowa ahinya, ne sanduk ma wiye wacho ni, \u201cTem Ane Tiyo gi Yoregi\u201d mondo
  iyud paro moko ma nyalo miyo puonjruok Muma obedni mamit kendo omed konyi.\\nJandik-zaburi
  moro nowero kama: \u2018Miya awuoth e yor wecheni michiko; nimar amor ahinya kodgi.\u2019
  (Zab. 119:35) Puonjruok Wach Nyasaye nyalo keloni mor mogundho. Ibiro puonjori gik
  mathoth kendo mabeyo sama inono mwandu ma yudore e Wach Nyasaye.\\nKata obedo ni
  onge oganda ma itayo kaka Joshua notimo, in gi pek moko minyagorigo. Omiyo, mana
  kaka Joshua, puonjri Wach Nyasaye e yo matut mondo okonyi nyagori maber. Kitimo
  kamano, in be yoreni duto biro dhi maber.\"", "\"\u201cWinjuru jotendu, kendo migiuru
  duong\u2019; nikech girito chunyu.\u201d\u2014HIB. 13:17.\\n1, 2. Ang\u2019o momiyo
  kinde duto Jehova wachonwa ni ochalo gi jakwath?\\nJEHOVA wachonwa kinde duto ni
  ochalo gi jakwath. (Eze. 34:11-14) Mano en wach maduong\u2019 ahinya nikech okonyowa
  ng\u2019eyo ni Jehova chalo nade. Jakwath mohero rombene, jakawo ting\u2019 mar
  rito kendo tayo rombe. Otayogi koterogi e lege mang\u2019ich koda kama pi maler
  yudore (Zab. 23:1, 2); ong\u2019iyo chalgi odiechieng\u2019 gotieno (Luka 2:8);
  oritogi mondo le marach kata jasigu kik hinygi (1 Sam. 17:34, 35); oting\u2019o
  nyirombe mayom e bade koda e kore (Isa. 40:11); omanyo rombe molal, kendo okonyo
  rombe mohinyore.\u2014Eze. 34:16.\\n2 To nikech oganda Jehova machon ne odak e ngima
  mar pur gi pidho jamni, ne ginyalo winjo mapiyo sama Jehova Nyasaye wacho ni ochalo
  jakwath mohero rombene. Ne ging\u2019eyo ni rombe dwarore omi rit mowinjore eka
  mondo gidong maber. Kamano e kaka dhano bende dwarore ni ota gi Jehova. (Mari. 6:34)
  Ka ok Jehova ema oritogi eyo makare kendo tayogi e yo mowinjore, to chandruok nyalo
  betie. Nyalo bedo mayot mondo giba yo mana kaka \u201crombe maonge jokwath\u201d
  timoga. (1 Ruo. 22:17) Kata kamano, kuom jogo mayie mondo Jehova otagi, giyudo gik
  moko duto ma gidwaro.\\n3. En ang\u2019o ma wabiro puonjore e sulani?\\n3 Wan bende
  e kindewagi wang\u2019eyo kaka Jehova ritowa kaka jakwath. Waneno kaka orito kendo
  otayo joge ma gin kaka rombene e ndalogi. We waneane kaka ochiko rombene e kindegi
  koda kaka ochopo dwaro maggi kaka owinjore. Wabiro neno bende gigo ma rombene onego
  otim mondo giyud kony koda gweth chuth kuom rit ma Jehova miyogi.\\nJAKWATH MABER
  CHIWONWA JOKWATH MATINDO\\n4. Yesu dewo kendo rito rombe mag Jehova e yore mage?\\n4
  Jehova oseketo Yesu obed Wi kanyakla mar Jokristo. (Efe. 1:22, 23) Yesu ma en \u201cjakwath
  maber,\u201d nyisowa kido, dwaro koda gik ma Wuon mare ohero. Ohero rombe mag Wuon
  mare kendo odewogi ahinya. Ne oyie chiwo kata mana ngimane nikech rombego. (Joh.
  10:11, 15) To mano kaka misango mar rawar ma Kristo nochiwo en mich maber ne dhano
  duto! (Math. 20:28) En mich kendo gweth nikech dwaro mar Jehova en ni \u201cng\u2019a
  ma oyie kuome [Yesu] kik lal, to obed gi ngima mochwere.\u201d\u2014Joh. 3:16.\\n5,
  6. (a) Gin jomage ma Yesu oketo mondo ota rombe mage? Rombe onego otim ang\u2019o
  mondo giyud gweth kuom chenro ma Yesu noketoni? (b) Gimaduong\u2019 moloyo mamiyo
  wadwaro winjo kendo luwo chenro ma jodong-kanyakla oketo en mane?\\n5 Rombe to nyiso
  nade ni Yesu Kristo en Jakwadhgi Maber? Yesu nowacho niya: \u201cRomba winjo dwonda,
  kendo an ang\u2019eyogi, kendo giluwa.\u201d (Joh. 10:27) Winjo dwond Jakwath Maber
  tiende en luwo kaka ochikowa kinde duto kendo e yore duto. Mani oriwo winjo kendo
  riwo lwedo jokwath matindo moketo mondo okonye e rito rombe mag Wuon-gi. Yesu nonyiso
  ni jootene kod jopuonjre mage ne biro dhi nyime tiyo tich ma nochako. Ne gidhi \u2018puonjo\u2019
  kendo \u2018pidho rombene.\u2019 (Math. 28:20; som Johana 21:15-17.) Kaka wach maber
  ne medo landore kendo kwan mar jopuonjre bende ne medore, Yesu notimo chenro mondo
  Jokristo motegno obed jokwath e kanyakla.\u2014Efe. 4:11, 12.\\n6 Kane owuoyo gi
  jodong-kanyakla e dala mar Efeso, jaote Paulo nowacho ni roho maler ema noketogi
  \u2018jokwath, mondo gikwa kanyakla mar Nyasaye.\u2019 (Tich 20:28) Kamano e kaka
  jodong-kanyakla ma kindegi timo. Ang\u2019o momiyo wawacho kamano? En nikech oseketgi
  kaluwore gi kaka Muma ma en Wach Nyasaye mondik kuom teko mar roho maler, chiko.
  Kuom mano, winjo gima Jokristo ma gin jodong-kanyakla wachonwa, nyiso ni wachiwo
  luor ne Jehova kod Yesu, ma gin Jokwath ariyo madongo. (Luka 10:16) Ka kuom adier,
  mano e gimaduong\u2019 mokwongo mamiyo wadwaro bolore ne jodong-kanyakla. Kata kamano,
  nitie gik mamoko mamiyo wadwaro winjo kendo luwo kaka gitayowa.\\n7. Ere kaka jodong-kanyakla
  konyowa rito winjruok ma wan-go gi Jehova?\\n7 Sama gichiwo puonj moro kata jiwo
  owete gi nyimine gi paro moro, kinde duto jodongo onego oten kata osir weche ma
  giwachogo gi Ndiko. Timo kamano nyiso ni gin giwegi ok gidwar chiko ngima owete
  gi nyimine. (2 Kor. 1:24) Kar mano, gimiyo Jokristo wetegi puonj mawuok e Ndiko
  mondo okonygi ging\u2019ad paro makare, kendo mano miyo riwruok koda kuwe betie
  e kanyakla. (1 Kor. 14:33, 40) Muma wacho ni jodong-kanyakla \u2018rito chunywa.\u2019
  Mano tiende ni gidwaro konyo ng\u2019ato ka ng\u2019ato e kanyakla mondo orit winjruok
  maber ma en-go gi Jehova. Kuom mano gibiro timo mapiyo chiwo kony kapo ni gineno
  ni owadwa kata nyaminwa moro dwaro kawo kata osekawo okang\u2019 moro maok ni kare.
  (Gal. 6:1, 2; Juda 22) Donge magi gin gik mowinjore ahinya manyiso gimomiyo onego
  \u2018wawinj\u2019 jodong-kanyakla ma wan-go e kanyaklawa?\u2014Som Jo Hibrania
  13:17.\\n8. Jodong-kanyakla rito chal mar rombe mag Jehova e yo mane?\\n8 Jaote
  Paulo ma ne en jakwath madewo ahinya chal mar owete gi nyimine, nochiwo siem ne
  owete e kanyakla mar Kolosai niya: \u201cRitreuru mondo kik ng\u2019ato omaku gi
  riekone kod wuond manono, ma wuok kuom puonj dhano kod tim machon mag piny, to ok
  kuom Kristo.\u201d (Kol. 2:8) Wechegi miyowa siem machielo ka ginyiso gimachielo
  maber mamiyo onego wawinj puonj ma jodongo miyowa kowuok e Ndiko. Ginyiso ni jodongo
  rito owete gi nyimine kik hinyre gi puonj mag joma dwaro ketho yiegi. Jaote Petro
  nochiwo siem e wi \u201cjonabi mariambo\u201d koda \u201cjopuonj mariambo\u201d
  ma ne dhi temo yondho Jokristo ma nigi \u201cchuny mayomyom\u201d mondo odonj e
  richo. (2 Pet. 2:1, 14) Jodong-kanyakla ma kindegi bende nyaka chiw siem machalo
  kamago kapo ni mano owinjore. Jodong-kanyakla gin Jokristo motegno kendo mosekalo
  e chal moko mopogore opogore e ngima. E wi mano, kane pok oketgi jodong-kanyakla,
  ne ginyiso ni ging\u2019eyo Ndiko e yo maler kendo ni gilony e chiwo puonj mangima.
  (1 Tim. 3:2; Tito 1:9) Nikech gin Jokristo motegno kendo molony, gitemo ng\u2019iyo
  gik moko kik kal tong\u2019 ahinya, kendo temo tiyo gi rieko sama gitayo rombe Jehova
  ei kanyakla.\\nJAKWATH MABER PIDHO KENDO RITO ROMBENE\\n9. Yesu pidho kendo tayo
  nade kanyakla mar Jokristo e kindegi?\\n9 Kokalo kuom riwruok mar oganda mare, Jehova
  chiwo chiemb chuny mogundho ne owete duto e piny mangima. Thoth puonjgo mowuok kuom
  Ndiko yudore e buge koda gasedewa. E wi mano seche moko jodong-kanyakla yudo weche
  matayogi achiel kachiel kokalo kuom barupe mindikonegi kata kokalo kuom jorit alwora.
  Kokalo kuom yore machalo kaka mago, rombe Jehova ng\u2019eyo gima onego gitim.\\n10.
  En ting\u2019 mane ma jodong-kanyakla nigo sama owadwa kata nyaminwa oweyo kanyakla?\\n10
  Jokwath mabeyo nigi ting\u2019 mar rito chal mar owete gi nyimine e kanyakla, to
  ahinya wuon jogo ma yie margi osedok chien, kata motimo gik maok ni kare. (Som Jakobo
  5:14, 15.) Moko kuom owete gi nyimine e kanyakla nyalo bedo ni osebayo yo ma giweyo
  tiyo ne Nyasaye. E chal ma kamago, donge jaduong\u2019 madewo rombe adier biro timo
  kar nyalone mondo omany rombono kendo ojiwe oduog e kweth ma tiendeni kanyakla?
  Timo kamano nyalo bedo maber miwuoro. Yesu nowacho niya: \u201cOk en dwaro mar Wuonu
  me polo ni achiel kuom jo matindogi olal.\u201d\u2014Math. 18:12-14.\\nONEGO WANE
  NADE NYAWO MA JODONG-KANYAKLA NIGO?\\n11. Ang\u2019o momiyo jomoko nyalo yudo ka
  teknegi luwo gima jodongo nyisogi?\\n11 Jehova gi Yesu gin jokwath makare chuth.
  Kata kamano, jokwath matindo ma gimiyo ting\u2019 mar rito kanyakla gin mana dhano
  morem. Mani en adier manyalo miyo jomoko owinj ka teknegi luwo kaka jodongo tayogi.
  Joma kamago nyalo bedo gi paro niya: \u2018Jodongogi gin mana dhano morem kaka wan.
  Ang\u2019o momiyo onego ginyisa gima onego aluw? \u2019 En adier ni jodongo gin
  dhano morem. Kata kamano dwarore wabed gi paro mowinjore kendo makare kuom nyawo
  ma waneno kuomgi.\\n12, 13. (a) E ndalo machon, ne gin ketho mage ma jotich Jehova
  moko ma ne nigi migepe madongo notimo? (b) Ang\u2019o momiyo Jehova ne dwaro ni
  ondik e Muma nyawo mag chwo ma ne nigi migepe?\\n12 Muma nyiso maler nyawo mag jogo
  ma Jehova ne tiyogo e tayo joge e kinde machon. Kuom ranyisi, Daudi ne en ruoth
  mowal gi mo kendo jatend Israel. Kata kamano, tem noloye modonjo e terruok ma kendo
  oneko. (2 Sam. 12:7-9) Par ane ranyisi mar jaote Petro bende. Kata obedo ni ne omiye
  migawo maduong\u2019 ahinya e kanyakla Jokristo, ne ojatimo ketho madongo kinde
  ka kinde. (Math. 16:18, 19; Joh. 13:38; 18:27; Gal. 2:11-14) Mopogore gi Yesu, onge
  dhano moro amora man kare chakre Adam gi Hawa tim richo.\\n13 Ang\u2019o momiyo
  Jehova noyie mondo ondik e Muma nyawo mag chwo ma notiyogo e migepe mopogore opogore?
  Achiel kuom gimomiyo notimo kamano, ne en ni mondo onyis ni onyalo tiyo gi dhano
  morem mondo ota godo joge. Ka kuom adier, osebedo kotimo kamano chakre chon. Omiyo,
  ok onego wati gi nyawo mag owete matayowa e kindegi mondo wabed joma ng\u2019ur
  kata weyo luwo kaka gichikowa. Jehova dwaro ni wachiw luor kendo winjo owete machalo
  kamago.\u2014Som Wuok 16:2, 8.\\n14, 15. Wanyalo puonjore ang\u2019o kaluwore gi
  kaka Jehova ne chiko joge e kinde machon?\\n14 Dwarore ahinya mondo wabed joma winjo
  jogo matayowa e kindegi. Par ane kaka Jehova nowuoyo gi joge e kinde machon mondo
  okonygi gitony. Kuom ranyisi, kane oganda Jo-Israel owuok Misri, Nyasaye notiyo
  gi Musa gi Harun e chiwonegi chike ma ne dwarore giluw. To bende, mondo gitony e
  masira mar apar ma Nyasaye nokelo e piny Misri, e udi duto mag Jo-Israel ne nyaka
  yang\u2019ie nyarombo makende, kendo wiro moko kuom remb nyarombono e sis dhoot
  koda e wi dhoudi. Be Nyasaye nowuoyo achiel kachiel gi ogandano? Ooyo, ogandano
  ne yudo weche kokalo kuom jodongo maggi, to jodongogo ne yudo chikego kuom Musa.
  (Wuok 12:1-7, 21-23, 29) Kamano e kaka Jehova ne tiyo gi Musa koda jodongo e chiwo
  chikene ne ogandane. Ndalogi, Jehova tiyo gi Jokristo ma gin jodong-kanyakla e timo
  kamano.\\n15 En adier ni inyalo paro kinde mamoko machon ma Jehova ne chiko joge
  kaka onego gitim kotiyo gi dhano kata malaika. E chalgo duto, Nyasaye noneno ni
  ber mondo omi jomoko migawo mar wuoyo e loye kendo ginyis joge gima nonego gitim
  mondo gitony e chal moro. Wan gadier chuth ni Jehova biro timo kamano bende e kinde
  Har\u2013Magedon. Kata kamano, jaduong\u2019-kanyakla moro amora, matiyo e lo Jehova
  kata e lo riwruok mar ogandane ndalogi, nyaka bed motang\u2019 ahinya mondo kik
  oti marach gi migawo momiye.\\n\u201cKUETH ACHIEL, GI JAKWATH ACHIEL\u201d\\n16.
  \u201cWach\u201d madwarore wachikne itwa ahinya en mane?\\n16 Oganda Jehova e kindegi
  loso \u201ckueth achiel,\u201d e bwo \u201cjakwath achiel\u201d ma en Yesu Kristo.
  (Joh. 10:16) Yesu nowacho ni ne odhi bedo gi jopuonjrene \u201cndalo duto nyaka
  giko mar ndalo.\u201d (Math. 28:20) Ka en Ruoth manie polo, en gi teko duto mar
  chiko gik mabiro timore kapok okawo okang\u2019 mar ketho piny marachni. Wanyalo
  timo ang\u2019o mondo wasik ka wariwore kendo medo yudo rit ma rombe mag Nyasaye
  yudo? Dwarore ni wachik itwa ne \u2018wach mawuok bang\u2019wa,\u2019 kanyisowa
  yo monego waluw. \u2018Wachni\u2019 oriwo gima roho mar Nyasaye wachonwa kaka ondiki
  e Muma, koda gima Jehova gi Yesu wachonwa ka gitiyo gi chwo ma giketo mondo obednwa
  jokwath e kanyaklawa.\u2014Som Isaiah 30:21; Fweny 3:22.\\n17, 18. (a) En jasigu
  mane manyalo hinyo rombe mag Jehova, kata kamano wanyalo bedo gadier kuom wach mane?
  (b) Sula maluwo mae biro wuoyo e wi ang\u2019o?\\n17 Muma wacho ni Satan \u201cbayo
