  owinjore ne ji Awendo.Nyaka e thuoloni ochukdar maromo 3 Osenegi e county ma Migori
  e kuonde motingo kakrao,Rongo kod Awendo.\"", "\"1. En paro mane maok kare ma seche
  moko chando ji mang\u2019eny moriwo nyaka Jokristo madier?\\nBE JEHOVA NYASAYE oheri?
  Ji mang\u2019eny oyie ni Nyasaye ohero dhano duto mana kaka Johana 3:16 wacho. Kata
  kamano, giwacho e chunygi niya: \u2018An to Nyasaye ok nyal hera.\u2019 Kata mana
  Jokristo madier be nyalo bedo gi paro ma kamano kinde moko. Ng\u2019at moro ma chunye
  ne onyosore ne owacho niya: \u201cAwinjo ka tekna ahinya yie ni Nyasaye ohera.\u201d
  Be seche moko ibedoga gi paro ma kamano?\\n2, 3. En ng\u2019ano madwaro ni mondo
  wapar ni wan joma nono kata ma Jehova ok nyal hero, to ere kaka wanyalo kedo gi
  paro maok kareno?\\n2 Satan temo ahinya mondo omi wapar ni Jehova Nyasaye ok oherowa
  kendo ni ok okawowa kaka gimoro. En adier ni Satan kinde mang\u2019eny wuondo ji
  mondo gibed joma kawore kata gibed gi sunga. (2 Jo Korintho 11:3) To komachielo
  bende, ohero miyo joma yomyom ochare kata okawre ni gin joma nono. (Johana 7:47-49;
  8:13, 44) To ahinya ahinya otimo kamano e \u2018ndalo mag gikogi.\u2019 Ji mang\u2019eny
  pon e udi ma ji \u2018ok ohero jowetegi.\u2019 Jomoko to odak gi joma ger, joma
  oherore giwegi, kod joma wigi tek. (2 Timotheo 3:1-5) Nikech osetim ne joma kamago
  marach kuom higni mang\u2019eny kijarogi kendo ka ji bedo ma mon kodgi, gisekawore
  kaka joma nono maonge joma nyalo herogi.\\n3 Kapo ni in gi paro ma kamago, kik chunyi
  a. Kinde ka kinde, moko kuomwa nyalo paro ni gin joma nono. Kata kamano, ket e paro
  ni Wach Nyasaye ondik mondo \u2018orie ji\u2019 kendo Muma nigi \u2018teko mar muko\u2019
  paro mogurore ahinya. (2 Timotheo 3:16; 2 Jo Korintho 10:4) Muma wacho kama: \u201cWanaho
  chunywa e nyime, ka chunywa nyiso ni bura oloyowa; nikech Nyasaye duong\u2019 moloyo
  chunywa, kendo ong\u2019eyo duto.\u201d (1 Johana 3:19, 20) We wane ane yore ang\u2019wen
  ma Muma \u2018hoyogo chunywa\u2019 ni Jehova oherowa.\\nJehova Oheri\\n4, 5. Ere
  kaka ranyisi ma ne Yesu otiyogo mar oyundi nyiso kaka wan gi nengo maduong\u2019
  e wang\u2019 Jehova?\\n4 Mokwongo, Muma nyiso ni Jehova ogeno moro ka moro kuom
  jotichne. Kuom ranyisi, Yesu nowacho kama: \u201cTo oyundi ariyo ok ing\u2019iewo
  gi hela achiel koso? Kata kamano achiel kuomgi ok nolwar piny ma ok Wuonu ong\u2019eyo.
  To kata mana yie wiu osekwan duto. Kuom mano kik uluor; un uloyo winy mang\u2019eny.\u201d
  (Mathayo 10:29-31) Ne ane kaka wechego ne ojiwo joma ne winjo Yesu.\\n5 Samoro wanyalo
  wuoro gimomiyo ng\u2019ato ne nyalo ng\u2019iewo oyundi. E kinde ma ne Yesu odak
  e piny, oyundi e winyo ma ne nengone ni pinyie mogik ma ne ng\u2019ato nyalo nyiewo
  mondo ocham. Hela achiel ma ne en pesa matin ahinya, ne nyalo ng\u2019iewo oyundi
  ariyo. To bang\u2019e, Yesu noduogo owacho ni ka ng\u2019ato ne nigi hela ariyo,
  ne imiye oyundi abich kar ang\u2019wen. Winyo ma ne ingesono ne ikawo ka gima nono
  maok nyal wang\u2019o jauso. Nyalo bedo ni dhano ne neno winyogo kaka gik ma nono,
  Nyasaye to ne nenogi nade? Yesu nowacho kama: \u201cOnge achiel kuomgi [kata mana
  winyo ma ne ingesono] ma ok par e nyim Nyasaye.\u201d (Luka 12:6, 7) Koro wanyalo
  neno puonj ma Yesu ne chiwo. Ka oyundi achiel ema Jehova ne neno ka gima duong\u2019
  kamano, to nade dhano? Mana kaka Yesu nowacho, Jehova ong\u2019eyo gimoro amora
  kuomwa. Ne ni Nyasaye ong\u2019eyo kata mana kwan mag yie wiwa!\\n6. Ang\u2019o
  momiyo wan gadier ni Yesu ne ok ojimbo wach kane owacho ni Jehova ong\u2019eyo kwan
  mag yie wiwa?\\n6 Be nyalore ni Jehova ong\u2019eyo kwan mag yie wiwa? Jomoko nyalo
  paro ni Yesu ne jimbo wach. Kata kamano, tem ane paro geno ma wan-go mar chier.
  Mondo Jehova ochwe ng\u2019at ma ne osetho kaka ne en ndi, donge nyaka bed ni ong\u2019eyo
  gimoro amora kuome? Ogenowa ahinya e okang\u2019 ma ong\u2019eyo gik moko duto kuomwa
  moriwo kitwa, pachwa, kod gik moko te ma wakaloe e ngimawa. * Kwano yie wi dhano,
  ma kinde mang\u2019eny romo 100,000 kama, en gima tin ahinya ne Jehova kopim gi
  nyalo ma en go mar ng\u2019eyo gik moko duto kuomwa.\\nAng\u2019o ma Jehova Ng\u2019iyo
  Kuomwa?\\n7, 8. (a) Sama Jehova nono chuny dhano, gin kido mage ma more? (b) Moko
  kuom tije mwatimo ma Jehova morgo gin mage?\\n7 Mar ariyo, Muma puonjowa gima Jehova
  ng\u2019iyo kuom jotichne. Koket e yo mayot, gima Jehova morgo en kido mabeyo ma
  wan-go kod kinda ma watiyonego. Ruoth Daudi nowacho ne wuode Solomon niya: \u2018Jehova
  ng\u2019iyo chuny ji duto, kendo ong\u2019eyo paro duto maiye mar chuny.\u2019 (1
  Weche mag Ndalo 28:9) Sama Jehova nono dhano tara gi tara e piny ma tinde gero opong\u2019oni,
  donge omor ndi sama oyudo chuny ji achiel achiel mohero kuwe, adiera, kod timbe
  makare? Iparo ni Nyasaye winjo nade sama oyudo ng\u2019at ma nigi chuny mohere,
  madwaro ng\u2019eye, kendo madwaro nyiso jomoko gik mosepuonjore kuome? Jehova nyisowa
  ni omor gi joma wuoyo gi jomoko e wiye. En kata gi \u2018kitabu\u2019 mondikoe nyinge
  \u2018jogo moluore kendo ma paro nyinge.\u2019 (Malaki 3:16) Kido ma kamago more
  ahinya.\\n8 Moko kuom tije mabeyo ma Jehova ohero gin mage? Onge kiawa ni ohero
  kinda ma watimo mondo waluw ranyisi mar Wuode, Yesu Kristo. (1 Petro 2:21) Achiel
  kuom tije madongo ma Nyasaye okawo kaka gima duong\u2019 en lando wach maber mar
  Pinyruodhe. Wasomo kama e bug Jo Rumi 10:15: \u201cJogo ma kelo weche mabeyo, tiendgi
  long\u2019o miwuoro!\u201d Nyalo bedo ni teknwa paro ni tiendewa nyalo bedo gik
  \u2018malong\u2019o,\u2019 kata malombo wang\u2019. Kata kamano, e ndikoni, tielo
  ochung\u2019 ne kinda ma jotich Jehova timo e lando wach maber. Kinda ma kamago
  duto long\u2019o kendo duong\u2019 e wang\u2019 Nyasaye.\u2014Mathayo 24:14; 28:19,
  20.\\n9, 10. (a) Ang\u2019o momiyo wanyalo bedo gadier ni sama wanano e chandruoge
  mopogore opogore, Jehova kawo mano kaka gima duong\u2019? (b) Sama Jehova nono jotichne,
  en ang\u2019o maok otim ngang\u2019?\\n9 Gimachielo ma Jehova morgo en neno kaka
  wanano. (Mathayo 24:13) Ng\u2019e ni Satan dwaro ni walok ne Jehova ng\u2019ewa.
  Odiechieng\u2019 kodiechieng\u2019 michung\u2019 motegno kimakori gi Jehova, inyiso
  ni Satan nohango ne Jehova wach. (Ngeche 27:11) Seche moko, nano ok en gima yot.
  Tuoche, pek mag yuto, parruok, kod chandruoge mamoko nyalo miyo ngimawa obed matek.
  Chunywa be nyalo nyosore kapo ni nitie gimoro ma ne wagombo to ok otimore. (Ngeche
  13:12) Ka wanano e chal ma kamago, Jehova kwano mano kaka gima duong\u2019 ahinya.
  Mano e momiyo Ruoth Daudi nokwayo Jehova ka en gadier niya: \u201cKan pi wang\u2019a
  e chupani; ok gin e kitapi koso?\u201d (Zaburi 56:8) Chutho, Jehova neno pi wang\u2019
  mwachwero kod chandruok mwakaloe sama wanano kwamakore kode, kendo ok one mago kaka
  gima tin kendo wiye ok nowil kodgi. Kuom adier, pi wang\u2019 kod chandruoge ma
  kamago nigi nengo maduong\u2019 ahinya e wang\u2019 Jehova.\\nSama wanano e sand,
  Jehova kawo mano kaka gima duong\u2019\\n10 Nyalo bedo ni kata mana bang\u2019 ng\u2019eyo
  weche ma kamagi, pod chunywa nyalo tamore yie ni Nyasaye kawowa kaka joma nengogi
  duong\u2019. Inyalo siko kiwacho e chunyi niya: \u2018Nitie joma ng\u2019eny ma
  tiyo ne Nyasaye e yo maber moloya. Nyaka bed ni Jehova jok koda sama opima gi joma
  kamago!\u2019 Kata kamano, ng\u2019e ni Jehova ok pimwa gi jowetewa; ok orid chik
  kendo ok oger. (Jo Galatia 6:4) Jehova tiyo gi rieko ma malo chutho sama osomo chunywa
  kokawo kido moro amora maber mayudore e chunywa kaka gima duong\u2019 kata bed ni
  wan gi kidono e okang\u2019 matin maromo nade.\\nJehova Manyo Gik Mabeyo Kuomwa
  to Ok Maricho\\n11. Ang\u2019o mwanyalo puonjore e wi Jehova kuom gima ne otimo
  ne Abija?\\n11 Mar adek, sama Jehova nonowa, omanyo gik mabeyo kuomwa. Kuom ranyisi,
  kane Jehova ochiko ni otiek koth Ruoth Jeroboam kata dhoode duto nikech ne ging\u2019anjo,
  ne ochiko ni Abija, ma ne en achiel kuom yawuot ruoth, to oyik e yo mowinjore. Nikech
  ang\u2019o? Nikech ne \u201coyud gimoro maber kuome e nyim Jehova Nyasach Israel.\u201d
  (1 Ruodhi 14:1, 10-13) Jehova ne onono chuny rawerano adimba moyudo \u201cgimoro
  maber kuome.\u201d Kata bed ni gima ber ma ne oyud kuomeno ne tin marom nade, Jehova
  nokwano mano kaka gima owinjore ondik e Muma. Ne ni gimoro maber ma ne Abija otimo
  nomiyo Jehova okeche e okang\u2019 moro.\\n12, 13. (a) Ere kaka gima Jehova notimo
  ne Ruoth Jehoshafat nyiso ni omanyo gik mabeyo kuomwa kata sama watimo richo? (b)
  Ere kaka Jehova chalo gi janyuol ma jahera kodok korka tijewa kod kido mabeyo ma
  wan-go?\\n12 Ranyisi moro maber moloyo nenore e wi kaka Jehova notimo ne Ruoth Jehoshafat.
  Kane ruodhno otimo tim fuwo, Jehova nooro janabine mondo onyise niya: \u201cMirima
  omako Jehova kodi nikech wachni.\u201d Mano doko wach matek! Kata kamano, weche
  Jehova ne ok orumo gi kanyo. Ne omedo wacho niya: \u201cKata kamano oyud gik moko
  mabeyo kuomi.\u201d (2 Weche mag Ndalo 19:1-3) Kuom mano, mirima mar Jehova ne ok
  oumo wang\u2019e maok oneno gik mabeyo kuom Jehoshafat. To mano kaka Jehova opogore
  gi dhano ma joricho! Sama jomoko ochwanyowa, wiwa jowil gi kido duto mabeyo ma gin-go.
  Wan be sama watimo richo, chuny monyosore mwabedogo, wichkuot, kod chuny ma ng\u2019adonwa
  bura nyalo miyo kik wane gimoro amora maber kuomwa. Kata kamano, ng\u2019e ni ka
  waloko chunywa chuth kendo temo mondo kik wanwo gik maricho ma ne watimogo, Jehova
  weyonwa kethowa.\\n13 Sama Jehova nono chunyi, owalo kendo oketo mabor richo ma
  kamago mana kaka ng\u2019at ma kunyo dhahabu wito kite ma nono moyudo. To Jehova
  neno nade kido mabeyo ma in-go kod gik mabeyo mitimo? Mago e gik mokano! Be iseneno
  ka jonyuol moko kano kuom higni mang\u2019eny gimoro ma nyathigi noloso kata obedo
  ni nyathi to wiye nosewil gi gino chon? Jehova e janyuol mohero nyithinde moloyo.
  Kinde duto ma wamakore kode, wiye ok wil ngang\u2019 gi gik mabeyo mwasetimo kod
  kido mabeyo ma wan-go. Timo kamano nyalo bedo tim maok kare, to en ok onyal timo
  gima ok kare ngang\u2019. (Jo Hibrania 6:10) Jehova nonowa bende e yo moro machielo.\\n14,
  15. (a) Ang\u2019o momiyo nyawowa ok mon Jehova neno gik mabeyo kuomwa? Chiw ane
  ranyisi. (b) Jehova biro timo ang\u2019o gi kido mabeyo moyudo kuomwa, to ere kaka
  oneno jotichne?\\n14 Jehova ok ng\u2019i mana nyawowa kende to ong\u2019iyo nyaka
  nyalo ma wan-go. Ne ane ranyisini: Kapo ni goro moro okethore, joma ohero gik ma
  kamago timo kinda ahinya mondo gilose kendo gidwoke e wang\u2019e. Kuom ranyisi,
  nitie goro moro ma ne Leonardo da Vinci ogoro kendo ne osebedoe kuom higni 500 to
  ne okane e National Gallery man London e piny England. Nengo gorono ne romo dola
  milion 30 mag Amerka. Kata kamano, chieng\u2019 moro, ng\u2019ato ne ogoyo gorono
  gi bunde ma okethe. Gima iwuoro en ni onge kata mana ng\u2019at achiel ma ne owacho
  ni owit gorono nikech koro nosekethore. Kanyo gi kanyo, nochak los goro ma ne nengone
  duong\u2019no. Nikech ang\u2019o? Nikech e wang\u2019 joma ohero gik ma kamago,
  gorono ne en gima duong\u2019 ahinya. Iparo nade, donge in gi nengo maduong\u2019
  moloyo gima ogor mana gi chok gi makaa? E wang\u2019 Nyasaye, wan gi nengo maduong\u2019
  kata ka richo ma ne onyuolwago oseketho kama rom nade kuomwa. (Zaburi 72:12-14)
  Jehova Nyasaye ma e Jachwech mang\u2019ula ma ne ochweyo oganda dhano biro timo
  duto madwarore mondo oduok ne ji duto mohere ngima makare chuth.\u2014Tich Joote
  3:21; Jo Rumi 8:20-22.\\n15 Ee, Jehova neno gik mabeyo kuomwa manyalo bedo ni wan
  wawegi ok wane. Kendo kaka wamedo tiyone, obiro miyo kido mabeyo ma wan-go omedre
  nyaka gikone wabed joma kare chuth. Kata bed ni piny Satan timonwa marach machalo
  nade, Jehova ohero jotichne kendo okwanogi kaka joma nigi nengo maduong\u2019.\u2014Haggai
  2:7.\\nYore ma Jehova Nyisogo ni Ohero Dhano\\n16. Gima duong\u2019ie moloyo ma
  ne Jehova omiyowa konyisogo ni oherowa en ang\u2019o, to ang\u2019o momiyo wanyalo
  bedo gadier ni michno ne ochiw ne ng\u2019ato ka ng\u2019ato kuomwa?\\n16 Mar ang\u2019wen,
  Jehova nyiso e yore mang\u2019eny ni oherowa. Kuom adier, mopogore gi kaka Satan
  dwaro ni wapar, misango mar rawar ma ne Kristo ochiwo nyiso e yo maber moloyo ni
  ok wan joma nono kata ma Nyasaye ok nyal hero. Kik wiwa wil ni tho malit ma ne Yesu
  othogo e yadh sand kod lit malich miwuoro ma ne Jehova owinjo koneno ka Wuode mohero
  tho, nyisowa ayanga ni giherowa. Gima lit en ni ji mang\u2019eny ok par ni gin bende
  Yesu ne othonegi. Gineno ni gin joma nono. Kata kamano, ranyisi mar jaote Paulo
  ma kinde moko nosando jolup Kristo nyalo jiwowa ahinya nimar kata obedo ni nosando
  Jokristo kamano, bang\u2019 bedo Jakristo nowacho niya: \u2018Wuod Nyasaye nohera,
  kendo nochiworena.\u2019\u2014Jo Galatia 1:13; 2:20.\\n17. Jehova tiyo gi ang\u2019o
  e ywayowa ire kaachiel gi Wuode?\\n17 Jehova nyiso ni oherowa kuom konyo ng\u2019ato
  ka ng\u2019ato kuomwa oyud ber ma misango ma ne Kristo ochiwo kelo. Yesu nowacho
  niya: \u201cOnge ng\u2019a ma nyalo biro ira, ma ok Wuoro ma noora e moywaye.\u201d
  (Johana 6:44) Ee, Jehova owuon ema ywayowa ir Wuode kendo miyowa geno mar yudo ngima
  mochwere. E yo mane? Otimo kamano kokalo kuom tij lendo ma miyo wach maber chopo
  ne ng\u2019at achiel achiel, kendo otiyo gi roho mare maler ma konyowa winjo adiera
  mayudore e Muma kendo roho mare konyowa tiyo kod adierago kata obedo ni warem kendo
  wajoricho. Omiyo, mana kaka Jehova nowacho ne Jo-Israel, onyalo nyiso ng\u2019ato
  ka ng\u2019ato kuomwa niya: \u201cAseheri gi hera mochwere; e momiyo aseyuayo chunyi
  kang\u2019wononi.\u201d\u2014Yeremia 31:3.\\n18, 19. (a) Yo maduong\u2019ie moloyo
  ma Jehova nyisogo ni oherowa en mane, to ang\u2019o manyiso ni okawo ting\u2019no
  en owuon? (b) Ere kaka Wach Nyasaye miyo wabedo gadier ni Jehova winjo kwayo mag
  ji kodewogi?\\n18 Nyalo bedo ni yo maberie moloyo mwanenoe hera ma Jehova oherowago
  en thuolo momiyowa mar lemo. Muma jiwo ng\u2019ato ka ng\u2019ato kuomwa mondo \u2018olem
  maok owe.\u2019 (1 Jo Thessalonika 5:17) Nyasaye winjowa. Iluongo Jehova ni Jal
  \u201cma winjo kwayo mar ji.\u201d (Zaburi 65:2) Nyasaye ok omiyo ng\u2019ato ang\u2019ata,
  kata mana Wuode owuon, migawo mar winjo lemo mag ji. Par ane wachni: Jachwech polo
  kod piny jiwowa mondo wawuo kode e lemo ka wan thuolo. To owinjowa gi chuny mane?
  Be owinjowa gi chuny mang\u2019ich ng\u2019ich, maonge hera, kata maok dew? Ooyo
  ngang\u2019.\\n19 Jehova en ng\u2019ama dewo ji. Dewo ng\u2019ato tiende en ang\u2019o?
  Jakristo moro ma hike oniang\u2019 nolero ni dewo ng\u2019ato en \u201ckawo litne
  obed mari.\u201d Be Jehova winjo malit ka wachandore? Muma wacho kama kuom kinde
  ma ne Jo-Israel chandore: \u201cWeche duto ma nothagogi en bende ne githage.\u201d
  (Isaiah 63:9) Jehova ne ok oneno anena chandruogegi, to bende nowinjo malit ne joge.
  Lit ma Jehova winjo nenore ayanga e weche ma Jehova owuon ne owacho ne jotichne
  niya: Ng\u2019at \u2018mamulou mulo mana tong wang\u2019a.\u2019 * (Zekaria 2:8)
  To mano dibed malit manade! Ee, Jehova winjo malit sama wachandore. Gima chandowa,
  chande obende.\\n20. En paro mane maok onego wabedgo ka wadwaro luwo puonj mayudore
  e bug Jo Rumi 12:3?\\n20 Jakristo ma nigi paro mowinjore ok bi bedo gi sunga kata
  paro ni en ng\u2019at maduong\u2019 ahinya nikech hera mogundho ma Jehova nyiso
  dhano. Jaote Paulo nondiko kama: \u2018Kuom ng\u2019wono ma nomiya, awacho ne ng\u2019ato
  ka ng\u2019ato kuomu ni kik obed gi paro moting\u2019ore moloyo kaka owinjore obedgo,
  to mondo opar kare kaka Nyasaye osepogo ne ng\u2019ato ka ng\u2019ato pok mar yie.\u2019
  (Jo Rumi 12:3) Loko machielo to wacho kama: \u201cNg\u2019ato ka ng\u2019ato kuomu
  kik ketre e duong\u2019 ma oongego, to onere e yo mowinjore.\u201d (A Translation
  in the Language of the People, molok gi Charles B. Williams) Omiyo, kata obedo ni
  wamor ni Wuonwa me polo oherowa, we wasik gi paro mowinjore ka wang\u2019eyo ni
  ok en ni wasetimo maber ahinya e momiyo Nyasaye oherowa, to en mana nikech ng\u2019wono
  mar Nyasaye.\u2014Luka 17:10.\\n21. Gin miriambo mage mag Satan monego wadhi nyime
  kwedo kinde duto, to en adiera mane mayudore e Muma mwanyalo hoyogo chunywa?\\n21
  Mad moro ka moro kuomwa otim duto monyalo mondo otamre chuth miriambo mag Satan
  moriwo paro ma Satan dwaro ni wabedgo ni wan joma nono kata joma Nyasaye ok nyal
  hero. Kapo ni weche misekaloe e ngimani miyo ineno ni in ng\u2019at marach ma hera
  mar Nyasaye mogundho pod ok oromo miyo ibed ng\u2019at mowinjore, kata ni tije mabeyo
  mitimo gin gik matindo ahinya ma kata Nyasaye ma neno gik moko duto ok nyal neno,
  kata ni richoni ng\u2019eny ma kata tho mar Wuode makende ok nyal umogi, ng\u2019e
  ni opuonji miriambo. Kwed miriambo ma kamago gi chunyi duto! Weuru wadhi nyime hoyo
  chunywa gi adiera mayudore e weche Paulogi: \u201cAng\u2019eyo chuth ni, tho, kata
  ngima, kata malaika, kata ruodhi, kata gik ma timore ndalogi, kata gik ma biro timore,
  kata teko, kata gi ma malo, kata gi ma mwalo, kata gimoro manadi mochue, ok nyal
  pogowa gi hera mar Nyasaye moherowago e Kristo Yesu Ruodhwa.\u201d\u2014Jo Rumi
  8:38, 39.\\n^ par. 6 Kinde mang\u2019eny, Muma wacho ni geno mar chier otenore kuom
  gik ma Jehova paro. Jatich Nyasaye miluongo ni Ayub nowacho ne Jehova kama: \u2018Mad
  ipandae e liel, mad iritae ling\u2019 ling\u2019, mad ichikae ndalo mong\u2019ere,
  kendo para!\u2019 (Ayub 14:13) Yesu nowuoyo kuom chier mar \u201cji duto manie liete,\u201d
  tiende ni joma Jehova okano e pache. Wacho kamano ne owinjore nikech Jehova paro
  gik moko duto e wi jogo mobiro chiero.\u2014Johana 5:28, 29.\\n^ par. 19 Loko moko
  mag Muma keto wechego ka gima ng\u2019at ma mulo oganda Nyasaye ok mul wang\u2019
  Nyasaye to omulo wang\u2019e en owuon kata wang\u2019 Jo-Israel. Chochruokno nobedoe
  nikech moko kuom joma ne loko Muma ne oloko ndikono ka giparo ni ndikono ne ok nyis
  luor mowinjore ne Nyasaye. Paro mobam ma ne gin-gono nopando okang\u2019 ma Jehova
  dewogo jotichne.\"", "\"By Alseba Akinyi Migao mar somo okwa Mondo oketie tenge
  agulu Moro mar omenda mabiro KONYO siro chendro mag skunde Mondo okel fungeuok ne
  jonyuol mawinjo matek mokalo kaluore kod ridruok Mar uchumi took muoch midhusi Mar
  Corona e pachoka. Maendi en kaluore kod jaod bura ma Ugunja Migosi James Opiyo Wandayi
  mawachoni piny owacho [\u2026]\\nJo ohala e kar dak ma obunga mayudore e county
