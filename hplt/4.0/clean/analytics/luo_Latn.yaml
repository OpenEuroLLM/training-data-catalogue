  ka Haman osenindo e kom maduong\u02bc mane Esta obetie.\\nRuoth nowuoyo matek ka
  obwok mowacho niya, \u201cOdwaro kata mana mako mikacha e wang\u02bca kaneno?\u201d\\nKane
  ruoth pok otieko wuoyo, ne giumo wang\u02bc Haman.\\n9 Eka Harbona, achiel kuom
