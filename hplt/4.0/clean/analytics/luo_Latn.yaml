  Mbita Mokwe, but dala mar Lasea. 9 Kaka koro ne waseketho seche mathoth, to kwang\u02bc
  bende bedo marach, kendo kinde mag Sap Tweyo Chiemo bende nosekadho, Paulo nong\u02bcado
