  matu untu\u2019 sisull\u00e9 siyamas\u00e9i.\\n9Sitinajako tarimai s\u00e9ddi\u00e9
  lao ri laingng\u00e9 ri bolana tungke\u2019-tungke\u2019, temmaddar\u00e9k\u00e9.\\n10Iko
  pada purano tarima pammas\u00e9 iya maddupa-rupangng\u00e9 pol\u00e9 ri Allataala.
