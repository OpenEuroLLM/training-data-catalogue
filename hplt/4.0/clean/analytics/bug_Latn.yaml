  kuwaero gerei bembe 1000 kajunna nakapanni makedda purani napasilennerengngi tinja\u2019na.
  wenni maduanna mengkalingasi sadda makkeda : paddupai tinja\u2019mu, gangkanna maggeresi
  100 kajunna unta. Riwenni matellunna naengkalingasi sadda makeda: majeppu puang
  Allah ta\u2019ala naparetaiyakko gere\u2019I ana\u2019mu ismail gangkanna naenggeranni
  ibrahim sebagai tinj\u2019na riwettu purana maggere 1400 olokolo.\\nRiwettu maelo\u2019na
  paddupai parentana puang Allah ta\u2019ala, nabi ibrahim naolli madecengngi ana\u2019na
  ismail natteru nakaddao rigau engkana terri manggerangngi nippinna, nappa napoada
  makkeda :\\nBettuanna : eh\u2026..anakku ismail majeppu witako ana rilaleng tinroku
  ugereko, jaji pakkogitu tanggamu ana\u2019\\nNaikiya ismail saisai ana\u2019 marengkalinga
  ada nenniya maraja atturu, gangkanna de\u2019 namalampe pikkiri\u2019na nade\u2019
  namaega nawa-nawanna temmaseleng nappebali makkeda :\\nBettuanna : eh \u2026.ambokku
  tapaddupani aga napparentang puang Allah ta\u2019ala mattipi insya Allah talolongekka
  saisa tau sabbara.\\nNaiyya riwettu lettuna rionring aggeresengnge riseddena mina,
  poleni iblis maelo pakatulu-tului nakkedaiwi ibrahim pekkogitu tamaelo gere\u2019I
  ana\u2019ta? Nadegaharo taitai temmaka kessinna ampena, nakkeda ibrahim temmakaharo
  opojinna anakku naikiya napparenaiyakka puakku gere\u2019I, naulebbirengngi paddioloi
  pappojikku ripuakku naiyya pappojikku rianakku. Aga nalaosi iblis ri st. hajar nakkeda
  : magiharo monro kotu mabbe-bebe naengkaiharo lakkaimmu maelo gere\u2019I ana\u2019mu,
  nakkedana st. hajar namuni iya tunru tokka nagere, narekko parentana mua puang Allah
  ta\u2019ala naoncoppasiha narekko ana\u2019kku mua, aga nalaosi iblis ri ismail
  nakkeda eh\u2026 ismail magi nade muna mumaseleng, namaeloi hatu ambu\u2019mu gerekko,
  aga nappebalina ismail makkeda :\\nBettuanna : kuwengkalingani nenniya kuturusitoni
  parentana puakku\\nNasimata makkuraga mupa iblis, aga narirempe\u2019na batu ritu
  ri ismail iyatonaro saba nanariwajikeng pahajiie maddempe rimina, sikira-kira maddukka
  risetangnge nenniya akkacoe rinabi ismail.\\n- Eh\u2026ambokku tasioi kasi duae
  limakku tataroi masse aja urapa-rapa riwettu tagerekku nassabari upeddiriko ambo\\n-
  Eh\u2026ambokku tapangngoloi kasi rupakku ritanae bara aja taitaka nassabari namasse
  nyawata mitaka ambo\\n- Eh\u2026 ambokku talillingngi kasi pakeyatta, sarekkuammangngi
  aja natabbessiri dara, nassabari namakurang appalakku nannenia nassabari namasse
  babuana indokku narekko naitai daraku\\n- Eh\u2026. Ambokku tataroi matareng pisota
  nenniya tapassitakiwi narekko tagerekka, sarekkoammengngi namalomo kasi riseseku\\n-
  Eh\u2026 ambokku nareko lisuki ribola\u2019e tapaletturellaloka kasi selleng mappakarajaku
  ri indo\u2019ku, nenniya tasuroi kasi sabbarakengngi parentana puang Allah ta\u2019ala
  sarekkuammangngi nalolongengngi suruga pammasena puang Allah ta\u2019ala\\n- Eh\u2026
  ambokku aja lalo kasi talorangngi anana oroawane lao rindokku, sarekkowammengngi
  de\u2019 nasimata mompo paresse babuwana kasi indokku lao riya.\\nBettuanna : nariollina
  ibrahim makkeda : eh\u2026.ibarahim mupadupani nipimmu, makkuniro riwerengngi pamale
  risinna tau mappidecengnge, iyae gau mancaji paccoba maraja\u201d\\nAga narisellengenna
  nasaba kibase pole risuruga, iya natiwi\u2019emalaikat jibril. Iyatonaro saba\u2019na
  nassuroang toi surona puang Allah ta\u2019ala akkorobangnge, iya mancajie laleng
  maalebbinarigau engkana nappatu-patukeng maladde risesena idi tau masagenae. Makkedai
  nabitta SAW.\\nBettuanna: nigi-nigi lolongeng asagenang wedding makkoroba, nade\u2019
  nakkoroba, aja lalo nahaderekiwi allepperengnge\\nBangkung mememma ri abbettang,
  aju memeng ripasanre, polopa panni passuroammi kuturusi.\\nJsji pada laoi mai natapa
  millau doang ripuang Allah ta\u2019ala makkeda : eh\u2026..puang engkaki maiye..
  pada pura pasilennerengngi alleppereng koroba\u2019e, de\u2019 lain riakkattai sanggadinna
  riota nenniya pammaseta puang. Mamuare nasimata rikkatenni masse agamata, waekkeng
  temmalore\u2019 bokong ampe kale mamuare assitemmereng ritu natattimpa minasae /hajja\u2019e,
  nassiruju-rujukeng assisompungetta padatta rupatau iyarega tau mapparentat, tatuju
  laleng pennie, muttama rimasigie nattakatoro pabbanuae, naenceng pulana wassele\u2019na
