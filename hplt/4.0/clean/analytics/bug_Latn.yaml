  pol\u00e9 ri yas\u00e9\u2019na tana\u00e9, sittanr\u00e9to iyaro pikkirak-Ku ri
  yas\u00e9\u2019na pikkirammu, sibawa lalek-Ku ri yas\u00e9\u2019na lalemmu.\\n10Pada-pada
