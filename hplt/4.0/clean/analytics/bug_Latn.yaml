  palettu\u2019 biritta pol\u00e9 ri Allataala; tau iya tumaningiy\u00e9ngngi tau
  laingng\u00e9, harusu\u2019i natumaningi sibawa awatangeng pol\u00e9 ri Allataala,
  kuwammengngi ri laleng sininna gau\u2019\u00e9, weddingngi ripakaraja Allataala
  naolai Y\u00e9sus Kristus. Al\u00e9na ritu makuwasa sibawa sipato\u2019 ripakaraja
  lettu mannennungeng. Aming.\\n12Saudara-saudara iya ripojiy\u00e9! Manrasa-rasa
  senna\u2019ko makkekkuwangng\u00e9 nasaba mattengngakko rioji. Iyakiya aja\u2019
  mumarasa h\u00e9rang, samanna engka s\u00e9uwa iya d\u00e9\u2019\u00e9 padanna kajajiyang
  lao ri iko.\\n13Mala, sitinajako masennang nasaba turu\u2019i manrasa-rasa silaong
  Kristus. Na matti r\u00e9kko riyappaitanni arajanna Kristus, mariyo-riyoko matu.\\n14Saroko
  r\u00e9kko ripakatunako nasaba maccow\u00e9ko ri Kristus. Iyaro bettuwanna Roh iya
  malebbi\u00e9, iyanaritu Rohna Allataala, engkai ri al\u00e9mu.\\n15Aja\u2019 namuwi
  s\u00e9ddi tau pol\u00e9 ri yelle\u2019mu manrasa-rasa nasaba pabbunoi, iyar\u00e9\u2019ga
  pangai, iyar\u00e9\u2019ga tomaja, iyar\u00e9\u2019ga nasaba nacampurukiwi urusanna
  tau laingng\u00e9.\\n16Iyakiya r\u00e9kko manrasa-rasako nasaba s\u00e9ddiko tau
  Krist\u00e9ng, aja\u2019 mumasiri nasaba gau\u2019\u00e9ro. Attarima kasi\u2019no
  ri Allataala, makkeda\u00e9 mutiwii asenna Kristus.\\n17Narapini wettunna Allataala
  mad\u00e9l\u00e9kiwi lino\u00e9. Na umma\u2019na muto Allataala riad\u00e9l\u00e9ki
