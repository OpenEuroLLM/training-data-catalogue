  sabbi pol\u00e9 ri akuwasak-Ku untu\u2019 bangsa-bangsa\u00e9.\\n5Muwobbii matu
  bangsa-bangsa laingng\u00e9, sibawa masitta\u2019i mennang pol\u00e9 ri iko, nasaba
  Iyya, PUWANG Allataalamu, Allataala mapaccinna Isra\u00e9li\u00e9, saba\u2019 Iyya
