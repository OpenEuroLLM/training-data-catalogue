  Al\u00e9na ri wettu macaw\u00e9\u2019-Na mupa.\\n7Sitinajai tau maja\u00e9 p\u00e9d\u00e9c\u00e9ngiwi
  atuwonna, sibawa pinrai cara mappikkiri\u2019na. Leppessangngi lisu ri PUWANGNGE,
