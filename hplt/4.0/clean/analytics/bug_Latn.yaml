  harusu\u2019i mennang mattanggung jawa\u2019 lao ri Allataala iya sadiya\u00e9nna
  untu\u2019 mad\u00e9l\u00e9kiwi tau iya tuwo\u00e9 sibawa iya mat\u00e9.\\n6Iyanaro
  saba\u2019na Kar\u00e9ba Mad\u00e9c\u00e9ngng\u00e9 pura toni riyabbirittang lao
  risining tau mat\u00e9. Akkattana kuwammengngi mennang, iya pura\u00e9 riad\u00e9l\u00e9ki
  ri laleng keadaang tubu \u2014 pada-pada mutowi sininna tauw\u00e9 riad\u00e9l\u00e9kiwi
  matu \u2014 naull\u00e9i tuwo secara rohani, situru \u00e9lona Allataala.\\n7Sininna
