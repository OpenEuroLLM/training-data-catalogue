  Komentar\"", "\"1Laono mai maddeppungeng, \u00e9h bangsa-bangsa\u00e9, sibawa \u00e9ngkalingai.
  Leppessanni sininna lino\u00e9 sibawa sininna iya tuwo\u00e9 ri lalenna pol\u00e9
  sibawa m\u00e9ngkalingai.\\n2Macayii PUWANGNGE lao ri sininna bangsa\u00e9 sibawa
  sininna pasukanna mennang. Nahukkungngi matu sibawa napaccappui mennang.\\n3D\u00e9\u2019
  narikuburu matu sining ujuna mennang, iyakiya rileppessangngi bawang makebbong sibawa
  mabbau. Macella\u2019i matu sining bulu\u00e9 nasaba nal\u00e9mpekiwi darana mennang.\\n4Mata
  esso\u00e9, k\u00e9tengng\u00e9 sibawa w\u00e9ttowingng\u00e9 ancuru\u2019i matu.
  Rilulungngi matu langi\u00e9 pada-pada karettasa rilulungng\u00e9. Semp\u00e9\u2019i
  matu sining w\u00e9ttowingng\u00e9 pada-pada daud-daung iya madduttungng\u00e9 pol\u00e9
  ri ponna.\\n5Purani napassadiya PUWANGNGE peddan-Na ri suruga\u00e9, na makkekkuwangng\u00e9
  iyaro peddangng\u00e9 nageppai matu bangsa Edongng\u00e9 iya pura\u00e9 ripakennai
  pahukkungeng sibawa ma\u00e9lo ripaccappu.\\n6Pennoi matu dara peddanna PUWANGNGE
  nenniya penno sibawa lunra\u2019na mennang, pada-pada darana nenniya lunra\u2019na
  olokolo akkarobangengng\u00e9. Saba\u2019 PUWANGNGE passadiyai akkarobangengng\u00e9
  ri Bozra, sibawa pakangka abbunowang battowa ri tana Edom.\\n7Mat\u00e9i matu tauw\u00e9
  pada-pada saping liya\u00e9 sibawa saping lolo\u00e9. Macella\u2019i matu wanuwanna
  sibawa dara nenniya pennoi sibawa lunra.\\n8Iyanaro wettunna PUWANGNGE m\u00e9waiwi
  Sion sibawa makkabale lao risining balin-Na.\\n9Tappinrai matu sining salona Edom
  mancaji kamalo, sibawa tanana mancaji bal\u00e9rang. Angkanna sininna wanuwa\u00e9
  malluwa pada-pada kamalo\u00e9.\\n10Esso wenni iyaro luwa\u2019\u00e9 d\u00e9\u2019
  napedd\u00e9, sibawa maggalimpuwa rumpu\u00e9 pol\u00e9 ri al\u00e9na untu\u2019
  mannennungeng. Iyaro tana\u00e9 risalaiwi matu kullang sibawa makabuttu massossoreng,
  sibawa d\u00e9\u2019 muwi s\u00e9ddi tau molai matu.\\n11Unrengng\u00e9 sibawa landa\u2019\u00e9
  monroiwi matu, kacoci\u2019\u00e9 sibawa kao-kao\u00e9 monro matu kuwaro. PUWANGNGE
  pancajiwi iyaro tana\u00e9 kacau sibawa kullang pada-pada ri wettu d\u00e9\u2019napa
  appancajingengng\u00e9.\\n12D\u00e9\u2019gaga arung par\u00e9ntai iyaro wanuwa\u00e9,
  sibawa sininna pamimpinna lennye\u2019ni.\\n13Sining saorajana sibawa kota-kotana
  iya mabb\u00e9nt\u00e9ngng\u00e9 natuwoini matu alekale maddori sibawa wella, sibawa
  naonroi asu ale nenniya manu\u2019-manu\u2019 unta.\\n14Mallamparengngi matu olokolo
  masekkangng\u00e9 ri lalenna; sibali-baliwi bombocilla\u2019\u00e9, sibawa bombocilla
  wenni\u00e9 sappa onrong mapp\u00e9sau.\\n15Ri onrongng\u00e9ro m\u00e9bbui sarang
  ula mamoso\u00e9, mattello, mangarang sibawa piyarai ana\u2019-ana\u2019na. Muwi
  bokang pakkanr\u00e9 incal\u00e9 maddeppungeng towi sibawa pasangenna tungke-tungke.\\n16Sappani
  sibawa bacai ri laleng Kitta\u2019na PUWANGNGE: D\u00e9\u2019 muwi s\u00e9ddi pol\u00e9
  ri mahlu\u2019\u00e9ro tedd\u00e9ng matu iyar\u00e9\u2019ga temmappasangeng. Saba\u2019
  makkuwaniro par\u00e9ntana PUWANGNGE, sibawa Al\u00e9na muto pura paddeppungengngi
  mennang.\\n17PUWANGNGE ritu tawai iyaro wanuwa\u00e9 ri yelle\u2019na mennang sibawa
  tungke-tungke tarimai tawana. Monroi matu mennang kuwaro untu\u2019 mannennungeng,
  sibawa iyaro tana\u00e9 mancajiwi matu appunnangenna massossoreng.\"", "\"1Salomo
  ana\u2019 worowan\u00e9na Arung Daud mancaji arunni iya masse\u2019\u00e9 tudangenna
  ri laleng akkarungenna Isra\u00e9li\u00e9. PUWANG Allataalana barakkakiwi sibawa
  pancajiwi makuwasa senna.\\n2Sininna kapala pasukang sisebbu\u00e9 sibawa pasukang
  s\u00e9ratu\u00e9, sininna pajaba pamar\u00e9nta\u00e9, sibawa sininna kapala kaluwarga
  Isra\u00e9li\u00e9 ripar\u00e9ntang ri Arung Salomo\\n3untu\u2019 lao sibawa al\u00e9na
  ri onrong assompangng\u00e9 ri Gib\u00e9on. Laoni mennang kuwaro, nasaba kuwaniro
  engka K\u00e9mana PUWANGNGE iya na\u00e9bbu\u00e9 Musa atanna PUWANGNGE wettunna
  ri padang kessi\u2019\u00e9.\\n4(Iyakiya Petti Assijancinna PUWANGNGE engkai ri
  Y\u00e9rusal\u00e9m ri laleng k\u00e9ma iya napasangng\u00e9 Arung Daud untu\u2019
  Petti\u00e9ro wettunna napal\u00e9tt\u00e9 pol\u00e9 ri Kiryat-Y\u00e9arim.)\\n5M\u00e9zba
  gessa\u00e9 iya na\u00e9bbu\u00e9 B\u00e9zaleel ana\u2019 Uri, eppona Hur, engka
  towi ri Gib\u00e9on ri yolona K\u00e9mana PUWANGNGE. Arung Salomo sibawa sininna
  ra\u2019ya\u2019\u00e9 massompai lao ri PUWANGNGE kuwaro.\\n6Ri yolona K\u00e9ma\u00e9ro
  nakkasuwiyangenni arungng\u00e9 ri yas\u00e9\u2019na m\u00e9zba gessa\u00e9 sisebbu
  olokolo selaku akkarobangeng ritunu untu\u2019 PUWANGNGE.\\n7Iyaro wenni\u00e9 nappaitanni
  al\u00e9na Allataala lao ri Salomo sibawa makkeda, \\\"Salomo, \u00e9llauni aga
  iya muwacinnaiy\u00e9, Uw\u00e9r\u00e9kko matu iyaro!\\\"\\n8Napp\u00e9bali Salomo,
  \\\"Oh Allataala, purani Muwappaitang makkeda\u00e9 Muwamas\u00e9i senna\u2019i
  ambo\u2019ku Daud, sibawa purani Muwakkaka mancaji arung sull\u00e9iwi.\\n9Makkekkuwangng\u00e9
  oh PUWANG Allataala, tennapodo Murupaiwi jancim-Mu ri ambo\u2019ku. Purani Muwakkaka
  mancaji arung ri bangsa battowa\u00e9w\u00e9 iya d\u00e9\u2019\u00e9 naribilang
  jumellana.\\n10Rimakkuwannanaro w\u00e9r\u00e9nna\u2019 apanr\u00e9ng sibawa pangissengeng
  iya uwapparelluwangng\u00e9 untu\u2019 pimpingngi mennang. R\u00e9kko d\u00e9\u2019
  nakkuwaro, p\u00e9kkugi makkull\u00e9ka par\u00e9ntai umma\u2019-Mu iya battowa\u00e9w\u00e9?\\\"\\n11Napp\u00e9bali
  Allataala lao ri Salomo, \\\"Iyaro par\u00e9llaummu makessing. D\u00e9\u2019 muw\u00e9llau
  asugireng iyar\u00e9\u2019ga ataromporeng iyar\u00e9\u2019ga amat\u00e9nna sining
  balimmu iyar\u00e9\u2019ga umuru malamp\u00e9 untu\u2019 al\u00e9mu, sangaddinna
  apanr\u00e9ng sibawa pangissengeng untu\u2019 par\u00e9ntai umma\u2019-Ku iya Uwappaddettangengng\u00e9
  ri iko.\\n12Rimakkuwannanaro Uw\u00e9r\u00e9kko matu apanr\u00e9ng sibawa pangissengeng.
  Ri lainna\u00e9ro Upancajiko matu lebbi mad\u00e9c\u00e9ng, lebbi sugi sibawa lebbi
  tarompo naiya muwi arung niga ri wettu labe\u2019\u00e9 iyar\u00e9\u2019ga wettu
  mangolo\u00e9.\\\"\\n13Nainappa nasalai Salomo onrong assompangng\u00e9 ri Gib\u00e9on
  iya naonroiy\u00e9 K\u00e9mana PUWANGNGE, nanalisu ri Y\u00e9rusal\u00e9m. Pol\u00e9
  kuwaniro pajoppai appar\u00e9ntangng\u00e9 ri Isra\u00e9li\u00e9.\\n14Napassakke\u2019i
  tentarana sibawa 1.400 kar\u00e9ta musu nenniya 12.000 anyarang pammusu. Sibagiyang
  nataro ri Y\u00e9rusal\u00e9m, na lebbinna ri siyagangngar\u00e9 kota laing.\\n15Ri
  laleng appar\u00e9ntanna Salomo, ulawengng\u00e9 sibawa p\u00e9ra\u2019\u00e9 sinrupai
  barang biyasa\u00e9 ri Y\u00e9rusal\u00e9m, pada-pada batu\u00e9; sibawa aju camara
  Libanongng\u00e9 ma\u00e9ga senna pada-pada aju ara biasa\u00e9.\\n16Naolai padangkang-padangkang
  iya bantu\u00e9ngngi arungng\u00e9, ripapol\u00e9i anyarangng\u00e9 pol\u00e9 ri
  Mas\u00e9r\u00e9 sibawa K\u00e9w\u00e9,\\n17sibawa kar\u00e9ta-kar\u00e9ta musu\u00e9
  ripapol\u00e9i pol\u00e9 ri Mas\u00e9r\u00e9, nainappa ribalu\u2019si lao risining
  arung H\u00e9t-\u00e9 enrengng\u00e9 sining arung Siria\u00e9 sibawa ellinna 150
  dowi p\u00e9ra\u2019 untu\u2019 sikaju anyarang, sibawa 600 dowi p\u00e9ra\u2019
  untu\u2019 s\u00e9ddi kar\u00e9ta musu.\"", "\"1Ri lalenna duwattaungng\u00e9 lebbi
  d\u00e9\u2019gaga musu ri yelle\u2019na Isra\u00e9li\u00e9 sibawa Siria.\\n2Iyakiya
  ri taung matellu\u00e9, Yosafat arunna Y\u00e9huda lao m\u00e9wai sita Ahab arunna
  Isra\u00e9li\u00e9.\\n3Ri yolonaro purai Ahab makkeda lao risining parawirana, \\\"Muwisseng
  makkeda\u00e9 iyaro kota Ramot ri Gil\u00e9ad appunnangetta! Magi nad\u00e9\u2019
  narisittai paimeng pol\u00e9 ri arung Siria?\\\"\\n4Na wettunna Yosafat pol\u00e9,
  makkutanani Ahab, \\\"Ma\u00e9loiga Saudara lao sibawakka gasai Ramot?\\\" Napp\u00e9bali
  Yosafat, \\\"Makessinni! Talao massibawa. Tentara sibawa pasukang makkinnyarakku
  mass\u00e9ddiwi matu sibawa tentara nenniya pasukang makkinnyaranna Saudara.\\n5Iyakiya
  makessingengngi makkutanaki riyolo lao ri PUWANGNGE.\\\"\\n6Nanapaddeppungenni Ahab
  kira-kira 400 nabi palsu namakkutana lao ri mennang, \\\"Weddikka\u2019ga lao gasai
  Ramot iyar\u00e9\u2019ga d\u00e9\u2019?\\\" Napp\u00e9bali mennang, \\\"Wedding.
  PUWANGNGE matu mabb\u00e9r\u00e9yangngi iyaro kota\u00e9 lao ri Datu.\\\"\\n7Iyakiya
  makkutanai paimeng Yosafat, \\\"D\u00e9\u2019ga gaga kuwa\u00e9 nabi laing iya weddingng\u00e9
  makkutanangekki ri PUWANGNGE?\\\"\\n8Napp\u00e9bali Ahab, \\\"Engka mupa s\u00e9ddi,
  Mikha ana\u2019 Yimla. Iyakiya ubenciwi, nasaba d\u00e9\u2019 naengka nabotoi s\u00e9uwa
  iya makessingng\u00e9 untu\u2019 iyya; tuli iya d\u00e9\u2019\u00e9 namakessing.\\\"
  Namett\u00e9 Yosafat, \\\"Ah, aja\u2019 muwakkeda makkuwatu!\\\"\\n9Nanaobbini Ahab
  s\u00e9ddi pegaw\u00e9nna saoraja\u00e9 nanasuroi masitta lao duppaiwi Mikha.\\n10Iyaro
  wettu\u00e9 Ahab sibawa Yosafat, tudangngi ri kad\u00e9ra akkarungengng\u00e9 sibawa
  pak\u00e9yang arajang ri onrong add\u00e9sekeng gandongng\u00e9 ri yolona pintu
  gerbanna Samaria, na sining nabi\u00e9 pol\u00e9ni mangolo sibawa palettu\u2019i
  botona.\\n11Sala s\u00e9ddinna pol\u00e9 ri nabi-nabi\u00e9ro, iya riyasengng\u00e9
  Z\u00e9d\u00e9kia ana\u2019 Kenaana, m\u00e9bbu tanru-tanru bessi nainappa makkeda
  lao ri Ahab, \\\"Iyana\u00e9 napowada PUWANGNGE, \u2018Nasibawang tanru-tanru pada-pada\u00e9w\u00e9
  nahantangngi matu Datu Siria sibawa mancuru\u2019i mennang.\u2019\\\"\\n12Sininna
  nabi laingng\u00e9 nasitujuini sibawa makkeda, \\\"Gasani Ramot, pakalai matu Datu.
  PUWANGNGE mp\u00e9r\u00e9ngngi matu apakalang Datu.\\\"\\n13Na wettu\u00e9ro suro
  iya duppaiy\u00e9ngngi Mikha, makkedani lao ri Mikha, \\\"Sininna nabi iya laingng\u00e9
  botoi apakalang untu\u2019 arungng\u00e9. Tennapodo Bapa\u2019 boto towi iya makessingng\u00e9
  pada-pada mennang.\\\"\\n14Iyakiya mapp\u00e9baliwi Mikha, \\\"Nasabbing PUWANG
  iya tuwo\u00e9, banna ma\u00e9loka powadai aga napowada PUWANGNGE lao ri iyya!\\\"\\n15Lettu\u2019nana
  Mikha ri yolona Arung Ahab, makkutanani arungng\u00e9, \\\"Weddikka\u2019ga iyya
  sibawa Arung Yosafat lao gasai Ramot, iyar\u00e9\u2019ga d\u00e9\u2019?\\\" Namett\u00e9
  Mikha, \\\"Gasani! Tentu pacaui matu Datu. PUWANGNGE mp\u00e9r\u00e9ngngi matu apakalang
  Datu.\\\"\\n16Napp\u00e9bali Ahab, \\\"R\u00e9kko mabbicarako lao ri iyya nasabbing
  asenna PUWANGNGE, powadai iya tongengng\u00e9. W\u00e9kkasiyagako harusu upar\u00e9ngngerangi
  passalenna gau\u2019\u00e9ro?\\\"\\n17Napp\u00e9bali Mikha, \\\"Uwitai tentara Isra\u00e9li\u00e9
  tassiya-siya ri bulu-bulu\u00e9. Pada-padai mennang bimbala d\u00e9\u2019\u00e9
  pakkampina, namakkeda PUWANGNGE passalenna mennang, \u2018Iya\u00e9 sining tauw\u00e9
  d\u00e9\u2019 nappunnai pamimping. Leppessanni mennang lisu sibawa salama.\u2019\\\"\\n18Namakkeda
  Ahab lao ri Yosafat, \\\"Tongetto adakku? D\u00e9\u2019 naengka nabotongekka iya
  makessingng\u00e9! Tuli iya maja\u00e9 bawang!\\\"\\n19Makkedai Mikha paimeng, \\\"Makkekkuwangng\u00e9
  \u00e9ngkalingai aga iya napowada\u00e9 PUWANGNGE! Uwitai PUWANGNGE tudang ri kad\u00e9ra
  arajan-Na ri suruga\u00e9, sibawa sininna mala\u00e9ka\u2019-Na tettong ri sedd\u00e9-Na.\\n20Makkutanai
  PUWANGNGE, \u2018Nigana ma\u00e9lo pal\u00e9c\u00e9i Ahab kuwammengngi nama\u00e9lo
  lao mammusu namat\u00e9 ri Ramot ri Gil\u00e9ad?\u2019 Papp\u00e9balinna iyaro sining
  mala\u00e9ka\u2019\u00e9 maddupa-rupang.\\n21Paccappurenna malluruni s\u00e9uwa
  roh. Naddepp\u00e9rini PUWANGNGE sibawa makkeda, \u2018Iyya ritu ma\u00e9lo pal\u00e9c\u00e9i.\u2019\\n22Nakkutana
  PUWANGNGE, \u2018P\u00e9kkugi carana?\u2019 Napp\u00e9bali iyaro roh-\u00e9, \u2018Ma\u00e9loka
  lao m\u00e9bbui sininna nabinna Ahab mabbell\u00e9.\u2019 Nakkeda PUWANGNGE, \u2018Makessinni,
  pogau\u2019ni iyaro, muwull\u00e9i matu pal\u00e9c\u00e9i.\u2019\\\"\\n23Napatteruni
  Mikha adanna, \\\"Nah, iyanaro kajajiyang! PUWANGNGE pura m\u00e9bbui nabi-nabinna
  Datu mabbell\u00e9 lao ri Datu saba\u2019 PUWANGNGE pura pattentui untu\u2019 pateppaiwi
  abala Datu!\\\"\\n24Namalluruna Nabi Z\u00e9d\u00e9kia maddepp\u00e9riwi Mikha nanaleppa\u2019i
  rupanna sibawa makkeda, \\\"P\u00e9kkugi makkull\u00e9 nasalaika Rohna PUWANGNGE
  sibawa mabbicara lao ri iko?\\\"\\n25Napp\u00e9bali Mikha, \\\"Muwitai matu buttinna
  wettummu muttama ris\u00e9ddi\u00e9 bili\u2019 untu\u2019 massubbu.\\\"\\n26Nappar\u00e9nta
  Arung Ahab, \\\"Tikkengngi! namutiwii lao ri Amon, wali kota\u00e9, sibawa lao ri
  ana\u2019 Pattola\u00e9 Yoas.\\n27Suroi mennang puttama\u2019i ri laleng attarungkungng\u00e9,
  sibawa mp\u00e9r\u00e9ngngi inanr\u00e9 sibawa uwai rinung c\u00e9dd\u00e9\u2019na
  bawang narapi lisuka sibawa salama.\\\"\\n28Nakkeda Mikha, \\\"R\u00e9kko lisui
  Datu sibawa salama, bettuwanna d\u00e9\u2019 nabbicara PUWANGNGE naolaka! Sininna
  iya had\u00e9r\u00e9\u2019\u00e9 kuwa\u00e9 mancaji sabbi.\\\"\\n29Nainappa Ahab
  arung Isra\u00e9l, sibawa Yosafat arung Y\u00e9huda lao gasai kota Ramot ri Gil\u00e9ad.\\n30Makkedani
  Ahab lao ri Yosafat, \\\"Ma\u00e9loka mallarikkodo sibawa maccow\u00e9 mammusu,
  iyakiya Saudara sitinajai pak\u00e9i pak\u00e9yang arajammu.\\\" Makkuwaniro arung
  Isra\u00e9li\u00e9 mallarikkodo wettunna lao mammusu.\\n31Iyaro wettu\u00e9 iya
  telluppulo duwa pallima pasukang kar\u00e9ta musuna Siria pura ripar\u00e9ntanni
  ri arunna untu\u2019 gasai banna arung Isra\u00e9li\u00e9 bawang.\\n32Jaji, wettunna
  mennang naita Arung Yosafat, naseng manenni mennang al\u00e9na arung Isra\u00e9li\u00e9.
  Rimakkuwannanaro nagasani mennang. Iyakiya gorai Yosafat,\\n33nanamaingekini mennang
  makkeda\u00e9 tenniyai arunna Isra\u00e9li\u00e9. Nanapp\u00e9sauna gasai.\\n34Nasitujuwangngi
  s\u00e9ddi prajuri Siria malleppessangngi ana\u2019 panana, teppatujui ri akkatta
  mattentu\u00e9. Iyakiya iyaro ana\u2019 pana\u00e9 nakennai Ahab sibawa bettui waju
  musuna ri bagiyang padduppanna. Nagorana Ahab lao ri pappalari kar\u00e9tana, \\\"Nakennaka!
  Bal\u00e9\u2019ko namutiwika massu pol\u00e9 ri ammusurengng\u00e9!\\\"\\n35Iyakiya
  nasaba marowa mupi musu\u00e9, tette\u2019i Arung Ahab tettong ritula ri laleng
  kar\u00e9tana mangolo ri tentara Siria\u00e9. Darana massolo\u2019i pol\u00e9 ri
  lona, mappenna ri salima kar\u00e9ta\u00e9. Araw\u00e9nnana mat\u00e9ni.\\n36Ma\u00e9lonana
  labu esso\u00e9 sininna pasukang Isra\u00e9li\u00e9 ripar\u00e9ntanni untu\u2019
  lisu ri kota\u00e9 sibawa da\u00e9rana tungke\u2019-tungke\u2019,\\n37nasaba mat\u00e9ni
  arungng\u00e9. Nanalisuna mennang sibawa kuburu\u2019i ujuna Ahab ri Samaria.\\n38Wettunna
  ripaccingi kar\u00e9tana ri kolang Samaria, sining makkunrai cakkuribangng\u00e9
  cemm\u00e9i kuwaro, sibawa asu\u00e9 mall\u00e9pe dara ri kar\u00e9ta\u00e9ro, pada-pada
  iya pura\u00e9 napowada PUWANGNGE kuwaro.\\n39Curita laingng\u00e9 passalenna Arung
  Ahab, passalenna saoraja gadinna sibawa sininna kota iya napatettongng\u00e9, pura
  riyokini ri laleng kitta Sejarana Arung-ngarung Isra\u00e9li\u00e9.\\n40Mat\u00e9nana
  Ahab, Ahazia ana\u2019na mancaji arung sull\u00e9iwi.\\n41Ri taung maeppa\u00e9
  appar\u00e9ntanna Ahab arung Isra\u00e9l, Yosafat ana\u2019 Asa mancaji arunna Y\u00e9huda.\\n42Iyaro
  wettu\u00e9 umuru\u2019na telluppulo lima taung. Mappar\u00e9ntai ri Y\u00e9rusal\u00e9m
  duwappulo lima taung ittana. Indo\u2019na iyanaritu Azuba ana\u2019 Silhi.\\n43Pada-pada
  Asa, ambo\u2019na, napogau\u2019i Yosafat aga iya makessingng\u00e9 ri pakkitanna
  PUWANGNGE. Napallennye\u2019i pol\u00e9 ri akkarungenna sininna cakkuribang worowan\u00e9
  sibawa makkunrai iya majjama\u00e9 ri onrong-ngonrong assompang barahala\u00e9 iya
  monro\u00e9 mupa pol\u00e9 ri wettunna Asa, ambo\u2019na. Iyakiya iyaro onrong-ngonrong
  assompangng\u00e9 d\u00e9\u2019 naancuru\u2019i. Makkasuwiyangeng mupi ra\u2019ya\u2019\u00e9
  akkarobangeng sibawa kamennyang kuwaro. M\u00e9bbui Yosafat sining kappala Tarsis
  untu\u2019 mala ulaweng pol\u00e9 ri Ofir, iyakiya iyaro sining kappala\u2019\u00e9
  d\u00e9\u2019 najaji sompe nasaba masolangngi ri Ezion-G\u00e9ber. Arung Ahazia
  pol\u00e9 ri Isra\u00e9l mapp\u00e9ddarangngi kuwammengngi ana\u2019 kappala\u2019na
  silaongngi sompe sibawa ana\u2019 kappala\u2019na Yosafat, iyakiya nasamp\u00e9yangngi
  Yosafat namuni mappunnaiwi assisumpungeng iya makessingng\u00e9 sibawa arunna Isra\u00e9li\u00e9.
  Namat\u00e9na Yosafat sibawa ritampung ri kuburu arung-ngarungng\u00e9 ri Kota Daud.
  Yoram ana\u2019na mancaji arung sull\u00e9iwi. Curita laingng\u00e9 passalenna Yosafat,
  passalenna abaraningenna sibawa sining ammusurenna riyokii ri laleng kitta Sejarana
  Arung-ngarunna Y\u00e9huda. Iyaro wettu\u00e9 wanuwa Edom d\u00e9\u2019 nappunnai
