  pogau\u2019i aga iya Upuw\u00e9lo\u00e9, sibawa narapii sininna iya Uwakkattaiy\u00e9.\\n12Musalaiwi
  matu Bab\u00e9l sibawa masennang, sibawa riantara massu sibawa salama. Bulu sibawa
  bulu-bulu\u00e9 marennui matu sibawa gora-gora, aju-kajungng\u00e9 ri dare\u2019\u00e9
  mappaleppa\u2019i.\\n13Aju camara\u00e9 sull\u00e9iwi matu alekale maddori\u00e9,
  tanet-taneng bunga\u00e9 sull\u00e9iwi alekale\u2019\u00e9. Kajajiyangngi iyaro
  kuwammengngi naripakalabba-Ka; selaku tanrang mannennungeng iya d\u00e9\u2019\u00e9
  natedd\u00e9ng.\\\"\"", "\"Pinisi yanaritu kappala layara tradisional has\u2019na
  pol\u00e9 Indon\u00e9sia, yappunna\u00e9wi To Ugi makkutopa To Mangkasara\u2019
  ri Sulawesi Maniang, hususna pol\u00e9 ri Wanua Bira, Kecamatang Bonto Bahari, kabupat\u00e9ng
  Bulukumba. Pinisi yaro sebenarna aseng layara. Kappala ya\u00eb mappunnai duwa alliri
  layara poko sibawa pitu lampa layara, yanaritu tellu ri cappa ri olo, duwa ri olo,
  sibawa duwa pol\u00e9 ri munri; biasana ripak\u00e9 untu\u2019 marakka barang lintasa
  pulo. Duwa alliri layara poko yaro ripattentukangngi 2 (read: duwa) kalima sahada\u2019
  sibal\u00e9\u2019na pitu lampa layara bettuanna jumla aya yamaneng sure Al-Fatihah.
  Pinisi yanaritu sirupa kappala layara mappak\u00e9 tanja layara sekunar sibawang
  duwa alliri sibawa pitu lampa layara bettuanna yanaritu n\u00e9n\u00e9\u2019 moyanna
  bangsa Indon\u00e9sia weddingngi naccenn\u00e9ki iyar\u00e9ga nalaloi pitu tasi
  maloang ri lino\u00e9 ya\u00eb.\"", "\"Tenri sedding assisellengenna essoe nawennie,
  tajangnge na\u2019 pettangnge, pella\u2019e nakecce\u2019e, mancajiwi butti nenniya
  papparingerang ri\u2019 idi umma sellengnge makkeda riwettu tuota sewwa wettu matti
  napoleiki amateng, riwettu magalatta engka wettu napoleiki lasa, riwettu malolota
  sewwa wettu napoleiki atowangeng. Wettu masagenata sewwa wettu napoleiki akasi-asingeng.\\nNade
  nasiaga ettana labe\u2019na uleng ramalang narigau engkana nataroangekki puang Allata\u2019ala
  upe maraja nenniya appalang malleppi-leppi, nenniya nappa mua purana rirowasi alleppereng
  pittara\u2019e nasibawai addampeng, samanna tabbajo mupi riwettu tosiaddampeng-dampengetta,
  natopada engka mapaccing pole ridosa\u2019e nenniya assitampungenna ati\u2019e.
  takkaposi iyae essoe, esso malebbi namsero raja\u2019riseseta idi umma sellengnge,
  onrong riongroi sipakario rennu, pada roasiwi sikira-kira pannessai tanra asukkureketta
  nenniya tanra attarima kasitta lao risese arajanna puang Allah ta\u2019ala.\\nUmma''
  Selleng engkae hadere''...\\nRilalenna iyae esso\u2019e dua tellu kajajiang maraja
  rilalenna lino, iya mancajie tanra alebbirenna nenniya arajangenna agama sellengnge.
  Mula-mula kajajiang maraja iyanaritu : maddatu sebbu oroane nenniya makkunrai pada
  maddeppungeng dipadang arafah, iya manengro umma selleng mallaingeng maneng apolengenna,
  madupa-rupang bahasana, nenniya bangsana makkutoparo sukunna, engka mola tasi, engka
  mola puttanang, engka manengngi makkoko\u2019e rilapangenna bulu arafah dengan pengorbanan
  yang sangat besar, napakkua teppe\u2019na lao ripuang Allah ta\u2019ala samanna
  de\u2019naseddingngi alena napaluttu warang-parangna, nasalai wija-wijanna, nalulu
  siaga egana arasa-rasang, sarekkuammengngi nabaliwi pattampana puang Allah ta\u2019ala,
  nalao ritana mapaccingnge, pada maddeppungeng ripadang arafah pada pakei pakeang
  ihramna, pakeang mapute tenrijai, temmabaju temmassongko, samanna mennangro silalona
  ripatokkong pole rikubburu\u2019e naripaddeppungeng ripadang mahsyar, napada napoada
  makkeda : Mekkedatoi nabitta SAW : Umma'' selleng engkae hadere''... Maduanna kajajiang
  maraja rilalenna iya\u2019e esso\u2019e, iyanaritu maddatu sebbu umma selleng urowane
  nenniya makkunrai risiagae egana negara pada lao maneng ritana lapangnge iyarega
  rimasigi\u2019e pada lao maneng pasilennerangngi sempajang alleppereng koroba\u2019e
  rigau engkai paegai appoji-pojinna nenniya takabbere\u2019na lao ripuang Allah ta\u2019ala
  iya mancajie tanra asseddi-seddinna umma sellengng, pada engka mala jiji sibawa
  takkatoro nenniya pannessai asseddi-seddinna makkutoparo assirupa-rupanna, padamui
  engkanna tau kasiasi\u2019e tettong riseddena tau sogi\u2019e, rakyat\u2019e tettong
  riseddena tau mapparentae, degaga assillaingenna ritu risesena puang Allah Ta\u2019ala,
  roko pada roko, suju pada suju, tudang pada tudang rigau engkana seddi komando iyanaritu
  komandona imangnge. Jaji de\u2019 nasitinaja idi umma sellengnge melo situna-tunai,
  sipeddi-peddiri, nenniya sipandang enteng nasab appongetta seddimi bawang naseng
  nabitta SAW : Umma'' selleng engkae hadere''... Matellunna kajajiang maraja rilalenna
  iyae esso\u2019e, iyanaritu pada engkaki pakabarui perengngeratta risejarana panggulutta
  nabi ibrahim nasa riujinna ripuang Allah ta\u2019ala riwettu risurona gere\u2019I
  ana\u2019na riasengnge ismail. Menuru sejarah panggulutta nabi ibrahim mappulo taunni
  pura nakawingi bainena riasengnge st. sarah nade\u2019gaga ana\u2019na, gangkanna
  masara ininnawani pikkirikiwi makkeda narekko matena matti nigana patterui perjuangakk.
  Nainappa risurona ibrahim ribainena st. sarah sarekkoammengngi napubaine I riyasengnge
  st. hajar nasimata millau doang ri puang Allah ta\u2019ala makkeda : Jamaah ied
  rahimakumullah Aga nariujina teppe\u2019na ripuang Allah ta\u2019ala untuk gere\u2019I
  ana\u2019na iya kamnang napoji\u2019e, sarekkoammangngi nannessa tongeng-tongeng
  tegae ritu napoji, puanna iyarega ana\u2019na naiyya ibrahim saisai tau maraja tau\u2019
  nenniya malamung teppe\u2019na, nade\u2019 natola\u2019I narekko parentana puang
  Allah ta\u2019ala. Riolotenrijajianna ismail pura memengngi nabi ibrahim makkoroba
  1000 kajunna bembe, 300 kajunna tedong, 100 kajunna unta, nainappa makkeda nabi
  ibrahim, naengkai puang Allah ta\u2019ala, bennengnge engka ana\u2019 oroaneku,
  majeppu uwakorobattoi ritu rilaleng naporiyoe puang Allah ta\u2019ala, naiyya tau
  engkae saksikangngi nenniya malaeka\u2019e takkajenne maneng mitai amala\u2019na
  nabi ibrahim, as. Umma'' selleng engkae hadere''... Naiyya riwettu maelo\u2019na
  ibrahim tiwi\u2019I ana\u2019na rionrong aggeresenna napodanni bainena st. hajar
  sarekkuammengngi napappakeiwi ana\u2019na nasaba pakeang kaminang makessin, inappa
  mala piso nenniya tulu\u2019 Riwettu de\u2019napa nagere\u2019I ana\u2019na ibrahim,
  mappasengngi ritu ismail ri ambo\u2019na nasab pappaseng dua tellu, makkeda : Umma''
  selleng engkae hadere''... Aga riwettu purana mappaseng ismail, nappesonana iya
  dua lao ripung Allah ta\u2019ala nenniya napaleu toni ritu ibrahim ana\u2019na rigau
  engkana nabaca \u201cBISMILLAHI ALLAHU AKBAR\u201d naenappa nagere\u2019, naikiya
  teyai makkanre pisoe, ure tea pettu, dara tea mitti, uli tea sape, juku tea malara,
  nasaba elo\u2019na puang Allah ta\u2019ala temmakkanre pisoe nakkeda ismail eh\u2026.ambokku
  aja taitai rupakku nasaba napoleiki tu esse babua nassabari natea makkanre piso\u2019e.
  aga nabettanni pisona ibrahim ribatu\u2019e namapue duana batu\u2019e napakkua tarenna.
  Nakkedana ibrahim ripiso\u2019e : magi mulle puei batu\u2019e, naellonna ismail
  de\u2019 mulle manrei akuasanna puang Allah ta\u2019ala mette\u2019I piso\u2019e
  mappibali makkeda : eh\u2026ibrahim musuroka manrei ellonna ismail nappesangkaika
  puakku. Aga naengkalingana obbi pole ripuang Allah ta\u2019ala : Umma'' selleng
  engkae hadere''... Jaji nasseriki mala akkalarapangeng sininna idi ummana nabitta
  SAW, idi sininna tomatowa malebbikku, alaki contoh rinabi ibrahim napasilennerengngi
  parentana puang Allah ta\u2019ala namuni an\u2019na rela nakorbangkan, apalagi idi
  ummana nabitta SAW. Nasuromi bawang makkoroba sibawa sapi yarega bembe sesuai sibawa
  kemampuatta. Idi sininna makkunraiye, alaki contoh ri st. hajar bainena pakkulutta
  ibrahim de\u2019na halang-halangi lakkainna padupai parentana puang Allah ta\u2019ala
  yakkeppaha nasuromi/napanggesiwi, idi sinina silessurekku pemuda dan pemudi pada
  alaki contoh rinabi ismail namuni alena, jiwana rela nakorbangkan nasaba parentana
  puang Allah ta\u2019ala natenna jampangi sininna engkae mappakabiling piling untuk
  papolei parentana puang Allah ta\u2019ala, nalai pringsip makkeda : n\\nUpeppaha
  nenniya alabappaha risesena tau engkae pasilennerengngi pakkasiwiyang hajji\u2019e
  nakarana puang Allah ta\u2019ala, nenniya teppe simata gangkanna nalulu maneng siaga
  egana rintangan, nasaba napahang madecengngi apaccingeng pole ridosa\u2019e. padatoha
  ana mula jajie riparimmanana indo\u2019na, turu rimakkedanna nabitta.SAW\\nBettuanna
  : nigi-nigi tau menre hajji nade\u2019to nakkeda ada marota, nenniya de\u2019to
  nappapole gau maja\u2019 majeppu massu\u2019ni pole ridosana padatoha apaccingenna
  riwettu rijajiang ri indo\u2019na.\\nBettuanna : Naiyya hajji ritarimae de\u2019gaga
  pamalena sanggadinna suruga pammasena puang Allah ta\u2019ala.\\nBettuana : naiyya
  rupa taue pole manengngi rinabi adam, naiyya nabi adam polei ri tanae nade\u2019
  apallebbireng napunnai bangsa ara\u2019e nenniya bangsa ajangnge nenniya makkuli
  mapute nenniya malotongnge, majeppu kaminag malebbi rikotu mennang iyanaritu mataue
  ripuang Allah ta\u2019ala.\\nBettuanna : eee. Puang tapakkidalekika ana\u2019 saleh,
  yarega ana patuju\\nAga naripakkidallekina nabi ibrahim, ana iya namminasaiyye iyanaritu
  riasengnge ismail. Natemmaka rionaritu nasaba ismail saisai ana matturu riparentae,
  ana marengkalinga ada, ana mancajie cayyana matanna buana atinna. Aroddaningenna
  temmapettu, napede lao esso pede\u2019 matanre pappojinna ri\u2019ana\u2019na nasaba
  saisai ana seddi-seddi.\\nNaiya kiya risesena nabi ibrahim cedde mupa koritu.\\nRiwettu
  narapi\u2019na ismail umuru\u2019na 12 tahun, nabi ibrahim riparingkalinganni sadda
  rilaleng tinrona makkeda eh\u2026\u2026\u2026ibrahim padupani tinja\u2019mu, riwettu
  naengkalingnna iyae saddae, simata mappikkiri\u2019I ibrahim makkedae : parenta
