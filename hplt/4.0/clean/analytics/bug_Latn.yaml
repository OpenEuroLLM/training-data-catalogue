  Mad\u00e9c\u00e9ng pol\u00e9 ri Allataalaro?\\n18Ri laleng Kitta\u2019\u00e9 tarokii
  makkuwa\u00e9w\u00e9, \\\"R\u00e9kko sining tau iya makessingng\u00e9 mawatang toni
  untu\u2019 makkuwa\u00e9w\u00e9, aga tona kajajiyang matu sibawa sining tau madosa\u00e9
  iya d\u00e9\u2019\u00e9 naissengngi Puwangng\u00e9!\\\"\\n19Rimakkuwannanaro, r\u00e9kko
  engka sining tau iya manrasa-rasa\u00e9 nasaba Allataala puw\u00e9loi makkuwaro,
  sitinajai sining tauw\u00e9ro tuwoi sibawa tongeng enrengng\u00e9 mabb\u00e9r\u00e9yangngi
  al\u00e9na lao ri Pappancajinna mennang. Tuli narupaiwi matu jancin-Na.\"", "\"1Nakkeda
  Y\u00e9sus lao ri ana\u2019-ana\u2019 gurun-Na, \\\"Engka s\u00e9ddi tau sugi. Mappunnaiwi
  s\u00e9ddi pakkatenning dowi iya marusu\u2019\u00e9ngngi asugirenna. Iyaro tau sugi\u00e9
  lolongengngi laporang makkeda\u00e9 iyaro pakkatenning dowina nallabowangngi dowina.\\n2Jaji
  naobbini iyaro pakkatenning dowi\u00e9, nakkeda, \u2018Aga iya\u00e9 uw\u00e9ngkalinga\u00e9
  passalemmu? Makkekkuwangng\u00e9, w\u00e9r\u00e9kka laporanna passalenna jama-jamammu
  murusu\u2019i asugirekku. D\u00e9\u2019na naweddikko mancaji pakkatenning dowiku.\u2019\\n3Nappikkiri\u2019na
  iyaro pakkatenning dowi\u00e9, \u2018Aga harusu\u2019 upogau\u2019 makkekkuwangng\u00e9?
  Ma\u00e9loi Puwakku pal\u00e9ssoka. Nad\u00e9\u2019 uwull\u00e9i mabb\u00e9ngkung,
  sibawa masirika mar\u00e9llau-\u00e9llau.\\n4Engka akkalekku; r\u00e9kko ripal\u00e9ssoka,
  harusu\u2019ka mappunnai ma\u00e9ga sellao iya ma\u00e9lo\u00e9 papp\u00e9rumaka
  ri bolana!\u2019\\n5Jaji iyaro pakkatenning dowi\u00e9 naobbini tungke\u2019 tau
  iya makkinrengng\u00e9 ri puwanna. Nakkeda lao ri mammulangng\u00e9, \u2018Siyaga
  inremmu ri puwakku?\u2019\\n6Napp\u00e9bali iyaro tauw\u00e9, \u2018S\u00e9ratu
  b\u00e9mpa minnya\u2019 zaitun.\u2019 Nakkeda iyaro pegawai\u00e9 lao ri tauw\u00e9ro,
  \u2018Iya\u00e9 sure\u2019 inremmu. Tudanno namumapperi-peri mokii: limappulo.\u2019\\n7Nainappa
  makkeda ri tau maduwa\u00e9, \u2018Na iko saudara, siyaga inremmu?\u2019 Napp\u00e9bali
  iyaro tauw\u00e9, \u2018Sisebbu karung gandong.\u2019 Nakkeda iyaro pakkatenning
  dowi\u00e9, \u2018Iya\u00e9 sure\u2019 inremmu. Okini: aruwa ratuna.\u2019\\n8Na
  iyaro ponggawana pegaw\u00e9 pakkatenning dowi d\u00e9\u2019\u00e9 namalempu napojini
  iyaro pegaw\u00e9na nasaba pangkaukenna iya macca\u00e9ro; saba\u2019 sining tolino\u00e9w\u00e9
  lebbi accai matoro\u2019i urusanna mennang naiya sining tau iya tuwo\u00e9 ri laleng
  tajangng\u00e9.\\\"\\n9Nabbicarasi Y\u00e9sus, adan-Na, \\\"Engkalingai! Pak\u00e9i
  asugirenna lino\u00e9w\u00e9 untu\u2019 lolongeng sellao, kuwammengngi riwettu d\u00e9\u2019na
  gaga angke\u2019na asugirenna lino\u00e9, ritarimako matu ri onrong app\u00e9rumang
  mannennungengng\u00e9.\\n10Tau iya weddingng\u00e9 riyatepperi ri laleng gau\u2019-gau\u2019
  iya baiccu\u2019\u00e9, wedding towi riyatepperi ri laleng gau\u2019-gau\u2019 iya
  battowa\u00e9. Iyakiya tau iya d\u00e9\u2019\u00e9 nawedding riyatepperi ri laleng
  gau\u2019-gau\u2019 iya baiccu\u2019\u00e9, d\u00e9\u2019to nawedding riyatepperi
  ri laleng gau\u2019-gau\u2019 battowa\u00e9.\\n11Jaji r\u00e9kko passalenna asugirenna
  lino\u00e9 d\u00e9\u2019na naweddikko riyatepperi, niga ma\u00e9lo paddettangiko
  asugireng bat\u00e9ngng\u00e9?\\n12Sibawa r\u00e9kko passalenna barang nappunnangiy\u00e9
  tau laingng\u00e9, pabuttiwi d\u00e9\u2019 naweddikko riyatepperi, niga ma\u00e9lo
  mp\u00e9r\u00e9kko aga iya mancajiy\u00e9 appunnangemmu?\\n13D\u00e9\u2019 s\u00e9ddi
  tau mull\u00e9i majjama untu\u2019 duwa ponggawa; saba\u2019 lebbi namas\u00e9iwi
  matu s\u00e9ddi\u00e9 naiya laingng\u00e9; iyar\u00e9\u2019ga lebbi matinului matu
  lao ri ponggawa s\u00e9ddi\u00e9 naiya laingng\u00e9. Makkuwatoniro iko. D\u00e9\u2019
  mull\u00e9i majjama untu\u2019 Allataala sibawa untu\u2019 waramparangng\u00e9tto.\\\"\\n14Na\u00e9ngkalingani
  sining tau Farisi\u00e9 iya napowada\u00e9 Y\u00e9sus. Nainappa mennang cawa-cawaiwi,
  saba\u2019 napoji mennang dowi\u00e9.\\n15Iyakiya makkedai Y\u00e9sus lao ri mennang,
  \\\"Ikona ritu tau iya tongengng\u00e9 rita ri yolona tau laingng\u00e9, iyakiya
  naissengngi Allataala lise\u2019 atimmu. Saba\u2019 aga naseng matanr\u00e9 rupa
  tauw\u00e9, naita mariyawai Allataala.\\n16Hukkunna Musa sibawa pappagguruwanna
  nabi-nabi\u00e9, iya manenna tette\u2019i ripajoppa narapi wettunna Yohan\u00e9s
  Paccemm\u00e9. Mappammulai wettu\u00e9ro Kar\u00e9ba Mad\u00e9c\u00e9ng passalenna
  p\u00e9kkugi Allataala mappar\u00e9nta selaku Arung riyabbirittangngi matteru. Nakkuraga
  tauw\u00e9 passai al\u00e9na untu\u2019 mancaji anggotana umma\u2019na Allataala.\\n17Iyakiya
  lebbi gampangngi lennye\u2019 langi\u00e9 sibawa lino\u00e9, naiya s\u00e9ddi\u00e9
  hurupu\u2019 ri laleng Hukkunna Allataala riledda.\\n18Niga massarang bain\u00e9na
  nainappa kawing sibawa makkunrai laingng\u00e9, malawengngi iyaro tauw\u00e9. Sibawa
  tau iya kawingiy\u00e9ngngi makkunrai iya massarangng\u00e9, malaweng towi.\\\"\\n19\\\"Engka
  s\u00e9ddi tau sugi. Pak\u00e9yanna masuli, sibawa masennang atuwo-tuwonna esso-esso.\\n20Ri
  yolona tange\u2019na bolana ripal\u00e9nne\u2019i s\u00e9ddi tau kasiyasi riyasengng\u00e9
  Lazarus. Watakkal\u00e9na pennoi sibawa lettang.\\n21Macinnai lisekiwi babuwana
  sibawa barubbu-barubbu roti iya semp\u00e9\u2019\u00e9 pol\u00e9 ri m\u00e9janna
  tau sugi\u00e9ro. Iyakiya mala asu\u00e9 pol\u00e9i l\u00e9pekiwi iyaro lettanna.\\n22Namat\u00e9na
  iyaro tau kasiyasi\u00e9 naritiwi ri mala\u00e9ka\u2019\u00e9 ri onrong malebbi\u00e9
  ri suruga\u00e9 ri sedd\u00e9na Abraham. Namat\u00e9 tona iyaro tau sugi\u00e9 sibawa
  ritampung.\\n23Namanrasa-rasa senna\u2019na ri linona tau mat\u00e9. Na wettunna
  makkita pol\u00e9 kuwaro lao ri yas\u00e9\u2019, naitani Abraham ri onrong iya mab\u00e9la\u00e9
  sibawa Lazarus engka ri sedd\u00e9na Abraham.\\n24Nagorana iyaro tau sugi\u00e9,
  \u2018Bapa\u2019 Abraham! Amas\u00e9ika. Suroi Lazarus remm\u00e9i jarinna ri laleng
  uwai nainappa lao b\u00e9sa\u2019i lilaku. Manrasa-rasa senna\u2019ka ri lalenna
  api\u00e9w\u00e9!\u2019\\n25Iyakiya mapp\u00e9baliwi Abraham, \u2018Engngerangngi
  ana\u2019ku: sillamp\u00e9 umuru\u2019mu purani mulolongeng maneng iya makessik-kessingng\u00e9,
  na Lazarus lolongengngi iya maja\u00e9. Makkekkuwangng\u00e9 masennangngi kuwa\u00e9
  na iko manrasa-rasa.\\n26Ri lainna\u00e9 ritu, ri pallawangemmu sibawa idi purani
  riy\u00e9bbu s\u00e9ddi balorang battowa, kuwammengngi tau engka\u00e9 kuwa\u00e9
  d\u00e9\u2019 naull\u00e9i lao kuwatu sibawa tau engka\u00e9 kuwatu d\u00e9\u2019
  naull\u00e9i lao kumaiy\u00e9.\u2019\\n27Nakkeda iyaro tau sugi\u00e9, \u2018R\u00e9kko
  makkuwaitu Pa\u2019, uw\u00e9llauwi sibawa masero tasuroi Bapa\u2019 Lazarus lao
  ri bolana ambo\u2019ku.\\n28Engka lima silessurekku kuwaro. Suroi Lazarus par\u00e9ngngerangiwi
  mennang, kuwammengngi aja\u2019 mennang nasemp\u00e9 ri onrong paccallangng\u00e9w\u00e9.\u2019\\n29Napp\u00e9bali
  Abraham, \u2018Naengka mennang nappunnai kitta\u2019-kitta\u2019na Musa sibawa sining
  nabi\u00e9! Leppessanni siya naturusi aga taroki ri laleng sining kitta\u2019\u00e9ro!\u2019\\n30Iyakiya
  mapp\u00e9baliwi iyaro tau sugi\u00e9, \u2018D\u00e9\u2019 nagenne iyaro, Bapa\u2019
  Abraham. Iyakiya r\u00e9kko engka tau mat\u00e9 tuwo paimeng sibawa lao ri mennang,
  toba\u2019i matu mennang pol\u00e9 ri dosa-dosana.\u2019\\n31Iyakiya makkedai Abraham,
  \u2018R\u00e9kko mennang d\u00e9\u2019 nabati-batiwi par\u00e9ntana Musa sibawa
  nabi-nabi\u00e9, tentuni mennang d\u00e9\u2019to namateppe\u2019 matu, namuni engka
  tau mat\u00e9 tuwo paimeng.\u2019\\\"\"", "\"1Massempajanni Arung Salomo, \\\"Oh
  PUWANG, lebbi Mupojiwi monro ri laleng apettangenna ellungng\u00e9.\\n2Upatettongenno
  makkekkuwangng\u00e9 Bola iya magello\u00e9, untu\u2019 onrong Muwonroi mannennungeng.\\\"\\n3Puranana
  massempajang, gilinni arungng\u00e9 lao ri sininna ra\u2019ya\u2019 iya mattengngangng\u00e9
  tettong kuwaro, nainappa m\u00e9llauwi barakka\u2019na Allataala untu\u2019 mennang.\\n4Makkedani,
  \\\"Riyolo purai majjanci PUWANGNGE lao ri ambo\u2019ku Daud makkuwa\u00e9, \u2018Sipongenna
  Utiwi umma\u2019-Ku massu pol\u00e9 ri Mas\u00e9r\u00e9 lettu esso\u00e9w\u00e9,
  ri wanuwanna Isra\u00e9li\u00e9 d\u00e9\u2019 gaga muwi s\u00e9ddi kota iya Upil\u00e9
  mancaji onrong k\u00e9gi harusu ripatettong bola untu\u2019 onrong assompangng\u00e9
  lao ri Iyya, sibawa d\u00e9\u2019to muwi s\u00e9ddi tau iya Upil\u00e9 untu\u2019
  pimpingngi umma\u2019-Ku Isra\u00e9li\u00e9. Iyakiya makkekkuwangng\u00e9 Upil\u00e9i
  Y\u00e9rusal\u00e9m selaku onrong assompang lao ri Iyya. Na iko Daud, Upil\u00e9
  untu\u2019 par\u00e9ntai umma\u2019-Ku!\u2019 Ripojiwi PUWANG Allataalana Isra\u00e9li\u00e9
  iya pura\u00e9 rupaiwi jancin-Naro!\\\"\\n5(6:4)\\n6(6:4)\\n7Namakkeda paimeng Salomo,
  \\\"Ambo\u2019ku Daud pura rancanai untu\u2019 patettong bola onrong assompang lao
  ri PUWANG Allataalana Isra\u00e9li\u00e9.\\n8Iyakiya makkedai PUWANGNGE lao ri al\u00e9na,
  \u2018Iyaro akkattamu makessing.\\n9Iyakiya tenniya iko, sangadinna ana\u2019mu
  ritu patettongngi matu iyaro Bola-Ku!\u2019\\n10Makkekkuwangng\u00e9 purani narupai
  PUWANGNGE jancin-Na. Mancajina\u2019 arunna Isra\u00e9li\u00e9 sull\u00e9iwi ambo\u2019ku,
  napura tona patettongngi bola\u00e9 untu\u2019 assompang lao ri PUWANGNGE, Allataalana
  Isra\u00e9li\u00e9.\\n11Purani upassadiyangeng onrong ri laleng Bolana PUWANG-ng\u00e9ro
  untu\u2019 Petti Assijancingng\u00e9 iya mallise\u2019\u00e9 batu assijancing ri
  yelle\u2019na PUWANGNGE sibawa umma\u2019na Isra\u00e9li\u00e9.\\\"\\n12Purai m\u00e9bbu
  Salomo panggung gessa ri tengnga-tengngana sedd\u00e9na Bolana PUWANGNGE. Lamp\u00e9na
  sibawa sakkana 2,2 m\u00e9t\u00e9r\u00e9, sibawa tanr\u00e9na 1,3 m\u00e9t\u00e9r\u00e9.
  Ri yolona ra\u2019ya\u2019 iya had\u00e9r\u00e9\u2019\u00e9, na\u00e9nr\u00e9kini
  Salomo iyaro panggungng\u00e9, natettong mangolo ri m\u00e9zba\u00e9. Naull\u00e9
  maneng tauw\u00e9 mitai. Nainappa makkaluttu, nanaakkai iya duwa limanna enrengng\u00e9
  pappale\u2019i m\u00e9nr\u00e9 ri langi\u00e9 sibawa massempajang,\\n13(6:12)\\n14\\\"PUWANG
  Allataalana Isra\u00e9li\u00e9! Ri langi\u00e9 iyar\u00e9\u2019ga ri lino\u00e9
  d\u00e9\u2019gaga pada-padam-Mu! Murupaiwi jancim-Mu sibawa mappaitangngi pammas\u00e9mu
  lao ri umma\u2019-Mu iya matinulu\u00e9 nenniya mapato\u00e9 sibawa sukku atinna
  lao ri Iko.\\n15Purani murupai jancim-Mu lao ri ambo\u2019ku Daud. Aga iya Muwajjanciyangng\u00e9ro
  purani Mupogau\u2019 iya\u00e9 esso\u00e9.\\n16Pura tono majjanci lao ri ambo\u2019ku
  makkeda\u00e9 r\u00e9kko tonget-tongengngi wija-wijanna mapato lao ri hukkum-Mu
  pada-pada al\u00e9na, na untu\u2019 mannennungeng s\u00e9ddi pol\u00e9 ri wija-wijanna
  mappar\u00e9ntai matu selaku arung ri Isra\u00e9li\u00e9. Makkekkuwangng\u00e9,
  oh PUWANG Allataalana Isra\u00e9li\u00e9, rupai maneng towi iya pura\u00e9 Muwajjanciyang
  lao ri ambo\u2019ku Daud, atam-Muro.\\n17(6:16)\\n18Iyakiya, oh Allataala, tongekkoga
  Ma\u00e9lo monro ri lino\u00e9w\u00e9 ri yelle\u2019na tolino\u00e9? Muwi sininna
  langi\u00e9 d\u00e9\u2019to nagenne lowanna untu\u2019 al\u00e9-Mu, apalagi bola
  assompang iya upatettongng\u00e9w\u00e9!\\n19Oh PUWANG, Allataala, iyya atam-Mu!
  Iyakiya tennapodo \u00e9ngkalingai sempajakku, sibawa tarimai par\u00e9llaukku.\\n20Tennapodo
  esso wenni Mulinrungiwi bola\u00e9w\u00e9 iya pura\u00e9 Mupil\u00e9 selaku onrong
  assompang lao ri Iko. Tennapodo pol\u00e9 ri onrong Muwonroiy\u00e9 ri suruga\u00e9
  Muw\u00e9ngkalingai sibawa maddampengekka enrengng\u00e9 umma Isra\u00e9li\u00e9,
  umma\u2019-Muro, r\u00e9kko mangoloki ri bola\u00e9w\u00e9 sibawa massempajang lao
  ri Iko.\\n21(6:20)\\n22R\u00e9kko s\u00e9ddi\u00e9 tau ritenre pasala lao ri tau
  laingng\u00e9 naritiwi ri m\u00e9zba-Mu ri laleng Bola-Mu\u00e9 untu\u2019 mattanro
  makkeda\u00e9 d\u00e9\u2019 napasala,\\n23oh PUWANG, sitinajako m\u00e9ngkalingai
  ri suruga\u00e9 sibawa pettuiwi parakarana ata-atam-Mu\u00e9. Hukkungngi iya pasala\u00e9
  sibawa paleppe\u2019i iya d\u00e9\u2019\u00e9 napasala.\\n24R\u00e9kko umma\u2019-Mu
  Isra\u00e9li\u00e9 ricaui risining balinna nasaba madosai mennang, nainappa massesse
  kal\u00e9 sibawa pakalebbisi-Ko selaku PUWANG, nanapol\u00e9 ri Bola-Mu\u00e9 enrengng\u00e9
  massempajang m\u00e9llau addampeng ri Iko,\\n25tennapodo Muw\u00e9ngkalingai mennang
  ri suruga\u00e9. Tennapodo Muwaddampengengngi dosana umma\u2019-Mu\u00e9, sibawa
  tiwii mennang lisu ri wanuwa iya pura\u00e9 Muwabb\u00e9r\u00e9yang lao ri mennang
  sibawa lao ri toriyolona.\\n26R\u00e9kko madosai umma\u2019-Mu ri iko namuhukkungngi
  mennang sibawa d\u00e9\u2019 mupateppai bosi\u00e9, nanatoba\u2019 mennang pol\u00e9
  ri dosana sibawa pakalebbi-Ko selaku PUWANG, namangolo ri Bola-Mu\u00e9 enrengng\u00e9
  massempajang ri Iko,\\n27oh PUWANG, ri suruga\u00e9, \u00e9ngkalingai mennang. Sibawa
  addampengengngi dosana ata-atam-Mu umma Isra\u00e9li\u00e9. Paggurui mennang pogau\u2019i
  aga iya tongengng\u00e9. Purairo, oh PUWANG, pateppai bosi\u00e9 ri wanuwam-Mu\u00e9,
  wanuwa iya Muwabb\u00e9r\u00e9yangng\u00e9 lao ri umma\u2019-Mu untu\u2019 mancaji
  appunnangenna mannennungeng.\\n28R\u00e9kko nakennai akkad\u00e9reng iyar\u00e9\u2019ga
  sai iya\u00e9 wanuwa\u00e9, iyar\u00e9\u2019ga tanet-tanengng\u00e9 nasolangiwi
  anging pella, ule\u2019 iyar\u00e9\u2019ga incal\u00e9, iyar\u00e9\u2019ga r\u00e9kko
  umma\u2019-Mu rigasai ri bali\u00e9, iyar\u00e9\u2019ga nakennai lasa,\\n29tennapodo
  Muw\u00e9ngkalingai sempajanna mennang. R\u00e9kko pol\u00e9 ri yelle\u2019na umma\u2019-Mu
  Isra\u00e9li\u00e9 iya massempajangng\u00e9 sibawa masussa atinna lao ri Iko nanapappale\u2019
  towi limanna mattuju ri Bola-Mu\u00e9,\\n30tennapodo Iko ri laleng onrom-Mu ri suruga\u00e9
  m\u00e9ngkalingai enrengng\u00e9 maddampengengngi mennang. Banna Iko missengngi
  lise\u2019 atinna tolino\u00e9. Rimakkuwannanaro gaukenni tungke tauw\u00e9 situru
  sining pangkaukenna,\\n31kuwammengngi natuli m\u00e9tau sibawa matinulu umma\u2019-Mu
  lao ri Iko ri wettu monrona mennang ri wanuwa iya Muwabb\u00e9r\u00e9yangng\u00e9
  lao ri toriyolota.\\n32R\u00e9kko s\u00e9ddi\u00e9 tau laing ri wanuwa iya mab\u00e9la\u00e9
  m\u00e9ngkalingai passalenna arajam-Mu sibawa awatangem-Mu, Namutuli sadiya untu\u2019
  mattulung, nanalao ri Bola-Mu\u00e9 untu\u2019 massempajang ri Iko,\\n33tennapodo
  pol\u00e9 ri onrom-Mu ri suruga\u00e9 Muw\u00e9ngkalingai sempajanna sibawa tarimai
  par\u00e9llaunna. Nanallalengiwi sininna bangsa\u00e9 ri sininna lino\u00e9 missek-Ko
  sibawa mapatoi-Ko pada-pada umma\u2019-Mu Isra\u00e9li\u00e9. Naissengngi matu makkeda\u00e9
  bola iya upatettongng\u00e9 ritu onrong untu\u2019 massompa ri Iko.\\n34R\u00e9kko
  Mupar\u00e9ntangngi umma\u2019-Mu untu\u2019 lao mammusu m\u00e9wai bali\u00e9,
  nainappa muwi k\u00e9gi mennang monro, namangolo mennang ri kota Mupil\u00e9w\u00e9
  sibawa massempajang mattuju ri bola\u00e9w\u00e9 iya pura\u00e9 upatettongek-Ko,\\n35tennapodo
  ri suruga\u00e9 Muw\u00e9ngkalingai sempajanna mennanro, sibawa mp\u00e9r\u00e9ngngi
  apakalang.\\n36R\u00e9kko madosai umma\u2019-Mu lao ri Iko \u2014 sitongenna d\u00e9\u2019
  gaga s\u00e9ddi tau iya d\u00e9\u2019\u00e9 namadosa \u2014 nainappa nasaba cai-Mu,
  Muleppessangngi mennang ricau ri bali\u00e9 sibawa ritiwi selaku tawangeng lao ri
  s\u00e9uwa\u00e9 wanuwa iya mab\u00e9la\u00e9 iyar\u00e9\u2019ga macaw\u00e9\u2019\u00e9,\\n37tennapodo
  Muw\u00e9ngkalingai sempajanna mennang. R\u00e9kko ri wanuwa\u00e9ro nasalaiwi mennang
  dosa-dosana, namassempajang lao ri Iko sibawa mangakui towi makkeda\u00e9 madosani
  sibawa pogau\u2019i maja\u00e9, \u00e9ngkalingai sempajanna mennang, oh PUWANG.\\n38R\u00e9kko
  ri wanuwa\u00e9ro malempui mennang sibawa mattonget-tongengngi salaiwi dosa-dosana,
  sibawa massempajang lao ri Iko namangoloto ri wanuwa\u00e9w\u00e9 iya Muwabb\u00e9r\u00e9yangng\u00e9
  lao ri toriyolota, mattuju ri kota Mupil\u00e9 sibawa bola assompang iya pura\u00e9
  upatettongek-Ko\u00e9,\\n39na pol\u00e9 ri onrom-Mu ri suruga\u00e9 sitinaja-Ko
  m\u00e9ngkalingai sempajanna sibawa mamas\u00e9iwi mennang. Addampengenni sininna
  dosana umma\u2019mu.\\n40Makkekkuwangng\u00e9, oh Allataala, jampangiki sibawa \u00e9ngkalingai
  sempajang iya ripalettu\u2019\u00e9 lao ri Iko pol\u00e9 ri onrongng\u00e9w\u00e9.\\n41Oto\u2019no
  makkekkuwangng\u00e9, oh PUWANG Allataala! Nasibawang Petti Assijancingng\u00e9
  iya pulambangng\u00e9ngngi akuwasam-Muro sitinajako Muttamakiwi Bola-Mu\u00e9 sibawa
  monro kuwa\u00e9 untu\u2019 mannennungeng. Barakkakiwi sininna jama-jamanna imangng\u00e9,
  sibawa tennapodo sininna umma\u2019-Mu mariyo-riyoi nasaba makessik-Ko lao ri mennang.\\n42PUWANG
  Allataala, aja\u2019 Musamp\u00e9yangngi arung iya pura\u00e9 Mupil\u00e9. Engngerangngi
  pammas\u00e9-Mu lao ri Daud atam-Mu.\\\"\"", "\"Tak heran jika dialihbahasakan sangat
  susah dan menghilangkan makna sebenarnya. Berikut sms dan kata-kata selamat lebaran
  Idul Fitri 1433H/2012M versi bahasa bugis:\\nUsalaini esso mapaccing, esso sipakacinnong
  ati, esso sipakalebbi na sipakario ininnawa madeceng, esso sipakatau. Mamuare, pada
  naleteiki\u2019 pammase Puang Allahu Ta\u2019ala. Napannennungngi deceng\\nAtan.
  Na lettu ri esso rimunri na. Taddampengekka\u2019 sininna ada nennia gau\u2019 pura
  lalo-e, makkua`toparo maddimunri-e. Amiin, yaa Rabbal \u2018Aalaiin. Salamaki mallepe\u2019
  fittarah 1433H. Tabe\u2019 pole ri silessurengta Wati\\nRicapana iya uleng`Ramalan`nge,
  engkaka mai pole sibawa ati macinnong maraja akatta madampeng sininna werekadae
  sibawa, pangkaukeng tessi tinajae namuarega Ri alleppereng fittaraE, pada namaseki
  Pu Puang Allahu Ta\u2019ala selamaki matti rilino enrenge ri ahera. Amin. Tabe\u2019
  pole ri sappota Amir\\nSADDA Mattaro ada,ADA Mattaro Gau,\\nGAU Mattaro Sengereng..Oni
  manu teppinra,\\nMaddampeng Temmapettu,Assisumpuloloang Temmalilu,Iyyana ri Uleng
  Syawalengge,pada Tusipakarajangeng Dampeng,Addampeng Maraja lao ri idi Maneng,Natosirampe
  Madeceng,to Sisseng Nasipuppureng Lino.alama\u2019ki riesso alleppereng fittaraE.
  Tabe\u2019 pole ri Ana''Ta Suandi.\"", "\"1Makkedai PUWANGNGE, \\\"Lao manenno mai
  iko iya madekka\u00e9, \u00e9nunno, tassadiyai uwai. Pol\u00e9no iko iya d\u00e9\u2019\u00e9
  nappunnai dowi, tarimani gandongng\u00e9 temmakkamaja, sibawa manr\u00e9no! Anggoro
  sibawa susu\u00e9 tassadiyai, tarimai sibawa cuma-cuma.\\n2Untu\u2019 aga melli
  s\u00e9uwa\u00e9 iya d\u00e9\u2019\u00e9 namapp\u00e9sennang, sibawa majjama untu\u2019
  aga iya d\u00e9\u2019\u00e9 napawessori? Turusiwi par\u00e9nta-Ku, namuwanr\u00e9i
  matu iya makessingng\u00e9, sibawa p\u00e9neddingiwi patala iya malunra\u2019\u00e9.\\n3Engkalingai,
