sample: '["\"Intro: Am Dm E Am F E Dm D Bm E Am Dm Tapikkiriki daeng G C Aga sitongengna
  saba''na F Dm Mutunru macecca rialeku E Muwillau assarangengnge #) Am Dm Musalaina''
  daeng G C Liwe'' peddie mutaroe F Dm Tomatoatta'' nassabari E Gau''ta makkasolang
  ati Reff: Am Dm Engka ga cedde'' sengerekku'' G C Wedding parewe''i atitta'' F Dm
  Ta''giling maelo mappideceng E Am Nasaba'' umaddennuang mopa rialeta Am Dm Tapalabe''ka
  marellau G C Ise'' ati marilalengta F Dm Aja taturusi adanna E Am Pajajiammu tau
  maceccae Musik: Am A# Am Dm E Am Dm C E Am ==Kembali ke #), Reff)\"", "\"1Y\u00e9sus
  rijajiyang ri kota B\u00e9tl\u00e9h\u00e9m ri wanuwa Yud\u00e9a; ri wettu appar\u00e9ntanna
  Arung H\u00e9rod\u00e9s. Iyaro wettu\u00e9 siyagangngar\u00e9 ahli w\u00e9ttowing
  pol\u00e9 alau, pol\u00e9i ri Y\u00e9rusal\u00e9m.\\n2Makkutanai mennang k\u00e9gi-k\u00e9gi,
  \\\"K\u00e9gai jaji iyaro ana\u2019\u00e9, iya jajiy\u00e9 untu\u2019 mancaji arunna
  tau Yahudi\u00e9? Riitai w\u00e9ttowin-Na mompo ri sedd\u00e9 alau, na engkaki pol\u00e9
  ma\u00e9lo sompai Al\u00e9na.\\\"\\n3Wettunna na\u00e9ngkalinga Arung H\u00e9rod\u00e9s
  iyaro, tass\u00e9leng senna\u2019ni, makkuwatoro sininna tauw\u00e9 ri Y\u00e9rusal\u00e9m.\\n4Nasuroni
  sininna kapala imangng\u00e9 sibawa guru-guru agamana bangsa Yahudi\u00e9 pol\u00e9
  maddeppungeng. Nainappa makkutana ri mennang, \\\"K\u00e9gai ma\u00e9lo jaji Arung
  iya najjanciyangng\u00e9 Allataala?\\\"\\n5Napp\u00e9bali mennang, \\\"Ri kota B\u00e9tl\u00e9h\u00e9m
  ri wanuwa Yud\u00e9a. Nasaba makkuwaniy\u00e9 naoki nabi\u00e9,\\n6\u2018Iko B\u00e9tl\u00e9h\u00e9m,
  ri wanuwa Y\u00e9huda, sitonget-tongenna tenniyako kaminang baiccu ri yelle\u2019na
  kota-kota mapongng\u00e9 ri Y\u00e9huda. Nasaba pol\u00e9 ri iko pol\u00e9i matu
  s\u00e9ddi pamimping iya pimpingng\u00e9ngngi umma\u2019-Ku Isra\u00e9li\u00e9.\u2019\\\"\\n7Puranana
  nalolongeng pappakatajangng\u00e9ro, naobbini H\u00e9rod\u00e9s iyaro ahli w\u00e9ttowing
  pol\u00e9 alau\u00e9 mammekko-mekko. Nainappa makkutana ri mennang, siyaganna tongeng
  nappammula paita iyaro w\u00e9ttowingng\u00e9.\\n8Purairo nasuroni mennang lao ri
  B\u00e9tl\u00e9h\u00e9m sibawa pasengng\u00e9w\u00e9, \\\"Laono musappai sibawa
  mad\u00e9c\u00e9d-d\u00e9c\u00e9ng passalenna Ana\u2019\u00e9ro. Nar\u00e9kko muruntu\u2019ni,
  paissengika, kuwammengngi ulaoto sompai.\\\"\\n9Nalaona mennang. Ri tengnga laleng,
  w\u00e9ttowing iya naita\u00e9 mennang riyolo ri sedd\u00e9 alau, paitasi paimeng.
  Temmakana senna\u2019na mennang mitai iyaro w\u00e9ttowingng\u00e9 poddiyoloiwi
  mennang, nainappa mapp\u00e9sau ri yas\u00e9\u2019na onronna iyaro Ana\u2019\u00e9.\\n10(2:9)\\n11Muttama\u2019ni
  mennang ri laleng bola\u00e9ro nanaitai iyaro Ana\u2019\u00e9 sibawa Maria, indo\u2019-Na.
  Suju\u2019ni mennang nanasompai iyaro Ana\u2019\u00e9, nainappa natimpa onrong waramparanna,
  nanakkasuwiyangengngi lao ri ana\u2019\u00e9ro ulaweng, kamennyang, sibawa mur.\\n12Nappar\u00e9ngngerangenni
  Allataala lao ri mennang ri laleng nippi kuwammengngi aja\u2019 nalisu ri H\u00e9rod\u00e9s.
  Jaji lisuni mennang molai laleng laingng\u00e9.\\n13Joppanana sining ahli w\u00e9ttowingng\u00e9ro,
  nappaitanni al\u00e9na mala\u00e9ka\u2019na Puwangng\u00e9 lao ri Yusuf ri laleng
  nippi. Makkedai iyaro mala\u00e9ka\u2019\u00e9, \\\"Engka akkattana H\u00e9rod\u00e9s
  sappai iyaro Ana\u2019\u00e9 untu\u2019 mpunoi. Rimakkuwannanaro oto\u2019no, tiwii
  iyaro Ana\u2019\u00e9 sibawa indo\u2019-Na manyingkiri\u2019 ri Mas\u00e9r\u00e9\u2019.
  Onrono kuwaro narapi mabbicarasi-Ka lao ri iko.\\\"\\n14Moto\u2019ni Yusuf, nainappa
  iyatoro wenni\u00e9 natiwii iyaro Ana\u2019\u00e9 sibawa indo\u2019-Na manyingkiri\u2019
  ri Mas\u00e9r\u00e9\u2019.\\n15Monroni kuwaro mennang narapi mat\u00e9 H\u00e9rod\u00e9s.
  Makkuwaniro nakajajiyang aga napowada Puwangng\u00e9 naolai nabin-Na, makkuwa\u00e9,
  \\\"Uwobbii Ana\u2019-Ku pol\u00e9 ri Mas\u00e9r\u00e9\u2019.\\\"\\n16Wettunna naisseng
  H\u00e9rod\u00e9s makkeda\u00e9 ribell\u00e9i ri ahli w\u00e9ttowing pol\u00e9 alau\u00e9ro,
  macai senna\u2019ni. Nainappa nappar\u00e9ntang untu\u2019 mpuno manengngi ana\u2019
  worowan\u00e9 ri B\u00e9tl\u00e9h\u00e9m sibawa ri sedd\u00e9na iya makk\u00e9umuru
  duwattaungng\u00e9 liyawa. Sicoco\u2019i iyaro sibawa pappakatajang iya nalolongengng\u00e9
  pol\u00e9 risining ahli w\u00e9ttowingng\u00e9ro, passalenna wettunna paita iyaro
  w\u00e9ttowingng\u00e9.\\n17Makkuwaniro kajajiyang aga pura napowada Nabi Y\u00e9r\u00e9mia,
  iyanaritu,\\n18\\\"Riy\u00e9ngkalingai sadda mpatingng\u00e9 ri Rama sadda maddararing
  sibawa teri. Rah\u00e9l mpatingiwi ana\u2019-ana\u2019na; d\u00e9\u2019 nama\u00e9lo
  risal\u00e9wori saba\u2019 d\u00e9\u2019ni mennang.\\\"\\n19Mat\u00e9nana H\u00e9rod\u00e9s,
  wettunna engka mupi Yusuf ri Mas\u00e9r\u00e9\u2019, nappaitanni al\u00e9na mala\u00e9ka\u2019na
  Puwangng\u00e9 ri Yusuf ri laleng nippi.\\n20Makkedai iyaro mala\u00e9ka\u2019\u00e9,
  \\\"Sining tau iya ma\u00e9lo\u00e9 mpunoi iyaro Ana\u2019\u00e9 mat\u00e9ni. Rimakkuwannanaro
  oto\u2019no, alai iyaro Ana\u2019\u00e9 sibawa indo\u2019-Na, namulisu ri Isra\u00e9l.\\\"\\n21Moto\u2019ni
  Yusuf, nanatiwii iyaro Ana\u2019\u00e9 sibawa Maria lisu ri Isra\u00e9l.\\n22Iyakiya
  ri munri na\u00e9ngkalingai Yusuf makkeda\u00e9 Ark\u00e9laus, ana\u2019na H\u00e9rod\u00e9s
  sull\u00e9iwi ambo\u2019na mancaji arunna wanuwa Yud\u00e9a. Jaji m\u00e9tauni Yusuf
  lao kuwaro. Puranana lolongessi pappaitana Puwangng\u00e9 ri laleng nippi, laoni
  ri da\u00e9ra Galil\u00e9a.\\n23Monroni kuwaro ri kota riyasengng\u00e9 Nazar\u00e9t.
  Namakkuwannanaro kajajiyanni aga iya napowada\u00e9 nabi-nabi\u00e9 passalenna iyaro
  Ana\u2019\u00e9: \\\"Riyasengngi matu Tau Nazar\u00e9t.\\\"\"", "\"1Saudara-saudara
  umma\u2019na Allataala ri Kolos\u00e9 iya matinulu\u00e9 mass\u00e9ddi sibawa Kristus!
  Selaku rasulna Kristus Y\u00e9sus, \u2014 iya nakka\u00e9 Allataala \u2014 iyya,
  Paulus, silaong Saudarata Timotius, mamm\u00e9nasa tennapodo Allataala Ambo\u2019ta
  mabb\u00e9r\u00e9 barakka sibawa asal\u00e9wangeng lao ri iko.\\n2(1:1)\\n3Purani
  riy\u00e9ngkalinga makkeda\u00e9 mateppe\u2019ko lao ri Y\u00e9sus Kristus sibawa
  muwamas\u00e9i manenna umma\u2019na Allataala. Iyanaro saba\u2019na wettutta massempajangekko,
  tuli mattarima kasi\u2019ki lao ri Allataala, Ambo\u2019na Puwatta Y\u00e9sus Kristus.\\n4(1:3)\\n5Mateppe\u2019ko
  sibawa mamas\u00e9ko, saba\u2019 mamm\u00e9nasako ri aga iya napassadiya\u00e9 Allataala
  ri suruga\u00e9 untu\u2019 iko. Purani muw\u00e9ngkalinga passalenna gau\u2019\u00e9ro,
  wettunna Kar\u00e9ba Mad\u00e9c\u00e9ng tongengng\u00e9 iya pol\u00e9 ri Allataala
  ripalettu lao ri iko.\\n6Iyaro kar\u00e9ba pol\u00e9 ri Allataala mallebbanni lao
  ri sininna lino\u00e9 sibawa atuwonna tauw\u00e9 matterui ribarakkaki ri kar\u00e9ba\u00e9ro,
  pada-pada muto atuwommu ribarakkakiwi mappammulai wettunna muw\u00e9ngkalinga passalenna
  pammas\u00e9na Allataala sibawa tonget-tongengngi nattemmekinna.\\n7Iyaro gau\u2019\u00e9
  napalettu\u2019i Epafras lao ri Saudara, sellao iya riyamas\u00e9iy\u00e9. Al\u00e9na
  ritu pajjamana Kristus iya matinulu\u00e9 majjama untu\u2019 apentingetta.\\n8Pol\u00e9
  ri al\u00e9nai ritu riy\u00e9ngkalingai makkeda\u00e9 nasibawang Rohna Allataala
  muwull\u00e9i siyamas\u00e9yang.\\n9Iyanaro saba\u2019na natuli massempajakki untu\u2019
  iko sipongenna riy\u00e9ngkalinga passalemmu. Riy\u00e9llauwi ri Allataala kuwammengngi
  Rohna Allataala mp\u00e9r\u00e9kko apanr\u00e9ng sibawa papp\u00e9jeppu angkanna
  muwisseng sibawa sukku aga napuw\u00e9lo Allataala.\\n10Nanallalengiwi muwull\u00e9i
  tuwo situru \u00e9lona Allataala, sibawa tuli p\u00e9sennangiwi atin-Na, angkanna
  ri laleng sininna s\u00e9uwa-s\u00e9uwa\u00e9 muwull\u00e9i powass\u00e9l\u00e9\u2019
  gau\u2019-gau\u2019 iya makessingng\u00e9. Sibawa pangissengemmu passalenna Allataala
  tattamba towi matu.\\n11Tennapodo nasibawang akuwasang pol\u00e9 ri Allataala iya
  maraja\u00e9, rip\u00e9watangiko angkanna muwull\u00e9i manrasa-rasaiwi sini-sininna\u00e9
  sibawa sabbara enrengng\u00e9 masennang ati\\n12kuwa\u00e9ttopa mattarima kasi lao
  ri Ambo\u2019\u00e9. Saba\u2019 Ambo\u2019\u00e9 ritu m\u00e9bbuko sitinaja tarimai
  aga iya pura\u00e9 napassadiya Allataala lao ri umma\u2019-Na sibawa akkarungen-Na
  iya matajangng\u00e9.\\n13Puraki napaleppe\u2019 pol\u00e9 ri akuwasanna pettangng\u00e9
  sibawa napal\u00e9tt\u00e9\u2019ki ri laleng akkarungenna Ana\u2019-Na iya Namas\u00e9iy\u00e9.\\n14Nasaba
  Ana\u2019-Naro naripaleppe\u2019ki; bettuwanna dosa-dosata riyaddampengenni.\\n15Kristus
  iyanaritu gambara\u2019na Allataala iya manessa\u00e9 iya d\u00e9\u2019\u00e9 napaita;
  Kristus iyanaritu ana\u2019 iya macowa\u00e9, lebbi pentingngi naiya sininna ripancajiy\u00e9.\\n16Saba\u2019
  naolai Al\u00e9na, Allataala pancajiwi sininna s\u00e9uwa-s\u00e9uwa\u00e9 ri suruga\u00e9
  sibawa ri yas\u00e9\u2019na tana\u00e9, sininna iya paita\u00e9 sibawa d\u00e9\u2019\u00e9
  napaita, muttama toni sininna roh iya makuwasa\u00e9 sibawa mappar\u00e9nta\u00e9.
  Sininna alangng\u00e9w\u00e9 ripancajiwi naolai Kristus sibawa untu\u2019 Kristus.\\n17Riwettu
  d\u00e9\u2019napa naengka s\u00e9uwa-s\u00e9uwa\u00e9, engka m\u00e9menni Kristus.
  Sibawa nasaba Al\u00e9nato ritu nasininna s\u00e9uwa-s\u00e9uwa\u00e9 engkai ri
  onronna tungke\u2019-tungke\u2019.\\n18Al\u00e9na ritu kapalana tubunna, iyanaritu
  jema\u2019\u00e9, nasaba Al\u00e9na ritu assalenna atuwonna jema\u2019\u00e9ro.
  Al\u00e9na ritu ana\u2019 macowa, iya bunge\u2019-bunge\u2019\u00e9 ripatuwo paimeng
  pol\u00e9 ri amat\u00e9ngng\u00e9, kuwammengngi na Al\u00e9na bawang iya mancaji
  kaminang pentingng\u00e9 pol\u00e9 ri sininna s\u00e9uwa-s\u00e9uwa\u00e9.\\n19Al\u00e9na
  Allataala ritu puw\u00e9loi kuwammengngi sininna s\u00e9uwa-s\u00e9uwa\u00e9 iya
  engka\u00e9 ri Al\u00e9na Allataala, engka towi sibawa sukku ri Al\u00e9na Ana\u2019-Na.\\n20Sibawa
  naola towi iyaro Ana\u2019\u00e9 Allataala pettuiwi sininna s\u00e9uwa-s\u00e9uwa\u00e9
  nasimad\u00e9c\u00e9ngeng paimeng sibawa Al\u00e9na \u2014 muwi iya engka\u00e9
  ri lino\u00e9 iyar\u00e9\u2019ga iya engka\u00e9 ri suruga\u00e9. Napogau\u2019i
  Allataala iyaro naolai amat\u00e9nna Ana\u2019-Na ri aju salli\u00e9.\\n21Riyolo
  mab\u00e9lako pol\u00e9 ri Allataala. Mumusui nasaba amp\u00e9-amp\u00e9mu sibawa
  pikkirammu majai.\\n22Iyakiya makkekkuwangng\u00e9, ri laleng amat\u00e9nna Ana\u2019-Na,
  Allataala m\u00e9bbui assisumpungemmu sibawa Al\u00e9na simad\u00e9c\u00e9ngeng
  paimeng. Nasibawang cara\u00e9ro naull\u00e9i tiwiko mangolo ri Allataala ri laleng
  keadaang mapaccing, tul\u00e9ng sibawa d\u00e9\u2019 cellana.\\n23Iyakiya tentu
  harusu\u2019ko tette\u2019 matinulu mateppe\u2019 sibawa tettong masse ri atepperemmu.
  Aja\u2019 narapii muleppessangngi amm\u00e9nasang iya pura\u00e9 riw\u00e9r\u00e9kko
  wettunna mutarima Kar\u00e9ba Mad\u00e9c\u00e9ng pol\u00e9 ri Allataala. Iyaro kar\u00e9ba\u00e9
  purani riyabbirittang lao ri tungke\u2019 tau ri sininna lino\u00e9. Na untu\u2019
  iyanaro iyya, Paulus, namancaji pattumani.\\n24Makkekkuwangng\u00e9 mamm\u00e9nasaka
  manrasa-rasa untu\u2019 apentingemmu. Nasaba anrasa-rasang watakkal\u00e9ku, upaggenne\u2019i
  aga iya harusu\u2019\u00e9 nanrasa-rasai Kristus untu\u2019 jema\u2019-Na, iyanaritu
  tubun-Na.\\n25Allataala suroka mancaji pattumaninna jema\u2019-Na untu\u2019 apentingemmu.
  Harusu\u2019ka palettu\u2019i biritta pol\u00e9 ri Allataala, iya manenna;\\n26iyanaritu
  biritta iya maddatu-datu\u00e9 taung labe\u2019\u00e9 rirahasiyakang ri Allataala
  lao ri sininna tauw\u00e9, iyakiya makkekkuwangng\u00e9 ripannessai lao ri umma\u2019-Na.\\n27Lao
  ri umma\u2019-Naro ma\u00e9loi Allataala pannessai p\u00e9kkugi kessinna sibawa
  rajanna rahasiya-Naro untu\u2019 sininna rupa tauw\u00e9. Iyaro rahasiya\u00e9 iyanaritu:
  Engkai Kristus ri laleng al\u00e9mu, bettuwanna maccow\u00e9ko matu p\u00e9neddingiwi
  arajanna Allataala.\\n28Kristus ritu iya riyabbirittangng\u00e9 lao ri tungke\u2019
  tau. Ripar\u00e9ngngerangiwi sibawa ripagguru manengngi mennang sibawa sininna apanr\u00e9ngng\u00e9.
  Akkattata iyanaritu kuwammengngi na tungke\u2019 tau weddingngi ritiwi lao ri Allataala,
  selaku tau iya d\u00e9wasa\u00e9 ri laleng gau\u2019-gau\u2019 rohani\u00e9, nasaba
  mass\u00e9ddini sibawa Kristus.\\n29Untu\u2019 lettu ri gau\u2019\u00e9ro majjama
  ladd\u00e9\u2019ka. Uwakkull\u00e9yangngi sibawa sininna awatangekku iya nabb\u00e9r\u00e9yangng\u00e9
  Kristus lao ri iyya iya majjama\u00e9 ri laleng al\u00e9ku sibawa penno akuwasang.\"",
  "\"BARRU (wartamerdeka.info) - Berawal dari diskusi ringan di WAG Humas Barru yang
  membahas soal dinamika Barru hari itu berlangsung santai., tiba-tiba topiknya beralih
  ke falsafah bugis. Ini berlangsung berjam-jam yang dimulai sekira pukul 21.00 wita,
  Selasa (15/2/2022).\\nNasionalisme yang tinggi dari Insan Pers Barru yang selama
  ini menjadi perekat bangsa dan diserap oleh publik nasional, melalui rilis media
  maupun penyebaran informasi dengan beragam metode menggunakan bahasa Indonesia yang
  baik dan benar.\\nNamun, sebagai generasi Bugis-Makassar yang juga hidup di Negeri
  La Galigo tempat kelahiran I Colliq Pujie, Arung Pancana Toa, Sang legenda besar
  literasi dunia, kerinduan menuliskan Sastra Bugis, menjadi menggebu-gebu jelang
  Hari Jadi Barru Ke-62.\\nSegenap Insan Pers Barru bersama Bidang Humas pun berbalas
  sastra Bugis di WA Grup Humas dan Wartawan Pemda, yang dirangkum sebagai bingkisan
  kepada publik untuk mengingat pesona sastra Bugis, Rabu (16/2/2022).\\nBerikut narasi
  Bugis Bijak yang dihimpun atas saling berbalas pesan dari Insan Pers Pemda Barru
  bersama Bidang Humas, Informasi dan Komunikasi Publik Dinas Kominfo Barru.\\nWennang
  pute mappesona ri nyila, mammenasa bali'' sipuppureng.\\nTemmasiri kajompie tania
  taro melle naiyya makkalu.\\nAja mumae''lo nabe''tta taue'' makkalla '' ricappa''na
  lete''ngnge.\\nOmpoi naengka, lennyei nallajang.\\nNarekko baja sangadie na tessimellereng,
  rampeka golla, na urampeki kaluku.\\nDuammi riala sappo, Unganna panasae, belo kanukue,
  mangkangngulung ri bulue, massulappe ri petaue.\\nIya teppaja usappa, pacolli loloengi
  aju marakkoe.\\nPolo poppang, polo Panni pettupi mabberung perunge, umalimbang rimaje.\\nMaccai
  na malempu, Paulle watakkalepi, Waranipi namagetteng, Ke\u2019nawa nawapi, Napusiri\u2019l
  alena, nasiri toi padanna rupatau, Namitau masiripi dewata sewwae.\\nLimai uwangenna
  riallolongengi deceng, sewwanna, pakatunai alemu risilasannae,\\nmaduanna, saroko
  maserisilasannae,\\nmatellunna, makkareso patujue,\\nmaeppa\u2019na, moloie roppo
  roppo narawe\u2019, malimanna molae laleng namatike\u2019 nappa sanre\u2019 ri Puang
  Sewwa''e\\nSenge''ka simata jarung,\\nKubali senge'' tokki'',\\nSipuppureng lino.\\nAla
  maddampe rampe to mabelae, tenna ri yattanna Maddo.\\nIninnawa mitu denre sisappa,
  sipudoko, sirampe teppaja.\\nSengeka rimulang penni, naubaliki rilaleng tinro tasiraga
  raga rilaleng nippi.\\nTellu ronna sitinro\u2019, Cinna-e, udaani-e , napassengereng.\\nLise''
  ampelo watanna, palili to Tanete, balinna Pancana.\\nMau mattaung mattimo, iremme
  santang bunge, temma''dasana.\\nKego lewwu makkanggulung, Matto''dang makkalilii'',
  Uwitao tinro.\\nMannippika'' ri wennie,\\nManessa iko mua,\\nUwakkang matinro.\\nMauni
  muitaka ilaleng tinro, musengeka rilaleng penni, tappadatoni rimulanna, pappojitta
  Bali Ulu bale\\nDuppa mata ninitokko, ennau mata-tokko, aja'' murikapang.\\nMelleki
  tapada melle, tapada mamminanga, tasiyallabuang.\\nMinya doddo kali doddo, rekko
  teako doddo, iyya doddo.\\nCeddekki napa ri yattang Mandalle, teng pudu''na maniang
  Pancana.\\nTessitajenggi'' ri Maje''\\nKuwapi ri Manipii''\\nSita baja-baja.\\nNamauni
  ritajekka ri maje, temmae''lo tona mewaki simelle, maputepi kao kaoe natosiruntu.\\nSipongemmu
  kupacokkong, ribola tudangengmu, teyana mawela.\\nTenratu yase, tenratu yawa, balango
  temma lara, anging mallajo lajo, tarona soro, teggili paimeng.\\nNamu'' sompeka''
  ri Jawa,\\nSappaa''i senrapammu,\\nDegaga'' kulolongeng.\\nEngka bujung riattanna
  Maddo, ridiyo teng pasanra, risenge'' pulana.\\nIyyaro mai melleku, tebbulu te\u2019ttanete,
  lappa manengmua.\\nNaiya accae ripatoppoki jekko, a''gati alliri, narekko teyai
  maredduk, mapoloi.\\nLimai uwangenna riallolongengi deceng, seuwani pakatunai alemu
  risilasannae, maduanna saroko maserisilasannae, matellunna makkareso patujue, maeppa\u2019na
  moloie roppo roppo narawe\u2019, malimanna molae laleng namatike\u2019 nappa sanre
  Puang Sewwa''e.\\nAja mumae\u2019lo nabe\u2019tta taue\u2019 makkalla \u2018 ricappa\u2019na
  lete\u2019ngnge.\\nNamauni luttuki massuajang, nareko sitotokki, to siruntu paimeng.\\nRitomainge\u2019e
  eppa\u2019 masero madecceng :\\nmula mulanna namaiseiwi topurae mamaseiwi, maduanna
  tenri ellauwi nabbere, temmattajeng pamale\u2019,\\nmatellunna tulung ngengngi sukara\u2019na
  taue risingangka-gangkanna pattulung, maeppa\u2019na mappangaja\u2019 lettu\u2019
  riperu\u2019e\\nIninnawa malogaku, ribilang lao sala, na iya patuju.\\nIninnawaku
  muwita, mau natuddu solo'', mola linrung muwa.\\nTau magello\u2019 akkalengna de\u2019
  napaccaireng, saba sampoengngi akalengge iyanaritu sipa\u2019 paccairengnge.\\nNaiya
  ininnawa madecenge, tenna iri anging, tennakenna pakkira kira tau lino.\\nAlai cedde\u2019e
  risesena engkai mappedeceng, sampeangngi maega''e risesena engkai maega makkasolang.\\nTinulu
  mappesona wa'', aga ku wamminasa ripowennang pute''.\\nDuwa laleng tempedding riola,
  iyanaritu lalenna passarie, enrengnge lalenna paggollae.\\n(Humas/Syam)\\nPosting
  Komentar untuk \\\"Falsafah Bugis, Bukti Cinta Barru Yang Dirangkum Dari Quote Humas
  Pemda Dan Wartawan Barru Sambut HUT Barru\\\"\"", "\"1Untu\u2019 pamimping kor.
  Situru: Y\u00e9dutun. Mazmurna Asaf. (77-2) Mangobbika sibawa macenno lao ri Allataala;
  mangobbika sibawa macenno, nana\u00e9ngkalingaka.\\n2(77-3) Ri wettu aperisengng\u00e9
  massempajakka lao ri PUWANGNGE; puppu benni uwakkai limakku lao ri Al\u00e9na d\u00e9\u2019
  ucau, iyakiya atikku d\u00e9\u2019 nama\u00e9lo risal\u00e9wori.\\n3(77-4) R\u00e9kko
  uw\u00e9ngngerangngi Allataala, maddar\u00e9k\u00e9ka, r\u00e9kko unennungngi, p\u00e9d\u00e9
  malemmai atikku.\\n4(77-5) Na\u00e9bbuka PUWANGNGE d\u00e9\u2019 naweddikka matinro
  ri wenni\u00e9, maus\u00e9ka angkakku d\u00e9\u2019 uwull\u00e9i mabbicara.\\n5(77-6)
  Upikkiri\u2019i esso-esso iya labe\u2019\u00e9, uw\u00e9ngngerangngi sibawa unennungngi
  taut-taung iya labe\u2019\u00e9.\\n6(77-7) Ri wenni\u00e9 upikkiri\u2019-pikkiri\u2019i,
  sibawa makkutana ri laleng ati,\\n7(77-8) \\\"Untu\u2019 mannennungegga PUWANGNGE
  massamp\u00e9yang sibawa d\u00e9\u2019 nama\u00e9lona?\\n8(77-9) Mapp\u00e9sauniga
  mamas\u00e9iki? D\u00e9\u2019ga Narupaiwi jancin-Na paimeng?\\n9(77-10) Nallupainiga
  Allataala untu\u2019 mamas\u00e9? Macayiiga, angkanna d\u00e9\u2019 namaress\u00e9
  babuwana?\\\"\\n10(77-11) Naumakkeda, \\\"Iyana\u00e9 peddiriwi atikku, makkeda\u00e9
  Iya Pommatanr\u00e9 d\u00e9\u2019na namakuwasana.\\\"\\n11(77-12) Ma\u00e9loka m\u00e9ngngerangngi
  sining pangkaukem-Mu PUWANG, makkatenningngi sining anu makalallaim-Mu wettu riyolo.\\n12(77-13)
  Ma\u00e9loka nennungngi sininna iya Mupogau\u2019\u00e9, sibawa pikkiri\u2019i sining
  winru-Mu iya masero\u00e9.\\n13(77-14) Oh Allataala, mapaccing maneng pangkaukem-Mu,
  nigana silloppo Allataalata?\\n14(77-15) Iko ritu Allataala iya pogau\u2019\u00e9
  anu makalallaing, purani Mupannessa akuwasam-Mu ri yelle\u2019na bangsa-bangsa\u00e9.\\n15(77-16)
  Nasibawang awatangem-Mu Mupaleppe\u2019i umma\u2019-Mu, wija-wijanna Yakub sibawa
  Yusuf.\\n16(77-17) Naita-Mu, oh Allataala, m\u00e9taui uwai, t\u00e9nr\u00e9 towi
  borina tasi\u2019\u00e9.\\n17(77-18) Tiri\u2019i bosi ellungng\u00e9, maddalenrung
  guttu\u00e9; siyanr\u00e9-anr\u00e9 lett\u00e9 ri sininna sulapa\u2019\u00e9.\\n18(77-19)
  Maddalenrung guttu\u00e9, reppe billa\u2019\u00e9, taggottang lino\u00e9 sibawa
  t\u00e9nr\u00e9.\\n19(77-20) Joppa-Ko molai bombangng\u00e9, l\u00e9ttoi tasi\u2019\u00e9,
  iyakiya d\u00e9\u2019 napaita bat\u00e9la-Mu.\\n20(77-21) Pada-pada-Ko pakkampi\u00e9
  dulungngi umma\u2019-Mu, naolai Musa sibawa Harun.\\nBahan Renungan: SH - RH - ROC\\nDownload\\nKamus
  Alkitab\\nKamus Bahasa\\nKidung Jemaat\\nNyanyikanlah Kidung Baru\\nPelengkap Kidung
  Jemaat\\nAlkitab.mobi\\nBantuan\"", "\"1Siyagangngar\u00e9 wettu ri monrinna, namuni
  d\u00e9\u2019na namacaina arungng\u00e9, matteru mupi pikkiri\u2019i pangkaukenna
  Ratu Wasti sibawa tindakang iya pura\u00e9 riyala lao ri al\u00e9na.\\n2Rimakkuwannanaro
  pappangaja-pappangaja iya mar\u00e9pp\u00e9\u2019\u00e9 sibawa arungng\u00e9 mabb\u00e9r\u00e9ni
  tangnga makkuwa\u00e9, \\\"Makessingengngi risappareng ana\u2019-ana\u2019dara iya
  magello\u00e9 untu\u2019 Datu.\\n3Sitinajai Datu makka pegaw\u00e9-pegaw\u00e9 ri
  sininna propinsinna akkarungengng\u00e9w\u00e9 untu\u2019 sappa ana\u2019-ana\u2019dara
  iya magello\u00e9 nainappa tiwi manengngi mennang ri saoraja makkunrai\u00e9 ri
  Susan. H\u00e9gai, pajaba ripallaing iya mancajiy\u00e9 kapala ruma tanggana saoraja
  makkunrai\u00e9, murusu\u2019i matu mennang sibawa mp\u00e9r\u00e9ngngi mennang
  pajjampa agelloreng.\\n4Purairo, sitinajai Datu pil\u00e9 ana\u2019dara iya kaminang
  napojiy\u00e9 Datu, sibawa pancajiwi ratu selaku passull\u00e9na Ratu Wasti.\\\"
  Nasitujuini arungng\u00e9 pangaja\u00e9ro sibawa pajoppai.\\n5Ri kota Susanro engka
  s\u00e9ddi tau Yahudi riyaseng Mord\u00e9khai ana\u2019 Yair. Wijannai Kis sibawa
  Sim\u00e9i pol\u00e9 ri suku B\u00e9nyamin.\\n6Ritawangngi Mord\u00e9khai wettunna
  Y\u00e9rusal\u00e9m ricau ri N\u00e9bukadn\u00e9zar, arung Bab\u00e9l. Ripalii Mord\u00e9khai
  lao ri Bab\u00e9l silaong Yoyakin, arunna Y\u00e9huda, sibawa ma\u00e9ga tawangeng
  iya laingng\u00e9.\\n7Mappunnaiwi sappusiseng, s\u00e9ddi ana\u2019dara iya magello\u00e9
  tappana sibawa makessing pakkal\u00e9nna, asenna Ester, na aseng Ibraninna iyanaritu
  Hadasa. Mat\u00e9ni tomatowanna Ester nariyakka ri Mord\u00e9khai mancaji ana\u2019
  piyara sibawa piyarai selaku ana\u2019 riyal\u00e9na.\\n8Riyappallebbangennana par\u00e9ntana
  arungng\u00e9, ma\u00e9ga ana\u2019dara ripaddeppungeng ri Susan naengkato Ester
  ri yelle\u2019na mennang. Ritiwi towi ri saorajana arungng\u00e9 sibawa riyappaddettangeng
  lao ri H\u00e9gai kapala ruma tanggana saoraja makkunrai\u00e9.\\n9Bengnga H\u00e9gai
  mitai Ester sibawa napojinna. Masitta\u2019ni najampangi agellorenna iyaro ana\u2019dara\u00e9
  sibawa naw\u00e9r\u00e9ng inanr\u00e9 iya ripallaingng\u00e9. Ripal\u00e9tt\u00e9\u2019ni
  Ester ri bagiyang iya kaminang makessingng\u00e9 ri saoraja makkunrai\u00e9ro sibawa
  pitu ana\u2019dara iya kaminang mapecci\u2019\u00e9 k\u00e9do ri saorajana arungng\u00e9
  risuro untu\u2019 tumaningiwi.\\n10Nasaba pangajana Mord\u00e9khai, d\u00e9\u2019
  nappaissengengngi Ester makkeda\u00e9 s\u00e9ddiwi tau Yahudi.\\n11Esso-esso Mord\u00e9khai
  joppa-joppa ri sedd\u00e9 yolona saoraja makkunrai\u00e9ro untu\u2019 makkutangngi
  keadaanna Ester sibawa aga kajajiyang matu sibawa al\u00e9na.\\n12Manuru peraturangng\u00e9,
  sining makkunrai\u00e9 rijampangiwi agellorenna sitaung ittana: enneng uleng sibawa
  minnya ricampuru kamennyang, sibawa enneng uleng rappina sibawa minnya ricampuru
  wangi-wangiyang iya laingng\u00e9. Purairo tungke\u2019 ana\u2019dara lolongeng
  l\u00e9l\u00e9ng untu\u2019 mangolo ri Arung Ahasyw\u00e9ros.\\n13Wettunna s\u00e9ddi
  ana\u2019dara mangolo ri arungng\u00e9, weddingngi napak\u00e9 agi-agi situru napojiy\u00e9.\\n14Ritiwii
  ri saorajana arungng\u00e9 ri wenni\u00e9, na pappa bajana ritiwii ri saoraja laingng\u00e9,
  nariurusu ri Saasgas, s\u00e9ddiwi pajaba ripallaing iya murusu\u2019\u00e9ngngi
  sining gundi\u2019na arungng\u00e9. Iyaro ana\u2019 dara\u00e9 d\u00e9\u2019na namangolo
  ri arungng\u00e9, sangadinna r\u00e9kko arungng\u00e9 puw\u00e9loi sibawa teppui
  asenna.\\n15Narapini l\u00e9l\u00e9nna Ester untu\u2019 mangolo ri arungng\u00e9.
  \u2014 Ester iyanaritu ana\u2019na Abihail sibawa sappusisenna Mord\u00e9khai iya
  pura\u00e9 makkai selaku ana\u2019 riyal\u00e9na; ribengngariwi Ester ri tungke
  tau iya mita\u00e9ngngi. Wettunna lao mangolo ri arungng\u00e9, mappak\u00e9i Ester
  situru panunju pangajana H\u00e9gai, kapalana saoraja makkunrai\u00e9.\\n16Makkuwaniro,
  ri taung mapitu\u00e9 appar\u00e9ntanna Ahasyw\u00e9ros ri uleng maseppulo\u00e9,
  iyanaritu uleng T\u00e9b\u00e9t, ritiwini Ester mangolo ri Arung Ahasyw\u00e9ros
  ri saorajana arungng\u00e9.\\n17Nap\u00e9sennangiwi sibawa nap\u00e9rennuiwi arungng\u00e9
  lebbi naiya ana\u2019-ana\u2019dara laingng\u00e9. Rimakkuwannanaro al\u00e9na kaminang
  ripoji ri arungng\u00e9. Napasanni arungng\u00e9 passigera akkarungengng\u00e9 ri
  ulunna Ester sibawa pancajiwi ratu sull\u00e9iwi Ratu Wasti.\\n18Purairo, pakangkani
  arungng\u00e9 p\u00e9sta selaku pappakalebbi lao ri Ester sibawa mundangngi sininna
  pegaw\u00e9 enrengng\u00e9 tomarajana. Nappallebbangenni esso app\u00e9saungengng\u00e9
  ri sininna akkarungengng\u00e9 sibawa bag\u00e9-bag\u00e9 hadiya sibawa maona.\\n19Iyaro
  wettu\u00e9 riyakkani Mord\u00e9khai ri arungng\u00e9 mancaji pegaw\u00e9 pamar\u00e9nta.\\n20D\u00e9\u2019pa
  nappaissengengngi Ester makkeda\u00e9 s\u00e9ddiwi tau Yahudi, saba\u2019 riyatt\u00e9yangngi
  ri Mord\u00e9khai. Turui Ester ri Mord\u00e9khai pada-pada wettunna baiccu mupa
  sibawa ripiyara ri sappusisennaro.\\n21Ris\u00e9uwa\u00e9 esso, wettunna Mord\u00e9khai
  tugas ri saoraja\u00e9, engka duwa tau pajaba ripallainna arungng\u00e9, iyanaritu
  Bigtan sibawa T\u00e9r\u00e9s, sikongkolo\u2019i ma\u00e9lo mpunoi Arung Ahasyw\u00e9ros,
  nasaba nac\u00e9cc\u00e9 senna\u2019i mennang.\\n22Iyaro rancana\u00e9 naissengngi
  Mord\u00e9khai namasitta\u2019na paissengiwi Ester. Temmattajeng maitta, nacuritani
  Ester lao ri arungng\u00e9 aga naisseng Mord\u00e9khairo.\\n23Risalidikini iyaro
  parakara\u00e9, namanessani makkeda\u00e9 iyaro laporangng\u00e9 tongengngi. Iya
  duwa tauw\u00e9ro rihukkung gattunni. Situru sibawa par\u00e9ntana arungng\u00e9,
  iyaro kajajiyangng\u00e9 riyokini ri laleng kitta sejarana akkarungengng\u00e9.\"",
  "\"1Makkedai PUWANGNGE lao ri iyya, \\\"Alako s\u00e9ddi p\u00e9peng batu loppo,
  nainappa muwoki sibawa hurupu-hurupu iya manessa\u00e9: \u2018Arrampasakeng iya
  Mapecci\u2019\u00e9, Arrampokeng iya Masitta\u2019\u00e9.\u2019\\n2Obbii duwa tau
  sabbi iya weddingng\u00e9 riyatepperi, iyanaritu Imang Uria sibawa Zakharia, ana\u2019
  Y\u00e9b\u00e9r\u00e9khya.\\\"\\n3Siyagangngar\u00e9 wettu ri munrinna mattampu\u2019ni
  bain\u00e9ku. Wettunna jaji ana\u2019ta, makkedai PUWANGNGE lao ri iyya, \\\"Asengngi
  \u2018Arrappangeng iya Mapecci\u2019\u00e9, Arrampokeng iya Masitta\u2019\u00e9.\u2019\\n4Saba\u2019
  ri wettu d\u00e9\u2019napa nagenne loppona iyaro ana\u2019\u00e9 untu\u2019 makkeda
  \u2018Ambo\\\" sibawa \u2018Indo,\\\" sininna asugirenna Damsyik sibawa sininna
  barang rappana Samaria ritiwii matu lao ri arung Asyur.\\\"\\n5Mabbicarai PUWANGNGE
  lao ri iyya,\\n6adan-Na, \\\"Iya\u00e9 bangsa\u00e9 nasamp\u00e9yangngi uwai iya
  tennangng\u00e9 pol\u00e9 ri ana\u2019 Salo Syiloah, sibawa masennangngi sibawa
  Arung R\u00e9zin sibawa Arung P\u00e9kah.\\n7Rimakkuwannanaro Iyya, PUWANG, papol\u00e9i
  matu arung Asyur sibawa sininna tentarana untu\u2019 gasai Y\u00e9huda. Mallurui
  matu pada-pada Salo Efrat iya sapu\u00e9 sibawa malle\u2019i sining peppinna.\\n8Nappo\u2019i
  matu mennang Y\u00e9huda pada-pada l\u00e9mpe gangka ellongng\u00e9 tanr\u00e9na
  sibawa malle\u2019i sini-sininna\u00e9.\\\" Allataala sibawakki! Panni-Na iya mallebba\u2019\u00e9
  linrungiwi wanuwatta.\\n9Addeppungenno sibawa m\u00e9tau, \u00e9h sininna bangsa\u00e9!
  Engkalingai \u00e9h cappa-cappa lino\u00e9! Sadiyano untu\u2019 mammusu, iyakiya
  sibawa ati iya m\u00e9tau\u00e9! Ya, sadiya-sadiyano, iyakiya sibawa papp\u00e9nedding
  m\u00e9tau!\\n10Ebbuno rancana, iyakiya iya manenna d\u00e9\u2019gaga kajajiyang
  matu. Alano apettung, iyakiya d\u00e9\u2019gaga akk\u00e9gunana, saba\u2019 Allataala
  sibawakki.\\n11Rikuwasaina ri PUWANGNGE sibawa ripar\u00e9ngngerangi kuwammengngi
  aja\u2019 uwaccow\u00e9riwi laleng iya naola\u00e9 bangsa\u00e9ro. Adan-Na,\\n12\\\"Aja\u2019
  muwangga\u2019i assikongkolokeng aga iya naangga\u2019\u00e9 mennang assikongkolokeng,
  sibawa aja\u2019 mum\u00e9tau ri gau\u2019-gau\u2019 iya na\u00e9tauriy\u00e9 mennang.\\n13Engngerangngi
  makkeda\u00e9 Iyya, PUWANG Iya Pommakuwasa\u00e9 iyanaritu mapaccingngi. Banna Iyya
  ritu harusu muw\u00e9tauri.\\n14Nasaba mapaccing senna\u2019-Ka, mancaji batu tabbutturek-Ka
  untu\u2019 ra\u2019ya\u2019 Y\u00e9huda\u00e9 sibawa Isra\u00e9li\u00e9, sibawa
  siyo-siyo iya mala\u00e9ngngi pabbanuwana Y\u00e9rusal\u00e9m.\\n15Ma\u00e9ga tau
  menrung matu tabbuttu sibawa malo. Tappasollai matu mennang ri laleng siyo-siyo\u00e9ro.\\\"\\n16Iko,
  ana\u2019-ana\u2019 gurukku harusu\u2019ko taroi sibawa piyarai sining paseng iya
  nabb\u00e9r\u00e9yangng\u00e9 Allataala lao ri iyya.\\n17Purani nasubbu Al\u00e9na
  PUWANGNGE pol\u00e9 ri wija-wijanna Yakub, umma\u2019-Na, iyakiya mateppe\u2019ka
  sibawa mamm\u00e9nasa lao ri Al\u00e9na.\\n18Iyya\u2019na\u00e9 sibawa ana\u2019-ana\u2019
