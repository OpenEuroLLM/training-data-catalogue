  "\"L\u2019Eoc\u00e8n fogu\u00e8t l\u2019edat que se deban\u00e8t entre fa 55 e 38
  milions d\u2019ans. Fogu\u00e8t una ep\u00f2ca que los continents contunh\u00e8ron
  lor movement v\u00e8rs de posicions mai semblantas a las actualas. Pasmens, una
  granda part de la t\u00e8rra \u00e8ra encara desseparada en d\u2019illas gigantas.
  America meridionala se dessepar\u00e8t, fin finala, d\u2019Antartida e \u00cdndia
  vengu\u00e8t mai pr\u00f2cha a Asia. Totun, Antartida e Austr\u00e0lia encara demor\u00e8ron
  amassa pendent lo comen\u00e7ament d\u2019aquel peri\u00f2de.\\nLo clima \u00e8ra
  pertot caud e i avi\u00e1 f\u00f2r\u00e7a vegetacion tropicala amb de regions enti\u00e8ras
  de la planeta qu\u2019\u00e8ran sonque de selvas amb de paluns. La c\u00f2sta dels
  oceans e flumes fogu\u00e8t lo lu\u00f2c ont nasqu\u00e8ron un sens fin de n\u00f2vas
  esp\u00e8cias animalas e vegetalas.\\nD\u2019erbiv\u00f2rs vengu\u00e8ron mai rapids,
  coma los ancessors de vacas, cavals, p\u00f2rcs e tapirs, mas tanben de rinoc\u00e8ros
  o c\u00e8rvis. Al costat d\u2019aqueles se devolop\u00e8ron d\u2019autres animals
  coma Coryphodon e Uintatherium, que vengu\u00e8ron los mai grosses mamif\u00e8rs,
  del c\u00f2p que los ancessors dels lemurids e tarsids comenc\u00e8ron a ocupar
  los arbres de las for\u00e8sts de la planeta.\\nLa naissen\u00e7a d\u2019esp\u00e8cias
  pr\u00f2chas\\nPendent l\u2019Eoc\u00e8n nasqu\u00e8ron e se desvolop\u00e8ron plusors
  esp\u00e8cias animalas mai pr\u00f2chas a l\u2019id\u00e8a qu\u2019av\u00e8m u\u00e8i
  lo jorn sus la fauna: d\u2019estorn\u00e8ls e de pingo\u00efns, mas tanplan de serps
  amb de verin, de guits, d\u2019aga\u00e7as, de pelicans e de gavines. E pendent
  la fin d\u2019aquela edat geol\u00f2gica tanben arrib\u00e8ron de talpes, de camels,
  de conilhs o encara de mirguetas de b\u00f2sc. Un dels carn\u00edvors m\u00e0gers
  d\u2019aquela edat fogu\u00e8t Adrewsarchus, que ca\u00e7ava las pr\u00e8das amb
  de maissas \u00f2rras dins un cap que fasi\u00e1 fins a un metre de longor.\\nTanben
  i agu\u00e8t c\u00e8rta fauna estonanta coma Uintaherium. Aquel mamif\u00e8r gigant
  fogu\u00e8t un erbiv\u00f2r semblant al rinoc\u00e8ros que manjava sonque de fu\u00e8lhas.
  Pasmens, avi\u00e1 si\u00e8is banas al cap per se protegir. Los mascles, a mai,
  avi\u00e1n doas defensas gigantas per luchar e se defendre. Tot aqu\u00f2 fasi\u00e1
  d\u2019Uintatherium un \u00e8sser gaireben meravelh\u00f3s.\\nD\u2019autres animals
  coma los ancessors de las ratapenadas s\u2019espandigu\u00e8ron plan. Icaronycteris
  fogu\u00e8t la primi\u00e8ra esp\u00e8cia d\u2019aquel grop de mamif\u00e8rs voladors.
  E Megistotehrium, un creodont que pesava una tona fogu\u00e8t, benl\u00e8u, lo mamif\u00e8r
  carniv\u00f2r mai gros que jamai visqu\u00e8t sus la planeta: lo sieu cap \u00e8ra
  dos cops m\u00e0ger que lo d\u2019un \u00f2rs brun american actual. Podi\u00e1 atacar,
  se voli\u00e1, de mastodonts.\\nD\u2019autras esp\u00e8cias agu\u00e8ron en aquela
  ep\u00f2ca un succ\u00e9s grand abans de s\u2019escantilhar: Dyatrima fogu\u00e8t
  un auc\u00e8l que podi\u00e1 pas volar e que visqu\u00e8t en America septentrionala.
  Fasi\u00e1 2 m\u00e8tres de nautor e usava lo bec e las arpas per ca\u00e7ar los
  pichon\u00e8ls ancessors dels cavals, Hyracotherium, que sonque pogu\u00e8ren cr\u00e9isser
  e venir mai e mai rapids per subreviure. L\u2019ancessor dels elefants tanben nasqu\u00e8t
  pendent l\u2019Eoc\u00e8n. Avi\u00e1 la talha d\u2019un p\u00f2rc d\u2019u\u00e8i
  e demor\u00e8t als paluns d\u2019Africa del n\u00f2rd fa d\u2019aperaqu\u00ed 40
  milions d\u2019ans. Lo sieu nom fogu\u00e8t Moeritherium. Mas fa 38 milions d\u2019ans
  la T\u00e8rra torn\u00e8t, tornarmai, a cambiar, e arrib\u00e8t l\u2019Oligoc\u00e8n.\\nLa
  Redaccion\"", "\"Ven tot b\u00e8l just de par\u00e9isser un film documentari de
  la jornalista francesa Claire Billet e produsit per \u00ab Solent production \u00bb.
  Aquel trabalh remirable de jornalisme se pogu\u00e8t complir gr\u00e0cias a la collaboracion
  preciosa de l\u2019istorian Christophe Lafaye. Lo t\u00edtol d\u2019aquel documentari
  es \u00ab Argeria, seccions armas especialas \u00bb. Segon la realisatritz sos objectius
  de produccion \u00e8ran de reculhir los testimoniatges de las victimas argerianas
  e tanben dels actors franceses dels crimis de gasatges perpetrats en Argeria entre
  1956 e 1962.\\nTre que se tracha de denonciar los crimis de gu\u00e8rra de Fran\u00e7a,
  las causas venon tras que complicadas e Claire Billet coma Christiophe Lafaye se\u2019n
  main\u00e8ron l\u00e8u. Lors demandas de viratge sus aqueste sicut al Servici Istoric
  de la Defensa Nacionala son estadas refusadas. Fran\u00e7a a paur de la vertat.
  Crenta que sos crimis de gu\u00e8rra, e quitament sos crimis contra l\u2019umanitat,
  si\u00e1 revelats publicament. Fran\u00e7a s\u00e8rva totjorn e de longa sa tradicion
  de \u00ab Granda muda \u00bb. I es certanament constrencha que son armada comet\u00e8t
  tantes e tantes crimis dins sas colonias ancianas coma dins sas colonias actualas.
  Sols los archius nacional d\u2019Otra-Mar accept\u00e8ron de desclassificar qualques
  documents tocant a n\u2019aquel epis\u00f2di pauc glori\u00f3s de l\u2019imperialisme
  francimand. Calgu\u00e8t d\u2019annadas e d\u2019annadas de bat\u00e8stas judiciaras
  al remirable istorian Christophe Lafaye per obt\u00e9ner la consultacion pas que
  de qualques documents administratius militars.\\nTre la fin de la primi\u00e8ra
  gu\u00e8rra mondiala, en 1925, se sign\u00e8t lo protoc\u00f2l de Gen\u00e8va que,
  sensat, enebissi\u00e1 en cas de gu\u00e8rra l\u2019empl\u00e8c dels gases asfixiants,
  toxics o similars e los mejans bacteriologics. Paradoxalament aquel protoc\u00f2l
  enebissi\u00e1 l\u2019empl\u00e8c d\u2019aquelas armas, mas non pas lor fabricacion.
  Comprenga qual poir\u00e0 ! Atal, totes, o gaireben totes los que sign\u00e8ron
  aquel t\u00e8xte serv\u00e8ron lors armas quimicas. Demest aquestes pa\u00efses,
  plan solide, l\u2019imperialista Fran\u00e7a. Emai aqu\u00f2 se compren qu\u2019un
  pa\u00eds colonialista es obligat d\u2019entret\u00e9ner una armada que non sauri\u00e1
  recuolar davant los pi\u00e8ger crimis per servar \u00e7\u00f2 que pensa \u00e8sser
  sas possessions. Doblidessem pas que l\u2019armada francesa es venguda al s\u00e8gle
  XXen l\u2019especialista de la contraguerrilha. Per aquesta rason form\u00e8t un
  fum d\u2019armadas de dictators e mai que mai en America Centrala e del Sud. De
  fach, la Convencion subre l\u2019interdiccion de las armas biologicas fogu\u00e8t
  pas adoptada qu\u2019en 1972, plan apr\u00e8p la fin de la gu\u00e8rra de liberacion
  nacionala en Argeria. Aquesta eneb\u00eds la fabricacion, l\u2019amolonament e lo
  transferiment de las armas bacteriologicas.\\nFran\u00e7a es totjorn estada opaca,
  emai secretosa, tocant a sas armas nuclearas e benl\u00e8u bacteriologicas. Doblidessem
  pas que Fran\u00e7a es machiavelica e sornaruda coma totes los opressors. Si\u00e1
  dich en passant es estada capabla de signar un t\u00e8xte coma la Carta europ\u00e8a
  per las Lengas Regionalas sens la voler ratificar per aver pas a l\u2019aplicar.\\nLo
  film \u00ab Argeria, seccions armas especialas \u00bb comen\u00e7a per los testimoniatges
  ponhents e pertocants d\u2019ancians soldats de l\u2019Armada de Liberacion Nacionala
  argeriana que conegu\u00e8ron los crimis de gasatges comeses per l\u2019armada francesa
  per i aver escapat de pauc. Segon d\u2019estudis istorics serioses cal comptar que
  i ag\u00e8t entre 5 000 e 10 000 personas d\u2019asfixiadas dins las caunas de las
  montanhas argerianas. Per la m\u00e0ger part \u00e8ran de soldats de l\u2019Armada
  de Liberacion Nacionala, mas qualques c\u00f2ps quand tot un vilatge que s\u2019anava
  refugiar dins una cauna per se parar de l\u2019arribada de l\u2019armada d\u2019ocupacion,
  \u00e8ra tot un vilatge qu\u2019\u00e8ra assassinat dins son refugi. Aquela practica
  ignominiosa se fagu\u00e8t, plan solide, amb l\u2019aval de Fran\u00e7ois Mitterand
  qu\u2019\u00e8ra alara ministre de l\u2019Interior. Ai aqu\u00ed una pensada caritadosa
  pels occitanistas qu\u2019a un moment o a un autre vot\u00e8ron per el.\\nAv\u00e8m
  dins aquel film tanben los testimoniatges dels soldats de l\u2019armada d\u2019agression.
  De notar que dins lo centenat d\u2019unitats creadas per utilisar las armas quimicas,
  en def\u00f2ra dels ofici\u00e8rs, los demai dels soldats \u00e8ra d\u2019apelats
  del contingent. Aqueste fogu\u00e8ron marcats a jamai per lors crimis comandats,
  mas sab\u00e8m pas se d\u2019unes ag\u00e8ron lo coratge de desertar. De desercions
  dins l\u2019ensems de l\u2019armada francesa n\u2019i ag\u00e8t ben qualques unas,
  mas gaire.\\nPer totas las caunas trobadas e repertoriadas per l\u2019armada de
  colonizacion l\u2019operacion \u00e8ra simpla : \u00e8ran gasadas e pu\u00e8i, per
  en cas que d\u2019unes ocupants se n\u2019escapen, l\u2019entrada \u00e8ra despietadosament
  dinamitada. L\u2019armada francesa gasava en Argeria coma los nazis gasavan en Alemanha.
  De notar que los soldats franceses que particip\u00e8ron a n\u2019aqueles crimis
  de gu\u00e8rra (quand las victimas \u00e8ran de soldats de l\u2019Armada de Liberacion
  Nacionala argeriana) e crimis contra l\u2019umanitat (quand las personas refugiadas
  dins las caunas \u00e8ran pas que de civils venguts s\u2019aparar de l\u2019armada
  quasi genocid\u00e0ria francesa) se veg\u00e8ron confiscar las f\u00f2tos que podi\u00e1n
  aver d\u2019aquelas operacions. Es de precisar que dins las caunas gasadas (sistematicament
  o son totas estadas) s\u2019i pogu\u00e8t pas mai dintrar pendent un desenat o dotzenat
  d\u2019annadas talament \u00e8ran encara contaminadas. Fran\u00e7a recuol\u00e8t
  pas per emplegar totas las armas de destruccion massissa qu\u2019\u00e8ran a n\u2019aquel
  moment a sa portada e aqu\u00f2 tre la debuta de la gu\u00e8rra de liberacion nacionala
  argeriana. E quand Par\u00eds comprengu\u00e8t que politicament avi\u00e1 perdut
  la gu\u00e8rra, alavetz los chaples e los crimis de gu\u00e8rra se multipliqu\u00e8ron.
  Quand Fran\u00e7a comprengu\u00e8t qu\u2019avi\u00e1 perdut la gu\u00e8rra sa venjan\u00e7a
  fogu\u00e8t terribla. Se met\u00e8t a destrusir lo pa\u00eds abans de se retirar.\\nLa
  gu\u00e8rra de liberacion nacionala fagu\u00e8t 500 000 m\u00f2rts del costat argerian
  sus una populacion de 9 000 000 d\u2019estatjants. \u00c7\u00f2 que fa una proporcion
  considerabla. La conclusion es que fa pas bon \u00e8sser colonizat per Fran\u00e7a.
  Apr\u00e8p una tala gu\u00e8rra, apr\u00e8p una tala negacion de la realitat encara
  presenta dins las mentalitats francesas, coss\u00ed los Argerians poiri\u00e1n doblidar
  aqueles crimis ?\\nFa ara 63 ans que la gu\u00e8rra es acabada e Fran\u00e7a es
  totjorn pas capabla de desclassificar sos archius militars. Aqu\u00f2 v\u00f2l dire
  tot simplament que los crimis denonciats per Claire Billet e Christophe Lafaye son
  en-de\u00e7\u00e0 de la realitat. Lo criminal contunha ensajar amagar sos crimis.
  Es una insuportabla vergonha. Es inacceptable per la mem\u00f2ria de las victimas
  e de sos descendents.\\nLo film fogu\u00e8t enebit (si-ben-tant la censura contunha
  d\u2019existir en Fran\u00e7a en 2025) de difusion sus las cadenas, mas es disponible
  sus la plataforma de France T\u00e9l\u00e9visions. Fran\u00e7a ditz voler assumir
  son ist\u00f2ria, mas o fa pas jamai. Doncas, quand ditz aqu\u00f2, messorgueja
  un c\u00f2p de mai. Mas que poiriam esperar de mai de sa part ?\\nS\u00e8rgi Viaule\"",
  "\"Un cargue significat deth Gov\u00e8rn d\u2019Aran, que se presente coma director
  d\u2019ua institucion culturau (\u00a1Damb quina facilitat utilizen quauqu\u2019uns
  es s\u00f2ns cargues t\u00e0 h\u00e8r politica e parlar de tot mens der airau que
  gestionen!), n\u00e8gue eth dret de v\u00f2t as immigrants colombians e romans (romanesi,
  pas de Roma) perqu\u00e9 sonque parlen aran\u00e9s \u00ab un cinc per mil d\u2019eri
  \u00bb, causa que dem\u00f2stre ce perqu\u00e9 ei significat eth n\u00f2ste cargue:
  perqu\u00e9 ath del\u00e0 dera cultura, lengua e politica, domine tanben era estadistica.\\nEsc\u00f2la
  Duran i Lleida\\nSeguint era linha de pensament der umanisme cristian dera Esc\u00f2la
  Duran i Lleida, eth n\u00f2ste disciple proclame: \u00ab Era coneishen\u00e7a deth
  l\u00f2c aurie d\u2019\u00e8ster imprescindibla ent\u00e0 assegurar que se v\u00f2te
  conscientament \u00bb. Ei a d\u00edder, t\u00e0 votar non sonque ei imprescindible
  parlar er aran\u00e9s, senon que tanben cau \u00ab con\u00e9isher \u00bb eth l\u00f2c
  a on demore eth qui tot just non sap a on demorar. M\u00e8s, p\u00f2ste, p\u00f2ste\u2026
  Me n\u2019\u00e8 passat ua: eth cargue a hijut \u00ab v\u00f2te conscientament \u00bb.
  O sigue, tanben se mos demane votar damb tot eth coneishement e responsabilitat
  qu\u2019af\u00e8cte seriosament.\\nConclusion\\nRepassi es condicions (parlar aran\u00e9s,
  con\u00e9isher eth l\u00f2c e votar conscientament) e concludisqui que se m\u2019aurie
  de retirar immediatament eth dret a votar. Ei evident que sonque complisqui ua condicion:
  era de parlar er aran\u00e9s, e encara\u2026 perqu\u00e9 en Barcelona ja me dir\u00e0s
  damb qui parli er aran\u00e9s\u2026 Eth l\u00f2c (Aran) tot just que le comenci
  a descurbir: i a p\u00f2bles qu\u2019encara non \u00e8 caushigat, es mies excursions
  de montanha se limiten a Liat e p\u00f2ga causa m\u00e8s (ne tansevolhe Colom\u00e8rs!),
  e tanp\u00f2c me h\u00e8squi guaire damb era joenessa deth m\u00e8n p\u00f2ble,
  Boss\u00f2st\u2026 E a\u00e7\u00f2 de votar conscientament me sup\u00e8re m\u00e8s.
  S\u00f2 incapable. Tostemp qu\u2019\u00e8 votat \u00e8 sajat de predar-me, de m\u00e9ter-i
  toti es sentits\u2026, m\u00e8s jam\u00e8s \u00e8 liejut sancer un programa electorau
  ne tanp\u00f2c assistisqui as mitings e i a partits que jam\u00e8s votaria, encara
  que present\u00e8ssen era melhor prop\u00f2sta deth m\u00f3n (actitud irracionau
  era mia\u2026).\\nDe Col\u00f2mbia\\nS\u2019es condicions sonque son aplicables
  as romans e colombians, un aute mau de cap que comenci a auer: \u00bfes m\u00e8s
  pairs m\u2019an amagat es m\u00e8s or\u00edgens? \u00bfSer\u00e8 roman o colombian?
  Ara comenci a compr\u00e9ner perqu\u00e9 m\u2019aper\u00e8ren Amador, sup\u00f2si
  qu\u2019en aunor as t\u00e8rres dera America deth Sud\u2026 Pues hasta lueguito,
  licenciado. (Ui, m\u2019a gessut en mexican.)\"", "\"La taleja de Tucidide\\nTucidide
  qu\u2019ei un \u00f2mi politic, estrat\u00e8gue e istorian atenian (enter 460 e
  395 abC). La soa \u00f2bra principau qu\u2019ei La Gu\u00e8rra de Pelopon\u00e8s,
  raconte de la gu\u00e8rra qui opaus\u00e8 At\u00e8nas e Esparta enter 431 e 404
  abC. La taleja de Tucidide qu\u2019ei un conc\u00e8pte de relacions internacionaus
  qui designa ua situacion on ua pot\u00e9ncia dominanta\u2026\\nPer Jos\u00e8p Malpeu\\nTucidide
  qu\u2019ei un \u00f2mi politic, estrat\u00e8gue e istorian atenian (enter 460 e
  395 abC). La soa \u00f2bra principau qu\u2019ei La Gu\u00e8rra de Pelopon\u00e8s,
  raconte de la gu\u00e8rra qui opaus\u00e8 At\u00e8nas e Esparta enter 431 e 404
  abC. La taleja de Tucidide qu\u2019ei un conc\u00e8pte de relacions internacionaus
  qui designa ua situacion on ua pot\u00e9ncia dominanta entra en gu\u00e8rra contra
  ua pot\u00e9ncia emergenta, la prum\u00e8ra qu\u2019ei possada per la paur qui la
  segonda suscita en era pr\u2019amor de la soa montada en pot\u00e9ncia.\\nAmericans
  e Chin\u00e9s, un engrenatge?\\nEn 2017, Graham Allison, professor emerit a Harvard,
  que publica lo libe Destined for War, bastit a l\u2019entorn d\u2019ua id\u00e8a
  pro simpla: los dirigents americans e chin\u00e9s, qui creden a la lor plea libertat
  d\u2019accion decisionau, que ser\u00e9n en realitat d\u2019ara endavant pres dens
  l\u2019engranatge d\u2019un tracanard istorico-estrategic qui, ribon-ribaina, que\u2019us
  condicionar\u00e9 entad un afrontament probable. La refer\u00e9ncia teorica causida
  per Allison qu\u2019ei La Gu\u00e8rra de Pelopon\u00e8s, l\u2019obratge on Tucidides
  dis\u00e8: \u201cQu\u2019est\u00f3 l\u2019ascension d\u2019At\u00e8nas e la paur
  qui aquesta instill\u00e8 a Esparta qui torn\u00e8n la gu\u00e8rra inevitabla.\u201d\\nD\u2019aqueth
  esqu\u00e8ma qui opausa un gardian deu statu quo (mia\u00e7at de paran\u00f2ia)
  e un perturbator ambici\u00f3s (temptat per l\u2019hubris), Allison que deduseish
  ua grasilha d\u2019analisi ent\u00e0 compr\u00e9ner l\u2019avi\u00e9ner de las relacions
  enter China e Estats Units. Pendent las cinc cents darr\u00e8ras annadas, l\u2019autor
  que relh\u00e8va setze ocurr\u00e9ncias de \u00e7\u00f2 qui nomenta la \u201ctaleja
  de Tucidides\u201d: dotze c\u00f2ps, lo tracanard que desboqu\u00e8 sus la gu\u00e8rra.
  Quate c\u00f2ps solament, aquesta qu\u2019est\u00f3 evitada. Se lo coble antagonic
  USA/China p\u00f2t escapar ad aquera fatalitat estatistica? L\u2019autor que respon
  per ua analisi prospectiva deus combinat\u00f2ris de causidas qui\u2019s nodan enter
  los dirigents d\u2019Estats qui aspiran a ua preponder\u00e0ncia globau.\\nApr\u00e8s
  ua seria de scenaris de crisi qui insisteishen sus las possibilitats actuaus d\u2019ascension
  aus extr\u00e8mes, l\u2019ensai que s\u2019acaba sus un cap\u00edtol optimista.
  Tir\u00e0\u2019s deu tracanard que consistir\u00e9 a non pas multiplicar shens necessitat
  las linhas rojas, los cuus de sac decisionaus de qui non se ved pas mei a t\u00e8rme
  com ne sortir shens p\u00e8rder la f\u00e0cia, sonque per la gu\u00e8rra. Los Estats
  Units que dominan en realitat largament lo lor supausat peer competitor1 suu plan
  capacitari, e los recents progr\u00e8s tecnologics chin\u00e9s \u2014 cibertecnologias
  e armas espaciaus \u2014 ne sufisen pas a\u2019n har un adversari estrategic de
  medisha classa. En mei, en China las valors confuceanas, maugrat que reivindicadas
  peu regime, qu\u2019an h\u00e8it pla\u00e7a a ua occidentalizacion galopanta de
  las costumas, fondada sus un et\u00f2s consumerista. Chin\u00e9s e Americans ne
  viven pas mei dens univ\u00e8rs mentaus estancs\u2026\\nLa t\u00e8si d\u2019Allison
  vs la de Pierre Grosser\\nMes la t\u00e8si d\u2019Allison qu\u2019ei, desempuish
  p\u00f2c, h\u00f2rt contestada peu franc\u00e9s Pierre Grosser, istorian e professor
  de relacions internacionaus a Sci\u00e9ncias Politicas. Enter ambicion de v\u00e0der
  la prum\u00e8ra pot\u00e9ncia deu plan\u00e8ta deu costat chin\u00e9s e cranhen\u00e7a
  de p\u00e8rder lo monop\u00f2li deu lideratge mondiau deu costat american, lo conflicte
  armat ser\u00e9 un scenari de bon cr\u00e9der segon la famosa teoria de la \u201ctaleja
  de Tucidides\u201d?\\nSegon Allison, dens l\u2019ist\u00f2ria, l\u2019ascension
  rapida d\u2019ua pot\u00e9ncia nav\u00e8ra, qui v\u00f2u cambiar las r\u00e8glas
  deu j\u00f2c au son avantatge, qu\u2019inqui\u00e8ta tostemps la pot\u00e9ncia mei
  plan installada, mes qui declina dej\u00e0. Aqu\u00f2 que prov\u00f2ca necess\u00e0riament
  gu\u00e8rras.\\nUei, los Estats Units que deven acceptar los cambiaments de ierarquia
  de las pot\u00e9ncias (donc la dominacion de China en Asia) o causir la gu\u00e8rra
  ent\u00e0 limitar-la, dab lo risc de s\u2019aflaquir eths medishs e de facilitar
  \u00e7\u00f2 qui vol\u00e8van previ\u00e9ner: la dominacion chinesa.\\nL\u2019exemple
  de la prum\u00e8ra gu\u00e8rra mondiau\\nT\u00e0 Grosser, la comparason heita per
  Allison dab la gu\u00e8rra de 1914, dens lo son libe, ne tien pas: la Prum\u00e8ra
  Gu\u00e8rra mondiau n\u2019est\u00f3 pas causada per la rivalitat enter Berlin e
  Londres. La corsa aus armaments navaus qu\u2019\u00e8ra estada ganhada peus Britanics
  autanl\u00e8u 1912 e que comptava mensh que la corsa aus armaments terr\u00e8stres
  d\u2019Alemanha dab Fran\u00e7a e Russia. Los enemics tradicionaus d\u2019Alemanha
  qu\u2019\u00e8ran aqueths dus pa\u00eds, qui \u00e8ran tanben los deus Britanics.\\nUei,
  que cau har compte de las tensions sino-indianas e sino-japonesas. La proximitat
  culturau anglo-alemanda qu\u2019\u00e8ra h\u00f2rta, mei h\u00f2rta qu\u2019enter
  los Estats Units e China. Aquesta ne s\u00f2rt pas de gu\u00e8rras d\u2019unificacion
  qui n\u2019aur\u00e9n h\u00e8it, com Alemanha, un mod\u00e8le militar entaus estats-majors
  deu monde sanc\u00e8r. La Prum\u00e8ra Gu\u00e8rra mondiau n\u2019ei pas devuda
  principaument ad aquera ascension rapida d\u2019ua pot\u00e9ncia nav\u00e8ra e l\u2019ist\u00f2ria
  qu\u2019ensenha que los cambiaments de rap\u00f2rts de pot\u00e9ncia ne prov\u00f2can
  pas automaticament de gu\u00e8rra.\\nChina se p\u00f2t comparar aus Estats Units?\\nA
  China que l\u2019agrada compar\u00e0\u2019s aus Estats Units e que desira reserv\u00e0\u2019s
  ua esf\u00e8ra d\u2019influ\u00e9ncia privilegiada, quitament exclusiva, v\u00e0der
  ua pot\u00e9ncia navau ent\u00e0 protegir lo son com\u00e8rci e los sons inter\u00e8s,
  e ua pot\u00e9ncia diplomatica, culturau. Que p\u00f2t quitament arribar a estar
  au c\u00f2p ua pot\u00e9ncia terr\u00e8stra e ua pot\u00e9ncia navau, nacionalista
  e imperialista, ua pot\u00e9ncia industriau en pret\u00e9nder estar lo centre nav\u00e8th
  deu monde.\\nA despieit deus chepics qui suscita, la soa volontat de crear basas
  a l\u2019estrang\u00e8r e de s\u2019assegurar deus sup\u00f2rts portuaris, que ser\u00e9
  \u201cnaturau\u201d. Tot pari\u00e8r com lo son chepic d\u2019assegurar la seguretat
  de las soas rotas d\u2019aprovediment de las mat\u00e8rias prum\u00e8ras e deus
  sons ciutadans.\\nL\u2019agitacion de 2022 a l\u2019entorn d\u2019un ac\u00f2rd
  de China dab las islas Solomon que h\u00e8 seguida a nombre de focalizacions sus
  l\u00f2cs (de Camb\u00f2tja au golfe de Guin\u00e8a o a Namibia, en passant peus
  Emirats Arabes Units), qui cobedejar\u00e9 Pequin.\\nChina, ua estapa nav\u00e8ra\\nLas
  despensas militaras de China qu\u2019aumentar\u00e9n mecanicament dab l\u2019aumentacion
  deu PNB, shens qu\u2019i aja volontat militarista. Fin finala, China qu\u2019entrar\u00e9
  dens ua estapa nav\u00e8ra, dej\u00e0 corruda per las granas pot\u00e9ncias precedentas,
  en cercar d\u2019internacionalizar la soa moneda e tanben lo son dret.\\nAu del\u00e0
  de las simplas comparasons de PNB, qu\u2019a dej\u00e0 un poder de mercat (gr\u00e0cias
  a la soa populacion nombrosa de niv\u00e8u de vita qui creish), qu\u2019ei centrau
  dens las cadenas de valor e sustot la construccion navau (45 % de la produccion
  mondiau) e lo transp\u00f2rt maritime, e que pesa dens l\u2019establiment de n\u00f2rmas
  tecnologicas. Las accions internacionaus de China n\u2019aur\u00e9n pas, donc, arren
  a v\u00e9der dab l\u2019ideologia deu regime, mes que ser\u00e9n lo simple produit
  de \u201cleis\u201d de la geopolitica.\\nChina, ua pot\u00e9ncia guerri\u00e8ra?\\nEn
  mei, la taleja de Tucidides ne concernir\u00e9 pas China, pr\u2019amor aquesta ne
  ser\u00e9 pas ua pot\u00e9ncia guerri\u00e8ra (Xi Jinping que ditz que n\u2019ei
  pas \u201cdens lo son ADN\u201d). Qu\u2019ei lo sol membre permanent deu Conselh
  de Seguretat de las Nacions Unidas, despuish la fin de la gu\u00e8rra hreda, a non
  pas aver utilizat la f\u00f2r\u00e7a militara e desplegat los sons soldats ent\u00e0
  gu\u00e8rras a l\u2019estrang\u00e8r. Ne ser\u00e9 pas ua pot\u00e9ncia revisionista,
  mentre que los Estats Units ne son ua que se\u2019n pren, per las soas intervencions
  \u201cumanit\u00e0rias\u201d, a l\u2019\u00f2rdi internacionau d\u2019Estats sobeirans
  codificat en 1945 (ex.: la gu\u00e8rra d\u2019Iraq).\\nPequin qu\u2019ap\u00e8ra
  los Estats Units a \u201cmanti\u00e9ner lo sist\u00e8ma internacionau dab l\u2019ONU
  en lo son c\u00f2r e lo dret internacionau com fondament\u201d. China n\u2019ensajar\u00e9
  pas de constitu\u00efr ua alian\u00e7a anti-occidentau dab los pa\u00eds ostiles
  a la dominacion americana (maugrat la formalizacion de grops d\u2019amics a las
  Nacions Unidas), ni a entrainar reb\u00e8lles anti-imperialistas capvath lo monde
  com dens las annadas 1960 e 1970, ni a copar las alian\u00e7as americanas, ni a
  prom\u00f2ver un \u00f2rdi alternatiu. Non solament ne minar\u00e9 pas l\u2019\u00f2rdi
  internacionau mes que paga de mei en mei ent\u00e0 eth, per las soas contribucions
  au sist\u00e8ma onusian (sustot las Operacions de Manteniment de la Patz). En realitat,
  qu\u2019ei la mescla d\u2019optimisme e de pessimisme de la pot\u00e9ncia montanta
  qui est\u00f3 ua de las encausas de la Prum\u00e8ra Gu\u00e8rra mondiau, e qui poir\u00e9
  estar la d\u2019ua gu\u00e8rra sino-americana.\\nUn camin possible\\nLa Weltpolitik
  [la \u201cpolitica mondiau\u201d] alemanda qu\u2019\u00e8ra dens un camin d\u2019enl\u00f2c
  a partir de la fin de las annadas 1900, pr\u2019amor que provocava reaccions de
  las granas pot\u00e9ncias concurrentas. Berlin que\u2019s sentiva donc empachada
  d\u2019obti\u00e9ner la soa \u201cpla\u00e7a au s\u00f3\u201d, en pret\u00e9nder
  aver lo melhor sist\u00e8ma politic, la cultura melhora, lo mei gran dinamisme industriau
  e comerciau. Qu\u2019ei l\u2019arrepujada en pot\u00e9ncia rapida de Russia, apr\u00e8s
  la soa des\u00b7h\u00e8ita de 1905 contra Japon, e donc l\u2019ahortiment de la
  tenalha franco-russa, qui poss\u00e8 Berlin a ua gu\u00e8rra quasi preventiva, en
  profieitant de la crisi de l\u2019estiu de 1914.\\nChina uei qu\u2019ei conven\u00e7uda
  de dever retrobar la soa pla\u00e7a au Centre e a la cima qui\u2019u ser\u00e9 istoricament
  devuda, mes que pateish lo retorn de baston de pa\u00eds petits e grans qui tastan
  pas guaire la soa arrog\u00e0ncia, los esf\u00f2r\u00e7 de las pot\u00e9ncias concurrentas
  ent\u00e0 non pas deishar lo camp liure au Dragon, mentre que las crisis int\u00e8rnas
  de daubuns \u201cclients\u201d que son atribu\u00efts a un endeutament excessiu
  au resp\u00e8cte de China (Sri Lanka, Laos\u2026). Los observators qui s\u2019inquietavan
  de l\u2019ofensiva d\u2019embelinament chinesa dens las annadas 2000 que\u2019s
  fretan las mans en constatar, dab ua certana exageracion, la degradacion de l\u2019image
  de China dens lo monde despuish la fin de las annadas 2010, pr\u2019amor de la soa
  agressivitat verbau e de las soas practicas coercitivas.\\nTriomfalisme normau o
  excessiu?\\nLa question deu triomfalisme excessiu de China qui mia a ua s\u00f2rta
  de surexpansion imperiau qu\u2019ei discutida despuish mei d\u2019ua annada en China.
  Xi Jinping qu\u2019aur\u00e9 avut t\u00f2rt de har deu Guilh\u00e8m II, dens ua
  politica regionau e mondiau assertiva, dab c\u00f2ps diplomatics, h\u00e8its complits
  e gu\u00e8rra juridica en mar de China deu Sud, qui aur\u00e9n vadut China impopulara,
  a c\u00f2ps isolada, e en consequ\u00e9ncia mei agressiva.\\nLa volontat creishenta
  de Xi d\u2019utilizar la coercicion entad at\u00e9nher los objectius de China, atau
  com la retorica de mei en mei agressiva, que poir\u00e9n estar la pr\u00f2va qui
  Pequin a consci\u00e9ncia qui ser\u00e0 de mau passar pacificament los Estats Units
  dens lo long esprint a la pot\u00e9ncia. Los condensats de pessimisme dens l\u2019ola
  d\u2019optimisme que ser\u00e9n perilh\u00f3s, pr\u2019amor que possar\u00e9n a
  pr\u00e9ner mei de risques, pr\u2019amor d\u2019ua paran\u00f2ia e d\u2019ua impaci\u00e9ncia
  acreishudas. Lo cel\u00e8bre estrat\u00e8gue Edward Luttwak que parla quitament
  d\u2019 \u201cautisme de grana pot\u00e9ncia\u201d, qui ser\u00e9 ua lei de l\u2019ist\u00f2ria:
  lo Partit Comunista Chin\u00e9s, particularament etnocentric e plen de m\u00f2rga,
  ne poir\u00e9 pas o ne voler\u00e9 pas abandonar politicas contraproductivas e autodestructrises,
  maugrat tots los senhaus.\\nEnt\u00e0 daubuns observators, Xi que prom\u00f2u ua
  generacion nav\u00e8ra de diplomatas pr\u00e8sta a la competicion dab l\u2019Occident
  e a l\u2019utilizacion de la coercicion, favorabla a l\u2019\u00e8ish sino-rus e
  a un lideratge chin\u00e9s suu monde non-occidentau, e determinats a def\u00e9ner
  lo mod\u00e8le politic chin\u00e9s; autes au contrari qu\u2019estiman que son diplomatas
  mei moderats qui son metuts endavant, entad apatzar las inquietuds deus pa\u00eds
  d\u2019arcuelh. Mes com tornar endarr\u00e8r quan, ent\u00e0 rasons abans tot domesticas,
  Xi Jinping aur\u00e9 abandonat la montada en pot\u00e9ncia pacifica de China, e
  ser\u00e9 anat tr\u00f2p luenh dens la projeccion de pot\u00e9ncia e l\u2019agressivitat
  verbau, en provocar ua sus-reaccion deus Estats Units, deus lors aliats, e daubuns
  pa\u00eds deu Sud? Aquera sus-reaccion au son torn que har\u00e9 impossibla tot
  retorn endarr\u00e8r, quitament que facilitar\u00e9 ua hueita endavant.\\nD\u2019Allison
  o Grosser, qui a rason? Sol l\u2019avi\u00e9ner qu\u2019ac dir\u00e0\u2026\\nRefer\u00e9ncias\\nDestined
  for War: Can America and China Escape Tucidides\u2019s Trap?, Graham Allison, Scribe,
  Melbourne-Londres, 2017, 384 paginas, 18,99 libes esterlins. Presentacion per l\u2019autor.\\nThe
  Emergence of Peer Competitors, Rand Corporacion, Santa Monica, 2001.\\nL\u2019autre
  guerre froide, Pierre Grosser, Par\u00eds, edicions deu CNRS, 2023.\\nN\u00f2ta\"",
  "\"Sara Andrejevi\u0107 (en s\u00e8rbe cirillic: Capa AH\u0434pejeB\u0438\u0127)
  es la professora de s\u00e8rbe de Josep Maria. Ven de Belgrad, mas resid\u00eds
  a Barcelona.\\nA un n\u00f2vi nomenat \u00d2scar, un Senhor del Temps mai grand
  que Panda e lo cinquen dels Senhors del Temps (lo quatren fenh \u010f\u00e8sser
  nascut lo 2032 e fogu\u00e8t aquel qu\u2019envi\u00e8t Solana, la filha de Josep
  Maria, enr\u00e8 dins lo temps fins al peri\u00f2de de joenessa de Josep Maria ont
  i avi\u00e1 conegut pas encara Alara). \u00d2scar fenh \u010f\u00e8sser un angl\u00e9s.
  Lo n\u00f2vi de Sara es pas \u00d2scar Gallardo, \u013eex-n\u00f2vi de Mila.\\nSara
  a una amiga que viu a Belgrad e es pas aquela que ditz \u010f\u00e8sser: es coma
  M\u00edriam, una dr\u00f2lla sintetica qu\u2019inserigu\u00e8t quic\u00f2m dins
  lo cap de Josep Maria mejan\u00e7ant una fusion mentala, en creant un ligam pro
  f\u00f2rt entre eles que lo fa se sentir atrach per ela, en li empedint de far quina
  autra causa que si\u00e1, e Josep Maria aur\u00e0 \u010faqueste biais de dificultats
  per complir la si\u00e1 mission de determinar \u00e7\u00f2 qu\u2019es M\u00edriam.
  \u013damiga de Sara a la meteissa natura e la meteissa intencion \u010faquela de
  M\u00edriam, mas cerca per contra Panda, que resid\u00eds tanben a Belgrad.\\nSara
  fagu\u00e8t una fusion mentala amb Josep Maria de suspresa pel sieu anniversari
  quand fagu\u00e8t 24 ans, apr\u00e8s que Josep Maria o li agu\u00e8s discretament
  demandat pendent un an enti\u00e8r, gaireben dempu\u00e8i que se conegu\u00e8ron.
  E mai se aquela fusion mentala dur\u00e8sse paucs segons e lor ligam fogu\u00e8sse
  discontin\u00fa (en rason \u010fun contacte de nases intermitent), a comptar \u010faquel
  jorn Sara cambi\u00e8t la si\u00e1 actitud professionala env\u00e8rs Josep Maria
  e comenc\u00e8t a lo veire coma un amic, en se sarrant emocionalament mai \u013eun
  de \u013eautre. Josep Maria e Sara pact\u00e8ron qu\u2019ela li fari\u00e1 per \u013eanniversari
  que ven una autra fusion mentala, mas qu\u2019aquel c\u00f2p la fari\u00e1n coma
  los teremedosians (en s\u2019apiejant suls nases sens m\u00f2ure lors caps e durant
  mai de temps). Mas los probl\u00e8mas de M\u00edriam e lo sieu coronavirus caus\u00e8ron
  que la relacion entre Josep Maria e Sara s\u2019espatl\u00e8sse: a la fin de la
  pellicula \u201cPlanetes VII: La fin \u010fun futur\u201d Sara s\u2019embufa amb
  24 e decid\u00eds de se n\u2019escartar. Dins la pellicula \u201cPlanetes VIII:
  Te refarai la ti\u00e1 vida\u201d 25 repren las leccions amb Sara, pr\u2019amor
  que 25 capit\u00e8t expr\u00e8ssament pas \u013eexam\u00e8n de s\u00e8rbe: Sara
  lo sedusigu\u00e8t, \u013eenamor\u00e8t e li promet\u00e8t pendent mieg an que li
  fari\u00e1 una autra fusion mentala per lo sieu anniversari, mas quand i mancava
  pas qu\u2019un mes li digu\u00e8t \u010fanar se far fotre. 25 sofr\u00eds doncas
  e se\u2019n v\u00f2l ara venjar. 25 regal\u00e8t quitament a Sara per lo sieu anniversari
  un mocador que preteni\u00e1 amb el la conv\u00e9ncer de li far tornarmai una fusion
  mentala. Mas ela volgu\u00e8t pas\u2026 Sara es per aqu\u00f2 la protagonista dins
  la vida de Josep Maria pendent \u013eochena pellicula. Dins la pellicula \u201cPlanetes
  IX: V\u00f2li te desbrembar mas p\u00f2di pas\u201d Sara apareisser\u00e0 tornarmai,
  e aquela ne ser\u00e0 benl\u00e8u la si\u00e1 darri\u00e8ra aparicion (en rason
  de la n\u00f2va relacion entre Josep Maria e Alara).\\nPaula Enfanten es un personatge
  de \u013euniv\u00e8rs espandit de Planetes. \u013didentitat de Paula exist\u00eds
  vertadi\u00e8rament pas: \u00e8ra inicialament Selena Gomez del passat e de \u013euniv\u00e8rs
  miralh, e fogu\u00e8t enviada per \u013eEmperaire de \u013eEmp\u00e8ri Terran enr\u00e8
  dins lo temps fins a \u013ean 2008 e dins \u013euniv\u00e8rs normal, a Barcelona
  (Catalonha) ont i fengu\u00e8t \u010f\u00e8sser una escolana \u010fail\u00e0. E
  lo 2012, Selena deuri\u00e1 tornar al passat (2008) e comen\u00e7ar una gu\u00e8rra
  contra los subreviventes teremedosians, aliats amb la planeta Vulcan dins \u013eUnion
  Teremedovulcaniana. Quand Josep Maria 15 de \u013euniv\u00e8rs miralh decidigu\u00e8t
  qu\u2019esborrari\u00e1n la mem\u00f2ria de Paula per cambiar \u013eist\u00f2ria
  de Selena e per far que tota la gu\u00e8rra dins \u013euniv\u00e8rs miralh aja pas
  jamai existit, los ofici\u00e8rs de la nau FEF 07 agu\u00e8ron un afrontament amb
  la regenta Andrea dins aquela n\u00f2va linha temporala de \u013euniv\u00e8rs miralh.
  Paula Enfanten recuper\u00e8t la si\u00e1 mem\u00f2ria esborrada per \u0130hi Kadse
  de \u013euniv\u00e8rs normal, mas los ofici\u00e8rs de la FEF capit\u00e8ron \u010farrestar
  e \u010fempresonar Paula sus Teremed\u00f3, e cregu\u00e8ron qu\u2019avi\u00e1n
  derrotat Andrea apr\u00e8s qu\u2019ela fogu\u00e8sse supausadament m\u00f2rta quand
  lo sieu elicopt\u00e8r sabotejat tomb\u00e8t sus la mar. Pr\u2019amor que Paula
  \u00e8ra pas sus la T\u00e8rra mas dins una preson a B\u00e0rcinon, al comen\u00e7ament
  los ofici\u00e8rs de la FEF daiss\u00e8ron un olograma sus la T\u00e8rra amb la
  si\u00e1 apar\u00e8ncia, mas lo program\u00e8ron per cambiar a una apar\u00e8ncia
  despari\u00e8ra, per evitar que las gents s\u2019avis\u00e8sson que Paula Enfanten
  \u00e8ra una version mai jove de Selena de \u013euniv\u00e8rs miralh. Mas \u013eolograma
  vengu\u00e8t instable, e sollicit\u00e8ron per aqu\u00f2 qualque tipe de substitucion.
  Una dr\u00f2lla orfan\u00e8la teremedosiana s\u2019ofrigu\u00e8t a substituir Paula
  Enfanten sus la T\u00e8rra e a i viure coma una dr\u00f2lla umana de Barcelona,
  mas sens remembrar la si\u00e1 vida originala sus Teremedo. Los ofici\u00e8rs de
  la FEF li esborr\u00e8ron alara la mem\u00f2ria, e sus la T\u00e8rra i a ara una
  dr\u00f2lla teremedosiana en i vivent coma Paula Enfanten. E Andrea sap pas qu\u2019aquesta
  Paula Enfanten es vertadi\u00e8rament una dr\u00f2lla orfan\u00e8la teremedosiana.
  La si\u00e1 apar\u00e8ncia es ara plan despari\u00e8ra \u010faquela de Selena: p\u00f2rta
  de lunetas e se pinta de c\u00f2ps los pels de jaune coma una dr\u00f2lla blonda,
  mas es encara tan polida coma Selena.\\nAmelia Granados, nomenada Millie pels sieus
  amics, es un personatge fictiu del limb qu\u2019apareis pas que dins la pellicula
  \u201cPlanetes VIII: Te refarai la ti\u00e1 vida\u201d e dins una pellicula \u010fadults
  extra de \u013euniv\u00e8rs espandit de Planetes. La si\u00e1 apar\u00e8ncia fisica
  es basada sus aquela de Paula Enfanten. Millie ven de Buenos Aires, Argentina, mas
  viu a Barcelona amb los sieus parents. Millie apareis pel primi\u00e8r c\u00f2p
  dins \u013eochena pellicula de Planetes, ont ela e Ayl\u00edn Segura (una autra
  dr\u00f2lla imagin\u00e0ria amb \u013eapar\u00e8ncia \u010funa dr\u00f2lla reala
  nomenada Carla) i son materializadas per Alxy Frankz dins lo mond real. Las doas
  dr\u00f2llas tr\u00f2ban lo Josep Maria 26 original, se n\u2019enamoran e tant \u013euna
  que \u013eautra lo potonan fin finala abans de tornar dins lor mond imaginari a
  trav\u00e8rs dels escan\u00e8rs quand 0 emplega lo programa de limbizacion \u010f\u0130hi
  Kadse per las enviar tornarmai dins lo limb, pr\u2019amor qu\u2019aquelas dr\u00f2llas
  venon exactament de \u013eimaginacion de 26. 0 va al superordenador situat dins
  \u013eanciana esc\u00f2la de 26 e descobr\u00eds qu\u2019Alxy Frankz e una version
  alternativa de Carla que vengu\u00e8t dolenta an evitat que Josep Maria agu\u00e8s
  de n\u00f2vas relacions amb de dr\u00f2llas apr\u00e8s talhar amb \u0130hi, mas
  li empedigu\u00e8ron pas de capitar de far una fusion mentala amb la si\u00e1 professora
  de s\u00e8rbe, Sara Andrejevi\u0107. Eles fogu\u00e8ron tamben los responsables
  de substituir la sir\u00e8na Alexandra e totes los sieus filtres de percepcion per
  de personas realas, en extrasent la vida de gents a \u013eazard. Es a dire, Alexandra
  es pas mai una sir\u00e8na ni i a pas risc que morisca s\u2019\u00f2m li parla de
  sir\u00e8nas. Eles fagu\u00e8ron de mai qu\u2019Alexandra vengu\u00e8sse dins lo
  mond real e que cambi\u00e8sse tant la vida dels membres de la gl\u00e8isa evangelica.
  0 ditz a 26 que crei que las doas dr\u00f2llas imaginari lo poton\u00e8ron per li
  traire \u010finformacions mentre el \u00e8ra distrach. E dins una esf\u00e8ra de
  transp\u00f2rt de \u013euniv\u00e8rs miralh, Alxy Frankz confirma las sosp\u00e8chas
  de 0: emplegar\u00e0n \u013einformacion qu\u2019an obtengut amb lo poton per atacar
  Teremed\u00f3. En mai \u010faquesta aparicion dins \u013eochena pellicula oficiala
  de Planetes, Millie Granados apareis tanben dins una pellicula \u010fadults annexada
  a la saga, mas adaptada totalament a \u013euniv\u00e8rs de Millie.\\nKarla Mor\u00e1n
  es la dr\u00f2lla mai polida sus la T\u00e8rra (mas dins \u013euniv\u00e8rs la mai
  polida n\u2019es Alara, una dr\u00f2lla extraterr\u00e8stra de la planeta Xelaya).
  Se mencion\u00e8t dins lo film \u201cPlanetes VI: Sol dins un mond normal\u201d
  que Karla Mor\u00e1n es una anciana companha de Josep Maria a \u013eesc\u00f2la
  quand avi\u00e1n 11 ans, pr\u2019amor que totes dos estudi\u00e8ron amassa dins
  \u013eesc\u00f2la ont i \u00e8ran tanben los mainats que fogu\u00e8ron s\u00e8t
  ans mai \u010fora atrapats dins Tek\u00f2da pels bursians, mas ela i estudi\u00e8t
  pas que dins lo darri\u00e8r cors.\\nDins lo darri\u00e8r epis\u00f2di de S\u00e8riaStar4
  nomenat \u201cFin\u201d s\u2019i veg\u00e8t un univ\u00e8rs alternatiu visitat per
  la viatg\u00e8ra del temps Nayeli Encarnaci\u03ccn Garc\u00eda, ont Karla Mor\u00e1n
  e Josep Maria i sorti\u00e1n amassa. Aquela fogu\u00e8t la primi\u00e8ra aparicion
  de Karla Mor\u00e1n dins la cronologia de produccion de Planetes e de las si\u00e1s
  s\u00e8rias derivadas.\\nLa si\u00e1 version de \u013euniv\u00e8rs miralh apareis
  dins lo tresen epis\u00f2di de la quatrena sason de Causas de S\u00f2rs (\u013eepis\u00f2di
  27n) nomenat \u201cPr\u2019amor que v\u00f2li\u201d ont s\u2019i rev\u00e8la qu\u2019ela
  fasi\u00e1 partida de \u013earmada de dr\u00f2llas de Yusma e qu\u2019apr\u00e8s
  la si\u00e1 m\u00f2rt ela demor\u00e8t jol comandament de las versions de \u013euniv\u00e8rs
  miralh de Mila e de Lorena. Per arrestar la regenta Andrea e Jordi Alejos Garc\u00eda,
  Mila viatja a \u013euniv\u00e8rs normal amb Karla, amb Lorena e amb doas dr\u00f2llas
  de mai nomenadas Mariam e Marta, en n\u2019essent aquela darri\u00e8ra quala a mai
  \u00f2di contra Andrea, pr\u2019amor qu\u2019Andrea tu\u00e8t la dr\u00f2lla que
  li agradava a ela, Cl\u00e0udia Kacely, mas Cl\u00e0udia \u00e8ra la parten\u00e0ria
  \u010fAndrea, e aquel amor \u00e8ra doncas impossible. Malgrat ai\u00e7\u00f2, Marta
  es una tra\u00efdora e mentissi\u00e1, pr\u2019amor que trabalhava vertadi\u00e8rament
  secretament al b\u00f2rd \u010fAndrea. Quand Mila envia Karla e Mariam a \u013eostal
  \u010fAndrea per esprovar \u013eid\u00e8a de Marta qu\u2019\u00e8ra vertadi\u00e8rament
  una trap\u00e8la, Andrea tua rapidament las doas dr\u00f2llas just quand i arriban
  a la p\u00f2rta de c\u00f2 \u010fela. Andrea contacta la nau FEF 07 sus la pantalha,
  lor m\u00f2stra los c\u00f2sses de Mariam e de Karla, e lor informa que los daissar\u00e0
  dins un lu\u00f2c def\u00f2ra de la proteccion de c\u00f2 sieu, dins lo cas ont
  los ofici\u00e8rs de la nau los v\u00f2lgan transportar a b\u00f2rd. Decidisson
  fin finala \u010fenterrar los c\u00f2sses a \u013eespaci.\\nDins la pellicula \u201cPlanetes
  VII: La fin \u010fun futur\u201d, 24 se barra dins una cambra olografica sus la
  nau 07 e i activa un olograma en forma de Karla Mor\u00e1n, que fa una fusion mentala
  a 24 e se potonan de contunh. I a pas cap de fons, s\u2019i vei lo fons jaune de
  la cambra olografica. I apareis subitament una autra dr\u00f2lla que ditz: \u201cTe
  p\u00f2di potonar tanben ieu?\u201d. 24 la garda e vei qu\u2019es Lorena de \u013euniv\u00e8rs
  miralh que ditz a 24 e a 0 que lo colpable de la destruccion de \u013euniv\u00e8rs
  miralh es estat Alxy Frankz, e qu\u2019ela es la darri\u00e8ra persona viva \u010faqueste
  univ\u00e8rs. Informa alara als ofici\u00e8rs de la nau que se n\u2019anar\u00e0
  sus una autra planeta que lor p\u00f2t pas dire e que \u201cdesapareisser\u00e0\u201d
  per totjorn. Mai tard dins la meteissa pellicula, Karla Mor\u00e1n es mencionada
  quand Panda explica qu\u2019abans de la si\u00e1 primi\u00e8ra regeneracion e qu\u2019abans
  de venir un Senhor del Temps, mentre \u00e8ra a B\u00e0rcinon pr\u2019amor que lo
  perseguissi\u00e1 la pol\u00edcia, an\u00e8t dos c\u00f2ps dins la cambra olografica
  \u010faquela vila. Dins la primi\u00e8ra simulacion i poton\u00e8t Andrea, e dins
  la segonda simulacion i poton\u00e8t Karla Mor\u00e1n. Sandra i \u00e8ra tanben
  dins la segonda simulacion, e Panda rev\u00e8la que biqu\u00e8t tanben las doas
  dr\u00f2llas dins la segonda simulacion. Karla Mor\u00e1n apareis pel darri\u00e8r
  c\u00f2p dins la pellicula \u201cPlanetes VIII: Te refarai la ti\u00e1 vida\u201d:
  en vesent que lo sieu fraire 0 patissi\u00e1 f\u00f2r\u00e7a apr\u00e8s la desbranda
  \u010fAlxy Frankz, 26 prepara un plan: v\u00f2l trobar una mani\u00e8ra de ficar
  tot lo 07 amb 0 e Franny a b\u00f2rd indefinidament dins una granda cambra olografica
  sus la planeta Teremed\u00f3 e lor far creire que la simulacion es la realitat.
  Per \u00e8sser segur que lor p\u00f2t far creire que fan partida de la simulacion,
  26 s\u2019aplica aquel proc\u00e8s a se meteis e executa lo meteis programa olografic
  que Panda emplegu\u00e8t dins \u013eautra linha temporala per gausir plan abans
  de comen\u00e7ar los sieus viatges dins lo temps.\\nPatr\u00edcia es \u013eunica
  dr\u00f2lla que potonava Josep Maria sus la boca sens probl\u00e8mas pendent lors
  rescontres e li fasi\u00e1 tanben de fusions mentalas, malgrat qu\u2019\u00e8ran
  pas un coble, mas ela o li fasi\u00e1 pr\u2019amor que n\u2019\u00e8ra enamorada
  (fins qu\u2019ela descobrigu\u00e8t qu\u2019el \u013eutiliz\u00e8t per far creire
  a Sara Andrejevi\u0107 qu\u2019avi\u00e1 una autra n\u00f2via e cop\u00e8ron lor
  relacion). Fogu\u00e8t diagnosticada amb lo sindr\u00f2me \u010fAsperger.\\nSandra
  avi\u00e1 agut una amiga que se sona Carol, e pendent aquela amistat, Carol fagu\u00e8t
  una fusion mentala a Josep Maria 21 tres c\u00f2ps pendent la primi\u00e8ra mitat
  de \u013ean 2017. Aquela Carol es pas Carol Gonz\u00e1lez, \u013eamiga e aliada
  de Selena Gomez dins \u013euniv\u00e8rs miralh. Una autra dr\u00f2lla nomenada Cristina
  fagu\u00e8t una fusion mentala a Josep Maria 22 a la fin \u010fabril del 2018, pendent
  \u013eunic rescontre qu\u2019agu\u00e8ron en persona. A la fin de febri\u00e8r del
  2020, Josep Maria 24 capit\u00e8t de far una fusion mentala a una dr\u00f2lla nomenada
  Fl\u00f2ra, una de las \u201cWinx de la T\u00e8rra\u201d, malgrat qu\u2019aquela
  fusion mentala dur\u00e8t mens \u010fun segond.\\nTres gitanas que fagu\u00e8ron
  tanben una fusion mentala a Josep Maria 25. Lorena \u00e8ra estada amiga de Sandra
  coma Carol e D\u00e0lia, mas \u013eamistat entre Laura Hern\u00e1ndez e Josep Maria
  fagu\u00e8t que Lorena fagu\u00e8sse una fusion mentala a 25 en 2020 del temps qu\u2019i
  \u00e8ra bandada, pr\u2019amor qu\u2019abans li n\u2019avi\u00e1 pas jamai fach
  cap. Laura li avi\u00e1 ja fach de fusions mentalas tres jorns abans, pr\u2019amor
  qu\u2019avi\u00e1n comen\u00e7at una granda amistat mas aquela amistat se cop\u00e8t
  quand 25 veg\u00e8t qu\u2019ela \u013eengar\u00e7ava e \u013eengusava: Laura lo
  voli\u00e1 pas que pels sieus s\u00f2us (li pan\u00e8t 150\u20ac en escambi de se
  potonar suls p\u00f2ts e ni compligu\u00e8t la si\u00e1 part del tracte ni li v\u00f2l
  retornar los s\u00f2us). E Alba li\u2019n fagu\u00e8t una \u201cjos \u013e\u00f2rdre
  de Lorena\u201d e pr\u2019amor qu\u2019\u00e8ra tanben bandada.\\nEs una amiga eq\u00fcatoriana
  de Josep Maria qu\u2019estudiava amb Josep Maria pendent lo bachillerat. Fa partida
  \u010funa autra gl\u00e8isa evangelica mas lo sieu comportament es coma aquel \u010funa
  dr\u00f2lla comuna e mod\u00e8rna. Li fascinan los mormolhs e las brusors, e en
  rason de lor amistat s\u2019inter\u00e8ssa totjorn per \u00e7\u00f2 que Josep Maria
  fa. La si\u00e1 version dins \u013euniv\u00e8rs fictiu de \u013eimaginacion de Josep
  Maria es pari\u00e8ra a la version originala: dins aquel univ\u00e8rs que se tr\u00f2ba
  dins lo limb, Josep Maria envi\u00e8t a Sheyla una f\u00f2to amb Ayl\u00edn en dormint
  tranquillament sus la camba \u010fel a \u013eostal \u010fAyl\u00edn a las 6 del
  matin. Mentre Sheyla estudiava amb Josep Maria ela e una autra dr\u00f2lla fogu\u00e8ron
  de \u201cSequoias\u201d contarotladas per Erika, fins que fogu\u00e8ron liberadas
  pels poders de la Creacion \u010fAur. Apr\u00e8s acabar lo bachillerat Josep Maria
  li voli\u00e1 far una fusion mentala (ela e Marta fogu\u00e8ron las primi\u00e8ras
  qu\u2019o lor demand\u00e8t), mas o atenhi\u00e1 pas. Sheyla comenc\u00e8t una relacion
  amb un dr\u00f2lle que n\u2019es a \u013eora \u010fara lo n\u00f2vi e vivon amassa
  a Molins de Rei. Lo 2015 lor amistat acab\u00e8t quand Sheyla interpret\u00e8t mal
  la peticion de Josep Maria de far una fusion mentala. Cinc ans mai tard, Josep Maria
  e Sheyla recuper\u00e8ron gradualament \u013eamistat, e 25 li expliqu\u00e8t tota
  la si\u00e1 situacion actuala amb Sara Andrejevi\u0107, en essent ela dempu\u00e8i
  alara quala sap mai \u00e7\u00f2 qu\u2019arriba amb Sara. Pendent aquel rescontre
  25 li torn\u00e8t demandar que li fagu\u00e8sse una fusion mentala, mas Sheyla contunhava
  \u010fo interpretar mal en cresent que \u00e7\u00f2 que voli\u00e1 \u00e8ra se far
  una f\u00f2to en fasent la fusion mentala all\u00f2c de la far simplament. Pass\u00e8ron
  tres meses que 25 la voli\u00e1 veire en persona, fins que \u013e11 de decembre
  del 2020 pact\u00e8ron de se veire a Molins de Rei. 25 parqu\u00e8t misteriosament
  davant \u013eostal \u010fela sens saber encara ont i vivi\u00e1, e caminava per
  un quarti\u00e8r concr\u00e8t del p\u00f2ble coma se li fogu\u00e8sse familial e
  coma s\u2019i fogu\u00e8sse estat f\u00f2r\u00e7a de c\u00f2ps, mas s\u2019i trobava
  vertadi\u00e8rament ail\u00e0 pel primi\u00e8r c\u00f2p: apr\u00e8s Alexandra e
  M\u00edriam, Sheyla \u00e8ra la tresena dr\u00f2lla que 25 senti\u00e1 amb ela un
  ligam mental. Quand se trob\u00e8ron, an\u00e8ron als entorns del p\u00f2ble ont,
  apr\u00e8s parlar \u010fautras causas, Sheyla i decidigu\u00e8t fin finala de far
  una fusion mentala a 25.\\n- Rosmeris Segura: Es una dr\u00f2lla de la meteissa
  gl\u00e8isa evangelica de Lorena e \u010fAlexandra, cosina \u010faquesta darri\u00e8ra.
  Quand Josep Maria s\u2019enamor\u00e8t \u010fAlexandra en rason \u010fun ligam de
  sir\u00e8na, volgu\u00e8t amagar a totes que li agradava Alexandra e decidigu\u00e8t
  \u010femplegar lo met\u00f2de \u010f\u0130hi Kadse que consist\u00eds a dire que
  li agrada una dr\u00f2lla despari\u00e8ra quand li agrada vertadi\u00e8rament pas,
  per los despistar e per los far quitar de pensar que li agrada Alexandra. Comenc\u00e8t
  per aqu\u00f2 a dire a totes los membres de la gl\u00e8isa a \u013eexcepcion \u010fa
  Melvin que li agradava una autra dr\u00f2lla. Josep Maria 20 lor mostr\u00e8t al
  comen\u00e7ament una f\u00f2to amb Sandra e lor digu\u00e8t que li agradava aquela
  dr\u00f2lla, mas lor digu\u00e8t qu\u2019aquela dr\u00f2lla se sonava \u201cLyla
  Schaeffer\u201d (en prenent lo nom de la cosina biologica \u010fAlexandra, una sir\u00e8na
  nomenada Lyla, e lo nom de familha \u010fAelita Schaeffer, un personatge de ficcion
  \u010funa s\u00e8ria televisada animada francesa nomenada C\u00f2di Lyoko). Pasmens,
  los membres de la gl\u00e8isa cresi\u00e1n encara qu\u2019a Josep Maria li agradava
  tanben Alexandra. Comprengu\u00e8t per aqu\u00f2 que li cali\u00e1 escu\u00e9lher
  una dr\u00f2lla de la gl\u00e8isa all\u00f2c \u010faquela que digu\u00e8t, e escuelh\u00e8t
  doncas Rosmeris pr\u2019amor qu\u2019\u00e8ra per el laja. Mas arrib\u00e8t una
  causa inesperada: Josep Maria 20 s\u2019enamor\u00e8t vertadi\u00e8rament de Rosmeris
  tanben. Decidigu\u00e8t per aqu\u00f2 de partir de la gl\u00e8isa, pr\u2019amor
  que \u00e7\u00f2 que comenc\u00e8t a sentir per Rosmeris vengu\u00e8t (e es encara)
  quitament mai f\u00f2rt que \u00e7\u00f2 que senti\u00e1 per Alexandra.\\n- Ayl\u00edn
  Segura: Es una dr\u00f2lla fictiva basada sus \u013eapar\u00e8ncia fisica \u010funa
  dr\u00f2lla reala nomenada Carla qu\u2019estudi\u00e8t dins la meteissa esc\u00f2la
  de Josep Maria mas dins un cors inferior e que fogu\u00e8t la melhora amiga de Sara
  Mart\u00ed doncas qu\u2019\u00e8ran dins la meteissa sala. Dins \u013euniv\u00e8rs
  miralh, aquesta Carla fogu\u00e8t una dels partenaris \u010fAndrea que morigu\u00e8t
  quand Andrea empoison\u00e8t qualques dr\u00f2llas de \u013eesc\u00f2la \u201cLos
  dem\u00f2nis del lunf\u00e8rn\u201d abans de destruir \u013eenti\u00e8ra esc\u00f2la.
  Mas dins un univ\u00e8rs de ficcion dins lo limb basat sus \u013eimaginacion de
  Josep Maria, Ayl\u00edn es un membre de la gl\u00e8isa evangelica de Lorena e \u010fAlexandra,
  cosina s\u00f2r de Rosmeris e cosina segonda \u010fAlexandra. Ayl\u00edn es \u00be
  andalosa (de Cadis) e \u00bc afro-americana (pr\u2019amor que lo pepin de Rosmeris
  e \u010fAyl\u00edn ven de la Republica Dominicana). Estudi\u00e8t tanben dins la
  meteissa esc\u00f2la que la si\u00e1 version del mond real, e fogu\u00e8t tanben
  companha \u010fesc\u00f2la e amiga de Sara Mart\u00ed. Mas la melhora amiga actuala
  de Carla nomenada Alba, qu\u2019estudi\u00e8t tanben dins la meteissa sala de Carla
  e de Sara, dins \u013euniv\u00e8rs fictiu se sona Carla, pr\u2019amor que Carla
  s\u2019i sona Ayl\u00edn. Dins aquel univ\u00e8rs imaginari, Ayl\u00edn e Josep
  Maria son f\u00f2r\u00e7a amics e s\u2019i fan quitament de fusions mentalas coma
  lor pr\u00f2pria salutacion: Ayl\u00edn vesi\u00e1 Josep Maria coma un fraire pichon
  e en mai \u010fai\u00e7\u00f2 ela fa aquela salutacion amb totes lors membres de
  la si\u00e1 familha, decidigu\u00e8t per aqu\u00f2 que lo saludari\u00e1 tanben
  \u010faqueste biais). Rosmeris \u010faquel univ\u00e8rs revengu\u00e8t los sentiments
  de Josep Maria mas s\u2019embuf\u00e8t amb Josep Maria e amb Ayl\u00edn quand comenc\u00e8t
  a creire que la si\u00e1 cosina Ayl\u00edn avi\u00e1 benl\u00e8u tanben revengut
  los sentiments de Josep Maria mas en secr\u00e8t quand Josep Maria e Ayl\u00edn
  se poton\u00e8ron suls p\u00f2ts dins una cerem\u00f2nia de lor gl\u00e8isa e danc\u00e8ron
  mai tard en se fasent una fusion mentala davant Rosmeris pendent una estona dins
  la f\u00e8sta \u010fanniversari de Rosmeris a \u013eostal \u010fAyl\u00edn. Totun,
  Ayl\u00edn o fasi\u00e1 pas que per \u010famistat e quitament per de frairesa, doncas
  que coma Alexandra digu\u00e8t plan, \u201cAyl\u00edn a ficat Josep Maria dins la
  z\u00f2na \u010famics\u201d.\\n- Sara Mart\u00ed: Estudi\u00e8t dins la meteissa
  esc\u00f2la de Josep Maria mas dins un cors inferior. Quand Josep Maria avi\u00e1
