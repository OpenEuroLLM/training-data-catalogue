  Dins la pellicula Planetes VII: La fin \u010fun futur, dins una linha temporala
  alternativa ont 0 e Sandra i morigu\u00e8ron, Josep Maria 24 prengu\u00e8t \u013eolo-emissor
  mobil dempu\u00e8i \u010font i sorti\u00e1 la projeccion de la dobla olografica
