sample: '["\"Bazien\\nBazien es una comuna francesa, situada dins lo departament dels
  V\u00f2ges e la region de Lorena.\\nSomari\\nGeografia[modificar | modificar la
  font]\\nComunas vesinas[modificar | modificar la font]\\nIst\u00f2ria[modificar
  | modificar la font]\\nBazien Fasi\u00e1 partida del ban de Nossoncourt e aperteni\u00e1
  al bailliage de Lun\u00e9ville. Existissi\u00e1 antany una cap\u00e8la en la municipalitat,
  mas s''i tr\u00f2ba pas gl\u00e8isa. Jean-Baptiste es lo sant patron del p\u00f2ble.
  A l''esperital, Bazien d\u00e9pendait de la curaci\u00f3 de Nossoncourt.\\nDe 1790
  a l''an IX, Bazien i avi\u00e1 compr\u00e9s en lo costat de Nossoncourt.\\nBazien
  faisait partie du ban de Nossoncourt et appartenait au bailliage de Lun\u00e9ville.
  Il existait autrefois une chapelle dans la commune, mais on n\u2019y trouve pas
  d\u2019\u00e9glise. Jean-Baptiste est le saint patron du village. Au spirituel,
  Bazien d\u00e9pendait de la cure de Nossoncourt.\\nDe 1790 \u00e0 l\u2019an IX,
  Bazien \u00e9tait comprise dans le canton de Nossoncourt.\\nAdministracion[modificar
  | modificar la font]\\nDemografia[modificar | modificar la font]\\nLu\u00f2cs e
  monuments[modificar | modificar la font]\\nPersonalitats ligadas amb la comuna[modificar
  | modificar la font]\\nV\u00e9ser tanben[modificar | modificar la font]\\nLigams
  ext\u00e8rnes[modificar | modificar la font]\\nN\u00f2tas[modificar | modificar
  la font]\"", "\"29 juin 2011\\nPer aqueles qu''an mancat un espis\u00f2di e que
  son encara a se demandar qual es lo sens de l''univ\u00e8rs, vaqu\u00ed l''integrala_de_las_Aventuras_del_Star_Trufa.
  L''estiu es plan lo temps de las redifusions, non ? Anem, i aur\u00e0 d''autres
  epis\u00f2dis a la dintrada (o benl\u00e8u pas, veirem ben).\\n07 juin 2010\\nEsp\u00f2c,
  Totd\u00f3s e L\u00e8ul\u00e8u an descoberta una bauma misteriosa, amb de creaturas
  afrosas que se p\u00f2t pas dire. D''efi\u00e8ch, de c\u00f2p que i a, val mai se
  calar...\\nPer dintrar es aic\u00ed : Star_Trufa_6\\n30 mai 2010\\nLo coisini\u00e8r
  del Star Trufa compta una nombrosa marmalha. Amb aqu\u00f2, lo manjar se p\u00f2t
  plan dire qu''es colectiu !\\nA taula ! : Star_Trufa_5\\n24 mai 2010\\nAqueste c\u00f2p,
  Esp\u00f2c e L\u00e8ul\u00e8u fan un pauc de torisme.\\nPer la visita es aici :
  Star_Trufa_4\\n14 mai 2010\\nVos sentissetz flaconet, patracon, tilh\u00f3s... colpable
  de quic\u00f2m, de segur, mas de qu\u00e9 ? Coma los de la c\u00f2la del Star Trufa,
  benl\u00e8u qu''auriatz plan besonh d''un psi.\\nLo tresen epis\u00f2di es aic\u00ed
  : Star_Trufa_3\\n12 mai 2010\\nS''en passan de causas dins lo Star Trufa ! Lo capitani
  canta, lo segond s''afana e lo mecanician se despacienta. Aqueste c\u00f2p, se trata
  d''un ordenator desvariat e d''un vegetal subredotat...\\nPel segond epis\u00f2di,
  clicatz sus Star_Trufa_2\\n06 mai 2010\\nE \u00f2c ! L\u2019avenir de l\u2019occitan
  es dins lo cosm\u00f2s ! Se vos pensatz qu''es pas possible, es que pichons avetz
  pas pro agachat de siencia-ficcion. Alara, sens cr\u00e9nher ges de proc\u00e8s,
  La Cabra e lo Lop Prod. son anats panar dins los classics : La Guerra de las Estelas
  e La Passejada de las Estelas (en globisch lengatge : Star Wars & Star Trek).\\nAqu\u00ed
  donc lo Primi\u00e8r_epis\u00f2di_de_las_aventuras_del_Star_Trufa\\nE n\u2019i aur\u00e0
  d\u2019autres !\"", "\"Sus eth proc\u00e8s der autogov\u00e8rn aran\u00e9s.\\nEth
  proc\u00e8s entath reconeishement autonomic aran\u00e9s se hargu\u00e8c enes ans
  80 en un moviment vesiau de participacion ciutadana, nomentat Es Ter\u00e7ons. Aguest
  moviment inici\u00e8c tot un am\u00e0s d\u2019accions civiques e politiques ent\u00e0
  pr\u2019amor de possar eth reconeishemnet dera realitat politica, culturau e istorica
  d\u2019Aran, dauant es ciutadans e des naues institucions democratiques.\\nAguest
  siguec probablament, un des moments m\u00e8s importants dera ist\u00f2ria d\u2019Aran,
  perqu\u00e9 permetec h\u00e8r a cr\u00e9isher un sentiment sociau a favor d\u2019ua
  realitat politica e culturau que, desp\u00fas, en tot passar es ans, aurie de convertir-se
  en ua lei especifica aprovada peth Parlament de Catalunya en junh de 1990.\\nAguesta
  Lei permetec era reinstauracion deth Conselh Generau d\u2019Aran en an 1991, ua
  institucion qu\u2019aur\u00e0, a compdar d\u2019alavetz, era responsabilitat d\u2019amiar
  eth proc\u00e8s de desvolopament d\u2019aguesta autonomia e velhar pera preservacion
  dera lengua e era cultura d\u2019Aran, coma elements m\u00e8s significatius dera
  sua identitat.\\nPassadi onze ans des dera reinstauracion deth prum\u00e8r Conselh
  Generau d\u2019Aran, e dotze des dera aprobacion dera lei de regim especiau, ja
  ei possible h\u00e8r ua reflexion sus eth conjunt d\u2019aguesti ans d\u2019evolucion
  dera autonomia aranesa, es s\u00f2ns enc\u00e8rts e e es s\u00f2ns errors. M\u00e8s,
  sustot e \u00e7\u00f2 m\u00e8s important, ei era reflexion sus es bases sus es quaus
  es aranesi v\u00f2len bastir eth s\u00f2n futur e de quina man\u00e8ra p\u00f2den
  participar en aguest bastiment.\\nAran viu au\u00e9 un momnet istoric en quau, desp\u00fas
  d\u2019art\u00e9nher ua importanta c\u00f2ta de reconeishement politic e d\u2019autonomia
  en s\u00f2n gov\u00e8rn, se tr\u00f2be damb era parad\u00f2xa d\u2019auer ues institucions
  incapaces de generar illusion e de practicar ua politica de vertebracion sociau
  qu\u2019implique ath conjunt dera societat aranesa damb totes es sues complexitats.
  Era dimension d\u2019Aran coma p\u00f2ble e coma pa\u00eds non p\u00f2t demorar
  redusida ara vision partid\u00e0ria e parciau d\u2019un gov\u00e8rn, sigue deth
  signe politic que sigue, e plan especiaument d\u2019un partit. Era dimension d\u2019un
  pa\u00eds, des d\u2019ua perspectiva sociau e politica, a de reflexar-se ena vitalitat
  dera sua societat civila, dera sua capacitat d\u2019autoorganizar-se e plan especiaument,
  ena sua capacitat de participar e opinar des dera pluralitat, ent\u00e0 \u00e8ster
  autocritica damb era realitat que l\u2019entore, perqu\u00e9 aguesta ei era unica
  forma possibla d\u2019auan\u00e7ar e cr\u00e9isher coma societat e coma p\u00f2ble.
  Resulte pro evident qu\u2019eth mod\u00e8l actuau non ei satisfact\u00f2ri. Un Gov\u00e8rn
  deth Conselh Generau basat en presidencialisme m\u00e8s absolut, damb nulla participacion
  des entorns sociaus, e nulla transpar\u00e9ncia ena gestion, h\u00e8n a pensar qu\u2019aguest
  mod\u00e8l amiar\u00e0 as aranesi ara frustracion en non guaire temps.\\nPer diferentes
  rasons, m\u00e8s plan especiaument pes dimensions deth pr\u00f2pri pa\u00eds, des
  sues dinamiques endog\u00e8nes e tanben pera mendra participacion politica e p\u00f2gui
  mieis des partits, era politica demore marginada en espacis molt criptics e damb
  p\u00f2ga capacitat de difusion. Ua realitat que tanben a estat auspiciada peth
  partit deth Gov\u00e8rn que non a mostrat cap d\u2019inter\u00e8s en impulsar naues
  formules de comunicacion e debat sociau, m\u00e8s enl\u00e0 de \u00e7\u00f2 qu\u2019\u00e8re
  controtlat o controtlable politicament. Aguest h\u00e8t h\u00e8 que non i age au\u00e9
  un espaci perfilat ent\u00e0 h\u00e8r possible ua estructuracion nacionau deth debat
  politic aran\u00e9s, m\u00e8s enl\u00e0 des pr\u00f2pries institucions e per tant,
  es ciutadans son au\u00e9 simples espectadors d\u2019ua construccion nacionau qu\u2019aurie
  d\u2019\u00e8ster dub\u00e8rta e participativa, e que, malerosament, a esdevengut
  un nepotisme.\\nEn aguest sentit, era evolucion dera societat aranesa en aguesti
  ans a patit importantes e nombroses transformacions. Ues transformacions autant
  economiques com sociaus que li an balhat, pera diuersitat dera proced\u00e9ncia
  dera sua poblacion, ua complexitat m\u00e8s grana que non auie era societat des
  ans 80. Era pres\u00e9ncia d\u2019ua immigracion constanta e ara tanben, com per
  tot, damb difer\u00e9ncies culturaus e religioses m\u00e8s notables qu\u2019enes
  decades anteriores, h\u00e8 a pensar qu\u2019ei de besonh auan\u00e7ar en ua reflexion
  plan importanta sus eth mod\u00e8l identitatri deth pa\u00eds, sus coma h\u00e8r
  possible qu\u2019era difer\u00e9ncia culturau sigue un valor que se transforme en
  un actiu t\u00e0 ua societat que v\u00f2 \u00e8ster fid\u00e8u a ua identitat diferenciada
  e pr\u00f2pria.\\nTanp\u00f2c se p\u00f2den desbrembar, en aguest sentit, es r\u00e8ptes
  economics, era sostenibilitat des recorsi e es grani r\u00e8ptes en \u00e0mbit dera
  solidaritat territoriau e sociau. Tanplan que parlam d\u2019ua societat sense gr\u00e8us
  probl\u00e8mes, totun serie absurd pensar qu\u2019es c\u00f2tes de riquesa deth
  pa\u00eds son motiu sufisent ent\u00e0 pensar que s\u2019an artenhut toti es r\u00e8ptes
  politics e sociaus desirables. Aran a encara molt per h\u00e8r, especiaument enes
  \u00e0mbits de creishement deth conjunt dera sua societat ena plenitud que serie
  desirable en s\u00e8gle XXI, e en profitament dera sua riquesa, non en t\u00e8rmes
  especulatius senon collectius. Auem encara au\u00e9 importantes car\u00e9ncies culturaus,
  d\u2019implicacion damb es moviments exteriors de solidaritat, de coesion e estructura
  sociau. Eth pa\u00eds contunhe en tot auer gr\u00e8us mancances en encastre der
  ensenhament e molt especiaument des sues infraestructures. Auem un seri\u00f3s probl\u00e8ma
  de despoblacion de quauqui nucl\u00e8us aluenhats dera N.230 e plan especiaument
  ua depend\u00e9ncia l\u00e8u l\u00e8u exclusiva deth torisme e sustot deth torisme
  de nh\u00e8u e ath viatge ua manca de mercat laborau ent\u00e0 persones qualificades
  e sense estacionalitats.\\nAguestes son sonque quauqu\u2019ues des questions qu\u2019eth
  pa\u00eds e eth s\u00f2n Gov\u00e8rn an d\u2019abordar de forma immediata. Sense
  dubte, n\u2019i a d\u2019autes tanben d\u2019import\u00e0nica. Aguest document totun,
  non v\u00f2 tant nomentar es problematiques senon d\u00edder com abordar-les e veir
  com s\u2019impliquen es ciutadans d\u2019un pa\u00eds com eth n\u00f2ste ena construcccion
  d\u2019un determinat mod\u00e8l de societat.\\nAguesti elements, prealablament nomentats,
  h\u00e8n a pensar qu\u2019aguest pa\u00eds a de besonh d\u2019explorar naues formules
  d\u2019implicacion dera poblacion e deth s\u00f2n capitau uman entara artenhuda
  des s\u00f2ns objectius de futur. Cau un espaci sociau vertebrat a on eth debat
  politic, sociau, e culturau sigue possible. Un espaci a on es ciutadans d\u2019Aran,
  implicats o non politicamnet, poguen h\u00e8r un exercici de participacion enes
  questions publiques sense besonh d\u2019auer ne p\u00f2ur pera discriminacion, ne
  p\u00f2ur ara repres\u00e0lia politica e personau encara existenta en pa\u00eds.
  Aran a de besonh de recuperar un espaci de dignificacion dera accion publica, setiat,
  non sonque ena politica coma activitat de gestion publica, senon tanben coma marc
  de reflexion e de projeccion des ah\u00e8rs e volentats deth conjunt dera poblacion.
  Ei a d\u00edder, dera volentat de h\u00e8r dera n\u00f2sta democr\u00e0cia, ua democr\u00e0cia
  de participacion reau. Ua question que, maugrat pogue semblar utopica, p\u00f2t
  h\u00e8r-se possibla en un pa\u00eds petit com eth n\u00f2ste. Aguesta ei era unica
  via t\u00e0 qu\u2019un pa\u00eds de dimensions e capacitats umanes molt limitades,
  pogue art\u00e9nher es s\u00f2ns r\u00e8ptes de futur, tant des d\u2019ua perspectiva
  nacionau, com des d\u2019objectius sociaus, culturaus o economics.\\nEn aguest sentit,
  cau nomentar e reflexionar sus quauqu\u2019un des asp\u00e8ctes qu\u2019an motivat
  era projeccion politica aranesa pendent aguesti ans e plan especiaument enes ans
  80. Era preservacion deth patrim\u00f2ni culturau e ling\u00fcistic sigueren en
  aqueth moment ua constanta d\u2019inspiracion politica e de reivindicacion de capacitat
  de gestion, coma argument tara defensa d\u2019aguest dret fondamentau deth p\u00f2ble
  aran\u00e9s. Desp\u00fas des ans totun, e maugrat er orgulh e eth conformisme institucionau,
  capa\u00e7 d\u2019amagar es dades ent\u00e0 evitar era dimension reau deth probl\u00e8ma
  m\u00f2stre que, maugrat eth coneishement instrumentau dera lengua, eth s\u00f2n
  usatge sociau disminu\u00eds de forma constanta e irreversibla. Aguest h\u00e8t
  ei de sobres coneishut pes responsables dera politica culturau deth pa\u00eds que,
  a despiet de tot, contunhen virats d\u2019esquia ara realitat e convertint era politica
  culturau en pur e simple instrument politic.\\nEra lengua, era cultura e era volentat
  d\u2019\u00e8ster d\u2019un pa\u00eds non p\u00f2t \u00e8ster en absolut sonque
  ua question de gov\u00e8rn, senon qu\u2019a d\u2019\u00e8ster ua question de volentat
  sociau e collectiva, e eth Gov\u00e8rn a d\u2019arbitrar es mesures ent\u00e0 h\u00e8\u2019c
  possible.\\nEra experi\u00e9ncia deth Conselh Sociau der aran\u00e9s m\u00f2stre
  coma a amiat aguesta question eth Gov\u00e8rn actuau e era frustracion generada
  enes persones que i particip\u00e8ren. Cau un nau estil e ua auta man\u00e8ra de
  h\u00e8r pa\u00eds, e a\u00e7\u00f2 non ei possible s\u2019aguesta societat e cada
  individu non a possibilitats de participacion reau en aguest proj\u00e8cte collectiu
  qu\u2019ei un pa\u00eds en totes es sues dimensions.\\nAuem un Gov\u00e8rn que cre
  que des deth partidisme se p\u00f2t h\u00e8r pa\u00eds, m\u00e8s, damb aguesti elements
  sonque se p\u00f2t controtlar eth pa\u00eds, non bastir-lo.\\nAciu ei era ra\u00eftz
  deth problema actuau deth n\u00f2ste autogovern!\"", "\"Segon lo preambul la darri\u00e8ra
  enqu\u00e8sta publicada pel servici d''Estatistica, Estudis e Avaloracions del \\\"P\u00f4le
  Emploi Occitanie\\\", realizat en territ\u00f2ri de l''estat franc\u00e9s, en una
  nacion tan vasta coss\u00ed es Occit\u00e0nia, la mobilitat geografica ven un dels
  compausants essenciales en lo moment de cercar trabalh. En particular, l''estudi
  explica part de las dificultats de contractacion que i a en determinats territ\u00f2ris
  occitans. La mobilitat es un crit\u00e8ri important per 22% de las personas que
  cercan trabalh, e de c\u00f2ps aquel factor constituissi un probl\u00e8ma.\\nL''an
  2018, 31% dels sollicitants d\u2019aucupacion de l''Occit\u00e0nia de l''estat franc\u00e9s
  esperavan trobar trabalh en una dist\u00e0ncia de mens de 30 minutas d''ostal. A
  l''ora d''ara, 56% realiza un viatge amb una durada d''entre 30 minutas e una ora
  al pus mai per arribar al trabalh. Mas 13% dels occitans que dem\u00f2ran en l''estat
  franc\u00e9s se declaran dispausats a trabalhar de mai d\u2019una ora de c\u00f2
  sieu. De mai, los trabalhadors executius o los mai qualificats se declaran mai dispausats
  a la mobilitat que la mejana. Lo salari mai anautit que reclaman aqueles grops constituissi
  una bona motivacion per una m\u00e0ger mobilitat geografica, assegura l''estudi
  de \\\"P\u00f4le emploi\\\", qu''apond que, per contra, los sollicitants d''aucupacion
  amb pauca o cap de qualificacion e los beneficiaris del plan minim social \u00f2ptan
  mens per s''aluenhar de c\u00f2 sieu.\\n.\"", "\"Dim\u00e8cres, 29 d''oct\u00f2bre
  de 2014, 03h00 Politica,Internacional\\nG\u00e9rard Onesta\\n\u00a9\\nGuillaume
  Paumier\\nLo vicepresident dels afars europ\u00e8us, las relacions internacionalas,
  la cooperacion descentralizada e la reflexion sul futur de las regions de Mi\u00e8gjorn-Piren\u00e8us,
  G\u00e9rard Onesta, afirm\u00e8t diluns passat que son gov\u00e8rn regional seri\u00e1
  observaire internacional del proc\u00e8s participatiu de Catalonha, lo v\u00f2te
  per l\u2019independ\u00e9ncia de Catalonha qu\u2019a convocat lo gov\u00e8rn autonomic
  del n\u00f2stre pa\u00eds fraire pel 9 de novembre que ven.\\nOnesta o manifest\u00e8t
  dins una confer\u00e9ncia de premsa a Palma (Malh\u00f2rca) apr\u00e8s l\u2019assemblada
  de l\u2019Euroregion Piren\u00e8us-Mediterran\u00e8a.\\nL\u2019elegit occitan indiqu\u00e8t
  que lo gov\u00e8rn de Mi\u00e8gjorn-Piren\u00e8us seri\u00e1 observaire del proc\u00e8s
  del 9 de novembre, apr\u00e8s acceptar l\u2019invitacion del conselhi\u00e8r catalan
  de la presid\u00e9ncia, Francesc Homs. Dins aquel sens Onesta afirm\u00e8t que lo
  proc\u00e8s catalan seri\u00e1 observat de plan pr\u00e8s del costat franc\u00e9s;
  e apond\u00e8t: \u201cpod\u00e8m aprene f\u00f2r\u00e7a los unes dels autres\u201d.\\nMentre
  el govern espanyol mira de ridiculitzar el 9N i pressiona a tort i a dret perqu\u00e8
  no surti b\u00e9, \u00e9s d''agrair que hi hagi persones disposades a despla\u00e7ar-se
  a casa nostra per fer d''observadors internacionals. Moltes gr\u00e0cies!!\\nOsca!
  Vaqui un vertadi\u00e8r politician esclairat e pluraliste ; la seuna frasa de las
  b\u00e8las :\u201cpod\u00e8m aprene f\u00f2r\u00e7a los unes dels autres\u201d se
  p\u00f2t aplicar de pertot dins la vida vidanta . De seguir...\"", "\"Agricultura
  e ramaderia\\nAtac d\u2019os en t\u00e8rme municipau de Les\\n14/04/2025\\nAguest
  maitin es Agents de Miei Ambient deth Conselh Generau d\u2019Aran s\u2019an despla\u00e7at
  tara z\u00f2na e an constatat era m\u00f2rt de sies oelhes\\nAgents de Miei Ambient
  deth Conselh Generau d\u2019Aran an constatat era m\u00f2rt de sies caps de bestiar
  que se trapauen laguens d\u2019un barratge per un nau atac d\u2019os.\\nEs Agents
  trabalhen ara sus eth terrenh t\u00e0 remassar m\u00f2stres que poguen facilitar
  era deteccion der animau.\\nEn aguesti darr\u00e8ri ans es atacs a bestiar ovin
  e crabun passen ena primau\u00e8ra abantes der agrupament des ramats en tot amendrir
  ena sason d\u2019ostiu quan es animaus se trapen en nauta montanha.\\nEnes pr\u00f2pl\u00e8us
  dies s\u2019enviar\u00e0n a analizar es m\u00f2stres recuelhudes ara Universitat
  Autonoma de Barcelona, a on se sajar\u00e0 d\u2019identificar ar exemplar responsable
  d\u2019aguest atac.\\nH\u00d2NT: CONSELH GENERAU D''ARAN\\nH\u00d2NT: CONSELH GENERAU
  D''ARAN\\nManu Moga\"", "\"Dimenge, 11 de novembre de 2012, 03h00 Sci\u00e9ncia,Internacional\\nS\u2019ag\u00eds
  de dos exemplars de balena becuda de Bahamondes (Mesoplodon traversii), una esp\u00e8cia
  que fins ara solament se n\u2019\u00e8ra localizat de r\u00e8stas d\u2019\u00f2sses
  e se cresi\u00e1 que s\u2019\u00e8ra estencha. Las doas balenas, un pich\u00f2t
  mascle de 3,5 m\u00e8tres e la si\u00e1 maire de 5 m\u00e8tres de long, fogu\u00e8ron
  localizadas sus la plaja d\u2019Opape en decembre de 2010, mas s\u2019\u00e8ra pensat
  qu\u2019\u00e8ran d\u2019exemplars d\u2019una esp\u00e8cia comuna dins la z\u00f2na,
  las balenas becudas de Gray.\\nL\u2019analisi de l\u2019ADN de las doas balenas
  determin\u00e8t que s\u2019agissi\u00e1 d\u2019una autra esp\u00e8cia, la balena
  becuda de Bahamondes. Fins ara solament se\u2019n coneissi\u00e1 qualques paucas
  r\u00e8stas d\u2019\u00f2sses trobadas en N\u00f2va Zelanda e en Chile dins un peri\u00f2de
  de 140 ans.\\nLa biologista Rochelle Constantine, qu\u2019a participat a l\u2019estudi
  de las doas balenas, consid\u00e8ra que la trobalha es f\u00f2r\u00e7a importanta
  en prenent en compte lo temps qu\u2019es passat sens cap de pr\u00f2va de vida d\u2019aquel
  grand mamif\u00e8r. Constantine o justifica amb la possibilitat que la balena becuda
  de Bahamondes si\u00e1 una esp\u00e8cia que viu e mor\u00eds solament en aigas f\u00f2r\u00e7a
  prigondas de l\u2019ocean e que si\u00e1 f\u00f2r\u00e7a malaisit qu\u2019arribe
  arrossegada a la c\u00f2sta.\\nI agu\u00e8t ja lo c\u0153lacant. \u00d2m pensaba
  qu''avi\u00e1 disparescut dempu\u00e8i la pre\u00efst\u00f2ria, que ne demoraba
  que d''\u00f2sses, e puei se ne torn\u00e8t trapar dins lo canal del Mozambic. Ara
  las balenas becudas de Bahamondes. Tanben l''ebr\u00e8u, fa qualques lustres, ne
  demoraba gaireben que los \u00f2sses. Ves\u00e8tz ben que i a mai que d''esp\u00e8r!\"",
  "\"Actualitats\\n\u201cLa Dintrada\u201d a re\u00fcssit a renovelar lo discors e
  lo \u201cpersonal\u201d occitanistas\\nBilan\u00e7 del Forum Ciutadan Occitan de
  setembre 2017\\nUn dels objectius \u00e8ra de renovelar lo discors e lo \u201cpersonal\u201d
  occitanistas: lo public agu\u00e8t lo plaser d\u2019escotar de personas nov\u00e8las
  qu\u2019avi\u00e1n de causas importantas de dire. Per un c\u00f2p las femnas \u00e8ran
  majoritarias dins las presas de paraula, es pas sovent que se vei aqu\u00f2 dins
  los encontres occitans! La causida \u00e8ra tanben de partir de testimoniatges concrets,
  professionals o personals, qu\u2019ancor\u00e8ron los debats dins la realitat. Agu\u00e8rem
  tanben d\u2019ap\u00f2rts scientifics de la part d\u2019universitaris que saup\u00e8ron
  definir los mots, los conc\u00e8ptes, que port\u00e8ron d\u2019exemples venguts
  d\u2019autres pa\u00efses, e qu\u2019ajud\u00e8ron a melhor comprene los enj\u00f2cs.\\nLa
  dimension participativa \u00e8ra tanben una t\u00f2ca d\u2019aquel encontre. Aqu\u00ed
  lo bilan\u00e7 es mai nuan\u00e7at. Fogu\u00e8t una bona capitada lo matin amb d\u2019escambis
  rics sus la tematica \u201cOccit\u00e0nia multiculturala?\u201d seguits per un pichon
  trabalh per grops de tres personas. De papier\u00f2ts mirgalhats florigu\u00e8ron
  sul pan\u00e8l previst per aqu\u00f2, amb de proposicions: \u00e7\u00f2 que cal
  melhorar, \u00e7\u00f2 que cal arrestar, \u00e7\u00f2 que cal inventar!\\nPer contra,
  de ser, se pass\u00e8t pas aital. La rason m\u00e0ger es la manca de temps: lo debat
  suls \u201cEnj\u00f2cs del numeric\u201d se degu\u00e8t arrestar a 16h, per daissar
  de temps a la tresena tematica. Los obradors previstes se pogu\u00e8ron pas t\u00e9ner,
  mentre que mai d\u2019un participant esperava aqu\u00f2\u2026 damatge!\\nLo tresen
  debat \u201cRegion \u2018Occitanie\u2019, que fas\u00e8m?\u201d prometi\u00e1 d\u2019esser
  lo mai caud.. e fogu\u00e8t efectivament lo mai passionat! Las intervencions un
  pauc mai longas que previst, daiss\u00e8ron pauc de temps al public per s\u2019exprimir,
  alara que justament, lo mond dins la sala trepejavan e cremavan d\u2019enveja de
  far saber lor posicion!\\nSe l\u2019eveniment en se es important, la t\u00f2ca es
  tanben de noirir la reflexion occitanista al del\u00e0 d\u2019aquela polida jornada.
  Totas las presas de paraula son estadas enregistradas, e de contribucions escrichas
  son tanben estadas culhidas. Far\u00e0n l\u2019objecte d\u2019una publicacion dins
  los meses avenidors. Mas pod\u00e8m sens esperar dobrir qualques dralhas:\\nLo tresen
  debat sul nom de la region lengadociana mostr\u00e8t clarament la manca de reflexion
  de l\u2019occitanisme sus una organizacion politica del pa\u00eds. F\u00f2r\u00e7a
  preocupats a refortir e afirmar l\u2019unitat de la lenga occitana, los occitanistas
  an pas elaborat de proj\u00e8cte clar e sustot consensual d\u2019organizacion territoriala.
  Lo debat del matin, e en particular la cercaira Sabine Choquet, insistigu\u00e8t
  sus l\u2019ancoratge territorial per metre en pla\u00e7a una politica ling\u00fcistica
  amb l\u2019exemple de So\u00efssa o de Canad\u00e0\u2026 Al del\u00e0 de las bat\u00e8stas
  sul nom de las regions, fa ara besonh de soscar a una revendicacion territoriala
  apevada sus la lenga e sas variantas, e tanben de prene en compte las constrenchas
  e las dinamicas territorialas, economicas e socialas.\\n\u201cInternet es una revolucion,
  tan b\u00e8la coma la revolucion del Neolitic\u201d, \u00e7\u00f2 expliqu\u00e8t
  Benjamin Assi\u00e9, director del CIRD\u00d2C. Tot lo mond fogu\u00e8ron d\u2019ac\u00f2rdi
  per dire que lo \u201cbig data\u201d esperava pas los occitans per se metre en pla\u00e7a!
  Aic\u00ed es clarament la manca de \u201cproductivitat\u201d en mat\u00e8ria culturala
  qu\u2019es estada mesa en evid\u00e9ncia. Per accedir a una visibilitat minimala
  (per exemple esser reconeguts per Google) caldri\u00e1 de milierats de paginas en
  occitan. La produccion audiovisuala es tanben flaca, tant coma la Wikip\u00e8dia
  en \u00f2c, etc. Doncas ap\u00e8l a la mobilizacion generala: escriv\u00e8tz, parlatz,
  filmatz, e sustot acceptatz de partejar!\\nLa c\u00f2la de l\u2019ADEO qu\u2019organiza
  La Dintrada amb l\u2019ajuda de Converg\u00e9ncia Narbonesa, vos an\u00f3ncia son
  intencion d\u2019organizar una edicion 2018 del forum dins lo meteis esperit!\\nUc
  Jourde\\nLa Dintrada sus la television de Barcelona\\nJornalet es possible gr\u00e0cias
  al sosten economic e jornalistic dels legeires e benev\u00f2ls. Se lo pod\u00e8tz
  sost\u00e9ner en venent s\u00f2ci dels Amics del Jornalet o de l''Associacion AD\u00d2C,
  o tot simplament en fasent un don, atal contribuiretz a far un m\u00e8dia mai independent
  e de melhora qualitat.\\nSembla l''acamp d''un microc\u00f2sme simpatic, m\u00e8s
  ont es la societat civila, la que viu dins la vida veraia?\\nDe v\u00e9ser las conclusions...\\n#4
  Me sembla que la \\\"Dintrada\\\" preten pas \u00e8sser lo sol eveniment de l''annada.
  Urosament av\u00e8m un fum d''associacions e de moviments occitanistas que trabalhan
  de longa tot l''an e tanben maites eveniments. Pod\u00e8tz per ex junher lo laborat\u00f2ri
  d''id\u00e8ias e ostal d''edicion ADEO: http://www.adeo-oc.eu/\\nA l''an que ven
  ? A l''autom de 2018 solament ? Av\u00e8m lo temps de petafinar.\\nE ben, b\u00f2n
  astre per \\\"La Sortida\\\"... los p\u00e8s davant ! E viva la tracidion occitana
  !\\n#2 \u00d2c. Emai sus dos \u00f2 tres jorns.\\nMi sembla que l''a mejan aqu\u00ed
  de far un eveniment que recampa l''occitanisme. Un pauc coma \u00e8ra l''estivada
  a passat temps, emai en mi\u00e8lhs.\\nUne mena de f\u00eate de l''Huma occitane,
  ont lo conviviau e lo politic s''entremesclan.\\n\u00d2sca per aquel forum ! Me
  sembla que seria interessant per l''an que ven de lo dobrir a de questions pertocant
  la joventut e de lor far de mai en mai de pla\u00e7a...Benl\u00e8u doas jornadas
  per aprigondir e un moment festiu a la serada e La Dintrada vendr\u00e0 l\u00e8u
  un eveniment incontornable per l''occitanisme e Occit\u00e0nia en general...\\nV\u00f2stre
  comentari es a mand d\u2019\u00e8sser validat. Per terminar lo proc\u00e8s de validacion,
  vos cal encara clicar sul ligam qu\u2019anatz recebre per e-mail a l\u2019adrei\u00e7a
  qu\u2019av\u00e8tz indicada.\\nEscriu un comentari sus aqueste article\\nSenhala
  aqueste comentari\"", "\"Nissan presentava lo dim\u00e8cres 6 de setembre de 2017
  la n\u00f2va Leaf. Un ve\u00efcul 100 % electric.\\nL''estil c\u00e0mbia, es mai
  simple. Contrariament al mod\u00e8l actual, mast\u00f2c, las formas de la nov\u00e8la
  veitura semblan de se voler far oblidar tot en respectant los c\u00f2des de las
  berlinas naut de gamma.\\nSon autonomia passa los 350 quilom\u00e8tres.\\nLa lei
  es intrada en vigor lo primi\u00e8r d''agost de 2017. Aqu\u00f2''s una primi\u00e8ra
  per Eur\u00f2pa ont cap de cadre juridic existissi\u00e1 pas dusca ara al subj\u00e8cte
  de las ressorsas mini\u00e8ras espacialas.\\nAirbus trabalha sus un nov\u00e8l tipe
  d''alas per sos avions amb lo proj\u00e8cte Blade (Breakthrough laminar aircraft
  demonstration in Europe).\\nLa region Occit\u00e0nia aculhir\u00e0 21 dels 77 sites
  nov\u00e8ls de produccion d''energia electrica de nauta pot\u00e9ncia d''origina
  solara programats pel governament franc\u00e9s.\\nEs lo 28 de julhet de 2017 que
  la lista es estada desvelada pel minist\u00e8ri de la transicion ecologica e solid\u00e0ria.
  Lo operators encargats del desvolopament d''aquelas unitats de produccion son multiples
  : Compagnie du Soleil, Compagnie Nationale du Rh\u00f4ne, EDF EN, G\u00e9n\u00e9rale
  du Solaire, Langa, Neoen, Quadran, Voltalia, Valorem, Vol-V...\\nLo Cap d''Agde,
  via un proj\u00e8cte ambici\u00f3s d''arquitectura, se torna dessenhar. L''estacion
  balne\u00e0ria venguda simb\u00f2l del desvolopament toristic dels ans 1960 en Occit\u00e0nia,
  prevei de tornar agen\u00e7ar la si\u00e1 dintrada.\\nSe tendr\u00e0 a Tolosa del
  18 al 21 de setembre de 2017 una s\u00e8ria d''eveniments al torn dels dr\u00f2nes
  : de confer\u00e9ncias, un salon d''entrepresas, de competicions.\\nAqu\u00f2 far\u00e0
  de Tolosa per qualques jorn la capitala mondiala del dr\u00f2ne. Mai de tres cent
  cercaires son esperats a aquel eveniment : l''IMAV per International Micro Air Vehicle
  conference and flight competition.\\nL''entrepresa Electric Motion basada a C\u00e0strias
  pr\u00e8p de Montpelhi\u00e8r desvolopa dempu\u00e8i qualques ans de trails electrics
  per las competicions esportivas.\\nAl mes de julhet de 2017 Sono Motor presentava
  una veitura electrica equipada de pan\u00e8ls solars : se p\u00f2t recargar soleta,
  per poder far fins a 30 km per jorn.\\nSteve Moull\u00e9 ven de crear (2016) a Dru\u00e8la
  en Roergue la societat LaRefabrique.\\nIngeniaire de l''Esc\u00f2la Nacionala Superiora
  de las Tecnologias e Industrias del Boes (ENSTIB) agu\u00e8t l''id\u00e8a de sistematizar
  e de racionalizar lo reemplec, dins de creacions nov\u00e8las, de p\u00e8\u00e7as
  de vi\u00e8lhs m\u00f2bles.\\nLa qualitat del material d''aqueles m\u00f2bles es
  sovent bona en comparason amb los aglomerats mod\u00e8rnes emplegats per l''industria,
  e es sovent inutilament degalhada.\\nLa tresena linha del metropolitan de Tolosa
  se defin\u00eds.\\nLo conselh sindical del SMTC (Sindicat Mixte dels Transp\u00f2rts)
  Tiss\u00e9o ven de definir (julhet de 2017) la configuracion definitiva d''aquela
  linha nomenada : Tolosa Aerospace Express (TAE).\\nAquela linha deservir\u00e0 pas
  directament l''aerop\u00f2rt de Tolosa-Blanhac. Un tramvai cada cinc minutas far\u00e0
  l''anar-tornar dempu\u00e8i l''estacion Jean-Maga.\\nPage 10 of 14\\nLa societat
  Micronutris basada a Sant Oren\u00e7 de Gamevila a costat de Tolosa produs\u00eds
  e comercializa dempu\u00e8i qualques ans d''ins\u00e8ctes per la consomacion umana.\\nUn
  article de Marcel Carrieres escrich en 1972 per la revista Vida N\u00f2va num\u00e8ro
  5.\"", "\"1971-1997 Naissen\u00e7a, desvolopament e crisis\\n1r de julhet 1971 \u2013
  Creacion dau Centre Cultural Occitan (CC\u00d2C) Pa\u00eds Nissart\\nLo 1r de julhet
  es creada a Nissa l\u2019associacion Centre Cultural Occitan Pa\u00eds Nissart (CC\u00d2C
  Pa\u00eds Nissart). Lu sieus 7 membres fondadors son Alan PELHON (\u2020 1994),
  Bernard FRUCHIER, Felip POLHON, Joan CORDIER, Joan-Luc SAUVAIGO, Joan-P\u00e8ire
  GIRAUD (\u2020 2014) e Maur\u00eds SGARAVIZZI (\u2020 2011)\\nEstiu 1971 \u2013
  Publicacion dau promier num\u00e8ro de la revista \u201cLa Beluga\u201d\\nLo CC\u00d2C
  Pa\u00eds Nissart lan\u00e7a la publicacion de la sieu revista La Beluga dont lo
  nom es inspirat d\u2019aqueu de l\u2019anciana revista satirica russa Iskra (beluga
  en rus).\\nLa Beluga es una revista papier que tracta a l\u2019enc\u00f2up de subj\u00e8ctes
  culturals e politics e ben segur de l\u2019actualitat de l\u2019associacion. Toi
  lu s\u00f2cis li son automaticament abonats. Dau 1971 au 2002, lo CC\u00d2C Pa\u00eds
  Nissart ne\u2019n publiquer\u00e0 16 num\u00e8ros.\\nSetembre 1971 \u2013 Dubertura
  dei promiers cors d\u2019occitan nissart\\nLu cors si fan d\u2019en promier a la
  Maion dei Joves e de la Cultura (MJC) situada en lo quartier de Gorbella, pi a la
  Cambra dei Mestiers dei Aups-Maritimi, baloard Carabac\u00e8l, dins una sala prestada
  da Joan-P\u00e8ire GIRAUD.\\nLu cors si debanan cada dimars, au principi a rason
  d\u2019un cors per setmana pi a la fin, tres cors de diferents niv\u00e8us, donats
  per Bernard FRUCHIER, Joan-Marc PATRITI e P\u00e8ire MACARI.\\nAquelu cors durer\u00e0n
  fins au 1981 e aur\u00e0n amassat mai de 200 escolans.\\nEstiu 1972 \u2013 Promiera
  crisi m\u00e0ger e scission\\nLo CC\u00d2C Pa\u00eds Nissart patisse una scission
  entre lo corrent culturalista menat per Alan PELHON e Joan-Luc SAUVAIGO, e lo corrent
  nacionalista menat per Bernard FRUCHIER e Joan-P\u00e8ire GIRAUD.\\nAlan PELHON
  e Joan-Luc SAUVAIGO quitan lo CC\u00d2C Pa\u00eds Nissart per fondar lo \u201cComitat
  Ni\u00e7ard d\u2019Estudis Occitans\u201d (CNEO).\\nBernard FRUCHIER deven lo 2d
  president dau CC\u00d2C Pa\u00eds Nissart, e P\u00e8ire MACARI lo vicepresident.\\nSetembre
  1972 \u2013 Cambiament de local\\nEn seguida de la scission, lo CC\u00d2C Pa\u00eds
  Nissart deu quitar lo local dau Cors Sal\u00e8ia, prestat per un amic d\u2019Alan
  PELHON, e muda lo sieu s\u00e8ti social a l\u2019Avenguda dau Rai, pi en Vila Vielha
  a Carriera Ben\u00e8st Bunico.\\n1975-1981 \u2013 Lo CC\u00d2C Pa\u00eds Nissart
  si desvolopa\\nLo CC\u00d2C Pa\u00eds Nissart viu un peri\u00f2de de dinamisme dau
  temps de que desvolopa li sieus activitats de difusion de la lenga:\\n- Cors d\u2019occitan
  nissart que rassemblan au total mai de 200 escolans\\n- Publicacions de La Beluga
  e finda de mantu autres libres e librions div\u00e8rs\\n- Participacions a d\u2019eveniments
  culturals dont lu Festenaus dau Libre\\n- Organizacion de colonias de vacan\u00e7as.\\n1981-1997
  \u2013 Segonda crisi m\u00e0ger e intrada en ibernacion\\nLo CC\u00d2C Pa\u00eds
  Nissart escapa pas a la crisi prefonda que trav\u00e8rsa l\u2019occitanisme au comen\u00e7ament
  dei ans 1980 (divisions, envielhiment de la basa militanta, replecs localistas e
  revendicacions minimalisti).\\nL\u00e8u, la parten\u00e7a d\u2019un molon de s\u00f2cis
  per lo movement socialista e autonomista Volem Viure Al Pa\u00eds priva l\u2019associacion
  d\u2019un secretari e d\u2019un clavaire.\\nL\u2019acumulacion de div\u00e8rs probl\u00e8mas
  e la mudacion dau president Bernard FRUCHIER a Luceram per de rasons familiali m\u00e8nan
  a l\u2019abandon dau CC\u00d2C Pa\u00eds Nissart. L\u2019associacion p\u00e8rde
  lo sieu local e ientra dins un l\u00f2ng peri\u00f2de d\u2019inactivitat.\\n1997-A\u00fcra\u2026
  Renaissen\u00e7a e evolucions\\nFebrier 1997 \u2013 Renaissen\u00e7a e evolucion
  dau CC\u00d2C Pa\u00eds Nissart\\nApr\u00e8s 16 annadas de s\u00f2m for\u00e7at,
  lo CC\u00d2C Pa\u00eds Nissart renaisse.\\nBernard FRUCHIER transmete li comandas
  a Crist\u00f2u DAURORE que deven lo 3\u00e7 president de l\u2019associacion e lo
  mesteiran de la sieu reactivacion.\\nLo CC\u00d2C Pa\u00eds Nissart c\u00e0mbia
  de nom e deven CC\u00d2C Pa\u00eds Nissart e Alpenc. L\u2019associacion ad\u00f2pta
  un nov\u00e8u l\u00f2go e duerbe lo sieu sit Internet.\\nMai 1998 \u2013 Lan\u00e7ament
  de la F\u00e8sta d\u2019Occit\u00e0nia\\nLo CC\u00d2C Pa\u00eds Nissart e Alpenc
  lan\u00e7a la F\u00e8sta d\u2019Occit\u00e0nia a Nissa sota l\u2019impulsion de
  l\u2019artista Maur\u00eds SGARAVIZZI qu\u2019es lo promier de creire an aquesta
  f\u00e8sta e que n\u2019animer\u00e0 li 1a e 10a edicions.\\nAquesta f\u00e8sta
  a per t\u00f2ca de far descurbir la riquessa culturala de l\u2019espaci occitan
  e de far capir que lu n\u00f2stres dial\u00e8ctes nissart e vivaroalpenc fan part
  de l\u2019occitan, una granda comunautat ling\u00fcistica de mai de tres milions
  de locutors e que s\u2019espandisse de Mentan a Bord\u00e8u.\\nLa F\u00e8sta d\u2019Occit\u00e0nia
  si debana successivament a la Gl\u00e8ia dau P\u00f2rt (1998-2000), a la sala d\u2019espectacle
  de l\u2019MGEN (2001-2002), au Teatre Franc\u00e9s Gag (2003-2023, levat lo 2021)
  pi a la Sala Laure \u00c9card (a partir dau 2024). De mai, li cinc promieri edicions
  si debanan au mes de mi mai pi li seguenti en setembre \u00f2 oct\u00f2bre.\\nLa
  F\u00e8sta d\u2019Occit\u00e0nia acuelhir\u00e0 un molon de grops musicals occitans
  cel\u00e8bres: Maur\u00eds (1998 e 2007), Lo Dalfin (2000), Nux Vomica (2001), Lo
  Mago d\u2019en Cast\u00e8u (2002), Zo Mai Aqu\u00ed (2016)\u2026\\nFebrier 1999
  \u2013 Dubertura dau 1r atalhier de Carneval\\nLo CC\u00d2C Pa\u00eds Nissart e
  Alpenc duerbe lo sieu promier atalhier de construccion de carres de Carneval que
  li permete de participar au Carneval Independent dins un promier temps, pi ai carnevals
  de quartier.\\nA partir dau 2009, lo carre de Carneval dau CC\u00d2C participar\u00e0
  finda au Carneval oficial.\\nMai 2001 \u2013 Lo CC\u00d2C Pa\u00eds Nissart e Alpenc
  festeja lu sieus 30 ans d\u2019exist\u00e9ncia\\nA l\u2019ocasion de la 4a F\u00e8sta
  d\u2019Occit\u00e0nia, lo CC\u00d2C Pa\u00eds Nissart e Alpenc festeja lu sieus
  30 ans d\u2019exist\u00e9ncia e organiza a la sala d\u2019espectacle de l\u2019MGEN
  un f\u00f2rom sus \u201cLa pla\u00e7a de Nissa en Occit\u00e0nia\u201d.\\nLi participan
  Lo\u00eds Pastorelli, Joan-P\u00e8ire Giraud e P\u00e8ire Brechet de l\u2019Institut
  d\u2019Estudis Occitans (IEO).\\nS\u2019enseguisse un conc\u00e8rt de Nux Vomica
  sota li arcadas de la Place \u00cdsola de Beutat.\\nSetembre 2001 \u2013 Dubertura
  de l\u2019atalhier de teatre e creacion de La Chorma Nissarda\\nLo CC\u00d2C Pa\u00eds
  Nissart e Alpenc lan\u00e7a l\u2019activitat de teatre en nissart e crea La Chorma
  Nissarda que juega la sieu promiera p\u00e8\u00e7a, Fai Calar de J\u00f2rgi Delrieu,
  en mai dau 2002 a l\u2019ocasion de la 5a F\u00e8sta d\u2019Occit\u00e0nia a la
  sala de l\u2019MGEN.\\nDesp\u00ed, juguer\u00e0 successivament:\\n- Fai calar de
  J\u00f2rgi Delrieu (pr\u00e8mi especial au Festenau de Teatre de Fuv\u00e8u)\\n-
  Es normal de Raol Nathiez\\n- Li rementas nucleari de Bernard Vaton (2d pr\u00e8mi
  e pr\u00e8mi d\u2019interpretacion masculina per Reinat Anfosso au Festenau de Teatre
  de Fuv\u00e8u)\\n- Li aventuras de Cogordon de Joan-Marc Eus\u00e8bi\\n- Lo pichin
  prince d\u2019Ant\u00f2ni de SAINT EXUP\u00c9RY (revirat da Aub\u00e8rt ROSSO)\\n-
  230 ans de Rancher de Crist\u00f2u DAURORE e Reinat ANFOSSO dich \u201cLa Scien\u00e7a\u201d\\n-
  La Tina de Gustau Ad\u00f2lf Mossa,\\n- Mas que chaple! de Nic\u00f2la Ducousso
  e P\u00e8ire Fantin\\n- Nissa Pantai de Franc Baldet\\nEn lo 2016, la tropa pilha
  lo nom de La Chorma Nissa Pantai.\\nGenoier 2003 \u2013 Lan\u00e7ament de la Dictada
  Occitana a Nissa\\nLa Dictada Occitana es creada a Castras en lo 1998 per lo Centre
  Occitan del Pa\u00eds Castr\u00e9s. Aquest eveniment a per t\u00f2ca de tornar donar
  li sieus letras de noblessa a l\u2019escrich en occitan, dins la sieu diversitat
  dialectala, tant dins lo sieu espaci ling\u00fcistic coma a l\u2019estrangier (dins
  tres vilas de Catalonha).\\nLa Dictada Occitana s\u2019espandisse l\u00e8u dins
  un quarantenau de comunas d\u2019Occit\u00e0nia tota. En lo 2003, es organizada
  per lo promier c\u00f2up a Nissa per lo CC\u00d2C Pa\u00eds Nissart e Alpenc a la
  demanda dau Centre Occitan del Pa\u00eds Castr\u00e9s. L\u2019eveniment si debana
  en doi temps dins una sala dau P\u00f2rt pi au Teatre Franc\u00e9s Gag e es mediatizat
  per un reportatge televisat d\u2019M6.\\nEs seguida, lo CC\u00d2C Pa\u00eds Nissart
  e Alpenc organiza la Dictada Occitana cada an a Nissa dins diferents luecs, fins
  a la 20a edicion a partir de la quala lo servici \u201cLenga, Cultura e Tradicions\u201d
  de la Vila de Nissa decide de se n\u2019ocupar.\\nEn genoier dau 2023, la Dictada
  Occitana a Nissa festeja lu sieus 20 ans d\u2019exist\u00e9ncia. Nissa Pantai organiza
  un bal\u00e8ti en lo sieu omenatge au Palais dei Reis de Sardenha.\\nA\u00fcra,
  Nissa Pantai organiza la Dictada Occitana dins lo quadre dei cors associatius d\u2019occitan
  nissart e alpenc e finda dins div\u00e8rs establiments escolars.\\nPrima 2005 \u2013
  Lan\u00e7ament dei v\u00edsitas guidadi de Nissa en nissart\\nLo CC\u00d2C Pa\u00eds
  Nissart e Alpenc lan\u00e7a li v\u00edsitas guidadi de Nissa en nissart. Lu quartiers
  visitats son la Vila Vielha (Babazoc), lo Cast\u00e8u, lo P\u00f2rt, li ar\u00e8nas
  e lo sit arqueologic de Cimier.\\nDau 2005 fins a\u00fcra, mai de 1800 personas
  van participar an aqueli v\u00edsitas dont, per una m\u00e0ger part, de gents de
  la region que p\u00f2don tornar descurbir lo patrim\u00f2ni de Nissa dins la lenga
  dau pa\u00eds. Mas li v\u00edsitas inter\u00e8ssan tanben de gents dau def\u00f2ra,
  especialament de Catalonha, d\u2019It\u00e0lia e mai dau Japon dont l\u2019occitan
  es ensenhat.\\nLi v\u00edsitas guidadi de Nissa en nissart son difusadi dins R\u00e0dio
  Nissa Pantai e constituisson e mai una emission dau mesme nom.\\nGenoier 2006 \u2013
  Organizacion dau Campionat dau mond de Mandar de Palhasso\\nLo CC\u00d2C Pa\u00eds
  Nissart e Alpenc pilha en carga l\u2019organizacion dau Campionat dau Mond de Mandar
  de Palhasso, un eveniment ligat au Carneval Independent de Sant R\u00f2c, tot ai
  doi creats en lo 1990 per lo grop Nux Vomica menat per Lo\u00eds Pastorelli. Denant,
  \u00e8ra passat sota la responsabilitat dau Collectiu dei Diaus Blus dau 2000 fins
  au 2005.\\nLo Palhasso es un personatge d\u2019estra\u00e7a qu\u2019incarna toi
  lu crucis de l\u2019an passat. Lo juec consiste a lo mandar lo mai luenh possible.
  Es un biais de si desbarrassar de toi lu crucis de l\u2019annada escolada.e\\nPrintemps
  2007 \u2013 1a participacion ai Festins dei Cogordons e dei Mais\\nLe CC\u00d2C
  Pa\u00eds Nissart e Alpenc obten l\u2019autorizacion de participar au Festin dei
  Cogordons e au Festin dei Mais. L\u2019associacion li installa lo sieu banc venda
  de produchs que si va desvolopar: libres, CD pi malhetas.\\nAost 2007 \u2013 Lauren\u00e7
  Rev\u00e8st deven lo nov\u00e8u president\\nLe CC\u00d2C Pa\u00eds Nissart e Alpenc
  c\u00e0mbia de direccion. Lauren\u00e7 REV\u00c8ST deven lo nov\u00e8u president,
  succedissent a Crist\u00f2u DAURORE que deven director denant de repilhar la presid\u00e9ncia
  en lo 2013.\\nOct\u00f2bre 2007 \u2013 10a F\u00e8sta d\u2019Occit\u00e0nia e passacarriera
  en Vila Vielha\\nLo CC\u00d2C Pa\u00eds Nissart e Alpenc duerbe 10a F\u00e8sta d\u2019Occit\u00e0nia,
  organizada en l\u2019onor d\u2019Alan Pelhon e de Franc\u00e9s Gag, per passacarriera
  en Vila Vielha, desp\u00ed dau Cors Sal\u00e8ia fins au Teatre Franc\u00e9s Gag.\\nLo
  passaccariera si fa emb la gr\u00f2ssa t\u00e8sta de Carneval dau CC\u00d2C, representant
  Pepin Garibaldi en lo 2007 e sota acompanhament dei grops Lo Cepon e Nissa la B\u00e8la
  [Nice la Belle].\\nLa tradicion dau passacarriera denant la f\u00e8sta si va perseguir
  fins au 2016 dont ser\u00e0 anullat per de rasons de seguretat. Es si far\u00e0
  totjorn sota l\u2019acompanhament dau Cepon e d\u2019un grop folcloric (La Chamada
  Nissarda [Ciamada Nissarda] lu autres ans).\\nOct\u00f2bre 2008 \u2013 Creacion
  e inauguracion de R\u00e0dio Nissa Pantai\\nLo CC\u00d2C Pa\u00eds Nissart e Alpenc
  crea la R\u00e0dio Nissa Pantai, una webr\u00e0dio 100% en occitan que difusa 24h/24
  e 7j/7.\\nL\u2019id\u00e8a de crear aqueta r\u00e0dio naisse en seguida d\u2019estatisticas,
  realizadi entre lo 2002 e lo 2006, que m\u00f2stran que de tota la region PACA,
  lo departament dei Aups-Maritimi a la melhora mantenen\u00e7a de la lenga occitana
  tant en mitan urban coma en mitan rural. Ensin, sus d\u2019un pan\u00e8l de 200
  personas dins li 163 comunas dau departament, li a un minim dau 5% de locutors actius,
  que p\u00f2u anar fins au 60%. De mai, si tr\u00f2ba una ret associativa densa e
  activa que p\u00f2u servir de sorgent.\\nF\u00f2rt d\u2019aqueli estat\u00edsticas
  e dau constat que lo terren li es pr\u00f2pi favorable (mai d\u2019un milion d\u2019auditors
  potencials de Mentan a T\u00e8ula e de Nissa a Sant Est\u00e8ve d\u2019en Tini\u00e1),
  l\u2019associacion desvolopa lo proj\u00e8cte qu\u2019a per t\u00e8cola de donar
  ai auditors l\u2019acc\u00e8s a una r\u00e0dio en occitan dins la 3a ciutat d\u2019Occit\u00e0nia
  e la 5a de Fran\u00e7a en nombre d\u2019estatjants, dins una z\u00f2na de renomenada
  internacionala (\u201cCostiera d\u2019Azur\u201d), au mitan dei r\u00e0dios francof\u00f2ni
  e d\u2019un desenau de r\u00e0dios anglof\u00f2ni, italianof\u00f2ni, russof\u00f2ni
  \u00f2 mai ebreuf\u00f2ni.\\nLa R\u00e0dio es oficialament presentada e inauguradadau
  temps de l\u201911a F\u00e8sta d\u2019Occit\u00e0nia au Teatre Franc\u00eds Gag.
  Lo sieu l\u00f2go es dessenhat da l\u2019artista Ben. Reinat ANFOSSO dich \u201cLa
  Scien\u00e7a\u201d pr\u00e8sta la sieu votz per lo generic principal.\\nL\u201911a
  F\u00e8sta d\u2019Occit\u00e0nia mete tanben a l\u2019onor Franc\u00e9s Gag per
  lu 20 ans de la sieu m\u00f2rt. La gr\u00f2ssa t\u00e8sta de Carneval dau CC\u00d2C
  representa aquel an Tanta Victorina (personatge de r\u00e0dio).\\nMar\u00e7 2012
  \u2013 Lan\u00e7ament dei atalhiers de co\u00efna nissarda en nissart\\nEn lo 2012,
  a l\u2019iniciativa d\u2019una escolana d\u2019un cors de nissart, lo CC\u00d2C
  Pa\u00eds Nissart e Alpenc lan\u00e7a lu atalhiers de co\u00efna nissarda en nissart.\\nL\u2019obj\u00e8cte
  d\u2019aquesta activitat es doble: descurbir e emparar la gastronomia nissarda e
  practicar la lenga dins l\u2019activitat de co\u00efna.\\nSer\u00e0 lo principi
  d\u2019una l\u00f2nga seria de mai d\u2019un trentenau d\u2019atalhiers que si perseguisse
  fins a\u00fcra.\\nL\u2019activitat si desvolopa e mai f\u00f2ra de Nissa, en la
  valada d\u2019en Palhon, en occitan alpenc, e cada edicion es registrada per la
  r\u00e0dio.\\nDecembre 2012 \u2013 Cambiament de president e de l\u00f2gos\\nLo
  CC\u00d2C Pa\u00eds Nissart e Alpenc c\u00e0mbia de president: Jonatan SANTILLI
  rempla\u00e7a Lauren\u00e7 REV\u00c8ST.\\nDins lo mesme temps, l\u2019associacion
  e la r\u00e0dio ad\u00f2ptan de nov\u00e8us l\u00f2gos mai mod\u00e8rnes.\\nMai
  2013 \u2013 Comercializacion dei promieri malhetas\\nLo CC\u00d2C Pa\u00eds Nissart
  e Alpenc si lan\u00e7a dins la venda de malhetas qu\u2019inaugura au Festin dei
  Mais dau 2013. Lu sieus promiers mod\u00e8ls presentats resc\u00f2ntran un grand
  succ\u00e8s.\\nDesp\u00ed, lo banc de l\u2019associacion s\u2019enriquisse de malhetas
  que devenon lo principal sorgent de revengut ai festins.\\nSetembre 2013 \u2013
  Lan\u00e7ament de l\u2019emission FotPantai e 1a difusion en dir\u00e8cte\\nA l\u2019ocasion
  dau resc\u00f2ntre Nissa-Valenciennes (4-1) qu\u2019inaugura lo nov\u00e8l Estadi
  de Nissa Sant Isid\u00f2r, R\u00e0dio Nissa Pantai retransmete per lo promier c\u00f2up
  en dir\u00e8cte un resc\u00f2ntre de fotb\u00f2l de l\u2019OGC Nissa, en l\u2019encastre
  de la sieu emission esportiva FotPantai creada a la prima dau 2012.\\nA comptar
  d\u2019aqu\u00ed, R\u00e0dio Nissa Pantai si far\u00e0 una notorietat en difusant
  en dir\u00e8cte e en occitan nissart toi lu resc\u00f2ntres a maion de l\u2019OGC
  Nissa e mai a M\u00f3negue.\\nDenant, lu resc\u00f2ntres dau Gim \u00e8ran comentats
  dins li tribunas de l\u2019Estadi dau Rai e difusats a la r\u00e0dio en diferat.\\nCiril
  JOANIN e Crist\u00f2u DAURORE au 1r resc\u00f2ntre en dir\u00e8cte a l\u2019Estadi
  de Sant Isid\u00f2r.\\nAficha de l\u2019emission FotPantai.\\nAuton 2013 \u2013
  Crist\u00f2u Daurore repilha la presid\u00e9ncia\\nCrist\u00f2u DAURORE repilha
  lo p\u00f2st de president CC\u00d2C Pa\u00eds Nissart e Alpenc que parteja emb Jonatan
  SANTILLI.\\nEn lo 2016, dem\u00f2ra lo solet president en seguida de la demission
  e la parten\u00e7a de Jonatan SANTILLI.\\nMar\u00e7 2016 \u2013 Lo CC\u00d2C Pa\u00eds
  Nissart e Alpenc deven Nissa Pantai\\nLo CC\u00d2C Pa\u00eds Nissart e Alpenc c\u00e0mbia
  de nom e deven Nissa Pantai \u2013 Centre Cultural Occitan Pa\u00eds Nissart e Alpenc
  (reduch en Nissa Pantai). Lo l\u00f2go c\u00e0mbia per la mesma ocasion.\\nOct\u00f2bre
  2018 \u2013 R\u00e0dio Nissa Pantai fest\u00e8ja lu sieus 10 ans d\u2019exist\u00e9ncia!\\nLa
  21a F\u00e8sta d\u2019Occit\u00e0nia marca lo 10n anniversari de la r\u00e0dio que,
  la mesma annada, benif\u00edcia d\u2019un desvolopament dei sieus mejans materials:
  nov\u00e8u logicial de difusion, sit mod\u00e8rne e aplicacion per esmartf\u00f2n.\\nSetembre
  2019 \u2013 Lan\u00e7ament dau Voc\u00e0lia dals Palhons, festenau occitan de cant
  tradicional\\nMar\u00e7 2020 \u2013 Lan\u00e7ament de l\u2019emission de dir\u00e8cte
  Corona de sera\\nJulhet 2021 \u2013 Nissa Pantai CCOC Pa\u00eds Nissart e Alpenc
  fest\u00e8ja lu sieus 50 ans d\u2019exist\u00e9ncia\\nOct\u00f2bre 2021 \u2013 Ciril
  Joanin deven lo nov\u00e8u president\\nNissa Pantai c\u00e0mbia de direccion. Ciril
  JOANIN deven lo nov\u00e8u president, succedissent a Crist\u00f2u DAURORE que deven
  vicepresident. Denant, Ciril JOANIN \u00e8ra lo clavaire de l\u2019associacion dau
  2014 au 2021.\"", "\"Rob\u00e8rt Lafont\\nRob\u00e8rt August Cesar Lafont (Robert
  Lafont en franc\u00e9s) (Nimes, 16 de mar\u00e7 de 1923 - Floren\u00e7a (It\u00e0lia),
  24 de junh de 2009) \u00e8ra un intellectuau occitan e pus particularament un ling\u00fcista,
  un escrivan, un istorian, un especialista de la literatura e un teorician politic.
  \u00c8ra una dei pus grandei figuras istoricas de l''occitanisme. Fogu\u00e8t president
  de l''Institut d''Estudis Occitans de 1959 a 1962.\\nLa Generalitat de Catalonha
  cre\u00e8t en 2010 un pr\u00e8mi Rob\u00e8rt Lafont pr''amor de recompensar las
  personalitats o institucions importantas per l''occitanisme, que son primi\u00e8r
  ganhador fogu\u00e8t lo ling\u00fcista P\u00e8ire B\u00e8c.\\nSomari\\nBiografia[modificar
  | modificar la font]\\nRob\u00e8rt Lafont nasqu\u00e8t a Nimes en 1923 dins una
  familha protestanta dau pa\u00eds de la Vaunaja dau costat de sa maire Al\u00edcia
  Virginia Nogui\u00e8r. Apr\u00e8s lo div\u00f2rci de sei parents an\u00e8t viure
  en c\u00f2 de sos grands dins un vilatjon de l''\u00e8st de Nimes, Cauvi\u00e7on.
  Partigu\u00e8t dins son adolesc\u00e9ncia en 1936 amb son paire, qu''\u00e8ra foncionari
  de Finan\u00e7as, a Lons-le-Saunier, e aquel exilh li fagu\u00e8t recuperar mai
  f\u00f2rtament l''occitan.\\nLo comen\u00e7ament del militantisme occitan e la gu\u00e8rra[modificar
  | modificar la font]\\nDe 1940 a 1943 estudi\u00e8t lei letras classicas a Montpelhi\u00e8r.
  Durant aquel peri\u00f2de, de 1941 a 1942, se fagu\u00e8t membre dau Felibritge
  a Nimes en 1941 e 1942, avans de crear lo movement Joventuts occitanas. Dempu\u00e8i
  l''estiu de 1943 fins au mes de mai de l''an seguent, agu\u00e8t de trabalhar ai
  camps de la joventut francesa d''en primi\u00e8r a Mauriac e pu\u00e8i a Lescar
  (Bearn). Ne fugigu\u00e8t e se jonh\u00e8t a un grop de resistents en Cevena. Durant
  lo mes d''agost, particip\u00e8t a la liberacion de Nimes. En seguida d''aqu\u00f2
  trabalh\u00e8t qualques meses dins lo cabinet dau pref\u00e8cte de Gard avans d''\u00e8sser
  mobilizat, en 1945, dins lei F\u00f2r\u00e7as francesas d\u2019ocupacion en Alemanha.\\nLa
  madurason intellectuala e sociala[modificar | modificar la font]\\nQuand arrib\u00e8t
  la Liberacion, vengu\u00e8t membre del nov\u00e8l Institut d''Estudis Occitans qu''\u00e8ra
  estat creat en febri\u00e8r de 1945. Aquel meteis an, lo 3 de decembre, se marid\u00e8t
  amb Andr\u00e9e-Paule-Louise Chauchard, una professora de franc\u00e9s origin\u00e0ria
  d''Andusa. Amassa agu\u00e8ron dos enfants, Suzanne e Michel.\\nLafont conegu\u00e8t
  l''influ\u00e9ncia de las id\u00e8as federalistas portadas per Carles Campr\u00f3s
  e sa revista Occit\u00e0nia, e de l''\u00f2bra de Mistral, e edit\u00e8t en agost
  de 1946 un jornal: l''Ase negre que reivindicava aquelas orientacions. Pasmens al
  cap d''un c\u00e8rt temps, l''escrivan comenc\u00e8t a s''alunhar del federalisme
  proudhonian.\\nTre 1949, apr\u00e8p que capit\u00e8t l''agregacion en letras classicas,
  Rob\u00e8rt Lafont fagu\u00e8t de professor a Bedarius, a Seta, a Arle e finalament
  al lic\u00e8u de Nimes ont trabalh\u00e8t fins a 1964. A l''enc\u00f2p que trabalhava
  dins l''ensenhament segondari, tre 1951, \u00e8ra dintrat a l''Universitat de Montpelhi\u00e8r
  ont trabalhava amb Campr\u00f3s e i ensenhava l''occitan. Vengu\u00e8t universitari
  d''un biais definitiu en 1964. Acab\u00e8t sa t\u00e8si, La Phrase occitane, que
  fogu\u00e8t publicada en 1967. En 1972, vengu\u00e8t titular de la cadi\u00e8ra
  de \\\"Lenga e Literatura occitana\\\" de l\u2019Universitat Pau Val\u00e8ri de
  Montpelhi\u00e8r.\\nLing\u00fcistica[modificar | modificar la font]\\nDins l''\u00f2bra
  ling\u00fcistica abondosa de Lafont, se p\u00f2t destacar:\\n- Un gr\u00f2s trabalh
  de codificacion e de restauracion dau proven\u00e7au segon la n\u00f2rma classica,
  e pus generalament, una teorizacion de la n\u00f2rma classica a l''escala de tota
  la lenga que contribu\u00eds a l''occitan larg (estandardizacion).\\n- Una analisi
  lucida de la diglossia e dei vias per ne sortir, amb una introduccion pioniera de
  la socioling\u00fcistica dins lo domeni occitan tre 1970 (ben en avan\u00e7a sus
  l''ensems de l''estat franc\u00e9s).\\n- Una teoria completament nov\u00e8la en
  ling\u00fcistica: la praxematica.\\n\u00d2bras representativas:\\n- (fr) Phon\u00e9tique
  et graphie du proven\u00e7al, Institut d''Estudis Occitans, 1951.\\n- (oc) L''ortografia
