  Passuello, Robert Lafont, un \u00e9crivain dans le si\u00e8cle, 2001.\"", "\"Rob\u00e8rt-Lo\u00eds
  Stevenson : un obratge de mai en lenga n\u00f2stra De l\u2019escrivan escoc\u00e9s
