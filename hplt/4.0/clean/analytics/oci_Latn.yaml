  se cal pausar tornarmai la question de la necessitat de publicar en occitan o de
  revirar en occitan la literatura mondiala. Fogu\u00e8ssem en Catalonha,...\\nLire
  la suiteEstivada de Rod\u00e8s 2019, 60\u00e8me anniversaire du Parti de la Nation
