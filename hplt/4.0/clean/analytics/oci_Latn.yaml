  ja una adolescenta.\\n- Joanic: Fraire mai grand de Me\u0140lina e enemic de \u013eenf\u00e0ncia
  de Josep Maria pendent la si\u00e1 vida \u010fuman. Sortigu\u00e8t amb Sara Mart\u00ed,
