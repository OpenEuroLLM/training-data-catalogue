  \u00e7\u00f2 qu\u2019Alxy Frankz li demand\u00e8t a cambiament, mas se p\u00f2t
  \u00e8sser segur que fogu\u00e8t pas brica bon.\\n- Albert Campos: Filh \u010fAndrea
  qu\u2019es vengut del futur, es enamorat de la futura segonda filha de Josep Maria
