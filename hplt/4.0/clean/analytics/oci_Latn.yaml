  oceanics. Per aquesta presentacion...\\nLire la suiteLa nacion occitana ven de p\u00e8rdre
  un de sos valents aparaires Lo dij\u00f2us 25 de julhet de 2019 desfunt\u00e8t a
  Prad\u00e8la, en pa\u00eds d\u2019Olmes, Joan-Claudi Chabrotin (Chabrouty per l\u2019administracion
  coloniala). Es totjorn estat un militant afogat de la causa occitana....\\nLire
  la suiteUn anniversaire qui fera date Le Parti de la Nation Occitane \u00e9tait
  comme tous les ans pr\u00e9sent \u00e0 un des rendez-vous de l\u2019\u00e9t\u00e9
  occitan, l\u2019Estivada de Rodez du 18 au 20 juillet o\u00f9 \u00e9tait install\u00e9
  sur l\u2019esplanade des Ruth\u00e8nes le stand de sa revue Lo Lugarn-Lou...\\nLire
  la suite\"", "\"Aqueste martir del pacifisme, avent pr\u00e8s la defensa del p\u00f2ble,
  se meritava una estatua. Ves\u00e8tz aquela estatua de pitre; l\u2019an 2004, lo
  24 de febri\u00e8r, la federacion del partit socialista commemor\u00e8t aqu\u00ed
  le seu assassinat ; son estatua avi\u00e1 tornat a son ostal. En efi\u00e8ch, dempu\u00e8i
  sa primi\u00e8ra installacion, lo 24 de mar\u00e7 de 1929, li calgu\u00e8t mudar
  de lu\u00f2c mantuns c\u00f2ps. Al comen\u00e7ament, l\u2019estatua pagelava mai
  de 2 m\u00e8tres de naut, pesava 600 quil\u00f2s de bronze e repausava sus un s\u00f2cle
  de barena ondrat de tres \u00ab bas relhetz \u00bb de bronze. L\u2019estatua \u00e8ra
  \u00f2bra dels artistas Henri Parayre e Georges Vivent.\\nMai, pendent la segonda
  gu\u00e8rra mondial, l\u2019eretatge de Jaur\u00e8s non \u00e8ra pas en olor de
  santetat, sembla normal. L\u2019\u00f2me qu\u2019avi\u00e1 delegat lo bronze d\u2019aquesta
  \u00f2bra, se\u2019n avi\u00e1 amairit. Amagu\u00e8t lo pitre e los \u00ab bas relhetz
  \u00bb l\u2019an 1942. Los autres lo voli\u00e1n deslogar! Aisi, l\u2019estatua
  tanben, coma tota la gent qu\u2019apreciava la lectura del jornal \u00abL\u2019Humanit\u00e9\u00bb,
  visqu\u00e8t son temps de clandestinitat fins 1946. Dempu\u00e8i de la restauracion
  de la democracia, una cerem\u00f2nia oficial li permet\u00e8t de viure de n\u00f2u
  a l\u2019aire desliure.\\nMai, lo 7 de juni de 1981, solament un mes dempu\u00e8i
  la vict\u00f2ria tant esperada de l\u2019assonan\u00e7a de las esqu\u00e8rras, desaparegu\u00e8t
  misteriosament lo pitre ! Se comenc\u00e8t una enqu\u00e8sta. \u00ab- Ara, ont se
  n\u2019a anat Joan Jaur\u00e8s ? \u00bb Demandava la gent. Dempu\u00e8i qualques
  jorns, un \u00ab collectiu per lo destrusiment de las presons \u00bb revendiqu\u00e8t
  l\u2019enlevament. Perqu\u00e9 ? Non o sabem pas. Tanpauc an daissat carta de vistalha
  per en parlar. Totes los tolosencs reticavan la desestan\u00e7a de Joan Jaur\u00e8s
  al jardin del Capitoli, mas que podi\u00e1n far ? Plagats, deploravan la manca de
  la figura de Joan Jaur\u00e8s, quitament les que partejavan vejaires politics plan
  diferents. Mai, a la vila de Tolosa, existisson les miracles, \u00f2c!\\nLa vila
  dels miracles\\nLo 29 de juni de 1983, dos ans dempu\u00e8i de la despareguda, se
  retrob\u00e8t lo pitre de Joan Jaur\u00e8s, penjat sus un arbre del jardin de la
  catedrala de Sant Est\u00e8ve (au\u00e8i Square Sali\u00e8ge). Mai, avi\u00e1 patit,
  paubrillon ! L\u2019avi\u00e1n pintat lo caratge de roge ! Rabentament, les agents
  del patrim\u00f2ni li port\u00e8ron assist\u00e9ncia : espurgu\u00e8ron totas las
  tra\u00e7as de la captivitat avant de tornar a espausar lo pitre a son lu\u00f2c
  inicial. Tot\u00f2m pensava que lo pitre avi\u00e1 acabat son viatge.\\nMai, en
  febri\u00e8r de 2004, raub\u00e8ron un cop mai l\u2019original ! Estava esposat
  a la devalada meteissa del metr\u00f2. Lo raubat\u00f2ri fogut descob\u00e8rt per
  Mossu M (pas T). Aquel \u00f2me, l\u2019ofici acabat, tornava al seu ostal, seren.
  Com cada jorn, saludava lo pitre del seu ment\u00f2r, l\u2019ap\u00f2stol de la
  patz. \u00c8ra lo 6 de febri\u00e8r. E tot sortint del conselh municipal, Mossu
  M, el cap ben plegat al seu cos per se protegir del fred, non la pogu\u00e8t saludar
  : subrepass\u00e8t la sensacion de fred, la busqu\u00e8t dels u\u00e8is, don\u00e8t
  el tombe al jardin; mai lo pitre de Joan Jaur\u00e8s s\u2019avi\u00e1 volatilizat
  ! Sulc\u00f2p, torn\u00e8t a la comuna. Mai tot lo mond avi\u00e1 plegat en aquela
  ora ! Telefon\u00e8t a l\u2019oficina del C\u00f2nsol major. Degun s\u00e0via pas
  res !\\n\u00ab -Nos an raubat Jaur\u00e8s ! Nos an raubat Jaur\u00e8s ! \u00bb\\nMossu
  M \u00e8ra f\u00f2r\u00e7a preocupat. Imaginatz vos! L\u2019endeman, fogu\u00e8t
  lo primi\u00e8r en arribar en la seva oficina. Demandava a tot\u00f2m que v\u00e9sia
  de n\u00f2vas de Joan Jaur\u00e8s. Tot\u00f2m lo mirava amb compassion. Se pensavan
  que s\u2019avi\u00e1 destimborlat completament. Mai com que \u00e8ra bon \u00f2me,
  degun le disi\u00e1 pas res.\\nCalgu\u00e8t mai d\u2019una setmana per que totes
  los servicis constatessen l\u2019evid\u00e9ncia. Mossu M avi\u00e1 rason. Lo pitre
  de Joan Jaur\u00e8s non i \u00e8ra mai mai ! Totes los services de la comuna s\u2019enviavan
  la patata cauda ! \u2013 es lo joc que permet se far una situacion en las administracions-
  mai Mossu M non avi\u00e1 pas lo cor per riser, tanpauc de jogar. Lo pitre se n\u2019avi\u00e1
  anat ! De de bon!\\n\u00ab- Ara \u00f2c que se es perdut per sempre !\u00bb desi\u00e1
  la gent. Les tolosencs, desconsolables, demand\u00e8ron que sortiscan la c\u00f2pia
  de marbre conservada dins un lu\u00f2c tengut secret del Capit\u00f2li. Cal saber
  que lo pitre en question \u00e8ra estat realizat per l\u2019escultor Abbal, l\u2019an
  1919, amb tot l\u2019amor del mond e tota la gloriosa estetica de l\u2019art de
  propaganda dels sovi\u00e8ts. \u00c8ra preci\u00f3s ! \u00c8ra un pitre inegalable
  ! \u00c8ra l\u2019expression meteissa de l\u2019amor de la patz! \u00c8ra l\u2019esperan\u00e7a
  de tota una franja de la populacion!\\nDempu\u00e8i, fagu\u00e8ron les \u00f2bras
  de restauracion del jardin del Capit\u00f2li. Lo pitre de Joan Jaur\u00e8s non s\u2019i
  podi\u00e1 demorar. Imaginetz-vos aquel morre en mi\u00e8g dels obri\u00e8rs plens
  de ciment que fan un bruch de totes los dem\u00f2nis ! Mud\u00e8t de lu\u00f2c un
  autre cop : pass\u00e8t gaireben 5 ans, embarrat dins las espargui\u00e8ras municipalas.
  Calgu\u00e8t esperar fins lo 31 de julh de 2013 perqu\u00e9 tornesse a la seva pla\u00e7a.
  Le c\u00f2nsol major Pierre Cohen e le president del conselh general Pierre Izard
  l\u2019inaugur\u00e8ron oficialament. Mai l\u2019original continua la seva corsa.\\nSi
  quic\u00f2m desb\u00f2squi lo seu amagatal, gr\u00e0cias de far lo possible perq\u00e9e
  torni a trobar lo seu jardin : los tolosencs retrobari\u00e1n segurament la patz.
  Sens lo cap de Joan Jaur\u00e8s, non sabem pas mai com pensar amb pacifisme. Som
  emberlucats! E ara, de patz, ne tenem gran besonh.\\nIsabela Piquemal*\\n*Dempu\u00e8i
  u\u00e8i trobar\u00e8tz una pichona biografia dels redactors de Sapi\u00e9ncia en
  la seccion Qui s\u00e8m.\\nFont : \u00ab La D\u00e9p\u00eache \u00bb 01/08/2013,
  DDM \u00abLe buste de Jaur\u00e8s est revenu dans les jardins du Capitole\u00bb\\nFont
  : \u00ab La D\u00e9p\u00eache \u00bb, 25/02/2004, Val\u00e9rie Sitnikov, \u00abSitu\u00e9e
  \u00e0 l\u2019entr\u00e9e du m\u00e9tro, la statue a disparu depuis plus de trois
  semaines\u2026\u00bb\\nPer anar mai enl\u00e0 se p\u00f2t escoutar la can\u00e7on
  \u00abJaur\u00e8s\u00bb de Jacques Brel interpretada pel grup tolosenc Zebda.\"",
  "\"Dimars, 10.10.2017 03h00\\nEs totjorn plan de comen\u00e7ar un article per una
  faussa citacion. Voltaire l\u2019aur\u00e9 pas jam\u00e8s dit, ni escrit. Mes aqu\u00f2
  rai. Es pas lo subj\u00e8cte.\\nUns dias au davant, \u00e8i agut dambe un amic un
  prosei que\u2019m paus\u00e8c question. Lo dev\u00eds cadoc sus Thierry Meyssan,
  l\u2019\u00f2mi qu\u2019escrivoc \u201cL\u2019esvarjabla impostura\u201d dens la
  quala bota en question la version oficiala deus atemptats deu 11 de seteme de 2011
  e n\u2019atribu\u00eds la responsabilitat au gov\u00e8rn estatsunidenc de l\u2019ep\u00f2ca.
  Mon amic \u00e7a digoc: \u201cThierry Meyssan es un tipe de dreta extr\u00e8ma\u201d.
  Aqu\u00f2 me question\u00e8c. \u201cAh bon, \u00e7a responoi, n\u2019\u00e8s segur?\u201d
  Mon amic semblava c\u00e8rt de \u00e7\u00f2 que dis\u00e8va. Le demand\u00e8c lavetz
  se\u2019n sab\u00e8va un drin m\u00e8s, mes eth demor\u00e8c evasiu.\\nDecidiscoi
  lavetz d\u2019espiar tot simplament la fica Wikip\u00e8dia de la persona en question.
  Vaqu\u00ed \u00e7\u00f2 qu\u2019i trob\u00e8c:\\n\\\"Dens la region austriaca de
  Burgenland, l''esqu\u00e8rra gov\u00e8rna amassa dambe lo partit de dreta extr\u00e8ma.
  Sabi pas se los nacionalistas austriacs son venguts socialistas o se lo sociau-democratas
  son virat fascistas.\\\"\\nLa question de pausar qu''ei: quan l''esqu\u00e8rra (o
  au mensh ua partida) decida de har un tr\u00f2\u00e7 de camin dab l''extr\u00e8ma
  dreta, qui ei qui va colhonar (per non pas d\u00edser borrar) l''aute?\\nQu''\u00e8i
  lo men av\u00eds sus la responsa...\\n#9 Sus aqu\u00f2, cau recon\u00e9isher qu''atz
  rason. I a sostengs politics que podon estar susprenents.\\nSe lo Soral es estat
  un jorn s\u00f2ci deu Partit Comunista e doncas p\u00f2t demorar encara drin estalinian,
  lo sosteng de JMLP a Iran sus l''ahar de las armas atomicas se sembla l''amassada
  d''una carpa e d''un conilh, en tot saber \u00e7\u00f2 que p\u00f2t d\u00edser lo
  vielh breton sus la religion musulmana.\\nEs donc un probl\u00e8ma de sostengs,
  de rec\u00e8rca de sosteng, d''adversari comun, benl\u00e8u de rec\u00e8rca de publicitat.
  S''u... Legir la seguida\\n#8 \\\"L''intenautalha parciau e ideologizada de l''occitanisme\\\"
  que''t ditz m\u00e8rda.\\nE sustot, \\\"L''intenautalha parciau e ideologizada de
  l''occitanisme\\\", quan escriu quauquarren ent\u00e0 comentar aqu\u00e8th article,
  qu''argumenta en tot empar\u00e0''s sus h\u00e8its (#3, #9) e non pas sus declaracions
  bohar\u00f3cas com tu dens lo ton p\u00f2st...\\n#7 Que s''ei trobat un extremista
  de dreta com Alain Soral ent\u00e0 sosti\u00e9ner Corea deu Nord, Iran e Venezuel\u00e0.
  E quitament organizar, en 2007, dab lo Jean-Claude Martinez enq\u00fc\u00e8ra au
  FN a l''ep\u00f2ca, un coll\u00f2qui on \u00e8ra convidat e present lo cap d''estat
  major deu Venezuel\u00e0.\\nLo quite Jean-Marie le Pen a l''ep\u00f2ca d''Ahmadinejad,
  convidat au Centre Zahra (lobby pro-Iran en Fran\u00e7a), sostien la Republica islamica
  d''Iran:\\nhttps://www.youtube.com/watch?v=qAo2QLUm-0k\\n#6 #7 V\u00f2stras reaccions
  son justas e sanitosas, S\u00e9nher Leclerq ! Mas per l''internautalha ideologizada
  e parciala de Jornalet e de l''occitanisme en general, aqu\u00f2 passa mal. Fiertat,
