  e las mai longas de las linhas aerianas comercialas amb de v\u00f2ls postals cap
  a Casablanca, Dakar... pu\u00e8i cap a l''America del Sud.\\nL''aerodr\u00f2m[modificar
  | modificar la font]\\nLa pista d''aquel aerodr\u00f2m traversada per una rota es
  situada un pauc al sud de la via de tren Tolosa - Narbona e parall\u00e8la a aquela.
  Fins als ans 1970, las usinas Louis Breguet utilizavan aquela coma pista d''env\u00f2l
  e d''aterratge e pista d''ensag d''avions de reparar (alara que la construccion
  d''avions ja se fasi\u00e1 a Colomi\u00e8rs). Lo darri\u00e8r env\u00f2l d''un avion
  data del 18 de decembre de 2003[1].\\nUrbanisme[modificar | modificar la font]\\nAquel
  quarti\u00e8r es en renov\u00e8lament urban total. De lotjaments se construsisson
