  en disent: \u201cComenc\u00e8t aital tot, e cal pas que te diga coss\u00ed acab\u00e8t\u2026\u201d.
  Sara apareis pas mai, sustot pr\u2019amor que se desplac\u00e8t al Bascoat per i
  viure amb un dr\u00f2lle, mas 24 descobrigu\u00e8t que la s\u00f2r pichona \u010fela
  es una de las dr\u00f2llas sinteticas qu\u2019Alxy Frankz cre\u00e8t e envi\u00e8t
  sus la T\u00e8rra ont s\u2019i barreg\u00e8ron amb los umans e totes comenc\u00e8t
  a creire qu\u2019aquelas dr\u00f2llas avi\u00e1n totjorn fach partida \u010faquel
  lu\u00f2c e temps. Coma succed\u00eds amb las autras gino\u00efdes que vivon entre
