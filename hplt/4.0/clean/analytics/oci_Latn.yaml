  s\u2019impliqu\u00e8t amb el e li prepaus\u00e8t de lo portar tanben al passat,
  doncas que Sergi avi\u00e1 enviat Solana a \u013ean 2016 pendent lo peri\u00f2de
  de joenessa del sieu paire ont i avi\u00e1 conegut pas encara la si\u00e1 futura
  esposa Alara. Dins lo passat, Albert voli\u00e1 pas utilizar una dr\u00f2lla sintetica
  nomenada M\u00edriam per cambiar \u013eist\u00f2ria e per venir un er\u00f2i apr\u00e8s
  desactivar M\u00edriam e n\u2019acabar amb la pandemia del coronavirus que per impressionar
  Solana.\"", "\"Montaudran\\nMontaudran es un quarti\u00e8r pauc dens de Tolosa situat
