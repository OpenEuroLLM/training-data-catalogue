  nakosala bino. \u00bb\\n6 Bana ya Isalaele balongolaki biloko na bango ya monzele
  na ngomba Orebi.\\nNdako ya kapo ya Bokutani\\n7 Moyize azwaki ndako ya kapo mpe
  atelemisaki yango mwa mosika, na libanda ya molako, mpo na bolamu na bango ; mpe
  abengaki yango Ndako ya kapo ya Bokutani. Moto nyonso oyo alingaki kokutana na Yawe,
  asengelaki kokende na Ndako ya kapo ya Bokutani, na libanda ya molako.\\n8 Mbala
  nyonso oyo Moyize azalaki kokende na Ndako ya kapo ya Bokutani, bato nyonso bazalaki
  kotelema : moko na moko azalaki kotelema na ekuke ya ndako na ye ya kapo mpo na
  kotala Moyize kino akokota na Ndako ya kapo ya Bokutani.\\n9 Soki Moyize akoti na
  kati, likonzi ya lipata ezalaki kokita mpe kotelema na ekotelo ya Ndako ya kapo
  ya Bokutani ; bongo Yawe azalaki kosolola na Moyize.\\n10 Bato nyonso bazalaki komona
  likonzi ya lipata kotelema na ekotelo ya Ndako ya kapo ya Bokutani. Boye bazalaki
  kotelema mpe kofukamela Yawe, moko na moko na ekuke ya ndako na ye ya kapo.\\n11
  Yawe azalaki kosolola na Moyize ndenge moto asololaka na moninga na ye. Wana Moyize
