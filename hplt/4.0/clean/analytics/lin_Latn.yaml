  ye, azalaki kotikala kati na ndako ya kapo.\\nMoyize mpe nkembo ya Yawe\\n12 Moyize
  alobaki na Yawe :\\n\u2014 Tala, ozali koloba na ngai ete nakamba bato oyo, kasi
  ozali koyebisa ngai te nani okotinda elongo na ngai. Nzokande Yo nde olobaki na
  ngai : \u00ab Nayebi yo na kombo na yo, \u00bb mpe lisusu : \u00ab Ozwi ngolu na
  miso na Ngai. \u00bb\\n13 Sik\u2019oyo, soki penza nazwi ngolu na miso na Yo, teya
  ngai banzela na Yo mpo ete nayeba Yo mpe nazwa ngolu na miso na Yo. Mpe kanisa lisusu
  ete libota wana bazali bato na Yo.\\n14 Yawe azongisaki :\\n\u2014 Ngai moko nakotambola
  elongo na yo mpe nakopesa yo bopemi.\\n15 Moyize azongisaki :\\n\u2014 Soki Yo moko
  okotambola elongo na biso te, kolongola biso te na esika oyo.\\n16 Soki otamboli
  elongo na biso te, ndenge nini bato bakoyeba ete ngai mpe bato na Yo tozwi ngolu
