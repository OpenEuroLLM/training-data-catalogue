  ba zali ko sala te, mpe bana ba komi ko telengana mpo na nzala.\\nMituna mpe biyano\\nBana
  oyo lobi na bango eko zala boni ? Na banzi ete mbula matari e sengeli e tala likambo
  oyo, pamba te mboka ya lobi eko kambama na bana ya lelo, nzoka nde soki ba teyami
  te, eko zala pasi mpo na mboka.\"", "\"biloko ya malamu mpo na baoyo bazali na mombongo
  ya ot\u025bl\u025b Chambre ya mokolo na mokolo eza na question esika nini okoki
  kosomba savon ya h\u00f4tel. Tellement que okoki ko contr\u00f4ler qualit\u00e9,
