  LES COMMENTAIRES\"", "\"HERMAN: * \u201cMwasi na ngai ya liboso akufaki na kans\u025br
  nsima ya mbula 34 ya libala na biso. Ntango nabalaki Linda, azalaki komona ete nazalaki
  ntango nyonso kokokanisa ye na mwasi na ngai ya liboso. Likambo ya mabe koleka,
  baninga na ngai ya kala bazalaki mbala mingi kolobela bizaleli malamu ya mwasi na
  ngai ya liboso, mpe yango ezalaki kotungisa Linda.\u201d\\nLINDA: \u201cNsima ya
  kobalana n\u00e1 Herman, nazalaki komona ete ye mpe bato mosusu bakozwa ngai na
  val\u025br\u025b te lokola mwasi na ye ya liboso. Bazalaki kolinga mwasi yango mingi,
  azalaki koloba na boboto mpe azalaki na bizaleli malamu. Na bantango mosusu nazalaki
  komituna soki Herman akolinga ngai mpenza lokola mwasi yango.\u201d\\nLibala ya
  Linda n\u00e1 mobali na ye ya liboso ekufaki. Ye n\u00e1 Herman basepelaka ndenge
  bakutan\u00e1. Ata bongo, ndenge bamonisi yango, kobala lisusu ekoki komema mikakatano
  oyo ezalaki te na libala ya liboso. *\\nSoki obal\u00e1 lisusu, ndenge nini omonaka
  libala yango? Mwasi moko na nkombo Tamara, oyo abalaki lisusu mbula misato nsima
  ya koboma libala, alobi boye: \u201cNtango moto abali mpo na mbala ya liboso, amonaka
  ete libala yango ekoumela libela. Kasi, ezalaka lisusu bongo te mpo na libala ya
  mibale, mpo abosanaka te ete oyo ya liboso ekufaki.\u201d\\nAta bongo, bato mingi
  bak\u00f3m\u00e1 na esengo mpenza nsima ya kobala lisusu. Basal\u00e1 ete mabala
  yango *\\nelonga; oyo ya yo mpe ekoki kolonga! Ndenge nini? T\u00f3talela mikakatano
  misato oyo bato mingi bakutanaka na yango mpe ndenge oyo Biblia ekoki kosalisa yo
  olonga yango.MOKAKATANO 1: OZALI KOSALA NYONSO MPO LIBALA NA YO YA KALA EBEBISA
  TE OYO YA SIKA.\\nEllen, oyo afandaka na Afrika ya Sudi alobi boye: \u201cEzali
  mpasi nabosana basuvenire nyonso ya libala na ngai ya liboso, mingimingi soki tozali
  kosala mibembo na bisika oyo ngai n\u00e1 mobali na ngai ya kala tozalaki kokende
  konje. Na bantango mosusu, nak\u00f3maka kokokanisa mobali na ngai ya sika n\u00e1
  oyo ya kala.\u201d Na ngambo mosusu, soki molongani na yo abalak\u00e1 liboso, ekoki
  kopesa yo nkanda soki azali kolobela libala yango mbala na mbala.\\nLIKANISI: Ndim\u00e1
  ete yo to molongani na yo bokoki te kobosana basuvenire ya libala ya liboso, mingimingi
  soki libala yango eumelaki bambula mingi. Kutu, basusu balobi ete kozanga koyeba,
  babengaki balongani na bango ya sika na nkombo ya balongani na bango ya kala! Okoki
  kosala nini na likambo ya ndenge wana? Biblia epesi toli oyo: \u201cB\u00f3mityaka
  na esika ya bamosusu.\u201d\u20141 Petro 3:8.\\nKotika te zuwa etinda yo opekisa
  molongani na yo alobela likambo nyonso oyo etali libala na ye ya liboso. Soki molongani
  na yo ayoki mposa ya kolobela bomoi oyo alekis\u00e1 n\u00e1 molongani na ye ya
  liboso, yok\u00e1 ye na likebi mpenza. Lisusu, kowela koloba te ete azali kokokanisa
  yo na molongani yango. Yan, oyo abalaki lisusu eleki sikoyo mbula 10 alobi boye:
  \u201cMwasi na ngai Mimi amonaka te ete kob\u025bta lisolo ya mwasi na ngai ya kala
  ezali ekila. Kutu, amonaka yango nde libaku ya koyeba makambo oyo esalaki ete nak\u00f3ma
  ndenge nazali lelo.\u201d Okoki kutu komona ete masolo ya ndenge wana ekosalisa
  yo ok\u00f3ma mpenza moninga ya molongani na yo ya sika.\\nTy\u00e1 miso na bizaleli
  malamu oyo molongani na yo ya sika azali na yango. Toboyi te, akoki kozanga bizaleli
  to makoki mosusu oyo molongani na yo ya liboso azalaki na yango. Kasi, ekoki kozala
  ete aleki oyo ya liboso na makambo mosusu. Na yango, sal\u00e1 ete boyokani na yo
  n\u00e1 molongani na yo ya sika ek\u00f3ma makasi, \u2018kokokanisa ye na moto mosusu
  te,\u2019 kasi ty\u00e1 nde miso na makambo oyo olingaka mpe osepelaka na yango
  epai ya na ye. (Bagalatia 6:4) Mobali moko na nkombo Edmond oyo abal\u00e1 mbala
  mibale, alobi boye: \u201cNdenge kaka boninga ya bato mibale ezalaka ndenge moko
  te, mabala mibale mpe ezalaka ndenge moko te.\u201d\\nNdenge nini okoki kozala na
  bokatikati na oyo etali basuvenire ya malamu ya libala na yo ya kala mpe bomoi oyo
  obandi n\u00e1 molongani na yo ya sika? Jared alobi boye: \u201cNayebisaki mwasi
  na ngai ete libala na ngai ya liboso ezali lokola buku moko kitoko oyo ngai n\u00e1
  mwasi yango tokomaki. Na bantango mosusu, nakoki kofungola mpe kot\u00e1nga buku
  yango mpo na kokanisa makambo ya malamu oyo tosal\u00e1. Kasi, nazalaka na kati
  ya buku yango te. Kutu, ngai n\u00e1 ye tozali kokoma buku na biso moko, mpe yango
  nde esika nazali sikoyo.\u201d\\nMEK\u00c1 KOSALA BOYE: Tun\u00e1 molongani na yo
  soki esalaka ye mabe te ntango ob\u025btaka masolo ya molongani na yo ya kala. Luk\u00e1
  koyeba ntango oyo ekozala malamu te kolobela libala na yo ya liboso.\\nMOKAKATANO
  2: OZALI KOSALA NYONSO MPO OSOLOLAKA MALAMU NA BANINGA YA KALA OYO BAYEBI MOLONGANI
  NA YO YA SIKA MALAMU TE.\\nJavier oyo abalaki lisusu mbula 6 nsima ya koboma libala,
  alobi boye: \u201cMwa bambula nsima ya libala na biso, mwasi na ngai ya sika azalaki
  komona ete baninga na ngai mosusu bazalaki koluka koyeba makambo nyonso ya bomoi
  na ye.\u201d Mobali moko na nkombo L\u00e9on akutanaki na likambo oyo ekeseni na
  oyo ya Javier. Alobi boye: \u201cNa miso na ngai, bato mosusu bazalaki koloba na
  mwasi na ngai ete balingaka mobali na ye ya liboso mingi mpe bazali na mposa ya
  komona ye!\u201d\\nLIKANISI: Mek\u00e1 komitya na esika ya baninga na yo. Yan oyo
  tolobelaki liboso, alobi boye: \u201cNakanisi ete na bantango mosusu, baninga ya
  kala bamonaka ete bakokoka te kolekisa ntango n\u00e1 moto oyo azali kaka molongani
  ya sika ya moninga na bango.\u201d Na yango, \u2018kozala makambo makasimakasi te,
  monisel\u00e1 bato nyonso boboto mpenza.\u2019 (Tito 3:2) Tikel\u00e1 baninga mpe
  bandeko na yo ntango ya kobongola makanisi na bango. Ndenge kaka libala na yo ebongwani,
  baninga na yo bakoki mpe kobongwana. Javier, oyo tolobelaki alobi ete nsima ya mikolo,
  ye n\u00e1 mwasi na ye bazongelaki baninga na bango ya kala. Abakisi boye: \u201cKasi,
  tosalaka mpe makasi t\u00f3k\u00f3ma na baninga ya sika, yango mpe esalisaka biso.\u201d\\nTalel\u00e1
  mpe ndenge oyo molongani na yo ayokaka ntango bolekisaka ntango n\u00e1 baninga
  ya kala. Na ndakisa, soki likambo ya libala na yo ya liboso ek\u0254ti na masolo
  na bino, salel\u00e1 mayele mpe bososoli mpo molongani na yo amiyoka te ete botye
  ye pembeni. Biblia elobi ete \u201csoki moto azali koloba kozanga kokanisa, maloba
  yango ekoki kozokisa lokola mopanga. Kasi moto ya mayele atyaka likebi na makambo
  oyo alobaka. Maloba na ye ekoki kobikisa bampota yango.\u201d\u2014Masese 12:18,
  Biblia Holy Bible\u2014Easy-to-Read Version.\\nMEK\u00c1 KOSALA BOYE: Kanis\u00e1
  liboso mwa baf\u025bti oyo ekoki kobimisela yo to molongani na yo mikakatano. B\u00f3solola
  liboso ndenge ya malamu oyo bokoyanola na mituna ya baninga na bino mpe bakomant\u025br\u025b
  oyo bakosala mpo na libala ya liboso.\\nMOKAKATANO 3: OZALI KOSALA NYONSO OTYELAKA
  MOLONGANI NA YO YA SIKA MOTEMA MPO OYO YA LIBOSO AZALAKI SEMBO TE.\\nAndr\u00e9,
  oyo mwasi na ye ya liboso asundolaki ye, alobi boye: \u201cNazalaki kobanga kokutana
  lisusu na likambo ya ndenge wana.\u201d Na nsima, abalaki Riley, mwasi oyo azali
  na ye sikoyo. Alobi lisusu boye: \u201cMbala mingi, nazalaki komituna soki nakozala
  mobali malamu lokola mobali ya Riley ya liboso. Kutu, nazalaki kobanga ete Riley
  amona ngai mabe mpe azwa ekateli ya kotika ngai mpe abala moto mosusu.\u201d\\nLIKANISI:
  Yebis\u00e1 molongani na yo likambo oyo ezali kotungisa yo. Biblia elobi ete: \u201cMyango
  elongaka te esika lisolo ya nkuku ezali te.\u201d (Masese 15:22) Masolo ya nkuku
  esalisaki Andr\u00e9 n\u00e1 Riley b\u00e1tyelanaka motema. Andr\u00e9 alobi boye:
  \u201cNayebisaki Riley ete nakoluka soki moke te koboma libala mpo na kosilisa mikakatano,
  Riley ayebisaki ngai mpe bongo. Mokemoke, nak\u00f3maki mpenza kotyela ye motema.\u201d\\nSoki
  basalel\u00e1 molongani na yo likambo ya sembo te na libala na ye ya liboso, sal\u00e1
  nyonso oyo okoki mpo atyelaka yo motema. Na ndakisa, Michel n\u00e1 Sabine, oyo
  mabala na bango ya liboso ekufaki, bayokanaki ete b\u00e1yebisanaka makambo oyo
  basololi na balongani na bango ya kala. Sabine alobi ete \u201cyango esal\u00e1
  ete moto na moto azala na likambo ya kobanga te epai ya moninga.\u201d\u2014Baefese
  4:25.\\nMEK\u00c1 KOSALA BOYE: Kolekisa ndelo te na masolo ya nkuku oyo okoki kosolola
  na mwasi to mobali oyo azali molongani na yo te, ezala na telefone to na Internet.\\nBato
  mingi oyo babal\u00e1 mpo na mbala ya mibale balong\u00e1 na mabala na bango, yo
  mpe okoki kolonga. Kutu, ekoki kozala ete sikoyo omiyebi malamu koleka mbala ya
  liboso oyo obalaki. Andr\u00e9 oyo tolobelaki liboso alobi boye: \u201cNazw\u00e1
  lib\u0254ndisi moko ya koloba te na libala na ngai n\u00e1 Riley. Nsima ya kolekisa
  mbula 13 na libala na biso, boninga na biso ek\u00f3m\u00e1 makasi mpenza mpe tolingaka
  kobebisa yango te.\u201d\\n^ par. 5 Ya solo, moto oyo libala na ye esuki mpo molongani
  na ye akufi, ayokaka ndenge moko te na moto oyo abomi libala. Lisolo oyo ebongisami
  mpo na kosalisa baoyo bakutan\u00e1 na makambo ya ndenge wana, b\u00e1longa na libala
  na bango ya sika.\\nOMITUNA BOYE . . .\\n-\\nWapi bizaleli oyo nasepelaka na yango
  mingi epai ya molongani na ngai?\\n-\\nSoki lisolo ya libala na ngai ya liboso ek\u0254ti
  na masolo na biso, ndenge nini nakoki kosala mpo epesa molongani na ngai mpasi te
  to kokitisa lokumu na ye?\"", "\"Awa okokuta koponama monene ya bisaleli ya internet
  oyo ekosalisa yo osala calcul ya ba param\u00e8tres oyo esengeli ya ba structures
  ya kotonga mpe oyeba volume ya mosala ya botongi.\\nBa calculateurs ya botongi ezali
  basalisi oyo esengeli mpenza mpo na batongi oyo bayebi mosala malamu mpe bato oyo
  basalaka misala ya mab\u0254k\u0254 na bandako. Bazali kopesa yo nzela ya kosala
  ba calculs noki mpe na bosikisiki, koyeba motango ya biloko ya kotonga oyo esengeli
  mpe kosala calcul ya budget ya botongi.\\nBa calculateurs na biso nionso ezali ofele
  mobimba mpe ezali pete mpo na kosalela. Okoki kosalela yango na ordinat\u025br\u025b
  to na smartphone na yo ntango nyonso, esika nyonso. Tozali ntango nyonso kosala
  mpo na kobongisa mosala mpe kosala ete ba calculs ezala na bosikisiki mingi.\\nTozali
  ntango nyonso kosala mikolo oyo ba calculateurs en ligne mpe kobakisa makambo ya
  sika ya ntina.\\nKolekisa ntango mpamba te mpe banda kosalela ba calculateurs na
  biso ya botongi sikoyo. Tozali na elikya ete bakok\u00f3ma basalisi oyo bazali na
  ntina mingi na misala na bino ya botongi.\\nBa calculateurs ya toit\\nba calculateurs
  ya escalier ya mabaya\\nba calculateurs ya escalier ya m\u00e9tal\\nBa calculateurs
  pona ba fondations na ba produits ya b\u00e9ton\\nBa calculateurs ya biloko ya kotonga\\nBa
  calculateurs ya lopango, ya mur mpe ya mabele\\nBa calculateurs ya misala ya mabele\\nBa
  calculateurs ya volume na capacit\u00e9\\nBa calculateurs mosusu\"", "\"Bana e sengili
  ba batelama malamu na baboti, kasi awa na engumba Kisangani bana basusu ba komi
  ko tambola mpe ko lokota biteni ya mabende mpe milangi na ekunde ko kende ko teka
  mpo na ko Luka mwa kwanga.\\nMbula matari na nzela ya mobeko eye e tali bana, e
  pekisi bana ko sala mosala ya mombongo, kasi likambo ena e zali ko tosama te na
  baboti basusu.\\nKo bota elengi kasi ya motuya ko kolisa bana. Pasi mpe mawa ko
