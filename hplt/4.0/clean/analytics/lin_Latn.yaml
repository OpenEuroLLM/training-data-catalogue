  ya Nzambe? Mong\u00f3ng\u00f3 nini nde ezali Mong\u00f3ng\u00f3 ya litomb\u00e1
  mingi mpo na yo?\\nLelo oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nZ\u00e1bolo
  azali kotambola-tambola lokola liboso naino te kobundisa Mwasi na Ye ya Libala.
  Akoki kosala ete \u00f3kanisa ozali na malali to bokono ya lolenge moko boye, to
  kobundisa libota na yo. Ntango mosusu Nzambe atikaka makambo m\u00e1k\u00f3ma molili
  makasi na motindo ete okoki komona likol\u00f3 te, zingazinga, to esika mosusu te.
  Na nsima Ayei mpe afungol\u00ed nzela kati na yango mpo na yo, ete okoka koloba,
  \u201cNazali momb\u00f3to ya Ag\u00e1la te, nazali momb\u00f3to ya Sala te, nazali
  ata momb\u00f3to ya Malia te, nazali Momb\u00f3to ya Bokonzi ya Likol\u00f3 koleka
  ya Abalayama na Molimo ya Nzambe. Nazui Liloba ya Nzambe lilak\u00e1m\u00ed mpo
  na ngai, Ezali Yango Elobi Nkolo. Nakoningana te. Ata \u00e9m\u00f3nana motindo
  nini, zabolo \u00e1loba nini. Nyoso nazali na yango bosenga, Nakozua Nzambe na Liloba
  na Ye.\\nLelo oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nMong\u00f3ng\u00f3
  ya Nzambe mosili koloba. Nabombi Bilei nyonso ya Molimo bosengeli na yango. B\u00f3loba
  KAKA oyo ezali likol\u00f3 ya ba bande. Nazali Mong\u00f3ng\u00f3 ya Nzambe epai
  na bino. Liloba na ngai ezali na bosenga ya ndimbola moko te. Boswana to b\u00f3bunda
  te, b\u00f3lingana, KASI b\u00f3tikala na LILOBA NA NGAI.\\nLelo oyo, Lik\u00f3m\u00ed
  Liye Likok\u00eds\u00e1m\u00ed!\\nZal\u00e1 na ns\u00e9 te. Zind\u00e1 na mawa te.
  Tika te ete Satana \u00e1yiba ESENGO na yo. Kanisa oyo EZALI yo, wapi ozali kokende,
  ndenge makambo makozala na Elambo monene wana ya Libala. Kobika na Mboka kitoko
  wana Atong\u00e1ki kaka mpo na yo. Epai wapi okozala kati na Seko na Seko elongo
  na Ye mpe baoyo nyonso bakendeki liboso.\\nBokono lisusu te. Mpasi lisusu te. Kufa
  lisusu te. Bitumba lisusu te. Kaka Bomoi ya Seko elongo na Ye. Na nsima, tokoloba:\\nLelo
  oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nT\u00f3zala na molili te
  mpe toloba, \u201cNalemb\u00ed mpenza esika oyo, nalingi kobima awa. T\u00edka ete
  t\u00f3loba yango boye: Azali koya mon\u00fati s\u00e9 mon\u00fati sasaipi, MPONA
  NGAI\u2026NKEMBO! Nakoki kozila te. Nakomona balingami na ngai nyoso. Bakom\u00f3nana
  mpenza liboso na ngai, nsima nakoyeba, ESILI, TOKOMI.\\nNsima, na ns\u00e9 ya mwa
  ntango ya kobw\u00e9ta liso, tokozala biso banso elongo na ngambo mosusu.\\nTosepela
