  azali lelo, mpe akozala libela.\\nLelo oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nBaninga
  balingami na Arizona, California, Texas, kati na Amerika mpe NA MOKILI MOBIMBA baoyo
  bazali koyoka bande oyo na nzela ya ekanganeli; M-w-a-n-a ya Nzambe yango moko oyo
  ayaki na ebimelo ya ntango mpe amindimisaki lokola Nzambe amonisami kati na mosuni,
  azali M-w-a-n-a ya Nzambe yango moko na ndambo ya mokili na elimwelo ya ntango awa,
  oyo azali komit\u00e1lisa kati na lingomba na mpokwa oyo, lolenge moko lobi, lelo,
  mpe libela. Pole ya mpokwa ya Mwana eyei.\\nLelo oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nMong\u00f3ng\u00f3
  ya Masiya, oyo azalaki kotelema mpe koloba na et\u00e9yelo na mokolo na Ye, komiy\u00e9bisa
  elongo na Liloba ya elaka mpo na eleko wana, azali Mong\u00f3ng\u00f3 yango moko
  ya Masiya, koloba na Mwasi na Ye ya libala lelo na mokili mobimba likol\u00f3 ya
  ba bande, koyebisa biso: Nazali lolenge moko lobi, lelo mpe libela. NAZALI Mong\u00f3ng\u00f3
  ya Nzambe epayi na BINO. BOZALI MWASI NA NGAI YA LIBALA MOMB\u00d3TO YA BOKONZI
  YA MOLIMO oyo atikali elongo na Liloba na Ngai.\\nLelo oyo, Lik\u00f3m\u00ed Liye
  Likok\u00eds\u00e1m\u00ed!\\nMob\u00falungano molek\u00ed koleka kati ya bato lelo
  na lolenge ete bazangi komona Solo ya Nzambe. Ezali mpo ete ndimbol\u00e1-ndimbola
  ya bato ileki na Liloba ya Nzambe. Nzambe asengeli na moto moko te \u00e1limbola
  Liloba na Ye. Azali molimboli na Ye moko. Atindelaki Mwasi na Ye ya libala mwanje
  mosakoli Emoniseli 10:7 ya Ye mikolo ya Mong\u00f3ng\u00f3 kolimbola Liloba na Ye.
  Ezali YANGO ELOBI NKOLO.\\nLelo oyo , Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nOlobi,
  \u201csoko N\u00e1zalaka kuna ntango Yesu azalaki awa na mabel\u00e9, nalingaki
  kosala boye na boye.\u201d Malamu, wana ezalaki eleko na yo te. Kasi, oyo nde eleko
