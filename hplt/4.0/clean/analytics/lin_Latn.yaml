  bozali batomboki, noki te nakosilisa koboma bino na nzela.\\n4 Tango bato bayokaki
  maloba oyo ya somo, balataki pili, mpe ata moto moko te alataki lisusu biloko ya
  monzele.\\n5 Bongo Yawe alobaki na Moyize :\\n\u2014 Loba na bana ya Isalaele :
