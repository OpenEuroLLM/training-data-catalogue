  nzoto. Ezwamaka na bashambre ya ot\u025bl\u025b mpe na bisika ya kolala, to milangi
  mikemike ya sabuni ya mai oyo mbala mingi ezalaka na shampoing mpe conditionneur,
  mokomoko na yango ezali na nsolo mpe bizaleli ekeseni. Kasi, okosala nini soki olingi
  kokamwisa bapaya na yo? Savon ekangamaka na po\u00eale te. Ezali mpasi te mpo na
  kosukola\"", "\"33\\nYawe atindi Moyize\\n1 Yawe alobaki na Moyize :\\n\u2014 Kende,
  longwa na esika oyo elongo na bato oyo obimisaki na Ejipito ; kende na mokili oyo
  nalakaki na ndayi epai ya Abrayami, Izaki mpe Jakobi ete nakopesa yango epai na
  bana na yo.\\n2 Nakotinda anjelu liboso na yo, nakobengana bato ya Kanana ya Amori,
  ya Iti, ya Perizi, ya Evi mpe ya Yebusi.\\n3 Bokende na mokili oyo ezali kobimisa
