  POUR LIRE TOUS LES COMMENTAIRES\"", "\"Mibeko ya likolo ya botongi tempelo oyo bazali
  kosalela na Eklezia oyo ezali emekoleli kutu elilingi ya lolenge boni tosengeli
  kotambwisa bomoi na biso moko.\\nKala mingi te wana ezalaki ngai kotalaka misala
  ya tempelo kitoko ya Brigham City Utah, namikundolaki likambo nakutanaki na yango
  ntango nazalaki kosala lokola coordinateur ya bofungoli mpo na bato banso, ya bozongi
  kobulisa, mpe ya milulu nyonso ya bosepeli ya oyo ekenda sango Tempelo ya Laie Hawaii.\\nMwa
  basanza liboso basilisa misala ya bobongisi mpo na kokomisa yango monene mpe sika,
  nabiangamaki kotala elongo na Mokambi ya Misala ya Tempelo, Mpaka William R. Walker,
  mpe Baninga na ye Basali ya misala ya Tempelo. Mpo na kobakisa, bato mingi ya bakompani
  oyo bapesamaki misala bayaki. Ntina ya botamboli wana ezalaki na ndambu mpo na kotala
  bokei liboso mpe motuya ya mosala oyo esalemaki. Na ntango tazalaki kotal, mosala
  esalemaki na motuya ya 85 na monkama.\\nWana ezalaki biso kokota na tempelo, nazalaki
  kotala mpe koyoka Mpaka Walker mpe baninga na ye ya mosala ntango bazalaki kotala
  mosala mpe kosolola elongo na mokambi ya bato ya misala. Ntango na ntango nazalaki
  komona moto moko kotambwisaka loboko na ye na efelo wana ezalaki biso kokende uta
  eteni ya ndako moko na mosusu. Mwa ntango nsima ya kosala eye, akomipakola misapo
  yango na yango mpe koya penepene ya mokambi ya basali mpe koloba, \u201cNazali koyoka
  mwa makwanza na efelo oyo. Makwanza ezali mobeko ya tempelo te. Bosengeli kopalisa
  lisusu mpe sembisa efelo oyo.\u201d Mokambi ya basali na botosi nyonso azalaki kokoma
  eloko moko moko bamonaki.\\nEkomaki biso penepene ya esika moko na tempelo wapi
  bobele bato moke bakokaki komona, moto se moko wana atelemisaki biso mpe abendaki
  bokebi na biso na lininisa moko ya tala tala ya kitoko oyo batiaki kala mingi te.
  Lininisa oyo ezalaki mapeka mibale (0.6 m) na monene na mapeka motoba (1.8 m) na
  molai mpe ezalaki na emekoleli moko ya tala-tala ya bakale ya matono matono. Alakisaki
  mosapi na tala-tala moko ya moke ya kale ya basentimetele (5 cm) mpe ya langi-langi
  oyo ezalaki na emekoleli ya mpamba mpe alobaki, \u201cKale wana ezali ya kobeba.\u201d
  Natalaki kale yango mpe na miso na ngai emonanaki ete batii yango malamu. Nzokande,
  soki motali mpembeni na emekolelo na maboko, nakokaki komona ete mbeba ezalaki mpe
  ete mwa kale wana ezalaki solo mpenza na molai likolo ya (3 mm) ya kobeba. Malakisi
  mapesamaki boye na mokambi ya basali ete lininisa mosusu etiama na esika wana mpo
  ezalaki te mobeko ya tempelo.\\nNandimi yango ete nakamwaki ete lininisa mobimba
  etiama na esika ya oyo wana kaka mpo na mwa mbeba wana ya moke oyo ezalaki kutu
  komonana te. Solo mpenza, ezalaki mpenza mpasi ete moto ayeba to nkutu amona lininisa
  oyo na kotalaka mosika kuna ezalaki na tempelo.\\nLokola nazalaki kozonga ndako
  kotambwisaka motuka uta na tempelo mokolo wana, nabanzaki nini nayekolaki uta na
  likambo oyo\u2014to, nzokande, oyo nakanisi nayekolaki. Bososoli na ngai ya oyo
  nayekolaki ekomaki polele te kino mposo mingi nsima ntango babiangaki ngai kotambola
  mpo nakotala nzinga nzinga na tempelo oyo esilaki sikawa.\\nWana ezalaki ngai kokota
  na tempelo ebongisami mobimba ya Laie Hawaii Temple, nakamwaki mingi na kitoko na
  yango mpe motuya ya misala ya nsuka. Bokoki kososola ete litomba na ngai ezalaki
  monene ya komona lisusu bifelo wana ya \u201cmakwanza\u201d mpe lininisa wana \u201cebeba\u201d.
  Mokambi ya basali apalisaki lisusu mpe asembisaki bifelo? Batiaki solo lininisi
  ya esika na esika ya liboso. Lokola napusanaki penepene na bifelo wana ya makwanza,
  nakamwaki na komonaka ete batiaki nkasa ya kozipa kodiembela na bifelo yango. Likanisi
  na ngai ya liboso ezalaki, \u201cBoye oyo ezali nde lolenge mokambi ya misala abongisaki
  makwanza\u2014azipaka yango.\u201d Kasi te, nayekolaki ete moango ezalaka ntango
  nyonso ya kuzipa bifelo na nkasa. Namitunaki mpo na nini mwa makwanza ya mike oyo
  ekoki mpenza komonana te ezali kosala mpasi soki esengelaki nkasa ya bifelo mpo
  na kozipa yango? Nsima napusanaki malembe na esika wapi lininisa ya kobeba ezwamaki
  mpe nasutukaki na komona Mbeki moko ya kitoko balona nzete ya molai kino na palafo
  efanda semba liboso ya lininisa yango. Lisusu, nabanzakio, \u201cBoye oyo ezali
  nde lolenge mokambi ya misala abongisaki mwa kale ebeba\u2014azipaka yango.\u201d
  Lokola napusanaki pembeni, napusaki nkasa ya milona wana na mupanzi mpe napwepwaki
  ntango namonaki ete solo mpenza batiaki lininisa mosusu na esika na yango. Mwa kale
  yak ala ebeba etelemaki ya kobongisama kitoko mpenza na emekoleli yango. Nayekolaki
  ete ezalaka eteni ya eyembeli ya kati ya kotia milona na liboso ya lininisa.\\nMpo
  na nini bifelo na mwa makwanza mpe lininisa na kale ebongi te ezalaki kosenga misala
  ya kobakisa kutu batia mosusu na esika na yango ntango maboko to miso moke kaka
  ekoyeba yango mpe na mpasi? Mpo na nini moto bapesi misala asengeli kokangama na
  mibeko mina ya likolo?\\nWana ebimaki na tempelo komelamaka na makanisi, nazwaki
  eyano na ngai ntango natalaki likolo na libanda oyo babongisaki kitoko mpe namonaki
  maloba maye: \u201cBosantu na Nkolo, Ndako ya Nkolo.\u201d\\nBatempelo ya Eklezia
  oyo ezali sikisiki mpenza lokola esakolamaki. Bandako oyo ya bule etongami mpo tosalela
  yango, mpe kati na bifelo na yango makuli ya bule mpe ya lobiko ezali kosalema.
  Kasi ntembe esengeli te kozala mpo na eye etali nani azali nkolo ya ndako yango.
  Na kosengaka ete batonga yango sikisiki mpe balanda mibeko ya botongi eteni na eteni,
  tozali bobele kolakisa bolingo na biso na Nkolo Yesu Klisto te, kasi tozali lisusu
  kolakisa na baye batalaka biso ete tozali kokumisa mpe kokumbamela Ye oyo azali
  nkolo ndako.\\nNa bobimisi bopesama na Profeta Joseph Smith mpo na kotonga tempelo
  na Nauvoo, Nkolo atindaki ete:\\n\u201c\u201cBoya, na wolo na bino nyonso, mpe palata
  na bino, mpe mabanga ma bino ma ntalo, mpe biloko na bino ya kala ya motuya binso;
  mpe elongo na banso oyo bazali na boyebi ya biloko ya kala ya motuya\u2026mpe bomema\u2026
  banzete nyonso ya motuya ya mabele;\\n\u201c\u2026botonga ndako mpo na nkombo na
  ngai, ete Oyo Aleki Likolo afanda na kati.\u201d1\\nOyo elandi ndakisa etiami na
  Mokonzi Salomo na Boyokani ya Kala ntango atongaki tempelo moko mpo na Nkolo kosalelaka
  bobele biloko ya kitoko makasi bisalelami na mayele ya ntoki ya bato.2 Lelo tozali
  kokoba kolanda emekoli se moko oyo, na kozangaka kolekisa ndelo, ntango tozali kotonga
  batempelo ya Eklezia.\\nNayekolaki ete atako miso mpe maboko ya bokufi ekoki te
  komona to koyoka mbeba, Nkolo ayebi motuya ya makasi tosali mpe soki tosalaki makasi
  nyonso ekoki na biso. Ezali se ndenge moko na makasi tozali kosala mpo na kotambwisa
  bomoi oyo elongobani mpo na kozwa mapamboli ma tempelo. Nkolo apesaki toli ete:\\n\u201cMpe
  mbala nzike lokola bato ba ngai batongeli ngai ndako na nkombo ya Nkolo, mpe batiki
  nzela te ete eloko moko te ya mbindo ekota na kati, ete esantolama, nkembo na ngai
  ekozala likolo na yango;\\n\u201cIyo, mpe nakozala kuna, mpo nakoya kati na yango,
  mpe bato ya peto na mitema oyo bakoya na kati bakomona Nzambe.\\n\u201cKasi soki
  esantolami nakoya na kati te, mpe nkembo na ngai ekozala kun ate; mpo na koya na
  batempelo ezanga bosantu te.\u201d3\\nLokola mokambi ya basali misala, ntango toyebi
  makambo maye kati na bomoi na biso ezali koyokana te na malongi ya Nkolo, ntango
  makasi tosali ekokaki mpenza na maye nyonso tokokaki kosala te, tosengeli noki kokende
  kosembola eloko nyonso ezali mabe, koyebaka ete tokoki kobombela Nkolo masumu na
  biso te. Tosengeli komikundola ete \u201ckasi ntango tozali koluka kobomba masumu
  ma biso, \u2026 tala, lola ibendami yangomei; Molimo mwa Nkolo [mpe] eyokisami mawa.\u201d4\\nNayekolaki
  lisusu ete mibeko ya likolo ya kotonga tempelo miye Eklezia azali kosalela ezali
  ndakisa nkutu elilingi ya boniboni tosengeli kotambwisa bomoi na biso moko. Tokoki
  moto na moto kosalela mateya ya Apostolo Paulo maye mapesamaki na Eklezia ya kala
  ntango alobaki:\\n\u201cBoyebi te ete bino bozali tempelo ya Nzambe, mpe ete Molimo
  ya Nzambe avandaka kati na bino?\\n\u201c\u201cSoki moto abomi temepelo ya Nzambe,
  Nzambe akoboma ye; mpamba te tempelo ya Nzambe ezali ya santu, mpe bino bozali ndako
  yango.\u201d5\\nTotongami moko na moko na biloko ya motuya ya ntoki, mpe tozali
  mbano ya kokamwa biloko bisalemi na maboko ya Nzambe. Nzokande, soki toleki kaka
  mibu ya boyanoli mpo na kokota na libanda ya etumba na masumu mpe mimekano, tempelo
  na biso moko ekoki kozala na mposa ete babongisa yango ezonga sika. Mbele ezali
  na bifelo kati na biso oyo ezali makwanza makwanza mpe esengeli kopalisama to maninisi
  ya milimo na biso oyo esengeli batia mosusu na esika na yango mpo ete totelema na
  bisika ya bosantu. Ngolu na biso nde mobeko ya tempelo oyo tosengeli kokokisa ezali
  moye ya bobongi nie te, atako tozali kobunda mpo na yango, kasi nde tozali kobomba
  mitindo mpe kosala manso tokoki mpo na kotambwisa bomoi na biso lokola bayekoli
  ya Yesu Klisto. Ezali losambo na ngai ete tokosala makasi mpo na kotambwisa bomoi
  oyo elongobani mpo na kozwa mapamboli ya tempelo nakosalaka manso tokoki, na kobongisa
  nyonso esengeli mpe kolongolaka mbeba mpe mabe ete Molimo ya Nzambe akoka ntango
  nyonso kozala elongo na biso. Na nkombo ya Yesu Klisto, amene.\"", "\"NSANGO: 65-0219
  Lelo Oyo Likomi Oyo Ekokisami\\n- 24-0609 Lelo Oyo Likomi Oyo Ekokisami\\n- 22-1113
  Lelo Oyo Likomi Oyo Ekokisami\\n- 19-0616 Lelo Oyo Likomi Oyo Ekokisami\\nMolingami
  Mwasi ya libala Momb\u00f3to ya Bokonzi ya Molimo ya Likol\u00f3 koleka,\\nKozila
  lisusu te, komituna lisusu te, TOSILI TOK\u00d3MI! ToZALI Mwasi ya libala Momb\u00f3to
  ya Bokonzi ya Molimo ya Likol\u00f3 koleka.\\nMomboto ya Molimo epai ya Mwana ya
  Bokonzi alakamaki. Lib\u00f3k\u00e9 moko boye te na mikolo mikoya; libota likoy\u00e1
  te; tozali kobika na mokolo ya nsuka, tozali libota likom\u00f3na Yesu Klisto koz\u00f3nga
  na mabel\u00e9.\\nLelo oyo, Lik\u00f3m\u00ed Liye Likok\u00eds\u00e1m\u00ed!\\nNsango
