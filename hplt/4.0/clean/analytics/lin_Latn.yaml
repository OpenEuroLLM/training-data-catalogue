  oyo lob\u0254k\u0254 na yo ezwi mpo na kosala, sal\u00e1 yango na makasi na yo nyonso,
  mpo mosala ezali te, mikano te, boyebi te, bwanya mpe te na Nkunda, esika ozali
  kokende.\u201d\\n\u201c[Yesu] abakisaki: \u2018Moninga na biso Lazare alali mp\u0254ngi,
  kasi nazali kokende kuna mpo na kolamwisa ye.\u2019 Nzokande, Yesu alobelaki liwa
  na ye. Kasi bango bakanisaki ete azalaki koloba ete Lazare alali mp\u0254ngi, azali
  kopema. Na yango Yesu alobaki na bango polele ete: \u2018Lazare akufi.\u2019\u201d\"",
  "\"LA PRI\u00c9RE ( ENSEIGNEMENT SUR LA PRI\u00c9RE ) AVEC LE PASTEUR YVON STABILI\\n25
  d\u00e9cembre 2014 2 h 33 min\\nLa sagesse Africaine nous dit ceci:\u2026soki o
  silisi ko liya na ndaku nayo, ko kende ko beta lokole na balabala te que, na wuti
  koliya pe na tondi makasi parceque, eza naba oyo ba liaka pe ba tondaka mikolo nioso
  ko leka , sans que ba vova.\\nNani a yebi lisolo ya Muyaka azuwi le 15 te hein?
  ko zuwa ya mobola e zalaka na makelele mingi ko leka mbongo ya bibende.\\nKozanga
  vie sociale ezali pasieeee, No\u00ebl batu baleki yango en toute gaiet\u00e9 en
  famille, le vieux jaloux idiot brazzavillageois aleki yango na ba sites internet
  ya bana RDC, Kieeee mawa na pasiiieeee encore une preuve que vieux jaloux asalaka
  rien na vie, musala te, muasi te, bana te\u2026 Kaka kozalaka na ba sites internet
  ya ba idoles na ye. Ata na NO\u00cbL :confused: kiekiekieeeeeee\\nBiso Bazombo to
  lobaka \u00ab sala sambila, sambila \u2026sala \u00bb. Donc, losambo \u00e9 balana
  na misala.\"", "\"Na mokolo ya 6/05/2017, Batatoli ya Yehova soki 130, basi n\u00e1
  mibali bapesaki mab\u0254k\u0254 na mosala ya kotya bop\u025bto na zamba ya mboka
  Bryukhovychi, pene ya engumba Lviv, na Ukraine. Bavolont\u025br\u025b yango ya mbula
  kobanda 22 tii 80, bafandaka mpe basalaka na Biro ya Batatoli ya Yehova na Ukraine,
  oyo ezali pene ya zamba yango. Bap\u025btolaki ektare koleka 50 ya esika yango mpe
  bal\u0254k\u0254taki basalite ya kilo soki 600 na boumeli ya ngonga misato mpamba.\\nMykhailo,
  ing\u00e9nieur oyo akambaka centre moko ya kob\u0254k\u0254la bibwele mpe kotimola
  mabulu, alobaki ete \u201cBatatoli ya Yehova bazalaki bato ya liboso ya kopesa mab\u0254k\u0254
  na mosala yango oyo esalemaka mbula nyonso mpe basalaka yango mbula nyonso banda
  2014.\u201d\\nMpo na nini es\u025bngaka kotya bop\u025bto na zamba yango?\\nSplavinskyi
  alobi ete \u201czamba yango ek\u00f3maka salite na balolenge mibale: ya liboso,
  bato mosusu oyo balekaka wana batikaka basalite na bango mpe ya mibale mituka minene
  eyaka kobwaka basalite oyo etikalaka ntango batongaka bandako, mpe basalite mosusu.\u201d\\nBosoto
  ezali likambo moke te mpo na zamba. Splavinskyi, alobi boye: \u201cEzwaka ntango
  molai mpo bosoto ep\u0254la mpe na nsima ebebisaka mai ya nse ya mabele, mpe yango
  esalaka ete mabele ebeba.\u201d Milangi oyo babwakaka ekoki kongalisa kong\u025bnga
  ya moi, mpe kopelisa m\u0254t\u0254 na zamba. Longola yango, milangi ebukan\u00e1
  mpe bantonga ezali likama, mingimingi mpo na bana mike. Abakisi ete \u201ctokoki
  kokima makama wana soki tozali kolongola basalite yango.\u201d\\nKop\u025btola ektare
  3300 ya zamba ezali mosala monene mpenza. Splavinskyi alobi boye: \u201cBaoyo babatelaka
  zamba yango bazali kaka mitano, yango wana tokoki te kop\u025btola esika monene
  boye. Na yango, mbala moko na mbula tos\u025bngaka moto nyonso aya kopesa biso mab\u0254k\u0254
  na mosala ya kop\u025btola zamba.\u201d\\nKosangisa, kokabola, mpe kotya na esika
  na yango\\nBatatoli ya Yehova oyo bayaki kotya bop\u025bto na esika yango bamemaki
  ba-gants, basaki ya plastiki, mpe barato mpo na kol\u0254k\u0254ta bapin\u025b ya
  mituka, milangi, bibende, bapapye, baplastiki mpe bantonga oyo basalel\u00e1. Ihor
  Fedak, moto moko oyo asalaka na zamba yango alobi ete mpo na yango \u201cesika oyo
  Batatoli ya Yehova basalaki mosala ek\u00f3mi mpenza p\u025bto.\u201d\\nAtako mibeko
  es\u025bngi yango te, bavolont\u025br\u025b yango batyaki bos\u0254t\u0254 na bos\u0254t\u0254
  na esika na yango; na ndakisa milangi, bapapye mpe baplastiki, yango ekopesa nzela
  ete b\u00e1salela yango mpo na kosala biloko mosusu. Boye, kompanyi moko ekoki kozwa
  bos\u0254t\u0254 yango mpo na kosala biloko mosusu. Kobanda 2016, Batatoli ya Yehova
  bafutaka mbongo mpo na basalite oyo balongolaka. Fedak alobi: \u201cNapesi Batatoli
  ya Yehova mersi ndenge basalisi biso. Basalisaka biso mingi mpenza.\u201d\\n\u201cKotya
  bop\u025bto elongolaka lokumu na ngai te\u201d\\nBatatoli ya Yehova basepelaka kopesa
  mab\u0254k\u0254 na kotya bop\u025bto na zamba yango mbula nyonso. Basepelaka kosalisa
  bato na bisika oyo bafandi mpo zamba ezala kitoko. Volker alobeli makanisi oyo mingi
  na bango bazalaka na yango: \u201cKotya bop\u025bto elongolaka lokumu na ngai te.
  Kosala likambo moko mpo na basusu ezali lokumu mpe epesaka esengo.\u201d\\nAnzhelika
  alobi boye: \u201cMpo na ngai, likambo ya ntina ezali te moto oyo atyaki bos\u0254t\u0254
  yango, kasi nde oyo nakoki kosala mpo na kolongola bos\u0254t\u0254 yango.\u201d
  Lois, oyo azali na mbula 78 mpe apesaki mab\u0254k\u0254 na mosala yango; alobi
  boye: \u201cNa esika osilika mpo na basalite yango ntango okei kotambola, eleki
  malamu kolongola nde yango.\u201d\\nWieslaw alobi boye: \u201cMbala mingi bato bamonaka
  ndenge tolataka kitoko n\u00e1 bakravati ntango tobimaka mpo na koteya nsango malamu.
  Kasi tondimaka mpe kolalisa bakazaka na biso mpo na kotya bop\u025bto na zamba to
  kosala mosala mosusu oyo ekopesa bato litomba.\u201d\"", "\"Nzambe alakaki Abrahama
  ete mokitani na ye moko akomemela \u201cbik\u00f3lo nyonso ya mabele\u201d mapamboli.
  (Ebandeli 22:18) Mokitani yango nde nani?\\nEsali sikoyo mbula soki 2 000, Nzambe
  apesaki Yesu, oyo azali mokitani ya Abrahama, nguya ya kosala makamwisi. Makamwisi
  yango emonisaki ete elaka oyo Nzambe apesaki Abrahama ete akopambola bik\u00f3lo,
  ekokokisama na nzela ya Yesu.\u2014Bagalatia 3:14.\\nMakamwisi oyo Yesu asalaki,
  esalisaki bato b\u00e1mona ete Nzambe aponi Yesu mpo na kopambola bato mpe ete na
  nzela na ye Nzambe akopesa bato mapamboli ya seko. Makamwisi oyo Yesu asalaki emonisaki
  bizaleli na ye mosusu ya malamu, na ndakisa:\\nBoboto: Yesu abikisaki bato ya maladi.\\nMokolo
  moko, moto ya maba abondelaki Yesu abikisa ye. Yesu asimbaki ye mpe alobaki na ye:
  \u201cNalingi.\u201d Na mbala moko, maba esilaki.\u2014Marko 1:40-42.\\nEzaleli
  ya kokaba: Yesu aleisaki bato oyo bazalaki na nzala.\\nYesu azalaki kolinga te ete
  bato b\u00e1kufa nzala. Mbala mibale, asalaki likamwisi na ndenge akomisaki ebele
  mwa mampa mpe mwa mbisi mpo na koleisa bankot\u00f3 ya bato. (Matai 14:17-21; 15:32-38)
  Nsima ya kolya, bato nyonso batondaki mpe biloko ya kolya etikalaki ebele.\\nMotema
  mawa: Yesu asekwisaki bakufi.\\n\u201cMawa\u201d etindaki Yesu asekwisa mwana mobali
  se moko ya mwasi oyo mobali akuf\u00e1, oyo azalaki na moto mosusu te ya kosalisa
  ye.\u2014Luka 7:12-15.\"", "\"1. Nini ekoki kosalisa biso t\u00f3yeba makambo oyo
  ekosalema na mikolo ezali koya?\\nNSIMA ya kolanda bansango, ek\u00f3mel\u00e1 yo
  omituna: \u2018Mokili oyo ezali kokende wapi?\u2019 Lokola makambo ya ns\u0254m\u0254
  mpe mabe ek\u00f3mi mingi, bato mosusu bak\u00f3mi kondima ete nsuka ya mokili ek\u00f3mi
  pene. Ezali solo? Tokoki koyeba makambo oyo ekosalema na mikolo ezali koya? \u0190\u025b.
  Bato bakokoka te koyebisa makambo oyo ekoya, kasi Yehova Nzambe akoki kosala yango.
  Na Biblia, ayebisi biso ndenge bomoi mpe mabele ekozala na mikolo ezali koya.\\n2,
  3. Bayekoli ya Yesu balingaki koyeba nini, mpe Yesu ayebisaki bango nini?\\n2 Ntango
  Biblia elobeli nsuka ya mokili, elingi koloba te ete mabele ekobebisama; yango elimboli
  nde ete mabe ekosila. Yesu ateyaki bato ete Bokonzi ya Nzambe ekoyangela mabele.
  (Luka 4:43) Bayekoli ya Yesu balingaki koyeba ntango oyo Bokonzi ya Nzambe ekoya,
  yango wana batunaki ye: \u201cMakambo yango ekosalema ntango nini, mpe elembo nini
  ekomonisa kozala na yo mpe bosukisi ya makambo ya ntango oyo?\u201d (Matai 24:3)
  Yesu ayebisaki bango mokolo mpe ngonga te; kasi ayebisaki bango makambo oyo ekosalema
  liboso ete nsuka ya mokili eya. Makambo oyo Yesu alobaki ete ekosalema ezali kosalema
  lelo oyo.\\n3 Na mokapo oyo, tokolobela makambo oyo emonisi ete tozali na eleko
  oyo esengelaki kozala liboso ya nsuka ya mokili. Kasi, tosengeli liboso kolobela
  etumba moko oyo ebimaki na likol\u00f3 mpo t\u00f3yeba ntina oyo makambo ebebi boye
  awa na mabele.\\nETUMBA MOKO NA LIKOL\u00d3\\n4, 5. (a) Nini esalemaki na likol\u00f3
  ntango Yesu ak\u00f3maki Mokonzi? (b) Ndenge Emoniseli 12:12 elobi, nini esengelaki
  kosalema awa na mabele ntango babwaki Satana?\\n4 Na Mokapo 8, toyekolaki ete Yesu
  ak\u00f3maki Mokonzi na likol\u00f3 na 1914. (Danyele 7:13, 14) Mokanda ya Emoniseli
  eyebisi biso makambo oyo esalemaki: \u201cEtumba ebimaki na likol\u00f3: Mikaele
  [elingi koloba Yesu] n\u00e1 baanzelu na ye babundaki na drag\u0254 [Satana], mpe
  drag\u0254 n\u00e1 baanzelu na yango babundaki.\u201d * Satana n\u00e1 bademo na
  ye balongaki etumba te mpe babwakamaki na mabele. Kanis\u00e1 esengo oyo baanzelu
  bayokaki! Bongo bato awa na mabele? Biblia elobaki ete ekozala eleko moko ya yikiyiki
  mpo na bato. Mpo na nini? Mpo Zabolo azali na nkanda makasi, \u201cmpo ayebi ete
  azali na ntango mokuse.\u201d\\n5 Zabolo azali kosala nyonso atya mobulu na mabele
  ndenge alingi. Azali na nkanda makasi mpo atikali na ntango mokuse liboso Nzambe
  aboma ye. T\u00f3talela sikoyo makambo oyo Yesu alobaki ete ekosalema na mikolo
  ya nsuka.\\nMIKOLO YA NSUKA\\n6, 7. Tokoki koloba nini mpo na bitumba mpe nzala
  lelo oyo?\\n6 Bitumba. Yesu alobaki: \u201cEk\u00f3lo ekobunda na ek\u00f3lo mpe
  bokonzi ekobunda na bokonzi.\u201d (Matai 24:7) Bitumba ya mikolo na biso ebomi
  bato mingi koleka bitumba nyonso ya ntango ya kala. Lapolo ya ebongiseli moko oyo
  elandelaka makambo ya mokili emonisi ete kobanda mobu 1914, bitumba ebomi bato koleka
  milio 100. Bato oyo babomami na bitumba na boumeli ya mbula 100, kobanda mobu 1900
  tii mobu 2000, baleki mbala misato bato oyo babomamaki na boumeli ya mbula 1900,
  elingi koloba banda na si\u025bkl\u025b ya liboso tii na mobu 1899. Kanis\u00e1
  naino mawa mpe mpasi oyo bamilio ya bato bayok\u00e1 mpo na bitumba!\\n7 Nzala.
  Yesu alobaki: \u201cNzala ekozala.\u201d (Matai 24:7) Lelo oyo, biloko ya kolya
  ek\u00f3mi mingi mpenza, kasi bato mingi balyaka kaka malamu te. Mpo na nini? Mpo
  bazangi mbongo ya kosomba bilei to mabele ya kosala bilanga. Mbongo oyo bato koleka
  miliare moko bazalaka na yango mpo na kobikela mokolo mobimba ekoki ata dolare moko
  te. Ebongiseli ya ONU oyo etalaka bokol\u0254ng\u0254n\u0254 ya nzoto (OMS) elobi
  ete bamilio ya bana bakufaka mbula na mbula, mingimingi mpo balyaka malamu te.\\n8,
  9. Nini emonisi ete bisakweli ya Yesu oyo elobeli koningana ya mabele mpe maladi
  ekokisami?\\n8 Koningana ya mabele. Yesu asakolaki ete: \u201cMabele ekoningana
  makasi na bisika ndenge na ndenge.\u201d (Luka 21:11) Lelo oyo, mbula nyonso mabele
  eninganaka makasi mpenza. Kobanda mobu 1900, koningana ya mabele esili koboma bato
  koleka milio mibale. Mpe atako ezali lelo na bamasini, oyo kala ezalaki te, oyo
  ezali kosalisa bato b\u00e1yeba ete mabele ekoningana liboso kutu esalema, bato
  mingi bazali kaka kokufa.\\n9 Maladi. Yesu asakolaki ete \u201cbamaladi mabe\u201d
  ekozala. Bamaladi ya mabe esengelaki kopalangana nokinoki mpe koboma bato mingi.
  (Luka 21:11) Atako minganga bayekoli ndenge ya kosalisa bamaladi ebele, bamaladi
  mingi ezwi naino nkisi te. Kutu, lapolo moko emonisi ete mbula na mbula, maladi
  ya ntolo, malaria, kolera ezali koboma ebele mpenza ya bato. Esuki kaka wana te;
  minganga bamoni bamaladi ya sika 30, mpe mosusu kati na yango ezali na nkisi te.\\nBIZALELI
  YA BATO NA MIKOLO YA NSUKA\\n10. Ndenge nini 2 Timote 3:1-5 ezali kokokisama lelo?\\n10
  Na 2 Timote 3:1-5, Biblia elobi: \u201cMikolo ya nsuka ekozala ntango moko ya mpasi
  mpenza mpe ya mikakatano.\u201d Ntoma Paulo amonisaki bizaleli oyo bato mingi bakozala
  na yango na mikolo ya nsuka. Alobaki ete bakozala\\nbato oyo bamilingaka\\nbato
  baling\u00e1 mbongo\\nbato oyo batosaka baboti te\\nbato oyo bazangi bosembo\\nbato
  oyo balinganaka te na kati ya libota\\nbato oyo bazangi komipekisa\\nbato ya nkanda
  mpe ya mobulu\\nbato oyo baling\u00e1 bisengo na esika ya kolinga Nzambe\\nbato
  oyo balobaka ete balingaka Nzambe kasi baboyaka kotosa ye\\n11. Ndenge Nzembo 92:7
  elobi, nini ekok\u00f3mela bato mabe?\\n11 Omonaka bato na bizaleli ya ndenge wana
  na esika ofandi? Bato mingi na mokili mobimba bamonaka yango. Kasi etikali moke
  Nzambe asilisa likambo yango. Alaki ete: \u201cNtango bato mabe bazali kobima lokola
  matiti mpe bato nyonso oyo basalaka makambo oyo eyokisaka mpasi bazali kokola, ezali
  mpo b\u00e1sila ny\u025b\u025b [to b\u00e1bomama] libela.\u201d\\nNSANGO MALAMU
  NA MIKOLO YA NSUKA\\n12, 13. Makambo nini Yehova ateyi biso na mikolo oyo ya nsuka?\\n12
  Biblia esakolaki ete na mikolo ya nsuka, mokili ekotonda na bampasi mpe minyoko.
  Kasi, Biblia elobi lisusu ete makambo ya malamu mpe ekosalema.\\n13 Koyeba Biblia.
  Mosakoli Danyele mpe alobelaki mikolo ya nsuka. Akomaki boye: \u201cBoyebi ya sikisiki
  ekok\u00f3ma mingi.\u201d (Danyele 12:4) Nzambe asengelaki kopesa basaleli na ye
  mayele ya koyeba Biblia malamu koleka liboso. Yehova azali kosala bongo, mingimingi
  banda 1914. Na ndakisa, ateyi biso ntina ya nkombo na ye mpe mokano na ye mpo na
  mabele, solo na oyo etali lisiko, bakufi mpe lisekwa. Toyekoli ete kaka Bokonzi
  ya Nzambe nde ekoki kosilisa mikakatano nyonso ya bato. Toyekoli mpe ndenge ya kozala
  na esengo mpe ya kozala na bomoi oyo esepelisaka Nzambe. Kasi, basaleli ya Nzambe
  basalaka nini na makambo oyo bayekoli? Esakweli mosusu epesi eyano.\\n14. Nsango
  malamu ya Bokonzi ezali kosakolama wapi, mpe banani bazali kosakola yango?\\n14
  Mosala ya kosakola na mokili mobimba. Ntango Yesu azalaki kolobela mikolo ya nsuka,
  alobaki ete: \u201cNsango malamu oyo ya bokonzi ekosakolama na mabele mobimba esika
  bato bafandi.\u201d (Matai 24:3, 14) Nsango malamu ya Bokonzi ezali kosakolama na
  mikili koleka 230 mpe na min\u0254k\u0254 koleka 700. Ya solo, na mabele mobimba,
  Batatoli ya Yehova ya \u2018bik\u00f3lo nyonso mpe ya mabota nyonso\u2019 bazali
  kosalisa bato b\u00e1yeba Bokonzi ya Nzambe mpe makambo oyo Bokonzi yango ekosalela
  bato. (Emoniseli 7:9) Mpe basalaka yango ofele. Ata soki bato mingi bayinaka bango
  mpe banyokolaka bango ndenge Yesu asakolaki, eloko moko te ekoki kopekisa mosala
  ya kosakola.\\nOKOSALA NINI?\\n15. (a) Ondimi ete tozali na mikolo ya nsuka? Mpo
  na nini? (b) Nini ekok\u00f3mela bato oyo batosaka Yehova mpe baoyo batosaka ye
  te?\\n15 Ondimi ete tozali na mikolo ya nsuka? Bisakweli mingi ya Biblia oyo elobeli
  mikolo ya nsuka ezali kokokisama. Etikali moke Yehova asukisa mosala ya kosakola
  nsango malamu, mpe \u201cnsuka\u201d eya. (Matai 24:14) Nsuka ezali nini? Ezali
  Armagedone, ntango Nzambe akolongola mabe nyonso. Yehova akosalela Yesu mpe baanzelu
  na ye ya nguya mpo na koboma moto nyonso oyo aboyi kotosa Ye mpe Mwana na ye. (2
  Batesaloniki 1:6-9) Nsima na yango, Satana n\u00e1 bademo na ye bakokosa lisusu
  bato te. Mpe baoyo nyonso balingi kotosa Nzambe mpe kondima Bokonzi na ye bakomona
  ndenge bilaka nyonso ya Nzambe ekokokisama.\\n16. Lokola nsuka ek\u00f3mi pene,
  osengeli kosala nini?\\n16 Etikali moke mokili oyo ya Satana esuka. Yango wana,
  ezali na ntina mingi t\u00f3mituna: \u2018Nasengeli kosala nini?\u2019 Yehova alingi
  osala nyonso mpo oyeba makambo mingi ya Biblia. Osengeli kozwa boyekoli na yo na
  lis\u025bki te. (Yoane 17:3) Batatoli ya Yehova basalaka makita p\u0254s\u0254 na
  p\u0254s\u0254 mpo na kosalisa bato b\u00e1yeba Biblia. Sal\u00e1 makasi okendaka
  na makita yango p\u0254s\u0254 nyonso. (T\u00e1ng\u00e1 Baebre 10:24, 25.) Soki
  omoni ete osengeli kobongisa makambo na bomoi na yo, sal\u00e1 yango. Soki osali
  bongo, yo n\u00e1 Yehova bokok\u00f3ma baninga makasi mpenza.\\n17. Mpo na nini
  bato mingi bakosutuka ntango nsuka ekoya?\\n17 Ntoma Paulo alobaki ete bato mabe
  bakobomama na ntango oyo bato mingi bazali kokanisa te, kobomama yango ekoya \u201clokola
  moyibi na butu.\u201d (1 Batesaloniki 5:2) Yesu asakolaki ete bato mingi bakoboya
  kondima ete tozali na mikolo ya nsuka. Alobaki: \u201cNdenge ezalaki na mikolo ya
  Noa, kozala ya Mwana ya moto [to mikolo ya nsuka] ekozala mpe bongo. Mpo ndenge
  bazalaki na mikolo oyo ezalaki liboso ya mpela: bazalaki kolya mpe kom\u025bla,
  mibali bazalaki kobala mpe basi bazalaki kobalisama, tii mokolo oyo Noa ak\u0254taki
  na masuwa; mpe batyaki likebi te tii mpela eyaki mpe ek\u0254mb\u0254laki bango
  nyonso, kozala ya Mwana ya moto ekozala mpe bongo.\u201d\\n18. Likebisi nini Yesu
  apesaki biso?\\n18 Yesu akebisaki biso ete t\u00f3lekisa ndelo te \u201cna kolya
  mpe na kom\u025bla mingi mpe na mitungisi ya bomoi.\u201d Alobaki ete nsuka ekoya
  mbalakaka, \u201clokola motambo.\u201d Alobaki mpe ete \u201cekoyela bato nyonso
  oyo bafandi na mabele mobimba.\u201d Na nsima abakisaki: \u201cYango wana, b\u00f3lala
  mp\u0254ngi te, b\u00f3pesa mal\u0254mb\u0254 [to b\u00f3bondela na motema mobimba]
  ntango nyonso mpo b\u00f3koka kokima makambo nyonso wana oyo esengeli kosalema,
  mpe kot\u025bl\u025bma liboso ya Mwana ya moto.\u201d (Luka 21:34-36) Mpo na nini
  ezali na ntina mingi kotosa likebisi ya Yesu? Mpo etikali moke mokili mabe ya Satana
  ebomama. Kaka bato oyo Yehova n\u00e1 Yesu bandimi nde bakobika mpe bakozala na
  bomoi libela na libela na mokili ya sika.\"", "\"Paroles de la chanson Prince de
  Southfork par Fally Ipupa\\nProposer une correction des paroles de \\\"Prince de
  Southfork\\\"\\nParoles de la chanson Prince de Southfork par Fally Ipupa\\nKomona
  ngai kinzengi na yo t\u00e9 Temuni\\nZwa ngai moto.Oy''ako kanisa liboso ya kosala
