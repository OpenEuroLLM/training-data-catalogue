  sing nyata, kapasitas produksi bakal nambah nganti 100,000 ton.\\nPanyimpenan lan
  Pangiriman\\nNalika nyimpen resin epoksi, aja adoh saka sinar srengenge langsung,
  sumber panas, titik kontak lan anti banyu. Barang sing mbebayani kudu disimpen miturut
  peraturan. Yen ora digunakake sawise mbukak, kudu disegel kanggo panyimpenan. Urip
  beting resin epoksi umume 1 taun, lan isih bisa digunakake sawise lulus tes maneh.
  Ing kahanan sing relatif, kayata panyimpenan ing suhu beku, sawetara resin epoksi
  bisa kristal, sing mung owah-owahan fisik lan ora ngganti sifat kimia. Ing kasus
  kristalisasi, resin bisa digawe panas nganti 70-80 \u00b0 C lan dibal\u00e8kak\u00e9
  menyang negara asli kanthi aduk.\\nDianggo\\nResin epoksi arang digunakake piyambak.
