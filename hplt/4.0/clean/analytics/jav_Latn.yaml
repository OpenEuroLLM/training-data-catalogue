  lan kabel timbal nomer 8 digunakake kanggo ngliwati bolongan kasebut., Bend kutub
  arch, siji mburi kolom penundaan cilik wis tightly disambungake menyang kutub arch,
  lan siji mburi wis didhukung ing Beam lan diikat tightly.Pucuk ndhuwur lengkungan
  bisa dilebokake ing purlin ridge.Banjur, terus nyetel kolom gantung cilik kanggo
  nggawe dhuwur sing padha karo posisi gendheng ngarep sing padha.\\n8. Film panutup:Ana
  loro utawa telung lembar film ing griya ijo.Yen digunakake rong lembar, ambane 3
  meter lan 5 meter, lan yen digunakake telung lembar, ambane 2 meter, 4 meter, lan
  2 meter.Pisanan, gulung maneh siji sisih film sing ambane 3m utawa 2m, lem nganggo
  adesif utawa wesi menyang tabung sing ambane 5-6cm, pasang tali naga lempung, lan
  ndandani film sing ambane 3m kanthi jarak 2,5m saka lemah.Iki dipasang ing jarak
  1,5 meter saka lemah kanthi ambane 2 meter.Film kasebut pisanan digulung dadi gulungan,
  lan diisi lemah menyang selokan sing tahan kadhemen nalika nutupi lan ngencengi.Tali
  nilon kudu diencerake, bebarengan karo film, dikubur ing lemah ing gable gable.Siji
  utawa loro film ing ndhuwur uga digulung dadi gulungan, siji ujung dikubur ing lemah
  nglawan gable, lan banjur nyebar menyang ujung liyane, lan pungkasane dikubur ing
  lemah cedhak gable ing mburi.Ana rong cara kanggo ndandani mburi film cedhak gendheng
  mburi.Salah sijine yaiku ndandani langsung ing purlin utomo kanthi kuku pring lan
  wesi;liyane iku kanggo ndandani iku ing utomo purlin karo pring lan kuku wesi lan
  banjur melu maneh.Gesper ing gendheng mburi.Ambane atap sawise gesper kira-kira
  0,5-1 meter, luwih apik, lan lendhut suket kudu digunakake kanggo kompak.Cara iki
  nduweni efek sing luwih apik kanggo ningkatake kinerja insulasi termal kanggo atap
  mburi tanpa nambah film sampah.\\n9. Garis laminating tetep:Sawise film kasebut
  ditutupi, kudu dipencet lan tetep nganggo garis laminating.Garis laminating bisa
  dadi garis laminating khusus omah kaca polipropilena sing kasedhiya kanthi komersial,
  utawa bisa diganti nganggo tali nilon utawa kawat wesi.Ora perlu.Paling apik nggunakake
  garis laminating khusus.First dasi siji mburi baris laminating kanggo No.. 8 kabel
  timbal ing gendheng mburi griya ijo, uncalan mudhun saka griya ijo, lan pencet ing
  film antarane loro lengkungan, lan ring anchor ing mburi ngisor, kenceng lan dasi.Urutan
  mbenakake garis laminating tipis pisanan, banjur kandhel, pisanan ndandani sawetara
  garis laminating kanthi jarak sing gedhe, lan banjur mboko sithik ndandani garis
  laminating ing antarane saben lengkungan.Loro-lorone garis laminating lan film plastik
  duwe tingkat elastisitas tartamtu, lan garis laminating kudu diatasi ing dina kapindho
  lan katelu;ngencengi kanggo 2-3 kaping kanggo mesthekake yen iku kuwat teken, lan
  film gendheng ngarep teken iku wangun wavy.\\n10. Jerami ndhuwur lan selimut kertas:Kertas
  kasebut digawe saka 4-6 lapisan kertas kraft.Jerami jerami digawe saka jerami utawa
  cattail.Jembar jerami jerami 1,2-1,3 meter lan ambane jerami cattail 1,5-1,6 meter
  kanggo nutupi omah kaca.Yen ora ana selimut kertas, bisa nutupi rong lapisan suket
  jerami utawa nambah tumpang tindih antarane suket jerami.Saben potong suket jerami
  kaping pindho utawa rada dawa tinimbang dawane suket jerami.Tali nilon ditarik lan
  dilebokake, lan ujung loro saben tali dipasang ing sisih siji ujung jerami, dadi
  rong puteran kanggo nangkep suket.Tarik tali loro ing lumahing suket thatch kanggo
  muter munggah utawa mbukak suket thatch ing gendheng ngarep omah kaca.Suket sing
  digulung diunggahake utawa diselehake siji-sijine ing payon mburi.Kanggo nyegah
  suket thatch saka nggeser mudhun, siji watu utawa loro utawa telung bata bisa diblokir
  konco saben gulungan thatch.\\n11. Perawatan migran:Gable solar bisa njaga lawang
