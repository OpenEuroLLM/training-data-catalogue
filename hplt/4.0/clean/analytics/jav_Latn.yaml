  njaba tembok mburi.\\n7. Atap sadurunge konstruksi:Nyetel posisi kolom vertikal
  sadurunge lan sawise dikubur, supaya baris lan kolom vertikal sejajar, lan irisan
  pring dawane 4 meter kudu diikat.Dawane kudu cocog.Siji mburi dilebokake ing selokan
