  bisa dadi Ventas utawa Mesias. Dadi apa sampeyan ana ing papan sing sampeyan lakoni
  utawa apa sampeyan mung ngguyu? Uga priksa kanthi asile panelitian iki.\\nAja lali
  yen kahanan cuaca ing macem-macem negara bisa ngowahi, lan sing luwih penting, saben
  wong tuwuh kanthi cara dhewe-dhewe. Mungkin sampeyan lair ing wulan Juni kabeh sifat
  wong sing lair ing wulan Oktober lan dadi CEO sampeyan kudu dadi politikus. Kita
  ngenteni komentar yen sampeyan pengin ngerti luwih lengkap babagan sampeyan, wenehi
  ngerti babagan pikirane\\nIki sawetarasipatsakaMaret-lairbayi. Dheweke loman, kreatif,
