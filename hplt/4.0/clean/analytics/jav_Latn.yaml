  kanggo ngrembug carane kita wadhah zirkonium bisa elevate pangolahan tungku vakum
  kanggo Heights anyar saka efficiency lan linuwih.\\n1. Smith, JR (2019). \\\"Logam
  Refraktori ing Proses Vakum Suhu Dhuwur: Tinjauan Komprehensif.\\\" Jurnal Ilmu
  lan Teknologi Vakum, 37(4), 189-205.\\n2. Zhang, L., et al. (2020). \\\"Analisis
  Komparatif Zirconium lan Tantalum Crucibles ing Aplikasi Vakum Ultra-High.\\\" Ilmu
