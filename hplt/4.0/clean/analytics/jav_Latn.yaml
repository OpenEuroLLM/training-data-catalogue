  njero tank minyak, tanker minyak lan pesawat.\\nData Teknis kanggo E44\\nBedane
  antarane Epoxy resin E44 lan e51\\nNilai epoksi minangka indeks paling penting kanggo
  ngenali sifat resin epoksi, lan model resin epoksi industri dibedakake miturut nilai
