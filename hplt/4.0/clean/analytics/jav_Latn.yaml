  Gali selokan tahan kadhemen:Gali selokan tahan kadhemen kanthi ambane 20 cm lan
  jerone 40 cm ing ngarep omah kaca.\\n6. Kabel timbal tetep kanggo jangkar sing dikubur
  lan garis laminating ing atap mburi:Nyelehake potongan kabel timbal nomer 8 sing
  padha karo omah kaca ing sisih ngisor selokan sing tahan kadhemen, kanthi jangkar
