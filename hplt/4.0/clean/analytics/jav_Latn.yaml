  \u0623\u064e\u0646 \u062a\u064f\u063a\u0652\u0645\u0650\u0636\u064f\u0648\u0627\u06df
  \u0641\u0650\u064a\u0647\u0650 \u06da \u0648\u064e\u0671\u0639\u0652\u0644\u064e\u0645\u064f\u0648\u0653\u0627\u06df
  \u0623\u064e\u0646\u064e\u0651 \u0671\u0644\u0644\u064e\u0651\u0647\u064e \u063a\u064e\u0646\u0650\u0649\u064c\u0651
  \u062d\u064e\u0645\u0650\u064a\u062f\u064c\\nArab-Latin: Y\u0101 ayyuhalla\u017c\u012bna
  \u0101man\u016b anfiq\u1ee5 min \u1e6dayyib\u0101ti m\u0101 kasabtum wa mimm\u0101
  akhrajn\u0101 lakum minal-ar\u1e0d, wa l\u0101 tayammamul-khab\u012b\u1e61a min-hu
  tunfiq\u1ee5na wa lastum bi`\u0101khi\u017c\u012bhi ill\u0101 an tugmi\u1e0d\u1ee5
  f\u012bh, wa''lam\u016b annall\u0101ha ganiyyun \u1e25am\u012bd\\n\\\"Hai orang-orang
  yang beriman, nafkahkanlah (di jalan Allah) sebagian dari hasil usahamu yang baik-baik
  dan sebagian dari apa yang Kami keluarkan dari bumi untuk kamu. Dan janganlah kamu
  memilih yang buruk-buruk lalu kamu menafkahkan daripadanya, padahal kamu sendiri
  tidak mau mengambilnya melainkan dengan memincingkan mata terhadapnya.\\\" Memberikan
  kepada orang lain dengan tulus hati membawa berkah dan kebahagiaan bagi diri kita
  sendiri.\\n3. Menjaga Hubungan dengan Tetangga: Kedekatan dalam Islam\\nSedulurku
  sing diberkahi dening Allah,\\nIslam mulangake pentinge njaga sesambungan karo tangga
  teparo minangka wujud nyata rasa peduli lan gotong royong ing masyarakat. Rasulullah
  shallallahu ''alaihi wa sallam wis nuduhake karo tumindak lan tembung carane hubungan
  khusus karo tanggi ing tampilan Islam.\\nTangga ing Islam\\nTanggane ing agama Islam
  ora mung wong sing manggon ing jejere omah kita. Luwih saka iku, tanggi yaiku wong
  sing nduweni hak marang kita lan hak kita marang dheweke. Ing hadits diriwayatak\u00e9
  Imam Bukhari, Nabi Muhammad Shallallahu ''alaihi wa sallam ngandika, \\\"Ora ana
  ing antarane wong-wong sing iman ing Allah lan dina Akhir iku wong-wong sing ora
  seneng pepadhamu sing manggon ing jejere wong-wong mau.\\\"\\nNalika Rasulullah
  shallallahu ''alaihi wa sallam diparingi pitedah babagan hak-hak tetangga, dheweke
  nerangake yen tangga-tanggane kalebu wong sing duwe hak marang kita lan kita kudu
  nulungi dheweke yen butuh, menehi ganjaran nalika ngrayakake, lan ngunjungi dheweke
  nalika padha lara..\\nBudaya Persahabatan\\nNjaga hubungan karo tangga teparo uga
  kalebu budaya silaturahmi sing ditekanake ing agama Islam. Allah SWT ngendika ing
  Surah An-Nisa [4:36],\\n\u0648\u064e\u0671\u0639\u0652\u0628\u064f\u062f\u064f\u0648\u0627\u06df
  \u0671\u0644\u0644\u064e\u0651\u0647\u064e \u0648\u064e\u0644\u064e\u0627 \u062a\u064f\u0634\u0652\u0631\u0650\u0643\u064f\u0648\u0627\u06df
  \u0628\u0650\u0647\u0650\u06e6 \u0634\u064e\u064a\u0652\u0640\u064b\u0654\u0627
  \u06d6 \u0648\u064e\u0628\u0650\u0671\u0644\u0652\u0648\u064e\u0670\u0644\u0650\u062f\u064e\u064a\u0652\u0646\u0650
  \u0625\u0650\u062d\u0652\u0633\u064e\u0670\u0646\u064b\u0627 \u0648\u064e\u0628\u0650\u0630\u0650\u0649
  \u0671\u0644\u0652\u0642\u064f\u0631\u0652\u0628\u064e\u0649\u0670 \u0648\u064e\u0671\u0644\u0652\u064a\u064e\u062a\u064e\u0670\u0645\u064e\u0649\u0670
  \u0648\u064e\u0671\u0644\u0652\u0645\u064e\u0633\u064e\u0670\u0643\u0650\u064a\u0646\u0650
  \u0648\u064e\u0671\u0644\u0652\u062c\u064e\u0627\u0631\u0650 \u0630\u0650\u0649
  \u0671\u0644\u0652\u0642\u064f\u0631\u0652\u0628\u064e\u0649\u0670 \u0648\u064e\u0671\u0644\u0652\u062c\u064e\u0627\u0631\u0650
  \u0671\u0644\u0652\u062c\u064f\u0646\u064f\u0628\u0650 \u0648\u064e\u0671\u0644\u0635\u064e\u0651\u0627\u062d\u0650\u0628\u0650
  \u0628\u0650\u0671\u0644\u0652\u062c\u064e\u0646\u06e2\u0628\u0650 \u0648\u064e\u0671\u0628\u0652\u0646\u0650
  \u0671\u0644\u0633\u064e\u0651\u0628\u0650\u064a\u0644\u0650 \u0648\u064e\u0645\u064e\u0627
  \u0645\u064e\u0644\u064e\u0643\u064e\u062a\u0652 \u0623\u064e\u064a\u0652\u0645\u064e\u0670\u0646\u064f\u0643\u064f\u0645\u0652
  \u06d7 \u0625\u0650\u0646\u064e\u0651 \u0671\u0644\u0644\u064e\u0651\u0647\u064e
  \u0644\u064e\u0627 \u064a\u064f\u062d\u0650\u0628\u064f\u0651 \u0645\u064e\u0646
  \u0643\u064e\u0627\u0646\u064e \u0645\u064f\u062e\u0652\u062a\u064e\u0627\u0644\u064b\u0627\\nArab-Latin:
  Wa''budull\u0101ha wa l\u0101 tusyrik\u1ee5 bih\u012b syai`aw wa bil-w\u0101lidaini
  i\u1e25s\u0101naw wa bi\u017cil-qurb\u0101 wal-yat\u0101m\u0101 wal-mas\u0101k\u012bni
  wal-j\u0101ri \u017cil-qurb\u0101 wal-j\u0101ril-junubi wa\u1e63-\u1e63\u0101\u1e25ibi
  bil-jambi wabnis-sab\u012bli wa m\u0101 malakat aim\u0101nukum, innall\u0101ha l\u0101
  yu\u1e25ibbu mang k\u0101na mukht\u0101lan fakh\u1ee5r\u0101\\n\\\"Dan sembahlah
  Allah dan janganlah kamu mempersekutukan-Nya dengan sesuatupun. Dan berbuat baiklah
  kepada dua orang ibu-bapa, karib-kerabat, anak-anak yatim, orang-orang miskin, tetangga
  yang dekat dan tetangga yang jauh, dan teman sejawat.\\\" Ini menunjukkan bahwa
  tetangga termasuk dalam lingkup hubungan yang harus kita perhatikan dan jaga.\\nNuduhake
  Kabecikan karo Tangga\\nWonten ing agami Islam, kita dipun engetaken supados paring
  kabecikan dhateng sesami. Iki bisa ditindakake kanthi tumindak sing prasaja kayata
  menehi panganan utawa ngunjungi nalika lara. Kanjeng Nabi Shallallahu ''alaihi wa
  sallam ngandika, \\\"Sapa sing pracaya ing Allah lan dina Akhir, supaya wong ngandika
  apik utawa meneng. Lan sing sapa pracaya ing Allah lan dina Akhir, supaya wong terus
  njaga kekancan.\\\" (HR. Bukhori)\\nNuduhake kabegjan lan kasusahaning pepadhamu
  mujudake wujud rasa tresna lan raket ing masyarakat Islam. Iki uga minangka sarana
  kanggo mbentuk ikatan sing luwih kuat lan harmonis ing antarane kita.\\n4. Menghindari
  Perpecahan: Semangat Persatuan dalam Islam\\nSedulurku sing diberkahi dening Allah,\\nIslam
  minangka agama sing mulangake perdamaian, persaudaraan lan persatuan, kanthi tegas
  nglarang perpecahan ing masyarakat. Allah SWT ngandika ing Surat Ali ''Imran [3:
  103], \\\"Lan padha cekelan kabeh ing tali (agama) Allah, lan aja padha pecah. Ing
  khutbah iki, kita bakal ngrembug babagan pentinge nyingkiri perpecahan ing agama
  Islam.\\nBebaya Divisi\\nDivisi ing masyarakat ngasilake karusakan sing jero. Iku
  ngrusak paseduluran, nggawe ora harmoni, lan ngrusak kekuwatan kolektif. Nabi Shallallahu
  ''alaihi wa sallam tau ngandika, \\\"Ora ana kabecikan ing wong sing ora aran aman
  marang tanggan\u00e9.\\\" (HR. Ahmad) Perpecahan ngrusak pondasi hubungan sing wis
  dibangun lan ngrusak kepercayaan antarane manungsa.\\nNjaga Persatuan\\nIslam mulang
  kita pentinge njaga persatuan lan nyingkiri sumber perpecahan. Kita kudu nyingkiri
  perpecahan sing bisa kedadeyan amarga beda pendapat, etnis, ras, lan uga pandangan
  politik. Manunggaling kawulo ing Islam mujudaken tujuwan ingkang kedah dipungayuh
  sesarengan kangge nyipta masyarakat ingkang kiyat lan kokoh.\\nAllah SWT ngendika
  ing Surah Al-Anfal [8:46],\\n\u0648\u064e\u0623\u064e\u0637\u0650\u064a\u0639\u064f\u0648\u0627\u06df
  \u0671\u0644\u0644\u064e\u0651\u0647\u064e \u0648\u064e\u0631\u064e\u0633\u064f\u0648\u0644\u064e\u0647\u064f\u06e5
  \u0648\u064e\u0644\u064e\u0627 \u062a\u064e\u0646\u064e\u0670\u0632\u064e\u0639\u064f\u0648\u0627\u06df
  \u0641\u064e\u062a\u064e\u0641\u0652\u0634\u064e\u0644\u064f\u0648\u0627\u06df \u0648\u064e\u062a\u064e\u0630\u0652\u0647\u064e\u0628\u064e
  \u0631\u0650\u064a\u062d\u064f\u0643\u064f\u0645\u0652 \u06d6 \u0648\u064e\u0671\u0635\u0652\u0628\u0650\u0631\u064f\u0648\u0653\u0627\u06df
  \u06da \u0625\u0650\u0646\u064e\u0651 \u0671\u0644\u0644\u064e\u0651\u0647\u064e
  \u0645\u064e\u0639\u064e \u0671\u0644\u0635\u064e\u0651\u0670\u0628\u0650\u0631\u0650\u064a\u0646\u064e\\nArab-Latin:
  Wa a\u1e6d\u012b''ull\u0101ha wa ras\u1ee5lah\u1ee5 wa l\u0101 tan\u0101za''\u1ee5
  fa tafsyal\u1ee5 wa ta\u017c-haba r\u012b\u1e25ukum wa\u1e63bir\u1ee5, innall\u0101ha
  ma''a\u1e63-\u1e63\u0101bir\u012bn\\n\\\"Dan taatlah kepada Allah dan Rasul-Nya,
  dan janganlah kamu berbantah-bantahan, sehingga kamu menjadi lemah dan hilang semangatmu.\\\"
  Menghindari perpecahan adalah bentuk ketaatan kepada Allah dan Rasul-Nya, serta
  upaya untuk menjaga kekuatan dan semangat umat.\\nToleransi\\nIng masyarakat sing
  maneka warna, penting kanggo mbangun dialog sing konstruktif lan praktek toleransi.
  Nabi Shallallahu ''alaihi wa sallam menehi conto toleransi kanthi nampa utusan saka
  macem-macem suku lan agama ing Madinah. Dheweke mbangun hubungan sing apik karo
  dheweke adhedhasar prinsip saling hormat lan dialog.\\nToleransi ora ateges kita
  kudu setuju karo kabeh panemu, nanging kita kudu ngajeni beda lan nggoleki persamaan
  ing upaya mbangun hubungan sing harmonis. Rasulullah shallallahu ''alaihi wa sallam
  ngendika, \\\"Ora ana umatku sing setuju babagan kesalahan.\\\" (HR. Tirmidzi) Menika
  mucalaken bilih ing antawisipun beda pendapat menika saged wonten piwulang saha
  piwulang ingkang saged kita pendhet.\\n5. Berbuat Baik pada Orang Lain: Kasih Sayang
  dan Kebaikan dalam Islam\\nSedulurku sing diberkahi dening Allah,\\nSalah satunggaling
  piwulang ingkang utami wonten ing agami Islam inggih punika bab kabecikan lan rasa
  welas asih dhateng sesami. Allah SWT ing Al Qur''an lan Nabi Shallallahu ''alaihi
  wa sallam ing hadits mulang kita carane penting iku kanggo nindakake kabecikan kanggo
  wong liya. Wonten ing khutbah menika badhe dipunrembag babagan makna saha wigatosipun
  nindakaken kabecikan dhateng tiyang sanes saking sudut pandang Islam.\\nKabecikan
  minangka Kunci Ajaran Islam\\nNindakake kabecikan marang wong liya minangka prinsip
  dhasar ing ajaran Islam. Allah SWT ngandika ing Surah An-Nahl [16:90],\\n\u0625\u0650\u0646\u064e\u0651
  \u0671\u0644\u0644\u064e\u0651\u0647\u064e \u064a\u064e\u0623\u0652\u0645\u064f\u0631\u064f
  \u0628\u0650\u0671\u0644\u0652\u0639\u064e\u062f\u0652\u0644\u0650 \u0648\u064e\u0671\u0644\u0652\u0625\u0650\u062d\u0652\u0633\u064e\u0670\u0646\u0650
  \u0648\u064e\u0625\u0650\u064a\u062a\u064e\u0622\u0626\u0650 \u0630\u0650\u0649
  \u0671\u0644\u0652\u0642\u064f\u0631\u0652\u0628\u064e\u0649\u0670 \u0648\u064e\u064a\u064e\u0646\u0652\u0647\u064e\u0649\u0670
  \u0639\u064e\u0646\u0650 \u0671\u0644\u0652\u0641\u064e\u062d\u0652\u0634\u064e\u0622\u0621\u0650
  \u0648\u064e\u0671\u0644\u0652\u0645\u064f\u0646\u0643\u064e\u0631\u0650 \u0648\u064e\u0671\u0644\u0652\u0628\u064e\u063a\u0652\u0649\u0650
  \u06da \u064a\u064e\u0639\u0650\u0638\u064f\u0643\u064f\u0645\u0652 \u0644\u064e\u0639\u064e\u0644\u064e\u0651\u0643\u064f\u0645\u0652
  \u062a\u064e\u0630\u064e\u0643\u064e\u0651\u0631\u064f\u0648\u0646\u064e\\nArab-Latin:
  Innall\u0101ha ya`muru bil-''adli wal-i\u1e25s\u0101ni wa \u012bt\u0101`i \u017cil-qurb\u0101
  wa yan-h\u0101 ''anil-fa\u1e25sy\u0101`i wal-mungkari wal-bagyi ya''i\u1e93ukum
  la''allakum ta\u017cakkar\u1ee5n\\n\\\"Sesungguhnya Allah menyuruh (kamu) berlaku
  adil dan berbuat baik kepada orang-orang yang berhubungan dengan kamu dan Ia melarang
  kamu berbuat kejahatan, kefasikan dan kedurhakaan.\\\" Tidak hanya itu, Nabi Muhammad
  shallallahu ''alaihi wa sallam juga menyatakan bahwa kebaikan adalah ciri sejati
  dari iman.\\nKatresnan nyebar\\nNindakake kabecikan marang wong liya ora mung mung
  kanggo sesama Muslim, nanging uga melu kabeh manungsa. Nabi Muhammad Shallallahu
  ''alaihi wa sallam ngandika, \\\"Sapa sing ora ngucap syukur marang manungsa, iku
  ora ngucap syukur marang Allah.\\\" (Riwayat Ahmad) Iki nuduhake yen rasa welas
  asih lan kabecikan kudu ditujokake marang kabeh wong ora preduli saka agama, suku
  utawa latar mburi.\\nAja Tutup Ing Kegiatan Pribadi\\nNalika nindakake kabecikan,
  kita uga diwulangake supaya ora nggantung ing kegiatan pribadi utawa kepentingan
  pribadi. Rasulullah shallallahu ''alaihi wa sallam ngendika, \\\"Satemene wong mukmin
  iku ora kenyang nalika pepadhane lagi luwe.\\\" (HR. Ibnu Majah) Iki negesake pentinge
  ngerteni lan nyukupi kabutuhane wong liya sadurunge mikirake awake dhewe.\\nNgilangi
  sing ala karo sing apik\\nTumindak becik marang liyan ora mung mupangati, nanging
  uga ngilangake piala. Wonten ing hadits ingkang diriwayataken dening Imam Muslim,
  Rasulullah shallallahu ''alaihi wa sallam ngendika, \\\"Ora wong Muslim ngremehake
  sadulure sing muslim, kajaba mung ninggalake sing luwih apik tinimbang dheweke.\\\"
  Nindakake kabecikan kanggo wong liya bisa nyebabake owah-owahan sing positif lan
  menehi inspirasi kanggo nindakake kabecikan uga.\\nPara rawuh ingkang kinurmatan,\\nSumangga
  kita dadosaken nilai-nilai Islam minangka tuntunan kangge nguyataken masarakat.
  Islam mulangake rasa welas asih, gotong royong lan prihatin marang wong kang ringkih.
  Ing ngembangaken masyarakat sing sejahtera, ayo padha nyingkiri tumindak egois lan
  kepentingan sempit sing bisa ngrusak hubungan sosial. Sumangga kita sami ngengetaken
  supados tansah ningkataken dhiri, ngluhuraken ilmu, lan ngurmati bedane panemu.\\nSaderengipun
  kula mungkasi khotbah punika, sumangga kita tansah emut bilih nguyataken masyarakat
  menika kewajiban kita minangka manungsa ingkang pitados. Sumangga kita ningkataken
  keprihatinan kita dhateng tiyang sanes, nanemaken nilai-nilai ingkang sae wonten
  ing dhiri kita, saha sesarengan mbangun masyarakat ingkang kiyat lan sejahtera.\\nMugi-mugi
  Allah SWT tansah paring hidayah saha barokah dumateng kita sedaya. Aamiin ya Rabbal
  ''Alamin.\\nWassalamu ''alaikum warahmatullahi wabarakatuh.\\nPosting Komentar untuk
  \\\"Khutbah Bahasa Jawa Tentang Kemasyarakatan\\\"\\nGunakan bahasa yang baik dan
  benar\"", "\"9 September 2010, Mova Nugraha Ardi\\nSaiki wis cumawis kanggo sapa
