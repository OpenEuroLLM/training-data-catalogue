  otomatis kanggo nggawe kahanan lingkungan sing paling apik kanggo tanduran.Editor
  ing ngisor iki bakal ngenalake sampeyan babagan sewelas teknik konstruksi omah kaca!\\n1.
  Nyebarake tanah lan nyetel garis:Miturut rencana sing dirancang saka griya ijo solar,
  amba azimuth diukur dening piring, lan papat sudhut griya ijo ditemtokake, lan tumpukan
  diselehake ing papat sudhut gable, banjur posisi gable lan gable. tembok mburi ditemtokake.\\n2.
  Nggawe tembok:Lemah sing digunakake kanggo mbangun tembok bumi bisa dadi lemah ing
  njaba tembok mburi omah kaca, utawa lemah ing sangisore permukaan sing ditanduri
  ing ngarep omah kaca.Yen sampeyan nggunakake lemah sing sepi ing ngarep omah kaca,
  sampeyan bisa ndhudhuk lapisan bajak (kira-kira 25 cm kandel), disisihake, lan banyu
  lemah mentahan ing sisih ngisor.Sawise dina, gali lemah mentah kanggo nggawe tembok
  lemah.Kaping pisanan, plywood miturut kekandelan tembok lemah, isi lemah teles sing
  anyar digali, lan kompak karo tamping bumi utawa tamping listrik.Saben lapisan kira-kira
  20 cm.Sawise tamping siji lapisan, gawe lapisan kapindho nganti tekan dhuwur sing
  dibutuhake.Gable lan tembok mburi kudu digawe bebarengan, ora ing bagean, mung kanthi
  cara iki bisa dadi kuwat.Yen viskositas lemah ora cukup, bisa dicampur karo jerami
  gandum.Ing sawetara wilayah, viskositas lemah banget kurang, lan tembok ora bisa
  dibangun kanthi tamping.Ing wektu iki, sawetara jerami gandum lan lendhut bisa dicampur
  ing lemah kanggo nggawe adobes.Sawise adobes garing, tembok adobe bisa digunakake.Nalika
  mbangun tembok, lendhut suket kudu digunakake ing antarane adobes, lan lendhut suket
  kudu diplester ing njero lan njaba tembok.Sajrone pambangunan tembok bata, pondasi
  kudu dibuwang sadurunge tembok bisa dibangun.Sajrone pambangunan, mortir kudu kebak,
  sambungan bata kudu disambungake, permukaan plester kudu diplester, lan ing njero
  lan njaba tembok kudu diplester supaya ora bocor udara.Kekosongan ing antarane lapisan
  tembok bata lan lapisan kudu ora gedhe banget utawa cilik banget.Umum\u00e9, jembar\u00e9
  kothong dikontrol antara 5-8 cm.Kothong kudu ora ditinggalake nganti pungkasan,
  lan bata kudu digunakake kanggo nyambungake lapisan saben 3-4 meter kanggo nambah
  kekuwatan tembok.Tembok kothong bisa diisi karo slag, perlite, utawa jerami gandum,
  utawa ora ana sing ditambahake.Mung insulasi hawa sing digunakake.Tembok kothong
  tanpa ngisi kudu bebas saka retakan.Nalika gendheng bata mbukak, iku paling apik
  kanggo nggunakake chaff lendhut kanggo nutup gendheng dening 30 cm, supaya tembok
  mburi lan gendheng mburi disambungake rapet, lan kinerja jampel termal wis apik.\\n3.
  Tiang-tiang lan atap sing dikubur:Miturut gambar, nemtokake posisi saben kolom lan
  tandhani nganggo jeruk.Gali bolongan ing jerone 30-40 cm lan gunakake watu minangka
  sikil kolom kanggo nyegah kolom kasebut tenggelam.Banjur pasang digger ing kolom
  mburi.Sirah diselehake ing kolom, lan buntut ana ing tembok mburi utawa ing mburi.Sijine
  3-4 purlins ing pilar.Purlins ridge disambungake ing garis lurus, lan purlins liyane
  staggered.Kanggo nyegah purlin saka geser mudhun, blok kayu cilik bisa dipaku menyang
  purlin ing sisih ngisor saka purlin kanggo macet ing purlin.Sawetara omah kaca mung
  nggunakake uprights kanggo ndhukung purlins spine.\\n4. Sawise nutupi gendheng:nutupi
  purlin utawa rafter karo lapisan film plastik sampah, lan sijine stalks jagung ing
  bundel ing film, arah kang jejeg menyang purlin utawa rafter.Banjur nyebarake jerami
