  email\"", "\"Khutbah Bahasa Jawa Tentang Kemasyarakatan\\nKhutbah Bahasa Jawa\\nKhutbah
  bahasa jawa tentang kemasyarakatan merupakan panggilan penting bagi kita semua dalam
  menghadapi dinamika masyarakat saat ini. Terkadang, kita merasa khawatir dengan
  semakin merosotnya norma-norma sosial dan nilai-nilai budaya dalam kehidupan sehari-hari.\\nAncaman
  ini harus kita hadapi bersama dengan tekad dan pemahaman yang mendalam tentang akar
  permasalahan. Dalam hal inilah, Khutbah Bahasa Jawa memiliki peran yang tak tergantikan
  dalam menggugah kesadaran masyarakat serta menawarkan solusi-solusi konkret guna
  memperkuat kembali kerangka kemasyarakatan yang kokoh.\\nBerikut islamtwins contohkan
  teks khutbah tentang kemasyarakatan dalam bahasa jawa yang singkat, padat dan ringkas.\\nKhutbah:
  Memperkuat Kemasyarakatan Menuju Kesejahteraan Bersama\\nPuji syukur konjuk wonten
  ngarsanipun Allah, Pangeraning jagad, ingkang sampun nitahaken manungsa kanthi sampurna.
  Shalawat saha salam mugi katur dumateng junjungan kita Nabi Muhammad SAW, utusanipun
  Allah ingkang dipun utusaken kangge nuntun umat manungsa dhateng margi ingkang lurus.\\nSedulur-sedulur
  sing diberkahi dening Allah,\\nKomunitas sing kuwat minangka pondasi penting ing
  pembangunan negara. Yaiku pondasi kang ngemu teges kebersamaan, toleransi, lan prihatin
  marang liyan. Ing jaman sing dinamis iki, kita kudu mikir babagan carane nguatake
  masyarakat supaya bisa nggayuh kesejahteraan lan kemajuan sing lestari bebarengan.\\nKomunitas
  sing solid ora mung sesandhingan fisik, nanging uga nggawe hubungan mental sing
  cedhak antarane warga. Keragaman minangka salah sawijining kasugihan gedhe ing masyarakat,
  lan keragaman iki kudu diuripake minangka hadiah sing kudu disyukuri.\\nKita asale
  saka latar mburi sing beda-beda, nanging ing keragaman kasebut kita bisa nglengkapi
  lan nambahi siji liyane. Eling marang pangandikane Allah ing Al Qur''an,\\n\u064a\u064e\u0670\u0653\u0623\u064e\u064a\u064f\u0651\u0647\u064e\u0627
  \u0671\u0644\u0646\u064e\u0651\u0627\u0633\u064f \u0625\u0650\u0646\u064e\u0651\u0627
  \u062e\u064e\u0644\u064e\u0642\u0652\u0646\u064e\u0670\u0643\u064f\u0645 \u0645\u0650\u0651\u0646
  \u0630\u064e\u0643\u064e\u0631\u064d \u0648\u064e\u0623\u064f\u0646\u062b\u064e\u0649\u0670
  \u0648\u064e\u062c\u064e\u0639\u064e\u0644\u0652\u0646\u064e\u0670\u0643\u064f\u0645\u0652
  \u0634\u064f\u0639\u064f\u0648\u0628\u064b\u0627 \u0648\u064e\u0642\u064e\u0628\u064e\u0622\u0626\u0650\u0644\u064e
  \u0644\u0650\u062a\u064e\u0639\u064e\u0627\u0631\u064e\u0641\u064f\u0648\u0653\u0627\u06df
  \u06da \u0625\u0650\u0646\u064e\u0651 \u0623\u064e\u0643\u0652\u0631\u064e\u0645\u064e\u0643\u064f\u0645\u0652
  \u0639\u0650\u0646\u062f\u064e \u0671\u0644\u0644\u064e\u0651\u0647\u0650 \u0623\u064e\u062a\u0652\u0642\u064e\u0649\u0670\u0643\u064f\u0645\u0652
  \u06da \u0625\u0650\u0646\u064e\u0651 \u0671\u0644\u0644\u064e\u0651\u0647\u064e
  \u0639\u064e\u0644\u0650\u064a\u0645\u064c \u062e\u064e\u0628\u0650\u064a\u0631\u064c\\nArab-Latin:
  Y\u0101 ayyuhan-n\u0101su inn\u0101 khalaqn\u0101kum min \u017cakariw wa un\u1e61\u0101
  wa ja''aln\u0101kum syu''\u1ee5baw wa qab\u0101`ila lita''\u0101raf\u1ee5, inna
  akramakum ''indall\u0101hi atq\u0101kum, innall\u0101ha ''al\u012bmun khab\u012br\\n\\\"Hai
  manusia, sesungguhnya Kami menciptakan kamu dari laki-laki dan perempuan, dan Kami
  menjadikan kamu berbangsa-bangsa dan bersuku-suku supaya kamu saling kenal-mengenal\\\"
  (Q.S. Al-Hujurat, 49:13).\\nWonten ing khutbah punika kita badhe nliti langkung
  jero kados pundi agami Islam nyengkuyung kita kangge ngiyataken tali silaturahmi.\\n1.
  Persaudaraan Islam: Menyatukan Umat dalam Kebersamaan\\nSedulurku sing diberkahi
  dening Allah,\\nSalah sawijining prinsip sing paling kuat ing Islam yaiku persaudaraan.
  Paseduluran iki ora mung hubungan keluarga utawa hubungan darah, nanging hubungan
  sing adhedhasar iman lan taat marang Gusti Allah. Ing hadits diriwayatak\u00e9 Imam
  Bukhari lan Imam Muslim, Nabi Muhammad Shallallahu ''alaihi wa sallam ngandika,
  \\\"Muslim iku sadulur kanggo Muslim liyane. Dheweke ora salah sadulure lan ora
  nyerah sedulure marang mungsuhe.\\\"\\nIng donya sing maneka warna iki, Islam teka
  minangka agama manunggal, mbusak wates-wates sing misahake wong adhedhasar etnis,
  ras, lan etnis. Ing Allah lan Rasul-Nya, kita nemokake tali sing nyambungake ati
  karo sedulur-sedulur ing iman ing saindenging jagad. Ingkang njagi kita inggih punika
  iman kita dhumateng Allah lan iman kita dhateng Nabi-Nya.\\nKebersamaan ing Kasusahan
  lan Kabungahan\\nWonten ing ukhuwah Islamiyah, kita dipun engetaken supados saling
  ngiyataken ing salebeting kasangsaran lan ngedum kabungahan. N\u00e8k para sedulur
  ngalami kasusahan, awak\u00e9 dh\u00e9w\u00e9 ora kudu meneng. Nabi Shallallahu
  ''alaihi wa sallam diterangake persaudaraan antarane mukmin minangka bangunan sing
  strengthens saben liyane. Nalika lapisan siji krasa ringkih, lapisan liyane mlebu
  kanggo nyedhiyakake dhukungan.\\nKita ora mung melu nandhang sangsara, nanging uga
  seneng. Nalika ana wong sing sukses utawa ngrayakake kamenangan, kita kudu melu
  bungah. Iki minangka salah sawijining cara kanggo nguatake tali persaudaraan, ngilangi
  rasa iri, lan nguatake rasa tresna ing antarane kita.\\nMbusak Watesan Sosial\\nSadulurku,
  Islam mulang kita mbusak kabeh wates sosial sing bisa misahake kita. Ing pandangan
  Islam, ora ana papan kanggo ngrasa luwih unggul utawa luwih rendah tinimbang sedulur-sedulur.
  Kabeh manungsa ing ngarsane Gusti Allah nduweni nilai sing padha, diukur saka iman
  lan kautaman.\\nPramila kita kedah mangertosi bilih ukhuwah Islamiyah boten namung
  wonten ing lingkungan tartamtu. Ora preduli saka ngendi asale utawa apa latar mburi,
  yen kita bebarengan ing iman, kita dadi sedulur. Kita kudu tresna, ngormati lan
  ndhukung siji liyane.\\n2. Gotong Royong dan Tolong-Menolong: Fondasi Keharmonisan
  dalam Islam\\nSedulurku sing diberkahi dening Allah,\\nIng Islam, semangat gotong
  royong lan gotong royong mujudake nilai penting sing dijunjung tinggi. Rasulullah
  shallallahu ''alaihi wa sallam wis mulang kita liwat tembung lan tumindak carane
  terkenal bantuan lan nuduhake ing masyarakat. Sawijining hadits sing misuwur ngendika,
  \\\"Wong mukmin marang mukmin liyane iku kaya bangunan sing saling menguatkan\\\".\\nKewajiban
  Ndhukung ing Kesulitan\\nMbantu ing Islam ora mung menehi bantuan materi utawa dhuwit.
  Iki uga kalebu dhukungan emosional lan moral. Wektu sedulur-sedulur seiman ngalami
  masalah, kita kudu tanggung jawab kanggo mbantu lan mbantu. Minangka bag\u00e9an
  saka jemaat sing kuwat, kita kudu ngilangi rasa kesepian utawa ditinggalake sing
  bisa dirasakake dening para sedulur.\\nRasulullah shallallahu ''alaihi wa sallam
  uga pribadi melu mbantu lan ndhukung kanca-kanca kang pracaya ing macem-macem wujud.
  Ing kasus iki, dheweke dadi tuladha kanggo kita nindakake kabecikan lan mbantu wong
  liya.\\nGotong royong ing Kabecikan\\nGotong royong ora mung ditrapake ing kahanan
  sing angel, nanging uga ing macem-macem aspek urip saben dinane. Ing Islam, kita
  diwulang kanggo tulung-tinulung ing kabecikan. Iki kalebu kegiatan saben dina kayata
  ngresiki masjid bebarengan, tulung-tinulung marang tangga-tangga sing butuh, lan
  melu proyek sosial sing migunani kanggo masyarakat.\\nKanjeng Nabi Shallallahu ''alaihi
  wa sallam ngendika, \\\"Satemene tangan sing menehi iku luwih apik tinimbang tangan
  sing nampa, mula kerja keras kanggo golek rezeki sing halal lan mbantu sedulur sing
  butuh.\\\" (HR. Bukhari) Iki negesake pentinge menehi dhukungan lan mbantu wong
  liya tanpa ngarep-arep bali.\\nPaedah ing Nulung Wong Liya\\nOra mung sedulur-sedulur
  sing entuk manfaat saka gotong-royong lan tulung-tinulung, nanging uga wong-wong
  sing aweh pitulungan. Allah SWT ngendika ing Surah Al-Baqarah [2:267],\\n\u064a\u064e\u0670\u0653\u0623\u064e\u064a\u064f\u0651\u0647\u064e\u0627
  \u0671\u0644\u064e\u0651\u0630\u0650\u064a\u0646\u064e \u0621\u064e\u0627\u0645\u064e\u0646\u064f\u0648\u0653\u0627\u06df
  \u0623\u064e\u0646\u0641\u0650\u0642\u064f\u0648\u0627\u06df \u0645\u0650\u0646
