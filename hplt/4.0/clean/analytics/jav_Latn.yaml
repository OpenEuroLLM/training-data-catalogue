  CAS: 9004-62-0\\nJeneng liya: Selulosa eter, hidroksietil eter;hidroksietilselulosa;2-Hydroxyethyl
  cellulose;Hyetlose;\\nHydroxyethyl cellulose (HEC) minangka padhet fibrosa utawa
  bubuk bubuk putih utawa cahya kuning, ora ana ambune, ora beracun, disiapake kanthi
  eterifikasi selulosa alkali lan etilena oksida (utawa klooetanol).Eter selulosa
  larut non-ionik.Amarga HEC nduweni karakteristik penebalan, suspending, dispersing,
  emulsifying, bonding, syuting, nglindhungi kelembapan lan nyediakake koloid prot\u00e8ktif
  sing apik, iki wis akeh digunakake ing eksplorasi petroleum, lapisan, konstruksi,
  obat-obatan lan tekstil, pembuatan kertas, lan makromolekul.Polimerisasi lan lapangan
  liyane.40 mesh sieving rate \u226599%;\\nHydroxyethyl Cellulose, digunakake minangka
  thickener, koloid pertahanan, agen pengawetan banyu normal lan modifier rheology
  ing macem-macem piranti lunak kayata cat banyu, komponen bangunan, senyawa kimia
  disiplin minyak esensial lan produk perawatan pribadi. , mbentuk film, nglindhungi
  banyu lan nyedhiyakake sifat koloid prot\u00e8ktif.\\nSpesifikasi Kimia\\nProduk
  Grades\\nKarakteristik kinerja\\n1).HEC larut ing banyu panas utawa kadhemen, ora
  precipitate ing suhu dhuwur utawa nggodhok, supaya wis sawetara saka sudhut kelarutan
  lan viskositas karakteristik, lan gelation non-termal;\\n2).Iku non-ionik lan bisa
  urip bebarengan karo macem-macem polimer larut banyu liyane, surfaktan, lan uyah.Iku
  thickener koloid banget ngemot solusi dielektrik konsentrasi dhuwur;\\n3).Kapasitas
  penylametan banyu kaping pindho luwih dhuwur tinimbang metil selulosa, lan nduweni
  regulasi aliran sing luwih apik;\\n4).Dibandhingake karo metil selulosa lan hidroksipropil
  metil selulosa sing diakoni, kemampuan dispersing HEC paling awon, nanging kemampuan
  koloid prot\u00e8ktif paling kuat.\\nAplikasi Hydroxyethyl Cellulose (HEC).\\nLapangan
  aplikasi\\nDigunakake minangka adesif, agen aktif lumahing, agen prot\u00e8ktif
  koloid, dispersant, emulsifier lan dispersi stabilizer, etc. Wis sawetara saka sudhut
  aplikasi ing kothak kemul, inks, serat, dyeing, papermaking, Kosmetik, pestisida,
  Processing Mineral, lenga. ekstraksi lan obat.\\n1. Umum\u00e9 digunakake minangka
  thickeners, agen prot\u00e8ktif, adhesives, stabilizers lan aditif kanggo preparation
  saka emulsions, gel, ointments, lotions, mripat reresik agen, supositoria lan tablet,
  lan uga digunakake minangka gel hidrofilik lan skeletons Bahan, preparation saka
  jinis matriks. ancang-ancang sustained-release, lan uga bisa digunakake minangka
  stabilizers ing pangan.\\n2. HEC digunakake minangka agen sizing ing industri tekstil,
  iketan, thickening, emulsifying, stabil lan aditif liyane ing electronics lan industri
  cahya.\\n3.HEC digunakake minangka thickener lan nyuda mundhut adi kanggo cairan
  pengeboran adhedhasar banyu lan cairan completion.Efek thickening katon ing cairan
  pengeboran brine.Uga bisa digunakake minangka agen kontrol mundhut cairan kanggo
  semen sumur minyak.Bisa disambungake karo ion logam multivalen kanggo mbentuk gel.\\n4.Produk
  HEC digunakake kanggo fracturing petroleum basis banyu gel fracturing adi, polystyrene
  lan polyvinyl chloride lan dispersants polymeric liyane.Uga bisa digunakake minangka
  thickener lateks ing industri cat, resistor sensitif kelembapan ing industri elektronik,
  antikoagulan semen lan agen penylametan kelembapan ing industri konstruksi.Keramik
  industri glaze lan odol adhesive.Uga digunakake kanthi akeh ing percetakan lan pewarnaan,
  tekstil, nggawe kertas, obat-obatan, kebersihan, panganan, rokok, pestisida lan
  agen pemadam kebakaran.\\n5.HEC digunakake minangka agen aktif lumahing, agen prot\u00e8ktif
  koloid, stabilizer emulsi kanggo vinyl klorida, vinyl asetat lan emulsions liyane,
  uga thickener lateks, dispersant, sawur stabilizer, etc. Iki digunakake digunakake
  ing kemul, serat, dyeing, papermaking, Kosmetik, medicine, pestisida, etc. Uga wis
  akeh nggunakake ing eksplorasi lenga lan industri mesin.\\n6. Hydroxyethyl cellulose
  nduweni aktivitas permukaan, penebalan, suspensi, adhesi, emulsifikasi, pembentukan
  film, dispersi, penylametan banyu lan perlindungan ing preparat farmasi sing padhet
  lan cair.\\n7. HEC digunakake minangka dispersant polimer kanggo eksploitasi cairan
