  ku mirov v\u00ea yek\u00ea bi teybet\u00ee wer\u00eane ser ziman ku di sedsale me
  ya \u00ee ro de her wusa di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov
  wer\u00eane ser ziman ku bahse t\u00eag\u00eena maf \u00fb azadiy\u00ea \u00fb her
  wusa maf\u00ea mirovan \u00fb demokrasiy\u00ea \u00fb hwd dih\u00ea kirin. Ev t\u00eag\u00een
  \u00fb nirx, weke t\u00eag\u00een \u00fb nirxna ku di ancama zan\u00een \u00fb hi\u015fmend\u00eeya
  mirovatiy\u00ea a bi sedsalan de ku afir\u00eena na. Ji ber v\u00ea yek\u00ea, em
  nikarin, van nirx\u00ean bi v\u00ee reng\u00ee, p\u00ea\u015fketina wan, ten\u00ea
  bi demek\u00ea \u00fb deverek\u00ea ve gir\u00eabidin \u00fb wer\u00eanina ser ziman.
  Dema ku mirov w\u00ea bike, mirov w\u00ea hinek\u00ee nehaq\u00ee \u00fb b\u00eamaf\u00eeyek\u00ea
  li gi\u015ft\u00eeya mirovatiy\u00ea bike di gotina xwe de.\\nDi v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov wer\u00eane ser ziman ku, p\u00ea\u015fketina mirov her wusa
  di v\u00ea \u00e7er\u00e7ovey\u00ea de xwediy\u00ea wate \u00fb t\u00eag\u00een\u00eeyeka
  giring a d\u00eerok\u00ee ya. Mirov, bi maf \u00fb azad\u00eeya xwe re heya. Her
  wusa, maf\u00ea j\u00eeyan\u00ea, weke mafek\u00ee bingih\u00een\u00ee \u00ea mirov\u00ee,
  ahlaq\u00ee \u00fb wijdan\u00ee ya ku mirov div\u00ea ku bi r\u00eaz \u00fb h\u00fbrmet
  hertim\u00ee, dayim\u00ee \u00fb dem\u00ea p\u00ea\u015fwaz\u00ee bike \u00fb wer\u00eane
  ser ziman. Di serdem\u00ean ber\u00ea de j\u00ee, dema ku bahse mirov dihatkirin,
  bahse n\u00eaz\u00eekat\u00eeya wan ya biq\u00fbdret a li hevd\u00fb \u00fb bi hevd\u00fb
  re dih\u00ea kirin. Li ser w\u00ea re biwatekirin \u00fb han\u00eena li ser ziman
  dih\u00eakirin. Ew gotin\u00ean ku di w\u00ea \u00e7er\u00e7ovey\u00ea de han\u00eena
  ser ziman, li navaroka wan \u00fb zan\u00eena di wan de li w\u00ea dih\u00ea l\u00eagerin
  \u00fb dih\u00ea han\u00een li ser ziman. Ev j\u00ee, weke aliyek\u00ee giring ku
  mirov di v\u00ea \u00e7er\u00e7ovey\u00ea de wer\u00eane ser ziman. T\u00eag\u00eena
  maf \u00fb azadiy\u00ea, weke t\u00eag\u00eeneka mirov\u00ee a gerd\u00fbn\u00ee
  div\u00ea ku mirov w\u00ea hilde li dest \u00fb wer\u00eane ser ziman. Div\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov bahse w\u00ea bike \u00fb w\u00ea
  wer\u00eane ser ziman. T\u00eag\u00eena maf \u00fb azadiy\u00ea, dema ku mirov di
  \u00e7er\u00e7oveya w\u00ea de bahse mirov \u00fb j\u00eeyane mirov bike, her wusa
  div\u00ea ku mirov wer\u00eane ser ziman ku weke ku Zerde\u015ft j\u00ee han\u00eeya
  ser ziman, \u00abmaf\u00ea j\u00eeyan\u00ea p\u00eeroz a\u00bb \u00fb \u00ab ti
  kesek, maf\u00ea w\u00ee t\u00fbna ya ku dest li j\u00eeyane yek\u00ee din bide.\u00bb
  Ku\u015ftin, bi v\u00ee reng\u00ee qadaxa kir\u00eeya \u00fb hat\u00eeya \u00abharam\u00bb
  kirin. Maf\u00ea j\u00eeyan\u00ea, weke gotinaka ku di v\u00ea \u00e7er\u00e7ovey\u00ea
  de di nava bawer\u00eeyan de j\u00ee bi rengna ji hevd\u00fb c\u00fbda ku hat\u00eeya
  \u015f\u00eerovekirina hat\u00eeya bicihkirin \u00fb hat\u00eeya han\u00een li ser
  ziman. Dema ku ol hatina p\u00ea\u015fxistin, ji aliy\u00ea p\u00eaxember\u00ea
  wan ve, hat\u00eeya han\u00een ser ziman ku j\u00eeyane mirov ba\u015ftir bikin
  \u00fb bipar\u00eaz\u00ean. T\u00eag\u00eena parazvaniya j\u00eeyane mirov, weke
  parazvaniya j\u00eeyane ku \u00abxw\u00fbd\u00ea day\u00ee\u00bb \u00fb mirov nikar\u00ea
  destl\u00eabide han\u00eena ser ziman. Di v\u00ea \u00e7er\u00e7ovey\u00ea de j\u00ee,
  hema b\u00eaja ku di hem\u00fb bawer\u00eeyan de bi away\u00ean cuda heya gotina
  \u00abmaf\u00ea j\u00eeyan\u00ea ji xw\u00fbd\u00ea ya\u00bb \u00fb \u00abten\u00ea
  ew dide \u00fb ew dikar\u00ea bist\u00eane\u00bb ya. Dema ku bi v\u00ee reng\u00ee
  hat ser ziman, \u00ead\u00ee bi awayek\u00ee standina j\u00eeyane mirov \u00fb ank\u00fb
  ku\u015ftina mirovan ji aliy\u00ea mirovan ve dih\u00ea qadaxakirin. Di v\u00ea
  \u00e7er\u00e7ovey\u00ea de \u00ead\u00ee \u00b4ku\u015ftin\u00b4 dih\u00ea qadaxa
  kirin. Di nava bawer\u00eeyan de di v\u00ea \u00e7er\u00e7ovey\u00ea de, t\u00eag\u00eeneka
  ku mirov dikar\u00ea w\u00ea salix bike \u00fb wer\u00eane ser ziman heya. Em div\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku wer\u00eanina ser ziman ku maf\u00ea j\u00eeyan\u00ea
  weke mafek\u00ee p\u00eeroz a. Her wusa, mirov w\u00ea \u00e7awa bij\u00ee j\u00ee,
  weke mafek\u00ee p\u00eeroz a. Ji ber ku ev wusa ya, t\u00eag\u00eena rastteq\u00eeniy\u00ea
  bi t\u00eag\u00een\u00ee bi mirov re p\u00ea\u015fket\u00eeya. Herwusa t\u00eag\u00eena
  rastteq\u00eeniy\u00ea di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov
  wwer\u00eane ser ziman. T\u00eag\u00eena rastteq\u00eeniy\u00ea, weke t\u00eag\u00eeneka
  ku li cewher\u00ea w\u00ea digerih\u00ea ya.\\nEv rast\u00ee, her wusa, di \u00e7er\u00e7oveya
  t\u00eag\u00een\u00ean gerd\u00fbn\u00ee \u00ean bi j\u00eeyane mirov ve ku mirov
  dikar\u00ea wan wer\u00eane ser ziman in. Her wusa dema ku mirov bahse van t\u00eag\u00een
  \u00fb rast\u00eeyan dike j\u00ee, em div\u00ea ku wer\u00eanina ser ziman ku her\u00ee
  z\u00eade bahse rojhilat \u00fb \u015fari\u015ftan\u00eey\u00ean w\u00ea \u00ean
  mesepotamik\u00ee dih\u00ea kirin ku bi van nirx\u00ean bi v\u00ee reng\u00ee bi
  sedsalan p\u00ea\u015fketin\u00ean xwe \u00e7\u00eakirina \u00fb m\u00eereteyek
  ji mirovatiy\u00ea re hi\u015ftina li \u015f\u00fbn xwe. Em dema ku bahse \u00b4li
  \u015f\u00fbn xwe hi\u015ftina\u00b4, li vir, em div\u00ea ku bi t\u00eag\u00een\u00ee
  wer\u00eanina ser ziman, ku em bahse d\u00eerokek\u00ea \u00fb her\u00eekina w\u00ea
  nakin. Ji ber ku ew maf ji wan \u015fari\u015ftan\u00eeyan re ne hat\u00eeya hi\u015ftin.
  Hatin ji d\u00eerok\u00ea birin. \u00ce ro bahse bi sedan ziman, \u00e7and \u00fb
  civat\u00ean ku ji d\u00eerok\u00ea \u00e7\u00fbna dih\u00ea kirin. Ew, bi dil\u00ea
  xwe ji d\u00eerok\u00ea ne\u00e7\u00fbna. Her wusa, div\u00ea ku miriov v\u00ea
  yek\u00ea wer\u00eane ser ziman ku car bi car dih\u00ea gotin ku \u00b4ziman j\u00ee
  \u00fb \u00e7and j\u00ee zind\u00ee na\u00b4. Dema ku zind\u00ee bin, w\u00ea \u00e7ax\u00ea,
  div\u00ea ku mirov v\u00ea yek\u00ea j\u00ee li d\u00fbv w\u00ea bib\u00eaje ku
  biqas\u00ee ku mirov li j\u00eeyane xwe \u00fb domadina w\u00ea dihizir\u00ea, her
  wusa ew zindiya wan j\u00ee li w\u00ea dihizir\u00ea. W\u00ea \u00e7ax\u00ea, div\u00ea
  ku mirov li vir kif\u015f bike ku yek \u00fb ank\u00fb t\u00eag\u00eeneka ku wan
  ji d\u00eerok\u00ea dibe, heya. Div\u00ea ku mirov \u00ead\u00ee w\u00ea kif\u015f
  bike \u00fb wer\u00eane ser ziman. Weke ku \u00e7awa ku li Heleb\u00e7\u00ea, zilan\u00ea
  \u00fb dersim\u00ea \u00fb hwd b\u00fb, her wusa t\u00eag\u00eeneka ku mirov bi
  \u00e7and, ziman \u00fb civat\u00eet\u00eeya w\u00ee dike ku ji d\u00eerok\u00ea
  bibe heya.\\nLi vir, dema ku em bahse komkujiya heleb\u00e7\u00ea bikin, div\u00ea
  ku em bahse van rastiyan j\u00ee bikin. Her wusa, ten\u00ea bi ser\u00ea xwe w\u00ea
  ne bes ku em bahse w\u00ea komkujiy\u00ea bikin. Div\u00ea ku em di w\u00ea \u00e7er\u00e7ovey\u00ea
  de bahse w\u00ea zihniyet \u00fb t\u00eag\u00eena ku di temen\u00ea w\u00ea komkujiy\u00ea
  de ku ew kir\u00eeya \u00fb ank\u00fb daya kirin j\u00ee, mirov w\u00ea kif\u015f
  bike \u00fb wer\u00eane ser ziman. Ev, bi ser\u00ea xwe biqas\u00ee, w\u00ea komkujiy\u00ea
  \u00fb han\u00eena w\u00ea ya li ser ziman giring a. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de dema ku mirov ew zihniyet \u00fb t\u00eag\u00eena ku w\u00ea jens\u00eed\u00ea
  dib\u00een\u00ea, \u00ead\u00ee mirov w\u00ea karib\u00ea p\u00ea\u015f\u00eeya
  w\u00ea j\u00ee bigr\u00ea. Di v\u00ea \u00e7er\u00e7ovey\u00ea de \u00ead\u00ee
  ya rast \u00fb ne rast ku \u00e7i ya, mirov w\u00ea \u00ead\u00ee w\u00ea kif\u015f
  bike. Em dema ku bahse komkujiya heleb\u00e7\u00ea bikin, div\u00ea ku em bahse
  w\u00ea zihniyeta ku ew komkuji kir \u00fb dakirin j\u00ee bikin. Div\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov w\u00ea wer\u00eane ser ziman. Dema ku ev new\u00ea d\u00eetin
  \u00fb ser ziman, w\u00ea \u00e7ax\u00ea, weke ku \u00e7awa ku pi\u015ft\u00ee komkujiya
  heleb\u00e7\u00ea, heta komkujiya \u015fengal\u00ea \u00fb komkujiya koban\u00ea
  hwd, ku di dewama komkujiya heleb\u00e7\u00ea de b\u00fbna \u00fb weke wan bi dehan
  komkuj\u00eey\u00ean din hat\u00eena han\u00een li ser\u00ea civat\u00ea, mirov
  w\u00ea nikarib\u00ea p\u00ea\u015f\u00eeya w\u00ea j\u00ee bigr\u00ea. Pi\u015ft\u00ee
  komkujiya heleb\u00e7\u00ea, bi dehan komkujiy\u00ean mazin b\u00fby\u00eena wan
  li ser\u00ea civate kurd \u00fb her wusa di dawiy\u00ea de di dewama komkujiya heleb\u00e7\u00ea
  de b\u00fby\u00eena komkujiy\u00ean weke komkujiya \u015fengal\u00ea \u00fb komkujiya
  koban\u00ea \u00fb hwd j\u00ee, div\u00ea ku mirov di v\u00ea \u00e7er\u00e7ovey\u00ea
  de bi p\u00eavajoya komkujiya heleb\u00e7\u00ea re wer\u00eanina ser ziman. Di v\u00ea
  \u00e7er\u00e7ovey\u00ea de bi zihniyet\u00ea re \u00e7awa hevd\u00fb temem dikin,
  mirov div\u00ea ku bib\u00een\u00ea \u00fb wer\u00eane ser ziman. Ev komkuji, bi
  v\u00ee reng\u00ee ji komkujiya heleb\u00e7\u00ea \u00fb heta komkujiya \u015fengal\u00ea
  \u00fb komkujiya koban\u00ea \u00fb hwd, dema ku mirov di \u00e7er\u00e7oveya xatek\u00ea
  de li w\u00ea dihizir\u00ea, her wusa mirov bi zihniyeta w\u00ea re kif\u015f dike.
  \u00cad\u00ee, ew t\u00eag\u00een bi mirov re \u00e7\u00ea dibe ku ten\u00ea xate
  komkujiya heleb\u00e7\u00ea ku heta komkujiya \u015fengal\u00ea \u00fb komkujiya
  koban\u00ea \u00fb hwd, ten\u00ea weke kirineka w\u00ea t\u00eag\u00een, zihniyet
  \u00fb felsefeya ku ew komkuji daye kirin a. Em li vir, v\u00ea yek\u00ea di v\u00ea
  \u00e7er\u00e7ovey\u00ea de bi zihniyet\u00ea kif\u015f dikin.\\nP\u00eer\u00ean
  me kurdan, gotinaka wan heb\u00fb. Digotin ku \u00abcarna gotinaka ku ji dev\u00ea
  me derdikeve, dikar\u00ea rast\u00eeya me j\u00ee bi keseyet\u00eeya me re rax\u00ea
  li ber\u00e7av.\u00bb Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea de hem di dema
  komkujiya heleb\u00e7\u00ea \u00fb b\u00fby\u00eena w\u00ea de \u00fb hem j\u00ee
  pi\u015ftre n\u00eaz\u00eekat\u00eeya di qada navnetew\u00ee de ku li w\u00ea hat\u00eeya
  kirin, bi heman reng\u00ee div\u00ea ku mirov bi zihniyet \u00fb politikaya w\u00ea
  zihniyet\u00ea re wer\u00eane ser ziman. Gelek mirov, dema ku li ser v\u00ea xal\u00ea
  bihizirin, w\u00ea aliy\u00ea w\u00ea wijdan\u00ee, ahlaq\u00ee \u00fb hwd j\u00ee
  bib\u00eenin \u00fb wer\u00eanina ser ziman. Ev, weke aliyna nirx\u00ee \u00ean
  ku mirov pi\u015ftre j\u00ee dikar\u00ea wan kif\u015f bike \u00fb wer\u00eane ser
  ziman. Wijdan \u00fb ahlaq, hinek\u00ee \u00e7er\u00e7oveya zan\u00een \u00fb keseyet\u00eeya
  mirov bi xwe re dih\u00eane ser ziman. Komkujiya heleb\u00e7\u00ea, dema ku mirov
  di v\u00ea \u00e7er\u00e7ovey\u00ea de l\u00ea bihizir\u00ea, mirov dikar\u00ea
  bib\u00eaje ku rast\u00eeya wijdan \u00fb ahlaq\u00ea mirov j\u00ee radixe li ber\u00e7av.
  Her wusa, n\u00eaz\u00eekat\u00eeya mirov a li w\u00ea, ku ev kurd b\u00ea \u00fb
  ne kurd b\u00ea, ku k\u00ee b\u00ea, bila bibe, w\u00ea di \u00e7er\u00e7oveyek\u00ea
  de n\u00eaz\u00eekat\u00eeya w\u00eeya wijdan \u00fb ahlaq\u00ea w\u00ee b\u00ea.
  Her wusa, ku mirov ji v\u00ea gotin\u00ea gav biav\u00eaje \u00fb bib\u00eaje ku
  komkujiya heleb\u00e7\u00ea, ku di destp\u00eaka sedsala 21\u00b4\u00ea de di serdema
  ku bahse p\u00ea\u015fketin \u00fb mirovatiy\u00ea \u00fb mirov \u00fb maf\u00ea
  mirov \u00fb azad\u00ee \u00fb mafan dih\u00ea kirin de, kirina w\u00ea, hinek\u00ee
  j\u00ee di v\u00ea \u00e7er\u00e7ovey\u00ea de z\u00eadetir\u00ee bi hi\u015fmend\u00ee
  ji mirov dixwez\u00ea ku mirov w\u00ea wer\u00eane ser ziman. \u00c7er\u00e7oveya
  t\u00eag\u00een \u00fb p\u00ea\u015fketina mirov, v\u00ea yek\u00ea ji mirov dixwez\u00ea
  ku mirov z\u00eadetir j\u00ee wer\u00eane ser ziman. Her wusa di v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov wer\u00eane ser ziman ku \u00e7er\u00e7oveya t\u00eag\u00eena
  mirov di v\u00ea \u00e7er\u00e7ovey\u00ea de bi wijdan \u00fb ahlaq\u00ea mirov
  re dikeve berpirs\u00eenek\u00ea de j\u00ee.\\nKomkujiya heleb\u00e7\u00ea aliy\u00ea
  w\u00ea bi \u00e7er\u00e7oveya navnetew\u00ee de her wusa div\u00ea ku mirov bi
  t\u00eakiliy\u00ean bi rejima dem\u00ea a baas\u00ea a Saddam wer\u00eane ser ziman.
  Ew t\u00eakil\u00ee \u00fb alikar\u00eeya ku v\u00ea rejima baas\u00ea ku ji wan
  t\u00eakiliy\u00ean xwe y\u00ean rojava stand\u00eeya bi w\u00ea ew komkuji kir\u00eeya.
  Di v\u00ea \u00e7er\u00e7ovey\u00ea de ew komkuji, xwediy\u00ea \u00e7er\u00e7oveyeka
  navnetew\u00ee ya. Teybet\u00eeya sereka bi v\u00ea yek\u00ea, ew a ku ew \u00e7ek\u00ean
  kimyew\u00ee ku bi wan ew komkuji hat\u00eeya kirin a. Her wusa di v\u00ea \u00e7er\u00e7ovey\u00ea
  de dema ku mirov li mijar\u00ea dihizir\u00ea, mirov weke aliyek\u00ee w\u00ea y\u00ea
  teybet v\u00ea yek\u00ea kif\u015f dike ku div\u00ea ku wer\u00eane ser ziman.\\nHeleb\u00e7\u00ea,
  weke her\u00eameka ba\u015f\u00fbr\u00ea kurdistan\u00ea a bi d\u00eerok \u00fb
  kevn a. Ev her\u00eam, her wusa weke her\u00eameka ku ne d\u00fbr\u00ee ji ber \u00e7em\u00ea
  firat\u00ea j\u00ee ya. Hinek \u015faq\u00ean \u00e7em\u00ean firat\u00ea di ber
  w\u00ea re diharikin. Her wusa div\u00ea ku mirov v\u00ea yek\u00ea j\u00ee wer\u00eane
  ser ziman ku heleb\u00e7\u00ea, weke devereka ku li w\u00ea hertim\u00ee \u015f\u00eenat\u00ee
  \u00fb zev\u00ee \u00fb fireze \u00fb hwd hen ana. Ji ber v\u00ea yek\u00ea, div\u00ea
  ku mirov v\u00ea yek\u00ea j\u00ee, wer\u00eane ser ziman ku dem bi dem bar\u00eena
  baran\u00ea li ser w\u00ea arda w\u00ea ya sor, dike ku hertim\u00ee ew \u015f\u00een
  bim\u00eane. Di roja ku ew \u00e7ek\u00ean kimyew\u00ee dihat bikarhan\u00een de
  j\u00ee, her wusa rojaka bi awr b\u00fb \u00fb pi\u015ftre ne bi gelek\u00ee re
  ku baran bar\u00ee b\u00fb. Ya ku p\u00ea\u015f\u00eeya tevkujiy\u00ean di w\u00ea
  komkujiy\u00ea de ku bi milyonan girtib\u00fb j\u00ee, ew rew\u015fa hewa ya bi
  bar\u00eena baran\u00ea re b\u00fb.\\nLi vir, div\u00ea ku mirov v\u00ea yek\u00ea
  j\u00ee wer\u00eane ser ziman ku bi \u00e7ek\u00ean kimyew\u00ee, hewl hatib\u00fb
  day\u00een ku bi temem\u00ee j\u00eeyan li wir were z\u00fbwakirin. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de bi armancaka kif\u015fkir\u00ee \u00fb bi programaka ku hat\u00ee \u00e7\u00eakirin
  re ew \u00e7ek\u00ean kimyew\u00ee hatina bikarhan\u00een li heleb\u00e7\u00ea.\\nEm\u00ea
  li j\u00ear wer\u00eanina ser ziman. L\u00ea li vir, div\u00ea ku ez bi gotinek\u00ea
  j\u00ee b\u00ea bahse w\u00ea bikim ku di \u00e7er\u00e7oveya komkujiya heleb\u00e7\u00ea
  de, heya hem\u00fb rejim\u00ean ku pirsgir\u00eaka wan ya kurd heb\u00fb, ji w\u00ea
  komkujiy\u00ea \u00fb kirina w\u00ea heb\u00fb. Bi hevd\u00fb re, hat ku dan\u00fbstandin
  j\u00ee li ser away\u00ea kirina komkujiy\u00ea kirib\u00fbn. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de, bi dem\u00ea re \u00e7end ku rayadar\u00ean wan rejiman derdiketina bi ber\u00e7apameniyan
  \u00fb diaxiftin, ew bi gotin\u00ean wan re dihat d\u00eetin. Dema komkujiy\u00ea
  ku w\u00ea di w\u00ea de biheta kirin, ew j\u00ee, hatib\u00fb bi plankirin. Di
  demaka wusa de plana w\u00ea komkujiy\u00ea hatib\u00fb kirin, ku weke komkujiyeka
  ku di ancama w\u00ea \u015fer\u00ea heftsalan \u00ea di nava \u00eeran \u00fb \u00eeraq\u00ea
  de ku b\u00fbya de ku b\u00fbya w\u00ea biheta day\u00een n\u00ee\u015fandin. Ji
  ber v\u00ea yek\u00ea b\u00fb ku dema ku di w\u00ea de ew komkuji hatib\u00fb kirin
  j\u00ee, di v\u00ea \u00e7er\u00e7ovey\u00ea de weke demeka ku hatib\u00fb kif\u015fkirin
  b\u00fb. Ev dem, her wusa weke demeka ku plankir\u00ee b\u00fb.\\nKomkujiya heleb\u00e7\u00ea,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de dema ku destp\u00ea dike, h\u00eaz\u00ean
  rejima Saddam, w\u00ea ji ber ava \u00e7em\u00ea firat\u00ea ji her\u00eam\u00ean
  kerk\u00fbk \u00fb feyl\u00eeyan dest bi komkujiyan bikin. Pi\u015ftre ber bi her\u00eam\u00ean
  \u015febek\u00eeyan de her\u00ea. Pi\u015ftre werina ber bi her\u00eama berzan ve.
  Di v\u00ea \u00e7er\u00e7ovey\u00ea de gav bi gav \u00fb her\u00eam bi her\u00eam
  bi kirina komkujiy\u00ea de p\u00eade di\u00e7\u00fbn. Mirov\u00ean ku xwe ji komkujiy\u00ea
  xilas dikirin, diav\u00eat\u00ean derv\u00ee s\u00eenoran. Her wusa, di sedsala
  me de, ku evqas\u00ee, teknik p\u00ea\u015fket\u00eeya, me galo derfeta xwe xilaskirin\u00ea
  z\u00eade heb\u00fb ji w\u00ea h\u00ear\u00ee\u015fa bi \u00e7ek\u00ean kimyew\u00ee?\\nB\u00eag\u00fbman,
  dema ku mirov di v\u00ea \u00e7er\u00e7ovey\u00ea de li w\u00ea dihizir\u00ea, mirov
  gelek h\u00fbrgil\u00ean ku mirov div\u00ea ku wan wer\u00eane ser ziman \u00fb
  rast\u00eeya komkujiy\u00ea z\u00eadetir hin bi hin mazintir didina n\u00ee\u015fandin,
  derdikevina li hol\u00ea. Di v\u00ea \u00e7er\u00e7ovey\u00ea de p\u00eavajoya jenos\u00eeda
  heleb\u00e7\u00ea, ku bi oparasyon\u00ean rejima baas\u00ea \u00ean ku nav\u00ea
  \\\"enfal\u00ea\\\" li wan hat\u00eeya kirin re w\u00ea destp\u00ea bike. Her wusa
  di v\u00ea \u00e7er\u00e7ovey\u00ea de w\u00ea \u00ead\u00ee were berfireh kirin.
  Armanc, ne ten\u00ea ku\u015ftina \u00e7end mirovan \u00fb ank\u00fb \u00e7end mirov\u00ean
  ku rast\u00eeya rejim\u00ea her\u00ea nekirin b\u00fb. Ji w\u00ea z\u00eadetir\u00ee,
  armanc, heb\u00fbna civat\u00ee b\u00fb. Bo v\u00ea yek\u00ea b\u00fb ku m\u00ear
  \u00fb mazin di ku\u015ftin \u00fb ke\u00e7zarok \u00fb hwd, berhev dikirin \u00fb
  dikirina kamyon\u00ean le\u015fker\u00ee de \u00fb di birina welat\u00ean din \u00ean
  araban \u00fb hwd, di firotin. Welat\u00ean, weke Tunis, Urdin, Misir, Siud\u00ee
  arabistan \u00fb hwd, \u00e7end ji wan welat\u00ean arab ku ew ke\u00e7zarok\u00ean
  kurd bi hezaran hatib\u00fbb\u00fbna birin li wan welatan \u00fb hatib\u00fbb\u00fbna
  firotin. Li her\u00eam\u00ean din j\u00ee, ew hatina bir\u00een. Pi\u015ft\u00ee
  komkujiy\u00ea j\u00ee, \u00e7end ku dem bi ser komkujiy\u00ea ve di\u00e7\u00fb,
  h\u00eaz\u00ean ku li pi\u015ft\u00ee w\u00ea komkujiy\u00ea b\u00fbn, dixwestin
  ku ew rastiy\u00ean bi komkujiya heleb\u00e7\u00ea re ku b\u00fbna, werina\\\"jib\u00eerkirin.\\\"Di
  v\u00ea \u00e7er\u00e7ovey\u00ea de hewl didan ji mejiyan bidina d\u00fbrkirin.
  Ev hewldana day\u00eena jib\u00eerkirin\u00ea, hewldanaka ku bi armanca domandina
  w\u00ea p\u00eavajoya jenos\u00eed\u00ea a li ser ser\u00ea civate kurd b\u00fb.
  Dema ku di dema xwe de di dema ku ew komkuji b\u00fb ku bi hem\u00fb aliy\u00ean
  w\u00ea li ser w\u00ea biheta sekin in \u00fb ew biheta l\u00eakol\u00een \u00fb
  hem\u00fb rastiy\u00ean biheta derxistin li hol\u00ea, w\u00ea p\u00ea\u015f\u00eeya
  domandina w\u00ea p\u00eavajoya jenos\u00eed\u00ea a li ser ser\u00ea civat\u00ea
  j\u00ee biheta girtin. Bo v\u00ea yek\u00ea b\u00fb ku h\u00eaz\u00ean ku ew komkuji
  bi hevd\u00fb re kirib\u00fbn, di xwestin ku w\u00ea p\u00eavajoy\u00ea bidina domandin.\\nEm\u00ea
  pi\u015ftre, v\u00ea rast\u00eey\u00ea bi p\u00eavajoy\u00ean pi\u015ftre pirr z\u00eade
  \u00fb ba\u015ftir bib\u00eenin. Pi\u015ft\u00ee, komkujiya heleb\u00e7\u00ea, hem
  bo ku ser v\u00ea komkujiy\u00ea \u00fb rastiy\u00ean w\u00ea \u00ean bi v\u00ee
  reng\u00ee were girtin \u00fb hem j\u00ee bo ku ew xate w\u00ea ya bi armanca jenos\u00eed\u00ea
  b\u00ea domandin, pi\u015ftre j\u00ee, w\u00ea bi pi\u00e7\u00fbkat\u00ee \u00fb
  mazinah\u00eeya xwe re gelek komkuji li d\u00fbv hevd\u00fb werina kirin. Her wusa,
  pi\u015ft\u00ee ketina h\u00eaz\u00ean Emerika li \u00ceraq\u00ea de, bi weke \\\"h\u00eancet\\\"
  n\u00ee\u015fandina taq\u00eena wan bombay\u00ean ku dihatina taqandin, ten\u00ea
  weke xapandina ku li ser \u00e7apameniy\u00ea re ku di mejiyan de bidina \u00e7\u00eakirin
  b\u00fb. Ev j\u00ee, ji k\u00fbder\u00ea dih\u00ea fahmkirin? Ev yek ji w\u00ea
  p\u00eavajoya komkujiy\u00ea ku pi\u015ft\u00ee komkujiya heleb\u00e7\u00ea, ku
  pi\u015ft\u00ee w\u00ea re bi 27 salan re ku bi komkujiy\u00ean weke komkujiya \u015fengal\u00ea
  \u00fb komkujiya koban\u00ea re ku didom\u00ea. Di roja me de, di van roj\u00ean
  ku ez van r\u00eazan diniv\u00ees\u00eanim, h\u00ea \u00ea\u015fa komkujiya \u015fengal\u00ea
  j\u00ee \u00fb ya komkujiya koban\u00ea j\u00ee zind\u00ee ya. W\u00ea pi\u015ft\u00ee
  van komkujiya ev h\u00eaz\u00ean ku li pi\u015ft\u00ee komkujiya heleb\u00e7\u00ea
  b\u00fbn \u00fb \u00ee ro ev komkujiy\u00ean weke komkujiya \u015fengal\u00ea \u00fb
  komkujiya koban\u00ea kirina, w\u00ea pi\u015ft\u00ee v\u00ea re j\u00ee, hewl bidin
  ku p\u00eavajoya komkujiyan ji v\u00ea dem\u00ea j\u00ee bidina domandin ber bi
  p\u00ea\u015faroj\u00ea ve. Ji ber v\u00ea yek\u00ea ya ku ten\u00ea kirina van
  komkujiyan weke kar\u00ea \u00e7end \u00e7etey\u00ean ku bi r\u00eaxistin kirina
  bi nav\u00ea DA\u00ce\u015e\u00b4\u00ea dih\u00eanin ser ziman. Ten\u00ea, ev rew\u015f
  j\u00ee, dide n\u00ee\u015fandin ku dixwezin ku ev xate komkujiy\u00ea bidina domandin.
  Bo v\u00ea yek\u00ea ya, ku \u00ead\u00ee pirr giring \u00fb j\u00eeyan\u00ee ya
  ku em rast\u00eeya komkujiya heleb\u00e7\u00ea l\u00ea bikol\u00een \u00fb w\u00ea
  ba\u015f fahm bikin.. Her wusa rast\u00eeya komkujiya heleb\u00e7\u00ea, w\u00ea
  me bi xwe re bigih\u00eane gelek rastiy\u00ean v\u00ea\u015far\u00ee \u00ean li
  pi\u015ft\u00ee kirina komkujiya \u015fengal\u00ea \u00fb komkujiya koban\u00ea
  j\u00ee.\\nBo v\u00ea yek\u00ea giringa ku mirov bi teybet\u00ee li ser w\u00ea
  bisekin\u00ea \u00fb hewl bide ku w\u00ea ba\u015f fahm bike \u00fb wer\u00eane
  ser ziman. Li vir, div\u00ea ku mirov v\u00ea yek\u00ea bi teybet\u00ee wer\u00eane
  ser ziman ku rast\u00eey\u00ean v\u00ea\u015far\u00ee \u00ean li pi\u015ftperdey\u00ea
  di komkujiya heleb\u00e7\u00ea de, w\u00ea di \u00e7er\u00e7oveya heb\u00fbna civate
  kurd de, rast\u00eey\u00ean li pi\u015ft perdey\u00ea \u00ean bi armanca domandina
  \u00b4pirsgir\u00eaka kurd\u00b4 j\u00ee wer\u00eane ser ziman. W\u00ea rastiy\u00ean
  li pi\u015ft\u00ee komkujiy\u00ean weke komkujiya \u015fengal\u00ea \u00fb komkujiya
  koban\u00ea j\u00ee rax\u00ea li ber\u00e7av. Herwusa, rast\u00eeya li pi\u015ft\u00ee
  komkujiy\u00ean din \u00ean ku li ba\u015f\u00fbr\u00ea kurdistan\u00ea, li rojavay\u00ea
  kurdistan\u00ea, li bak\u00fbr\u00ea kurdistan\u00ea \u00fb li rojhilat\u00ea kurdistan\u00ea
  j\u00ee rax\u00ea li ber\u00e7av. Li bak\u00fbr\u00ea kurdistan\u00ea, \u00ee ro
  bi deh hezaran kurd, di zindanan de na. Ziman\u00ea kurd\u00ee li kurdan hat\u00eeya
  qadaxakirin. Oparasyon\u00ean qirkirina s\u00eeyes\u00ee li ser ser\u00ea kurdan
  dime\u015f\u00eanin. Ev rew\u015f hem\u00fb, t\u00eag\u00eena di temen\u00ea wan
  de, div\u00ea ku mirov di \u00e7er\u00e7oveya t\u00eag\u00een \u00fb zihniyeta ku
  bi w\u00ea komkujiya heleb\u00e7\u00ea \u00fb pi\u015ftre komkujiya \u015fengal\u00ea
  \u00fb komkujiya koban\u00ea re wer\u00eane ser ziman. Her wusa, div\u00ea ku mirov
  li rejima \u00eeran\u00ea ku li rojhilat\u00ea kurdistan\u00ea j\u00ee qadaxa li
  ser ziman\u00ea kurd\u00ee bi dervekirin\u00ean ciwan\u00ean kurd ku ew dike re
  wer\u00eane ser ziman. Ev j\u00ee, weke aliyek\u00ee din \u00ea v\u00ea \u00e7er\u00e7ovey\u00ea
  na ku div\u00ea ku mirov bi teybet\u00ee li ser wan bisekin\u00ea \u00fb hewl bide
  ku bi rast\u00ee fahm bike \u00fb wer\u00eane ser ziman. Komkujiya heleb\u00e7\u00ea,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov rast fahm bike \u00fb
  wer\u00eane ser ziman. Div\u00ea ku mirov p\u00ea\u015f\u00ee di v\u00ea \u00e7er\u00e7ovey\u00ea
  de weke ku me li hinek\u00ee li jor han\u00ee ser ziman, div\u00ea ku mirov bi zihniyeta
  di temen\u00ea w\u00ea de ku ew daye kirin re w\u00ea wer\u00eanina ser ziman. Dema
  ku em w\u00ea zihniyet\u00ea fahm nekin \u00fb ney\u00eanina ser ziman, hing\u00ee
  w\u00ea komkujiya heleb\u00e7e, ten\u00ea weke komkujiyeka ji r\u00eaz\u00ea ku
  di ancama hinek politikay\u00ean dem\u00ee de ku hat\u00eeya kirin w\u00ea b\u00ea
  d\u00eetin. Rast a, ku aliyek\u00ee v\u00ea komkujiy\u00ea bi politikay\u00ean dem\u00ee
  re j\u00ee heya. L\u00ea ev di temen\u00ea w\u00ea de bi zihniyetek\u00ea hat\u00eeya
  kirin. Rast\u00eeyeka reng\u00ea v\u00ea zihniyet \u00fb t\u00eag\u00eena rejim\u00ea
  a di temen\u00ea kirina v\u00ea komkujiya heleb\u00e7\u00ea de ew a ku di dema komkujiy\u00ea
  de ku bi hezaran ke\u00e7zaroy\u00ean kurd dihatina berhevkirin \u00fb birina welat\u00eana
  arab \u00fb hatina firotin \u00fb heta v\u00ea roj\u00ea j\u00ee ku ji wan ti agah\u00ee
  ne hat\u00eeya standin a. Ev rew\u015fa ku bi berhevkirina ke\u00e7zaroy\u00ean
  kurd \u00fb birina welat\u00ean arab \u00fb firotina wan, rew\u015feka ku me di
  dema komkujiya dersim\u00ea de ku bi kirina rejima tirk re j\u00ee d\u00eetib\u00fb
  b\u00fb. Saddsam huseyin, dema ferman zilam\u00ean xwe \u00ean weke Al\u00ee el-mecid
  ku kurd weke \\\"al\u00ee kimyew\u00ee\\\" bi nav dikin \u00fb dema ku ew komkujiya
  heleb\u00e7\u00ea da kirin, hing\u00ee dib\u00ea ku w\u00ee ev kirin\u00ean tirkiya
  pirr l\u00eakol\u00een kirib\u00fbn. Yan j\u00ee, li rex w\u00ee, dib\u00ea ku \u00e7end
  mirov\u00ean ku tirk ku bi w\u00ea aqil\u00ea dihizirin ku aqil didan dib\u00ea
  ku amede b\u00fbn. Ev rew\u015f, hem\u00fb j\u00ee, weke rew\u015fna ku div\u00ea
  ku mirov di v\u00ea \u00e7er\u00e7ovey\u00ea de li wan bihizir\u00ea \u00fb wan
  wer\u00eane ser ziman in. Komkujiya heleb\u00e7\u00ea, bi kirina w\u00ea re weke
  ancama van kiryar \u00fb kirina hem\u00fbyan a.\\nLi vir, div\u00ea ku em v\u00ea
  aliy\u00ea bi teybet\u00ee li ser w\u00ea bisekin in. Komkujiya heleb\u00e7\u00ea,
  aliy\u00ea w\u00ea navnetew\u00ee ku bi aliy\u00ea welat\u00ean arab a bi v\u00ee
  reng\u00ee ku er firotina li wan a ke\u00e7zaroy\u00ean kurd re, weke aliyek\u00ee
  v\u00ea\u015far\u00ee maya. Her wusa, ji w\u00ea z\u00eadetir\u00ee j\u00ee, di
  temen\u00ea v\u00ea t\u00eakiliy\u00ea de heya. Ji ber \u00e7i ev welat\u00ean arab,
  naxwezin ku ev rast\u00ee derkeve li hol\u00ea \u00fb ser w\u00ea n\u00fbx\u00fbmand\u00ee
  dih\u00ealin? Ji ber ku bi v\u00ea rast\u00eey\u00ea ve gir\u00eaday\u00ee gelek
  rastiy\u00ean din \u00ean ku w\u00ea b\u00ean d\u00eetin hena. Ji w\u00ea z\u00eadetir\u00ee,
  \u00e7er\u00e7oveyaka bi v\u00ee reng\u00ee ku w\u00ea bi komkujiya heleb\u00e7\u00ea
  re were d\u00eetin heya.\\nDema ku ev aliy\u00ea komkujiy\u00ea \u00ea bi firotina
  ke\u00e7zaroy\u00ean kurd re mirov li w\u00ea dihizir\u00ea, weke b\u00fbyaraka
  ku ten\u00ea rejima Saddam bi w\u00ea dixwez\u00ea ku civate kurd ji hevd\u00fb
  belav bike. Di v\u00ea \u00e7er\u00e7ovey\u00ea de ev kirin dih\u00ea kirin. Ya
  bi w\u00ea re j\u00ee, ew a ku heya van welat\u00ean arab ji w\u00ea heya \u00fb
  di v\u00ea \u00e7er\u00e7ovey\u00ea de alikariyek wan ji w\u00ea kirina Saddam re
  heya. Ev ten\u00ea weke aliyeka ku naxwezn ku were d\u00eetin \u00fb kif\u015fkirin
  a. Ji ber v\u00ea yek\u00ea ya ku bi isrer\u00ee dixwezin ku ser w\u00ea rast\u00eeya
  firotina ke\u00e7zaroy\u00ean kurd bigrin. Ten\u00ea ku mirov di \u00e7er\u00e7oveya
  dewlata misr\u00ea de bihizir\u00ea, wezereta kar\u00ea derve \u00fb ya hundur\u00een
  \u00fb her wusa ya serokwezirtiy\u00ea di van waran de xwediy\u00ea gelek belge
  \u00fb dokument\u00ean ku ew bixwe j\u00ee naxwez\u00ea ku wan ji rayagi\u015ft\u00ee
  re vek\u00ea di dest\u00ea w\u00ea de hena. Her wusa, dixwez\u00ea ku v\u00ea\u015far\u00ee
  bih\u00eale \u00fb ser wan v\u00ea\u015far\u00ee were girtin Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de bo v\u00ea yek\u00ea, heta ku ji w\u00ea t\u00ea, dixwez\u00ea ku yan \u00eenkar
  bike \u00fb yan j\u00ee bi r\u00eabaz\u00ean din \u00ean dane jib\u00eerkirin\u00ea
  \u00fb hwd, w\u00ea ji hi\u015f\u00ea rayagi\u015ft\u00ee bide d\u00fbrkirin.\\nDi
  v\u00ea \u00e7er\u00e7ovey\u00ea de em dikarin bi dewlet\u00ean din re j\u00ee wer\u00eanina
  ser ziman. \u00c7end ku rejima Saddam a baas\u00ea hat r\u00fbxandin j\u00ee, l\u00ea
  ew zihniyeta w\u00ea ji hol\u00ea raneb\u00fb. Pi\u015ftre j\u00ee, heb\u00fbna
  xwe domand. Malik\u00ee ku pi\u015ft\u00ee Saddam re hat dewsa w\u00ee, politikay\u00ean
  w\u00ee ji y\u00ean Saddam ne c\u00fbdatir b\u00fbn. Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov v\u00ea yek\u00ea j\u00ee wer\u00eane ser ziman ku hertim\u00ee,
  li pi\u015ft perdey\u00ea rejima \u00eeraq\u00ea, ya baas\u00ea weke xwe li desthilatdar\u00eey\u00ea
  ma. Mirov, v\u00ea yek\u00ea ji k\u00fb fahm dike? Mirov v\u00ea yek\u00ea ji reng\u00ea
  kirina politikayan, n\u00ee\u015fandina bertek \u00fb hwd fahm dike. Di v\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov wer\u00eane ser ziman ku pi\u015ft\u00ee
  rejima Baas\u00ea weke ku \\\"hat r\u00fbxandin\\\" j\u00ee, w\u00ea pi\u015ftre
  biawayek\u00ee li dem\u00ea belavkir\u00ee, w\u00ea komkujiy\u00ean kurdan \u00ean
  ku dih\u00eanin ser\u00ea civate kurd w\u00ea b\u00ean day\u00een domandin. Ev rew\u015f,
  w\u00ea heta dema derxistina li hol\u00ea a DA\u00ce\u015e\u00b4\u00ea \u00fb hwd
  w\u00ea bidom\u00ea. Pi\u015ft\u00ee ku DA\u00ce\u015e, bi aliya welat\u00ean ku
  pirsgir\u00eaka wan ya kurd heya ku hat derxistin li hol\u00ea \u00fb p\u00ea de,
  \u00ead\u00ee di \u00e7er\u00e7oveya w\u00ea n\u00eaz\u00eekatiy\u00ea de weke ku
  hewldanaka n\u00fb ya weke ya dema Saddam a bi komkujiya heleb\u00e7\u00ea re biheman
  reng\u00ee bi DA\u00ce\u015e\u00b4\u00ea re li hember\u00ea kurdan hat day\u00een
  n\u00ee\u015fandin. Di v\u00ea \u00e7er\u00e7ovey\u00ea de p\u00eavajoya komkujiy\u00ea
  ya Heleb\u00e7\u00ea, ku hatib\u00fb kirin, weke ku hat xwestin ku were d\u00fbbara
  kirin li ser ser\u00ea civate kurd. Div\u00ea \u00e7er\u00e7ovey\u00ea de \u00ead\u00ee
  \u00e7\u00fbna bi ser kurdan de. Li gor\u00ee dem\u00ea, temen\u00ea w\u00ea r\u00eaxistin
  \u00fb komkujiy\u00ean ku li ser ser\u00ea civate kurd bike j\u00ee, heta ku li
  ser ol\u00ea re j\u00ee hatib\u00fb \u00e7\u00eakirin. Minaq, gotin\u00ean weke
  \\\"ku\u015ftina kurdan \u00b4helal\u00b4 a\\\" \u00fb \\\"destav\u00eatina mal,
  can \u00fb namusa wan helal\u00b4 a\\\", bi heman reng\u00ee \u00fb zihniyet\u00ea
  mirov dikar\u00ea wer\u00eane ser ziman. V\u00eacar\u00ea, r\u00eabaz\u00ean jenos\u00eed\u00ea
  ku rjeima Saddam li hember\u00ee kurdan bikardihan\u00een, kirib\u00fbb\u00fbna
  bin perde \u00fb maskeya ol\u00ea de bi nav\u00ea \\\"fetwa\\\"y\u00ea \u00fb hwd.\\nP\u00eavajoya
  komkujiya heleb\u00e7\u00ea j\u00ee, her wusa di hema reng\u00ea de bo ku bidina
  n\u00ee\u015fandin, ol bikarhan\u00ee b\u00fbn. Minaq, nav\u00ea \\\"enfal\u00ea\\\"
  ji kuran\u00b4\u00ea ya \u00fb li oparasyona jenos\u00eedkirina kurdan hatib\u00fb
  kirin. Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea de dihat gotin \\\"enfal kirina
  kurdan\\\". Ev gotin, di v\u00ea \u00e7er\u00e7ovey\u00ea de hatina bikarhan\u00een.
  Di asl\u00ea xwe de gotina \\\"enfal kirina kurdan\\\", weke gotinaka ku mirov div\u00ea
  ku pirr li ser w\u00ea bisekin\u00ea ya. Pi\u015ft\u00ee komkujiya kurdan, di nava
  kurdan de \u00fb di \u00e7apameniya kurdan de j\u00ee hat ser ziman weke nav\u00ea
  w\u00ea komkujiya heleb\u00e7\u00ea. Di asl\u00ea xwe de, ev nav, bi zaneb\u00fbn\u00ee,
  weke navek\u00ee ku rejima baas\u00ea bijartib\u00fb b\u00fb. Hertim\u00ea, dema
  ku dihat gotin ku \\\"enfal kirina kurdan\\\", di mejiy\u00ea yek\u00ee misilman
  de, w\u00ea watey\u00ea j\u00ee dide \u00e7\u00eakirin ku \\\"y\u00ean ku ne misilman
  ku hatina anfalkirin\\\" j\u00ee dih\u00ea fahmkirin.Yan\u00ee, li vir, l\u00eestikeka
  ku li ser t\u00eag\u00een \u00fb gotin\u00eey\u00ea re ku h\u00ea bi komkujiya heleb\u00e7\u00ea
  bi xwe re j\u00ee heta roja me didom\u00ea heya. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de di mejiyan de ev gotina \\\"enfal kirina kurdan\\\", dib\u00ea weke oparasyonaka
  t\u00eagih\u00ea li mejiy\u00ea mirovan j\u00ee. Bi v\u00ea gotin\u00ea, mejiy\u00ea
  mirovan, weke ku reng\u00ea hizirkirina w\u00ea dih\u00ea day\u00een kirin.\\nEv
  reng\u00ea bi navkirina gotin\u00ea, mirov dikar\u00ea \u00e7awa w\u00ea fahm bike?
  Her wusa, aliyek\u00ee w\u00ea di \u00e7er\u00e7oveya \\\"dij-ol\u00ee\\\" n\u00ee\u015fandan\u00ea
  de heya. L\u00ea aliyek\u00ee w\u00ea y\u00ea din ku mirov div\u00ea ku bi heb\u00fbna
  deroniya civate kurd ve gir\u00eaday\u00ee j\u00ee ku wer\u00eane ser ziman heya.
  Ew j\u00ee, her wusa ew a ku di \u00e7er\u00e7oveya afirandina wateya v\u00ea gotin\u00ea
  de \u00ead\u00ee dikina temen\u00ea ku mirov bi deron\u00ee li ser w\u00ea kirina
  komkujiy\u00ea re ku ji rast\u00eeya civat\u00eeya xwe d\u00fbr bikeve. Yan\u00ee,
  bi gotinaka din, ku bi v\u00ea t\u00eag\u00eena w\u00ea gotin\u00ea re ku band\u00fbra
  w\u00ea komkujiya heleb\u00e7\u00ea, ku bikina temen\u00ea ji hevd\u00fb feli\u015fandinaka
  din dimejiy\u00ea mirov\u00ea kurd de ji aliyek\u00ee din ve.\\nDi v\u00ea \u00e7er\u00e7ovey\u00ea
  de gelek aliy\u00ean v\u00ea komkujiy\u00ea \u00ean ku li ser han\u00eena w\u00ea
  ya li ser ziman re j\u00ee ku ne hatina fahmkirin hena. Div\u00ea ku mirov bi teybet\u00ee
  li ser wan aliyan j\u00ee rawastih\u00ea \u00fb hewl bide ku wan fahm bike \u00fb
  wer\u00eane er ziman. Aliy\u00ea bi gotin\u00ee \u00ea weke navl\u00eakirina komkujiya
  heleb\u00e7\u00ea weke \\\"enfal kirina kurdan\\\" \u00fb hwd, dib\u00ea ku dema
  ku kurd w\u00ea di nava xwe de bikardih\u00eanin, bi n\u00eeyeteka ba\u015f ku bi
  w\u00ea dixwezin ku rast\u00eeya w\u00ea komkujiy\u00ea raxistina li ber\u00e7av
  w\u00ea bi w\u00ea reng\u00ea dih\u00eanin ser ziman. L\u00ea li vir, div\u00ea
  ku mirov di ser\u00ee de v\u00ea yek\u00ea j\u00ee ba\u015f fahm bike \u00fb wer\u00eane
  ser ziman ku ev gotin ji k\u00eejan gotinan p\u00eak t\u00ea \u00fb ew gotin ji
  k\u00eejan wateyan p\u00eak t\u00ea. Yek bi yek, dema ku mirov gotinan li wan dihizir\u00ea,
  minaq, weke gotina \\\"anfal\u00ea\\\" \u00fb hwd, bi wateya w\u00ea ya di kuran\u00b4\u00ea
  de dih\u00ea d\u00eetin \u00fb fahmkirin. Dema ku hewl dih\u00ea day\u00een ku \u00e7er\u00e7oveya
  t\u00eag\u00eena v\u00ea gotin\u00ea were fahmkirin j\u00ee, w\u00ea di w\u00ea
  \u00e7er\u00e7ovey\u00ea de hewl b\u00eaday\u00een ku rast\u00eeya v\u00ea gotin\u00ea
  \u00fb t\u00eag\u00eena w\u00ea were kif\u015fkirin. Ev, bi ser\u00ea xwe weke aliyek\u00ee
  din \u00ea ku mirov div\u00ea ku ji aliy\u00ea deroni ve j\u00ee ku li w\u00ea bihizir\u00ea
  \u00fb hewl bide ku w\u00ea fahm bike \u00fb wer\u00eane ser ziman a.\\nJi aliy\u00ea
  gotin \u00fb bi navkirin\u00ea ve j\u00ee, band\u00fbra w\u00ea bi navkirin\u00ea
  di mejiy\u00ea mirovan de ji gelek aliy\u00ean ku di nava hevd\u00fb de hena ve
  mirov dikar\u00ea wer\u00eane ser ziman. Her wusa, aliy\u00ea p\u00ea\u015f\u00ee
  weke ku bi gotin\u00ea re me hinek\u00ee li jor han\u00ee ser ziman bi reng\u00ea
  t\u00eag\u00eenaka li ser ol\u00ea re xwe dide d\u00eeyarkirin. \u00c7end\u00ee
  ku em hewl bidin ku bi \u015f\u00eeroveyek\u00ea rast\u00eeya v\u00ea komkujiy\u00ea
  ba\u015f j\u00ee wer\u00eanina ser ziman, l\u00ea ku bi v\u00ee reng\u00ee bi gotinaka
  li ser ol\u00ea re hat bi navkirin, ew gotina ku li ser ol\u00ea re hat\u00ee bi
  navkirin, dikar\u00ea w\u00ea \u015f\u00eerove \u00fb rast\u00eeya ku komkujiy\u00ea
  ku hat\u00ee ser ziman, di mejiyan de berevaj\u00ee w\u00ea bike. Her wusa, dikar\u00ea
  rastiy\u00ea berevaj\u00ee rast\u00eeya w\u00ea bide n\u00ee\u015fandin. Ev j\u00ee,
  weke aliyek\u00ee din \u00ea ku div\u00ea ku mirov bi komkujiya heleb\u00e7\u00ea
  re w\u00ea hilde li dest \u00fb wer\u00eane ser ziman a. ..\\nDi v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov rast\u00eeya komkujiya heleb\u00e7\u00ea, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de hinek\u00ee li ser nav re j\u00ee \u015f\u00eerove bike \u00fb wer\u00eane ser
  ziman. Li vir, ez dixwezim ku h\u00fbrgilaka din di \u00e7er\u00e7oveya komkujiya
  heleb\u00e7\u00ea ve wer\u00eanima ser ziman. Pi\u015ft\u00ee ku Saddam huseyin,
  komkujiya heleb\u00e7\u00ea dike \u00fb bi de hezaran kurdan dide ku\u015ftin \u00fb
  pi\u015ftre, di\u00e7\u00ea \\\"bi xw\u00fbna xwe k\u00fbran\u00b4\u00ea dide niv\u00eesandn.\\\"
  Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov van rast\u00eeya
  bi hevd\u00fb ve gir\u00eaday\u00ee wer\u00eane ser ziman. Yan\u00ee, bi rengek\u00ee
  din, armanca kirina w\u00ea komkujiy\u00ea \u00fb hem\u00fb kujariya xwe di bin
  maskeya ol\u00ea de bi v\u00ea re bide v\u00ea\u015fartin. Ji w\u00ea z\u00eadetir\u00ee
  j\u00ee, her wusa, li vir, hewldanaka ku li ser t\u00eag\u00eena ol\u00ee \u00fb
  gotin\u00ean w\u00ea re han\u00eena li ser ziman \u00fb bi w\u00ea re \u00ead\u00ee
  di v\u00ea \u00e7er\u00e7ovey\u00ea de \\\"me\u015fr\u00fb\\\" day\u00eena n\u00ee\u015fandina
  w\u00ea, hat\u00eeya day\u00een n\u00ee\u015fandin. Gotina anfal\u00ea, di \u00e7er\u00e7oveya
  komkujiya heleb\u00e7\u00ea de, biqas\u00ee w\u00ea l\u00eestika qir\u00eaj ya Saddam
  ku bi xw\u00fbna xwe kuran\u00b4\u00ea bide niv\u00eesandin, aliyek\u00ee v\u00ea
  zihniyet\u00ea \u00ea qir\u00eaj \u00fb lewit\u00ee radixe li ber\u00e7av. Her wusa
  di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov an aliy\u00ean ku di temen\u00ea
  kirina komkujiyan \u00ean li her\u00eam\u00ea de ba\u015f fahm bike \u00fb wer\u00eane
  ser ziman. Komkujiya heleb\u00e7\u00ea, di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea
  ku mirov wer\u00eane ser ziman ku weke komkujiyaka ku w\u00ea \u00e7awa li ser w\u00ea
  bi gotin \u00fb t\u00eag\u00een\u00ea re were girtin j\u00ee, li w\u00ea j\u00ee
  weke ku hat\u00eeya hizir\u00een a. Her wusa, n\u00ee\u015fanaka v\u00ea j\u00ee,
  bikarhan\u00eena gotina \\\"anfal\u00ea\\\" weke nav\u00ea v\u00ea komkujiy\u00ea
  ya ku div\u00ea ku mirov bi teybet\u00ee w\u00ea hilde li dest \u00fb hewl bide
  ku bi rast\u00eeya kirina jenos\u00eed\u00ea re fahm bike \u00fb wer\u00eane ser
  ziman a. Di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov v\u00ea j\u00ee
  bib\u00eaje ku carna nezan\u00eeya mirov j\u00ee, dib\u00ea temen\u00ea xwe ne haq
  derxistina mirov j\u00ee. \u00c7end ku kurd, biawayek\u00ee rast bi haq \u00fb bi
  maf in j\u00ee, di v\u00ea \u00e7er\u00e7ovey\u00ea de bi gotin\u00ean li ser ol\u00ea
  re her wusa, w\u00ea rew\u015fa xwe ji gelek aliyan ve dikina zor\u00ea de. Di asl\u00ea
  xwe de, aliyek\u00ee ku di temen\u00ea w\u00ea \u015fer\u00ea li hember\u00ee wan
  ku heta roja me dom\u00eeya ya, div\u00ea ku mirov bi vir ve gir\u00ea bide. Di
  dema \u015fer\u00ea DA\u00ce\u015e\u00b4\u00ea \u00ea bi kurdan re de, gelek ciwan\u00ean
  kurd \u00ean ji Heleb\u00e7\u00ea, ku di nava DA\u00ce\u015e\u00b4\u00ea de hatina
  d\u00eetin \u00fb kif\u015fkirin, div\u00ea ku mirov bi v\u00ea rastiy\u00ea re
  wer\u00eane ser ziman. Li vir, di ser\u00ee de dema ku mirov van aliyan bi rast\u00ee
  \u00fb bi ba\u015f\u00ee fahm nek\u00ea \u00fb ney\u00eane ser ziman, w\u00ea aliyek\u00ea
  komkujiy\u00ea \u00ea mazin weke ku di bin perdey\u00ea de v\u00ea\u015far\u00ee
  bim\u00eane. Bi v\u00ea yek\u00ea, div\u00ea ku mirov hinek\u00ee din j\u00ee bi
  k\u00fbrah\u00ee li ser nav\u00ea \u00b4anfal\u00ea\u00b4 \u00fb hwd rawastih\u00ea
  \u00fb hwd bide ku w\u00ea ba\u015f fahm bike \u00fb wer\u00eane ser ziman.\\nEz
  dema ku li v\u00ea rew\u015fa komkujiya heleb\u00e7\u00ea a li ser nav re l\u00ea
  dihzirim, rew\u015fa komkujiya dersim\u00ea j\u00ee bi w\u00ea re dih\u00ea berb\u00eera
  min. Mirov\u00ea ku ferman komkujiya Dersim\u00ea day\u00ee M. Kemal Atat\u00fbrk,
  pi\u015ft\u00ee komkujiy\u00ea re ku her\u00ee z\u00eade nav\u00ea w\u00ee \\\"kemal\\\"
  li w\u00ea her\u00eam\u00ea z\u00eadetir were d\u00eetin, div\u00ea ku mirov bi
  v\u00ea rew\u015f\u00ea re wer\u00eane ser ziman. Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov t\u00eag\u00eena bi navan \u00fb gotinan re di rew\u015f\u00ean
  wan weha de weke aliyek\u00ee giring hilde li dest \u00fb wer\u00eane ser ziman.
  Ji ber ku gelek rastiy\u00ean ku di bin wan de dih\u00ean v\u00ea\u015fartin hena.
  Minaq, li tirkiya oparasyona bi nav\u00ea \\\"wergera li j\u00eeyan\u00ea\\\" ku
  li zindanan kirin ku di w\u00ea de bi dehan kurd \u00fb girt\u00eey\u00ean ji doz\u00ean
  din ji aliy\u00ea h\u00eaz\u00ean dewleta tirk ve hatina qatilkirin, nav\u00ea \\\"\u00b4wergera
  li j\u00eeyan\u00ea\\\" li w\u00ea kirin. Ev reng\u00ea navl\u00eakirin\u00ea, di
  v\u00ea \u00e7er\u00e7er\u00e7ovey\u00ea de bi armanca rengek\u00ee ser komkujiy\u00ea
  n\u00fbx\u00fbmandin\u00ea ya. Di v\u00ea \u00e7er\u00e7ovey\u00ea de di komkujiy\u00ean
  kurdan de rejim\u00ean her\u00eam\u00ea rejima tirk j\u00ee \u00fb ya \u00eeran\u00ea
  j\u00ee \u00fb ya \u00eeraq\u00ea j\u00ee \u00fb ya S\u00fbr\u00ee j\u00ee ser\u00ee
  li r\u00eabaz\u00ean bi v\u00ee reng\u00ee \u00ean li ser bi navkirin\u00ea re dana.
  Di bin w\u00ea bi navkirin\u00ea de hewldana ku komkujiy\u00ean ku kirina ser wan
  bin\u00fbx\u00fbm\u00eanin.\\nMijara bi navkirina komkujiy\u00ean kurdan, di v\u00ea
  \u00e7er\u00e7ovey\u00ea de weke mijaraka sern\u00fbx\u00fbmandin\u00ea hertim\u00ee
  derket\u00eeya li ber me. Her wusa, di komkujiya heleb\u00e7\u00ea de j\u00ee bi
  heman reng\u00ee mijara binavkirin\u00ea, w\u00ea weke mijaraka ser n\u00fbx\u00fbmandin\u00ea
  w\u00ea xwe bide d\u00eeyarkirin li ber me. Di dema ku ez li ser komkujiya heleb\u00e7\u00ea
  de dihizirim ku ez bi k\u00eejan aliy\u00ea ve l\u00ea dihizirim, ez dib\u00eenim
  ku ev mijara bi navkirin\u00ea her wusa derdikeve ber min. Bo v\u00ea yek\u00ea,
  \u00ead\u00ee ez dib\u00eenim ku weke p\u00eaw\u00eest\u00eeya zaror\u00ee ku mirov
  div\u00ea ku hewl bide ku w\u00ea rast\u00eeya bi navkirin\u00ea ya komkujiyan ku
  hatina han\u00een li ser\u00ea civate kurd hilde li dest. Her wusa, mijara bi navkirin\u00ea,
  weke mijaraka \\\"\u00eenkarkirin\u00ea\\\" j\u00ee mirov dikar\u00ea wer\u00eane
  ser ziman. Rejima tirk \u00fb rejim\u00ean \u00ean ku pirsgir\u00eaka wan ya kurd
  heya, di komkujiy\u00ean kurdan \u00ean ku kirina de, r\u00eabaza \u00eenkar\u00ea
  pirr z\u00eade bikarhan\u00eena. P\u00ea\u015f\u00ee komkuji kirina \u00fb pi\u015ftre
  gotina \\\"me, ne kir\u00eeya\\\" \u00fb hwd. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de, dema ku mirov bi awayek\u00ee rast, bi d\u00eeroka civate kurd re v\u00ea d\u00eeroka
  komkujiyan hilde li dest, mirov w\u00ea rast\u00ee rew\u015feka teybet\u00ee bi
  v\u00ee reng\u00ee ya li ser bi navkirinan re were. Ev bi navkirin, w\u00ea weke
  mijaraka giring ya ser n\u00fbx\u00fbmandin\u00ea ya komkujiy\u00ean kurdan bin.
  Bo v\u00ea yek\u00ea di ser\u00ee de div\u00ea ku mirov v\u00ea yek\u00ea bi teybet\u00ee
  hilde li dest.\\nDi komkujiya heleb\u00e7\u00ea de j\u00ee, em rast\u00ee w\u00ea
  rast\u00ee mijara binavkirin\u00ea a li ser komkujiya heleb\u00e7\u00ea re t\u00ean.
  Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea de t\u00eag\u00eena bi gotina \u00b4anfal\u00ea\u00b4
  re ku dih\u00ea afirandin, weke aliyek\u00ee giring ku hem li ser komkujiy\u00ea
  di mejiyan de din\u00fbx\u00fbm\u00eane \u00fb hem j\u00ee ji aliy\u00ea deroniy\u00ea
  \u00fb hwd ve j\u00ee, mijar\u00ea dike b\u00eer\u00eeneka civat\u00ee di nava civate
  kurd de. Em di v\u00ea \u00e7er\u00e7ovey\u00ea de her wusa div\u00ea ku v\u00ea
  aliy\u00ea komkujiya heleb\u00e7\u00ea, ba\u015f fahm bikin. Ev aliy\u00ea komkujiya
  heleb\u00e7\u00ea, w\u00ea di derbar\u00ea komkujiy\u00ean din \u00ean kurdan \u00fb
  her wusa li ser bi navkirina wan re de ku \u00e7awa hewl hat\u00eeya day\u00een
  ser wan were n\u00fbx\u00fbmandin \u00fb ank\u00fb hat\u00eeya n\u00fbx\u00fbmandin,
  w\u00ea biawayek\u00ee vekir\u00ee were d\u00eetin. Ji v\u00ea yek\u00ea, dema ku
  mirov li ser bi navkirin\u00ea re l\u00ea dihizirin, her wusa mirov rast\u00ee rew\u015feka
  teybet ya komkujiy\u00ea t\u00ea. Li vir, ez div\u00ea ku v\u00ea yek\u00ea j\u00ee
  wer\u00eanima ser ziman ku \u00e7end\u00ee ku kurd di mejiy\u00ea xwe de li gotina
  \\\"Enfal kirina kurdan\\\" wateyeka c\u00fbda j\u00ee l\u00ea bikin j\u00ee, l\u00ea
  ev wate, w\u00ea wateya di mejiy\u00ea gi\u015ft\u00eeya civat\u00ean derv\u00ee
  wan de nad\u00ea g\u00fbharandin. Her wusa, vaj\u00ee, w\u00ea, ew watekirina derv\u00ee
  wan, w\u00ea \u00ead\u00ee w\u00ea biwatekirina kurdan a di mejiy\u00ea wan de w\u00ea
  vala j\u00ee derbixe. Ev j\u00ee, \u00ead\u00ee w\u00ea b\u00ea sebeb\u00ea ku kurd,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de bikevina deroniyeka h\u00ea xiratir de di
  rew\u015fa w\u00ea komkujiy\u00ea de. Ya ku em dib\u00eenin j\u00ee, di asl\u00ea
  xwe de ji v\u00ea rast\u00eey\u00ea ne c\u00fbdatira. Her wusa, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov wer\u00eane ser ziman ku rast\u00eeya komkujiya heleb\u00e7\u00ea,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de ji gelek aliyan ve, dema ku gotina \u00b4anfal\u00ea\u00b4
  bixwe j\u00ee dih\u00ea bikarhan\u00een, gelek aliy\u00ean w\u00ea \u00ean dijwar
  di mejiyan de ser din\u00fbx\u00fbm\u00eane \u00fb dide v\u00ea\u015fartin Nah\u00eale
  ku mej\u00ee, w\u00ea rast\u00eey\u00ea bi temem\u00ee bib\u00een\u00ea. Di v\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov v\u00ea yek\u00ea j\u00ee, her wusa
  bi teybet\u00ee binxat bikin \u00fb wer\u00eanina ser ziman. Gotina komkujiy\u00ea,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de di bin perdeya \u00b4anfal\u00ea\u00b4 de
  hat\u00ee ser n\u00fbx\u00fbmandin \u00fb v\u00ea\u015fartin a. Yan\u00ee ser w\u00ea
  hat\u00eeya perdekirin \u00fb girtin. Em dema ku di v\u00ea \u00e7er\u00e7ovey\u00ea
  de li komkujiy\u00ea dihizirin, her wusa di v\u00ea \u00e7er\u00e7ovey\u00ea de
  mirov v\u00ea rastiy\u00ea ba\u015ftir dib\u00een\u00ea. Heta roja me j\u00ee, r\u00eaxistin\u00ean
  tundrew \u00ean weke Fethullah\u00e7\u00eeyan ku ji welat\u00ean afr\u00eeqa \u00fb
  hwd ku mirov berhevkirina \u00fb tevl\u00ee DA\u00ce\u015e\u00b4 \u00fb hwd kirina
  ku bi bi kurdan re \u015fer bikin, hinek\u00ee j\u00ee li ser v\u00ea rew\u015f\u00ea
  re pirr z\u00eade karkirina Div\u00ea ku mirov v\u00ea rast\u00eey\u00ea j\u00ee
  ba\u015f fahmbike. Di roja me de, dema ku em li rew\u015fa bi navkirin\u00ea dinerin,
  div\u00ea \u00e7er\u00e7ovey\u00ea de weke rew\u015fa w\u00ea \\\"helal\\\"kirina
  qatla kurdan, mirov rew\u015fek\u00ea bi w\u00ea re dib\u00een\u00ea. ..\\nLi vir,
  li dij\u00ee nirx\u00ean mirovatiy\u00ea bi awayek\u00ee pirr sins\u00ee \u00fb
  xay\u00eennana di v\u00ea \u00e7er\u00e7ovey\u00ea de li ser navan re komkuji li
  ser wan hat\u00eeya n\u00fbx\u00fbmandin. Di v\u00ea \u00e7er\u00e7ovey\u00ea de
  div\u00ea ku mirov di mijara komkujiy\u00ean ku hatina han\u00een li ser civate
  kurd de binavkirin\u00ea, weke aliyek\u00ee pirr z\u00eade giring hildina li dest
  \u00fb wer\u00eanina ser zman. Ev, w\u00ea me bi xwe re bigih\u00eane pirr rast\u00eey\u00ean
  w\u00ea komkujiy\u00ea \u00ean li pi\u015ft perdey\u00ea. Di v\u00ea \u00e7er\u00e7ovey\u00ea
  de div\u00ea ku mirov rast\u00eey\u00ea pirr z\u00eade li w\u00ea bihizir\u00ea.\\nWeke
  ku \u00e7awa ku di hem\u00fb komkujiy\u00ean kurdan de em dib\u00eenin, binavkirin
  dih\u00ea bikarhan\u00een weke awayek\u00ee sern\u00fbx\u00fbmandin\u00ea, em di
  komkujiya heleb\u00e7\u00ea de j\u00ee, v\u00ea rew\u015f\u00ea bi awayek\u00ee
  vekir\u00ee pirr z\u00eade dib\u00eenin. Di v\u00ea \u00e7er\u00e7ovey\u00ea de
  ya, ku dema ku bahse komkujiya heleb\u00e7\u00ea, dih\u00ea kirin ku gelek meley\u00ean
  bawer\u00eeya \u00eeslam\u00ea b\u00eabertek dim\u00eanin, hinek\u00ee j\u00ee div\u00ea
  ku mirov ji v\u00ea gotina \u00b4anfal\u00ea\u00b4\u00ea ku weke nav\u00ea w\u00ea
  dih\u00ea bikarhan\u00een d\u00fbr \u015f\u00eerove nek\u00ea. Her wusa di v\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov rast\u00eey\u00ea bi hevd\u00fb re
  hilde li dest. Ew \u00e7er\u00e7oveya ol\u00ee ku di komkujiya heleb\u00e7\u00ea
  \u00fb kirina w\u00ea de hat\u00eeya bikarhan\u00een, di mejiy\u00ea mirovan de
  p\u00ea\u015f\u00eeya d\u00eetina rast\u00eeya w\u00ea dide girtin. Her wusa, mejiy\u00ea
  yek\u00ee misilman, li ser w\u00ea gotin\u00ea \u00fb \u00e7er\u00e7oveya ol\u00ee
  re nikar\u00ea h\u00ee\u00e7 w\u00ea rast\u00eeya komkujiya heleb\u00e7\u00ea bib\u00een\u00ea.
  Bi awa \u00fb reng\u00ea ku dib\u00een\u00ea j\u00ee, di \u00e7er\u00e7oveya \\\"dij-ol\\\"
  de dib\u00een\u00ea. Heta ku di v\u00ea \u00e7er\u00e7ovey\u00ea de dikar\u00ea
  di mejiy\u00ea xwe de li ser w\u00ea \u00e7er\u00e7oveya ol\u00ee re w\u00ea kirina
  komkujiya heleb\u00e7\u00ea \\\"rast\\\" j\u00ee bib\u00een\u00ea \u00fb \\\"rast
  bide n\u00ee\u015fandin.\\\" Her wusa, div\u00ea ku mirov v\u00ea yek\u00ea j\u00ee,
  binxat bike \u00fb wer\u00eane ser ziman. Mejiyek\u00ee ku dikar\u00ea de li ser
  w\u00ea \u00e7er\u00e7oveya ol\u00ee re w\u00ea kirina komkujiya heleb\u00e7\u00ea
  \\\"rast\\\" j\u00ee bib\u00een\u00ea \u00fb \\\"rast bide n\u00ee\u015fandin.\\\",
  ew meji, w\u00ea ti car\u00ee nikarib\u00ea rast\u00eeya komkujiya heleb\u00e7\u00ea
  bib\u00een\u00ea \u00fb bide n\u00ee\u015fandin. Ji ber ku di v\u00ea \u00e7er\u00e7ovey\u00ea
  de bi w\u00ea \u00e7er\u00e7oveya ku ew diner\u00ea de, ew komkuji hat\u00eeya kirin.\\nEz
  bixwe j\u00ee b\u00fbma \u015fahid\u00ea w\u00ea rastiy\u00ea ku gelek kurd, dema
  ku berfetaka xwe li ser komkujiya heleb\u00e7\u00ea t\u00eanin ser ziman \u00fb
  w\u00ea kirina komkujiy\u00ea \u00b4\u015fermazar dikin, weke gazinek\u00ea ji dil\u00ea
  xwe dih\u00eanina ser ziman \u00fb dib\u00eajim ku \\\"ne, em j\u00ee misilaman
  in, ji ber \u00e7i welat\u00ean misilman li hember\u00ea komkujiy\u00ean ku t\u00ean
  ser\u00ea kurdan b\u00eadeng dim\u00eanin.\\\" Temen\u00ea v\u00ea b\u00eadeng\u00eeya
  ku bi v\u00ea gotin\u00ea re bi nav\u00ea cihan \u00eeslam\u00ea re dih\u00ea ser
  ziman, div\u00ea ku mirov di v\u00ea \u00e7er\u00e7ovey\u00ea de wer\u00eane ser
  ziman. Heta ku gelek oldar\u00ean kurd bixwe j\u00ee, li hember\u00ea w\u00ea komkujiya
  ku hat\u00eeya ser\u00ea civate xwe b\u00eadeng mana. Ev j\u00ee, weke h\u00fbrgilek\u00ea
  div\u00ea ku mirov bin w\u00ea xatbike \u00fb wer\u00eane ser ziman.\\nDi v\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov w\u00ea rast\u00eeya b\u00eadeng\u00ee
  \u00fb b\u00eabertek may\u00eena cihan \u00eeslam\u00ea a li hember\u00ea komkujiy\u00ean
  kurdan, ji aliyek\u00ee ve ji v\u00ea aliy\u00ea ve wer\u00eane ser ziman. Aliy\u00ea
  duyemin j\u00ee, bi welat\u00ean ku w\u00ea komkujiy\u00ea dikin ku weke \\\"misilman\\\"
  didina n\u00ee\u015fandin a. Aliy\u00ea s\u00eayemin j\u00ee, ew a ku w\u00ea rast\u00eey\u00ea
  di v\u00ea \u00e7er\u00e7ovey\u00ea de nab\u00eenin. Bi \u00e7av\u00ean xwe y\u00ean
  ku li d\u00fbny\u00ea dinerin weke kor\u00ean ku nab\u00eenin in. Her wusa di v\u00ea
  \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov w\u00ea rast\u00eeya wan wer\u00eane
  ser ziman. \u00ce ro, dema ku em ji v\u00ea aliy\u00ea ve li komkujiya kurdan dihizirin,
  em dib\u00eenin ku li ser nav \u00fb bi navkirin\u00ea re rew\u015feka \u00e7awaa
  hat\u00eeya afirandin. Her wusa, band\u00fbra bi navkirin\u00ea, mirov bi v\u00ea
  rew\u015f\u00ea re dib\u00een\u00ea ku \u00e7end\u00ee di mejiyan de ji aliy deron\u00ee
  \u00fb her wusa ned\u00eetin\u00ea ve heya.\\nKomkujiya heleb\u00e7\u00ea, di v\u00ea
  \u00e7er\u00e7ovey\u00ea de dema ku bahse w\u00ea dih\u00ea kirin, ew n\u00eaz\u00eekat\u00eeya
  kurdan a bi gazin ya bi reng\u00ea, \u00e7ima cihana \u00eeslam\u00ea li ber w\u00ea
  kirina komkujiya heleb\u00e7\u00ea \\\"b\u00eadeng\\\" dim\u00eane \u00fb hwd j\u00ee,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de rast\u00eeya w\u00ea hinek\u00ee dih\u00ea
  d\u00eetin. H\u00eaz\u00ean ku ew komkuji kirina, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de li v\u00ea rew\u015f\u00ea \u00fb reng\u00ea fahmkirin\u00ea \u00fb hwd j\u00ee
  hizir\u00eena \u00fb pi\u015ftre bidest komkujiy\u00ea kirina. W\u00ea \u00e7awa
  kirina komkujiy\u00ea, bi rengek\u00ea ku karibin, wan t\u00eag\u00een \u00fb xoslet\u00ean
  ol\u00ee \u00ean weke bi nav\u00ea \\\"fetwa\\\"y\u00ea \u00fb hwd bikarb\u00eanin
  \u00fb hwd, li w\u00ea j\u00ee pirr z\u00eade \u00fb ba\u015f hizir\u00eena. Bi
  xw\u00fbna xwe niv\u00eesandina kuran\u00b4\u00ea a ji aliy\u00ea Saddam ve, r\u00eabazaka
  bi v\u00ee reng\u00ee ya li dij\u00ee nirx\u00ean mirovatiy\u00ea ya s\u00eens\u00ee
  \u00fb xay\u00eenana ya. Ev rew\u015f \u00fb r\u00eabaz hem\u00fb, dema ku pi\u015ft\u00ee
  komkujiya heleb\u00e7\u00ea bi 27 salan di sala 2014 \u00fb 2015\u00b4an de ku komkujiy\u00ean
  mazin \u00ean weke komkujiya \u015fengal\u00ea \u00fb komkujiya koban\u00ea hatina
  han\u00een li ser\u00ea civate kurd, d\u00eesa ev r\u00ea \u00fb r\u00eabaz\u00ean
  s\u00eens\u00ee \u00fb xay\u00eenana \u00ean li dij\u00ee nirx\u00ean mirovatiy\u00ea
  hatina bikarhan\u00een. Her wusa, ten\u00ea, weke kom\u00ean tundrew n\u00ee\u015fandana
  DA\u00ce\u015e\u00b4\u00eeyan bixwe j\u00ee, di v\u00ea \u00e7er\u00e7ovey\u00ea
  de weke sern\u00fbx\u00fbmandinak\u00ea ya. Ev mirov\u00ean ku qatil in \u00fb ti
  eleqeya wan bi ol\u00ea \u00fb nirx\u00ean ol\u00ea re t\u00fbna ya, bi nav\u00ea
  ol\u00ea han\u00eena wan li ser ziman, weke ku \u00e7awa ku du komkujiy\u00ean kurdan
  de bi navkirin weke sern\u00fbx\u00fbmandinek\u00ea dih\u00ea bikarhan\u00een, biheman
  reng\u00ee ew gotina tundrew\u00eey\u00ea j\u00ee bo wan \u00fb kiryar\u00ean wan
  \u00ean qir\u00eaj \u00fb komkujiy\u00ean ku ew dikin, dib\u00ea sern\u00fbx\u00fbmandinek
  mazin ya d\u00eerok\u00ee.\\nEv r\u00eabaza sern\u00fbx\u00fbmandin\u00ea a bi \\\"binavkirin\u00ea\\\"
  div\u00ea ku mirov hinek\u00ee din j\u00ee li ser w\u00ea bisekin\u00ea. Ji ber
  ku ev di welat\u00ean cihane \u00eeslam\u00ea de ev r\u00eabaz pirr z\u00eade hat\u00eeya
  bikarhan\u00een \u00fb di bin w\u00ea bi navkirin\u00ea de bi sedan komkujiy\u00ean
  ku hatina kirin v\u00ea\u015far\u00ee na. Rejim\u00ean ku weke misilman bi nav dikin,
  ew komkuji kirina. L\u00ea ew komkujiy\u00ean xwe bi w\u00ea reng\u00ea bi navkirin\u00ea,
  kirina mal\u00ea w\u00ea cihan\u00ea \u00eeslam\u00ea gi\u015ft\u00ee j\u00ee. Her
  wusa, her \u00e7ar dewlet\u00ean weke \u00eeran, s\u00fbr\u00ee, tirkiya \u00fb
  \u00eeraq ku pirsgir\u00eaka wan ya kurd heya \u00fb weke \u00b4dewlet\u00ean misilman\u00b4
  dih\u00ea bi navkirin, hertim\u00ee komkujiy\u00ean ku han\u00eena ser\u00ea kurdan,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de di \u00e7er\u00e7oveya bi navkirin\u00ea
  de sern\u00fbx\u00fbmandina.\\nEz dema ku li v\u00ea bi navkirina weke \u00b4anfal\u00ea\u00b4
  ya li komkujiya heleb\u00e7\u00ea dihizirim, ku ez di mejiy\u00ea xwe de di\u00e7ina
  100 \u00fb ank\u00fb 200 sal ber\u00ea \u00ee ro \u00fb roja me, ji w\u00ea roj\u00ea
  weke mirovek\u00ee ku bawer\u00eey\u00ea bi w\u00ea pirt\u00fbka ku ew gotina anfal\u00ea
  ji w\u00ea ya ku li w\u00ea rew\u015fa komkujiya heleb\u00e7\u00ea dihizirim, di
  w\u00ea \u00e7er\u00e7ovey\u00ea de d\u00eemen\u00ea ku dih\u00ea li ber\u00e7av\u00ea
  min, ew a ku ew komkuji weke komkujiyeka ku hat\u00eeya ser\u00ea hinek mirov\u00ean
  ku h\u00ear\u00ee\u015f\u00ee nirx\u00ean ol\u00ee kirina \u00fb ank\u00fb weke
  komkujiyeka ku hat\u00eeya ser\u00ea hinek mirov\u00ean ku ne misilman in ku hat\u00eeya
  kirin a. Di v\u00ea \u00e7er\u00e7ovey\u00ea de di destp\u00eak\u00ea de d\u00eemen\u00ea
  w\u00ea komkujiy\u00ea di bin w\u00ea gotina \u00b4anfal\u00ea\u00b4 de dih\u00ea
  v\u00ea\u015fartin. Bi heman reng\u00ee li oparasyona komkujiya rejima tirk a li
  zindanan ku nav\u00ea \\\"wergera li j\u00eeyan\u00ea\\\" l\u00ea kir\u00eeya, ku
  mirov li w\u00ea dihizir\u00ea, her wusa bi heman reng\u00ee mirov rast\u00ee d\u00eemenek\u00ee
  t\u00ea ku weke ku ew raaydar\u00ean v\u00ea dem\u00ea \u00ean ku ew oparasyona
  komkujiy\u00ea kirina, weke ku dixwezin \\\"j\u00eeyane hinek mirovna xilas bikin\\\"
  dih\u00ea li ber\u00e7av\u00ea me. L\u00ea ev herd\u00fb d\u00eemen j\u00ee ne rast
  in. Her wusa ev herd\u00fb d\u00eemen j\u00ee, di w\u00ea \u00e7er\u00e7ovey\u00ea
  de ser rastiy\u00ea din\u00fbx\u00fbm\u00eanin.\\nHeman rew\u015f\u00ea, mirov bi
  komkujiya heleb\u00e7\u00ea re dib\u00een\u00ea. Her wusa komkujiya heleb\u00e7\u00ea,
  di v\u00ea \u00e7er\u00e7ovey\u00ea de div\u00ea ku mirov wer\u00eane ser ziman
  ku komkujiya heleb\u00e7\u00ea, weke komkujiyaka ku \u00e7er\u00e7oveya sern\u00fbx\u00fbmandina
  w\u00ea ya li dem\u00ean p\u00ea\u015faroj\u00ea j\u00ee bi gotin\u00ean ol\u00ea
  li w\u00ea hat\u00eeya hizir\u00een a. Ev mirov\u00ean ku di v\u00ea temen\u00ea
  de hizir\u00eena, wilqas\u00ee ne mirovna biaqil in. L\u00ea ji ber ku ber\u00ea
  gotinan bi ber p\u00ea\u015f\u00eeya wan de ya \u00e7end\u00ee ku di j\u00eeyan\u00ea
  de bin, ji w\u00ea rew\u015fa gotinan ev feyz hat\u00eeya girtin \u00fb ew hatina
  bikarhan\u00een. Yan\u00ee, bi gotinaka din, rew\u015feka bi d\u00eemen\u00ee li
  ser gotinan re di v\u00ea \u00e7er\u00e7ovey\u00ea de bi awayek\u00ee xweza derket\u00eeya
  li hol\u00ea.\\nEv niv\u00ees ji be\u015fa navaroka pirt\u00fbk\u00ea ya bi nav\u00ea
  \\\"\u00e7er\u00e7oveya navnetew\u00ee a h\u00eem\u00ee ya komkujiya Heleb\u00e7\u00ea\\\"
  hat\u00eeya hildan.\\nAbdusamet Yigit\"", "\"speh\u00ee\\nNaverok\\nGotin[biguher\u00eene]\\n-
  spe\u1e27\u00ee\\nWate[biguher\u00eene]\\n- delal, bedew, ciwan, rind, xwe\u015fik,
  \u015fir\u00een,\\nkesa/\u00ea yan ti\u015fta/\u00ea r\u00fb yan bejna w\u00ea /
