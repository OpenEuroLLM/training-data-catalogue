  an j\u00ee j\u00ee ve\u015f\u00eare, an j\u00ee ew \u00ea encama w\u00ea encam bimirin.\\nVerson
  4 \u00fb 5 bi \u015fahidiya devil\u00ea \u00cebl\u00ees, \u00fb ceribandina w\u00ee
  ji Xwed\u00ea re digerin ku hewcey\u00ea xwe wek\u00ee Xwed\u00ea be: \\\"Tu h\u00fbn
