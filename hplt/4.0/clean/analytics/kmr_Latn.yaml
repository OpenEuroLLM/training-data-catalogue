  \u00fb xezeba serdestan ji v\u00ea kula dil\u00ea wan e.\\n0 \u015f\u00eerove:\\nPost
  a Comment\"", "\"Hrant\\nArjen Ar\u00ee\\nHrant\u00ea ku 15 \u00ea rezbera 1954\u2019an
  de li Melet\u00ee t\u00ea dinyay\u00ea h\u00ea 5 sal\u00ee ye tev\u00ee malbata
  xwe ko\u00e7\u00ee Stenbol\u00ea dibe. Di dibistan\u00ean Ermeniy\u00ean Protestan
  de ya seretay\u00ee, navend\u00ee \u00fb amadekariy\u00ea kuta dike \u00fb li heman
  bajar\u00ee Zankoya \u00celm\u00ea Fen\u00ee be\u00fea Zooloj\u00ee \u00fb Felsefey\u00ea
  diqed\u00eene.\\nDi v\u00ea navber\u00ea de bi hevsera xwe Rakel\u00ea re -ku ew
  j\u00ee tuxm\u00ea v\u00ea ax\u00ea ye, jidayikb\u00fbna w\u00ea Silop\u00ee, Girg\u00ea
  Ma\u2019hmo ye- dizewice, \u00fb ji bo ku cemaeta ermen\u00ee ji tevger\u00ean w\u00ee
  y\u00ean siyas\u00ee xisar\u00ea neb\u00eene, bi biryara dadgeh\u00ea nav\u00ea
  xwe y\u00ea Hirant diguher\u00eene, dike Firat!\\nHrant di sal\u00ean 90\u2019\u00ee
  de di rojnameya rojane ya bi nav\u00ea Marmara de, bi navek\u00ee Remz\u00ee \u00c7utak:
  Keman\u00e7e di derbar\u00ea pirt\u00fbk\u00ean ku li Tirkiyey\u00ea li ser D\u00eeroka
  Ermeniyan \u00e7apb\u00fby\u00ee, niv\u00ees\u00ean rexney\u00ee diwe\u00fe\u00eene.\\nRojnameya
  heftey\u00ee Agos wek\u00ee rojnameyeke duziman\u00ee; bi tirk\u00ee \u00fb ermenk\u00ee
  di avr\u00eala 1996\u2019an de dest bi we\u00fean\u00ea dike \u00fb ev rojname wek\u00ee
  rojnameya ewil/yekem\u00een ya bi ziman\u00ea tirk\u00ee \u00fb ermenk\u00ee, dikeve
  nava d\u00eeroka we\u00feana rojnamegeriya Tirkiyey\u00ea.\\nWateya Agos cih\u00ea
  ku g\u00eesin vedike, cih\u00ea ku tuxm/tov dikeviy\u00ea, cih\u00ea ku bereket
  j\u00ea dipijiqe ye.\\nRast e; ev ax bi adan e.\\nDi navbera du bor\u00ean ku b\u00eawastan
  diherikin \u00fb ber\u00ea xwe didin behr \u00fb beriy\u00ean d\u00fbr de ev milk,
  ev ax, ev erdn\u00eegar\u00ee ji qetebejahiy\u00ean li ser zem\u00een\u00ea, par\u00e7ey\u00ea
  her\u00ee bi av, y\u00ea her\u00ee bi roj, y\u00ea her\u00ee bi adan e.\\nW\u00ee
  milk\u00ee t\u00eara k\u00ea nedikir, ku li ser ew qas xw\u00een hat herikandin,
  ew qas \u00ea\u00fe \u00fb kul p\u00ea dan ki\u00feandin?\\nV\u00ea ax\u00ea, v\u00ee
  milk\u00ee bi qas\u00ee ku ji binev\u00fe\u00ea hez kir \u00fb gihand, bi qas\u00ee
  ku genim heband \u00fb kir ku libek di simbil de bibe b\u00eest lib, sih lib \u00fb
  li ser sifreya me dan\u00ee; ji pirdengiy\u00ea pirengiy\u00ea, ji mirovatiya b\u00ea
  hed \u00fb s\u00eenor j\u00ee hez kir; \u00fb negot ev kurd e, ev ermen\u00ee ye,
  ev as\u00fbr\u00ee ye; tev hemb\u00eaz kirin!\\nGelek h\u00eajayiy\u00ean me ketin
  bin v\u00ea axa sar!\\nEm j\u00ea hatib\u00fbn\u2026Em bi ku ve \u00e7\u00fbn, d\u00eesa
  em l\u00ea vedigeriyan.\\nH\u00eal\u00eena me b\u00fb, war\u00ea bav \u00fb kal\u00ean
  me; ji kal\u00ea kal\u00ea m\u00ea \u00dbtnap\u00ee\u00fet\u00eem ve.\\nH\u00ea
  doh, h\u00ea n\u00fb mirina b\u00eabext yek\u00ee ji me ji ber p\u00eas\u00eer\u00ean
  jiyan\u00ea girt \u00fb me bi dest\u00ea xwe ew sipart b\u00eaxt\u00ea w\u00ea y\u00ea
  bext\u00eawar!\\n\u00cero em \u00ean li vir civiyay\u00ee bi boneya yekem\u00een
  salvegera ku\u00fetina Hrant\u00ea Ermen\u00ee; l\u00ea ev \u00e7end kurd, ew qas\u00ee
  tirk\u2026l\u00ea dawiya daw\u00ee mirov, li hev civiya ne.\\nEz ser\u00ea xwe bi
  siyanet li ber b\u00eeran\u00eena w\u00ee \u00fb hem\u00fb mirov\u00ean ku li ser
  r\u00eaya azadiy\u00ea, wekheviy\u00ea \u00fb jiyaneke serefraz t\u00eako\u00feiyane
  \u00fb di v\u00ea r\u00eay\u00ea bi \u00ea\u00fe \u00fb azar de can\u00ea xwe dane,
  di\u00e7im\u00eenim.\\nEv\u00ean ku ser\u00ee ne\u00e7imandin li ber zilm\u00ea,
  li ber mirin\u00ea d\u00ea her hebin li ser van axan!\\nJi ber ku ev ax, m\u00ear
  e, berxwed\u00ear e, serhild\u00ear e!\\nBi silav\u00ean her\u00ee bi r\u00eaz \u00fb
  bi hez\u2026\\n\u00de\u00eava b\u00eeran\u00eena Hirant D\u00eenk/2008/Amed\"",
  "\"Li dij\u00ee komploy\u00ea berxwedana d\u00eerok\u00ee (2)\\n- Dosya\\nYekem\u00een
  gava xistina jiyan\u00ea ya BOP\u2019\u00ea\\nNAVENDA N\u00db\u00c7EYAN - R\u00eaber\u00ea
  PKK\u2019\u00ea Abdullah Ocalan ku komploya 9\u2019\u00ea Cotmeha 1998\u2019an \u00fb
  p\u00eavajoya pi\u015ft\u00ee w\u00ea dinirx\u00eene \u00fb diyar kir ku p\u00eavajoya
  ji S\u00fbriyey\u00ea derxistin \u00fb an\u00eena Tirkiyey\u00ea operasyonek NATO-Gladyoy\u00ea
  ye \u00fb ev destp\u00eaka p\u00eakhan\u00eena BOP\u2019\u00ea ye.\\nNirxandin\u00ean
  R\u00eaber\u00ea PKK\u2019\u00ea Abdullah Ocalan y\u00ean der bar\u00ea ji S\u00fbriyey\u00ea
  derketin \u00fb pi\u015ft\u00ee v\u00ea bi komploya navnetewey\u00ee radest\u00ea
  Tirkiyey\u00ea kirin rojev\u00eeb\u00fbna xwe dipar\u00eaze. Di v\u00ea dosya xwe
  de em \u00ea cih bidin nirxandin\u00ean Abdullah Ocalan y\u00ean der bar\u00ea komploya
  navnetewey\u00ee.\\nOperasyona NATO-Glad\u00eeo\\nAbdullah Ocalan pi\u015ft\u00ee
  an\u00een Tirkiyey\u00ea berhem\u00ean xwe di bin nav\u00ea \u2018Ji Komara Sumer
  Rah\u00eep ber bi Komara Gel\u2019 kir pirt\u00fbk \u00fb komploy\u00ea j\u00ee
  bi p\u00eavajoya ku ji S\u00fbriyey\u00ea derketiye digirie dest. Abdullah Ocalan
  diyar dike ku ji S\u00fbriyey\u00ea derketin operasyona NATO-Gladyoy\u00ea ye \u00fb
  diyar dike ku jihev veqet\u00eena ar\u00ea\u015f\u00ea ya li Tirkiyey\u00ea \u00fb
  Gladiyo ney\u00ea nirxandin ev nikare rast b\u00ea nirxandin. Abdullah Ocalan wiha
  dib\u00eaje: \u201cFermandar\u00ean gi\u015ft\u00ee. Hakki Karadayi \u00fb Husey\u00een
  Kivrikoglu pir j\u00ee ne serdest\u00ea her ti\u015ft\u00ee b\u00fb. N\u00eaz\u00ee
  n\u00eaz\u00eekatiya E\u015fref B\u00eetl\u00eest b\u00fbn. Tasfiyekirina Kurdan
  hem rast did\u00eetin hem j\u00ee ne p\u00eakan did\u00eetin. Turgut Ozal \u00fb
  E\u015fref B\u00eetl\u00ees p\u00eavajoya a\u015ftiy\u00ea hem wek welatpar\u00eaz\u00ee
  hem j\u00ee li gor\u00ee feraseta \u015fer\u00ea klas\u00eek did\u00eetin. Sakip
  Sabanci di TUS\u00ceAD\u2019\u00ea de ev xet tems\u00eel dikir. Bask\u00ea gladyoy\u00ea
  Dogan Gure\u015f \u00fb \u00c7ev\u00eek B\u00eer tems\u00eel dikirin. Hewldana suikasta
  li hember Sakip Sabanci \u00fb Husey\u00een Kivrikoglu vana kirib\u00fbn. Di 1990\u2019\u00ee
  de dora fermandariya gi\u015ft\u00ee hatib\u00fb Muh\u00eett\u00een F\u00eesunoglu.
  L\u00ea Dogan Gure\u015f an\u00een peywir\u00ea. Di nav art\u00ea\u015f\u00ea de
  bi du le\u015fker\u00ean sempat\u00eezan\u00ean PKK\u2019\u00ea re li hember Dogan
  Gure\u015f suikasta bi \u00e7aya \u015fehr\u00ee p\u00eakhat. L\u00ea ev hewldan
  bi ser neket. Nav art\u00ea\u015f\u00ea de heta ser\u00ea sedasla 20\u2019\u00ee
  dewam kir. Ewil Almanyay\u00ea pi\u015ftre \u00ceng\u00eel\u00eestan \u00fb DYA\u2019y\u00ea
  ev pev\u00e7\u00fbn ewil ji derve kontrol dikirin \u00fb pi\u015ftgir\u00ee didan\u00ea.
  Ev b\u00fbyer\u00ean komplo \u00fb su\u00eekast\u00ea bandora \u015fer\u00ea hegemonya
  li hember gel\u00ean Rojhilata Nav\u00een \u00fb Mezopotamyay\u00ea b\u00fb. H\u00eaz\u00ean
  kap\u00eetal\u00eest \u015fer\u00ea hegemon\u00eek li gor\u00ee fa\u015f\u00eezma
  Tirk a Sp\u00ee dime\u015fand. Ji M. Kemal heta niha di art\u00ea\u015f\u00ea de
  aliyek\u00ee ji v\u00ea nerehet dibe heye. Ev welatpar\u00eaz \u00fb Anatoliy\u00ee
  b\u00fbn. Li pi\u015ft darbekar \u00fb komplogeran Gladyoya NATO heb\u00fb.\\nMin
  nikarib\u00fb xilasb\u00fbna xwe esas bigirta\\nBeriya ji S\u00fbriyey\u00ea derkevim
  di nav van her du aliyan de rekabet heb\u00fb. Bi pi\u015ftgiriya Isra\u00eel \u00fb
  DYA\u2019y\u00ea, bask\u00ea NATO Gladiyo ev p\u00eak hat. \u00cest\u00eexbara Isra\u00eel\u00ea
  bi israr got ji S\u00fbriyey\u00ea derkeve. Min veqet\u00een di cih de ned\u00eet.
  Min got w\u00ea cih\u00ea me y\u00ea li S\u00fbriyey\u00ea darbeyek mezin bigire.
  Min ev di al\u00ee \u00eedeoloj\u00eek \u00fb stratej\u00eek de rast nedid\u00eet.
  Div\u00ea dirust b\u00fbma, min nikarib\u00fb xilasb\u00fbna xwe esas bigirta. At\u00eela
  Ate\u015f li ser nav\u00ea NATO-Gladyoy\u00ea hi\u015fyariya daw\u00ee kir l\u00ea
  ser S\u00fbriye \u00fb R\u00fbsyay\u00ea bi biryar li pi\u015ft me b\u00fbna \u015fans\u00ea
  me y\u00ea em \u015fer bibin asteke din heb\u00fb. L\u00ea ev pi\u015ftgir\u00ee
  nehat day\u00een \u00fb h\u00eaz \u00fb niyeta van her du welatan a heb\u00fbna
  min ji hol\u00ea rakin tuneb\u00fb. Ji bo S\u00fbriyey\u00ea ev ne p\u00eakan b\u00fb.
  Ev nedan ber \u00e7avan.\\nHelwesta R\u00fbsyay\u00ea b\u00ear\u00fbmet b\u00fb\\nHelwesta
  R\u00fbsyay\u00ea b\u00ear\u00fbmet b\u00fb. Li dij\u00ee projeya Mav\u00ee Akim
  \u00fb krediya deh milyar dolar a IMF\u2019\u00ea em bi zor ji Moskov\u00ea derxistin.
  Heta em darbeya 28\u2019\u00ea Sibata 1997\u2019an ba\u015f f\u00eam nekin em nikarin
  ti\u015ft\u00ean hatine jiy\u00een ba\u015f f\u00eam bikin. Baskek\u00ee darbekaran
  bi p\u00ea\u015fniyarek a\u015ftiy\u00ea n\u00eaz\u00ee me bib\u00fb. Ez \u00eeqna
  bib\u00fbm. L\u00ea niha pir a\u015fkera derketiye hol\u00ea ku w\u00ea dem\u00ea
  yan\u00ee heta girtina min, Isra\u00eel \u00fb DYA ne li al\u00ee a\u015ft\u00ee
  \u00fb \u00e7areseriy\u00ea b\u00fbn. Ne\u00e7areseriya pirsgir\u00eaka Kurd \u00fb
  \u015fer bi israr dixwestin. Hewcedariya wan a xistina Iraq\u00ea heb\u00fb. Dixwestin
  Tirkiyey\u00ea pas\u00eef\u00eeze bikin \u00fb planan p\u00eak b\u00eenin. Derketina
  min a ji S\u00fbriyey\u00ea bi pi\u015ftgiriya DYA, \u00ceng\u00eel\u00eestan \u00fb
  Isra\u00eel\u00ea p\u00eak hatib\u00fb.\\nJi bo tasfiyekirina PKK\u2019\u00ea peyam!\\nDi
  sal\u00ean 1990\u2019\u00ee de pi\u015ftgiriya DYA \u00fb \u00ceng\u00eel\u00eestan\u00ea
  di 1996\u2019an de j\u00ee pi\u015ftgiriya Isra\u00eel\u00ea girtib\u00fb. Dor hatib\u00fb
  tasfiyekirina nav art\u00ea\u015f \u00fb guher\u00een\u00ean hik\u00fbmet\u00ea.
  Ji 90\u2019\u00ee \u015f\u00fbnde gav bi gav kirin jiyan\u00ea. Dogan Gure\u015f
  pi\u015ft\u00ee gera ewil a \u00ceng\u00eel\u00eestan\u00ea gort \u2018ji bo tasfiyekirina
  PKK\u2019\u00ea peyam hatiye day\u00een\u2019. Pi\u015ft\u00ee v\u00ea bi \u00ear\u00ee\u015f\u00ean
  \u00eemhay\u00ea s\u00eenor neman, gelek komkuj\u00ee, b\u00fbyer\u00ean bi xof
  \u00fb pev\u00e7\u00fbn hatin jiy\u00een. Ji ketina NATO\u2019y\u00ea heta 1998\u2019an
  di b\u00fbyer\u00ean hatine jiy\u00een \u00ean li Tirkiyey\u00ea de xeta NATO-Gladyo
  heye.\\nDu riy\u00ean gir\u00eeng li p\u00ea\u015f min heb\u00fbn\\nLi p\u00ea\u015f
  du r\u00ea heb\u00fbn. Yek ji van \u00e7iya b\u00fbn a din j\u00ee riya Ewropay\u00ea
  b\u00fb. L\u00ea v\u00ea h\u00eaviya \u00e7arseriy\u00ea kor dikir. Ber\u00ea xwe
  day\u00eena \u00e7iyan belk\u00ee di al\u00ee taktik tekn\u00eek de sererastkirin
  p\u00eak bianiya. L\u00ea \u00e7areser\u00ee bi guman b\u00fb. Min h\u00een b\u00eatir
  bi h\u00eaza xwe ya entelektuel bawer dikir \u00fb got div\u00ea ez rola xwe ya
  d\u00eerok\u00ee wisa bil\u00eezim \u00fb min \u00e7avkaniya \u00eelham\u00ea dihewand.
  Li \u015f\u00fbna bi rijandina xw\u00een\u00ea \u00e7areserkirina pirsgir\u00eak\u00ea
  min xwes wisa bibim bersiv. Ev \u00e7\u00fby\u00een \u00fb hatina min navbera van
  her du aliyan de b\u00fb. L\u00eager\u00eena ji ser Ewropay\u00ea dihat ferzkirin.
  Ez bib\u00fbm du par\u00e7e. Di encam\u00ea de ji ser At\u00eenay\u00ea derfet dan
  min.\u201d\\nHelwesta tav\u00eezkar a Tirkiyey\u00ea\\nAbdullah Ocalan tav\u00eez\u00ean
  Tirkiyey\u00ea di p\u00eavajoya komploy\u00ea de dane wiha bi b\u00eer xist: \u201cTirkiye
  di v\u00ea mijar\u00ea de b\u00ea s\u00eenor tav\u00eezkar b\u00fb. Dema 9\u2019\u00ea
  Cotmeh\u00ea de balafira ez t\u00ea de b\u00fbm daket At\u00eenay\u00ea S\u00fbriyeyiyan
  rehet kirib\u00fbn. Dema daketim At\u00eenay\u00ea Kalender\u00eed\u00ees derket
  p\u00ea\u015fber\u00ee min. Serbazek\u00ee di NATO\u2019y\u00ea de pewyirdar b\u00fb.
  Heman peywir li Sw\u00ead\u00ea me\u015fandib\u00fb. Yan\u00ee \u00eeht\u00eemala
  di Gladyoya Yewnan de cih girtib\u00fb heb\u00fb. Pir dostane xuya dikir. Navbera
  me kuryeyek balk\u00ea\u015f heb\u00fb. Hinek belge dab\u00fb min. Dibe ku ji bo
  baweriy\u00ea bide qezenckirin ev kiribe. Ez birim cem \u015eef\u00ea \u00eest\u00eexbarat\u00ea
  Stavrakak\u00ees. Stavrakak\u00eest bi helwetek teqez got nikar\u00ee bi\u00e7\u00ee
  Yewnan\u00eestan\u00ea.\\nDost li hol\u00ea tuneb\u00fbn!\\nAbdullah Ocalan der
  bar\u00ea rew\u015fa li Yewnan\u00eestan\u00ea de diyar dike ku dost\u00ean ku p\u00ea
  re lihev kirib\u00fbn li hol\u00ea tuneb\u00fbn \u00fb rotaya xwe dane Moskovay\u00ea.\\nProjeya
  Mav\u00ee Akim\\nAbdullah Ocalan balki\u015fand ser hewldan\u00ean Tirkiyey\u00ea
  \u00fb li ser Projeya Mav\u00ee Akim a bi R\u00fbsyay\u00ea re sekin\u00ee \u00fb
  got: \u201cSerokwez\u00eer\u00ea dem\u00ee Mesut Yilmaz b\u00fb. Li ser Projeya
  Mav\u00ee Akim \u00fb deh milyar dolar krediya IMF\u2019\u00ea lihev kirib\u00fbn
  \u00fb bi v\u00ea lihevkirin ku ez ji R\u00fbsyay\u00ea derkevim. Min Moskova tercih
  kir. L\u00ea bi qas\u00ee At\u00eenay\u00ea li Moskov\u00ea j\u00ee em li dij\u00ee
  helwesta dostaniy\u00ea baweriya me \u015fikest. Derket hol\u00ea ku t\u00eakiliya
  dostaniyan baweriy\u00ea nade.\\nRota s\u00eayem\u00een\\nAbdullah Ocalan \u00e7\u00fby\u00eena
  \u00cetalyay\u00ea ku wek \u2018rota s\u00eayem\u00een\u2019 vedinas\u00ee wiha
  \u00eefade dikir: \u201cBi al\u00eekariya du parlamenter\u00ean dost maceraya Romay\u00ea
  dest p\u00ea kir. V\u00ea car\u00ea bi senaryoya \u00eest\u00eexbata \u00cetalyay\u00ea
  be\u015fek li nexwe\u015fxan\u00ea 66 roj seruvena Romay\u00ea dest p\u00ea kir.
  Helwesta serokwez\u00eer Massimo D\u2019Alema ba\u015f b\u00fb l\u00ea qels b\u00fb.
  Ewlehiya siyas\u00ee tam nedab\u00fb. Rew\u015fa me terk\u00ee daraz\u00ea kir.
  Ez h\u00ears bib\u00fbm. Min digot ez hema ji \u00cetalyay\u00ea derkevim. D\u2019Alema
  di daxuyaniya daw\u00ee de gotib\u00fb heta dikare bila li \u00cetalyay\u00ea bim\u00eene.
  L\u00ea ev wek helwestek bi zor\u00ea b\u00fb. Xwestin min bibin cihek\u00ee. Min
  qeb\u00fbl nekir. \u00c7\u00fby\u00eena min a R\u00fbsyay\u00ea ya duyem \u015fa\u015f\u00ee
  b\u00fb. Di vir de rola helwesta Numar U\u00e7ar heye. Min r\u00fby\u00ea w\u00ee
  y\u00ea rast bizanib\u00fbna ez nedi\u00e7\u00fbm Romay\u00ea. Dema bi balafira
  taybet a D\u2019Alema derketim qada NATO\u2019y\u00ea min got ox. L\u00ea ev derketin
  h\u00een b\u00eatir zehmet b\u00fb. \u00cest\u00eexbarat\u00ea R\u00fbs got div\u00ea
  tu bi\u00e7e Ermen\u00eestan\u00ea \u00fb ez birim balafirgeh\u00ea. Li balafirgeh\u00ea
  gotin Ermen\u00eestan nabe bi\u00e7e Tac\u00eek\u00eestan\u00ea. Ez daxistim Paytexta
  Du\u015fanbe ya Tac\u00eek\u00eestan\u00ea. Em d\u00eesa vegeriya Moskov\u00ea.
  Me ji ne\u00e7ar\u00ee d\u00eesa ser\u00ee li dost\u00ean Yewnan da. Du roj \u015f\u00fbnde
  me car ber\u00ea xwe da At\u00eenay\u00ea.\\nL\u00eestik\u00ean Xwedawend\u00ean
  Olympos\\nMin f\u00eam kir ku ez hatime l\u00eestik\u00ean xwedawend\u00ean Olympos.
  Min xwe nav xeyalet\u00ean xwedawendan de did\u00eet. Hele ku Hades ketib\u00fb
  hi\u015f\u00ea min. Ez ji balafirgeh\u00ea ketim salona VIP, Hades ez \u015fopandim.
  Ez \u015fevek\u00ea li mala dosta xwe Nagzak\u00ees mam. Ji w\u00ea \u015fev\u00ea
  \u015f\u00fbnde ez ber bi kampan mirin\u00ea ve \u00e7\u00fbm. Hades di dewr\u00ea
  de b\u00fb. Ti\u015ft\u00ean dihatin gotin sexte b\u00fbn. Y\u00ean dirust tuneb\u00fbn
  ma? Heb\u00fbn l\u00ea hem\u00fb li dij\u00ee \u00e7avsor\u00ean modern\u00eetey\u00ea
  b\u00ea\u00e7are b\u00fbn.\\nDi derketina Afr\u00eekay\u00ea de v\u00ea car\u00ea
  f\u00eegura Mandela bi bandor b\u00fb. Wek li Moskov\u00ea f\u00eegura Len\u00een
  bi bandor bib\u00fb. Ji bo bi\u00e7im Ba\u015f\u00fbr\u00ea Afr\u00eekay\u00ea min
  \u00ea pasaport bigirta. L\u00ea sextekariya Yewnan di v\u00ea l\u00eestik\u00ea
  de j\u00ee bi ser ket.\\nKomploya mezin di meriyet\u00ea de ye\\nDi derketina Yewnan\u00eestan\u00ea
  de hewldanek mezin dan. Ajokar\u00ean wesay\u00eet\u00ea ji bo b\u00eajin komployek
  mezin di meriyet\u00ea de ye \u00e7i ji dest\u00ea wan hat kirin. \u00ceht\u00eemalek
  mezin ew j\u00ee mem\u00fbr\u00ean \u00eest\u00eexbarata asta j\u00ear b\u00fbn.
  Balafira l\u00ea siwar b\u00fbm di operasyon\u00ean ve\u015far\u00ee y\u00ean Gladyo
  de bi kar dian\u00een. Beriya w\u00ea seferek me ya M\u00eensk heb\u00fb. Beriya
  bi\u00e7im Na\u00eerob\u00ee ji ser M\u00eensk ez \u00ea bi\u00e7\u00fbma Hollanday\u00ea.
  Li M\u00eensk du saetan sekin\u00eem. Balafir nehat.\\nPol\u00ees\u00ean balafirgeh\u00ea
  bi saetan balafir kontrol kirin.\\nCehnema Na\u00eerob\u00ee..\\nAbdullah Ocalan
  got s\u00ea r\u00ea dane ber w\u00ee \u00fb v\u00ea nirxandin\u00ea dike: \u201cLi
  cehnema Na\u00eerob\u00ee s\u00ea r\u00ea dan\u00een ber min; Ya yekem\u00een mirineke
  ku xemla pev\u00e7\u00fbnek b\u00ea \u00eet\u00eedat dan\u00ea; ya duyem\u00een
  tesl\u00eemb\u00fbn; ya s\u00eayem\u00een j\u00ee radestkirina t\u00eem\u00ean \u015fer\u00ea
  taybet a Tirk a ji z\u00fb de hatiye amadekirin. Li Na\u00eerob\u00ee ji kes\u00ean
  ligel min D\u00eelan bi fikar b\u00fb. Fikr\u00ean xwe tam bigota, tevger\u00ean
  civaka siv\u00eel bikira tevger\u00ea belk\u00ee komplo xera bib\u00fb yan j\u00ee
  vala derketiba. Bi israr digot em \u00e7ek\u00ea li ser xwe biger\u00eenin. Ger
  \u00e7ek li ser min heb\u00fbna \u00fb biki\u015fanda ev helwest teqez mirin b\u00fb.
  Pi\u015ftre di dema l\u00eapirs\u00een\u00ea de hatib\u00fb gotin ku ger min \u00e7ek
  bikar bianiya w\u00ea talimata l\u00eabixin bidana. Gotin derketina ji seferatxaney\u00ea
  j\u00ee mirin e. Gotin te helwesta her\u00ee rast kiriye. \u00c7iqas rast b\u00fb
  b\u00eaguman em nizanin.\\nP\u00eavajoya 15 rojan a Na\u00eerob\u00ee\\n15 rojan
  li Na\u00eerob\u00eema. Helwesta sef\u00eer Kostulas dihat f\u00eamkirin. Gelo dihat
  bikaran\u00een? An j\u00ee wek par\u00e7eyek plan\u00ea hatib\u00fb amadekirin.
  Min bixwe ev \u00e7areser nekir. Beriya b\u00eam tesl\u00eemkirin qet nehat mala
  xwe ya l\u00ea diman. Ji ber bi zor ji seferatxaney\u00ea dihatim derxistin li dij\u00ee
  zebaniy\u00ea Na\u00eerob\u00ee tund derket. Ev helwest dibe ku sextekar be j\u00ee.
  Ji 9\u2019\u00ea cotmeha 1998\u2019an heta 15\u2019\u00ea Sibata 1999\u2019an p\u00eavajoyek
  \u00e7ar mehan derbas bib\u00fb. Roal Tirkiyey\u00ea ya di v\u00ea p\u00eavajoy\u00ea
  de ev b\u00fb min bi balafir\u00ea bibin \u00cemraliy\u00ea. Ev operasyona her\u00ee
  mezin a NATO\u2019y\u00ea b\u00fb.\\nTirkiye p\u00ea\u015fk\u00ea\u015f\u00ee kap\u00eetal\u00eezma
  f\u00eenans\u00ea hat kirin\\nHelweta Yewnan\u00eestan\u00ea her ti\u015ft vedigot
  ji xwe. Dema li Romay\u00ea b\u00fbm mala l\u00ea dimam her ti\u015ft vedigot. Nedihi\u015ftin
  ez derkevim derve. T\u00eem\u00ean ewlehiya taybet li ber odey\u00ea b\u00fbn. 24
  saetan kontrol dikirin. Hikumeta D''Alema hikumeteke \u00e7ep demokrat b\u00fb.
  D''Alema b\u00eatecr\u00fbbe b\u00fb, bi tena ser\u00ea xwe nekar\u00ee biryar\u00ea
  bide. Li tevahiya Ewropay\u00ea geriya. \u00cengilistan\u00ea j\u00ea re got ku
  div\u00ea biryara xwe bi xwe bide; pi\u015ftgir\u00ee ji w\u00ee re nehate dayin.
  Helwesta Bruksel\u00ea ne z\u00eade zelal b\u00fb. Dawiya daw\u00ee em radest\u00ee
  dadgeriy\u00ea hatin kirin. Di v\u00ea helwest\u00ea de bandora Gladiyoy\u00ea t\u00ea
  d\u00eetin. Ji xwe \u00cetalya yek ji wan welatan b\u00fb ku Gladiyo her\u00ee z\u00eade
  l\u00ea xurt b\u00fb. Berl\u00fbscon\u00ee hem\u00fb h\u00eaza xwe xistib\u00fb
  nava liv \u00fb tevger\u00ea. Ew bi xwe zilam\u00ea Gladiyoy\u00ea b\u00fb. Ji ber
  ku zan\u00eeb\u00fbm \u00cetalya w\u00ea nikaribe min bixap\u00eene ne\u00e7ar mab\u00fbm
  ku bi\u00e7im. B\u00eaguman Tirkiye di berd\u00eala v\u00ea yek\u00ea de ji bo DYA
  \u00fb \u00cesra\u00eel\u00ea b\u00fbb\u00fb welat\u00ea her\u00ee j\u00ea bawer.
  P\u00eavajo p\u00eavajoya p\u00ea\u015fk\u00ea\u015fkirina Tirkiyey\u00ea ji bo
  kap\u00eetal\u00eezma f\u00eenans\u00ee ya global b\u00fb.\\nP\u00eakan\u00eena
  BOP\u2019\u00ea\\nAbdullah Oalan diyar dike ku ji S\u00fbriyey\u00ea derketin \u00fb
  an\u00eena Tirkiyey\u00ea destp\u00eaka mudaxaleya Rojhilata Nav\u00een e \u00fb
  xistina dewr\u00ea ya senaryoya dagikirina Iraq\u00ea ye. Abdullah Ocalan wiha dib\u00eaje:
  \u201cSenaryoya dagirkirina Iraq\u00ea j\u00ee gir\u00eaday\u00ea tesl\u00eemkirina
  min e. Dagirkirin bi operasyona li hember min dest p\u00ea kiriye. Heman ti\u015ft
  di dagirkirina Afgan\u00eestan\u00ea de j\u00ee derbasdar e. P\u00eakhatina Projeya
  Rojhilata Nav\u00een a Mezin gava ewil \u00fb operasyonek li hember min e. Ya rast
  yek ji gav\u00ean diyarker \u00ean bicihan\u00eena Projeya Rojhilata Nav\u00een
  a Mezin \u00fb gava w\u00ea ya destp\u00eak\u00ea operasyona li dij\u00ee min b\u00fb.
  Ecev\u00eet belasebe negot, ''Min kir nekir f\u00eahm nekir ku \u00e7ima Ocalan
  tesl\u00eem kirin''. \u00c7awa ku \u015eer\u00ea C\u00eehan\u00ea y\u00ea Yekem\u00een
  bi ku\u015ftina Wel\u00eeahd\u00ea Aw\u00fbst\u00fbryay\u00ea bi dest\u00ea neteweperestek\u00ee
  Sirp dest p\u00ea kir, ''\u015eer\u00ea C\u00eehan\u00ea y\u00ea S\u00eayem\u00een''
  j\u00ee bi operasyona li dij\u00ee min hatib\u00fb destp\u00eakirin. Roja 15\u2019\u00ea
  Sibat\u00ea ne roja \u015f\u00een\u00ea ye; roja aqilgirtin \u00fb erk\u00ean xwe
  derxistina zaneb\u00fbn\u00ea ye, roja e\u015fkerekirina komploy\u00ea ye. Komploya
  ku dixwazin di \u015fexs\u00ea min de p\u00ea\u015f bix\u00eenin, gelek k\u00fbr
  e. Em aql\u00ea selim n\u00eazikb\u00fbn \u00fb bi zanist\u00ee tevgeriyan. Ez li
  v\u00ea der\u00ea, her roj di nav berxwedanek\u00ea de me. Bi sebir, dirayet \u00fb
  t\u00eagihi\u015ftib\u00fbneke bilind berxwedaneke mezin didim. Dirayet serkeftin\u00ea
  j\u00ee p\u00eak t\u00eene. Di al\u00ee PDK\u2019\u00ea de j\u00ee xwestin avab\u00fbneke
  Kurd\u00ean Sp\u00ee ava bikin.\\nNavenda s\u00eayem\u00een \u015fer\u00ea c\u00eehan\u00ea
  Rojhilata Nav\u00een\\nS\u00eayem\u00een \u015fer\u00ea c\u00eehan\u00ea rast e
  \u00fb navenda w\u00ea Rojhilata Nav\u00een e. Ti\u015ft\u00ean li Iraq\u00ea t\u00ean
  jiy\u00een n\u00ee\u015fan didin ku \u015fer\u00ea li vir ten\u00ea welatek\u00ee
  eleqeder nake \u00fb t\u00eakildar\u00ee heb\u00fbn \u00fb berjewendiy\u00ean h\u00eaz\u00ean
  hegemon\u00eek y\u00ean c\u00eehan\u00ea ne. Ev \u015fer bi b\u00eabadorkirina \u00ceran\u00ea,
  bi \u00eest\u00eekrarkirina Iraq \u00fb Afgan\u00eestan\u00ea \u00fb her wiha ger
  ku \u00c7\u00een \u00fb Lat\u00een Amer\u00eeka ji tehd\u00eedb\u00fbn\u00ea derkeve
  dikare bidaw\u00ee be. Ji ber v\u00ea em h\u00eena di nav\u00eena \u015fer de ne.
  Ev demek\u00ea dikare bidome. Carna d\u00eeplomas\u00ee carna j\u00ee tund\u00ee
  w\u00ea z\u00eade dibe. W\u00ea kr\u00eez\u00ean abor\u00ee mudaxale bikin. Niha
  ba\u015f t\u00ea f\u00eamkirin ku operasyona li hember \u00e7awa di asta navnetewey\u00ee
  de p\u00eak hatiye \u00fb operasyona her\u00ee mezin a NATO\u2019y\u00ea ye.\\nB\u00eaguman
  h\u00eaz\u00ean hegemon\u00eek her tim \u015fer\u00ean mezin de biser nakevin. Gel
  j\u00ee dikarin gelek ti\u015ft\u00ee bidest bixin. Heta h\u00eaz\u00ean hegemon\u00eek
  bi pergal\u00ee dikarin winda bikin, gel j\u00ee bi pergal\u00ee dikarin bi ser
  kevin.\u201d\"", "\"Bidarvekirin yek ji sizay\u00ean her\u00ee dermirov\u00ee ye
  ku mirovek bi pi\u015ftgiriya desthilat \u00fb dewlet\u00ea li ser mirovek din de
  dibire \u00fb di encama w\u00ea de can\u00ea mirovek j\u00ea t\u00ea standin.\\nNiha
  di cihan\u00ea de \u00c7\u00een yekem welate ku her\u00ee z\u00eade mirov l\u00ea
  t\u00ean bidarvekirin. Pi\u015ft\u00ee w\u00ea \u00ceran di r\u00eaza duwem de cih\u00ea
  xwe digre ku salane hejmarek z\u00eade kes l\u00ea t\u00ean bidarvekirin. L\u00ea
  ger li gor\u00ee hejmara \u015f\u00eaniy\u00ean w\u00ea qiyas bikin, \u00ceran dibe
  yekem welat li ser asta cihan\u00ea ku her\u00ee z\u00eade mirov l\u00ea t\u00ean
  bidarvekirin.\\nBelgeya her\u00ee kevin li ser bidarvekirin\u00ea d\u00eeroka w\u00ea
  digihe ji beriya zay\u00een\u00ea 1800 salan ku ji aliy\u00ea Hemorob\u00ee ve li
  Bab\u00eel\u00ea hatiye derxistin. Li Yunana kevin de j\u00ee sizay\u00ea bidarvekirin\u00ea
  li hinek kes\u00ean tawanbar dihat bir\u00een. W\u00ea dem\u00ea j\u00ee her\u00ee
  z\u00eade sizay\u00ean wek li xa\u00e7\u00ea dan, \u00e7armix kirin, berd barankirin,
  \u015fewitandin, hilki\u015fandina bi dar\u00ea ve dihatin bicihan\u00een. L\u00ea
  pi\u015ft\u00ee hatina ola \u00ceslam\u00ea \u00fb li ser yasay\u00ean ol\u00ee
  li her\u00eam\u00ean diketin di j\u00ear dest\u00ea Ereb\u00ean Musulman de r\u00eajeya
  sizay\u00ean bidarvekirin\u00ea gelek z\u00eadetir b\u00fb.\\nPi\u015ft\u00ee \u015fer\u00ea
  cihan\u00ea y\u00ea duwem, di encama zext\u00ean civak\u00ea \u00fb raya gi\u015ft\u00ee
  ya li ser desthilatan, her wiha pi\u015ft\u00ee er\u00eakirina danezana maf\u00ean
  mirov, r\u00eajeya sizay\u00ea bidarvekirin\u00ea bi awayek berbi\u00e7av li ser
  asta cihan\u00ea k\u00eam b\u00fb. Gelek dewletan sizay\u00ea bidarvekirin\u00ea
  ji dest\u00fbra bingeh\u00een a welat\u00ea xwe derxistin.\\nNiha ji gi\u015ft\u00ee
  welat\u00ean cihan\u00ea 103 welat yan\u00ee ji sed\u00ee 53 welat\u00ean cihan\u00ea
  sizay\u00ean bidarvekirin\u00ea bi ti awayek bicih naynin \u00fb ji dest\u00fbra
  bingeh\u00een ya wel\u00eat derxistine. 6 welatan ku dike ji sed\u00ee 3\u2019y\u00ea
  welat\u00ean cihan\u00ea, sizay\u00ea bidarvekirin\u00ea bicih nay\u00eene, ji bil\u00ee
  hinek b\u00fbyer \u00fb di dem\u00ean \u015fer de. 50 welat ku dike ji sed\u00ee
  26\u2019\u00ea welat\u00ean cihan\u00ea tev\u00ee ku sizay\u00ea bidarvekirin\u00ea
  di dest\u00fbra wan a bingeh\u00een de heye, l\u00ea bicih nay\u00eenin yan j\u00ee
  rawestandine. 36 welat j\u00ee ku dike ji sed\u00ee 18\u2019y\u00ea welat\u00ean
  cihan\u00ea, hem sizay\u00ea bidarvekirin\u00ea di dest\u00fbra wan a bingeh\u00een
  de hene, hem j\u00ee bicih t\u00eenin.\\nLi \u00ceran\u00ea j\u00ee sizay\u00ea
  bidarvekirin\u00ea di dest\u00fbra bingeh\u00een a wel\u00eat de heye \u00fb rojane
  j\u00ee welat\u00ee ji aliy\u00ea rejima \u00ceran\u00ea ve t\u00ean bidarvekirin.
  Li \u00ceran\u00ea sizay\u00ea bi darvkirin\u00ea piran\u00ee ji bo kes\u00ean ku
  tawan\u00ean wek, ku\u015ftin, destdir\u00eajiya zayend\u00ee, hevr\u00eagezbaz\u00ee,
  bazirganiya madey\u00ean hi\u015fber, revandin \u00fb \u00e7end tawanek din t\u00ea
  bir\u00een. L\u00ea gelek kes j\u00ee hene lki ser fikir \u00fb raman\u00ean xwe
  y\u00ean siyas\u00ee, baweriya xwe t\u00eane bidarvekirin ku di yasaya \u00ceran\u00ea
  de bi \u2018Bex\u00ee\u2019 \u00fb \u2018Muharibe\u2019 t\u00ea binavkirin.\\nHer
  \u00e7iqas li rejima \u00ceran\u00ea salane bi ferm\u00ee r\u00eajeya bidarvekirinan
  e\u015fkere nake, l\u00ea hinek caran j\u00ee bi ferm\u00ee bidarvekirina hinek
  kesan radigih\u00eene. Li gor\u00ee raportek ya N\u00fbner\u00ea Ber\u00ea y\u00ea
  Netew\u00ean Yekb\u00fby\u00ee taybet ji bo kar\u00fbbar\u00ean maf\u00ean mirov
  li \u00ceran\u00ea Ehmed \u015eeh\u00eed, di sal\u00ean 2013-2014\u2019an de her\u00ee
  z\u00eade sizay\u00ean bidarvekirin\u00ea li \u00ceran\u00ea hatine bicihan\u00een.
  Li gor\u00ee raport\u00ea ten\u00ea di sala 2014\u2019an de 852 kes hatin bidarvekirin.\\nL\u00ea
  ev ne r\u00eajeya her\u00ee z\u00eade ya bidarvkirin\u00ea ye li \u00ceran\u00ea,
  dema ku \u015fore\u015fa gelan a \u00ceran\u00ea ji aliy\u00ea melayan ve hate desteserkirin
  \u00fb desthilat\u00ee ket dest\u00ea melayan, bi fermana R\u00eaber \u00fb Damezr\u00eaner\u00ea
  Komara \u00ceslam\u00ee Ruhulla Xumeyn\u00ee dadgeh\u00ean \u015fore\u015f\u00ea
  hatin avakirin \u00fb Sadiq Xelxal\u00ee wek \u2018Hakim\u00ea \u015feri\u00ee\u2019hate
  destn\u00ee\u015fankirin. Bi r\u00eaya van dadgehan re bi hezaran kes li seranser\u00ee
  \u00ceran\u00ea bi taybet\u00ee j\u00ee Rojhilat\u00ea Kurdistan\u00ea hatin bidarvekirin.\\nHav\u00eena
  sala 1988\u2019an werza bidarvekirin\u00ea\\nDi Hav\u00eena sala 1988\u2019an de
  bidarvekirina girtiy\u00ean siyas\u00ee \u00fb baweriyan tawaneke nay\u00ea jib\u00eerkirin
  \u00fb d\u00eerokek re\u015f ya desthilata \u00ceran\u00ea ye. Heya niha j\u00ee
  piraniya kes\u00ean w\u00ea dem\u00ea hatin bidarvekirin gor\u00ean wan nay\u00ean
  zan\u00een li kuder\u00ea ne.\\nDi Hav\u00eena sala 1988\u2019an de bi fermana Xumeyn\u00ee
  bi hezaran girtiy\u00ean siyas\u00ee y\u00ean di girt\u00eegeh\u00ean rejima \u00ceran\u00ea
  de b\u00fbn \u00fb piraniya wan \u00e7epgir \u00fb Mucah\u00eed\u00ee Gel b\u00fbn
  bi awayek ve\u015fart\u00ee \u00fb bi grub dihatin bidarvekirin. Hinek dihatin t\u00eerbarankirin
  \u00fb gulebarankirin di gor\u00ean kom\u00ee de dihatin ve\u015fartin.\\nHeya niha
  amarek zelal li ser hejmara kes\u00ean ku di Hav\u00eena sala 1988\u2019an de hatine
  bidarvekirin nine. Her \u00e7iqas rejima \u00ceran\u00ea li van komkuj\u00ee \u00fb
  tawanan mikur hatiye, l\u00ea qet hejmar \u00fb nav\u00ea kes\u00ean hatine bidarvekirin
  e\u015fkere nekiriye. Li gor\u00ee gotina \u00e7alakvan\u00ean siyas\u00ee \u00fb
  kes\u00ean w\u00ea dem\u00ea ji bidarvkirina rizgar b\u00fbne, t\u00ea gotin di
  w\u00ea Hav\u00een\u00ea de n\u00eaz\u00ee 4 hezar kes hatin bidarvekirin, hinek
  j\u00ee dib\u00eajin 7 hezar kes hatin bidarvekirin.\\nWelat\u00ee, \u00e7alakvan
  \u00fb siyasetmedar\u00ean Kurd y\u00ean ji Rojhilat\u00ea Kurdistan\u00ea j\u00ee
  ji sizay\u00ean bidarvekirin\u00ea y\u00ean rejim\u00ea b\u00ea par neman. Pi\u015ft\u00ee
  ku desthilat\u00ee ket dest\u00ea melayan, bi tometa endamt\u00ee \u00fb al\u00eekariday\u00eena
  partiy\u00ean Kurd\u00ee bidarvekirin \u00fb gulebarankirinan li Rojhilat\u00ea
  Kurdistan\u00ea j\u00ee destp\u00eakirin. Ji Kirma\u015fan ta Pawe, Sine \u00fb
  Mihabad\u00ea, bi sedan ciwan\u00ean Kurd b\u00eay ku werin dadgehkirin hinek j\u00ee
  bi dadgeh kirinek \u00e7end deqey\u00ee sizay\u00ea bidarvekirin\u00ea li wan hatin
  bir\u00een \u00fb hatin bidarvekirin.\\nBi destp\u00eakirina \u015fore\u015fa n\u00fb
  li Rojhilat\u00ea Kurdistan\u00ea \u00fb belavb\u00fbna felsefeya R\u00eaber Apo,
  be\u015fdariya ciwanan, xwendekar\u00ean zan\u00eengeh\u00ea ji bo nava ref\u00ean
  PKK\u2019\u00ea \u00fb pi\u015ft\u00ee w\u00ea j\u00ee PJAK\u2019\u00ea destp\u00eakir.
  Bi dehan \u00e7alakvan\u00ean meden\u00ee, siyas\u00ee, rojnamevan bi tometa ku
  al\u00eekariya partiy\u00ean Kurd\u00ee y\u00ean dijber\u00ea rejima \u00ceran\u00ea
  hatin girtin, \u00ea\u015fkencekirin \u00fb bidarvekirin. Rejim\u00ea v\u00ea yek\u00ea
  j\u00ee ji bo \u00e7avtirsandina gel\u00ea Kurd li Rojhilat\u00ea Kurdistan\u00ea
  p\u00eakan\u00ee.\\nT\u00eakildar\u00ee bidarvekirin\u00ean rejima \u00ceran\u00ea
  \u00fb aramanca siyaseta rejim\u00ea ya bidarvekirin\u00ea, \u00c7alakvan \u00cerec
  Misdaq\u00ee ku di heman dem\u00ea de girtiyek siyas\u00ee b\u00fb \u00fb yek ji
  wan kesan b\u00fb ki di sala 1988\u2019an de ji sizay\u00ea bidarvekirin\u00ea rizgarb\u00fbye
  \u00fb niha li dervey \u00ceran\u00ea dij\u00ee, bi r\u00eaya telefon\u00ea ji Rojnews\u2019\u00ea
  re axiv\u00ee.\\nT\u00eakildar\u00ee armanca siyaseta rejim\u00ea ya bi darvekirina
  \u00cerec Misdaq\u00ee got: \u201cBidarvekirin ji bo desthilata \u00ceslam\u00ee
  ya \u00ceran\u00ea wek ava jiyan\u00ea ye. Z\u00eadetir\u00ee 40 sal in dir\u00fb\u015fmeya
  desthilata \u00ceran\u00ea \u2018Serkeftin di \u00e7ewisandin\u00ea de ye.\u2019
  Yan\u00ee serkeftina xwe di tirsandin \u00fb \u00e7ewisandina gel de dib\u00eenin.
  Heya rojek j\u00ee li ser desthilat\u00ea mabin w\u00ea dest ji v\u00ea siyaseta
  xwe bernedin. Ji berku ew wisan bawer dikin ku bi darvekirin \u00fb tirsandina gel
  ew\u00ea biserkevin.\u201d\\nLi ser p\u00eangava bidarvekirina a sala 1988\u2019an
  j\u00ee Misdaq\u00ee got: \u201cEv s\u00eestem roja ku ketin ser desthilat\u00ea
  dest bi darvekirinan kir. Welatiyan ji serban\u00ean dibistanan de diav\u00eat xwar\u00ea.
  Li Kurdistan\u00ea navend\u00ean bidarvekirin\u00ea avakir, her wiha li Tirkmen
  Sehra kes\u00ean nexwe\u015f li ser qeryaley\u00ea nexwe\u015fxaney\u00ea bidarvekirin.
  Kes\u00ean bir\u00eendar b\u00fbn bidarvekir. Li ser gotina du pasdaran mirov diku\u015ftin.
  Bidarvekirin ne ten\u00ea di sala 1988\u2019an de \u00e7\u00eab\u00fbn. L\u00ea
  w\u00ea sal\u00ea c\u00fbdahiyek heb\u00fb ew j\u00ee ew b\u00fb ku hinek kes\u00ean
  ku bi xwe j\u00ee dizan\u00een ne \u015fayen\u00ea bidarvekirin\u00eane hatin bidarvekirin
  \u00fb li seranser\u00ee \u00ceran\u00ea komkuj\u00ee p\u00eakhatin. \u015eer\u00ea
  desthilat\u00ea y\u00ea li gel Iraq\u00ea n\u00fb qediyab\u00fb, pirsgir\u00eaka
  girtiy\u00ean siyas\u00ee bi metirsiyek cid\u00ee did\u00eet. Ditirsiya ku neraz\u00eeb\u00fbn\u00ean
  civak\u00ea derkevin. Ji bona w\u00ea biryara komkujiyan da ku ji ber\u00ea de pilan
  j\u00eare hatib\u00fb dan\u00een. \u00cari\u015f\u00ean Mucahid\u00ean Gel weke
  sedema v\u00ea biryar\u00ea n\u00ee\u015fan dan. Wisan dizan\u00een ku w\u00ea bi
  van kiryaran mana xwe ya li ser desthilat\u00ea bixin garantiy\u00ea.\u201d\\nT\u00eakildar\u00ea
  hejmara kes\u00ean w\u00ea sal\u00ea hatin bidarvekirin j\u00ee Misdaq\u00ee wiha
  axiv\u00ee: \u201cLi gor\u00ee min amara ku ji aliy\u00ea C\u00eegir\u00ea Xumeyn\u00ee
  Ayetulah Muntezr\u00ee ve hate diyarkirin n\u00eaziktir\u00een amara rast a bidarvekirinane.
  Li gor\u00ee amar \u00fb belgey\u00ean Muntezr\u00ee n\u00eaz\u00ee 4 hezar kes
  di navbera mehek ta 40 rojan de hatin bidarvekirin.\u201d\\n\u00cerec Misdaq\u00ee
  li ser p\u00eangava PJAK \u00fb KODAR ya \u2018Bel\u00ea ji bo demokras\u00ee, na
  ji bo bidarvekirin\u00ea\u2019 j\u00ee axiv\u00ee \u00fb got: \u201cLi gor\u00ee
  min her kar \u00fb \u00e7alakiyek li dij\u00ee bidarvekirin \u00fb rizgarikirina
  jiyana mirovahiy\u00ea be, div\u00ea pi\u015ftgiriya w\u00ea were kirin. Qala demokras\u00ee
  j\u00ee ti\u015fteke raz\u00eeb\u00fbnek gi\u015ft\u00ee li sere. Div\u00ea pi\u015ftgiriya
  v\u00ea p\u00eangav\u00ea were kirin \u00fb bibe daxwazek ya gi\u015ft\u00ee.\u201d\\n(k\u015f)\"",
