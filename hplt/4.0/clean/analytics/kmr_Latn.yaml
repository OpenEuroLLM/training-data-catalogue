  Xwed\u00ea ve bi p\u00eeroz ve nabe.\\nXweday\u00ea \u015eeytan xezeb kir ku ew
  \u00e7i kirib\u00fb \u00fb encam\u00ean ji bo mirovahiy\u00ea re ragihand.\\nPawlos
  bi Xwed\u00ea re Adem \u00fb Hawa ji ezmanan re derxistin \u00fb bihu\u015ft\u00ea
  bi\u015f\u00eene \u00fb ji bo dara jiyan\u00ea bipar\u00eazin. \u00bb\u00db Xudan
  Xweday\u00ea got, ''Mirov niha yek ji me re b\u00fbye, ba\u015f dizane \u00fb xerab.
  b\u00ea destn\u00ee\u015fankirin ku dest bi xwe bigih\u00eejin \u00fb ji dar\u00ea
  jiyan\u00ea bist\u00eenin \u00fb bixwin \u00fb her \u00fb her bij\u00ee. Ji ber
  v\u00ea yek\u00ea Xudan Xwed\u00ea ew ji Bexday\u00ea Eden veqetand ku da ku erd\u00ea
  ji w\u00ee derxistin.\\nPi\u015ft\u00ee ku w\u00ee meriv derket derve, w\u00ee li
  rojhilata Bexda Eden\u00ea z\u00ear \u00fb li \u015fengal\u00ea \u015fewitandin
  \u00fb pa\u015f\u00ea veguhestin r\u00eaya jiyan\u00ea jiyan\u00ea bipar\u00eaze.
  \\\"(Genesis 3: 22-24).\\nP\u00eaxember\u00ea yekem\u00een di di Mizg\u00eeniy\u00ea
  \u00fb Torah de t\u00ea gotin\\nArchangel Jophiel ji ber ku ew di Mizg\u00eeniy\u00ea
  \u00fb Torah de t\u00ea gotin behsa yekem\u00een milyaket\u00ean p\u00ea\u015f\u00ee
  ye. Di pirt\u00fbka yekane de, Beleta Greenaway niv\u00eesand: \\\"Jophiel (Bedena
  Xwed\u00ea) li milyaketek yekem\u00een e ku di Inc\u00eel\u00ea de [be\u015fek yekem\u00een
  ya ku Torah j\u00ee j\u00ee j\u00ee j\u00ee j\u00ee ye j\u00ee behsa t\u00ea gotin]
  ye.\\\" Ew rola w\u00ee ji bo Afir\u00eener\u00ea jiyan\u00ea bipar\u00eazin. Gava
  ku \u015fewitandina tirsa tirs\u00een, xemg\u00eeniyek xemg\u00een b\u00fb, w\u00ee
  kar\u00ea Adem \u00fb Hewa ji Bexday\u00ea Eden\u00ea ve dikir \u00fb d\u00ea ji
  mirovan re veguhestin erd\u00ea dak\u00ea\u015f\u00ee d\u00eesa. . \\\"\\nBi Xwe
  Bedewiya Xwe Ji Berxwedana Berxwedan\u00ea\\nBalk\u00ea\u015f e ku berbi\u00e7av
  Jophiel, ku nav\u00ea w\u00ee \\\"bedewiya Xwed\u00ea,\\\" milyaket e ku Xwed\u00ea
  bijarte ji Adem \u00fb Hawa ji jihu\u015ft\u00ea bedewiya Bax\u00e7ey\u00ea Eden
  ve bist\u00eene. Di kit\u00eab\u00ea Ruh\u00ea P\u00eeroz de li Sacred Legend ,
  Edward J. Brailsford \u015f\u00eerove dike: \\\"Jophiel, P\u00eeroz ya Xwed\u00ea,
  cerdevan\u00ee Deryaya Zan\u00een b\u00fb. Ew b\u00fb ku pi\u015ft\u00ee pi\u015ft\u00ee
  hilwe\u015f\u00eena Adem \u00fb Hawa ji ji Bax\u00e7ey\u00ea Eden ve \u00e7\u00fb
  .\\nKomeleya bedewiy\u00ea bi zanist\u00ee xwezay\u00ee ye \u00fb hewce ne hewce
  ne. L\u00ea \u00e7ima bila bedewiya bedew\u00ea s\u00fbcdar derxe, \u00fb \u015f\u00fbr\u00ea
  tewr\u00ea bist\u00eene, heya ku ew her dem bi b\u00eer b\u00eenin b\u00eera xwe
  ku dadweriya dilovan\u00ee bi dilsoz b\u00fb, \u00fb li ser dera b\u00eehnfirehiya
  bihi\u015ft\u00ea xeyaliyek nay\u00ea d\u00eetin, ne ji xerabtir ji Xwed\u00ea re
  xezeb kirin, l\u00ea ji bedewiya qenciy\u00ea ku xemg\u00een b\u00fb \u00fb dixwaze
  bi hev re hev bibin? \\\"\\nHelbest\u00ean Huner\u00ee y\u00ean Jop\u00eeel gelek
  caran milyaket li Gardenen Eden\u00ea n\u00ee\u015fan dide, \u00fb wateya ku hem\u00ee
  encam\u00ean xirab\u00ea guneh\u00ean guneh \u00fb h\u00eaviya bi Xwed\u00ea re
  vegotin, niv\u00eesk\u00ee Richard Taylor di pirt\u00fbka \u00c7awa Xwey\u00ea Xwey\u00ea
  Xwey\u00ea de : W\u00eaney\u00ean Churches \u00fb Cathedrals . Di huner\u00ea de,
  Taylor dib\u00eaje, Jophiel bi gelemper\u00ee ku \\\"ji \u015fewitandina Adem \u00fb
  Eve ji bax\u00e7\u00ea Eden\u00ea re berbi\u00e7av dike\\\" \u00fb n\u00ee\u015fan
  dide ku \\\"dabe\u015fkirina destp\u00eaka p\u00ea\u015f\u00ee \u00fb pa\u015f\u00ea
  Yezdan \u00fb mirov\u00ean xwe veguhestin.\\\"\\nA Future Paradise\\n\u00c7awa ku
  Dara Dijara di pirt\u00fbka P\u00eeroz ya \u00cenc\u00eel\u00ea de hat d\u00eetin
  - Genesis - gava ku guneh di\u00e7e dinyay\u00ea, ew di pirt\u00fbka pa\u015f\u00een
  ya P\u00eeroz de - P\u00eeroz - di ezm\u00ean bihu\u015ft\u00ee de d\u00eesa d\u00eetiye.
  Peyxama Y\u00fbhenna 22: 1-5 e\u015fkere dike ku \u00e7u\u015ftina Eden\u00ea d\u00ea
  d\u00eesa bist\u00eene: \\\"Hing\u00ea milyaket ez li deryaya jiyan\u00ea n\u00ee\u015fan\u00ee
  n\u00ee\u015fan\u00ee n\u00ee\u015fan\u00ee n\u00ee\u015fan\u00ee, da ku wek\u00ee
  paqij e, ji text\u00ea Xwed\u00ea \u00fb ji Berx\u00ea nav\u00een ya nav\u00een
  kolana mezin a baj\u00ear. Li her aliyek \u00e7em\u00ea dara jiyan\u00ea rawest\u00ee,
  her diwanzdeh berhem\u00ean dar\u00ea biki\u015f\u00eenin, her meh\u00ea ber\u00ea
  xwe dide. \u00db pel\u00ean dar\u00ea ji bo qenckirina neteweyan ne. Xwe\u015f\u00een.
  Desthilatdariya Xweday\u00ea \u00fb Berx w\u00ea baj\u00ear bim\u00eene, \u00fb
  xulam\u00ean w\u00ee w\u00ea xizmet\u00ea bikin. Ew \u00ea r\u00fby\u00ea w\u00ee
  bib\u00eenin, \u00fb nav\u00ea w\u00ee w\u00ea di ser\u00ea xwe de bibin. Ronahiya
  ronahiy\u00ea yan ronahiya roj\u00ea, \u00e7imk\u00ee Xweday\u00ea Xwed\u00ea w\u00ea
  ronah\u00ee bidin. \u00db ew\u00ea her \u00fb her dem serwer bikin. \\\"\\nDi pirt\u00fbka
  bi Angelsan re dij\u00een , Cleo Paul Strawmyer dib\u00eaje: \\\"Gava ku Y\u00fbhenna
  di Peyxama Deryaya Jiyan de di bax\u00e7\u00ea deyan de dipeyiv\u00eene, ev eyn\u00ee
  Tree Tree of Life e ku ew \u00e7irub\u00eem li Bax\u00e7ey\u00ea Eden bipar\u00eaze?
  Ev heman dar\u00ea ye. \\\" Strawmyer berdewam dike ku h\u00easir\u00ean ku bi gemiy\u00ea
  ji Deryaya Jiyan ve ji erd\u00ea ezmanan ve digire, b\u00eay\u00ee parastina guneh\u00ea
  b\u00eay\u00ee parastin - \\\"ew \u00ea ne ten\u00ea ten\u00ea daristana jiyan\u00ea
  bipar\u00eaze dema li bax\u00e7\u00ea, l\u00ea niha ew gerek hilbikin dar\u00ea
  \u00fb ewlehiy\u00ea li ezmanan bigirin. \\\"\\nN\u00ee\u015fta Xweseriya Jophiel\\n\u015e\u00fbr\u00ea
  ku Jopheel ji bo parastina daristana jiyan\u00ea bipar\u00eaze dibe ku h\u00eaza
  dan\u00ea jiyan\u00ea n\u00ee\u015fan bide ku milyaket\u00ean ku mirov\u00ean mirov\u00ean
  gunehkar \u00ean ku al\u00eekariya al\u00eekariya mirov\u00ean gunehkar dikin, f\u00eam
  dikin, di Janice T. Connell de di pirt\u00fbka Angel Power de niv\u00ees\u00eenin
  : \\\"Gava ku ew zarok\u00ean zarok\u00ean Xwed\u00ea b\u00fb Dema ku em gih\u00ee\u015ftin
  bax\u00e7\u00ea Eden\u00ea. Gava ku em bihu\u015ft\u00ea winda kir, em qelskirina
  rastiy\u00ea dib\u00eenin. \u015e\u00fbr\u00ea ku berbi deriy\u00ea berbi b\u00eadeng
  dike astengiya wijdan\u00ea ye. Ew her \u015fev hi\u015fyar dike ku \u015f\u00fbr\u00ea
  wijdana bi ronahiya rastiy\u00ea. Bi h\u00eaza milyaket e ku h\u00eaza f\u00earb\u00fbna
  v\u00ea yek\u00ea. Ew \u00ean ku desthilatdariya milyaket\u00ea re bi milyaket\u00ean
  paqij t\u00eane \u015fermezar kirin \u00fb dikarin bikaribin \u015f\u00fbr\u00ea
  zelaliya wijdan\u00ea da ku bihi\u015ftin veguhestin. \\\"\"", "\"Navenda Ragihandin
  \u00fb \u00c7apemeniy\u00ea ya HPG''\u00ea t\u00eakildar\u00ee 3 ger\u00eelay\u00ean
  li Her\u00eam\u00ean Parastin\u00ea y\u00ean Medyay\u00ea \u015feh\u00eed b\u00fbn
  daxuyaniyek da. Daxuyan\u00ee bi v\u00ee reng\u00ee ye:\\n\\\"Kedkara \u00e7apemeniya
  azad \u00fb mil\u00eetana p\u00ea\u015feng a gel\u00ea me hevr\u00eaya Ros\u00eeda
  M\u00eard\u00een \u00fb hevr\u00eay\u00ean me Mazl\u00fbm \u00fb Berxwedan di 17''\u00ea
  Adara 2024''an de \u015feh\u00eed b\u00fbn.\\nHevr\u00eaya me Ros\u00eeda M\u00eard\u00een
  weke \u015fopdara Mazl\u00fbm Dogan, Sel\u00e7\u00fbk \u015eahan, G\u00fbrbetell\u00ee
  Ersoz, Hal\u00eel Dag, Ces\u00fbr Robosk\u00ee, Arj\u00een Amed, Den\u00eez Firat,
  N\u00fbjiyan Erhan, Al\u00ee Kan\u00eeroj \u00fb Jiyan Amargiyan di ron\u00eekirina
  gel\u00ea me de, di f\u00eahmkirina rastiya dijmin de \u00fb di beral\u00eekirina
  \u00eari\u015f\u00ean \u015fer\u00ea taybet de ked da \u00fb kadroyeke p\u00ea\u015feng
  b\u00fb ku rol l\u00eest. Hevr\u00eaya me Ros\u00eeda bi t\u00eako\u015f\u00eena
  xwe ya ji metropol\u00ean Tirkiyey\u00ea heta \u00e7iyay\u00ean Kurdistan\u00ea,
  bersiva her\u00ee bi wate da zext\u00ean dijmin \u00ean li ser \u00e7apemeniya azad
  \u00fb gel\u00ea me. Ji bo rastgiriy\u00ea bigih\u00eene gel\u00ea me \u00fb raya
  gi\u015ft\u00ee ya c\u00eehan\u00ea, her c\u00fbre zext, \u00ea\u015fkence \u00fb
  zilm da ber \u00e7av\u00ean xwe \u00fb di v\u00ea oxir\u00ea de li zindan\u00ean
  dijmin dilsoza t\u00eako\u015f\u00eena xwe ma, li dij\u00ee dijmin di sekna jin\u00ea
  ya azad de taw\u00eez neda. \u00c7iyay\u00ean Kurdistan\u00ea weke qada t\u00eako\u015f\u00een\u00ea
  ya her\u00ee bi bandor a li dij\u00ee zilma dijmin d\u00eet, xwe gihand \u00e7iyay\u00ean
  Kurdistan\u00ea \u00fb kar\u00ea \u00e7apemeniya azad ku gelek\u00ee j\u00ea hez
  dikir li v\u00ea der\u00ea dewam kir. Di destek\u00ee xwe de p\u00ean\u00fbs \u00fb
  kamera, di dest\u00ea din de j\u00ee bi \u00e7eka xwe \u00fb agir\u00ea azadiy\u00ea
  y\u00ea di dil\u00ea xwe de, bi me\u015fa xwe ya azadiy\u00ea ya ku li \u00e7iy\u00ea
  me\u015fand, hem ger\u00eelat\u00ee bi t\u00ear \u00fb tij\u00ee jiya hem j\u00ee
  k\u00ealiy\u00ean azadiy\u00ea y\u00ean ger\u00eela ebed\u00ee kir. Hevr\u00eaya
  me Ros\u00eeda b\u00fb deng\u00ea gur \u00ea \u00e7apemeniya azad li \u00e7iyay\u00ean
  Kurdistan\u00ea, di dema p\u00eaw\u00eest de li ref\u00ean her\u00ee p\u00ea\u015f
  li dij\u00ee dijmin \u015fer kir \u00fb mil\u00eetaniya jin\u00ea ya azad a Apoy\u00ee
  \u00fb fermandariya YJA Star\u00ea bi rengek\u00ee h\u00eaja tems\u00eel kir.\\nHevr\u00eay\u00ea
  me Mazl\u00fbm ku welatpar\u00eaziya gel\u00ea me y\u00ea Efr\u00een\u00ea \u00fb
  dilsoziya bi welat\u00ea me Kurdistan\u00ea re di kesayetiya xwe de tems\u00eel
  kir, bi hesret, co\u015f \u00fb kelecaneke mezin xwe gihand \u00e7iyay\u00ean Kurdistan\u00ea,
  heb\u00fbna xwe bi ked\u00ea li \u00e7iyay\u00ean Kurdistan\u00ea misoger kir. Bi
  tevl\u00eeb\u00fbna xwe ya bi fedakar\u00ee ya di her k\u00ealiya jiyan\u00ea de
  b\u00fb yek ji hevr\u00eay\u00ean me ku nirx afirand \u00fb t\u00eako\u015f\u00eena
  xwe ya bi reng\u00ea feda\u00eet\u00ee bi \u015fehadet\u00ea gihand asta her\u00ee
  bilind. Hevr\u00eay\u00ea me Mazl\u00fbm di heq\u00eeqeta PKK''\u00ea de xwe heland
  \u00fb ebed\u00ee b\u00fb.\\nEwlad\u00ea h\u00eaja y\u00ea gel\u00ea me y\u00ea
  Ereb, \u015fore\u015fger\u00ea enternasyonal\u00eest hevr\u00eay\u00ea me Berxwedan
  weke mil\u00eetanek\u00ee h\u00eajay\u00ee nav\u00ea xwe li dij\u00ee m\u00eatinger\u00ee
  \u00fb dagirkeriya Tirk di nava t\u00eako\u015f\u00eena me de ku alternat\u00eefa
  azadiy\u00ea ya gelan e, berxwedaneke destan\u00ee n\u00ee\u015fan da. Hevr\u00eay\u00ea
  me Berxwedan ku bi baweriyeke xurt bi R\u00eaber Apo \u00fb felsefeya w\u00ee dilsoz
  b\u00fb, weke \u015fervanek\u00ee heq\u00eeqet\u00ea her k\u00ealiya jiyana xwe
  bi hewldan\u00ean xurt \u00ean ji bo f\u00eahmkirin \u00fb bicihan\u00eena R\u00eaber\u00ea
  me derbas kir \u00fb b\u00fb mil\u00eetanek\u00ee m\u00eenak.\\nEm soz didin ku
  t\u00eako\u015f\u00eena azadiy\u00ea ya ku hevr\u00eay\u00ean me Ros\u00eeda, Mazl\u00fbm
  \u00fb Berxwedan radest\u00ee me kirine bi rengek\u00ee ku h\u00eajay\u00ee wan
  bin mezin bikin, di ser\u00ee de malbat\u00ean wan \u00ean h\u00eaja sersaxiy\u00ea
  ji tevahiya gel\u00ea me y\u00ea Kurdistan\u00ea y\u00ea welatpar\u00eaz re sersaxiy\u00ea
  dixwazin.\\nAgahiy\u00ean li ser nasnameya hevr\u00eay\u00ean me y\u00ean \u015feh\u00eed
  b\u00fbne bi v\u00ee reng\u00ee ne:\\nROS\u00ceDA M\u00caRD\u00ceN\\nR\u00eaber
  Apo tesp\u00eeteke d\u00eerok\u00ee kir \u00fb bi p\u00eangaveke d\u00eerok\u00ee
  got ''Kurdistan m\u00eatingeh'' e, bi v\u00ee reng\u00ee me\u015fa azadiy\u00ea
  da destp\u00eakirin \u00fb gelek\u00ee li ber tineb\u00fbn\u00ea ji xweliy\u00ean
  xwe ji n\u00fb ve afirand. T\u00eako\u015f\u00eena me ku weke bi derziy\u00ea b\u00eer
  b\u00ea kolandin bi ked \u00fb sebreke gelek\u00ee mezin hate h\u00fbnandin, di
  \u015fexs\u00ea PKK''\u00ea de \u015f\u00eanber b\u00fb \u00fb zinc\u00eer\u00ean
  m\u00eatingeriy\u00ea ferz dikirin qetand. Bi fedakar\u00ee \u00fb hewldan\u00ean
  b\u00eahempa y\u00ean R\u00eaber Apo \u00fb \u015feh\u00eed\u00ean me y\u00ean nemir,
  t\u00eako\u015f\u00eena me destp\u00ea kir, mezin b\u00fb \u00fb bi p\u00ea\u015f
  ket. Di ser\u00ee de jin \u00fb ciwan\u00ean Kurd gel\u00ea Kurdistan\u00ea hem\u00fb
  xwed\u00ee li t\u00eako\u015f\u00eena me derketin. T\u00eako\u015f\u00eena me ji
  s\u00eenor\u00ean Kurdistan\u00ea derbas kir, veguher\u00ee h\u00eaviya rizgariy\u00ea
  ji hem\u00fb bindestan re \u00fb weke ku R\u00eaber Apo bi gotin\u00ean xwe y\u00ean
  balk\u00ea\u015f destn\u00ee\u015fan kir, gih\u00ee\u015ft asta ''\u00cad\u00ee
  ti h\u00eaz w\u00ea nikaribe nasname, ziman \u00fb \u00e7anda me \u00eenkar bike''.\\nHevr\u00eaya
  me Ros\u00eeda ku li nav\u00e7eya Qoser\u00ea ya M\u00eard\u00een\u00ea ji dayik
  b\u00fb, t\u00eako\u015f\u00eena me ya ku R\u00eaber Apo ava kir nas kir \u00fb
  p\u00ea re mezin b\u00fb. Li nava malbat \u00fb derdoreke wel\u00ea mezin b\u00fb
  ku dilsoz\u00ea nirx\u00ean Kurdistan\u00ee b\u00fb, bi nasname \u00fb hi\u015fmendiya
  Kurd\u00eetiy\u00ea dihate naskirin \u00fb tevl\u00eeb\u00fbn li nava t\u00eako\u015f\u00een\u00ea
  kirib\u00fb. Hevr\u00eaya me Ros\u00eeda ji ber ku li nava derdoreke bi v\u00ee
  reng\u00ee mezin b\u00fb, ev yek ji xwe re kir zem\u00eena l\u00eager\u00eena li
  nasnameya xwe ya azad. Ji ber v\u00ea yek\u00ea j\u00ee bala w\u00ea li ser \u00e7and,
  ziman \u00fb nasnameya Kurd b\u00fb. \u00ca\u015fa b\u00eaziman, b\u00eanasname
  \u00fb b\u00eawelathi\u015ftina gel\u00ea me ji dil h\u00ees kir. Dilsoziya xelk\u00ea
  me y\u00ea M\u00eard\u00een\u00ea ya li \u00e7and \u00fb ziman\u00ea Kurd\u00ee
  di kesayetiya hevr\u00eaya me Ros\u00eeda de \u015f\u00eanber b\u00fb. M\u00eena
  p\u00ea\u015feng\u00ea \u00c7aran \u00ea Zindana Amed\u00ea hevr\u00ea Ferhat K\u00fbrtay
  ku di sal\u00ean destp\u00eak\u00ea y\u00ean partiya me PKK''\u00ea li ser bingeha
  eleqeya mezin a li Kurd\u00ee PKK gihand asteke gir\u00eeng, w\u00ea j\u00ee da
  ser \u015fopa heman kevne\u015fopiy\u00ea. M\u00eena hem\u015feriy\u00ea xwe hevr\u00ea
  Ferhat K\u00fbrtay gelek\u00ee hewl da ku t\u00eako\u015f\u00eena azadiy\u00ea ya
  gel\u00ea me mezin bike \u00fb di heman dem\u00ea de \u00e7and \u00fb ziman\u00ea
  Kurd\u00ee bide jiy\u00een. Hevr\u00eaya me Ros\u00eeda ji sala 2007''an \u00fb
  p\u00ea ve li Zan\u00eengeha li Enqerey\u00ea ku dixwend, ev l\u00eager\u00een \u00fb
  hewldana xwe dewam kir. Li gel pol\u00eet\u00eekay\u00ean as\u00eem\u00eelasyon\u00ea
  y\u00ean dewleta Tirk a m\u00eatinger qirker ku ziman\u00ea Kurd\u00ee tine dihesib\u00eene,
  hewl da zan\u00eengeh\u00ea bike war\u00ea p\u00ea\u015fvebirina \u00e7and \u00fb
  ziman\u00ea Kurd\u00ee. D\u00eet ku \u00e7epera her\u00ee xurt a ku t\u00eako\u015f\u00eena
  xwe ya \u00e7and \u00fb ziman\u00ea Kurd\u00ee l\u00ea bime\u015f\u00eene rojnamey\u00ean
  Kurd\u00ee ye. Ji \u00e7inar\u00ea me y\u00ea mezin Ap\u00ea M\u00fbsa heta bi general\u00ean
  w\u00ee y\u00ean bi\u00e7\u00fbk tevl\u00ee saz\u00ee \u00fb kevne\u015fopiya \u00e7apemeniya
  azad b\u00fb ku bi sedan \u015feh\u00eed\u00ean xwe hene \u00fb ji xwe re weke r\u00fbmeteke
  mezin d\u00eet ku bibe par\u00e7eyek ji v\u00ea t\u00eako\u015f\u00een\u00ea. Li
  ser v\u00ea bingeh\u00ea be\u015fdar\u00ee nava kar\u00ean rojnameya Azadiya Welat
  b\u00fb, di ast\u00ean cuda de kedeke mezin da. B\u00eay\u00ee ku cudahiy\u00ea
  bixe nava wez\u00eefey\u00ea ji bo xurtkirina kar\u00ea \u00e7apemeniya azad \u00fb
  ziman\u00ea Kurd\u00ee t\u00eako\u015fiya.\\nHevr\u00eaya me Ros\u00eeda ku weke
  jineke Kurd xwed\u00ee li \u00e7and \u00fb ziman\u00ea xwe derket, bi p\u00ea\u015f
  ve bir, xurt kir, gotin \u00fb p\u00ean\u00fbsa xwe bi reng\u00ea her\u00ee bedew
  bi kar an\u00ee, b\u00fb hedefa dewleta Tirk a m\u00eatinger qirker. Dewleta Tirk
  ku her tim hewl dide Kurdan qir bike, hevr\u00eaya me Ros\u00eeda j\u00ee kir hedef
  \u00fb ew xist zindan\u00ea. Bi v\u00ee reng\u00ee hewl da kar\u00ean p\u00ea\u015fvebirina
  \u00e7and \u00fb ziman\u00ea Kurd\u00ee, kar\u00ea we\u015fangeriya \u00e7apemeniya
  azad asteng bike. L\u00ea bel\u00ea hevr\u00eaya me Ros\u00eeda ti car\u00ee pa\u015fve
  gav neav\u00eat, li hember\u00ee dijmin ser\u00ee netewand \u00fb b\u00eay\u00ee
  ku navber\u00ea bide t\u00eako\u015f\u00eena xwe m\u00eena li derve li zindan\u00ea
  j\u00ee heman sekn n\u00ee\u015fan da. Pi\u015ft\u00ee ku ji zindan\u00ea derket,
  bi e\u015fq, daxwaz \u00fb biryardariyeke h\u00een mezin kar\u00ean \u00e7apemeniya
  azad dewam kir. T\u00eako\u015f\u00een \u00fb tevl\u00eeb\u00fbna xwe h\u00een mezin
  kir, berpirsyariy\u00ean h\u00een mezin hilda ser mil\u00ea xwe \u00fb li gel temen\u00ea
  xwe y\u00ea ciwan j\u00ee b\u00fb mid\u00fbra kar\u00ean niv\u00ees\u00ea ya rojnameya
  Azadiya Welat. Dewleta Tirk ku f\u00eahm kir nikare t\u00eako\u015f\u00eena hevr\u00eaya
  me Ros\u00eeda bisekin\u00eene ku ciwaneke bi r\u00fbmet a Kurd b\u00fb, ji ber
  kar\u00ea li \u00e7apemeniya azad a li rojnameya Azadiya Welat 137 sal cezay\u00ea
  girt\u00eegeh\u00ea li hevr\u00eaya me ya 24 sal\u00ee bir\u00ee. Dewleta Tirk bi
  v\u00ea pol\u00eet\u00eekaya xwe careke din n\u00ee\u015fan da ku bi \u00e7i reng\u00ee
  dijmin\u00ea gel\u00ea Kurd, dijmin\u00ea \u00e7and, ziman \u00fb nasnameya Kurd
  e, bi \u00e7i reng\u00ee dijmin\u00ea kar\u00ea \u00e7apemeniya azad e.\\nHevr\u00eaya
  em Ros\u00eeda ku d\u00eet, ji bo me\u015fandina kar\u00ean \u00e7apemeniya azad
  dewleta Tirk a fa\u015f\u00eest derfet \u00fb zem\u00een nehi\u015ftiye \u00fb cezayek\u00ee
  d\u00fbr\u00ee ji aqil \u00ea 137 salan l\u00ea hatiye bir\u00een, ji bo karibe
  t\u00eako\u015f\u00eena xwe bi rengek\u00ee azad \u00fb h\u00een xurt bime\u015f\u00eene
  dest ji Zan\u00eengeha Enqerey\u00ea berda \u00fb ber\u00ea xwe da \u00e7iyay\u00ean
  Kurdistan\u00ea. Hevr\u00eaya me Ros\u00eeda ji ber zext, ceza \u00fb pol\u00eet\u00eekaya
  dewleta Tirk a ku maf\u00ea jiyan\u00ea nade Kurd\u00ean azad, ber\u00ea xwe da
  \u00e7iy\u00ea \u00fb t\u00eako\u015f\u00eena xwe derbas\u00ee \u00e7iy\u00ea kir.
  Hevr\u00eaya me Ros\u00eeda li \u00e7iyay\u00ean Kurdistan\u00ea rahi\u015ft p\u00ean\u00fbs
  \u00fb kameraya xwe, tevl\u00ee kar\u00ea \u00e7apemeniya azad \u00ea li \u00e7iy\u00ea
  b\u00fb \u00fb li ser xeta G\u00fbrbetell\u00ee Ersoz \u00fb Hal\u00eel Dag me\u015fiya.
  Li hember\u00ee \u00eari\u015f \u00fb as\u00eem\u00eelasyona dewleta Tirk a m\u00eatinger
  ku gelek\u00ee hewl dide ciwan\u00ean Kurd ji cewhera wan d\u00fbr bix\u00eene,
  li ser xeta berxwed\u00ear a dayik\u00ean Kurd \u00ean ku afir\u00eener\u00ean ziman,
  \u00e7and \u00fb d\u00eeroka me ne, me\u015fiya \u00fb bi daxwazeke mezin xwed\u00ee
  li ziman\u00ea Kurd\u00ee derket, li ser v\u00ea bingeh\u00ea li \u00e7iy\u00ea
  t\u00eako\u015f\u00eeneke xurt me\u015fand.\\nHevr\u00eaya me Ros\u00eeda li \u00e7iyay\u00ean
  Kurdistan\u00ea xwe gihand cewhera xwe \u00fb PKK''\u00ea, li nava ref\u00ean xwedawend\u00ean
  azad \u00ean ku \u00e7iyay\u00ean p\u00eeroz ji xwe re kirine war, b\u00fb yek ji
  wan p\u00ea\u015fengan ku jiyana n\u00fb afirand. Hevr\u00eaya me perwerdeya xwe
  ya ger\u00eelatiy\u00ea ya bingeh\u00een bi serketineke mezin qedand, weke jineke
  ciwan b\u00fb mil\u00eetaneke p\u00ea\u015feng a \u00cedeolojiya Azadiy\u00ea ya
  Jin\u00ea ku ji aliy\u00ea R\u00eaber Apo ve hatiye afirandin. Hevr\u00eaya me li
  gelek qad\u00ean cuda ma, li her qada ku l\u00ea ma bi hevr\u00eay\u00ean xwe re
  b\u00fb yek, bi ruhek\u00ee komunal tevl\u00ee kar b\u00fb, p\u00ea\u015feng\u00ee
  ji hevr\u00eay\u00ean xwe re kir ku bi xurt\u00ee be\u015fdar\u00ee kar bibin \u00fb
  di demeke kurt de b\u00fb ger\u00eelayeke \u015fareza. Bi gotina, ''Dilsoziya bi
  \u00e7iy\u00ea, hevr\u00eayan \u00fb xwezay\u00ea re ji bo min esas\u00ea bingeh\u00een
  \u00ea mil\u00eetaniy\u00ea ye'' dilsoziya xwe ya bi hevr\u00eay\u00ean xwe \u00fb
  xaka p\u00eeroz a Kurdistan\u00ea re bi reng\u00ea her\u00ee cewher\u00ee an\u00ee
  ziman. Hevr\u00eaya me Ros\u00eeda nirx\u00ean ku \u015feh\u00eed\u00ean me y\u00ean
  nemir bi xw\u00eena xwe afirandine, bi xurt\u00ee li wan xwed\u00ee derket \u00fb
  ji bo wan p\u00ea\u015f ve bibe \u00e7i ji dest\u00ea w\u00ea hat kir.\\nDi ser\u00ee
  de li Hevserokatiya me ya Konseya R\u00eaveber a KCK''\u00ea \u00fb Fermandariya
  me ya Biryargeha Navend\u00ee ya Parastina Gel di kar\u00ean her\u00ee stratej\u00eek
  de bi daxwazeke mezin kar\u00ea \u00e7apemen\u00ee, we\u015fand \u00fb propaganday\u00ea
  bi rengek\u00ee profesyonel kir. Di kar\u00ea \u00e7apemen\u00ee we\u015fan\u00ea
  de ti car\u00ee xwe bi yek al\u00ee bi s\u00eenorkir\u00ee nehi\u015ft, p\u00ea\u015fketina
  pir al\u00ee ji xwe re kir esas, her kar\u00ea ku me\u015fand bi hunereke mezin
  p\u00eak an\u00ee, b\u00fb mil\u00eetanek ku ji her al\u00ee ve xwe \u015fareza
  kir \u00fb xist prat\u00eek\u00ea. Hevr\u00eaya me Ros\u00eeda xwe gihand w\u00ea
  ast\u00ea ku bi tena ser\u00ea xwe m\u00eena art\u00ea\u015feke \u00e7apemeniy\u00ea
  bixebite. Hevr\u00eaya me ji xwe re kir esas ku bexwedana ger\u00eela ya ku her
  k\u00ealiya xwe d\u00eerok\u00ee ye bigih\u00eene gel\u00ea me, li \u00e7iyay\u00ean
  Kurdistan\u00ea weke mil\u00eetaneke propaganday\u00ea ya p\u00ea\u015feng kar kir.
  Bi kar\u00ea xwe, bi bernamey\u00ean ku p\u00ea\u015fk\u00ea\u015f dikir, bi niv\u00ees\u00ean
  xwe \u00fb bi pirt\u00fbk\u00ean amade kir tevkariyeke gelek\u00ee mezin li t\u00eako\u015f\u00eena
  azadiy\u00ea ya gel\u00ea me kir. Di perwerdekirina gel\u00ea me, ciwan\u00ean Kurd
  \u00fb hevr\u00eay\u00ean xwe de bi rola xwe rab\u00fb. Bi kar\u00ean xwe, eniya
  \u015fer\u00ea taybet a dijmin lawaz kir, her car\u00ea beral\u00ee kir \u00fb b\u00fb
  kedkareke mezin a ku doza mafdar a gel\u00ea Kurd mezin kir. Hevr\u00eaya me Ros\u00eeda
  di qada \u00e7apemeniy\u00ea de gelek hevr\u00ea perwerde kir \u00fb Ger\u00eelay\u00ean
  Azadiy\u00ea y\u00ean Kurdistan\u00ea ji gel\u00ea me \u00fb raya gi\u015ft\u00ee
  ya c\u00eehan\u00ea re ragihand. Di v\u00ea p\u00eavajoy\u00ea de ti car\u00ee xwe
  ji perwedekirina xwe neda al\u00ee, ji k\u00eamasiy\u00ean xwe ders\u00ean p\u00eaw\u00eest
  wergirt \u00fb h\u00een bi xurt\u00ee tevl\u00ee b\u00fb. Bi enerj\u00ee, moral
  \u00fb co\u015fa xwe bandor li hevr\u00eay\u00ean xwe hem\u00fbyan kir. Bi t\u00eakiliy\u00ean
  xurt \u00ean bi hevr\u00eay\u00ean xwe re di dil\u00ea her hevr\u00eay\u00ean xwe
  de b\u00fb cihek\u00ee taybet ku ney\u00ea jib\u00eerkirin.\\nDema ku p\u00eaw\u00eest\u00ee
  p\u00ea heb\u00fb carna dib\u00fb kedkarek ku rojname belav dikir, carna dib\u00fb
  niv\u00eeskareke hosta, li zindan\u00ea dib\u00fb berxwed\u00earek, dib\u00fb p\u00ea\u015fk\u00ea\u015fvaneke
  bi bandor, dib\u00fb mamosteyeke Kurd\u00ee, ed\u00eetoreke \u015fareza, dema ku
  p\u00eaw\u00eest\u00ee p\u00ea heb\u00fb dib\u00fb hevr\u00ea \u00fb fermandareke
  xurt. Hevr\u00eaya me Ros\u00eeda ji xwe re dikir esas ku tevl\u00ee her qedemeya
  t\u00eako\u015f\u00eena azadiy\u00ea bibe. Pi\u015ft\u00ee ku kar\u00ea \u00e7apemeniya
  azad bi salan bi e\u015fqeke mezin me\u015fand, di demek\u00ea de ku \u00eari\u015f\u00ean
  dagirkeriy\u00ea giran b\u00fb bi qas\u00ee p\u00ean\u00fbs \u00fb kameray xwe her
  wiha \u00e7eka xwe bi e\u015fqeke mezin hemb\u00eaz kir \u00fb derbas\u00ee Zap\u00ea
  b\u00fb. Li hember\u00ee \u00eari\u015f\u00ean dewleta Tirk a dagirker \u00ean li
  ser Zap\u00ea weke mil\u00eetan \u00fb fermandareke YJA Star\u00ea li ref\u00ean
  her\u00ee p\u00ea\u015f tevl\u00ee t\u00eako\u015f\u00een\u00ea b\u00fb. Li Mamre\u015fo,
  Gir\u00ea Sor, Zend\u00fbra \u00fb Werxel\u00ea bi soza dilsoziya bi \u015feh\u00eed\u00ean
  mezin re tevl\u00ee berxwedana d\u00eerok\u00ee b\u00fb, li Qada Berxwedan\u00ea
  ya Kurojahro b\u00fb par\u00e7eyek ji berxwedan\u00ea. Hevr\u00eaya me Ros\u00eeda
  ku yek ji mil\u00eetan\u00ean destp\u00eak\u00ea b\u00fb ku bersiv da \u00eari\u015f\u00ean
  dagirkeriy\u00ea, tevl\u00ee \u00e7alakiy\u00ean li dij\u00ee dijmin b\u00fb. Hevr\u00eaya
  me Ros\u00eeda ku fermandar\u00ee ji yek\u00eene \u00fb t\u00eem\u00ean ger\u00eela
  y\u00ean pispor re kir, bi taybet\u00ee li Qada Berxwedan\u00ea ya Kurojahro li
  gel hevr\u00eay\u00ean me \u015eeh\u00eed Mizg\u00een Ronah\u00ee, \u015eeh\u00eed
  Binev\u015f Agal, \u015eeh\u00eed \u00c7iya Amed \u00fb \u015eeh\u00eed R\u00ead\u00fbr
  mil bi mil li dij\u00ee dijmin bi fedakar\u00ee \u015fer kir \u00fb b\u00fb h\u00eamaneke
  bingeh\u00een a p\u00eavajoya destan\u00ee. Hevr\u00eaya me ku di p\u00eavajoya
  \u015fer de gelek caran bi \u00eari\u015f\u00ean dijmin re r\u00fb bi r\u00fb ma
  \u00fb bir\u00eendar b\u00fb, ti car\u00ee pa\u015fve gav neav\u00eat \u00fb weke
  jineke Kurd a xurt \u00fb fermandareke YJA Star\u00ea t\u00eako\u015f\u00eena xwe
  bi biryardar\u00ee me\u015fand. Di nava s\u00ea sal\u00ean daw\u00ee de berxwedana
  li Zap\u00ea ya bi ruh\u00ea feda\u00ee hate me\u015fandin tevl\u00ee kesayetiya
  xwe kir \u00fb ji bo serketin\u00ea b\u00ea fikar \u015fer kir.\\nHevr\u00eaya me
  Ros\u00eeda di 17''\u00ea Adara 2024''an de tev\u00ee du hevr\u00eay\u00ean xwe
  \u015feh\u00eed b\u00fb. Bi hewldan, ked, kesayet\u00ee, tevl\u00eeb\u00fbn \u00fb
  t\u00eako\u015f\u00eena xwe b\u00fb mil\u00eetana p\u00ea\u015feng \u00fb deng\u00ea
  azad \u00ea li \u00e7iy\u00ea y\u00ea kevne\u015fopiya \u00e7apemeniya azad. Em
  careke din soz didin ku b\u00eeran\u00eena h\u00eaja ya hevr\u00eaya me Ros\u00eeda
  \u00fb \u015feh\u00eed\u00ean me y\u00ean nemir li pey xwe hi\u015ftin, me\u015fa
  xwe ya R\u00eaber\u00ea Azad \u00fb Kurdistana Azad bi ser bix\u00eenin \u00fb bi
  v\u00ee reng\u00ee heta dawiy\u00ea xwed\u00ee li b\u00eeran\u00eena wan derkevin.\\nMAZL\u00dbM
  DOGAN\\nHevr\u00eay\u00ea me Mazl\u00fbm Dogan li nav\u00e7eya \u015e\u00earawa
  ya Efr\u00een\u00ea li nava malbateke welatpar\u00eaz ji dayik b\u00fb. Ji ber welatpar\u00eaziya
  malbat\u00ea, h\u00een bi\u00e7\u00fbkan\u00ee partiya me PKK nas kir. Ji ber gotin\u00ean
  malbat\u00ea \u00fb derdor\u00ea gir\u00eengiya t\u00eako\u015f\u00eena ger\u00eela,
  R\u00eaber Apo \u00fb PKK''\u00ea ya ji bo gel\u00ea me f\u00eahm kir. Ji ber v\u00ea
  yek\u00ea tim\u00ee heyran\u00ea ger\u00eela b\u00fb \u00fb tim\u00ee dixwest, rojek\u00ea
  bibe ger\u00eela. Pi\u015ft\u00ee ku \u015eore\u015fa Azadiy\u00ea ya Rojava destp\u00ea
  kir, hevr\u00eay\u00ea me be\u015fdar\u00ee nava kar\u00ean \u015fore\u015f\u00ea
  b\u00fb, destp\u00eak\u00ea tevl\u00ee kar\u00ean ciwan\u00ean \u015fore\u015fger
  welatpar\u00eaz b\u00fb. Bi v\u00ee kar\u00ee re ku du salan di nav de b\u00fb t\u00eako\u015f\u00eena
  me ya azadiy\u00ea ya li \u00e7ar aliy\u00ean Kurdistan\u00ea \u00fb rastiya R\u00eaber
  Apo h\u00een b\u00eahtir ji n\u00eaz ve nas kir. Dema ku \u00eari\u015f\u00ean \u00e7eteyan
  li ser \u015eore\u015fa Azadiy\u00ea ya Rojava destp\u00ea kir, ji bo wez\u00eefeya
  parastina gel\u00ea me bi cih b\u00eene hevr\u00eay\u00ea me tevl\u00ee nava h\u00eaz\u00ean
  parastin\u00ea b\u00fb.\\nDema ku \u00e7etey\u00ean bi pi\u015ftgiriya dewleta Tirk
  bi taybet\u00ee li Heleb \u00fb Koban\u00ea \u00eari\u015f birin ser destketiy\u00ean
  gel\u00ea me, hevr\u00eay\u00ea me Mazl\u00fbm gelek\u00ee bi h\u00ears b\u00fb.
  Hevr\u00eay\u00ea me zan\u00eeb\u00fb ku ten\u00ea bi t\u00eako\u015f\u00eeneke
  xurt a li dij\u00ee \u00e7eteyan dikare h\u00eajay\u00ee gel\u00ea me bibe, li ser
  v\u00ea bingeh\u00ea be\u015fdar\u00ee \u00e7eper\u00ean \u015fer b\u00fb. Tevl\u00ee
  gelek p\u00eangav\u00ean \u015fore\u015fger\u00ee y\u00ean li dij\u00ee \u00e7etey\u00ean
  El N\u00fbsa, DA\u00ce\u015e''\u00ea \u00fb gelek kom\u00ean din \u00ean \u00e7ete
  b\u00fb, di van p\u00eangavan de tecr\u00fbbeyeke gir\u00eeng a \u015fer wergirt.
  Hevr\u00eay\u00ea me di gelek bran\u015fan de xwe bi P\u00ea\u015f ve bir \u00fb
  ji aliy\u00ea le\u015fker\u00eev e \u015fareza kir. Di heman dem\u00ea de xwe di
  felsefeya R\u00eaber Apo de bi p\u00ea\u015f ve bir \u00fb b\u00fb mil\u00eetanek\u00ee
  ba\u015f \u00ea Apoy\u00ee. Pi\u015ft\u00ee ku dewleta Tirk di sala 2018''an de
  \u00eari\u015fa dagirkeriy\u00ea bir ser Efr\u00een\u00ea, hevr\u00eay\u00ea me
  tevl\u00ee eniy\u00ean her\u00ee p\u00ea\u015f b\u00fb, li dij\u00ee art\u00ea\u015fa
  Tirk be\u015fdar\u00ee gelek \u00e7alakiy\u00ean bi bandor b\u00fb. Ji bo Efr\u00een
  a ku l\u00ea ji dayik b\u00fb \u00fb mezin b\u00fb ji aliy\u00ea dewleta Tirk ve
  ney\u00ea dagirkirin bi fedakar\u00ee \u00fb w\u00earekiyeke mezin \u015fer kir,
  di v\u00ea p\u00eavajoya \u015fer de bi tevl\u00eeb\u00fbna xwe ya bi reng\u00ea
  feda\u00ee ji hevr\u00eay\u00ean xwe hem\u00fbyan re b\u00fb m\u00eenak. Tev\u00ee
  ku di p\u00eavajoya \u015fer de bir\u00eendar b\u00fb k\u00ealiyek\u00ea j\u00ee
  xwe ji t\u00eako\u015f\u00een\u00ea neda al\u00ee. Bi v\u00ea n\u00eaz\u00eekatiya
  xwe weke yek ji leheng\u00ean \u015fer di nava gel\u00ea me y\u00ea Efr\u00een\u00ea
  de b\u00fb xwed\u00ee cihek\u00ee gir\u00eeng. dema ku bajar\u00ea l\u00ea dima
  hate dagirkirin, h\u00earsa w\u00ee ya li hember\u00ee dewleta Tirk h\u00een mezin
  b\u00fb \u00fb derbas\u00ee qad\u00ean n\u00fb y\u00ean t\u00eako\u015f\u00een\u00ea
  b\u00fb. Hevr\u00eay\u00ea me be\u015fdar\u00ee berxwedana li Ser\u00eakaniy\u00ea
  b\u00fb ku dewleta Tirk bi r\u00eabaz\u00ean li dervey\u00ee mirovahiy\u00ea \u00eari\u015f\u00ee
  v\u00ea her\u00eam\u00ea j\u00ee dikir \u00fb li v\u00ea der\u00ea h\u00earsa xwe
  ya li dij\u00ee dijmin di \u00e7alakiyan de n\u00ee\u015fan da. Hev\u00eay\u00ea
  me di \u00e7alakiyek\u00ea de bi giran\u00ee bir\u00eendar b\u00fb, dilxwaziya xwe
  ya t\u00eako\u015f\u00een\u00ea parast \u00fb di demeke kurt de xwe kom\u00ee ser
  hev kir. Hevr\u00eay\u00ea me di nava du berxwedan\u00ean li dij\u00ee dewleta Tirk
  a dagirker de rastiya dewleta Tirk ji n\u00eaz ve nas kir \u00fb biryardariya xwe
  ya ji bo mezinkirina t\u00eako\u015f\u00een\u00ea z\u00eade kir. Hevr\u00eay\u00ea
  me Mazl\u00fbm zan\u00eeb\u00fb ku ev yek j\u00ee ten\u00ea bi tevl\u00eeb\u00fbna
  li nava ref\u00ean ger\u00eela dibe \u00fb ji bo armanca xwe ya zarokatiy\u00ea
  p\u00eak b\u00eene ber\u00ea xwe da \u00e7iyay\u00ean Kurdistan\u00ea.\\nJi bo h\u00een\u00ee
  jiyana ger\u00eela \u00fb \u00e7iy\u00ea bibe di destp\u00eak\u00ea de ji bo demeke
  kurt be\u015fdar\u00ee perwerdey\u00ea b\u00fb, perwerde bi rengek\u00ee serket\u00ee
  qedand \u00fb derbas\u00ee kar\u00ean prat\u00eek\u00ee b\u00fb. Bi kesayetiya xwe
  ya bi daxwaz \u00fb bi co\u015f h\u00een\u00ee jiyana ger\u00eela \u00fb \u00e7iy\u00ea
  b\u00fb, ji bo xwe di hunera \u015fer\u00ea ger\u00eela de bi p\u00ea\u015f ve bibe
  ked da. Hevr\u00eay\u00ea me destp\u00eak\u00ea xwest bi hewldan\u00ean xwe, xwe
  bi p\u00ea\u015f ve bibe. Pi\u015ftre be\u015fdar\u00ee perwerdeya pisporiy\u00ea
  b\u00fb \u00fb xwest di p\u00eavajoya \u015fer\u00ea giran de bi rengek\u00ee \u00e7alak
  tevl\u00ee bibe. Di perwerdey\u00ea de ne ten\u00ea ji aliy\u00ea le\u015fker\u00ee
  ve ji aliy\u00ea \u00eedeoloj\u00eek ve j\u00ee xwe perwerde kir \u00fb gih\u00ee\u015ft
  w\u00ea baweriy\u00ea ku ten\u00ea bi \u015farezab\u00fbna ji aliy\u00ea \u00eedeoloj\u00eek
  ve dikare wez\u00eefey\u00ean dem\u00ea b\u00eak\u00eamas\u00ee bi cih b\u00eene.
  Hevr\u00eay\u00ea me Mazl\u00fbm perwerdeya xwe bi serket\u00ee temam kir, pi\u015ftre
  bi israr xwest derbas\u00ee wan her\u00eaman bibe ku \u015fer l\u00ea giran b\u00fb.
  Bi sekna xwe ya li nava jiyan\u00ea \u00fb tevl\u00eeb\u00fbna xwe ya xurt bawer\u00ee
  da hevr\u00eay\u00ean xwe, gih\u00ee\u015ft armanca xwe \u00fb tevl\u00ee nava yek\u00eeney\u00ean
  ger\u00eela y\u00ean n\u00eev bi tevger b\u00fb.\\nLi her her\u00eama ku \u00eari\u015f\u00ean
  dagirkeriy\u00ea y\u00ean dijmin l\u00ea heb\u00fb, hevr\u00eay\u00ea me Mazl\u00fbm
  bi rengek\u00ee \u00e7alak tevl\u00ee berxwedana li dij\u00ee dagirkeran b\u00fb,
  bi taybet\u00ee bi h\u00eaza manew\u00ee ya ji hevr\u00eay\u00ean li tunelan wergirt\u00ee
  ji her al\u00ee ve xwest t\u00eako\u015f\u00eena xwe mezin bike. Hevr\u00eay\u00ea
  me Mazl\u00fbm ku bi w\u00earek\u00ee \u00fb fedakariya xwe dihate naskirin, ji
  bo gelek \u00e7alakiyan bi ser bix\u00eene hewl da, ked da. Hevr\u00eay\u00ea me
  ku kesayetiya xwezay\u00ee ya Efr\u00een\u00ea di \u015fexs\u00ea xwe de tems\u00eel
  kir, q\u00eemet\u00ea ku dida hevr\u00eay\u00ean xwe bi \u00e7alakiy\u00ean xwe
  n\u00ee\u015fan da. Hevr\u00eay\u00ea me Mazl\u00fbm di heman dem\u00ea de ji dil
  \u00fb durst tevl\u00ee b\u00fb \u00fb bi v\u00ea taybetmendiya xwe li nava hevr\u00eay\u00ean
  xwe hem\u00fbyan b\u00fb cih\u00ea hurmet \u00fb hezkirin\u00ea.\\nHevr\u00eay\u00ea
  me Mazl\u00fbm di 17''\u00ea Adar\u00ea de \u015feh\u00eed b\u00fb. Em soza xwe
  dubare dikin ku t\u00eako\u015f\u00eena w\u00ee ji me re hi\u015ftiye ji bo b\u00eeran\u00eena
  \u015feh\u00eedan hem\u00fbyan bi ser bix\u00eenin.\\nBERXWEDAN QAMI\u015eLO\\nHevr\u00eay\u00ea
  me Berxwedan li nava malbateke ji gel\u00ea me y\u00ea Ereb \u00ea li Qami\u015floy\u00ea
  ji dayik b\u00fb. Bi saya terbiyeya ji malbata xwe wergirt\u00ee \u00fb \u00e7anda
  Ereb a bi kok, bi rengek\u00ee dilsoz\u00ea nirx\u00ean xwe y\u00ean cewher\u00ee
  mezin b\u00fb. Di sal\u00ean destp\u00eak\u00ea y\u00ean \u015eore\u015fa Azadiy\u00ea
  ya Rojava de hevr\u00eay\u00ea me ku h\u00een ciwan b\u00fb, di nava \u015fore\u015f\u00ea
  de mezin b\u00fb. Ji ber v\u00ea yek\u00ea j\u00ee firsend d\u00eet ku hem\u00fb
  p\u00eavajoy\u00ean \u015fore\u015fa azadiy\u00ea bi\u015fop\u00eene. Di sal\u00ean
  ji \u00eari\u015f\u00ean giran \u00ean \u00e7etey\u00ean DA\u00ce\u015e''\u00ea
  de \u015fahid\u00ee ji berxwedana destan\u00ee ya h\u00eaz\u00ean azadiy\u00ea y\u00ean
  Rojava re kir. Hevr\u00eay\u00ea me z\u00fb p\u00ea hesiya ku ti eleqeya kiryar\u00ean
  \u00e7etey\u00ean DA\u00ce\u015e''\u00ea bi Misilmantiy\u00ea n\u00eene ku \u00eed\u00eea
  dikir bi nav\u00ea ola \u00ceslam\u00ea \u015fer dike. Bi v\u00ee reng\u00ee h\u00earsa
  w\u00ee ya li hember\u00ee \u00e7eteyan mezin b\u00fb. Hevr\u00eay\u00ea me Berxwedan
  qeb\u00fbl nekir ku kiryar\u00ean li dervey\u00ee mirovahiy\u00ea y\u00ean \u00e7etey\u00ean
  DA\u00ce\u015e''\u00ea bi gel\u00ea Ereb \u00fb \u00ceslam\u00ea re weke hev b\u00ea
  d\u00eetin, baweriya xwe bi w\u00ea yek\u00ea an\u00ee ku c\u00eehaneke ji jiyana
  bi hev re ya gelan \u00fb baweriyan p\u00eakan e. Hevr\u00eay\u00ea me d\u00eet
  ku \u015eore\u015fa Azadiy\u00ea ya Rojava roj bi roj v\u00ea xeyala w\u00ee p\u00eak
  t\u00eene, lewma xwest \u015fore\u015fa azadiy\u00ea h\u00een b\u00eahtir ji n\u00eaz
  ve nas bike.\\nJi bo v\u00ea j\u00ee destp\u00eak\u00ea tevl\u00ee nava kar\u00ean
  ciwanan b\u00fb. Di v\u00ea p\u00eavajoy\u00ea de hevr\u00eay\u00ea me derfet d\u00eet
  ku R\u00eaber Apo nas bike, ji felsefeya Apoy\u00ee gelek\u00ee bi bandor b\u00fb.
  Bi taybet\u00ee ji perspekt\u00eefa Neteweya Demokrat\u00eek bi bandor b\u00fb ku
  gel hem\u00fb di nav de dikarin bi rengek\u00ee azad b\u00eane tems\u00eelkirin.
  Hevr\u00eay\u00ea me baweriya xwe bi w\u00ea yek\u00ea an\u00ee ku pa\u015feroja
  azad a ku ew dixwaze ten\u00ea bi fikr\u00ean R\u00eaber Apo dikare p\u00eak were.
  Lewma bi te\u015fw\u00eeqa ciwan\u00ean Ereb \u00ean ref bi ref tevl\u00ee nava
  \u015fore\u015f\u00ea dib\u00fbn, biryar da ku t\u00eako\u015f\u00eena xwe h\u00een
  mezin bike. Sekna h\u00eaz\u00ean azadiy\u00ea y\u00ean Rojava ku ji bo destketiy\u00ean
  gel\u00ean me bi rengek\u00ee feda\u00ee parastin \u00fb di nava ti \u015fert \u00fb
  merc\u00ee de dagirker\u00ee qeb\u00fbl nekirin, kir ku hevr\u00eay\u00ea me Berxwedan
  tevl\u00ee nava yek\u00eeney\u00ean berxwedan\u00ea bibe. Hevr\u00eay\u00ea me bi
  perwerdeyan xwe ji aliy\u00ea le\u015fker\u00ee ve bi p\u00ea\u015f ve bir \u00fb
  di demeke kurt de tevl\u00ee \u00e7alakiy\u00ean li dij\u00ee \u00e7eteyan b\u00fb.
  Hevr\u00eay\u00ea me xwe di bran\u015fa \u00e7ek\u00ean giran de perwerde kir \u00fb
  di \u00e7alakiyan de kedeke mezin da ku serketin\u00ean gir\u00eeng b\u00eane bidestxistin.
  Tev\u00ee ku di \u00e7alakiyek\u00ea de ji ling\u00ea xwe bir\u00eendar b\u00fb,
  di demeke kurt de xwe kom\u00ee ser hev kir \u00fb t\u00eako\u015f\u00eena xwe dewam
  kir. Hevr\u00eay\u00ea me zan\u00eeb\u00fb ku \u00eari\u015f\u00ean \u00e7eteyan
  \u00ean li ser \u015eore\u015fa Azadiy\u00ea ya Rojava bi dest\u00ea dewleta Tirk
  t\u00ea kirin, lewma li hember\u00ee dewleta Tirk b\u00fb xwed\u00ee h\u00earseke
  mezin. Pi\u015ft\u00ee ku dewleta Tirk li Gir\u00ea Sp\u00ee \u00fb Ser\u00eakaniy\u00ea
  dest bi \u00eari\u015f\u00ean dagirkreiy\u00ea kir \u00fb bi r\u00eaya van \u00eari\u015fan
  xwest li ser gel\u00ean Rojhilata Nav\u00een serwer bibe, h\u00earsa hevr\u00eay\u00ea
  me Berxwedan h\u00een mezin b\u00fb. Li hember\u00ee dewleta Tirk a ku ji d\u00eerok\u00ea
  heta niha li her devera dagir kiriye zilm\u00ea li gelan dike, hevr\u00eay\u00ea
  me Berxwedan baweriya xwe bi w\u00ea yek\u00ea an\u00ee ku div\u00ea li ber van
  \u00eari\u015f\u00ean dagirkeriy\u00ea rabe \u00fb ji bo v\u00ea j\u00ee div\u00ea
  t\u00eako\u015f\u00eena xwe mezin bike. Hevr\u00eay\u00ea me zan\u00eeb\u00fb ku
  ev yek j\u00ee ten\u00ea bi tevl\u00eeb\u00fbna li nava nref\u00ean ger\u00eela
  y\u00ean li \u00e7iyay\u00ean Kurdistan\u00ea dibe \u00fb xwe gihand \u00e7iyay\u00ean
  azad ku bi co\u015feke mezin li bend\u00ea b\u00fb.\\nHevr\u00eay\u00ea me Berxwedan
  ku bi daxwaz \u00fb kelecaneke mezin tevl\u00ee perwerdeya xwe ya destp\u00eak\u00ea
  b\u00fb, h\u00een ji roja destp\u00eak\u00ea ya ger\u00eelatiya xwe ve h\u00een\u00ee
  jiyana \u00e7iy\u00ea b\u00fb. Bi e\u015fqeke mezin bi \u00e7iy\u00ea ve hate gir\u00eadan
  ku d\u00fbr\u00ee s\u00eestema kap\u00eetal\u00eest e \u00fb derfet\u00ean azadiy\u00ea
  l\u00ea b\u00ea daw\u00ee ne. Hevr\u00eay\u00ea me bi taybet\u00ee ji t\u00eakiliy\u00ean
  hevr\u00eatiy\u00ea y\u00ean ger\u00eela \u00fb jiyana komunal bi bandor b\u00fb.
  Hevr\u00eay\u00ea me gih\u00ee\u015ft w\u00ea baweriy\u00ea ku di v\u00ea di hunera
  \u015fer\u00ea ger\u00eela de xwe \u015fareza bike \u00fb b\u00fb xwed\u00ee tevl\u00eeb\u00fbneke
  bi fedakar\u00ee. Hevr\u00eay\u00ea me Berxwedan dixwest demek beriya demek\u00ea
  li hember\u00ee dewleta Tirk \u015fer bike, ji bo v\u00ea j\u00ee xwest bi\u00e7e
  wan her\u00eama ku \u015fer l\u00ea giran b\u00fb. L\u00ea bel\u00ea hevr\u00eay\u00ea
  me zan\u00eeb\u00fb ku div\u00ea beriya w\u00ea di takt\u00eek\u00ean ger\u00eela
  y\u00ean dema n\u00fb de xwe bi p\u00ea\u015f ve bibe \u00fb ji bo demek\u00ea tevl\u00ee
  perwerdeya le\u015fker\u00ee b\u00fb. Hevr\u00eay\u00ea me di perwerdey\u00ea de
  di takt\u00eeka ger\u00eela ya dema n\u00fb de xwe \u015fareza kir \u00fb ber\u00ea
  xwe da qad\u00ean ji \u015fer\u00ea giran.\\nHevr\u00eay\u00ea me Berxwedan tevl\u00ee
  berxwedana destan\u00ee b\u00fb ku hem bi tunel\u00ean berxwedan\u00ea, hem j\u00ee
  bi t\u00eem\u00ean ger\u00eela y\u00ean n\u00eev tevgera dihate me\u015fandin. Bi
  \u00eed\u00eea \u00fb biryardariyeke mezin li ber \u00eari\u015f\u00ean dijmin rab\u00fb.
  Li gel \u00eari\u015f\u00ean art\u00ea\u015fa Tirk a qirker \u00ean bi \u00e7ek\u00ean
  qedexekir\u00ee \u00fb k\u00eemyew\u00ee gavek\u00ea j\u00ee xwe ji xeta berxwedan\u00ea
  neda al\u00ee, bi tevl\u00eeb\u00fbna xwe ya b\u00ea fikar \u00fb bi w\u00earek\u00ee
  li nava hevr\u00eay\u00ean xwe b\u00fb cih\u00ea hurmet\u00ea. Hevr\u00eay\u00ea
  me Berxwedan ku di heman dem\u00ea de durust \u00fb dilsoz\u00ea nirx\u00ean azadiy\u00ea
  b\u00fb, her wiha bawer\u00ee dida hevr\u00eay\u00ean xwe. \u015eehadeta gelek hevr\u00eay\u00ean
  w\u00ee bandor l\u00ea kkiribe j\u00ee ev yek ji xwe re kir zem\u00eena mezinkirina
  t\u00eako\u015f\u00een\u00ea. Hevr\u00eay\u00ea me zan\u00eeb\u00fb ku bi bicihan\u00eena
  armanc\u00ean hevr\u00eay\u00ean xwe y\u00ean \u015feh\u00eed dikare xwed\u00ee
  li b\u00eeran\u00eena wan derkeve, ji bo v\u00ea j\u00ee tempoya xwe ya t\u00eako\u015f\u00een\u00ea
  b\u00earawestan bilind kir. Hevr\u00eay\u00ea me Berxwedan ku xwed\u00ee kesayetiyeke
  baldar b\u00fb, her k\u00ealiya xwe bi h\u00eenb\u00fbna ti\u015ft\u00ean n\u00fb
  derbas kir. Bi taybet\u00ee dixwest di hunera \u015fer\u00ea ger\u00eela de xwe
  bi p\u00ea\u015f ve bibe \u00fb b\u00fb yek ji hevr\u00eay\u00ean h\u00eaja ku bi
  p\u00ea\u015f diket.\\nHevr\u00eay\u00ea me Berxwedan di 17''\u00ea Adara 2024''an
  de \u015feh\u00eed b\u00fb \u00fb tevl\u00ee karwan\u00ea \u015feh\u00eedan b\u00fb
  ku tem\u00eenata heb\u00fbna me ye. Em soz didin ku em \u00ea li Rojhilata Nav\u00een
  a Demokrat\u00eek \u00fb Kurdistana azad ku hesreta w\u00ee b\u00fb, xwed\u00ee
  li b\u00eeran\u00eena w\u00ee derkevin.\\\"\"", "\"Di sal\u00ean daw\u00ee de, bi
  danas\u00eena p\u00ea\u015fket\u00eemak\u00eeney\u00ean knitting warp, endustriya
  tekst\u00eel\u00ea ketiye ber guher\u00een\u00ean mezin.Van mak\u00eeneyan di p\u00eavajoya
  hilber\u00een\u00ea de bi z\u00eadekirina kar\u00eeger\u00ee, lez \u00fb berbelavb\u00fbn\u00ea
  ve \u015fore\u015f kirin.Di v\u00ea gotara n\u00fb\u00e7ey\u00ea de, em \u00ea taybetmend\u00ee
  \u00fb feydey\u00ean sereke y\u00ean mak\u00eeney\u00ean knitkirina warp \u00fb
  bandora wan li ser p\u00ee\u015fesaziya tekst\u00eel\u00ea bikolin.Ragihandina mak\u00eeneya
  \u015f\u00fb\u015ftin\u00ea ya warp: Mak\u00eeneya \u015f\u00fb\u015ftin\u00ea mak\u00eeneyek
  tekst\u00eel\u00ea ye ku ji bo hilberandina quma\u015f\u00ean bir\u00eak\u00fbp\u00eak
  hat\u00ee \u00e7\u00eakirin bi t\u00eakelkirina r\u00ee\u015fan bi dir\u00eajah\u00ee
  (warp) bi karan\u00eena derziy\u00ean paralel ve hat\u00ee \u00e7\u00eakirin.Berevaj\u00ee
  mak\u00eeney\u00ean tevnhevkirina pez\u00ea y\u00ean kevne\u015fop\u00ee y\u00ean
  ku bi tevhevkirina x\u00eaz\u00ean hor\u00eezontal dixebitin, mak\u00eeney\u00ean
  knitkirina warp di war\u00ea hilber\u00eener\u00ee, avahiya quma\u015f\u00ea \u00fb
  kapas\u00eetey\u00ean s\u00eawiran\u00ea de avantaj\u00ean b\u00eahempa peyda dikin.\\nTaybetmend\u00ee
  \u00fb p\u00ea\u015fkeftin\u00ean sereke: Leza \u00fb Hilber\u00eeneriya Bilind:
  Mak\u00eeney\u00ean kinc\u00ea y\u00ean Warp bi lez \u00fb berberiya xwe ya h\u00eaja
  t\u00eane zan\u00een.Van mak\u00eeneyan dikarin quma\u015fan bi lez \u00fb beztir
  li gor\u00ee teknolojiy\u00ean din \u00ean tevnhevkirin\u00ea hilber\u00eenin, bi
  gir\u00eeng\u00ee dem\u00ean hilber\u00een\u00ea k\u00eam dikin \u00fb dih\u00eale
  ku hilber\u00eener karibin daxwaz\u00ean mezin \u00ean bazar\u00ea bic\u00eeh b\u00eenin.Firehiya
  Mak\u00eeneya Berfireh: Mak\u00eeney\u00ean kinc\u00ea y\u00ean Warp di c\u00fbrbec\u00fbr
  p\u00eevanan de peyda dibin, ku firehiy\u00ean mak\u00eeney\u00ea y\u00ean berfireh
  p\u00ea\u015fk\u00ea\u015f\u00ee dikin da ku c\u00fbrbec\u00fbr firehiy\u00ean quma\u015f\u00ea
  bic\u00eeh b\u00eenin.Ev \u015fiyana hilber\u00eeneran dih\u00eale ku quma\u015f\u00ean
  ji bo c\u00fbrbec\u00fbr sepanan hilber\u00eenin, di nav de cil, cil \u00fb berg\u00ean
  werz\u00ee\u015f\u00ea, tekst\u00eel\u00ea mal\u00ea, tekst\u00eel\u00ean otomot\u00eev\u00ea
  \u00fb h\u00eaj b\u00eatir.Struktur\u00ean quma\u015f\u00ea y\u00ean berbelav: Yek
  ji avantaj\u00ean sereke y\u00ean mak\u00eeney\u00ean knitkirina warp\u00ea \u015fiyana
  hilberandina c\u00fbrbec\u00fbr struktur\u00ean quma\u015f\u00ea ye.Bi kontrola
  elektron\u00eek\u00ee ya p\u00ea\u015fkeft\u00ee re, van mak\u00eeneyan dikarin
  quma\u015fan bi qalib, tevn \u00fb s\u00eawiran\u00ean cih\u00eareng biafir\u00eenin,
  ji bo afir\u00eener\u00ee \u00fb n\u00fbjeniy\u00ea ji s\u00eawiraner \u00fb hilber\u00eeneran
  re \u00eemkan\u00ean b\u00eas\u00eenor peyda dikin.K\u00eamkirina bermahiy\u00ea:
  Mak\u00eeney\u00ean kinc\u00ea y\u00ean Warp xwed\u00ee taybetmendiy\u00ean yekgirt\u00ee
  ne ku di dema hilber\u00een\u00ea de bermahiy\u00ean rah\u00een k\u00eam dikin.Van
  mak\u00eeneyan tansiyon \u00fb kontrol\u00ea ya her\u00ee ba\u015f peyda dikin,
  p\u00ea\u015f\u00ee li \u015fikestin \u00fb bermahiy\u00ean nehewce digirin, di
  dawiy\u00ea de l\u00ea\u00e7\u00fbn ji bo hilber\u00eeneran xilas dikin.Karkirin
  \u00fb domandin h\u00easan: Mak\u00eeney\u00ean \u015f\u00fb\u015ftin\u00ea y\u00ean
  n\u00fbjen bi navbeynkariya bikarh\u00eaner-heval \u00fb kontrol\u00ean xwer\u00fb
  y\u00ean ku ji bo operator\u00ean n\u00fbjen j\u00ee h\u00easan t\u00eane xebitandin
  t\u00eane saz kirin.Wek\u00ee din, van mak\u00eeneyan bi gelemper\u00ee xwedan taybetmendiy\u00ean
  l\u00eanih\u00ear\u00eena otomat\u00eek\u00ee ne ku kar\u00ean l\u00eanih\u00ear\u00een\u00ea
  y\u00ean r\u00fbt\u00een h\u00easan dikin \u00fb dema xebata gi\u015ft\u00ee ya
  mak\u00eeney\u00ea z\u00eade dikin.\\nSerl\u00eadan \u00fb feydey\u00ean: Hatina
  mak\u00eeney\u00ean \u015f\u00fb\u015ftina warp p\u00ee\u015fesaziya tekst\u00eel\u00ea
  veguherandiye, gelek feyde \u00fb sepanan p\u00ea\u015fk\u00ea\u015f\u00ee dike:
  Cil\u00fbberg \u00fb Mode: Mak\u00eeney\u00ean kinc\u00ean warp bi berfireh\u00ee
  di hilber\u00eena cil \u00fb berg\u00ean moday\u00ea de t\u00eane bikar an\u00een.Ji
  quma\u015f\u00ean sivik, \u015f\u00ear\u00een bigire heya materyal\u00ean bir\u00eak\u00fbp\u00eak
  \u00fb bir\u00eak\u00fbp\u00eak, van mak\u00eeneyan \u00eemkan\u00ean s\u00eawiran\u00ea
  y\u00ean b\u00eadaw\u00ee p\u00ea\u015fk\u00ea\u015f\u00ee dikin, dih\u00ealin s\u00eawiraner\u00ean
  moday\u00ea cil \u00fb berg\u00ean b\u00eahempa \u00fb xwe\u015fik biafir\u00eenin.Tekst\u00ean
  tekn\u00eek\u00ee \u00fb p\u00ee\u015fesaz\u00ee: Mak\u00eeney\u00ean kinc\u00ean
  Warp di hilber\u00eena tekst\u00eel\u00ean tekn\u00eek\u00ee \u00fb p\u00ee\u015fesaziy\u00ea
  de j\u00ee pir gir\u00eeng in.Van tekst\u00eel performansa bilind \u00fb domdar\u00ee
  p\u00ea\u015fk\u00ea\u015f\u00ee dikin \u00fb dikarin di otomot\u00eev\u00ea, hewavan\u00ee,
  filtration, geotextiles, tekst\u00eel\u00ean bij\u00eejk\u00ee \u00fb hwd de werin
  bikar an\u00een.Pirrjimariya mak\u00eeney\u00ean knitkirina warp hilber\u00eena
  quma\u015f\u00ean xwedan taybetmendiy\u00ean taybet\u00ee, wek h\u00eaz, elasticb\u00fbn,
  berxwedana li hember k\u00eemyew\u00ee an germahiy\u00ean zehf gengaz dike.Tekst\u00eel
  \u00fb p\u00ealav\u00ean mal\u00ea:Mak\u00eeney\u00ean knitting WarpDi \u00e7\u00eakirina
  tekst\u00eel\u00ean mal\u00ea de di nav de perde, quma\u015f\u00ean p\u00ealavan,
  niv\u00een \u00fb xal\u00ee\u00e7eyan de rolek gir\u00eeng dil\u00eezin.Qabiliyeta
  afirandina qalib \u00fb n\u00eegar\u00ean tevlihev ji bo xaniyan \u00fb hundur\u00een
  hilber\u00ean tekst\u00eel\u00ea y\u00ean bi d\u00eetbar\u00ee balk\u00ea\u015f
  \u00fb bi kal\u00eete encam dide.Cil \u00fb berg\u00ean werz\u00ee\u015f\u00ea:
  P\u00ee\u015fesaziya cil \u00fb berg\u00ean werz\u00ee\u015f\u00ea ji mak\u00eeney\u00ean
  kinc\u00ean \u00e7ol\u00ea pir s\u00fbd werdigire ji ber ku ew dikarin quma\u015f\u00ean
  bi taybetmendiy\u00ean dir\u00eajkirin \u00fb ba\u015fb\u00fbn\u00ea y\u00ean h\u00eaja
  hilber\u00eenin.Hilber\u00eena bik\u00earhat\u00ee ya cil \u00fb berg\u00ean werz\u00ee\u015f\u00ea,
  cil \u00fb berg\u00ean avjeniy\u00ea \u00fb quma\u015f\u00ean kompresyon\u00ea hewcedariy\u00ean
  dilxwaz\u00ean werz\u00ee\u015f\u00ea y\u00ean performans\u00ea peyda dike.p\u00ea\u015fkeftina
  p\u00ea\u015feroj\u00ea: Her ku teknoloj\u00ee bi p\u00ea\u015f ve di\u00e7e, mak\u00eeney\u00ean
  knitkirina warp j\u00ee p\u00ea\u015fve di\u00e7in.Hilber\u00eener dixebitin ku
  mak\u00eeney\u00ean bi leza bilindtir, otomasyonek mezintir \u00fb kapas\u00eetey\u00ean
  \u00e7\u00eakirina quma\u015f\u00ea p\u00ea\u015fkeft\u00ee p\u00ea\u015f bixin.Digel
  v\u00ea yek\u00ea, domdar\u00ee dibe navendek, \u00fb l\u00eakol\u00een ji bo p\u00ea\u015fdebirina
  mak\u00eeney\u00ean kinc\u00ean x\u00eazkirin\u00ea y\u00ean ku x\u00eaz\u00ean
  hawirdorpar\u00eaz bikar t\u00eenin \u00fb xerckirina enerjiy\u00ea k\u00eam dikin
  t\u00eane me\u015fandin.\\nBi kurtas\u00ee: Danas\u00eena mak\u00eeney\u00ean \u015f\u00fb\u015ftina
  warp\u00ea \u015fore\u015fek p\u00ee\u015fesaziya tekst\u00eel\u00ea kir, p\u00eavajoy\u00ean
  hilber\u00een\u00ea h\u00easan kir \u00fb r\u00eay\u00ean n\u00fb ji afir\u00eener\u00ee
  \u00fb s\u00eawiran\u00ea re vekir.Hilber\u00eena bi leza bilind, \u00e7\u00eakirina
  quma\u015f\u00ea ya berbelav \u00fb k\u00eamb\u00fbna bermahiy\u00ean dar\u00ea
  ten\u00ea hin ji avantaj\u00ean van mak\u00eeneyan in.Digel ser\u00eel\u00eadan\u00ean
  ji moda \u00fb cil \u00fb bergan bigire heya tekst\u00eel\u00ea tekn\u00eek\u00ee
  \u00fb p\u00ee\u015fesaziy\u00ea, mak\u00eeney\u00ean \u015f\u00fb\u015ftina warp
  berdewam dikin \u00fb n\u00fbvekirina bazara tekst\u00eel\u00ea ya c\u00eehan\u00ee
  da ku hewcedar\u00ee \u00fb bendewariy\u00ean xer\u00eedar \u00ean ku her gav diguhezin
  bic\u00eeh b\u00eenin.\\nDema \u015fandin\u00ea: Nov-14-2023\"", "\"Hevpeyv\u00een
  be Koma Awaz\u00ean \u00e7iya re | D\u00earsim Oremar\\n\u201cLi her dera din\u00ea
  ku \u00eerade \u00fb ev\u00een bi hevre bibin heval, jiyan j\u00ee reng\u00ea xwe
  y\u00ea rast\u00een derdixe ber ronahiy\u00ea. Li ser\u00ea \u00e7iyay\u00ean Kurdistan\u00ea
  ev\u00eeneke mezin li pey g\u00fbherandina s\u00eestem\u00ean desthilatdar li Rojhilata
  Nav\u00een di hem\u00fb waran da t\u00eadiko\u015fin. Ji wan re \u015fev \u00fb
  roj weke hevin. Di qad\u00ean siyas\u00ee, civak\u00ee \u00fb huner\u00ee dixwazin
  jiyan\u00ea ber bi ba\u015fiy\u00ea ve bibin.\\nMin xwest bi v\u00ea hevpeyv\u00een
  re v\u00ea rastiy\u00ea ji we xw\u00eenedevan\u00ean h\u00eaja re bidim selmandin.
  Komeke huner\u00ee li ser\u00ea \u00e7iyay\u00ean Kurdistan\u00ea, ke\u00e7 \u00fb
  xurt tev bi hevre dixebitin \u00fb deng\u00ea awaz\u00ean wan ji sinor\u00ean welat\u00ea
  me j\u00ee derketiye\u201d.\\nD\u00earsim Oremar\\nEm \u00e7anda \u015fore\u015fgertiy\u00ea
  tems\u00eel dikin \u00fb dixwazin bikin mal\u00ea gel\u2026\\n\u2013 Koma we di
  \u00e7i salek\u00ea de hat damezirandin, armanc ji damezirandina komek wiha \u00e7i
  b\u00fb?\\n\u2013 Zozan gabar: Cara yekem di sala 2000\u2032 de tam me destp\u00eakir,
  w\u00ea dem\u00ea dibistana \u00e7and \u00fb huner\u00ea bi nav\u00ea dibistana
  \u015feh\u00eed Sefqan hat ava kirin. Di nav de be\u015f\u00ean: \u015fano, muz\u00eek,
  govend \u00fb bi gi\u015ft\u00ee xebat\u00ean \u00e7and\u00ee c\u00eeh digirtin.
  Hejmara endam\u00ean dibistan\u00ea w\u00ea dem\u00ea 80 kes b\u00fb, bi hejmarek\u00ee
  ewqas mezin dibistan hat ava kirin. Dinva w\u00ea dibistan\u00ea de gelek kes\u00ean
  ku niha \u015feh\u00eed b\u00fbne j\u00ee hene, yek ji wan kesan \u015fanoger\u00ea
  me y\u00ea mezin heval H\u00eav\u00ee heb\u00fb, heval Yekta heb\u00fb, heval\u00ea
  R\u00eazan, herwiha ji be\u015fa muz\u00eek\u00ea heval Eg\u00eed heb\u00fb, hevala
  Del\u00eela ku di wan dem\u00ean daw\u00ee de \u015feh\u00eed b\u00fb \u00fb heval\u00ean
  din j\u00ee di xebat\u00ean \u00e7and\u00ee de c\u00eeh digirin ku niha li her\u00eam
  din y\u00ean xebat\u00ea ne. Pir heval\u00ean ku wisa di nava w\u00ea xebat\u00ea
  de c\u00eeh\u00ea xwe girtin hene. Xebata w\u00ea dibistan\u00ea ji wan salan hetan\u00ee
  roja \u00eero j\u00ee berdewam e, herwiha niha j\u00ee nav\u00ea dibistana me dibistana
  \u015feh\u00eed Sefqane.\\n\u00c7ima Dibistaneke wiha hat avakirin?\\n\u2013 Sedema
  serek\u00ee ya ku p\u00eaw\u00eest hat d\u00eetin ew dibistan b\u00ea ava kirin,
  wek t\u00ea zan\u00een em li ser\u00ea wan \u00e7iyan t\u00eako\u015f\u00eenek\u00ea
  didin me\u015fandin, jiyana vir pir cudaye \u00fb gelek aliy\u00ean w\u00ea hene.
  Yan\u00ee em z\u00eadetir dinava \u015fer dane, l\u00ea me xwest ku aliy\u00ea stat\u00eek
  ango xwe\u015fikb\u00fbna w\u00ea jiyan\u00ea j\u00ee b\u00ea d\u00eetin. Xwe\u015fikb\u00fbna
  w\u00ea jiyan\u00ea bi \u015f\u00eawaz\u00ean din j\u00ee heye, ne ten\u00ea em
  b\u00eajin aliy\u00ea le\u015fker\u00ee, aliy\u00ean din y\u00ean w\u00ea jiyan\u00ea
  j\u00ee hene. Dibistan li ser bingeha nasandina w\u00ea jiyan\u00ea bo xelk\u00ean
  derwe di \u015fert \u00fb merc\u00ean dijwar de hat ava kirin. Bi dem\u00ea re li
  gor \u015fert \u00fb mercan hejmara kes\u00ean di dibistan\u00ea da hat guhertin
  \u00fb niha j\u00ee hejmara w\u00ea dibistan\u00ea weke w\u00ea dem\u00ea n\u00eene,
  h\u00ea k\u00eamtir b\u00fbye. Cara ber\u00ea me binav\u00ea Koma Mizg\u00een dest
  bi xebata xwe kir \u00fb albumek binav\u00ea Deng\u00ea Zerde\u015ft \u00fb \u00e7end
  kil\u00eep j\u00ee derxistin. L\u00ea koma Awaz\u00ean \u00c7iya pi\u015ftre di
  sala 2006\u2019an de, di fest\u00eevala Mexm\u00fbr\u00ea, di salvegera \u015fehadeta
  hevala B\u00ear\u00eetan de hat ava kirin.\\nH\u00fbn di nava koma xwe de \u00e7end
  kesin, nav\u00ean we \u00e7ine?\\n\u2013 Koma me bi gi\u015ft\u00ee ji 10 kesan
  p\u00eak t\u00ea:\\n- Zozan Gabar, 2.T\u00eako\u015f\u00een Sp\u00eart\u00ee, 3.Baran
  Dilbihar, 4.\u00d6zlem Mahsum, 5.Zafer Yilmaz, 6.\u015eevger Dilxwaz, 7.Sercan,
  8.Ava Re\u015f, 9.Ferz\u00ea, 10.Del\u00eel ku niha li her\u00eamek din xebata xwe
  dime\u015f\u00eene.\\n\u00c7ima we nav\u00ea koma Awaz\u00ean \u00c7iya li koma
  xwe kir?\\n\u2013 Em fikir\u00een ku \u00e7ava dikarin ti\u015ft\u00ean li vir dij\u00een
  an j\u00ee \u00e7\u00eadibin n\u00ee\u015fan bidin? wek t\u00ea zan\u00een em li
  \u00e7iyane, nav\u00ea me kes\u00ean ku li \u00e7iya jiyan dikin, em ger\u00eela
  ne \u00fb li \u00e7iyan dij\u00een. Ancax me tema\u015fe kir bi navek\u00ee wiha
  watedar dibe. Awaz\u00ean \u00c7iya dikare ba\u015ftirin bersiv be bo nasnav\u00ea
  jiyana me. Bi gotinek din awaz\u00ean ku li c\u00eeh\u00ea jiyana me dert\u00ean,
  t\u00ean xuliqandin \u00fb derdikevin, ji bona w\u00ea j\u00ee me navek\u00ee wiha
  bi n\u00ear\u00eena hem\u00fb endam\u00ean kom\u00ea li xwe kir.\\nBi gi\u015ft\u00ee
  heyan\u00ee niha li ser nav\u00ea \u201ddibistana \u015feh\u00eed Sefqan\u201d \u00e7i
  berhem\u00ean we y\u00ean qeyid kir\u00ee weke CD \u00fb kaset hene \u00fb hatine
  belav kirin?\\n\u2013 Zafer yilmaz: Hetan\u00ee niha li j\u00ear nav\u00ea Koma
  Mizg\u00een kas\u00eatek me binav\u00ea deng\u00ea Zerde\u015ft, bi away\u00ea deng
  \u00fb reng derketiye, l\u00ea z\u00eade nehat belav kirin. L\u00ea pi\u015ftre
  ku me nav\u00ea koma xwe guhert \u00fb kir Awaz\u00ean \u00c7iya albuma duyem\u00een
  bi nav\u00ea Siya J\u00een\u00ea ku ji 12 stranan p\u00eak dihat j\u00ee derxist
  \u00fb niha li Ewrupa \u00fb bakur\u00ea Kurdistan\u00ea hatiye belav kirin, l\u00ea
  h\u00ea negih\u00ee\u015ftiye ba\u015f\u00fbr\u00ea Kurdistan\u00ea. Herwiha me
  5 stran bi nav\u00ean \u201d B\u00caR\u00ceTAN, OREMAR, KATU, PEP\u00dbLE, EY SEROK\u201d,
  ten\u00ea bo radioya Deng\u00ea Mezopotamiyay\u00ea \u015fandine. Ji xeyn\u00ee
  stran\u00ean B\u00ear\u00eetan \u00fb Oremar\u00ea derfetek wiha \u00e7\u00eaneb\u00fbye
  ku em kil\u00eepa bo stran\u00ean din bik\u015f\u00een\u00een. L\u00ea di dem\u00ean
  p\u00ea\u015f de ligor derfet \u00fb \u00eemkan\u00ean xwe \u00fb ger pirsgir\u00eakek
  dernekeve em\u00ea kil\u00eep\u00ean hem\u00fb stranan bik\u015f\u00eenin.\\nDi
  van zor \u00fb zehmetiyan de \u00fb li wan \u00e7iyayan h\u00fbn bi \u00e7i ev\u00eenek\u00ea
  kar\u00ea huner\u00ee dikin? Pirsgir\u00eak\u00ean ku derdikevin p\u00ea\u015fber\u00ee
  we \u00e7ine?\\n\u2013 \u015eevger dilxwaz: Ji xwe qas\u00ee xuya dike ti\u015ft\u00ea
  her\u00ee xwe\u015f di nava zor \u00fb zehmetiy\u00ea de \u00e7\u00ea dibin. Sedema
  bingeh\u00een j\u00ee, ger em rew\u015fa xwe ber\u00e7av bigrin, ber\u00ee her ti\u015ft\u00ee
  ku em \u015fore\u015fgerin, di nav xwezaya Kurdistan\u00ea de, li ser \u00e7iyay\u00ean
  Kurdistan\u00ea weke ger\u00eela, zor \u00fb zehmetiy\u00ean me ku y\u00ean hey\u00ee
  ew hem\u00fb li aliyek\u00ea. \u015eehadeta gelek heval\u00ean h\u00eaja ku li ber
  \u00e7av\u00ean me \u00e7\u00eadibin, li ser nav\u00ea wan, ji bo xatir\u00ea wan,
  ji bo nif\u015f\u00ean p\u00ea\u015feroj\u00ea, dane naskirin. B\u00eaguman h\u00een
  afirandkar\u00ee di nava me de dide \u00e7\u00eakirin. zor \u00fb zehmetiyek ewqas
  me ned\u00eetiye ku li hember heval\u00ean kom\u00ea bibe asteng. Zor \u00fb zehmetiy\u00ean
  me b\u00eahtir pirsgir\u00eak\u00ean tekn\u00eek\u00eene ku k\u00eam \u00fb z\u00eade
  t\u00ean \u00e7areser kirin. Koma me j\u00ee bi v\u00ee away\u00ee tim kar\u00ea
  xwe dide me\u015fandin. Ez bawerim j\u00ee ku di dem\u00ean p\u00ea\u015fber\u00ee
  me de berhem\u00ean xwe\u015f \u00fb ba\u015f \u00e7\u00eabin, w\u00ea ne li c\u00eeh\u00ean
  rihet, l\u00ea li c\u00eeh\u00ean zor \u00fb zehmet de y\u00ea b\u00ean \u00e7\u00eakirin.
  Em endam\u00ean kom\u00ea bi v\u00ea yek\u00ea j\u00ee gelek k\u00eafxwe\u015f dibin
  ku di \u015fert \u00fb merc\u00ean dijwar de ti\u015ft\u00ean xwe\u015f biafir\u00een\u00een.\\nDi
  wan dem\u00ean daw\u00ee de koma we b\u00eahtir bi gotina strana \u201cOremar\u00ea\u201d
  nav \u00fb deng\u00ea xwe belav kir, \u00e7ima? tekst \u00fb muz\u00eeka w\u00ea
  stran\u00ea ya k\u00eaye, herwiha sedema \u00e7\u00eakirina w\u00ea stran\u00ea
  \u00e7ib\u00fb?\\n\u2013 Baran dilbihar: Tekst \u00fb muz\u00eek w\u00ea stran\u00ea
  ya min bi xweye, l\u00ea bi n\u00ear\u00een \u00fb n\u00eeqa\u015f\u00ean hem\u00fb
  endam\u00ean kom\u00ea hat \u00e7\u00eakirin. Ti\u015ft\u00ea ku p\u00eaw\u00eeste
  gel\u00ea me bizanibe ewe ku di nava me de kom\u00eenal b\u00fbn(?) heye. Ji bo
  ku berhem\u00ean \u00e7\u00eadibin serkeft\u00ee bin karek\u00ee ku em dikin hevpare
  \u00fb n\u00eeqa\u015f\u00ean z\u00eade li ser t\u00ean kirin.Ew r\u00eabazeke n\u00fbye
  \u00fb dibe ku di pa\u015feroj\u00ea de bandora xwe li kom\u00ean din j\u00ee bike
  ku ew j\u00ee r\u00eabazeke wiha bidin \u015fupandin.\\nDerheqa strana Oremar\u00ea
  \u00fb belavb\u00fbna nav \u00fb deng\u00ea w\u00ea pir aliy\u00ean xwe hene ku
  b\u00ean nirxandin. Yan\u00ee mirov nikare ten\u00ea di aliyek\u00ea de bib\u00eene.
  Her weku h\u00fbn j\u00ee dizanin di encama \u00e7alakiyeke ger\u00eela de ew berhem
  j\u00ee derketiye hol\u00ea. Yan\u00ee ber\u00ea sedem \u00e7alak\u00ee b\u00fb,
  li ser w\u00ee esas\u00ee j\u00ee ew berhem hat afirandin. P\u00eaw\u00eest dihat
  d\u00eetin, buyer\u00ean ku dinava jiyana ger\u00eela de derbaz dibin, bi taybet
  j\u00ee mil\u00ea eg\u00eed\u00ee \u00fb gernas\u00ee dinav de bibin berhem. F\u00eedakariy\u00ean
  wiha bigehin nava gel. Di ser\u00ee de \u00e7alak\u00ee b\u00fb w\u00ea \u00e7alakiy\u00ea
  bandorek xwe ya mezin li \u00e7apemeniya dinyay\u00ea j\u00ee kir. Ew aliyek b\u00fb
  ku berhem ewqas nav \u00fb deng\u00ea xwe belav bike. Aliy\u00ea din j\u00ee ew
  p\u00eavajo b\u00fb ku me t\u00eade jiyan dikir, bi awayek\u00ee pir bih\u00eaz
  ew temam kir ku ew berhem h\u00een b\u00eahtir kar\u00eeb\u00fb rola xwe bil\u00eeze
  \u00fb bi e\u015fiq \u00fb ev\u00een bikeve nav dil\u00ea guhdarvan\u00ean xwe de.
  Elbet mil\u00ea din aliy\u00ea huner\u00ee \u00fb w\u00eajey\u00ee y\u00ea stran\u00ea
  b\u00fb. Dema berhem hatiye \u00e7\u00eakirin bi awayek\u00ee gel\u00ear\u00ee,
  ku bikaribe ruh\u00ea gel xitab bike him aliy\u00ea m\u00ealodiya xwe de him j\u00ee
  aliy\u00ea w\u00eajeya xwede. Ji bo w\u00ea j\u00ee ew tesb\u00eeta ku hatib\u00fb
  kirin \u00eero ji mere ba\u015f dide xuya kirin ku tesb\u00eeteke rast b\u00fb.
  Yan\u00ee rast gihi\u015ft gel \u00fb rast ew xitab kirin, ji bona w\u00ea j\u00ee
  ewqas z\u00fb belav b\u00fb \u00fb bi awayek\u00ee berfireh j\u00ee hat p\u00ea\u015fwaz\u00ee
  kirin. Ti\u015ft\u00ea din ku gelek balk\u00ea\u015fe ewe ku ew stran ne ten\u00ea
  dinava milet\u00ea Kurd de belk\u00ee ji aliy\u00ea xelk\u00ea biyan\u00ee j\u00ee
  ba\u015f hat p\u00ea\u015fwaz\u00ee kirin. Wek ku xeber gihi\u015ft me t\u00ea gotin
  ku di nava malper\u00ean \u00eenternet\u00ea de, y\u00eak ji c\u00eeh\u00ean ku
  stran her\u00ee b\u00eatir l\u00ea t\u00ea guhdar kirin Amer\u00eeka Lat\u00een
  \u00fb Afr\u00eeqaye. Wek t\u00ea zan\u00een li wan deran j\u00ee di dem\u00ean
  ber\u00ea de ger\u00eelat\u00ee hatiye kirin, beriya niha me guhdar\u00ee berhem\u00ean
  wan dikirin L\u00ea niha bi rast\u00ee j\u00ee \u015fore\u015fa me gihi\u015ftiye
  asteke wiha ku berhem\u00ean xwe y\u00ean huner\u00ee, jiyana ger\u00eelay\u00ean
  xwe y\u00ean Rojhilata Nav\u00een bi derve bide guhdar\u00ee kirin \u00fb hez kirin.
  Herwiha sedemeka din ya z\u00eade p\u00ea\u015fwaz\u00eekirina w\u00ea stran\u00ea
  ki\u015fandina d\u00eemen\u00ean mustened ango rast\u00een b\u00fb. Hunera ku dinava
  s\u00eestem\u00ea de hatiye afirandin wiha n\u00eene, l\u00ea kil\u00eep\u00ean
  bi v\u00ee reng\u00ee pir rihet, rast \u00fb cewherdar \u00fb wek xwe hatine \u00e7\u00eakirin
  \u00fb rihek taybet t\u00eade heye. Ji ber wan sedeman ez bawerim strana Oremar
  ewqas dinava gel de hatiye hez kirin \u00fb ewqas c\u00eeh\u00ea xwe girtiye.\\nKi\u015fandina
  kil\u00eepa Oremar\u00ea di \u015fert \u00fb merc\u00ean \u00e7awa de derbaz b\u00fb?\\n\u2013
  \u015eevger dilxwaz: Wek t\u00ea zan\u00een \u015fert \u00fb merc\u00ean ku ger\u00eela
  t\u00eade dij\u00een zor \u00fb zehmetiy\u00ean w\u00ea j\u00ee hene, em gropek
  b\u00fbn du heval\u00ean din j\u00ee bi mere heb\u00fbn. Ji bo zivistan\u00ea me
  dar\u00ean hi\u015fik kom dikirin. W\u00ea dem\u00ea n\u00ee\u015fan dida ku w\u00ea
  \u00eari\u015f\u00ean dijmin li ser me \u00e7\u00ea bibin, ji bo w\u00ea me amadekariya
  xwe dikir. Di wan rojan de \u00e7alakiya Oremar \u00e7\u00eabib\u00fb \u00fb di
  encam\u00ea de du heval\u00ean me (\u015eiyar \u00fb Zinar) j\u00ee \u015feh\u00eed
  ketib\u00fbn. Demek z\u00eade em bi wan hevalan re mab\u00fbn, \u015fev\u00ea me
  guhdar\u00ee n\u00fb\u00e7eyan dikir, ku \u015fehadeta herdu hevalan hat rageyandin.
  Birast\u00ee bandorek pir mezin li me kir \u00fb hetan\u00ee sibehe xew bi \u00e7av\u00ean
  me neket. Di wir de me qirar da em stranek li ser qehremant\u00ee \u00fb \u00e7alakiya
  wan hevalan \u00e7\u00eabikin. Sibeh\u00ea me dest bi kar\u00ea xwe kir l\u00ea
  me nehi\u015ft heval\u00ea Baran kar bike \u00fb w\u00ee dest bi niv\u00eesandina
  helbest\u00ea kir. Her par\u00e7eyek ku diniv\u00eesand ji mere digot. Bi v\u00ee
  away\u00ee di navbera s\u00ea-\u00e7ar rojan de teksta stran\u00ea hat niv\u00eesandin.
  Pi\u015ftre em vegeriyan c\u00eeh\u00ea xwe \u00fb me dest bi qeydkirina stran\u00ea
  kir, h\u00eena em di destp\u00eaka kar\u00ea qeyd\u00ea de b\u00fbn ku teyare hatin
  \u00fb dest bi bombaran\u00ea kirin. Demek wiha derbaz b\u00fb teyare \u00e7\u00fbn
  \u00fb me pi\u015ftre stran qeyid kir. Di k\u00eal\u00eey\u00ean daw\u00ee y\u00ean
  kar\u00ea qeyd\u00ea de j\u00ee car din teyare hatin \u00fb d\u00eesan dest bi bombareneke
  girantir kirin. Demek\u00ea wiha derbaz b\u00fb \u00fb me j\u00ee ew yek di\u015fopand.
  Di wan \u015fert \u00fb merc\u00ean giran de \u00eedeyek, h\u00earsek, h\u00eazek
  bo insan \u00e7\u00eadibe, b\u00eer \u00fb baweriyek mezin bo \u00eensan \u00e7\u00eadibe.
  Ew dijmin \u00e7i dib\u00ea bila bib\u00ea \u00e7i zor \u00fb zehmetiy\u00ean ku
  hene bila hebin ew berhem\u00ea ku p\u00eaw\u00eeste \u00e7\u00eabe w\u00ea \u00e7\u00eabe.
  Ji bo ku ji wan \u00eari\u015fan re bibe bersiv roja pi\u015ftre em derketin \u00fb
  dinava 2 saetan de me kil\u00eep ki\u015fand. Bawerim k\u00eam \u00fb kurtasiy\u00ean
  w\u00ea j\u00ee hene l\u00ea \u00e7imk\u00ee di \u015fert \u00fb merc\u00ean giran
  \u00fb rast de hat ki\u015fandin; c\u00eeh\u00ea xwe dinava dil\u00ea gel de girt.\\nDema
  mirov bala xwe dide stran\u00ean koma we, z\u00eadetir stran\u00ean \u015fore\u015fgertiy\u00ea
  t\u00ean gotin, gelo h\u00fbn naxwazin di berhem\u00ean xwe de c\u00eeh bidin stran\u00ean
  klas\u00eek an j\u00ee gel\u00ear\u00ee?\\n\u2013 T\u00eako\u015f\u00een sp\u00eart\u00ee:
  Ji xwe beriya hunermenditiy\u00ea em \u015fore\u015fgerin, em ger\u00eela ne, ji
  bona dozek\u00ea em derketine. ji bona w\u00ea j\u00ee p\u00eaw\u00eeste hunera
  me li ser \u015fore\u015fgertiy\u00ea b\u00ea me\u015fandin, em \u00e7anda \u015fore\u015fgertiy\u00ea
  tems\u00eel dikin \u00fb dixwazin bikin mal\u00ea gel j\u00ee. l\u00ea di nava stran\u00ean
  me de stran\u00ean klas\u00eek j\u00ee hene. Em pir be\u015fan digrin dest\u00ea
  xwe, dinirx\u00eenin \u00fb dib\u00eajin. l\u00ea bi gi\u015ft\u00ee hunera me j\u00ee
  ji w\u00ea hunera kilas\u00eek bingeha xwe digire. Li ser w\u00ea yek\u00ea h\u00fbrb\u00fbnek
  cuda heye, dane me\u015fandin j\u00ee heye. L\u00ea \u015fert \u00fb merc, herwiha
  derfet\u00ean me nah\u00ealin ew y\u00eak z\u00eadetir derkevin p\u00ea\u015f. Li
  gor merc\u00ean ku derdikevin h\u00een berhem amade dibin. Herwiha em di stran\u00ean
  xwe de c\u00eehek taybet didin gotin\u00ean kilas\u00eek j\u00ee. Ger strana Oremar\u00ea
  bala we ki\u015fandibe t\u00ea d\u00eetin ku peyv\u00ean kevin weke (\u015f\u00fbr
  \u00fb mertal) t\u00eade c\u00eeh digirin. Li ser gotina kilam\u00ean kilas\u00eek
  ji xwe hunera me bi gi\u015ft\u00ee li ser w\u00ea bimgeh\u00ea hatiye avakirin.
  Em niha bi awayek\u00ea din wan stran\u00ean xwe y\u00ean kilas\u00eek n\u00fbjen
  dikin. Em \u00e7anda \u015fore\u015fgertiy\u00ea tems\u00eel dikin \u00fb dixwazin
  bikin mal\u00ea gel j\u00ee. Ji bona w\u00ea j\u00ee em her duyan p\u00ea\u015fk\u00ea\u015f\u00ee
  gel dikin, l\u00ea di ser\u00ee de hunera \u015fore\u015fgertiy\u00ea ji mere p\u00eangava
  yek\u00eaye. Di dem\u00ean p\u00ea\u015f de em\u00ea c\u00eehek taybet bidin stran\u00ean
  kilas\u00eek \u00fb gel\u00ear\u00ee j\u00ee.\\n\u00c7i piroje an berhem\u00ean
  n\u00fb ji bo pa\u015feroj\u00ea li ber dest\u00ea we hene?\\n\u2013 \u00d6zlem
  mahsum: Wek t\u00ea zan\u00eez hetan\u00ee niha ten\u00ea kil\u00eepa stran\u00ean
  Oremar \u00fb B\u00ear\u00eetan\u00ea p\u00ea\u015fk\u00ea\u015f\u00ee guhdar \u00fb
  b\u00eeneran hatine kirin. Pir berhem li ber dest\u00ea me hene, ku h\u00een ji
  wan hatine qeyid kirin j\u00ee l\u00ea car\u00ea kil\u00eep j\u00eare nehatine ki\u015fandin.
  H\u00een berhem\u00ean din j\u00ee hene em dixwazin weke surpir\u00eezek\u00ea p\u00ea\u015fk\u00ea\u015f\u00ee
  gel bikin. Ji xeyn\u00ee w\u00ea j\u00ee her hevl\u00ea/a di w\u00ea kom\u00ea de
  \u00e7end bestey\u00ean xwe hene ku tev di dor\u00ea dene \u00fb di dem\u00ean p\u00ea\u015f
  de w\u00ea b\u00ean qeyid kirin \u00fb kil\u00eep j\u00ee j\u00eare b\u00ean ki\u015fandin.\\nBi
  gi\u015ft\u00ee teksta stran\u00ean kom\u00ea k\u00ee dide we, kesek ji dervey kom\u00ea
  j\u00ee al\u00eekariya we dike?\\n\u2013 Ji xwe ew bestey\u00ean t\u00ean hazir
  kirin em t\u00eade jiyan dikin \u00fb t\u00eenin ser ziman. Ji bona w\u00ea j\u00ee
  kesek al\u00eekariya me nake. Dinava kom\u00ea de dema hevalek besteyek\u00ea \u00e7\u00eadike,
  n\u00ear\u00een\u00ean hem\u00fb hevalan li ser \u00e7\u00ea dibin.\\nH\u00fbn qeb\u00fbl
  dikin kesek ji derve al\u00eekariya we bike?\\n\u2013 Bel\u00ea em qeb\u00fbl dikin,
  l\u00ea niha ji ber ku z\u00eade t\u00eakiliy\u00ean me bi wan re \u00e7\u00eanabin,
  em bi xwe stranan diafir\u00eenin. Xwe\u015fikb\u00fbna huner\u00ea j\u00ee di w\u00ea
  deye ku tu bi xwe berhemek\u00ea biafir\u00een\u00ee.\\nBi d\u00eetina we ferqa
  dinavbera hunera li \u00e7iya \u00fb hunera ku li bajaran t\u00ea afirandin \u00e7iye?\\nT\u00eako\u015f\u00een
  sp\u00eart\u00ee: Pirsek gelek xwe\u015fe. ji xwe \u00e7anda \u00e7iya hindek cudatire.
  eger em vegerin d\u00eeroka Kurdan bi xwe j\u00ee, dib\u00een\u00een ku Kurdan ber\u00ea
  li \u00e7iyayan xwe parastine \u00fb jiyan kirine. Herwiha bi w\u00ee reng\u00ee
  \u00e7anda xwe j\u00ee parastine. Ji bona w\u00ea j\u00ee hest\u00ean \u00e7iya,
  ziman\u00ea \u00e7iya, xwe\u015fikb\u00fbna \u00e7iya \u00fb jiyan kirin li \u00e7iyan
  bi ser\u00ea xwe dibe hunerek. ew hunera ku t\u00ea afirandin j\u00ee dibe ziman\u00ea
  \u00e7iya, ku gelek taybete. dema ba li pel\u00ean daran dixe zimanek\u00ee derdix\u00eene,
  lawirek zimanek\u00ea derdix\u00eene, deng\u00ea av\u00ea zimanek\u00ea derdix\u00eene,
  rawistan li ser zinarek\u00ee bilind zimanek\u00ea derdix\u00eene. Ew hem\u00fb
  dibine yek \u00fb ziman\u00ea ger\u00eela derdikeve hol\u00ea. Ji bona w\u00ea hest
  \u00fb hunera ku li \u00e7iya t\u00ea \u00e7\u00eakirin b\u00eaguman xwed\u00ee
  naverokek gelek dewlemendtir \u00fb ji ya bajaran gelek bih\u00eaztire j\u00ee.
  Ji ber ku ev huner bi jiyan kirin\u00ea re t\u00ea afirandin. ti\u015ft\u00ea ku
  mirov jiyan neke \u00fb berhem\u00ean w\u00ea \u00e7\u00eabike di hest\u00ea xwe
  de z\u00eade k\u00fbr n\u00eene. Ji bona w\u00ea j\u00ee ez bawerim weke Awaz\u00ean
  \u00c7iyan, \u00e7i berhem\u00ean ku em derbixin ji ber ku em li \u00e7iyan dij\u00een
  \u00fb em bi xwe j\u00ee diafir\u00eenin \u00fb \u00eefade dikin \u00fb herwiha
  wan bi gel re dikin yek, gelek cudatir ji y\u00ean bajaran \u00e7\u00eadibin. Zuhatiyek
  di berhem\u00ean bajaran de t\u00ea d\u00eetin. Pir caran bala me ki\u015fandiye
  dema hunermend\u00ean ji derve t\u00ean \u00e7iya \u00fb pi\u015ftre vedigerin \u00fb
  berhem\u00ean pi\u015ft\u00ee veger\u00ea \u00e7\u00eadikin, h\u00east\u00ean w\u00ea
  gelek ji y\u00ean ku ber\u00ea \u00e7\u00eakirine, cuda \u00fb serkeft\u00eetirin.\\nYan\u00ee
  h\u00fbn dib\u00eajin \u00e7iya \u00eelhamek\u00ea dide mirova?\\n\u2013 Ji \u00eelham\u00ea
  z\u00eadetir, tu bixwe t\u00eade jiyan dik\u00ee. Mesela dema hunermendek ji bajaran
  behsa darek\u00ea dike, l\u00ea dar bixwe ned\u00eetiye \u00fb p\u00eare jiyan nekiriye.
  L\u00ea li \u00e7iyan tu p\u00eare dij\u00ee. Reng\u00ean w\u00ea dizan\u00ee. Dema
  tu l\u00ea m\u00eaze dik\u00ee, di hundur\u00ea w\u00ea de \u00e7end rengan dib\u00een\u00ee.
  Tu li ser wan \u00e7end rengan hunera xwe ava dik\u00ee. Cudatiya di navbera \u00e7anda
  bajar \u00fb ya \u00e7iyan hem\u00fb t\u00eade jiyane ku ya \u00e7iyan zehmettire
  j\u00ee. Yan\u00ee tu him huner, him \u00e7and, him ger\u00eelat\u00ee him \u015fore\u015f\u00ea
  tevan bi hev re dime\u015f\u00een\u00ee.\\nT\u00eab\u00een\u00ee: Ev hevpeyv\u00een
  di sala 2008\u2019\u00ea de \u00fb li \u00c7iyay\u00ean Qend\u00eel\u00ea hatiye
  \u00e7\u00eakirin \u00fb di \u00e7end malper \u00fb rojnamey\u00ean Ba\u015f\u00fbr\u00ea
  Kurdistan\u00ea de belav b\u00fb, niha \u00e7end kes di v\u00ea Kom\u00ea de namane.
  Me weke Malpera Rewanb\u00eaj p\u00eaw\u00eest d\u00eet hevpeyv\u00een\u00ea cardin
  biwe\u015f\u00eenin.\"", "\"Al\u00eegir\u00ean PKKy\u00ea y\u00ean ku av\u00eatin
  ser te\u015fkilata Partiya Demokrat a Sosyal a eyaleta Hamburg\u00ea, bi zora pol\u00easan
