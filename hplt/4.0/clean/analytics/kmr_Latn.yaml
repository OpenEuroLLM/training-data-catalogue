sample: '["\"Bi tabloya demjim\u00eara LCD-\u00ea re, h\u00fbn dikarin bi h\u00easan\u00ee
  p\u00eevan\u00ean cih\u00eareng \u00ean scooter\u00ea, y\u00ean wek\u00ee jiyana
  bateriy\u00ea, leza, \u00fb d\u00fbrb\u00fbna r\u00eawiyan bi\u015fop\u00eenin.Dashboard
  d\u00eemenderek zelal \u00fb kurt peyda dike, ku dih\u00eale h\u00fbn stat\u00eestik\u00ean
  siwarb\u00fbna xwe bi h\u00easan\u00ee bi\u015fop\u00eenin.\\nRonah\u00eey\u00ean
  lens: Bi roniy\u00ean lens\u00ean bi h\u00eaz ve hat\u00ee \u00e7\u00eakirin, skotera
  elektr\u00eek\u00ea ya mezinan d\u00eetina her\u00ee ba\u015f misoger dike, tewra
  di \u015fert \u00fb merc\u00ean k\u00eam-ronahiy\u00ea de j\u00ee. \u00c7ira ducar:
  d\u00eetin\u00ea z\u00eade dike \u00fb bikarh\u00eaner\u00ean r\u00ea hi\u015fyar
  dike, roniy\u00ean ducar\u00ee t\u00eer\u00eajek z\u00eade ewlehiy\u00ea peyda dikin.
  Li gel dahol\u00ea fren performansa firn\u00ea ya p\u00ea\u015fkeft\u00ee p\u00ea\u015fk\u00ea\u015f\u00ee
  dike, rastb\u00fbn \u00fb kontrol\u00ea peyda dike.\\nDi war\u00ea s\u00eawirandin
  \u00fb estet\u00eek\u00ea de, ev scootera elektr\u00eek\u00ea bi rast\u00ee moda
  \u00fb avant-garde ye.Di \u015fe\u015f reng\u00ean balk\u00ea\u015f de peyda dibin,
  h\u00fbn dikarin y\u00ea ku her\u00ee ba\u015f li gor\u00ee \u015f\u00eawaza we
  t\u00ea hilbij\u00earin.Tevl\u00ee \u00ee\u015faret\u00ean zivirandin\u00ea ne ten\u00ea
  balk\u00ea\u015fiya skoter\u00ea z\u00eade dike l\u00ea di dema siwarb\u00fbn\u00ean
  traf\u00eek\u00ea de ewlehiy\u00ea j\u00ee z\u00eade dike.Digel v\u00ea yek\u00ea,
  scooter bi mifteyek kontrol\u00ea ya ji d\u00fbr ve \u00fb pedal t\u00ea, dest p\u00eakirin
  \u00fb xebitandin\u00ea h\u00easan dike.\\nTaybetmendiyek balk\u00ea\u015f a v\u00ea
  scootera elektr\u00eek\u00ea t\u00eer\u00eaj\u00ean w\u00ea y\u00ean valahiya 14-2,5
  e.Van t\u00eer\u00eajan k\u00ea\u015f \u00fb k\u00ea\u015fa h\u00eaja peyda dikin,
  li ser r\u00fby\u00ean c\u00fbrbec\u00fbr r\u00ea r\u00eaw\u00eetiyek aram \u00fb
  ewledar peyda dikin.Digel v\u00ea yek\u00ea, t\u00eer\u00eaj\u00ean valahiya al\u00eekariy\u00ea
  di hilgirtina \u015fok\u00ea de dikin \u00fb r\u00eaw\u00eetiyek b\u00eak\u00eamas\u00ee
  tewra li ser erd\u00ean gemar\u00ee j\u00ee peyda dikin.Bi fren\u00ean dahol\u00ea
  re, ev scootera EV h\u00eaza rawestan\u00ea ya p\u00eabawer p\u00ea\u015fk\u00ea\u015f\u00ee
  we dike, dema siwarb\u00fbn\u00ea de aramiya hi\u015f\u00ea we dide.\\nBi z\u00eadeb\u00fbna
  hewcedariya vebijark\u00ean veguheztina ekoloj\u00eek-dostane re, di van sal\u00ean
  daw\u00ee de scooter\u00ean elektr\u00eek\u00ea populerb\u00fbn bi dest xistin.Van
  wesayit\u00ean kompakt \u00fb \u015f\u00ear\u00een, bi taybet\u00ee ji bo mesafey\u00ean
  kurt, r\u00eagezek r\u00eaw\u00eetiy\u00ea ya h\u00easan \u00fb domdar p\u00ea\u015fk\u00ea\u015f\u00ee
  dikin.Yek ji van skotir\u00ean elektr\u00eek\u00ea y\u00ean ku di war\u00ea performans
  \u00fb \u015f\u00eawaz\u00ea de derdikeve p\u00ea\u015f motora 350W-500W 2 \u00e7erxa
  elektr\u00eek\u00ea ye.\\nBi tevay\u00ee, ev scootera elektr\u00eek\u00ea bi motora
  xwe ya bi h\u00eaz, t\u00eer\u00eaj\u00ean valahiya, \u00fb kontrolkerek p\u00ea\u015fkeft\u00ee
  hem performans \u00fb hem j\u00ee \u015f\u00eawaz\u00ea xwe p\u00ea\u015fk\u00ea\u015f\u00ee
  dike.Ma h\u00fbn hewcey\u00ea r\u00eaw\u00eetiyek bilez a of\u00ees\u00ea an r\u00eaw\u00eetiyek
  b\u00eahnfireh li dora tax\u00ea hewce bike, ev skutera elektr\u00eek\u00ea bijarek
  p\u00eabawer \u00fb ekoloj\u00eek e.S\u00eawirana w\u00ea ya moda \u00fb taybetmendiy\u00ean
  bikarh\u00eaner-heval w\u00ea di s\u00fbk\u00ea de vebijarkek berbi\u00e7av dike.Bi
  v\u00ea scootera elektr\u00eek\u00ee ya balk\u00ea\u015f, k\u00eafa r\u00eaw\u00eetiya
  b\u00eah\u00eaz \u00fb ekoloj\u00eek-dostane bicerib\u00eenin.\\n1. Komek b\u00eak\u00eamas\u00ee
  ya t\u00eem\u00ea me ya ku ji bo firotan\u00ea we pi\u015ftgir\u00ee bike.\\nT\u00eemek
  me ya R&D ya berbi\u00e7av, t\u00eem\u00ea hi\u015fk QC, t\u00eem\u00ea teknolojiy\u00ea
  ya h\u00eaja \u00fb t\u00eem\u00ea firotan\u00ea ya kar\u00fbbar\u00ea ba\u015f
  heye ku kar\u00fbbar \u00fb hilber\u00ean \u00e7\u00eatir\u00een p\u00ea\u015fk\u00ea\u015f\u00ee
  xer\u00eedar\u00ean xwe bikin.Em hem hilber\u00eener \u00fb hem j\u00ee parg\u00eedaniyek
  bazirgan\u00ee ne.\\n2. Me fabr\u00eekey\u00ean xwe hene \u00fb pergala hilber\u00eena
  p\u00ee\u015fey\u00ee ji dab\u00eenkirina materyal \u00fb \u00e7\u00eakirin\u00ea
  heya firotan\u00ea, \u00fb her weha t\u00eemek R&D \u00fb QC ya profesyonel ava
  kiriye.Em her gav xwe bi meyl\u00ean bazar\u00ea re n\u00fbve dikin.Em amade ne
  ku teknoloj\u00ee \u00fb kar\u00fbbar\u00ea n\u00fb destn\u00ee\u015fan bikin da
  ku hewcedariy\u00ean bazar\u00ea bic\u00eeh b\u00eenin.\\n3. Pi\u015ftrastkirina
  kal\u00eetey\u00ea.\\nEm marqeya xweya xwe heye \u00fb pir gir\u00eengiy\u00ea didin
  kal\u00eetey\u00ea.Hilber\u00eena panela xebitandin\u00ea IATF 16946: 2016 Standard
  R\u00eavebiriya Kal\u00eetey\u00ea dipar\u00eaze \u00fb ji h\u00eala NQA Certification
  Ltd. li Englandngil\u00eeztan ve t\u00ea \u015fopandin.\\n1. Kal\u00eeteya bilind:
  Bikaran\u00eena materyal\u00ea kal\u00eeteya bilind \u00fb sazkirina pergalek kontrolkirina
  kal\u00eetey\u00ea ya hi\u015fk, destn\u00ee\u015fankirina kes\u00ean taybet\u00ee
  y\u00ean berpirsiyar \u00ean her p\u00eavajoya hilber\u00een\u00ea, ji kir\u00eena
  maddeya xav heya pakkirin\u00ea.\\n2. Atolyeya Mold, modela xwer\u00fb dikare li
  gor\u00ee hejmar\u00ea were \u00e7\u00eakirin.\\n3. Em wek\u00ee ku me heye xizmeta
  \u00e7\u00eatir\u00een p\u00ea\u015fk\u00ea\u015f dikin.T\u00eema firotan\u00ea
  ya bi ezm\u00fbn jixwe ji bo we dixebitin.\\n4. OEM bi x\u00ear hat\u00ee.Logo \u00fb
  reng\u00ea xwer\u00fb bi x\u00ear hat\u00ee.\\n5. Materyal\u00ean n\u00fb y\u00ean
  virgin ji bo her hilberek t\u00eane bikar an\u00een.\\n6. Em \u00e7awa dikarin kal\u00eetey\u00ea
  garant\u00ee bikin?\\nBeriya hilber\u00eena girsey\u00ee her gav nim\u00fbneyek
  p\u00ea\u015f-hilber\u00een\u00ea;\\nBeriya barkirin\u00ea her dem 100% Teft\u00ee\u015f\u00ea;\\n7.
  \u00c7i sert\u00eef\u00eekaya we heye?\"", "\"Razor Barbed Wire\\nT\u00eal\u00ean
  t\u00eal\u00ea y\u00ean t\u00ealkir\u00ee ji pola tevn\u00ea ya bi kal\u00eete ya
  \u00e7\u00eakir\u00ee, bi r\u00fbk\u00fbp\u00eak r\u00fbk \u00fb avahiya qay\u00eem
  hat\u00ee \u00e7\u00eakirin, ku di form\u00ean roll an panel\u00ean ji bo avakirin,
  t\u00ealkirin, \u00e7andin\u00ee, p\u00ee\u015fesaz\u00ee, avah\u00ee,\\n\u00e7\u00fbn\u00fbhatin,
  kan\u00een, mas\u00eevan\u00ee, mir\u00ee\u015fk, selek\u00ean h\u00eakan, p\u00eal\u00ean
  p\u00eest\u00ea, rakera av\u00eatin\u00ea, d\u00eemendera zuwa f\u00eakiyan, \u00fb
  karan\u00een\u00ean din. Bi navg\u00eeniya pir-rastkirina p\u00eavajoy\u00ea de,
  hilber\u00ean daw\u00een di ast\u00ea de, zirav-berxwed\u00ear \u00fb bi avahiyek
  zexm e, ku di gelek p\u00ee\u015fesaziyan de, wek\u00ee avah\u00ee, petrol, k\u00eemya,
  nif\u015f, t\u00eal, xwarin, \u00e7andin\u00ee, avah\u00ee, veguhastin, kan\u00een,
  pir t\u00eate bikar an\u00een. \u00e7andin\u00ee, zeviy\u00ean parastin\u00ea, xemilandin,
  parastina mak\u00eeney\u00ea, selik, p\u00ee\u015fesaziy\u00ean findiqan hwd.\\nMal:
  T\u00eala polay\u00ea karbon\u00ea ya k\u00eam Q195\\n* Modeya p\u00eavajoy\u00ea:
  welded\\n* Dabe\u015fandin:\\nI. mesh\u00ea galvanized elektr\u00eek\u00ea ya welded;\\nII.
  Galvanized hot dipped galvanized mesh;\\nDermankirina r\u00fby\u00ea erd\u00ea:\\n1-Elektro
  galvanized mesh (ber\u00ee galvan\u00eezekirin, pi\u015ft\u00ee galvan\u00eezekirin\u00ea
  hat\u00ee jel\u00een)\\n2-mesh galvanized hot-dipped (ber\u00ee galvan\u00eezekirin,
  pi\u015ft\u00ee galvan\u00eezekirin hat\u00ee \u015fandin)\\n3-PVC mesh mesh (dia
  wire. Ji PVC li ser 0.4mm e)\"", "\"Ocalan rew\u015fa kurdan a d\u00eerok\u00ee
  bi nav\u00ea \u2018dafika kurd\u2019 p\u00eanase dike. Ev dafik ji Su meran virve
  ji h\u00eala serdestan ve her tim li hember kurdan \u00fb li hember civak\u00ean
  Rojhilata Nav\u00een hatiye dan\u00een.\\nEz dixwazim hinek qala l\u00eestik\u00ean
  emperyal\u00eezma \u00cengil\u00eezan y\u00ean her\u00eama Rojhilata Nav\u00een
  bikim. Dewleta \u00cengil\u00eezan ji p\u00eavajoya 1800 hetan\u00ee 1940\u2019\u00ee
  di nava hewldan\u00ean afirandina komik an j\u00ee erkadariy\u00ean hevkar\u00ean
  xwe de b\u00fb. Ji bo ku di van hewldan\u00ean xwe de bi serkeve bi civak\u00ean
  Rojihilata Nav\u00een re diket t\u00eakiliy\u00ea \u00fb nijadperest\u00ee ya wan
  derdixist p\u00ea\u015f.\\nLi her\u00eama \u00ceran\u00ea \u00fb Ereb\u00eestan\u00ea,
  pol\u00eet\u00eekaya \u201cji hev bike \u00fb bi xwe ve gir\u00ea bide\u201d xistib\u00fb
  meriyet\u00ea. Dewleta \u00cengil\u00eez di v\u00ea p\u00eavajoy\u00ea de bi serok
  \u00fb r\u00eaber\u00ean e\u015f\u00eer\u00ean kurd re j\u00ee dikeve t\u00eakiliy\u00ea
  \u00fb bi hest\u00ea wan y\u00ea n\u00eejadperestiya feodal dileyze. Di heman dem\u00ee
  de dewleta \u00cengil\u00eez ji bo berjewendiy\u00ean xwe kurdan wek\u00ee am\u00fbr
  li hember \u00ceran\u00ea \u00fb dewleta Tirk bikar t\u00eene. Herdu dewletan bidest\u00ea
  kurdan bi xwe ve gir\u00eadide. Di heman dem\u00ee de dibin nav\u00ea xwed\u00ee
  derketina li Ermen \u00fb Suryaniyan herdu civakan j\u00ee digire bin ven\u00ear\u00eena
  xwe. Di nav l\u00eestikan de l\u00eestikan diafir\u00eene. Di nav v\u00ea l\u00eestik\u00ean
  qir\u00eat de berd\u00eal\u00ean her\u00ee giran ji h\u00eala kurdan ve t\u00ean
  day\u00een. Kurdan \u00e7iqas ser\u00eehildan, di encam\u00ea de her\u00ee z\u00eade
  bi qirkirinan re r\u00fb bi r\u00fb man \u00fb her\u00ee z\u00eade welat\u00ea wan
  hat dagirkirin \u00fb talan kirin. Di encam de; Serok \u00fb r\u00eaber\u00ean serhildanan
  ya hatin ku\u015ftin yan j\u00ee b\u00fbn hevkar\u00ean desthilatdaran. Gel ji \u00e7ar
  al\u00ee v\u00ea hatiye dorp\u00ea\u00e7kirin l\u00ea mixabin ji van ge\u015fedanan
  \u00fb qewim\u00eenan qet agahdar n\u00eene. P\u00eavajoya ku bi serhildana Babana,
  di sala 1806\u2019an de li Sil\u00eaman\u00ee destp\u00eakir \u00fb hetan\u00ee
  1938\u2019an berxwedana D\u00earsim\u00ea domiya windab\u00fbn\u00ean kurdan ewqas
  mezinin ku nay\u00ean hesapkirin. Di v\u00ea povajoy\u00ea de li ser civaka kurd
  gelek komploy\u00ean mezin t\u00ean l\u00eestin. Hez\u00ean serdest\u00ean her\u00eam\u00ea
  \u00fb emperyal\u00eest tevah\u00ee li gor\u00ee berjewendiy\u00ean xwe n\u00eazik\u00ea
  kurdan dibin \u00fb dixwazin ji bo berjewendiy\u00ean xwe y\u00ean qir\u00eat wan
  bikar b\u00eenin. L\u00ea li hember van l\u00eestik \u00fb pol\u00eet\u00eekay\u00ean
  qir\u00eat, pol\u00eet\u00eeka \u00fb hi\u015fmendiyek\u00ee kurdan ya xurt tune
  ye. Serok \u00fb r\u00eabertiyek\u00ee kurdan ya pol\u00eet\u00eek a xurt , zana
  \u00fb t\u00eagihi\u015ft\u00ee tuneye. Serok \u00fb r\u00eaber\u00ean e\u015f\u00eeran
  pir in, l\u00ea ew j\u00ee ji hi\u015fmendiya netew\u00ee ya azad d\u00fbrin. Ten\u00ea
  berjewendiy\u00ean xwe y\u00ean takekes\u00ee, malbat\u00ee \u00fb e\u015f\u00eer\u00ee
  difikirin. Lewre di nav civaka kurd de par\u00e7eb\u00fbn, ji hev qutb\u00fbn gelek
  p\u00ea\u015f dikeve. Di v\u00ea p\u00eavajoy\u00ea de gel ten\u00ea ketiye tatil\u00ea
  can\u00ea xwe \u00fb parastina xwe.\\nDAFIKA KURD\\nJi destp\u00eaka sedsala 19\u2019em\u00een
  \u015f\u00fbn de pol\u00eet\u00eekay\u00ean Ewropay\u00ea tevah\u00ee li ser mijoker\u00ee
  (kedxwar\u00ee) y\u00ea b\u00fbn. Armanca mudaxaleya Rojhilata Nav\u00een j\u00ee
  mijoker\u00ee b\u00fb. Lewre dixwestin civak\u00ean Rojhilata Nav\u00een d\u00eel
  bigirin. L\u00ea kurd ji v\u00ea dagirker\u00ee \u00fb mijokeriy\u00ea re ne biyan\u00eeb\u00fbn.
  Ji destp\u00eaka avab\u00fbna dewlet\u00ea, yan\u00ee ji Sumera virve bi gelek r\u00eabaz\u00ean
  dagirker\u00ee \u00fb mijoker\u00ee re r\u00fb bi r\u00fb mab\u00fbn. R\u00eaber\u00ea
  Gel\u00ea Kurd Abdullah Ocalan v\u00ea rew\u015fa kurdan a d\u00eerok\u00ee bi nav\u00ea
  \u2018dafika kurd\u2019 p\u00eanase dike. Ev dafik ji Sumera virve ji h\u00eala
  serdestan ve her tim li hember kurdan \u00fb li hember civak\u00ean Rojhilata Nav\u00een
  hatiye bi karan\u00een. Bi taybet\u00ee, ji destp\u00eaka 1800\u2019\u00ee virve
  ev dafik bi pispor\u00ee li hember kurdan bi awayek n\u00fbjenkir\u00ee t\u00ea
  bikaran\u00een. Di p\u00eavajoya niv\u00eesa d\u00eerok\u00ea de me hewldak\u00ee
  v\u00ea dafik\u00ea veb\u00eajin.\\nBANGA XILASB\u00dbN\u00ca\\nDewleta \u00cengil\u00eez,
  di v\u00ea p\u00eavajoy\u00ea de naxwaze dewleta Osmaniyan bi yek car\u00ee t\u00eak
  bibe \u00fb ji hol\u00ea rake. Ji hol\u00ea rakirin k\u00ear\u00ee berjewendiya
  wan nay\u00ea. Dizane ku ji hol\u00ea rab\u00fbna dewleta Osmaniyan d\u00ea bibe
  sedema aloz\u00ee \u00fb genge\u015fiyan. Lewre ji hol\u00ea ranake, l\u00ea bi
  r\u00eabaz\u00ean cur be cur r\u00eaveber\u00ee \u00fb burokrat\u00ean dewlet\u00ea
  bi xwe ve gir\u00eadide, bi r\u00eabaz\u00ean cuda rayedar \u00fb erkdar\u00ean
  dewlet\u00ea mehk\u00fbm\u00ea xwe dike \u00fb bi dest\u00ea wan, civak\u00ean bindest
  y\u00ean wek\u00ee kurd \u00fb y\u00ean din \u00ean ku li hember berjewendiy\u00ean
  wan asteng bin diheciq\u00eene \u00fb bi dest\u00ea wan, civak\u00ean bindest li
  gor\u00ee xwe \u2018terbiye\u2019 dike. Di heman dem\u00ee de bi dest\u00ea r\u00eaveberiya
  bi xwe ve gir\u00eaday\u00ee li gor\u00ee berjewendiy\u00ean xwe, te\u015fe dide
  Rojhilata Nav\u00een \u00fb civak\u00ean Rojhilata Nav\u00een. Bi v\u00ea r\u00eabaz\u00ea
  di Rojhilata Nav\u00een de xwe bicih dike \u00fb vener\u00eena xwe ya li her\u00eam\u00ea
  xurtir \u00fb m\u00eesoger dike. Di v\u00ea p\u00eavajoy\u00ea de n\u00eazikahiya
  Fransiza \u00fb Almanan j\u00ee n\u00ea cuda ye. Bi van pol\u00eet\u00eekay\u00ean
  xwe, emr\u00ea dewleta\\nOsmaniyan bi qas\u00ee sedsal\u00ee dir\u00eaj dikin. Di
  v\u00ea sedsal\u00ee de \u2018dafika kurd\u2019 a ku em qal dikin her\u00ee bi h\u00easan\u00ee
  \u00fb bi pispor\u00ee li hember kurdan \u00fb serdest\u00ean kurdan hatiye bikaran\u00een.
  Lewra R\u00eaber\u00ea Gel\u00ea Kurd Abdullah Ocalan her tim bang li dewlet\u00ean
  serdest dike \u00fb dib\u00eaje: \u201cXwe ji v\u00ea dafika kurd xelas bikin\u201d.
  Heta serdest\u00ean kurd xwe ji v\u00ea dafika kurd xelas nekin d\u00ea azad nebin.\\nL\u00ceSTIKA
  LI SER GEL\\nH\u00eaz\u00ean emperyal\u00eest, mil\u00ea dafik\u00ea ya duyem\u00een
  dixwazin bi ser civak\u00ean Xac\u00eeyan re p\u00ea\u015fbixin. Di bin nav\u00ea
  xelaskirina wan civakan de xerabiya her\u00ee mezin bi wan re dikin. Bi v\u00ea
  l\u00eestika xwe ya li ser civaka Xa\u00e7iyan, ji bo wan p\u00eavajoyek\u00ee her\u00ee
  bi xetere didin destp\u00eakirin. Bi v\u00ea pol\u00eet\u00eeka ya xwe ya qir\u00eat
  r\u00ea li ku\u015ftin, qirkirin \u00fb tasfiye kirina R\u00fbm, Ermen \u00fb As\u00fbriyan
  vedikin. Di v\u00ea p\u00eavajoy\u00ea de tevahiya civak\u00ean Rojhilata Nav\u00een
  bi dest\u00ea hevkar\u00ean emperyal\u00eestan dibin qurbana berjewendiy\u00ean
  \u00cengil\u00eezan \u00fb h\u00eaz\u00ean emperyal\u00eestan. Civak\u00ean ku bi
  hezar salan bi hevre wek bira di nav a\u015ftiy\u00ea de jiyan b\u00fbn bi dest\u00ea
  emperyal\u00eestan b\u00fbn neyar\u00ea hevdu. Dest\u00ea civakan kirib\u00fbn qirika
  hevdu. Rojhilata Nav\u00een kirin gola xw\u00een\u00ea. Gelek ji wan hatin qirkirin,
  gelek ji wan j\u00ee ne \u00e7ar man ku welat\u00ea xwe y\u00ean bav \u00fb kalan
  y\u00ea hezar salan biterik\u00eenin, ji \u00e7anda xwe, ji d\u00eeroka xwe, ji
  kevne\u015fopiy\u00ean xwe, ji nasname xwe d\u00fbr bikevin \u00fb li c\u00eehan\u00ea
  belav bibin.\\nDi nav v\u00ea l\u00eestik\u00ea de y\u00ean ku her tim wek\u00ee
  am\u00fbr hatin bikaran\u00een \u00fb b\u00fbn qurbana berjewendiy\u00ean emperyal\u00eestan
  civaka kurd b\u00fb. Ji bo \u00cengil\u00eezan kurd am\u00fbrek\u00ee her\u00ee
  xurt b\u00fbn ku ji bo berjewendiy\u00ean xwe li hember ecem, ereb \u00fb tirkan
  bikarb\u00eenin. Ji bo ku r\u00eaveber\u00ean ecem, ereb \u00fb tirkan bi xwe ve
  gir\u00ea bidin \u00fb daxwaz\u00ean xwe bi wan bidin qeb\u00fbl kirin kurd wek\u00ee
  dar\u00ea dest her tim hatin bikaran\u00een. Pol\u00eet\u00eeikaya \u2018ku\u00e7ik
  bi ku\u00e7ik bidin ku\u015ftin\u2019, na j\u00ee \u2018bi kev\u00eerek\u00ee ku\u015ftina
  \u00e7end \u00e7\u00fbkan\u2019 xistib\u00fbn meriyet\u00ea. Bi t\u00eakiliya xwe
  ya bi kurdan re di nav kurdan de hevkar\u00ean xwe afirandib\u00fbn. Bi wan hevkar\u00ean
  xwe ecem, ereb \u00fb tirk ditirsandin \u00fb bi xwe ve gir\u00eadidan, di heman
  dem\u00ee de kurd\u00ean hevkar\u00ean wan \u00ean feodal zext \u00fb zor\u00ean
  xwe li ser Ermen \u00fb As\u00fbriyan z\u00eade dikirin. Ermen \u00fb As\u00fbr\u00ee
  j\u00ee ji ne\u00e7ariy\u00ea xwe di av\u00eatin bext\u00ea \u00cengil\u00eezan.
  Wek\u00ee ku di v\u00ea dafik\u00ea de j\u00ee derket hol\u00ea, bi civaka kurd
  pol\u00eet\u00eekaya xwe ya berjewend\u00eepar\u00eaz li ser tevahiya civaka kurd
  dan pejirandin.\\nDesthillatdar\u00ean her\u00eam\u00ea, y\u00ean ku payeya wan
  Siltan, \u015eah \u00fb Mel\u00eek b\u00fbn l\u00eestika ku emperyal\u00eestan bi
  wan didan l\u00eestin wan j\u00ee heman l\u00eestik li ser muhal\u00eef\u00ean xwe
  \u00fb y\u00ean bin dest\u00ea xwe didan l\u00eestin. Yan\u00ee j\u00ee bi heman
  pol\u00eet\u00eekayan muhal\u00eef\u00ean xwe berteraf dikirin \u00fb bindest\u00ean
  xwe bi hevdu didan ku\u015ftin. Yan\u00ee bi kurtas\u00ee civak\u00ean her\u00eam\u00ea
  wek\u00ee baran\u00ea ber k\u00ear\u00ea qet nizanib\u00fbn \u00e7i t\u00ea ser\u00ea
  wan, sedem \u00e7iye \u00fb ne\u00e7ar li benda dora xwe disekiniyan. Heta ku dora
  wan were \u00fb ne\u00e7ar rola xwe biliz\u00een, wek\u00ee din ti\u015ftek\u00ee
  bizanibin \u00fb karibin bikin tune b\u00fb.\\nHer \u00e7iqas di v\u00ea dafik\u00ea
  de rola yekem\u00een ya kurdan be j\u00ee ti\u015ft\u00ea ku bi dest\u00ea wan hat
  ser\u00ee civak\u00ean her\u00eam\u00ea d\u00fbre hat ser\u00ee wan j\u00ee. Di
  v\u00ea dafik\u00ea de ji ber par\u00e7eb\u00fbn \u00fb b\u00ea pol\u00eet\u00eeka
  \u00fb b\u00ea siyasetb\u00fbn\u00ea bedel\u00ea her\u00ee giran kurdan da. Kurd
  her tim wek\u00ee am\u00fbr\u00ea n\u00ea\u00e7\u00eer\u00ea hatin bikaran\u00een.
  Kes an j\u00ee civak\u00ean ku ji pol\u00eet\u00eekay\u00ean wan re bib\u00fbna
  asteng bi van pol\u00eet\u00eekayan xwe y\u00ean qir\u00eat dorp\u00ea\u00e7 dikirin,
  b\u00ea h\u00eaz dihat hi\u015ftin \u00fb dawiy\u00ea de j\u00ee bi nav\u00ea xilaskirin\u00ea
  hemb\u00eaza xwe ji wan re vedikirin. L\u00eestika ku R\u00eaber\u00ea Gel\u00ea
  Kurd Abdullah Ocalan wek\u00ee \u2018dafika kurd\u2019 bi nav dike ev bixwe ye.
  Di serkeftin \u00fb p\u00ea\u015fketina v\u00ea dafik\u00ea de rola kurd\u00ean
  \u00e7\u00eeniya jor a hevkar \u00fb feodal gir\u00eeng e. D\u00eesa rola nezan\u00ee
  \u00fb cehaleta civaka kurd j\u00ee gir\u00eenge\\nL\u00ceSTIKA EMPERYAL\u00ceSTAN\\nDi
  tevahiya serhildan\u00ean sedsala 19\u2019\u00eam\u00een \u00fb 20\u2019em\u00een
  de em v\u00ea l\u00eestika emperyal\u00eestan bi taybet\u00ee j\u00ee ya \u00cengil\u00eezan
  dib\u00eenin. Mixabin her tim j\u00ee di v\u00ea l\u00eestika xwe de bi ser j\u00ee
  ketine. Ji bo wan mafdariya van serhildanan tu car gir\u00eeng neb\u00fbye. Ji bo
  wan serkeftin an j\u00ee binketina k\u00eejan h\u00eaz\u00ee j\u00ee ne gir\u00eeng
  e. Ya gir\u00eeng di encam\u00ea de d\u00ea berjewendiy\u00ean wan \u00fb destkeftiy\u00ean
  wan \u00e7ibin. Lewre wek\u00ee ku R\u00eaber\u00ea Gel\u00ea Kurd Abdullah Ocalan
  dib\u00eaje: \u201cY\u00ean ku siyaseta \u00cengil\u00eezan ya Rojhilata Nav\u00een
  f\u00eam neke \u00fb t\u00eanegih\u00eeje, siyaseta Rojhilata Nav\u00een f\u00eam
  nake \u00fb t\u00eanagih\u00eeje.\u201d\\nNIRXANDINA DAW\u00ceN\\nBel\u00ea xwendevan\u00ean
  h\u00eaja, ji ser\u00ea cotmeha 2010\u2019an vir ve n\u00eazik\u00ea du sal \u00fb
  n\u00eeve ez di Rojnameya Azadiya Welat de \u015f\u00eerovey\u00ean xwe y\u00ean
  der bar\u00ea d\u00eerok\u00ea de bi we re parve dikim. D\u00eerok wek\u00ee zan\u00een\u00ean
  poz\u00eet\u00eef encam\u00ea de mirov nikare bib\u00eaje 2+2=4 dike. Ji destp\u00eaka
  d\u00eeroka niv\u00ees\u00ee, yan\u00ee ji destp\u00eaka \u00e7anda dewletb\u00fbn\u00ea
  ji Sumera virve herkes\u00ee li gor\u00ee n\u00ear\u00eena xwe ya c\u00eehan\u00ea,
  li gor\u00ee berjewendiy\u00ean xwe, li gor\u00ee b\u00eerdoziya xwe, li gor\u00ee
  felsefeya xwe d\u00eerok \u015f\u00eerove kirine \u00fb niv\u00ees\u00eene. L\u00ea
  mixabin, civaka kurd a ku ji \u015fore\u015fa neol\u00eet\u00eek\u00ea virve di
  d\u00eerok\u00ea de rolek\u00ee gir\u00eeng \u00fb sereke l\u00eestine \u00fb bi
  dehan qirkirinan re r\u00fb bi r\u00fb mane di derheq\u00ea xwe de derfeta niv\u00ees\u00een\u00ea
  j\u00ee ned\u00eetine. Y\u00ean ku niv\u00ees\u00eene j\u00ee nikarib\u00fbne bipar\u00eazin
  \u00fb bigih\u00eenin qirna n\u00fb. Lewre wext\u00ea ku em bi bixwazin der heq\u00ea
  kurd \u00fb Kurdistan\u00ea de niv\u00eesarek biniv\u00eesin em ne\u00e7ar in gelek
  \u00e7avkaniyan ji ber \u00e7av re derbas bikin. Ji ber ku wek\u00ee li jor me an\u00ee
  ziman her yek\u00ee/\u00ea li gor\u00ee berjewend\u00ee an j\u00ee feraseta xwe
  niv\u00ees\u00eene. Em j\u00ee ne\u00e7arin hewl bidin ku ji tevahiya li gor\u00ee
  hi\u015fmed\u00ee \u00fb b\u00eerdoziya xwe rastiya xwe derxinin. Li gor\u00ee parad\u00eegmaya
  xwe, felsefeya xwe, b\u00eerdoziya xwe ji n\u00fb ve \u015f\u00eerove bikin \u00fb
  biniv\u00eesin.\\nDi d\u00eerok\u00ea de niv\u00ees\u00eena bi pergal heke em ji
  Heredot bidin destp\u00eakirin, ji w\u00ee \u015f\u00fbnde k\u00ee/\u00ea xwesti
  be li ser d\u00eerok\u00ea \u015f\u00eeroveyek n\u00fb z\u00eade bikin \u00fb biniv\u00eesin
  ne\u00e7arin ku \u00e7avkaniy\u00ean beriya xwe ber\u00e7av re derbas bikin. Min
  j\u00ee heman ti\u015ft kir. Heta ji dest\u00ea min hat \u00fb hetan\u00ee h\u00eaza
  min t\u00ear kir, min ji \u00e7avkaniy\u00ean beriya xwe \u00fb ji heval\u00ean
  xwe y\u00ean der \u00fb dor sud wergirt. Lewre m\u00eerov dikare bib\u00eaje ku
  di v\u00ea xebat\u00ea de di ser\u00ee de keda R\u00eaber Apo \u00fb tevahiya heval\u00ean
  me z\u00eade ye. Her hevalek me dikare keda xwe t\u00ea de bib\u00eene \u00fb l\u00ea
  xwed\u00ee derkeve. Min ti\u015fteke n\u00fb ne afirandiye, min li gel hem\u00fb
  k\u00eamasiy\u00ean xwe, ten\u00ea hewldaye ti\u015ft\u00ea ku heta niha der bar\u00ea
  kurd \u00fb Kurdistan\u00ea de hatin\u00ea niv\u00ees\u00een, li gor\u00ee parad\u00eegmaya
  n\u00fb, felsefe \u00fb hi\u015fmendiya n\u00fb \u00fb b\u00eerdoziya azad kom\u00ea
  serhev kirine, ji n\u00fb ve \u015f\u00eerove kirine \u00fb niv\u00ees\u00eene.
  Li gor\u00ee min, ji xwe d\u00eerok j\u00ee heman ti\u015fte.\\nJi ber ku Rojnameya
  Azadiya Welat ev derfet da me ku em \u015f\u00eerovey\u00ean xwe bi we re parve
