  sax, saxlem\\nBi alfabey\u00ean din[biguher\u00eene]\\nDijwate[biguher\u00eene]\\nBikaran\u00een[biguher\u00eene]\\nJi[biguher\u00eene]\\nJi
  ereb\u00ee \u0635\u0628\u0627\u064a\u062d\u064a\u0629 (\u1e63iba\u1e25iyyet: sipa,
