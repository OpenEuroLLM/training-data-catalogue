  ku ji bo ku li hember\u00ee serhildan\u00ean Xwed\u00ea ve biryara dev ji \u015eeytan
  ve hatib\u00fb \u015fandin. Ew ji hin f\u00eak qedexekirin xwar kir, \u00fb pa\u015f\u00ea
  ew Adem kir ku ew eyn\u00ee. Y\u00ea ku guneh di c\u00eehan\u00ea de, her per\u00e7eyek
