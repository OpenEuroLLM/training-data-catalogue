  Alman t\u00ean emilandin.\\n\u00c7alakvanan li balkona avahiy\u00ea p\u00eeney\u00ean
  r\u00eaxistina teror\u00ea PYD/PKKy\u00ea vekirin \u00fb herwiha f\u00ee\u015feng\u00ean
  heway\u00ee teqandin.\\nHat destn\u00ee\u015fankirin ku bi midaxeleya pol\u00eas\u00ea
  Alman va al\u00eegir\u00ean PYD/PKKy\u00ea avah\u00ee vala kirin ku di encam\u00ea
