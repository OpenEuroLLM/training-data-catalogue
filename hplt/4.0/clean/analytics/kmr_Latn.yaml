  (ko\u00e7er)\"", "\"Feraseta Cewher\u00ee Ya Civak\u00ea\\nDi civaka xwezay\u00ee
  de mirov, tu caran bi civaka ku p\u00ea re jiyaye nakokiyan jiyan nekirike \u00fb
  di nav civak\u00ea de bi awayek\u00ee ahengdar jiyankirin\u00ea bingeh girtiye.
  Sedema v\u00ea ew e ku di xwezaya mirov de civakb\u00fbn heye. Di civaka xwezay\u00ee
  de \u00eensan bi avakirina heb\u00fbna hev \u00fb temamkirina hev jiyan kirin. Ji
  be v\u00ea civak, rastiy\u00ean ku bi dest\u00ea \u00eensan hatine p\u00eakan\u00een
  e \u00fb t\u00ea ser ziman ku civakb\u00fbn \u015fert\u00ea heb\u00fbna mirov e.
  B\u00eay\u00ee ku civak hebe mirov nikare jiyan bike \u00fb nikare jiyana xwe berdewam
  bike. Taybetmendiya her\u00ee bingeh\u00een a mirov dike mirov, civakb\u00fbna w\u00ea
  \u00fb ew rastiya ku mirov nikare b\u00eay\u00ee civak jiyan bike ye. \u00censan
  weke civakan jiyan dikin, l\u00ea ajel weke koman jiyan dikin. Vay\u00ea li v\u00ea
  der\u00ea pirsa her\u00ee gir\u00eeng ku derdikeve hol\u00ea ew e ku mirov \u00e7i
  p\u00eanase dike? Sedem\u00ean bingeh\u00een a bi v\u00ea away\u00ea c\u00fbdab\u00fbna
  gelek zindiy\u00ean ku li xwezay\u00ea dij\u00ee \u00e7i ne? Xal ango ferqa bingeh\u00een
  a \u00eensan ji ajel, nebat \u00fb zindiy\u00ean din c\u00fbda dike \u00e7i ye?\\nPi\u015ft\u00ee
  jiday\u00eekb\u00fbn\u00ea bi demek\u00ee kin ajel dikarin bi tena ser\u00ea xwe
  jiyankirin\u00ea f\u00ear bibin \u00fb bigehin asta ku bikaribin p\u00eadiviy\u00ean
  xwe p\u00eak b\u00eenin. L\u00ea ji bo mirov heman ti\u015ft\u00ea gotin, d\u00ea
  ne rast be. R\u00fbxm\u00ea ku zindiya her\u00ee n\u00fbwaze mirov e, mezinb\u00fbna
  \u00eensan \u00fb gehi\u015ftina w\u00ea ya astek\u00ee \u00e7\u00eab\u00fby\u00ee
  18 salan digre. Ji ber ku \u00eensan pi\u015ft\u00ee jiday\u00eekb\u00fbn\u00ea
  bi demek\u00ea dir\u00eaj dikare bi tena xwe jiyan bike \u00fb jiyana xwe diyar
  bike. \u00censan bi zay\u00eena xwe p\u00ead\u00eev\u00ee bi kes\u00ean li derdora
  xwe dib\u00eene \u00fb nikare bi tena ser\u00ea xwe jiyan bike. Civakb\u00fbn him
  ji bo \u00eensan \u00fb him j\u00ee jiyana xwe bir\u00eaxistinkirina \u00eensan
  pir gir\u00eeng e \u00fb civakb\u00fbn diyardeyek a gir\u00eaday\u00ee \u00eensan
  e. Ev b\u00fbyer di ajelan de bi v\u00ea away\u00ea p\u00ea\u015fnakeve. M\u00eenak
  pep\u00fble pi\u015ft\u00ee ku ji gozik\u00ea derdikeve bi demek\u00ee kin dikare
  bifire, hespek\u00ee pi\u015ft\u00ee \u00e7av\u00ean xwe li din\u00ea vekir bi demek\u00ee
  kin dikare li ser ling\u00ean xwe bisekine \u00fb bibeze, xezalek\u00ea pi\u015ft\u00ee
  zay\u00eena xwe p\u00ean\u00e7 deqe \u015f\u00fbnde dikare bibeze. Ev bi qas\u00ee
  ku ji bo ahenga ajelek\u00ee ya bi xwezay\u00ea re \u00fb ji bo li hember\u00ee
  xwezay\u00ea me\u015fandina jiyana xwe gir\u00eeng e, ji bo jiyana xwe bi xwe me\u015fandin\u00ea
  j\u00ee gir\u00eeng e.\\nJi bo v\u00ea dibe ku bingeh\u00ea c\u00fbdab\u00fbna \u00eensan,
  asta w\u00ea/w\u00ee ya fikrandina bilind be.\\n\u201cTaybetmendiya her\u00ee diyarker
  a xwezaya civak\u00ea, nermb\u00fbn, bilindb\u00fbna asta zihn\u00ee \u00fb h\u00eaza
  w\u00ea ya \u00een\u015faaya xwe ye. Di Xwezaya Yekem\u00een de j\u00ee b\u00ea
  g\u00fbman, zihin, nermb\u00fbn \u00fb h\u00eaza xwe \u00een\u015fakirin\u00ea heye.\u201d
  Aqil\u00ea \u00eensan li heq\u00eeqet\u00ea digere \u00fb xwed\u00ee h\u00eaza qada
  ku l\u00ea dij\u00ee vegerandina qada jiyan\u00ea ye \u00fb li ser v\u00ea bingeh\u00ea
  j\u00ee xwed\u00ee h\u00eaza avakirin\u00ea ye. D\u00eesa d\u00eerok di war\u00ea
  civakan de \u015f\u00eerovekirina p\u00eavajoy\u00ean hatine jiy\u00een \u00fb rastiy\u00ean
  ku derketine hol\u00ea ye. Li gerd\u00fbn\u00ea \u00e7iqas avab\u00fbn\u00ean c\u00fbda
  hebe bi p\u00ea\u015fketina van avab\u00fbnan re ewqas j\u00ee d\u00eerok derdikeve
  hol\u00ea. Di p\u00ea\u015fketina d\u00eerok\u00ee de, dema yek\u00eetiya di navbera
  zindiyan de \u00e7\u00eanebe c\u00fbdah\u00ee tu wate p\u00eanase nake. Di xwezay\u00ea
  de zind\u00ee bi c\u00fbdahiy\u00ean xwe yekb\u00fbn\u00ea ava dikin. Li v\u00ea
  der\u00ea ti\u015fta ku derdikeve hol\u00ea \u00fb ya gir\u00eeng ew e ku, d\u00ea
  ev yek\u00eetiya di navbera zindiyan de n\u00fbnertiya \u00e7i bike? \u201cDema
  \u00eensan dibe mijara gotin\u00ea, b\u00ea guman j\u00eerb\u00fbn \u00fb qab\u00eeliyeta
  \u015fixulandina am\u00fbran j\u00ee mirvo dikare di nav yekb\u00fbn\u00ea de bigre
  dest.\u201d\\nTaybetmendiya bingeh\u00ee a \u00eensan ji ajelan c\u00fbda dike j\u00ee,
  b\u00fby\u00eena zanist a keda ku derdixe hol\u00ea ye. Ked \u00fb zanist aaliy\u00ean
  bingeh\u00een \u00ean mirov ava dike ye. Ajel bi aliy\u00ean xwe y\u00ean xwed\u00ee
  zekaya hestiyar, h\u00eeskirin \u00fb d\u00eetin\u00ea ve ji xwezay\u00ea s\u00fbdwergirtine.
  \u00censan j\u00ee ten\u00ea ji xwezay\u00ea s\u00fbd ne girtiye, heman dem\u00ea
  ji bo me\u015fandina jiyana xwe derfet\u00ean xwezay\u00ea bir\u00eaxistin kiriye.
  Amuran \u00e7\u00eakiriye \u00fb jiyana xwe bir\u00eaxistin kiriye. Ti\u015fta ku
  \u00eensan hey\u00ee dike \u00fb di nav xwezaya ku l\u00ea dij\u00ee derfeta jiyan\u00ea
  dide, civakb\u00fbna w\u00ea ye. Ji ber v\u00ea, civakb\u00fbn \u015fert\u00ea heb\u00fbna
  \u00eensan e. Ne gengaz e ku b\u00eay\u00ee civakb\u00fbn\u00ea mirov jiyan bike.
  Ango em dikarin mirov weke komb\u00fbna t\u00eakiliy\u00ean civak\u00ee bigrin dest
  \u00fb binirx\u00eenin.\\nAjel xwed\u00ee qab\u00eeliyeta bir\u00eaxistinkirina
  jiyana xwe n\u00een in. Ew encax bi awayek\u00ee dem\u00eengirt\u00ee dikarin jiyana
  xwe bi r\u00ea ve bibin. Ajelan li gor derfet\u00ean demsal\u00ea cih\u00ean xwe
  diguherin, di\u00e7in cih\u00ean ku bikaribin l\u00ea jiyan bikin. Ji dervey\u00ee
  v\u00ea derf\u00eat\u00ea wan a jiyankirin\u00ea n\u00eene. M\u00eenak meym\u00fbn
  li hember\u00ee sermay\u00ea bi m\u00fby\u00ean xwe xwe dipar\u00eaze \u00fb li
  gor demsala bi guhartina biyolojiya xwe dikare jiyan bike. L\u00ea \u00eensan bi
  j\u00eakirina \u00e7erm\u00ea ajelan dav\u00eaje ser pi\u015fta xwe \u00fb di derfet\u00ean
  xwezaya sar de dikare wisa jiyana xwe bime\u015f\u00eene. Her zind\u00ee ji bo xwe,
  xwed\u00ee derfet\u00ean xwezay\u00ee ya bikaribe jiyan bike ye. Her zind\u00ee
  nikare him li erd\u00ea, him li heway\u00ea, him li germ\u00ea \u00fb him j\u00ee
  li sermay\u00ea bij\u00ee. M\u00eenak ajel\u00ean behr\u00ea li behr\u00ea, ajel\u00ean
  li cih\u00ean germ dikarin bij\u00een li germ\u00ea, ajel\u00ean li cih\u00ean sar
  dikarin bij\u00een li sermay\u00ea jiyan dikin. L\u00ea ji ber ku \u00eensan li
  gor \u015fert\u00ean xwezay\u00ea dikare xwe vesaz bike li her cih\u00ea c\u00eehan\u00ea,
  di her \u015fert \u00fb mercan de dikare bij\u00ee.\\n\u201cFeraseta cewher\u00ee
  ya civak\u00ea, weke t\u00eag\u00een ba\u015f hatina f\u00eamkirin\u00ea hewce dike.
  Mirovah\u00ee d\u00een dema kevir \u00fb dar digre dest\u00ea bi fikrandina v\u00ea
  kiriye. Ne xweajo, tov\u00ean destp\u00eak\u00ea y\u00ean fikrandina anal\u00eet\u00eek
  mijara gotin\u00ea ye. Her ku ceribandin kom dibe p\u00ea\u015fketina civak\u00ea,
  di cewhera xwe de l\u00eah\u00fbrb\u00fbna v\u00ea fikr\u00ea ye.\u201d\\nMil\u00ea
  her\u00ee gir\u00eeng a mirov dike mirov vesazb\u00fbna ziman \u00fb fikr e. Mirovb\u00fbna
  mirov bi van d\u00fb diyarok\u00ean bingeh\u00een ve p\u00eak hatiye. Di mirov de
  rastiyek\u00ea gir\u00eeng a derdikeve hol\u00ea avab\u00fbna diyalekt\u00eeka ziman
  \u00fb fikr e. Zindiya destp\u00eak\u00ea ku dikare bifikre \u00fb dikare biaxife
  mirov e. Ziman \u00fb fikr bi bandorkirina hev p\u00ea\u015fketine. Bi awayek\u00ee
  rast me\u015fa \u00eensan \u00fb pi\u015ft\u00ee v\u00ea mezinb\u00fbna m\u00eaj\u00ee
  \u00fb bi p\u00ea\u015fketina zekay\u00ea ve dest\u00ean \u00eensan serbest maye.
  Bi p\u00ea\u015fketina zekay\u00ea ve dest bi \u015fixulandin \u00fb bikaran\u00eena
  am\u00fbran dike. \u00censan dikare di xwezay\u00ea de azad bij\u00ee sedema v\u00ea
  j\u00ee ew e ku m\u00eajiy\u00ea \u00eensan \u00fb dest\u00ean w\u00ea y\u00ean
  dikare bi\u015fxul\u00eene w\u00ea di xwezay\u00ea de azad dike. H\u00eazek\u00ee
  bi v\u00ea reng\u00ea, bi ti zindiy\u00ean din re n\u00eene. R\u00fbxm\u00ea ku
  ajel b\u00eay\u00ee am\u00fbran dikarin jiyan bikin, \u00eensan b\u00eay\u00ee am\u00fbran
  nikarin bij\u00een. Fikr\u00ean ku dib\u00eajin \u2018\u00eensan ajelek\u00ee xwed\u00ee
  zekaya p\u00ea\u015fket\u00ee ye\u2019 derketine hol\u00ea. Ji bo \u00eensan destp\u00eak\u00ea
  kar \u00fb bi w\u00ea re ziman p\u00ea\u015fketiye. Ev j\u00ee aliyek\u00ee gir\u00eeng
  a p\u00ea\u015fketina m\u00eaj\u00ee bandor dike ye. B\u00eay\u00ee civaka \u00eensan,
  m\u00eaj\u00ee, zanist \u00fb fikra \u00eensan j\u00ee nikarib\u00fb p\u00ea\u015f
  bikeve. \u00censan weke zaneb\u00fbn \u00fb kesayeta xwe civak\u00ee ye. Ajel pa\u015feroja
  xwe nizanin, l\u00ea \u00eensan s\u00ea libiya duho, \u00eero \u00fb sib\u00ea dizane
  \u00fb h\u00eaza \u00e7areserkirin\u00ea bi xwe re p\u00ea\u015fdixe. Ji ber v\u00ea
  R\u00eaber APO dib\u00eaje \u201cajel ten\u00ea dem\u00ean xwe jiyan dikin, l\u00ea
  \u00eensan hemu deman jiyan dikin\u201d. Ajel nikarin p\u00ea\u015feroj\u00ean xwe
  xeyal bikin. L\u00ea di \u00eensan de bi p\u00ea\u015fketina fikr \u00fb ziman h\u00eaza
  tesew\u00eerkirin\u00ea j\u00ee p\u00ea\u015f dikeve. Kar\u00ea ku \u00eensan dike
  \u00eensan ango \u00e7alak\u00ee, \u015fixulandina w\u00ea ya m\u00eajiy\u00ea xwe
  \u00fb p\u00ea\u015f ketina ziman e.\\n\u201cBi qas\u00ee \u00eensanan hemu zind\u00ee
  bi r\u00eagez\u00ean aqil \u00ean \u015fa\u015f nabe di\u015fuxilin. Ev aqil\u00ea
  ku em dikarin j\u00ea re b\u00eajin xwezay\u00ee ango hestiyar\u00ee j\u00ee, n\u00eaz\u00ee
  navajoy\u00ee ye. Bandorb\u00fbn bi bertek\u00ean pir lez day\u00een\u00ea ve, t\u00ea
  karakter\u00eezekirin. Bertek \u00fb bandor a di ajel \u00fb nebatan di v\u00ea
  mijar\u00ea de pir f\u00earker e. Jiyana xwe ya ten\u00ea ji z\u00eadeb\u00fbn,
  t\u00earb\u00fbn \u00fb parastin\u00ea p\u00eak t\u00ea; bi aqil\u00ea navajoy\u00ee
  bi tarzek\u00ee hatiye f\u00earkirin ve dime\u015f\u00eenin. Para \u015fa\u015fitiyan
  bi qas\u00ee ku n\u00een be, k\u00eam e. Ez di w\u00ea aliy\u00ea de me ku mijar\u00ea
  hilgirin qada heb\u00fbn\u00ean b\u00eacan j\u00ee. M\u00eenak ger em r\u00eak\u00ea\u015fa
  din\u00ea weke aqilek\u00ee navajo bifikrin (ez fikrek\u00ea wisa hildigrim), her
  ti\u015ft\u00ea w\u00ea, ango par\u00e7\u00ean w\u00ea bi qas\u00ee h\u00eaza bandorb\u00fbna
  w\u00ea ya ki\u015fandin \u00fb dehfdan\u00ea jiyan dike. Reva ji bandor\u00ea pir
  bi s\u00eenor e. L\u00ea bi qas\u00ee h\u00eaza ronahiy\u00ea rev dibe ku gengaz
  be. Felsefey\u00ean ku gerd\u00fbn\u00ea b\u00ea r\u00eagez, serberday\u00ee dihesib\u00eenin,
  di v\u00ea watey\u00ea de pir min t\u00ear nakin. N\u00ear\u00eena ku dib\u00eaje
  gerd\u00fbn bi zekayek diyar tevdigere li ser w\u00ea sekinandin\u00ea hewce dike.\u201d\\n\u00censan
  yekane zindiya ku bi taybetmendiy\u00ean xwe y\u00ean gi\u015ft\u00ee l\u00eakol\u00een
  dike ku ew k\u00ee ye \u00fb hewil dide v\u00eaya bib\u00eene. Ya rast\u00ee pirsa
  \u2018ez k\u00ee m\u00ea\u2019 l\u00eager\u00eenek watey\u00ea ye. Bi qas\u00ee
  ku bersiva v\u00ea pirs\u00ea d\u00eet \u00fb derxist zanistiy\u00ea, tu ti\u015ftek\u00ee
  ku \u00eensan nikaribe bike n\u00eene. Rastiya ku digih\u00eeje zaneb\u00fbn\u00ea
  bi naskirina xwe, bi p\u00eanasekirina xweza \u00fb civaka ku di nav de dij\u00ee
  dikare bigih\u00eeje encamek\u00ee. Di v\u00ea war\u00ea de \u00eensan zindiya her\u00ee
  tek\u00fbz a xwezay\u00ea ye. Gehi\u015ftina zaneb\u00fbn\u00ea ya hemu taybetmendiy\u00ean
  di \u00eensan de hey\u00ee \u00fb v\u00eaya xistina jiyan\u00ea ango \u00e7alakiy\u00ea
  dide n\u00ee\u015fandan ku hemu zind\u00ee k\u00ealiy\u00ean xwe jiyan dikin. Ajel
  di be\u015fa dem\u00ea ku di nav de dij\u00een de dim\u00eenin \u00fb p\u00ea\u015fdetir\u00ea
  w\u00ea nab\u00eenin \u00fb nikarin jiyan bikin. M\u00eenak pepule ji kozik\u00ea
  derdikeve \u00fb pi\u015ft\u00ee demek\u00ea kin dikare jiyana xwe berdewam bike.
  K\u00ealiy\u00ea h\u00ees dike \u00fb ger bikaribe bifikre dikare p\u00eanase bike.
  L\u00ea \u00eensan difikre \u00fb \u00e7\u00ea dike. Hi\u015f\u00ea \u00eensan heye,
  b\u00eeran\u00een ku jiyan kiriye \u00fb pa\u015feroja xwe l\u00eakol\u00een dike
  \u00fb v\u00eaya derdixe zaneb\u00fbn\u00ea. Fikrandin di cewhera \u00eensan de
  hey. Ji bil\u00ee \u00eensan zindiy\u00ean din difikre ango nikare bi fikre \u00eensan
  v\u00eaya nizane. Dibe ku ew j\u00ee difikre l\u00ea h\u00eena em v\u00eaya nizanin.
  \u00censan dikare bifikre, bi\u015fayes\u00eene \u00fb \u00e7\u00ea bike. Fikrandin
  heb\u00fbn e \u00fb gehi\u015ftina zaneb\u00fbna heb\u00fbna xwe ye. Fikrandin\u00ea
  weke agah\u00ee \u00fb b\u00fbyer\u00ean ku t\u00ea jiy\u00een \u00fb d\u00ea were
  jiyankirin l\u00eakol\u00eenkirin, muqayesekirin \u00fb avakirina fikr\u00ean n\u00fb
  em dikarin f\u00eam bikin. Mirova ku difikre l\u00eapirs\u00een dike ku d\u00ea
  \u00e7awa jiyan bike, jiyana xwe bi r\u00ea ve bibe \u00fb li gor w\u00ea jiyana
  xwe bi r\u00ea ve dibe. Di civaka xwezay\u00ee de \u00eensan li dij\u00ee derfet\u00ean
  xwezay\u00ea bi r\u00eaxistinkirina jiyana xwe weke civakb\u00fbn\u00ea jiyankirine.
  \u00censan\u00ean destp\u00eak\u00ea bi \u015fayesandin\u00ea jiyana xwe, w\u00ea
  bi hereket\u00ean destan bilev kiriye \u00fb di navbera van de t\u00eakiliyan \u00e7\u00eakiriye.
  Em dikarin ji v\u00ea re b\u00eajin p\u00ea\u015fketina aqil. \u00censan\u00ean
  destp\u00eak\u00ea gelek ti\u015ftan h\u00ees dikin, ji h\u00eess\u00ean xwe bawer
  dikin \u00fb li gor v\u00ea tevdigerin. Mirov dikare v\u00ea weke h\u00eeskirina
  ti\u015ft\u00ean t\u00ean jiy\u00een \u00fb d\u00ea were jiy\u00een, d\u00eetin
  \u00fb li hember\u00ee xeteriyan xwe parastin\u00ea f\u00eam bike. M\u00eenak civakek\u00ee
  mirovan dikare xeteriya \u00eari\u015f\u00ea ajelek\u00ee h\u00ees vike \u00fb li
  gor v\u00ea xwe bi cih dike. Dibe ku \u00e7\u00fbkek\u00ee li xember\u00ee xeteriyek\u00ea
  xwe bipar\u00eaze l\u00ea nikare v\u00ea tasarim bike, \u00e7areser\u00ee p\u00ea\u015f
  bixe \u00fb carna j\u00ee ji rew\u015fa q\u00fbrbanb\u00fbn\u00ea derbas nake. T\u00ea
  wateya ku ajel ger ferq bike j\u00ee heyan\u00ee cihek\u00ee dikare xwe bipar\u00eaze.\\nM\u00eajiy\u00ea
  her zindiyek\u00ea heye. L\u00ea \u00e7iqasa dikare w\u00ea bi\u015fx\u00fbl\u00eene
  ev mijara n\u00eeqa\u015f\u00ea ye. Mas\u00ee dema xarin\u00ean w\u00ea t\u00ea
  day\u00een xeteriya hey\u00ee h\u00ees dikin l\u00ea ji ber ku m\u00eajiy\u00ea
  wan ba\u015f na\u015fix\u00fble jib\u00eer dikin \u00fb dikevin xefk\u00ea. T\u00ea
  gotin ku \u00e7\u00fbk j\u00ee bi gi\u015ft\u00ee nikarin m\u00eajiy\u00ea xwe bi\u015fx\u00fbl\u00eenin.
  Gotina \u2018kes\u00ea bi m\u00eajiy\u00ea \u00e7\u00fbk\u00ea\u2019 bi wateya nikare
  bifikre, nikare berhem bide t\u00ea \u015fixulandin. \u00censan j\u00ee ji ber civakb\u00fbna
  xwe bi derdora xwe re t\u00eak\u00eel\u00ee ava dike \u00fb ji cih\u00ea ku l\u00ea
  jiyan dike bandor dibe.\\nRojda S\u00eeverek\"", "\"Dewlet\u00ean ku per\u00e7ek\u00ee
  Kurda \u00fb Kurdistan\u00ea di nav xwe de dihew\u00eenin, her tim r\u00eayek dane
  ber xwe; Kurd per\u00e7e kirin, berdana hev \u00fb Kurd bi Kurd qirkirin. V\u00ea
  b\u00ea tifaqiy\u00ea, Kurd li ser dar\u00ea dinyay\u00ea b\u00ea statu \u00fb b\u00ea
  war h\u00ee\u015ftiye. Ji l\u00eestik\u00ean Osmaniyan \u00fb bi taybet j\u00ee
  alay\u00ean hem\u00eediyan bigre, heta \u00eettihad \u00fb terrak\u00ee, ji destp\u00eaka
  avakirina komara tirkiy\u00ea bigre, heta \u015fer\u00ea di navbera YNK \u00fb PDK\u00ea
  \u00fb heta PKK\u00ea.\\nDi d\u00eeroka Kurdan de belk\u00ee cara ewile ku Kurd,
  li Rojava, di bin saz\u00eeb\u00fbnek\u00ea de hatine ba hev \u00fb yekitiya xwe
  \u00eelan kirin. V\u00ea, hem\u00fb per\u00e7exwar\u00ean Kurdan \u015fa\u015f \u00fb
  matmay\u00ee h\u00ee\u015ft. \u00c7imk\u00ee heta roja \u00eero Kurd, di \u00e7ar\u00e7ova
  armanceke hevpar \u00fb p\u00eeroz de nehatiye cem hev. Her tim h\u00ealek hatiye
  xapandin \u00fb y\u00ea din j\u00ee n\u00eev\u00e7e maye.\\nSerok\u00ea Kurdistana
  Ba\u015f\u00fbr Mesut Barzan\u00ee, bi ezm\u00fbn \u00fb j\u00eerekiya xwe, ji gaveke
  d\u00eerok\u00ee re p\u00ea\u015feng\u00ee kir \u00fb 16 part\u00ee \u00fb dezgeh\u00ean
  cuda, di bin navek\u00ee de an\u00eene ba hev \u00fb bi wan peyman mor kirin da.
  Tam di v\u00ea n\u00eaveng\u00ea de, gur\u00ea har xwe ji \u015fa\u015fiya xwe rizgar
  kir \u00fb careke din kete nav dek \u00fb dolaba. Di demek kin de me d\u00eet ku,
  h\u00een j\u00ee tifaqa Kurdan ne wek beton, wek kolikek\u00ea ye \u00fb bi bayek\u00ee
  b\u00eawext cida hildiwe\u015fe. Mixabin bi v\u00ea h\u00eaviya her Kurdek\u00ee
  qur\u00e7im\u00ee \u00fb sewqa nav fikara kir.\\nWez\u00eer\u00ea Kar\u00ea Derve
