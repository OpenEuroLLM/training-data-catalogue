  rentustr\u00ed\u00f0i\u00f0, sum hevur havt negativa \u00e1virkan \u00ed 2. h\u00e1lv\u00e1ri
  av eins og uppsagnirnar. Sparekassen indgik ogs\u00e5 i 2013 en to \u00e5rs kontrakt
  med h\u00e5ndboldklubben H71. H71 er en klub i udvikling. Sparekassen bliver gennem
  H71 eksponeret kraftigere i Hoyv\u00edk omr\u00e5det. Sparekassen overgik i 2013
  til digitale bestyrelsesm\u00f8der, hvor bestyrelsen f\u00e5r alt bestyrelsesmaterialet
  tilsendt til deres ipad via Directors Desk. Medlemmerne kan digitalt kommentere
  p\u00e5 materialet. Dette er en stor forbedring, idet bestyrelsesmedlemmerne dermed
  altid har alt materiale og tidligere materiale ved h\u00e5nden. Sparekassen grundlagde
  i december en ny tradition med en stor nisseby, som er lavet i samarbejde med det
  beskyttede v\u00e6rksted \u00e1 Bakka. Nissebyen blev velbes\u00f8gt af s\u00e5vel
  unge, som gamle. Byen blev indviet med gl\u00f8gg, \u00e6bleskiver, slik og sunkist
  til b\u00f8rn og voksne. Indvielsen var en dejlig begivenhed, som sparekassen forventer
  at gentage i de kommende \u00e5r. Sparekassen er samlet kommet gennem 2013 med et
  overskud p\u00e5 tkr. f\u00f8r skat sammenlignet med 233 tkr. i Fremgangen skyldes
