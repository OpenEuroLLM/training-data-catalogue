  \u00e1st\u00f8\u00f0ini tekna\u00f0i, sum h\u00f3ttanir og grundin til ta\u00f0
  er gudloysi, og hetta somulei\u00f0is galdandi fyri kommunismu og onnur r\u00e1k.
  Hesar fr\u00e1grei\u00f0ingar kann ein skj\u00f3tt bl\u00edva villleiddir av men
  ikki av t\u00ed ta\u00f0 beinlei\u00f0is villlei\u00f0ir teg at taka undir vi\u00f0
  fatanini, men heldur ta\u00f0, at ta\u00f0 er onki skil \u00e1 henni, og somueli\u00f0is
  er henda fatan oftast \u00ed samsvar vi\u00f0 eitt jaligt atlit til kristnu tr\u00fanna,
  t\u00f3 fulkomiliga brongla \u00ed teirri roynd av verja tr\u00fanna. Til d\u00f8mis
