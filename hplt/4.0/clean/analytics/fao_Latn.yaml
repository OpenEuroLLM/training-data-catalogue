  sigte, og vi har derfor ikke specifikke politikker p\u00e5 disse to omr\u00e5der.
  Sparekassen har udviklet et s\u00e6rligt l\u00e5n til energibesparende forbedringer
  af boliger - CO2 l\u00e5net -, hvor kunderne f\u00e5r energitestet deres boliger,
