  falskar tv\u00edst\u00f8\u00f0ur eisini tekna\u00f0ar fyri at l\u00fdsa tann \u00e6viga
  dystin \u00edmillum ta\u00f0 g\u00f3\u00f0a og ta\u00f0 \u00f3nda, sum \u00e1tr\u00fana\u00f0ur
  hevur til si\u00f0venju at pr\u00e6dika um. Men t\u00edskil grunda \u00e1 ta\u00f0,
  so tekna teir heimin svartan og hv\u00edtan, ella alt ver\u00f0ur sett upp solei\u00f0is,
  at mann fatar ta\u00f0, sum tr\u00fagv \u00edm\u00f3ti gudloysi. \u00cd or\u00f0um
  George Takeis; \u201cOh my!\u201d.\\nMyndin v\u00edsur \u00e1 eitt diagram har Association
  fallacy trupulleikin er opinl\u00fdstur; t\u00ed h\u00f3ast A er innanfyri B, og
  innanfyri C, so er alt B ikki innafyri C. F\u00f8royska tr\u00faarverjan hevur tann
  vana at siga \u00f8ll B eru C.\\nT\u00e1 i\u00f0 ta\u00f0 ver\u00f0ur umr\u00f8tt,
  at ta\u00f0 hava veri\u00f0 ymisk einar\u00e6\u00f0i, i\u00f0 hava framt r\u00e6\u00f0uleikar
