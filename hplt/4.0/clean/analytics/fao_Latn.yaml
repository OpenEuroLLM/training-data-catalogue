  \u00ed \u00e1r er e-N\u00e1m Sangleikabreytin \u00ed Fuglafjar\u00f0ar sk\u00fala
  fegin um at kunna bj\u00f3\u00f0a til ein st\u00f3ran og spennandi leik.\\n12-03-2021\\n\u00cd
  morgun 12. mars var gr\u00e6karismessuhald \u00ed sk\u00falanum. Ein hugnalig l\u00f8ta,
