  siger det gamle ordsprog. \u00d8get udl\u00e5n kr\u00e6ver \u00f8get kapital, ellers
  falder solvensen. Reguleringen s\u00e6tter krav til st\u00f8rrelsen og kvaliteten
  af kapital. Tjener sektoren ikke penge, er det sv\u00e6rt ved egen kraft at h\u00e6ve
  solvensen, hvis bankerne samtidig har en kraftig udl\u00e5nsv\u00e6kst, som kr\u00e6ver
  yderligere kapital. Kapital bliver en begr\u00e6nset ressource i den finansielle
  sektor for mange banker, og en optimal anvendelse af kapital bliver i stigende grad
  n\u00f8gleordet fremover. Kapitalkravet stiger til 13 % i en h\u00f8jkonjunktur
  mod 8 % i dag. SIFI bankerne f\u00e5r desuden yderligere kapitalkrav. SIFI bankerne
  er banker, som er s\u00e5 centrale for \u00f8konomien, at det f\u00e5r alvorlige
  samfundsm\u00e6ssige konsekvenser, hvis de g\u00e5r fallit uden en trov\u00e6rdig
