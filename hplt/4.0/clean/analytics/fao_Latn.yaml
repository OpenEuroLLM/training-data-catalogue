  og dermed hj\u00e6lpe milj\u00f8et og spare penge p\u00e5 sigt. Tilsynsdiamanten
  Finanstilsynet lavede i 2010 en tilsynsdiamant med fem peglem\u00e6rker, som pengeinstitutter
