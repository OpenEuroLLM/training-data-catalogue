  \u00e1rs\u00farsliti\u00f0 \u00e1 t.kr. er eginognin n\u00fa t.kr. Lovens krav til
  pengeinstitutternes solvens er 8 %. Su\u00f0uroyar Spairkassi har en solvens p\u00e5
  15,3 %, hvorved Sparekassen har en solid solvens. Efter \u00e5rets resultat p\u00e5
  t.kr. udg\u00f8r Sparekassens egenkapital nu t.kr. Vinningsb\u00fdti Sparikassin
  er avmarka\u00f0ur at gjalda vinningsb\u00fdti orsaka\u00f0 av, at framflutt \u00farslit
  er negativt vi\u00f0 \u00e1rsenda Udbytte Sparekassen er begr\u00e6nset i at udbetale
  udbytte p\u00e5 grund af, at de frie reserver er negative ved \u00e5rets udgang
  i\\n12 Lei\u00f0slufr\u00e1grei\u00f0ing / Ledelsesberetning Corporate Governance
  Nevndin \u00ed Su\u00f0uroyar Sparikassa ynskir eitt neyvt samstarv vi\u00f0 partaeigararnar,
  har teir kunnu hava s\u00edna \u00e1virkan \u00e1 s\u00edna \u00edl\u00f8gu. Hetta
  ver\u00f0ur m.a. tryggja\u00f0 vi\u00f0 beinlei\u00f0is vali \u00ed nevndina \u00e1
  a\u00f0alfundinum. \u00c1 a\u00f0alfundinum hava partaeigararnir eisini m\u00f8guleika
  at seta fram spurningar og f\u00e1a ymisk uppskot til vi\u00f0ger\u00f0ar. G\u00f3\u00f0
  uppl\u00fdsing er eisini tryggja\u00f0 vi\u00f0, at Sparikassin hevur eina dagf\u00f8rda
  heimas\u00ed\u00f0u vi\u00f0 vi\u00f0komandi uppl\u00fdsingum og t\u00ed\u00f0indum.
  Sparikassin strembar eisini eftir at hava partaeigarafundir, so partaeigararnir
  alt\u00ed\u00f0 ver\u00f0a kunna\u00f0ir um f\u00edggjarst\u00f8\u00f0una og gongdina
  hj\u00e1 Sparikassanum. Su\u00f0uroyar Sparikassi hevur \u00ed tr\u00e1\u00f0 vi\u00f0
  tilr\u00e1\u00f0ing fr\u00e1 F\u00edggjarr\u00e1\u00f0num valt at almannakunngera
  ymiskar Corporate Governance-uppl\u00fdsingar, sum eru kn\u00fdttar at tilr\u00e1\u00f0ing
  um punktini IV, V, VI samb\u00e6rt Corporate Governance Sparekassens bestyrelse
  \u00f8nsker en t\u00e6t dialog med sine aktion\u00e6rer, hvor aktion\u00e6rerne
  kan yde indflydelse p\u00e5 sin investering. Dette sikres f.eks. ved direkte valg
  p\u00e5 generalforsamlingen til bestyrelsen. P\u00e5 generalforsamlingen har aktion\u00e6rerne
  ogs\u00e5 mulighed for at stille sp\u00f8rgsm\u00e5l og f\u00e5 forslag med til
  behandling. T\u00e6t information sikres ogs\u00e5 ved, at Sparekassen har en opdateret
  hjemmeside med relevante informationer og nyheder. Sparekassen tilstr\u00e6ber desuden
  at afholde aktion\u00e6rm\u00f8der, s\u00e5 aktion\u00e6rerne l\u00f8bende bliver
  informeret omkring status og udvikling i Sparekassen. Su\u00f0uroyar Sparikassi
  har i tr\u00e5d med Finansr\u00e5dets anbefalinger valgt at offentligg\u00f8re forskellige
  Corporate Governance oplysninger, som er knyttet til anbefalingerne om punkterne
  IV, V, VI, jf. Punktini sn\u00fagva seg um nevndarinnar uppg\u00e1vu og \u00e1byrgd,
  hvussu nevndin er samansett og sams\u00fdning hj\u00e1 nevnd og stj\u00f3rn, og
  harumframt ein sj\u00e1lvst\u00f8\u00f0ug tilr\u00e1\u00f0ing fr\u00e1 F\u00edggjarr\u00e1\u00f0num
  um uttanh\u00fdsis grannsko\u00f0an. \u00cd samsvar vi\u00f0 tilr\u00e1\u00f0ingina
  skal Su\u00f0uroyar Sparikassi, \u00ed sambandi vi\u00f0 fr\u00e1bo\u00f0an til
  a\u00f0alfund, halda seg til tilr\u00e1\u00f0ingarnar fr\u00e1 Finansr\u00e1\u00f0num
  um g\u00f3\u00f0a felagslei\u00f0slu og uttanh\u00fdsis grannsko\u00f0an. Okkara
  st\u00f8\u00f0a til b\u00e1\u00f0ar tilr\u00e1\u00f0ingarnar er \u00ed h\u00f8vu\u00f0sheitum
  jalig fyri peningastovnin og okkara lutaeigarar \u00ed felagnum (samskiftisf\u00f3lk,
  vi\u00f0skiftaf\u00f3lk, veitarar og n\u00e6rsamfelagi\u00f0), og samansp\u00e6li\u00f0
  millum hesi er ein treyt fyri eini framhaldandi jaligari menning av peningastovninum.
  Sum lokalur peningastovnur gera vit okkum \u00f3mak at hava eitt gott pers\u00f3nligt
  samband vi\u00f0 vi\u00f0skiftaf\u00f3lki\u00f0, og t\u00e1 vit j\u00fa liva av
  at veita vi\u00f0skiftaf\u00f3lkunum \u00e1lit og trygd, er ney\u00f0ugt, at vit,
  umframt \u00e1byrgd og fyrilit til partaeigararnar, eisini taka fyrilit til ynskir
  fr\u00e1 \u00f8\u00f0rum \u00e1huga\u00f0um. Punkterne handler om bestyrelsens opgaver
  og ansvar, bestyrelsens sammens\u00e6tning og bestyrelsens og direktionens vederlag,
  og indeholder endvidere en selvst\u00e6ndig anbefaling fra Finansr\u00e5det om ekstern
  revision. I henhold til anbefalingerne skal Su\u00f0uroyar Sparikassi i forbindelse
  med indkaldelsen til generalforsamling forholde sig til Finansr\u00e5dets anbefalinger
  om god selskabsledelse og ekstern revision. Vores holdning til begge s\u00e6t anbefalinger
  er generelt positiv, for pengeinstituttet og vores interessenter (medarbejdere,
  kunder, leverand\u00f8rer og lokalsamfund) og samspillet disse imellem er en foruds\u00e6tning
  for pengeinstituttets fortsatte positive udvikling. Som lokalt pengeinstitut satser
  vi s\u00e6rligt p\u00e5 den personlige kundekontakt, og da vi lever af at leve op
  til kundernes tillid og tryghed, er det vigtigt, at der udover skyldig hensyntagen
  til aktion\u00e6rerne ogs\u00e5 tages hensyn til \u00f8nsker hos vores \u00f8vrige
  interessenter. Partaeigarar og onnur \u00e1huga\u00f0 kunnu lesa meira um st\u00f8\u00f0u
  peningastovnsins til tilm\u00e6lini. Vit liva upp til so at siga \u00f8ll tilm\u00e6lini.
  \u00cd sambandi vi\u00f0 tey tilm\u00e6li, sum vit ikki fylgja, er n\u00e6rri fr\u00e1grei\u00f0ing
  um, hv\u00ed vit ikki gera ta\u00f0. Hetta eftir meginregluni: Fylgi\u00f0 ella
  grei\u00f0i\u00f0 fr\u00e1 -meginregluni. Vit fylgja tilm\u00e6lunum hj\u00e1 F\u00edggjarr\u00e1\u00f0num
  um fylgi\u00f0 ella grei\u00f0i\u00f0 fr\u00e1-meginregluni, t\u00ed vit ni\u00f0anfyri
  grei\u00f0a fr\u00e1 teimum ymisku punktunum, har \u00ed\u00f0 vit hava valt at
  v\u00edkja fr\u00e1 tilm\u00e6lunum. Aktion\u00e6rer og andre interessenter kan
  i det f\u00f8lgende l\u00e6se mere om pengeinstituttets holdning til anbefalingerne.
  Vi lever op til langt de fleste af anbefalingerne, og for de anbefalinger, som vi
  ikke lever op til, er der redegjort n\u00e6rmere om baggrunden herfor i overensstemmelse
  med et f\u00f8lg eller forklar princip. Finansr\u00e5dets anbefalinger lever vi
  op til efter et f\u00f8lg eller forklar princip, idet vi neden for redeg\u00f8r
  for de enkelte punkter, hvor vi har valgt at fravige anbefalingerne. 11\\n13 Lei\u00f0slufr\u00e1grei\u00f0ing
  / Ledelsesberetning Corporate Governance tilm\u00e6lini eru b\u00fdtt upp \u00ed
  8 fylgjandi h\u00f8vu\u00f0spartar: I Partaeigaranna leiklutur og vi\u00f0sp\u00e6l
  vi\u00f0 lei\u00f0slu felagsins II \u00cdognarleiklutur og t\u00fddningur fyri felagi\u00f0
  III Opinleiki og gj\u00f8gnumskygni IV Nevndarinnar uppg\u00e1vur og \u00e1byrgd
  V Samanseting av nevndini VI Sams\u00fdning til nevnd og stj\u00f3rn VII V\u00e1\u00f0ast\u00fdring
  VIII Grannsko\u00f0an Tilm\u00e6lini fr\u00e1 Finansr\u00e1\u00f0num \u00fatgreina
  n\u00f8kur vi\u00f0urskifti \u00ed sambandi vi\u00f0 Corporate Governance. Tilm\u00e6lini
  pkt. IV, V og VI um nevndarinnar uppg\u00e1vur og \u00e1byrgd, samanseting av nevndini
  og sams\u00fdning til nevnd og stj\u00f3rn. Harumframt er sj\u00e1lvst\u00f8\u00f0ugt
  tilm\u00e6li um uttanh\u00fdsis grannsko\u00f0an. Corporate Governance-tilm\u00e6lini
  og tilm\u00e6lini fr\u00e1 F\u00edggjarr\u00e1\u00f0num koma afturat teimum reglum,
  sum eru \u00ed l\u00f3gg\u00e1vuni fyri felagi\u00f0 um lei\u00f0sluna, umframt
  f\u00edggjarligu l\u00f3gg\u00e1vuna hj\u00e1 peningastovninum. Tilm\u00e6lini fr\u00e1
  Corporate Governance kunnu lesast \u00e1 og tilr\u00e1\u00f0ingin fr\u00e1 Finansr\u00e1\u00f0num
  kann lesast \u00e1 Um tilm\u00e6lini, sum peningastovnurin ikki fylgir, skal serliga
  gevast g\u00e6tur: Tilr\u00e1tt ver\u00f0ur, at nevndin \u00e1 hv\u00f8rjum \u00e1ri
  samtykkir yvirskipa\u00f0ar almennar karmar fyri ta\u00f0, i\u00f0 grannsko\u00f0arin
  letur av ikkigrannsko\u00f0araveitingum, vi\u00f0 t\u00ed fyri eyga at tryggja grannsko\u00f0arans
  gegni v.m. Corporate Governance anbefalingerne er opdelt i f\u00f8lgende 8 hovedafsnit:
  I Aktion\u00e6rernes rolle og samspil med selskabsledelsen II Interessenternes rolle
  og betydning for selskabet III \u00c5benhed og gennemsigtighed IV Bestyrelsens opgaver
  og ansvar V Bestyrelsens sammens\u00e6tning VI Bestyrelsens og direktionens vederlag
  VII Risikostyring VIII Revision Finansr\u00e5dets anbefalinger uddyber en r\u00e6kke
  forhold i relation til Corporate Governance anbefalingernes punkt IV, V og VI om
  bestyrelsens opgaver og ansvar, bestyrelsens sammens\u00e6tning og bestyrelsens
  og direktionens vederlag og indeholder endvidere en selvst\u00e6ndig anbefaling
  om ekstern revision. Corporate Governance anbefalingerne og Finansr\u00e5dets supplerende
  anbefalinger supplerer de regler, der findes i selskabslovgivningen om ledelsen,
  samt for pengeinstitutterne den finansielle lovgivning. Corporate Governance anbefalingerne
  kan ses p\u00e5 og Finansr\u00e5dets anbefalinger kan ses p\u00e5 Om anbefalingerne
  som pengeinstituttet ikke f\u00f8lger skal s\u00e6rligt bem\u00e6rkes: Det anbefales,
  at bestyrelsen \u00e5rligt vedtager overordnede, generelle rammer for revisors levering
  af ikkerevisionsydelser med henblik p\u00e5 at sikre revisors uafh\u00e6ngighed
  mv. Peningastovnurin fylgir ikki tilm\u00e6linum, t\u00ed uttanh\u00fdsis grannsko\u00f0arans
  veitingar \u00ed fyrsta lagi vi\u00f0v\u00edkja rakstrar-, skattaog roknskaparvi\u00f0urskiftum.
  Tilr\u00e1tt ver\u00f0ur, at uppl\u00fdsingar um h\u00f8vu\u00f0sinnihaldi\u00f0
  \u00ed fr\u00e1faringarskipanini ver\u00f0a alment fr\u00e1bo\u00f0a\u00f0ar \u00ed
  \u00e1rsfr\u00e1s\u00f8gnini. Peningastovnurin fylgir tilm\u00e6linum. Tilr\u00e1tt
  ver\u00f0ur, at lei\u00f0slan og nevndin \u00e1seta eina mannagongd at eftirmeta
  samstarvi\u00f0 millum nevnd og lei\u00f0slu eina fer\u00f0 um \u00e1ri\u00f0. Ta\u00f0
  ver\u00f0ur gj\u00f8rt vi\u00f0 formligari samr\u00f8\u00f0u millum stj\u00f3ran
  og nevndarformannin. \u00darsliti\u00f0 av samr\u00f8\u00f0uni ver\u00f0ur lagt
  fyri samla\u00f0u nevndina. Tilr\u00e1\u00f0ingin ver\u00f0ur ikki fylgd. Nevndin
  heldur, at hon, vi\u00f0 teimum mongu fundum og neyva samstarvi millum nevnd og
  stj\u00f3ra, hevur ney\u00f0uga samskifti\u00f0 um n\u00e1ddu \u00farslitini. Pengeinstituttet
  f\u00f8lger ikke anbefalingen, idet ekstern revisors ydelser prim\u00e6rt relaterer
  sig til drifts-, skatte- og regnskabsm\u00e6ssige forhold. Det anbefales, at oplysninger
  om fratr\u00e6delsesordningers v\u00e6sentligste indhold offentligg\u00f8res i selskabets
  \u00e5rsrapport. Pengeinstituttet f\u00f8lger anbefalingen. Det anbefales, at direktionen
  og bestyrelsen fastl\u00e6gger en procedure, hvorved samarbejdet mellem bestyrelsen
  og direktionen \u00e9n gang \u00e5rligt evalueres ved en formaliseret dialog mellem
  den administrerende direkt\u00f8r og bestyrelsesformanden. Resultatet af evalueringen
  forel\u00e6gges for den samlede bestyrelse. Anbefalingen f\u00f8lges ikke. Bestyrelsen
  finder, at den med hyppige m\u00f8der og det t\u00e6tte samarbejde mellem bestyrelse
  og direktionen har den n\u00f8dvendige dialog omkring de opn\u00e5ede resultater.
  12\\n14 Lei\u00f0slufr\u00e1grei\u00f0ing / Ledelsesberetning Tilr\u00e1tt ver\u00f0ur,
  at nevndin \u00e1setir eina tilgongd \u00ed sambandi vi\u00f0 eftirmeting av \u00farslitum
  av arbei\u00f0inum hj\u00e1 formanni og hinum nevndarlimunum. Eftirmetingin ver\u00f0ur
  regluliga og mi\u00f0v\u00edst skipa\u00f0 vi\u00f0 t\u00ed fyri eyga, at b\u00f8ta
  um nevndararbei\u00f0i\u00f0 og at \u00e1seta grei\u00f0 kr\u00f8v fyri eftirmetingina.
  Tilr\u00e1tt ver\u00f0ur, at eftirmetingin av nevndini ver\u00f0ur gj\u00f8rd eina
  fer\u00f0 um \u00e1ri\u00f0, at nevndarforma\u00f0urin stendur fyri eftirmetingini
  vi\u00f0 m\u00f8guligari hj\u00e1lp uttanifr\u00e1, at \u00f8ll nevndin umr\u00f8\u00f0ur
  \u00farsliti\u00f0, og at mannagongdin fyri eftirmetingina ver\u00f0ur l\u00fdst
  \u00ed \u00e1rsfr\u00e1s\u00f8gnini. Tilr\u00e1\u00f0ingin ver\u00f0ur ikki fylgd.
  Sum er, heldur nevndin ikki, at ta\u00f0 \u00ed h\u00f8vu\u00f0sheitum er ney\u00f0ugt
  formliga at eftirmeta arbei\u00f0i\u00f0 hj\u00e1 nevndini, lei\u00f0sluni og samstarv
  teirra millum. Det anbefales, at bestyrelsen fastl\u00e6gger en evalueringsprocedure,
  hvor bestyrelsens og de individuelle medlemmers, herunder bestyrelsesformandens
  arbejde, resultater og sammens\u00e6tning l\u00f8bende og systematisk evalueres
  med henblik p\u00e5 at forberede bestyrelsesarbejdet og at der fasts\u00e6ttes klare
  kriterier for evalueringen. Det anbefales, at evalueringen af bestyrelsen foretages
  en gang \u00e5rligt, at den forest\u00e5s af bestyrelsesformanden eventuelt med
  inddragelse af ekstern bistand, at resultatet dr\u00f8ftes i den samlede bestyrelse,
  og at der i \u00e5rsrapporten oplyses om fremgangsm\u00e5de ved bestyrelsens selvevaluering.
  Anbefalingen f\u00f8lges ikke. Bestyrelsen finder ikke pt. behov for skematiske
  evalueringer af bestyrelse, direktion og samarbejdet imellem disse. Tilr\u00e1tt
  ver\u00f0ur, at nevndin, eina fer\u00f0 um \u00e1ri\u00f0, eftirmetir arbei\u00f0i\u00f0
  og \u00farsliti\u00f0 hj\u00e1 lei\u00f0sluni eftir frammanundan gj\u00f8rdum mannagongdum.
  Tilr\u00e1\u00f0ingin ver\u00f0ur ikki fylgd. Nevndin eftirmetir javnan \u00farslit
  og arbei\u00f0i\u00f0 hj\u00e1 lei\u00f0sluni, men ikki eftir f\u00f8stum mannagongdum.
  Tilr\u00e1tt ver\u00f0ur, at nevndarlimur, sum eisini er limur \u00ed lei\u00f0sluni
  \u00ed \u00f8\u00f0rum vinnufelag, ikki er vanligur limur \u00ed fleiri enn trimum
  nevndum ella \u00ed einum f\u00f8ri forma\u00f0ur og hevur einstakan vanligan nevndarsess
  \u00ed fel\u00f8gum, sum ikki eru ein partur av konsernini, uttan so, at serlig
  vi\u00f0urskifti gera seg galdandi. Peningastovnurin fylgir ikki tilr\u00e1\u00f0ingini.
  Nevndin heldur ta\u00f0 vera t\u00fddningarmiki\u00f0, at allir nevndarlimir hava
  alla ta orku, sum ney\u00f0ug er, fyri at gera s\u00edtt besta \u00ed nevndararbei\u00f0inum.
  Nevndin heldur kortini ikki, at ta\u00f0 er tali\u00f0 \u00e1 nevndarsessum, men
  heldur arbei\u00f0sbyr\u00f0an, sum fylgir vi\u00f0 teimum, sum er vi\u00f0komandi.
  Javnan ver\u00f0ur mett um onnur lei\u00f0slust\u00f8rv og t\u00ed\u00f0arn\u00fdtslu
  hj\u00e1 nevndarlimum. Det anbefales, at bestyrelsen \u00e9n gang \u00e5rligt evaluerer
  direktionens arbejde og resultater efter i forvejen fastsatte klare kriterier. Anbefalingen
  f\u00f8lges ikke. Bestyrelsen evaluerer l\u00f8bende direktionens resultater og
  arbejde, men ikke efter klare fastsatte kriterier. Det anbefales, at et bestyrelsesmedlem,
  der samtidig indg\u00e5r i en direktion i et aktivt selskab, ikke bekl\u00e6der
  mere end tre menige bestyrelsesposter eller \u00e9n formandspost og \u00e9n menig
  bestyrelsespost i selskaber, der ikke er en del af koncernen, medmindre der foreligger
  s\u00e6rlige omst\u00e6ndigheder. Pengeinstituttet f\u00f8lger ikke anbefalingen.
  Bestyrelsen finder det vigtigt, at alle bestyrelsesmedlemmer har de n\u00f8dvendige
  ressourcer til at kunne yde en aktiv indsats i bestyrelsen. Bestyrelsen finder imidlertid
  ikke, at det er antallet af poster, men derimod den dermed forbundne arbejdsm\u00e6ngde,
  der er relevant. Medlemmernes \u00f8vrige ledelseshverv og tidsforbruget hertil
  vurderes l\u00f8bende. Su\u00f0uroyar Sparikassi hevur tann vanliga \u00e1rsa\u00f0alfundin
  31. mars \u00c1 a\u00f0alfundinum \u00ed 2014 stendur \u00d3li Holm fyri vali. Nevndin
  m\u00e6lir til, at hann ver\u00f0ur afturvaldir. T\u00e1 nevndin vi\u00f0m\u00e6lir
  eitt valevni til nevndina, byggir tilm\u00e6li\u00f0 \u00e1 fakligan f\u00f8rleika
  og \u00e1huga, i\u00f0 vi\u00f0komandi leggur \u00ed arbei\u00f0i\u00f0. Su\u00f0uroyar
  Sparikassi afholder ordin\u00e6r generalforsamling den 31. marts P\u00e5 generalforsamlingen
  2014 er \u00d3li Holm p\u00e5 valg. Bestyrelsen anbefaler genvalg til bestyrelsen.
  N\u00e5r bestyrelsen indstiller en kandidat til bestyrelsen, er kandidaten udpeget
  ud fra vedkommendes faglige kvalifikationer og ud fra en stor interesse i Sparekassen.
  13\\n15 Lei\u00f0slufr\u00e1grei\u00f0ing / Ledelsesberetning F\u00f8rleikin hj\u00e1
  nevndarlimunum: Hans Petur Joensen er f\u00edggjarstj\u00f3ri hj\u00e1 Strandfaraskipum
  Landsins. Gudfinn Olsen er studentask\u00falal\u00e6rari og hevur \u00e1\u00f0ur
  veri\u00f0 stj\u00f3ri \u00ed einum byggifelagi. Bestyrelsens kvalifikationer: Hans
  Peter Joensen er \u00f8konomichef hos Strandfaraskip Landsins. Gudfinn Olsen er
