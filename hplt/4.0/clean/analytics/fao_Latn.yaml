  og m\u00f8guliga eini n\u00fdggjari fiskamj\u00f8lsverksmi\u00f0ju \u00e1 Tv\u00f8royri
  og einari \u00ed V\u00e1gi vi\u00f0 at dj\u00faphavn ver\u00f0ur gj\u00f8rd \u00e1
  Tv\u00f8royri av v\u00f3nunum um mentanarh\u00fasi\u00f0 SALT av bygging av leigu\u00edb\u00fa\u00f0um
  \u00ed V\u00e1gi og \u00e1 Tv\u00f8royri av langhylinum og v\u00e6lverumi\u00f0st\u00f8\u00f0ini
  \u00ed V\u00e1gi. F\u00f3lkaflytingin av oynni er um at ste\u00f0ga\u00f0. Sta\u00f0bundna
  arbei\u00f0sloysi\u00f0 er minka\u00f0 \u00far 127 f\u00f3lkum til 95 f\u00f3lk
  hetta seinasta \u00e1ri\u00f0, og eftirspurningurin eftir arbei\u00f0smegi \u00f8kist.
  ES hevur sett \u00ed verk revsitilt\u00f8k \u00ed sambandi vi\u00f0 sild og makreli
  \u00far F\u00f8royum. Partv\u00edst hevur eydnast at finna a\u00f0rar markna\u00f0ir.
  Ta\u00f0 eru t\u00f3 tekin um at partarnir n\u00e6rkast hv\u00f8rjum \u00f8\u00f0rum
  at finna eina loysn \u00e1 makrel- og sildastr\u00ed\u00f0num vi\u00f0 ES. Verri
  er vi\u00f0 st\u00f3ra eftirspurninginum \u00far Noregi eftir arbei\u00f0smegi,
  og sum hevur tiki\u00f0 til s\u00edn ein part av f\u00f8roysku arbei\u00f0smegini.
  F\u00f8royska vinnul\u00edvi\u00f0 hevur trupulleikar vi\u00f0 at kappast um arbei\u00f0smegina
  vi\u00f0 norskar arbei\u00f0sgevarar, solei\u00f0is at vit \u00ed l\u00f8tuni flyta
  ein part av okkara arbei\u00f0sorku til Noregs. med udbygningen af den pelagiske
  fiskefabrik p\u00e5 Tv\u00f8royri og muligvis en ny fiskemelsfabrik p\u00e5 Tv\u00f8royri
  og en i V\u00e5g. udbygningen af dybvandshavn p\u00e5 Tv\u00f8royri udsigterne til
  ombygningen af kulturhuset Salt byggeriet af lejelejligheder i V\u00e5g og p\u00e5
  Tv\u00f8royri langbanen/wellnesscenteret i V\u00e5g. Befolkningsfraflytningen fra
  \u00f8en er bremset kraftigt op. Den lokale arbejdsl\u00f8shed er faldet fra 127
  personer til 95 personer i l\u00f8bet af det seneste \u00e5r, og eftersp\u00f8gslen
  efter arbejdskraft er stigende. EU har indf\u00f8rt sanktioner p\u00e5 sild og makrel
  fra F\u00e6r\u00f8erne. Det er delvist lykkedes at f\u00e5 afsat fisken til andre
  markeder. Det virker dog til, at der er en positiv proces mellem parterne, s\u00e5
  en l\u00f8sning er rykket n\u00e6rmere p\u00e5 makrel- og silde striden med EU.
  P\u00e5 den negative side er dog, at den store eftersp\u00f8rgsel efter arbejdskraft
  fra Norge har st\u00f8vsuget en del af den f\u00e6r\u00f8ske arbejdsstyrke for arbejdskraft.
  Det f\u00e6r\u00f8ske erhvervsliv har sv\u00e6rt ved at konkurrere med de norske
  arbejdsgivere omkring arbejdskraften, hvorved F\u00e6r\u00f8erne i \u00f8jeblikket
  eksporterer en del af sine arbejdsressourcer til Norge. Sparikassin \u00e1r 2013
  Sparikassin runda\u00f0i \u00ed fj\u00f8r tey 70 \u00e1rini. Dagin h\u00e1t\u00ed\u00f0arhildu
