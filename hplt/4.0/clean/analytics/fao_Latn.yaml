  stu\u00f0la undir, hvussu vit reka okkara virksemi. Hesar lei\u00f0reglur rokna
  vit vi\u00f0 at almannakunngera \u00e1 heimas\u00ed\u00f0u okkara einafer\u00f0
  \u00ed Vit eru sannf\u00f8rd um t\u00fddningin av, at allir okkara samstarvspartar,
