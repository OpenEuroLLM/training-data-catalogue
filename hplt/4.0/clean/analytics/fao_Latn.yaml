  gott tiltak, sum Sparikassin hevur \u00ed hyggju at halda framm vi\u00f0. \u00cd
  2013 hev\u00f0i Sparikassin tkr. \u00ed avlopi fyri skatt samanbori\u00f0 vi\u00f0
  233 tkr. \u00ed Ors\u00f8kin til framgongdina eru munandi f\u00e6rri ni\u00f0urskrivingar.
  \u00cd 2013 t\u00f3k Sparikassin yvir alt ta\u00f0 praktiska arbei\u00f0i hj\u00e1
  Girostovuni, og solei\u00f0is er t\u00e6nastuveitari fyri vi\u00f0skiftaf\u00f3lkini
