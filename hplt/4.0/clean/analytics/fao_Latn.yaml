  tilbo\u00f0. Sparekassen i \u00e5ret 2013 Sparekassen fyldte 70 \u00e5r i Dette
  blev markeret med kaffe, kage og slik til b\u00f8rnene. Sparekassen oplever generelt
  en voksende interesse fra kunderne til st\u00f8rre \u00f8konomiske dispositioner
  sammenlignet med tidligere. Sparekassen har gennem det seneste \u00e5r haft en v\u00e6kst
  i udl\u00e5n p\u00e5 2 %, selvom d\u00f8nningerne efter den finansielle storm stadigv\u00e6k
  g\u00f8r s\u00f8en urolig. Sparekassens to bankelever fuldf\u00f8rte deres elevuddannelse
  i De er begge efterf\u00f8lgende blevet fastansat, og de har p\u00e5begyndt videreuddannelse
  til finansielle r\u00e5dgivere. Sparekassen har i 2013 lavet endnu en nyskabelse
  p\u00e5 det f\u00e6r\u00f8ske marked med et tilbud til sine yngre kunder, som hedder
  Konfirmationskonto. Sparekassen tilb\u00f8d konfirmanderne 14 % i rente af max kr.
  i en seks m\u00e5neder periode. Produktet har haft en positiv eksponering af sparekassen
  og en god modtagelse blandt de unge. Sparekassen har yderligere i 2013 haft informationsaftener
  om Livsforsikring og s\u00e6rligt Kjarnutrygging, som er et enest\u00e5ende livsforsikringsprodukt
  til de fleste f\u00e6ringer. Sparekassen indgik ogs\u00e5 i 2013 i et samarbejde
  med Tryggingarfelagi\u00f0 F\u00f8roya om at forhandle deres produkter til sparekassen
  kunder. 6\\n8 Br\u00e6v fr\u00e1 stj\u00f3rn / Brev fra direktionen Somulei\u00f0is
