  og hugmyndafr\u00f8\u00f0i.\"", "\"N\u00fa Bretland hevur sett s\u00e6r sum m\u00e1l
  net-null CO2 \u00fatl\u00e1t \u00ed 2050, hava oljufel\u00f8g, sum arbei\u00f0a
  \u00ed Nor\u00f0sj\u00f3num og eystan fyri F\u00f8royar, saman vi\u00f0 myndugleikunum,
  sett s\u00e6r fyri at minka um CO2 \u00fatl\u00e1ti\u00f0 \u00ed sambandi vi\u00f0
  framlei\u00f0slu. Til tess at r\u00f8kka hesum m\u00e1li ver\u00f0ur arbeitt vi\u00f0
  at \u00fatbyggja varandi orkukeldur so sum vindorku, sum s\u00ed\u00f0ani skal veita
  streym til raksturin \u00e1 mongu verandi og komandi olju- og gasspallunum \u00ed
  Nor\u00f0sj\u00f3num og vestan fyri Hetland. At br\u00faka streym fr\u00e1 eitt
  n\u00fa vindmyllum til framlei\u00f0sluna \u00e1 oljupallum fer at minka heilt munandi
  um CO2 \u00fatl\u00e1ti\u00f0 komandi \u00e1rini.\\nNorra hevur havt sera g\u00f3\u00f0ar
  royndir av at veita streym \u00far landi og fr\u00e1 vindmylnulundum til havs til
  framlei\u00f0sluna \u00e1 oljupallum, eitt n\u00fa \u00e1 pallum sum Sleipner, Troll
  og Johan Sverdrup. Ta\u00f0 hevur samb\u00e6rt Equinor minka\u00f0 um CO2 \u00fatlati\u00f0
  vi\u00f0 1,3 mi\u00f3. tonsum um \u00e1ri\u00f0.\\n\u00cd grannalandi okkara Bretlandi
  ver\u00f0a eisini royndir gj\u00f8rdar \u00e1 hesum \u00f8ki eitt n\u00fa vi\u00f0
  oljuframlei\u00f0sluni \u00e1 Culcean feltinum hj\u00e1 Total og Mariner hj\u00e1
  Equinor. Men Bretland er enn eftirb\u00e1tur til Norra \u00e1 hesum \u00f8kinum.
  Hetta er t\u00f3 naka\u00f0, sum eitt n\u00fa myndugleikarnir \u00ed okkara n\u00e6sta
  grannalag Hetlandi saman vi\u00f0 oljufel\u00f8gum vilja gera naka\u00f0 vi\u00f0.
  Har eru tey nevniliga farin undir eina st\u00f3ra verk\u00e6tlan, sum fyrst var\u00f0
  nevnd \u201cShetland Energy Hub\u201d, fyri s\u00ed\u00f0ani at ver\u00f0a broytt
  til \u201cOrion \u2013 Clean Energy Project\u201d. Endam\u00e1li\u00f0 er at \u00fatbyggja
  varandi orkukeldur, sum m.a. skulu ganga hond \u00ed hond vi\u00f0 oljufel\u00f8gini
  til tess at minka um CO2 \u00fatl\u00e1ti\u00f0.\\nMenna vindorku og vetni\\nH\u00f8vu\u00f0st\u00e6ttirnir
  \u00ed hesi verk\u00e6tlan eru at menna vindorkuna b\u00e6\u00f0i \u00e1 sj\u00f3gvi
  og \u00e1 landi og at fara undir framlei\u00f0slu av gr\u00f8nari vetnisorku (Hydrogen/Brint).
  Eisini sj\u00f3varfalsorka er partur av hesi framt\u00ed\u00f0ini. Hesi tilt\u00f8k
  skulu so fullkomiliga broyta orkulandslagi\u00f0 \u00ed hesum nor\u00f0asta \u00fatja\u00f0aranum
  av Bretlandi. Umframt at framlei\u00f0a streym til b\u00e6\u00f0i privatu h\u00fasarhaldini
  og til vinnuna, er stavnhaldi\u00f0 at lata streym til mongu olju- og gasspallarnar
  b\u00e6\u00f0i eystan og vestan fyri Hetland. Hesir ver\u00f0a \u00ed dag riknir
  vi\u00f0 gassi fr\u00e1 egnari framlei\u00f0slu og hava t\u00ed st\u00f3rt CO2 \u00fatl\u00e1t.
  Vi\u00f0 umr\u00f8ddu broyting ver\u00f0ur mi\u00f0ja\u00f0 m\u00f3ti at minka munandi
  um CO2 \u00fatl\u00e1ti\u00f0. Komandi elriknu pallarnir eru so bara eitt av stigunum
  \u00e1 lei\u00f0ini til eina gr\u00f8nari framt\u00ed\u00f0, har olju- og gassframlei\u00f0sla
  og gr\u00f8na orkuskifti\u00f0 eru partur av orkubroytingunum \u2013 orkuloysnini.
  Enn ein partur av samla\u00f0u orkuloysnini er at leggja elka\u00f0al millum Hetland
  og skotska meginlandi\u00f0. Hesin skal so um n\u00f8kur \u00e1r vera karmurin um
  streymflutning b\u00e1\u00f0ar vegir alt eftir t\u00f8rvinum.\\nFleiri av komandi
  olju- og gass\u00fatbyggingum \u00e1 bretska landgrunninum liggja t\u00e6tt vi\u00f0
  f\u00f8royska marki\u00f0, og t\u00ed er ta\u00f0 ikki ein \u00f3m\u00f8guligur
  tanki at hugsa s\u00e6r, at f\u00f8royskir vindorkuframlei\u00f0arar \u00ed framt\u00ed\u00f0ini
  eisini kunnu veita streym til hesar \u00fatbyggingar, n\u00fa t\u00e6r liggja n\u00e6rri
  F\u00f8royum enn Hetlandi.\\nF\u00f8royar partur av loysnini?\\nEr hugandi at F\u00f8royar
  eisini kunnu gerast partur av ella l\u00e6ra av hesum loysnum? Tann spurningin fer
  oljuportalurin at vi\u00f0gera sum fr\u00e1l\u00ed\u00f0ur. St\u00f3rar \u00fatbyggingar
  av f\u00f8royskari vindorku \u00ed framt\u00ed\u00f0ini kunnu m\u00f8guliga eisini
  gerast partur av hetlendsku/skotsku orkuloysnini, so streymur kann fara b\u00e1\u00f0ar
  vegir og heilt inn \u00e1 skotska meginlandi\u00f0 eisini.\\nFleiri av komandi \u00fatbyggingunum
  av n\u00fdggjum olju- og gasskeldum \u00e1 bretska landgrunninum liggja t\u00e6tt
  vi\u00f0 f\u00f8royska marki\u00f0 og ikki er \u00f3hugsandi, at hesar framt\u00ed\u00f0ar
  \u00fatbyggingarnar fara at hyggja til F\u00f8roya eisini eftir streymi til framlei\u00f0sluna
  fr\u00e1 framt\u00ed\u00f0ar vindmylnulundum til havs.\\nEisini er hugsandi, at
  n\u00fdhugsanin vi\u00f0 samarbei\u00f0i (partnership) millum f\u00f8royskar orkuveitarar
  og vinnuna at seta uppp vindmylnulundir \u00e1 landi og \u00ed framt\u00ed\u00f0ini
  til havs eisini, kunnu gerast uppaftur v\u00ed\u00f0skygnari og fara vit kanska
  at s\u00edggja \u00fatlendsk oljufel\u00f8g, sum n\u00fa leggja um til at gerast
  orkufel\u00f8g, fara \u00ed samstarv ( partnership) vi\u00f0 f\u00f8royskar orkufyrit\u00f8kur
  um at menna vindorkuna til havs, sum so aftur kann vera ein m\u00f8guligur veitari
  til olju- og gasspallarnar eystan fyri F\u00f8royar \u2013 fyri ikki at tosa um
  m\u00f8guliga framlei\u00f0slu \u00e1 pallum \u00e1 f\u00f8royska landgrunninum
  \u00ed framt\u00ed\u00f0ini!\\nFyri at f\u00e1a betri innlit \u00ed spennandi Orion
  verk\u00e6tlanina og tess t\u00fddning fyri b\u00e6\u00f0i framt\u00ed\u00f0ar olju-
  og gassvirksemi\u00f0 vi\u00f0 F\u00f8royar og eystan fyri F\u00f8royar umframt
  f\u00f8roysku orkuframt\u00ed\u00f0ina hevur FO\u00cdB (F\u00f8roya Olju\u00eddna\u00f0arb\u00f3lkur)
  bo\u00f0i\u00f0 Gunther Newcombe, sum stendur \u00e1 odda fyri verk\u00e6tlanini
  at vitja \u00ed F\u00f8royum \u00ed heyst. T\u00e1 er \u00e6tlanin, at hann skal
  vitja b\u00e6\u00f0i orkumyndugleikar, vinnufyrit\u00f8kur oo. Meira ver\u00f0ur
  at fr\u00e6tta um vitjanina \u00e1 oljan.fo, t\u00e1 hon n\u00e6rkast.\\nHetland
  gingi\u00f0 undan\\nH\u00f3ast l\u00edti\u00f0 \u00ed vavi og f\u00f3lkatali so
  hava hetlendingar mangan \u00ed s\u00f8gu tess gingi\u00f0 \u00e1 odda. Hetta s\u00f3u
  vit vi\u00f0 st\u00f3ru \u00fatbyggingini av n\u00f3taflotanum \u00e1 sinni, og
  hetta s\u00f3u vit, t\u00e1 st\u00f8rsti oljuterminalurin \u00ed Evropa, Sullom
  Voe, var\u00f0 tikin \u00ed br\u00fak \u00ed 1980. Hesin er framvegis virkin og
  fer at ver\u00f0a ta\u00f0 \u00ed mong \u00e1r aftrat, kanska ent\u00e1 so leingi,
  at hann n\u00e6r at taka \u00edm\u00f3ti fyrstu f\u00f8roysku oljuni/gassinum, um
  hesi ver\u00f0a funnin og framleidd komandi \u00e1rini. Hetlendingar l\u00f8gdu
  so eisini til brots fyri skj\u00f3tt 20 \u00e1rum s\u00ed\u00f0ani, t\u00e1 vindorkan
  \u00e1 landi t\u00f3k eitt t\u00fd\u00f0andi fet.\\nN\u00fa eru so aftur bo\u00f0
  eftir \u00f8llum g\u00f3\u00f0um kreftum \u00ed Hetlandi at gera Orion verk\u00e6tlanina
  til veruleika. Enn er hon \u00e1 teknibor\u00f0inum, men mong s\u00edggja hana sum
  eina t\u00fd\u00f0andi framt\u00ed\u00f0ar orkuloysn fyri Hetland og kanska ent\u00e1
  meginlandi\u00f0 vi\u00f0.\\nFr\u00e1 Shetland Energy Hub til Orion Clean Energy
  Project\\nFyri g\u00f3\u00f0um \u00e1ri s\u00ed\u00f0ani v\u00f3r\u00f0u fyrstu
  stigini tikin til at gera Hetland til ein orkumi\u00f0depil, sum skuldi byggja \u00e1
  varandi orkukeldur so sum vindorku, sj\u00f3varfalsorku, vetni ol. Ovasta st\u00fdri\u00f0
  \u00ed Hetlandi \u201cShetland Island Counsil (SIC)\u201d t\u00f3k upp samstarv
  vi\u00f0 \u201cHighlands and Islands Enterprise (HIE)\u201d og \u201cOil and Gas
  Technology Centre (OGTC)\u201d, sum hevur b\u00fasta\u00f0 \u00ed Aberdeen. \u00c6tlanin
  vi\u00f0 hesum samstarvinum og sum eitt skifti hev\u00f0i heiti\u00f0: \u201cShetland
  Energy Hub\u201d var at menna varandi orkukeldur \u00ed oyggjunum m.a. til tess
  at framlei\u00f0a streym til virksemi\u00f0 \u00e1 landi og til mongu olju- og gasspallarnar
  b\u00e6\u00f0i vestan fyri Hetland og \u00ed Nor\u00f0sj\u00f3num eystan fyri Hetland,
  solei\u00f0is at oljuvinnan gj\u00f8rdist \u00edt\u00f8kiligur partur av orkuskiftinum.
  Verk\u00e6tlanin, ber n\u00fa heiti\u00f0 \u201cOrion \u2013 Clean Energy Project\u201d.
  Orion stavar fr\u00e1 griksku mytologiini, og ver\u00f0ur lagt \u00ed hetta \u2013
  at r\u00f8kka stj\u00f8rnunum. At r\u00f8kka langt vi\u00f0 verk\u00e6tlanini.\\nOrion
  stendur fyri: \u201cOpportunity Renewables Integration Offshore Networks\u201d.
  Vi\u00f0 hesi sera ambiti\u00f8su verk\u00e6tlanini ynskja hetlendingar at v\u00edsa
  umheiminum, at Hetland fer at ver\u00f0a fyrsta gr\u00f8na oyggin \u00ed St\u00f3rabretlandi.\\nGunther
  Newcombe, lei\u00f0ari fyri Orionverk\u00e6tlanina, sum kemur til F\u00f8roya \u00ed
  heyst, eftir innbj\u00f3\u00f0ing fr\u00e1 FO\u00cdB (F\u00f8roya Olju\u00eddna\u00f0arb\u00f3lki).\\nKendur
  orkuma\u00f0ur \u00e1 odda\\nTa\u00f0 er heldur ikki ein og hv\u00f8r, sum er settur
  at standa fyri verk\u00e6tlanini. Myndugleikarnar hava heitt \u00e1 ein royndan
  pers\u00f3n fr\u00e1 olju- og orkuumhv\u00f8rvinum til at standa fyri Orion. Ta\u00f0
  er Gunther Newcombe, sum seinastu 5 \u00e1rini var stj\u00f3ri \u00ed OGA, Oil and
  Gas Authority, i\u00f0 er tann almenni bretski stovnurin, sum stendur fyri \u00fatbj\u00f3\u00f0ingum
  til oljuleiting \u00e1 bretska landgrunninum. Hetta er bretska Jar\u00f0feingi.
  Hann hevur annars arbeitt hj\u00e1 oljufel\u00f8gum sum BP, so hann kennir vinnuna
  fr\u00e1 fleiri s\u00ed\u00f0um.\\nGunther sigur \u00ed samr\u00f8\u00f0u vi\u00f0
  Shetland News: \u201cOrion has the potential to \u201ccreate a future for Shetland
  beyond petroleum, establish a new industry that gives you clean energy, that addresses
  fuel poverty, put you in control of that industry, and create employment and new
  skills.\u201d\\nUmframt at geva \u00eddna\u00f0inum \u00ed oyggjunum n\u00fdggjar
  framt\u00ed\u00f0ar m\u00f8guleikar, so kann verk\u00e6tlanin eisini koma at vaksa
  um orkuframlei\u00f0sluna \u00ed oyggjunum, sum higartil hevur veri\u00f0 sera avmarka\u00f0.
  Aftrat hesum kemur so st\u00f3ri vinningurin \u00ed at minka munandi um CO2 \u00fatl\u00e1ti\u00f0.
  Ta\u00f0 er annars st\u00f3rt, 650.000 tons um \u00e1ri\u00f0. \u00cd dag er Hetland
  n\u00e6rum heilt bundi\u00f0 at innfluttari fossilari orku.\\nFleiri av komandi
  olju\u00fatbyggingum \u00ed Bretlandi liggja t\u00e6tt vi\u00f0 f\u00f8royska marki\u00f0.\\nHetland
  ganga \u00e1 odda \u00ed gr\u00f8na skiftinum\\nGunther Newcombe sigur, at Hetland
  vi\u00f0 hesi verk\u00e6tlan kann koma at ganga \u00e1 odda \u00ed gr\u00f8na skiftinum
  \u00ed Bretlandi og samt\u00ed\u00f0is br\u00faka hetta h\u00f8vi\u00f0 til at menna
  \u00eddna\u00f0in. Hann heldur, at eitt ta\u00f0 fyrsta, sum eigur at ver\u00f0a
  gj\u00f8rt, er at menna vindorkuna, so hon kann veita streym til mongu olju- og
  gasspallarnar b\u00e6\u00f0i vestan og eystan fyri Hetland. \u00cc l\u00f8tuni ver\u00f0ur
  seinasta hond l\u00f8gd \u00e1 eina risast\u00f3ra vindmylnuverk\u00e6tlan vi\u00f0
  meira enn 100 myllum \u00e1 landi. Ta\u00f0 er felagi\u00f0 Viking Wind, sum stendur
  fyri hesi verk\u00e6tlanini. Eisini t\u00e6r m\u00f8guliga komandi olju\u00fatbyggingarnar
  vestan fyri Hetland sum Cambo, Rosebank og Clair South, kunnu gerast partur av hesi
  elektrifiserings\u00e6tlan.\\nGunther Newcombe, sum betur enn nakar annar, kennir
  oljuvinnuna innan\u00edfr\u00e1, sigur vi\u00f0 Shetland News, at \u00edleggjarar
  fara neyvan at seta pengar \u00ed hesar \u00fatbyggingar, um t\u00e6r ikki taka
  stig \u00e1 gr\u00f8nu lei\u00f0ini eisini, og ta\u00f0 er m.a. at taka elektrifisering
  av pallunum til s\u00edn.\\nHann er annars sannf\u00f8rdur um, at ta\u00f0 er sera
  avgerandi at halda l\u00edv \u00ed olju- og gassvinnuni, men um somu t\u00ed\u00f0
  \u2013 um vinnan skal kunna halda fram vi\u00f0 at framlei\u00f0a \u2013 so m\u00e1
  hon liva upp til \u201cnet-zero\u201d m\u00e1lini.\\nGunher sigur v\u00ed\u00f0ari,
  vindorkan fr\u00e1 Viking Wind projektinum eigur at ver\u00f0a br\u00fakt til at
  f\u00e1a komandi olju\u00fatbyggingar vestan fyri Hetland g\u00f3\u00f0kendar, og
  eftir ta\u00f0 eigur sama vindorka at ver\u00f0a br\u00fakt til at veita streym
  til alt Hetland eisini.\\nTa\u00f0 ver\u00f0a framlei\u00f0slu- og goymsluskip av
  hesum slagnum, sum vit fara at s\u00edggja vi\u00f0 f\u00f8royska marki\u00f0 um
  ikki so mong \u00e1r, f\u00e1a \u00fatbyggingar\u00e6tlaninar g\u00f3\u00f0kenning.\\n\u00c6tlanin
  er eisini, at \u00f8ll olju- og gassfeltini vestan fyri Hetland skulu koma ni\u00f0ur
  \u00e1 net/null \u00fatl\u00e1t \u00ed 2030 og harvi\u00f0 minka um CO2 \u00fatl\u00e1ti\u00f0
  fr\u00e1 oljuvinnuni til havs vi\u00f0 8 mi\u00f3. tonsum \u00ed 2050. T\u00e1 ta\u00f0
  hevur eydnast at framlei\u00f0a streym til oljuvinnuna til havs eigur n\u00e6sta
  stig \u00ed Orion \u00e6tlanini at ver\u00f0a tiki\u00f0, og ta\u00f0 er at \u201ctransform
  Shetland\u2019s current dependency on fossil fuel to affordable renewable energy
  to address fuel poverty and improve community wealth\u201d.\\nTeinurin til F\u00f8roya
  er stytri enn til Hetlands, t\u00e1 komandi \u00fatbyggingar skulu gerast.\\nHetland
  harri yvir s\u00edni egnu orkuframt\u00ed\u00f0\\nEndam\u00e1li\u00f0 er, at Hetland
  sj\u00e1lvt skal kunna vera harri yvir s\u00edni orkuframt\u00ed\u00f0, og ta\u00f0
  merkir, at oyggjarnar vi\u00f0 vindorku fyrst og fremst skulu kunna framlei\u00f0a
  streym og harvi\u00f0 eisini vetni, sum koma at minka munandi um pr\u00edsin \u00e1
  framt\u00ed\u00f0ar orkuni og harvi\u00f0 ikki ver\u00f0a bundin at teimum loysnum,
  sum ver\u00f0a gj\u00f8rdar \u00e1 meginlandinum. Hv\u00ed ikki menna ein orkumi\u00f0depil
  \u00ed Hetlandi vi\u00f0 t\u00ed \u00e6tlan at framlei\u00f0a vetni. Hetland hevur
  t\u00f8rv \u00e1 60.000 tonsum av vetni um \u00e1ri\u00f0 fyri at minka um ella
  sleppa av vi\u00f0 n\u00fdtsluna av diesel og \u00f8\u00f0rum fossilum brennievnum.
  Til tess at r\u00f8kka t\u00ed m\u00e1linum er t\u00f8rvur \u00e1 600MW av vindorku
  b\u00e6\u00f0i \u00e1 landi og til havs. Vi\u00f0 \u00ed Orion\u00e6tlanini er ein
  risast\u00f3r fl\u00f3tandi vindorkulund eystan fyri oyggjarnar upp\u00e1 2GW \u00ed
  st\u00f8dd.\\nSullom Voe oljuterminalurin hevur 40 \u00e1r \u00e1 baki og fer at
  virka \u00ed mong \u00e1r aftrat. Hann kann f\u00e1a st\u00f3ran t\u00fddning fyri
  gr\u00f8na skifti\u00f0 \u00ed Hetlandi.\\nAlt hetta sn\u00fdr seg um at menna og
  skapa ein n\u00fdggjan \u00eddna\u00f0 sigur Gunther Newcombe. Partur av \u00e6tlanini
  er m.a. at \u00fatflyta 300.000 tons av gr\u00f8num vetni um \u00e1ri\u00f0, fimm
  fer\u00f0ir so n\u00f3gv, sum Hetland sj\u00e1lvt hevur t\u00f8rv \u00e1. Ta\u00f0
  kann koma at r\u00f8kka til 12% av samla\u00f0a bretska t\u00f8rvinum \u00ed 2050.
  Hann heldur, at Sullom Voe oljuterminalurin kann vera partur av \u00e6tlanini fyri
  menningina. Havnin \u00ed Sullom Voe, sum framhaldandi fer at vera ein olju\u00fatflytandi
  havn, kann eisini br\u00fakast \u00ed sambandi vi\u00f0 vindorkumenningina og \u00fatflutning
  av gr\u00f8num vetni.\\nGunther vi\u00f0gongur, at sj\u00e1lvandi fer ta\u00f0 ikki
  at bera til at seta alt \u00ed gongd, sum er \u00e1 teknibor\u00f0inum, men okkurt
  m\u00e1 so gerast til tess at ganga gr\u00f8na skiftinum \u00e1 m\u00f8ti heldur
  hann. Og hetta er so ein byrjan. Og enn er alt hetta so n\u00fdtt. Hann heldur t\u00ed
  , at kunning um hetta er lykilin \u2013 ta\u00f0 er ein t\u00fd\u00f0andi t\u00e1ttur
  \u00ed at kunna gera hana ella partar av henni til veruleika.\\n\u00cd st\u00fdringsb\u00f3lkinum
  fyri Orion eru umbo\u00f0 fyri olju- og gassfel\u00f8gini BP, Equinor, Shell, SSE,
  Total og EnQuest - \u00f8ll fel\u00f8g, sum eru virkin vestan fyri Hetland tvs.
  \u00ed f\u00f8royska grannalagnum.\\nOrionprojekti\u00f0, sum enn er \u00ed tess
  byrjan, er mett at koma at kosta millum og 5 og 10 mia. pund.\"", "\"1 Skr\u00e1s.nr.
