  2013 eisini havt kunningar\u00e1t\u00f8k um L\u00edvstrygging og serligu Kjarnutryggingina,
  sum er eitt fr\u00e1l\u00edkt l\u00edvstryggingartilbo\u00f0 til flestu f\u00f8royingar.
