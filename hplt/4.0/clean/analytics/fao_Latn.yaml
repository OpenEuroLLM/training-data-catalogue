  to medarbejdere. Omkostningerne i forbindelse med opsigelserne har ogs\u00e5 haft
  en negativ indvirkning p\u00e5 \u00e5rets resultat Den nuv\u00e6rende rentekrig
  har haft en kraftig negativ indvirkning p\u00e5 sparekassens basisindtjening i 2.
  halvdel af Sparekassen s\u00e6nkede i et modsvar sin 1. prioritet fra 5,60 % til
