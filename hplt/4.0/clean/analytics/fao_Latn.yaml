  lokalsamfundet og i vores v\u00e6rdier: Vi vil v\u00e6re kendte for at v\u00e6re
  dygtige, 15\\n17 Lei\u00f0slufr\u00e1grei\u00f0ing / Ledelsesberetning virkisf\u00fas
  og rei\u00f0ilig og \u00ed okkara v\u00edsi\u00f3n: Hin tryggi, dugnaligi og hugnaligasti
  f\u00f8royski privatkundabanki. Vit vilja vera ein \u00e1byrgdarfullur og vir\u00f0isskapandi
  peningastovnur. Vit virka tilvita\u00f0 fyri at f\u00e1a tey bestu \u00farslitini,
