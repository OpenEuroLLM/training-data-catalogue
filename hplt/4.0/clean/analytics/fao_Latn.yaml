  \u00f8\u00f0rum t\u00e6nastum hj\u00e1 f\u00f8roysku posth\u00fasunum. T\u00edverri
  var \u00ed desember ney\u00f0ugt hj\u00e1 Sparikassanum at siga tveimum f\u00f3lkum
  \u00far starvi. Uppsagnar\u00fatrei\u00f0slurnar hava \u00e1virka\u00f0 \u00e1rs\u00farsliti\u00f0
