  og solei\u00f0is stu\u00f0la lokalsamfelagnum. Hetta er ein felags\u00e1byrgd, at
  vit \u00f8ll tr\u00edvast og kunnu virka her, b\u00e6\u00f0i n\u00fa og \u00ed framt\u00ed\u00f0ini.
  Sparikassin \u00e1sannar t\u00fddningin av, at Sparikassin er ein virkin vi\u00f0sp\u00e6lari
  \u00ed hesum verki, sum ein lokalur peningastovnur. Vi\u00f0skiftaf\u00f3lk Vit
  leggja st\u00f3ran dent \u00e1 pers\u00f3nligt samband og samskifti, t\u00e1 vit
  hitta vi\u00f0skiftaf\u00f3lk okkara. Vit gera alt fyri at n\u00f8kta t\u00f8rvin,
  sum vi\u00f0skiftaf\u00f3lk okkara hava fyri bankat\u00e6nastum, veita eina eftirfarandi,
  grei\u00f0a og rei\u00f0iliga r\u00e1\u00f0geving solei\u00f0is, at vi\u00f0skiftaf\u00f3lk
  alt\u00ed\u00f0 hava \u00e1lit \u00e1 okkum. Eitt neyvt samband vi\u00f0 okkara
  vi\u00f0skiftaf\u00f3lk er avgerandi fyri okkara g\u00f3\u00f0a umd\u00f8mi og tilverur\u00e6tt
  yvirh\u00f8vur. Vit hava mi\u00f0v\u00edst \u00ed fleiri \u00e1r f\u00f8rleikament
  starvsf\u00f3lk okkara \u00ed sambandi vi\u00f0 at r\u00e1\u00f0geva okkara vi\u00f0skiftaf\u00f3lki.
  Vit hava \u00e6tlanir um at gera eina n\u00f8gdsemiskanning millum vi\u00f0skiftaf\u00f3lk
  okkara \u00ed M\u00e1li\u00f0 hj\u00e1 okkum er, at 80 % eru n\u00f8gd ella sera
  v\u00e6l n\u00f8gd vi\u00f0 r\u00e1\u00f0gevingina, tey f\u00e1a fr\u00e1 okkum.
  Sparikassin mi\u00f0ar eftir at gera eina t\u00edl\u00edka n\u00f8gdsemiskanning
  regluliga og \u00ed minsta lagi 3. hv\u00f8rt \u00e1r. Lokalsamfelagi\u00f0 Su\u00f0uroyar
  Sparikassi var\u00f0 settur \u00e1 stovn \u00ed V\u00e1gi \u00ed H\u00f3ast vit
  eru vor\u00f0in st\u00f8rri \u00ed dag, solei\u00f0is at Sparikassin eisini hevur
  eitt r\u00e6ttiliga st\u00f3rt virksemi \u00ed Havn, eru vit enn ein lokalur peningastovnur,
  sum hevur s\u00ednar sterku r\u00f8tur \u00ed lokalsamfelagnum \u00ed Su\u00f0uroy.
  Vi\u00f0 okkara sterka festi \u00ed lokal\u00f8kinum, hava vit eitt nat\u00farligt
  ynski um at stu\u00f0la gongdina \u00ed \u00f8kinum. T\u00ed vilja vit eisini br\u00faka
  arbejdssomme og redelige og i vores vision: F\u00e6r\u00f8ernes trygge, kompetente
  og hyggeligste privatkundebank. Vi \u00f8nsker at v\u00e6re et ansvarligt og v\u00e6rdiskabende
  pengeinstitut. Vi arbejder bevidst p\u00e5 at skabe de bedste resultater for s\u00e5vel
  vores kunder, lokalsamfund og os selv som pengeinstitut. Sparekassen anerkender
  vigtigheden af, at vores forretning ikke kun er drevet ud fra et rent fokus p\u00e5
  en positiv regnskabsm\u00e6ssig bundlinje. Forretning for os drejer sig ogs\u00e5
  om en positiv interaktion med andre akt\u00f8rer, at udvise ansvarlighed og redelighed
  i de relationer, hvori sparekassen indg\u00e5r. Sparekassen arbejder i \u00f8jeblikket
  med at udarbejde et s\u00e6t guidelines, som skal underst\u00f8tte vores m\u00e5de
  at drive forretning p\u00e5. Guidelineserne forventes offentliggjort p\u00e5 vores
  hjemmeside i l\u00f8bet af Vi tror p\u00e5 vigtigheden af, at vi alle akt\u00f8rer
  (fx borgere, myndigheder og erhvervsliv) i lokalsamfundet deltager aktivt i og tager
  ansvar for at \u00f8ge trivslen og st\u00f8tter op om lokalomr\u00e5det. Det er
  et f\u00e6llesansvar, at vi alle trives og kan virke her p\u00e5 kort- og langsigt.
  Sparekassen anerkender vigtigheden af, at sparekassen er en aktiv medspiller i disse
  bestr\u00e6belser, som et lokalt pengeinstitut. Kunder Vi l\u00e6gger stor v\u00e6gt
  p\u00e5 den personlige kontakt og dialogen i m\u00f8det med vores kunder. Vi bestr\u00e6ber
  os p\u00e5 at im\u00f8dekomme kundernes behov for bankydelser, at yde en trov\u00e6rdig,
  forst\u00e5elig og redelig r\u00e5dgivning og i \u00f8vrigt at g\u00f8re os fortjent
  til kundernes tillid. En st\u00e6rk, t\u00e6t og god kunderelation er afg\u00f8rende
  for vores succes og eksistensberettigelse i det hele taget. Vi har gennem flere
  \u00e5r systematisk arbejdet med at opkvalificere medarbejdernes kompetencer og
  uddannelsesniveau i forbindelse med r\u00e5dgivningssituationen. Vi har planlagt
  at gennemf\u00f8re en tilfredshedsm\u00e5ling blandt vores kunder i l\u00f8bet af
  M\u00e5let er, at 80 procent er enten tilfredse eller meget tilfredse med den r\u00e5dgivning,
  de modtager fra os. Sparekassen vil bestr\u00e6be sig p\u00e5 at gennemf\u00f8re
  en kundetilfredshedsunders\u00f8gelse regelm\u00e6ssigt og mindst hvert 3. \u00e5r.
  Lokalsamfundet Su\u00f0uroyar Sparikassi blev grundlagt i 1943 i V\u00e5g. Selvom
  vi er vokset siden, s\u00e5 sparekassen i dag ogs\u00e5 er udbredt i Thorshavn,
  er vi stadig et lokalt pengeinstitut med st\u00e6rke r\u00f8dder i lokalsamfundet
  p\u00e5 Su\u00f0uroy. Med baggrund i vores forankring i lokalomr\u00e5det har vi
  et naturligt \u00f8nske om at underst\u00f8tte udviklingen i omr\u00e5det. Vi s\u00f8ger
  derfor at udnytte vores indg\u00e5ende kendskab til 16\\n18 Lei\u00f0slufr\u00e1grei\u00f0ing
  / Ledelsesberetning okkara neyva kunnleika til lokal\u00f8ki\u00f0, tess \u00edb\u00fagvar
  og vinnul\u00edvsf\u00f3lk, at sameina \u00e1byrgdarfulla f\u00edgging og rei\u00f0iliga
  r\u00e1\u00f0geving til gagns fyri b\u00e6\u00f0i lokal\u00f8ki\u00f0, vi\u00f0skiftaf\u00f3lkini
  og okkum sj\u00e1lvi sum peningastovn. Harafturat vilja vit vera virkin vi\u00f0leikari
  \u00ed felagsl\u00edvinum, sum her er. Vit stu\u00f0la sostatt lokalan \u00edtr\u00f3tt
  og lokala mentan, t\u00ed vit eru sannf\u00f8rd um, at jalig sambond l\u00f8na seg,
  og t\u00ed \u00edtr\u00f3ttar- og mentanarupplivingar geva samanhald og virka fyri
  einum heilsug\u00f3\u00f0um og r\u00edkum l\u00edvi. Sparikassin skipa\u00f0i eitt
  serstakt P\u00e1l-l\u00e1n, solei\u00f0is at vi\u00f0skiftaf\u00f3lk f\u00e1a m\u00f8guleika
  til at stu\u00f0la byggingini av 50 m. svimjihyli og v\u00e6lverumi\u00f0st\u00f8\u00f0
  vi\u00f0 einum kontantgjaldi, sum er f\u00edggja\u00f0 vi\u00f0 g\u00f3\u00f0um
  treytum \u00ed Sparikassanum. \u00cd Su\u00f0uroyar Sparikassa stu\u00f0la vit eisini
  royndirnar at seta mannar\u00e6ttindi og spurningin um ve\u00f0urlagsbroytingarnar
  frammaliga \u00e1 altj\u00f3\u00f0a dagsskr\u00e1nna, men sum ein lokalur peningastovnur
  seta vit serliga okkum lokal m\u00e1l, og t\u00ed hava vit ikki or\u00f0a politisk
  sj\u00f3narmi\u00f0 \u00ed altj\u00f3\u00f0a h\u00f8pi. Sparikassin hevur ment eitt
  serligt l\u00e1n \u00ed sambandi vi\u00f0 orkusparandi \u00e1b\u00f8tur av b\u00fast\u00f8\u00f0um
  CO2 l\u00e1ni\u00f0 -, har vi\u00f0skiftaf\u00f3lkini kunnu f\u00e1a orkukanna\u00f0
  s\u00edn b\u00fasta\u00f0, og solei\u00f0is f\u00e1a grei\u00f0u \u00e1, hvat best
