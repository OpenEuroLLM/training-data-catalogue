  fordi vi tror p\u00e5, at positive relationer l\u00f8nner sig, og fordi sports-
  og kulturoplevelser skaber sammenhold og bidrager til et sundt og rigt liv. Sparekassen
  har udviklet et s\u00e6rligt l\u00e5n P\u00e1l-l\u00e1n, hvorved kunderne f\u00e5r
  mulighed for at st\u00f8tte byggeriet af 50 m sv\u00f8mmebassinet og wellness med
  et kontantindskud, som er l\u00e5net p\u00e5 favorable vilk\u00e5r i sparekassen.
  I Su\u00f0uroyar Sparikassi bakker vi desuden op om bestr\u00e6belserne p\u00e5
  at s\u00e6tte menneskerettigheder og klimap\u00e5virkninger h\u00f8jt p\u00e5 den
