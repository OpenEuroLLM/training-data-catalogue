  R\u00e6ttari sagt, so er hesin h\u00e1tturin ein rangl\u00e6ra av veruleikanum,
  og um ein bert tekur s\u00e6r fimm minuttir at lesa eina s\u00f8gu b\u00f3k ella
  eina alfr\u00f8\u00f0isb\u00f3k um hesi ting, so f\u00e6r ein r\u00f8ttu vitanina
  og akkur\u00e1t ta\u00f0 umvenda, sum tr\u00faarverja l\u00fdsir vi\u00f0. Men ta\u00f0
  tykist, sum um f\u00f8roysk tr\u00faarverja hv\u00f8rki hevur t\u00ed\u00f0 ella
  \u00f3mak til sl\u00edkt og hetta er ta\u00f0 teir f\u00f8roysku apologetikkararnir
  bj\u00f3\u00f0a \u00f8\u00f0rum tr\u00fagvandi \u00ed f\u00f8royum, so jeg v\u00f3ni
  at tr\u00fagvandi onkursvegna hugsa s\u00e6r um \u00e1\u00f0renn lygnin ver\u00f0ur
  sv\u00f8lgd.\\nJeg havi alt\u00ed\u00f0 veri\u00f0 \u00e1huga\u00f0ur \u00ed ors\u00f8kum
  til eitt og hv\u00f8rt fyribrigdi ella hugsunarh\u00e6ttum og eftir umhugsan s\u00edggi
  jeg tveir m\u00f8guleikar eru fyri hv\u00ed apologetikkarirnir gera solei\u00f0is;
  m\u00f8guliga er ta\u00f0 avnoktan av veruleikanum fyri at verja s\u00edna uppfatan
  av eini tr\u00fagv, sum er blivin \u00ed s\u00e6r sj\u00e1lvum teirra veruleiki
  og hv\u00f8r vi\u00f0 ikki verja s\u00edn veruleika? Men \u00ed hesum ein skeivur
  veruleiki. M\u00f8guliga er ta\u00f0 bert ein spurningur um manglandi vitan um r\u00e1kini
  og heimss\u00f8gu. Ta\u00f0 kann eisini ver\u00f0a ein samanfletting av b\u00e1\u00f0um,
  ella hevur nakar eitt anna\u00f0 bo\u00f0? V\u00f3ru 10 \u00e1r \u00ed sk\u00fala
  ikki nokk? Bert vi\u00f0 at lesa eina tilvildarliga apologetiska grein \u00ed mi\u00f0lunum,
  so s\u00e6r ein at innihaldi er \u00f3\u00e6rligt, ein avnoktan, og \u00ed flestum
  f\u00f8rum ein long villa av eini grein vi\u00f0 ongum vi\u00f0ger\u00f0um ella
  naka\u00f0 n\u00e1mind t\u00ed, i\u00f0 kann tykjast at vera skilag\u00f3\u00f0ur
  framfer\u00f0arh\u00e1ttur at l\u00fdsa eitt evni.\\nMen ta\u00f0 skilaleysa ste\u00f0gar
  ikki har, \u00e1 nei.. t\u00ed v\u00edsindi kemur fyri skotum eisini, sum eg nevndi
  \u00e1\u00f0renn. N\u00f3gv t\u00e6r somu grundgevingar og \u00ed framfer\u00f0arh\u00e1tturin
  fyri r\u00e6\u00f0uleikar, sum tey gudloysu eru r\u00f3tin til, so ver\u00f0ur ta\u00f0
  eisini br\u00fakt vi\u00f0v\u00edkjandi v\u00edsindi. Eftir hugsanini hj\u00e1 teimum,
  i\u00f0 umbo\u00f0a f\u00f8royska tr\u00faarverju er v\u00edsindi og v\u00edsindaf\u00f3lk,
  sum heild onkursvegna \u00f3menniskjasligt, t\u00ed gud ikki er \u00ed roknistykkinum,
  og opinl\u00fdst er ta\u00f0, at gudloysingar umbo\u00f0a alt ov n\u00f3gv innan
  v\u00edsindi. Samansv\u00f8rjingar 1.1! \u00cdfylgi tr\u00faarverju eru \u00e1st\u00f8\u00f0ir
  innan alisfr\u00f8\u00f0i og l\u00edvfr\u00f8\u00f0i grundir til, at heimsins r\u00e6\u00f0uleikar
  v\u00f3ru og vera framdar, og ta\u00f0 er tann stutta ni\u00f0urst\u00f8\u00f0an.
  Men ta\u00f0 okkara apologetikkarir leggja fram ver\u00f0ur t\u00f3 sj\u00e1lvandi
  ikki grundgivi\u00f0 fyri, men bert einf\u00f8ld tokutala, og ta\u00f0 tekur stutta
  t\u00ed\u00f0 at finna \u00fatav, at ta\u00f0, i\u00f0 ver\u00f0ur lagt fram er
  fullkomiliga burturvi\u00f0.\\nEin kann spyrja teimum h\u00f3ast alt, um apologetiska
  heimsmyndin er verulig, so hv\u00ed hugsa\u00f0u menniskju seg ikki um hetta \u00e1\u00f0renn
  tey g\u00f3vu Hezbollah vitanina um Relativitets \u00c1st\u00f8\u00f0i? Ella t\u00f3ku
  vitan um Menningarl\u00e6ru \u00far Nor\u00f0ur \u00cdrlandi so r\u00e6\u00f0uleikarnir
  kundu ste\u00f0gast? Ella s\u00f8gdu nei vi\u00f0 f\u00f3lki\u00f0 \u00ed gamla
  Jugoslavia, at tey f\u00e1a ikki vitan um l\u00e6knafr\u00f8\u00f0i, so okur sluppu
  undan teimum r\u00e6\u00f0uleikunum har? Ella v\u00f3ru og eru \u00f8ll tey f\u00f3lkini,
  sum hava framt hesar r\u00e6\u00f0uleikar og framhaldandi gera so, ikki bara gudleysir
  nasistar?\\nElla hv\u00ed eru tey mest sekularisera\u00f0i londini \u00ed heiminum
  saman vi\u00f0 teimum, i\u00f0 hava lutfallisliga flestu gudloysingar og agnostikkarar
  ikki einar\u00e6\u00f0ir?\\nT\u00e1 i\u00f0 kritikkurin \u00edm\u00f3ti v\u00edsindi
  ver\u00f0ur f\u00f8rdur fram er ta\u00f0 oftast endurt\u00f8kur fr\u00e1 teimum,
  i\u00f0 umbo\u00f0a anna\u00f0 hv\u00f8rt Creationism og ID, t\u00f3 ta\u00f0 veruliga
  so er l\u00edtil munur \u00e1 b\u00e1\u00f0um. Men kritikkurin er undir ongum umst\u00f8\u00f0um
  vi\u00f0komandi kritikkur og ta\u00f0 er ein grund hv\u00ed jeg ikki t\u00edmi at
  nevna naka\u00f0 d\u00f8mi, t\u00ed ta\u00f0 er als ikki vi\u00f0komandi ella loysir
  naka\u00f0 anna\u00f0 enn at l\u00fdsa fleiri misskiljingar, og harafturat liggur
  trupulleikin hj\u00e1 t\u00ed, i\u00f0 kemur vi\u00f0 hesum sokalla\u00f0a kritikki.
  Misskiljingar av \u00e1st\u00f8\u00f0um, misskiljingar av v\u00edsindar\u00e1kinum,
  misskiljingar hvat v\u00edsindi inniber og hvat v\u00edsindalig \u00e1st\u00f8\u00f0i
  merkir, ta\u00f0 er ta\u00f0, i\u00f0 ver\u00f0ur lagt fram. Um ein pers\u00f3nur
  ikki hevur \u00ed minsta lagi\u00f0 grundsj\u00f3narmi\u00f0ini r\u00f8tt, so er
  kritikkurin \u00f3iva\u00f0 l\u00edka h\u00f8pisleysur og skeivur. Ein kann royna
  at fr\u00e1grei\u00f0a teimum, at ta\u00f0 skal skiljast so og so, og at teir hava
  misskilt hatta og hetta men av t\u00ed, at tr\u00faarverjan hevur frammanundan tiki\u00f0
  atlit til rangl\u00e6rurnar vegna teirra upp\u00e1hald um gu\u00f0, so er teirra
  ni\u00f0urst\u00f8\u00f0a vard av absolutistiskum grundum.\\n\u00d8rvitistosi\u00f0
  og ta\u00f0 \u00f3grundgivna upp\u00e1haldi fr\u00e1 apologetikkarum er n\u00f3gv
  og somulei\u00f0is skilaleyst \u00ed flestum f\u00f8rum men somulei\u00f0is eitt
  afturvendandi fyribrigdi n\u00fa \u00e1 d\u00f8gum \u00ed mi\u00f0lunum. Greinar
  vi\u00f0 ongum haldi \u00ed veruleikanum, f\u00e1kunnugt innihaldi, eitt \u00f8rgrynna
  av misskiltum r\u00e1kum, og ein hurlivasi av r\u00e1kum, i\u00f0 ikki hoyra saman
  (\u00f8ll B eru C). Villa aftan\u00e1 villu! V\u00f3nandi eru ta\u00f0 skilag\u00f3\u00f0
  tr\u00fagvanid menniskjur, i\u00f0 duga at s\u00edggja og skilja \u00edmillum t\u00ed
  apologetikkarirnir leggja fram, t\u00ed ta\u00f0 er \u00ed stuttum rangl\u00e6ra
  av n\u00e6rum hv\u00f8rjum b\u00f3kstavi teir br\u00faka! Men skelkandi nokk teljast
  tey, i\u00f0 hava tr\u00fdst \u00e1 \u201clike\u201d kn\u00f8ttin undir greinum
  teirra upp \u00edm\u00f3ti teimum hundra\u00f0, og eitt fr\u00e1l\u00edkt tekin
  um at tr\u00faarverja hevur eitt \u201cdumbing down\u201d \u00e1virkan \u00e1 menniskju,
  ella ta\u00f0 kann skiljast, sum \u00e1gr\u00fdtni til at verja tr\u00fanna fr\u00e1
  veruleikanum.\\nEin skal h\u00f3ast hetta ver\u00f0a ansin \u00ed, at ikki \u00fatiloka
  alt og bl\u00edva l\u00edka dogmatiskur \u00ed s\u00edni hugsan, sum ta\u00f0 ein
  \u00e1varar um. T\u00ed at sj\u00e1lvandi skulu ymisk og \u00f8\u00f0rv\u00edsi
  \u00e1st\u00f8\u00f0i og hugsanir hava m\u00f8guleikan at pr\u00f3gva seg ella standa
  s\u00edn m\u00f8guleika. T\u00ed frambur\u00f0ur innan v\u00edsindi og hj\u00e1
  mennisjum ney\u00f0turviliga inniber og krevur n\u00fdggja vitan, sum onkursvegna
  gongur \u00edm\u00f3ti t\u00ed, i\u00f0 er vi\u00f0urkend vitan, ella r\u00e6ttar
  upp\u00e1 ta\u00f0 vitanina ein hevur frammanundan. Solei\u00f0is halda okur kjaki\u00f0
  livandi og deila vitan okkra millum, ella ta\u00f0 endam\u00e1li\u00f0 vi\u00f0
  t\u00ed heila, ikki so? Men n\u00fdggj \u00e1st\u00f8\u00f0i og \u00f8\u00f0rv\u00edsar
  meiningar hava ta\u00f0 \u00e1byrgd og skyldu, at skulu kunna grundgeva \u00fatfr\u00e1
  veruligum tingum og pr\u00f3vf\u00f8rslum fyri at standa s\u00edna roynd og kanna
  um ta\u00f0 er sannl\u00edkt, og ikki framhaldandi endurgeva misfatanir og f\u00e1kunnugt
  r\u00f3p um ymisk r\u00e1k, i\u00f0 hevur einki \u00edt\u00f8kiligt samband vi\u00f0
  hava hv\u00f8rt anna\u00f0 ella veruleikan at gera. Ein grund hv\u00ed ID og Creationisma
  til d\u00f8mis ver\u00f0ur b\u00f3lka\u00f0, sum falskt v\u00edsindi. T\u00e6r ymisku
  rangl\u00e6rurnar um umheimin, i\u00f0 apologetikkararnir leggja fram hava bert
  ta\u00f0 endam\u00e1l, at villlei\u00f0a tey tr\u00fagvandi til at hava eina \u00e1v\u00edsa
  fatan um eitt og hv\u00f8rt evni, sum oftast er j\u00fast tann fatanin, sum rangstaddi
  fr\u00e1 veruleikanum apologetikkarin hevur.\\nEin kann royna at spyrja og spyrja
  tr\u00faarverjuna um at gera ta\u00f0, sum \u00f8ll onnur skynsamt gera t\u00e1
  i\u00f0 tey leggja eitt og hv\u00f8rt fram, t.e. fyrst og fremst at grundgeva, fr\u00e1grei\u00f0a
  og v\u00edsa \u00e1, men eisini ta\u00f0 er uttanfyri teirra vit og skil. Endaleysar
  undanf\u00f8rslur, sum ein opinbart kann l\u00e6ra \u00e1 skei\u00f0um um tr\u00faarverju
  \u00ed f\u00f8royum, t\u00ed m\u00e6r vitandi er ta\u00f0 ta\u00f0 einasta apologetikkarnir
  gera, ella m\u00f8sna um gudloysi, og me\u00f0an r\u00e6ttiliga l\u00edti\u00f0
  ver\u00f0ur gj\u00f8rt burtur\u00far at verja tr\u00fanna tvs. teirra upp\u00e1hald.\\nSo,
  um ty\u00f0um vilja s\u00edggja reint \u00f8rvististos \u00ed f\u00f8royskum mi\u00f0lunum,
  so glottar ta\u00f0 \u00ed av og \u00e1 av t\u00ed h\u00f8ga mistantropiska tr\u00faarverju
  r\u00f3pum \u2013 F\u00f8roysk tr\u00faarverja, vernd teirra, i\u00f0 misskilja.\"",
  "\"\u00cd 1742 sigldi hollendska skipi\u00f0 Westerbeek \u00e1 land vi\u00f0 Lopransei\u00f0i
  \u00ed Su\u00f0uroy.\\n\u00datg\u00e1vudagur: 22-02-2016\\nV\u00f8runr.: PPS000216\\nVir\u00f0i:
  36,00\\nEysturindiafarin Westerbeek\\nUm h\u00e1lvgum t\u00f3lv t\u00ed\u00f0ina,
  tann 2. september 1742, kemur eitt st\u00f3rt seglskip vi\u00f0 \u00f8llum seglum
  vundin \u00ed r\u00e1 siglandi \u00far myrkrinum og stevnir beint \u00e1 land vestanfyri
  Lopra. \u00cd myrkrinum og \u00ed mj\u00f8rkanum varnast manningin ikki at teir
  stevna beint \u00e1 land. Skipi\u00f0 er meiri enn 48 fj\u00f3r\u00f0ingar ov nor\u00f0arlaga.
  N\u00fa er ov seint, t\u00ed st\u00f3ri eysturindiafarin, i\u00f0 er komin allan
  vegin \u00far Ceylon, er bert eini h\u00e1lvthundra\u00f0 favnar \u00far berginum
  \u00ed Lopra. Snara\u00f0 var\u00f0 hart og seglini v\u00f3r\u00f0u eisini snara\u00f0i
  \u00e1, men skipi\u00f0 t\u00f3k \u00ed bakbor\u00f0ss\u00ed\u00f0u og f\u00f3r
  at bresta m\u00f3ti berginum. \u00darsliti\u00f0 var at skipi\u00f0 f\u00f3r at
  leka illa, men var\u00f0 skj\u00f3tt tiki\u00f0 inn millum f\u00fdra sker. Skiparin
  gav bo\u00f0 um at kasta akker og taka seglini ni\u00f0ur, men ov seint var. Afturendin
  \u00e1 skipinum bardist m\u00f3ti berginum. Manningin kom s\u00e6r t\u00f3 upp\u00e1
  eina r\u00f3k, har n\u00f3gv teir flestu v\u00f3ru bjarga\u00f0ir, men teir sum
  l\u00f3gu sj\u00fakir \u00ed koyggjuni f\u00f3rust og onkur datt ni\u00f0ur\u00edmillum
  eisini. T\u00e1 f\u00fdra av monnunum komu til V\u00e1gs at bi\u00f0ja um hj\u00e1lp,
  sigst at v\u00e1gbingar hildu teir vera sj\u00f3r\u00e6narar og kr\u00f3gva\u00f0u
  seg fyri teimum.\\nTa\u00f0 st\u00f3\u00f0 illa til hj\u00e1 manningini, men h\u00f3ast
  skipi\u00f0 so l\u00ed\u00f0andi sakk og hvarv, so bjarga\u00f0ust heili 81 mans,
  me\u00f0an 10 doy\u00f0u av hendingini. \u00cd Su\u00f0uroy v\u00f3ru teir v\u00e6l
  m\u00f3ttiknir. Teir f\u00f3ru skj\u00f3tt til Havnar, har sj\u00f3fr\u00e1grei\u00f0ing
  var\u00f0 l\u00f8gd fram. Ikki var l\u00e6tt at brey\u00f0f\u00f8\u00f0a og herberga
  \u00f8llum hesum monnum, t\u00ed t\u00e1 var f\u00f3lkatali\u00f0 \u00ed F\u00f8royum
  ikki meiri enn gott 3000. Ikki allir sluppu av landinum vi\u00f0 skipunum hj\u00e1
  Kongaliga handlinum, og teir flestu m\u00e1ttu t\u00ed b\u00ed\u00f0a til \u00e1ri\u00f0
  eftir, t\u00e1 h\u00e1lendska skipi\u00f0 Mercuruis kom eftir teimum.\\nS\u00f8gan
  um skip sum Westerbeek er samstundis s\u00f8gan um risast\u00f3ra h\u00e1lendska
  eysturindiska felagi\u00f0 Vereenigde Oostindische Compagnie, i\u00f0 var stovna\u00f0
  \u00ed 1602. Hetta er s\u00f8gan um hvussu fleiri lond \u00ed Evropa runnu um kapp
  fyri at grundleggja hj\u00e1lond \u00ed ymiskum heimsp\u00f8rtum, i\u00f0 kundu
  \u00fatvinna og keypa d\u00fdran farm vi\u00f0 heim, so sum kryddurtir, te og kaffi.
  Eitt r\u00edkid\u00f8mi, i\u00f0 enn ey\u00f0kennir flestu st\u00f3rb\u00fdir \u00ed
  Evropa, so sum London, Amsterdam, Keypmannahavn og a\u00f0rar. Felagi\u00f0 gj\u00f8rdist
  so m\u00e1ttmiki\u00f0, at ta\u00f0 gj\u00f8rdist ein statur \u00ed statinum og
  felagi\u00f0 fekk ikki einans einkarr\u00e6tt at handla vi\u00f0 Eysturindia, men
  eisini r\u00e6tt til at \u00fatb\u00fagva egnar hermenn og solei\u00f0is hava egnan
  her vi\u00f0 \u00e1 fer\u00f0ini. H\u00e1lendska eysturindiska felagi\u00f0 bygdi
  borgir og skansar \u00ed n\u00e6rum \u00f8llum heimsp\u00f8rtum. Millum 1602-1795
  gj\u00f8rdi felagi\u00f0 4.721 fer\u00f0ir \u00far H\u00e1landi til Eysturindia.
  Samla\u00f0a manningartali\u00f0 var 973.000 sj\u00f3f\u00f3lk \u00far \u00f8llum
  Evropa, t\u00f3 v\u00f3ru teir flestu h\u00e1lendingar.\\nWesterbeek er b\u00e6\u00f0i
  ein bygd uttanfyri Eindhoven \u00ed H\u00e1landi og navni\u00f0 \u00e1 hesum tr\u00edmastra\u00f0a
  skipi, i\u00f0 f\u00f3r \u00e1 land \u00ed 1742 vestanfyri Lopra. Skipi\u00f0 var\u00f0
  bygt \u00ed 1722 \u00e1 skipasmi\u00f0ju \u00ed Amsterdam og var ein 145 f\u00f3t
  langur og 650 tons tungur eysturindiafari.\\nSkipi\u00f0 var \u00e1vegis til H\u00e1lands
  \u00far Ceylon \u00ed India, t\u00e1 ta\u00f0 sigldi \u00e1 land \u00ed F\u00f8royum.
  Fer\u00f0in kom at vera dr\u00fagv, fari\u00f0 var \u00far Ceylon \u00ed India 27.
  januar 1742 og 2. september \u00ed 1742 sigldi Westerbeek \u00e1 land. Hetta var
  s\u00e6tta fer\u00f0in hj\u00e1 skipinum, men av n\u00f3gvum mj\u00f8rka kundi ikki
  siglast eftir vanligum t\u00f3lum og t\u00ed f\u00f3rst skipi\u00f0. T\u00e1 v\u00f3ru
  ongir vitar \u00ed F\u00f8royum og sj\u00f3kortini v\u00f3ru ikki so neyv.\\nEin
  skipasmi\u00f0ja hj\u00e1 Eysturindiska Felagnum \u00ed Amsterdam \u00ed 1726. Koparstikk
  eftir Joseph Mulder. Eysturindiska Felagi\u00f0 bygdi yvir 2000 skip, har av gingu
  eini 600 burtur.\\nVi\u00f0 umbor\u00f0 \u00e1 Westerbeek \u00e1 fer\u00f0ini til
  India v\u00f3ru upprunaliga 160 mans: 99 sj\u00f3menn, 51 hermenn og 10 handverkarar.
  T\u00e1 \u00ed t\u00ed\u00f0ini var vandamiki\u00f0 at mynstra umbor\u00f0 \u00e1
  hesar longu fer\u00f0ir, t\u00ed vanligt var at g\u00f3\u00f0 15 % av manningini
  doy\u00f0u \u00e1 \u00fatfer\u00f0ini og eini 10% \u00e1 heimfer\u00f0ini.\\nHeimfer\u00f0in
  hj\u00e1 Westerbeek byrja\u00f0i \u00ed Punto Gale \u00e1 Ceylon og vi\u00f0 \u00e1
  fer\u00f0ini v\u00f3ru 94 mans: 75 sj\u00f3menn, seks hermenn, sjey handverkarar,
  fimm sj\u00faklingar og ein brotsma\u00f0ur. Westerbeek hev\u00f0i gott hundra\u00f0
  tons av pipari og \u00f8\u00f0rum v\u00f8rum. \u00c1 fer\u00f0ini \u00far Batavia,
  i\u00f0 var hj\u00e1landanavni\u00f0 \u00e1 h\u00e1lendska Eysturindia, sum vit
  \u00ed dag kalla Jakarta, v\u00f3ru tr\u00edggir mans longu dey\u00f0ir. Batavia
  er eisini elsta navni\u00f0 fyri Ni\u00f0urlond, t.d. fanst Bataviska Republikkin
  fr\u00e1 1795-1806 sum ein franskur vasalstatur.\\nEnn eru spor eftir Westerbeek
  \u00ed F\u00f8royum, m.a. er eitt skr\u00edn \u00e1 Forngripasavninum og ein klumpur
  av pipari er \u00e1 einum savni \u00ed Su\u00f0uroy. Eisini sigast n\u00f3gvir f\u00f8royingar
  at vera \u00e6tta\u00f0ir fr\u00e1 hesum monnum, t\u00ed \u00ed minsta lagi nakrir
  av teimum v\u00f3ru verandi og fingu b\u00f8rn \u00ed F\u00f8royum, har\u00edmillum
  sveisiski feltskerin (kirurgur) Joseph Gervording von der Schildt (uml. 1707-1753).\\nEysturindiafarin
  Westerbeek er skip, i\u00f0 umbo\u00f0ar eina t\u00ed\u00f0, t\u00e1 H\u00e1land
  var eitt av st\u00f3ru hj\u00e1landaveldunum \u00ed heiminum og Amsterdam var ein
  hin m\u00e6tasti sta\u00f0ur \u00ed heiminum. B\u00fdurin og kanalirnar, i\u00f0
  eru bygdar til skip sum Westerbeek, og tey \u00f3endaligu umbygdu pakkh\u00fasini
  vi\u00f0 kranum ovast, bo\u00f0a enn um eina m\u00e6ta handilstj\u00f3\u00f0. Stendur
  man \u00ed Amsterdam og l\u00edtur vi\u00f0 teim r\u00f8ttu eygunum eftir innara
  b\u00fdnum, so er hann ikki j\u00fast bygdur til bilar. Her eru vegirnir kanalir,
  i\u00f0 kunnu senda st\u00f3r framkomin farmaskip langt inn \u00ed b\u00fdin og
  inn \u00ed landi\u00f0. T\u00e1 kanska man okkurt kv\u00f8ldi\u00f0 \u00e1 einum
  gongut\u00fari - \u00ed hugaheiminum - h\u00f3mar skip sum Westerbeek leggja at
  bryggju.\\nKim Simonsen\\nAmsterdam Universitet\"", "\"Interi\u00f8r\\nV\u00ed\u00f0fevnandi
  \u00fatger\u00f0in\\nSj\u00f3nskur b\u00e6\u00f0i uttan og innan. Polo vekir undran
  longu sum standard vi\u00f0 einum st\u00f3rum \u00farvali av \u00fatger\u00f0arm\u00f8guleikum,
  sum t.d. ta\u00f0 greidliga Digital Cockpit, l\u00edvgandi aircondition-skipanin
  og \u00fatvarpst\u00f3li\u00f0 Composition vi\u00f0 talgildari radiom\u00f3tt\u00f8ku
  DAB+ og telefoninterface. Um t\u00fa vilt hava eitt sindur meira, sum t.d. t\u00edtt
  egi\u00f0 Digital Cockpit Pro, sum kann stillast, eina aircondition-skipan Climatronic,
  sum kann ver\u00f0a laga\u00f0 intuitivt eftir touchflatum \u2013 ella um t\u00fa
  vilt hava ambientelj\u00f3s..? Ta\u00f0 er eingin trupulleiki, t\u00ed alt hetta
  er, treyta\u00f0 av \u00fatger\u00f0argreinini, antin ein partur av standard\u00fatger\u00f0ini
  ella er at f\u00e1a sum eyka\u00fatger\u00f0. Hygg eftir \u00fatger\u00f0argreinunum
  Polo, Polo Life, Polo Style og Polo R-Line.\"", "\"Savnsfagna\u00f0ur \u00e1 Listasavni
  F\u00f8roya\\nEvni\u00f0 \u00ed \u00e1r ver\u00f0ur \u201cull,\u201d og vit hava
  fyrireika\u00f0 eina spennandi skr\u00e1 fyri b\u00f8rn, foreldur, ommur, abbar
  og onnur, i\u00f0 hava hug til eina hugnaliga l\u00f8tu \u00e1 Listasavninum \ud83d\ude00\\n\u00cd
  verkstovuni kunnu tit gera sm\u00e1 skr\u00edmsl og myndir vi\u00f0 t\u00f3gvi,
  gera sey\u00f0ir \u00far modellervoksi, tekna og klippa.\\nVerkstovan er opin allan
  dagin.\\nEisini vera rundv\u00edsingar fyri b\u00f8rn (uml. 20 min.)\\n\u00cd heystfr\u00edt\u00ed\u00f0ini
  hava vit opi\u00f0 m\u00e1nadag til fr\u00edggjadag fr\u00e1 kl. 11-16 og ta\u00f0
  er \u00f3keypis atgongd.\\nHjartaliga v\u00e6lkomin til Savnsfagna\u00f0 \u00e1
  Listasavninum!\\nDate\\n11 Oct - 15 Oct\\nEvery:\\nMon\\nTue\\nWed\\nThu\\nFri\"",
  "\"Minni \u00ed landskatti hj\u00e1 l\u00edtlum innt\u00f8kum\\nLandsskatturin fyri
  l\u00edtlar innt\u00f8kur er minka\u00f0ur heilt upp \u00ed 15.550 kr\u00f3nur \u00ed
  \u00e1r samanbori\u00f0 vi\u00f0 ta\u00f0, sum hann var \u00ed 2015.\\nHetta er
  skatturin hj\u00e1 teimum, sum hava millum 27.500 og 37.500 kr. \u00ed innt\u00f8ku
  um \u00e1ri\u00f0.\\nHj\u00e1 \u00f8\u00f0rum l\u00e1ginnt\u00f8kum er landsskatturin
  minka\u00f0ur eitt sindur minni hesi t\u00edggju \u00e1rini.\\nTil d\u00f8mis fingu
  tey, sum h\u00f8vdu innt\u00f8kuna 37.500 \u00ed 2015 6.417 kr\u00f3nur \u00ed skatti
  um m\u00e1na\u00f0in ta\u00f0 \u00e1ri\u00f0.\\nTey f\u00e1a 5.121 kr. \u00ed \u00e1r.\\nTa\u00f0
  sigur Ruth Vang, landsst\u00fdriskvinna, \u00ed svari til Hans Jacob Thomsen, l\u00f8gtingsmann,
  sum spurdi um skatt av l\u00edtlum innt\u00f8kum.\\nMen so skal takast vi\u00f0,
  at seinastu 10 \u00e1rini eru pr\u00edslagi\u00f0 og l\u00f8narlagi\u00f0 h\u00e6kka\u00f0.\\nL\u00f8nin
  er yvir 30 prosent st\u00f8rri n\u00fa enn hon var \u00ed 2015.\\nOg br\u00fakarapr\u00edstali\u00f0
  er g\u00f3\u00f0 20 prosent st\u00f8rri.\\nNi\u00f0urst\u00f8\u00f0an er sj\u00e1lvandi
  tann, at ein kr\u00f3na \u00ed 2025 er ikki ta\u00f0 sama verd sum ein kr\u00f3na
  var \u00ed 2015.\\nSum fr\u00e1 l\u00ed\u00f0ur gera pr\u00edsv\u00f8kstur og l\u00f8narv\u00f8kstur,
  at innt\u00f8kuskatturin veksur aftur, h\u00f3ast l\u00f8gtingi\u00f0 ikki broytir
  skattin.\\nRuth Vang sigur, at hon \u00ed n\u00e6stum fer at almannakunngera uppskot
  um at javna skatt og avgj\u00f8ld.\"", "\"U15 landsli\u00f0i\u00f0 hj\u00e1 gentum
