  Usikkerheder ved indregning og m\u00e5ling Den v\u00e6sentligste usikkerhed ved
  indregning og m\u00e5ling knytter sig til udl\u00e5n. Su\u00f0uroyar Sparikassi
  arbejder l\u00f8bende med at forbedre metoder til indregning og m\u00e5ling heraf,
  men vurderer at usikkerheden er p\u00e5 et niveau, der er af uv\u00e6sentlig betydning
  i forhold til \u00e5rsrapporten. Begivenheder efter regnskabs\u00e5rets afslutning
  Der er fra balancedagen og frem til i dag ikke indtr\u00e5dt forhold, som forrykker
  vurderingen af \u00e5rsrapporten. V\u00e1\u00f0ar og v\u00e1\u00f0ast\u00fdring
  V\u00e1\u00f0ar og at st\u00fdra undan v\u00e1\u00f0um er ein sera t\u00fddningarmikil
  partur av virkis\u00e6tlan Sparikassans. \u00cd visi\u00f3nini hj\u00e1 Sparikassanum
  ver\u00f0ur beinlei\u00f0is sagt, at Sparikassin skal vera F\u00f8roya tryggi, dugnaligi
  og hugnaligasti privatkundabanki. Or\u00f0i\u00f0 tryggur er nevnt \u00ed visi\u00f3nini
  fyri at leggja dent \u00e1, at Sparikassin alt\u00ed\u00f0 leggur seg eftir g\u00f3\u00f0ari
  og tryggari v\u00e1\u00f0ast\u00fdring. Nevnd Sparikassans \u00e1sannar, at ein
  g\u00f3\u00f0 og trygg st\u00fdring av v\u00e1\u00f0a minkar um tapsvanda, og sleppur
  Sparikassanum undan at n\u00fdta \u00f3ney\u00f0uga orku um vandi veruliga skuldi
  veri\u00f0 \u00e1 fer\u00f0. Ein v\u00e1nalig og \u00f3fullf\u00edggja v\u00e1\u00f0ast\u00fdring
  kann seta Sparikassans grundarlag undir tr\u00fdst. Nevndin \u00ed Su\u00f0uroyar
  Sparikassa \u00e1setur vi\u00f0 j\u00f8vnum millumbilum yvirskipa\u00f0ar karmar
  og meginreglur fyri v\u00e1\u00f0a- og kapitalst\u00fdring. Nevndin f\u00e6r javnan
  fr\u00e1grei\u00f0ingar um m\u00f8guligar vandar, og hvussu lei\u00f0slan virkar
  eftir \u00e1settu k\u00f8rmunum \u00ed sambandi vi\u00f0 v\u00e1\u00f0ar. Lei\u00f0slan
  letur partar av s\u00ednum heimildum v\u00ed\u00f0ari til starvsf\u00f3lkini, sum
  taka s\u00e6r av dagligu uppg\u00e1vunum. Tummas Djurhuus hevur \u00e1byrgdina av
  v\u00e1\u00f0anum \u00ed sambandi vi\u00f0 tann dagliga raksturin av Sparikassanum,
  me\u00f0an compliance \u00e1byrgdarin \u00ed Sparikassanum hevur eftirliti\u00f0
  vi\u00f0 MiFID, G\u00f3\u00f0um- Si\u00f0i, og at innanh\u00fdsis reglur og mannagongdir
  ver\u00f0a fylgdar. Risiko og risikostyring Risiko og styring af risici er en utrolig
  central del af Su\u00f0uroyar Sparikassis forretningsplan. I Sparekassens vision
  er det direkte n\u00e6vnt, at Sparekassen skal v\u00e6re F\u00e6r\u00f8ernes trygge,
  kompetente og hyggeligste privatkundebank. Ordet tryg er med i visionen for at sikre,
  at Sparekassen altid har fokus p\u00e5 en god og tryg risikostyring. Sparekassens
  bestyrelse anerkender, at en god og sikker styring af risici reducerer tab og sparer
  Sparekassen for en un\u00f8dvendig ressourceanvendelse p\u00e5 brandslukning. En
  d\u00e5rlig og mangelfuld risikostyring kan s\u00e6tte Sparekassens eksistens under
  pres. Su\u00f0uroyar Sparikassis bestyrelse fastl\u00e6gger l\u00f8bende de overordnede
  rammer og principper for risiko- og kapitalstyring. Bestyrelsen modtager j\u00e6vnlig
  rapporteringer om udviklingen i risici og udnyttelse af de tildelte risikorammer
  fra direktionen. Direktionen delegerer dele af sine bef\u00f8jelser videre til medarbejdere,
  som varetager den daglige aktivitet. Tummas Djurhuus er den risikoansvarlige i forhold
  til den daglige styring af Sparekassen, mens Sparekassens compliance ansvarlige
  internt f\u00f8lger op p\u00e5 MiFID, God- Skik og overholdelse af interne regler
  og politikker. 18\\n20 Lei\u00f0slufr\u00e1grei\u00f0ing / Ledelsesberetning Sparikassin
  n\u00fdtir d\u00fagliga s\u00ednar d\u00e1tukeldur at \u00fatvega s\u00e6r kunning
  um f\u00edggjarligu gongdina. Ta\u00f0 er av alst\u00f3rum t\u00fddningi fyri avger\u00f0ir
  og menning Sparikassans, at v\u00e6l ver\u00f0ur fylgt vi\u00f0 \u00f8llum vi\u00f0komandi
  uppl\u00fdsingum, lei\u00f0beiningum og fors\u00f8gnum, og at allar st\u00f8rri
  avger\u00f0ir byggja \u00e1 eitt v\u00e6l grunda\u00f0 d\u00e1tugrundarlag og skikka\u00f0ar
  greiningar. Lei\u00f0ararnir av deildum Sparikassans hava ofta innanh\u00fdsis fundir
  vi\u00f0 r\u00e1\u00f0gevararnar og fylgja gongdini saman vi\u00f0 teimum. Eitt
  neyvt eftirlit vi\u00f0, at Sparikassin fylgir mannagongdum og reglum, er av alst\u00f3rum
  t\u00fddningi. \u00c1 heimas\u00ed\u00f0u Sparikassans ber til at lesa meira um
  Sparikassans v\u00e1\u00f0ast\u00fdring \u00ed fr\u00e1grei\u00f0ingunum: Risikorapport.
  Sparekassen bruger aktivt sine datakilder til at skaffe sig information omkring
  udviklingen. Styring og beslutninger grundet p\u00e5 analyser af valide data og
  l\u00f8bende overv\u00e5gning er en vigtig parameter i Sparekassens udvikling, idet
  alle st\u00f8rre beslutninger b\u00f8r bygge p\u00e5 et velfunderet datagrundlag
  og kvalificerede analyser. Lederne af filialerne har ofte interne m\u00f8der med
  r\u00e5dgiverne for at sparre og for at f\u00f8lge op p\u00e5 udviklingen. Det er
  utrolig vigtigt med en st\u00e6rk og effektiv kontrol af, at Sparekassen arbejder
  efter sine politikker og regler. P\u00e5 Sparekassens hjemmeside er det muligt at
  l\u00e6se n\u00e6rmere om Sparekassens risikostyring i rapporten: Risikorapport.
  Kredittv\u00e1\u00f0i Nevndin hevur yvirskipa\u00f0u \u00e1byrgdina av st\u00f8rsta
  handils\u00f8ki Sparikassans, sum er at lata kredittir. Nevndin hevur lati\u00f0
  lei\u00f0sluni ein part av heimildini. Lei\u00f0slan hevur so aftur lati\u00f0 deildarlei\u00f0arunum
  og starvsf\u00f3lkum ein part av hesum heimildum. Sparikassans v\u00e1\u00f0apolitikkur
  er skipa\u00f0ur fyri at tryggja, at vi\u00f0skiftini vi\u00f0 kundar og kredittfel\u00f8g
  alla t\u00ed\u00f0ina halda seg innanfyri karmar og trygdir, sum nevndin hevur samtykt.
  Harafturat eftirkannar nevnd Sparikassans eina fer\u00f0 um \u00e1ri\u00f0 Sparikassans
  virksemi vi\u00f0 serligum atliti til st\u00f8rstu kundaavtalurnar fyri at meta
  um m\u00f8guligan v\u00e1\u00f0a. Ein peningastovnur er alt\u00ed\u00f0 \u00ed vanda
  fyri at missa \u00ed sambandi vi\u00f0 s\u00edtt virksemi, av t\u00ed at ein peningastovnur
  virkar undir teimum vi\u00f0urskiftum, at stovnurin, \u00ed besta f\u00f8ri, f\u00e6r
  s\u00edtt \u00fatl\u00e1n aftur uttan tap, og \u00ed ringasta f\u00f8ri vi\u00f0
  tapi. Nevndin \u00ed Su\u00f0uroyar Sparikassa hevur vi\u00f0 s\u00ednum kredittpolitikki
  gj\u00f8rt av, at kredittv\u00e1\u00f0in skal vera lutfalsliga l\u00edtil, og at
  \u00ed \u00f8llum \u00fatl\u00e1nsvi\u00f0urskiftum skal tapsv\u00e1\u00f0i roknast
  vi\u00f0, men kortini ikki \u00f3ney\u00f0uga st\u00f3rur. H\u00f8vu\u00f0sevnini
  \u00ed kredittpolitikki Sparikassans eru: Vilji og m\u00f8guleiki hj\u00e1 vi\u00f0skiftaf\u00f3lkunum
  at rinda l\u00e1n aftur, eins og m\u00f8guligar trygdir fyri handlinum. Vi\u00f0skiftaf\u00f3lk
  skulu vera f\u00edggjarliga v\u00e6l fyri og g\u00f3\u00f0an tiltakspening. L\u00e1nsavtalan
  skal \u00ed r\u00edmiligan mun standa til kundans vi\u00f0komandi dygd og kapital-
  ella ognarf\u00e6. Har m\u00f8guleiki er fyri at f\u00e1a trygd, skal hon eisini
  f\u00e1ast til vega. Kreditrisiko Bestyrelsen har det overordnede ansvar inden for
  Sparekassens st\u00f8rste forretningsomr\u00e5de, som er kreditformidling. Bestyrelsen
  har delegeret en del af sin hjemmel til direktionen. Direktionen har igen videredelegeret
  en del af sin hjemmel til filialdirekt\u00f8rerne og de ansatte. Sparekassens risikostyringspolitik
  er tilrettelagt med henblik p\u00e5 at sikre, at transaktioner med kunder og kreditinstitutter
  til stadighed ligger inden for de af bestyrelsen vedtagne rammer og forventet sikkerhed.
  Endvidere foretager Sparekassens bestyrelse en gang \u00e5rligt en gennemgang af
  Sparekassens engagementer med s\u00e6rlig fokus p\u00e5 de st\u00f8rste engagementer
  med henblik p\u00e5 vurdering af eventuelle risici. Et pengeinstitut vil altid v\u00e6re
  udsat for en kreditrisiko, idet et pengeinstitut lever under det forhold, at det
  i bedste fald f\u00e5r sit udl\u00e5n tilbage uden tab og i v\u00e6rste fald med
  tab. Su\u00f0uroyar Sparikassis bestyrelse har gennem Sparekassens kreditpolitik
  fastsat, at Sparekassens kreditrisiko skal v\u00e6re relativ lav, at i et hvert
  kreditengagement skal tabsrisikoen v\u00e6re kalkuleret og ikke un\u00f8dvendig
  stor. Hovedelementerne i Sparekassens kreditpolitik er: Kundernes vilje og evne
  til at tilbagebetale l\u00e5n, samt mulige sikkerheder for engagementet. Kunder
  skal have en sund \u00f8konomi og et solidt r\u00e5dighedsbel\u00f8b. Engagementet
  skal st\u00e5 i et rimeligt forhold til kundens bonitet og kapital- eller formue-forhold.
