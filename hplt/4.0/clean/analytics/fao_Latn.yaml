  \u00d8ll \u00e1huga\u00f0 kunnu fylgja vi\u00f0 beinlei\u00f0is\"", "\"F\u00f8roysk
  Tr\u00faarverja \u2013 vernd teirra, i\u00f0 misskilja\\nTa\u00f0 eru afturvendandi
  gestir \u00ed f\u00f8roysku mi\u00f0lunum har mann s\u00e6r kristin verja tr\u00fagv
  s\u00edna. Sj\u00e1lv nevndar \u201capologetikkarar\u201d r\u00f3pa hart um v\u00e1a
  gudloysinga og um tann sekulera h\u00f3ttanina \u00edm\u00f3ti t\u00ed kristnu tr\u00fanni,
  og ikki minst h\u00f3ttanina \u00edm\u00f3ti n\u00fat\u00edmans kristnum samfel\u00f8gum
  \u2013 t\u00f3 heiti\u00f0 sj\u00e1lvt er bert naka\u00f0, i\u00f0 vi\u00f0v\u00edkur
  Vatikani\u00f0. Samstundis v\u00edsa apologetikkararnir \u00e1 pseudov\u00edsindaligar
  fatanir, i\u00f0 eru grunda\u00f0ar \u00e1 teirra tr\u00fagv um fornaldar j\u00f8diskar
  sagnir, t\u00f3 vi\u00f0 ongum pr\u00f3gvum ella pr\u00f3vf\u00f8rslum, men teir
  halda ta\u00f0 er verulig v\u00edsund og pr\u00f3gv fyri teirra upp\u00e1hald, at
  tann alm\u00e1ttuga, alvitandi og alg\u00f3\u00f0a gudavera er til! S\u00ed\u00f0an
  ver\u00f0a f\u00f3lk uttan tr\u00fagv l\u00fdst, sum sek \u00ed n\u00e6rum \u00f8llum
  h\u00f3pmor\u00f0um tey s\u00ed\u00f0stu 100 \u00e1rini, og hetta er samandr\u00e1tturin
  av hvat F\u00f8roysk Tr\u00faarverja er. T\u00fa hugsar \u00f3iva\u00f0, at hetta
  er \u00f8rvitistos? Hetta er bert byrjanin\u2026\\nTann gudleysa st\u00f8\u00f0an
  er, sum oftast fyri skotum hj\u00e1 tr\u00faarverjuni, ella ta\u00f0 er n\u00e6rmast
  ta\u00f0 einasta, sum skriva ver\u00f0ur um. Fyri at siga ta\u00f0 beinavegin, so
  er ta\u00f0 ikki t\u00ed at st\u00f8\u00f0an skal vera kritikk fyriuttan, (eisini
  ein tr\u00faarverju miskiljing) men kritikkurin sj\u00e1lvur er ikki anna\u00f0
  enn h\u00f8pisleysar samanblandingar \u00edmillum gudloysi og nasistar, og komunistar.
  Og L\u00f3g Godwins allarhelst gloymd. Onki \u00edt\u00f8kiligt ver\u00f0ur lagt
  fram! Ta\u00f0 vil siga, at flestu apologetikkarirnir gera ta\u00f0 ni\u00f0urst\u00f8\u00f0u
  at gudloysi er grundin til r\u00e6\u00f0uleikanir hj\u00e1 nasistunum og teimum
  anti-\u00e1tr\u00fana\u00f0arligu atl\u00f8gum undir teimum kommnistisku st\u00fdrunum.
  T\u00ed eftir f\u00e1vitskutu og sn\u00e6vuskygdu fatanini hj\u00e1 apologetikkarunum,
  so eru gudloysingar uttan menniskjaslig vir\u00f0ir og samkenslu, t\u00ed tey hava
  tilvitandi tiki\u00f0 ta\u00f0 st\u00f8\u00f0u, at ikki tr\u00fagva \u00e1 ein tilvildarliga
  gudaveru, og tessvegna kunnu ikki hava eina skilag\u00f3\u00f0a atfer\u00f0 \u00ed
  einum samfelagi. Ta\u00f0 ella eina fjarstkotna ella r\u00e6ttari sagt h\u00f8pisleysa
  gl\u00ed\u00f0ubreyt at gudloysi elvir til \u00f3s\u00f8miliga atfer\u00f0 onkrusvegna,
  men haraftur\u00edm\u00f3ti m\u00e1 einasta grundin til at halda sl\u00edkt vera
  anna\u00f0hv\u00f8rt t\u00ed, at ein sj\u00e1lvur upp\u00e1heldur at ta\u00f0, i\u00f0
  kann tykjast at ver\u00f0a g\u00f3\u00f0 atfer\u00f0 er eina bert m\u00f8guliga
  t\u00e1 i\u00f0 ein upp\u00e1heldur sagnina um Adam og Evu, og arvasyndina, sum
  veruligt.\\nEin leggur skj\u00f3tt til merkis, at hesir apologetikkarir antin avnokta
  veruleikan, sum okur vanliga kenna veruleikan, vi\u00f0 at br\u00faka okkra sansir
