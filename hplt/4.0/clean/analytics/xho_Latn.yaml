sample: '["\"Msani\\nMtimande,\\nKunene,\\nMajoka,\\nNxaba,\\nMbhekane,\\nMadluvalo,\\nMthantathwa,\\nMnguni,\\nNonqewu,\\nMgobhozi,
  Ntetha, Vangisa,\\nMvuna,\\nMageza Ngobisi!\\nTag: amaQwathi\\nAmaXesibe\\n- Xesibe
  \u2013 Nxanda kaXesibe, Mnune Mkhuma, Nondzaba, Mbathane, Nondize, Bhelesi, Matshaya
  ngenqaw\u2019ende abanye betshaya ngezimfutshane, Nxele, Bhimbi, Khandanyawana,
  Mayitshin\u2019eyibheka njengomntwana, Mantsaka, Mganu. Nondzaba, Mbathane, Tshomela
  ka Matsho\\n- Qwathi \u2013 Dikela, Noni, Noqaz\u2019 indlela. Iinkomo zikaXesibe,
  zikaJojo, zikaMtshutshumbe, ogqaz\u2019indlel\u2019ebhek\u2019ebuNguni. KumaQwathi
  kukho amaDikela, amaTshaba, ooSdindi, ooBhlangwe, ooBhose, amaNzolo, imiNcayi, amaNtondo,
  amaKhombayo, ooMkhondweni, amaVumbe, ooKhebesi, amaBangula, amaDumba, ooMhotho,
  ooCakeni, ooBhabha, amaMvala, amaDabisa, ooS\u2019ximba, etc.\\n- Mambi \u2013 Nxontsa
  ka Xesibe, uBhulingwe kuvele imamba, uNtabazikude zikuMganu, Mntshontsho, uSabela
  uyabizwa emazibukweni)\\n- Matshaya \u2013 Mbathane\"", "\"IMigaqo kunye neMiqathango
  yokusetyenziswa kweWebhusayithi\\nImigaqo\\nNgokungena kule webhusayithi, uyavuma
  ukuba ubotshelelwe yiMigaqo neMiqathango yokuSebenzisa yewebhu, imithetho esebenzayo
  kunye nemigaqo kunye nokuthotyelwa kwayo. Ukuba awuvumelani nayo nayiphi na imigaqo
  echaziweyo kunye neemeko, akuvumelekanga ukusebenzisa okanye ukufikelela kwesi siza.
  Izinto eziqulethwe kule sayithi zikhuselwe yi-copyright efanelekileyo kunye nomthetho
  wophawu lwentengiso.\\nSebenzisa ilayisensi\\nImvume ivumelekile ukukhuphela okwethutyana
  ikopi enye yezinto (idatha okanye inkqubo) kwisiza se-Hot Electronics kusetyenziso
  lomntu ngamnye kunye nokungelulo ushishino kuphela. Eli lelona phepha-mvume lodwa
  lelayisenisi hayi utshintshiselwano lwetayitile, kwaye phantsi kweli phepha-mvume
  awunako: ukuguqula okanye ukukopa izixhobo; sebenzisa izixhobo kulo naluphi na usetyenziso
  lwezorhwebo, okanye kuyo nayiphi na intetho kawonke-wonke (ishishini okanye engeyiyo
  eyeshishini); ukuzama ukudityaniswa okanye ukwakha ngokutsha nayiphi na imveliso
  okanye imathiriyeli equlethwe kwisiza seHot Electronics; susa nawaphi na amalungelo
  okukopisha okanye amanye amaxwebhu asisithintelo kwimathiriyeli; okanye udlulisele
  imathiriyeli komnye umntu okanye \u201cubukise\u201d imathiriyeli kwenye iseva.
  Le mvume inokuyekiswa ukuba awuhoyanga nakuphi na kwezi zithintelo kwaye inokupheliswa
  yiHot Electronics nanini na ibonwa. Emva kokupheliswa kwemvume okanye xa imvume
  yakho yokujonga iye yapheliswa, kufuneka utshabalalise naziphi na izinto ezikhutshelweyo
  kubunini bakho nokuba zezobuchwephesha okanye ezishicilelweyo.\\nUkuzihlangula\\nIimathiriyeli
  ezikwisiza se-Hot Electronics zinikwe \u201cnjengoko zinjalo\u201d. I-Hot Electronics
  ayenzi ziqinisekiso, zixelwe okanye zicetyiswe, kwaye ngaloo ndlela ziyala kwaye
  zitshitshisa zonke ezinye iziqinisekiso, kubandakanywa ngaphandle komqobo, iziqinisekiso
  eziqiniweyo okanye iimeko zokurhweba, ukufaneleka kwesizathu esithile, okanye ukunganyhashwa
  kwepropati elayisenisiweyo okanye okunye ukunyhashwa kwamalungelo. Ngaphaya koko,
  i-Hot Electronics ayigunyazisi okanye yenze naluphi na umboniso malunga nokuchaneka,
  iziphumo ezinokwenzeka, okanye umgangatho ongagungqiyo wokusetyenziswa kwemathiriyeli
  kwindawo yayo ye-Intanethi okanye ukuchonga ngokubanzi ngemathiriyeli enjalo okanye
  nakweyiphi na indawo eqhagamshelwe kule webhusayithi.\\nIzithintelo\\nAkukho naliphi
  na ithuba apho i-Electronics eshushu okanye ababoneleli bayo baxhomekeke kuyo nayiphi
  na ingozi (ukubala, ngaphandle kwesithintelo, ukwenzakala ngenxa yokulahleka kolwazi
  okanye inzuzo, okanye ngenxa yokuphazamiseka kweshishini,) ukuphuma kusetyenziso
  okanye ukungabi namandla okusebenzisa izixhobo ezikwiphepha lewebhu le-Intanethi
  ye-Intanethi, nokuba kunokwenzeka ukuba i-Electronics eHotyo okanye i-arhente evunyiweyo
  ye-Eletroniki ixeliwe okanye ngendlela efanayo. Kuba iimbono ezimbalwa zingavumeli
  izithintelo kwiziqinisekiso ezichaziweyo, okanye izithintelo zesibophelelo sobunzima
  obukhulu okanye okwenzakala ngengozi, oku kuvalelwa kusenokungenzi mahluko kuwe.\\nIzilungiso
  kunye ne-Errata\\nIzinto ezibonisa kwisiza soMbane we-Hot Electronics zinokubandakanya
  ukuchwetheza, okanye iimpazamo zokufota. I-Hot Electronics ayiqinisekisi ukuba naziphi
  na izinto ezikwisiza sayo zichanekile, zigqityiwe, okanye zangoku. I-Hot Electronics
  inokukhupha uphuculo kwizinto eziqulethwe kwindawo yayo nanini na ngaphandle kwesaziso.
  I-Hot Electronics ayifuni, emva koko, yenza naluphi na ukuzinikela ukuhlaziya izixhobo.\\nUnxulumano\\nI-Hot
  Electronics ayikhange ijongwe kuninzi lwewebhusayithi okanye iilinki eziqhagamshelwe
  kwiwebhusayithi yayo kwaye ayiloxanduva lwalo naliphi na iphepha lewebhu eliqhagamshelweyo.
  Ukudityaniswa kwalo naluphi na uqhagamshelo akuniki nkxaso yiHot Electronics yesiza.
  Ukusetyenziswa kwaso nasiphi na isiza esiqhagamshelwe kumngcipheko womsebenzisi.\\nUkuguqulwa
  kwemiGaqo yeSayithi yosetyenziso\\nIi-Electronics ezishushu zinokuhlaziya le migaqo
