  kunokuba ngundoqo njani kumlo ochasene nokutshintsha kwemozulu kunye nefuthe lako
  kokusingqongileyo.\\nFunda indlela amaqondo obushushu agqithisileyo ayichaphazela
  ngayo i-Iran kunye nezisombululo ezifunekayo ukunciphisa impembelelo yokutshintsha
