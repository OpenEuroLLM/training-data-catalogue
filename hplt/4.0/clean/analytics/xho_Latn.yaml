  yeyona minqweno yakhe. Indalo iphinda ivele ngohlobo olunikiweyo, kodwa ingcinga
  yomntu imisela uhlobo, kwaye udidi lutshintsha kuphela ngengcinga yakhe. Amantshontsho,
  iimvana, iipikoko, iimbaleki, namahobe asendle, aya kuqhubeka ukubonakala lo gama
  umntu eya kuthi abalinganise ngokwengcinga yakhe. Izixhobo ezifumana ubomi kwimizimba
  yezilwanyana kufuneka zibe nobume bazo kunye nefom emiselwe yingcamango yomntu ade
  ngokwazo akwazi ukucinga. Ke abasayi kuludinga uncedo lwakhe, kodwa baya kuzakhela
  iifom zabo njengoko ingcinga yomntu ngoku eyakhe eyakhe neyabo.\\nNjenge-lemniscate,
  umntu umi kwihlabathi le-noumenal kunye nelize. Ngaye isixhobo sahlula-hlula njengomoya-nto
  kwaye senzeka kweli lizwe lomzimba kwiimeko zalo ezisixhenxe ukusuka kwimo ukuya
  kwinto. Ngomntu, omiyo kwiziko, ezi meko zisixhenxe ziyahambelana kwaye ziphinde
  zibe yinto. Ngumguquleli owenza ifom yokungabonakaliyo xa eyicacisa kwaye eyiqinisa-ngokucinga.
  Utshintsha into eqinileyo ibe yeyokungabonakaliyo kwaye iphinde ibonakale - ihlala
  icingwa. Ke uyaqhubeka kwiinkqubo zakhe zokutshintsha kunye nokucoca, ukudala kunye
