  kuphuhliso lwesiBhulu, yaye iyaqondakala into yokuba abebala bayijonge ngephanyazo
  le ndlela yokuphumelela. ngokukrokra kwaye ngaphandle nje abambalwa abasayi kuze
  bazive befana ngesiBhulu njengoontanga babo abathetha ulwimi olumhlophe. Ama-Afrikaner
