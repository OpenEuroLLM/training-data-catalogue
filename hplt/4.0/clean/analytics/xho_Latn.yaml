  yamaqela emigulukudu eCape Flats.\\nIsi-Afrikaans nesiNgesi\\nUmgaqo-nkqubo wocalucalulo
  worhulumente wocalucalulo wokudibanisa wonke umntu ongengomhlophe okanye ongengomnyama
  phantsi kwesithuko sebala uye wakhuthaza abantu bebala ukuba baguqule into embi
  kangaka ibe yeyakhayo. AmaKhoi namaSan, amaGriqua namaSilamsi namaIndiya afumene
  indlela yokuhlala kunye ngexeshana nje elifutshane. Bafunda imikhwa, imilinganiselo,
  inkolo kunye nolwimi lomnye nomnye. Yiyo loo nto uninzi lwabantu bebala bekhululekile
  ngokulinganayo kwisiBhulu saseKapa njengesiBhulu esiMiselweyo. Kananjalo nesiBhulu
  nesiNgesi, kuba sikhule ngazo zombini ezi lwimi. Njengoko uJo-Anne Floris ebhala:
  \u201cIsiBhulu kunye nesiNgesi bezisoloko zibambene ngezandla kwaye zidlala ngokukhululekileyo\u201d,
  (DB: 14.02.2018). Elinye icala losapho yayingamaNgesi eDistrict Six (umama) kanti
  elinye yayingamaBhulu aseBoland (ubawo). Yiyo lonto abantu bebala unanamhla bengasathethi
  ngomalume nomalumekazi, koko bathetha ngomakazi uSonie nomalume uMike. Ngoko ukuchasa
  isiNgesi kukucalula ulwimi lwelungu losapho lwakho. Kwaye kwakukho (kukho) i-elite
  emdaka phakathi kwethu. Abo babandakanyeka kwezopolitiko. Owathiya yonke into ngorhulumente
  wocalucalulo. Nto leyo ibikhuthaza abantu ukuba bangabinanto yokwenza \u2018nabalimi\u2019.
  Oku kuquka imidlalo nolwimi. Abantwana babo bakhuliswe ngesiNgesi. Ukwaywa kwezemidlalo
  ngexesha localucalulo kwakuqhutywa kakhulu ngesiNgesi. Iintlanganiso nemizuzu yayiqhutywa
  ngesiNgesi (nangona sasithetha isiBhulu kuphela ngexesha lekhefu). IsiBhulu sibhengezwe
  njengolwimi lomcinezeli. Nabani na owayefuna ukusondelelana nemidlalo yesiBhulu
  neyabamhlophe wayenyeliswa yaye ejongelwa phantsi. Aba bantu bebala abalibalanga
  ukuba abantu abantetho isisiBhulu abamhlophe bazingcatsha ngeelwimi zabo. Ama-Afrikaner
  Natte (= amalungu e-National Party) ahlutha abantu bebala ilungelo labo lokuvota
  ngeminyaka yoo-1950 asemtsha kwinkumbulo. Aba bantu bakholelwa ukuba abebala baqondwa
  kuphela xa amanani abo eza kusindisa abantu abamhlophe kunye nolwimi lwabo. Ukongeza
  koku, amaAfrikaner nationalist aye enza izinto ezininzi zokungekho sikweni kwintsapho
