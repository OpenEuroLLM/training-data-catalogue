  nayo.\"", "\"Russian IP umyalelo wokhuselo ilawulwa yi-Inxalenye IV ye-Russian Zasekuhlaleni
  Ikhowudi, ezithile federal imithetho kunjalo dozens ngamazwe treaties kwi-intellectual
  ipropati amalungelo watyikitywa Saserashiya.\\nUmzekelo, Inkundla kuba Intellectual
  Property Amalungelo yamiselwa kwi-Russia kwi- kuphela kwiminyaka emithathu edlulileyo.
  Le inkundla uqwalasela exclusively disputes enxulumene intellectual property amalungelo
  nokuba amaqela abandakanyeka ityala waza wakhonza njengoko wo- isehlo ngokunjalo
  cassation inkundla kuba naziphi iimeko ukuba examines okanye ukuba ezicingelwa nangayiphina
  enye imeko abarhwebayo inkundla kwi-Us.\\nRussian IP imithetho ukulawula i-patents
  ebhalisiweyo kuba inventions, into eluncedo models kwaye mveliso designs\\nPatents
  ingaba esikhutshwe Federal Inkonzo ye-Intellectual Property, Patents kwaye iimpawu
  zokurhweba, awathi kanjalo eliphathiswe nokubhalisa iimpawu zokurhweba kwaye inkonzo
  marks. Ngokungafaniyo inkampani amagama, urhwebo amagama okanye abarhwebayo designations
  kufuneka ndivuma ukuba abe ebhalisiweyo okanye abe obaluliweyo yenkampani inkqubo
  esisinyanzelo amaxwebhu. Ilungelo inkampani gama livela njengoko kamsinya njengoko
  isemthethweni iqumrhu sibhaliswe kunye Urhulumente Bhalisa neenkqubo Zomthetho Karhulumente.
  Inkampani igama leyo yinxalenye urhwebo igama okanye trademark ngu ezikhuselweyo
  kwi-Russia nokuba okukhusela i-urhwebo igama okanye trademark ngokwayo. Ummandla
  amagama ingaba regulated ngokwahlukileyo njengoko Russian Zasekuhlaleni Ikhowudi
  akusebenzi aqonde kubo njengoko intellectual property nangona inani elandayo inkundla
  disputes enxulumene ummandla amagama ngenxa inkulu indima idlalwe nge-intanethi
  kuzo zonke iindawo ebomini bethu. Ezahluka-hlukileyo imigaqo ikwasebenza kwezinye
  intellectual property: uyazi njani (urhwebo secrets), i-software kwaye isiseko sedata,
  copyrights kwaye enxulumene amalungelo, iphepha-mvume izivumelwano kwaye yabasebenzi
  ke okwenzeke. Kubalulekile ukukhumbula ukuba infringement ka-intellectual property
  amalungelo entails zasekuhlaleni, kwezolawulo kunye nkqu-mthetho eyimali. Abalawuli
  iinkampani unoxanduva, umzekelo, kuba usebenzisa omnye yequmrhu trademark babe ngenene
  kwezinye iimeko abe phantsi, ulwaphulo-mthetho eyimali. Njengoko kuba zasekuhlaleni
  eyimali ulungiso, baye unakho ukufikelela ukuya kwi-RUB amahlanu ezigidi kuba intlawulo
  okanye umonakalo othe olukhawulezileyo lwemali, imbuyekezo okanye phinda kabini
  ziyabhatalwa royalties phantsi efanayo iimeko. Entsha imigaqo kwi ubhaliso iimpawu
  zokurhweba kwaye ufumane iphepha-mvume izivumelwano kunye Federal Inkonzo ye-Intellectual
  Property, Patents kwaye iimpawu zokurhweba waba ungeniswa kutsha nje ngoko ke kubalulekile
  vital kwi-enjalo enobunzima-bume apho imithetho yomdlalo ingaba ukutshintsha ngoko
  ke rapidly ukuba ingaba abaqondisi-mthetho lisondele ilungile ukukhombisa u-na imicimbi
  kwi elifutshane isaziso. Russian Accountant abaqondisi-mthetho ukusebenza ngokusondeleleneyo
  kunye uninzi reputable patent attorneys kwi-Russia ngokunjalo ngosuku lwehlabathi
  wentengiso kwaye ingaba ukulungele ukuba ufuna inkxaso kwi-imicimbi enxulumene okukhusela
  IP amalungelo. Siya kuba ninoyolo ukuba kukunceda: Thina kakhulu ekhangele phambili
  ngokuxoxa na yakho isemthethweni amatyala ethu kwi-ofisi Moscow kwaye Ngcwele Marengo\"",
  "\"UNjingalwazi uMichael le Cordeur\\nKutshanje, kukho iingxelo ezininzi malunga
  nesimo sengqondo sokungakhathali kwabantu bebala ngesiBhulu, nangona lelona qela
  likhulu labantetho isisiBhulu. Le yindlela intatheli kunye noluvo owayesakuba nguTim
