  bokubuncama ubuBhulu bayo kuba lulwimi lwasekhaya lwabafundi abaninzi bebala.\\nKodwa
  yaqala phi yonke le nto?\\nKwincwadi yakhe ethi So we get Afrikaans ethetha ngophando
  lwamva nje ngemvelaphi yesiBhulu, uNjingalwazi Christo van Rensburg ubalula ukuba
  iimpawu zokuqala zesiBhulu zazisele zikhona ngo-1500. Kudala kakhulu phambi kokuba
  umDatshi uJan van Riebeeck afike eKapa. Ndingathanda ukumcaphula: \u201cAmaKhoi-Khoin
  ahlala kwisiqingatha seYurophu neMpuma. Oomatiloshe baseYurophu babedla ngokuyishiya
  iYurophu besiya eMpuma. Iziqholo ezinqabileyo nezinye izinto kwafuneka zihanjiswe
  ukusuka apho ukuya eYurophu. Ngaphandle kwendawo yokuphumla eKoloni, uhambo lwalulude
  ngokungenabuntu kwaye luyingozi. Abantu abaninzi bagula baza bafa. Ukutya, inyama
  entsha kunye namanzi zafunyanwa kuma Khoi-Khoin awayengabemi bokuqala baseKapa.
  Oku kwafuneka kuxoxwe-kwaye ke ulwimi lwazalwa ngokuzenzekelayo. \u201d\\nEmva kokufika
  kuka Jan van Riebeeck kunye namaDatshi, uphuhliso olukhulu lwenzeka. Wawumkhulu
  umsebenzi, kwaye izandla zimbalwa. Amakhoboka ayengeniswa kumazwe angaphandle ngomlinganiselo
  omkhulu ukusuka eMpuma ngakumbi iIndonesia, iJava kunye neBatavia. Amafama aseYurophu,
  abizwa ngokuba zii-Vryburgers, eze eKapa ngomlinganiselo omkhulu apho i-United East
  India Company (amagosa amaDatshi) yabanika umhlaba. Abahlali bama Khoi baqeshelwe
  ukulima ezi fama. Kwiminyaka engamashumi amahlanu emva kokufika kukaJan van Riebeeck,
  kwakukho amaqela amane eKapa: (1) amagosa amaDatshi aseYurophu, (2) amakhoboka akhululekileyo,
  (3) amakhoboka asuka eMpuma kunye (4) namaKhoi-Khoin asekuhlaleni. La maqela mane
  ayexhomekeke kwelinye ukuze aqhubeke ephila. Ukuze kubekho ukuhlalisana ngempumelelo,
  amaqela amane eKoloni kwafuneka afune ulwimi. Olo lwimi yayisisiBhulu.\\nAmaqela
  amathathu abantetho isisiBhulu\\nNgenxa yesi sizathu, la mazwi alandelayo kaNP van
  Wyk Louw abekwe kwisiseko seSikhumbuzo soLwimi lwesiBhulu ePaarlberg: \u201cIsiBhulu
  lulwimi oludibanisa iNtshona Yurophu neAfrika; iwatsala amandla ayo kule mithombo
  mibini; yenza ibhulorho phakathi kweNtshona enkulu eqaqambileyo kunye neAfrika yomlingo
  \u2013 ngamanye amaxesha ide ingabonakali iAfrika; omabini angamandla amakhulu,
  kwaye yintoni enokuvela enkulu kubudlelwane babo-mhlawumbi yinto elindele ukuba
  isiBhulu siyifumane. IsiBhulu ikwalulwimi oludibanisa iMpuma neNtshona apha kwincam
  esemazantsi eAfrika. Ngenxa yesi sizathu, iTaalmonument ineentsika ezintathu: ezimbini
  ezincinci, zaseNtshona (iYurophu) kunye neMpuma kunye nentsika enkulu ibonisa i-Afrikaans
  element. Ulwimi olusuka emazantsi eAfrika nawo onke amagama alo athatyathwe kwiilwimi
  zesiNtu njengeKhoi. Namhlanje, abemi boMzantsi Afrika basenazo iimpawu zala maqela
  mathathu: abelungu basuka eYurophu, abebala baseMpuma kunye nabantu abamnyama baseAfrika.
  Wonke umntu uthetha isiBhulu.\\nOmnye wabambalwa kuphela\\nNdivumele ndizazise:
  Ndamkelwa ndaza ndazalwa ngesiBhulu. Abazali bam (uMichael snr. NoSylvia) bobabini
  basathetha isiBhulu esiqhelekileyo. UTamkhulu uWillie, ukuba ebesaphila, ebeza kuba
  neminyaka eyi-105 kulo nyaka, uzelwe esiBhulu kwaye engomnye wabafundi bematriki
  abathandathu bokuqala (isiBhulu) eBergrivier High School eWellington. Kwakweso sikolo
  ndandifunda kuso. Ngokungafaniyo noninzi lwabantu bexesha lam elimdaka, ndakhulisa
  abantwana bam ngesiBhulu ndaza ndabathumela kwisikolo sasekuhlaleni sesiBhulu. Ngenxa
  yemisebenzi emininzi yethutyana (kuba i-bursary karhulumente yayihlawula imali yokufunda
  kuphela) ndiye ndakwazi ukufunda e-UWC ndaza ndaba ngutitshala wesiBhulu. Ndazibandakanya
  nemibutho yabasebenzi besiBhulu kwasebuntwaneni kwaye nanamhlanje ndisazibandakanya
  nemibutho yesiBhulu. Ukanti alikho iziko lesiBhulu elizimisele ukundinika imali
  yokufunda kwizifundo zam zobugqirha kwimfundo yesi-Afrikansi. Kwaphuma yonke ipeni
  epokothweni yam. Ndinika le mvelaphi ineenkcukacha ukwenzela ukuba kungabikho mntu
  unokuluthandabuza uthando nothando lwam lwesiBhulu okanye andikrokrele ukuba ndiyasilahla
  isiBhulu malunga nalento ndiza kuyithetha ngoku.\\nNgokoluvo lwam, asiyonyani kwaphela
  into yokuba abebala \u2018bathe cwaka\u2019 ngesiBhulu. Ndabhala kwiDie Burger kwiminyaka
  engama-26 eyadlulayo \u201cUkugcinwa kwesiBhulu kufuna indlela entsha esikolweni\u201d
  (DB, 21 May 1992). Kwaye emva konyaka ndibhala ukuba \u201cikamva lesiBhulu kudala
  labonakala liqinisekile njengoko lisenza ngoku\u201d (DB, 23 July 1993). Ukususela
  ngoko, amanqaku angaphezu kwama-250 angesiBhulu nothando lwam ngolwimi aye avela
  kusiba lwam (Ngoku ngoku ngumama wam oneminyaka engama-80 ubudala othe wasika waza
  wawafaka ngocoselelo onke amanqaku am kule minyaka ingama-26 idlulileyo.) Ndiyichazile
  imeko yesiBhulu phantse kuwo onke amaphephandaba nemagazini yemihla ngemihla yesi-Afrikansi;
  nakwiimpapasho zesiNgesi nesiDatshi. Namhlanje ndingomnye wezifundiswa zaseStellenbosch
  ezimbalwa ezisabhalayo nezipapashayo ngesiBhulu. Kwakhona ayindim ndedwa umntu webala
  othanda isiBhulu. Jonga nje iingxelo ezininzi zoogxa bebala kumajelo onxibelelwano:
  Yonke into ngesiBhulu esihle. Umbuzo ke ngoko ngulo:\\nKutheni abantu bebala ngaphandle
  kwengxoxo yesiBhulu\\nOkokuqala, ndikholelwa ukuba abantu bebala bafumana ukuvezwa
  okuncinci kumajelo eendaba. Amanqaku abawabhalayo awamkelwa ngokukhawuleza njengoko
  ethunyelwa ukuba apapashwe. Ngenxa yokuba inkoliso yeembono zabebala ngesiBhulu
  zahlukile kwezo ziqhelekileyo, uluvo lwabo alunakwa. Oku kwakhokelela ekubeni ndizive
  ndingenamdla wokuba Yintoni encedayo? Isizathu sesibini esibangela ukuba abebala
  bakulumkele ukubandakanyeka kwiingxoxo zolwimi kukuba abantu bebala ngokwemvelo
  abayithandi inkathazo. Le yintsalela yelifa labo lamakhoboka xa bafundiswa ukuba
  bavale imilomo yabo kwaye benze oko \u2018umphathi\u2019 akutshoyo. Yiyo loo nto
  bathi cwaka phantsi kocalucalulo ixesha elide. Kwanaxa ulutsha lwabebala lwathabatha
  inyathelo lokuqala ngowe-1976, ngokufuthi sasiva oku: \u201cUmele uphume engxakini.
  Isizathu sesithathu nesisemthethweni sokungabandakanyeki kwabantu bebala kwingxoxo-mpikiswano
  ngolwimi kumzabalazo wabo wokuphila. Zininzi ke ezinye iingxaki ezinje ngentlupheko,
  imfundo, ukhuseleko nomba wemigulukudu kwabebala. Uninzi lwabantu abantsundu eyona
  nto iphambili kukubeka ukutya etafileni. Uninzi lwabantu abamhlophe alusiqondi isizathu
  sokuba elona qela likhulu labantetho isisiBhulu lingafuni ukuthatha izixhobo ngesiBhulu
  nalo. Kwelinye icala, abebala abasiqondi isizathu sokuba abantu abamhlophe bahlale
  befuna ukulwa nolwimi. Ngeli xesha, abantu abamhlophe abakhathali ngemfazwe yokwenyani
  yamaqela emigulukudu eCape Flats. Uninzi lwabantu abantsundu eyona nto iphambili
  kukubeka ukutya etafileni. Uninzi lwabantu abamhlophe alusiqondi isizathu sokuba
