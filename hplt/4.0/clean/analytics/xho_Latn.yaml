  yaseRyuko Kawabata kunye nesitudiyo sobugcisa eRyuko Park zabhaliswa njengezakhiwo
  zenkcubeko eziphathekayo (izakhiwo) ezibhaliswe kuzwelonke ngoMatshi ka-6.\\n- Cofa
  apha ukuze ufumane ulwazi lomboniso lwamva nje\\n- Inkcazo yevidiyo yeHolo yeSikhumbuzo
