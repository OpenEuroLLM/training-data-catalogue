  bazive befana ngesiBhulu njengoontanga babo abathetha ulwimi olumhlophe.\\nSenza
  ntoni ke ngaloo nto?\\nSinokuqala ngokuhlonela iimvakalelo zabantu bebala ngaphezu
  kokuba bekunjalo ukuza kuthi ga ngoku. Abantu bebala nabo kufuneka baqale kwicala
  labo ukuphendula ngendlela eyakhayo kolu nxibelelwano. Uninzi lwezi zenzo zokufikelela
  zijongwe ngokunyanisekileyo kwaye ziphuma kwintliziyo elungileyo. Kwiminyaka engamashumi
  amabini anesithandathu eyadlulayo kwafuneka ndoyise uloyiko lwam kwaye ndiwele irubicon
  yengqondo eyandigcina ndingenzi nto kwaye ndisisimumu iminyaka. \u201cIya esihogweni
  nabo bafuna ukundidelela ngokuzingca ngesiBhulu,\u201d ndagqiba kwelokuba. Ndifuna
  ukuba nethemba lokuba ndiza kukhuthaza namanye amaBhulu abebala ukuba enze okufanayo.
  Abantu abakhulu abangena kwiLizwe Ledinga ngowe-1994 baxakeke ziingxabano zabo,
  ukruthakruthwano olungapheliyo, neengxoxo zabo ezifihlakeleyo. Uxanduva olusemagxeni
  ethu ke ngoko lungaphezulu kakhulu kunekamva lesiBhulu kuphela. Ifuna intlonipho
  kuzo zonke iilwimi. Kaloku kwinkqubo yolwakhiwo lwesizwe, wonke umntu oncedisa ngokwenene
  ekwakheni uMzantsi Afrika omtsha kudala eqonda ukuba ikamva lethu leleelwimi ezininzi.
  Ulutsha luka-2018 luhlala ecaleni kwaye lunxibelelana ngeelwimi ezininzi \u2013
  ngokungafaniyo nathi ngaphambi ko-1994.\\nEmva koku kuya kufuneka ukuba intetho
  yolwimi siyiqhubele kwelinye icala. Endaweni yokuba sibambeke kwingxoxo-mpikiswano
  yesiBhulu okanye isiNgesi, kuya kufuneka singqine ngaphezu kokuthetha nje ngomlomo
  kwiilwimi zenkobe zelizwe lethu. Ngale ndlela, ikamva loMzantsi Afrika liya kufumana
  intlonipho kwiilwimi zomnye kwaye ngenxa yoko nakwabanye. Ifuna amanyathelo amatsha
  kunye nokucinga okunobuchule. Endaweni yokuba sizikhubaze ngokucinga ngeempazamo
  zethu zexesha elidlulileyo, sinokusebenzisa amandla amancinane esinawo ukuxhobisa
  abantu abatsha ngezakhono zokuvala indawo yabo kuMzantsi Afrika omtsha. Enye yazo
  kukusetyenziswa kweelwimi ezininzi. Nakubeni thina sithetha isiBhulu kufuneka siqhubeleke
  nokukhuthaza isiBhulu, kufuneka singamfameki kwaye singayithatheli ngqalelo indima
  yokulinganisa isiNgesi ingakumbi iilwimi zethu zesintu ezinokuthi ziyidlale kumhlaba
  ongalinganiyo.\"", "\"Yintoni iRyuko Memorial Hall?\\nURyuko Kawabata\\n1885-1966\\nIHolo
  yeSikhumbuzo iRyuko yasekwa ngo-1885 nguRyuko Kawabata (1966-1963), owaziwa njengenkosi
  yemifanekiso yaseJapan yanamhlanje, ukukhumbula iMbasa yeNkcubeko kunye neJuu.Ukupheliswa
  kukaSeiryusha, ebisebenza kwasekuqaleni, ishishini lithathiwe njenge-Ota Ward Ryuko
  Memorial Hall ukusukela ngo-1991.Imyuziyam inemisebenzi emalunga ne-140 eyenziwa
  nguRyuko ukusuka kwixesha lokuqala laseTaisho ukuya kwithuba lasemva kwemfazwe,
  kwaye wazisa ngemizobo kaRyuko kwiindlela ezininzi.Kwigumbi lokubonisa, ungonwabela
  imisebenzi yamandla ezotywe kwiscreen esikhulu.\\nEchasene neRyuko Memorial HallIpaki
  yaseRyukoIkhaya langaphambili kunye nestudiyo zigciniwe, kwaye usenokuziva umoya
