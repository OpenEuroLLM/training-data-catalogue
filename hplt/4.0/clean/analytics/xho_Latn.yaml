  \u201c\u2026 ngumama wethu wonke owagwetyelwa ukufa okucothayo kwinkundla yomgaqo-siseko
  kwaye kufuneka sonke singenelele ukumsindisa.\u201d\\nUyabukhanyela ubuAfrikaans
  bomntu\\nNgaphambili, ngakumbi ngexesha localucalulo, ubuBhulu babantu abantsundu
  nabantsundu babukhatywa. Namhlanje iyaziwa into yokuba uninzi lwabemi boMzantsi
  Afrika abanesiBhulu njengolwimi lwabo lweenkobe abamhlophe, koko bantsundu; (naye
  mnyama). Ngaphezu kwe-51% yabo bonke abathetha isiBhulu baphuma kwiqela elihlelwa
  njengabebala phantsi kocalucalulo. Eli gama liyakhatywa leli qela labantu namhlanje.
  Uninzi lwethu lufuna ukwaziwa njengabemi boMzantsi Afrika abantetho isisiBhulu.\\nNamhlanje
  iyaziwa into yokuba uninzi lwabemi boMzantsi Afrika abanesiBhulu njengolwimi lwabo
  lweenkobe abamhlophe, koko bantsundu.\\nNgalo lonke ixesha amanani abantu abantetho
  isisiBhulu abebala atsalwa ecaleni xa kukho umntu ofuna ukubonisa ubungqina bengxoxo
  exhasa isiBhulu. Ngethuba uMphathiswa wezeMfundo eRhawutini wabhengeza ukuba izikolo
  zesiBhulu ziza kutshintshela kwisiNgesi, bambi bakhawuleza bachaza ukuba uninzi
