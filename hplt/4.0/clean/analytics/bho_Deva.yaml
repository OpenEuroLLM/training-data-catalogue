  \u0930\u0939\u093f \u091c\u093e\u0932\u0947\u0964[71]\\nTo cope with its chronic
  water shortages, India employs electric groundwater pumps, diesel-powered tankers
  and coal-fed power plants. If the country increasingly relies on these energy-intensive
  short-term fixes, the whole planet''s climate will bear the consequences. India
  is under enormous pressure to develop its economic potential while also protecting
  its environment\u2014something few, if any, countries have accomplished. What India
  does with its water will be a test of whether that combination is possible.[72]\\n\u0916\u0928\u0928
