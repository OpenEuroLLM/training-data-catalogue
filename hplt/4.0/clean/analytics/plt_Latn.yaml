sample: '["\"Vehivavy 1 amin''ny 3 no niaina herisetra ao an-tokantrano nandritra
  ny androm-piainany. Mety hitranga na amin\u2018iza na amin\u2018iza izany.\\nMiseho
  amin''ny endriny maro ny herisetra ao an-tokantrano ary tsy voatery ho ara-batana.\\nMatetika
  ny mpanao herisetra dia toa olona tsara fanahy, malala-tanana ary mpanaja.\\nEto
  anivon\u2018ny Women for Women France dia tsapanay ny voka-dratsin\u2019ny ateraky
  ny fampiasana karazana fiteny mahazatra rehefa hoe lehilahy no iresahana na koa
  hoe vehivavy.\\nNa izany aza, mba hahazoana antoka fa afaka miditra ato amin\u2018ny
  tranokalanay ny rehetra,, anisan''izany ireo zatra mampiasa efijery rehefa mamaky
  teny, na koa ireo olona manana olana amin\u2018ny famakian-teny, dia tsy maintsy
  nampiasa teny fampiasa rehefa miresaka amin\u2018ny lehilahy, na amin\u2018ny vehivavy
  izahay, rehefa tsy nahita teny sady azo ampiasaina amin\u2018ny lehilahy no ampiasaina
  amin\u2018ny vehivavy koa.\\nNy ankamaroa\u2018ny herisetra ao an-tokatrano, dia
  ny lehilahy no mampijaly ny vehivavy, ka izany no nahatonga anay ohatran\u2018ny
  hoe mamantana ny resaka amin\u2018ny vehivavy foana.\"", "\"TSPR Rubber Lineed Vertical
  Slurry Pump\\nTSPR Rubber LinedPaompy Slurry VerticalsMisy amin''ny halavan''ny
  fenitra isan-karazany mba hifanaraka amin''ny halalin''ny dobo mahazatra, ho an''ny
  dobo lalina be na ny hafainganam-pandehan''ny shaft dia mametra ny halavan''ny paompy,
  dia azo apetraka eo amin''ny fidirana ambany ny sodina fanitarana suction mba hanitarana
  ny halalin''ny paompy hatramin''ny 2 metatra.Ny paompy dia tazonina na dia tsy difotry
  ny rano aza ny fidirana ambony, ka mahatonga ny haavon''ny rano hidina hatrany amin''ny
  fidirana ambany na ny fanambanin''ny sodina fanitarana.Ny ampahany mando amin''ny
  paompy mitsangana TSPR dia azo ovaina amin''ny paompy mavesatra mavesatra vita amin''ny
  metaly matevina SP.\\nDesign Features\\n\u221a Fivoriambe mitondra - Ny bearings,
  shaft ary trano fonenana dia mifandanja be mba hisorohana ny olana mifandraika amin''ny
  fiasan''ny shafts cantilevered amin''ny faritra haingam-pandeha voalohany.\\nNy
  fivoriambe dia menaka fanosotra ary voaisy tombo-kase amin''ny labyrinths;ny ambony
  dia diovina menaka ary ny ambany dia arovan''ny flinger manokana.Ny fiantsonana
  ambony na ny fiafaran''ny fiara dia karazana roller parall\u00e8le fa ny fitondra
  ambany kosa dia roller taper roa miaraka amin''ny mitsingevana mialoha.Ity firafitry
  ny fitondra-tena avo lenta ity sy ny tsorakazo matanjaka dia manafoana ny filana
  fitondra midina ambany kokoa.\\n\u221a Fivoriamben''ny tsanganana - Vita tanteraka
  tamin''ny vy malefaka.Ny modely TSPR dia rakotra elastomer.\\n\u221a Casing - Misy
  fametahana bolt-on tsotra amin''ny fototry ny tsanganana.Izy io dia vita amin''ny
  firaka mahatohitra ho an''ny TSP ary avy amin''ny elastomer voavolavola ho an''ny
  TSPR.\\n\u221a Impeller - Ny impeller suction indroa (fidirana ambony sy ambany)
  dia mampirisika ny enta-mavesatra axial ambany ary manana vane lalina mavesatra
  ho an''ny fanoherana ambony indrindra sy amin''ny fitantanana ireo solida lehibe.Manao
  firaka mahatohitra, polyurethane sy voavolavola elastomer impellers dia azo soloina.Ny
  impeller dia amboarina axially ao anatin''ny fanariana mandritra ny fivoriambe amin''ny
  al\u00e0lan''ny shims ivelany eo ambanin''ny tongotry ny trano fonenana.Tsy ilaina
  ny fanitsiana fanampiny.\\n\u221a Tabilao ambony - harato metaly mitete;snap-on
  elastomer na polyurethane ho an''ny TSP sy TSPR paompy.Ny sivana dia mifanentana
  amin''ny fisokafan''ny tsanganana.\\n\u221a Tavana ambany - metaly na polyurethane
  ho an''ny TSP;voavolavola snap-on elastomer ho an''ny TSPR.\\n\u221a Famoahana fantsona
  - Metal ho an''ny TSP;elastomer rakotra TSPR.Ny ampahany metaly mando rehetra dia
  voaaro tanteraka.\\n\u221a Bearings anaty rano - Tsy misy\\n\u221a Fihetseham-po
  - Ny fandrindrana fifandraisana TSPRay agitator ivelany dia azo apetraka amin''ny
  paompy ho safidy.Raha tsy izany, dia asiana agitator mekanika amin''ny tsorakazo
  lava mipoitra avy amin''ny maso impeller.\\n\u221a Fitaovana - Ny paompy dia azo
  amboarina amin''ny fitaovana mahakivy sy mahakivy.\\nTSPR Rubber LinedPaompy Slurry
  Verticals Param\u00e8tres Performance\\nTSPR Rubber Lineed Vertical Slurry Pumps
  Applications\\nNy endrika TSPR sy SP, novokarina tamin''ny haben''ny metrika malaza,
  dia manome karazana paompy tsotsotra tsotra nefa manjavozavo novolavolaina manokana
  ho an''ny: slurries abrasive sy/na manimba, haben''ny poti-javatra lehibe, haavon''ny
  slurry avo, asa mitohy na \\\"snore\\\", asa mavesatra Mitaky shafts cantilevered
  amin''ny fanodinana mineraly, fanomanana arina, fanodinana simika, fikarakarana
  entona, fasika sy vatokely, ary saika ny toe-javatra rehetra amin''ny fitahirizana
  slurry, lavaka na lavaka amin''ny tany.\\nFANAMARIHANA:\\nNy paompy slurry mitsangana
  mitsangana TSPR fingotra sy ny kojakoja dia azo soloina amin''ny paompy slurry mitsangana
  mitsangana sy ny piesy Warman\u00ae SPR fingotra.\\nTH Cantilevered, mitsivalana,
  centrifugal Slurry Pump fitaovana:\"", "\"Ho an''ny Samsung galaxy tab A7 lite 8.7
  mirefy 2021 Funda Tablet Case Magnetic Slim Folio Leather Cover\\nPerfect Compatibility\\nIty
  tranga ity dia mifanaraka amin''nySamsung Galaxy Tab A7 8.7\u201d (2021) Tablet
  modely SM-T220/T225.\\nFidirana amin''ny endri-javatra sy fanaraha-maso rehetra
  ho an''ny tabilao A7 Lite 8.7.\\nTSY handaitra izany2020Version Tab A8.4na fitaovana
  modely hafa.\\nSlim & Maivana\\nNy famolavolana lamosina matevina sy maivana dia
  manampy ampahany kely ary manome fiarovana lehibe ny Galaxy Tab A7 Lite 8.7 anao.\\nTrifold
  stand\\nNy kitapo A7 Lite dia manome anao toerana mety hijerena sarimihetsika na
  fanoratana.\\nMaterial Premium\\nHardback fiarovana maharitra miaraka amin''ny hoditra
  PU kalitao avo lenta.Ny anatiny microfiber malefaka tsy misy scratch dia manampy
  fampiononana sy fiarovana fanampiny.\\nfanakatonana andriamby\\nMiantoka ny anao
  izanyny Tab A7akaiky ny fonony lite, mba hiarovana ny takelakao amin''ny ratra,
  fahatafintohinana ary dona.\\nlafiny\\nHaavo x Sakany x Halany: 215m x 130 mm x
  15 mm\\nLanja: 150\\nfepetra arahana\\nMOQ: 10PCS/loko Certification: FCC, ROHS,
  GS, RECH, Sgs\\nHabe: 8.7\\\" Famolavolana: fonon-koditra telo\\nFonosana:opp kitapo
  Fandoavana: 1.T/T 2.Western Union 3. Paypal\\nLogo: Debossed / Manaiky namboarina
  OEM / ODM Design: manaiky namboarina namboarina\\nFotoana fanaterana: 3-5 andro
  fiasana Fitaovana: fonon''ny hoditra Premium miaraka amin''ny raharaha PC\\nMagnet
  matory/Mifohaza: Tsy misy andriamby famaranana: Eny\\nLavaka fakan-tsary: Eny Fonon''ny
  andriamby: Eny\"", "\"Belt Conveyor andriamby matanjaka\\nNy hery mahery vaika entin''ny
  herin''ny herinaratra dia hisintona ireo faritra vy mifangaro ao anaty fitaovana
  ary hanary azy ireo amin''ny fehikibo vy mampidina mba hahatratrarana ny tanjon''ny
  fanesorana mandeha ho azy. Ary afaka misoroka amin''ny fomba mahomby ny fehin-kibo
  conveyor misaraka, fantsom-by vy manerantany mahery ho fiarovana ny asa ara-dal\u00e0na
  an''ny crusher, milina fitotoana, fanesorana vy lovia. Noho izany, ity andiana fanesorana
  vy ity dia be mpampiasa amin''ny herinaratra, harena ankibon''ny tany, metallurgy,
  akora fananganana, fanomanana arintany, indostrian''ny simika ary departemanta hafa.
  Ny fanesorana vy elektromagnetika dia mifototra amin''ny rafitra fanalefahana vatana
  sy vy. Ankoatry ny famolavolana vatan''ny vy misy vy dia mitombina, fanesorana vy
  elektromagnetika amin''ny al\u00e0lan''ny famokarana herinaratra ny tanjaky ny andriamby,
  lehibe ny halalin''ny fidirana andriamby, ka mety amin''ny tranga fanesorana vy
  misy sosona vy.\\nApetraho eo alohan''ny mpanofa lafarinina. Mora ny mihetsika amin''ny
  casters efatra.\\nIty vokatra ity dia mampiasa lamba firakotra vita amin''ny landihazo
  mihantona maro sosona ho toy ny rafitra, ny amboniny dia rakotra fitaovana vita
  amin''ny fingotra miaraka amin''ny fahombiazana tsara, ary vita amin''ny fanadiovan-tarehy.
  Ny vokatra azo avy amin''ny fehikibo dia misy fehikibo vita amin''ny lamba rongony
  tsotra, fehin-kibo conveyor nylon (NN) (mizara ho nn-100, nn-150, NN-200, nn-250,
  nn-300, nn-350, nn-400), polyester (EP) fehikibo (mizara ep-100, ep-150, ep-200,
  ep-250, ep-300, ep-350, ep-400), fironana lehibe (wavy rib) fehikibo mpampita, fehikibo
  conveyor diaphragm, fehikibo conveyor anular Noho ny fitaovana samihafa sy ny zoro
  fironana, ny endrika sy ny haavon''ny haavo dia takiana mba tsy hitovy. Variety
  fampiasa amin''ny fehin-kazo fampiasa matetika toy ny: fehikibo conveyor pattern
  herringbone (fehin''ny conveyor herringbone dia misy fehikibo convex sy concave
  herringbone pattern conveyor), fehikibo conveyor pattern octagonal, fehikibo conveyor
  pattern fishbone, fehin-kiraro conveyor pattern U, endrika conveyor cylindrical
  pattern, fehin-kibo fampitaovana pockmarked fehikibo, fehin''ny ahitra conveyor
  fehikibo, na famolavolana}, fehin-drano fantsona, PVC na PVG fehin-kibo mirehitra
  mirehitra manontolo mifanaraka amin''ny fepetra takian''ny mpampiasa; Ary afaka
  manome isan-karazany fampiasa conveyor fehin-kibo manokana (fehin-kibo fampitaovana
  maharitra maharitra, fehikibo tsy mahazaka hafanana, fehin-kibo mpanohitra mahatohitra,
  fehikibo mpanohitra tsy mahazaka akanjo, fehikibo mpanohitra miady amin''ny asidra,
  fehikibo mpanohitra mahatohitra alkali, fehikibo mpanohitra mahatohitra mangatsiaka,
  fehin-tsolika mahatohitra solika, fehikibo mpanohitra mahatohitra hafanana, fehikibo
  conveyor tanjaka avo sy fehikibo mpampita sakafo, fehikibo conveyor Teflon, fehikibo
  mpampitohy vy, fehikibo conveyor chain, fehikibo conveyor).\"", "\"Zandry a! mila
  miady ialahy (Frederic Rnf)\\n(Nalaina tao amin''ny vetso.serasera.org)\\nReko hoe
  mijaly hono ialahy dia mihidy an-trano lavaMigogogogo mitomany, milaza fa hoe resin''ny
  fiainana\\nKivy ialahy fa ambanian''ny manodidina foana\\nKa tsy manan-tsaina ny
  hitraka fa mitady hamoy fo\\nVelom-panontaniana hono ialahy ka mivetso hoe\\nMba
  aiza ihany ary izay mba anjara masoandro\\nAiza ihany izay mba azo itokiana eto
  ambonin-tany\\nFa ny manodidina toa mankahala ahy?\\nZandry a, kodiaran-tsarety
  lesy ny fiainana a!\\n''''Tsy ny fahatsapan''ny olona hoe iza ialahy no zava-dehibe\\nFa
  ny fanomezan''ialahy lanja ny tenan''ialahy''''\\nDia aza mora kivy, aza mamoy fo
