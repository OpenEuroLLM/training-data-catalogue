  mila milavo lefona fa mila manambony moraly\\nApetrao ny maha-ialahy an''ialahy
  fa aza mora resy\\nTsy ny fanambanian''ny olona no atao hanimbana ny hoavy.\\n--------\\nRohy:\\nHevitra
