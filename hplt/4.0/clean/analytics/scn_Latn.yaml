  "\"Vucca (anatum\u00eca)\\nLa vucca \u00e8 na cavitati ca nta l\u2019\u00f2munu
  e nta l''armali custituisci la prima parti di l\u2019apparatu diggirenti, nt\u00ea
  virtibbrati culligata videmma cu l\u2019apparatu rispiratoriu, nta l\u2019\u00f2minu
  posta nt\u00e2 parti nfiriuri d\u00fb visu, e midemma \u00f2rganu d\u00e2 funazzioni,
  ca cumprenni labbra, denti, palataru e lingua.\\nNt\u00e2 littiratura siciliana[cancia
  | cancia la surgenti]\\nDi Lingua e dialettu di Gnazziu Buttitta:\\n- Un populu
  mittitilu a catina\\n- Spugghiatilu\\n- Attupatici a vucca,\\n- \u00c8 ancora libiru.\\nPruverbi[cancia
  | cancia la surgenti]\\n- La vuccuzza e''comu n''aneddu, si mancia turri, palazzu
  e casteddi. (Puru siddu na vucca \u00e8 nica, havi na capacitati di distr\u00f9diri
  tutti sti granni, forti f\u00e0bbrichi.)[1]\\nRifirimenti[cancia | cancia la surgenti]\\n-
  ^ * Pitr\u00e8, Giuseppe Biblioteca delle tradizioni popolari siciliani (1871-1913)\"",
  "\"Cuncettu\\nNu cuncettu eni n''id\u00eca ca eni appricata a tutti l''uggetta di
  nu gruppu.\\nEni a man\u00e8ra c\u00e2 quali li pirsuni virunu e capisciunu quarchicosa.\\nA
  palora eni usata ppi adintificari nu cuncettu (a marca di lu cuncettu) eni nu \\\"termini\\\".\\nPa
  isempiu, a palora \\\"cani\\\" eni lu termini utilizzatu pi adintificari chie ca
  eni nu cani.\\nTuttu chiddu ca na pirsuna sapi di nu cani eni lu cuncetti di lu
  termini cani.\\nTermini diffirenta poni ssiri usati p''adentificari lu stessu cuncettu.\\nLingui
  diffirenta anu termini diffirenta ppi lu stissu cuncettu.\\nChissu eni chiddu ca
  rendi a traduzzioni pussibbili.\\nLi termini ponu ssiri diffirenta ''nta ogni linguaggiu,
  ma lu cuncettu eni lu stissu.\\nLu cuncettu di sautu eni lu stissu ppi na pirsuna
  d\u00e2 Sicilia e ppi na pirsuna ca parra e scrivi in angrisi, ma ''na pirsuna usa
  \\\"sautu\\\" e l''autra usa \\\"jump\\\".\""]'
