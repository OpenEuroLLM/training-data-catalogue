sample: '["\"Pruvincia di P\u00e8saru e Urbinu\\nLa pruvincia di P\u00e8saru e Urbinu,
  chi pigghia lu nomu d\u00ee cit\u00e0 di P\u00e8saru e di Urbinu, cunfina a sittintriuni
  cu l''Emilia Rumagna (pruvincia di Rimini, pruvincia di Forl\u00ec-Cesena) e c\u00e2
  Rip\u00f9bblica di San Marinu. A livanti c\u00fb Mari Adri\u00e0ticu, a miridiuni
  c\u00e2 pruvincia di Ancona cu l''\u00d9mbria (pruvincia di Peruggia), e a punenti
  c\u00e2 Tuscana (pruvincia di Arezzu).\\nNzinu \u00f4 1996, la pruvincia di P\u00e8saru
  e Urbinu fu abbriviata cu PS, mentri di chiddu annu si scrivi PU.\\nLa pruvincia
  di P\u00e8saru e Urbinu \u00e8 una d\u00ee pruvinc\u00ee st\u00f2richi d''Italia.
  Prima d\u00e2 n\u00e0scita d\u00fb Statu Talianu, appi diversi dinuminazzioni, partennu
  d\u00fb Ducatu d\u00ee Muntifeltru (nt\u00f4 talianu: Montefeltro), passannu p\u00fb
  Dipartimentu d\u00fb Mit\u00e0uru (nt\u00f4 talianu: Metauro), \u00f2pira di Napuliuni
  e la Ligazzioni Apust\u00f2lica di Urbinu e P\u00e8saru d\u00fb Statu Puntificiu.
  C''havi na supirfici di 2.892 chmq e rapprisenta un cruciv\u00eca ntra Marchi, \u00d9mbria,
  Tuscana e la vicina Rumagna.\"", "\"Canali IRC officiali d\u00ea traduttura. Visitani
  si hai bisognu d''aiutu, si voi simplicementi chattari, p''arric\u00e8viri aggiurnamenti
  o si hai addumannati novi!\\nWikizziunariu: Traduzzioni d\u00e2 simana. Ogni simana
  v\u00e8ninu scigghiuti tri palori di trad\u00f9ciri: nun scurdari d''agghi\u00f9nciri
  li link a ogni palora ngrisa traduciuta comu traduzzioni puss\u00ecbbili d\u00e2
  palora assuciata nta l''\u00e0utru Wikizziunariu (e sistema li difinizzioni ncumpleti
  o ammancanti, li prununzi e li formi dirivati comu ii plurali).\\n\u00d4 cuntrariu
  di quantu nui\u00e0utri traduttura put\u00ecssimu pinzari ;-)nun sempri abbisogna
  trad\u00f9ciri tuttu. Chistu \u00e8 lu mutivu d\u00e2 criazzioni di Wikispelling,
  evitari erruri nt\u00e2 traduzzioni di nomi di pirsuni o lochi. Wikispelling \u00e8
  nu pruggettu trans-wiki e multilingua. C''\u00e8 bisognu di pirsuni ca cuntr\u00f2llanu
  li traduzzioni nt\u00ea varii lingui d\u00ea messaggi nta Wikispelling. Siti li
  bimminuti !\\nLi lingui hannu r\u00e8guli diversi pi quantu arriguarda li mai\u00f9sculi.
  P''esempiu, n ngrisi, li nomi di misi o d\u00e2 maiuri parti d\u00ea t\u00ectuli
  prufissiunali sunnu sempri mai\u00f9sculi, ma chistu nun avveni p''esempiu n francisi.
  Tanti Wikizziunari fannu diffirenza oi ntra mai\u00f9sculi e min\u00f9sculi. Lu
  Wikizziunariu havi a \u00e8ssiri aggiurnatu ch\u00ea r\u00e8guli di capitalizzazzioni
  d''ogni lingua. Poi aiutari a cumplitari la tabbella d\u00ea Mai\u00f9sculi e min\u00f9sculi!\\nNa
  nizziativa nova pi coordinari li Wikisource d\u00ea vari linguaggi c''hannu a c\u00f2gghiri
  li traduzzioni vecchi e cri\u00e0rinni di novi pi c\u00f2dici surgenti mai traduciuti
  o c''hannu sulamenti traduzzioni prutiggiuti di drittu d''auturi, ecc.\\nAbout localisation\\nInformation
  about localisation for both translators and developers can be found on the localisation
  page on MediaWiki.org. The information may be outdated.\\nLong-term translation
  strategy\\nYou can read and discuss ideas about how to work with translations on
  the translation strategy page.\"", "\"Pubbliu Tirenziu Afru\\nPubbliu Tirenziu Afru
  (''n latinu Publius Terentius Afer) (195 a.C. \u2013 159 a.C.), meggiu canusciutu
  comu Tirenziu, fu nu auturi di tiatru latinu a lu tempu di la Rip\u00f9bbrica Rumana.\\nTirenziu
  Afru, comu lu stissu nomu ni dici, era d''ur\u00ecggini africana, nasc\u00ecu a
  Cart\u00e0ggini, nti l''attuali Tunis\u00eca. Li s\u00f2 \u00f2piri, a diffirenza
  di chiddi di Pl\u00e0utu, add\u00f2piranu nu linguaggiu cchi\u00f9 \u00e0utu e hannu
  statu apprizzati di tanti littirati rumani, comu S\u00e8neca ca anninca comu asempiu
  di humanitas lu s\u00f2 notu versu: Homo sum, humani nihil a me alienum puto (ca
  ''n sicilianu significa: \\\"Omu sugnu: nenti di zoccu \u00e8 umanu lu cunz\u00ecdiru
  straneru\\\").\"", "\"Twist and Shout\\nTwist and Shout (chi sign\u00ecfica \u00e2
  littra: \\\"gir\u00eca e vann\u00eca\\\"), \u00e8 na canzuna riggistrata di The
  Beatles nt\u00f4 1963 e nisc\u00ecu sulu nt\u00ea Stati Uniti unni jiu a n\u00f9mmuru
  dui e dd\u00e0 cci arristau pi quattru simani. Ironicamenti, era Can''t Buy Me Love
  (\u00e2 littra: \\\"non mi pozzu accattari amuri\\\") chi la firmau a jiri a n\u00f9mmuru
  unu. D''ur\u00ecggini era na canzuna d\u00ee Isley Brothers. Criticamenti, nun era
  na granni canzuna; nisc\u00ecu sulu nt\u00ea Stati Uniti p''apprufittari d\u00fb
  straurdinariu successu chi av\u00ecanu The Beatles chi, nni ddu mumentu, era propriu
  fora misura (e, dunca, avemu la sprissioni di ddi tempi: Beatleman\u00eca).\"",
  "\"Malamuri\\nLam Do Rem Fa 4v Lam Lu Malamuri Do Rem Fa ca t''arrivota e annagghia
  l''ali Lam Alliscia li penni Do Rem Fa e supra ''a cuda jetta lu Sali Lam Vampa
  di focu Do Rem Fa e comu sciara ti nni cali Do Mi Lam Lam7 E tu ca fusti la vita
  mia, Do Mi Lam Lam7 Ciatu, sangu di lu me sangu Do Mi Lam Lam7 E stidda, lacrima
  di lum\u00eda Do Mi Lam Lam7 Iu cu lu cori di fangu Lam Lu malamuri, Do Rem Fa c''
  un ti nni fuj, ''un ti nni scappi, Lam Arrappa lu cori Do Rem Fa antrica li veni,
  e pass\u00eda ''ntra li rappi Lam Trav\u00eda lu senziu, Do Rem Fa e ''nnuccenza,
  cu n''appi n''appi Do Mi Lam Lam7 E tu ca fusti la vita mia, Do Mi Lam Lam7 Iu anima
  spersa Do Mi Lam Lam7 E tu tali\u00e1ri ca mascaria Do Mi Lam Lam7 Ehii Iu arma
  arriversa Lam Onna allipussa, Do Rem Fa scuma c''attigghia ''a raggia du mari Lam
  C''annaca, pigghia, Do Rem Fa affunna, isa, lassa affucari Lam Scuta la brogna Do
  Rem Fa ca la vriogna la fa ammucciari Do Mi Lam Lam7 E iu ''mpronta di la tua Do
  Mi Lam Lam7 Tu bistemia d''amuri Do Mi Lam Lam7 E jocu tintu ca disv\u00eda Do Mi
  Lam Lam7 Tu minnitta d''amuri Do Mi Lam Lam7 E tu, tu ca vulisti a m\u00eda Do Mi
  Lam Lam7 ''Nta ''na vanedda morta, Do Mi Lam Lam7 E iu ca t''haju vulutu a t\u00eda
  Do Mi Lam Lam7 u la me arma torta Do Mi Lam Lam7 a sfumare Vocalizzo\"", "\"Lettura
  autorizzata ai soli BAGNOLESI !\\n(gli altri che ci provino pure)\\nGino Di Capua\\nL\u2019
  IDEA R\u2019 NU DISOCCUPATU\\ndi Tommaso Aulisa\\nRa tanta tiempu s\u00f2 disoccupatu,
  senza nu lavoru, senza na fatia.\\nSi facia coccosa m\u2019 distraia,\\nn\u00e9
  m\u2019 stancavu a st\u00e0 cuss\u00ec mpalatu. Si avessa rici, p\u00f2, la verit\u00e0,
  nun fatiai mai a munnu miu.\\nFacietti lu sturentu p\u2019 guliu,\\nienne puru a
  l\u2019Universit\u00e0.\\nZappa la terra, crisci l\u2019animali,\\nricia tatillu
  quann\u2019eru picciriddu. Campi megliu s\u2019allievi nu vutieddu,\\nsi pasci r\u2019
  vacche e li maiali.\\nChi t\u2019 n\u2019 fai r\u2019 d\u2019 cartuscedde\\ncu scrittu
  duttoru e n\u2019ata cosa,\\nsi nun fatii e riesti chiusi a casa? Sienti buonu a
  m\u00e9: pasci r\u2019 purcedde. Stai a l\u2019aria aperta cu r\u2019 friscu;\\nla
  panza la tieni sempu chiena;\\nSi migliereta spissu resta prena,\\nnun t\u2019 manca
  pane e vinu friscu.\\nA che t\u2019 serve lu vistitu buonu,\\nr\u2019 scarpe sempu
  nove e la cravatta,\\nnu cuoddu mpusumatu e la paglietta, n\u2019anieddu e nu llorgiu
  cu nu cuornu,\\nsi roppu riesti sempu sfasulatu, vacante r\u2019 sacche e senza
  nienti;\\na lu iuornu vai menanne vienti\\ntutt\u2019 afflittu, sempu scunsulatu?\\nNun
  m\u2019 ncuzzavu tantu lu cunsigliu; nu lu stietti a sente a tata miu, facenne cumme
  feci, a modu miu, scurdanneme ca l\u2019eru puru figliu.\\nEppuru ricu: nun m\u2019
  roncu vintu. N\u2019idea bbona m\u2019 passa p\u2019 la capu;\\nla tencu ncuorpu
  a me, ca nun s\u2019 sapu:\\nla mannu mpuortu appena cangia vientu.\\nM\u2019 apru
  nu partitu, buonu ca s\u2019 nota\\ne vavu priricanne p\u2019 quattuornu, prumettenne
  coccosa senza scuornu: nu postu, na pensione a chi m\u2019 vota. Ancora oi la gente
  \u00e8 tantu fessa: abbocca sempu a l\u2019amu si c\u2019\u00e8 l\u2019esca. Puru
  si nun sura volu acqua fresca; nveci r\u2019 zapp\u00e0 volu serve messa.\\n\u00c8
  nu rimediu quistu, nduvunatu,\\np\u2019 put\u00e9 mette vicinu a lu purtedda\\nna
  bella piastra, puru grussicedda,\\ncu ncimma scrittu: dottoru e deputatu.\\nTommaso
  Aulisa\\nTi invitiamo a reastare in tema, essere costruttivi ed usare un linguaggio
  decoroso. Palazzo Tenta 39 si riserva comunque il diritto di allontanare le persone
  non adatte a tenere un comportamento corretto e rispettoso verso gli altri.\"",
  "\"10 di austu\\nD\u00e2 Wikipedia, la nciclupid\u00eca l\u00ecbbira.\\nAbbinimenti[cancia
  | cancia la surgenti]\\n- 847: Pruclamazzioni di l''Emiratu di Bari\\n- 1258: Manfredi
  di Sicilia \u00e8 ncurunatu a Palermu\\nNati[cancia | cancia la surgenti]\\n- 1267:
  J\u00e0cumu II d''Aragona, futuru re di Sicilia\\n- 1629: Austinu Scilla, pitturi
  e scinziatu missinisi\\n- 1810: Camillu Bensu Cunti di Cavour, statista d\u00fb
  Risorgimentu italianu\\nMorti[cancia | cancia la surgenti]\\n- 258 - San Larenzu,
  m\u00e0rtiri\\n- 1051 - Druguni d''Autavilla, cunti di Pugghia\"", "\"di Giovanni
  Giardina\\nVu ricurdati a Giuvanninu \u201cOcchittu\u201d\\nca \u00eca giriannu
  sulu strittu strittu ?\\nDappressu purt\u00e0va un ligniscieddu e mani,\\npirch\u00ec
  avia tim\u00f9ri sempri di cani .\\nTutti u \u2018nciuriavanu \u201cOcchittu\u201c\\npirch\u00ec
  \u2018nta l\u2019uocchi avia un gran difiettu,\\nc\u2019era cu pass\u00e0va dirittu
  e n\u00f9 uard\u00e0va\\nc\u2019era cu si ferm\u00e0va e u scuncic\u00e0va.\\nAd
  apprufitt\u00e0ri c\u2019eranu i carusi,\\nca dd\u2019uocchi ci par\u00ecanu curiusi
  ,\\nbastava co vid\u00ecanu assum\u00e0ri,\\nca subitu u cuminci\u00e0vanu a \u2018nzurt\u00e0ri
  !\\nGiuvanninu, appena i vidia avviscin\u00e0ri,\\ncu lignu i cuminci\u00e0va a
  minazz\u00e0ri,\\nchi dienti stritti e ddu lignu e mani :\\nCi disc\u00eca :\u201c
  Vi nni vul\u00ecti iri i cca, gran figghi di buttani ? \u201c\\nL\u2019unicu cu
  aiut\u00f2 e cci fisci pena,\\nfu u bumm\u00e0ru,\u2026don Peppinu Arena\\nca prima
  u liv\u00f2 da strata, e a puocu a puocu,\\nci\u2018nzign\u00f2 a spar\u00e0ri u
  juocu i fuocu .\\nE i t\u2019annu, cu i potti cchi\u00f9 scugn\u00e0ri ?\\nPi anni
  continuarunu a spar\u00e0ri !\\nPoi, quannu pi don Peppinu arriv\u00f2 l\u2019ura,\\nGiuvanninu
  si ritruv\u00f2 tra quattru mura.\\nI quannu pird\u00f9 ddu gran benefatt\u00f9ri,\\ncamp\u00f2
  sulu c\u2019aiutu du Sign\u00f9ri !\\nPoi, cu \u00e8 co p\u00f2 sapiri ?\\nO fu
  pirch\u00ec suffr\u00eca, o fu a malicunia\\nsi ricurd\u00f2 i l\u2019amicu, e cci
  i\u00f9 a fari cumpagn\u00eca !\\nLipari \u2013 12 \u2013 01 \u2013 2014 \u2013\"",
  "\"Verbu Ausiliari\\nLu verbu ausiliari \u00e8 unu:\\nAviri\\n\u00c8 chiamatu verbu
  ausiliari picch\u00ec aiuta lu verbu principali:\\nHaiu manciatu\\nNt\u00f4 Sicilianu,
  sti sprissioni fatti cu lu passatu pr\u00f2ssimu, nun si usanu o si usanu raramenti,
  mmeci si usa sempri, nta stu casu, lu passatu rimotu:\\nManciai\\nLi verbi sunnu
  organizzati a Coniugazzioni, e li coniugazzioni sunnu organizzati a Modi e Tempi.
  Nt\u00f4 Sicilianu nun \u00e8 nicissariu m\u00e8ttiri lu pronomi pirsunali prima
  di lu verbu, picch\u00ec cu lu significatu di la prupusizzioni si capisci a quali
  pirsuna si rifirisci e siddu \u00e8 singulari o plurali.\\n\u00ccndici\\nModu Indicativu
  (di lu Verbu Aviri)[cancia | cancia la surgenti]\\nModu Congiuntivu[cancia | cancia
  la surgenti]\\nNt\u00f4 Sicilianu si usa lu prisenti congiuntivu comu lu prisenti
  indicativu.\\nModu Cundizziunali[cancia | cancia la surgenti]\\nLu cundizziunali
  nun \u00e8 tantu usatu ''n sicilianu, \u00f4 s\u00f2 postu si usa lu congiuntivu
  mpirfettu.\\nModu Mpirativu[cancia | cancia la surgenti]\\nStu Modu usa sulu a secunna
  pirsuna singulari e plurali e usa lu prisenti ndicativu:\\nHai a manciari. Aviti
  a partiri.\\nLu mpirativu nigativu di la secunna pirsuna singulari nt\u00f4 sicilianu
  \u00e8 furmatu di la nigazzioni d\u00fb nfinitu di lu verbu:\\nNun aviri prescia\\nNfinitu[cancia
  | cancia la surgenti]\\nAviri\\nPassatu\\nAviri avutu\\nParticipiu[cancia | cancia
  la surgenti]\\nPassatu\\nAvutu\\nGerundiu[cancia | cancia la surgenti]\\nPrisenti\\nAvennu\\nPassatu\\nAvennu
  avutu\\nSprissioni Siciliani cu lu verbu aviri\\n- Haiu pitittu,\\n- Hai siti,\\n-
  Aviti sonnu,\\n- Hannu prescia,\\n- Avemu deci anni l''unu.\"", "\"Giuseppi Bertini\\nGiuseppi
  Maria Bertini (Palermu, 20 di jinnaru 1759 \u2013 15 di marzu 1852) fu nu littiratu,
  scritturi e cumpusituri sicilianu.\\nBiograf\u00eea[cancia | cancia la surgenti]\\nFigghiu
  d\u00fb musicista Sarvaturi Bertini frinquintau na scola riliggiusa e addivintau
  succissivamenti preti. S''addidicau pi tutta la vita a studi di musica, di archiolugg\u00eca,
  di loittiratura e di storia curturali d\u00e2 Sicilia. nt\u00f4 1789 ansemmmula
  cu s\u00f2 frati Natali cuntribbu\u00ecu cu n'' Ode funebre \u00ea \u00e0utri travagghi
  musicali \u00ea funzioni cumminurativi p\u00e2 morti d\u00fb re Carli III e di lu
  nfanti Ginnaru Carlu. Nt\u00f4 stissu piriudu fi prima vici-mastru d\u00e2 Cappedda
  palatina, sutta la dirizzioni di s\u00f2 patri, e appoi mastru.\\n\u00d2piri[cancia
  | cancia la surgenti]\\nBertini \u00e8 canusicutu pi aviri scrittu nu dizziunariu
  n 4 vuluma d\u00ea biografii di musicisti illustri nt\u00f4 1814, una d\u00ee primi
  \u00f2piri di stu tipu. Scrissi diversi \u00e0utri cumposizzioni musicali, ma picca
  agghicau nzinu \u00ea nostri jorna.\"", "\"Furriannu-furriannu tra mari e paisi
  di Sicilia\\ndi Filippo Maria Provitina (Pruf\u00e8tina, n\u2019sicilianu)\\nApirtura\\nAviti
  mai taliatu a Sicilia ku ochi kusiritusi di vidila komu idda viramenti eni, senza
  cirkarivi i tanti fiuri stiriutipati e i tanti lokura ka putissi nun aviri? Vuatri
  ka stati n\u2019Sicilia, aviti mai statu n\u2019Sicilia?\\nIu nun saccu siddu sbaghu
  a kuntarivi a me spirienza, ma fu ka un iornu i cirkustanzi da vita mi ficiru rializari
  un sognu vechu kuantu a mia: a kanuxenza di tutti i lokura di l\u2019Isula unni
  nax\u00ee e unni, dopo avirici jratu ntornu pi tanti anni, sempri turnava prontu
  a autra partenza, a autra skappatina.\\nKistu succidia na trintina di anni apressu
  di aviri j\u00e0 vistu kuasi tutti ddi posti, futukrafati pi kistu n\u00e2 me mimoria
  nkonxa n\u2019modu tantu nkarkatu di farimili rikanuxiri a prima vista, senza sapiri
  di duvirimici atruvari e senza ka mai chu ci avia pisantu, e ku tanti partikulara
  di luci e kulura, di ummiri e di prufili, pinsinu di s\u00f2nira, di fari mprissioni.\\nA
  mia eni, n\u2019pratika, na narrazioni di lokura pikka kanuxuti, visitati ku ansia
  di studiusu, ntrizzata ku na spuntania rivisitazioni mnimonika di kuannu, chussai
  di un kuartu di sekulu prima, pa prima vota mi ci truvai a kaminarici k\u00fb spiritu
  juiusu di un piccutteddu di prima varba o, n\u2019certi kasi, k\u00fb spiritu nfantili
  di un karusu tinutu ankora pa manu di so patri.\\nStannu a kistu, nudda lojka di
  pirkurrenza jukrafika mi potti guidari a menti e a manu, essennu ka era u kasu a
  kunnucimi di kka e di dda , o, pu meno, u nkunsapevuli intimu disideriu di riviviri
  certi situazioni pi putirimi libirari di inkubi e di fisimi. Nudda nutizia storika,
  nudda nnikazioni artistika, sulu sintimentu e diskrizioni di partikulara ka nun
  sunu distinati a turisti prixalori ma a viajatura ntirissati a studiari u misteru
  da ripitibilit\u00e0 cikrika du Kosmu atraversu l\u2019atirnazioni di l\u2019imajni.\\nCertu,
  nun potti avitari di kalarimi n\u2019menzu \u00ea granni zoni arkiulojki o \u00ea
  famusi cit\u00e0 o \u00ea beddi ariali naturalistici di sta parti di munnu, ma sulu
  pi gudimentu pirsunali e no pi fini diskrittivi.\\nU jru ka fici mi sirviu pi kapiri
  ka nun asisti nuddu kuligamentu, sia n\u00f4 beni ka n\u00f4 mali, tra a Sicilia
  da prupaganna ufficali e a so vera idintit\u00e0, ka nun eni komu n\u00e2 Skozia
  unni i kastedda sunu pezzi di storia p\u00ee turisti komu p\u00ee nnijni: kka, na
  sta terra strapazzata, i rudiri di Silinunti sunu pezzi di storia sulu p\u00ee turisti;
  p\u00ee nnijni, un munzeddu di petri ka eni un pikkatu nun putiri usari komu matiriali
  di kava j\u00e0 travaghatu.\\nEppuru, stu abannunu ci duna un faxinu riali, so,
  tuttu so, e a fa terra sidotta ka siduci.\\nPi rivisitarimi rikurdannu i rikordi,
  pi skurdarimi di essiri un sicilianu asiliatu n\u2019Sicilia, na sta terra vosi
  arivarici komu un navikaturi d\u00ee tempi passati, du mari, facennu u jru da so
  kosta e rigularmenti aprudannu na tutti l\u2019isuliddi ka ci gravitanu ntornu.
  Pir\u00f2, nun sapennu dicidiri kuali avia a essiri u me puntu di partenza di dda
  banna \u00f4 mari, dicid\u00ee ka pi truvari a Sicilia propriu di idda avia a partiri.\\nNaxeru
  akus\u00ec sti appunti di un viaju n\u2019Sicilia.\\nSkoghi\\nEni un iornu umitu
  kuannu na matina lassu u portu di Marsala du me Kuntinenti, a Sicilia, n\u2019dirizioni
  Mozia. Dopu na minzuredda di navikazioni kueta aprodu na un postu fatatu, chinu
  di arvuli fruttifiri e di vosku, e di macha miditirrania pupulata di vavaluceddi
  asunnati, furmatu di tri isuli vicini chamati San Pantaleu, Santa Maria e Skola
  ma, midemma, Longa, chu simpricimenti arcipelaki du Stagnuni. Iu u chamassi Edini.\\nDi
  dda mi partu facennu rotta versu l\u2019Egadi. Pi strata nkontru l\u2019arcipelaku
  d\u00ee Furmiki: supra na isulidda c\u2019eni un kasteddu e tanti kapannuna; na
  nautra, chatta komu na tavula, c\u2019eni na kasuzza. Nkontru, midemma, l\u2019arcipelaku
  d\u00ee Purceddi e di iddu mi kurpixi u faru, kustruitu supra una d\u00ee so isuliddi,
  ka pari nu ubilisku ajzianu n\u2019menzu \u00f4 mari.\\nSti dui arcipelaki, komu
  l\u2019autri furmazioni di l\u2019Asineddi e d\u00ee Palummeddi e l\u2019isulidda
  Makauni, sunu disabitati o kuasi.\\nDopo tri uri di navikazioni arivu n\u2019vista
  di na muntagna ka, pi effettu di partikulari riflessi davanti \u00f4 suli, pari
  naxiri dintra n\u2019autra muntagna: Levanzu. I primi partikulari ka mi kurpixunu
  sunu vuskiceddi marturiati du kavudu, na strata di pinitrazioni n\u2019forti pinnenza
  e un kampusantu sutta rokka, kuasi a mari, ianku.\\nCi vosi na uricedda di viaju
  pi iunciri a Favignana, un gran linzolu di terra unni un jganti apuiatu a l\u2019uvitu
  e ku n\u2019testa un kasteddu pari ka si ci avissi stinnichatu di supra. Muriceddi
  a sikku a tistimunianza di kurtivazioni agrari, kasuzzi n\u2019petra tipu \u201dsesi\u201d
  o \u201dkuburi\u201d a rikordu di l\u2019attivit\u00e0 pasturali d\u00ee tempi passati,
  na kupula virdi a rikordu di nun saccu ki.\\nNautra uricedda di viaju ku rotta sudovisti
  e mi avrazza Marettimu ku na menza kuruna di kasi ianki a forma di kubu, pusiziunati
  a menza-kosta di na muntagna avuta ka ci fa ummira na stu finiri di iurnata.\\nLassannumi
  l\u2019Egadi \u00ea spaddi ci vosiru cinku uri bonu di mari apertu pi nkuntrari
  un munti anormi ka pa so forma mi fa viniri n\u2019menti i denti di nu skualu: si
  tratta di Pantiddiria k\u00fb so vurkanu astutatu chamatu, oj, \u201cmuntagna granni\u201d.\\nAnkora
  chu a minziornu, iennu pir\u00f2 versu l\u2019Afrika, dopu tri uri mi kunforta a
  vista da prima d\u00ee Pilaj, Linusa, k\u00ee so tri timpi pusati supra un tavulatu,
  d\u2019unni, dopu nautri dui uri, arivu a Lampidusa. Kista pari na kutra stinnuta
  supra u mari, tantu eni chatta, e di chu, a limitari, eni afratata ku na isulidda
  disabitata ditta D\u00ee Kunighi, patria di skuzzari di mari.\\nA na ura di viaju
  l\u2019urtima di Pilaj, Lampiuni, na petra disabitata n\u2019menzu \u00f4 mari.\\nDi
  ddoku, a esti, dopu oltri cinku uri, Marta pari na manu graputa, ricintata di muraghuna,
  e n\u00ea vicinanzi, a menza-uricedda, Kuminu eni na petra n\u2019menzu \u00f4 kanali
  e Gozu na macha gallijanti a mari.\\nDopu di ki, passannu vicinu a l\u2019isulidda
  di Kapu Passaru, na atravirsata avintirusa mi porta oltri u strittu di Missina nsinu
  a farimi nkuccari Vurkanu, una d\u00ee setti soru Eol\u00ee. Idda mi apari, vilata
  di xirukkusi russastri riverbiri kripuskulari, komu na suprapusizioni nfinita di
  timpi ka, manu-manu ka mi vaiu avicinannu, si disting\u00fbnu n\u2019kuattru muntagni,
  e apodi n\u2019cinku muntagni e n\u2019kosti frastaghati a difisa du portu mentri
  apari midemma na bedda lingua di terraferma.\\n\u00ca spaddi di idda, j\u00e0 sfaviddanti
  di middi luci, viu Lipari: dui faraghuna pricedunu n\u00f4 kanali tra kisti dui
  u portu nkuniatu n\u2019menzu a dui prumuntor\u00ee e prutijutu darreri di na gran
  muntagna. Avi kasi tincuti ku kulura dilikati. Pi iunciri a Panarea ci voli kuasi
  na ura: sumigha a San Fulippu vista da parti di Aghanu e avi kasi ianki. Disabitati
  sunu Basiluzzu, a forma di kuruna di rijna o di forti xiddikata ku isulidda a manka
  o di kasteddu di magu a sikunnu di unni si talia, Liska di Pixi, na rokka a pizzu,
  e i Furmikeddi, isuliddi sparpaghati ntornu \u00e2 Liska.\\nNautra menza uricedda
  di navikazioni pi rennimi kuntu ka dda gran saguma \u00ea spaddi di Basiluzzu nun
  era autru ka Strummula e, \u00e2 dritta di idda distanti un mighu, Strummulicha
  ka, vista di vicinu, pari un gran kubu. A Strummula viu ka n\u00e2 n\u2019sinatura,
  n\u2019terra-ferma, c\u2019eni, priva di portu, a kumunit\u00e0 di Jnostra: na stu
  mumentu napoku di varkuzzi di piskatura lukali stanu facennu ponti k\u00fb pustali
  ka veni di Milazzu.\\nApodi, dopu dui uri, Salina, kumposta di dui granni isuliddi
  pu fattu ka tra i dui munti c\u2019eni na vaxa vaddunata, e, dopu nautri dui uri,
  Filikudi, k\u00e2 so forma a sedda o a ferru di kavaddu.\\nNa menzura, passatu u
  pinnakulu di Kanna e na vicina isulidda, mi si prisenta un timpuni di lava ricenti:
  Alikudi.\\nA mprissioni ka aiu visitannu l\u2019arcipelaku di l\u2019Eol\u00ee eni
  kidda di essiri a Vinezia, n\u2019menzu \u00ea so kanali, o kidda di meghu kapiri
  \u201cI cit\u00e0 du munnu\u201d di Vitturini.\\nPensu, apodi, kuasi kumuvutu, a
  tutti ddi isuli ka mai anu vistu u celu, o ka si anu nabissatu n\u2019tempi luntani,
  e mi veni u dubbiu ka iddi putissiru essiri filici di truvarisi \u00f4 skuru d\u00ee
  bassizzi umani di supirfici.\\nCi vonu assai uri pi arivari a Ustika, isulidda ka
  si stenni a forma di skuzzara o di kukudrighu, rikka di voski e k\u00ee murati d\u00ee
  kasi pittati.\\nDi ddoku, ankora tri uri e tokku Sicilia: u gurfu di Munneddu, survighatu
  d\u00ee dui prumuntor\u00ee Munti Piddirinu e Munti Gaddu, eni cintu a menza kuruna
  di munti; u Piddirinu pari na navi ku puppa, prua, kasteddu e cimi.\\nViu midemma
  l\u2019isulidda D\u00ee Fimmini e, nfini, Palermu, riparata d\u00ee muntagni ka
  cirkunnanu a konkadoru.\\nStu viaju di avicinamentu \u00e2 Sicilia partennu da stissa
  Sicilia, fattu k\u00e2 cirkumnavikazioni d\u00ee so arcipelaki e isuliddi, mi priparau
  \u00e2 visita di l\u2019Isula Granni ka mi pari, rispettu a tuttu ddu mari unni
  gallijavanu skoghi, komu podi apariri a un tidesku l\u2019Auropa dopu essiri statu
  n\u2019Sicilia o n\u2019Sardegna: un kuntinenti.\\nPik\u00ec na sti skoghi mi sintia
  si vurnirabili komu supra a na varka, n\u2019preda \u00ea krapicci da Natura, ma
  chu vicinu \u00f4 Kriaturi, mentri na l\u2019Isula Granni mi sentu si \u00f4 sikuru,
  ma chu n\u2019menzu \u00ea mali di l\u2019omu. Ora meghu possu kapiri u karattiri
  di l\u2019abitanti d\u00ee skoghi, komu meghu i viajatura aurupei kaperu u karattiri
  d\u00ee siciliani dopu aviri visitatu l\u2019Isula Granni.\\nFu akus\u00ec ka, dopu
  kuasi trentanni, chu forti e chu debuli, ritrovu, kunnucutu du kasu e, alivoti,
  di un bisognu amuccatu, lokura antiki sulu aparintimenti skurdati. Pi stu mutivu
  pi diskrivili mi piaci di usari ankora a prima pirsuna singulari, ma n\u00e2 forma
  passata e no prisenti.\\nTerraferma\\n-1-\\nA prima vota ka ivi \u00e2 grutta da
  Gurfa, n\u2019Kumuni di Alia, mi parsi ka mi avia persu na nu nsonnu, na unu di
  ddi nsonnira, unni unu pari di essiri n\u2019biliku tra u pirikulu di moriri e a
  cirtizza da nkulumitadi.\\nNun kanuxennu u postu, ivi prima n\u2019paisi. Ddoku
  mi nfurmai da strata ka avia a fari e, komu-fu-komu-nun-fu, mi truvai spersu kampagni-kampagni
  avennu pi guida sulamenti na karrittera disastrata pi tanta akua ka ci avia skurrutu
  di supra lassannu kka e dda spechi unni si abiviravanu acidduzzi akalurati pu forti
  suli di dda iurnata ka avia fattu sikkari terri kritusi e nudi.\\nArivai, finarmenti,
  e mi parsi beddu.\\nC\u2019era na grutta a kampana, tantu granni ka dintra ci putia
  trasiri un paisi; e autri grutti c\u2019eranu, a latu e supra, e tutti eranu skavati
  da manu di l\u2019omu ka avia partutu di un pirtusu n\u00e2 parti avuta iennu a
  xinniri manu-manu alargannusi e rikavannu midema a kamira murtuaria senza nudda
  autra apirtura. Sulu apressu ci fu graputa na finestra e a \u201ckampana\u201d fu
  suparkata, e n\u2019kurispunnenza ci vinniru skavati autri grutti pi rikavari no
  chu sipukri ma stanzi di abitazioni.\\nKuantu grafiti anu lassatu i jenti n\u00e2
  so facciata (n\u2019sicilianu, n\u2019latinu, n\u2019finicu) e kuantu bedda fu sta
  me skursioni.\\n\u00d4 ritornu, nuddu pubrema: mi truvai pi subitu n\u00e2 strata
  statali ka kunnuci n\u2019Palermu. E siddu nun avissi statu ka n\u00e2 me kuddizioni
  aiu ankora pitruzza pruvinenti du chanu davanti i grutti, unni mi riciviu u prup\u00eetariu
  (e kustodi furzatu e abusivu) di sta miravigha, pinsassi di avirimi nsunnatu.\\n-2-\\nU
  iornu ka, lassannu a komuda autustrata PA-TP, nix\u00ee \u00f4 svinkulu di Muntilepri
  pi achanari a Munti Parmita, mi parsi di passari ddabanna \u00e2 porta du passatu.
  Alivoti pik\u00ec l\u2019ochi si avianu j\u00e0 inchutu d\u00ee munzedda di petri
  ka si truvavanu kka e dda n\u00e2 vaddunata du Kanali Mirceni, alivoti pik\u00ec,
  kaminannu-kaminannu, mi truvai na un postu suspisu tra mari e celu unni sulu si
  sintia \u201cu rumuri du silenziu\u201d, mi pighau na kosa komu siddu nun mi avissi
  dispiacutu di ristari dda pi sempri.\\nAsittatu supra na rokka di Pizzu Pavighuni,
  spurjenti n\u2019menzu a antiki furtifikazioni sdirupati, vutai i spaddi \u00f4
  mari e mi misi a taliari, ku sempri chu ntiressi, i munzedda di petri ka rikamavanu
  ddu chanu di muntagna n\u2019kumuni di Karini.\\nEranu petri ka nun avianu statu
  amunziddati pi spitrari (ntornu a iddi era tuttu petri), e manku pi kuncintrari
  matiriali utili pi kustruzioni (nun ci sunu ne mai ci anu statu kustruzioni a parti
  i furtina ka si vidunu), nonsi, eranu, nveci, e mi parsi charu, i munzedda funirar\u00ee
  d\u00ee surdati di Amirkari Barka.\\nPoviri picciotti, morti sutta stu suli di Sicilia,
  na stu loku dittu Eirkti ka Pulibiu nnikau tra Erici e Palermu, unurati d\u00ee
  so kumpagni ku sti munzedda di petri a nkastru, a forma aprussimata di omu k\u00ee
  pedi vutati a ddu mari unni i navi di kuligamentu ku kiddi chu granni lassati a
  Ustika si anakavanu vijli n\u00f4 gurficeddu di San Kataudu.\\n-3-\\nFu beddu kuannu,
  tra Rakkuia e Muntarbanu mi mmatt\u00ee na na chana pi mit\u00e0 aturniata di avuti
  timpi e pi l\u2019autra mit\u00e0 afaccata a vadduna, komu fussi un granni anfitiatru
  naturali.\\nDkoku, n\u2019menzu a tanti petri n\u2019menzu \u00ea marj, c\u2019eranu
  veri e propr\u00ee \u201cgrutti\u201d kustruiti fori terra ku cappi ka, partennu
  di na basi cirkulari, pusati una supra l\u2019autra, ivanu a-strinciri-a-strinciri
  nsinu a lassari n\u2019cima un pirtusu ka vinia ntuppatu ku na urtima cappa chu
  granni di tutti l\u2019autri.\\nTrasennuci di na apirtura ku tantu di kurnici, lassata
  aposta d\u00ee kustruttura, dda dintra unu si trova subitu komu n\u2019kasa so,
  kunfurtatu e sikuru, frisku di staxuni e kavudu di nvernu: si kapixi ka na tanti
  sekuli l\u2019omini di kampagna l\u2019anu usatu pi tanti skopi. Ma ki diku pi tanti
  sekuli? Pi tanti dicini di sekuli, kunsidirannu ka naxeru komu tombi. Sisi, komu
  tombi, e pi sta kosa si chamanu \u201ckuburi\u201d (di l\u2019arabu ka voli diri,
  pi l\u2019appuntu, \u201ctomba\u201d).\\nDa parti di dintra, nfatti, si vidi na
  speci di kunnuttu beddu nkurnicatu, unni vinia fattu passari u mortu pi iri a dormiri,
  na un lokulu sutta terra ddabanna \u00f4 kuburu, spostu a manka, u so sonnu aternu.
  Simu, kuasi di sikuru, \u00ea tempi da civilit\u00e0 sicula, \u00f4 menu middi anni
  prima di Kristu.\\nApressu, l\u2019arabi, ka i chamaru tombi na so lingua (\u201ckuburi\u201d,
  apuntu), i utilizaru va vidi pi kuali skopi, tantu ka n\u00f4 menzu di stu anfitiatru
  naturali, unni a faccata di avuti timpuna po essiri ntirissanti nikropuli pi certi
  signi ka vi si vidinu, atruvai na statua primitiva, senza testa, pensu pricidenti
  a l\u2019arabi, ma unni l\u2019arabi ci avianu skurpitu na skritta: All\u00e0.\\n-4-\\nKi
  amuzioni, truvarisi n\u2019cima a Munti Kastiddazzu e sapiri ka dda, \u00ea tempi
  antiki, era arukkatu l\u2019urtimu gruppu di Sikani battagheri, urgughusi \u00f4
  puntu tali di risistiri nenti di menu ka \u00ea lijunari rumani.\\nN\u00e2 suttastanti
  chana di Kartabillotta, unni ci furu i fatti d\u2019armi da sikunna guerra sirvili
  di Sarviu e Atinioni kontra u konsuli Manliu Akuiliu, ci sunu ankora tracci arkiulojci
  signifikativi e mimor\u00ee antiki. Di dda supra, si po diri ka si sentinu ankora
  i rumura da battagha, persa n\u2019partenza, di un populu ka avia fattu oramai a
  so parti n\u00e2 storia da Sicilia.\\nSkunfijuti ka foru Sarviu e Atinioni, nun
  c\u2019era nuddu mutivu p\u00ee rumani di iri a skuvari sti urtimi supravissuti:
  s\u2019avissiru persu, jnitikamenti, funnennusi, pi rajuni di supravivenza, k\u00ee
  jenti da chana ka \u201cSikani\u201d chu nun eranu.\\nKomu sucedi p\u00ee Nniani
  da Merika akus\u00ec sucessi p\u00ee Sikani di Xirtea-Kristia a Kratasi vicinu Burju.
  Na sti pizzi di muntagna furtifikati, kuligati tra di iddi ku stratuzzi mperv\u00ee,
  taghati fora d\u00ee fertili terri oramai kurtivati di autri patruna, mpussibilitati
  a kummattiri kontra un nimiku nvisibili komu eni u \u201cprugressu\u201d, kunnannati
  da Storia, nun ci putia aristari autru ka xinniri e kunfunnirisi k\u00ee vincitura-vinti.\\nE
  akus\u00ec fu, \u00f4 Kastiddazzu, ora sulu petri asdirupati, e tantu silenziu.\\n-
  5 -\\nFui, un iornu, a S. Ancilu Muxaru, e dda visitai a grutta ditta \u201cdu Principi\u201d.\\nKi
  pr\u00eeu ka ni appi n\u00f4 vidiri ddu skavu fattu tantu pricisu di asumighari
  a na strummula kapuvurjuta: ni appi a mprissioni ka adirittura sta strummula stassi
  furriannu.\\nKista era a stanza sipurkrali, unni u mortu vinia pusatu supra na nuda
  petra, a latu a autra stanza unni i parenti facanu u kunsolu asittati supra panki
  rikavati n\u00e2 viva rocca.\\nNa kosa ka nun cap\u00ee (tra i tanti kosi ka manku
  mi akurg\u00ee di nun kapiri) fu a ki putia serviri na speci di kunkicedda, granni
  kuantu un vacili, ka avianu skavatu vicinu \u00f4 sidili a manka trasennu. Pinsai
  ka putiva serviri, alivoti, komu kuntinituri di na xamma vutiva.\\nDdoku, propriu
  unni Sant\u2019Ancilu fici fuiri i virseri ka pa rabbiatura spakkaru a kruci nsinu
  u pavimentu di rocca.\\nTanti autri grutti visitai, sparti di kista, e kuasi tutti
  avianu (ku chu ku menu) a karattiristika di kidda \u201cdu Principi\u201d. Mi mprissiunau
  u kustuni chinu di grutti di kuntrata \u201cGrutticeddi\u201d ka certu, \u00ea tempi
  antiki, appi a essiri u kunnuminiu di na trib\u00f9 para-para.\\n-6-\\nVisitari
  u loku unni cinku sekuli fa si riunianu l\u2019abrei di Ajra fu na amuzioni forti
  ka mi tegnu ankora n\u2019menti.\\nStu tempiu, ka apodi, n\u00ea tempi, avia statu
  kunsakratu a chesa kristiana e ka alivoti, n\u2019tempi assai antichi, avia statu
  korki struttura krassika, e ka pi certu n\u00f4 \u2018600 avia uspitatu l\u2019arimita
  Diegu di Sinagra, nun avia chu u tettu e avia midema persu pezzi di murata. U pavimentu,
  nveci, si vidi ankora ka era amadunatu a krita.\\nKu tuttu kistu, ristannu iddu
  l\u2019unika sinakoga di tutta a Sicilia pi kulukazioni certa e mantinennu idda
  a struttura di obriku d\u00ee sinakogi (anti-sala e sala di pr\u00eeera), mi paria
  ankora di truvarimi na un loku sakru unni avia a parrari apassiddu e unni avia a
  kaminari n\u2019puntu di pedi.\\nL\u2019ar\u00f4nni, n\u2019petra skurpita a rilievu
  e pi kistu mutivu e pa datazioni uniku \u00f4 munnu, avia statu pricidintimenti
  spustatu n\u00e2 chesa majuri e dda u ivi a taliari.\\n-7-\\nN\u00f4 tettu da Sicilia
  (e nun sulu da Sicilia!) mi ntisi komu a kiddi ka, oramai, nun anu chu nenti di
  vidiri, komu a kiddi ka anu kumpritatu a propria asistenza tirrena.\\nA kunsapivulizza
  di putiri di un minutu a l\u2019autru fari a fini di Mpedukri, vali a diri di finiri
  mancatu di Diu Vurkanu, era akus\u00ec forti di spirari kuasi-kuasi ka si virifikassi.\\nN\u2019biliku
  supra barkunati spurjenti supra vauzi chini di foku e di fumu, veri e propri furnaci,
  ddabanna \u00ea xakkazzi di minutu-n-minutu chu largi ka avissiru pututu fari cediri
  i barkunati, a ddu stissu mumentu komu centu anni dopu.\\nSkugnannumi di ddoku,
  korki metru chu a dda via, sbumikava d\u00ee chai da terra nu sbuffu di matiriali
  lijeru komu na negha ka subitu si ragrumava e kuaghava komu fussi na sponsa di kuluri
  jallu-russu-azolu-ianku.\\nDda supra, a kuota 3333 di Munjbeddu, a terra eni ankora
  un pezzu di stidda.\\n-8-\\n\u00ca tempi, kuannu n\u2019Sicilia i xumi si avianu
  a passari a guadu, a Kapudarsu vinni kustruitu un ponti di mirabili fattura, tantu
  ka sta opira fu nsiruta tra i miravighi du Regnu.\\nOj, ka di ponti ci ni sunu middi-e-unu,
  nun fa chu mprissioni siddu kistu ku na granni munumintali arkata, avuta e longa
  kuantu a fami, skavarka l\u2019Imera miridiunali iuncennu dui muntagni ku autri
  dui arkati minuri ka kunsentunu u passaju di strati vaxi.\\nEpuru, ci fa ankora
  a so bedda fiura, pi aliganza e funziunalit\u00e0, speci siddu si kunfronta \u00f4
  mudernu kravakka-strata da viluci Kartanissetta-Enna.\\nMiravigha du Regnu, ku Muncibeddu
  e k\u00e2 funtana Aritusea, skrissi di iddu L\u2019abati Fleuri n\u00f4 1853, e
  si po kapiri pik\u00ec fici sta granni mprissioni pinsannu a iddu komu simpulu di
  prugressu a chusura di na ebika di skurantisimu ka avia kuminciatu k\u00ee vicir\u00e8
  spagnoli e ka, purtroppu, era distinata a kuntinuari ankora, tantu di ufenniri n\u00f4
  XX sekulu stu stissu magnifiku ponti amuccannulu e kunfunnennulu n\u2019menzu a
  napoku di pilastri di cimentu armatu.\\n-9-\\nKalari ku nu axinsuri traballanti
  pi cinkuanta metri n\u2019virtikali vidennu chuiri a-pikka-a-pikka a finestra di
  luci da trasuta, truvarisi ap\u00f2 n\u00f4 skuru chu tutali kurkatu dintra na karriola
  ka prucedi a xiddikalora ku antiki sistemi di trazioni supra un binariu di centu
  metri pusatu na nu strittu vudeddu n\u2019menzu \u00e2 terra e chinu di aria surfarusa,
  putirisi isari \u00f4 puntu di arivu pi sguazzari n\u2019menzu a akua puzzulenti
  e anaspari tra omini sudati\u2026\\nAvissi pagatu assai pi nun truvarimi dda sutta
  e midema assai avissi pagatu pi nun duviri rifari a stissa strata da xinnuta!\\nMa
  tuttu, n\u00e2 vita, eni kuistioni di abitutini: dopu pikka tempu (un minutu? un
  iornu? na vita?), a ura di spartiri pani e tumazza, alivi e vinu, barzilletti e
  rikordi, puru dda sutta, a Jangaghanu di Asaru, parsi un padarisu.\\n-10-\\nMiddi
  e passa anni di akua anu skurrutu sutta un ponti di petra forti komu azzaru, e mai
  l\u2019anu uffisu, e mai l\u2019anu kunfunnutu: akua di nivi skuaghata di munti
  \u201cMuntimunti\u201d, limpida e fridda komu lama di kuteddu, taghenti supra xari
  antiki komu diamanti supra diamanti. Apressu a iddu, ponti saracinu di Cintorbi
  latu Adirn\u00f2, kaskateddi di akua asummanu biddizza a biddizza e a vista godi
  di natura e arti miskati na un postu unni arkiukuja eni tistimunianza di storia
  antika di populi forti e njgnusi.\\nKuntrati preni di umura tirragni dunanu frutti
  sapurusi e xauru di suli e di celu.\\nI sakki di munizza sparnizzati ntornu a iddu
  ponti parunu xuri e i kani rannaj, dixinnenti d\u00ee guardiani di sikuli templi,
  sacirdoti a passiu.\\n-11-\\nNun avissi mai pinsatu di putiri essiri karruzziatu
  sutta terra dintra na komuda makina sfriccanti, viloci, supra larghi strati n\u2019menzu
  a un traffiku di mezi pisanti rigulamintatu di tabidduna stratali e simafura.\\nEpuru,
  a Raffu di Pitralia Suprana, succedi propriu kistu a ku visita a pirrera di sali,
  prufunna novi piani, tra nkroci di strati addumati di lampadini ka akuluranu di
  ghaccu i mura d\u00ee gaddir\u00ee.\\nRuspi arajati sganganu i murati e karikanu
  u matiriali n\u00ea kamiuna pi farilu purtari n\u2019supirfici. Ogni tantu, korki
  upuraiu trova nu \u201cochu di sali\u201d e, lestu, su metti n\u2019sakketta pi
  rigalarilu a pirsuna kara du \u201cmunnu di supra\u201d.\\nL\u2019aria eni strana:
  sikka. Mi pighu na petra e m\u00e2 sarbu. Ankora oj, komu na sponsa a kumannu, cedi
  akua di nvernu e si l\u2019asorbi n\u00e2 staxunata.\\n-12-\\nKuannu fu ka mi truvai
  n\u00e2 zona d\u00ee Makalubi mi parsi di essiri na nautra pianeta, e mi potti pighari
  di kuraju sulamenti kuannu, spaziannu ntornu ku l\u2019ochi, vitti ristucceri e
  arvuli vicinu a kasuzzi spersi terri-terri.\\nKu tuttu kistu, turnannu a taliari
  \u201cdda kosa\u201d unni mi avianu purtatu i pedi e a kusirit\u00e0 ka mi avia
  dirivatu di nu risukuntu di viaju, mi ntisi u stissu komu atinaghatu di gravi pirikulu.\\nN\u2019menzu
  a na kalura di moriri abruxatu, na distisa komu di ciniri nkuddata, kuluri azolu
  charu e griju o griju-viola, vinia ogni tantu spirtusata di fangu likuitu amuttatu
  d\u00ee gasi ka di notti, mi dissiru ap\u00f2, si vidi addumari \u00f4 kuntattu
  ku l\u2019aria dannu loku a lijenni di spirdi e fantasimi.\\nStu vomitu da terra
  nun eni autru ka krita di purissima kualit\u00e0 ka d\u00ee suttastanti strati alakati
  achana skuaghata pi dda pikka avutizza nicissaria a furmari koni e kuniceddi vurkanici
  friddi, facennu nu skruxu komu kuannu vughissi na pignata china di pumadoru skaccatu.\\nN\u00e2
  skarpatedda di un kuniceddu, na tizzunita avia ristatu mpiduta a prucediri e a krita
  si ci avia sukatu tutta l\u2019akua, ntiramenti disidratannula.\\nVulia iri a vidiri
  nautra analuga manifistazioni vicinu \u00f4 nuovo kampu spurtivu di Kartanissetta,
  ma nun a rinix\u00ee a truvari.\\n-13-\\nKapitau, na vota, ka, truvannumi spersu
  muntagni-muntagni n\u00e2 zona di Karunia a cirkari a kuntrata unni si urijnau middi
  e passa anni fa u me kugnomu, dopu aviri atravirsatu vaddi e timpi, timpi e vaddi,
  arivassi na un chanoru di arvuli unni mpruvisamenti si afaccau un tepidu suli.\\nMi
  firmai, attentu, e stetti. Nun c\u2019era u minimu rumuri. Ap\u00f2, na ddu silenziu
  tutali, ntisi na strana vuci, komu di picciriddi ka iukavanu tra iddi skirzannu
  e ridennu a passiddu. Mi ntisi chamatu: Ful\u00ee, Ful\u00ee, Ful\u00ee\u2026Iu
  ivi versu u puntu dunni vinia stu sonu, e kap\u00ee ka na cersa mi stava \u201cparrannu\u201d,
  na cersa morta a l\u2019additta.\\nVeru miravighatu, dopu ka mi avicinai nsinu a
  kapiri ka i vuci vinianu du so ventri, nsinu a kapiri ka stu arvulu sikku mi stava
  parrannu pi dirimi ka era kiddu u loku d\u00ee me antinati, l\u2019avrazzai e mi
  misi a chanciri lakrimi di joia.\\nFu tannu ka iddu si zittiu, fu tannu ka kap\u00ee
  ka avia divintatu kasa di aceddi e armaluzzi, fu tannu ka a negha turnau pi skurari
  u suli.\\nPassau un vuiaru e mi detti kunferma: kiddu era u kori du eksi feudu Pruf\u00e8tina.\\n-14-\\nSar\u00e0
  pa nostra natura di armala skantulini, sujetti a duvirini prutejri pi dibulizza
  fisika di autri armala chu forti, ma eni ka kuannu trasu na na grutta mi sentu komu
  dintra u ventri di me matri. Speci kuannu saccu ka kista n\u00ea tempi passati \u00e0
  statu abitata di arimita, di santi, di primitivi.\\nE alura, ogni skagha di petra
  mi pari ka avissi statu un pizzuddu di attrezzu di l\u2019arimita (komu n\u00f4
  kasu da grutta di Diegu di Sinagra) o ka macha di virnici fussi na majni mirakulusa
  (komu n\u00f4 kasu da grutta di San Fulippu di Ajra) o ka a ogni fissura kurispunnissi
  un signu arfabetiku o un grafitu di antiki kurturi (komu n\u00f4 kasu da grutta
  da Rijna di Palermu).\\nVisitari grutti, skavati o kustruiti, divintau a me passioni
  e a me passiuni, kurr\u00ee midemma kuannu na kidda ditta d\u00ee Cauli di S. Ancilu
  Muxaru si afaccau a majni di patri Piu kumposta du lippu krixutu na na nuttata a
  forma di kapiddi, d\u00ee supracigha, di varba, ecc., du famusu kappuccinu di Pitrarcina.\\nMa
  chu granni amuzioni mi pigha kuannu si sapi o si vidi ka sti \u201cgrutti\u201d
  furu midema tombi di jenti antika di mighara di anni e ka, alivoti, ddu pruvulazzu
  ka si skarpisa po essiri kiddu ka resta di iddi.\\n-15-\\nKuannu pensu ka c\u2019eni
  jenti (midema siciliana) kunvinta ka n\u2019Sicilia tuttu eni bruxatu du suli e
  ka i terri sunu sulamenti ristucceri o pratir\u00ee, mi venunu n\u2019menti ddi
  vaddi chini di arvuli urijnar\u00ee e di spechi di akua pirenni ka si trovanu pi
  dicini e dicini di kilomitri n\u00ea dursali d\u00ee muntagni e, kka e dda, na tanti
  chani e vadduna e a banna di marina.\\nKuantu voskira, kuantu furesti, kuanta friskura,
  kuantu pr\u00eeu pi maskuli e fimmini, vechi e piciriddi ka n\u2019korki modu skoprinu
  sti padarisa e i frikuentanu pi skampagnati e passiati, pi kociri karni o fari funci
  o sparaci, pi pighari akua di surgenti o cirkari krastuna.\\nEni n\u00f4 kuntrastu
  ka si avi modu di aprizzari meghu a biddizza du jallu ka akulura i kampagni kurtivati
  a lavuri n\u00ea timpi di l\u2019intraterra sicilianu, unni si pruduci frumentu
  duru di supiriuri kualit\u00e0 e aina e oriu pi vest\u00ee e armala, unni machi
  di virdi sunu sulamenti kiddi spinusi d\u00ee pali di fikudinnia, unni arvuli sulitari
  di aliva o di aukalittu, di karruba o fastuka o minnulera, parinu fatti di prastika
  e misi dda pi ngannari korki acidduzzu spirdutu.\\n-16-\\nMi dumannu komu un kristianu
  potti skurpiri tanti petri e tanti arvuli, senza kampari ducentanni, senza aviri
  aiutanti, senza strumenti e attrizzaturi muderni.\\nEpuru, ku tuttu ka napoku spireru,
  si parra di cintinara e cintinara, appi modo di vidiri mighara di testi, ognuna
  ku na sprissioni diffirenti, ncimintati komu tanti brighi a limitari d\u00ee stratuzza
  ka partennu da trasuta achananu a skursuni nsinu \u00ea grutti unni midema i spurjenzi
  sunu skurpiti a raprisintari facci supra facci. Ma a forma di testi (ku una e chu
  facci) sunu skurpiti rokki e pitruzzi d\u00ee vari chanora e radiki fori terra di
  arvuli di aliva e di autri spec\u00ee.\\nCertu, kapixu ka u Kumuni di Xakka i vosi
  sarvaguardari aliniannuli e pusiziunannuli n\u2019manera fissa kuannu fu ka dicidiu
  di fari un parku d\u00ee miravighi du tirrenu unni stava di kasa stu artista spuntaniu,
  ma di sikuru avia a essiri nautra kosa kuannu tutti sti testi si truvavanu dda unni
  Bintivegna i \u00eea a-manu-a-manu skurpennu, n\u00f4 postu unni i truvava o unni
  u so ciriveddu ci sujria di irili mittennu, senza jumitria studiata, ittati kka
  e dda n\u2019modu ka \u00e2 so morti i postiri l\u2019avissiru duvutu atruvari komu
  na skuperta, komu na kacca \u00f4 tisoru.\\nTannu, persi u trenu pi un pilu e nun
  potti viviri sta amuzioni. Ci ivi ka era oramai troppu tardu.\\n-17-\\nKuantu skaluna
  achanaru fighi di mamma disgraziati e kuantu skaluna xinneru fighi di mamma sfurtunati:
  nfilici i primi e i sikunni, turki e siciliani, nfilici Sikuliana ka appi sta skala
  naturali unni si kunnuceru i pirati di mari n\u2019terra pi rubari pruvisti e juvint\u00f9.\\nSkaluna
  ianki komu palumma, vagnati di akua salata e di lakrimi ka u tempu nun po azzumpari.\\nSkaluna
  ka rikordanu ankora a parrata d\u00ee kritisi di re Minossi, di kuannu vinni a truvari
  u so kulega sicilianu Kokalu n\u00f4 regnu sikanu tra Eraklea, Muxaru e Xirtea-Kristia.\\nSkaluna
  ka kunsentunu iokira fistusi di piccotti fukusi ka i usanu pi fari provi di forza,
  sia a xinniri k\u2019achanari, e adimustrari \u00ea fimmini da kumpagnia kuantu
  sunu forti e viloci, bravi e kurajusi.\\nDdoku c\u2019eni a prova di komu po, na
  opira d\u2019arti da Natura, essiri kosa binefika o dannifika n\u2019basi a komu
  si usa.\\n-18-\\nSulamenti a kunsapivulizza ka prima di mia ci avianu trasutu mighara
  e mighara di kristiani mi detti animu pi kuntinuari a kaminari a straxikuni na ddu
  vudeddu skavatu n\u00e2 rokka ka kunnuci \u00e2 grutta unni Rusalia Sinibaldi stetti,
  luntanu d\u00ee vizi tirreni, akuchannu ddi meriti ka l\u2019avissiru fattu, ap\u00f2,
  prukramari Santa.\\nParrannu di sta grutta ka si trova tra Santu Stefanu da Kuiskuina
  e Bivona, mi pari justu pricisari ka eni fora du paisi, kumprisa na l\u2019ambitu
  di un munasteru ku tantu di chesa, \u00ea marjni di un vosku beddu komu ci ni sunu
  pikkaredda, e mi parsi kuasi un pikkatu ka dda bedda grutta eni, n\u2019pratika,
  prijunera di na granni struttura kunvintuali.\\nTurnannu a diri da sinsazioni di
  pirikulu ka mi pighau truvannumi n\u00f4 vudeddu skavatu na rokka, kuannu j\u00e0
  mi parsi di essiri mpussibilitatu a turnari narreri, mi truvai n\u00f4 slargu unni
  stava Rusalia (oj raprisintata di na statua di marmu) e dda, finarmenti putennumi
  jrari, pighai kuraju dopu u skunfortu e, lemmi-lemmi, potti nexiri \u00f4 skupertu
  turnannu \u00f4 puntu di partenza (un kurridoiu di kunventu).\\n-19-\\nNun c\u2019eni
  pijori kosa di vidiri na funtana sikka. Mi kapitau iennu \u00f4 me paisi unni, dopu
  tanti anni, vulia avicinarimi \u00ea lokura da me nfanzia.\\nTra i kosi ka \u00ee
  a taliari ivi midema na na kuntrata ditta \u201cVukali\u201d unni l\u2019akua surjiva
  kurria a fruxu di napoku di kannola prima di nkanalarisi na un vadduneddu ka taghava
  kampi kurtivati a ortura e iardina.\\n\u00d4 postu di na abiviratura di pitrazza
  ntaghata ku lavaturi unni sgiccavanu kannola di ferru antiku ka nixevanu da murata
  di rokka, c\u2019eni na vaska mpurtanti suvrastata di rubinetti di uttuni mbiddittati.\\nI
  grutti, ka \u00ea so spaddi guccavanu akua di tanti pinnakuliddi karkar\u00ee ka
  s\u2019avianu furmatu n\u00f4 suffittu, avianu statu \u201cpuliziati\u201d e addumate,
  e nun c\u2019eranu chu ummiri mistiriusi e i pavimenti eranu nchanati.\\nE u chanu,
  prima chinu di centuruppa, di lippu e di middi autri erbi, ora eni nudu, nudu e
  axuttu, sikku, sikku komu a funtana du \u201cVukali\u201d.\\nKi dilusioni, nun resta
  autru di fari ka kancarici nomu.\\n-20-\\nU paisi di Prizzi era disertu di jenti
  kaminalora ma iu kaminava u stissu kunfurtatu na ddi stratuzzi pik\u00ec vidia jntuzzi
  assittati a chachariari n\u00ea kurtighi o fermi davanti a porta di kasa o afaccati
  \u00ea finestri.\\nMi miravighau assai kuannu kap\u00ee ka tutti ddi kristiani ka
  parianu di karni e ossa eranu nveci fatti di kulura amiskati di un bravu pitturi,
  e ka ddi porti e finestri, ddi stissi kasi, manku asistevanu pi nenti essennu midema
  opira di artisti ka utilizavanu i murati nudi d\u00ee kasi \u201cveri\u201d.\\nE
  ddoku mi parsi afrijusu e kuasi-kuasi spavintevuli, sapiri ka ddi maskuli e fimmini,
  ddi picciriddi e armala, nun eranu autru ka ummiri. Skarapochi nkapaci di dari na
  nfurmazioni, di stenniri na manu, pi nsinu di vidiri ka iu passava di ddi parti.\\nMi
  ni ivi ku nu skunfortu n\u00f4 kori peju di komu siddu avissi statu na un cimiteru
  disertu, n\u2019menzu a spirdi e rikordi luntani.\\nPensu sinciramenti ka i kuatri
  anu a stari apizzati n\u00ea musei e ka i paisi anu a essiri pupulati di jenti \u201cviva\u201d,
  nonsi di omini muti e nkapaci di difennisi e difenniri di priputenzi e mali-parti.\\n-21-\\nAtuppai
  a Paluzzu Adrianu na na vecha gaddiria firruviaria oramai dimisa unni, pi kuncissioni
  du Statu, un privatu avia attivatu na kurtivazioni di funci.\\nKaminari dda dintra,
  n\u2019menzu a un xauru di suttavosku komu dopu ka na famigha di porci sarvaj \u00e0
  skafuliatu a terra, duna un sensu di virtijni midema pi l\u2019umidit\u00e0 mantinuta
  a liveddi akus\u00ec auti di livari u rispiru.\\nI funci eranu addivati n\u2019kaxitteddi
  di prastika unni a terra, j\u00e0 nsiminata, vinia vagnata ogni tanti uri ku un
  fruxu di akua a nevula ka mp\u00eegati sulerti pruvidevanu a raziunari.\\nI kaxitteddi,
  a diversi piani sia a manka ka a dritta, kuntinevanu a kurtura n\u00ea diffirenti
  fasi a-manu-a-manu ka si \u00eea avanzannu sutta terra pi cintinara e cintinara
  di metri: ci n\u2019eranu ku terra nuda, ku miceti appena naxuti, ku funci niki,
  ku funci med\u00ee e ku funci pronti pi essiri rikughuti.\\nE ap\u00f2 c\u2019era
  u ripartu unni si mittia a terra j\u00e0 usata e kiddu unni si mittia a terra di
  utilizari pa prossima kurtivazioni. Dda iurnata mi saziai di funci sulu a taliarili
  ku l\u2019ochi.\\n-22-\\nSupra Frazzan\u00f2 c\u2019eni un munasteru abannunatu
  dittu S. Filippu di Fragal\u00e0. U vosi iri a visitari pik\u00ec avia ntisu diri
  di iddu, p\u00ee tempi antiki, granni kosi.\\nPari ka avissi avutu un putiri immensu,
  dicini e dicini di monaci e frati, renniti e cespiti di ogni jeniri, kuntatti mpurtanti
  k\u00fb Regnu e ku Stituzioni di oltri mari, mighara di pirsuni n\u2019korki modu
  ligati.\\nOj, n\u2019veci, n\u2019menzu a l\u2019abannunu tutali, tra surci, piddottuli
  e tetti kaduti supra skaffalaturi di libra e rijstri, nun appi manku u spinnu di
  pinsari \u00ea spirdi di abati e priura, di santi e pinitenti, ne \u00e2 mimoria
  di iddi.\\nFu ddoku ka, skunsulatu, e pinsannu a kuantu nsignifikanti e timpurali
  eni u putiri di l\u2019omini, dicisi di turnari supra i me passi e di lassari, pi
  sempri, ddu loku.\\n-23-\\nMai kuntrastu fu chu forti n\u00e2 rikustruzioni di un
  centru abitatu.\\nJbiddina \u201cvecha\u201d aristau un munzeddu di macer\u00ee
  abannunati a akua e ventu, a suli e jelu, abitata di vurpi e surci, di skursuna
  e di middi autri armala e armaluzzi ka manku ci pari veru di aviri na cit\u00e0
  tutta pi iddi, di putiri trasiri e nexiri d\u00ee ches\u00ee e d\u00ee kasi e achanari
  a krapiccu i skalunati du palazzu municipali o afaccarisi \u00f4 barkuni du baruni.\\nNa
  nautra parti, a distanza, i jbiddisi si nsidiaru na napoku di kasi fatti a kaxa,
  prima di lanna, ap\u00f2 di muratura, cirkunnati di munumenti ka pikka anu di miditirraniu
  e pinsinu di tirrestri.\\nVeru eni kuannu si dici ka pari un museu, stu paisi, ma
  nun si dici ka nun pari un paisi (sicilianu, voghu diri).\\nE, ntantu, na \u201cgranni\u201d
  opira kadiu manku u tempu di grapila: a chesa a forma di badda.\\n-24-\\nKi kosa
  bedda! Puru ka chuvia o faca friddu o kavudu o c\u2019era negha o ventu o un suli
  ka spakkava i petri, unu si putia u stissu godiri na passiata ku l\u2019amici, tra
  na assittata e nautra a un tavulinu di kaf\u00e8, senza vagnarisi o nfridulirisi,
  o sudari o pigharisi di umidit\u00e0 na l\u2019ossa, o skumpigharisi i kapiddi o
  aturrarisi u ciriveddu.\\nKistu putia sucediri grazi \u00f4 fattu ka a Kartajruni
  u Kumuni avia pinsatu di kustruiri na granni gaddiria pa mostra pirmanenti da ciramika
  lukali, spaziusa e lastrikata di marmu, ku tantu di vitrini n\u00ea murati latirali
  e un kaf\u00e8 ku pasticciria e sirviziu ijeniku.\\nKuanta jenti, pi korki mutivu
  stanka di stari a l\u2019additta n\u00f4 chanu du Municipiu, truvava e trova rifrijeriu
  e riposu n\u00e2 tantu uspitali e kunfurtevuli \u201cchazza kuperta\u201d. Kuantu
  piccotti, askutannu a musika du juboksi, prima e dopu da skola s\u2019assittava
  e s\u2019assetta \u00ea tavulina du kaf\u00e8, sutta l\u2019ochi vijli di tanti
  pirsunaj illustri raprisintati n\u00ea rikuatri n\u2019ciramika du suttatettu, pi
  kummintari a iurnata o fari prukrammi pu futuru o, simpricimenti, pi chachariari
  du chu e du menu.\\n-25-\\nPo na fridda balata di marmu sustituirisi a un pedi di
  nuci amatu n\u2019vita n\u00ea mumenti chu intimi di joia e di dispirazioni, di
  kummuzioni e di rilaksi?\\nPo un frastuonu di na strata transitata di Rakarmutu
  e u parraciniu d\u00ee jenti paragunarisi \u00f4 silenziu di na kampagna unni u
  sulu rumuri eni u chachariu di aceddi, api e cikali?\\nPo un visitaturi na un cimintifikatu
  kampusantu kuncintrarisi supra i pubremi asistinziali, supra a grannizza di nu spiritu
  e a nichizza di l\u2019omini, \u00e2 stissa manera di komu fussi a l\u2019ummira
  di nu arvulu?\\nAlivoti Xaxa pinsava a tutti sti kosi kuannu dica ka ci avissi piacutu
  di essiri adivukatu sutta u pedi di nuci du so puderi unni era usu pinnikuliari,
  riciviri amici di littri, di nfanzia e kampagnoli, riflettiri.\\nAlivoti Xaxa pinsava
  a Piranneddu, ka riposa sutta un pedi di pinu ka divintau, pi kistu, loku di kunvirjenza
  di ntillittuali e turisti, di kuriusi e karusi di skola, loku di kurtura.\\n-26-\\nSiddu
  Guttusu s\u2019avissi pututu pittari, di mortu, a so tomba, avissi pinsatu a un
  balatuni a moddu a un fussatu n\u2019menzu a un parku disabitatu?\\nCertu Manz\u00f9
  fici du so meghu, e granni fu a pinsata, ma simu sikuri ka Guttusu nun avissi, chuttostu,
  studiatu korki kosa a kuluri, n\u2019menzu a jenti fistusa e vucazziu di picciriddi?
  Stannu a l\u2019omu iu pinsai,\\nvisitannu unni fu adivukatu, ka bonu iddu avissi
  statu na na vucciria di vuci pupulari, di fimmini kumari, di dialettu strittu n\u2019menzu
  a xaurusi frutti e xuruti erbi, a lapuna e parpaghuna, a maranzani e jummi di kavaddi
  bardati.\\nU so padarisu, alivoti, eni akus\u00ec. E u padarisu nun sta n\u2019terra,
  n\u00f4 palazzu Kattolika da B\u00e2ria.\\nE ap\u00f2, si sapi, kuantu prima stu
  parku eksi-patriziu veni puliziatu, abiddutu, graputu \u00f4 pukriku gudimentu,
  e i turisti, a frotta, ntornu a iddu, parrannu tidesku e francisi, spagnolu e ngrisi,
  russu e cinisi, tutti, piccotti e anziani, vistuti a kuluri, jallu, azolu, russu,
  virdi, komu frutti e xuri, lapuna e parpaghuna, komu i kuatri du pitturi.\\n-27-\\nKuantu
  kosi rutti, a ddi pedi-pedi. Eni pinsinu mpussibili putiri kaminari senza duviri
  skarpisari skaghi di bummula e kanali, di piatta e di lanterni, pisa di tularu di
  rakamu, petri ntaghati e\u2026 storia.\\nEni na cit\u00e0 senza nomu certu, ma certu
  era granni. U tistimonianu i muraghuna di difisa e i pirimitra d\u00ee kasi, u tistimonia
  l\u2019aria ka si rispira, u silenziu ka c\u2019eni e, n\u00f4 silenziu, ddi rumuricedda
  ka nun si kapixi dunni venunu ma ka sunu na kustanti na tutti i zoni arkiulojci
  unni ankora nun s\u2019\u00e0 prucidutu a ricerki ufficiali.\\nPulizzeddu di Ganci
  komu ddi antiki cit\u00e0 pri-palummiani du sud-Amerika, e di kiddi pri-britannici
  du stremu urienti, spersi muntagni-muntagni o n\u2019menzu a na jungla mpinitrabili.\\nPulizzeddu,
  komu middi e middi lokura spersi n\u00ea kampagni siciliani.\\n-28-\\nJ\u00e0 u
  nomu stissu grapi a porta da fantasia. Siddu ap\u00f2 si veni a sapiri ka na tuttu
  u munnu ci ni sunu sulu na tr\u00eena, a kosa kuminca a sapiri di mistiriusu. A
  kistu si iunci ka prisenta tracci di oru e autri elimenti ka nun putissi aviri e
  trasimu kuasi-kuasi n\u00e2 fantaxenza. A petra di Salamuni eni tuttu kistu.\\nMa
  nautra strana prisenza di petra c\u2019eni \u00f4 Palazzu Adrianu: a Rokka du Saracinu.
  Ddoku, miravigha d\u00ee miravigha, si vidi ka na skalidda ntaghata fa achanari
  nsinu a n\u2019cima a na turri naturali, a certi banni skavata k\u00fb skopu di
  pighari akua chuvana, a autri banni iuncuta tra di idda stissa ku muricedda di petra
  a sikku. Si pensa appi a essiri pustazioni di guardia.\\n-29-\\nEni un vosku famusu,
  e c\u2019eni un purpitu, un purpitu di petra. Vonu diri ka Firdinannu di Burbuni,
  avanti di divintari primu d\u00ee dui Sicil\u00ee, kuannu era ankora forti a pussibilit\u00e0
  ka Napuliuni nun u facissi chu turnari a Napuli, ku tantu di fucili paratu si ni
  stassi k\u00ee so dignitari asittatu supra sta speci di tronu pi sparari, di tantu-n-tantu,
  \u00e2 sirvajna ka, pi kasu o pik\u00ec ca purtavanu, ci vinia a tiru.\\nOra, ka
  finiu a stissa idea di munarkia, u purpitu du Re eni n\u2019maniu di tutti e veni
  skifiatu di ncisioni e di skarapochi, e u sidili va kadennu a pezzi, e u stissu
  vosku da Fikuzza, nun avennu chu dda prup\u00eet\u00e0 forti e rikanuxuta, eni sujettu
  a malutrattamentu di parti di l\u2019addivatura ka ci karikanu chu armala di kuantu
  ni putissi arbirgari.\\n-30-\\nEni afrijusu vidiri abiviratura mbiddittati di ristauru
  frisku e senza chu armala a saziarisi a siti, senza chu ddu xauru di pixu e di kakati
  amiskati di xekki e di pekuri, di vakki e di krapi, e senza chu ddu xauru di erva
  taghata friska o di fenu, senza ddu abaiari di kani, senza prisenza di omu.\\nA
  Varguarnera di Partiniku sulu korki acidduzzu ngarziddutu friska \u00e2 kumpagna
  n\u2019attisa e korki lacertula ritardataria fuia versu a sulichata pi karikarisi
  i battir\u00ee e putiri prukurarisi di mancari.\\nNa vota, mi rikordu, mentri niku
  \u00eea ciddiannu n\u00ea vaddi tra u paisi di San Fulippu, u chanu da K\u00fbrti
  e Sant\u2019A, mi firmai a biviri n\u00f4 kannolu di na abiviratura senza abadari
  ka kistu piskava na nautra abiviratura chu avuta di artizza ka midema piskava na
  nautra ankora chu avuta e tutti nkugnati, a skaluni: n\u2019pratika, a kalari a
  kalari, p\u00ee vest\u00ee, p\u00ee vakki, pi pekuri.\\nKu tuttu kistu nun pighai
  nuddu malannu.\\n-31-\\nUn iornu, n\u2019menzu a na kampagna tipikamenti siciliana,
  visti kosi di l\u2019autru munnu: labirinta cirkulari, kavaddi di ferru, unni di
  cimentu, murati avuti nsinu \u00f4 celu e chini di pirtusa, finestri senza kasa,
  varki lucenti konu l\u2019oru, iazzi supra l\u2019akua, e autri kosi nniskrivibili
  komu putissiru essiri traversi di binari misi a l\u2019additta o ciramiki cimintati
  supra na bankina, o kasermi di karabinera a kulura di Arlikkinu, acc. acc.\\nE tutti
  sti kosi komu xumara d\u2019arti, abannunati, a kasu, senza ordini aparenti, kuasi
  ka avissiru kadutu du celu, n\u2019terra, pi fari miravighari l\u2019omini.\\nTanta
  fantasia fu fruttu di centu artisti e di un sulu ciriveddu, kiddu di nu mprinnituri
  ka vosi akus\u00ec karattirizari u so tempu e a so asistenza.\\nArti sulu pi fari
  arti, komu sfida \u00ea tradizioni kanonici, komu skummissa di libirt\u00e0\u2026
  partennu du Kasteddu di Tusa e iennu pi Santu Stefanu, Pittineu, R\u00eetanu, Tusa,
  Kasteddu di Luciu, Motta d\u2019Affermu, Mistretta e, nuovamenti, kalari a mari.\\n-32-\\nTaliari
  a miridiuni da marina di Sirakusa e pinsari ka ddabanna \u00f4 mari c\u2019eni na
  isula filici, a nuatri siciliani, ka sta isula aduttammu, fa na certa mprissioni.\\nOj
  a sintimu tantu strania e luntana kuantu eni kunsanguinia e vicina: kurpa da pulitika,
  kurpa da storia. Di dda storia ka vosi a matripatria asujttata e u so arcipelaku
  chu pristijusu libiru, o kuasi, e a idda supiriuri n\u2019dignit\u00e0 e urgoghu.\\nMa
  ki ni vali. A radika linguistika nun tradixi e ni iunci, a storia kumuni eni kanuxuta,
  a civilit\u00e0 miditirrania ni fa frati e soru k\u00ee so munumenti antiki, k\u00ee
  so grutti pr\u00eestorici.\\nK\u00fb sapi siddu midema di dda parti c\u2019eni korki
  martisi ka fa i me stissi rifrissioni. K\u00fb sapi siddu i turisti struiti ka skarpisanu
  i strati midiuvali di Rabati o ka visitanu a citadi di Zebbugi sentunu na l\u2019aria
  a prisenza da kurtura siciliana.\\nMa ki ni vali, a Storia fici oramai a so strata.\\n-33-\\nEni
  un xumi niku-niku, manku un xumi, pir\u00f2 avi na granni purtata di akua. Kosa
  kuriusa: naxi di suttaterra e, unni naxi, forma un laku ka eni frikuintatissimu
  di tanti spec\u00ee di aceddi e di chanti ma, supratuttu, di papiru e di kanni.\\nNa
  vota era kridenza ka u papiru era jenti nkantata e ka u so karattiristiku cuffu
  nun era autru ka kapiddi e ka taghannulu \u00e2 basi avissi suffrutu e ittatu sangu.
  Eni na chanta tipika du Nilu e u fattu ka si trova n\u2019Sicilia \u00e0 datu loku
  a tanti lijenni.\\nA virit\u00e0 eni ka l\u2019ambienti unni krixi pari majku pik\u00ec
  ditermina effetti di nkantu, di padarisu tirrestri, e u Cani, ddu kursu di akua
  niku-niku, pari ka fussi granni, granni-granni.\\n-34-\\nAp\u00f2, dopu tantu pirigrinari
  pu tavulatu ibleu, tra muricedda di pitrami a sikku ka u taghanu di kka e di dda
  disignannuci miravighusi jumitr\u00ee, xinnennu i turnanti ka di Kalafurnu da Gurfa
  kunnucinu \u00e2 iankunusa cit\u00e0 di Jsuardu, viu a ogni kurva di strata, komu
  fussiru guardiani armati di pustazioni militari, karrubi sulitari o n\u2019kumpagnia
  sparpaghari ligumi duciastri a omini e armala mentri kidda ka eni ora a diserta
  chana di Maghokku, unni tempu narreri si tammuriava di guerra, aspetta pacinziusa
  di turnari fistusa a Komisu e \u00e2 Sicilia.\\nChusura\\nOj staiu n\u2019Palermu,
  unni travaghu. Cit\u00e0 ka di antika kapitali mpiriali, riali e vici-riali si vitti
  ariduciri a cit\u00e0 di pruvinca, prima sutta Napoli, ap\u00f2 sutta Turinu, Firenzi
  e Roma, e midema, ora, nkatinata n\u00ea lij ka si fanu a Brusellisi.\\nOj, komu
  kapuloku rijunali, chanci vidennu a Sicilia, urtima apinnici di l\u2019Auropa, senza
  chu ddi beddi ponti afru-asiatici ka n\u00f4 passatu kunsintianu di kummircari rikkizza.\\nEni
  propiu na l\u2019agunia di sta Palermu, kapitali di mala puru di nun cediri u xettru
  di \u201cgranni\u201d, unni si rikanuxi a perdita di idintit\u00e0 di un populu
  sanu ka nun voli adattarisi a l\u2019idea di aviri persu u so \u201curgoghu di essiri\u201d.
  Pi kistu kka tanta jenti si sfoga sudisfacennu amimaliskamenti i primitivi bisogni
  limintari: i so sensi di sprijunanu n\u00f4 biviri e n\u00f4 mancari, n\u00f4 parrari
  e na l\u2019amurijari, ku spuntan\u00eetadi e naturali disinvurtura.\\nOra no chu,
  Palermu eni veru pulita, ma anni fa a cit\u00e0 si po diri ka avia atruvatu u justu
  akuilibriu tra lurdia e ijeni: strati-strati c\u2019era ddu tantu di purkaria pi
  nun fari sentiri asettici i pirsuni e ddu tantu di disatinzioni n\u00f4 ittari kartuzzi
  e skamuzzuna di farili sentiri chu naturali e libiri.\\nSia charu, kisti kosi na
  na sucit\u00e0 civili sunu difetta, ma u fattu eni ka pi korki mutivazioni jnetika
  \u00f4 \u201csicilianu tipu\u201d ci piaci di kuntraveniri \u00ea rekuli, ma sulu
  kuannu si trova n\u2019Sicilia, mentri ni eni nu skrupulusu usirvanti kuannu si
  senti ospiti di autri pupulazioni.\\nNa sta cit\u00e0, epuru, eni ankora pussibili
  atravirsarini na longa parti, pi autru karattirizata di viali unni u traffiku autumubilistiku
  mpirversa, senza essiri tukkati di smogi o rumura. Mi kapita kuannu da me kasa,
  vicinu a strata da Libirt\u00e0, iuncu a pedi \u00e2 l\u2019Assissuratu di l\u2019Agrikurtura
  e Furesti \u00f4 stratuni da Rijoni Siciliana komu siddu passiassi p\u00ee viuzzi
  di un paisi e pi kamp\u00ee; l\u2019itinirariu di strata e chani ka fazzu: Duminiku
  Di Marku \u2013 Sinuni Kucca \u2013 P\u00eemunti \u2013 Unit\u00e0 d\u2019Italia
  (vidda Spirlinga) \u2013 Skadutu \u2013 Justi \u2013 U lakunu \u2013 Cisareu \u2013
  Mureddu (San Mikeli) \u2013 Markisi \u2013 Xuti \u2013 Rapisardi \u2013 Pikuraru
  \u2013 SS.FF. Nutarbartulu \u2013 Finucharu Aprili \u2013 Puccini \u2013 Z\u00eenu
  \u2013 da Kruci (trazzera privata) \u2013 Jottu \u2013 Munteri \u2013 Liunardu di
  Vinci.\\nKista eni Palermu, komu tutta a Sicilia e komu tutti i so skoghi, terra
  di forti kuntrasti.\"", "\"Giasuni (mitulugg\u00eca)\\nGiasuni \u00e8 na fiura d\u00e2
  mitulugg\u00eca greca, canusciutu macari comu Easun nt\u00e2 mitulugg\u00eca etrusca.
  Era lu figghiu di Esoni, re di Iolcu, ''n Tessaglia. Quannu Esoni fu livatu d\u00fb
  tronu di s\u00f2 fratastru Pelia, Giasuni vinni affidatu \u00f4 cint\u00e0uru Chironi,
  ca lu crisc\u00ecu. Quannu addivint\u00e0u granni, Giasuni si nn\u2019arriturn\u00e0u
  a Iolcu pri ripigghi\u00e0risi lu s\u00f2 regnu. Pelia s\u2019addichiar\u00e0u prontu
  a lass\u00e0ricci la curona, ma c\u00e2 cunnizzioni ca lu picciottu issi a circari
  lu veddu d\u2019oru: Pelia pinzava ca Giasuni non ci l\u2019avissi fattu nta ssa
  mprisa, ma, mmeci, lu carusu non si tir\u00e0u arredi e, cu nu gruppu d\u2019eroi
  vinuti d\u2019ogni cuntrata d\u00e2 Grecia, si nni ivu pri mari a bordu di la navi
  Argu.\\nDoppu nu longu viaggiu chinu d\u2019avvituri, l\u2019argun\u00e0uti agghicaru
  nti la Colchidi, lu paisi unni lu re Eete av\u00eca sarvatu lu veddu d\u2019oru.
  Eete s\u2019addichiar\u00e0u dispun\u00ecbbili a dariccillu, ma sulu siddu Giasuni
  avissi vinciutu dui tori ca ciusci\u00e0vanu focu e av\u00ecanu zocculi di bronzu,
  e siddu avissi macari arrinisciutu a siminari li denti d\u00fb dracu ca Cadmu, funnaturi
  di Tebi, av\u00eca ammazzatu tantu tempu apprima.\\nQuannu di li denti d\u00fb dracu
  nasceru \u00f2mini armati ca attaccaru a Giasuni, la dia Era ntirvin\u00ecu spingennu
  Medea, la figgghi d\u00fb re, a nnamur\u00e0risi d\u2019iddu. Medea, cu li s\u00f2
  arti m\u00e0ggichi, ci detti aiutu pri v\u00ecnciri nta la mprisa e p\u2019arrubbari
  lu veddu, facennu na magar\u00eca \u00f4 dracu ca lu custudiva e ca non durmiva
  mai. Pri ringrazi\u00e0rila, Giasuni cci prumitt\u00ecu ca l\u2019avissi amata pri
  sempri e ca s\u2019av\u00ecssiru maritati quannu, agghicati nt\u00e2 Grecia, f\u00f9ssiru
  stati \u00f4 sicuru.\\nQuannu arrivau ''n Grecia, Giasuni eppi la nut\u00eczzia
  ca s\u00f2 patri s\u2019av\u00eca ammazzatu, custringiutu di Pelia, mentri ca s\u00f2
  matri av\u00eca murutu p\u00e2 c\u00f2lira. Allura Giasuni addumannau a Medea d\u2019aiut\u00e0rilu
  a d\u00e0ricci la giusta punizzioni a Pelia: nzemi, cu nu ngannu, pirsu\u00e0siru
  li figghi f\u00ecmmini di Pelea a ammazz\u00e0rilu.\\nAppoi si nni ieru a Corintu
  unni \u00e8ppiru dui figghi; passau tempu e Giasuni ripudiau a Medea e si maritau
  c\u00e2 figghia d\u00f4 re di Corintu; Medea, ch\u00ea s\u00f2 magar\u00eci, fici
  m\u00f2riri la nova muggheri e lu patri d\u2019idda; appoi, p\u00f4 scantu ca li
  s\u00f2 figghi put\u00ecssiru \u00e8ssiri lassali suli e trattati malamenti di li
  straneri, ammazzau macari a iddi.\"", "\"Amuri,ca luntanu stailu me cori ti voli
  parrarinon haju pritisipi ti diri cosica sulu tu mi fai sapiri.Tantu la notti t\u2019haju
  a pinsarica senza tia nun pozzu starima lu stissu ti l\u2019haju a cuntarica la
  me sorti vogghiu anduvinari.Nun c\u2019\u00e8 pruverbiu ca pozza capiriquantu li
  cosi chi sannu a faripirch\u00ec l\u2019amuripozza cantari senza scuntentue senza
  chiantuprima guarisci di sti maliprima si curca \u2018nta lu sentimentuma si na
  cosa haju a vuliri\u00e8 la to prisenzia e sinceritati.E un ghiornu parru senza
  pinsarie un ghiornu pensu senza parraridi stu cunflittu m\u2019haju a livariprima
  ca mali mi pozza faria la me stissa menti e scrianzarie lu me corie li me parolie
  sugnu certu ca vogghiu starisempri cu tia a limosinari.\u2018Nta la partenza non
  salutarie \u2018nta l\u2019arrivu nun m\u2019aspittarica puru io pozzu sapiriquandu
  ti vegnu pi truvari:a un datu puntoa un misi o duituttu lu corpu t\u2019haju a baciarituttu
  di mia t\u2019haju a cuntarica senza ciatu vogghiu arristarituttu di mia t\u2019haju
  a cuntarica senza ciatu vogghiu arristari.\\nAmuri,\\nca luntanu stai\\nlu me cori
  ti voli parrari\\nnon haju pritisi\\npi ti diri cosi\\nca sulu tu mi fai sapiri.\\nTantu
  la notti t\u2019haju a pinsari\\nca senza tia nun pozzu stari\\nma lu stissu ti
  l\u2019haju a cuntari\\nca la me sorti vogghiu anduvinari.\\nNun c\u2019\u00e8 pruverbiu
  ca pozza capiri\\nquantu li cosi...\"", "\"Misstress B\u00e0rbara\\nMisstress B\u00e0rbara
  (nomu veru B\u00e0rbara Bonfiglio), nata \u2018n Sicilia, nt\u00f4n paisi \u00ea
  faldi di l''Etna, nt\u00f4 1975, \u00e8 na Dee jay (Disc Jockey) canadisa d\u2019or\u00ecggini
  taliani assai famusa. Veni cunziddirata comu la megghia Dj d\u00fb munnu.\\nLu s\u00f2
  nomu \u201cMisstress\u201d si scrivi cu quattru S pirch\u00ec \u00e8 nu jocu di
  palori (cumpostu d\u00ee dui palori ngrisi \u201cmiss\u201d e \u201cstress\u201d).
  Attuarmenti idda campa a Montreal (nt\u00e2 Pruvincia franc\u00f2funa d\u00fb Qu\u00e9bec,
  Canada) unni la s\u00f4 famigghia s\u2019havi trasfiruta quannu idda av\u00eca sulu
  ottu anni.\\nA d\u00f2dici anni nizzia a sunari lu tammuru. Passa appoi \u00e2 battar\u00eca
  nt\u00f4n gruppu heavy metal, nun ammustrannu mmeci granni apprizzamentu p\u00e2
  house music. Si ntiressa di m\u00f9sica alittr\u00f2nica d\u00fb 1994, lu stissu
  annu d\u00fb s\u00f2 baccalauriatu (baccilleratu franc\u00f2funu) \u2018n cumunicazzioni
  (spicialitati c\u00ecnima). Accumenza a sunari nt\u00ea \u201cclubs\u201d d\u00ee
  citati canadisi di Qu\u00e9bec, di Trois-Rivi\u00e8res e a Toronto (Pruvincia angl\u00f2funa
  di l\u2019Ontario, Canada), unni av\u00eca, tra l''\u00e0utru, travagghiatu nta
  na videoteca e nt\u00f4n risturanti.\\nHavi cuntinuatu nt\u00e2 s\u00f2 straurdinaria
  carrera sunannu nta quasi tuttu lu munnu (\u2018n Europa, Asia, Nord e Sud M\u00e8rica
  e Australia) nzinu d\u00fb 1996 quannu tinni la s\u00f2 prima sirata di Dj (Dee
  jay). La bedda bruna havi gi\u00e0 rializzatu pruduzzioni supra arcuni d\u00ee meggh\u00ee
  etichetti Techno d\u00fb munnu (Tronic, Rotation, Strive et In-Tec) e havi midemma
  avutu arcuni vrani musicali silizziunati pi film. Bona parti d\u00ee s\u00f2 nfruenzi
  musicali sunnu M\u00f9sica Latina e lu Jazz. Ma nt\u00f4 1999 Barbara havi criatu
  la s\u00f2 propia etichetta, Relentless Music, c\u2019havi addivinutu appoi Iturnem
  a lu nizziu d\u00fb 2004. Misstress Barbara havi sunatu nz\u00e8mmula a granni artisti
  comu Carl Cox, Bj\u00f6rk e tanti \u00e0utri.\\nS\u2019havi esibbutu nta \u201cclubs\u201d
  e \u201craves\u201d nta tuttu lu munnu comu p\u2019asempiu Aria (Montreal, Canada),
  Rex (Pariggi, Francia), Florida 135 (Fraga, Spagna), Velvet Underground (Londra,
  Regnu Unitu), Twilo (New York, Stati Uniti). Unu d\u00ee mumenti cchi\u00f9 mpurtanti
  d\u00e2 s\u00f2 carrera fu la s\u00f2 esibbizzioni \u00f4 \\\"Fashion Cares\\\"
  a Toronto \u2018n fauri d\u00ee v\u00ecttimi di l''AIDS. La musicista siciliana
  participau macari a arcuni \u00e0utri granni abbinimenti comu I LOVE TECHNO (Belgiu)
  e SONAR (Spagna).\\nNfini \u00e8 na figura mpurtanti di l''universu musicali mudernu,
  puru siddu ancora picca nota d\u00ee taliani. \u00c8 comu \u00e8 gghi\u00e8 apprizzata
  e ricircata p\u00ee s\u00f2 cumpitenzi ch\u00ee piatti, sempri house e techno. Lu
  s\u00f2 \\\"hard beat\\\" \u00e8 t\u00ecpicu d\u00ee s\u00f2 pruduzzioni.\"", "\"Ogni
  vota ca vai a ririviri, capisci jautri cosi, jautri sfaccittaturi ca prima nu\u2019
  viristi.\\n\u2018Ssumma l\u2019arti je na cosa seria pi genti seria.\\nMenu mali
  ca ci nni sunu tanti critici seri ca jhanu \u2018u spiritu re mecenati e, ricennu\\n\u2018a
  virita a tutti i costi, aiutunu tanta genti a nun farisi illusioni \u2018nutilmenti.\\nMa
  allura Musa mia, quannu si virunu certi quattri che culuri fatti straviari re peri\\nri
  \u2018na jaddina, o, cu \u201cl\u2019areografo\u201d; quannu si viri \u2018n cessu
  o \u2018na para ri strisci culurati straviati\\nche manu \u2018npacchiati, oppuru
  \u2018na cacata \u2018nta \u2018na buatta, chi c\u2019e ri artisticu?\\nNu\u2019
  mi riri, ca \u2018u spiritu ri Diu, manna messaggi che peri o che pennelli scutulati
  \u2018nta\\ntila, nu\u2019 mu riri, picchi se chissa je arti, ammogghiu tuttu cosi
  ie ghiettu macari a mia.\\nNoh! chissa nu\u2019 je arti, cuntinuo ironia, ti rissi
  ca l\u2019arti, \u2018mpegna \u2018a menti, \u2018u sapiri\\nie tuttu \u2018u ciriveddhu
  ri n\u2019omunu, e, nu\u2019 po ghiessiri lassata o casu.\\n\u2018U vaiu je, ca
  cettuni, carunu \u2018nte manu ri parulari arrivisti ca pi nun farivi capiri\\nnenti,
  vi parrunu ri \u201cfrattali\u201d, ca poi sunu i frattaghi, pi capirini \u2018u
  centu peddhi.\\nTi fanu \u2018u giru laggu, ricenniti, senza riri nenti, ie, senza
  pigghiari posizioni, co\\nsulu scopu ri fari rinari.\\nA voti, vi vulissunu spiegari
  cosi ca gia parrunu suli.\\nCerti \u2018ntellettuali, pi rririri, c\u2019avissunu
  l\u2019obbligu ri riri sempri a virita, sunu i primi\\na diri minchiati.\\n\u2018U
  veru \u2018ntellettuali, chiddhu ca i maiuscola, chiddhu ri sustanza, je chiddhu
  ca\\ntrasmetti valori positivi cu l\u2019esempiu ri vita, \u2018n veru murellu ca
  sibbissi.\\nJe chissu, c\u2019avissa aiutari all\u2019autri a capiri e ghiri avanti
  trasmittennici \u2018a vera cultura,\\nno comu fanu tanti prufissuri ca parrunu
  teorizzannu \u2018i cosi sturiati a scola a pappaiaddhu,\\nPropria chissi, sunu
  i primi ca \u2018nveci ri educari v\u2019ammacchiunu.\\nFinitaccilla vah!\\nTanti,
  c\u2019hana sturiatu, sunu \u2018n pugnu ri \u2018ntrunati, ca fanu i cosi pi fozza,
  facennisi\\nputtari a spassu ro ciriveddu, re vistita, ie, ri l\u2019anchi.\\nPigghia
  tanti grandi artisti ro passatu, per esempiu, leonardo, raffaello, michelangilo,\\ncaravaggio,
  c\u2019e bisognu ca veni coccarunu a spiegari chiddhu ca ficiunu?\\nNnu viriti cu\u2019e
  vostri occhi, quantu foru ranni, ie, continuunu a jessiri, picchi putiti\\ntuccari
  ie maniari.\\nChiddu ca ficiunu iddhi, sopravvivi \u2018nta l\u2019idei, ie, ne
  pinseri ca manifestaru \u2018nta l\u2019 opiri\\ne, puru tu, e, cu nu\u2019 sapi
  nenti, po capiri.\\n133\\n\u2018Nta \u2018stu riscussu, fussi r\u2019accordu puru
  san tommaso, abituatu a vuliri tuccari ie\\nmaniari.\\nQuannu nu\u2019 capisci \u2018u
  significatu, nu\u2019 gne cuppa ri cu fici \u2018a cosa, ma to ca nun\\narrivi a
  capiri, sulu allura, je utili cu \u2018a sapi spiegari.\\nChi c\u2019e ri spiegari
  \u2018nto Criatu? Je beddhu picchi je beddhu, ie finiticcilla ca cunsulazioni\\nre
  fissa, \u201cca nun je beddhu chiddhu ca je beddhu, ma chiddhu ca piaci\u201d.\\nMinchiati!\\n\u2018U
  suli, po alluciariti, bruciariti, \u2018nfastiddiriti, ma nu\u2019 po riri ca nun
  je beddhu.\\n\u2018U scienziatu, ti po veniri a spiegari comu, quannu ie picchi
  je chiddhu ca je, ma\\nnu\u2019 ti po diri ca je niuru, picchi si viri ca sbamba
  ie fa luci.\\n\u2018U niuru, je assenza ri luci, ie, peccio ri culuri, picchi i
  culuri parunu sulu ca luci.\\nCetti vavusi, vi venunu a diri, ca l\u2019artista
  ha vulutu ammucciari \u2018u significatu, ca\\nvuleva riri\u2026., chissu significa,
  ca \u2026\u2026\u2026\u2026.., ma ca \u2018ncucchiunu!\\nTanti artisti, raveru bravi,
  n\u2019aviti \u2018i provi, \u2018nta vita mureru ri fami ie s\u2019appona svinniri\\npi
  \u2018n tozzu ri pani \u2018i cosi ca vo na fattu cu tantu amuri.\\nI soliti vastasi,
  figghi ri ludda, nun putennili sfriculiari quannu jerunu vivi, allura\\navissunu
  cancillatu puru u nomu, s\u2019arriccheru doppu che puvureddhi mureru.\\nOra, certi
  opiri, venunu valutati miliardi, a facci i cu nu\u2019 voli, comunqui, je meritu\\nri
  tanti onesti o sdisanesti \u201cmecenati\u201d se ora putiti riviriri tanti capolavori.\\nO
  populu resta a surisfazioni, ca si n\u2019adduna subitu cu\u2019je ca vali ie cu
  no.\\nChistu, vali pi tuttu cosi, puru pe\u2019 Santi ra chiesa.\\n\u2018I Santi,
  venunu acclamati ro populu, \u2018u papa, si limita a fimmari \u2018a \u201cbolla\u201d,
  accussi\\nsucceri nall\u2019arti vera.\\nTanti, facissunu bonu a ghittari pennelli,
  sgubbii, scappeddi ie mazza, ma forsi je\\nmegghiu ri no, ammenu nu\u2019 fanu iautru
  dannu.\\nFonte Aretusa anni 50\\nPUBBLICITA, CA JE L\u2019ANIMA RO CUMMERCIU\\nPANI
  SODDI E FANTASIA\\nOra viviti anticchia ri iacqua, ca poi ti parru ri giunnali ie
  re telivisioni.\\nMentri mi stava vivennu l\u2019acqua, \u2018ntisi \u2018na vuci
  ri fimmina, ca riceva, \u2018ntoniu, \u2018ntoniu!\\nMi girai senza viriri a nuddhu,
  ie, \u2018a musa ricumincio a parrari ricennu: \u2018nto munnu,\\nnu\u2019 sapiti
  chiu quali je \u2018u biancu ie quali je \u2018u niuru, unni je a virita ie unni
  \u2018a minzogna,\\nie, faciti chiddhu ca vonu cetti jautri, ie, senza addunarivinni,
  siti plagiati cu tuttu\\nchiddhu ca v\u2019ancucchiunu, cu chiddha ca chiamunu \u2018nfummazioni.\\nPutiti
  sapiri, sulu chiddhu ca cummeni a \u2018na pocu ri pupari.\\nMenu sapiti, ie megghiu
  je.\\nTuttu je sturiatu a tavulinu, p\u2019abbarulirivi, e, nun farivi pinzari.\\nGia,
  fanu \u2018n modu, ca \u2018i picciriddhi sunu addhivati a nun pinzari, e, \u2018nveci
  ri educalli\\na crisciri, i tenunu \u2018mpignati a ghiucari co telefoninu, \u2018u
  tablet, video-jocu elettronicu,\\nbasta ca si stanu femmi, e, nun ci rumpunu \u2018i
  scatuli all\u2019autri.\\nCi manca sulu, ca a ognarunu ri vuiautri, mettunu \u2018na
  spina collegata cu \u2018nu buttuni,\\npi cumannarivi ri unni ie gghe.\\nGia, co
  satelliti, virunu quanti voti jti o cessu, ie, st\u2019hanu sturiannu, tessiri ie
  patenti\\nelettronichi, pi cuntrullariri megghiu. Manca picca, c\u2019ammentunu,
  \u2018na machina pi cuntrullarivi\\n\u2018i pinseri.\\n\u2018Ncuminciasturu, cu
  \u2018e recinti ri filu spinatu, cu\u2019e mura, cacciri, campi ri concentramentu,\\nie,
  ora, cu l\u2019elettronica cumplitasturu l\u2019opira.\\nManu mali, ca nu\u2019
  ponu mai jessiri pattruni ri mia, ca sugnu ironia, ie, sugnu sulu\\n\u2018n posti
  particulari, unni cetta genti, nu\u2019 avennu \u2018u spiritu adattu, nu\u2019
  ci po mai arrivari.\\nAmiricani, caperu subitu, chi significa pusseriri a \u2018nfummazioni,
  ie, cu chissa, ha\\nna colonizzatu \u2018n munnu, ca bramusia ca ihanu pi fari soddi..\\n\u2018I
  vostri paisani ca foru a merica, \u2018u chiamunu \u201cbisinissi\u201d. Tantu sunu
  \u2018mbriachi ri\\nsoddi, ca nu\u2019 taliunu a nuddhu \u2018nta facci. Sa na sturiatu
  bona, ie, cu \u2018n cocciu ri meli, ca\\nsunu dolliri, pigghiunu, no una, ma centu
  muschi.\\nCumeddia Sarausana\\nAntonio Randazzo\\n17 continua\"", "\"Michele Ferrero\\nMichele
  Ferrero (Dogliani, 26 di aprili 1926 - Monte-Carlu, 14 di frivaru 2015) era nu mprinnituri
  famusu pi lu Kinder Ferrero[1].\\nBiograf\u00eca[cancia | cancia la surgenti]\\nNasciutu
  da Pietru Ferrero e di Piera Cillario. Nt\u00f4 1971 venni numminatu cumu Cavaddiri
  d\u00fb Travagghiu[2]. Nt\u00f4 2014, s\u00e8cunnu Forbe lu jurnali Ferrero era
  cchi\u00f9 riccu di tutta Italia cu circa 24 miliardi di dullari e 30\u00b0 nt\u00f4
  munnu[3]. Nt\u00f4 2005 venni numminatu cumu Cavaliere di Gran Croce dell''Ordine
  al Merito della Repubblica Italiana[4].\"", "\"fihiolu.\\nNcera na vota Nu rre rinnu
  subbitu i piccirii. E nno, fihioli, vi sbahiastu. Ncera na vota nu pezzi lignu.
  Non era nu lignu i lussu, ma nu ccippu coma nnatru, i chii chi nt mbernu si mentunu
  nt bbrasceri o nt fucularu pi umari u focu e ccaddiari i stanzi. Non sacciu comu
  fu, ma un hiornu stu pezzi lignu capitau nta putia i nu vehiu fallignami, chi ssi
  hiamava massru Ntoni. Tutti pir u hiamavunu massru Cirasa, pa punta ra so nashia
  chera sempri lucita e rrussazza, coma nna cirasa fatta. Ampena massru Cirasa vitti
  u pezzi lignu, si scialau tuttu, si ssricau i mani pa cuntintizza e bburburau ammena
  vuci: Stu lignu capitau ggiustu ggiustu: u ohiu usari mi mi fazzu nu bbellu peri
  i taulinu! Mancu u rissi chi ppihiau a sciuni ammulata mi nci caccia a scorcia e
  mmu rrifila; ma quandu u mi nci runa a prima bbotta, rristau cu bbrazzu allaria,
  pirch sintu na vucicea fina fina chi nci rraccumandau: Non chi mmi mini troppu forti?...
  Pinzati a ccomeppa rristari u maru vehiu i massru Cirasa! Ggirau lohi spiritati
  pi ttutta a stanza pi bbiriri i undi era nisciuta a vucicea, e nnon vitti a nnuu!
  Vardau sutt bbancu, nuu! Vardau nt stipu chera sempri serratu, e nnuu! Vardau nta
  ggissra ri bbampuhi e dda serratura, nuu! Japru a porta ra puta mi nci runa nohiata
  puru nta ssrata, e nnuu! E annunca? Capisca! dissi allura rrirendu e rraspandusi
  a pirucca. Si viri chi a vucicea ma mmagginai jeu. Mintimundi e ttravahiamu! Pihiau
  danovu a sciuni e a u pezzi lignu nci rrifilau na bbella bbotta. Ahiai! Mi cciuncasti!
  ggrirau amarata a solita vucicea. Sta vota massru Cirasa rristau , mpalatu, cu llohi
  i fora ru shiantu, a bbucca spalancata e a lingua chi nci mpindiva nzin bbarbarottu,
  comu mascaruni i na funtana. Quandu nci turnau ranovu a palora, ccuminciau mi rici,
  trimandu e bbirbandu ru shiantu: Ma i undi niscu sta vucicea chi ddissi ahiai!?
  Eppuru cca non nc arma viva. Non chi esti ssu pezzi lignu chi ssi mparau mi ciangi
  e mmi si lamenta coma nnu fihiolu?! Non nci pozzu cririri. Stu lignu alucc! nnu
  pezzi lignu i fucularu, coma ttutti latri; e ssu jettu nt focu, faci bbuhiri na
  pignata i fasoli o non cchi nc ccarcunu mmucciatu intra?! Si nc ccarcunu mmucciatu,
  peggiu pi iu! Ora u ggiustu jeu! E ddicendu i sta manera, nguantau cu ttutti ddu
  mani u maru pezzi lignu e ccuminciau mu mina paru paru cuntr mura ra stanza. Apoi
  si misi mi senti si ncera cacchi vucicea chi ssi mungava. Spittau ddu minuti, e
  nnenti; cincu minuti, e nnenti; deci minuti, e nnenti!\\nCapisca rissi allura, circandu
  mi rriri e mbuuriandusi a pirucca. Si viri chi a vucicea chi ddissi ahiai! ma mmagginai
  jeu! Mintimundi e ttravahiamu E ssiccomu ava pihiatu nu bbellu fifu, ccuminciau
  mi cantula, pamuri mi si faci na stamp curaggiu. Nt ssramenti pusau a sciuni e ppihiau
  u hianozzu mi shiana e mmi pulizza u pezzi lignu. Ma mentri u shianava avanzarretu,
  sintu a solita vucicea chi nci rissi rrirendu: A finisti mi mi catuhi? Sta vota
  u maru massru Cirasa caru comu furminatu. E qquandu japru danovu lohi, si truvau
  ssittatu nterra. A so facci pariva trasfigurata; e addirittura a punta ra nashia,
  chera sempri rrussa rrussa, sera fatta bblu ru shiantu.\\nCapitulu Sicundu Massru
  Cirasa nci rriala u pezzi lignu so amicu Ggeppettu, chi ssu pihia mi si faci nu
  bbellu pupu, chi ssapi bballari, tirari ca spata e ffari i piroletti. A u puntu
  bbussaru a porta. Trasiti, trasiti dissi u fallignami, chi nnon ava mancu u putiri
  mi si jaza a ddritta. Allura trasu nta puta nu vehiareu arditu, chi ssi hiamava
  Ggeppettu; ma i fihioli ru rriuni, quandu u vulivunu fari rraggiari, u ngiuriavunu
  Pulentea, pirch ava na pirucca ggialla chi ssumihiava assai a pulenta chi ssi faci
  cu paniculu. Ggeppettu era unu ncazzusu chi nnon vi ricu. Su hiamavunu Pulentea
  mamma ru Carminu! ddivintava subbitu na bbestia e nn putiva teniri nuu. Bbond, massru
  Ntoni dissi Ggeppettu. Chi stati facendu ocanterra? Nci mparu i numira furmiculi
  U Signuri mi vi juta! Cu vi purtau i sti parti, mpari Ggeppettu? Lanchi. Ata ssapiri,
  massru Ntoni, chi vvinni ndi vui mi vi cercu un fari Cca sugnu, serbu vossru nci
  rrispundu u fallignami, izandusi supr gginohia. Stamatina eppi na bbella pinzata
  E ssintimula Pinzai mi mi fazzu nu pupu i lignu, jeu chi me mani. Ma nu pupu bbellu
  pi ddaveru, chi ssapi bballari, tirari ca spata e ffari i piroletti. Cu stu pupu
  vohiu ggirari u mundu, mi mi mbuscu cacchi ppezzi pani e ccacchi bbiccheri i vinu.
  Chi vvi ndi pari? E bbrava Ppulentea! ggrirau a solita vucicea, chi nnon si capisciva
  i undi viniva. Quandu si sintu hiamari Pulentea, cumpari Ggeppettu ra rraggia divintau
  rrussu coma nna paparina e, ggirandusi versu u fallignami, nci rissi tuttu nfulinatu:\\nE
  ora, pirch mi nzurtati? E ccu chi vvi nzurta? Mi chiamastu Pulentea! Non fua jeu
  Varda varda chi qquasi quasi fua jeu! Jeu ricu chi ffustu vui! No! S! No! S! E ncalurandusi
  sempri hiussai, passaru ri palori fatti: si minaru, si sgargiaru, si muzzicaru,
  si pizzaru. Quandu finiru mi si rununu bbeu pulitu, massru Ntoni ava nt mani a pirucca
  ggialla i Ggeppettu, e Ggeppettu ava nta bbucca a pirucca pipi e ssali ru fallignami.
  Dammi a me pirucca! ggrirau massru Ntoni. E ttu rammi a mia e ffacima paci I ddu
  vehiarei, dopu chi ssi pihiaru ognunu a so pirucca, si ssringiru a manu e ggiuraru
  mi rrestunu bboni amici pi ttutta vita. Annunca, cumpari Ggeppettu dissi u fallignami
  mi nci faci a bbiriri chi bbuliva fari a paci pi ddaveru. Qual ssu fari chi bbuluvu
  i mia? Vuliva un pezzi lignu mi mi fazzu nu pupu, llati mi mu rati? Massru Ntoni,
  tuttu cuntentu, u viatu viatu mi pihia supr bbancu u pezzi lignu chi llava fattu
  tantu shiantari. Ma quandu u mi nci runa allamicu, u lignu si resi na scutulata,
  nci fuu ri mani e hu mi nci sbatti propiu nta llanchi fini fini e ssicchi sicchi
  ru maru Ggeppettu. Ah! E vvui a rrobba a rrialati i sta manera, Massru Ntoni? Natra
  stampa mi stauvu zzoppiandu! Vi ggiuru chi nnon fua jeu! Allura eppa hiessiri jeu!
  A curpa ttutta i stu lignu cca U sacciu chesti ru lignu. Ma fustu vui chi mmu minastu
  nta llanchi! Non vu minai jeu! Munzignaru! Ggeppettu, circati no mmi maffinditi,
  sannunca, vi hiamu Pulentea! Sceccu! Pulentea! Ciucciu! Pulentea! Bbruttu scimiuni!
  Pulentea! Quandu si sintu hiamari Pulentea pa terza vota, Ggeppettu nom bitti hi
  i llohi, si ittau supr fallignami e si ndi resiru un saccu e nna bbertula. Quandu
  a sciarra finu, massru Ntoni ava ddu sgargiatini i hi nta nashia, e cchiautru ddu
  fundei i menu nt bbuggiaccu. Cu stu cuntu paru, si ssringiru a manu e ggiuraru mi
  rrestunu bboni amici pi ttutta vita. Nt ssramenti Ggeppettu si pihiau u so bbellu
  pezzi lignu, rringraziau a mmassru Ntoni e ssi ndi turnau a casa zzoppiandu.\\nMolto
  pi\u00f9 che documenti.\\nScopri tutto ci\u00f2 che Scribd ha da offrire, inclusi
