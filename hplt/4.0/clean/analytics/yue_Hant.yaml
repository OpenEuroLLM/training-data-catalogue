  of the year\u3002\u9996\u5148\uff0c\u7de8\u5287\u592a\u5dee\u3002\u9700\u77e5Doom\u672c\u8eab\u5c31\u4fc2\u5176\u4e2d\u4e00\u96bb\u7de8\u5287\u6700\u597d\u4e4bFPS\uff0c\u7531\u7b2c\u4e00\u5230\u7b2c\u4e09\u96c6\u4e00\u76f4\u570d\u7e5e\u4f4f\u540c\u4e00\u500b\u4e2d\u5fc3\u300c\u5730\u7344\u653b\u9677\u706b\u661f\u540c\u5730\u7403\u300d\u767c\u5c55\u800c\u4e14\u767c\u5c55\u5f97\u597d\u6709\u529b\u597d\u56b4\u8b39\uff0c\u5462\u6a23\u91ce\u5df2\u7d93\u5514\u4fc2\u5176\u4ed6FPS\u505a\u5f97\u5230\uff0c\u5373\u4fc2\u6574FPS\u679c\u73ed\u90fd\u77e5\u9053\u73a9FPS\u679c\u73ed\u5f97\u9b3c\u9592\u7406\u4f60\u500b\u6545\u4e8b\uff08\u5766\u767d\u8b1b\uff0c\u521d\u521d\u6253\u679c\u9663\u6642\u90fd\u9867\u4f4f\u6bba\u906e\uff0c\u82f1\u6587\u53c8\u5514\u4fc2\u597d\uff01\uff09\uff0c\u7279\u5225\u4fc2old-school\u679c\u73ed\uff01\u65e2\u7136Doom\u6709\u4e00\u500b\u5481\u597d\u4e4b\u6545\u4e8b\uff0c\u90fd\u5514\u660e\u7de8\u5287\u679c\u73ed\u9ede\u89e3\u6703\u5514\u7528\u672c\u4f86\u500b\u6545\u4e8b\u5df2\u5230\u5929\u82b1\u9f8d\u9cf3\uff0c\u521d\u521d\u9023\u706b\u661f\u90fd\u5514\u4fc2\u5fdd\uff0c\u5373\u6bd4\u6210\u73edfans\u5c0f\u7206\uff0c\u8a71\u4fc2Doom\u4f46\u5c45\u7136\u5514\u4fc2\u706b\u661f\u800c\u4fc2\u300c\u67d0\u661f\u7403\u300d\uff1f\u5649\u4ef2\u4fc2Doom\uff1f\u5514\u4fc2\u6bd4\u4eba\u5c0f\u5230\u4e5d\u5f69\uff0c\u90fd\u5514\u6703\u6539\u756a\u505a\u706b\u661f\uff01\u5c0e\u6f14\u53c8\u5514\u6382\uff0c\u5957\u6232\u524d\u534a\u592a\u5feb\u592a\u4e82\uff0c\u57fa\u672c\u4e0a\u5514\u5920\u534a\u500b\u9418\uff0c\u5df2\u7d93\u7576\u4ea4\u4ee3\u6652\u6240\u6709\u91ce\u517c\u9ece\u6599\uff0c\u8ddf\u4f4f\u4ef2\u8981\u8d85\u591a\u4e0d\u5408\u7406\u3001\u4ea4\u4ee3\u4e0d\u6e05\u540c\u72af\u99c1\u4f4d\uff0c\u5514\uff38\u6382\u5566\u5509\uff01\u500b\u57cb\u5c3e\u4ef2\u5ee2\uff01\u96d6\u7136\u4e00\u65e9\u77e5\u9053\u6703\u6709\u4f0f\u7b46\uff08\u7747\u843d\u53bb\u5c31\u6703\u77e5\uff09\uff0c\u4f46\u4f30\u5514\u5230\u5481\u773c\u9ad8\u624b\u4f4e\uff01\u5b8c\u5168\u5514\u77e5\u5c0e\u6f14\u540c\u7de8\u5287\u641e\u4e5c\uff01\u6211\u771f\u4fc2\u7747\u7b2c\u4e8c\u6b21\u5148\u660e\u756a\u500b\u5287\u60c5\u8b1b\u4e5c\uff0c\u4f46\u4f9d\u7136\u89ba\u5f97\u597d\u9b3c\u5514\u5408\u7406\uff01\u968a\u5165\u9762\u6709\u500b\u4e9e\u6d32\u4eba\uff0c\u5168\u5834\u5514\u5920\u4e09\u53e5\u5c0d\u767d\u4e00\u69cd\u5187\u958b\u904e\u5df2\u7d93\u6b7b\uff31\u5de6\uff0c\u57fa\u672c\u4e0a\u7747\u5b8c\u4f60\u90fd\u5514\u8a18\u5f97\u6709\u5462\u689d\u53cb\u51fa\u73fe\u904e\uff0c\u8d85\u7070\uff0c\u90fd\u5514\u77e5\u51fa\u9ece\u505a\u4e5c\uff01\u4e00\u76f4\u7747\u843d\u53bb\uff0c\u4f60\u5514\u6703\u89ba\u5f97\u4fc2Doom\uff0c\u540cDoom\u6709\u54a9\u95dc\u4fc2\uff1f\u5c31\u4fc2\u56e0\u70ba\u652fBFG\uff08\u5462\u652f\u70ae\uff0c\u5b78\u8853\u540d\u7a31\u53ebBio-Force
  Gun\uff0c\u6b63\u78ba\u540d\u7a31\u4fc2Big Fxxking Gun\uff0c\u4f60\u73a9FPS\uff0c\u4e00\u5b9a\u6703\uff0f\u8981\u77e5\u9053\u5462\u6a23\u91ce\uff09\uff0c\u4ef2\u6709\u96fb\u92f8\uff08\u5462\u6a23\u90fd\u5187\uff0c\u5514\u597d\u53eb\u505aDoom\uff09\uff0c\u5c31\u53ebDoom\uff1f\u6216\u8005\u5462\u5957\u4fc2\u524d\u50b3\u5566\uff0c\u56e0\u70ba\u9ede\u7747\uff0c\uff44\u602a\u7269\u90fd\u4fc2\u300c\u8b8a\u300d\u51fa\u9ece\uff0c\u6240\u4ee5\u597d\u5931\u671b\uff0c\u56e0\u70ba\u4eba\u5730Doom\u4fc2\u5730\u7344\u8d70\u51fa\u9ece\uff0c\u800c\u5514\u4fc2\u4eba\u8b8a\u51fa\u9ece\uff0c\u6216\u8005\u4f60\u8a71\u6539\u7de8\u5514\u4ee3\u8868\u4e00\u5b9a\u8981\u8ddf\u8db3\u539f\u8457\u800c\u4e14\u8ddf\u8db3\u4ea6\u672a\u5fc5\u597d\uff0c\u4f46\u6211\u4ecd\u7136\u4fc2\u597dold
  school\uff0cDoom=hell\uff01\u5730\u7344\u4e00\u76f4\u4fc2Doom\u6700\u91cd\u8981\u6700\u91cd\u8981\u4e4b\u4e00\u90e8\u4efd\uff0c\u4f60\u5187\u5730\u7344\uff0c\u5514\u597d\u8a71\u4fc2Doom\uff01\u9b54\u9b3c\u540c\u602a\u7269\u4fc2\u4f86\u81ea\u5730\u7344\uff0c\u5514\u4fc2\u4eba\u985e\u8b8a\u7a2e\u800c\u6210\uff01\u800c\u4e14\u73a9\u904eDoom\uff0c\u90fd\u6703\u77e5\u9053\u5462\u96bbgame\u4fc2\u6975\u5ea6pagan\u540cantichrist\uff0c\u4f46\u96fb\u5f71\uff0c\u70ba\u5de6\u5e02\u5834\u540c\u5165\u5ea7\u7387\uff0c\u7576\u7136\u4fc2\u5187\u6652\u5462\uff44\u91ce\u3002\u597d\u7070\u3002\u5b8c\u5168\u9055\u80cc\u6652Doom\u4e4b\u539f\u65e8\uff01\u6211\u5730old-school\u53cb\u5514\u4fc2\u60f3\u807d\u300c\u8caa\u5a6a\u6700\u7d42\u6703\u53cd\u566c\u4eba\u985e\u300d\uff0c\u6211\u53ea\u60f3\u7747\u5730\u7344\u6e67\u51fa\u5343\u842c\u9b54\u9b3c\u602a\u7269\u6bba\u6652\u5168\u5730\u7403\u6240\u6709\u4eba\uff0c\u4e4b\u5f8c\u4e3b\u89d2\u4e00\u689d\u53cb\u6216\u8005\u4e00\u73ed\u53cb\u62ce\u4f4f\u5e7e\u5341\u652f\u69cd\u6012\u6bba\u7121\u9650\u96bb\u602a\u7269\uff0c\u6700\u5f8c\u6bba\u5230\u5165\u5730\u7344\u6435\u500b\u5927\u4f6c\u51fa\u9ece\u788e\u5c4d\u7206\u982d\uff01\uff08\u5187\u932f\uff0c\u5462\u5169\u6a23\u4fc2old-school
  FPS\u4e4b\u751f\u547d\uff09\u5187\u932f\u6211\u5c31\u4fc2\u5481old-school\u5c31\u4fc2\u5481\u819a\u6dfa\uff01\u56e0\u70ba\u5649\u5148\u4fc2Doom\uff0c\u5649\u5c31\u4fc2Doom\uff01\u800c\u5514\u4fc2\u5230\u6700\u5f8c\uff0c\u4e00\u500b\u4eba\u5f62\u5fe0\u89d2\u540c\u4e00\u500b\u4eba\u5f62\u5978\u89d2\u6253\u6454\u89d2\uff01\u8fd1\u5e74\u5957\u5957\u7f8e\u570b\u52d5\u4f5c\u7247\u90fd\u592a\u7f8e\u570b\u5587\uff01AVP\u53c8\u4fc2\uff0cDoom\u53c8\u4fc2\uff01\u4fc2\u5514\u4fc2\u90fd\u8981\u4e00\u5c0d\u4e00\u6253\u6454\u89d2\uff01\u6211\u77e5\u6435\u5230The
  Rock\u62cd\u4fc2\u8ce3\u9ede\u4e4b\u4e00\uff0c\u4f62\u6700\u5f8c\u4e00\u5834\u540c\u4e3b\u89d2\u5c0d\u6253\uff08\u5187\u932f\uff0c\u9806\u6c23\u5728\uff0cThe
  Rock\u65e9\u6b7b\uff0c\u96d6\u7136\u90fd\u5514\u4fc2\u6b7b\uff0c\u4f46\u505a\u5de6\u5978\u89d2\uff0c\u7e3d\u7b97\u4f3c\u756a\uff44\u6a23\uff0c\u4f46\u4f62\u505a\u5de6\u5978\u89d2\uff0c\u6700\u5f8c\u53c8\u8b8a\u505a\u6253\u6454\u89d2\uff0e\uff0e\uff0e\uff09\uff0c\u4e2d\u9593\u6253\u5927\u4f6c\u53c8\u4fc2\uff08\u96d6\u7136\u6253\u602a\u7269\u90fd\u4fc2\u62f3\u8173\uff0c\u597d\uff31\u7070\uff09\uff0c\u4f46\u52d5\u4f5c\u540c\u69cb\u601d\u90fd\u5ea6\u5f97\u597d\u6b63\uff0c\u8d77\u78bc\u52d5\u4f5c\u540c\u667a\u6167\u9ad8\u904eAVP\u5e7e\u500d\u5148\uff0c\u53ea\u4e0d\u904e\u90fd\u4fc2\u679c\u53e5\u5566\uff0c\u5649\u5514\u4fc2Doom\uff0c\u540c\u57cb\u4e00\u5957\u6210\u529f\u4e4b\u79d1\u5e7b\u6050\u6016\u52d5\u4f5c\u7247\uff0c\u4fc2\u8981\u6709\u8d85\u91cd\u706b\u529b\uff08\u6700\u4f73\u4f8b\u5b50\uff1aAliens\uff09\uff0c\u800c\u5514\u4fc2\u8d64\u624b\u7a7a\u62f3\uff08\u8d85\u52a3\u4f8b\u5b50\uff1a\u53c8\u4fc2AVP\uff09\u3002Doom\uff0c\u61c9\u8a72\u4fc2\u69cd\u7832\u4e82\u5561\uff0c\u5514\u4fc2\u6253\u6454\u89d2\uff0c\u5373\u4fc2\u4f60\u5514\u7528\u69cd\u90fd\u7528\u96fb\u92f8\u4e2b\u5514\u8a72\u3002\u7747\u5b8c\u4e4b\u5f8c\u4f60\u5c31\u6703\u77e5\u9053\uff0c\u5176\u5be6\u5168\u5957\u6232\u9664\u5de6\u500b\u540d\uff0c\u4e00\uff44\u90fd\u5514doom\uff0e\uff0e\uff0e\u5440\u5514\u4fc2\uff0c\u597d\u4f3c\u8b1b\u6f0f\u5de6\u6700\u7dca\u8981\u679c\u6a23\u91ce\uff1f\u5187\u932f\uff01\u5c31\u4fc2\u9810\u544a\u7247\u5f15\u5de6\u6211\u5165\u5834\u679c\u6bb5FPS\uff01\u898b\u5230\u62cd\u6232\u90fd\u8981FPS\u5481\u904e\u766e\uff08\u6216\u8005\u6207\u5c45\uff09\uff0c\u4ef2\u8981\u6709\u96fb\u92f8\u5c0dPinky\uff08\u500b\u53d7\u5bb3\u4eba\u597d\u523b\u610f\u5730\u6539\u5de6\u540d\u505aPinky\uff0c\u4f60\u6709\u73a9Doom\u5c31\u6703\u77e5\u9ede\u89e3\uff09\uff0c\u8208\u8da3\u5927\u756a\uff44\u3002\u9ede\u77e5\uff01\u539f\u4f86\u8d85\u77ed\u4e00\u500b\u5b57\u90fd\u5187\uff01\u4ef2\u8981\u672c\u4f86\u597d\u5f88\u5147\u60e1\uff44\u55aa\u5c4d\uff08\u55aa\u5c4d\uff1fBio
