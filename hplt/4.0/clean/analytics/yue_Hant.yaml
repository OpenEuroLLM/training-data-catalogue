  \u52a0\u4e0a\u93ae\u4e0a\u53ea\u6709\u5927\u7d04550\u4eba\u5c45\u4f4f\uff0c\u4eba\u9020\u5149\u6c61\u67d3\u4ea6\u90fd\u6bd4\u8f03\u5c11\uff0c\u55ba\u8ffd\u5149\u5605\u597d\u5730\u65b9\uff01
  \u6bcf\u5e7410\u6708\u81f34\u6708\u90fd\u55ba\u4fc2\u683c\u9675\u862d\u7747\u6975\u5149\u5605\u597d\u6642\u6a5f~
  \u55ba\u6642\u5019\u51fa\u767c\u7747\u4eba\u751f\u5fc5\u7747\u5605\u6975\u5149\uff01
  P.S: \u5514\u8b1b\u5514\u77e5\uff0c\u5176\u5be6\u683c\u9675\u862d\u5148\u55ba\u8056\u8a95\u8001\u4eba\u771f\u6b63\u5605\u6545\u9109\uff01\"",
  "\"\u95dc\u667a\u658c\u51fa\u6d3b\u52d5\u904e\u767eFans\u6490\u5834 \u66f4\u4eab\u65b0\u6d3e\u5076\u50cf\u61c9\u63f4\u5f85\u9047\uff1a\u6211\u55f0\u500b\u5e74\u4ee3\u5187\\n\u95dc\u667a\u658c\uff08Kenny\uff09\u65e5\u524d\u70ba\u5a5a\u7d17\u5c55\u64d4\u4efb\u8868\u6f14\u5609\u8cd3\uff0c\u5531\u51fa\u300a\u7e3d\u6709\u4e00\u7ad9\u611b\u4e0a\u4f60\u300b\u53ca\u300a\u52c7\u6c23\u60c5\u6b4c\u300b\u5169\u9996\u6b4c\uff0c\u5438\u5f15\u904e\u767e\u540dfans\u5230\u5834\u652f\u6301\u3002\\n\u525b\u65bc\u5167\u5730\u5b8c\u6210\u516d\u7ad9\u5de1\u8ff4\u6f14\u5531\u6703\u300a\u95dc\u667a\u658c\u6642\u5149\u6a5f\u5de1\u8ff4\u97f3\u6a02\u6703\u300b\u7684Kenny\u8868\u793a\uff0c\u5f88\u4e45\u672a\u6709\u5728\u9999\u6e2f\u6f14\u51fa\uff0c\u9019\u6b21\u770b\u5230\u9019\u9ebc\u591afans\u4f86\u652f\u6301\uff0c\u4ed6\u8aaa\u5e78\u597dfans\u6c92\u6709\u5fd8\u8a18\u4ed6\uff0c\u300c\u540c\u57cb\u898b\u5230\u597d\u591aFans\u4f62\u54cb\u62b1\u4f4f\u81ea\u5df1\u500b\u5973\u3001\u6216\u8005\u81ea\u5df1\u500b\u4ed4\u904e\u569f\uff0c\u5373\u523b\u89ba\u5f97\u6709\u5572\u6642\u9593\u98db\u901d\u5605\u611f\u89ba\u3002\u300d\u672a\u77e5\u662f\u5426\u592a\u8208\u596e\uff0cKenny\u5531\u300a\u52c7\u6c23\u60c5\u6b4c\u300b\u6642\u7a81\u7136\u5fd8\u8a18\u6b4c\u8a5e\uff0c\u53f0\u4e0bfans\u7acb\u5373\u300c\u88dc\u4f4d\u300d\u5927\u8072\u53eb\u5531\uff0c\u4f46Kenny\u4e5f\u7acb\u5373\u53eb\u505c\uff0c\u6c7a\u5b9a\u91cd\u5531\uff0c\u5341\u5206\u5c08\u696d\uff0c\u300c\u5176\u5be6\u9996\u6b4c\u55ba\u5de1\u6f14\u6642\u6bcf\u4e00\u5834\u90fd\u6709\u5531\uff0c\u7a81\u7136\u9593back
  out\u5497\uff0c\u70ba\u5497\u56de\u994b\u73fe\u5834fans\u5605\u652f\u6301\uff0c\u4e00\u5b9a\u8981\u91cd\u65b0\u597d\u597d\u5730\u5531\u4e00\u6b21\u7540\u5927\u5bb6\u807d\u3002\u300d\\n\u9664\u6b64\u4e4b\u5916\uff0cFans\u5011\u53c8\u6089\u5fc3\u6e96\u5099\u5f88\u591a\u61c9\u63f4\u7269\uff0c\u4ee4Kenny\u5341\u5206\u7aa9\u5fc3\uff0c\u300c\u56e0\u70ba\u4ee5\u524d\u597d\u5c11\u898b\u5230\uff0c\u8b6c\u5982\u6709\u6642\u8fd4\u5c4b\u4f01\u7747\u5230\u4f62\u54cb\u4ffe\u6211\u5605\u79ae\u7269\uff0c\u5168\u90e8\u4fc2\u597d\u6709\u5fc3\u6a5f\uff0c\u8b6c\u5982\u756b\u4e00\u5572\u756b\uff0c\u53c8\u6574\u5497\u597d\u591a\u7cbe\u54c1\u516c\u4ed4\u540c\u6211\u5dee\u5514\u591a\u6a23\uff0c\u6211\u771f\u5fc3\u89ba\u5f97\u4fc2\u597d\u7280\u5229\uff01\u6211\u55f0\u500b\u5e74\u4ee3\u5187\u4e5c\u597d\u591a\u5462\u5572\u5622\u35ce\u561b\uff0c\u540c\u57cb\u6211\u5de1\u6f14\u5605\u6642\u5019\uff0c\u4f62\u54cb\u6703\u5b89\u6392\u597d\u591a\u5622\u98df\uff0c\u53c8\u6709\u9910\u8eca\uff0c\u611f\u53d7\u5230\u800c\u5bb6\u539f\u4f86\u5572\u5076\u50cf\u6d3e\u6b4c\u624b\u5605\u5f85\u9047\uff0c\u591a\u8b1d\u4f62\u54cb\u4ee4\u6211\u611f\u53d7\u5230\u6211\u4ef2\u672a\u6709\u540c\u5462\u500b\u6642\u4ee3\u812b\u7bc0\u3002\u300d\"",
  "\"\u795e\u5947\u96fb\u8996\u6a5f \u5730\u9ede\u767c\u751f\u5728\u65af\u91cc\u862d\u5361\uff0c\u9152\u5e97\u540d\u7a31\u5df2\u5fd8\u8a18\uff01
  \u7b49\u6211\u5f62\u5bb9\u9152\u5e97\u623f\u9593\u5148\uff0c\u5929\u82b1\u5187\u540a\u71c8\uff0c\u5169\u76de\u5e8a\u982d\u71c8\u7576\u4e2d\uff0c\u5176\u4e2d\u4eba\u76de\u6c92\u6709\u71c8\u81bd\uff0c\u6240\u4ee5\u6210\u9593\u623f\u597d\u660f\u6697\uff01\u5ec1\u6240\u7684\u5927\u93e1\u5931\u8e64\u4e86\uff01\u8001\u5be6\u8aaa\u6210\u9593\u623f\u9670\u9670\u6c89\u6c89\u3002
  \u5165\u5230\u623f\u9593\u670b\u53cb\u6c96\u6dbc\uff0c\u800c\u6211\u5750\u5728\u5e8a\u908a\u7747\u96fb\u8996\u3002\u3002\u602a\u4e8b\u958b\u59cb\u767c\u751f\uff0c\u6b63\u7576\u6211\u670b\u53cb\u958b\u6c34\u5589\u6c96\u6dbc\u7684\u6642\u5019\uff0c\u7a81\u7136\u505c\u4e86\u96fb\uff0c\u800c\u6211\u5373\u523b\u651e\u96fb\u7b52\u51fa\u569f\u7167\uff01\u539f\u672c\u7747\u7dca\u96fb\u8996\u7b2c\u4e00\u53f0\uff0c\u56e0\u70ba\u505c\u96fb\u95dc\u4fc2\u96fb\u6e90\u4e2d\u65b7\uff01
  \u9694\u4e86\u6578\u5206\u9418\u96fb\u529b\u56de\u5fa9\u6b63\u5e38\uff0c\u4f46\u4fc2\u6211\u539f\u672c\u7747\u958b\u7684\u96fb\u8996\u7531\u7b2c\u4e00\u53f0\u81ea\u52d5\u8f49\u53bb\u7b2c\u4e8c\u53f0\uff0c\u9694\u4e86\u5341\u5206\u9418\u53c8\u505c\u96fb\uff0c\u96fb\u529b\u56de\u5fa9\u6b63\u5e38\u5f8c\uff0c\u96fb\u8996\u7531\u7b2c\u4e8c\u53f0\u81ea\u52d5\u8f49\u53bb\u7b2c\u4e09\u53f0\uff0c\u9694\u4e86\u5341\u5206\u9418\u53c8\u505c\u96fb\uff0c\u96fb\u529b\u56de\u5fa9\u6b63\u5e38\u5f8c\uff0c\u96fb\u8996\u7531\u7b2c\u4e09\u53f0\u81ea\u52d5\u8f49\u53bb\u7b2c\u56db\u53f0\uff01\u5982\u6b64\u985e\u63a8\u3002\u3002
  \u76f4\u5230\u6211\u670b\u53cb\u6c96\u5b8c\u6dbc\u51fa\u4f86\u4e4b\u5f8c\u96fb\u8996\u6a5f\u5c31\u6c92\u6709\u518d\u81ea\u52d5\u8f49\u53f0\uff01\u6c92\u6709\u518d\u505c\u96fb\u4e86\uff01\u5230\u5e95\u662f\u751a\u9ebc\u4e00\u56de\u4e8b\uff1f
  \u8f38\u5230\u6211\u6c96\u6dbc\uff0c\u5187\u505c\u96fb\uff0c\u96fb\u8996\u6a5f\u5187\u81ea\u52d5\u8f49\u53f0\uff01\\n\u6211\u597d\u773c\u8a13\u5514\u597d\u652a\u6211
  \u5728\u7d04\u65e6\u7684\u6b7b\u6d77\u4e00\u9593\u4e94\u661f\u7d1a\u9152\u5e97\uff0c\u9152\u5e97\u540d\u4e0d\u65b9\u4fbf\u900f\u9732\uff0c\u7e3d\u4e4b\u5927\u90e8\u4efd\u4eba\u90fd\u6703\u807d\u904e\u5462\u9593\u9152\u5e97\u540d\u3002
  \u9152\u5e97\u6bcf\u4e00\u5c64\u90fd\u6709\u9732\u53f0\uff0c\u6bcf\u65e5\u53ef\u4ee5\u7747\u65e5\u843d\uff0c\u74b0\u5883\u8212\u9069\uff0c\u6b7b\u6d77\u662f\u9152\u5e97\u7bc4\u570d\u4e4b\u4e00\uff0c\u4f4f\u5ba2\u597d\u65b9\u4fbf\u53ef\u4ee5\u7121\u6642\u7121\u523b\u505a\u5929\u7136\u6d77\u5e95\u6ce5\u9762\u819c\u3002
  \u6211\u4f4f\u679c\u4e00\u5c64\u662f\u5730\u7262\uff0c\u6709\u4e00\u665a\u6b63\u5728\u751c\u5922\u4e2d\u7684\u6211\uff0c\u7279\u7136\u6709\u9663\u98a8\u5728\u6211\u8033\u908a\u5927\u529b\u5439\uff0c\u6211\u9192\u4e86\u62ac\u982d\u4e00\u671b\uff0c\u898b\u5230\u4e00\u500b\u7537\u4eba\u5750\u5728\u6211\u5e8a\u908a\u7b11\u7740\u540c\u6211\u8b1b\u8aaa\u8a71\uff0c\u6211\u5514\u77e5\u4f62\u8b1b\u4e5c\uff0c\u6211\u671b\u4e00\u671b\u500b\u9418\u53c8\u4fc2\u4e09\u9ede\uff0c\u4e09\u9ede\u9418\u4fc2\u6211\u6642\u904b\u8f03\u5f31\u7684\u6642\u8fb0\uff01
  \u6211\u77e5\u9053\u5462\u500b\u7537\u4eba\u80af\u5b9a\u4fc2\u9b3c\uff0c\u56e0\u70ba\u4f62\u53ea\u5f97\u4e0a\u534a\u8eab\uff0c\u800c\u6211\u7576\u6642\u592a\u7d2f\uff0c\u5187\u5fc3\u60c5\u53bb\u9a5a\uff01\u6211\u53ea\u4fc2\u593e\u96dc\u7c97\u53e3\u540c\u4f62\u8b1b\u300c\u5514\u597d\u652a\u6211\u4ec6\u8857\uff0c\u6211\u597dx\u773c\u8a13\uff0c\u807d\u65e5\u6668\u65e96\u9ede
  Morning call\u300d\u4e4b\u5f8c\u6211\u7e7c\u7e8c\u8a13\u3002 \u6211\u8b1b\u5b8c\u53eb\u4f62\u5514\u597d\u652a\u6211\u4e4b\u5f8c\uff0c\u611f\u89ba\u5f35\u5e8a\u5187\u4e86\u805a\u529b\uff0c\u6211\u77e5\u9053\u5462\u96bb\u91ce\u5df2\u7d93\u8d70\u5de6\u3002\\n\u5947\u602a\u6728\u677f\u5929\u4e0a\u98db
  \u6545\u4e8b\u767c\u751f\u5728\u52a0\u62ff\u5927\u591a\u502b\u591a\uff0c\u5730\u65b9\u540d\u53ebOld
  Finch\u3002 Old Finch \u90e8\u4efd\u4fc2\u55ae\u7a0b\u8def\u884c\u99db\uff0c\u665a\u4e0a\u6c92\u6709\u8857\u71c8\u975e\u5e38\u6f06\u9ed1\uff0c\u597d\u591a\u5409\u5c4b\u6c92\u4eba\u4f4f\uff0c\u597d\u591a\u8352\u5ee2\u820a\u5c4b\uff0c\u5730\u65b9\u771f\u7684\u6bd4\u8f03\u9670\u68ee\u6050\u6016\uff01\u8981\u53bb\u63a2\u96aa\u9996\u5148\u7d93\u904e\u4e00\u689d\u53e4\u8001\u9435\u6a4b\uff0c\u9435\u6a4b\u5beb\u4e0a\u4e00\u500b\u724c\u574a\u53eb\u505a\u300cOld
  Finch\u300d \u6709\u665a\u540c\u4e00\u73ed\u670b\u53cb\u9f4a\u9f4a\u53bb\u63a2\u96aa\uff0c\u6642\u9593\u5927\u7d04\u51cc\u6668\u4e09\u56db\u9ede\uff0c\u6211\u5730\u4e00\u884c\u5341\u6578\u4eba\u6e23\u8eca\u5165\u53bb\uff0c
  \u6211\u540c\u5927\u5bb6\u8b1b\u4e0d\u5982\u5927\u81bd D \u843d\u8eca\u884c\u4ef2\u523a\u6fc0
  \uff0c\u8eca\u505c\u6cca\u5728\u8857\uff0c\u9014\u7d93\u4e00\u500b\u516c\u5712\u6211\u63d0\u8b70\u884c\u5165\u53bb\uff01
  \u597d\u9ed1\u5187\u71c8\u5149\uff0c\u5927\u5bb6\u53c8\u9a5a\u53c8\u8981\u63a2\u96aa\uff0c\u53c8\u5187\u5e36\u96fb\u7b52\uff01
  \u6211\u884c\u6700\u982d\uff0c\u5514\u77e5\u4ec0\u9ebc\u4e8b\u5f9e\u5929\u800c\u964d\u4e00\u584a\u5927\u6728\u677f\u62cd\u843d\u6211\u982d\u9802\uff0c\u62ac\u982d\u671b\u56db\u65b9\u516b\u9762\u5187\u53ef\u80fd\u6703\u6709\u6728\u677f\uff0c\u662f\u4e00\u584a\u5927\u7a7a\u5730\uff0c\u9023\u6a39\u90fd\u5187\u4e00\u68f5\uff0c\u5176\u4e2d\u4e00\u500b\u670b\u53cb\u8a71\u597d\u90aa\uff0c\u53ef\u80fd\u63d0\u9192\u6211\u5730\u5514\u597d\u518d\u884c\uff0c\u4e0d\u5982\u5927\u5bb6\u8d70\u5566\u3002
  \u6211\u6709\u8ad7\u904e\u6703\u5514\u6703\u4fc2\u670b\u53cb\u6574\u8831\u6211\uff0c\u4f46\u76f8\u4fe1\u5187\u53ef\u80fd\uff0c\u56e0\u70ba\u584a\u6728\u677f\u4fc2\u76f4\u843d\u6211\u982d\u9802\uff0c\u5514\u4fc2\u5176\u4ed6\u4f4d\u7f6e\u6458\u904e\u4f86\uff0c\u6728\u677f\u597d\u5927\u5982\u679c\u670b\u53cb\u6574\u8831\u6211\u4e00\u5b9a\u6703\u898b\u5230\uff0c\u6839\u672c\u5514\u6703\u6536\u5f97\u57cb\u3002
  \u6211\u53bb\u904e\u5e7e\u6b21\u5462\u500b\u5730\u65b9\uff0c\u90fd\u6709\u4e0d\u53ef\u601d\u8b70\u7684\u4e8b\u767c\u751f\uff0c\u4f60\u6709\u5187\u8a66\u904e\u554a\uff1f\\n\u5ec1\u6240\u597d\u9b3c
  \u5bd2 2013\u5e74\u7684\u8fb2\u66c6\u65b0\u5e74\u540c\u670b\u53cb\u4e00\u9f4a\u53bb\u6fb3\u6d32\u7684\u300c\u5854\u65af\u66fc\u5c3c\u4e9e\u300d\u7576\u6642\u662f\u590f\u5b63\uff0c\u6709\u4e00\u665a\u5165\u4f4f\u7684\u9152\u5e97\uff0c\u5165\u5230\u623f\u9593\u6574\u9ad4\u611f\u89ba\u597d\u8212\u670d\uff0c\u623f\u9593\u958b\u7740\u6696\u6c23\uff0c\u5ec1\u6240\u5730\u677f\u958b\u4e86\u767c\u71b1\u7dda\u611f\u89ba\u597d\u6696\uff01
  \u6211\u6709\u500b\u7fd2\u6163\u5165\u5230\u623f\u9593\u7b2c\u4e00\u6642\u9593\u5927\u641c\u67e5\uff0c\u6aa2\u67e5\u623f\u9593\u5187\u7279\u5225\u7570\u6a23\uff0c\u5165\u5230\u5ec1\u6240\u60f3\u6d17\u500b\u9762\u7a81\u7136\u6709\u7a2e\u5514\u8212\u670d\u5605\u611f\u89ba\u6bdb\u9aa8\u609a\u7136\uff0c\u5168\u8eab\u6253\u51b7\u9707\uff0c\u611f\u89ba\u597d\u9670\u6dbc\uff0c\u5fc3\u597d\u5bd2\u6709\u9ede\u5514\u59a5\uff0c\u7acb\u5373\u96e2\u958b\u5ec1\u6240\uff0c\u540c\u670b\u53cb\u8b1b\u300c\u6211\u89ba\u5f97\u6709\u9ede\u5514\u59a5\u9ede\u89e3\u958b\u7740\u6696\u6c23\u6703\u6709\u4e00\u7a2e\u9670\u98a8\u9707\u9707\u611f\u89ba\u300d\u670b\u53cb\u807d\u5b8c\u90fd\u5165\u5ec1\u6240\u770b\u770b\uff0c\u63a5\u7740\u670b\u53cb\u5728\u624b\u888b\u53d6\u51fa\u4e00\u5f35\u6709\u89c0\u97f3\u5716\u50cf\u7684\u5361\uff0c\u653e\u5728\u5169\u5f35\u5e8a\u4e2d\u9593\u7684\u5e8a\u982d\u6ac3\u4e0a\uff0c\u800c\u6211\u5c31\u5c07\u96a8\u8eab\u651c\u5e36\u7684\u300c\u8c94\u8c85\u300d\u653e\u5728\u5ec1\u6240\uff0c\u9694\u4e86\u4e00\u9663\uff0c\u539f\u5148\u7684\u6bdb\u9aa8\u609a\u7136\u6253\u51b7\u9707\u7684\u611f\u89ba\u5168\u6d88\uff0c\u6210\u9593\u623f\u4054\u7c92\u7c92\u3002
  \u5f9e\u90a3\u5929\u8d77\uff0c\u6211\u8eab\u4e0a\u5514\u55ae\u6b62\u6709\u8c94\u8c85\uff0c\u4ef2\u6703\u5e36\u5b9a\u597d\u591a\u5361\u508d\u8eab\u4e0d\u904e\u5514\u4fc2\u4fe1\u7528\u5361\uff0c\u4fc2\u8056\u6bcd\u5361\uff0c\u89c0\u97f3\u5361\uff0c\u4f5b\u50cf\u5361\uff0c\u7e3d\u4e4b\u5c31\u4fc2\u5468\u8eab\u5361\uff01\\n\u9b3c\u9418\u610f\u807d\u4f60\u8b1b
  \u6709\u4e00\u6bb5\u6642\u9593\u505a\u4e00\u500b\u7db2\u53f0\u7bc0\u76ee\u4e3b\u6301\u300c\u8b1b\u9748\u7570\u602a\u8ac7\u771f\u4eba\u771f\u4e8b\u9b3c\u6545\u4e8b\u300d
  \u6211\u4fc2\u4e00\u500b\u6bd4\u8f03\u5bb9\u6613\u5c0d\u9748\u754c\u7522\u751f\u611f\u89ba\u5605\u4eba\uff01
  \u9304\u97f3\u5ba4\u4f4d\u65bc\u4e00\u9593\u6b77\u53f2\u60a0\u4e45\u8d85\u904e40\u5e74\u6a13\u9f61\u7684\u7063\u4ed4\u4e00\u68df\u5546\u696d\u5927\u5ec8\uff0c\u6574\u68df\u5927\u5ec8\u6c92\u6709\u7279\u5225\u7ffb\u8eab\u6240\u4ee5\u53e4\u820a\uff0c\u9670\u9670\u6c89\u6c89\u71c8\u5149\u4e0d\u592a\u591a\u3002
  \u8a18\u5f97\u7b2c\u4e00\u6b21\u53bb\u9304\u97f3\u5ba4\u4e00\u51fa\u96fb\u68af\uff0c\u6709\u7a2e\u83ab\u540d\u5176\u5999\u7684\u4e0d\u8212\u670d\u611f\uff0c\u6d17\u624b\u9593\u662f\u516c\u773e\u5605\u5728\u8d70\u5eca\u76e1\u982d\u89d2\u843d\u982d\uff0c\u8fd1\u6a13\u68af\u4f4d\u7f6e\uff0c\u6bcf\u4e00\u6b21\u53bb\u6d17\u624b\u9593\u90fd\u611f\u89ba\u6709\u7a2e\u9670\u6c23\u4f01\u5728\u8d70\u5eca\u5ec1\u6240\u9580\u53e3\uff0c\u66f4\u6050\u6016\u662f\u6709\u584a\u5927\u93e1\u5b50\u639b\u5728\u7246\u4e0a\u9762\u5411\u7740\u6d17\u624b\u9593\uff0c\u7e3d\u4e4b\u4e00\u6253\u958b\u9580\u4e00\u5b9a\u6703\u898b\u5230\u584a\u93e1\u3002
  \u6bcf\u6b21\u6211\u90fd\u76e1\u91cf\u5514\u60f3\u53bb\u6d17\u624b\u9593\u4f46\u4fc2\u6709\u4e0d\u80fd\u5920\uff0c\u56e0\u70ba\u9304\u97f3\u6642\u9593\u6bcf\u6b21\u6700\u5c11\u4e09\u500b\u9418\u6216\u4ee5\u4e0a\uff0c\u6642\u9593\u5fc5\u5b9a\u8d85\u904e\u51cc\u666812\u6642\uff01\u800c\u6bcf\u6b21\u53bb\u6d17\u624b\u9593\u90fd\u4fc2\u6709\u540c\u4e00\u611f\u89ba\u6709\u4eba\u4f01\u5728\u9580\u53e3\uff0c\u9084\u4e0d\u6b62\u4e00\u500b\u4eba\u6709\u7a2e\u611f\u89ba\u4fc2\u4e00\u5927\u4e00\u7d30\uff0c\u6709\u7537\u6709\u5973\u3002
  \u6211\u4e00\u76f4\u90fd\u5187\u51fa\u8072\u6015\u9a5a\u52d5\u5176\u4ed6\u4eba\uff01
  \u66fe\u7d93\u6709\u4eba\u8b1b\u904e\uff0c\u597d\u591a\u9670\u9593\u5605\u7269\u9ad4\u937e\u610f\u807d\u6536\u97f3\u6a5f\uff0c\u96fb\u53f0\u6216\u96fb\u8996\u53f0\u7684\u5730\u65b9\u9670\u6c23\u8f03\u91cd\u3002
  \u8a18\u5f97\u6709\u4e00\u96c6\uff0c\u6211\u4fc2\u8b1b\u7dca\u4e00\u500b\u95dc\u65bc\u5858\u8857\u7684\u6545\u4e8b\uff0c\u7a81\u7136\u9593\u898b\u5230\u6709\u4e00\u500b\u7537\u6027\u534a\u900f\u660e\u7269\u9ad4\u7a7f\u904e\u7246\u58c1\uff0c\u7576\u6642\u56e0\u70ba\u9304\u7dca\u97f3\u8981\u626e\u93ae\u5b9a\u7e7c\u7e8c\u505a\u7bc0\u76ee\uff0c\u5230\u7bc0\u76ee\u5b8c\u4e86\uff0c\u5927\u5bb6\u4e00\u9f4a\u98df\u6d88\u591c\uff0c\u7a81\u7136\u6709\u4e00\u500b\u62cd\u6a94\u8a71\u5728\u9304\u97f3\u671f\u9593\u898b\u5230\u6709\u91ce\uff0c\u6211\u8d81\u6a5f\u6703\u5373\u523b\u63a5\u7740\u8a71\u6211\u90fd\u898b\u5230\uff0c\u9ede\u77e5\u8ca0\u8cac\u63a7\u5236\u9304\u97f3\u7684\u62cd\u6a94\u8a71\uff0c\u679c\u500b\u534a\u900f\u660e\u7684\u7537\u4eba\u5750\u5728\u6211\u9694\u96e2\u597d\u8010\uff0c\u4e00\u8def\u807d\u4f4f\u6211\u8b1b\u5622\uff0c\u76f4\u5230\u6211\u8b1b\u5b8c\u5858\u8857\u7684\u6545\u4e8b\u7747\u4f4f\u4f62\u7a7f\u7246\u8d70\uff01
  \u56e0\u70ba\u500b\u7bc0\u76ee\u6211\u6709\u4efd\u505a\u4e3b\u6301\uff0c\u5c31\u7b97\u5e7e\u9a5a\u90fd\u5514\u53ef\u4ee5\u7a81\u7136\u96e2\u958b\uff0c\u903c\u4f4f\u505a\u5b8c\u4e09\u500b\u6708\u5148\u96e2\u958b\uff0c\u77e5\u5f8c\u9748\u7570\u7bc0\u76ee\u5514\u597d\u652a\u6211\uff01
  \u4e8b\u9694\u534a\u5e74\uff0c\u807d\u805e\u642c\u9304\u97f3\u5ba4\uff0c\u539f\u4f86\u4ed6\u5011\u4e00\u65e9\u4e5f\u767c\u73fe\u6d17\u624b\u9593\u6709\u91ce\uff0c\u4f46\u56e0\u70ba\u79df\u7d04\u671f\u672a\u6eff\u5514\u8d70\u5f97\u552f\u6709\u5fcd\u8010\uff0c\u5230\u5408\u7d04\u6eff\u800c\u53c8\u627e\u5230\u9069\u5408\u5730\u65b9\u6240\u4ee5\u642c\u3002\\n\u9ed1\u8000\u77f3\u7684\u529b\u91cf
  \u6211\u5e36\u9ed1\u8000\u77f3\u8d85\u904e20\u5e74\uff0c\u66fe\u7d93\u807d\u904e\u9ed1\u8000\u77f3\u53ef\u4ee5\u8f9f\u90aa\uff0c\u64cb\u5c0f\u4eba\uff0c\u5c07\u6240\u6709\u9ed1\u904b\u6d17\u53bb\u3002
  \u9ed1\u8000\u77f3\u6700\u597d\u89aa\u81ea\u9078\u64c7\uff0c\u597d\u8b1b\u7de3\u4efd\u300c\u597d\u8b1b\u773c\u7de3\u300d\u3002
  \u6211\u5514\u5426\u8a8d\u81ea\u5df1\u8ff7\u4fe1\uff0c\u5c31\u7576\u4e00\u53e5\u300c\u4fe1\u8005\u5f97\u6551\u300d\u5427\uff01
  \u6709\u4eba\u8b1b\u904e\uff0c\u5047\u5982\u81ea\u5df1\u5e36\u958b\u7684\u9ed1\u8000\u77f3\u7a81\u7136\u65b7\u958b\uff0c\u77f3\u7206\u958b\uff0c\u9ed1\u8272\u8b8a\u70ba\u7070\u767d\u8272\u3001\u5149\u6fa4\u8b8a\u70ba\u555e\u8272\u3001\u539f\u6709\u7684\u773c\u775b\u5931\u53bb\u4e86\uff0c\u4e00\u5b9a\u8981\u6389\u5514\u597d\u8981\uff01
  \u6211\u6709\u505a\u7db2\u53f0\uff0c\u5176\u4e2d\u4e00\u500b\u7bc0\u76ee\u662f\u8b1b\u9748\u7570\u4e8b\u4ef6\uff01\u6709\u665a\u6211\u540c\u53e6\u4e00\u4f4d\u4e3b\u6301\u300c\u4ed6\u662f\u4e00\u4f4d\u6cd5\u5e2b\u300d\u5728\u7bc0\u76ee\u4e2d\u8b1b\u8d77\u81ea\u5df1\u7684\u7d93\u6b77\uff0c\u505a\u5b8c\u7bc0\u76ee\u6cd5\u5e2b\u53eb\u6211\u4ffe\u624b\u4e0a\u7684\u9ed1\u8000\u77f3\u4f62\u7747\uff0c\u7576\u6211\u4e00\u653e\u5728\u4ed6\u624b\u4e0a\u300c\u898b\u5230\u689d\u93c8\u4e0d\u65b7\u5728\u6cd5\u5e2b\u624b\u638c\u4e0a\u8df3\uff0c\u6211\u53c8\u898b\u6cd5\u5e2b\u5c0d\u4f4f\u689d\u93c8\u4e0d\u65b7\u5ff5\u5492\u300d
  \u6211\u89ba\u5f97\u597d\u6050\u6016\u9ede\u89e3\u6703\u90c1\uff1f\u767c\u751f\u4ec0\u9ebc\u4e8b\uff1f
  \u6cd5\u5e2b\u53cd\u554f\u6211\uff1b\u9ede\u89e3\u53ef\u4ee5\u5481\u5229\u5bb3\uff0c\u689d\u93c8\u6709\u5e7e\u96bb\u91ce\u5728\u5165\u9762\uff0c\u800c\u6211\u4e00\u76f4\u90fd\u5514\u77e5\u5e36\u5728\u8eab\u908a\uff0c\u4f62\u4e00\u653e\u4e0a\u624b\u5df2\u7d93\u89ba\u5f97\u597d\u91cd\uff0c\u982d\u75db\uff01\u9ede\u89e3\u6211\u5b8c\u5168\u5187\u611f\u89ba\uff1f
  \u6cd5\u5e2b\u5ff5\u5b8c\u7d93\u6bd4\u756a\u689d\u93c8\u6211\u4e00\u5e36\u4e0a\u624b\u611f\u89ba\u597d\u5947\uff0c\u597d\u8f15\uff0c\u689d\u93c8\u5b8c\u5168\u5187\u91cd\u91cf\uff01\u6cd5\u5e2b\u8a71\u6897\u4fc2\u5566\u8d95\u8d70\u6652\uff01
  \u6cd5\u5e2b\u540c\u6211\u8b1b\u672c\u8eab\u9ed1\u8000\u77f3\u4fc2\u4fdd\u8b77\u4e3b\u4eba\uff0c\u5047\u82e5\u9ed1\u8000\u77f3\u5df2\u7d93\u5931\u53bb\u529f\u6548\uff0c\u5b83\u4e0d\u55ae\u6b62\u5514\u80fd\u5920\u5e6b\u5230\u4e3b\u4eba\uff0c\u53cd\u800c\u6703\u5bb9\u6613\u5438\u53d6\u4e0d\u4e7e\u6de8\u7684\u4e0a\u8eab\u3002
  \u6700\u7d42\u6211\u6389\u4e86\uff0c\u8cb7\u904e\u4e00\u689d\u65b0\u7684\uff01\\n\u5858\u8857\u5514\u7c21\u55ae\u771f\u4fc2
  \u731b \u5982\u679c\u6709\u7559\u610f\u6211\u5beb\u904e\u7684\u6587\u7ae0\uff0c\u90fd\u6703\u7747\u904eNeway
  Karaoke\uff0c\u4eca\u6b21\u6545\u4e8b\u767c\u751f\u90fd\u4fc2\u5728\u540c\u4e00\u5730\u65b9\u5858\u8857\u7684Neway\uff0c\u81ea\u6b64\u4e4b\u5f8c\u6211\u5187\u518d\u8e0f\u8db3\u904e\u534a\u6b65\uff0c\u5be6\u5728\u592a\u731b\uff01
  \u81ea\u5f9e\u7d93\u6b77\u904e\u5531\u6b4c\u591a\u628a\u5973\u4eba\u8072\u4e4b\u5f8c\u5514\u6562\u518d\u53bb\uff0c\u4e8b\u9694\u5927\u534a\u5e74\uff0c\u6709\u73ed\u670b\u53cb\u5728\u5858\u8857Neway
  \u652a\u805a\u6703\uff0c\u6211\u6975\u4e4b\u4e0d\u9858\u610f\uff0c\u4f46\u53c8\u903c\u4e0d\u5f97\u5df2\u8981\u53c3\u52a0\uff01
  \u5927\u5bb6\u7d04\u597d\u4e86\u653e\u5de5\u5f8c\u5148\u5230\u5148\u56c9\u4f4d\uff0c\u6211\u540c\u4e00\u500b\u670b\u53cb
  6\u9ede\u534a\u5230\u4e86\u56c9\u5de6\u9593party room\uff0c\u5165\u5230\u623f\u5750\u4f4e\u5514\u592010\u5206\u9418\uff0c\u4e0d\u53ef\u601d\u8b70\u7684\u4e8b\u767c\u751f\u4e86\u3002\u3002\u3002
  \u6211\u9ede\u4e86\u6b4c\uff0c\u97f3\u6a02\u97ff\u8d77\u90fd\u672a\u958b\u59cb\u5531\u53ea\u662f\u6e23\u4f4fmic\uff0c\u6211\u53f3\u624b\u5e36\u4f4f\u7684\u9ed1\u8000\u77f3\u7a81\u7136\u7206\u958b\uff0c\u6bcf\u7c92\u77f3\u706b\u5c71\u7206\u767c\u4f3c\u7684\u56db\u6563\u6574\u9593\u623f\u6bcf\u500b\u89d2\u843d\uff0c\u6211\u7b2c\u4e00\u500b\u53cd\u61c9\u57f7\u756a\u8d77\u6240\u6709\u77f3\u888b\u8d77\u3002
  \u7b2c\u4e8c\u5929\uff0c\u6211\u5c07\u4ef6\u4e8b\u8b1b\u4ffe\u6cd5\u5e2b\u77e5\uff0c\u6cd5\u5e2b\u53eb\u6211\u4ffed\u77f3\u4f62\u7747\uff0c\u6cd5\u5e2b\u7747\u5b8c\u53eb\u6211\u4e1f\u5de6\u4f62\u5514\u597d\u518d\u5e36\uff0c\u5df2\u7d93\u5187\u6652\u6548\u529b\uff0c\u689d\u9ed1\u8000\u77f3\u7793\u8eab\u5e6b\u6211\u53d7\u6652\u9802\u6652\u50b7\u4e86\uff0c\u5982\u679c\u7576\u6642\u5187\u4ed6\u5728\u8eab\uff0c\u53ea\u6703\u649e\u5411\u6211\uff0c\u6211\u4e00\u4eba\u53d7\u6652\uff0c\u9084\u6709\u679c\u96bb\u91ce\u7df4\u529b\u597d\u6df1\u6240\u4ee5D\u77f3\u5df2\u7d93\u8017\u76e1\uff0c\u9ed1\u8000\u77f3\u7684\u751f\u547d\u5b8c\u4e86\u7531\u5149\u4eae\u9ed1\u8272\u8b8a\u7070\u555e\u9ed1\u8272\u3002\\n\u5531\u6b4c\u591a\u628a\u8072
  \u5e74\u4efd\u5df2\u5fd8\u8a18\u3002\u3002\u3002 \u6709\u4e00\u665a\uff0c\u540c\u4e00\u4f4d\u597d\u53cb\u53bb\u5510\u8857\u7684Neway\u5531K\uff0c\u7576\u665a\u6211\u5730\u7684\u623f\u9593\u662f\u5728\u4e8c\u6a13\uff0c\u623f\u9593\u8fd1\u6a13\u68af\u8f49\u89d2\u4f4d\u7f6e\uff0c\u8a18\u5f97\u679c\u9593\u623f\u6709\u597d\u591a\u73bb\u7483\u570d\u7e5e\u7740\uff0c\u53ea\u8981\u4e00\u8d77\u8eab\u96a8\u6642\u53ef\u4ee5\u7167\u93e1\uff01
  \u7576\u665a\u6211\u540c\u670b\u53cb\u5c31\u50cf\u7df4\u6b4c\u4e00\u6a23\uff0c\u6bcf\u4eba\u7368\u81ea\u8f2a\u6d41\u5531\u6b4c\uff0c\u4e00\u8def\u5531\u5440\u5531\u7a81\u7136\u6211\u540c\u670b\u53cb\u8b1b\u300c\u6211\u5730\u7368\u81ea\u5531\u5de6\u5481\u591a\u9996\u6b4c\uff0c\u4e0d\u5982\u4e0b\u4e00\u9996\u4e00\u9f4a\u5408\u5531\u5416\uff1f\u300d\u5728\u6211\u670b\u53cb\u672a\u56de\u7b54\u6211\u5605\u6642\u5019\uff0c\u591a\u5de6\u4e00\u628a\u597d\u6dd2\u53b2\u5605\u5973\u4eba\u8072\u611f\u89ba\u4e0a\u662f\u7d93\u904e\u54aa\u9ad8\u98a8\u5927\u53eb\u300c\u597d\u5416\u300d\u5c31\u5728\u6b64\u6642\u6211\u540c\u670b\u53cb\u5169\u500b\u4e92\u671b\u89ba\u5f97\u597d\u5947\u602a\uff0c\u9ede\u89e3\u591a\u5de6\u628a\u8072\uff1f\u800c\u6211\u5927\u81bd\u5730\u5373\u523b\u8d77\u8eab\u671b\u93e1\uff0c\u7747\u6703\u5514\u6703\u7747\u5230D\u5514\u61c9\u8a72\u7747\u5230\u5605\u7269\u9ad4\uff0c\u597d\u5f69\u4e5c\u90fd\u898b\u5514\u5230\uff01
  \u63a5\u7740\u6211\u5730\u9ede\u7684\u6b4c\u97f3\u6a02\u97ff\u8d77\uff0c\u6211\u540c\u670b\u53cb\u8b1b\u4e00\u4eba\u4e00\u53e5\uff0c\u5230\u526f\u6b4c\u5605\u6642\u5019\u4e00\u9f4a\u5408\u5531\u5416\uff01\u53c8\u518d\u4e00\u6b21\u6211\u670b\u53cb\u672a\u56de\u7b54\u6211\u5605\u6642\u5019\uff0c\u5148\u982d\u540c\u4e00\u628a\u6dd2\u53b2\u5605\u5973\u4eba\u8072\u56de\u61c9\u300c\u597d\u5416\u300d\u6211\u5730\u5169\u500b\u7e7c\u7e8c\u5531\uff0c\u771f\u4fc2\u4f60\u4e00\u53e5\u6211\u4e00\u53e5\uff0c\u526f\u6b4c\u5605\u6642\u5019\uff0c\u771f\u7684\u591a\u5de6\u628a\u5973\u4eba\u8072\u5531\u6b4c\uff01
  \u6211\u5f48\u8d77\u8eab\u5373\u523b\u958b\u71c8\u958b\u9580\uff0c\u7747\u524d\u5f8c\u9694\u96e2\u623f\u6709\u54a9\u4eba\u5531\u7dca\u6b4c\uff0c\u6703\u5514\u6703\u9694\u97f3\u592a\u5dee\u5176\u5be6\u9694\u96e2\u7684\u4eba\u5531\u6b4c\u5927\u8072\u3002
  \u6211\u767c\u73fe\u9644\u8fd1\u7684\u623f\u9593\u6839\u672c\u5187\u4eba\uff01\u6211\u5c31\u611f\u89ba\u5230\u5514\u59a5\u3002\u5373\u523b\u53eb\u57cb\u55ae\u8d70\u4eba\uff01
  \u76f4\u5230\u73fe\u5728\uff0c\u4ecd\u7136\u662f\u4e00\u500b\u8ff7\uff01\u5230\u5e95\u679c\u628a\u5973\u4eba\u8072\u4fc2\u4f86\u81ea\u4f55\u65b9\u795e\u8056\u5462\uff1f\\n\u6df1\u591c\u5341\u4e8c\u9ede
  \u6545\u4e8b\u767c\u751f\u57282004\u5e74\u7684\u4e00\u500b\u5fa9\u6d3b\u7bc0\u5047\u671f\uff0c\u5730\u9ede\u5728\u6d6e\u7f85\u4ea4\u6021\u7684\u4e00\u9593\u5728\u53e2\u6797\u5165\u9762\u7684\u4e94\u661f\u7d1a\u9152\u5e97\uff0c\u9152\u5e97\u4fc2\u7368\u7acb\u623f\u5c4b\uff0c\u6bcf\u9593\u623f\u7684\u8ddd\u96e2\u751a\u9060\uff0c\u7d66\u5927\u5bb6\u6709\u4e00\u500b\u5ee3\u95ca\u7a7a\u9593\uff0c\u540c\u884c\u9084\u6709\u5169\u500b\u5973\u6027\u670b\u53cb\u53c3\u52a0\u4e00\u500b\u9999\u6e2f\u4e94\u5929\u65c5\u884c\u5718\u3002
  \u65c5\u7a0b\u7b2c\u4e00\u5929\u884c\u7a0b\u7dca\u5bc6\uff0c\u98df\u5b8c\u665a\u98ef\u642d\u5b8c\u8eca\u53bb\u5230\u9152\u5e97\u5927\u5802check-in\u4e4b\u5f8c\u5df2\u7d93\u4fc2\u665a\u4e0a\u5341\u4e00\u9ede\u534a\uff0c\u5fc3\u611f\u4e0d\u5999\u5167\u5fc3\u6975\u70ba\u4e0d\u5b89\uff0c\u56e0\u70ba\u6bcf\u4e00\u9593\u623f\u8ddd\u96e2\u751a\u9060\uff0c\u9152\u5e97\u5b89\u6392\u5c08\u8eca\u9010\u9593\u623f\u53bb\uff0c\u591c\u9ebb\u9ebb\u6a39\u6797\u53c8\u591a\u9670\u6c23\u6975\u91cd\uff01
  \u6211\u5011\u4e09\u500b\u5973\u4ed4\u5206\u5169\u9593\u623f\uff0c\u4e00\u500b\u540c\u6211\u7793\uff0c\u53e6\u4e00\u500b\u8207\u5c0e\u904a\u540c\u623f\uff0c\u9152\u5e97\u8eca\u5230\u9054\u5c0e\u904a\u7684\u623f\u9593\u670b\u53cb\u843d\u4e86\u8eca\uff0c\u63a5\u7740\u99db\u5411\u6211\u5011\u7684\u623f\u9593\uff0c\u6211\u4e0d\u505c\u671b\u624b\u9336\uff0c\u6642\u9593\u5187\u9072\u5187\u65e9\u525b\u597d\u51cc\u666812\u9ede\u505c\u6cca\u5728\u6211\u5011\u7684\u623f\u9593\uff01\u6211\u5fc3\u5538\u5538\u6709\u8a5e\u4e0d\u65b7\u8aaa\uff1a\u5514\u4fc2\u9ebb\uff0c\u96f6\u6642\u96f6\u5206\u5165\u623f\u597d\u5514\u723d\uff01
  \u53bb\u5230\u9580\u53e3\u767c\u73fe\u670b\u53cb\u4f01\u5728\u6211\u623f\u9580\uff0c\u6211\u554f\u4f62\u54a9\u4e8b\u9ede\u89e3\u5514\u756a\u5165\u81ea\u5df1\u623f\uff1f\u670b\u53cb
  V\u5c0f\u59d0\u8a71\u4f62\u9593\u623f\u597d\u5927\u53c8\u597d\u6697\uff0c\u5c0e\u904a\u53c8\u5514\u55ba\u623f\uff0c\u60f3\u6211\u5730\u4e09\u500b\u540c\u4f4f\uff01
  \u6211\u6709\u500b\u7fd2\u6163\u6bcf\u9022\u53bb\u5230\u964c\u751f\u5730\u65b9\uff0c\u5165\u623f\u524d\u7b2c\u4e00\u6642\u9593\u6572\u9580\u5148\uff0c\u7136\u5f8c\u6703\u8b1b\u300c\u5514\u597d\u610f\u601d\u6253\u652a\u6652\uff0c\u6211\u55ba\u5ea6\u4f4f\u4e00\u5169\u665a\uff0c\u597d\u5feb\u8d70\u300d
  \u6b63\u7576\u6211\u8b1b\u5462\u53e5\u8aaa\u8a71\u5605\u6642\u5019\uff0cV\u5c0f\u59d0\u597d\u5927\u8072\u7b11\u4f4f\u8b1b\uff0c\u4f60\u505a\u4e5c\u5622\u554a\uff1f\u623f\u88cf\u9762\u6709\u4eba\u54a9\uff1f\u6572\u54a9\u9580\uff1f
  \u6211shu \u4f62\u4e00\u8072\uff0c\u53eb\u5514\u597d\u4e82\u8b1b\u91ce\uff01\u9ede\u77e5\u670b\u53cb\u4ef2\u5927\u81bd\uff0c\u4f62\u8a71\u300c\u4f60\u5514\u4fc2\u9a5a\u9b3c\u5440\uff1f\u908a\u6709\u5481\u591a\u9b3c\u67b6\uff1f\u300d
  \u6211\u5187\u91c7\u4f62\u5165\u5230\u623f\uff0c\u7167\u820a\u6210\u9593\u623f\u5927\u641c\u67e5\u770b\u770b\u6709\u5187\u8056\u7d93\u653e\u5728\u6ac3\u6876\uff0c\u7136\u5f8c\u6aa2\u67e5\u623f\u9593\u6709\u6c92\u6709\u554f\u984c\u3002
  V\u5c0f\u59d0\u6c96\u6dbc\u5148\uff0c\u6211\u540cA\u5c0f\u59d0\u5728\u623f\u9593\u4e00\u908a\u7747\u96fb\u8996\uff0c\u4e00\u908a\u57f7\u884c\u674e\uff0c\u4e00\u908a\u98df\u85af\u7247\uff01
  V\u5c0f\u59d0\uff0c\u6c96\u6dbc\u671f\u9593\u7a81\u7136\u5927\u53eb\u300c\u54a9\u4e8b\u5440\u6c96\u7dca\u6dbc\u5440\u300d
  \u6211\u8a71\uff1a\u6211\u5730\u5187\u51fa\u8072\u558e\uff01\u597d\u5febV\u5c0f\u59d0\u6c96\u5b8c\u6dbc\u51fa\u569f\uff0c\u554f\u6211\u540c
  A\u5c0f\u59d0\u982d\u5148\u6709\u5187\u62cd\u5ec1\u6240\u9580\uff1f \u6211\u8a71\uff1a\u5187\u558e\uff01\u6211\u5730\u4e00\u76f4\u90fd\u5606\u7dca\uff0c\u5187\u8d77\u8eab\uff01
  \u5230\u7b2c\u4e09\u665a\uff0c\u6211\u5730\u5728\u623f\u9593\u5439\u6c34\u98f2\u9152\u3002\u3002\u6211\u8a71\u300c\u5462\u9593\u623f\u597d\u8212\u670d\uff0c\u597d\u597d\u7793\uff0c\u672a\u8a66\u904e\u5728\u9152\u5e97\u623f\u4e00\u4e0a\u5e8a\u5514\u5920\u4e94\u79d2\u5c31\u5b8c\u5168\u719f\u7761\u4e00\u652a\u7793\u5929\u5149\uff01
