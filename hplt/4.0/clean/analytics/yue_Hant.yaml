  "\"\u3010\u767e\u65e5\u3001\u6eff\u6708\u8a08\u7b97\u65b9\u5f0f\u3011BB\u51fa\u4e16\u9ede\u8a08\uff1f
  \u6eff\u6708\u5bb4\u540c\u767e\u65e5\u5bb4\u90fd\u4fc2\u7236\u6bcd\u70baBB\u6176\u795d\u5605\u65e5\u5b50\uff0c\u7576\u7136\u8a08\u7b97\u6e96\u78ba\u4e00\u5572\u66f4\u597d\uff0c\u6240\u4ee5\u55ba\u5404\u5927\u5605\u89aa\u5b50\u8a0e\u8ad6\u5340\u90fd\u767c\u73fe\u6709\u5514\u5c11\u65b0\u751f\u7236\u6bcd\u90fd\u6709\u4e00\u500b\u7591\u554f\uff0c\u5c31\u4fc2bb\u6eff\u6708\u65e5\u9ede\u8a08\u6216BB\u767e\u65e5\u9ede\u8a08\uff1f\u70ba\u5de6\u6e96\u5099BB\u5605\u6eff\u6708\u5bb4\u6216\u767e\u65e5\u5bb4\uff0c\u7db2\u4e0a\u90fd\u6709\u4e00\u5572\u6e96\u78ba\u5481\u8a08\u7b97\u51faBB\u6eff\u6708\u6216BB\u767e\u65e5\u5605BB\u51fa\u751f\u767e\u65e5\u8a08\u7b97\u5668\u6216\u65b0\u751f\u5152\u6eff\u6708\u65e5\u671f\u8a08\u7b97\u65b9\u5f0f\u7b49\u7b49\u3002bb\u767e\u65e5\u8a08\u7b97\u6216bb\u6eff\u6708\u8a08\u7b97\u6700\u5927\u96e3\u984c\u5c31\u4fc2\u51fa\u4e16\u7576\u65e5\u4fc2\u8a08\u96f6\u65e5\u6216\u7b2c\u4e00\u65e5\u5462\uff1f\u4e00\u9f4a\u540c\u5927\u5bb6\u7747\u7747\u5566\uff5e\u55ba\u8a0e\u8ad6\u5340\u4e0a\uff0c\u6709\u5514\u5c11\u5bb6\u9577\u5c0d\u65bc\u9ede\u8a08BB\u51fa\u4e16\u7b2c\u4e00\u65e5\u5605\u7b54\u6848\u6709\u7531\u51fa\u751f\u65e5\u958b\u59cb\u8a08\u3001\u6211\u7b2c\u4e00\u65e5\u958b\u59cb\u8a08\u3001\u4fc2\u7531bb\u51fa\u4e16\u679c\u65e5\u8a08\u55ba\u7b2c\u4e00\u65e5\u2026\u767c\u73fe\u5927\u591a\u6578\u5605\u5bb6\u9577\u90fd\u4fc2\u7531BB\u51fa\u4e16\u65e5\u70ba\u7b2c\u4e00\u65e5\uff0c\u4f46\u90fd\u6709\u5bb6\u9577\u4ee5BB\u51fa\u4e16\u65e5\u53e6\u4e00\u65e5\u70ba\u7b2c\u4e00\u65e5\uff0c\u539f\u56e0\u70baBB\u51fa\u4e16\u6642\u4fc2\u665a\u4e0a\uff0c\u6240\u4ee5\u53e6\u4e00\u65e5\u5168\u65e5\u5148\u8a08\u4e0a\u7b2c\u4e00\u65e5\u3002\u800c\u6eff\u6708\u5605\u8a08\u7b97\u5c31\u5982\u4e0a\u9762\u8b1b\u89e3\u4e00\u6a23\u4ea6\u6709\u5206\u5225\uff0c\u4f8b\u5982BB\u51fa\u4e16\u7b2c\u4e00\u5929\u70ba\u4e94\u865f\uff0c\u6eff\u65e5\u5bb4\u8209\u884c\u65e5\u5b50\u70ba\u4e0b\u4e00\u6708\u7684\u4e94\u865f\uff0c\u4ea6\u6709\u4eba\u8a08\u7b97\u70ba\u4e0b\u4e00\u6708\u516d\u865f\uff0c\u56e0\u51fa\u751f\u65e5\u53e6\u4e00\u65e5\u5148\u70ba\u7b2c\u4e00\u65e5\u3002\u4e0d\u904e\u5982\u679c\u90fd\u4fc2\u592a\u64d4\u5fc3\u6700\u597d\u63d0\u524d\u8209\u884c\uff0c\u56e0\u55ba\u50b3\u7d71\u5605\u8ad7\u6cd5\u4e0a\uff0c\u751f\u65e5\u3001\u58fd\u5bb4\u7b49\u5605\u559c\u5bb4\u65e5\u5b50\u7dca\u4fc2\u5b9c\u65e9\u4e0d\u5b9c\u9072\uff0c\u5f8c\u88dc\u767e\u65e5\u5bb4\u55ba\u50b3\u7d71\u9ece\u8b1b\uff0c\u5c31\u5514\u592a\u5409\u5229\u5566\u3002\u7576\u7136\u5176\u5be6\u55ba\u6bcf\u4e00\u500b\u5bb6\u5ead\u90fd\u6709\u81ea\u5df1\u5605\u8a08\u7b97\u65b9\u5f0f\u540c\u7fd2\u4fd7\u50b3\u7d71\uff0c\u6700\u597d\u5605\u5efa\u8b70\u5c31\u4fc2\u8a62\u554f\u5bb6\u4e2d\u5605\u9577\u8f29\u5982\u4f55\u8a08\u7b97\u5c31\u6700\u597d\u5566\uff01\u4e00\u9ece\u5514\u6d17\u64d4\u5fc3\uff0c\u4e8c\u9ece\u53ef\u4ee5\u8ddf\u8fd4\u5bb6\u65cf\u50b3\u7d71\u3002\u53e6\u5916\u55ba\u8fd1\u5e74\u5927\u591a\u5bb6\u9577\u90fd\u559c\u6b61\u8209\u884c\u767e\u65e5\u5bb4\u591a\u65bc\u6eff\u6708\u5bb4\uff0c\u56e0\u767e\u65e5\u5f8c\u5605BB\u62b5\u6297\u529b\u6bd4\u6eff\u6708\u5f37\uff0c\u800c\u5abd\u5abd\u90fd\u53ef\u4ee5\u55ba\u751f\u7522\u5f8c\u56de\u5fa9\u9ad4\u529b\u3002\u52a0\u4e0a\u767e\u65e5\u5bb4\u5605\u6e96\u5099\u6642\u9593\u8f03\u591a\uff0c\u5514\u9700\u8981\u592a\u904e\u8d95\u6025\u3002\u767e\u65e5\u5bb4\u540c\u6eff\u6708\u5bb4\u5605\u76ee\u7684\u90fd\u5dee\u4e0d\u591a\uff0c\u90fd\u4fc2\u60f3BB\u53ef\u4ee5\u4e00\u6b21\u904e\u8ddf\u540c\u6240\u6709\u89aa\u53cb\u898b\u4e0b\u9762\uff0c\u4f46\u4fc2\u56e0\u75ab\u60c5\u5f71\u97ff\uff0c\u4eca\u5e74BB\u5605\u767e\u65e5\u5bb4\u53ef\u80fd\u8981\u55ba\u7db2\u4e0a\u8209\u884c\u5566\u3002\u4f46\u4fc2\u5982\u60f3\u6176\u795dBB\u767e\u65e5\uff0c\u76f8\u4fe1\u9664\u5de6\u8209\u884c\u767e\u65e5\u5bb4\u5916\uff0c\u4ea6\u6709\u5176\u5be6\u9078\u64c7\uff0c\u4f8b\u5982\u4fc2\u53ef\u4ee5\u70baBB\u62cd\u4e0b\u4e00\u8f2f\u767e\u65e5\u5beb\u771f\uff0c\u6709\u5514\u540c\u5605\u9020\u578b\u540c\u80cc\u666f\uff0c\u70ba\u5bb6\u9577\u53caBB\u7559\u4e0b\u767e\u65e5\u5605\u7f8e\u597d\u56de\u61b6\uff0c\u66f4\u52a0\u53ef\u4ee5\u5c07\u7167\u7247\u88fd\u6210\u8cc0\u5361\uff0c\u9001\u4ffe\u89aa\u670b\u621a\u53cb\uff01\u767e\u65e5\u5bb4\u6216\u6eff\u6708\u5bb4\u90fd\u4fc2\u70ba\u7948\u6c42BB\u672a\u4f86\u5065\u5065\u5eb7\u5eb7\uff0c\u5c31\u7b97\u56e0\u75ab\u60c5\u5f71\u97ff\u8209\u884c\u5514\u5230\uff0cBB\u90fd\u4e00\u5b9a\u6703\u5feb\u9ad8\u9577\u5927\uff01\"",
  "\"\u5c11\u5987\u6deb\u5b7d\u4e4b\u8d24\u59bb\u6148\u6bcd\u5b5d\u987a\u5973\uff0803\uff09\\n\uff30\uff2d\uff13\uff1a\uff13\uff10\u8001\u4eba\u9662\u7cfb\u5e7c\u7a1a\u56ed\u51fa\u569f\u6211\u55f1\u55f1\u58f0\u8fd4\u5c4b\u4f01\u6362\u886b\uff01\u5c11\u5987\u987a\u5973\u51fa\u569f\u5605\u65f6\u5019\u6211\u6362\u5497\u4ef6~\u97e9\u7248\u9614\u8eab\u788e\u82b1\u4f4e\uff36\u524d\u5f00\u80f8\u4e03\u5206\u8896\u7c89\u8272\u96ea\u7eba\u4e0a\u886b\u3002\u6deb\u5b7d\u4e0b\u9762\u5462~\u7cfb\u4e00\u6761\u97e9\u7248\u4fee\u8eab\u900f\u89c6\u857e\u4e1d\u9ad8\u8170\u5305\uff30\uff25\uff34\u4f4e\u8c03\u7248\u507b\u5c4c\u88d9\u3002\u59bb\u6148\u4f4e\u8c03\u507b\u5c4c\u88d9~\u54aa\u5527\u7cfb\u77ed\u5f97\u569f\u53c8\u65e0\u5481\u507b\u5c4c\u5570\uff01\u6bcd\u5b5d\u54c8\u54c8~\u569f\u5230\u65b0\u754c\u54e9\u95f4\u8001\u4eba\u9662\u5df2\u7ecf\u7cfb\u4e0b\u5348\u8336\u65f6\u95f4\uff0c\u5c11\u5987\u987a\u5973\u7747\u89c1\u697c\u4e0b\u4e00\u7684\u6deb\u5b7d\u72e0\u72e0\u72e0\u72e0\u72e0\u72e0\u72e0\u514d\u8d39\u89c6\u9891\u8001\u53cb\u8bb0\u7cfb\u82b1\u56ed\u4ed4\u5ea6\u671b\u5929\u6253\u5366\uff0c\u4e00\u4e2a\u4e2a\u597d\u4f3c\u7b49\u7d27\u4e0a\u5e1d\u53ec\u5524\u5481\uff0c\u59bb\u6148\u54e9\u7684\u6bcd\u5b5d\u5c31\u7cfb\u8001\u4eba\u9662\u5605\u6c14\u6c1b\uff01\u884c\u8fc7\u4e00\u4e2a\u5750\u8f6e\u6905\u5605\u5149\u5934\u963f\u4f2f\u8eab\u8fb9\uff0c\u5c11\u5987\u987a\u5973\u89c1\u4f62\u7b11\u6deb\u6deb\u5481\u76f5\u4f4f\u6211\uff0c\u6deb\u5b7d\u4e00\u9762\u54b8\u6e7f\u7325\u7410\uff0c\u59bb\u6148\u5c24\u5176\u7cfb\u4e0d\u505c\u76f5\u4f4f\u6211\u4e2a\u80f8\uff01\u6bcd\u5b5d\u6211\u5148\u81f3\u9192\u8d77\uff0c\u5c11\u5987\u987a\u5973\u539f\u6765\u5571\u5148\u4e3a\u5497\u8d76\u65f6\u95f4\uff0c\u6deb\u5b7d\u4e2d\u6587\u5b57\u5e55\u65e5\u97e9\u7cbe\u54c1\u7b2c\u4e00\u9875\u6211\u53ea\u7cfb\u9ed0\u5497\u4e73\u8d34\uff0c\u59bb\u6148\u7cfb\u6761\u4ef6\u8584\u5207\u5207\u5605\u96ea\u7eba\u4e0a\u886b\u91cc\u9762\uff0c\u4e00\u5bf9\uff25\u5976\u6beb\u65e0\u7ea6\u675f\uff0c\u7cfb\u6211\u884c\u8def\u5605\u65f6\u5019\u5c31\u4f1a\u5e78\u798f\u6469\u5929\u8f6e\u5481\u6837\u300c\u8fd9\u6837\u8ddf\u4f60\u8361\u6765\u8361\u53bb\uff0c\u65e0\u754f\u65e0\u60e7\u300d\uff01\u4e8e\u662f\u6211\u5571\u5148\u5165\u569f\u884c\u5feb\u51e0\u6b65\uff0c\u886b\u5165\u9762\u5c31\u6ce2\u6d9b\u6d8c\u52a8\u517c\u63c8\u569f\u63c8\u53bb\uff0c\u963f\u4f2f\u79bb\u8fdc\u4e0d\u98df\u55ee\u51b0\u6dc7\u6dcb\u5566\uff01\u7747\u5514\u51fa\u54e9\u4e2a\u5149\u55ee\u5934\u3001\u7529\u55ee\u7259\u5605\u963f\u4f2f\u773c\u529b\u597d\u6382\u5570\uff0c\u79bb\u8fdc\u5c31\u76f5\u4e2d\u6211\u5bf9\uff25\u5976\uff01\u5509~\u90fd\u8bdd\u7537\u4eba\u65e0\u5622\u53fb\uff0c\u6700\u53fb\u5c31\u7cfb\u76f5\u5973\u5676\u5566\uff01\u6b27\u7f8e\u7279\u8272aaa\u5927\u7247\u4e9a\u6d32\u5927\u7247\u4f46\u5514\u77e5\u70b9\u89e3\u5462\uff0c\u89c1\u5230\u4f62\u5c31\u89c9\u5f97\u53ef\u601c\uff0c\u4e0d\u5176\u7136\u884c\u5497\u57cb\u4f62\u5ea6\uff0c\u7136\u540e\u8e0e\u7cfb\u4f62\u8f6e\u6905\u524d~\u6211\u5514\u7cfb\u5b66\u6797\u90d1\u5481\u63de\u5f20\u5927\u725b\u51fa\u569f\u7540\u4f62\uff0c\u800c\u7cfb\u540c\u4f62\u597d\uff4e\uff49\uff43\uff45\u5481\u6253\u62db\u553f\u8bdd\u300c\u963f\u4f2f\uff0c\u4f60\u597d\u554a\uff0c\u59d1\u5a18\u5462\uff1f\u65e0\u4eba\u7747\u4f4f\u4f60\u5605\uff1f\u300d\u963f\u4f2f\u64d8\u5f00\u65e0\u7259\u5605\u53e3\u300c\u54e9\u54e9\u87ba\u87ba\u300d\u540c\u6211\u8bb2\u300c\u6211~\u6211\u597d\u7cbe\u795e\u5676\uff0c\u8001\u864e\u90fd\u6253\u6b7b\u548c\u53ea\uff0c\u5514\u4f7f\u4eba\u76f5\u4f4f\u5676\uff01\u563f\u563f~\u9753\u5973\uff0c\u4f60~\u4f60~\u4f60~\u300d\u963f\u4f2f\u5ffd\u7136\u5446\u5497\u8bb2\u5514\u5230\u5622\u5481\uff01\u6211\u5bf9\u4f62\u597d\u751c\u5481\u7b11\u5497\u7b11\u8bdd\uff1a\u300c\u6536\u5497\u65e5\u5934\u561e\uff0c\u98ce\u5927\u5440\uff0c\u56fd\u4ea7\u7cbe\u54c1\u7f8e\u5973\u4e45\u4e45\u4e45\u5267\u60c5\u4f60\u56e0\u4f4f\u6444\u4eb2\u554a\uff0c\uff22\uff59\uff45\uff22\uff59\uff45\uff01\u300d\u963f\u4f2f\u4f60~\u4f60~\u4f60~\u5481\u8bb2\u5514\u843d\u53bb\u7747\u5230\u6211\u771f\u7cfb\u597d\u60f3\u5927\u7b11\u51fa\u58f0\u3002\u4f62\u70b9\u89e3\u4f1a\u5481\uff1f\u56e0\u4e3a\u6211\u5571\u5148\u8e0e\u7cfb\u4f62\u8f6e\u6905\u524d\u9762\u5605\u65f6\u5019\u7cfb\u6545\u610f\u5c06\u4e0a\u8eab\u5411\u524d\u633a\uff0c\u5481\u6837\u4e00\u569f\u5462\uff0c\u6211\u5bf9\uff25\u5976\u5c31\u4e00\u5622\u9876\u4f4f\u5497\u963f\u4f2f\u4e24\u4e2a\u819d\u5934\u54e5\uff01\u8f6f\u814d\u814d\u6696\u7b20\u7b20\u5605\u4e73\u8089\u51e0\u4e4e\u8089\u8d34\u8089\u5481\u6342\u4f4f\u4f62\u4e24\u53ea\u819d\u5934\u54e5\uff1f\uff0c\u4f60\u8bdd\u4f62\u70b9\u4f1a\u5514\u723d\u5230\u5446\u5497\u517c\u65e0\u58f0\u51fa\u5416\uff01\u4e0d\u8fc7\u6211\u5514\u7cfb\u73a9\u4f62\u5605\uff0c\u7cfb\u60f3\u76ca\u4e0b\u4f62\u523a\u6fc0\u4e0b\u4f62\uff0c\u7b49\u54e9\u4e2a\u91cd\u6709\u300c\u6597\u5fd7\u300d\u5605\u8001\u4eba\u5bb6\u6709\u7684\u751f\u8da3\u3002\u65e0\u9519\uff0c\u6027\u7cfb\u4e00\u79cd\u751f\u5b58\u52a8\u529b\u569f\u5676\u561b\uff01\u7cbe\u54c1\u4e45\u4e45\u4e45\u9999\u854991\u54c7~\u5514\u7cfb\u554a\uff01\u626f\u65d7\uff1f\u5f53\u6211\u540c\u963f\u4f2f\u8bb2\u5b8c\u62dc\u62dc\u8d77\u8eab\u8981\u884c\u5f00\u5605\u65f6\u5019\uff0c\u4f62\u7adf\u7136\u651e\u624b\u6477\u843d\u81ea\u5df1\u88e4\u88c6\uff0c\u5373\u65f6\u6709\u53cd\u5e94\uff1f\u771f\u7cfb\u4f30\u4f62\u5514\u5230\u5570\uff01\u800c\u4e14\u963f\u4f2f\u5f53\u65f6\u91cd\u597d\u54b8\u6e7f\u5481\u671b\u4f4f\u6211\uff0c\u53ea\u624b\u91cd\u7cfb\u88e4\u88c6\u91cc\u9762\u4ff6\u4ff6\u4e0b\uff01\u6211\u70b9\u90fd\u6709\u7684\u6015\u4e11\u540c\u5c34\u5c2c\uff0c\u5373\u523b\u7cfb\u5481\u610f\u7b11\u7b11\u5c31\u6025\u6025\u811a\u884c\u5f00\u5497\uff01\u4e00\u8fb9\u8d70\u6211\u4e00\u8fb9\u611f\u89c9\u5230\u963f\u4f2f\u54b8\u6e7f\u6837\u540c\u76f5\u4f4f\u6211\u5605\u773c\u793e\uff0c\u6211\u77e5\u9053\u6211\u6761\u7d27\u8eab\u77ed\u88d9\u5305\u5230\u6da8\u535f\u535f\u5605\u7f8e\u81c0\u4e00\u5b9a\u4f1a\u4ee4\u4f62\u66f4\u52a0\u5174\u594b\uff01\u6b7b\u5566\uff0c\u7747\u4f62\u5481\u5927\u5e74\u7eaa\uff0c\u5e7b\u60f3\u6211\u569f\u6253\u98de\u673a\uff0c\u4f1a\u5514\u4f1a\u6253\u5230\u865a\u8131\u65e0\u547d\u5676\uff0c\u5982\u679c\u4f1a\u6211\u54aa\u7b49\u4e8e\u5bb3\u5497\u4f62\uff1f\u4e0d\u8fc7~\u4e0d\u8fc7\u5481\u90fd\u7cfb\u8212\u670d\u6b7b\u556b\uff0c\u4f62\u5f00\u5fc3\u4f4f\u5481\u8d70\uff0c\u90fd\u7b97\u5b89\u4e50\u5566\uff01\u54e9\u4e2a\u963f\u4f2f\u53e6\u6211\u8c02\u8d77\u5e7c\u7a1a\u56ed\u6821\u957f\uff0c\u8c02\u5514\u5230\u6821\u957f\u54e9\u4e2a\u5e74\u7eaa\u5605\u8001\u5751\u51fa\u5622\u7684\u4efd\u91cf\u5481\u52b2\u5676\uff01\u5571\u5148\u7cfb\u5c4b\u4f01\u9664\u4f4e\u6761\u88e4\u4e00\u7747\uff0c\u7684\u5012\u6d41\u51fa\u569f\u5605\u7cbe\u6db2\u6b47\u54d2\u54d2\uff0c\u641e\u5230\u6761\u9762\u88e4\u88e4\u90fd\u6e7f\u5497\u4e00\u7b2a\u3002\u5481~\u53c8\u5514\u53ef\u4ee5\u602a\u55ee\u6821\u957f\u5605\uff0c\u56e0\u4e3a\u6211\u90fd\u55b7\u5497\u5514\u5c11\u51fa\u569f\u5416\u561b\uff01\u563b\u563b\uff01\u8001\u516c~\u4f60\u771f\u7cfb\u7f9e\u5bb6\uff0c\u4f60\u8001\u5a46\u7540\u4e2a\u516d\u5341\u51e0\u5c81\u5605\u7537\u4eba\u7b2c\u4e00\u6b21\u641e\u5c31\u9ad8\u6f6e\u55b7\u5622.\u4f60\u5462\uff1f\u54c8\u54c8~\u771f\u7cfb\u54aa\u7747\u5c11\u7684\u8001\u4eba\u5bb6\u7684\u6027\u80fd\u529b\uff01\u4f60\u8bdd\u5514\u7cfb\u54a9\uff1f\u5481\u591a\u98ce\u5316\u6848\u4e4b\u4e2d\uff0c\u8001\u7237\u641e\u65b0\u62b1\u5514\u5c11\u5566\uff01\u5416\u4f60\u8bdd~\u8001\u4eba\u9662\u91cc\u9762\u5481\u591a\u8001\u5751~\u5514\u77e5\u7cfb\u54aa\u4f62\u7684\u4ed4\u6015\u4f62\u641e\u65b0\u62b1\u5462\uff1f\u54c8\u54c8~\u54c8\u54c8~\u6211\u8001\u7aa6\u4f4f\u7cfb\u4e09\u697c\uff0c\uff16\u533a\uff0c\u7b2c\uff18\u95f4\u5ba4\uff0c\uff19\u53f7\u5e8a\uff01\u7cfb\u6210\u95f4\u8001\u4eba\u9662\u6700\u597d\u4f4d\u7f6e\uff0c\u7a97\u5916\u671b\u5230\u5c71\uff0c\u5514\u8fd1\u9a6c\u8def\uff0c\u591f\u9759\uff01\u771f\u7cfb\u591a\u8c22\u6d77\u80c6\u53d4\u5570\uff0c\u54e9\u95f4\u8001\u4eba\u9662\u7cfb\u4e2d\u8d44\u4f01\u4e1a\u641e\u5676\uff0c\u4f62\u6258\u4eba\u60c5\u5e2e\u6211\u63fe\u5605\u3002\u5982\u679c\u53ea\u9760\u6211\u8001\u516c~\u6700\u591a\u7cfb\u53bb\u4e5d\u9f99\u63fe\u7684\u4e8c\u697c\u9662\u820d\u5570\uff01\u4e0a\u5230\u697c\u884c\u8fd1\u623f\u95f4\u5c31\u542c\u5230\u6709\u4eba\u5608\u7d27\uff01\u6211\u55f1\u55f1\u58f0\u884c\u8fc7\u53bb~\u569f\u5230\u95e8\u53e3\uff0c\u91cc\u9762\u4e00\u4e2a\u751f\u5230\u5434\u8000\u770b\u5481\u6837\u5605\u963f\u4f2f\u5c31\u7cfb\u6211\u8001\u7aa6\u3002\u5c31\u569f\u4e03\u5341\u5605\u4f62\u91cd\u7cfb\u706b\u7206\u517c\u5514\u597d\u8001\u813e\uff01\u4f46\u4f62\u4e00\u76f4\u597d\u9521\u6211\u5676\uff0c\u9b3c\u53eb\u6211\u7cfb\u4f62\u4e0a\u4e00\u4e16\u5605\u60c5\u4eba\u54a9\uff01\u5927\u4f6c\u540c\u963f\u5ac2\u79fb\u6c11\u52a0\u62ff\u5927\u4e4b\u540e\uff0c\u9a8c\u51fa\u6709\u65e9\u671f\u67cf\u91d1\u900a\u5605\u8001\u7aa6\u5c31\u5165\u569f\u54e9\u95f4\u8001\u4eba\u9662\u7597\u517b\uff0c\u4f62\u597d\u5514\u613f\u610f\u5676\uff0c\u56e0\u4e3a\u4f62\u4e00\u76f4\u60f3\u540c\u6211\u4e00\u9f50\u4f4f\uff0c\u7cfb\u597d\u60f3\u597d\u60f3\u55f0\u53ea\uff01\u4e0d\u8fc7\u6709\u5497\uff25\uff21\uff33\uff2f\uff2e\uff0c\u6211\u540c\u8001\u516c\u4f4f\u55f0\u95f4\u623f\u4ed4\u8fb9\u591f\u4f4f\u5416\u3002\u5176\u5b9e\u54e9\u5ea6\u73af\u5883\u5514\u9519\u5605\uff0c\u8001\u4eba\u5bb6\u6709\u4f34\u5605\u8bdd\u4e00\u5b9a\u597d\u8fc7\u4f4f\u5e02\u533a\uff0c\u4e0d\u8fc7\u504f\u504f\u9694\u79bb\u5e8a\u4f4f\u5497\u4e00\u4e2a\u51e0\u300c\u4e32\u300d\u5605\u963f\u4f2f\uff0c\u542c\u95fb\u7cfb\u5f53\u5e74\uff16\uff17\u6709\u529f\u5605\u8001\u5de6\uff1f\uff01\u6240\u4ee5\u54aa\u628a\u70ae\u5570\uff0c\u540c\u6211\u8001\u7aa6\u7ecf\u5e38\u9876\u5230\u62eb\uff0c\u5df2\u7ecf\u5514\u7cfb\u7b2c\u4e00\u6b21\u3002\u55f0\u9635\u542c\u8001\u7aa6\u5608\u4f4f\u8bdd\uff1a\u300c\u6211\u5514\u7406\u4f60\u54cb\u70b9\uff0c\u4e00\u7cfb\u6211\u4e00\u4e2a\u4eba\u4f4f\uff0c\u4e00\u7cfb\u6211\u8d70\uff01\u540c\u55f0\u6761\u5de6\u7528\u57cb\u4e00\u4e2a\u6d17\u624b\u95f4\uff0c\u4f62\u75fe\u5c4e\u597d\u637b\u81ed\u5676\uff0c\u4e00\u6b21\u81ed\u6210\u534a\u65e5\uff0c\u4f60\u77e5\u5514\u77e5\u6211\u51e0\u6076\u9876\uff0