  & Doom 2\u3002\u53ef\u80fd\u4f60\u6703\u8a71\uff0c\u6709\u4e5c\u5481\u597d\u73a9\uff1f\u5c31\u4fc2\u56e0\u70ba\uff0c\u5514\u4f7f\u7169\u3002\u800c\u5bb6\uff44game\u5c31\u4fc2\u592a\u771f\u5be6\u5587\uff0c\u6211\u90fd\u4fc2\u937e\u610f\u8d85\u73fe\u5be6\uff0c\u5187\u5f97\u671b\u9ad8\u671b\u4f4e\u3001\u5187\u5f97\u8df3\u5187\u5f97\u8e72\uff0c\u53c8\u5e7e\u500b\u63a3\u73a9\u6652\u6210\u96bbgame\uff0c\u6709\u4e5c\u5481\u597d\u73a9\uff1f\u5c31\u4fc2\u5e7e\u500b\u63a3\u73a9\u6652\u6210\u96bbgame\uff0c\u5514\u4f7f\u9867\u9ad8\u7747\u4f4e\u64d4\u5929\u671b\u5730\u98db\u9ece\u98db\u53bb\uff0c\u62ce\u4f4f\u652fshotgun\u885d\u904e\u767e\u5e7e\u96bb\u602a\u7269\u4e00\u91ce\u7206\u982d\uff0c\u4e5c\u53c9\u90fd\u5514\u4f7f\u7169\uff01\u5649\u5148\u5920old-school\u5649\u5148\u5920\u6b63\u5649\u5148\u5920cult\uff01\u6b63\u5982\u5468\u6f64\u767c\u96d9\u69cd\u9023\u958b\u4e8c\u767e\u5e7e\u767c\u90fd\u5514\u4f7f\u4e0a\u5f48\u4e00\u6a23\uff01\u6240\u4ee5\u9ede\u89e3Grindcore\u5481\u597d\u807d\uff01\\n\u300c\u7206\u5c31\u7206\u54aa\uff38\u7169\uff01\u300d\uff08\u53c8\u95dc\u4e8b\uff1f\u5649\u90fd\u5f97\uff1f\uff09\\n\u8d70\u5de6\u53bb\u597d\u9060\u8b1b\u5de6\u597d\u8010game\u53c8\u7121\u7aef\u7aef\u62c9\u5230\u53bbmetal\uff0c\u90fd\u4ef2\u672a\u8b1b\u5230Doom\u5957\u6232\u3002\u7d50\u679c\uff0c\u4fc2\u5931\u671b\u3002\u5dee\u5c11\u5c11\u8dcc\u5230\u53bb\u597d\u5931\u671b\u679c\u96bb\u3002\u4f60\u77e5\u5514\u77e5\u6211\u4e0a\u756b\u7b2c\u4e00\u65e5\u4e0a\u756b\u7acb\u5373\u53bb\u7747\uff1f\u5df2\u7d93\u5931\u671b\uff0c\u52a0\u57cb\u9593\u6232\u9662\u5514\u5f97\uff08\u8d85\u7d30\u9280\u5e55\u8d85\u5dee\u97f3\u97ff\uff09\uff0c\u7b97\u5566\u4ffe\u591a\u6b21\u6a5f\u6703\u5566\uff0c\u4e0a\u65b0\u4e16\u7d00\u7747\u591a\u6b21\u3002\u6211\u597d\u5c11\u6703\u6703\u5481\u7559\u610f\u5481\u95dc\u6ce8\u4e00\u5957\u6232\uff0c\u4e4b\u524d\u53e6\u4e00\u5957\u53c8\u4fc2\u5649\u6a23\u7747\u5169\u6b21\u4fc2AVP\uff0c\u53ea\u53ef\u60dc\uff0c\u5169\u5957\u90fd\u4fc2\u5931\u671b\u6536\u5834\uff0c\u5982\u679c