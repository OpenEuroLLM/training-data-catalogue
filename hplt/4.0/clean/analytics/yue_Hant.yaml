  2\u96bbgame\u4fc2\u53eb\\n\u96bbgame\u672c\u8eab\u5df2\u7d93\u4fc2\u5462\u500b\u540d\uff0c\u518d\u52a0\u57cb\u5957\u6232\u5649ending\uff0c\u4e0b\u4e00\u96c6\u6703\u4fc2\u9ede\uff0c\u5927\u6982\u4f30\u5230\u3002\u4e0d\u904e\uff0c\u53c8\u9a5a\u6703\u4f30\u5514\u5230\uff0c\\n\u300c\u54a9\u8a71\uff1f\u5649\u53c8\u53eb\u505aDoom\uff1f\u5bebgame\u679c\u73ed\u9ede\u89e3\u6703\u6bd4\u5957\u6232\u51fa\u8857\u67b6\uff1f\u300d\\n\uff08\u53c8\u4e00\u500b\u5275\u4f5c\u5de5\u696d\u7684\u60b2\u5287\uff0c\u505a\u6c7a\u7b56\u679c\u73ed\u6c38\u9060\u4fc2\u9580\u5916\u6f22\u7684\u9ad8\u5c64\u4eba\u58eb\uff0c\u800c\u5514\u4fc2\u5167\u884c\u7684\u5275\u4f5c\u4eba\uff09\"",
  "\"\u5bb6\u5c45\u4fdd\u96aa\u4fdd\u969c\u7bc4\u570d\u4e00\u822c\u90fd\u5305\u62ec\u8ca1\u7269\u540c\u500b\u4eba\u6cd5\u5f8b\u8cac\u4efb\u3002\u5982\u679c\u8981\u8cb7\u79df\u5ba2\u6216\u8005\u7f6e\u696d\u81ea\u4f4f\u5605\u696d\u4e3b\u9069\u7528\u7684\u5bb6\u5c45\u4fdd\u96aa\uff0c\u53ef\u4ee5\u7747\u8fd4\u4e4b\u524d\u7684\u5168\u6e2f\u5bb6\u5c45\u4fdd\u96aa\u6bd4\u8f03\u4e00\u6587\u3002\u81f3\u65bc\u7f6e\u696d\u653e\u79df\u5605\u696d\u4e3b\uff0c\u4f60\u54cb\u9700\u8981\u5605\u4fdd\u969c\u7bc4\u570d\u597d\u5514\u540c\uff0c\u4eca\u6b21\u5c31\u540c\u5927\u5bb6\u4ecb\u7d39\u5413\u5e02\u5834\u4e0a\u9069\u5408\u51fa\u79df\u696d\u4e3b\u7684
  \u51fa\u79df\u4fdd\u96aa \u8a08\u5283\uff01\\n\u51fa\u79df\u696d\u4e3b\u4fdd\u96aa\u540c\u4e00\u822c\u5bb6\u5c45\u4fdd\u96aa\u6709\u4e5c\u5206\u5225\uff1f\\n\u5e02\u5834\u4e0a\u6709\u5c08\u9580\u70ba\u51fa\u79df\u696d\u4e3b\u9700\u8981\u6253\u9020\u5605\u4fdd\u96aa\u8a08\u5283\uff0c\u4ea6\u90fd\u6709\u5514\u5c11\u4e00\u822c\u5bb6\u5c45\u4fdd\u96aa\u8a08\u5283\u53ef\u4ee5\u52a0\u5165\u9069\u7528\u65bc\u51fa\u79df\u7269\u696d\u7684\u81ea\u9078\u4fdd\u969c\u9805\u76ee\u3002\u57fa\u672c\u4e0a\u4e00\u822c\u5bb6\u5c45\u4fdd\u96aa\u4e3b\u8981\u4fc2\u4fdd\u969c\u8ca1\u7269\u97ff\u5929\u707d\u4eba\u798d\u5f8c\uff0c\u5c0d\u8ca1\u7269\u5605\u640d\u5931\u3001\u5efa\u7bc9\u7269\u672c\u8eab\u640d\u6bc0\u7dad\u4fee\u5605\u958b\u652f\u6216\u8005\u8ce0\u511f\uff0c\u4ee5\u53ca\u76f8\u95dc\u6cd5\u5f8b\u8cac\u4efb\u5605\u4fdd\u969c\u3002\\n\u96d6\u7136\u51fa\u79df\u696d\u4e3b\u97ff\u8ca1\u7269\u4e0a\u4f3c\u4e4e\u4e26\u7121\u81ea\u4f4f\u696d\u4e3b\u6216\u8005\u79df\u5ba2\u5481\u91cd\u8981\uff0c\u5c24\u5176\u4fc2\u96fb\u5668\u3001\u50a2\u4fec\u540c\u88dd\u4fee\u90fd\u6709\u9650\u5605\u51fa\u79df\u55ae\u4f4d\u3002\u4f46\u4fc2\uff0c\u97ff\u5efa\u7bc9\u7269\u7d50\u69cb\u540c\u6cd5\u5f8b\u8ca0\u8cac\u4e0a\uff0c\u51fa\u79df\u696d\u4e3b\u5c0d\u4fdd\u96aa\u5605\u9700\u8981\u53ef\u80fd\u5c31\u6bd4\u81ea\u4f4f\u6216\u8005\u79df\u5ba2\u70ba\u4e4b\u91cd\u8981\u5587\uff0c\u6240\u4ee5\uff0c\u5c08\u9580\u4ffe\u51fa\u79df\u696d\u4e3b\u5605\u696d\u4e3b\u8cac\u4efb\u4fdd\u96aa\uff0c\u90fd\u6703\u6bd4\u8f03\u8457\u58a8\u97ff\u5462\u5169\u9ede\u4e0a\u9762\u3002\\n\u6158\u9047\u79df\u9738\u90fd\u6709\u5f97\u4fdd\uff1f\\n\u300c\u79df\u9738\u300d\uff0c\u5c31\u4fc2\u501f\u6545\u5514\u4ea4\u79df\uff0c\u6216\u8005\u4fc2\u5514\u4fc2\u90fd\u627e\u78b4\u540c\u88fd\u9020\u554f\u984c\u5411\u696d\u4e3b\u7d22\u8ce0\u5605\u5730\u7344\u79df\u5ba2\u3002\u5481\u591a\u5e74\u4f86\uff0c\u597d\u591a\u5a92\u9ad4\u90fd\u5df2\u7d93\u70ba\u51fa\u79df\u696d\u4e3b\u5011\u63d0\u4f9b\u5497\u5514\u5c11\u907f\u958b\u79df\u9738\u5605\u