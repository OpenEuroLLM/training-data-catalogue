sample: '["\"Isumat.com/3:52AM, September 14, 2020\\nMagkakamay-ada hin Game 7 ha
  butnga han Nuggets ngan Clippers ha Western Conference Finals kataliwan la nga paglumson
  han Denver an hugpo nira Kawhi Leonard, 111-98, dida han ika-unom nga mulay basi
  makatabla ha 3-3.\\nIni nga paka-igbaw han Nuggets in come-from-behind win tungod
  kay naka-abante anay hin 16 puntos an Clippers katapos han 1st half.\\nPero waray
  matarantar an grupo nira Nikola Jokic ngan naghimo hira hin paagi basi makalanat.
  Dida han 3rd quarter, naghulog hira hin 30-16 nga bomba, ngan ginsundan ini hin
  34-19 nga bunal ha last quarter.\\nHi Jokic an nanguna han Denver pinaagi han iya
  34 puntos ngan ginsuportaran han 21 puntos ni Jamal Murray.\\nHi Paul Jorge in mayda
  34 puntos, ngan 29 puntos naman tikang kan Leonard ha panig han Clippers.\\nAn Game
  7 in hihimoon dida hiton Mierkules, Setyembre 16. Amo gihapon ini nga petsa an pag-abri
  han best of seven Eastern Conference Finals ha butnga han Miami Heat ngan Boston
  Celtics.\\nAn LA Lakers in naghuhulat han makakadaog ha asdangay han Nuggets ngan
  Clippers. #\"", "\"Leonard Bernstein\\n- Mayda impormasyon hini nga artikulo nga
  aada han Iningles nga bersyon nga angay ighubad ha Winaray\\nHi Leonard Bernstein
  (Agosto 25, 1918 \u2013 Oktubre 14, 1990) usa nga Americano nga kompositor, pianista
  ngan konduktor. Hiya an syahan nga konduktor nga natawo ha Estados Unidos han America
  nga nakakuha hin pagkakilala ha bug-os nga kalibutan, ngan kilalado hiya tungod
  han iya pagkondukt han New York Philharmonic, upod han mga kilalado nga Young People''s
  Concerts nga series, ngan an iya damo nga mga kinumposo, sugad han West Side Story,
  Candide ngan On The Town.\"", "\"Sulod hin duha ka adlaw mag papahigayon hin pag
  distribwer han mga land tittle an mga taga DENR ug Land Registration Authority LRA
  upod an LGU Guiuan ha panguna ni Mayor Annaliz Gonzales-Kwan ngadto han 651 ka mga
  benipisyaryo han programa nga HANDOG TITULO PROGRAM.\\nMismo hi Mayor Annaliz an
  nag hangyo ngadto ha DENR ug LRA nga hira na iton pumakanhi ha Guiuan agud pag distribwer
  han mga titulo han tuna agud nga diri na pumakadto ha Borongan an mga nag patitulo
  han ira mga katuna-an.\\nSanglit dako naman an pasalamat ug hingalipay han mga nag
  patitulo dara nga minus gastos na ngan makakalikay pa hira han hulga han virus dara
  hini yana nga pandemya.\\nPolice Station\\n09173498833\\nFire Station\\n09269921534\\n09469382458\"",
  "\"Para ha imo, ito ba . . .\\naada la ha imo kasingkasing?\\nsimboliko nga mga
  pulong?\\nusa nga gobyerno ha langit?\\nKON ANO AN GINSISIRING HAN BIBLIA\\n\u201cAn
  Dios ha langit magpapabangon hin usa nga ginhadian, nga diri gud magugunaw.\u201d\\n\u201cHa
  aton iginhatag an usa nga anak nga lalaki; ngan an kagamhanan [\u201cgobyerno,\u201d
  Douay Version] maaada ha iya sugbong.\u201d\\nKON ANO AN KAPULSANAN HITO HA IMO\\nMakakagtagana
  han imo mga panginahanglan inin matadong nga gobyerno.\\n\u2014Isaias 48:17, 18.
  Ha tiarabot nga bag-o nga kalibotan, perpekto na an imo kahimsog ngan magigin malipayon
  ka gud.\\n\u2014Pahayag 21:3, 4.\\nMASASARIGAN GUD BA NATON AN GINSISIRING HAN BIBLIA?\\nOo,
  ha duha nga hinungdan:\\nIginpakita ni Jesus kon ano an bubuhaton han Ginhadian
  han Dios. Gintutdoan ni Jesus an iya mga sumurunod nga ig-ampo nga kumanhi an Ginhadian
  han Dios ngan matuman an kaburut-on han Dios dinhi ha tuna. (Mateo 6:9, 10) Iginpakita
  ni Jesus kon paonan-o babatunon ito nga pag-ampo.\\nHan nakanhi hi Jesus ha tuna,
  nagpakaon hiya ha mga nagugutom, nagtambal hin may sakit, ngan nagbanhaw hin mga
  patay! (Mateo 15:29-38; Juan 11:38-44) Sugad nga Magmarando han Ginhadian han Dios
  ha tidaraon, iginpakita ni Jesus an magpakaruruyag nga bubuhaton hito nga Ginhadian
  ha mga sakop hito.\\n\u2014Pahayag 11:15. Ginpapamatud-an han mga panhitabo ha kalibotan
  nga hirani na umabot an Ginhadian han Dios. Igintagna ni Jesus nga antes gud pahinaboon
  han Ginhadian an kamurayawan ha tuna, magkakaada mga girra, gutom, ngan linog.\u2014Mateo
  24:3, 7.\\nNakikita naton mismo ito nga mga panhitabo yana. Salit makakasarig kita
  nga hirani na tapuson han Ginhadian han Dios an ngatanan nga problema.\\nALAYON
  HUNAHUNAA INI\\nAno an magigin kahimtang han kinabuhi kon magmando na an Ginhadian
  han Dios?\\nGinbabaton ito han Biblia ha SALMO 37:29 ngan ISAIAS 65:21-23.\"", "\"Caibiran\\nAn
  Caibiran usa nga ikalima nga klase nga munisipalidad o bungto ha lalawigan han Biliran
  ha Sinirangan nga Kabisay-an ha Pilipinas. Ha amihanan han bungto mabibilngan an
  bungto han Culaba. Ha salatan o habagatan han bungto matatad-an an bungto han Cabucgayan.
  Ha katundan han Caibiran mabibilngan an mga bungto han Biliran ngan Naval. Aadto
  ha census han tuig na 2015 nga an Caibiran may-ada populasyon nga 22,524. An kabug-at
  han populasyon kay 270 nga mangurukoy kada kilometro kwadrado.\\nEtimolohiya[igliwat
  | Igliwat an wikitext]\\nGin-ngaranan an bungto han ngaran nga Caibiran tungod han
  kadamo han mga \u201cibid\u201d (an gintikangan nga pulong) nga aadto. An kadaan
  nga pagluwas hini kay Ca-ibiran (damo na mga ibid) pero han paglabay han panahon,
  gindidiretso nala ini pagluwas.\\nTinikangan[igliwat | Igliwat an wikitext]\\nHadto
  na bag-o pala nga bungto an Caibiran, nakagtukod an mga nangungukoy han singbahan
  ngan usa nga lantawan. Usa ka adlaw, tungod han mga subasko nga uran, tumaob an
  salog nga aadto han bungto ngan nagbaha. Naguba hini nga baha an bungto upod an
  iba nga mga tawo nga aadto. Dara ngay-an han salog an peligro ha mangurukoy han
  bungto.\\nHa tuig nga 1882, gin-upod ni Kapitan Bebiano Maderazo an mangurukoy han
  Caibiran ha bag-o nga katunaan ngan didto na nahimo na bungto an Caibiran samtang
  an daan nira nga katunaan nahimo na usa nga barangay hini na bungto nga gin-ngaran
  na \\\"Binohangan\\\" tungod han kabuhang didto hadtun pagbaha.\\nHeograpiya[igliwat
  | Igliwat an wikitext]\\nNakahimutang an Caibiran ha 11\u00b034\u2032N 124\u00b035\u2032E.\\nAadto
  ha Philippine Statistics Authority nga an bungto may-ada kahiluag han tuna na 83.55
  kilometro kwadrado ginkukompuwestuan an 15.59% ha 536.01-kilometro-kwadrado- (206.95
  sq mi) nga kabug-usan na kahiluag han Biliran.\\nMga Baranggay[igliwat | Igliwat
  an wikitext]\\nNatutunga an Caibiran ha 17 nga mga baranggay. Hadtun 1948, nabalhin
  an mga barangay nga Ungale, Tuo, and Inasuyan ha Kawayan, Biliran.\\nKinuhaan[igliwat
  | Igliwat an wikitext]\\n- \\\"Municipality\\\". Quezon City, Philippines: Department
  of the Interior and Local Government. Retrieved 31 May 2013\\n- \\\"Province: Biliran\\\".
  PSGC Interactive. Quezon City, Philippines: Philippine Statistics Authority. Retrieved
  12 November 2016.\\n- Census of Population (2015). \\\"Region VIII (Eastern Visayas)\\\".
  Total Population by Province, City, Municipality and Barangay. PSA. Retrieved 20
  June 2016.\\n- \\\"Municipal: Caibiran, Biliran\\\". PSGC Interactive. Quezon City,
  Philippines: Philippine Statistics Authority. Retrieved 8 January 2016.\\n- \\\"An
  act to separate the barrios of Ungale, Tuo, and Inasuyan from the municipality of
  Caibiran, province of Leyte, and to merge these barrios with the municipality of
  Kawayan, of the same province\\\". LawPH.com. Retrieved 2011-04-08.\"", "\"Tyatro\\nAn
  tyatro o teatro (tikang han Kinatsila \\\"teatro\\\", nga tikang han Griyego \\\"theatron\\\",
  \u03b8\u03adatpov, nga nangangahulogan \\\"lugar hin pagkita\\\") amo in sanga han
  pagpasundayag nga mga arte nga ginhuhubad nga ano an \\\"nahihinabo kon in usa o
  damo pa nga mga tawo, nga nahibulag ha taknan ngan/o lugar, nagpapasundayag han
  ira kalugaringon ha iba o mga iba.\\\"[1] Ha hini nga haluag nga kahubad, an tyatro
  nakada tikang han kahadto nga mga panahon, komo resulta han pagkaruyag hin tawo
  hin pagsumat hin istorya. Tikang han pagtikang hini, nagkaada hin damo nga forma
  an tyatro, nga agsob maggamit hin mga elemento sugad hin pagyakan, pagsinyal, musika,
  sayaw, ngan ispektakulo, nga ginkombina han iba nga mga pagpasundayag nga mga arte,
  pati gihapon han visual nga gma arte, ngadto hin usa nga artistiko nga forma.\\nMga
  reperensya[igliwat | edit source]\\n- Bernard Beckerman, head of Hofstra University''s
  department of drama, in his book, Dynamics of Drama\"", "\"TACLOBAN CITY \u2013
  Duha nga mga rebelde nga taga-Calbiga, Samar an nagsurender ha Calbiga Municipal
  Police Station.\\nGinkilala an mga ine kanda alyas Ker, 36-anyos an pangidaron,
  usa nga staff han SRC Emporium ngan membro han Municipal Group Unit ni Ka-Onang,
  ngan membro gihapon han Libas Platoon nga ginmamanguluhan naman ni Ka-Liloy ngan
  alyas Pacayra, 34-anyos an pangidaron, membro gihapon han nasabi nga mga grupo.\\nSumala
  kan PCpt. Marvin Labrague, Chief of Police hiton Calbiga Municipal Police Station,
  taga-Calbiga an mga ine pero nakadto an mga ine pagdudumara han ira operasyon ha
  Silvino Lobos, Northern Samar.\\nHa pagsurender han mga ine in dayun an mga ine
  nga kumarawat hin cash assistance ngan grocery items agud may magastos ngan magamit
  nga pagtikang samtang ginpo-proseso pa an pagbulig han mga ine ha mga programa han
  gobyerno para ha mga rebel surrenderees.\\nSamtang, nanawagan naman an nasabi nga
  opisyal ha mga aadto pa ha kabukiran nga bumalik na ha gobyerno ngan dire mag-alang
  pakipagsumpayan ha ira kay andam hira nga bumulig ha mga ine.\\nHa pagkayana in
  ada na ha ilarom han kustodiya han Calbiga Municipal Police Station an mga ine.\"",
  "\"Baghdad\\nAn Baghdad (Inarabo: \u0628\u063a\u062f\u0627\u062f, Ba\u0121d\u0101d,
  IPA: [b\u00e6\u0263\u02c8d\u00e6\u02d0d]) in ulohan han Republika han Irak, nganhin
  igkasipareho it tetoryo ha Governorato han Baghdad. An populasyon han Baghdad han
  2011 in ginbabanabanahan nga 7,216,040, nga nahimo nga may-ada pinakadamo nga tawo
  nga syudad han nasod. Ini an gidadakoi nga nasod han Iraq[1][2], ngan ikaduha nga
  gidadakoi nga syudad ha Kalibutan Arabo (nasunod la ha Cairo, Ehipto), ngan ikaduha
  nga gidadkoi nga syudad ha Katundan nga Asya (sinmunod la ha Tehran, Iran).\\nNahamutang
  ha may Salog Tigris, an syudad in gintukod ha ika-8 gatostuig ngan naging ulohan
  han Kalipo han Abbasid. Ha sulod han gutiay nga panahon tikang ha pagkatukod, an
  Baghdad in tinmubo ngadto ha us''ka mahinungdanon nga kultural, komersyal, ngan
  intelektuwal nga sentro han Kalibutan Islamico. Ini in labot ha puy-anan hin pipira
  nga panguna nga institusyon academica (sugad han Balay han Kabaltok) nga naghatag
  hin kalibutanon nga reputasyon ha syudad komo an \\\"Sentro han Pag-aram\\\". Ha
  bug-os nga pag-agi han Hitaas nga Butnga nga Panahon, an Baghdad in gincoconsiderar
  nga gidadakoi nga syudad ha kalibutan nga may''da ginbabanabanahan nga populasyon
  nga 1,200,000 nga katawhan[3]. An syudad in ginruba ha mga kamot han Imperyo Mongol
  ha 1258, nga nagbunga hin pag-ubos nga pinmadayon hin pipira nga mga gatos-tuig
  tungod han agsob nga mga sakit ngan dirudilain nga mga susronod nga mga imperyo.
  Han paghatag hin pagkilala han Iraq komo us''ka naglulugaring nga syudad (anay Britanico
  nga Mandato han Mesopotamia) ha 1938, an Baghdad in hinayhinay nga nakabawi han
  iya pipira nga mga anay prominente komo us''ka mahinungdadnon nga sentro han kultura
  Arabo.\\nHa pagkayana, an syudad in naatubang hin hilarom nga pagkaguba han inprastruktura,
  tungod han diri la maiha nga ginpapangunahan han Amerikano nga langyaw nga pag-okupa
  han Marso 2009 ngan an sinmunod nga kahimtang hin sunod-sunod nga gera nga natapos
  han Disyembre 2011. Han pipira nga tuig nga naglabay, an syudad in makadamo nga
  nagkarawat hin mga gios han rebelde ngan mga atake han terorista.\\nSulod\\nToponimo[igliwat
  | edit source]\\nMay''da pipira nga magkaribal nga mga pagduso mahiunong ha specifico
  nga etimolohiya han ngaran Baghdad. An gimahitatapori ngan an pinakahaluag nga pagkarawat
  ha mga ini in an ngaran in us''ka Butnga nga Pinersyano[4][5][6][7][8][9][10] nga
  gindugtong nga pulong hiton Bag \\\"diyos\\\" + d\u0101d \\\"ginhatag\\\", nga nahuhubad
  ngadto ha \\\"ginhatag han Diyos\\\" o \\\"kanan Diyos regalo\\\", nga nagawas an
  Kayanaan nga Persiyano Ba\u0263d\u0101d. Ini in mas nagtikang ha Kadaan nga Persiyano.[11]\\nAn
  us''ka mas maluya nga tigo in ginkuha ha pinagdugtong nga Pinersiyano nga Ba\u011f
  \\\"hardin\\\" + d\u0101d \\\"baysay\\\", nahuhubad ha \\\"An baysay nga Hardin\\\",[12][13]\\nMayda
  liwat nangunguna nga pagduso in an ngaran in nagtikang ha Butnga nga Pinersyano
  nga B\u0101gh-d\u0101d \\\"An Ginhatag nga Hardin\\\". An ngaran in ugsa-Islamico
  ngan an mga katikangan in diri sayod, pero ini in nahisumpay ha inmagi nga mga panimungto,
  nga waray bisan ano nga politikal o komersyal nga gahom, nga naghihimo ini nga haros
  bag-o nga pagtukod ha panahon han mga Abbasid.[12][13]\\nPero an Baghdad, komo us''ka
  ngaran, in natawag komo Baghdadu ha Assyriano nga cuneiform nga panuratan han ika
  9 nga gatos tuig UC, ngan an Babylonon nga mga tisa in nagdadara hin Ginhadianon
  nga Palutop ni Hadi Nebuchadnezzar (ika-6 nga gatos tuig UC).[14]\\nAn baryo han
  Baghdad in mas malaksi nga naghing mahinungdahon han panahon nga gintukod ini han
  kalipa han Abbasid na hi al-Mansur, nga nagpili ha ngaran nga Madinat al-Salaam
  o \\\"Syudad han Kamurayaw\\\" para han iya bag-o nga pagtukod. Ini an naging buhatanon
  nga ngaran ha sinsilyo, pabug-at ngan iba nga buhatanon nga gamit, bisan an kadam-an
  nga tawo in nagpapadayon ha paggamit ha daan nga ngaran. Han ika-11 nga gatostuig,
  \\\"Baghdad\\\" an haros gingagamit la nga ngaran para han hini nga bantog-ha-kalibutan
  nga metropolis.\\nKaagi[igliwat | edit source]\\nPagkatukod[igliwat | edit source]\\nHan
  30 Hulyo 762, hi kalipa Al Mansur in nagsugo ha pag-ayad han syudad ngan ini in
  nahitindog ha ilarom ha pagbantay han Barmacidas.[15] Gintoohan ni Mansur nga an
  Baghada in perfecto nga syudad para maging lohan han imperyo Islamico ha ilarom
  han mga Abasida. Ginhigugma ni Mansur hin duro an lugar nga hiya in nabatian nga
  sinmiring, \\\"Ini lagi an syudad nga akon igtutukod, kun hain ako maukoy, ngan
  kun diin an akon mga manurunod in mamumuno pagkasunod\\\".[16]\\nAn kanan syudad
  pagdako in nabuligan an iya kahimutangan, nga nahatag hin kontrol ha stratehiko
  ngan aragian han pannegosyo, ha may Tigris. Us''ka rason kun kay-ano an Baghdad
  in nahatag hin maupay nga lokasyon in kadamo han tubig ngan kamara han klima. May''da
  tuig ha amihanan ngan salatan nga katubtoban han ganghaan han syudad, nga natugot
  han ngatanan nga mga panimalay nga magkamay''da hin damo nga suplay, nga urusahon
  han hiton nga panahon.\\nNasalipdan han Baghdad an Ctesiphon, an ulohan han Imperyo
  Persiyano, nga nahamutang han mga 30 km (19 mi) ha timugan. Ha yana an nabilin han
  Ctesiphon in bungto han Salman Pak, salatan la han Durudako nga Baghdad. An Ctesiphon
  in nasaliwanan ngan nahitampo ha Seleucia, an syahan nga ulohan han Imperyo Seleucid.
  An Seleucia in nagsaliwan han syudad han Babylon ha mas uruuna nga panahon.\\nMga
  bugto nga syudad[igliwat | edit source]\\n- Amman, Jordan[Nagkikinahanglan hin kasarigan]\\n-
  Beirut, Lebanon[17]\\n- Dubai, United Arab Emirates[Nagkikinahanglan hin kasarigan]\\n-
  Sana''a, Yemen[18]\\n- Nishapur, Iran[19]\\n- Pyongyang, North Korea (tikang 21
  Septyembre 2011)[Nagkikinahanglan hin kasarigan]\\n- Basra, Iraq[Nagkikinahanglan
