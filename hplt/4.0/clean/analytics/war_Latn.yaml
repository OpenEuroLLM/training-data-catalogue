  9/11\\n- Iraq Inter-Agency Information & Analysis Unit Reports, maps and assessments
  of Iraq from the UN Inter-Agency Information & Analysis Unit\"", "\"Isumat.com/7:46AM,
  Enero 14, 2021\\nNaawat an kinabuhi hin usa nga lola han pusilon hiya hadin nag-agi
  nga adlaw ha Brgy Cagbuhangin, Ormoc City.\\nAn biktima in ginkilala nga hi Milagros
  Toralba, 70 anyos ngan residente han Purok 3 han nasabi nga barangay. An suspetsado
  in ginkilala nga hi Joechel Pelayo, nag-uukoy ha Brgy Masarayao, Kananga, Leyte.\\nSumala
  han inisyal nga imbestigasyon, tigda la nga umulpot hi Pelayo ha balay ni Toralba
  ngan iya ginpusil an biktima ha ulo hinungdan han kamatay hini. Nagpruweba pag-eskapo
  an suspetsado pero na-aresto hiya katapos hin pira ka oras.\\nPersonal nga dilito
  ha butnga han lola ug han suspetsado an gintutudlok nga motibo han krimen, pahayag
  pa han mga imbestigador. #\"", "\"Zaz (magkaranta)\\nHi Isabelle Geffroy[1] (natawo
  1 Mayo 1980 ha Tours, Fransya), nga kilalado ha agnay nga Zaz, usa nga Franses nga
  magkaranta-manunurat-hin-kanta nga nagsasagol hin mga jazzy nga mga estilo, Franses
  nga variety, soul ngan acoustic. Kilalado hiya tungod han iya hit nga \\\"Je veux\\\",
  tikang han iya syahan nga album, Zaz, nga ginpagaw\u00e1s han 10 Mayo 2010.[2] Nakabaligya
  hiy\u00e1 hin labaw 3.4 ka ribo o milyon nga album ha kalibotan ngan us\u00e1 hiy\u00e1
  han mga nagmalinamposon nga mga Franses nga magkaranta ha kalibutan.\\nSulod\\nSyahan
  nga bahin han kinabuhi[igliwat | Igliwat an wikitext]\\nAn iya nanay usa nga magturutdo
  hin Kinatsila, ngan an iya amay nagtrabaho para hin kompanyiya el\u00e9ktrica. Han
  1985, sinmulod hiy\u00e1 han Conservatoire de Tours upod han iya bugto-nga-babayi
  ngan iya bugto-nga-lalaki, nga diin nagtambong hir\u00e1 hin mga kurso tikang hin
  mga panuigon nga lima tubtob napulo-kag-us\u00e1. Nag-aram hiy\u00e1 hin teorya
  hin musika, labi na an violin, piano, sista, ngan pagkanta nga choral. Han 1994,
  binmalhin hiy\u00e1 ha Burdeos. Han 1995, kinmuha hiya hin mga leksyon hin pagkanta
  ngan nagmulay hiya hin paugnat-ha-kalawasan hin us\u00e1 ka tuig ha Burdeos, samtang
  nag-aaram hiya hin kung fu upod hin propesyonal nga coach. Han 2000, nakadaog hiya
  hin scholarship tikang han rehiyonal nga konseho, nga nagbulig ha iya nga umapi
  hin iskwela hin moderno nga musika,, an CIAM (Sentro para hin Musikal nga mga Buruhaton
  ngan Impormasyon) han Bordeaux. Lakip han iya mga impluwensya ha musika an ''Four
  Seasons'' ni Vivaldi, mga jazz nga magkaranta sugad kan Ella Fitzgerald, ngan iba
  nga mga magkaranta sugad kanda Enrico Macias, Bobby McFerrin, ngan Richard Bona,
  pati gihapon mga ritmo nga Aprikano, Latin, ngan Cubano. Han 2006, binmalhin hiy\u00e1
  ha Paris.\\nKarera ha pagkanta[igliwat | Igliwat an wikitext]\\nHan 2001, nagtikang
  hiy\u00e1 han iya karera hin pagkanta did\u00e2 han blues nga banda \\\"Fifty Fingers\\\".
  Nagkanta hiy\u00e1 upod hin mga grupo nga musikal ha Angoul\u00eame, labi n\u00e1
  hin usa nga jazz quintet.[3] Nahimo hiy\u00e1 nga us\u00e1 han upat nga magkaranta
  han Izar-Adatz (Vinasco para hin \\\"Natalsik nga Bitoon\\\"), usa nga banda hin
  variedad nga nahihimo hin napulo-kag-unom ka tawo nga upod niya hin pag-tour hin
  duh\u00e1 ka tuig, labi na ha Midi-Pyrenees ngan ha Pa\u00eds Vasco. Nagtrabaho
  hiy\u00e1 dida hin studio nga backing nga magkaranta ha Toulouse ngan nagpasundayag
  hiya upod hin damo nga mga magkaranta, nga upod hin\u00ed hira Maeso, Art Mengo,
  Vladimir Max, Jean-Pierre Mader, Eduardo Sanguinetti, the latinoamerican philosopher
  and land-artist,[4] ngan hi Serge Guerao.\\nHan 2011, nakadaog hi Zaz hin EBBA Award.
  Ha tagsa nga tuig, an European Border Breakers Awards (EBBA) nagkikilala han pagkamalinamposon
  hin napulo nga tigawas nga mga artista o grupo nga nakabot hin mga magkirita gawas
  han ira kalugaringon nga mga kanasoran pinaagi han ira syahan nga ginpagawas ha
  langaw nga album han naglabay nga tuig.\\nHan May 2010, nagpas\u00e1ngyaw an Franses
  nga magazine nga T\u00e9l\u00e9rama: \\\"Nagdako hin mga hurobhurob ha diri pa la
  naiha nga mga semana: hi Zaz us\u00e1 nga extraordinaryo nga tingog, ngan hiy\u00e1
  an magigin pahayag han verano!\\\".[5] Han 10 May 2010, ginpagaw\u00e1s ni Zaz an
  iya syahan nga album. An sulod hini nga album mga kanta nga iya ginsurat (\\\"Trop
  sensible\\\") ngan ginkumposo upod hin kapadis (\\\"Les passants\\\", \\\"Le long
  de la route\\\", \\\"Prends garde \u00e0 ta langue\\\", \\\"J''aime \u00e0 nouveau\\\",
  \\\"Ni oui ni non\\\"). Hi Kerredine Soltani nagproducir han album did\u00e2 han
  label nga \\\"Play On\\\" ngan nagsurat ngan nagkumposo han hit nga single nga \\\"Je
  veux\\\". An pop nga magkaranta nga hi Rapha\u00ebl Haroche nagsurat han kan Zaz
  mga kanta nga \\\"\u00c9blouie par la nuit\\\", \\\"Port Coton\\\" ngan \\\"La f\u00e9e\\\".
  Han 2010, nagpirma hi Zaz hin kontrata para han iya mga tour upod han Caramba ngan
  han magmamantala nga Sony ATV. Gin-imbitar hiya nga maghimo hin pipira nga mga salida
  ha telebisyon (sugad han Taratata o Chabada) ngan gin-feature hiy\u00e1 hin p\u00edpira
  nga mga programa ha radyo. Han Dominggo 6 Oktubre 2013, sinmalida hi Zaz did\u00e2
  han kanan BBC One The Andrew Marr Show ha Londres ngan kinmanta hin live han \\\"Je
  veux\\\".\\nSunod hin\u00ed, nagtour hi Zaz han Fransya (Paris, La Rochelle, Montauban,
  Saint-Ouen, Chateauroux, Landerneau, F\u00e9camp...), nagpasundayag ha Francofolies
  han Montreal (Canada), ngan kinmanta ha Monthey (Swiza), Bruselas, Berlin, ngan
  Milan. Han otonyo hi Zaz binmawbaw han mga chart ha Belhika, Swiza, ngan Austria.
  An iya manager ngan producer ha Caramba Entertainment nga hi Matthieu Baligand,
  nagpah\u00e1yag ha Lib\u00e9ration: \\\"Gihihiruhimangraw namon hiy\u00e1 hin damo
  ha yan\u00e2 ngahaw ngan mga tawo naghuhulat ha iy\u00e1 ha higay\u00f3n... Bisan
  pa han demanda, baga hin mauruupay nga buh\u00e1ton an syahan nga tour ha kalim-an
  nga gagmay nga mga lugar nga maghahatag ha hiya hin kredibilidad. Hi Zaz popular,
  intuitibo nga artista, nga hi-ara hin musika, nakakanta, kundi it pagb\u00fahat
  hin pasundayag hin kalidad iba nga but\u00e1ng (...).\\\" Han Nobyembre 2010, an
  debut nga album Zaz nahimo nga doble nga platinum ngan ginpasidunggan hiy\u00e1
  hin \\\"Revelation Song\\\" han Acad\u00e9mie Charles Cros. Nakadaog gihapon hi
  Zaz European Border Breakers Award: han 2010 gin-ngaranan hiy\u00e1 nga amo an Franses
  nga artista nga pinakamasurong gintotokar ha langyaw. Sumalay hin survey nga ginmantala
  han L''Internaute, hi Zaz amo an pinakapopular nga Franses nga magkaranta dida han
  pagranggo han 2010.[6]\\nGin-feature gihapon hiy\u00e1 dida han kanta nga \\\"Coeur
  Volant\\\" para han soundtrack han 2011 nga pelikula, Hugo. An iya live CD ngan
  DVD Zaz live tour Sans Tsu Tsou ginpahayag.\\nGin-feature an iya kanta nga \\\"Eblouie
  Par La Nuit\\\" did&a han 2013 nga Americano nga neo-noir nga crime thriller, \\\"Dead
  Man Down\\\".\\nHan 2012, linmakat hin tour hi Zaz ngan nagb\u00fahat hiy\u00e1
  hin mga konsyerto hin mga dirudilain nga kanasoran han kalibutan upod an Japan,
  Canada, Alemanya, Polonya, Swiza, Slovenya, Tseka nga Republika (Colours of Ostrava),
  Croatia, Bulgaria, Serbia, ngan Turkey, ha mga iba nga nasod.[7]\\nPinaagi han iya
  album nga Paris nagdaog hiy\u00e1 han 2015 Echo nga premyo para hin gimaupayi nga
  internasyonal nga babaye nga rock/pop artist.[8]\\nHan 2016, gin-imbitar hi Zaz
  nga magpasundayag ha Syudad han Zacatecas, Mehiko komo api han Festival Cultural
  Zacatecas[1].\\nPilantropiya[igliwat | Igliwat an wikitext]\\nHan 2011, inmapi hiy\u00e1
  han Les Enfoir\u00e9s nga charity ensemble.\\nGinhim\u00f2 ni Zaz an proyekto nga
  Zazimut basi \\\"magpadukwag ngan magpadayag hin mga proyekto hin katiringban nga
  darudako an respeto hin kinabuhi ha tanan hini nga porma\\\".\\nDiskograpiya[igliwat
