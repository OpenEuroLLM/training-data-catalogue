  la phomolo naheng ea Iceland E ne e phetoa lilemo tse ling le tse ling tse leshome\\nE
  hatisitsoe qalong LaDamadeElche.com\"", "\"Kankere ea mat\u0161oafoE bolela kholo
  e sa laoleheng ea lisele sebakeng sa mat\u0161oafo. Ha li h\u014dla ka mokhoa o
  sa laoleheng, li etsa bongata bo boholo sebakeng sa tsona. Boima bona bo ka ''na
  ba namela ho lisele tse potolohileng ha nako e ntse e ea. Hang ha e kenella, e molemo,
  kaha ba ka boela ba senya setho seo ba se hasang.\\nMat\u0161oao a Kankere ea Mat\u0161oafo
  ke afe?\\nMat\u0161oao a kankere ea mat\u0161oafo E ka thathamisoa ka tsela e latelang;\\n\u00b7
  Khohlela e pheellang le e mpefatsang\\n\u00b7 sekhohlela se nang le madi\\n\u00b7
  Bohloko ba sefuba bo ntseng bo mpefala ha motho a hema ka botebo, ha a khohlela
  le ha a thimola\\n\u00b7 mahoashe ka lentsoe\\n\u00b7 Phefumoloho e khut\u0161oanyane\\n\u00b7
  Ho korotla\\n\u00b7 ho ikutloa o kgathetse ebile o le botsoa\\n\u00b7 Ho lahleheloa
  ke takatso ea lijo\\nNtle le mat\u0161oao ana, leqeba le entsoeng karolong e ka
  holimo ea mat\u0161oafo le ka boela la ama methapo ea sefahleho. Sena se ka etsa
  hore mahlo a mahlo a kobehe, a kobehe ha bana, ''me a fufuleloe ka lehlakoreng le
  leng la sefahleho. Lihlahala mat\u0161oafong li ka baka ho ruruha hloohong, letsoho
  le pelo. Haeba u e-na le mat\u0161oao ana, ho hlokahala hore u ee ngakeng kapele
  kamoo ho ka khonehang ''me u hlahlojoe.\\nMefuta le Methati ea Kankere ea Mat\u0161oafo\\nHa
  e le hantle ho na le mefuta e ''meli ea lihlahala tsa kankere ea mat\u0161oafo.
  Tsena ke lisele tse nyenyane le tse seng nyenyane. Boholo ba sele e nyane kankere
  ea mat\u0161oafo e bonoa. Ngaka e tla etsa liteko tse ling ho fumana lintlha tse
  felletseng mabapi le mofet\u0161e. Liteko tsena li tla boela li thuse ho tseba moralo
  oa phekolo. Mefuta ena ka bobeli e ka t\u0161oana, empa kalafo le tlhahlobo li fapane.\\nsele
  e nyane; Lisele tse nyenyane li ata ka potlako. Ha e fumanoa, e ka ''na eaba e nametse
  liseleng tse ngata.\\nsele e seng e nyane; Mofuta ona oa kankere ha o ata ka potlako.
  Tabeng ena, mokuli ha a hloke phekolo ea t\u0161ohanyetso.\\nMekhahlelo ea mofets''e
  oa lisele tse seng nyane ke tse latelang;\\n1. Sethala; Kankere ha e so namele ka
  n\u0123''ane ho mat\u0161oafo.\\n2. Sethala; kankere e hlaha mat\u0161oafong le
  li-lymph nodes tse haufi.\\n3. Sethala; Kankere e hlaha li-lymph nodes tlas''a mat\u0161oafo
  le sefuba.\\n4. Kankere e nametse mat\u0161oafong le lithong tse ling.\\nMehato
  ea kankere ea mat\u0161oafo ea lisele tse nyenyane;\\n1. Sethala; e tsejoang joalo
  ka mohato oa pele. Kankere e lula sefubeng ''me ha e e-s''o namele libakeng tse
  ling.\\n2. Sethala; e tsejoang joalo ka sethala sa morao. Hlahala e nametse mat\u0161oafong
  le lithong tse ling tsa ''mele.\\nKe Litlhahlobo life tse Sebelisitsoeng Tlhahlobong
  ea Kankere ea Mat\u0161oafo?\\nTlhahlobo ea kankere ea mat\u0161oafo Liteko tse
  latelang li etselitsoe;\\nLitlhahlobo tsa ho etsa lit\u0161oant\u0161o; Boima bo
  sa tloaelehang kapa nodule e ka hlaha set\u0161oant\u0161ong sa X-ray sa mat\u0161oafo.
  Ho ka ''na ha laeloa CT scan bakeng sa maqhutsu a sa bonahaleng ka X-ray.\\ncytology
  ea sekhohlela; tlhahlobo ena e ka laeloa haeba khohlela ea hau e le mamina. Ka tsela
  ena, hoa etsoa qeto ea hore na ho na le leqeba mat\u0161oafong a hau.\\nBiopsy;
  Haeba lisele tse sa tloaelehang li fumanoa, sengoathoana se ka nkoa ka biopsy. Sena
  se o lumella ho ba le tlhaiso-leseling e felletseng mabapi le sele.\\nbronchoscopy;
  Libaka tse sa tloaelehang mat\u0161oafong li hlahlojoa ka tube e khanyang.\\nSekhahla
  sa Pholoso ea Kankere ea Mat\u0161oafo\\n\u00b7 Sekhahla sa ho phela ha kankere
  ea mat\u0161oafo lilemong tse 5 tsa pele; 20%\\n\u00b7 Haeba kankere ea mat\u0161oafo
  e fumanoa mohatong oa 1 le oa 2, tekanyo ea ho phela ke 56%.\\n\u00b7 Haeba a fumanoa
  ka mor''a nako, mokuli a ka shoa nakong ea selemo se le seng.\\nKalafo ea Kankere
  ea Mat\u0161oafo\\nKalafo ea kankere ea mat\u0161oafo e fapana ho ya ka motho. Leha
  ho le joalo, mekhoa ea phekolo e ratoang ka ho fetisisa ke e latelang;\\nChemotherapy;
  Ke kalafo e etselitsoeng ho fumana le ho senya lisele tsa mofet\u0161e ''meleng.
  Leha ho le joalo, bakuli ba bangata ba ameha hampe ka lebaka la t\u0161enyo ea lisele
  tse phetseng hantle.\\nRadiotherapy; Mokuli o fuoa mahlaseli a mangata. Lisele tsa
  kankere li ikatisa ka potlako ho feta lisele tse tloaelehileng. Radiotherapy e sebetsa
  ho feta liphekolo tse ling. Hape ha li lematse lisele tse phetseng hantle.\\nMokhoa
  oa ho buoa; Ho na le mekhoa e mengata ea ho buoa ''me ngaka e etsa qeto ho latela
  motho.\\nImmunotherapy; e susumetsa sesole sa hau sa ''mele ho bolaea lisele tsa
  mofet\u0161e. E ka sebelisoa e le mong kapa hammoho le chemotherapy.\\nChemotherapy\\nKa
  phekolo ea chemotherapy, lithethefatsi tse matla li sebelisoa ho senya lisele tsa
  kankere. Chemotherapy e ka sebelisoa pele, ka mor''a ho buuoa kapa maemong ao ho
  ke keng ha khoneha ho buuoa. Ngaka e tla etsa qeto ea hore na u tla hloka chemotherapy
  e kae. Bakuli ba bangata ba fumana chemotherapy bakeng sa likhoeli tse 3-6. Litla-morao
  tsa chemotherapy ke tse latelang;\\n\u00b7 ho rotha moriri\\n\u00b7 ho ikutlwa o
  kgathetse joalo ka ho kula\\n\u00b7 Ho ba le diso ka hanong\\n\u00b7 Ho nyekeloa\\nMat\u0161oao
  ana a tla nyamela ka mor''a hore phekolo e felile. Hoa khoneha ho ba le mat\u0161oao
  ana ka karolelano ea beke ea 1.\\nRadiotherapy\\nLisele tsa mofets''e li otloa ke
  mahlaseli a matla a phahameng. E ka sebelisoa ka mokhoa o tloaelehileng le ka mokhoa
  o feteletseng. Le ha radiotherapy e tloaelehileng e nka linako tse 20-32, radiotherapy
  e matla e fuoa lihora tse 5-1, matsatsi a 2 ka beke. Litla-morao tsa radiotherapy
  ke tse latelang;\\n\u00b7 bohloko ba sefuba\\n\u00b7 mokhathala\\n\u00b7 sekhohlela
  se nang le madi\\n\u00b7 bothata ba ho koenya\\n\u00b7 Bofubelu bo shebahalang joaloka
  ho chesoa ke letsatsi\\n\u00b7 ho rotha moriri\\nimmunotherapy\\nE ka sebelisoa
  ho feta karolo e le ''ngoe ea'' mele ka tube ea polasetiki. Ka karolelano ho hlokahala
  metsotso e 30-60 bakeng sa immunotherapy e le ''ngoe. Tekanyetso e ka nkuoa libeke
  tse ling le tse ling tse 2-5. Litla-morao ke tse latelang;\\n\u00b7 ho ikutlwa o
  kgathetse ebile o fokola\\n\u00b7 ho utloa ho kula\\n\u00b7 Ho ba le let\u0161ollo\\n\u00b7
  Ho lahleheloa ke takatso ea lijo\\n\u00b7 bohloko ba manonyeletso\\n\u00b7 Phefumoloho
  e khut\u0161oanyane\\nNaha e Ntle ho Kankere ea Mat\u0161oafo\\nKankere ea mat\u0161oafo,
  Ke naha e nang le kotsi e kholo ea lefu. Hape ho thata haholo ho phekola. Bakeng
  sa sena, tleliniki e ntle haholo e tlameha ho khethoa. Naha e tlameha ho ba le kalafo
  e atlehileng ea bophelo bo botle. Ho bohlokoa hore ho sebelisoe theknoloji e tsoetseng
  pele, lingaka ke litsebi mafapheng a tsona ''me litlhoko tsa bolulo lia khotsofatsoa.
  Tabeng ena Kalafo ea kankere ea mat\u0161oafo Turkey Ho tla ba molemo hore u bone.
  U ka fumana lit\u0161ebeletso tsa mahala tsa boeletsi ka ho ikopanya le rona bakeng
  sa kalafo ea mofet\u0161e oa mat\u0161oafo Turkey.\\nTlohela Maikutlo\"", "\"Na
  lithupelo li 100% inthaneteng?\\n+\\nEe, lithuto tsohle li fumaneha inthaneteng
  ka botlalo ''me li ka fumaneha neng kapa neng, kae kapa kae ka webosaete e bohlale
  kapa sesebelisoa sa mohala.\\nU ka qala thupelo efe kapa efe hang ka mor''a ho ingolisa,
  ntle le tieho.\\nLithuto le linako tsa thuto ke life?\\n+\\nKaha tsena ke lithuto
  tsa marang-rang, u ka ithuta ka nako efe kapa efe ea letsatsi le nako e telele kamoo
  u batlang. Re khothaletsa ho latela kemiso, empa qetellong ho latela kemiso ea hau.\\nKe
  na le nako e kae ke fihlella lisebelisoa tsa thupelo?\\n+\\nU na le phihlello ea
  bophelo bohle ho lisebelisoa tsa thupelo, le kamora ho qeta.\\nA na nka khoasolla
  lisebelisoa tsa thupelo?\\n+\\nEe, o ka fihlella le ho khoasolla litaba tsa thupelo
  nakong eohle ea thupelo mme oa boloka phihlello ea bophelo bohle bakeng sa lit\u0161upiso
  tsa nako e tlang.\\nKe software/ lisebelisoa life tse hlokahalang bakeng sa lithuto?\\n+\\nSoftware
  kapa lisebelisoa life kapa life tse hlokahalang li tla arolelanoa le uena nakong
