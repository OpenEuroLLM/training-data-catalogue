  Russell o nt\u0161etsa pele mosebetsi oa hae oa bongoli o tletse libuka tsa lipale
  tsa mafokisi tse khahlisang haholo. Libukeng tsa lipale tsa hae tse ngata, hoo e
  batlang e le Komeshenara Fabel kapa Detective Lennox, hangata mongoli enoa o khona
