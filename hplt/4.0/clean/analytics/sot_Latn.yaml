  khathatseha le basali ba Iceland, ba ile ba ea mohato o mong hape'' me ba kopanela
  takatsong ea ho finyella mokhatlo o hlophisitsoeng oa sechaba moo bohle ba neng
  ba lekana.\\nMohlala oo o ile oa thusa lihlopha tsa basali ba bang hore li batle
  ho o etsisa, kahoo, Poland ka 2016, basali ba ne ba le sieo mosebetsing ''me ba
  hlophisa mohoanto o moholo khahlanong le taelo ea maikutlo e lekang ho thibela ho
  fumana tokelo ea ho nt\u0161a mpa maemong ''ohle. Empa seteraeke sena ha sea ka
  sa ba le phello ea moruo eo mohlahlami oa pele a se fihletseng; le hoja ba ile ba
  e finyella boemong ba lipolotiki ka ho tlosoa ha Molao. Argentina e ne e tla boela
  e leke ho fetola sebopeho sa eona sa sechaba, ho e atametsa ho basali ka seteraeke
  se ts''oanang, empa se tiileng ke hore sephetho ha sea ka sa ba boima joalo ka Iceland.\\nUnited
  States, \\\"letsatsi le se nang basali\\\" le lona le ile la bitsoa ka selemo sa
  2017, se neng se kenyelletsa pherekano e kholo ka pel''a Trump Tower ea Mopresidente
  Donald Trump New York.\\n\\\"Labohlano la Iceland\\\" le bont\u0161itse matla a
  boipelaetso ba basali ho etsa hore sebaka sa bona sa moruo se bonahale kahare le
  kantle ho lehae. Empa ho phehella ha lekhalo la moputso ho boetse ho bont\u0161itse
  moeli oa tlhokahalo ea \\\"teka-tekano\\\" ntle le ho belaella tsamaiso ka kakaretso.
  Ha e le hantle, bokapitale ba Iceland bo ne bo tseba ho kopanya le ho \\\"fokotsa\\\"
  tlhokahalo hoo kajeno, lilemo tse 40 hamorao, basali ba tsoelang pele ho bokella
  ka lebaka le t\u0161oanang.\\nSefofane se sa lekaneng ka ho fetisisa se ntse se
  tsoela pele ho ba moruo: lekhalo la meputso ea 14% le sala. ''Me ho phehella ha
