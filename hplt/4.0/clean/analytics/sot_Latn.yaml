  "\"Iceland ke mohlala oa demokrasi ea bokhaphithaliste: e kaholimo ho index ea tekano
  ea bong, boemeli ba lipolotiki, phihlello ea thuto le mosebetsi, matsatsi a phomolo
  a lelapa le tlhokomelo ea bana, e leng se tiisang hore motho o tla khutlisetsoa
  kapele mosebetsing le thutong kamora ''m\u00e8. 80% ea basali ba sebetsa kantle
  ho malapa, ba etsa 65% ea baithuti ba univesithi le 41% ea litho tsa Paramente.\\nEmpa
  ho ne ho se joalo kamehla. Le hoja likhetho tsa basali Iceland li ile tsa finyelloa
  ka 1915, tsoelo-pele e lakatsehang ha ea ka ea etsahala ''me basali ba tsoela pele
  ho lefshoa ho fihlela ho 40% ka tlase ho banna le boemeli ba bona ba paramente ha
  boa ka ba feta 5%.\\nEmpa joale ha fihla 1975. Selemo seo se ile sa phatlalatsoa
  ke Machaba a Kopaneng, Selemo sa Machaba sa Basali, \u2019me sena se ile sa tlatsetsa
  hore basali ba bonahatse matla a bona ka seteraeke se batlang se feletse sa basali
  ba Iceland likarolong tsohle tsa naha. E ne e le mohopolo oa sehlopha sa basali
  ba Iceland ba basali ba bitsoang Red Stockings ba entseng tlhahiso ea ho phephetsa
  naha eohle, ba bonts''a hore basali ba bohlokoa hore naha e tsamaee le ho tsoela
  pele.\\nHo ne ho nahanoa hore letsatsi leo ke \\\"seteraeke sa basadi\u201d, e le
  ho etsa hore karolo ea bona sechabeng e bonahale, haholo-holo mesebetsing ea malapeng
  e sa lefelloeng le ho batla boemeli bo boholoanyane ba lipolotiki.\\nKe ''nete hore
  ka nako eo Iceland ho ne ho se na seteraeke kapa ts''ebetso ea ho bokella, ke ka
  lebaka leo e ileng ea khothalletsoa e le \\\"letsatsi la litaba tsa bona\\\", e
  le ho tiisa ho ba sieo ha basali, empa ntle le ho beha mesebetsi ea bona kotsing.
  Hammoho le kopo ena e kholo ea letsatsi la phomolo, mefuta eohle ea lilaesense tse
  lumelletsoeng sebakeng sa mosebetsi e ile ea sebelisoa. Ho ile ha khothaletsoa ho
  khaotsa mesebetsi eohle ea lapeng e sa lefuoeng, ho akarelletsa le tlhokomelo ea
  bana.\\n90% ea baahi ba Iceland ba t\u0161ehetse tekanyo eo. Seteraeke ntle le ho
  ba ntho e le ''ngoe, empa ntle le ho ea mesebetsing ea bona kapa ho etsa ketso efe
  kapa efe e sa ananeloang le ho lefshoa joalo. Mosali eo o ile a khaotsa ho etsa
  ntho e ''ngoe le e ''ngoe.\\nT\u0161usumetso ea moruo e ne e hlokomeleha: likoranta
  ha lia ka tsa hatisoa hobane baetsi ba ho thaepa e ne e le basali, t\u0161ebeletso
  ea lithelefono e ne e sa sebetse, lifofane li ile tsa hlakoloa hobane ba amohelang
  baeti ba ne ba sa hlahe, likolo li ne li sa sebetse le lifeme tsa litlhapi li koetsoe
  hobane basebetsi ba bona e ne e le ba basali feela. Libanka, lipalangoang, litsi
  tsa tlhokomelo ea mots''eare, barekisi ba chelete, basebetsi ba mabenkele ba ile
  ba emisa,\u2026Mme kaofela ba bokana seterateng. Reykjav\u00edk, e leng motse-moholo
  oa naha eo, batho ba ka bang 25,000 XNUMX ba ile ba bokana.\\nBanna ba ne ba lokela
  ho hlokomela bana. Ba bangata ba ne ba sa khone ho k\u014dpa letsatsi la phomolo
  hobane basali ba ne ba se ba entse joalo \u2019me mosebetsi oa bona o ne o hlokahala.
  Ebile ba ne ba ke ke ba hlokomoloha bana ba bona kapa ho t\u0161oenyeha ka lijo.
  Liofisi li ne li tletse bana ''me lireschorente li ile tsa eketsa phaello ea tsona
  haholo.\\nT\u0161usumetso ea lipolotiki e ne e le ea bohlokoa haholo. Ka 1976, Paramente
  ea Iceland e ile ea fetisa molao o tiisang litokelo tse lekanang tsa banna le basali,
  le hoja sena se ne se ke ke sa fella ka mesebetsi e molemo kapa mat\u0161eliso a
  moputso bakeng sa basali. Lilemo tse ''n\u00e8 hamorao, mopresidente oa pele oa
  mosali, Vigdis Finnbogadottir, o ne a tla khethoa ka sekhahla se senyenyane. Ho
  theiloe mokha oa basali, Mokhatlo oa Basali, oo ka 1983 o ileng oa hapa litulo tsa
  ona tsa pele paramenteng. Lilemo tse mashome a mabeli hamorao, ka 2000, matsatsi
  a phomolo a lefuoang bakeng sa banna a ile a hlahisoa. Ka 2010, Iceland e ile ea
  khetha mosali, Johanna Sigudardottir, e le tona-kh\u014dl\u014d ea eona, ka lekhetlo
  la pele historing. E ne e boetse e le moetapele oa pele oa lefats''e oa mosodoma
  ea pepeneneng. Selemong seo, e le e ''ngoe ea maano a pele a mmuso oa hae, lihlopha
  tsa strip li ile tsa thibeloa. \u2019Me le hoja mathata a mang a ntse a tsoela pele,
  haholo-holo mosebetsing, ntoa ea ho leka-lekana e tsoela pele ka tsela e t\u0161oanang.\\n\\\"E
  ne e le mohato oa pele oa tokoloho ea basali\u201d, ho latela mopresidente oa mehleng
  Vigdis Finnbogadottir lilemo hamorao puisanong eo a ileng a e fa BBC. E bile kholiso
  e kholo ea tekano ea basali naheng. Letsatsi leo le ile la fetola ka ho feletseng
  tsela ea ho nahana ea batho ba Iceland \u2019me karolo ea basali likarolong tsohle
  tsa sechaba e ile ea nkoa e le ea bohlokoa.\\nBanna ba ile ba hlokomela bohlokoa
