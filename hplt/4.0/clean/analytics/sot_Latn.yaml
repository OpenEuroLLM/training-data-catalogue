  bona lefat\u0161eng le se nang teka-tekano e t\u0161abehang, ntoa khahlanong le
  khatello le khethollo e ntse e sebetsa. Basali ba ile ba bokana hape selemo le selemo
  ho batla teka-tekano eo ba neng ba e rahile boto Labohlano leo la 1975.\\nHona joale
  letsatsi lena la seteraeke le t\u0161oaroa lilemo tse ling le tse ling tse leshome.\\nKe
  ''nete hore seteraeke ha se hlahise phetoho ea setso kapa ea lipolotiki hang-hang,
