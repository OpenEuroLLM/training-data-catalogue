  tsa motho ka boeena. Hobane ke hona moo ho ka hahuoang lefat\u0161e la moetlo, set\u0161oant\u0161o
  sa\u2026\\nMick Herron o ile a ikopanya, morao koana ka 2010, bongata ba bangoli
  bo ileng ba hlolloa ke linako tsa Cold War. Nako e ileng ea lebisa mofuteng oa mofuta,
  oa bohloela o neng o lula o pota-potile likamano tseo tsa lipuisano qetellong o
  ile oa tloha ho tloha ho likere tse lit\u0161ila ho feta liprothokholo le ...\\nHo
  na le babuelli ba molao ba fetohelang lipale tse iqapetsoeng joalo ka John Grisham
