sample: '["\"Digital Khatiso Fabric Laser mochine o sehang bakeng Sublimation Clothes\\nMatsatsing
  ana ho hatisa thekenoloji ho pharaletseng sebediswa ho indasteri e fapaneng tse
  kang sportswear, seaparo cyclisme, hatisa seaparo feshene, lifolakha, le lifolakha.
  ke tharollo e molemohali bakeng sa ho seha bana lesela hatisitsoeng le Textile eng?
  Traditional letsoho seha kapa ho phetha molao ho it\u0161eha e na le mefokolo e
  mengata. Laser it\u0161eha fetoha tharollo ratoang haholo bakeng sa ho sehiloeng
  ea moeli. Ha a ntse a Golden Laser, o tla fumana ho feta seo u ka se khonang set\u0161oant\u0161o.\\nKamoo
  Vision Laser mochine o sehang Mesebetsi?\\n\u2666 lik''hamera Scan lesela, lemoha
  le ho ananela hatisitsoeng ea moeli kapa ea khatiso matshwao, hape le romele tlhahisoleseding
  ho it\u0161eha ho tham mong bang laser sehang . Tsela kaofela ke jarolla ka ho iketsa
  ho feletseng ''me ha a hloke ho kenella pukwanana. Tsamaiso ea VisionLASER ka ikamahanya
  le maemo ka tham mong bang laser sehang ''s le litekanyo efe kapa efe.\\n\u2666
  Vision tham mong bang laser sehang automates tshebetso ya ho seha tsoa likotoana
  tse hatisitsoeng tsa lesela kapa Textile ka potlako le ka ka nepo. Lintho tse bonahalang
  e ka tsela e iketsang unrolled le isoa holim''a tham mong bang laser ho it\u0161eha
  mochini sebelisa setsi sa r\u014dna conveyor.\\n\u2666 Jwalo ka laser ho it\u0161eha
  ke bao e seng ka ikopanya le, ho na le ho na le e hula ka lintho tse bonahalang
  ''me ha ho le di-blades ho fetoha.\\n\u2666 Hang khaola, masela a maiketsetso a
  fumana bohale tiisitsoe. Ho bolelang hore ba ke ke ba pipe pelaez, sena e sa ntse
  e Molemo e mong babatsehang fetang ea setso mekhoa it\u0161eha Textile.\\nPono Laser
  mochine o sehang bakeng Sublimation Apparel Demo\\nVisionLASER peli lemoha Mode\\nPono
  Laser mochine o sehang Main phetolo (boikhethelo)\\nIndustries ho hlokehang\\n\u2192
  Khatiso indasteri - hatisitsoeng seaparo, lifolakha, lifolakha, lintho tsa ho bapala,
  lik''hapete. joalo-joalo\\n\u2192 seaparo indasteri - sehlopheng holimo liaparo,
  lihempe, lisutu, liaparong tsa ka metopa / plaids, plaids kapa dipaterone, a pheta\\n\u2192
  Shoes indasteri - loha lieta lipapali, ho loha ka mamao vamp\\n\u2192 Furniture
  indasteri - Sofa, pillowcase, lesela le metopa tsamaiso di nyalantswe & plaids\\n\u2192
  Top sehlopheng mekotla le lisutuk''heise - mekotla, lisutuk''heise, chelete le metopa
  lebagantshitswe & plaids\\nPono Laser khaola Dikopo\\n1. Ha ntsintsi e - e kholo
  le fomate amohela e tsoelang pele ho it\u0161eha\\nMosebetsi ona ke patterned lesela
  toba boemo le ho it\u0161eha. Ka mohlala, ka ho ea khatiso tsa digital, Grafiken
  tse fapa-fapaneng tse hatisitsoeng ka lesela. Ka morago ga moo e ea boemo le ho
  it\u0161eha, boitsebiso bo bonahalang. nt\u0161itsoeng ke khamera phahameng-lebelo
  liindasteri (CCD) , software bohlale boitsebiso koaloa ka ntle ea moeli Grafiken,
  ka nako eo ka tsela e iketsang etsa chelete le ho it\u0161eha tseleng le fihlela
  qetellong ho it\u0161eha. Ntle le hore ho hlokahala hore ho kenella batho, e ka
  finyella e tsoelang pele ho amohela ho it\u0161eha ba kaofela moqolo hatisitsoeng
  masela.\\nKe hore, ke kholo ka fomate tsamaiso e khopo ho amohela bonwang, software
  e ka tsela e iketsang hlokomela ea moeli mohlala oa seaparong, ebe jarolla ka ho
  iketsa ea moeli seha Grafiken, ka tsela eo ho etsa bonnete ba ho it\u0161eha e nepahetseng
  ea lesela.\\nMolemo wa phumano ea moeli\\n- Ha ho hlokahala le pele a difaele tsa
  ho Grafiken\\n- Kotloloho lemoha moqolo hatisitsoeng masela\\n- Jarolla ka ho iketsa
  ka ntle ho ho kenella pukwanana\\n- Boitsebiso ka metsotsoana 5 ka kakaretso ho
  it\u0161eha sebakeng\\n2. ho hatisoa Marks Cutting\\ntheknoloji ena ho it\u0161eha
  ke sebetsang ho mefuta e fapaneng ya dipalopalo dipaterone le Labels it\u0161eha
  sebetsa ka ho nepahetseng. Haholo-holo a loketse bakeng sa ka ho iketsa e tsoelang
  pele ea khatiso liaparo ea moeli ho it\u0161eha. Lesupa ntlha boemo seha ha paterone
  tse boholo kapa sebopeho lithibelo. kemo lona e amanang feela le lintlha tse peli
  tse lesupa. Mora lintlha tse peli lesupa ho khetholla sebakeng se, kaofela le fomate
  Grafiken ka ho toba hore khaola. (Hlokomela: tokisetso ea melao e lokela ho ba e
  t\u0161oanang bakeng sa e mong le e le fomate ya e hlakileng le jarolla ka ho iketsa
  ho fepa ho it\u0161eha e tsoelang pele, ho a hlomelloa le tsamaiso fepa..)\\nMolemo
  wa matshwao bonoa hatisitsoeng\\n- phahameng sebetsa ka ho nepahetseng\\n- Lekanyetsoang
  bakeng sa sebaka se pakeng tsa tsa paterone hatisitsoeng\\n- Lekanyetsoang bakeng
  sa moralo oa khatiso le ''mala o sa bokamorao\\n- Ditlhapiso tsa deformation lokisa
  lintho tse bonahalang\\n3. metopa le Plaids Cutting\\nCCD khamera, e leng e behoa
  ka morao tsa ho it\u0161eha betheng, ka khona ho lemoha thepa boitsebiso bo joalo
  e le metopa kapa plaids ho latela ''mala lehlakoreng le leng. Tsamaiso nesting ka
  phetha nesting jarolla ka ho iketsa ho latela boitsebiso bo khetholloa dikerafike
  le khaola likotoana hlokahalang. ''Me e ka tsela e iketsang fetola likotoana angle
  ho qoba metopa kapa plaids khopama ka tshebetso fepa. Mora nesting, ho porojeketara
  tla emit khanya e khubelu ho t\u0161oaea meleng e ka ho it\u0161eha ka thepa e lekanyetsa.\\n4.
  Square Cutting\\nHaeba u feela lokela ho khaola le boholo ba lisekoere le khutlonne,
  haeba u ha ba na e hlokahalang phahameng ka seha sebetsa ka ho nepahetseng, o ka
  khetha tlase tsamaiso.\\nMosebetsi oa phallo: khamera nyane lemoha matshwao khatiso
  eaba ka laser khaola sekwere / khutlonne.\"", "\"Halofo pakeng tsa hempe le baki,
  liaparo tse apereng liaparo tse holimo li sebetsa haholo nakong ea halofo ea nako.
  Joalo ka li-sweatshirt tse koahetsoeng ka li-zip, ke seaparo se futhumetseng ka
  ho lekana ebile sea hlokahala (se loketseng ho oa), leha phello ea sona e le tloaelo
  haholo.\\nTse latelang ke mehlala e mehlano eo re u khothalletsang hore u e nahane.
  E entsoe ka thepa e fapaneng mme e ipapisitse le mekhoa e fapanengKaofela ba arolelana
  taba ea hore ke tlatsetso e ntle ho oteropo ea banna.\\nSeaparo sa setaele sa mapolanka,
  se kang sena se tsoang ho AMI, Ke seaparo seo u ka se fetolang selemo le selemo
  hobane ke tse ling tsa likotoana tse ipakileng li sa sireletsoe ke feshene.\\nE
  kopanya le Jeans le T-shirt. Mabapi le lieta, ha ua tlameha ho latela mohala oa
  hempe ka ho roala lieta tsa mosebetsi, leha e hloka ho ba lieta tse matla, ekaba
  lieta kapa lieta tsa lipapali.\\nHaeba u batla ho apara seaparo sa ka ntle ntle
  le ho tela maikutlo a li-zip-up hoodies, mofuta ona oa Battenwear ke seo u se hlokang.\\nPhetolelo
  e sebetsang empa, ka holim''a tsohle, e litoropo haholo. E tla tsamaea hantle ka
  likotoana tsa hau tsa skateboard kapa grunge.\\nMeqolo e bile e ''ngoe ea mat\u0161oao
  a Balenciaga ea Demna Gvasalia,'' me seaparo sena sa ka holimo se joalo.\\nSeaparo
  se khabisitsoeng ebile se le seholohali se fanang ka maikutlo a bobebe. E kopanya
  le t-hempe, lijini tse nyane tse nyane le lieta tsa lipapali.\\nMekhoa e meng eo
  u lokelang ho e nahana ke ea sesole le ea denim.. Zara o kentse mefuta e metle ea
  bobeli pokellong ea eona e ncha.\\nLi-Jeans ke motsoalle ea phethahetseng ho tsona
  ka bobeli, leha setaele sa sesole le sona se sebetsa mehlolo ka likotoana tsa liaparo
  tsa mosebetsi.\\nE-ba oa pele ho fana ka maikutlo\"", "\"Winner o ne a nahana hore
  herring e nkha hampe mme a hlokomela hore bohle ba re ''Lumela'' ha a ba sheba.
  Phoem, ka lehlakoreng le leng, o ne a hlile a rata herring e nang le eiee mme o
  ile a khahloa ke Rijksmuseum. Bashanyana ba babeli ba Thai, hammoho le Tino Kuis
  le mora oa hae Anoerak, ba ne ba le phomolong Netherlands libeke tse peli.\\nHo
  etsahetse ho ''na ka makhetlo a'' maloa joale, ke shebane le libata tse t\u0161osang
  Thailand. Kahoo bosiung ba maobane ho etsahetse ho ''na hape, phepheng ka kamoreng
  ea ka ea ho hlapela.\\nSjaak o ea Bangkok bakeng sa letsatsi. Ha ea ka ea tsamaea
  kamoo a neng a rerile kateng, empa o ne a ntse a e-na le nako e monate. Ha a khutlela
  Pranburi, oa ipotsa: Na nka batla ho phela tjee?\\nLung Addie o na le skrine se
  seholo haholo sa TV ke kahoo a nang le antenna e phahameng haholo serapeng sa hae
  ho amohela lit\u0161oant\u0161o tseo tse kholo. A na u oa utloisisa?\\nJacques Schulteis
  o sheba ho pota-pota lebala la lijo la Tesco ''me o bona monna ea lulang a lutse
  setulong se le seng, monna ea litelu ea shebahalang joaloka tichere ea hae ea pele
  ea geography, le linonyana tse makatsang. O tla sheba?\\nMaria Berg o robala ka
  lebaleng la lifilimi. O hloile monga ntlo. ''Me o ntse a thunngoa. O hlasela masholu
  ka sakha e nchocho e kotsi. Re ithuta ho hongata ka seo Maria a fetang ho sona.\\nEddy
  de Cooman le moahelani oa hae ba ne ba tla hlahloba Thailand hammoho ka mor''a ho
  tlohela mosebetsi ka sethuthuthu. Empa ha ea ka ea etsahala: moahelani o ne a se
  na nako. O phathahane ka eng hakaale?\\nHo int\u0161a le mosali ea se nang molekane
  ka boroa ho Thailand? U se ke ua makala ha motho e mong a tla ka lekhetlo la pele.
  Na ha a e t\u0161epe? Che, botumo ba hae bo kotsing, ho hlalosa Lung Addie.\\n''Mme
  oa ka o ile a mpalla libuka tse ngata tsa lit\u0161\u014dmo ke sa le ngoananyana,
  a qetellang ka linako tsohle: ''Me ba phela hamonate ka mor''a moo. Seo se ne se
  tla nketsahalla le \u2019na. Ka bomalimabe, hoo e bile phoso e kholo.'' Maria Berg
  o hetla morao ka letsatsi la lijo tsa mantsiboea.\\nEddy de Cooman le moahelani
  oa hae ba ne ba tla hlahloba Thailand hammoho ka mor''a ho tlohela mosebetsi ka
  sethuthuthu. ''Ho loketse hore ke ikopanye le motho ea buang Sethai se phethahetseng.''
  Empa ha ea ka ea etsahala: moahelani o ne a se na nako.\\nMaria Berg o na le li-sjans;
  seo se bonahala se ka khoneha haeba u fetile lilemo tse 70 (o ngola seo ka boeena).
  Hape bukeng ea Maria ea bo-21: ngoetsi e fihlang morao ''me e reka ka har''a pula
  e nang.\\nPim Hoonhout o bua ka sefofane sa helikopta ka 2008, moo a ileng a lumelloa
  ho lula taolong. ''Me monna oa rona oa herring oa Hua Hin o na le ntho e ncha hape:
  mackerel e tsubang le kipper. E monate!\\nTanka ea metsi ea Maria Berg e sebetsa
  ka mokhoa o makatsang: ka linako tse ling float e lula e koetsoe, ka linako tse
  ling e ea hlephile. E tlameha ebe oo ke mosebetsi oa sepoko se khopo, Maria o belaela.
  Ho feta moo: kgoho e nahanang hore ke katse. Mme mme wa katse ha a yo.\\nMaria o
  ea sepetlele le litloholo tsa hae. Ka sontaha. ''Ba u bona u tla Netherlands.''
  Hape karolong ea 19 ea buka ea hae ea liketsahalo: Bana ba thabela pizza, joalo
  ka pizza ha ea lokela ho ba joalo. Empa ba mo rata.\\nChris Verhoeven o tlo ikahela
  sebaka sa hae sa Marang-rang le ho ngola buka e buang ka kamano ea hae le Saengduan,
  ea moholo ho eena ka lilemo tse 12. Mme o senola sephiri se senyane ka ntatae.\"",
  "\"Simple tshephile ka ba thahasellisang haeba u kopana potso e ntle le ya data
  molemo.\\nLe hoja e sekametse ka puo e rarahaneng, lipatlisiso tse ngata tsa sechaba
  li hlile li bala feela lintho. Nakong ea boitsebiso bo boholo, bafuputsi ba ka bala
  ho feta leha e le neng pele, empa seo ha se bolele hore ba lokela ho qala ho bala
  ntle ho tekano. Ho e-na le hoo, bafuputsi ba lokela ho botsa: Ke lintho life tseo
  re lokelang ho li bala? Sena se ka ''na sa bonahala e le taba e ikhethang, empa
  ho na le mekhoa e mengata.\\nHangata liithuti li susumelletsa ho bala lipatlisiso
  ka ho re: Ke tla bala ntho eo ho seng motho ea kileng ae bala pele. Ka mohlala,
  seithuti se ka ''na sa re batho ba bangata ba ithutile bajaki le batho ba bangata
  ba ithutile mafahla, empa ha ho motho ea ithutileng mafahla a tsoang linaheng tse
  ling. Ka phihlelo ea ka, leano lena, leo ke le bitsang tsusumetso ka ho ba sieo
  , hangata ha le lebise lipatlisisong tse ntle. T\u0161usumetso ea ho ba sieo ke
  mofuta o kang o reng ho na le lesoba holimo moo, ''me ke tla sebetsa ka thata ho
  e tlatsa. Empa hase sekoti se seng le se seng se lokelang ho tlatsoa.\\nHo e-na
  le ho susumetsa ka ho ba sieo, ke nahana hore leano le molemo ke ho sheba lipatlisiso
  lipotso tsa bohlokoa kapa tse thahasellisang (kapa tse peli). Mantsoe ana ka bobeli
  a thata ho hlalosa, empa tsela e le ''ngoe ea ho nahana ka lipatlisiso tsa bohlokoa
  ke hore o na le t\u0161usumetso e itseng e fokolang kapa ea fepa ka qeto ea bohlokoa
  ea baetsi ba melao. Ka mohlala, ho lekanya tekanyo ea ho hloka mosebetsi ke habohlokoa
  hobane ke let\u0161oao la moruo o khanna liqeto tsa pholisi. Ka kakaretso, ke nahana
  hore bafuputsi ba na le kutloisiso e ntle ea bohlokoa. Ka hona, karolong ena kaofela,
  ke tla fana ka mehlala e ''meli moo ke nahanang ho bala ho thahasellisa. Ketsahalong
  e ''ngoe le e'' ngoe, bafuputsi ba ne ba sa behe botebo; ho e-na le hoo, ba ne ba
  e-na le litekanyetso tse khethehileng tse ileng tsa senola kutloisiso ea bohlokoa
  litabeng tse tloaelehileng mabapi le kamoo mekhatlo ea sechaba e sebetsang kateng.
  Ka mantsoe a mang, lintho tse ngata tse etsa hore lit\u0161oant\u0161iso tsena tse
  thahasellisang li be tse thahasellisang ha se data ka boeona, e tsoa mehopolong
  ena e tloaelehileng.\\nMohlala o mong oa matla a bonolo a ho bala o tsoa ho Henry
  Farber''s (2015) ithuta ka boit\u0161oaro ba bakhanni ba litekesi tsa New York City.
  Le hoja sehlopha sena se ka ''na sa se ke sa utloahala e le se thahasellisang, ke
  sebaka sa bofuputsi sa lipatlisiso bakeng sa ho hlahloba likhopolo tse peli tsa
  tlh\u014dlisano licheleteng tsa moruo. Bakeng sa lipatlisiso tsa Farber, ho na le
  likarolo tse peli tsa bohlokoa mabapi le tikoloho ea mosebetsi oa bakhanni ba tekesi:
  (1) moputso oa bona oa hora o ntse o fetoha letsatsi le leng le le leng, o thehiloe
  likarolong tse kang boemo ba leholimo, le (2) palo ea lihora mosebetsi o ka fetoha
  letsatsi le leng le le leng ho latela liqeto tsa bona. Lintho tsena li lebisa potsong
  e thahasellisang mabapi le kamano pakeng tsa moputso oa lihora le lihora tse sebetsang.
  Mefuta e meng ea mekhoa ea lichelete ea moruo e bolela esale pele hore bakhanni
  ba litekesi ba tla sebetsa ka matsatsi a mangata moo ba nang le moputso oa lihora
  tse phahameng. Ntle le moo, mehlala ea moruo ea boit\u0161oaro e bolela esale pele
  se fapaneng. Haeba bakhanni ba beha chelete e itseng-ba re $ 100 ka letsatsi-''me
  u sebetse ho fihlela sepheo seo se finyelloa, joale bakhanni ba tla qetella ba sebetsa
  lihora tse seng kae ka matsatsi ao ba fumanang ho feta. Ka mohlala, haeba u ne u
  batla ho ba le sepheo, u ka ''na ua qetella u sebetsa lihora tse'' n\u00e8 letsatsing
  le letle ($ 25 ka hora) le lihora tse hlano ka letsatsi le lebe ($ 20 ka hora).
  Ka hona, na bakhanni ba sebetsa lihora tse ngata ka matsatsi a nang le moputso o
  mongata oa lihora tse o mong (ho boletsoe ke mehlala ea neoclassical) kapa lihora
  tse eketsehileng ka matsatsi a nang le moputso oa lihora tse tlaase (ho boletsoe
  ke mekhoa ea moruo ea boit\u0161oaro)?\\nHo arabela potso ena Farber e fumane boitsebiso
  leetong le leng le le leng la tekesi le nkiloeng ke li-cabs tsa New York City ho
  tloha ka 2009 ho ea ho 2013, lintlha tse fumanehang joale. Litlaleho tsena-tse neng
  li bokelloa ke methapo ea elektronike e le hore motse o hloka literese ho o sebelisa-kenyelletsa
  tlhahisoleseding mabapi le leeto le leng le le leng: qala nako, qala sebaka, nako
  ea ho qetela, sebaka sa ho qetela, chelete, le ntlha (haeba ntlha e ne e lefshoa
  ka karete ea mokitlane) . Ha a sebelisa data ena ea litekesi, Farber o fumane hore
  bakhanni ba bangata ba sebetsa ka matsatsi a mangata ha moputso o phahame, o lumellanang
  le khopolo ea neoclassical.\\nNtle le ho fumanoa ka sehloohong sena, Farber o ile
  a khona ho sebelisa boholo ba data bakeng sa kutloisiso e ntlafatsang ea ho fetoha
  ha metsoako le matla. O fumane hore, ha nako e ntse e ea, bakhanni ba bacha ba ithuta
  ho sebetsa lihora tse ngata matsatsing a moputso o phahameng (mohlala, ba ithuta
  ho it\u0161oara joaloka mohlala oa neoclassical o bolela esale pele). ''Me bakhanni
  ba bacha ba it\u0161oereng ka tsela e t\u0161oanang le ba nang le sepheo sa ho fumana
  lichelete ba na le menyetla ea ho khaotsa ho ba bakhanni ba tekesi. Liphihlelo tsena
  tse peli tse poteletseng, tse thusang ho hlalosa boit\u0161oaro bo boletsoeng ba
  bakhanni ba hona joale, li ne li ka khoneha feela ka lebaka la boholo ba dataset.
  Ba ne ba sa khone ho fumana lipatlisiso tsa pejana tse neng li sebelisa lipampiri
  tsa lipampiri tse tsoang ho ba fokolang ba khanna ka tekesi ka nako e khut\u0161oanyane
  (Camerer et al. 1997) .\\nThuto ea Farber e ne e le haufi le boemo bo botle ka ho
  fetisisa bakeng sa lipatlisiso tse sebelisang mohloli o moholo oa lits''ebeletso
  hobane data e neng e bokelloa ke motse e ne e le haufi haholo le data eo Farber
  a neng a tla e bokella (phapang e le ''ngoe ke hore Farber o ne a ka batla dintlha
  ka kakaretso meputso-e fana ka malebela-empa data ea motse e kenyelitsoe feela keletso
  e lefuoang ke karete ea mokitlane). Leha ho le joalo, data feela e ne e sa lekana.
  Sepheo sa phuputso ea Farber e ne e tlisa potso e thahasellisang ho data, potso
  e nang le moelelo o moholo ho feta boemo bona feela.\\nMohlala oa bobeli oa ho bala
  lintho o tsoa ho lipatlisiso tsa Gary King, Jennifer Pan, le Molly Roberts (2013)
  . Leha ho le joalo, tabeng ena, bafuputsi ba ile ba tlameha ho bokella lintlha tsa
  bona tse kholo ''me ba tlameha ho sebetsana le taba ea hore data ea bona e ne e
  sa phethoa.\\nMorena le basebetsi-''moho ba ne ba susumelitsoe ke taba ea hore litaba
  tsa litaba tsa sechaba tsa Chaena li hlahlojoa ke lisebelisoa tse ngata tsa naha
  tse nkoang li kenyelletsa batho ba mashome a likete. Bafuputsi le baahi, leha ho
  le joalo, ha ba tsebe hantle hore na mabenkele ana a etsa qeto ea hore na likahare
  li lokela ho tlosoa joang. Litsebi tsa Chaena li hlile li na le litebello tse fapaneng
  mabapi le hore na ke mefuta efe ea li-post tse ka ''nang tsa tlosoa. Ba bang ba
  nahana hore li-censors li lebisa tlhokomelo likarolong tse khethollang boemo ba
  naha, ha ba bang ba nahana hore ba tsepamisitse maikutlo litabeng tse khothalletsang
  boit\u0161oaro bo kopanetsoeng, tse kang liipelaetso. Ho fumana hore na litakatso
  tsena li nepahetse ho na le maikutlo afe mabapi le hore na bafuputsi ba utloisisa
  joang China le mebuso e meng ea bolaoli e ikarabellang. Ka lebaka leo, Morena le
  basebetsi-''moho le eena ba ne ba batla ho bapisa lintlha tse ileng tsa phatlalatsoa
  ''me ka mor''a moo li tlosoa ka lingoliloeng tse hatisitsoeng'' me ha lia ka tsa
  tlosoa.\\nHo bokella lintho tse ngotsoeng moo tsena amehang hlollang boenjiniere
  ea hahaba ho feta 1,000 Chinese tsoang sechabeng mecha ea litaba websites-hore e
  mong le fapaneng leqepheng mapatlelong-ho fumana posts by tshwanetseng, ''me joale
  revisiting posts by tsena ho bona tse neng li o ile hlakolwa. Ho phaella ho mathata
  boenjiniere ho tloaelehile amahanngoa le ka tekanyo e kholo web-gagaba, morero ona
  o ne a talimane le phephetso phaella ka ho re e hlokahalang e le hore ba itima lijo
  ka ho fetisisa hobane ba bangata ba hlahlojoa posts by ba isoa fat\u0161e ka lihora
  tse ka tlaase ho 24. Ka mantsoe a mang, e leng crawler liehang ne a hopotse lotho
  ea posts by e neng e hlahlojoa. Ho feta moo, crawlers ile ka tlameha ho etsa sena
  pokello data yohle ha a ntse a tlohe phumano esere sa kahisano mecha ea phatlalatso
  ea websites thibela ho fihlella kapa ho seng joalo fetola maano a bona e le karabelo
  ea thuto.\\nNakong ea hore mosebetsi ona o moholo oa boenjiniere o phethiloe, Morena
  le basebetsi-''moho le eena ba ne ba fumane likopi tse ka bang limilione tse 11
  lihloohong tse 85 tse sa t\u0161oaneng, tse nang le boikutlo ba ho utloahala. Ka
  mohlala, sehlooho se phahameng sa kutloisiso ke Ai Weiwei, setaki sa mohatelli;
  sehlooho sa kutloisiso ea bohareng ke ho ananela le ho ananela chelete ea Sechaena,
  ''me sehlooho se se nang kutloisiso ke Seqho sa Lefat\u0161e. Har''a limilione tse
  11 tse ngolisitsoeng, hoo e ka bang limilione tse 2 li ne li hlahlojoa. Hoa makatsa
  hore ebe Morena le basebetsi-''moho le eena ba fumane hore litlaleho tse buang ka
  litaba tse thata haholo li ne li hlahlojoa hangata ho feta lihlooho tsa lihlooho
  tse bohareng le tse tlaase. Ka mantsoe a mang, li-censors tsa Sechaena li ka ba
  le monyetla oa ho hlahloba poso e buang ka Ai Weiwei e le poso e buang ka Kofi ea
  Lefat\u0161e. Liphuputso tsena ha li t\u0161ehetse khopolo ea hore ''muso o qobella
  likarolo tsohle litabeng tse thata.\\nTlhaloso ena e bonolo ea litekanyetso tsa
  ho thibela batho ka taba e ka ba khelosa, leha ho le joalo. Ka mohlala, mmuso o
  ka ''na oa qotsa litlaleho tse t\u0161ehetsang Ai Weiwei, empa tlohela li-post tse
  mo bohlokoa haholo. E le hore ba khetholle pakeng tsa libuka ka hloko, bafuputsi
  ba ne ba lokela ho lekanya maikutlo a poso ka ''ngoe. Ka bomalimabe, ho sa tsotellehe
  mosebetsi o mongata, mekhoa e ikemiselitseng ea ho lemoha maikutlo ka li-dictionaries
  tsa pele ho moo e sa ntse e le ntle haholo maemong a mangata (nahana ka mathata
  a hlahisang nako ea nakoana ea la 11 September, 2001 e hlalositsoeng karolong ea
  2.3.9). Ka hona, Morena le basebetsi-''moho le eena ba ne ba hloka mokhoa oa ho
  bitsa melaetsa ea bona ea limilione tse 11 tsa litaba tsa sechaba mabapi le hore
  na ke (1) ho hanyetsa boemo ba naha, (2) ho t\u0161ehetsa naha, kapa (3) litlaleho
  tse sa lokelang kapa tse nepahetseng ka liketsahalo. Sena se utloahala eka ke mosebetsi
  o moholo, empa ba se rarolla ka mokhoa o matla o tloaelehileng lefapheng la saense
  empa ba sa tloaelehe ka saense sa sechaba: thuto e hlophisitsoeng ; bona set\u0161oant\u0161o
  sa 2.5.\\nNtlha ea pele, ka mohato o tloaelehileng o bitsoa pele ho pheta-pheta
  , bafuputsi ba fetotse melaetsa ea liphatlalatso ho ba le lengolo le leng la matrix
  , moo ho neng ho e-na le mola o le mong bakeng sa tokomane ka ''ngoe le khoeli e
  le'' ngoe e tlalehiloeng hore na poso e na le lentsoe le itseng (mohlala, boipelaetso
  kapa sephethephethe) . Ka mor''a moo, sehlopha sa bathusi ba lipatlisiso se ile
  sa ngola mantsoe a sekheo sa melaetsa. Joale, ba sebelisitse boitsebiso bona bo
  ngotsoeng ka letsoho ho theha mochine oa ho ithuta oa mechine o ka fetisang maikutlo
  a poso ho latela lit\u0161oaneleho tsa oona. Qetellong, ba sebelisitse mokhoa ona
  ho lekanya maikutlo a limilione tse 11 tse ngotsoeng.\\nKa hona, ho e-na le ho bala
  ka boomo le ho ngola li-post-milione tse 11-tseo ho neng ho ke ke ha khoneha ho
  li etsa-Morena le basebetsi-''moho le eena ba ngotsoe ka letsoho lenane le lenyenyane
  la likarolo ebe ba sebelisa thuto e hlophisitsoeng ho lekanya maikutlo a lihlooho
  tsohle. Ka mor''a ho qeta tlhahlobo ena, ba ile ba khona ho etsa qeto ea hore, ka
  mokhoa o tsotehang, monyetla oa hore poso e tlosoe e ne e sa amane le hore na e
  ne e le ea bohlokoa ho naha kapa e t\u0161ehetsang naha.\\nQetellong, Morena le
  basebetsi-''moho le eena ba fumane hore ke mefuta e meraro feela ea likarabo tse
  neng li hlahlojoa kamehla: lit\u0161oant\u0161o tse lit\u0161ila tse tsosang takatso,
  ho nyatsuoa ha batho ba nang le mat\u0161oafo, le ba neng ba e-na le bokhoni bo
  kopanetsoeng (e leng, monyetla oa ho lebisa mekotlong e kholo). Ka ho boloka palo
  e kholo ea lipositi tse ileng tsa tlosoa le litlaleho tse sa kang tsa tlosoa, Morena
  le basebetsi-''moho ba ile ba khona ho ithuta hore na basebetsi ba censors ba sebetsa
  joang ka ho sheba le ho bala. Ho feta moo, ho t\u0161oant\u0161etsa sehlooho se
  tla etsahala ho pholletsa le buka ena, mokhoa oa ho ithuta o hlophisitsoeng oo ba
  o sebelisitseng-ho ngolisa matsoho a mang ka letsoho ebe o haha mochine oa ho ithuta
  oa mochine ho bont\u0161a hore phomolo-e fetoha e tloaelehileng haholo lipatlisisong
  tsa sechaba ka nako ea digital . U tla bona lit\u0161oant\u0161o tse ts''oanang
  le set\u0161oant\u0161o sa 2,5 likhaolong tsa 3 (ho botsa lipotso) le 5 (Ho theha
  t\u0161ebelisano ea boima); ena ke e ''ngoe ea likhopolo tse fokolang tse hlahang
  likhaolong tse ngata.\\nMehlala ena-boit\u0161oaro bo sebetsang ba bakhanni ba litekesi
  New York le boit\u0161oaro ba likamano tsa boikhathollo ba ''muso oa Chaena-pont\u0161o
  ea hore ho bonolo ho bala lits''ebeletso tse kholo tsa lits''ebeletso ho ka etsa
  hore ho be le lipatlisiso tse thahasellisang le tsa bohlokoa maemong a mang. Leha
  ho le joalo, maemong ao ka bobeli, bafuputsi ba ne ba lokela ho tlisa lipotso tse
  thahasellisang mohloling o moholo oa boitsebiso; data ka boeona e ne e sa lekana.\"",
  "\"Lefat\u0161eng le ntseng le h\u014dla la lisebelisoa tsa lapeng, tlhokahalo ea
  lisebelisoa tsa motlakase tse ka t\u0161eptjoang, tse sebetsang hantle ha li e-s''o
  ka tsa e-ba kholoanyane. Ka pele ho indasteri ena ke Zhongshan Eycom Electric Co.,
  Ltd., moetsi ea ikhethileng ea nang le boiphihlelo ba lilemo tse fetang 20 ho hlahisa
  lisebelisoa tsa boleng bo holimo tsa motlakase. Boitlamo ba rona ho boqapi le bokhabane
  bo re entse balekane ba t\u0161epahalang ba lihlahisoa tse kholo tse kang Mitsubishi,
  Hitachi le Geberit.\\nZhongshan Yikang e sebetsa ka ho khetheha ho hlahiseng likarolo
  tse fapaneng tsa ho futhumatsa motlakase ho fihlela litlhoko tse fapaneng. Sehlahisoa
  sa rona se kenyelletsa likarolo tse futhumatsang bakeng sa li omisa moriri, lihitara
  tsa motlakase, li-toaster, lisebelisoa tsa metsi esita le libaka tsa mollo tse fanyehiloeng.
  Re boetse re fana ka litharollo tse tsoetseng pele joalo ka lithapo tse ommeng tsa
  motlakase, litulo tse bohlale tsa setulo sa aluminium foil sheets, le li-tubes tsa
  motlakase tse futhumatsang. Sehlahisoa se seng le se seng se entsoe ka nepo ''me
  se entsoe ka thepa ea boleng bo holimo ho netefatsa ts''ebetso e nepahetseng le
