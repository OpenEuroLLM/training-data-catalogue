  tse ling - Li-burgers tsa nama ea maiketsetso tse entsoeng ka moriana o monate\\nBoitsebiso
  bo eketsehileng ka risepe\\nNako ea litokisetso\\nNako ea ho pheha\\nKakaretso ea
  nako\\nLi-kilocalories ka nako ea ho sebeletsa 435\\nE-ba oa pele ho fana ka maikutlo\"",
  "\"Video ea Ross e thabetse ho phatlalatsa ho fumanoa ha Video Video e thehiloeng
  Toronto. Image Video e thehiloe ka selemo sa 1974 - selemong sona seo le Ross -
  mme e tsebahala haholo ka sethala sa eona sa taolo ea litekanyetso tsa TSI, se sebelisoang
  ke bafani ba marang-rang ba phatlalatso, libaka tsa lipapali, lits''ebeletso tsa
  livideo tsa koporasi le matlo a khumamelo. Ka thekiso linaheng tse fetang mashome
  a mabeli a metso e robong, setsi se khahlisang sa bareki le li-protocol tse makholo
  tsa lisebelisoa tse t\u0161ehelitsoeng (ho tloha ho likhokahano tsa lefa la morao-rao
  le li-workflows tsa ST2110 tsa morao-rao), sethala sa TSI se ntse se tsoela pele
  ho ba moetapele sehlopheng sa lihlahisoa tsa Tally le UMD.\\nPhumano ena - Video
  ea Rosssa leshome le metso e ts''eletseng ho tloha ka 2009 - ba tla bona sehlopha
  sa lihlahisoa tsa Image Video se etelletsoeng pele ke Zach Wilkie le David Russell,
  hammoho le lihlopha tsa bona tsa R&D le t\u0161ehetso ea tekheniki kaofela ba fetela
  Ross. Zach Wilkie eo hona joale e leng Motsamaisi oa Lihlahisoa, Ross Tally Systems,
  o thabetse tebello ea bophelo e le karolo ea Video ea Ross. \u201cJoaloka k''hamphani-''moho
  le rona ea Canada e thehiloeng selemong sona seo, ho hlakile hore re holile haufi
  le eona Video ea Ross mme re bone kholo le kholo ea khoebo ea Ross, haholo lilemong
  tse leshome tse fetileng. Re thabile haholo ho ba karolo ea lelapa mme theko ena
  e tla re thusa ho fihlela mebaraka e mecha ea machabeng le ho nyoloha hantle haholo.
  \u201d\\nDavid Ross, CEO, o nahana ka bohlokoa ba theko ea motho ka mong. \u201cMorao
  koana ka 1973, Ntate o ne a le sepetlele ka mor''a ho rojoa leoto. Jim Leitch, mothehi
  oa Leitch Video (hona joale Inthaneteng) o ile a etela mme a eletsa ntate oa ka
  ho qala k''hamphani ea hae. O itse ho na le Leitch Video le Video ea Lit\u0161oant\u0161o
  naheng ea Canada, ka hona ho lokela ho ba le Video ea Ross. Ho ka etsahala hore
  haeba Image Video e ne e le sieo, ntate oa ka a ka be a se na mehlala e joalo ho
  bont\u0161a tsela, mme leha Ntate a ka qala k''hamphani ea rona, re kanna ra se
  bitsoe ka mabitso Video ea Ross kajeno! Lilemong tsena tsohle hamorao, Image joale
  e se e le karolo ea Ross, ntho eo ntate a lumelang hore e ea makatsa. Sethala sa
  lipalo tsa TSI sa set\u0161oant\u0161o se tlatselletsa tharollo ea rona e teng mme
  se nolofalletsa Ross ho tlisa khetho e eketsehileng ''marakeng oa tlhahiso ea bophelo.
  \u201d\\nBakeng sa tlhaiso-leseling e batsi ka Ross Tally Systems, ka kopo tlanya
  mona.\\nVideo ea Ross - T\u0161usumetso e phahameng, tharollo e phahameng ea tlhahiso\\nMatla
  a Ross a hlahisa lihlahisoa tsa livideo bakeng sa bashebelli ba limilione tse likete
  letsatsi le leng le le leng ka mefuta e mengata ka ho fetisisa ea indasteri tshusumetso
  e phahameng, bokgoni phahameng tharollo le lits''ebeletso. Ross o etsa hore ho be
  bonolo ho theha litaba tse qobellang, boemo ba leholimo le lipapali ho phatlalatsoa,
  ho etsa litaba tsa lipapali tsa lebala la lipapali, mananeo a boithabiso le likonsarete
  tsa rock, ditheo tsa thuto, likopano tsa molao, linehelano tsa khoebo le litaba
  tse khothatsang bakeng sa Matlo a khumamelo.\\nLihlahisoa tsa Ross li khahlile balekane
  le bo-mphato ba ho rekisa Eurosport, BBC World, SKY, Google YouTube Space London,
  le matla a machabeng a esports ESL. Ross e fana ka lihlahisoa le lit\u0161ebeletso
  tse sa bapisoang le tse ling tse kenyelletsang lik''hamera, lits''oants''o tsa nako
  ea ''nete, li-switch switch, li-robotic system tsa kh''amera, li-studio tsa nnete
  tsa nnete / li-studio, li-server, meaho le li-routers, tsamaiso ea litaba tsa sechaba,
  litsamaiso tsa likamore tsa litaba le phela lits''ebeletso tsa tlhahiso ea ketsahalo.\\nTlhokomeliso\\n-
