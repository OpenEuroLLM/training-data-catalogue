  Bimini Big Game Club Resort & Marina na Neal Watson''s Bimini Scuba Center nyere
  ebe obibi na amaba ihe nrite na ihe ngosi ah\u1ee5.\\n\\\"Agwaetiti nke Bahamas
  ch\u1ecbkwaa ihe ngosi nke af\u1ecd a kpamkpam,\\\" Greg Rolle, Sr. Director, Verticals
  Market, BOTIA kwuru. \\\"Ihe ngosi \u1ee5l\u1ecd ntu any\u1ecb mebiri nd\u1ecb na-as\u1ecdmpi
  as\u1ecdmpi na nd\u1ecb na-egwu mmiri.\\\"\\nMaaz\u1ecb Rolle kwukwara, s\u1ecb:
  \u201c \u1eccn\u1ee5n\u1ecd Bahamas n\u1ecd na-ad\u1ecdr\u1ecd mmas\u1ecb. \\\"N''ime
  ihe ngosi ah\u1ee5, a na-eto any\u1ecb maka nd\u1ecb \u1ecdkachamara any\u1ecb,
  ihe ngosi na-ad\u1ecdr\u1ecd ad\u1ecdr\u1ecd ma na-akpali akpali, na-egosi nd\u1ee5
  any\u1ecb bara \u1ee5ba na nke d\u1ecb iche iche na mgbidi vidiyo na-emek\u1ecdr\u1ecbta
  ihe, na nnukwu \u1ecdk\u1ecdl\u1ecdt\u1ecd akara, na akw\u1ee5kw\u1ecd nkwek\u1ecdr\u1ecbta
  \u1ecdh\u1ee5r\u1ee5 na ala p\u1ee5r\u1ee5 iche ruo n''uko akara akara.\\\"\\nRolle
