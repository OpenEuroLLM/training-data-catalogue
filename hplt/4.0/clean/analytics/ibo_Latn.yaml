  "\"Rejang (baso Jang, baso Hejang ) b\u1ee5 As\u1ee5s\u1ee5 Austronesian nke Nd\u1ecb
  Rejang na-as\u1ee5kar\u1ecb na mpaghara nd\u1ecbda oriri nke Sumatra (Bengkulu),
  Indonesia. E nwere olumba ise, akara site na mpaghara ugwu ruo n''\u1ee5d\u1ecb
  osimiri nke Bengkulu, egwu olumba Musi (Musai), olumba Lebong, olumba Kebanagung,
  olumba Rawas (Awes), na olumba Pesir..\\nO doro anya na Rejang ad\u1ecbgh\u1ecb
  nso na nd\u1ecb \u1ecdz\u1ecd Malayo-Polynesian na Sumatra. McGinn (2009) kewara
  ya n''etiti As\u1ee5s\u1ee5 Bidayuh nke Borneo, nke kacha nso na Bukar-Sadong. D\u1ecb
  ka isi iyi ah\u1ee5 si kwuo, lashe nd\u1ecb a na-eker\u1ecbta ibuli *a gaa na *\u0259
  Okwu-n''ikpeaz\u1ee5, ma \u1ecd b\u1ee5 na n''agho okwu ikpeaz\u1ee5 ma e wez\u1ee5ga
  nd\u1ecb na-agw\u1ee5 na-ume velar *k, *\u014b.[1] O nwere ike \u1ecbb\u1ee5 na
  \u1ecd nwewe njik\u1ecd na aha Nasal a hardware \u1ecdh\u1ee5r\u1ee5, mana nke ah\u1ee5
  b\u1ee5 omume nk\u0254 n''oge a.[2] Robert Blust na Alexander Smith kewara Rejang
  d\u1ecb ka nke aha Greater North Borneo (2017a, 2017b). [4][5][6]\\nRejang nwere
  olumba ise d\u1ecb iche iche. Nd\u1ecb na-as\u1ee5 as\u1ee5s\u1ee5 \u1ecd b\u1ee5la
  nwere ike ikwur\u1ecbta okwu n''etiti onwe ha, n''agbanyegh\u1ecb \u1ecdd\u1ecbiche
  d\u1ecb iche iche na \u1ee5daume. As\u1ee5s\u1ee5 an\u1ecd nke Rejangs b\u1ee5 Curup,
  Lebong, Kepahiang, na Utara. N''etiti olumba niile, olumba Awes b\u1ee5 nke kachas\u1ecb
  sie ike maka nd\u1ecb na-as\u1ee5 olumba nd\u1ecb \u1ecdz\u1ecd. [citation needed]\\nEdere
  Rejang na script Rejang ruo ogologo oge.[1] A na-eche na ihe odide ah\u1ee5 d\u1ecbbu
  tupu e webata Islam n''\u00f3gb\u00e8 ah\u1ee5 na nar\u1ecb af\u1ecd nke 12 OA,
  \u1ecd b\u1ee5 ezie na e dep\u1ee5tala akw\u1ee5kw\u1ecd mb\u1ee5 e dep\u1ee5tara
  n''ihe d\u1ecb ka n''etiti nar\u1ecb af\u1ecd nke 18. A na-ede ya na achara, mpi
  at\u1ee5, ogbugbo ma \u1ecd b\u1ee5 efere \u1ecdla k\u1ecdpa. \u1ecc b\u1ee5 naan\u1ecb
  n''oge na-ad\u1ecbbegh\u1ecb anya ka ewep\u1ee5tara mkp\u1ee5r\u1ee5edemede Lat\u1ecbn
  d\u1ecb ka \u1ee5z\u1ecd e si ede as\u1ee5s\u1ee5 ah\u1ee5.\\nA na-ah\u1ee5kwa trill
  /r/, mana \u1ecd b\u1ee5 naan\u1ecb na okwu nd\u1ecb a gbazitere.[1]\\nIhe na-eson\u1ee5
  b\u1ee5 ihe at\u1ee5 ederede na Rejang, nke Nkeji edemede 1 nke Universal Declaration
  of Human Rights (site na United Nations):\\n- Kut\u00ea tun laher m\u00eardeka,
  tmuan hok-hok gik srai. Kut\u00ea nagiak-ba ak\u00eaa peker ngen at\u00eai, k\u00earno
  o k\u00ealok-n\u00ea b\u00eakuat-ba do ngen luy\u00ean l\u00eam asai s\u00eapasuak.\\nGloss
  (okwu-okwu):\\n- Nkeji edemede 1 - A m\u1ee5r\u1ee5 mmad\u1ee5 niile n''onwe ya,
  o nwere ikike h\u00e0 nhata. A na-enye ha \u1ee5z\u1ecd isi chee echiche na obi;
  mgbe ah\u1ee5, ha kwes\u1ecbr\u1ecb \u1ecbb\u1ee5 enyi [nk\u1ecdwa d\u1ecb mkpa]
  na ibe ha n''\u1ee5z\u1ecd nke nwanne.\\n- Nkeji edemede 1 - A na-am\u1ee5 mmad\u1ee5
  niile n''efu ma ha nhata. A na-enye ha ezi uche na ak\u1ecd na uche ma ha kwes\u1ecbr\u1ecb
  imek\u1ecdr\u1ecbta ihe n''ebe ibe ha n\u1ecd n''ime mm\u1ee5\u1ecd nke \u1ecdb\u1ee5b\u1ee5enyi.\\n-
  Aichele (1984). A Fragmentary Sketch of the Rejang Language. Materials for a Rejang-Indonesian-English
  dictionary (Pacific Linguistics: Series D, 58.): Canberra: Research School of Pacific
  and Asian Studies, Australian National University..\\n- Blust (2010). \\\"The Greater
  North Borneo Hypothesis\\\". Oceanic Linguistics 49 (1): 44\u2013118. DOI:10.1353/ol.0.0060.\\n-
  MacGinn (1982). Outline of Rejang Syntax, NUSA 14. Jakarta: Universitas Atma Jaya.\\n-
  Smith (2017). \\\"The Western Malayo-Polynesian Problem\\\". Oceanic Linguistics
  56 (2): 435\u2013490. DOI:10.1353/ol.2017.0021.\\n- Richard McGinn, Archive of Materials
  for the Study of the Rejang of Sumatra. Archived24 Septemba 2015 na\u1ee4gb\u1ecd
  Mmiri Wayback\"", "\"D\u1ecb ka nd\u1ecb nyocha nyocha nke Regional Research Report
  si kwuo, nd\u1ecb\\nIgwe \u1ecdk\u1ee5A na-eche na ah\u1ecba ga-enweta nnukwu uto
  n''oge am\u1ee5ma. Ak\u1ee5k\u1ecd ah\u1ee5 na-ak\u1ecdwa na a na-eche na az\u1ee5mah\u1ecba
  a ga-edebanye aha na uto d\u1ecb \u1ecbr\u1ecbba ama n''ime oge na-ab\u1ecban\u1ee5.
  Akuko a na-enye ozi nleba anya n''ah\u1ecba zuru oke maka ng\u1ee5k\u1ecdta \u1ecdn\u1ee5
  ah\u1ecba nke \u1ee5l\u1ecd \u1ecdr\u1ee5 a na-aza ugbu a yana \u1ecd g\u1ee5nyekwara
  ngalaba, nyocha \u1ee5l\u1ecd \u1ecdr\u1ee5 yana ohere uto na \u1ecdn\u1ecdd\u1ee5
  d\u1ecb ugbu a n''ofe ngwa az\u1ee5maah\u1ecba a. Ak\u1ee5k\u1ecd a na-enyekwa mmet\u1ee5ta
  nke nkw\u1ee5ghachi \u1ee5gw\u1ecd, \u1eccn\u1ee5 ego n''ah\u1ecba, mmachi, na agha
  az\u1ee5mah\u1ecba n''etiti mba d\u1ecb iche iche. Ak\u1ee5k\u1ecd a nwere ike \u1ecbnye
  at\u1ee5mat\u1ee5 na aro nke otu d\u1ecb iche iche d\u1ecbka IMF, Bank World, WTO,
  na nd\u1ecb \u1ecdz\u1ecd. Na mgbakwunye, \u1ecd G\u1ee5nyere eserese uru, nyocha
  SWOT, oke ah\u1ecba, yana ozi zuru ezu gbasara mgbasa mpaghara az\u1ee5mah\u1ecba
  a. \u1eccz\u1ecdkwa, ak\u1ee5k\u1ecd ah\u1ee5 na-enyocha ngh\u1ecdta banyere \u1ecdn\u1ecdd\u1ee5
  ah\u1ecba ugbu a nke nd\u1ecb egwuregwu / \u1ee5l\u1ecd \u1ecdr\u1ee5 a ma ama na
  mpaghara as\u1ecdmpi nke ah\u1ecba a.\"", "\"Ak\u1ee5k\u1ecd banyere \u1ecdk\u1ecdl\u1ecdt\u1ecd
  nd\u1ecb Brazil bidoro na 1822, mgbe \u1ecdk\u1ecdl\u1ecdt\u1ecd mb\u1ee5 nke steeti
  nwere onwe p\u1ee5tara. N\u00e1 ngw\u1ee5s\u1ecb nke nar\u1ecb af\u1ecd nke 19,
  \u1ecd gbanwere n''\u1ee5z\u1ecd d\u1ecb \u1ecbr\u1ecbba ama, na mgbe nke ah\u1ee5
  gas\u1ecbr\u1ecb, \u1ecd b\u1ee5 naan\u1ecb obere mmezighar\u1ecb ka e mere ya.
  Ihe nn\u1ecdchianya nke agba na ihe d\u1ecb iche iche agbanweela oge.\\n\u1ecck\u1ecdl\u1ecdt\u1ecd
  Brazil\\nNa 1889, \u1ecdk\u1ecdl\u1ecdt\u1ecd Brazil nabatara n''\u1ee5z\u1ecd iwu,
  nke akp\u1ecdr\u1ecd \\\"\u1ecdla edo-acha akw\u1ee5kw\u1ecd nd\u1ee5\\\". Na 1968,
  nhazi ya gbanwere ntak\u1ecbr\u1ecb, obere oge ka emechara iwu gbasara akara mba.
  \u1ecck\u1ecdl\u1ecdt\u1ecd natara ngosip\u1ee5ta \u1ecdh\u1ee5\u1ee5 \u1ecdh\u1ee5\u1ee5
  na 1992.\\n\u1ecck\u1ecdl\u1ecdt\u1ecd Brazil b\u1ee5 ak\u1ee5k\u1ee5 akw\u1ee5kw\u1ecd
  nd\u1ee5 akw\u1ee5kw\u1ecd nd\u1ee5 ak\u1ee5k\u1ee5 an\u1ecd nwere rhombus na-acha
  odo odo na etiti ya na-agbat\u1ecb elu. O nwere okirikiri gbara \u1ecdch\u1ecbch\u1ecbr\u1ecb
  na-acha an\u1ee5n\u1ee5 an\u1ee5n\u1ee5 nke nwere \u1ecdt\u1ee5t\u1ee5 kpakpando
  na-acha \u1ecdcha ise nwere akara ise: enwere iri ab\u1ee5\u1ecd na asaa na mkpok\u1ecdta,
  a na-ach\u1ecbk\u1ecdta ha n''\u1ecdt\u1ee5t\u1ee5 kpakpando. A na-agafe okirikiri
  a site na r\u1ecbb\u1ecdn\u1ee5 \u1ecdcha nke edere \u1ee5kp\u1ee5r\u1ee5 mba Brazil
  - \\\"Iwu na \u1eccganihu\\\".\\nIhe \u1ecdk\u1ecdl\u1ecdt\u1ecd \u1ecdk\u1ecdl\u1ecdt\u1ecd
  Brazil\\n\u1ecck\u1ecdl\u1ecdt\u1ecd nke oge a nke Brazil nwere \u1ecdt\u1ee5t\u1ee5
  at\u1ee5mat\u1ee5 yiri nke \u1ecdk\u1ecdl\u1ecdt\u1ecd ochie ejiri na 1822 kemgbe
  nnwere onwe nke mba ah\u1ee5. \u1ecc na-eji agba agba ab\u1ee5\u1ecd: akw\u1ee5kw\u1ecd
  nd\u1ee5 akw\u1ee5kw\u1ecd nd\u1ee5 na edo edo, nke na-ese onyinyo usoro nd\u1ecb
  eze nke Habsburgs na Braganza - nke onye isi ala Brazil Pedro I na nwunye ya si.
  N''eziokwu, eze ukwu ah\u1ee5 kwuru na akw\u1ee5kw\u1ecd nd\u1ee5 akw\u1ee5kw\u1ecd
  nd\u1ee5 kwes\u1ecbr\u1ecb \u1ecbp\u1ee5ta oge opupu ihe ubi, na odo - \u1ecdla
  edo. A na-acha an\u1ee5n\u1ee5 an\u1ee5n\u1ee5 \u1ee5wa d\u1ecbkwa na \u1ecdk\u1ecdl\u1ecdt\u1ecd
  a, ejiri \u1ecdta mee ya.\\nIhe nd\u1ecb \u1ecdz\u1ecd - alaka \u1ee5taba na k\u1ecdf\u1ecb,
  r\u1ecbb\u1ecdn na-acha an\u1ee5n\u1ee5 an\u1ee5n\u1ee5 - ad\u1ecbgidebegh\u1ecb
  na \u1ee5d\u1ecb nke oge a.\\nMgbe mkp\u1ecdsa nke Brazil d\u1ecb ka Republic d\u1ecb
  na 1889, a nabatara iwu na akara nke \u1ecdk\u1ecdl\u1ecdt\u1ecd \u1ecdh\u1ee5r\u1ee5.
  Ndi ochichi ohuru achoghi imebi ihe nile ha na oge gara aga nke mba, ya mere ha
  kpebiri \u1ecbhap\u1ee5 oji na-acha odo odo. B\u1ecd\u1ecdl\u1ee5 na-acha an\u1ee5n\u1ee5
  an\u1ee5n\u1ee5 ka f\u1ecdr\u1ecd nke nta ka \u1ecd ghara \u1ecbgbanwe, mana ugbu
  a egosighi \u1ee5wa, mana \u1ecdh\u1ee5\u1ee5 nke mbara igwe jup\u1ee5tara n''\u1ecdt\u1ee5t\u1ee5
  kpakpando, \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 nke kpakpando nke ya na \u1ecdn\u1ee5
  \u1ecdg\u1ee5g\u1ee5 mpaghara mpaghara na steeti.\\nOnye dere oru ngo a sere onyinyo
  nke kpakpando nke Southern Cross, Scorpio na Triangle dika elere site na mbara igwe,
  obughi site na uwa. Mana \u1ecd mechara b\u1ee5r\u1ee5 ihe \u1ecbga nke \u1ecdma,
  ha wee hap\u1ee5 ya. A h\u1ee5r\u1ee5 kpakpando nd\u1ecb a na latitude nke Rio de
  Janeiro n''\u1ee5b\u1ecdch\u1ecb Brazil gh\u1ecdr\u1ecd mba Republic.\\nMgbe emebere
  mpaghara \u1ecdh\u1ee5r\u1ee5, \u1ecdn\u1ee5\u1ecdg\u1ee5 kpakpando na-acha an\u1ee5n\u1ee5
  an\u1ee5n\u1ee5 na-agbanwe.\\nN''otu oge ah\u1ee5, etinyere \u1ecdk\u1ecdl\u1ecdt\u1ecd
  na ihe \u1ecdh\u1ee5r\u1ee5 - eriri na-acha \u1ecdcha nwere motto, nke a gbaziri
  n''aka onye \u1ecdk\u00e0 ihe \u1ecdm\u1ee5ma France b\u1ee5 Comte.\\nTaa, a na-ak\u1ecdwa
  agba nke \u1ecdk\u1ecdl\u1ecdt\u1ecd d\u1ecb iche iche: akw\u1ee5kw\u1ecd nd\u1ee5
  akw\u1ee5kw\u1ecd nd\u1ee5 p\u1ee5tara \u1ecdd\u1ecbd\u1ecb d\u1ecb oke ala nke
  mba South America nwere \u1ecdn\u1ee5 \u1ecdg\u1ee5g\u1ee5 d\u1ecb ukwuu nke oke
  mmiri ozuzo gburugburu Amazon, odo p\u1ee5tara ak\u1ee5n\u1ee5ba nke mineral n''okpuru
  ala (g\u1ee5nyere \u1ecdla edo), acha an\u1ee5n\u1ee5 an\u1ee5n\u1ee5 p\u1ee5tara
  mbara igwe d\u1ecb \u1ecdcha, \u1ecdcha putara udo na obi iru ala.\"", "\"Nr\u1ee5nye
  nd\u1ecb a d\u1ecb n''etiti \u00ech\u00e8 na nd\u00f2, Nick Turse dere. \u1ecc b\u1ee5
  ezie na anabatara d\u1ecb ka \u1ecdd\u1ee5 \u1ee5gb\u1ecd mmiri nd\u1ecb agha mba
  ofesi, ewep\u1ee5r\u1ee5 ha na nch\u1ecbk\u1ecdta nd\u1ecb \u1ecdr\u1ee5 g\u1ecd\u1ecdment\u1ecb.\\nOnye
  isi ala nke t\u1ee5furu nd\u1ecb na-akw\u1ee5 \u1ee5gw\u1ecd mba \u1ee5wa n''af\u1ecd
  2015 ugbu a na-ese onyinyo \u1ecdz\u1ecd d\u1ecb egwu site n''inye nd\u1ecb ogbu
  mmad\u1ee5 ezumike, ka John Kiriakou dere.\\nUS na-aga maka jugular na mmachi Iran
  \u1ecdh\u1ee5r\u1ee5 ezubere iji taa nd\u1ecb na-az\u1ee5 ah\u1ecba na Tehran ah\u1ee5h\u1ee5.
  Mana US nwere ike \u1ecbl\u1ee5 \u1ecdg\u1ee5 n''aka ya n''oge mgbanwe mgbanwe WWII
  ga-ekwe omume, Patrick Lawrence dere.\\nIhe f\u1ecdd\u1ee5r\u1ee5 na-agbaghar\u1ecb
  n''\u1ecdzara enyo any\u1ecb na-adabere na mmet\u1ee5ta uche nke chi nwany\u1ecb
  ah\u1ecba. Ka a s\u1ecbkwa ihe mere mmet\u1ee5ta nke njik\u1ecdta Eurasia ga-ab\u1ee5
  \u1ecdnw\u1ee5 Bretton Woods na \\\"\u1ecdch\u1ecbch\u1ecb onye kwuo uche\\\" neoliberalism,
  ka Pepe Escobar na-ekwu.\\nN''aj\u1ee5j\u1ee5 \u1ecdn\u1ee5 ya na Consortium News,
  onye ndu nnwere onwe na onye otu nzuko omeiwu Spain gwara Attilio Moro na nd\u1ecb
  Catalonia akw\u1ee5s\u1ecbbegh\u1ecb \u1ecbch\u1ecd ikewap\u1ee5 na Madrid.\\n\u1eccd\u1ecbda
  nke nd\u1ecb aka ekpe nke Italy ahap\u1ee5la Italytali nke ''ah\u1ecba efu'' na-ach\u1ecb,
  d\u1ecbka onye k\u1ecdmish\u1ecdna European Union kwuru na \u1ecd ga-eme, ka Attilio
  Moro kwuru.\"", "\"- Akw\u1ee5kw\u1ecd a ma ama Leonardo da Vinci'' Mona Lisa nke
  nar\u1ecb af\u1ecd nke 17 na-aga n''ebe a na-ere ah\u1ecba Paris.\\n- A na-at\u1ee5
  anya na nnomi nke \u1ecdmar\u1ecbcha ihe osise da Vinci ga-enweta euro 150,000-200,000.\\n-
  Mona Lisa nke nar\u1ecb af\u1ecd nke 17 \u1ecdz\u1ecd rere ya nde euro 2.9 na June
  na Christie''s na Paris.\\n\u1ee4l\u1ecd \u1ecbre ah\u1ecba artcurial d\u1ecb na
  Paris, France mara \u1ecdkwa na otu Leonardo da Vinci''s Mona Lisa malitere na gburugburu
  1600 ka a ga-ere ah\u1ecba na Tuesday.\\nNkwek\u1ecdr\u1ecbta kwes\u1ecbr\u1ecb
  nt\u1ee5kwas\u1ecb obi nke \u1ecdmar\u1ecbcha ihe osise da Vinci nke malitere n''ihe
  kar\u1ecbr\u1ecb af\u1ecd 400 gara aga ga-aga n''okpuru hama ka \u1ecdnwa ole na
  ole gachara mmeputakwa \u1ecdz\u1ecd nke otu n''ime eserese kacha mara mma n''\u1ee5wa
  maka \u1ecdn\u1ee5 ah\u1ecba ndek\u1ecd.\\nIhe mb\u1ee5 Leonardo da Vinci mere,
  nke Eze France Francois m z\u1ee5tara n''aka onye na-ese ihe na 1518, b\u1ee5 ihe
  ngosi na Paris. Vl\u1ecd ihe ngosi nka nke Louvre \u1ecd b\u1ee5gh\u1ecbkwa ire
  ere.\\nMona Lisa''n\u1e45omi nke a ga-ere na Paris yiri nke mb\u1ee5 nke na \u1ecd
  ga-ab\u1ee5 na onye na-ese ihe nwere ohere d\u1ecb nso na ns\u1ee5ghar\u1ecb Leonardo,
  \u1ee5l\u1ecd ah\u1ecba ah\u1ecba Artcurial kwuru.\\n\\\"Mona Lisa b\u1ee5 nwany\u1ecb
  kachas\u1ecb mma na eserese,\\\" \u1ecdkachamara n''\u1ee5l\u1ecd ah\u1ecba na-ere
  ah\u1ecba Artcurial na onye na-ere ah\u1ecba, Matthieu Fournier, kwuru ka eserese
  ah\u1ee5 na-aga n''ihu \u1ecdha tupu ire ere.\\n\\\"Onye \u1ecd b\u1ee5la ch\u1ecdr\u1ecd
  \u1ecbnwe \u1ee5d\u1ecb Mona Lisa d\u1ecb elu.\\\"\\nA na-at\u1ee5 anya na oyiri
  a ga-enweta euro 150,000-200,000 ($173,000-$230,000).\\nJune gara aga, onye na-anak\u1ecdta
  nd\u1ecb Europe z\u1ee5tara ihe \u1ecdz\u1ecd nke nar\u1ecb af\u1ecd nke 17 Mona
  Lisa maka nde euro 2.9 ($ 3.35), ndek\u1ecd maka mmeghari nke \u1ecdr\u1ee5 ah\u1ee5,
  n''ah\u1ecba ah\u1ecba na Christie''s na Paris.\\nNa 2017, Christie''s New York
  rere Leonardo da Vinci''s Salvator Mundi maka nde $ 450 na-agbaji.\"", "\"\u1ee4l\u1ecd
  \u1eccgw\u1ee5 \u1ee4l\u1ecd \u1eccgw\u1ee5 Na-agba \u1ecck\u1ee5\\nOZI HOSPITAL\\n\u1eccn\u1ee5
  \u1ee5z\u1ecd \u1ecdh\u1ee5\u1ee5 nke \u1ee5l\u1ecd \u1ecdgw\u1ee5, \u1ecdn\u1ee5
  \u1ee5z\u1ecd \u1ecd b\u1ee5la nwere otu efere \u00edgw\u00e8 nchara, jik\u1ecdtara
  ya na etiti ak\u1ee5k\u1ee5 nke okpokoro nke okpukpu ala na ike elu nke an\u1ee5
  \u1ecdh\u1ecba, gburugburu akwa igwe anagh\u1ecb agbacha agbacha, mechie ezi omume
  nke \u1ecdma, mechie elu mee nke elu mma EPDM p\u1ee5r\u1ee5 iche b\u1ee5r\u1ee5
  ihe akara zuru oke. Ngwongwo \u00edgw\u00e8 nchara eji ar\u1ee5 \u1ecdr\u1ee5 na-acha
  agba oyi na-acha \u1ecdcha, nke d\u1ecb elu na-acha \u1ecdcha na-acha \u1ecdcha
  polyester electrostatic nt\u1ee5 nt\u1ee5 mkpuchi, ya ar\u1ee5m\u1ecdr\u1ee5 d\u1ecb
  ka GB5237.4-2000 \u1ecdk\u1ecdl\u1ecdt\u1ecd (kwek\u1ecdr\u1ecd na \u1ee5kp\u1ee5r\u1ee5
  Europe QUALICOA D) , na mmepe nke oke osisi. Door Press (nlek\u1ecdta ah\u1ee5ike
  na-egbochi \u1ecdgw\u1ee5 mgbochi \u1ecdr\u1ecba X-ray) na-ekpuchi \u1ecdkp\u1ee5r\u1ee5kp\u1ee5
  kwek\u1ecdr\u1ecd n''\u1ee5d\u1ecb stereotype, mkpuchi nchebe na-ekpo \u1ecdk\u1ee5
  2mmpb okpurukpu, \u1ecdkp\u1ee5r\u1ee5kp\u1ee5 nke \u1ecdz\u1ecd 2mmbp nchedo. Ihe
  d\u1ecb iche iche na-eme ka a na-ah\u1ee5 anya d\u1ecb iche iche, d\u1ecb iche iche
  na mgbidi ah\u1ee5, na-agbanwe agbanwe nke mmet\u1ee5ta iji zere \u1ecdn\u1ee5 \u1ee5z\u1ecd,
  na-eme ka nchebe d\u1ecb nchebe, \u1ecb na-emeghe nke \u1ecdma.\\nNgwaah\u1ecba
  At\u1ee5mat\u1ee5:\\n1. Oghere \u1ecdn\u1ee5 \u1ee5z\u1ecd jup\u1ee5tara na \u1ee5f\u1ee5f\u1ee5
  polyurethane na nk\u00e0 na \u1ee5z\u1ee5 n''ogologo nnukwu nr\u1ee5gide, elu-ike
  aluminom alloy etiti, na-ebuli elu nnukwu ikpo okwu hydraulic ngwa \u1ecbp\u1ecb.
  Ihe d\u1ecb mma na ngwa\u1ecdr\u1ee5 na tekn\u1ee5z\u1ee5 iji h\u1ee5 na enwere
  ike \u1ecbmep\u1ee5ta akw\u1ee5kw\u1ecd \u1ecdn\u1ee5 \u1ee5z\u1ecd: \u1ee5d\u1ecb
  mpempe akw\u1ee5kw\u1ecd d\u1ecb iche iche, nchara \u00edgw\u00e8, aluminom, osisi
  electrolytic, oghere PVC, oghere \u1ee5z\u1ecd nwere ike \u1ecbh\u1ecdr\u1ecd \u1ecdt\u1ee5t\u1ee5
  agba agba.\\nakara akara, d\u1ecbka akara nke \u1ee5l\u1ecd \u1ecdgw\u1ee5 na-eji
  ah\u1ee5 ike 2. Umu \u1ee5z\u1ecd mep\u1ee5tara ak\u1ee5k\u1ee5 ab\u1ee5\u1ecd,
  ihe d\u1ecb elu na nke etiti\\n3. Oghere \u1ee5z\u1ecd na \u1ecdn\u1ee5 \u1ee5z\u1ecd
  nwere ike ijik\u1ecdta ya na stereotype maka nchedo radieshon.\\n4. Ogige igwe anagh\u1ecb
  agba nchara 304, \u1ecdn\u1ee5 \u1ee5z\u1ecd etiti e tinyere na akwa d\u1ecb mma
  d\u1ecb ka ihe mgbakwunye p\u1ee5r\u1ee5 iche, mejup\u1ee5ta \u1ecdn\u1ee5 \u1ee5z\u1ecd
  d\u1ecb n''ime ya \u1ecdn\u1ee5 p\u1ee5r\u1ee5 iche maka ntutu isi nke polyurethane.
  \u1eccn\u1ee5 nke otu, \u1ecdn\u1ee5 \u1ee5z\u1ecd ab\u1ee5\u1ecd, \u1ecdn\u1ee5
  \u1ee5z\u1ecd ab\u1ee5\u1ecd, nnukwu ahaziri\\n5. Ngwa: \u1ee5l\u1ecd \u1ecdgw\u1ee5
  pom, laboratory.\\nEzubere maka ime \u1ee5l\u1ecd d\u1ecb \u1ecdcha d\u1ecbka \u1ee5l\u1ecd
  \u1ecdr\u1ee5 \u1ee5l\u1ecd \u1ecdgw\u1ee5, \u1ee5l\u1ecd \u1ecdr\u1ee5 mmep\u1ee5ta
  \u1ecdgw\u1ee5, \u1ee5l\u1ecd \u1ecdr\u1ee5 mmep\u1ee5ta ihe ziri ezi, \u1ee5l\u1ecd
  ah\u1ecba nri, \u1ee5l\u1ecd \u1ecdr\u1ee5 na-ar\u1ee5 \u1ecdr\u1ee5 \u1ee5l\u1ecd
  \u1ecdgw\u1ee5.\\nNk\u00e0 na \u1ee5z\u1ee5:\\nMgbanwe Igwe \u1ecdk\u1ee5 Nchedo:
  Nke a b\u1ee5 nke kwek\u1ecdr\u1ecd n''\u1ee5kp\u1ee5r\u1ee5 nd\u1ecb Europe, yana
  nnwere onwe zuru oke. Nakwa kwek\u1ecdr\u1ecd na \u1ee5kp\u1ee5r\u1ee5 ESC na n''usoro
  ya na g\u1ecd\u1ecdment\u1ecb France banyere iwu \u1ecdr\u1ee5 ka ach\u1ecdr\u1ecd
  \u1ecdn\u1ee5 \u1ee5z\u1ecd. Nkwek\u1ecdr\u1ecbta na iwu Germany banyere \u1ecdn\u1ee5
  \u1ee5z\u1ecd d\u1ecb n''\u00e8z\u00ed nke ike na-amalite\\nAsambodo anyi\\nNkwak\u1ecdba
  na l\u1ecdjistik\\nKedu \u1ecdr\u1ee5 \u1ecb ga-enweta n''aka any\u1ecb?\\n1) \u1eccr\u1ee5
  OEM maka g\u1ecb na nd\u1ecb ah\u1ecba g\u1ecb.\\n2) Kwadoro mbupuga g\u1ecb maka
  ebe niile.\\n3) Akara CE / ISO-9001 / SGS\\n4) Ntinye vidiyo ma \u1ecd b\u1ee5 nt\u1ee5ziaka
  maka g\u1ecb.\\n5) At\u1ee5mat\u1ee5 d\u1ecb mma maka \u1ecdn\u1ee5 \u1ee5z\u1ecd
  ziri ezi.\\n6) \u1eccr\u1ee5 \u1ecdr\u1ee5 na-akwado as\u1ee5s\u1ee5, email ma \u1ecd
  b\u1ee5 oku ekwent\u1ecb.\\n7) Nduzi na nt\u1ee5ziaka na-ar\u1ee5 \u1ecdr\u1ee5
  mgbe echichi.\\n8) \u1eccr\u1ee5 / Service na-enwegh\u1ecb at\u1ee5 mgbe \u1ecd
  b\u1ee5la.\\n9) 12 \u1eccnwa \u1ecdh\u1ee5\u1ee5 maka \u1ecdn\u1ee5 \u1ee5z\u1ecd
  na ngwa niile.\\nNgwaah\u1ecba : \u1eccn\u1ee5 \u1ee5z\u1ecd mpep\u1ee5 akpaaka
  > \u1eccn\u1ee5 \u1ee4z\u1ecd \u1ecagba \u1ecck\u1ee5 n''\u1ee4l\u1ecd\"", "\"Article
  excerpt\\nHere\u2019s how invention and entrepreneurship fit into STEM education\\nThe
  STEMIE Coalition aims to impact youth invention and entrepreneurship by acting as
  an umbrella organization for 600 K-12 youth groups across the U.S. and sharing best
  practices, evaluating programs and offering national data around invention and entrepreneurship
  efforts.\\nOur take\\nA Focus on mep\u1ee5tara\\nNa-anya n''ebe agba ume mep\u1ee5tara
  na ndi oru itumgbere ahia n''etiti mba nd\u1ecb K-12 \u1ee5m\u1ee5 akw\u1ee5kw\u1ecd,
  na STEMIE Coalition e mere na-ise \u1ecdn\u1ee5 a nso nke kas\u1ecb mma omume na,
  atumatu iji kwalite am\u1ee5r\u1ee5 mmas\u1ecb na sayens\u1ecb na nk\u00e0 na \u1ee5z\u1ee5.
  The Coalition ejik\u1ecd 600 K-12 na-eto eto iche iche maka ak\u1ecdr\u1ecd mm\u1ee5ta
  na kas\u1ecb mma omume, d\u1ecb ka mkpanaka site na Connecticut mep\u1ee5tara Convention.
  Olee ot\u00fa g\u1ecb na \u1ee5m\u1ee5 akw\u1ee5kw\u1ecd na-ejik\u1ecdr\u1ecd?\\nThe
  STEMIE Coalition-elekwas\u1ecb anya na usoro nk\u00e0 mm\u1ee5ta sayens\u1ecb, engineering
  imewe, mep\u1ee5tara na ndi oru itumgbere ahia. One isi ak\u1ee5r\u1ee5ngwa b\u1ee5
  a mba mpi maka \u1ee5m\u1ee5 akw\u1ee5kw\u1ecd na 4-12 \u1ecdm\u1ee5m\u1ee5 iji
  gosip\u1ee5ta ha kere eke. Mmek\u1ecdr\u1ecbta niile shapes na nha nwere ike ime
  ka a buru ibu mmet\u1ee5ta na mm\u1ee5ta ohere na a ga esi.\\nREAD THE FULL STORY
  HERE\""]'
