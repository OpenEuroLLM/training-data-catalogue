  d\u1ecb ka nd\u1ecb agha n''otu n''otu, otu onye uwe ojii. , na nyocha nke otu onye.\\nNk\u1ecdwa
  nka nka\\nIji ngwaah\u1ecba\\nOkwu Mmalite nke \u1ee5l\u1ecd \u1ecdr\u1ee5\\nNa
  2008, Beijing Hewei Yongtai Technology Co., LTD e guzobere na Beijing.Focus na mmepe
  na \u1ecdr\u1ee5 nke p\u1ee5r\u1ee5 iche nchekwa ak\u1ee5r\u1ee5ngwa, tumadi na-eje
  ozi \u1ecdha nche iwu, ngw\u00e1 agha uwe ojii, agha, omenala na nd\u1ecb \u1ecdz\u1ecd
  na mba nche ngalaba.\\nNa 2010, Jiangsu Hewei Police Equipment Manufacturing Co.,
  LTD e guzobere na Guannan.Ekpuchi ebe 9000 square mita nke ogbako na \u1ee5l\u1ecd
  \u1ecdr\u1ee5 \u1ee5l\u1ecd, \u1ecd aims na-ewu a mb\u1ee5-klas p\u1ee5r\u1ee5 iche
  nchekwa ngw\u00e1 nnyocha na mmepe isi na China.\\nNa 2015, a agha-nd\u1ecb uwe
