  na akw\u1ee5kw\u1ecd mbupu nd\u1ecb \u1ecdz\u1ecd ebe ach\u1ecdr\u1ecd ya.\\n4.What
  b\u1ee5 nkezi \u1ee5z\u1ecd oge?\\nMaka ihe nlele, oge \u1ee5z\u1ecd b\u1ee5 ihe
  d\u1ecbka \u1ee5b\u1ecdch\u1ecb 7.Maka mmep\u1ee5ta oke, oge \u1ee5z\u1ecd b\u1ee5
  20-30 \u1ee5b\u1ecdch\u1ecb mgbe \u1ecb nwetas\u1ecbr\u1ecb nkw\u1ee5nye ego nkw\u1ee5nye
