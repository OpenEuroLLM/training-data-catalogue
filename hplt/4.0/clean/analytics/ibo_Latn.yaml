  iche nchekwa ngw\u00e1, emewo ihe kar\u1ecbr\u1ecb 200 iche iche nke \u1ecdkachamara
  nchekwa ngw\u00e1.\\nIhe ngosi nke mba ofesi\\nAsambodo\\nBeijing Heweiyongtai Sci
  & Tech Co., Ltd. b\u1ee5 onye na-ebute \u1ee5z\u1ecd nke EOD na Ngw\u1ecdta Nchekwa.Nd\u1ecb
  \u1ecdr\u1ee5 any\u1ecb niile b\u1ee5 nd\u1ecb \u1ecdr\u1ee5 nka na njikwa njikwa
  iji nye g\u1ecb \u1ecdr\u1ee5 af\u1ecd ojuju.\\nNgwaah\u1ecba niile nwere mkpesa
  ule \u1ecdkwa \u1ecdkachamara nke mba yana asambodo ikike, yab\u1ee5 nwee obi ike
  \u1ecbt\u1ee5 ngwaah\u1ecba any\u1ecb.\\nNjikwa mma siri ike iji h\u1ee5 na ogologo
  nd\u1ee5 \u1ecdr\u1ee5 ngwaah\u1ecba na onye \u1ecdr\u1ee5 na-ar\u1ee5 \u1ecdr\u1ee5
  n''enwegh\u1ecb nsogbu.\\nN''ihe kar\u1ecbr\u1ecb af\u1ecd 10 ah\u1ee5m\u1ecbhe
  \u1ee5l\u1ecd \u1ecdr\u1ee5 maka EOD, ak\u1ee5r\u1ee5ngwa mgbochi iyi \u1ecdha egwu,
  ngwa\u1ecdr\u1ee5 \u1ecdg\u1ee5g\u1ee5 isi, wdg.\\nAny\u1ecb ejirila \u1ecdr\u1ee5
  na-ejere nd\u1ecb ah\u1ecba mba 60 ozi n''\u1ee5wa niile.\\nEnwegh\u1ecb MOQ maka
  \u1ecdt\u1ee5t\u1ee5 ihe, nnyefe ngwa ngwa maka ihe ahaziri ahazi.\"", "\"\u2460
