  at\u1ee5\\nGS-PB06\\nGS-CB04\\nGS-PB02\\nGS-PB05\\nGS-CB02\\nGS-CB08\\nGS-CB16\\nNk\u1ecdwa\\nNd\u1ee5m\u1ecdd\u1ee5:
  A na-agba ya \u1ecdk\u1ee5 na oke okpom\u1ecdk\u1ee5, na agba agbak\u1ecdtala n''ime
  ihe nke nkume ah\u1ee5, nke na-agagh\u1ecb ada ada ma na-akawanye nj\u1ecd.\\nFAQ\\n1.Kedu
  \u1ecdn\u1ee5 ah\u1ecba g\u1ecb?\\n\u1eccn\u1ee5 ah\u1ecba any\u1ecb nwere ike \u1ecbgbanwe
