  \u1ee5gb\u1ecd mmiri, yana \u1ecbz\u1ee5 ah\u1ecba na iri nri. Ebe ebe a na-aga
  na-enye njem nleghar\u1ecb anya okpom\u1ecdk\u1ee5 d\u1ecb mfe, yana dollar Bahamian
  na dollar US. Mee ihe niile ma \u1ecd b\u1ee5 mee ihe \u1ecd b\u1ee5la, cheta, \u1ecc
  ka mma na Bahamas. Maka ama ndi ozo banyere ngwugwu njem, ihe omume na ulo, kpo
  1-800-Bahamas ma obu bia bahamas.com. Ch\u1ecd\u1ecd maka The Bahamas na weeb\u1ee5
  na Facebook, Twitter na YouTube.\"", "\"Multi-spectrum Handheld Night Vision Binocular\\nNk\u1ecdwa\\nHW50-2REjiri
