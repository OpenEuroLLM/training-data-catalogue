  des Burgondos, Lex Burgundionum\\nLa l\u00ea Gomb\u00e8ta ou ben l\u00ea des Burgondos
  (lex Burgundionum en latin) est un code de l\u00eas civiles et p\u00e8n\u00e2les
  procllam\u00e2 u comencement du VI\u00e9mo si\u00e8cllo per lo r\u00ea des Burgondos
  Gondob\u00e2d, pu\u00e9s apondu per sos succ\u00e8ssors Sigismond et Godomar III,
  que fixe los us\u00e2jos a r\u00e8sp\u00e8ctar per los suj\u00e8ts burgondos du
  Rey\u00f4mo. El at por compl\u00e8ment la \u00ab l\u00ea rom\u00e8na des Burgondos
  \u00bb (lex romana Burgundionum) que reg\u00e2rde los suj\u00e8ts \u00ab romens
  \u00bb du Rey\u00f4mo, cen v\u00f4t d\u00e9re les gens galo-rom\u00e8nes du payis.\\nDe
  b\u00f4na hora, la lex Burgundionum est \u00e9t\u00e2ye m\u00e9s ben apel\u00e2ye
  du nom de son procllamior lex Gundobada (\u00ab l\u00ea de Gondob\u00e2d \u00bb),
  pu\u00e9s lex Gumbata, cen qu\u2019at baly\u00ea en arpetan \u00ab l\u00ea Gomb\u00e8ta
  \u00bb.\\nO est lo premi\u00e9r recu\u00e9ly de l\u00eas d\u2019un r\u00ea g\u00e8rmanico
  en G\u00f4la (la r\u00e8g\u00b7ion de l\u2019Arpetania a vegnir avou\u00e9c) ; apr\u00e9s
  lui sont parus los codes que reg\u00e2rdont los Vesigots, pu\u00e9s celos que reg\u00e2rdont
  los Francos. Gins de code montre mielx la fusion de la partia rom\u00e8na avou\u00e9c
