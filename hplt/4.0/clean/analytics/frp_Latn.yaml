  \u00e0tt\u00e9ntion \u00e0 n\u00e9 p\u00e0s trop qu\u00e0nd m\u00e9 m\u00e9 \u00ab
  coll\u00e9r \u00bb sur l\u00e9 c\u00e0s russoukr\u00e0ini\u00e9n. \u00c9n \u00e9ff\u00e9t,
  si c\u00e9 conflit monopolis\u00e9 p\u00e9u ou prou l\u2019\u00e0tt\u00e9ntion d\u00e9s
  m\u00e9 di\u00e0s \u00e9t d\u00e9s r\u00e9vu\u00e9s \u00e9n \u00c9urop\u00e9, il
  \u00e9st loin d\u2019\u00e9 tr\u00e9 l\u00e9 s\u00e9ul qui soit conc\u00e9rn\u00e9
  p\u00e0r l\u00e0 probl\u00e9 m\u00e0tiqu\u00e9 \u00e9squiss\u00e9 \u00e9 d\u00e0ns
  l\u00e9s p\u00e0g\u00e9s qui suiv\u00e9nt. \u00c9n \u00e9ff\u00e9t, d\u2019\u00e0utr\u00e9s
  situ\u00e0tions p\u00e9uv\u00e9nt ou pourront \u00e0 l\u2019\u00e0v\u00e9nir \u00e9
  tr\u00e9 r\u00e0ttr\u00e0p\u00e9 \u00e9s p\u00e0r c\u00e9tt\u00e9 probl\u00e9 m\u00e0tiqu\u00e9.\"",
  "\"Fr\u00e8deric Franc\u00eas Chopin (n\u00e8ssu sot lo nom polon\u00eas : Fryderyk
  Franciszek Chopin, des c\u00f4ps \u00e8crit en polon\u00eas Szopen ; a lo xixe si\u00e8clo,
  la grafie Szop\u0119 at \u00e9t\u00e2 utilis\u00e2ye en Pologne en concurrence avou\u00e9c
  la grafie Chopin) est un composior et pianisto virtuoso d''origina franco-polon\u00easa,
  n\u00e8ssu en 1810 a \u017belazowa Wola, sur lo t\u00e8rritou\u00e8ro du duc\u00e2t
  de Varsovie (ora en Pologne), et m\u00f4rt en 1849 a Paris.\\nApr\u00e9s sa formacion
  a l''H\u00f4ta \u00c8coula de Musica de Varsovie et un d\u00e8but de carri\u00e9re
  en Pologne et a Vi\u00e8ne, il quite la Pologne et a l''\u00e2jo de 21 ans, il s''enstale
  en France (il est venu de vers son p\u00e2re d''una famelye lorr\u00e8na venent
  de Marainville-sur-Madon), y\u00f4 il d\u00e8velope son enspiracion dens l''agitacion
  du mondo du piano parisien et dens la sovegnance de sa patrie m\u00f4rtria. Il y
  rencontre George Sand, que serat sa compagne pendent n\u00f4f ans.\\nChopin en 1835
  (pintura r\u00e8alis\u00e2ye per sa galanta Maria Wodzi\u0144ska).\\nRecognessu
  come yon des m\u00e9s grants composiors de musica de la p\u00e8rioda romantica,
  Fr\u00e8d\u00e8ric Chopen est asse yon des m\u00e9s c\u00e8l\u00e8bros pianistos
  du xix\u00e9mo si\u00e8cllo. Sa musica est ad\u00e9s hou\u00e9 yona des m\u00e9s
  jouy\u00eaes et dem\u00f4re un pass\u00e2jo endispens\u00e2blo a la compr\u00e8ension
  du rep\u00e8rtou\u00e8r du piano univ\u00e8rs\u00e2l. Avou\u00e9c Franz Liszt, il
  est lo p\u00e2re de la t\u00e8cnica mod\u00e8rna de son enstrument et p\u00ease
  sur tota una legn\u00e2 de composiors t\u00e2ls que Gabriel Faur\u00e9, Claude Debussy,
  Maurice Ravel, Alexandre Scriabine, S\u00e8rgu\u00e8y Rachmaninov, ou Olivier Messiaen.\\nFr\u00e8d\u00e8ric
  Chopen est n\u00e8ssu lo 1\u00e9r de m\u00e2rs 1810 a \u017belazowa Wola en Pologne,
  a l''\u00e8poca sur lo t\u00e8rritou\u00e8ro du duc\u00e2t de Varsovie\\nEn 1725,
  lo r\u00ea de France Louis XV \u00e8pose Marie Leszczynska, felye de Stanislas Leszczynski,
  \u00e8x-r\u00ea de Pologne de 1704 a 1709, que vit pourament en Alzace d''una pension
  que lui ac\u00f4rde la France. A la sortia de la gu\u00e8rra de Succ\u00e8ssion
  de Pologne, Stanislas vencu rec\u00eat los duc\u00e2ts de Lorr\u00eana et de Tav\u00e8rna
  que lo s\u00f4veren l\u00e8gitimo \u00e8chanjo contre la Toscana devant que d''\u00e9tre
  \u00e8lu emperor. Stanislas muert en 1766 ; o est solament a ceti moment que Lorr\u00eana
  et Barrois vegnont franc\u00eas, un pou avant qu''y n\u00e8ssesse (1771) Nicolas
  Chopen, lo p\u00e2re de Fr\u00e8d\u00e8ric, que quite la France por la Pologne en
  1787, coment chargi\u00ea d''\u00e8ducacion dens una famelye n\u00f4bla.\\nEn 1795,
  lo roy\u00f4mo de Pologne dispar\u00eat apr\u00e9s un tr\u00easi\u00e9mo part\u00e2jo
  entre la Russie, la Prussa et l''\u00d4triche.\\nLes gu\u00e8rres de Napol\u00e9on
  p\u00e8rm\u00e8tont en 1807 la repr\u00easa d''un \u00c8tat polon\u00eas, lo duc\u00e2t
  de Varsovie, dens que n\u00eat Fr\u00e8d\u00e8ric en 1810. Mas la retr\u00e8ta de
  Russie entr\u00eane son ocupacion per los Russos en 1813 et sa disparicion en 1815,
  durent lo congr\u00e8s de Vi\u00e8ne : la Prussa controle l''Ou\u00e8st (grant-duc\u00e2t
  de Posen) ; la Russie l''\u00c8st (roy\u00f4mo du Congr\u00e8s), et lo centro, avou\u00e9c
  Varsovie ; l''\u00d4triche lo Sud (Tarnopol, Wieliczka) tandis que la r\u00e8publica
  de Cracovie est som\u00easa ux tr\u00eas pouessiences de la Santa-Aliance.\\nLo
  roy\u00f4mo du Congr\u00e8s, asse apel\u00e2 \u00ab roy\u00f4mo de Pologne \u00bb,
  at por s\u00f4veren l''emperor de Russie (la famelye Chopen est d\u00eas ora citoy\u00e8na
  de ceti roy\u00f4mo polon\u00eas sot contr\u00f4lo russo). Lo tsar Al\u00e8xandro
  Ii\u00e9r lui balye una constitucion relativament lib\u00e8r\u00e2la.\\nLo roy\u00f4mo
  at vu avou\u00e9c una c\u00e8rt\u00eana \u00f4tonomie tant qu''a l''av\u00e8nement
  (1825) du tsar Nicolas Ii\u00e9r, tegnent de l''absolutismo. En novembro 1830, d\u00e8bute
  una ensurr\u00e8ccion, qu''est f\u00f4rt \u00e8tof\u00e2ye et entr\u00eane a la
  fin de 1831 la misa u p\u00e2s de la Pologne russa (supr\u00e8ssion de la constitucion,
  etc.).\\nDe nombrox membros de la \u00ab arm\u00e2 polon\u00easa \u00bb s\u00e8
  refugiyont a l''\u00e8trangi\u00e9r ; plusiors mily\u00e9rs vant tant qu''en France,
  y\u00f4 ils b\u00e8n\u00e8ficiyont d''una granta *sympathie12 et de secors ofici\u00e8ls.
  O est dens cetes circonstances tragiques que Fr\u00e8d\u00e8ric Chopen arr\u00e8ve
  en France, sen \u00e9tre lui-m\u00e9mo un r\u00e8fugiy\u00ea de l''ensurr\u00e8ccion.\\nChopen
  at vu en France \u00e8ssenci\u00e8lament pendent la monarchie de Juillet (1830-1848),
  et pu\u00e9s u comencement de la Seconda R\u00e8publica (1848-1851).\\nEn Eropa,
  l''an 1848 est importanta, vu que des ensurr\u00e8ccions s\u00e8 tegnont dens de
  nombrox payis, en Alemagne, en Italie, en Hongrie, etc. Lo xixe si\u00e8clo est
  en \u00e8f\u00e8t marc\u00e2 dens tota l''Eropa per lo mouvement des nacionalit\u00e2ts,
  sp\u00e8cialament en Pologne ; durent cetes an\u00e2s, Chopen vint una figura importanta
  du mouvement nacion\u00e2l polon\u00eas.\\nFr\u00e8d\u00e8ric Chopen est lo fily
  de Nicolas Chopen (1771-1844), n\u00e8ssu a Marainville-sur-Madon (actu\u00e8l d\u00e8partement
  des V\u00f4ges) et de la Polon\u00easa Tekla Justyna Chopen, n\u00e8ssua Krzy\u017canowska
  (1782-1861). Venu en Pologne u s\u00e8rvicio de la comt\u00e8ssa Skarbek, Nicolas
  \u00e8pose Tekla Justyna, parenta et dama d''honor de la comt\u00e8ssa, en 1806.\\nEn
  tenent compto du f\u00eat qu''il at un p\u00e2re franc\u00eas et una m\u00e2re polon\u00easa,
  la demanda de la \u00ab nacionalit\u00e2t \u00bb (u sens d''apartenence de l''\u00e8tat)
  de Chopen at \u00e9t\u00e2 l''obj\u00e8t d''un d\u00e8bat des c\u00f4ps passion\u00e2
  por d\u00e8t\u00e8rmenar son statut ofici\u00e8l. Mas la nacionalit\u00e2t p\u00f4t
  asse \u00e9tre envesagi\u00eae de fa\u00e7on muens rigorosa, u sens d''identit\u00e2t
  nacion\u00e2la (en fasent abstraccion de l''apartenence de l''\u00e8tat).\\nChopen
  s\u00e8 consid\u00e8r\u00e2ve, et \u00e9re consid\u00e8r\u00e2 per sos contemporens,
  coment un Polon\u00eas. Sos compatriotos p\u00e2rlont de lui coment du composior
  nacion\u00e2l polon\u00eas et sos amis font m\u00e9mament : Balzac \u00e8crit de
  Liszt et de Chopen : \u00ab L''Hongrou\u00e8s est un d\u00e8mon, lo Polon\u00eas
  un ange \u00bb, Liszt p\u00e2rle du \u00ab artisto polon\u00eas \u00bb.\\nChopen
  at pass\u00e2 los vengt premi\u00e9res an\u00e2s de sa via en Pologne. A son \u00e8poca,
  ceti \u00e8l\u00e8ment est sufisent por lui assurar una identit\u00e2t polon\u00easa
  : lo f\u00eat d''av\u00ear quit\u00e2 la Pologne a l''\u00e2jo de 20 ans et ples
  jam\u00e9s y \u00e9tre reveri\u00ea modifie pas ceta don\u00e2 primordiala. Alfred
  Cortot ac\u00f4rde una granta importance u rolo \u00e8ducatif de sa m\u00e2re :
  \u00ab l''enfluence \u00e8gz\u00e8rci\u00eae per l''atmosf\u00e8ra sp\u00e8cificament
  femenina du foy\u00e9r de famelye, y\u00f4 tant que vers la tr\u00e8gi\u00e9ma an\u00e2,
  il vivrat, d''apr\u00e9s la formula sacr\u00e2ye, dens los cotins de sa m\u00e2re
  et de ses su\u00e8res \u00bb.\\nPas-muens, ceta identit\u00e2t est pas solament
  la cons\u00e8quence d''una jouen\u00e8ssa polon\u00easa et d''una convencion sociala.
  Nan solament \u00ab Chopen, en Pologne s''est construit polon\u00eas \u00bb, mas
  lo musicien revendique sovent son apartenence a ceti payis.\\nLo patriotismo dolorox
  de Chopen s\u00e8 traduit dens sa musica, coment Liszt l''av\u00eat ja remarc\u00e2
  : \u00ab et les plentes de la Pologne empront\u00e2vont a cetos accents je s\u00e9
  quinta po\u00e8sie mist\u00e8riosa, que por t\u00f4s celos que l''ant veret\u00e2blament
  sentua, sar\u00eat \u00e9tre compar\u00e2ye a ren\u2026 \u00bb. Se ceta dimension
  d''\u00e8gzil\u00e2 du musicien sarmate, coment l''ap\u00e8le Robert Schumann, sovent
  \u00e8voc\u00e2ye per los biografos du pass\u00e2, est repr\u00easa per los musicologos
  de noutron temps, el est tot-un ent\u00e8rpr\u00e8t\u00e2ye de fa\u00e7on dif\u00e8renta.
  Por Eigeldinger, el est ora compr\u00easa coment una dur\u00e2 tipicament slava,
  una sensibilit\u00e2t cultur\u00e8la. Por Liszt, Chopen \u00ab porrat \u00e9tre
  rengi\u00ea u nombro des premi\u00e9rs musiciens qu''\u00e8yont asse endividualis\u00e2
  en lor lo sens po\u00e8tico d''una nacion \u00bb.\\nL''identit\u00e2t polon\u00easa
  de Chopen est jam\u00e9s n\u00e9y\u00eae, et la relacion entre la France et Chopen
  est importanta. M\u00e9mament un nacionalisto coment Lucien Rebatet, que lui ac\u00f4rde
  la nacionalit\u00e2t franc\u00easa, \u00e8crit pu\u00e9s-cen : \u00ab Chopen lui-m\u00e9mo
  s\u00e8 ser\u00eat \u00e8lev\u00e2 contre ceta \\\"encorporacion\\\" (franc\u00easa)
  \u00bb.\\nUn premi\u00e9r \u00e8l\u00e8ment est l''origina franc\u00easa de son
  p\u00e2re, que, en v\u00e8rtu des disposicions du Code civilo, p\u00e8rm\u00e8t
  a Fr\u00e9d\u00e9ric de b\u00e8n\u00e8ficiy\u00e9r de la nacionalit\u00e2t franc\u00easa.
  La recognessence du statut de Fran\u00e7ais est at\u00e8st\u00e2ye per un p\u00e2ssap\u00f4rt
  \u00e8metu lo 1\u00e9r d''o\u00fbt 1835. Ceta solucion \u00e8vit\u00e2ve a Chopen
  de demandar un p\u00e2ssap\u00f4rt russo, payis \u00e8yent envayi la Pologne, et
  contorn\u00e2ve lo statut de r\u00e8fugiy\u00ea politico, qu''ar\u00eat d\u00e8fendu
  tot \u00e8spou\u00e8r de ret\u00f4rn en Pologne. Pas-muens, les veret\u00e2bles
  motivacions de Chopen r\u00e9stont encognues.\\nDe l''\u00f4tro l\u00e2t, Chopen
  s''enstale a Paris en 1831 et vat y passar pr\u00e9s de la m\u00eati\u00eat de sa
  via. La vela est, a ceta \u00e8poca, yona des capit\u00e2les cultur\u00e8les du
  mondo. Il y nue sos am\u00f4rs et sos amiti\u00eats les m\u00e9s importantes : Sand,
  Delacroix, Liszt ou Pleyel. Il y rencontre lo tot Paris artistico : Balzac, Berlioz,
  Thalberg, Kalkbrenner, \u00c9rard, Heine, et aristocratico. D''apr\u00e9s Antoine
  Gol\u00e9a, l''univ\u00e8rs artistico et cultur\u00e8l dens que lo composior at
  f\u00eat l''\u00e8ssenci\u00e8l de son \u00f4vra est la France mas l''atachement
  de Chopin a son payis nat\u00e2l et l''enfluence de l''univ\u00e8rs polon\u00eas
  r\u00e9st\u00e2vont franc f\u00f4rt pendent tota la p\u00e8rioda franc\u00easa.\\nSon
  enfluence est sp\u00e8cialament marc\u00e2ye en France. Por lo musicologo Eigeldinger
  la somission fid\u00e8la de Debussy rap\u00f4rt u M\u00eatre polon\u00eas est \u00e8videnta.
  Ceta enfluence, asse presenta chi\u00e9z Ravel ou Faur\u00e9, s\u00e8 limite pas
  a la musica : \u00ab Per-l\u00e9 lo musicien pr\u00e8v\u00eat lo principo \\\"de
  Verlaine\\\" : \u00ab Ren en ples chier que la chan\u00e7on grise / Y\u00f4 cen
  qu''est enc\u00e8rtin u pr\u00e8cis s\u00e8 rassemble \u00bb. Son empr\u00e8ssionismo
  musical s\u00e8 retrove en pintura : \u00ab por f\u00e2re un misa en lumi\u00e9re
  resonant prod analogo a c\u00e8rtins \u00e8f\u00e8ts de lumi\u00e9re, a c\u00f4p
  enniol\u00e2s et pr\u00e8cis, dens la pintura d''un Monet \u00bb.\\nSe la sensibilit\u00e2t
  de Chopen est polon\u00easa et s\u00e8 traduit per la repr\u00easa de m\u00e8lodies
  popul\u00e8res, sa lengoua musicala est \u00ab saventa \u00bb, el participe de la
  \u00ab granta musica \u00bb por reprendre una \u00e8xpr\u00e8ssion de Delacroix.
  \u00ab Chopen at su, lo premi\u00e9r, pr\u00e9tar una atencion ensorcel\u00e2ye
  ux chants et verol\u00e8ts popul\u00e8ros de sa Pologne nat\u00e2la, sen jam\u00e9s
  en citar compl\u00e8tament la muendra fr\u00e2sa dens sa produccion. A un compatrioto
  por qu''il emprovis\u00e2ve a Paris et que cr\u00e8y\u00eat entendre a nov\u00e9l
  una berceuse de son enfance, Chopin rabat : \u00ab Ceta chan\u00e7on, te pov\u00eas
  la cognetre\u2026 mas solament l''\u00e8sprit que l''anime : l''\u00e8sprit d''una
  m\u00e8lodie polon\u00easa ! \u00bb. Sa musica est venent d''una pr\u00e8paracion
  saventa de l''ac\u00f4rd et du contrepoint. El est avant tot aristocratico et est
  f\u00f4rt luen d''una f\u00f4rma popul\u00e8ra ou folclorica. En ceti sens, lo leng\u00e2jo
  musical de Chopin est m\u00e9s univ\u00e8rs\u00e2l que polon\u00eas. Pas-muens,
  a p\u00e2rt l''enfluence du folclore du t\u00e8rrou\u00e8r qu''il at su *universaliser
  coment baban \u00f4tro, lo joueno Chopin at ben l\u00e8f subi cela du prince Micha\u0142
  Kleofas Ogi\u0144ski (1765-1833), que les 26 polon\u00eases c\u00e8l\u00e8bres dens
  tota l''Eropa de l''\u00e8poca s\u00e8 disting\u00e2vont per l''\u00e8l\u00e8gance,
  lo rafinement et la malincognie qu\u00e2si digno de Mozart, tipiques du pr\u00e8-romantismo.
  A son t\u00f4rn, dens ses Polon\u00eases, Chopin at su \u00e8xprimar l''\u00e8ssence
  m\u00e9mament de la \u00ab polonit\u00e2t \u00bb tot en lui balyent un caract\u00e8ro
  univ\u00e8rs\u00e2l. Asse-m\u00e9s Cyprian Norwid (1821-1883), lo m\u00e9s grant
  po\u00e8to mod\u00e8rno polon\u00eas, los compar\u00e2ve a l''\u00e8pop\u00ea gr\u00e8ca.\\nLos
  p\u00e2res spiritu\u00e8ls de Chopin sont nombrox, mas lo musicologo Eigeldinger
  ne los tr\u00f4ve que dens lo patrimou\u00e8no univ\u00e8rs\u00e2l et gins d''est
  polon\u00eas : \u00ab Mozart \u00e9re son Di\u00f4, S\u00e9b. Bach, yon des m\u00eatres
  pr\u00e8f\u00e8r\u00e2s recomand\u00e2s a t\u00f4s sos \u00e8l\u00e8vos \u00bb.
  Ceta univ\u00e8rsalit\u00e2t des origines et de la musica de Chopin est pas recognessua
  solament per Eigeldinger. Ceta analise est asse cela du po\u00e8to Heine que, d\u00eas
  1837 rejuend\u00eat cela f\u00eate mantegnent per la France et la Pologne : \u00ab
  Il est adonc ni Polon\u00eas, ni Fran\u00e7ais, ni Alemand ; il tray\u00e9t una
  origina ben m\u00e9s h\u00f4ta, il d\u00e8scend du payis de Mozart, de Rapha\u00ebl,
  de Goethe : sa ver\u00e9 patrie est lo roy\u00f4mo enchant\u00e2 de la po\u00e8sie
  \u00bb\\nFr\u00e9d\u00e9ric Chopin ou l''\u00e2rma polon\u00easa, document\u00e8ra
  \u00ab A c\u00f4sa de la musica \u00bb de Fran\u00e7ois Reichenbach et Bernard Gavoty
  (P\u00e8licules du Prisme, France R\u00e8gions 3, 1980) (dur\u00e2ye 1 h 52 menutes).\\nChopin
  na Dworcu Centralnym [Chopin a la G\u00e2ra centr\u00e2la], document\u00e8ra de
  Krzysztof Zanussi r\u00e8alis\u00e2 en 1993 (dur\u00e2ye : 24 menutes).\\nChopin,
  document\u00e8ro de Marie-Dominique Blanc Hermeline et Philippe Orreindy r\u00e8alis\u00e2
  en 1998 (dur\u00e2ye : 26 menutes).\\nChopin, document\u00e8ro d''Armand Isnard
  (Cat produccion) r\u00e8alis\u00e2 en 1999 (dur\u00e2ye : 52 menutes).\\nQui at
  pouer de Fr\u00e9d\u00e9ric Chopin ?, document\u00e8ro r\u00e8alis\u00e2 en 1999
  (dur\u00e2ye : 51 menutes). R\u00e8alis\u00e2 per Katarzyna Wieczynska-Chambenoit
  et f\u00eat per Io produccion, Plan\u00e8ta, Focus producers avou\u00e9c la participacion
  du CNC et du minist\u00e8ro de la Cultura et de la Comunicacion (DMDTS).\\nChopin
  \u2013 The Women Behind The Music (Chopin - Les f\u00e8nes d\u00e8rri\u00e9r la
  musica), r\u00e8alis\u00e2 en 2010 per la BBC 4 (dur\u00e2ye : 90 menutes). Ceti
  document\u00e8ra TV \u00e8xpllore la via de Chopin, en particuli\u00e9r ses encontres
  avou\u00e9c des chanter\u00e8sses que l''ant ensorcel\u00e2 a c\u00f4sa de lor vou\u00e8x.
  Dens son comunic\u00e2 de pr\u00e8ssa, la BBC p\u00e2rle de Jenny Lind coment \u00ab
  la granta sopran\u00f4 su\u00e8dou\u00e8sa qu''at tant tochi\u00ea Chopin les d\u00e8rri\u00e9res
