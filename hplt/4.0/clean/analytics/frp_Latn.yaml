  que marr\u0153nar \u00e8ntre ly\u0153rs d\u00e8nts.\\n- Fr\u00e2sa : Totes les vari\u00e8t\u00e2t
  sont bien compr\u00e8hensibles entre lor et prenont lo nom de francoprov\u00e8n\u00e7\u00e2l.\\n-
  Fr\u00e2sa : Entre cetes f\u00f4rmes de prateca soci\u00e2la, la luta des cll\u00e2sses,
  desot ces diverses manif\u00e8stacion, \u00e8gz\u00e8rce en particuli\u00e9r una
  enfluence profonda sur lo d\u00e8velopament de la cognessense hum\u00e8na.\\n- Fr\u00e2sa
  : D''ic\u00e9 la seconda qu\u00e8stion. L''arpitan, come totes les lengoues minorit\u00e8res,
  est, u moment actu\u00e8l, un conjuent de dial\u00e8ctos bien dif\u00e8rents entre
  lors et, bien sovent, los m\u00e9mos arpitano-parlents ant m\u00e2ltemps a s\u00e8
  comprendre. \u00c8vident que l''adopcion de grafies dial\u00e8ct\u00e2les de tipo
  fon\u00e8tico \u00e8tr\u00eat feni atot la reproduccion des m\u00e9mos probl\u00e8mos
  de inter-compr\u00e8asion que y ant por la comunicacion or\u00e2la. En plles, quand
  s\u00e8 tr\u00e8te d''un t\u00e8xto \u00e8crit, que seye pas una simplla panc\u00e2rta
  de quatro paroles, la n\u00e8c\u00e8ssit\u00e2t de s\u00e8 r\u00e8p\u00e8tar a vou\u00e8x
  h\u00f4ta parola por parola por ch\u00e8rchi\u00e9r de la comprendre d\u00e8truit
  compl\u00e8tament lo pll\u00e8sir de la l\u00e8ctura; et una l\u00e8ctura sens pll\u00e8sir
  nion la f\u00e9t.\\n- Fr\u00e2sa : Sur lors g\u00f4fros profonds ''l y at de chemins
  \u00e8frey\u00e2bllos,\\nM\u00e0s, h\u00e8l\u00e2s! sur cetos n''y at pouent de
  nav\u00e9g\u00e2bllos.\\nF\u00f4drat-o prendre fin entre la t\u00e8rra et l''\u00ear?\\nD''y
  songi\u00e9r solament f\u00e2t fresenar la ch\u00e8rn.\\n- Fr\u00e2sa : Entre les
  \u00f4tres o lui fut sembllant que elle v\u00eat J\u00e8sus-Crist si tr\u00e8s glloriox
  que c\u00f4r ne porr\u00eat pensar, qui \u00e9ret vehtu de cela glloriosa roba qu''il
  pr\u00e9t lo tr\u00e8s nobllo c\u00f4rps de Noutra-Dona. En ses tr\u00e8s noblles
  m\u00e0ns et en ses pieds apar\u00e9ssant les gllorioses pllayes que il sofrit p\u0153r
  am\u00f4r de nos. De c\u00e9l glloriox p\u00e8rtu\u00e9s saly\u00e9t una si tr\u00e8s
  grand cllart\u00e2t que \u00e7o \u00e9ret un grand \u00e8bayiment ass\u00e9 come
  si tota la biot\u00e2 de la divinit\u00e2t saly\u00e9t per m\u00e8.\\n- Fr\u00e2sa
  : Nos entendens que entre les \u00f4tres chouses o ly\u00e9 fut demand\u00e2 quinta
  vou\u00e8x et quinta parola o ly\u00e9 \u00e9ret sembllent que ele aou\u00e9t. Et
  ele r\u00e8pond\u00e9t qu''il la av\u00eat come homo, \u00e7o ly\u00e9 \u00e9ret
  sembllent; m\u00e0s dif\u00e8rence y av\u00eat si grant que no ly\u00e9 \u00e9ret
  vi\u00eares que negun c\u00f4rps humen que viv\u00e9t en t\u00e8rra pou\u00e9t entendre
  en son c\u00f4r ne d\u00e9re de boche neguna sembllence ni neguna \u00e8stimacion
  de la grant biot\u00e2t et do\u00e7or de cela glloriosa vou\u00e8x et parola.\\n-
  Fr\u00e2sa : Entre celos doux cors qui s\u00e8 aj\u00b7out\u00e2ront als doux premi\u00e9rs
  cors, apar\u00e9ss\u00eat una p\u00e8rsona loqu\u00e2l teniant quatro \u00f4tros
  entre lors mans, les doux dev\u00e8rs la t\u00e9ta et les doux dev\u00e8rs los pieds.
  Et c\u00e9ls quatro lui \u00e9ret sembllent que fussont les plles n\u00f4blles cr\u00e8atures
  que fussont entre t\u00f4s los \u00f4tros. Et pos\u00e2ront c\u00e9l glloriox c\u00f4rps
  que teniant entre lors mans sus lo drap d''or que les premi\u00e9rs aviant aparely\u00ea.
  Quand ils pos\u00e2ront c\u00e9l glloriox c\u00f4rps, les quatro cors s\u00e8 vant
  agenoly\u00e9r et encllinar a grant r\u00e8v\u00e8rence devant lui.\\n- Fr\u00e2sa
  : Una \u00f4tra v\u00eas avent\u00e9t que ele s\u00e8 fut al\u00e2 g\u00e9sir apr\u00e9s
  complia et tantout, sens qu''o que ele non s\u00e8 fut pas endormia, ol ly\u00e9
  fut sembllent que son \u00e8sprit fut entre los sents du paradis delqu\u00e2l/delsqu\u00e2ls
  ly\u00e9 sembll\u00e2vet que VIUT si grant compagnie que on non y porr\u00eat metre
  compto.\\n- Fr\u00e2sa : Depu\u00e9s ele lo vit un temps ass\u00e9 come on porr\u00eat
  v\u00ear de luen una \u00e9magena pinta en parchemin. Totes v\u00eas la biot\u00e2t
  \u00e9ret si grant que elle non lo put d\u00e9re, m\u00e0s non put f\u00e9re entendre
  en \u00f4tra mani\u00e9re. Apr\u00e9s ele lo vit tot simpllament come les \u00f4tros.\\nEt
  pu\u00e9s avent\u00e9t alcuna-v\u00eas que ele v\u00eat si grant cllart\u00e2t entre
  les mans del chapelan come lo solo.\\n- Fr\u00e2sa : Et a la fin de c\u00e9ls doux
  ans o ne fut jorns d\u00eas f\u00e9ta sent Antou\u00e8no tant que la seconda semana
  de car\u00eama que ele entre la nuet et lo jorn que ele ne v\u00e8s\u00e9t et sut
  alcuna (chousa) dels s\u00e8cr\u00e8ts Noutron-S\u00e8gnor, losqu\u00e2ls s\u00e8cr\u00e8ts
  furont si grants et m\u00e8ravilyox que quand ele en cudi\u00e9vet r\u00e0contar
  alcuna partia secr\u00e8tament o non p\u00f4t \u00e9tre retenu c\u00e2r Di\u00f4
  non lo vol\u00e9t sofrir, c\u00e2r p\u00f4t-\u00e9tre que la p\u00e8rsona cui ele
  lo r\u00e8v\u00e8l\u00e2vet non \u00e9ret digna del ret\u00e9nir.\\n- Fr\u00e2sa
  : M\u00e0s pu\u00e9s apr\u00e9s eles l\u00e8ssi\u00e9ront c\u00e9l lu\u00e8, c\u00e2r
  \u00e9ret trop entre los s\u00e8cul\u00e2rs, et s''en retorn\u00e2ront en Permagni,
  m\u00e2ques cetes tr\u00eas cr\u00e8atures que \u00e9rant ja trapass\u00eaes et
  sevelies l''una de jo\u00fbta l''\u00f4tra al cemeti\u00e9ro de cela m\u00eason
  d''\u00camu\u00e9x.\\n- Fr\u00e2sa : En agissent sur les org\u00e2nos des sens des
  membros du groupo d''\u00e8tude, c\u00e9ls div\u00e8rs fenom\u00e8nos encontr\u00e2s
  a Yenan ant provoc\u00e2s de sensacions et f\u00eat surgir dens lors c\u00e8rv\u00e8les
  una s\u00e8ria de r\u00e8pr\u00e8sentacions, entre que s''est \u00e8tabli un liem
  d''aproximacion, un liem \u00e8xt\u00e8rno: [ek\u00f2] lo premi\u00e9r degr\u00e2
  de la cognessen\u00e7a. A ce degr\u00e2, les homos p\u00f4ssont pas oncor \u00e8labor\u00e0r
  des conc\u00e8pts que s\u00e8 plla\u00e7ont a des niv\u00e9ls plles profonds, nion
  qu''a teri\u00e9r des concllusions logeques.\\n- Fr\u00e2sa : Entre lo conc\u00e8pt
  et la sensacion, la dif\u00e8ren\u00e7a est pas justo quantitativa mas qualitativa.
  En alent plles luen dens ceta dir\u00e8ccion, avou\u00e9c l''\u00e9do du jugement,
  de la d\u00e8duccion, on p\u00f4t arrev\u00e0r a des concllusions loqiques. L''\u00e8xpr\u00e8ssion
  du SAN KOUO YEN YI: \\\"Un froncement de la t\u00e9ta et una id\u00e2 vint a l''\u00e8sprit\\\"
  ou c\u00e8la du leng\u00e2jo ordin\u00e8ro: \\\"L\u00e8ssi\u00e9des-m\u00e8 r\u00e8fll\u00e8chir\\\"
  signifiont que l''homo op\u00e8re ent\u00e8l\u00e8ctu\u00e8lament a l''\u00e9do
  de conc\u00e8pts por port\u00e0r des jugements et por f\u00e9re des d\u00e8duccions.
  Il est l\u00e9 lo second degr\u00e2 de la cognessen\u00e7a.\\n- Fr\u00e2sa : Mas
  d\u00eas la seconda p\u00e8rioda de sa prateca, p\u00e8rioda de la luta poleteca
  et \u00e8conomeca conscienta et organis\u00e2ye, por lo f\u00eat de son activit\u00e2t
  prateca, de son \u00e8xp\u00e8rien\u00e7a aquisa u cors d''una lunta prolongi\u00eaya,
  \u00e8xp\u00e8rien\u00e7a que fut g\u00b7\u00e8n\u00e8ralis\u00e2ye scientificament
  per Marx et engels et de y\u00f4 et n\u00e8ssua la t\u00e8oria marxista qu''el at
  s\u00e8rvi a l''\u00e8duc\u00e0r, ceta cll\u00e2ssa fut cap\u00e2blla de comprendre
  l''\u00e8ssen\u00e7a de la soci\u00e8t\u00e2t capitalista, los rap\u00f4rts d''\u00e8xplou\u00e8tacion
  entre les cll\u00e2sses soci\u00e2les, sos pr\u00f4pros devou\u00e8rs historecos
  et devint adonc una \\\"cll\u00e2ssa por s\u00e8\\\".\\n- Fr\u00e2sa : L''id\u00e8alismo
  et lo mat\u00e8rialismo m\u00e8canisto, l''oportunismo et l''aventurismo, s\u00e8
  caract\u00e8risont per la ruptura entre lo subj\u00e8ctif et l''obj\u00e8ctif, per
  la s\u00e8paracion de la cognessen\u00e7a d''avou\u00e9c la prateca.\\n- Fr\u00e2sa
  : Un nurrim de di\u00e9x vaches. ''L at un nurrim de vingt t\u00e9tes, entre vaches,
  mojons et v\u00e9ls.\"", "\"(patou\u00e9 d\u00e9 Tsaenso\u00f9)\\nVou\u00e9il\u00e0
  eun nouo approfondissem\u00e8n de eunna di s\u00e9ch\u00f3n de la padze d\u2019aqueuil
  : le Conte de patoisvda, eun caro pe cont\u00e9 i pebleuque l''identito\u00f9 valdot\u00e9na
  a trav\u00e8e l''eunstrum\u00e0n di storytelling, de conte pe \u00e9mochon-\u00ec
  le letteue \u00e9 que pr\u00e8dzon di dzi \u00e9 di patou\u00e9.\\nLe premiye eunformach\u00f3n
  arrevon di-z-esp\u00e8e di patou\u00e9, de salle dzi que l\u2019an cherd\u00ec lo
  francoprovansal comme mouy\u00e8n pe moutr\u00e9 leue mimo \u00e9 pe jou\u00ec \u00e9t\u00f3
  de satisfach\u00f3n i travaille comme deun lo ten libro.\\nDeun tsaque t\u00e9mouagnadzo,
  le protagoniste no dion perqu\u00e9 l\u2019an cherd\u00ec de f\u00e9ye si parco\u00f9,
  queun l''\u00e8 lo rappoo avou\u00ec lo patou\u00e9 (deun la via de tcheu le dzoo),
  queunse son le-z-esp\u00e9rianse f\u00e9te...\\nL\u2019euntench\u00f3n l\u2019\u00e8
  salla de f\u00e9ye cougnitre v\u00e9o no sen \u00e9 v\u00e9o diffiente son noutre
  esp\u00e9rianse, v\u00e9o reutso son noutro li\u00e8n avou\u00ec lo patou\u00e9
  \u00e9 l''eunt\u00e9r\u00e9 pe seutta lenva eunc\u00f3 bi\u00e8n vivanta.\\nBon-a
  letteua !\"", "\"[374] Penn\u012bnische Alpen, gletscherreicher Teil des innern
  Gneisalpenzugs der Westalpen, zwischen dem Gro\u00dfen Sankt Bernhard, der Dora
  Baltea, Toce, dem Simplon und dem Rh\u00f4netal, zerf\u00e4llt in die Arollagruppe
  im W. (Wei\u00dfhorn 4512 m, Matterhorn 4505 m, Dent Blanche 4364 m) und die Monte-Rosa-Gruppe
  im O. (Dufourspitze 4638 m); nach N. zweigen sich ab die Mischabelh\u00f6rner (4554
  m) und das Wei\u00dfmieshorn (4031 m).\\nBrockhaus-1809: Die obern Alpen \u00b7
  Die Alpen \u00b7 Die Alpen \u00b7 Die niedern Alpen\\nBrockhaus-1911: Penninische
  Kette \u00b7 Provence-Alpen \u00b7 Raibler Alpen \u00b7 Sappada-Alpen \u00b7 Rh\u00e4tische
  Alpen \u00b7 M\u00fcnstertaler Alpen \u00b7 Mollner Alpen \u00b7 Nonsberger Alpen
  \u00b7 \u00d6sterreichische Alpen \u00b7 Norische Alpen \u00b7 Savoyer Alpen \u00b7
  Trientiner Alpen \u00b7 Transsylvanische Alpen \u00b7 Venezianer Alpen \u00b7 Waidringer
  Alpen \u00b7 Vicentinische Alpen \u00b7 Steiner Alpen \u00b7 Schladminger Alpen
  \u00b7 Steirische Alpen \u00b7 Tessiner Alpen \u00b7 Sulzbacher Alpen \u00b7 Luzerner
  Alpen \u00b7 Dinarische Alpen \u00b7 Brescianer Alpen \u00b7 Eisenerzer Alpen \u00b7
  Grajische Alpen \u00b7 Glarner Alpen \u00b7 Alpen \u00b7 Adula-Alpen \u00b7 Alpen
  [2] \u00b7 Brenta-Alpen \u00b7 Berner Alpen \u00b7 Hollensteiner Alpen \u00b7 Ligurische
  Alpen \u00b7 Lessinische Alpen \u00b7 Livigno-Alpen \u00b7 Luganer Alpen \u00b7
  Lombardische Alpen \u00b7 Karnische Alpen \u00b7 Julische Alpen \u00b7 Kottische
  Alpen \u00b7 Lechtaler Alpen \u00b7 Lavanttaler Alpen\"", "\"G\u00e8nocido arm\u00e8nien\\nLo
  g\u00e8nocido arm\u00e8nien, ou m\u00e9s pr\u00e8cisament lo g\u00e8nocido des Arm\u00e8niens,
  est un g\u00e8nocido f\u00eat d''avril 1915 a july\u00e8t 1916, u cors de loquint
  los doux ti\u00e8rs des Arm\u00e8niens que vivant alor sur lo t\u00e8rritou\u00e8ro
  actu\u00e8l de la Turquie ant p\u00e8ri a c\u00f4sa de d\u00e8portacions, famenes
  et massacros de granta amplor. Il at \u00e9t\u00e2 planifey\u00ea et \u00e8gz\u00e8cut\u00e2
  per lo parti u pov\u00ear a l''\u00e8poca, lo Comit\u00e2t Union et Progr\u00e8s
  (CUP), m\u00e9s cognessu sot lo nom de \u00ab Jouenos-Turcos \u00bb, compos\u00e2
  en particuli\u00e9r du trionvirat d''ofici\u00e9rs Talaat Pach\u00e2, Enver Pach\u00e2
  et Djemal Pach\u00e2, que dirigi\u00eave l''Empiro otoman adonc engagi\u00ea dens
  la Premi\u00e9re Gu\u00e8rra mondi\u00e2la ux fllancs des Empiros centr\u00e2ls.
  Il at c\u00f4t\u00e2 la via a enveron un milyon doux cent mile Arm\u00e8niens d''Anatolie
  et d''Arm\u00e8nia occident\u00e2la.\\nLa ciba du g\u00e8nocido \u00e9re lo n\u00e8tey\u00e2jo
  \u00e8tnico de l''\u00e8tat turco, en \u00e8liminant surtot les populacions cr\u00e8tienes;
  \u00e8f\u00e8ctivament d''\u00f4tros cr\u00e8tiens, siriacos en particuli\u00e9r,
  ant cognessu lo m\u00e9mo s\u00f4rt.\\nL''actu\u00e8la r\u00e8publica turca refuse
  d''acc\u00e8ptar l''\u00e8gzistence de ceti g\u00e8nocido, qu''est portant recognessu
  hou\u00e9 per una trent\u00eana d''\u00e8tats, avou\u00e9c la France et los \u00c8tats-Unis,
  payis y\u00f4 los d\u00e8scendents de r\u00e8fugiy\u00eas arm\u00e8niens sont sp\u00e8cialament
  nombrox.\"", "\"(patou\u00e8 de Vagrezentse)\\nLa plan\u00e9ta que donte si signe
  l''\u00e9 lo Sol\u00e8i, l''\u00e9l\u00e9m\u00e8n l''\u00e9 lo fou\u00e0.\\nLo Sol\u00e8i
  passe deun si signe euntre lo 23 de juillet \u00e9 lo 22 d''out.\\nCouleur : lo
  dzano or.\\nP\u00e9ra de la chanse : l''or.\\nM\u00e9tal : lo diam\u00e0n.\\nDzor
  de la chanse : la demendze.\\nCarat\u00e9ro\\nLo Li\u00f3n l''\u00e9 lo signe dou
  pouvou\u00e8e. L''a de volont\u00e9i \u00e9 de d\u00e9terminach\u00f3n, condzebl\u00e9e
  a bram\u00e8n de grase. Si signe l''a eun ego bi\u00e8n prononch\u00e0 que lo porte
  a iss\u00e9i lo pi eungamba deun queunta situach\u00f3n se voille. Le n\u00e8is\u00f9
  d\u00e9z\u00f3 si signe baillon eun sans de confianse \u00e9 pouon se demoous\u00e9i
  de bon tsachoou deun l''amour. Senton l''\u00e9zijanse de comand\u00e9i m\u00e9i
  l''amon pa gagn\u00e9i le partie tro seumple perqu\u00e9 l\u00e8i troouvon pa de
  gou. San queun l''\u00e9 leur valeur \u00e9 l''amon iss\u00e9i appr\u00e9si\u00e0
  : so le ren gnaque fase i complim\u00e8n. Son eunt\u00e9r\u00e9ch\u00e0 a tan de
  bague deferente, l''an eun bon espr\u00ec d''organizach\u00f3n m\u00e9i l\u00e8ichon
  i-z-atre le travaille mou\u00e8n eumport\u00e0n.\\nVu que lo Li\u00f3n governe lo
  queur, le n\u00e8is\u00f9 d\u00e9z\u00f3 si signe can vi\u00e9illisson son sedzet
  a de probl\u00e9me de queur. Pouon s''oubli\u00e9i que avou\u00ec lo ten lo cor
  ten a s''aff\u00e8ibl\u00ec \u00e9 so f\u00e9i poy\u00e9i la pr\u00e9ch\u00f3n dou
  san. Lo Li\u00f3n l''\u00e9 orgueilleu, courajeu \u00e9 gneucco. L''\u00e9 eun chef
  pe nateura m\u00e9i pa todzor deun la r\u00e9alit\u00e9i.\\nL''a todzor deun llu
  la prezonch\u00f3n, la fata de baill\u00e9i de-z-odre i-z-atre, que eun bi\u00f3
  mou\u00e9i de coou, se l''\u00e9 pa bi\u00e8n j\u00e8r\u00e9e, f\u00e9i fran rie
  le polet.\\nL''\u00e9 an personna ambechoouza, otorit\u00e9ra, pl\u00e9ye de via,
  fi\u00e9ra comme eun pet, fid\u00e9le \u00e9 de bon queur. Son de tsoouze llatt\u00e9e
  a la via de tcheu le dzor \u00e9 son totte carat\u00e9riz\u00e9e de la m\u00e9ima
  baga : la volont\u00e9i. Se lo Li\u00f3n la eumpl\u00e8ye mal, seutta volont\u00e9i
  pou port\u00e9i a bond\u00e0n de pach\u00f3n, d''orgueuille, a iss\u00e9i acrap\u00ec,
  a vol\u00e8i gagn\u00e9i a tcheu pri, a prendre le bague bond\u00e0n su lo s\u00e8rieu,
  fenque a resit\u00e9i deun la via. Sen que \u00e9ba\u00ec l''\u00e9 l''estraordin\u00e9ra
  confianse eun s\u00e9 m\u00e9imo que lo Li\u00f3n l''ar\u00e9 todzor.\\nL''a gneura
  consid\u00e9rach\u00f3n de l''euntench\u00f3n di-z-atre : l''\u00e9 ad\u00f3n que
  l''otorit\u00e9i se modifie deun la s\u00e8i de pouvou\u00e8e, que lo porte a vol\u00e8i
  s''eumpoouz\u00e9i eun tot \u00e9 pertot. Iss\u00e9i de bon queur l''\u00e9 eunna
  de se pi consid\u00e9rable calet\u00e9i.\\nSon espr\u00ec combatt\u00e8n se moouse
  deun dave fas\u00f3n : d''eunna magn\u00e9ye pi um\u00e9na (tandanse a combattre
  sa nateura) \u00e9 d''eunna magn\u00e9ye surum\u00e9na (la vitou\u00e9re su le prooue,
  l''espanch\u00f3n de l''ego pe lo bien\u00e9tre de tcheut). Lo Li\u00f3n l''\u00e9
  \u00e9t\u00f3 lo signe de l''\u00e9ducach\u00f3n, di m\u00e8in\u00e0, de la glou\u00e9re
  \u00e9 de l''ar.\""]'
