sample: '["\"La Parola : Fran\u00e7ou\u00e8s\\n24971\\ndefinicion : 4 de octobro\\n-
  Franc\u00eas : Fran\u00e7ois\\n- Italien : Francesco\\n- Gramatica : nom propro\\n-
  Varianta : Fran\u00e7ou\u00e8s (VdA)\\n- Varianta : Fran\u00e7ou\u00e8s (Dfn)\\n-
  Fr\u00e2sa : Entre Sent Mechi\u00e9l et Sent Fran\u00e7ou\u00e8s,\\nPrend ta venenge
  coment l''est;\\nA Sent Denis,\\nPrend-la se te porr\u00e9s.\\n- Fr\u00e2sa : Per
  la rua Sent-Fran\u00e7ou\u00e8s, per la nov\u00e8la encenta,\\nL''on v\u00eat atant
  de m\u00e2l que vers la M\u00eason Pinta;\\nUn val\u00e8t d''\u00e8curie, dens l''\u00e9goua
  jusqu''u c\u00f4l,\\nA m\u00e9s de vengt mul\u00e8ts vat copar lo lic\u00f4l.\\n-
  Sinonimo : Fanfou\u00e8s\\n- Gloss\u00e8ro : Antroponimos.\"", "\"magr\u00ec\\nmalgrado
  nel Dizionario del patois francoprovenzale del comune di Introd\\nprep semmagr\u00ec\\nTesti\\nLa
  querta di mel\u00e8\\n... Lo pouo ommo \u00e9 sa fenna, magr\u00ec leur-z-\u00e9for,
  lo deur traille \u00e9 le sacreficho de tcheu le dzor, l''ar\u00e9oon pom\u00ec
  a mantchan-\u00ec leur satte m\u00e8ino\u00f9 \u00e9 lo granp\u00e9e, ...\\nLeggi
  tuttoLe fou\u00e0 de sen Djou\u00e0n ou de sen Pierre\\n... Eunsouite le fou\u00e0
  son gnan-\u00ec eun mouay\u00e8n de comunicach\u00f2n ; baste pens\u00e9 a la \u00ab
  l\u00e9gende du survivant \u00bb : i ten de la pesta, ver l\u2019an 1630, le fameuille
  que reustoon eun montagne artoon de fou\u00e0 pe f\u00e9e sa\u00ec i-z-otre que,
  magr\u00ec totte, l\u2019ion eunc\u00f3 eun viya. ...\\nLeggi tuttoL\u2019ourse
  \u00e9 lo pitcho\u00f9 berdj\u00e9\\n... \u00c9toun-\u00f3, se driche des\u00f9
  le patte de d\u00e9r\u00ec \u00e9 reuste a botse iverta : Que de boboroille\u2026
  Que de foforoille Magr\u00ec me h\u00e8nt an, n\u2019i jam\u00ec vu-n\u00e8n tan
  pai! Can la leunna se catse, lo berdj\u00e9, que l\u2019ay\u00e8 tott\u2019\u00e9cout\u00f3
  amoddo, chour foura \u00e9 to ...\\nLeggi tutto\"", "\"Kyiv\\nKi\u00e8v\\nKyiv [kjif]
  ou ben Ki\u00e8v [kj\u025bf][N 1],[1] (K\u0438\u00efB, Kyjiv [\u02c8k\u026a.jiu\u032f]
  en ucr\u00e8nien) est la capit\u00e2la et la vela la m\u00e9s popl\u00e2ye d\u2019Ucr\u00e8na
  (2 962 180 habitents en 2021). S\u00e8 tr\u00f4ve u centro-nord du payis a riva
  du fllevo Dni\u00e8pre, qu\u2019est \u2019n aflluent de la mar N\u00eare.\\nKyiv
  est un important centro endustri\u00e2l, scientifico, univ\u00e8rsit\u00e8ro et
  cultur\u00e2l de l\u2019Eropa du Levant. El est la si\u00e8ta de tot plen d\u2019entrepr\u00eases
  de t\u00e8cnologia de pouenta, d\u2019univ\u00e8rsit\u00e2ts et de monuments historicos
  enscrits sus la lista du patrimou\u00e8no mondi\u00e2l coment la cat\u00e8dr\u00e2la
  Senta-Sofia et la l\u00f4ra de les B\u00e2rmes de Kyiv. La vela at un sist\u00e8mo
  de transp\u00f4rt publico avanci\u00ea que comprend notament na baragne de m\u00e8tr\u00f4
  et de trens de banleya.\\nKyiv est yona de les veles les m\u00e9s vielyes de l\u2019Eropa
  du Levant. El est pass\u00e2ye pendent son histou\u00e8re a dif\u00e8rentes repr\u00eases
  de la prosp\u00e8rit\u00e2t a l\u2019ombra. Son origina est prob\u00e2blament \u2019n
  endr\u00eat com\u00e8rci\u00e2l sl\u00e2vo fond\u00e2 per vers lo V\u00e9mo si\u00e8cllo
  sus la rota com\u00e8rci\u00e2la que rapond la Scandinavia a Constantinoplo. Lo
  b\u00f4rg est tribut\u00e8ro du rey\u00f4mo des Caz\u00e2rs tant qu\u2019a sa pr\u00easa
  per los Var\u00e8gos (vikings) u m\u00e9ten du IX\u00e9mo si\u00e8cllo. Kyiv vint
  la capit\u00e2la de la princip\u00f4t\u00e2t de Kyiv, premi\u00e9r comen\u00e7on
  de la Russia de noutron temps. La vela est tot d\u00e8molia en 1240 per les env\u00e2sions
  mongoles et p\u00e8rd tota grant-mange pendent des si\u00e8cllos. Cen f\u00e2t que
  vint na capit\u00e2la provinci\u00e2la muens importanta, bet\u00e2ye desot lo contr\u00f4lo
  de sos pouessients vesins : c\u00f4p sus c\u00f4p la Lituania, la Pologne et enfin
  la Russia.\\nF\u00eata rentrar dedens l\u2019Empiro russo, Kyiv cogn\u00eat un nov\u00e9l
  temps de prosp\u00e8rit\u00e2t avou\u00e9c la Reb\u00ean\u00e2da endustri\u00e2la,
  qu\u2019emmode dens l\u2019Empiro entre-mi\u00e9 la fin du XIX\u00e9mo si\u00e8cllo
  et 1918, quand vint la capit\u00e2la de la R\u00e8publica popul\u00e8ra ucr\u00e8ni\u00e8na.
  C\u00e9l t\u00e8rritou\u00e8ro d\u00e8cll\u00e2re son end\u00e8pendence, mas qu\u2019est
  suprim\u00e2 en 1921 avou\u00e9c son an\u00e8ccion a l\u2019Union sovi\u00e8tica.
  Kyiv vint la capit\u00e2la de la R\u00e8publica socialista sovi\u00e8tica d\u2019Ucr\u00e8na
  en 1934. Pendent la Seconda Gu\u00e8rra mondi\u00e2la la vela est qu\u00e2si compl\u00e8tament
  d\u00e8molia, mas el est vito reb\u00e2tia a la fin du d\u00e8sac\u00f4rd et vint
  la tr\u00easi\u00e9ma vela la m\u00e9s popl\u00e2ye de l\u2019Union sovi\u00e8tica.\\nApr\u00e9s
  l\u2019\u00e8fondrament de l\u2019Union sovi\u00e8tica et la d\u00e8cllaracion d\u2019end\u00e8pendence
  de l\u2019Ucr\u00e8na en 1991, Kyiv vint la capit\u00e2la du nov\u00e9l \u00e8tat.
  Sa populacion cr\u00eat rapido gr\u00e2ce a la borr\u00e2 d\u2019ucr\u00e8niens
  enstal\u00e2s tant qu\u2019ique dedens les dif\u00e8rentes r\u00e8publiques de l\u2019Union
  sovi\u00e8tica. Desot lo nov\u00e9l r\u00e8g\u00b7imo, cr\u00eat et r\u00e9ste la
  vela la m\u00e9s reche et pu\u00e9s la m\u00e9s popl\u00e2ye du payis. L\u2019endustria
  de l\u2019armament, que constitu\u00e2ve un s\u00e8ctor important de l\u2019\u00e8conomia
  loc\u00e2la, est remplaci\u00eae per los s\u00e8rvi\u00e7os et la finance.\\nG\u00b7eografia[changi\u00e9r
  | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nLa surface de la vela est de 847,67
  km\u00b2 (na mi\u00e9ta m\u00e9s que l\u2019ensemblo form\u00e2 per Paris - 105
  km\u00b2 - et sa peti\u00f4ta corona - 657 km\u00b2 - que rassemblont 6,8 milyons
  habitents) por 2,94 milyons habitents en 2018. Un ti\u00e8rs de la populacion tot\u00e2la
  de Kyiv r\u00e9ste la riva g\u00f4che.\\nMonuments et patrimou\u00e8no[changi\u00e9r
  | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nLa cat\u00e8dr\u00e2la Senta-Sofia et
  lo monast\u00e8ro de la l\u00f4ra de les B\u00e2rmes (fond\u00e2 en 1051) sont enscrits
  sus la lista du patrimou\u00e8no mondi\u00e2l de l\u2019UN\u00c8SC\u00d4 d\u00eas
  1990.\\nHistou\u00e8re[changi\u00e9r | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nLa
  vela est \u00e9t\u00e2ye fond\u00e2ye pendent lo VI\u00e9mo si\u00e8cllo. D\u00eas
  988, la populacion de la r\u00e8g\u00b7ion de Kyiv at adopt\u00e2 la religion ortodoxa.
  Lo centro de l\u2019\u00c9gll\u00e9se ortodoxa d\u2019Ucr\u00e8na, qu\u2019\u00c8pifanio
  est lo m\u00e8tropolito de Kyiv et de tota l\u2019Ucr\u00e8na, s\u00e8 tr\u00f4ve
  dedens lo monast\u00e8ro Sant-Mechi\u00e9l-u-D\u00f4mo-d\u2019Or a Kyiv[2].\\nD\u00eas
  1848 tant qu\u2019en 1853, lo pont a ch\u00eanes Nicol\u00e2s est construit. Il
  \u00e9re lo premi\u00e9r pont sus lo Dni\u00e8pre.\\nLo , u jorn d\u2019apr\u00e9s
  lo comencement de l\u2019env\u00e2sion de l\u2019Ucr\u00e8na per la Russia, les
  f\u00f4rces russes rentront dedens la capit\u00e2la, des c\u00f4ps de fu\u00e8 sont
  aouis[3] : la batalye de Kyiv comence.\\nLims de def\u00f4r[changi\u00e9r | changi\u00e9r
  lo t\u00e8xto s\u00f4rsa]\\nNotes et r\u00e8ferences[changi\u00e9r | changi\u00e9r
  lo t\u00e8xto s\u00f4rsa]\\nNotes[changi\u00e9r | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nNoms
  d\u2019endr\u00eat[changi\u00e9r | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nVocabul\u00e8ro[changi\u00e9r
  | changi\u00e9r lo t\u00e8xto s\u00f4rsa]\\nR\u00e8ferences[changi\u00e9r | changi\u00e9r
  lo t\u00e8xto s\u00f4rsa]\\n- (fr) Rogi\u00e9r Vir\u00e8t, \u00ab Dikchon\u00e9ro
  Frans\u00e9 - Savoy\u00e2 - Dictionnaire Fran\u00e7ais - Savoyard \u00bb [PDF],
  8\u00e9ma \u00e8dicion reviua et \u00f4gment\u00e2ye, m\u00e2rs 2021, p. 1889.\\n-
  (en) Nikolas Denisenko, \u00ab The Orthodox Church in Ukraine: A Century of Separation
  \u00bb, Northern Illinois University Press, 2018.\\n- (fr) Sami Sedhi, \u00ab Des
  coups de feu ont \u00e9t\u00e9 entendus \u00e0 proximit\u00e9 du complexe de b\u00e2timents
  gouvernementaux dans la capitale ukrainienne Kiev \u00bb, dessus https://www.aa.com.tr/fr,
  (viu lo 25 de fevri\u00e9r 2022).\"", "\"Enric Garriga Trullols\\nEnric Garriga
  Trullols (Barcelona, 1926 - Barcelona, 2011) fut un activisto politico Catalan qu''il
  at consacr\u00e2 sa via a travaly\u00e9r por l''end\u00e8pendence de la Catalogne
  et u recognessement de la nacion occitana.\\nBiografia[changi\u00e9r | changi\u00e9r
  lo t\u00e8xto s\u00f4rsa]\\nEnric Garriga, eng\u00e8nior ch\u00b7imico de prof\u00e8ssion,
  at consacr\u00e2 la siena via a travaly\u00e9r por la endip\u00e8ndence de la Catalogne,
  et lo at f\u00eat dens dif\u00e8rentes mani\u00e9res. D\u00eas sa colaboracion continu\u00e2ye
  avou\u00e9c los dirigents de tu\u00e9s los partis nacionalistos et s\u00f4verenistos
  tant qu''a la participacion activa dens des forons et des plates-f\u00f4rmes civiques(2)(3)
  tojorn avou\u00e9c obj\u00e8ctif de concily\u00e9r des volont\u00e2ts, unir des
  \u00e8f\u00f4rts et obtenir l''unit\u00e2t d''accion de l''end\u00e8pendentismo.\\nPr\u00f4cho
  a la siena activit\u00e2t politica, et dens la med\u00e9ma dir\u00e8ccion des obj\u00e8ctifs,
  Enric Garriga Trullols at particip\u00e2 u Congr\u00e8s de Cultura Catalana (1975-1977),
  de suite de loquint at fond\u00e2 ensemblo a bien de p\u00e8rsones l''IPECC, d\u00eas
  y\u00f4 at d\u00e8velop\u00e2 una importanta t\u00e2che de promocion ent\u00e8rnacion\u00e2la
  de la cultura catalana, bien devant de l''Enstitut Ramon Llull, a trav\u00e8rs la
  cr\u00e8acion et l''empulcion des prix Josep Maria Batista i Roca organis\u00e2s
  tant qu''ora et la construccion de monuments a p\u00e8rsonalit\u00e2ts catalanes
  (en Alemagne, Argentina, B\u00e8lge,...), et a la fin la promocion de voy\u00e2jos
  por cognetre l''\u00e8xpansion et les traces catalanes dens la zona m\u00e8dit\u00e8rran\u00eaye,
  lo Centro-Uropa et l\u2019Am\u00e8rica, et la d\u00e8cuv\u00e8rta des gestes historiques
  catalanes.\\nU 1977 participat activament a la fondacion du CAOC, una entit\u00e2t
  consacr\u00e2ye a l''encoragement des r\u00e8lacions entre-mi\u00e9 les cultures
  et los poplos occitan et catalan. Dedens les d\u00e8rri\u00e9res tr\u00eas d\u00e8c\u00e2des,
  adonc, at port\u00e2 a t\u00e8rmo una constanta t\u00e2che de jum\u00e8l\u00e2jo
  entre Catalogne et Occitania, por loquint est \u00e9t\u00e2 recognu largement en
  Occitania. Entre bien d''\u00f4tres iniciatives, et avou\u00e9c d\u00e8dicion constanta,
  at cr\u00e8\u00e2 et encoragi\u00ea les XXXIII \u00e8diccions du Rencontro des fu\u00e8s
  de Sent-Jian a Monts\u00e8gur, c\u00e8l\u00e8br\u00e2yes tant qu''ora, les XXIV
  \u00e8diccions de la Poy\u00ea u P\u00f4rt de Sal\u00f4 por la lengoua et l''amiti\u00eat
  occitano-catalana; ou les XIV \u00e8diccions de la Dict\u00e2 Occitana a Barcelona.
  At particip\u00e2 activament dens los d\u00e8rri\u00e9rs trenta sept ans a l''Ecoula
  Occitana de Ch\u00f4d-temps, a Velan\u00f4va d''\u00d4lt. Dament los d\u00e8rri\u00e9rs
  cinqu ans at encoragi\u00ea la M\u00e8ssa Occitana ux Pr\u00e2ts du R\u00ea; at
