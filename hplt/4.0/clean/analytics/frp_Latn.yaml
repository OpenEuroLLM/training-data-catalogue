  "\"(patou\u00e8 de Gress\u00e0n)\\nEunna di baye pi complequ\u00e9ye \u00e9 i mimo
  t\u00e9n pi eunt\u00e9ressante di tsans\u00f3n popul\u00e9re, eun j\u00e9n\u00e9ral,
  \u00e9 di berseuze, eun partiqueill\u00ec, l''\u00e9 llato\u00f9 i f\u00e9 que le
  tsans\u00f3n son rest\u00e9ye vivante, deun eun gran nombro de ca, mers\u00ec a
  la tradech\u00f3n orala. L''a, pe seutta r\u00e8iz\u00f3n, de carat\u00e9o partiqueill\u00ec
  di queulteue a trasmech\u00f3n orala, comme la predispozech\u00f3n a eumpl\u00e9y\u00ec
  lo \\\"botse-i-bouigno\\\".\\nLa berseuza l''\u00e8 comme la queulteua de iaou veun,
  \u00e9 f\u00e9 v\u00e9re de baye grop\u00e9ye a la mitoloj\u00ec, l''istou\u00e9re,
  le l\u00e9jande mi eunc\u00f2 an canquito\u00f9 de probl\u00e8me psicolojique, di
  personne \u00e9 de la sosi\u00e9to\u00f9.\\nEumpl\u00e9y\u00e9ye pe fiye eundrim\u00ec
  le p\u00e9gno pop\u00f3n, la berseuza l''a le r\u00e8ise deun lo conteste sosial
  de la quemeun-eto\u00f9 de campagne \u00e9 de la fameuille patriarcala, iaou l''\u00e9
  caze totta djestiya di femalle de tcheu le-z-\u00e9yadzo : le berseuze son pa tsant\u00e9ye
  renque di mamme, mi eunc\u00f2 de totte le fenne de la fameuille, le gran-m\u00e9e,
  le seaou pi viille, le tante que pouon le ramplach\u00ec deun si devou\u00ea.\"",
