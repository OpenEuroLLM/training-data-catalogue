  David: \\\"Ego dixi, dii estis\\\". C\u00e2r o serat sembllent a ch\u00e2cun que
  il s\u00eatt un petit di\u0153, c\u00e2r ils seront ses filys et ses h\u00ears.\\n-
  Fr\u00e2sa : Se apr\u00e9s \u00e9tre consacr\u00e2-s\u00e8 un c\u00e8rtin temps
  a c\u00e9t trav\u00e2ly, ils aqu\u00e8ront de l''\u00e8xp\u00e8rien\u00e7a et, s''ils
  v\u00f4lont bien, sensa partit pr\u00eas, \u00e8gzamen\u00e0r a fond l''\u00e8tat
  de la situacion, a la pllace de consid\u00e8r\u00e0r les chouses d''una fa\u00e7on
  subj\u00e8ctiva, unilat\u00e8r\u00e2la et sup\u00e8rfici\u00e8la, ils seront cap\u00e2bllos
  de teri\u00e9r lors-m\u00e9mos les concllusions que s\u00e8 raportont a la mani\u00e9ra
  que convint emplley\u00e9r, et ils s\u00e8 betaront a travaly\u00e9r avou\u00e9c
  bine plles d''assuren\u00e7a.\\n- Fr\u00e2sa : ... o-est-a-d\u00e9re qu''ils d\u00eavont
  f\u00e9re de mani\u00e9ra que les nov\u00e8les t\u00e2ches r\u00e8volucion\u00e8res
  et los nov\u00e9ls proj\u00e8ts de trav\u00e2ly propos\u00e2s corr\u00e8spond\u00e9ssont
  ux nov\u00e8les modificacions de la situacion.\\nDens una p\u00e8rioda r\u00e8volucion\u00e8ra,
  la situacion change vito; se los r\u00e8volucion\u00e8ros adaptont pas rapidament
  lor cognessen\u00e7a a la situacion, ils seront encap\u00e2bllos de f\u00e9re trionfar
  la r\u00e8volucion.\\n- Fr\u00e2sa : Ceta transformacion est ja comenci\u00eaya
