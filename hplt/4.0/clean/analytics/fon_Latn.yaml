  \u0254, \u00e9 gba wemax\u0254m\u025b \u0256okpo lobo sunny\u01d0 \u0256\u0254 Isidore
  de Souza.\"", "\"\u201cMi fl\u00edn \u0256\u0254 mi \u0256\u00f3 na y\u00ed ye m\u025b
  e n\u0254 w\u00e1 ba jon\u0254 mi l\u025b \u00e9 ganji.\u201d\u2014EBL. 13:2.\\nHAN
