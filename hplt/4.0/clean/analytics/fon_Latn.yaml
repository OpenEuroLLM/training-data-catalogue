  ka n\u0254 m\u0254 \u0256\u00f2 \u00e9gb\u00e9? (Kp\u0254\u0301n f\u0254t\u00f3o
  e \u0256\u00f2 b\u01d0b\u025b\u030cm\u025b \u00e9.) (b) Et\u025b m\u025bs\u025b\u0301d\u00f3
