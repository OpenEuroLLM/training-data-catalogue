  gle l\u025b m\u025b ny\u00ed \u0256okpo \u0256\u00f2 ac\u025b e ye \u0256\u00f3
  l\u025b \u00e9 m\u025b.\u2014Lev. 19:9, 10.\\n4 Jehovah \u0256egbe n\u00fa Izlay\u025bli-v\u00ed
