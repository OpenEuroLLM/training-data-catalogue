sample: '["\"Wp/fon/Alw\u025bm\u025bnun\u0254\\n\u0189o af\u0254gok\u0254 B\u00e9n\u025b
  t\u0254n \u0256o taji \u0254 Kut\u0254nu, Agbom\u025b, Glexwe kpodo toxo e l\u025bdo
  ye l\u025b e kpan \u0254, m\u025b\u0256axo Jo\u00ebl Noret yi cy\u0254 nu wiwa gege
  sin t\u025bnm\u025b nu xwe m\u0254kpan. E s\u0254 cy\u0254 nuwiwa \u0254 e n\u0254
  m\u0254 y\u025bsufif\u0254 w\u025bn\u025b m\u0254 \u0256o kplekplem\u025b y\u025bsufif\u0254''li
  t\u0254n \u0256o af\u0254gok\u0254 B\u00e9n\u025b t\u0254n : nu m\u01d0 s\u0254
  Klisanwun katolika l\u025b, gbigb\u0254wiwe n\u0254, l\u025b gbagb\u0254n\u0254
  l\u025b kpo h\u025bndo m\u01d0t\u0254n l\u025b kpo. Nuwiwa gege n\u0254 do gungun
  nu cy\u0254 nu wiwa kpodo tuto t\u0254n l\u025b kpan kaka yij\u025b cy\u0254\u0256i\u0256i
  gudo. M\u025b\u0256axo Jo\u00ebl Moret s\u0254 kp\u0254ndewu \u0256okpo \u0256o
  te : Cy\u0254 nu wiwa N\u0254ye Mireille t\u0254n. E kp\u0254nm\u025b \u0254, m\u01d0
  h\u025bn \u0254 m\u01d0 na \u0256\u0254 m\u025b gege w\u025b \u0256onu \u0256o cy\u0254
  nu wiwa \u0254 m\u025b, b\u025bsin h\u025bnnum\u0254 m\u025b e ku e t\u0254n ji
  kaka yij\u025b h\u025bnnu s\u025bya h\u025bnnu l\u025b bi ji kpodo cy\u0254 nu wa
  t\u0254 l\u025b kpan. \u0189okpo \u0256okpon\u0254 yet\u0254n \u0256o nu\u0256e
