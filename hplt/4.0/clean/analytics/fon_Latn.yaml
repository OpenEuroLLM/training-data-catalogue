  \u0256\u00f2 kpl\u00e9kpl\u00e9 Klisanwun l\u025b t\u0254n e m\u025b\u0301 bo \u0256\u00f3
  wanyiyi, lobo gb\u0254n gb\u025b\u0300 \u0254 b\u01d0 m\u025b \u00e9 \u0256\u00e9
  m\u025b.\"", "\"Agasa \u0254 kanlin \u0256e w\u025b bo \u0256o go. E n\u0254 n\u0254
  t\u0254 m\u025b kpo ageji kpo.\\nAgasa al\u0254kpa al\u0254kpa w\u025b t\u01d0in.
  E \u0256e \u011be e n\u0254 yl\u0254 \u0256\u0254 Brachyura alo agasa j\u0254 agasa
  e kpodo \u011be e n\u0254 yl\u0254 \u0256\u0254 Anomura bo nyi agasa ag\u0254nk\u025b''tin
  t\u0254n e kpodo \u0256evoe kpan. E \u0256o m\u0254\u0300 c\u00f3 agasa l\u025b
  bi nyi agasa. Y\u025bgletete xum\u025b t\u0254n e \u0256o gb\u025bta Brachyura t\u0254n
  e alo agasa bernard l''hermite kpodo galath\u00e9es bo \u0256o gb\u025bta Anomura
  t\u0254n e kpan \u0256e nyi agasa \u01ce. E na \u0256\u0254 \u0254 agasa e n\u0254
  wili \u0256o xwe \u0256okpo m\u025b \u0254 \u0256\u00ec bla yi t\u0254nu livi \u0256okpo
  ada\u0256e m\u0254 (1,2). Agasa \u0254 kanlin xuto t\u0254n w\u025b b\u0254 wiliwili
  t\u0254n b\u0254wu tawun. \u0189\u00f2 wamam\u0254n\u0254 t\u00f2 l\u025b m\u025b
  \u0254 nu\u0256u\u0256u titeungbe w\u025b bo ka kp\u0254 akw\u025b. Y\u0254kp\u0254vu
  l\u025b w\u025b n\u0254 wli\"", "\"M\u025b\u030c m\u025b\u030c e ka ny\u00ed \u00d0agbewat\u0254\u0301
  ee x\u00f3 Jezu \u0256\u0254 \u0256\u00f2 z\u01cen e j\u025b nuk\u0254n n\u00fa
  k\u00fa t\u0254n \u00e9 m\u025b \u00e9? Et\u025bwu \u00e9 ka na ye t\u025bnm\u025b-nyik\u0254
  en\u025b?\\n\u00d0\u00f2 z\u01cen e j\u025b nuk\u0254n n\u00fa k\u00fa Jezu t\u0254n
  \u00e9 m\u025b \u0254, \u00e9 \u0256\u00e8 w\u011b x\u00e1 m\u025bs\u025b\u0301d\u00f3
  t\u0254n l\u025b \u0256\u0254 ye ni ma ba t\u025bn nuk\u00fan\u0256eji \u0256\u00f2
  n\u01d4\u0256it\u0254\u0301 hat\u0254\u0301 yet\u0254n l\u025b t\u025bntin \u00f3.
  \u00c9 \u0256\u0254 n\u00fa ye \u0256\u0254: \u201cTogun e ma ny\u00ed Jwifu \u01ce
  l\u025b s\u00edn ax\u0254su l\u025b n\u0254 kpa ac\u025b gannaganna n\u00fa ye,
  b\u0254 m\u025b e ny\u00ed g\u01cen l\u025b n\u0254 ba \u0256\u0254 \u00e8 ni yl\u0254\u0301
  emi \u0256\u0254 \u2018\u00d0agbewat\u0254\u0301.\u2019 Lo\u0254, n\u01d4 na ny\u00ed
  m\u0254\u030c \u0256\u00f2 mid\u025b\u025b l\u025b m\u025b \u01ce.\u201d\u2014Luk.
  22:25, 26.\\nM\u025b\u030c m\u025b\u030c e ka ny\u00ed \u00d0agbewat\u0254\u0301
  ee x\u00f3 Jezu \u0256\u0254 l\u025b \u00e9? N\u01d4 e \u00e8 wlan d\u00f3 awinnya,
  al\u01d2, n\u01d4 m\u0254hun \u0256\u00e9 j\u00ed l\u025b \u00e9, akw\u025b kpo
  n\u01d4wlanwl\u00e1n l\u025b kpo xl\u025b\u0301 \u0256\u0254 \u00e9 ny\u00ed aca
  n\u00fa Gl\u025bkinu l\u025b kpo Hl\u0254manu l\u025b kpo b\u0254 ye n\u0254 z\u00e1n
  t\u025bnm\u025b-nyik\u0254 \u00c9verg\u00e8tes, al\u01d2, \u00d0agbewat\u0254\u0301
  d\u00f3 x\u0254 susu n\u00fa sunnu nuk\u00fan\u0256eji l\u025b kpo ac\u025bkpat\u0254\u0301
  l\u025b kpo. \u00c8 n\u0254 x\u0254 susu en\u025b n\u00fa sunnu m\u0254hun l\u025b
  \u0256\u00f3 az\u0254\u030c x\u0254 akw\u025b e ye w\u00e0 d\u00f3 m\u025b geg\u011b
  tak\u00fanm\u025b \u00e9 wu.\\n\u00c8 na t\u025bnm\u025b-nyik\u0254 \u00d0agbewat\u0254\u0301
  \u0254 ax\u0254su \u0256\u00e9 l\u025b. Ye m\u025b \u0256\u00e9 l\u025b \u0256\u00ede:
  Ejipu x\u0254su ee \u00e8 n\u0254 yl\u0254\u0301 \u0256\u0254 Ptol\u00e9m\u00e9e
  III \u00c9verg\u00e8tes \u00e9 (\u0256ibla y\u00ec 247-222 J.H.M.) kpo Ptol\u00e9m\u00e9e
  VIII \u00c9verg\u00e8tes II (\u0256ibla y\u00ec 147-117 J.H.M.) kpo. Hl\u0254ma
  x\u0254su Jules C\u00e9sar (48-44 J.H.M.) kpo Auguste (31 J.H.M.\u201314 H.M.) kpo
  l\u0254 \u0256\u00f3 t\u025bnm\u025b-nyik\u0254 en\u025b; g\u0254\u0301 n\u00fa
  Elodu \u00d0ax\u00f3 \u0254 ee ny\u00ed ax\u0254su Jud\u00e9e t\u0254n \u00e9. Elodu
  \u0254, \u00e9 c\u00ed \u0256\u0254 hwenu e \u00e9 h\u025bn bl\u011be s\u00edn togudo
  w\u00e1 n\u00fa togun t\u0254n, bo l\u025b\u0301 na av\u0254 m\u025b e \u0256\u00f2
  hudo m\u025b l\u025b \u00e9 d\u00f3 h\u025bn s\u0254 ye hwenu e ad\u0254 \u0256\u00e9
  t\u0254\u0301n \u00e9 w\u025b \u00e8 na \u025b t\u025bnm\u025b-nyik\u0254 en\u025b
  \u0254 \u0256\u0254hun.\\nS\u0254gbe x\u00e1 n\u01d4 e ak\u0254w\u00e9 Biblu t\u0254n
  Allemagne nu Adolf Deissmann \u0256\u0254 \u00e9 \u0254, t\u025bnm\u025b-nyik\u0254
  \u00d0agbewat\u0254\u0301 zinzan \u0254 gbakp\u00e9. \u00c9 \u0256\u0254: \u201c\u00c9
  na v\u025bw\u01d4 cob\u0254 \u00e8 na m\u0254 awinnya al\u01d2 n\u01d4 m\u0254hun
  e j\u00ed \u00e8 wlan t\u025bnm\u025b-nyik\u0254 en\u025b \u0256\u00f3 \u00e9 geg\u011b
  \u01ce, \u00e9 na \u0256u t\u00e1an \u0256eb\u01d4 cob\u0254 \u00e8 na m\u0254 [t\u025bnm\u025b-nyik\u0254
  en\u025b e \u00e8 z\u00e1n \u00e9] az\u0254n kanweko j\u025bji \u01ce.\u201d\\nEn\u025b
  wu \u0254, et\u025b \u0256\u0254 gb\u00e9 Jezu ka ja hwenu e \u00e9 \u0256\u0254
  n\u00fa ahwanvu t\u0254n l\u025b \u0256\u0254: \u201cLo\u0254, n\u01d4 na ny\u00ed
  m\u0254\u030c \u0256\u00f2 mid\u025b\u025b l\u025b m\u025b \u01ce\u201d \u00e9?
  \u00d0i\u0256\u0254 w\u025b Jezu \u0256\u00e8 \u0256\u0254 ye ni \u0256\u00f3 linlin
  e ma na w\u00e0 \u0256agbe n\u00fa m\u025b \u0256evo l\u025b \u01ce \u00e9, en\u025b
  w\u025b ny\u00ed \u0256\u0254 ganjinin\u0254 m\u025b e l\u025bl\u025b\u030c d\u00f3
  ye kpaa l\u025b \u00e9 t\u0254n ni ma n\u0254 \u0256u ayi m\u025b n\u00fa ye \u00f3
  \u00e0? \u00d0eb\u01d4 \u01ce. \u00c9 c\u00ed \u0256\u0254 n\u01d4 e \u0256u ayi
  m\u025b n\u00fa Jezu \u00e9 w\u025b ny\u00ed n\u01d4 e s\u00eds\u025b\u0301 m\u025b
  b\u0254 \u00e8 hun al\u0254 d\u00f3 na n\u01d4 \u00e9 \u0256\u0254hun.\\nJezu s\u00edn
  az\u01cen gb\u00e8 \u0254, d\u0254kunn\u0254 l\u025b n\u0254 n\u0254 gudo n\u00fa
  ayi\u0256e\u0256ay\u01d0 l\u025b kpo ayihundida \u0256\u00f2 n\u01d4kp\u0254nt\u025bn
  l\u025b kpo, n\u0254 bl\u00f3 jikp\u00e1 l\u025b kpo sins\u025bnx\u0254 l\u025b
  kpo, lobo n\u0254 n\u0254 gudo n\u00fa n\u01d4wiwa m\u0254hun l\u025b b\u00e1 d\u00f3
  \u0256\u00f3 nyik\u0254 \u0256agbe. Am\u0254\u030c, bonu gb\u025bt\u0254\u0301 l\u025b
  na d\u00f3 x\u0254 susu n\u00fa ye, bonu ye na ny\u00ed m\u025b nuk\u00fan\u0256eji,
  al\u01d2 m\u025b l\u025b na s\u0254\u0301 ye \u0256\u00f2 g\u01cens\u00eds\u0254\u0301
  hwenu wutu w\u025b ye n\u0254 w\u00e0 n\u01d4 en\u025b l\u025b. Al\u0254dl\u025bnd\u00f3n\u01d4
  \u0256\u00e9 \u0256\u0254: \u201cN\u01d4gbo w\u025b \u0256\u0254, kp\u0254\u0301nd\u00e9w\u00fa
  \u0256\u00e9 l\u025b xl\u025b\u0301 \u0256\u0254 n\u01d4nam\u025bt\u0254\u0301 en\u025b
  l\u025b n\u0254 na n\u01d4 m\u025b kpo ayi b\u01d0 kpo c\u00f3, cej\u025bnnabi \u0256\u00f2
  tox\u00f3\u0256i\u0256\u0254 linu w\u025b n\u0254 \u0256\u00f2 gudo n\u00fa n\u01d4nam\u025b
  en\u025b l\u025b hw\u025bhw\u025b.\u201d Linlin goyiyi kpo cej\u025bnnabi kpo t\u0254n
  w\u025b Jezu \u0256\u00f2 wusy\u025bn d\u00f3 lanm\u025b n\u00fa ahwanvu t\u0254n
  l\u025b w\u025b \u0256\u0254 ye ni nyi al\u0254 na.\\nXw\u00e8 \u0256\u00e9 l\u025b
  gudo \u0254, m\u025bs\u025b\u0301d\u00f3 P\u0254lu t\u025b\u0256\u025b\u030c n\u01d4gbo
  taji \u0256okpo e k\u00fankpl\u00e1 n\u01d4 e na s\u00eds\u025b\u0301 m\u025b b\u0254
  \u00e8 na na n\u01d4 m\u025b \u00e9 j\u00ed. \u00c9 wlan s\u025b\u0301d\u00f3 n\u01d4\u0256it\u0254\u0301
  hat\u0254\u0301 t\u0254n K\u0254l\u025bnti t\u0254n l\u025b \u0256\u0254: \u201cH\u01d4n,
  m\u025b \u0256okpo \u0256okpo \u0256\u00f3 na na n\u01d4 m\u025b lee \u00e9 lin
  gb\u0254n \u0256\u00f2 ayi t\u0254n m\u025b \u00e9; ni ma na n\u01d4 m\u025b, bonu
  \u00e9 l\u025b\u0301 v\u025b\u0301 n\u2019i, ab\u01d0 ni ny\u00ed dandan s\u00edn
  n\u01d4 n\u2019i \u00f3. \u00d0\u00f3 Mawu y\u00ed w\u01cen n\u00fa m\u025b e n\u0254
  na n\u01d4 m\u025b kpodo xom\u025bhunhun kpo \u00e9.\u201d\u20142 K\u0254. 9:7.\"",
  "\"Gis\u00e8le Hountondji ny\u00ed jiji to 1954 to B\u00e9nin. Wekant\u0254 \u0256\u00e9,
  kp\u00f3\u0256\u0254 l\u025bd\u00f3gbe\u0256evom\u025b - bas\u00edt\u0254 \u0256\u00e9
  kp\u00f3 w\u025b \u00e9 ny\u00ed. Ew\u0254 w\u025b ny\u00ed ny\u0254nu tintan xe
  k\u00e0n ow\u011b l\u025b s\u0254\u0301n B\u00e9nin. Glelelele wlan ow\u011b \u0256\u00e9
  xe n\u0254 ny\u00ed \\\"Une citronnelle dans la neige\\\". \u00c9 gand\u00f3 gb\u025bz\u01cen
  et\u0254n to hwenuena \u00e9 ny\u00ed wex\u0254m\u025bvi \u0256\u00e9 to Europe,
  titewungbe to Paris go. \u00c9 kanwe gand\u00f3 ojl\u025b sinsinny\u025b xe m\u025b
  \u00e9 jugb\u0254n l\u025b go.\\nGis\u00e8le Hountondji ny\u00ed jiji to 1954 to
  Cotonou, B\u00e9nin. Ot\u0254\u0301 et\u0254n n\u0254 waz\u0254\u0301n to kpinkp\u00e1n-glint\u025bn
  \u0256\u00e9. \u00c9 jlo \u0256\u0254 \u00e9 ni kpl\u0254\u0301nwe ganji. En\u025bwutu,
  \u00e9 d\u00f3 \u00e9 hlan nad\u00f3 y\u00ec n\u0254 x\u025b naf\u025b et\u0254n
  kp\u00f3 tav\u025b et\u0254n kp\u00f3. Tav\u025b et\u0254n ny\u00ed m\u025bkpl\u0254\u0301nt\u0254
  \u0256\u00e9. Gis\u00e8le y\u00ec wex\u0254m\u025b \u0256ok\u0254\u0300 t\u0254n
  to Paouignan. En\u025bgodo, \u00e9 y\u00ec wex\u0254m\u025b \u0256axo to Abomey
  s\u0254\u0301n 1965 j\u025b 1972.\\nGis\u00e8le Hountondji y\u00ec Paris nad\u00f3
  kpl\u0254\u0301nn\u01d4 to wex\u0254m\u025b alav\u0254 t\u0254n \u0256\u00e9 s\u0254\u0301n
  1973 j\u025b 1978. \u00c9 s\u0254 dla London kp\u00f3 Madrid kp\u00f3 kp\u0254\u0301n
  nad\u00f3 kpl\u0254\u0301n ogb\u00e8 l\u025b. \u00c9 m\u0254 wema von\u0254tawun
  \u0256\u00e9 kp\u00f3 gbe\u0256ewema az\u0254\u0301nnyw\u025bt\u0254 \u0256\u00e9
  t\u0254n kp\u00f3 y\u00ed nad\u00f3 bas\u00ed l\u025bd\u00f3gbe\u0256evom\u025b
  Espagne-gb\u00e9 kp\u00f3 Gl\u025bnsigbe kp\u00f3 t\u0254n. En\u025bgodo, \u00e9
  kpl\u0254\u0301n nususu d\u00f3g\u0254\u0301 nad\u00f3 l\u025bzun l\u025bd\u00f3gbe\u0256evom\u025b
  bas\u00edt\u0254 \u0256\u00e9 to London. To 1983, \u00e9 m\u0254 gbe\u0256ewema
  y\u00ed nad\u00f3 bas\u00ed l\u025bd\u00f3gbe\u0256evom\u025b Flansegbe kp\u00f3
  Gl\u025bnsigbe kp\u00f3 t\u0254n to ojl\u025b \u0256okp\u00f3l\u0254 m\u025b. To
  oxwe xe b\u0254dego m\u025b, \u00e9 j\u025b az\u0254\u0301nwa ji tayi\u0256i l\u025bd\u00f3gbe\u0256evom\u025b
  - bas\u00edt\u0254 \u0256\u00e9 to B\u00e9nin. Todin, Gis\u00e8le n\u0254 waz\u0254\u0301n
  tayi\u0256i l\u025bd\u00f3gbe\u0256evom\u025b bas\u00edt\u0254 \u0256\u00e9 to Cotonou,
  B\u00e9nin.\\nGis\u00e8le Hountondji wlan ow\u011b titewungbe \u0256\u00e9 xe n\u0254
  ny\u00ed yiyl\u0254\u0256\u0254 \\\"Une citronnelle dans la neige\\\". Ow\u011b
  exe gb\u0254nvo tawun n\u00e1 hwla tintan \u0256ie xe m\u025b\u0256\u00e9 k\u00e0nwe
  gand\u00f3 n\u01d4xe \u00e9 tayi\u0256i nad\u00f3 ny\u00ed ny\u0254nu m\u025byuu
  \u0256\u00e9 to France go. J\u025bnuk\u0254nna ow\u011b et\u0254n, wekant\u0254
  \u0256\u00e9vo l\u025b tayi\u0256i Ak\u00e9 Loba, Bernard Dadi\u00e9, kp\u00f3 Cheikh
  Hamidou Kane kp\u00f3 k\u00e0nwe gand\u00f3 wex\u0254m\u025bvi Aflika t\u0254n l\u025b
  go to Paris, cigb\u01ce y\u00e9 ma kanwe gand\u00f3 ny\u0254nu m\u025byuu nyinyi
  go gba. Ow\u011b Gis\u00e8le t\u0254n ny\u00ed ow\u011b tangan \u0256\u00e9 to wekinkan
  Aflika t\u0254n l\u025b m\u025b to xwel\u0254nu. Gis\u00e8le s\u0254 ny\u00ed nyinyw\u025b
  tayi\u0256i ny\u0254nu tintan s\u0254\u0301n B\u00e9nin nad\u00f3 k\u00e0n ow\u011b
  \u0256\u00e9.\\nTo ow\u011b Gis\u00e8le Hountondji t\u0254n m\u025b, om\u025b tangan
  l\u0254 n\u0254 y\u00ec France nad\u00f3 kpl\u0254\u0301nn\u01d4. Ot\u0254\u0301
  et\u0254n yiw\u01cenna aca Flansegbe t\u0254n bo \u0256\u0254 \u0256\u0254 France
  ny\u00ed n\u0254t\u025bn al\u0254k\u025byi t\u0254n \u0256\u00e9 bos\u0254 ny\u00ed
  ot\u00f2 xe v\u00f2 \u0256\u00e9. Cigb\u01ce to hwenuena \u00e9 j\u025b France to
  1970, \u00e9 \u0256oayi \u00e9 go \u0256\u0254 \u00e9 manyi m\u0254 gba. Gb\u025bt\u0254\u0301
  l\u025b n\u0254 y\u00ed nuk\u00fankp\u025bvi d\u00f3 kp\u0254\u0301n \u025bn, kp\u00f3\u0256\u0254
  \u00e9 v\u025bawuna \u025bn nad\u00f3 m\u0254 fixe \u00e9 n\u00e1 n\u0254\u0300.
  \u00c9 tl\u025b tind\u00f3 numim\u0254 ylankan \u0256\u00e9 xe to hwenue \u00e9
  t\u025bnkp\u0254n nad\u00f3 k\u0254nawud\u00f3kp\u0254\u0301 x\u025b klasi we\u0256u\u0256u
  t\u0254n \u0256\u00e9. \u00c9 s\u0254 tind\u00f3 xacincan awubla kp\u00f3 flum\u025bjij\u025b
  t\u0254n \u0256\u00e9 kp\u00f3 x\u025b d\u01cewe Flansenu \u0256\u00e9. Nin\u0254m\u025b
  l\u0254 ylan bos\u0254 v\u0254 ylan \u0256\u00e9ji, kp\u00f3\u0256\u0254 axwli ay\u01cej\u025bn\u0254
  l\u0254 w\u00e0 j\u025bflum\u025b tawun. Gis\u00e8le Hountondji y\u00ed ahun\u0256okp\u00f3
  d\u00f3 kanwe gand\u00f3 numim\u0254 ylankan xe \u00e9 tind\u00f3 to France l\u025b
  go. To ow\u011b et\u0254n Une citronnelle dans la neige m\u025b, \u00e9 bas\u00ed
  z\u025b\u025bm\u025b om\u025b France t\u0254n l\u025b t\u0254n kp\u00f3 ahun\u0256okp\u00f3
  kp\u00f3. \u00c9 \u0256\u0254 \u0256\u0254 y\u00e9 gb\u025bw\u01cenna m\u025byuu
  l\u025b kp\u00f3 m\u025bxe w\u00e1 s\u0254\u0301n Asia l\u025b kp\u00f3, bo ma s\u0254
  tind\u00f3 sisi n\u00e1 y\u00e9. Wenyw\u025bt\u0254 \u0256\u00e9 xe n\u0254 ny\u00ed
  Adrien Huannou \u0256\u0254 \u0256\u0254 Hountondji d\u00f3 om\u025b France t\u0254n
  l\u025b xya \u0256i cejannabin\u0254, bo n\u0254 x\u00f2 ye\u0256etiti t\u0254n
