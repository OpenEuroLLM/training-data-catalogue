  l\u025b \u01ce, \u00e9 ny\u0254\u0301 w\u00e0 \u0254, \u00e9 by\u0254 ye \u0256\u0254
  ye ni s\u00e8 wuv\u025b\u030c x\u00e1 jon\u0254 l\u025b. (X\u00e0 T\u00ednt\u0254\u0301n
  23:9.) Ye tu\u00f9n \u201cn\u01d4 e n\u0254 gb\u00f2 to\u0256evom\u025bnu \u00e9.\u201d
  Cobonu Ejipunu l\u025b tl\u025b na s\u0254\u0301 Ebl\u00e9e l\u025b d\u00f3 \u0256\u00f3
  kannum\u0254 \u0254, \u00e9 c\u00ed \u0256\u0254 ye ko n\u0254 gb\u025b\u0301 w\u01cen
  n\u00fa ye \u0256\u00f3 ak\u0254 k\u00ednkl\u00e1n al\u01d2 sins\u025bn \u0256okpo
  \u0254 m\u025b e ye ma \u0256\u00e8 \u01ce \u00e9 wutu. (B\u01d0b. 43:32; 46:34;
  T\u00edn. 1:11-14) Izlay\u025bli-v\u00ed l\u025b jiya tawun hwenu e ye ny\u00ed
  jon\u0254 \u0256\u00f2 t\u00f2 \u0256evo m\u025b \u00e9, am\u0254\u030c, Jehovah
  by\u0254 ye \u0256\u0254 ye ni w\u00e0 n\u01d4 x\u00e1 jon\u0254 l\u025b \u2018t\u00f2
  yet\u0254n m\u025b nu w\u025b ye ny\u00ed \u0256\u0254hun.\u2019\u2014Lev. 19:33,
  34.\\n5. Et\u025b ka na d\u2019al\u0254 m\u01d0 b\u0254 jon\u0254 l\u025b s\u00edn
  n\u01d4 na n\u0254 \u0256u ayi m\u025b n\u00fa m\u01d0 Jehovah \u0256\u0254hun?\\n5
  \u00d0\u00f2 \u00e9gb\u00e9 \u0256esu \u0254, m\u01d0 sixu kudeji \u0256\u0254 to\u0256evom\u025bnu
  e n\u0254 w\u00e1 kpl\u00e9 l\u025b \u0256\u00f2 agun m\u01d0t\u0254n l\u025b m\u025b
  l\u025b \u00e9 s\u00edn n\u01d4 n\u0254 \u0256u ayi m\u025b n\u00fa Jehovah. (S\u025b\u0301n.
  10:17-19; Mal. 3:5, 6) Enyi m\u01d0 lin tam\u025b d\u00f3 wuv\u025b\u030c e ye n\u0254
  m\u0254 l\u025b \u00e9, \u0256i m\u025b k\u00ednkl\u00e1n \u0256\u00f3 vo al\u01d2
  gbemase j\u00ed \u0254, m\u01d0 na ba ali e nu m\u01d0 na \u0256\u00e8 xom\u025bny\u00edny\u0254\u0301
  kpo wanyiyi n\u0254v\u00ed n\u0254v\u00ed t\u0254n kpo xl\u025b\u0301 ye \u0256\u00e8
  l\u025b \u00e9.\u20141 Pi. 3:8.\\n\u00c9 KA BY\u0186 \u00d0\u0186 M\u01cf NI \u00d0Y\u0186
  LINLIN E M\u01cf N\u0186 \u00d0\u00d3 D\u00d3 JON\u0186 L\u0190 WU \u00c9 W\u0190
  \u00c0?\\n6, 7. Et\u025b ka \u0256exl\u025b\u0301 \u0256\u0254 Klisanwun xw\u00e8
  kanweko nuk\u0254nt\u0254n \u0254 t\u0254n l\u025b t\u025bnkp\u0254n bo \u0256u
  \u0256\u00f2 linlin ag\u0254 \u0256i\u0256\u00f3 d\u00f3 m\u025b \u0256evo l\u025b
  wu sy\u025bnsy\u025bn j\u00ed?\\n6 Klisanwun xw\u00e8 kanweko nuk\u0254nt\u0254n
  \u0254 t\u0254n l\u025b t\u025bnkp\u0254n bo \u0256u \u0256\u00f2 linlin ag\u0254
  \u0256i\u0256\u00f3 d\u00f3 m\u025b \u0256evo l\u025b wu e kpa zinkpo \u0256\u00f2
  Jwifu l\u025b t\u025bntin \u00e9 j\u00ed. \u00d0\u00f2 Pantekotu xw\u00e8 33 H.M.
  t\u0254n \u0254, ye m\u025b e n\u0254 n\u0254 Jeluzal\u025bmu l\u025b \u00e9 y\u00ed
  jon\u0254 m\u025b \u0256\u011b\u0256ee gosin x\u00e1 vovo l\u025b m\u025b bo huzu
  Klisanwun y\u0254y\u0254\u030c l\u025b \u00e9 t\u0254n. (M\u025b. 2:5, 44-47) Lee
  n\u00f9\u0256it\u0254\u0301 ay\u01d0 \u0256evo j\u00ed t\u0254n l\u025b s\u00edn
  n\u01d4 \u0256u ayi m\u025b n\u00fa Klisanwun Jwifu l\u025b gb\u0254n \u00e9 xl\u025b\u0301
  \u0256\u0254 ye m\u0254 nuk\u00fann\u00fa j\u025b x\u00f3kwin \u201cjon\u0254yiyi\u201d
  \u0254 s\u00edn tinm\u025b wu, \u00e9 w\u025b ny\u00ed \u201cxom\u025bny\u00edny\u0254\u0301
  d\u00f3 jon\u0254 l\u025b wu.\u201d\\n7 \u00c9 \u0256\u00f2 m\u0254\u030c c\u00f3,
  ee agun Klisanwun nuk\u0254nt\u0254n l\u025b t\u0254n \u0256\u00f2 jij\u025bji w\u025b
  \u00e9 \u0254, nin\u0254m\u025b e vl\u025b\u0301 m\u025b k\u00ednkl\u00e1n \u0256\u00f3
  vo \u00e9 \u0256\u00e9 w\u00e1 xwet\u0254\u0301n. Jwifu e n\u0254 d\u00f3 Gl\u025bkigbe
  l\u025b \u00e9 hlun n\u01d4 \u0256\u0254 j\u00ed \u00e8 k\u00fan \u0256\u00f2 n\u01d4
  w\u00e0 x\u00e1 as\u00fak\u00fasi emit\u0254n l\u025b w\u025b ganji \u00f3. (M\u025b.
  6:1) Bo na d\u00f3 \u0256e\u0256\u025b tagba \u0254 \u0254, m\u025bs\u025b\u0301d\u00f3
  l\u025b \u0256\u00e8 sunnu t\u025bnwe bonu ye na n\u0254 bl\u00f3 b\u0254 \u00e8
  na dov\u025b\u030c n\u00fa m\u025b\u0256eb\u01d4 \u01ce. Sunnu en\u025b l\u025b
  b\u01d0 w\u025b \u0256\u00f3 Gl\u025bki nyik\u0254, b\u0254 en\u025b xl\u025b\u0301
  \u0256\u0254 m\u025bs\u025b\u0301d\u00f3 l\u025b jl\u00f3 na k\u0254n f\u00edf\u00e1
  d\u00f3 tagba \u0256eb\u01d4 e sixu ko \u0256\u00f2 Klisanwun nuk\u0254nt\u0254n
  l\u025b t\u025bntin bo k\u00fankpl\u00e1 f\u00ed e nu \u00e8 ny\u00ed \u00e9 \u00e9
  m\u025b.\u2014M\u025b. 6:2-6.\\n8, 9. (a) Et\u025b ka sixu \u0256exl\u025b\u0301
  \u0256\u0254 m\u01d0 \u0256\u00f2 linlin ag\u0254 \u0256\u00f3 d\u00f3 m\u025b \u0256evo
  l\u025b wu w\u025b al\u01d2 m\u01d0 \u0256\u00f2 ak\u0254 kl\u00e1n w\u025b? (b)
  Et\u025b m\u01d0 ka \u0256\u00f3 na h\u0254n \u0256\u0254 na s\u00edn ayi m\u01d0t\u0254n
  m\u025b? (1 Pi. 1:22)\\n8 M\u01d0 b\u01d0 w\u025b n\u0254 w\u00e0 n\u01d4 s\u0254gbe
  x\u00e1 aca f\u00ed e nu m\u01d0 ny\u00ed \u00e9 t\u0254n, enyi m\u01d0 m\u0254
  nuk\u00fann\u00fa j\u025b wu kpo m\u01d0 gb\u0254 kpo \u0254 n\u025b. (Hl\u0254.
  12:2) G\u0254\u0301 na \u0254, m\u01d0 na ko s\u00e8 b\u0254 n\u0254zo m\u01d0t\u0254n
  l\u025b, az\u0254\u030cgb\u025b\u0301 m\u01d0t\u0254n l\u025b, al\u01d2 az\u0254\u030cm\u025bvigb\u025b\u0301
  m\u01d0t\u0254n l\u025b na \u0256\u0254 x\u00f3 nyanya l\u025b d\u00f3 m\u025b e
  ny\u00ed f\u00ed \u0256evo nu, ak\u0254 \u0256evo, al\u01d2 \u0256\u00f3 any\u01d4
  \u0256evo l\u025b \u00e9 wu. B\u01ce t\u025b m\u025b linlin ag\u0254 en\u025b l\u025b
  ka n\u0254 w\u00e0 n\u01d4 d\u00f3 m\u01d0 wu \u0256\u00f3? Enyi m\u025b\u0256\u00e9
  c\u00e1 n\u00fa t\u00f2 e m\u025b m\u01d0 gosin \u00e9, vlafo gb\u0254n s\u00ecn
  did\u00f3 aca m\u01d0t\u0254n \u0256\u00e9 l\u025b j\u00ed gblam\u025b \u0254, n\u025b\u030c
  m\u01d0 ka n\u0254 w\u00e0 n\u01d4 gb\u0254n?\\n9 M\u025bs\u025b\u0301d\u00f3 Piy\u025b\u0301\u025b
  \u0256\u00f3 linlin ag\u0254 d\u00f3 m\u025b e ma ny\u00ed Jwifu \u01ce l\u025b
  \u00e9 wu n\u00fa t\u00e1an \u0256\u00e9, am\u0254\u030c, kp\u025b\u0256\u00e9 kp\u025b\u0256\u00e9
  \u0254, \u00e9 t\u025bnkp\u0254n bo \u0256\u00e8 linlin m\u0254hun l\u025b s\u00edn
  ayi m\u025b. (M\u025b. 10:28, 34, 35; Ga. 2:11-14) M\u0254\u030c \u0256okpo \u0254,
  enyi m\u01d0 \u0256\u2019ayi wu \u0256\u0254 linlin ag\u0254 \u0256i\u0256\u00f3
  al\u01d2 ak\u0254 k\u00ednkl\u00e1n s\u00edn wuntun \u0256\u00e9 v\u00e1 d\u00f3
  m\u01d0 wu \u0254, m\u01d0 \u0256\u00f3 na v\u00e1n k\u00e0n tawun bo h\u0254n \u0256\u0254
  na s\u00edn ayi m\u01d0t\u0254n m\u025b. (X\u00e0 1 Piy\u025b\u0301\u025b 1:22.)
  M\u01d0 \u0256\u00f3 na fl\u00edn \u0256\u0254 m\u01d0 m\u025b \u0256\u011b k\u00fan
  j\u025bxa hwl\u025bng\u00e1n \u00f3; m\u01d0 b\u01d0 w\u025b ny\u00ed hw\u025bhut\u0254\u0301,
  enyi m\u01d0 na bo gosin t\u00f2 \u0256eb\u01d4 m\u025b \u0254 n\u025b. (Hl\u0254.
  3:9, 10, 21-24) En\u025b wu \u0254, aniwu m\u01d0 ka na n\u0254 m\u0254 \u0256\u0254
  m\u01d0 hug\u01cen m\u025b \u0256\u011b l\u025b? (1 K\u0254. 4:7) M\u01d0 \u0256\u00f3
  na \u0256\u00f3 linlin \u0256okpo \u0254 m\u025bs\u025b\u0301d\u00f3 P\u0254lu \u0256\u0254hun,
  \u00e9y\u025b gb\u025b\u0301 n\u01d4 n\u00fa Klisanwun y\u00ed ami d\u00f3 \u0256\u00e8
  l\u025b \u0256\u0254: \u201cMi s\u0254\u0301 ny\u00ed jon\u0254 ab\u01d0 m\u025b
  e gosin f\u00ed \u0256evo bo w\u00e1 \u00e9 \u01ce; lo\u0254, . . . [mi] \u0256\u00f2
  h\u025bnnu Mawu t\u0254n m\u025b.\u201d (Ef\u025b. 2:19) G\u01cendido b\u00e1 \u0256u
  \u0256\u00f2 linlin ag\u0254 l\u025b \u0256i\u0256\u00f3 d\u00f3 m\u025b e ny\u00ed
  f\u00ed \u0256evo nu l\u025b \u00e9 wu j\u00ed na d\u2019al\u0254 m\u01d0 b\u0254
  m\u01d0 na s\u0254\u0301 m\u025b y\u0254y\u0254\u030c \u0254 d\u00f3.\u2014Kolo.
  3:10, 11.\\nLEE M\u01cf SIXU NY\u0186\u0301 XOM\u0190 D\u00d3 JON\u0186 L\u0190
  WU GB\u0186N \u00c9\\n10, 11. N\u025b\u030c Bowozi ka \u0256\u00f3 linlin e Jehovah
  \u0256\u00f3 d\u00f3 jon\u0254 l\u025b wu \u00e9, \u0256\u00f2 lee \u00e9 w\u00e0
  n\u01d4 x\u00e1 Hwliti M\u0254wabunu \u0254 gb\u0254n \u00e9 m\u025b gb\u0254n?\\n10
  \u00c9 \u0256\u00f2 w\u025bn \u0256\u0254 Bowozi \u0256\u00f3 linlin e Jehovah \u0256\u00f3
  d\u00f3 jon\u0254 l\u025b wu \u00e9, \u0256\u00f2 lee \u00e9 w\u00e0 n\u01d4 x\u00e1
  Hwliti M\u0254wabunu \u0254 gb\u0254n \u00e9 m\u025b. Hwenu e Bowozi w\u00e1 gle
  t\u0254n l\u025b kp\u0254\u0301n gb\u00e9 \u0256\u00f2 n\u01d4k\u00fan-yiya hwenu
  \u00e9 \u0254, \u00e9 \u0256\u2019ayi ny\u0254nu jon\u0254 az\u0254\u030csy\u025bnsy\u025bnwat\u0254\u0301
  \u0256\u00e9 wu, b\u2019\u025b \u0256\u00f2 n\u01d4k\u00fan cyan w\u025b \u0256\u00f2
  f\u00ed e n\u01d4k\u00fan-yat\u0254\u0301 t\u0254n l\u025b ko gb\u0254n d\u00edn
  \u00e9. Ny\u0254nu \u0254 \u0256\u00f3 ac\u025b bo na cyan n\u01d4k\u00fan \u0254
  m\u0254\u030c c\u00f3, ee Bowozi s\u00e8 \u0256\u0254 \u00e9 t\u00f3 by\u0254 gb\u00e8
  hw\u025b\u030c \u00e9 \u0254, \u00e9 ny\u0254\u0301 xom\u025b d\u00f3 w\u01d4 t\u0254n
  bo \u0256\u0254 n\u2019i \u0256\u0254 \u00e9 ni cyan \u0256\u00f2 n\u01d4k\u00fan
  s\u00edn k\u0254 e \u00e8 ko l\u00ed l\u025b \u00e9 m\u025b.\u2014X\u00e0 Hwliti
  2:5-7, 15, 16.\\n11 X\u00f3\u0256\u0254\u0256\u00f3kp\u0254\u0301 e b\u0254 d\u2019ewu
  \u00e9 xl\u025b\u0301 \u0256\u0254 Hwliti kpo nin\u0254m\u025b n\u00f9\u0256\u00e9ma\u0256\u00f3
  t\u0254n e m\u025b \u00e9 \u0256\u00e8, \u0256\u00f3 \u00e9 ny\u00ed jon\u0254 wutu
  \u00e9 kpo \u0256u ayi m\u025b n\u00fa Bowozi nugb\u01d2. Hw\u025bjij\u0254 \u0256okpo
  w\u025b ny\u00ed \u0256\u0254, \u00e9 \u0256\u0254 n\u00fa Hwliti \u0256\u0254 \u00e9
  ni n\u0254 kp\u0254\u0301 kpo ny\u0254nu l\u025b kpo, bonu sunnu e \u0256\u00f2
  az\u0254\u030c w\u00e0 \u0256\u00f2 gle \u0254 m\u025b l\u025b \u00e9 ni ma d\u00f3
  j\u025bngwinj\u025bngwin n\u2019i \u00f3. \u00c9 tl\u025b l\u025b\u0301 bl\u00f3
  b\u0254 Hwliti na m\u0254 n\u00f9\u0256u\u0256u kpo s\u00ecn kpo b\u2019\u025b na
  kp\u00e9 \u00e8, az\u0254\u030cwat\u0254\u0301 e \u00e9 y\u00ed l\u025b \u00e9 \u0256\u0254hun.
  G\u0254\u0301 na \u0254, Bowozi \u0256\u0254 x\u00f3 d\u00f3 \u0256\u00e8 ny\u0254nu
  jon\u0254 wamam\u0254n\u0254 en\u025b kp\u00f2 \u01ce, lo\u0254, \u00e9 d\u00f3
  wusy\u025bn lanm\u025b n\u2019i.\u2014Hwliti 2:8-10, 13, 14.\\n12. \u00d0agbe t\u025b
  xom\u025bny\u00edny\u0254\u0301 m\u01d0t\u0254n ka sixu w\u00e0 n\u00fa jon\u0254
  e gosin t\u00f2 \u0256evo m\u025b l\u025b \u00e9?\\n12 \u00c9 ny\u00ed wanyiyi cej\u025bnnabi
  ma \u0256\u00f3 t\u0254n e Hwliti \u0256\u00f3 n\u00fa as\u00fa t\u0254n n\u0254
  N\u0254em\u00edi \u00e9 k\u025b\u0256\u025b w\u025b jiw\u01d4 n\u00fa Bowozi \u01ce,
  lo\u0254, Jehovah s\u025bnt\u0254\u0301 e \u00e9 huzu \u00e9 l\u0254 jiw\u01d4 n\u2019i.
  Xom\u025bny\u00edny\u0254\u0301 Bowozi t\u0254n \u0254, xom\u025b e Jehovah ny\u0254\u0301
  d\u00f3 ny\u0254nu e w\u00e1 \u2018h\u0254n hwla c\u00ed Mawu Izlay\u025bli t\u0254n
  s\u00edn awa gl\u0254\u2019 \u00e9 \u0256\u00e9 wu \u00e9 s\u00edn xl\u025b\u030c
  w\u025b. (Hwli. 2:12, 20; N\u00f9x. 19:17) \u00d0\u00f2 \u00e9gb\u00e9 \u0256esu
  \u0254, wal\u0254 xom\u025bny\u00edny\u0254\u0301 t\u0254n m\u01d0t\u0254n l\u025b
  sixu d\u2019al\u0254 \u201cgb\u025bt\u0254\u0301 al\u0254kpa l\u025b b\u01d0\u201d
  b\u0254 ye na tu\u00f9n nugb\u01d2 \u0254, bo m\u0254 l\u011b d\u00f2 e Jehovah
  y\u00ed w\u01cen n\u00fa ye s\u0254\u0301 \u00e9.\u20141 Tim. 2:3, 4, NWT.\\n13,
  14. (a) Et\u025bwu m\u01d0 ka \u0256\u00f3 na n\u0254 d\u00f3 g\u01cen bo d\u00f3
  gb\u00e8 jon\u0254 l\u025b \u0256\u00f2 Kpl\u00e9x\u0254 Ax\u0254su\u0256uto \u0254
  T\u0254n m\u025b? (b) Enyi jon\u0254 l\u025b sis\u025bkp\u0254 n\u0254 v\u025bw\u01d4
  n\u00fa we \u0254, n\u025b\u030c a ka sixu \u0256u \u0256\u2019eji gb\u0254n?\\n13
  M\u01d0 sixu \u0256\u00e8 xom\u025bny\u00edny\u0254\u0301 xl\u025b\u0301 m\u025b
  y\u0254y\u0254\u030c e gosin ay\u01d0 \u0256evo j\u00ed l\u025b \u00e9 gb\u0254n
  gb\u00e8 did\u00f3 ye \u0256\u00f2 Kpl\u00e9x\u0254 Ax\u0254su\u0256uto \u0254 T\u0254n
  m\u025b kpo wanyiyi kpo gblam\u025b. M\u01d0 sixu ko \u0256\u2019ayi wu \u0256\u0254
  jon\u0254 l\u025b n\u0254 k\u00fa winnya hwe\u0256el\u025bnu bo n\u0254 s\u025b\u0300
  ye\u0256\u00e9e xw\u00e8. Kpl\u0254\u0301n e ye y\u00ed \u00e9 al\u01d2 nin\u0254m\u025b
  yet\u0254n sixu z\u0254\u0301n b\u0254 ye na m\u0254 \u0256\u0254 emi k\u00fan ny\u00ed
  n\u01d4t\u00ed \u0256\u00f2 ak\u0254 \u0256evo l\u025b al\u01d2 to\u0256evom\u025bnu
  l\u025b kp\u00e1 \u00f3. En\u025b wu \u0254, m\u01d0 \u0256\u00f3 na \u0256\u00e8
  af\u0254 nuk\u0254nt\u0254n \u0254 bo xl\u025b\u0301 ye \u0256\u0254 m\u01d0 n\u0254
  keya n\u00fa ye nugb\u01d2 nugb\u01d2. Enyi JW Language \u0256\u00f2 gb\u00e8 towe
  m\u025b \u0254, \u00e9 sixu d\u2019al\u0254 we b\u0254 a na kpl\u0254\u0301n lee
  a na d\u00f3 gb\u00e8 jon\u0254 l\u025b gb\u0254n d\u00f3 an\u0254nugbe yet\u0254n
  m\u025b \u00e9.\u2014X\u00e0 Filipunu l\u025b 2:3, 4.\\n14 Jon\u0254 l\u025b sis\u025bkp\u0254
