  w\u00e9ma m\u025b \u0256o w\u00e9max\u0254m\u025b sins\u025bnnuwiwa t\u0254n Abidjan
  t\u0254n lo bo w''az\u0254 nu \u0256y\u0254\u0256y\u0254 w\u00e9max\u0254m\u025b
  \u0254 t\u0254n b''\u025b huzu Wemax\u0254m\u025b Igl\u00e9ja Katolika hw\u00e9yix\u0254waj\u00ed
