  (Ebl. 13:2) En\u025b wu \u0254, mi n\u00fa m\u01d0 ni gb\u00e9j\u00e9 n\u00f9kanby\u0254
  el\u0254 l\u025b kp\u0254\u0301n: Linlin t\u025b Jehovah ka \u0256\u00f3 d\u00f3
  jon\u0254 l\u025b wu? Et\u025bwu \u00e9 ka sixu by\u0254 \u0256\u0254 m\u01d0 ni
  \u0256y\u0254 linlin e m\u01d0 n\u0254 \u0256\u00f3 d\u00f3 jon\u0254 l\u025b wu
  \u00e9? N\u025b\u030c m\u01d0 ka sixu d\u2019al\u0254 m\u025b e gosin t\u00f2 \u0256evo
  m\u025b l\u025b \u00e9 b\u0254 ye na vo \u0256\u00f2 agun \u0254 m\u025b gb\u0254n?\\nLINLIN
  E JEHOVAH \u00d0\u00d3 D\u00d3 JON\u0186 L\u0190 WU \u00c9\\n3, 4. S\u0254gbe kpo
  T\u00ednt\u0254\u0301n 23:9 kpo \u0254, n\u025b\u030c togun Mawu t\u0254n hwex\u00f3nu
