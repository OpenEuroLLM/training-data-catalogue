  s\u0254\u0301 m\u025b kpo \u0256\u00f2 Kpl\u00e9x\u0254 Ax\u0254su\u0256uto \u0254
  T\u0254n m\u025b, ma keya n\u00fa t\u00f2 e m\u025b a gosin \u00e9 al\u01d2 sinm\u025b
  e agbaza towe \u0256\u00f3 \u00e9 \u0254, \u00e9 na s\u00f9 nuk\u00fan towe m\u025b
