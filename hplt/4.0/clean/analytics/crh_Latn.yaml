sample: '["\"JOLDAWDI QOLDAW MEMLEKETT\u0130K QIZMETKERLERD\u0130\u00d1 DE M\u0130NDET\u0130\\nPrez\u00efdentti\u00f1
  j\u0131l sa\u00fd\u0131n\u011f\u0131 Joldaw\u0131n xal\u0131q ta\u011fats\u0131zdana
  k\u00fctedi. 1992 j\u0131ldan beri joldan\u0131p kele jatqan bul jol\u011f\u0131s\u0131
  16-Joldaw bold\u0131. 2012 j\u0131l\u011f\u0131 Joldawda \u00e4lewmettik-\u00e9konom\u00efkal\u0131q
  ja\u011fda\u00fd negizge al\u0131n\u0131p, 10 ba\u011f\u0131tta jasald\u0131. Kele\u015fektegi
  is-\u00e4reket tayap kele jatqan da\u011fdar\u0131st\u0131 negizge ala ot\u0131r\u0131p
  jasal\u011fan\u0131 ba\u00fdqald\u0131. Sond\u0131qtan bul jol\u0131 memlekettik
  q\u0131zmetkerlerdi\u00f1 jalaq\u0131s\u0131n, ze\u00fdnetkerlerdi\u00f1 ze\u00fdnetaq\u0131s\u0131n
  k\u00f6terw twral\u0131 s\u00f6z bolmad\u0131. Bul keze\u00f1de memlekettik q\u0131zmetkerlerdi\u00f1
  \u00f6z q\u0131zmetin jawapker\u015filikpen or\u0131ndaw\u0131 kerek ekeni a\u00fdt\u0131ld\u0131.
  Sond\u0131qtan Joldawda\u011f\u0131 4-ba\u011f\u0131tt\u0131: \u00abTur\u011f\u0131ndar\u011fa
  memlekettik q\u0131zmet k\u00f6rsetwdi\u00f1 sapas\u0131n artt\u0131rw\u00bb dep
  atasa, 5-ba\u011f\u0131tta: \u00abArnawl\u0131 kom\u00efss\u00efya kand\u00efdatwralard\u0131
  bilimi men k\u00e4sib\u00efligi, jo\u011far\u0131 morald\u0131q s\u00efpat\u0131,
  bastama\u015f\u0131ld\u0131\u011f\u0131 men taps\u0131r\u0131l\u011fan w\u00e7askedegi
  jum\u0131s\u0131n\u0131\u00f1 tab\u0131st\u0131l\u0131\u011f\u0131 \u00f6l\u015femderi
  bo\u00fd\u0131n\u015fa irikte\u00fddi\u00bb dep atap \u00f6tildi. Bul \u2013 xal\u0131qt\u0131\u00f1
  senimine \u00efe bolma\u011fan memlekettik q\u0131zmetkerler jum\u0131s iste\u00fd
  alma\u00fdd\u0131 degendi me\u00f1ze\u00fddi. Sebebi, memlekettik q\u0131zmetkerlerdi\u00f1
  jum\u0131s\u0131 memleketti\u00f1 bedelin ne \u00f6siredi, ne t\u00fcsiredi.\\nQa\u00fd
  elge barsa\u00f1 da, kedennen kirgennen \u015f\u0131qqan\u015fa memlekettik q\u0131zmetpen
  jol\u0131\u00f1 t\u00fc\u00fdisedi. Memleketti\u00f1 adamdar\u011fa degen k\u00f6zqaras\u0131
  kedeninen kirgennen \u015f\u0131qqan\u015fa adam\u011fa degen ilt\u00efpat\u0131nan,
  sol eldi\u00f1 adam\u011fa degen q\u0131zmetinen k\u00f6rinedi. Egerde memlekettik
  q\u0131zmetkerler \u00f6z jum\u0131star\u0131n adal, \u00e4diletti, d\u00e4\u00fdekti,
  sapal\u0131 or\u0131ndasa memleketke degen k\u00f6zqaras ta dur\u0131s qal\u0131ptasad\u0131.
  Al eger memlekettik q\u0131zmetkerler jum\u0131s\u0131n t\u00efyanaqs\u0131z, \u00e4diletsiz,
  sapas\u0131z or\u0131ndap, bir qujat berw \u00fc\u015fin para al\u011f\u0131s\u0131
  kelip alaqandar\u0131 q\u0131\u015f\u0131p tursa memleket paraqor, jemqor retinde
  tan\u0131lad\u0131. Tek \u015feteldikterge \u011fana emes, \u00f6z xalq\u0131na
  atqar\u011fan jum\u0131star da adal, \u00e4diletti, sapal\u0131 bolw\u0131 kerek.
  Sond\u0131qtan memlekettik q\u0131zmetkerlerdi\u00f1 jum\u0131s\u0131, is-\u00e4reketi
  \u2013 memleket q\u0131zmetini\u00f1 a\u00fdnas\u0131 bol\u0131p tab\u0131lad\u0131.\\nOs\u0131\u011fan
  ba\u00fdlan\u0131st\u0131, QR Prez\u00efdentini\u00f1 2010 j\u0131l\u011f\u0131
  19-nawr\u0131zda\u011f\u0131 \u2116954 Jarl\u0131\u011f\u0131na s\u00e4\u00fdkes,
  2011 j\u0131ldan bastap \u00abOrtal\u0131q memlekettik organdar men obl\u0131stard\u0131\u00f1,
  respwbl\u00efkal\u0131q ma\u00f1\u0131z\u0131 bar qalan\u0131\u00f1, astanan\u0131\u00f1
  jergilikti atqarw\u015f\u0131 organdar\u0131 q\u0131zmetini\u00f1 t\u00efimdiligin
  j\u0131l sa\u00fd\u0131n\u011f\u0131 ba\u011falaw j\u00fc\u00fdesi\u00bb engizildi.
  Bun\u0131\u00f1 maqsat\u0131 \u2013 memlekettik q\u0131zmetkerlerdi\u00f1 jum\u0131s\u0131n\u0131\u00f1
  t\u00efimdiligin ba\u011falaw. Os\u0131 arq\u0131l\u0131 memlekettik organ q\u0131zmetini\u00f1
  damw \u00f6l\u015femderine \u00e4ser etw d\u00e4rejesi a\u00fdq\u0131ndal\u0131p,
  on\u0131\u00f1 u\u00fd\u0131mdast\u0131rw j\u00fc\u00fdesi ba\u011falanad\u0131.
  Memlekettik organ q\u0131zmetini\u00f1 t\u00efimdiligin ba\u011falawda: \u00e4dildik,
  d\u00e4\u00fdektilik, a\u015f\u0131qt\u0131q, jar\u00efyal\u0131l\u0131q qa\u011f\u00efdat\u0131
  ustal\u0131nbaq. Egerde os\u0131 qa\u011f\u00efdattar j\u00fczege aspasa memlekettik
  q\u0131zmetkerlerdi\u00f1 jum\u0131s\u0131n ba\u011falaw obekt\u00efvti bolma\u00fdd\u0131.
  Al t\u00efimdilik k\u00f6rsetki\u015fteri retinde: \u00e4dildik, d\u00e4\u00fdektilik,
  a\u015f\u0131qt\u0131q, \u00fcnemdilik, sal\u0131st\u0131rmal\u0131l\u0131q, tol\u0131qt\u0131q
  talaptar\u0131 qo\u00fd\u0131lmaq. Bun\u0131\u00f1 b\u00e4ri sapal\u0131 or\u0131ndalw\u0131
  kerek. Sapas\u0131z isti\u00f1 t\u00fcp n\u00e4t\u00efjesi bolma\u00fdd\u0131. Sond\u0131qtan
  sapan\u0131 ba\u011falawd\u0131\u00f1 k\u00f6rsetki\u015fine:\\nbelgilengen waq\u0131t\u0131nda
  tol\u0131qta\u00fd or\u0131ndalw\u0131 al\u0131n\u0131p ot\u0131r. \u00c4r\u00efne,
  tol\u0131q, \u00e4ri waqt\u0131l\u0131 or\u0131ndalmasa jum\u0131st\u0131 sapal\u0131
  dewge bolma\u00fdd\u0131. Bular memlekettik jum\u0131st\u0131\u00f1 jalp\u0131lama
  k\u00f6rsetki\u015fi bolad\u0131.\\nKez-kelgen memlekette jeke j\u00e4ne za\u00f1d\u0131
  tul\u011falar bar. Adamdar\u011fa degen k\u00f6zqaras, jum\u0131s istew d\u00e4rejesi
  os\u0131 tul\u011falar\u011fa q\u0131zmet k\u00f6rsetwden a\u00fdq\u0131ndalad\u0131.
  Jeke j\u00e4ne za\u00f1d\u0131 tul\u011falar memlekettik q\u0131zmetkerlerdi\u00f1
  jum\u0131s\u0131n\u0131\u00f1 sapas\u0131na qana\u011fattana ma, taps\u0131r\u0131s\u0131
  waq\u0131t\u0131l\u0131 or\u0131ndala ma, q\u0131zmet k\u00f6rsetwdi\u00f1 qoljetimdiligi
  qanda\u00fd, \u015fa\u011f\u0131mdard\u0131 qaraw men qana\u011fattand\u0131rw \u00fcrdisi
  qa\u00fd de\u00f1ge\u00fdde \u015fe\u015filedi, memlekettik q\u0131zmetkerdi\u00f1
  \u00f6z jum\u0131s\u0131n atqar\u011fand\u0131\u011f\u0131 \u00e4deptiligi men \u0131q\u0131l\u0131s-n\u00efeti
  qanda\u00fd, \u00e9lektrond\u0131q formatta q\u0131zmet k\u00f6rsetw de\u00f1ge\u00fdi
  qanda\u00fd, os\u0131n\u0131\u00f1 b\u00e4ri memlekettik q\u0131zmetti\u00f1 k\u00f6rsetki\u015fi
  bol\u0131p tab\u0131lad\u0131.\\nMemlekettik q\u0131zmette iste\u00fdtinder buqara
  xal\u0131qpen kezdeswden qorqat\u0131n s\u00efyaqt\u0131. \u00c4sirese, \u00e4kim\u015filik
  q\u0131zmettegiler xal\u0131qpen kezdespewge t\u0131r\u0131sad\u0131. M\u0131sal\u0131,
  qalan\u0131\u00f1 awdand\u0131q \u00c4kimine jol\u0131\u011fw \u00fc\u015fin ald\u0131n-ala
  jaz\u0131lw kerek. Al, jazat\u0131n adam ne\u015fe t\u00fcrli s\u0131ltaw a\u00fdt\u0131p
  \u00c4kimge\\nkirgizbewge t\u0131r\u0131sad\u0131. Ana suraqpen ana or\u0131nbasar\u011fa,
  m\u0131na suraqpen m\u0131na or\u0131nbasar\u011fa bar\u0131\u00f1\u0131z dep siltep
  jiberedi. Ol or\u0131nbasarlard\u0131\u00f1 da buqara xal\u0131qt\u0131 a\u00fdd\u0131\u00f1
  qa\u00fd k\u00fcni, qa\u00fd sa\u011fatta qab\u0131lda\u00fdt\u0131n waq\u0131t\u0131
  jaz\u0131l\u011fan. Biraq sol waq\u0131tta barsa\u00f1, k\u00f6binese or\u0131nbasar
  ne \u00abj\u00efnal\u0131sta\u00bb bolad\u0131, ne \u00abaw\u0131r\u0131p\u00bb
  qalad\u0131, t.b. s\u0131ltaw \u015f\u0131\u011f\u0131p xal\u0131qt\u0131 qab\u0131ldama\u00fdd\u0131.
  S\u00f6\u00fdtip, kelesi kezdesw kelesi a\u00fd\u011fa qalad\u0131. Kelesi a\u00fdda
  qanda\u00fd s\u0131ltawmen qab\u0131ldama\u00fdt\u0131n\u0131n \u00e4kimni\u00f1
  \u00f6zi biledi. Bunda\u00fd \u00e4reketter m\u00efn\u00efstrlikti\u00f1 de, agenttikti\u00f1
  de, departamenttikti\u00f1 de q\u0131zmetkerlerinen kezdesedi. Xal\u0131qpen kezdespewdi\u00f1
  s\u0131ltaw\u0131n izdep turad\u0131. Bul \u2013 memlekettik q\u0131zmetkerlerdi\u00f1
  xal\u0131qqa q\u0131zmet k\u00f6rsetwdi\u00f1 qoljetimdiligi men sapas\u0131n\u0131\u00f1
  t\u00f6mendigin k\u00f6rsetedi. Sond\u0131qtan xal\u0131qpen kezdesw waq\u0131t\u0131nda
  memlekettik q\u0131zmetkerlerdi\u00f1 orn\u0131nda bolw\u0131n, qab\u0131ldaw\u0131n
  qada\u011falaw kerek. Memlekettik q\u0131zmetkerlerdi\u00f1 xal\u0131qpen kezdeswden
  qor\u0131qpa\u011fan\u0131 abzal.\\nQazirgi waq\u0131tta Xal\u0131qqa q\u0131zmet
  k\u00f6rsetw ortal\u0131qtar\u0131 (XQKO) a\u015f\u0131ld\u0131. Bul twral\u0131
  da Prez\u00efdent \u00f6z Joldaw\u0131nda a\u00fdt\u0131p \u00f6tti. On\u0131\u00f1
  jum\u0131s atqarw ayas\u0131n ke\u00f1e\u00fdtw kerek ekeni nazar\u011fa sal\u0131nd\u0131.
  M\u0131sal\u0131, Almat\u0131da\u011f\u0131 bul mekemeler qazir 135 memlekettik
  q\u0131zmet t\u00fcrlerin k\u00f6rsetedi. Bun\u0131\u00f1 a\u015f\u0131lw\u0131
  xal\u0131q \u00fc\u015fin pa\u00fddal\u0131 bold\u0131. Bur\u0131n\u011f\u0131da\u00fd
  \u00e4r qujat \u00fc\u015fin, \u00e4r mekemege j\u00fcgirip j\u00fcrme\u00fddi.
  Kele\u015fekte XQKO-n\u0131 \u00e4rbir aw\u0131lda a\u015fw\u011fa t\u0131r\u0131sw
  kerek. Sebebi, aw\u0131lda\u011f\u0131lar bir qujat alw \u00fc\u015fin 200-300 \u015faq\u0131r\u0131m
  al\u0131sta\u011f\u0131 awdan\u011fa j\u00fcgirwge m\u00e4jb\u00fcr bol\u0131p jatad\u0131.
  Bul \u2013 keminde bir, ke\u00fdde eki k\u00fcndi alad\u0131. XQKO \u00e4rbir aw\u0131lda
  a\u015f\u0131lsa xal\u0131qt\u0131\u00f1 \u00e4ri waq\u0131t\u0131, \u00e4ri qarj\u0131s\u0131
  \u00fcnemdeler edi.\\nXQKO-n\u0131\u00f1 a\u015f\u0131lw\u0131 memleketti\u00f1
  xal\u0131qqa degen tab\u0131st\u0131 qamqorl\u0131\u011f\u0131 dewge bolad\u0131.
  Son\u0131men birge bul u\u00fd\u0131m memleketti\u00f1 xal\u0131qqa q\u0131zmet
  k\u00f6rsetwini\u00f1 a\u00fdnas\u0131 bol\u0131p, xal\u0131qt\u0131\u00f1 memleketke
  degen k\u00f6zqaras\u0131n a\u00fdq\u0131nda\u00fdd\u0131. XQKO-lar jaqs\u0131 jum\u0131s
  istep, eldi\u00f1 isin d\u00e4l merziminde, t\u00efyanaqt\u0131 atqar\u0131p berse
  \u00abmemleket xal\u0131q \u00fc\u015fin jaqs\u0131 jum\u0131s istep jat\u0131r\u00bb\\ndep,
  jaman bolsa \u00abmemleket xal\u0131q \u00fc\u015fin dur\u0131s jum\u0131s isteme\u00fddi\u00bb
  dep ba\u011fala\u00fdd\u0131. Sond\u0131qtan XQKO-n\u0131\u00f1 jum\u0131s\u0131n
  jaqsartw\u011fa t\u0131r\u0131sqan dur\u0131s. Ke\u00fd kezderde \u00abqujattar\u0131\u00f1\u0131z
  tol\u0131q eken\u00bb dep qab\u0131lda\u00fdd\u0131 da, kelesi k\u00fcni \u00abta\u011f\u0131
  m\u0131na qujattar\u0131\u00f1\u0131z jetispe\u00fddi\u00bb dep qa\u00fdtar\u0131p
  jiberedi. Birden qanda\u00fd qujattar kerek ekenin a\u00fdta alma\u00fd qalad\u0131.
  Os\u0131nda\u00fd ja\u011fda\u00fdlarda xal\u0131q renjip jatad\u0131. Sebebi, \u00e4rkimde
  art\u0131q j\u00fcrwge waq\u0131t tab\u0131la berme\u00fddi. Sonda\u00fd-aq, da\u00fd\u0131n
  qujatt\u0131 alarda da terezeni\u00f1 ald\u0131nda Ke\u00f1es kezinde\u00fd kezek
  j\u00efnal\u0131p qalad\u0131. Bul da keri \u00e4ser etedi. Bun\u0131\u00f1 b\u00e4ri,
  birin\u015fiden, 2005 j\u0131l\u0131 a\u015f\u0131l\u011fan XQKO-n\u0131\u00f1 \u00e4li
  jas u\u00fd\u0131m bol\u011fand\u0131\u011f\u0131nan bolsa, ekin\u015fiden, bul
  u\u00fd\u0131mn\u0131\u00f1 q\u0131zmetkerlerini\u00f1 isti tol\u0131q me\u00f1gere
  alma\u00fd jatqand\u0131\u011f\u0131nan bolar. Sebebi, XQKO-da jum\u0131s istep
  j\u00fcrgender bur\u0131n\u011f\u0131 \u00e4r t\u00fcrli mamand\u0131q \u00efeleri.
  Olard\u0131\u00f1 i\u015finde bur\u0131n\u011f\u0131 \u00efnjenerler de, texnologtar
  da, t.b. mamand\u0131q \u00efeleri bar. Olard\u0131\u00f1 ke\u00fdbiri xal\u0131qpen
  jum\u0131s istew \u00e9t\u00efkas\u0131n bilme\u00fddi. XQKO-da jum\u0131s iste\u00fdtin
  mamandard\u0131 da\u00fd\u0131nda\u00fdt\u0131n oqw or\u0131ndar\u0131 joq. Jemqorl\u0131qt\u0131\u00f1
  aya\u011f\u0131na tusaw salat\u0131n bul mekeme xal\u0131qqa da, memleketke de pa\u00fddal\u0131
  bol\u011fand\u0131qtan kele\u015fegi zor. Sond\u0131qtan kele\u015fekte, e\u00f1
  bolma\u011fanda kolledjderde Xal\u0131qqa q\u0131zmet k\u00f6rsetw ortal\u0131\u011f\u0131nda
  jum\u0131s iste\u00fdtin mamandar da\u00fd\u0131nda\u00fdt\u0131n oqw orn\u0131n
  a\u015fw kerek.\\nQazir \u2013 kompyuter zaman\u0131. Aw\u0131lda ot\u0131r\u0131p
  awdan, obl\u0131stardan \u00e9lektrond\u0131q quraldarmen aqparatt\u0131 tez alw\u011fa
  bolad\u0131. \u00c4ri qazir \u00ab\u00e9lektrond\u0131q qolta\u00f1ba\u00bb engizilip
  jat\u0131r. Bul \u2013 xal\u0131qt\u0131\u00f1 \u00fc\u00fdde ot\u0131r\u0131p aqparat
  alw\u011fa, waq\u0131t\u0131n \u00fcnemdewge septigin t\u00efgizedi. Sond\u0131qtan,
  XQKO-larda \u00e9lektrond\u0131q formatta jum\u0131s istewdi dam\u0131tw kerek.
  Bul twral\u0131 da Joldawda eskertildi.\\nXQKO-n\u0131\u00f1 jum\u0131s\u0131n\u0131\u00f1
  sapas\u0131 tek \u00f6zderine \u011fana ba\u00fdlan\u0131st\u0131 emes. Ol \u2013
  aqparat beretin bazal\u0131q mekemege de ba\u00fdlan\u0131st\u0131. Bazal\u0131q
  mekemeler XQKO-n\u0131\u00f1 suratqan qujattar\u0131n d\u00e4l waq\u0131t\u0131nda
  berwi kerek. Bazal\u0131q mekemelerdi\u00f1 ke\u015fiktirwinen xal\u0131qt\u0131\u00f1
  \u015farwas\u0131 waq\u0131t\u0131nda bitpe\u00fd reni\u015f twd\u0131r\u0131p jatad\u0131.
  Xal\u0131q, qujat\u0131n taps\u0131r\u011fan XQKO-n\u0131\u00f1 q\u0131zmetkerlerin
  \u011fana biletindikten reni\u015fterin solar\u011fa a\u00fdt\u0131p jatad\u0131.
  Eki ortada XQKO q\u0131zmetkerleri s\u00f6z est\u00efdi. Sond\u0131qtan, aqparat
  beretin bazal\u0131q mekemelerdi\u00f1 jawapker\u015filigin artt\u0131rw kerek.\\nJoldawda\u011f\u0131
  a\u00fdt\u0131l\u011fandard\u0131 jedel or\u0131ndaw \u00fc\u015fin, Prez\u00efdent
  sol k\u00fcni t\u00fcsten ke\u00fdin \u00dckimet m\u00fc\u015feleri, \u00e4kimder,
  ortal\u0131q memlekettik organdar, \u00abNur Otan\u00bb XDP j\u00e4ne \u00abSamur\u0131q-Qaz\u0131na\u00bb
  U\u00c4Q bas\u015f\u0131lar\u0131 qat\u0131sqan ke\u00f1e\u00fdtilgen ot\u0131r\u0131s
  \u00f6tkizip, \u00e4rqa\u00fds\u0131s\u0131na naqt\u0131, t\u00efyanaqt\u0131 taps\u0131rma
  berdi. \u00c4ri \u00f6tken j\u0131ldarda\u011f\u0131 ketken kem\u015filikter jas\u0131r\u0131lma\u00fd
  a\u015f\u0131q a\u00fdt\u0131ld\u0131.\\nBizde k\u00f6binese taps\u0131rma beriledi,
  qarj\u0131 b\u00f6linedi. Biraq olard\u0131\u00f1 baq\u0131law\u0131, qada\u011falanw\u0131
  jetispe\u00fddi. Jo\u011far\u0131dan berilgen taps\u0131rman\u0131\u00f1, qarj\u0131n\u0131\u00f1
  qa\u00fdda ketkeni belgisiz bol\u0131p qalad\u0131. Sa\u00fdda san\u0131, qumda
  izi bilinbe\u00fd ketedi. Os\u0131dan bar\u0131p jemqorlar o\u00fdlar\u0131na kelgenin
  istep, qarj\u0131n\u0131 j\u0131mq\u0131rad\u0131. Sond\u0131qtan, bitken \u00e4r
  jum\u0131sqa mindetti t\u00fcrde balld\u0131q j\u00fc\u00fdemen ba\u011fa berilip
  ot\u0131rw\u0131 kerek. \u0130stelgen jum\u0131st\u0131\u00f1 stat\u00efst\u00efkal\u0131q
  esebin toqsan sa\u00fd\u0131n al\u0131p ot\u0131r\u011fan dur\u0131s bolar edi.\\nKele\u015fekte
  memlekettik organdard\u0131\u00f1 jum\u0131s\u0131n ba\u011falawda qo\u011famd\u0131q
  u\u00fd\u0131mdard\u0131\u00f1, t\u00e4welsiz sarap\u015f\u0131lard\u0131\u00f1,
  \u00e4r t\u00fcrli part\u00efyalard\u0131\u00f1 o\u00fd\u0131n da eskerip ba\u011falasa
  obekt\u00efvti bolar edi. Tek qana \u00f6zinen jo\u011far\u0131 tur\u011fan memlekettik
  mekemeni\u00f1 ba\u011falaw\u0131 \u015f\u0131nd\u0131qqa janaspaw\u0131 m\u00fcmkin.
  Qo\u011famd\u0131q u\u00fd\u0131mdard\u0131\u00f1 ba\u011falaw\u0131nan qor\u0131qpaw
  kerek.\\nNazraxmet QAL\u00cf,\\nAlmat\u0131 qalas\u0131.\\n2013 j\u0131l.\"", "\"\u015eavurma
