  tarqatqan edi. \u015eu sebepten Ba\u011f\u00e7asaraydaki sarayn\u0131\u00f1 restavratsiyas\u0131nen
  ba\u011fl\u0131 do\u011fru mal\u00fcmat bermege t\u0131r\u0131\u015ft\u0131q\u00bb,
  \u2013 dep bildirdi Georgiy Muradov. Memur, Ukrainan\u0131\u00f1 UNESCO i\u015fleri
