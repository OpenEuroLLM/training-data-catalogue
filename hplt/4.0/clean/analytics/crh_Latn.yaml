  k\u00fc\u015feyuine septigin tigizdi.\\nQ\u0131r\u0131m elini\u00f1 keyingi so\u011f\u0131starda
  or\u0131star\u011fa \u00f6tip ketuine de os\u0131 sep bol\u011fan. Bwr\u0131n t\u00fcrikterge
  Q\u0131r\u0131m tatarlar\u0131 arq\u0131l\u0131 k\u00f6mek keletin bol\u011fan.
  Bwl so\u011f\u0131stan keyin ol k\u00f6mek toqtap qalad\u0131. Armiyan\u0131\u00f1
  o\u00f1 qanat\u0131 ketip qal\u011fan so\u00f1, imperiya sol qanat\u0131men j\u00e4ne
  orta k\u00fc\u015fterimen \u011fana j\u00fcretin bol\u011fan.\\nTa\u011f\u0131 bir
  sebep, pat\u015falard\u0131\u00f1 bala k\u00fcyinde taqqa ot\u0131ru\u0131, bilikti
  analar\u0131n\u0131\u00f1 qol\u0131na alu\u0131 imperiyan\u0131\u00f1 \u00e4lsireuine
  al\u0131p keldi.\\n\u00c4ri os\u0131 j\u0131ldar\u0131 \u0130 Petr men Slavyan tektes
  hal\u0131qtar aras\u0131nda \u00abPanslavizm\u00bb a\u011f\u0131m\u0131 k\u00fc\u015feye
  bastad\u0131. Wlt\u015f\u0131ld\u0131q \u00e4sirese Balqan elderini\u00f1 aras\u0131nda
  w\u015f\u0131qt\u0131. T\u00fcrikter \u00abPanslavizmge\u00bb qars\u0131 \u00abPant\u00fcrkizmdi\u00bb
  ara\u011fa eki \u011fas\u0131r sal\u0131p twr\u0131p 19-\u011fas\u0131rd\u0131\u00f1
  aya\u011f\u0131nda qoldana bastad\u0131. Al\u011fa\u015f ret sayasi twl\u011fa retinde
  Anuar pa\u015fan\u0131\u00f1 \u00abPant\u00fcrkistik\u00bb qoz\u011fal\u0131s\u0131
  birin\u015fi d\u00fcniej\u00fczilik so\u011f\u0131stan keyin iske asqan, biraq n\u00e4tijesi
  Anuar pa\u015fan\u0131\u00f1 T\u00e4jikstanda or\u0131s armiyas\u0131men \u015fayqas\u0131nda
  \u00f6ltirilumen bitedi. Negizinen sonau 18-\u011fas\u0131rda Orta Aziya t\u00fcrki
  elderimen t\u0131\u011f\u0131z baylan\u0131s ornatqanda, m\u00e4sele m\u00fcldem
  basqa arna\u011fa bwr\u0131lu\u0131 m\u00fcmkin edi. Sond\u0131qtan b\u00fcgingi
  ayt\u0131l\u0131p jatqan \u00abPant\u00fcrkizm\u00bb negizi sonau 18-\u011fas\u0131rda
  \u0130 Petr men basta\u011fan \u00abPanslavizmge\u00bb qars\u0131 \u015f\u0131qqan
  a\u011f\u0131m.\\n\u00c4sirese, XVIII \u011fas\u0131rd\u0131\u00f1 aya\u011f\u0131
  men XIX \u011fas\u0131rd\u0131\u00f1 bas\u0131nda t\u00fcrikti\u00f1 swltandar\u0131
  Bat\u0131sta, europa\u015f\u0131l wstazdard\u0131\u00f1 t\u00e4rbiesinde bilim ala
  bastayd\u0131. Francuz m\u00e4denieti, francuz bilimi pat\u015falard\u0131\u00f1
  ermegine aynalad\u0131.\\nBat\u0131s\u015f\u0131l k\u00f6zqarasta\u011f\u0131 pat\u015falar
  memleket bas\u0131na keldi. Pat\u015fal\u0131q qana emes, aqs\u00fcyekterdi\u00f1
  balalar\u0131 da \u015fet elde bilim ala bastayd\u0131. Europan\u0131\u00f1 jasampaz
  reformalar\u0131n\u0131\u00f1 \u00f6zini\u00f1 jemisin bergen keze\u00f1i. 1789-99
  j\u0131ldar\u0131 aral\u0131\u011f\u0131nda\u011f\u0131 Francuz monarhiyas\u0131
  qwlat\u0131l\u0131p, orn\u0131na respublikal\u0131q ja\u00f1a memleket ornatu \u015f\u00fcb\u00e4siz
  \u00e4lemdegi b\u00fctkil monarhiyal\u0131q basqaru j\u00fcyelerini\u00f1 ta\u011f\u0131n
  orn\u0131nan qoz\u011faltt\u0131. Sol j\u0131ldar\u0131 \u00abBizde nege basqa\u015fa?
  Bizde nege erkindik joq?\u00bb degen \u00e4\u00f1gimeler tua bastad\u0131. Pat\u015fal\u0131q
  bilik el i\u015findegi \u00e4rt\u00fcrli reformalar\u011fa qars\u0131 k\u00fcrese
  almay qald\u0131. \u00d6ytkeni imperiyan\u0131\u00f1 biligi \u00e4lsirey basta\u011fan
  kez edi bwl.\\nBwr\u0131n el i\u015finde e\u015fqanday jau joq edi. Jaud\u0131\u00f1
  b\u00e4ri s\u0131rttan keletin. Endi jau saray i\u015finde payda bola bastad\u0131.
  Bwl 1800 j\u0131ldar bolat\u0131n. Os\u0131 keze\u00f1de t\u00fcrikter al\u011fa\u015f
  ret gazet \u015f\u0131\u011fara bastayd\u0131 /Taqvimi uaqaie 1831j./. Eldegi \u00f6zge
  wlt \u00f6kilderine, sonday-aq \u015fet elderde bilim al\u0131p kelgen jastar\u011fa,
  aq\u0131n-jazu\u015f\u0131lar\u011fa tol\u0131q bolmasa da, \u015fekteuli erkindik
  bere bastayd\u0131. Bwl keze\u00f1 \u00abtanzimat\u00bb keze\u00f1i dep atalad\u0131.
  Tanzimat t\u00fcrikti\u00f1 Bat\u0131st\u0131\u00f1 m\u00e4denietin moy\u0131nda\u011fan
  al\u011fa\u015fq\u0131 keze\u00f1i bol\u0131p sanalad\u0131. Resmi t\u00fcrde. Bwl
  kezderde taqta Abdulmajit swltan pat\u015fal\u0131q etken keze\u00f1. Keyin os\u0131
  gazetten basqa, p''esalar, romandar \u015f\u0131\u011fa bastayd\u0131. Os\u0131lard\u0131\u00f1
  biraz\u0131 s\u0131ni sar\u0131nda bolad\u0131. Bwlard\u0131\u00f1 b\u00e4rin pat\u015fa
  toqtata almay qalad\u0131. \u00d6ytkeni bwl jazbalarda bireuler t\u00fcrik\u015fildikti\u00f1
  tu\u0131n k\u00f6teretin bolsa, endi bireuler wlt\u015f\u0131ld\u0131qt\u0131\u00f1
  /\u00f6zge wlt \u00f6kilderini\u00f1/ tu\u0131n k\u00f6teredi. Os\u0131lay\u015fa,
  eldi\u00f1 aras\u0131nda alau\u0131zd\u0131q payda bolad\u0131. S\u00f6ytip, pat\u015fa
  olar\u011fa ielik ete almay qalad\u0131. Os\u0131 keze\u00f1derde imperiya qan\u015fama
  qinalsa da, bireuin elden al\u0131statu arq\u0131l\u0131, bireuine ja\u011fday jasau
  arq\u0131l\u0131 eldegi \u00f6zgeristerdi qal\u0131pqa keltiruge t\u0131r\u0131sad\u0131.\\nAq\u0131r\u0131
  i\u015ftegi j\u00e4ne s\u0131rtta\u011f\u0131 qars\u0131l\u0131qtar 1876 j\u0131l\u0131
  Osman imperiyas\u0131nda \u00fclken \u00f6zgeris al\u0131p keledi. Sultan Abdulazizdi
  jaular\u0131 twn\u015f\u0131qt\u0131r\u0131p \u00f6ltirgennen keyin, neb\u00e4ri
  t\u00f6rt-bes ay taqqa j\u0131nd\u0131 5-\u015fi Mwrat ot\u0131rad\u0131. Bwl pat\u015famen
  aylalar\u0131n iske as\u0131ra alma\u011fan sarayl\u0131qtar Bat\u0131st\u0131\u00f1
  j\u00e4ne ziyal\u0131 qau\u0131mn\u0131\u00f1 qoldau\u0131men monarhiyal\u0131q
  respublika qwru \u015fart\u0131men 1876 j\u0131l\u0131 taqqa Swltan \u0130\u0130-Abdulhamitti
  ot\u0131r\u011f\u0131zad\u0131. \u00d6kini\u015fke qaray, kelesi j\u0131l\u0131
  ya\u011fni 1877 de or\u0131s-t\u00fcrik so\u011f\u0131s\u0131 bastalad\u0131. Pat\u015fa
  os\u0131 so\u011f\u0131st\u0131 paydalan\u0131p m\u00e4jilisti jabad\u0131. Bwr\u0131n\u011f\u0131day
  bilik jal\u011f\u0131z pat\u015fa\u011fa \u00f6tedi. Biraq \u015feginis or\u0131s-t\u00fcrik
  so\u011f\u0131s\u0131men jal\u011fasad\u0131. Os\u0131 so\u011f\u0131s T\u00fcrkiya
  tarih\u0131nda artqa qaray ketudi\u00f1 so\u00f1\u011f\u0131 n\u00fcktesi bold\u0131.
  Sol so\u011f\u0131sta q\u0131st\u0131\u00f1 k\u00fcni e\u015fqanday day\u0131nd\u0131qs\u0131z
  \u015f\u0131qqan toqsan m\u0131\u00f1 \u00e4sker q\u0131r\u0131l\u0131p qalad\u0131.
  Olar tipti Kavkaz jerine jete almay, so\u011f\u0131spastan q\u0131r\u0131lad\u0131.
  M\u00fclde su\u0131q k\u00f6rmegen, k\u00f6rse de, je\u00f1il, jwqa kiimmen so\u011f\u0131sqa
  attan\u011fan \u00e4skerler eki-\u00fc\u015f ay j\u00fcrgennen keyin \u00e4lsirep
  qalad\u0131. Os\u0131 so\u011f\u0131sta imperiya amal joq je\u00f1iledi. Je\u00f1ilisten
  keyin imperiya territoriyas\u0131n\u0131\u00f1 biraz\u0131n jo\u011faltad\u0131.
  Sodan keyin, imperiyan\u0131\u00f1 negizgi ortal\u0131\u011f\u0131 qirayd\u0131.
  Or\u0131star Stambwl\u011fa deyin keledi. T\u00fcrikter Kipr aral\u0131n a\u011f\u0131l\u015f\u0131ndar\u011fa
  kepildikke beru arq\u0131l\u0131 olard\u0131\u00f1 k\u00f6megine s\u00fcyenedi.
  Sol k\u00fcnnen bastap \u00e4li k\u00fcnge deyin Kipr aral\u0131nda\u011f\u0131
  \u015fielenis bitken emes. Degenmen or\u0131star artqa \u015feginip Imperiyan\u0131\u00f1
  qol ast\u0131nda\u011f\u0131 Serbiya jerin j\u00e4ne Rum\u0131niyan\u0131\u00f1
  azatt\u0131\u011f\u0131n al\u0131p beredi, Bolgariyan\u0131\u00f1 avtonomiyal\u0131q
  elge aynalu\u0131na septigin tigizedi.\\n\u2013 Sonda Swltan \u0130\u0130-Abdulhamitti\u00f1
  imperiya\u011fa qosqan \u00fclesi qanday?\\n\u2013 Swltan \u0130\u0130-Abdulhamit
  pat\u015falard\u0131\u00f1 balalar\u0131n\u0131\u00f1 i\u015findegi e\u00f1 mom\u0131n\u0131
  bol\u011fan. \u00c4ri \u015feberhanada a\u011fa\u015f oyu\u015f\u0131 wsta bol\u0131p
  jwm\u0131s istegen, qaq-soqpen isi joq, s\u00e4l b\u00fckirleu bol\u011fan kisi
  eken. \u00d6zi de k\u00f6zge on\u015fa k\u00f6rine bermegen. Belsendiler pat\u015fal\u0131q
  respublikan\u0131 qwrud\u0131 armandayd\u0131. Al pat\u015fal\u0131q respublika
  qwrud\u0131\u00f1 birden-bir \u015fart\u0131 \u00abbizdi\u00f1 s\u00f6zimizden \u015f\u0131qpayt\u0131n,
  aytqan\u0131m\u0131zben j\u00fcretin adamd\u0131 qoyu kerek\u00bb dep oylayd\u0131.
  \u00d6zge balalar\u0131n\u0131\u00f1 b\u00e4ri bw\u011fan k\u00f6ne bermeytinin
  biledi. Al Abdulhamit bolsa, izdegenge swra\u011fanday bolad\u0131. S\u00f6ytse,
  bwl balan\u0131\u00f1 \u00f6zini\u00f1 wstan\u011fan sayasat\u0131 eken. Bwl keyin
  bilinip qalad\u0131. Abdulhamit swltan jastay\u0131nan bank j\u00fcyesin \u00fcyrenip
  alad\u0131, \u00e4ri s\u0131rtq\u0131 sayasatt\u0131 j\u00fcrgizudi de \u00fcyrenedi.
  A\u011f\u0131l\u015f\u0131ndard\u0131\u00f1 s\u0131rtq\u0131 barlau sayasat\u0131n
  tere\u00f1 me\u00f1gerip alad\u0131. Os\u0131n\u0131\u00f1 b\u00e4rin me\u00f1gerip
  al\u011fannan keyin, \u00fcnsiz \u015feberhanada a\u011fa\u015f oy\u0131p j\u00fcre
  beredi. \u00dcndemey j\u00fcrgen mom\u0131n balan\u0131 belsendi top \u00fcmitker
  retinde ws\u0131nad\u0131. S\u00f6ytip, Abdulhamit swltan 1876 j\u0131l\u0131 bilikke
  keledi. Bilikke kelgennen keyin \u00abm\u00e4jilisti a\u015f\u0131p beremin, pat\u015fa
  sol m\u00e4jiliske ba\u011f\u0131nat\u0131n bolad\u0131\u00bb dep aytad\u0131. S\u00f6ytip,
  m\u00e4jilis a\u015f\u0131l\u0131p, m\u00e4jilis boy\u0131n\u015fa, pat\u015fa taqqa
  ot\u0131rad\u0131. T\u00fcrik-or\u0131s so\u011f\u0131s\u0131 bastal\u011fannan
  keyin swltan m\u00e4jilisti jabad\u0131 da, bar bilikti \u00f6z qol\u0131na alad\u0131.
  \u00c4ri so\u011f\u0131s kezinde bir \u011fana pat\u015fa, bir \u011fana bilik bolu\u0131
  kerek dep \u015fe\u015fedi. S\u00f6ytip aynalas\u0131nda\u011f\u0131 \u00f6zin bilikke
  al\u0131p kelgen jigitterdi\u00f1 b\u00e4rin t\u00fcgelimen qu\u011f\u0131n\u011fa
  w\u015f\u0131ratad\u0131. B\u00fclik \u015f\u0131\u011far\u0131p jatqandard\u0131\u00f1
  b\u00e4rin jer audar\u0131p jiberedi. Abdulhamit swltan ot\u0131z eki j\u0131l taqta
  ot\u0131rad\u0131. Ot\u0131z eki j\u0131l boy\u0131 m\u0131qt\u0131 sayasat\u0131n\u0131\u00f1
  arqas\u0131nda imperiyan\u0131\u00f1 birde bir \u015far\u015f\u0131 metr jerin e\u015fkimge
  bermeydi. A\u011f\u0131l\u015f\u0131nn\u0131\u00f1 s\u0131rtq\u0131 barlau sayasat\u0131n
  tere\u00f1 me\u00f1gergenini\u00f1 arqas\u0131nda qay elde ne bol\u0131p jat\u0131r,
  qay elde qanday sayasat j\u00fcrip jatqan\u0131nan habardar bol\u0131p ot\u0131r\u0131p,
  ald\u0131n-ala olar\u011fa qars\u0131 sayasat wstanu da qi\u0131n\u011fa soqpayd\u0131.
  Os\u0131lay\u015fa, eldi\u00f1 i\u015findegi sayasi twraqt\u0131l\u0131qt\u0131
  saqta\u011fan. Os\u0131 pat\u015fa t\u00fcrikti\u00f1 tarih\u0131nda so\u00f1\u011f\u0131
  eki pat\u015fan\u0131\u00f1 biri bol\u0131p, esimi atalad\u0131. J\u00e4ne de bastapq\u0131
  kezdegi bwl kisini\u00f1 sayasat\u0131n, qu\u011f\u0131ndau\u0131n t\u00fcsinbegen
  ziyal\u0131 qau\u0131mdar men aq\u0131n-jazu\u015f\u0131lard\u0131\u00f1 b\u00e4ri
  cwltan\u011fa qars\u0131 oppoziciyal\u0131q j\u0131rlar\u0131n \u015f\u0131\u011fara
  basta\u011fan. Aq\u0131r\u0131nda sol kezderi armyandar men evreylerdi\u00f1 k\u00f6megimen
  swltand\u0131 taqtan tayd\u0131rad\u0131. Swltan qalay bilikten ketedi, solay Balqan
  so\u011f\u0131s\u0131 bastalad\u0131. Os\u0131 so\u011f\u0131sta t\u00fcrik armiyas\u0131
  artqa qaray \u015feginuge tura keledi. Je\u00f1ilisti\u00f1 saldar\u0131nan Bolgariya,
  Makedoniya siyaqt\u0131 elder \u00f6zini\u00f1 t\u00e4uelsizdigin jariyalayd\u0131.
  Osman imperiyas\u0131n\u0131\u00f1 qol ast\u0131nda\u011f\u0131 Afrikan\u0131\u00f1
  biraz elderi, a\u011f\u0131l\u015f\u0131ndard\u0131\u00f1, francuzdard\u0131\u00f1,
  Italiyan\u0131\u00f1 qol ast\u0131na \u00f6tip ketedi. Abdulhamit swltan taqtan
  t\u00fcskennen keyin, aq\u0131n-jazu\u015f\u0131lar so\u011f\u0131st\u0131\u00f1
  ne sebepti bastal\u011fan\u0131n, bwl so\u011f\u0131stan keyin qan\u015fama jerdi
  jo\u011falt\u0131p al\u011fan\u0131n t\u00fcsinedi. Swltann\u0131\u00f1 \u00fclken
  sayasatker bol\u011fan\u0131n ke\u015f biledi. \u00c4ri odan ke\u015firim swrayd\u0131.
  Olard\u0131\u00f1 ke\u015firim swra\u011fan\u0131 aq\u0131n-jazu\u015f\u0131lard\u0131\u00f1
  \u00f6le\u00f1derinde k\u00f6ptep kezdesedi.\\nBwl kisi armyandar wstan\u011fan
  sayasat\u0131 \u00fc\u015fin \u00abQ\u0131z\u0131l swltan\u00bb degen, al evreyler
  bolsa m\u00fclde wnatpa\u011fan. On\u0131\u00f1 da sebebi, evreyler Swltan \u0130\u0130-Abdulhamitten
  b\u00fcgingi Izrail''di\u00f1 jerin swrap keledi. \u00abOsman imperiyas\u0131n\u0131\u00f1
  b\u00fctkil s\u0131rtq\u0131 qar\u0131z\u0131n \u00f6tep beremiz, bizge qasietti
  jerimizdi beri\u00f1iz\u00bb, \u2013 deydi. Sonda pat\u015fa: \u00abT\u00fcrikter
  qanmen al\u011fan jerdi aq\u015fa\u011fa satpayd\u0131\u00bb, \u2013 dep el\u015filerin
  qwz\u0131r\u0131nan quad\u0131. El\u015fi keterde \u00abmeni qorla\u011fan\u0131\u00f1
  os\u0131 bols\u0131n, bizdi endigi jerde dos deme\u00bb dep ketedi. B\u00fcgingi
  Palestina jerin evreyler qomaqt\u0131 aq\u015fa\u011fa bir-birlep sat\u0131p ala
  bastayd\u0131. Pat\u015fa os\u0131n\u0131 estip \u015feteldikterge, \u00e4sirese
  evreylerge jer satu\u011fa t\u0131y\u0131m salad\u0131 j\u00e4ne bir qor qwr\u0131p
  jerin satat\u0131n palestinal\u0131qtardan jerin \u00f6zi sat\u0131p alad\u0131.
  Biraq amal qan\u015fa, 1909 j\u0131l\u0131 t\u00f6\u00f1keriste taqtan t\u00fcsirilip
  orn\u0131na Mehmet Re\u015fat keledi. Sol k\u00fcnnen bastap, Palestina meselesi
  \u015fe\u015filmey kele jat\u0131r.\\n\u2013 Abdulhamit swltannan keyin qanday ja\u011fdaylar
  or\u0131n ald\u0131?\\n\u2013 Abdulhamit swltannan keyin taqqa Mehmet Re\u015fat
  keledi. 8 j\u0131l taqta ot\u0131rad\u0131. Ol baqil\u0131q bol\u011fannan keyin
  taqqa Swltan Vahideddin keledi. Swltan Vahideddin Osman imperiyas\u0131nda\u011f\u0131
  taqqa ot\u0131r\u011fan so\u00f1\u011f\u0131 pat\u015fa. \u00d6te taqua j\u00e4ne
  \u00e4diletti kisi bol\u011fan. E\u00f1 \u00f6kini\u015ftisi, Swltan Vahideddin
  taqqa ot\u0131r\u011fan keze\u00f1 qi\u0131n- q\u0131stau k\u00fcndermen tura keledi.
  \u00d6ytkeni 1912 j\u0131l\u011f\u0131 Balqan so\u011f\u0131s\u0131nda imperiyan\u0131\u00f1
  qol ast\u0131nda\u011f\u0131 k\u00f6ptegen elder t\u00e4uelsizdigin jariyala\u011fan.
  J\u00e4ne i\u015fki oppoziciya k\u00fc\u015feygen keze\u00f1. Sonday-aq imperiya
  birin\u015fi d\u00fcniej\u00fczilik so\u011f\u0131st\u0131 ayaqtau \u00fcstinde
  bol\u011fan. Bwl so\u011f\u0131sta t\u00fcrikter je\u00f1ilmese de, nemister j\u00e4ne
  bizdi\u00f1 odaqtas\u0131m\u0131z bol\u011fan bolgarlar je\u00f1ilgennen keyin,
  amal joq, birin\u015fi d\u00fcniej\u00fczilik so\u011f\u0131sta a\u011f\u0131l\u015f\u0131n,
  francuz, or\u0131s j\u00e4ne ital''yand\u0131qtard\u0131\u00f1 odaqtasqan elderinen
  je\u00f1ilgenin moy\u0131ndau\u011fa tura keledi.\\nSol kezde T\u00fcrkiyan\u0131\u00f1
  b\u00fcgingi territoriyas\u0131n jeti birdey jau jaulap alad\u0131. On\u0131\u00f1
  bat\u0131s ayma\u011f\u0131n grekter, o\u00f1t\u00fcstik ayma\u011f\u0131n ital''yand\u0131qtar,
  qi\u0131r-\u015f\u0131\u011f\u0131s ayma\u011f\u0131n francuzdar, \u015f\u0131\u011f\u0131s
  ayma\u011f\u0131n or\u0131star j\u00e4ne armyandar jaulap alad\u0131. Tek t\u00fcrikterge
  orta Anadol\u0131 jerindegi eki-\u00fc\u015f qala \u011fana qalad\u0131. Qal\u011fan
  jerlerdi\u00f1 b\u00e4ri t\u00fcgeldey otarlau\u015f\u0131 elderdi\u00f1 qol\u0131na
  \u00f6tip ketedi. Bwl XX \u011fas\u0131rd\u0131\u00f1 al\u011fa\u015fq\u0131 \u015firegi
  1918 j\u0131l\u0131 bolat\u0131n.\\nSwltan Vahideddin bwr\u0131n \u00f6zimen birne\u015fe
  ret saparlas bol\u011fan j\u00e4ne 1905 j\u0131l\u0131 Siriya elinde, 1911 j\u0131l\u0131
  Liviya jerindegi wlt-azatt\u0131q k\u00fcresti basta\u011fan j\u00e4ne t\u00fcrik
  armiyas\u0131nda birin\u015fi d\u00fcniej\u00fczilik so\u011f\u0131sta \u00fclken
  erlik k\u00f6rsetken Atat\u00fcrikti Anadol\u0131 jerine jiberip, hal\u0131qt\u0131\u00f1
  bas\u0131n qos\u0131p, wlt-azatt\u0131q k\u00f6terilis wy\u0131mdast\u0131ru\u011fa
  jiberudi wy\u011farad\u0131. \u00c4ri os\u0131 arq\u0131l\u0131 Osman imperiyas\u0131na
  tiesili jerlerdegi \u00f6zge elderdi\u00f1 armiyas\u0131n \u015f\u0131\u011farud\u0131
  da maqsat etedi. Ol \u00fc\u015fin wlt-azatt\u0131q k\u00fcresti bastau kerek. Os\u0131
  \u00fc\u015fin Atat\u00fcrikti \u015faq\u0131rtad\u0131. Biraq bw\u011fan biraz
  adam qars\u0131l\u0131q bildiredi. \u00c4sirese Anuar pa\u015fa swltan\u011fa: \u00abAtat\u00fcrik
  m\u0131qt\u0131 qayratker. Biraq o\u011fan senuge bolmayd\u0131\u00bb dep aytad\u0131.
  Ekeuini\u00f1 aras\u0131nda b\u00e4sekelestik bar edi. Biraq pat\u015fa: \u00abQazir
  mwn\u0131 Atat\u00fcrikten as\u0131r\u0131p jasayt\u0131n e\u015fkim joq. Sond\u0131qtan
  da, qaytken k\u00fcnde Mwstafa Kemald\u0131 jiberuimiz kerek\u00bb, \u2013 deydi.
  S\u00f6ytip, pat\u015fa on m\u0131\u00f1 alt\u0131n berip, a\u011f\u0131l\u015f\u0131ndardan
  Atat\u00fcrikti \u015f\u0131\u011f\u0131s armiyas\u0131n otarlau\u015f\u0131 elderdi\u00f1
  talab\u0131 boy\u0131n\u015fa t\u00e4rtipke keltiru maqsat\u0131nda Anadol\u0131
  jerine jiberuge rwqsat alad\u0131. Negizgi maqsat Anadol\u0131 jerinde otarlau\u015f\u0131lar\u011fa
  qars\u0131l\u0131q k\u00f6rsetu maqsat\u0131nda hal\u0131qqa \u00fcgit-nasihat j\u00fcrgizu.
  Biraq \u00f6kini\u015fke qaray, resmi tarih k\u00fcni ke\u015fege deyin mwn\u0131
  basqa\u015fa oq\u0131tt\u0131. Sol kezde Swltan Vahideddin elge qiyanat jasad\u0131
  deumen keldi. \u00abOsman imperiyas\u0131 otarlau\u015f\u0131 elderine je\u00f1ilisti
  moy\u0131ndap bergennen keyin Atat\u00fcrik \u00f6zini\u00f1 dostar\u0131men Anadol\u0131
  jerine jaman qay\u0131qpen su ja\u011fas\u0131men Samswn qalas\u0131na jetip wlt-azatt\u0131q
  k\u00fcresti bastad\u0131\u00bb dep oq\u0131tt\u0131. Pat\u015fan\u0131\u00f1 \u00fclesin
  aytpaq b\u0131lay twrs\u0131n, on\u0131 \u00abqiyanat\u015f\u0131l, jekswr\u0131n\u00bb
  dep bala\u011fattad\u0131. At\u00fcrikti\u00f1 Stambwldan Samswn qalas\u0131na jetken
  yahtas\u0131 \u00e4li k\u00fcnge deyin qara te\u00f1iz ja\u011falau\u0131nda\u011f\u0131
  Samswn qalas\u0131nda muzeyge aynald\u0131r\u0131l\u0131p saqtaul\u0131 twr. YA\u011fni
  ol jaman qay\u0131qpen emes, arnay\u0131 yahtamen Samswn\u011fa jetken.\\n\u015e\u0131nd\u0131\u011f\u0131na
  kelgende, on\u0131 pat\u015fan\u0131\u00f1 \u00f6zi arnay\u0131 missiyamen jibergeni
  bayqalad\u0131. Sodan Samswn qalas\u0131nda\u011f\u0131 birin\u015fi qadam\u0131nan
  keyin T\u00fcrkiyada wlt-azatt\u0131q k\u00fcresti bastayd\u0131. Ol kezderi T\u00fcrkiyan\u0131\u00f1
  barl\u0131q armiyas\u0131 tarqat\u0131l\u011fan bolat\u0131n. Tek qana \u015f\u0131\u011f\u0131sta\u011f\u0131
  armiyas\u0131 \u011fana tarqat\u0131lma\u011fan. Kaz\u0131m Karemebekir degen pa\u015fan\u0131\u00f1
  qarama\u011f\u0131nda\u011f\u0131 armiya saqtaul\u0131 bolat\u0131n. Os\u0131 armiya
  bas\u015f\u0131lar\u0131men Mwstafa Kemal al\u011fa\u015f ret wlt-azatt\u0131q k\u00fcresti
  bastayd\u0131. Bwl 1919 j\u0131l\u0131 bolat\u0131n. Ara\u011fa bir j\u0131l sal\u0131p,
  Atat\u00fcrik birqatar qalalarda \u00fclken ji\u0131ndar \u00f6tkizip, arnay\u0131
  \u015fe\u015fimder qab\u0131ldayd\u0131. Sol \u015fe\u015fimderdi\u00f1 biri \u2013
  \u00abOtan\u0131m\u0131zd\u0131 barl\u0131q jaulardan saqtau\u0131m\u0131z j\u00e4ne
  qor\u011fau\u0131m\u0131z kerek. Bwl \u00fc\u015fin ayanbay k\u00fcresuimiz qajet\u00bb
  degen qa\u011fidadan twrad\u0131. Mwn\u0131 estigen a\u011f\u0131l\u015f\u0131ndar
  pat\u015fa\u011fa kelip, q\u0131s\u0131m jasay bastayd\u0131. \u00abToqtatu\u011fa
  ketti\u00bb dep ayt\u0131p edi\u00f1der. Senderdi\u00f1 bizdi alda\u011fandar\u0131\u00f1
  \u011foy\u00bb, \u2013 dep pat\u015fa\u011fa Mwstafa Kemald\u0131 toqtatud\u0131
  bwy\u0131rad\u0131. \u00ab\u00c4ytpese, biz sizderge basqa\u015fa \u015fara qoldanam\u0131z\u00bb
  dep m\u00e4jb\u00fcrleydi. Pat\u015fal\u0131q bwl m\u00e4jb\u00fcrlikten keyin,
  \u00e4ri Atat\u00fcrikke uak\u0131t beru \u00fc\u015fin \u015feyhislamnan Atat\u00fcrikti\u00f1
  jasap jatqan jwm\u0131s\u0131n\u0131\u00f1 memleketke qars\u0131 istelip jatqan
  jwm\u0131s ekenin ayt\u0131p, patua \u015f\u0131\u011fartq\u0131zad\u0131. Mwn\u0131\u00f1
  b\u00e4ri a\u011f\u0131l\u015f\u0131ndard\u0131\u00f1 q\u0131s\u0131m\u0131men jasalad\u0131.
  Ol kezde a\u011f\u0131l\u015f\u0131ndar Stambwld\u0131 jaulap al\u011fan. Pat\u015fa
  olard\u0131\u00f1 twtq\u0131n\u0131nda j\u00fcrgen. Biraq pat\u015fa da \u00f6zini\u00f1
  taktikas\u0131n dwr\u0131s paydalanad\u0131. Wlt-azatt\u0131q k\u00fcresti toqtatu
  j\u00f6ninde \u00e4sker day\u0131ndat\u0131p Atat\u00fcrikke qars\u0131 \u015fabud\u0131\u00f1
  orn\u0131na jay \u011fana patua \u015f\u0131\u011fartq\u0131zad\u0131. Atat\u00fcrik
  pat\u015fan\u0131\u00f1 \u00fckimin t\u0131\u00f1damayt\u0131n\u0131n biledi. \u00d6ytkeni
  o\u011fan berilgen missiya eldi jaulardan tazartu edi. S\u00f6ytip k\u00fcres bastalad\u0131.
  K\u00fcresti j\u00fcrgizerde Osman imperiyas\u0131 k\u00f6ptegen k\u00f6mekter k\u00f6rsetedi.
  Birin\u015fiden, Stambwldan Anadol\u0131 jerine \u00f6tetin qaru-jaraqt\u0131 uaq\u0131t\u0131l\u0131
  jetkizip ot\u0131rd\u0131. \u00c4ri hal\u0131qqa taratuda da k\u00f6ptegen \u015farualar
  atqar\u0131ld\u0131. Hal\u0131q Atat\u00fcrikti\u00f1 bwl jwm\u0131st\u0131 atqarat\u0131n\u0131na
  k\u00f6zderi jetti. S\u00f6ytip, \u00f6miri bodand\u0131q k\u00f6rmegen el Atat\u00fcrikti\u00f1
  aynalas\u0131na toptasad\u0131. \u00abQauay\u0131 millie\u00bb dep atalat\u0131n
  wltt\u0131q k\u00fc\u015f degen ma\u011f\u0131na\u011fa keletin armiya qwr\u0131la
  bastayd\u0131. Os\u0131 toptasud\u0131\u00f1 arqas\u0131nda \u00fclken \u015fayqas
  bastalad\u0131. Bwl \u015fayqas \u00e4r qalada j\u00fcrgiziledi. \u00c4r qalada\u011f\u0131
  armiya \u00f6zini\u00f1 qalas\u0131nda qon\u0131stan\u011fan \u00f6zge wlt armiyas\u0131n
  \u015f\u0131\u011far\u0131p salu kerek. Bw\u011fan bar\u0131n\u015fa ayanbay kirisedi.
  Nebar\u0131 eki-\u00fc\u015f j\u0131ld\u0131\u00f1 i\u015finde b\u00fctkil T\u00fcrkiya
  jerin jaulap al\u011fan armiya artqa qaray \u015feginedi. E\u00f1 al\u011fa\u015fq\u0131
  \u015fegingen armiya bwl or\u0131s armiyas\u0131 bold\u0131. Or\u0131s armiyas\u0131n\u0131\u00f1
  \u015fekaradan ketuini\u00f1 bir sebebi, 1917 j\u0131l\u0131 Reseydegi Lenin jasa\u011fan
  t\u00f6\u00f1keriske baylan\u0131st\u0131 bold\u0131. Sol t\u00f6\u00f1keristen
  keyin Lenin \u00f6zini\u00f1 ja\u00f1a memleketin bekitu maqsat\u0131nda, \u00f6z
  i\u015findegi m\u00e4selelerdi \u015fe\u015fu \u00fc\u015fin T\u00fcrkiya \u015fekaras\u0131nan
  \u015feginetinin aytad\u0131. \u00c4ri Atat\u00fcrikpen kelisimge keledi. Os\u0131
  kelisimni\u00f1 arqas\u0131nda bwr\u0131n\u011f\u0131 T\u00fcrkiya jerinen or\u0131s-t\u00fcrik
  so\u011f\u0131s\u0131nda al\u0131n\u011fan jerlerdi\u00f1 i\u015finde eki qalan\u0131
  qaytarad\u0131. S\u00f6ytip, t\u00fcrikti\u00f1 \u015fekaras\u0131 or\u0131spen
  bekitilip qoy\u0131lad\u0131. Os\u0131 \u015fekaradan \u015feginisten so\u00f1,
  \u015f\u0131\u011f\u0131s aymaqta\u011f\u0131 qauip bitkennen keyin Bat\u0131sqa
  qaray \u015fayqas bastalad\u0131. \u00c4sirese, e\u00f1 \u00fclken \u015fayqastar
  grektermen \u00f6tti. Os\u0131lay\u015fa, \u00f6zge eldi\u00f1 armiyalar\u0131n\u0131\u00f1
  b\u00e4ri birtindep elden qu\u0131lad\u0131. Os\u0131n\u0131\u00f1 arqas\u0131nda
  b\u00fcgingi T\u00fcrkiya memleketini\u00f1 territoriyas\u0131 beki bastayd\u0131.
  Sol kezde a\u011f\u0131l\u015f\u0131ndar k\u00fcrdterdi\u00f1 m\u00e4selesin qoz\u011fap,
  solard\u0131 k\u00f6teriliske \u015faq\u0131rad\u0131. Biraq Atat\u00fcrik olard\u0131\u00f1
  b\u00e4rimen jemisti jwm\u0131s jasa\u011fand\u0131qtan, olard\u0131\u00f1 e\u015fqays\u0131s\u0131
  a\u011f\u0131l\u015f\u0131n\u011fa ermeydi. Ermegennen keyin a\u011f\u0131l\u015f\u0131ndar
  Atat\u00fcrikti\u00f1 erligin moy\u0131ndau\u011fa tura keledi. Biraq bwl erlik
  \u00fclken bir keze\u00f1ni\u00f1 ayaqtalu\u0131men bitedi. Ol Osman imperiyas\u0131n\u0131\u00f1
  qwlau\u0131 j\u00e4ne ja\u00f1a respublikan\u0131\u00f1 qwr\u0131lu\u0131 bol\u0131p
  esepteledi. Naqt\u0131lap aytqanda, 23 s\u00e4uir 1920 j\u0131l\u0131 Ankarada T\u00fcrkiya
  wltt\u0131q m\u00e4jilisi qwr\u0131lad\u0131. T\u00fcrkiyan\u0131\u00f1 jan-ja\u011f\u0131nan
  kelgen delegattar endigi jerde imperiya\u011fa ba\u011f\u0131nbayt\u0131n\u0131n,
  T\u00fcrkiya Respublikas\u0131n wltt\u0131q m\u00e4jilisti\u00f1 basqarat\u0131n\u0131n,
  Stambwl \u015f\u0131\u011far\u0131p jatqan \u00fckimderdi bwlar endi t\u0131\u00f1damayt\u0131nd\u0131qtar\u0131n
  jetkizedi.\\n\u2013 Swltan Vahideddinni\u00f1 endigi ta\u011fd\u0131r\u0131 nemen
  ayaqtald\u0131?\\n\u2013 So\u011f\u0131s jal\u011fas\u0131p jat\u0131r. O\u00f1t\u00fcstik
  jaqtarda. Francuz, a\u011f\u0131l\u015f\u0131n, grektermen so\u011f\u0131s\u0131p
  jatqan uaq\u0131t. Bwl \u00fc\u015f el m\u0131nanday taktika\u011fa k\u00f6\u015fedi.
  Olard\u0131\u00f1 k\u00f6zdegeni Atat\u00fcrikti\u00f1 jaqtastar\u0131 men pat\u015fan\u0131\u00f1
  jaqtastar\u0131n bir-birimen \u015fayqast\u0131ru edi. Sol \u00fc\u015fin London
  konferenciyas\u0131na \u015faq\u0131rad\u0131. Konferenciya\u011fa T\u00fcrkiyan\u0131\u00f1
  resmi \u00f6kili retinde Ankara \u015faq\u0131r\u0131lad\u0131. Pat\u015fal\u0131q
  \u015faq\u0131r\u0131lmayd\u0131. Sol jerde pat\u015fal\u0131qt\u0131 \u015faq\u0131rma\u011fannan
  keyin, Ankara\u011fa qars\u0131 ne so\u011f\u0131su kerek, ne olard\u0131\u00f1
  biligin moy\u0131ndau kerek bold\u0131. Sol kezde k\u00f6zi a\u015f\u0131q, twl\u011falar\u0131m\u0131z
  Ankaramen jasal\u0131p jatqan kelisimdi qab\u0131ldayt\u0131n\u0131n jetkizedi de,
  os\u0131lay\u015fa, jaud\u0131\u00f1 k\u00f6zdegen maqsat\u0131n bwzad\u0131. 1923
  j\u0131l\u0131 so\u011f\u0131s je\u00f1ispen ayaqtalad\u0131. Lozan kelisim \u015fart\u0131men
  29 qazan 1923 j\u0131l\u0131 T\u00fcrkiya Respublikas\u0131 qwr\u0131lad\u0131.\\nRespublika
  qwr\u0131l\u011fannan keyin \u00fclken bir tart\u0131s bold\u0131. Eldi\u00f1 basqaru
  j\u00fcyesi pat\u015fal\u0131q bol\u0131p jal\u011fasa ma, \u00e4lde ja\u00f1a j\u00fcye
  engizile me? Pat\u015fal\u0131q bol\u0131p jal\u011faspasa, halifatt\u0131q qalay
  bolad\u0131? Os\u0131 m\u00e4seleni \u015fe\u015fu ald\u0131\u00f1\u011f\u0131 kezekte
  twrd\u0131. Atat\u00fcrik bastapq\u0131da halifatt\u0131qt\u0131 qald\u0131rud\u0131
  oylayd\u0131. Sol \u00fc\u015fin Swltan Abdulmejitti Halifatt\u0131qqa al\u0131p
  keledi. Biraq t\u00fcbinde T\u00fcrkiya Respublikas\u0131n zay\u0131rl\u0131 memleketke
  aynald\u0131ru k\u00f6zdeledi. Negizgi maqsat ta os\u0131. Keybir tarih\u015f\u0131lar
  Lozanda\u011f\u0131 bey resmi kelisim boy\u0131n\u015fa halifatt\u0131qt\u0131 joyu\u011fa
  qars\u0131l\u0131q ja\u00f1a respublikan\u0131 resmi t\u00fcrde tanit\u0131nd\u0131qtar\u0131n,
  \u00e4ytpese T\u00fcrkiya Respublikas\u0131n tan\u0131maym\u0131z degenderin aytad\u0131.
  Bwn\u0131\u00f1 qan\u015fal\u0131qt\u0131 \u015f\u0131nd\u0131q ekenin bilmeymin,
  biraq bir j\u0131l i\u015finde, ya\u011fni 1924 j\u0131l\u0131 halifatt\u0131q t\u00fcbimen
  joy\u0131lad\u0131. Negizinen halifatt\u0131q mws\u0131lman elderi \u00fc\u015fin
  \u00fclken k\u00fc\u015f bol\u011fan, Osman swltandar\u0131 bwl k\u00fc\u015fti
  \u00f6te tiimdi paydalana bilgen. \u00d6ytkeni halifatt\u0131q mws\u0131lman elderini\u00f1
  bas\u015f\u0131l\u0131\u011f\u0131 edi. Alayda \u00e4ri mws\u0131lmand\u0131qt\u0131,
  \u00e4ri mws\u0131lman elderin b\u00f6l\u015fektep qwrtud\u0131 k\u00f6zdegen Bat\u0131s
  elderi os\u0131lay\u015fa k\u00f6zdegen maqsattar\u0131na jetedi. On\u0131\u00f1
  ne sebepti bol\u011fan\u0131 j\u00e4ne qalay bol\u011fan\u0131 b\u00fcginde ma\u00f1\u0131zd\u0131
  emes bold\u0131!\\nOs\u0131 arada e\u00f1 bir ayan\u0131\u015ft\u0131 ja\u011fday,
  \u00f6zin Anadol\u0131 jerine jibergen, Anadol\u0131 wlt-azatt\u0131q k\u00f6terilisin
  bastatu\u011fa tikeley taps\u0131rma bergen, on m\u0131\u00f1 alt\u0131n berip,
  joldastar\u0131men attand\u0131r\u011fan, bar\u011fan jerinde pat\u015fan\u0131\u00f1
  adam\u0131 dep, qol\u0131na p\u00e4rmenin bergen pat\u015fa\u011fa Atat\u00fcrikti\u00f1
  aynalas\u0131nda\u011f\u0131 adamdard\u0131\u00f1 qiyanat\u0131 bold\u0131. Olar:
  \u00abeger os\u0131 pat\u015fal\u0131q sizdi\u00f1 eli\u00f1izde qalat\u0131n bolsa,
  ya\u011fni T\u00fcrkiya \u015fekaras\u0131nda twrat\u0131n bolsa, bwl memleket k\u00fcnderdi\u00f1
