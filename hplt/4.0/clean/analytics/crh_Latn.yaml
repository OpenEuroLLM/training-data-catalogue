  ile faal i\u015f tutma\u011fa \u00e7a\u011f\u0131rd\u0131. \u00abT\u00fcrkiye, eki
  qarda\u015f halq aras\u0131ndaki i\u00e7timaiy, medeniy, iqtisadiy, ilmiy, diniy
  ve cemaat ba\u011flar\u0131n\u0131\u00f1 inki\u015faf\u0131 i\u00e7\u00fcn q\u0131r\u0131mtatarlarnen
  i\u015fbirligini keni\u015fletmeli\u00bb, \u2013 dep eminliknen ayta \u00dcnver
  Sel.\\nAkimiyet kontrolindeki \u0130smail Gasprinskiy media merkezini\u00f1 yolba\u015f\u00e7\u0131s\u0131
  Sayde Usmanova Rusiye k\u00fctleviy haber vastalar\u0131n\u0131\u00f1 jurnalistlerine
  dedi ki, i\u015f\u011falden so\u00f1 q\u0131r\u0131mtatar tilinde ne\u015fir etilgen
  edebiyat \u00abbaya\u011f\u0131 artt\u0131\u00bb. O, \u00dcnver Sel kibi, T\u00fcrkiye
  akimiyetini i\u015f\u011fal etilgen yar\u0131mada ile faal i\u015f tutma\u011fa
  \u00e7a\u011f\u0131rd\u0131. \u00abQ\u0131r\u0131m ve T\u00fcrkiye aras\u0131nda
  bir k\u00f6p\u00fcr olsun dep, T\u00fcrkiyedeki semetde\u015flerimiz ile daimiy
  ba\u011f qurma\u011fa isteymiz. Halq\u0131m\u0131z \u00f6z tarih\u0131nda \u00e7oq
  \u015fey k\u00f6rdi, ve \u00fcm\u00fct etem ki, ba\u011flar\u0131m\u0131zn\u0131\u00f1
  pekitil\u00fcvi i\u00e7\u00fcn em Rusiye, em T\u00fcrkiye taraf\u0131ndan devlet
  yard\u0131m\u0131 k\u00f6sterilecek\u00bb, \u2013 dep aytt\u0131 Usmanova.\\nQayd
  etmeli ki, \u00abq\u0131r\u0131mtatar medeniyet k\u00fcnleri\u00bb ke\u00e7irilecegini
  esasen Rusiye devlet ne\u015firleri bildirgen edi: halqara alanda \u00e7al\u0131\u015fqan
  \u00abR\u0130A Novosti\u00bb ve Sputnik agentligi.\\nRusiye memurlar\u0131 T\u00fcrkiye
  cemaat\u0131n\u0131 T\u00fcrkiyede ya\u015fa\u011fan q\u0131r\u0131mtatarlar Rusiye
  i\u00e7\u00fcn \u00absemetde\u015f\u00bb ol\u011fan\u0131na i\u015fand\u0131racaq
  olalar\\nBun\u0131\u00f1 kibi te\u015fviqat\u00e7\u0131 tedbirlerni te\u015fkil
  etken Rusiye memurlar\u0131n\u0131\u00f1 bir qa\u00e7 maqsad\u0131 bar. Birinciden,
  T\u00fcrkiye cemaat\u0131n\u0131 T\u00fcrkiyede ya\u015fa\u011fan q\u0131r\u0131mtatarlar
  Rusiye i\u00e7\u00fcn \u00absemetde\u015f\u00bb ol\u011fan\u0131na i\u015fand\u0131racaq
  olalar. Laf maqsatl\u0131 siyaset aqq\u0131nda kete. Ke\u00e7ken sene dekabr ay\u0131nda
  Q\u0131r\u0131mn\u0131\u00f1 Rusiye yolba\u015f\u00e7\u0131s\u0131 Sergey Aksenov
  \u00ab\u00e7etelde ya\u015fa\u011fan Rusiye semetde\u015flerine\u00bb qoltutuv boyunca
  2018 senesini\u00f1 tedbirler plan\u0131n\u0131 tasd\u0131qla\u011fan edi. Planda,
  ilk evel\u00e2, T\u00fcrkiye paytaht\u0131nda ke\u00e7irilecek te\u015fviqat\u00e7\u0131
  aktsiyalar aqq\u0131nda laf kete edi. Memurlar para q\u0131z\u011fanmad\u0131. Umumen
  tedbirlerge 2,2 million Rusiye rublesi (ya da tahminen 900 bi\u00f1 \u011fr\u0131vn\u00e2)
  ay\u0131r\u0131luv\u0131 planla\u015ft\u0131r\u0131l\u011fan edi. Mes\u00fclietli
  ba\u015f nazir muavini Muradov ve \u00abQ\u0131r\u0131mn\u0131\u00f1 i\u015f ve
  medeniyet merkezini\u00f1\u00bb reberligi old\u0131.\\nMuradov Ankarada ke\u00e7irilecek
  tedbirlerni\u00f1 format\u0131n\u0131 daa y\u0131ln\u0131\u00f1 ba\u015f\u0131nda
  jurnalistlerge tarif etken edi. \u00abFotoresim sergisini numay\u0131\u015f etecekmiz,
  \u015fu c\u00fcmleden tamir etilgen Han Saray\u0131n\u0131, q\u0131r\u0131mtatar
  medeniyetini\u00f1 kontserti olacaq, q\u0131r\u0131mtatar tilinde kitap al\u0131p
  ketecekmiz\u00bb, \u2013 dedi Muradov. Kreml k\u00fctleviy haber vastalar\u0131n\u0131\u00f1
  mal\u00fcmat\u0131na k\u00f6re, \u00abmedeniyet k\u00fcnleri\u00bb b\u00f6yle de
  ke\u00e7irildi. Ekinciden, yar\u0131madada ya\u015fa\u011fan q\u0131r\u0131mtatarlarn\u0131
  T\u00fcrkiyedeki diasporan\u0131\u00f1 belli vekilleri Rusiye ilhaq\u0131na qoltutqan\u0131na
  i\u015fand\u0131racaq olalar. As\u0131l\u0131nda ise, Rusiyege tek k\u00fc\u00e7\u00fck
  bir cemaat\u00e7\u0131 gruppas\u0131 qoltuta, olarn\u0131\u00f1 aras\u0131nda e\u00f1
  me\u015fur \u015fah\u0131s da \u2013 \u00dcnver Sel. \u0130\u015f\u011falden so\u00f1
  o, yar\u0131mada\u011fa bir qa\u00e7 kere bar\u0131p kelgen, akimiyet te\u015fkil
  etken tedbirlerde i\u015ftirak etken ve \u011farp siyaset\u00e7ilerini 2014 senesini\u00f1
  Q\u0131r\u0131m \u00abreferendum\u0131\u00bb neticelerini tan\u0131malar\u0131na
  \u00e7a\u011f\u0131r\u011fan edi. 2015 senesi yazda T\u00fcrkiye Ba\u015f prokuraturas\u0131
  \u00abq\u0131r\u0131mtatar dernekleri federatsiyas\u0131n\u0131\u00f1\u00bb qapat\u0131lmas\u0131na
  te\u015febb\u00fcs k\u00f6stergen edi. Rusiye ne\u015firleri Selni T\u00fcrkiyedeki
  q\u0131r\u0131mtatar diasporas\u0131n\u0131\u00f1 liderlerinden birini olaraq tan\u0131tma\u011fa
  devam eteler.\\nYar\u0131madada ya\u015fa\u011fan q\u0131r\u0131mtatarlarn\u0131
  T\u00fcrkiyedeki diasporan\u0131\u00f1 belli vekilleri Rusiye ilhaq\u0131na qoltutqan\u0131na
  i\u015fand\u0131racaq olalar\\n\u00dc\u00e7\u00fcncisi, Moskva ve regiondaki h\u0131zmet\u00e7ileri
  halqara cemaatqa kene ya\u00f1l\u0131\u015f mal\u00fcmat bermege t\u0131r\u0131\u015falar.
  \u00c7etel (m\u0131nda T\u00fcrkiye) jurnalistleri ve siyaset\u00e7ilerine regiondaki
  milletlerara amanl\u0131q ve q\u0131r\u0131mtatar medeniyetini\u00f1 faal inki\u015faf\u0131n\u0131
  tasvir etmege t\u0131r\u0131\u015ft\u0131lar. Amma rusiyelilerge tam\u0131r halq
  \u00abterrorist\u00bb ve \u00abradikal\u00bb olaraq tan\u0131t\u0131la.\\nKreml
  ve regionn\u0131\u00f1 Rusiye akimiyeti T\u00fcrkiye y\u00f6neli\u015finde faal
  \u00e7al\u0131\u015fa. Ke\u00e7ken ay i\u015f\u011fal etilgen Q\u0131r\u0131mn\u0131\u00f1
  Rusiye senator\u0131 Sergey Tsekov T\u00fcrkiye parlamentini\u00f1 halqara i\u015fler
  komitetini\u00f1 reberligi ve azalar\u0131nen k\u00f6r\u00fc\u015fip, olar\u011fa
  yar\u0131madada milletlerara garmoniya bar, dep tarif etti. O, komitet yolba\u015f\u00e7\u0131s\u0131
  Volkan Bozk\u0131r\u011fa T\u00fcrkiyeni\u00f1 resmiy vekilleri cumhuriyetni\u00f1
  Rusiye akimiyeti ile dialog qurma\u011fa istemeyip, Q\u0131r\u0131mtatar Milliy
  Meclisini\u00f1 liderlerinen ba\u011f tuta, dep \u015fik\u00e2yet etti. Tsekov ve
  Kreml diplomatlar\u0131 i\u00e7\u00fcn bu \u2013 Rusiye-T\u00fcrkiye munasebetlerinde
  e\u00f1 a\u011f\u0131r meseledir.\\nKreml memurlar\u0131 ve te\u015fviqat\u00e7\u0131lar\u0131
  ne qadar t\u0131r\u0131\u015fsa da, resmiy Ankara Q\u0131r\u0131m ilhaq\u0131n\u0131
  tan\u0131may, yar\u0131madan\u0131 Ukraina topra\u011f\u0131 dep saya. \u015eu sebepten
  Moskva T\u00fcrkiyedeki q\u0131r\u0131mtatar diasporas\u0131na diqqat ay\u0131r\u0131p,
  on\u0131 \u00abRusiye\u00bb Q\u0131r\u0131m\u0131nda tam\u0131r halq bahtl\u0131
  ya\u015fay, dep i\u015fand\u0131racaq ola.\\nSergey Stelmah, Q\u0131r\u0131mn\u0131\u00f1
  siyasiy k\u00f6zeticisi (m\u00fcellifni\u00f1 ad\u0131 ve soyad\u0131 tel\u00fckesizlik
  maqsad\u0131nen de\u00f1i\u015ftirildi)\\n\u00abFikir\u00bb rubrikas\u0131nda ifadelengen
  fikir-t\u00fc\u015f\u00fcnceler m\u00fcelliflerni\u00f1 noqta-i nazar\u0131n\u0131
  aks ettirip, muarririyetni\u00f1 baq\u0131\u015flar\u0131nen bir olmamas\u0131 mumk\u00fcn\"",
  "\"ReNazirligi, Q\u0131r\u0131mda du\u015fman i\u015f\u011faline qar\u015f\u0131l\u0131q
  k\u00f6stergen Ukraina vatanda\u015flar\u0131n\u0131\u00f1 ik\u00e2yelerini yay\u0131nlama\u011fa
  devam ete.\\n\u201cData\u201d \u2013 q\u0131r\u0131mtatar adam\u0131, yedek askeri,
  zambittir. 2017 senesinden ba\u015flap sil\u00e2 al\u0131p, Ukrainan\u0131 rus tecavuzc\u0131lar\u0131ndan
  qor\u00e7alay, tuv\u011fan Q\u0131r\u0131mn\u0131 azat etmege cenkle\u015fe.\\n\u201cData\u201d
  Q\u0131r\u0131mda 17 sene ya\u015fa\u011fan edi \u2013 do\u011f\u011fan vaq\u0131ttan
  ba\u015flap asker akademiyas\u0131na kirgen vaq\u0131tqa qadar. 2014 senesi ruslar
  Ukraina\u011fa qar\u015f\u0131 cenk ba\u015flatqan ve yar\u0131madan\u0131 i\u015f\u011fal
  etken vaq\u0131t \u201cData\u201d, getman Petro Sa\u011fayda\u00e7n\u0131y ad\u0131na
  Topraq ordus\u0131n\u0131\u00f1 Milliy akademiyas\u0131nda birinci kursta oquy edi.\\n\u00d6z
  cenk yolun\u0131 Svitlodar du\u011fada ba\u015flatt\u0131, \u011eorlivka yan\u0131ndaki
  Pivdenne qasabas\u0131n\u0131 azat ete edi. 2019 senesi terkibinsde Maryinka yan\u0131ndaki
  topraqn\u0131 qor\u00e7ala\u011fan batalyonn\u0131\u00f1 komandan\u0131 old\u0131.\\nLuhansk
  vil\u00e2yetini\u00f1 Popasna \u015feerinde \u00f6z batalyon\u0131nen tolu miqyasl\u0131
  tecavuzn\u0131 qar\u015f\u0131lad\u0131. O zaman on\u0131\u00f1 taq\u0131m\u0131n\u0131\u00f1
  qaravul arbiy rotatsiyas\u0131n\u0131\u00f1 onunc\u0131 (so\u00f1) ay\u0131 edi.\\nAna-babas\u0131n\u0131\u00f1
  evini azat etmek ve tecavuzc\u0131 bir devletni\u00f1 yoq olmas\u0131 i\u00e7\u00fcn
  asker m\u00fcmk\u00fcn ol\u011fan er \u015fey yapa.\"", "\"Tripolidegi bosq\u0131ndar
  lagerine jasal\u011fan \u00e4ue soqq\u0131s\u0131nan kem degende 40 adam qaza tau\u0131p,
  80 adam jaraqat ald\u0131.\\nLiviya biligi \u00e4ue soqq\u0131s\u0131na s\u00e4uirden
  beri el astanas\u0131na \u015fabu\u0131l jasay basta\u011fan fel''dmar\u015fal Halife
  Haftarad\u0131 ay\u0131ptad\u0131. Qayt\u0131s bol\u011fandard\u0131\u00f1 k\u00f6p\u015filigi,
  \u015feneunikterdi\u00f1 aqparat\u0131 boy\u0131n\u015fa, Afrika elderinen kelgen
  bosq\u0131ndar. Qaza bol\u011fandard\u0131\u00f1 naqt\u0131 san\u0131 \u00e4zirge
  belgisiz. \u00abFrans press\u00bb agenttigini\u00f1 habarlau\u0131n\u015fa, bombalard\u0131\u00f1
  biri 120 adam\u0131 bar migranttar \u00fcyine d\u00e4l t\u00fcsken.\\nBWW moy\u0131nda\u011fan
  Liviyada\u011f\u0131 wltt\u0131q birlik \u00fckimeti bar jauapker\u015filikti fel''dmar\u015fal
  Halifa Haftar bas\u015f\u0131l\u0131\u011f\u0131na j\u00fcktedi. Degenmen, Haftar
  \u00e4skeri bosq\u0131ndard\u0131 wstau ortal\u0131qtar\u0131na soqq\u0131 jasama\u011fan\u0131n
  aytt\u0131.\\nSo\u00f1\u011f\u0131 j\u0131ldar\u0131 Liviya Afrikadan a\u011f\u0131l\u011fandar
  Europa\u011fa \u00f6tetin negizgi punktke aynal\u011fan. B\u00fcginde Europa elderine
  za\u00f1s\u0131z \u00f6tkizudi bizneske aynald\u0131r\u011fan eldi\u00f1 biri Liviya
  sanalad\u0131.\"", "\"\u015eQO-n\u0131\u00f1 bilim basqarmas\u0131na ja\u00f1a bas\u015f\u0131
  ta\u011fay\u0131ndald\u0131\\n\u00d6SKEMEN. QazAqparat - \u015eQO-da \u00f6\u00f1irlik
  bilim basqarmas\u0131n\u0131\u00f1 bas\u015f\u0131s\u0131 aw\u0131st\u0131. Bul
  q\u0131zmetke bur\u0131n obl\u0131st\u0131q bilim berw salas\u0131nda\u011f\u0131
  baq\u0131law departamentini\u00f1 bas\u015f\u0131s\u0131 bol\u011fan Nurgeldi \u00c4bjaparov
  ta\u011fay\u0131ndald\u0131, dep xabarlayd\u0131 \u00abQazAqparat\u00bb XAA til\u015fisi.\\n\u015eQO
  bilim basqarmas\u0131na ja\u00f1a bas\u015f\u0131 bol\u0131p Nurgeldi \u00c4bjaparov
  ta\u011fay\u0131ndald\u0131. Ol 1980 j\u0131l\u0131 d\u00fcn\u00efege kelgen. Bilimi
  - \u00abXal\u0131qaral\u0131q is j\u00fcrgizw\u00bb (2001 j.), \u00abZa\u00f1ger\u00bb
  (2006) MBA\\n2002-2003 j\u0131ldar\u0131 QR I\u00c4 qatar\u0131nda bor\u0131\u015f\u0131n
  \u00f6tedi.\\nE\u00f1bek jol\u0131n 2003-2004 j\u0131ldar\u0131 Astana qalas\u0131n\u0131\u00f1
  Almat\u0131 awdan\u0131 \u00e4kimi apparat\u0131nda basta\u011fan.\\n2004-2008 j\u0131ldar\u0131
  sot j\u00fcyesinde jum\u0131s istedi.\\n2008-2010 j\u0131ldar\u0131 kommerc\u00efyal\u0131q
  qur\u0131l\u0131mdarda, 2010-2011 j\u0131ldar\u0131 prokwratwra organdar\u0131nda,
  2011-2015 j\u0131ldar\u0131 \u00abKazatomprom\u00bb UAQ AQ bas\u015f\u0131l\u0131q
  lawaz\u0131mdarda q\u0131zmet atqard\u0131.\\n2015 -2016 j\u0131ldar\u0131 \u00abWn\u00efvers\u00efada
  \u00f6tkizw j\u00f6nindegi d\u00efrekc\u00efya\u00bb MQ d\u00efrektor\u0131n\u0131\u00f1
  or\u0131nbasar\u0131 bol\u0131p q\u0131zmet etti.\\n2016-2017 j\u0131ldar\u0131
  \u015e\u0131\u011f\u0131s Qazaqstan obl\u0131s\u0131n\u0131\u00f1 bilim salas\u0131nda\u011f\u0131
  baq\u0131law departamentini\u00f1 bas\u015f\u0131s\u0131.\\nObl\u0131st\u0131q bilim
