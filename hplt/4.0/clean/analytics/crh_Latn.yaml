  akimiyet b\u00f6yle tedbirni \u00e7oqtan planla\u015ft\u0131r\u011fan edi. \u00abT\u00fcrkiyeni\u00f1
  q\u0131r\u0131mtatar vatanda\u015flar\u0131 i\u00e7\u00fcn te\u015fkil etilgen birinci
  umumiy tedbir edi\u00bb, \u2013 dedi Muradov.\\nOn\u0131\u00f1 aytqan\u0131na k\u00f6re,
  \u00abmedeniy tedbirler\u00bb vaqt\u0131nda seyircilerge me\u015fur q\u0131r\u0131mtatar
  medeniyet erbab\u0131 \u0130smail Gasprinskiy ve regiondaki zemaneviy ya\u015fay\u0131\u015f
