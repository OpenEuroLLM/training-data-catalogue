  \u00f6z jay\u0131men bireui mal\u0131n ba\u011f\u0131p, bireui eginin sal\u0131p,
  bireui oqu\u015f\u0131lar\u011fa sabaq berip, bireui saudas\u0131n jasap j\u00fcrgen
  qarapay\u0131m qazaqtar qwdd\u0131 terroristke aynal\u0131p, qo\u011fam\u011fa b\u00fclik
  sal\u0131p jatqanday \u00abqo\u011famd\u0131 t\u0131n\u0131\u015ftand\u0131ru\u00bb,
  \u00abw\u015fqarlard\u0131 alastau\u00bb, \u00abwlttar \u0131nt\u0131ma\u011f\u0131n
  k\u00fc\u015feytu\u00bb t.b. jeleulermen, \u00abjo\u011far\u0131n\u0131\u00f1, \u00fckimetti\u00f1
  bwyr\u0131\u011f\u0131\u00bb dep \u0259r t\u00fcrli \u0259dis-t\u0259silmen onda\u011f\u0131
  qandastar\u011fa sayasi q\u0131s\u0131mn\u0131\u00f1 k\u00f6kesin k\u00f6rsetude:\\n1.
  Q\u0131tay Konstituciyas\u0131nda \u00abQ\u0131tay Hal\u0131q Respublikas\u0131n\u0131\u00f1
  azamattar\u0131nda dinge senu bostand\u0131\u011f\u0131 bar. Birde-bir memlekettik
  organ, qo\u011famd\u0131q wy\u0131m nemese jeke twl\u011fa azamattard\u0131 dinge
  senuge nemese dinge senbeuge m\u00e4jb\u00fcrleuge bolmayd\u0131. Dinge senu\u015fi
  j\u00e4ne dinge senbeu\u015fi azamattard\u0131 kemsituge jol berilmeydi. Memleket
  qal\u0131pt\u0131 dini \u00e4reketterdi qor\u011fayd\u0131\u00bb dep jaz\u0131p
  qoy\u011fan\u0131men t\u00f6mendegi jergilikti bilikke au\u0131z\u015fa nemese jas\u0131r\u0131n
  bwyr\u0131q t\u00fcrinde, hal\u0131q aras\u0131nda j\u00fcretin wsaq \u015feneunikterdi\u00f1
  qol\u0131men 1) dinge senbeuge \u00fcgitteu, 2) t\u00fcrli dini r\u00e4simderdi
  \u00f6teuge \u015fekteu qoyu, m\u0131sal\u0131, dini Islam qazaqtard\u0131 janaza
  \u015f\u0131\u011farmay jerletu, 3) Keybir \u00fcylerde \u011fana bar \u00abQwran
  K\u00e4rim\u00bb, \u00abjaynamaz\u00bb, t.b. dini kitaptar, dini zattar men j\u00e4digerlerdi
  jinap al\u0131p k\u00f6zin qwrtu. 4) me\u015fitterdi\u00f1 t\u00f6besindegi ayd\u0131
  kesip ald\u0131r\u0131p tastau, 5) me\u015fitterdi\u00f1 i\u015fi-s\u0131rt\u0131na
  24 sa\u011fat baq\u0131lap twrat\u0131n kamera qoyu, 6) me\u015fit qaqpas\u0131na
  arnaul\u0131 policiyadan jasaqtal\u011fan qarul\u0131 k\u00fczet qoyu, 6) au\u0131l,
  audanda\u011f\u0131 bir b\u00f6lim me\u015fitterdi eskirgen degen s\u0131ltaumen
  qirat\u0131p tastau, qiratpa\u011fan keybir me\u015fitterdi\u00f1 esigin qwl\u0131ptap
  tastau, 7) Araq i\u015fpey namaz oq\u0131p j\u00fcrgen qazaqtar\u011fa \u00e4deyi
  araq i\u015fkizu, 8) me\u015fitterde q\u0131zmet isteytin imamdar men dini q\u0131zmetkerlerdi,
  dini bilimi bar jama\u011fattard\u0131 q\u0131lm\u0131s\u0131 bolmasa da sots\u0131z
  t\u00fcrmege to\u011f\u0131t\u0131p on\u0131 onda\u011f\u0131 hal\u0131qqa q\u0131lm\u0131sker
  retinde k\u00f6rsetu. On\u0131 k\u00f6rgen onda\u011f\u0131 qazaq wrpaqtar\u0131
  alda\u011f\u0131 uaq\u0131tta qalay imam bol\u011f\u0131s\u0131 keledi? Qalay \u00f6z
  dini Islamd\u0131 jal\u011f\u0131st\u0131 wstan\u011f\u0131s\u0131 keledi? Mine
  os\u0131nday za\u00f1s\u0131z \u00e4reketi arq\u0131l\u0131 onda\u011f\u0131 qazaqtard\u0131
  qorq\u0131t\u0131p, \u00fcrkitip, \u00f6z dininen \u00f6zdiginen-aq bas tartu\u011fa
  ruhani q\u0131s\u0131m t\u00fcsirude. Os\u0131lay\u015fa dini Islam wltt\u0131 (wy\u011f\u0131r,
  qazaq, t.b.) birtindep \u00f6z dininen ay\u0131ru\u011fa j\u0131m\u0131sq\u0131
  \u0259reket j\u00fcrgizude.\\n2. Q\u0131tay konstituciya men za\u00f1dar\u0131nda
  k\u00f6rsetilgen azamattard\u0131\u00f1 za\u00f1d\u0131 qwq\u0131qtar\u0131n ayaq
  ast\u0131 taptauda. Bwl j\u00f6ninde Q\u0131tayda\u011f\u0131 tu\u011fan-tu\u0131sqan\u0131
  t\u00fcrmege t\u00fcsken, sayasi \u00fcyrenuge qamal\u011fan\u0131 \u00fc\u015fin
  qandastar\u0131m\u0131zdan k\u00f6ptegen ar\u0131z-\u015fa\u011f\u0131mdard\u0131\u00f1
  bol\u0131p jatqan\u0131 b\u00e4rimizge belgili.\\n3. Qazaq wlt\u0131n\u0131\u00f1
  \u00f6z bolm\u0131s\u0131na, salt-sanas\u0131na, dini senimine jat isterdi isteuge
  m\u0259jb\u00fcrleude. M\u0131sal\u0131, \u00f6mirinde k\u00f6rmegen \u00e4ri olay
  bolu\u0131n qalama\u011fan bir Qazaq otbas\u0131n beytan\u0131s bir Q\u0131taymen
  \u00abtu\u0131stast\u0131ru\u00bb degendi \u015f\u0131\u011far\u0131pt\u0131. \u00abQoy
  terisin jam\u0131l\u011fan qasq\u0131r\u00bb degen siyaqt\u0131 ol Q\u0131tay qarapay\u0131m
  kiim kigingen \u00e4skeri adam ba, joq arnaul\u0131 t\u00e4rbielengen t\u0131\u00f1\u015f\u0131
  ma? Ne maqsat\u0131 bar? On\u0131\u00f1 biz bile bermeytin jas\u0131r\u0131n ja\u011f\u0131n
  e\u015fkim bilmeydi. Au\u0131l, audann\u0131\u00f1 qarapay\u0131m qazaqtar\u0131na
  senimen tu\u0131s bol\u011f\u0131s\u0131 keletin q\u0131tay, os\u0131men tu\u0131s
  bolas\u0131\u00f1, \u00fcyi\u00f1e tu\u0131s\u015f\u0131lap kelip ne\u015fe k\u00fcn,
  ne\u015fe apta jatat\u0131n bolad\u0131 dep qazaq otbas\u0131 qalamasa da m\u00e4jb\u00fcrli
  t\u00fcrde tu\u0131stast\u0131rat\u0131n k\u00f6rinedi. Eger sol qazaq otbas\u0131n\u0131\u00f1
  ota\u011fas\u0131 t\u00fcrmege t\u00fcsken nemese \u00absayasi \u00fcyrenu\u00bb
  dep at\u0131 \u00f6zgertilgen jab\u0131q lagerge ne\u015fe aydan ne\u015fe j\u0131l\u011fa
  deyin qamalat\u0131n ja\u011fdayda, art\u0131nda qal\u011fan \u00fcyindegi \u00e4yeli
  j\u00e4ne tek q\u0131zdar\u0131 \u011fana bolsa, tan\u0131mayt\u0131n bir erkek
  q\u0131tay \u00abtu\u0131s\u0131\u00bb \u00e4yeli j\u00e4ne q\u0131zdar\u0131men
  bir \u00fcyde jat\u0131p-twrsa, uaq\u0131t \u00f6te on\u0131\u00f1 art\u0131 ne
  bolad\u0131? Oylaud\u0131\u00f1 \u00f6zi qorq\u0131n\u0131\u015ft\u0131. Men \u00f6zim
  bwn\u0131 qazaqt\u0131 q\u0131taymen tu\u0131stast\u0131ru emes, qazaqt\u0131 q\u0131tayd\u0131\u00f1
  qwr\u011fan twza\u011f\u0131na t\u00fcsirip bergen tiri jemtigine aynald\u0131ru
  dep bilemin. Qalamasa da q\u0131taymen \u00abtu\u0131s\u00bb bol\u0131p ketken qazaqtard\u0131\u00f1
  otbas\u0131 men otbas\u0131 m\u00fc\u015felerini\u00f1 \u00f6mirinde alda\u011f\u0131
  uaq\u0131tta ne k\u00fctip twr, ol ja\u011f\u0131 beym\u00e4lim.\\n4. Tilini\u00f1
  qoldan\u0131s ayas\u0131na t\u00fcrli \u015fekteuler qoyu, \u00f6risin tar\u0131ltu,
  wltt\u0131 \u00f6z tilin tol\u0131qqand\u0131 qoldana almayt\u0131n halge t\u00fcsiru;
  E\u00f1 so\u00f1\u0131nda wltt\u0131 \u00f6z tilinen ay\u0131r\u0131p, tili jo\u011fal\u011fan,
  Q\u0131tay tilinde s\u00f6yleytin, jazat\u0131n jasand\u0131 (iskusstvenn\u0131y)
  wlt jasau\u011fa \u0259rekettenude. YA\u011fni, \u00f6zini\u00f1 bay tili bar Qazaqt\u0131
  \u00f6z tilin tastap Q\u0131tay tilinde s\u00f6yleytin j\u00e4ne jazat\u0131n, t\u00fcri
  Qazaq bol\u011fanmen tili Q\u0131tay wltqa aynald\u0131ru\u011fa itermeleude. 1)
  Qazaq \u015fo\u011f\u0131rl\u0131 qon\u0131stan\u011fan \u00f6\u00f1irlerde Qazaq
  tildi mektepterdi jappay jau\u0131p, Q\u0131tay tilinde oqit\u0131n Q\u0131tay mektepterine
  qos\u0131p biriktirui so\u011fan bir d\u00e4lel. 2) Wltt\u0131q mektepterdi jabumen
  qatar, wltt\u0131q tilde oqu qwraldar\u0131n\u0131\u00f1, qos\u0131m\u015fa paydalan\u0131lat\u0131n
  kitap\u015falard\u0131\u00f1 \u015f\u0131\u011far\u0131lu\u0131na j\u0259ne on\u0131
  oqu\u015f\u0131lard\u0131\u00f1 paydalanu\u011fa \u015fekteu qoyu\u0131. 3) Bastapq\u0131
  kezde \u00abQos tildilik\u00bb sayasat\u0131 boy\u0131n\u015fa Qazaq tili men \u00e4debieti
  Qazaq tilinde j\u00fcrgizilgenmen, keyingi kezderi ol da k\u00fc\u015finen qal\u0131p,
  biri\u00f1\u011fay Q\u0131tay tildi mektepke, q\u0131tay tildi sabaqtar\u011fa aynal\u0131p
  ketken k\u00f6rinedi. 4) Qazaq oqu\u015f\u0131lar\u0131n taza Q\u0131tay twrat\u0131n
  nemese tek q\u0131tay tili \u011fana qoldan\u0131lat\u0131n Q\u0131tay qalalar\u0131na
  apar\u0131p, sonda jataqhana\u011fa jatq\u0131z\u0131p oq\u0131tu. Os\u0131lay\u015fa
  bwl Qazaq oqu\u015f\u0131lar sabaqtan t\u0131sqar\u0131 uaq\u0131ttarda, demal\u0131s
  k\u00fcnderi \u00e4ke-\u015fe\u015fe, a\u011fa-bau\u0131r, tu\u0131s-tu\u011fan\u0131men
  bir mezet Qazaq\u015fa s\u00f6yleu m\u00fcmkindiginen ay\u0131r\u0131lad\u0131.
  YA\u011fni, taza Q\u0131tay bol\u0131p \u015f\u0131\u011fu\u011fa ja\u011fday jasauda.
  5) Qazaqi ortadan aj\u0131rap, taza Q\u0131taylardan twrat\u0131n qalada jataqhanada
  jat\u0131p oq\u0131p jatqan Qazaq oqu\u015f\u0131lar\u0131 tural\u0131 ta\u011f\u0131
  bir tu\u0131ndayt\u0131n m\u00e4sele: O\u00f1-sol\u0131n \u00e4li aj\u0131rat\u0131p
  \u00fclgirmegen, sezimge berilgi\u015f, alb\u0131rt jast\u0131q \u015faqta\u011f\u0131
  (Qazaq) oqu\u015f\u0131lard\u0131\u00f1 bola\u015faq s\u00fcyiktisin de partalas
  Q\u0131taydan tabu\u011fa ja\u011fday jasap ot\u0131r\u011fan siyaqt\u0131.\\n5.
  Erkindikterin \u015fekteu. Wltt\u0131\u00f1 \u00f6z erkimen \u015fe\u015fim qab\u0131ldau
  haq\u0131nan (right of national self-determination) ay\u0131ru. \u00d6z erkimen
  \u015fe\u015fu haq\u0131 (right of self-determination): Bir wlt \u00f6zini\u00f1
  sayasi m\u00e4rtebesin \u00f6z erkimen an\u0131qtau\u011fa, \u00f6z wlt\u0131n\u0131\u00f1
  ekonomikal\u0131q, \u00e4leumettik j\u00e4ne m\u00e4deni damu\u0131n \u00f6z erkimen
  \u015fe\u015fu haq\u0131 bar. YA\u011fni, \u00f6zin-\u00f6zi dam\u0131tu haq\u0131
  bar. Wltt\u0131\u00f1 (nemese/j\u00e4ne jeke adamn\u0131\u00f1) \u00f6z isin \u00f6z
  erkimen \u015fe\u015fu, \u00f6zin-\u00f6zi dam\u0131tu haq\u0131 \u2013 adamn\u0131\u00f1
  negizgi qwq\u0131qtar\u0131n\u0131\u00f1 i\u015findegi e\u00f1 negizgisi bol\u0131p
  tab\u0131lad\u0131 (BWW). \u00d6z mekeninde ot\u0131r\u0131p ejelgi wlt retinde
  e\u00f1 negizgi haq\u0131\u00f1nan, adam retinde e\u00f1 negizgi qwq\u0131\u011f\u0131\u00f1nan
  ay\u0131r\u0131ld\u0131\u00f1 degen s\u00f6z \u2013 ol wlt \u00f6zini\u00f1 e\u015f
  erkindigi joq, jergilikti Q\u0131tay biligini\u00f1 aytqan\u0131na k\u00f6nip, ayda\u011fan\u0131na
  j\u00fcgiretin, \u00f6z wltt\u0131q m\u00fcdesi men haq\u0131n qor\u011fap twru\u011fa
  qauqars\u0131z, joy\u0131lu\u011fa bet al\u011fan wltqa aynald\u0131 degen s\u00f6z.\\n6.
  \\\"Sayasi \u00fcyrenu\\\" att\u0131 jab\u0131q, oq\u015faulan\u011fan, at\u0131
  \u00f6zgergen t\u00fcrmeni\u00f1 ja\u00f1a t\u00fcrin oylap tau\u0131p o\u011fan
  sayasi sauat\u0131 t\u00f6men, janba\u011fu, bala-\u015fa\u011fan\u0131 as\u0131rau
  tirlikterimen j\u00fcrgen au\u0131ld\u0131\u00f1 qarapay\u0131m Qazaqtar\u0131n
  da qamauda. Sol sayasi \u00fcyren lagerinen \u015f\u0131qqan Qazaqstan azamat\u0131
  \u00d6mirbek Bek\u00e4li lagerde qamal\u011fandard\u0131\u00f1 70-80 pay\u0131z\u0131
  Wy\u0131r wlt\u0131 bolsa, qal\u011fan 20-30 pay\u0131z\u0131 \u00f6z Qazaqtar\u0131m\u0131z
  ekenin, jas-jamas\u0131 boy\u0131n\u015fa k\u00f6bi jastar ekenin aytad\u0131. So\u00f1\u011f\u0131
  kezderi \u00absayasi \u00fcyrenuge\u00bb qamal\u011fan Qazaqtard\u0131\u00f1, pasport\u0131
  tart\u0131p al\u0131n\u0131p, Qazaqstanda\u011f\u0131 otbas\u0131nan aj\u0131rap,
  Q\u0131tayda jipsiz baylan\u0131p j\u00fcrgen qandastar\u0131m\u0131zd\u0131\u00f1
  i\u015finen \u00f6z-\u00f6zine qol sal\u0131p \u00f6lip jatqandard\u0131\u00f1 \u015f\u0131\u011f\u0131p
  jatqan\u0131n da estip jat\u0131rm\u0131z. As\u0131l\u0131p \u00f6lip, basqa da
  joldarmen \u00f6z-\u00f6zine qol sal\u011fandard\u0131\u00f1 bar ekeni ras. Biraq,
  \u015f\u0131n\u0131men \u00f6zi as\u0131l\u0131p \u00f6lip qald\u0131ma? Joq ald\u0131men
  \u00f6ltirip, art\u0131nan solay k\u00f6rinis jasap qoyd\u0131ma? Ol ja\u011f\u0131
  belgisiz. Sebebi, ol jerde isti\u00f1 aq-qaras\u0131n tekserip, sot medicinas\u0131
  boy\u0131n\u015fa saraptap, \u015f\u0131nd\u0131qt\u0131 \u015f\u0131\u011far\u0131p
  jatqan e\u015fkim joq. M\u00fcmkin ol jaqta na\u011f\u0131z \u015f\u0131nd\u0131qt\u0131
  biletinder de bar \u015f\u0131\u011far, biraq telefon, internet barl\u0131\u011f\u0131
  qada\u011falauda bol\u011fand\u0131qtan, aytudan qorqad\u0131. Tipti Qazaqstan azamatt\u0131\u011f\u0131n
  al\u011fan Q\u0131taydan kelgen oralmandar Q\u0131tayda\u011f\u0131 tu\u0131starmen
  amand\u0131qt\u0131, hal-jayd\u0131 bilip s\u00f6zylesuden qald\u0131q. S\u00f6ylesuden
  qorqat\u0131n bold\u0131q. Sebebi, Qazaqstanmen s\u00f6ylesukenin bilgen \u015e\u0131\u00f1ja\u00f1da\u011f\u0131
  Q\u0131tay saq\u015f\u0131lar\u0131 olard\u0131 tekserip, s\u00f6yleskeni \u00fc\u015fin
  sayasi \u00fcyrenuge al\u0131p ketetin k\u00f6rinedi. Bizben s\u00f6ylespe\u00f1der
  dep bezek qa\u011fad\u0131. Os\u0131n\u0131\u00f1 \u00f6zi t\u00fcsingen adam\u011fa
  ol jaqta\u011f\u0131 ja\u011fdayd\u0131\u00f1 t\u0131m qi\u0131ndas\u0131p ketkenin
  bildiredi.\\n7. Q\u0131tay wlt\u0131n\u0131\u00f1 wltt\u0131q keybir salt-d\u0259st\u00fcrin,
  m\u0259denietin Qazaq, Wy\u011f\u0131r s\u0131nd\u0131 dini basqa wlttar\u011fa
  k\u00fc\u015ftep t\u0131qpalau, or\u0131ndau\u011fa k\u00f6ndirude. Q\u0131tayd\u0131\u00f1
  j\u0131l\u0131na bir ret \u00f6tkizetin \u00ab\u015fa\u011fan\u00bb dep atalat\u0131n
  Q\u0131tay wlt\u0131n\u0131\u00f1 ja\u00f1a j\u0131l meyram\u0131 bar. Bi\u0131l\u011f\u0131
  os\u0131 \u015ea\u011fan meyram\u0131nda \u015e\u0131\u00f1ja\u00f1da\u011f\u0131
  Qazaqtar\u011fa Q\u0131tayd\u0131\u00f1 \u00f6zderini\u00f1 t\u00fcyip, day\u0131ndap
  \u00e4kep bergen tw\u015fparas\u0131n jegizipti. Ol tw\u015fparan\u0131\u00f1 qwram\u0131nda
  Q\u0131tayd\u0131\u00f1 \u00f6zderi aytqanday qoy-si\u0131rd\u0131\u00f1 etime?
  \u015e\u0131n m\u00e4ninde qoy-si\u0131rdiki emes \u015fo\u015fqanikime? It-m\u0131s\u0131qtikime
  e\u015fkim bilmeydi. Estuge qara\u011fanda tw\u015fparan\u0131\u00f1 qwram\u0131n
  swrau\u011fa, tekseruge bolmayd\u0131 dep aytad\u0131 deydi. Adam densaul\u0131\u011f\u0131na
  ziyand\u0131 d\u00e4rilerdi\u00f1 qos\u0131l\u011fan-qos\u0131lma\u011fan\u0131na
  da e\u015f kepildik joq. t.b.\\n8. Oqu maus\u0131m\u0131 ekenine qaramastan, Q\u0131tay
  azamat\u0131 bol\u0131p tab\u0131lat\u0131n Qazaqstanda oq\u0131p jatqa Qazaq oqu\u015f\u0131,
  studentterdi Q\u0131tayda\u011f\u0131 \u0259ke-\u015fe\u015fesine, tu\u011fandar\u0131na
  q\u0131s\u0131m jasau arq\u0131l\u0131 solard\u0131\u00f1 auz\u0131men aytt\u0131r\u0131p
