  18\\n\\n1. INNGANGUR\\n\\nMarkmi\u00f0 me\u00f0 \u00feeirri vinnu sem h\u00e9r er
  unnin er a\u00f0 m\u00f3ta a\u00f0fer\u00f0 sem n\u00fdtast m\u00e6tti sveitarf\u00e9laginu
  til a\u00f0 geta teki\u00f0 \u00e1 \u00feessum m\u00e1lum \u00e1 jafnra\u00f0i grunndvelli
  og a\u00f0 \u00edb\u00faum og landeigendum s\u00e9 lj\u00f3st hva\u00f0a lei\u00f0reglur
  s\u00e9u \u00ed gildi \u00e1\u00f0ur en fari\u00f0 er \u00fat \u00ed skipulagsvinnu
  einstakra jar\u00f0a e\u00f0a jar\u00f0aparta (landareigna).\\n\\nMeginmarkmi\u00f0
  me\u00f0 vinnu \u00feessari er a\u00f0:\\n\\n- Vi\u00f0urkennt ver\u00f0i a\u00f0
  vernda beri gott r\u00e6ktunarland eins og a\u00f0rar au\u00f0lindir \u00fej\u00f3\u00f0arinnar.\\n-
  Tryggja sem best a\u00f0 g\u00f3\u00f0u r\u00e6ktunarlandi ver\u00f0i ekki spilt
  me\u00f0 \u00f3\u00e1byrgu skipulagi e\u00f0a landn\u00fdtingu.\\n- Tryggja sem
  best hn\u00f6kralausa samb\u00fa\u00f0 landb\u00fana\u00f0ar, \u00fe\u00e9ttbyl\u00eds,
  fr\u00edstundabyggingar og annarrar landnotkunar.\\n- A\u00f0alskipulag sveitarf\u00e9lagsins
  ver\u00f0i, eftir \u00fev\u00ed sem h\u00e6gt er, n\u00fdtt sem t\u00e6ki til a\u00f0
  tryggja ofangreind atri\u00f0i.\\n\\nS\u00fa flokkun landb\u00fana\u00f0arlands
  sem h\u00e9r er sett fram er a\u00f0 mestu unnin eftir korttag\u00f6gnum fr\u00e1
  N\u00e1tt\u00farufr\u00e6\u00f0istofnun (vistger\u00f0arkort), Landb\u00fana\u00f0arh\u00e1sk\u00f3la
  \u00cdslands (Nytjalandsg\u00f6gn), Loftmyndum ehf (loftmyndir og hallakort) og
  a\u00f0alskipulagskortum. Landb\u00fana\u00f0arland er flokka\u00f0 \u00ed fj\u00f3ra
  flokka sem eru eftirtaldir:\\n\\n- **FLOKKUR I \u2013 KJ\u00d6RLENDI FYRIR AKURYRKJU**\\n-
  **FLOKKUR II \u2013 GOTT AKURYRKJULAND**\\n- **FLOKKUR III \u2013 BLANDA\u00d0 R\u00c6KTUNARLAND**\\n-
  **FLOKKUR IV \u2013 ANNAD LAND**\\n\\n\u00deeir a\u00f0ilar sem a\u00f0 vinnunni
  komu af h\u00e1lfu Steinsholts sf. eru Stef\u00e1n Skaftason fyrrum r\u00e1\u00f0unautur
  og h\u00e9ra\u00f0sfulltr\u00fai Landgr\u00e6\u00f0slu r\u00edkisins, Gu\u00f0r\u00fan
  L\u00e1ra Sveinsd\u00f3ttir og \u00c1sgeir J\u00f3nsson.\\n\\nEinnig var r\u00e6tt
  vi\u00f0 formann B\u00fana\u00f0arsambands Kjalarnesbjungs, Gu\u00f0mund Dav\u00ed\u00f0sson
  \u00ed Mi\u00f0dal, Val Porvaldsson fyrrum r\u00e1\u00f0naut auk \u00feess sem vinnuferli\u00f0
  og frumdr\u00f6g voru kynnt \u00e1 \u00edb\u00faafundi \u00ed n\u00f3v. 2016. Flokkunin
  er unnin samhl\u00ed\u00f0a heildarendursko\u00f0un a\u00f0alskipulags sveitarf\u00e9lagsins
  og kortin hafa veri\u00f0 yfirfarin af styrih\u00f6pi \u00feeirrar vinnu sem hafa
  komi\u00f0 a\u00f0 athugasemdum og \u00e1bendingum.\\n\\n\u00cd Kj\u00f3sarhreppi
  er stunda\u00f0ur \u00f6flugur landb\u00fana\u00f0ur \u00e1 nokkrum j\u00f6r\u00f0um
  en jar\u00f0n\u00e6\u00f0i er mismunandi eftir \u00fev\u00ed hvar bori\u00f0 er
  ni\u00f0ur. Vegna n\u00e1lag\u00f0rar vi\u00f0 fj\u00f6ll og \u00e1r er halli vi\u00f0a
  nokkur, land mish\u00e6\u00f0\u00f3tt auk \u00feess sem klappir og gri\u00f0t takmarka
  r\u00e6ktunarskilyr\u00f0i en einnig eru g\u00f3\u00f0 sv\u00e6\u00f0i \u00fear
  sem jar\u00f0vegur er dj\u00fapur og frj\u00f3r og landi\u00f0 a\u00f0 mestu leyti
  flatt. Me\u00f0 flokkun landb\u00fana\u00f0arlands er unnt a\u00f0 kortleggja \u00fea\u00f0
  land sem best hentar til r\u00e6ktunar og er \u00fea\u00f0 a\u00f0allega horft til
  \u00feess hvort \u00fea\u00f0 henti til akuryrkju. Markmi\u00f0 me\u00f0 flokkun
  lands er a\u00f0 h\u00e6gt ver\u00f0i a\u00f0 n\u00fdta hana vi\u00f0 skipulags\u00e1kv\u00e6\u00f0anir
  \u00ed sveitarf\u00e9laginu og tryggja sem best a\u00f0 besta r\u00e6ktunarlandinu
  ver\u00f0i ekki r\u00e1\u00f0sta\u00f0a\u00f0 til landnotkunar sem takmarki m\u00f6gulega
  akuryrkju til lengri t\u00edma.\\n\\nKj\u00f3sarhreppur er talinn vera um 284 km\u00b2,
  \u00fe.e. um 28.400 ha. Allst\u00f3r hluti \u00feess er fjallendi, illr\u00e6ktanlegt
  land sem alltaf hefur flokkast \u00ed flokk IV vegna brattlendis og h\u00e6\u00f0ar
  yfir sj\u00f3. \u00dea\u00f0 land er ekki teki\u00f0 me\u00f0 \u00ed ni\u00f0urst\u00f6\u00f0u\u00fatgreiningu.
  \u00dea\u00f0 land sem flokka\u00f0 er telst vera t\u00e6plega 9.000 ha. Ni\u00f0urst\u00f6\u00f0a
  kortlagningar bendir til a\u00f0 \u00ed sveitarf\u00e9laginu s\u00e9u um 1.850 ha
  af g\u00f3\u00f0u r\u00e6ktunarlandi. \u00dea\u00f0 \u00fe\u00fd\u00f0ir a\u00f0
  um 21 % lands falla innan flokks I og II, sj\u00e1 n\u00e1nar \u00ed kafli 6.\\n\\nH\u00e9r
  \u00e1 eftir er fjalla\u00f0 um helstu forsendur og fyrirliggjandi stefnumarkanir
  sem fjalla um landn\u00fdtingu e\u00f0a taka \u00fearf tillit til vi\u00f0 flokkun
  lands (kafli 2), fjalla\u00f0 um skilgreiningu \u00e1 akuryrkjulandi (kafli 3).
  Fjalla\u00f0 er um sta\u00f0h\u00e6tti \u00ed Kj\u00f3sarhreppi (kafli 4) og land
  flokka\u00f0 \u00e1samt \u00fev\u00ed a\u00f0 fjalla\u00f0 er um \u00feau g\u00f6gn
  og a\u00f0fer\u00f0ir sem notu\u00f0 voru vi\u00f0 flokkunina (kafli 5). \u00dea\u00f0
  er greint fr\u00e1 ni\u00f0urst\u00f6\u00f0u (kafli 6) og h\u00fan s\u00fdnd \u00e1
  uppr\u00e6tti \u00ed vi\u00f0auka.\\n\\n2. FORSENDUR OG FYRIRL\u00cdGGJANDI STEFNUM\u00d6RKUN\\n\\nMatur,
  vatn og loft eru mikilv\u00e6gustu \u00fe\u00e6ttir dagslegs l\u00edfs og fj\u00f6lm\u00f6rg
  \u00fej\u00f3\u00f0f\u00e9l\u00f6g skilgreina framlei\u00f0slu matv\u00e6la sem
  nau\u00f0synlegan \u00f6ryggisb\u00e1ttr fyrir sitt land. Mannkyni fj\u00f6lgar
  st\u00f6\u00f0ugt og \u00fev\u00ed er vaxandi eftirsprungur ef til matv\u00e6lum
  en hungur er vandam\u00e1l vi\u00f0a, s\u00e9rstaklega \u00ed m\u00f6rgum svok\u00f6llu\u00f0u
  \u00fer\u00edja heims r\u00edkjunum. Nefnd \u00e1 vegum Landb\u00fana\u00f0ar- og
  sj\u00e1var\u00fatvegsr\u00e1\u00f0neytis tekur fram a\u00f0 \u00fe\u00f3tt framfarir
  \u00ed buf\u00e9rr\u00e6kt og akuryrkju hafi leitt til \u00feess a\u00f0 \u00e1ri\u00f0
  2003 \u00feurfti einungis 0,78 ha \u00e1 hvern jar\u00f0arb\u00faa, \u00ed sta\u00f0
  1,45 ha \u00e1ri\u00f0 1960, \u00fe\u00e1 munu fj\u00f6lgun mannkyns krefjast meira
  lands, b\u00e6\u00f0i til raektnar og undir mannvirki. \u00de\u00e1 er sifellt ver\u00f0i
  a\u00f0 taka lakara land til raektnar, samhl\u00ed\u00f0a \u00fev\u00ed sem vi\u00f0a
  g\u00e6ti jar\u00f0vegsey\u00f0ingar og hnignunar jar\u00f0vegs, m.a. af v\u00f6ldum
  uppbl\u00e1\u00f0urst, salt-, efnar- e\u00f0a i\u00f0na\u00f0armengunar. Nefndin
  bendir a\u00f0 \u00e1ri\u00f0 1996 hafi FAO (Matv\u00e6la- og landb\u00fana\u00f0arstofnun
  Sameinu\u00f0u \u00fej\u00f3\u00f0anna) hvatt til \u00feess a\u00f0 hver \u00fej\u00f3\u00f0
  ger\u00f0i \u00e1\u00e6tlun \u00e1 grundvelli sinna m\u00f6guleika til a\u00f0 tryggja
  fa\u00f0u\u00f6ryggi (P\u00f3r\u00f0ur Halld\u00f3rsson o.fl., 2010).\\n\\nFj\u00e1rfestar
  vi\u00f0a um heim eru farnir a\u00f0 s\u00e6kjast eftir \u00fev\u00ed a\u00f0 geyma
  f\u00e9 sitt \u00e1 \u00f6ruggan h\u00e1tt og gott raektnarland er or\u00f0inn eftirs\u00f3ttur
  fj\u00e1rfestingarkostur. \u00de\u00e1 reyna r\u00edki eins og K\u00edna, Indland,
  Japan og Bandar\u00edkin n\u00fa a\u00f0 eignast raektnarland utan s\u00edna landam\u00e6ra
  (H\u00f6r\u00f0ur Kristj\u00e1nsson, 2015). Hvernig sem ver\u00f0m\u00e6ti lands
  er meti\u00f0 \u00fe\u00e1 ber alltaf a\u00f0 lita \u00e1 frj\u00f3n jar\u00f0veg
  og pl\u00f3ta\u00e6kt land sem au\u00f0lind, sem ekki skuli \u201es\u00f3\u00f0a\u201d
  \u00ed hugsunarleysi. Almennt er vi\u00f0urkennt a\u00f0 fiskimi\u00f0in, ferskvatni\u00f0
  og n\u00e1tt\u00farun s\u00e9u au\u00f0lindir sem standa beri v\u00f6r\u00f0 um.
  \u00c1 \u00feessum sv\u00ed\u00f0um eru menn nokku\u00f0 samm\u00e1la um a\u00f0
  feta skuli st\u00edg n\u00fdtingar og verndunar og a\u00f0 setja skuli lei\u00f0reglur
  um n\u00fdtingu. Pr\u00e1tt fyrir a\u00f0 menn s\u00e9u e.t.v. ekki alltaf s\u00e1ttir
  vi\u00f0 \u00fe\u00e1 a\u00f0fer\u00f0afr\u00e6\u00f0i sem beitt er vi\u00f0 \u00fea\u00f0
  eru a\u00f0ilar \u00fe\u00f3 almennt samm\u00e1la um a\u00f0 hafa skuli lei\u00f0reglur,
  en slikt er ekki til a\u00f0 dreifa var\u00f0andi landb\u00fana\u00f0arland. Einstaklingar
  og nokkur sveitarf\u00e9l\u00f6g hafa \u00fe\u00f3 lagt til a\u00f0 fastar ver\u00f0i
  teki\u00f0 \u00e1 \u00feessum m\u00e1luum og b\u00e6\u00f0i stj\u00f3rnv\u00f6ld
  og B\u00e6ndasamt\u00f6kinn hafa teki\u00f0 \u00feessi m\u00e1lefni upp. M.a. sam\u00feykkti
  B\u00fana\u00f0ar\u00feing 2016 a\u00f0 \u201eunnar ver\u00f0i vi\u00f0mi\u00f0unarreglur
  um gott raektnalegt land\u201d og a\u00f0 unnin ver\u00f0i a\u00f0 \u00fev\u00ed
  \u00ed gegnum \u00e1\u00f0alskipulag sveitarf\u00e9laga (B\u00fana\u00f0arping,
  2016). \u00cd landsskipulagsstefnu 2015 \u2013 2026, sem sam\u00feykt var \u00e1
  Al\u00feingi \u00ed mars 2016, er kve\u00f0i\u00f0 \u00e1 um a\u00f0 flokkun landb\u00fana\u00f0arlands
  ver\u00f0i l\u00f6g\u00f0 til grundvallar skipulags\u00e1kv\u00f6r\u00f0unum um
  landb\u00fana\u00f0arland \u00ed sveitarf\u00e9l\u00f6gum, sj\u00e1 n\u00e1nar \u00ed
  kafla 2.5 (Al\u00feingi Islands, 2016). Enn hefur \u00fe\u00f3 engin a\u00f0fer\u00f0afr\u00e6\u00f0i
  veri\u00f0 m\u00f3tu\u00f0 af h\u00e1lfu hins opinbera.\\n\\nFj\u00f6lmargir \u00fe\u00e6ttir
  hafa \u00e1hrif \u00e1 landnotkun og \u00e1kv\u00e6\u00f0in landn\u00fdting getur
  takmarka\u00f0 verulega notkun lands til matv\u00e6laframlei\u00f0slu s\u00ed\u00f0ar
  meir. M\u00e1 \u00fearf nefna byggingar, flugvelli og vegi \u00e1samt \u00fdmsum
  veitum og jafnvel sk\u00f3gr\u00e1\u00e6kt og n\u00e1tt\u00faruvernd. Pr\u00e1tt
  fyrir a\u00f0 flestar framkv\u00e6mdir s\u00e9u afturkr\u00e6far, a.m.k. a\u00f0
  einhverju leyti, \u00fe\u00e1 kann \u00fea\u00f0 a\u00f0 vera kostna\u00f0arsamt
  og r\u00fdri jafnvel jar\u00f0veg til frambl\u00fa\u00f0ar. Hins vegar m\u00e1 n\u00fdta
  land til kornra\u00e6ktar \u00ed sumum tilfellum samhl\u00ed\u00f0a annarri landn\u00fdtingu,
  t.d. er h\u00e6gt er a\u00f0 n\u00fdta land sem jar\u00f0stregnur e\u00f0a h\u00e1spennul\u00edna
  liggur um, jafnvel vindmyllur. \u00dea\u00f0 er samt sem a\u00f0ur erfi\u00f0ari
  og kostna\u00f0arsamari n\u00fdting. \u00dev\u00ed er nau\u00f0synlegt a\u00f0 horfa
  til framt\u00ed\u00f0ar til a\u00f0 spilla ekki g\u00f3\u00f0u landb\u00fana\u00f0arlandi,
  en samhl\u00ed\u00f0a \u00fearf a\u00f0 g\u00e6ta \u00feess a\u00f0 landeigendur
  geti n\u00fdtt sitt land s\u00e9r til afkomu og takmarka ekki pr\u00f3unarm\u00f6guleika
  landb\u00fana\u00f0ar e\u00f0a annarra atvinnugreina sem stunda\u00f0ar eru.\\n\\n\u00cd
  stefnum\u00f6rkun r\u00edkis og sveitarf\u00e9laga er fjalla\u00f0 um \u00fdmis
  konar landn\u00fdtingu, \u00fear \u00e1 me\u00f0al skynsamlega og hagkv\u00e6ma
  n\u00fdtingu lands og landg\u00e6\u00f0a.\\n\\n2.1. Skipulagsl\u00f6g\\n\\nMarkmi\u00f0
  skipulagslags nr. 123/2010 er a\u00f0:\\n\\na. Pr\u00f3un bygg\u00f0ar og landnotkunar
  \u00e1 landinu \u00f6llu ver\u00f0i \u00ed samr\u00e6mi vi\u00f0 skipulags\u00e1\u00e6tlanir
  \u00fear sem efnahagslegar, f\u00e9lagslegar og menningarlegar barfir landsmanna,
  heilbrig\u00f0i \u00feeirra og \u00f6ryggi er haft a\u00f0 lei\u00f0arlj\u00f3si.\\n\\nb.
  Stu\u00f0la a\u00f0 skynsamlegri og hagkv\u00e6mri n\u00fdtingu lands og landg\u00e6\u00f0a,
  tryggja vernd landslags, n\u00e1tt\u00faru- og menningarver\u00f0m\u00e6ta og komu
  \u00ed veg fyrir umhverfisspj\u00f6ll og ofn\u00fdtingu, me\u00f0 sj\u00e1lfb\u00e6ra
  pr\u00f3un a\u00f0 lei\u00f0arlj\u00f3si.\\n\\nc. Tryggja r\u00e9ttar\u00f6ryggi
  \u00ed me\u00f0fer\u00f0 skipulagsm\u00e1la \u00feannig a\u00f0 r\u00e9ttur einstaklinga
  og l\u00f3ga\u00f0ila ver\u00f0i ekki fyrir bor\u00f0 borinn \u00fe\u00f3tt hagar
  heildarinna s\u00e9 haf\u00f0ur a\u00f0 lei\u00f0arlj\u00f3si.\\n\\nd. Tryggja a\u00f0
  samr\u00e1\u00f0 s\u00e9 haft vi\u00f0 almenningu vi\u00f0 ger\u00f0 skipulags\u00e1\u00e6tlana
  \u00feannig a\u00f0 honum s\u00e9 gefi\u00f0 t\u00e6kif\u00e6ri til a\u00f0 hafa
  \u00e1hrif \u00e1 \u00e1kv\u00f6r\u00f0un stj\u00f3rnavalda vi\u00f0 ger\u00f0 sl\u00edkra
  \u00e1\u00e6tlana.\\n\\ne. Tryggja faglegan undirb\u00faning mannvirkjager\u00f0ar
  vi\u00f0 ger\u00f0 skipulags\u00e1\u00e6tlana var\u00f0andi \u00fatlit bygginga
  og form og a\u00f0gengi fyrir alla (Al\u00feingi Islands, 2010).\\n\\n2.2. Landsskipulagsstefna
  2015 - 2026\\n\\n\u00cd skipulagsl\u00f6gunum nr. 123/2010, gr. 10 og 11 er fjalla\u00f0
  um ger\u00f0 landsskipulagsstefnu og kve\u00f0i\u00f0 \u00e1 um a\u00f0 \u201eR\u00e1\u00f0herra
  leggi fram \u00e1 Al\u00feingi till\u00f6gu til \u00feings\u00e1lyktunar um landsskipulagsstefnu
  til t\u00f3lf \u00e1ra innan tveggja \u00e1ra fr\u00e1 al\u00feingiskosningum\u201c.\\n\\n\u00cd
  landsskipulagsstefnu, sem sambyggt var \u00e1 Al\u00feingi \u00feann 16. mars 2016,
  kemur fram \u00ed grein 2.3.1 a\u00f0 \u201e\u00cd a\u00f0alskipulagi byggist skipulags\u00e1kv\u00e6\u00f0anir
  um r\u00e1\u00f0st\u00f6fun lands \u00ed dreifb\u00fdli til landb\u00fana\u00f0ar
  og annarrar n\u00fdtingar \u00e1 flokknun landb\u00fana\u00f0arlands. Landi sem
  hentar vel til r\u00e6ktunar ver\u00f0i almenni ekki r\u00e1\u00f0stafa\u00f0 til
  annarra nota me\u00f0 \u00f3afturkr\u00e6fjum h\u00e6tti. Val \u00e1 sv\u00e6\u00f0um
  til sk\u00f3gr\u00e6ktar og stefna um \u00feau taki mi\u00f0 af \u00fev\u00ed a\u00f0
  sk\u00f3gr\u00e6kt falli vel a\u00f0 landi og a\u00f0 eftir \u00fev\u00ed sem vi\u00f0
  \u00e1 s\u00e9u samb\u00e6tt sj\u00f3narmi\u00f0 sk\u00f3gr\u00e6ktar, annars landb\u00fana\u00f0ar
  og \u00fativistar. Flokknun landb\u00fana\u00f0arlands, landslagsgreining og vistger\u00f0aflokkn
  ver\u00f0i l\u00f6g\u00f0 til grundvallar skipulags\u00e1kv\u00f6r\u00f0unum um
  landb\u00fana\u00f0arland. Ennfremur kemur fram \u00ed grein 2.3.2 a\u00f0; \u201eUmhverfis-
  og au\u00f0lindar\u00e1\u00f0uneyti\u00f0, \u00ed samstarfi vi\u00f0 Skipulagsstofnun,
  Samband \u00edslenskra sveitarf\u00e9laga, Landgr\u00e6\u00f0slu r\u00edkisins,
  Sk\u00f3gr\u00e6kt r\u00edkisins og B\u00e6ndasamt\u00f6k \u00cdslands, standi fyrir
  ger\u00f0 lei\u00f0beininga um flokknun landb\u00fana\u00f0arlands til nota vi\u00f0
  skipulagsger\u00f0 og a\u00f0ra stefnum\u00f3tun um landn\u00fdtingu\u201c (Al\u00feingi
  \u00cdslands, 2015a). Einnig liggur fyrir \u00feings\u00e1lyktunartillaga um m\u00f3tu\u00f0
  stefnu stj\u00f3rnavalda um flokknun, vernd og skr\u00e1ningu r\u00e6ktunarlands
  \u00fear sem kve\u00f0i\u00f0 er \u00e1 um; \u201e\u00f0\u00f3 Al\u00feingi \u00e1lyktar
  a\u00f0 fela sj\u00e1var\u00fatvegs- og landb\u00fana\u00f0arr\u00e1\u00f0herra
  a\u00f0 setja \u00e1 f\u00f3t starfsh\u00f3p til a\u00f0 m\u00f3ta og setja fram
  stefnu stj\u00f3rnavalda um flokknun og vernd r\u00e6ktunarlands og fylgja henni
  eftir me\u00f0 \u00e1\u00e6tlun um skr\u00e1ningu r\u00e6ktunarlands og verndar-
  og var\u00f0veislur\u00e1\u00f0stafanir\u201c (Al\u00feingi \u00cdslands, 2015b).\\n\\n2.3.
  Jar\u00f0al\u00f6g\\n\\nMarkmi\u00f0 jar\u00f0alaga nr. 81/2004 er a\u00f0 setja
  reglur um r\u00e9ttindi og skyldur \u00feeirra sem eiga land og n\u00fdta \u00fea\u00f0
  og stu\u00f0la a\u00f0 skipulegri n\u00fdtingu lands \u00ed samr\u00e6mi vi\u00f0
  landkost\u00ed, fj\u00f6lba\u00f0 hlutverk landb\u00fana\u00f0ar og hagsmuni sveitarf\u00e9laga
  og \u00edb\u00faa \u00feeirra, svo og a\u00f0 tryggja svo sem kostur er a\u00f0
  land sem vel er falli\u00f0 til b\u00fav\u00f6ruframlei\u00f0slu ver\u00f0i var\u00f0veitt
  til sli\u00f0ra nota (Al\u00feingi \u00cdslands, 2013a).\\n\\n2.4. N\u00e1tt\u00faruverndarl\u00f6g\\n\\nMarkmi\u00f0
  laga um n\u00e1tt\u00faruvernd nr. 60/2013 er skv. 1 gr. a\u00f0 vernda \u201efj\u00f6lbreytni
  \u00edslenskar n\u00e1tt\u00faru\u201c. \u00cd l\u00f6gunum kemur fram \u00ed 61
  gr. a\u00f0 m.a. n\u00e1\u00f0i eftirtalin vistkerfi s\u00e9rstakrar verndar; \u201ea.
  votlendi, svo sem hallam\u00fdrar, fl\u00f3ar, fl\u00e6\u00f0im\u00fdrar, r\u00fastam\u00fdrar,
  [20.000 m\u00b2] a\u00f0 flatarm\u00e1li e\u00f0a st\u00e6rri \u2026\u201c. Fram
  kemur a\u00f0 for\u00f0ast beri a\u00f0 raska \u00feeim vistkerfum/j\u00e1r\u00f0minjum
  nema br\u00fdna nau\u00f0syn beri til en \u00feegar svo h\u00e1ttar skuli afla framkv\u00e6mdaleyfis,
  e\u00f0a eftir atvikum byggingaleyfis (Al\u00feingi \u00cdslands, 2015).\\n\\nLand
  hefur ekki veri kortlagt/afmarka\u00f0 \u00ed samr\u00e6mi vi\u00f0 l\u00f6gin.\\n\\n2.5.
  A\u00f0alskipulag sveitarf\u00e9laga\\n\\n\u00cd a\u00f0alskipulagi sveitarf\u00e9laga
  er l\u00f6g\u00f0 fram stefna sveitarstj\u00f3rnar til n\u00e6stu 12 \u00e1ra a.m.k.
  og s\u00fa stefna skal endursko\u00f0u\u00f0 a\u00f0 loknum kosningum, \u00e1 fj\u00f6gurra
  \u00e1ra fresti. Allt land sveitarf\u00e9lags er \u00fev\u00ed marka\u00f0 \u00e1kve\u00f0num
  landn\u00fdtingarflokkum og \u00ed dreifb\u00fdlishluta sveitarf\u00e9laga er st\u00e6rstur
  hluti lands a\u00f0 jafna\u00f0i skilgreindur sem landb\u00fana\u00f0arland e\u00f0a
  sem \u00f3bygg\u00f0 sv\u00e6\u00f0i. Landb\u00fana\u00f0arland skal n\u00e1 yfir
  allt land jar\u00f0a og l\u00f6gbyla, sem n\u00fdtt er til landb\u00fana\u00f0ar.
  \u00d3bygg\u00f0 sv\u00e6\u00f0i er land \u00fear sem ekki er gert r\u00e1\u00f0
  fyrir mannvirkjager\u00f0, oftast \u00e1 h\u00e1leldinu en einnig sandsv\u00e6\u00f0i
  \u00ed fj\u00f6llum og aurasv\u00e6\u00f0i j\u00f6kulvatna.\\n\\nLagt er til a\u00f0
  gott r\u00e6ktunarland (flokkar I og II) ver\u00f0i s\u00fdndir \u00e1 a\u00f0alskipulagsuppdr\u00e1ttum.\\n\\n2.6.
  \u00d6nnur stefnumi\u00f0\\n\\nB\u00daNA\u00d0ARPING\\n\\nPr\u00e1tt fyrir a\u00f0
  till\u00f6gur og \u00e1lyktanir B\u00fana\u00f0arbings s\u00e9u ekki bindandi fyrir
  sveitarf\u00e9l\u00f6g \u00e1 sama h\u00e1tt og opinber stefnum\u00f6rkun er \u00e6skilegt
  a\u00f0 horfa til \u00e1lyktana og sambykkta bess. B\u00e6ndur eru eigendur a\u00f0
  st\u00e6rstum hluta af l\u00e1glendissv\u00e6\u00f0um landsins og B\u00fana\u00f0ar\u00feing
  er \u00feeirra samstarfsvettvangur.\\n\\nB\u00fana\u00f0ar\u00feing hefur \u00e1
  undaf\u00f6rnum \u00feingum \u00e1lykti\u00f0 a\u00f0 vernda beri gott landb\u00fana\u00f0arland.
  \u00c1 B\u00fana\u00f0ar\u00feingi 2016 var \u00e1lykti\u00f0 um a\u00f0 \u201eMarkviss
  ver\u00f0i unnin a\u00f0 \u00fev\u00ed \u00e1 landsv\u00edsu \u00ed gegnum a\u00f0alskipulag
  sveitarf\u00e9laga a\u00f0 gott r\u00e6ktanlegt land s\u00e9 var\u00f0veitt\u201d
  (B\u00fana\u00f0ar\u00feing, 2016). Lagt er til, \u00ed samr\u00e6mi vi\u00f0 landsskipulagsstefnu,
  a\u00f0 Skipulagsstofnun hafi forg\u00f6ngu um a\u00f0 m\u00f3ta vi\u00f0mi\u00f0unarreglur
  \u00ed samr\u00e6mi vi\u00f0 \u00fear til b\u00e6ra a\u00f0ila.\\n\\nALPJ\u00d3\u00d0LEGAR
  SKULDBINDINGAR\\n\\nMarkmi\u00f0 Rammasamnings um loftlagsbreytingar er; \u201eA\u00f0
  koma \u00ed veg fyrir haettulega r\u00f6kun \u00e1 loftslagskerfinu af mannav\u00f6ldum,
  og tryggja \u00feannig a\u00f0 matv\u00e6laframlei\u00f0slu \u00ed heiminum ver\u00f0i
  ekki steftnt \u00ed haettu og a\u00f0 efnahagspr\u00fan geti haldi\u00f0 \u00e1fram
  \u00e1 sj\u00e1lfb\u00e6ran m\u00e1ta \u2026\u201d (Al\u00feingi \u00cdslands, 1992).\\n\\n\u00cd
  Ramsarsamningi kemur fram a\u00f0 \u00fea\u00f0 beri \u201eA\u00f0 stu\u00f0la a\u00f0
  verndun og skynsamlegri n\u00fdtingu votlendissv\u00e6\u00f0a \u00ed heiminum, s\u00e9rstaklega
  sem lifsv\u00e6\u00f0i fyrir votlendisfluga\u201d (Al\u00feingi \u00cdslands, 1971)
  og bent hefur veri\u00f0 a\u00f0 a\u00f0 \u00ed votlendi var\u00f0veitis mikil magn
  af kolefni sem losnar \u00fat \u00ed andr\u00famslofti\u00f0 vi\u00f0 burrkun og
  r\u00e6ktun lands. \u00fev\u00ed s\u00e9 verndun votlendis mikilv\u00e6g af fleiri
  \u00e1st\u00e6\u00f0um en bara vegna gr\u00f3\u00f0urs og fugla.\\n\\nJar\u00f0r\u00e6kt
  kann vissulega a\u00f0 hafa \u00e1hrif \u00e1 \u00feessu stefnum\u00f6rkun en stefnum\u00f6rkunin
  ein og s\u00e9r sker\u00f0ir \u00ed sj\u00e1lfu s\u00e9r ekki r\u00e6ktunarh\u00e6fni
  lands. Land \u00e1 \u00cdslandi hefur ekki veri\u00f0 afmarka\u00f0 \u00ed samr\u00e6mi
  vi\u00f0 \u00feessu stefnum\u00f6rkun.\\n\\n3. GOTT R\u00c6KTUNARLAND\\n\\n\u00deegar
  fjalla\u00f0 er um r\u00e6ktunarland er a\u00f0allega horft til lands sem hentar
  til kornr\u00e6ktar, land s\u00e9 tilt\u00f6lulega sl\u00e9tt, samfellt og ve\u00f0urfar
  \u00feannig a\u00f0 \u00fea\u00f0 n\u00e1i a\u00f0 jafna\u00f0i 1250 daggr\u00e1\u00f0um
  \u00e1 vaxtart\u00edma. B\u00e6tt r\u00e6ktunart\u00e6kni hefur gert \u00fea\u00f0
  m\u00f6gulegt a\u00f0 nytja land sem \u00e1\u00f0ur var l\u00edtt \u00e1hugaver\u00f0
  til akuryrkju t.d. vegna h\u00e1rra grunnvatnsst\u00f6\u00f0u e\u00f0a a\u00f0 jar\u00f0vegur
  er mj\u00f6g ryr. Eftir sem \u00e1\u00f0ur r\u00e6\u00f0ur hita\u00f0ar og birta
  miklu um m\u00f6guleika til kornr\u00e6ktar og \u00fev\u00ed skipa\u00f0 ha\u00f0
  lands yfir sj\u00f3 talver\u00f0u m\u00e1li \u00fe\u00f3tt halli lands og jar\u00f0vegar
  s\u00e9u ra\u00f0andi \u00fe\u00e6ttir. Halli lands skipa\u00f0 miklu m\u00e1li
  \u00fear sem land sem opna\u00f0 er \u00e1rlega skr\u00ed\u00f0ur meira undan halla
  au\u00f0 \u00feess sem h\u00e6tta \u00e1 \u00farrennsli eykst me\u00f0 auknum halla.\\n\\nSamkv\u00e6mt
  gr\u00f3fr\u00ed \u00e1\u00e6tlun J\u00f3natans Hermannssonar (J\u00f3natan Hermannsson,
  2009), er gott r\u00e6ktunarland, ne\u00f0an 200 m l\u00ednu, \u00e1 landinu \u00f6llu
  um 600 \u00fe\u00fasund ha. Pr\u00e1tt fyrir a\u00f0 \u00cdsland framleiti\u00f0
  \u00ed dag matv\u00e6li sem n\u00e6gja \u00fej\u00f3\u00f0inni byggi\u00f0 s\u00fa
  framlei\u00f0sla mikil til \u00e1 innflutllum a\u00f0f\u00f6ngum og kornmeti til
  manneldis er n\u00e6r allt flutt inn. Sv\u00edna-kjuklinga- og eggjaframlei\u00f0sla
  treysta einnig mikil til \u00e1 innfluttl f\u00f3\u00f0urkorn. \u00cd t\u00f6lum
  Hagstofunnar kemur fram a\u00f0 innflutningar f\u00f3\u00f0urvara j\u00f3kst nokku\u00f0
  st\u00f6\u00f0ugt til \u00e1rsins 2007 en \u00fe\u00e1 voru flutt inn t\u00e6p 88.000
  tonn af f\u00f3\u00f0urv\u00f6rum og er enn svipa\u00f0 2015 (Hagstofa \u00cdslands,
  2016).\\n\\n3.1. Flokkun lands\\n\\nG\u00e6\u00f0i lands eru mj\u00f6g misj\u00f6fn
  og bar af lei\u00f0andi hentar \u00fea\u00f0 misvel til hinna \u00fdmsu \u00fearfa
  \u00edb\u00faanna. \u00c1 \u00cdslandi er mikil \u00e1s\u00f3kn \u00ed land sem
  er ne\u00f0an 100 m en allir \u00fe\u00e9ttb\u00fdlissta\u00f0ir og meginhluti vegakerfisins
  liggur ne\u00f0an \u00feessarar h\u00e6\u00f0ar. Sama er a\u00f0 segja um \u00fativistarsv\u00e6\u00f0i
  s.s. \u00ed\u00fer\u00f3ttu- og tjaldsv\u00e6\u00f0i. \u00feessi sv\u00e6\u00f0i
  eru ekki \u00f3takm\u00f6rku\u00f0 og \u00fev\u00ed nau\u00f0synlegt a\u00f0 \u00edgrunda
  vel \u00e1kvar\u00f0anir um n\u00fdtingu \u00feeirra (\u00deorsteinn Gu\u00f0mundsson,
  2003).\\n\\nMynd 1. R\u00e6ktunarland \u00ed Kj\u00f3sarhreppi er vi\u00f0a \u00ed
  fjallsr\u00fatm.\\n\\nUmr\u00e6\u00f0an um \u00fe\u00f6rfina fyrir skilgreiningu
  \u00e1 akuryrkjulandi er ekki n\u00fd af n\u00e1linni h\u00e9r \u00e1 landi. \u00c1
  B\u00fana\u00f0ar\u00feingi 2010 var l\u00f6g\u00f0 fram svohlj\u00f3\u00f0andi
  \u00e1lyktun: \u201eB\u00fana\u00f0ar\u00feing 2010 telur br\u00fdnt a\u00f0 unninn
  ver\u00f0i vi\u00f0urkenndur sta\u00f0all fyrir r\u00e6ktanlegt land og gefinn \u00fat
  sem lei\u00f0beiningar til nota vi\u00f0 skipulagsvinnu og stefnum\u00f3tun \u00ed
  landn\u00fdtingu. Markmi\u00f0 \u00feeirrar vinnu v\u00e6ri a\u00f0 skilgreina hva\u00f0
  og hvar er r\u00e6ktanlegt land, me\u00f0 langt\u00edmama\u00f0smuni \u00ed huga\u201c
  (\u00c1slaug Helgad\u00f3ttir o.fl. 2011). \u00cd framhaldi \u00feeirrar sambygktar
  voru l\u00f6g\u00f0 fram dr\u00f6g a\u00f0 skilgreiningu \u00e1 akuryrkjulandi sem
  var hugsu\u00f0 til a\u00f0 hafa til hl\u00ed\u00f0sj\u00f3nar \u00feegar meti\u00f0
  er hva\u00f0a land hentar til akuryrkju:\\n\\n1. \u201eMi\u00f0a\u00f0 skal vi\u00f0
  a\u00f0 land s\u00e9 vinnanlegt ni\u00f0ur \u00e1 25 cm d\u00fdpi svo a\u00f0 gri\u00f0
  hj\u00e1rdi ekki pl\u00e6gingu.\\n\\n2. Framr\u00e6st land er vi\u00f0a mikilv\u00e6gasta
  akuryrkjuland landsins. \u00deegar hefur vorti\u00f0 r\u00e6stur fram og leggja
  \u00feessi vi\u00f0mi\u00f0 \u00fea\u00f0 land fyrst og fremst til grundvallar \u00feegar
  akuryrkjuland er skilgreint.\\n\\nJafnframt er bent \u00e1 a\u00f0 \u00f3raska\u00f0
  votlendi. 3 ha e\u00f0a meira, n\u00fdtur s\u00e9rstakrar verndar skv. l\u00f6gum
  um n\u00e1tt\u00faruvernd og \u00feurfu \u00fev\u00ed till\u00f6gur a\u00f0 r\u00f6skun
  votlendis \u00ed skipulagi a\u00f0 taka tillit til \u00feess.\\n\\n3. Landhalli
  m\u00e1 ekki vera meiri en 5-10%, h\u00e1\u00f0 jar\u00f0vegssger\u00f0, til \u00feess
  a\u00f0 for\u00f0ast jar\u00f0vegsrof (hallatala h\u00e1\u00f0 frekari ranns\u00f3knun
  og akv\u00f6r\u00f0unum).\\n\\n4. Akuryrkjuland skal skilgreina sem sl\u00edkt fram
  \u00e1 \u00e1r- og vatnsbakka en \u00feekja vatnshelgunar s\u00ed\u00f0an l\u00f6g\u00f0
  yfir til frekari takm\u00f6rkunar og t\u00e6kja \u00fe\u00e1 af helgunarv\u00e6\u00f0a
  vatna og vatnsf\u00e1lfa.\\n\\n5. Til \u00feess a\u00f0 teljast akuryrkjuland \u00fearf
  \u00fea\u00f0 a\u00f0 vera svo st\u00f3rt a\u00f0 n\u00e1 megi 3 ha spildum samfelldum
  hi\u00f0 minnstu \u00e1n vandkv\u00e6\u00f0a. Skur\u00f0ir inni \u00ed spildum teljast
  \u00fe\u00f3 ekki rj\u00fafa samfellu\u201c (\u00c1slaug Helgad\u00f3ttir o.fl.
  2011).\\n\\nFrekari flokkun akuryrkjulands:\\n\\nAkuryrkjuland h\u00e9r a\u00f0
  ofan er, skv. \u00e1lyktun B\u00fana\u00f0ar\u00feings, flokka\u00f0 frekar eins
  og sj\u00e1 m\u00e1 h\u00e9r a\u00f0 ne\u00f0an (ra\u00f0a\u00f0 eftir ver\u00f0m\u00e6ti):\\n\\nA.
  \u201eAfbrag\u00f0s akuryrkjuland: Framr\u00e6star m\u00fdrar og m\u00f6lendi og
  >1250 daggr\u00e1\u00f0ur (D\u00b0)\u00b9 \u00e1 vaxtart\u00edma.\\n\\nB. Gott akuryrkjuland:
  Framr\u00e6star m\u00fdrar og m\u00f6lendi og 1000-1250 daggr\u00e1\u00f0ur (D\u00b0)
  \u00e1 vaxtart\u00edma; Melar og sandar og >1250 daggr\u00e1\u00f0ur (D\u00b0) \u00e1
  vaxtart\u00edma.\\n\\nC. M\u00f6gulegt akuryrkjuland: Melar og sandar og 1000-1250
  daggr\u00e1\u00f0ur (D\u00b0) \u00e1 vaxtart\u00edma.\\n\\nR\u00e9tt er a\u00f0
  \u00edtreka a\u00f0 landg\u00e6\u00f0i eru ekki f\u00f3st st\u00e6r\u00f0. H\u00e6gt
  er a\u00f0 b\u00e6ta r\u00e6ktunarland \u00feeim me\u00f0 pl\u00f6ntuvali og ibl\u00f6ndun
  l\u00edfr\u00e6ns efnis eins og b\u00fafj\u00e1rab\u00fa\u00f0ar. Land sem \u00ed
  dag er n\u00e6ringarsna\u00f0ur e\u00f0a vi\u00f0kv\u00e6mt fyrir vindrofi\\n\\n\u00b9
  Daggr\u00e1\u00f0ur er hitasumma me\u00f0alhita daga \u00feegar hiti er yfir 0\u00b0
  \u00e1 vaxtart\u00edma. D\u00e6mi: me\u00f0alhiti j\u00fal\u00edma\u00f0na\u00f0ar
  \u00e1 H\u00e6l \u00ed Gn\u00fapverjahreppi var 13,0\u00b0C \u00e1ri\u00f0 2008
  sem margfalda\u00f0 er me\u00f0 31 degi skilar \u00fe\u00e1 403,0 daggr\u00e1\u00f0um
  (D\u00b0) yfir j\u00fal\u00ed m\u00e1nu\u00f0.\\n\\ng\u00e6ti breyst \u00ed t\u00edmans
  r\u00e1s. Einnig ber a\u00f0 hafa \u00ed huga a\u00f0 akuryrkjuland st\u00e6kkar
  og minnkar \u00ed takt vi\u00f0 langt\u00edma sveiflur \u00ed hita. Bessa flokkun
  \u00fearf \u00fev\u00ed a\u00f0 endursko\u00f0a ef forsendur breytast verulega\u201d
  (\u00c1slaug Helgad\u00f3ttir o.fl. 2011).\\n\\nFram kemur \u00ed sk\u00fdrslu nefndar
  til sj\u00e1var\u00fatvegs- og landb\u00fana\u00f0arr\u00e1\u00f0herra 2010 a\u00f0
  t\u00e6plega 25.000 km\u00b2 landsins s\u00e9u undir 200 m h.y.s og bar a\u00f0
  s\u00e9 au\u00f0r\u00e6ktanlegt land um e\u00f0a yfir 600.000 ha (um 6.000 km\u00b2)
  sem er um 25% af \u00f6llum landi undir 200 m h\u00e6\u00f0 yfir sj\u00f3 (\u00de\u00f3r\u00f0ur
  Halld\u00f3rsson o.fl. 2010). Land er afmarka\u00f0 eftir h\u00e6\u00f0 yfir sj\u00f3
  en almennt er tal\u00f0 a\u00f0 sunnan- og vestanlands marki 100 m h\u00e6\u00f0arl\u00edna
  \u00fe\u00e1 h\u00e6\u00f0 \u00fear sem v\u00e6nta m\u00e1 sumarhita yfir 10\u00b0C
  a\u00f0 me\u00f0altali e\u00f0a 1300 D\u00b0 (\u00c1slaug Helgad\u00f3ttir og J\u00f3natan
  Hermannsson, 2003).\\n\\n3.2. Ve\u00f0urfar\\n\\nAlmennt l\u00e6kkar hitastig um
  t\u00e6plega 1 gr\u00e1\u00f0u fyrir hverja 100 m h\u00e6kkun og hitafar r\u00e6\u00f0ur
  mestu um \u00fea\u00f0 hv\u00f8rnig tekst til me\u00f0 r\u00e6ktun \u00e1 \u00cdslandi,
  \u00fev\u00ed \u00farkoma er sjaldan takmarkandi \u00fe\u00e1ttur (P\u00e1ll Berg\u00fe\u00f3rsson,
  1996). \u00c1 \u00fea\u00f0 ber einnig a\u00f0 l\u00edta a\u00f0 undantekningarliti\u00f0
  r\u00fdrnar gr\u00f3\u00f0urhulan og jar\u00f0vegs\u00feykktin me\u00f0 vaxandi
  h\u00e6\u00f0 yfir sj\u00f3.\\n\\nMynd 2. Sumarhiti \u00ed Reykjav\u00edk (J\u00f3natan
  Hermannsson, 2015).\\n\\n3.3. Jar\u00f0vegur\\n\\nAnnar \u00fe\u00e1ttur sem skiptir
  miklu m\u00e1li vi\u00f0 r\u00e6ktun er jar\u00f0vegurinn sj\u00e1lfur en jar\u00f0vegur
  \u00e1 \u00cdslandi \u00feykir mj\u00f6g frj\u00f3samur. \u00cd vi\u00f0tali vi\u00f0
  Baendabl\u00f6\u00f0 vegna \u00fatkomu b\u00f3karinnar Soils of Iceland segir \u00d3lafur
  Arnalds; \u201eGj\u00f3skan \u00ed jar\u00f0veginum er a\u00f0 mestu leytt glerkennt
  efni sem ve\u00f0rast hratt og ve\u00f0run h\u00e9r \u00fev\u00ed ein s\u00fa hra\u00f0asta
  \u00ed heimi og \u00fatfelling steinda \u00fev\u00ed mj\u00f6g hr\u00e1\u00f0. En
  leirsteindirnar eru ansi s\u00e9rstakar og eitt sem einkennir \u00fe\u00e6r er skortur
  \u00e1 samlo\u00f0un. \u00c1 m\u00f3ti kemur a\u00f0 hann heldur vel vatni og hefur
  r\u00edka tilhneingingu til a\u00f0 safna \u00ed sig l\u00edfr\u00e6num efnum og
  fyrir vi\u00f0ki er hann mj\u00f6g frj\u00f3samur. \u00deetta \u00fe\u00fd\u00f0ir
  a\u00f0 ef gr\u00f3\u00f0ur n\u00e6r \u00e1 anna\u00f0 bor\u00f0 a\u00f0 festa r\u00e6tur
  og f\u00e6r fri\u00f0 til a\u00f0 dafna myndast h\u00e9r frj\u00f3 j\u00f6r\u00f0,\u201d
  (Vilmundur Hansen, 2015). \u00cdslenskur jar\u00f0vegur er um margt fr\u00e1brug\u00f0in
  jar\u00f0vegi \u00ed \u00f6\u00f0rum l\u00f6ndum og r\u00e6\u00f0ur \u00fear eldfjallaj\u00f6r\u00f0in
  miklu, \u00f3r ve\u00f0run gj\u00f3sukuefna stu\u00f0lar a\u00f0 \u00f6rr\u00ed
  myndun n\u00e6ringarefna. Miki\u00f0 \u00e1fok og mikil vatnsheldni mynda m.a. s\u00e9rst\u00f6\u00f0u
  \u00edslensk jar\u00f0vegs (\u00d3lafur Arnalds,\\n\\nSamsetning hans er mismunandi
  og hentar hann misvel til r\u00e6ktunar auk \u00feess sem \u00feykktt l\u00edfr\u00e6na
  hluta hans er mismikil.\\n\\nJar\u00f0vegsrof er eitt st\u00e6rsta umhverfisvandam\u00e1l
  jar\u00f0ar og jar\u00f0vegsrof af v\u00f6ldum vatns e\u00f0a vinda er st\u00f6\u00f0ug
  v\u00e1. H\u00e6ttan er mest \u00feegar land er n\u00fdunni\u00f0 e\u00f0a r\u00e9tt
  eftir s\u00e1ningu. Mj\u00f6g hratt dregur \u00far h\u00e6ttu af v\u00f6ldum vinda
  eftir \u00fev\u00ed sem gr\u00f3\u00f0r\u00farhula vex en haetta vegna vatnsrofs
  er n\u00e6r alltaf fyrir hendi \u00ed \u00f6krum, \u00fev\u00ed land sem \u00e1rlega
  er pl\u00e6gt n\u00e6r litl\u00f3 a\u00f0 bindast saman. E\u00f0l\u00edlega dregur
  \u00far h\u00e6ttu \u00e1 \u00fev\u00ed, samhli\u00f0a minni landhalla. \u00dev\u00ed
  var horft til \u00feess vi\u00f0 flokkun lands og telst land undir 5-10% \u00fea\u00f0
  flatt a\u00f0 litil h\u00e6tta s\u00e9 \u00e1 vatnsrofi. S\u00edlkt land er \u00e1kj\u00f3sanlegt
  til r\u00e6ktunar s\u00e9 \u00fea\u00f0 au\u00f0velt yfirfer\u00f0ar og litl\u00f3
  grj\u00f3t/hraun vi\u00f0 yfirbor\u00f0.\\n\\nVi\u00f0 flokkun lands \u00ed Kj\u00f3sarhreppi,
  sj\u00e1 n\u00e1nar kafla 5.4, er h\u00f6f\u00f0 hli\u00f0sj\u00f3n a\u00f0 \u00feessum
  \u00fe\u00e1ttum sem h\u00e9r hefur veri\u00f0 fjalla\u00f0 um, en teki\u00f0 er
  mi\u00f0 af \u00feeim m\u00e6likvar\u00f0a sem a\u00f0alskipulag sveitarf\u00e9lagssins
  er unni\u00f0 \u00ed. E\u00f0l\u00edlega var ekki fari\u00f0 \u00fat \u00ed greiningu
  \u00e1 jar\u00f0vegi, enda er \u00fea\u00f0 mikil vinna og kostna\u00f0arsamt. Peirri
  a\u00f0fer\u00f0 var beitt a\u00f0 meta gr\u00f3flega skv. fyrirliggjandi g\u00f6gnum
  hvar v\u00e6ri \u00fea\u00f0 \u00feykkur jar\u00f0vegur a\u00f0 hann hamla\u00f0i
  ekki jar\u00f0vinnslu. Samhli\u00f0a var meti\u00f0 me\u00f0 sj\u00f3nmati og fyrirliggjandi
  g\u00f6gnum hva\u00f0 v\u00e6ri r\u00fdrari jar\u00f0vegur og aurasv\u00e6\u00f0i
  e\u00f0a n\u00e6ringarr\u00edkur moldarjar\u00f0vegar. Flokkunin er ekki einhlikt
  og \u00fev\u00ed \u00fearf a\u00f0 g\u00e6ta var\u00f0a\u00f0ar og jafnr\u00e6\u00f0is
  \u00feegar henni er beitt vi\u00f0 a\u00f0 meta landn\u00fdtingu og breytingar \u00e1
  henni. Vi\u00f0 flokkun landb\u00fana\u00f0arlands er ba\u00f0i gengi\u00f0 \u00fat
  fr\u00e1 r\u00e6ktunarh\u00e6fni landsins og n\u00fdtingarh\u00e6fni \u00fe.e. hversu
  au\u00f0velt er a\u00f0 n\u00fdta landi\u00f0 me\u00f0 \u00feeim velb\u00fana\u00f0i
  sem helst er nota\u00f0ur. \u00de\u00e1 ber a\u00f0 hafa \u00ed huga n\u00e1kv\u00e6mni
  m\u00e6likvar\u00f0a, a\u00f0 jafna\u00f0i eru ekki dregin \u00fat sv\u00e6\u00f0i
  minni en 5 ha (50.000 m\u00b2) og \u00fev\u00ed falla \u00e1kv\u00e6\u00f0in sv\u00e6\u00f0i
  t.d. \u00ed g\u00f6\u00f0an r\u00e6ktunarflokk \u00fer\u00e1tt fyrir a\u00f0 t.d.
  klettaholt e\u00f0a skur\u00f0ir s\u00e9u innan \u00feess. \u00de\u00e1 eru a\u00f0
  jafna\u00f0i ekki dregin \u00fat sv\u00e6\u00f0i undir 5 ha st\u00e6r\u00f0.\\n\\nMynd
  3. Horft \u00ed \u00e1tt a\u00f0 Me\u00f0alfellsvatni.\\n\\n4. KJ\u00d3SARHREPPUR\\n\\nKj\u00f3sarhreppur
  er sunnan Hvalfjar\u00f0ar og liggur a\u00f0 sj\u00f3 milli \u00f3s Ka\u00f0afells\u00e1r
  inn undir Botn \u00ed Hvalfir\u00f0i. \u00dea\u00f0 sem einkennir helst landslagi\u00f0
  eru gr\u00f6sugir dalir inni \u00e1 milli h\u00e1rra fjalla, sem risa vi\u00f0a
  \u00ed t\u00e6pa 500m og brattlendi er mikil upp fr\u00e1 bygg\u00f0inni. Innst
  er M\u00falafjall, \u00fe\u00e1 Reynivallah\u00e1ls og yst \u00ed Eyrafjall sem
  \u00f6ll n\u00e1 \u00ed sj\u00f3 fram og skipta bygg\u00f0inni nokku\u00f0 upp.
  \u00cd mi\u00f0ri Kj\u00f3s stendur svo Me\u00f0alfell, t\u00e6plega 400m h\u00e1tt
  sem skiptir meginbygg\u00f0inni. Nokkur bygg\u00f0 er kring um Eyrafjall og \u00ed
  Brynjudal eru 3 b\u00fdli. Bygg\u00f0in stendur v\u00ed\u00f0ast \u00ed hl\u00ed\u00f0arfar\u00e6tinum
  og r\u00e6ktunarlandi\u00f0 er \u00fear vi\u00f0 og \u00ed dalbotninum.\\n\\n4.1.
  Sta\u00f0h\u00e6ttir\\n\\nR\u00e6ktanlegt land \u00ed Kj\u00f3sarhreppi liggur \u00e1
  bilinu 0 \u2013 200 m \u00feannig a\u00f0 h\u00e6\u00f0 lands yfir sj\u00f3 er ekki
  mj\u00f6g takmarkandi \u00fe\u00e1ttur var\u00f0andi kornr\u00e6kt. Halli lands
  \u00ed sveitarf\u00e9laginu hamlar hins vegar \u00ed m\u00f6rgum tilfellum akuryrkju
  en landi\u00f0 er vi\u00f0a nokku\u00f0 mish\u00e6\u00f0\u00f3tt. Fjallshl\u00ed\u00f0ar
  eru brattar, gr\u00fdttar og nokku\u00f0 um grj\u00f3t n\u00e1i ni\u00f0ur \u00ed
  dalina. \u00cd dalbotni eru vi\u00f0a klapparholt sem kl\u00edpfa upp m\u00f6guleg
  r\u00e6ktunar\u00f6nd og \u00e6tla m\u00e1 a\u00f0 hindri e\u00f0illegt grunnvatnsrennsli
  \u00ed sumum tilfellum. Innar \u00ed Kj\u00f3sinni, \u00ed Mi\u00f0dal og Brynjudal
  er jar\u00f0vegur oft grynri auk \u00feess sem halli hefur aukin \u00e1hrif \u00e1
  r\u00e6ktunarm\u00f6guleika til akuryrkju. \u00de\u00e1 eru sandar og m\u00f6l me\u00f0fram
  \u00e1m auk \u00feess sem vi\u00f0a er myrlendi ne\u00f0arlega \u00ed fjallshl\u00ed\u00f0unum
  og \u00ed dalbotnum. Land hefur vi\u00f0a veri\u00f0 r\u00e6st fram en sums sta\u00f0ar
  er land \u00fea\u00f0 blautt, flatt og h\u00e1 grunnvatnssta\u00f0a a\u00f0 illm\u00f6gulegt
  er a\u00f0 r\u00e6sa landi\u00f0 fram s.s. vi\u00f0\\n\\nK\u00e1ranessef/Hur\u00f0arbakssef.
  Bent er \u00e1 a\u00f0 skv. 61. gr. n\u00e1tt\u00faruverndarlaga (60/2016) nj\u00f3ta
  tiltekin vistkerfi s\u00e9rstakrar verndar s.s. \u201ea. votlendi, svo sem hallam\u00fdrar,
  fl\u00f3ar, fl\u00e6\u00f0im\u00fdrar, r\u00fastam\u00fdrar, [20.000 m\u00b2] a\u00f0
  flatarm\u00e1li e\u00f0a st\u00e6rri\u2026\u201c (Al\u00feingi Islands, 2015).\\n\\nVatnsb\u00faskapur
  er nokku\u00f0 g\u00f3\u00f0ur og allmargir l\u00e6kir falla ni\u00f0ur fjallshl\u00ed\u00f0arnar
  og sameinast \u00ed \u00e1r sem li\u00f0ast eftir dalbotnunum \u00ed \u00e1tt til
  sj\u00e1var. Helstar eru Lax\u00e1, Bug\u00f0a, D\u00e6lis\u00e1, Skor\u00e1, Mi\u00f0dals\u00e1,
  Ki\u00f0afells\u00e1 og Brynjudals\u00e1. P\u00e1 eru nokkur v\u00f6tn \u00ed bygg\u00f0inni
  og \u00feeirra st\u00e6rst er Me\u00f0alfellsvatn.\\n\\nLandi\u00f0 er nokku\u00f0
  mish\u00e6\u00f0\u00f3tt en flatlendi er engu a\u00f0 s\u00ed\u00f0ur \u00fe\u00f3
  nokku\u00f0 einkum sunnan megin vi\u00f0 Me\u00f0alfellsvatn, \u00ed Lax\u00e1r\u00f0al
  og \u00ed Brynjudal. Graslendi er mikil og v\u00ed\u00f0a er gott r\u00e6ktunarland
  \u00fe\u00f3 a\u00f0 nokku\u00f0 s\u00e9 um malar\u00e1sa og grj\u00f3tholt \u00e1
  l\u00e1glendinu.\\n\\nN\u00e1l\u00e6gt fj\u00f6llum getur or\u00f0i\u00f0 nokku\u00f0
  hvasst og jafnvel svipti vindasamt en vindar geta spiltt uppskeru og veri\u00f0
  hamlandi vi\u00f0 kornr\u00e6kt.\\n\\n\u00cd \u00e1kve\u00f0num tilfellum kann markmi\u00f0
  um r\u00e6ktun korns a\u00f0 stangast \u00e1 vi\u00f0 \u00f6nnur markmi\u00f0 stj\u00f3rnavalda
  s.s. n\u00e1tt\u00faruminjaskr\u00e1, verndun votlendis og kolefnisbindingu \u00ed
  jar\u00f0vegi en ekki er tekin afsta\u00f0a til \u00feeirra stefnumi\u00f0a vi\u00f0
  \u00feessu flokkun. Ef og \u00feegar \u00feau sv\u00e6\u00f0i hafa veri\u00f0 afm\u00f6rku\u00f0
  \u00e1 uppdr\u00e6tti geta skipulagsfyrv\u00f6ld afmarka\u00f0 \u00fea\u00f0 land
  og vernda\u00f0 \u00fea\u00f0 land fyrir annarri landn\u00fdtingu, s.s. r\u00e6ktun
  en s\u00fa verndun breytir \u00ed sj\u00e1lfu s\u00e9r engu var\u00f0andi r\u00e6ktunarh\u00e6fni
  landsins.\\n\\nMynd 4. Vistger\u00f0arkort N\u00e1tt\u00farufr\u00e6\u00f0istofnunar
  Islands.\\n\\n4.2. Kornuppskera\\n\\nUpplysingar um kornuppskera fr\u00e1 \u00e1rinu
  2002 eru fengnar hj\u00e1 Hagstofu \u00cdslands (Hagstofa \u00cdslands, 2017). P\u00f3nokkur
  kornuppskera var \u00e1 fyrstu \u00e1rum aldarnarinnar en heldur hefur dregi\u00f0
  \u00far henni s\u00ed\u00f0an. \u00c1ri\u00f0 2002 var uppskeran 65 tonn, 100 tonn
  \u00e1ri\u00f0 2003 en a\u00f0eins 28 tonn \u00e1ri\u00f0 2005. \u00c1ri\u00f0 2008
  var lakast en \u00fe\u00e1 var uppskeran a\u00f0eins 10 tonn. T\u00f6lur fyrir \u00e1ri\u00f0
  2010 fengust ekki. Kornuppskera j\u00f6kst heldur \u00e1ri\u00f0 2016 og var 45
  tonn.\\n\\nMynd 5. Kornuppskera \u00e1 landinu \u00f6llu og \u00ed Kj\u00f3sarhreppi
  (Hagstofa \u00cdslands, 2017).\\n\\n5. FLOKKUN LANDS \u00cd KJ\u00d3SARHREPPI\\n\\n5.1.
  Markmi\u00f0\\n\\nMarkmi\u00f0i\u00f0 me\u00f0 \u00feessari vinnu er a\u00f0 kortlegga
  gr\u00f3flega landb\u00fana\u00f0arland \u00ed Kj\u00f3sarhreppi og a\u00f0 s\u00fa
  kortlagning geti n\u00fdst \u00edb\u00faum og landeigendum vi\u00f0 skipulagsvinnu
  einstakra jar\u00f0a e\u00f0a landareigna. \u00c1hersla er l\u00f6g\u00f0 \u00e1
  a\u00f0 afmarka land sem hentar vel til kornreaktar.\\n\\nMeginmarkmi\u00f0 me\u00f0
  vinnu \u00feessari er a\u00f0:\\n\\n- Vi\u00f0urkennt ver\u00f0i a\u00f0 vernda
  beri gott r\u00e6ktunarland eins og a\u00f0rar au\u00f0lindir \u00fej\u00f3\u00f0arinnar.\\n-
  Trygga sem best a\u00f0 g\u00f3\u00f0u r\u00e6ktunarlandi ver\u00f0i ekki spilt
  me\u00f0 \u00f3\u00e1byrgu skipulagi e\u00f0a landn\u00fdtingu.\\n- Trygga sem best
  hn\u00f6kralausa samb\u00fa\u00f0 landb\u00fana\u00f0ar og annarrar landnotkunar.\\n-
  A\u00f0alskipulag sveitarf\u00e9lagsins ver\u00f0i, eftir \u00fev\u00ed sem h\u00e6gt
  er, n\u00fdtt sem t\u00e6ki til a\u00f0 tryggja ofangreind atri\u00f0i.\\n\\n5.2.
  G\u00f6gn og a\u00f0fer\u00f0ir\\n\\nEftirfarandi g\u00f6gn voru notu\u00f0 vi\u00f0
  flokkun landb\u00fana\u00f0arlands \u00ed Kj\u00f3sarhreppi.\\n\\n- Landb\u00fana\u00f0arh\u00e1sk\u00f3li
  \u00cdslands hefur, \u00ed samstarfi vi\u00f0 fleiri a\u00f0ila, unni\u00f0 svonefnt
  Nytjalandskort sem byggir \u00e1 gervitunglag\u00f6gnnum (Landb\u00fana\u00f0arh\u00e1sk\u00f3li
  \u00cdslands, \u00e1n \u00e1rtals). \u00dear var endurkast af yfirbor\u00f0i landsins
  meti\u00f0 \u00e1 landsvisu. T\u00f6lva var l\u00e1tnir greina endurkasti\u00f0
  og ra\u00f0a landinu \u00ed tiltekna flokka eftir landger\u00f0um og s\u00ed\u00f0an
  voru \u201estikkprufur\u201d teknar \u00fear sem fari\u00f0 var \u00e1 vettvang
  og sko\u00f0a\u00f0 hvernig til ha\u00f0i tekist. Flokkunin var s\u00ed\u00f0an
  lei\u00f0r\u00e9tt eftir sko\u00f0un lands \u00ed vettvangsfer\u00f0um. \u00deessi
  a\u00f0fer\u00f0afr\u00e6\u00f0i hefur \u00feann kost a\u00f0 h\u00e6gt er a\u00f0
  greina st\u00f3r sv\u00e6\u00f0i \u00e1 \u00f6\u00f0ryrari h\u00e1tt en vi\u00f0
  greiningu, mati\u00f0 er samr\u00e6mt yfir sta\u00f0ra sv\u00e6\u00f0i og \u00fea\u00f0
  er a\u00f0 mestu \u00f3h\u00e1\u00f0 pers\u00f3nulegu mati. \u00d3kostir eru a\u00f0
  stundum er svipa\u00f0 endurkast fr\u00e1 \u00f3l\u00edku yfirbor\u00f0i lands,
  votlendi og sk\u00f3garsv\u00e6\u00f0i skila t.d. stundum svipu\u00f0u endurkasti.
  Gervitunglag\u00f6gn skila heldur ekki n\u00e1kv\u00e6mlega sams konar g\u00f6gnum
  \u00fear sem \u00feau eru ekki \u00f6ll fr\u00e1 sama t\u00edma, \u00fev\u00ed kann
  a\u00f0 ver\u00f0a mismunandi endurkast fr\u00e1 sams konar yfirbor\u00f0i. Auk
  \u00feess eru \u00feau g\u00f6gn sem til ver\u00f0a me\u00f0 \u00feessari a\u00f0fer\u00f0
  \u00feung og erf\u00f0i \u00ed notkun nema \u00feau s\u00e9u mj\u00f6g mikil unnin.
  Sj\u00e1 n\u00e1nar \u00e1 heimas\u00ed\u00f0u verkefnisins; www.nytjaland.is.\\n\\n-
  Landm\u00e6lingar \u00cdslands sj\u00e1 um svonefnt Corine \u2013 verkefni sem er
  samevr\u00f3ptskt landflokkunarverkefni \u00fear sem land er flokka\u00f0 skv. \u00e1kve\u00f0num
  sta\u00f0li og unnin me\u00f0 s\u00f6mu a\u00f0fer\u00f0um \u00ed \u00fe\u00e1ttt\u00f6kul\u00f6ndunum.
  G\u00f6gn eru unnin eftir sta\u00f0r\u00e6num fjark\u00f6nnunarg\u00f6gnum (gervitunglamyndum)
  auk Nytjalands og g\u00f6gnum fr\u00e1\\n\\nfj\u00f6lm\u00f6rgum stofnunum (Kolbeinn
  \u00c1rnason & Ingvar Matthiasson, 2009). Corine kortlagningin er a\u00f0gengileg
  \u00e1 vef Landm\u00e6linga \u00cdslands, www.lmi.is.\\n\\n- Loftmyndir ehf hafa
  teki\u00f0 myndir \u00far lofti af landinu og unni\u00f0, m.a. hnittsett \u00fe\u00e6r.
  S\u00edlkar myndir voru nota\u00f0ar til afm\u00f6rkunar \u00e1 flokkum. Loftmyndir
  s\u00fdna landi\u00f0 mj\u00f6g vel, en hafa ber \u00ed huga a\u00f0 \u00fe\u00e6r
  eru ekki allar teknar \u00e1 sama t\u00edma. Auk \u00feess kann t.d. vatnssta\u00f0a
  a\u00f0 vera misj\u00f6fn fr\u00e1 einum t\u00edma til annars og \u00fev\u00ed ekki
  h\u00e6gt a\u00f0 n\u00fdta loftmyndir eing\u00f6ngu t.d. til a\u00f0 afmarka votlendi.\\n\\n-
  Loftmyndir ehf unnu hallakort af sv\u00e6\u00f0inu \u00fat fr\u00e1 h\u00e6\u00f0arl\u00edn\u00fam\u00f3deli.
  \u00de\u00e6r var reikna\u00f0ur \u00fat halli lands og \u00fea\u00f0 flokka\u00f0
  \u00ed eftirfarandi flokka: 0-5%, 5-10%, 10-15%, 15-25% og yfir 25%. Me\u00f0 \u00feessari
  a\u00f0fer\u00f0 f\u00e9kkst kort sem nota\u00f0 er til hli\u00f0sj\u00f3nar vi\u00f0
  afm\u00f6rkun lands.\\n\\n- Brynjla Gu\u00f0mundsd\u00f3ttir hj\u00e1 Sams\u00fdn
  vann verkefni \u00ed Kj\u00f3s um \u00fer\u00f3un stafr\u00e6nna a\u00f0fer\u00f0a
  til a\u00f0 meta r\u00e6kta\u00f0 og r\u00e6ktanlegt land. Hj\u00e1 henni fengust
  einnig hallakort og votlendiskort. Hallakortunum var skipt upp \u00ed eftirfarandi
  flokka: 0-2%, 2-5% og 5-10%. \u00dev\u00ed var h\u00e6gt a\u00f0 flokka land nokku\u00f0
  n\u00e1kv\u00e6mlega eftir halla landsins.\\n\\n- N\u00e1tt\u00farufr\u00e6\u00f0istofnun
  \u00cdslands hefur unnni\u00f0 a\u00f0 vistger\u00f0akortum, sem gefin voru \u00fat
  \u00ed apr\u00edl 2017. Funda\u00f0 var me\u00f0 Sigur\u00f0i Magn\u00fassyni, Sigmari
  Met\u00fasalemssyni o.fl. \u00ed j\u00fan\u00edm\u00e1nu\u00f0i til a\u00f0 fara
  yfir hverni\u00f0 n\u00fdta m\u00e6tti \u00feau g\u00f6gn sem best til flokkunar
  landb\u00fana\u00f0arlands. \u00cd framhaldi \u00feeirra funda voru fyrirl\u00edggjandi
  dr\u00f6g flokkunar landb\u00fana\u00f0arlands l\u00f6g\u00f0 ofan \u00e1 vistger\u00f0arkortin.
  Me\u00f0 vistger\u00f0arkortunum fengust fj\u00f6lbreyttar uppl\u00fdsingar m.a.
  um gr\u00fdttni sv\u00e6\u00f0a.\\n\\n- Jar\u00f0vegskort af \u00cdslandi, \u00ed
  gr\u00f3fum skala, var unnni\u00f0 af Ranns\u00f3knastofnun Landb\u00fana\u00f0arins
  \u00e1ri\u00f0 2001.\\n\\n- G\u00f6gn um jar\u00f0veg, jar\u00f0fr\u00e6\u00f0i
  og gr\u00f3\u00f0ur \u00e1samt votlendi og annarri verndun voru h\u00f6f\u00f0 til
  hli\u00f0sj\u00f3nar. \u00deau g\u00f6gn hafa veri\u00f0 unnin \u00e1 grunni \u00fdmissa
  gagna, m.a. fr\u00e1 LBH\u00cd (Rala), N\u00e1tt\u00farufr\u00e6\u00f0istofnun,
  Landm\u00e6lingum o.fl.\\n\\n- \u00de\u00e1 hafa veri\u00f0 unnar skyrslur, \u00e1lyktanir
  og minnisbl\u00f6\u00f0 \u00ed tengslum vi\u00f0 r\u00e1\u00f0stefnur o.fl. sem
  au\u00f0velt er a\u00f0 n\u00e1lgast \u00e1 vefnum. Auk \u00feess \u00f3nnur grunn\u00f6ggn
  og almenn kortag\u00f6gn sem til eru. \u00de\u00e6r m\u00e1 nefna sveitarf\u00e9lagam\u00f6rk,
  b\u00e6i, vegi, skur\u00f0i o.fl.\\n\\n5.3. A\u00f0fer\u00f0arfr\u00e6\u00f0i\\n\\nLandsv\u00e6\u00f0i
  sveitarf\u00e9lagsins var meti\u00f0 og afmarka\u00f0 gr\u00f3flega eftir ofangreindum
  g\u00f6gnum \u00e1\u00f0ur en fari\u00f0 var um sv\u00e6\u00f0i\u00f0 og land meti\u00f0
  sj\u00f3nr\u00e6nt, \u00fear sem var m.a. horft til n\u00faverandi r\u00e6ktunar,
  vatnsst\u00f6\u00f0u (skur\u00f0a, tjarna o.fl.) og \u00e1fer\u00f0ar lands, einkum
  halla. Vi\u00f0 vettvangsathugun var me\u00f0 \u00ed f\u00f3r Stef\u00e1n Skaftason
  fyrrum r\u00e1\u00f0nautur og h\u00e9ra\u00f0sfulltr\u00fai Landgra\u00f0slu r\u00edkisins
  \u00ed Pingeyjars\u00fdslu, en hann hefur langa reynslu af jar\u00f0r\u00e6kt nor\u00f0anlands
  og me\u00f0 reynslu af kornr\u00e6kt. Loks var funda\u00f0 me\u00f0 nokkrum heimam\u00f6nnum
  auk st\u00fdrh\u00f3ps \u00ed tengslum vi\u00f0 heildarendursko\u00f0un a\u00f0alskipulagsins
  en \u00feau \u00feekkja vel til \u00ed sveitarf\u00e9laginu og komu \u00feau me\u00f0
  \u00e1bendingar og athugasemdir. \u00de\u00e1 hefur veri\u00f0 leita\u00f0 \u00ed
  smi\u00f0ju J\u00f3natans Hermannssonar sem unni\u00f0 hefur um \u00e1rabil a\u00f0
  tilraunum \u00ed kornr\u00e6ktun. Einnig var leita\u00f0 til Fri\u00f0riks J\u00f3nssonar
  \u00e1 Hvanneyri sem hefur komi\u00f0 a\u00f0 r\u00e6ktunarm\u00e1lum og Vals \u00deorvaldssonar
  \u00e1 Minna-Mosfellri en hann var jar\u00f0r\u00e6ktarr\u00e1\u00f0unautur \u00ed
  sveitarf\u00e9laginu um \u00e1rabil. \u00cdb\u00faafundur var haldinn undir lok
  vinnunnar og \u00fear gafst einnig t\u00e6kif\u00e6ri \u00e1 a\u00f0 koma a\u00f0
  athugasemendum.\\n\\n5.4. Skilgreining flokka\\n\\nLandb\u00fana\u00f0arlandi \u00ed
  Kj\u00f3sarhreppi er skipt upp \u00ed 4 flokka.\\n\\nI. **FLOKKUR I \u2013 KJ\u00d6RLENDI
  FYRIR AKURYRKJU.** Mj\u00f6g gott r\u00e6ktunarland, sl\u00e9tt, yfirleitt undir
  5% og alltaf undir 10%. \u00cd sumum tilfellum \u00fearf a\u00f0 \u00feurrka landi\u00f0.
  Jar\u00f0vegur frj\u00f3r og au\u00f0veldlega pl\u00f3gt\u00e6kur, n\u00e6r ekkert
  gri\u00f0t. Land alltaf undir 100 m h\u00e6\u00f0 yfir sj\u00f3.\\n\\nII. **FLOKKUR
  II \u2013 GOTT AKURYRKJULAND.** Fremur sl\u00e9tt, alltaf undir 15% og yfirleitt
  undir 10% halla. Jar\u00f0vegur oft \u00e1g\u00e6tur en halli meiri en \u00ed flokki
  I en getur veri\u00f0 fremur r\u00fdr og \u00fe\u00e1 \u00e1bur\u00f0arfrekur, sums
  sta\u00f0ar sendinn og \u00feurrlendur s.s. vi\u00f0 \u00e1rfarvegi. Pl\u00f3gt\u00e6kur
  jar\u00f0vegur kann a\u00f0 vera allt ni\u00f0ur \u00ed 25 cm \u00fear sem hann
  er hva\u00f0 grynnstur. Stakir h\u00f3lar, gri\u00f0t/nibbur kunna a\u00f0 raska
  samfellu \u00ed landi. Land alltaf undir 200 m h\u00e6\u00f0 yfir sj\u00f3.\\n\\nIII.
  **FLOKKUR III \u2013 BLANDA\u00d0 R\u00c6KTUNARLAND.** Hentar oft vel til t\u00fanr\u00e6ktar
  og \u00ed sumum tilfellum m\u00f6gulegt til akuryrkju. Landi\u00f0 er yfirleitt
  gott til beitar e\u00f0a sk\u00f3gra\u00e6ktar. Halli getur veri\u00f0 nokkur, upp
  \u00ed nokku\u00f0 bratt, jafnvel 25% halla en einnig getur veri\u00f0 um flatlendi
  a\u00f0 r\u00e6\u00f0a. Jar\u00f0vegur nokku\u00f0 breytilegur, allt fr\u00e1 \u00fev\u00ed
  a\u00f0 vera mj\u00f6g frj\u00f3r yfir \u00ed r\u00fdran m\u00f3ajar\u00f0veg og
  l\u00edtt gr\u00f3in melasv\u00e6\u00f0i. Jar\u00f0vegur getur veri\u00f0 gr\u00fdttur
  og/e\u00f0a grj\u00f3th\u00f3lar og hraun \u00ed e\u00f0a upp \u00far jar\u00f0vegi.
  Land alltaf undir 300 m h\u00e6\u00f0 yfir sj\u00f3.\\n\\nIV. **FLOKKUR IV \u2013
  ANNA\u00d0 LAND.** \u00ddmsar landger\u00f0ir \u00fear sem ekki ver\u00f0ur um samfellda
  jar\u00f0r\u00e6kt a\u00f0 r\u00e6\u00f0a m.a. vegna \u00feess a\u00f0 jar\u00f0vegur
  er grunnur, hraun/grj\u00f3t \u00ed e\u00f0a vi\u00f0 yfirbor\u00f0 e\u00f0a h\u00e6\u00f0
  yfir sj\u00f3 og/e\u00f0a halli lands er of mikill. Einnig eru \u00feetta aurav\u00e6\u00f0i
  j\u00f6kulvatna, sandsv\u00e6\u00f0i og strandsv\u00e6\u00f0i n\u00e6st sj\u00f3
  sem og mj\u00f6g blaut votlendissv\u00e6\u00f0i \u00fear sem grunnvatnssta\u00f0a
  er talin \u00fea\u00f0 h\u00e1 a\u00f0 land er ekki \u00feurrkunarh\u00e6ft. Land
  \u00ed flokki IV er oft hentugt til beitar og \u00fe\u00e1 n\u00fdtt til sumarbeitar
  e\u00f0a heils\u00e1rs-beitar \u00feegar um l\u00e1glendissv\u00e6\u00f0i er a\u00f0
  r\u00e6\u00f0a.\\n\\nMynd 7. K\u00e1ranessefi\u00f0 er \u00ed flokki IV, h\u00e1
  grunnvatnsst\u00f6\u00f0u.\\n\\nMynd 8. Mish\u00e6\u00f0\u00f3tt land \u00ed flokki
  III, fj\u00f6ll \u00ed flokki IV.\\n\\nMynd 9. Fj\u00f6ll og klettar eru \u00ed
  flokki IV, flatlendi \u00e1 mi\u00f0ri mynd \u00ed flokki II. Mish\u00e6\u00f0ir
  til h\u00e6gri eru \u00ed flokki III.\\n\\n6. NI\u00d0URSTA\u00d0A\\n\\n\u00de\u00f3tt
  r\u00e6ktunarst\u00edlir\u00f0i byggist fyrst og fremst \u00e1 jar\u00f0vegi og
  loftslagi (P\u00f3rsteinn Gu\u00f0mundsson, 2003) \u00fearf fleira til s.s. heppilega
  grunnvatnsst\u00f6\u00f0u, l\u00edttin halla lands og samfellt landsv\u00e6\u00f0i
  og st\u00f3r sv\u00e6\u00f0i \u00ed sveitarf\u00e9laginu falla undir \u00feessu
  l\u00fdsingu. Vi\u00f0 mat \u00e1 landi \u00ed Kj\u00f3sarhreppi er fyrst og fremst
  horft til jar\u00f0vegs og yfirbor\u00f0sger\u00f0ar \u00e1samt halla lands og h\u00e6\u00f0
  yfir sj\u00e1varm\u00e1li. Sums sta\u00f0ar er halli lands \u00fea\u00f0 l\u00edtil
  a\u00f0 erfi\u00f0 getur veri\u00f0 a\u00f0 r\u00e6sa land fram. \u00dea\u00f0 kunna
  markmi\u00f0 um r\u00e6ktun korns a\u00f0 stangast \u00e1 vi\u00f0 \u00f6nnur markmi\u00f0
  stj\u00f3rnavalda s.s. me\u00f0 verndun votlendis og jafnvel kolefnisbindingu \u00ed
  jar\u00f0vegi en ekki er tekin afsta\u00f0a til \u00feess.\\n\\n\u00c1\u00f0ur jafna\u00f0i
  er land ne\u00f0an 200 m h\u00e6\u00f0arlinu skilgreint til landb\u00fana\u00f0ar-
  e\u00f0a annarra nota \u00ed a\u00f0alskipulagi. Fjalllendi flokkast sem \u00f3byggt
  land, myndi a\u00f0 jafna\u00f0i lenda \u00ed flokk I/IV en er \u00fev\u00ed ekki
  teki\u00f0 me\u00f0 \u00ed \u00fatreikninga \u00fear sem \u00fea\u00f0 lei\u00f0ir
  til fremur \u00f3raunsarri\u00f0 ni\u00f0urst\u00f6\u00f0u vegna \u00feess hve sveitarf\u00e9lagi\u00f0
  er fjalllent. \u00dea\u00f0 land sem flokka\u00f0 er telst vera t\u00e6plega 9.000
  ha.\\n\\n- Flokkur I \u2013 kj\u00f6rlendi fyrir akuryrkju eru r\u00famlega 1.050
  ha (12 %).\\n- Flokkur II \u2013 gott akuryrkjuland er t\u00e6plega 800 ha (9 %).\\n-
  Flokkur III \u2013 blanda\u00f0 r\u00e6ktunarland er t\u00e6plega 3.000 ha (33%).
  Land \u00ed \u00feessum flokki getur henta\u00f0 vel til sk\u00f3graektar en einnig
  til beitar.\\n- Flokkur IV \u2013 anna\u00f0 land er r\u00famlega 4.100 ha (46 %).
  Land sem hentar m.a. til beitar e\u00f0a fr\u00edstundabyggingar og oft einnig sk\u00f3graektar.\\n\\nLandg\u00e6\u00f0i
  jar\u00f0a eru mismunandi og \u00fev\u00ed misjafnt hv\u00f8rnig \u00feessi flokkun
  snertir einstakar jar\u00f0ir. Hafa ber \u00fe\u00f3 \u00ed huga a\u00f0 \u00feessi
  kortlagning er unnin \u00ed \u00feeim m\u00e6likvar\u00f0a sem a\u00f0alskipulag
  sveitarf\u00e9lagsins b\u00ed\u00f0ur upp \u00e1, \u00fe.e. 1:50.000. M\u00f6gulegt
  er a\u00f0 vinna n\u00e1kv\u00e6mari greiningu \u00e1 einst\u00f6kum j\u00f6r\u00f0um
  e\u00f0a hluta sveitarf\u00e9lagsins s\u00e9 talin \u00fe\u00f6rf \u00e1 \u00fev\u00ed.\\n\\n\u00cd
  Skipulagsl\u00f6gum er gert r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0 land s\u00e9
  flokka\u00f0 \u00ed landn\u00fdtingarflokka, \u00fe.a.m. landb\u00fana\u00f0arland
  og \u00f3bygg\u00f0 sve\u00f0i. \u00cd landskipulagsstefnu 2015 \u2013 2026 er kve\u00f0i\u00f0
  \u00e1 um a\u00f0 flokkan landb\u00fana\u00f0arlands s\u00e9 l\u00f6g\u00f0 til
  grundvallar skipulags\u00e1kv\u00f6r\u00f0unum \u00ed sveitarf\u00e9lagum. \u00dev\u00ed
  m\u00e1 telja e\u00f0ilegt a\u00f0 settir s\u00e9u skilm\u00e1lar \u00ed a\u00f0alskipulagi
  fyrir n\u00fdtingu lands \u00ed flokki I og II sem stu\u00f0li a\u00f0 verndun \u00feess
  til framt\u00ed\u00f0arnota fyrir landb\u00fana\u00f0.\\n\\n\u00dea\u00f0 er sveitarstj\u00f3rn
  sem \u00e1kv\u00e6\u00f0ar hvort og \u00fe\u00e1 hva\u00f0a kva\u00f0ir og skilm\u00e1lar
  eru settir \u00ed a\u00f0alskipulagi sveitarf\u00e9lagsins fyrir einstaka flokka
  landb\u00fana\u00f0arlands.\\n\\n7. HEIMILDIR\\n\\nAl\u00feingi \u00cdslands. (1971).
