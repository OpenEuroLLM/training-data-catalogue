  Matur \u00ed s\u00e9rstaka tunnu, papp\u00edr og kassar einnig. |\\n| A\u00f0 kenna
  b\u00f6rnunum a\u00f0 bera vir\u00f0ingu fyrir umhverfi s\u00ednu og n\u00e1tt\u00faru,
  upplifa og nj\u00f3ta. Kveikja forvitni \u00feeirra me\u00f0 \u00fev\u00ed a\u00f0
  spyrja opinna spurninga og leita lausna. | K\u00f6nnun barna og skynjun \u00feeirra
  \u00e1 umhverfinu og samf\u00e9lagi, ranns\u00f3knir, fj\u00f6lbreyttar a\u00f0fer\u00f0ir
  til a\u00f0 sko\u00f0a, skynja, hlusta, snerta, flokka, bera saman og draga \u00e1lyktanir
  |\\n\\nJafnr\u00e9tti 4-5 \u00e1ra\\n\\nJafnr\u00e9tti: Jafnr\u00e9tti er regnhl\u00edfarhugtak
  og n\u00e6r til \u00fdmissa \u00fe\u00e1tta s.s; aldurs, b\u00fasetu, f\u00f6tlunar,
  kyns, kynhneig\u00f0ar, litarh\u00e1ttar,  l\u00edfssko\u00f0ana, menningar, st\u00e9ttar,
  tr\u00faarbrag\u00f0a, tungum\u00e1la, \u00e6tterna og \u00fej\u00f3\u00f0erna.  \u00c1
  \u00f6llum sk\u00f3lastigum \u00e1 a\u00f0 fara fram menntun til jafnr\u00e9ttis
  \u00fear sem fjalla\u00f0 er um hvernig fyrrtaldir \u00fe\u00e6ttir geta valdi\u00f0
  mismunun e\u00f0a forr\u00e9ttindum \u00ed l\u00edfi f\u00f3lks.\\n\\n\u00cd starfi
  \u00e1 Ki\u00f0agili er l\u00f6g\u00f0 \u00e1herslu \u00e1 a\u00f0 kyngerva ekki
  leik og f\u00e1 b\u00f6rnin t\u00e6kif\u00e6ri til a\u00f0 sko\u00f0a umhverfi sitt  \u00ed
  leik \u00e1n \u00feess a\u00f0 \u00fea\u00f0 skipti m\u00e1li hvort kyn \u00fea\u00f0
  er. \u00dea\u00f0 hefur s\u00fdnt sig a\u00f0 kennarar nafngreina str\u00e1ka frekar
  en stelpur sem h\u00f3p \u00ed starfi. \u00dev\u00ed er gott a\u00f0 vera me\u00f0vita\u00f0ur
  hvernig kynin eru \u00e1v\u00f6rpu\u00f0.  Starfsf\u00f3lk er me\u00f0vita\u00f0
