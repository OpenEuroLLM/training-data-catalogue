  s\u00ednar sko\u00f0anir \u00e1n ford\u00f3ma. Kennarar \u00fatsk\u00fdra fyrir
  \u00f6\u00f0rum b\u00f6rnum a\u00f0 ekki hafi allir s\u00f6mu sko\u00f0anir \u00e1
  hinum \u00fdmsu m\u00e1lefnum |\\n| A\u00f0 efnivi\u00f0ur s\u00e9 \u00f3h\u00e1\u00f0ur
