sample: '["\"R\u00edkisendursko\u00f0un Br\u00edetart\u00fani 7 105 Reykjav\u00edk\\n\\nReykjav\u00edk
  7. apr\u00edl 2022\\n\\nTilv.: FJR22010105/11.4.5\\n\\nEfni: Bei\u00f0ni um \u00fattekt\\n\\nSamkv\u00e6mt
  l\u00f6gum um r\u00edkisendursko\u00f0anda og endursko\u00f0un r\u00edkisreikninga
  hefur r\u00edkisendursko\u00f0andi m.a. \u00fea\u00f0 hlutverk a\u00f0 hafa eftirlit
  me\u00f0 framkv\u00e6md samninga sem eru ger\u00f0ir vi\u00f0 einkaa\u00f0ila og
  hafa eftirlit me\u00f0 starfsemi og \u00e1rangri r\u00edkisa\u00f0ila. L\u00f6gin
  kve\u00f0a \u00e1 um a\u00f0 r\u00edkisendursko\u00f0andi \u00e1kve\u00f0i sj\u00e1lfur
  hvernig hann sinnir hlutverki s\u00ednu samkv\u00e6mt l\u00f6gunum.\\n\\n\u00deann
  22. mars sl. f\u00f3r fram \u00fatbo\u00f0 og sala \u00e1 22,5% hlut \u00ed \u00cdslandsbanka.
  Umr\u00e6\u00f0a hefur skapast um hvort framkv\u00e6md s\u00f6lunnar hafi veri\u00f0
  \u00ed samr\u00e6mi vi\u00f0 \u00e1skilna\u00f0 laga og upplegg stj\u00f3rnvalda
  sem bori\u00f0 var undir fj\u00e1rlaganefnd og efnahags- og vi\u00f0skiptanefnd
  Al\u00feingis til umsagnar.\\n\\n\u00deess er h\u00e9r me\u00f0 fari\u00f0 \u00e1
  leit vi\u00f0 R\u00edkisendursko\u00f0un a\u00f0 h\u00fan kanni og leggi mat \u00e1
  hvort framangreind sala hafi samr\u00fdmst l\u00f6gum og g\u00f3\u00f0um stj\u00f3rns\u00fdsluh\u00e1ttum.\\n\\nFyrir
  h\u00f6nd r\u00e1\u00f0herra\\n\\nBjarni Benediktsson\\n\\nGu\u00f0mundur \u00c1rnason\"",
  "\"REGLUGER\u00d0\\n\\num takm\u00f6rkun \u00e1 samkomum vegna fars\u00f3ttar.\\n\\n1.
  gr.\\n\\nMe\u00f0 v\u00edsan til 2. mgr. 12. gr. s\u00f3ttvarnalaga nr. 19/1997
  hefur heilbrig\u00f0isr\u00e1\u00f0herra \u00e1kve\u00f0i\u00f0, a\u00f0 fenginni
  till\u00f6gu s\u00f3ttvarnal\u00e6knis og \u00ed samr\u00e1\u00f0i vi\u00f0 r\u00edkisstj\u00f3rnina,
  a\u00f0 setja \u00e1 t\u00edmabundna takm\u00f6rkun \u00e1 samkomum eftir \u00fev\u00ed
  sem n\u00e1nar greinir \u00ed regluger\u00f0 \u00feessari.\\n\\n\u00c1kv\u00f6r\u00f0un
  og markmi\u00f0.\\n\\nMarkmi\u00f0 takm\u00f6rkunarinnar er a\u00f0 h\u00e6gja eins
  og unnt er \u00e1 \u00fatbrei\u00f0slu COVID-19 sj\u00fakd\u00f3msins.\\n\\n2. gr.\\n\\nTakm\u00f6rkun
  \u00e1 samkomum tekur gildi 5. okt\u00f3ber 2020 og gildir til og me\u00f0 19. okt\u00f3ber
  2020.\\n\\nGildissvi\u00f0.\\n\\nStj\u00f3rnv\u00f6ld endurmeta \u00fe\u00f6rf \u00e1
  takm\u00f6rkuninni eftir \u00fev\u00ed sem efni standa til, \u00fe.e. hvort unnt
  s\u00e9 a\u00f0 afl\u00e9tta henni fyrr e\u00f0a hvort \u00fe\u00f6rf s\u00e9 \u00e1
  a\u00f0 framlengja gildist\u00edma hennar.\\n\\nRegluger\u00f0in tekur hvorki til
  al\u00fej\u00f3\u00f0aflugvalla og -hafna n\u00e9 til loftfara og skipa \u00ed millilandafer\u00f0um.\\n\\nTakm\u00f6rkun
  \u00e1 samkomum tekur til landsins alls.\\n\\n\u00c1kv\u00e6\u00f0i 3. og 4. gr.
  regluger\u00f0ar \u00feessarar um fj\u00f6ldatakm\u00f6rkun, n\u00e1l\u00e6g\u00f0artakm\u00f6rkun
  og gr\u00edmuskyldu taka ekki til barna sem eru f\u00e6dd \u00e1ri\u00f0 2005 og
  s\u00ed\u00f0ar.\\n\\nRegluger\u00f0 \u00feessi tekur ekki til sk\u00f3lastarfs
  sem fjalla\u00f0 er um \u00ed s\u00e9rstakri regluger\u00f0 um takm\u00f6rkun sk\u00f3lastarfs.\\n\\n3.
  gr.\\n\\n\u00cd takm\u00f6rkun \u00e1 samkomum felst a\u00f0 fj\u00f6ldasamkomur
  eru \u00f3heimilar \u00e1 gildist\u00edma \u00feessarar regluger\u00f0ar. Me\u00f0
  fj\u00f6ldasamkomum er \u00e1tt vi\u00f0 \u00fea\u00f0 \u00feegar fleiri en 20 einstaklingar
  koma saman, hvort sem er \u00ed opinberum r\u00fdmum e\u00f0a einkar\u00fdmum. Er
  \u00fe\u00e1 me\u00f0al annars v\u00edsa\u00f0 til:\\n\\nFj\u00f6ldatakm\u00f6rkun.\\n\\na.
  R\u00e1\u00f0stefna, m\u00e1l\u00feinga, \u00fatifunda o.\u00fe.h.\\nc. Skemmtana,
  svo sem t\u00f3nleika, menningarvi\u00f0bur\u00f0a, leiks\u00fdninga, b\u00ed\u00f3s\u00fdninga,
  \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0a og einkasamkv\u00e6ma, sbr. \u00fe\u00f3
  5. gr.\\nb. Kennslu, fyrirlestra og pr\u00f3fahalds.\\nd. Kirkjuathafna hvers konar,
  svo sem vegna giftinga og ferminga, og annarra tr\u00faarsamkoma, sbr. \u00fe\u00f3
  4. mgr.\\n\\nEnn fremur skal tryggt \u00e1 \u00f6llum vinnust\u00f6\u00f0um og \u00ed
  allri starfsemi a\u00f0 ekki s\u00e9u \u00e1 sama t\u00edma fleiri en 20 einstaklingar
  inni \u00ed sama r\u00fdmi. Tryggja skal a\u00f0 ekki s\u00e9 samgangur milli r\u00fdma.\\n\\ne.
  Annarra samb\u00e6rilegra vi\u00f0bur\u00f0a me\u00f0 fleiri en 20 einstaklingum.\\n\\n\u00der\u00e1tt
  fyrir 1. og 2. mgr. er verslunum heimilt a\u00f0 hafa allt a\u00f0 100 manns inni
  \u00ed einu a\u00f0 \u00fev\u00ed gefnu a\u00f0 uppfyllt s\u00e9u skilyr\u00f0i
  4. gr. \u00de\u00e1 er verslunum sem eru yfir 1.000 m\u00b2 a\u00f0 st\u00e6r\u00f0
  heimilt a\u00f0 hleypa til vi\u00f0b\u00f3tar einum vi\u00f0skiptavin inn fyrir
  hverja 10 m\u00b2 umfram 1.000 m\u00b2, \u00fe\u00f3 a\u00f0 h\u00e1marki 200 vi\u00f0skiptavinum
  alls.\\n\\nFj\u00f6ldatakmarkanir 1. og 2. mgr. gilda ekki um almenningssamg\u00f6ngur,
  h\u00f3pbifrei\u00f0ar, innanlandsflug, far\u00feegaferjur og st\u00f6rf vi\u00f0brag\u00f0sa\u00f0ila,
  svo sem l\u00f6greglu, sl\u00f6kkvili\u00f0s, hj\u00e1lparli\u00f0s almannavarna
  og heilbrig\u00f0isstarfsf\u00f3lks. Enn fremur gildir \u00e1kv\u00e6\u00f0i\u00f0
  ekki um st\u00f6rf Al\u00feingis og \u00feegar d\u00f3mst\u00f3lar fara me\u00f0
  d\u00f3msvald sitt.\\n\\n\u00der\u00e1tt fyrir 1. og 2. mgr. er allt a\u00f0 50
  einstaklingum heimilt a\u00f0 vera vi\u00f0staddir \u00fatfarir.\\n\\n4. gr.\\n\\n\u00c1
  samkomum, \u00f6llum vinnust\u00f6\u00f0um og \u00ed allri annarri starfsemi, me\u00f0al
  annars \u00feeirri sem talin er upp \u00ed 3. gr., skal tryggja a\u00f0 h\u00e6gt
  s\u00e9 a\u00f0 hafa a.m.k. 1 metra \u00e1 milli einstaklinga sem ekki eru \u00ed
  n\u00e1num tengslum.\\n\\nAlmenn n\u00e1l\u00e6g\u00f0artakm\u00f6rkun.\\n\\n\u00cd
  starfsemi sem e\u00f0lis s\u00edns vegna krefst meiri n\u00e1l\u00e6g\u00f0ar en
  kve\u00f0i\u00f0 er \u00e1 um \u00ed 1. mgr., svo sem \u00ed heilbrig\u00f0is\u00fej\u00f3nustu,
  \u00e1 h\u00e1rgrei\u00f0slustofum, nuddstofum, innanlandsflugi og -ferjum, leigubifrei\u00f0um,
  h\u00f3pbifrei\u00f0um og \u00ed almenningssamg\u00f6ngum skal nota andlitsgr\u00edmu
  sem hylur nef og munn \u00fear sem 1 metra fjarl\u00e6g\u00f0 milli einstaklinga
  ver\u00f0ur ekki vi\u00f0 komi\u00f0. Andlitsgr\u00edmur sem nota\u00f0ar eru utan
  heilbrig\u00f0is\u00fej\u00f3nustu skulu uppfylla kr\u00f6fur sem fram koma \u00ed
  vinnustofusam\u00feykkt evr\u00f3psku sta\u00f0lasamtakanna (CEN). S\u00f3ttvarnal\u00e6knir
  getur sett n\u00e1nari lei\u00f0beiningar um kr\u00f6fur til andlitsgr\u00edma samkv\u00e6mt
  \u00e1kv\u00e6\u00f0i \u00feessu.\\n\\n5. gr.\\n\\n\u00der\u00e1tt fyrir \u00e1kv\u00e6\u00f0i
  1. mgr. 4. gr. um 1 metra n\u00e1l\u00e6g\u00f0artakm\u00f6rkun eru snertingar heimilar
  milli \u00ed\u00fer\u00f3ttaf\u00f3lks \u00e1 \u00e6fingum og \u00ed keppnum. Aftur
  \u00e1 m\u00f3ti skal vir\u00f0a 1 metra n\u00e1l\u00e6g\u00f0artakm\u00f6rkun \u00ed
  b\u00faningsklefum og \u00e1 \u00f6\u00f0rum sv\u00e6\u00f0um utan keppni og \u00e6finga.
  \u00der\u00e1tt fyrir fj\u00f6ldatakmarkanir 3. gr. er allt a\u00f0 50 einstaklingum
  heimilt a\u00f0 koma saman \u00e1 \u00e6fingum og \u00ed keppnum.\\n\\nN\u00e1l\u00e6g\u00f0artakm\u00f6rkun
  \u00ed \u00ed\u00fer\u00f3ttum, svi\u00f0slistum o.fl.\\n\\nA\u00f0rir, me\u00f0al
  annars \u00fej\u00e1lfarar, starfsmenn og sj\u00e1lfbo\u00f0ali\u00f0ar, skulu \u00e1vallt
  g\u00e6ta a\u00f0 n\u00e1l\u00e6g\u00f0artakm\u00f6rkunum skv. 1. mgr. 4. gr.\\n\\nKeppnis\u00e1h\u00f6ld
  skulu s\u00f3tthreinsu\u00f0 eftir hverja notkun eins og kostur er me\u00f0 hli\u00f0sj\u00f3n
  af e\u00f0li \u00ed\u00fer\u00f3ttarinnar.\\n\\n\u00d3heimilt er a\u00f0 hafa \u00e1horfendur
  \u00e1 \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0um innandyra. Heimilt er a\u00f0 hafa
  \u00e1horfendur \u00e1 \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0um utandyra a\u00f0
  uppfylltum s\u00f6mu skilyr\u00f0um og \u00ed 7. mgr.\\n\\n\u00cd\u00fer\u00f3tta-
  og \u00f3lymp\u00edusamband \u00cdslands setur s\u00e9rsamb\u00f6ndum reglur, svo
  sem um einstaklingsbundnar s\u00f3ttvarnir og s\u00f3tthreinsun b\u00fana\u00f0ar,
  um framkv\u00e6md \u00e6finga og keppna \u00ed s\u00ednum greinum \u00ed samvinnu
  vi\u00f0 s\u00f3ttvarnal\u00e6kni.\\n\\nMe\u00f0 sama h\u00e6tti og \u00ed \u00ed\u00fer\u00f3ttum
  eru snertingar og n\u00e1l\u00e6g\u00f0 undir 1 metra heimil \u00ed svi\u00f0slistum,
  t\u00f3nlist, vi\u00f0 kvikmyndat\u00f6ku og samb\u00e6rilegri starfsemi. \u00dear
  sem s\u00e9rst\u00f6k smith\u00e6tta er fyrir hendi, svo sem \u00e1 k\u00f3r\u00e6fingum,
  skal \u00fe\u00f3 eftir fremsta megni g\u00e6tt a\u00f0 \u00e1kv\u00e6\u00f0i 1.
  mgr. 4. gr. og eftir atvikum vi\u00f0h\u00f6f\u00f0 meiri fjarl\u00e6g\u00f0, ef
  \u00fea\u00f0 er unnt. \u00der\u00e1tt fyrir fj\u00f6ldatakmarkanir 3. gr. er heimilt
  a\u00f0 hafa allt a\u00f0 50 einstaklinga \u00e1 svi\u00f0i og 100 gesti \u00ed
  hverju r\u00fdmi \u00e1 vi\u00f0bur\u00f0um, sbr. \u00fe\u00f3 3. mgr., a\u00f0
  \u00fev\u00ed gefnu a\u00f0 allir gestir sitji \u00ed n\u00fameru\u00f0um s\u00e6tum
  sem skr\u00e1\u00f0 eru \u00e1 nafn. Gestir skulu nota andlitsgr\u00edmur sem uppfylla
  kr\u00f6fur 2. mgr. 4. gr. og eru \u00ed samr\u00e6mi vi\u00f0 lei\u00f0beiningar
  s\u00f3ttvarnal\u00e6knis.\\n\\n\u00cd \u00ed\u00fer\u00f3ttum sem ekki tilheyra
  \u00cd\u00fer\u00f3tta- og \u00f3lymp\u00edusambandi \u00cdslands skal setja lei\u00f0beiningar
  e\u00f0a fylgja s\u00f6mu lei\u00f0beiningum og gilda um samb\u00e6rilegar \u00ed\u00fer\u00f3ttir
  innan sambandsins.\\n\\n6. gr.\\n\\nSkemmtist\u00f6\u00f0um og kr\u00e1m, sbr. 18.
  gr. regluger\u00f0ar nr. 1277/2016, um veitingasta\u00f0i, gistista\u00f0i og skemmtanahald,
  og spilas\u00f6lum skal loka\u00f0 fr\u00e1 gildist\u00f6ku regluger\u00f0arinnar.
  \u00de\u00e1 skulu a\u00f0rir veitingasta\u00f0ir \u00fear sem heimila\u00f0ar eru
  \u00e1fengisveitingar ekki hafa opi\u00f0 lengur en til kl. 23.00 alla daga vikunnar
  og fylgja \u00e1kv\u00e6\u00f0um 3. og 4. gr.\\n\\nTakmarkanir \u00e1 starfsemi
  vegna s\u00e9rstakrar smith\u00e6ttu.\\n\\n\u00cd \u00feeim tilvikum \u00fear sem
  fleiri tegundir veitingasta\u00f0a eru skr\u00e1\u00f0ar \u00ed rekstrarleyfi er
  heimilt a\u00f0 starfa \u00e1fram \u00ed samr\u00e6mi vi\u00f0 a\u00f0rar tegundir
  en kve\u00f0i\u00f0 er \u00e1 um \u00ed 1. mgr. me\u00f0 \u00feeim takm\u00f6rkunum
  sem kve\u00f0i\u00f0 er \u00e1 um \u00ed regluger\u00f0 \u00feessari.\\n\\nH\u00fasn\u00e6\u00f0i
  l\u00edkamsr\u00e6ktarst\u00f6\u00f0va skal vera loka\u00f0 almenningi.\\n\\nEkki
  er heimilt a\u00f0 veita t\u00edmabundi\u00f0 leyfi fyrir skemmtunum, svo sem t\u00f3nleikum,
  dansleikjum, brennum e\u00f0a \u00f6\u00f0rum vi\u00f0bur\u00f0um sem \u00e6tla
  m\u00e1 a\u00f0 dragi a\u00f0 s\u00e9r h\u00f3p f\u00f3lks eftir kl. 23.00.\\n\\n\u00cd
  starfsemi \u00fear sem nota\u00f0ur er sameiginlegur b\u00fana\u00f0ur, svo sem
  \u00ed \u00ed\u00fer\u00f3ttastarfi skal b\u00fana\u00f0ur s\u00f3tthreinsa\u00f0ur
  eftir hverja notkun.\\n\\n\u00der\u00e1tt fyrir \u00e1kv\u00e6\u00f0i 3. gr. um
  fj\u00f6ldatakm\u00f6rkun m\u00e1 gestafj\u00f6ldi \u00e1 sund- og ba\u00f0st\u00f6\u00f0um
  aldrei vera meiri en helmingur af leyfilegum h\u00e1marksfj\u00f6lda gesta samkv\u00e6mt
  starfsleyfi. S\u00e9 h\u00e1marksfj\u00f6ldi gesta ekki skr\u00e1\u00f0ur \u00ed
  starfsleyfi skal mi\u00f0a gestafj\u00f6lda vi\u00f0 helming \u00feess fj\u00f6lda
  sem fataskiptir\u00fdmi gerir r\u00e1\u00f0 fyrir. B\u00f6rn f\u00e6dd \u00e1ri\u00f0
  2005 og s\u00ed\u00f0ar eru ekki talin me\u00f0 \u00ed gestafj\u00f6lda. S\u00f3ttvarnal\u00e6knir
  gefur \u00fat n\u00e1nari lei\u00f0beiningar um sund- og ba\u00f0sta\u00f0i vegna
  COVID-19. \u00c1kv\u00e6\u00f0i \u00feetta tekur einnig til ba\u00f0sta\u00f0a \u00ed
  n\u00e1tt\u00farunni eftir \u00fev\u00ed sem vi\u00f0 \u00e1.\\n\\n7. gr.\\n\\nHeilbrig\u00f0isstofnanir,
  hj\u00fakrunarheimili og a\u00f0rar samb\u00e6rilegar stofnanir skulu setja s\u00e9r
  reglur um starfsemi s\u00edna, svo sem var\u00f0andi heims\u00f3knir utana\u00f0komandi
  a\u00f0 heimilunum og stofnununum.\\n\\nHj\u00fakrunarheimili og a\u00f0rar heilbrig\u00f0isstofnanir.\\n\\n8.
  gr.\\n\\n\u00cd \u00f6llum verslunum, opinberum byggingum og \u00e1 \u00f6\u00f0rum
  st\u00f6\u00f0um innandyra \u00fear sem umgangur f\u00f3lks er nokkur skal \u00fer\u00edfa
  eins oft og unnt er, s\u00e9rstaklega algenga snertifleti. Auk \u00feess skal minna
  almenning og starfsmenn \u00e1 einstaklingsbundnar s\u00f3ttvarnir, svo sem munnlega,
  me\u00f0 merkingum e\u00f0a skiltum.\\n\\n\u00derif og s\u00f3tthreinsun almenningsr\u00fdma.\\n\\nVi\u00f0
  alla innganga skal tryggja a\u00f0gang a\u00f0 s\u00f3tthreinsandi v\u00f6kva fyrir
  hendur og eins v\u00ed\u00f0a um r\u00fdmi og talin er \u00fe\u00f6rf \u00e1, me\u00f0al
  annars vi\u00f0 afgrei\u00f0slukassa og innkaupakerrur \u00ed verslunum.\\n\\n9.
  gr.\\n\\nR\u00e1\u00f0herra getur veitt undan\u00fe\u00e1gu fr\u00e1 takm\u00f6rkun
  \u00e1 samkomum vegna samf\u00e9lagslega \u00f3missandi innvi\u00f0a sem mega ekki
  st\u00f6\u00f0vast, svo sem \u00e1 svi\u00f0i raforku, fjarskipta, samgangna, sorphir\u00f0u,
  heilbrig\u00f0isstarfsemi, l\u00f6gg\u00e6slu, sj\u00fakraflutninga, hj\u00e1lparli\u00f0s
  almannavarna e\u00f0a sl\u00f6kkvili\u00f0a. Hi\u00f0 sama \u00e1 vi\u00f0 vegna
  kerfislega og efnahagslega mikilv\u00e6grar starfsemi, svo sem til a\u00f0 tryggja
  f\u00e6\u00f0u\u00f6ryggi, dreifingu nau\u00f0synjavara e\u00f0a efnahagslegt \u00f6ryggi
  r\u00edkisins me\u00f0 \u00fatflutningi. Enn fremur getur r\u00e1\u00f0herra veitt
  undan\u00fe\u00e1gu vegna starfa Al\u00feingis, d\u00f3mst\u00f3la og stj\u00f3rns\u00fdslu.\\n\\nUndan\u00fe\u00e1gur.\\n\\nVi\u00f0
  veitingu undan\u00fe\u00e1ga skal leitast vi\u00f0 a\u00f0 gr\u00edpa til annarra
  a\u00f0ger\u00f0a \u00feannig a\u00f0 g\u00e6tt s\u00e9 a\u00f0 smitv\u00f6rnum
  eins og kostur er.\\n\\n10. gr. Gildistaka.\\n\\nRegluger\u00f0 \u00feessi, sem
  sett er me\u00f0 heimild \u00ed 12. gr. s\u00f3ttvarnalaga nr. 19/1997, tekur gildi
  eftir \u00fev\u00ed sem m\u00e6lt er fyrir um \u00ed 2. gr. Fr\u00e1 sama t\u00edma
  fellur \u00far gildi regluger\u00f0 nr. 864/2020, um takm\u00f6rkun \u00e1 samkomum
  vegna fars\u00f3ttar, me\u00f0 s\u00ed\u00f0ari breytingum.\\n\\nHeilbrig\u00f0isr\u00e1\u00f0uneytinu,
  4. okt\u00f3ber 2020.\\n\\nF. h. r. \u00c1sta Valdimarsd\u00f3ttir.\\n\\n__________\\n\\nB-deild
  \u2013 \u00datg\u00e1fud.: 4. okt\u00f3ber 2020\\n\\n\u00c1sthildur Kn\u00fatsd\u00f3ttir.\"",
  "\"1\\n\\nFundarger\u00f0\\n\\nM\u00ddVATN\\n\\nSveitarstj\u00f3rn Sk\u00fatusta\u00f0ahrepps
  26. fundur.\\n\\na\u00f0 Hl\u00ed\u00f0avegi 6, 20.11.  2003, kl. 13:30.\\n\\nDAGSKR\u00c1:\\n\\n1.
  Fundarsetning.\\n2. Gatnager\u00f0argj\u00f6ld.\\n4. Skipulagsm\u00e1l \u00ed Kr\u00f6flu.\\n3.
  Fundarger\u00f0 bygginganefndar fr\u00e1 3. n\u00f3vember.\\n5. Erindi fr\u00e1
  allsherjarnefnd Al\u00feingis \u00fear sem \u00f3ska\u00f0 er umdagnar um frv. til
  laga um breytingu \u00e1 l\u00f6gum um s\u00f6lu r\u00edkissj\u00f3\u00f0s \u00e1
  hlutaf\u00e9 \u00ed Landss\u00edma \u00cdslands.\\n6. Endursko\u00f0u\u00f0 fj\u00e1rhags\u00e1\u00e6tlun
  2003.\\n7. Fundarger\u00f0 sk\u00f3lanefndar fr\u00e1 17. n\u00f3v.\\n\\nM\u00e6ttir:  Gu\u00f0r\u00fan
  Mar\u00eda Valgeirsd\u00f3ttir, J\u00f3n \u00d3skar Ferdinandsson, Kristj\u00e1n
  Stef\u00e1nsson, B\u00f6\u00f0var P\u00e9tusson og Ingiger\u00f0ur Arnlj\u00f3tsd\u00f3ttir,
  en Birkir Fanndal bo\u00f0a\u00f0i forf\u00f6ll.\\n\\n1. Fundarsetning.\\n\\nOddviti
  setti fund og bau\u00f0 Ingiger\u00f0i Arnlj\u00f3tsd\u00f3ttur velkomna \u00e1
  sinn fyrsta fund.\\n\\n2. Gatnager\u00f0argj\u00f6ld.\\n\\nEftirfarandi tillaga
  a\u00f0 sam\u00feykktum um gatnager\u00f0argjald liggur fyrir fundinum:\\n\\nSam\u00feykkt
  um gatnager\u00f0argjald \u00ed leigulandi  Sk\u00fatusta\u00f0ahrepps \u00ed Reykjahl\u00ed\u00f0,
  Sk\u00fatusta\u00f0ahreppi.\\n\\n1. gr.\\n\\nAf \u00f6llum l\u00f3\u00f0um og n\u00fdbyggingum
  og st\u00e6kkunum eldri h\u00fasa  \u00ed leigulandi  Sk\u00fatusta\u00f0ahrepps
  \u00ed Reykjahl\u00ed\u00f0, Sk\u00fatusta\u00f0ahreppi, hvort sem er \u00e1 eignarl\u00f3\u00f0um
  e\u00f0a leigul\u00f3\u00f0um, skulu l\u00f3\u00f0arhafar grei\u00f0a til sveitarf\u00e9lagsins
  gatnager\u00f0argjald til sveitarsj\u00f3\u00f0s samkv\u00e6mt sam\u00feykkt \u00feessari.\\n\\nFramangreint
  gjald er, \u00e1samt \u00e1f\u00f6llnum v\u00f6xtum og kostna\u00f0i, tryggt me\u00f0
  l\u00f6gve\u00f0sr\u00e9tti \u00ed vi\u00f0komandi fasteign og er a\u00f0farah\u00e6ft
  skv. 10.tl. 1. mgr. 1.gr. laga um a\u00f0f\u00f6r nr. 90/1989.\\n\\n2. gr. Gatnager\u00f0argjaldi
  skv. 1. gr. skal vari\u00f0 til gatnager\u00f0ar \u00ed sveitarf\u00e9laginu, svo
  sem til a\u00f0\\n\\nundirbyggja g\u00f6tur  me\u00f0 tilheyrandi l\u00f6gnum, m.a.
  vegna g\u00f6tul\u00fdsingar og til a\u00f0 leggja bundi\u00f0 slitlag, gangst\u00e9ttir,
  umfer\u00f0areyjar  og \u00feess h\u00e1ttar \u00fear sem gert er r\u00e1\u00f0
  fyrir \u00fev\u00ed \u00ed skipulagi.\\n\\n3. gr. Grei\u00f0a skal kr. 1.000,- \u00ed
  gatnager\u00f0argjald fyrir hvern fermetra l\u00f3\u00f0ar hverrar tegundar sem
  l\u00f3\u00f0in er.  A\u00f0 auki grei\u00f0ist eftirfarandi fyrir hvern br\u00fatt\u00f3fermetra
  \u00ed h\u00fasum skv. eftirfarandi:\\n3.a: H\u00fas \u00e1 einb\u00fdlish\u00fasal\u00f3\u00f0um:
  Kr 1.200,-\\n3.b: H\u00fas \u00e1 parh\u00fasa- og ra\u00f0h\u00fasal\u00f3\u00f0um:
  Kr. 1.000,-\\n3.c: H\u00fas \u00e1 fj\u00f6lb\u00fdlish\u00fasal\u00f3\u00f0um:
  Kr. 700,-\\n3.d: H\u00fas \u00e1 atvinnu- og i\u00f0na\u00f0arh\u00fasal\u00f3\u00f0um:
  Kr. 1.000,-\\n3.e: H\u00fas \u00e1 verslunar-, skrifstofu- og \u00fej\u00f3nustul\u00f3\u00f0um
  og \u00f6\u00f0rum, sem ekki eru s\u00e9rstaklega taldar annars sta\u00f0ar: Kr.
  2.000,-\\n\\nLiggi ekki fyrir teikningar a\u00f0 byggingu \u00feegar \u00fathluta\u00f0
  er l\u00f3\u00f0 samkv. li\u00f0um 3.a - 3.e  h\u00e9r a\u00f0 framan, skal reikna
  \u00fat gatnager\u00f0argjald samkv\u00e6mt \u00e1\u00e6tla\u00f0ri st\u00e6r\u00f0
  h\u00fasbyggingar e\u00f0a h\u00e1marks n\u00fdtingarhlutfalli l\u00f3\u00f0ar  skv.  vi\u00f0komandi
  deiliskipulagsskilm\u00e1lum.  \u00deegar byggingarleyfi er gefi\u00f0 \u00fat skal
  \u00fatreikningur lei\u00f0r\u00e9ttur \u00ed samr\u00e6mi vi\u00f0 endanlegt br\u00fatt\u00f3
  g\u00f3lfflatarm\u00e1l. Einingarver\u00f0 h\u00e9r a\u00f0 ofan eru mi\u00f0u\u00f0
  vi\u00f0 v\u00edsit\u00f6lu byggingarkostna\u00f0ar eins og h\u00fan er \u00ed n\u00f3vemebr
  2003 (287,8 stig) og reiknast \u00e1 hverjum t\u00edma til samr\u00e6mis vi\u00f0
  gildandi byggingarv\u00edsit\u00f6lu.\\n\\n4. gr.\\n\\nEf byggt er vi\u00f0 h\u00fas
  skal grei\u00f0a gatnager\u00f0argjald fyrir hvern fermetra vi\u00f0byggingar skv.
  li\u00f0um 3.a -\\n\\n3.e.   Gatnager\u00f0argjald ver\u00f0ur ekki endurgreitt
  s\u00e9 hluti h\u00fass fjarl\u00e6g\u00f0ur.\\n\\nEf l\u00f3\u00f0 er st\u00e6kku\u00f0
  a\u00f0 \u00f3sk l\u00f3\u00f0arhafa grei\u00f0ist gatnager\u00f0argjald vegna aukningar
  l\u00f3\u00f0arst\u00e6r\u00f0ar til samr\u00e6mis vi\u00f0 3. gr.  Ekki ver\u00f0ur
  endurgreitt ef l\u00f3\u00f0 minnkar.\\n\\nEf l\u00f3\u00f0arhafi r\u00edfur gamalt
  h\u00fas e\u00f0a flytur af l\u00f3\u00f0 og byggir st\u00e6rra h\u00fas \u00e1
  s\u00f6mu l\u00f3\u00f0 skal grei\u00f0a gatnager\u00f0argjald af \u00fev\u00ed
  flatarm\u00e1li n\u00fdja h\u00fassins sem er umfram flatarm\u00e1l eldra h\u00fass.  Sama
  gildir\\n\\nef h\u00fas brennur og byggt er n\u00fdtt \u00e1 s\u00f6mu l\u00f3\u00f0.  Ekki
  ver\u00f0ur endurgreitt s\u00e9 n\u00fdja h\u00fasi\u00f0 minna en \u00fea\u00f0\\n\\neldra.  \u00deegar
  h\u00fas er flutt af einni l\u00f3\u00f0 yfir \u00e1 a\u00f0ra skal grei\u00f0a
  af \u00fev\u00ed gatnager\u00f0argjald \u00e1 hinni n\u00fdju l\u00f3\u00f0.\\n\\n5.
  gr.\\n\\nEf veitt er leyfi fyrir breytingu e\u00f0a endurbyggingu h\u00fasn\u00e6\u00f0is,
  sem felur \u00ed s\u00e9r breytta notkun \u00feess, \u00feannig a\u00f0 h\u00faseignin
  f\u00e6rist \u00ed h\u00e6rri gjaldflokk sbr. 3. gr., \u00fe\u00e1 skal h\u00faseigandi
  grei\u00f0a mismun gatnager\u00f0argjalds af hinu breytta h\u00fasn\u00e6\u00f0i
  og l\u00f3\u00f0 fyrir og eftir breytinguna.  F\u00e6rist h\u00fas hinsvegar \u00ed
  l\u00e6gri gjaldflokk vi\u00f0 breytingu \u00e1 h\u00faseigandi ekki r\u00e9tt \u00e1
  endurgrei\u00f0slu \u00feess vegna.\\n\\n6. gr.\\n\\nGjalddagar gatnager\u00f0argjalds
  eru eftirfarandi:\\n\\n1. Vi\u00f0 l\u00f3\u00f0ar\u00fathlutun\\n2. Vi\u00f0 \u00fatg\u00e1fu
  byggingarleyfis\\n\\n20 % \u00e1lag\u00f0s gatnager\u00f0argjalds\\n\\n30 % \u00e1lag\u00f0s
  gatnager\u00f0argjalds\\n\\n3. Vi\u00f0 fokheldi mannvirkis\\n\\n50 % \u00e1lag\u00f0s
  gatnager\u00f0argjalds\\n\\nFyrstu grei\u00f0slu gatnager\u00f0argjalda skv. 1.
  og  2. tl h\u00e9r a\u00f0 framan, skal inna af hendi innan fj\u00f6gurra vikna
  fr\u00e1 dagsetningu tilkynningar um l\u00f3\u00f0ar\u00fathlutun e\u00f0a \u00fatg\u00e1fu
  byggingarleyfis  og \u00f6\u00f0last l\u00f3\u00f0ar\u00fathlutun  e\u00f0a byggingarleyfi
  ekki gildi fyrr en \u00e1 grei\u00f0sludegi.\\n\\nSveitarstj\u00f3rn getur fresta\u00f0
  innheimtu 3. grei\u00f0slu gatnager\u00f0argjalds um eitt \u00e1r \u00ed senn, ef
  s\u00fdnt \u00feykir a\u00f0 fr\u00e1gangi g\u00f6tu vi\u00f0 vi\u00f0komandi byggingu  ver\u00f0i
  ekki loki\u00f0 innan eins \u00e1rs fr\u00e1 \u00fev\u00ed a\u00f0 h\u00fas er fokhelt.
  S\u00e9 h\u00fas teki\u00f0 \u00ed notkun \u00e1\u00f0ur en fokheldisstigi er n\u00e1\u00f0,
  gjaldfellur gatnager\u00f0argjald vi\u00f0 upphaf notkunar.\\n\\n7. gr.\\n\\nS\u00e9
  \u00fathluta\u00f0ri l\u00f3\u00f0 skila\u00f0, l\u00f3\u00f0ar\u00fathlutun afturk\u00f6llu\u00f0
  e\u00f0a byggingarleyfi fellt \u00far gildi,  skal endurgrei\u00f0a gatnager\u00f0argjald
  samkv\u00e6mt 2. mgr. 1. gr. laga um gatnager\u00f0argjald. nr. 17/1996. Gatnager\u00f0argjald
  skal endurgrei\u00f0a me\u00f0 ver\u00f0b\u00f3tum m.v. v\u00edsit\u00f6lu byggingarkostna\u00f0ar,
  en vaxtalaust.\\n\\nEndurgrei\u00f0slu gatnager\u00f0argjalds er heimilt a\u00f0
  fresta \u00fear til l\u00f3\u00f0 er \u00fathluta\u00f0 a\u00f0 n\u00fdju, en \u00fe\u00f3
  ekki lengur en \u00ed 6 m\u00e1nu\u00f0i fr\u00e1 afturk\u00f6llun e\u00f0a ni\u00f0urfellingu
  byggingarleyfis.\\n\\nKostna\u00f0ur l\u00f3\u00f0arhafa vegna l\u00f3\u00f0ar sem
  er skila\u00f0 e\u00f0a byggingarleyfi afturkalla\u00f0 af  vegna atri\u00f0a er
  var\u00f0a l\u00f3\u00f0arhafa , svo sem h\u00f6nnunar- og ranns\u00f3knakostna\u00f0ur
  \u00e1 l\u00f3\u00f0inni e\u00f0a framkv\u00e6mdir unnar samkv\u00e6mt graftrarleyfi
  \u00e1\u00f0ur en byggingarleyfi er gefi\u00f0 \u00fat, er ekki endurgreiddur af
  sveitarf\u00e9laginu.\\n\\nS\u00e9 l\u00f3\u00f0 afturk\u00f6llu\u00f0 e\u00f0a
  byggingarleyfi fellt \u00far gildi eftir a\u00f0 undirst\u00f6\u00f0ur eru fullger\u00f0ar,
  e\u00f0a \u00e1 s\u00ed\u00f0ari stigum byggingarframkv\u00e6mda, skal d\u00f3mkve\u00f0ja
  tvo matsmenn  til a\u00f0 ver\u00f0leggja \u00fe\u00e6r framkv\u00e6mdir sem unnar
  hafa veri\u00f0, enda hafi \u00fe\u00e6r veri\u00f0 teknar \u00fat og vi\u00f0urkenndar
  af byggingarfulltr\u00faa. Kostna\u00f0 vegna matsins grei\u00f0a sveitarf\u00e9lagi\u00f0
  og l\u00f3\u00f0arhafi a\u00f0 j\u00f6fnu.   Sk\u00fatusta\u00f0ahreppur skal leysa
  til s\u00edn l\u00f3\u00f0ina me\u00f0 mannvirkjum \u00e1  grundvelli mats hinna
  d\u00f3mkv\u00f6ddu matsmanna a\u00f0 fr\u00e1dreginni hlutdeild l\u00f3\u00f0arhafa
  \u00ed kostna\u00f0i vegna matsger\u00f0arinnar.\\n\\n8. gr.\\n\\nSveitarstj\u00f3rn
  er heimilt a\u00f0 augl\u00fdsa l\u00f3\u00f0ir me\u00f0 l\u00e6gri gatnager\u00f0argj\u00f6ldum
  en 3. gr. m\u00e6lir fyrir um, vegna s\u00e9rstakra a\u00f0st\u00e6\u00f0na sem
  gera byggingarframkv\u00e6mdir \u00f3venju erfi\u00f0ar e\u00f0a kostna\u00f0arsamar.\\n\\nSveitarstj\u00f3rn
  getur veitt s\u00e9rstakan grei\u00f0slufrest \u00e1 gatnager\u00f0argjaldi samkv\u00e6mt
  s\u00e9rst\u00f6kum grei\u00f0slusamningi sem kve\u00f0ur \u00e1 um skilm\u00e1la
  og grei\u00f0slukj\u00f6r.\\n\\nSveitarstj\u00f3rn getur \u00e1kve\u00f0i\u00f0
  gatnager\u00f0argjald s\u00e9rstaklega \u00ed \u00feeim tilvikum a\u00f0 byggingar
  falli ekki undir \u00e1kv\u00e6\u00f0i sam\u00feykktar \u00feessarar.\\n\\n9. gr.\\n\\nSam\u00feykkt
  \u00feessi tekur gildi fr\u00e1 og me\u00f0 1. n\u00f3v. 2003, og falla \u00fe\u00e1
  \u00far gildi eldri sam\u00feykktir um sama efni.\\n\\n\u00deegar gefin eru \u00fat
  byggingarleyfi vegna vi\u00f0bygginga e\u00f0a breytinga \u00e1 mannvirkjum \u00e1
  \u00edb\u00fa\u00f0arh\u00fasal\u00f3\u00f0um, skal ums\u00e6kjandi grei\u00f0a
  gatnager\u00f0argjald samkv\u00e6mt 3. grein, en \u00fe\u00f3 einungis \u00e1 grundvelli
  g\u00f3lfflatarm\u00e1lshluta gatnager\u00f0argjaldsins.\\n\\nSam\u00feykkt samhlj\u00f3\u00f0a
  og sveitarstj\u00f3ra fali\u00f0 a\u00f0 augl\u00fdsa sam\u00feykktirnar \u00e1
  l\u00f6gm\u00e6tan h\u00e1tt.\\n\\n3. Fundarger\u00f0 bygginganefndar fr\u00e1 3.
  n\u00f3vember.\\n\\n4. li\u00f0ur fundarger\u00f0arinnar sam\u00feykktur.  \u00c1kve\u00f0i\u00f0
  a\u00f0 fresta 3. li\u00f0num og afla frekari uppl\u00fdsinga.\\n\\n4. Skipulagsm\u00e1l
  \u00ed Kr\u00f6flu.\\n\\nBorist hefur br\u00e9f fr\u00e1 Umhverfisstofnun dags 6.
  n\u00f3v. sem hefur a\u00f0 geyma ums\u00f6gn um till\u00f6gur a\u00f0 a\u00f0alskipulagi
  \u00ed Kr\u00f6flu og Bjarnarflagi.  Talsver\u00f0ar umr\u00e6\u00f0ur ur\u00f0u
  um ums\u00f6gn UST.  Sveitarstj\u00f3ri uppl\u00fdsti a\u00f0 \u00e1 fimmtudag \u00ed
  n\u00e6stu viku (27. n\u00f3v.) yr\u00f0i fundur um skipulagsm\u00e1l \u00ed Kr\u00f6flu
  me\u00f0 UST, Landsvirkjun, Skipulagsstofnun og Sk\u00fatusta\u00f0ahreppi.\\n\\n5.
  Erindi fr\u00e1 allsherjarnefnd Al\u00feingis \u00fear sem \u00f3ska\u00f0 er umdagnar
  um frv. til laga um breytingu \u00e1 l\u00f6gum um s\u00f6lu r\u00edkissj\u00f3\u00f0s
  \u00e1 hlutaf\u00e9 \u00ed Landss\u00edma \u00cdslands.\\n\\nFrv. fjallar um a\u00f0
  fj\u00e1rm\u00e1lar\u00e1\u00f0herra fari me\u00f0 hlutabr\u00e9f  r\u00edkisins
  \u00ed Landss\u00edma \u00cdslands \u00ed sta\u00f0 samg\u00f6ngur\u00e1\u00f0herra..\\n\\nSveitarstj\u00f3rn
  tj\u00e1ir sig ekki um \u00feetta m\u00e1l.\\n\\n6. Endursko\u00f0u\u00f0 fj\u00e1rhags\u00e1\u00e6tlun
  2003.\\n\\nEndursko\u00f0u\u00f0 fj\u00e1rhags\u00e1\u00e6tlun 2003\\n\\nSam\u00feykkt
  samhlj\u00f3\u00f0a.\\n\\n7. Fundarger\u00f0 sk\u00f3lanefndar fr\u00e1 17. n\u00f3v.\\n\\nSveitarstj\u00f3rn
  gerir ekki athugasemdir vi\u00f0 fundarger\u00f0ina.\\n\\nFleira ekki gert. Fundi
  sliti\u00f0. Gu\u00f0r\u00fan Mar\u00eda Valgeirsd\u00f3ttir, J\u00f3n \u00d3skar
  Ferdinandsson, Kristj\u00e1n Stef\u00e1nsson, Ingiger\u00f0ur Arnlj\u00f3tsd\u00f3ttir
  B\u00f6\u00f0var P\u00e9tusson.\"", "\"Verklagsreglur vi\u00f0 \u00e6fingab\u00fa\u00f0ir\\n\\nlandsli\u00f0s
  og h\u00e6fileikam\u00f3tununnar\\n\\nSk\u00ed\u00f0asambandi\u00f0 \u00ed samvinnu
  vi\u00f0 f\u00e9l\u00f6g skipuleggur \u00e1rlega nokkrar \u00e6fingab\u00fa\u00f0ir
  (\u201ekampa\\\") fyrir sk\u00ed\u00f0a- og brettaf\u00f3lk v\u00ed\u00f0a um landi\u00f0.
  Markmi\u00f0 \u00feeirra er \u00ed grunnatri\u00f0um a\u00f0 auka f\u00e6rni og
  \u00e1huga \u00fe\u00e1tttakenda \u00e1 sk\u00ed\u00f0a- og bretta\u00ed\u00fer\u00f3ttum,
  auk \u00feess a\u00f0 efla samheldni og samhug \u00ed\u00fer\u00f3ttaf\u00f3lks
  \u00ed vi\u00f0komandi greinum.\\n\\n1) Hlutverk og \u00e1byrg\u00f0 SK\u00cd\\n\\na)
  Fagnefndir SK\u00cd gera till\u00f6gu til stj\u00f3rnar um \u00e6fingab\u00fa\u00f0ir
  sem hluta af \u00e1\u00e6tlunum \u00feeirra \u00e1r hvert. \u00deessar \u00e1\u00e6tlanir
  eru hluti af ums\u00f3kn sambandsins til Afrekssj\u00f3\u00f0s \u00cdS\u00cd hverju
  sinni.\\nb) Afreksstj\u00f3ri SK\u00cd \u00e1kve\u00f0ur skipulag \u00e6fingab\u00fa\u00f0a
  almennt \u00ed samr\u00e6mi vi\u00f0 \u00fej\u00e1lfara h\u00e6fileikam\u00f3tunar
  hverju sinni.\\nc) Afreksstj\u00f3ri sam\u00feykkir a\u00f0 h\u00f6f\u00f0u samr\u00e1\u00f0i
  vi\u00f0 hluta\u00f0eigandi fagnefndir, dagskr\u00e1, skipulag og \u00fe\u00e1tttakendur,
  hefur umsj\u00f3n me\u00f0 fj\u00e1rhagslegu uppgj\u00f6ri \u00e1samt framkv\u00e6mdastj\u00f3ra
  SK\u00cd.\\nd) SK\u00cd ber \u00e1byrg\u00f0 \u00e1 fj\u00e1rhagslegu uppgj\u00f6ri
  \u00e6fingab\u00fa\u00f0a, nema um anna\u00f0 s\u00e9 sami\u00f0 fyrirfram og kynnir
  fyrir stj\u00f3rn SK\u00cd eins flj\u00f3tt og au\u00f0i\u00f0 er.\\ne) Kostna\u00f0arhlutur
  SK\u00cd eru laun \u00fej\u00e1lfara og dagpeningar, fer\u00f0akostna\u00f0ur \u00feeirra
  skv. \u00e1\u00e6tlun og m\u00f6gulega annar kostna\u00f0ur vegna \u00feeirra.\\nf)
  Ekki er heimilt a\u00f0 gera SK\u00cd kostna\u00f0 umfram \u00fea\u00f0 sem \u00e1\u00e6tla\u00f0
  er, nema a\u00f0 undangengnu sam\u00feykki afreksstj\u00f3ra e\u00f0a framkv\u00e6mdastj\u00f3ra.\\n\\n2)
  Hlutverk og \u00e1byrg\u00f0 umsj\u00f3narf\u00e9lags\\n\\na) F\u00e9l\u00f6g sem
  standa fyrir \u00e6fingab\u00fa\u00f0um fyrir landsli\u00f0 e\u00f0a h\u00e6fileikam\u00f3tun
  e\u00f0a annarra samb\u00e6rilegra h\u00f3pa bera \u00e1byrg\u00f0 \u00e1 framkv\u00e6md
  og kostna\u00f0i \u00e1 sta\u00f0num, skv. fyrirfram ger\u00f0ri \u00e1\u00e6tlun
  sem SK\u00cd og hluta\u00f0eigandi f\u00e9lag hafa sam\u00feykkt.\\nb) \u00cd undirb\u00faningi
  og kostna\u00f0i f\u00e9laga skal vera gisting, fundar- og \u00e6fingara\u00f0sta\u00f0a.
  \u00cd kostna\u00f0i \u00e1 sta\u00f0num skulu vera allar megin m\u00e1lt\u00ed\u00f0ir,
  \u00fe.e. morgunver\u00f0ur, h\u00e1degismatur, kv\u00f6ldver\u00f0ur og morgun-
  og s\u00ed\u00f0degishressing.\\n\\n3) \u00de\u00e1tttakendur\\n\\na) \u00de\u00e1tttakendur
  bera \u00e1byrg\u00f0 \u00e1 s\u00ednum fer\u00f0um til og fr\u00e1 \u00e6fingab\u00fa\u00f0a
  innanlands nema a\u00f0 \u00f6nnur \u00e1kv\u00e6\u00f0i \u00ed samningum e\u00f0a
  \u00e1kv\u00f6r\u00f0unum SK\u00cd eigi vi\u00f0.\\nb) SK\u00cd skipuleggur fer\u00f0ir
  og gistingu s\u00e9 um \u00e6fingar og keppnir erlendis. A\u00f0 \u00f6\u00f0ru
  leyti gilda reglur um kostna\u00f0ar\u00fe\u00e1ttt\u00f6ku h\u00e9r a\u00f0 ofan.\\n\\nSam\u00feykkt
  \u00ed stj\u00f3rn 5. desember 2024\"", "\"Eitt \u00fe\u00fasundasti fundur b\u00e6jarr\u00e1\u00f0s
  Grindav\u00edkur\\n\\nB\u00e6jarr\u00e1\u00f0 Grindav\u00edkur kom saman til fundar
  a\u00f0 morgni 6. mars sl. kl. 8.00, eins og venja ber til \u00e1 mi\u00f0vikudagsmorgni.
  \u00c1 fundum r\u00e1\u00f0sins er a\u00f0 \u00f6llu j\u00f6fnu fari\u00f0 yfir
  \u00fdmis erindi sem berast og stefna m\u00f3tu\u00f0 um afgrei\u00f0slu \u00feeirra.
  A\u00f0 \u00feessu sinni voru 17 m\u00e1li \u00e1 verkefnaskr\u00e1 r\u00e1\u00f0sins.\\n\\nFundurinn
  \u00ed morgun var s\u00e1 1000. \u00ed r\u00f6\u00f0inni. \u00c1 \u00feessum t\u00edma
  m\u00f3ti\u00f0um sam\u00feykkti b\u00e6jarr\u00e1\u00f0 samhli\u00f0a till\u00f6gu
  til b\u00e6jarstj\u00f3rnar a\u00f0 Stefnuvifirl\u00fdsingu B\u00e6jarstj\u00f3rnar
  Grindav\u00edkur: \u201eB\u00e6jarstj\u00f3rn Grindav\u00edkur stefnir a\u00f0 \u00fev\u00ed
  a\u00f0 Grindav\u00edk ver\u00f0i sj\u00f6lskylduvann b\u00e6r, sem byggi \u00e1
  sj\u00e1var\u00fatvegi, \u00fej\u00f3nustu vi\u00f0 fer\u00f0amenn og m\u00f6guleikum
  sem jar\u00f0hiti\u00f0 skapar. Markmi\u00f0i\u00f0 er a\u00f0 Grindav\u00edk ver\u00f0i
  eftirs\u00f3ttur b\u00e6r til b\u00fasetu, b\u00e6\u00f0i hva\u00f0 snertir atvinnum\u00f6guleika
  menntun og \u00fej\u00f3nustu.\\\"\\n\\nFyrir fundinum l\u00e1 tillaga b\u00e6jarstj\u00f3ra
  a\u00f0 Starfsmannastefnu og Fj\u00f6lskyldustefnu Grindav\u00edkurb\u00e6jar. F\u00e9lagsm\u00e1lar\u00e1\u00f0,
  sk\u00f3lanefnd og \u00ed\u00fer\u00f3ttar- og \u00e6skul\u00fd\u00f0snefnd, tr\u00fana\u00f0armenn
  b\u00e6jarins og fleiri hafa fjalla\u00f0 um efni \u00feeirra. B\u00e6jarr\u00e1\u00f0
  sam\u00feykkti hvoru tveggja og v\u00edsa\u00f0i Starfsmannastefnu og Fj\u00f6lskyldustefnu
  til sta\u00f0festingar b\u00e6jarstj\u00f3rnar.\\n\\nMe\u00f0al annarra m\u00e1la
  sem tekin voru fyrir \u00e1 fundinum m\u00e1 nefna be\u00f0ni um vi\u00f0b\u00f3tastyrk
  til ger\u00f0ar heimildarmyndar um Gu\u00f0berg Bergsson. Sam\u00feykkt var a\u00f0
  heildarstyrkur til myndarinnar ver\u00f0i 1.000.000.- kr\u00f3na, sem \u00fe\u00fd\u00f0ir
  vi\u00f0b\u00f3t a\u00f0 fj\u00e1rh\u00e6\u00f0 kr. 300.000.\\n\\nP\u00e1 sam\u00feykkti
  b\u00e6jarr\u00e1\u00f0 samning \u00e1 milli S\u00f3knarnefndar og b\u00e6jarins
  um st\u00e6kkan kirkjugar\u00f0sins \u00e1 Sta\u00f0, en hann kv\u00e6\u00f0ur \u00e1
  um framlag b\u00e6jarins til st\u00e6kkanarinnar a\u00f0 fj\u00e1rh\u00e6\u00f0
  kr. 7.300.000.\\n\\nPess m\u00e1 geta a\u00f0 b\u00e6jarr\u00e1\u00f0smenn fengu
  aldrei \u00feessu vanti tertiusei\u00f0 me\u00f0 kaffinu auk \u00feess sem fundarmenn
  voru festir \u00e1 filmu.\\n\\n\\\"Hver er sinnar g\u00e6fu smi\u00f0ur,\\\" forvarnavika
  \u00ed Grindav\u00edk 21. \u2013 25. jan\u00faar.\\n\\nVerkefnin var undir stj\u00f3rn
  \u00c1g\u00fastu G\u00edslad\u00f3ttur forvarna- og t\u00f3mstundafulltr\u00faa
  \u00ed samstarfi vi\u00f0 f\u00e9lagsm\u00e1lastj\u00f3ra, kennara og stj\u00f3rnendur
  grunnsk\u00f3lans. Vi\u00f0fangsefni vikunnar voru fj\u00f6lbreytt og hef\u00f0bundin
  stundaskr\u00e1 sk\u00f3lans brotin upp. Efsta stigi\u00f0 vann a\u00f0 ger\u00f0
  forvarnaspils um t\u00f3bak, \u00e1sfengi og f\u00edkniefni. Mi\u00f0stigi\u00f0
  einbeitti s\u00e9r m.a. a\u00f0 einelti, t\u00f3baksv\u00f6rnum og almennri hollustu
  og yngsta stigi\u00f0 gl\u00edmdi vi\u00f0 m\u00e1lefni eins og umfer\u00f0 gangandi
  vegfarenda, slysavar\u00f0ir, ger\u00f0 umfer\u00f0arfr\u00e6\u00f0sluspils svo
  og matar- og svefnvenjur. Gestir komu \u00ed heims\u00f3kn og fr\u00e6ddu nemendur.
  Forvarnavikan t\u00f3kst afar vel, undirb\u00fanungur og skipulag var til fyrirmyndar.
  Nemendur og starfsf\u00f3lk sk\u00f3la t\u00f3k \u00featt \u00ed starfinu af l\u00edfi
  og s\u00e1l, einnig mj\u00f6g margir foreldrar. S\u00fa orka sem \u00feetta starf
  leysti \u00far la\u00f0ingi hefur borist \u00fat \u00ed samf\u00e9lagi\u00f0 h\u00e9r
  \u00ed Grindav\u00edk og er \u00fea\u00f0 vel. \u00c1fram Grindav\u00edk! B\u00e6jarr\u00e1\u00f0
  hefur l\u00fdst mikilli \u00e1n\u00e6gu me\u00f0 framkv\u00e6md vikunnar og flytur
  \u00f6llum a\u00f0standendum verkefnisins bestu \u00feakkir fyrir g\u00f3\u00f0
  st\u00f6rf.\\n\\n\u00de\u00f3runn \u00feroskabj\u00e1lfi\\n\\n\u00de\u00f3runn Svava
  R\u00f3bertsd\u00f3ttir h\u00f3f st\u00f6rf sem \u00feroskabj\u00e1lfi hj\u00e1
  sk\u00f3la- og f\u00e9lags\u00fej\u00f3nustu Grindav\u00edkurb\u00e6jar \u00ed jan\u00faar
  sl. H\u00fan er ekki \u00f3kunnug f\u00e9lags\u00fej\u00f3nustunni, \u00fev\u00ed
  fyrir nokkrum \u00e1rum vann h\u00fan \u00fear sem stu\u00f0ningsfulltr\u00fai undir
  lei\u00f0s\u00f6gn Bjarnfri\u00f0ar J\u00f3nsd\u00f3ttur sem j\u00f3k mj\u00f6g
  \u00e1huga hennar \u00e1 m\u00e1lefnun falla\u00f0ra. \u00de\u00f3runn f\u00f3r
  \u00ed framhaldinu \u00ed n\u00e1m og \u00fatskrifa\u00f0ist \u201e\u00e1\u00f0ur
  en h\u00fan vissi af\u201c, eins og h\u00fan or\u00f0ar \u00fea\u00f0, fr\u00e1
  Kennarah\u00e1sk\u00f3la \u00cdslands, \u00feroskabj\u00e1lfskori vor\u00f0i\u00f0
  2000 eftir \u00ferigga \u00e1ra n\u00e1m. N\u00fa er h\u00fan \u00ed teymi \u00e1samt
  Bjarnfri\u00f0i, sem er s\u00e9rkennslur\u00e1\u00f0gjafi, og Puri\u00f0i Hj\u00e1lmt\u00fdsd\u00f3ttur
  s\u00e1lfra\u00f0ingi. Hlutverk teymisins er a\u00f0 meta \u00fej\u00f3nustup\u00f6rt
  fyrir b\u00f6rn me\u00f0 s\u00e9rfarfir inni \u00e1 leiksk\u00f3lunum tveimur \u00ed
  Grindav\u00edk. \u00de\u00f3runn fer inn \u00e1 leiksk\u00f3lanu \u00ed hverri viku
  og \u00ed samr\u00e6mi vi\u00f0 starfsf\u00f3lk sem vinnur a\u00f0 stu\u00f0ningi
  barna me\u00f0 s\u00e9rfarfir fylgist h\u00fan.\\n\\nP\u00f3runn Svava R\u00f3bertsd\u00f3ttir\\n\\nme\u00f0
  st\u00f6\u00f0u \u00feeirra barna sem \u00feurfa \u00e1 stu\u00f0ningi a\u00f0 halda.
  \u00cd \u00fev\u00ed skyni er m.a. stu\u00f0st vi\u00f0 s\u00e9rstakan \u201ematslista\u201c
  sem P\u00f3runn hefur pr\u00f3a\u00f0 og mi\u00f0ar a\u00f0 \u00fev\u00ed a\u00f0
  greina styrk og st\u00f6\u00f0u barnsins vi\u00f0 allar athafnir \u00ed leiksk\u00f3lastarfinu,
  en \u00fat fr\u00e1 \u00feeirri greiningu eru sett markmi\u00f0 og \u00fej\u00e1lfsunarei\u00f0ir
  sem koma fram \u00ed einstaklingsn\u00e1mskr\u00e1 hvers barns.\\n\\nSamb\u00fdlisma\u00f0ur
  P\u00f3runnar er P\u00f3rhallur \u00c1g\u00fast Ben\u00f3n\u00fdsson sj\u00f3ma\u00f0ur
  og eiga \u00feau tv\u00f6 b\u00f6rn, Ben\u00f3n\u00fd sem er n\u00edu \u00e1ra og
  Vigd\u00eds\u00ed Mar\u00edu, eins \u00e1rs.\\n\\nN\u00fdjar \u00e1herslur \u00ed
  uppl\u00fdsingataekni\\n\\nMarka\u00f0s- og fer\u00f0am\u00e1lafulltr\u00fai sag\u00f0i
  starfi s\u00ednu lausu \u00ed jan\u00faar sl. og mun \u00fev\u00ed h\u00e6tta st\u00f6rfum
  \u00ed lok apr\u00edl. B\u00e6jarstj\u00f3ri hefur n\u00fa lagt fram till\u00f6gu
  til b\u00e6jarra\u00f0s um n\u00fdjar \u00e1herslur \u00ed m\u00e1laflokknum sem
  fela \u00ed s\u00e9r a\u00f0 skipulagt ver\u00f0i \u00e1tak \u00e1 svi\u00f0i uppl\u00fdsingataekni
  og atvinnum\u00e1la og a\u00f0 heimilt ver\u00f0i a\u00f0 r\u00e1\u00f0a verkefnisstj\u00f3ra
  til tveggja \u00e1ra. \u00c1hersluatri\u00f0i verkefnisins ver\u00f0i:\\n\\n- N\u00fdting
  uppl\u00fdsingataekni \u00ed stj\u00f3rns\u00fdslu. Uppf\u00e6rsla og marka\u00f0ssetning
  \u00e1 heimas\u00ed\u00f0u bejarins. Umsj\u00f3n me\u00f0 J\u00e1rnger\u00f0i. Alhl\u00ed\u00f0a
  auglysinga og kynningarstarf og uppl\u00fdsingami\u00f0lun til fer\u00f0af\u00f3lks.\\n-
  Saltfisksetur \u2013 N\u00fd menningarstofnun \u2013 vinna me\u00f0 b\u00e6jarstj\u00f3ra
  a\u00f0 fj\u00e1rm\u00f6gnun, skipulagningu og undib\u00faningi a\u00f0 starfrekslu
  setursins.\\n- N\u00e1\u00f0i og lifandi samstarf vi\u00f0 Bl\u00e1a l\u00f3ni\u00f0
  og Eldborg.\\n- Stadardagskr\u00e1 21 \u2013 undirb\u00faningur og ger\u00f0 framkv\u00e6mda\u00fatlanar.\\n\\nB\u00e6jarra\u00f0
  sam\u00feykkti till\u00f6gunu.\\n\\nGu\u00f0bergur\\n\\nEins og fram kemur \u00ed
  umfj\u00f6llun um 1000, fund b\u00e6jarra\u00f0s, var sam\u00feykkt a\u00f0 styrkja
  ger\u00f0 heimildarmyndar um Grindv\u00edkinginn Gu\u00f0berg Bergsson. \u00dea\u00f0
  er kvikmyndaf\u00e9lagi\u00f0 Morgunn sem framlei\u00f0ir myndina, sem ver\u00f0ur
  s\u00fdnd \u00ed r\u00edkissj\u00f3nvarpinu \u00ed tveimur hlutum um P\u00e1skana
  \u2013fyrri hlutinn a\u00f0 kv\u00f6ldi Sk\u00edr\u00f0ags og s\u00e1 s\u00ed\u00f0ari
  a\u00f0 kv\u00f6ldi F\u00f6studagsins langa. \u00cd myndinni er m.a. fjalla\u00f0
  um uppruna og uppv\u00f6xt Gu\u00f0bergs, risti\u00f0 hans og a\u00f0ra mikilv\u00e6ga
  \u00fe\u00e6tti \u00ed hans l\u00edfi.\\n\\nTveir fr\u00e1 Grindav\u00edk \u00ed
  leik gegn Brasil\u00edu\\n\\nGrindv\u00edkingar eru vanir \u00fev\u00ed a\u00f0
  eiga leikmenn \u00ed \u00edslenskum landsli\u00f0um \u00ed k\u00f6rfuknattleik.
  \u00d3lafur \u00d6rn Bjarnason og Gr\u00e9tar Hjartarson, leikmenn knattspyrnul\u00ed\u00f0s
  Grindav\u00edkur voru \u00ed byrjunarl\u00ed\u00f0i \u00edslenska knattspyrnulandsli\u00f0sins
  \u00ed leik \u00feess gegn Brasil\u00edu sl. fimmtudag. \u00deetta var fyrsti leikur
  Gr\u00e9tars og tundi leikur \u00d3lafs me\u00f0 li\u00f0inu, en \u00feeir f\u00e9lagar
  eru fyrstu A- landsli\u00f0smenn Grindav\u00edkur \u00ed \u00fer\u00f3ttinni. Ef
  fram heldur sem horfur eru \u00feeir hins vegar ekki \u00feeir s\u00ed\u00f0ustu.
  Eins og kunnugt er, l\u00e9ku Brassarnir vi\u00f0 hvern sinn fingur (e\u00f0a hverja
  t\u00e1) \u00ed leiknum og sigru\u00f0u 6-1.\\n\\n\u201ePekking st\u00fadentu \u00ed
  \u00fe\u00e1gu \u00fej\u00f3\u00f0ar\u201c er samstarfsverkefni til eflingar ranns\u00f3kna
  \u00e1 landsbygg\u00f0inni. B\u00e6jarstj\u00f3rn Grindav\u00edkur hefur sam\u00feykkt
  a\u00f0 gerast a\u00f0ili a\u00f0 verkefninu, sem gengur \u00fat \u00e1 a\u00f0
  hvetja nemendur vi\u00f0 H\u00e1sk\u00f3la \u00cdslands til \u00feess a\u00f0 stunda
  ranns\u00f3knir sem tengjast Grindav\u00edk. Hugmyndir nemanda a\u00f0 verkefnunum
  ver\u00f0a metnar af stj\u00f3rni Ranns\u00f3knarsj\u00f3\u00f0s st\u00fadentu og
  b\u00e6jarra\u00f0i. \u00c1hugaver\u00f0asta verkefni\u00f0 ver\u00f0ur styrkt me\u00f0
  kr. 200.000- framlagi fr\u00e1 Grindav\u00edkurba og kr. 300.000- til vi\u00f0b\u00f3tar
  fr\u00e1 Bygg\u00f0astofnun.\\n\\nSt\u00fadentar\u00e1\u00f0 H\u00e1sk\u00f3la \u00cdslands
  h\u00e9lt kynningarfund n\u00fa n\u00fdlega \u00fear sem fram kom a\u00f0 flest
  st\u00e6rri sveitarf\u00e9lag landsins hafa \u00e1kv\u00e6\u00f0i\u00f0 a\u00f0
  vera me\u00f0 \u00ed verkefninu.\\n\\n\u00darslitakeppnin a\u00f0 hefjast\\n\\nN\u00fa
  er \u00farslitakeppnin \u00ed k\u00f6rfuboltanum a\u00f0 hefjast. Karlarnir leika
  \u00e1 Sau\u00f0\u00e1rkr\u00f3ki fimmtudaginn 14. mars. Annar leikurinn fer fram
  \u00ed Grindav\u00edk sunnudaginn 17. mars og s\u00e1 \u00feri\u00f0ji, ef \u00fe\u00f6rf
  krefur, \u00e1 Sau\u00f0\u00e1rkr\u00f3ki \u00feri\u00f0judaginn 19. mars.\\n\\n\u00deegar
  \u00feetta er skrif\u00f0 er ekki lj\u00f3st hvort konurnar m\u00e1ta K.R. e\u00f0a
  St\u00fad\u00ednun \u00ed fyrstu umfer\u00f0.\\n\\nJ\u00e1rnger\u00f0ur hvetur alla
  Grindv\u00edkinga, h\u00e1a sem l\u00e1ga, unga sem aldna, konur og karla, til a\u00f0
  m\u00e1ta \u00e1 leiki li\u00f0anna og sty\u00f0ja okkar f\u00f3lk.\"", "\"DEILISKIPULAG
