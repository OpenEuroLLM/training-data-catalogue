  st\u00edlbrig\u00f0i \u00ed t\u00f3nlist (t.d. \u00edslensk \u00fej\u00f3\u00f0l\u00f6g).\\n-
  r\u00e6tt um eigin t\u00f3nlist og annarra \u00fat fr\u00e1 smekk og upplifun.\\n\\nSkipulag
  kennslunnar\\n\\nNemendur vinna \u00fdmist allir saman e\u00f0a \u00ed minni h\u00f3pum.
  \u00dea\u00f0 fer eftir e\u00f0li verkefnis hverju sinni.\\n\\nN\u00e1msg\u00f6gn:
  Syngjum saman, S\u00f6ngvasafn 1 og 2, hlustunarefni af \u00fdmsum toga, lj\u00f3sritu\u00f0
  textabl\u00f6\u00f0 og verkefni.\\n\\nGrunn\u00fe\u00e6ttir menntunar\\n\\nT\u00f3nlistarkennsla
  \u00ed grunnsk\u00f3la \u00e1 a\u00f0 efla n\u00e6mi nemenda og \u00feekkingu \u00e1
