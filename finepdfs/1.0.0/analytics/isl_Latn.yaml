  1924/2006, var Matv\u00e6la\u00f6ryggisstofnunin be\u00f0in um a\u00f0 skila \u00e1liti
  \u00e1 heilsufullyr\u00f0ingu sem var\u00f0ar \u00e1hrif \u201enasls sem inniheldur
  f\u00e1ar hitaeiningar (e. hypo-caloric) (KOT-v\u00f6rur)\\\" til a\u00f0 draga
  \u00far st\u00e6r\u00f0 b\u00fakfitufrumna \u00ed\\n\\n(*) \\t \u00deessi EB-ger\u00f0
