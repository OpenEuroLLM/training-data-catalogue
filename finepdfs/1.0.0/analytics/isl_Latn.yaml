  geta vaki\u00f0 upp \u00e1huga barnanna sem lei\u00f0ir til spurninga \u00farlausnar
  og skapandi hugsunar. Reynaskal a\u00f0 taka tillit til \u00e1huga hvers og eins
  er var\u00f0ar sk\u00f6pun.\\n\\nSk\u00f6pun 4-5 \u00e1ra\\n\\n| Markmi\u00f0 |
