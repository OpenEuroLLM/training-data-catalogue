  Innkaupaskrifstofu:\\n\\nhttps://reykjavik.is/utbod/\\n\\n0.1.3 \u00datbo\u00f0sg\u00f6gn\\n\\n*
  \u00datbo\u00f0sl\u00fdsing \u00feessi nr. 15641\\n* Fylgiskjal 2 - Yfirlitsteikningar
