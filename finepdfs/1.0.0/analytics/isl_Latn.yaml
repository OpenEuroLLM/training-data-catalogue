  verkefnis]\\n\\n13-tekjuskipting-[nafn verkefnis]\\n\\n14-sta\u00f0festing-[a\u00f0ili-nafn
  verkefnis]\\n\\n15-vilyr\u00f0i-s\u00fdningar-[a\u00f0ili-nafn verkefnis]\\n\\n16-marka\u00f0s\u00e1\u00e6tlun-[nafn
  verkefnis]\\n\\n17-a\u00f0rar-uppl\u00fdsingar-[nafn verkefnis]\\n\\nS\u00e9 um
  fleiri en einn a\u00f0ila a\u00f0 r\u00e6\u00f0a skal nafn hvers um sig koma fram
  \u00ed heiti fylgiskjalsins.\\n\\n1\u2003 Almennt um ums\u00f3knina\\n\\nUppl\u00fdsingar
  um verk og helstu a\u00f0standendur auk greinarger\u00f0ar um \u00f6nnur verkefni
  sem ums\u00e6kjandi hefur hloti\u00f0 styrki fyrir og eru enn \u00ed vinnslu e\u00f0a
  uppgj\u00f6ri fyrir hefur ekki veri\u00f0 skila\u00f0.\\n\\n2\u2003 Um verkefni\u00f0\\n\\nH\u00e9r
  \u00fearf a\u00f0 gera grein fyrir \u00f6\u00f0rum m\u00f6gulegum ums\u00f3knum
  \u00ed sj\u00f3\u00f0inn vegna verkefnisins. Jafnframt \u00feurfa h\u00e9r a\u00f0
  koma fram helstu uppl\u00fdsingar um verkefni\u00f0 sem og framkv\u00e6mda\u00e1\u00e6tlun
  \u00feess.\\n\\nG\u00f6gn:\\n\\n* Samningur vi\u00f0 alla r\u00e9tthafa og h\u00f6funda
  verksins.\\n* Grunnhugmynd \u00ed einni til tveimur setningum \u00e1 \u00edslensku
  og ensku.\\n* Greinarger\u00f0 leikstj\u00f3ra og framlei\u00f0anda. S\u00e9 um
  fleiri en einn leikstj\u00f3ra/framlei\u00f0anda a\u00f0 r\u00e6\u00f0a skal nafn
  hvers um sig koma fram \u00ed heiti fylgiskjalsins s\u00e9u greinarger\u00f0irnar
  ekki til \u00ed einu skjali.\\n* Einnig er h\u00e6gt a\u00f0 b\u00e6ta vi\u00f0
  sj\u00f3nr\u00e6nu efni og/e\u00f0a fyrirliggjandi kynningarefni og greinarger\u00f0um
  eftir \u00fev\u00ed sem vi\u00f0 \u00e1. Gott er a\u00f0 sl\u00f3\u00f0ir \u00e1
  fyrri verk ums\u00e6kjanda fylgi h\u00e9r me\u00f0 s\u00e9u \u00feau ekki a\u00f0gengileg
  \u00e1 kvikmyndavefnum.\\n\\nHandritsums\u00f3knir \u2013 leiki\u00f0 efni\\n\\n*
  S\u00f6gu\u00fer\u00e1\u00f0ur (logline) verksins \u00ed einni til tveimur setningum.\\n*
  Handrit/\u00fardr\u00e1ttur (sj\u00e1 n\u00e1nar h\u00e9r \u00e1 eftir).\\n* Greinarger\u00f0
  handritsh\u00f6fundar um verki\u00f0 og frekari \u00fer\u00f3un \u00feess.\\n* Skila
  \u00fearf a.m.k. einni fullskrifa\u00f0ri senu me\u00f0 samt\u00f6lum \u00feegar
  s\u00f3tt er um I. hluta handritsstyrks og \u00feremur senum \u00feegar s\u00f3tt
  er um II. hluta.\\n\\nLeiknar kvikmyndir \u00ed fullri lengd\\n\\n* I. hluti \u2013
  S\u00f6gu\u00fer\u00e1\u00f0ur (synopsis), 4\u20136 bls.\\n* II. hluti \u2013 \u00cdtarlegur
  s\u00f6gu\u00fer\u00e1\u00f0ur (treatment), 10\u201315 bls.\\n* III. hluti \u2013
  Uppkast a\u00f0 handriti \u00ed fullri lengd, \u00e1 \u00feessu stigi er \u00e6skilegt
  a\u00f0 framlei\u00f0slufyrirt\u00e6ki komi a\u00f0 verkefninu.\\n\\nSj\u00f3nvarps\u00fe\u00e6ttir\\n\\n*
  I. hluti \u2013 S\u00f6gu\u00fer\u00e1\u00f0ur (synopsis) fyrir fyrsta \u00fe\u00e1tt,
  4\u20136 bls. Stuttur \u00fatdr\u00e1ttur (short synopsis) a\u00f0 h\u00e1marki
  1 bls. fyrir hvern \u00fe\u00e1tt annan.\\n* II. hluti \u2013 \u00cdtarlegur s\u00f6gu\u00fer\u00e1\u00f0ur
  (treatment) fyrir fyrsta \u00fe\u00e1tt, u.\u00fe.b. 10 bls. S\u00f6gu\u00fer\u00e1\u00f0ur
  (synopsis) fyrir hvern \u00fe\u00e1tt annan.\\n* III. hluti \u2013 Handrit a\u00f0
  fyrsta \u00fe\u00e6tti. \u00cdtarlegur s\u00f6gu\u00fer\u00e1\u00f0ur (treatment)
  fyrir hvern \u00fe\u00e1tt annan, \u00e1 \u00feessi stigi er \u00e6skilegt a\u00f0
  framlei\u00f0slufyrirt\u00e6ki og sj\u00f3nvarpsst\u00f6\u00f0 komi a\u00f0 verkefninu.\\n\\nHandrit
  og \u00fer\u00f3un \u2013 heimildamyndir\\n\\nHandritsstyrkir\u2003 \u00datdr\u00e1ttur
  e\u00f0a fyrirhugu\u00f0 efnist\u00f6k, 2\u20134 bls. \u00fear sem fram kemur heildars\u00fdn
  og s\u00f6gu\u00fer\u00e1\u00f0ur. Greinarger\u00f0 h\u00f6fundar um verkefni\u00f0.
  Fari\u00f0 er fram \u00e1 stutta en n\u00e1kv\u00e6ma l\u00fdsingu \u00e1 fyrirhuga\u00f0ri
  myndr\u00e6nni uppbyggingu myndarinnar og uppl\u00fdsingar um hvernig styrkurinn
  mun n\u00fdtast vi\u00f0 \u00fer\u00f3un verkefnisins. \u00der\u00f3unarstyrkir\u2003
  Greinarger\u00f0 leikstj\u00f3ra, s\u00fdn og markmi\u00f0. L\u00fdsing \u00e1 myndr\u00e6nni
  uppbyggingu verksins og ef til vill s\u00fdnishorn af myndefni. Grunnhugmynd \u00ed
  einni til tveimur setningum (logline). Efni myndarinnar \u00ed stuttu m\u00e1li
  (short synopsis) sem og uppl\u00fdsingar um \u00ed hva\u00f0 n\u00fdta skal styrkinn.\\n\\nFramlei\u00f0slustyrkir\\n\\nMe\u00f0
  framlei\u00f0slustyrkjaums\u00f3knum allra flokka \u00fearf allt sem nefnt er h\u00e9r
  a\u00f0 framan a\u00f0 fylgja ums\u00f3kn og fullb\u00fai\u00f0 handrit verkefnis.\\n\\n3\u2003
  Lykilhlutverk\\n\\nListi skal fylgja yfir a\u00f0standendur og listr\u00e6na lykilstarfsmenn
  sem og helstu leikara sem stefnt er \u00e1 a\u00f0 f\u00e1 til verksins.\\n\\nUppl\u00fdsingar
  um me\u00f0framlei\u00f0endur og fj\u00e1rm\u00f6gnunara\u00f0ila eftir \u00fev\u00ed
  sem vi\u00f0 \u00e1 sem og fyrirhuga\u00f0a samframlei\u00f0slusamninga. Fyrirliggjandi
  samningar skulu fylgja me\u00f0. S\u00e9 um fleiri en einn samning a\u00f0 r\u00e6\u00f0a
  og \u00feeir ekki til \u00ed einu skjali skal heiti hvers samframlei\u00f0slufyrirt\u00e6kis
  koma fram \u00ed heiti fylgiskjalsins.\\n\\nEinnig skulu fylgja sta\u00f0festingar
  \u00e1 \u00fe\u00e1ttt\u00f6ku lykilstarfsmanna, vi\u00f0 ums\u00f3kn getur \u00fea\u00f0
  veri\u00f0 yfirl\u00fdsing um \u00e1huga \u00e1 \u00fe\u00e1ttt\u00f6ku.\\n\\n\u00deegar
  s\u00f3tt er um framlei\u00f0slustyrk \u00feurfa a\u00f0 liggja fyrir samningsdr\u00f6g
  (deal memo) vi\u00f0 leikstj\u00f3ra. Einnig \u00fearf ferilskr\u00e1r helstu a\u00f0standenda
  og lykilstarfsmanna sem og framlei\u00f0slu- og samframlei\u00f0slufyrirt\u00e6kja.
  S\u00e9u skj\u00f6lin ekki til \u00ed einu lagi \u00fe\u00e1 skal nafn hvers og
  eins a\u00f0ila koma fram \u00ed heiti skjalsins. Ferilskr\u00e1r einstaklinga skulu
  greina s\u00e9rstaklega hva\u00f0 vi\u00f0komandi hefur gert \u00e1\u00f0ur \u00ed
  kvikmyndager\u00f0. Sk\u00f3laverkefni eiga ekki heima \u00e1 ferilskr\u00e1 nema
  a\u00f0 verkefnin hafi fer\u00f0ast t\u00f6luvert.\\n\\n4\u2003 Fj\u00e1rm\u00e1l
  og \u00e1\u00e6tlanir\\n\\nKostna\u00f0ar\u00e1\u00e6tlun skal skila \u00e1 formi
  KM\u00cd e\u00f0a \u00f6\u00f0ru al\u00fej\u00f3\u00f0lega vi\u00f0urkenndu formi.
  \u00deegar um handrits- e\u00f0a \u00fer\u00f3unarstyrki er a\u00f0 r\u00e6\u00f0a
  er n\u00f3g a\u00f0 skila einf\u00f6ldu formi \u00fear sem fram kemur \u00ed hva\u00f0
  styrkveitingin er hugsu\u00f0. \u00deegar um minnihlutaframlei\u00f0slu h\u00e9r
  \u00e1 landi er a\u00f0 r\u00e6\u00f0a \u00fearf, auk heildarkostna\u00f0ar\u00e1\u00e6tlunar
  verkefnisins, a\u00f0 fylgja me\u00f0 yfirlit yfir kostna\u00f0 eftir l\u00f6ndum.\\n\\nUppl\u00fdsingar
  um fj\u00e1rm\u00f6gnun \u00feurfa a\u00f0 liggja fyrir \u00e1samt fj\u00e1rstreymis\u00e1\u00e6tlun
  og \u00e1\u00e6tlun um eigna- og tekjuskiptingu. Jafnframt \u00fearf a\u00f0 veita
  uppl\u00fdsingar um a\u00f0ra styrki sem s\u00f3tt hefur veri\u00f0 um e\u00f0a
  fengist hafa til verkefnisins.\\n\\n\u00deeim sta\u00f0festingum \u00e1 fj\u00e1rm\u00f6gnun
  sem liggja fyrir skal skila inn me\u00f0 ums\u00f3kn.\\n\\nLeggja \u00fearf marka\u00f0s-
  og kynningar\u00e1\u00e6tlun fram me\u00f0 framlei\u00f0sluums\u00f3kn sem og vilyr\u00f0i
  fyrir s\u00fdningum, sl\u00edk vilyr\u00f0i styrkja jafnframt ums\u00f3knir \u00e1
  fyrri stigum.\\n\\n5\u2003 Kynjav\u00e6gi\\n\\nUppl\u00fdsa \u00fearf um kyn lykilstarfsmanna
  og eru ums\u00e6kjendur hvattir til a\u00f0 kynna s\u00e9r og fylla \u00fat Bechdel-pr\u00f3fi\u00f0.\\n\\n6\u2003
  Sta\u00f0festing\\n\\nH\u00e9r er unnt a\u00f0 skila inn \u00f6\u00f0rum g\u00f6gnum
  sem ums\u00e6kjandi telur a\u00f0 m\u00e1li skipti\\n\\nA\u00f0 lokum sam\u00feykkir
  ums\u00e6kjandi a\u00f0 allar uppl\u00fdsingar s\u00e9u r\u00e9ttar og sendir inn
  ums\u00f3kn.\"", "\"THE\\n\\nLITERARY JOURNAL\\n\\nOF\\n\\nTHE UNIVERSITY OF PENNSYLVANIA.\\n\\nVOLUME
  II.\\n\\nPHILADELPHIA:\\n\\nPRINTED AND PUBLISHED BY THE UNIVERSITY PRESS.\\n\\n1835.\\n\\n348.044\\nYf;\\n\\nActa
  Yfirr\u00e9ttarins \u00e1 \u00cdslandi,\\nfyrir \u00e1rin 1763-1767\\n\\nLeir\u00e1rg\u00f6rdum
  vid Leir\u00e1, 1802.\\nPrentud \u00e1 kostnad Sekret\u00e9ra B. Stephensens,\\naf
  Fact\u00f3ri og B\u00f3lkryckjara Schagsjord.\\n\\nAnn\u00f3 1763, hann 14da J\u00fali,
  var Rf\u00edr-retturinn settur undir Pr\u00e6sidio Amtmanns M. G\u00edslasonar,
  med undirstifudum Assess\u00f3rum.\\n\\nNum. I.\\n\\nM\u00e6tti \u00ed \u00deir-rettinum
  S\u00fdslumadur E., Olafsson, og framlagdi yfir-rettar stefnu af 20ta J\u00fal\u00fa
  1762, med hvorri Logmadur S. S\u00f3lvason er stefndur ad m\u00e6ta og forsvara
  s\u00fdrir \u00feessum Retti, s\u00edun \u00farskurd og d\u00f3m, a\u00f0sagdann
  14da J\u00fal\u00fa, s. \u00e1., m\u00f3ti S\u00fdslumanns E. Olafssonar \u00e1tj\u00e6rurnu.
  Einaig stefnisk S\u00fdslumadur P. Gu\u00f0mundsson, sem Aktor \u00ed m\u00e1linu;
  stefnan lesin og morkud lit. A. Logmadur S. S\u00f3lvason m\u00e6tur sin eginu vegna,
  en Logrettunadur J\u00f3n J\u00f3nsson fr\u00e1 Stranda-sj\u00f3lu vegna Aktoris.
  S\u00fdslumadur E. Olafsson setur \u00ed rett: ad Amtmadur M. G\u00edslason, er
  sig hafi s\u00faspenderad, se \u00feessu m\u00e1li interesseradur, hv\u00f8r upp\u00e1
  Amtmadurinn ystrga\u00f0i til.\\n\\nsitt, sem Praeses, og yfirliet \u00fead Landf\u00f6geta
  S. Niagn-\\n\u00fassyni, er \u00ed hans st\u00f6\u00f0 pr\u00e6s\u00edderadi, eptir
  hra. Amt-\\nmausins brei\u00f0 \u00fear um af dags dat\u00f3, sem var lesid og\\nmarkad
  lit. B. Lika svo forliet S\u00fdslumadur M. Rey-\\nilsson Rettinn, sem tilskickadur
  Aktor \u00ed \u00feessu m\u00e1li fyrr\\nir Log\u00feingis rectinum 1761. \u00deessu
  n\u00e6rist var framlagdur\\nLog\u00feingis Pr\u00f3sesfs og d\u00f3mur, genginn
  \u00ed m\u00e1linu 1762,\\nmed hverjum S\u00fdslumadue E. Olafsson, er d\u00e6mdur\\nfr\u00e1
  S\u00fdslumanus Emb\u00e6ttinn, og \u00ed sext\u00f6gi l\u00f3\u00f0a sylf-\\nurs
  b\u00e6tur. Pr\u00f3sessinn lesun og markadur lit. C.\\nLogmadur S. S\u00f6lvason
  upp\u00e1stendur: ad S\u00fdslumadur\\nE. Olafsson, annadhvort me\u00f0g\u00e6ngi
  S\u00fdslumanus S.\\nSigurdssonar vitnatektir \u00ed Pr\u00f3sessinnu gyldar og
  g\u00f6\u00f0-\\nar, edur og ad m\u00e1lid fr\u00e1visist, har S\u00fdslumadurinn
  se\\necki stefnudur. Par til svarar S\u00fdslumadur E. Olafss-\\nson: ad hann hafi
  ecki haft nockra naunds\u00fdulega ors\u00f3k ad\\nstefta S\u00fdslumanni S. Sigurdssyni
  fyrrir henna Rett;\\nhier \u00e1telji hann ein\u00fangis ofshardann d\u00f3m Logmannsins,\\nen
  ecki Herads vitnaleidslu S\u00fdslumannsins, og framlagdi\\npar n\u00e6rist innlegg
  af 12ta h\u00fams, \u00ed hv\u00f8rju hann demon-\\ns\u00edrerar sitt sakleysi um
  fors\u00f3mun og hj\u00e1hlidrun \u00ed ad in-\\nquirera \u00ed \u00feessu mords
  m\u00e1li, og upp\u00e1stendur: ecki ein\u00fang-\\nis ad Logmanns S. S\u00f6lvasonar
  d\u00f3mur ver\u00f0i upphaf-\\ninn, heldur ad hann og Aktor ver\u00f0i tilsundir
  ad betala\\nser \u00e1n\u00e6gjanlega Satisfakti\u00f3n, sem innleggid framar\\ns\u00ed;
  lesid og markad lit. D. Logmadurinn upp\u00e1stendur\\nmunumunulega: ad sinn d\u00f3mur
  ver\u00f0i stadfestur, svo sem hann\\nse \u00e1 k\u00f3nglegum logum og tilskipunum
  grundvalladur, en\\nyfirl\u00e6tur til Rettarins \u00e1litis, hvort hann \u00ed
  neckurn m\u00e1ta\\nkunni ad lirast; og fr\u00e1setur Satisfakti\u00f3n og m\u00e1lsk\u00f3sin-\\nadi.
  Lagrettunadur J\u00f3ni J\u00f3nsson framlagdi innlegg\\naf 27da Juni n\u00e6rist\u00ed\u00f0u,
  undir nafni S\u00fdslumanns P.\\nGudmundssonar, \u00ed hv\u00f8rju hann refererar
  sig til s\u00edna,\\nf\u00e6rir Logspingis-rettiunum n\u00e6rsli\u00f0id \u00e1r,
  gj\u00f6rdu Frettes\u00e6t-\\ntelser, og bidur, ad \u00fe\u00e6r ver\u00f0i loglegar
  \u00e1litnar, en se\\ntild\u00e6mist kostur og t\u00e6ring af S\u00fdslumanni E.
  Olafs-\\nsyni; innleggid lesid og markad lit. E. Par-m\u00e1lss-\\npartarnir gva\u00f0nisk
  ekkeri meira hafa fram ad f\u00e6ra, var\\naf \u00deir-rettiunum eptirfylgjandi
  D\u00f3mur \u00ed m\u00e1linn af-\\nsagdut:\\n\\nAf vitiun J\u00f3ns Eyilssonar
  og Magn-\\n\u00fasar Sigmundssonar, sem heir med eindu\\nstadfest hafa \u00e1 Z\u00f3ls
  blugi 1760, er fullkom-\\nlega sannad: ad mordinginn Bjarni Rol-\\nbeinsson, hafi
  syrir S\u00fdslumanni E. Olafs-\\nsyni ang\u00e9sinn verid \u00ed heirra, sem votta,
  vi\u00f0-\\nurvist, syrir mord \u00e1 Sigridi J\u00f3nsd\u00f3ttur, af\\nbr\u00f6\u00f0ur
  hans og \u00e6ndvitara \u00ed sama verki J\u00f3-\\nseph Rolbeinssyni, n\u00e9r
  4 \u00e1rum \u00e1dur; og\\nsvo lengi hefir S\u00fdslumadurinn fors\u00f3mad og\\nl\u00e1tid
  hj\u00e1lta\u00f0a m\u00e1lid ad ransaka og d\u00e6ma, allt\\n\u00fear til hann
  \u00e1ri\u00f0 1760 f\u00e9kk Hra. Amtmanns\\nM. G\u00edslasonar skipun \u00fear
  um, hv\u00f8rri hann\\nb\u00f3 seinlega og \u00f3fullkomlega hefir eptirlifad,\\nekki
  heildur forsvaranlega mordingjann \u00ed arresti\\n\\nhaldid, svo Hra: Amem\u00e1durinn
  m\u00e1tti st\u00edcka einn annann vid m\u00e1lid ad gjora; en ad mordid \u00e1
  Sigr\u00ed\u00f0i J\u00f3nsd\u00f3ttur, sem hetta m\u00e1li afri\u00f0, hafi S\u00fdslumanni
  veri\u00f0 til vitundar g\u00e6st\u00ed fyrr enn 1756, er h\u00e9r ecki sannad,
  jasvel \u00fe\u00f3 sama mord mor\u00e1um \u00e1rum fyri innan S\u00fdslu sk\u00e9d
  hafi. \u00deessi hans fors\u00f3mun og \u00f3heyrilega hj\u00e1lhidrun \u00ed svo
  \u00e1r\u00f0anda m\u00e1li, sanna n\u00f3glega \u00ed H\u00e9ra\u00f0i tekin pingsvitni;
  \u00fev\u00ed d\u00e6mist r\u00e9tt.\\n\\nS\u00fdslumadur L. Olafsson skal fyrir
  sitt \u00f3forsvaranlega byrduleysi \u00ed \u00feessu m\u00e1li, hafa forbr\u00f3tid
  s\u00edna d\u00f3marar Bestilling, og ecki fr\u00e1mar S\u00fdsluman\u00fas emb\u00e6tti
  p\u00e9na; en fyrir frekari \u00fatl\u00e1tun er hann fr\u00edkennndur, og ad \u00fev\u00ed
  leiti Log\u00feingis d\u00f3murinn moderera\u00f0ur.\\n\\nActum ut supra.\\n\\nS.
  Magn\u00fasson.\\n\\nB. Mark\u00fasson. D. Steph\u00e1nsson.\\nJ. Olafsson. G. Sigurdsson.\\nB.
  Sigurdsson. P. Magn\u00fasson.\\nB. Haldorsson. P. Porsteinsson.\\nD. Sch\u00e9ving.
  G. Run\u00f3lfsson.\\nJ. Egg\u00e9rtsson. P. Axelsson.\\nOlasur J\u00f3nsson. Olasur
  Bj\u00f8nsensson.\\nJ\u00f3n, J\u00f3nsson. J\u00f3n Porgeirsson.\\n\\nNUM.\\n\\nNum.
  II.\\n\\nPann 15da J\u00fal\u00ed m\u00e6tti i \u00ddfir-rettinum S\u00fdslumadur
  B. Zald\u00f3rsson, og framlagdi \u00ddfir-rettar stefnu af 3ja Aug. 1762, me\u00f0
  hv\u00f8rri stefnist Legmadur S. S\u00f3lvason, ad forsvara einn af honun pann 13da
  J\u00fal\u00ed, s. \u00e1r afsg\u00e6ddanu \u00de\u00f6g\u00feingis d\u00f3m. Lika
  svo stefnist Porsteinn Gudbrandsson, sem m\u00e1lepartur, ad forsvara s\u00edna
  Afti\u00f3n \u00ed m\u00e1linu, og h\u00e1dir ad hola endilegann \u00ddfir-rettar
  d\u00f3m, sem stefnan framar med ser her, lesin og morkud lit. A. S\u00fdslumadur
  M. Retilsson framlagdi Amtmanns M. G\u00edslasonar skipun til sin, af 7da h\u00fajus,
  ad g\u00e1nga \u00ed rett; sem talsmadur, Porsteins Gudbrandssonar vegna, lesin
  og morkud lit. B. Par n\u00e6rist framlagdi S\u00fdslumadur B. Zald\u00f3rsson \u00de\u00f6g\u00feingis
  Pr\u00f3sess og d\u00f3m \u00ed \u00feessu m\u00e1li, me\u00f0 hv\u00f8rri S\u00fdslumadurinn
  er tild\u00e6mdur ad betala jordli til Porsteins Gudbrandssonar, fyrir ofhastarlegann
  d\u00f3m \u00ed skinni, sem Pr\u00f3ssinn med ser f\u00e6rir, lesin og markadur
  lit. C. S\u00fdslumadur B. Zald\u00f3rsson beidist: ad skum \u00feess hafi meini
  Amtmann M. G\u00edslason vera \u00feessu m\u00e1li interesseradann, \u00fear hann
  \u00ed hv\u00ed hafi \u00fatg\u00e6st Ordres, svo m\u00e6tti honum h\u00f3cknast
  ad yfirl\u00e1tu einum sdrum, ad pr\u00e6sidera \u00ed \u00ddfir-rettinum \u00ed
  sinn sta\u00f0, hvad Amtmadurinn cinnig eptirliet, me\u00f0 skriflegri fullm\u00e6kt
  \u00fear um til Landsf\u00f3geta S. Magn\u00fassonar, lesin og morkud lit. D. En
  \u00ddfir-rettarins Assessor\u00e9r pr\u00f3testerudu skrifega \u00e1 m\u00f6ti
  \u00feessari.\\n\\nS\u00fdslumanns B. Gald\u00f3rssonar innvendingn, og hef\u00f0i
  ecki Amtmanninn vera m\u00e1linu, vidkomandi, sem Pr\u00f3testia framfar s\u00fdnir,
  lesid og markad lit. E. Muunlega upp\u00e1ri\u00f0 S\u00fdslumadur B. Gald\u00f3rsson:
  a\u00f0 Logmadur S. S\u00f6lvason hafi fyrr \u00ed d\u00f6mi s\u00ednum \u00e1litid
  sig haft hafa billega ors\u00f6k, a\u00f0 sundra samvistir Gudbrands Arasonar og
  Margretar J\u00f3nsdottur, en p\u00f3 s\u00eddar \u00ed sama d\u00f6mi, tilsundid
  sig ad betala peninga m\u00falt, er hann meinar hvort \u00e6dru gagnst\u00e6\u00f0t,
  og upp\u00e1siendur \u00fev\u00ed, ad Logma\u00ednsins d\u00f3mur ver\u00f0i ad
  engu gj\u00f6r\u00f0ur, en ser tildeamd Reparation og m\u00e1lskostnadur, og refererar
  sig run framfar til s\u00edns innylleggs fyrir Log\u00feingi\u00f0rettinu. Logmadur
  S. S\u00f6lvason upp\u00e1siendur Par\u00e1m\u00f3ti: a\u00f0 s\u00ednn d\u00f3mur
  ver\u00f0i staffestm\u00e6; en S\u00fdslumadur M. Ketilss\u00f3ri upp\u00e1siendur
  kost og t\u00e6ringu, s\u00edns Prinsipals vegna. Meira framf\u00e6rdu ecki partarnir
  \u00ed \u00feessu m\u00e1li, hvors vegna \u00fear \u00ed var eptirfylgjandi d\u00f3mur
  af \u00deir-rettinum aflag\u00f0ur:\\n\\nJafnvel p\u00f3 Margr\u00e9t J\u00f3nsd\u00f3ttir
  hef\u00f0i um \u00fead st\u00f3rmali riktu\u00f0 ver\u00f0i, sem Vestur hennar og
  hingmenni hafa framf\u00e6rt, p\u00f3 obevissad, fyrir S\u00fdslumann B. Gald\u00f3rsson
  \u00e1 Stadar \u00feingi, \u00feann 14da Maji 1759, h\u00e1 bar p\u00f3 S\u00fdslumanninum
  fyrir ad ransaka um r\u00edsisins \u00e1s\u00edkomulag og grundvoll, enn ad d\u00e6ma
  nejndu Margr\u00e9tu J\u00f3nsd\u00f3ttur, oldangis \u00f3s\u00fdrirkallada, \u00f3davarada
  og \u00f3vitandi, ad\\n\\nad skj\u00e1 sitt heimili og kirkju-s\u00f3kn, undir vidaliggjandi
  h\u00fadl\u00e1ts reffingu; \u00fev\u00ed d\u00e6mist-r\u00e9tt:\\n\\nS\u00fdslumadur
  B. Hald\u00f3rsson skal, eptir Log\u00feingis domi \u00ed hessu in\u00e1li, betala
  til Porsteins Gudbrandssonar, ektamanus Margr\u00e9tar J\u00f3nsd\u00f3ttur, l\u00f3rdli,
  \u00ed Reparatston og m\u00e1ls-kostnad, svo vel til \u00feessa sem Log\u00feingis-r\u00e9ttarins,
  er luttir skulu vera innan n\u00e6ristkomandi Michaelis-messu, undir adf\u00e6r
  og Exek\u00fati\u00f3n.\\n\\nActum ut supra.\\n\\nM. G\u00edslason.\\n\\nB. Mark\u00fasson.
  D. Steph\u00e1nsson.\\nG. Sigurdsson. B. Sigurdsson.\\nP. Magn\u00fasson. S. Sigurdsson.\\nP.
  Porsteinsson. G. Run\u00f3lfsson.\\nD. Sch\u00e9ving. J. Egg\u00e9rtsson.\\nP. Axelsson.
  J\u00f3n J\u00f3nsson.\\nOlasfur J\u00f3nsson. Olasfur Bj\u00f6rnsson.\\nJ\u00f3n
  J\u00f3nsson. J\u00f3n Horgeirsson.\\n\\nNum. III.\\n\\nSama eptirmiddag m\u00e6tti
  \u00ed \u00dejir-rettinum S\u00fdslumadur P. Porsteinsson, og framlagdi Amtmanns
  M. G\u00edslasonar Skickun til s\u00edns, af 9da h\u00falus, ad pr\u00f3kurera sok
  J\u00f3ns Arnasonar m\u00f3ti Logmanni B. Mark\u00fas-\\nsyni og sdr\u00fam vidkomendum
  \u00ed m\u00e1linu; lesin og morkud\\nlit. A. Einnig framlagdi nefndur S\u00fdslumadur
  \u00deir-\\nrettar s\u00ed\u00f0an, af 4da Dec. 1762, med hvorri stefnisti:\\n1.)
  Logmadur B. Mark\u00fasson, til ad forsvara sinn af-\\nsagdann Log\u00feingis d\u00f3m;
  2.) S\u00fdslumadur L. Gud-\\nmundsson; 3.) \u00deyrrun S\u00fdslumadur B. N\u00edkol\u00e1sson,\\nog
  4.) J\u00f3n og \u00cdsleifur Gudmundssynir, til ad\\nforsvara s\u00edn ungang \u00ed
  sekinni, sem stefnan framar med\\nser ber, lesin og morkud lit. B. Enn h\u00e1 framlag\u00f0\\nS\u00fdslumadur
  P: Porsteinsson konunglega allran\u00e1dng-\\nustn Uppreisn af 12ta Martsi 1762,
  til ad innstefua\\nhennu Log\u00feingis d\u00f3m, sem var lesin og morkud lit C.\\nL\u00edka
  svo allran\u00e1dngasta Beneficium Paupertatis, af sama\\ndat\u00f3, lesid og markad
  lit. D. S\u00fdslumadur L. Gud-\\nmundsson, af Rettinum upphr\u00f3padur, m\u00e6tir
  ecki eda\\nnockur hans vegna. Logmadur B. Mark\u00fasson m\u00e6tir,\\nog proponerar,
  hvort sokin skuli fyrirtakast, fyrrst S\u00fdslu-\\nmadur L. Gudmundsson ecki m\u00e6ti,
  sem h\u00f3 se hofud-\\nm\u00e1lsp\u00e6tnr \u00ed sekinni. S\u00fdslumadur P. Porsteinsson\\npr\u00f3testar
  allt uppihald, og bidnr um \u00deir-rettarins \u00e1-\\nlyktun hj\u00f8r um, sem
  hannig var afssgd:\\n\\nPar stefnan med ser ber S\u00fdslumanns\\nL. Gudmundssonar
  peckjanlega upp\u00e1s-\\nskrift, svo kann ecki upp\u00e1 Logmanns B.\\nMark\u00fasssonar.
  Pr\u00f3position ad reflektens\\nast,\\n\\nast, heldur skal m\u00e1lid hafa sinn
  hindrun-\\narlausann framg\u00e1ng.\\n\\nS\u00fdslumadur P. P\u00f3rsteinsson framlagdi
  L\u00f6g\u00feingis\\nPr\u00f3cess og d\u00f3m i \u00feessu m\u00e1li, \u00ed hvors
  sluttningu Hjers-\\nads d\u00f3mar S\u00fdslunnans L. Gudmundssonar er sj\u00e1\u00f0-\\nf\u00e6tur,
  svo vidt hofud-sakina snertir, sem hann fram-\\nar med ser ber, lesi\u00f0 og marka\u00f0ur
  lit. E. Enn \u00fe\u00e1\\nframlagdi S\u00fdslumadur P. P\u00f3rsteinsson innlegg
  af\\ndags dat\u00f3, hv\u00f8r \u00ed hann frams\u00e6rir \u00fe\u00e6r \u00e1s\u00e6\u00f0ur,
  sem\\nJ\u00f3ni Arnasyni kunni a\u00f0 vera til astokunar m. m., lesi-\\n\u00f0
  og marka\u00f0 lit. F. L\u00f6gma\u00f0ur B. M\u00e1rkusson fram-\\nlagdi innlegg
  af dags dat\u00f3, sinnum L\u00f6g\u00feingis d\u00f6mi til\\nstyrkingar, lesi\u00f0
  og marka\u00f0 lit G. Innlegg var einnig\\nframlagt fr\u00e1 fyrrum S\u00fdslumanns
  B. V\u00edk\u00f3l\u00e1ssyni af\\n4da. J\u00fan\u00ed n\u00e1rsil, sem er hans
  a\u00dfakan mot kontrapar-\\ninum; lesi\u00f0 og marka\u00f0 lit. H. Umb\u00f6d
  til Gunnars\\nJ\u00f3nssonar fr\u00e1 J\u00f3ni og \u00cdsleifs Gudmundssonum;\\nyar
  \u00ed \u00ddstr-rettinn framlagt, \u00e1samt innleggi heirra vegna,\\naf 14da.
  h\u00faus, sem var lesi\u00f0 og marka\u00f0 lit. J og K.\\nMeira frams\u00e6rdu
  ecki partarnir \u00ed s\u00f3kn \u00e9\u00f0ur v\u00f6rn, var\\n\u00fev\u00ed af
  \u00ddstr-rettinum svol\u00e1tandi d\u00f3mur \u00ed m\u00e1linn a\u00dfagdur:\\n\\n\u00deat
  er me\u00f0 legfostum vitnum m\u00f6glega\\nsannad, \u00e1\u00f0 s\u00fa sama ull,
  sem stolin var ad\\nuppbrotnu h\u00fasi og hyr\u00f0slum, \u00e1samt \u00f3\u00f0rum
  f\u00e9-\\nmunym, n\u00f3tturna milli \u00feess zars og zia Okt.\\n1758, \u00e1
  Nordurgardi, er sem virkiteguv\\n\u00fej\u00f3fs-f\u00e9li sunding n\u00e6rrsta
  dag eptir, hj\u00e1 J\u00f3ni\\n\\n\u00c1rnar\\n\\nArnasyni, komnum \u00e1 ferd
  med hana burt \u00e1r\\n\u00edveitinni og s\u00fdslunni, ad hvorri hann, eptar\\nundangengna
  tregdu og veigrun, um s\u00ed\u00f0ir lysti\\nsinni heimildar-mann, enn logfelldann,
  ad\\nnafni H\u00f6rsteinn Vigf\u00fasson, hvad hann h\u00f6\\n\u00e1ldrei hestir
  kunnad ad sanna; heldur hestir\\nnefundur H\u00f6rsteinn fr\u00e1lagt s\u00e9r hans
  frambur\u00f0\\nmed eidi; \u00fev\u00ed d\u00e6mist r\u00e9tt:\\n\\nPeir afsegdu
  H\u00e9ra\u00f0s og Logstugis\\nd\u00f3mar \u00ed \u00feessu m\u00e1li eru, hvad
  adal-sok-\\nina snertir, h\u00e9r med staffestir; en har\\nErek\u00fatsj\u00f3nen
  yfir sakamauniinni hestir\\nframfarid of hastarlega, \u00fe\u00e1 skal S\u00fdslu-\\nmadur
  L. Gudmundsson betala til\\nf\u00e1taekra \u00ed M\u00fdrdal 4rdli.-kr\u00f3n.,
  og til\\nJ\u00f3ns Arnasonar 4rdli., hv\u00f8rja 8rdli.\\nkr\u00f3n. S\u00fdslumadurinn
  skal hafa betalad\\ntil hlut\u00e1degenda innan n\u00e6ristkomandi\\nMichaelis-messu,
  undir adfer og Ere-\\nk\u00fatsj\u00f3n.\\n\\nActum ut supra.\\n\\nM. G\u00edslason.\\nS.
  Solvason. D. Steph\u00e1nsson.\\nJ. Olafsson. B. Stigurdsson.\\nP. Magn\u00fasson.
  B. Hau\u00f0\u00f3rsson.\\nM. K\u00e9tilsson. D. Scheving.\\nS. Sigurdsson. J. Eggertsson.\\n\\nP.
  Arelsson. J\u00f3n J\u00f3nsson.\\nOlafur J\u00f3nsson. Olafur Bj\u00f6rnsson.\\nJ\u00f3n
  J\u00f3nsson. J\u00f3n Porgeitsson.\\n\\nAnn\u00f3 1764, \u00feann 14da J\u00fal\u00ed,
  var \u00deir\u00b7r\u00e9tturinn settur, undir Praesidio Amtmanus O. Steph\u00e1nssonar,
  med undirstrifuduni Assessorum.\\n\\nNum. I.\\n\\nM\u00e6tti \u00ed \u00deir\u00b7rettinum
  S\u00fdslumadur E. \u00d3lafsson, og framlagdi honum af konunglegri H\u00e1tign
  allramilbilegasi \u00fatg\u00e6sna Oprei\u015bning, af 8da. Apr. 1763, ad mega upp\u00e1ta\u00f0a
  og innstefna fyrir hennanu \u00deir\u00b7rett, eptir f\u00e6ra Apellacionis, cinum
  af L\u00f8gmanni S. S\u00f6lvasyni af segdum Leg\u00feingis d\u00f6mi, milli Citanten
  og S\u00e1konar J\u00f3nssonar, samt annara vidkomenda, sem Oprei\u015bningin framar
  s\u00fdnir, lesin og m\u00f8rkn\u00f0 lit. A. Pvi n\u00e6rst var framlagd \u00deir\u00b7rettar
  siesna af 19da J\u00fal\u00ed 1763, med hvorri innstefna\u00f0 L\u00f8gniennirnir
  S. S\u00f6lvason, sem D\u00f3mari og J\u00f3n \u00d3lafsson sem Pr\u00f3kurator
  \u00ed Hjeradi, einnig sakar-adilinn S\u00e1kon J\u00f3nsson og S\u00fdslumadur
  S. Jakobsson, sem D\u00f3mari \u00ed Hjeradi, serhv\u00e6r ad sv\u00e1ra til\\n\\ntil
  hess er honum vidkjemur, og lida d\u00f3m; ste\u00f0nan lefi in og morkud lit. B.
  Eptir ste\u00f0nunni metir Visi-logmadur J. Olafsson upp\u00e1 Logmanns S. S\u00f6lvasonar
  og eginn vegna, en hverski metti S\u00fdslumadur S. Jakobsson uje heldur S\u00e1kon
  J\u00f3nsson, \u00fe\u00f3tt upphr\u00f3pdir v\u00e6rn; hessir h\u00f3 annars ste\u00f0nan
  beim loslega birt ver\u00f0i, sem uppastr\u00edstirnar s\u00f3na. Visi-logmadur
  J. Olafsson pr\u00f3testar ad svara til m\u00e1lsins, \u00e1n hess s\u00e6kar-adilinn
  S\u00e1kon J\u00f3nsson se til stadar. Par til svaradi Retturinnu:\\n\\nHessi s\u0153k
  skal, eptir Konunglegri Opreisning, n\u00fa fyrirt\u00e6kast.\\n\\nPar eptir var
  framlagdur Log\u00feingis Pr\u00f3ssss og d\u00f3mur \u00ed hessu m\u00e1li, af
  12ta J\u00fali 1760, \u00ed hvers fl\u00fatningu S\u00fdslumadur E. Olafsson er
  d\u00e6mdur \u00ed 6d l\u00f6d sylsfurs b\u00e6tur, sem Pr\u00f3ssssinn framar med
  ser ber; lefi in og markadur lit. C. S\u00fdslumadur E. Olafsson framlagdi innlegg
  af dags dat\u00f3, hvor med hann vill afsaka sina veigr\u00e6n ad gesa Visi-logmanni
  J. Olafssyni \u00feingdag \u00ed Hieradi, \u00ed hessu arsa-pr\u00e6tu m\u00e1li
  S\u00e1konar, sem innleggid framar s\u00fdnir, kr\u00f6d og markad lit. D. \u00c6nnad
  innlegg framlagdi nefudur S\u00fdslumadur m\u00f3ti d\u00f3mi Logmanns S. S\u00f6lvasonar,
  sem hann bidur ver\u00f0i upphafinn, lefi\u00f0 og markad lit. E. Fr\u00e1 Logmanui
  S. S\u00f6lvasyni framkom innlegg af 3ota J\u00fani n\u00e6rsil., \u00ed hvorju
  hann forsvarar sinn-afsagda Log\u00feingis d\u00f3m, og heidbeidisl, ad hann verdi
  stafestur, en ser tild\u00e6mist Satisfakti\u00f3n, kostur og t\u00e6ring, syrir
  r\u00e1nga og \u00f3parsa m\u00e1ls-\u00fdsingu, sem innlegg\u00ed\u00f0 framar
  s\u00fdnir, lesid og markad lit. F: Visi-lsgm\u00e1dur J. Olafsson upp\u00e1stendur
  L\u00f3ypingis d\u00f3msins stafestingu, samt kost og t\u00e6ring syrir \u00f3naudsvulega
  innstefningu \u00feessa m\u00e1ls. Aktor refererar sig til framlagdra innleggja
  og Hierads Pr\u00f3sessius. Partarnir qu\u00e1\u00f0ust eckert hafa meira ad framf\u00e6ra,
  var \u00fev\u00ed m\u00e1lsid til d\u00f3ms upptekid.\\n\\nNum. II.\\n\\nPann 16da
  J\u00fal\u00ed settist \u00deur-retturinn ad n\u00fdju, og afsagdi eptirfylgjandi
  d\u00f3m:\\n\\nVad er med eidsvornum vitnum ad \u00d3gri, pann 27da Septembr. 1758,
  \u00e1n\u00e6gjanlega fannad, ad S\u00fdslum\u00e1dur E. Olafsson hafi, ecki einungis
  \u00e1n allra lsglegra orsaka, pann 22ann Apr. s. \u00e1., veigrad og neitad Visi-Lsgmanni
  J.. Olafssyni R\u00e9tcar og \u00feingdags, er Visi-lsgminadurinn, eptir hafandi
  fullmakt, dat. pann 3ja s. m., af Z\u00e1kon\u00ed J\u00f3nssyni, hans vegna syrir
  R\u00e9tti beajjerdi, \u00ed arfa-r\u00e9ttar sek Z\u00e1konar m\u00f6ti Gudmundi
  J\u00f3nssyni \u00e1 Bjarnast\u00f6\u00f0um, heldur og, hegar Visi-lsgmadurinn ad
  n\u00fdju skrifst\u00e9ga beiddist steinuvotta og \u00feingdags \u00ed \u00feessu
  m\u00e1li, pann 28da s. m., hefir upp\u00e1 begjeringu, med S\u00fdslumanns E. Olafssonar
  beckjanlegri egin hendi, verver\u00f0i svarad \u00f0arundudum k\u00e6stugtum og
  \u00cdnd-\\nvendingar, \u00e1n hans nafns undirskriftar, er hafi\\nh\u00e9stir ecki
  viljad vera bekennndur, h\u00e9stir svo\\n\u00feingdagurinn, enn \u00fe\u00f3tt
  munulega og skriflega\\nkv\u00edsvarsinnun beg\u00e9r\u00f0ur ver\u00f0i hafi af
  S\u00fdslu-\\nmanninum, hvorki fenaist tiltekinu ne eptirt\u00e1ct-\\ninn, hvors
  vegna H\u00e1kon h\u00e9stir me\u00f0ost til a\u00f0\\nhafa fr\u00f8\u00f0a\u00f0i,
  b\u00f3tt Gudmundur J\u00f3nsson,\\nmeir enn heilt \u00e1r, s\u00e6ti \u00ed hans
  forneintu eign-\\num, og hictid a\u00f0 tapa gr\u00e6s tikkallnu, a\u00f0 \u00f3-\\npr\u00f3fudu,
  hvort hafi var grundad edur ecki;\\nhv\u00e6r S\u00fdslumannsins veigrun og sakarinnar\\n\u00f6lolegt
  uppihald, h\u00e9stir orsakad H\u00e1konni full-\\nkominn r\u00e9ttar-spillir; \u00fev\u00ed
  d\u00e6mist r\u00e9tt:\\n\\nS\u00fdslumadur E. Olafsson skal,\\nfyrir s\u00edka
  s\u00edna \u00f6lempi, betala \u00ed Repa-\\nratst\u00f6n og m\u00e1lskostnad til
  saks\u00f3knarans,\\n16 rdli. kr\u00f3n., hv\u00f8rjun hann og skal\\nforfr\u00edska
  sokina \u00e1 egin kostnad. Til\\nHallbjarnareyrar Hospitals betali hafi\\n4 rdli.
  kr\u00f3n., hv\u00f8rjar h\u00e6tur luktar s\u00e9u\\ninnan n\u00e6ristkomandi Michaelis-messu,\\nundir
  adf\u00f3r og Erek\u00fatsi\u00f3n ad l\u00f6gum.\\n\\nActum ut supra.\\n\\nD. Steph\u00e1nsson.\\nB.
  Mark\u00fasson. B. Hald\u00f3rsson.\\nP. Magn\u00fasson. J. Snorrason.\\n\\nJ. Eggertsson.  S.
  Sigurdsson.\\nP. Nik\u00f3la\u00edson.  Arngrimur J\u00f3nsson.\\nHorkell H\u00f3rdarson.  Gudmundur
  Eir\u00edkss.\\nLinar Hafsl\u00edason.  Gu\u00f0laugur \u00d3lafsson.\\nEir\u00edkur
  Hafsl\u00edason.\\n\\nAnno 1765, pann 16da J\u00fal\u00ed, var \u00deir-retturinn
  settur, undir Pr\u00e6sidio Amtmannus O. Steph\u00e1nssonar; med undirstrisudum
  Assessorum.\\n\\nMartti i \u00deir-retticum S\u00fdslumadur E. \u00d3lafsson, sem
  Aktor, og framlagdi \u00deir-rettar stefnu af 17da J\u00fal\u00ed 1764, undir Amtmanns
  O. Steph\u00e1nssonar nasni, me\u00f0 hvarri stefnisti V\u00edsi-losgmadur J. \u00d3lafsson,
  til a\u00f0 forsvara sitt a\u00dfagt Interlokutorium, hann 12ta J\u00fal\u00ed s\u00ed\u00f0ar,
  me\u00f0 vidara, sem stefnan s\u00ednir, lesin og markad lit. A. Par n\u00e6rist
  framlagdi S\u00fdslumadur E. \u00d3lafsson \u00e1minnsti Interlokutorium, hv\u00f8r
  med hann d\u00e6mist a\u00f0 fulli tapad hafa s\u00edllum s\u00ednum Pr\u00e6terstioner,
  ssk og s\u00f6rn, til Kaupmanns David von Winen, og annara vidkomenda; lesid og
  markad lit. B. Enn h\u00e1 framlagdi S\u00fdslumadur E. \u00d3lafsson innlegg, sem
  er hans \u00e1sta\u00f0ur og\\n\\nJrettes\u00e6ttelser i hessari s\u00e6k, sem bad
  framar s\u00fdnir, lesid og markad lit. E. V\u00edsi-Isgmadrur J. Olafsson m\u00e6tur,
  sem Defensor; og framlagdi innlegg af dags dat\u00f3, sem eru hans assakaniir kn\u00f3ti
  S\u00fdslumanns E. Olafssonar \u00e1kjarinn, med frekari \u00e1sta\u00f0um og jrettes\u00e6ttelser;
  bad lesid og markad lit D. Mcira framf\u00e6rdu ecki partarnir undir endilegann
  \u00deir-rettar d\u00f3m, er pannig var ass\u00e1gdur:\\n\\nBad er ad sj\u00e1 af
  Log\u00feingis B\u00f3karinnar 1763 No. 11., ad S\u00fdslumadrur E. Olafsson hafi
  sama \u00e1r m\u00e6tt \u00ed Log\u00feingis-rettiinni, og gjort \u00fear anh\u00e6ngig
  einu s\u00e6k, risandi af solu Kaupmanns Davids von Linen \u00e1 nockrum, af S\u00fdslumanni
  E. Olafssyni til ens fyrra Islands Kompagnies, pantsettur jardarpurtum, \u00ed hv\u00f8rri
  enginn d\u00f3mur hefur g\u00e1ngra kunnad, vegna Kaupmannsins \u00fatv\u00edssear,
  hv\u00f8rjum logdagur lagdur var til n\u00e6rista Log\u00feingis 1764, en hefir
  \u00fe\u00f3 hv\u00f8rki m\u00e6tt \u00ed egin pers\u00f3nu n\u00e9 forir fullmektugann,
  ecki heldur S\u00fdslumadrur E. Olafsson, til hess 12ta J\u00fali, \u00fe\u00e1
  m\u00e1lspartarnir voru af R\u00e6ttinum upphr\u00f3padir; hvors vegna, svo sem
  enginn vidkomenda var n\u00e1t\u00e6gur, og eckert Paastand af portunum gjort, sokinni
  byrja\u00f0i ad standa opinni \u00ed Pr\u00f3tokollen, og h\u00fan vera \u00f3d\u00e6md,
  sent mogulega forl\u00edkud og \u00ed Mindilighed afgjord; \u00fev\u00ed d\u00e6mist
  r\u00e9tt:\\n\\nD\u00f3mur V\u00edsi-Isgmannus J. Olafssonar, \u00e1 ecki ad prajudicera
  s\u00e6k edur s\u00f3ku\\n\\ns\u00f3kn S\u00fdslumanns E. Olafssonar; heldur skal
  honum, \u00ed krapti af \u00feessum V\u00edsir-r\u00e9ttar d\u00f6mi, standa fr\u00edtt
  fyrir ad framhaldra sinni sok m\u00f3ti Kaupmanni David von Linen, og \u00f3\u00f0rum
  v\u00edkommendum, \u00feegar hann bar til l\u00f6glega \u00e1 n\u00fd stefnir. En
  med \u00fev\u00ed hann, med sinni oflaungu \u00fativist og \u00f3l\u00f6glega gj\u00f6rdu
  upphaldi \u00ed framhaldi sakarinnar, hefur g\u00e6stid nockra, enn \u00fe\u00f3tt
  ecki fullkomna ors\u00f6k til V\u00edsir-logmannsins fr\u00e1vissunar doms h\u00e1
  d\u00e6mist honum bar fyrir hv\u00f8rki nockur Reparatst\u00f3ni n\u00e9 m\u00e1lskostnadur.\\n\\nActum
  ut supra.\\n\\nD. Steph\u00e1nsson.\\nG. Solvason. B. Mark\u00fasson.\\nP. Magn\u00fasson.
  B. Sigurdsson.\\nP: J\u00f3nsson. J. Arnason\\nM. K\u00e9tilsson. G. Run\u00f3lfsson.\\nP.
  Axelsson. P. Gudmundsson.\\nV. J\u00f3nsson. J. J\u00f3nsson.\\n\\nAnn\u00f3 1766,
  \u00feann 17da J\u00fal\u00ed, var \u00desir-retturinn settur, undir Presidio Amtmanns
  O. Steph\u00e1nssonar, me\u00f0 undirskrifum Assessorum.\\n\\nM\u00e6tti \u00ed
  \u00desir-rettinum S\u00fdslumadur P. Axelsson; og framlagdi Amtmanns O. Steph\u00e1nssonar
  stickun af dags dat\u00f3, til a\u00f0 vera Talsmadur \u00ed dulss-m\u00e1li sakakommunar
  Porbjargar J\u00f3nsd\u00f3ttur; skipanin lesin, og morkud lit. A. \u00dear n\u00e6rsi
  framlagdi nefndur S\u00fdslumadur \u00desir-rettar fesnu, af 23\u00eda Dec. 1765,
  me\u00f0 hv\u00f8rri stefnasi Logmadur B. Mark\u00fasson og S\u00fdslumadur P. Magn\u00fasson,
  til a\u00f0 forsvara heirra a\u00f0s\u00e6gdna Log\u00feingis- og Hjerads-d\u00f3ma
  \u00ed dulss-m\u00e1ls-s\u00f6k nefndrar Porbjargar, og h\u00fan sj\u00e1lf til
  a\u00f0 lida endilegann \u00desir-rettar d\u00f3mi; fesnan lesin- og morkud lit.
  B. Einninn framlagdi S\u00fdslumadur P. Axelsson hra. Stiptamtmanns Greifa Ranzans
  bref af 4da M\u00e1\u00ed 1765, \u00e1hr\u00e6andi innstefningu \u00feessa m\u00e1ls;
  lesid og markad lit C. L\u00edka svo framlagdi hann Attest af 10da og 20ta Dec.
  1765, vidkomandi sakarinnar Appelli; lesid og markad lit. D, samt eitt annad af
  22rum Okt\u00f3br. s. \u00e1. af sama innihaldis; lesid og markad lit. E. S\u00ed\u00f0an
  framlagdi S\u00fdslumadur P. AxelsP. Axelsson Hjerads og Log\u00feingis Pr\u00f3seiss
  og dom \u00ed m\u00e1linu, sl\u00fattadur 17ta J\u00fali 1764; lesi\u00f0 og markadur
  lit. F. \u00c1\u00f0 s\u00ed\u00f0ustu framlag\u00f0i S\u00fdsluinadurinn innlegg
  af dags dat\u00f3, hvar \u00ed hann upp\u00e1standur, ad Log\u00feingis d\u00f3marinn
  l\u00ednist; m. m.; lesi\u00f0 og markad lit. G. Log\u00feinadur B. Mark\u00fassson
  upp\u00e1standur innmulega, ad sunn d\u00f3mnar ver\u00f0i staffestur: Saka-konan
  af Rettinnu yfirhey\u00f0, medgengur eckert frekara enn Hjerads-Pr\u00f3seissn hermir.
  Meira var ecki af vidkonendum framf\u00e6rt, hvors vegna Yfir-retturinn a\u00f0sagdi
  eptirsylgjaudi dom \u00ed \u00feessu m\u00e1li:\\n\\nAf heim \u00ed H\u00e9ra\u00f0i
  leiddu vitnum og pr\u00f3ducerudu-Atrestum \u00ed \u00feessu m\u00e1li, finnast
  engin rok eda likur til, ad taka konan Porbjorg J\u00f3nsd\u00f3ttir hafi viljad
  syrickoma \u00e9dur af l\u00edsi taka \u00fead f\u00f6stur, er h\u00fan \u00ed heimin
  f\u00e6ddi ondver\u00f0lega \u00ed Apr. m\u00e1nu\u00f0i 1764, heldur er hvort \u00e1
  m\u00f6ti sannad og gottgj\u00f6rt, ad h\u00fan hafi fyrsta s\u00ednni \u00fe\u00e1
  rans\u00f3kn lgi\u00f0ist um hennar barns f\u00e6\u00f0nau, j\u00e1tad sig sekja
  \u00ed heim k\u00e1rlsmanns tilverknadi, er barns \u00feunga olla kynni, og h\u00e1r
  med g\u00e9sid tilefni til eptirsv\u00f6lgaandi gj\u00f6r\u00f0ra eptirgreinslana;
  svo hestr og Oddny J\u00f3nsd\u00f3ttir ni\u00f0 sv\u00f6rnum eidi sannad, ad Porbjorg
  hafi leitad s\u00ednnar adstodar, \u00fe\u00e1 barns f\u00e6\u00f0ingu sk\u00f6ldi
  f\u00e6\u00f0 hafa, er h\u00fan henni sinj\u00e1\u00f0i, en l\u00edkami barnsins
  svo \u00f3fullkominn, rotinn og runninn, ad ecki er \u00e1licinn me\u00f0 l\u00edsi
  kunna f\u00e6\u00f0st hafa, hvad allt gj\u00f6rir Porbjorgu fr\u00e1 fr\u00e1\\n\\ndulsm\u00e1li
  \u00ed \u00feessari sok. En sokum \u00feess, a\u00f0 h\u00fan hesir ostengi og \u00f3forsvaranlega
  leynt sinni barns f\u00e6\u00f0ingu, o\u00f0 ecki sem byrjadi med \u00feess andvana
  l\u00edkama hendi\u00f0, svo d\u00e6mist r\u00e9tt:\\n\\nPorbjorg J\u00f3nsd\u00f3ttir
  skal, fyrir s\u00edka hennar yfirsj\u00f3n, er s\u00ed\u00f0a 3 \u00e1r \u00ed \u00cdslands
  Tukth\u00fasi. Er svo Log\u00feingis d\u00f3murinn h\u00e9r me\u00f0 a\u00f0 \u00fev\u00ed
  leiti modereradur.\\n\\nActum ut supra.\\n\\nO. Steph\u00e1nsson.\\n\\nS. Solvason.
  J. Olafsson.\\nB. Hald\u00f3rsson. E. Olafsson.\\nP. Porsteinson. D. Sch\u00e9rvng.\\nM.
  K\u00e9tissson. G. Run\u00f3lfsson.\\nJ. Egg\u00e9rtsson. H. Jakobsson.\\nJ. Helgason.
  S. Sigurdsson.\\nV. J\u00f3nsson. G. Hj\u00f6rleifsson.\\n\\nAnno 1767, \u00feann
  15. da J\u00fal\u00ed, var R\u00edkurrecturinn settur, undir Pr\u00e6sidio Antmanns
  O. Steph\u00e1nssonar, me\u00f0 undirstr\u00edfu\u00f0um Assess\u00f3rum.\\n\\nNum.\\n\\nNum.
  I.\\n\\nM\u00e6tti \u00ed \u00deir-rettinum S\u00fdslumadur P. Axelsson og framlagdi
  Amtmannsins st\u00edppn af dags dat\u00f3 ad g\u00e1nga \u00ed Rett vegna Gudr\u00fanar
  Eilifsd\u00f3ttur; lesin og morkud lit. A. Framlaadi \u00fev\u00ed n\u00e6rst \u00deir-rettar
  stefnu af 12ta Decembris, yfir Log\u00feingis d\u00f3mi Logmanns B. Mark\u00fassonar
  afsg\u00f6gnun 1oda J\u00fal\u00ed 1765, \u00ed barnsf\u00e6dingar eda dulsm\u00e1li
  resndrar Gudr\u00fanar, hvar med og fleiri sakarinnar vidkomendur innstefnudir eru,
  sem stefnan framar med ser ber, lesin og morkud lit. B. Allir vidkomendur eda \u00feeirra
  fullmektugir m\u00e1ta. S\u00fdslumadur S. Sigur\u00f0sson framlagdi Amtmannsins
  st\u00edckan til s\u00edn, ad g\u00e1nga \u00ed Rett vegna J\u00f3ns Magn\u00fassonar,
  og honum til forsvar\u00f0, svo v\u00eddt m\u00e1ld kynni honum vid komu; lesin
  og morkud lit. C. Pessu n\u00e6rst var framlagdur Hjerads- og Log\u00feingis Pr\u00f3sess
  \u00ed sokinni, af hv\u00f8rjum han merkilegustu atri\u00f0i voru, ad partanna beidni,
  upple\u015bni, samt S\u00fdslumanns og Logmanns d\u00f3ms-slutningar, sem tilsinna
  Gudr\u00fan Eilifsd\u00f3ttur, fyrir framid dulsm\u00e1l, ad straffast \u00e1 l\u00edsinu,
  me\u00f0 ad h\u00e1ls h\u00f6ggvasi og hofud\u00ed \u00e1 stjaka uppfestast; Pr\u00f3sessinn
  markadur lit. D. Var s\u00ed\u00f0an saka-fonan af \u00deir-rettinum n\u00e1gvaemlega
  yfirheyrd, um sakarinnar \u00e1s\u00fdkumulag, svo vel sem J\u00f3n Magn\u00fasson,
  af henni \u00fatlagdur barnsfadir, og b\u00e6\u00f0i \u00feau alvarlega \u00e1minnt
  ad segja sannleikana, en eckert flekki meira af svarum \u00feeirra, eda medkjenningu,
  enn Hjerads og\\n\\nLog\u00feingis Prossessarnir herma. S\u00fdslumadur P. Axelsson
  upp\u00e1standur, ad Log\u00feingis d\u00f3mnum verdi linadur. Partarnir hof\u00f0u
  ekert meira ad framfara; hvors vegna \u00deir-retturinn a\u00f0sagdi svol\u00e1tandi
  d\u00f3m:\\n\\nEptir leiddum vitnum og egin \u00f3neyddri medkenningu saka-konunnar
  Gudr\u00fanar L\u00edlfsd\u00f3ttur, er sannad og tilstadir, a\u00f0 svo vel um
  hennar medgaungu t\u00edna, a\u00f0 \u00fev\u00ed barni, er h\u00fan \u00ed heimin
  f\u00e6ddi ad V\u00edsilsst\u00f6\u00f0um um veturn\u00e6tur 1763, sem og \u00fe\u00e1
  sj\u00e1lf f\u00e6\u00f0ingin f\u00e6di, hafi h\u00fan vilti\u00f0 umg\u00e1ngast
  eins og h\u00fan verulega hestir umgengist \u00fear me\u00f0 i dulsm\u00e1l\u00ed
  og ecki leitad heirra almennu medala, \u00fe\u00e1 f\u00e6\u00f0ingin f\u00e6di,
  sem barninu hestir m\u00e1tt til l\u00edfs og frelsis vera, hvort h\u00fan andvana
  hestir annadr hvort sj\u00e1lf lennilea\u00f0 s\u00ed\u00f0an nidurgrafa, e\u00f0ur
  l\u00e1ti\u00f0 nidurgrafa; \u00fev\u00ed d\u00e6mi st r\u00e9tt:\\n\\nSaka-konan
  Gudr\u00fan L\u00edlfsd\u00f3ttir skal, eptir heimi yfir henni gengnu H\u00e9ra\u00f0s
  og Log\u00feingis d\u00f3mum, fyrir s\u00ednu frama\u00f0 gl\u00e6p missa l\u00e9tid,
  me\u00f0 eggst h\u00e1ls-hoggvast og hofud hennar \u00e1 stjaka uppsetjast; \u00fe\u00f3
  m\u00e1 engin Erek\u00fast\u00f3n eptir \u00feessum d\u00f6mi yfir henni framfara,
  fyrr enn \u00ed \u00feeirri h\u00e9r af h\u00e1ngandi barnsl\u00fdsing: ar sok,
  er stadfestingar e\u00f0ur af henni tekinn, til styrkingar hennar barns-fadernernis
  \u00e1burdi upp\u00e1 J\u00f3n Magn\u00fasson; eptir \u00fear um gengnum Log\u00f0ingis
  d\u00f6mi 1764, edur sami d\u00f6mu ver\u00f0ur undir-kennndur, samt b\u00e1\u00f0ar
  \u00feessar s\u00e6kir Hans konungi. H\u00e1tign allraundirg\u00e9snast rese-reradar,
  og har upp\u00e1 allran\u00e1\u00f0ugasta \u00far-lausu innseund. Actum ut supra.\\n\\nD.
  Steph\u00e1nsson.\\nS. Solvason. I. \u00d3lafsson.\\nP. Magn\u00fasson. J. Snorrason.\\nP.
  Sigurdsson. D. Sch\u00e9ving.\\nH. Jakobsson. J. Eggertsson.\\nL. Gu\u00f0mundsson.
  M. G\u00edslason.\\nJ. Arn\u00f3rsson.\\n\\nNum. II.\\n\\nVann 16da J\u00fali m\u00e6tti
  \u00ed Yfir-rettinum S\u00fdslumadur J. Eggertsson, og framlagdi Kn\u00fatmannsins
  st\u00edkun af dags dat\u00f3, til ad upp\u00e1tala \u00e1dur gengna d\u00f6ma \u00ed
  dulsm\u00e1lss\u00f3k Sigurdar Valdasonar og Geirlaugar P\u00e1r-steinsd\u00f3ttur,
  lesin og merkud lic A. Par n\u00e6rst fram-lagdi S\u00fdslumadurin Yfir-rettar stefnu
  af 17da Jan. h. \u00e1, med hv\u00f8rri stefnast Logmadur B. Mark\u00fasson og S\u00fdslumadur
  J. Zelgason, ad sv\u00e1ra til \u00feeirra \u00e1dur af-sagdra d\u00f6ma \u00ed
  st\u00edkni, fomulcidis saka-personurnar Sigur\u00f0ur Valdason og Geirlaug Porseinsd\u00f3ttir
  til\\n\u00e1\u00f0 lida d\u00f3m; stefnau lesin og markud lit. B. Hjerads\\nog Loghingis
  Pr\u00f3se\u00df i m\u00e1linu var framlag\u00f0ur, \u00ed hvors\\nflutningu saka-personunum
  eru, fyrir framid dulsm\u00e1l,\\nd\u00e6mdar \u00ed \u00cdslands T\u00fakth\u00fas;
  Pr\u00f3se\u00dfinn lesin og mark-\\nadur lit. C. Aktor framlagdi innlegg; hvar
  \u00ed hann\\nupp\u00e1standur, ad sokin \u00ed Hjeradi hafi ecki til yagns exa-\\nminernd
  veri\u00f0; og \u00feur\u00f0 henni poi naunds\u00fdsliga aptur \u00ed\\nHjerad
  ad heimv\u00edsu; w.m.; sein innleggid hermar, lesid\\nog markad lit. D. Einig voru
  framlagdir 2 Reikn-\\ningar, s\u00e1 eini \u00e1hr\u00e6andi kostn\u00e6d til ad
  augl\u00fdsa stefnuna,\\nen hinn upp\u00e1 undirholning saka-personanna \u00ed T\u00fakth\u00fas-\\ninnu
  fr\u00e1 16da J\u00fali n\u00e6rsil. \u00e1rs til datunn; heir lesin og\\nmarkadur
  lit. E. og F. S\u00fdslumadur S. Jakobsseit\\nm\u00e6tir sem Pr\u00f3k\u00edrator;
  upp\u00e1 saka-personanua: vegna-\\neptir Amtmaunsins st\u00edkunn af days dat\u00f3;
  sein var lesin\\nog markad lit G. Hann upp\u00e1standur munnlega, ad\\nhans \u00e1dnr
  fyrir Loghingis-retti gjort Paastand \u00ed \u00feessari\\nst\u00edmu sot, ver\u00f0i
  vel adg\u00e6tt saka-personunum til fri\u00f0nar,\\nen mi\u00f0mi\u00f0ileir peirra
  vegna saka-rinnar heimiv\u00edsun \u00ed Hjer-\\nad, bidur einnig ad vera peirra
  \u00ed T\u00fakth\u00fasinnu takist til\\nyfirvegunar. Innlegg var framlagt fr\u00e1
  S\u00fdslumanui\\nJ. Helgasyri af 17ta J\u00fani n\u00e6rsil., \u00ed hvorsin hann
  vill\\nhafa s\u00ednar adgjordir \u00ed Hjeradi rettl\u00e6ttar, sem innleggid\\nframar
  med ser her, lesid og markad lit. H. Meira\\nqu\u00e1\u00f0ust partarnir ecki hafa
  ad frams\u00e6ra, var \u00fev\u00ed af \u00dee-\\nirs-rettinnum eptirfylgjandi d\u00f3mur
  \u00ed m\u00e1linu a\u00f0s\u00e1g\u00f0ur:\\n\\nPad\\n\\nH\u00f8d er au\u00f0l\u00fdst
  fyrir \u00feessum \u00devir-r\u00e9tti, af v\u00edsirskodun og n\u00e1kv\u00e6mri
  v\u00edsirvegun H\u00e9ra\u00f0s Pr\u00f3sessins, \u00ed dulsm\u00e1ls pr\u00f3fsun
  saka-personanna, Sigur\u00f0ar Valdasonar og Geirlaugar Porssteinsd\u00f3ttur, a\u00f0
  h\u00f8d m\u00e1li er engannveginn svo vel og fullkomlega ransakad, sem log og forordningar
  tilhalda; \u00fev\u00ed d\u00e6mist r\u00e9tt:\\n\\nPeir afsegdu H\u00e9ra\u00f0s
  og Logbingsis d\u00f3mar \u00ed \u00feessu m\u00e1li, skulu vera upphafsdir og a\u00f0
  engu gj\u00f6r\u00f0ir, en sokinni \u00e1samt saka-personunum er aptur \u00ed H\u00e9ra\u00f0heimvisad,
  til fullkomins pr\u00f3fs og ransaks, og \u00fear upp\u00e1 afsegjandi d\u00f3ms,
  allt upp\u00e1 S\u00fdslumanns J. Helgasonar kostn\u00e6\u00f0, sem fyrir s\u00edna
  fors\u00f3mun skal borga \u00ed rdl. til J\u00fastits-kassans. \u00devir-r\u00e9ttar
  stefunnar au\u00f0l\u00fdstingar kostn\u00e6\u00f0 borgi S\u00fdslumadur J. Helgason
  med 4rdlm kr\u00f3n. til J\u00fastits-kassans; er \u00fe\u00e1 peningar til saka-\u00feeirra
  driftar \u00fatlagt h\u00f8fri. Upp\u00e1 saka-personanna undirholdning \u00ed Tukt-h\u00fasinu,
  svara Undir- og \u00devir-d\u00f3mari \u00ed \u00feessari sek, 6 rdlm. k\u00far.
  hv\u00f8r um sig, hvad allt skal l\u00fakt vera til vidkomenda, inninnan v\u00e6rstkomandi
  Michaelis-messis, undir adfor og Erek\u00fatskon ad logum.\\n\\nActum ut supra.\\n\\nD.
  Steph\u00e1nsson.\\nG. Solvason. J. \u00d3lafsson.\\nP. Magn\u00fasson. P. Sigurdsson.\\nS.
  Sigurdsson. D. Sch\u00e9ving.\\nG. Run\u00f3lfsson. P. Nik\u00f3laison.\\nL. Gudmundsson.
  P. Axelsson.\\nM. G\u00edslason. J. Arn\u00f3rsson.\\n\\nNum. III.\\n\\nVann 17da
  j\u00fali metti i \u00desir-rettinum St\u00fadi\u00f3sus \u00de. Porgr\u00edmsson,
  vegna S\u00f3slaimanns B. Sald\u00f3rssonar, og framlagdi \u00desir-rettar stefnu,
  teiknada \u00e1 Log\u00feingis Pr\u00f3sessinnu, genginn \u00ed mords-m\u00e1li
  J\u00f3ns J\u00f3nssonar af S\u00fanavatns-s\u00fdslu, til allra vidkomenda \u00ed
  s\u00e6kinni, til ad h\u00e6yra \u00desir-rettar d\u00f3m \u00ed \u00feessu m\u00e1li,
  \u00ed hvortu J\u00f3n er d\u00e6mdur af Log\u00feingis-rettinum, ad erf\u00f0a
  \u00ed j\u00e1rnun \u00ed Citadellet Friderichshavn, s\u00edna l\u00edfsstid; Pr\u00f3sessinnu
  lesinn og markadur lit: P. S\u00fdslumadur P. Axelsson, af Austmannaum st\u00edckadur
  svara-m\u00e1\u00f0ur sakamanns J\u00f3ns, upp\u00e1standur ad Log\u00feingis d\u00f3murinn
  ver\u00f0i mildadur, \u00fear inordid se ecki fullsannad upp\u00e1 sakamanninn.
  St\u00fadi\u00f3sus \u00de. Porgr\u00edmsson upp\u00e1standur \u00fear \u00e1 m\u00f3ti
  Hj\u00f8rav\u00eds d\u00f3misd\u00f3msins stadsfessingu. Sakamadurinn af Rettinum
  yfirhey\u00f0rnr, j\u00e1tar sig \u00e1tt hafa barns-h\u00fangann med \u00deelgu
  Simonsd\u00f3ttur, en neitar mordina: P\u00e1rtarnir afs\u00fdndir hvort meira hesdu
  \u00e1\u00f0 framf\u00e6ra? sv\u00f8rndu: nei! hell hv\u00ed svol\u00e1tandi yfir-rettar
  d\u00f3minn.\\n\\nS\u00e1 af Logmanni S. Solvatsyni, hann 1oda h\u00faus, a\u00f0sagdi
  Log\u00feingis d\u00f3mur yfir st\u00f3rbr\u00f8ta-manninum J\u00f3ni Jonssyni,
  er af Yfir-rettinum stadsfessur.\\n\\nA\u00f0um ut Supra.\\n\\nD. Steph\u00e1nsson.\\n\\nB.
  Mark\u00fasson. G. Sigurdsson.\\nP. Magn\u00fasson. P. Nik\u00f3la\u00edson.\\nP.
  Sigurdsson. G. Run\u00f3lfssson.\\nJ. Eggertsson. L. Gu\u00f0mundsson.\\nH. Jakobsson.
  G. Sigurdsson.\\nM. G\u00edslason. J. Arn\u00f3rsson.\\n\\nNum. IV.\\n\\nSama dag
  m\u00e6tti \u00ed Yfir-rettinum S\u00fdslumadur E. Olafsson, og framlagdi Yfir-rettar
  stefnu af 25ta J\u00fal\u00ed 1766, me\u00f0 hvorri til upphafsningar innstefnist
  einn af Logmanni S. Solvasyni a\u00f0sagdur Log\u00feingis d\u00f3mur hann 21ta
  J\u00fal\u00ed sama \u00e1r, \u00e1hr\u00e6randi burtssolu n\u00f6cknra jardar-partu,
  af Kaupmanni D. von Linen hann 15da Aug.\\n\\nAug. 1760, sem S\u00fdslumadur E.
  Olafsson pants\u00e6tt hafdi til ens \u00edslandsku H\u00f8ndlunar Kompagnies; einnig
  st\u00e6nsast S\u00fdslumadur S. Sigurdsson, ad forsvara sinn Hjerads d\u00f3m i
  \u00feessu m\u00e1li, og Kaupmadrur D. von Einen ad forsvara salu s\u00edna \u00e1
  nesndum jordum, sem st\u00e6nsar framrar s\u00ednir, lesin og morknd lit. A. L\u00e6ggingi
  \u00ed Pr\u00f3sess \u00ed \u00feessu m\u00e1li framlagdi S\u00fdslumadur E. Olafsson,
  \u00ed hvors sluttningu sala Kaupmanns D. von Einen, og Hjerads d\u00f3mur par um
  genginn, eru stadfest; Pr\u00f3sessinn lesinn og markadur lit. B. S\u00fdslumadur
  L. Gudmundsson framlagdi \u00c1mtmannsins st\u00edckun til sin, ad svara til m\u00e1lsins,
  vegna Kaupmanns D. von Einens; lesin og morknd lit. C. Lagmadur S. Solvason og S\u00fdslumadur
  S. Sigurdsson m\u00e6ta b\u00e1\u00f0ir, ad svara til sinna D\u00f3mara-v\u00e9rka
  \u00ed \u00feessu m\u00e1li. S\u00fdslumadur E. Olafsson framlagdi innlegg af 16da
  h\u00faus, hvori hann framf\u00e6rir allan m\u00e1lsvort, og upp\u00e1standur Hjerads-
  og L\u00e6ggingis-d\u00f3manna upphafiingun, en ser verdi, b\u00e6di af D\u00f3murum
  og Kaupmanni D. von Einens \u00e1n\u00e6gjanleg Satisfakti\u00f3n tild\u00e6md;
  innleggid lesid og markad lit. D. Lagmadur S. Solvason upp\u00e1standur sinn d\u00f3mur
  stadfestist, sem \u00e1 logum og sauns\u00fdni grundadur. S\u00fdslumadur L. Gudmundsson
  upp\u00e1standur har\u00e1m\u00f3ti, ad Kaupmanns D. von Einens adgiordir \u00ed
  heirra pants\u00e6ttu jarda saln, verdi \u00e1litnar loglegar, og honum tild\u00e6mist
  \u00e1n\u00e6gjanleg Satisfakti\u00f3n af S\u00fdsluSystumanni E. Olafssyni, syrir
  orsakada m\u00e6du og kostuad \u00ed hessari s\u00e6k; hild sama n\u00fdp\u00e1standur
  Logmadur S. Sylvason og Systumadur S. Sigurdsson. Meira hofdu ecki partarnir ad
  framfara undir endilegau\u00f0 d\u00f3m, sem pannig var af \u00deir-rettinum a\u00f0sagdur:\\n\\nAd
  sonnu hefir Systumadur E. Olafsson undir 6ta Sept. 1762, stefnuit Kaupmannsinnum
  D. von Einen \u00e1 \u00feann 11ta f. m., ad meta \u00e1 T\u00fangu pingi, til ad
  \u00e1heyra, samt eptir v\u0153ntantezum d\u00f6mi antaka \u00fe\u00e1 af honum
  framleggjandi Contrac- og Liquidations-reikninga, m\u00f3ti hans Pant-Obligation,
  til syrrverandi Islands H\u00f3ndlunar F\u00e9lags, hvorri stefnu hefir fr\u00e1visad
  verid af Systumanni S. Sigurdssyni, veana osnaums stefnu-frests; en s\u00ed\u00f0ar,
  \u00fe\u00e1 Systumadurinn aptur innstefndi s\u0153nni t.l. \u00feess 30ta Sept.
  \u00e1 samra pingstad, hefir hann \u00feessuni sinuni reikningum fr\u00e1falli\u00f0,
  og \u00fe\u00e1 ecki \u00ed stefnuunni \u00e1 nafnu nefur; hvors vegna Undir- og
  \u00deir-d\u00f3mari \u00ed m\u00e1lnu, svo vel sem og \u00ed tilliti til \u00feess,
  ad reikningarnir v\u00e6ru ecki loglega sannadir, og \u00e6tlu \u00fev\u00ed ecki
  ad gylda m\u00f3ti Systumanns E. Olafssonar logl\u00e9gra Pant-Obligation, hafa
  fr\u00e1visad heim, sem oldungis \u00f3antakantlegum, en sta\u00f0fest s\u00f3lu
  Kaupinanns D. von Einen \u00e1 heim af Systumanninum pantsettu j\u00f6r\u00f0um,
  eptir hans egin Obligation og Forskrivelse; \u00fev\u00ed d\u00e6mist r\u00e9tt:\\n\\nPeir\\n\\nPeir
  afsgdu H\u00e9ra\u00f0s og Log\u00feingis-\\nd\u00f3mar \u00ed hessu m\u00e1li,
  eru af V\u00edsir-r\u00e9ttin-\\num, sem r\u00e9ttvisir og lognir samv\u00e6ntir,\\n\u00e1\u00f0i
  ollu leiri stafestir; eitt S\u00fdlumanni\\nE. Olafrssyni standt fr\u00edtt fyrir\\n\u00e1\u00f0
  framf\u00e6ra hessa s\u00edna rei\u00f0ninga m\u00f3ti\\n\u00fev\u00ed fyrirverandi
  Honsluar Kompanjnie\\nog D. von Linen, \u00e1 r\u00e9ttum stad og\\nt\u00edma, eptir
  egin velb\u00f3cknum.\\n\\nActum ut supra.\\n\\nD. St\u00e9ph\u00e1nsson.\\n\\nV.
  Mark\u00fasson.  S. Sigurdsson.\\nP. Magn\u00fasson.  P. Sigurdsson.\\nD. Sch\u00e9ving.    P.
  Nik\u00f3la\u00edson.\\nJ. Egg\u00e9rtsson.   G. Run\u00f3lfssson.\\nH. Jakobsson.    P.
  Axelsson.\\nM. G\u00edslason.     J. Arn\u00f3rsson.\\n\\n\u00c1\u00f0 hessi V\u00edsir-rettar
