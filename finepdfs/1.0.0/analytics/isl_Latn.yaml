  |\\n\\n7.1 Eignir\\n\\n7.1.1 Birg\u00f0ir\\n\\nBirg\u00f0ir \u00ed \u00e1rslok n\u00e1mu
  23,4 m.kr. og h\u00f6f\u00f0u aukist um 5,3 m.kr. fr\u00e1 fyrra \u00e1ri. Birg\u00f0ir
  samanstanda af \u00fdmsum v\u00f6rum sem til s\u00f6lu eru \u00e1 starfsst\u00f6\u00f0vum
  Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s.\\n\\n| \u00cd \u00fe\u00fas. kr.
  | Birg\u00f0ir | Birg\u00f0ir | Breyting |\\n|---|---|---|---|\\n|  | 2016 | 2015
  |  |\\n| Gestastofa \u00c1sbyrgi | 3.911 | 2.232 | 1.679 |\\n| Sn\u00e6fellsstofa
  Skri\u00f0uklaustri | 4.26 | 1.921 | 2.339 |\\n| Skaftafell | 11.077 | 7.48 | 3.597
  |\\n| Gestastofa H\u00f6fn | 2.361 | 4.578 | -2.217 |\\n| Gestastofa Kirkjub\u00e6jarklaustri
  | 476 | 587 | -111 |\\n| H\u00fafur og bolir | 1.3 | 1.3 | 0 |\\n| Samtals | 23.384
  | 18.096 | 5.287 |\\n\\nSta\u00f0a birg\u00f0a \u00ed efnahagsreikningi byggir \u00e1
  v\u00f6rutalningum fr\u00e1 sex starfsst\u00f6\u00f0vum samkv\u00e6mt \u00fatfylltum
  Excel-skj\u00f6lum \u00fear sem ekki er til sta\u00f0ar birg\u00f0ast\u00fdringarkerfi.
  Ein talning var sta\u00f0fest af framkv\u00e6mdastj\u00f3ra. \u00cd tveimur v\u00f6rutalningum
  koma fyrir n\u00f6fn talningamanna en \u00ed \u00feremur talningum koma ekki fram
  n\u00f6fn \u00feeirra sem st\u00f3\u00f0u a\u00f0 talningu e\u00f0a sta\u00f0festingar
  \u00e1 v\u00f6rutalningu. R\u00edkisendursko\u00f0un bendir \u00e1 a\u00f0 sta\u00f0festa
  \u00fearf birg\u00f0atalningar og endurmeta ver\u00f0m\u00e6ti birg\u00f0a sem ekki
  hafa hreyfst \u00ed nokkur \u00e1r. Samkv\u00e6mt uppl\u00fdsingum fr\u00e1 stj\u00f3rnendum
  er unni\u00f0 a\u00f0 \u00fev\u00ed a\u00f0 laga og endurb\u00e6ta verklag.\\n\\n7.1.2
  Handb\u00e6rt f\u00e9\\n\\nHandb\u00e6rt f\u00e9 samanstendur af sj\u00f6 sm\u00e1sj\u00f3\u00f0um
  \u00e1 starfsst\u00f6\u00f0vum Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s og
  \u00e1tta bankareikningum samtals 50,9 m.kr. Sj\u00f3\u00f0ur, samkv\u00e6mt \u00e1rsreikningi,
  nam kr. 397.220. Sj\u00f3\u00f0ir eru sta\u00f0festir me\u00f0 sj\u00f3\u00f0stalningarbl\u00f6\u00f0um.
  B\u00e6ta m\u00e1 fr\u00e1gang sj\u00f3\u00f0stalningarey\u00f0ubla\u00f0a \u00feannig
  a\u00f0 au\u00f0velt ver\u00f0i a\u00f0 sj\u00e1 \u00ed hva\u00f0a starfsst\u00f6\u00f0
  Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s sj\u00f3\u00f0urinn er. Einnig \u00fearf
  a\u00f0 koma fram hver telur og hver sta\u00f0festir sj\u00f3\u00f0stalningu. Innst\u00e6\u00f0ur
  \u00e1 \u00e1tta bankareikningum n\u00e1mu samtals kr. 50.549.897. Vi\u00f0 endursko\u00f0un
  var \u00f3ska\u00f0 eftir sta\u00f0festingu vi\u00f0skiptabanka \u00e1 bankainnst\u00e6\u00f0um
  og var sta\u00f0a \u00e1 yfirlitum fr\u00e1 banka \u00ed samr\u00e6mi vi\u00f0 st\u00f6\u00f0u
  \u00ed b\u00f3khaldi Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s.\\n\\n7.1.3 Vi\u00f0skiptakr\u00f6fur\\n\\nVi\u00f0skiptakr\u00f6fur
  \u00ed \u00e1rslok n\u00e1mu 176,4 m.kr. og h\u00f6f\u00f0u h\u00e6kka\u00f0 um
  59,0 m.kr. fr\u00e1 fyrra \u00e1ri. H\u00e6kkunin stafar a\u00f0 mestu af aukinni
  inneign hj\u00e1 framkv\u00e6mdasj\u00f3\u00f0i fer\u00f0amannasta\u00f0a sem nam
  157,0 m.kr. \u00ed \u00e1rslok en 94,7 m.kr. \u00ed byrjun \u00e1rs. Vi\u00f0skiptakr\u00f6fur
  vegna \u00fatistandandi krafna n\u00e1mu 18,7 m.kr. \u00ed \u00e1rslok og voru a\u00f0
  mestu greiddir \u00feegar endursko\u00f0un f\u00f3r fram fyrir utan kr\u00f6fur
  a\u00f0 fj\u00e1rh\u00e6\u00f0 0,9 m.kr.\\n\\n7.2 Eigi\u00f0 f\u00e9 og skuldir\\n\\n7.2.1
  H\u00f6fu\u00f0st\u00f3ll\\n\\n\u00cd \u00e1rslok 2016 var h\u00f6fu\u00f0st\u00f3ll
  stofnunarinnar neikv\u00e6\u00f0ur um 68,5 m.kr. og haf\u00f0i l\u00e6kka\u00f0
  um 14 m.kr. fr\u00e1 \u00e1rinu \u00e1 undan e\u00f0a sem nemur tekjuafgangi \u00e1rsins.
  \u00cd \u00feessu sambandi er vakin athygli \u00e1 skyldum forst\u00f6\u00f0umanna
  samkv\u00e6mt 15. gr. regluger\u00f0ar nr. 1061/2004 um framkv\u00e6md fj\u00e1rlaga
  og \u00e1byrg\u00f0 \u00e1 fj\u00e1rrei\u00f0um r\u00edkisstofnana \u00ed A-hluta.\\n\\n7.2.2
  Langt\u00edmaskuldir\\n\\n\u00cd \u00e1rslok 2016 n\u00e1mu langt\u00edmaskuldir
  5,3 m.kr. vegna fj\u00e1rm\u00f6gnunarleigusamninga og haf\u00f0i sta\u00f0an l\u00e6kka\u00f0
  um 6,3 m.kr. fr\u00e1 fyrra \u00e1ri. \u00d3verulegur mismunur var \u00e1 st\u00f6\u00f0u
  b\u00f3khalds og \u00e1ram\u00f3tayfirliti fr\u00e1 bankastofnun e\u00f0a 27 \u00fe\u00fas.kr.\\n\\n7.2.3
  Vi\u00f0skiptaskuldir\\n\\n\u00cd \u00e1rslok voru vi\u00f0skiptaskuldir 48,1 m.kr.
  \u00dear af voru 41,6 m.kr. vi\u00f0skiptaskuldir samkv\u00e6mt vi\u00f0skiptaskuldakerfinu.\\n\\n7.2.4
  R\u00edkissj\u00f3\u00f0ur\\n\\nSta\u00f0a \u00e1 vi\u00f0skiptareikningi vi\u00f0
  r\u00edkissj\u00f3\u00f0 nam 265,8 m.kr. \u00ed \u00e1rslok 2016 og haf\u00f0i l\u00e6kka\u00f0
  um 137,4 m.kr. fr\u00e1 fyrra \u00e1ri.\\n\\n7.3 Ni\u00f0ursta\u00f0a\\n\\nR\u00edkisendursko\u00f0un
  bendir \u00e1 a\u00f0 fara \u00fearf yfir verklag var\u00f0andi birg\u00f0atalningar
  og a\u00f0 sta\u00f0festa \u00fearf talningar og ver\u00f0m\u00e6ti birg\u00f0a
  af h\u00e1lfu stj\u00f3rnenda stofnunarinnar. Einnig er ger\u00f0 athugasemd vi\u00f0
  neikv\u00e6\u00f0an h\u00f6fu\u00f0st\u00f3l.\\n\\n8 \u00d6 nnur atri\u00f0i\\n\\n8.1
  Sta\u00f0festingarbr\u00e9f stj\u00f3rnenda\\n\\nSta\u00f0festingarbr\u00e9f stj\u00f3rnenda
  sem var sent til stofnunarinnar af Fj\u00e1rs\u00fdslu r\u00edkisins, var sam\u00feykkt
  og undirrita\u00f0 af framkv\u00e6mdastj\u00f3ra og fj\u00e1rm\u00e1lastj\u00f3ra
  \u00feann 11. apr\u00edl 2017.\\n\\n8.2 L\u00f6gfr\u00e6\u00f0ibr\u00e9f\\n\\n\u00d3ska\u00f0
  var eftir uppl\u00fdsingum um m\u00e1laferli gagnvart Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0i,
  sem m\u00f6gulega g\u00e6tu haft fj\u00e1rhagsleg \u00e1hrif \u00e1 rekstur stofnunarinnar.
  Samkv\u00e6mt uppl\u00fdsingum stj\u00f3rnenda stofnunarinnar eru engin sl\u00edk
  m\u00e1l \u00ed gangi svo vita\u00f0 s\u00e9.\\n\\n8.3 \u00d3h\u00e6\u00f0isyfirl\u00fdsing\\n\\n\u00d3h\u00e6\u00f0isyfirl\u00fdsingar
  \u00feeirra endursko\u00f0enda sem s\u00e1u um endursko\u00f0un hj\u00e1 Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0i
  voru undirrita\u00f0ar.\\n\\n8.4 Umfang endursko\u00f0unar, yfirl\u00fdsing\\n\\nYfirl\u00fdsing
  um umfang endursko\u00f0unar hj\u00e1 stofnuninni var undiritu\u00f0 af r\u00edkisendursko\u00f0anda
  og framkv\u00e6mdastj\u00f3ra Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s.\\n\\n\u00cd
  yfirl\u00fdsingunni er ger\u00f0 grein fyrir \u00e1byrg\u00f0 og hlutverki hvors
  a\u00f0ila var\u00f0andi reikningsskil Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s.\\n\\nR\u00edkisendursko\u00f0un
  \u2013 Br\u00edetart\u00fani 7 P\u00f3sth\u00f3lf 5350 \u2013 125 Reykjav\u00edk
  S\u00edmi 569-7100\\n\\nemail@example.com \u2013 www.rikisendurskodun.is\"", "\"Lei\u00f0beiningar
  til h\u00f6funda fr\u00e6\u00f0ilegs efnis \u00ed Sj\u00fakra\u00fej\u00e1lfaranum\\n\\nStefnt
  er a\u00f0 \u00fev\u00ed a\u00f0 fr\u00e6\u00f0ilegar greinar sem birtast \u00ed
  Sj\u00fakra\u00fej\u00e1lfaranum ver\u00f0i skr\u00e1\u00f0ar \u00ed helstu gagnagrunna
  \u00e1 svi\u00f0i heilbrig\u00f0isv\u00edsinda. Til \u00feess a\u00f0 svo megi ver\u00f0a
  er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 fylgja vi\u00f0urkenndu ferli var\u00f0andi
  birtingu ritr\u00fdndra v\u00edsindagreina og tryggja \u00feannig faglega og \u00f3hlutdr\u00e6ga
  umfj\u00f6llun \u00feeirra greina sem bla\u00f0inu berast. H\u00f6fundum, sem senda
  inn greinar til ritr\u00fdningar, ber a\u00f0 fylgja \u00e1kve\u00f0num vi\u00f0urkenndum
  verkferlum vi\u00f0 s\u00edn skrif. Lei\u00f0beiningar fyrir algengustu ranns\u00f3knarsni\u00f0in
  fylgja h\u00e9r \u00e1 eftir. Auk \u00feess er v\u00edsa\u00f0 \u00ed nokkrar erlendrar
  heimas\u00ed\u00f0ur og lei\u00f0beiningar sem h\u00f6fundar eru hvattir til \u00feess
  a\u00f0 sko\u00f0a.\\n\\nLei\u00f0beiningarnar sem fylgja h\u00e9r \u00e1 eftir
  eru um skrif v\u00edsindagreina sem falla \u00ed eftirtalda flokka: ranns\u00f3knargreinar,
  yfirlitsgreinar og l\u00fdsingar \u00e1 tilfellaranns\u00f3knum. Hafi h\u00f6fundar
  hug \u00e1 a\u00f0 birta a\u00f0rar tegundir v\u00edsindagreina \u00fe\u00e1 er
  \u00fea\u00f0 einnig h\u00e6gt, \u00fea\u00f0 \u00fearf bara a\u00f0 vinna \u00fe\u00e6r
  samkv\u00e6mt vi\u00f0eigandi og vi\u00f0urkenndum lei\u00f0beiningum. Ef handrit
  er sam\u00feykkt til ritr\u00fdningar \u00fe\u00e1 fer \u00e1kve\u00f0i\u00f0 ferli
  \u00ed gang sem gera m\u00e1 r\u00e1\u00f0 fyrir a\u00f0 taki \u00ferj\u00e1 til
  sex m\u00e1nu\u00f0i. Grein sem tekin er til ritr\u00fdningar m\u00e1 ekki hafa
  birst \u00e1\u00f0ur n\u00e9 vera \u00ed ritr\u00fdningarferli hj\u00e1 \u00f6\u00f0ru
  riti samt\u00edmis. Sj\u00fakra\u00fej\u00e1lfarar og a\u00f0rir sem telja sig eiga
  erindi me\u00f0 vi\u00f0b\u00f3tar\u00feekkingu inn \u00e1 fr\u00e6\u00f0asvi\u00f0
  sj\u00fakra\u00fej\u00e1lfunar eru hvattir til \u00feess a\u00f0 senda inn greinar
  til bla\u00f0sins.\\n\\nAlmennar lei\u00f0beiningar\\n\\nHandrit a\u00f0 v\u00edsindagreinum
  skal sent rafr\u00e6nt sem Word skjal til fr\u00e6\u00f0ilegrar ritstj\u00f3rnar
  Sj\u00fakra\u00fej\u00e1lfarans \u00e1samt fylgibr\u00e9fi, h\u00f6fundaryfirl\u00fdsingu,
  yfirl\u00fdsingu um birtingar\u00e9tt og hagsmunatengsl h\u00f6funda vi\u00f0 efni\u00f0
  (sj\u00e1: Ritr\u00fdningarferli v\u00edsindagreina).\\n\\nH\u00f6fundar eru hvattir
  til a\u00f0 fara vel yfir g\u00e1tlista fyrir h\u00f6funda \u00e1\u00f0ur en \u00feeir
  senda grein inn til ritr\u00fdningar og g\u00e6ta \u00feess a\u00f0 h\u00fan uppfylli
  sett skilyr\u00f0i fyrir birtingu ritr\u00fdndra greina \u00e1 vi\u00f0komandi svi\u00f0i
  me\u00f0 \u00fev\u00ed a\u00f0 fylgja \u00feeim lei\u00f0beiningum sem finna m\u00e1
  undir g\u00e1tlistar og fl\u00e6\u00f0irit fyrir mismunandi ranns\u00f3knarsni\u00f0.
  \u00dea\u00f0 sem koma \u00e1 fram \u00ed fylgibr\u00e9finu er tilgreint h\u00e9r
  \u00e1 eftir. Ey\u00f0ubl\u00f6\u00f0 var\u00f0andi yfirl\u00fdsingar, leyfi og
  sam\u00feykki m\u00e1 finna \u00e1 heimas\u00ed\u00f0u bla\u00f0sins (sj\u00e1:
  Fylgiskj\u00f6l me\u00f0 innsendum v\u00edsindagreinum).\\n\\nEf fr\u00e6\u00f0ileg
  ritstj\u00f3rn sendir handrit tilbaka til h\u00f6funda me\u00f0 athugasemdum ritr\u00fdna
  og \u00f3sk um \u00e1kve\u00f0nar breytingar, geta h\u00f6fundar sent \u00fea\u00f0
  aftur inn til ritr\u00fdningar eftir a\u00f0 hafa teki\u00f0 tillit til \u00feeirra
  athugasemda sem ger\u00f0ar voru e\u00f0a vali\u00f0 a\u00f0 f\u00e1 greinina birta
  sem fr\u00e6\u00f0slugrein. \u00deegar h\u00f6fundar senda handriti\u00f0 aftur
  \u00ed ritr\u00fdningu skal fylgja \u00fev\u00ed sk\u00fdringarbr\u00e9f \u00fear
  sem greint er fr\u00e1 \u00fev\u00ed hvernig h\u00f6fundar t\u00f3ku \u00e1 \u00feeim
  breytingartill\u00f6gum sem ger\u00f0ar voru, og breytingar sem ger\u00f0ar eru
  \u00e1 handritinu skulu merktar me\u00f0 \u201etrack changes\\\". S\u00e9rstaklega
  mikilv\u00e6gt er a\u00f0 \u00ed sk\u00fdringarbr\u00e9finu fjalli h\u00f6fundar
  um athugasemdir ritr\u00fdna sem h\u00f6fundar telja a\u00f0 ekki s\u00e9 h\u00e6gt
  e\u00f0a r\u00e9tt a\u00f0 taka tillit til. Fr\u00e6\u00f0ileg ritstj\u00f3rn getur
  einnig hafna\u00f0 grein um ritr\u00fdningu ef h\u00fan ekki samr\u00e6mist reglum
  bla\u00f0sins og gerir \u00fe\u00e1 skriflega grein fyrir \u00fev\u00ed \u00e1 hverju
  h\u00f6fnunin er bygg\u00f0.\\n\\n\u00deeir sem taka a\u00f0 s\u00e9r a\u00f0 ritr\u00fdna
  fylgja einnig \u00e1kve\u00f0num lei\u00f0beiningum um ritr\u00fdningu sem sj\u00e1
  m\u00e1 \u00e1 heimas\u00ed\u00f0u bla\u00f0sins. Gott er fyrir greinarh\u00f6funda
  a\u00f0 sko\u00f0a vel \u00feessar lei\u00f0beiningar (sj\u00e1: Lei\u00f0beiningar
  fyrir ritr\u00fdna Sj\u00fakra\u00fej\u00e1lfarans).\\n\\nFylgibr\u00e9f\\n\\nMe\u00f0
  innsendu handriti a\u00f0 grein til ritr\u00fdningar skal fylgja br\u00e9f til fr\u00e6\u00f0ilegrar
  ritstj\u00f3rnar \u00ed s\u00e9rst\u00f6ku Word skjali. \u00dear \u00e1 a\u00f0
  koma fram titill greinar, \u00ed hva\u00f0a flokki h\u00fan er (til d\u00e6mis ranns\u00f3knargrein,
  yfirlitsgrein e\u00f0a grein um tilfellaranns\u00f3kn) og n\u00f6fn h\u00f6funda.
  \u00cd br\u00e9finu skal gera stuttlega grein fyrir tilur\u00f0 greinarinnar og/
  e\u00f0a \u00feeirri ranns\u00f3kn sem handriti\u00f0 er byggt \u00e1. Sk\u00fdra
  skal fr\u00e1 s\u00e9rst\u00f6\u00f0u efnisins mi\u00f0a\u00f0 vi\u00f0 anna\u00f0
  sem fram hefur komi\u00f0 \u00e1 fr\u00e6\u00f0asvi\u00f0inu og hvernig efni\u00f0
  h\u00f6f\u00f0ar til sj\u00fakra\u00fej\u00e1lfara. H\u00e9r \u00e1 a\u00f0 tilgreina
  n\u00famer \u00e1 vi\u00f0eigandi leyfum og tilkynningum vegna ranns\u00f3kna, til
  d\u00e6mis fr\u00e1 V\u00edsindasi\u00f0anefnd\\n\\nog Pers\u00f3nuvernd. H\u00e9r
  komi einnig fram yfirl\u00fdsing um a\u00f0 handriti\u00f0 s\u00e9 ekki \u00ed ritr\u00fdningu
  hj\u00e1 \u00f6\u00f0ru fagt\u00edmariti og a\u00f0 efni\u00f0 hafi ekki birst \u00e1\u00f0ur.\\n\\nTitill
  greinar\\n\\nTitill greinar \u00e1 a\u00f0 vera l\u00fdsandi fyrir \u00fea\u00f0
  efni sem veri\u00f0 er a\u00f0 fjalla um og l\u00edklegur til \u00feess a\u00f0
  vekja \u00e1huga \u00e1 \u00fev\u00ed. Mi\u00f0a skal vi\u00f0 a\u00f0 hafa hann
  ekki lengri en 150 letureiningar (letureining: characters including punctuation
  and spaces).\\n\\nH\u00f6fundar\\n\\nH\u00f6fundar teljast \u00feeir einir sem hafa
  lagt \u00fea\u00f0 mikla vinnu af m\u00f6rkum vi\u00f0 tilur\u00f0 greinarinnar
  a\u00f0 \u00feeir geti bori\u00f0 \u00e1byrg\u00f0 \u00e1 efni hennar og r\u00e6tt
  \u00fea\u00f0 opinberlega. \u00cd \u00feessu felst me\u00f0al annars hugmyndavinna,
  gagnas\u00f6fnun, ranns\u00f3knarvinna, \u00farvinnsla, t\u00falkun og framsetning
  ni\u00f0ursta\u00f0na, handritsger\u00f0 og fleira eftir \u00fev\u00ed sem vi\u00f0
  \u00e1. Mikilv\u00e6gt er a\u00f0 allir h\u00f6fundar skrifi undir h\u00f6fundaryfirl\u00fdsingu.
  \u00cd h\u00f6fundaryfirl\u00fdsingu skal koma fram nafn \u00feess h\u00f6fundar
  sem er tengili\u00f0ur og \u00e1byrgur fyrir samskiptum vi\u00f0 ritstj\u00f3rn.\\n\\nM\u00e1lfar
  og almennur fr\u00e1gangur\\n\\nG\u00e6ta skal vel a\u00f0 stafsetningu og rita
  greinina \u00e1 g\u00f3\u00f0ri \u00edslensku. \u00cdslenska skal \u00f6ll erlend
  or\u00f0 og heiti ef m\u00f6gulegt er, al\u00fej\u00f3\u00f0legt heiti skal sett
  \u00ed sviga fyrir aftan ef talin er \u00fe\u00f6rf \u00e1 \u00fev\u00ed. Ef nau\u00f0synlegt
  er a\u00f0 notast vi\u00f0 al\u00fej\u00f3\u00f0leg heiti (latnesk e\u00f0a ensk)
  skal sk\u00e1letra \u00feau. Ekki skal nota skammstafanir \u00ed megintexta greinarinnar,
  ekki nota t.d. heldur til d\u00e6mis. Ef um er a\u00f0 r\u00e6\u00f0a vi\u00f0urkenndar
  fr\u00e6\u00f0ilegar skammstafanir skal heiti\u00f0 standa \u00e1 undan og skammst\u00f6fun
  innan sviga b\u00e6\u00f0i \u00ed \u00e1gripi og \u00feegar \u00fea\u00f0 birtist
  fyrst \u00ed megintexta, en eftir \u00fea\u00f0 m\u00e1 notast vi\u00f0 skammst\u00f6funina
  eina. Rita skal lyfjaheiti eins og \u00feau koma fyrir \u00ed S\u00e9rlyfjaskr\u00e1.
  T\u00f6lustafi undir t\u00edu skal skrifa me\u00f0 or\u00f0um \u00ed megintexta
  \u00feegar fjalla\u00f0 er um fj\u00f6lda (einn, fimm). Komma afmarkar brot \u00ed
  \u00edslensku (0,5) en punktur \u00ed ensku (0.5). Hva\u00f0 var\u00f0ar leturger\u00f0,
  leturst\u00e6r\u00f0 og l\u00ednubil \u00fe\u00e1 \u00e1 a\u00f0 nota Times New
  Roman 12 punkta letur, l\u00ednubil 1,5 og sp\u00e1ss\u00edur 3 cm sitt hvoru megin.  Texti
  skal vinstrijafna\u00f0ur og bla\u00f0s\u00ed\u00f0utal haft ne\u00f0st \u00ed h\u00e6gra
  horni. T\u00f6flur:\\n\\nT\u00f6flur skulu koma \u00e1 eftir heimildaskr\u00e1 og
  a\u00f0eins ein tafla \u00e1 hverri s\u00ed\u00f0u. \u00cd texta handrits sem sent
  er til ritstj\u00f3rnar ber a\u00f0 tilgreina hvar h\u00f6fundur \u00e6tlast til
  a\u00f0 tafla s\u00e9 sta\u00f0sett \u00ed greininni. N\u00famer og titill t\u00f6flu
  skal standa fyrir ofan t\u00f6fluna en ekki inni \u00ed henni. T\u00f6flur teknar
  \u00far Excel e\u00f0a samb\u00e6rilegu forriti \u00fearf a\u00f0 setja inn \u00feannig
  a\u00f0 h\u00e6gt s\u00e9 a\u00f0 breyta uppl\u00fdsingum (ekki sem mynd). Myndir
  :\\n\\nMyndir skulu koma \u00e1 eftir t\u00f6flum og a\u00f0eins ein mynd \u00e1
  hverri s\u00ed\u00f0u. H\u00f6fundur tilgreinir hvar hann vill sta\u00f0setja myndir
  \u00ed texta handritsins. N\u00famer og titill myndar skulu standa undir myndinni.
  Skila \u00fearf myndum \u00ed frumger\u00f0 (jpg, tff). \u00de\u00e6r \u00feurfa
  a\u00f0 vera sk\u00fdrar og geta \u00feola\u00f0 sm\u00e6kkun. Ef um er a\u00f0
  r\u00e6\u00f0a lj\u00f3smyndir af skj\u00f3lst\u00e6\u00f0ingum \u00fearf a\u00f0
  fylgja leyfi fr\u00e1 \u00feeim fyrir birtingu myndar \u00ed bla\u00f0inu. Var\u00f0andi
  a\u00f0rar gagnlegar uppl\u00fdsingar um or\u00f0anotkun, st\u00edl og uppsetningu
  til d\u00e6mis \u00e1 t\u00f6flum og myndum m\u00e1 einnig benda \u00e1 Gagnfr\u00e6\u00f0akver
  handa h\u00e1sk\u00f3lanemum eftir Fri\u00f0rik H. J\u00f3nsson og Sigur\u00f0 J.
  Gr\u00e9tarsson (H\u00e1sk\u00f3la\u00fatg\u00e1fan 2007).\\n\\nFj\u00f6ldi or\u00f0a
  og heimilda\\n\\nVi\u00f0mi\u00f0unarm\u00f6rk var\u00f0andi or\u00f0afj\u00f6lda
  og fj\u00f6lda heimilda sem v\u00edsa\u00f0 er til fer eftir tegund greinar (tafla
  1). Mikilv\u00e6gt er a\u00f0 fara ekki yfir \u00feessi vi\u00f0mi\u00f0unarm\u00f6rk.
  Frumheimildir eru nota\u00f0ar \u00feegar \u00feess er kostur. Mi\u00f0a skal vi\u00f0
  a\u00f0 hafa heimildir sem n\u00fdjastar og ekki eldri en t\u00edu \u00e1ra. Undantekningar
  eru ef um t\u00edmam\u00f3taverk er a\u00f0 r\u00e6\u00f0a e\u00f0a heimildir sem
  hafa miki\u00f0 gildi fyrir fr\u00e6\u00f0igreinina.\\n\\nTafla 1. Vi\u00f0mi\u00f0unarm\u00f6rk
  var\u00f0andi or\u00f0afj\u00f6lda og fj\u00f6lda heimilda\\n\\n| Tegund greinar
  | Megintexti | \u00c1grip | Myndir og t\u00f6flur |\\n|---|---|---|---|\\n| Ranns\u00f3knargrein
  (megindleg a\u00f0fer\u00f0) | 3000 or\u00f0 | 250 or\u00f0 | 5 |\\n| Ranns\u00f3knargrein
  (eigindleg e\u00f0a bl\u00f6ndu\u00f0 a\u00f0fer\u00f0) | 5000 or\u00f0 | 250 or\u00f0
  | 5 |\\n| Yfirlitsgrein | 5000 or\u00f0 | 250 or\u00f0 | 5 |\\n| Tilfellaranns\u00f3knir
  | 2500 or\u00f0 | 250 or\u00f0 | 5 |\\n\\nS\u00e9rt\u00e6kar lei\u00f0beiningar
  fyrir nokkrar ger\u00f0ir v\u00edsindagreina, innihald og uppsetning efnis\\n\\nRanns\u00f3knargreinar\\n\\nMe\u00f0
  ranns\u00f3knargrein \u00fearf a\u00f0 senda s\u00e9rstaka titils\u00ed\u00f0u.
  \u00c1 titils\u00ed\u00f0u skal koma fram heiti greinarinnar, nafn og s\u00e9rgrein
  h\u00f6funda/r, nafn stofnunar sem vi\u00f0komandi starfa/r vi\u00f0 og \u00feeirrar
  stofnunar \u00fear sem ranns\u00f3knin var ger\u00f0. Einnig nafn, s\u00edman\u00famer
  og netfang \u00feess h\u00f6fundar sem mun ver\u00f0a tengili\u00f0ur vi\u00f0 fr\u00e6\u00f0ilega
  ritstj\u00f3rn.\\n\\n\u00c1 titils\u00ed\u00f0unni \u00e1 einnig a\u00f0 koma fram
  stuttur vinnutitill greinarinnar og lykilor\u00f0 hennar \u00e1 \u00edslensku og
  ensku.\\n\\n\u00cd ranns\u00f3knargrein gera h\u00f6fundar grein fyrir eigin ranns\u00f3knum
  og/ e\u00f0a athugunum. Ranns\u00f3knargrein \u00fearf a\u00f0 innihalda eftirtalda
  kafla:\\n\\n* Inngangur\\n* \u00c1grip\\n* A\u00f0fer\u00f0ir\\n* Umr\u00e6\u00f0ur\\n*
  Ni\u00f0urst\u00f6\u00f0ur\\n* \u00deakkir (ef vi\u00f0 \u00e1)\\n* Heimildalisti\\n\\nByrja
  skal hvern kafla \u00e1 n\u00fdrri s\u00ed\u00f0u.\\n\\n\u00c1grip\\n\\n\u00cd \u00e1gripi
  komi fram hnitmi\u00f0u\u00f0 samantekt \u00e1 efni greinarinnar og \u00ferj\u00fa
  til sex lykilor\u00f0. \u00c1gripi skal skila b\u00e6\u00f0i \u00e1 \u00edslensku
  og ensku og skipta \u00ed eftirtalda kafla:\\n\\n* Markmi\u00f0 (objectives)\\n*
  Bakgrunnur (background)\\n* A\u00f0fer\u00f0ir (methods)\\n* \u00c1lyktanir (conclusions)\\n*
  Ni\u00f0urst\u00f6\u00f0ur (results)\\n\\nH\u00e9r skal \u00ed stuttu m\u00e1li
  greina fr\u00e1 bakgrunni greinarinnar/ ranns\u00f3knarinnar og meginmarkmi\u00f0um,
  a\u00f0fer\u00f0um og \u00farvinnslu. Til \u00feess a\u00f0 hafa m\u00f6guleika
  \u00e1 a\u00f0 f\u00e1 fr\u00e6\u00f0igreinina vista\u00f0a \u00ed erlendum gagnab\u00f6nkum
  \u00fearf einnig a\u00f0 fylgja henni enskt \u00e1grip. \u00dea\u00f0 \u00fearf
  ekki a\u00f0 vera bein \u00fe\u00fd\u00f0ing \u00e1 \u00fev\u00ed \u00edslenska
  en b\u00e6\u00f0i eiga a\u00f0 vera jafn l\u00fdsandi fyrir efni greinarinnar. Enska
  \u00e1gripinu skal fylgja titill greinarinnar \u00e1 ensku og n\u00f6fn h\u00f6funda
  (muna a\u00f0 fjarl\u00e6gja fyrir ritr\u00fdningu) me\u00f0 enskri uppsetningu,
  auk lykilor\u00f0a. Vi\u00f0 val lykilor\u00f0a \u00e1 ensku er gott a\u00f0 sty\u00f0jast
  vi\u00f0 lei\u00f0beiningar samkv\u00e6mt Medical subject headings sem finna m\u00e1
  \u00e1 : http://www.nlm.nih.gov/mesh/authors.htlm\\n\\nInngangur\\n\\nH\u00e9r skal
  sk\u00fdra vel fr\u00e1 fr\u00e6\u00f0ilegum forsendum fyrir \u00fev\u00ed a\u00f0
  ranns\u00f3knin var ger\u00f0/ greinin var skrifu\u00f0 og meginmarkmi\u00f0um og
  v\u00edsa\u00f0 \u00ed heimildir \u00feessu til stu\u00f0nings. H\u00e9r eiga a\u00f0
  koma fram \u00fe\u00e6r tilg\u00e1tur og ranns\u00f3knarspurningar sem vi\u00f0
  eiga og skulu vera \u00ed r\u00f6klegu samhengi vi\u00f0 fr\u00e6\u00f0ilegan bakgrunn.
  Greina fr\u00e1 hva\u00f0 er vita\u00f0 um efni\u00f0 n\u00fa \u00feegar, hvar vantar
  helst frekari \u00feekkingu \u00e1 fr\u00e6\u00f0asvi\u00f0inu og hvernig ni\u00f0urst\u00f6\u00f0ur
  \u00feessarar ranns\u00f3knar geta n\u00fdst sem vi\u00f0b\u00f3t vi\u00f0 \u00fe\u00e1
  \u00feekkingu sem fyrir er.\\n\\nA\u00f0fer\u00f0ir\\n\\n\u00deennan kafla skal
  rita \u00ed \u00fe\u00e1t\u00ed\u00f0. H\u00e9r \u00e1 a\u00f0 koma fram n\u00e1kv\u00e6m
  l\u00fdsing \u00e1 efnivi\u00f0i ranns\u00f3knar og breytum (svo sem \u00fe\u00e1tttakendum,
  \u00edhlutun/ me\u00f0fer\u00f0 \u00fear sem \u00fea\u00f0 \u00e1 vi\u00f0) \u00f6flun
  gagna, greiningu \u00feeirra, \u00farvinnslu og a\u00f0fer\u00f0afr\u00e6\u00f0inni
  \u00ed heild. Ef ger\u00f0 var athugun \u00e1 \u00fev\u00ed hve marga \u00fe\u00e1tttakendur
  \u00feurfti til \u00feess a\u00f0 geta n\u00e1\u00f0 fram marktekt, styrk-athugun
  (power) ,skal greina n\u00e1kv\u00e6mlega fr\u00e1 \u00fev\u00ed hvernig \u00fea\u00f0
  var gert. Einnig skal greina fr\u00e1 \u00feeim m\u00e6lit\u00e6kjum og t\u00e6kjab\u00fana\u00f0i
  sem notu\u00f0 voru \u00fear sem \u00fea\u00f0 \u00e1 vi\u00f0, segja fr\u00e1 tegund
  og nafni framlei\u00f0anda (framlei\u00f0sluland/ borg \u00ed sviga).  L\u00fdsingin
  \u00fearf a\u00f0 vera \u00fea\u00f0 sk\u00fdr og n\u00e1kv\u00e6m a\u00f0 unnt
  s\u00e9 a\u00f0 nota hana til a\u00f0 endurtaka sams konar ranns\u00f3kn. Mikilv\u00e6gt
  er a\u00f0 l\u00fdsa vel t\u00f6lfr\u00e6\u00f0ilegri \u00farvinnslu og greina fr\u00e1
  \u00feeim t\u00f6lvuforritum sem notu\u00f0 eru. H\u00e9r skal einnig sk\u00fdra
  fr\u00e1 \u00feeim leyfum sem afla\u00f0 var til ranns\u00f3knarinnar og si\u00f0fr\u00e6\u00f0ilegum
  \u00e1litam\u00e1lum \u00fear sem \u00fea\u00f0 \u00e1 vi\u00f0. Gott getur veri\u00f0
  a\u00f0 sty\u00f0jast vi\u00f0 eftirfarandi millifyrirsagnir \u00ed \u00feessum
  kafla:\\n\\nRanns\u00f3knarsni\u00f0. \u00de\u00e1tttakendur/ \u00fartak. M\u00e6lit\u00e6ki/
  spurningalistar. \u00cdhlutun/ me\u00f0fer\u00f0 ef vi\u00f0 \u00e1. Framkv\u00e6md/
  gagnas\u00f6fnun. Si\u00f0fr\u00e6\u00f0i. \u00darvinnsla.\\n\\nNi\u00f0urst\u00f6\u00f0ur\\n\\nNi\u00f0urst\u00f6\u00f0ukafla
  skal einnig rita \u00ed \u00fe\u00e1t\u00ed\u00f0. Hann \u00e1 a\u00f0 vera sk\u00fdr
  og hnitmi\u00f0a\u00f0ur. H\u00e9r eiga ekki a\u00f0 vera neinar t\u00falkanir e\u00f0a
  mat \u00e1 ni\u00f0urst\u00f6\u00f0unum. Ni\u00f0urst\u00f6\u00f0um skal l\u00fdst
  \u00ed r\u00f6kr\u00e6nni r\u00f6\u00f0 \u00ed megintexta en jafnframt v\u00edsa\u00f0
  \u00ed t\u00f6flur og myndir \u00fear sem \u00fea\u00f0 \u00e1 vi\u00f0. H\u00e9r
  \u00e1 a\u00f0 greina fr\u00e1 heitum \u00e1 t\u00f6lfr\u00e6\u00f0ipr\u00f3fum,
  vikog marktektarm\u00f6rk skilgreind innan sviga. Varast skal a\u00f0 endurtaka
  \u00ed megintextanum \u00fea\u00f0 sem v\u00edsa\u00f0 er til \u00ed myndum og t\u00f6flum.
  Myndir og t\u00f6flur eiga a\u00f0 vera sk\u00fdrar, einfaldar og geta sta\u00f0i\u00f0
  sj\u00e1lfst\u00e6tt. Mikilv\u00e6gt er a\u00f0 allar ni\u00f0urst\u00f6\u00f0ur
  sem r\u00e6\u00f0a \u00e1 \u00ed umr\u00e6\u00f0ukafla komi fram h\u00e9r \u00ed
  ni\u00f0urst\u00f6\u00f0ukaflanum.\\n\\nUmr\u00e6\u00f0ur og \u00e1lyktanir\\n\\nH\u00e9r
  skal r\u00e6\u00f0a helstu ni\u00f0urst\u00f6\u00f0ur ranns\u00f3knarinnar, meta
  \u00fe\u00e6r og t\u00falka og bera saman vi\u00f0 ni\u00f0urst\u00f6\u00f0ur annarra
  samb\u00e6rilegra ranns\u00f3kna me\u00f0 tilv\u00edsun \u00ed lykilheimildir. H\u00e9r
  skal leggja \u00e1herslu \u00e1 n\u00fdjar ni\u00f0urst\u00f6\u00f0ur og ni\u00f0urst\u00f6\u00f0ur
  sem eru mikilv\u00e6gar og hagn\u00fdtar fyrir fagi\u00f0. G\u00e6ta \u00feess a\u00f0
  \u00e1lyktanir s\u00e9u \u00ed samr\u00e6mi vi\u00f0 ni\u00f0urst\u00f6\u00f0ur
  en varast skal a\u00f0 endurtaka h\u00e9r \u00fea\u00f0 sem kom fram \u00ed ni\u00f0urst\u00f6\u00f0ukaflanum.
  H\u00e9r skal benda \u00e1 hugsanlegar ranns\u00f3knir \u00ed framhaldinu sem tengjast
  efninu. Tilgreina h\u00e9r einnig styrkleika og takmarkanir ranns\u00f3knarinnar
  ef einhverjar eru.\\n\\n\u00deakkir\\n\\nH\u00e9r koma til d\u00e6mis \u00feakkir
  til \u00feeirra samstarfsa\u00f0ila sem lagt hafa h\u00f6nd \u00e1 pl\u00f3ginn
  vi\u00f0 framkv\u00e6md og \u00farvinnslu ranns\u00f3knarinnar en uppfylla ekki
  kr\u00f6fur sem me\u00f0h\u00f6fundar (sj\u00e1 h\u00f6fundaryfirl\u00fdsingu).
  Einnig ef veittur hefur veri\u00f0 a\u00f0gangur a\u00f0 t\u00e6kjum, a\u00f0b\u00fana\u00f0i
  e\u00f0a \u00e1 annan h\u00e1tt veri\u00f0 h\u00f6fundum innan handar, skal \u00feakka
  fyrir \u00fea\u00f0 h\u00e9r. H\u00e9r skal einnig geta allra styrkveitinga til
  ranns\u00f3knarinnar. Yfirleitt er ekki \u00e1st\u00e6\u00f0a til a\u00f0 \u00feakka
  a\u00f0keypta a\u00f0sto\u00f0 sem greitt er fyrir fullu ver\u00f0i.\\n\\nHeimildir\\n\\nFylgja
  skal reglum Vancouver h\u00f3psins (www.icmje.org) var\u00f0andi tilv\u00edsanir
  \u00ed heimildir og heimildaskr\u00e1ningu. Samkv\u00e6mt \u00feeim reglum skulu
  heimildir t\u00f6lusettar og koma fyrir \u00ed \u00feeirri r\u00f6\u00f0 sem \u00fe\u00e6r
  birtast \u00ed texta greinarinnar. \u00d3heimilt er a\u00f0 vitna \u00ed munnlegar
  uppl\u00fdsingar.\\n\\nA\u00f0 \u00f6\u00f0ru leyti er v\u00edsa\u00f0 \u00ed g\u00e1tlista
  og fl\u00e6\u00f0irit fyrir mismunandi ranns\u00f3knarsni\u00f0/ CONSORT.\\n\\nYfirlitsgreinar\\n\\n\u00cd
  yfirlitsgrein (Systematic review, Meta-analyses) er veri\u00f0 a\u00f0 vinna gagnr\u00fdna
  umfj\u00f6llun um birtar ranns\u00f3knir/ v\u00edsindagreinar \u00e1 \u00e1kve\u00f0nu
  afm\u00f6rku\u00f0u efni sem tali\u00f0 er vera gagnlegt og \u00e1hugavert fyrir
  fr\u00e6\u00f0asvi\u00f0 sj\u00fakra\u00fej\u00e1lfunar e\u00f0a tengjast \u00fev\u00ed.
  H\u00e9r getur til d\u00e6mis veri\u00f0 um a\u00f0 r\u00e6\u00f0a samantekt \u00e1
  me\u00f0fer\u00f0 sj\u00fakra\u00fej\u00e1lfara, mismunandi a\u00f0fer\u00f0um,
  t\u00e6kjum og m\u00e6lingum. Samantektin \u00fearf a\u00f0 byggja \u00e1 ritr\u00fdndum
  heimildum og greina skal fr\u00e1 \u00fev\u00ed hvernig heimildanna er afla\u00f0.\\n\\nYfirlitsgrein
  \u00e1 a\u00f0 vera svipa\u00f0 upp bygg\u00f0 og ranns\u00f3knargrein og innihalda
  eftirtalda kafla: \u00c1grip. Inngangur. A\u00f0fer\u00f0ir. Ni\u00f0urst\u00f6\u00f0ur/
  Samantekt. Umr\u00e6\u00f0ur. \u00deakkir \u00fear sem \u00fea\u00f0 \u00e1 vi\u00f0
  og Heimildir.\\n\\n* \u00c1grip. H\u00e9r skal me\u00f0al annars geta \u00feess
  hver tilgangurinn er me\u00f0 greininni. \u00c1gripi\u00f0 skal vera \u00e1 \u00edslensku
  og ensku sem og \u00ferj\u00fa til sex lykilor\u00f0.\\n* Inngangur. H\u00e9r komi
  fram af hverju h\u00f6fundar telja \u00fe\u00f6rf fyrir grein sem \u00feessa og
  \u00fe\u00fd\u00f0ingu hennar fyrir fr\u00e6\u00f0asvi\u00f0 sj\u00fakra\u00fej\u00e1lfunar.\\n*
  Ni\u00f0urst\u00f6\u00f0ur/ Samantekt. H\u00e9r skal greina fr\u00e1 meginni\u00f0urst\u00f6\u00f0um
  \u00feessa yfirlits.\\n* A\u00f0fer\u00f0. H\u00e9r skal greina fr\u00e1 \u00fev\u00ed
  hvernig heimilda var afla\u00f0 og hvers vegna s\u00fa lei\u00f0 var valin.\\n*
  Umr\u00e6\u00f0a. H\u00e9r skal fara gagnr\u00fdni\u00f0 yfir ni\u00f0urst\u00f6\u00f0urnar
  og \u00fe\u00e6r r\u00f6kr\u00e6ddar me\u00f0 hli\u00f0sj\u00f3n af heimildum og
  \u00f6\u00f0rum ni\u00f0urst\u00f6\u00f0um um sama efni. Bent skal \u00e1 \u00fe\u00fd\u00f0ingu
  efnisins fyrir fr\u00e6\u00f0asvi\u00f0i\u00f0 og hugsanlegar ranns\u00f3knir/athuganir
  \u00ed framhaldinu. Einnig skal h\u00e9r greina fr\u00e1 takm\u00f6rkunum og styrkleikum
  efnisins eins og \u00fea\u00f0 birtist \u00ed ni\u00f0urst\u00f6\u00f0unum.\\n*
  Heimildir. Heimildalisti skal unninn eins og \u00e1\u00f0ur hefur veri\u00f0 \u00fatsk\u00fdrt
  vi\u00f0 ger\u00f0 ranns\u00f3knargreinar.\\n* \u00deakkir \u2013 \u00fear sem \u00fea\u00f0
  \u00e1 vi\u00f0.\\n\\nA\u00f0 \u00f6\u00f0ru leyti er v\u00edsa\u00f0 \u00ed a\u00f0
  fylgja lei\u00f0beiningum um ger\u00f0 kerfisbundinna samantekta \u00e1 ranns\u00f3knum.
  Sj\u00e1 g\u00e1tlista og fl\u00e6\u00f0irit fyrir mismunandi ranns\u00f3knarsni\u00f0/
  PRISMA.\\n\\nGreinar um tilfellaranns\u00f3knir\\n\\n\u00cd tilfellaranns\u00f3knum
  (case study) er l\u00fdst afm\u00f6rku\u00f0um d\u00e6mum \u00far starfi \u00e1
  svi\u00f0i sj\u00fakra\u00fej\u00e1lfunar. H\u00e9r getur veri\u00f0 um a\u00f0
  r\u00e6\u00f0a l\u00fdsingu \u00e1 \u00e1kve\u00f0inni a\u00f0fer\u00f0/ \u00edhlutun,
  notkun \u00e1kve\u00f0ins t\u00e6kjab\u00fana\u00f0ar og/ e\u00f0a mats \u2013 og
  m\u00e6lia\u00f0fer\u00f0a, e\u00f0a annarri n\u00e1lgun \u00e1 starfi\u00f0 \u00ed
  v\u00ed\u00f0ara samhengi. Einnig m\u00e1 segja h\u00e9r fr\u00e1 \u00e1kve\u00f0num
  kenningum (concept analysis) innan sj\u00fakra\u00fej\u00e1lfunar. Greininni skal
  skipta upp \u00ed eftirtalda megin kafla:\\n\\n* \u00c1grip. \u00dea\u00f0 skal
  vera b\u00e6\u00f0i \u00e1 \u00edslensku og ensku. Tilgreina skal \u00ferj\u00fa
  til sex lykilor\u00f0.\\n* Tilfelli/ Me\u00f0fer\u00f0. H\u00e9r skal koma fram
  greinarg\u00f3\u00f0 l\u00fdsing \u00e1 efninu me\u00f0 tilv\u00edsan \u00ed ranns\u00f3knir
  og/ e\u00f0a hugmyndafr\u00e6\u00f0i.\\n* Inngangur. H\u00e9r komi fram forsaga
  \u00feess a\u00f0 efni\u00f0 var vali\u00f0 og hugmyndafr\u00e6\u00f0in \u00e1 bakvi\u00f0
  efni\u00f0.\\n* Umr\u00e6\u00f0a. H\u00e9r leggur h\u00f6fundur faglegt mat \u00e1
  efni\u00f0 \u00e1 r\u00f6kv\u00edsan h\u00e1tt. H\u00e9r skal greina fr\u00e1 m\u00f6gulegri
  tenginu vi\u00f0 \u00e1framhaldandi athuganir og e\u00f0a ranns\u00f3knir \u00e1
  efninu.\\n* Heimildir. Heimildalisti skal unninn eins og \u00e1\u00f0ur hefur veri\u00f0
  sk\u00fdrt fr\u00e1 vi\u00f0 ger\u00f0 ranns\u00f3knargreinar.\\n\\nKaflar greinarinnar
  geta veri\u00f0 fleiri ef \u00fea\u00f0 hentar efninu. \u00cd greininni \u00fearf
  \u00fea\u00f0 a\u00f0 koma sk\u00fdrt fram hver \u00fe\u00fd\u00f0ing efnisins er
