  \u00edslenskun\u00e1msins. Mikil \u00e1hersla er l\u00f6g\u00f0 \u00e1 lestur og
  lestrarf\u00e6rni me\u00f0 markvissri \u00fej\u00e1lfun \u00ed samvinnu vi\u00f0
