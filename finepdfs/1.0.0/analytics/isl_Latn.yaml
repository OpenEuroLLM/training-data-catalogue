  mynda\u00f0 s\u00e9r sko\u00f0un \u00e1 \u00f3l\u00edkum st\u00edl t\u00f3nlistar,
  geti gert s\u00e9r grein fyrir gildi hennar \u00ed eigin menningu og l\u00edfi og
  noti\u00f0 hennar \u00e1 uppbyggilegan, markvissan og pers\u00f3nulegan h\u00e1tt.\\n\\nN\u00e1msmat\\n\\nN\u00e1msmati\u00f0
  byggir \u00e1 lei\u00f0sagnarmati og s\u00edmati, frumkv\u00e6\u00f0i, framf\u00f6rum
