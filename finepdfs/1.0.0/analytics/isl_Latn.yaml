  "\"Vefs\u00ed\u00f0unefnd R\u00f3tar\u00fdumd\u00e6misins \u00e1 \u00cdslandi Sk\u00fdrsla
  fyrir starfs\u00e1ri\u00f0 2011 \u2013 2012\\n\\nNefndina skipa:\\n\\n\u00d3lafur
  \u00d3lafsson, R\u00f3tar\u00fdkl\u00fabbnum Reykjav\u00edk Grafarvogur, forma\u00f0ur,\\n\\nGu\u00f0ni
  G\u00edslason, R\u00f3tar\u00fdkl\u00fabbi Hafnarfjar\u00f0ar,\\n\\nPaul Richardson,R\u00f3tar\u00fdkl\u00fabbi
  Reykjav\u00edk International.\\n\\nR\u00f3tar\u00fdumd\u00e6mi\u00f0 t\u00f3k \u00ed
  notkun n\u00fdjan samskiptavef \u00e1ri\u00f0 2008. Vefurinn byggir \u00e1 \u00f6flugu
  f\u00e9lagakerfi, gagnagrunni og samtengdri heimas\u00ed\u00f0u umd\u00e6misins
  og r\u00f3tar\u00fdkl\u00fabbanna. Vefurinn er \u00feri\u00f0ja kynsl\u00f3\u00f0
  umd\u00e6misvefsins. Hefur f\u00e9lagakerfi\u00f0 gj\u00f6rbylt skr\u00e1ningu funda,
  fundarbo\u00f0un og tryggt a\u00f0 allar uppl\u00fdsingar um f\u00e9lagana eru \u00ed
  einum tryggum gagnagrunni. Allir kl\u00fabbarnir fengu heimas\u00ed\u00f0u \u00fear
  sem sj\u00e1lfkrafa birtist f\u00e9lagatal og dagskr\u00e1 framundan \u2013 sem
  skr\u00e1\u00f0 hefur veri\u00f0 \u00ed f\u00e9lagakerfi\u00f0.\\n\\nMeginverkefni
  2011-2012\\n\\nEndurb\u00e6tur og \u00fer\u00f3un:\\n\\n- Meginverkefni vefs\u00ed\u00f0unefndar
  \u00e1 starfs\u00e1rinu 2012\u20102012 var \u00fer\u00f3un f\u00e9lagakerfisins
  til a\u00f0 n\u00e1 fram b\u00e6ttum eiginleikum og virkni kerfisins.\\n- Virkni
  kerfishluta voru endurb\u00e6tt. M\u00e1 \u00fear m.a. nefna; endurb\u00e6tur \u00e1
  m\u00e6tingarskr\u00e1ningu til a\u00f0 gera hana hra\u00f0virkari.\\n- Hnappar
  fyrir a\u00f0 senda, Facebook, prenta og Twitter, G+ voru settir vi\u00f0 fr\u00e9ttir
  og greinar.\\n- Fr\u00e1 og me\u00f0 1. j\u00fal\u00ed 2012 t\u00f3k gildi n\u00fd
  starfsgreinaskr\u00e1 R\u00f3tar\u00fdumd\u00e6misins \u00e1 \u00cdslandi og um
  lei\u00f0 f\u00e9ll s\u00fa gamla \u00far gildi. Er n\u00fdja skr\u00e1in bygg\u00f0
  \u00e1 \u00e1 ISAT 2008 atvinnugreinaflokkuninn.  Talsver\u00f0 vinna var vi\u00f0
  s\u00f6fun uppl\u00fdsinga hj\u00e1 kl\u00fabbunum og endurforritun \u00e1 eldri
  kerfiseiningu vegna breytinganna. Enn eiga nokkrir kl\u00fabbar eftir a\u00f0 skr\u00e1
  starfgreinar hj\u00e1 s\u00ednum f\u00e9l\u00f6gum.\\n- Loki\u00f0 var vi\u00f0
  ger\u00f0 kerfiseiningar, \u201efundarefnisbanka\\\" \u00fear sem r\u00f3tar\u00fdf\u00e9lagar
  geta s\u00f3tt hugmyndir a\u00f0 fyrirlestrum og fyrirlesurum. Kerfiseiningin flokkar
  og birtir  \u00ed f\u00e9lakerfinu uppl\u00fdsingarnar um fundarefni, fyrirlesara,
  st\u00f6\u00f0u fyrirlesara, dags. fundar og nafn kl\u00fabbsins sem h\u00e9lt fundinn.
  Uppl\u00fdsingarnar eru a\u00f0gengilegt fyrir alla innskr\u00e1\u00f0a r\u00f3tar\u00fdf\u00e9laga.
  Kl\u00fabbstj\u00f3rnir eru hvattar til a\u00f0 skr\u00e1 inn uppl\u00fdsingar \u00ed
  \u201efundarefnisbankann\\\" um lei\u00f0 og fundir eru skr\u00e1\u00f0ir e\u00f0a
  \u00feeir uppf\u00e6r\u00f0ir. Vefs\u00ed\u00f0unefnd hvetur kl\u00fabbana til a\u00f0
  n\u00fdta s\u00e9r fundarefnisbankann \u00ed starfi s\u00ednu.\\n- \u00c1 starfs\u00e1rinu
  vann nefndin a\u00f0 ger\u00f0 ensks vefhluta undir stj\u00f3rn Paul Richardson.
  \u00c1kve\u00f0nir s\u00e9rsni\u00f0nar kerfiseiningar voru \u00fe\u00fdddar og
  forrita\u00f0ar.  Stuttur texti \u00e1 ensku ver\u00f0ur \u00ed framhaldinu skrifa\u00f0ur
  fyrir hvern kl\u00fabb. Ver\u00f0ur \u00fea\u00f0 gert \u00ed samr\u00e1\u00f0i
  vi\u00f0 kl\u00fabbana.\\n\\nVinna vi\u00f0 endurb\u00e6tur og \u00fer\u00f3un kerfisins
  \u00e1 starfs\u00e1rinu hefur teki\u00f0 umtalsver\u00f0an t\u00edma b\u00e6\u00f0i
  fyrir vefnefndina og hugb\u00fana\u00f0arframlei\u00f0andann. Til vi\u00f0b\u00f3tar
  \u00feessu \u00e1 heimas\u00ed\u00f0unni og \u00ed f\u00e9lagakerfinu heldur vefnefndin
  utan um p\u00f3stkerfi umd\u00e6misins sem keyrt er undir Google Apps og hefur reynst
  vel. Allir kl\u00fabbar hafa netfang sem h\u00e6gt er a\u00f0 senda \u00ed og einn
  kl\u00fabbur er me\u00f0 netfang sem hann st\u00fdrir og getur einnig sent fr\u00e1
  \u00fev\u00ed. Kl\u00fabbanetf\u00f6ng v\u00edsa \u00e1 netf\u00f6ng forseta og
  ritara hverju sinni.\\n\\nVefs\u00ed\u00f0unefnd vill benda r\u00f3tar\u00fdf\u00e9l\u00f6gum
  \u00e1 a\u00f0 f\u00e9lagakerfi umd\u00e6misins \u00e1 www.rotary.is og \u00fear
  me\u00f0 heimas\u00ed\u00f0ur kl\u00fabbanna er mj\u00f6g sterkt samskiptat\u00e6ki,
  m\u00e1lgagn og fr\u00e9ttami\u00f0ill og getur veri\u00f0 me\u00f0 til a\u00f0
  gera kl\u00fabbastarfi\u00f0 meira lifandi og opi\u00f0.\\n\\nLei\u00f0beiningar
  og \u00fdmsan fr\u00f3\u00f0leik m\u00e1 finna \u00e1 www.rotary.is/rotaryklubbar/thjonusta/\\n\\nN\u00e1mskei\u00f0
  og \u00fej\u00f3nusta:\\n\\nVefnefndin hefur veri\u00f0 bo\u00f0in og b\u00fain
  a\u00f0 veita a\u00f0sto\u00f0 og lei\u00f0beiningar. Kl\u00fabbar og einstaklingar
  hafa n\u00fdtt s\u00e9r a\u00f0 f\u00e1 s\u00e9rn\u00e1mskei\u00f0 auk \u00feess
  sem fj\u00f6lm\u00f6rgum hefur veri\u00f0 veitt lei\u00f0s\u00f6gn \u00ed gegnum
  s\u00edma e\u00f0a \u00ed t\u00f6lvup\u00f3sti.\\n\\n\u00c1hersla hefur veri\u00f0
  l\u00f6g\u00f0 \u00e1 a\u00f0 kl\u00fabbar tryggi a\u00f0 myndir af f\u00e9l\u00f6gum
  s\u00e9u sendar inn \u00ed f\u00e9lagakerfi\u00f0 en Gu\u00f0ni hefur s\u00e9\u00f0
  um a\u00f0 setja \u00fe\u00e6r \u00ed r\u00e9ttar st\u00e6r\u00f0ir og hlutf\u00f6ll
  og koma \u00feeim \u00e1 vefinn. \u00de\u00f3 vi\u00f0br\u00f6g\u00f0 hafi veri\u00f0
  g\u00f3\u00f0 eru enn \u00fe\u00f3 nokku\u00f0 margir sem f\u00e1 eitt st\u00f3rt
  spurningarmerki vi\u00f0 nafn sitt \u00ed sta\u00f0 fallegrar myndar. \u00dear m\u00e1
  enn b\u00e6ta.\\n\\n\u00ddmsar lei\u00f0beiningar hafa veri\u00f0 sendar \u00fat,
  lei\u00f0beiningar fyrir f\u00e9lagakerfi\u00f0 var miki\u00f0 endurb\u00e6tt og
  m\u00e1 n\u00e1lgast \u00e1 http://www.rotary.is/rotaryklubbar/thjonusta/felagakerfid-leidbeiningar/\\n\\nVer\u00f0andi
  forsetar og ritarar hafa fengi\u00f0 hvatningu og \u00e1bendingar um \u00fea\u00f0
  hva\u00f0 gera \u00feurfi vi\u00f0 stj\u00f3rnarskipti auk \u00feess sem unni\u00f0
  hefur veri\u00f0 me\u00f0 ritnefnd umd\u00e6misins vi\u00f0 a\u00f0 hvetja kl\u00fabba
  til a\u00f0 skrifa inn \u00e1 heimas\u00ed\u00f0ur s\u00ednar.\\n\\n\u00deann 17.
  mars 2012 var haldi\u00f0 PETS m\u00f3t \u00ed K\u00f3pavogi fyrir vi\u00f0takandi
  forseta og ritara kl\u00fabbanna. \u00dear veitti Gu\u00f0ni G\u00edslason fr\u00e6\u00f0slu
  um notkun f\u00e9lagakerfisins og f\u00f3r \u00ed gegnum n\u00fdjar lei\u00f0beiningar
  fyrir vefinn sem hann hefur sami\u00f0. Gu\u00f0ni hefur \u00e1 starfs\u00e1rinu
  svara\u00f0 fj\u00f6lm\u00f6rgum fyrirspurnum og veitt r\u00f3tar\u00fdf\u00e9l\u00f6gum
  \u00f3metanlega a\u00f0sto\u00f0.\\n\\nMinningar- og heilla\u00f3skakort\\n\\n\u00c1
  heimas\u00ed\u00f0u umd\u00e6misins er kerfiseining er skr\u00e1ir og tekur \u00e1
  m\u00f3ti p\u00f6ntunum minningar- og heilla\u00f3skaskeyta. Skrifstofa umd\u00e6misins
  s\u00e9r um a\u00f0 \u00fatb\u00faa korti\u00f0 og senda til vi\u00f0takanda. Tekjur
  af s\u00f6lu skeytanna rennur \u00ed R\u00f3tar\u00fdsj\u00f3\u00f0inn. Tengill
  \u00e1 p\u00f6ntunars\u00ed\u00f0u er \u00e1 fors\u00ed\u00f0u www.rotary.is\\n\\nFramundan\\n\\nEndurb\u00e6tur:\\n\\nMe\u00f0al
  n\u00e6stu verkefna er:\\n\\n- Fagleg r\u00fdni \u00e1 vefnum til a\u00f0 uppf\u00e6ra
  uppl\u00fdsingar og sj\u00e1 hvar betur megi gera\\n- Lagf\u00e6ringar \u00e1 a\u00f0ger\u00f0inni
  a\u00f0 aftengja f\u00e9laga \u00far kl\u00fabbi  og tryggt a\u00f0 f\u00e9lagar
  ver\u00f0i ekki \u00f3vart felldir \u00fat.\\n- Tenging n\u00fds f\u00e9laga vi\u00f0
  kl\u00fabb ver\u00f0ur ger\u00f0 einfaldari\\n- Vinna vi\u00f0 a\u00f0 gera einfalt
  a\u00f0 kalla \u00fat \u00far kerfinu \u00fdmsar uppl\u00fdsingar, aldursdreifingu,
  fj\u00f6lda f\u00e9laga og fl.\\n- Lj\u00faka vinnu vi\u00f0 uppsetningu enska vefhlutans.\\n\\n\u00deakkir\\n\\n\u00d6llum
  \u00feeim notendum kerfisins sem hafa sent inn \u00e1bendingar er \u00fe\u00f6kku\u00f0
  a\u00f0sto\u00f0in og vefs\u00ed\u00f0unefnd \u00feakkar r\u00f3tar\u00fdf\u00e9l\u00f6gum
  \u00feolinm\u00e6\u00f0i \u00e1 me\u00f0an \u00fer\u00f3unarvinna hefur sta\u00f0i\u00f0
  yfir.\\n\\nRita\u00f0 \u00ed Reykjav\u00edk \u00feann 5. september 2012.\\n\\n\u00d3lafur
  \u00d3lafsson forma\u00f0ur\"", "\"REGLUGER\u00d0 FRAMKV\u00c6MDASTJ\u00d3RNARINNAR
  (ESB) nr. 1017/2013 2014/EES/36/14\\n\\nfr\u00e1 23. okt\u00f3ber 2013\\n\\num synjun
  leyfis fyrir tilteknum heilsufullyr\u00f0ingum er var\u00f0a matv\u00e6li og v\u00edsa
  hvorki til minnkunar \u00e1 sj\u00fakd\u00f3ms\u00e1h\u00e6ttu n\u00e9 til \u00feroskunar
  e\u00f0a heilbrig\u00f0is barna (*)\\n\\nFRAMKV\u00c6MDASTJ\u00d3RN EVR\u00d3PUSAMBANDSINS
  HEFUR, me\u00f0 hli\u00f0sj\u00f3n af s\u00e1ttm\u00e1lanum um starfsh\u00e6tti
  Evr\u00f3pusam\u00ad bandsins,\\n\\ntengslum vi\u00f0 hitaeiningasnautt matar\u00e6\u00f0i
  (spurning nr. EFSA-Q-20011-00016)( 2 ). Fullyr\u00f0ingin, sem um\u00ads\u00e6kjandinn
  lag\u00f0i til, var svohlj\u00f3\u00f0andi: \u201eStu\u00f0lar a\u00f0 \u00fev\u00ed
  a\u00f0 draga \u00far st\u00e6r\u00f0 b\u00fakfitufrumna \u00ed tengslum vi\u00f0
  hita\u00ad eininga\u00adsnautt matar\u00e6\u00f0i\\\".\\n\\nme\u00f0 hli\u00f0sj\u00f3n
  af regluger\u00f0 Evr\u00f3pu\u00feingsins og r\u00e1\u00f0sins (EB) nr. 1924/2006
  fr\u00e1 20. desember 2006 um n\u00e6ringar- og heilsufullyr\u00f0ingar er var\u00f0a
  matv\u00e6li( 1 ), einkum 5. mgr. 18. gr., og a\u00f0 teknu tilliti til eftirfarandi
  :\\n\\n1) Samkv\u00e6mt regluger\u00f0 (EB) nr. 1924/2006 eru heilsu\u00ad full\u00adyr\u00f0ingar
  er var\u00f0a matv\u00e6li banna\u00f0ar nema fram\u00ad kv\u00e6mdastj\u00f3rnin
  leyfi \u00fe\u00e6r \u00ed samr\u00e6mi vi\u00f0 \u00fe\u00e1 regluger\u00f0 og
  a\u00f0 \u00fe\u00e6r s\u00e9u \u00e1 lista yfir leyf\u00f0ar fullyr\u00f0ingar.\\n2)
  \u00cd regluger\u00f0 (EB) nr. 1924/2006 er einnig kve\u00f0i\u00f0 \u00e1 um a\u00f0
  stj\u00f3rnendur matv\u00e6lafyrirt\u00e6kja geti sent l\u00f6gb\u00e6ru yfirvaldi
  a\u00f0ildarr\u00edkis ums\u00f3knir um leyfi fyrir heilsufullyr\u00f0ingum. L\u00f6gb\u00e6ra
  yfirvaldi\u00f0 skal framsenda t\u00e6kar ums\u00f3knir til Matv\u00e6la\u00f6ryggisstofnunar
  Evr\u00f3pu, h\u00e9r \u00e1 eftir nefnd \u201eMatv\u00e6la\u00f6ryggisstofnunin\\\".\\n3)
  \u00deegar Matv\u00e6la\u00f6ryggisstofnuninni hefur borist ums\u00f3kn skal h\u00fan
  tilkynna \u00fea\u00f0 hinum a\u00f0ildarr\u00edkjunum og framkv\u00e6mdastj\u00f3rninni
  \u00e1n tafar og skila \u00e1liti \u00e1 vi\u00f0komandi heilsufullyr\u00f0ingu.\\n4)
  Framkv\u00e6mdastj\u00f3rnin skal \u00e1kve\u00f0a hvort heilsufull\u00ad yr\u00f0ingar
  skuli leyf\u00f0ar, a\u00f0 teknu tilliti til \u00e1lits Mat\u00adv\u00e6la\u00ad
  \u00f6ryggisstofnunarinnar.\\n5) \u00cd kj\u00f6lfar ums\u00f3knar fr\u00e1 Ceprodi
