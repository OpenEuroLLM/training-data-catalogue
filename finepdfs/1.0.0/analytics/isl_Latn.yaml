sample: '["\"SK\u00ddRSLA UM FLUGUMFER\u00d0ARATVIK\\n\\n(sbr. l\u00f6g nr. 35/2004
  um ranns\u00f3kn flugslysa)\\n\\nM-03407/AIG-18\\n\\n\u00c1rekstrarvi\u00f0v\u00f6run
  FXI123 (Fokker 50)/TF-FTN (Piper PA-44-180) 6 Nm nor\u00f0ur af Reykjav\u00edkurflugvelli
  7. september 2007\\n\\nMarkmi\u00f0 flugslysaranns\u00f3kna er a\u00f0 greina orsaka\u00fe\u00e6tti
  flugslysa \u00ed \u00fev\u00ed skyni einu a\u00f0 koma \u00ed veg fyrir a\u00f0
  flugslys endurtaki sig og stu\u00f0la a\u00f0 \u00fev\u00ed a\u00f0 \u00f6ryggi
  \u00ed flugi megi aukast. Tilgangurinn er ekki a\u00f0 skipta s\u00f6k og/e\u00f0a
  \u00e1byrg\u00f0. Sk\u00fdrslu Ranns\u00f3knarnefndar flugslysa skal ekki beitt
  sem s\u00f6nnunargagni \u00ed opinberum m\u00e1lum, en ranns\u00f3kn \u00e1 meintri
  refsiver\u00f0ri h\u00e1ttsemi \u00ed tengslum vi\u00f0 flugslys er \u00f3h\u00e1\u00f0
  ranns\u00f3kn flugslysa sbr. l\u00f6g nr. 35/2004 um ranns\u00f3kn flugslysa.\\n\\n1
  HELSTU STA\u00d0REYNDIR\\n\\nSta\u00f0ur:\\n\\n6 NM nor\u00f0ur af \u00fer\u00f6skuldi
  flugbrautar 19 \u00e1 Reykjav\u00edkurflugvelli \u00ed loftr\u00fdmi D.\\n\\nDagsetning
  og t\u00edmi:\\n\\n7. september 2007, kl. 13:15.\\n\\nLoftfar A (FXI123)\\n\\n-
  tegund\\n\\nFokker 50.\\n\\nLoftfar B (TF-FTN)\\n\\n- tegund\\n\\nPiper Seminole
  PA-44.\\n\\nTegund flugs:\\n\\n- loftfar A\\n\\nAtvinnuflug.\\n\\n- loftfar B\\n\\nKennsluflug.\\n\\nMei\u00f0sl:\\n\\nEngin.\\n\\nSkemmdir:\\n\\nEngar.\\n\\nVe\u00f0ur:\\n\\nVindur
  240\u00b0/14 hn\u00fatar, l\u00e9ttsk\u00fdja\u00f0 1400 fet, h\u00e1lfsk\u00fdja\u00f0
  \u00ed 1800 fetum og sk\u00fdja\u00f0 \u00ed 2800 fetum. Hiti 11 gr\u00e1\u00f0ur,
  daggarmark 10 gr\u00e1\u00f0ur og QNH 1015 mb.\\n\\nFlugreglur:\\n\\n- loftfar A\\n\\nBlindflugsreglur.\\n\\n-
  loftfar B\\n\\nSj\u00f3nflugsreglur.\\n\\nFlugskilyr\u00f0i:\\n\\nSj\u00f3nflugsskilyr\u00f0i
  vi\u00f0 Reykjav\u00edkurflugv\u00f6ll.\\n\\nAtviksl\u00fdsing:\\n\\nLoftfar A f\u00e9kk
  \u00e1rekstrarvi\u00f0v\u00f6run vegna loftfars B.\\n\\nUm flugi\u00f0\\n\\nLoftfar
  B h\u00f3f kennsluflug \u00ed blindflugs\u00e6fingum fr\u00e1 flugbraut 31 \u00e1
  Reykjav\u00edkurflugvelli. Eftir flugtak skipti loftfar B yfir \u00e1 t\u00ed\u00f0ni
  Reykjav\u00edkura\u00f0flugs (119.0 MHz).  Flugkennari loftfars B \u00f3ska\u00f0i
  eftir heimild til blinda\u00f0flugs a\u00f0 hringvita GF NDB (GROF) sem er nor\u00f0ur
  af flugbraut 19.  \u00dear sem loftfar A var a\u00f0 hefja ILS a\u00f0flug a\u00f0
  flugbraut 19 gat Reykjav\u00edkura\u00f0flug ekki veitt heimild til \u00feessa og
  fyrirskipa\u00f0i flugmanni loftfars B a\u00f0 hann h\u00e9ldi sig vi\u00f0 hringvita
  RK NDB \u00ed sj\u00f3nflugi \u00ed 1500 fetum.\\n\\nStuttu eftir \u00feessi samskipti
  stillti flugnemi \u00e1 loftfari B  hringvitav\u00edsi (ADF) \u00e1 \\\"antenna\\\"
  \u00feannig a\u00f0 hann gaf ekki r\u00e9ttar uppl\u00fdsingar.  Flugkennarinn \u00e1
  loftfari B t\u00f3k ekki eftir \u00feessari breytingu \u00ed fyrstu og h\u00e9lt
  \u00e1fram blindflugs\u00e6fingum.  Loftfar B flaug n\u00fa t\u00f6luvert nor\u00f0ur
  og austur af RK NDB, f\u00f3r inn\u00e1 lokastefnu fyrir flugbraut 19 og flaug einn
  hring \u00fear inn og \u00fat \u00far sk\u00fdjum.\\n\\nReykjav\u00edkura\u00f0flug
  fyrirskipa\u00f0i loftfari B a\u00f0 flj\u00faga \u00ed \u00e1tt til borgarinnar.  Flugma\u00f0ur
  loftfars B beyg\u00f0i \u00fe\u00e1 enn austar og var komin inn \u00ed sk\u00fd
  og l\u00e6kka\u00f0i vi\u00f0 \u00fea\u00f0 flugh\u00e6\u00f0ina til a\u00f0 reyna
  a\u00f0 halda sj\u00f3nflugi.  Reykjav\u00edkura\u00f0flug gaf loftfari B \u00fe\u00e1
  flugstefnu \u00ed vestur til a\u00f0 koma honum \u00fat \u00far a\u00f0flugsv\u00e6\u00f0inu
  fyrir flugbraut 19.  Sk\u00f6mmu s\u00ed\u00f0ar \u00e1tta\u00f0i flugkennarinn
  sig \u00e1 \u00fev\u00ed a\u00f0 hringvitav\u00edsir (ADF) var rangt stilltur og
  tilkynnti \u00fea\u00f0 til Reykjav\u00edkura\u00f0flugs.  Hringvitav\u00edsir (ADF)
  var stilltur r\u00e9tt og flogi\u00f0 var \u00ed \u00e1tt a\u00f0 RK NDB. Ferla
  loftfaranna m\u00e1 sj\u00e1 \u00e1 mynd 1 h\u00e9r a\u00f0 ne\u00f0an.\\n\\nLoftfar
  A kalla\u00f0i \u00ed flugturn \u00e1 Reykjav\u00edkurflugvelli eftir klukkan 13:15
  og tilkynnti um fr\u00e1hvarfsflug vegna \u00e1rekstrarvi\u00f0v\u00f6runar (TCAS
  RA CLIMB) vegna loftfars B. H\u00e6\u00f0ara\u00f0skilna\u00f0ur var, a\u00f0 s\u00f6gn
  flugmanna \u00ed loftfari A, 200 fet samkv\u00e6mt \u00e1rekstrarvara.   H\u00e6\u00f0ara\u00f0skilna\u00f0ur
  samkv\u00e6mt ratsj\u00e1rg\u00f6gnum var 1796 fet og var fjarl\u00e6g\u00f0in \u00e1
  milli v\u00e9lanna \u00fe\u00e1 0,23 sj\u00f3m\u00edlur (Nm) eins og sj\u00e1 m\u00e1
  \u00e1 mynd 2 h\u00e9r a\u00f0 ne\u00f0an.\\n\\nLoftfar B var \u00ed  blindflugs\u00e6fingum
  \u00e1 sj\u00f3nflugsheimild (VFR) me\u00f0 talst\u00f6\u00f0varsamskipti vi\u00f0
  Reykjav\u00edkura\u00f0flug. Sj\u00f3nflugsskilyr\u00f0i (VMC) voru vi\u00f0 Reykjav\u00edkurflugv\u00f6ll
  \u00e1 \u00feessum t\u00edma en austur af Reykjav\u00edk voru blindflugsskilyr\u00f0i
  (IMC) vegna sk\u00fdja og var loftfar B \u00fev\u00ed \u00ed blindflugsskilyr\u00f0um
  nor\u00f0-austur af Reykjav\u00edk.\\n\\nPr\u00f3fanir\\n\\n\u00cd greiningu \u00e1
  ratsj\u00e1rg\u00f6gnum kom fram a\u00f0 loftfar B sendi fr\u00e1 s\u00e9r merki
  um flugh\u00e6\u00f0 \u00ed 2700 fetum nokkrum sinnum.   Samkv\u00e6mt samtali vi\u00f0
  flugkennara var aldrei flogi\u00f0 svo h\u00e1tt.\\n\\nRanns\u00f3knarnefnd flugslysa
  ger\u00f0i flugpr\u00f3fanir \u00ed loftfari B til a\u00f0 sta\u00f0festa hvort
  ratsj\u00e1rsvari (transponder) \u00ed loftfari B hafi sent fr\u00e1 s\u00e9r rangar
  h\u00e6\u00f0arlesningar e\u00f0a hvort ratsj\u00e1rkefi Flugsto\u00f0a hef\u00f0i
  unni\u00f0 rangt \u00far uppl\u00fdsingum er b\u00e1rust fr\u00e1 loftfari B.   Flognir
  voru 6 hringir \u00ed 1000, 1500, 2000, 2500 og 3000 feta h\u00e6\u00f0um \u00e1
  sv\u00e6\u00f0inu \u00fear sem a\u00f0skilna\u00f0urinn \u00e1tti s\u00e9r sta\u00f0.  Uppl\u00fdsingar
  \u00far Garmin GPSmap296 (EGNOS) t\u00e6ki voru bornar saman vi\u00f0 uppl\u00fdsingar
  \u00far ratsj\u00e1rkerfi Flugsto\u00f0a.  Eins og sj\u00e1 m\u00e1 \u00e1 myndum
  3-5 a\u00f0 ne\u00f0an var gott samr\u00e6mi \u00ed h\u00e6\u00f0, hra\u00f0a og
  stefnu \u00e1 milli ratsj\u00e1rkerfis og gps gagna.\\n\\nFlugh\u00e6\u00f0ir \u00far
  GPS vs. Sameinu\u00f0 Ratsj\u00e1rmynd\\n\\nFlugpr\u00f3f 21.09.2007 TF-FTN QNH
  993 hPa\\n\\nHra\u00f0i \u00far GPS vs. Sameinu\u00f0 Ratsj\u00e1rmynd\\n\\nFlugpr\u00f3f
  21.09.2007 TF-FTN QNH 993 hPa\\n\\nT\u00edmi (klst:m\u00edn:sek)\\n\\nMynd 4:  Samanbur\u00f0ur
  \u00e1 flughra\u00f0a\\n\\nStefna (True Course) GPS vs. Sameinu\u00f0 Ratsj\u00e1rmynd
  Flugpr\u00f3f 21.09.2007 TF-FTN QNH 993 hPa\\n\\n2 GREINING OG NI\u00d0URSTA\u00d0A\\n\\nRanns\u00f3knarnefnd
  flugslysa telur l\u00edklegt a\u00f0 ratsj\u00e1rsvari \u00ed loftfari B hafi sent
  fr\u00e1 s\u00e9r nokkrum sinnum merki um ranga flugh\u00e6\u00f0 sem var\u00f0
  \u00feess valdandi a\u00f0 \u00e1rekstrarvari \u00ed loftfari A gaf vi\u00f0v\u00f6run
  um of l\u00edtin a\u00f0skilna\u00f0 \u00e1 milli loftfaranna.  A\u00f0skilna\u00f0urinn
  \u00e1 milli loftfaranna hafi \u00fev\u00ed aldrei or\u00f0i\u00f0 minni en 1796
  fet og 0,23 sj\u00f3m\u00edlur eins og fram hefur komi\u00f0 \u00e1 ratsj\u00e1rg\u00f6gnum.\\n\\nRanns\u00f3knarnefnd
  flugslysa haf\u00f0i samband vi\u00f0 framlei\u00f0anda ratsj\u00e1rsvara \u00ed
  loftfari B. Framlei\u00f0andi kanna\u00f0ist ekki vi\u00f0 vandam\u00e1l tengdum
  merkjum um rangar flugh\u00e6\u00f0ir \u00ed ratsj\u00e1rsv\u00f6rum.  Ratsj\u00e1rsvari
  \u00ed TF-FTN sendi fr\u00e1 s\u00e9r skeyti um rangar flugh\u00e6\u00f0ir og beinir
  Ranns\u00f3knarnefnd flugslysa \u00fev\u00ed til Flugsk\u00f3la \u00cdslands a\u00f0
  l\u00e1ta yfirfara kerfi er tengjast ratsj\u00e1rsvara \u00ed TF-FTN.\\n\\nFlugma\u00f0ur
  \u00e1 loftfari B flaug ekki samkv\u00e6mt sj\u00f3nflugsreglum \u00fear sem hann
  flaug inn og \u00fat \u00far sk\u00fdjum og ekki samkv\u00e6mt fyrirskipunum flugumfer\u00f0arstj\u00f3ra.  Samkv\u00e6mt
  reglum eru a\u00f0eins til tv\u00e6r tegundir af flugi \u00fe.e. blindflug og sj\u00f3nflug.  Ranns\u00f3knarnefnd
  flugslysa telur \u00fea\u00f0 nau\u00f0synlegt a\u00f0 kennsluflug \u00ed blindflugs\u00e6fingum
  s\u00e9 ekki flogi\u00f0 nema me\u00f0 blindflugsheimild \u00feegar ve\u00f0ur er
  \u00e1 m\u00f6rkum sj\u00f3nflugs- og blindflugsskilyr\u00f0a.\\n\\n3 TILL\u00d6GUR
  \u00cd \u00d6RYGGIS\u00c1TT\\n\\nEngar.\\n\\nReykjav\u00edk 9. ma\u00ed 2008 Ranns\u00f3knarnefnd
  flugslysa\"", "\"Mannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0\\n\\n\u00c1r
  2024, fimmtudaginn 22. \u00e1g\u00fast var haldinn 37. fundur mannr\u00e9ttinda-
  og ofbeldisvarnarr\u00e1\u00f0s. Fundurinn var haldinn \u00ed R\u00e1\u00f0h\u00fasi,
  Tjarnarb\u00fa\u00f0 og h\u00f3fst kl. 13.09. Fundinn s\u00e1tu eftirfarandi fulltr\u00faar:
  Magn\u00fas Dav\u00ed\u00f0 Nor\u00f0dahl, \u00deorvaldur Dan\u00edelsson, Sabine
  Leskopf, Fri\u00f0j\u00f3n R. Fri\u00f0j\u00f3nsson, Helga \u00de\u00f3r\u00f0ard\u00f3ttir
  og \u00c1sta \u00de\u00f3rd\u00eds Skjalddal Gu\u00f0j\u00f3nsd\u00f3ttir. Auk \u00feeirra
  eftirtaldir \u00e1heyrnarfulltr\u00faar: Margr\u00e9t Krist\u00edn P\u00e1lsd\u00f3ttir,
  Jenn\u00fd I. Ingud\u00f3ttir, Linda Dr\u00f6fn Gunnarsd\u00f3ttir og Dr\u00edfa
  Sn\u00e6dal. Eftirtaldir fulltr\u00faar t\u00f3ku s\u00e6ti \u00e1 fundinum me\u00f0
  rafr\u00e6num h\u00e6tti me\u00f0 v\u00edsan til heimildar \u00ed 2. m\u00e1lsl.
  4. mgr. 44. gr. sam\u00feykktar um stj\u00f3rn Reykjav\u00edkurborgar og fundarsk\u00f6p
  borgarstj\u00f3rnar sbr. 3. mgr. 17. gr. sveitarstj\u00f3rnarlaga nr. 138/2011:
  Unnur \u00de\u00f6ll Benediktsd\u00f3ttir. Eftirtaldir emb\u00e6ttismenn og starfsf\u00f3lk
  sat einnig fundinn: Anna Kristinsd\u00f3ttir og Halld\u00f3ra D\u00fdrleifar Gunnarsd\u00f3ttir.
  El\u00edsabet P\u00e9tursd\u00f3ttir rita\u00f0i fundarger\u00f0.\\n\\n\u00deetta
  ger\u00f0ist:\\n\\n1. Lagt fram br\u00e9f mannr\u00e9ttinda- og l\u00fd\u00f0r\u00e6\u00f0isskrifstofu
  dags.13. \u00e1g\u00fast 2024, um \u00f3kyngreind salerni \u00ed stj\u00f3rns\u00fdsluh\u00fasum
  Reykjav\u00edkurborgar. MSS22020161 Sam\u00feykkt a\u00f0 fela mannr\u00e9ttinda-
  og l\u00fd\u00f0r\u00e6\u00f0isskrifstofu Reykjav\u00edkurborgar a\u00f0 senda erindi
  \u00e1 F\u00e9lagsm\u00e1lar\u00e1\u00f0uneyti\u00f0 \u00fear sem kalla\u00f0 er
  eftir nau\u00f0synlegum breytingum \u00e1 reglum 581/1995 um h\u00fasn\u00e6\u00f0i
  vinnusta\u00f0a.\\n\\nMannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0 leggur fram
  svohlj\u00f3\u00f0andi b\u00f3kun:\\n\\nMannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0
  harmar \u00farskur\u00f0 F\u00e9lagsm\u00e1lar\u00e1\u00f0uneytisins var\u00f0andi
  \u00f3kyngreind salerni dags. 11. j\u00fal\u00ed 2024. Telur r\u00e1\u00f0i\u00f0
  \u00e1kaflega mikilv\u00e6gt a\u00f0 r\u00e9ttindi \u00feeirra sem skilgreina kyn
  sitt \u00e1 annan h\u00e1tt en karl e\u00f0a kona s\u00e9u virt \u00ed hv\u00edvetna,
  ekki s\u00edst me\u00f0 hli\u00f0sj\u00f3n af l\u00f6gum um kynr\u00e6nt sj\u00e1lfr\u00e6\u00f0i.
  R\u00e1\u00f0i\u00f0 hefur fali\u00f0 mannr\u00e9ttindaog l\u00fd\u00f0r\u00e6\u00f0isskrifstofu
  Reykjav\u00edkurborgar a\u00f0 senda erindi \u00e1 F\u00e9lagsm\u00e1lar\u00e1\u00f0uneyti\u00f0
  \u00fear sem kalla\u00f0 er eftir nau\u00f0synlegum breytingum \u00e1 reglum 581/1995
  um h\u00fasn\u00e6\u00f0i vinnusta\u00f0a \u00feannig a\u00f0 umr\u00e6ddar reglur
  standi ekki vegi fyrir \u00f3kyngreindum salernum.\\n\\nGu\u00f0r\u00fan Elsa Tryggvad\u00f3ttir
  tekur s\u00e6ti \u00e1 fundinum undir \u00feessum li\u00f0.\\n\\n2. Lagt fram br\u00e9f
  mannr\u00e9ttinda- og l\u00fd\u00f0r\u00e6\u00f0isskrifstofu dags. 14. \u00e1g\u00fast
  2024, \u00fear sem \u00f3ska\u00f0 er sam\u00feykktar mannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0s
  \u00e1 breytingu \u00e1 \u00fathlutunarreglum hverfissj\u00f3\u00f0s Reykjav\u00edkurborgar.
  MSS24030095 Sam\u00feykkt.\\n\\nGu\u00f0r\u00fan Elsa Tryggvad\u00f3ttir tekur s\u00e6ti
  \u00e1 fundinum undir \u00feessum li\u00f0.\\n\\n3. Fram fer kynning \u00e1 undirb\u00faningi
  a\u00f0ger\u00f0ar\u00e1\u00e6tlunar Reykjav\u00edkurborgar gegn ofbeldi 2025 -.
  MSS24060082\\n\\nFulltr\u00fai S\u00f3s\u00edalistaflokks \u00cdslands leggur fram
  svohlj\u00f3\u00f0andi b\u00f3kun:\\n\\nS\u00f3s\u00edalistaflokkurinn hefur lagt
  til a\u00f0 eftirfarandi ver\u00f0i sett inn \u00ed a\u00f0ger\u00f0ar\u00e1\u00e6tlun
  Reykjav\u00edkurborgar gegn ofbeldi: Verklagsreglur, \u00feegar grunur vaknar um
  ofbeldi starfsf\u00f3lks gegn b\u00f6rnum \u00ed sk\u00f3la- og fr\u00edstundastarfi,
  s\u00e9u r\u00fdndar \u00ed samr\u00e6mi vi\u00f0 l\u00f6g 19/2013. Fari\u00f0 s\u00e9
  eftir \u00e1bendingum l\u00f6greglu \u00far \u00fattekt um ofbeldisvarnarm\u00e1l
  Reykjav\u00edkurborgar og tryggt a\u00f0 hvorki s\u00e9 r\u00e6tt vi\u00f0 \u00feolendur
  n\u00e9 gerendur \u00feegar grunur vaknar um hvers konar ofbeldi og a\u00f0 a\u00f0ilar
  sem gruna\u00f0ir eru um ofbeldi s\u00e9u \u00e1vallt sendir \u00ed launalaust leyfi
  \u00fear til m\u00e1li er loki\u00f0 af h\u00e1lfu l\u00f6greglu og d\u00f3mst\u00f3la
  N\u00faverandi verklag samr\u00e6mist ekki greinum 3. 4. og 19. Barnas\u00e1ttm\u00e1la:
  B\u00f6rn eiga r\u00e9tt \u00e1 skilyr\u00f0islausri vernd \u00feegar grunur vaknar
  um ofbeldi. \u00cd n\u00faverandi verkferlum er \u00fea\u00f0 ekki svo \u00feegar
  um r\u00e6\u00f0ir grun um ofbeldi anna\u00f0 en kynfer\u00f0isbrot eins og kemur
  fram \u00ed \u00fattektinni. Mikilv\u00e6gt er a\u00f0 tryggja a\u00f0 stj\u00f3rnendum
  sk\u00f3lastofnana s\u00e9 ekki fali\u00f0 a\u00f0 n\u00e1lgast barn um ofbeldi
  sem \u00fea\u00f0 hefur hugsanlega veri\u00f0 beitt af undirmanni stj\u00f3rnandans
  heldur s\u00e9 trygg\u00f0 a\u00f0koma fagf\u00f3lks a\u00f0 m\u00e1lum en Barnah\u00fas
  hefur sinnt sl\u00edkum samt\u00f6lum. Eins skulu b\u00f6rn ekki sett \u00ed \u00fe\u00e1
  st\u00f6\u00f0u a\u00f0 \u00feurfa a\u00f0 halda \u00e1fram \u00ed n\u00e1mi e\u00f0a
  fr\u00edstundum me\u00f0 grunu\u00f0um a\u00f0ila. Mikilv\u00e6gt er a\u00f0 r\u00e1\u00f0i\u00f0
  s\u00e9 \u00e1byrg\u00f0ara\u00f0ili a\u00f0 \u00feessum li\u00f0 til a\u00f0 tryggja
  \u00f6ryggi barna.\\n\\n- Kl. 15.03 v\u00edkur Linda Dr\u00f6fn Gunnarsd\u00f3ttir
  af fundinum.\\n\\nSigr\u00ed\u00f0ur Finnbogad\u00f3ttir tekur s\u00e6ti \u00e1
  fundinum undir \u00feessum li\u00f0.\\n\\n4. Lagt fram br\u00e9f menningar- og \u00ed\u00fer\u00f3ttasvi\u00f0s
  dags. 1. j\u00fal\u00ed 2024, um umsagnarbei\u00f0ni um endursko\u00f0un \u00e1
  m\u00e1lsme\u00f0fer\u00f0arreglum borgarr\u00e1\u00f0s um veitinga- og gistista\u00f0i
  Jafnframt eru l\u00f6g\u00f0 fram dr\u00f6g a\u00f0 ums\u00f6gn mannr\u00e9ttinda-
  og ofbeldisvarnarr\u00e1\u00f0s dags. 16. \u00e1g\u00fast 2024. MIR24070001\\n\\nFulltr\u00fai
  Sj\u00e1lfst\u00e6\u00f0isflokksins situr hj\u00e1 vi\u00f0 afgrei\u00f0slu m\u00e1lsins.\\n\\nSam\u00feykkt.\\n\\nFulltr\u00faar
  Flokks f\u00f3lksins og S\u00f3s\u00edalistaflokks \u00cdslands leggja fram svohlj\u00f3\u00f0andi
  b\u00f3kun:\\n\\nL\u00f6g\u00f0 er fram ums\u00f6gn mannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0s
  til sam\u00feykktar um endursko\u00f0un \u00e1 reglum um \u00e1fengisveitingar \u00e1
  \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0um. Flokkur f\u00f3lksins og S\u00f3s\u00edalistaflokkur
  \u00cdslands taka undir flest \u00fea\u00f0 sem segir \u00ed ums\u00f6gn, einkum
  \u00fe\u00f3 a\u00f0 hagsmunir barna eigi a\u00f0 r\u00e1\u00f0a f\u00f6r \u00feegar
  tekin er \u00e1kv\u00f6r\u00f0un um hvort leyfa eigi \u00e1fengi \u00e1 \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0um.
  Flokkur f\u00f3lksins og S\u00f3s\u00edalistar telja mikilv\u00e6gt a\u00f0 hafa
  l\u00fd\u00f0heilsusj\u00f3narmi\u00f0 a\u00f0 lei\u00f0arlj\u00f3si \u00ed allri
  sl\u00edkri \u00e1kvar\u00f0anat\u00f6ku. Flokkur f\u00f3lksins og S\u00f3s\u00edalistaflokkurinn
  sty\u00f0ja stefnu stj\u00f3rnvalda \u00ed \u00e1fengis- og v\u00edmuv\u00f6rnum
  \u00fear sem fram kemur a\u00f0 ein mikilv\u00e6gasta a\u00f0ger\u00f0in til a\u00f0
  draga \u00far ska\u00f0legum \u00e1hrifum \u00e1fengis og vernda vi\u00f0kv\u00e6ma
  h\u00f3pa eins og b\u00f6rn og ungmenni, s\u00e9 a\u00f0 takmarka a\u00f0gengi a\u00f0
  \u00e1fengi sem og n\u00e1l\u00e6g\u00f0 \u00e1hrifa \u00e1fengis \u00e1 l\u00edf
  \u00feeirra og t\u00f3mstundir. Ef tekin ver\u00f0ur \u00e1kv\u00f6r\u00f0un um
  a\u00f0 leyfa s\u00f6lu \u00e1fengis \u00e1 \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0um
  \u00fe\u00e1 er br\u00fdnt a\u00f0 \u00fea\u00f0 ver\u00f0i miklum takm\u00f6rkunum
  h\u00e1\u00f0 og tryggt a\u00f0 \u00ed bo\u00f0i s\u00e9u \u00e1fengislaus sv\u00e6\u00f0i
  fyrir barnafj\u00f6lskyldur \u00fev\u00ed \u00ed\u00fer\u00f3ttir, b\u00f6rn og
  \u00e1fengi eiga einfaldlega ekki samlei\u00f0.\\n\\nFulltr\u00fai Sj\u00e1lfst\u00e6\u00f0isflokksins
  leggur fram svohlj\u00f3\u00f0andi b\u00f3kun:\\n\\n\u00c1fengisveitingar \u00ed
  \u00ed\u00fer\u00f3ttamannvirkjum \u00ed tengslum vi\u00f0 \u00ed\u00fer\u00f3ttavi\u00f0bur\u00f0i
  er veruleiki sem ver\u00f0ur ekki umfl\u00fain \u00fe\u00f3tt umsagnara\u00f0ilar
  og l\u00fd\u00f0heilsui\u00f0na\u00f0urinn s\u00e9u \u00ed afneitun i m\u00e1linu.
  Lokunar- og a\u00f0gengisstefna Templarahreyfingarinnar sem hefur veri\u00f0 lei\u00f0arlj\u00f3s
  stj\u00f3rnvalda \u00ed \u00e1ratugi hefur fyrir l\u00f6ngu afsanna\u00f0 gildi
  sitt. \u00dea\u00f0 er fyrir l\u00f6ngu or\u00f0i\u00f0 t\u00edmab\u00e6rt a\u00f0
  r\u00edki og borg umgangist v\u00edn og bj\u00f3r sem l\u00f6glega neysluv\u00f6ru
  og hagi l\u00f6gum og reglum \u00ed samr\u00e6mi vi\u00f0 \u00feann veruleika \u00ed
  sta\u00f0 \u00f3skhyggju.\\n\\n5. Fram fer umr\u00e6\u00f0a um sameiginlegan fund
  mannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0s og a\u00f0gengis- og samr\u00e1\u00f0snefnda
  sbr. a\u00f0ger\u00f0 nr. 1.2.4. \u00ed a\u00f0ger\u00f0ar\u00e1\u00e6tlun Reykjav\u00edkurborgar
  \u00ed jafnr\u00e9ttis- og mannr\u00e9ttindam\u00e1lum 2023 - 2026. MSS23010102\\n6.
  L\u00f6g\u00f0 fram greinager\u00f0 St\u00edgam\u00f3ta vegna styrks fr\u00e1 mannr\u00e9ttinda-
  og ofbeldisvarnarr\u00e1\u00f0i 2024. MSS22080022\\n\\n7. Lagt fram fundardagatal
  mannr\u00e9ttinda- og ofbeldisvarnarr\u00e1\u00f0s haust 2024. MSS22060205\\n8.
  L\u00f6g\u00f0 fram svohlj\u00f3\u00f0andi tillaga fulltr\u00faa S\u00f3s\u00edalistaflokks
  \u00cdslands:\\n\\nS\u00f3s\u00edalistaflokkurinn leggur til a\u00f0 eftirfarandi
  ver\u00f0i sett inn \u00ed a\u00f0ger\u00f0ar\u00e1\u00e6tlun Reykjav\u00edkurborgar
  gegn ofbeldi: Verklagsreglur, \u00feegar grunur vaknar um ofbeldi starfsf\u00f3lks
  gegn b\u00f6rnum \u00ed sk\u00f3la- og fr\u00edstundastarfi, s\u00e9u r\u00fdndar
  \u00ed samr\u00e6mi vi\u00f0 l\u00f6g 19/2013. Fari\u00f0 s\u00e9 eftir \u00e1bendingum
  l\u00f6greglu \u00far \u00dattekt: Ofbeldisvarnarm\u00e1l Reykjav\u00edkurborgar
  og tryggt a\u00f0 hvorki s\u00e9 r\u00e6tt vi\u00f0 \u00feolendur n\u00e9 gerendur
  \u00feegar grunur vaknar um hvers konar ofbeldi og a\u00f0 a\u00f0ilar sem gruna\u00f0ir
  eru um ofbeldi s\u00e9u \u00e1vallt sendir \u00ed launalaust leyfi \u00fear til
  m\u00e1li er loki\u00f0 af h\u00e1lfu l\u00f6greglu og d\u00f3mst\u00f3la\\n\\nTill\u00f6gunni
  fylgir greinarger\u00f0. MSS24080084 Fresta\u00f0.\\n\\n- Kl.15.35 v\u00edkja Dr\u00edfa
  Sn\u00e6dal, Jenn\u00fd I. Ingud\u00f3ttir og Margr\u00e9t Krist\u00edn P\u00e1lsd\u00f3ttir
  af fundinum.\\n\\nFundi sliti\u00f0 kl.15.40\\n\\nMagn\u00fas Dav\u00ed\u00f0 Nor\u00f0dahl\\n\\nUnnur
  \u00de\u00f6ll Benediktsd\u00f3ttir \u00c1sta \u00de\u00f3rd\u00eds Skjalddal Gu\u00f0j\u00f3nsd\u00f3ttir
  Helga \u00de\u00f3r\u00f0ard\u00f3ttir\\n\\n\u00deorvaldur Dan\u00edelsson Sabine
  Leskopf Fri\u00f0j\u00f3n R. Fri\u00f0j\u00f3nsson\"", "\"D\u00d3MUR\\n\\n2. j\u00fan\u00ed
  2022\\n\\nM\u00e1l nr.\\n\\nE-5130/2021:\\n\\nStefnandi: A\\n\\n(Svavar Da\u00f0ason
  l\u00f6gma\u00f0ur)\\n\\nStefndi:\\n\\n\u00cdslenska r\u00edki\u00f0\\n\\n(Eir\u00edkur
  \u00c1ki Eggertsson l\u00f6gma\u00f0ur)\\n\\nD\u00f3mari: Arnaldur Hjartarson h\u00e9ra\u00f0sd\u00f3mari\\n\\nD\u00d3MUR\\n\\nH\u00e9ra\u00f0sd\u00f3ms
  Reykjav\u00edkur 2. j\u00fan\u00ed 2022 \u00ed m\u00e1li nr. E-5130/2021:\\n\\nA\\n\\n(Svavar
  Da\u00f0ason l\u00f6gma\u00f0ur)\\n\\ngegn\\n\\n\u00edslenska r\u00edkinu\\n\\n(Eir\u00edkur
  \u00c1ki Eggertsson l\u00f6gma\u00f0ur)\\n\\nM\u00e1l \u00feetta, sem var d\u00f3mteki\u00f0
  6. ma\u00ed 2022, var h\u00f6f\u00f0a\u00f0 4. n\u00f3vember 2021.\\n\\nStefnandi
  er A, [..., ...].\\n\\nStefndi er \u00edslenska r\u00edki\u00f0, Arnarhvoli \u00ed
  Reykjav\u00edk.\\n\\nEndanlegar d\u00f3mkr\u00f6fur stefnanda eru \u00fe\u00e6r
  a\u00f0allega a\u00f0 stefnda ver\u00f0i gert a\u00f0 grei\u00f0a stefnanda miskab\u00e6tur
  a\u00f0 fj\u00e1rh\u00e6\u00f0 1.000.000 kr\u00f3nur og vexti af \u00feeirri fj\u00e1rh\u00e6\u00f0
  samkv\u00e6mt 8. gr. laga nr. 38/2011 um vexti og ver\u00f0tryggingu fr\u00e1 2.
  apr\u00edl 2021 til 19. ma\u00ed 2021, en me\u00f0 dr\u00e1ttarv\u00f6xtum samkv\u00e6mt
  1. mgr. 6. gr. s\u00f6mu laga fr\u00e1 \u00feeim degi til grei\u00f0sludags, a\u00f0
  fr\u00e1dreginni innborgun, dags. 8. september 2021, a\u00f0 fj\u00e1rh\u00e6\u00f0
  30.000 kr\u00f3nur. Til vara krefst stefnandi \u00feess a\u00f0 stefnda ver\u00f0i
  gert a\u00f0 grei\u00f0a l\u00e6gri miskab\u00e6tur a\u00f0 mati d\u00f3msins og
  vexti af \u00feeirri fj\u00e1rh\u00e6\u00f0 samkv\u00e6mt 8. gr. laga nr. 38/2001
  fr\u00e1 2. apr\u00edl 2021 til 19. ma\u00ed 2021, en me\u00f0 dr\u00e1ttarv\u00f6xtum
  samkv\u00e6mt 1. mgr. 6. gr. s\u00f6mu laga fr\u00e1 \u00feeim degi til grei\u00f0sludags,
  a\u00f0 fr\u00e1dreginni innborgun, dags. 8. september 2021, a\u00f0 fj\u00e1rh\u00e6\u00f0
  30.000 kr\u00f3nur. \u00cd b\u00e1\u00f0um tilvikum er krafist m\u00e1lskostna\u00f0ar,
  eins og m\u00e1li\u00f0 v\u00e6ri eigi gjafs\u00f3knarm\u00e1l.\\n\\nStefndi krefst
  a\u00f0allega s\u00fdknu en til vara verulegrar l\u00e6kkunar \u00e1 d\u00f3mkr\u00f6fum
  stefnanda. \u00de\u00e1 er a\u00f0allega krafist m\u00e1lskostna\u00f0ar en til
  vara er \u00feess krafist a\u00f0 hann ver\u00f0i l\u00e1tinn falla ni\u00f0ur.\\n\\nI\\n\\nStefnandi
  kom til \u00cdslands me\u00f0 flugi fr\u00e1 P\u00f3llandi 2. apr\u00edl 2021. Var
  henni gert a\u00f0 s\u00e6ta s\u00f3ttkv\u00ed \u00ed s\u00f3ttvarnah\u00fasi \u00ed
  \u00de\u00f3runnart\u00fani \u00ed Reykjav\u00edk me\u00f0 v\u00edsan til 5. gr.
  \u00fe\u00e1gildandi regluger\u00f0ar nr. 355/2021 um s\u00f3ttkv\u00ed og einangrun
  og s\u00fdnat\u00f6ku vi\u00f0 landam\u00e6ri \u00cdslands vegna COVID-19. Stefnandi,
  sem \u00e1 l\u00f6gheimili \u00e1 \u00cdslandi, kve\u00f0st hafa m\u00f3tm\u00e6lt
  sl\u00edkri s\u00f3ttkv\u00ed, b\u00e6\u00f0i \u00e1\u00f0ur en henni var eki\u00f0
  fr\u00e1 flugvellinum og vi\u00f0 komuna \u00ed s\u00f3ttvarnah\u00fasi\u00f0. \u00de\u00e1verandi
  l\u00f6gma\u00f0ur stefnanda sendi stefnda t\u00f6lvubr\u00e9f 4. apr\u00edl 2021
  og kraf\u00f0ist \u00feess a\u00f0 henni yr\u00f0i leyft a\u00f0 v\u00edkja \u00far
  s\u00f3ttvarnah\u00fasi og a\u00f0 \u00e1kv\u00f6r\u00f0un um dv\u00f6l hennar \u00fear
  yr\u00f0i tafarlaust borin undir h\u00e9ra\u00f0sd\u00f3m. \u00dev\u00ed br\u00e9fi
  var svara\u00f0 me\u00f0 t\u00f6lvubr\u00e9fi emb\u00e6ttis landl\u00e6knis s\u00ed\u00f0degis
  5. apr\u00edl 2021. \u00cd \u00fev\u00ed br\u00e9fi var \u00e1kv\u00f6r\u00f0un
  s\u00f3ttvarnal\u00e6knis kynnt stefnanda og bo\u00f0a\u00f0 a\u00f0 h\u00fan yr\u00f0i
  borin undir d\u00f3m s\u00ed\u00f0ar sama dag. \u00cd \u00e1kv\u00f6r\u00f0uninni
  kom me\u00f0al annars fram a\u00f0 P\u00f3lland v\u00e6ri \u00e1 lista yfir sv\u00e6\u00f0i
  \u00fear sem 14 daga n\u00fdgengi smita \u00e1 hverja 100.000 \u00edb\u00faa v\u00e6ri
  yfir 500 e\u00f0a fulln\u00e6gjandi uppl\u00fdsingar l\u00e6gju ekki fyrir. \u00dev\u00ed
  v\u00e6ri stefnanda skylt a\u00f0 hl\u00edta \u00e1kv\u00e6\u00f0i 5. gr. regluger\u00f0ar
  nr. 355/2021. \u00dea\u00f0 v\u00e6ri \u00fev\u00ed \u00e1kv\u00f6r\u00f0un s\u00f3ttvarnal\u00e6knis
  a\u00f0 stefnandi skyldi dvelja \u00ed s\u00f3ttvarnah\u00fasi, sbr. 1. mgr. 5.
  gr. regluger\u00f0arinnar, \u00fear til ni\u00f0ursta\u00f0a s\u00ed\u00f0ari s\u00fdnat\u00f6ku
  reyndist neikv\u00e6\u00f0, sbr. 2. mgr. 4. gr. regluger\u00f0arinnar, e\u00f0a
  eftir atvikum \u00fear til einangrun hef\u00f0i veri\u00f0 afl\u00e9tt reyndist
  stefnandi vera me\u00f0 COVID-19. Loks segir \u00ed \u00e1kv\u00f6r\u00f0uninni
  a\u00f0 \u00fear sem lj\u00f3st \u00feyki a\u00f0 stefnandi uni ekki \u00e1kv\u00f6r\u00f0un
  s\u00f3ttvarnal\u00e6knis ver\u00f0i h\u00fan borin undir h\u00e9ra\u00f0sd\u00f3m
  \u00ed samr\u00e6mi vi\u00f0 15. gr. s\u00f3ttvarnalaga nr. 19/1997.\\n\\nHinn 5.
  apr\u00edl 2021 kva\u00f0 H\u00e9ra\u00f0sd\u00f3mur Reykjav\u00edkur upp \u00farskur\u00f0
  \u00ed m\u00e1lum annarra einstaklinga \u00ed svipa\u00f0ri st\u00f6\u00f0u og stefnandi,
  \u00fe.e. f\u00f3lks sem \u00e1tti l\u00f6gheimili \u00e1 \u00cdslandi en var eigi
  a\u00f0 s\u00ed\u00f0ur gert a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi. \u00dear
  \u00e1 me\u00f0al var \u00farskur\u00f0ur \u00ed m\u00e1li nr. R-18982021. \u00dear
  m\u00f3tm\u00e6lti einstaklingur dv\u00f6l \u00ed s\u00f3ttvarnah\u00fasi, enda
  \u00fe\u00f3tt enginn \u00e1greiningur hef\u00f0i r\u00edkt um \u00fea\u00f0 a\u00f0
  honum hef\u00f0i samkv\u00e6mt l\u00f6gum bori\u00f0 a\u00f0 s\u00e6ta s\u00f3ttkv\u00ed.
  \u00cd ni\u00f0urst\u00f6\u00f0u h\u00e9ra\u00f0sd\u00f3ms var viki\u00f0 a\u00f0
  skilgreiningu hugtaksins s\u00f3ttvarnah\u00fas \u00ed l\u00f6gum nr. 19/1997, eins
  og \u00feeim haf\u00f0i veri\u00f0 breytt me\u00f0 l\u00f6gum nr. 2/2021. Lag\u00f0i
  d\u00f3murinn \u00e1herslu \u00e1 a\u00f0 \u00ed \u00feeirri skilgreiningu f\u00e6list
  a\u00f0 hugtaki\u00f0 t\u00e6ki til dvalar einstaklinga sem ekki \u00e6ttu samasta\u00f0
  h\u00e9r \u00e1 landi e\u00f0a g\u00e6tu af \u00f6\u00f0rum s\u00f6kum ekki e\u00f0a
  vildu ekki einangra sig \u00ed h\u00fasn\u00e6\u00f0i \u00e1 eigin vegum. \u00dear
  sem a\u00f0ili \u00feess m\u00e1ls hef\u00f0i \u00e1tt l\u00f6gheimili h\u00e9r
  \u00e1 landi og vildi s\u00e6ta s\u00f3ttkv\u00ed \u00e1 heimili s\u00ednu g\u00e6ti
  framangreind skilgreining ekki teki\u00f0 til hans. \u00de\u00e1 var reki\u00f0
  \u00ed d\u00f3minum a\u00f0 \u00fe\u00f3tt s\u00fa frelsissker\u00f0ing sem f\u00e6list
  \u00ed dv\u00f6l \u00ed s\u00f3ttvarnah\u00fasi v\u00e6ri a\u00f0 vissu leyti samb\u00e6rileg
  \u00feeirri sem f\u00e6list \u00ed heimas\u00f3ttkv\u00ed yr\u00f0i af \u00fdmsum
  \u00e1st\u00e6\u00f0um a\u00f0 telja dv\u00f6l \u00fear \u00feungb\u00e6rari en
  dv\u00f6l \u00ed heimah\u00fasi. Me\u00f0 hli\u00f0sj\u00f3n af kr\u00f6fum um me\u00f0alh\u00f3f
  og jafnr\u00e6\u00f0i hef\u00f0i \u00fev\u00ed veri\u00f0 br\u00fdnt a\u00f0 sk\u00fdr
  heimild st\u00e6\u00f0i til \u00feeirrar r\u00e1\u00f0st\u00f6funar sem s\u00f3ttvarnal\u00e6knir
  hef\u00f0i gripi\u00f0 til. Aftur \u00e1 m\u00f3ti hef\u00f0i skort lagasto\u00f0
  fyrir \u00fev\u00ed a\u00f0 1. mgr. 5. gr. regluger\u00f0ar nr. 355/2021, sem var\u00f0a\u00f0i
  skyldu fer\u00f0amanns til a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi \u00ed
  s\u00f3ttkv\u00ed, yr\u00f0i beitt sem grundvelli hinnar um\u00fer\u00e6ttu \u00e1kv\u00f6r\u00f0unar
  gagnvart einstaklingi sem l\u00f6gheimili \u00e6tti h\u00e9r \u00e1 landi og kysi
  fremur a\u00f0 s\u00e6ta s\u00f3ttkv\u00ed \u00e1 heimili s\u00ednu. Var \u00e1kv\u00f6r\u00f0unin
  \u00fev\u00ed felld \u00far gildi.\\n\\nMe\u00f0 v\u00edsan til \u00feessa \u00farskur\u00f0ar
  og annarra \u00farskur\u00f0a fr\u00e1 sama degi \u00ed samb\u00e6rilegum m\u00e1lum
  \u00e1kva\u00f0 s\u00f3ttvarnal\u00e6knir a\u00f0 afturkalla \u00e1kv\u00f6r\u00f0un
  s\u00edna \u00ed m\u00e1li stefnanda \u00e1 grundvelli 25. gr. stj\u00f3rns\u00fdslulaga
  nr. 37/1993. Var l\u00f6gmanni stefnanda tilkynnt um \u00feetta me\u00f0 t\u00f6lvubr\u00e9fi
  kl. 21:23 hinn 5. apr\u00edl 2021. Var m\u00e1l stefnanda \u00fev\u00ed \u00ed reynd
  ekki bori\u00f0 undir h\u00e9ra\u00f0sd\u00f3m. \u00cd kj\u00f6lfari\u00f0 \u00e1tti
  stefnandi \u00feess kost a\u00f0 lj\u00faka s\u00f3ttkv\u00ed \u00ed heimah\u00fasi,
  en h\u00fan er, eins og \u00e1\u00f0ur, segir b\u00fasett h\u00e9r \u00e1 landi.\\n\\nMe\u00f0
  br\u00e9fi, dags. 19. apr\u00edl 2021, kraf\u00f0ist stefnandi b\u00f3ta \u00far
  hendi stefnda vegna frelsissviptingar fr\u00e1 2. apr\u00edl 2021 til 4. sama m\u00e1na\u00f0ar.
  Annars vegar var um a\u00f0 r\u00e6\u00f0a kr\u00f6fu um miskab\u00e6tur a\u00f0
  fj\u00e1rh\u00e6\u00f0 1.000.000 kr\u00f3na en hins vegar kr\u00f6fu um grei\u00f0slu
  l\u00f6gmannskostna\u00f0ar a\u00f0 fj\u00e1rh\u00e6\u00f0 185.380. kr\u00f3nur.\\n\\nMe\u00f0
  br\u00e9fi stefnda, dags. 20. \u00e1g\u00fast 2021, var kr\u00f6fu stefnanda hafna\u00f0
  en teki\u00f0 fram a\u00f0 til a\u00f0 ey\u00f0a hugsanlegri r\u00e9ttar\u00f3vissu
  v\u00e6ri unnt a\u00f0 fallast \u00e1 a\u00f0 lj\u00faka m\u00e1linu me\u00f0 s\u00e1tt
  \u00e1 \u00feann veg a\u00f0 stefnanda yr\u00f0u greiddar 30.000 kr\u00f3nur \u00ed
  miskab\u00e6tur, \u00fe.e. \u00edgildi 15.000 kr\u00f3na fyrir hvorn s\u00f3larhring
  sem mi\u00f0a\u00f0 v\u00e6ri vi\u00f0 \u00ed br\u00e9fi stefnanda a\u00f0 v\u00e6ri
  t\u00edmabil frelsissviptingar. \u00de\u00e1 v\u00e6ri fallist \u00e1 a\u00f0 grei\u00f0a
  stefnanda 85.000 kr\u00f3nur \u00ed m\u00e1lskostna\u00f0.\\n\\nStefnandi t\u00f3k
  \u00ed kj\u00f6lfari\u00f0 vi\u00f0 grei\u00f0slu framangreindra b\u00f3ta, \u00fe.e.
  30.000 kr\u00f3num \u00ed miskab\u00e6tur og 85.000 kr\u00f3num \u00ed m\u00e1lskostna\u00f0
  a\u00f0 me\u00f0t\u00f6ldum vir\u00f0isaukaskatti, me\u00f0 fyrirvara, sbr. b\u00f3tauppgj\u00f6r,
  dags. 8. september 2021. \u00cd upphafi \u00feess skjals kemur fram a\u00f0 \u00fea\u00f0
  taki til b\u00f3ta vegna dvalar \u00e1 t\u00edmabilinu 2. apr\u00edl 2021 til 4.
  sama m\u00e1na\u00f0ar.\\n\\nStefnandi h\u00f6f\u00f0ar m\u00e1l \u00feetta \u00fear
  sem h\u00fan telur tj\u00f3n sitt ekki fullb\u00e6tt me\u00f0 \u00feeirri b\u00f3tafj\u00e1rh\u00e6\u00f0
  sem h\u00fan hefur \u00feegar m\u00f3tteki\u00f0.\\n\\nVi\u00f0 a\u00f0alme\u00f0fer\u00f0
  m\u00e1lsins gaf sk\u00fdrslu fyrir d\u00f3mi Gylfi \u00de\u00f3r \u00deorsteinsson,
  en hann var forst\u00f6\u00f0uma\u00f0ur s\u00f3ttvarnah\u00fassins sem stefnandi
  dvaldist \u00ed \u00e1 umr\u00e6ddum t\u00edma.\\n\\nII\\n\\nStefnandi byggir d\u00f3mkr\u00f6fu
  s\u00edna \u00e1 \u00fev\u00ed a\u00f0 stefndi hafi svipt hana frelsi s\u00ednu
  og \u00fev\u00ed beri stefnda a\u00f0 grei\u00f0a henni miskab\u00e6tur, sbr. 4.
  mgr. 15. gr. b laga nr. 19/1997 me\u00f0 s\u00ed\u00f0ari breytingum, sbr. 13. gr.
  breytingarlaga nr. 2/2021, almennar reglur ska\u00f0ab\u00f3tar\u00e9ttar og \u00e1kv\u00e6\u00f0i
  VII. kafla stj\u00f3rnarskr\u00e1r l\u00fd\u00f0veldisins \u00cdslands nr. 33/1944
  me\u00f0 s\u00ed\u00f0ari breytingum, einkum 4. mgr. 66 gr., 1. mgr. og 5. mgr.
  67. gr. og \u00e1kv\u00e6\u00f0i mannr\u00e9ttindas\u00e1ttm\u00e1la Evr\u00f3pu
  sama efnis. Einnig s\u00e9 byggt \u00e1 b-li\u00f0 1. mgr. 26. gr. ska\u00f0ab\u00f3talaga
  nr. 50/1993.\\n\\nFyrir liggi a\u00f0 broti\u00f0 hafi veri\u00f0 \u00e1 r\u00e9ttindum
  stefnanda, sbr. einnig \u00farskur\u00f0 H\u00e9ra\u00f0sd\u00f3ms Reykjav\u00edkur
  \u00ed m\u00e1li nr. R-1898/2021.\\n\\nStefnandi byggi einnig \u00e1 \u00fev\u00ed
  a\u00f0 h\u00fan hafi veri\u00f0 rei\u00f0ub\u00fain til \u00feess a\u00f0 dvelja
  \u00ed heimas\u00f3ttkv\u00ed og hafi gert r\u00e1\u00f0stafanir til \u00feess,
  sbr. \u00e1kv\u00e6\u00f0i \u00fe\u00e1gildandi regluger\u00f0ar nr. 355/2021. \u00deess
  \u00ed sta\u00f0 hafi h\u00fan veri\u00f0 vistu\u00f0 \u00e1 litlu h\u00f3telherbergi,
  \u00fear sem m\u00f6guleikar hennar til \u00feess a\u00f0 komast undir bert loft
  hafi veri\u00f0 verulega takmarka\u00f0ir. \u00de\u00e1 hafi henni veri\u00f0 meina\u00f0
  a\u00f0 fara \u00ed g\u00f6ngufer\u00f0 s\u00e9r til heilsub\u00f3tar \u00fer\u00e1tt
  fyrir a\u00f0 \u00fea\u00f0 hafi sta\u00f0i\u00f0 \u00f6\u00f0rum til bo\u00f0a.
  Enn fremur hafi h\u00fan fengi\u00f0 takmarka\u00f0ar uppl\u00fdsingar um \u00fea\u00f0
  hvernig tilh\u00f6gun s\u00f3ttkv\u00edarinnar yr\u00f0i, eins og \u00e1skili\u00f0
  s\u00e9 \u00ed l\u00f6gum um s\u00f3ttvarnir. \u00deannig hafi ekki veri\u00f0 lj\u00f3st
  hvernig h\u00fan g\u00e6ti matast e\u00f0a yfirgefi\u00f0 h\u00f3telherbergi\u00f0
  til a\u00f0 fara \u00ed g\u00f6ngufer\u00f0ir og henni ekki gert lj\u00f3st hven\u00e6r
  og klukkan hva\u00f0 henni yr\u00f0i frj\u00e1lst a\u00f0 yfirgefa s\u00f3ttvarnah\u00fasi\u00f0.
  \u00cd \u00feessari framkv\u00e6md hafi falist \u00f3mann\u00fa\u00f0leg og vanvir\u00f0andi
  me\u00f0fer\u00f0 en sl\u00edkt s\u00e9 brot \u00e1 1. mgr. 68. gr stj\u00f3rnarskr\u00e1rinnar,
  sbr. einnig 3. gr. laga um mannr\u00e9ttindas\u00e1ttm\u00e1la Evr\u00f3pu nr. 62/1994.\\n\\nFr\u00e1
  upphafi hafi veri\u00f0 lj\u00f3st a\u00f0 stefnandi hafi veri\u00f0 rei\u00f0ub\u00fain
  til a\u00f0 vera \u00ed heimas\u00f3ttkv\u00ed. \u00dev\u00ed hafi ekki veri\u00f0
  tilefni til a\u00f0 skylda hana til a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi
  og alls ekki lagasto\u00f0 fyrir sl\u00edkri kv\u00f6\u00f0, eins og fyrrgreindur
  \u00farskur\u00f0ur H\u00e9ra\u00f0sd\u00f3ms Reykjav\u00edkur beri me\u00f0 s\u00e9r.
  E\u00f0lilegt s\u00e9 a\u00f0 fj\u00e1rh\u00e6\u00f0 miskab\u00f3ta til handa stefnanda
  taki mi\u00f0 af \u00fev\u00ed a\u00f0 h\u00fan hafi s\u00e9r ekkert til sakar unni\u00f0
  og a\u00f0 stj\u00f3rnvalds\u00e1kv\u00f6r\u00f0un s\u00fa er svipti hana frelsi
  hafi ekki veri\u00f0 \u00ed samr\u00e6mi vi\u00f0 meginreglu stj\u00f3rns\u00fdslur\u00e9ttarins
  um me\u00f0alh\u00f3f. \u00de\u00e1 s\u00e9 einnig lj\u00f3st a\u00f0 s\u00fa \u00e1kv\u00f6r\u00f0un
  a\u00f0 svipta stefnanda frelsi hafi veri\u00f0 algj\u00f6rlega \u00e1n nokkurrar
  lagasto\u00f0ar. Loks skuli \u00feess geti\u00f0, a\u00f0 stefnandi hafi aldrei
  veri\u00f0 uppl\u00fdst um tilefni, fyrirkomulag e\u00f0a lengd frelsissviptingarinnar
  \u00e1 tungum\u00e1li sem h\u00fan skildi. \u00deetta auki \u00e1 alvarleika brotsins
  gegn stefnanda.\\n\\nStefnandi hafni alfari\u00f0 \u00feeim skilningi stefnda a\u00f0
  st\u00f3rkostlegt g\u00e1leysi s\u00e9 \u00e1skili\u00f0 \u00ed 4. mgr. 15. gr.
  b laga nr. 19/1997. S\u00fa t\u00falkun stefnda f\u00e1i hvorki sto\u00f0 \u00ed
  or\u00f0alagi \u00e1kv\u00e6\u00f0isins n\u00e9 l\u00f6gsk\u00fdringarg\u00f6gnum.\\n\\nLj\u00f3st
  s\u00e9 a\u00f0 stefnandi hafi veri\u00f0 svipt frelsi s\u00ednu og henni gert a\u00f0
  dveljast \u00ed loku\u00f0u r\u00fdmi \u00e1n \u00feess a\u00f0 henni v\u00e6ri
  ger\u00f0 grein fyrir \u00fev\u00ed a\u00f0 h\u00fan \u00e6tti r\u00e9tt \u00e1
  l\u00f6gfr\u00e6\u00f0ia\u00f0sto\u00f0 og heimtingu \u00e1 \u00fev\u00ed a\u00f0
  bera m\u00e1li\u00f0 undir d\u00f3mst\u00f3la, \u00e1 tungum\u00e1li sem h\u00fan
  tali og skilji, sbr. 6. gr. mannr\u00e9ttindas\u00e1ttm\u00e1la Evr\u00f3pu og 1.
  mgr. 70. gr. stj\u00f3rnarskr\u00e1rinnar. \u00dev\u00ed s\u00e9 yfir vafa hafi\u00f0
  a\u00f0 \u00e1kv\u00e6\u00f0i b-li\u00f0ar 1. mgr. 26. gr. laga nr. 50/1993 eigi
  vi\u00f0 \u00ed m\u00e1li stefnanda.\\n\\nStefnandi fari fram \u00e1 miskab\u00e6tur
  a\u00f0 fj\u00e1rh\u00e6\u00f0 1.000.000 kr\u00f3nur sem samsvari 500.000 kr\u00f3num
  fyrir hvorn s\u00f3larhring sem stefnandi hafi veri\u00f0 svipt frelsi s\u00ednu
  \u00e1n lagaheimildar e\u00f0a 20.833 kr\u00f3nur fyrir hverja klukkustund.\\n\\nIII\\n\\nStefndi
  fellst \u00e1 a\u00f0 skilyr\u00f0i 4. mgr. 15. gr. b laga nr. 19/1997 kunni a\u00f0
  vera uppfyllt \u00ed m\u00e1linu en hafnar \u00fev\u00ed alfari\u00f0 a\u00f0 skilyr\u00f0i
  b-li\u00f0ar 1. mgr. 26. gr. laga nr. 50/1993 s\u00e9u fyrir hendi. Stefndi kve\u00f0st
  hins vegar \u00ed flj\u00f3tu brag\u00f0i ekki f\u00e1 s\u00e9\u00f0 a\u00f0 stefnandi
  hafi hloti\u00f0 miskatj\u00f3n, a.m.k. ekki umfram \u00fe\u00e6r miskab\u00e6tur
  sem henni hafi \u00feegar veri\u00f0 greiddar.\\n\\nStefndi bendir \u00e1 a\u00f0
  \u00ed 5. mgr. 14. gr. laga nr. 19/1997 s\u00e9 gert r\u00e1\u00f0 fyrir \u00fev\u00ed
  a\u00f0 ef ekki n\u00e1ist samstarf vi\u00f0 a\u00f0ila m\u00e1ls um a\u00f0 fylgja
  reglum um s\u00f3ttkv\u00ed taki s\u00f3ttvarnarl\u00e6knir stj\u00f3rnvalds\u00e1kv\u00f6r\u00f0un.
  Ef sl\u00edkt samstarf n\u00e6st hins vegar teljist \u00fea\u00f0 ekki stj\u00f3rnvalds\u00e1kv\u00f6r\u00f0un.
  Stefnandi hafi komi\u00f0 til landsins 2. apr\u00edl 2021 en me\u00f0 t\u00f6lvup\u00f3sti
  l\u00f6gmanns hennar 4. apr\u00edl 2021 hafi h\u00fan fari\u00f0 \u00feess \u00e1
  leit a\u00f0 ver\u00f0a birt \u00e1kv\u00f6r\u00f0un s\u00f3ttvarnal\u00e6knis um
  dv\u00f6l \u00ed s\u00f3ttvarnah\u00fasi. Fulltr\u00fai s\u00f3ttvarnal\u00e6knis
  hafi birt l\u00f6gmanni stefnanda \u00e1kv\u00f6r\u00f0unina me\u00f0 t\u00f6lvup\u00f3sti
  daginn eftir \u00fear sem veittar hafi veri\u00f0 lei\u00f0beiningar um r\u00e9tt
  hennar til a\u00f0 bera \u00e1kv\u00f6r\u00f0unina undir h\u00e9ra\u00f0sd\u00f3m,
  sbr. 2. mgr. 15. gr. laga nr. 19/1997. Ekki hafi komi\u00f0 til \u00feess a\u00f0
  s\u00f3ttvarnal\u00e6knir sendi kr\u00f6fur til h\u00e9ra\u00f0sd\u00f3ms eins og
  bo\u00f0a\u00f0 hef\u00f0i veri\u00f0 en ef \u00fea\u00f0 hef\u00f0i veri\u00f0
  gert hef\u00f0i d\u00f3mara \u00ed samr\u00e6mi vi\u00f0 9. mgr. 15. gr. laganna
  bori\u00f0 a\u00f0 skipa stefnanda talsmann. Ekkert liggi fyrir um a\u00f0 \u00fea\u00f0
  hafi veri\u00f0 gert og hafni stefndi m\u00e1latilb\u00fana\u00f0i stefnanda um
  a\u00f0 m\u00e1lsme\u00f0fer\u00f0arreglur laga hafi veri\u00f0 brotnar gagnvart
  henni \u00ed a\u00f0draganda \u00feess a\u00f0 henni hafi veri\u00f0 birt stj\u00f3rnvalds\u00e1kv\u00f6r\u00f0unin
  um dv\u00f6l \u00ed s\u00f3ttkv\u00ed 5. apr\u00edl 2021.\\n\\nHvort sem b\u00f3ta\u00e1byrg\u00f0
  ver\u00f0i reist \u00e1 sakargrundvelli e\u00f0a hlutl\u00e6gri \u00e1byrg\u00f0
  \u00feurfi a\u00f0 vera fulln\u00e6gt \u00feeim frumskilyr\u00f0um ska\u00f0ab\u00f3ta\u00e1byrg\u00f0ar
  a\u00f0 stefnandi hafi or\u00f0i\u00f0 fyrir tj\u00f3ni/miska auk \u00feess sem
  orsakatengsl \u00feurfi a\u00f0 vera \u00e1 milli \u00feess og \u00feeirra atvika
  sem vi\u00f0komandi b\u00f3tareglu s\u00e9 \u00e6tla\u00f0 a\u00f0 taka til. \u00cd
  samr\u00e6mi vi\u00f0 almennar reglur ska\u00f0ab\u00f3tar\u00e9ttur hv\u00edli
  s\u00f6nnunarbyr\u00f0i um \u00feessi atri\u00f0i venjulega \u00e1 tj\u00f3n\u00feola.\\n\\nEngin
  vottor\u00f0 s\u00e9rfr\u00e6\u00f0inga e\u00f0a \u00f6nnur g\u00f6gn hafi veri\u00f0
  l\u00f6g\u00f0 fram \u00ed m\u00e1linu um \u00e6tla\u00f0 miskatj\u00f3n til a\u00f0
  undirbyggja b\u00f3takr\u00f6fu stefnanda og ekki ver\u00f0i heldur s\u00e9\u00f0
  a\u00f0 h\u00fan hafi veri\u00f0 verr sett en a\u00f0rir sem dvali\u00f0 hafi \u00e1
  s\u00f3ttvarnah\u00f3telinu \u00ed umr\u00e6tt sinn, svo sem hva\u00f0 a\u00f0b\u00fana\u00f0
  snerti. Stefndi hafi auk \u00feess nokkrar efasemdir um a\u00f0 skortur \u00e1 vi\u00f0hl\u00edtandi
  lagasto\u00f0 hafi eitt og s\u00e9r veri\u00f0 til \u00feess falli\u00f0 a\u00f0
  baka stefnanda miska me\u00f0 hli\u00f0sj\u00f3n af st\u00f6\u00f0u faraldursins
  \u00e1 \u00feessum t\u00edma og \u00feeim markmi\u00f0um sem l\u00e1gu til grundvallar
  a\u00f0ger\u00f0um s\u00f3ttvarnaryfirvalda og \u00e6tla\u00f0 hafi veri\u00f0 a\u00f0
  vernda l\u00edf og heilsu f\u00f3lks.\\n\\nAf fyrrgreindum \u00farskur\u00f0i h\u00e9ra\u00f0sd\u00f3ms
  og \u00f6\u00f0rum \u00farskur\u00f0um sem f\u00e9llu sama dag, sbr. m\u00e1l nr.
  R-1897/2021 til og me\u00f0 R-1903/2021, ver\u00f0i hvorki s\u00e9\u00f0 a\u00f0
  s\u00fa frelsissvipting sem f\u00f3lst \u00ed s\u00f3ttkv\u00ed stefnanda eftir
  komu hinga\u00f0 til lands hafi ekki \u00e1tt s\u00e9r sto\u00f0 \u00ed l\u00f6gum
  n\u00e9 a\u00f0 h\u00e9ra\u00f0sd\u00f3mur hafi tali\u00f0 frelsissviptinguna \u00ed
  e\u00f0li s\u00ednu \u00f3l\u00f6gm\u00e6ta. \u00devert \u00e1 m\u00f3ti komi fram
  \u00ed \u00farskur\u00f0inum a\u00f0 hafi\u00f0 s\u00e9 yfir vafa a\u00f0 stj\u00f3rnv\u00f6ld
  hafi haft br\u00fdnt tilefni til a\u00f0 gr\u00edpa til s\u00f3ttvarnar\u00e1\u00f0stafana
  og a\u00f0 \u00e1 a\u00f0ilum hafi hv\u00edlt lagaskylda um a\u00f0 s\u00e6ta s\u00f3ttkv\u00ed.
  Hafi \u00e1greiningur \u00ed m\u00e1lunum \u00feannig einungis var\u00f0a\u00f0
  \u00fea\u00f0 hvort a\u00f0ilum v\u00e6ri skylt a\u00f0 dvelja \u00ed s\u00f3ttkv\u00ed
  \u00e1 tilteknum sta\u00f0 sem stj\u00f3rnv\u00f6ld hef\u00f0u \u00e1kve\u00f0i\u00f0,
  \u00fe.e. \u00ed s\u00f3ttvarnah\u00fasi. \u00de\u00f3tt ni\u00f0ursta\u00f0a h\u00e9ra\u00f0sd\u00f3ms
  hafi or\u00f0i\u00f0 s\u00fa a\u00f0 \u00e1kv\u00e6\u00f0i \u00feess efnis \u00ed
  regluger\u00f0 nr. 355/2021 hafi ekki \u00e1tt s\u00e9r sto\u00f0 \u00ed s\u00f3ttvarnal\u00f6gum
  hafi a\u00f0ilum \u00feeirra m\u00e1la, \u00e1 grundvelli \u00feeirra laga, eftir
  sem \u00e1\u00f0ur bori\u00f0 a\u00f0 dvelja \u00ed s\u00f3ttkv\u00ed \u00e1 \u00f6\u00f0rum
  sta\u00f0. \u00dear hafi \u00feeim bori\u00f0 a\u00f0 l\u00fata samb\u00e6rilegum
  reglum a\u00f0 \u00fev\u00ed er var\u00f0a\u00f0i takm\u00f6rkun \u00e1 athafnafrelsi
  og \u00feeir sem dv\u00f6ldu \u00ed s\u00f3ttkv\u00ed \u00ed s\u00f3ttvarnah\u00fasi
  \u00feurftu a\u00f0 s\u00e6ta. S\u00e9u vi\u00f0url\u00f6g vi\u00f0 brotum \u00e1
  s\u00f3ttkv\u00ed jafnframt \u00feau s\u00f6mu, \u00f3h\u00e1\u00f0 \u00fev\u00ed
  hvar s\u00f3ttkv\u00ed fari fram. Me\u00f0 engu m\u00f3ti s\u00e9 h\u00e6gt a\u00f0
  jafna a\u00f0st\u00e6\u00f0um stefnanda til a\u00f0st\u00e6\u00f0na \u00feeirra
  sem sviptir hafa veri\u00f0 frelsi s\u00ednu a\u00f0 \u00f3sekju \u00e1 grundvelli
  g\u00e6sluvar\u00f0halds e\u00f0a nau\u00f0ungarvistunar \u00e1 sj\u00fakrah\u00fasi
  en sl\u00edkar frelsissker\u00f0ingar feli a\u00f0 mati stefnda \u00ed s\u00e9r
  miklu vi\u00f0ameira inngrip og vegi me\u00f0 allt \u00f6\u00f0rum h\u00e6tti a\u00f0
  pers\u00f3nu og \u00e6ru vi\u00f0komandi.\\n\\nA\u00f0b\u00fana\u00f0ur a\u00f0ila
  \u00ed s\u00f3ttvarnah\u00fasi hafi veri\u00f0 fulln\u00e6gjandi og \u00e6tla\u00f0ur
  miski stefnanda kunni \u00fe\u00e1 \u00f6\u00f0ru fremur a\u00f0 stafa af takm\u00f6rkun
  \u00e1 a\u00f0gengi a\u00f0 r\u00fdmi og pers\u00f3nulegum munum \u00e1 me\u00f0an
  dv\u00f6l st\u00f3\u00f0 en ekki eiginlegri s\u00f3ttkv\u00ed, sem stefnandi hef\u00f0i
  \u00ed \u00f6llu falli \u00feurft a\u00f0 s\u00e6ta. Kr\u00f6fur stefnanda s\u00e9u
  \u00ed \u00feessu lj\u00f3si langt umfram \u00feann miska sem stefnandi kunni a\u00f0
  hafa or\u00f0i\u00f0 fyrir vegna dvalar \u00ed s\u00f3ttvarnah\u00fasi \u00ed sta\u00f0
  heimilis.\\n\\n\u00c1 stj\u00f3rnv\u00f6ldum hv\u00edli frumkv\u00e6\u00f0isskylda
  a\u00f0 stj\u00f3rnl\u00f6gum til a\u00f0 breg\u00f0ast vi\u00f0 til verndar l\u00edfi
  og heilsu f\u00f3lks ef lj\u00f3st s\u00e9 a\u00f0 bein og fyrirsj\u00e1anleg \u00f3gn
  ste\u00f0ji a\u00f0 \u00fev\u00ed. \u00cd \u00feessu felist almannahagsmunir sem
  falli undir \u00fe\u00e6r undan\u00fe\u00e1gur sem me\u00f0al annars s\u00e9 kve\u00f0i\u00f0
  \u00e1 um \u00ed 4. mgr. 66. gr., 1. mgr. 67. gr. og 71. gr. stj\u00f3rnarskr\u00e1rinnar.\\n\\nIV\\n\\n\u00c1greiningslaust
  er a\u00f0 stefnanda var gert a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi fr\u00e1
  2. apr\u00edl 2021 til 5. sama m\u00e1na\u00f0ar, en \u00ed tengslum vi\u00f0 \u00fe\u00e1
  dv\u00f6l krefst stefnandi miskab\u00f3ta \u00far hendi stefnda. H\u00fan mi\u00f0ar
  b\u00f3takr\u00f6funa \u00fe\u00f3 a\u00f0eins vi\u00f0 frelsissviptingu \u00ed
  tvo s\u00f3larhringa. Stefndi hefur, eins og \u00e1\u00f0ur segir, greitt stefnanda
  miskab\u00e6tur fyrir \u00fea\u00f0 t\u00edmabil a\u00f0 fj\u00e1rh\u00e6\u00f0
  30.000 kr\u00f3nur, en stefnandi telur tj\u00f3n sitt ekki b\u00e6tt a\u00f0 fullu
  me\u00f0 \u00feeirri grei\u00f0slu, sem m\u00f3ttekin var me\u00f0 fyrirvara af
  hennar h\u00e1lfu.\\n\\n\u00cd 4. mgr. 15. gr. b laga nr. 19/1997 segir me\u00f0al
  annars a\u00f0 d\u00e6ma skuli b\u00e6tur \u00far r\u00edkissj\u00f3\u00f0i hafi
  einstaklingur veri\u00f0 sviptur frelsi me\u00f0 \u00e1kv\u00f6r\u00f0un s\u00f3ttvarnal\u00e6knis
  ef l\u00f6gm\u00e6lt skilyr\u00f0i hefur brosti\u00f0 til sl\u00edkrar \u00e1kv\u00f6r\u00f0unar.
  B\u00e6ta skuli fj\u00e1rtj\u00f3n og miska ef \u00fev\u00ed er a\u00f0 skipta.
  A\u00f0 \u00f6\u00f0ru leyti gildi almennar reglur ska\u00f0ab\u00f3tar\u00e9ttar.\\n\\nVi\u00f0
  a\u00f0alme\u00f0fer\u00f0 m\u00e1lsins sta\u00f0festi l\u00f6gma\u00f0ur stefnda
  a\u00f0spur\u00f0ur a\u00f0 stefndi vefengir ekki a\u00f0 \u00e1kv\u00f6r\u00f0un
  s\u00f3ttvarnal\u00e6knis um dv\u00f6l stefnanda hafi skort lagasto\u00f0. \u00deegar
  af \u00feeirri \u00e1st\u00e6\u00f0u voru ekki uppfyllt skilyr\u00f0i fyrir \u00fev\u00ed
  a\u00f0 stefnanda yr\u00f0i gert a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi,
  hva\u00f0 sem l\u00ed\u00f0ur r\u00f6ksemdum stefnda um m\u00e1lefnaleg sj\u00f3narmi\u00f0
  a\u00f0 baki sl\u00edkri dv\u00f6l.\\n\\nEkki er unnt a\u00f0 fallast \u00e1 \u00fea\u00f0
  me\u00f0 stefnanda a\u00f0 h\u00fan hafi s\u00e6tt \u00f3mann\u00fa\u00f0legri e\u00f0a
  vanvir\u00f0andi me\u00f0fer\u00f0, enda er sl\u00edkt me\u00f0 \u00f6llu \u00f3sanna\u00f0.
  \u00dear sem lagasto\u00f0 skorti fyrir \u00e1kv\u00f6r\u00f0un um dv\u00f6l stefnanda
  \u00ed s\u00f3ttvarnah\u00fasi \u00e1 h\u00fan aftur \u00e1 m\u00f3ti r\u00e9tt
  \u00e1 b\u00f3tum fyrir miska vegna \u00feeirrar frelsissker\u00f0ingar sem h\u00fan
  s\u00e6tti umr\u00e6dda tvo s\u00f3larhringa, sbr. fyrrgreinda s\u00e9rreglu 4.
  mgr. 15. gr. b laga nr. 19/1997. Ekki er til a\u00f0 dreifa s\u00e9rst\u00f6kum
  g\u00f6gnum sem varpa n\u00e1nara lj\u00f3si \u00e1 \u00feann miska og ver\u00f0a
  b\u00e6tur \u00e1kve\u00f0nar a\u00f0 \u00e1litum. Vi\u00f0 \u00fea\u00f0 mat ver\u00f0ur
  hli\u00f0sj\u00f3n h\u00f6f\u00f0 af \u00feeirri sta\u00f0reynd a\u00f0 \u00e1greiningslaust
  er a\u00f0 stefnanda hef\u00f0i \u00ed \u00f6llu falli bori\u00f0 a\u00f0 s\u00e6ta
  heimas\u00f3ttkv\u00ed b\u00f3talaust \u00e1 sama t\u00edmabili ef henni hef\u00f0i
  ekki veri\u00f0 gert a\u00f0 dvelja \u00ed s\u00f3ttvarnah\u00fasi. Ekki er \u00fe\u00f3
  unnt a\u00f0 fallast \u00e1 \u00fea\u00f0 me\u00f0 stefnda a\u00f0 dv\u00f6l \u00ed
  s\u00f3ttvarnah\u00fasi teljist ekki frelsissvipting umfram \u00fea\u00f0 sem f\u00e6list
  \u00ed s\u00f3ttkv\u00ed \u00ed heimah\u00fasi.\\n\\nA\u00f0 \u00f6llu framangreindu
  virtu \u00feykja miskab\u00e6tur til stefnanda h\u00e6filega \u00e1kvar\u00f0a\u00f0ar
  60.000 kr\u00f3nur, sbr. varakr\u00f6fu stefnanda, enda \u00feykir a\u00f0alkrafa
  hennar \u00far h\u00f3fi fram.\\n\\nStefnandi krefst, eins og \u00e1\u00f0ur segir,
  vaxta samkv\u00e6mt 8. gr. laga nr. 38/2001 fr\u00e1 2. apr\u00edl 2021 til 19.
  ma\u00ed 2021, en dr\u00e1ttarvaxta samkv\u00e6mt 1. mgr. 6. gr. s\u00f6mu laga
  fr\u00e1 \u00feeim degi til grei\u00f0sludags. Fallast m\u00e1 \u00e1 \u00fea\u00f0
  me\u00f0 stefnanda a\u00f0 krafa hennar beri vexti samkv\u00e6mt 1. mgr. 8. gr.
  laga nr. 38/2001 fr\u00e1 2. apr\u00edl 2021, enda hefur stefndi ekki bori\u00f0
  fyrir sig m\u00e1ls\u00e1st\u00e6\u00f0ur sem leitt g\u00e6tu til \u00feess a\u00f0
  anna\u00f0 t\u00edmamark yr\u00f0i h\u00e9r lagt til grundvallar. Samkv\u00e6mt
  9. gr. laga nr. 38/2001 skulu ska\u00f0ab\u00f3takr\u00f6fur bera dr\u00e1ttarvexti
  samkv\u00e6mt 1. mgr. 6. gr. laganna a\u00f0 li\u00f0num m\u00e1nu\u00f0i fr\u00e1
  \u00feeim degi er kr\u00f6fuhafi sannanlega lag\u00f0i fram \u00fe\u00e6r uppl\u00fdsingar
  sem \u00fe\u00f6rf var \u00e1 til a\u00f0 meta tj\u00f3nsatvik og fj\u00e1rh\u00e6\u00f0
  b\u00f3ta. Eins og \u00e1\u00f0ur segir \u00fe\u00e1 sendi l\u00f6gma\u00f0ur stefnanda
  kr\u00f6fubr\u00e9f til stefnanda, dags. 19. apr\u00edl 2021, \u00fear sem ger\u00f0
  var grein fyrir kr\u00f6fu hennar. Ber \u00fev\u00ed a\u00f0 d\u00e6ma dr\u00e1ttarvexti
  fr\u00e1 19. ma\u00ed 2021.\\n\\n\u00cd samr\u00e6mi vi\u00f0 framangreinda ni\u00f0urst\u00f6\u00f0u
  ver\u00f0ur stefnda gert a\u00f0 grei\u00f0a stefnanda 60.000 kr\u00f3nur me\u00f0
  v\u00f6xtum samkv\u00e6mt 1. mgr. 8. gr. laga nr. 38/2001 fr\u00e1 2. apr\u00edl
  2021 til 19. ma\u00ed 2021, en me\u00f0 dr\u00e1ttarv\u00f6xtum samkv\u00e6mt 1.
  mgr. 6. gr. laga nr. 38/2001 fr\u00e1 \u00feeim degi til grei\u00f0sludags, a\u00f0
  fr\u00e1dreginni innborgun stefnda 8. september 2021 a\u00f0 fj\u00e1rh\u00e6\u00f0
  30.000 kr\u00f3nur.\\n\\nStefnandi n\u00fdtur gjafs\u00f3knar \u00ed m\u00e1linu
  samkv\u00e6mt gjafs\u00f3knarleyfi, dags. 28. mars 2022, og eru \u00fev\u00ed ekki
  efni til a\u00f0 d\u00e6ma stefnda til grei\u00f0slu m\u00e1lskostna\u00f0ar. Ver\u00f0ur
  m\u00e1lskostna\u00f0ur \u00fev\u00ed felldur ni\u00f0ur. Gjafs\u00f3knarkostna\u00f0ur
  stefnanda grei\u00f0ist \u00far r\u00edkissj\u00f3\u00f0i, \u00fear me\u00f0 talin
  \u00fe\u00f3knun l\u00f6gmanns hennar sem \u00feykir h\u00e6filega \u00e1kve\u00f0in
  800.000 kr\u00f3nur, \u00e1n tillits til vir\u00f0isaukaskatts.\\n\\nAf h\u00e1lfu
  stefnanda flutti m\u00e1li\u00f0 Svavar Da\u00f0ason l\u00f6gma\u00f0ur.\\n\\nAf
  h\u00e1lfu stefnda flutti m\u00e1li\u00f0 Eir\u00edkur \u00c1ki Eggertsson l\u00f6gma\u00f0ur.\\n\\nArnaldur
  Hjartarson h\u00e9ra\u00f0sd\u00f3mari kve\u00f0ur upp d\u00f3m \u00feennan.\\n\\nD
