  \u00feeirra s\u00edn \u00e1 milli sem \u00fdtir undir gagnr\u00fdna hugsun |\\n|
  A\u00f0 hafa \u00fearfir og samskipti barna a\u00f0 lei\u00f0arlj\u00f3si \u00ed
  \u00f6llu starfi sem fram fer \u00e1 sk\u00f3lat\u00edma | Sinna \u00fe\u00f6rfum
  hvers og eins og mismuna engum. Tala \u00fearf eins vi\u00f0 \u00f6ll b\u00f6rn
  svo \u00feau finni ekki fyrir neikv\u00e6ni \u00ed sinn gar\u00f0. |\\n\\nSk\u00f6pun
  5-6 \u00e1ra\\n\\nSk\u00f6pun: Sk\u00f6pun er lei\u00f0 einstaklings til \u00feess
  a\u00f0 tengja n\u00fdja upplifun fyrri \u00feekkingu og ver\u00f0a \u00feannig
  ,,meiri \u00ed dag en \u00ed g\u00e6r\\\" Sk\u00f6punargle\u00f0in  sprettur fram
  vegna forvitni og athafna\u00fer\u00e1 sem lei\u00f0ir til n\u00e1ms\u00e1huga og
  frumkv\u00e6\u00f0is. Sk\u00f6pun er a\u00f0 uppg\u00f6tva, nj\u00f3ta, \u00f6rva
  forvitni og \u00e1huga, virkja \u00edmyndunarafl og leika s\u00e9r me\u00f0 m\u00f6guleika.
  H\u00fan br\u00fdtur hef\u00f0bundin mynstur, reglur og kerfi og veitir n\u00fdja
  s\u00fdn \u00e1 fyrirb\u00e6ri og vi\u00f0teknar hugmyndir. Leikur er mikilv\u00e6g
  n\u00e1msa\u00f0fer\u00f0 og opnar v\u00edddir \u00fear sem sk\u00f6punargle\u00f0i
  barna og ungmenna getur noti\u00f0 s\u00edn.  Hamingja og gle\u00f0i liggja \u00ed
  \u00fev\u00ed a\u00f0 finna h\u00e6fileikum s\u00ednum farveg og  f\u00e1 a\u00f0
  nj\u00f3ta s\u00edn sem einstaklingur og hluti af heild.\\n\\nStarfsf\u00f3lk \u00fearf
  a\u00f0 taka tillit til \u00e1huga barnanna hva\u00f0 var\u00f0ar sk\u00f6pun en
  kynna \u00fearf fyrir \u00feeim mismunandi efnivi\u00f0 og \u00e1h\u00f6ld sem efla
  hugmyndarflug \u00feeirra og getu. Gefa \u00fearf \u00feeim t\u00edma og  \u00edmyndunarafli
  \u00feeirra lausan tauminn svo \u00feau \u00f6\u00f0list frumkv\u00e6\u00f0i og
  kjark til a\u00f0 skapa \u00fea\u00f0 sem \u00feeim langar til. Starfsf\u00f3lk
  \u00fearf a\u00f0 hafa getu til a\u00f0 virkja sk\u00f6punargle\u00f0i barnanna
  en \u00fea\u00f0 gera \u00feeir me\u00f0 \u00fev\u00ed a\u00f0 gefa b\u00f6rnunumt\u00edma
  a\u00f0 framkv\u00e6ma \u00fea\u00f0 sem \u00feau langar til og vera \u00e1hugasamir
  sj\u00e1lfir og r\u00e6\u00f0a vi\u00f0 b\u00f6rnin. Sk\u00f6pun fellst ekki eing\u00f6ngu
  \u00ed \u00fev\u00ed a\u00f0 skila fr\u00e1 s\u00e9r einhverju verki heldur er h\u00fan
  einnig \u00ed leiksr\u00e6nni tj\u00e1ningu, \u00fev\u00ed er mikilv\u00e6gt a\u00f0
  kennarar s\u00e9 fyrirmynd \u00ed \u00fev\u00ed og \u00f3hr\u00e6dd vi\u00f0 a\u00f0
  taka \u00fe\u00e1tt \u00ed frj\u00e1lsum leik barnanna. Skapandi starf \u00e1 a\u00f0
  beinast a\u00f0 \u00fev\u00ed sem gert er \u00fear sem allir f\u00e1i noti\u00f0
  s\u00fdn \u00e1 s\u00ednum forsendum. Kennarar gegna lykilhlutverki \u00ed \u00f6llu
  sk\u00f3lastarfi, \u00fev\u00ed er \u00fea\u00f0 mikilv\u00e6gt a\u00f0 \u00feeir
  n\u00fdti s\u00edna fag\u00feekkingu \u00ed a\u00f0 kenna b\u00f6rnum hinar \u00fdmsu
  greinar sk\u00f6punar \u00fev\u00ed sk\u00f6pun er \u00ed \u00f6llu umhverfinu.
  Starfsf\u00f3lk \u00fearf a\u00f0 vera frj\u00f3tt og geta vaki\u00f0 upp \u00e1huga
  barnanna sem lei\u00f0ir til spurninga \u00farlausnar og skapandi hugsunar. Taka
  tillit til \u00e1huga hvers og eins er var\u00f0ar sk\u00f6pun.\\n\\nSk\u00f6pun
  5-6 \u00e1ra\\n\\nHeilbrig\u00f0i og velfer\u00f0 5-6 \u00e1ra.\\n\\n\u00deegar
  r\u00e6tt er um heilbrig\u00f0i er v\u00edsa\u00f0 til andlegrar, l\u00edkamlegrar
  og f\u00e9lagslegrar vell\u00ed\u00f0anar f\u00f3lks.  Allt sk\u00f3lastarf \u00e1
  a\u00f0 mi\u00f0a a\u00f0 \u00fev\u00ed a\u00f0 efla heilbrig\u00f0i og stu\u00f0la
  markvisst a\u00f0 velll\u00ed\u00f0an barnanna me\u00f0 tilliti til sj\u00e1lfsmyndar,
  hreyfingar, n\u00e6ringar, hv\u00edldar, andlegrar vell\u00ed\u00f0anar, g\u00f3\u00f0ra
  samskipta, \u00f6ryggis, hreinl\u00e6tis, kynheilbrig\u00f0is og skilnings \u00e1
  eigin tilfinningum og annarra.\\n\\n\u00c1 Engjar\u00f3s er l\u00f6g\u00f0 \u00e1herla
  \u00e1 hreyfingu barna og hreyfiuppeldi. B\u00f6rnin fara \u00ed leikfimish\u00fas
  einu sinni \u00e1 h\u00e1lfsm\u00e1na\u00f0ar fresti sem er utan vi\u00f0 \u00fe\u00e1
  hreyfingu sem \u00feau i\u00f0ka \u00ed sal sk\u00f3lans.  G\u00f3\u00f0 hreyfif\u00e6rni
  eykur sj\u00e1lfstraust \u00e1samt \u00fev\u00ed a\u00f0 b\u00e6ta  heilsu, snerpu
  og \u00feol. B\u00f6rn tj\u00e1 sig snemma me\u00f0 hreyfingu, \u00feau skynja l\u00edkama
  sinn og finna styrk sinn og getu. L\u00edkamlegri \u00e1reynslu fylgir hv\u00edld
  og \u00fear skynjar barni\u00f0 mun \u00e1 spennu og sl\u00f6kun. \u00dativera og
  hreyfing er mikilv\u00e6gur \u00fe\u00e1ttur \u00ed daglegu l\u00edfi og hefur veri\u00f0
  st\u00f3r \u00fe\u00e1ttur \u00ed leiksk\u00f3lastarfinu h\u00e9r \u00e1 Ki\u00f0agili.
  Hva\u00f0 var\u00f0ar velfer\u00f0 barna sn\u00fdst h\u00fan ekki eing\u00f6gu um
  l\u00edkamlegt atgervi heldur einnig um sj\u00e1lfsmynd, andlega l\u00ed\u00f0an,
  \u00f6ryggi , mat \u00e1 eigin tilfinningum og annarra. Starfsf\u00f3lk \u00fearf
  a\u00f0 vera me\u00f0vita\u00f0ir um \u00fearfir hvers og eins og uppfylla \u00fe\u00e6r
  eins vel og h\u00e6gt er. Mikilv\u00e6gt er a\u00f0 efla f\u00e9lags\u00feroskan
  og f\u00e9lagstengslin svo og gefa b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0
  takast \u00e1 vi\u00f0 n\u00fd vi\u00f0fangsefni. Fr\u00e6\u00f0sla um mikilv\u00e6gi
  n\u00e6ringar byggist \u00e1 \u00fev\u00ed a\u00f0 kynna allar f\u00e6\u00f0utegundirfyrir
  b\u00f6rnunum og gefa \u00feeim t\u00e6kif\u00e6ri \u00e1 a\u00f0 smakka. Starfsf\u00f3lk
  \u00fearf a\u00f0 leitast vi\u00f0 minnka h\u00e1va\u00f0a \u00fear sem hann hefur
  \u00e1hrif \u00e1 leik og n\u00e1m barnanna\\n\\nHeilbrig\u00f0i og velfer\u00f0
  barna byggist \u00e1 samskiptum og \u00e1 a\u00f0 einkennast af hl\u00fdju og vir\u00f0ingu
  en starfsf\u00f3lki ber a\u00f0 eiga \u00ed j\u00e1kv\u00e6\u00f0um samskiptum vi\u00f0
  b\u00f6rnin \u00fev\u00ed \u00fea\u00f0 eflir sj\u00e1lfsmynd \u00feeirra og sj\u00e1lfstrausti\u00f0
  eykst. \u00dea\u00f0 a\u00f0 hvetja b\u00f6rnin kennir \u00feeim a\u00f0 taka \u00e1byrg\u00f0
  \u00e1 eigin getu og heg\u00f0un auk \u00feess sem \u00fea\u00f0 veitir \u00feeim
  \u00feroska til a\u00f0 m\u00e6ta \u00f3v\u00e6ntum a\u00f0st\u00e6\u00f0um og tr\u00fa
  \u00e1 eigin getu. \u00deau ver\u00f0a einnig tilb\u00fanari a\u00f0 takast \u00e1
  vi\u00f0 \u00e1greiningsm\u00e1l er upp koma og grei\u00f0a \u00far \u00feeim\\n\\nHeilbrig\u00f0i
  og velfer\u00f0 5-6 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n|
