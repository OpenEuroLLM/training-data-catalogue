  Inngangur\\n\\nR\u00edkisendursko\u00f0un hefur loki\u00f0 endursko\u00f0un \u00e1rsreiknings
  Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s fyrir \u00e1ri\u00f0 2016.\\n\\n\u00c1rsreikningurinn
  er bygg\u00f0ur \u00e1 b\u00f3khaldi stofnunarinnar og \u00f6\u00f0rum uppl\u00fdsingum
  stj\u00f3rnenda. R\u00edkisendursko\u00f0un vekur athygli \u00e1 \u00fev\u00ed a\u00f0
  stj\u00f3rnendur stofnunarinnar eru \u00e1byrgir fyrir ger\u00f0 og framsetningu
  reikningsskila og jafnframt \u00e1byrgir gagnvart notendum reikningsskilanna. \u00deetta
  felur me\u00f0al annars \u00ed s\u00e9r a\u00f0 b\u00f3khald og fj\u00e1rhagslegt
  eftirlit s\u00e9 fulln\u00e6gjandi, a\u00f0 r\u00e9ttum reikningsskilareglum s\u00e9
  fylgt og a\u00f0 vi\u00f0eigandi innra eftirlit hafi veri\u00f0 innleitt og skjalfest.\\n\\nEndursko\u00f0a\u00f0
  var \u00e1 grundvelli al\u00fej\u00f3\u00f0legra sta\u00f0la um opinbera endursko\u00f0un.
  Byggt er \u00e1 skipul\u00f6g\u00f0u ferli a\u00f0ger\u00f0a og faglegu mati sem
  mi\u00f0ar a\u00f0 \u00fev\u00ed a\u00f0 sta\u00f0festa fj\u00e1rh\u00e6\u00f0ir
  og a\u00f0rar uppl\u00fdsingar \u00ed \u00e1rsreikningnum. Endursko\u00f0unin f\u00f3l
  me\u00f0al annars \u00ed s\u00e9r \u00e1h\u00e6ttugreiningu og \u00e1h\u00e6ttumat
  \u00e1samt almennum greiningara\u00f0fer\u00f0um og \u00fartaksk\u00f6nnunum og
  athugunum \u00e1 g\u00f6gnum til a\u00f0 sannreyna fj\u00e1rh\u00e6\u00f0ir og a\u00f0rar
  uppl\u00fdsingar sem fram koma \u00ed \u00e1rsreikningnum.\\n\\n\u00cd samr\u00e6mi
  vi\u00f0 5. grein laga nr. 46/2016 um r\u00edkisendursko\u00f0anda og endursko\u00f0un
  r\u00edkisreikninga t\u00f3k endursko\u00f0unin mi\u00f0 af eftirfarandi:\\n\\n[x]
  A\u00f0 reikningsskil gefi gl\u00f6gga mynd af rekstri, fj\u00e1rhagslegri st\u00f6\u00f0u
  og breytingu \u00e1 henni \u00e1 \u00e1rinu \u00ed samr\u00e6mi vi\u00f0 settar
  reikningsskilareglur fyrir opinbera a\u00f0ila.\\n[x] A\u00f0 kanna innra eftirlit
  og hvort \u00fea\u00f0 tryggir vi\u00f0unandi \u00e1rangur.\\n[x] A\u00f0 rekstur
  og umsvif s\u00e9u \u00ed samr\u00e6mi vi\u00f0 heimildir fj\u00e1rlaga, fj\u00e1raukalaga
  og annarra laga, l\u00f6gm\u00e6t fyrirm\u00e6li, samninga og starfsvenjur \u00fear
  sem \u00fea\u00f0 \u00e1 vi\u00f0.\\n\\n\u00c1rsreikningur Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s
  var s\u00ed\u00f0ast tekinn til sko\u00f0unar \u00e1ri\u00f0 2015 vegna \u00e1rsins
  2014.\\n\\n2 Ni\u00f0urst\u00f6 \u00f0ur \u00f6g a bendingar\\n\\nVi\u00f0 endursko\u00f0un
  \u00e1rsreiknings Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s fyrir \u00e1ri\u00f0
  2016 komu m.a. fram eftirfarandi \u00e1bendingar.\\n\\n1. Verkferlar og skr\u00e1ning
  verklagsreglna\\n\\nGera \u00fearf \u00e1tak \u00ed \u00fev\u00ed a\u00f0 yfirfara
  verkferla \u00e1samt \u00fev\u00ed a\u00f0 skr\u00e1 verklagsreglur til a\u00f0
  tryggja skilvirkt innra eftirlit. R\u00edkisendursko\u00f0un bendir \u00e1 \u00fea\u00f0
  a\u00f0 \u00fer\u00e1tt fyrir a\u00f0 komi\u00f0 hafi veri\u00f0 \u00e1 \u00fdmsum
  skilvirkum ferlum \u00fearf a\u00f0 yfirfara og skilgreina verklagsferla betur \u00e1samt
  \u00fev\u00ed a\u00f0 skr\u00e1 ferla og verklagsreglur.\\n\\n2. Sam\u00feykki r\u00e1\u00f0ningarsamninga\\n\\nFramsal
  \u00e1 heimild til sam\u00feykkis \u00e1 r\u00e1\u00f0ningarsamninga \u00fearf a\u00f0
  vera skriflegt. Gera \u00fearf formlegt framsal til \u00fej\u00f3\u00f0gar\u00f0svar\u00f0a
  sem sj\u00e1 um a\u00f0 r\u00e1\u00f0a starfsmenn \u00e1 vi\u00f0komandi starfsst\u00f6\u00f0.
  Samkv\u00e6mt uppl\u00fdsingum stj\u00f3rnenda er vinna vi\u00f0 ger\u00f0 verkferla
  hafin.\\n\\n3. Innkaupareglur\\n\\nR\u00edkisendursko\u00f0un leggur til a\u00f0
  m\u00f3tu\u00f0 ver\u00f0i innkaupastefna fyrir stofnunina og verklagsreglur um
  innkaup \u00e1 grundvelli \u00feeirrar stefnu. Samkv\u00e6mt uppl\u00fdsingum stj\u00f3rnenda
  hafa n\u00fa \u00fer\u00edr a\u00f0ilar heimild til a\u00f0 sam\u00feykkja reikninga,
  framkv\u00e6mdastj\u00f3ri, fj\u00e1rm\u00e1lastj\u00f3ri og b\u00f3kari. \u00deegar
  um risnu er a\u00f0 r\u00e6\u00f0a \u00fearf sam\u00feykki framkv\u00e6mdastj\u00f3ra
  fyrir \u00fatgj\u00f6ldum. \u00de\u00e1 er bent \u00e1 a\u00f0 sam\u00feykki fagr\u00e1\u00f0uneytis
  og fj\u00e1rm\u00e1lar\u00e1\u00f0uneytis \u00fearf fyrir rekstrar- og kaupleigusamningum.\\n\\n4.
  Birg\u00f0ir\\n\\nSta\u00f0festa \u00fearf birg\u00f0atalningar og samr\u00e6ma
  \u00fearf mat \u00e1 ver\u00f0m\u00e6ti birg\u00f0a af h\u00e1lfu stj\u00f3rnenda
  stofnunarinnar. Birg\u00f0ast\u00fdringarkerfi er ekki til sta\u00f0ar og eignf\u00e6r\u00f0
  birg\u00f0asta\u00f0a byggir \u00e1 v\u00f6rutalningum fr\u00e1 sex starfsst\u00f6\u00f0vum.
  Samkv\u00e6mt uppl\u00fdsingum fr\u00e1 stj\u00f3rnendum er unni\u00f0 a\u00f0 \u00fev\u00ed
  a\u00f0 laga og endurb\u00e6ta verklag.\\n\\n3 Fja rheimildir \u00f6g rekstur\\n\\n3.1
  Fj\u00e1rheimildir\\n\\nFramlag r\u00edkisins \u00e1 fj\u00e1rl\u00f6gum 2016 til
  Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s nam 532,1 m.kr. Til vi\u00f0b\u00f3tar
  f\u00e9kk stofnunin 29,8 m.kr. \u00e1 fj\u00e1raukal\u00f6gum sem skiptist \u00feannig
  a\u00f0 19,0 m.kr. f\u00f3ru til launali\u00f0ar \u00ed almennum rekstri en \u00e1
  m\u00f3ti voru \u00f6nnur rekstrargj\u00f6ld l\u00e6kku\u00f0 um 6,0 m.kr. og framkv\u00e6mdali\u00f0ur
  var h\u00e6kka\u00f0ur um 16,8 m.kr. Endanleg fj\u00e1rheimild \u00e1rsins var\u00f0
  \u00fev\u00ed 561,9 m.kr. Rekstrargj\u00f6ld a\u00f0 fr\u00e1dregnum tekjum n\u00e1mu
  samtals 547,9 m.kr. og \u00fev\u00ed var\u00f0 t\u00e6plega 14,0 m.kr. tekjuafgangur
  \u00e1 \u00e1rinu 2016 e\u00f0a 2,5% af fj\u00e1rheimildum \u00e1rsins. Til samanbur\u00f0ar
  var 36,6 m.kr. tekjuhalli Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s vegna fj\u00e1rhags\u00e1rsins
  2015.\\n\\nEftirfarandi tafla s\u00fdnir samanbur\u00f0 \u00e1 fj\u00e1rheimildum
  og rekstri \u00e1 \u00e1rinu 2016 \u00e1samt rekstrarni\u00f0urst\u00f6\u00f0u \u00e1rsins
  2015:\\n\\n| \u00cd \u00fe\u00fas. kr. | Fj\u00e1rl\u00f6g | Fj\u00e1rheimild |
  Rekstur | Fr\u00e1vik | Rekstur |\\n|---|---|---|---|---|---|\\n|  | 2016 | 2016
  | 2016 | 2016 | 2015 |\\n| S\u00e9rtekjur | -253.9 | -253.9 | -363.841 | 109.941
  | -378.164 |\\n| Launagj\u00f6ld | 411.7 | 430.7 | 370.869 | 59.831 | 311.757 |\\n|
  \u00d6nnur rekstrargj\u00f6ld | 292.3 | 303.1 | 496.155 | -193.055 | 514.81 |\\n|
  Eignakaup | 82 | 82 | 42.622 | 39.378 | 41.416 |\\n| Tilf\u00e6rslur | 0 | 0 | 2.12
  | -2.12 | 2.684 |\\n| Samtals | 532.1 | 561.9 | 547.924 | 13.976 | 492.503 |\\n\\nS\u00e9rtekjur
  voru 109,9 m.kr. h\u00e6rri en fj\u00e1rheimildir ger\u00f0u r\u00e1\u00f0 fyrir.
  Launagj\u00f6ld voru 59,8 m.kr. l\u00e6gri en fj\u00e1rheimildir og \u00f6nnur rekstrargj\u00f6ld
  voru 193,1 m.kr. h\u00e6rri en fj\u00e1rheimildir, sem sk\u00fdrist a\u00f0 nokkru
  leyti af tekjuf\u00e6r\u00f0um styrkjum til stofnunarinnar og \u00fatgj\u00f6ldum
  vegna \u00feeirra.\\n\\n3.2 Rekstrar\u00e1\u00e6tlun\\n\\nR\u00edkisendursko\u00f0un
  leggur \u00e1herslu \u00e1 a\u00f0 vanda\u00f0 s\u00e9 til vi\u00f0 ger\u00f0 rekstrar\u00e1\u00e6tlunar,
  h\u00fan s\u00e9 skr\u00e1\u00f0 \u00ed fj\u00e1rhagskerfi\u00f0 og reglulega fylgst
  me\u00f0 \u00fev\u00ed hvort gj\u00f6ld og tekjur s\u00e9u \u00ed samr\u00e6mi vi\u00f0
  \u00e1\u00e6tlun \u00e1rsins. Rekstrar\u00e1\u00e6tlun Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s
  fyrir \u00e1ri\u00f0 2016 var skr\u00e1\u00f0 \u00ed fj\u00e1rhagskerfi r\u00edkisins.
  \u00cd rekstrar\u00e1\u00e6tlun var fj\u00e1rheimildum skipt me\u00f0 \u00f6\u00f0rum
  h\u00e6tti en \u00ed fj\u00e1rheimildakerfinu og ger\u00f0i rekstrar\u00e1\u00e6tlun
  r\u00e1\u00f0 fyrir umtalsvert h\u00e6rri s\u00e9rtekjum og h\u00e6rri \u00f6\u00f0rum
  rekstrarkostna\u00f0i. Fr\u00e1vik voru \u00e1 flestum li\u00f0um b\u00e6\u00f0i
  \u00ed s\u00e9rtekjum og gj\u00f6ldum. Rekstrar\u00e1\u00e6tlun ger\u00f0i r\u00e1\u00f0
  fyrir 11,0 m.kr. tekjuafgangi \u00e1 \u00e1rinu en 14 m.kr. tekjuafgangur var\u00f0
  \u00e1 fj\u00e1rhags\u00e1rinu 2016.\\n\\n3.3 Ni\u00f0ursta\u00f0a\\n\\nTekjuafgangur
  Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s \u00e1ri\u00f0 2016 nam 14,0 m.kr.
  sem var betri ni\u00f0ursta\u00f0a en gert var r\u00e1\u00f0 fyrir \u00ed rekstrar\u00e1\u00e6tlun
  og l\u00e6kkar uppsafna\u00f0an halla \u00far 82,5 m.kr. \u00ed 68,5 m.kr. Rekstrar\u00e1\u00e6tlun
  var skr\u00e1\u00f0 \u00ed fj\u00e1rhagskerfi r\u00edkisins og fylgst er me\u00f0
  fr\u00e1vikum fr\u00e1 \u00e1\u00e6tlun innan \u00e1rsins.\\n\\n4 Innra eftirlit\\n\\n4.1
  Inngangur\\n\\nFramkv\u00e6mdastj\u00f3ri Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s
  ber \u00e1byrg\u00f0 \u00e1 framkv\u00e6md innra eftirlits. Innra eftirlit felur
  \u00ed s\u00e9r \u00fe\u00e6r reglubundnu a\u00f0ger\u00f0ir og r\u00e1\u00f0stafanir
  sem hluta\u00f0eigandi a\u00f0ili gerir til a\u00f0 stu\u00f0la a\u00f0 hagkv\u00e6mni
  rekstrar, \u00f6ryggi fj\u00e1rmuna, \u00e1rei\u00f0anleika uppl\u00fdsinga og almennt
  a\u00f0 \u00fev\u00ed a\u00f0 markmi\u00f0um starfseminnar ver\u00f0i n\u00e1\u00f0
  og fylgt s\u00e9 l\u00f6gum og reglum.\\n\\nR\u00edkisendursko\u00f0un ber skv.
  l\u00f6gum a\u00f0 kanna innra eftirlit og meta hvort \u00fea\u00f0 tryggir vi\u00f0unandi
  \u00e1rangur.\\n\\n4.2 Umfj\u00f6llun\\n\\nVi\u00f0 mat \u00e1 eftirlitsumhverfinu
  kom \u00ed lj\u00f3s a\u00f0 fari\u00f0 er eftir almennum verklagsreglum um \u00fdmsa
  \u00fe\u00e6tti sem sn\u00faa a\u00f0 innra eftirliti en skriflega heildarl\u00fdsingu
  vantar \u00e1 alla verkferla er sn\u00faa a\u00f0 b\u00f3khaldi, fj\u00e1rm\u00e1lum,
  tekjum, innkaupum og starfsmannam\u00e1lum. Skipurit er til fyrir stofnunina en
  \u00fea\u00f0 hefur hvorki veri\u00f0 sam\u00feykkt af stj\u00f3rn n\u00e9 r\u00e1\u00f0herra
  samkv\u00e6mt uppl\u00fdsingum stj\u00f3rnenda.\\n\\nFj\u00e1rhags- og mannau\u00f0skerfi
  r\u00edkisins er nota\u00f0 fyrir vinnslu \u00e1 b\u00f3khaldi og launaafgrei\u00f0slu.
  Stofnunin n\u00fdtir einnig vi\u00f0eigandi kerfishluta fj\u00e1rhagskerfisins eins
  og fyrir vi\u00f0skiptaskuldir, vi\u00f0skiptakr\u00f6fur og eignaskr\u00e1ningu.
  Einnig er tekjub\u00f3khaldskerfi r\u00edkisins nota\u00f0 fyrir afmarka\u00f0ar
  tekjur og sj\u00f3\u00f0v\u00e9lar. Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0ur
  er \u00ed b\u00f3khalds- og grei\u00f0slu\u00fej\u00f3nustu hj\u00e1 Fj\u00e1rs\u00fdslu
  r\u00edkisins.\\n\\nFramkv\u00e6mdastj\u00f3ri \u00e1ritar r\u00e1\u00f0ningarsamninga
  fastra starfsmanna en \u00fej\u00f3\u00f0gar\u00f0sver\u00f0ir, sem eru stj\u00f3rnendur
  starfsst\u00f6\u00f0va, undirrita r\u00e1\u00f0ningarsamninga starfsmanna sem heyra
  undir \u00feeirra starfsst\u00f6\u00f0var. Ekki liggur fyrir skrifleg heimild fr\u00e1
  framkv\u00e6mdastj\u00f3ra til \u00fej\u00f3\u00f0gar\u00f0svar\u00f0a vegna undirritunar
  r\u00e1\u00f0ningarsamninga og gerir R\u00edkisendursko\u00f0un athugasemd vi\u00f0
  \u00fea\u00f0. Bent er \u00e1 a\u00f0 \u00ed 42. gr. laga nr. 70/1996 um r\u00e9ttindi
  og skyldur starfsmanna r\u00edkisins segir a\u00f0 ger\u00f0ur skuli skriflegur
  r\u00e1\u00f0ningarsamningur milli forst\u00f6\u00f0umanns og starfsmanns. \u00dear
  sem tilgreint er s\u00e9rstaklega a\u00f0 r\u00e1\u00f0ningarsamningur s\u00e9 milli
  forst\u00f6\u00f0umanns og starfsmanns er m\u00e6lst til a\u00f0 \u00ed \u00feeim
  tilvikum sem framkv\u00e6mdastj\u00f3ri undirritar ekki r\u00e1\u00f0ningarsamninga
  liggi lj\u00f3st fyrir hverjir eigi a\u00f0 undirrita r\u00e1\u00f0ningarsamninga
  \u00ed umbo\u00f0i hans og \u00fea\u00f0 skjalfest.  Samkv\u00e6mt uppl\u00fdsingum
  stj\u00f3rnenda er unni\u00f0 a\u00f0 endurb\u00f3tum \u00e1 verklagi var\u00f0andi
  r\u00e1\u00f0ningar.\\n\\nVi\u00f0vera og fjarvistir starfsmanna voru skr\u00e1\u00f0ar
  \u00ed skr\u00e1ningarkerfi\u00f0 T\u00edmon \u00e1ri\u00f0 2016 en vi\u00f0verukerfi\u00f0
  Vinnustund var teki\u00f0 \u00ed notkun \u00e1ri\u00f0 2017.\\n\\nFramkv\u00e6mdastj\u00f3ri,
  sem sta\u00f0settur er \u00ed Reykjav\u00edk, og b\u00f3kari, sem sta\u00f0settur
  er \u00ed Fellab\u00e6, \u00e1rita reikninga. Fj\u00e1rm\u00e1lastj\u00f3ri sem
  h\u00f3f st\u00f6rf seinni hluta \u00e1rs 2016 \u00e1ritar einnig reikninga.  Reikningar
  sem v\u00f6ldust \u00ed \u00fartak til sko\u00f0unar voru sam\u00feykktir af einum
  a\u00f0ila. R\u00edkisendursko\u00f0un m\u00e6list til a\u00f0 fari\u00f0 ver\u00f0i
  eftir \u00feeirri meginreglu a\u00f0 tveir a\u00f0ilar sam\u00feykki reikninga til
  grei\u00f0slu, \u00feannig a\u00f0 ferli\u00f0 byggist \u00e1 \u00fev\u00ed a\u00f0
  s\u00e1 sem stofnar til kostna\u00f0arins sta\u00f0festi a\u00f0 forsendur reiknings
  s\u00e9u r\u00e9ttar \u00fear me\u00f0 tali\u00f0 ver\u00f0 og magn og a\u00f0 vara
  hafi veri\u00f0 m\u00f3ttekin. Sam\u00feykki fj\u00e1rm\u00e1lastj\u00f3ra og/e\u00f0a
  framkv\u00e6mdastj\u00f3ra felst s\u00ed\u00f0an \u00ed \u00fev\u00ed a\u00f0 heimild
  hafi veri\u00f0 fyrir kaupunum og a\u00f0 \u00feau hafi veri\u00f0 \u00ed samr\u00e6mi
  vi\u00f0 innkaupareglur stofnunarinnar. Samkv\u00e6mt uppl\u00fdsingum stj\u00f3rnenda
  kallar s\u00e1 sem sam\u00feykkir reikninga a\u00f0 jafna\u00f0i eftir sam\u00feykki
  fr\u00e1 \u00feeim sem stofna\u00f0i til \u00fatgjalda, \u00feannig a\u00f0 um tv\u00f6falt
  sam\u00feykki er a\u00f0 r\u00e6\u00f0a og \u00ed sumum tilfellum \u00ferefalt.\\n\\nR\u00edkisendursko\u00f0un
  bendir \u00e1 a\u00f0 mikilv\u00e6gt er a\u00f0 stj\u00f3rns\u00fdsla stofnunarinnar
  var\u00f0andi b\u00f3khald og fj\u00e1rm\u00e1l s\u00e9 \u00e1 s\u00f6mu starfsst\u00f6\u00f0
  til a\u00f0 stytta bo\u00f0lei\u00f0ir, auka skilvirkni ferla og yfirs\u00fdn stj\u00f3rnenda.\\n\\n4.3
  Ni\u00f0ursta\u00f0a\\n\\nR\u00edkisendursko\u00f0un bendir \u00e1 a\u00f0 \u00fer\u00e1tt
  fyrir a\u00f0 komi\u00f0 hafi veri\u00f0 \u00e1 \u00fdmsum skilvirkum ferlum \u00fearf
  a\u00f0 gera \u00e1tak \u00ed \u00fev\u00ed a\u00f0 yfirfara og skilgreina verklagsferla
  \u00e1samt \u00fev\u00ed a\u00f0 skr\u00e1 ferla og verklagsreglur til a\u00f0 tryggja
  skilvirkt innra eftirlit. \u00de\u00e1 er bent \u00e1 a\u00f0 gera \u00fearf formlegt
  framsal til \u00fej\u00f3\u00f0gar\u00f0svar\u00f0a sem sj\u00e1 um a\u00f0 r\u00e1\u00f0a
  starfsmenn \u00e1 vi\u00f0komandi starfsst\u00f6\u00f0 og \u00e6skilegt er a\u00f0
  \u00ed \u00feeim tilvikum s\u00e9u r\u00e1\u00f0ningarsamningar undirrita\u00f0ir
  af tveimur a\u00f0ilum. Einnig er m\u00e6lt me\u00f0 \u00fev\u00ed a\u00f0 spor
  um tv\u00f6falt sam\u00feykki \u00e1 reikninga til grei\u00f0slu ver\u00f0i  gert
  s\u00fdnilegt fyrir alla reikninga.\\n\\n5 Fylgni vi\u00f0 l\u00f6 g \u00f6g reglur\\n\\n5.1
  Inngangur\\n\\nVi\u00f0 fj\u00e1rhagsendursko\u00f0un er teki\u00f0 mi\u00f0 af
  hvort rekstur stofnunar hafi veri\u00f0 \u00ed samr\u00e6mi vi\u00f0 heimildir fj\u00e1rlaga,
  fj\u00e1raukalaga og annarra laga, l\u00f6gm\u00e6t fyrirm\u00e6li, starfsvenjur
  og rekstrarverkefni \u00fear sem vi\u00f0 \u00e1. Fjalla\u00f0 er s\u00e9rstaklega
  um fj\u00e1rheimildir og rekstrar\u00e1\u00e6tlun \u00ed kafla 3. Eftirfarandi li\u00f0ir
  voru teknir til sko\u00f0unar vegna \u00e1rsins 2016:\\n\\n5.1.1 Risna\\n\\nFj\u00f3rir
  risnureikningar voru sko\u00f0a\u00f0ir en \u00feeir t\u00f3ku til 94% af heildarkostna\u00f0i
  vegna risnu \u00e1rsins 2016. Tveir reikningar voru undirrita\u00f0ir af framkv\u00e6mdastj\u00f3ra
  og tveir af b\u00f3kara. R\u00edkisendursko\u00f0un gerir athugasemd vi\u00f0 a\u00f0
  risnuheimild var ekki til sta\u00f0ar og tilefni risnu kom ekki fram \u00e1 reikningum.\\n\\n5.1.2
  Opinber innkaup\\n\\nVerklagsreglur um innkaup fyrir Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0
  eru ekki til sta\u00f0ar en samkv\u00e6mt uppl\u00fdsingum framkv\u00e6mdastj\u00f3ra
  eru rammasamningar R\u00edkiskaupa haf\u00f0ir til hli\u00f0sj\u00f3nar og nota\u00f0ir
  eftir atvikum. Bent er \u00e1 a\u00f0 m\u00f3ta \u00fearf innkaupastefnu og verklagsreglur
  var\u00f0andi innkaup.\\n\\n5.1.3 Innkaupakort\\n\\nVatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0ur
  n\u00fdtir innkaupakort m.a. til grei\u00f0slu innlends fer\u00f0akostna\u00f0ar
  og minni h\u00e1ttar kaupa \u00e1 rekstrarv\u00f6rum fyrir starfsst\u00f6\u00f0var.
  R\u00edkisendursko\u00f0un bendir \u00e1 a\u00f0 sko\u00f0a\u00f0 ver\u00f0i hvort
  l\u00e6kka megi \u00fattektarheimild innkaupakorta en tv\u00f6 innkaupakort hafa
  \u00fattektarheimild a\u00f0 fj\u00e1rh\u00e6\u00f0 2,1 m.kr. Einnig \u00fearf s\u00e1
  sem f\u00e6r innkaupakort til afnota a\u00f0 undirrita og sam\u00feykkja reglur
  um notkun kortsins.\\n\\n5.1.4 L\u00e1ns- og reikningsvi\u00f0skipti\\n\\nVatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0ur
  er me\u00f0 \u00ferj\u00e1 b\u00edlasamninga og einn kaupleigusamning sem eru til
  lengri t\u00edma en 90 daga. Samkv\u00e6mt uppl\u00fdsingum framkv\u00e6mdastj\u00f3ra
  var afla\u00f0 vi\u00f0eigandi sam\u00feykkis fyrir rekstrar- og kaupleigusamningum
  \u00e1\u00f0ur fyrr en \u00fea\u00f0 hefur ekki alltaf veri\u00f0 gert \u00feegar
  til endurleigu kemur. R\u00edkisendursko\u00f0un bendir \u00e1 a\u00f0 r\u00edkisstofnunum
  \u00ed A-hluta r\u00edk\u00edssj\u00f3\u00f0s er ekki heimilt a\u00f0 efna til skuldbindinga
  \u00e1n sam\u00feykkis fagr\u00e1\u00f0uneytis og fj\u00e1rm\u00e1lar\u00e1\u00f0uneytis,
  sbr. 6. gr. reglu nr. 83/2000 um l\u00e1ns- og reikningsvi\u00f0skipti r\u00edkisstofnana
  \u00ed A-hluta r\u00edkissj\u00f3\u00f0s.\\n\\n5.1.5 Styrkir\\n\\nVeittir voru styrkir
  til Slysavarnaf\u00e9lagsins Landsbjargar vegna slysavarna fer\u00f0amanna \u00e1
  h\u00e1lendi \u00fej\u00f3\u00f0gar\u00f0sins og til Saga Z. ehf. vegna fr\u00e6\u00f0slu
  og augl\u00fdsinga um \u00fej\u00f3\u00f0gar\u00f0inn. Gjaldf\u00e6rsla er \u00ed
  samr\u00e6mi vi\u00f0 reglur Fj\u00e1rs\u00fdslu r\u00edkisins um a\u00f0 styrki
  ber a\u00f0 gjaldf\u00e6ra \u00feegar tekin hefur veri\u00f0 \u00e1kv\u00f6r\u00f0un
  um styrkveitingu.\\n\\n5.1.6 Vir\u00f0isaukaskattur og endurgrei\u00f0slur\\n\\nB\u00f3kun
  og merking reikninga sem bera VSK er \u00ed samr\u00e6mi vi\u00f0 fyrirm\u00e6li
  Fj\u00e1rs\u00fdslu r\u00edkisins. Inneign vegna endurgrei\u00f0slu VSK f\u00e6rist
  til eignar \u00e1 vi\u00f0skiptareikningi stofnunarinnar vi\u00f0 r\u00edkissj\u00f3\u00f0.\\n\\n5.2
  Ni\u00f0ursta\u00f0a\\n\\nR\u00edkisendursko\u00f0un bendir \u00e1 eftirfarandi
  atri\u00f0i var\u00f0andi fylgni vi\u00f0 l\u00f6g og reglur:\\n\\n* \u00deegar
  um risnu er a\u00f0 r\u00e6\u00f0a \u00fearf sam\u00feykki framkv\u00e6mdastj\u00f3ra
  fyrir \u00fatgj\u00f6ldum \u00e1samt \u00fev\u00ed a\u00f0 tilgreina \u00fearf tilefni
  og hverjir nutu risnunnar. Einnig er bent \u00e1 ey\u00f0ubl\u00f6\u00f0 Fj\u00e1rs\u00fdslu
  r\u00edkisins fyrir risnuheimild.\\n* Setja \u00fearf stofnuninni innkaupastefnu
  og verklagsreglur um innkaup.\\n* Handhafi innkaupakorts \u00fearf a\u00f0 hafa
  sam\u00feykkt m\u00f3tt\u00f6ku kortsins og reglur um notkun. Einnig \u00fearf a\u00f0
  sko\u00f0a fj\u00e1rh\u00e6\u00f0 heimildar til \u00fattektar.\\n* Fagr\u00e1\u00f0uneyti
  og fj\u00e1rm\u00e1lar\u00e1\u00f0uneyti \u00feurfa a\u00f0 sam\u00feykkja rekstrar-
  og kaupleigusamninga samkv\u00e6mt reglu nr. 83/2000 um l\u00e1ns- og reikningsvi\u00f0skipti
  r\u00edkisstofnana \u00ed A-hluta.\\n\\n6 Endursk\u00f6\u00f0un rekstrarli\u00f0a\\n\\n6.1
  S\u00e9rtekjur\\n\\nSamkv\u00e6mt rekstrarreikningi \u00e1ri\u00f0 2016 n\u00e1mu
  s\u00e9rtekjur Vatnaj\u00f6kuls\u00fej\u00f3\u00f0gar\u00f0s 363,8 m.kr. og skiptast
  \u00ed tekjuflokka eins og fram kemur \u00ed ne\u00f0angreindri t\u00f6flu.\\n\\n|  |
