  skal s\u00fdnt sama vi\u00f0horf og vir\u00f0ing sama hva\u00f0a bakgrunn \u00feau
  hafa. B\u00f6rn \u00feurfa \u00e1 \u00fev\u00ed a\u00f0 halda a\u00f0 hlusta\u00f0
  s\u00e9 \u00e1 \u00feau og vir\u00f0ing borin fyrir sko\u00f0unum \u00feeirra. \u00deegar
  jafnr\u00e9tti er sko\u00f0a\u00f0 \u00fearf a\u00f0 \u00fdta undir gagnr\u00fdna
  hugsun \u00feeirra. Leyfa \u00feeim a\u00f0 sko\u00f0a hlutina \u00fat fr\u00e1
  sj\u00e1lfum s\u00e9r og hvernig \u00feau upplifa jafnr\u00e9tti. Kennarar eru mikilv\u00e6gur
  \u00fe\u00e1ttur \u00ed \u00feessu starfi \u00fev\u00ed \u00feau geta hj\u00e1lpa\u00f0
  b\u00f6rnunum a\u00f0 finna hvernig \u00f3r\u00e9ttl\u00e6ti er og hvernig s\u00e9
  h\u00e6gt a\u00f0 b\u00e6ta \u00fea\u00f0. Starfsf\u00f3lki ber a\u00f0 hvetja b\u00f6rnin
  til gagnr\u00fdnnar hugsunar um jafnr\u00e9tti auk \u00feess a\u00f0 fr\u00e6\u00f0a
  \u00feau um margbreytileika heimsins.  Starfsf\u00f3lk skal vera me\u00f0vita\u00f0
  um a\u00f0 fl\u00e9tta almennt jafnr\u00e9tti inn \u00ed allt sk\u00f3lastarf me\u00f0
  b\u00f6rnunum.  Hvetja \u00e1 til umr\u00e6\u00f0na og hafa n\u00e1msefni sem  eykur
  frekar \u00e1 skilning barnanna um margbreytileika.\\n\\n\u00de\u00e1 er mikilv\u00e6gt
  a\u00f0 n\u00fdta t\u00edmann til \u00feess  \u00ed samverustundum og \u00feemastarfi
  og me\u00f0 auknum n\u00e1msg\u00f6gnum um efni\u00f0.  Starfsf\u00f3lk skal vera
  uppl\u00fdst um a\u00f0 jafnr\u00e9tti stu\u00f0lar a\u00f0 b\u00e6ttu vinnuumhverfi
  og sk\u00f3laanda. Kennara eru ford\u00e6mi barnanna og \u00fev\u00ed \u00fearf
  g\u00e6ta \u00feess a\u00f0 vir\u00f0ing s\u00e9 til sta\u00f0ar \u00feeirra milli.\\n\\nJafnr\u00e9tti
  4-5 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n| A\u00f0 starfsf\u00f3lk
  og b\u00f6rn komi eins fram vi\u00f0 alla \u00f3h\u00e1\u00f0 kyni, uppruna, menningu
