  - A\u00f0 nemendur ver\u00f0i sj\u00e1lfst\u00e6\u00f0ir \u00ed vinnubr\u00f6g\u00f0um
  og viti um helstu h\u00e6ttur vefsins, geti for\u00f0ast \u00fe\u00e6r og sagt \u00f6\u00f0rum
  um \u00fe\u00e6r.\\nJafnr\u00e9tti - Nemendur geti fari\u00f0 eftir reglum internetsins
  en einnig n\u00fdtt s\u00e9r interneti\u00f0 \u00e1 al\u00fej\u00f3\u00f0argrundvelli.\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi - Nemendur l\u00e6ri a\u00f0 koma fram vi\u00f0 samnemendur
  og a\u00f0ra a\u00f0 vir\u00f0ingu og kurteisi en einnig a\u00f0ra \u00ed internet
