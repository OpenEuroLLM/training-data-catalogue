  F2 REITUR - SKIPULAGSSKILM\u00c1LAR\\n\\nMork deliskipulagssv\u00e6\u00f0is\\n\\nMILLIVATNS
  OG VEGAR\\n\\nELL\u00cdDAVTN\\n\\nNor\u00f0ur\\n\\nK\u00f3pavogi 30. ma\u00ed 2003\\nBirgir
  H. Sigur\u00f0sson, skipulagsstj\u00f3ri\\n\\n\u00a9 Landsvirkjun K\u00f3pavogur
  2003 - All rights reserved\\n\\nReitur F2\\n\\nALMENN \u00c1KV\u00c6\u00d0I FYRIR
  FJ\u00d6LEIGNARH\u00daS.\\n\\n1. SKIPULAGSSKILM\u00c1LAR, M\u00c6LIBL\u00d6\u00d0
  OG H\u00c6DRABL\u00d6\u00d0.\\n\\na) \u00cd skipulagsskilm\u00e1lum koma fram \u00e1kv\u00e6\u00f0i
  var\u00f0andi st\u00e6r\u00f0 og ger\u00f0 bygginga, \u00feakform, fr\u00e1gang
  l\u00f3\u00f0a og bygginga og fleira sem h\u00f6nnumbur ber a\u00f0 fara eftir.
  Einnig eru \u00fear sk\u00fdringarmyndir og \u00fdmsar \u00e1bendingar h\u00f6nnumbur
  og l\u00f3\u00f0arh\u00f6fum til gl\u00f6ggyvunar \u00e1 a\u00f0st\u00e6\u00f0um.\\n\\nb)
  M\u00e6libl\u00f6\u00f0 s\u00fdna st\u00e6r\u00f0 l\u00f3\u00f0ar, l\u00f3\u00f0arm\u00f6rk,
  byggingarretur l\u00f3\u00f0arh\u00fass og bilageymslu, ennfremur byggingartilrunur,
  fj\u00f6lda bilast\u00e6\u00f0a \u00e1 l\u00f3\u00f0 og kvadr\u00ed ef einhv\u00f8rjar
  eru o.fl.\\n\\nc) H\u00e6drabl\u00f6\u00f0 s\u00fdna he\u00f0urst\u00f6\u00f0u (k\u00f3ta)
  fyrir g\u00f3lfsf\u00e9\u00f0 \u00feess hluta h\u00e1ss, sem snyrt a\u00f0 g\u00f3tu
  e\u00f0a innk\u00e6ryslu (K), gangst\u00e9ttarh\u00e6\u00f0ir og g\u00f3lsh\u00e6\u00f0ur
  vi\u00f0 l\u00f3\u00f0arm\u00f6rk (G) og l\u00f3\u00f0arh\u00e6\u00f0ir \u00e1 m\u00f6rkum
  bakbl\u00f6\u00f0 (L). H\u00e6drabl\u00f6\u00f0 s\u00fdna jafnframt legu og h\u00e6\u00f0
  (botnk\u00f3ta) fr\u00e1reinslislagsina.\\n\\nd) Ef fram kemur mismunur \u00e1 deiliskipulagsuppdr\u00e6tti
  og skilm\u00e1lateikningu annars vegar og m\u00e6li- og h\u00e6drabl\u00f6\u00f0um
  hins vegar gilda hin s\u00e1bo\u00f0i\u00f0u.\\n\\n2. \u00c1DALUPPDR\u00c6TTIR.\\n\\na)
  \u00c1daluppr\u00e6ttir eru lag\u00f0ir fyrir byggingarnefnd til sam\u00feykktar.
  Skilm\u00e1lateikning skal fylgja a\u00f0alteikningum, \u00fe\u00f3 svo a\u00f0
  m\u00e1li\u00f0 hafi ekki \u00feurfit umfj\u00f6llun skipulagsnefndar. \u00cd byggingarregluger\u00f0
  nr. 441/1998 er n\u00e1kv\u00e6mlega sagt fyrir um ger\u00f0 a\u00f0alteikninga.\\n\\n3.
  FR\u00c1GANGUR L\u00d3\u00d0A.\\n\\na) H\u00f6nnun fj\u00f6lb\u00fdlish\u00fasak\u00f3la
  skal fylgja fyrir samt\u00f6kis a\u00f0alteikningum. H\u00fan skal hj\u00e1lpa sam\u00feykti
  byggingarnefndar a\u00f0 fengjast ums\u00f3kn landlagsger\u00f0itiks B\u00e6jarstigslags
  K\u00f3pavogs. \u00c1 teikningum skal koma fram:\\nYfirbr\u00e9faskr\u00e1ningar
  l\u00f3\u00f0ar, ha\u00f0anl\u00ednur, tegund gr\u00f3\u00f0urs og fr\u00e1gangur
  leikvar\u00f0is. S\u00e9rt\u00e6klega ber a\u00f0 hafa \u00ed huga greinjan a\u00f0gang
  barna a\u00f0 leikve\u00f0urum og \u00f6ryggi leiksv\u00e6\u00f0a gagnvart umf\u00e6r\u00f0.
  Allur b\u00faa\u00f0ur skal vera \u00ed samr\u00e6mi vi\u00f0 vi\u00f0burkenda sta\u00f0la.
  Einnig skal gera grein fyrir \u00e1komin sj\u00fakrabilla, sorpbilla og sl\u00f6kkvibilla
  eins og vi\u00f0 \u00e1 og kemur fram \u00ed 3ja kaffa byggingarregluger\u00f0ar.\\n\\nb)
  \u00cd \u00feritja kaffa byggingarregluger\u00f0ar eru einung \u00e1kv\u00e6\u00f0i
  um g\u00ed\u00f0ingar, st\u00f6\u00f0veggi og gr\u00f3\u00f0ur. Ber kemur m.a. fram
  a\u00f0 \\\"leita skal sam\u00feykktu byggingarnefndar \u00ed ger\u00f0 og fr\u00e1gangi
  g\u00ed\u00f0ingar ef h\u00fan er h\u00e6rri en 1,8 metrar e\u00f0a n\u00e6r l\u00f3\u00f0arm\u00f6rkum
  en sem sv\u00e6\u00f0i\u00f0 sem hennar m\u00e6li fisk jar\u00f0vegsh\u00e6\u00f0
  vi\u00f0 g\u00ed\u00f0inguna e\u00f0a fr\u00e1 h\u00e6\u00f0 \u00e1 l\u00f3\u00f0arm\u00f6rkum
  ef h\u00fan er meiri\\\". Ber kemur einnig fram a\u00f0 \\\"s\u00e9 tali\u00f0 a\u00f0lant\u00f6
  vi\u00f0 l\u00f3\u00f0arm\u00f6rk samh\u00e6gandi l\u00f3\u00f0a skal h\u00e6\u00f0
  \u00feeirra ekki vera meiri en 1,8 metrar ne\u00f0an l\u00f3\u00f0arh\u00e6fir beggja
  l\u00f3\u00f0a s\u00e9u samr\u00e6mla um anna\u00f0.\\\"\\n\\nEinnig a\u00f0 ekki
  m\u00e1 planta h\u00e1v\u00f6xnun trj\u00e1tengjendum ne\u00f0an l\u00f3\u00f0arm\u00f6rkum
  a\u00f0liggandi l\u00f3\u00f0a en 3,0 metra.\\n\\nc) L\u00f3\u00f0arh\u00e6fa s\u00e9r
  sj\u00e1lfur um framkv\u00e6mdir \u00e1 l\u00f3\u00f0 s\u00ednum. Allur fr\u00e1gangur
  l\u00f3\u00f0ar skal a\u00f0 jafnfr\u00e1 lok\u00f0i innan eitt \u00e1rs fr\u00e1
  \u00fev\u00ed a\u00f0 flutt er \u00ed meirihluta l\u00f3\u00f0u. K\u00f3pavogsb\u00e6r
  \u00e1\u00f0ur\u00f0u\u00f0 ber s\u00e9r til a\u00f0 gagna flutt l\u00f3\u00f0 \u00e1
  heim tilna l\u00ed\u00f0sma \u00e1 kosinni l\u00f3\u00f0arh\u00e6fa. Byggingarreglun
  ber a\u00f0 skilku\u00f0u\u00f0u fr\u00e1gangini sk\u00fdr, fyrrildigandi br\u00fanum
  til varanlegra kampenda. \u00d6fl st\u00f6llum \u00e1 l\u00f3\u00f0 skal ger\u00f0
  innan l\u00f3\u00f0ar \u00ed b\u00e6\u00f0i h\u00e6\u00f0 og milli uppgrefna he\u00f0anl\u00ednua
  n\u00e6ra anna\u00f0 s\u00e9 tek\u00f0 fram e\u00f0a um anna\u00f0 semst vi\u00f0
  a\u00f0liggandi l\u00f3\u00f0arh\u00e6fa. Komu upp fr\u00e1gangur um fr\u00e1gangi
  \u00e1 sameiginlegum l\u00f3\u00f0arm\u00f6rkum skal hitta \u00farskrift byggingarnefndar
  um lausn m\u00e1lsins. Fl\u00e1ti vi\u00f0 l\u00f3\u00f0arm\u00f6rk skal a\u00f0
  jafnfr\u00e1 ekki vera brattari en 1:2. \u00dear sem s\u00e9rkenni \u00ed landslagi
  eru fyrir hendi skal var\u00f0veita \u00feau eftir \u00fev\u00ed sem h\u00e6gt er.\\n\\nd)
  \u00cd l\u00f3\u00f0arleigasamningu eru einnig \u00fdmsar kv\u00f6\u00f0ur sem l\u00f3\u00f0arh\u00e6fa
  ber a\u00f0 fara eftir. Ekki er heimilt a\u00f0 moka e\u00f0a r\u00fd\u00f0ja jar\u00f0vegi
  \u00fat fyrir l\u00f3\u00f0arm\u00f6rk. L\u00f3\u00f0arvegir og sk\u00e1br\u00fatur
  \u00ed bilagylljara skulu vera \u00ed samr\u00e6mi vi\u00f0 skilm\u00e1la \u00feessu
  (s\u00e9rkve\u00f0ni) og skal s\u00fdna \u00e1 byggingarnefndateikningum. St\u00f6\u00f0veggr
  eru hluti af h\u00f6nnun h\u00e1ss og skal efni og yfirbrag\u00f0 vera \u00ed samr\u00e6mi
  vi\u00f0 \u00feau. Fjarl\u00e6g\u00f0 milli l\u00f3\u00f0arveggjar og g\u00f3tukants
  skal vera a.m.k. 2,5 metrar.\\n\\n4. HLIJ\u00d3BVIST \u00cd BYGGINGUM.\\n\\n\u00cd
  s\u00e9rkv\u00e6\u00f0um kemur fram ef \u00fe\u00faf er \u00e1 s\u00e9rtekinu a\u00f0ger\u00f0um
  \u00e1 l\u00f3\u00f0 e\u00f0a \u00ed byggingu vegna umfer\u00f0arh\u00e1va\u00f0a.
  H\u00f6nnu\u00f0ur eru minntir a\u00f0 fylgja \u00e1kv\u00e6\u00f0um \u00ed byggingarregluger\u00f0
  var\u00f0andi hlj\u00f3\u00f0vist innanh\u00fass.\\n\\n5. UMFERD.\\n\\n30 km sv\u00e6\u00f0i
  ver\u00f0a s\u00e9rt\u00e6klega au\u00f0kennd. \u00dear sem stofn- og tengistigar
  \u00fevera g\u00f6tur er gert r\u00e1\u00f0 fyrir merktum gangbrautum /upph\u00e6kunum.\\n\\n6.
  OPIN SV\u00c6\u00d0I TIL SAMEIGINLEGRA NOTA.\\n\\nOpin sv\u00e6\u00f0i til lei\u00f0sja
  og \u00fatveru innan deiliskipulagsins \u00fe.e. grenn davellir, almenningsgar\u00f0ur,
  \u00e1samt leiksk\u00f3la og grunnsk\u00f3la, bindast me\u00f0 stigum. Uppt\u00fdging
  og vi\u00f0haldi \u00feeirra ver\u00f0ur \u00e1 vegum K\u00f3pavogsb\u00e6jar. \u00d6nnub\u00f3\u00f0inu
  opin n\u00e1tt\u00farusv\u00e6\u00f0i ver\u00f0a var\u00f0veitt eins \u00f3s\u00f6ntin
  og kostur er. Ekki er heimilt a\u00f0 fara yfir slik sv\u00e6\u00f0i me\u00f0 vinnum\u00e6lar
  e\u00f0a \u00f6nnur farart\u00e6ki.\\n\\n7. TRJ\u00c1BELTI.\\n\\n\u00c1 nokkrum
  st\u00f6\u00f0um \u00ed hverfinu ver\u00f0ur planta\u00f0 trj\u00e1gr\u00f3\u00f0ri
  \u00e1 bejarlandi til skj\u00f6lmyndunar, afm\u00f6rku\u00f0u bejar\u00fdmis og
  til \u00feess a\u00f0 draga \u00far skafmyndanum Gr\u00f3\u00f0urst\u00e6tingu og
  vi\u00f0hald trj\u00e1gr\u00f3\u00f0rurs utan l\u00f3\u00f0a \u00e1 bejarlandi ver\u00f0ur
  \u00e1 vegum K\u00f3pavogsb\u00e6jar. Lei\u00f0beinandi sta\u00f0setning trj\u00e1belta
  kemur fram \u00e1 deiliskipulagsuppdr\u00e6tti.\\n\\n8. BILAGEYMSLUR OG B\u00cdLAST-\u00c6\u00d0I.\\n\\nGert
  er r\u00e1\u00f0 fyrir tveimur bilast\u00e6\u00f0um innan l\u00f3\u00f0ar fyrir
  hverja l\u00f3\u00f0i\u00f0 (st\u00e6\u00f0i \u00ed bilageymslu e\u00f0a kjallara
  telst anna\u00f0 tv\u00f8ggja \u00ed fj\u00f6lb\u00fdli). Gera skal r\u00e1\u00f0
  fyrir a\u00f0 l\u00f3\u00f0\u00edfa hvert st\u00e6\u00f0i ver\u00f0i bilast\u00e6\u00f0i
  fyrir fata\u00f0a.\\n\\n9. SKIKI TIL EINKA\u00c1FNOTA.\\n\\nFyrir l\u00f3\u00f0\u00f3\u00f0ir
  \u00e1 jar\u00f0h\u00e6\u00f0um skal afmarka skika til einka\u00e1fnota fyrir framan
  fata\u00f0ar og skulu \u00feeir s\u00fdn\u00f0ir \u00e1 \u00e1daluppr\u00e1ttum.\\n\\n10.
  SORP.\\n\\nLok\u00f0u sorpgeymnala skal vera \u00ed e\u00f0a vi\u00f0 hvert h\u00fas
  skv. gr. 84 \u00ed byggingarregluger\u00f0. Vi\u00f0 h\u00f6nnun sorpgeymnalan \u00ed
  fj\u00f6lb\u00fdlish\u00fasum skal s\u00e9rt\u00e6klega huga\u00f0 \u00e1 m\u00f6guleika
  \u00e1 flokkun sorps til framf\u00e6r\u00f0ar og skal bent \u00e1 grein 85.2 \u00ed
  byggingarregluger\u00f0 \u00ed \u00fev\u00ed sambandi. Flokkun sorps ver\u00f0i
  m\u00f6guleg \u00ed sameiginlegu sorph\u00fa\u00f0arvinni. \u00cd sorpgeymnukum
  \u00ed stefnili\u00f0 (einb\u00fdli og ra\u00f0b\u00fasm\u00f6nk) skal vera pl\u00e1ss
  fyrir tveir tunning fyrir hverja l\u00f3\u00f0i\u00f0 til flokkunar \u00e1 sorpi.
  Sta\u00f0setning og fr\u00e1gangur sorpgeymnala skal vera \u00feannig a\u00f0 \u00fe\u00e6r
  s\u00e9u a\u00f0gengilegar, en sem minnst \u00e1berandi. Sta\u00f0setnar sorpgeymnust
  skulu koma fram \u00e1 byggingarnefndateikningum og skal fr\u00e1gangi \u00feeirra
  \u00feeirra samh\u00f6ldi byggingu h\u00e1ss.\\n\\n11. \u00d6NNUR ALMENN \u00c1KV\u00c6\u00d0I.\\n\\nL\u00f3\u00f0arh\u00e6fa
  er skyld a\u00f0 fylgja \u00e1kv\u00e6\u00f0um byggingar-, brunam\u00e1la og helibrig\u00f0isregluger\u00f0ar,
  reglum um a\u00f0gengi fata\u00f0ra, svo sem vi\u00f0 \u00e1 \u00e1kv\u00e6\u00f0um
  veitusto\u00f0ana svo og \u00f6llum almennum \u00e1kv\u00e6\u00f0um er var\u00f0a
  \u00fathlutun, timan\u00f6kk og tryggingar. S\u00e9rt\u00e6klega er vakin athygli
  a\u00f0 a\u00f0 n\u00fdta afrensilsvisat til snj\u00f3brotaslu utanh\u00fass og
  lei\u00f0a \u00fea\u00f0 s\u00ed\u00f0an \u00ed l\u00f3gn fyrir regnvatamsfrenslu.\\n\\nGrunnmynd
  \u00ed mkv. 1:500 - D\u00e6mi\\nAllar sta\u00f0ir \u00ed metrum\\n\\nVATNSENDI,
  F2 REITUR - SKIPULAGSSKILM\u00c1LAR\\nFJ\u00d6LB\u00ddLISH\u00daS 3 H\u00c6\u00d0IR.
  (42 \u00edb\u00fa\u00f0ir)\\n\\nVATNSENDI, F2 REITUR - SKIPULAGSSKILM\u00c1LAR\\n\\nGrunnmynd
  af reit F2\\n\\nK\u00d3PAVOGSB\u00c6R\\nGrandahv\u00e6f 1, 3, 5 og 8 Sve\u00f0i
  F2\\n\\nBorgarstofan K\u00f3pavogur / Sveinn Birkisson \u00b7 16. j\u00fan\u00ed
  2002\\n\\nReitur F2\\n\\nFJ\u00d6LB\u00ddLISH\u00daS \u00c1 \u00deREMUR H\u00c6DUM,
  ALLT A\u00f0 24 \u00cdB\u00da\u00d0IR.\\n\\nGrandahvarf 1, 3, 5 og 8\\n\\nS\u00c9R\u00c1KV\u00c6\u00d0I.\\n\\n1.
  H\u00daSAGERD.\\nFj\u00f6sgur, briggja h\u00e6\u00f0a fj\u00f6lb\u00fdlish\u00fas,
  me\u00f0 s\u00e9rinn\u00f6gongum og allt a\u00f0 24 \u00edb\u00fa\u00f0um. Gert
  er r\u00e1\u00f0 fyrir fj\u00f6rum stakst\u00e6\u00f0um bilageymslu vi\u00f0 hvort
  h\u00fas.\\nSj\u00e1 n\u00e1nar skipulagsuppr\u00e1\u00f0 og skilm\u00e1lateikningu.\\n\\n2.
  H\u00d6NNUN H\u00daSA OG L\u00d3DA.\\nVi\u00f0 h\u00f6nnun h\u00fasa og l\u00f3\u00f0a
  skal mi\u00f0a vi\u00f0 a\u00f0 hvort tveggja falli sem best a\u00f0 \u00fev\u00ed
  landi sem fyrir er \u00ed v\u00e9lkomandi l\u00f3\u00f0. Leitast skal vi\u00f0 a\u00f0
  mynda skilj\u00f6ldg \u00fatv\u00f6ldarsv\u00e6\u00f0i sem sm\u00faa \u00ed sn\u00fa\u00f0ur
  \u2013 vestur. Einklegt er a\u00f0 samr\u00e6mis s\u00e9 gert milli einstakra h\u00fasa
  hva\u00f0 var\u00f0ar heildaryfirbrag\u00f0 og fr\u00e1sagn. Einn og samri h\u00f6nnunar
  skal vera a\u00f0 h\u00fasum \u00e1 samliggandi l\u00f3\u00f0um og skal hana geta
  samr\u00e6mi \u00ed h\u00f6nnun og ger\u00f0 \u00feeirra hva\u00f0 var\u00f0ar \u00fatlit
  og fr\u00e1sagn \u00fe.\u00e1.m. bakhalla, bakfr\u00e1gang, efnisval, af\u00e6r\u00f0
  og litaval \u00e1 einstokum byggingarhlutum.\\n\\n3. BYGGINGARREITUR.\\nSta\u00f0setning
  byggingareita er s\u00fdnd \u00e1 m\u00e6libl\u00f6\u00f0um og skilm\u00e1lateikningum.
  Fyrir hvort h\u00fas eru gefnar upp tv\u00e6rn konar byggingarreitir:\\n\\n- Ytri
  byggingarreitur, t\u00e1kna\u00f0ur me\u00f0 slitinnu l\u00ednu. Heimilt er a\u00f0
  bygga a\u00f0 ytri byggingarlinu (\u00fatbyggingar, \u00fe.\u00e1.m. svalir). A\u00f0huga\u00f0
  a\u00f0 svalir skulu vera amk. 1,6 metra brei\u00f0ar. H\u00fasi\u00f0 skal vera
  a\u00f0 \u00f6llu lei\u00f0 innan ytri byggingarreits.\\n\\n- Inni byggingarreitur,
  t\u00e1kna\u00f0ur me\u00f0 heldirgr\u00ednu l\u00ednu sem \u00e1framkar meginform
  h\u00fassins. Reitastur er leitheimandi byggingarlinu og s\u00fdnir sta\u00f0set
  umfang byggingar til ytri byggingarlinu. Ekki er um h\u00e1markarinnma a\u00f0 me\u00f0
  heldur leitheimandi fyrrmynd. L\u00e1gnarkarfjar\u00f0ag byggingar \u00ed l\u00f3\u00f0arm\u00f6rk,
  \u00fear sem ekki er bindandi byggingarlinu, skal \u00fea\u00f0 vera \u00ed sanznemi
  vi\u00f0 grein 75,1 \u00ed byggingarregluger\u00f0 nr. 441/1998. \u00deannig er
  l\u00e1gnarkarfjar\u00f0ag\u00f0 milli h\u00fasa \u00e1vallt trygg\u00f0.\\n\\n-
  Bindandi byggingarlinu, t\u00e1kna\u00f0 me\u00f0 heldirgr\u00ednu bl\u00e1rrri
  l\u00ednu sem \u00e1kv\u00e6\u00f0ar sta\u00f0setningu h\u00fass \u00e1 l\u00f3\u00f0
  og er bindandi. Amk. helmingur framhl\u00ed\u00f0ar h\u00fas skal fylgja bindandi
  byggingarlinu, \u00fe\u00f3 gera megji r\u00e1\u00f0 fyrir minni innakotum. Einstaka
  byggingarhlutar s.s. pakskegg, sk\u00fdggu, gluggafr\u00e1gangur, svalir, pallar,
  tr\u00f6ppur og bilageymslur mega skaga \u00fat fyrir bindandi byggingarlinu, skv.
  s\u00e9r\u00e1kv\u00e6\u00f0um h\u00fasager\u00f0a og na a\u00f0 ytri byggingarlinu.\\n\\n4.
  GRUNNEL\u00cdTUR H\u00daSA OG FJ\u00d6LDI \u00cdB\u00da\u00d0A.\\n\\nFj\u00f6lb\u00fdlish\u00fas
  \u00e1 \u00feremur h\u00e6\u00f0um, Grandahvarf 1, 3, 5 og 8\\n\\n| Konar | M\u00e6ling
  |\\n|-------|--------|\\n| Inni byggingarreitur h\u00fasa: | 252,0 fermetrar. |\\n|
  H\u00e1rmarksgrunnf\u00f3tur \u00fatb\u00fdgginga: | 20,0 fermetrar. |\\n| H\u00e1rmarksgrunnf\u00f3tur
  h\u00fasa: | 272,0 fermetrar. |\\n| H\u00e1rmarksflatarm\u00e1l h\u00fasa: | 816,0
  fermetrar \u00e1n kjallara. |\\n| Bilageymslur fyrir Grandahvarf 1, 3 og 5 | 330,0
  fermetrar. |\\n| H\u00e1rmarksflatarm\u00e1l bilageymslu: | 330,0 fermetrar. |\\n|
  Bilageymslur fyrir Grandahvarf 8 | 110,0 fermetrar. |\\n\\nH\u00e1rmarksflatarm\u00e1l
  bilageymslu: 110,0 fermetrar.\\n\\nHeimilt er a\u00f0 bygga h\u00fas sem eru minni
  a\u00f0 grunnfleti og flatarm\u00e1li.\\n\\nA\u00f0 h\u00e1rmarki er gert r\u00e1\u00f0
  fyrir 24 \u00edb\u00fa\u00f0um \u00e1 l\u00f3\u00f0um vi\u00f0 Grandahvarf 1, 3,
  5 og 8. Gert er r\u00e1\u00f0 fyrir s\u00e9rinn\u00f6gongum fyrir allar \u00edb\u00fa\u00f0ir.\\n\\n5.
  H\u00c6\u00d0 H\u00daSA.\\nH\u00fasah\u00e6\u00f0 er gefin upp sem a) bindandi h\u00e6\u00f0a/fj\u00f6ldi
  og b) h\u00e1rmarks\u00fe\u00e6\u00f0 byggingar yfir ne\u00f0ri a\u00f0komukota.
  \u00deegar talas er um h\u00e6\u00f0arfj\u00f6lda er a\u00f0 vi\u00f0 fulla h\u00e6\u00f0,
  \u00fe.e. \u00farveggur s\u00e9u \u00ed fullri lofta\u00f0 (ekki risha\u00f0 e\u00f0a
  porrb\u00fdgg risha\u00f0). Efsti hluti \u00feaks m\u00e1 n\u00fa upp \u00e1 uppg\u00f6fna
  h\u00e1marksha\u00f0, en getur veri\u00f0 l\u00e6gri. H\u00e6\u00f0ark\u00f6rtur
  fyrir a\u00f0komuh\u00e6\u00f0 h\u00fasa eru s\u00fdndir \u00e1 h\u00e6\u00f0arbl\u00f6\u00f0i
  (golfk\u00f6star -k). H\u00e1rmarks\u00fe\u00e6\u00f0 h\u00fasa er gefin upp \u00e1
  skilm\u00e1lateikningu og er h\u00fan mi\u00f0u\u00f0 vi\u00f0 h\u00e6\u00f0 yfir
  tilgreindum h\u00e6\u00f0ark\u00f3ta ne\u00f0ri a\u00f0komih\u00e6\u00f0ar. Mestu
  h\u00e6\u00f0 h\u00fass talist fr\u00e1 ne\u00f0ri a\u00f0komih\u00e6\u00f0ar er
  10,7 metrar. Byggingarhlutar sem \u00f3hj\u00e1kv\u00e6mlega n\u00e1 upp fyrir \u00feak,
  t.d. lyfuh\u00fas, pakkluggar, skorsteinar og loftressib\u00fa\u00f0ur mega \u00fe\u00f3
  fara upp fyrir h\u00e1rmarks\u00fe\u00e6\u00f0 \u00feaks.\\n\\n6. BAKFORM.\\nBakform
  er fj\u00e1rlast en ekki skal gera r\u00e1\u00f0 fyrir n\u00fdtingu \u00ed risi.\\n\\n7.
  BILAGEYMSLUR OG FJ\u00d6LDI BILAST\u00c6\u00f0A.\\n\u00c1 m\u00e6libl\u00f6\u00f0um
  og skilm\u00e1lateikningu er s\u00fdndur \u00e1 l\u00e1gnarkarfj\u00f6ldi bilasta\u00f0a
  sem leyss skal innan hverrar l\u00f3\u00f0ar, \u00fe\u00e6\u00f0i ofanfj\u00f6\u00f0ur
  og eins \u00ed bilageymslu og d\u00e6mi um sta\u00f0setningu bilasta\u00f0a og a\u00f0komu,
  en h\u00f6nnub\u00faum er heimilt a\u00f0 gera tillo\u00f0u a\u00f0 annari sta\u00f0setningu.
  Gera skal r\u00e1\u00f0 fyrir tveimur bilaste\u00f0um fyrir hverja \u00edb\u00fa\u00f0
  sem er st\u00e6rri en 80 fermetrar, en eitt sta\u00f0i\u00f0 ef \u00edb\u00fa\u00f0
  er minni en 80 fermetrar. Bilaste\u00f0i skulu vera me\u00f0 bundnu sititagi. Sami
  h\u00f6nnubur skal vera a\u00f0 \u00edb\u00fa\u00f0arhlutum og bilageymslum og skalu
  \u00fe\u00e6r byg\u00f0ar samhli\u00f0a \u00edb\u00fa\u00f0arhlutum. Gera skal r\u00e1\u00f0
  fyrir a\u00f0 t\u00f3fta hvert sta\u00f0i ver\u00f0i bilasta\u00f0i fyrir fadla\u00f0a.\\n\\n8.
  SORPGEYMSLUR.\\nLok\u00fa\u00f0 sorpgeymsla skal vera \u00ed e\u00f0a vi\u00f0 hvort
  h\u00fas skv. gr. 84 \u00ed byggingarregluger\u00f0. Vi\u00f0 h\u00f6nnun sorpgeymslu
  \u00ed fj\u00f6lb\u00fdlish\u00fasum skal s\u00e9rstaklega huga\u00f0 a\u00f0 m\u00f6guleika
  \u00e1 flokkun sorps til framlei\u00f0ar og skal bent \u00e1 grein 85,2 \u00ed byggingarregluger\u00f0
  \u00ed \u00fev\u00ed sambandi. Flokkun sorps ver\u00f0i m\u00f6guleik \u00ed sameiginlegu
  sorph\u00e1bur\u00fdmi. \u00cd sorpgeymslun \u00ed s\u00e9r\u00feyli (embly\u00f0i
  og ra\u00f0h\u00fasum) skal vera \u00fe\u00e1ss fyrir tveir numur fyrir hverja \u00edb\u00fa\u00f0
  til flokkunar \u00e1 sorpi. Sta\u00f0setning og fr\u00e1gangur sorpgeymslina skal
  vera \u00feunnig a\u00f0 \u00fe\u00e6r eru a\u00f0gengilegar, en sem minnast \u00e1berandi.
  Stakst\u00e6\u00f0ir sorpgeymslur skulu koma fram \u00e1 byggingarnefndarteikningum
  og skal fr\u00e1sagni \u00feeirra lok\u00f0i samhli\u00f0a byggingu h\u00fass.\\n\\n9.
  HLJ\u00d3\u00d0\u00d6VIST.\\nVisa\u00f0 er til regluger\u00f0ar nr. 933/1999 um
  h\u00e1va\u00f0a og lei\u00f0a til a\u00f0 draga \u00far og koma \u00ed veg fyrir
  h\u00e1va\u00f0a. Hlj\u00f3\u00f0\u00f6stig hefur veri\u00f0 \u00e6tla\u00f0 \u00e1
  \u00feessum reit m.v. gefnar forsendar fyrir hverfi\u00f0 fullbyggt. Skv. \u00feeirri
  \u00e6tlan ver\u00f0ur hlj\u00f3\u00f0\u00f6vist \u00e1 l\u00f3\u00f0 innan vi\u00f0mi\u00f0unarmarka
  mengunarv\u00e6nnarregluger\u00f0ar nr. 48/1994, sem eru 55 dB utanhusi \u00e1 n\u00fdjum
  hverfum.\\n\\n10. SKIKI TIL EINKAAFNOTA.\\nFyrir \u00edb\u00fa\u00f0ir \u00e1 jar\u00f0h\u00e6\u00f0um
  skal afmarka skikka til einkaafnota fyrir framan \u00edb\u00fa\u00f0ir og skulu
  \u00feeir s\u00fdndir \u00e1 a\u00f0aluppl\u00fdr\u00f0r\u00e6ttum.\\n\\nGrunnmynd
  \u00ed mkv. 1:500 - D\u00e6mi\\n\\nSnei\u00f0ing A-A \u00ed mkv. 1:500 - D\u00e6mi\\nAllar
  st\u00e6r\u00f0ir \u00ed metrum\\n\\nSnei\u00f0ing B-B \u00ed mkv. 1:500 - D\u00e6mi\\n\\nVATNSENDI,
  F2 REITUR - SKIPULAGSSKILM\u00c1LAR\\nFJ\u00d6LB\u00ddLISH\u00daS 3 H\u00c6DIR.
  (24 \u00edb\u00fa\u00f0ir)\\n\\nVATNSENDI, F2 REITUR - SKIPULAGSSKILM\u00c1LAR\\n\\nGrunnmynd
  af reit F2\\n\\nReitur F2\\n\\nFJ\u00d6LB\u00ddL\u00cdSHUS \u00c1 \u00deREMUR H\u00c6DUM,
  ALLT A\u00f0 18 \u00cdB\u00daDIR.\\n\\nGrandahvarf 2, 4, og 6\\n\\nS\u00c9R\u00c1KV\u00c6DI.\\n\\n1.
  H\u00daSAGERD.\\nBr\u00fa, \u00feriggja h\u00e6\u00f0 fj\u00f6lb\u00fdl\u00edsus,
  me\u00f0 s\u00e9rinng\u00f6ngum og allt a\u00f0 18 \u00edb\u00fa\u00f0um. Gert er
  r\u00e1\u00f0 fyrir tveimur bilageymslum \u00ed hverju h\u00fasi.\\n\\nSj\u00e1
  n\u00e1nar sk\u00edpulagsuppr\u00e1\u00f0ir og skilmi\u00f0lateikningar.\\n\\n2.
  H\u00d6NNUN H\u00daSA OG L\u00d3\u00d0A.\\nVi\u00f0 h\u00f6nnun h\u00fasa og l\u00f3\u00f0a
  skal mi\u00f0a vi\u00f0 a\u00f0 hvoru tveggja falli sem best a\u00f0 hv\u00ed landi
  sem fyrir er \u00ed vi\u00f0komandi l\u00f3\u00f0. Leitast skal vi\u00f0 a\u00f0
  myndla skilgj\u00f6ld \u00fativistarsv\u00e6\u00f0i sem sn\u00faa \u00ed su\u00f0ur
  - vestur. \u00c6skilegt er a\u00f0 samr\u00e6mis s\u00e9 gert milli einstakra h\u00fasa
  hva\u00f0 var\u00f0ar heildaryfirbr\u00e1\u00f0 og fr\u00e1gang. Einn og sami h\u00f6nnunar
  skal vera a\u00f0 h\u00fasum \u00e1 samliggjandi l\u00f3\u00f0um og skal hann g\u00e6ta
  samr\u00e6mis \u00ed h\u00f6nnun og ger\u00f0 \u00feeirra hva\u00f0 var\u00f0ar
  \u00fatlit og fr\u00e1gang \u00fe.a.m. \u00feakhalla, \u00feakfr\u00e1gang, efnisval,
  \u00e1fer\u00f0 og litval \u00e1 einst\u00f6kum byggingarhlutum.\\n\\n3. BYGGINGARREITUR.\\nSta\u00f0setning
  byggingarreitir er s\u00fdnd \u00e1 m\u00e6libl\u00f6\u00f0um og skilmi\u00f0lateikningum.
  Fyrir hvert h\u00fas eru gefnir upp tv\u00e6rna konar byggingarreitir:\\n\\n- Ytri
  byggingarreitir, t\u00e1kna\u00f0ur me\u00f0 slittini linu. Heimilt er a\u00f0 byggja
  a\u00f0 ytri byggingarlinu (\u00fatbyggingar, \u00fe.a.m. svalir). Athugi\u00f0
  a\u00f0 svalir skulu vera umk. 1,6 metra brei\u00f0ar. H\u00fasi\u00f0 skulu vera
  a\u00f0 l\u00edlu leiti innan ytri byggingarreits.\\n\\n- Innri byggingarreitir,
  t\u00e1kna\u00f0ur me\u00f0 heldeigini linu sem afmarkar meginform h\u00fassins.
  Reiturnar er lei\u00f0beinandi byggingarflotun og s\u00fdnir a\u00f0eins umfang
  byggingar \u00fat fr\u00e1 byggingarlinu. Ekkje er um h\u00e1markar\u00e6mna a\u00f0
  re\u00f0a heldur lei\u00f0beinandi fyrirmynd. L\u00e1marks\u00fearfleg\u00f0 byggingar
  \u00ed l\u00f3\u00f0arm\u00f6rk, \u00fear sem ekki er bindandi byggingarlinu, skal
  \u00fe\u00f3 vera \u00ed samr\u00e6mi vi\u00f0 grein 75,1 \u00ed byggingarregluger\u00f0
  nr. 441/1998. Hannig er l\u00e1marks\u00fearfleg\u00f0 milli h\u00fasa \u00e1vallt
  trygg\u00f0.\\n\\n- Bindandi byggingarlinu, t\u00e1kna\u00f0u me\u00f0 heildireignu
  bl\u00e1tri linu sem \u00e1kv\u00e6\u00f0ar sta\u00f0setningu h\u00fass \u00e1 l\u00f3\u00f0
  og er bindandi. Amk. helmingur framhl\u00ed\u00f0ar h\u00fas skal fylgia bindandi
  byggingarlinu, \u00fe\u00f3 gera megi r\u00e1\u00f0 fyrir minni innskotum. Einstaka
  byggingarh\u00fatar s.s. \u00feakskegg, skyggni, gluggafr\u00e1gangur, svalar, pallar,
  tr\u00f6ppur og bilageymslur mega skaga \u00fat fyrir bindandi byggingarlinu, skv.
  s\u00e9r\u00e1kv\u00e6\u00f0um h\u00fasager\u00f0a og na a\u00f0 ytri byggingarlinu.\\n\\n4.
  GRUNNFL\u00d3TUR H\u00daSA OG L\u00d3\u00d0I \u00cdB\u00daDA.\\n\\nFj\u00f6lb\u00fdl\u00edsuh\u00fas
  \u00e1 \u00feremur h\u00e6\u00f0um, Grandahvarf 2, 4, og 6\\n\\n| H\u00fasi | Grunnfl\u00f3tur
  |\\n|------|-------------|\\n| Innri byggingarreitir h\u00fasa: | 252,0 fermetrar.
  |\\n| H\u00e1rmarksgrunnfl\u00f3tur \u00fatbygginga: | 20,0 fermetrar. |\\n| H\u00e1rmarksgrunnfl\u00f3tur
  h\u00fasa: | 272,0 fermetrar. |\\n| H\u00e1rmarksflatarm\u00e1l h\u00fasa: | 816,0
  fermetrar \u00e1n kjallara. |\\n\\nHeimilt er a\u00f0 byggja h\u00fas sem eru minni
  a\u00f0 grunnfleti og flatarm\u00e1li.\\n\\nA\u00f0 h\u00e1rmarki er gert r\u00e1\u00f0
  fyrir 18 \u00edb\u00fa\u00f0um \u00e1 l\u00f3\u00f0um vi\u00f0 Grandahvarf 2, 4
  og 6. Gert er r\u00e1\u00f0 fyrir s\u00e9rinng\u00f6ngum fyrir allar \u00edb\u00fa\u00f0ir.\\n\\n5.
  H\u00c6D H\u00daSA.\\nH\u00fash\u00e6\u00f0 er gefin upp sem a) bindandi ha\u00f0arfj\u00f6ldi
  og b) h\u00e1markar\u00e6mna byggingar yfir ne\u00f0ri a\u00f0komuh\u00e6\u00f0.
  \u00deegar tal\u00f0 er um ha\u00f0arfj\u00f6lda er \u00e1tt vi\u00f0 fulla h\u00e6\u00f0,
  \u00fe.e. \u00fatvoggu s\u00e9r \u00ed fullri lofti\u00f0 (ekki risuh\u00e6\u00f0
  e\u00f0a por\u00f0bygg\u00f0 risuh\u00e6\u00f0). Efsti hluti paks m\u00e1 n\u00e1
  upp \u00ed uppg\u00f6fna h\u00e1markar\u00e6\u00f0u, en getur veri\u00f0 lengri.
  Ha\u00f0ark\u00f6tur fyrir a\u00f0komuh\u00e6\u00f0 h\u00fasa eru s\u00fdndir \u00e1
  ha\u00f0arbl\u00e1\u00f0i (golfk\u00f3tari -k). H\u00e1markar\u00e6\u00f0u h\u00fasa
  er gefin upp \u00e1 skilmi\u00f0lateikningu og er h\u00fan mi\u00f0u\u00f0 vi\u00f0
  h\u00e6\u00f0 yfir tilgreindum ha\u00f0ark\u00f6tu ne\u00f0ri a\u00f0komuh\u00e6\u00f0ar.
  Mesta h\u00e6\u00f0 h\u00fass tal\u00f0 fr\u00e1 ne\u00f0ri a\u00f0komuh\u00e6\u00f0
  er 10,7 metrar. Byggingarh\u00fatar sem \u00f3hj\u00e1kv\u00e6mlega n\u00e1 upp
  fyrir jak, t.d. lyftuh\u00fas, \u00feakguggar, skorsteinar og loftressaib\u00fa\u00f0ar
  mega \u00fe\u00f3 fara upp fyrir h\u00e1markar\u00e6\u00f0u paks.\\n\\n6. B\u00c1KFORM.\\nPakform
  er fj\u00e1rlast en ekki skal gera r\u00e1\u00f0 fyrir n\u00fdtingu \u00ed risi.\\n\\n7.
  BILAGEYMSLUR OG FJ\u00d6LDI B\u00cdLAST\u00c6\u00d0A.\\n\u00c1 m\u00e6libl\u00f6\u00f0um
  og skilmi\u00f0lateikningu er s\u00fdndur s\u00e1 l\u00e1marksfj\u00f6ldi b\u00edlast\u00e6\u00f0a
  sem leysa skal innan hverrar l\u00f3\u00f0ar, \u00fe\u00e6\u00f0i ofanjar\u00f0ar
  og eins \u00ed bilageymslu og d\u00e6mi um sta\u00f0setningu b\u00edlast\u00e6\u00f0a
  og a\u00f0komu, en h\u00f6nnu\u00f0um er heimilt a\u00f0 gera till\u00f6ggu a\u00f0
  annarri sta\u00f0setningu. Gera skal r\u00e1\u00f0 fyrir tveimur b\u00edlast\u00e6\u00f0um
  fyrir hverja \u00edb\u00fa\u00f0 sem er st\u00e6rri en 80 fermetrar, en eitt st\u00e6\u00f0i
  ef \u00edb\u00fa\u00f0 er minni en 80 fermetrar. B\u00edlast\u00e6\u00f0i skulu
  vera me\u00f0 bundnu s\u00edltagi. Sami h\u00f6nnu\u00f0ur skal vera a\u00f0 b\u00edlast\u00e6\u00f0isum
  og bilageymslum og skulu \u00fe\u00e6r bygg\u00f0ar samhli\u00f0a fisi\u00f0arh\u00fasum.
  Gera skal r\u00e1\u00f0 fyrir a\u00f0 t\u00f3fta hvert sta\u00f0i ver\u00f0i b\u00edlast\u00e6\u00f0i
  fyrir fatladdi.\\n\\n8. SORPGEYMSLUR.\\nLokub sorpgeymslur skal vera \u00ed e\u00f0a
  vi\u00f0 hvert h\u00fas skv. gr. 84 \u00ed byggingarregluger\u00f0. Vi\u00f0 h\u00f6nnun
  sorpgeymslina \u00ed fj\u00f6lb\u00fdl\u00edsuh\u00fasum skal serst\u00e5kega huga\u00f0
  a\u00f0 m\u00f6guleika \u00e1 floknum sorps til framf\u00f6r\u00f0 og skal bent
  \u00e1 grein 85,2 \u00ed byggingarregluger\u00f0 \u00ed \u00fev\u00ed sambandi.
  Flokun sorps ver\u00f0i m\u00f6guleg \u00ed sameiginlegu sorphr\u00ed\u00f0urmi\u00f0.
  I sorpgeymslun \u00ed s\u00e9r\u00feyli (einbyl og ra\u00f0h\u00fasum) skal vera
  \u00fer\u00e1s pl\u00f6ss fyrir tvar tunnur fyrir hverja \u00edb\u00fa\u00f0 til
  flokunar \u00e1 sorpi. Sta\u00f0setning og fr\u00e1gangur sorpgeymslina skal vera
  \u00feannig a\u00f0 \u00fe\u00e6r s\u00e9u a\u00f0gengilegar, en sem m\u00ednust
  \u00e1berandi. Stakst\u00e6\u00f0ir sorpgeymslur skulu koma fram \u00e1 byggingarnefndarteikningum
  og skal fr\u00e1gangur \u00feeirra lok\u00f0i samhli\u00f0a byggingu h\u00fass.\\n\\n9.
  HLJ\u00d3\u00d0VIST.\\nVi\u00f0a\u00f0 er til regluger\u00f0ar nr. 933/1999 um h\u00e1v\u00e1\u00f0a
  og lei\u00f0a til a\u00f0 dra\u00f0a \u00far og koma \u00ed veg fyrir h\u00e1v\u00e1\u00f0a.
  Hlj\u00f3\u00f0stig hefur veri\u00f0 \u00e6tla\u00f0 a\u00f0 \u00feessum reit m.v.
  gefnar forsendur fyrir hverfi\u00f0 fullbyggt. Skv. \u00feeirri \u00e6tlu\u00f0um
  ver\u00f0ur hlj\u00f3\u00f0vist \u00e1 l\u00f3\u00f0 innan vi\u00f0mi\u00f0unarmarka
  mengunarvarnarregluger\u00f0ar nr. 48/1994, sem eru 55 dB utanh\u00fass \u00ed n\u00fdjun
  hverfum.\\n\\n10. SKIKI TIL EINKAAFNOTA.\\nFyrir \u00edb\u00fa\u00f0ir \u00e1 jar\u00f0h\u00e6\u00f0um
  skal afmarka skikja til einkaafnota fyrir framan \u00edb\u00fa\u00f0ir og skulu
  \u00feeir s\u00fdndir \u00e1 a\u00f0aluppr\u00e1\u00f0ritum.\\n\\nGrunnmynd \u00ed
  mkv. 1:500 - D\u00e6mi\\n\\nSnei\u00f0ing A-A \u00ed mkv. 1:500 - D\u00e6mi\\nAllar
  st\u00e6r\u00f0ir \u00ed metrum\\n\\nSnei\u00f0ing B-B \u00ed mkv. 1:500 - D\u00e6mi\\n\\nVATNSENDI,
