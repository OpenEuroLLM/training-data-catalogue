  me\u00f0 og me\u00f0 hverjum |\\n| A\u00f0 kynna fyrir b\u00f6rnunum a\u00f0 ekki
  eru allir eins og \u00fea\u00f0 s\u00e9 \u00ed lagi a\u00f0 vera \u00feannig | Fjalla
  um l\u00edkamann og \u00feann mismun sem er \u00e1 drengjum og st\u00falkum. Fjalla
