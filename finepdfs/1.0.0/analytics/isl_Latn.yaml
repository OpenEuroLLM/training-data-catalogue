  "\"\\n\\nEfnisyfirlit\\n\\nForm\u00e1li\\n\\nLeiksk\u00f3linn Ki\u00f0agil er fj\u00f6gurra
  deilda sk\u00f3li a\u00f0 Ki\u00f0agili 9 \u00e1 Akureyri, s\u00edmi: 414-3770.\\n\\nNetfang
  sk\u00f3lans er kidagil@akureyri.\\n\\nHeimas\u00ed\u00f0a sk\u00f3lans erhttp://kidagil.karellen.is/\\n\\nSk\u00f3lastj\u00f3ri
  er Inda Bj\u00f6rk Gunnarsd\u00f3ttir. Sk\u00f3linn t\u00f3k til starfa \u00e1ri\u00f0
  1995 og var tveggja deilda \u00fev\u00ed Giljask\u00f3li var til h\u00fasa \u00ed
  helmingnum af h\u00fasinu. \u00c1ri\u00f0 1998 var\u00f0 hann fj\u00f6gurra\\n\\ndeilda
  og fimm deilda um \u00e1ram\u00f3tin 2000-2001 \u00feegar \u00fatistofa var tekin
  \u00ed notkun. Um hausti\u00f0 2004 var\u00f0 hann aftur 4 deildir me\u00f0 96 r\u00fdmum.\\n\\n\u00datg\u00e1fusta\u00f0ur:
  Akureyri\\n\\n\u00datg\u00e1fu\u00e1r: 2019\\n\\nYfirfarin af Katr\u00ednu J\u00f3hannesd\u00f3ttur
  2020\\n\\n4\\n\\n1. Ytri a\u00f0st\u00e6\u00f0ur\\n\\nYfirstj\u00f3rn leiksk\u00f3lam\u00e1la\\n\\nFr\u00e6\u00f0slur\u00e1\u00f0
  fer me\u00f0 m\u00e1lefni leiksk\u00f3la og grunnsk\u00f3la \u00e1 Akureyri, samkv\u00e6mt
  l\u00f6gum og regluger\u00f0um, sveitarstj\u00f3rnarl\u00f6gum og \u00fev\u00ed
  sem b\u00e6jarstj\u00f3rn felur henni a\u00f0 \u00f6\u00f0ru leyti. Fr\u00e6\u00f0slur\u00e1\u00f0
  er skipu\u00f0 fimm fulltr\u00faum og fimm til vara, kosnum af b\u00e6jarstj\u00f3rn.
  Fr\u00e6\u00f0slustj\u00f3ri  situr fundi fr\u00e6\u00f0slur\u00e1\u00f0s me\u00f0
  m\u00e1lfrelsi og till\u00f6gur\u00e9tt, einnig leiksk\u00f3lafulltr\u00fai \u00feegar
  fjalla\u00f0 er um m\u00e1lefni leiksk\u00f3la. A\u00f0rir sem sitja fundi sk\u00f3lanefndar
  me\u00f0 m\u00e1lfrelsi og till\u00f6gur\u00e9tt eru: Einn fulltr\u00fai foreldra
  sem er tilnefndur \u00e1 sameiginlegum fundi fulltr\u00faa foreldraf\u00e9laga fr\u00e1
  hverjum leiksk\u00f3la, einn fulltr\u00fai leiksk\u00f3lastj\u00f3ra og einn fulltr\u00fai
  starfsmanna leiksk\u00f3la.\\n\\nFr\u00e6\u00f0slusvi\u00f0\\n\\nFr\u00e6\u00f0slusvi\u00f0
  Akureyrarb\u00e6jar fer me\u00f0 yfirstj\u00f3rn leiksk\u00f3lanna, fj\u00e1rm\u00e1l,
  \u00e1\u00e6tlanager\u00f0, innritun barna, stefnum\u00f3tun og skipulagsm\u00e1l.
  Svi\u00f0sstj\u00f3ri fr\u00e6\u00f0slusvi\u00f0s er n\u00e6sti yfirma\u00f0ur leiksk\u00f3lastj\u00f3ra
  Akureyrarb\u00e6jar.  Vi\u00f0 fr\u00e6\u00f0slusvi\u00f0 starfar einnig verkefnastj\u00f3ri
  leiksk\u00f3la, leiksk\u00f3lar\u00e1\u00f0gjafi og forst\u00f6\u00f0uma\u00f0ur
  rekstrar. \u00deessir a\u00f0ilar annast r\u00e1\u00f0gj\u00f6f vi\u00f0 leiksk\u00f3lastj\u00f3ra
  v/ stj\u00f3rnunar og rekstrarlega \u00fe\u00e1tta.\\n\\nLeiksk\u00f3lar\u00e1\u00f0gj\u00f6f\\n\\nLeiksk\u00f3lar\u00e1\u00f0gjafi
  er leiksk\u00f3lastj\u00f3rum og starfsf\u00f3lki leiksk\u00f3lanna faglegur r\u00e1\u00f0gjafi
  um m\u00e1lefni einstakra nemenda. Foreldrar leiksk\u00f3labarna geta leita\u00f0
  til leiksk\u00f3lar\u00e1\u00f0gjafa me\u00f0 m\u00e1l tengd b\u00f6rnum s\u00ednum
  og leiksk\u00f3ladv\u00f6l \u00feeirra. R\u00e1\u00f0gj\u00f6f vegna einstakra nemenda
  fer fram fr\u00e1 fr\u00e6\u00f0slusvi\u00f0i  og/e\u00f0a fj\u00f6lskyldusvi\u00f0i
  Akureyrarb\u00e6jar.\\n\\nKennslur\u00e1\u00f0gjafi vegna s\u00e9rkennslum\u00e1la  annast
  faglega r\u00e1\u00f0gj\u00f6f til leiksk\u00f3lastj\u00f3ra og annarra starfsmanna
  leiksk\u00f3la, vegna nemenda sem \u00feurfa \u00e1 s\u00e9rkennslu a\u00f0 halda.
  Fr\u00e6\u00f0slusvi\u00f0 Akureyrarb\u00e6jar s\u00e9r um a\u00f0 veita nemendum
  s\u00e1lfr\u00e6\u00f0i- og talmeina\u00fej\u00f3nustu.\\n\\nH\u00e1sk\u00f3linn
  \u00e1 Akureyri veitir stofnanar\u00e1\u00f0gj\u00f6f til leiksk\u00f3lanna a\u00f0
  bei\u00f0ni leiksk\u00f3lastj\u00f3ra og/e\u00f0a fr\u00e6\u00f0slusvi\u00f0s. Fr\u00e6\u00f0slusvi\u00f0
  og H\u00e1sk\u00f3linn \u00e1 Akureyri hafa gert me\u00f0 s\u00e9r rammasamning.
  Samningurinn felur \u00ed s\u00e9r stofnana r\u00e1\u00f0gj\u00f6f og er stu\u00f0ningur
  vi\u00f0 sk\u00f3lana sem stofnanir. Leiksk\u00f3larnir s\u00e6kja um \u00fe\u00e1
  \u00fej\u00f3nustu sem \u00feeir \u00f3ska eftir, einnig getur sk\u00f3la\u00fer\u00f3unarsvi\u00f0
  HA haft frumkv\u00e6\u00f0i a\u00f0 verkefnum.\\n\\n2. N\u00e1mskr\u00e1 Ki\u00f0agils\\n\\nForsendur
  sk\u00f3lan\u00e1mskr\u00e1r\\n\\nA\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la er ger\u00f0
  \u00e1 grundvelli 13. gr. laga um leiksk\u00f3la, nr. 90/2008. Efnislega byggist
  h\u00fan \u00e1 markmi\u00f0um 2. gr. laga um leiksk\u00f3la og er \u00e6tla\u00f0
  a\u00f0 vera lei\u00f0arv\u00edsir fyrir leiksk\u00f3lastarf. Leita skal jafnv\u00e6gis
  milli st\u00falkna og drengja \u00ed \u00f6llu leiksk\u00f3lastarfi.\\n\\nL\u00f6g
  um leiksk\u00f3la\\n\\nSamkv\u00e6mt l\u00f6gum nr. 90/2008 bera sveitarf\u00e9l\u00f6g
  megin\u00e1byrg\u00f0 \u00e1 rekstri leiksk\u00f3la. Menntam\u00e1lar\u00e1\u00f0uneyti\u00f0
  m\u00f3tar uppeldisstefnu leiksk\u00f3la og s\u00e9r um a\u00f0 fram fari mat \u00e1
  leiksk\u00f3lastarfi.\\n\\nRegluger\u00f0 um starfsemi leiksk\u00f3la nr. 225/1995\\n\\nRegluger\u00f0
  \u00feessi tekur til leiksk\u00f3la sem starfa \u00e1 grundvelli laga nr. 78/1994
  og kve\u00f0ur h\u00fan \u00e1 um \u00fe\u00e1 \u00fe\u00e6tti \u00ed rekstri leiksk\u00f3la
  sem eru grunnforsendur \u00feess a\u00f0\\n\\nuppeldismarkmi\u00f0um 2.gr. laganna
  ver\u00f0i n\u00e1\u00f0.\\n\\nFylgirit nr. 2 (Regluger\u00f0 um starfssemi leiksk\u00f3la)\\n\\nA\u00f0aln\u00e1mskr\u00e1
  leiksk\u00f3la\\n\\nA\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la er stefnum\u00f3tandi
  lei\u00f0arv\u00edsir um uppeldisst\u00f6rf \u00ed leiksk\u00f3lum og \u00e1 a\u00f0
  mynda sveigjanlegan starfsramma. \u00c1 grundvelli \u00feessa lei\u00f0arv\u00edsis
  \u00e1 s\u00e9rhver leiksk\u00f3li a\u00f0 gera eigin sk\u00f3lan\u00e1mskr\u00e1.\\n\\nA\u00f0aln\u00e1msskr\u00e1
  leiksk\u00f3la\\n\\n\u2756 er fagleg stefnum\u00f6rkun um uppeldis- og menntunarhlutverk
  leiksk\u00f3lans\\n\u2756 byggist \u00e1 barnv\u00e6nni hugmyndafr\u00e6\u00f0i
  \u00fear sem \u00feroski barna og \u00fearfir eru \u00feungami\u00f0ja.\\n\u2756
  er \u00e6tla\u00f0 a\u00f0 samr\u00e6ma uppeldi og menntun barna \u00ed leiksk\u00f3lum
  landsins.\\n\u2756 er vi\u00f0mi\u00f0 vi\u00f0 mat \u00e1 leiksk\u00f3lastarfi
  og menntun leiksk\u00f3lakennara.\\n\u2756 er \u00e6tla\u00f0 a\u00f0 tryggja g\u00e6\u00f0i
  \u00ed leiksk\u00f3la og jafna uppeldisa\u00f0st\u00f6\u00f0u barna.\\n\\nSk\u00f3lan\u00e1mskr\u00e1\\n\\nSk\u00f3lan\u00e1mskr\u00e1
  er yfirl\u00fdsing um hugmyndafr\u00e6\u00f0i, skipulag, vinnubr\u00f6g\u00f0 og
  gildi sem l\u00f6g\u00f0 eru til grundvallar leiksk\u00f3lastarfinu. H\u00fan byggir
  \u00e1 \u00fev\u00ed sem samf\u00e9lagi\u00f0 telur mikilsvert og \u00fev\u00ed
  \u00far menningararfinum sem tali\u00f0 er mikilv\u00e6gt a\u00f0 koma \u00e1lei\u00f0is
  til n\u00e6stu kynsl\u00f3\u00f0ar. Foreldrar bera frum\u00e1byrg\u00f0 \u00e1 uppeldi
  barna sinna en leiksk\u00f3lastarfi\u00f0 er vi\u00f0b\u00f3t vi\u00f0 \u00fea\u00f0
  uppeldi sem b\u00f6rnin f\u00e1 \u00e1 heimilum s\u00ednum. Leiksk\u00f3linn er
  fyrir \u00f6ll b\u00f6rn, \u00f3h\u00e1\u00f0 andlegu og l\u00edkamlegu atgervi,
  menningu e\u00f0a tr\u00fa.\\n\\n2.1. Hlutverk leiksk\u00f3lans og stefna Ki\u00f0agils\\n\\nLeiksk\u00f3linn
  er uppeldis- og menntunarstofnun. Hann leggur \u00e1herslu \u00e1 leikinn sem n\u00e1ms
  og \u00feroskalei\u00f0 og leggur r\u00e6kt vi\u00f0 skapandi eiginleika, starf
  og uppg\u00f6tvunarn\u00e1m barnsins. Hann er \u00fej\u00f3nustustofnun og sinnir
  \u00fev\u00ed hlutverki, veitir b\u00f6rnunum \u00f6ruggan samasta\u00f0 utan heimilis.\\n\\nLeiksk\u00f3linn
  er vi\u00f0b\u00f3t vi\u00f0 heimili\u00f0, sinnir uppeldislegum \u00fe\u00e1ttum
  \u00ed samvinnu vi\u00f0 \u00fea\u00f0. Sk\u00f3lan\u00e1mskr\u00e1:\\n\\n\u2756
  Gerir sk\u00f3lastarfi\u00f0 s\u00fdnilegra\\n\u2756 Veitir yfirs\u00fdn yfir allar
  forsendur \u00ed rekstri sk\u00f3la\\n\u2756 Gerir sk\u00f3lastarfi\u00f0 markvissara
  og au\u00f0veldara\\n\u2756 Veitir heildars\u00fdn yfir uppeldisstarfi\u00f0\\n\u2756
  Gefur starfsf\u00f3lki sk\u00fdrar uppl\u00fdsingar um hvers er v\u00e6nst af \u00fev\u00ed\\n\u2756
  Gerir n\u00fdli\u00f0um au\u00f0veldara a\u00f0 komast inn \u00ed starfi\u00f0\\n\u2756
  Au\u00f0veldar markvisst samstarf vi\u00f0 foreldra og a\u00f0ra samstarfsa\u00f0ila.\\n\\n3.
  N\u00e1msvi\u00f0 Leiksk\u00f3lans\\n\\nN\u00e1mssvi\u00f0 leiksk\u00f3la eru \u00e1herslu\u00fe\u00e6ttir
  \u00ed leiksk\u00f3lauppeldi. \u00deeir eru L\u00e6si, L\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi, Heilbrig\u00f0i og velfer\u00f0, Jafnr\u00e9tti og sk\u00f6pun.
  N\u00e1mssvi\u00f0in skarast og eru \u00feau samofin undirst\u00f6\u00f0u\u00fe\u00e1ttum
  leiksk\u00f3lastarfsins. Fagmennska, vir\u00f0ing, leikur og l\u00e6si er lei\u00f0arlj\u00f3s
  starfsmanna \u00e1 Ki\u00f0agili.\\n\\n3.1 L\u00e6si\\n\\nHugmyndafr\u00e6\u00f0i
  sk\u00f3lans byggir \u00e1 l\u00e6si og a\u00f0 s\u00fdna hvort \u00f6\u00f0ru vir\u00f0ingu
  \u00ed leik og starfi. Vi\u00f0 leitumst vi\u00f0 a\u00f0 styrkja hvort anna\u00f0
  og auka vir\u00f0ingu fyrir n\u00e1mi hvers og eins. Me\u00f0 \u00fev\u00ed a\u00f0
  auka getuna til l\u00e6sis hj\u00e1lpar \u00fea\u00f0 \u00f6llum til a\u00f0 \u00f6\u00f0last
  uppbyggjandi samskipti, j\u00e1kv\u00e6\u00f0ni og hj\u00e1lpsemi.\\n\\nTungum\u00e1li\u00f0
  er eitt mikilv\u00e6gasta t\u00e6ki mannanna til bo\u00f0skipta og hugsunar. \u00dev\u00ed
  ber a\u00f0 leggja \u00e1herslu \u00e1 a\u00f0 n\u00fdta m\u00e1li\u00f0 \u00ed
  v\u00ed\u00f0um skilningi. \u00dea\u00f0 gerum vi\u00f0 me\u00f0 samt\u00f6lum,
  spurningum, lestri, s\u00f6gum, kv\u00e6\u00f0um og \u00feulum. Markvissir l\u00e6sis
  t\u00edmar eru \u00ed hverri viku auk \u00feess sem allt er merkt sem gerir nemendum
  au\u00f0veldara a\u00f0 l\u00e6ra hugt\u00f6kin. B\u00e6kur eru haf\u00f0ar \u00ed
  bo\u00f0i fyrir b\u00f6rn og \u00feeim kennt a\u00f0 umgangast \u00fe\u00e6r, velta
  fyrir s\u00e9r uppbyggingu \u00feeirra, fletta bla\u00f0s\u00ed\u00f0u fyrir bla\u00f0s\u00ed\u00f0u,
  \u00fev\u00ed me\u00f0 auknum \u00feroska l\u00e6ra \u00feau a\u00f0 lesa me\u00f0
  a\u00f0sto\u00f0 mynda. L\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 efla skilning
  \u00e1 m\u00e1linu \u00fear sem tj\u00e1ning er mikilv\u00e6gur \u00fe\u00e1ttur
  og hvetjum vi\u00f0 b\u00f6rnin til a\u00f0 n\u00fdta s\u00e9r m\u00e1li\u00f0 \u00ed
  leik og starfi, spyrja spurninga, segja sko\u00f0anir s\u00ednar og r\u00e6\u00f0a
  um li\u00f0na atbur\u00f0i. \u00de\u00e1 eru reglubundnar skimanir \u00e1 \u00f6llum
  deildum nema yngstu. Ger\u00f0 er \u00farb\u00f3ta\u00e1\u00e6tlun fyrir \u00feau
  b\u00f6rn sem koma illa \u00fat \u00far skimuninni.\\n\\nOr\u00f0 og b\u00f3kstafir
  eru s\u00fdnilegir sem hj\u00e1lpart\u00e6ki til a\u00f0 l\u00e6ra b\u00f3kstafi
  og or\u00f0. L\u00e6si er ekki bara a\u00f0 l\u00e6ra b\u00f3kstafi og lestur heldur
  er \u00fea\u00f0 samheiti yfir marga \u00fe\u00e6tti eins og samskipti, t\u00e1kn,
  menningu, myndm\u00e1l, \u00fdmis t\u00e1knkerfi, umhverfi\u00f0 og hlustun. S\u00ed\u00f0ar
  \u00fer\u00f3ast tungum\u00e1li\u00f0 \u00ed \u00e1kve\u00f0i\u00f0 ferli sem skipuleggur
  hugsanir barnanna.\\n\\n\u00dev\u00ed fleiri or\u00f0 og hugt\u00f6k sem hvert barn
  hefur l\u00e6rt og tileinka\u00f0 s\u00e9r skilning \u00e1, \u00feeim mun fullkomnari
  ver\u00f0ur hugsun \u00feess. \u00deetta ferli til aukins vitsmuna\u00feroska n\u00e6st
  ekki \u00f6\u00f0ruv\u00edsi en me\u00f0 n\u00e1mi.\\n\\nVerklag kennara er eins
  \u00e1 \u00f6llum deildum hva\u00f0 var\u00f0ar l\u00e6si og \u00e1herslur \u00ed
  kennslu \u00fear sem \u00f6llum b\u00f6rnum er skapa\u00f0 t\u00e6kif\u00e6ri til
  a\u00f0 tj\u00e1 sig og taka \u00fe\u00e1tt \u00ed samr\u00e6\u00f0um \u00fev\u00ed
  \u00fear eykst or\u00f0afor\u00f0inn og skilningur. B\u00f6rnunum er veittur a\u00f0gangur
  a\u00f0 s\u00fdnilegu ritm\u00e1li b\u00e6\u00f0i \u00ed myndum og texta.\\n\\n\u00cd
  uppbyggingu l\u00e6sis var byggt \u00e1 \u201ebyrjendal\u00e6si\\\" lestrarkennslua\u00f0fer\u00f0
  sem \u00fer\u00f3u\u00f0 var af R\u00f3su Eggertsd\u00f3ttur, s\u00e9rfr\u00e6\u00f0ingi
  vi\u00f0 Sk\u00f3la\u00fer\u00f3unarsvi\u00f0 H\u00e1sk\u00f3lans \u00e1 Akureyri,
  sem byggir \u00e1 samvirkri n\u00e1lgun margra \u00fe\u00e1tta. A\u00f0fer\u00f0in
  var a\u00f0l\u00f6gu\u00f0 n\u00e1msskipulagi leiksk\u00f3la \u00ed samvinnu vi\u00f0
  \u00de\u00f3ru R\u00f3su Geirsd\u00f3ttur og Jenn\u00fdju Gunnbj\u00f6rnsd\u00f3ttur
  s\u00e9rfr\u00e6\u00f0inga \u00e1 Sk\u00f3la\u00fer\u00f3unarsvi\u00f0i H.A.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 leggja \u00e1herslu \u00e1 l\u00e6si. A\u00f0 allt s\u00e9 s\u00fdnilegt
  b\u00e6\u00f0i stafir og t\u00f6lur\\n\u2756 A\u00f0 \u00f6rva \u00fe\u00e1 \u00fe\u00e6tti
  hj\u00e1 b\u00f6rnunum sem \u00fdta undir lestrarn\u00e1m.\\n\u2756 A\u00f0 nota
  hv -spurningar (hva\u00f0, hvernig, hvers vegna).\\n\u2756 A\u00f0 \u00e6fa me\u00f0
  b\u00f6rnunum frams\u00f6gn, spuna og fr\u00e1sagnir.\\n\u2756 A\u00f0 bera vir\u00f0ingu
  fyrir \u00edslenskri tungu.\\n\u2756 A\u00f0 \u00f6llum l\u00ed\u00f0i vel \u00ed
  sk\u00f3lanum og leitist vi\u00f0 a\u00f0 gera andr\u00famslofti\u00f0 j\u00e1kv\u00e6tt
  b\u00e6\u00f0i \u00ed leik og starfi.\\n\u2756 A\u00f0 \u00f6rva hugmyndaflug barnanna.\\n\u2756
  A\u00f0 hagsmunir barnsins s\u00e9 haf\u00f0ur a\u00f0 lei\u00f0arlj\u00f3si og
  s\u00e9 rau\u00f0i \u00fer\u00e1\u00f0urinn \u00ed gegnum allt b\u00e6\u00f0i leik
  og n\u00e1m.\\n\\nLei\u00f0ir:\\n\\n\u2756 Hafa  allt  merkt og \u00ed h\u00e6\u00f0
  barnanna til a\u00f0 vekja forvitni \u00feeirra.\\n\u2756 Vera me\u00f0 markvissar
  l\u00e6sis stundir \u00fear sem b\u00f6rnin f\u00e1 a\u00f0 spreyta sig \u00e1 hugt\u00f6kum
  og or\u00f0um\\n\u2756 Hvetja b\u00f6rnin til a\u00f0 svara og hj\u00e1lpa \u00feeim
  a\u00f0 finna or\u00f0in\\n\u2756 Nota h\u00f3pstundir til a\u00f0 \u00e6fa \u00feau
  \u00ed a\u00f0 koma fram og segja fr\u00e1 og kenna m.a. r\u00edm og \u00feulur,
  s\u00f6gur, lj\u00f3\u00f0, s\u00f6ngur og \u00fej\u00e1lfun hugtaka og \u00feau
  hv\u00f6tt til a\u00f0 semja sj\u00e1lf.\\n\u2756 Heims\u00e6kja b\u00f3kas\u00f6fn
  og f\u00e1 fr\u00e6\u00f0slu um b\u00e6kur og anna\u00f0 efni.\\n\\n3.2 Heilbrig\u00f0i
  og velfer\u00f0\\n\\n\u00cd Ki\u00f0agili er l\u00f6g\u00f0 \u00e1hersla \u00e1
  a\u00f0 \u00fej\u00e1lfa b\u00f6rnin \u00ed f\u00e9lagsf\u00e6rni en Daniel Goleman
  skrifa\u00f0i um tilfinningagreind og skilgreindi hana sem h\u00e6fileikann til
  a\u00f0 gera s\u00e9r grein fyrir eigin tilfinningum og annarra, til \u00feess a\u00f0
  geta greint \u00e1 milli \u00feeirra og nota\u00f0 vitneskjuna s\u00e9r til lei\u00f0beiningar
  \u00ed hugsun, \u00e1kvar\u00f0anat\u00f6ku og framkv\u00e6md.\\n\\n\u00cd Ki\u00f0agili
  er l\u00f6g\u00f0 \u00e1hersla \u00e1 g\u00f3\u00f0an f\u00e9lagsanda, \u00feannig
  a\u00f0 \u00f6llum l\u00ed\u00f0i vel og s\u00e9u \u00e1n\u00e6g\u00f0ir, jafnt
  b\u00f6rnum sem fullor\u00f0num. \u00d6ll b\u00f6rn fara \u00ed \u00ed\u00fer\u00f3ttah\u00fas
  a\u00f0ra hvora viku, \u00fe\u00e1 hefur veri\u00f0 bo\u00f0i\u00f0 upp \u00e1 j\u00f3gan\u00e1mskei\u00f0
  og dans. \u00cd leiksk\u00f3lanum er st\u00f3r salur sem b\u00fain er \u00fdmsum
  t\u00e6kjum til \u00ed\u00fer\u00f3ttai\u00f0kunar og er hann vel n\u00fdttur af
  \u00f6llum. \u00d6llum \u00e1 a\u00f0 finnast \u00feeir vera mikilv\u00e6gir \u00ed
  s\u00ednu starfi og a\u00f0 \u00feeir beri \u00e1byrg\u00f0 og umhyggju fyrir \u00f6\u00f0rum.
  Vir\u00f0ing er borin fyrir b\u00f6rnunum og getu \u00feeirra. L\u00f6g\u00f0 er
  \u00e1hersla \u00e1 a\u00f0 \u00feau afli s\u00e9r reynslu og \u00feekkingar \u00e1
  eigin forsendum og a\u00f0 \u00feau noti til \u00feess m.a. tilfinningar, hreyfingar,
  sj\u00f3nr\u00e6na skynjun, leik og skapandi starf.\\n\\nB\u00f6rn hafa r\u00edka
  \u00fe\u00f6rf fyrir a\u00f0 hreyfa sig frj\u00e1lst og \u00f3hindra\u00f0. \u00cd
  leiksk\u00f3la ber \u00fev\u00ed a\u00f0 leggja \u00e1herslu \u00e1 hreyfingu barna
  og hreyfiuppeldi. B\u00f6rn tj\u00e1 sig snemma me\u00f0 hreyfingum, \u00feau skynja
  l\u00edkama sinn, finna styrk sinn og getu. G\u00f3\u00f0 hreyfif\u00e6rni eykur
  sj\u00e1lfstraust barnsins og hreyfing b\u00e6tir heilsu, snerpu og \u00feol. L\u00edkamlegri
  \u00e1reynslu fylgir hv\u00edld og \u00fear skynjar barni\u00f0 mun \u00e1 spennu
  og sl\u00f6kun.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 \u00f6rva f\u00edn- og gr\u00f3fhreyfingar.\\n\u2756
  A\u00f0 auka \u00fathald og snerpu.\\n\u2756 A\u00f0 stu\u00f0la a\u00f0 betri andlegri
  og l\u00edkamlegri l\u00ed\u00f0an einstaklingsins.\\n\u2756 A\u00f0 skapa gott
  svigr\u00fam og a\u00f0st\u00e6\u00f0ur til hreyfingar, b\u00e6\u00f0i \u00fati
  og inni.\\n\u2756 A\u00f0 skapa t\u00e6kif\u00e6ri til hreyfingar \u00ed takt vi\u00f0
  t\u00f3nlist.\\n\u2756 Leggja \u00e1herslu \u00e1 a\u00f0 n\u00fdta \u00feau sv\u00e6\u00f0i
  sem sk\u00f3linn hefur upp \u00e1 a\u00f0 bj\u00f3\u00f0a, s.s. salinn og gar\u00f0inn
  til skipulag\u00f0ra hreyfistunda \u00ed bland vi\u00f0 frj\u00e1lsa hreyfileiki.\\n\u2756
  Hvetja b\u00f6rnin til hreyfingar t.d. me\u00f0 h\u00f3pleikjum og g\u00f6ngufer\u00f0um/vettvangsfer\u00f0um.\\n\u2756
  Leggja \u00e1herslu \u00e1 a\u00f0 hvert barn f\u00e1i a.m.k. 1 skipulag\u00f0a
  hreyfistund \u00ed viku.\\n\u2756 Hafa \u00e6t\u00ed\u00f0 a\u00f0gengilegt n\u00e1msefni
  sem stu\u00f0lar a\u00f0 g\u00f3\u00f0ri samh\u00e6fingu f\u00edn- og gr\u00f3fhreyfinga.\\n\u2756
  N\u00fdta t\u00f3nlist til frj\u00e1lsra hreyfinga.\\n\\n3.3 Sk\u00f6pun\\n\\nB\u00f6rn
  hafa r\u00edka \u00fe\u00f6rf fyrir a\u00f0 tj\u00e1 sig me\u00f0 myndm\u00e1li,
  \u00feau eiga au\u00f0velt me\u00f0 a\u00f0 tj\u00e1 tilfinningar s\u00ednar \u00ed
  sk\u00f6pun, sem eflir l\u00edka sj\u00e1lfstraust barnsins. \u00cd Ki\u00f0agili
  er leitast vi\u00f0 a\u00f0 n\u00fdta allt sem h\u00e6gt er til sk\u00f6punar. Endurn\u00fdtanlegur
  efnivi\u00f0ur er miki\u00f0 nota\u00f0ur sem \u00fdtir undir forvitni barnanna.
  B\u00f6rnunum er veitt fj\u00f6lbreytileg t\u00e6kif\u00e6ri til a\u00f0 tj\u00e1
  sig \u00ed myndum og margs konar m\u00f3tanlegum efnivi\u00f0.\\n\\nMikilv\u00e6gt
  er a\u00f0 taka tillit til \u00e1huga barnanna og kynna fyrir \u00feeim mismunandi
  efnivi\u00f0 og \u00e1h\u00f6ld sem efla hugmyndarflug \u00feeirra og getu. Gefa
  \u00fearf \u00feeim t\u00edma til a\u00f0 \u00edgrunda \u00fev\u00ed \u00feannig
  eykst \u00edmyndunarafl \u00feeirra. B\u00f6rn \u00feurfa frj\u00e1lsr\u00e6\u00f0i
  svo \u00feau \u00f6\u00f0list frumkv\u00e6\u00f0i og kjark til a\u00f0 skapa \u00fea\u00f0
  sem \u00feeim langar til. \u00de\u00e1 sn\u00fdst sk\u00f6punin ekki bara um eitthvert
  verk heldur felst h\u00fan \u00ed \u00fev\u00ed a\u00f0 hvetja b\u00f6rnin til a\u00f0
  nota hugmyndaflugi\u00f0 \u00ed hverskonar leikjum\\n\\nLei\u00f0ir:\\n\\nme\u00f0
  kubba, leir, leikr\u00e6nni tj\u00e1ningu, umr\u00e6\u00f0u um hluti og frv. Leikurinn
  er mikilv\u00e6gt t\u00e6ki \u00ed sk\u00f6pun og er honum gefin g\u00f3\u00f0ur
  t\u00edmi \u00ed starfinu. Skapandi starf \u00e1 a\u00f0 beinast a\u00f0 \u00fev\u00ed
  sem gert er \u00fear sem allir f\u00e1i noti\u00f0 s\u00edn \u00e1 s\u00ednum forsendum.
  Kennarar gegna \u00fear mikilv\u00e6gu hlutverki og eru \u00feeir me\u00f0vita\u00f0ir
  um mikilv\u00e6gi \u00feess a\u00f0 gefa \u00f6llum t\u00edma til sk\u00f6punar.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 gefa b\u00f6rnunum t\u00e6kif\u00e6ri til a\u00f0 tj\u00e1 sig \u00ed gegnum
  myndlistina.\\n\u2756 A\u00f0 auka \u00edmyndunarafl og \u00feroska hvers barns
  \u00ed gegnum myndlist.\\n\u2756 A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 kynnast \u00feeim
  fj\u00f6lbreytta efnivi\u00f0 sem tengist leiksk\u00f3lastarfi.\\n\u2756 A\u00f0
  b\u00f6rnin f\u00e1i t\u00e6kif\u00e6ri til a\u00f0 \u00edgrunda og skapa \u00fea\u00f0
  sem \u00feau hafa \u00e1huga \u00e1 \u00ed daglegu l\u00edfi.\\n\u2756 A\u00f0 b\u00f6rnin  kynni
  verk s\u00edn fyrir \u00f6\u00f0rum.\\n\u2756 A\u00f0 b\u00f6rnin f\u00e1i t\u00e6kif\u00e6ri
  til a\u00f0 b\u00faa til s\u00edn eigin hlj\u00f3\u00f0f\u00e6ri.\\n\u2756 A\u00f0
  sungi\u00f0 s\u00e9 reglulega me\u00f0 b\u00f6rnunum.\\n\u2756 A\u00f0 \u00fej\u00e1lfa
  me\u00f0 b\u00f6rnunum hlustun.\\n\\nLei\u00f0ir:\\n\\n\u2756 Gefa b\u00f6rnunum
  kost \u00e1 a\u00f0 vinna \u00e1 s\u00ednum forsendum og \u00feroska, s.s. yngstu
  b\u00f6rnin vilja \u00fereifa,  kreista, m\u00e1la me\u00f0 fingrum/pensli \u00e1
  me\u00f0an eldri b\u00f6rnin m\u00e1la, klippa, l\u00edma og hafa fyrirfram \u00e1kve\u00f0nar
  hugmyndir um hva\u00f0 \u00feau \u00e6tla a\u00f0 gera.\\n\u2756 Passa upp \u00e1
  a\u00f0 efnivi\u00f0urinn s\u00e9 a\u00f0gengilegur b\u00f6rnunum svo \u00feau geti
  gengi\u00f0 a\u00f0 honum frj\u00e1ls.\\n\u2756 Gefa b\u00f6rnunum t\u00edma til
  \u00feess a\u00f0 r\u00e6\u00f0a verk s\u00edn vi\u00f0 kennara og hin b\u00f6rnin.\\n\u2756
  Umhverfiss\u00e1ttm\u00e1li Ki\u00f0agils:\\no Verndum umhverfi\u00f0.\\no Endurn\u00fdtum
  allt sem h\u00e6gt er.\\no Flokkum \u00fargang og vinnum a\u00f0 jar\u00f0ger\u00f0.\\n\u2756
  T\u00f3nlist og s\u00f6ngur s\u00e9 notu\u00f0 \u00ed dagsins \u00f6nn, s.s. \u00ed
  samverustundum og fataherberginu.\\n\u2756 Skapa a\u00f0st\u00e6\u00f0ur \u00fear
  sem b\u00f6rnin geti b\u00fai\u00f0 til s\u00edn eigin hlj\u00f3\u00f0f\u00e6ri
  s.s. \u00ed h\u00f3pastarfi og frj\u00e1lsum leik.\\n\u2756 Hj\u00e1lpa b\u00f6rnunum
  a\u00f0 kanna hlj\u00f3\u00f0heim sinn og hlusta \u00e1 umhverfi\u00f0 og n\u00e1tt\u00faruna.\\n\\n3.4
  L\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi\\n\\nB\u00f6rn eiga a\u00f0 f\u00e1
  r\u00edkuleg t\u00e6kif\u00e6ri til a\u00f0 nj\u00f3ta \u00feess sama og allir a\u00f0rir
  \u00f3h\u00e1\u00f0 tr\u00fa, menningu og litarhafti. \u00c1 Ki\u00f0agili er stu\u00f0la\u00f0
  a\u00f0 \u00fev\u00ed a\u00f0 b\u00f6rn \u00feroski me\u00f0 s\u00e9r \u00fe\u00e1
  vitneskju a\u00f0 \u00feau geta haft \u00e1hrif \u00e1 eigin l\u00ed\u00f0an og
  getu. A\u00f0st\u00e6\u00f0ur eru vel skipulag\u00f0ar til a\u00f0 b\u00f6rnunum
  l\u00ed\u00f0i vel og finni til \u00f6ryggis. \u00d6llum b\u00f6rnum er skapa\u00f0
  sama t\u00e6kif\u00e6ri\u00f0 hvort sem er \u00ed frj\u00e1lsum leik e\u00f0a skipul\u00f6g\u00f0um.
  \u00de\u00e1 er unni\u00f0 me\u00f0 a\u00f0 b\u00f6rnin hj\u00e1lpi hvort \u00f6\u00f0ru,
  s\u00fdni vir\u00f0ingu og leiti s\u00e9r \u00feekkingar og f\u00e1i sv\u00f6r vi\u00f0
  \u00feeim spurningum er upp koma.\\n\\nB\u00f6rnum er gefinn t\u00edmi til a\u00f0
  \u00edgrunda, spyrja og f\u00e1 sv\u00f6r \u00e1samt \u00fev\u00ed a\u00f0 \u00feau
  eru hv\u00f6tt til a\u00f0 n\u00fdta h\u00e6fnina til a\u00f0 leysa \u00far \u00e1greiningi
  vi\u00f0 leikf\u00e9lagann. \u00deemastarfi\u00f0 er byggt upp \u00e1 hverri deild
  og er \u00fea\u00f0 unni\u00f0 samhli\u00f0a leiksk\u00f3lal\u00e6si og \u00feemavinnu.
  Samstarf milli leiksk\u00f3lans, heimilis og umhverfisins vel n\u00fdtt. B\u00f6rnin
  eru hv\u00f6tt til a\u00f0 n\u00fdta sk\u00f6punarkraftinn, mynda s\u00e9r sko\u00f0anir
  og framkv\u00e6ma \u00e1 eigin forsendum. \u00ddtt er undir sj\u00e1lfstraust \u00feeirra
  og getu, me\u00f0 hvatningu og umhyggju fyrir gj\u00f6r\u00f0um \u00feeirra.\\n\\nMarkmi\u00f0\\n\\n\u2756
  A\u00f0 allir taki virkann \u00fe\u00e1tt og nj\u00f3ti \u00feess sama.\\n\u2756
  A\u00f0 efla b\u00f6rnin \u00ed a\u00f0 bera \u00e1byrg\u00f0.\\n\u2756 A\u00f0
  allir nj\u00f3ti \u00feess saman \u00f3h\u00e1\u00f0 kyni.\\n\u2756 A\u00f0 gefa
  b\u00f6rnunum \u00feann t\u00edma sem \u00feau \u00feurfa til a\u00f0 \u00feroskast.\\n\u2756
  A\u00f0 \u00fdta undir \u00e1hugasvi\u00f0 \u00feeirra sem eykur \u00feekkingu og
  \u00feor.\\n\\nLei\u00f0ir\\n\\n\u2756 Kennarar s\u00e9u me\u00f0vita\u00f0ir um
  a\u00f0 allir eigi sama r\u00e9tt.\\n\u2756 Kenna b\u00f6rnunum a\u00f0 taka \u00e1byrg\u00f0
  \u00e1 sj\u00e1lfum s\u00e9r og s\u00ednum gj\u00f6r\u00f0um.\\n\u2756 Allir f\u00e1i
  \u00fea\u00f0 sama.\\n\u2756 A\u00f0 gera ekki kr\u00f6fu \u00e1 eitthva\u00f0 sem
  kennarar vita a\u00f0 barn r\u00e6\u00f0ur ekki vi\u00f0, gefa \u00f6llum t\u00edma.\\n\u2756
  Finna \u00fat hvar \u00e1hugasvi\u00f0 barnanna liggur og n\u00fdta \u00fea\u00f0
  til kennslu og sk\u00f6punar.\\n\\n3.5 Jafnr\u00e9tti\\n\\nSk\u00f3lastarf \u00e1
  hverjum sta\u00f0 m\u00f3tast e\u00f0lilega af \u00fev\u00ed umhverfi sem \u00feeir
  b\u00faa vi\u00f0, atvinnuf\u00e9lags- og menningarlegu. Sk\u00f3linn \u00fearf
  a\u00f0 taka tillit til mismunandi fj\u00f6lskylduger\u00f0a og uppruna barnanna
  og efla tilfinningu \u00feeirra fyrir \u00fev\u00ed a\u00f0 \u00feau tilheyri samf\u00e9laginu
  og s\u00e9u hluti af \u00fev\u00ed. Allir hafa sama r\u00e9tt \u00f3h\u00e1\u00f0
  kyni. A\u00f0 \u00feessu m\u00e1 stu\u00f0la me\u00f0 samskiptum vi\u00f0 starfsemi
  utan sk\u00f3lans og n\u00fdtingu umhverfisins til vettvangsfer\u00f0a og leikja.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 b\u00f6rnin l\u00e6ri a\u00f0 vir\u00f0a og kynnist landi s\u00ednu og \u00fej\u00f3\u00f0.\\n\u2756
  A\u00f0 b\u00f6rnin f\u00e1i t\u00e6kif\u00e6ri til a\u00f0 kynnast \u00f3l\u00edkri
  menningu.\\n\u2756 Gefa b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 fara \u00e1
  listas\u00f6fn, b\u00f3kas\u00f6fn og horfa \u00e1 myndb\u00f6nd \u00fear sem \u00feau
  kynnast landi s\u00ednu og \u00fej\u00f3\u00f0.\\n\u2756 A\u00f0 veita b\u00f6rnunum
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 hafa samskipti vi\u00f0 b\u00f6rn \u00ed \u00f6\u00f0rum
  sk\u00f3lum, landshlutum e\u00f0a milli landa t.d. me\u00f0 heims\u00f3knum, br\u00e9faskriftum
  og t\u00f6lvup\u00f3sti.\\n\u2756 Kynna fyrir  b\u00f6rnunum menningu og bakgrunn
  barna af erlendum uppruna og kynna fyrir \u00feeim, s.s. \u00ed formi matarger\u00f0ar
  e\u00f0a me\u00f0 myndb\u00f6ndum  og lestri b\u00f3ka.\\n\u2756 Hj\u00e1lpa b\u00f6rnunum
  a\u00f0 l\u00e6ra mikilv\u00e6gi umfer\u00f0armenningar \u00ed samskiptum manna
  svo \u00feau l\u00e6ri almennar heg\u00f0unarreglur \u00ed umfer\u00f0inni s.s.
  \u00ed formi g\u00f6ngufer\u00f0a.\\n\\n3.6 Sj\u00e1lfb\u00e6rni\\n\\nSj\u00e1lfb\u00e6rni
  felur \u00ed s\u00e9r n\u00e1m sem eykur m.a. f\u00e6rni barna og ungmenna til \u00feess
  a\u00f0 takast \u00e1 vi\u00f0 margv\u00edsleg \u00e1litam\u00e1l, \u00e1greiningsm\u00e1l
  sem stu\u00f0la a\u00f0 vilja \u00feeirra og \u00e1huga til \u00feess a\u00f0 taka
  \u00fe\u00e1tt \u00ed samf\u00e9laginu.\\n\\n\u00deekking \u00e1 n\u00e1tt\u00farunni
  og fyrirb\u00e6rum hennar er manninum l\u00edfsnau\u00f0synleg \u00fear sem afkoma
  hans er undir henni komin. B\u00f6rn \u00feurfa a\u00f0 kynnast fj\u00f6lbreytileika
  n\u00e1tt\u00farunnar og nj\u00f3ta hennar um lei\u00f0 og \u00feau l\u00e6ra a\u00f0
  finna til \u00e1byrg\u00f0ar gagnvart henni. Sk\u00f3lanum ber a\u00f0 fr\u00e6\u00f0a
  b\u00f6rn um n\u00e1tt\u00faruna, umhverfi\u00f0 og verndun \u00feess. \u00deessu
  ver\u00f0ur best vi\u00f0 komi\u00f0 me\u00f0 fer\u00f0um \u00fat \u00ed n\u00e1tt\u00faruna
  \u00fear sem b\u00f6rnin gera s\u00ednar eigin athuganir og vinna \u00far \u00feeim
  eftir getu. Einfaldar e\u00f0lis- og efnafr\u00e6\u00f0itilraunir vekja l\u00edka
  \u00e1huga og \u00e1n\u00e6gju barna.\\n\\nKi\u00f0agil vill auka \u00feekkingu
  f\u00f3lks og vir\u00f0ingu fyrir n\u00e1tt\u00farunni. Sk\u00f3linn er Umhverfisverndar
  sk\u00f3li. Innan sk\u00f3lans fer fram flokkun \u00e1 rusli. \u00ddmis konar papp\u00edr,
  plasti, k\u00f6ssum og \u00f6\u00f0ru rusli sem til fellur er safna\u00f0 \u00ed
  st\u00f3ran poka. \u00deegar pokinn er fullur\\n\\nLei\u00f0ir:\\n\\nkemur h\u00f3pur
  fr\u00e1 einhverri deildinni og flokkar innihaldi\u00f0 eftir gildandi reglum sem
  eru um flokkun sorps.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 b\u00f6rn l\u00e6ri
  a\u00f0 bera \u00e1byrg\u00f0 og vir\u00f0ingu fyrir umhverfi s\u00ednu.\\n\u2756
  A\u00f0 b\u00f6rn fr\u00e6\u00f0ist um n\u00e1tt\u00faru- og umhverfisvernd og kynnist
  fj\u00f6lbreytileika n\u00e1tt\u00farunnar, komist \u00ed lifandi tengsl vi\u00f0
  hana og nj\u00f3ti hennar markvisst me\u00f0 \u00f6llum skynf\u00e6rum s\u00ednum.\\n\u2756
  A\u00f0 b\u00f6rn f\u00e1i t\u00e6kif\u00e6ri til a\u00f0 n\u00fdta n\u00e1tt\u00faruna
  og n\u00e6sta umhverfi til leikja, myndsk\u00f6punar og tilrauna.\\n\u2756 A\u00f0
  efla l\u00edkamlegan \u00feroska, \u00ferek og heilbrig\u00f0i sem gefst \u00ed
  n\u00e1nd vi\u00f0 n\u00e1tt\u00faruna og \u00fativist.\\n\u2756 Fara \u00ed n\u00e1tt\u00faru-
  og sko\u00f0unarfer\u00f0ir \u00ed formi fj\u00f6rufer\u00f0a, sveitafer\u00f0a,
  fuglasko\u00f0unarfer\u00f0a og \u00ed Lystigar\u00f0inn.\\n\u2756 Veita b\u00f6rnunum
  t\u00e6kif\u00e6ri til ranns\u00f3kna- og v\u00edsindastarfs \u00ed sko\u00f0unarfer\u00f0um
  \u00feannig a\u00f0 \u00feau \u00edgrundi, sko\u00f0i og rannsaki umhverfi\u00f0
  sitt og hvetja \u00feau til a\u00f0 safna efnivi\u00f0i til myndsk\u00f6punar og
  vinnslu.\\n\u2756 Fr\u00e6\u00f0a  \u00feau um d\u00fdr, pl\u00f6ntur, \u00e1rst\u00ed\u00f0ir,
  ve\u00f0urfar, r\u00e6ktun og umgengni vi\u00f0 n\u00e1tt\u00faruna.\\n\u2756 Kenna
  \u00feeim a\u00f0 hl\u00faa a\u00f0 l\u00f3\u00f0inni okkar og fegra me\u00f0 r\u00e6ktun
  \u00ed formi matjurta, bl\u00f3ma og trj\u00e1a.\\n\u2756 Hj\u00e1lpa \u00feeim
  me\u00f0 fr\u00e6\u00f0slu sem stu\u00f0lar a\u00f0 hreinu umhverfi me\u00f0 \u00fev\u00ed
  a\u00f0 endurn\u00fdta sorp, papp\u00edr og annan \u00fargang.\\n\\n4. \u00c1rs\u00e1\u00e6tlun
  sk\u00f3lans\\n\\nVi\u00f0 h\u00f6ldum \u00ed \u00e1kve\u00f0nar hef\u00f0ir og
  m\u00e1 nefna sem d\u00e6mi \u00feorrabl\u00f3t, \u00f6skudag, j\u00f3laball, vorfagna\u00f0ur,
  17. j\u00fan\u00ed og Dag \u00edslenskrar tungu. \u00c1 \u00feorrabl\u00f3ti bor\u00f0um
  vi\u00f0 \u00feorramat og syngjum \u00feorras\u00f6ngva. \u00c1 \u00d6skudaginn
  sl\u00e1um vi\u00f0 k\u00f6ttinn \u00far sekknum \u00ed salnum hj\u00e1 okkur. \u00de\u00e1
  fara elstu b\u00f6rnin \u00ed b\u00e6inn og syngja. Vi\u00f0 f\u00f6gnum 17. j\u00fan\u00ed
  \u00e1 \u00feeim sk\u00f3ladegi sem n\u00e6stur er \u00fej\u00f3\u00f0h\u00e1t\u00ed\u00f0ardeginum
  sj\u00e1lfum. \u00de\u00e1 f\u00f6rum vi\u00f0 \u00ed skr\u00fa\u00f0g\u00f6ngu
  um hverfi\u00f0, syngjum og tr\u00f6llum. \u00c1 Degi \u00edslenskrar tungu leggjum
  vi\u00f0 s\u00e9rstaka \u00e1herslu \u00e1 tungum\u00e1li\u00f0 okkar, J\u00f3nas
  Hallgr\u00edmsson, syngjum, f\u00f6rum \u00e1 b\u00f3kasafni\u00f0 og lesum b\u00e6kur.\\n\\nLei\u00f0ir:\\n\\n4.1
  H\u00e1t\u00ed\u00f0ir og hef\u00f0ir\\n\\n\u00cd \u00edslensku \u00fej\u00f3\u00f0l\u00edfi
  eru \u00fdmsar h\u00e1t\u00ed\u00f0ir og hef\u00f0ir sem b\u00f6rn kynnast og taka
  \u00fe\u00e1tt \u00ed \u00e1 heimilum s\u00ednum og einnig \u00ed sk\u00f3lanum.
  \u00deennan menningararf \u00fearf sk\u00f3linn a\u00f0 sty\u00f0ja vi\u00f0 og
  b\u00f6rn a\u00f0 l\u00e6ra a\u00f0 vir\u00f0a. \u00dea\u00f0 styrkir \u00fej\u00f3\u00f0arvitund
  \u00feeirra. \u00cd sk\u00f3lanum  eru l\u00edka s\u00e9rstakar hef\u00f0ir r\u00edkjandi
  sem gefa tilefni til h\u00e1t\u00ed\u00f0ahalda, t.d. afm\u00e6li barnanna.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 kynnast hinum \u00fdmsu h\u00e1t\u00ed\u00f0um
  og tyllid\u00f6gum.\\n\u2756 A\u00f0 l\u00e6ra um hef\u00f0ir, venjur og g\u00f3\u00f0a
  si\u00f0i.\\n\u2756 A\u00f0 sk\u00f3linn hafi a\u00f0gengilegar uppl\u00fdsingar
  um mismunandi hef\u00f0ir og h\u00e1t\u00ed\u00f0ir svo starfsf\u00f3lki\u00f0 ver\u00f0i
  h\u00e6fara um a\u00f0 mi\u00f0la \u00feekkingu til barnanna.\\n\u2756 \u00deessi
  uppl\u00fdsingabanki g\u00e6ti t.d veri\u00f0 \u00ed formi b\u00f3ka, bla\u00f0a
  og myndbanda.\\n\\n4.2 Samskipti milli sk\u00f3lastiga\\n\\nMikilv\u00e6gt er a\u00f0
  samstarf s\u00e9 \u00e1 milli leiksk\u00f3la og grunnsk\u00f3la til a\u00f0 stu\u00f0la
  a\u00f0 samfellu \u00ed uppeldi og menntun barnsins og a\u00f0 \u00fea\u00f0 upplifi
  grunnsk\u00f3lann sem e\u00f0lilegt framhald leiksk\u00f3lans. Gagnkv\u00e6mar heims\u00f3knir
  nemenda Ki\u00f0agils og Giljask\u00f3la eru heppileg lei\u00f0 til a\u00f0 tengja
  sk\u00f3lastigin saman \u00ed huga barnsins. Sameiginleg verkefni \u00ed tengslum
  vi\u00f0 umhverfi sk\u00f3lanna er l\u00edka lei\u00f0 til a\u00f0 skapa \u00feessi
  tengsl.\\n\\nElstu b\u00f6rnin fara \u00ed heims\u00f3kn \u00ed Giljask\u00f3la.
  Fari\u00f0 er \u00ed heims\u00f3knir \u00e1 b\u00f3kasafni\u00f0, fr\u00edstund
  og \u00ed 1. bekk. Fyrsti bekkur Giljask\u00f3la kemur \u00ed heims\u00f3kn \u00e1
  Ki\u00f0agil og b\u00f6rnunum \u00e1 Engjar\u00f3s er bo\u00f0i\u00f0 \u00e1 \u00e1rsh\u00e1t\u00ed\u00f0
  Giljask\u00f3la.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 tryggja a\u00f0 samfella
  s\u00e9 milli sk\u00f3lastiganna.\\n\u2756 A\u00f0 stu\u00f0la a\u00f0 \u00f6ryggi
  og vell\u00ed\u00f0an barnanna vi\u00f0 upphaf grunnsk\u00f3lag\u00f6ngu\\n\u2756
  A\u00f0 efla f\u00e9lagslega f\u00e6rni barnanna.\\n\u2756 A\u00f0 efla hj\u00e1
  b\u00f6rnunum sj\u00e1lfst\u00e6\u00f0i.\\n\u2756 Fari\u00f0 er \u00ed heims\u00f3knir
  \u00ed grunnsk\u00f3lann til a\u00f0 kynnast innvi\u00f0um sk\u00f3lans og taka
  \u00fe\u00e1tt \u00ed grunnsk\u00f3lastarfinu me\u00f0 nemendum yngsta stigs.\\n\u2756
  Elstu deild leiksk\u00f3lans er bo\u00f0i\u00f0 \u00e1 \u00e1rsh\u00e1t\u00ed\u00f0ar
  generalprufu Giljask\u00f3la.\\n\u2756 F\u00e9lagsf\u00e6rni barnanna \u00fej\u00e1lfa\u00f0
  og nota\u00f0 til \u00feess n\u00e1msefni\u00f0 Stig af stigi.\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\n\u2756
  A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 fara nokkur saman \u00e1n kennara \u00e1 \u00fatsv\u00e6\u00f0i
  e\u00f0a \u00ed sal sk\u00f3lans, eykur sj\u00e1lfstraust og sj\u00e1lfsstj\u00f3rnun.
  \u00dea\u00f0 er einnig g\u00f3\u00f0ur undirb\u00fainingur undir \u00fativeru \u00ed
  grunnsk\u00f3la.\\n\\n5. Daglegt l\u00edf \u00ed leiksk\u00f3lanum\\n\\nDaglegt
  l\u00edf \u00ed leiksk\u00f3la markast af f\u00f6stum ath\u00f6fnum sem l\u00fata
  a\u00f0 l\u00edkamlegum \u00fe\u00f6rfum barna og heilsu \u00feeirra. Daglegt starf
  eru lei\u00f0ir sem farnar eru til a\u00f0 n\u00e1 markmi\u00f0um sk\u00f3lans,
  \u00fev\u00ed er mikilv\u00e6gt a\u00f0 samr\u00e6mi s\u00e9 milli lei\u00f0a og
  markmi\u00f0a.\\n\\n\u00c1 \u00e1kve\u00f0num t\u00edmum matast b\u00f6rn, \u00fevo
  s\u00e9r, hv\u00edla sig og sofa. Dagskipulag sk\u00f3lans er sni\u00f0i\u00f0 a\u00f0
  \u00fe\u00f6rfum barnanna, \u00feroska \u00feeirra, aldri, samsetningu barnah\u00f3psins
  hverju sinni, dvalart\u00edma og \u00f6\u00f0rum ytri skilyr\u00f0um. Skipulag og
  \u00e1kve\u00f0nar t\u00edmasetningar \u00e1 daglegum atbur\u00f0um gefa starfinu
  festu og tryggja h\u00e6filegan og samfelldan t\u00edma til leikja og skapandi starfs.\\n\\n\u00cd
  leiksk\u00f3la skal r\u00e6kta alhli\u00f0a \u00feroska barna, hl\u00faa a\u00f0
  \u00f6llum \u00feroska\u00fe\u00e1ttum, efla \u00fe\u00e1 og \u00f6rva samspil \u00feeirra.
  L\u00edfsleikni og n\u00e1msgengi barna byggist \u00e1 jafnv\u00e6gi milli allra
  \u00feroska\u00fe\u00e1ttanna.\\n\\n5.1. Stundaskr\u00e1 Ki\u00f0agils\\n\\n5.2.
  Leikn\u00e1mi\u00f0/Leikurinn\\n\\n\u00c1 bernsku\u00e1rum er leikur l\u00edfstj\u00e1ning
  barns, r\u00edkjandi ath\u00f6fn og mikilv\u00e6gasta n\u00e1ms- og \u00feroskalei\u00f0
  \u00feess. Leikurinn er hornsteinn sk\u00f3lastarfsins, l\u00edfstj\u00e1ning og
  gle\u00f0igjafi barns. Leikur barna m\u00f3tast af hugmyndaau\u00f0gi \u00feeirra
  og sk\u00f6punarm\u00e6tti, \u00fe.e. h\u00e6fni til a\u00f0 sj\u00e1 n\u00fd tengsl,
  a\u00f0 koma fram me\u00f0 n\u00fdst\u00e1rlegar hugmyndir og v\u00edkja fr\u00e1
  hef\u00f0bundnu hugsanamynstri. H\u00f3pleikir eru mikilv\u00e6gir \u00fe\u00e6ttir
  \u00ed leiksk\u00f3lastarfi. \u00cd h\u00f3pi jafnaldra \u00f6\u00f0last barn marg\u00fe\u00e6tta
  f\u00e9lagslega reynslu og f\u00e6r t\u00e6kif\u00e6ri til a\u00f0 l\u00e1ta til
  s\u00edn taka, eiga frumkv\u00e6\u00f0i, leika s\u00e9r, starfa og deila gle\u00f0i
  me\u00f0 \u00f6\u00f0rum\\n\\nMarkmi\u00f0:\\n\\n\u2756 Leikurinn er n\u00e1m, \u00fea\u00f0
  \u00f6rvar og \u00feroskar b\u00f6rnin.\\n\u2756 Leikurinn hvetur barni\u00f0 til
  starfa og vekur \u00e1huga.\\n\u2756 Leikurinn eflir samskipti, samh\u00e6fingu
  og samvinnu barnanna. \u00deau l\u00e6ra leikreglur og jafnr\u00e6\u00f0i r\u00edkir
  \u00e1 milli \u00feeirra.\\n\u2756 Leikurinn \u00f6rvar samspil og samskipti vi\u00f0
  hinn fullor\u00f0na.\\n\u2756 Leikurinn kemur inn \u00e1 alla \u00feroska\u00fe\u00e6tti
  barnanna, s.s. l\u00edkams- og hreyfi\u00feroska, tilfinninga\u00feroska, vitsmuna\u00feroska,
  m\u00e1l\u00feroska, f\u00e9lags\u00feroska og f\u00e9lagsvitund, fagur\u00feroska
  og sk\u00f6punarh\u00e6fni, si\u00f0g\u00e6\u00f0is\u00feroska og si\u00f0g\u00e6\u00f0isvitund.\\n\u2756
  Leikurinn er spuni, hann \u00e1 s\u00e9r upphaf og endi.\\n\u2756 Leikur m\u00f3tast
  af \u00feroska barnanna, bakgrunni \u00feeirra og uppeldisumhverfi.\\n\u2756 A\u00f0
  gefa \u00f3rofinn og g\u00f3\u00f0an t\u00edma til leikja og muna a\u00f0 fr\u00e1gangur
  er hluti af leiknum. L\u00e1ta vita t\u00edmanlega hven\u00e6r fr\u00e1gangur \u00e1
  a\u00f0 hefjast.\\n\u2756 Athuga hvort ekki s\u00e9 t\u00e6kif\u00e6ri til a\u00f0
  l\u00e1ta byggingar standa fr\u00e1 einum degi til annars.\\n\u2756 A\u00f0 meta
  leikinn sem nau\u00f0synlegan \u00fe\u00e1tt \u00ed \u00feroska barnsins.\\n\u2756
  A\u00f0 kenna spil, b\u00e6\u00f0i sem b\u00f6rn geta spila\u00f0 sj\u00e1lf og
  einnig spil sem kennarar stj\u00f3rna.\\n\u2756 A\u00f0 leikurinn f\u00e1i t\u00edma,
  r\u00fdmi og n\u00e6\u00f0i. \u00dea\u00f0 \u00fearf a\u00f0 skapa a\u00f0st\u00e6\u00f0ur
  fyrir leikinn \u00feannig a\u00f0 hann hafi n\u00e6\u00f0i og \u00fer\u00f3ist e\u00f0lilega,
  s.s. a\u00f0 h\u00f3lfa r\u00fdmi af \u00feannig a\u00f0 b\u00f6rnin ver\u00f0i
  ekki fyrir utana\u00f0komandi \u00e1reiti sem getur trufla\u00f0 leikinn.\\n\u2756
  A\u00f0 passa upp \u00e1 a\u00f0 brj\u00f3ta ekki upp leikinn me\u00f0 \u00f3\u00fearfa
  afskiptum.\\n\\nLei\u00f0ir:\\n\\n5.2.1. Leikskilyr\u00f0i og efnivi\u00f0ur\\n\\nLeikur
  barns endurspeglar reynsluheim \u00feess, menningu og samf\u00e9lag sem \u00fea\u00f0
  b\u00fdr \u00ed. Skipulag og b\u00fana\u00f0ur \u00e1 a\u00f0 \u00f6rva leik barna,
  frumkv\u00e6\u00f0i \u00feeirra og virkni. Skipulag og umhverfi hefur \u00e1hrif
  \u00e1 leik barna og getur stutt vi\u00f0 leikinn en einnig verka\u00f0 hamlandi.
  B\u00f6rn \u00feurfa t\u00edma til a\u00f0 skipuleggja og setja upp leikinn og \u00feau
  \u00feurfa samfelldan t\u00edma til a\u00f0 \u00fer\u00f3a leik sinn og d\u00fdpka.
  Leik skal \u00fev\u00ed \u00e6tla\u00f0ur g\u00f3\u00f0ur og samfelldur t\u00edmi
  \u00ed dagskipulagi sk\u00f3lans.\\n\\nEfnivi\u00f0ur sk\u00f3lans er a\u00f0alkennslut\u00e6ki
  hans, \u00fev\u00ed er mikilv\u00e6gt a\u00f0 vanda vali\u00f0 og vera me\u00f0vita\u00f0ur
  um hverskonar efnivi\u00f0ur er valinn. \u00c1 \u00f6llum deildum eru snjallt\u00f6lvur
  sem b\u00e6\u00f0i er vinnut\u00e6ki nemenda og kennara.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 efnivi\u00f0urinn s\u00e9 \u00e1hugahvetjandi, fj\u00f6lbreyttur, skapandi
  fyrir b\u00f6rnin og hann efli frumkv\u00e6\u00f0i \u00feeirra, sj\u00e1lfst\u00e6\u00f0i,
  virkni og gle\u00f0i.\\n\u2756 A\u00f0 umhverfi\u00f0 hvetji b\u00f6rnin til leikja
  en letji \u00feau ekki.\\n\u2756 A\u00f0 umhverfi\u00f0 s\u00e9 til \u00feess falli\u00f0
  a\u00f0 vekja vell\u00ed\u00f0an og stu\u00f0li a\u00f0 fri\u00f0i og r\u00f3 \u00ed
  samskiptum barnanna.\\n\u2756 A\u00f0 skapandi efnivi\u00f0ur s\u00e9 til sta\u00f0ar
  \u00ed sk\u00f3lanum, s.s. leir, sandur, m\u00e1lning, fatna\u00f0ur og b\u00faningur
  til \u00feykjustu- og hlutverkaleiks, kubbar til byggingaleikja, p\u00fasl, inni-
  og \u00fatileikt\u00e6ki.\\n\u2756 A\u00f0 snjallt\u00f6lvur s\u00e9u a\u00f0gengilegar
  fyrir b\u00f6rnin. \u00dear er l\u00f6g\u00f0 \u00e1hersla \u00e1 samvinnu barnanna
  og forrit og leiki til \u00fej\u00e1lfunar og kennslu.\\n\\n5.2.2. Hlutverk kennarans
  \u00ed leik barna\\n\\nKennari \u00e1 a\u00f0 fylgjast vel me\u00f0 leiknum og \u00e1
  \u00e1vallt a\u00f0 vera rei\u00f0ub\u00fainn a\u00f0 \u00f6rva e\u00f0a taka \u00fe\u00e1tt
  \u00ed leiknum og \u00fe\u00e1 \u00e1 forsendum barnanna. Kennarinn \u00fearf a\u00f0
  vera n\u00e6mur \u00e1 andlegar og l\u00edkamlegar \u00fearfir barnsins og fylgjast
  gaumg\u00e6filega me\u00f0 b\u00f6rnunum \u00ed leik. B\u00f6rn dvelja a\u00f0 \u00f6llu
  j\u00f6fnu lengur vi\u00f0 leik og st\u00f6rf ef kennari er n\u00e1l\u00e6gur. N\u00e1vistin
  veitir barni \u00f6ryggi og stu\u00f0ning.\\n\\nS\u00e9rhvert barn \u00fearf a\u00f0
  f\u00e1st vi\u00f0 vi\u00f0fangsefni vi\u00f0 sitt h\u00e6fi. G\u00e6ta \u00fearf
  \u00feess a\u00f0 barn einangrist ekki en a\u00f0lagist vel barnah\u00f3pnum og
  nj\u00f3ti e\u00f0lilegra f\u00e9lagslegra tengsla.\\n\\nLei\u00f0ir:\\n\\nMarkmi\u00f0
  og lei\u00f0ir:\\n\\n\u2756 A\u00f0 kennarinn fylgist vel me\u00f0 leik barnanna,
  geri uppeldislegar skr\u00e1ningar og spyrji opinna spurninga.\\n\u2756 A\u00f0
  kennarinn s\u00e9 \u00e1vallt til sta\u00f0ar og taki \u00fe\u00e1tt \u00ed leik
  barnanna \u00e1 \u00feeirra forsendum.\\n\u2756 A\u00f0 kennarinn vekji \u00e1huga
  barnanna \u00e1 leiknum, \u00f6rvi \u00feau og hvetji.\\n\\n5.2.3. \u201eEinn, tveir
  og byrja\\\"\\n\\nHausti\u00f0 2006 h\u00f3fst notkun \u00e1  n\u00e1msefninu \u201eEinn,
  tveir og byrja\\\" sem er s\u00e9rhanna\u00f0 fyrir yngstu b\u00f6rnin \u00ed leiksk\u00f3la
  (18 - 24 m\u00e1na\u00f0a). H\u00f6fundur n\u00e1msefnisins heitir Nina Anna Dau
  og byggir \u00e1 n\u00e1mskenningum Blooms og fj\u00f6lgreindarkenningu Gardners.
  Me\u00f0 h\u00f6nnun n\u00e1msefnisins vildi h\u00fan me\u00f0 beinum h\u00e6tti,
  koma til m\u00f3ts vi\u00f0 \u00fearfir yngstu barnanna \u00ed leiksk\u00f3lanum.
  N\u00e1msefni\u00f0 b\u00fd\u00f0ur upp \u00e1 markvissa vinnu me\u00f0 \u00e1kve\u00f0i\u00f0
  efni, svo sem T\u00e1kn me\u00f0 tali, einfaldar myndir og liti. Innl\u00f6gnin
  hefst \u00feegar a\u00f0l\u00f6gun l\u00fdkur og er unni\u00f0 \u00ed \u00e1kve\u00f0inn
  t\u00edma me\u00f0 eftirfylgni og s\u00edmati en sl\u00edkt er sjaldnast gert \u00feegar
  n\u00e1msefni fyrir eldri b\u00f6rn hefur veri\u00f0 einfalda\u00f0 fyrir yngstu
  b\u00f6rnin.\\n\\n5.2.4. Leiksk\u00f3lal\u00e6si\\n\\nVerkefni\u00f0 \u201eLeiksk\u00f3lal\u00e6si\\\"
  hefur a\u00f0 markmi\u00f0i a\u00f0 kenna b\u00f6rnum lestur \u00ed gegnum leik,
  allt fr\u00e1 \u00fev\u00ed a\u00f0 \u00feau byrja leiksk\u00f3lag\u00f6ngu s\u00edna.
  Vi\u00f0 undirb\u00faning a\u00f0fer\u00f0arinnar er Byrjendal\u00e6si haft til
  hli\u00f0sj\u00f3nar sem lestrarkennslua\u00f0fer\u00f0 \u00ed grunnsk\u00f3la og
  einnig er liti\u00f0 til \u201eBernskul\u00e6sis\\\"  um hvernig b\u00f6rn tileinka
  s\u00e9r lestur \u00ed gegnum umhverfi sitt. Fyrst og fremst ver\u00f0ur \u00fe\u00f3
  leikurinn haf\u00f0ur a\u00f0 lei\u00f0arlj\u00f3si og \u00fer\u00f3a\u00f0ar ver\u00f0a
  a\u00f0fer\u00f0ir til \u00feess a\u00f0 n\u00fdta hann markvisst til hugtaka- og
  lestrarkennslu. Allar deildir nota kennsluefni\u00f0 Lubbi finnur m\u00e1lbein \u00ed
  s\u00ednu daglega starfi, hvort sem er me\u00f0 s\u00f6ngvum, s\u00f6gum e\u00f0a
  \u00ed tengslum vi\u00f0 \u00feemaverkefni.\\n\\nMarkmi\u00f0:\\n\\n\u2756 Styrkja
  m\u00e1lvitund barnanna.\\n\u2756 Veita skipulega m\u00e1l\u00f6rvun sem stu\u00f0lar
  a\u00f0 e\u00f0lilegri f\u00e6rni \u00ed \u00edslensku.\\n\u2756 Sam\u00fe\u00e6tta
  hina m\u00f6rgu \u00fe\u00e6tti m\u00e1ls, s.s. lestur, ritun, tal og hlustun\\n\u2756
  Hafa markvissa og heildst\u00e6\u00f0a lestrarkennslu fr\u00e1 upphafi sk\u00f3lag\u00f6ngu
  nemenda.\\n\\n5.2.5. Val\\n\\nValkerfi byggir \u00e1 \u00feeirri hugmynd a\u00f0
  barn l\u00e6ri af eigin \u00e1hugahv\u00f6t, \u00fev\u00ed er b\u00f6rnunum gefi\u00f0
  val um leiksv\u00e6\u00f0i e\u00f0a starf, til a\u00f0 gefa \u00feeim kost \u00e1
  a\u00f0 v\u00edkka \u00feessa innri \u00e1hugahv\u00f6t s\u00edna. Algengustu valkerfin
  eru val barna um \u00e1kve\u00f0in leiksv\u00e6\u00f0i e\u00f0a\\n\\nverkefni, einhvern
  afmarka\u00f0an t\u00edma dagsins. \u00cd vali gefst barni kostur \u00e1 a\u00f0
  efla sj\u00e1lfr\u00e6\u00f0i sitt og sj\u00e1lfstraust me\u00f0 \u00fev\u00ed a\u00f0
  l\u00e6ra a\u00f0 taka \u00e1kv\u00f6r\u00f0un og standa vi\u00f0 hana. \u00dear
  starfar barni\u00f0 s\u00ed\u00f0an me\u00f0 \u00f6\u00f0rum b\u00f6rnum sem velja
  \u00fea\u00f0 sama \u00ed \u00fea\u00f0 skipti\u00f0 og eykur \u00fear f\u00e9lagslegan
  \u00feroska sinn og l\u00edfsleikni.\\n\\nMarkmi\u00f0:\\n\\n\u2756 Hafa val  \u00fe.e.
  valstund seinni partinn \u00fear sem b\u00f6rnin velja sv\u00e6\u00f0i. \u00c1 eldri
  deildum er vali\u00f0 \u00e1 b\u00e1\u00f0um deildum sem gerir \u00fea\u00f0 a\u00f0
  verkum a\u00f0 b\u00f6rn og starfsmenn kynnast betur.\\n\u2756 A\u00f0 b\u00f6rnin
  l\u00e6ri a\u00f0 velja og hafna og standa vi\u00f0 \u00e1kv\u00f6r\u00f0un s\u00edna.\\n\u2756
  A\u00f0 n\u00fdta \u00feau sv\u00e6\u00f0i sem deildin hefur upp \u00e1 a\u00f0
  bj\u00f3\u00f0a.\\n\u2756 Hafa nafnalista \u00feannig a\u00f0 n\u00f6fnin r\u00falli.
  \u00deannig f\u00e1 allir a\u00f0 velja fyrstir og allir ver\u00f0i einhvern t\u00edmann
  s\u00ed\u00f0astir.\\n\u2756 Hafa valspj\u00f6ld a\u00f0gengileg fyrir b\u00f6rnin.\\n\\n5.2.6.
  \u00deemastarf\\n\\n\u00cd skipul\u00f6g\u00f0u \u00feemastarfi \u00f6\u00f0last
  barn skilning \u00e1 gildi samvinnu og \u00feroskar me\u00f0 s\u00e9r samkennd og
  \u00e1byrg\u00f0artilfinningu. \u00deemastarf \u00f6rvar \u00feroska einstaklings
  og \u00feroski einstaklings au\u00f0gar starf h\u00f3psins. Sk\u00f3linn tekur tillit
  til \u00fearfa hvers einstaks barns svo \u00fea\u00f0 f\u00e1i noti\u00f0 s\u00edn
  \u00ed h\u00f3pi annarra barna \u00e1 eigin forsendum.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 ger\u00f0 s\u00e9 n\u00e1kv\u00e6m n\u00e1ms\u00e1\u00e6tlun fyrir hverja
  \u00f6nn.\\n\u2756 A\u00f0 \u00f6ll n\u00e1mssvi\u00f0in fl\u00e9ttist inn \u00ed
  \u00feemastarfi\u00f0.\\n\u2756 A\u00f0 hafa aldurshreina h\u00f3pa.\\n\u2756 A\u00f0
  \u00f6rva sk\u00f6punargle\u00f0i og umr\u00e6\u00f0ur me\u00f0 \u00fev\u00ed a\u00f0
  spyrja opinna spurninga.\\n\u2756 A\u00f0 b\u00f6rnin l\u00e6ri a\u00f0 vinna saman
  og taka tillit til hvors annars, s.s. a\u00f0 hlusta \u00feegar a\u00f0rir tala
  og \u00feora a\u00f0 tj\u00e1 sig \u00ed h\u00f3pnum, hvetja \u00feau til samr\u00e6\u00f0na.\\n\u2756
  A\u00f0 styrkja tengsl og auka \u00feekkingu \u00feeirra \u00e1 umhverfi s\u00ednu
  og samf\u00e9lagi.\\n\u2756 A\u00f0 gera b\u00f6rnin me\u00f0vitu\u00f0 um s\u00edbreytileika
  n\u00e1tt\u00faru og samf\u00e9lags.\\n\u2756 N\u00fdta \u00feau sv\u00e6\u00f0i
  sem \u00ed bo\u00f0i eru, t.d. Listagil, heimasv\u00e6\u00f0in, \u00fativist og
  salinn.\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\n\u2756 Fara \u00ed
  vettvangsfer\u00f0ir, \u00e1 b\u00f3kas\u00f6fn, fyrirt\u00e6ki, s\u00f6fn.\\n\u2756
  N\u00fdta \u00feann efnivi\u00f0 sem \u00ed bo\u00f0i er og safna \u00far n\u00e1tt\u00farunni
  efnivi\u00f0 til vinnslu.\\n\\n5.2.7. Samverustundir\\n\\nBarn \u00e1 a\u00f0 f\u00e1
  margv\u00edsleg t\u00e6kif\u00e6ri til a\u00f0 nj\u00f3ta samverustunda og gle\u00f0jast
  me\u00f0 \u00f6\u00f0rum. \u00dear gefst t\u00e6kif\u00e6ri til samr\u00e6\u00f0na
  sem byggja \u00e1 opnum spurningum og h\u00e6gt er a\u00f0 hvetja barni\u00f0 til
  a\u00f0 f\u00e6ra r\u00f6k fyrir m\u00e1li s\u00ednu. \u00dear er einnig gott a\u00f0
  lesa fyrir b\u00f6rnin efni sem h\u00e6fir aldri \u00feeirra og \u00feroska og segja
  s\u00f6gur og \u00e6vint\u00fdri. H\u00f3ps\u00f6ngur eykur einnig samkennd barna.
  \u00cd samverustundum gefst gott t\u00e6kif\u00e6ri til a\u00f0 styrkja sj\u00e1lfsmynd
  og sj\u00e1lfstraust barnanna, me\u00f0 \u00fev\u00ed a\u00f0 \u00fej\u00e1lfa \u00feau
  \u00ed a\u00f0 koma fram fyrir h\u00f3pinn.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0
  \u00fej\u00e1lfa b\u00f6rnin \u00ed a\u00f0 vera saman sem heild/h\u00f3pur.\\n\u2756
  A\u00f0 \u00fej\u00e1lfa b\u00f6rnin \u00ed a\u00f0 hlusta \u00e1 s\u00f6gur og
  \u00e1 hvort anna\u00f0.\\n\u2756 A\u00f0 \u00feau l\u00e6ri a\u00f0 taka tillit
  til hvors annars.\\n\u2756 A\u00f0 \u00fej\u00e1lfa m\u00e1l\u00feroska barnanna.\\n\u2756
  Lesa, syngja og segja s\u00f6gur, hlusta \u00e1 s\u00f6gur.\\n\u2756 A\u00f0 skapa
  umr\u00e6\u00f0ur \u00ed samverustundum sem hvetja b\u00f6rn til a\u00f0 segja fr\u00e1
  s\u00ednum  upplifunum og segja s\u00f6gur.\\n\u2756 S\u00f6gukassi Lubba.\\n\\n5.2.8.
  \u00dativeran\\n\\nHreyfing og \u00fativera eru samtengdir \u00fe\u00e6ttir. Utandyra
  geta b\u00f6rnin leyft s\u00e9r \u00e6rslaleiki, hr\u00f3p og k\u00f6ll. \u00dear
  geta \u00feau hlaupi\u00f0, hoppa\u00f0, stokki\u00f0 og klifra\u00f0. Leikvellir
  sk\u00f3la eiga a\u00f0 vera vel fallnir til alls konar hreyfileikja, b\u00e6\u00f0i
  sj\u00e1lfsprottinna og skipulag\u00f0ra. \u00ddmsir hlaupaleikir reyna verulega
  \u00e1 \u00fer\u00f3tt barnsins og \u00fathald, \u00f6rva hjartsl\u00e1tt og bl\u00f3\u00f0r\u00e1s.
  \u00cd \u00fativeru fer ekki minna n\u00e1m fram en inni og er \u00fev\u00ed ekki
  s\u00ed\u00f0ur mikilv\u00e6gt a\u00f0 huga a\u00f0 \u00fev\u00ed a\u00f0 \u00fatisv\u00e6\u00f0i\u00f0
  s\u00e9 skapandi.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 b\u00f6rnin f\u00e1i t\u00e6kif\u00e6ri
  til a\u00f0 hreyfa sig frj\u00e1lst og \u00f3hindra\u00f0.\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\n\u2756
  N\u00fdta n\u00e6sta n\u00e1grenni: Fara \u00ed str\u00e6tisvagnafer\u00f0ir; s\u00f6fn;
  mi\u00f0b\u00e6; lystigar\u00f0inn; andapollinn,  sundlaugargar\u00f0inn; stofnanir
  og fyrirt\u00e6ki b\u00e6jarins.,\\n\\n5.2.10. L\u00edfsleikni\\n\\nL\u00edfsleikni
  byggist \u00e1 alhli\u00f0a \u00feroska barns, f\u00e6rni \u00feess til samskipta,
  r\u00f6kr\u00e6nnar tj\u00e1ningar og til a\u00f0 bera vir\u00f0ingu fyrir umhverfi
  s\u00ednu. \u00cd leiksk\u00f3la \u00e1 a\u00f0 kenna barni l\u00fd\u00f0r\u00e6\u00f0isleg
  vinnubr\u00f6g\u00f0. L\u00edfsleikni felst m.a. \u00ed \u00fev\u00ed a\u00f0 vir\u00f0a
  reglur.\\n\\n6. Forvarnarstefna Ki\u00f0agils\\n\\n\u00cd vinnuverndarl\u00f6gum
  nr. 46/1980 er geti\u00f0 um a\u00f0 atvinnurekandi skuli tryggja a\u00f0 g\u00e6tt
  s\u00e9 fylsta \u00f6ryggis, g\u00f3\u00f0s a\u00f0b\u00fana\u00f0ar og hollustuh\u00e1tta
  \u00e1 vinnusta\u00f0.\\n\\n\u2756 A\u00f0 nj\u00f3ta \u00fativerunnar \u00fear
  sem ferska lofti\u00f0 eykur matarlyst og \u00fathald.\\n\u2756 A\u00f0 \u00feau
  l\u00e6ri samskiptareglur \u00ed \u00fativistinni og \u00ed frj\u00e1lsum leikjum\\n\u2756
  A\u00f0 \u00feau l\u00e6ri tillitsemi og a\u00f0g\u00e6tni.\\n\u2756 Bj\u00f3\u00f0a
  upp \u00e1 fj\u00f6lbreytta leiki, skipulag\u00f0a/\u00f3skipulag\u00f0a.\\n\u2756
  Hafa fj\u00f6lbreyttan efnivi\u00f0 s.s. sand, m\u00f6l, d\u00f3t, vegas\u00f6lt,
  sk\u00f3flur, f\u00f6tur.\\n\u2756 Hafa skipulag\u00f0a \u00fatileikjadaga nokkrum
  sinnum \u00e1 \u00e1ri.\\n\\n5.2.9. Vettvangsfer\u00f0ir\\n\\nB\u00f6rn f\u00e1
  snemma \u00e1huga \u00e1 n\u00e1nasta umhverfi s\u00ednu og \u00e1huga \u00feeirra
  og eftirtekt ber a\u00f0 efla. V\u00edkka skal \u00e1hugasvi\u00f0 \u00feeirra og
  sj\u00f3ndeildarhring me\u00f0 sko\u00f0unarfer\u00f0um \u00ed n\u00e1grenni sk\u00f3lans
  og me\u00f0 margv\u00edslegum heims\u00f3knum \u00ed \u00fej\u00f3nustu- og menningarstofnanir.
  Vel \u00fearf a\u00f0 n\u00fdta umhverfi\u00f0 til g\u00f6ngufer\u00f0a, leikja,
  n\u00e1tt\u00farusko\u00f0unar og hvers konar ranns\u00f3kna. Vettvangsfer\u00f0ir
  m\u00e1 tengja vi\u00f0 \u00feema sk\u00f3lans en einnig geta hugmyndir a\u00f0
  \u00feemaverkefni kvikna\u00f0 \u00ed vettvangsfer\u00f0unum.\\n\\nB\u00f6rn \u00feurfa
  einnig a\u00f0 kynnast umfer\u00f0inni og l\u00e6ra heg\u00f0unar- og umfer\u00f0arreglur
  jafnskj\u00f3tt og \u00feau hafa \u00feroska til.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 \u00feau l\u00e6ri a\u00f0 fara saman \u00ed fer\u00f0ir og taka tillit
  til hvers annars, varast h\u00e6ttur, fara eftir reglum.\\n\u2756 A\u00f0 \u00feau
  kynnist n\u00e1tt\u00farunni og \u00fev\u00ed sem h\u00fan hefur upp \u00e1 a\u00f0
  bj\u00f3\u00f0a.\\n\\nStefna Ki\u00f0agils \u00ed forv\u00f6rnum er a\u00f0 stu\u00f0la
  a\u00f0 alhli\u00f0a heilbrig\u00f0i nemenda sinna og starfsf\u00f3lks \u00ed gegnum
  fr\u00e6\u00f0slu og umr\u00e6\u00f0ur. Forvarnir spanna mj\u00f6g breytt svi\u00f0
  sem tengist velfer\u00f0 f\u00f3lks, svo sem l\u00ed\u00f0an, sj\u00e1lfsmynd, \u00e1rangri,
  samskiptum og  \u00e1hugam\u00e1lum. Markmi\u00f0 forvarnar\u00e1\u00e6tlunar sk\u00f3lans
  er a\u00f0 stu\u00f0la a\u00f0 g\u00f3\u00f0ri l\u00ed\u00f0an \u00feeirra sem h\u00e9r
  eru daglega og gera \u00fe\u00e1 a\u00f0 sterkum einstaklingum.\\n\\nMe\u00f0 \u00feetta
  a\u00f0 markmi\u00f0i munum vi\u00f0 leitast vi\u00f0 a\u00f0:\\n\\n\u2756 Fr\u00e6\u00f0a
  b\u00f6rnin og efla sj\u00e1lfr\u00e6\u00f0i \u00feeirra. \u00cd n\u00e1mi barnanna
  notum vi\u00f0 m.a. n\u00e1msefni\u00f0 \\\"Stig af Stigi\\\" sem er fyrirtaks forvarnarefni.
  \u00dear l\u00e6ra b\u00f6rnin a\u00f0 finna styrk sinn, taka r\u00e9ttar \u00e1kvar\u00f0anir,
  segja sko\u00f0un s\u00edna, r\u00f6ksty\u00f0ja hana og standa vi\u00f0 or\u00f0
  s\u00edn.\\n\u2756 Tryggja faglega og snemmt\u00e6ka \u00edhlutun var\u00f0andi
  \u00feroskafr\u00e1vik og/e\u00f0a f\u00e9lagslegra a\u00f0st\u00e6\u00f0na.\\n\u2756
  Nota skimunarpr\u00f3f sem hj\u00e1lpart\u00e6ki \u00ed starfi sk\u00f3lans, s.s.
  \u00cdslenska \u00feroskalistann, EFI 2 m\u00e1l\u00feroskaskimun, AAL listann og
  Hlj\u00f3m-2, til a\u00f0 geta betur sinnt \u00feeim b\u00f6rnum sem \u00feurfa
  s\u00e9rstaka a\u00f0sto\u00f0.\\n\u2756 Eiga \u00f6flugt og gott samstarf vi\u00f0
  foreldra/forr\u00e1\u00f0amenn barnanna og veita \u00feeim uppl\u00fdsingar um uppeldi
  og um\u00f6nnun barna.\\n\u2756 Eiga \u00f6flugt samstarf vi\u00f0 grunnsk\u00f3lana
  (a\u00f0allega Giljask\u00f3la sem er okkar hverfissk\u00f3li), t\u00f3nlistarsk\u00f3la,
  heilsug\u00e6slu, r\u00e1\u00f0gjafa (jafnt Sk\u00f3ladeildar Akureyrar sem og sj\u00e1lfst\u00e6tt
  starfandi), l\u00f6greglu og sl\u00f6kkvili\u00f0.\\n\u2756 Hafa virka s\u00edmenntunar\u00e1\u00e6tlun
  starfsf\u00f3lks til a\u00f0 efla faglega \u00feekkingu innan sk\u00f3lans.\\n\u2756
  Sty\u00f0jast vi\u00f0 vi\u00f0urkennda og \u00e1hrifamikla agastefnu \u201eSMT-Sk\u00f3laf\u00e6rni\\\"
  og gefa n\u00fdjum kennurum og \u00f6\u00f0rum starfsm\u00f6nnum lei\u00f0beiningar
  um hvernig \u00feeir geti tileinka\u00f0 s\u00e9r \u00fe\u00e6r samskiptareglur
  sem agastefnan kve\u00f0ur \u00e1 um.\\n\\n6.1 Agastefna Ki\u00f0agils\\n\\nAgi
  er a\u00f0fer\u00f0 til a\u00f0 stj\u00f3rna, lei\u00f0beina og setja b\u00f6rnum
  m\u00f6rk svo a\u00f0 \u00feau \u00f6\u00f0list h\u00e6fni til a\u00f0 tileinka
  s\u00e9r skr\u00e1\u00f0ar og \u00f3skr\u00e1\u00f0ar reglur samf\u00e9lagsins.
  Flestir eru samm\u00e1la a\u00f0 agi s\u00e9 nau\u00f0synlegur til a\u00f0 stu\u00f0la
  a\u00f0 andlegu heilbrig\u00f0i barna og hj\u00e1lpi \u00feeim a\u00f0 \u00f6\u00f0last
  innri styrk og jafnv\u00e6gi. \u00c1rangursr\u00edkast er a\u00f0 heimili og sk\u00f3li
  s\u00e9u samst\u00edga \u00ed a\u00f0ger\u00f0um.\\n\\n\u201eSMT-sk\u00f3laf\u00e6rni
  er \u00e1hrifar\u00edkt hj\u00e1lpart\u00e6ki til \u00feess a\u00f0 halda uppi g\u00f3\u00f0um
  aga j\u00e1kv\u00e6\u00f0um samskiptum. SMT einkunnaror\u00f0 Ki\u00f0agils er \u201eVi\u00f0
  erum fr\u00e1b\u00e6r\\\"\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 kenna og styrkja
  barni\u00f0 \u00ed mannlegum samskiptum sem vi\u00f0urkennd eru \u00ed okkar samf\u00e9lagi.\\n\u2756
  A\u00f0 b\u00e6\u00f0i b\u00f6rn og starfsf\u00f3lk temji s\u00e9r g\u00f3\u00f0a
  umgengni, j\u00e1kv\u00e6\u00f0 samskipti og kurteisi.\\n\u2756 A\u00f0 nota aga
  sem a\u00f0fer\u00f0 til a\u00f0 n\u00e1 fram j\u00e1kv\u00e6\u00f0ri og \u00e6skilegri
  heg\u00f0un.\\n\u2756 A\u00f0 hj\u00e1lpa barninu a\u00f0 \u00f6\u00f0last sj\u00e1lfstraust
  og tileinka s\u00e9r sj\u00e1lfsaga.\\n\u2756 A\u00f0 \u00feau beri vir\u00f0ingu
  gagnvart sj\u00e1lfum s\u00e9r og \u00f6\u00f0rum, eigum s\u00ednum og annarra.\\n\u2756
  A\u00f0 barni\u00f0 \u00f6\u00f0list sm\u00e1m saman meiri getu til a\u00f0 stj\u00f3rna
  eigin ger\u00f0um og greina \u00e1 milli hva\u00f0 er r\u00e9tt og rangt.\\n\u2756
  Starfsmenn eru fyrirmyndir og ber a\u00f0 \u00edgrunda framkomu og samskipti s\u00edn
  vi\u00f0 a\u00f0ra.\\n\u2756 A\u00f0 nota j\u00e1kv\u00e6\u00f0an aga felst \u00ed
  a\u00f0 setja b\u00f6rnum m\u00f6rk, st\u00f6\u00f0va \u00feau \u00feegar \u00feau
  hafa \u00ed frammi \u00f3\u00e6skilega heg\u00f0un og hr\u00f3sa \u00feeim \u00feegar
  \u00feau fara eftir settum reglum. Hr\u00f3s getur falist \u00ed a\u00f0 brosa til
  barnsins, klappa \u00e1 kollinn e\u00f0a segja t.d. \\\"\u00c9g er \u00e1n\u00e6g\u00f0/ur
  a\u00f0 sj\u00e1...\\\"\\n\u2756 Starfsmenn s\u00e9u samst\u00edga \u00ed umgengni
  og reglum, s\u00e9rstaklega gagnvart \u00feeim b\u00f6rnum sem \u00feurfa sk\u00fdrari
  ramma en \u00f6nnur, \u00e1 hverjum t\u00edma.\\n\u2756 A\u00f0 h\u00e6la b\u00f6rnum
  me\u00f0 SMT einkunaror\u00f0um Ki\u00f0agils\\n\\n6.2. SMT- sk\u00f3laf\u00e6rni\\n\\nMarkmi\u00f0
  SMT-sk\u00f3laf\u00e6rni er a\u00f0 skapa gott andr\u00famsloft \u00ed sk\u00f3lum
  og tryggja \u00f6ryggi og velfer\u00f0 nemenda og starfsf\u00f3lks. L\u00f6g\u00f0
  er \u00e1hersla \u00e1 a\u00f0 koma \u00ed veg fyrir og draga \u00far \u00f3\u00e6skilegri
  heg\u00f0un nemenda me\u00f0 \u00fev\u00ed a\u00f0 kenna og \u00fej\u00e1lfa f\u00e9lagsf\u00e6rni,
  gefa j\u00e1kv\u00e6\u00f0ri heg\u00f0un gaum me\u00f0 markvissum h\u00e6tti og
  samr\u00e6ma vinnubr\u00f6g\u00f0 starfsf\u00f3lks gagnvart nemendum sem s\u00fdna
  \u00f3\u00e6skilega heg\u00f0un. \u00deessi n\u00e1lgun  byggir \u00e1 margra \u00e1ra
  ranns\u00f3knum s\u00e9rfr\u00e6\u00f0inga, \u00ed Oregon \u00ed Bandar\u00edkjunum,
  og er framkv\u00e6md \u00ed samr\u00e1\u00f0i vi\u00f0 \u00fe\u00e1. Ranns\u00f3knir
  hafa leitt \u00ed lj\u00f3s a\u00f0 \u00ed hverjum sk\u00f3la m\u00e1 gera r\u00e1\u00f0
  fyrir \u00ferenns konar nemendum. \u201eVenjulegum\\\" nemendum (85-90%),nemendum
  sem s\u00fdna fyrstu merki andf\u00e9lagslegrar heg\u00f0unar og eiga \u00e1 h\u00e6ttu
  a\u00f0 \u00fer\u00f3a me\u00f0 s\u00e9r andf\u00e9lagslegt\\n\\nLei\u00f0ir:\\n\\nheg\u00f0unarmynstur
  (7-10%) og nemendum sem \u00feegar s\u00fdna t\u00f6luver\u00f0a andf\u00e9lagslega
  heg\u00f0un og eru \u00ed mikilli \u00e1h\u00e6ttu vegna enn frekari vandam\u00e1la
  \u00ed framt\u00ed\u00f0inni (3-5%). Gert er r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0
  brug\u00f0ist s\u00e9 vi\u00f0 \u00feessum \u00feremur nemendah\u00f3pum \u00e1
  mismunandi h\u00e1tt og er \u00e1\u00e6tla\u00f0 a\u00f0 tv\u00f6 til fj\u00f6gur
  \u00e1r taki a\u00f0 innlei\u00f0a \u00feessi vinnubr\u00f6g\u00f0 \u00ed sk\u00f3lasamf\u00e9lagi\u00f0.\\n\\nFramkv\u00e6md:
  (B\u00e6klingur um SMT sk\u00f3laf\u00e6rni)\\n\\n\u00c1 fyrsta \u00e1ri er l\u00f6g\u00f0
  \u00e1hersla \u00e1 a\u00f0 sty\u00f0ja vi\u00f0 alla nemendur sk\u00f3lans. Reglur
  eru settar fram \u00feannig a\u00f0 \u00fe\u00e6r eru einfaldar, n\u00e1kv\u00e6mar
  og vel lj\u00f3st til hvers er \u00e6tlast af nemendum.\\n\\n\u00c1 \u00f6\u00f0ru
  \u00e1ri er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 sty\u00f0ja vi\u00f0 afmarka\u00f0an
  h\u00f3p nemenda \u2013 nemendur sem s\u00fdna fyrstu merki andf\u00e9lagslegrar
  heg\u00f0unar.\\n\\n\u00c1 \u00feri\u00f0ja \u00e1ri er l\u00f6g\u00f0 \u00e1hersla
  \u00e1 a\u00f0  sty\u00f0ja vi\u00f0 nemendur sem \u00feegar s\u00fdna t\u00f6luver\u00f0a
  andf\u00e9lagslega heg\u00f0un.\\n\\n\u00c1 Ki\u00f0agili er unni\u00f0 samkv\u00e6mt
  SMT-sk\u00f3laf\u00e6rni og hefur veri\u00f0 gert \u00ed nokkur \u00e1r. Sett hefur
  veri\u00f0 \u00e1 stofn svokalla\u00f0 \u201eLausnateymi\\\" sem \u00e1kve\u00f0ur
  hvort hafa \u00feurfi markvisst eftirlit me\u00f0 heg\u00f0un einstaka nemanda.
  \u00c1\u00f0ur en a\u00f0ger\u00f0ir hefjast s\u00e9r lausnateymi um a\u00f0 ger\u00f0
  s\u00e9 athugun \u00e1 heg\u00f0un nemandans leitar eftir sam\u00feykki foreldra
  og a\u00f0 \u00fev\u00ed fengnu eru sett upp markmi\u00f0 um hvernig megi breyta
  heg\u00f0uninni.\\n\\nForvarnarstefna Akureyrarb\u00e6jar\\n\\n6.3. Kynfer\u00f0isleg
  \u00e1reitni\\n\\nKynfer\u00f0isleg \u00e1reitni og einelti l\u00ed\u00f0st ekki
  \u00ed leiksk\u00f3lum Akureyrarb\u00e6jar og \u00e1 \u00fea\u00f0 vi\u00f0 um alla,
  jafnt b\u00f6rn sem fullor\u00f0na. Ver\u00f0i einhver fyrir sl\u00edkri framkomu
  hefur s\u00e1 hinn sami r\u00e9tt til a\u00f0 tilkynna h\u00e1ttsemina til leiksk\u00f3lastj\u00f3ra,
  vi\u00f0komandi deildarstj\u00f3ra e\u00f0a \u00f6ryggistr\u00fana\u00f0armanns.\\n\\n\\\"Kynfer\u00f0isleg
  \u00e1reitni er kynfer\u00f0isleg heg\u00f0un sem er \u00f3sanngj\u00f6rn og/e\u00f0a
  m\u00f3\u00f0gandi og \u00ed \u00f3\u00fe\u00f6kk \u00feess sem fyrir henni ver\u00f0ur,
  hefur \u00e1hrif \u00e1 sj\u00e1lfsvir\u00f0ingu \u00feess e\u00f0a \u00feeirra
  sem fyrir henni ver\u00f0a og er haldi\u00f0 \u00e1fram \u00fer\u00e1tt fyrir a\u00f0
  gefi\u00f0 s\u00e9 sk\u00fdrt \u00ed skyn a\u00f0 heg\u00f0unin s\u00e9 \u00f3velkomin.
  Kynfer\u00f0isleg \u00e1reitni getur veri\u00f0 l\u00edkamleg, or\u00f0bundin e\u00f0a
  t\u00e1knr\u00e6n.\\\" (sbr. l\u00f6g um jafna st\u00f6\u00f0u og jafna r\u00e9tt
  kvenna og karla nr. 96/2000,17.gr).\\n\\n\u00cd vinnuverndarl\u00f6gum nr. 46/1980
  er geti\u00f0 um a\u00f0 atvinnurekandi skuli tryggja a\u00f0 g\u00e6tt s\u00e9
  fyllsta \u00f6ryggis, g\u00f3\u00f0s a\u00f0b\u00fana\u00f0ar og hollustuh\u00e1tta
  \u00e1 vinnusta\u00f0. Undir \u00feessa skilgreiningu laganna fellur einelti.\\n\\n6.4.
  Einelti\\n\\nEinelti er samskiptavandi, s\u00edendurteki\u00f0 andlegt e\u00f0a
  l\u00edkamlegt ofbeldi og beinist a\u00f0 \u00e1kve\u00f0num einstaklingi. Gerandi
  er einstaklingur e\u00f0a h\u00f3pur og stundum \u00e1ttar vi\u00f0komandi sig ekki
  \u00e1 \u00fev\u00ed a\u00f0 um einelti er a\u00f0 r\u00e6\u00f0a. \u00cd \u00f6\u00f0rum
  tilvikum getur einelti veri\u00f0 af \u00e1settu r\u00e1\u00f0i og \u00fe\u00e1
  oft vegna \u00feess a\u00f0 gerandanum sj\u00e1lfum l\u00ed\u00f0ur illa.\\n\\nEinelti
  getur einnig veri\u00f0 a\u00f0 finna \u00ed vinnuskipulagi sk\u00f3lans. Einelti
  gerir l\u00edfi\u00f0 \u00e1 vinnusta\u00f0num ill\u00feolanlegt e\u00f0a \u00f3b\u00e6rilegt
  fyrir starfsmanninn, dregur \u00far starfsorku og hefur sl\u00e6m \u00e1hrif \u00e1
  starfsandann.\\n\\nVer\u00f0i einhver fyrir sl\u00edkri framkomu hefur s\u00e1 hinn
  sami r\u00e9tt til a\u00f0 tilkynna h\u00e1ttsemina til sk\u00f3lastj\u00f3ra, \u00f6ryggisvar\u00f0ar
  e\u00f0a \u00f6ryggistr\u00fana\u00f0armanns og munu \u00feeir a\u00f0ilar a\u00f0sto\u00f0a
  starfsmanninn vi\u00f0 a\u00f0 leita r\u00e9ttar s\u00edns og sinna \u00farlausn
  m\u00e1lsins \u00ed samvinnu vi\u00f0 \u00feolanda, geranda/gerendur og s\u00e9rfr\u00f3\u00f0a
  a\u00f0ila ef \u00feurfa \u00feykir.\\n\\n6.5.Forv\u00f6rn\\n\\n\u00cd upphafi sk\u00f3lag\u00f6ngu
  barnsins hefst forvarnarstarf gegn einelti me\u00f0 opnum og j\u00e1kv\u00e6\u00f0um
  samskiptum \u00e1 milli heimilis og sk\u00f3la. Samskipti barna innbyr\u00f0is og
  hvernig \u00feeim er h\u00e1tta\u00f0 skipar st\u00f3rt hlutverk \u00ed forvarnarstarfi
  gegn einelti. \u00d6ll \u00e1hersla \u00e1 vin\u00e1ttu og vinatengsl er mikilv\u00e6g.
  \u00de\u00e1 er \u00e1hersla leiksk\u00f3lans \u00e1 uppbyggingu j\u00e1kv\u00e6\u00f0rar
  sj\u00e1lfsmyndar barns mikil forv\u00f6rn \u00fev\u00ed ef barni\u00f0 hefur sterka
  sj\u00e1lfsmynd \u00e6tti \u00fea\u00f0 a\u00f0 vera betur \u00ed stakk b\u00fai\u00f0
  ef \u00fea\u00f0 lendir \u00ed e\u00f0a ver\u00f0ur vitni a\u00f0 einelti\\n\\nHlutverk
  starfsmanna sem fyrirmynd skiptir \u00f6llu m\u00e1li, b\u00e6\u00f0i hva\u00f0
  var\u00f0ar vi\u00f0horf, framkomu og vi\u00f0br\u00f6g\u00f0 vi\u00f0 einelti.
  Starfsmenn skulu \u00e1vallt vera vakandi fyrir samskiptum barnanna \u00fev\u00ed
  einelti byrjar oft \u00ed sm\u00e1um og duldum atvikum sem geta vaxi\u00f0 ef ekki
  er brug\u00f0ist flj\u00f3tt vi\u00f0 \u00feeim.\\n\\n6.6. Markmi\u00f0 me\u00f0
  forvarnastefnu leiksk\u00f3lanna.\\n\\n\u2756 Starfsmenn \u00feekki einelti \u00feegar
  \u00fea\u00f0 \u00e1 s\u00e9r sta\u00f0.\\n\u2756 Starfsmenn kunni a\u00f0 uppr\u00e6ta
  e\u00f0a vinna me\u00f0 eineltism\u00e1l, ef \u00feau koma upp.\\n\u2756 Vinna skal
  eftir \u00e1kve\u00f0nu ferli vi\u00f0 \u00farlausn eineltism\u00e1la.\\n\\n\u2756
  Vinna skal eftir \u00e1\u00e6tlun sem allir starfsmenn \u00feekkja og unni\u00f0
  er eftir ef einelti kemur upp. Hvert m\u00e1l er einstakt og unni\u00f0 er samkv\u00e6mt
  \u00fev\u00ed.\\n\\n7. M\u00f3ttaka og brottf\u00f6r\\n\\nBarn \u00fearf a\u00f0
  finna a\u00f0 \u00fea\u00f0 s\u00e9 velkomi\u00f0 \u00e1 hverjum degi \u00ed sk\u00f3lann
  og a\u00f0 n\u00e6rvera \u00feess skipti m\u00e1li, \u00fea\u00f0 getur haft \u00e1hrif
  \u00e1 l\u00ed\u00f0an barnsins allan daginn. Eins \u00fearf a\u00f0 skapa kyrrl\u00e1ta
  og skemmtilega stund \u00ed lok dagsins svo barni\u00f0 fari s\u00e1tt heim og hlakki
  til a\u00f0 koma aftur. Kve\u00f0ja skal s\u00e9rhvert barn \u00feegar \u00fea\u00f0
  b\u00fdst til heimfer\u00f0ar. \u00deegar barni\u00f0 \u00e1 afm\u00e6li m\u00e6tir
  \u00fea\u00f0 \u00ed leiksk\u00f3lann og er \u00fe\u00e1 komi\u00f0 me\u00f0 afm\u00e6liskve\u00f0ju
  \u00ed h\u00f3lfi\u00f0 sitt.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 barninu finnist
  \u00fea\u00f0 velkomi\u00f0 \u00ed sk\u00f3lann.\\n\u2756 A\u00f0 heilsa \u00feeim
  b\u00f6rnum s\u00e9rstaklega sem hafa veri\u00f0 lengi \u00ed burtu.\\n\u2756 A\u00f0
  taka eins \u00e1 m\u00f3ti \u00f6llum b\u00f6rnum.\\n\u2756 A\u00f0 barni s\u00e9
  heilsa\u00f0 me\u00f0 nafni.\\n\u2756 Foreldrum og barni bo\u00f0i\u00f0 g\u00f3\u00f0an
  daginn.\\n\u2756 A\u00f0 hvert barn s\u00e9 kvatt me\u00f0 nafni og \u00fev\u00ed
  \u00feakka\u00f0 fyrir daginn.\\n\u2756 A\u00f0 hafa punkta fyrir foreldra um barni\u00f0
  \u00ed lok dags.\\n\u2756 A\u00f0 skapa kyrrl\u00e1ta og r\u00f3lega stund fyrir
  barni\u00f0 \u00ed upphafi og enda dags.\\n\u2756 Skifa\u00f0 er \u00e1 t\u00f6flu
  deildar hvernig dagurinn gekk fyrir sig svo a\u00f0 foreldrar og b\u00f6rn geti
  \u00e1tt um\u00e6\u00f0ur um dag barnsins \u00feegar heim er komi\u00f0.\\n\\n8.
  Fataherbergi\\n\\n\u00cd fataherbergi sk\u00f3la fer fram mikilv\u00e6gt uppeldisstarf.
  B\u00f6rnin \u00feurfa flest a\u00f0sto\u00f0 vi\u00f0 \u00fatif\u00f6tin sem eru
  nau\u00f0synleg vegna \u00edslenskrar ve\u00f0r\u00e1ttu. Sj\u00e1lfsbjargarvi\u00f0leitni
  barnanna ber einnig a\u00f0 \u00f6rva og vir\u00f0a. \u00cd fataherberginu l\u00e6rir
  barni\u00f0 sm\u00e1m saman a\u00f0 kl\u00e6\u00f0a sig \u00far og \u00ed og ganga
  snyrtilega fr\u00e1 fatna\u00f0i s\u00ednum. \u00dear hj\u00e1lpa b\u00f6rnin l\u00edka
  hvert \u00f6\u00f0ru.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 \u00f6ll b\u00f6rn
  ver\u00f0i sj\u00e1lfbjarga \u00ed fataherberginu um 5 \u00e1ra aldurinn.\\n\u2756
  A\u00f0 hvetja yngri b\u00f6rnin til a\u00f0 reyna a\u00f0 bjarga s\u00e9r sj\u00e1lf.\\n\u2756
  A\u00f0 kenna \u00feeim hugt\u00f6k.\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\nLei\u00f0ir:\\n\\n\u2756
  A\u00f0 \u00feau l\u00e6ri a\u00f0 skipuleggja sig,  \u00fe.e. \u00ed hva\u00f0
  \u00e1 a\u00f0 fara n\u00e6st og kl\u00e6\u00f0a sig eftir ve\u00f0ri.\\n\u2756
  A\u00f0 \u00feau l\u00e6ri tillitssemi og samhj\u00e1lp \u00ed \u00fer\u00f6ngu
  fataherbergi og a\u00f0 hj\u00e1lpa hvert \u00f6\u00f0ru.\\n\u2756 A\u00f0 \u00feau
  l\u00e6ri a\u00f0 ganga vel um f\u00f6tin s\u00edn og annarra.\\n\u2756 A\u00f0
  hafa f\u00e1 b\u00f6rn \u00ed einu \u00ed fataherberginu \u00feannig a\u00f0 h\u00e6gt
  s\u00e9 a\u00f0 vinna me\u00f0 \u00feeim\\n\u2756 A\u00f0 hr\u00f3sa \u00feeim \u00feegar
  vel gengur.\\n\u2756 A\u00f0 skapa r\u00f3lega stund og gefa \u00feeim t\u00edma
  \u00feegar veri\u00f0 er a\u00f0 kl\u00e6\u00f0a sig \u00ed f\u00f6tin.\\n\u2756
  A\u00f0 vera me\u00f0 ve\u00f0urkort fyrir alla aldursh\u00f3pa \u00fear sem \u00feau
  skiptast \u00e1 a\u00f0 vera ve\u00f0urfr\u00e6\u00f0ingar, \u00feau athugi ve\u00f0ri\u00f0
  og hvernig \u00e1 a\u00f0 kl\u00e6\u00f0a sig eftir \u00fev\u00ed, yfirfer\u00f0
  \u00e1 ve\u00f0urkortinu getur einnig fari\u00f0 fram \u00ed samverustundum fyrir
  \u00fativeru.\\n\u2756 Hafa myndr\u00e6nt \u00ed hva\u00f0a \u00fatif\u00f6t \u00e1
  a\u00f0 fara \u00ed \u00ed forstofunni.\\n\u2756 Nota fataherbergi\u00f0 til a\u00f0
  r\u00edma og klappa atkv\u00e6\u00f0i \u201er\u00e9ttu m\u00e9r vettl-ing-anan\\\"\\n\u2756
  \u00cd forstofun s\u00e9u myndir af \u00fev\u00ed \u00ed hva\u00f0a \u00fatif\u00f6t
  \u00e1 a\u00f0 fara.\\n\\n9. Matm\u00e1lst\u00edmar\\n\\nMe\u00f0 \u00fev\u00ed
  a\u00f0 taka \u00fe\u00e1tt \u00ed bor\u00f0haldi me\u00f0 b\u00f6rnum skapar kennarinn
  festu og r\u00f3. \u00dear gefst t\u00e6kif\u00e6ri til a\u00f0 styrkja g\u00f3\u00f0a
  bor\u00f0si\u00f0i og spjalla vi\u00f0 b\u00f6rnin. \u00deegar b\u00f6rn hafa n\u00e1\u00f0
  n\u00e6gum \u00feroska eiga \u00feau a\u00f0 hj\u00e1lpa til vi\u00f0 undirb\u00faning
  m\u00e1lt\u00ed\u00f0ar og fr\u00e1gang a\u00f0 m\u00e1lt\u00ed\u00f0 lokinni. \u00dea\u00f0
  styrkir f\u00e9lagsvitund barna og \u00feau l\u00e6ra a\u00f0 meta gildi samvinnu.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 stu\u00f0la a\u00f0 \u00fev\u00ed a\u00f0 b\u00f6rnin ver\u00f0i sj\u00e1lfbjarga
  vi\u00f0 matarbor\u00f0i\u00f0.\\n\u2756 A\u00f0 b\u00f6rnin l\u00e6ri almenna bor\u00f0si\u00f0i.\\n\u2756
  A\u00f0 b\u00f6rnin l\u00e6ri  a\u00f0 vinna saman og deila me\u00f0 s\u00e9r verkum.\\n\u2756
  A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 leggja \u00e1 bor\u00f0, n\u00e1 \u00ed matinn
  og bj\u00f3\u00f0a til bor\u00f0s.\\n\u2756 A\u00f0 skapa r\u00f3lega og kyrrl\u00e1ta
  stund vi\u00f0 matarbor\u00f0i\u00f0\\n\\nLei\u00f0ir:\\n\\n\u2756 A\u00f0 b\u00f6rnin
  skammti s\u00e9r sj\u00e1lf \u00e1 diskana og bjargi s\u00e9r a\u00f0 mestu leyti
  sj\u00e1lf.\\n\u2756 A\u00f0 b\u00f6rnin gangi fr\u00e1 matar\u00e1h\u00f6ldum s\u00ednum
  \u00e1 matarvagninn.\\n\\n10. Hv\u00edld\\n\\nN\u00e6gjanlegur og reglulegur svefn
  og g\u00f3\u00f0 hv\u00edld er \u00f6llum b\u00f6rnum nau\u00f0synleg, ekki s\u00edst
  fyrstu \u00e1r \u00e6vinnar \u00feegar v\u00f6xtur og \u00feroski er hva\u00f0 \u00f6rastur.
  Svefn- og hv\u00edldart\u00edmar eru \u00fev\u00ed nau\u00f0synlegir til a\u00f0
  tryggja andlega og l\u00edkamlega vell\u00ed\u00f0an barnanna. Hv\u00edldart\u00edmi
  gefur t\u00e6kif\u00e6ri til a\u00f0 skapa tengsl vi\u00f0 hvert einstakt barn og
  barnah\u00f3pinn sem heild.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 b\u00f6rnin f\u00e1
  t\u00e6kif\u00e6ri til a\u00f0 hv\u00edla sig eftir h\u00e1degismat, fr\u00e1 erli
  dagsins.\\n\u2756 A\u00f0 b\u00f6rnin hafi notalega a\u00f0st\u00f6\u00f0u til hv\u00edldar
  me\u00f0 d\u00fdnum og teppum.\\n\u2756 A\u00f0 skapa g\u00f3\u00f0a a\u00f0st\u00f6\u00f0u
  fyrir hv\u00edldina, vagna og d\u00fdnur.\\n\u2756 A\u00f0 hafa ekki of st\u00f3ra
  h\u00f3pa \u00ed hv\u00edldarstund, \u00feannig a\u00f0 hvert barn n\u00e1i g\u00f3\u00f0ri
  sl\u00f6kun.\\n\u2756 A\u00f0 eldri nemendur hafi val um a\u00f0 taka r\u00f3lega
  stund vi\u00f0 r\u00f3lega bor\u00f0vinnu.\\n\u2756 A\u00f0 kynna nemendum \u00f3l\u00edkar
  lei\u00f0til til hv\u00edldar/sl\u00f6kunar, eins og t.d a\u00f0 liggja, sitja vi\u00f0
  bor\u00f0 a\u00f0 teikna, hlusta \u00e1 s\u00f6gur e\u00f0a fara \u00ed j\u00f3ga.\\n\\n11.
  Hreinl\u00e6ti\\n\\nMikilv\u00e6gt er a\u00f0 b\u00f6rnunum s\u00e9 hj\u00e1lpa\u00f0
  til vi\u00f0 a\u00f0 tileinka s\u00e9r almennar hreinl\u00e6tisvenjur \u00e1 \u00feann
  h\u00e1tt a\u00f0 \u00feau \u00feroski jafnframt me\u00f0 s\u00e9r heilbrigt vi\u00f0horf
  til sj\u00e1lfs s\u00edn, l\u00edkama s\u00edns og s\u00e9rst\u00e6\u00f0is. \u00cd
  sk\u00f3la skal styrkja hreinl\u00e6tisvenjur barnsins.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 b\u00f6rnin tileinki s\u00e9r almennar hreinl\u00e6tisvenjur s.s. eftir
  salernisfer\u00f0ir, fyrir/eftir m\u00e1lt\u00ed\u00f0ir, eftir \u00fativeru, fyrir
  bakstur.\\n\\nLei\u00f0ir:\\n\\n\u2756 A\u00f0 hafa umhverfi\u00f0 a\u00f0gengilegt
  fyrir b\u00f6rnin til a\u00f0 \u00feau ver\u00f0i sj\u00e1lfbjarga og l\u00e6ri
  a\u00f0 bera \u00e1byrg\u00f0 \u00e1 sj\u00e1lfu s\u00e9r.\\n\\n12. Samstarf heimilis
  og sk\u00f3la\\n\\nForeldrar bera frum\u00e1byrg\u00f0 \u00e1 uppeldi og velfer\u00f0
  barna sinna en leiksk\u00f3lanum ber a\u00f0 veita foreldrum stu\u00f0ning \u00ed
  uppeldi barnanna. Mikilv\u00e6gt er a\u00f0 n\u00e1i\u00f0 samstarf og gagnkv\u00e6mt
  traust skapist milli heimilis og sk\u00f3la. Foreldrar \u00feekkja barn sitt best,
  \u00feeir hafa \u00feekkt \u00fea\u00f0 fr\u00e1 f\u00e6\u00f0ingu og fylgjast me\u00f0
  \u00feroskaferli \u00feess og l\u00ed\u00f0an. Kennari kynnist barni \u00ed starfi
  sk\u00f3lans  og \u00feekkir \u00feroska \u00feess, f\u00e6rni og vi\u00f0br\u00f6g\u00f0
  \u00ed barnah\u00f3pi.\\n\\n12.1 Foreldrasamstarf\\n\\n\u00cd A\u00f0aln\u00e1mskr\u00e1
  leiksk\u00f3la segir a\u00f0 markmi\u00f0 me\u00f0 foreldrasamstarfi s\u00e9 a\u00f0:\\n\\n\u2756
  veita foreldrum uppl\u00fdsingar um starfsemi sk\u00f3lans\\n\u2756 veita foreldrum
  uppl\u00fdsingar um \u00feroska barnsins og st\u00f6\u00f0u \u00feess \u00ed sk\u00f3lanum\\n\u2756
  afla uppl\u00fdsinga um a\u00f0st\u00e6\u00f0ur og uppeldisvi\u00f0horf foreldra\\n\u2756
  stu\u00f0la a\u00f0 \u00fe\u00e1ttt\u00f6ku foreldra \u00ed starfi sk\u00f3lans\\n\u2756
  r\u00e6kta samvinnu og samskipti sk\u00f3lans og heimilanna\\n\u2756 skapa umr\u00e6\u00f0uvettvang
  fyrir sko\u00f0anaskipti um uppeldi barna.\\n\\nMarkmi\u00f0 sk\u00f3lans:\\n\\n\u2756
  A\u00f0 veita foreldrum uppl\u00fdsingar um l\u00ed\u00f0an, \u00feroska og st\u00f6\u00f0u
  barnsins\\n\u2756 A\u00f0 stu\u00f0la a\u00f0 g\u00f3\u00f0u samstarfi vi\u00f0
  foreldra\\n\u2756 A\u00f0 stu\u00f0la a\u00f0 \u00fe\u00e1ttt\u00f6ku foreldra \u00ed
  starfi sk\u00f3lans\\n\u2756 A\u00f0 gagnkv\u00e6mur tr\u00fana\u00f0ur r\u00edki
  milli foreldra og starfsf\u00f3lks\\n\u2756 A\u00f0 veita foreldrum jafnt og \u00fe\u00e9tt
  uppl\u00fdsingar um starfsemi sk\u00f3lans, hva\u00f0 er a\u00f0 gerast hverju sinni.\\n\u2756
  Foreldrar eru bo\u00f0a\u00f0ir \u00ed samtal tvisvar \u00e1 \u00e1ri. \u00cd okt\u00f3ber
  og mars. .\\n\u2756 A\u00f0 sj\u00e1 til \u00feess a\u00f0 foreldrum berist uppl\u00fdsingar
  me\u00f0 sk\u00f3ladagatali, vikulegum uppl\u00fdsingap\u00f3stum fr\u00e1 deildum
  , uppl\u00fdsingat\u00f6flum \u00ed fataherbergjum deilda og \u00ed gegnum uppl\u00fdsingaforriti\u00f0
  Karellen. Einnig heldur sk\u00f3linn \u00fati metna\u00f0arfullri heimas\u00ed\u00f0u
  \u00e1 netinu.\\n\u2756 A\u00f0 gefa foreldrum inns\u00fdn \u00ed starf leiksk\u00f3lans,
  m.a. \u00ed formi foreldrakaffis og opinna daga..\\n\u2756 A\u00f0 stu\u00f0la a\u00f0
  \u00fe\u00e1ttt\u00f6ku foreldra \u00ed starfi leiksk\u00f3lans m.a. me\u00f0 starfi
  \u00ed foreldraf\u00e9laginu.\\n\u2756 A\u00f0 foreldrar og forr\u00e1\u00f0amenn
  viti a\u00f0 \u00feeir eru alltaf velkomnir \u00ed sk\u00f3lann\\n\\nLei\u00f0ir:\\n\\n12.2
  Kynning \u00e1 sk\u00f3lanum\\n\\nSamstarf heimilis og sk\u00f3la hefst \u00e1\u00f0ur
  en barn byrjar \u00ed sk\u00f3lanum. Um \u00fea\u00f0 leiti sem barn byrjar eru
  foreldrar bo\u00f0nir til kynningarfundar \u00fear sem sk\u00f3lastj\u00f3ri kynnir
  sk\u00f3lann, A\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la, sk\u00f3lan\u00e1mskr\u00e1,
  uppeldistefnu sk\u00f3lans og a\u00f0rar stefnur. \u00c1 \u00feeim fundi er me\u00f0al
  annars fari\u00f0 yfir  foreldrahandb\u00f3k Ki\u00f0agils sem geymir gagnlegar
  uppl\u00fdsingar fyrir foreldra \u00e1samt \u00e1\u00e6tlun yfir a\u00f0l\u00f6gun
  barnsins. Foreldrahandb\u00f3k Ki\u00f0agils er a\u00f0gengileg \u00e1 heimas\u00ed\u00f0u
  sk\u00f3lans http://kidagil.karellen.is/\\n\\n13. A\u00f0l\u00f6gun \u00ed leiksk\u00f3la\\n\\n\u00deegar
  barn byrjar \u00ed leiksk\u00f3la er \u00fea\u00f0 st\u00f3r stund \u00ed l\u00edfi
  \u00feess og foreldranna. Fyrir margar fj\u00f6lskyldur eru \u00feetta t\u00edmam\u00f3t
  sem krefjast breytinga \u00e1 h\u00f6gum \u00feeirra og geta valdi\u00f0 streitu.
  Til a\u00f0 au\u00f0velda b\u00f6rnum og foreldrum \u00feessar breytingar er unni\u00f0
  eftir s\u00e9rst\u00f6ku skipulagi \u00ed leiksk\u00f3lanum sem heitir \u00fe\u00e1ttt\u00f6ku\u00e1\u00e6tlun.\\n\\n\u00de\u00e1ttt\u00f6kua\u00f0l\u00f6gun.\\n\\n\u00dea\u00f0
  sem einkennir \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gun er a\u00f0 athyglin beinist
  fyrst og fremst a\u00f0 b\u00f6rnunum, henni er \u00e6tla\u00f0 a\u00f0 l\u00e9tta
  \u00feeim a\u00f0skilna\u00f0inn vi\u00f0 foreldra. B\u00f6rnin kynnast starfsf\u00f3lkinu
  sm\u00e1m saman og traust skapast milli \u00feeirra. Hin s\u00ed\u00f0ari \u00e1r
  hefur Jafnframt er eitt af markmi\u00f0um a\u00f0l\u00f6gunar s\u00e9 a\u00f0 foreldrum
  gefist t\u00e6kif\u00e6ri til a\u00f0 kynnast starfsf\u00f3lki og treysta \u00fev\u00ed.\\n\\nLeiksk\u00f3linn
  er samf\u00e9lag \u00fear sem fullor\u00f0nir og b\u00f6rn byggja upp \u00feekkingu
  saman, sta\u00f0ur n\u00e1mst\u00e6kif\u00e6ra. Barni\u00f0 tekur virkan \u00fe\u00e1tt
  \u00ed a\u00f0 m\u00f3ta umhverfi sitt og \u00feekkingu. \u00cd \u00feeim anda er
  \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gun. H\u00fan byggist \u00e1 \u00fev\u00ed
  a\u00f0 ekki s\u00e9 veri\u00f0 a\u00f0 venja barni\u00f0 vi\u00f0 a\u00f0 vera
  skili\u00f0 eftir \u00ed leiksk\u00f3lanum, heldur s\u00e9 \u00fea\u00f0 a\u00f0
  l\u00e6ra a\u00f0 vera \u00ed n\u00fdjum a\u00f0st\u00e6\u00f0um. A\u00f0l\u00f6gunin
  byggir \u00e1 fullri \u00fe\u00e1ttt\u00f6ku foreldranna \u00ed starfi leiksk\u00f3lans
  \u00fe\u00e1 daga sem h\u00fan \u00e1 s\u00e9r sta\u00f0.\\n\\n13.1 \u00de\u00e1ttt\u00f6kua\u00f0l\u00f6gun\\n\\nVi\u00f0
  \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gun er tiltekinn dagur upphafsdagur leiksk\u00f3lans
  og \u00feann dag m\u00e6ta allir foreldrar og b\u00f6rn sem eiga a\u00f0 byrja \u00e1
  s\u00f6mu deild, saman \u00ed leiksk\u00f3lann. Foreldrar eru bo\u00f0nir \u00e1
  kynningarfund \u00e1\u00f0ur en a\u00f0l\u00f6gun hefst. \u00dear eru \u00feeim
  kynnt starfsemi sk\u00f3lans og fari\u00f0 yfir \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gunina.
  Foreldrar eru me\u00f0 b\u00f6rnunum \u00ed \u00ferj\u00e1 daga. \u00c1 fyrsta degi
  m\u00e6ta foreldrar me\u00f0 b\u00f6rnin kl. 9-11.30 og n\u00e6stu tvo daga fr\u00e1
  8:00-15:00. Foreldrarnir eru inni \u00e1 deild me\u00f0 b\u00f6rnum allan t\u00edmann.
  Foreldrar sinna eigin b\u00f6rnum, skipta \u00e1 \u00feeim, gefa \u00feeim a\u00f0
  bor\u00f0a, leika me\u00f0 \u00feeim og eru til sta\u00f0ar. Starfsf\u00f3lki\u00f0
  tekur a\u00f0 sj\u00e1lfs\u00f6g\u00f0u l\u00edka \u00fe\u00e1tt, skipuleggur daginn,
  deilir \u00fat verkefnum. \u00cd h\u00e1deginu eru fundir me\u00f0 foreldrum. \u00c1
  fj\u00f3r\u00f0a degi koma b\u00f6rnin eins og vistunart\u00edminn segir til um
  , kve\u00f0ja foreldrana og eru s\u00f3tt \u00ed fyrra lagi.\\n\\n\u00de\u00e1ttt\u00f6kua\u00f0l\u00f6gun
  byggir m.a. \u00e1 \u00feeirri tr\u00fa a\u00f0 foreldrar smiti eigin \u00f6ryggiskennd,
  forvitni og spennu yfir \u00feessum n\u00fdju a\u00f0st\u00e6\u00f0um til barna
  sinna. Me\u00f0 \u00fev\u00ed a\u00f0 foreldrar s\u00e9u fullir \u00fe\u00e1tttakendur
  fr\u00e1 fyrsta degi \u00f6\u00f0last \u00feeir \u00f6ryggi um dagskipulagi\u00f0
  og \u00fea\u00f0 sem \u00e1 s\u00e9r sta\u00f0 \u00ed leiksk\u00f3lanum, \u00feeir
  sj\u00e1i starfsf\u00f3lk \u00ed verki. \u00deeir kynnast ekki bara starfsm\u00f6nnum
  heldur \u00f6\u00f0rum b\u00f6rnum, foreldrum og \u00fev\u00ed sem \u00e1 s\u00e9r
  sta\u00f0 \u00ed leiksk\u00f3lanum. \u00dea\u00f0 er jafnframt talinn kostur vi\u00f0
  \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gun a\u00f0 foreldrar tengjast og milli \u00feeirra
  skapast vinskapur og traust.\\n\\nKostir sem leiksk\u00f3lakennarar sj\u00e1 vi\u00f0
  \u00fe\u00e1ttt\u00f6kua\u00f0l\u00f6gunina er a\u00f0 \u00fea\u00f0 skapast meiri
  n\u00e1nd vi\u00f0 foreldrana. \u201e\u00deeir v\u00e6ru ekki \u00ed hlutverki gesta\\\",
  \u201e\u00feeir v\u00e6ru heimavanir \u00ed leiksk\u00f3lanum\\\".\\n\\n(Teki\u00f0
  \u00far grein eftir Krist\u00ednu D\u00fdrfj\u00f6r\u00f0).\\n\\nA\u00f0l\u00f6gunin
  h\u00e9r a\u00f0 ofan \u00e1 vi\u00f0 2ja og 3ja \u00e1ra b\u00f6rnin, me\u00f0
  eldri b\u00f6rnum er einnig lagt upp me\u00f0 \u00ferj\u00e1 daga en oft \u00e1
  t\u00ed\u00f0um \u00feurfa eldri b\u00f6rn me\u00f0 reynslu af leiksk\u00f3la, styttri
  t\u00edma \u00ed a\u00f0l\u00f6gun.\\n\\n14. Dagleg samskipti\\n\\nForeldrar \u00feurfa
  a\u00f0 fylgjast me\u00f0 \u00fev\u00ed sem hefur drifi\u00f0 \u00e1 daga barnsins
  \u00ed sk\u00f3lanum og kennari \u00fearf a\u00f0 vita um helstu atbur\u00f0i \u00ed
  l\u00edfi barnsins utan sk\u00f3lans. Mikilv\u00e6gt er a\u00f0 foreldrar l\u00e1ti
  kennara barnsins vita ef breytingar ver\u00f0a \u00e1 h\u00f6gum \u00feess og fj\u00f6lskyldul\u00edfi.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 stu\u00f0la a\u00f0 g\u00f3\u00f0um og traustum samskiptum vi\u00f0 foreldra.\\n\\nLei\u00f0ir:\\n\\n\u2756
  A\u00f0 daglegt uppl\u00fdsingafl\u00e6\u00f0i fari fram \u00ed fataherbergi og
  \u00e1 deildinni \u00feegar barn kemur og er s\u00f3tt \u00e1 daginn. Mikilv\u00e6gt
  a\u00f0 gagnkv\u00e6mt uppl\u00fdsingafl\u00e6\u00f0i s\u00e9 milli foreldra og
  starfsmanna, s.s. ef breytingar ver\u00f0a \u00e1 h\u00f6gum barnsins.\\n\u2756
  A\u00f0 Karellen samskipta sm\u00e1forriti\u00f0 s\u00e9 kynnt fyrir forr\u00e1\u00f0am\u00f6nnum
  og nota\u00f0 til samskipta.\\n\\n15. Foreldrasamt\u00f6l\\n\\nForeldrar \u00feurfa
  a\u00f0 f\u00e1 uppl\u00fdsingar um st\u00f6\u00f0u barns og l\u00ed\u00f0an \u00feess
  \u00ed leiksk\u00f3la. Fari\u00f0 er me\u00f0 allar uppl\u00fdsingar um barni\u00f0
  sem tr\u00fana\u00f0arm\u00e1l.\\n\\nUmsj\u00f3narkennari barnsins b\u00fd\u00f0ur
  foreldrum \u00ed fyrsta samtal, vikuna \u00e1\u00f0ur en barni\u00f0 byrjar \u00ed
  a\u00f0l\u00f6gun. Ef \u00fea\u00f0 n\u00e6st ekki er fyrsta samtal teki\u00f0 \u00e1
  a\u00f0l\u00f6gunard\u00f6gum.\\n\\nEftir \u00fea\u00f0 eru tv\u00f6 foreldrasamt\u00f6l
  \u00e1 hverju sk\u00f3la\u00e1ri. Anna\u00f0 \u00ed okt\u00f3ber og hitt \u00ed
  mars. Fari\u00f0 er yfir \u00feroska barnsins, l\u00ed\u00f0an \u00feess og st\u00f6\u00f0u
  \u00ed sk\u00f3lanum. Stu\u00f0st er vi\u00f0 samr\u00e6md foreldrasprurningabl\u00f6\u00f0
  sem sett eru saman af deildarstj\u00f3rum Ki\u00f0agils. Foreldrsamtals bla\u00f0i\u00f0
  er byggt \u00e1 \u00feroskalistum sem \u00e1\u00f0ur voru nota\u00f0ir og l\u00e6sisb\u00f3k
  Ki\u00f0agils.\\n\\nA\u00f0 auki fer fram vi\u00f0tal hven\u00e6r sem foreldri \u00f3skar
  \u00feess e\u00f0a kennari telur \u00fe\u00f6rf \u00e1 \u00fev\u00ed.\\n\\n15.1
  Samstarf og samt\u00f6l vi\u00f0 foreldra\\n\\nNau\u00f0synlegt er a\u00f0 foreldrar
  gefi kennara uppl\u00fdsingar um hagi barnsins og fr\u00e6\u00f0ist jafnframt um
  starf deildarinnar. Kennarinn \u00fearf a\u00f0 f\u00e1 heildarmynd af \u00feroska
  barns og st\u00f6\u00f0u \u00feegar \u00ed upphafi.\\n\\n16. Almennar uppl\u00fdsingar
  og fr\u00e6\u00f0sla\\n\\nSk\u00f3lanum ber a\u00f0 veita foreldrum barna uppl\u00fdsingar
  og fr\u00e6\u00f0slu um sk\u00f3lastarfi\u00f0. \u00dea\u00f0 er gert me\u00f0 daglegum
  uppl\u00fdsingum \u00e1 uppl\u00fdsingat\u00f6flu \u00ed fataherbergi deilda \u00e1
  heimas\u00ed\u00f0u sk\u00f3lans, \u00ed gegnum forriti\u00f0 Karellen og \u00e1
  foreldrafundum.\\n\\nAlmennar uppl\u00fdsingar eru m.a:\\n\\n\u2756 \u00cd vikulegum
  p\u00f3stum fr\u00e1 deildum.\\n\u2756 \u00cd formi n\u00e1mskr\u00e1 sem fer \u00e1
  heimas\u00ed\u00f0u Ki\u00f0agils fyrir hvern m\u00e1nu\u00f0.\\n\u2756 \u00cd formi
  deildarkynninga \u00e1 haustin \u00fear sem hver deild kynnir starf sitt, s\u00e9rst\u00f6\u00f0u
  og starfsf\u00f3lk.\\n\u2756 \u00c1 foreldrafundi  \u00ed samr\u00e1\u00f0i vi\u00f0
  foreldraf\u00e9lagi\u00f0 einu sinni \u00e1ri, \u00fear sem oft er bo\u00f0i\u00f0
  upp \u00e1 fr\u00e6\u00f0sluefni.\\n\u2756 \u00c1 heimas\u00ed\u00f0u sk\u00f3lans.(
  http://kidagil.karellen.is/)\\n\\n17. \u00de\u00e1tttaka foreldra \u00ed sk\u00f3lastarfinu.\\n\\n\u00cd
  takti vi\u00f0 aukna vi\u00f0veru barna \u00ed sk\u00f3lum og \u00fear af lei\u00f0andi
  s\u00edaukinna \u00e1hrifa sk\u00f3lans \u00e1 l\u00edf barna  aukast m\u00f6guleikar
  foreldra til \u00feess a\u00f0 taka \u00fe\u00e1tt og hafa \u00e1hrif \u00e1 sk\u00f3lastarfi\u00f0.\\n\\n17.1
  Foreldrar\u00e1\u00f0:\\n\\nSkv. L\u00f6gum um leiksk\u00f3la nr. 90 fr\u00e1 12.
  j\u00fan\u00ed 2008 skal starfa vi\u00f0 sk\u00f3lann foreldrar\u00e1\u00f0. \u00cd
  foreldrar\u00e1\u00f0i sitja a\u00f0 l\u00e1gmarki \u00fer\u00edr foreldrar. Kj\u00f6r
  \u00ed foreldrar\u00e1\u00f0 fer fram \u00ed september \u00e1r hvert og er \u00fev\u00ed
  kosi\u00f0 til eins \u00e1rs \u00ed senn. Foreldrar\u00e1\u00f0i\u00f0 setur s\u00e9r
  starfsreglur og sk\u00f3lastj\u00f3ranum ber a\u00f0 starfa me\u00f0 \u00fev\u00ed.
  Hlutverk r\u00e1\u00f0sins er a\u00f0 gefa umsagnir til leiksk\u00f3la og sk\u00f3lanefndar
  um sk\u00f3lan\u00e1mskr\u00e1 og a\u00f0rar \u00e1\u00e6tlanir sem var\u00f0a starfsemi
  sk\u00f3lans. Foreldrar\u00e1\u00f0 skal fylgjast me\u00f0 framkv\u00e6md sk\u00f3lan\u00e1mskr\u00e1r
  og annarra \u00e1\u00e6tlana innan sk\u00f3lans og kynningu \u00feeirra fyrir foreldrum.
  Foreldrar\u00e1\u00f0 hefur umsagnarr\u00e9tt um allar meiri h\u00e1ttar breytingar
  \u00e1 sk\u00f3lastarfinu.\\n\\n17.2 Foreldraf\u00e9lag\\n\\nVi\u00f0 s\u00e9rhvern
  sk\u00f3la skal starfa foreldraf\u00e9lag og skulu fundnir haldnir reglulega. \u00cd
  foreldraf\u00e9lagi sitja b\u00e6\u00f0i foreldrar og valin starfsma\u00f0ur sk\u00f3lans.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 foreldrar s\u00e9u virkir og taki \u00fe\u00e1tt \u00ed starfssemi sk\u00f3lans.\\n\u2756
  A\u00f0 foreldrar grei\u00f0i f\u00e9lagsgj\u00f6ld sem n\u00fdtist \u00ed \u00fe\u00e1gu
  barnanna.\\n\u2756 A\u00f0 foreldrar s\u00e9u vel uppl\u00fdstir um \u00fea\u00f0
  starf sem \u00fear fer fram.\\n\u2756 A\u00f0 haldinn s\u00e9 a\u00f0alfundur einu
  sinni \u00e1 \u00e1ri \u00fear sem r\u00e6dd eru venjuleg a\u00f0alfundarst\u00f6rf
  og fr\u00e6\u00f0slufundir.\\n\u2756 A\u00f0 foreldraf\u00e9lagi\u00f0 haldi j\u00f3laball.\\n\u2756
  A\u00f0 foreldraf\u00e9lagi\u00f0 taki \u00fe\u00e1tt \u00ed kostna\u00f0i vi\u00f0
  sveitafer\u00f0 a\u00f0 vori.\\n\u2756 A\u00f0 foreldrar haldi grillh\u00e1t\u00ed\u00f0
  a\u00f0 vori sem einnig fer fram \u00fatskrift elstu barnanna.\\n\u2756 A\u00f0
  foreldraf\u00e9lagi\u00f0 leggi f\u00e9 til \u00fdmiskonar d\u00e6grastyttingar
  t. d. hafa leiks\u00fdningar og j\u00f3ga veri\u00f0 keyptar inn \u00ed sk\u00f3lann
  \u00e1 vegum f\u00e9lagsins.\\n\u2756 A\u00f0 foreldrar n\u00fdti till\u00f6gur\u00e9tt
  sinn \u00e1 deildarkynningum og komi fram me\u00f0 hugmyndir um starfi\u00f0 \u00e1
  deildinni.\\n\\n17.3 Foreldraf\u00e9lagi\u00f0 Vinar\u00f3t\\n\\nForeldraf\u00e9lagi\u00f0
  Vinar\u00f3t var stofna\u00f0 13. febr\u00faar 1996.\\n\\nL\u00f6g f\u00e9lagsins:\\n\\n1.gr.
  F\u00e9lagi\u00f0 heitir Vinar\u00f3t og eru allir foreldrar/forr\u00e1\u00f0amenn
  barna \u00ed sk\u00f3lanum Ki\u00f0agili sj\u00e1lfkrafa f\u00e9lagar. F\u00e9lagi\u00f0
  er einnig opi\u00f0 starfsf\u00f3lki Ki\u00f0agils.\\n\\nLei\u00f0ir:\\n\\n2.gr.
  Markmi\u00f0 f\u00e9lagsins er a\u00f0 tryggja sem besta velfer\u00f0 barna \u00ed
  Ki\u00f0agili og styrkja samskipti milli foreldra/forr\u00e1\u00f0amanna, starfsf\u00f3lks
  og barna.\\n\\n3.gr. Lei\u00f0ir a\u00f0 markmi\u00f0um skal f\u00e9lagi\u00f0 r\u00e6\u00f0a
  \u00e1 a\u00f0al- e\u00f0a f\u00e9lagsfundi. \u00d6llum f\u00e9lagsm\u00f6nnum er
  frj\u00e1lst a\u00f0 koma me\u00f0 till\u00f6gur til stj\u00f3rnar um fr\u00e6\u00f0slu,
  efni og upp\u00e1komur e\u00f0a anna\u00f0 \u00fea\u00f0 sem m\u00e6tti styrkja
  e\u00f0a efla f\u00e9lagi\u00f0. Haldin skal fundager\u00f0arb\u00f3k og b\u00f3kf\u00e6ra
  allar \u00e1kvar\u00f0anir b\u00e6\u00f0i \u00e1 almennum f\u00e9lagsfundum sem
  og stj\u00f3rnarfundum.\\n\\n4.gr. A\u00f0alfundur skal haldinn a\u00f0 hausti \u00e1r
  hvert \u00e1 t\u00edmabilinu 1. september til 15. n\u00f3vember og skal hann bo\u00f0a\u00f0ur
  me\u00f0 minnst viku fyrirvara.\\n\\n5.gr. Stj\u00f3rn f\u00e9lagsins skulu skipa
  6 foreldrar \u00e1samt 1 starfsmanni fr\u00e1 sk\u00f3lanum. Stj\u00f3rnin skal
  halda 7-9 fundi \u00e1 \u00e1ri og oftar ef \u00feurfa \u00feykir.\\n\\n6.gr. L\u00f6gum
  f\u00e9lagsins m\u00e1 einungis breyta \u00e1 a\u00f0alfundi. Till\u00f6gur til
  lagabreytinga ver\u00f0a a\u00f0 hafa borist stj\u00f3rn f\u00e9lagsins \u00ed s\u00ed\u00f0asta
  lagi 3 d\u00f6gum fyrir augl\u00fdstan f\u00e9lagsfund.\\n\\n7.gr. Gj\u00f6ld f\u00e9lagsins
  skulu innheimt tvisvar \u00e1 \u00e1ri 1. n\u00f3vember og 1. ma\u00ed me\u00f0
  g\u00edr\u00f3se\u00f0li. F\u00e9lagsgj\u00f6ldin skulu \u00e1kve\u00f0in \u00e1r
  hvert \u00e1 a\u00f0alfundi.\\n\\n18. Opi\u00f0 h\u00fas\\n\\n\u00c6skilegt er a\u00f0
  bj\u00f3\u00f0a foreldrum og a\u00f0standendum barnanna \u00f6\u00f0ru hverju \u00ed
  s\u00e9rstaka heims\u00f3kn \u00ed sk\u00f3lann, t.d. \u00ed tengslum vi\u00f0 s\u00fdningar
  og h\u00e1t\u00ed\u00f0ir.\\n\\n\u00c1 vorin er opi\u00f0 h\u00fas og grillveisla
  \u00ed Ki\u00f0agili \u00fear sem foreldrum gefst t\u00e6kif\u00e6ri \u00e1 a\u00f0
  sko\u00f0a s\u00fdnishorn af sk\u00f6punarverkum barnanna yfir veturinn. A\u00f0
  sj\u00e1lfs\u00f6g\u00f0u eru foreldrar og forr\u00e1\u00f0amenn alltaf velkomnir
  \u00ed heims\u00f3kn, hvort sem er til a\u00f0 taka \u00fe\u00e1tt \u00ed starfinu
  e\u00f0a vera \u00e1horfendur.\\n\\n19. \u00der\u00f3unarstarf \u00ed sk\u00f3lum\\n\\nMarkmi\u00f0
  \u00fer\u00f3unarstarfs er a\u00f0 leita lei\u00f0a sem mi\u00f0a a\u00f0 endurb\u00f3tum
  og n\u00fdbreytni \u00ed sk\u00f3lastarfi. \u00der\u00f3unarverkefni felur \u00ed
  s\u00e9r afmarka\u00f0 og t\u00edmabundi\u00f0 vi\u00f0fangsefni me\u00f0 vel skilgreindum
  markmi\u00f0um. \u00deegar huga\u00f0 er a\u00f0 \u00fer\u00f3unarstarfi er nau\u00f0synlegt
  a\u00f0 setja ni\u00f0ur fyrir s\u00e9r \u00feann starfsgrundv\u00f6ll sem a\u00f0hyllst
  er.\\n\\n\u00der\u00f3unarstarf hefur m.a. veri\u00f0 skilgreint \u00e1 eftirfarandi
  h\u00e1tt:\\n\\nPetterson (1991 bls.31) segir a\u00f0 Uppeldislegt \u00fer\u00f3unarstarf
  s\u00e9 samheiti yfir n\u00fdbreytni starf sem felur m.a. \u00ed s\u00e9r allt fr\u00e1
  \u00fev\u00ed a\u00f0 reyna n\u00fdjar a\u00f0fer\u00f0ir og leikefni til framkv\u00e6mda
  kerfisbundinna \u00e1\u00e6tlana\\n\\nStarfsf\u00f3lk Ki\u00f0agils hefur unni\u00f0
  a\u00f0 tveimur \u00fer\u00f3unarverkefnum. \u00c1ri\u00f0 1999-2001 var unni\u00f0
  verkefni\u00f0 \u201eEftir \u00fev\u00ed sem \u00f6ryggi\u00f0 eykst\\\"  sem haf\u00f0i
  \u00fea\u00f0 a\u00f0 markmi\u00f0i a\u00f0 starfsf\u00f3lk\\n\\ntileinka\u00f0i
  s\u00e9r vinnubr\u00f6g\u00f0 tengd \u00edtalska uppeldisfr\u00e6\u00f0ingnum Loris
  Malaguzzi en starfsa\u00f0fer\u00f0 hans hefur veri\u00f0 kennd vi\u00f0 borgina
  Reggio Emilia.\\n\\n\u201eTr\u00edtla\u00f0 yfir br\u00fana\\\" var heiti \u00fer\u00f3unarverkefnis
  sem unni\u00f0 var \u00ed sk\u00f3lanum \u00ed samstarfi vi\u00f0 Giljask\u00f3la
  \u00e1ri\u00f0 2003-2004. \u00dear var markmi\u00f0i\u00f0 a\u00f0 efla tengsl elstu
  nemenda leiksk\u00f3lans og yngstu nemenda grunnsk\u00f3lans. Vori\u00f0 2009 h\u00f3fst
  vinna vi\u00f0 n\u00fdtt \u00fer\u00f3unarverkefni \u00ed samvinnu vi\u00f0 Kennslu\u00fer\u00f3unarsvi\u00f0
  H\u00e1sk\u00f3lans \u00e1 Akureyri, sem f\u00e9kk vinnuheiti\u00f0 \u201eLeiksk\u00f3lal\u00e6si\\\".
  Verkefni\u00f0 hefur a\u00f0 markmi\u00f0i a\u00f0 kenna b\u00f6rnum lestur \u00ed
  gegnum leik allt fr\u00e1 \u00fev\u00ed a\u00f0 \u00feau byrja leiksk\u00f3lag\u00f6ngu
  s\u00edna. Vi\u00f0 undirb\u00faning a\u00f0fer\u00f0arinnar er Byrjendal\u00e6si
  haft til hli\u00f0sj\u00f3nar sem  lestrarkennslua\u00f0fer\u00f0 \u00ed grunnsk\u00f3la
  og einnig er liti\u00f0 til \u201eBernskul\u00e6sis\\\"  um hvernig b\u00f6rn tileinka
  s\u00e9r lestur \u00ed gegnum umhverfi sitt. Fyrst og fremst ver\u00f0ur leikurinn
  haf\u00f0ur a\u00f0 lei\u00f0arlj\u00f3si og \u00fer\u00f3a\u00f0ar ver\u00f0a a\u00f0fer\u00f0ir
  til \u00feess a\u00f0 n\u00fdta hann markvisst til hugtaka- og lestrarkennslu.\\n\\n20.
  Stj\u00f3rnun og stj\u00f3rnunarh\u00e6ttir\\n\\nFram kemur \u00ed Leiksk\u00f3lastefnu
  F\u00cdl (2000, bls. 30) a\u00f0 \u00feegar sk\u00f3lan\u00e1mskr\u00e1in er \u00f6llu
  starfsf\u00f3lki lj\u00f3s, \u00fearf sk\u00f3lastj\u00f3rinn ekki st\u00f6\u00f0ugt
  a\u00f0 hafa \u00e1hyggjur af stefnumi\u00f0unum og hvort starfsmannah\u00f3purinn
  fylki s\u00e9r um \u00feau \u00ed samst\u00edga g\u00f6ngu. Hann getur \u00e1 hinn
  b\u00f3ginn l\u00e9tt \u00e1 g\u00f6ngunni me\u00f0 \u00fev\u00ed a\u00f0 ry\u00f0ja
  hindrunum \u00far vegi, \u00fatvega\u00f0 efnivi\u00f0, hvatt til d\u00e1\u00f0a
  og unni\u00f0 a\u00f0 nau\u00f0synlegum stj\u00f3rnunarverkefnum. Hann getur noti\u00f0
  \u00feess a\u00f0 skynja samhuginn \u00e1 lei\u00f0inni, samfagna\u00f0 \u00feegar
  fer\u00f0alaginu l\u00fdkur og sagt til um n\u00e6sta \u00e1fangasta\u00f0. Gangan
  s\u00e9r um sig sj\u00e1lf.\\n\\nSk\u00f3lastj\u00f3rinn gegnir lykilhlutverki \u00ed
  \u00fer\u00f3un sk\u00f3lastarfsins. Sk\u00f3lastj\u00f3rinn skapar a\u00f0st\u00e6\u00f0ur
  sem stu\u00f0la a\u00f0 \u00fev\u00ed a\u00f0 auka h\u00e6fni starfsmanna og betri
  menntun barna. Vi\u00f0 \u00e1rangursr\u00edka sk\u00f3la\u00fer\u00f3un er mikilv\u00e6gt
  a\u00f0 sk\u00f3lastj\u00f3ri leggi \u00e1herslu \u00e1 umr\u00e6\u00f0ur um innihald
  sk\u00f3lan\u00e1mskr\u00e1rinnar, s\u00e9rstakar \u00e1herslur \u00ed sk\u00f3lastarfinu
  og starfsa\u00f0fer\u00f0ir. \u00cd umr\u00e6\u00f0um starfsf\u00f3lks birtast vi\u00f0horf
  og l\u00edfssko\u00f0anir hvers og eins.\\n\\nSk\u00f3lastj\u00f3rinn \u00fearf
  a\u00f0 gera s\u00e9r grein fyrir hva\u00f0 \u00fea\u00f0 er sem hann telur mikilv\u00e6gt,
  hvernig hann vill a\u00f0 samskiptum s\u00e9 h\u00e1tta\u00f0 og hva\u00f0a stj\u00f3rnunarst\u00edl
  hann beitir.\\n\\nSk\u00f3lastj\u00f3ri ber \u00e1byrg\u00f0 \u00e1 a\u00f0 heildarstefna
  \u00ed uppeldis- og menntam\u00e1lum sk\u00f3lans s\u00e9 vel ger\u00f0. \u00de\u00e1
  s\u00e9r hann til \u00feess a\u00f0 \u00e1\u00e6tlanir s\u00e9u ger\u00f0ar og a\u00f0
  \u00fea\u00f0 fari fram reglulegt mat \u00e1 starfi sk\u00f3lans.\\n\\n20.1 Fundir\\n\\nSk\u00f3lastj\u00f3ri
  ber \u00e1byrg\u00f0 \u00e1 a\u00f0 starfsmannafundir s\u00e9u haldnir og stj\u00f3rnar
  \u00feeim. Sk\u00f3lastj\u00f3ri skapar a\u00f0st\u00e6\u00f0ur fyrir a\u00f0ra
  fundi, s.s. deildarfundi.\\n\\nSkipulagsdagar eru tveir \u00e1 sk\u00f3la\u00e1rinu.
  \u00deessir dagar eru nota\u00f0ir til a\u00f0 skipuleggja og gera n\u00e1ms\u00e1\u00e6tlanir.
  N\u00e1mskei\u00f0sdagur er \u00e1rlega og starfsf\u00f3lk s\u00e6kir \u00fe\u00e1
  fr\u00e6\u00f0slu um m\u00e1lefni sem eru ofarlega \u00e1 baugi \u00ed sk\u00f3lanum.\\n\\nStarfsmannafundir.
  Hver leiksk\u00f3li \u00e1 Akureyri f\u00e6ri 48 klukkut\u00edma \u00e1 \u00e1ri
  sem \u00e6tla\u00f0ir eru til starfsmannafunda og skipulagsdaga. Venjan \u00e1 Ki\u00f0agili
  er s\u00fa a\u00f0 einn heill 8 t\u00edma dagur er einu sinni \u00e1 \u00f6nn. Afgangurinn
  af t\u00edmunum er nota\u00f0ur \u00ed h\u00e1lfa daga sem \u00fdmist eru fr\u00e1
  8-12 e\u00f0a fr\u00e1 12:15-16. Skipulag starfsmannafunda er alltaf bori\u00f0
  undir foreldrar\u00e1\u00f0 til sam\u00feykktar. \u00c1 starfsmannafundum er fundarritari
  og fundarstj\u00f3ri sem heldur utan um fundinn. Fundaritari skr\u00e1ir \u00fea\u00f0
  sem fram fer \u00e1 fundinum. Sk\u00f3lastj\u00f3ri er \u00e1byrg\u00f0ara\u00f0ili
  og s\u00e9r um a\u00f0 fundirnir s\u00e9u haldnir.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 allt starfsf\u00f3lk sk\u00f3lans hittist og tali saman um m\u00e1lefni
  sk\u00f3lans og taki sameiginlegar \u00e1kvar\u00f0anir.\\n\u2756 A\u00f0 tryggja
  betri uppl\u00fdsingami\u00f0lun til starfsf\u00f3lks.\\n\u2756 A\u00f0 tryggja
  fr\u00e6\u00f0slu og endurmat \u00e1 starfseminni.\\n\\nStj\u00f3rnarfundir eru
  haldnir einu sinni \u00ed viku 1 klst. \u00ed senn. \u00de\u00e1 sitja deildarstj\u00f3rar,
  s\u00e9rkennslustj\u00f3ri og sk\u00f3lastj\u00f3rnendur. Sk\u00f3lastj\u00f3ri
  ber \u00e1byrg\u00f0 \u00e1 a\u00f0 fundirnir s\u00e9u haldnir og ritar fundarger\u00f0.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 mi\u00f0la uppl\u00fdsingum\\n\u2756 A\u00f0 r\u00e6\u00f0a m\u00e1lefni
  sk\u00f3lans\\n\u2756 A\u00f0 stu\u00f0la a\u00f0 fram\u00fer\u00f3un sk\u00f3lans\\n\u2756
  A\u00f0 taka \u00e1kvar\u00f0anir um sameiginleg m\u00e1l.\\n\u2756 A\u00f0 samr\u00e6ma
  starfi\u00f0\\n\\nDeildarfundir eru haldnir \u00e1 vinnut\u00edma einu sinni \u00ed
  m\u00e1nu\u00f0i \u00e1 hverri deild. Funart\u00edmi er 1 klst. Deildarfundir eru
  einnig hluti af starfsmannafundum. Framkv\u00e6md deildarfunda fer \u00feannig fram
  a\u00f0 deildir a\u00f0sto\u00f0a hvor a\u00f0ra vi\u00f0 afleysingu og gera hvor
  annarri kleift a\u00f0 halda auka deildarfundi.\\n\\nMarkmi\u00f0\\n\\n\u2756 A\u00f0
  mi\u00f0la uppl\u00fdsingum innan deildarinnar.\\n\\nLei\u00f0ir:\\n\\n\u2756 A\u00f0
  samr\u00e6ma starf innan deildarinnar.\\n\u2756 A\u00f0 taka \u00e1kvar\u00f0anir
  sem var\u00f0a deildina.\\n\u2756 A\u00f0 fara yfir SMT verklag og reglukennslur.\\n\\n20.2
  Bo\u00f0lei\u00f0ir\\n\\nSk\u00f3lastj\u00f3ri s\u00e9r til \u00feess a\u00f0 starfsmenn
  geti kynnt s\u00e9r n\u00fdjungar \u00ed starfi og mi\u00f0la\u00f0 \u00feekkingu
  sinni og uppl\u00fdsingum til annarra starfsmanna. Sk\u00f3lastj\u00f3ra ber a\u00f0
  sj\u00e1 til \u00feess a\u00f0 bo\u00f0lei\u00f0ir s\u00e9u sk\u00fdrar innan sk\u00f3lans,
  \u00ed allar \u00e1ttir.\\n\\nBo\u00f0lei\u00f0ir Ki\u00f0agils:\\n\\n\u2756 Starfsmannafundir/deildafundir/stj\u00f3rnarfundir.\\n\u2756
  Undirb\u00faningst\u00edmar kennara/lei\u00f0beinanda.\\n\u2756 Uppl\u00fdsingatafla
  \u00ed starfsmannar\u00fdmi.\\n\u2756 Fundarger\u00f0ir fr\u00e1 stj\u00f3rnarfundum
  og samr\u00e1\u00f0sfundum eru sendar \u00ed p\u00f3sti \u00e1 alla starfsmenn.\\n\u2756
  T\u00f6lvup\u00f3stur til starfsmanna.\\n\\n20.3 Samstarf\\n\\nSk\u00f3lastj\u00f3ri
  skapar a\u00f0st\u00e6\u00f0ur til a\u00f0 gott samstarf s\u00e9 \u00e1 milli deilda,
  einnig til a\u00f0 koma \u00e1 g\u00f3\u00f0u samstarfi vi\u00f0 foreldra. Hann
  stu\u00f0lar a\u00f0 samstarfi vi\u00f0 vi\u00f0komandi grunnsk\u00f3la \u00feannig
  a\u00f0 \u00fea\u00f0 skapist g\u00f3\u00f0 tengsl milli sk\u00f3lastiga og samfella
  myndist \u00ed n\u00e1mi barnsins.\\n\\n20.3.1. Samstarf milli deilda\\n\\n\u2756
  Eldri deildirnar hafa samstarf \u00ed formi vinnuh\u00f3pa og \u00ed \u00fativeru.\\n\u2756
  Einnig heims\u00f3knir milli deilda og val \u00e1 milli deilda\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 b\u00f6rn og starfsf\u00f3lk kynnist innbyr\u00f0is.\\n\u2756 A\u00f0 b\u00f6rn
  og starfsf\u00f3lk beri vir\u00f0ingu fyrir \u00f6\u00f0rum og eigum annarra.\\n\u2756
  A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 nj\u00f3ta fj\u00f6lbreytileikans sem b\u00fdr
  \u00ed einstaklingnum.\\n\u2756 A\u00f0 kynnast h\u00fasn\u00e6\u00f0i og a\u00f0b\u00fana\u00f0i
  sk\u00f3lans.\\n\u2756 A\u00f0 hittast \u00ed morgunver\u00f0arstundinni.\\n\u2756
  A\u00f0 hittast \u00ed \u00fativeru.\\n\\nLei\u00f0ir:\\n\\n\u2756 A\u00f0 hittast
  \u00ed vinnustundum og \u00e1 opnum degi.\\n\u2756 A\u00f0 hittast \u00ed vali.\\n\\n20.3.2.
  Samstarf milli leiksk\u00f3la og grunnsk\u00f3la:\\n\\nMilli kennara:\\n\\nA.m.k.
  2 uppl\u00fdsingafundir \u00e1 vetri me\u00f0 kennurum beggja sk\u00f3lastiga. \u00dear
  er vetrarstarfi\u00f0 undirb\u00fai\u00f0 og n\u00e1msefni\u00f0 sko\u00f0a\u00f0.
  R\u00e1\u00f0leggingar eru veittar \u00e1 b\u00e1\u00f0a b\u00f3ga.\\n\\nMarkmi\u00f0:\\n\\n\u2756
  A\u00f0 stu\u00f0la a\u00f0 vell\u00ed\u00f0an barnanna vi\u00f0 flutning milli
  sk\u00f3lastiga.\\n\u2756 A\u00f0 byggja kennslu \u00e1 fyrri reynslu barnanna.\\n\u2756
  A\u00f0 samfella skapist \u00ed n\u00e1mi barnanna.\\n\u2756 A\u00f0 elstu b\u00f6rnin
  fari \u00ed nokkrar heims\u00f3knir yfir veturinn \u00ed grunnsk\u00f3lann.\\n\u2756
  A\u00f0 elstu b\u00f6rnin taki \u00fe\u00e1tt \u00ed starfi grunnsk\u00f3lans.\\n\u2756
  A\u00f0 elstu b\u00f6rnin sko\u00f0i h\u00fasn\u00e6\u00f0i og umhverfi grunnsk\u00f3lans.\\n\u2756
  A\u00f0 l\u00f6g\u00f0 s\u00e9 \u00e1hersla \u00e1 sk\u00f3lastofuna, bekkinn og
  kennarana.\\n\u2756 A\u00f0 ver\u00f0andi nemendum grunnsk\u00f3lans er bo\u00f0i\u00f0
  \u00e1 generalprufu vegna \u00e1rsh\u00e1t\u00ed\u00f0ar grunnsk\u00f3lans.\\n\u2756
  A\u00f0 fyrsti bekkur grunnsk\u00f3lans komi \u00e1 Ki\u00f0agil \u00ed heims\u00f3kn.\\n\\n21.
  Verkaskipting og \u00e1byrg\u00f0arsvi\u00f0\\n\\nSk\u00f3lastj\u00f3ri stj\u00f3rnar
  daglegri starfsemi sk\u00f3lans, hann ber rekstrarlega sem og faglega \u00e1byrg\u00f0
  \u00e1 starfi sk\u00f3lans. Starfsmannah\u00f3purinn \u00fearf a\u00f0 koma s\u00e9r
  saman um verkaskiptingu innan sk\u00f3lans og skilgreina starfshlutverk hvers og
  eins. Me\u00f0 \u00fev\u00ed a\u00f0 virkja a\u00f0ra stj\u00f3rnendur innan sk\u00f3lans
  til \u00fe\u00e1ttt\u00f6ku og \u00e1byrg\u00f0ar \u00ed rekstrarlegum umr\u00e6\u00f0um
  og \u00e1kv\u00f6r\u00f0unum er au\u00f0veldara a\u00f0 g\u00e6ta hagr\u00e6\u00f0is
  \u00ed rekstri \u00e1n \u00feess a\u00f0 \u00fea\u00f0 r\u00fdri g\u00e6\u00f0i
  starfsins.\\n\\nDeildastj\u00f3rar stj\u00f3rna s\u00ednum deildum og bera \u00e1byrg\u00f0
  \u00e1 \u00fev\u00ed starfi sem \u00fear fer fram.\\n\\nSk\u00f3lastj\u00f3ri s\u00e9r
  um daglegt starf \u00ed sk\u00f3lanum. Hann ber \u00e1byrg\u00f0 \u00e1 rekstrarlegu
  og faglega starfi innan sk\u00f3lans.\\n\\n21.1 Starfsmannasamt\u00f6l\\n\\n\u00cd
  starfsmannasamt\u00f6lum eru r\u00e6ddar kr\u00f6fur og v\u00e6ntingar af beggja
  h\u00e1lfu, \u00fe.e. sk\u00f3lans og starfsmannsins. Sk\u00f3lastj\u00f3rinn \u00fearf
  a\u00f0 vera b\u00fainn a\u00f0 gera s\u00e9r grein fyrir markmi\u00f0um og tilgangi
  \u00e1\u00f0ur en hafist er handa og b\u00e6\u00f0i starfma\u00f0ur og stj\u00f3rnandi  \u00feurfa
  a\u00f0 vera vel undirb\u00fanir. Sk\u00f3lastj\u00f3rinn \u00fearf a\u00f0 hafa
  \u00e1kve\u00f0na umr\u00e6\u00f0upunkta sem hann byggir \u00f6ll starfsmannasamt\u00f6l
  \u00e1; \u00e1rangur \u00ed starfi, starfsumhverfi, starfssvi\u00f0 og a\u00f0st\u00e6\u00f0ur,
  \u00fer\u00f3un \u00ed starfi og anna\u00f0. \u00cd starfsmannavi\u00f0t\u00f6lum
  gefst t\u00e6kif\u00e6ri til a\u00f0 veita stu\u00f0ning og gefa uppbyggilega gagnr\u00fdni.\\n\\nSk\u00f3lastj\u00f3rinn
  gerir starfsmanni s\u00ednum grein fyrir v\u00e6ntingum og kr\u00f6fum sk\u00f3lans
  til starfsmannsins.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0 r\u00e6tt s\u00e9 vi\u00f0
  hvern starfsmann um l\u00ed\u00f0an, vinnuframlag hans og \u00fer\u00f3un \u00ed
  starfi.\\n\\nLei\u00f0ir:\\n\\n\u2756 A\u00f0 Starfsmannasamt\u00f6l s\u00e9u einu
  sinni \u00e1 \u00e1ri.\\n\u2756 A\u00f0 sk\u00f3lastj\u00f3ri bj\u00f3\u00f0i a\u00f0sto\u00f0arsk\u00f3lastj\u00f3ra,
  s\u00e9rkennslustj\u00f3ra, deildastj\u00f3rum og matr\u00e1\u00f0um \u00ed samt\u00f6l.\\n\u2756
  A\u00f0 deildastj\u00f3rar bj\u00f3\u00f0i starfsf\u00f3lki sinna deilda \u00ed
  samt\u00f6l anna\u00f0hvert \u00e1r.\\n\u2756 A\u00f0 sk\u00f3lastj\u00f3ri bj\u00f3\u00f0i
  starfsf\u00f3lki sk\u00f3lans \u00ed samt\u00f6l anna\u00f0hvert \u00e1r.\\n\\n21.1.1
  Fagleg a\u00f0sto\u00f0\\n\\nSk\u00f3lastj\u00f3ri s\u00e9r til \u00feess a\u00f0
  leita\u00f0 s\u00e9 a\u00f0sto\u00f0ar s\u00e9rfr\u00e6\u00f0inga, hvort heldur
  er um a\u00f0 r\u00e6\u00f0a einst\u00f6k b\u00f6rn e\u00f0a allan sk\u00f3lann.
  \u00deetta er einnig gert a\u00f0 frumkv\u00e6\u00f0i s\u00e9rkennslustj\u00f3ra.
  \u00deegar um er a\u00f0 r\u00e6\u00f0a einst\u00f6k b\u00f6rn er undantekningalaust
  \u00f3ska\u00f0 eftir leyfi foreldra \u00e1\u00f0ur en hafist er handa.\\n\\nVinnureglur
  sk\u00f3lans:\\n\\nLeiksk\u00f3lar\u00e1\u00f0gjafi kemur reglulega inn \u00ed sk\u00f3lann
  og getur veitir faglegar r\u00e1\u00f0leggingar, hvort heldur sem er var\u00f0andi
  einst\u00f6k b\u00f6rn, barnah\u00f3pinn e\u00f0a deildina \u00ed heild. Sk\u00f3linn
  hefur s\u00e9rkennslustj\u00f3ra sem hefur umj\u00f3n me\u00f0 s\u00e9rkennslub\u00f6rnum.
  Hann gerir einnig frumathugun \u00e1 \u00feeim b\u00f6rnum sem grunur leikur \u00e1
  a\u00f0 eigi vi\u00f0 einhverja \u00feroskar\u00f6skun a\u00f0 str\u00ed\u00f0a.\\n\\nA\u00f0rir
  s\u00e9rfr\u00e6\u00f0ingar sem h\u00e6gt er a\u00f0 leita til eru:\\n\\nS\u00e9rkennslur\u00e1\u00f0gjafi
  v/ s\u00e9rkennslubarna, starfandi \u00e1 fj\u00f6lskyldudeild.\\n\\nSk\u00f3lateymi.
  Talmeinafr\u00e6\u00f0ingar, Barnaverndarnefnd Eyjafjar\u00f0ar.\\n\\nEf grunur
  er um \u00feroskar\u00f6skun, gilda \u00e1kve\u00f0nar vinnureglur:\\n\\nDeildarstj\u00f3ri
  b\u00fd\u00f0ur foreldrum \u00ed samtal \u00e1samt s\u00e9rkennslustj\u00f3ra sk\u00f3lans,
  \u00fear sem a\u00f0st\u00e6\u00f0ur barnsins eru r\u00e6ddar. Ef deildarstj\u00f3ri
  e\u00f0a s\u00e9rkennslustj\u00f3ri eru me\u00f0 till\u00f6gur a\u00f0 \u00farr\u00e6\u00f0um
  eru \u00fe\u00e6r r\u00e6ddar og tekin \u00e1kv\u00f6r\u00f0un um hvort \u00feau
  eru reynd og hva\u00f0a athuganir s\u00e9 heppilegast a\u00f0 gera.\\n\\nSamtal
  s\u00e9rkennslustj\u00f3ra og deildarstj\u00f3ra me\u00f0 foreldrum \u00fear sem
  kynntar eru lei\u00f0ir til frumathugana \u00e1 \u00feroskast\u00f6\u00f0u barnsins,
  s.s. \u00cdslenski \u00feroskalistinn, AAL listinn (atferlisathugunarlisti) ofl.\\n\\nEf
  \u00e1st\u00e6\u00f0a \u00feykir eru ni\u00f0urst\u00f6\u00f0ur athugana sendar
  s\u00e9rkennslur\u00e1\u00f0gjafa \u00e1 fj\u00f6lskyldudeild \u00e1samt ums\u00f3kn
  um a\u00f0sto\u00f0 \u00fear sem fram kemur hva\u00f0 \u00fea\u00f0 er sem \u00f3ska\u00f0
  er eftir a\u00f0 ver\u00f0i sko\u00f0a\u00f0 hj\u00e1 vi\u00f0komandi barni.\\n\\n22.
  Mat \u00e1 leiksk\u00f3lastarfi\\n\\n\u00cd regluger\u00f0 um starfsemi leiksk\u00f3la
  segir a\u00f0 s\u00e9rhver leiksk\u00f3li skuli m\u00f3ta a\u00f0fer\u00f0ir til
  a\u00f0 meta uppeldisstarf, stj\u00f3rnunarh\u00e6tti og samskipti b\u00e6\u00f0i
  innan leiksk\u00f3lans og utan. Mat skal gert me\u00f0 hli\u00f0sj\u00f3n af l\u00f6gum,
  regluger\u00f0 og A\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la. S\u00e9rstaklega skal
  ger\u00f0 grein fyrir framkv\u00e6md og ni\u00f0urst\u00f6\u00f0um matsins. Mat
  \u00e1 leiksk\u00f3lastarfi er li\u00f0ur \u00ed \u00fer\u00f3un og vexti sk\u00f3lans
  og tengist markmi\u00f0um hans og \u00e1\u00e6tlunum.\\n\\nForeldrak\u00f6nnun sem
  ger\u00f0 er anna\u00f0 hvert \u00e1r\\n\\nK\u00f6nnun me\u00f0al starfsmanna sem
  ger\u00f0 anna\u00f0 hvert \u00e1r.\\n\\n22.1 Sj\u00e1lfsmat -Innra mat\\n\\nSj\u00e1lfsmat
  leggur faglegan grundv\u00f6ll a\u00f0 endurb\u00f3tum \u00ed sk\u00f3lastarfi og
  er lei\u00f0 til a\u00f0 vinna kerfisbundi\u00f0 a\u00f0 \u00fev\u00ed a\u00f0 auka
  g\u00e6\u00f0i sk\u00f3lastarfsins og gera \u00fea\u00f0 skilvirkara. \u00cd sj\u00e1lfsmati
  skal taka mi\u00f0 af markmi\u00f0um og stefnu sk\u00f3lans og l\u00fdsingu \u00e1
  lei\u00f0um til a\u00f0 n\u00e1 \u00feeim. Sj\u00e1lfsmati\u00f0 gerir starfsf\u00f3lki
  au\u00f0veldara a\u00f0 vinna a\u00f0 markmi\u00f0um sk\u00f3lans.\\n\\nEftirfarandi
  matsa\u00f0fer\u00f0ir eru nota\u00f0ar \u00ed Ki\u00f0agili:\\n\\n\u2756 Starfsmannasamt\u00f6l
  eru \u00ed formi snerpusamtala sem fara fram 5 sinnum yfir sk\u00f3la\u00e1ri\u00f0.
  Leiksk\u00f3lastj\u00f3rar taka tv\u00f6 af \u00feessum samt\u00f6lum og deildarstj\u00f3rar
  tv\u00f6. S\u00ed\u00f0asta samtali\u00f0 tekur leiksk\u00f3lastj\u00f3ri. Fyrirfram
  \u00e1kve\u00f0nar spurningar eru sendar \u00e1 starfsmenn og eru samt\u00f6lin
  bo\u00f0u\u00f0 me\u00f0 g\u00f3\u00f0uum fyrirvara. Snerpusamt\u00f6lin eiga a\u00f0
  vera stutt og hnitmi\u00f0u\u00f0. \u00deau\\n\\nkoma inn \u00e1 \u00fe\u00e6tti
  eins og l\u00ed\u00f0an \u00ed starfi, frammist\u00f6\u00f0u, starfsumhverfi og
  starfs\u00fer\u00f3unarm\u00f6guleika.\\n\u2756 Sj\u00e1lfsk\u00f6nnun \u00ed anda
  Fisks er send til allra starfmanna.\\n\u2756 HLJ\u00d3M-2 er lagt fyrir b\u00f6rn
  4,9 \u00e1ra til 6.1 \u00e1rs. Pr\u00f3fi\u00f0 kannar hlj\u00f3\u00f0kerfisvitund
  barna og gefur forsp\u00e1 um hversu vel barninu mun ganga a\u00f0 l\u00e6ra lestur.
  Ni\u00f0urst\u00f6\u00f0ur eru kynntar \u00ed foreldrasamt\u00f6lum.\\n\u2756 Stafa\u00feekkingark\u00f6nnun
  er l\u00f6g\u00f0 fyrir 3 elstu \u00e1rgangana \u00ferisvar \u00e1 sk\u00f3la\u00e1rinu,
  a\u00f0 hausti, um \u00e1ram\u00f3t og a\u00f0 vori.  \u00c1 vor\u00f6nn er kanna\u00f0
  hvar yngstu b\u00f6rnin standa.\\n\u2756 EFI-2 er lagt fyrir b\u00f6rn \u00e1 fj\u00f3r\u00f0a
  aldurs\u00e1ri. Pr\u00f3fi\u00f0 metur m\u00e1l\u00feroska barna.\\n\u2756 Foreldrasamt\u00f6l
  eru tekin tvisvar \u00e1 \u00e1ri \u00fear sem fari er yfir \u00feroska barnsins.
  Kennarar fylla \u00fat foreldrasamtalsbla\u00f0 og r\u00e6\u00f0a vi\u00f0 foreldra
  um \u00feroska , b\u00e6\u00f0i vitsmunalegan og f\u00e9lagslegann.\\n\u2756 SMT
  skr\u00e1ningar eru ger\u00f0ar fyrstu viku \u00ed hverjum m\u00e1nu\u00f0i til
  a\u00f0 kennarar geti a\u00f0sto\u00f0a\u00f0 nemendur betur a\u00f0 l\u00e6ra reglur
  sk\u00f3lans.\\n\u2756 Kennarar fylla einnig \u00fat P\u00fdram\u00edda SMT og eru
  ni\u00f0urst\u00f6\u00f0ur hans nota\u00f0ar til a\u00f0 kortleggja \u00fe\u00e1
  nemendur sem \u00feurfa \u00e1 aukinni hj\u00e1lp a\u00f0 halda \u00ed \u00fev\u00ed
  a\u00f0 tileinka s\u00e9r reglur og auka samskiptah\u00e6fni og f\u00e9lags\u00feroska.\\n\u2756
  L\u00e6sislistar. H\u00f3pstj\u00f3rar fylla \u00fat l\u00e6sislista fyrir hvert
  barn og hver deild er merkt \u00fat fr\u00e1 einkennandi lit. Sett eru vi\u00f0mi\u00f0
  um a\u00f0 nemendur n\u00e1i \u00feeim \u00fe\u00e1ttum sem sett eru fram \u00fat
  fr\u00e1 aldri barna hverju sinni. Ger\u00f0 er umb\u00f3ta\u00e1\u00e6tlun og samr\u00e1\u00f0
  vi\u00f0 s\u00e9rkennslustj\u00f3ra ef nemendur eru ekki a\u00f0 n\u00e1 vi\u00f0eigandi
  markmi\u00f0um \u00ed l\u00e6sis/\u00feroskalistum, sj\u00e1 kafla \u201emat \u00e1
  n\u00e1mi\\\".\\n\\n22.2 Vi\u00f0mi\u00f0 fyrir sj\u00e1lfsmat (A\u00f0aln\u00e1mskr\u00e1
  leiksk\u00f3la, 1999,39-44)\\n\\nMati\u00f0 \u00fearf a\u00f0 vera:\\n\\n\u2756
  Formlegt\\n\u2756 Alt\u00e6kt\\n\u2756 \u00c1rei\u00f0anlegt\\n\u2756 Samstarfsmi\u00f0a\u00f0\\n\u2756
  Umb\u00f3tami\u00f0a\u00f0\\n\u2756 Stofnana- og einstaklingsmi\u00f0a\u00f0\\n\u2756
  Greinandi\\n\u2756 L\u00fdsandi\\n\u2756 Opinbert\\n\\nH\u00e6gt er a\u00f0 setja
  mati\u00f0 \u00ed \u00ferj\u00e1 h\u00f6fu\u00f0flokka:\\n\\n\u2756 Mat \u00e1 leiksk\u00f3la
  sem stofnun\\n\u2756 Mat \u00e1 uppeldisstarfi\\n\u2756 Mat \u00e1 einstaklingum
  og barnah\u00f3pum\\n\\nVi\u00f0 innra mat \u00e1 leiksk\u00f3lastarfi skulu eftirfarandi
  atri\u00f0i athugu\u00f0:\\n\\n22.3 G\u00e6\u00f0arr\u00e1\u00f0\\n\\nMarkmi\u00f0
  innra mats er a\u00f0 tryggja a\u00f0 starfsemi sk\u00f3lans s\u00e9 \u00ed samr\u00e6mi
  vi\u00f0 l\u00f6g og regluger\u00f0ir og a\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la.
  Innra mat stu\u00f0lar a\u00f0 umb\u00f3tum sem b\u00e6tir sk\u00f3lastarfi\u00f0
  og efli sk\u00f3la\u00fer\u00f3un. \u00de\u00e6ttir innra mats fara eftir g\u00e6\u00f0avi\u00f0mi\u00f0um
  Akureyrar og er st\u00f6\u00f0ugt \u00ed endurmati og sko\u00f0un \u00ed \u00f6llu
  starfi sk\u00f3lans. \u00c1byrg\u00f0ara\u00f0ilar eru g\u00e6\u00f0ar\u00e1\u00f0
  og \u00ed \u00fev\u00ed sitja hagsmunara\u00f0ilar allra sem koma a\u00f0 sk\u00f3lanum.
  \u00de.e.a.s. fulltr\u00fai foreldra, sk\u00f3lastj\u00f3ra og \u00far \u00f6llum
  st\u00e9ttarf\u00e9lagum. G\u00e6\u00f0avi\u00f0mi\u00f0in eru innra mat, foreldrasamstarf,
  uppeldi og menntun, leiksk\u00f3labragur og stj\u00f3rnun. Ger\u00f0 er umb\u00f3ta\u00e1\u00e6tlun
  og skrifu\u00f0 innra matssk\u00fdrsla \u00e1rlega sem finna m\u00e1 \u00e1 heimas\u00ed\u00f0u
  sk\u00f3lans.\\n\\n23. Ytra mat\\n\\nMenntam\u00e1lar\u00e1\u00f0uneyti\u00f0 l\u00e6tur,
  samkv\u00e6mt l\u00f6gum um leiksk\u00f3la, fara fram skipulegt ytra mat a.m.k.
  \u00e1 einum leiksk\u00f3la \u00e1 \u00e1ri. Rekstrara\u00f0ili leiksk\u00f3la getur
  einnig l\u00e1ti\u00f0 framkv\u00e6ma sl\u00edkt mat. Mati er \u00e6tla\u00f0 a\u00f0
  tryggja a\u00f0 starfsemi leiksk\u00f3la s\u00e9 \u00ed samr\u00e6mi vi\u00f0 \u00e1kv\u00e6\u00f0i
  laga og regluger\u00f0ar og \u00ed samr\u00e6mi vi\u00f0 A\u00f0aln\u00e1mskr\u00e1
  leiksk\u00f3la.\\n\\n24. \u00d6ryggism\u00e1l\\n\\nForeldrar eiga a\u00f0 geta treyst
  \u00fev\u00ed a\u00f0 \u00f6ryggi barns s\u00e9 tryggt af fremsta megni \u00e1 me\u00f0an
  \u00e1 dv\u00f6l \u00feess stendur. Barni\u00f0 skal \u00e6t\u00ed\u00f0 vera undir
  eftirliti \u00feannig a\u00f0 \u00fea\u00f0 hvorki ska\u00f0i sj\u00e1lft sig n\u00e9
  a\u00f0ra \u00ed leiksk\u00f3lanum.\\n\\nStefna sk\u00f3lans \u00ed \u00f6ryggism\u00e1lum
  \u00e1 a\u00f0 vera foreldrum s\u00fdnileg, \u00ed handb\u00f3k fyrir starfsf\u00f3lk
  er svo fari\u00f0 \u00edtarlegar \u00ed vinnureglur var\u00f0andi einstaka \u00fe\u00e6tti.\\n\\n24.1
  Slys\\n\\nFyrstu vi\u00f0br\u00f6g\u00f0 vi\u00f0 slysum byggja \u00e1 \u00feekkingu,
  \u00fej\u00e1lfun og reynslu starfsmanna. \u00d6ll slys eru skr\u00e1\u00f0 \u00ed
  Karellen leiksk\u00f3lakerfi\u00f0 \u00cd \u00f6llum slysatilfellum \u00fear sem
  vafi er \u00e1 um greiningu, er hringt \u00e1 slysadeild og leita\u00f0 r\u00e1\u00f0a.
  Foreldrar eru l\u00e1tnir vita og haf\u00f0ir me\u00f0 \u00ed r\u00e1\u00f0um eftir
  a\u00f0st\u00e6\u00f0um.\\n\\n24.2 \u00c1fallahj\u00e1lp\\n\\nAndlegum \u00e1f\u00f6llum
  barns er sinnt eins og best ver\u00f0ur vi\u00f0 komi\u00f0 hverju sinni.\\n\\n\u00dea\u00f0
  eru \u00f3talmargir \u00fe\u00e6ttir \u00ed okkar daglega l\u00edfi sem hafa \u00e1hrif
  \u00e1 tilfinningal\u00edf okkar.\\n\\nVeikindi, skilna\u00f0ur, fj\u00e1rhags\u00e1hyggjur,
  n\u00fdtt barn, erfi\u00f0leikar \u00fdmis konar innan fj\u00f6lskyldunnar, allt
  \u00feetta snertir l\u00edf okkar.\\n\\nFullor\u00f0nir sem og b\u00f6rn breg\u00f0ast
  mj\u00f6g mismunandi vi\u00f0 \u00e1f\u00f6llum/a\u00f0st\u00e6\u00f0um og \\\"sorgarferli\u00f0\\\"
  getur sta\u00f0i\u00f0 misjafnlega lengi yfir. Okkur sem fyrir utan \u00fea\u00f0
  st\u00f6ndum getur \u00fdmist \u00fe\u00f3tt \u00fea\u00f0 of stutt e\u00f0a of
  langt. Einnig getur f\u00f3lk veri\u00f0 misjafnlega vel upplagt \u00e1 hverjum
  t\u00edma til \u00feess a\u00f0 takast \u00e1 vi\u00f0 hluti. Mikilv\u00e6gt er
  a\u00f0 gera s\u00e9r grein fyrir \u00fev\u00ed hversu misj\u00f6fn vi\u00f0 erum,
  okkur ber a\u00f0 vir\u00f0a tilfinningar hvers annars og veita stu\u00f0ning \u00feegar
  \u00fea\u00f0 \u00e1 vi\u00f0.\\n\\nStarfsmannah\u00f3purinn \u00fearf a\u00f0 s\u00fdna
  samheldni og samst\u00f6\u00f0u, vir\u00f0a tilfinningar hvers annars og barnanna,
  en allt innan e\u00f0lilegra marka.\\n\\n\u00deegar um skilna\u00f0 er a\u00f0 r\u00e6\u00f0a
  er nau\u00f0synlegt a\u00f0 kennarar leiksk\u00f3lans f\u00e1i uppl\u00fdsingar
  um sl\u00edkt fr\u00e1 foreldrum, til a\u00f0 geta stutt barni\u00f0 \u00ed gegnum
  breyingarnar sem skilna\u00f0ur hefur \u00ed f\u00f6r me\u00f0 s\u00e9r.  Ef andl\u00e1t
  a\u00f0ila sem tengist leiksk\u00f3lanum er a\u00f0 r\u00e6\u00f0a er hvert og eitt
  tilvik meti\u00f0 fyrir sig. B\u00e6\u00f0i hva\u00f0 var\u00f0ar tilkynningar og
  \u00e1kvar\u00f0anat\u00f6ku. \u00c1 sama h\u00e1tt og vi\u00f0 tilkynnum b\u00f6rnunum
  um andl\u00e1t segjum vi\u00f0 \u00feeim einnig fr\u00e1 skilna\u00f0i, \u00fev\u00ed
  \u00fea\u00f0 getur veri\u00f0 b\u00f6rnunum miki\u00f0 \u00e1fall \u00feegar foreldrar
  \u00feess skilja.\\n\\nMikilv\u00e6gt er a\u00f0 allir starfsmenn \u00e1 deildinni
  viti ef foreldrar eru a\u00f0 skilja/e\u00f0a eiga \u00ed einhverjum \u00f6\u00f0rum
  erfi\u00f0leikum.\\n\\nA\u00f0 starfsmenn s\u00e9u vakandi og tilb\u00fanir a\u00f0
  r\u00e6\u00f0a vi\u00f0 barni\u00f0 ef \u00fea\u00f0 vill tj\u00e1 sig. Alls ekki
  a\u00f0 \u00fer\u00fdsta \u00e1 barni\u00f0.\\n\\nMarkmi\u00f0:\\n\\n\u2756 A\u00f0
  geta brug\u00f0ist r\u00e9tt vi\u00f0 \u00feeim \u00e1f\u00f6llum sem b\u00f6rn
  og starfsmenn ver\u00f0a fyrir.\\n\u2756 A\u00f0 koma \u00ed veg fyrir \u00f3\u00f6ryggi
  og r\u00e1\u00f0aleysi starfsmanna.\\n\\n\u2756 A\u00f0 hj\u00e1lpa hvort \u00f6\u00f0ru
  a\u00f0 takast \u00e1 vi\u00f0 sorg og \u00e1f\u00f6ll sem gerast innan sk\u00f3lans
  e\u00f0a sem hafa \u00e1hrif inn \u00ed sk\u00f3lann.\\n\u2756 A\u00f0 efla \u00feekkingu
  starfsmanna \u00e1 sorg og \u00e1f\u00f6llum.\\n\\n24.3 Verklagsregla um andlega
  skyndihj\u00e1lp:\\n\\nTilgangur og afm\u00f6rkun:\\n\\n\u2756 A\u00f0 ver\u00f0a
  \u00f6ryggari \u00ed starfi.\\n\u2756 A\u00f0 starfsmenn ver\u00f0i betur \u00ed
  stakk b\u00fanir til a\u00f0 veita b\u00f6rnum og starfsm\u00f6nnum a\u00f0sto\u00f0
  \u00ed erfi\u00f0leikum \u00feeirra.\\n\u2756 A\u00f0 styrkja getu okkar til a\u00f0
  takast \u00e1 vi\u00f0 sorg og missi.\\n\\n24.4 \u00c1byrg\u00f0:\\n\\n\u00cd \u00e1fallateymi
  eru sk\u00f3lastj\u00f3ri, a\u00f0sto\u00f0arsk\u00f3lastj\u00f3ri, deildarstj\u00f3rar
  og me\u00f0limir \u201eLitla rau\u00f0a krossins\\\"  \u00ed honum er einn starfsma\u00f0ur
  af hverri deild hverju sinni, sem og a\u00f0sto\u00f0arsk\u00f3lastj\u00f3ri.\\n\\nVerklag:\\n\\nEf
  starfsma\u00f0ur fr\u00e9ttir af einhverju \u00e1falli sem tengist sk\u00f3lanum
  skal hann strax l\u00e1ta sk\u00f3lastj\u00f3ra e\u00f0a a\u00f0sto\u00f0arsk\u00f3lastj\u00f3ra
  vita. \u00deeir skulu stj\u00f3rna a\u00f0ger\u00f0um \u00ed samr\u00e1\u00f0i vi\u00f0
  me\u00f0limi Litla rau\u00f0a krossins. \u00deessi h\u00f3pur hittist ef \u00feurfa
  \u00feykir og \u00feeir sj\u00e1 um a\u00f0 tilkynna starfsf\u00f3lkinu strax hva\u00f0
  hefur gerst.\\n\\nEf barn/starfsma\u00f0ur/maki/foreldri/barn starfsmanns deyr um
  helgi, \u00fe\u00e1 skal hringja \u00ed starfsmenn og l\u00e1ta vita.\\n\\nAllir
  starfsmenn sk\u00f3lans f\u00e1i n\u00e1mskei\u00f0/fr\u00e6\u00f0slufund um sorg/sorgarvi\u00f0br\u00f6g\u00f0
  \u00feri\u00f0ja hvert \u00e1r.\\n\\nStj\u00f3rnendur skulu leita a\u00f0sto\u00f0ar
  til dj\u00e1kna/prests ef \u00fe\u00f6rf \u00feykir.\\n\\nTilv\u00edsanir:\\n\\nEfni
  um sorg og sorgarvi\u00f0br\u00f6g\u00f0 geymt \u00ed b\u00f3kasafni sk\u00f3lans.\\n\\n24.5
  Brunavarnir\\n\\nStefna \u00fearf a\u00f0 g\u00f3\u00f0u samstarfi vi\u00f0 eldvarnaeftirlit
  og sl\u00f6kkvili\u00f0 um brunavarnir og vi\u00f0br\u00f6g\u00f0 vi\u00f0 bruna.
  Starfsmenn kynna s\u00e9r vel bruna\u00fatg\u00f6ngulei\u00f0ir, sta\u00f0setningu
  sl\u00f6kkvit\u00e6kja og notkun \u00feeirra og \u00e6fa r\u00fdmingu sk\u00f3lans.\\n\\n24.6
  Eftirlit me\u00f0 \u00f6ryggis\u00fe\u00e1ttum\\n\\nAllur b\u00fana\u00f0ur, h\u00fasn\u00e6\u00f0i
  og l\u00f3\u00f0 er sko\u00f0a\u00f0 tvisvar \u00e1 \u00e1ri og \u00farb\u00e6tur
  ger\u00f0ar eftir \u00fe\u00f6rfum. Sk\u00f3lal\u00f3\u00f0 er \u00e6t\u00ed\u00f0
  yfirfarin \u00e1\u00f0ur en b\u00f6rnin fara \u00fat \u00e1 morgnana.\\n\\nHeimildaskr\u00e1\\n\\nA\u00f0aln\u00e1mskr\u00e1
  leiksk\u00f3la, 1999. Reykjav\u00edk, Menntam\u00e1lar\u00e1\u00f0uneyti\u00f0.\\n\\nLeiksk\u00f3lastefna
  F\u00e9lags \u00edslenskra leiksk\u00f3lakennara, 2000. Reykjav\u00edk, F\u00e9lag
  \u00edslenskra leiksk\u00f3lakennara.\\n\\nPettersen Reidar J.,1991, Fornyelse i
  barnehagen. Innf\u00f6rning i pedagogisk utviklingsarbeid. Osl\u00f3, Universitetsforlaget
  A.S.\\n\\nMat \u00e1 n\u00e1mi\\n\\nH\u00e9r fyrir ne\u00f0an m\u00e1 sj\u00e1 matsatri\u00f0i
  sem Ki\u00f0agil mi\u00f0ar a\u00f0 tengdum a\u00f0aln\u00e1mskr\u00e1 leiksk\u00f3la.
  Til a\u00f0 fylgjast me\u00f0 framf\u00f6r nemenda vinna kennarar Ki\u00f0agils
  me\u00f0 L\u00e6sislista. \u00deeir eru mi\u00f0a\u00f0i\u00f0 vi\u00f0 hverja deild
  og er yfirfer\u00f0 \u00feeirra \u00ed h\u00f6ndum h\u00f3pstj\u00f3ra. L\u00e6sislistana
  er a\u00f0 finna \u00e1 heimas\u00ed\u00f0u Ki\u00f0agils \u00e1samt vi\u00f0mi\u00f0um
  fyrir hvern aldur.\\n\\nGleym m\u00e9r ei\\n\\nL\u00e6si 2- 3 \u00e1ra\\n\\nL\u00e6si
  sn\u00fdst um kerfisbundin t\u00e1kn og mi\u00f0lunart\u00e6kni en \u00fe\u00f3
  fyrst og fremst um merkingarsk\u00f6pun \u00fear sem tv\u00e6r manneskjur e\u00f0a
  fleiri mi\u00f0la af reynslu sinni. \u00c1 venjulegu m\u00e1li sem allir skilja
  m\u00e1 segja a\u00f0 um s\u00e9 a\u00f0 r\u00e6\u00f0a mi\u00f0lun or\u00f0a og
  reynslu \u00e1 milli manna. Ekki bara hva\u00f0 manneskjan segir heldur l\u00edka
  hvernig h\u00fan kemur sko\u00f0un sinni \u00e1 framf\u00e6ri og hvernig s\u00e1
  sem \u00e1 hl\u00fd\u00f0ir skilur skilabo\u00f0in.\\n\\nTungum\u00e1li\u00f0 er
  eitt mikilv\u00e6gasta t\u00e6ki mannanna til bo\u00f0skipta og hugsunar. \u00dev\u00ed
  ber a\u00f0 leggja \u00e1herslu \u00e1 a\u00f0 n\u00fdta m\u00e1li\u00f0 \u00ed
  v\u00ed\u00f0um skilningi. \u00dea\u00f0 gerum vi\u00f0 me\u00f0 samt\u00f6lum,
  spurningum, lestri, s\u00f6gum, kv\u00e6\u00f0um og \u00feulum. \u00de\u00e1 er
  mikilv\u00e6gt a\u00f0 hvetja b\u00f6rnin til a\u00f0 spyrja, segja fr\u00e1 og
  hlusta me\u00f0 athygli. M\u00e1l\u00f6rvun er best sinnt \u00ed leik barnanna.\\n\\n\u00c1
  Gleym m\u00e9r ei er unni\u00f0 me\u00f0 l\u00e6si. S\u00fa vinna fer fram \u00ed
  gegnum leikinn og l\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 efla hugtakaskilning
  me\u00f0 \u00fev\u00ed a\u00f0 gera s\u00f6gur, s\u00f6ngva og hin \u00fdmsu verkefni
  myndr\u00e6n og \u00e1\u00fereifanleg. B\u00f6rn \u00e1 aldrinum 2-3 \u00e1ra l\u00e6ra
  margt \u00ed gegnum skynjun og er \u00fea\u00f0 haft a\u00f0 lei\u00f0arlj\u00f3si
  \u00ed \u00f6llu starfi \u00e1 Gleym m\u00e9r ei. L\u00f6g\u00f0 er \u00e1hersla
  \u00e1 a\u00f0 hafa b\u00e6kur \u00e6t\u00ed\u00f0 \u00ed bo\u00f0i fyrir b\u00f6rn
  og \u00feeim kennt a\u00f0 umgangast \u00fe\u00e6r, velta fyrir s\u00e9r uppbyggingu
  \u00feeirra, fletta bla\u00f0s\u00ed\u00f0u fyrir bla\u00f0s\u00ed\u00f0u og me\u00f0
  auknum \u00feroska l\u00e6ra \u00feau a\u00f0 lesa me\u00f0 a\u00f0sto\u00f0 mynda.
  L\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 efla skilning \u00e1 m\u00e1linu.\\n\\nTj\u00e1ning
  er mikilv\u00e6gur \u00fe\u00e1ttur og hvetjum vi\u00f0 b\u00f6rnin til a\u00f0
  n\u00fdta s\u00e9r m\u00e1li\u00f0 \u00ed leik og starfi. Or\u00f0 og b\u00f3kstafir
  eru s\u00fdnilegir og l\u00e6ra b\u00f6rnin flj\u00f3tt a\u00f0 \u00feekkja stafinn
  sinn og sinna n\u00e1nustu e\u00f0a jafnvel stafi allra barna og starfsf\u00f3lks
  \u00e1 deildinni. L\u00e6si er ekki bara a\u00f0 l\u00e6ra b\u00f3kstafi og lestur
  heldur er \u00fea\u00f0 samheiti yfir marga \u00fe\u00e6tti eins og samskipti, t\u00e1kn,
  menningu, hlj\u00f3\u00f0myndun, myndm\u00e1l, \u00fdmis t\u00e1knkerfi, umhverfi\u00f0
  og hlustun. Lagt er upp me\u00f0 \u00fev\u00ed a\u00f0 b\u00f6rnin l\u00e6ri a\u00f0
  tj\u00e1 sig segja s\u00edna sko\u00f0un og \u00edgrunda \u00ed lei\u00f0inni.\\n\\nL\u00e6si
  2-3 \u00e1ra\\n\\nSj\u00e1lfb\u00e6rni 2-3 \u00e1ra\\n\\nMe\u00f0 sj\u00e1lfb\u00e6rni
  er \u00e1tt vi\u00f0 a\u00f0 engin ein kynsl\u00f3\u00f0 hefur r\u00e9tt umfram
  a\u00f0ra til \u00feess a\u00f0 r\u00fdra arflei\u00f0 s\u00edna til n\u00e6stu
  kynsl\u00f3\u00f0ar. Lagt er til grundvallar a\u00f0 hver kynsl\u00f3\u00f0 skili
  \u00feeirri n\u00e6stu umhverfi s\u00ednu og n\u00e1tt\u00faru, \u00ed ekki lakara
  \u00e1sigkomulagi en h\u00fan t\u00f3k vi\u00f0 henni.  Hugtaki\u00f0 er gildishla\u00f0i\u00f0
  og  felur \u00ed s\u00e9r sam\u00e1byrg\u00f0 manna, jafnv\u00e6gi \u00ed n\u00e1tt\u00farunni,
  efnahagslegt jafnv\u00e6gi, jafnv\u00e6gi  \u00ed samf\u00e9laginu og l\u00fd\u00f0r\u00e6\u00f0i.
  \u00dea\u00f0 felur einnig \u00ed s\u00e9r n\u00e1m sem eykur m.a.\\n\\nf\u00e6rni
  barna og ungmenna til \u00feess a\u00f0 takast \u00e1 vi\u00f0 margv\u00edsleg \u00e1litam\u00e1l
  og \u00e1greiningsm\u00e1l sem stu\u00f0lar a\u00f0 vilja \u00feeirra og \u00e1huga
  til \u00feess a\u00f0 taka \u00fe\u00e1tt \u00ed samf\u00e9laginu.\\n\\n\u00c1 Ki\u00f0agili
  er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 auka vir\u00f0ingu og \u00feekkingu
  barna og fullor\u00f0inna \u00e1 n\u00e1tt\u00farunni.  Sk\u00f3linn starfar eftir
  gildum Gr\u00e6nf\u00e1naverkefnisin \u00e1n \u00feess a\u00f0 vera formlegur Gr\u00e6nf\u00e1nask\u00f3li.\\n\\n\u00deekking
  \u00e1 n\u00e1tt\u00farunni og fyrirb\u00e6rum hennar er manninum l\u00edfsnau\u00f0synlegt
  \u00fear sem afkoma hans er undir henni komin. B\u00f6rn \u00feurfa a\u00f0 kynnst
  fj\u00f6lbreytileika n\u00e1tt\u00farunnar og nj\u00f3ta hennar um lei\u00f0 og
  \u00feau l\u00e6ra a\u00f0 finna til \u00e1byrg\u00f0ar gagnvart henni. Starfsmenn
  fr\u00e6\u00f0a b\u00f6rnin um n\u00e1tt\u00faruna, umhverfi\u00f0 og verndun \u00feess.  \u00deess
  ver\u00f0ur best vi\u00f0 komi\u00f0 me\u00f0 fer\u00f0um \u00fat \u00ed n\u00e1tt\u00faruna
  \u00fear sem b\u00f6rnin gera s\u00edna eigin athuganir og vinna \u00far \u00feeim
  eftir getu. Einfaldar e\u00f0lis og efnafr\u00e6\u00f0i tilraunir vekja \u00e1huga
  og \u00e1n\u00e6gju barnanna.\\n\\n\u00c1 Gleym m\u00e9r ei eru b\u00f6rnunum kennt
  a\u00f0 flokka um lei\u00f0 og \u00feau byrja \u00ed leiksk\u00f3lanum. \u00cd upphafi
  l\u00e6ra \u00feau a\u00f0 flokka matar\u00farganga og svo koll af koll anna\u00f0
  sem flokka skal. B\u00f6rnin eru fr\u00e6dd um l\u00edfr\u00e6na r\u00e6ktun og
  taka \u00fe\u00e1tt \u00ed henni me\u00f0 \u00fev\u00ed a\u00f0 gr\u00f3\u00f0ursetja
  fr\u00e6 og fylgjast me\u00f0 hva\u00f0 vex af \u00fev\u00ed.  \u00de\u00e1 er fjalla\u00f0
  um vatnsnotkun og eiga allir br\u00fasa me\u00f0 vatni sem eru a\u00f0gengilegir.
  Flokkun efna eins og papp\u00edr og plast er komi\u00f0 fyrir \u00ed s\u00e9rst\u00f6kum
  tunnum og k\u00f6ssum og er b\u00f6rnunum s\u00fdnt hvar \u00fea\u00f0 \u00e1 a\u00f0
  vera. Hver deild s\u00e9r um a\u00f0 fr\u00e6\u00f0a b\u00f6rnin og \u00ed \u00feeirri
  vinnu er liti\u00f0 til umhverfiss\u00e1ttm\u00e1lans okkar og hann er fl\u00e9tta\u00f0ur
  inn \u00ed starf sk\u00f3lans. S\u00e9rstakar umhverfisvikur er \u00e1 dagatali
  deilda eins og t.d. endurvinnsluvika, steinavika, fuglavika, berjavika og bl\u00f3mavika.
  \u00cd \u00feeim vikum eru b\u00f6rnin fr\u00e6dd um umhverfi sitt, me\u00f0 \u00fev\u00ed
  a\u00f0 flokka \u00fargang, t\u00edna rusl, fara \u00ed vettvangsfer\u00f0ir, sko\u00f0a
  bl\u00f3min og skord\u00fdrin. Gr\u00f3\u00f0ursett eru bl\u00f3m og \u00fdmiskonar
  jurtir, og t\u00ednd ber. \u00cd verkefnager\u00f0 er reynt a\u00f0 n\u00fdta endurvinnanlegan
  efnivi\u00f0 sem til er \u00ed leiksk\u00f3lanum.\\n\\nSj\u00e1lfb\u00e6rni 2-3
  \u00e1ra\\n\\n| A\u00f0 n\u00fdta \u00e1hugasvi\u00f0 barnanna og f\u00e1 \u00feannig
  hugmyndir a\u00f0 verkefnum og efnivi\u00f0 | Samr\u00e6\u00f0ur um hva\u00f0 \u00feeim
  finnst \u00e1hugavert \u00ed umhverfinu. Nota hv spurningar |\\n|---|---|\\n| A\u00f0
  b\u00f6rnin l\u00e6ri a\u00f0 bera \u00e1byrg\u00f0 og vir\u00f0ingu fyrir samf\u00e9lagi
  s\u00ednu | Fara \u00ed n\u00e1tt\u00faru og sko\u00f0unarfer\u00f0ir og fj\u00f6rufer\u00f0
  |\\n| A\u00f0 vekja l\u00f6ngun til a\u00f0 kanna eitthva\u00f0 n\u00fdtt / \u00f3\u00feekkt
  | Hafa ver\u00f0lausan efnivi\u00f0 og leyfa \u00feeim a\u00f0 r\u00e1\u00f0a hva\u00f0
  \u00feau gera vi\u00f0 hann |\\n| A\u00f0 endurvinna, fara \u00ed vettvangsfer\u00f0ir,
  gr\u00f3\u00f0ursetja og hreinsa umhverfi\u00f0 \u00ed kringum leiksk\u00f3lann
  | Fara me\u00f0 b\u00f6rnin \u00ed vettvangsfer\u00f0 a\u00f0 hreinsa rusl og s\u00fdna
  \u00feeim \u00ed kj\u00f6lfari\u00f0 hva\u00f0 er gert vi\u00f0 \u00fea\u00f0 |\\n|
  A\u00f0 vekja forvitni barnanna me\u00f0 \u00fev\u00ed a\u00f0 spyrja opinna spurninga
  og leita lausna. Auk \u00feess a\u00f0 kenna b\u00f6rnunum a\u00f0 bera vir\u00f0ingu
  fyrir umhverfi s\u00ednu og n\u00e1tt\u00faru, upplifa og nj\u00f3ta | K\u00f6nnun
  og skynjun barnanna \u00e1 umhverfi og samf\u00e9lagi \u2022 ranns\u00f3knir, fj\u00f6lbreyttar
  a\u00f0fer\u00f0ir til a\u00f0 sko\u00f0a, skynja, hlusta, snerta, flokka, bera
  saman og draga \u00e1lyktanir |\\n\\nJafnr\u00e9tti 2-3 \u00e1ra\\n\\nJafnr\u00e9tti:
  Jafnr\u00e9tti er regnhl\u00edfarhugtak og n\u00e6r til \u00fdmissa \u00fe\u00e1tta
  s.s; aldurs, b\u00fasetu, f\u00f6tlunar, kyns, kynhneig\u00f0ar, litarh\u00e1ttar,  l\u00edfssko\u00f0ana,
  menningar, st\u00e9ttar, tr\u00faarbrag\u00f0a, tungum\u00e1la, \u00e6tterna og
  \u00fej\u00f3\u00f0erna.  \u00c1 \u00f6llum sk\u00f3lastigum \u00e1 a\u00f0 fara
  fram menntun til jafnr\u00e9ttis \u00fear sem fjalla\u00f0 erum hvernig fyrrtaldir
  \u00fe\u00e6ttir geta valdi\u00f0 mismunun e\u00f0a forr\u00e9ttindum \u00ed l\u00edfi
  f\u00f3lks.\\n\\n\u00cd starfi \u00e1 Ki\u00f0agili er l\u00f6g\u00f0 \u00e1herslu
  \u00e1 a\u00f0 kyngerva ekki leik og f\u00e1i b\u00f6rnin t\u00e6kif\u00e6ri til
  a\u00f0 sko\u00f0a umhverfi sitt  \u00ed leik \u00e1n \u00feess a\u00f0 \u00fea\u00f0
  skipti m\u00e1li hvort kyn \u00fea\u00f0 er. \u00dea\u00f0 er gott a\u00f0 vera
  me\u00f0vita\u00f0ur hvernig kynin eru \u00e1v\u00f6rpu\u00f0.  Starfsf\u00f3lk
  er me\u00f0vita\u00f0 um a\u00f0 bera vir\u00f0ingu fyrir \u00f6llum b\u00f6rnum
  og foreldrum \u00feeirra.\\n\\n\u00c1 Gleym m\u00e9r ei er \u00f6llum s\u00fdnd
  sama vi\u00f0horfi\u00f0 sama hva\u00f0a bakgrunn \u00feau hafa, allir \u00feurfa
  a\u00f0 hj\u00e1lpast a\u00f0 vi\u00f0 a\u00f0 j\u00f6fn vir\u00f0ing s\u00e9 til
  sta\u00f0ar. B\u00f6rnin er saman \u00ed h\u00f3p 4-5 \u00ed einu jafnt stelpur
  sem str\u00e1kar. B\u00f6rn \u00feurfa \u00e1 \u00fev\u00ed a\u00f0 halda a\u00f0
  hlusta\u00f0 s\u00e9 \u00e1 \u00feau og vir\u00f0ing borin fyrir sko\u00f0unum \u00feeirra.
  \u00deegar jafnr\u00e9tti er sko\u00f0a\u00f0 \u00fearf a\u00f0 \u00fdta undir gagnr\u00fdna
  hugsun \u00feeirra. Leyfa \u00feeim a\u00f0 sko\u00f0a hlutina \u00fat fr\u00e1
  sj\u00e1lfum s\u00e9r og hvernig \u00feau upplifa jafnr\u00e9tti. Starfsf\u00f3lk
  eru mikilv\u00e6gur \u00fe\u00e1ttur \u00ed \u00feessu starfi \u00fev\u00ed \u00feau
  geta hj\u00e1lpa\u00f0 b\u00f6rnunum a\u00f0 finna hvernig \u00f3r\u00e9ttl\u00e6ti
  er og hvernig s\u00e9 h\u00e6gt a\u00f0 b\u00e6ta \u00fea\u00f0. Starfsf\u00f3lk
  hvetur b\u00f6rnin til gagnr\u00fdnnar hugsunar um jafnr\u00e9tti auk \u00feess
  a\u00f0 fr\u00e6\u00f0a \u00feau um margbreytileika heimsins. Starsf\u00f3lk er
  hvatt til a\u00f0 vera me\u00f0vita\u00f0 um a\u00f0 fl\u00e9tta almennt jafnr\u00e9tti
  inn \u00ed allt sk\u00f3lastarf me\u00f0 b\u00f6rnunum.  Hvetja skal til a\u00f0
  umr\u00e6\u00f0na og n\u00fdta n\u00e1msefni sem eykur enn frekar \u00e1 skilning
  barnanna um margbreytileika.\\n\\n\u00de\u00e1 er mikilv\u00e6gt a\u00f0 n\u00fdta
  t\u00edmann til \u00feess  \u00ed samverustundum og \u00feemastarfi og me\u00f0
  auknum n\u00e1msg\u00f6gnum um efni\u00f0. Starfsf\u00f3lk skal vera uppl\u00fdst
  um a\u00f0 jafnr\u00e9tti stu\u00f0lar a\u00f0 b\u00e6ttu vinnuumhverfi og sk\u00f3laanda.
  Starfsf\u00f3lk er ford\u00e6mi barnanna og \u00fev\u00ed \u00fearf g\u00e6ta \u00feess
  a\u00f0 vir\u00f0ing s\u00e9 til sta\u00f0ar \u00feeirra milli.\\n\\nJafnr\u00e9tti
  2-3 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n| A\u00f0 kennarar
  og b\u00f6rn komi eins fram vi\u00f0 alla \u00f3h\u00e1\u00f0 kyni, uppruna, menningu
  og kyn\u00fe\u00e1ttar.. | Kennarar s\u00fdni fagmennsku og vir\u00f0ingu fyrir
  \u00f6llum b\u00f6rnum og flokki \u00feau ekki. |\\n| A\u00f0 allir hafa sama r\u00e9tt
  \u00e1 hinum \u00fdmsu leikjum \u00f3h\u00e1\u00f0 kyni | Gefa \u00f6llu b\u00f6rnum
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 velja s\u00e9r vi\u00f0fangsefni \u00ed leik hvort
  sem \u00fea\u00f0 er drengur e\u00f0a st\u00falka |\\n| A\u00f0 allir hafa sama
  r\u00e9tt til a\u00f0 tj\u00e1 sko\u00f0anir s\u00ednar. \u00d6llum er s\u00fdnd
  sama umhyggjan sama hva\u00f0 bakgrunn \u00feau hafa e\u00f0a a\u00f0 hva\u00f0a
  \u00fej\u00f3\u00f0erni \u00feau eru | Gefa \u00e1 \u00f6llum t\u00e6kif\u00e6ri
  \u00e1 a\u00f0 tj\u00e1 s\u00ednar sko\u00f0anir \u00e1n ford\u00f3ma. Kennarar
  \u00fatsk\u00fdra fyrir nemendum a\u00f0 ekki hafi allir s\u00f6mu sko\u00f0anir
  \u00e1 hinum \u00fdmsu m\u00e1lefnum |\\n| A\u00f0 efnivi\u00f0ur s\u00e9 \u00f3h\u00e1\u00f0ur
  kyni auk \u00feess sem b\u00e6\u00f0i stelpur og str\u00e1kar leika saman | Gefa
  b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 velja hva\u00f0 \u00feau vilja leika
  me\u00f0 og me\u00f0 hverjum |\\n| A\u00f0 kynna fyrir b\u00f6rnunum a\u00f0 ekki
  eru allir eins og \u00fea\u00f0 s\u00e9 \u00ed lagi a\u00f0 vera \u00feannig | Fjalla
  um l\u00edkamann og \u00feann mismun sem er \u00e1 drengjum og st\u00falkum. Fjalla
  eining um litarhaft, augnlit og h\u00e1rlit. |\\n| A\u00f0 gera b\u00f6rnum grein
  fyrir a\u00f0 \u00feau eigi l\u00edkama sinn og enginn hefur r\u00e9tt \u00e1 honum
  | Tala vi\u00f0 b\u00f6rnin um l\u00edkama \u00feeirra og a\u00f0 hann s\u00e9 \u00feeirra
  eign. |\\n\\n| nema \u00feau sj\u00e1lf |  |\\n|---|---|\\n| A\u00f0 kynna fyrir
  b\u00f6rnunum menningarheim annarra landa | Mismunandi menningardaga \u00fear sem
  kynnt er fyrir b\u00f6rnunum \u00e1herslur annara landa |\\n\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi\\n\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi: \u00dea\u00f0
  er mikilv\u00e6gt a\u00f0 sk\u00f3lakerfi\u00f0 kenni b\u00f6rnunum dj\u00fapst\u00e6\u00f0a
  vir\u00f0ingu fyrir manngildi hvers og eins, um lei\u00f0 og \u00feau l\u00e6ra
  hvernig l\u00fd\u00f0r\u00e6\u00f0issamf\u00e9l\u00f6g virka. Umhyggja fyrir d\u00fdrum
  og n\u00e1tt\u00faru er einnig hluti l\u00fd\u00f0r\u00e6\u00f0ismenntunar og \u00e1
  heima \u00ed \u00f6llum n\u00e1msgreinum.  L\u00fd\u00f0r\u00e6\u00f0is- og mannr\u00e9ttindamenntun
  felur einnig \u00ed s\u00e9r h\u00e6fnina til a\u00f0 gagnr\u00fdna og endurmeta
  grunngildi samf\u00e9lagsins. \u00deetta \u00fearf a\u00f0 gerast \u00ed samstarfi
  \u00e1 milli sk\u00f3lanna og heimilisins sem og hinna \u00fdmsu stofnana samf\u00e9lagsins.\\n\\n\u00cd
  starfi \u00e1 Ki\u00f0agli er leitast vi\u00f0 a\u00f0 sk\u00f3lastarf m\u00f3tist
  af \u00fev\u00ed umhverfi sem vi\u00f0 b\u00faum vi\u00f0 eins og atvinnu- f\u00e9lags
  og menningarlegu. Sk\u00f3linn tekur tillit til mismunandi fj\u00f6lskylduger\u00f0ar
  og uppruna barnanna  og leitast vi\u00f0 a\u00f0 efla tilfinningu \u00feeirra fyrir
  \u00fev\u00ed a\u00f0 \u00feau tilheyri samf\u00e9laginu og s\u00e9u hluti af \u00fev\u00ed.
  Af \u00fev\u00ed m\u00e1 stu\u00f0la a\u00f0 g\u00f3\u00f0um samskiptum utan sk\u00f3lans
  og n\u00fdtingu umhvefisins  til vettvangsfer\u00f0a og leikja. Starfsf\u00f3lk
  \u00e1 a\u00f0 bera vir\u00f0ingu fyrir \u00f6llum og takast \u00e1 vi\u00f0 eigin
  ford\u00f3ma svo \u00feeir stu\u00f0li ekki a\u00f0 mismunum \u00e1 milli einstaklinga.\\n\\n\u00c1
  Gleym m\u00e9r ei er \u00fdtt  undir frumkv\u00e6\u00f0i og \u00edmyndunnarafl barnanna
  sem hvetur \u00feau til a\u00f0 taka eigin \u00e1kvar\u00f0anir og frumkv\u00e6\u00f0i.
  Skapa\u00f0ar eru a\u00f0st\u00e6\u00f0ur sem gerir \u00fea\u00f0 a\u00f0 verkum
  a\u00f0 b\u00f6rnunum l\u00ed\u00f0ur vel og finna til \u00f6ryggis. \u00de\u00e1
  er b\u00f6rnunum s\u00fdnd vir\u00f0ing og k\u00e6rleikur svo a\u00f0 allir f\u00e1i
  noti\u00f0 s\u00edn \u00ed leik og starfi. \u00dea\u00f0 er gert me\u00f0 \u00fev\u00ed
  a\u00f0 starfsf\u00f3lk s\u00e9 me\u00f0vita\u00f0 um a\u00f0 vi\u00f0 erum ekki
  eins og hver og einn \u00fearf t\u00e6kif\u00e6ri til a\u00f0 nj\u00f3ta s\u00edn
  \u00e1 eigin forsendum. \u00de\u00e1 leggur starfsf\u00f3lk sig fram vi\u00f0 a\u00f0
  kenna b\u00f6rnum skapandi hugsun og gefa \u00feeim t\u00e6kif\u00e6ri til \u00feess
  a\u00f0 tj\u00e1 sig \u00ed or\u00f0i og myndum.  \u00dea\u00f0 \u00fdtir undir
  sj\u00e1lfstraust \u00feeirra og eflir getu \u00feeirra til a\u00f0 taka \u00e1kvar\u00f0anir
  um eigin getu.\\n\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi 2-3 \u00e1ra\\n\\nSk\u00f6pun
  2-3 \u00e1ra\\n\\nSk\u00f6pun: Sk\u00f6pun er lei\u00f0 einstaklings til \u00feess
  a\u00f0 tengja n\u00fdja upplifun fyrri \u00feekkingu og ver\u00f0a \u00feannig
  ,,meiri \u00ed dag en \u00ed g\u00e6r\\\" Sk\u00f6punargle\u00f0in  sprettur fram
  vegna forvitni og athafna\u00fer\u00e1 sem lei\u00f0ir til n\u00e1ms\u00e1huga og
  frumkv\u00e6\u00f0is. Sk\u00f6pun er a\u00f0 uppg\u00f6tva, nj\u00f3ta, \u00f6rva
  forvitni og \u00e1huga, virkja \u00edmyndunarafl og leika s\u00e9r me\u00f0 m\u00f6guleika.
  H\u00fan br\u00fdtur hef\u00f0bundin mynstur, reglur og kerfi og veitir n\u00fdja
  s\u00fdn \u00e1 fyrirb\u00e6ri og vi\u00f0teknar hugmyndir. Leikur er mikilv\u00e6g
  n\u00e1msa\u00f0fer\u00f0 og opnar v\u00edddir \u00fear sem sk\u00f6punargle\u00f0i
  barna og ungmenna getur noti\u00f0 s\u00edn.  Hamingja og gle\u00f0i liggja \u00ed
  \u00fev\u00ed a\u00f0 finna h\u00e6fileikum s\u00ednum farveg og  f\u00e1 a\u00f0
  nj\u00f3ta s\u00edn sem einstaklingur og hluti af heild.\\n\\nStarfsf\u00f3lk \u00e1
  Gleym m\u00e9r ei leggur sig fram vi\u00f0 a\u00f0 virkja sk\u00f6punargle\u00f0i
  barnanna  me\u00f0 \u00fev\u00ed a\u00f0 leyfa \u00feeim a\u00f0  framkv\u00e6ma
  og vera \u00e1hugasamir sj\u00e1lfir og r\u00e6\u00f0a vi\u00f0 b\u00f6rnin. Mikilv\u00e6gt
  er a\u00f0 taka tillit til \u00e1huga barnanna og kynna fyrir \u00feeim mismunandi
  efnivi\u00f0 og \u00e1h\u00f6ld sem efla hugmyndarflug \u00feeirra og getu. Gefa
  \u00fearf \u00feeim t\u00edma og \u00edmyndunarafli \u00feeirra lausan tauminn svo
  \u00feau \u00f6\u00f0list frumkv\u00e6\u00f0i og kjark til a\u00f0 skapa \u00fea\u00f0
  sem \u00feeim langar til.  Sk\u00f6pun fellst ekki eing\u00f6ngu \u00ed \u00fev\u00ed
  a\u00f0 skila fr\u00e1 s\u00e9r einhverju verki heldur fellsth\u00fan einnig \u00ed
  leiksr\u00e6nni tj\u00e1ningu, \u00fev\u00ed er mikilv\u00e6gt a\u00f0 starfsf\u00f3lk
  s\u00e9 fyrirmynd \u00ed \u00fev\u00ed og taki \u00f3hr\u00e6ddir \u00fe\u00e1tt
  \u00ed frj\u00e1lsum leik barnanna. Skapandi starf \u00e1 a\u00f0 beinast a\u00f0
  \u00fev\u00ed sem gert er \u00fear sem allir f\u00e1i noti\u00f0 s\u00fdn \u00e1
  s\u00ednum forsendum. Starfsf\u00f3lk gegnir lykilhlutverki \u00ed \u00f6llu sk\u00f3lastarfi,
  \u00fev\u00ed er \u00fea\u00f0 mikilv\u00e6gt a\u00f0 \u00feeir n\u00fdti s\u00edna
  fag\u00feekkingu \u00ed a\u00f0 kenna b\u00f6rnum hinar \u00fdmsu greinar sk\u00f6punar
  \u00fev\u00ed sk\u00f6pun er \u00ed \u00f6llu umhverfinu. Starfsf\u00f3lk \u00e1
  Gleym m\u00e9r ei \u00fearf a\u00f0 vera frj\u00f3tt og geta vaki\u00f0 upp \u00e1huga
  barnanna sem lei\u00f0ir til spurninga, \u00farlausnar og skapandi hugsunar.\\n\\nSk\u00f6pun  2-3
  \u00e1ra\\n\\nHeilbrig\u00f0i og velfer\u00f0 2-3 \u00e1ra\\n\\n\u00deegar r\u00e6tt
  er um heilbrig\u00f0i er v\u00edsa\u00f0 til andlegrar, l\u00edkamlegrar og f\u00e9lagslegrar
  vell\u00ed\u00f0anar f\u00f3lks.  Allt sk\u00f3lastarf \u00e1 a\u00f0 mi\u00f0a
  a\u00f0 \u00fev\u00ed a\u00f0 efla heilbrig\u00f0i og stu\u00f0la markvisst a\u00f0
  velll\u00ed\u00f0an barnanna me\u00f0 tilliti til sj\u00e1lfsmyndar, hreyfingar,
  n\u00e6ringar, hv\u00edldar, andlegrar vell\u00ed\u00f0anar, g\u00f3\u00f0ra samskipta,
  \u00f6ryggis, hreinl\u00e6tis, kynheilbrig\u00f0is og skilnings \u00e1 eigin tilfinningum
  og annarra.\\n\\n\u00c1 Gleym m\u00e9r ei er l\u00f6g\u00f0 \u00e1hersla \u00e1
  hreyfingu barna og hreyfiuppeldi. B\u00f6rnin fara \u00ed leikfimish\u00fas einu
  sinni a\u00f0ra hverja viku  sem er utan vi\u00f0 \u00fe\u00e1 hreyfingu sem \u00feau
  i\u00f0ka \u00ed sal sk\u00f3lans. B\u00f6rn tj\u00e1 sig snemma me\u00f0 hreyfingu,
  \u00feau skynja l\u00edkama sinn og finna styrk sinn og getu. G\u00f3\u00f0 hreyfif\u00e6rni
  eykur sj\u00e1lfstraust \u00e1samt \u00fev\u00ed a\u00f0 b\u00e6ta  heilsu, snerpu
  og \u00feol. L\u00edkamlegri \u00e1reynslu fylgir hv\u00edld og \u00fear skynjar
  barni\u00f0 mun \u00e1 spennu og sl\u00f6kun. \u00dativera og hreyfing er mikilv\u00e6gur
  \u00fe\u00e1ttur \u00ed daglegu l\u00edfi og hefur veri\u00f0 st\u00f3r \u00fe\u00e1ttur
  \u00ed leiksk\u00f3lastarfinu h\u00e9r \u00e1 Ki\u00f0agili. Hva\u00f0 var\u00f0ar
  velfer\u00f0 barna sn\u00fdst h\u00fan ekki eing\u00f6gu um l\u00edkamlegt atgervi
  heldur einnig um sj\u00e1lfsmynd, andlega l\u00ed\u00f0an, \u00f6ryggi , mat \u00e1
  eigin tilfinningum og annarra. Starfsf\u00f3lk \u00fearf a\u00f0 vera me\u00f0vita\u00f0
  um \u00fearfir hvers og eins og uppfylla \u00fe\u00e6r eins vel og h\u00e6gt er.
  Mikilv\u00e6gt er a\u00f0 efla f\u00e9lags\u00feroskan og f\u00e9lagstengslin svo
  og gefa b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 takast \u00e1 vi\u00f0 n\u00fd
  vi\u00f0fangsefni. Fr\u00e6\u00f0sla um mikilv\u00e6gi n\u00e6ringar byggist \u00e1
  \u00fev\u00ed a\u00f0 kynna allar \u00fe\u00e6r tegundir af mat fyrir b\u00f6rnunum
  og gefa \u00feeim t\u00e6kif\u00e6ri \u00e1 a\u00f0 smakka. \u00de\u00e1 \u00fearf
  starfsf\u00f3lk einnig a\u00f0 leitast vi\u00f0 minnka h\u00e1va\u00f0a \u00fear
  sem hann hefur \u00e1hrif \u00e1 leik og n\u00e1m barnanna\\n\\nHeilbrig\u00f0i
  og velfer\u00f0 barna byggist \u00e1 samskiptum og \u00e1 a\u00f0 einkennast af
  hl\u00fdju og vir\u00f0ingu en starfsf\u00f3lki ber a\u00f0 eiga \u00ed j\u00e1kv\u00e6\u00f0um
  samskiptum vi\u00f0 b\u00f6rnin \u00fev\u00ed \u00fea\u00f0 eflir sj\u00e1lfsmynd
  \u00feeirra og sj\u00e1lfstrausti\u00f0 eykst. \u00dea\u00f0 a\u00f0 hvetja b\u00f6rnin
  kennir \u00feeim a\u00f0 taka \u00e1byrg\u00f0 \u00e1 eigin getu og heg\u00f0un
  auk \u00feess sem \u00fea\u00f0 veitir \u00feeim \u00feroska til a\u00f0 m\u00e6ta
  \u00f3v\u00e6ntum a\u00f0st\u00e6\u00f0um. \u00deau ver\u00f0a einnig tilb\u00fanari
  a\u00f0 takast \u00e1 vi\u00f0 \u00e1greiningsm\u00e1l er upp koma og grei\u00f0a
  \u00far \u00feeim.\\n\\nHeilbrig\u00f0i og velfer\u00f0 2-3 \u00e1ra\\n\\nS\u00f3ley
  L\u00e6si 3-4 \u00e1ra\\n\\nL\u00e6si sn\u00fdst um kerfisbundin t\u00e1kn og mi\u00f0lunart\u00e6kni
  en \u00fe\u00f3 fyrst og fremst um merkingarsk\u00f6pun \u00fear sem tv\u00e6r manneskjur
  e\u00f0a fleiri mi\u00f0la af reynslu sinni. \u00c1 venjulegu m\u00e1li sem allir
  skilja m\u00e1 segja a\u00f0 um s\u00e9 a\u00f0 r\u00e6\u00f0a mi\u00f0lun or\u00f0a
  og reynslu \u00e1 milli manna. Ekki bara hva\u00f0 manneskjan segir heldur l\u00edka
  hvernig h\u00fan kemur sko\u00f0un sinni \u00e1 framf\u00e6ri og hvernig s\u00e1
  sem \u00e1 hl\u00fd\u00f0ir skilur skilabo\u00f0in.\\n\\nTungum\u00e1li\u00f0 er
  eitt mikilv\u00e6gasta t\u00e6ki mannanna til bo\u00f0skipta og hugsunar. \u00dev\u00ed
  ber a\u00f0 leggja \u00e1herslu \u00e1 a\u00f0 n\u00fdta m\u00e1li\u00f0 \u00ed
  v\u00ed\u00f0um skilningi. \u00dea\u00f0 gerum vi\u00f0 me\u00f0 samt\u00f6lum,
  spurningum, lestri, s\u00f6gum, kv\u00e6\u00f0um, leik, s\u00f6ng og \u00feulum.
  \u00de\u00e1 er mikilv\u00e6gt a\u00f0 hvetja b\u00f6rnin til a\u00f0 spyrja, segja
  fr\u00e1 og hlusta me\u00f0 athygli. M\u00e1l\u00f6rvun er best sinnt \u00ed leik
  barnanna.\\n\\n\u00c1 S\u00f3ley er unni\u00f0 markvisst a\u00f0 l\u00e6si. S\u00fa
  vinna fer fram \u00ed gegnum leikinn  og me\u00f0 markvissri kennslu t.d. \u00ed
  samverustundum. L\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 efla hugtakaskilning
  me\u00f0 \u00fev\u00ed a\u00f0 gera s\u00f6gur, s\u00f6ngva og hin \u00fdmsu verkefni
  myndr\u00e6n og \u00e1\u00fereifanleg. B\u00f6rn \u00e1 aldrinum 3-4 hafa gaman
  a\u00f0 \u00fev\u00ed a\u00f0 \u00feykjast lesa og skrifa og eru b\u00e6kur, bl\u00f6\u00f0
  og skriff\u00e6ri \u00feeim a\u00f0gengileg. B\u00f6rnunum er kennt a\u00f0 umgangast
  b\u00e6kurnar og  velta fyrir s\u00e9r uppbyggingu \u00feeirra, fletta bla\u00f0s\u00ed\u00f0u
  fyrir bla\u00f0s\u00ed\u00f0u \u00fev\u00ed me\u00f0 auknum \u00feroska l\u00e6ra
  \u00feau a\u00f0 lesa me\u00f0 a\u00f0sto\u00f0 mynda. L\u00f6g\u00f0 er \u00e1hersla
  \u00e1 a\u00f0 efla skilning \u00e1 m\u00e1linu. Strax \u00e1 S\u00f3ley er byrja\u00f0
  a\u00f0 vinna me\u00f0 hlj\u00f3\u00f0kerfisvitundina, samsett or\u00f0, r\u00edm,
  samst\u00f6fun og fleira.\\n\\nTj\u00e1ning er mikilv\u00e6gur \u00fe\u00e1ttur
  og hvetjum vi\u00f0 b\u00f6rnin til a\u00f0 n\u00fdta s\u00e9r m\u00e1li\u00f0 \u00ed
  leik og starfi, spyrja spurninga, segja sko\u00f0anir s\u00ednar og r\u00e6\u00f0a
  um li\u00f0na atbur\u00f0i. Or\u00f0 og b\u00f3kstafir eru s\u00fdnilegir og b\u00f6rnin
  farin a\u00f0 \u00feekkja stafinn sinn og jafnvel nafni\u00f0 sitt \u00e1 prenti
  og a\u00f0 auki stafi e\u00f0a n\u00f6fn allra barna og starfsf\u00f3lks \u00e1
  deildinni. \u00deau hugt\u00f6k e\u00f0a \u00feemu sem veri\u00f0 er a\u00f0 vinna
  me\u00f0 hverju sinni eru h\u00f6f\u00f0 upp \u00e1 vegg \u00e1samt mynd \u00ed
  \u00e1kve\u00f0inn t\u00edma. \u00dea\u00f0 gefur barninu t\u00e6kif\u00e6ri til
  a\u00f0 velta myndum og or\u00f0um fyrir s\u00e9r \u00feegar \u00e1hugi kviknar.
  L\u00e6si er ekki bara a\u00f0 l\u00e6ra b\u00f3kstafi og lestur heldur er \u00fea\u00f0
  samheiti yfir marga \u00fe\u00e6tti eins og samskipti, t\u00e1kn, menningu, myndm\u00e1l,
  \u00fdmis t\u00e1knkerfi, umhverfi\u00f0 og hlustun. Lagt er upp me\u00f0 a\u00f0
  b\u00f6rnin l\u00e6ri a\u00f0 tj\u00e1 sig, segja s\u00edna sko\u00f0un og \u00edgrunda
  \u00ed lei\u00f0inni.\\n\\nL\u00e6si 3-4 \u00e1ra\\n\\n| A\u00f0 hafa bl\u00f6\u00f0
  og liti a\u00f0gengilegt fyrir b\u00f6rnin | Hafa bl\u00f6\u00f0 og liti a\u00f0gengilegt
  b\u00f6rnunum sem hvetur \u00feau til a\u00f0 \u00f6rva hugmyndaflugi\u00f0 og \u00e1tta
  sig \u00e1 ritm\u00e1linu |\\n|---|---|\\n| A\u00f0 hj\u00e1lpa b\u00f6rnunum a\u00f0
  \u00f6\u00f0last skilning \u00e1 r\u00edmi,og samst\u00f6fun | Nota til \u00feess
  samverustundir. N\u00fdta spilin \u00far Lj\u00e1\u00f0u m\u00e9r eyra. Nota alla
  sta\u00f0i \u00ed h\u00fasinu til \u00feess a\u00f0 kenna b\u00f6rnunum. |\\n| A\u00f0
  tala saman \u00ed leik og setja or\u00f0 \u00e1 upplifanir s\u00ednar. Kennarar
  eru fyrir- myndir og eiga a\u00f0 hj\u00e1lpa b\u00f6rnunum og lei\u00f0r\u00e9tta
  ef \u00feess \u00fearf | \u00dej\u00e1lfa b\u00f6rnin \u00ed a\u00f0 setja or\u00f0
  \u00e1 athafnir \u00ed leik og starfi. Lei\u00f0r\u00e9tta \u00feau og hj\u00e1lpa
  vi\u00f0 a\u00f0 koma or\u00f0unum fr\u00e1 s\u00e9r \u00e1 r\u00e9ttan h\u00e1tt
  |\\n\\nSj\u00e1lfb\u00e6rni 3-4 \u00e1ra\\n\\nMe\u00f0 sj\u00e1lfb\u00e6rni er \u00e1tt
  vi\u00f0 a\u00f0 engin ein kynsl\u00f3\u00f0 hefur r\u00e9tt umfram a\u00f0ra til
  \u00feess a\u00f0 r\u00fdra arflei\u00f0 s\u00edna til n\u00e6stu kynsl\u00f3\u00f0ar.
  Lagt er til grundvallar a\u00f0 hver kynsl\u00f3\u00f0 skili \u00feeirri n\u00e6stu
  umhverfi s\u00ednu og n\u00e1tt\u00faru, \u00ed ekki lakara \u00e1sigkomulagi en
  h\u00fan t\u00f3k vi\u00f0 henni.  Hugtaki\u00f0 er gildishla\u00f0i\u00f0 og  felur
  \u00ed s\u00e9r sam\u00e1byrg\u00f0 manna, jafnv\u00e6gi \u00ed n\u00e1tt\u00farunni,
  efnahagslegt jafnv\u00e6gi, jafnv\u00e6gi  \u00ed samf\u00e9laginu og l\u00fd\u00f0r\u00e6\u00f0i.
  \u00dea\u00f0 felur einnig \u00ed s\u00e9r n\u00e1m sem eykur m.a. f\u00e6rni barna
  og ungmenna til \u00feess a\u00f0 takast \u00e1 vi\u00f0 margv\u00edsleg \u00e1litam\u00e1l
  og \u00e1greiningsm\u00e1l sem stu\u00f0lar a\u00f0 vilja \u00feeirra og \u00e1huga
  til \u00feess a\u00f0 taka \u00fe\u00e1tt \u00ed samf\u00e9laginu. \u00c1 Ki\u00f0agili
  er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 auka vir\u00f0ingu og \u00feekkingu
  b\u00e6\u00f0i barna og fullor\u00f0inna \u00e1 n\u00e1tt\u00farunni. \u00deekking
  \u00e1 n\u00e1tt\u00farunni og fyrirb\u00e6rum hennar er manninum l\u00edfsnau\u00f0synlegt
  \u00fear sem afkoma hans er undir henni komin. B\u00f6rn \u00feurfa a\u00f0 kynnst
  fj\u00f6lbreytileika n\u00e1tt\u00farunnar og nj\u00f3ta hennar um lei\u00f0 og
  \u00feau l\u00e6ra  a\u00f0 finna til \u00e1byrg\u00f0ar gagnvart henni. Kennurum
  sk\u00f3lans ber a\u00f0 fr\u00e6\u00f0a b\u00f6rnin um n\u00e1tt\u00faruna, umhverfi\u00f0
  og verndun \u00feess.  \u00deess ver\u00f0ur best vi\u00f0 komi\u00f0 me\u00f0 fer\u00f0um
  \u00fat \u00ed n\u00e1tt\u00faruna \u00fear sem b\u00f6rnin gera s\u00edna eigin
  athuganir og vinna \u00far \u00feeim eftir getu. Einfalda e\u00f0lis og efnafr\u00e6\u00f0i
  tilraunir vekja \u00e1huga og \u00e1n\u00e6gju barnanna. \u00c1 Ki\u00f0agili er
  markviss flokkun \u00ed gangi sem allir taka \u00fe\u00e1tt b\u00e6\u00f0i b\u00f6rn
  og kennarar. B\u00f6rnin \u00e1 S\u00f3ley eru fr\u00e6dd um l\u00edfr\u00e6na r\u00e6ktun
  og taka \u00fe\u00e1tt \u00ed henni. \u00d6llum er kennt a\u00f0 setja l\u00edfr\u00e6na
  matarafganga \u00ed s\u00e9rstakt \u00edl\u00e1t sem s\u00ed\u00f0an fer \u00ed
  moltutunnur. \u00de\u00e1 er fjalla\u00f0 um vatnsnotkun vi\u00f0 b\u00f6rnin og
  mikilv\u00e6gi \u00feess a\u00f0 drekka vatn. B\u00f6rnin eru  me\u00f0 eigin vatnsbr\u00fasa
  sem \u00feau geta gengi\u00f0 \u00ed a\u00f0 vild. Flokkun efna eins og papp\u00edr
  og plast er komi\u00f0 fyrir \u00ed s\u00e9rst\u00f6kum tunnum og k\u00f6ssum og
  taka b\u00f6rnin \u00e1 S\u00f3ley \u00fe\u00e1tt \u00ed \u00feeirri vinnu.\\n\\nHver
  deild s\u00e9r um a\u00f0 fr\u00e6\u00f0a b\u00f6rnin en \u00ed \u00feeirri vinnu
  er liti\u00f0 til umhverfiss\u00e1ttm\u00e1lans okkar og er hann fl\u00e9tta\u00f0ur
  inn \u00ed starf sk\u00f3lans. S\u00e9rstakar umhverfisvikur eru \u00e1 dagatali
  deilda eins og t.d. endurvinnsluvika, steinavika, fuglavika, berjavika og bl\u00f3mavika
  og \u00ed \u00feeim vikum fr\u00e6\u00f0ast b\u00f6rnin um umhverfi sitt, me\u00f0
  \u00fev\u00ed a\u00f0 flokka \u00fargang, t\u00edna rusl, fara \u00ed vettvangsfer\u00f0ir,
  sko\u00f0a bl\u00f3min og skord\u00fdrin, gr\u00f3\u00f0ursetja bl\u00f3m og \u00fdmiskonar
  jurtir og t\u00edna ber.\\n\\nHver deild er me\u00f0 \u00e1kve\u00f0i\u00f0 verkefni
  inn \u00e1 sinni deild sem er \u00ed tengslum vi\u00f0 umhverfisfr\u00e6\u00f0slu
  eins og t.d. h\u00fasd\u00fdrin og umhverfi\u00f0. \u00cd verkefnager\u00f0 er reynt
  a\u00f0 n\u00fdta \u00feann efnivi\u00f0 sem til er \u00ed leiksk\u00f3lanum sem
  er endurn\u00fdtanlegur.\\n\\nSj\u00e1lfb\u00e6rni 3-4 \u00e1ra\\n\\nJafnr\u00e9tti
  3-4 \u00e1ra\\n\\nJafnr\u00e9tti: Jafnr\u00e9tti er regnhl\u00edfarhugtak og n\u00e6r
  til \u00fdmissa \u00fe\u00e1tta s.s; aldurs, b\u00fasetu, f\u00f6tlunar, kyns, kynhneig\u00f0ar,
  litarh\u00e1ttar,  l\u00edfssko\u00f0ana, menningar, st\u00e9ttar, tr\u00faarbrag\u00f0a,
  tungum\u00e1la, \u00e6tterna og \u00fej\u00f3\u00f0erna.  \u00c1 \u00f6llum sk\u00f3lastigum
  \u00e1 a\u00f0 fara fram menntun til jafnr\u00e9ttis \u00fear sem fjalla\u00f0 er
  um hvernig fyrrtaldir \u00fe\u00e6ttir geta valdi\u00f0 mismunun e\u00f0a forr\u00e9ttindum
  \u00ed l\u00edfi f\u00f3lks.\\n\\n\u00cd starfi \u00e1 Ki\u00f0agili er l\u00f6g\u00f0
  \u00e1herslu \u00e1 a\u00f0 kyngerva ekki leik og f\u00e1i b\u00f6rnin t\u00e6kif\u00e6ri
  til a\u00f0 sko\u00f0a umhverfi sitt  \u00ed leik \u00e1n \u00feess a\u00f0 \u00fea\u00f0
  skipti m\u00e1li hvort kyni\u00f0 \u00fea\u00f0 er. \u00dea\u00f0 er gott a\u00f0
  vera me\u00f0vita\u00f0ur hvernig kynin eru \u00e1v\u00f6rpu\u00f0.  Starfsf\u00f3lk
  er me\u00f0vita\u00f0 um a\u00f0 bera vir\u00f0ingu fyrir \u00f6llum b\u00f6rnum
  og foreldrum \u00feeirra.  \u00d6llum b\u00f6rnum \u00e1 a\u00f0 s\u00fdna sama
  vi\u00f0horf og \u00e1 bakgrunnur \u00feeirra ekki a\u00f0 skipta m\u00e1li. B\u00f6rn
  \u00feurfa \u00e1 \u00fev\u00ed a\u00f0 halda a\u00f0 hlusta\u00f0 s\u00e9 \u00e1
  \u00feau og vir\u00f0ing borin fyrir sko\u00f0unum \u00feeirra. \u00deegar jafnr\u00e9tti
  er sko\u00f0a\u00f0 \u00fearf a\u00f0 \u00fdta undir gagnr\u00fdna hugsun \u00feeirra.
  Leyfa \u00feeim a\u00f0 sko\u00f0a hlutina \u00fat fr\u00e1 sj\u00e1lfum s\u00e9r
  og hvernig \u00feau upplifa jafnr\u00e9tti. Starfsf\u00f3lk er mikilv\u00e6gt \u00ed
  \u00feessu starfi \u00fev\u00ed \u00feau geta hj\u00e1lpa\u00f0 b\u00f6rnunum a\u00f0
  finna hvernig \u00f3r\u00e9tti er og hvernig h\u00e6gt s\u00e9 a\u00f0 b\u00e6ta
  \u00fea\u00f0. Starfsf\u00f3lk \u00e1 a\u00f0 hvetja b\u00f6rnin til gagnr\u00fdnnar
  hugsunar um jafnr\u00e9tti auk \u00feess a\u00f0 fr\u00e6\u00f0a \u00feau um margbreytileika
  heimsins.  Starfsf\u00f3lk er hvatt til a\u00f0 vera me\u00f0vita\u00f0 um a\u00f0
  fl\u00e9tta almennt jafnr\u00e9tti inn \u00ed allt sk\u00f3lastarf me\u00f0 b\u00f6rnunum.
  Hvetja \u00e1 til  umr\u00e6\u00f0na og hafa n\u00e1msefni sem eykur \u00e1 frekari
  skilning barnanna um margbreytileika.  Mikilv\u00e6gt er a\u00f0 n\u00fdta t\u00edmann
  til \u00feess  \u00ed samverustundum og \u00feemastarfi. Starfsf\u00f3lk skal vera
  uppl\u00fdst um a\u00f0 jafnr\u00e9tti stu\u00f0lar a\u00f0 b\u00e6ttu vinnuumhverfi
  og sk\u00f3laanda vegna \u00feess a\u00f0 kennara eru ford\u00e6mi barnanna og \u00fev\u00ed
  \u00fearf g\u00e6ta \u00feess a\u00f0 vir\u00f0ing s\u00e9 til sta\u00f0ar \u00feeirra
  milli \u00fev\u00ed \u00fea\u00f0 skilar s\u00e9r til barnanna.\\n\\nJafnr\u00e9tti
  3-4 \u00e1ra\\n\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi 3-4 \u00e1ra\\n\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi: Mikilv\u00e6gt er a\u00f0 sk\u00f3lakerfi\u00f0 kenni b\u00f6rnunum
  dj\u00fapst\u00e6\u00f0a vir\u00f0ingu fyrir manngildi hvers og eins um lei\u00f0
  og \u00feau l\u00e6ra hvernig l\u00fd\u00f0r\u00e6\u00f0ssamf\u00e9l\u00f6g virka.
  Umhyggja fyrir d\u00fdrum og n\u00e1tt\u00faru er einnig hluti l\u00fd\u00f0r\u00e6\u00f0ismenntunar
  og \u00e1 heima \u00ed \u00f6llum n\u00e1msgreinum.  L\u00fd\u00f0r\u00e6\u00f0is-
  og mannr\u00e9ttindamenntun felur einnig \u00ed s\u00e9r h\u00e6fnina til a\u00f0
  gagnr\u00fdna og endurmeta grunngildi samf\u00e9lagsins. \u00deetta \u00fearf a\u00f0
  gerast \u00ed samstarfi milli sk\u00f3la og heimilis sem og hinna \u00fdmsu stofnana
  samf\u00e9lagsins.\\n\\n\u00cd starfi \u00e1 Ki\u00f0agli er leitast vi\u00f0 a\u00f0
  m\u00f3ta sk\u00f3lastarf af \u00fev\u00ed umhverfi sem vi\u00f0 b\u00faum vi\u00f0
  eins og atvinnu- f\u00e9lags og menningarlegu. Sk\u00f3linn tekur tillit til mismunandi
  fj\u00f6lskylduger\u00f0ar og uppruna barnanna og leitast vi\u00f0 a\u00f0 efla
  tilfinningu \u00feeirra fyrir \u00fev\u00ed a\u00f0 \u00feau tilheyri samf\u00e9laginu
  og s\u00e9u hluti af \u00fev\u00ed. Af \u00fev\u00ed m\u00e1 stu\u00f0la a\u00f0
  g\u00f3\u00f0um samskiptum utan sk\u00f3lans og n\u00fdtingu umhvefis  til vettvangsfer\u00f0a
  og leikja. Kennarar eiga a\u00f0 bera vir\u00f0ingu fyrir \u00f6llum og takast \u00e1
  vi\u00f0 eigin ford\u00f3ma svo \u00feeir stu\u00f0li ekki a\u00f0 mismunum \u00e1
  milli einstaklinga.\\n\\nMikilv\u00e6gt er a\u00f0 starfsf\u00f3lk \u00fdti undir
  \u00edmyndunnarafl barnanna sem hvetur \u00feau til a\u00f0 taka eigin \u00e1kvar\u00f0anir
  og frumkv\u00e6\u00f0i. Skapa \u00fearf a\u00f0st\u00e6\u00f0ur sem gerir \u00fea\u00f0
  a\u00f0 verkum a\u00f0 b\u00f6rnunum l\u00ed\u00f0ur vel og finni til \u00f6ryggis.
  Mikilv\u00e6gt er a\u00f0 \u00ed l\u00fd\u00f0r\u00e6\u00f0is\u00fej\u00f3\u00f0f\u00e9lagi
  a\u00f0 s\u00fdna vir\u00f0ingu og k\u00e6rleika svo a\u00f0 allir f\u00e1i noti\u00f0
  s\u00edn \u00ed leik og starfi. \u00dea\u00f0 er gert me\u00f0 \u00fev\u00ed a\u00f0
  vera me\u00f0vita\u00f0ur um a\u00f0 vi\u00f0 erum ekki \u00f6ll eins og hver og
  einn \u00fearf t\u00e6kif\u00e6ri til a\u00f0 nj\u00f3ta s\u00edn \u00e1 eigin forsendum.
  Mikilv\u00e6gt er a\u00f0 starfsf\u00f3lk kenni b\u00f6rnum skapandi hugsun og gefi
  \u00feeim t\u00e6kif\u00e6ri til \u00feess a\u00f0 tj\u00e1 sig \u00ed or\u00f0i
  og myndum.  \u00dea\u00f0 \u00fdtir undir sj\u00e1lfstraust \u00feeirra og eflir
  getuna til a\u00f0 taka \u00e1kvar\u00f0anir um eigin getu.\\n\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi 3-4 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n|
