  or\u00f0a, r\u00edm,tj\u00e1ning, fr\u00e1s\u00f6gn, lestur, s\u00f6ngur, or\u00f0hlutaey\u00f0ing
  | Vera me\u00f0 or\u00f0 sem b\u00f6rnin \u00feekkja og \u00fej\u00e1lfa \u00feau
  \u00ed a\u00f0 taka \u00ed sundur og setja saman |\\n\\nSj\u00e1lfb\u00e6rni 4-5
  \u00e1ra\\n\\nMe\u00f0 sj\u00e1lfb\u00e6rni er \u00e1tt vi\u00f0 a\u00f0 engin ein
  kynsl\u00f3\u00f0 hefur r\u00e9tt umfram a\u00f0ra til \u00feess a\u00f0 r\u00fdra
  arflei\u00f0 s\u00edna til n\u00e6stu kynsl\u00f3\u00f0ar. Lagt er til grundvallar
  a\u00f0 hver kynsl\u00f3\u00f0 skili \u00feeirri n\u00e6stu umhverfi s\u00ednu og
  n\u00e1tt\u00faru, \u00ed ekki lakara \u00e1sigkomulagi en h\u00fan t\u00f3k vi\u00f0
  henni.  Hugtaki\u00f0 er gildishla\u00f0i\u00f0 og  felur \u00ed s\u00e9r sam\u00e1byrg\u00f0
  manna, jafnv\u00e6gi \u00ed n\u00e1tt\u00farunni, efnahagslegt jafnv\u00e6gi, jafnv\u00e6gi  \u00ed
  samf\u00e9laginu og l\u00fd\u00f0r\u00e6\u00f0i. \u00dea\u00f0 felur einnig \u00ed
  s\u00e9r n\u00e1m sem eykur m.a. f\u00e6rni barna til \u00feess a\u00f0 takast \u00e1
  vi\u00f0 margv\u00edsleg \u00e1litam\u00e1l og \u00e1greiningsm\u00e1l sem stu\u00f0lar
  a\u00f0 vilja \u00feeirra og \u00e1huga til \u00feess a\u00f0 taka \u00fe\u00e1tt
  \u00ed samf\u00e9laginu. \u00c1 Ki\u00f0agili er l\u00f6g\u00f0 \u00e1hersla \u00e1
  a\u00f0 auka vir\u00f0ingu og \u00feekkingu barna \u00e1 n\u00e1tt\u00farunni.\\n\\n\u00deekking
  \u00e1 n\u00e1tt\u00farunni og fyrirb\u00e6rum hennar er manninum l\u00edfsnau\u00f0synlegt
  \u00fear sem afkoma hans er undir henni komin. B\u00f6rn \u00feurfa a\u00f0 kynnast
  fj\u00f6lbreytileika n\u00e1tt\u00farunnar og nj\u00f3ta hennar um lei\u00f0 og
  \u00fea\u00f0 l\u00e6rir a\u00f0 finna til \u00e1byrg\u00f0ar gagnvart henni. B\u00f6rnin
  eru fr\u00e6dd um n\u00e1tt\u00faruna, umhverfi\u00f0 og verndun \u00feess.  \u00deess
  ver\u00f0ur best vi\u00f0 komi\u00f0 me\u00f0 fer\u00f0um \u00fat \u00ed n\u00e1tt\u00faruna
  \u00fear sem b\u00f6rnin gera s\u00edna eigin athuganir og vinna \u00far \u00feeim
  eftir getu. Einfaldar e\u00f0lis og efnafr\u00e6\u00f0i tilraunir vekja \u00e1huga
  og \u00e1n\u00e6gju barnanna.\\n\\nAllir erusetja l\u00edfr\u00e6na afganga \u00ed
  s\u00e9rstakt \u00edl\u00e1t og fara afgangar s\u00ed\u00f0an \u00ed moltutunnur.
  B\u00f6rnin eru einnig me\u00f0 eigin vatnsbr\u00fasa sem er a\u00f0gengilegur fyrir
  \u00feeim.  Flokkun efna eins og papp\u00edr og plast er komi\u00f0 fyrir \u00ed
  s\u00e9rst\u00f6kum tunnum og k\u00f6ssum og eru b\u00f6rnin l\u00e1tin gera \u00fea\u00f0
  reglulega. Hver deild s\u00e9r um a\u00f0 fr\u00e6\u00f0a b\u00f6rnin og \u00ed
  \u00feeirri vinnu er liti\u00f0 til umhverfiss\u00e1ttm\u00e1lans og er hann fl\u00e9tta\u00f0ur
  inn \u00ed starf sk\u00f3lans. S\u00e9rstakar umhverfisvikur er \u00e1 dagatali
  sk\u00f3lans eins og t.d. endurvinnsluvika, steinavika, fuglavika, berjavika og
  bl\u00f3mavika en \u00fe\u00e6r vikur eru nota\u00f0ar s\u00e9rstaklega til a\u00f0
  t\u00edna rusl, fara \u00ed vettvangsfer\u00f0ir, sko\u00f0a bl\u00f3min og skord\u00fdrin,
  gr\u00f3\u00f0ursetja bl\u00f3m og \u00fdmiskonar jurtir og t\u00edna ber.\\n\\nHver
  deild er me\u00f0 \u00e1kve\u00f0i\u00f0 verkefni inn \u00e1 sinni deild sem er
  \u00ed tengslum vi\u00f0 umhverfisfr\u00e6\u00f0slu. \u00cd verkefnager\u00f0 er
  reynt a\u00f0 n\u00fdta \u00feann efnivi\u00f0 sem til er \u00ed leiksk\u00f3lanum
  sem er endurn\u00fdtanlegur.\\n\\nSj\u00e1lfb\u00e6rni 4-5 \u00e1ra\\n\\n| Markmi\u00f0
