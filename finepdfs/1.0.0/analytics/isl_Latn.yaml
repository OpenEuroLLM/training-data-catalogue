  English World 3 \u00e1samt \u00f6\u00f0ru efni. Hver nemandi vinnur \u00e1 s\u00ednum
  hra\u00f0a og \u00e1 s\u00ednu getustigi eins og h\u00e6gt er en allur bekkurinn
  fer saman yfir grunn m\u00e1lfr\u00e6\u00f0iatri\u00f0i og or\u00f0afor\u00f0a.\\n\\nN\u00e1msefni\\n\\nLj\u00f3srita\u00f0
  hefti fr\u00e1 kennara, frj\u00e1lslestrarb\u00e6kur, lesb\u00f3kin English World
  3 og anna\u00f0 efni.\\n\\nN\u00e1msmat\\n\\nGefnar eru einkunnir fr\u00e1 0-10
  \u00ed lokamati. Til grundvallar \u00fev\u00ed mati liggja kannanir, mat \u00e1
  virkni \u00ed t\u00edma og verkefni\\n\\nText\u00edlmennt 4. bekkur\\n\\nKennari:
  Thelma M. Marin\u00f3sd\u00f3ttir\\n\\nNemendur f\u00e1  1 x 40 m\u00edn\u00fatna
  kennslustundir \u00e1 viku.\\n\\nH\u00e6fnivi\u00f0mi\u00f0:\\n\\nHandverk, a\u00f0fer\u00f0ir
  og t\u00e6kni. A\u00f0 nemendur geti nota\u00f0 einfaldar a\u00f0fer\u00f0ir innan
  text\u00edlgreinarinnar, beitt vi\u00f0eigandi verkf\u00e6rum af \u00f6ryggi og
  unni\u00f0 eftir einf\u00f6ldum lei\u00f0beiningum.\\nSk\u00f6pun, h\u00f6nnun og
  \u00fatf\u00e6rsla. A\u00f0 nemendur geti tj\u00e1\u00f0 hugmyndir s\u00ednar me\u00f0
  einfaldri skissu og skreytt verk s\u00edn \u00e1 einfaldan h\u00e1tt.  \u00deekki
  mismunandi tegundir handverks og kunni nokkur hugt\u00f6k sem tengjast greininni\\nMenning
  og umhverfi. A\u00f0 nemendur geti sagt fr\u00e1 \u00edslensku hr\u00e1efni og unni\u00f0
  me\u00f0 \u00fea\u00f0 \u00e1 einfaldan h\u00e1tt.  Fjalla\u00f0 um mismunandi kl\u00e6\u00f0na\u00f0
  f\u00f3lks me\u00f0 tilliti til ver\u00f0urfars, athafna og tilefna.  Getir nota\u00f0
  n\u00fd og endurunnin efni \u00ed text\u00edlvinnu.\\n\\nSkipulag kennslunnar\\n\\nNemendur
  vinna eftir lei\u00f0s\u00f6gn kennara .  Unni\u00f0 er me\u00f0 grunna\u00f0fer\u00f0ir
  og t\u00e6kni innan text\u00edlmenntarinnar og fl\u00f3knari a\u00f0fer\u00f0um
  b\u00e6tt vi\u00f0 sm\u00e1tt og sm\u00e1tt, allt eftir getu hvers og eins.\\n\\nN\u00e1msg\u00f6gn:
  Verkefni \u00far verkefnasafni kennara og verkefni af veraldarvefnum. \u00ddmis
  efni og \u00e1h\u00f6ld sem verkefnin krefjast.\\n\\nGrunn\u00fe\u00e6ttir menntunar\\n\\n\u00cd
  text\u00edlmennt er unni\u00f0 me\u00f0 efni af \u00f3l\u00edkum toga b\u00e6\u00f0i
  umhverfisv\u00e6n og mengandi. Mikilv\u00e6gt er a\u00f0 nemendur \u00feekki muninn
  \u00e1 umhverfisv\u00e6nu og umhverfisspillandi efnum, l\u00e6ri a\u00f0 umgangast
  \u00feau r\u00e9tt og beri vir\u00f0ingu fyrir n\u00e1tt\u00farunni og umhverfi
  s\u00ednu.  Sk\u00f6pun, l\u00e6si og sj\u00e1lfb\u00e6rni eru sto\u00f0ir sem eru
  samofnar text\u00edlmenningu og \u00ed text\u00edlmennt er t\u00e6kif\u00e6ri til
  a\u00f0 vinna  me\u00f0 \u00fe\u00e6r \u00e1 \u00e1\u00fereifanlegan h\u00e1tt og
  tengja vi\u00f0 a\u00f0ra \u00fe\u00e6tti til a\u00f0 efla skilning nemenda.  \u00cd
  text\u00edlmennt vinna nemendur \u00ed n\u00e1nd vi\u00f0 hvert anna\u00f0, l\u00e6ra
  a\u00f0 taka tillit hvers annars, hj\u00e1lpa hvert \u00f6\u00f0ru og bera vir\u00f0ingu
  fyrir hvert \u00f6\u00f0ru, hvert me\u00f0 s\u00edna s\u00e9rst\u00f6\u00f0u og
  pers\u00f3lulega st\u00edl og tengjast \u00fear me\u00f0 grunn\u00fe\u00e1ttunum
  jafnr\u00e9tti sem og l\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi.\\n\\nN\u00e1msmat\\n\\nN\u00e1msmati\u00f0
  byggir \u00e1 lei\u00f0sagnarmati og s\u00edmati \u00e1 vinnubr\u00f6g\u00f0um,
  frumkv\u00e6\u00f0i, framf\u00f6rum og \u00e1stundun nemenda. Einkunn er gefin \u00ed
  annarlok \u00e1 bilinu 1-10\\n\\nT\u00f3nmennt 4. \u2013 5. bekkur\\n\\nKennari:
  Erla Br\u00e1 Sigf\u00fasd\u00f3ttir\\n\\nNemendur f\u00e1  1 x 40 m\u00edn\u00fatna
  kennslustund \u00e1 viku\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nA\u00f0 nemandi geti:\\n\\n-
  \u00feekkt hlj\u00f3\u00f0f\u00e6ri og hlj\u00f3\u00f0bl\u00e6 \u00ed t\u00f3nsk\u00f6pun
  og hlustun.\\n- greint \u00f3l\u00edkar raddir og beitt r\u00f6dd sinni sem hlj\u00f3\u00f0f\u00e6ri
  \u00ed sams\u00f6ng og spuna\\n- leiki\u00f0 einfalda rytma e\u00f0a \u00fer\u00e1stef
  \u00e1 slagverkshlj\u00f3\u00f0f\u00e6ri og \u00f6nnur sk\u00f3lahlj\u00f3\u00f0f\u00e6ri\\n-
  teki\u00f0 \u00fe\u00e1tt \u00ed a\u00f0 skapa og flytja einfalt t\u00f3nverk/hlj\u00f3\u00f0verk
