  m\u00e6lingum og nota\u00f0 vi\u00f0eigandi m\u00e6likvar\u00f0a.\\n\\nSkipulag
  kennslunar\\n\\nUnni\u00f0 er a\u00f0 mestu \u00fat fr\u00e1 \u00e1\u00e6tlun \u00ed
  st\u00e6r\u00f0fr\u00e6\u00f0i. Nemendur vinna \u00ed n\u00e1msefni \u00e1 s\u00ednum
  hra\u00f0a og eftir s\u00ednu getustigi.\\n\\nH\u00f3pinnlagnir eru vegna \u00fdmissa
  efnisatri\u00f0a, \u00feegar leggja \u00e1 fyrir n\u00fdja f\u00e6rni e\u00f0a \u00feegar
  l\u00e6r\u00f0 \u00feekking er fest \u00ed sessi, annars eru einstaklingsinnlagnir.
  N\u00e1msefni er lagt fyrir \u00ed t\u00edma og verkefni \u00ed kennslub\u00f3k,
  af neti e\u00f0a \u00f6\u00f0rum g\u00f6gnum fr\u00e1 kennara unnin \u00fdmist einstaklingslega
  e\u00f0a \u00ed h\u00f3pavinnu.\\n\\nN\u00e1msg\u00f6gn: Sproti 4a og 4b nemendab\u00f3k
  og Sproti 3a \u00e6fingarhefti, Vi\u00f0 stefnum \u00e1 margf\u00f6ldun og Vi\u00f0
  stefnum \u00e1 deilingu, \u00fdmislegt lj\u00f3srita\u00f0 efni fr\u00e1 kennara
  og anna\u00f0 \u00fej\u00e1lfunarefni t.d. \u00e1 netinu (sj\u00e1 t.d. rasmus.is).\\n\\nGrunn\u00fe\u00e6ttir
  menntunar\\n\\nL\u00e6si: L\u00e6si \u00e1 t\u00e1kn og mi\u00f0la st\u00e6r\u00f0fr\u00e6\u00f0innar
  er forsenda skilnings nemandans. Me\u00f0 \u00fej\u00e1lfun \u00ed a\u00f0 leysa
  verkefni \u00ed h\u00f3p og r\u00e6\u00f0a \u00f3l\u00edkar lausnir \u00f6\u00f0last
  nemendur f\u00e6rni \u00ed a\u00f0 tj\u00e1 sig me\u00f0 hugt\u00f6kum st\u00e6r\u00f0fr\u00e6\u00f0innar
  og ver\u00f0a l\u00e6sir \u00e1 hin \u00f3l\u00edku birtingarform hennar. Markmi\u00f0
  l\u00e6sis er a\u00f0 nemendur ver\u00f0i virkir \u00fe\u00e1tttakendur \u00ed leggja
  merkingu \u00ed \u00fea\u00f0 sem fengist er vi\u00f0 hverju sinni.\\nSj\u00e1lfb\u00e6rni:
  Sj\u00e1lfb\u00e6rni \u00ed st\u00e6r\u00f0fr\u00e6\u00f0ikennslunni beinist a\u00f0
  l\u00fd\u00f0r\u00e6\u00f0islegum vinnubr\u00f6g\u00f0um \u00fear sem nemendum gefst
  kostur \u00e1 a\u00f0 r\u00e6\u00f0a og leysa verkefni \u00ed sameiningu og finna
  bestu lausnir. Auk \u00feess f\u00e1 \u00feeir inns\u00fdn \u00ed hvernig st\u00e6r\u00f0fr\u00e6\u00f0i
  n\u00fdtist me\u00f0al annars til a\u00f0 finna lausnir \u00e1 vandam\u00e1lum daglegs
  l\u00edfs.\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi: Endurspeglast \u00ed
  virkni nemenda \u00ed t\u00edmum vi\u00f0 a\u00f0 leita lausna, mi\u00f0la eigin
  \u00feekkingu og vir\u00f0a framlag annarra. Me\u00f0 einstaklingsbundnum \u00e1\u00e6tlunum
  l\u00e6ra nemendur a\u00f0 vir\u00f0a s\u00e9rst\u00f6\u00f0u hvers annars en um
  lei\u00f0 a\u00f0 setja sj\u00e1lfum s\u00e9r h\u00e6fileg markmi\u00f0.\\nJafnr\u00e9tti:
  \u00cd st\u00e6r\u00f0fr\u00e6\u00f0ikennslunni birtist jafnr\u00e9tti fyrst og
  fremst \u00ed \u00fev\u00ed a\u00f0 allir nemendur f\u00e1i verkefni og n\u00e1msefni
  vi\u00f0 h\u00e6fi og a\u00f0 \u00fe\u00f6rfum \u00feeirra s\u00e9 m\u00e6tt af
  skilningi og vir\u00f0ingu. Kennari leggur sig fram um a\u00f0 gera \u00f6llum nemendum
  kleift a\u00f0 auka \u00feekkingu s\u00edna og h\u00e6fni \u00e1 eigin forsendum
  og hra\u00f0a og beita fj\u00f6lbreyttum a\u00f0fer\u00f0um \u00ed \u00fev\u00ed
  augnami\u00f0i.\\nHeilbrig\u00f0i og velfer\u00f0: nemenda er undirsta\u00f0a n\u00e1ms
  og er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 skapa g\u00f3\u00f0an f\u00e9lagsanda
  og bekkjarbrag \u00ed sk\u00f3lastofunni. J\u00e1kv\u00e6\u00f0 samskipti, samhj\u00e1lp
  og vir\u00f0ing stu\u00f0lar a\u00f0 g\u00f3\u00f0ri og j\u00e1kv\u00e6\u00f0ri
  sj\u00e1lfsmynd nemenda og hugrekki til a\u00f0 tj\u00e1 sig um eigin hugmyndir
  og taka \u00fe\u00e1tt \u00ed uppbyggilegum sko\u00f0anaskiptum um verkefni st\u00e6r\u00f0fr\u00e6\u00f0innar.\\nSk\u00f6pun:
  er veigamikill \u00fe\u00e1ttur \u00ed \u00ferautalausnum st\u00e6r\u00f0fr\u00e6\u00f0innar.
  Nemendur skulu hvattir til a\u00f0 beita skapandi hugsun og leita fj\u00f6lbreyttra
  lei\u00f0a til a\u00f0 finna lausnir \u00e1 verkefnum s\u00ednum. Nemendur ver\u00f0i
  \u00feess \u00e1skynja a\u00f0 sjaldan er a\u00f0eins til ein r\u00e9tt lausn \u00e1
  vanda e\u00f0a verkefni og oftast m\u00e1 beita margs konar a\u00f0fer\u00f0um til
  a\u00f0 f\u00e1 s\u00f6mu ni\u00f0urst\u00f6\u00f0u.\\n\\nN\u00e1msmat\\n\\nLagt
  ver\u00f0ur fyrir nemendur nokkrar kannanir \u00e1 \u00fev\u00ed efni sem fyrir
  liggur hverju sinni. \u00cd desember er lagt fyrir j\u00f3lapr\u00f3f sem er einnig
  hluti af lokaeinkunn nemanda auk kennaraeinkunnar\\n\\nHlutfall n\u00e1ms\u00fe\u00e1tt
  \u00ed lokaeinkunn a\u00f0 vetri er eftirfarandi:\\n\\nKannanir\\n\\n30%\\n\\nKennaraeinkun/lykilh\u00e6fni\\n\\n20%\\n\\nVorpr\u00f3f\\n\\n50%\\n\\nSt\u00e6r\u00f0fr\u00e6\u00f0i
  5. bekkur\\n\\nKennarar: B\u00e6ring J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson\\n\\nStu\u00f0ningur
  \u00ed einum kennslut\u00edma: Valborg Halld\u00f3ra Gestsd\u00f3ttir\\n\\nSex t\u00edmar
  \u00ed st\u00e6r\u00f0fr\u00e6\u00f0i \u00e1 viku samkenndir me\u00f0 4. bekk\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nVi\u00f0
  lok 5. bekkjar geti nemandi:\\n\\nTeki\u00f0 \u00fe\u00e1tt \u00ed samr\u00e6\u00f0um
  um spurningar og sv\u00f6r sem eru einkennandi fyrir st\u00e6r\u00f0fr\u00e6\u00f0i,\\nleyst
  st\u00e6r\u00f0fr\u00e6\u00f0i\u00ferautir um vi\u00f0fangsefni sem gefa t\u00e6kif\u00e6ri
  til a\u00f0 beita inns\u00e6i, nota\u00f0 \u00e1\u00fereifanlega hluti og eigin
  sk\u00fdringarmyndir,\\nr\u00f6kr\u00e6tt st\u00e6r\u00f0fr\u00e6\u00f0iverkefni
  og r\u00f6kstutt eigin ni\u00f0urst\u00f6\u00f0ur og skili\u00f0 r\u00f6ksemdir
  sem settar eru fram af \u00f6\u00f0rum,\\nt\u00falka\u00f0 og nota\u00f0 einf\u00f6ld
  st\u00e6r\u00f0fr\u00e6\u00f0it\u00e1kn s.s. t\u00f6lur og a\u00f0ger\u00f0amerki
  og tengt vi\u00f0 daglegt m\u00e1l\\nvali\u00f0 og nota\u00f0 hentug verkf\u00e6ri,
  svo sem hlutbundin g\u00f6gn og vasareikni, talnal\u00ednur og reiknirit vi\u00f0
  lausn st\u00e6r\u00f0fr\u00e6\u00f0iverkefna\\nfundi\u00f0 lausnalei\u00f0ir vi\u00f0
  \u00ferautalausnir me\u00f0 \u00fev\u00ed m.a. a\u00f0 nota hlutbundin g\u00f6gn
  og teikningar,\\nunni\u00f0 \u00ed samvinnu vi\u00f0 a\u00f0ra a\u00f0 lausnum st\u00e6r\u00f0fr\u00e6\u00f0iverkefna
  \u00fear sem byggt er \u00e1 hugmyndum\\nnemenda,\\nnota\u00f0 r\u00e6\u00f0ar t\u00f6lur,
  ra\u00f0a\u00f0 \u00feeim og bori\u00f0 saman,\\nnota\u00f0 tugakerfisrith\u00e1tt
  og s\u00fdnt a\u00f0 hann skilur s\u00e6tiskerfi,\\ngefi\u00f0 d\u00e6mi um og s\u00fdnt
  hvernig einf\u00f6ld brot og hlutf\u00f6ll eru notu\u00f0 \u00ed daglegu l\u00edfi,\\nleyst
  vi\u00f0fangsefni \u00far daglegu l\u00edfi me\u00f0 hugarreikningi, vasareikni
  og skriflegum \u00fatreikningum,\\nn\u00fdtt s\u00e9r samhengi og tengsl reiknia\u00f0ger\u00f0anna
  og nota\u00f0 algengar reiknireglur,\\nrannsaka\u00f0 og sett fram talnamynstur
  \u00e1 skipulegan h\u00e1tt,\\nfundi\u00f0 lausnir \u00e1 einf\u00f6ldum j\u00f6fnum
  me\u00f0 \u00f3formlegum a\u00f0fer\u00f0um og r\u00f6kstutt lausnir s\u00ednar,\\nnota\u00f0
  hugt\u00f6k og a\u00f0fer\u00f0ir r\u00famfr\u00e6\u00f0innar til a\u00f0 tala um
  hluti og fyrirbri\u00f0i \u00ed daglegu l\u00edfi og umhverfi s\u00ednu,\\ngreint
  tv\u00edv\u00ed\u00f0 og \u00fer\u00edv\u00ed\u00f0 form, teikna\u00f0 einfaldar
  flatar- og \u00fer\u00edv\u00edddarmyndir, spegla\u00f0, sn\u00fai\u00f0 og hli\u00f0ra\u00f0
  flatarmyndum,\\nnota\u00f0 m\u00e6likvar\u00f0a og l\u00f6gun \u00ed tengslum vi\u00f0
  teikningar, umm\u00e1l, flatarm\u00e1l og r\u00famm\u00e1l,\\n\u00e1\u00e6tla\u00f0
  og m\u00e6lt horn, \u00feyngd, t\u00edma, hitastig me\u00f0 vi\u00f0eigandi m\u00e6likvar\u00f0a,\\nnota\u00f0
  hnitakerfi til a\u00f0 tj\u00e1 og leysa r\u00famfr\u00e6\u00f0ileg verkefni,\\ntengt
  t\u00f6lur og \u00fatreikninga vi\u00f0 flatarmyndir og \u00fer\u00edv\u00ed\u00f0a
  hluti,\\nsafna\u00f0 og unni\u00f0 \u00far g\u00f6gnum, mi\u00f0la\u00f0 uppl\u00fdsingum
  um \u00feau m.a. me\u00f0 t\u00f6flum og myndritum,\\ngert einfaldar t\u00f6lfr\u00e6\u00f0iranns\u00f3knir
  og dregi\u00f0 einfaldar \u00e1lyktanir af \u00feeim\\n\\nN\u00e1ms- og kennslutilh\u00f6gun\\n\\nNemendur
  vinna a\u00f0 mestu leyti sj\u00e1lfst\u00e6tt \u00ed n\u00e1msb\u00f3kum \u00e1
  s\u00ednum hra\u00f0a og s\u00ednum forsendum og f\u00e1 a\u00f0sto\u00f0 eftir
