  \u00ed a\u00f0 leita s\u00e9r uppl\u00fdsinga, greina texta og finna a\u00f0alatri\u00f0i,
  endursegja og skilja.\\nSj\u00e1lfb\u00e6rni beinist a\u00f0 l\u00fd\u00f0r\u00e6\u00f0islegum
  vinnubr\u00f6g\u00f0um \u00fear sem nemendum gefst kostur \u00e1 a\u00f0 vinna saman
  a\u00f0 \u00e1kve\u00f0num verkefnum.\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi
