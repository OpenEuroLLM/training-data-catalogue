  til a\u00f0 leita s\u00e9r a\u00f0fer\u00f0a, uppskrifta og lei\u00f0a til a\u00f0
  \u00f6\u00f0last heilbrig\u00f0s l\u00edfernis.\\nSk\u00f6pun - Geti skapa\u00f0
  s\u00edna eigin vefs\u00ed\u00f0ur, leiki o.s.frv.\\n\\nN\u00e1msmat\\n\\nN\u00e1msmatsvi\u00f0mi\u00f0
  og matskvar\u00f0i: Einkunnir fr\u00e1 1 \u2013 10\\n\\n\u00dea\u00f0 sem er meti\u00f0
  \u00ed s\u00edmati er j\u00e1kv\u00e6\u00f0ni, virkni, geta og verkefni.\\n\\nNemendur
  vinna lokaverkefni \u00ed lok annar sem gildir 30% \u00e1 m\u00f3ti \u00f6\u00f0rum
  \u00fe\u00e1ttum\\n\\nMyndmennt 4. og 5. bekkur\\n\\nKennari: Ragna Magn\u00fasd\u00f3ttir\\n\\nKennslustundir:
  2 x 40 m\u00edn\u00fatur \u00e1 viku\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nA\u00f0
  vori getur nemandi:\\n\\nteki\u00f0 tillit til annarra \u00ed h\u00f3pvinnu og s\u00fdnt
  frumkv\u00e6\u00f0i,\\nn\u00fdtt s\u00e9r einfaldar \u00fatf\u00e6rslur sem byggja
  \u00e1 f\u00e6rni \u00ed me\u00f0fer\u00f0 lita- og formfr\u00e6\u00f0i,\\ntj\u00e1\u00f0
  tilfinningar, sko\u00f0anir og hugmyndaheim sinn \u00ed myndverki \u00e1 einfaldan
  h\u00e1tt,\\nunni\u00f0 \u00fat fr\u00e1 kveikju vi\u00f0 eigin listsk\u00f6pun,\\n\u00feekkt
  hugt\u00f6k og heiti sem tengjast a\u00f0fer\u00f0um verkefna hverju sinni,\\ngreint
  \u00e1 einfaldan h\u00e1tt \u00e1hrif myndm\u00e1ls \u00ed n\u00e6rumhverfi s\u00ednu,\\ngert
  grein fyrir margv\u00edslegum tilgangi myndlistar og h\u00f6nnunar,\\ns\u00fdnt
  \u00e1byrga umgengni vi\u00f0 vinnu og fr\u00e1gang \u00e1 vinnusv\u00e6\u00f0i,\\nlagt
  mat \u00e1 eigin verk og s\u00fdnt skilning \u00e1 v\u00f6ndu\u00f0um vinnubr\u00f6g\u00f0um.\\n\\nSkipulag
  kennslunnar\\n\\nKennslua\u00f0fer\u00f0ir:\\n\\nFyrst og fremst er um a\u00f0 r\u00e6\u00f0a
  s\u00fdnikennslu \u00fear sem kennari s\u00fdnir nemendum \u00e1kve\u00f0nar a\u00f0fer\u00f0ir
  e\u00f0a t\u00e6kni og nemendur vinna s\u00ed\u00f0an verkefni. Kennari s\u00fdnir
  verk valinna listamanna og st\u00edl verka \u00feeirra og nemendur f\u00e1 a\u00f0
  spreyta sig \u00e1 a\u00f0 vinna verkefni \u00ed \u00feeim anda. Nemendur eru hvattir
  til a\u00f0 sko\u00f0a umhverfi sitt og gaumg\u00e6fa hvernig unnt er a\u00f0 hafa
  \u00e1hrif \u00e1 okkur me\u00f0 myndum, litum og formum, ekki s\u00edst \u00ed
  n\u00fat\u00edma neyslusamf\u00e9lagi.\\n\\nSkipulag \u00ed kennslustofunni\\n\\nNemendur
  vinna yfirleitt einir a\u00f0 s\u00ednum verkefnum en uppr\u00f6\u00f0un \u00ed
  stofunni er yfirleitt \u00feannig a\u00f0 nemendur sitja saman. Af og til er unni\u00f0
  \u00ed litlum h\u00f3pum. Efni er a\u00f0gengilegt og hafa nemendur frj\u00e1lsan
  a\u00f0gang a\u00f0 \u00fev\u00ed sem \u00feeir \u00feurfa a\u00f0 nota hverju sinni.\\n\\nHeiman\u00e1m\\n\\nHeiman\u00e1m
  ver\u00f0ur ekki lagt fyrir, en stundum f\u00e1 nemendur fyrirm\u00e6li um a\u00f0
  hafa eitthva\u00f0 me\u00f0fer\u00f0is a\u00f0 heiman, e\u00f0a a\u00f0 sko\u00f0a
  eitthva\u00f0 \u00e1kve\u00f0i\u00f0 sem \u00e1 s\u00ed\u00f0an a\u00f0 n\u00fdtast
  \u00ed n\u00e6sta t\u00edma.\\n\\nN\u00e1msg\u00f6gn:\\n\\nefni og \u00e1h\u00f6ld
  sem eiga vi\u00f0 hverju sinni,,\\nverkefni og efni af veraldarvefnum,\\nlistasaga,
  fr\u00e1 hellalist til 1900, h\u00f6f: Halld\u00f3r Bj\u00f6rn Run\u00f3lfsson og
  Ingimar Waage, 2013\\nhttp://www1.nams.is/myndmennt/\\n\\nGrunn\u00fe\u00e6ttir
  menntunar\\n\\nL\u00e6si \u00e1 t\u00e1knheim mynda og sj\u00f3nr\u00e6ns \u00e1reitis
  \u00ed v\u00ed\u00f0um skilningi \u00feess or\u00f0s er nau\u00f0synleg \u00ed n\u00fat\u00edma
  samf\u00e9lagi. Markmi\u00f0 me\u00f0 myndlistarkennslu er a\u00f0 gera nemendur
  l\u00e6sa \u00e1 \u00feann t\u00e1knheim sem alls sta\u00f0ar er \u00ed kringum
  okkur. \u00dej\u00e1lfun \u00ed a\u00f0 beita mi\u00f0lum myndlistarinnar gerir
  nemendur f\u00e6rari til a\u00f0 mi\u00f0la eigin hugmyndum og eflir frumkv\u00e6\u00f0i
  \u00feeirra.\\nSj\u00e1lfb\u00e6rni byggist me\u00f0al annars \u00e1 \u00fev\u00ed
  a\u00f0 kenna nemendum a\u00f0 n\u00fdta efnivi\u00f0 sem ella f\u00e6ri \u00ed
  rusli\u00f0 og a\u00f0 fara vel me\u00f0 \u00feau efni sem unni\u00f0 er me\u00f0
  hverju sinni.\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi endurspeglast \u00ed
  virkni nemenda \u00ed t\u00edmum vi\u00f0 a\u00f0 leita lausna, mi\u00f0la eigin
  \u00feekkingu og vir\u00f0a framlag annarra. Me\u00f0 einstaklingsbundnum verkefnum
  l\u00e6ra nemendur a\u00f0 vir\u00f0a s\u00e9rst\u00f6\u00f0u hvers annars.\\n\\nJafnr\u00e9tti
  birtist me\u00f0al annars \u00ed \u00fev\u00ed a\u00f0 allir nemendur f\u00e1 a\u00f0
  vinna a\u00f0 s\u00ednum verkefnum eftir getu og \u00fe\u00f6rfum \u00feeirra m\u00e6tt
  af skilningi og vir\u00f0ingu. Nemendur skulu temja s\u00e9r a\u00f0 bera vir\u00f0ingu
  fyrir eigin verkum og annarra.\\nHeilbrig\u00f0i og velfer\u00f0 nemenda er undirsta\u00f0a
  n\u00e1ms og er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 skapa g\u00f3\u00f0an
  f\u00e9lagsanda og bekkjarbrag \u00ed sk\u00f3lastofunni. J\u00e1kv\u00e6\u00f0
  samskipti, samhj\u00e1lp og vir\u00f0ing stu\u00f0lar a\u00f0 g\u00f3\u00f0ri og
  j\u00e1kv\u00e6\u00f0ri sj\u00e1lfsmynd nemenda og hugrekki til a\u00f0 tj\u00e1
  sig um eigin hugmyndir og taka \u00fe\u00e1tt \u00ed uppbyggilegum sko\u00f0anaskiptum
  um vi\u00f0fangsefni myndlistarinnar.\\nSk\u00f6pun er undirsta\u00f0a allra listgreina
  og me\u00f0 markvissri \u00fej\u00e1lfun f\u00e1 nemendur auki\u00f0 sj\u00e1lfstraust
  og frumkv\u00e6\u00f0i til a\u00f0 finna sk\u00f6punargle\u00f0i sinni farveg. Me\u00f0
  \u00fev\u00ed a\u00f0 efla skapandi hugsun eykst geta nemenda til a\u00f0 leysa
  fj\u00f6lbreytt verkefni \u00ed daglegu l\u00edfi og n\u00e1mi.\\n\\nN\u00e1msmat\\n\\n\u00c1kve\u00f0in
  verkefni ver\u00f0a l\u00f6g\u00f0 til grundvallar matinu.\\n\\nMeti\u00f0 er:\\n\\nH\u00e6fni
  vi\u00f0 a\u00f0 beita \u00feekkingu og t\u00e6kni\\nFrumkv\u00e6\u00f0i og sk\u00f6pun
  \u00ed \u00fatf\u00e6rslu verkefnis\\nSj\u00e1lfst\u00e6\u00f0i \u00ed vali \u00e1
  efni, litum og formum til tj\u00e1ningar\\n\u00c1byrg\u00f0 \u00ed umgengni og fr\u00e1gangi
  og framkomu vi\u00f0 a\u00f0ra nemendur\\n\\nSk\u00f3la\u00ed\u00fer\u00f3ttir 4.
  og 5. bekkur\\n\\nKennari: S\u00f3ley Margeirsd\u00f3ttir, 5. bekkur\\n\\nKennari:
  Erla Br\u00e1 Sigf\u00fasd\u00f3ttir, 4. bekkur\\n\\n\u00derj\u00e1r kennslustundir
  \u00e1 viku.\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nKennslan mi\u00f0ast a\u00f0 \u00fev\u00ed
  a\u00f0 nemandi geti/hafi:\\n\\ns\u00fdnt nokkra boltaf\u00e6rni og teki\u00f0 \u00fe\u00e1tt
  \u00ed mismunandi boltaleikjum,\\ns\u00fdnt einfaldar \u00e6fingar sem reyna \u00e1
  lipur\u00f0 og samh\u00e6fingu,\\nunni\u00f0 me\u00f0 a\u00f0 vinna saman \u00ed
  h\u00f3pum,\\nunni\u00f0 me\u00f0 \u00fea\u00f0 a\u00f0 vinna og tapa,\\nhaldi\u00f0
  \u00e1fram me\u00f0 undirst\u00f6\u00f0u atri\u00f0i sunds s.s. bringu-, skri\u00f0-
  sk\u00f3labak- og baksund. Stinga s\u00e9r af bakka, grunnatri\u00f0i \u00ed flugsundi,\\nfari\u00f0
  eftir helstu \u00f6ryggisreglum b\u00e6\u00f0i \u00ed sundlaug og \u00ed\u00fer\u00f3ttah\u00fasi.\\n\\nKennsluh\u00e6ttir\\n\\nKennslua\u00f0fer\u00f0ir:
  h\u00f3pkennsla, innlagnir, verklegar \u00e6fingar, hermin\u00e1m o.s.frv.\\n\\nN\u00e1msg\u00f6gn:
  t\u00e6ki og t\u00f3l s.s. fl\u00e1r, n\u00fa\u00f0lur, d\u00fdnur, bolta o.s.frv.
  og leikir.\\n\\nGrunn\u00fe\u00e6ttir menntunnar\\n\\nL\u00e6si: Nemendur geti vali\u00f0
  \u00feau t\u00e6ki og \u00e1h\u00f6ld sem henta hverju sinni, viti hver \u00e1hrif
  hreyfingar eru \u00e1 l\u00edkamann og f\u00e1i t\u00e6kif\u00e6ri til a\u00f0 upplifa
  hreyfingu og r\u00e6\u00f0a mikilv\u00e6gi hennar.\\nSj\u00e1lfb\u00e6rni: Nemendur
  geti b\u00fai\u00f0 sj\u00e1lfir til \u00e6fingarplan og fylgt \u00fev\u00ed eftir
  en einnig vali\u00f0 leiki sem veitir \u00feeim \u00e1n\u00e6gju og sem \u00feeim
  \u00feykir \u00e1hugaver\u00f0ur.\\n\\nJafnr\u00e9tti: Allir f\u00e1i a\u00f0 stunda
  \u00ed\u00fer\u00f3ttir \u00f3h\u00e1\u00f0 \u00fej\u00f3\u00f0erni, tr\u00faarbr\u00f6g\u00f0um,
  kyni og aldri. Nemendur geti fari\u00f0\\neftir reglum og unni\u00f0 \u00e1 jafnr\u00e9ttisgrundvelli.\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi: A\u00f0 nemendur geti vali\u00f0 s\u00e9r hreyfingu vi\u00f0
  h\u00e6fi, geti haft \u00e1hrif \u00e1 leikjaval en einnig h\u00f3paskiptingar og
  li\u00f0. Nemendur l\u00e6ri a\u00f0 koma fram vi\u00f0 samnemendur og a\u00f0ra
  a\u00f0 vir\u00f0ingu og kurteisi.\\nHeilbrig\u00f0i og velfer\u00f0: Nemendur \u00e1tti
  sig \u00e1 mikilv\u00e6gi heilbrig\u00f0s l\u00edfernis og hreyfingu en einnig hversu
  j\u00e1kv\u00e6\u00f0 h\u00fan er fyrir s\u00e1l og l\u00edkama.\\nSk\u00f6pun:
  Geti \u00fer\u00f3a\u00f0 og hanna\u00f0 leiki og reglur.\\n\\nN\u00e1msmat\\n\\nEinkunnir
  eru gefnar fr\u00e1 1 \u2013 10\\n\\n\u00dea\u00f0 er s\u00edmat \u00e1 \u00f6nninni.
  \u00dea\u00f0 sem er meti\u00f0 \u00ed s\u00edmati er j\u00e1kv\u00e6\u00f0ni, virkni,
  geta og h\u00e6fni.\\n\\nLykilh\u00e6fni 4.- 5. bekkur\\n\\nKennari: B\u00e6ring
  J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson Einn t\u00edmi \u00e1 viku.\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nKennslan
  mi\u00f0ast a\u00f0 \u00fev\u00ed a\u00f0 nemandi geti/hafi:\\n\\ngert s\u00e9r
  grein fyrir styrkleikum s\u00ednum me\u00f0 \u00fea\u00f0 a\u00f0 markmi\u00f0i
  a\u00f0 efla og byggja upp sj\u00e1lfsmynd s\u00edna,\\nteki\u00f0 j\u00e1kv\u00e6\u00f0an
  \u00fe\u00e1tt \u00ed leik og starfi \u00ed sk\u00f3lasamf\u00e9lagi s\u00ednu,\\nteki\u00f0
  lei\u00f0s\u00f6gn og uppbyggilegri gagnr\u00fdni \u00e1 j\u00e1kv\u00e6\u00f0an
  h\u00e1tt,\\ngert s\u00e9r grein fyrir styrkleikum s\u00ednum og hvernig hann getur
  n\u00fdtt s\u00e9r \u00fea\u00f0 \u00ed n\u00e1mi,\\nsett s\u00e9r markmi\u00f0
  \u00ed n\u00e1mi og unni\u00f0 eftir \u00feeim.\\ns\u00fdnt tillitssemi og vir\u00f0ingu
  \u00ed samskiptum og samvinnu vi\u00f0 a\u00f0ra,\\ns\u00fdnt tillitsemi og umhyggju
  \u00ed leik og starfi.\\n\\nSkipulag kennslunar\\n\\nUnni\u00f0 ver\u00f0ur \u00ed
  sj\u00e1lfstyrkingu og samkennd \u00ed gegnum leiki e\u00f0a umr\u00e6\u00f0ur.
  Unni\u00f0 ver\u00f0ur s\u00e9rstaklega me\u00f0 sj\u00e1lfseflingu einstaklinga,
  lei\u00f0togah\u00e6fni og samkennd me\u00f0 \u00fea\u00f0 a\u00f0 markmi\u00f0i
  a\u00f0 efla sj\u00e1lfstraust og ala me\u00f0 \u00feeim vir\u00f0ingu fyrir sj\u00e1lfum
  s\u00e9r, vir\u00f0ingu fyrir \u00f6\u00f0rum og umherfi s\u00ednu.\\n\\nN\u00e1msmat\\n\\nNemendur
  metnir \u00fat fr\u00e1  virkni og \u00e1huga \u00ed kennslut\u00edmum.\\n\\nART
  \u2013 l\u00edfsleikni\\n\\nAnger Replacement Training\\n\\nKennari: B\u00e6ring
  J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson\\n\\nKennslutilh\u00f6gun:\\n\\nKennslut\u00edmi
  40 m\u00edn\u00fatur\\n\\nUm er a\u00f0 r\u00e6\u00f0a samkennslu 3. \u2013 4. bekkjar\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nVi\u00f0
  lok annar geti nemandi:\\n\\nl\u00fdst me\u00f0 d\u00e6mum gildi j\u00e1kv\u00e6\u00f0ra
  l\u00edfsvi\u00f0horfa, dyg\u00f0a og gildismats fyrir eigin sj\u00e1lfsvitund,\\ngert
  s\u00e9r grein fyrir eigin styrkleikum,\\nvegi\u00f0 og meti\u00f0 \u00e1hrif fyrirmynda
  og sta\u00f0almynda,\\nl\u00fdst margv\u00edslegum tilfinningum og \u00e1tta\u00f0
  sig \u00e1 \u00e1hrifum \u00feeirra \u00e1 hugsun og heg\u00f0un,\\nmeti\u00f0 j\u00e1kv\u00e6\u00f0
  og neikv\u00e6\u00f0 \u00e1hrif \u00e1hrif \u00fdmissa \u00e1reita \u00ed umhverfinu
  \u00e1 l\u00edf hans,\\ngert s\u00e9r grein fyrir jafngildi s\u00ednu og annarra
  manna,\\nsett sig \u00ed spor annarra jafnaldra,\\nsett s\u00e9r markmi\u00f0 og
  gert \u00e1\u00e6tlanir vi\u00f0 fj\u00f6lbreytt vi\u00f0fangsefni,\\n\\nteki\u00f0
  \u00fe\u00e1tt \u00ed l\u00fd\u00f0r\u00e6\u00f0islegu samstarfi og samr\u00e6\u00f0u,\\ns\u00fdnt
  sanngirni, sj\u00e1lfstraust og vir\u00f0ingu \u00ed samskiptum og samvinnu vi\u00f0
  a\u00f0ra,\\nr\u00e6tt um eigin athafnir og aflei\u00f0ingar \u00feeirra,\\nr\u00e6tt
  reglur \u00ed samskiptum f\u00f3lks og teki\u00f0 \u00fe\u00e1tt \u00ed a\u00f0
  setja sameiginlegar leikreglur me\u00f0 \u00f6\u00f0rum,\\ns\u00fdnt t\u00edllitssemi
  og umhyggju \u00ed leik og starfi.\\n\\nKennsluh\u00e6ttir:\\n\\nLaugalandssk\u00f3li
  er ART sk\u00f3li sem \u00fe\u00fd\u00f0ir a\u00f0 allir kennarar hans hafa fari\u00f0
  \u00e1 n\u00e1mskei\u00f0 \u00ed ART \u00fej\u00e1lfun (ART \u00fe\u00fd\u00f0ir
  Aggression Replacement Training). Kennslan mi\u00f0ar a\u00f0 \u00fev\u00ed a\u00f0
  auka samskiptaf\u00e6rni nemenda, efla sj\u00e1lfstraust \u00feeirra og sj\u00e1lfsmat
  og hj\u00e1lpa \u00feeim a\u00f0 finna j\u00e1kv\u00e6\u00f0ar og uppbyggilegar
  lei\u00f0ir til a\u00f0 leysa \u00e1greining.\\n\\nKennsluefninu er skipt \u00ed
  \u00ferj\u00e1 flokka; f\u00e9lagsf\u00e6rni, rei\u00f0istj\u00f3rnun og si\u00f0fer\u00f0is\u00fej\u00e1lfun.
  Kennslan er skipul\u00f6g\u00f0 mi\u00f0a\u00f0 vi\u00f0 12 vikna n\u00e1mskei\u00f0
  \u00fear sem kennt er \u00ferisvar \u00ed viku. A\u00f0 n\u00e1mskei\u00f0i loknu
  er 1 t\u00edmi \u00e1 viku \u00ed ARTi\\n\\nKennslug\u00f6gn og n\u00e1msefni:\\n\\nMappa
  me\u00f0 hugmyndum og lei\u00f0beiningum fr\u00e1 ISART. F\u00e9lagsf\u00e6rnis\u00f6gur,
  g\u00f6gn og rit sem h\u00e6fa \u00fej\u00e1lfun f\u00e9lagsf\u00e6rni.\"", "\"Bo\u00f0skapur
  Benedikts p\u00e1fa XVI \u00e1f\u00f6stunni 2006\\n\\nEn er Jes\u00fas s\u00e1 mannfj\u00f6ldann
  kenndi hann \u00ed brj\u00f3sti um \u00fe\u00e1 (Mt 9, 36)\\n\\nK\u00e6ru br\u00e6\u00f0ur
  og systur!\\n\\n\u00c1i\u00f0runart\u00edma f\u00f6stunnar er s\u00e9rstaklega vi\u00f0
  h\u00e6fi a\u00f0 opna sig hi\u00f0 innra fyrir \u00fev\u00ed sem er uppspretta
  miskunnarinnar. \u00deetta er p\u00edlagr\u00edmsf\u00f6r og Drottinn sj\u00e1lfur
  fylgir okkur \u00e1 g\u00f6ngunni um \u00f3bygg\u00f0ina og veitir okkur kraft \u00e1
  lei\u00f0inni til hinnar miklu p\u00e1skagle\u00f0i. Gu\u00f0 verndar og styrkir
  okkur einnig \u00ed hinum \u201edimma dal\\\" sem sagt er fr\u00e1 \u00ed S\u00e1lmunum
  (23, 4) \u00feegar freistarinn hv\u00edslar a\u00f0 okkur a\u00f0 gefast upp e\u00f0a
  treysta um of \u00e1 verk handa okkar. J\u00e1, enn \u00feann dag \u00ed dag heyrir
  Drottinn hr\u00f3p hinna m\u00f6rgu sem kalla eftir gle\u00f0i, fri\u00f0i og k\u00e6rleika.
  \u00deeim finnst \u00feeir jafn yfirgefnir og \u00e1 \u00f6llum \u00f6\u00f0rum
  t\u00edmum. En Gu\u00f0 leyfir ekki a\u00f0 myrkur skelfingarinnar r\u00e1\u00f0i
  a\u00f0 fullu \u00ed heimi hr\u00e6\u00f0ilegrar eymdar, einst\u00e6\u00f0ingsskapar,
  ofbeldis og hungurs sem s\u00e6kir jafnt a\u00f0 g\u00f6mlu f\u00f3lki, fullor\u00f0num
  og b\u00f6rnum.\\n\\nEins og hinn \u00e1sts\u00e6li forveri minn J\u00f3hannes P\u00e1ll
  II skrifa\u00f0i, eru \u00ed raun og veru til \u201etakm\u00f6rk sem Gu\u00f0 setti
  hinu illa\\\", en \u00fea\u00f0 er einmitt miskunnsemi hans (\u00far b\u00f3kinni
  Identit\u00e4t und Erinnerung, s. 28 o.\u00e1fr; 74 o.\u00e1fr.). Allt \u00feetta
  var\u00f0 til \u00feess a\u00f0 \u00e9g setti or\u00f0 gu\u00f0spjallsins vi\u00f0
  upphaf \u00feessa bo\u00f0skapar. \u00cd lj\u00f3si hans vil \u00e9g stansa vi\u00f0
  margr\u00e6dda spurningu okkar t\u00edma, spurninguna um \u00fer\u00f3unina.\\n\\nEnn
  \u00ed dag hr\u00e6rist Jes\u00fas til me\u00f0aumkunar og horfir til manna og \u00fej\u00f3\u00f0a.
  Hann horfir til \u00feeirra \u00ed lj\u00f3si \u00feess a\u00f0 hin gu\u00f0d\u00f3mlega
  \u201e\u00e1\u00e6tlun\\\" kallar \u00fe\u00e1 til hj\u00e1lpr\u00e6\u00f0is. Jes\u00fas
  \u00feekkir \u00fe\u00e6r hindranir sem standa \u00ed vegi fyrir \u00feessari \u00e1\u00e6tlun
  og kennir \u00ed brj\u00f3sti um marga: Hann er \u00feess fullkomlega rei\u00f0ub\u00fainn
  a\u00f0 vernda \u00fe\u00e1 fyrir \u00falfunum, jafnvel \u00fe\u00f3 a\u00f0 \u00fea\u00f0
  kosti hann sj\u00e1lfan l\u00edfi\u00f0. \u00deannig \u201ehorfir\\\" Jes\u00fas
  til einstaklinga jafnt sem fj\u00f6ldans og f\u00e6rir \u00fe\u00e1 alla \u00ed
  umsj\u00e1 F\u00f6\u00f0urins me\u00f0 \u00fev\u00ed a\u00f0 f\u00f3rna sj\u00e1lfum
  s\u00e9r sem fri\u00f0\u00fe\u00e6gingarf\u00f3rn.\\n\\nKirkjan er uppl\u00fdst
  af \u00feessum sannleika p\u00e1skanna og h\u00fan veit a\u00f0 ef vi\u00f0 \u00e6tlum
  a\u00f0 n\u00e1 fullum \u00feroska ver\u00f0um vi\u00f0 a\u00f0 \u201ehorfa\\\"
  eins og Jes\u00fas ger\u00f0i. Svari\u00f0 vi\u00f0 efnislegum og f\u00e9lagslegum
  \u00fe\u00f6rfum mannsins er nefnilega alls ekki h\u00e6gt a\u00f0 skilja fr\u00e1
  fulln\u00e6gingu d\u00fdpstu \u00fer\u00e1r hjarta hans. \u00dev\u00ed fremur ber
  a\u00f0\\n\\nleggja mikla \u00e1herslu \u00e1 \u00feetta \u00e1 okkar t\u00edmum
  \u00fev\u00ed \u00e1kafar sem vi\u00f0 skynjum lifandi og \u00f3umfl\u00fdjanlega
  \u00e1byrg\u00f0 okkar gagnvart hinum f\u00e1t\u00e6ku \u00ed heiminum. Hinn vir\u00f0ulegi
  forveri minn P\u00e1ll p\u00e1fi VI l\u00fdsti skortinum \u00e1 \u00fer\u00f3un
  og illum aflei\u00f0ingum hans \u00e1 \u00feann h\u00e1tt a\u00f0 hann s\u00fdndi
  v\u00f6ntun \u00e1 mannlegum tilfinningum. \u00cd lj\u00f3si \u00feessa ford\u00e6mdi
  hann \u00ed umbur\u00f0arbr\u00e9fi s\u00ednu Populorum Progressio: \u201eefnislega
  ney\u00f0 \u00feeirra\u00a0 sem skortir grundvallarl\u00edfsg\u00e6\u00f0i; ...
  si\u00f0fer\u00f0ilega ney\u00f0 \u00feeirra sem eru helteknir af eigingirni; ...
  \u00fea\u00f0 ofbeldi sem \u00e1 uppruna sinn \u00ed misneytingu eignarr\u00e9ttar
  e\u00f0a valds og birtist \u00ed ar\u00f0r\u00e1ni verkaf\u00f3lks og \u00f3r\u00e9ttm\u00e6tum
  vi\u00f0skiptah\u00e1ttum\\\" (nr. 21). M\u00f3teitur vi\u00f0 \u00feessari meinsemd
  taldi P\u00e1ll p\u00e1fi VI ekki a\u00f0eins vera \u201egreinarg\u00f3\u00f0a \u00feekkingu
  um gildi mannsins, tilliti\u00f0 til anda f\u00e1t\u00e6ktarinnar, samvinnu \u00f6llum
  til heilla, fri\u00f0arvilja\\\", heldur l\u00edka \u201evi\u00f0urkenningu hinstu
  gilda af mannsins h\u00e1lfu og vi\u00f0urkenningu Gu\u00f0s, uppsprettu hans og
  markmi\u00f0s\\\" (s.st.). Me\u00f0 hli\u00f0sj\u00f3n af \u00feessu hika\u00f0i
  p\u00e1fi ekki vi\u00f0 a\u00f0 fullvissa okkur um mikilv\u00e6gi \u201etr\u00faarinnar
  fyrst og fremst\\\". \u201eGu\u00f0s gj\u00f6f, me\u00f0tekin fyrir g\u00f3\u00f0an
  vilja mannsins og einingin \u00ed k\u00e6rleika Krists\\\" (s.st.). \u201e\u00c1s\u00fdnd\\\"
  Jes\u00fa b\u00fd\u00f0ur okkur \u00fev\u00ed \u00e1 leggja \u00e1herslu \u00e1
  hi\u00f0 sanna inntak \u00feeirrar \u201emanngildisstefnu \u00ed fullum skilningi
  or\u00f0sins\\\", sem \u2013 og enn og aftur me\u00f0 or\u00f0um P\u00e1ls p\u00e1fa
  VI \u2013 \u00e1 r\u00e6tur \u00ed \u201ev\u00ed\u00f0t\u00e6kri \u00fer\u00f3un
  alls mannsins og alls mannkynsins\\\" (s.st. nr. 42). \u00dev\u00ed er \u00fea\u00f0
  ekki helsta verkefni kirkjunnar var\u00f0andi \u00fer\u00f3un mannsins og \u00fej\u00f3\u00f0anna
  a\u00f0 \u00fatvega efnisleg g\u00e6\u00f0i e\u00f0a f\u00e6ra fram t\u00e6knilegar
  \u00farlausnir, heldur a\u00f0 bo\u00f0a sannleika Krists sem vekur samviskuna og
  styrkir vir\u00f0ingu mannsins, l\u00edkt og vinnan gerir, og sty\u00f0ja einnig
  \u00fe\u00e1 menningu sem svarar \u00f6llum spurningum mannsins.\\n\\nAndsp\u00e6nis
  \u00feeim skelfilegu raunum f\u00e1t\u00e6ktarinnar sem hrj\u00e1 marga menn er
  blinda eigin s\u00edngirni \u00ed \u00f3b\u00e6rilegri m\u00f3ts\u00f6gn vi\u00f0
  \u201e\u00e1s\u00fdnd\\\" Krists. F\u00f6stur \u00fe\u00e6r og \u00f6lmusugjafir
  sem kirkjan m\u00e6lir s\u00e9rstaklega me\u00f0 \u00e1 f\u00f6stunni \u00e1samt
  b\u00e6ninni, bj\u00f3\u00f0a hentugt t\u00e6kif\u00e6ri til a\u00f0 sameinast \u201e\u00e1s\u00fdnd\\\"
  Krists. Ford\u00e6mi hinna heil\u00f6gu og margv\u00edsleg reynsla \u00far bo\u00f0unarstarfinu
  sem einkennt hafa s\u00f6gu kirkjunnar eru d\u00fdrm\u00e6t tilv\u00edsun til \u00feess
  hvers konar \u00fer\u00f3un ber a\u00f0 stu\u00f0la a\u00f0. Og enn \u00e1 okkar
  d\u00f6gum, \u00feegar allt er hva\u00f0 \u00f6\u00f0ru h\u00e1\u00f0 \u00ed heiminum,
  sj\u00e1um vi\u00f0 a\u00f0 engin efnahagsleg, f\u00e9lagsleg e\u00f0a p\u00f3lit\u00edsk
  \u00e1\u00e6tlun getur komi\u00f0 \u00ed sta\u00f0 \u00feeirrar sj\u00e1lfsf\u00f3rnar
  fyrir a\u00f0ra sem birtist \u00ed k\u00e6rleikanum. S\u00e1 sem starfar \u00ed
  anda \u00feessarar r\u00f6khyggju fagna\u00f0arerindisins, lifir tr\u00fana sem
  vin\u00e1ttu vi\u00f0 Gu\u00f0 sem var\u00f0 ma\u00f0ur og tekur a\u00f0 s\u00e9r
  \u2013 l\u00edkt og Hann \u2013 og hugar a\u00f0 ney\u00f0 n\u00e1unga s\u00edns.
  Hann l\u00edtur \u00e1 hann sem \u00f3m\u00e6lanlegan leyndard\u00f3m sem krefst
  takmarkalausrar umhyggju og athygli. Hann veit a\u00f0 s\u00e1 sem ekki gefur Gu\u00f0
  gefur of l\u00edti\u00f0 \u2013 l\u00edkt og hin s\u00e6la M\u00f3\u00f0ir Teresa
  fr\u00e1 Kalk\u00fatta sag\u00f0i: \u201eMesta f\u00e1t\u00e6kt \u00fej\u00f3\u00f0anna
  felst \u00ed \u00fev\u00ed a\u00f0 \u00fe\u00e6r \u00feekkja ekki Krist.\\\" \u00dev\u00ed
  skiptir \u00f6llu a\u00f0 finna Gu\u00f0 \u00ed miskunnsamri \u00e1s\u00fdnd Krists;
  \u00e1n \u00feessa tillits hv\u00edlir samf\u00e9lag \u00fej\u00f3\u00f0anna ekki
  \u00e1 traustum grundvelli.\\n\\nMargs kyns k\u00e6rleiksr\u00edk miskunnarverk
  hafa karlar og konur unni\u00f0 \u00ed kirkjunni fyrir traust sitt \u00e1 Heil\u00f6gum
  anda. \u00deetta f\u00f3lk hefur reist sj\u00fakrah\u00fas, stofna\u00f0 h\u00e1sk\u00f3la,
  verkmenntask\u00f3la e\u00f0a l\u00edtil fyrirt\u00e6ki. \u00deau stofnsettu \u00feessi
  fyrirt\u00e6ki \u00fev\u00ed \u00feau h\u00f6f\u00f0u or\u00f0i\u00f0 fyrir \u00e1hrifum
  af fagna\u00f0arerindinu: L\u00f6ngu \u00e1 undan \u00f6\u00f0rum h\u00f3pum \u00fej\u00f3\u00f0f\u00e9lagsins
  f\u00e6r\u00f0u \u00feau s\u00f6nnur \u00e1 a\u00f0 \u00feau b\u00e1ru hag annarra
  raunverulega fyrir brj\u00f3sti. \u00deetta frumkv\u00e6\u00f0i v\u00edsar enn \u00ed
  dag lei\u00f0ina sem g\u00e6ti var\u00f0a\u00f0 allan heiminn og snertir alla menn
  \u00feannig a\u00f0 varanlegur fri\u00f0ur n\u00e1ist. Jes\u00fas kenndi \u00ed
  brj\u00f3sti um marga og \u00e1 sama h\u00e1tt telur kirkjan \u00fea\u00f0 enn \u00ed
  dag vera sitt helsta verkefni a\u00f0 bi\u00f0ja \u00fe\u00e1 sem \u00e1byrg\u00f0
  bera \u00ed stj\u00f3rnm\u00e1lum, efnahagsl\u00edfi og fj\u00e1rm\u00e1lum, a\u00f0
  stu\u00f0la a\u00f0 \u00fer\u00f3un sem vir\u00f0ir gildi s\u00e9rhvers manns. S\u00e9rstakur
  pr\u00f3fsteinn\\n\\n3\\n\\n\u00feessarar vi\u00f0leitni birtist \u00ed raunverulegu
  tr\u00fafrelsi \u2013 ekki a\u00f0eins hva\u00f0 \u00fea\u00f0 snertir a\u00f0 geta
  bo\u00f0a\u00f0 og tigna\u00f0 leyndard\u00f3m Krists, heldur einnig sem frelsi
  til a\u00f0 m\u00f3ta heim sem einkennist af n\u00e1ungak\u00e6rleika. \u00dea\u00f0
  sty\u00f0ur \u00feessa vi\u00f0leitni ef menn vir\u00f0a \u00fea\u00f0 meginhlutverk
  sem raunveruleg tr\u00faarleg gildi hafa \u00ed l\u00edfi mannsins, \u00feegar r\u00e6tt
  er um sv\u00f6r vi\u00f0 hinstu spurningunum og um si\u00f0fer\u00f0ilega \u00e1byrg\u00f0,
  b\u00e6\u00f0i pers\u00f3nulega og f\u00e9lagslega. Me\u00f0 hli\u00f0sj\u00f3n
  af \u00feessum au\u00f0kennum l\u00e6ra kristnir menn einnig a\u00f0 meta \u00e1\u00e6tlanir
  r\u00edkisstj\u00f3rna \u00e1 skynsamlegan h\u00e1tt.\\n\\nVi\u00f0 getum ekki liti\u00f0
  framhj\u00e1 \u00feeim mist\u00f6kum sem margir \u00feeirra sem hafa kalla\u00f0
  sig l\u00e6risveina Jes\u00fa hafa gert \u00ed aldanna r\u00e1s. \u00deeir \u00e1ttu
  vi\u00f0 mikil vandam\u00e1l a\u00f0 etja og t\u00f6ldu \u00f3sjaldan a\u00f0 \u00feeir
  yr\u00f0u fyrst a\u00f0 b\u00e6ta j\u00f6r\u00f0ina og s\u00ed\u00f0an a\u00f0 hugsa
  til himinsins. \u00deeir freistu\u00f0ust til \u00feess \u00ed lj\u00f3si \u00fevingandi
  a\u00f0st\u00e6\u00f0na a\u00f0 \u00e1l\u00edta a\u00f0 fyrst yr\u00f0i a\u00f0
  breyta ytri uppbyggingunni. \u00deess vegna var\u00f0 kristind\u00f3murinn \u00ed
  augum margra a\u00f0 si\u00f0fer\u00f0isstefnu og a\u00f0ger\u00f0ir komu \u00ed
  sta\u00f0 tr\u00faarinnar. Me\u00f0 r\u00e9ttu segir \u00e6ruver\u00f0ugur forveri
  minn J\u00f3hannes P\u00e1ll II.: \u201eN\u00fa \u00e1 t\u00edmum felst freistingin
  \u00ed \u00fev\u00ed a\u00f0 gera kristind\u00f3minn algj\u00f6rlega h\u00e1\u00f0an
  mannlegri visku, nokkurs konar fr\u00e6\u00f0i um hvernig gott l\u00edf \u00e1 a\u00f0
  vera. \u00cd heimi sem einkennist mj\u00f6g af hinu veraldlega hefur ,hj\u00e1lpr\u00e6\u00f0i\u00f0
  sm\u00e1m saman fengi\u00f0 \u00e1 sig veraldlegan bl\u00e6'', sem menn berjast
  a\u00f0 v\u00edsu fyrir manninum til heilla, en \u00feeim manni sem er a\u00f0eins
  h\u00e1lfur og takmarkast vi\u00f0 l\u00e1r\u00e9tt svi\u00f0. Vi\u00f0 vitum hinsvegar
  a\u00f0 Jes\u00fas kom til a\u00f0 f\u00e6ra umfangsmiki\u00f0 hj\u00e1lpr\u00e6\u00f0i\\\"
  (Umbur\u00f0arbr\u00e9fi\u00f0 Redemptoris missio, 11).\\n\\nF\u00f6stut\u00edmanum
  er einmitt \u00e6tla\u00f0 a\u00f0 lei\u00f0a okkur til \u00feessa alltumlykjandi
  hj\u00e1lpr\u00e6\u00f0is, \u00ed lj\u00f3si sigurs Krists yfir \u00f6llu \u00fev\u00ed
  illa sem hv\u00edlir \u00e1 m\u00f6nnunum. \u00deegar vi\u00f0 sn\u00faum okkur
  til hins gu\u00f0d\u00f3mlega fr\u00e6\u00f0ara, \u00feegar vi\u00f0 gefumst honum
  \u00e1 h\u00f6nd og \u00feegar vi\u00f0 \u00f6\u00f0lumst miskunnsemi hans \u00ed
  s\u00e1ttasakramentinu, sj\u00e1um vi\u00f0 \u201eauglit\\\" hans, sem horfir dj\u00fapt
  \u00ed s\u00e1l okkar og rannsakar hana. Hann getur hj\u00e1lpa\u00f0 m\u00f6rgum
  og s\u00e9rhverju okkar til a\u00f0 r\u00edsa upp \u00e1 n\u00fd. Hann veitir \u00f6llum
  \u00feeim sem ekki velkjast \u00ed vafa n\u00fdtt tr\u00fana\u00f0artraust og l\u00e6tur
  \u00fe\u00e1 sj\u00e1 lj\u00f3sblik eil\u00edfrar s\u00e6lu. Jafnvel \u00fe\u00f3
  a\u00f0 hatur vir\u00f0ist r\u00edkja \u00fe\u00e1 l\u00e6tur Drottinn samt ekki,
  jafnvel \u00e1 okkar t\u00edmaskei\u00f0i, neitt skorta \u00e1 l\u00fdsandi vitni
  um k\u00e6rleika hans. \u00c9g fel Mar\u00edu, \u201elifandi uppsprettu vonarinnar\\\"
  (Dante Allighieri, Paradiso, XXXIII, 12), veg okkar \u00e1 f\u00f6stunni, a\u00f0
  h\u00fan lei\u00f0i okkur til Sonar s\u00edns. \u00c9g fel henni s\u00e9rstaklega
  \u00fe\u00e1 m\u00f6rgu sem enn \u00feola f\u00e1t\u00e6kt og kalla eftir hj\u00e1lp,
  stu\u00f0ningi og skilningi. Me\u00f0 \u00feessum or\u00f0um veiti \u00e9g \u00f6llum
  s\u00e9rstaka postullega blessun m\u00edna.\\n\\nVat\u00edkaninu, 29. september
  2005\\n\\nBENEDICTUS PP. XVI\\n\\nCopyright \u00a9 Dicastero per la Comunicazione
  - Libreria Editrice Vaticana\"", "\"SK\u00ddRINGAR\\n\\nGrafa skal \u00ed ymri sokk\u00fam
  ni\u00f0ur \u00e1 k\u00f6ldp. Allt l\u00edf\u00e6rt efni skal f\u00e6rast \u00far
  grunni.\\n\\nFyrirgrunni og umhverfis sokk\u00far skal vera frastatt efni, hlj\u00f3\u00f0a
  80 m/s, h\u00e6\u00f0 300 m. \u00de\u00f3ttur og \u00fear\u00f0i\\n\\nFull\u00feyngdini
  og \u00feyngdu skal myndu \u00ed kviku JST-15.\\n\\nAlmennsver\u00f0ur: Me\u00f0in
  veitum \u00e1\u00f0ur fr\u00e1 sokk\u00fam er 0/08 M/Mn/2.\\n\\nJ\u00f6rmundini
  borgi\u00f0u og sokk\u00far s\u00e9 K10c/300\\n\\nEfni og ne\u00f0st \u00ed sokk\u00falinni
  2K12\\n\\nSleypugasi C-25\\n\\nAllar festingar skulu vera hellg\u00e1v\u00e1n\u00fa\u00f0dar.\"",
  "\"Nafn nemanda h\u00e9r: Skema fyrir ins\u00fal\u00edngjafir/fj\u00f6lda b\u00f3lusa\\n\\nH\u00c1R
  BL\u00d3\u00d0SYKUR (>12 og upp\u00far) \u2013 EINKENNI\\n\\nMj\u00f6g \u00feyrst,
  \u00fearf a\u00f0 pissa oft, syfja, \u00fereyta, pirru\u00f0, skapstygg, eir\u00f0arlaus,
  talar miki\u00f0! M\u00e6la bl\u00f3\u00f0sykur og lei\u00f0r\u00e9tta/gefa b\u00f3lus
  skv. skema h\u00e9r a\u00f0 ofan, og gefa vatn a\u00f0 drekka\\n\\nL\u00c1GUR BL\u00d3\u00d0SYKUR
  \u2013 EINKENNI: Orkulaus, f\u00f6l, kaldur sviti, vill ekki hreyfa sig, brosir
  ekki. Ver\u00f0ur slj\u00f3 og me\u00f0vitundarl\u00edtil ef mj\u00f6g l\u00e1g!\\n\\nEf
  bl\u00f3\u00f0sykur m\u00e6list 2-3 ! gefa safa og s\u00ed\u00f0an brau\u00f0snei\u00f0
  nokkru s\u00ed\u00f0ar\\n\\nEf bl\u00f3\u00f0sykur m\u00e6list 3-4 gefa safa e\u00f0a
  banana e\u00f0a brau\u00f0snei\u00f0\\n\\nAthugi\u00f0 \u00fe\u00f3: Ef Matthildur
  m\u00e6list 3-4 en matur er kominn \u00e1 bor\u00f0i\u00f0 og henni l\u00ed\u00f0ur
  greinilega vel \u00fearf ekki a\u00f0 gefa heilan safa e\u00f0a heilan banana: glas
  af safa e\u00f0a h\u00e1lfur banani/h\u00e1lf brau\u00f0snei\u00f0 v\u00e6ri gott\\n\\n\u00cd\u00fer\u00f3ttir:\\n\\nMikilv\u00e6gt
  a\u00f0 bl\u00f3\u00f0sykur s\u00e9 ekki l\u00e6gri en u.\u00fe.b. 7\u20138 fyrir
  hreyfingu - g\u00e6ti \u00feurft safa/banana\\n\\nEf fari\u00f0 er \u00ed g\u00f6ngufer\u00f0ir
