  lesturs, hlustunar og leitarn\u00e1ms.  N\u00fdtt rafr\u00e6nt n\u00e1msefni \u00e1
  einf\u00f6ldu formi til stu\u00f0nings vi\u00f0 vinnut\u00e6kni og vinnulag.  Beitt
  undirst\u00f6\u00f0uatri\u00f0um \u00ed fingrasetningum.\\nUppl\u00fdsinga\u00f6flun
  og \u00farvinnsla - Leita\u00f0 uppl\u00fdsinga og n\u00fdtt vi\u00f0 verkefnavinnu.  N\u00fdtt
  rafr\u00e6nt og gagnvirkt n\u00e1msefni.  N\u00fdtt uppl\u00fdsingat\u00e6kni og
  forrit vi\u00f0 uppbyggingu einfaldra verkefna.  N\u00fdtt hugb\u00fana\u00f0/forrit
  vi\u00f0 framsetningu \u00e1 einf\u00f6ldum t\u00f6lulegum g\u00f6gnum.\\nT\u00e6kni
  og b\u00fana\u00f0ur - Nota\u00f0 hugb\u00fana\u00f0/forrit vi\u00f0 einf\u00f6ld
  ritunarverkefni og framsetningu t\u00f6lulegra gagna, og nota\u00f0 einfaldan hugb\u00fana\u00f0/
  forrit vi\u00f0 myndvinnslu.\\nSk\u00f6pun og mi\u00f0lun - Nota\u00f0 hugb\u00fana\u00f0/forrit
