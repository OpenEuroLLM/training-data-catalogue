  meti\u00f0 og greint \u00e1rei\u00f0anleika uppl\u00fdsinga og h\u00e6fni til a\u00f0
  taka sj\u00e1lfst\u00e6\u00f0ar \u00e1kvar\u00f0anir sem stu\u00f0la a\u00f0 heilsu
  og vell\u00ed\u00f0an.\\nSj\u00e1lfb\u00e6rni: Nemendur geti teki\u00f0 uppl\u00fdstar
  \u00e1kvar\u00f0anir um matv\u00f6rur og geti teki\u00f0 mi\u00f0 af umhverfissj\u00f3narmi\u00f0um
  s.s. matars\u00f3un, \u00fargangur matar o.s.frv.\\nJafnr\u00e9tti: Allir f\u00e1i
  t\u00e6kif\u00e6ri til a\u00f0 matrei\u00f0a og \u00fer\u00edfa.\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi: Nemendur komi sj\u00e1lfir me\u00f0 hugmyndir a\u00f0 \u00fev\u00ed
  hva\u00f0 eigi a\u00f0 matrei\u00f0a. Hafi \u00e1hrif \u00e1 h\u00f3paskiptingar
  og l\u00e6ri a\u00f0 koma fram vi\u00f0 samnemendur a\u00f0 vir\u00f0ingu og kurteisi.\\nHeilbrig\u00f0i
  og velfer\u00f0: \u00c1tti sig \u00e1 mikilv\u00e6gi heilbrig\u00f0s l\u00edfernis
  \u00ed gegnum mat.\\nSk\u00f6pun: Geti \u00fer\u00f3a\u00f0 og hanna\u00f0 s\u00ednar
  eigin uppskriftir, breytt uppskriftum o.s.frv.\\n\\nN\u00e1msmat\\n\\nN\u00e1msmatsvi\u00f0mi\u00f0
