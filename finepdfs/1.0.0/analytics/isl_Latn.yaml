  73\\n\\nFer\u00f0a\u00fej\u00f3nustan hefur vaxandi v\u00e6gi \u00ed \u00fej\u00f3\u00f0arb\u00faskap
  \u00cdslendinga. Heils\u00e1rsst\u00f6rf eru talin riflega 4 \u00fe\u00fasund og
  falla til \u00ed \u00f6llum bygg\u00f0arl\u00f6gum landsins. Gjaldeyristekjurnar
  voru 18,7 milljar\u00f0ar kr. \u00e1 s\u00ed\u00f0asta \u00e1ri. Erlendum fer\u00f0am\u00f6nnum
  fer fj\u00f6lgandi og vi\u00f0 erum a\u00f0 n\u00e1 betri t\u00f6kum \u00e1 \u00fdmsum
  sto\u00f0greinum fer\u00f0a\u00fej\u00f3nustunnar en \u00e1\u00f0ur.\\n\\nVi\u00f0
  viljum setja okkur \u00fea\u00f0 markmi\u00f0, a\u00f0 \u00cdslendingar gegni forystuhlutverki
  \u00e1 svi\u00f0i umhverfisverndar og a\u00f0 fer\u00f0a\u00fej\u00f3nustan s\u00e9
  rekin \u00ed anda sj\u00e1lfb\u00e6rrar pr\u00f3unar, \u00ed s\u00e1tt vi\u00f0
  land og \u00fej\u00f3\u00f0.\\n\\n\u00c1 s\u00ed\u00f0ast li\u00f0nu hausti skipa\u00f0i
  \u00e9g st\u00fdrih\u00f3p til \u00feess a\u00f0 marka stefnu stj\u00f3rnavalda
  \u00ed fer\u00f0am\u00e1lu. \u00c9g taldi \u00fea\u00f0 nau\u00f0synlegt vegna mikilv\u00e6gis
  greinarinnar og \u00feeirra miklu vaxtam\u00f6guleika, sem \u00ed henni eru og henni
  tengjast. Ni\u00f0urst\u00f6\u00f0an liggur h\u00e9r fyrir, hinn ytri rammi stefnum\u00f3tunarinnar.
  N\u00fa ver\u00f0ur hafist handa um \u00farvinnslu einstakra \u00fe\u00e1tta, sem
  sn\u00faa a\u00f0 innvi\u00f0um greinarinnar.\\n\\n\u00c9g \u00feakka \u00f6llum
  \u00feeim, sem komi\u00f0 hafa a\u00f0 stefnum\u00f3tun \u00feessari, vel unni\u00f0
  verk, st\u00fdrih\u00f3pnum og starfsmanni hans, starfsm\u00f6nnum Hagvangs, vinnuh\u00f3punum
  og hinum mikla fj\u00f6lda einstaklinga, sem leita\u00f0 var til og allir brug\u00f0ust
  vel vi\u00f0.\\n\\n\u00c9g vona, a\u00f0 stefnum\u00f3tunin megi vel n\u00fdtast
  og geti or\u00f0i\u00f0 til lei\u00f0beiningar og hvatningar \u00ed m\u00e1lefnum
  fer\u00f0a\u00fej\u00f3nustunnar.\\n\\nHalld\u00f3r Bl\u00f6ndal\\nSamg\u00f6ngur\u00e1\u00f0herra\\n\\n1.1
  Skipan og starf nefndarinnar\\n\\n\u00c1 undanf\u00f6rnum \u00e1rum hefur veri\u00f0
  mikil umr\u00e6\u00f0a um nau\u00f0syn \u00feess a\u00f0 stj\u00f3rnv\u00f6ld marki
  s\u00e9r stefnu \u00ed fer\u00f0abj\u00f3nustu. Atvinnugreinin hefur st\u00f6\u00f0ugt
  or\u00f0i\u00f0 mikilv\u00e6gar \u00ed \u00fej\u00f3\u00f0arb\u00faskapnum og \u00fev\u00ed
  tali\u00f0 e\u00f0lilegt a\u00f0 stj\u00f3rnv\u00f6ld marki stefnu um \u00e1 hvern
  h\u00e1tt \u00feau komi a\u00f0 og tryggi \u00e1framhaldandi ar\u00f0 af atvinnugreininni.\\n\\nH\u00e9r
  \u00e1 landi er ekki ha\u00f0t a\u00f0 segja a\u00f0 opinber fer\u00f0am\u00e1lastefna
  hafi veri\u00f0 m\u00f3tu\u00f0. \u00de\u00f3 hafa veri\u00f0 unnar a.m.k. \u00ferj\u00e1r
  till\u00f6gur a\u00f0 fer\u00f0am\u00e1lastefnu \u00e1 vegum stj\u00f3rnavalda \u00e1
  sl. tuttugu \u00e1rum A\u00f0 frumkv\u00e6\u00f0i Fer\u00f0am\u00e1lar\u00e1\u00f0s
  og me\u00f0 fj\u00e1rstyrk \u00far \u00der\u00f3unarsj\u00f3\u00f0i Sameinu\u00f0u
  \u00fej\u00f3\u00f0anna vann bandar\u00edskt fyrirt\u00e6ki, Checchi & Co, a\u00f0
  till\u00f6gum um fer\u00f0am\u00e1lastefnu \u00e1 \u00e1runum 1972-1975. \u00de\u00e6r
  till\u00f6gur komu ekki til framkv\u00e6mda.\\n\\n\u00c1ri\u00f0 1981 skipu\u00f0i
  \u00fe\u00e1verandi samg\u00f6ngur\u00e1\u00f0herra nefnd \u201etil a\u00f0 gera
  \u00fattekt \u00e1 \u00fej\u00f3\u00f0hagslegri \u00fe\u00fd\u00f0ingu \u00edslenskrar
  fer\u00f0amannapj\u00f3nustu og sp\u00e1 um \u00fer\u00f3un hennar \u00e1 n\u00e6stu
  \u00e1rum.\u201d S\u00fa nefnd skila\u00f0i ni\u00f0urst\u00f6\u00f0um \u00ed apr\u00edl
  1983 \u00ed sk\u00fdrslu, sem bar heiti\u00f0 \u201e\u00dej\u00f3\u00f0hagsleg \u00fe\u00fd\u00f0ing,
  sp\u00e1 um \u00fer\u00f3un til 1992, till\u00f6gur um fer\u00f0am\u00e1lastefnu.\u201d
  Till\u00f6gur umr\u00e6ddrar nefndar voru ekki lag\u00f0ar fram af h\u00e1lfu stj\u00f3rnavalda
  sem opinber stefna.\\n\\n\u00c1ri\u00f0 1989 var skipu\u00f0 nefnd af \u00fe\u00e1verandi
  samg\u00f6ngur\u00e1\u00f0herra. S\u00fa nefnd skila\u00f0i \u00e1ri\u00f0 1990
  till\u00f6gum a\u00f0 fer\u00f0am\u00e1lastefnu, sem voru lag\u00f0ar fyrir Al\u00feingi
  \u00ed formi \u00feings\u00e1lyktunartill\u00f6gu. S\u00fa \u00feings\u00e1lyktun
  f\u00e9kk ekki afgrei\u00f0slu \u00e1 \u00feingi.\\n\\n\u00c1ri\u00f0 1993 sampykktti
  Fer\u00f0am\u00e1lar\u00e1\u00f0 \u00cdslands \u201eStefnum\u00f3tun \u00ed marka\u00f0sm\u00e1lum
  til 2000\u201d og \u201eStefnum\u00f3tun \u00ed umhverfism\u00e1lum.\u201d \u00cd
  starfi r\u00e1\u00f0sins hefur veri\u00f0 stu\u00f0st vi\u00f0 \u00fe\u00e6r l\u00ednur
  sem \u00fear voru lag\u00f0ar \u00ed \u00feessum tveim p\u00e1ttum fer\u00f0abj\u00f3nustunnar.\\n\\nSamg\u00f6ngur\u00e1\u00f0herra,
  Halld\u00f3r Bl\u00f6ndal, skipu\u00f0i st\u00fdrih\u00f3p 17. okt\u00f3ber 1995
  til a\u00f0 gera till\u00f6gur a\u00f0 stefnum\u00f6rkun stj\u00f3rnavalda \u00ed
  fer\u00f0abj\u00f3nustu.\\n\\n\u00cd st\u00fdrih\u00f3pinn voru skipu\u00f0:\\nMagn\u00fas
  Oddsson, fer\u00f0am\u00e1lastj\u00f3ri, forma\u00f0ur\\n\u00c1rmann Kr. \u00d3lafsson,
  a\u00f0sto\u00f0arma\u00f0ur samg\u00f6ngur\u00e1\u00f0herra\\nHildur J\u00f3nsd\u00f3ttir,
  fer\u00f0ar\u00e1\u00f0gjafi\\nMagn\u00fas Gunnarsson, framkv\u00e6mdastj\u00f3ri\\n\u00d3lafur
  \u00d6rn Haraldsson, alpingisma\u00f0ur\\nP\u00e9tur J. Eir\u00edksson, framkv\u00e6mdastj\u00f3ri\\nT\u00f3mas
  Ingi Olrich, alpingisma\u00f0ur\\nValt\u00fdr Sigurbjarnarson, forst\u00f6\u00f0uma\u00f0ur.\\n\\nSt\u00fdrih\u00f3purinn
  \u00e1kva\u00f0 a\u00f0 r\u00e1\u00f0a starfsmann \u00ed fullt starf til a\u00f0
  vinna a\u00f0 verkinu.\\nBjarnhei\u00f0ur Hallsd\u00f3ttir fer\u00f0am\u00e1lafr\u00e6\u00f0ingur
  var r\u00e1\u00f0in starfsma\u00f0ur st\u00fdrih\u00f3psins fr\u00e1 1. n\u00f3vember
  1995.\\n\\nP\u00e1 var ger\u00f0ur samningur vi\u00f0 Hagvang hf. um faglega vinnu
  vi\u00f0 ger\u00f0 stefnum\u00f3tunarinnar. Af h\u00e1lfu Hagvangs hafa unnni\u00f0
  vi\u00f0 verki\u00f0 Reynir Kristinsson framkv\u00e6mdastj\u00f3ri, Krist\u00f3fer
  Oliversson skipulagsfr\u00e6\u00f0ingur og Ger\u00f0ur R\u00edkhar\u00f0sd\u00f3ttir
  rekrstrarhagfr\u00e6\u00f0ingur.\\n\\nSt\u00fdrih\u00f3purinn r\u00e9\u00f0 starfsf\u00f3lk
  til a\u00f0 vinna a\u00f0 ger\u00f0 tillagna \u00ed einst\u00f6ku m\u00e1laflokkum
  og \u00fea\u00f0 f\u00f3lk leita\u00f0i s\u00ed\u00f0an a\u00f0sto\u00f0ar fj\u00f6lmargra
  vi\u00f0 s\u00edna gagnas\u00f6fnun og till\u00f6guger\u00f0. V\u00edsad er til
  vi\u00f0m\u00e6lendalistu \u00ed lok \u00feessarar sk\u00fdrslu. \u00cd lokatill\u00f6gum
  st\u00fdrinefndar er e\u00f0ilega ekki nema hluti \u00feeirra gagna, sem unnin voru
  fyrir nefndina, en \u00feau eru skr\u00e1\u00f0 sem undirg\u00f6gn. P\u00e1 er einnig
  v\u00edsad til gagna, sem unnin voru \u00e1 s\u00ed\u00f0asta \u00e1ri af nefndum
  \u00e1 vegum samg\u00f6ngur\u00e1\u00f0herra um einst\u00f6k m\u00e1lefni atvinnugreinarinnar.\\n\\nEftirtaldir
  unnu a\u00f0 gagnas\u00f6fnun og till\u00f6guger\u00f0 au\u00f0 starfsmanna nefndarinnar:\\n\\nAnna
  Margr\u00e9t Gu\u00f0j\u00f3nsd\u00f3ttir  Fer\u00f0am\u00e1laufulltr\u00fai Reykjav\u00edkur\\nBaldvin
  Baldvinsson  B\u00f3ndi\\nErna Hauksd\u00f3ttir  Framkv\u00e6mdastj\u00f3ri\\nKarl
  Sigurhjartarson  Framkv\u00e6mdastj\u00f3ri\\nKristj\u00e1n P\u00e1lsson  Al\u00feingisma\u00f0ur\\nMar\u00eda
  H. Maack  Verkefnisstj\u00f3ri\\nP\u00e9tur Rafnsson  Framkv\u00e6mdastj\u00f3ri\\nR\u00f6gnvaldur
  Gu\u00f0mundsson  Fer\u00f0am\u00e1laufulltr\u00fai Hafnarfjar\u00f0ar\\nSigri\u00f0ur
  Pr\u00fa\u00f0ur Stef\u00e1nsd\u00f3ttir  Fer\u00f0am\u00e1lafr\u00e6\u00f0ingur\\nSigurborg
  Hannesd\u00f3ttir  Fer\u00f0am\u00e1lafr\u00e6\u00f0ingur\\nSigur\u00f0ur J\u00f3nsson  Byggingafulltr\u00fai\\nValgar\u00f0ur
  Egilsson  L\u00e6kningar\\nP\u00f3r\u00f0\u00eds Eir\u00edksd\u00f3ttir  A\u00f0sto\u00f0arframkv\u00e6mdastj\u00f3ri\\nP\u00f3rhallur
  J\u00f3seppson  Bla\u00f0ama\u00f0ur\\n\u00deorsteinn Gunnarsson  Rektor H\u00e1sk\u00f3lans
  \u00e1 Akureyri\\n\\nKaflinn um g\u00e6\u00f0astj\u00f3rnum var saminn \u00ed samvinnu
  vi\u00f0 fer\u00f0am\u00e1lah\u00f3p G\u00e6\u00f0astj\u00f3rnumunarf\u00e9lags
  \u00cdslands.\\n\\nFj\u00f6\u00f0uhagsstofnun a\u00f0sto\u00f0a\u00f0i vi\u00f0
  kaflann \u201eN\u00faverandi sta\u00f0a \u00ed fer\u00f0apj\u00f3nustu.\u201c\\n\\nP\u00e1
  unnu Kaupmannasamt\u00f6kin till\u00f6gur um stefnum\u00f3tun fyrir verslunina me\u00f0
  tilliti til fer\u00f0amannaverslunar.\\n\\nLoks \u00e1kva\u00f0 st\u00fdrinefndin
  a\u00f0 senda \u00fat br\u00e9f til um 200 einstaklinga, fyrt\u00edrt\u00e6kja e\u00f0a
  hagsmunaa\u00f0ila, \u00fear sem \u00feeim var gefinn kostur a\u00f0 koma me\u00f0
  \u00e1bendingar til st\u00fdrih\u00f3psins. Margir h\u00f6f\u00f0u samband vi\u00f0
  nefndina \u00ed kj\u00f6lfari\u00f0 og nokkrir sendu skriflegar \u00e1bendingar
  um einstaka m\u00e1laflokka.\\n\\nEins og fram kom \u00ed upphafi er h\u00e9r um
  fj\u00f3r\u00f0a verkefn\u00ed\u00f0 a\u00f0 r\u00e6\u00f0a \u00e1 20 \u00e1rum,
  \u00fear sem fjalla\u00f0 er um stefnum\u00f3tun \u00ed fer\u00f0apj\u00f3nustu
  \u00e1 vegum stj\u00f3rnavalda.\\n\\n\u00cd till\u00f6gum nefndarinnar er \u00fev\u00ed
  a\u00f0 finna \u00fdmsa \u00fe\u00e6tti, sem komi\u00f0 hafa fram \u00e1\u00f0ur
  \u00ed hli\u00f0sta\u00f0ri vinnu og \u00ed umr\u00e6\u00f0um um fer\u00f0am\u00e1l
  og nefndin telur nau\u00f0synlegt a\u00f0 hafa me\u00f0 til a\u00f0 skapa heildarstefnu
  \u00ed fer\u00f0apj\u00f3nustu \u00e1 \u00cdslandi.\\n\\nVi\u00f0 ger\u00f0 loka\u00fatg\u00e1fu
  \u00feessarar sk\u00fdrslu kaus nefndin a\u00f0 fara \u00fe\u00e1 lei\u00f0 a\u00f0
  hafa \u00ed henni fyrst og fremst till\u00f6gurnar sj\u00e1lfsar, svo a\u00f0 stefnan,
  markmi\u00f0in og lei\u00f0irnar v\u00e6ru a\u00f0gengilegar, en v\u00edsa frekar
  til \u00feess \u00edtarefnis, sem unni\u00f0 var \u00e1 vegum nefndarinnar til frekari
  sk\u00fdringa.\\n\\n\u00de\u00e6r till\u00f6gur um stefnum\u00f3tun sem h\u00e9r
  liggja fyrir eru till\u00f6gur um stefnu stj\u00f3rnvalda gagnvart fer\u00f0a\u00fej\u00f3nustu
  og starfsumhverfi hennar. Hvatt er til a\u00f0 einst\u00f6k fyrirt\u00e6ki, sveitarf\u00e9l\u00f6g
  og hagsmunasamt\u00f6k leggi til grundvallar \u00ed sinni stefnum\u00f3tun \u00fe\u00e1
  meginstefnu sem h\u00e9r er m\u00f6rku\u00f0.\\n\\nGer\u00f0 er tillaga um a\u00f0
  s\u00fa stefna ver\u00f0i tekin til endursko\u00f0unar \u00e1 \u00e1rinu 1999, \u00feannig
  a\u00f0 endursko\u00f0u\u00f0 stefnum\u00f3tun liggi fyrir eigi s\u00ed\u00f0ar
  en \u00ed lok sama \u00e1rs.\\n\\n1.2 Meginstefna\\n\\nFer\u00f0abj\u00f3nusta,
  sem ein af undirst\u00f6\u00f0uutvinnugreinum \u00fej\u00f3\u00f0arinnar, ver\u00f0i
  \u00fer\u00f3u\u00f0 til frekari ar\u00f0semi og atvinnusk\u00f6punar.\\n\\nA\u00f0skilna\u00f0ur
  stj\u00f3rns\u00fdslu og hagsmunag\u00e6slu ver\u00f0i trygg\u00f0ur.\\n\\nG\u00e6\u00f0i
  fer\u00f0abj\u00f3nustu \u00e1 \u00cdslandi ver\u00f0i meiri en \u00ed samkeppnisl\u00f6ndum
  okkar.\\n\\nRanns\u00f3knir, menntun og starfs\u00fej\u00e1lfun ver\u00f0i efl\u00ed
  \u00ed samr\u00e6mi vi\u00f0 \u00fearfir atvinnugreinarinnar.\\n\\nMarka\u00f0ss\u00f3kn
  ver\u00f0i aukin og stefnt a\u00f0 jafnari dreifingu fer\u00f0amanna yfir \u00e1ri\u00f0
  og um landi\u00f0.\\n\\nTengsl vi\u00f0 brottflutta \u00cdslendinga og afkomendur
  \u00feeirra ver\u00f0i efl\u00ed.\\n\\nSaga, menning og mannl\u00edf \u00cdslendinga
  \u00ed fort\u00ed\u00f0 og n\u00fat\u00ed\u00f0 ver\u00f0i mikilv\u00e6gur \u00fe\u00e1ttur
  \u00ed fer\u00f0abj\u00f3nustu.\\n\\nFer\u00f0apj\u00f3nustunni, sem einni af undirst\u00f6\u00f0uutvinnugreinum
  \u00fej\u00f3\u00f0arinnar, ver\u00f0i b\u00fai\u00f0 sam\u00fe\u00e6legt rekrstrarumhverfi
  og \u00ed samkeppnisl\u00f6ndum.\\n\\nGistir\u00fdmi og \u00fej\u00f3nusta ver\u00f0i
  samkeppnish\u00e6f og \u00ed samr\u00e6mi vi\u00f0 mismunandi \u00fearfir fer\u00f0amanna.\\n\\nAfpreyningar\u00fej\u00f3nustu
  ver\u00f0i b\u00fain l\u00f6g og reglur l\u00edkt og annarri atvinnustarfsemi.\\n\\nMe\u00f0
  hestafer\u00f0um s\u00e9 bo\u00f0i\u00f0 upp \u00e1 s\u00e9rst\u00e6\u00f0a, skemmtilega
  og fr\u00f3\u00f0lega afpreyingu.\\n\\nFundu-, r\u00e1\u00f0stefnu- og hvatafer\u00f0amennska
  utan h\u00e1annar ver\u00f0i aukin.\\n\\nFer\u00f0amennska \u00ed tengslum vi\u00f0
  heilsub\u00f3t og heilbrig\u00f0i ver\u00f0i aukin og almenn heilbrig\u00f0is\u00fej\u00f3nusta
  marka\u00f0ssett.\\n\\nS\u00e9reinkenni n\u00e1tt\u00faru \u00cdslands og s\u00e9r\u00feekking
  ver\u00f0i n\u00fdtt \u00ed samvinnu fer\u00f0abj\u00f3nustu og v\u00edsindamanna.\\n\\nFer\u00f0amenn
  geti sem v\u00ed\u00f0ast fengi\u00f0 nau\u00f0synlegar uppl\u00fdsingar.\\n\\nVerslun
  fer\u00f0amanna ver\u00f0i aukin.\\n\\n\u00d6ruggur flutningur fer\u00f0amanna a\u00f0
  og fr\u00e1 landinu og milli sta\u00f0a innanlands ver\u00f0i \u00e1fram trygg\u00f0ur.\\n\\nFer\u00f0abj\u00f3nusta
  ver\u00f0i \u00ed s\u00e1tt vi\u00f0 land og \u00fej\u00f3\u00f0 og \u00ed anda
  sj\u00e1lfb\u00e6r\u00f0ar \u00fer\u00f3unar.\\n\\n\u00cdsland gegni forystuhlutverki
  \u00e1 svi\u00f0i umhverfisverndar og \u00feess s\u00e9 g\u00e6tt a\u00f0 umgengni
  fer\u00f0amanna spilli ekki n\u00e1tt\u00faru landsins.\\n\\nVi\u00f0 skipulagningu
  og uppbyggingu sv\u00e6\u00f0a ver\u00f0i teki\u00f0 tillit til \u00fearfir fer\u00f0apj\u00f3nustunnar.\\n\\n1.3
  Hugt\u00f6k - Skilgreiningar\\n\\nNau\u00f0synlegt er a\u00f0 h\u00e9r \u00e1 landi
  s\u00e9u skilgreiningar \u00e1 hugt\u00f6kum fer\u00f0abj\u00f3nustunnar \u00fe\u00e6r
  s\u00f6mu og \u00ed samkeppnisl\u00f6ndum okkar. \u00deetta er mikilv\u00e6gt, s\u00e9rstaklega
  me\u00f0 tilliti til \u00feess a\u00f0 s\u00f6mu m\u00e6likvar\u00f0ar ver\u00f0i
  nota\u00f0ir vi\u00f0 a\u00f0 meta \u00e1rangur og a\u00f0 samanbur\u00f0arh\u00e6fni
  s\u00e9 trygg\u00f0.\\n\\nLagt er til a\u00f0 flokkun \u00e1 fer\u00f0al\u00f6ngum
  \u00ed millilandafer\u00f0um ver\u00f0i \u00ed samr\u00e6mi vi\u00f0 lokatill\u00f6gur
  EUROSTAT, en \u00fe\u00e1 flokkun er veri\u00f0 a\u00f0 taka upp vi\u00f0a \u00ed
  Evr\u00f3pu. H\u00f6f\u00f0 var samvinna vi\u00f0 \u00cdslenska m\u00e1lst\u00f6\u00f0
  um \u00fe\u00fd\u00f0ingar og skilgreiningar b\u00e6\u00f0i \u00e1 sk\u00fdringarmyndinni
  og \u00e1 or\u00f0alistu.\\n\\nFlokkun fer\u00f0alanga \u00ed millilandafer\u00f0um\\n\\n1.
  Gestir sem dvelja a.m.k. eina n\u00f3tt \u00ed landinu, en skemur en eitt \u00e1r.\\n\\n2.
  Gestir sem koma og fara sama daginn. Tilgangur fer\u00f0ar er orlof, heims\u00f3knir
  til vina og \u00e6ttingja, vi\u00f0skipti/vinna, heilsume\u00f0fer\u00f0, tr\u00faa\u00f0legar
  \u00e1st\u00e6\u00f0ur/pilgr\u00edmsfer\u00f0 e\u00f0a anna\u00f0 tengt fer\u00f0amennsku.\\n\\n3.
  Gestir sem koma til landsins me\u00f0 skemmtifer\u00f0askipum (skv. skilgreiningu
  \\\"The International Maritime Organization\\\") og gista um bor\u00f0 \u00ed skipunum.\\n\\n4.
  \u00c1hafnir erlendra skipa og flugv\u00e9la sem gista a.m.k. eina n\u00f3tt \u00ed
  landinu.\\n\\n5. \u00c1hafnir erlendra skipa og flugv\u00e9la sem hafa dagr\u00e6ivdvi\u00f0
  \u00ed landinu.\\n\\n6. Skv. skilgreiningu Sameinu\u00f0u \u00fej\u00f3\u00f0anna
  (Recommendations on Statistics of International).\\n\\n7. Fer\u00f0alangar sem yfirgefa
  ekki \\\"transitsv\u00e6\u00f0i\\\" hafna e\u00f0a flugvalla.\\n\\n8. Skv. skilgreiningu
  Sameinu\u00f0u \u00fej\u00f3\u00f0anna \\\"High Commissioner for Refugees\\\".\\n\\n9.
  \u00c1 vi\u00f0 um fer\u00f0al\u00f6g fr\u00e1 heimalandi til vinnusta\u00f0ar og
  til baka.\\n\\nFer\u00f0a\u00fej\u00f3nusta\\n(Tourism Industry)\\nAtvinnugrein
  sem tekur til allra fyrirt\u00e6kja og einstaklinga sem vinna st\u00f6rf tengd fer\u00f0al\u00f6gum,
  s.s. fer\u00f0aheildalsa, fer\u00f0asm\u00e1sala, fer\u00f0askipuleggingjendur,
  f\u00f3lksflutningafyrirt\u00e6ki (a\u00f0 hluta), gistiasta\u00f0, lei\u00f0s\u00f6gumenn
  (sj\u00e1 n\u00e1nar mat \u00fej\u00f3\u00f0hagsstofnunar \u00e1 \u00e1rsverkum
  \u00ed fer\u00f0a\u00fej\u00f3nustu).\\n\\n(ATH: Skv. \u00feessari skilgreiningu
  myndi starfsemi Fluglei\u00f0a og annarra flug- og skipaf\u00e9laga sem haldur uppi
  samg\u00f6ngum til og fr\u00e1 landinu, ekki a\u00f0 fullu teljast til fer\u00f0a\u00fej\u00f3nustu,
  heldur einnig til Travel industry).\\n\\nFer\u00f0amennska\\n(Tourism)\\nAthafnir
  einstaklinga sem fer\u00f0ast til sta\u00f0a utan hversdagsumhverfis og dvelja \u00fear
  \u00ed n\u00e1nar skilgreindum tilgangi. Fer\u00f0in stendur skemur en \u00ed t\u00f3lf
  m\u00e1nu\u00f0i samfleytt.\\n\\nHversdagsumhverfi\\n(Usual environment)\\nHeimili
  einstaklings (\u00fear sem hann hefur fasta b\u00fasetu), vinnusta\u00f0ur, sk\u00f3lastofnun
  og a\u00f0rir sta\u00f0ir sem hann kemur reglulega \u00e1.\\n\\nFer\u00f0amennska
  innanlands\\n(Domestic tourism)\\nFer\u00f0amennska f\u00f3lks innan b\u00fasetulands.\\n\\nInnfer\u00f0amennska\\n(Inbound
  tourism)\\nN\u00e6r yfir fer\u00f0ir fr\u00e1u annarra landa (til \u00cdslands),
  cinnig \u00edslenskra r\u00edkisborgara sem b\u00fasettir eru erlendis (sj\u00e1
  b\u00fasetuland) og koma til skemmi\u00f0 dvalar en 12 m\u00e1nu\u00f0a.\\n\\nUtanfer\u00f0amennska\\n(Outbound
  tourism)\\nN\u00e6r yfir fer\u00f0ir fr\u00e1u (\u00cdslands) til annarra landa,
  sem standa skemur en 12 m\u00e1nu\u00f0i.\\n\\nFer\u00f0alangur\\n(Traveler)\\nEinstaklingur
  \u00e1 fer\u00f0alagi \u00e1 milli landa e\u00f0a \u00e1 milli sta\u00f0a innan
  b\u00fasetulands, \u00f3h\u00e1\u00f0 tilgangi fer\u00f0alagsins. Greint er \u00e1
  milli innanlandsfer\u00f0alanga og millilandafer\u00f0alanga.\\n\\nInnanlandsfer\u00f0alangur\\nEinstaklingur
  \u00e1 fer\u00f0alagi \u00e1 milli sta\u00f0a innan b\u00fasetulands, \u00f3h\u00e1\u00f0
  tilgangi fer\u00f0alagsins.\\n\\nMillilandafer\u00f0alangur\\nEinstaklingur \u00e1
  fer\u00f0alagi \u00e1 milli tveggja e\u00f0a fleiri landa, \u00f3h\u00e1\u00f0 tilgangi
  fer\u00f0alagsins.\\n\\nB\u00fasetuland\\n(Country of residence)\\nLand \u00fear
  sem hluta\u00f0eigandi hefur haldi\u00f0 til (b\u00fai\u00f0) sl. 12 m\u00e1nu\u00f0i
  e\u00f0a landi\u00f0 \u00fear sem hann hefur b\u00fai\u00f0 \u00ed styttri t\u00edma
  en hyggst halda \u00feanga\u00f0 aftur innan 12 m\u00e1nu\u00f0a.\\n\\nGestur\\n(Visitor)\\n(Grunnhugtak/eining
  \u00ed t\u00f6lfra\u00f0i fer\u00f0a\u00fej\u00f3nustunnar)\\nEinstaklingur \u00e1
  fer\u00f0alagi utan hversdagsumhverfis \u00ed minna en t\u00f3lf m\u00e1nu\u00f0i
  samfleytt. A\u00f0altilgangur fer\u00f0arinnar er annar en a\u00f0 stunda launad
  starf \u00e1 sta\u00f0num sem fer\u00f0ast er til.\\n\\nFer\u00f0ama\u00f0ur\\n(Tourist)\\nGestur
  sem dvelur a.m.k. eina n\u00f3tt \u00e1 sta\u00f0num sem hann kemur \u00e1.\\n\\nDagsfer\u00f0ama\u00f0ur\\n(Same-day
  visitor)\\nGestur sem er ekki n\u00e6tursakir \u00e1 sta\u00f0num sem hann kemur
  \u00e1.\\n\\nInnanlandsfer\u00f0ama\u00f0ur\\nEinstaklingur \u00e1 fer\u00f0alagi
  innan b\u00fasetulands en utan hversdagsumhverfis, \u00ed n\u00e1nar skilgreindum
  tilgangi.\\n\\nFer\u00f0 (Trip)\\nFer\u00f0alag sem tekur a.m.k. eina n\u00f3tt
  og minna en eitt \u00e1r og n\u00e6r \u00fat fyrir hversdagsumhverfi einstaklings.\\n\\nDagsfer\u00f0\\n(Excursion,
  Day Excursion)\\nFer\u00f0alag sem tekur \u00ed mesta lagi einn heilan dag og n\u00e6r
  \u00fat fyrir hversdagsumhverfi einstaklings.\\n\\nSkammfer\u00f0 (Brief holiday)\\nFer\u00f0
  sem tekur eina til \u00ferj\u00e1r n\u00e6tur.\\n\\nLangfer\u00f0 (Long holiday)\\nFer\u00f0
  sem tekur fj\u00f3r\u00f0ar n\u00e6tur e\u00f0a meira.\\n\\nFer\u00f0amannasta\u00f0ur\\n(Tourist
  attraction)\\nSta\u00f0ur (anna\u00f0hvort n\u00e1tt\u00farulegur e\u00f0a mannger\u00f0ur)
  sem la\u00f0ar a\u00f0 s\u00e9r fer\u00f0amenn.\\n\\nDvalart\u00edmi\\n(Duration
  of stay)\\nS\u00e1 t\u00edmi sem gestir dvelja \u00e1 sta\u00f0num sem \u00feeir
  heims\u00e6kja (\u00e1nn fer\u00f0adaga).\\n\\nLengd fer\u00f0ar\\n(Duration of
  trip)\\nS\u00e1 t\u00edmi sem fer\u00f0in tekur a\u00f0 fer\u00f0ad\u00f6gum me\u00f0t\u00f6ldum.\\n\\nMegintilgangur
  fer\u00f0ar (sj\u00e1 sk\u00fdringarmynd)\\n(Main purpose of visit)\\nHugtak sem
  notast vi\u00f0 uppl\u00fdsinga\u00f0flun um fer\u00f0amennsku. Megintilgangur fer\u00f0ar
  er \u00fea\u00f0 atri\u00f0i sem \u00e1kvar\u00f0ar hva\u00f0a fer\u00f0al\u00f6g
  (travel) teljast til fer\u00f0amennsku (tourism). Megintilgangur fer\u00f0ar getur
  veri\u00f0 orlof, heims\u00f3kn til vina og \u00e6ttingja, vi\u00f0skipti, vinna,
  heilsurekt, tr\u00faaarbrag\u00f0a\u00f0lukun e\u00f0a anna\u00f0.\\n\\nGistin\u00f3tt\\n(Bed
  night)\\nGisting fer\u00f0amanns (svo framarlega sem greitt er fyrir gistinguna).
  Gisti tveir einstaklingar \u00ed sama herbergi teljast \u00fea\u00f0 tv\u00e6r gistin\u00e6tur.\\n\\nFer\u00f0aframlei\u00f0andi\\n(Tour
  Producer)\\nS\u00e1 sem skipuleggur stuttar e\u00f0a langar fer\u00f0ir og selur
  \u00fe\u00e6r fer\u00f0aheildsala/fer\u00f0asm\u00e1sala, oft sem einn hluta alfer\u00f0ar.\\n\\nFer\u00f0aheildsali\\n(Tour
  Operator)\\nS\u00e1 sem setur saman alfer\u00f0 og b\u00fd\u00f0ur hana til s\u00f6lu,
  hvort heldur beint e\u00f0a me\u00f0 millig\u00f6ngu fer\u00f0asm\u00e1sala.\\n\\nFer\u00f0asm\u00e1sali\\n(Travel
  Agency)\\nS\u00e1 sem b\u00fd\u00f0ur til s\u00f6lu alfer\u00f0 sem fer\u00f0aheildsali
  hefur sett saman.\\n\\nH\u00f3pfer\u00f0\\n(Group Travel)\\nFer\u00f0 \u00fear sem
  tiltekin fj\u00f6ldi einstaklinga fer\u00f0ast saman \u00ed h\u00f3p.\\n\\nEinstaklingsfer\u00f0\\n(Individual
  Travel)\\nFer\u00f0 einstaklings, oftast \u00e1 eigin vegum. Skipulagning fer\u00f0arinnar
  getur veri\u00f0 \u00ed h\u00f6ndum fer\u00f0amannsins sj\u00e1lfs e\u00f0a fer\u00f0askrifstofu/fer\u00f0askipulegginganda/fer\u00f0aheildsala.\\n\\nErlendur
  gestur \u00e1 eigin vegum\\n(Foreign individual traveller FIT)\\n\\nAlfer\u00f0\\n(Inclusive
  Tour (IT))\\nFer\u00f0 sem sett er saman \u00far a.m.k. tveimur \u00fej\u00f3nustueiningum,
  t.d. flugi og gistingu.\\n\\nFastar fer\u00f0ir\\n(Regular tours)\\nFer\u00f0ir
  sem eru skipulag\u00f0ar af fer\u00f0askrifstofu/fer\u00f0askipulegginganda/fer\u00f0aheildsala
  og hafa fyrirfram fast\u00e1kve\u00f0nar brottfarir.\\n\\nS\u00e9rfer\u00f0ir\\n(Special
  tours/Tailor made tours)\\nFer\u00f0ir sem eru skipulag\u00f0ar fyrir \u00e1kve\u00f0inn
  h\u00f3p, oft \u201ckl\u00e6\u00f0skerasama\u00f0ar.\u201d \u00de\u00e6r eru \u00ed
  flestum tilfellum a\u00f0eins farnar einu s\u00edmi, \u00fe.e. \u00feegar h\u00f3pnum
  (e\u00f0a forsvarsmanni hans) hentar.\\n\\nHvatafer\u00f0\\n(Incentive Tour)\\nOfistast
  s\u00e9rst\u00f6k starfsmannafer\u00f0 me\u00f0alst\u00f3rra og st\u00f3rra fyrirt\u00e6kja.
  Fer\u00f0in er allajafna endapunktur \u00e1 l\u00f6ngu hvataferli, sem \u00e1 a\u00f0
  hvetja starfsmenn vi\u00f0komandi fyrirt\u00e6kis til d\u00e1\u00f0a (oft er s\u00f6luaukning
  markmi\u00f0i\u00f0) og \u00feeir starfsmenn sem hafa sta\u00f0i\u00f0 sig best
  f\u00e1 fer\u00f0 \u00ed ver\u00f0laun.\\n\\nS\u00e9rsvi\u00f0sfer\u00f0ir\\n(Special
  Interest Tour)\\nFer\u00f0ir sem hafa a\u00f0 megininntaki s\u00e9rsvi\u00f0/s\u00e9rst\u00f6k
  \u00e1hugam\u00e1l, t.d. jar\u00f0fr\u00e6\u00f0i e\u00f0a fuglasko\u00f0un.\\n\\nH\u00e1\u00f6nn\\n(High
  Season)\\nS\u00e1 t\u00edmi \u00e1rsins \u00feegar umsvif \u00ed fer\u00f0abj\u00f3numstu
  eru mest \u00e1 tilteknu sv\u00e6\u00f0i.\\n\\nJ\u00e1\u00f0art\u00edmi\\n(Shoulder
  season)\\nM\u00e1nu\u00f0irnir \u00e1 undan og eftir h\u00e1annat\u00edmanum.\\n\\nL\u00e1g\u00f6nn\\n(Low
  season/Off season)\\nS\u00e1 t\u00edmi \u00e1rsins \u00feegar umsvif \u00ed fer\u00f0a\u00fej\u00f3nustu
  eru \u00ed l\u00e1gmarki.\\n\\nTengifer\u00f0\\n(Transfer)\\nNota\u00f0 um flutning
  fer\u00f0amanna, oftast til og fr\u00e1 flugvelli.\\n\\nVi\u00f0dvalarfar\u00feegi\\n(Stop
  over passenger/Lay over passenger)\\nFar\u00feegi (flugfar\u00feegi e\u00f0a far\u00feegi
  skemmtifer\u00f0askips) sem hefur stutta, fyrirfram \u00e1kve\u00f0na vi\u00f0dv\u00f6l
  \u00e1 sta\u00f0num.\\nMisjafnt er hvort vi\u00f0dv\u00f6lin er skv. \u00f3sk far\u00feegans,
  e\u00f0a hvort samg\u00f6ngur krefjast vi\u00f0dvalarinna.\\nVi\u00f0dvalarfar\u00feegi
  er gestur, en \u00fdmist dagsfer\u00f0ama\u00f0ur e\u00f0a fer\u00f0ama\u00f0ur.
  Far\u00feegar skemmtifer\u00f0askipa eru \u00fe\u00f3 oftast dagsfer\u00f0amenn,
  \u00fear sem \u00feeir gista jafnan um bor\u00f0 \u00ed skipunum.\\n\\n\u00c1ningarfar\u00feegi\\n(Transit
  passenger)\\nFar\u00feegi sem hefur stutta vi\u00f0dv\u00f6l \u00e1 sta\u00f0num,
  \u00e1n \u00feess a\u00f0 fara \u00ed gegnum vegabr\u00e9fasko\u00f0un. Hann telst
  \u00fev\u00ed ekki til gesta.\\n\\nFer\u00f0amannaverslun\\n(Travel shopping)\\nInnkaup
  fer\u00f0alanga sem hafa b\u00fasetu \u00ed \u00f6\u00f0ru landi en \u00fev\u00ed
  sem kaupin fara fram \u00ed.\\n\\n\u00cd allri vinnu nefndarinnar var gengi\u00f0
  \u00fat fr\u00e1 \u00feessum skilgreiningum. Til \u00feess a\u00f0 fylgja \u00feessu
  starfi nefndarinnar efstir hefur n\u00fa veri\u00f0 sett \u00e1 stofn fj\u00f3r\u00f0anefnd
  fer\u00f0a\u00fej\u00f3nustunnar.\\n\\n2. HELSTU NI\u00d0URST\u00d6\u00d0UR\\n\\n2.1
  Samantekt stefnum\u00f3tunar\\n\\nFer\u00f0a\u00fej\u00f3nusta ver\u00f0i \u00e1fram
  ein af undirst\u00f6\u00f0u atvinnugreinum \u00fej\u00f3\u00f0arinnar og ver\u00f0i
  \u00fer\u00f3u\u00f0 til frekari ar\u00f0semi og atvinnusk\u00f6punar.\\n\\nA\u00f0skilna\u00f0ur
  stj\u00f3rns\u00fdslu og hagsmunagaslu ver\u00f0i trygg\u00f0ur.\\n\\nB\u00e6ta
  skal samkeppnisst\u00f6\u00f0u \u00edslenskrar fer\u00f0a\u00fej\u00f3nustu \u00feannig
  a\u00f0 g\u00e6\u00f0i hennar ver\u00f0i meiri en \u00ed helstu samkeppnisl\u00f6ndum
  okkar. \u00de\u00e6r v\u00f6rur og s\u00fa \u00fej\u00f3nusta sem atvinnugreinin
  laetur \u00ed t\u00e9 fulln\u00e6gi skilgreindum g\u00e6\u00f0akr\u00f6fum og v\u00e6ntingum
  vi\u00f0skiptavina.\\n\\n\u00c1 \u00cdslandi ver\u00f0i bo\u00f0i\u00f0 upp \u00e1
  menntun \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1 h\u00e1sk\u00f3lastigi. Menntun
  og starfs\u00fej\u00e1lfun \u00ed fer\u00f0a\u00fej\u00f3nustu ver\u00f0i einnig
  \u00ed bo\u00f0i \u00e1 \u00f6\u00f0rum sk\u00f3lastigum. Ranns\u00f3knastarfsemi
  \u00e1 svi\u00f0i fer\u00f0am\u00e1la ver\u00f0i efla \u00feannig a\u00f0 h\u00fan
  ver\u00f0i \u00ed fullu samr\u00e6mi vi\u00f0 \u00fearfir atvinnugreinarinnar og
  sty\u00f0ji vi\u00f0 stefnum\u00f3tun, marka\u00f0sstarf, v\u00f6rupr\u00fan og
  g\u00e6\u00f0aeftirlit \u00ed atvinnugreininni.\\n\\nMarka\u00f0ss\u00f3kn og kynningarstarfsemi
  ver\u00f0i aukin, jafnframt \u00fev\u00ed a\u00f0 efla skilvirkni marka\u00f0sstarfssins
  og a\u00f0 auka ar\u00f0semi \u00ed fer\u00f0a\u00fej\u00f3nustu.\\n\\nEfla skal
  tengsl vi\u00f0 brottflutta \u00cdslendinga og afkomendur \u00feeirra, m.a. Vestur-\u00cdslendinga,
  me\u00f0 \u00fea\u00f0 fyrir augum a\u00f0 vekja \u00e1huga \u00feeirra \u00e1 a\u00f0
  koma til \u00cdslands.\\n\\nSaga, menning og mannl\u00edf \u00cdslendinga \u00ed
  fort\u00ed\u00f0 og n\u00fat\u00ed\u00f0 ver\u00f0i veigamikill \u00fe\u00e1ttur
  \u00ed fer\u00f0a\u00fej\u00f3nustu. Leggja skal \u00e1herslu \u00e1 hi\u00f0 s\u00e9rstaka
  og fr\u00e1brug\u00f0ana \u00ed menningars\u00f6g\u00f0u \u00cdslendinga, sem er
  samofin landi og n\u00e1tt\u00faru. \u00c1valt ver\u00f0i ger\u00f0ar miklar kr\u00f6fur
  um faglega \u00feekkingu \u00feeirra sem \u00feessa \u00fej\u00f3nustu veita.\\n\\nFer\u00f0a\u00fej\u00f3nustunni,
  sem einni af undirst\u00f6\u00f0u atvinnugreinum \u00fej\u00f3\u00f0arinnar, ver\u00f0i
  b\u00fai\u00f0 sam\u00fe\u00e6rilegt rekstrarumhverfi og \u00ed samkeppnisl\u00f6ndum
  til a\u00f0 auka framlei\u00f0ni og ar\u00f0semi atvinnugreinarinnar \u00ed heild.\\n\\nRanns\u00f3knarstarfsemi
  um rekstur og afkomu fer\u00f0a\u00fej\u00f3nustufyrirt\u00e6kja ver\u00f0i efla
  og hagt\u00f6lur ger\u00f0ar a\u00f0gengilegar m.a. l\u00e1nastofnunum og fj\u00e1rfestum.\\n\\nStefna
  ber a\u00f0 \u00fev\u00ed a\u00f0 gistir\u00fdmi \u00e1 \u00cdslandi s\u00e9 samkeppnish\u00e6ft
  og a\u00f0 \u00fej\u00f3nustan ver\u00f0i \u00ed samr\u00e6mi vi\u00f0 mismunandi
  \u00fearfir vi\u00f0skiptavina.\\n\\nAfpreying bui\u00f0 vi\u00f0 l\u00f6g og reglur
  l\u00edkt og gerist me\u00f0 a\u00f0ra atvinnustarfsemi. Pess ver\u00f0i g\u00e6tt
  a\u00f0 uppbygging afpreyningar s\u00e9 \u00ed fullri s\u00e1tt vi\u00f0 n\u00e1tt\u00faru
  \u00cdslands og gangi ekki \u00e1 umhverfisarf komandi kynsl\u00f3\u00f0a.\\n\\nMe\u00f0
  hestafer\u00f0um s\u00e9 bo\u00f0i\u00f0 upp \u00e1 s\u00e9rst\u00e6\u00f0a, skemmtilega
  og fr\u00f3\u00f0legra afpreyingu sem sameinar \u00fativist, g\u00f3\u00f0 kynni
  af \u00edslenska hestinum og n\u00e1tt\u00faru landsins, um lei\u00f0 og \u00fe\u00e6r
  skapa atvinnu og tekjur.\\n\\nHlutur funda- og r\u00e1\u00f0stefnufer\u00f0amennsku
  og hvatafer\u00f0amennsku ver\u00f0i aukinn utan h\u00e1annar \u00e1 \u00cdslandi.
  Einnig er stefnt a\u00f0 \u00fev\u00ed a\u00f0 \u00feessir fer\u00f0amenn heims\u00e6kja
  \u00cdsland aftur.\\n\\nStefnt skal a\u00f0 \u00fev\u00ed a\u00f0 auka fer\u00f0amennsku
  \u00ed tengslum vi\u00f0 heilsub\u00f3t og heilbrig\u00f0i, \u00fear sem l\u00f6g\u00f0
  ver\u00f0ur \u00e1hersla \u00e1 \u00fe\u00e1 \u00fe\u00e6tti \u00fear sem \u00cdsland
  hefur s\u00e9rst\u00f6\u00f0u, einnig a\u00f0 hefja marka\u00f0sstefningu \u00e1
  almennum heilbrig\u00f0i\u00f0spj\u00f3nustu.\\n\\nStefna ber a\u00f0 \u00fev\u00ed
  a\u00f0 n\u00fdta s\u00e9rreinkenni n\u00e1tt\u00faru \u00cdslands og s\u00e9r\u00feekkingu
  \u00cdslendinga \u00e1 \u00fdmsum sv\u00ed\u00f0um \u00ed fer\u00f0a\u00fej\u00f3nustu
  og auka samvinnu \u00e1 milli fer\u00f0a\u00fej\u00f3nustu og v\u00edssindamanna.\\n\\nFer\u00f0amenn
  geti sem v\u00ed\u00f0ast fengi\u00f0 nau\u00f0synlegar uppl\u00fdsingar \u00ed
  a\u00f0gengilegu formi og fer\u00f0al\u00f6g ver\u00f0i ger\u00f0 \u00f6rrugari
  me\u00f0 notkun n\u00fdjustu uppl\u00fdsingat\u00e6kni.\\n\\nStefna ber a\u00f0
  \u00fev\u00ed a\u00f0 auka fer\u00f0amannaverslun og l\u00edta ber \u00e1 hana sem
  mikilv\u00e6gan hluta af fer\u00f0a\u00fej\u00f3nustu.\\n\\nUnnt ver\u00f0i a\u00f0
  flytja a\u00f0 og fr\u00e1 landinu \u00fe\u00e1 fer\u00f0amenn sem sko\u00f0a vilja
  og heims\u00e6kja landi\u00f0, \u00e1 hagkv\u00e6mastan og ar\u00f0b\u00e6ran h\u00e1tt.
  \u00deetta gildir jafnframt um flutninga a\u00f0 og fr\u00e1 landinu, sem og \u00e1
  milli sta\u00f0a innanlands. Frj\u00e1lsra\u00f0i \u00ed flutningum riki eftir \u00fev\u00ed
  sem kostur er. Keflav\u00edkurflugv\u00f6llur gegni \u00e1fram hlutverki s\u00ednu
  sem a\u00f0almi\u00f0ill landaflugv\u00f6llur landsins og Reykjav\u00edkurflugv\u00f6llur
  ver\u00f0i mi\u00f0st\u00f6\u00f0 innanlandsflugs.\\n\\nStefnt skal a\u00f0 \u00fev\u00ed
  a\u00f0 \u00cdsland gegni forystuhlutverki \u00e1 sv\u00ed\u00f0i umhverfisverndar
  og fer\u00f0a\u00fej\u00f3nustu \u00ed anda sj\u00e1lfb\u00e6rrar pr\u00f3unar ver\u00f0i
  efla\u00f0, \u00feannig a\u00f0 h\u00e9r \u00e1 landi ver\u00f0i rekin fer\u00f0amennsku
  \u00ed s\u00e1tt vi\u00f0 land og \u00fej\u00f3\u00f0. Trygg\u00f0ur ver\u00f0i
  frij\u00e1ls a\u00f0gangur fer\u00f0amanna a\u00f0 \u00f6llum landinu en \u00feess
  jafnframt g\u00e6tt a\u00f0 rekstur og uppb\u00fdgging \u00e1 fer\u00f0amannast\u00f6\u00f0um
  spilli ekki n\u00e1tt\u00faru landsins og umhverfis og a\u00f0 fer\u00f0amenn dreifist
  um landi\u00f0 til a\u00f0 minnka \u00e1lag \u00e1 einstaka sta\u00f0i.\\n\\nFramt\u00ed\u00f0aruppbygging
  og skipulag sta\u00f0a og sv\u00e6\u00f0a taki mi\u00f0 af \u00fe\u00f6rfum fer\u00f0a\u00fej\u00f3nustu.\\n\\n2.2
  T\u00f6luleg markmi\u00f0\\n\\nMe\u00f0 \u00fev\u00ed a\u00f0 fylgja framangreindri
  meginstefnu er tali\u00f0 a\u00f0 n\u00e1 megi eftirt\u00f6ldum t\u00f6lulegum markmi\u00f0um
  \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi \u00e1rin 1996-2005:\\n\\n**Tekjur
  af fer\u00f0a\u00fej\u00f3nustu**\\n\\nGjaldeyristekjur \u00fej\u00f3\u00f0arinnar
  af fer\u00f0a\u00fej\u00f3nustu aukist a\u00f0 me\u00f0altali um 6% \u00e1 \u00e1ri
  og ver\u00f0i um 38 milljar\u00f0ar \u00e1ri\u00f0 2005. (18,7 milljar\u00f0ar 1995)\\n\\nHlutdeild
  fer\u00f0a\u00fej\u00f3nustu \u00ed heildargjaldeyristekjum er \u00e1\u00e6tlu\u00f0
  16% \u00e1 \u00e1rinu 2005 \u00ed sta\u00f0 10-11% \u00e1ri\u00f0 1994. Gjaldeyristekjur
  af fer\u00f0a\u00fej\u00f3nustu aukast t\u00f6luvert meira en tekjur af \u00fatflutningi
  v\u00f6ru og \u00fej\u00f3nustu \u00ed heild.\\n\\n![Graph showing growth in tourism
  revenue from 1995 to 2006](image)\\n\\n1. mynd: Framrekna\u00f0ar gjaldeyristekjur
  1995-2005 mi\u00f0a\u00f0 vi\u00f0 6% \u00e1rlega me\u00f0altalsaukningu og 2% \u00e1rlega
  ver\u00f0b\u00f3lgu (Milljar\u00f0ar kr\u00f3na).\\n\\n**\u00c1rsverk \u00ed fer\u00f0a\u00fej\u00f3nustu**\\n\\n\u00c1rsverk
  \u00ed fer\u00f0a\u00fej\u00f3nustu ver\u00f0i um 7.000 \u00e1ri\u00f0 2005.\\n\\n\u00c1rsverk
  \u00ed fer\u00f0a\u00fej\u00f3nustu 1994 voru u.p.b. 3% (u.p.b. 4.000 st\u00f6rf)
  af heils\u00e1rs st\u00f6rfum \u00e1 \u00cdslandi. Stefnt er a\u00f0 \u00fev\u00ed
  a\u00f0 \u00e1ri\u00f0 2005 hafi hlutur fer\u00f0a\u00fej\u00f3nustu \u00ed heildargjaldeyristekjum
  af \u00fatfluttri v\u00f6ru og \u00fej\u00f3nustu aukist \u00far 11% \u00ed 16%.
  N\u00fa skila 3% vinnuaflsins um 11% gjaldeyristekna auk \u00feess a\u00f0 \u00fej\u00f3na
  innlendum marka\u00f0i og fer\u00f0al\u00f6gum til \u00fatlanda.\\n\\nV\u00e6ri
  n\u00faverandi vinnuafl \u00ed fer\u00f0a\u00fej\u00f3nustu fulln\u00fdtt m\u00e6tti
  gera r\u00e1\u00f0 fyrir a\u00f0 r\u00famlega 4% vinnuaflsins sinnti fer\u00f0a\u00fej\u00f3nustu
  \u00e1ri\u00f0 2005. En \u00feegar teki\u00f0 hefur veri\u00f0 til til n\u00famerandi
  n\u00fdtingar vinnuafls, aukinnar framlei\u00f0ni og fleiri \u00fe\u00e1tta \u00fe\u00e1
  er \u00e1\u00e6tlad a\u00f0 fer\u00f0a\u00fej\u00f3nustan \u00feurfi 3,7% vinnuaflsins
  \u00e1ri\u00f0 2005 \u00ed sta\u00f0 3%. Gangi \u00fea\u00f0 eftir yr\u00f0u \u00e1rsverk
  \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1ri\u00f0 2005 r\u00famlega 7.000 e\u00f0a
  um 3.000 fleiri en n\u00fa.\\n\\nGert er r\u00e1\u00f0 fyrir a\u00f0 hlutur h\u00f3telu
  og veitingasta\u00f0a \u00ed heildar\u00e1rsverkum fer\u00f0abj\u00f3nustunnar ver\u00f0i
  \u00e1fram um 40% og um 30% tengist samg\u00f6ngum \u00e1 landi og \u00ed lofti,
  en mj\u00f6g skiptar sko\u00f0anir eru um \u00fea\u00f0 hver \u00feessi hlutf\u00f6ll
  eru og er nau\u00f0synlegt a\u00f0 kanna \u00fea\u00f0.\\n\\n**FJ\u00d6LGUN GESTA
  TIL \u00cdSLANDS**\\n\\n\u00c1rleg me\u00f0altalsfj\u00f6lgun gesta til \u00cdslands
  ver\u00f0i um 6% \u00e1 \u00e1runum 1996-2005.\\n\\nAl\u00fej\u00f3\u00f0afer\u00f0am\u00e1lar\u00e1\u00f0i\u00f0
  (WTO) sp\u00e1ir um 2,6% \u00e1rlegri me\u00f0altalsfj\u00f6lgun fer\u00f0amanna
  \u00ed heiminum fram til \u00e1rsins 2010. Reikna\u00f0 er me\u00f0 a\u00f0 fj\u00f6ldi
  fer\u00f0amanna til Nor\u00f0ur-Evr\u00f3pu ver\u00f0i hlutfallslega meiri. \u00c1rleg
  me\u00f0altalsaukning \u00e1 fj\u00f6lda gesta til \u00cdslands sl. \u00e1ratug
  hefur veri\u00f0 um 7%.\\n\\nN\u00e1i \u00feetta markmi\u00f0 fram a\u00f0 g\u00e6ngu
  munu u.p.b. 340.000 gestir heims\u00e6kja \u00cdsland \u00e1ri\u00f0 2005. (190.000
  \u00e1ri\u00f0 1995)\\n\\n![Graph showing the number of visitors to Iceland from
  1995 to 2005](image)\\n\\n2. mynd: Framrekningur \u00e1 fj\u00f6lda gesta til \u00cdslands
  mi\u00f0a\u00f0 vi\u00f0 6% \u00e1rlega me\u00f0altalsaukningu.\\n\\nJ\u00d6FNU\u00d0
  \u00cd DREIFINGU FER\u00d0AMANNA EFTIR \u00c1RST\u00cd\u00d0UM\\n\\nAukin \u00e1hersla
  ver\u00f0i l\u00f6g\u00f0 \u00e1 fj\u00f6lgun fer\u00f0amanna utan h\u00e1annar
  og stefnt a\u00f0 j\u00f6fnun \u00ed komu fer\u00f0amanna eftir \u00e1rst\u00ed\u00f0um
  me\u00f0 skipul\u00f6g\u00f0um marka\u00f0sa\u00f0ger\u00f0um.\\n\\nStefnt er a\u00f0
  eftirfarandi fj\u00f6lgun gesta eftir m\u00e1nu\u00f0um:\\n3% \u00ed j\u00fal\u00ed
  m\u00e1nu\u00f0i, 5% \u00ed j\u00fan\u00ed og \u00e1g\u00fast og 8% a\u00f0ra m\u00e1nu\u00f0i
  \u00e1rsins\\n\\n3. mynd: Dreifing gesta \u00e1 m\u00e1nu\u00f0i \u00e1rsins 1994
  og 2005 mi\u00f0a\u00f0 vi\u00f0 ofangreint markmi\u00f0.\\n\\nSKEMMTIFER\u00d0ASKIP\\n\\nDagsfer\u00f0am\u00f6nnum
  me\u00f0 skemmtifer\u00f0askipum til \u00cdslands fj\u00f6lgji \u00e1rlega um 8%
  a\u00f0 me\u00f0altali \u00e1 \u00e1runum 1996-2005.\\n\\nN\u00e1i markmi\u00f0i\u00f0
  fram a\u00f0 ganga munu dagsfer\u00f0amenn me\u00f0 skemmtifer\u00f0askipum ver\u00f0a
  u.p.b. 46.000 \u00e1ri\u00f0 2005. (21.000 \u00e1ri\u00f0 1995)\\n\\n4. mynd: Framrekningur
  \u00e1 fj\u00f6lda dagsfer\u00f0amanna me\u00f0 skemmtifer\u00f0askipum til \u00cdslands
  mi\u00f0a\u00f0 vi\u00f0 8% \u00e1rlega me\u00f0altalsaukningu.\\n\\nGISTIN\u00c6TUR
  GESTA \u00c1 \u00cdSLANDI\\n\\nGistin\u00f3ttum gesta \u00e1 \u00cdslandi fj\u00f6lgri
  \u00e1rlega um 4% a\u00f0 me\u00f0altali \u00e1 \u00e1runum 1996-2005.\\n\\nMi\u00f0a\u00f0
  vi\u00f0 v\u00edsbendingar um breytingar \u00e1 fer\u00f0amynstri \u00ed heiminum
  er l\u00edklegt a\u00f0 gistin\u00f3ttum muni ekki fj\u00f6lga til jafns vi\u00f0
  gesti.\\nN\u00e1\u00f0 \u00feetta markmi\u00f0 fram a\u00f0 ganga mun heildarfj\u00f6ldi
  gistin\u00e1tta gesta \u00e1 h\u00f3telum og gistih\u00fasum ver\u00f0a um 1.100
  \u00fe\u00fas. \u00e1ri\u00f0 2005. Teki\u00f0 er mi\u00f0 af gistisk\u00fdrslum
  Hagstofunnar en samkv\u00e6mt \u00feeim voru gistin\u00e6tur n\u00famlega 700 \u00fe\u00fas.
  \u00e1ri\u00f0 1994.\\n\\n5. mynd: Framrekningur \u00e1 fj\u00f6lda gistin\u00e1tta
  gesta \u00e1 h\u00f3telum og gistih\u00fasum \u00e1 \u00cdslandi mi\u00f0a\u00f0
  vi\u00f0 4% \u00e1rlega me\u00f0altalsaukningu. Byggt er \u00e1 gistisk\u00fdrslum
  Hagstofunnar.\\n\\nGISTIN\u00c6TUR INNANLANDSFER\u00d0AMANNA\\n\\nGistin\u00f3ttum
  innanlandsfer\u00f0amanna fj\u00f6lgri \u00e1rlega um 3% a\u00f0 me\u00f0altali
  \u00e1 \u00e1runum 1996-2005.\\nEf \u00feetta markmi\u00f0 n\u00e6st ver\u00f0a
  gistin\u00e6tur innanlandsfer\u00f0amanna \u00e1 h\u00f3telum og gistih\u00fasum
  um 560 \u00fe\u00fas. talsins \u00e1ri\u00f0 2005, en voru um 400 \u00fe\u00fas.
  \u00e1ri\u00f0 1994.\\n\\n6. mynd: Framrekningur \u00e1 fj\u00f6lda gistin\u00e1tta
  \u00e1 h\u00f3telum og gistih\u00fasum innanlandsfer\u00f0amanna \u00e1 \u00cdslandi
  mi\u00f0a\u00f0 vi\u00f0 3% \u00e1rlega me\u00f0altalsaukningu. Byggt er \u00e1
  gistisk\u00fdrslum Hagstofunnar.\\n\\nHlutfall gistin\u00e1tta \u00e1 milli h\u00f6fu\u00f0borgarsv\u00e6\u00f0isins
  og landsbygg\u00f0arinnar ver\u00f0i 70/30 \u00e1ri\u00f0 2005. (85/15 \u00e1ri\u00f0
  1994)\\n\\n3. STJ\u00d3RNUN OG SKIPULAG\\n\\n3.1 Stj\u00f3rns\u00fdsla fer\u00f0a\u00fej\u00f3nustu\\n\\nSt\u00fdrinefndin
  fjalla\u00f0i \u00ed st\u00f6rfum s\u00ednum nokku\u00f0 um n\u00faverandi stj\u00f3rnnun
  og skipulag fer\u00f0am\u00e1la. L\u00f6g \u00feau sem \u00ed gildi eru um skipulag
  fer\u00f0am\u00e1la eru upphaflega fr\u00e1 \u00e1rinu 1964. Nokkrum sinnum hafa
  veri\u00f0 ger\u00f0ar \u00e1 \u00feeim breytingar, s\u00ed\u00f0ast \u00e1ri\u00f0
  1994. \u00c1 vegum Fer\u00f0am\u00e1lar\u00e1\u00f0s var sett \u00e1 stofn nefnd
  \u00ed \u00e1rsbyrjun 1995 sem skila \u00e1 till\u00f6gum um nau\u00f0synlegar breytingar
  \u00e1 l\u00f6gum og regluger\u00f0um um fer\u00f0a\u00fej\u00f3nustu. \u00deeirri
  vinnu er enn ekki loki\u00f0. Mikilv\u00e6gt er a\u00f0 till\u00f6gur hennar liggi
  fyrir sem fyrst svo \u00fe\u00e6r \u00e1samt me\u00f0fylgjandi till\u00f6gum a\u00f0
  stefnum\u00f3tun n\u00fdtist vi\u00f0 nau\u00f0synlega endursko\u00f0un lagarammans.\\n\\nLagt
  er til, a\u00f0 \u00ed framhaldi af sam\u00feykkt stefnum\u00f3tunar \u00ed fer\u00f0a\u00fej\u00f3nustu,
  l\u00e1ti samg\u00f6ngur\u00e1\u00f0herra semja till\u00f6gur um nau\u00f0synlegar
  breytingar \u00e1 n\u00e1gildandi l\u00f6gum og regluger\u00f0um sem snerta fer\u00f0a\u00fej\u00f3nustu.\\n\\nTilgangur
  \u00feeirra breytinga ver\u00f0i einf\u00f6ldun \u00e1 framkv\u00e6md stj\u00f3rns\u00fdslunnar
  \u00ed m\u00e1lefnum fer\u00f0a\u00fej\u00f3nustunnar, \u00feannig a\u00f0 l\u00f6g
  og regluger\u00f0ir grei\u00f0i fyrir \u00fev\u00ed a\u00f0 stj\u00f3rnv\u00f6ld
  og atvinnugreinin n\u00e1i fram \u00feeim markmi\u00f0um sem \u00e1kve\u00f0in ver\u00f0a.
  \u00de\u00e1 ver\u00f0i \u00f6ll framkv\u00e6md og skilvirkn\u00ed stj\u00f3rns\u00fdslunnar
  f\u00e6r\u00f0 til samr\u00e6mis vi\u00f0 \u00fea\u00f0 sem best gerist.\\n\\nTryggja
  \u00fearf meiri a\u00f0skilna\u00f0 stj\u00f3rns\u00fdslu og hagsmunag\u00e6slu
  en n\u00e1gildandi l\u00f6g gera r\u00e1\u00f0 fyrir. Einnig \u00fearf a\u00f0 skilgreina
  betur hlutverk stofnana r\u00edkisins \u00ed stj\u00f3rns\u00fdslunni, hva\u00f0
  var\u00f0ar m\u00e1lefni sem snerta fer\u00f0a\u00fej\u00f3nustu.\\n\\n3.2 G\u00e6\u00f0astj\u00f3rnnun
  \u00ed fer\u00f0a\u00fej\u00f3nustu\\n\\n3.2.1 Stefnum\u00f3tun\\n\\nStefna ber
  a\u00f0 \u00fev\u00ed b\u00e6ta samkeppnisst\u00f6\u00f0u \u00edslenskrar fer\u00f0a\u00fej\u00f3nustu
  me\u00f0 \u00fev\u00ed a\u00f0 g\u00e6\u00f0i veittrar \u00fej\u00f3nustu s\u00e9r
  meiri en \u00ed helstu samkeppnisl\u00f6ndum okkar. \u00de\u00e6r v\u00f6rur og
  s\u00fa \u00fej\u00f3nusta sem atvinnugreinin l\u00e6tur \u00ed t\u00e9 fulln\u00e6gi
  skilgreindum g\u00e6\u00f0akr\u00f6fum og v\u00e6ntingum vi\u00f0skiptavina.\\n\\n3.2.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nStu\u00f0la\u00f0 ver\u00f0i a\u00f0 aukinni g\u00e6\u00f0avitund
  og faglegri f\u00e6rni starfsf\u00f3lks \u00ed fer\u00f0a\u00fej\u00f3nustu. Komi\u00f0
  ver\u00f0i \u00e1 f\u00f3t g\u00e6\u00f0ahvetjandi kerfi, t.d. n\u00e1mskei\u00f0um
  sem lyki me\u00f0 \u00e1kve\u00f0inni vi\u00f0urkenningu, \u00ed \u00feeim tilgangi
  a\u00f0 auka g\u00e6\u00f0a- og \u00fej\u00f3nustuvitund starfsf\u00f3lks og b\u00e6ta
  samkeppnish\u00e6fni fyrt\u00edr\u00e6kjanna.\\n\\nHvatt er til a\u00f0 einstakar
  greinar fer\u00f0a\u00fej\u00f3nustunnar skilgreini \u00fe\u00e1 sta\u00f0a sem
  vinna skal eftir.\\n\\nKomi\u00f0 ver\u00f0i \u00e1 skilgreindri g\u00e6\u00f0aflokkun
  \u00feeirrar \u00fej\u00f3nustu sem fer\u00f0am\u00f6nnum stendur til bo\u00f0a.\\nSkipa\u00f0ur
  ver\u00f0i vinnuh\u00f3pur til a\u00f0 koma \u00e1 og innlei\u00f0a flokkunarkefni
  sem n\u00e1i til helstu \u00fe\u00e1tta fer\u00f0apj\u00f3nustunnar.\\n\\nYfirv\u00f6ld
  fer\u00f0am\u00e1la og einst\u00f6k fyrirt\u00e6ki stj\u00f3rni starfsemi sinni
  me\u00f0 \u00feeim h\u00e6tti a\u00f0 \u00feau standi vi\u00f0 samninga og lofor\u00f0
  um veitta \u00fej\u00f3nustu.\\nReglubundnar \u00fattektir ver\u00f0i ger\u00f0ar
  \u00e1 \u00fev\u00ed hv\u00f8rnig innlendir og erlendir a\u00f0ilar sem stunda fer\u00f0apj\u00f3nustu
  standist \u00fe\u00e6r kr\u00f6fur sem fram eru settar \u00ed skilgreindri flokkun.\\nReglubundnar
  kannanir ver\u00f0i ger\u00f0ar \u00e1 vi\u00f0horfum innlendra og erlendra fer\u00f0amanna
  til \u00feess a\u00f0 kanna a\u00f0 hve miklu leyt\u00ed tekist hefur a\u00f0 koma
  til m\u00f3ts vi\u00f0 v\u00e6ntingar \u00feeirra og kr\u00f6fur.\\nFyrirt\u00e6ki
  \u00ed fer\u00f0apj\u00f3nustu eru hv\u00f6tt til a\u00f0 byggja upp g\u00e6\u00f0akerfi
  sem taki mi\u00f0 af ISO st\u00f6\u00f0lum.\\n\\nL\u00f6g\u00f0 ver\u00f0i \u00e1hersla
  \u00e1 a\u00f0 s\u00fa afpreyingarpj\u00f3nusta sem \u00ed bo\u00f0i er \u00e1 \u00cdslandi,
  standist str\u00f6ngustu kr\u00f6fur um g\u00e6\u00f0i og \u00f6ryggi.\\nStu\u00f0la\u00f0
  ver\u00f0i a\u00f0 \u00f6ryggi fer\u00f0amanna \u00e1 \u00cdslandi me\u00f0 nau\u00f0synlegum
  forv\u00f6rnum og \u00farb\u00f3tum.\\n\\nSkilgreina skal \u00e1byrg\u00f0 fer\u00f0apj\u00f3nustua\u00f0ila
  og fer\u00f0amannsins sj\u00e1lfs \u00e1 \u00f6ryggism\u00e1lum.\\nStj\u00f3rnv\u00f6ld
  kanni reglur um \u00f6ryggism\u00e1l \u00ed samkeppnisl\u00f6ndum okkar og lagasetningar
  \u00ed \u00feessu samhengi \u00e1 mikilv\u00e6gustu m\u00f6rku\u00f0um okkar.\\n\\n4.
  Menntun og ranns\u00f3knir \u00ed fer\u00f0a\u00fej\u00f3nustu\\n\\n4.1.1 Stefnum\u00f3tun\\n\u00c1
  \u00cdslandi ver\u00f0i bo\u00f0i\u00f0 upp \u00e1 menntun \u00ed fer\u00f0a\u00fej\u00f3nustu
  \u00e1 h\u00e1sk\u00f3lastigi, og menntun og starfs\u00fej\u00e1lfun \u00ed fer\u00f0a\u00fej\u00f3nustu
  ver\u00f0i einnig \u00ed bo\u00f0i \u00e1 \u00f6\u00f0rum sk\u00f3lastigum. Ranns\u00f3knastarfsemi
  \u00e1 svi\u00f0i fer\u00f0am\u00e1la ver\u00f0i efld \u00feannig a\u00f0 h\u00fan
  ver\u00f0i \u00ed fullu samr\u00e6mi vi\u00f0 \u00fearfir atvinnugreinarinnar og
  sty\u00f0ji vi\u00f0 stefnum\u00f3tun, marka\u00f0sstarf, v\u00f6rupr\u00f3run og
  g\u00e6\u00f0aeftirlit \u00ed atvinnugreininni.\\n\\n4.1.2 Markmi\u00f0 og lei\u00f0ir\\n\\nMenntun
  \u00e1 h\u00e1sk\u00f3lastigi\\n\u00cd bo\u00f0i ver\u00f0i menntun \u00e1 h\u00e1sk\u00f3lastigi,
  sem tekur tillit til \u00fearfa atvinnugreinarinnar. Komi\u00f0 ver\u00f0i \u00e1
  f\u00f3t n\u00e1mi \u00ed fer\u00f0a\u00fej\u00f3nustu innan rekrstrarfr\u00e6\u00f0ideilda
  h\u00e1sk\u00f3la, e\u00f0a annarra deilda \u00fear sem n\u00e1msframbo\u00f0 n\u00fdtist
  fer\u00f0a\u00fej\u00f3nustunnar. Kanna skal m\u00f6guleika \u00e1 menntun lei\u00f0s\u00f6gumanna
  \u00e1 h\u00e1sk\u00f3lastigi, annars vegar \u00f3s\u00e9rh\u00e6ft n\u00e1m lei\u00f0s\u00f6gumanna
  og hins vegar n\u00e1m \u00fear sem s\u00e9rfr\u00e6\u00f0ingar \u00e1 \u00fdmsum
  svi\u00f0um g\u00e6tu b\u00e6tt vi\u00f0 sig lei\u00f0s\u00f6gun\u00e1mi. Hvatt
  er til a\u00f0 n\u00famerandi n\u00e1mskerfi \u00e1 h\u00e1sk\u00f3lastigi taki
  mi\u00f0 af \u00fe\u00f6rfum fer\u00f0a\u00fej\u00f3nustunnar \u00ed n\u00e1msframbo\u00f0i
  s\u00ednu, eftir \u00fev\u00ed sem framast er unnt. Jafnframt er hvatt til \u00feess
  a\u00f0 \u00cdslendingar s\u00e6ki \u00e1fram h\u00e1sk\u00f3lan\u00e1m \u00ed fer\u00f0am\u00e1lafr\u00e6\u00f0um
  erlendis.\\n\\nMenntun \u00e1 framhaldssk\u00f3lastigi\\nAuka og efla skal n\u00e1m
  \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu \u00e1 framhaldssk\u00f3lastigi me\u00f0
  \u00fev\u00ed a\u00f0 n\u00fdta vel \u00e1fangakerfi framhaldssk\u00f3lanna. Tryggt
  s\u00e9 a\u00f0 n\u00e1mi\u00f0 \u00fej\u00f3ni \u00fe\u00f6rfum atvinnugreinarinnar
  me\u00f0 sem bestum haetti og veiti einstaklingum menntun til \u00feess a\u00f0
  \u00e1taka a\u00f0 s\u00e9r st\u00f6rf \u00ed greininni. N\u00e1mi\u00f0 ver\u00f0i
  gert a\u00f0gengilegt sem flestum, m.a. me\u00f0 \u00fev\u00ed a\u00f0 n\u00fdta
  n\u00fat\u00edma samskiptat\u00e6kni. Vi\u00f0 yfirstj\u00f3rni starfsn\u00e1ms
  \u00ed framhaldssk\u00f3lum ver\u00f0i tryggt a\u00f0 g\u00e6tt ver\u00f0i sj\u00f3narmi\u00f0a
  fer\u00f0a\u00fej\u00f3nustunnar og komi\u00f0 til m\u00f3ts vi\u00f0 menntunar\u00fearfar
  atvinnugreinarinnar. Einnig ver\u00f0i kanna\u00f0 hvort koma eigi \u00e1 f\u00f3t
  s\u00e9rst\u00f6ku starfsgreinar\u00e1\u00f0i fer\u00f0a\u00fej\u00f3nustunnar.
  \u00cd n\u00e1mi \u00e1 framhaldssk\u00f3lastigi ver\u00f0i l\u00f6g\u00f0 \u00e1hersla
  \u00e1 a\u00f0 \u00fea\u00f0 veiti a\u00f0gang a\u00f0 frekara n\u00e1mi \u00fe.m.t.
  h\u00e1sk\u00f3lan\u00e1mi. Lj\u00faka skal sem fyrst \u00fattekt Fr\u00e6\u00f0slur\u00e1\u00f0s
  fer\u00f0a\u00fej\u00f3nustunnar \u00e1 n\u00e1mi \u00ed fer\u00f0a\u00fej\u00f3nustu
  og skyldum greinum. \u00c1fram ver\u00f0i unni\u00f0 a\u00f0 \u00fearfagreiningu
  fyrir menntun \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1 framhaldssk\u00f3lastigi
  og settur ver\u00f0i \u00e1 f\u00f3t starfsh\u00f3pur er vinni a\u00f0 \u00fev\u00ed
  a\u00f0 skilgreina og hanna n\u00e1m \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu
  ei n\u00fdti kosti \u00e1fangakerfis framhaldssk\u00f3lanna til hins \u00edtrasta.
  Ger\u00f0 ver\u00f0i tilraun me\u00f0 fjarkennslu framhaldssk\u00f3lan\u00e1msefnis
  \u00e1 svi\u00f0i fer\u00f0afr\u00e6\u00f0i og skyldra greina. Ger\u00f0 ver\u00f0i
  tilraun me\u00f0 kennslu styttri n\u00e1mskei\u00f0a \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu
  me\u00f0 fjarkennslu.\\n\\n4.1.3 Ranns\u00f3knir \u00ed fer\u00f0a\u00fej\u00f3nustu\\n\\nL\u00f6g\u00f0
  ver\u00f0i \u00e1hersla \u00e1 a\u00f0 byggja upp traustan grunn uppl\u00fdsinga
  um st\u00f6\u00f0u og \u00fer\u00f3un fer\u00f0a\u00fej\u00f3nustunnar.\\n\\nKomi\u00f0
  ver\u00f0i upp gagnami\u00f0st\u00f6\u00f0 er safni skipulega \u00f6llum mikilv\u00e6gum
  grunnuppl\u00fdsingum um fer\u00f0a\u00fej\u00f3nustuna.\\n\\nGagnami\u00f0st\u00f6\u00f0in
  leiti eftir samstarfi vi\u00f0 fyrirt\u00e6ki \u00ed fer\u00f0a\u00fej\u00f3nustu,
  sem n\u00fdta uppl\u00fdsingar og ranns\u00f3knir vi\u00f0 stefnum\u00f3tun \u00ed
  rekstri s\u00ednun, um a\u00f0gang a\u00f0 uppl\u00fdsingum og ranns\u00f3knum.\\n\\nGagnami\u00f0st\u00f6\u00f0in
  leiti fanga innanlands og erlendis um uppl\u00fdsingar, ranns\u00f3knir og \u00fer\u00f3unarstarf
  \u00ed fer\u00f0a\u00fej\u00f3nustu.\\n\\nL\u00f6g\u00f0 ver\u00f0i \u00e1hersla
  \u00e1 s\u00f6fnun og \u00farvinnslu uppl\u00fdsinga um slys og \u00f3h\u00f6pp
  sem henda og tengja m\u00e1 a\u00f0b\u00fana\u00f0i og a\u00f0st\u00f6\u00f0u sem
  \u00ed bo\u00f0i eru.\\n\\nGagnami\u00f0st\u00f6\u00f0in n\u00fdti bestu f\u00e1anlegu
  mi\u00f0lunart\u00e6ki til a\u00f0 mi\u00f0la uppl\u00fdsingum til ranns\u00f3knara\u00f0ila
  og fyrirt\u00e6kja.\\n\\nStu\u00f0la\u00f0 ver\u00f0i a\u00f0 \u00fev\u00ed a\u00f0
  ranns\u00f3knir \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu ver\u00f0i efldar.\\n\\nStu\u00f0la\u00f0
  ver\u00f0i a\u00f0 s\u00e9rh\u00e6f\u00f0um ranns\u00f3knum \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu.
  Stofna\u00f0 ver\u00f0i til ranns\u00f3knarstarfsemi \u00e1 h\u00e1sk\u00f3lastigi
  \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu.\\n\\nLeita\u00f0 ver\u00f0i lei\u00f0a
  til \u00feess a\u00f0 virka sem best \u00feau fr\u00e6\u00f0isvi\u00f0 \u00e1 h\u00e1sk\u00f3lastigi
  sem veitt geta inns\u00fdn \u00ed menningararf \u00fej\u00f3\u00f0arinnar me\u00f0
  \u00fea\u00f0 fyrir augum a\u00f0 gera menningarver\u00f0m\u00e6ti \u00fej\u00f3\u00f0arinnar
  a\u00f0gengileg fyrir fer\u00f0a\u00fej\u00f3nustuna.\\n\\nLeita\u00f0 ver\u00f0i
  lei\u00f0a til a\u00f0 virka ranns\u00f3knastofnunar betur \u00ed \u00fe\u00e1g\u00fa
  fer\u00f0a\u00fej\u00f3nustunnar. Kanna\u00f0 ver\u00f0i s\u00e9rtaklega \u00e1
  hvern h\u00e1tt haegt er a\u00f0 n\u00fdta og efla \u00fe\u00e6r grunnranns\u00f3knir,
  sem stunda\u00f0ar eru \u00e1 vegum stofnana H\u00e1sk\u00f3la \u00cdslands og Ranns\u00f3knar\u00e1\u00f0s,
  \u00ed \u00fe\u00e1g\u00fa fer\u00f0a\u00fej\u00f3nustunnar.\\n\\nFer\u00f0am\u00e1lar\u00e1\u00f0i
  ver\u00f0i gert kleift a\u00f0 verja \u00e1rlega nokkrum fj\u00e1rmunum til ranns\u00f3kna,
  til samstarfsverkefna um ranns\u00f3knir og til a\u00f0 yta undir \u00fe\u00e1ttt\u00f6ku
  fyrirt\u00e6kja og ranns\u00f3knastofnana \u00ed hagn\u00fdtum ranns\u00f3kna- og
  \u00fer\u00f3unarverkefnum \u00e1 svi\u00f0i fer\u00f0am\u00e1la.\\n\\n5. Marka\u00f0sm\u00e1l\\n\\n5.1
  Marka\u00f0ss\u00f3kn og kynning\\n\\n5.1.1 Stefnum\u00f3tun\\n\\nStefnt skal a\u00f0
  aukinni marka\u00f0ss\u00f3kn og kynningarstarfsemi, jafnframt \u00fev\u00ed a\u00f0
  efla skilvirkni marka\u00f0sstarfins og a\u00f0 auka ar\u00f0semi \u00ed fer\u00f0a\u00fej\u00f3nustu.\\n\\n5.1.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nKynning \u00e1 heimamarka\u00f0i ver\u00f0i aukin,
  sta\u00f0an \u00e1 \u00feremur st\u00e6rstu erlendu m\u00f6rku\u00f0unum styrkt
  (V-Evr\u00f3pa, Nor\u00f0url\u00f6nd, N-Amer\u00edka), s\u00f3kn aukin \u00ed Austurl\u00f6ndum
  fj\u00e6r og hafin s\u00f3kn \u00e1 n\u00fdjum m\u00f6rku\u00f0um A-Evr\u00f3pu.\\n\\nStj\u00f3rnv\u00f6ld,
  sem hagsmunaa\u00f0ili \u00ed fer\u00f0a\u00fej\u00f3nustu, taki \u00fe\u00e1tt
  \u00ed marka\u00f0sstarf\u00ed og landkynningu heima og erlendis.\\n\\nStj\u00f3rnv\u00f6ld
  l\u00e1ti semja a\u00f0ger\u00f0a\u00e6tlun til n\u00e6stu t\u00edu \u00e1ra \u00ed
  marka\u00f0sstarf\u00ed fer\u00f0a\u00fej\u00f3nustu, \u00ed samvinnu vi\u00f0 a\u00f0ra
  hagsmunaa\u00f0ila.\\n\\n\u00cd a\u00f0ger\u00f0a\u00e6tluninni, sem taki mi\u00f0
  af \u00feeim markmi\u00f0um sem sett eru fram \u00ed \u00feessari stefnum\u00f3tun,
  ver\u00f0i hlutverk stj\u00f3rnavalda og annarra hagsmunaa\u00f0ila \u00ed marka\u00f0sstarf\u00ednu
  skilgreint.\\n\\nLandkynningaraskrifstofur ver\u00f0i opna\u00f0ar \u00e1 n\u00e6stu
  fimm \u00e1rum \u00ed Bretlandi, Frakklandi og Skandinav\u00edu.\\n\\nFer\u00f0am\u00e1laufulltr\u00faar
  starfi vi\u00f0 sendir\u00e1\u00f0 \u00cdslands erlendis \u00fear sem ekki starfa
  s\u00e9rstakar landkynningaraskrifstofur.\\n\\nA\u00f0 jafna dreifingu fer\u00f0amanna
  \u00e1 landinu, \u00ed t\u00edma og sta\u00f0setningu\\n\\nB\u00e6ta \u00fearf n\u00fdtingu
  me\u00f0 \u00fev\u00ed a\u00f0 stu\u00f0la a\u00f0 hagkv\u00e6mri dreifingu fer\u00f0amanna
  um landi\u00f0 eftir \u00e1rst\u00edmum, og viku\u00f0\u00f6gum.\\n\\nStu\u00f0la
  skal a\u00f0 \u00fev\u00ed a\u00f0 teki\u00f0 ver\u00f0i upp vetrarorlof \u00ed
  \u00edslenska sk\u00f3lakerfinu me\u00f0 sam\u00fej\u00f6ppun n\u00faverandi fr\u00eddaga.\\n\\n\u00cd
  marka\u00f0sstarf\u00ed hins opinbera skal leggja \u00e1herslu \u00e1 marka\u00f0ssetningu
  \u00cdslands utan h\u00e1annar.\\n\\nJafnframt skal halda uppi \u00f6flugu marka\u00f0sstarf\u00ed
  fyrir h\u00e1\u00f6nn.\\n\\nMarka\u00f0sstarf\u00ed hins opinbera skal \u00ed auknun
  m\u00e6li beina a\u00f0 skilgreindum markh\u00f3pum og leggja auknna \u00e1herslu
  \u00e1 ar\u00f0semi.\\n\\nAuka samvinnu hagsmunaa\u00f0ila og stj\u00f3rnavalda
  \u00ed marka\u00f0s- og kynningarm\u00e1lum\\n\\nKoma \u00e1 samstarfi hagsmunaa\u00f0ila
  um v\u00ed\u00f0t\u00e6kja \u00e1rlega kynningu \u00ed fj\u00f6lm\u00f6lum, sk\u00f3lum
  og \u00e1 heimilum landsins \u00ed \u00feeim tilgangi a\u00f0 auka \u00e1huga \u00e1
  fer\u00f0al\u00f6gum um \u00cdsland.\\n\\nStj\u00f3rnv\u00f6ld beiti s\u00e9r fyrir
  auknu samstarfi vi\u00f0 n\u00faverandi og n\u00fdja s\u00f6lua\u00f0ila \u00cdslandsfer\u00f0a.\\n\\nFylgjast
  \u00fearf n\u00e1i\u00f0 me\u00f0 og n\u00fdta t\u00e6kif\u00e6ri sem skapast me\u00f0
  n\u00fdrru uppl\u00fdsingatekni.\\n\\n5.2 Brottfluttir \u00cdslendingar og afkomendur
  \u00feeirra\\n\\n5.2.1 Stefnum\u00f3tun\\n\\nStefnt er a\u00f0 auknum tengslum vi\u00f0
  brottflutta \u00cdslendinga og afkomendur \u00feeirra, m.a. Vestur-\u00cdslendinga,
  me\u00f0 \u00fea\u00f0 fyrir augum a\u00f0 vekja \u00e1huga \u00feeirra \u00e1 a\u00f0
  koma til \u00cdslands.\\n\\n5.2.2 Markmi\u00f0 og lei\u00f0ir\\n\\nFj\u00f6lgja
  heims\u00f3knunum \u00cdslendinga og f\u00f3lks af \u00edslenskum uppruna sem b\u00fasett
  er erlendis.\\n\\nHvatt er til a\u00f0 \u00fej\u00f3\u00f0r\u00e6knisf\u00e9l\u00f6g
  efl\u00ed samskipti \u00cdslands og vi\u00f0komandi landa.\\nAukin samvinna ver\u00f0i
  h\u00f6f\u00f0 vi\u00f0 \u00cdslendingaf\u00e9l\u00f6g erlendis.\\nStj\u00f3rnv\u00f6ld
  beiti s\u00e9r fyrir skr\u00e1ningu f\u00f3lks af \u00edslenskum uppruna \u00ed
  Vesturheimi.\\nStj\u00f3rnv\u00f6ld n\u00fdti kynningarm\u00f6guleika sem skapast
  me\u00f0 \u00fe\u00e1ttt\u00f6ku \u00ed samstarfsverkefn\u00ed ellefu Evr\u00f3pupj\u00f3\u00f0a,
  \u201eRoutes to the Roots\u201c.\\n\\n\u00cd bo\u00f0i ver\u00f0i afpreying og \u00f6nnur
  \u00fej\u00f3nusta sem h\u00f6f\u00f0ar til brottfluttra \u00cdslendinga og afkomenda
  \u00feeirra.\\nHvatt er til a\u00f0 sett ver\u00f0i \u00e1 stofn afpreying og \u00fej\u00f3nusta
  (s.s. s\u00e9rt\u00fatb\u00fain s\u00f6fn og \u00e6ttfr\u00e6\u00f0i\u00fej\u00f3nusta)
  vi\u00f0 h\u00e6fi brottflutta \u00cdslendinga og afkomenda \u00feeirra, \u00ed
  l\u00edkingu vi\u00f0 \u00fea\u00f0 sem gert hefur veri\u00f0 \u00ed m\u00f6rgum
  Evr\u00f3pul\u00f6ndum.\\n\\n5.3 Saga og menning \u00ed fer\u00f0a\u00fej\u00f3nustu\\n\\n5.3.1
  Stefnum\u00f3tun\\n\\nStefna skal a\u00f0 \u00fev\u00ed a\u00f0 saga, menning og
  mannl\u00edf \u00cdslendinga \u00ed fort\u00ed\u00f0 og n\u00fat\u00ed\u00f0 ver\u00f0i
  veigamikill \u00fe\u00e1ttur \u00ed fer\u00f0a\u00fej\u00f3nustu. Leggja skal \u00e1herslu
  \u00e1 hi\u00f0 s\u00e9rstaka og fr\u00e1brug\u00f0ana \u00ed menningar\u00f6gu
  \u00cdslendinga, sem er samofin landi og n\u00e1tt\u00faru. \u00c1vallt ver\u00f0i
  ger\u00f0ar miklar kr\u00f6fur um faglega \u00feekkingu \u00feeirra sem pessa \u00fej\u00f3nustu
  veita.\\n\\n5.3.2 Markmi\u00f0\\n\\nHi\u00f0 s\u00e9rstaka \u00ed menningar\u00f6gu
  \u00cdslendinga ver\u00f0i ofi\u00f0 inn \u00ed frambo\u00f0 fer\u00f0a\u00fej\u00f3nustu
  og mannl\u00edf \u00ed fort\u00ed\u00f0 og n\u00fat\u00ed\u00f0 ver\u00f0i gert
  s\u00fdnilegt og a\u00f0gengilegt fer\u00f0am\u00f6nnum.\\nHvatt er til \u00fatg\u00e1fu
  \u00e1 ritum \u00e1 erlendum tungum um \u00edslenska tungu, menningu og s\u00f6gu.\\nYfirv\u00f6ld
  fer\u00f0a\u00f0m\u00e1la stu\u00f0li a\u00f0 \u00fev\u00ed a\u00f0 teki\u00f0 ver\u00f0i
  saman \u00edtarlegt kynningarefni \u00far frumheimildum um \u00edslenska fornmenningu.\\nHvatt
  er til a\u00f0 \u00edslensk s\u00f6fn ver\u00f0i ger\u00f0 n\u00fat\u00edmalegri,
  \u00e1hugaver\u00f0ari og a\u00f0gengilegri fyrir fer\u00f0amenn.\\n\\nS\u00e9rstaklega
  ver\u00f0i l\u00f6g\u00f0 \u00e1hersla \u00e1 merkingu muna \u00e1 erlendum tungum,
  a\u00f0st\u00f6\u00f0u fyrir safngesti og fagmannlega lei\u00f0s\u00f6gn um s\u00f6fn.\\n\\n\u00cd
  marka\u00f0sstarf\u00ed hins opinbera skal skipulega unni\u00f0 a\u00f0 \u00fev\u00ed
  a\u00f0 kynna Leif Eir\u00edksson sem \u00cdslending, s\u00e9rstaklega \u00ed Amer\u00edku.\\n\\n\u00cdslenskt
  mannl\u00edf og atvinnul\u00edf ver\u00f0i kynnt fyrir fer\u00f0am\u00f6nnum\\n\\nHvatt
  er til a\u00f0 n\u00fat\u00edmalistir og menning ver\u00f0i n\u00fdtt \u00ed marka\u00f0sstarf\u00ed
  erlendis.\\n\\nHvatt er til samstarfs fer\u00f0a\u00fej\u00f3nustu vi\u00f0 a\u00f0rar
  atvinnugreinar til a\u00f0 kynna atvinnuvegi n\u00fat\u00edmans fyrir fer\u00f0am\u00f6nnum.\\n\\nA\u00f0gengi
  s\u00f6gusta\u00f0a ver\u00f0i b\u00e6tt til samr\u00e6mis vi\u00f0 \u00edmynd okkar
  sem s\u00f6gu- og menningar\u00fej\u00f3\u00f0ar\\n\\nYfirv\u00f6ld fer\u00f0am\u00e1la
  skulu beita s\u00e9r fyrir \u00fev\u00ed a\u00f0 \u00fej\u00f3nusta vi\u00f0 fer\u00f0amenn
  \u00e1 Pingv\u00f6llum ver\u00f0i veitt allt \u00e1ri\u00f0.\\n\\nA\u00f0 samg\u00f6ngur\u00e1\u00f0uneyti\u00f0
  haldi \u00e1fram vinnu vi\u00f0 uppsetningu s\u00f6guskilta.\\n\\nKynning \u00e1
  s\u00f6gu og menningu \u00cdslendinga ver\u00f0i \u00e1vallt metna\u00f0arfull,
  fr\u00e6\u00f0ileg og faglega fram sett.\\n\\nMenntun lei\u00f0s\u00f6gumanna taki
  mi\u00f0 af ofangreindum markmi\u00f0um.\\n\\n6. Rekstrarumhverfi og a\u00f0sta\u00f0a\\n\\n6.1
  Rekstrarumhverfi og afkoma\\n\\n6.1.1 Stefnum\u00f3tun\\n\\nFer\u00f0apj\u00f3nustunni,
  sem einni af undirst\u00f6\u00f0u vatinnugreinum \u00fej\u00f3\u00f0arinnar, ver\u00f0i
  b\u00faa\u00f0 sam\u00fe\u00e6glegt rekstrarumhverfi og \u00ed samkeppnisl\u00f6ndum
  til a\u00f0 auka framlei\u00f0ni og a\u00f0semi atvinnugreinarinnar \u00ed heild.\\n\\nStefna
  ber a\u00f0 ranns\u00f3knarstarfsemi um rekstur og afkomu fer\u00f0apj\u00f3nustufyrirt\u00e6kja
  og hagt\u00f6lur ver\u00f0i ger\u00f0ar a\u00f0gengilegar m.a. l\u00e1nastofnunum
  og fj\u00e1rfestum.\\n\\n6.1.2 Markmi\u00f0 og lei\u00f0ir\\n\\nAuka n\u00fdtingu
  fj\u00e1rfestinga \u00ed fer\u00f0apj\u00f3nustu\\n\\nKanna\u00f0ur ver\u00f0i m\u00f6guleiki
  \u00e1 frekari samn\u00fdtingu r\u00edkis og einkafyrirt\u00e6kja \u00e1 fj\u00e1rfestingum,
  s.s. h\u00faskost\u00ed og bifrei\u00f0um. \u00cd \u00feeim tilgangi ver\u00f0i
  m.a. ger\u00f0 \u00fattekt \u00e1 heimavistarsk\u00f3lam \u00ed landinu me\u00f0
  tilliti til \u00feess a\u00f0 \u00fear s\u00e9 rekin gisti\u00f0a\u00f0sta\u00f0a
  \u00ed sk\u00f3lafr\u00edrum.\\n\\nMarka\u00f0sstarf beinist a\u00f0 \u00fev\u00ed
  a\u00f0 auka n\u00fdtingu fj\u00e1rfestinga \u00e1 ja\u00f0art\u00edmum og yfir
  vetrart\u00edmann. Opinberir a\u00f0ilar stu\u00f0lir a\u00f0 b\u00e6tti n\u00fdtingu
  fj\u00e1rfestinga \u00ed fer\u00f0apj\u00f3nustu, ekki s\u00edst \u00e1 ja\u00f0art\u00edmum
  og \u00e1 l\u00e1gg\u00f6nn, me\u00f0 \u00fev\u00ed a\u00f0 draga \u00far eigin
  umsvifum, svo fremi sem \u00feau eru \u00ed samkeppni vi\u00f0 fer\u00f0apj\u00f3nustufyrirt\u00e6ki
  og beini vi\u00f0skiptum s\u00ednum til einkaa\u00f0ila.\\n\\nKanna\u00f0 ver\u00f0i
  \u00ed hve miklum m\u00e6li fer\u00f0amennska \u00ed tengslum vi\u00f0 heilbrig\u00f0is\u00fej\u00f3nustu
  geti haft j\u00e1kv\u00e6\u00f0 \u00e1hrif \u00e1 n\u00fdtingu fj\u00e1rfestinga
  \u00ed fer\u00f0apj\u00f3nustu.\\n\\nR\u00fdmka\u00f0ar ver\u00f0i heimildir til
  frambo\u00f0s v\u00f6ru og \u00fej\u00f3nustu\\n\\nHeimildir til afgrei\u00f0slut\u00edmfa
  fer\u00f0apj\u00f3nustufyrirt\u00e6kja (veitingah\u00fasa) \u00e1 fr\u00ed- og helgid\u00f6gum
  ver\u00f0i r\u00fdmka\u00f0ar til a\u00f0 koma til m\u00f3ts vi\u00f0 \u00fearfir
  fer\u00f0amanna.\\n\\nHeimilud ver\u00f0i sala \u00e1fengra drykkja um bor\u00f0
  \u00ed ferjum og flugv\u00e9lum innanlands.\\n\\nFerli ums\u00f3knna um rekstrarleyfi
  fer\u00f0apj\u00f3nustufyrirt\u00e6kja ver\u00f0i einfalda\u00f0.\\n\\nFyrirt\u00e6ki
  \u00ed fer\u00f0apj\u00f3nustu s\u00e9u samkeppnish\u00e6f \u00e1 al\u00fej\u00f3\u00f0amarka\u00f0i\\n\\nGer\u00f0
  ver\u00f0i \u00fattekt \u00e1 samkeppnisst\u00f6\u00f0u \u00edslenskar fer\u00f0apj\u00f3nustu.\\n\\nK\u00f6nnu\u00f0
  ver\u00f0i a\u00f0l\u00f6gunarh\u00e6fni og marka\u00f0sheg\u00f0un fer\u00f0apj\u00f3nustufyrirt\u00e6kja,
  m.a. me\u00f0 \u00fea\u00f0 fyrir augum a\u00f0 l\u00e6kka ver\u00f0 \u00e1 v\u00f6rum
  og \u00fej\u00f3nustu.\\n\\nFer\u00f0apj\u00f3nustufyrirt\u00e6ki b\u00fai vi\u00f0
  heilbrig\u00f0 samkeppnisskilyr\u00f0i innanlands\\n\\nKomu\u00f0 ver\u00f0i \u00e1
  virku eftirliti me\u00f0 skattskilum. Teki\u00f0 ver\u00f0i s\u00e9rstaklega \u00e1
  gjald\u00ferotum s\u00f6mu a\u00f0ila og kennit\u00f3lubreytingum.\\n\\nGengi\u00f0
  ver\u00f0i eftir \u00fev\u00ed a\u00f0 hlutaf\u00e9lg skili \u00e1rsreikningum til
  hlutaf\u00e9lagaskr\u00e1r og hlutafj\u00e1rlorfor\u00f0 ver\u00f0i efnd, t.d. me\u00f0
  banka\u00f0byrg\u00f0um.\\n\\n\u00d6ll mismunun \u00ed skattlagningu fyrirt\u00e6kja,
  sem selja s\u00f6mu v\u00f6ru e\u00f0a \u00fej\u00f3nustu, ver\u00f0i afl\u00f6g\u00f0.\\n\\nL\u00e6kka
  skal ja\u00f0arskatta og almennt draga \u00far tekjutengingum svo f\u00f3lk f\u00e1ist
  frekar til starfa \u00ed fer\u00f0apj\u00f3nustu, utan svarta marka\u00f0arins.\\n\\nGer\u00f0
  ver\u00f0i \u00fattekt \u00e1 \u00fej\u00f3nustu hins opinbera vi\u00f0 atvinnugreinina.\\n\\nA\u00f0
  \u00edslensk vinnul\u00f6ggj\u00f6f skapi vi\u00f0unandi rekstrar\u00f6ryggi\\nStj\u00f3rnv\u00f6ld
  sj\u00e1\u00ed til \u00feess a\u00f0 \u00edslensk vinnul\u00f6ggj\u00f6f skapi nau\u00f0synlegt
  rekstrar\u00f6ryggi \u00ed \u00edslensku atvinnul\u00edf.\\n\\n6.2 Gistista\u00f0ir\\nH\u00d3TEL,
  GISTIH\u00daS, B\u00c6NDAGISTING\\n\\n6.2.1 Stefnum\u00f3tun\\nStefna ber a\u00f0
  \u00fev\u00ed a\u00f0 gistir\u00fdmi \u00e1 \u00cdslandi s\u00e9 samkeppnish\u00e6ft
  og a\u00f0 \u00fej\u00f3nustan ver\u00f0i \u00ed samr\u00e6mi vi\u00f0 mismunandi
  \u00fearfir vi\u00f0skiptavina.\\n\\n6.2.2 Markmi\u00f0 og lei\u00f0ir\\nGistir\u00fdmi
  \u00e1 \u00cdslandi standist kr\u00f6fur vi\u00f0skiptavina og samanbur\u00f0 vi\u00f0
  samkeppnisl\u00f6nd okkar.\\nNefnd \u00e1 vegum samg\u00f6ngur\u00e1\u00f0uneytis
  kanni s\u00e9rstaklega samkeppnisa\u00f0st\u00f6\u00f0u \u00cdslands hva\u00f0 var\u00f0ar
  gistiframbo\u00f0.\\n\\nN\u00faverandi flokkunarkerfi gistista\u00f0a ver\u00f0i
  endursko\u00f0a\u00f0, til a\u00f0 n\u00e1 fram sk\u00fdrari flokkun \u00e1 \u00fej\u00f3nustustigi
  \u00feeirra.\\nKomi\u00f0 ver\u00f0i \u00e1 f\u00f3t samstarfsh\u00f3pi stj\u00f3rnvalda
  og hagsmunaa\u00f0ila til a\u00f0 endursko\u00f0a n\u00fagildandi flokkunarkerfi
  gistista\u00f0a. Nefndin skal skila ni\u00f0urst\u00f6\u00f0um fyrir \u00e1rslok
  1997.\\n\\nStu\u00f0la skal a\u00f0 \u00fev\u00ed a\u00f0 gistir\u00fdmi s\u00e9
  fj\u00f6lbreytt, til a\u00f0 fulln\u00e6gja \u00fe\u00f6rfum hinna mismunandi markh\u00f3pa.\\nMe\u00f0
  hj\u00e1lp marka\u00f0skannana skal skilgreina \u00fearfir vi\u00f0skiptavina var\u00f0andi
  l\u00edklega eftirsprung eftir mismunandi star\u00f0ar- og g\u00e6\u00f0aflokkum
  gistista\u00f0a.\\n\\n\u00cd samr\u00e6mi vi\u00f0 hugmyndafr\u00e6\u00f0i sj\u00e1lfb\u00e6r\u00f0rar
  \u00fer\u00f3unar og markmi\u00f0 um gegnheila \u00edmynd \u00cdslands sem n\u00e1tt\u00faruperad\u00edsar
  skal stefnt a\u00f0 \u00fev\u00ed a\u00f0 sem flestir gistista\u00f0ir hafi umhverfisvernd
  a\u00f0 lei\u00f0arlj\u00f3s\u00ed og geri \u00fe\u00e1 stefnu s\u00fdnilega gestum
  s\u00ednum.\\nHvatt er til \u00feess a\u00f0 sem flestir gistista\u00f0ir taki upp
  umhverfisv\u00e6na rekstrarh\u00e6tti.\\n\u00cd samvinnu vi\u00f0 atvinnugreinina
  skal kynna fyrir rekstrara\u00f0ilum gistista\u00f0a hugmyndafr\u00e6\u00f0i sj\u00e1lfb\u00e6r\u00f0rar
  \u00fer\u00f3unar og m\u00f6guleika umhverfisv\u00e6ns rekstrar gistista\u00f0a.\\n\\nHafa
  skal a\u00f0gengilegar uppl\u00fdsingar um rekstur og afkomu gistista\u00f0a \u00e1
  \u00cdslandi, eftir \u00fev\u00ed sem framast er unnt, til a\u00f0 for\u00f0ast
  fj\u00e1rfestingar bygg\u00f0ar \u00e1 van\u00feekkingu og uppl\u00fdsingaskorti.\\nKomi\u00f0
  skal \u00e1 skipulegri s\u00f6fnun uppl\u00fdsinga, \u00ed samr\u00e1\u00f0i vi\u00f0
  a\u00f0ila sem safna hli\u00f0st\u00e6\u00f0um\\n\\nuppl\u00fdsingum fyrir a\u00f0ra
  \u00fej\u00f3nustustarfsemi, um rekstur og afkomu fer\u00f0a\u00fej\u00f3nustufyrirt\u00e6kja
  og \u00fe\u00e6r ger\u00f0ar a\u00f0gengilegar m.a. l\u00e1nastofnunum og fj\u00e1rfestum.\\n\\nStu\u00f0la
  skal a\u00f0 \u00fev\u00ed a\u00f0 n\u00fdting \u00feess gistir\u00fdmis sem fyrir
  er ver\u00f0i aukin til \u00feess a\u00f0 auka ar\u00f0semi gistista\u00f0anna.
  Hvatt er til a\u00f0 fj\u00e1rfestingum s\u00e9 beint \u00ed endurb\u00e6tur til
  \u00feess a\u00f0 n\u00e1 settum g\u00e6\u00f0amarkmi\u00f0um.\\n\\nStu\u00f0la
  skal a\u00f0 aukinni marka\u00f0sbekkingu stj\u00f3rnenda gistista\u00f0a og a\u00f0
  aukinni almennri menntun og \u00feekkingu starfsf\u00f3lks \u00e1 gistist\u00f6\u00f0um
  til a\u00f0 tryggja \u00fej\u00f3nustuvitund \u00feess.\\n\\nFer\u00f0am\u00e1lar\u00e1\u00f0
  skal \u00ed samvinnu vi\u00f0 Fr\u00e6\u00f0slur\u00e1\u00f0 fer\u00f0a\u00fej\u00f3nustunnar
  meta \u00fe\u00f6rf fyrir menntun starfsf\u00f3lks hj\u00e1 \u00edslenzkum gistist\u00f6\u00f0um.
  \u00cd framhaldi af \u00fev\u00ed skulu stj\u00f3rnv\u00f6ld \u00ed samvinnu vi\u00f0
  atvinnugreinina standa fyrir n\u00e1mskei\u00f0um fyrir starfsf\u00f3lk gistih\u00fasa,
  sem hefur \u00fea\u00f0 a\u00f0 markmi\u00f0i a\u00f0 auka \u00feekkingu \u00feess
  \u00e1 marka\u00f0inum og mikilv\u00e6gi g\u00f3\u00f0rar \u00fej\u00f3nustu \u00fe\u00e6\u00f0i
  vi\u00f0 endurs\u00f6lua\u00f0ila og neytendur. P\u00e1tttaka \u00e1 n\u00e1mskei\u00f0um
  \u00feessum skulu f\u00e6ra vi\u00f0komandi fyrirt\u00e6kjum \u00e1kve\u00f0nar
  vi\u00f0urkenningar.\\n\\n7. Pj\u00f3nustuframbo\u00f0\\n\\n7.1 Afpreying fyrir
  fer\u00f0amenn\\n\\n7.1.1 Stefnum\u00f3tun\\n\\nStefna skal a\u00f0 \u00fev\u00ed
  a\u00f0 afpreying bui vi\u00f0 l\u00f6g og reglur l\u00edkt og gerist me\u00f0 a\u00f0ra
  atvinnustarfsemi og \u00feess ver\u00f0i g\u00e6tt a\u00f0 uppb\u00fdgging afpreyningar
  gerist \u00ed fullri s\u00e1tt vi\u00f0 n\u00e1tt\u00faru \u00cdslands, og gangi
  ekki \u00e1 umhverfisarf komandi kynsl\u00f3\u00f0a.\\n\\n7.1.2 Markmi\u00f0 og
  lei\u00f0ir\\n\\nA\u00f0 tryggja g\u00e6\u00f0i og \u00f6ryggi \u00ed afpreyingu\\n\\nKanna\u00f0
  ver\u00f0i hvort nota eigi sta\u00f0la Evr\u00f3pusambandsins til a\u00f0 au\u00f0velda
  samanbur\u00f0.\\n\\nSamg\u00f6ngur\u00e1\u00f0uneyti\u00f0 og Fer\u00f0am\u00e1lar\u00e1\u00f0i,
  \u00ed samvinnu vi\u00f0 hagsmunaa\u00f0ila, standi a\u00f0 s\u00e9rst\u00f6ku verkefni
  til undirb\u00fanings a\u00f0 breytingum leyfisveitinga vegna afpreyningar.\\n\\nSkilgreindar
  ver\u00f0i helstu h\u00e6fniskr\u00f6fur vegna \u00feeirra er starfa vi\u00f0 e\u00f0a
  reka atvinnustarfsemi \u00fear sem bo\u00f0i\u00f0 er upp \u00e1 afpreyingu. Teki\u00f0
  ver\u00f0i me\u00f0al annars til \u00e1standa tekja og b\u00fana\u00f0ar, \u00f6ryggism\u00e1la,
  trygginga, fj\u00e1rhagsst\u00f6\u00f0u og pers\u00f3nulegrar h\u00e6fni. Ni\u00f0urst\u00f6\u00f0ur
  verkefnisins ver\u00f0i jafnframt n\u00fdttar til stefnum\u00f6rkunar var\u00f0andi
  afpreyingu \u00ed fer\u00f0apj\u00f3nustu.\\n\\nTryggt ver\u00f0i a\u00f0 skipulag
  \u00ed bygg\u00f0 og \u00e1 \u00f3bygg\u00f0um sv\u00e6\u00f0um taki mi\u00f0 af
  \u00fe\u00f6rfum fer\u00f0abj\u00f3nustunnar, og a\u00f0 vi\u00f0 skipulagningu
  s\u00e9 teki\u00f0 mi\u00f0 af hagsmunum \u00f3l\u00edkra tegunda afpreyninga. Hvatt
  er til aukinnar \u00e1herslu \u00e1 heildarskipulag \u00fear sem teki\u00f0 er mi\u00f0
  af hagsmunum fer\u00f0abj\u00f3nustunnar. Einnig eru sveitarf\u00e9lag hv\u00f6tt
  til a\u00f0 huga vel a\u00f0 landnotkun vegna mismunandi tegunda afpreyningar \u00e1
  bygg\u00f0um og \u00f3bygg\u00f0um sv\u00e6\u00f0um og umfer\u00f0ar fer\u00f0amanna
  um \u00feau.\\n\\nAuka \u00fearf uppl\u00fdsingami\u00f0lun um umgengni og a\u00f0gengi,
  vei\u00f0ir\u00e9tt, vei\u00f0it\u00edma og vei\u00f0isv\u00e6\u00f0i sj\u00f3,
  \u00e1 almenningum og \u00e1 afr\u00e9ttum.\\n\\nStj\u00f3rnv\u00f6ld hvetti yfirr\u00e1\u00f0amenn
  vei\u00f0ivatna til a\u00f0 au\u00f0velda a\u00f0gengi a\u00f0 \u00feeim.\\n\\nSamr\u00e6ma
  \u00fearf og auka allt eftirlit me\u00f0 vei\u00f0arf\u00e6rum lax- og silungsvei\u00f0imanna
  sem til landsir koma.\\n\\nB\u00e6ta skal a\u00f0st\u00f6\u00f0u \u00e1 Keflav\u00edkurflugvelli
  til hreinsunar vei\u00f0arf\u00e6rar lax- og silungsvei\u00f0imanna \u00feannig
  a\u00f0 h\u00e6gt s\u00e9 a\u00f0 framfylgja gildandi reglum h\u00e9r \u00e1 landi.\\n\\nTryggja
  \u00fearf a\u00f0 skipulag skotvei\u00f0ifer\u00f0a byggist \u00e1 gildandi l\u00f6gum
  um skotvei\u00f0ar.\\n\\nSettar ver\u00f0i reglur um a\u00f0gengi fer\u00f0apj\u00f3nustunnar
  a\u00f0 au\u00f0lindum sj\u00e1var.\\n\\nSettar skulu reglur um umgengni vi\u00f0
  hvala \u00e1 hvalasl\u00f3\u00f0, sbr. reglur erlendis um fj\u00f6lda b\u00e1ta
  \u00e1 sl\u00f3\u00f0inni, n\u00e1l\u00e6g\u00f0arm\u00f6rk o.fl.\\n\\n\u00cd samvinnu
  vi\u00f0 Hafranns\u00f3knarstofnun ver\u00f0i ger\u00f0 k\u00f6nnun \u00e1 \u00fev\u00ed
  hvar helstu hvalgengdarsv\u00e6\u00f0i umhverfis \u00cdsland s\u00e9 a\u00f0 finna
  og \u00feau skilgreind m.a. eftir hvalategundum.\\n\\nKomi\u00f0 ver\u00f0i \u00e1
  reglubundnum sko\u00f0unum \u00e1 \u00f6llum farart\u00e6kjum sem notu\u00f0 eru
  \u00ed atvinnuskyni vi\u00f0 fer\u00f0apj\u00f3nustu.\\n\\nHaldi\u00f0 ver\u00f0i
  \u00e1fram undirb\u00faningar samg\u00f6ngur\u00e1\u00f0uneytis og Siglingam\u00e1lastofnunar
  r\u00edkisins vegna skr\u00e1ningar og eftirlits me\u00f0 minni b\u00e1tum sem nota
  \u00e1 \u00ed atvinnuskyni.\\n\\nN\u00fa \u00feegar ver\u00f0i hafinn undirb\u00faningur
  a\u00f0 \u00fev\u00ed a\u00f0 koma \u00e1 reglubundnum sko\u00f0unum \u00e1 \u00f6llum
  farart\u00e6kjum \u00ed fer\u00f0a\u00fej\u00f3nustu, og \u00f3\u00f0ru nau\u00f0synlegu
  eftirliti me\u00f0 \u00feeim. \u00deetta \u00e1 m.a. vi\u00f0 um v\u00e9lsl\u00e6\u00f0a
  og minni b\u00e1tu.\\n\\nStefna ber a\u00f0 \u00fev\u00ed a\u00f0 s\u00fa afpreying
  og/e\u00f0a \u00e6vint\u00fdrafer\u00f0ir a\u00f0 sumri og vetri sem bo\u00f0i\u00f0
  er upp \u00e1, byggist sem mest \u00e1 s\u00e9rst\u00f6\u00f0u landsins og tiltekinna
  sve\u00f0a og b\u00e6ti \u00fear me\u00f0 samkeppnisst\u00f6\u00f0u \u00edslenskar
  fer\u00f0a\u00fej\u00f3nustu gagnvart helstu samkeppnisl\u00f6ndum okkar. Hvatt
  er til samvinnu um lagningu og rekur g\u00f6ngulei\u00f0a um landi\u00f0, \u00fear
  sem l\u00f6g\u00f0 er \u00e1hersla \u00e1 s\u00e9rst\u00f6k \u00e1hugasvi\u00f0
  og/e\u00f0a s\u00e9rst\u00f6\u00f0u sve\u00f0a.\\n\\nKoma \u00fearf \u00e1 f\u00f3t
  \u00fatumabundnum starfsh\u00f3pi til \u00feess a\u00f0 vekja \u00e1huga f\u00f3lks,
  kynna hvernig sta\u00f0i\u00f0 er a\u00f0 ger\u00f0 n\u00fdrra g\u00f6ngulei\u00f0a
  og koma fram me\u00f0 hugmyndir og till\u00f6gur a\u00f0 fj\u00f6lbreyttari og betri
  g\u00f6ngufer\u00f0a\u00fej\u00f3nustu, endurb\u00f3tum \u00ed bj\u00f6rgunarm\u00e1lum
  og b\u00e6tti fr\u00e6\u00f0slu.\\n\\nStu\u00f0la skal a\u00f0 ger\u00f0 fr\u00e6\u00f0sluefnis
  um g\u00f6ngu-, hj\u00f3la- og jeppalei\u00f0ir, um tiltekna \u00fe\u00e6tti n\u00e1tt\u00faru
  og s\u00f6gu sem lei\u00f0irnar var\u00f0a og um \u00fatb\u00fana\u00f0 og heg\u00f0un
  \u00ed g\u00f6ngu- og hj\u00f3la-, og jeppafer\u00f0um.\\n\\nA\u00f0gengi a\u00f0
  snj\u00f3 fyrir hvers konar snj\u00f3akstur ver\u00f0i tryggt og settar reglur \u00fear
  a\u00f0 l\u00fatandi, til a\u00f0 raska sem minnst vi\u00f0kv\u00e6mri n\u00e1tt\u00faru
  landsins.\\n\\nStj\u00f3rnv\u00f6ld tryggi vegaa\u00f0gengi a\u00f0 snj\u00f3 sem
  h\u00e6fir til snj\u00f3aksturs.\\n\\nSamg\u00f6ngur\u00e1\u00f0uneyti\u00f0 kanni,
  \u00ed samvinnu vi\u00f0 bj\u00f6rgunara\u00f0ila og hagsmunaa\u00f0ila, nau\u00f0syn
  \u00e1 tilkyningaskyldu farart\u00e6kja \u00ed vetrarfer\u00f0um sem farnar eru
  \u00ed atvinnuskyni.\\n\\nNokkrir \u00fe\u00e6ttir afpreyningar \u00e1rin 1989 og
  1995\\n\\nAfpreying \u00e1 \u00cdslandi 1989\\n\\n- Hestaleigur\\n- Vei\u00f0i\\n-
  Basst\u00f6\u00f0/afsigingar\\n- J\u00f6kul\u00e6rof\\n- \u201eRiver rafting\u201c\\n\\nAf\u00fereyting
  \u00e1 \u00cdslandi 1995\\n\\n- Hestaleigur\\n- Ve\u00f0ri\\n- B\u00e6tisfer\u00f0ir/siglingar\\n-
  J\u00f6klafer\u00f0ir\\n- \\\"River rafting\\\"\\n\\n7.2 Hestafer\u00f0ir\\n\\n7.2.1
  Stefnum\u00f3tun\\n\\nMe\u00f0 hestafer\u00f0um s\u00e9 bo\u00f0i\u00f0 upp \u00e1
  s\u00e9rsta\u00f0a, skemmtilega og fr\u00f3\u00f0lega afpreyingu sem sameinar \u00fativist,
  g\u00f3\u00f0 kynni af \u00edslenska hestinum og n\u00e1tt\u00faru landsins, um
  lei\u00f0 og \u00fe\u00e6r skapa atvinnu og tekjur.\\n\\n7.2.2 Markmi\u00f0 og lei\u00f0ir.\\n\\nTryggja
  nau\u00f0synlegar rei\u00f0lei\u00f0ir og skipulag\u00f0a uppbyggingu \u00e1ningarsta\u00f0a
  er taki tillit til umhverfis\u00fe\u00e1tta \u00ed samr\u00e1\u00f0i vi\u00f0 vi\u00f0komandi
  yfirv\u00f6ld og umr\u00e5dea\u00f0ila lands.\\nVi\u00f0urkenna nau\u00f0syn rei\u00f0vega
  og skipuleggja \u00fe\u00e1 \u00ed tengslum vi\u00f0 skipulag sveitarf\u00e9laga
  og vega-kerfi landsins.\\nSkipulagsyfirv\u00f6ld, Landgr\u00e6\u00f0sla r\u00edkisins,
  umhverfisverndarstofnanir og umr\u00e5deamenn landsv\u00e6\u00f0anna skulu h\u00f6f\u00f0i
  me\u00f0 \u00ed r\u00e1\u00f0um \u00feegar \u00e1ningarsta\u00f0ir eru skipulag\u00f0ir.
  Mikilv\u00e6gt er a\u00f0 framangreindir a\u00f0ilar s\u00fdni skilning \u00e1 mikilv\u00e6gi
  \u00feessa \u00fe\u00e1ttar fer\u00f0a\u00fej\u00f3nustunnar og li\u00f0ki fyrir
  uppbyggingu vi\u00f0unandi \u00e1ningarsta\u00f0a.\\nSetja skal reglur um a\u00f0
  \u00fear sem rei\u00f0lei\u00f0um er loka\u00f0 me\u00f0 g\u00ed\u00f0ingum skuli
  koma fyrir hli\u00f0um sem menn og hestar komast grei\u00f0olega \u00ed gegnum.\\nAfla\u00f0
  ver\u00f0i uppl\u00fdsinga um rei\u00f0lei\u00f0ir, fornar og n\u00fdjar, og \u00fe\u00e6r
  skr\u00e1settar \u00ed samvinnu vi\u00f0 hluta\u00f0eigandi a\u00f0ila. Eldri rei\u00f0g\u00f6tur
  ver\u00f0i merktar, p.m.t. \u00e1hugaver\u00f0ir sta\u00f0ir sem lei\u00f0in liggur
  um.\\nFlokka \u00fearf rei\u00f0veginu og st\u00fdra \u00fev\u00ed hvenceir \u00feeir
  eru opna\u00f0ir og loka\u00f0ir fyrir umfer\u00f0. Eftirlit s\u00e9 haft me\u00f0
  gr\u00f3\u00f0urfarslega vi\u00f0kv\u00e6mum rei\u00f0lei\u00f0um.\\n\\n\u00deeir
  sem bj\u00f3\u00f0a hestafer\u00f0ir \u00ed atvinnuskyni vand\u00ed vel kynningu,
  undirb\u00faning, a\u00f0b\u00fana\u00f0 og fer\u00f0irnar sj\u00e1lftar og hafi
  til \u00feess tilskilin leyfi.\\nHvatt er til \u00feess a\u00f0 vi\u00f0 helstu
  rei\u00f0lei\u00f0ir ver\u00f0i komi\u00f0 upp \u00e1ningarst\u00f6\u00f0um \u00fear
  sem h\u00e6gt er a\u00f0 f\u00e1 mismunandi \u00fej\u00f3nustu, allt fr\u00e1 einf\u00f6ldu
  skj\u00f3li fyrir menn og hesta og upp \u00ed a\u00f0st\u00f6\u00f0u eins og h\u00fan
  gerist best utan \u00fe\u00e9ttbyllis.\\nHvatt er til \u00fatg\u00e1fu einfaldra
  og a\u00f0gengilegra korta yfir rei\u00f0vegi og rei\u00f0lei\u00f0ir innan hvers
  sveitarf\u00e9lags.\\nLei\u00f0s\u00f6gn skal veita \u00ed hestafer\u00f0um sem
  skipulag\u00f0ar eru \u00ed atvinnuskyni.\\nHaldin s\u00e9u n\u00e1mskei\u00f0 fyrir
  \u00fe\u00e1 sem annast lei\u00f0s\u00f6gn \u00ed hestafer\u00f0um.\\n\\n7.3 R\u00e1\u00f0stefnur,
  fundir og hvatafer\u00f0ir\\n\\n7.3.1 Stefnum\u00f3tun\\n\\nStefnt er a\u00f0 \u00fev\u00ed
  a\u00f0 auka hlut funda- og r\u00e1\u00f0stefnufer\u00f0amennsku og hvatafer\u00f0amennsku
  utan h\u00e1annar \u00e1 \u00cdslandi. Einnig er stefnt a\u00f0 \u00fev\u00ed a\u00f0
  \u00feessir fer\u00f0amenn heims\u00e6kja \u00cdsland aftur.\\n\\n7.3.2 Markmi\u00f0
  og lei\u00f0ir\\n\\n\u00cdsland s\u00e9 samkeppnisf\u00e6rt \u00e1 al\u00fej\u00f3\u00f0avettvangi
  \u00e1 marka\u00f0i r\u00e1\u00f0stefna og funda upp a\u00f0 300-500 manns og \u00e1
  marka\u00f0i hvatafer\u00f0a.\\n\\n\u00cd nefnd \u00e1 vegum samg\u00f6ngur\u00e1\u00f0uneytis
  skal s\u00e9rstaklega kanna samkeppnish\u00e6fni \u00cdslands \u00e1 \u00feessum
  s\u00e9rmarku\u00f0um.\\n\\nKanna\u00f0ir ver\u00f0i m\u00f6guleikar \u00e1 rekstri
  r\u00e1\u00f0stefnumi\u00f0st\u00f6\u00f0var \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu.\\n\\nR\u00e1\u00f0stefnu-,
  funda- og hvatafer\u00f0amennska aukist a.m.k. til jafns vi\u00f0 a\u00f0ra \u00fe\u00e6tti
  fer\u00f0amennsku \u00e1 \u00cdslandi\\n\\nAukin \u00e1hersla ver\u00f0i l\u00f6g\u00f0
  \u00e1 a\u00f0 kynna \u00cdsland sem \u00e1kjosanlegan sta\u00f0 fyrir fundi, r\u00e1\u00f0stefnur
  og hvatafer\u00f0ir.\\n\\nStj\u00f3rnv\u00f6ld grei\u00f0i fyrir samskiptum \u00feeirra
  fyrirt\u00e6kja og stofnana sem hafa yfir funda- og r\u00e1\u00f0stefnu\u00f0st\u00f6\u00f0u
  a\u00f0 r\u00e6\u00f0a og skipuleggjendum r\u00e1\u00f0stefna og funda, vegna a\u00f0gengis
  a\u00f0 fundas\u00f6llum.\\n\\nFyrir hendi ver\u00f0i a\u00f0gengilegar uppl\u00fdsingar
  um r\u00e1\u00f0stefnu-funda- og hvatafer\u00f0amarka\u00f0inn\\n\\nHafin ver\u00f0i
  markviss uppl\u00fdsingas\u00f6fnun um r\u00e1\u00f0stefnu-, funda- og hvatafer\u00f0a-marka\u00f0inn.\\n\\n\u00cd
  marka\u00f0sk\u00f6nnunum hins opinbera skal s\u00e9rstaklega kanna \u00feessa markh\u00f3pa.\\n\\nR\u00e1\u00f0stefnu-,
  funda- og hvatafer\u00f0amenn heims\u00e6kja \u00cdsland aftur, sem almennir fer\u00f0amenn.\\n\\nStj\u00f3rnv\u00f6ld
  kynni \u00cdsland fyrir r\u00e1\u00f0stefnu- og fundagestum og hvatafer\u00f0am\u00f6nnum
  sem \u00e1kjosanlegt fer\u00f0amannaland. Pa\u00f0 skal gert me\u00f0 \u00fev\u00ed
  a\u00f0 s\u00e9rhanna og dreifa \u00e1hugaver\u00f0u uppl\u00fdsinga- og kynningarefni.\\n\\n7.4
  Heilsutengd fer\u00f0apj\u00f3nusta\\n\\n7.4.1 Stefnum\u00f3tun\\n\\nStefnt skal
  a\u00f0 \u00fev\u00ed a\u00f0 auka fer\u00f0amennsku \u00ed tengslum vi\u00f0 heilsub\u00f3t
  og heilbrig\u00f0i, \u00fear sem l\u00f6g\u00f0 ver\u00f0ur \u00e1hersla \u00e1
  \u00fe\u00e1 \u00fe\u00e6tti \u00fear sem \u00cdsland hefur s\u00e9rst\u00f6\u00f0u,
  einnig a\u00f0 hefja marka\u00f0ssettingu \u00e1 almennri heilbrig\u00f0is\u00fej\u00f3nustu.\\n\\n7.4.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nA\u00f0 \u00cdsland ver\u00f0i \u00feekkt sem hreint
  og \u00f3menga\u00f0 land, \u00fear sem h\u00e6gt er a\u00f0 stunda heilsur\u00e6kt
  \u00ed n\u00e1tt\u00farulegu umhverfi.\\n\\nKanna\u00f0 ver\u00f0i e\u00f0li og
  umfang heilsufer\u00f0amennsku \u00e1 okkar st\u00e6rstu marka\u00f0ssv\u00e6\u00f0um
  erlendis, \u00ed \u00fev\u00ed skyni a\u00f0 greina og n\u00fdta m\u00f6guleika
  \u00cdslands \u00e1 \u00feessu svi\u00f0i.\\n\\nA\u00f0 \u00cdslendingar skapi s\u00e9r
  sess sem \u00fej\u00f3\u00f0 sem \u00feekkt er fyrir fyrsta flokks heilbrig\u00f0is\u00fej\u00f3nustu.
  \u00cd samvinnu vi\u00f0 fulltr\u00faa heilbrig\u00f0iskerfisins skal kanna m\u00f6guleika
  \u00e1 s\u00f6lu \u00e1 heilbrig\u00f0is\u00fej\u00f3nustu til erlendra a\u00f0ila.\\n\\nKanna\u00f0
  ver\u00f0i a\u00f0 hve miklu leyti fer\u00f0amennska \u00ed tengslum vi\u00f0 heilbrig\u00f0is\u00fej\u00f3nustu
  hafi j\u00e1kv\u00e6\u00f0 \u00e1hrif \u00e1 n\u00fdtingu fj\u00e1rfestinga \u00ed
  fer\u00f0apj\u00f3nustu.\\n\\n7.5 V\u00edsinda- og ranns\u00f3knafer\u00f0ir\\n\\n7.5.1
  Stefnum\u00f3tun\\n\\nStefna ber a\u00f0 \u00fev\u00ed a\u00f0 n\u00fdta s\u00e9reinkenni
  n\u00e1tt\u00faru \u00cdslands og s\u00e9r\u00feekkingu \u00cdslendinga \u00e1 \u00fdmsum
  svi\u00f0um \u00ed fer\u00f0apj\u00f3nustu og auka samvinnu \u00e1 milli fer\u00f0apj\u00f3nustu
  og v\u00edsindama\u00f0ra.\\n\\n7.5.2 Markmi\u00f0 og lei\u00f0ir\\n\\nAuka \u00fearf
  samvinnu milli samtaka fer\u00f0apj\u00f3nustu, mennta- og ranns\u00f3knar-stofnana
  svo au\u00f0veldara ver\u00f0i a\u00f0 n\u00fdta reynslu v\u00edsindamanna og \u00feekkingu
  \u00e1 \u00fdmsum \u00fe\u00e1ttum \u00fej\u00f3\u00f0f\u00e9lagssins.\\n\\nM\u00f3ta
  skal samstarfsvettvang e\u00f0a tengslanet fyrir fer\u00f0apj\u00f3nustu \u00e1
  \u00cdslandi. Vettvangur \u00feessi skal n\u00fdtast til a\u00f0 sam\u00fe\u00e6tta
  \u00fe\u00e6r greinar \u00fej\u00f3\u00f0l\u00edfsins sem framb\u00e6rilegar teljast
  innan fer\u00f0apj\u00f3nustu og au\u00f0velda a\u00f0f\u00f6ng vi\u00f0 nau\u00f0synlega
  \u00fer\u00f3unarvinnu.\\n\\nHvatt er til samstarfs fyrrit\u00e6kja \u00ed fer\u00f0apj\u00f3nustu,
  v\u00edsinda- og ranns\u00f3knastofnana og s\u00e9rfr\u00e6\u00f0inga. Hvatt er
  til \u00feess a\u00f0 h\u00e1sk\u00f3lar og a\u00f0rar mennta-, v\u00edsinda- og
  ranns\u00f3knastofnunar komi til m\u00f3ts vi\u00f0 bei\u00f0nir v\u00edsindamanna,
  sk\u00f3la og stofnana erlendis um frambo\u00f0 \u00e1 fr\u00e6\u00f0slufer\u00f0um
  \u00ed samvinnu s\u00e9rfr\u00e6\u00f0inga og fer\u00f0a\u00fej\u00f3nustua\u00f0ila.\\n\\nA\u00f0
  n\u00fdta \u00feekkingu \u00cdslendinga \u00e1 eigin n\u00e1tt\u00faru og menningu\\nFer\u00f0a\u00fej\u00f3nustua\u00f0ilar
  eru hvattir til a\u00f0 n\u00fdta s\u00e9r s\u00e9r\u00feekkingu \u00e1 n\u00e1tt\u00faruv\u00edsindum
  og menningu sem fyrir hendi er.\\n\\nAuka samvinnu um ranns\u00f3knaverkefni \u00e1
  milli \u00cdslendinga og erlendra v\u00edssindamanna\\nHvatt er til aukinnar samvinnu
  vi\u00f0 erlenda ranns\u00f3knara\u00f0ila og a\u00f0 \u00feeim ver\u00f0i gert
  kleift a\u00f0 stunda ranns\u00f3knir \u00e1 \u00cdslandi.\\n\\n7.6 Uppl\u00fdsinga\u00fej\u00f3nusta
  fyrir fer\u00f0amenn\\n\\n7.6.1 Stefnum\u00f3tun\\nStefnt skal a\u00f0 \u00fev\u00ed
  a\u00f0 fer\u00f0amenn geti sem v\u00ed\u00f0ast fengi\u00f0 nau\u00f0synlegar uppl\u00fdsingar
  \u00ed a\u00f0gengilegu formi og a\u00f0 fer\u00f0al\u00f6g ver\u00f0i ger\u00f0
  \u00f6rruggari me\u00f0 notkun n\u00fdjustu uppl\u00fdsingata\u00e6kni.\\n\\n7.6.2
  Markmi\u00f0 og lei\u00f0ir\\nAuka \u00fearf uppl\u00fdsingafl\u00e6\u00f0i milli
  kaupenda og seljenda \u00ed fer\u00f0a\u00fej\u00f3nustu\\nStj\u00f3rnv\u00f6ld
  beiti s\u00e9r fyrir ger\u00f0 \u00cdslandskynningar, \u00fear sem kynntir ver\u00f0a
  allir fer\u00f0am\u00f6guleikar \u00e1 \u00cdslandi og n\u00fdti til \u00feess n\u00fdjustu
  uppl\u00fdsingata\u00e6kni.\\nStj\u00f3rnv\u00f6ld styrti enn frekar uppl\u00fdsingami\u00f0lun
  um frambo\u00f0 \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi og geri
  \u00fea\u00f0 a\u00f0gengilegt kaupendum, innlendum og erlendum.\\n\\nTryggt ver\u00f0i
  nau\u00f0synlegt fl\u00e6\u00f0i uppl\u00fdsinga, sem snerta \u00f6ryggi fer\u00f0amanna\\nKomi\u00f0
  ver\u00f0i \u00e1 f\u00f3t samstarfi milli stj\u00f3rnavalda, V\u00e9\u00f0urstofu,
  Vegager\u00f0ar, Rkis\u00fatvarps, Umfer\u00f0arr\u00e1\u00f0s, l\u00f6greglu o.fl.
  \u00ed \u00feessum tilgangi.\\n\\nG\u00e6\u00f0i uppl\u00fdsinga til fer\u00f0amanna
  ver\u00f0i trygg\u00f0 sem v\u00ed\u00f0ast\\nSveitarf\u00e9l\u00f6g, einstaklingar,
  hagsmunaa\u00f0ilar e\u00f0a fyrirt\u00e6ki, sem reka uppl\u00fdsingasetur/uppl\u00fdsingami\u00f0st\u00f6\u00f0var
  me\u00f0 uppl\u00fdsingum \u00e1 landsv\u00edsu, \u00feurfu a\u00f0 uppfylla til
  \u00feess skilyr\u00f0i, sem stj\u00f3rnv\u00f6ld skulu setja. Stj\u00f3rnv\u00f6ld
  veiti \u00feeim s\u00ed\u00f0an a\u00f0gang a\u00f0 sameiginlegum uppl\u00fdsingabanka.\\nStj\u00f3rnv\u00f6ld
  tryggi fr\u00e6\u00f0slu og \u00fej\u00e1lfun starfsf\u00f3lks uppl\u00fdsingasetra
  og veiti rekstrarleyfi.\\nUppl\u00fdsingasetur skulu nota samr\u00e6mdar merkingar,
  svo a\u00f0 neytandi viti a\u00f0 \u00fear eru gefnar uppl\u00fdsingar \u00e1 landsv\u00edsu
  og a\u00f0 uppl\u00fdsingasetri\u00f0 n\u00fdtur g\u00e6\u00f0aeftirlits stj\u00f3rnavalda.\\n\\nGer\u00f0ar
  ver\u00f0i a\u00f0gengilegar uppl\u00fdsingar um n\u00e1tt\u00faru landsins og umfer\u00f0
  \u00ed \u00f3bygg\u00f0um og \u00feeim dreifit til fer\u00f0amanna.\\nKoma skal
  \u00e1 samstarfi N\u00e1tt\u00faruverndarr\u00e1\u00f0s, Fer\u00f0am\u00e1lar\u00e1\u00f0s,
  Vegager\u00f0arinnar, umhverfisr\u00e1\u00f0uneytis o.fl. um \u00fatg\u00e1fu og
  dreifingu sl\u00edkra uppl\u00fdsinga.\\n\\nKoma skal upp sameiginlegum uppl\u00fdsingabanka
  fer\u00f0a\u00fej\u00f3nustunnar \u00fear sem fyrirt\u00e6ki \u00ed fer\u00f0a\u00fej\u00f3nustu
  og almenningur geta \u00e1 au\u00f0veldan h\u00e1tt n\u00e1lgast allar tilt\u00e6kjar
  uppl\u00fdsingar um atvinnugreinina.\\n\\nMe\u00f0 a\u00f0sto\u00f0 uppl\u00fdsingat\u00e6kni\u00f0ar
  skulu stj\u00f3rnv\u00f6ld beita s\u00e9r fyrir uppl\u00fdsingami\u00f0lun um \u00cdsland
  \u00fear sem \u00e1hersla ver\u00f0ur l\u00f6g\u00f0 \u00e1 \u00fe\u00e1 fer\u00f0am\u00f6guleika
  sem landi\u00f0 og umhverfi\u00f0 hefur upp \u00e1 a\u00f0 bj\u00f3\u00f0a.\\n\\nKr\u00f6fur
  ver\u00f0i ger\u00f0ar til \u00feeirra sem dreifa uppl\u00fdsingum \u00ed gegnum
  uppl\u00fdsingami\u00f0st\u00f6\u00f0var fer\u00f0am\u00e1la um a\u00f0 \u00fe\u00e6r
  fari allar inn \u00ed uppl\u00fdsingabankann.\\n\\nGagnabankinn skal veita vanda\u00f0ar
  uppl\u00fdsingar sem stu\u00f0la a\u00f0 \u00f6ryggi fer\u00f0amanna.\\n\\nSveitarf\u00e9l\u00f6g,
  fyrirt\u00e6ki, einstaklingar e\u00f0a hagsmunaa\u00f0ilar skulu allir hafa m\u00f6guleika
  \u00e1 a\u00f0 koma uppl\u00fdsingum inn \u00ed gagnabankann.\\n\\nA\u00f0ilar sem
  vilja f\u00e1 n\u00e1nari uppl\u00fdsingar um \u00cdsland hafi a\u00f0gang a\u00f0
  svar\u00fej\u00f3nustu \u00ed gegnum uppl\u00fdsingabankann.\\n\\nHandb\u00e6kur
  Fer\u00f0am\u00e1lar\u00e1\u00f0s skulu settar inn \u00ed uppl\u00fdsingabankann.\\n\\nAlmennar
  vegamerkingar og skilti ver\u00f0i \u00ed samr\u00e6mi vi\u00f0 vi\u00f0urkenndu
  evr\u00f3pska e\u00f0a al\u00fej\u00f3\u00f0lega sta\u00f0la.\\n\\n7.7 Fer\u00f0amannaverslun\\n\\n7.7.1
  Stefnum\u00f3tun\\n\\nStefna ber a\u00f0 \u00fev\u00ed a\u00f0 auka fer\u00f0amannaverslun
  og l\u00edta ber \u00e1 hana sem mikilv\u00e6gan hluta af fer\u00f0a\u00fej\u00f3nustu.\\n\\n7.7.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nA\u00f0 auka verulega fer\u00f0amannaverslun \u00e1
  \u00cdslandi\\n\\nFramkv\u00e6md endurgrei\u00f0slu vir\u00f0isaukaskatts ver\u00f0i
  \u00ed h\u00f6ndum einkaa\u00f0ila og \u00fear me\u00f0 marka\u00f0sv\u00e6dd.\\n\\nEndurgrei\u00f0slan
  ver\u00f0i au\u00f0veldu\u00f0.\\n\\nEndurgrei\u00f0sluhlutfall\u00f0 ver\u00f0i
  h\u00e6kka\u00f0 sem m\u00f6gulegt er.\\n\\nTakmarkanir \u00e1 upph\u00e6\u00f0
  ver\u00f0i l\u00e6kka\u00f0ar.\\n\\nRekstur Flugst\u00f6\u00f0var Leifs Eir\u00edkssonar
  s\u00e9 \u00e1 hendri a\u00f0ila sem hafa vi\u00f0skiptaleg sj\u00f3narmi\u00f0
  a\u00f0 lei\u00f0arlj\u00f3s\u00ed.\\n\\nVerslunarr\u00edmi \u00ed flugst\u00f6\u00f0
  Leifs Eir\u00edkssonar ver\u00f0i auki\u00f0 og fleiri a\u00f0ilum bo\u00f0in a\u00f0sta\u00f0a.\\n\\n8.
  Samg\u00f6ngur og umhverfism\u00e1l\\n\\n8.1 Samg\u00f6ngur\\n\\n8.1. Stefna\\n\\nUnnt
  ver\u00f0i a\u00f0 flytja a\u00f0 og fr\u00e1 landinu \u00fe\u00e1 fer\u00f0amenn
  sem sko\u00f0a vilja og heims\u00e6kja landi\u00f0, \u00e1 hagkv\u00e6man og ar\u00f0b\u00e6rar
  h\u00e1tt. \u00deetta gildir jafnt um flutninga a\u00f0 og fr\u00e1 landinu, sem
  og \u00e1 milli sta\u00f0a innanlands. Frj\u00e1lsr\u00e6\u00f0i \u00ed flutningum
  r\u00edki eftir \u00fev\u00ed sem kostur er.\\n\\nKeflav\u00edkurflugv\u00f6llur
  gegni \u00e1fram hlutverki s\u00ednu sem a\u00f0almillilandaflugv\u00f6llur landsins
  og Reykjav\u00edkurflugv\u00f6llur ver\u00f0i mi\u00f0st\u00f6\u00f0 innanlandsflugs.\\n\\n8.1.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nFLUG\\n\\nA\u00f0st\u00e6\u00f0ur ver\u00f0i fyrir
  hendi til \u00feess a\u00f0 flugf\u00e9lag anni e\u00f0lilegri flutnings\u00fe\u00f6rf
  og geti haldi\u00f0 uppi reglugubundnu flugi \u00e1ri\u00f0 um kring a\u00f0 og
  fr\u00e1 landinu og innanlands.\\n\\nR\u00e1\u00f0ist ver\u00f0i \u00ed st\u00e6kkun
  innritunaradst\u00f6\u00f0u Leifsst\u00f6\u00f0var. Ver\u00f0i af a\u00f0ild \u00cdslands
  a\u00f0 Schengen-samkomulaginu \u00fearf fulln\u00e6gjandi a\u00f0st\u00f6\u00f0u,
  m.a. fleiri flugv\u00e9last\u00e6\u00f0i til \u00feess a\u00f0 tafir ver\u00f0i
  ekki \u00e1 afgrei\u00f0slu farpega \u00e1 milli Amer\u00edku og Evr\u00f3pu.\\n\\nA\u00f0st\u00e6\u00f0ur
  \u00e1 flugv\u00f6llum ver\u00f0i \u00feannig, a\u00f0 truflanir vegna ve\u00f0urs
  ver\u00f0i \u00ed l\u00e1gmarki.\\n\\nStj\u00f3rnv\u00f6ld b\u00e6ti \u00far skorti
  \u00e1 t\u00e6kjab\u00fana\u00f0i innanlandsflugvalla.\\n\\nStj\u00f3rnv\u00f6ld
  beiti s\u00e9r fyrir endurb\u00f3tum \u00e1 Reykjav\u00edkurflugvelli og byggingu
  flugst\u00f6\u00f0var fyrir allt innanlandsflug \u00e1 einum sta\u00f0 og leita
  hagkv\u00e6masta rekstrarforms.\\n\\nEgilssta\u00f0aflugv\u00f6llur ver\u00f0i rekinn
  \u00e1 \u00feann h\u00e1tt a\u00f0 hann n\u00fdtist b\u00e6\u00f0i sem innanlandsflugv\u00f6llur
  og varaflugv\u00f6llur \u00ed millilandaflugi.\\n\\nFlugumfer\u00f0arpj\u00f3nusta
  \u00e1 N-Atlantshafi haldi st\u00f6\u00f0u sinni til a\u00f0 afla tekna fyrir flugsamg\u00f6ngur
  \u00e1 \u00cdslandi.\\n\\nFlugm\u00e1lastj\u00f3r ver\u00f0i sj\u00e1lfst\u00e6tt
  r\u00edkisfyrt\u00e6ki sem r\u00e1\u00f0i yfir \u00f6llum tekjum og gj\u00f6ldum
  vegna flugsamgangna, \u00fe.m.t. \u00feeim sem ver\u00f0a til \u00ed Flugst\u00f6\u00f0
  Leifs Eir\u00edkssonar.\\n\\nMarka\u00f0sa\u00f0gengi flugf\u00e9lagar ver\u00f0i
  b\u00e6tt.\\n\\nAfla \u00fearf frekari flugheimilda \u00ed Mi\u00f0- og A-Evr\u00f3pu
  og landa utan Evr\u00f3pu me\u00f0 ger\u00f0 loftfer\u00f0asamninga, \u00fear sem
  l\u00f6g\u00f0 er \u00e1hersla \u00e1 sem mest frelsi.\\n\\n\u00cdsland ver\u00f0i
  a\u00f0ili a\u00f0 n\u00fdjum samningi Evr\u00f3pusambandsins um frj\u00e1lst flug
  vi\u00f0 \u00f6nnur r\u00edki, s.s. Bandar\u00edkin, A-Evr\u00f3pu og Mi\u00f0jar\u00f0arhafsr\u00edki.\\n\\nVEGIR\\nVegakerfi
  me\u00f0 bundnu slitlagi (stofnvegir, tengivegir) n\u00e1 \u00ed kringum landi\u00f0
  (hringvegurinn), til allra \u00feeitb\u00fdlissta\u00f0a og til helstu fer\u00f0amannasta\u00f0a
  \u00ed bygg\u00f0.\\n\\nTil ver\u00f0i torf\u00e6ir vegir og sl\u00f3\u00f0ar og
  einnig hef\u00f0bundnr malarvegir.\\nM\u00f3tu\u00f0 ver\u00f0i stefna um f\u00e6r\u00f0
  vega, \u00fe.e. hva\u00f0a vegir skuli vera g\u00f3\u00f0vegir, hverjir torf\u00e6ir
  o.s.frv. Gert ver\u00f0i r\u00e1\u00f0 fyrir \u00fe\u00f6rfum fer\u00f0apj\u00f3nustu
  fyrir vegi og sl\u00f3\u00f0a vi\u00f0 ger\u00f0 a\u00f0alskipulags fyrir h\u00e1lendi
  \u00cdslands.\\n\\nBifrei\u00f0afyrirt\u00e6ki nj\u00f3ti samb\u00e6rilegra rekstrarskilyr\u00f0a
  og \u00ed l\u00f6ndum Evr\u00f3pusambandsins.\\nReglum og, ef \u00fearf, l\u00f6gum
  um a\u00f0flutningsgj\u00f6ld, vir\u00f0isaukaskatt, \u00feungaskatt/ol\u00edugjald
  af f\u00f3lksflutningab\u00edlum, \u00fe.m.t. b\u00edlaleigub\u00edlum, og um star\u00f0ir
  h\u00f3pbifrei\u00f0a (r\u00fatub\u00edla), ver\u00f0i breytt til b\u00e6trar samkeppnisst\u00f6\u00f0u.\\nReglur
  um skattlagingu f\u00f3lksflutningab\u00edla, \u00fe.m.t. b\u00edlaleigub\u00edla,
  ver\u00f0i f\u00e6r\u00f0ar til samr\u00e6mis vi\u00f0 reglur \u00ed helstu samkeppnisl\u00f6ndum
  \u00ed Evr\u00f3pu.\\n\\nVi\u00f0 ger\u00f0 vega\u00e1\u00e6tlunar og a\u00f0rar
  \u00e1kv\u00e6\u00f0anir um r\u00e1\u00f0st\u00f6fun fj\u00e1r til vegam\u00e1la
  ver\u00f0i teki\u00f0 tillit til fer\u00f0apj\u00f3nustu.\\nGer\u00f0ar ver\u00f0i
  nau\u00f0synlegar breytingar \u00e1 vega\u00e1\u00e6tlun, snj\u00f3mokstursreglum
  og, ef \u00fearf, vegal\u00f6gum, me\u00f0 \u00fearfir fer\u00f0apj\u00f3nustu \u00ed
  huga.\\n\\nSveitarf\u00e9l\u00f6g, frj\u00e1ls f\u00e9lagasamt\u00f6k og \u00e1hugamannaf\u00e9l\u00f6g
  ver\u00f0i hv\u00f6tt til a\u00f0 taka a\u00f0 s\u00e9r torf\u00e6ra og/e\u00f0a
  afskekkta vegi og sl\u00f3\u00f0a.\\nTil endurb\u00f3ta, vi\u00f0halds og reksturs
  sl\u00edkra vega ver\u00f0i veittir styrkir af fj\u00e1rveitingum til landsvega.\\n\\nFERJUR\\nA\u00f0sta\u00f0a
  \u00ed ferjuh\u00f6fnum ver\u00f0i fulln\u00e6gjandi fyrir \u00f6ryggi siglinga,
  \u00f6ryggi og \u00fe\u00e6gindi far\u00feega og a\u00f0ra starfsemi sem nau\u00f0synleg
  er, svo sem tollg\u00e6slu og fr\u00edh\u00f6fn vi\u00f0 millilandaferju.\\nVi\u00f0
  h\u00f6nnun st\u00f3rra flutningahafna og framkv\u00e6mdir vi\u00f0 \u00fe\u00e6r
  ver\u00f0i gert r\u00e1\u00f0 fyrir a\u00f0 taka megi skemmtifer\u00f0askip a\u00f0
  bryggju.\\n\\nFerjulei\u00f0ir ver\u00f0i skilgreindar sem s\u00e9rstakur hluti
  vegakerfisins og \u00feeim gefin vegn\u00famer.\\nVegal\u00f6gum ver\u00f0i breytt
  \u00feannig a\u00f0 b\u00e6tt ver\u00f0i vi\u00f0 n\u00fdjum flokki vega: Ferjulei\u00f0um.\\nVi\u00f0
  ger\u00f0 vega\u00e1\u00e6tlunar hverju sinni ver\u00f0i gert r\u00e1\u00f0 fyrir
  fj\u00e1rveitingum til ferja eins og \u00fearf til a\u00f0 halda uppi siglingum
  \u00feeirra me\u00f0 fyllsta \u00f6ryggi.\\n\\nSveitarf\u00e9l\u00f6g taki tillit
  til a\u00f0gengis fer\u00f0amanna \u00ed h\u00f6fnum landsins.\\nHuga ber a\u00f0
  \u00f6ryggism\u00e1lum og snyrtia\u00f0st\u00f6\u00f0u fyrir fer\u00f0amenn \u00ed
  h\u00f6fnum landsins.\\n\\n8.2 Sj\u00e1lfb\u00e6r fer\u00f0amennska og umhverfisvernd\\n\\n8.2.1
  Stefnum\u00f3tun\\n\\nFer\u00f0a\u00fej\u00f3nustu \u00ed anda sj\u00e1lfb\u00e6rrar
  pr\u00f3unar ver\u00f0i efla, \u00feannig a\u00f0 h\u00e9r \u00e1 landi ver\u00f0i
  rekin fer\u00f0amennska \u00ed s\u00e1tt vi\u00f0 land og \u00fej\u00f3\u00f0. Stefnt
  skal a\u00f0 \u00fev\u00ed a\u00f0 \u00cdsland gegni forystuhlutverki \u00e1 svi\u00f0i
  umhverfisverndar. Trygg\u00f0ur ver\u00f0i frj\u00e1ls a\u00f0gangur fer\u00f0amanna
  a\u00f0 \u00f6llu landinu en \u00feess jafnframt g\u00e6tt a\u00f0 rekstur og uppbygging
  \u00e1 fer\u00f0amannast\u00f6\u00f0um spilli ekki n\u00e1tt\u00faru landsins og
  umhverfi og a\u00f0 fer\u00f0amenn dreifist um landi\u00f0 til a\u00f0 minnka \u00e1lag
  \u00e1 einstaka sta\u00f0i.\\n\\n8.2.2 Markmi\u00f0 og lei\u00f0ir\\n\\nSkapa \u00cdslandi
  s\u00e9rst\u00f6\u00f0u \u00e1 svi\u00f0i umhverfism\u00e1la.\\nSkipulega skal vinna
  a\u00f0 \u00fev\u00ed a\u00f0 marka\u00f0setja landi\u00f0 sem hreint og \u00f3mengad
  fer\u00f0amannaland.\\n\\nFer\u00f0amennska ver\u00f0i n\u00fdtt sem afl til verndunar
  au\u00f0lindum og vi\u00f0halds n\u00e1tt\u00farulegs umhverfis. Einnig ver\u00f0i
  menning og arfleif\u00f0 \u00fej\u00f3\u00f0arinnar n\u00fdtt \u00e1 ar\u00f0v\u00e6nlegan
  h\u00e1tt.\\nSkipa\u00f0ur ver\u00f0i vinnuh\u00f3pur til a\u00f0 beita s\u00e9r
  fyrir a\u00f0 au\u00f0lindir fer\u00f0a\u00fej\u00f3nustu ver\u00f0i skilgreindar
  og kortlag\u00f0ar, jafnt n\u00e1tt\u00farulegar sem menningarlegar, og ger\u00f0ar
  ver\u00f0i ranns\u00f3knir \u00e1 st\u00f6\u00f0u \u00feeirra me\u00f0 tilliti til
  j\u00e1kv\u00e6\u00f0ra og neikv\u00e6\u00f0ra \u00e1hrifa.\\nSt\u00f3rauka \u00fearf
  fr\u00e6\u00f0slu og uppl\u00fdsingar um samspil fer\u00f0amennsku og umhverfis,
  verndun og uppbyggingu \u00e1 n\u00e1tt\u00farulegum og menningarlegum au\u00f0lindum
  og veita uppl\u00fdsingar um \u00e1stand m\u00e1la \u00ed \u00feessum efnum.\\nStj\u00f3rnv\u00f6ld
  hafi eftirlit me\u00f0 skipulagi og uppbyggingu fer\u00f0amannasta\u00f0a.\\nMe\u00f0
  ranns\u00f3knarverkefnum sem tengjast n\u00e1tt\u00faruvernd og \u00e1lagi \u00e1
  fer\u00f0amannasta\u00f0i, sem n\u00e1 yfir \u00e1kve\u00f0in \u00e1rabil, ver\u00f0i
  h\u00e6gt a\u00f0 fylgjast me\u00f0 hvort atvinnugreinin s\u00e9 \u00e1 r\u00e9ttri
  lei\u00f0 \u00ed uppbyggingu \u00feeirra og umhverfisvernd.\\n\\nStu\u00f0la a\u00f0
  fr\u00e6\u00f0slu um umgengni vi\u00f0 n\u00e1tt\u00faru landsins og hvetja til
  aukinnar \u00e1byrg\u00f0ar og umhverfisvitundar fer\u00f0amanna, skipuleggjenda
  og \u00fej\u00f3nustua\u00f0ila \u00ed fer\u00f0a\u00fej\u00f3nustu.\\nFer\u00f0a\u00fej\u00f3nustu
  \u00e1 \u00cdslandi taki forystu \u00e1 svi\u00f0i umhverfism\u00e1la \u00e1 \u00cdslandi
  a\u00f0 \u00fev\u00ed leyti a\u00f0 h\u00fan ver\u00f0i \u00f6\u00f0rum atvinnugreinum
  fyrirmynd. Til a\u00f0 stu\u00f0la a\u00f0 breyttu hugafari almennings og innan
  atvinnugreinarinnar skal, \u00e1 \u00e1rinu 1997, skipuleggja og standa fyrir vi\u00f0varandi
  \u201e\u00fej\u00f3\u00f0ar\u00e1taki \u00ed umhverfisvernd\u201c \u00ed tengslum
  vi\u00f0 fer\u00f0a\u00fej\u00f3nustu me\u00f0 vi\u00f0t\u00e6kri \u00fe\u00e1ttt\u00f6ku
  fyrirt\u00e6kja og stofnana. Auka skal umhverfisfr\u00e6\u00f0slu til almennings
  \u00e1 \u00cdslandi. Gefa skal \u00fat b\u00e6kling me\u00f0 \u201eumhverfisreglum\u201c
  \u00e1 \u00edslensku og erlendum tungum\u00e1lum og dreifa honum markvisst me\u00f0al
  \u00cdslendinga og gesta \u00e1 landinu. \u00cd b\u00e6klingi \u00feessum skal einnig
  teki\u00f0 tillit til hugmyndafr\u00e6\u00f0i sj\u00e1lfb\u00e6rrar pr\u00f3unar.
  Fyrsta \u00fatg\u00e1ffa skal koma \u00fat \u00e1ri\u00f0 1997.\\n\\nSampa\u00f0a
  fer\u00f0a\u00fej\u00f3nustu og n\u00e1tt\u00faruvernd. Vi\u00f0 skipulagningu \u00e1
  dreifingu fer\u00f0amanna milli \u00e1hugaver\u00f0ra sta\u00f0a ver\u00f0i n\u00e1tt\u00faruverndarsj\u00f3narmi\u00f0
  \u00ed hei\u00f0ri h\u00f6f\u00f0i.\\nVegakerfi\u00f0 ver\u00f0i b\u00e6tt, svo
  au\u00f0veldara ver\u00f0i a\u00f0 dreifa fer\u00f0am\u00f6nnum \u00e1 milli \u00e1hugaver\u00f0ra
  sta\u00f0a.\\n\\n\u00cd samr\u00e6\u00f0i vi\u00f0 Vegager\u00f0ina ver\u00f0i skilgreint
  hvar meginvegir muni liggja \u00ed framt\u00ed\u00f0inni. Vegir \u00fej\u00f3ni
  sem best hagsmunum vegfarandans, falli sem best a\u00f0 landinu og valdi sem minnstum
  umhverfis\u00fej\u00f6llum.\\n\\nSamg\u00f6ngur\u00e1\u00f0uneyti\u00f0 hafi forg\u00f6ngu
  um ger\u00f0 framkv\u00e6mda\u00e6tlunar til fj\u00f6gurra \u00e1ra um forvarnar\u00e1\u00f0ger\u00f0ir
  vegna umfer\u00f0ar fer\u00f0amanna og \u00farb\u00e6tur \u00e1 fer\u00f0amannast\u00f6\u00f0um.\\n\\nFramkv\u00e6md
  laga og regluger\u00f0a um umhverfisvernd og umgengni vi\u00f0 landi\u00f0 ver\u00f0i
  virk og n\u00fdjar reglur settar ef \u00fe\u00f6rf krefur.\\n\\nStj\u00f3rnav\u00f6ld
  hafi forg\u00f6ngu um a\u00f0 setja sk\u00fdrari reglur um umfer\u00f0 velkn\u00fainna
  \u00f6kut\u00e6kja, \u00feannig a\u00f0 h\u00fan spilli ekki jar\u00f0vegi, gr\u00f3\u00f0ri
  og fri\u00f0s\u00e6ld.\\n\\nA\u00f0 sveitarf\u00e9lagum og landeigendum ver\u00f0i
  settar reglur um f\u00f6rgun sorps.\\n\\nGott a\u00f0gengi fyrir fatla\u00f0a ver\u00f0i
  sem v\u00ed\u00f0ast.\\n\\nVi\u00f0 \u00farb\u00e6tur og uppb\u00fdggingu \u00e1
  fer\u00f0amannast\u00f6\u00f0um skal gert r\u00e1\u00f0 fyrir f\u00f6tlu\u00f0um
  fer\u00f0am\u00f6nnum, eftir \u00fev\u00ed sem framast er unnt.\\n\\n8.3 P\u00e1ttur
  fer\u00f0apj\u00f3nustu \u00ed landsskipulagi\\n\\n8.3.1 Stefnum\u00f3tun\\n\\nFramt\u00ed\u00f0aruppb\u00fdgging
  og skipulag sta\u00f0a og sv\u00e6\u00f0a taki mi\u00f0 af \u00fe\u00f6rfum fer\u00f0apj\u00f3nustu.\\n\\n8.3.2
  Markmi\u00f0 og lei\u00f0ir\\n\\nSamg\u00f6ngukerfi og skipulag lei\u00f0a og sv\u00e6\u00f0a
  tengd fer\u00f0apj\u00f3nustu s\u00e9u unnin saman.\\n\\nHvatt er til stefnum\u00f3tunar
  \u00ed fer\u00f0am\u00e1lum \u00ed hverjum landshluta.\\n\\nKomi\u00f0 ver\u00f0i
  \u00e1 samstarfi hagsmuna\u00f0ila \u00ed fer\u00f0apj\u00f3nustu, Landsvirkjunar
  og Vegager\u00f0arinnar um hvernig a\u00f0sta\u00f0a sem ger\u00f0 er vegna virkjana
  n\u00fdtist fer\u00f0apj\u00f3nustunni sem best.\\n\\nUppbygging \u00ed fer\u00f0apj\u00f3nustu
  og verndunarsj\u00f3narmi\u00f0 s\u00e9u vegin saman.\\n\\nKomi\u00f0 ver\u00f0i
  \u00e1 samstarfi hagsmuna\u00f0ila, umhverfisr\u00e1\u00f0uneytisins og N\u00e1tt\u00faruverndarr\u00e1\u00f0s
  um hvernig verndun og n\u00fdting far\u00ed best saman.\\n\\nFer\u00f0am\u00e1lar\u00e1\u00f0
  taki upp samstarf vi\u00f0 samvinnunefnd um skipulag mi\u00f0h\u00e1lendisins um
  stefnum\u00f3tunaratri\u00f0i er tengjast fer\u00f0am\u00e1lum \u00e1 mi\u00f0h\u00e1leindinu.\\n\\n9.
  \u00cdtarefni - vinnug\u00f6gn stytt og samr\u00e6md\\n\\n9.1 N\u00faverandi sta\u00f0a
  \u00ed fer\u00f0apj\u00f3nustu\\n\\nGjaldeyristekjur\\nHlutur fer\u00f0apj\u00f3nustu
  \u00ed \u00fatfluttri v\u00f6ru og \u00fej\u00f3nustu er a\u00f0 auka\u00f0 og var
  \u00e1ri\u00f0 1995 u.p.b. 11%.\\n\\nHeildargjaldeyristekjur af fer\u00f0apj\u00f3nustu
  \u00e1ri\u00f0 1995 voru u.p.b. 18,7 milljar\u00f0ar. Hlutdeild gjaldeyristekna
  \u00ed heildarveltu atvinnugreinarinnar er \u00e1\u00e6tlu\u00f0 um 55%. Hinir \u00fe\u00e6ttirnir
  eru tekjur atvinnugreinarinnar af innanlandsfer\u00f0am\u00f6nnum og af utanfer\u00f0um
  f\u00f3lks me\u00f0 b\u00fasetu \u00e1 \u00cdslandi. Framlag fer\u00f0apj\u00f3nustunnar
  til landsframlei\u00f0slu hefur hins vegar veri\u00f0 \u00e1 bilinu 3-3,5% \u00e1
  undanf\u00f6rnum \u00e1rum, svo og hlutur hennar \u00ed launum og launatengdum gj\u00f6ldum.\\n\\n7.
  mynd: Hlutfall v\u00f6ru- og \u00fej\u00f3nustugreina \u00ed \u00fatflutningi 1995.\\nHeimild:
  Pj\u00f3\u00f0hagsstofnun\\n\\n\u00c1rsverk\\n\u00c1rsverk \u00ed fer\u00f0apj\u00f3nustu
  voru samkv\u00e6mt mati Pj\u00f3\u00f0hagsstofnunar \u00e1ri\u00f0 1994 um 4000
  talsins, e\u00f0a um 3% af heildar\u00e1rsverkum. Athygli vekur a\u00f0 \u00fer\u00e1tt
  fyrir n\u00e6r tv\u00f6f\u00f6ldun \u00ed umfangi greinarinnar sl. \u00e1ratug hafa
  \u00e1\u00e6tlu\u00f0 \u00e1rsverk n\u00e6r sta\u00f0i\u00f0 \u00ed sta\u00f0. Hlutfall
  \u00e1rsverka \u00ed fer\u00f0apj\u00f3nustu er \u00ed al\u00fej\u00f3\u00f0legum
  samanbur\u00f0i fremur l\u00e1gt, og athygli vekur \u00fea\u00f0 \u00f3samr\u00e6mi
  sem er milli \u00e1rsverka og landsframlei\u00f0slu.\\n\\n8. mynd: Hlutur fer\u00f0a\u00fej\u00f3nustu
  \u00ed vergri landsframlei\u00f0slu (GDP) \u00fdmissa landa \u00ed samanbur\u00f0i
  vi\u00f0 \u00e1rsverk (ekki er teki\u00f0 tillit til \u00f3beinna \u00e1hrifa fer\u00f0a\u00fej\u00f3nustu
  \u00e1 \u00e1rsverk). Vi\u00f0mi\u00f0unar\u00e1r 1989-1991.\\n\\nHeimild: World
  Tourism Organization\\n\\n9. mynd: \u00c1rsverk \u00ed fer\u00f0a\u00fej\u00f3nustu
  sem hlutfall af heildar\u00e1rsverkum \u00fej\u00f3\u00f0a 1994.\\n\\nHeimild: World
  Tourism Organization\\n\\nErfitt er a\u00f0 meta hva\u00f0a \u00e1hrif \u00fea\u00f0
  muni hafa \u00e1 \u00e1rsverk \u00ed fer\u00f0a\u00fej\u00f3nustu, n\u00e1i fyrrgreind
  t\u00f6luleg markmi\u00f0 fram a\u00f0 ganga. Fj\u00f6ldi \u00e1rsverka \u00ed fer\u00f0a\u00fej\u00f3nustu
  f\u00f3r vaxandi fram til \u00e1rsins 1987 en eftir \u00feann t\u00edma hefur v\u00f6xtur
  \u00ed \u00feessari st\u00e6r\u00f0 ekki haldist \u00ed hendur vi\u00f0 fj\u00f6lgun
  fer\u00f0amanna og aukeningu gjaldeyristekna. Fj\u00f6ldi \u00e1rsverka \u00ed fer\u00f0a\u00fej\u00f3nustu
  var skv. uppl\u00fdsingum \u00dej\u00f3\u00f0hagsstofnunar 3.775 \u00e1ri\u00f0
  1993. Hlutur hotela og veitingasta\u00f0a \u00ed heildar\u00e1rsverkum fer\u00f0a\u00fej\u00f3nustunnar
  er r\u00famlega 40%. \u00c1rsverk, tengd samg\u00f6ngum \u00e1 landi og \u00ed lofti,
  eru um 30%. Uppgangur hj\u00e1 Fluglei\u00f0um undanfar\u00f0i hefur leitt til fj\u00f6lgunar
  starfsmanna.\\n\\n**Fj\u00f6ldi fer\u00f0amanna**\\n\\nFer\u00f0a\u00fej\u00f3nusta
  hefur veri\u00f0 \u00ed \u00f6rr\u00ed pr\u00f3un \u00e1 \u00cdslandi s\u00ed\u00f0astli\u00f0in
  \u00e1r. Umfang greinarinnar hefur aukist mikil \u00ed fj\u00f6lda erlendra fer\u00f0amanna
  (gesta) og \u00ed gjaldeyristekjum. Einnig hafa fer\u00f0al\u00f6g innanlands teki\u00f0
  fj\u00f6rkipp. Frambo\u00f0 alls kyns fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi
  hefur aukist mikil, svo og s\u00e6taframbo\u00f0 flugf\u00e9lagu \u00ed \u00e1\u00e6tlunar-
  og lei\u00f0uflugi til landsins.\\n\\n![Graph showing the number of foreign visitors
  to Iceland from 1970 to 1995](image)\\n\\n*10. mynd: Pr\u00f3un \u00e1 fj\u00f6lda
  erlendra gesta til \u00cdslands 1970-1995.*\\n\\n*Heimild: \u00datlendingaeftirliti\u00f0*\\n\\nUppl\u00fdsingar
  um fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi eru af skornum skammti og \u00fev\u00ed
  erfitt a\u00f0 gera s\u00e9r n\u00e1kv\u00e6mlega grein fyrir st\u00f6\u00f0u hennar.
  Helstu vi\u00f0mi\u00f0unarst\u00e6r\u00f0ir hafa veri\u00f0 skr\u00e1ning \u00datlendingaeftirlitsins
  \u00e1 komum farpega til landsins me\u00f0 flugi, ferjum og skemmtifer\u00f0askipum,
  uppl\u00fdsingar Se\u00f0labanka \u00cdslands um gjaldeyristekjur og gistiinntattalning
  Hagstofu \u00cdslands fr\u00e1 1986, sem gefur nokkra hugmynd um samsetningu, dvalart\u00edma
  og fer\u00f0aheg\u00f0un fer\u00f0amannanna. Vi\u00f0 vitum t.d. a\u00f0 innanlandsfer\u00f0amenn
  eru st\u00e6rsti vi\u00f0skiptavinah\u00f6pur \u00edslenskrar fer\u00f0a\u00fej\u00f3nustu
  og fj\u00f6lmennasti h\u00f3purinn fr\u00e1 einst\u00f6ku landi eru \u00dej\u00f3\u00f0verjar.\\n\\n11.
  mynd: Skipting gistin\u00e1ttu \u00e1 h\u00f3telum og gistiheimilum eftir r\u00edkisfangi
  1994.\\nHeimild: Hagstofa \u00cdslands\\n\\nDreifing fer\u00f0amanna eftir \u00e1rst\u00ed\u00f0um\\nHelstu
  vandam\u00e1l fer\u00f0apj\u00f3nustu \u00e1 \u00cdslandi sem stendur eru stutt
  h\u00e1\u00f6nn, \u00f3n\u00f3g dreifing fer\u00f0amanna um landi\u00f0 og mismunandi
  ar\u00f0semi fer\u00f0apj\u00f3nustufyrt\u00e6kja, sem oft orsakast af b\u00e1\u00f0um
  fyrrgreindu atri\u00f0unum.\\n\\n12. mynd: Gistin\u00e6tur erlendra gesta eftir
  m\u00e1nu\u00f0um 1994.\\nHeimild: Hagstofa \u00cdslands\\n\\nDreifing gistin\u00e1tta
  eftir landshlutum\\n\\n13. mynd: Gistinat\u00far \u00e1 h\u00f3telum og gistiheimilum
  1994 eftir landssv\u00e6\u00f0um.\\nHeimild: Hagstofa \u00cdslands\\n\\n14. mynd:
  Heildarfj\u00f6ldi gistin\u00e1tta \u00e1 landinu 1994 eftir landssv\u00e6\u00f0um.\\nHeimild:
  Hagstofa \u00cdslands\\n\\nT\u00f6lur um n\u00fdtingu \u00e1 herbergjum og r\u00famum
  undirstrika a\u00f0 frambo\u00f0 gistiherbergja hefur aukist hra\u00f0ar en eftirsprungin.
  Me\u00f0alaukning gistir\u00fdmis \u00e1 landinu \u00e1 milli \u00e1ranna 1989 og
  1995 var 37%. Sl\u00e6m n\u00fdting herbergja kemur fram \u00ed slakri framlei\u00f0ni
  utan h\u00e1annat\u00edmans og \u00fer\u00e1t fyrir sp\u00e1r um aukna eftirsprung
  \u00ed gistingu er n\u00fdting \u00e1 herbergjum l\u00edtil, ef t\u00f6lur fyrir
  allt landi\u00f0 eru sko\u00f0a\u00f0ar.\\n\\n15. mynd: Frambo\u00f0 r\u00fama eftir
  landshlutum 1989 og 1995. Allt gistir\u00fdmi \u00e1 landinu fyrir utan fjallask\u00e1la
  og tjaldst\u00e6\u00f0i.\\n\\nHeimild: Handb\u00f3k Fer\u00f0am\u00e1lar\u00e1\u00f0s
  \u00cdslands\\n\\nSamkv\u00e6mt forsendum nefndarinnar um fj\u00f6lda gistin\u00e1ttu
  eru n\u00fdtingart\u00f6lur Hagstofu \u00cdslands framrekina\u00f0ar. Ef aukin eftirsprung
  kemur \u00f6ll fram \u00e1 h\u00f3telum og gistiheimilum m\u00e1 reikna me\u00f0
  a\u00f0 gistir\u00fdmi \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu ver\u00f0i
  fulln\u00fdtt \u00e1ri\u00f0 1999. Ef gengi\u00f0 er \u00fat fr\u00e1 \u00fev\u00ed
  a\u00f0 eing\u00f6ngu 63%\u00b9 af aukningu gistin\u00e1ttu komi fram \u00e1 h\u00f3telum
  og gistiheimilum mun eftirsprung eftir h\u00f3telherbergjum ver\u00f0a meiri en
  frambo\u00f0i\u00f0 \u00ed j\u00fal\u00ed \u00e1ri\u00f0 2002 en fyrst \u00e1ri\u00f0
  2005 \u00ed j\u00fan\u00ed og \u00e1g\u00fast.\\n\\n\u00cd Reykjav\u00edk stefnir
  \u00feegar \u00ed skort \u00e1 h\u00f3telherbergjum \u00ed j\u00fan\u00ed og j\u00fal\u00ed
  \u00e1ri\u00f0 1998 mi\u00f0a\u00f0 vi\u00f0 a\u00f0 aukin eftirsprung beinist fyrst
  og fremst a\u00f0 h\u00f3telum. Ef eftirsprungin dreifist hins vegar \u00e1 a\u00f0rar
  tegundir gistingar ver\u00f0ur frambo\u00f0i\u00f0 fulln\u00fdtt \u00ed j\u00fan\u00ed
  og j\u00fal\u00ed \u00e1ri\u00f0 2000. Af \u00feessu m\u00e1 sj\u00e1 a\u00f0 \u00fea\u00f0
  g\u00e6ti \u00f3\u00f0rum ver\u00f0i a\u00f0 styttast \u00ed umframeftirsprung eftir
  gistingu \u00e1 h\u00e1annat\u00edmanum \u00ed Reykjav\u00edk. \u00d6\u00f0ru m\u00e1l\u00ed
  geggir ef liti\u00f0 er til landsins alls og sams konar framreikningur ger\u00f0ur.
  Miki\u00f0 frambo\u00f0 er \u00e1 gistir\u00fdmi \u00fati \u00e1 landi og n\u00fdtist
  \u00fea\u00f0 illa. Fyrir viki\u00f0 myndast ekki skortur \u00e1 herbergjum fyrr
  en \u00ed j\u00fal\u00edm\u00e1nu\u00f0i \u00e1ri\u00f0 2004. Framreikningar \u00feessi
  byggist \u00e1 \u00fev\u00ed a\u00f0 fer\u00f0amanninum standi \u00e1 sama hvar
  \u00e1 landinu utan h\u00f6fu\u00f0borgarsv\u00e6\u00f0isins hann gistir og \u00fev\u00ed
  er hann varla raunh\u00e6fur.\\n\\nT\u00f6lur um komur erlendra gesta og frambo\u00f0
  \u00e1 gistir\u00fdmi s\u00fdna a\u00f0 \u00feessar st\u00e6r\u00f0ir fylgjast a\u00f0
  undanfarin \u00e1r. \u00datlit er \u00fev\u00ed fyrir a\u00f0 menn hafi a\u00f0
  verulegu leyti stu\u00f0st vi\u00f0 komut\u00f6ltunar til a\u00f0 meta \u00fe\u00f6rf
  fyrir gistir\u00fdmi, en lj\u00f3st er a\u00f0 \u00fe\u00e6r t\u00f6lur eru engan
  veginn fulln\u00e6gjandi \u00feegar huga\u00f0 er a\u00f0 framkv\u00e6mdum \u00e1
  bor\u00f0 vi\u00f0 fj\u00e1rfestingar \u00ed gistir\u00fdmi.\\n\\n2 Menntun og ranns\u00f3knir
  - greinarger\u00f0\\n\\nMenntun \u00e1 framhaldssk\u00f3lastigi\\n\\nMenntun \u00e1
  svi\u00f0i fer\u00f0a\u00fej\u00f3nustu fer fram b\u00e6\u00f0i \u00ed r\u00edkisreknum
  sk\u00f3lum og \u00e1 vegum annarra a\u00f0ila. Stiftirfarandi yfirlit yfir st\u00f6\u00f0u
  m\u00e1la er a\u00f0 mestu leyti byggt \u00e1 \u00e1fangask\u00fdrslu Fra\u00f0slur\u00e1\u00f0s
  fer\u00f0a\u00fej\u00f3nustunnar, sem starfa\u00f0 hefur \u00ed u.p.b. fj\u00f6gur
  \u00e1r \u00e1 vegum menntam\u00e1lara\u00f0uneytisins.\\n\\nEins og s\u00e9st af
  \u00feessum g\u00f6gnum eru helstu veikleikarnir \u00e1 svi\u00f0i menntunar \u00ed
  fer\u00f0a\u00fej\u00f3nustu eftirfarandi:\\n\\n- Engar kannanir hafa veri\u00f0
  ger\u00f0ar til a\u00f0 meta \u00fe\u00f6rf fyrir mennta\u00f0 vinnuafl og \u00fev\u00ed
  hefur stefnum\u00f6rkun veri\u00f0 \u00f3markviss.\\n- Vi\u00f0 skipulagningu n\u00e1ms
  \u00e1 fer\u00f0abrautum hafa ekki veri\u00f0 sett n\u00f3gu sk\u00fdr markmi\u00f0
  og \u00fev\u00ed hefur ekki tekist sem skyldi a\u00f0 fl\u00e9tta saman verklega
  \u00fe\u00e6tti og b\u00f3klega.\\n- S\u00fa menntun sem \u00feegar er fyrir hendi
  hefur ekki veri\u00f0 vel a\u00f0gengileg starfsf\u00f3lk \u00ed greininni, sem
  oft er b\u00fasett \u00e1 landsbygg\u00f0inni.\\n\\nOkkar st\u00e6rstu teikf\u00e6ri
  er a\u00f0 finna \u00ed:\\n- Sveigjanlegu n\u00e1mi \u00ed framhaldssk\u00f3lam
  sem byggt er \u00e1 \u00e1fangakerfi\\n- N\u00fdrrri t\u00e6kni, sem gerir f\u00f3lk
  au\u00f0velt a\u00f0 stunda fjarn\u00e1m\\n- Uppbyggingu fj\u00f6lbreyttu n\u00e1ms
  \u00e1 h\u00e1sk\u00f3lastigi\\n\\n\u00dea\u00f0 hl\u00fdtur a\u00f0 vera e\u00f0lilegt
  markmi\u00f0 a\u00f0 fagmennska \u00ed fer\u00f0a\u00fej\u00f3nustu ver\u00f0i ekki
  lakari h\u00e9r \u00e1 landi en \u00ed helstu samkeppnisl\u00f6ndum. \u00dea\u00f0
  n\u00e1m sem liggur a\u00f0 baki sl\u00edkri fagmennsku er a\u00f0 st\u00e6rstum
  hluta \u00e1 framhaldssk\u00f3lastigi. \u00dear sem vinnumarka\u00f0ur er l\u00edklega
  of l\u00edtil \u00e1 \u00cdslandi til a\u00f0 h\u00e6gt s\u00e9 a\u00f0 halda uppi
  fj\u00f6lbreyttu s\u00e9rn\u00e1mi \u00e1 framhaldssk\u00f3lastigi \u00fe\u00e1
  skipta styttri n\u00e1mskei\u00f0, endur- og s\u00edmenntun enn meira m\u00e1li
  fyrir okkur en a\u00f0ra.\\n\\nMenntun \u00e1 h\u00e1sk\u00f3lastigi\\n\\n\u00deegar
  \u00e1standi\u00f0 \u00ed menntam\u00e1lum \u00ed fer\u00f0a\u00fej\u00f3nustu er
  bor\u00f0 saman vi\u00f0 menntam\u00e1l annarra mikilv\u00e6gra atvinnugreina, \u00fe\u00e1
  kemur \u00ed lj\u00f3s a\u00f0 fer\u00f0a\u00fej\u00f3nustan stendur \u00fear h\u00f6llum
  f\u00e6ti. \u00c1 \u00f6\u00f0rum svi\u00f0um hefur um langt skei\u00f0 veri\u00f0
  bo\u00f0i\u00f0 upp \u00e1 s\u00e9rh\u00e6\u00f0a rekstrarmenntun, samanber t.d.
  i\u00f0nrekstrarfr\u00e6\u00f0i. \u00dea\u00f0 er \u00fev\u00ed e\u00f0lilegt a\u00f0
  s\u00e9rh\u00e6\u00f0a rekstrarmenntun ver\u00f0i jafnaleng \u00ed fer\u00f0a\u00fej\u00f3nustu
  og \u00ed \u00f6\u00f0rum greinum.\\n\\nRanns\u00f3knir\\n\\nPr\u00e1tt fyrir vaxandi
  mikilv\u00e6gi fer\u00f0a\u00fej\u00f3nustu fyrir efnahagsl\u00edff \u00fej\u00f3\u00f0arinnar
  hefur til \u00feessa skort a\u00f0 markvisst hafi veri\u00f0 unni\u00f0 a\u00f0
  stefnum\u00f3tun \u00ed m\u00e1lefnum tengdum henni. Ranns\u00f3knir \u00e1 svi\u00f0i
  fer\u00f0a\u00fej\u00f3nustu hafa veri\u00f0 \u00ed l\u00e1gmarki og l\u00edtt veri\u00f0
  huga\u00f0 a\u00f0 \u00fev\u00ed hlutverki. Alvarlegasta \u00f3gnunin sem \u00edslensk
  fer\u00f0a\u00fej\u00f3nusta \u00fearf a\u00f0 horfast \u00ed augu vi\u00f0 er a\u00f0
  \u00cdsland dragist aftur \u00far helstu samkeppnisl\u00f6ndum okkar, b\u00e6\u00f0i
  hva\u00f0 var\u00f0ar fagmennsku, v\u00f6rubr\u00fan og marka\u00f0sm\u00e1l.\\n\\nA\u00f0ilar
  sem sta\u00f0i\u00f0 hafa a\u00f0 ranns\u00f3knun \u00e1 svi\u00f0i fer\u00f0am\u00e1la
  eru fj\u00f6lmargir, en ekki er h\u00e6gt a\u00f0 segja a\u00f0 fram fari skipuleg
  ranns\u00f3knastarfsemi a\u00f0 neinu marki og er \u00fea\u00f0 helsti veikleiki
  ranns\u00f3kna \u00ed greininni. Ennfremur hafa ni\u00f0urst\u00f6\u00f0ur ranns\u00f3kna
  sem framkv\u00e6mdar hafa veri\u00f0, veri\u00f0 illa a\u00f0gengilegar enda enginn
  einn a\u00f0ili sem safnar \u00feessum uppl\u00fdsingum.\\n\\nEf teki\u00f0 er mi\u00f0
  af \u00f6\u00f0rum h\u00f6fu\u00f0atvinnugreinum \u00e1 \u00cdslandi\u00b2, \u00fe\u00e1
  kemur \u00ed lj\u00f3s a\u00f0 mj\u00f6g l\u00edti\u00f0 fj\u00e1rmagn\\n\\nrennur
  til ranns\u00f3kna \u00ed fer\u00f0a\u00fej\u00f3nustu, sem markast m.a. af \u00fev\u00ed
  a\u00f0 ekki er til ranns\u00f3knastofnun \u00e1 svi\u00f0i fer\u00f0a\u00fej\u00f3nustu.
  \u00dea\u00f0 eru hins vegar ekki til nein gild r\u00f6k fyrir \u00fev\u00ed a\u00f0
  ranns\u00f3knir s\u00e9u s\u00ed\u00f0ur mikilv\u00e6gar fyrir fer\u00f0a\u00fej\u00f3nustu
  en fyrir a\u00f0rar atvinnugreinar.\\n\\n9.3 G\u00e6\u00f0astj\u00f3rnum - greinarger\u00f0\\n\\nG\u00e6\u00f0i
  v\u00f6ru og \u00fej\u00f3nustu sem fer\u00f0a\u00fej\u00f3nustan b\u00fd\u00f0ur
  upp \u00e1 skipta meginm\u00e1li fyrir afkomu greinarinnar til lengri t\u00edma.\\n\\n\u00deeir
  a\u00f0ilar \u00ed fer\u00f0a\u00fej\u00f3nustu sem selja matv\u00e6li af einhverjum
  toga falla undir \u00e1kv\u00e6\u00f0i regluger\u00f0ar um matv\u00e6laeftirlit
  og hollustuh\u00e6tti vi\u00f0 framlei\u00f0slu og dreifingu matv\u00e6la.\\n\\n\u00cd
  \u00feessari regluger\u00f0 er kve\u00f0i\u00f0 \u00e1 um innra eftirlit. Auk \u00feess
  er fjalla\u00f0 um greiningu \u00e1h\u00e6ttup\u00e1ttu og mikilv\u00e6gra eftirlitssta\u00f0a
  G\u00c1MES. \u00cd \u00feessari regluger\u00f0 eru fyrirt\u00e6kinn hv\u00f6tt til
  \u00feess a\u00f0 byggja upp g\u00e6\u00f0akerfi, sem taka mi\u00f0 af ISO 900X
  st\u00f6\u00f0ulunum og fella innra eftirlit fyrirt\u00e6kisins a\u00f0 \u00feeim.
  L\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 \u00f6ll fyrirt\u00e6ki \u00ed fer\u00f0a\u00fej\u00f3nustu
  byggi upp hj\u00e1 s\u00e9r g\u00e6\u00f0akerfi til \u00feess a\u00f0 tryggja sem
  best g\u00e6\u00f0i v\u00f6ru og \u00fej\u00f3nustu.\\n\\nAlmennt m\u00e1 segja
  a\u00f0 g\u00e6\u00f0astj\u00f3rnum \u00ed fer\u00f0a\u00fej\u00f3nustu sn\u00faist
  um \u00fea\u00f0 a\u00f0 \u00fej\u00f3nustan s\u00e9 skilgreind og tryggt s\u00e9
  a\u00f0 vi\u00f0skiptavinurinn f\u00e1i \u00fea\u00f0 \u00fej\u00f3nustu sem honum
  er lofa\u00f0 og t\u00edmasetningar standist.\\n\\nKr\u00f6fur og \u00fearfir sem
  atvinnugreinin \u00e6tlar a\u00f0 koma til m\u00f3ts vi\u00f0 eru ekki n\u00e6gjanlega
  vel skilgreindar og \u00fear me\u00f0 skapast s\u00fa h\u00e6tta a\u00f0 ekki takist
  a\u00f0 fulln\u00e6gja v\u00e6ntingum vi\u00f0skiptamanna.\\n\\n\u00dej\u00f3nustua\u00f0ilar
  \u00ed fer\u00f0a\u00fej\u00f3nustu h\u00e9r \u00e1 landi, utan Fer\u00f0a\u00fej\u00f3nusta
  b\u00e6nda, hafa ekki formlega g\u00e6\u00f0aflokkun, s.s. \u00e1 gistingu, veitingarekstri
  og langfer\u00f0abifrei\u00f0um \u00feannig a\u00f0 vi\u00f0skiptavinir geta ekki
  bori\u00f0 saman og meti\u00f0 me\u00f0 einf\u00f6ldum h\u00e6tti \u00fe\u00e1 \u00fej\u00f3nustu
  sem \u00ed bo\u00f0i er.\\n\\nMikilv\u00e6gt er a\u00f0 saman fara ver\u00f0 \u00e1
  seldri \u00fej\u00f3nustu og g\u00e6\u00f0i og a\u00f0 \u00fej\u00f3nusta s\u00e9
  l\u00e1tin \u00ed t\u00e9 \u00e1 samkeppnisf\u00e6ru ver\u00f0i, p.e. a\u00f0 tilkostna\u00f0ur
  s\u00e9 ekki h\u00e6rri en svo a\u00f0 vi\u00f0unandi hagna\u00f0ur n\u00e1ist.\\n\\nGera
  ver\u00f0ur fer\u00f0am\u00f6nnum sem fer\u00f0ast um \u00cdsland lj\u00f3st a\u00f0
  \u00feeir bera fulla \u00e1byrg\u00f0 \u00e1 eigin gj\u00f6r\u00f0um og ber \u00fev\u00ed
  a\u00f0 fylgja \u00feeim lei\u00f0beiningum sem \u00feeir f\u00e1 e\u00f0a eru fram
  settar \u00e1 vi\u00f0komust\u00f6\u00f0um \u00feeirra.\\n\\n9.4 Rekstrarumhverfi
  - greinarger\u00f0\\n\\nStyrkleikar og t\u00e6kif\u00e6ri\\n- \u201eBatnandi\u201c
  afkoma h\u00f3telu \u00ed Reykjav\u00edk.\\n- St\u00f6\u00f0ugleiki \u00ed efnahagsm\u00e1lum
  - ver\u00f0b\u00f3lga \u00e1 svipu\u00f0u stigi og \u00ed helstu samkeppnisl\u00f6ndum.
  Gengi hefur veri\u00f0 hagst\u00e6tt.\\n- Veruleg breyting hefur \u00e1tt s\u00e9r
  sta\u00f0 \u00e1 skattaumhverfi atvinnul\u00edfsins til samr\u00e6mis vi\u00f0 \u00fea\u00f0
  sem \u00feekkist hj\u00e1 helstu samkeppnis\u00fej\u00f6\u00f0um, s.s. afn\u00e1m
  a\u00f0st\u00f6\u00f0ugjaldsins og l\u00e6kkun tekjuskatts \u00far 45% til 33%.\\n-
  Sveigjanleiki \u00edslensks vinnumarka\u00f0ar.\\n- Launatengd gj\u00f6ld eru samb\u00e6rileg
  vi\u00f0 \u00fea\u00f0 sem helstu samkeppnisl\u00f6nd b\u00faa vi\u00f0, jafnvel
  l\u00e6gri.\\n- Endurgrei\u00f0sla vir\u00f0isaukaskatts til erlendra fyrirt\u00e6kja.\\n-
  S\u00edbatnandi vegakerfi.\\n- Vann\u00fdttar fj\u00e1rfestingar.\\n\\nVeikleikar\\n-
  Of stutt fer\u00f0amannat\u00edmabil. Sl\u00e6m afkoma vegna l\u00e9legrar n\u00fdtingar
  fj\u00e1rfestinga.\\n- Mikil undirbo\u00f0 vegna offrambo\u00f0s.\\n- Meirihluti
  fyrirt\u00e6kja l\u00edtt\u00edll og \u00f3bur\u00f0ugur me\u00f0 litla m\u00f6guleika
  til v\u00f6rupr\u00f3unar og marka\u00f0setningar. Sl\u00e6m eiginfj\u00e1rsta\u00f0a.\\n-
  Skortur \u00e1 \u00feekkingu, uppl\u00fdsingum, ranns\u00f3knunum og r\u00e1\u00f0gj\u00f6f.\\n-
  \u00d3markviss vinnubr\u00f6g\u00f0 vi\u00f0 setningu laga og regluger\u00f0a, \u00feeim
  jafnvel ekki framfylgt. Ekkert starfsf\u00f3lk \u00ed samg\u00f6ngugar\u00f0uneytinu
  sem starfar eing\u00f6ngu fyrir fer\u00f0abj\u00f3nustuna.\\n- \u00c1kv\u00e6\u00f0i
  \u00ed \u00edslenskri vinnul\u00f6ggj\u00f6f l\u00f6ngu \u00farelt og h\u00e6ttuleg
  fer\u00f0abj\u00f3nustunni.\\n- Vegna stutts fer\u00f0amannat\u00edma er v\u00ed\u00f0a
  erfitt a\u00f0 f\u00e1 h\u00e6ft f\u00f3lk til starfa.\\n- Vir\u00f0isaukaskattur
  a\u00f0 me\u00f0altali h\u00e6rri en \u00e1 Evr\u00f3pska efnahagssv\u00e6\u00f0inu
  (h\u00f3tel, veitingah\u00fas og b\u00edlaleigur).\\n- Mikil sv\u00f6rt e\u00f0a
  gr\u00e1 atvinnustarfsemi.\\n- S\u00e9rl\u00edslenskir skattar.\\n- S\u00edrvaxandi
  opinber gjaldtaka \u00e1 Keflav\u00edkurflugvelli.\\n- L\u00e1n- og styrkveitingar
  \u00e1n nokkurra heildarstefnu e\u00f0a k\u00f6nnunar \u00e1 rekstrargrundvelli.
  L\u00e1nasj\u00f3\u00f0ir selja gjaldprota fyrirt\u00e6ki \u00e1 kj\u00f6rum sem
  st\u00f3rsk\u00e9kkja samkeppnisst\u00f6\u00f0u.\\n- Mismunun \u00ed skattheimtu
  s\u00f6mu s\u00f6luv\u00f6runnar.\\n- Skortur \u00e1 leikreglum.\\n- Litlar kr\u00f6fur
  - b\u00e6\u00f0i til fyrirt\u00e6kja og stj\u00f3rnenda e\u00f0a eigenda \u00feeirra.\\n-
  A\u00f0f\u00f6ng oft d\u00fdrari en \u00ed helstu samkeppnisl\u00f6ndum vegna samkeppnisleysis,
  jafnvel einokunar og innflutningshindrana.\\n\\n\u00d3gnanir\\n\\n- Heimavistarsk\u00f3lam
  f\u00e6kkar og \u00feeir \u00fareldast.\\n- Lenging sk\u00f3la\u00e1rsins. G\u00e6ti
  leitt til hruns \u00ed fer\u00f0apj\u00f3nustu \u00e1 landsbygg\u00f0inni.\\n- Miklir
  styrkir til fer\u00f0apj\u00f3nustunnar \u00ed EB-l\u00f6ndunum.\\n- \u00deaunatengd
  gj\u00f6ld eru a\u00f0 h\u00e6kka \u00e1 \u00cdslandi um lei\u00f0 og n\u00e1grannal\u00f6nd
  eru a\u00f0 draga \u00far \u00feeim.\\n- B\u00faast m\u00e1 vi\u00f0 a\u00f0 \u00fdmiss
  konar gj\u00f6ld tengd umhverfism\u00e1lum komi til \u00e1 n\u00e6stu \u00e1rum.\\n-
  Kostna\u00f0ur vegna aukinnar neytendaverndar - hefur n\u00fa \u00feegar aukist.\\n-
  Reglur um risnu fyrirt\u00e6kja hafa \u00ed nokkrum n\u00e1grannal\u00f6ndum veri\u00f0
  takmarka\u00f0ar me\u00f0 alvarlegum aflei\u00f0ingum fyrir veitingah\u00fasin.
  H\u00e6tt er vi\u00f0 a\u00f0 \u00edslensk stj\u00f3rnv\u00f6ld fylgi \u00e1 eftir.
  \u00cd s\u00f6mu l\u00f6ndum hafa m\u00e1ltf\u00f6ri me\u00f0 vi\u00f0skiptavinum
  vi\u00f0a f\u00e6rst inn \u00ed m\u00f3tuneyti fyrirt\u00e6kjanna.\\n- Auknar g\u00e6\u00f0akr\u00f6fur
  neytenda. Hins vegar lei\u00f0ir offrambo\u00f0, skortur \u00e1 leikreglum, aukin
  sv\u00f6rt atvinnustarfsemi og litlar kr\u00f6fur til fyrirt\u00e6kja og stj\u00f3rnda
  \u00feeirra til minni g\u00e6\u00f0a \u00ed \u00edslenskri fer\u00f0apj\u00f3nustu.\\n\\n9.5
  Gistista\u00f0ir - greinarger\u00f0\\n\\nGistim\u00f6guleikar \u00e1 \u00cdslandi
  hafa veri\u00f0 \u00ed \u00f6rr\u00ed \u00fer\u00f3un undanfarin \u00e1ratug. \u00c1
  landinu er n\u00fa fyrir hendi fj\u00f6lbreytt frambo\u00f0 \u00e1 gistir\u00fdmi,
  ef \u00e1 heildina er liti\u00f0. \u00cd samr\u00e6mi vi\u00f0 horfur \u00ed fer\u00f0amennsku
  \u00ed heiminum, er lj\u00f3st a\u00f0 kr\u00f6fur fer\u00f0amanna auka\u00f0 st\u00f6\u00f0ugt
  og \u00fev\u00ed l\u00edklegt a\u00f0 hlutfall \u00feeirra fer\u00f0amanna sem kj\u00f3sa
  gistingu \u00ed upp\u00e1b\u00fanum r\u00famum auka\u00f0 enn. Gistista\u00f0ir
  \u00e1 \u00cdslandi eru allflestir sm\u00e1ir \u00ed sni\u00f0um, sem gerir \u00fea\u00f0
  a\u00f0 verkum a\u00f0 au\u00f0veldara er a\u00f0 veita pers\u00f3nulega og sveigjanlega
  \u00fej\u00f3nustu en ella. \u00deeir henta \u00fev\u00ed vel hinum vaxandi h\u00f6pi
  fer\u00f0amanna sem fer\u00f0ast \u00e1 eigin vegum. St\u00f3r hluti gistista\u00f0a
  utan h\u00f6fu\u00f0borgarsv\u00e6\u00f0isins er rekinn sem sumargisting og \u00fev\u00ed
  ekki um a\u00f0 r\u00e6\u00f0a vann\u00fdtt \u00fej\u00f3nustuframbo\u00f0 \u00e1
  ja\u00f0art\u00edmum og \u00e1 l\u00e1g\u00f6nn. Teygni eftirspurnar yfir h\u00e1\u00f6nnina
  er ekki mikil og rekstur gistista\u00f0anna \u00fev\u00ed oftast a\u00f0b\u00e6\u00f0ir
  \u00fe\u00e1 m\u00e1nu\u00f0i.\\n\\nGistir\u00fdmi hefur \u00e1 undanf\u00f6rnum
  \u00e1ratug aukist miki\u00f0 umfram eftirspurn. Aflei\u00f0ingin er offrambo\u00f0
  gistir\u00fdmis allt \u00e1ri\u00f0, nema e.t.v. \u00e1 h\u00e1punkt\u00ed h\u00e1\u00f6nnar.
  \u00deetta \u00e1samt stutttri h\u00e1\u00f6nn, lei\u00f0ir m.a. til ska\u00f0legrar
  ver\u00f0samkeppni gistista\u00f0a \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu
  \u00e1 ja\u00f0art\u00edmum og \u00e1 l\u00e1g\u00f6nn.\\n\\nOfframbo\u00f0 gistir\u00fdmis
  og stutt h\u00e1\u00f6nn lei\u00f0a til lokunar \u00e1 hluta gistir\u00fdmis (auk
  sumarh\u00f3telanna) \u00fat \u00e1 landsbygg\u00f0inni \u00e1 ja\u00f0art\u00edmum
  og \u00e1 l\u00e1g\u00f6nn. \u00d3n\u00f3gar tekjur hafa \u00ed f\u00f6rl me\u00f0
  s\u00e9r \u00f3fulln\u00e6gjandi og oft neikva\u00f0a afkomu gistista\u00f0anna
  \u00e1 \u00e1rsgrundvelli.\\n\\n16. mynd: Samanbur\u00f0ur \u00e1 opnunart\u00edma
  (allt \u00e1ri\u00f0 e\u00f0a a\u00f0eins sumar) gistir\u00fdmis \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu
  og landsbygg\u00f0inni 1989 og 1995. Allt gistir\u00fdmi \u00e1 landinu, utan fjallask\u00e1la
  og tjaldst\u00e6\u00f0a\\n\\nHeimild: Handb\u00f3k Fer\u00f0am\u00e1lar\u00e1\u00f0s
  \u00cdslands\\n\\nPr\u00e1tt fyrir auki\u00f0 gistir\u00fdmi \u00ed \u00f6llum landshlutum
  hafa g\u00e6\u00f0i a\u00f0st\u00f6\u00f0unnar hlutfallslega sta\u00f0i\u00f0 \u00ed
  sta\u00f0, einkum hva\u00f0 var\u00f0ar frambo\u00f0 \u00e1 herbergjum me\u00f0
  ba\u00f0a\u00f0st\u00f6\u00f0u, \u00fe\u00f3tt allt bendi til a\u00f0 eftirspurn
  eftir herbergjum me\u00f0 ba\u00f0i s\u00e9 a\u00f0 ver\u00f0a allsr\u00e1\u00f0andi.\\n\\n17.
  mynd: Frambo\u00f0 r\u00fama \u00e1 h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu og landsbygg\u00f0inni
  flokka\u00f0 eftir ba\u00f0a\u00f0st\u00f6\u00f0u (hlutfall me\u00f0 og \u00e1n
  ba\u00f0s) 1989 og 1995. Allt gistir\u00fdmi \u00e1 landinu, utan fjallask\u00e1la
  og tjaldst\u00e6\u00f0a\\n\\nHeimild: Handb\u00f3k Fer\u00f0am\u00e1lar\u00e1\u00f0s
  \u00cdslands\\n\\n18. mynd: Frambo\u00f0 r\u00fama eftir landssv\u00e6\u00f0um 1995
  flokka\u00f0 me\u00f0 tilliti til ba\u00f0a\u00f0st\u00f6\u00f0u. Allt gisti-r\u00fdmi
  \u00e1 landinu, utan fjallask\u00e1la og tjaldst\u00e6\u00f0a.\\n\\nHeimild: Handb\u00f3k
  Fer\u00f0am\u00e1lar\u00e1\u00f0s \u00cdslands\\n\\n\u00c1 h\u00e1\u00f6nn getur
  sma\u00f0 gistista\u00f0anna, einkum \u00fati \u00e1 landsbygg\u00f0inni, valdi\u00f0
  vandkv\u00e6\u00f0um vi\u00f0 a\u00f0 koma fer\u00f0amannah\u00f3pum fyrir \u00e1
  vi\u00f0unandi h\u00e1tt.\\n\\nAlmenna g\u00e6\u00f0aflokkun gistista\u00f0a vantar
  (a\u00f0eins fyrir hendi hj\u00e1 Fer\u00f0a\u00fej\u00f3nustu b\u00e6nda), en h\u00fan
  myndi au\u00f0velda \u00fe\u00e6\u00f0i seljendum og vi\u00f0skiptavinum a\u00f0
  skilgreina frambo\u00f0na \u00fej\u00f3nustu.\\n\\nPa\u00f0 er of algengt a\u00f0
  eigendur gistista\u00f0a (einkum \u00fati \u00e1 landi) l\u00edti \u00e1 fer\u00f0a\u00fej\u00f3nustu
  sem hj\u00e1verk og oft er t\u00e6kni\u00fe\u00e6\u00f0ingu \u00e1b\u00f3tavant.
  Einnig er nokku\u00f0 um a\u00f0 \u00feekkingu, reynslu og metna\u00f0 vanti.\\n\\n9.6
  Marka\u00f0sm\u00e1l - greinarger\u00f0\\n\\nFJ\u00d6LDI GESTA OG TEKJUR AF FER\u00d0A\u00deJ\u00d3NUSTU\\n\\n\u00c1
  s\u00ed\u00f0ustu 15 \u00e1rum hefur fj\u00f6ldi gesta\u00b3 \u00e1 \u00cdslandi
  n\u00e1nast \u00ferefaldast og tekjur \u00e1 f\u00f6stu ver\u00f0lagi meira en fj\u00f3r\u00f0alfaldast.
  Hlutdeild fer\u00f0a\u00fej\u00f3nustu \u00ed gjaldeyristekjum \u00cdslandinga hefur
  vaxi\u00f0 \u00far 4,0% \u00e1ri\u00f0 1980 \u00ed 11,0% \u00e1 s\u00ed\u00f0asta
  \u00e1ri. Pessi v\u00f6xtur er langt umfram pa\u00f0 sem \u00feekkist \u00ed n\u00e1grannal\u00f6ndunum.
  \u00c1 \u00e1runum 1985-94 var \u00e1rleg fj\u00f6lgun fer\u00f0alanga til Evr\u00f3pu
  4,7% og til N-Evr\u00f3pu 3,7%. Fer\u00f0amannatekjur \u00ed Bandar\u00edkjunum
  jukust \u00e1 sama t\u00edma um 12,0% \u00ed Evr\u00f3pu og 9,0% \u00ed N-Evr\u00f3pu.\\n\\nSamb\u00e6rilegar
  t\u00f6lur fyrir \u00cdsland eru 7,0% fj\u00f6lgun gesta \u00e1rlega og 14,5% aukning
  tekna.\\n\\nHin allra seinustu \u00e1r hefur \u00fe\u00f3 greinilega h\u00e6gt \u00e1
  fj\u00f6lgun gesta til \u00cdslands. \u00c1 \u00e1runum 1980-90 er \u00e1rleg fj\u00f6lgun
  a\u00f0 jafna\u00f0i u.p.b. 8%, en 6% fr\u00e1 1990 til 1995. S\u00e9u dagsfer\u00f0amenn
  ekki taldir me\u00f0 l\u00e6kkar \u00feetta enn, t.d. \u00e1 s\u00ed\u00f0asta \u00e1ri
  \u00far 5,9% \u00ed 4,7% fj\u00f6lgun.\\n\\nGjaldeyristekjur hafa aukist umfram
  fj\u00f6lgun gesta og n\u00fa (1995) skilar hver gestur t\u00e6plega 100 \u00fe\u00fasund
  kr\u00f3num til \u00fej\u00f3\u00f0arb\u00fasinss.\\n\\nST\u00c1\u00d0A \u00cdSLANDS
  \u00c1 ERLENDUM M\u00d6RKU\u00d0UM\\n\\nHlutdeild \u00cdslands \u00e1 helstu m\u00f6rku\u00f0um
  er \u00f6rsm\u00e1, innan vi\u00f0 0,1%. Jafnvel \u00ed P\u00fdskalandi, \u00fear
  sem er ekki \u00f6flugasti marka\u00f0ur, er hlutdeild \u00cdslands a\u00f0eins
  0,9 pr\u00f3mill.\\n\\n\u00c1tt ver\u00f0lag \u00e1 \u00cdslandi og fjarl\u00e6g\u00f0
  fr\u00e1 marka\u00f0ssv\u00e6\u00f0um gera \u00fea\u00f0 a\u00f0 verkum a\u00f0
  \u00cdslandsfer\u00f0ir eru nokku\u00f0 d\u00fdrar. Tekjur af hverjum fer\u00f0amanni
  til e\u00f0a innan Evr\u00f3pu eru a\u00f0 jafna\u00f0i USD 528 (1994) og til N-Evr\u00f3pu
  USD 853. \u00c1 \u00cdslandi er \u00feessi tala USD 1.500.\\n\\nV\u00edtkur og s\u00e9rsta\u00f0a
  \u00cdslands \u00e1 erlendum fer\u00f0amarka\u00f0i hefur fyrst og fremst falist
  \u00ed:\\n\\n- n\u00e1tt\u00faru landsins,\\n- s\u00f3gu og menningu \u00fej\u00f3\u00f0arinnar,\\n-
  \u00edmynd hreinleika og heiln\u00e6mis.\\n\\nV\u00e6gi \u00feessara \u00fe\u00e1tta
  \u00ed gildismati manna er s\u00edfellt a\u00f0 aukast og \u00fev\u00ed hlj\u00f3ta
  \u00feeir framvegis sem hinga\u00f0 til a\u00f0 vega \u00feungt vi\u00f0 uppbyggingu
  fer\u00f0abj\u00f3nustunnar. A\u00f0rir mikilv\u00e6gar \u00fe\u00e6ttir eru:\\n\\n-
  \u00cdmynd \u00e6vint\u00fdra\\n- \u00d6venjuleg af\u00fereyting\\n- \u00d6ryggi
  \u00e1 t\u00edmum gl\u00e6pa og hry\u00f0juverka\\n- Vi\u00f0\u00e1ttu og kyr\u00f0r
  sem andste\u00f0a fj\u00f6ldafe\u00f0ramennsku\\n\\n\u00deau vandam\u00e1l e\u00f0a
  veikkleikar, sem marka\u00f0ssetning erlendis \u00e1 vi\u00f0 a\u00f0 etja eru:\\n\\n-
  Skortur \u00e1 fj\u00e1rmagni til a\u00f0ger\u00f0a\\n- \u00d3n\u00f3gt skipulag
  og samstarf a\u00f0ila\\n- Van\u00feekking marka\u00f0arins \u00e1 \u00cdslandi\\n-
  \u00cdmynd h\u00e1s ver\u00f0lags og vondra ve\u00f0ra\\n- Fjarl\u00e6g\u00f0 fr\u00e1
  m\u00f6rku\u00f0um og samg\u00f6ngur\\n- \u00d3n\u00f3g \u00feekking \u00e1 markh\u00f3pum
  og \u00fe\u00f6rfum \u00feeirra\\n\\nFj\u00f6ldi fer\u00f0amanna til \u00cdslands
  1995 og sp\u00e1 fram til 2000.\\n\\nFr\u00e1 Mi\u00f0-Evr\u00f3pu komu 65.385 fer\u00f0amenn
  og \u00fear er sp\u00e1\u00f0 8% \u00e1rlegri fj\u00f6lgun.\\nFr\u00e1 Nor\u00f0url\u00f6ndum
  komu 59.193 og gert er r\u00e1\u00f0 fyrir 4% \u00e1rlegri aukningu.\\nFr\u00e1
  Bandar\u00edkjunum komu 28.633 og gert er r\u00e1\u00f0 fyrir 10% \u00e1rlegri aukningu.\\nFr\u00e1
  Bretlandi og \u00cdrlandi komu 18.364 og gert er r\u00e1\u00f0 fyrir 5% \u00e1rlegri
  aukningu.\\nFr\u00e1 Su\u00f0ur-Evr\u00f3pu komu 5.408 og gert er r\u00e1\u00f0
  fyrir 10% \u00e1rlegri aukningu.\\nFr\u00e1 Austurl\u00f6ndum fj\u00e6r komu 4.407
  og gert er r\u00e1\u00f0 fyrir 15% \u00e1rlegri aukningu.\\n\\nST\u00c1\u00d0AN
  \u00c1 HEIMAMARKA\u00d0I\\n\\nInnlendum fer\u00f0amarka\u00f0i hefur veri\u00f0
  l\u00edti\u00f0 sinnt af yfirv\u00f6ldum fer\u00f0am\u00e1la fyrr en \u00e1 allra
  s\u00ed\u00f0ustu \u00e1rum. \u00de\u00f3 efast f\u00e6stir um mikilv\u00e6gi hans.
  Vitneskja er samt af afar skornum skammti og heimildum ber ekki saman. Verulegur
  munur eru \u00e1 ni\u00f0urst\u00f6\u00f0um \u00ed gistiin\u00e1ttatalningu Hagstofunnar
  og \u00f6\u00f0rum k\u00f6nnunum og \u00e1 hi\u00f0 sama \u00e1 vi\u00f0 um gistiinatetur
  gesta.\\n\\nKannanir benda til a\u00f0 u.p.b. 190.000 innanlandsfer\u00f0amenn fer\u00f0ist
  \u00e1rlega um \u00cdsland og verji a\u00f0 jafna\u00f0i til \u00feess 14 d\u00f6gum.
  Ey\u00f0sla s\u00e9 2.500 kr\u00f3nur \u00e1 mann \u00e1 dag, e\u00f0a r\u00famlega
  7 milljar\u00f0ar \u00e1 \u00e1ri. Par af s\u00e9 4-5 milljar\u00f0a ey\u00f0sla
  beinl\u00ednis til komin vegna fer\u00f0ar f\u00f3lks a\u00f0 heiman. \u00c1\u00e6tlunar
  gistiin\u00e6tur innanlandsfer\u00f0amanna \u00e1 s\u00ed\u00f0asta \u00e1ri eru
  \u00fev\u00ed 2,7 millj\u00f3nir, par af 60-70% \u00e1 t\u00edma bilinu ma\u00ed-\u00e1g\u00fast.\\n\\nHelsti
  styrkur heimamarka\u00f0ar:\\nAu\u00f0velt er a\u00f0 n\u00e1 til marka\u00f0arins\\n\u00cdslenskt
  \u00e6ttarsamf\u00e9lag - Heims\u00f3knir til vina og \u00e6ttingja eru algengar\\nGott
  vegakerfi og samg\u00f6ngur\\n\\nHelstu veikleikar heimamarka\u00f0ar:\\n\u00d3n\u00f3g
  a\u00f0sta\u00f0a og afpreying fyrir b\u00f6rn\\nSkortur \u00e1 heildst\u00e6\u00f0u
  kynningarefni\\nV\u00f6ntun \u00e1 ranns\u00f3knum og k\u00f6nnunum - \u00d3n\u00f3g
  \u00feekking\\nVer\u00f0lag\\n\\nMARKA\u00d0SHORFUR\\n\u00c1 n\u00e6stu \u00e1rum
  mun samkeppni \u00ed fer\u00f0apj\u00f3nustu aukast en jafnframt h\u00e6gir \u00e1
  fj\u00f6lgun gesta, einkum \u00e1 okkar sterkustu m\u00f6rku\u00f0um \u00fear sem
  efnahags\u00e1stand er v\u00ed\u00f0a erfitt.\\n\u00c1 m\u00f3ti kemur a\u00f0 s\u00f6kum
  sm\u00e6\u00f0ar okkar \u00e1 m\u00f6rku\u00f0unum og s\u00e9rh\u00e6fingar erum
  vi\u00f0 ekki jafnh\u00e1\u00f0 almennri \u00fer\u00f3un marka\u00f0ar og a\u00f0
  okkar markh\u00f6par eru gjarnan vel mennta\u00f0ir og tilt\u00f6lulega tekjuh\u00e1ir
  einstaklingar, sem eru ekki eins h\u00e1\u00f0ir hagsveiflum \u00fej\u00f3\u00f0a.\\nAukin
  samkeppni \u00ed flugi og n\u00fdr \u00e1fangasta\u00f0ir grei\u00f0a lei\u00f0
  a\u00f0 m\u00f6rku\u00f0um sem \u00e1\u00f0ur voru ekki a\u00f0gengilegir.\\nVaxandi
  \u00e1hugi manna \u00e1 heilbrig\u00f0i s\u00ednu og umhverfi, n\u00e1tt\u00faru
  lands og menningu \u00fej\u00f3\u00f0a, styrkir st\u00f6\u00f0u \u00cdslands \u00ed
  har\u00f0ri samkeppni \u00e1 fer\u00f0am\u00f6rku\u00f0um heimsins. Petta \u00e1
  jafnt vi\u00f0 um innanlandsmarka\u00f0inn.\\n\\nSp\u00e1\u00f0 er 3% \u00e1rlegum
  hagvexti \u00e1 \u00cdslandi til aldam\u00f3ta og enn meiri aukningu kaupm\u00e1ttar.
  Fr\u00edt\u00edmi manna eykst og eftirlaunaf\u00f3lki fj\u00f6lgar.\\n\u00c1hugi
  \u00cdslandinga til fer\u00f0a um eig\u00f0 land hefur aukist og mun enn aukast
  me\u00f0 meiri kynningu og fj\u00f6lbreyttari afpreyingu. Fer\u00f0akostna\u00f0ur
  fer lakkandi.\\nMe\u00f0al neikva\u00f0ra \u00fe\u00e1ttu eru: miki\u00f0 augl\u00fdsinga\u00e6ri\u00f0
  gerir erfi\u00f0ara a\u00f0 koma uppl\u00fdsingum \u00e1 framf\u00e6ri. H\u00e6tt
  er vi\u00f0 a\u00f0 minni tengsl \u00fe\u00e9ttb\u00fdlis og dreiftb\u00fdlis dragi
  \u00far fer\u00f0al\u00f6gum.\\n\\n9.7 Afpreying - greinarger\u00f0\\n\\nVaxandi
  eftirsprung fer\u00f0amanna eftir virkri \u00fe\u00e1ttt\u00f6ku hefur haft \u00ed
  for me\u00f0 s\u00e9r a\u00f0 mikilv\u00e6gi afpreyningar er m\u00f6nnum lj\u00f3sara
  en \u00e1\u00f0ur og talsver\u00f0 \u00e1hersla hefur veri\u00f0 l\u00f6g\u00f0
  \u00e1 uppbyggingu \u00e1 \u00feessu svi\u00f0i, jafnt h\u00e9rlandis sem erlendis.\\n\u00c1
  s\u00ed\u00f0ustu \u00e1rum hefur frambo\u00f0 skipulag\u00f0rar afpreyningar \u00ed
  fer\u00f0apj\u00f3nustu \u00e1 \u00cdslandi aukist verulega.\\n\\nEnn sem komi\u00f0
  er hefur \u00feessi \u00fer\u00f3un \u00e1tt s\u00e9r sta\u00f0 \u00e1n nokkurra
  skilgreindra leikreglna, sem er a\u00f0 vissu leyti styrkur \u00fear sem \u00feetta
  hefur skapa\u00f0 svigrum fyrir frumkv\u00e6\u00f0i \u00e1hugasamra einstaklinga.
  \u00c1 hinn b\u00f6ginn er \u00fea\u00f0 einnig veikleiki \u00fear sem \u00fea\u00f0
  er l\u00edklegt til a\u00f0 koma ni\u00f0ur \u00e1 g\u00e6\u00f0avitund og metna\u00f0i
  me\u00f0al \u00feeirra sem starfa \u00e1 \u00feessu svi\u00f0i.\\n\\nIsland er n\u00fa
  \u00feegar afangasta\u00f0ur fyrir fer\u00f0amenn sem vilja nj\u00f3ta \u00fativistar
  og menningar, og n\u00e1tt\u00farutengd afpreying \u00fev\u00ed \u00feungami\u00f0jan
  \u00ed \u00fev\u00ed sem landi\u00f0 hefur a\u00f0 bj\u00f3\u00f0a. Ef horft er
  til framt\u00ed\u00f0ar, er \u00fev\u00ed haldi\u00f0 fram a\u00f0 \u00farbatur
  \u00e1 \u00feessu svi\u00f0i s\u00e9u eitt mikilv\u00e6gasta m\u00e1li \u00edslenskra
  fer\u00f0a\u00fej\u00f3nustu. Br\u00fdnt er a\u00f0 hra\u00f0a \u00feeim \u00farb\u00f3tum,
  ella er s\u00fa h\u00e6tta fyrir hendi a\u00f0 \u00cdsland muni innan f\u00e1rra
  \u00e1ra standa samkeppnisl\u00f6ndum s\u00ednum a\u00f0 baki \u00e1 \u00feessu
  svi\u00f0i.\\n\\nMikilv\u00e6gt er a\u00f0 n\u00fdta \u00fe\u00e1 s\u00e9rfr\u00e6\u00f0imenntun
  sem tilt\u00e6k er til a\u00f0 veita s\u00e9rh\u00e6f\u00f0um h\u00f3pum sem besta
  \u00fej\u00f3nustu, t.d. \u00e1 svi\u00f0i n\u00e1tt\u00faruv\u00edsinda, s\u00f6gu
  og menningar.\\n\\nM\u00f6rku\u00f0 ver\u00f0i s\u00fa stefna a\u00f0 b\u00e6ta
  \u00f6ryggi fer\u00f0amanna \u00ed afpreyingu og \u00e1 \u00f3bygg\u00f0um sv\u00e6\u00f0um
  og stu\u00f0la a\u00f0 \u00feeirri \u00edmynd \u00e1 erlendum m\u00f6rku\u00f0um
  a\u00f0 \u00cdsland s\u00e9 \u201e\u00f6rguggt \u00e6vint\u00fdraland\u201c.\\n\\n9.8
  Hestafer\u00f0ir - greinarger\u00f0\\n\\nHestafer\u00f0amennska hefur a\u00f0 mestu
  veri\u00f0 \u00f3h\u00e1\u00f0 r\u00edkisafskiptum og liti\u00f0 um a\u00f0 einstaklingar
  hafi \u00feegi\u00f0 opinbera styrki til starfseminnar. Stefna ber a\u00f0 \u00fev\u00ed
  a\u00f0 bein afskipti hins opinbera ver\u00f0i \u00ed l\u00e1gmarki.\\n\\nNau\u00f0synlegt
  er hins vegar a\u00f0 r\u00edkisvaldi\u00f0 a\u00f0sto\u00f0i greinina \u00ed heild
  me\u00f0 ger\u00f0 \u00e1\u00e6tlana vi\u00f0 uppbyggingu rei\u00f0vega og kosti
  \u00fe\u00e6r framkv\u00e6mdir. B\u00e6tt rei\u00f0vegakerfi er ein a\u00f0alforsenda
  \u00feess a\u00f0 atvinnugreinin dafni.\\n\\nMj\u00f6g mikilv\u00e6gt er a\u00f0
  lei\u00f0s\u00f6gn s\u00e9 veitt \u00ed hestafer\u00f0um og \u00feeir sem annast
  lei\u00f0s\u00f6gn geti tj\u00e1\u00f0 sig \u00e1 erlendum tungum\u00e1lu.\\n\\nVer\u00f0i
  um frekar fj\u00e1rhagsa\u00f0sto\u00f0 r\u00edkisvaldsins a\u00f0 r\u00e6\u00f0a
  er br\u00fdnst a\u00f0 verja henni til kynningar og marka\u00f0ssettingar.\\n\\nVi\u00f0a
  \u00e1 h\u00e1leindinu skortir tilfinnanlega a\u00f0sto\u00f0u fyrir hestafer\u00f0ir.\\n\\nStyrkleiki
  fer\u00f0a\u00fej\u00f3nustu af \u00feessu tagi felst einkum \u00ed eftirfarandi:\\n\\n-
  H\u00fan er fr\u00e1brug\u00f0in annari fer\u00f0amennsku, ekki s\u00edst fyrir
  gesti. St\u00f6\u00f0ugt fj\u00f6lgar kaupendum fer\u00f0anna.\\n\\n- Atvinnugreinin
  er tilt\u00f6lulega ung a\u00f0 \u00e1rum. S\u00edfellt er veri\u00f0 a\u00f0 auka
  og b\u00e6ta \u00fej\u00f3nustuna. \u00d3nota\u00f0ir m\u00f6guleikar eru hvarvetna
  fyrir hendi.\\n\\n- Mj\u00f6g v\u00ed\u00f0a er g\u00f3\u00f0 a\u00f0sta\u00f0a
  til a\u00f0 koma upp og auka \u00feessa grein fer\u00f0a\u00fej\u00f3nustunnar.\\n\\n-
  Hestafer\u00f0ir eru fyrir alla aldursh\u00f3pa og nj\u00f3ta vaxandi vins\u00e6lda
  me\u00f0al fj\u00f6lskyldna.\\n\\nHelstu veikleikar \u00feessarar fer\u00f0a\u00fej\u00f3nustu
  eru:\\n\\n- \u00cdsland er d\u00fdrt fer\u00f0amannaland og hestafer\u00f0ir \u00e1
  \u00cdslandi eru d\u00fdrar.\\n\\n- Stofnkostna\u00f0ur er mikill og s\u00f6mulei\u00f0is
  vi\u00f0haldskostna\u00f0ur. \u00de\u00e1 er atvinnugreinin starfsmannafrek.\\n\\n-
  Stuttur fer\u00f0amannat\u00edmi. Mikilsvert er a\u00f0 lengja \u00feennan t\u00edma.\\n\\n9.9
  R\u00e1\u00f0stefnur og fundir - greinarger\u00f0\\n\\nPr\u00e1tt fyrir \u00f6rar
  t\u00e6kniframfarir \u00e1 svi\u00f0i uppl\u00fdsingami\u00f0lunar vir\u00f0ist
  r\u00e1\u00f0stefnu- og fundahald \u00ed heiminum s\u00edst vera a\u00f0 dragast
  saman. \u00c1 \u00cdslandi vir\u00f0ast erlendar r\u00e1\u00f0stefnur og fundir
  vera \u00ed vexti:\\n\\n19. mynd: Pr\u00f3un \u00e1 fj\u00f6lda r\u00e1\u00f0stefnu-
  og fundagesta 1993-1996 (1996: Sta\u00f0festar r\u00e1\u00f0stefnur \u00ed desember
  1995) Heimild: R\u00e1\u00f0stefnuskrifstofa \u00cdslands\\n\\nFlestar erlendar
  r\u00e1\u00f0stefnur og fundir sem haldnir eru \u00e1 \u00cdslandi eiga uppruna
  sinn annars sta\u00f0ar \u00e1 Nor\u00f0url\u00f6ndum. \u00c1 allra s\u00ed\u00f0ustu
  \u00e1rum hefur r\u00e1\u00f0stefnum og fundum \u00e6ttu\u00f0um fr\u00e1 meginlandi
  Evr\u00f3pu fj\u00f6lga\u00f0 nokku\u00f0.\\n\\n20. mynd: Uppruni r\u00e1\u00f0stefna
  og funda \u00e1 \u00cdslandi 1989-1991\\nHeimild: R\u00e1\u00f0stefnuskrifstofa
  \u00cdslands\\n\\nB\u00e1tttakendafj\u00f6ldi \u00e1 r\u00e1\u00f0stefnum og fundum
  \u00e1 \u00cdslandi er mj\u00f6g misjafn, allt fr\u00e1 20 manns og upp \u00ed 300-600
  manns. Gr\u00f3flega \u00e6\u00e6tlabur me\u00f0alfj\u00f6ldi \u00e1 r\u00e1\u00f0stefnum
  og fundum sl. \u00e1r hefur veri\u00f0 150 manns. Marka\u00f0ssetning vegna r\u00e1\u00f0stefna
  og funda hefur \u00fe\u00e1 s\u00e9rst\u00f6\u00f0u a\u00f0 markh\u00f3pagreining
  er tilt\u00f6lulega au\u00f0yeld og allt marka\u00f0sstarf \u00fev\u00ed markvissara
  en ella.\\n\\nReglan \u00ed r\u00e1\u00f0stefnu- og fundahaldi er s\u00fa, a\u00f0
  sjaldan er bo\u00f0a\u00f0 til \u00feeirra \u00ed hinum hef\u00f0bundnu sumarleysism\u00e1nu\u00f0um
  (j\u00fal\u00ed og \u00e1g\u00fast). Vins\u00e6lasti m\u00e1nu\u00f0urinn er j\u00fan\u00edsm\u00e1nu\u00f0ur.
  Sta\u00f0festar r\u00e1\u00f0stefnur \u00e1 \u00cdslandi (desember 1995) fyrir \u00e1ri\u00f0
  1996 skiptast \u00feannig a\u00f0 54% \u00feeirra falla \u00e1 m\u00e1nu\u00f0i
  utan h\u00e1annar og 23% \u00e1 j\u00fan\u00edsm\u00e1nu\u00f0.\\n\\nR\u00e1\u00f0stefnu-
  og fundafer\u00f0amennska er alls sta\u00f0ar mj\u00f6g eftirs\u00f3tt vegna \u00feess
  a\u00f0 h\u00fan er \u00f3h\u00e1\u00f0 ve\u00f0urfari og vegna \u00feess a\u00f0
  r\u00e1\u00f0stefnugestir skila hlutfallslega miklum tekjum og \u00e1hrif \u00feessarar
  tegundar fer\u00f0amennsku hefur einna s\u00edst ska\u00f0leg \u00e1hrif \u00e1
  allt umhverfi.\\n\\nHelstu styrkleikar:\\n\u00cd k\u00f6nnun sem ger\u00f0 var me\u00f0
  tilstu\u00f0lan R\u00e1\u00f0stefnuskrifstofu \u00cdslands (RS\u00cd) \u00e1 fimmt
  r\u00e1\u00f0stefnum \u00e1ri\u00f0 1995 me\u00f0 um 250 manna \u00fartaki r\u00e1\u00f0stefnugesta
  kom \u00ed lj\u00f3s a\u00f0 94,7% a\u00f0spur\u00f0ra s\u00f6g\u00f0ust geta m\u00e6lt
  me\u00f0 \u00cdslandi sem r\u00e1\u00f0stefnulandi.\\n\\nH\u00e9r er unnt a\u00f0
  veita pers\u00f3nulega og g\u00f3\u00f0a \u00fej\u00f3nustu og \u00e1g\u00e6ta fundaa\u00f0st\u00f6\u00f0u
  upp a\u00f0 vissum h\u00e1marksfj\u00f6lda r\u00e1\u00f0stefnugesta. Nau\u00f0synlegur
  t\u00e6kni\u00feuna\u00f0ur er fyrir hendi e\u00f0a er \u00fatvegadur erlendis fr\u00e1.
  \u00cdslandingar geta bo\u00f0i\u00f0 g\u00f3\u00f0a gistingu \u00e1 samkeppnish\u00e6fu
  ver\u00f0i, g\u00f3\u00f0ar veitingar og g\u00f3\u00f0ar samg\u00f6ngur vi\u00f0
  st\u00f3rana hluta Evr\u00f3pu. \u00cdsland er \u201e\u00f3venjulegur\u201c fundarsta\u00f0ur
  og h\u00e9r er h\u00e6gt a\u00f0 bj\u00f3\u00f0a upp \u00e1 spennandi afpreyingu.\\n\\n\u00c1
  \u00cdslandi er \u00fear a\u00f0 auki starfr\u00e6kt s\u00e9rst\u00f6k skrifstofa,
  R\u00e1\u00f0stefnuskrifstofa \u00cdslands, sem sinnir marka\u00f0sstarf.\\n\\nHelstu
  veikleikar:\\nMarka\u00f0shlutdeild \u00cdslands \u00e1 al\u00fej\u00f3\u00f0legum
  r\u00e1\u00f0stefnu- og fundamarka\u00f0i er mj\u00f6g l\u00edtill og s\u00f6mulei\u00f0is
  \u00feekking skipuleggjenda funda og r\u00e1\u00f0stefna \u00e1 fundarsta\u00f0num
  \u00cdslandi.\\n\\nSamkeppni \u00e1 \u00feessum marka\u00f0i er g\u00edfurlega h\u00f6r\u00f0
  og \u00ed lj\u00f3s\u00ed sm\u00e6\u00f0ar \u00edslenskra fer\u00f0apj\u00f3nustufyrirt\u00e6kja
  og mj\u00f6g takmarka\u00f0s augl\u00fdsinga- og kynningarfj\u00e1rmagns liggur
  lj\u00f3st fyrir a\u00f0 \u00cdsland stendur h\u00f6llum f\u00e6ti \u00ed samanbur\u00f0i
  vi\u00f0 margra keppinauta okkar. Afkastageta \u00cdslands til r\u00e1\u00f0stefnuhalds
  er takm\u00f6rku\u00f0 vi\u00f0 500 manna r\u00e1\u00f0stefnur a\u00f0 h\u00e1marki
  (\u00feess m\u00e1 \u00fe\u00f3 geta a\u00f0 \u00e1 st\u00f3rum hluta r\u00e1\u00f0stefna
  \u00ed heiminum eru \u00fe\u00e1tttakendur innan vi\u00f0 500). Ekki er alltaf h\u00e6gt
  a\u00f0 ganga a\u00f0 h\u00fasna\u00f0i fyrir st\u00f3rar r\u00e1\u00f0stefnur v\u00edsu,
  \u00fear sem ekkert h\u00fasn\u00e6\u00f0i er til \u00e1 \u00cdslandi sem eing\u00f6ngu
  er \u00e6tlad til funda- og r\u00e1\u00f0stefnuhalds.\\n\\nDreifing funda og r\u00e1\u00f0stefnugesta
  um landi\u00f0 er \u00f3fulln\u00e6gjandi (sta\u00f0festar r\u00e1\u00f0stefnur
  1996: H\u00f6fu\u00f0borgarsv\u00e6\u00f0i\u00f0 92%, mi\u00f0a\u00f0 vi\u00f0 \u00fe\u00e1tttakendafj\u00f6lda)
  og \u00fev\u00ed gagnast r\u00e1\u00f0stefnu- og fundafer\u00f0amennska n\u00e6r
  eing\u00f6ngu h\u00f6fu\u00f0borgarsv\u00e6\u00f0inu. \u00dea\u00f0 orsakast \u00fe\u00e6\u00f0i
  af \u00fev\u00ed a\u00f0 a\u00f0sta\u00f0a \u00fati \u00e1 landsbygg\u00f0inni er
  ekki nema \u00ed f\u00e1um tilfellum fulln\u00e6gjandi og auk \u00feess eru r\u00e1\u00f0stefnugestir
  oftast t\u00edma\u00feundir og ekki tilb\u00fain a\u00f0 taka \u00e1 sig meira en
  nau\u00f0synleg fer\u00f0al\u00f6g. Ver\u00f0lag \u00e1 \u00cdslandi virkar \u00ed
  sumum tilfellum heftandi \u00e1 r\u00e1\u00f0stefnu- og fundafer\u00f0amennsku.
  Einkum \u00feykir ver\u00f0 \u00e1 veitingum og \u00e1f\u00e9ngi of h\u00e1tt.\\n\\n9.10
  Hvatafer\u00f0ir - greinarger\u00f0\\n\\nHvatafer\u00f0 er skilgreind sem:\\n\\n\u201eOftast
  s\u00e9rst\u00f6k starfsmannafer\u00f0 me\u00f0alst\u00f3rra og st\u00f3rra fyrirt\u00e6kja.
  Fer\u00f0in er allajafna endapunktur \u00e1 l\u00f6ngu hvataferli (incentive) sem
  \u00e1 a\u00f0 hvetja starfsmenn vi\u00f0komandi fyrirt\u00e6kis til d\u00e1\u00f0a
  (oft er s\u00f6luaukning markmi\u00f0i\u00f0) og \u00feeir starfsmenn sem hafa sta\u00f0i\u00f0
  sig best f\u00e1 fer\u00f0 \u00ed ver\u00f0laun.\u201c\\n\\nMarka\u00f0ur hvatafer\u00f0a
  hefur veri\u00f0 \u00ed vexti \u00e1 \u00cdslandi undanfarinn \u00e1ratug. Tali\u00f0
  er a\u00f0 hann muni vaxa enn frekar \u00e1 n\u00e6stu \u00e1rum. Hvatafer\u00f0amenn
  eru alls sta\u00f0ar vins\u00e6lar fer\u00f0amenn, \u00fear sem \u00fatgj\u00f6ld
  \u00e1 mann og dag eru hlutfallslega h\u00e1. Einnig eru hvatafer\u00f0ir oftast
  utan h\u00e1annat\u00edma, oft \u00e1 ja\u00f0art\u00edmum. Marka\u00f0ssetning
  vegna hvatafer\u00f0a (l\u00edkt og r\u00e1\u00f0stefnu- og funda) hefur s\u00e9rst\u00f6\u00f0u
  a\u00f0 \u00fev\u00ed leyti, a\u00f0 tilt\u00f6lulega au\u00f0velt er a\u00f0 greina
  mikilv\u00e6ga markh\u00f3pa og marka\u00f0sleg \u201evindh\u00f6ggi\u201c \u00fev\u00ed
  \u00f3l\u00edklegru en ella.\\n\\nN\u00fdleg k\u00f6nnun sem ger\u00f0 var \u00ed
  P\u00fdskalandi, okkar helsta marka\u00f0ssv\u00e6\u00f0i, me\u00f0al 60 fyrirt\u00e6kja
  leiddi m.a. eftirfarandi \u00ed lj\u00f3s:\\n\\n\u2022 Algengasta lengd hvatafer\u00f0a
  er 4 dagar (38%)\\n\u2022 75% hvatafer\u00f0ah\u00f3pa eru undir 50 manna\\n\u2022
  Sta\u00f0ir sem eru stutt fr\u00e1 eru vins\u00e6lastir (40% innan P\u00fdskalands,
  57% innan Evr\u00f3pu)\\n\u2022 Nor\u00f0ur-Evr\u00f3pa er \u00ed s\u00f6kn (15%
  hlutdeild sem stendur)\\n\u2022 Mikilv\u00e6gir \u00fe\u00e6ttir vi\u00f0 val \u00e1
  \u00e1fangasta\u00f0 eru \u00e1hugaver\u00f0ir fer\u00f0amannasta\u00f0ir, ver\u00f0lag,
  samg\u00f6ngur, \u00f6ryggi og framandleiki\\n\u2022 Gistia\u00f0sta\u00f0a ver\u00f0ur
  a\u00f0 vera mj\u00f6g g\u00f3\u00f0 (62% fyrirt\u00e6kjanna vilja fyrsta flokks
  gistingu)\\n\u2022 Helstu markmi\u00f0 me\u00f0 hvatafer\u00f0um eru s\u00f6luaukning
  og a\u00f0 b\u00e6ta \u00fej\u00f3nustu vi\u00f0komandi fyrirt\u00e6kja\\n\\nHelstu
  styrkleikar:\\n\u2022 \u00cdsland er flestum framandi land og \u00e6tti \u00fev\u00ed
  a\u00f0 eiga mikla m\u00f6guleika mi\u00f0a\u00f0 vi\u00f0 marka\u00f0shorfur\\n\u2022
  \u00cdsland er innan \u00feeirra marka sem telst stutt fr\u00e1 helstu marka\u00f0ssv\u00e6\u00f0um\\n\u2022
  H\u00e9r er bo\u00f0i\u00f0 upp \u00e1 \u00f3venjulega \u00fej\u00f3nustu/af\u00fereyingu\\n\u2022
  N\u00e6gt frambo\u00f0 er \u00e1 hvatafer\u00f0am\u00f6guleikum til \u00cdslands\\n\u2022
  Hvatafer\u00f0ir eru oft \u00ed sterkum tengslum vi\u00f0 upplifun n\u00e1tt\u00farunnar\\n\u2022
  \u00c1 \u00cdslandi er starfr\u00e6kt s\u00e9rst\u00f6k skrifstofa, R\u00e1\u00f0stefnuskrifstofa
  \u00cdslands, sem sinnir marka\u00f0sstarfir \u00e1 hvatafer\u00f0am\u00f6rku\u00f0um\\n\u2022
  S\u00f6kum sm\u00e6\u00f0ar \u00edslenska marka\u00f0arins er h\u00e6gt a\u00f0
  veita h\u00e9r pers\u00f3nulega og g\u00f3\u00f0a \u00fej\u00f3nustu\\n\\nHelstu
  veikleikar:\\n\u2022 \u00c1 \u00cdslandi eru ekki til neinar a\u00f0gengilegar uppl\u00fdsingar
  um sta\u00f0i\u00f0 og e\u00f0li hvatafer\u00f0amarka\u00f0arins\\n\u2022 Samkeppni
  \u00e1 al\u00fej\u00f3\u00f0legum hvatafer\u00f0amarka\u00f0i er gifurlega h\u00f6r\u00f0\\n\u2022
  Marka\u00f0shlutdeild \u00cdslands er mj\u00f6g l\u00edtil og \u00feekking skipuleggjenda
  hvatafer\u00f0a \u00e1 m\u00f6guleikum \u00cdslands ekki mikil\\n\u2022 Mj\u00f6g
  takmarka\u00f0 augl\u00fdsinga- og kynningarfj\u00e1rmagn til r\u00e1\u00f0st\u00f6funar\\n\u2022
  \u00d3tryggt ve\u00f0urfar\\n\u2022 H\u00e1tt ver\u00f0lag, einkum \u00e1 mat og
  drykk\\n\u2022 Frambo\u00f0 fyrsta flokks gistingar l\u00edti\u00f0\\n\u2022 Flugt\u00edmar
  \u00e1\u00e6tlunarflugs til \u00cdslands eru \u00f3hagst\u00e6\u00f0ir fyrir stuttar
  fer\u00f0ir\\n\u2022 Hvatafer\u00f0amarka\u00f0urinn gagnast landsbygg\u00f0inni
  af l\u00edti\u00f0\\n\\n9.11 Brottfluttir \u00cdslendingar og afkomendur \u00feeirra
  - greinarger\u00f0\\n\\nStyrkleikar\\n\u2022 Vaxandi \u00e1hugi me\u00f0al \u00edb\u00faa
  \u00ed Vesturheimi \u00e1 uppruna s\u00ednum.\\n\u2022 Veri\u00f0 er a\u00f0 vinna
  a\u00f0 skr\u00e1ningu f\u00f3lks af \u00edslenskum uppruna \u00ed Vesturheimi.\\n\u2022
  Vaxandi \u00e1hugi \u00e1 fer\u00f0a\u00fej\u00f3nustu tengdri menningu.\\n\u2022
  \u00de\u00e1tttaka \u00ed evr\u00f3pska samstarfsverkefninu Routes to the Roots.\\n\\nVeikleikar
  og \u00f3gnanir\\n\u2022 S\u00e9rh\u00e6f\u00f0 \u00fej\u00f3nusta fyrir \u00feennan
  markh\u00f3p er enn ekki til \u00e1 \u00cdslandi (s\u00f6fn, o.s.frv.).\\n\u2022
  G\u00e6\u00f0i fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi eru ekki n\u00f3gur
  trygg.\\n\u2022 S\u00e1 hluti Vestur-\u00cdslendinga sem er tengdastur landinu fer
  minnkandi.\\n\u2022 Fer\u00f0am\u00f6nnum fr\u00e1 Kanada hefur ekki fj\u00f6lga\u00f0
  undanfarin \u00e1r eins og fr\u00e1 flestum l\u00f6ndum.\\n\u2022 L\u00e9leg samkeppnissta\u00f0a
  \u00cdslands \u00e1 fj\u00f6lbreyttum fer\u00f0amarka\u00f0i ytra.\\n\\nT\u00e6kif\u00e6ri\\n\u2022
  Bein marka\u00f0ss\u00f3kn me\u00f0 hj\u00e1lp skr\u00e1ningarlistu \u00feess sem
  n\u00fa er \u00ed vinnslu \u00ed Amer\u00edku.\\n\u2022 Samstarf \u00ed gegnum \u201eRoutes
  to the Roots\u201c:\\n\u2022 Betri samg\u00f6ngum\u00f6guleikar \u00ed athugun.\\n\\n\u00c1hrif
  \u00e1 fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi\\n\\nN\u00fdr markh\u00f3pur\\nBetri
  n\u00fdting fj\u00e1rfestinga \u00ed fer\u00f0a\u00fej\u00f3nustu \u00e1 \u00cdslandi\\nN\u00fd
  st\u00f3r\u00f0 og n\u00fd tekif\u00e6ri skapast\\nN\u00fdjung \u00ed fer\u00f0a\u00fej\u00f3nustu
  \u00e1 \u00cdslandi, \u00e1herslan \u00e1 menningu fremur en n\u00e1tt\u00faru landsins\\nM\u00f6guleiki
  \u00e1 lengingu fer\u00f0amannat\u00edmans\\nM\u00f6guleiki \u00e1 aukinni n\u00fdtingu
  \u00e1 j\u00e1\u00f0arsv\u00e6\u00f0um\\n\\n9.12 Saga og menning - greinarger\u00f0\\n\\nErlendir
  fer\u00f0amenn heims\u00e6kja \u00cdsland af \u00fdmsum \u00e1st\u00e6\u00f0um,
  \u00fea\u00f0 bykir eitthva\u00f0 s\u00e9rstakt a\u00f0 hafa komi\u00f0 til \u00feessa
  lands, margir vita af hinni s\u00e9rst\u00e6\u00f0u n\u00e1tt\u00faru, a\u00f0 landi\u00f0
  er enn \u00ed sk\u00f6pun. Margir \u00fej\u00f3\u00f0verjar fjalla landi\u00f0 af
  Nonna-b\u00f3kunum, a\u00f0rir vita af fornmenningu landsins, b\u00f3kmenntum og
  siglingaafrekum. \u00dej\u00f3\u00f0verjar \u00feekkjia \u00fea\u00f0 l\u00edka
  \u00far verkum Richards Wagners. \u00ddmsir vita af \u00cdslandi vegna fundar Reagans
  og Gorbachovs, \u00fe\u00e1 koma Halld\u00f3r Laxness og Vigd\u00eds Finnibogad\u00f3ttir
  mj\u00f6g vi\u00f0 s\u00f6gu, Bj\u00f6rk og ekki s\u00edst \u00edslenski hesturinn.\\n\\nM\u00f6rgum
  \u00feykir \u00fea\u00f0 merkilegt a\u00f0 h\u00e9r er enn t\u00f6lu\u00f0 og l\u00edtt
  breytt hin forna vestnorr\u00e6na tunga, n\u00e1skyld \u00fe\u00fdsku og forn-ensku
  (grunnbygging ensku er germ\u00f6nsk, seljanleg sta\u00f0reynd).\\n\\nFer\u00f0a\u00fej\u00f3nustu
  \u00e1 \u00cdslandi byggist mj\u00f6g \u00e1 ofangreindum atri\u00f0um.\\n\\nA\u00f0
  \u00f6\u00f0ru leyti er v\u00edsa\u00f0 til sk\u00fdrslunnar \u201eTengsl menningars\u00f6gu
  \u00fej\u00f3\u00f0arinnar vi\u00f0 fer\u00f0a\u00fej\u00f3nustu\u201c sem unnin
  var fyrir samg\u00f6ngur\u00e1\u00f0uneyti\u00f0 1995 og notu\u00f0 var sem grunnagn
  vi\u00f0 vinnslu stefnum\u00f3tunarinnar.\\n\\n9.13 Samg\u00f6ngur - greinarger\u00f0\\n\\n\u00cdsland
  er allvel sett hva\u00f0 var\u00f0ar grunn\u00fe\u00e6tti samgangna, \u00fe.e. \u00fatbrei\u00f0slu
  og dreifingu mannvirkja og rekstur \u00feeirra. Hva\u00f0 reglur var\u00f0ar er
  umhverfi h\u00e9r \u00e1 landi mj\u00f6g samb\u00e6rilegt vi\u00f0 \u00fea\u00f0
  sem gerist \u00ed n\u00e1l\u00e6gum l\u00f6ndum, einkum \u00ed Evr\u00f3pu \u00fear
  sem reglur hafa a\u00f0 mestu veri\u00f0 samr\u00e6mdir reglum Evr\u00f3pusambandsins.
  Rekstrarskilyr\u00f0i fyrirt\u00e6kja einstakra greina samgangna eru me\u00f0 nokku\u00f0
  mismunandi h\u00e6tti, allg\u00f6\u00f0 \u00ed flugrekstri, mi\u00f0ur g\u00f3\u00f0
  \u00ed bifrei\u00f0arekstri, en ferjur eru fj\u00e1rmagna\u00f0ar a\u00f0 hluta
  me\u00f0 styrkjum \u00far r\u00edkissj\u00f3\u00f0i. H\u00e9r \u00e1 eftir er fjalla\u00f0
  um hverja grein samgangna fyrir sig, en \u00f3hj\u00e1kv\u00e6milega ver\u00f0ur
  \u00fe\u00f3 \u00e1 st\u00f6ku sta\u00f0 einhver sk\u00f6run.\\n\\nFLUG\\nStyrkleikar:
  Keflav\u00edkurflugv\u00f6llur, flugvellir vi\u00f0 flesta \u00fe\u00e9ttb\u00fdlissta\u00f0i,
  innlend millilandaflugf\u00e9l\u00f6g, Al\u00fej\u00f3\u00f0aflugstj\u00f3rnami\u00f0st\u00f6\u00f0in.\\nVeikleikar:
  B\u00e1gt \u00e1stand Reykjav\u00edkurflugvallar og \u00f3fulln\u00e6gjandi flugst\u00f6\u00f0,
  l\u00e1g fer\u00f0at\u00ed\u00f0ni \u00ed millilandaflugi, l\u00edtil heimamarka\u00f0ur,
  flugf\u00e9lag l\u00edtil og l\u00edtt \u00feekkt erlendis.\\n\u00d3gnanir: Seinkun
  endurb\u00f3t \u00e1 Reykjav\u00edkurflugvelli, \u00f3r\u00f3i \u00e1 vinnumarka\u00f0i,
  seinkun fj\u00e1rfestinga \u00e1 flugv\u00f6llum, hugsanlegar tafir \u00e1 flugi
  milli Amer\u00edku og Evr\u00f3pu um \u00cdsland vegna a\u00f0ildar a\u00f0 Schengen-samkomulaginu.\\nT\u00e6kif\u00e6ri:
  Flugfrelsi til Bandar\u00edkjanna, flugheimildir til Kanada og innan Evr\u00f3pu,
  auki\u00f0 frelsi \u00ed flugi innan Evr\u00f3pusambandsins 1997.\\n\\nVEGIR OG
  AKSTUR\\nStyrkleikar: Vi\u00f0fe\u00f0mt vegakerfi, frj\u00e1lsir \u00f3reglubundnir
  flutningar me\u00f0 r\u00fatum, almenn skilyr\u00f0i - g\u00e6\u00f0akr\u00f6fur
  - til rekstrar r\u00fatub\u00edla og leigub\u00edla (taxa).\\nVeikleikar: H\u00e1tt
  hlutfall vondra vega, vetrar\u00f3f\u00e6r\u00f0, erfi\u00f0 rekstrarskilyr\u00f0i
  r\u00fatufyrirt\u00e6kja, g\u00e6\u00f0aflokkun r\u00fatub\u00edla vantar.\\n\u00d3gnanir:
  Slysah\u00e6tta \u00e1 vondum vegum, samkeppni erlendra r\u00fatufyrirt\u00e6kja.\\nT\u00e6kif\u00e6ri:
  Malarvegir, \u00f3f\u00e6r\u00f0 og torf\u00e6rur, erlendir leigub\u00edlar \u00e1
  h\u00e1annat\u00edma.\\n\\nSIGLINGAR OG FERJUR\\n\\n**Vyrkleikar:** Miklar \u00f6ryggiskr\u00f6fur,
  ferjusamband vi\u00f0 Evr\u00f3pu, Vegager\u00f0in ber \u00e1byrg\u00f0 \u00e1 rekstri
  innlendra ferja, fr\u00e1lsar siglingar til landsins og vi\u00f0 landi\u00f0.\\n\\n**Veikleikar:**
  Millilandaferjan \u00fearfast endurn\u00fdjunar, f\u00e1ar hafnir taka skemmtifer\u00f0askip
  a\u00f0 \u00f6ryggju, l\u00e9l\u00e9g n\u00fdting ferja.\\n\\n**\u00d3gmanir:**
  \u00d3v\u00e6nt illvi\u00f0ri, ferjuslys einhvers sta\u00f0ar.\\n\\n**T\u00e6kif\u00e6ri:**
  B\u00e6tt vegasamband a\u00f0 ferjuh\u00f6fnum.\\n\\n---\\n\\n9.14 Umhverfisvernd
  - greinarger\u00f0\\n\\nFer\u00f0abj\u00f3nustan er vaxandi atvinnugrein. Fer\u00f0amannasta\u00f0irnir
  eru d\u00fdrm\u00e6t au\u00f0lind sem varast ber a\u00f0 ofn\u00fdta. \u00d3h\u00e6tt
  er a\u00f0 fullyr\u00f0a a\u00f0 afrauksturinn af n\u00fdtingu au\u00f0lindarinnar
  skilar s\u00e9r ekki til \u00farb\u00f3ta \u00e1 \u00feeim.\\n\\n**H\u00e6tta er
  \u00e1 a\u00f0:**\\n- Au\u00f0lindin ver\u00f0i ofn\u00fdtt\\n- Fer\u00f0amannasta\u00f0irnir
  ver\u00f0i einskismannsl\u00f6nd, allt mi\u00f0ist vi\u00f0 a\u00f0 n\u00fdta \u00fe\u00e1
  \u00e1 sem \u00f3d\u00fdrastan h\u00e1tt.\\n- Umhverfism\u00e1l \u00e1 fer\u00f0amannast\u00f6\u00f0um
  f\u00e1i ekki e\u00f0ilegt fj\u00e1rmagn til \u00farb\u00f3ta og vi\u00f0halds.\\n-
  Loka ver\u00f0i st\u00f6\u00f0um\\n- F\u00e6rri gestir komi til landsins\\n- Gjaldeyristekjur
  minnki\\n- Fer\u00f0abj\u00f3nustan tapi, st\u00f6rf tapist\\n\\n**Stefnt skal a\u00f0
  eftirfarandi:**\\n- A\u00f0 n\u00e1 e\u00f0ilegum fj\u00f6lda fer\u00f0amanna, \u00e1n
  \u00feess a\u00f0 \u00e1n\u00ed\u00f0slan \u00e1 landinu ver\u00f0i of mikil\\n-
  A\u00f0 n\u00fdta hluta af gjaldeyristekjum til a\u00f0 vi\u00f0halda fer\u00f0amannast\u00f6\u00f0um
  og byggja n\u00fdja\\n\\n**Ni\u00f0urst\u00f6\u00f0a:**\\n- \u00cdsland er fer\u00f0amannaland
  me\u00f0 mikla n\u00e1tt\u00farufegur\u00f0\\n- Fer\u00f0am\u00f6nnum mun fj\u00f6lga
  miki\u00f0 n\u00e6stu \u00e1rin\\n- \u00c1n\u00ed\u00f0slan og landey\u00f0ingin
  er mikil og eykst \u00e1 fer\u00f0amannast\u00f6\u00f0unum\\n- Gjaldeyristekjur
  fer\u00f0abj\u00f3nustu skila s\u00e9r ekki til fer\u00f0amannasta\u00f0anna til
  forvarnara\u00f0ger\u00f0a og vi\u00f0halds\\n\\nA\u00f0 \u00f6\u00f0ru leyti skal
  v\u00edsa\u00f0 til sk\u00fdrslu um umhverfism\u00e1l \u00e1 fer\u00f0amannast\u00f6\u00f0um
  sem unnin var fyrir samg\u00f6ngur\u00e1\u00f0uneyti\u00f0 \u00e1ri\u00f0 1995 og
  var notu\u00f0 sem grunngagn vi\u00f0 vinnslu stefnum\u00f3tunarinnar.\\n\\n9.15
  Sj\u00e1lfb\u00e6r fer\u00f0amennska/bj\u00f3nusta - greinarger\u00f0\\n\\n\u00c1
  \u00e1rinu 1995 voru erlendir fer\u00f0amenn \u00e1 \u00cdslandi n\u00e6r 190.000
  talsins. Stefnt er a\u00f0 6% aukningu \u00ed komum erlendra fer\u00f0amanna til
  \u00e1rsins 2000 og 3-6% aukningu \u00ed fer\u00f0um \u00cdslendinga um eig\u00f0
  land. \u00c1 sama t\u00edma og sl\u00edkt er sett fram er ger\u00f0 \u00fattekt
  \u00e1 st\u00f6\u00f0u n\u00e1tt\u00farulegs umhverfis \u00e1 nokkrum helstu fer\u00f0amannast\u00f6\u00f0um
  \u00cdslands og eru ni\u00f0urst\u00f6\u00f0ur \u00fear a\u00f0 verja \u00feurf
  210 millj\u00f3num kr\u00f3na til a\u00f0 lagf\u00e6ra a\u00f0st\u00f6\u00f0u. \u00cdsland
  er kynnt erlendis sem hreint og \u00f3meng\u00e6\u00f0 land og samkv\u00e6mt k\u00f6nnunum
  er hrein og t\u00e6r n\u00e1tt\u00faran helsta a\u00f0r\u00e6\u00f0tarafi \u00cdslands.
  \u00c1 sama t\u00edma stu\u00f0la forsvarsmenn stj\u00f3rnavalda og atvinnul\u00edfs
  a\u00f0 eflingu st\u00f3ri\u00f0ju og leggja \u00e1 r\u00e1\u00f0in um virkjanir
  \u00e1 h\u00e1leindi \u00cdslands.\\n\\nHugmyndafr\u00e6\u00f0i sj\u00e1lfb\u00e6rrar
  fer\u00f0amennsku/bj\u00f3nustu \u00e1 r\u00f3t s\u00edna a\u00f0 rekja til vaxandi
  umhverfis-hyggu n\u00e1tt\u00faruverndarsins og annarra \u00feeirra sem telja s\u00edaukinn
  fj\u00f6lda fer\u00f0amanna \u00ed heiminum leggja aukna byr\u00f0i \u00e1 umhverfi
  og samf\u00e9lag. Skilgreiningar \u00e1 hugtakinu eru margar og vi\u00f0t\u00e6kjar
  auk \u00feess sem hugmyndafr\u00e6\u00f0in er kynnt undir m\u00f6rgum n\u00f6fnunum.
  Til n\u00e1nari sk\u00fdringar \u00e1 skilgreiningum og \u00fatlistunar \u00e1 hugmyndafr\u00e6\u00f0inni
  er v\u00edsa\u00f0 til \u00edtarefnis. \u00deess skal \u00fe\u00f3 geti\u00f0 h\u00e9r
  a\u00f0 hugt\u00f6kin \u201eumhverfi\u201c og \u201eau\u00f0lindir\u201c eru sett
  fram \u00ed vi\u00f0ustu merkingu \u00feeirra or\u00f0a, p.e. umhverfi vi\u00f0ar
  til n\u00e1tt\u00farulegs, menningarlegs, f\u00e9lagslegs og efnahagslegs umhverfis
  og au\u00f0lindir fer\u00f0abj\u00f3nustu er allt \u00fea\u00f0 sem \u201es\u00f6luvaran
  \u00cdsland\u201c samanstendur af.\\n\\nSj\u00e1lfb\u00e6r fer\u00f0am\u00e1l eru
  s\u00fa lausn, sem hinn al\u00fej\u00f3\u00f0legi armur fer\u00f0abj\u00f3nustunnar
  hefur lagt fram gegn \u00feeim geigv\u00e6nlegu vandam\u00e1lum sem vi\u00f0 blasa
  \u00ed heiminum vegna s\u00edaukins fj\u00f6lda fer\u00f0amanna.\\n\\nHugmyndafr\u00e6\u00f0in
  sn\u00fdst fyrst og fremst um stj\u00f3rnum og skipulag fer\u00f0abj\u00f3nustu
  og uppbyggingu fer\u00f0abj\u00f3nustu \u00e1 sem ar\u00f0v\u00e6nlegastan h\u00e1tt
  \u00ed n\u00fatt\u00f6 og framt\u00f6. \u00c1hersla er l\u00f6g\u00f0 \u00e1 n\u00e6mari
  umhverfisvituund allra \u00feeirra sem vi\u00f0 fer\u00f0abj\u00f3nustu f\u00e1st,
  svo og fer\u00f0amanna, enn fremur a\u00f0 r\u00e9ttur \u00feess f\u00f3lks, sem
  lifir og b\u00fdr \u00e1 fer\u00f0amannast\u00f6\u00f0um, s\u00e9 virtur og teki\u00f0
  tillit til \u00feess vi\u00f0 \u00e1kv\u00e6\u00f0anat\u00f6ku um fer\u00f0am\u00e1l
  og uppbyggingu vi\u00f0komandi sta\u00f0a. Hlutverk fer\u00f0abj\u00f3nustu er a\u00f0
  stu\u00f0la a\u00f0 verndun og vi\u00f0haldi au\u00f0linda og auka l\u00edfsg\u00e6\u00f0i
  \u00feeirra sem fer\u00f0amannasta\u00f0i byggja.\\n\\n9.16 Fer\u00f0am\u00e1l \u00ed
  landsskipulagi framt\u00ed\u00f0arinnar - greinarger\u00f0\\n\\n\u00cd m\u00f6rgum
  l\u00f6ndum hefur veri\u00f0 komi\u00f0 \u00e1 svok\u00f6llu\u00f0u \u201elandsskipulagi\u201c
  \u00fear sem unni\u00f0 er a\u00f0 stefnum\u00f3tun fyrir landi\u00f0 \u00ed heild
  og stefnan \u00ed hinum \u00fdmsu atvinnugreinum sko\u00f0u\u00f0 \u00ed lj\u00f3s\u00ed
  \u00feess. \u00cd Danm\u00f6rku h\u00f6fst \u00feessi vinna um 1960 \u00feegar komi\u00f0
  var \u00e1 f\u00f3t \u201elandsplanudvalget\u201c. S\u00fa nefnd vann a\u00f0allega
  a\u00f0 samh\u00e6fingu hinna \u00fdmsu \u00e1\u00e6tlana, enda auglj\u00f3st a\u00f0
  \u00fear er um gagnvirkni a\u00f0 r\u00e6\u00f0a. \u00deannig gerir t.d. hugmynd
  a\u00f0 fer\u00f0am\u00e1lastefnu \u00e1kve\u00f0nar kr\u00f6fur um uppbyggingu
  og bj\u00f3nustusta\u00f0la \u00e1 vegakerfinu. H\u00e1lendisfer\u00f0amennska gerir
  svo t.d. a\u00f0rar kr\u00f6fur a\u00f0 \u00feessu leyti en fer\u00f0amennska \u00e1
  l\u00e1glendi.\\n\\nLandsskipulagi er \u00e6tlad a\u00f0 draga upp myndir af \u00fev\u00ed
  hverjir ver\u00f0a meginatvinnuvegirnir \u00ed framt\u00ed\u00f0inni og hver meginstefnan
  ver\u00f0ur. \u00dea\u00f0 er auglj\u00f3st a\u00f0 bygg\u00f0amynstur framt\u00ed\u00f0arinnar
  og \u00fe\u00fd\u00f0ing hinna \u00fdmsu sv\u00e6\u00f0a og b\u00e6ja mun mj\u00f6g
  fara eftir \u00fev\u00ed hvernig atvinnuvegir \u00fej\u00f3\u00f0arinnar \u00fer\u00f3ast.
  Bygg\u00f0amynstur \u00cdslands \u00fear sem megin\u00e1herslan var\u00f0 \u00e1
  orkuvinnslu og st\u00f6ri\u00f0ju er t.d. anna\u00f0 en ef \u00e1kve\u00f0i\u00f0
  yr\u00f0i a\u00f0 fer\u00f0a\u00fej\u00f3nusta yr\u00f0i meginatvinnugrein framt\u00ed\u00f0arinnar.
  \u00dea\u00f0 er \u00fev\u00ed mj\u00f6g br\u00fdnt a\u00f0 vi\u00f0 framt\u00ed\u00f0aruppbyggingu
  og skipulag sta\u00f0a og sv\u00e6\u00f0a ver\u00f0i teki\u00f0 mi\u00f0 af \u00fe\u00f6rfum
  fer\u00f0a\u00fej\u00f3nustunnar.\\n\\n9.17 Fylgiskj\u00f6l\\n\\n9.17.1 Vi\u00f0m\u00e6lendalisti\\n\\nH\u00e9r
  \u00e1 eftir fer listi yfir vi\u00f0m\u00e6lendur. Margir \u00feeirra r\u00e6ddu
  vi\u00f0 fleiri en einn undirh\u00f3p e\u00f0a starfsmann en a\u00f0rir komu vi\u00f0
  s\u00f6gu \u00ed vinnu einstakra m\u00e1lefnah\u00f3pa.\\n\\nVi\u00f0m\u00e6lendur
