  \u00fea\u00f0 |\\n| A\u00f0 \u00feau skilji a\u00f0 \u00ed l\u00fd\u00f0r\u00e6\u00f0islegu
  samf\u00e9lagi gilda \u00e1kve\u00f0nar reglur sem \u00feau ver\u00f0a a\u00f0 fara
  eftir. | Kenna b\u00f6rnunum a\u00f0 \u00feau \u00feurfi a\u00f0 fara eftir reglum
  sem gilda \u00e1 leiksk\u00f3lanum. \u00d6llu fylgir ors\u00f6k e\u00f0a aflei\u00f0ing
  |\\n| A\u00f0 gefa \u00f6llum sama t\u00e6kif\u00e6ri \u00e1 a\u00f0 taka \u00fe\u00e1tt
  \u00ed verkefnum og mismuna engum. Hvetja | Hafa g\u00f3\u00f0a yfirs\u00fdn yfir
  hvert barna og a\u00f0 allir f\u00e1i a\u00f0 nj\u00f3ta \u00feess sama. Efla samskifti
  \u00feeirra |\\n\\nSk\u00f6pun 3-4 \u00e1ra\\n\\nSk\u00f6pun: Sk\u00f6pun er lei\u00f0
  einstaklings til \u00feess a\u00f0 tengja n\u00fdja upplifun fyrri \u00feekkingu
  og ver\u00f0a \u00feannig ,,meiri \u00ed dag en \u00ed g\u00e6r\\\" Sk\u00f6punargle\u00f0in  sprettur
  fram vegna forvitni og athafna\u00fer\u00e1 sem lei\u00f0ir til n\u00e1ms\u00e1huga
  og frumkv\u00e6\u00f0is. Sk\u00f6pun er a\u00f0 uppg\u00f6tva, nj\u00f3ta, \u00f6rva
  forvitni og \u00e1huga, virkja \u00edmyndunarafl og leika s\u00e9r me\u00f0 m\u00f6guleika.
  H\u00fan br\u00fdtur hef\u00f0bundin mynstur, reglur og kerfi og veitir n\u00fdja
  s\u00fdn \u00e1 fyrirb\u00e6ri og vi\u00f0teknar hugmyndir. Leikur er mikilv\u00e6g
  n\u00e1msa\u00f0fer\u00f0 og opnar v\u00edddir \u00fear sem sk\u00f6punargle\u00f0i
  barna og ungmenna getur noti\u00f0 s\u00edn.  Hamingja og gle\u00f0i liggja \u00ed
  \u00fev\u00ed a\u00f0 finna h\u00e6fileikum s\u00ednum farveg og  f\u00e1 a\u00f0
  nj\u00f3ta s\u00edn sem einstaklingur og hluti af heild.\\n\\nStarfsmenn \u00e1
  S\u00f3ley taka tillit til \u00e1huga barnanna hva\u00f0 var\u00f0ar sk\u00f6pun
  en kynna \u00fearf fyrir \u00feeim mismunandi efnivi\u00f0 og \u00e1h\u00f6ld sem
  efla hugmyndarflug \u00feeirra og getu. Gefa \u00fearf \u00feeim t\u00edma og  \u00edmyndunarafli
  \u00feeirra lausan tauminn svo \u00feau \u00f6\u00f0list frumkv\u00e6\u00f0i og
  kjark til a\u00f0 skapa \u00fea\u00f0 sem \u00feeim langar til. Starfsf\u00f3lk
  \u00fearf a\u00f0 virkja sk\u00f6punargle\u00f0i barnanna en \u00fea\u00f0 gera
  \u00feeir me\u00f0 \u00fev\u00ed a\u00f0 gefa \u00feeim t\u00edma til a\u00f0 framkv\u00e6ma
  \u00fea\u00f0 sem \u00feau langar til og vera \u00e1hugasamir sj\u00e1lfir og r\u00e6\u00f0a
  vi\u00f0 b\u00f6rnin. Sk\u00f6pun fellst ekki eing\u00f6ngu \u00ed \u00fev\u00ed
  a\u00f0 skila fr\u00e1 s\u00e9r einhverju verki heldur er h\u00fan einnig \u00ed
  leikr\u00e6nni tj\u00e1ningu, \u00fev\u00ed er mikilv\u00e6gt a\u00f0 starfsf\u00f3lk
  s\u00e9 fyrirmynd \u00ed \u00fev\u00ed og \u00f3hr\u00e6tt vi\u00f0 a\u00f0 taka
  \u00fe\u00e1tt \u00ed frj\u00e1lsum leik barnanna. Skapandi starf \u00e1 a\u00f0
  beinast a\u00f0 \u00fev\u00ed sem gert er \u00fear sem allir f\u00e1i noti\u00f0
  s\u00edn \u00e1 s\u00ednum forsendum. Starfsf\u00f3lk gegnir lykilhlutverki \u00ed
  \u00f6llu sk\u00f3lastarfi, \u00fev\u00ed er \u00fea\u00f0 mikilv\u00e6gt a\u00f0
  \u00feeir n\u00fdti s\u00edna fag\u00feekkingu \u00ed a\u00f0 kenna b\u00f6rnum
  hinar \u00fdmsu greinar sk\u00f6punar \u00fev\u00ed sk\u00f6pun er \u00ed \u00f6llu
  umhverfinu. Starfsf\u00f3lk \u00fearf a\u00f0 vera frj\u00f3tt og geta vaki\u00f0
  upp \u00e1huga barnanna sem lei\u00f0ir til spurninga \u00farlausnar og skapandi
  hugsunar. Taka tillit til \u00e1huga hvers og eins er var\u00f0ar sk\u00f6pun.\\n\\nSk\u00f6pun
  3-4 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n| A\u00f0 gefa b\u00f6rnunum
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 tj\u00e1 sig \u00ed gegnum myndlist . | Hafa bl\u00f6\u00f0
  og efnivi\u00f0 a\u00f0gengilegan. Hvetja \u00feau til a\u00f0 skrifa, lita og m\u00e1la
  og r\u00e6\u00f0a vi\u00f0 \u00feau \u00e1 me\u00f0an hva\u00f0 \u00feau eru a\u00f0
  skapa |\\n| A\u00f0 auka \u00edmyndunarafl barnanna og kynna fyrir \u00feeim hinar
  \u00fdmsu lei\u00f0ir og efnivi\u00f0 | Vera me\u00f0 b\u00f6rnunum og r\u00e6\u00f0a
  vi\u00f0 \u00feau. N\u00fdta efnivi\u00f0 eins og laufbl\u00f6\u00f0 og gefa \u00feeim
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 fara \u00fe\u00e1 lei\u00f0 sem \u00feau kj\u00f3sa
  a\u00f0 fara |\\n| A\u00f0 tengja saman hlj\u00f3\u00f0, mynd og t\u00f3nlist me\u00f0
  hreyfingu og hinum fj\u00f6lbreyttu hlj\u00f3\u00f0f\u00e6rum | A\u00f0 n\u00fdta
  leiki til a\u00f0 f\u00e1 b\u00f6rnin til a\u00f0 \u00e1tta sig \u00e1 a\u00f0 hlj\u00f3\u00f0
  og mynd fara saman. Auk \u00feess a\u00f0 kynna fyrir \u00feeim fj\u00f6lbreytta
  t\u00f3nlist. |\\n| A\u00f0 kynna fyrir b\u00f6rnunum texta og s\u00f6ng og hafa
  skipulag\u00f0ar s\u00f6ngstundir | Hafa skipulag\u00f0ar s\u00f6ngstundir og kenna
  b\u00f6rnunum lag og texta. Bj\u00f3\u00f0a einnig upp \u00e1 hreyfis\u00f6ngva
  og f\u00e1 b\u00f6rnin me\u00f0 |\\n| A\u00f0 b\u00f6rnin f\u00e1i a\u00f0 kynnast
  hinum \u00fdmsu listum sem vekur upp \u00edmyndurnarafl \u00feeirra og spurningar
  | Fara me\u00f0 b\u00f6rnin \u00e1 listas\u00f6fn og a\u00f0rar s\u00fdningar. |\\n|
  A\u00f0 gefa \u00feeim kost \u00e1 a\u00f0 vinna \u00e1 s\u00ednum forsendum og
  \u00feroska | Hvetja hvert og eitt til a\u00f0 tj\u00e1 sig. Starfsf\u00f3lk \u00fearf
  a\u00f0 efla sk\u00f6punarkraft \u00feeirra me\u00f0 \u00fev\u00ed a\u00f0 vera
  me\u00f0 \u00ed ath\u00f6fninni. |\\n\\nHeilbrig\u00f0i og velfer\u00f0 3-4 \u00e1ra\\n\\n\u00deegar
  r\u00e6tt er um heilbrig\u00f0i er v\u00edsa\u00f0 til andlegrar, l\u00edkamlegrar
  og f\u00e9lagslegrar vell\u00ed\u00f0unar f\u00f3lks.  Allt sk\u00f3lastarf \u00e1
  a\u00f0 mi\u00f0a a\u00f0 \u00fev\u00ed a\u00f0 efla heilbrig\u00f0i og stu\u00f0la
  markvisst a\u00f0 velll\u00ed\u00f0an barnanna me\u00f0 tilliti til sj\u00e1lfsmyndar,
  hreyfingar, n\u00e6ringar, hv\u00edldar, andlegrar vell\u00ed\u00f0anar, g\u00f3\u00f0ra
  samskipta, \u00f6ryggis, hreinl\u00e6tis, kynheilbrig\u00f0is og skilnings \u00e1
  eigin tilfinningum og annarra.\\n\\n\u00c1 Ki\u00f0agili er l\u00f6g\u00f0 \u00e1hersla
  \u00e1 hreyfingu barna og hreyfiuppeldi. B\u00f6rnin fara \u00ed leikfimish\u00fas
  einu sinni \u00e1 h\u00e1lfsm\u00e1na\u00f0ar fresti sem er utan vi\u00f0 \u00fe\u00e1
  hreyfingu sem \u00feau i\u00f0ka \u00ed sal sk\u00f3lans. B\u00f6rn tj\u00e1 sig
  snemma me\u00f0 hreyfingu, \u00feau skynja l\u00edkama sinn og finna styrk sinn
  og getu. G\u00f3\u00f0 hreyfif\u00e6rni eykur sj\u00e1lfstraust \u00e1samt \u00fev\u00ed
  a\u00f0 b\u00e6ta  heilsu, snerpu og \u00feol. L\u00edkamlegri \u00e1reynslu fylgir
  hv\u00edld og \u00fear skynjar barni\u00f0 mun \u00e1 spennu og sl\u00f6kun. \u00dativera
  og hreyfing er mikilv\u00e6gur \u00fe\u00e1ttur \u00ed daglegu l\u00edfi og hefur
  veri\u00f0 st\u00f3r \u00fe\u00e1ttur \u00ed leiksk\u00f3lastarfinu \u00e1 Ki\u00f0agili.
  \u00c1 S\u00f3ley er \u00feemastarfi\u00f0 \u00e9g sj\u00e1lf/ur og fj\u00f6lskylda
  m\u00edn er \u00fear er komi\u00f0  inn \u00e1 andlegt heilbrig\u00f0i \u00fear
  \u00e1 me\u00f0al sj\u00e1lfsstj\u00f3rn, \u00e1kvar\u00f0anat\u00f6ku og b\u00f6rnin
  fr\u00e6dd um \u00fdmsar fj\u00f6lskylduger\u00f0ir.\\n\\nHva\u00f0 var\u00f0ar
  velfer\u00f0 barna sn\u00fdst h\u00fan ekki eing\u00f6gu um l\u00edkamlegt atgervi
  heldur einnig um sj\u00e1lfsmynd, andlega l\u00ed\u00f0an, \u00f6ryggi , mat \u00e1
  eigin tilfinningum og annarra. Starfsf\u00f3lk \u00fearf a\u00f0 vera me\u00f0vita\u00f0
  um \u00fearfir hvers og eins og uppfylla \u00fe\u00e6r eins vel og h\u00e6gt er.
  Mikilv\u00e6gt er a\u00f0 efla f\u00e9lags\u00feroskann og f\u00e9lagstengslin svo
  og gefa b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 takast \u00e1 vi\u00f0 n\u00fd
  vi\u00f0fangsefni. Fr\u00e6\u00f0sla um mikilv\u00e6gi n\u00e6ringar byggist \u00e1
  \u00fev\u00ed a\u00f0 kynna allar tegundir af mat fyrir b\u00f6rnunum og gefa \u00feeim
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 smakka. Starfsf\u00f3lk \u00fearf a\u00f0 leitast
  vi\u00f0 a\u00f0 minnka h\u00e1va\u00f0a \u00fear sem hann hefur \u00e1hrif \u00e1
  leik og n\u00e1m barnanna.\\n\\nHeilbrig\u00f0i og velfer\u00f0 barna byggist \u00e1
  samskiptum og \u00e1 a\u00f0 einkennast af hl\u00fdju og vir\u00f0ingu en starfsf\u00f3lki
  ber a\u00f0 eiga \u00ed j\u00e1kv\u00e6\u00f0um samskiptum vi\u00f0 b\u00f6rnin
  \u00fev\u00ed \u00fea\u00f0 eflir sj\u00e1lfsmynd \u00feeirra og sj\u00e1lfstrausti\u00f0
  eykst. \u00dea\u00f0 a\u00f0 hvetja b\u00f6rnin kennir \u00feeim a\u00f0 taka \u00e1byrg\u00f0
  \u00e1 eigin sj\u00e1lfi og heg\u00f0un auk \u00feess sem \u00fea\u00f0 veitir \u00feeim
  \u00feroska til a\u00f0 m\u00e6ta \u00f3v\u00e6ntum a\u00f0st\u00e6\u00f0um og tr\u00fa
  \u00e1 eigin getu. \u00deau ver\u00f0a einnig tilb\u00fanari a\u00f0 takast \u00e1
  vi\u00f0 \u00e1greiningsm\u00e1l er upp koma og grei\u00f0a \u00far \u00feeim\\n\\nHeilbrig\u00f0i
  og velfer\u00f0 3-4 \u00e1ra\\n\\nSm\u00e1ri L\u00e6si 4-5 \u00e1ra\\n\\nL\u00e6si
  sn\u00fdst um kerfisbundin t\u00e1kn og mi\u00f0lunart\u00e6kni en \u00fe\u00f3
  fyrst og fremst um merkingarsk\u00f6pun \u00fear sem tv\u00e6r manneskjur e\u00f0a
  fleiri mi\u00f0la og reyna a\u00f0 skilja af reynslu sinni. \u00c1 venjulegu m\u00e1li
  sem allir skilja m\u00e1 segja a\u00f0 um s\u00e9 a\u00f0 r\u00e6\u00f0a mi\u00f0lun
  or\u00f0a og reynslu \u00e1 milli manna. Ekki bara hva\u00f0 manneskjan segir heldur
  l\u00edka hvernig h\u00fan kemur sko\u00f0un sinni \u00e1 framf\u00e6ri og hvernig
  s\u00e1 sem \u00e1 hl\u00fd\u00f0ir skilur skilabo\u00f0in. Hver \u00feekkir ekki
  a\u00f0 tala vi\u00f0 mann og finnast \u00feeir tala \u00ed kross, finna a\u00f0
  \u00fea\u00f0 vantar eitthva\u00f0 upp \u00e1 skilning \u00e1heyrandans. Tungum\u00e1li\u00f0
  er eitt mikilv\u00e6gasta t\u00e6ki mannana til bo\u00f0skipta og hugsunar. \u00dev\u00ed
  ber a\u00f0 leggja \u00e1herslu \u00e1 a\u00f0 n\u00fdta m\u00e1li\u00f0 \u00ed
  v\u00ed\u00f0um skilningi. \u00dea\u00f0 gerum vi\u00f0 me\u00f0 samt\u00f6lum,
  spurningum, lestri, s\u00f6gum, kv\u00e6\u00f0um og \u00feulum. \u00de\u00e1 er
  mikilv\u00e6gt a\u00f0 hvetja b\u00f6rnin til a\u00f0 spyrja, segja fr\u00e1 og
  hlusta me\u00f0 athygli. M\u00e1l\u00f6rvun er best sinnt \u00ed leik barnanna.\\n\\n\u00c1
  Sm\u00e1ra er markvisst unni\u00f0 a\u00f0 l\u00e6si. Starfsf\u00f3lk eflir \u00fe\u00e1
  vinnu me\u00f0 b\u00f6rnunum sem fram fer \u00ed gegnum \u00feemastarf, l\u00e6sis
  stundir og leikinn. \u00c1hersla er l\u00f6g\u00f0 \u00e1 a\u00f0 hlj\u00f3\u00f0a
  stafi, efla hugtakaskilning, r\u00edm, samst\u00f6fun, or\u00f0hlutaey\u00f0ingu
  og hlj\u00f3\u00f0greiningu. Starfsf\u00f3lk leitast vi\u00f0 a\u00f0 hafa verkefnin
  myndr\u00e6n og \u00e1\u00fereifanleg sem au\u00f0veldar b\u00f6rnunum a\u00f0 byggja
  upp sj\u00f3nr\u00e6nt minni.  L\u00f6g\u00f0 er \u00e1hersla \u00e1 a\u00f0 efla
  skilning \u00e1 m\u00e1linu. Starfsf\u00f3lk hvetur b\u00f6rnin til a\u00f0 merkja
  \u00f6ll s\u00edn verk og er forskrift a\u00f0 nafni \u00feeirra a\u00f0gengileg.  Tilgangurinn
  er a\u00f0 veita b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 skrifa fj\u00f6lbreyttan
  texta og a\u00f0 hann hafi tilgang. \u00c1hersla er l\u00f6g\u00f0 \u00e1 a\u00f0
  b\u00f6rnin \u00feekki tengingu hlj\u00f3\u00f0s og stafs og n\u00e1i \u00feannig
  a\u00f0 hlj\u00f3\u00f0a sig \u00ed gegnum or\u00f0. B\u00e6kur eru \u00e6t\u00ed\u00f0
  \u00ed bo\u00f0i sem \u00feau geta l\u00e6rt af, skrifa\u00f0 upp eftir textanum
  og velta fyrir s\u00e9r uppbyggingu \u00feeirra.\\n\\n\u00deegar unni\u00f0 er me\u00f0
  hugt\u00f6k e\u00f0a \u00feemu hverju sinni eru \u00feau hengd upp \u00e1 vegg \u00e1samt
  mynd \u00ed \u00e1kve\u00f0inn t\u00edma til a\u00f0 gefa barninu t\u00e6kif\u00e6ri
  til a\u00f0 velta myndum og or\u00f0um fyrir s\u00e9r \u00feegar \u00e1hugi kviknar.
  L\u00e6si er ekki bara a\u00f0 l\u00e6ra b\u00f3kstafi og lestur heldur er \u00fea\u00f0
  samheiti yfir marga \u00fe\u00e6tti eins og samskipti, t\u00e1kn, menningu, myndm\u00e1l,
  \u00fdmis t\u00e1knkerfi, umhverfi\u00f0 og hlustun. Lagt er upp me\u00f0 \u00fev\u00ed
  a\u00f0 b\u00f6rnin l\u00e6ri a\u00f0 tj\u00e1 sig segja s\u00edna sko\u00f0un og
  \u00edgrunda \u00ed lei\u00f0inni. Starfsf\u00f3lk hvetur b\u00f6rnin til a\u00f0
  n\u00fdta s\u00e9r m\u00e1li\u00f0 \u00ed leik og starfi, spyrja spurninga, segja
  sko\u00f0anir s\u00ednar og r\u00e6\u00f0a um li\u00f0na atbur\u00f0i. Starfsf\u00f3lk
  leggur sig fram vi\u00f0 a\u00f0 eiga \u00ed samr\u00e6\u00f0um vi\u00f0 b\u00f6rnin
  \u00ed vinnustundum \u00fev\u00ed \u00feannig gefur \u00fea\u00f0 \u00feeim t\u00e6kif\u00e6ri
  \u00e1 a\u00f0 \u00edgrunda, spyrja, r\u00f6kr\u00e6\u00f0a, koma fram me\u00f0
  eigin sko\u00f0anir og komast a\u00f0 ni\u00f0urst\u00f6\u00f0um.\\n\\nL\u00e6si
  4-5 \u00e1ra\\n\\n| upplifanir s\u00ednar . | koma or\u00f0unum fr\u00e1 s\u00e9r
  \u00e1 r\u00e9ttan h\u00e1tt |\\n|---|---|\\n| A\u00f0 hafa uppbyggileg og j\u00e1kv\u00e6\u00f0
  samskipti sem \u00fdtir undir sj\u00e1lfsmynd barnanna | Hj\u00e1lpa b\u00f6rnunum
  \u00ed samskiptum vi\u00f0 \u00f6nnur b\u00f6rn, geta sett sig \u00ed spor annarra.
  Mikilv\u00e6gi \u00feess a\u00f0 vera vinur, \u00fe\u00e1 n\u00e6r ma\u00f0ur frekar
