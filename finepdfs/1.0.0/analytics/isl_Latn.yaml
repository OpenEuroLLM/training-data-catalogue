  \u00ed ath\u00f6fninni. |\\n\\nHeilbrig\u00f0i og velfer\u00f0 4-5 \u00e1ra\\n\\n\u00deegar
  r\u00e6tt er um heilbrig\u00f0i er v\u00edsa\u00f0 til andlegrar, l\u00edkamlegrar
  og f\u00e9lagslegrar vell\u00ed\u00f0anar f\u00f3lks.  Allt sk\u00f3lastarf \u00e1
  a\u00f0 mi\u00f0a a\u00f0 \u00fev\u00ed a\u00f0 efla heilbrig\u00f0i og stu\u00f0la
  markvisst a\u00f0 vell\u00ed\u00f0an barnanna me\u00f0 tilliti til sj\u00e1lfsmyndar,
  hreyfingar, n\u00e6ringar, hv\u00edldar, andlegrar vell\u00ed\u00f0anar, g\u00f3\u00f0ra
  samskipta, \u00f6ryggis, hreinl\u00e6tis, kynheilbrig\u00f0is og skilnings \u00e1
  eigin tilfinningum og annarra.\\n\\n\u00c1 Ki\u00f0agili er l\u00f6g\u00f0 \u00e1hersla
  \u00e1 hreyfingu barna og hreyfiuppeldi. B\u00f6rnin fara \u00ed leikfimish\u00fas
  \u00e1 h\u00e1lfsm\u00e1na\u00f0ar fresti sem er utan vi\u00f0 \u00fe\u00e1 hreyfingu
  sem \u00feau i\u00f0ka \u00ed sal sk\u00f3lans. B\u00f6rn tj\u00e1 sig snemma me\u00f0
  hreyfingu, \u00feau skynja l\u00edkama sinn og finna styrk sinn og getu.  G\u00f3\u00f0
  hreyfif\u00e6rni eykur sj\u00e1lfstraust \u00e1samt \u00fev\u00ed a\u00f0 b\u00e6ta  heilsu,
  snerpu og \u00feol. L\u00edkamlegri \u00e1reynslu fylgir hv\u00edld og \u00fear
  skynjar barni\u00f0 mun \u00e1 spennu og sl\u00f6kun. \u00dativera og hreyfing er
  mikilv\u00e6gur \u00fe\u00e1ttur \u00ed daglegu l\u00edfi og hefur veri\u00f0 st\u00f3r
  \u00fe\u00e1ttur \u00ed leiksk\u00f3lastarfinu h\u00e9r \u00e1 Ki\u00f0agili. Hva\u00f0
  var\u00f0ar velfer\u00f0 barna sn\u00fdst h\u00fan ekki eing\u00f6gu um l\u00edkamlegt
  atgervi heldur einnig um sj\u00e1lfsmynd, andlega l\u00ed\u00f0an, \u00f6ryggi ,
  mat \u00e1 eigin tilfinningum og annarra. Starfsmenn \u00feurfa a\u00f0 vera me\u00f0vita\u00f0ir
  um \u00fearfir hvers og eins og uppfylla \u00fe\u00e6r eins vel og h\u00e6gt er.
  Mikilv\u00e6gt er a\u00f0 efla f\u00e9lags\u00feroskan og f\u00e9lagstengslin svo
  og gefa b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 takast \u00e1 vi\u00f0 n\u00fd
  vi\u00f0fangsefni. Fr\u00e6\u00f0sla um mikilv\u00e6gi n\u00e6ringar byggist \u00e1
  \u00fev\u00ed a\u00f0 kynna alla f\u00e6\u00f0uflokkafyrir b\u00f6rnunum og gefa
  \u00feeim t\u00e6kif\u00e6ri \u00e1 a\u00f0 smakka. Kennarar \u00feurfa a\u00f0
  leitast vi\u00f0 minnka h\u00e1va\u00f0a \u00fear sem hann hefur \u00e1hrif \u00e1
  leik og n\u00e1m barnanna\\n\\nHeilbrig\u00f0i og velfer\u00f0 barna byggist \u00e1
  samskiptum og \u00e1 a\u00f0 einkennast af hl\u00fdju og vir\u00f0ingu en kennurum
  ber a\u00f0 eiga \u00ed j\u00e1kv\u00e6\u00f0um samskiptum vi\u00f0 b\u00f6rnin
  \u00fev\u00ed \u00fea\u00f0 eflir sj\u00e1lfsmynd \u00feeirra og sj\u00e1lfstrausti\u00f0
  eykst. \u00dea\u00f0 a\u00f0 hvetja b\u00f6rnin kennir \u00feeim a\u00f0 taka \u00e1byrg\u00f0
  \u00e1 eigin getu og heg\u00f0un auk \u00feess sem \u00fea\u00f0 veitir \u00feeim
  \u00feroska til a\u00f0 m\u00e6ta \u00f3v\u00e6ntum a\u00f0st\u00e6\u00f0um og tr\u00fa
  \u00e1 eigin getu. \u00deau ver\u00f0a einnig tilb\u00fanari til a\u00f0 takast
  \u00e1 vi\u00f0 \u00e1greiningsm\u00e1l er upp koma og grei\u00f0a \u00far \u00feeim.\\n\\nHeilbrig\u00f0i
  og velfer\u00f0 4-5 \u00e1ra\\n\\nL\u00e6si 5-6 \u00e1ra\\n\\nL\u00e6si sn\u00fdst
  um kerfisbundin t\u00e1kn og mi\u00f0lunart\u00e6kni en \u00fe\u00f3 fyrst og fremst
  um merkingarsk\u00f6pun \u00fear sem tv\u00e6r manneskjur e\u00f0a fleiri mi\u00f0la
  og reyna a\u00f0 skilja af reynslu sinni. \u00c1 venjulegu m\u00e1li sem allir skilja
  m\u00e1 segja a\u00f0 um s\u00e9 a\u00f0 r\u00e6\u00f0a mi\u00f0lun or\u00f0a og
  reynslu \u00e1 milli manna. Ekki bara hva\u00f0 manneskjan segir heldur l\u00edka
  hvernig h\u00fan kemur sko\u00f0un sinni \u00e1 framf\u00e6ri og hvernig s\u00e1
  sem \u00e1 hl\u00fd\u00f0ir skilur skilabo\u00f0in. Hver \u00feekkir ekki a\u00f0
  tala vi\u00f0 mann og finnast \u00feeir tala \u00ed kross, finna a\u00f0 \u00fea\u00f0
  vantar eitthva\u00f0 upp \u00e1 skilning \u00e1heyrandans og s\u00e1 skortur hefur
  ekkert me\u00f0 greind a\u00f0 gera. Tungum\u00e1li\u00f0 er eitt mikilv\u00e6gasta
  t\u00e6ki mannana til bo\u00f0skipta og hugsunar. \u00dev\u00ed ber a\u00f0 leggja
  \u00e1herslu \u00e1 a\u00f0 n\u00fdta m\u00e1li\u00f0 \u00ed v\u00ed\u00f0um skilningi.
  \u00dea\u00f0 gerum vi\u00f0 me\u00f0 samt\u00f6lum, spurningum, lestri, s\u00f6gum,
  kv\u00e6\u00f0um og \u00feulum. \u00de\u00e1 er mikilv\u00e6gt a\u00f0 hvetja b\u00f6rnin
  til a\u00f0 spyrja, segja fr\u00e1 og hlusta me\u00f0 athygli. M\u00e1l\u00f6rvun
  er best sinnt \u00ed leik barnanna.\\n\\nMe\u00f0 5-6 \u00e1ra nemendum  er markvisst
  unni\u00f0 a\u00f0 l\u00e6si. S\u00fa vinna fer fram \u00ed gegnum \u00feemastarf,
  samverustundir, l\u00e6sis stundir og leikinn. \u00c1hersla er l\u00f6g\u00f0 \u00e1
  a\u00f0 hlj\u00f3\u00f0a stafi, efla hugtakaskilning, r\u00edm, samst\u00f6fun,
  or\u00f0hlutaey\u00f0ingu og hlj\u00f3\u00f0greiningu. \u00de\u00e1 er leitast vi\u00f0  a\u00f0
  hafa verkefnin myndr\u00e6n og \u00e1\u00fereifanleg sem au\u00f0veldar \u00feeim
  a\u00f0 byggja upp sj\u00f3nr\u00e6nt minni.  L\u00f6g\u00f0 er \u00e1hersla \u00e1
  a\u00f0 efla skilning \u00e1 m\u00e1linu. \u00de\u00e1 eru b\u00f6rnin hv\u00f6tt
  til a\u00f0 merkja \u00f6ll s\u00edn verk og er forskrift a\u00f0 nafni \u00feeirra  a\u00f0gengilegt.  Tilgangurinn
  er a\u00f0 veita b\u00f6rnunum t\u00e6kif\u00e6ri \u00e1 a\u00f0 skrifa fj\u00f6lbreyttan
  texta og a\u00f0 hann hafi tilgang. \u00de\u00e1 er \u00e1hersla l\u00f6g\u00f0
  \u00e1 a\u00f0 b\u00f6rnin \u00feekki tengingu hlj\u00f3\u00f0s og stafs og n\u00e1i
  \u00feannig a\u00f0 hlj\u00f3\u00f0a sig \u00ed gegnum or\u00f0. L\u00f6g\u00f0
  er \u00e1hersla \u00e1 a\u00f0 hafa b\u00e6kur \u00e6t\u00ed\u00f0 \u00ed bo\u00f0i
  sem \u00feau geta l\u00e6rt af, skrifa\u00f0 upp eftir textanum og velta fyrir s\u00e9r
  uppbyggingu \u00feeirra.\\n\\n\u00deau hugt\u00f6k e\u00f0a \u00feemu sem veri\u00f0
  er a\u00f0 vinna me\u00f0 hverju sinni eru h\u00f6f\u00f0 upp \u00e1 vegg \u00e1samt
  mynd \u00ed \u00e1kve\u00f0inn t\u00edma og gefur \u00fea\u00f0 barninu t\u00e6kif\u00e6ri
  til a\u00f0 velta myndum og or\u00f0um fyrir s\u00e9r \u00feegar \u00e1hugi kviknar.
  Lagt er upp me\u00f0 a\u00f0 b\u00f6rnin l\u00e6ri a\u00f0 tj\u00e1 sig segja s\u00edna
  sko\u00f0un og \u00edgrunda \u00ed lei\u00f0inni. Mikilv\u00e6gt er a\u00f0 kennarar
  leggi sig fram vi\u00f0 a\u00f0 eiga \u00ed samr\u00e6\u00f0um vi\u00f0 b\u00f6rnin
  \u00ed vinnustundum \u00fev\u00ed \u00feannig gefur \u00fea\u00f0 \u00feeim t\u00e6kif\u00e6ri
  \u00e1 a\u00f0 \u00edgrunda, spyrja, r\u00f6kr\u00e6\u00f0a, koma fram me\u00f0
  eigin sko\u00f0anir og komast a\u00f0 ni\u00f0urst\u00f6\u00f0um.\\n\\nL\u00e6si
  5-6 \u00e1ra\\n\\n| Markmi\u00f0 | Lei\u00f0ir |\\n|---|---|\\n| A\u00f0 hafa lestarhvetjandi
  umhverfi | Hafa allt merkt \u00feegar b\u00f6rnin byrja \u00ed sk\u00f3lanum |\\n|
  A\u00f0 kynna fyrir b\u00f6rnunum \u00fdmsan fr\u00f3\u00f0leikur \u00far b\u00f3kum,
  s\u00f6gustund. | A\u00f0 lesa markvisst fyrir b\u00f6rnin og leyfa \u00feeim a\u00f0
  hafa a\u00f0gegni a\u00f0 b\u00f3kum |\\n| A\u00f0 kenna b\u00f6rnunum heiti forma,
  st\u00e6r\u00f0 og l\u00f6gun | Hafa s\u00fdnilegt allskonar form sem b\u00f6rnin
  geta leiki\u00f0 s\u00e9r me\u00f0 og spurt hva\u00f0 heitir |\\n| A\u00f0 leggja
  \u00e1herslu \u00e1 og efla hugtakaskilning me\u00f0 \u00fev\u00ed a\u00f0 gera
  \u00fdmis verkefni myndr\u00e6n og \u00e1\u00fereifanleg. | A\u00f0 tala vi\u00f0
  b\u00f6rnin og kenna \u00feeim hva\u00f0a merkingu hugt\u00f6kin hafa. Gera \u00feau
  \u00e1\u00fereifanleg e\u00f0a myndr\u00e6n. |\\n| A\u00f0 hafa or\u00f0 og b\u00f3kstafir
  s\u00fdnilegt um alla | Setja b\u00f3kstafi \u00feeirra \u00e1 st\u00f3lana, g\u00f3lfi\u00f0
  lofti\u00f0 |\\n\\nSj\u00e1lfb\u00e6rni 5-6 \u00e1ra\\n\\nMe\u00f0 sj\u00e1lfb\u00e6rni
  er \u00e1tt vi\u00f0 a\u00f0 engin ein kynsl\u00f3\u00f0 hefur r\u00e9tt umfram
  a\u00f0ra til \u00feess a\u00f0 r\u00fdra arflei\u00f0 s\u00edna til n\u00e6stu
  kynsl\u00f3\u00f0ar. Lagt er til grundvallar a\u00f0 hver kynsl\u00f3\u00f0 skili
  \u00feeirri n\u00e6stu umhverfi s\u00ednu og n\u00e1tt\u00faru, \u00ed ekki lakara
  \u00e1sigkomulagi en h\u00fan t\u00f3k vi\u00f0 henni.  Hugtaki\u00f0 er gildishla\u00f0i\u00f0
  og  felur \u00ed s\u00e9r sam\u00e1byrg\u00f0 manna, jafnv\u00e6gi \u00ed n\u00e1tt\u00farunni,
  efnahagslegt jafnv\u00e6gi, jafnv\u00e6gi  \u00ed samf\u00e9laginu og l\u00fd\u00f0r\u00e6\u00f0i.
  \u00dea\u00f0 felur einnig \u00ed s\u00e9r n\u00e1m sem eykur m.a. f\u00e6rni barna
  til \u00feess a\u00f0 takast \u00e1 vi\u00f0 margv\u00edsleg \u00e1litam\u00e1l
  og \u00e1greiningsm\u00e1l sem stu\u00f0lar a\u00f0 vilja \u00feeirra og \u00e1huga
  til \u00feess a\u00f0 taka \u00fe\u00e1tt \u00ed samf\u00e9laginu. \u00c1 Ki\u00f0agili
  er l\u00f6g\u00f0 \u00e1hersla \u00e1 a\u00f0 auka vir\u00f0ingu og \u00feekkingu
  barna \u00e1 n\u00e1tt\u00farunni.\\n\\n\u00deekking \u00e1 n\u00e1tt\u00farunni
  og fyrirb\u00e6rum hennar er manninum l\u00edfsnau\u00f0synlegt \u00fear sem afkoma
  hans er undir henni komin. B\u00f6rn \u00feurfa a\u00f0 kynnast fj\u00f6lbreytileika
  n\u00e1tt\u00farunnar og nj\u00f3ta hennar um lei\u00f0 og \u00fea\u00f0 l\u00e6rir
  a\u00f0 finna til \u00e1byrg\u00f0ar gagnvart henni. B\u00f6rnin eru fr\u00e6dd
  um n\u00e1tt\u00faruna, umhverfi\u00f0 og verndun \u00feess.  \u00deess ver\u00f0ur
  best vi\u00f0 komi\u00f0 me\u00f0 fer\u00f0um \u00fat \u00ed n\u00e1tt\u00faruna
  \u00fear sem b\u00f6rnin gera s\u00edna eigin athuganir og vinna \u00far \u00feeim
  eftir getu. Einfaldar e\u00f0lis og efnafr\u00e6\u00f0i tilraunir vekja \u00e1huga
  og \u00e1n\u00e6gju barnanna.\\n\\nAllir erusetja l\u00edfr\u00e6na afganga \u00ed
  s\u00e9rstakt \u00edl\u00e1t og fara afgangar s\u00ed\u00f0an \u00ed moltutunnur.
  B\u00f6rnin eru einnig me\u00f0 eigin vatnsbr\u00fasa sem er a\u00f0gengilegur fyrir
  \u00feeim.  Flokkun efna eins og papp\u00edr og plast er komi\u00f0 fyrir \u00ed
  s\u00e9rst\u00f6kum tunnum og k\u00f6ssum og eru b\u00f6rnin l\u00e1tin gera \u00fea\u00f0
  reglulega. Hver deild s\u00e9r um a\u00f0 fr\u00e6\u00f0a b\u00f6rnin og \u00ed
  \u00feeirri vinnu er liti\u00f0 til umhverfiss\u00e1ttm\u00e1lans og er hann fl\u00e9tta\u00f0ur
  inn \u00ed starf sk\u00f3lans. S\u00e9rstakar umhverfisvikur er \u00e1 dagatali
  sk\u00f3lans eins og t.d. endurvinnsluvika, steinavika, fuglavika, berjavika og
  bl\u00f3mavika en \u00fe\u00e6r vikur eru nota\u00f0ar s\u00e9rstaklega til a\u00f0
  t\u00edna rusl, fara \u00ed vettvangsfer\u00f0ir, sko\u00f0a bl\u00f3min og skord\u00fdrin,
  gr\u00f3\u00f0ursetja bl\u00f3m og \u00fdmiskonar jurtir og t\u00edna ber.\\n\\nHver
  deild er me\u00f0 \u00e1kve\u00f0i\u00f0 verkefni inn \u00e1 sinni deild sem er
  \u00ed tengslum vi\u00f0 umhverfisfr\u00e6\u00f0slu. \u00cd verkefnager\u00f0 er
  reynt a\u00f0 n\u00fdta \u00feann efnivi\u00f0 sem til er \u00ed leiksk\u00f3lanum
  sem er endurn\u00fdtanlegur.\\n\\nSj\u00e1lb\u00e6rni 5-6 \u00e1ra\\n\\nA\u00f0
  fara \u00ed vettvangsfer\u00f0ir, einnig a\u00f0 gr\u00f3\u00f0ursetja og fara \u00ed  umhverfishreinsun\\n\\nMarkviss
  grendarkennsla \u00ed umhverfinu\\n\\nA\u00f0 kveikja forvitni barna, spyrja opinna
  spurninga og leita lausna kenna b\u00f6rnunum a\u00f0 bera vir\u00f0ingu fyrir umhverfi
  s\u00ednu og n\u00e1tt\u00faru, upplifa og nj\u00f3ta\\n\\nN\u00fdta hugmyndaflug
  og skynjun barnanna til umr\u00e6\u00f0na. N\u00fdta samf\u00e9lagi\u00f0 ranns\u00f3knir,
  fj\u00f6lbreyttar a\u00f0fer\u00f0ir til a\u00f0 sko\u00f0a, skynja, hlusta, snerta,
  flokka, bera saman og draga \u00e1lyktanir\\n\\nJafnr\u00e9tti 5-6 \u00e1ra\\n\\nJafnr\u00e9tti:
  Jafnr\u00e9tti er regnhl\u00edfarhugtak og n\u00e6r til \u00fdmissa \u00fe\u00e1tta
  s.s; aldurs, b\u00fasetu, f\u00f6tlunar, kyns, kynhneig\u00f0ar, litarh\u00e1ttar,  l\u00edfssko\u00f0ana,
  menningar, st\u00e9ttar, tr\u00faarbrag\u00f0a, tungum\u00e1la, \u00e6tterna og
  \u00fej\u00f3\u00f0erna.  \u00c1 \u00f6llum sk\u00f3lastigum \u00e1 a\u00f0 fara
  fram menntun til jafnr\u00e9ttis \u00fear sem fjalla\u00f0 er um hvernig fyrrtaldir
  \u00fe\u00e6ttir geta valdi\u00f0 mismunun e\u00f0a forr\u00e9ttindum \u00ed l\u00edfi
  f\u00f3lks.\\n\\n\u00cd starfi \u00e1 Engjar\u00f3s er l\u00f6g\u00f0 \u00e1hersla
  \u00e1 a\u00f0 kyngerva ekki leik og f\u00e1 b\u00f6rnin t\u00e6kif\u00e6ri til
  a\u00f0 sko\u00f0a umhverfi sitt  \u00ed leik \u00e1n \u00feess a\u00f0 \u00fea\u00f0
  skipti m\u00e1li hvort kyni\u00f0 \u00fea\u00f0 er. \u00dea\u00f0 hefur s\u00fdnt
  sig a\u00f0 kennarar nafngreina str\u00e1ka frekar en stelpur sem h\u00f3p \u00ed
  starfi. \u00dev\u00ed er gott a\u00f0 vera me\u00f0vita\u00f0ur hvernig kynin eru
  \u00e1v\u00f6rpu\u00f0.  Starfsf\u00f3lk er me\u00f0vita\u00f0 um a\u00f0 bera vir\u00f0ingu
  fyrir \u00f6llum b\u00f6rnum og foreldrum \u00feeirra.\\n\\n\u00d6llum er s\u00fdnt
  sama vi\u00f0horf og vir\u00f0ing sama hva\u00f0a bakgrunn \u00feau hafa.  B\u00f6rn
  \u00feurfa \u00e1 \u00fev\u00ed a\u00f0 halda a\u00f0 hlusta\u00f0 s\u00e9 \u00e1
  \u00feau og vir\u00f0ing borin fyrir sko\u00f0unum \u00feeirra. \u00deegar jafnr\u00e9tti
  er sko\u00f0a\u00f0 \u00fearf a\u00f0 \u00fdta undir gagnr\u00fdna hugsun \u00feeirra.
  Leyfa \u00feeim a\u00f0 sko\u00f0a hlutina \u00fat fr\u00e1 sj\u00e1lfum s\u00e9r
  og hvernig \u00feau upplifa jafnr\u00e9tti. Kennarar eru mikilv\u00e6gur \u00fe\u00e1ttur
  \u00ed \u00feessu starfi \u00fev\u00ed \u00feau geta hj\u00e1lpa\u00f0 b\u00f6rnunum
  a\u00f0 finna hvernig \u00f3r\u00e9ttl\u00e6ti er og hvernig s\u00e9 h\u00e6gt a\u00f0
  b\u00e6ta \u00fea\u00f0. Kennarar eiga a\u00f0 hvetja b\u00f6rnin til gagnr\u00fdnnar
  hugsunar um jafnr\u00e9tti auk \u00feess a\u00f0 fr\u00e6\u00f0a \u00feau um margbreytileika
  heimsins.  Starsf\u00f3lk \u00e1 a\u00f0 vera me\u00f0vita\u00f0 um a\u00f0 fl\u00e9tta
  almennt jafnr\u00e9tti inn \u00ed allt sk\u00f3lastarf me\u00f0 b\u00f6rnunum.  Umr\u00e6\u00f0ur
  og n\u00e1msefni myndu auka enn frekar \u00e1 skilning barnanna um margbreytileika.\\n\\n\u00de\u00e1
  er mikilv\u00e6gt a\u00f0 n\u00fdta t\u00edmann til \u00feess  \u00ed samverustundum
  og \u00feemastarfi og me\u00f0 auknum n\u00e1msg\u00f6gnum um efni\u00f0.  Starfsf\u00f3lk
  er uppl\u00fdst um a\u00f0 jafnr\u00e9tti stu\u00f0lar a\u00f0 b\u00e6ttu vinnuumhverfi
  og sk\u00f3laanda. Kennara eru ford\u00e6mi barnanna og \u00fev\u00ed \u00fearf
  g\u00e6ta \u00feess a\u00f0 vir\u00f0ing s\u00e9 til sta\u00f0ar \u00feeirra milli.
  Til a\u00f0 stu\u00f0la a\u00f0 jafnr\u00e9tti \u00ed umr\u00e6\u00f0unni v\u00e6ri
  h\u00e6gt a\u00f0 setja saman teymi innan starfsmannah\u00f3psins sem myndi sko\u00f0a
  hvernig jafnr\u00e9tti birtist \u00ed starfi og hva\u00f0 m\u00e6tti betur fara.\\n\\nJafnr\u00e9tti
  5-6 \u00e1ra\\n\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi 5-6 \u00e1ra\\n\\nL\u00fd\u00f0r\u00e6\u00f0i
  og mannr\u00e9ttindi: \u00dea\u00f0 er mikilv\u00e6gt a\u00f0 sk\u00f3lakerfi\u00f0
  kenni b\u00f6rnunum dj\u00fapst\u00e6\u00f0a vir\u00f0ingu fyrir manngildi hvers
  og eins, um lei\u00f0 og \u00feau l\u00e6ra hvernig l\u00fd\u00f0r\u00e6\u00f0ssamf\u00e9l\u00f6g
  virka. Umhyggja fyrir d\u00fdrum og n\u00e1tt\u00faru er einnig hluti l\u00fd\u00f0r\u00e6\u00f0ismenntunar
  og \u00e1 heima \u00ed \u00f6llum n\u00e1msgreinum.  L\u00fd\u00f0r\u00e6\u00f0is-
  og mannr\u00e9ttindamenntun felur einnig \u00ed s\u00e9r h\u00e6fnina til a\u00f0
  gagnr\u00fdna og endurmeta grunngildi samf\u00e9lagsins. \u00deetta \u00fearf a\u00f0
  gerast \u00ed samstarfi \u00e1 milli sk\u00f3lanna og heimilisins sem og hinna \u00fdmsu
  stofnana samf\u00e9lagsins.\\n\\n\u00cd starfi \u00e1 Ki\u00f0agli er leitast vi\u00f0
  a\u00f0 sk\u00f3lastarf m\u00f3tist af \u00fev\u00ed umhverfi sem vi\u00f0 b\u00faum
  vi\u00f0 eins og atvinnu- f\u00e9lags og menningarlegu. Sk\u00f3linn tekur tillit
  til mismunandi fj\u00f6lskylduger\u00f0ar og uppruna barnanna  og leitast vi\u00f0
  a\u00f0 efla tilfinningu \u00feeirra fyrir \u00fev\u00ed a\u00f0 \u00feau tilheyri
  samf\u00e9laginu og s\u00e9u hluti af \u00fev\u00ed. Af \u00fev\u00ed m\u00e1 stu\u00f0la
  a\u00f0 g\u00f3\u00f0um samskiptum utan sk\u00f3lans og n\u00fdtingu umhvefis  til
  vettvangsfer\u00f0a og leikja. Kennarar eiga a\u00f0 bera vir\u00f0ingu fyrir \u00f6llum
  og takast \u00e1 vi\u00f0 eigin ford\u00f3ma svo \u00feeir stu\u00f0li ekki a\u00f0
  mismunum \u00e1 milli einstaklinga.\\n\\nMikilv\u00e6gt er a\u00f0 \u00fdta undir
  frumkv\u00e6\u00f0i og \u00edmyndunnar afl barnanna sem hvetur \u00feau til a\u00f0
  taka eigin \u00e1kvar\u00f0anir og frumkv\u00e6\u00f0i. Skapa \u00fearf a\u00f0st\u00e6\u00f0ur
  sem gerir \u00fea\u00f0 a\u00f0 verkum a\u00f0 b\u00f6rnunum l\u00ed\u00f0ur vel
  og finni til \u00f6ryggis. Mikilv\u00e6gt er \u00ed l\u00fd\u00f0r\u00e6\u00f0is\u00fej\u00f3\u00f0f\u00e9lagi
  a\u00f0 s\u00edna vir\u00f0ingu og k\u00e6rleika svo a\u00f0 allir f\u00e1i noti\u00f0
  s\u00edn \u00ed leik og starfi. \u00dea\u00f0 er gert me\u00f0 \u00fev\u00ed a\u00f0
  vera me\u00f0vita\u00f0ur um a\u00f0 vi\u00f0 erum ekki eins og hver og einn \u00fearf
  t\u00e6kif\u00e6ri \u00e1 a\u00f0 nj\u00f3ta s\u00edn \u00e1 eigin forsendum. Kennurum
  bera a\u00f0 kenna b\u00f6rnum skapandi hugsun og gefi \u00feeim t\u00e6kif\u00e6ri
  til \u00feess a\u00f0 tj\u00e1 sig \u00ed or\u00f0i og myndum.  \u00dea\u00f0 \u00fdtir
  undir sj\u00e1lfstraust \u00feeirra og eflir getu \u00feeirra til a\u00f0 taka \u00e1kvar\u00f0anir
  um eigin getu.\\n\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi 5-6 \u00e1ra\\n\\n|
  A\u00f0 kenna \u00feeim a\u00f0 bera vir\u00f0ingu fyrir n\u00e1tt\u00faru og umhverfi.
  L\u00f6gum samf\u00e9lagsins. | Fara \u00ed vettvansfer\u00f0ir. Auk \u00feess sem
