  l\u00f6g\u00f0 voru fram a\u00f0 ekki hef\u00f0i veri\u00f0 s\u00fdnt fram \u00e1
  orsakatengsl milli neyslu \u00e1 sykurr\u00f3futrefjum og fullyrtu \u00e1hrifanna.
  \u00dear e\u00f0 fullyr\u00f0ingin uppfyllir ekki kr\u00f6furnar \u00ed regluger\u00f0
  (EB) nr. 1924/2006 \u00e6tti ekki a\u00f0 leyfa hana.\\n22) Heilsufullyr\u00f0ingin
  sem var\u00f0ar \u00e1hrif spermad\u00edns og framlengingar vaxtarskei\u00f0sins
  (vaxtarfasans) \u00ed hringferli h\u00e1rsins er heilsufullyr\u00f0ing sem eignar
  matv\u00e6lunum, sem falla undir fullyr\u00f0inguna, l\u00e6kningaeiginleika og
  er \u00fev\u00ed b\u00f6nnu\u00f0 \u00ed tengslum vi\u00f0 matv\u00e6li.\\n23) Heilsufullyr\u00f0ingarnar
  sem var\u00f0a \u201enasl sem inniheldur f\u00e1ar hitaeiningar (KOT-v\u00f6rur)\\\"
  og d\u00edas\u00fdlgl\u00fdser\u00f3lol\u00edu (DAGol\u00edu) eru heilsufullyr\u00f0ingar
  eins og \u00fe\u00e6r sem um getur \u00ed c-li\u00f0 1. mgr. 13. gr. regluger\u00f0ar
  (EB) nr. 1924/2006 sem falla undir umbreytingart\u00edmabili\u00f0 sem m\u00e6lt
  er fyrir um \u00ed 6. mgr. 28. gr. \u00feeirrar regluger\u00f0ar. \u00dear e\u00f0
  ums\u00f3knirnar voru ekki lag\u00f0ar fram fyrir 19. jan\u00faar 2008 er krafan,
  sem kve\u00f0i\u00f0 er \u00e1 um \u00ed b-li\u00f0 6. mgr. 28. gr. \u00feeirrar
  regluger\u00f0ar, ekki uppfyllt og umbreytingart\u00edmabili\u00f0, sem kve\u00f0i\u00f0
  er \u00e1 um \u00ed \u00feeirri grein, \u00e1 \u00fev\u00ed ekki vi\u00f0 um \u00feessar
  fullyr\u00f0ingar.\\n24) A\u00f0rar heilsufullyr\u00f0ingarnar, sem falla undir
  \u00feessa regluger\u00f0, eru heilsufullyr\u00f0ingar eins og um getur \u00ed a-li\u00f0
  1. mgr. 13. gr. regluger\u00f0ar (EB) nr. 1924/2006, sem falla undir umbreytingart\u00edmabili\u00f0
  sem m\u00e6lt er fyrir um \u00ed 5. mgr. 28. gr. \u00feeirrar regluger\u00f0ar \u00fear
  til listinn yfir leyfilegar heilsufullyr\u00f0ingar er sam\u00feykktur, a\u00f0
  \u00fev\u00ed tilskildu a\u00f0 \u00fe\u00e6r s\u00e9u \u00ed samr\u00e6mi vi\u00f0
  regluger\u00f0ina.\\ne\u00f0a framkv\u00e6mdastj\u00f3rnin ekki teki\u00f0 afst\u00f6\u00f0u
  til fyrir 14. desember 2012 og eru samkv\u00e6mt \u00feessari regluger\u00f0 ekki
  \u00e1 listanum yfir leyfilegar heilsufullyr\u00f0ingar, \u00feykir r\u00e9tt a\u00f0
  kve\u00f0a \u00e1 um umbreytingart\u00edmabil \u00fear sem heimilt er a\u00f0 nota
  \u00fe\u00e6r, til a\u00f0 gera b\u00e6\u00f0i stj\u00f3rnendum matv\u00e6lafyrirt\u00e6kja
  og l\u00f6gb\u00e6rum landsyfirv\u00f6ldum kleift a\u00f0 a\u00f0lagast banninu
  vi\u00f0 fullyr\u00f0ingunum.\\n26) Teki\u00f0 hefur veri\u00f0 tillit til athugasemda
  fr\u00e1 ums\u00e6kjendum og almenningi sem framkv\u00e6mdastj\u00f3rninni hafa
  borist, skv. 6. mgr. 16. gr. regluger\u00f0ar (EB) nr. 1924/2006, vi\u00f0 \u00e1kv\u00f6r\u00f0un
  \u00feeirra r\u00e1\u00f0stafana sem kve\u00f0i\u00f0 er \u00e1 um \u00ed \u00feessari
  regluger\u00f0.\\n27) R\u00e1\u00f0stafanirnar, sem kve\u00f0i\u00f0 er \u00e1 um
  \u00ed \u00feessari regluger\u00f0, eru \u00ed samr\u00e6mi vi\u00f0 \u00e1lit fastanefndarinnar
  um matv\u00e6laferli\u00f0 og heilbrig\u00f0i d\u00fdra og hvorki Evr\u00f3pu\u00feingi\u00f0
  n\u00e9 r\u00e1\u00f0i\u00f0 hefur andm\u00e6lt \u00feeim.\\n\\nSAM\u00deYKKT REGLUGER\u00d0
  \u00deESSA:\\n\\n1. gr.\\n\\n1. Heilsufullyr\u00f0ingarnar, sem settar eru fram
  \u00ed vi\u00f0aukanum vi\u00f0 \u00feessa regluger\u00f0, skal ekki f\u00e6ra \u00e1
  lista Sambandsins yfir leyf\u00f0ar fullyr\u00f0ingar sem kve\u00f0i\u00f0 er \u00e1
  um \u00ed 3. mgr. 13. gr. regluger\u00f0ar (EB) nr. 1924/2006.\\n25) Listanum yfir
  leyfilegar heilsufullyr\u00f0ingar var komi\u00f0 \u00e1 me\u00f0 regluger\u00f0
  framkv\u00e6mdastj\u00f3rnarinnar (ESB) nr. 432/2012( 11 ) og hefur veri\u00f0 \u00ed
  gildi s\u00ed\u00f0an 14. desember 2012. A\u00f0 \u00fev\u00ed er var\u00f0ar fullyr\u00f0ingar
  sem um getur \u00ed 5. mgr. 13. gr. regluger\u00f0ar (EB) nr. 1924/2006, sem Matv\u00e6la\u00f6ryggisstofnunin
  hefur ekki loki\u00f0 vi\u00f0 a\u00f0 meta\\n2. \u00de\u00f3 m\u00e1 halda \u00e1fram
  a\u00f0 nota heilsufullyr\u00f0ingar, sem um getur \u00ed 1. mgr. og hafa veri\u00f0
  nota\u00f0ar fyrir gildist\u00f6ku \u00feessarar regluger\u00f0ar, a\u00f0 h\u00e1marki
  \u00ed sex m\u00e1nu\u00f0i fr\u00e1 gildist\u00f6ku \u00feessarar regluger\u00f0ar.\\n\\n2.
  gr.\\n\\nRegluger\u00f0 \u00feessi \u00f6\u00f0last gildi \u00e1 tuttugasta degi
  eftir a\u00f0 h\u00fan birtist \u00ed Stj\u00f3rnart\u00ed\u00f0indum Evr\u00f3pusambandsins.\\n\\nRegluger\u00f0
  \u00feessi er bindandi \u00ed heild sinni og gildir \u00ed \u00f6llum a\u00f0ildarr\u00edkjunum
  \u00e1n frekari l\u00f6gfestingar.\\n\\nGj\u00f6rt \u00ed Brussel 23. okt\u00f3ber
  2013.\\n\\nFyrir h\u00f6nd framkv\u00e6mdastj\u00f3rnarinnar, forseti .\\n\\nJos\u00e9
