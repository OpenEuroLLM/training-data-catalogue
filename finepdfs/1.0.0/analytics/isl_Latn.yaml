  hvers kafla og tekur fyrir \u00e1kve\u00f0na \u00fe\u00e6tti jafn\u00f3\u00f0um
  og \u00feeir koma upp. N\u00e1mi\u00f0 er a\u00f0laga\u00f0 a\u00f0 \u00fe\u00f6rfum
  hvers og eins me\u00f0 mismunandi fj\u00f6lda d\u00e6ma, \u00edtreku\u00f0um \u00e6fingum
  og aukinni a\u00f0sto\u00f0 vi\u00f0 \u00fe\u00e1 sem \u00feess \u00feurfa.\\n\\nNemendur
  eru hvattir til a\u00f0 a\u00f0sto\u00f0a hver annan og r\u00e6\u00f0a saman um
  lausnir og a\u00f0fer\u00f0ir \u00ed kennslustundum.\\n\\n\u00deeir nemendur sem
  fylgja ekki ofangreindri n\u00e1m\u00e1\u00e6tlun lj\u00faka vi\u00f0 \u00fea\u00f0
  sem upp \u00e1 vantar heima. A\u00f0rir f\u00e1 vi\u00f0b\u00f3tarefni eftir \u00fe\u00f6rfum.\\n\\nN\u00e1msg\u00f6gn\\n\\nStika
