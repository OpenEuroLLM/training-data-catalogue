  \u00ed einum kennslut\u00edma: Valborg Halld\u00f3ra Gestsd\u00f3ttir\\n\\nSex t\u00edmar
  \u00ed st\u00e6r\u00f0fr\u00e6\u00f0i \u00e1 viku samkenndir me\u00f0 5. bekk\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nKennslan
