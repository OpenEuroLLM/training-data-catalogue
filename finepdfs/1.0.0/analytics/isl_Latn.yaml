  \u00ed meltingarvegi | Q-2011-00971 |\"", "\"Fundur \u00ed sk\u00f3lar\u00e1\u00f0i
  25. ma\u00ed 2022\\n\\nM\u00e6ttir: Krist\u00edn \u00d3lafsd\u00f3ttir, Birgitta
  R\u00f3s Bj\u00f6rnsd\u00f3ttir og S. Olga Veturli\u00f0ad\u00f3ttir.  A\u00f0rir
  bo\u00f0u\u00f0u forf\u00f6ll, veikindi og leyfi.\\n\\n1. Skipulag n\u00e6sta vetrar.
  Ekki ver\u00f0ur miki\u00f0 um tilf\u00e6ringar \u00e1 nemendah\u00f3pum og ver\u00f0ur\\nunglingastigi\u00f0
  \u00e1 sama sta\u00f0 sem og yngsta stigi\u00f0.  A\u00f0eins breytingar \u00e1
  mi\u00f0stiginu og hversu miklar \u00fe\u00e6r ver\u00f0a fer eftir framkv\u00e6mdum
  \u00e1 efri h\u00e6\u00f0 gula h\u00fassins. B\u00fai\u00f0 er a\u00f0 r\u00e1\u00f0a
  inn s\u00e9rkennara \u00ed 60-70% starfs, umsj\u00f3narkennara \u00e1 mi\u00f0stig
  sem og t\u00f3mstunda- og f\u00e9lagsm\u00e1lafr\u00e6\u00f0ing (me\u00f0 vi\u00f0b\u00f3tardipl\u00f3mu
  \u00ed f\u00f6tlunarfr\u00e6\u00f0um) \u00ed t\u00edmabundi\u00f0 starf \u00feroska\u00fej\u00e1lfa.
  Augl\u00fdst hefur veri\u00f0 tvisvar sinnum eftir kennurum og \u00fear sem ekki
  n\u00e1\u00f0ist a\u00f0 r\u00e1\u00f0a \u00ed allar st\u00f6\u00f0ur kennara me\u00f0
  leyfisbr\u00e9f hefur veri\u00f0 gengi\u00f0 fr\u00e1 r\u00e1\u00f0ningum \u00feeirra
  lei\u00f0beinenda sem fyrir eru.  \u00dea\u00f0 \u00fearf a\u00f0 augl\u00fdsa nokkrar
  st\u00f6\u00f0ur stu\u00f0ningsfulltr\u00faa seinna \u00ed sumar.\\n2. H\u00fasn\u00e6\u00f0ism\u00e1l
  og framkv\u00e6mdir. Framkv\u00e6mdir vegna myglu \u00e1 efri h\u00e6\u00f0 gula
  h\u00fassins eru hafnar og vonandi l\u00fdkur \u00feeim fyrir sk\u00f3labyrjun n\u00e6sta
  sk\u00f3la\u00e1rs. \u00dea\u00f0 er ekki enn v\u00edst me\u00f0 a\u00f0rar framkv\u00e6mdir.\\n\\nRitari:
  Sveinfr\u00ed\u00f0ur Olga Veturli\u00f0ad\u00f3ttir, sk\u00f3lastj\u00f3ri\"",
  "\"Gar\u00f0ab\u00e6r Anna Mar\u00eda Gu\u00f0mundsd\u00f3ttir Gar\u00f0atorg 7
  210 Gar\u00f0ab\u00e6r\\n\\nReykjav\u00edk, 17. ma\u00ed 2023 UST202303-234/A.B.
  10.04.02\\n\\nEfni: Tillaga a\u00f0 deiliskipulagi f\u00f3lkvangs \u00ed V\u00edfilssta\u00f0ahrauni
  - Gar\u00f0ab\u00e6r\\n\\nV\u00edsa\u00f0 er til erindis skipulagsstj\u00f3ra Gar\u00f0ab\u00e6jar
  er barst 20. mars sl. \u00fear sem \u00f3ska\u00f0 er umsagnar Umhverfisstofnunar
  um till\u00f6gu a\u00f0 deiliskipulagi f\u00f3lkvangs \u00ed V\u00edfilssta\u00f0ahrauni
  \u00ed Gar\u00f0ab\u00e6.\\n\\n\u00cd erindinu kemur fram a\u00f0 tillagan gerir
  r\u00e1\u00f0 fyrir st\u00edga- og umfer\u00f0arkerfi  innan f\u00f3lkvangsins \u00ed
  V\u00edfilssta\u00f0ahrauni og Mar\u00eduhellum.\\n\\nMarkmi\u00f0 deiliskipulagsins
  er a\u00f0 skipuleggja sv\u00e6\u00f0i til \u00fativistar, n\u00e1tt\u00farusko\u00f0unar
  og fr\u00e6\u00f0slu samhli\u00f0a \u00fev\u00ed a\u00f0 vernda jar\u00f0myndanir,
  gr\u00f3\u00f0urfar, fuglal\u00edf og menningarminjar. Skilgreint er fyrirkomulag
  g\u00f6ngu- og hj\u00f3last\u00edga, fr\u00e6\u00f0slu- og \u00e1ningarsta\u00f0a.\\n\\nAuk
  \u00feess kemur fram a\u00f0 vegl\u00edna Fl\u00f3ttamannavegar, sem liggur milli
  f\u00f3lkvanganna \u00ed V\u00edfilssta\u00f0ahrauni og Mar\u00eduhellum, er endursko\u00f0u\u00f0
  til a\u00f0 b\u00e6ta \u00f6ryggi \u00e1 veginum og til samr\u00e6mis vi\u00f0 breytta
  skilgreiningu hans \u00ed a\u00f0alskipulagi sem augl\u00fdst er samhli\u00f0a.
  Einnig er st\u00edgur milli Urri\u00f0aholts og V\u00edfilssta\u00f0a me\u00f0fram
  Reykjanesbraut skilgreindur sem stofnst\u00edgur \u00e6tla\u00f0ur umfer\u00f0 gangandi
  og hj\u00f3landi vegfarenda.\\n\\nStofnst\u00edgur me\u00f0fram Reykjanesbraut\\n\\n\u00cd
  vettvangsfer\u00f0um Umhverfisstofnunar, Gar\u00f0ab\u00e6jar og r\u00e1\u00f0gjafa,
  lag\u00f0i stofnunin til a\u00f0 hj\u00f3labraut stofnst\u00edgs l\u00e6gi sams\u00ed\u00f0a
  Reykjanesbraut til a\u00f0 vernda hraunmyndanir \u00fear sem \u00e1 \u00feessum
  hluta f\u00f3lkvangs eru hraun mj\u00f6g \u00fafin og \u00f3snortin. \u00c1 hluta
  stofnst\u00edgs fyrir gangandi, sem sveitarf\u00e9lagi\u00f0 hefur lagt til og mun
  fara \u00ed gegnum \u00fafi\u00f0 hraun, ver\u00f0i raski haldi\u00f0 \u00ed l\u00e1gmarki
  eins og h\u00e6gt er, falli vel a\u00f0 umhverfi s\u00ednu, og ver\u00f0i sta\u00f0sett
  \u00ed l\u00e6g\u00f0um \u00fear sem trj\u00e1gr\u00f3\u00f0ur hefur n\u00fa \u00feegar
  haft \u00e1hrif \u00e1 jar\u00f0myndanir. Umhverfisstofnun bendir \u00e1 a\u00f0
  einungis hluti stofnst\u00edgs fyrir gangandi \u00e1 \u00feessu sv\u00e6\u00f0i
  fylgir \u00feeirri lei\u00f0 sem l\u00f6g\u00f0 var til og merkt \u00ed vettvangsfer\u00f0.
  Auk \u00feess \u00fearf a\u00f0 sko\u00f0a a\u00f0 mati stofnunarinnar hvort  h\u00e6gt
  s\u00e9 a\u00f0 setja litlar br\u00fdr til a\u00f0 l\u00e1gmarka fyllingar og til
  a\u00f0 raska ekki jar\u00f0myndunum a\u00f0 \u00f3\u00fe\u00f6rfu. Umhverfisstofnun
  bendir einnig \u00e1 mikilv\u00e6gi \u00feess a\u00f0 l\u00e1gmarka allt rask \u00e1
  framkv\u00e6mdat\u00edma.\\n\\nUmhverfisstofnun bendir \u00e1 mikilv\u00e6gi \u00feess
  a\u00f0 fyrirhuga\u00f0ar framkv\u00e6mdir \u00e1 \u00feessum hluta stofnst\u00edgsins
  fari fram samhli\u00f0a og \u00e1 \u00feeim hluta stofnst\u00edgs fyrir hj\u00f3landi
  umfer\u00f0 me\u00f0fram Reykjanesbraut, \u00fe\u00f3 svo a\u00f0 stofnst\u00edgur
  fyrir hj\u00f3landi me\u00f0fram Reykjanesbraut s\u00e9 ekki merktur inn \u00e1
  uppdr\u00e1tt.\\n\\nUmhverfisstofnun hefur bent \u00e1 verkefni Vegager\u00f0arinnar
  \u00fear sem stofnst\u00edgar fylgja stofnbrautum \u00ed \u00fe\u00e9ttb\u00fdli
  \u00fear sem hafa veri\u00f0 settar upp hlj\u00f3\u00f0manir og \u00f6ryggi hefur
  veri\u00f0 tryggt. Umhverfisstofnun tekur undir sem kemur fram \u00ed greinarger\u00f0
  a\u00f0 s\u00fa tillaga a\u00f0 stofnst\u00edg \u00ed gegnum \u00fafi\u00f0 hraun
  vestan megin  f\u00f3lkvangs, sem er h\u00e9r til umfj\u00f6llunar, fyrir b\u00e6\u00f0i
  gangandi og hj\u00f3landi \u00ed gegnum hrauni\u00f0 hafa neikv\u00e6\u00f0 \u00e1hrif
  \u00e1 jar\u00f0myndanir \u00ed f\u00f3lkvanginum.\\n\\nFyrirhuga\u00f0 er a\u00f0
  endurhanna gatnam\u00f3t Reykjanesbrautar og Urri\u00f0aholts. Umhverfisstofnun
  vill benda \u00e1 \u00feann m\u00f6guleika a\u00f0 tengja Urri\u00f0aholtshverfi
  \u00feeim stofnst\u00edg sem er n\u00fa \u00feegar til sta\u00f0ar nor\u00f0an vi\u00f0
  Reykjanesbrautina.\\n\\nUmhverfisstofnun telur \u00f3t\u00edmab\u00e6rt a\u00f0
  skilgreina deiliskipulag br\u00fa yfir Reykjanesbraut \u00fear sem ekki liggur fyrir
  endurh\u00f6nnun gatnam\u00f3ta Reykjanesbrautar og Urri\u00f0aholts. Vi\u00f0 endurh\u00f6nnun
  \u00e1 gatnam\u00f3tunum v\u00e6ri h\u00e6gt a\u00f0 finna hentugri sta\u00f0setningu
  fyrir br\u00fa fyrir gangandi/hj\u00f3landi umfer\u00f0. Umhverfisstofnun telur
  a\u00f0 sta\u00f0setning br\u00faar \u00e1 \u00feessum hluta f\u00f3lkvangs getur
  haft neikv\u00e6\u00f0 \u00e1hrif \u00e1 jar\u00f0myndanir.\\n\\nVir\u00f0ingarfyllst,\\n\\nAxel
  Benediktsson s\u00e9rfr\u00e6\u00f0ingur Sverrir A\u00f0alsteinn J\u00f3nsson teymisstj\u00f3ri\"",
  "\"Hj\u00e1lpsemi\\n\\nB\u00f6rnin \u00e6tla a\u00f0 s\u00fdna hj\u00e1lpsemi heima
  um helgina og skrifa hvernig \u00feau s\u00fdndu hj\u00e1lpsemi \u00e1 mi\u00f0ann.
  Vi\u00f0 \u00e6tlum svo a\u00f0 lesa mi\u00f0ana saman \u00ed leiksk\u00f3lanum.\\n\\nHj\u00e1lpsemi\\n\\nB\u00f6rnin
  \u00e6tla a\u00f0 s\u00fdna hj\u00e1lpsemi heima um helgina og skrifa hvernig \u00feau
  s\u00fdndu hj\u00e1lpsemi \u00e1 mi\u00f0ann. Vi\u00f0 \u00e6tlum svo a\u00f0 lesa
