  alls |  | 279.942 |  | 83.899 |  | 363.841 | 367.944 |\\n\\n6.1.1 A\u00f0rar \u00fej\u00f3nustutekjur\\n\\nA\u00f0rar
  \u00fej\u00f3nustutekjur eru vegna s\u00f6lu \u00e1 rafmagni \u00e1 tjaldst\u00e6\u00f0um,
  \u00fej\u00f3nustukortum og \u00fdmissi v\u00f6ru og handverki. \u00de\u00e1 er
  innheimta gistin\u00e1ttaskatts me\u00f0talin \u00ed \u00f6\u00f0rum \u00fej\u00f3nustutekjum.\\n\\n6.1.2
  Gisting og veitinga\u00fej\u00f3nusta\\n\\nGrei\u00f0slur vegna tjaldgistinga og
  gistingar \u00ed gistisk\u00e1lum \u00e1samt veitingas\u00f6lu. Tekjuaukning fr\u00e1
  \u00e1rinu 2015 nam 55.6 m.kr. e\u00f0a 52%.\\n\\n6.1.3 B\u00e6kur, \u00e1fengi,
  fatna\u00f0ur og hreinl\u00e6tisv\u00f6rur\\n\\nV\u00f6rusala \u00e1 b\u00f3kum,
  \u00e1fengi, fatna\u00f0i o.fl. fellur undir \u00feennan li\u00f0.\\n\\n6.1.4 Leigutekjur\\n\\nTekjur
  af \u00fatleigu \u00e1 a\u00f0st\u00f6\u00f0u til fer\u00f0a\u00fej\u00f3nustua\u00f0ila
  flokkast sem leigutekjur auk h\u00fasaleigu starfsmanna og a\u00f0rar leigutekjur.\\n\\n6.1.5
  Innbyr\u00f0is framl\u00f6g milli A-hluta stofnana\\n\\nUm er a\u00f0 r\u00e6\u00f0a
  framl\u00f6g fr\u00e1 Framkv\u00e6mdasj\u00f3\u00f0i fer\u00f0amannasta\u00f0a til
  framkv\u00e6mda sem stu\u00f0la a\u00f0 uppbyggingu, vi\u00f0haldi og verndun fer\u00f0amannasta\u00f0a
  \u00ed opinberri eigu e\u00f0a umsj\u00f3n. Framl\u00f6g l\u00e6kku\u00f0u fr\u00e1
  \u00e1rinu 2015 um 25,2 m.kr. e\u00f0a 23%.\\n\\n6.1.6 Rekstrarframl\u00f6g fr\u00e1
  einka- og opinberum a\u00f0ilum\\n\\nH\u00e9r er um a\u00f0 r\u00e6\u00f0a frj\u00e1ls
  framl\u00f6g fr\u00e1 f\u00e9laginu Vinir Vatnaj\u00f6kuls sem n\u00e1mu 1,6 m.kr.
  \u00e1ri\u00f0 2016 og l\u00e6kku\u00f0u fr\u00e1 fyrra \u00e1ri um 13,6 m.kr.\\n\\n6.1.7
  Framl\u00f6g til fj\u00e1rfestinga fr\u00e1 innlendum opinberum a\u00f0ilum\\n\\nFramlag
  fr\u00e1 Sveitarf\u00e9laginu Hornafj\u00f6r\u00f0ur sem er endur\u00fathlutun \u00e1
  framlagi vegna fer\u00f0am\u00e1la, er eina framlagi\u00f0 fr\u00e1 innlendum opinberum
  a\u00f0ilum. Tekjur af \u00feessum li\u00f0 l\u00e6kku\u00f0u um 40,6 m.kr. fr\u00e1
  fyrra \u00e1ri en \u00fea\u00f0 \u00e1r fengust einnig framl\u00f6g fr\u00e1 Framkv\u00e6mdasj\u00f3\u00f0i
  fer\u00f0amannasta\u00f0a.\\n\\n6.1.8 Fj\u00e1rmagns- og a\u00f0rar tekjur\\n\\nUm
  er a\u00f0 r\u00e6\u00f0a vaxta- og fj\u00e1rmunatekjur, ska\u00f0a- og tj\u00f3nab\u00e6tur
  og \u00fdmsar a\u00f0rar tekjur. Tekjuli\u00f0ur er neikv\u00e6\u00f0ur um 2,2 m.kr.
  en var j\u00e1kv\u00e6\u00f0ur um 1,8 m.kr. \u00e1ri\u00f0 2015.\\n\\n6.2 Laun og
  launatengd gj\u00f6ld\\n\\nLaun og launatengd gj\u00f6ld \u00e1 \u00e1rinu 2016
  n\u00e1mu 370,9 m.kr. og h\u00e6kku\u00f0u um 59,1 m.kr. fr\u00e1 fyrra \u00e1ri
  e\u00f0a 19%. \u00c1 \u00e1rinu 2016 var greitt fyrir 43,3 \u00e1rsverk \u00e1 dagvinnu
  mi\u00f0a\u00f0 vi\u00f0 36,9 \u00e1rsverk \u00e1 fyrra \u00e1ri sem er h\u00e6kkun
  um 6,3 \u00e1rsverk e\u00f0a 17,2%. Laun og launatengd gj\u00f6ld \u00e1 \u00e1rsverk
  h\u00e6kku\u00f0u um 1,5%.\\n\\n\u00cd mars 2017 f\u00e9ll d\u00f3mur \u00ed H\u00e6star\u00e9tti
  var\u00f0andi kr\u00f6fu starfsmanns um svokalla\u00f0 \u00f3bygg\u00f0ar\u00e1lag.
  Stofnunin tapa\u00f0i \u00fev\u00ed m\u00e1li og felur d\u00f3murinn \u00ed s\u00e9r
  umtalsver\u00f0an \u00fatgjaldaauka. Samkv\u00e6mt uppl\u00fdsingum framkv\u00e6mdastj\u00f3ra
  er \u00e1\u00e6tla\u00f0 a\u00f0 um 10 m.kr. falli til \u00e1ri\u00f0 2017 og 4
  til 5 m.kr. \u00e1 \u00e1ri h\u00e9r eftir. Launakostna\u00f0ur \u00e1ri\u00f0 2016
  er \u00fev\u00ed vantalinn sem \u00fev\u00ed nemur.\\n\\nVi\u00f0 launaendursko\u00f0un
  \u00e1rsins 2016 voru allar launahreyfingar starfsmanna \u00e1 launalista sko\u00f0a\u00f0ar
  og breytingar \u00e1 milli \u00e1ranna 2015 og 2016 bornar saman. Launabreytingar
  fylgdu kjarasamningum. R\u00e1\u00f0ningasamningar og g\u00f6gn vegna breytinga
  voru sko\u00f0u\u00f0 \u00ed \u00fartaki starfsmanna.\\n\\n6.3 \u00d6nnur rekstrargj\u00f6ld\\n\\n\u00d6nnur
  rekstrargj\u00f6ld \u00e1 \u00e1rinu 2016 n\u00e1mu 496,2 m.kr. og l\u00e6kku\u00f0u
  um 18,6 m.kr. fr\u00e1 fyrra \u00e1ri e\u00f0a 3,6%.  Vi\u00f0 endursko\u00f0unina
  var fari\u00f0 yfir kostna\u00f0 stofnunarinnar og f\u00e6rslur sko\u00f0a\u00f0ar
  \u00ed hreyfingalista b\u00f3khalds auk samanbur\u00f0ar \u00e1 milli \u00e1ra.
  Einnig voru fylgiskj\u00f6l sko\u00f0u\u00f0 eftir \u00fartaki. Lotun annarra rekstrargjalda
  um \u00e1ram\u00f3t milli \u00e1ranna 2016 og 2017 var sko\u00f0u\u00f0 \u00ed \u00fartaki.
  Athuga\u00f0 hvort f\u00e6rslur v\u00e6ru f\u00e6r\u00f0ar \u00e1 r\u00e9tta b\u00f3khaldslykla,
  reikningar samr\u00e6mdust starfsemi stofnunar og v\u00e6ru \u00e1rita\u00f0ir til
  grei\u00f0slu.\\n\\nVi\u00f0 sko\u00f0un \u00e1 lotun var \u00fartak teki\u00f0
  af hreyfingalista jan\u00faar og febr\u00faar \u00e1ri\u00f0 2017. Valdir voru 18
  reikningar til sko\u00f0unar og reyndust \u00fer\u00edr vera rangt lota\u00f0ir,
  \u00fe.e. \u00feeir hef\u00f0u \u00e1tt a\u00f0 b\u00f3kast \u00e1 \u00e1ri\u00f0
  2016. Heildarupph\u00e6\u00f0 \u00fartaks var 11,8 m.kr. af alls 55,6 m.kr. \u00dear
  af nam r\u00f6ng lotun 1,5 m.kr. e\u00f0a 12,4%.\\n\\n6.4 Ni\u00f0ursta\u00f0a\\n\\nR\u00edkisendursko\u00f0un
  bendir \u00e1 a\u00f0 b\u00e6ta \u00fearf ums\u00fdslu um g\u00f6gn vegna r\u00e1\u00f0ninga
  og breytingas\u00f6gu. Einnig \u00fearf a\u00f0 huga a\u00f0 lotun tekna og gjalda
  um \u00e1ram\u00f3t, \u00feannig a\u00f0 gj\u00f6ld og tekjur vegna vi\u00f0komandi
  rekstrar\u00e1rs komi til b\u00f3kunar \u00e1 vi\u00f0eigandi \u00e1ri.\\n\\n7 Endursk\u00f6\u00f0un
  efnahagsli\u00f0a\\n\\n\u00cd \u00e1rslok 2016 n\u00e1mu eignir 250,7 m.kr., skuldir
  n\u00e1mu 319,2 m.kr. og h\u00f6fu\u00f0st\u00f3ll var neikv\u00e6\u00f0ur um 68,5
  m.kr.\\n\\n| \u00cd \u00fe\u00fas.kr. | 2016 | 2015 | Breyting |\\n|---|---|---|---|\\n|
