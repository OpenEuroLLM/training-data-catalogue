  23\\n\\nBekkjarn\u00e1mskr\u00e1 4. og 5. bekkjar\\n\\nAlmennt\\n\\n\u00cd fj\u00f3r\u00f0a
  bekk eru sex nemendur og \u00ed fimmta bekk eru nemendurnir \u00e1tta.\\n\\nUmsj\u00f3narkennari
  er B\u00e6ring J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson.\\n\\nBekkirnir
  eru st\u00f3ran part vikunnar \u00ed samkennslu.\\n\\n\u00cdslenska 4. bekkur\\n\\nKennarar:
  B\u00e6ring J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson og \u00deur\u00ed\u00f0ur
  Lilja Valt\u00fdsd\u00f3ttir Stu\u00f0ningur \u00ed tveim kennslut\u00edmum: Valborg
  Halld\u00f3ra Gestsd\u00f3ttir\\n\\n8 t\u00edmar \u00ed \u00edslensku \u00e1 viku,
  \u00fear af 5 samkenndir me\u00f0 5. bekk\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nKennslan
  mi\u00f0ast a\u00f0 \u00fev\u00ed a\u00f0 nemandi geti/hafi:\\n\\nbeitt sk\u00fdrum
  og \u00e1heyrilegum frambur\u00f0i,\\ntj\u00e1\u00f0 sig me\u00f0 a\u00f0sto\u00f0
  leikr\u00e6nnar tj\u00e1ningar frammi fyrir h\u00f3pi og sta\u00f0i\u00f0 fyrir
  m\u00e1li s\u00ednu,\\nsagt fr\u00e1 eftirminnilegum atbur\u00f0um og l\u00fdst
  \u00e1kve\u00f0nu fyrirb\u00e6ri, endursagt efni sem hlusta\u00f0 hefur veri\u00f0
  \u00e1 e\u00f0a lesi\u00f0,\\n\u00e1tt g\u00f3\u00f0 samskipti, hlusta\u00f0 og
  s\u00fdnt kurteisi,\\nbeitt a\u00f0fer\u00f0um vi\u00f0 umskr\u00e1ningu hlj\u00f3\u00f0a
  og stafa \u00feannig a\u00f0 lestur ver\u00f0i lipur og sk\u00fdr,\\nvali\u00f0
  b\u00f3k e\u00f0a anna\u00f0 lesefni og lesi\u00f0 s\u00e9r til \u00e1n\u00e6gju,\\n\u00feekki
  til grunn\u00fe\u00e1tta \u00ed byggingu texta, svo sem upphaf, meginm\u00e1l og
  ni\u00f0urlag,\\nbeitt einf\u00f6ldum stafsetningarreglum og nota\u00f0 tilt\u00e6k
  hj\u00e1lparg\u00f6gn vi\u00f0 h\u00e6fi,\\nsami\u00f0 texta fr\u00e1 eigin brj\u00f3sti,
  svo sem s\u00f6gu, fr\u00e1s\u00f6gn, lj\u00f3\u00f0 e\u00f0a skilabo\u00f0,\\nbeitt
  t\u00f6lu\u00f0u m\u00e1li og ritu\u00f0u af nokkru \u00f6ryggi og r\u00e6\u00f0ur
  yfir or\u00f0afor\u00f0a og m\u00e1lskilning sem h\u00e6fir \u00feroska,\\ngert
  s\u00e9r grein fyrir mismunandi hlutverkum nafnor\u00f0a, l\u00fdsingaror\u00f0a
  og sagnor\u00f0a,\\nfundi\u00f0 kyn og t\u00f6lu,\\ngreint mun \u00e1 s\u00e9rn\u00f6fnum
  og samn\u00f6fnum,\\nra\u00f0a\u00f0 \u00ed stafr\u00f3fsr\u00f6\u00f0 og gert s\u00e9r
  grein fyrir notagildi \u00feess vi\u00f0 leit og skipulag,\\n\\nSkipulag kennslunnar\\n\\nUnni\u00f0
  er a\u00f0 mestu \u00fat fr\u00e1 \u00e1\u00e6tlun \u00ed \u00edslensku. H\u00f3pinnlagnir
  eru vegna \u00fdmissa efnisatri\u00f0a \u00fear sem nemendur fylgjast a\u00f0 me\u00f0
  en annars eru einstaklingsinnlagnir. Nemendur gefst f\u00e6ri \u00e1 a\u00f0 vinna
  n\u00e1msefni\u00f0 \u00e1 s\u00ednum hra\u00f0a sem h\u00e6fir \u00feeirra getustigi.
  N\u00e1msefni er lagt fyrir \u00ed t\u00edma og verkefni \u00ed kennslub\u00f3k,
  af neti e\u00f0a \u00f6\u00f0rum g\u00f6gnum fr\u00e1 kennurum unnin \u00fdmist
  einstaklingslega e\u00f0a \u00ed h\u00f3pavinnu.\\n\\n360 m\u00edn (n\u00edu kennslustundir)
  \u00e1 viku eru \u00e6tla\u00f0ar \u00edslenskun\u00e1mi en undir \u00fea\u00f0
  fellur m\u00e1lfr\u00e6\u00f0i, b\u00f3kmenntir, lestur, ritun (\u00e1 bla\u00f0i
  og \u00ed t\u00f6lvu), stafsetning og skrift. A\u00f0 me\u00f0altali fara um 3 t\u00edmar
  \u00e1 viku \u00ed lestur hlustun og tj\u00e1ningu. L\u00f6g\u00f0 er s\u00e9rst\u00f6k
  \u00e1hersla \u00e1 lestur. Nemendur lesa \u00e1 hverjum degi \u00ed a.m.k. 20 m\u00edn\u00fatur
  og af og til upph\u00e1tt fyrir kennara. Nemendur lesa jafnframt daglega heima \u00ed
  heimalestrarb\u00f3k a\u00f0 eigin vali (\u00ed samr\u00e1\u00f0i vi\u00f0 kennara).
  Hver nemandi heldur skr\u00e1 yfir heimalestur sinn \u00ed s\u00e9rstakri b\u00f3k
  sem \u00fearf a\u00f0 taka me\u00f0 \u00ed sk\u00f3lann \u00e1 hverjum degi. Um
  tveir t\u00edmar \u00e1 viku fara \u00ed m\u00e1lfr\u00e6\u00f0i og tveir t\u00edmar
  \u00ed b\u00f3kmenntir. Einn t\u00edmi \u00e1 viku fer svo \u00ed ritun, skrift
  og stafsetningu. \u00deessir t\u00edmar koma til me\u00f0 a\u00f0 ver\u00f0a samtvinna\u00f0ir
  a\u00f0 hluta \u00ed st\u00f6\u00f0vavinnu \u00fear sem unni\u00f0 er \u00e1 fj\u00f6lbreyttan
  h\u00e1tt me\u00f0 flesta \u00fe\u00e6tti \u00edslenskunnar.\\n\\nN\u00e1msg\u00f6gn:
  Skinna, Trunt trunt og tr\u00f6llin og \u00fdmislegt lj\u00f3srita\u00f0 efni fr\u00e1
  kennara og anna\u00f0 \u00fej\u00e1lfunarefni t.d. \u00e1 netinu (sj\u00e1 t.d.
  \u00fdmsa \u00edslenskuvefi \u00e1 heimas\u00ed\u00f0u Menntam\u00e1lastofnunar
  www.mms.is).\\n\\nGrunn\u00fe\u00e6ttir menntunar\\n\\nL\u00e6si: \u00cd s\u00ednum
  v\u00ed\u00f0asta skilningi er l\u00e6si eitt af h\u00f6fu\u00f0markmi\u00f0um \u00edslenskun\u00e1msins.
  Mikil \u00e1hersla er l\u00f6g\u00f0 \u00e1 lestur og lestrarf\u00e6rni me\u00f0
  markvissri \u00fej\u00e1lfun \u00ed samvinnu vi\u00f0 heimilin. Mikil textavinna
  og fj\u00f6lbreytt verkefni \u00fej\u00e1lfa nemendur \u00ed a\u00f0 leita s\u00e9r
  uppl\u00fdsinga, greina texta og finna a\u00f0alatri\u00f0i, endursegja og skilja.\\nSj\u00e1lfb\u00e6rni:
  Nemendur \u00fej\u00e1lfast \u00ed \u00fev\u00ed a\u00f0 beita l\u00fd\u00f0r\u00e6\u00f0islegum
  vinnubr\u00f6g\u00f0um \u00fear sem \u00feeim gefst kostur \u00e1 a\u00f0 vinna
  saman a\u00f0 \u00e1kve\u00f0num verkefnum.\\nL\u00fd\u00f0r\u00e6\u00f0i og mannr\u00e9ttindi:
  \u00cd kennslut\u00edmum er lagt upp me\u00f0 a\u00f0 efla sam\u00e1byrg\u00f0,
  virkni og me\u00f0vitund allra nemenda \u00ed gegnum \u00edslenskun\u00e1m. Me\u00f0
  \u00fe\u00e1ttt\u00f6ku \u00ed h\u00f3pavinnu l\u00e6ra nemendur a\u00f0 vir\u00f0a
  sko\u00f0anir hvers annars \u00e1samt \u00fev\u00ed a\u00f0 finna hj\u00e1 s\u00e9r
  kjark til a\u00f0 \u00edgrunda eigin hugmyndir og l\u00e1ta \u00fe\u00e6r \u00ed
  lj\u00f3s.\\nJafnr\u00e9tti: Felst me\u00f0al annars \u00ed \u00fev\u00ed a\u00f0
  allir nemendur f\u00e1i verkefni og n\u00e1msefni vi\u00f0 h\u00e6fi og a\u00f0
  \u00fe\u00f6rfum \u00feeirra s\u00e9 m\u00e6tt af skilningi og vir\u00f0ingu. Kennari
  leggur sig fram um a\u00f0 gera \u00f6llum nemendum kleift a\u00f0 auka \u00feekkingu
  s\u00edna og a\u00f0laga n\u00e1msefni\u00f0 a\u00f0 \u00fe\u00f6rfum einstakra
  nemenda.\\nHeilbrig\u00f0i og velfer\u00f0: Undirsta\u00f0a n\u00e1ms er heilbrig\u00f0i
  og velfer\u00f0 nemenda og l\u00f6g\u00f0 er r\u00edk \u00e1hersla \u00e1 a\u00f0
  skapa g\u00f3\u00f0an f\u00e9lagsanda og bekkjarbrag \u00ed sk\u00f3lastofunni.
  J\u00e1kv\u00e6\u00f0 samskipti, samhj\u00e1lp og vir\u00f0ing stu\u00f0lar a\u00f0
  g\u00f3\u00f0ri og j\u00e1kv\u00e6\u00f0ri sj\u00e1lfsmynd nemenda og hugrekki til
  a\u00f0 tj\u00e1 sig um eigin hugmyndir og taka \u00fe\u00e1tt \u00ed uppbyggilegum
  sko\u00f0anaskiptum.\\nSk\u00f6pun: Nemendur \u00fej\u00e1lfast \u00ed a\u00f0 b\u00faa
  til eigin fr\u00e1sagnir \u00ed gegnum s\u00f6gur, teikningar og lj\u00f3\u00f0.
  Fr\u00e1gangur verkefna og skil geta veri\u00f0 me\u00f0 \u00fdmsum h\u00e6tti allt
  eftir \u00fev\u00ed hva\u00f0 hverjum og einum bl\u00e6s \u00ed brj\u00f3st.\\n\\nN\u00e1msmat\\n\\nLestur:\\n\\nLestrarpr\u00f3f
  \u2013 hra\u00f0lestur.\\nMMS \u2013 lesferill, pr\u00f3fa\u00f0 \u00ed septeber,
  jan\u00faar og ma\u00ed\\n\\nM\u00e1lfr\u00e6\u00f0i:\\n\\nS\u00edmat me\u00f0 verkefnum
  \u00far \u00e1kve\u00f0num atri\u00f0um m\u00e1lfr\u00e6\u00f0innar.\\nVorpr\u00f3f
  \u00ed ma\u00ed gildir 50% \u00e1 m\u00f3ti s\u00edmati.\\n\\nB\u00f3kmenntir og
  ritun:\\n\\nS\u00edmat me\u00f0 \u00fdmsum verkefnum \u00far \u00fev\u00ed efni
  sem fengist er vi\u00f0 hverju sinni\\nMunnlegt pr\u00f3f\\nEfni \u00far b\u00f3kmennta\u00fe\u00e6tti
  mun koma fyrir \u00e1 j\u00f3lapr\u00f3fi \u00ed desember\\n\\nKennslu\u00e1\u00e6tlun\\n\\nVika
  20 - 24: M\u00e1lfr\u00e6\u00f0i\u00e1hersluatri\u00f0i: Nafnor\u00f0, s\u00e9rn\u00f6fn
  og samn\u00f6fn, eintala og fleirtala.\\n\\nVika 25 \u2013 29: M\u00e1lfr\u00e6\u00f0i\u00e1hersluatri\u00f0i:
  Kyn nafnor\u00f0a og greinir\\n\\nVika 30 \u2013 34: M\u00e1lfr\u00e6\u00f0i\u00e1hersluatri\u00f0i:
  Fallbeyging nafnor\u00f0a\\n\\nVika 35 \u2013 40: Annarupprifjun og vorpr\u00f3f\\n\\n\u00cdslenska
  5. bekkur\\n\\nKennarar: B\u00e6ring J\u00f3n Brei\u00f0fj\u00f6r\u00f0 Gu\u00f0mundsson,
  S\u00f3ley Margeirsd\u00f3ttir og \u00deur\u00ed\u00f0ur Lilja Valt\u00fdsd\u00f3ttir\\n\\nStu\u00f0ningur
  \u00ed tveim kennslut\u00edmum: Valborg Halld\u00f3ra Gestsd\u00f3ttir\\n\\n9 t\u00edmar
  \u00ed \u00edslensku \u00e1 viku, \u00fear af 5 samkenndir me\u00f0 4. bekk\\n\\nH\u00e6fnivi\u00f0mi\u00f0\\n\\nTala\u00f0
  m\u00e1l, hlustun og \u00e1horf\\n\\nMi\u00f0a\u00f0 er a\u00f0 \u00fev\u00ed a\u00f0
  vi\u00f0 lok annar geti nemandi\\n\\ntj\u00e1\u00f0 sig sk\u00fdrt og \u00e1heyrilega
  og gert s\u00e9r grein fyrir gildi g\u00f3\u00f0rar framsagnar\\ntj\u00e1\u00f0
  sig me\u00f0 leikr\u00e6nni tj\u00e1ningu fyrir framan h\u00f3p og gert grein fyrir
  sko\u00f0unum s\u00ednum\\nteki\u00f0 \u00fe\u00e1tt \u00ed samr\u00e6\u00f0um og
  r\u00f6kr\u00e6\u00f0um samkv\u00e6mt reglum\\nhlusta\u00f0 og horft me\u00f0 athygli
  \u00e1 upplestur, lj\u00f3\u00f0, leiki\u00f0 efni og s\u00f6ngva og gert grein
  fyrir a\u00f0alatri\u00f0um\\nn\u00fdtt s\u00e9r myndefni og rafr\u00e6nt efni \u00e1
  gagnr\u00fdninn h\u00e1tt og dregi\u00f0 fram a\u00f0alatri\u00f0i\\n\u00e1tt g\u00f3\u00f0
  samskipti, hlusta\u00f0, g\u00e6tt tungu sinnar og s\u00fdnt vi\u00f0eigandi kurteisi.\\n\\nLestur
  og b\u00f3kmenntir\\n\\nMi\u00f0a\u00f0 er a\u00f0 \u00fev\u00ed a\u00f0 vi\u00f0
  lok annar geti nemandi:\\n\\nlesi\u00f0 texta vi\u00f0 h\u00e6fi me\u00f0 g\u00f3\u00f0um
  hra\u00f0a og af skilningi,\\ngreint og fjalla\u00f0 um a\u00f0alatri\u00f0i \u00ed
  texta og helstu efnisor\u00f0 og nota\u00f0 mismunandi a\u00f0fer\u00f0ir vi\u00f0
  lestur og skilning \u00e1 texta,\\nlesi\u00f0 s\u00e9r til \u00e1n\u00e6gju og fr\u00f3\u00f0leiks
  og vali\u00f0 s\u00e9r lesefni vi\u00f0 h\u00e6fi,\\nlesi\u00f0 gamlar og n\u00fdjar
  b\u00f3kmenntir, \u00fej\u00f3\u00f0s\u00f6gur, lj\u00f3\u00f0 og b\u00f3kmenntir
  \u00e6tla\u00f0ar b\u00f6rnum og unglingum,\\ngreint nokkur fr\u00e1sagnarform b\u00f3kmennta
  og beitt hugt\u00f6kum eins og pers\u00f3nu, s\u00f6gu\u00fer\u00e6\u00f0i, umhverfi
  og bo\u00f0skap\\nbeitt nokkrum hugt\u00f6kum \u00ed bragfr\u00e6\u00f0i og um form
  og innihald lj\u00f3\u00f0a, s.s. r\u00edm, lj\u00f3\u00f0stafi, hrynjandi, l\u00edkingar
  og bo\u00f0skap,\\nafla\u00f0 s\u00e9r uppl\u00fdsinga \u00far b\u00f3kum og fj\u00f6lbreyttu
  rafr\u00e6nu efni, unni\u00f0 \u00far \u00feeim og n\u00fdtt vi\u00f0 lausn verkefna,\\nlesi\u00f0
  \u00far einf\u00f6ldum t\u00f6lulegum uppl\u00fdsingum og t\u00falka\u00f0 \u00fe\u00e6r.\\n\\nRitun\\n\\nMi\u00f0a\u00f0
  er a\u00f0 \u00fev\u00ed a\u00f0 vi\u00f0 lok annar geti nemandi\\n\\nskrifa\u00f0
  l\u00e6silega og af \u00f6ryggi me\u00f0 pers\u00f3nulegri rith\u00f6nd, gengi\u00f0
  fr\u00e1 texta \u00ed ritvinnslu og nota\u00f0 or\u00f0ab\u00e6kur,\\nskipulagt
  og or\u00f0a\u00f0 texta sem byggir \u00e1 grunn\u00fe\u00e1ttum eins og upphafi,
  meginm\u00e1li og ni\u00f0urlagi,\\nsami\u00f0 texta \u00fear sem beitt er eigin
  sk\u00f6pun og kynnt ritun s\u00edna,\\nbeitt helstu atri\u00f0um stafsetningar
  og greinamerkjasetningar,\\nskrifa\u00f0 texta \u00e1 t\u00f6lvu og beitt nokkrum
  a\u00f0ger\u00f0um \u00ed ritvinnslu.\\n\\nv\u00edsa\u00f0 til heimilda.\\n\\nM\u00e1lfr\u00e6\u00f0i\\n\\nMi\u00f0a\u00f0
  er a\u00f0 \u00fev\u00ed a\u00f0 vi\u00f0 lok annar geti nemandi\\n\\nbeitt t\u00f6lu\u00f0u
  m\u00e1li og ritu\u00f0u af \u00f6ryggi og gert s\u00e9r grein fyrir gildi \u00feess
  a\u00f0 b\u00e6ta \u00fea\u00f0,\\nn\u00fdtt s\u00e9r or\u00f0ab\u00e6kur og a\u00f0ra
  gagnagrunna um m\u00e1l,\\ngert s\u00e9r grein fyrir mismunandi hlutverki nafnor\u00f0a,
  sagnor\u00f0a og l\u00fdsingaror\u00f0a og greint helstu einkenni \u00feeirra,\\nnota\u00f0
  hugt\u00f6k og m\u00e1lsh\u00e6tti \u00ed ritu\u00f0u m\u00e1li og t\u00f6lu\u00f0u,\\nbeitt
  \u00feekkingu sinni \u00ed m\u00e1lfr\u00e6\u00f0i vi\u00f0 a\u00f0 b\u00faa til
  setningar, m\u00e1lsgreinar og efnisgreinar,\\nn\u00fdtt or\u00f0afor\u00f0a sinn
  til a\u00f0 skapa n\u00fd or\u00f0 og or\u00f0asamb\u00f6nd og nota\u00f0 \u00feau
  \u00ed texta,\\ngert s\u00e9r grein fyrir notagildi \u00edslenskrar m\u00e1lfr\u00e6\u00f0i
  vi\u00f0 ritun og stafsetningu.\\n\\nN\u00e1ms- og kennslutilh\u00f6gun\\n\\nNemendur
  sitja \u00fdmist einir, tveir og tveir saman e\u00f0a \u00ed st\u00e6rri h\u00f3pum.\\n\\nN\u00e1msb\u00e6kurnar
  mynda almennan ramma um n\u00e1mi\u00f0. \u00cd \u00feeim er a\u00f0 finna margv\u00edslega
  texta og verkefni sem nemendur vinna \u00fdmist einir e\u00f0a saman \u00ed h\u00f3pum
  undir handlei\u00f0slu kennara.\\n\\nL\u00f6g\u00f0 er s\u00e9rst\u00f6k \u00e1hersla
  \u00e1 lestur. Nemendur lesa \u00e1 hverjum degi \u00ed a.m.k. 20 m\u00edn\u00fatur
  og af og til upph\u00e1tt fyrir kennara.\\n\\nNemendur lesa jafnframt daglega heima
  \u00ed heimalestrarb\u00f3k a\u00f0 eigin vali (\u00ed samr\u00e1\u00f0i vi\u00f0
  kennara). Hver nemandi heldur skr\u00e1 yfir heimalestur sinn \u00ed s\u00e9rstakri
  b\u00f3k sem \u00fearf a\u00f0 taka me\u00f0 \u00ed sk\u00f3lann \u00e1 hverjum
  degi.\\n\\nA\u00f0 \u00f6\u00f0ru leyti felst heimavinna a\u00f0allega \u00ed \u00fev\u00ed
  a\u00f0 lj\u00faka vi\u00f0 verkefni sem ekki n\u00e1\u00f0ist a\u00f0 kl\u00e1ra
  \u00ed vikunni. Nemendur lj\u00faka \u00feeim heima \u00ed vikulok. Ef nemandi tekur
  n\u00e1msb\u00e6kur me\u00f0 s\u00e9r heim er mikilv\u00e6gt a\u00f0 hafa \u00fe\u00e6r
  me\u00f0 \u00ed sk\u00f3lat\u00f6skunni n\u00e6sta sk\u00f3ladag.\\n\\nN\u00e1msg\u00f6gn\\n\\nM\u00e1lr\u00e6kt
