  grunnsk\u00f3la\\n\\nH\u00e9r eftir ver\u00f0ur v\u00edsa\u00f0 til allra ofangreindra
  \u00fatbo\u00f0sgagna sem \u00datbo\u00f0sg\u00f6gn nr. 15641\\n\\n0.2 Fyrirspurnir,
  vi\u00f0aukar og \u00f6nnur samskipti\\n\\n\u00d6ll samskipti skulu fara fram me\u00f0
  skriflegum h\u00e6tti \u00e1 \u00fatbo\u00f0svef Reykjav\u00edkurborgar \u00ed gegnum
  flipann \u201eSamskipti/Correspondence\\\" fyrir \u00feetta \u00fatbo\u00f0 \u00e1
  \u00fatbo\u00f0svef Reykjav\u00edkurborgar.\\n\\n\u00d3ski bj\u00f3\u00f0andi eftir
  n\u00e1nari uppl\u00fdsingum e\u00f0a frekari sk\u00fdringum \u00e1 \u00fatbo\u00f0sg\u00f6gnum
  e\u00f0a ver\u00f0i hann var vi\u00f0 \u00f3samr\u00e6mi \u00ed \u00feeim sem getur
  haft \u00e1hrif \u00e1 tilbo\u00f0sfj\u00e1rh\u00e6\u00f0ina, skal hann \u00fe\u00e1
  senda Innkaupaskrifstofu skriflega fyrirspurn me\u00f0 h\u00e6filegum fyrirvara
  mi\u00f0a\u00f0 vi\u00f0 e\u00f0li fyrirspurnar e\u00f0a \u00ed s\u00ed\u00f0asta
  lagi fyrir tilgreindan fyrirspurnarfrest. Fyrirspurnir sem berast s\u00ed\u00f0ar
  ver\u00f0a ekki teknar til greina.\\n\\nBj\u00f3\u00f0andi er hvattur til \u00feess
  a\u00f0 kynna s\u00e9r \u00fatbo\u00f0sg\u00f6gnin vel og n\u00fdta s\u00e9r fyrirspurnir
  til \u00feess a\u00f0 koma \u00e1 framf\u00e6ri athugasemdum sem hann hefur vi\u00f0
  g\u00f6gnin.\\n\\nVi\u00f0aukar vi\u00f0 \u00fatbo\u00f0sg\u00f6gn sem geta innihaldi\u00f0
  sv\u00f6r vi\u00f0 fyrirspurnum, breytingar \u00e1 \u00fatbo\u00f0sg\u00f6gnum e\u00f0a
  a\u00f0rar vi\u00f0b\u00f3taruppl\u00fdsingar ver\u00f0a birtir \u00e1 \u00fatbo\u00f0svef
  Reykjav\u00edkurborgar. Bj\u00f3\u00f0endur bera \u00e1byrg\u00f0 \u00e1 \u00fev\u00ed
  a\u00f0 fylgjast me\u00f0 framkv\u00e6md \u00fatbo\u00f0sins \u00e1 \u00fatbo\u00f0svefnum.\\n\\n0.3
  Kynningarfundur/ Vettvangssko\u00f0un\\n\\nEkki ver\u00f0ur bo\u00f0i\u00f0 upp\u00e1
  kynningarfund/vettvangssko\u00f0un \u00ed \u00fatbo\u00f0i \u00feessu.\\n\\n0.4
  H\u00e6fi bj\u00f3\u00f0anda\\n\\n0.4.1 Kr\u00f6fur um h\u00e6fi vegna starfsr\u00e9ttinda\\n\\nGer\u00f0ar
  eru eftirtaldar kr\u00f6fur um h\u00e6fi vegna starfsr\u00e9ttinda til bj\u00f3\u00f0enda
  nema anna\u00f0 s\u00e9 teki\u00f0 fram. Uppfylli bj\u00f3\u00f0endur ekki kr\u00f6fur
  \u00fatbo\u00f0sgagna um h\u00e6fi vegna starfsr\u00e9ttinda ver\u00f0ur tilbo\u00f0um
  \u00feeirra hafna\u00f0.\\n\\nBj\u00f3\u00f0endur skulu vera skr\u00e1\u00f0ir \u00ed
  fyrirt\u00e6kjaskr\u00e1. \u00deegar um er a\u00f0 r\u00e6\u00f0a fyrirt\u00e6ki
  fr\u00e1 \u00f6\u00f0rum r\u00edkjum Evr\u00f3pska efnahagssv\u00e6\u00f0isins e\u00f0a
  a\u00f0ildarr\u00edkjum stofnsamnings Fr\u00edverslunarsamtaka Evr\u00f3pu skal
  fyrirt\u00e6ki s\u00fdna fram \u00e1 fulln\u00e6gjandi skr\u00e1ningu \u00ed heimar\u00edki
  s\u00ednu me\u00f0 vottor\u00f0i.\\n\\n0.4.2 Kr\u00f6fur um h\u00e6fi vegna fj\u00e1rhagsst\u00f6\u00f0u\\n\\nGer\u00f0ar
  eru eftirtaldar kr\u00f6fur um h\u00e6fi vegna fj\u00e1rhagsst\u00f6\u00f0u til
  bj\u00f3\u00f0enda nema anna\u00f0 s\u00e9 teki\u00f0 fram. Uppfylli bj\u00f3\u00f0endur
  ekki kr\u00f6fur \u00fatbo\u00f0sgagna um h\u00e6fi vegna fj\u00e1rhagsst\u00f6\u00f0u
  ver\u00f0ur tilbo\u00f0um \u00feeirra hafna\u00f0.\\n\\n* Bj\u00f3\u00f0andi skal
  vera \u00ed skilum me\u00f0 opinber gj\u00f6ld.\\n* Bj\u00f3\u00f0andi skal vera
  \u00ed skilum me\u00f0 l\u00edfeyrissj\u00f3\u00f0si\u00f0gj\u00f6ld.\\n* Bj\u00f3\u00f0andi
  skal vera me\u00f0 j\u00e1kv\u00e6tt eigi\u00f0 f\u00e9 og vera me\u00f0  \u00e1rsveltu
  sem nemur hi\u00f0 minnsta 100% af samtals tilbo\u00f0sver\u00f0i bj\u00f3\u00f0anda,
  sj\u00e1 n\u00e1nar \u00e1 tilbo\u00f0sbla\u00f0i.\\n\\n0.4.3 Kr\u00f6fur um h\u00e6fi
  vegna t\u00e6knilegrar og faglegrar getu\\n\\nGer\u00f0ar eru eftirtaldar kr\u00f6fur
  um h\u00e6fi vegna t\u00e6knilegrar og faglegrar getu bj\u00f3\u00f0enda. Uppfylli
  bj\u00f3\u00f0endur ekki kr\u00f6fur \u00fatbo\u00f0sgagna um h\u00e6fi vegna t\u00e6knilegrar
  og faglegrar getu ver\u00f0ur tilbo\u00f0um \u00feeirra hafna\u00f0.\\n\\nKr\u00f6fur
  til h\u00e6fis bj\u00f3\u00f0anda eru sem h\u00e9r segir. Bj\u00f3\u00f0andi skal:\\n\\n*
  \u00e1 s\u00ed\u00f0ustu fj\u00f3rum \u00e1rum hafa m\u00e6lt fyrir, magnteki\u00f0,
  hanna\u00f0, skjalfest og sett upp net \u00fer\u00e1\u00f0lausra senda \u00e1 hi\u00f0
  minnsta tveimur vinnust\u00f6\u00f0um \u00fear sem fj\u00f6ldi notenda er 50 e\u00f0a
  fleiri.\\n* Starfsf\u00f3lk bj\u00f3\u00f0anda sem vinnur verkefni\u00f0 skal hafa
  \u00feekkingu og reynslu af hli\u00f0st\u00e6\u00f0um verkefnum og ger\u00f0 er
  krafa um \u00ed \u00fatbo\u00f0i \u00feessu, \u00fe.e. m\u00e6lingu, magnt\u00f6ku,
  h\u00f6nnun, skjalfestingu og uppsetningu \u00e1 \u00fer\u00e1\u00f0lausu neti.\\n*
  Bj\u00f3\u00f0andi skal tilgreina einn (1) x h\u00f6nnu\u00f0 \u00fer\u00e1\u00f0lauss
  nets sem skal vera me\u00f0 CCNP vottun.\\n* Bj\u00f3\u00f0andi skal tilgreina tv\u00e6r
  (2) x m\u00e6lingakonur/-menn sem skulu vera me\u00f0 Associate CCNA vottun.\\n*
  A\u00f0rir a\u00f0ilar sem vinna vi\u00f0 verki\u00f0 skulu hafa hi\u00f0 minnsta
  sveinspr\u00f3f \u00ed rafvirkjun og hi\u00f0 minnsta 3ja \u00e1ra reynslu af net-
  og rafl\u00f6gnum.\\n* Allt starfsf\u00f3lk bj\u00f3\u00f0anda sem kemur a\u00f0
  verkefninu skal vera me\u00f0 hreint sakavottor\u00f0 allan samningst\u00edmann.\\n\\nKaupandi
  \u00e1skilur s\u00e9r r\u00e9tt til a\u00f0 v\u00edsa fr\u00e1 tilbo\u00f0um bj\u00f3\u00f0enda
  sem hafa ekki sta\u00f0i\u00f0 sig vi\u00f0 framkv\u00e6md fyrri og/e\u00f0a yfirstandandi
  samninga vi\u00f0 kaupanda/opinbera kaupendur. Vi\u00f0 mat \u00e1 \u00fev\u00ed
  hvort framangreindri heimild ver\u00f0i beitt ver\u00f0ur m.a. liti\u00f0 til uppl\u00fdsinga
  og gagna kaupanda/opinberra kaupenda um erfi\u00f0 samskipti bj\u00f3\u00f0anda
  vi\u00f0 kaupanda og/e\u00f0a eftirlitsa\u00f0ila \u00e1 samningst\u00edma, \u00edtreku\u00f0
  e\u00f0a alvarlegt brot bj\u00f3\u00f0anda \u00e1 \u00e1kv\u00e6\u00f0um samnings
  a\u00f0ila vi\u00f0 framkv\u00e6md samnings, tafir o.fl.\\n\\nVi\u00f0 mat kaupanda
  \u00e1 h\u00e6fi og reynslu bj\u00f3\u00f0anda samkv\u00e6mt \u00feessu \u00e1kv\u00e6\u00f0i
  er kaupanda heimilt a\u00f0 taka tillit til h\u00e6fis og reynslu eigenda, stj\u00f3rnenda,
  lykilstarfsmanna, undirverktaka og s\u00e9rstakra r\u00e1\u00f0gjafa bj\u00f3\u00f0anda
  af tilteknu verkefni og leggja sl\u00edkt h\u00e6fi og reynslu a\u00f0 j\u00f6fnu
  vi\u00f0 h\u00e6fi og reynslu bj\u00f3\u00f0andans sj\u00e1lfs, \u00fe\u00f3tt reynsla
  vi\u00f0komandi a\u00f0ila hafi \u00e1unnist \u00ed \u00f6\u00f0ru fyrirt\u00e6ki
  en hj\u00e1 bj\u00f3\u00f0anda.\\n\\n0.5 Fylgig\u00f6gn bj\u00f3\u00f0anda me\u00f0
  tilbo\u00f0i\\n\\nEftirfarandi g\u00f6gn skulu fylgja me\u00f0 tilbo\u00f0i bj\u00f3\u00f0anda.\\n\\nA.
  Uppl\u00fdsingar um h\u00e6fi vegna starfsr\u00e9ttinda, sbr. kafla 0.4.1\\n\\n
  Bj\u00f3\u00f0andi skal skila me\u00f0 tilbo\u00f0i s\u00ednu afriti af skr\u00e1ningu
  \u00far fyrirt\u00e6kjaskr\u00e1 e\u00f0a samb\u00e6rilegu vottor\u00f0i fr\u00e1
  heimar\u00edki s\u00ednu.\\n\\nB. Uppl\u00fdsingar um h\u00e6fi vegna fj\u00e1rhagsst\u00f6\u00f0u,
  sbr. kafla 0.4.2\\n\\n Bj\u00f3\u00f0andi skal skila me\u00f0 tilbo\u00f0i s\u00ednu
  sta\u00f0festingu vi\u00f0komandi yfirvalds \u00e1 a\u00f0 bj\u00f3\u00f0andi s\u00e9
  \u00ed skilum me\u00f0 opinber gj\u00f6ld. Sta\u00f0festing skal vera dagsett innan
  30 daga fyrir opnun tilbo\u00f0a a\u00f0 \u00feeim degi me\u00f0t\u00f6ldum.\\n
  Bj\u00f3\u00f0andi skal skila me\u00f0 tilbo\u00f0i s\u00ednu sta\u00f0festingu
  fr\u00e1 l\u00edfeyrissj\u00f3\u00f0i/sj\u00f3\u00f0um \u00e1 a\u00f0 bj\u00f3\u00f0andi
  s\u00e9 \u00ed skilum me\u00f0 l\u00edfeyrissj\u00f3\u00f0si\u00f0gj\u00f6ld. Sta\u00f0festing
  skal vera dagsett innan 50 daga fyrir opnun tilbo\u00f0a a\u00f0 \u00feeim degi
  me\u00f0t\u00f6ldum.\\n Bj\u00f3\u00f0andi skal skila me\u00f0 tilbo\u00f0i s\u00ednu
  s\u00ed\u00f0ast ger\u00f0um \u00e1rsreikningi, eigi eldri en tveggja \u00e1ra.
  Framlag\u00f0ur \u00e1rsreikningur skal vera endursko\u00f0a\u00f0ur og \u00e1rita\u00f0ur
  af l\u00f6ggiltum endursko\u00f0anda \u00e1n fyrirvara um rekstrarh\u00e6fi bj\u00f3\u00f0anda.
  S\u00e9 s\u00ed\u00f0ast ger\u00f0ur \u00e1rsreikningur ekki endursko\u00f0a\u00f0ur
  af l\u00f6ggiltum endursko\u00f0anda er heimilt a\u00f0 leggja fram yfirl\u00fdsingu
  fr\u00e1 l\u00f6ggiltum endursko\u00f0anda um j\u00e1kv\u00e6\u00f0a eiginfj\u00e1rst\u00f6\u00f0u
  ums\u00e6kjanda. Sl\u00edk yfirl\u00fdsing skal mi\u00f0a vi\u00f0 st\u00f6\u00f0u
  ums\u00e6kjanda eigi fyrr en 10 d\u00f6gum fyrir opnunart\u00edma tilbo\u00f0a og
  eigi s\u00ed\u00f0ar en degi fyrir opnunart\u00edma tilbo\u00f0a.\\n\\nC. Uppl\u00fdsingar
  um h\u00e6fi vegna t\u00e6knilegrar og faglegrar getu, sbr. kafla 0.4.3\\n\\n Bj\u00f3\u00f0andi
  skal skila me\u00f0 tilbo\u00f0i s\u00ednu sta\u00f0festingu tveggja vi\u00f0skiptavina
  sinna \u00e1 \u00fev\u00ed a\u00f0 hann hafi unni\u00f0 og fullefnt samninga vegna
  tveggja verka \u00e1 s\u00ed\u00f0astli\u00f0num fj\u00f3rum \u00e1rum \u00fear
  sem fj\u00f6ldi notenda var 50 e\u00f0a fleiri.\\n Bj\u00f3\u00f0andi skal me\u00f0
  tilbo\u00f0i s\u00ednu senda sta\u00f0festingar \u00e1 ofangreindum Cisco gr\u00e1\u00f0um
  vegna h\u00f6nnu\u00f0ar \u00fer\u00e1\u00f0lauss nets og m\u00e6lingakvenna/-manna.\\n\\nD.
  Uppl\u00fdsingar er var\u00f0a verkefni\u00f0\\n\\n \u00datfyllt og undirrita\u00f0
  tilbo\u00f0sbla\u00f0 (sj\u00e1 tilbo\u00f0sb\u00f3k \u00ed Excel-skjali)\\n \u00datfyllt
  og undirritu\u00f0 tilbo\u00f0sskr\u00e1 (sj\u00e1 tilbo\u00f0sb\u00f3k \u00ed Excel-skjali)\\n
  \u00datfylltar og undirrita\u00f0ar yfirl\u00fdsingar bj\u00f3\u00f0anda (sj\u00e1
  tilbo\u00f0sb\u00f3k \u00ed Excel skjali)\\n Bj\u00f3\u00f0andi skal tilnefna og
  skila me\u00f0 tilbo\u00f0i s\u00ednu nafni verkefnastj\u00f3ra sem vinnur n\u00e1i\u00f0
  me\u00f0 verkefnastj\u00f3ra kaupanda og sk\u00f3lastj\u00f3rnendum \u00ed s\u00e9rhverjum
  sk\u00f3la (sj\u00e1 tilbo\u00f0sb\u00f3k \u00ed Excel skjali).\\n Bj\u00f3\u00f0andi
  skal tilnefna og skila me\u00f0 tilbo\u00f0i s\u00ednu s\u00e9rfr\u00e6\u00f0ing
  sem er \u00e1byrgur fyrir verkefninu \u00ed heild sinni.  \u00cd \u00feessu felst
  m.a. yfirumsj\u00f3n me\u00f0 sta\u00f0setning og uppsetningu \u00fer\u00e1\u00f0lausra
  senda, lagnavinna, tenging og fr\u00e1gangur sendanna (sj\u00e1 tilbo\u00f0sb\u00f3k
  \u00ed Excel skjali).\\n Bj\u00f3\u00f0andi skal tilnefna og skila me\u00f0 tilbo\u00f0i
  s\u00ednu nafni eins h\u00f6nnu\u00f0ar \u00fer\u00e1\u00f0lauss nets og tveggja
  m\u00e6lingakvenna/-manna, sbr. kafli 0.4.3 (sj\u00e1 tilbo\u00f0sb\u00f3k \u00ed
  excel skjali).\\n\\nEkki er tryggt a\u00f0 merktir li\u00f0ir s\u00e9u t\u00e6mandi
  listi yfir g\u00f6gn sem bj\u00f3\u00f0endum ber a\u00f0 skila og er r\u00edk skylda
  l\u00f6g\u00f0 \u00e1 bj\u00f3\u00f0endur a\u00f0 kynna s\u00e9r g\u00f6gnin r\u00e6kilega.\\n\\nKaupandi
  \u00e1skilur s\u00e9r r\u00e9tt til a\u00f0 kalla eftir uppl\u00fdsingum sem var\u00f0a
  verkefni\u00f0.\\n\\nL\u00f6g\u00f0 er r\u00edk \u00e1hersla \u00e1 a\u00f0 bj\u00f3\u00f0endur
  skili inn umbe\u00f0num g\u00f6gnum me\u00f0 tilbo\u00f0um s\u00ednum. Geri \u00feeir
  \u00fea\u00f0 ekki kann \u00fea\u00f0 a\u00f0 valda \u00f3gildingu tilbo\u00f0s.\\n\\n0.6
  Ger\u00f0, framsetning og afhending tilbo\u00f0s\\n\\nTilbo\u00f0 skal sett fram
  \u00ed tilbo\u00f0sb\u00f3k og skila\u00f0 \u00e1samt umbe\u00f0num g\u00f6gnum
  me\u00f0 rafr\u00e6num h\u00e6tti \u00e1 \u00fatbo\u00f0svef Reykjav\u00edkurborgar.
  Ekki er h\u00e6gt a\u00f0 skila inn tilbo\u00f0um eftir a\u00f0 tilbo\u00f0sfrestur
  er \u00fatrunninn.\\n\\nBj\u00f3\u00f0andi skal \u00ed tilbo\u00f0i s\u00ednu gera
  r\u00e1\u00f0 fyrir \u00f6llum kostna\u00f0i og gj\u00f6ldum sem hann skal bera,
  hva\u00f0a nafni sem \u00feau nefnast, sem hlj\u00f3tast af vegna verkefnisins eins
  og \u00fev\u00ed er l\u00fdst \u00ed \u00feessum \u00fatbo\u00f0sg\u00f6gnum. Tilbo\u00f0sfj\u00e1rh\u00e6\u00f0ir
  skulu tilgreindar \u00e1n vir\u00f0isaukaskatts.\\n\\nS\u00e9 \u00f3samr\u00e6mi
  \u00e1 milli tilbo\u00f0sskr\u00e1r og tilbo\u00f0sbla\u00f0s ver\u00f0a tilbo\u00f0
  lei\u00f0r\u00e9tt m.t.t. tilbo\u00f0sskr\u00e1r.\\n\\nKaupandi \u00e1skilur s\u00e9r
  r\u00e9tt til a\u00f0 hafna \u00feeim tilbo\u00f0um sem ekki eru sett fram samkv\u00e6mt
  \u00fatbo\u00f0sg\u00f6gnum \u00feessum.\\n\\nKaupandi mun ekki grei\u00f0a fyrir
  kostna\u00f0 bj\u00f3\u00f0anda sem hl\u00fdst vegna \u00fe\u00e1ttt\u00f6ku og
  tilbo\u00f0sger\u00f0ar \u00ed \u00feessu \u00fatbo\u00f0i.\\n\\nTilbo\u00f0um og
  umbe\u00f0num fylgig\u00f6gnum skal skila\u00f0 \u00e1 \u00edslensku. Heimilt er
  a\u00f0 skila uppl\u00fdsingum um Cisco gr\u00e1\u00f0ur \u00e1 ensku.\\n\\nInnkaupaskrifstofa
  m\u00e6lir me\u00f0 \u00fev\u00ed a\u00f0 bj\u00f3\u00f0andi kynni s\u00e9r \u00fatbo\u00f0svef
  Reykjav\u00edkurborgar. Innkaupaskrifstofa getur ekki tryggt a\u00f0 bj\u00f3\u00f0andi
  f\u00e1i a\u00f0sto\u00f0 vi\u00f0 notkun \u00e1 \u00fatbo\u00f0svef. Innkaupaskrifstofa
  mun leitast vi\u00f0 a\u00f0 a\u00f0sto\u00f0a bj\u00f3\u00f0anda vi\u00f0 notkun
  \u00e1 \u00fatbo\u00f0svef enda berist \u00f3sk \u00fear um me\u00f0 h\u00e6filegum
  fyrirvara e\u00f0a eigi s\u00ed\u00f0ar en tveimur virkum d\u00f6gum fyrir vi\u00f0komandi
  t\u00edmafrest.\\n\\n0.6.1 Tilbo\u00f0 \u00ed hluta\\n\\n\u00datbo\u00f0inu er ekki
  skipt \u00ed hluta.\\n\\n0.6.2 N\u00e1nar um tilbo\u00f0sb\u00f3k\\n\\n0.6.2.1 \u00de\u00e1ttur
  1 \u2013 \u201eM\u00e6linga\u00fe\u00e1ttur\\\"\\n\\nVerktaki skal, \u00ed s\u00e9rhverjum
  sk\u00f3la sem \u00fatbo\u00f0i\u00f0 tekur til, m\u00e6la fyrir \u00fer\u00e1\u00f0lausum
  sendum me\u00f0 vi\u00f0urkenndum b\u00fana\u00f0i og m\u00e6lia\u00f0fer\u00f0um,
  \u00fe.e. site survey sbr. kafli 220.127.116.11.\\n\\n\u00deessi \u00fe\u00e1ttur
  er tv\u00edskiptur, \u00fe.e. tveir verkli\u00f0ir.\\n\\n1) Annars vegar skal bj\u00f3\u00f0andi
  bj\u00f3\u00f0a t\u00edmaver\u00f0 \u00ed \u00e1\u00e6tlun \u00e1 fj\u00f6lda t\u00edma
  sem kaupandi telur a\u00f0 taki a\u00f0 m\u00e6la fyrir n\u00fdjum sendum (Site
  survey).  T\u00edma\u00e1\u00e6tlun kaupanda \u00e1 m\u00e6lingu fyrir n\u00fdjum
  sendum er, a\u00f0 me\u00f0altali, 12 vinnustundir \u00ed hverjum sk\u00f3la.  Sk\u00f3larnir
  eru 34 og \u00fev\u00ed er t\u00edma\u00e1\u00e6tlun kaupanda fyrir \u00feennan
  \u00fe\u00e1tt samtals 408 vinnustundir.\\n2) Hins vegar skal bj\u00f3\u00f0andi
  bj\u00f3\u00f0a t\u00edmaver\u00f0 \u00ed \u00e1\u00e6tlun \u00e1 fj\u00f6lda t\u00edma
  sem kaupandi telur a\u00f0 taki a\u00f0 hanna n\u00fdtt sendakerfi \u00ed sk\u00f3lunum.  T\u00edma\u00e1\u00e6tlun
  kaupanda fyrir h\u00f6nnun kerfis er 20 vinnustundir \u00ed hverjum sk\u00f3la,
  a\u00f0 me\u00f0altali.  Sk\u00f3larnir eru 34 og vinnustundir fyrir \u00feennan
  li\u00f0 \u00fev\u00ed samtals 680, sem bj\u00f3\u00f0anda er gert a\u00f0 bj\u00f3\u00f0a
  \u00ed.\\n\\nTilbo\u00f0sver\u00f0 (t\u00edmaver\u00f0) bj\u00f3\u00f0anda \u00ed
  hvorn li\u00f0 fyrir sig, margfalda\u00f0 me\u00f0 \u00e1\u00e6tlu\u00f0um vinnustundum
  \u00ed hvorum li\u00f0 fyrir sig, er l\u00e1gmarksgrei\u00f0sla kaupanda til bj\u00f3\u00f0anda.  \u00d3ski
  kaupandi \u00e1 verkt\u00edma eftir meiri vinnu \u00fe.e. fleiri vinnustundum bj\u00f3\u00f0anda
  \u00ed hvorn li\u00f0 fyrir sig \u2013 og bj\u00f3\u00f0andi sam\u00feykkir \u00fe\u00e1
  \u00f3sk, skal bo\u00f0i\u00f0 t\u00edmaver\u00f0 bj\u00f3\u00f0anda \u00ed tilbo\u00f0i
  standa.\\n\\nBj\u00f3\u00f0andi skal \u00ed tilbo\u00f0i s\u00ednu tilgreina hva\u00f0a
  b\u00fana\u00f0 og m\u00e6lia\u00f0fer\u00f0ir hann fyrirhugar a\u00f0 nota vi\u00f0
  m\u00e6lingar \u00ed sk\u00f3lunum.\\n\\n0.6.2.2 \u00de\u00e1ttur 2 \u2013 \u201eLagnavinnu\u00fe\u00e1ttur\\\"\\n\\n\u00deessi
  \u00fe\u00e1ttur er tv\u00edskiptur, \u00fe.e. tveir verkli\u00f0ir.\\n\\n1) Annars
  vegar skal bj\u00f3\u00f0andi bj\u00f3\u00f0a t\u00edmaver\u00f0 \u00ed vinnu vi\u00f0
  a\u00f0 leggja lagnir a\u00f0 1300 sendum \u00ed 34 grunnsk\u00f3lum.  \u00c1\u00e6tlun
  kaupanda fyrir \u00feennan li\u00f0 er tveir (2) t\u00edmar a\u00f0 me\u00f0altali
  fyrir hvern sendi e\u00f0a samtals 2600 vinnustundir fyrir alla sendana.\\n2) Hins
  vegar skal bj\u00f3\u00f0andi bj\u00f3\u00f0a t\u00edmaver\u00f0 \u00ed m\u00e6lingu
  og \u00fattekt/skjalfestingu eftir a\u00f0 sendar hafi veri\u00f0 settir upp og
  tengdir.  \u00c1\u00e6tlun kaupanda er a\u00f0 \u00fea\u00f0 taki \u00e1tta (8)
  t\u00edma, a\u00f0 me\u00f0altali, a\u00f0 fara yfir, \u00fe.e. m\u00e6la og skjalfesta
  m\u00e6lingar \u00ed hverjum sk\u00f3la.  Sk\u00f3larnir sem verkefni\u00f0 tekur
  til eru 34 og vinnustunda\u00e1\u00e6tlun kaupanda sem bj\u00f3\u00f0a skal \u00ed
  \u00fev\u00ed samtals 272.\\n\\nTilbo\u00f0sver\u00f0 (t\u00edmaver\u00f0) bj\u00f3\u00f0anda
  \u00ed hvorn li\u00f0 fyrir sig margfalda\u00f0 me\u00f0 \u00e1\u00e6tlu\u00f0um
  vinnustundum \u00ed hvorum li\u00f0 fyrir sig, er l\u00e1gmarksgrei\u00f0sla kaupanda
  til bj\u00f3\u00f0anda.  \u00d3ski kaupandi \u00e1 verkt\u00edma eftir meiri vinnu,
  fleiri vinnustundum bj\u00f3\u00f0anda \u00ed hvorn \u00fe\u00e1tt fyrir sig \u2013
  og bj\u00f3\u00f0andi sam\u00feykkir \u00fe\u00e1 \u00f3sk, skal bo\u00f0i\u00f0
  t\u00edmaver\u00f0 bj\u00f3\u00f0anda \u00ed tilbo\u00f0i standa.\\n\\n0.6.3 \u00ddmis
  atri\u00f0i:\\n\\nAthygli bj\u00f3\u00f0enda er vakin \u00e1 eftirfarandi atri\u00f0um:\\n\\n*
  A\u00f0 t\u00edmamagn \u00ed li\u00f0um 1.1 til 1.4 \u00ed Tilbo\u00f0sskr\u00e1
  er \u00e1\u00e6tlun kaupanda. Bj\u00f3\u00f0endum er gert a\u00f0 bj\u00f3\u00f0a
  t\u00edmaver\u00f0 \u00e1n vsk. \u00ed t\u00edmamagn/- \u00e1\u00e6tlun kaupanda
  og er \u00fea\u00f0 tilbo\u00f0 \u00ed t\u00edmaver\u00f0 bindandi fyrir bj\u00f3\u00f0anda.\\n*
  \u00c1st\u00e6\u00f0a \u00feess a\u00f0 kaupandi skiptir tilbo\u00f0s\u00fe\u00e1ttum
  upp \u00ed nokkra li\u00f0i, sbr. li\u00f0 1.1 til 1.4 \u00ed Tilbo\u00f0sskr\u00e1
  er a\u00f0 kaupandi vill gefa bj\u00f3\u00f0anda kost \u00e1 \u00fev\u00ed a\u00f0
  bj\u00f3\u00f0a mismunandi, og hugsanlega miskostna\u00f0arsamt, atgervi/t\u00e6knif\u00f3lk
  \u00ed hina \u00fdmsu tilbo\u00f0s\u00fe\u00e6tti \u00ed Tilbo\u00f0sskr\u00e1,
  a\u00f0 \u00fev\u00ed gefnu a\u00f0 t\u00e6knif\u00f3lk bj\u00f3\u00f0anda uppfylli
  \u00fe\u00e6r h\u00e6fiskr\u00f6fur sem ger\u00f0ar eru \u00ed hverjum tilbo\u00f0s\u00fe\u00e6tti
  fyrir sig. \u00dea\u00f0 er \u00fev\u00ed alfari\u00f0 \u00e1 valdi bj\u00f3\u00f0anda
  hvort hann \u00e1kve\u00f0ur a\u00f0 bj\u00f3\u00f0a me\u00f0alver\u00f0 \u00ed
  tvo e\u00f0a fleiri tilbo\u00f0s\u00fe\u00e6tti \u00ed Tilbo\u00f0sskr\u00e1.\\n*
  Verkefnast\u00fdring verkefnis skal vera innifalin \u00ed s\u00e9rhverjum tilbo\u00f0s\u00fe\u00e6tti,
  \u00fe.e. bj\u00f3\u00f0andi skal gera r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0
  tilbo\u00f0 hans \u00ed s\u00e9rhvern tilbo\u00f0sli\u00f0 s\u00e9 t\u00e6mandi
  fyrir \u00feann tilbo\u00f0s\u00fe\u00e1tt \u00ed Tilbo\u00f0sskr\u00e1.\\n\\nBj\u00f3\u00f0anda
  er \u00fev\u00ed ekki heimilt a\u00f0 b\u00e6ta vi\u00f0 li\u00f0 \u00ed Tilbo\u00f0sskr\u00e1
  hvorki fyrir verkefnastj\u00f3rnun n\u00e9 annan tilfallandi kostna\u00f0 bj\u00f3\u00f0anda
  \u00ed verkefninu.\\n\\n0.6.4 Fyrirvarar\\n\\nBj\u00f3\u00f0anda er \u00f3heimilt
  a\u00f0 gera hvers kyns fyrirvara vi\u00f0 tilbo\u00f0 sitt. Innihaldi tilbo\u00f0
  fyrirvara \u00e1n \u00feess a\u00f0 sl\u00edkt s\u00e9 heimila\u00f0 ver\u00f0ur
  vi\u00f0komandi tilbo\u00f0i hafna\u00f0.\\n\\n0.6.5 Fr\u00e1vikstilbo\u00f0\\n\\nFr\u00e1vikstilbo\u00f0
  eru \u00f3heimil.\\n\\n0.6.6 Afturk\u00f6llun tilbo\u00f0a\\n\\nBj\u00f3\u00f0andi
  getur afturkalla\u00f0 tilbo\u00f0 sitt \u00e1 \u00fatbo\u00f0svef Reykjav\u00edkurborgar
  \u00e1\u00f0ur en tilbo\u00f0sfrestur rennur \u00fat.\\n\\n0.7 Opnun tilbo\u00f0a\\n\\nTilbo\u00f0
  ver\u00f0a opnu\u00f0 eftir a\u00f0 tilbo\u00f0sfrestur rennur \u00fat.\\n\\nOpnun
  tilbo\u00f0a fer fram \u00e1 opnunarfundi me\u00f0 rafr\u00e6num h\u00e6tti \u00e1
  \u00fatbo\u00f0svef Reykjav\u00edkurborgar.\\n\\nOpnunarfundarger\u00f0 me\u00f0
  n\u00f6fnum bj\u00f3\u00f0enda \u00e1samt heildartilbo\u00f0sfj\u00e1rh\u00e6\u00f0
  ver\u00f0ur birt opinberlega \u00e1 vefs\u00ed\u00f0u Innkaupaskrifstofu eftir opnun
  tilbo\u00f0a.\\n\\nOpnunarfundur fer fram \u00ed Borgart\u00fani 12-14. Vegna a\u00f0st\u00e6\u00f0na
  \u00ed samf\u00e9laginu ver\u00f0ur bj\u00f3\u00f0endum ekki bo\u00f0i\u00f0 a\u00f0
  vera vi\u00f0staddir opnunarfund, sj\u00e1 m\u00e1 ni\u00f0urst\u00f6\u00f0u \u00ed
  fundarger\u00f0 opnunarfundar \u00e1 vefsl\u00f3\u00f0inni https://reykjavik.is/opnun-tilboda-2022/.\\n\\n0.8
  Forsendur fyrir vali tilbo\u00f0s\\n\\nSami\u00f0 ver\u00f0ur vi\u00f0 \u00feann
  bj\u00f3\u00f0anda sem \u00e1 hagst\u00e6\u00f0asta gilda tilbo\u00f0 \u00e1 grundvelli
  l\u00e6gsta heildartilbo\u00f0sver\u00f0s.\\n\\nTilbo\u00f0 bj\u00f3\u00f0anda telst
  \u00f3a\u00f0gengilegt ef bj\u00f3\u00f0andi b\u00fd\u00f0ur h\u00e6rra ver\u00f0
  en kostna\u00f0ar\u00e1\u00e6tlun kaupanda gerir r\u00e1\u00f0 fyrir. Kaupandi \u00e1skilur
  s\u00e9r \u00fe\u00f3 r\u00e9tt til a\u00f0 taka tilbo\u00f0i sem er h\u00e6rra
  en kostna\u00f0ar\u00e1\u00e6tlun eftir \u00fev\u00ed sem vi\u00f0 \u00e1.\\n\\nKaupandi
  \u00e1skilur s\u00e9r r\u00e9tt til a\u00f0 kalla eftir sk\u00fdringum, uppl\u00fdsingum
  e\u00f0a bo\u00f0a til sk\u00fdringarfundar me\u00f0 bj\u00f3\u00f0anda ef g\u00f6gn
  sem bj\u00f3\u00f0andi leggur fram vir\u00f0ast \u00f3fullkomin e\u00f0a ef tiltekin
  skj\u00f6l vantar, \u00feannig a\u00f0 kaupandi geti betur lagt mat \u00e1 tilbo\u00f0
  bj\u00f3\u00f0anda me\u00f0 tilliti til l\u00e1gmarkskrafna og h\u00e6fi bj\u00f3\u00f0anda.\\n\\n0.9
  \u00c1st\u00e6\u00f0ur til \u00fatilokunar vegna pers\u00f3nulegra a\u00f0st\u00e6\u00f0na\\n\\nS\u00e9
  kaupanda kunnugt um a\u00f0 bj\u00f3\u00f0andi hafi \u00e1 opnunardegi tilbo\u00f0s,
  veri\u00f0 sakfelldur me\u00f0 endanlegum d\u00f3mi fyrir spillingu, sviksemi, peninga\u00fev\u00e6tti,
  hry\u00f0juverk, brot sem tengjast hry\u00f0juverkastarfsemi, mansali e\u00f0a \u00fe\u00e1ttt\u00f6ku
  \u00ed skipul\u00f6g\u00f0um gl\u00e6pasamt\u00f6kum skal bj\u00f3\u00f0andi \u00fatiloka\u00f0ur
  fr\u00e1 ger\u00f0 opinbers samnings. Skylda til a\u00f0 \u00fatiloka bj\u00f3\u00f0anda
  gildir einnig \u00feegar einstaklingur, sem hefur veri\u00f0 sakfelldur me\u00f0
  endanlegum d\u00f3mi fyrir framangreind brot, er \u00ed stj\u00f3rn, framkv\u00e6mdastj\u00f3rn
  e\u00f0a eftirlitsstj\u00f3rn vi\u00f0komandi fyrirt\u00e6kis e\u00f0a hefur heimild
  til fyrirsvars, \u00e1kv\u00f6r\u00f0unart\u00f6ku e\u00f0a yfirr\u00e1\u00f0a \u00ed
  \u00fev\u00ed.\\n\\nHeimilt er a\u00f0 \u00fatiloka bj\u00f3\u00f0anda fr\u00e1
  samningum ef eitthva\u00f0 af tilvikum sem nefnd eru \u00ed 4. og 6. mgr. 68. gr.
  laga nr. 120/2016 eiga vi\u00f0 um hann.\\n\\nVi\u00f0 mat \u00e1 \u00fev\u00ed
  hvort skilyr\u00f0i 3., 4. og 6. mgr. 68. gr. laga um opinber innkaup eigi vi\u00f0
  um bj\u00f3\u00f0anda skal liti\u00f0 til \u00feess hvort um s\u00e9 a\u00f0 r\u00e6\u00f0a
  s\u00f6mu rekstrareiningu, me\u00f0 s\u00f6mu e\u00f0a n\u00e6r s\u00f6mu eigendur
  \u00ed s\u00f6mu e\u00f0a n\u00e6r s\u00f6mu atvinnustarfsemi \u00e1 sama marka\u00f0i,
  \u00e1n tillits til \u00feess hvort fyrirt\u00e6ki\u00f0 hafi skipt um kennit\u00f6lu
  e\u00f0a veri\u00f0 stofna\u00f0 a\u00f0 n\u00fdju. \u00cd \u00feessu skyni er heimilt
  a\u00f0 kanna vi\u00f0skiptas\u00f6gu stj\u00f3rnenda og helstu eigenda.\\n\\nEf
  k\u00f6nnun \u00e1 vi\u00f0skiptas\u00f6gu stj\u00f3rnenda og helstu eigenda bj\u00f3\u00f0anda
  lei\u00f0ir \u00ed lj\u00f3s atvik samanber ofangreind \u00e1kv\u00e6\u00f0i e\u00f0a
  samb\u00e6rileg atvik er var\u00f0a bj\u00f3\u00f0anda, stj\u00f3rnendur e\u00f0a
  eigendur hans, \u00e1skilur kaupandi s\u00e9r r\u00e9tt til a\u00f0 hafna tilbo\u00f0i
  hans, enda eigi \u00ed hlut sama rekstrareining, me\u00f0 s\u00f6mu e\u00f0a n\u00e6r
  s\u00f6mu eigendur (e\u00f0a skyldmenni e\u00f0a tengdaf\u00f3lk fyrri eigenda),
  \u00ed s\u00f6mu e\u00f0a n\u00e6r s\u00f6mu atvinnustarfsemi, \u00e1 sama marka\u00f0i
  en me\u00f0 n\u00fdja kennit\u00f6lu.\\n\\n0.10 Sam\u00feykki tilbo\u00f0s og samningur\\n\\nTilbo\u00f0
  ver\u00f0ur sam\u00feykkt skriflega innan gildist\u00edma \u00feess og telst \u00fe\u00e1
  kominn \u00e1 bindandi samningur \u00e1 grundvelli \u00fatbo\u00f0sgagna og tilbo\u00f0s
  bj\u00f3\u00f0anda.\\n\\n1. Samningsskilm\u00e1lar\\n\\n\u00cd samningsskilm\u00e1lum
  er kve\u00f0i\u00f0 \u00e1 um skyldur og r\u00e9ttindi samningsa\u00f0ila \u00feegar
  tilbo\u00f0 hefur veri\u00f0 endanlega sam\u00feykkt og eftir a\u00f0 kominn er
  \u00e1 bindandi samningur a\u00f0 loknu innkaupaferli. S\u00e1 a\u00f0ili sem kaupandi
  semur vi\u00f0 a\u00f0 loknu innkaupaferli er h\u00e9r eftir kalla\u00f0ur \u201everktaki\\\"
  og/e\u00f0a \u201ebj\u00f3\u00f0andi\\\".\\n\\n1.1 Ver\u00f0lagsgrundv\u00f6llur\\n\\nTilbo\u00f0
  skal leggja fram \u00ed \u00edslenskum kr\u00f3num.  \u00d6ll tilbo\u00f0sver\u00f0
  skulu sett fram \u00e1n vir\u00f0isaukaskatts.\\n\\nTilbo\u00f0sver\u00f0 skal vera
  fast \u00fat samningst\u00edmann.\\n\\n1.2 Grei\u00f0slur\\n\\nKaupandi grei\u00f0ir
  verktaka m\u00e1na\u00f0arlega samkv\u00e6mt framvindu verkefnisins. N\u00e1nar
  tilteki\u00f0 a\u00f0 lokinni uppsetningu, tengingu, \u00fattekt og skjalfestingu
  \u00e1 virkni senda skal verktaki gjaldf\u00e6ra kaupanda \u00ed hlutfalli vi\u00f0
  fj\u00f6lda senda \u00ed \u00feeim tveimur e\u00f0a fleiri sk\u00f3lum sem loki\u00f0
  hefur veri\u00f0 vi\u00f0 \u00ed m\u00e1nu\u00f0inum. Verktaki skal ekki gjaldf\u00e6ra
  kaupanda fyrir f\u00e6rri en tvo fullkl\u00e1ra\u00f0a sk\u00f3la.\\n\\nReykjav\u00edkurborg
  \u00e1skilur s\u00e9r 30 daga grei\u00f0slufrest mi\u00f0a\u00f0 vi\u00f0 dagsetningu
  reiknings. Ef reikningur er ekki sendur samkv\u00e6mt forskrift e\u00f0a ber ekki
  me\u00f0 s\u00e9r n\u00e6gar uppl\u00fdsingar til a\u00f0 sta\u00f0festa r\u00e9ttm\u00e6ti
  hans gildir ekki fyrirheit um grei\u00f0slufrest.\\n\\n\u00de\u00f3 Reykjav\u00edkurborg
  grei\u00f0i reikninga samkv\u00e6mt gjaldskr\u00e1 sem ekki er sta\u00f0fest af
  kaupanda felst ekki \u00ed \u00fev\u00ed vi\u00f0urkenning \u00e1 n\u00fdrri gjaldskr\u00e1.
  Komi sl\u00edkt \u00ed lj\u00f3s \u00e1skilur Reykjav\u00edkurborg s\u00e9r r\u00e9tt
  til skuldaj\u00f6fnunar \u00e1 grundvelli gildandi gjaldskr\u00e1r.\\n\\nSeljendur
  sem vilja grennslast fyrir um st\u00f6\u00f0u reikninga sinna hj\u00e1 Reykjav\u00edkurborg
  sn\u00fai s\u00e9r til Fj\u00e1rm\u00e1la- og \u00e1h\u00e6ttust\u00fdringarsvi\u00f0s
  \u00ed s\u00edma 411-1111 e\u00f0a t\u00f6lvup\u00f3stfang: firstname.lastname@example.org.\\n\\n1.3
  Rafr\u00e6nir reikningar\\n\\nVerktaki skal senda reikning vegna verkefnisins eftir
  a\u00f0 vara, \u00fej\u00f3nusta e\u00f0a verk hefur veri\u00f0 afhent og sam\u00feykkt
  af kaupanda.\\n\\nEkki skulu koma fram \u00e1 reikningi gj\u00f6ld sem ekki tengjast
  seldri v\u00f6ru e\u00f0a \u00fej\u00f3nustu, s.s. se\u00f0il- e\u00f0a \u00fej\u00f3nustugj\u00f6ld.\\n\\nAllir
  reikningar til Reykjav\u00edkurborgar skulu vera \u00e1 rafr\u00e6nu formi. Skulu
  \u00feeir fylgja gildandi t\u00e6kniforskriftum fr\u00e1 Sta\u00f0lar\u00e1\u00f0i
  \u00cdslands fyrir rafr\u00e6na reikninga.\\n\\nUppl\u00fdsingar er var\u00f0a rafr\u00e6na
  reikninga m\u00e1 n\u00e1lgast \u00e1 vef Reykjav\u00edkurborgar: http://reykjavik.is/sjalfvirkirrafraenir-reikningar.\\n\\nReikningur
  skal \u00e1vallt innihalda eftirfarandi uppl\u00fdsingar:\\n\\n* Kostna\u00f0arsta\u00f0ur/deild:\\n*
  Kennitala kaupanda: 570480-0149 Reykjav\u00edkurborg \u2013 Eignasj\u00f3\u00f0ur\\n*
  Verkn\u00famer: 207529\\n\\n80021\\n\\n* Verk\u00fe\u00e1ttur:\\nU-NETORYGGI\\n*
  Sundurli\u00f0un \u00e1 v\u00f6ru og/e\u00f0a \u00fej\u00f3nustu, magn og eining\\n*
  N\u00famer samnings/\u00fatbo\u00f0sn\u00famer:\\n\\n15641\\n\\n* Listaver\u00f0
  \u00e1n vsk., afsl\u00e1ttarpr\u00f3senta og afsl\u00e1ttarver\u00f0 \u00e1n vsk.\\n*
  A\u00f0rar l\u00f6gbundnar uppl\u00fdsingar\\n* UNSPSC n\u00famer:\\n\\n72141117\\n\\nRafr\u00e6na
  reikninga skal senda \u00feann dag sem dagsetning reiknings segir til um.\\n\\nReykjav\u00edkurborg
  \u00e1skilur s\u00e9r r\u00e9tt til a\u00f0 hafna reikningum sem uppfylla ekki framangreind
  skilyr\u00f0i.\\n\\nEf n\u00e1nari uppl\u00fdsinga er \u00f3ska\u00f0 vegna rafr\u00e6nna
  reikninga m\u00e1 hafa samband vi\u00f0 Agresso s\u00e9rfr\u00e6\u00f0inga Fj\u00e1rm\u00e1la-
  og \u00c1h\u00e6ttust\u00fdringarsvi\u00f0s Reykjav\u00edkurborgar \u00ed s\u00edma
  411-1111 e\u00f0a senda fyrirspurn \u00e1 netfangi\u00f0: email@example.com.\\n\\nBj\u00f3\u00f0endur
  skulu gera r\u00e1\u00f0 fyrir \u00f6llum kostna\u00f0i vegna \u00fatg\u00e1fu og
  sendingu rafr\u00e6nna reikninga \u00ed tilbo\u00f0sver\u00f0i s\u00ednu, \u00fe.m.t.
  sundurli\u00f0un reikninga.\\n\\n1.4 UNSPSC v\u00f6ruflokkun\\n\\nUNSPSC (United
  Nations Standard Product and Services Code\u00ae) er al\u00fej\u00f3\u00f0legt flokkunarkerfi
  fyrir v\u00f6rur og \u00fej\u00f3nustu. UNSPSC flokkunin hentar fyrir allar ger\u00f0ir
  framlei\u00f0sluvara og \u00fej\u00f3nustu \u00ed \u00f6llum greinum atvinnul\u00edfs.
  UNSPSC sta\u00f0allinn er opinn sta\u00f0all og er a\u00f0gengilegur a\u00f0ilum
  \u00e1n kostna\u00f0ar.\\n\\nUppbygging UNSPSC v\u00f6ruflokkunarsta\u00f0als sameinu\u00f0u
  \u00fej\u00f3\u00f0anna:\\n\\n* V\u00f6ruh\u00f3pur (Segment):  10000000\\n\\nReykjav\u00edkurborg
  gerir kr\u00f6fu til verktaka a\u00f0 \u00ed \u00f6llum l\u00ednum rafr\u00e6ns
  reiknings komi fram UNSPSC n\u00famer samkv\u00e6mt uppl\u00fdsingum um rafr\u00e6na
  reikninga.\\n\\nN\u00e1nari uppl\u00fdsingar um UNSPSC flokkunarkerfi\u00f0 m\u00e1
  n\u00e1lgast \u00e1 https://www.unspsc.org/\\n\\n.\\n\\n1.5 Samskipti \u00e1 samningst\u00edma
  og m\u00f6gulegar breytingar \u00e1 samningi\\n\\n\u00deegar kominn er \u00e1 samningur
  mun kaupandi annast samskipti vi\u00f0 verktaka \u00e1 samningst\u00edmanum.\\n\\nKaupandi
  og verktaki skulu halda st\u00f6\u00f0u- og vinnufund um framvindu verkefnisins
  \u00ed lok uppsetningar \u00ed hverjum sk\u00f3la. A\u00f0rir fundir um framvindu
  verksins skulu haldnir eftir \u00fe\u00f6rfum. Verktaki skal skila fundarger\u00f0
  og halda verkefnalista \u00ed kj\u00f6lfar sl\u00edkra funda. Ekki ver\u00f0ur greitt
  s\u00e9rstaklega fyrir fundi um framvindu verkefnisins.\\n\\nKaupandi tilnefnir
  fulltr\u00faa sinn sem verktaki skal vera \u00ed samskiptum vi\u00f0 var\u00f0andi
  verkefni\u00f0. Verktaki skal vera \u00ed g\u00f3\u00f0um samskiptum vi\u00f0 sk\u00f3lastj\u00f3rnendur
  \u00e1 hverjum sta\u00f0 og sj\u00e1 til \u00feess a\u00f0 \u00feeir s\u00e9u uppl\u00fdstir
  um m\u00e6lingar- og uppsetningarvinnu me\u00f0 hi\u00f0 minnsta viku fyrirvara
  \u00e1\u00f0ur en verktaki m\u00e6tir \u00e1 sv\u00e6\u00f0i\u00f0.\\n\\nKaupanda
  er heimilt a\u00f0 \u00f3ska eftir minnih\u00e1ttar breytingum \u00e1 verkefninu
  og skulu a\u00f0ilar semja s\u00e9rstaklega um breytingar og grei\u00f0slur vegna
  \u00feeirra \u00e1\u00f0ur en \u00fe\u00e6r koma til framkv\u00e6mda.  \u00c1 sama
  h\u00e1tt er verktaka heimilt a\u00f0 \u00f3ska breytinga, svo fremi a\u00f0 \u00fe\u00e6r
  hafi engin \u00e1hrif \u00e1 starfsemi kaupanda. Allar \u00f3skir um breytingar,
  framhaldskaup, aukaverk e\u00f0a ni\u00f0urfellingu \u00e1 kaupum, skulu a\u00f0ilar
  tilkynna skriflega me\u00f0 h\u00e6filegum fyrirvara \u00ed samr\u00e6mi vi\u00f0
  e\u00f0li verkefnisins.\\n\\nSamningur um breytingar, framhaldskaup, aukaverk e\u00f0a
  ni\u00f0urfellingu \u00e1 kaupum skal vera skriflegur og undirrita\u00f0ur af samningsa\u00f0ilum,
  sj\u00e1 n\u00e1nar kafla 1.22 h\u00e9r fyrir ne\u00f0an.\\n\\n1.6 Afhending og
  afhendingarskilm\u00e1lar\\n\\nH\u00f6nnu\u00f0ur skal \u00ed upphafi verks skila
  af s\u00e9r till\u00f6gum og t\u00edmasettri \u00e1\u00e6tlun sem s\u00fdnir dr\u00f6g
  a\u00f0 \u00fev\u00ed hvernig sta\u00f0i\u00f0 ver\u00f0i a\u00f0 framkv\u00e6md
  verkefnisins innan tilsettra t\u00edmamarka, sj\u00e1 n\u00e1nar kafla 1.17 og 1.20
  h\u00e9r fyrir ne\u00f0an.\\n\\nGert er r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0
  verktaki lj\u00faki vinnu vi\u00f0 tvo sk\u00f3la \u00e1 m\u00e1nu\u00f0i, \u00fe.e.
  a\u00f0 m\u00e6la fyrir og setja upp fullb\u00fai\u00f0 \u00fer\u00e1\u00f0laust
  netkerfi \u00ed 34 sk\u00f3lum og verkefni\u00f0 allt taki \u00fev\u00ed 17 m\u00e1nu\u00f0i.
  Fj\u00f6ldi sk\u00f3la g\u00e6ti \u00fe\u00f3 hnikast til e\u00f0a fr\u00e1 um nokkra
  sk\u00f3la \u00e1 samningst\u00edma vegna vi\u00f0halds og breytinga \u00e1 sk\u00f3lafyrirkomulagi.\\n\\n1.7\\n\\nTr\u00fana\u00f0aryfirl\u00fdsingar
  og \u00feagnarskylda\\n\\nAllir starfsmenn verktaka skulu skrifa undir tr\u00fana\u00f0aryfirl\u00fdsingu
  verktaka \u00e1\u00f0ur en \u00feeir hefja st\u00f6rf.\\n\\nAllir starfsmenn verktaka
  eru bundnir \u00feagnarskyldu gagnvart Reykjav\u00edkurborg. \u00cd starfi fyrir
  Reykjav\u00edkurborg getur starfsma\u00f0ur verktaka fengi\u00f0 vitneskju um tr\u00fana\u00f0aruppl\u00fdsingar
  og gilda s\u00f6mu reglur um me\u00f0fer\u00f0 sl\u00edkra uppl\u00fdsinga fyrir
  \u00fe\u00e1 eins og starfsmenn Reykjav\u00edkurborgar. \u00deagnarskyldan heldur
  \u00fe\u00f3 vi\u00f0komandi l\u00e1ti af st\u00f6rfum hj\u00e1 verktaka. Sj\u00e1
  n\u00e1nar Fylgiskjal 4: \u201eTr\u00fana\u00f0aryfirl\u00fdsing verktaka vegna
  vinnu \u00ed sk\u00f3lum\\\".\\n\\nVerktaki skal \u00e1byrgjast a\u00f0 starfsmenn
  hans g\u00e6ti fyllsta tr\u00fana\u00f0ar um hva\u00f0 eina sem \u00feeir ver\u00f0a
  \u00e1skynja \u00ed st\u00f6rfum s\u00ednum \u00e1 starfsst\u00f6\u00f0vum Reykjav\u00edkurborgar
  og getur var\u00f0a\u00f0 hagsmuni skj\u00f3lst\u00e6\u00f0inga, vi\u00f0skiptavina
  e\u00f0a starfsemi sveitaf\u00e9lagsins. \u00deeim er skylt a\u00f0 g\u00e6ta \u00feagm\u00e6lsku
  um atri\u00f0i sem \u00feeir f\u00e1 vitneskju um og leynt skulu fara samkv\u00e6mt
  l\u00f6gum, fyrirm\u00e6lum Reykjav\u00edkurborgar e\u00f0a e\u00f0li m\u00e1ls.\\n\\n\u00deeim
  er \u00f3heimilt a\u00f0 afla s\u00e9r e\u00f0a reyna a\u00f0 afla s\u00e9r uppl\u00fdsinga
  me\u00f0 \u00f3tilhl\u00fd\u00f0ilegum h\u00e6tti um, e\u00f0a umr\u00e1\u00f0a
  yfir, atvinnu- e\u00f0a rekstraruppl\u00fdsingum, sem sn\u00faa a\u00f0 innvi\u00f0um
  Reykjav\u00edkurborgar, me\u00f0al annars hugb\u00fana\u00f0i, g\u00f6gnum, h\u00f6gun
  og ger\u00f0 v\u00e9lb\u00fana\u00f0ar.\\n\\n\u00d6ll vitneskja um starfsmenn, skj\u00f3lst\u00e6\u00f0inga,
  a\u00f0st\u00e6\u00f0ur, sj\u00fakd\u00f3ma \u00feeirra og \u00farr\u00e6\u00f0i,
  er e\u00f0li m\u00e1ls samkv\u00e6mt bundin \u00feagnarskyldu samkv\u00e6mt l\u00f6gum.\\n\\nBrot
  \u00e1 tr\u00fana\u00f0i getur leitt til lagalegra a\u00f0ger\u00f0a af h\u00e1lfu
  Reykjav\u00edkurborgar.\\n\\n1.8 F\u00e9v\u00edti\\n\\nDragist afhending umfram
  umsaminn skiladag, sbr. kafla 1.6, af ors\u00f6kum sem ekki ver\u00f0a raktar til
  kaupanda, \u00fe\u00e1 getur kaupandi krafi\u00f0 verktaka um f\u00e9v\u00edti 0,2%
  af heildarsamningsfj\u00e1rh\u00e6\u00f0 vinnuli\u00f0a sbr. 1.1 \u2013 1.4 \u00ed
  Tilbo\u00f0sskr\u00e1 fyrir hvern byrja\u00f0an almanaksdag sem afhending dregst
  umfram umsaminn afhendingart\u00edma. \u00de\u00f3 skal h\u00e1mark f\u00e9v\u00edta
  vera sem svarar 5% af heildarsamningsfj\u00e1rh\u00e6\u00f0 vinnuli\u00f0a. S\u00e9
  h\u00e1marki f\u00e9v\u00edta n\u00e1\u00f0 telst \u00fea\u00f0 veruleg vanefnd
  \u00e1 samningi. Heimilt er a\u00f0 skuldajafna af heildarsamningsfj\u00e1rh\u00e6\u00f0
  hafi grei\u00f0slur vegna f\u00e9v\u00edtis ekki skila\u00f0 s\u00e9r.\\n\\nHven\u00e6r
  sem er \u00e1 samningst\u00edma skal verktaki geta s\u00fdnt kaupanda fram \u00e1
  a\u00f0 \u00f6ll r\u00e9ttindi og skyldur gagnvart starfsm\u00f6nnum s\u00e9u uppfyllt
  \u00ed samr\u00e6mi vi\u00f0 kafla 1.14. Verktaki sam\u00feykkir a\u00f0 ef hann
  getur ekki framv\u00edsa\u00f0 g\u00f6gnum e\u00f0a s\u00fdnt eftirlitsmanni \u00fej\u00f3nustunnar
  fram \u00e1 a\u00f0 samningsskyldur s\u00e9u uppfylltar innan fimm daga fr\u00e1
  \u00fev\u00ed a\u00f0 \u00f3sk um sl\u00edkt er borin fram af kaupanda getur kaupandi
  beitt f\u00e9v\u00edtum sem nemur 0,5% af heildarsamningsfj\u00e1rh\u00e6\u00f0
  fyrir hvern dag sem umbe\u00f0nar uppl\u00fdsingar skortir e\u00f0a sagt upp samningi
  \u00e1n frekari fyrirvara.\\n\\nVer\u00f0i verktaki uppv\u00eds a\u00f0 brotum gegn
  ke\u00f0ju\u00e1byrg\u00f0 sinni samkv\u00e6mt kafla 1.14 skal kaupandi beita sektar\u00e1kv\u00e6\u00f0um
  \u00fear til verktaki hefur r\u00e9tt hlut allra starfsmanna sem um r\u00e6\u00f0ir.
  Kaupandi skal \u00ed \u00feeim tilfellum beita f\u00e9v\u00edti sem nemur 0,5% af
  heildarsamningsfj\u00e1rh\u00e6\u00f0 fyrir hvern dag sem \u00e1kv\u00e6\u00f0i
  ke\u00f0ju\u00e1byrg\u00f0ar eru brotin e\u00f0a sagt upp samningi \u00e1n frekari
  fyrirvara.\\n\\n\u00c1kv\u00e6\u00f0i \u00feessa kafla skulu ekki takmarka kaupanda
  til a\u00f0 s\u00e6kja frekari b\u00f3ta s\u00e9 \u00feess \u00fe\u00f6rf vegna
  dr\u00e1tta \u00e1 afhendingu skv. l\u00f6gbundnum vanefndar\u00farr\u00e6\u00f0um
  gangi \u00feau lengra en \u00e1kv\u00e6\u00f0i \u00feetta.\\n\\n1.9 \u00d3vi\u00f0r\u00e1\u00f0anleg
  ytri atvik\\n\\nKomi upp \u00f3vi\u00f0r\u00e1\u00f0anleg sta\u00f0a vegna \u00f3fyrirs\u00e9\u00f0ra
  orsaka (force majeure), t.d. vi\u00f0skiptahamlana, flutningsska\u00f0a, eldsvo\u00f0a,
  fars\u00f3ttar, verkfalla, n\u00e1tt\u00faruhamfara, str\u00ed\u00f0s\u00e1stands,
  hry\u00f0juverka, h\u00f3pslysa, deilna \u00e1 vinnumarka\u00f0i, fyrirm\u00e6la
  stj\u00f3rnvalda e\u00f0a truflunar \u00e1 fjarskiptum e\u00f0a orkuveitum skal
  verktaki e\u00f0a kaupandi tilkynna eins flj\u00f3tt og vi\u00f0 ver\u00f0ur komist
  um sl\u00edkar a\u00f0st\u00e6\u00f0ur og skilgreina \u00e1 hva\u00f0a h\u00e1tt
  \u00fea\u00f0 hefur \u00e1hrif \u00e1 samningsskyldur \u00feeirra. S\u00e9u einhverjar
  af ofant\u00f6ldum a\u00f0st\u00e6\u00f0um fyrir hendi skal ekki beita vanefndar\u00farr\u00e6\u00f0um
  ef verktaka e\u00f0a kaupanda er \u00f3kleift a\u00f0 uppfylla samningsskyldur s\u00ednar
  enda hafi sl\u00edkar a\u00f0st\u00e6\u00f0ur veri\u00f0 tilkomnar eftir gildist\u00f6ku
  samnings og ekki fyrirsj\u00e1anlegar \u00ed a\u00f0draganda samnings.\\n\\n1.10
  \u00c1byrg\u00f0 og tryggingar\\n\\nVerktaki skal vera me\u00f0 allar l\u00f6gbo\u00f0nar
  tryggingar \u00ed gildi sem eiga vi\u00f0 um hans starfssemi.\\n\\n1.11 Misr\u00e6mi
  \u00ed g\u00f6gnum\\n\\nL\u00f6g\u00f0 er r\u00edk skylda \u00e1 bj\u00f3\u00f0endur
  a\u00f0 kynna s\u00e9r g\u00f6gnin r\u00e6kilega. Ef verktaki ver\u00f0ur var vi\u00f0
  \u00f3samr\u00e6mi \u00ed \u00fatbo\u00f0sg\u00f6gnum eftir a\u00f0 samningur er
  kominn \u00e1 skal verktaki tafarlaust tilkynna kaupanda \u00fea\u00f0 til \u00farskur\u00f0ar.
  Komi fram villur \u00ed \u00fatbo\u00f0sg\u00f6gnum, er verktaki eftir sem \u00e1\u00f0ur
  bundinn af tilbo\u00f0i s\u00ednu. Vanr\u00e6ki verktaki a\u00f0 tilkynna sl\u00edka
  villu \u00e1\u00f0ur en vi\u00f0komandi vara er afhent fellur r\u00e9ttur verktaka
  til b\u00f3ta ni\u00f0ur. Kaupandi \u00e1 r\u00e9tt \u00e1 l\u00e6kkun samningsupph\u00e6\u00f0ar,
  ef villan lei\u00f0ir til minni kostna\u00f0ar. Semja skal eins flj\u00f3tt og unnt
  er um \u00fe\u00e6r breytingar \u00e1 samningsupph\u00e6\u00f0 sem lei\u00f0a af
  framans\u00f6g\u00f0u.\\n\\n1.12 Framsal r\u00e9ttinda\\n\\nVerktaka er \u00f3heimilt
  a\u00f0 framselja e\u00f0a ve\u00f0setja r\u00e9tt sinn samkv\u00e6mt samningi sem
  ger\u00f0ur ver\u00f0ur \u00ed framhaldi af \u00fatbo\u00f0i \u00feessu nema me\u00f0
  skriflegu sam\u00feykki kaupanda.\\n\\nVerktaka er \u00f3heimilt a\u00f0 binda kaupanda
  \u00e1 nokkurn h\u00e1tt af l\u00e1num e\u00f0a \u00f6\u00f0rum skuldbindingum sem
  hann kann a\u00f0 taka \u00e1 sig \u00e1 samningst\u00edmanum. Einnig er verktaka
  \u00f3heimilt, \u00e1n s\u00e9rstaks sam\u00feykkis kaupanda, a\u00f0 ve\u00f0setja
  efni, t\u00e6ki, v\u00e9lar e\u00f0a annan \u00feann b\u00fana\u00f0 sem ver\u00f0ur
  hluti af verkefninu og kaupandi hefur greitt fyrir.\\n\\nVara sem kaupandi hefur
  fengi\u00f0 reikning fyrir m\u00e1 ekki vera me\u00f0 eignarr\u00e9ttarfyrirvara
  fr\u00e1 verktaka v\u00f6runnar, \u00e1n s\u00e9rstaks sam\u00feykkis kaupanda.\\n\\n1.13
  Skuldskeyting - undirverktaka\\n\\nVerktaka er heimilt a\u00f0 n\u00fdta s\u00e9r
  vinnu undirverktaka og ber \u00fe\u00e1 jafnframt \u00e1byrg\u00f0 \u00e1 starfsf\u00f3lki
  undirverktaka og framlagi \u00feeirra verkefnisins sem um eigi\u00f0 starfsf\u00f3lk
  v\u00e6ri a\u00f0 r\u00e6\u00f0a.\\n\\nVerktaka er ekki heimilt a\u00f0 skipta \u00fat
  \u00feeim a\u00f0ilum sem hann tilgreinir til verkefnisins nema me\u00f0 sam\u00feykki
  kaupanda. Sam\u00feykkir kaupandi sl\u00edkt er verktaki skuldbundinn a\u00f0 setja
  inn hi\u00f0 minnsta jafn h\u00e6fan a\u00f0ila \u00ed sta\u00f0 \u00feess a\u00f0ila
  sem fer \u00far verkinu.\\n\\n1.14 Laun, starfskj\u00f6r og ke\u00f0ju\u00e1byrg\u00f0\\n\\nVerktaki
  skal tryggja og bera \u00e1byrg\u00f0 \u00e1 a\u00f0 allir starfsmenn, hvort sem
  um r\u00e6\u00f0ir starfsmenn samningsa\u00f0ila, undirverktaka e\u00f0a starfsmannaleigu,
  f\u00e1i laun, starfskj\u00f6r, sj\u00fakra- og slysatryggingar og \u00f6nnur r\u00e9ttindi
  \u00ed samr\u00e6mi vi\u00f0 gildandi kjarasamninga og l\u00f6g hverju sinni. Einnig
  skal verktaki tryggja me\u00f0 virku eftirliti a\u00f0 starfsmenn undirverktaka
  og starfsmannaleigu f\u00e1i vi\u00f0eigandi laun og r\u00e9ttindi \u00ed samr\u00e6mi
  vi\u00f0 framangreint.\\n\\n\u00de\u00e1 skal kaupanda heimilt a\u00f0 grei\u00f0a
  vangoldnar grei\u00f0slur til undirverktaka og annarra starfsmanna, sem svarar til
  launatengdra grei\u00f0slna, \u00e1 kostna\u00f0 verktaka standi hann ekki \u00ed
  skilum me\u00f0 sl\u00edkar grei\u00f0slur sbr. 42. gr. Innkaupareglna Reykjav\u00edkurborgar.\\n\\nEfni
  verktaki ekki samningsskyldur s\u00ednar \u00ed samr\u00e6mi vi\u00f0 \u00e1kv\u00e6\u00f0i
  \u00feessa kafla er kaupanda heimilt a\u00f0 beita \u00e1kv\u00e6\u00f0um sem fram
  koma \u00ed kafla 1.8 og \u00ed kafla 1.17.\\n\\n1.15 Pers\u00f3nuvernd\\n\\nReykjav\u00edkurborg
  hefur \u00fea\u00f0 a\u00f0 markmi\u00f0i a\u00f0 tryggja \u00ed hv\u00edvetna \u00e1rei\u00f0anleika,
  tr\u00fana\u00f0 og \u00f6ryggi allra pers\u00f3nuuppl\u00fdsinga sem unni\u00f0
  er me\u00f0 \u00e1 vegum Reykjav\u00edkurborgar. Reykjav\u00edkurborg hefur \u00fev\u00ed
  sett s\u00e9r pers\u00f3nuverndarstefnu \u00ed samr\u00e6mi vi\u00f0 \u00e1kv\u00e6\u00f0i
  laga nr. 90/2018 um pers\u00f3nuvernd og vinnslu pers\u00f3nuuppl\u00fdsinga (pers\u00f3nuverndarlaga).
  L\u00f6gin eru bygg\u00f0 \u00e1 regluger\u00f0 Evr\u00f3pu\u00feingsins og r\u00e1\u00f0sins
  (ESB) 2016/679 fr\u00e1 27. apr\u00edl 2016 um vernd einstaklinga \u00ed tengslum
  vi\u00f0 vinnslu pers\u00f3nuuppl\u00fdsinga og um frj\u00e1lsa mi\u00f0lun sl\u00edkra
  uppl\u00fdsinga (almenna pers\u00f3nuverndarregluger\u00f0in) e\u00f0a \u201eGDPR\\\".\\n\\n\u00cd
  \u00fatbo\u00f0sg\u00f6gnum \u00feessum er ekki gert r\u00e1\u00f0 fyrir a\u00f0
  bj\u00f3\u00f0endum ver\u00f0i falin vinnsla pers\u00f3nuuppl\u00fdsinga \u00e1
  vegum Reykjav\u00edkurborgar sem \u00e1byrg\u00f0ara\u00f0ila \u00ed skilningi 7.
  tl. 3. gr. pers\u00f3nuverndarlaga nr. 90/2018 \u00e1 samningst\u00edmanum. Komi
  upp s\u00ed\u00f0ar \u00e1 gildist\u00edma samnings a\u00f0 sl\u00edk vinnsla pers\u00f3nuuppl\u00fdsinga
  ver\u00f0i \u00fe\u00f6rf skal engin vinnsla fara fram af h\u00e1lfu vinnslua\u00f0ila
  fyrr en b\u00fai\u00f0 er a\u00f0 gera grein fyrir umfangi vinnslu pers\u00f3nuuppl\u00fdsinga
  og heimildum til vinnslu \u00feeirra samkv\u00e6mt \u00e1kv\u00e6\u00f0um pers\u00f3nuverndarlaga
  \u00ed vinnslusamningi samkv\u00e6mt 25 gr. laganna og uppfylla \u00fe\u00e6r kr\u00f6fur
  sem ger\u00f0ar eru til vinnslua\u00f0ila l\u00f6gum samkv\u00e6mt.\\n\\nPers\u00f3nuverndarstefnu
  Reykjav\u00edkurborgar m\u00e1 sj\u00e1 \u00ed heild sinni \u00e1 heimas\u00ed\u00f0u
  Reykjav\u00edkurborgar: https://reykjavik.is/personuvernd.\\n\\n1.16 \u00c1byrg
  innkaup\\n\\nSem hluti af \u00e1byrgum innkaupum Reykjav\u00edkurborgar hafa veri\u00f0
  settar fram stefnur \u00ed \u00fdmsum m\u00e1laflokkum. Kaupandi hefur teki\u00f0
  mi\u00f0 af stefnum Reykjav\u00edkurborgar var\u00f0andi \u00e1byrg innkaup \u00ed
  \u00feessu \u00fatbo\u00f0i.\\n\\n1.17 Vanefndir og upps\u00f6gn\\n\\nVerktaki skal
  \u00ed einu og \u00f6llu r\u00e6kja samningsskyldur s\u00ednar \u00ed samr\u00e6mi
  vi\u00f0 \u00e1kv\u00e6\u00f0i \u00fatbo\u00f0sgagna \u00feessa. Vanefni hann \u00fe\u00e6r,
  er kaupanda heimilt a\u00f0 fella ni\u00f0ur grei\u00f0slur e\u00f0a beita \u00f6\u00f0rum
  l\u00f6gformlegum vanefnda\u00farr\u00e6\u00f0um.\\n\\nVer\u00f0i kaupandi fyrir
  tj\u00f3ni af v\u00f6ldum vanefnda verktaka er verktaki a\u00f0 fullu \u00e1byrgur
  fyrir b\u00f3tum vegna \u00feessa samkv\u00e6mt \u00e1kv\u00e6\u00f0um laga.\\n\\nLeiti
  verktaki nau\u00f0asamninga, grei\u00f0slust\u00f6\u00f0vunar e\u00f0a s\u00e9 \u00f3ska\u00f0
  gjald\u00ferotaskipta \u00e1 b\u00fai hans e\u00f0a ef gert er \u00e1rangurslaust
  fj\u00e1rn\u00e1m hj\u00e1 honum hven\u00e6r sem er \u00e1 samningst\u00edmanum
  getur kaupandi \u00e1n frekari fyrirvara sagt samningi upp.\\n\\nVer\u00f0i um \u00edtreka\u00f0ar
  e\u00f0a verulegar vanefndir af h\u00e1lfu verktaka a\u00f0 r\u00e6\u00f0a var\u00f0andi
  vinnuli\u00f0 verkefnisins getur kaupandi sagt upp samningi \u00e1n frekari fyrirvara.  D\u00e6mi
  um sl\u00edkt er ef verktaki \u00fearf a\u00f0 endurvinna vinnuli\u00f0i, \u00f3fulln\u00e6gjandi
  fr\u00e1gang og virkni \u00e1 b\u00fana\u00f0i e\u00f0a \u00e1 verksta\u00f0, e\u00f0a
  seinkun mi\u00f0a\u00f0 vi\u00f0 sam\u00feykkta t\u00edma\u00e1\u00e6tlun fyrir
  verkefni\u00f0.  \u00deessi listi er ekki t\u00e6mandi og \u00fev\u00ed a\u00f0rar
  m\u00f6gulegar vanefndir einnig sko\u00f0a\u00f0ar.\\n\\nHven\u00e6r sem er \u00e1
  samningst\u00edma skal verktaki geta s\u00fdnt kaupanda fram \u00e1 a\u00f0 \u00f6ll
  r\u00e9ttindi og skyldur gagnvart starfsm\u00f6nnum s\u00e9u uppfyllt \u00ed samr\u00e6mi
  vi\u00f0 kafla 1.14. Verktaki sam\u00feykkir a\u00f0 ef hann getur ekki framv\u00edsa\u00f0
  g\u00f6gnum e\u00f0a s\u00fdnt eftirlitsmanni \u00fej\u00f3nustunnar fram \u00e1
  a\u00f0 samningsskyldur s\u00e9u uppfylltar innan fimm daga fr\u00e1 \u00fev\u00ed
  a\u00f0 \u00f3sk um sl\u00edkt er borin fram af kaupanda getur kaupandi beitt f\u00e9v\u00edtum
  sem nemur 0,5% af heildarsamningsfj\u00e1rh\u00e6\u00f0 fyrir hvern dag sem umbe\u00f0nar
  uppl\u00fdsingar skortir e\u00f0a sagt upp samningi \u00e1n frekari fyrirvara.\\n\\nVer\u00f0i
  verktaki uppv\u00eds a\u00f0 brotum gegn ke\u00f0ju\u00e1byrg\u00f0 sinni samkv\u00e6mt
  kafla 1.14 skal kaupandi beita sektar\u00e1kv\u00e6\u00f0um \u00fear til verktaki
  hefur r\u00e9tt hlut allra starfsmanna sem um r\u00e6\u00f0ir. Kaupandi skal \u00ed
  \u00feeim tilfellum beita f\u00e9v\u00edti sem nemur 0,5% af heildarsamningsfj\u00e1rh\u00e6\u00f0
  fyrir hvern dag sem \u00e1kv\u00e6\u00f0i ke\u00f0ju\u00e1byrg\u00f0ar eru brotin
  e\u00f0a sagt upp samningi \u00e1n frekari fyrirvara.\\n\\n1.18 L\u00f6g og regluger\u00f0ir\\n\\nVerktaki
  skal l\u00fata \u00ed einu og \u00f6llu \u00e1kv\u00e6\u00f0um \u00edslenskra laga
  og regluger\u00f0a. Verktaki skal tryggja a\u00f0 afhent vara og/e\u00f0a \u00fej\u00f3nusta
  s\u00e9 \u00ed samr\u00e6mi vi\u00f0 gildandi l\u00f6g og regluger\u00f0ir og al\u00fej\u00f3\u00f0lega
  samninga sem \u00cdsland er a\u00f0ili a\u00f0 \u00e1 hverjum t\u00edma \u00fat
  samningst\u00edmann.\\n\\n1.19 \u00c1greiningsm\u00e1l\\n\\nR\u00edsi \u00e1greiningur
  \u00fat af verkefni \u00fev\u00ed, sem \u00feessi \u00fatbo\u00f0sl\u00fdsing fjallar
  um, skulu a\u00f0ilar reyna sitt \u00edtrasta til a\u00f0 n\u00e1 s\u00e1ttum og
  jafnvel leita formlegrar s\u00e1ttami\u00f0lunar hj\u00e1 s\u00e1ttami\u00f0lara
  en a\u00f0 \u00f6\u00f0rum kosti skal \u00e1greiningi v\u00edsa\u00f0 til H\u00e9ra\u00f0sd\u00f3ms
  Reykjav\u00edkur.\\n\\n1.20 Gildist\u00edmi samnings\\n\\nGildist\u00edmi samnings
  er fr\u00e1 og me\u00f0 t\u00f6ku tilbo\u00f0s \u00fear til verki\u00f0 hefur endanlega
  veri\u00f0 teki\u00f0 \u00fat og sam\u00feykkt af kaupanda. Sj\u00e1 einnig kafla
  1.6.\\n\\n1.21 H\u00f6fundar- og eignarr\u00e9ttur\\n\\nKaupandi ver\u00f0ur eigandi
  allra gagna sem til ver\u00f0a vi\u00f0 vinnslu verkefnisins eins og \u00fev\u00ed
  er l\u00fdst \u00ed samningi \u00feessum, s.s. greinarger\u00f0um, uppdr\u00e1ttum,
  \u00fer\u00edv\u00edddarl\u00edk\u00f6num, \u00fer\u00edv\u00edddarmyndum og sk\u00fdringaruppdr\u00e1ttum.
  Kaupanda er heimilt a\u00f0 vinna me\u00f0 \u00feessi g\u00f6gn \u00e1fram, breyta
  \u00feeim og/e\u00f0a fela \u00f6\u00f0rum \u00fatf\u00e6rslu \u00feeirra sbr. 1.
  mgr. 28.gr. h\u00f6fundalaga nr. 73/1972.\\n\\n1.22 Aukaverk\\n\\nT\u00edmaver\u00f0
  verktaka vegna hugsanlegra sm\u00e6rri aukaverka er samkv\u00e6mt tilbo\u00f0i hans
  \u00ed hverjum verk\u00fe\u00e6tti fyrir sig.  \u00d3ski kaupandi eftir vinnu e\u00f0a
  a\u00f0ger\u00f0um sem falla utan ramma \u00feessa samnings, svo sem breytingar
  og/e\u00f0a a\u00f0laganir \u00e1 b\u00fana\u00f0i sem ekki er l\u00fdst \u00ed
  er \u00ed \u00fatbo\u00f0sg\u00f6gnum, skal gera s\u00e9rstakan samning \u00fear
  um. Verktaka er \u00f3heimilt a\u00f0 reikningsf\u00e6ra sl\u00edka vinnu, hafi
  a\u00f0ilar ekki sam\u00feykkt samning um aukaverk, e\u00f0a kaupandi sam\u00feykkt
  tilbo\u00f0 verktaka um aukaverk, \u00e1\u00f0ur en vinna vi\u00f0 sl\u00edkt verkefni
  hefst. Kaupandi hefur fullan h\u00f6fundar- og n\u00fdtingarr\u00e9tt \u00e1 sl\u00edkum
  breytingum.\\n\\n\u00d3ski kaupandi eftir meiri vinnu, fleiri vinnustundum verktaka
  \u2013 og verktaki sam\u00feykkir \u00fe\u00e1 \u00f3sk, skal bo\u00f0i\u00f0 t\u00edmaver\u00f0
  \u00ed tilbo\u00f0i verktaka standa.\\n\\n2. T\u00e6knil\u00fdsing\\n\\n2.1 Almennar
  uppl\u00fdsingar\\n\\nKaupandi fyrirhugar a\u00f0 uppf\u00e6ra netinnvi\u00f0i \u00ed
  grunnsk\u00f3lum borgarinnar.  Verkefni\u00f0 sn\u00fdr a\u00f0 \u00fev\u00ed a\u00f0
  m\u00e6la fyrir, setja upp, leggja a\u00f0 og tengja \u00fer\u00e1\u00f0lausa senda
  \u00ed samstarfi vi\u00f0 starfsf\u00f3lk UTR.  \u00cd \u00feremur tilvikum eru
  fr\u00edstundaheimili inni \u00e1 sk\u00f3lal\u00f3\u00f0 hluti af \u00fatbo\u00f0i
  \u00feessu en magnt\u00f6lur \u00ed Tilbo\u00f0sskr\u00e1 eru \u00f3breyttar.\\n\\nForgangslisti
  fyrir uppsetningar \u00ed grunnsk\u00f3lum ver\u00f0ur afhentur verktaka \u00ed
  upphafi verks.\\n\\n2.2 Markmi\u00f0 og umfang \u00fatbo\u00f0sins\\n\\n\u00cd dag
  eru um 900 sendar \u00ed notkun \u00ed grunnsk\u00f3lum borgarinnar sem \u00fearf
  a\u00f0 skipta \u00fat.  \u00dev\u00ed til vi\u00f0b\u00f3tar er gert r\u00e1\u00f0
  fyrir a\u00f0 b\u00e6ta vi\u00f0 um 400 sendum.  Verkefni\u00f0 tekur \u00fev\u00ed
  til samtals um 1300 senda.  Kaupandi l\u00e6tur verktaka \u00ed t\u00e9 nau\u00f0synlega
  senda og lagnaefni sem hefur veri\u00f0 keypt inn \u00ed \u00f6r\u00fatbo\u00f0i
  innan rammasamnings Reykjav\u00edkurborgar nr. 14534 \u2013 \u201eT\u00f6lvur og
  netb\u00fana\u00f0ur\\\" og eru innkaup \u00feessa b\u00fana\u00f0ar \u00fev\u00ed
  ekki hluti af \u00feessu \u00fatbo\u00f0i.\\n\\nFyrirliggjandi \u00fatbo\u00f0sverkefni
  er skipt \u00ed tvo \u00fatbo\u00f0s\u00fe\u00e6tti (\u00fe\u00e6tti) e\u00f0a sem
  h\u00e9r segir:\\n\\na) M\u00e6li\u00fe\u00e1ttur: M\u00e6la skal fyrir u.\u00fe.b.
  1.300 \u00fer\u00e1\u00f0lausum (Wi-Fi) sendum \u00ed 34 grunnsk\u00f3lum Reykjav\u00edkur,
  hanna n\u00fdtt Wi-Fi-6 net og magntaka nau\u00f0synlega senda, v\u00e6ntanlega
  um 1300 senda.\\nb) Lagna\u00fe\u00e1ttur: Leggja nau\u00f0synlegar lagnir og setja
  upp senda samkv\u00e6mt ni\u00f0urst\u00f6\u00f0u m\u00e6linga, tengja sendana,
  stilla \u00fe\u00e1 af, m\u00e6la lagnir a\u00f0 sendum, skila m\u00e6lini\u00f0urst\u00f6\u00f0um
  og taka verki\u00f0 \u00fat \u00ed samr\u00e1\u00f0i vi\u00f0 starfsf\u00f3lk UTR.\\n\\n2.3
  B\u00fana\u00f0ur og lagnaefni\\n\\n\u00dear sem \u00fer\u00e1\u00f0laust net grunnsk\u00f3lanna
  \u00ed Reykjav\u00edk byggir \u00e1 innvi\u00f0um fr\u00e1 Cisco er \u00ed verkefni
  \u00feessu einv\u00f6r\u00f0ungu nota\u00f0ir n\u00fdir sendar fr\u00e1 Cisco af
  ger\u00f0inni C9120AXI-E. N\u00fdtt lagnaefni, sem kaupandi l\u00e6tur verktaka
  \u00ed t\u00e9 \u00e1samt sendunum, er af ger\u00f0inni CAT5e, af s\u00f6mu ger\u00f0
  og fyrir er \u00ed sk\u00f3lunum.\\n\\n2.4 \u00datbo\u00f0s\u00fe\u00e6ttir\\n\\n2.4.1
  \u00de\u00e1ttur 1 -  \u201eM\u00e6linga\u00fe\u00e1ttur\\\"\\n\\n18.104.22.168
  Verkefni\\n\\nVerktaki skal, \u00ed s\u00e9rhverjum sk\u00f3la sem \u00fatbo\u00f0i\u00f0
  tekur til, m\u00e6la fyrir \u00fer\u00e1\u00f0lausum sendum me\u00f0 vi\u00f0urkenndum
  b\u00fana\u00f0i og m\u00e6lia\u00f0fer\u00f0um.\\n\\nVerktaki skal:\\n\\n* Fara
  yfir teikningar af \u00f6llu h\u00fasn\u00e6\u00f0i allra sk\u00f3lanna sem verkefni\u00f0
  tekur til, sbr. h\u00e9r a\u00f0 framan\\n* M\u00e6la \u00e1 sta\u00f0num (Site
  Survey), allt h\u00fasn\u00e6\u00f0i allra sk\u00f3lanna sem verkefni\u00f0 tekur
  til, fyrir nau\u00f0synlegum \u00fer\u00e1\u00f0lausum sendum til \u00feess a\u00f0
  uppfylla markmi\u00f0 \u00fatbo\u00f0sins, sbr. h\u00e9r a\u00f0 framan.\\n* \u00cd
  kj\u00f6lfar m\u00e6linga skal verktaki \u00e1kve\u00f0a sta\u00f0setningu \u00e1
  n\u00fdjum sendum og \u00e1kve\u00f0a\\no hva\u00f0a tengingar sem fyrir eru s\u00e9
  h\u00e6gt a\u00f0 n\u00fdta \u00e1fram, \u00e1samt tilheyrandi l\u00f6gnum,\\no
  hve marga n\u00fdja senda \u00fearf a\u00f0 setja upp og sta\u00f0setningu \u00feeirra
  skv. ni\u00f0urst\u00f6\u00f0u m\u00e6linga.\\n\\n\u00c1\u00f0ur en lagnavinna og
  uppsetning senda hefst skal verktaki leggja till\u00f6gur a\u00f0 l\u00f6gnum a\u00f0
  sendum fyrir kaupanda og f\u00e1 sam\u00feykki hans.\\n\\nVerktaki skal vi\u00f0
  m\u00e6lingu sty\u00f0jast vi\u00f0 lei\u00f0beiningar um \u201eSite-Survey\\\"
  fr\u00e1 Cisco e\u00f0a hli\u00f0st\u00e6tt.\\n\\nM\u00e6ling skal vera \u201eActive
  survey\\\", n\u00e1nar tilteki\u00f0:\\n\\nVerktaki skal taka mi\u00f0 af eftirfarandi
  forsendum.  Gert er r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0:\\n\\n* \u00ed hverri
  kennslustofu s\u00e9u 25 nemendur sem munu hafa tv\u00f6 \u00fer\u00e1\u00f0laus
  t\u00e6ki hver,\\n* s\u00e9rhver kennari hafi \u00ferj\u00fa \u00fer\u00e1\u00f0laus
  t\u00e6ki,\\n* s\u00e9rhver notandi muni hafa eitt a\u00f0alt\u00e6ki sem mun \u00feurfa
  upp a\u00f0 10 Mbps tengihra\u00f0a, \u00e1 me\u00f0an t\u00e6ki n\u00famer tv\u00f6
  og \u00ferj\u00fa munu hafa tengi\u00fe\u00f6rf allt a\u00f0 2 Mbps tengihra\u00f0a,\\n*
  tengihra\u00f0i \u00ed r\u00fdmum \u00ed forgangi 2 (sj\u00e1 T\u00f6flu 1, h\u00e9r
  fyrir ne\u00f0an) ver\u00f0i almennur og kr\u00f6fur l\u00e6gri e\u00f0a allt a\u00f0
  2 Mbps \u00e1 t\u00e6ki,\\n* t\u00ed\u00f0nisvi\u00f0 sem \u00e1 a\u00f0 nota eru
  2,4 GHz og 5 GHz,\\n* ger\u00f0 er krafa um -dBm styrk me\u00f0 v\u00edsun \u00ed
  T\u00f6flu 1,\\n* ger\u00f0 er krafa um a\u00f0 hver sendir geti anna\u00f0 allt
  a\u00f0 70 samt\u00edmat\u00e6kjum \u00ed senn,\\n* ger\u00f0 er krafa um a\u00f0
  verktaki skili m\u00e6lig\u00f6gnum \u00feannig a\u00f0 h\u00e6gt s\u00e9 a\u00f0
  skila \u00feeim inn \u00ed Cisco PRIME eftirlitskerfi kaupanda.\\n\\nForgangsflokkun
  \u00e1 sv\u00e6\u00f0um \u00ed hverjum grunnsk\u00f3la, sj\u00e1 T\u00f6flu 1\\n\\nTafla
  1\\n\\n\u00cd Fylgiskjali 3 me\u00f0 \u00fatbo\u00f0sl\u00fdsingu eru yfirlitsteikningar
  yfir nokkra af \u00feeim 34 grunnsk\u00f3lunum sem \u00feessi verkefnis\u00fe\u00e1ttur
  tekur til \u00e1samt teikningum og helstu atri\u00f0um sem a\u00f0 gagni kunna a\u00f0
  koma vi\u00f0 m\u00e6lingarnar.  \u00dear koma fram \u00f6ll r\u00fdmi s\u00e9rhvers
  sk\u00f3la. Bj\u00f3\u00f0andi getur einnig afla\u00f0 s\u00e9r sj\u00e1lfur teikninga
  \u00e1 vefnum https://teikningar.reykjavik.is.  Bj\u00f3\u00f0endur skulu farga
  Fylgiskjali 3 \u00ed lok \u00fatbo\u00f0s.  Yfirlitsteikningar yfir alla sk\u00f3lana
  ver\u00f0a afhentar verktaka \u00ed upphafi verks.\\n\\nVerktaki skal m\u00e6la
  sk\u00f3lana \u00ed \u00feeirri r\u00f6\u00f0 sem tilgreind er \u00e1 forgangslista
  sem afhentur ver\u00f0ur verktaka \u00ed upphafi verks.  Verktaki m\u00e1 a\u00f0eins
  breyta r\u00f6\u00f0inni \u00ed samr\u00e1\u00f0i vi\u00f0 tengili\u00f0 kaupanda.\\n\\nHi\u00f0
  minnsta tveimur vikum \u00e1\u00f0ur en m\u00e6ling er fyrirhugu\u00f0 skal formlegur
  tengili\u00f0ur verktaka, \u00ed samr\u00e1\u00f0i vi\u00f0 tengili\u00f0 kaupanda,
  hafa samr\u00e1\u00f0 vi\u00f0 sk\u00f3lastj\u00f3rnanda \u00ed s\u00e9rhverjum
  grunnsk\u00f3la. A\u00f0ilar skulu koma s\u00e9r saman um framkv\u00e6md m\u00e6linganna,
  t\u00edmasetningu og umfang, hvar hafist skal handa og hvar enda\u00f0 \u00ed hverjum
  sk\u00f3la.  H\u00e9r er mj\u00f6g mikilv\u00e6gt a\u00f0 verktaki vandi til verka
  til \u00feess a\u00f0 m\u00e6lingar ver\u00f0i hn\u00f6kralausar. Vi\u00f0 m\u00f6gulegan
  \u00e1greining skulu fulltr\u00faar a\u00f0ila leysa uppkomi\u00f0 \u00e1litam\u00e1l.  Gangi
  \u00fea\u00f0 ekki skulu a\u00f0ilar v\u00edsa m\u00e1linu til n\u00e6stu stj\u00f3rnenda
  sinna.\\n\\n22.214.171.124 Afur\u00f0 m\u00e6linga\u00fe\u00e1ttar\\n\\n\u00cd kj\u00f6lfar
  m\u00e6linga \u00e1 h\u00fasn\u00e6\u00f0i sk\u00f3lanna skal verktaki skila kaupanda
  h\u00f6nnunarsk\u00fdrslu \u00fear me\u00f0 talda grunnteikningu fyrir s\u00e9rhvern
  sk\u00f3la \u00fear sem fram kemur:\\n\\n* Tillaga a\u00f0 sta\u00f0setningu s\u00e9rhvers
  sendis\\n* Tenging vi\u00f0 tengil \u00ed stofu e\u00f0a tengib\u00fana\u00f0 (sviss)\\n*
  \u00c1\u00e6tlu\u00f0 afk\u00f6st e\u00f0a \u00feekja (coverage) s\u00e9rhvers sendis
  i -dBm skv. T\u00f6flu 1\\n* Heildar\u00feekja fyrir allt r\u00fdmi sem sendar eiga
  a\u00f0 n\u00e1 til \u00ed -dBm skv. T\u00f6flu 1\\n* Athugasemdir/\u00e1bendingar
  um erfi\u00f0 e\u00f0a \u201eblind-/skuggasv\u00e6\u00f0i\\\"\\n* S\u00e9rmerking
  sv\u00e6\u00f0a sem sendar eiga EKKI a\u00f0 n\u00e1 til\\n\\nH\u00f6nnunarsk\u00fdrslan
  og grunnteikningarnar skulu vera eign kaupanda, sj\u00e1 kafla 1.21.  S\u00f6mu
  g\u00f6gn skulu jafnframt vera till\u00f6gur verktaka og grundv\u00f6llur hans a\u00f0
  n\u00e6sta verkli\u00f0 verktaka \u00fe.e. uppsetningu \u00e1 sendum.  Sj\u00e1
  d\u00e6mi um grunnteikningu \u00far h\u00f6nnunarsk\u00fdrslu \u00ed Mynd 1 h\u00e9r
  fyrir ne\u00f0an.\\n\\n126.96.36.199 \u00dabo\u00f0s\u00fe\u00e1ttur.\\n\\nSj\u00e1
  n\u00e1nar kafla 0.8 \u201eForsendur fyrir vali tilbo\u00f0s\\\", Kafla 2.4.1 \u00de\u00e1ttur
  1 - \u201eM\u00e6linga\u00fe\u00e1ttur\\\" h\u00e9r a\u00f0 framan og Tilbo\u00f0sskr\u00e1
  - Fylgiskjal 1.\\n\\n2.4.2 \u00de\u00e1ttur 2 - \u201eLagnavinnu\u00fe\u00e1ttur\\\"\\n\\n188.8.131.52
  Verkefni\\n\\nKaupandi keypti inn senda og lagnaefni \u00ed \u00f6r\u00fatbo\u00f0i
  innan rammasamnings Reykjav\u00edkurborgar, eins og \u00e1\u00f0ur hefur komi\u00f0
  fram.  N\u00fdir sendar eru af ger\u00f0inni C9120AXI-E. N\u00fdtt lagnaefni er
  af ger\u00f0inni CAT5e, s\u00f6mu ger\u00f0ar og fyrir er \u00ed sk\u00f3lunum.  Kaupandi
  s\u00e9r um a\u00f0 stilla sendana inn \u00e1 net grunnsk\u00f3lanna og afhendir
  verktaka sendana tilb\u00fana til uppsetningar.\\n\\nVerktaki skal s\u00e6kja allt
  efni \u00ed birg\u00f0ast\u00f6\u00f0 kaupanda sem hann tilgreinir n\u00e1nar og
  skila \u00feanga\u00f0 \u00f6llu efni sem teki\u00f0 er ni\u00f0ur e\u00f0a gengur
  af vi\u00f0 uppsetningu \u00e1 n\u00fdjum b\u00fana\u00f0i og efni.\\n\\nVerktaki
  skal taka vi\u00f0 forstilltum sendum fr\u00e1 kaupanda.\\n\\nVerktaki skal setja
  upp og ganga fr\u00e1 b\u00fana\u00f0i og tengingum til notkunar \u00ed, hi\u00f0
  minnsta, tveimur (2) sk\u00f3lum \u00e1 m\u00e1nu\u00f0i.  Kaupandi grei\u00f0ir
  verktaka \u00ed samr\u00e6mi vi\u00f0 framvindu verkefnisins, sj\u00e1 n\u00e1nar
  kafla 1.2 \u201eGrei\u00f0slur\\\", h\u00e9r a\u00f0 framan.\\n\\nHi\u00f0 minnsta
  tveimur vikum \u00e1\u00f0ur en uppsetning \u00e1 sendum er fyrirhugu\u00f0 skal
  formlegur tengili\u00f0ur verktaka, \u00ed samr\u00e1\u00f0i vi\u00f0 tengili\u00f0
  kaupanda, hafa samr\u00e1\u00f0 vi\u00f0 sk\u00f3lastj\u00f3rnanda \u00ed s\u00e9rhverjum
  grunnsk\u00f3la. A\u00f0ilar skulu koma s\u00e9r saman um framkv\u00e6md uppsetningarinnar,
  t\u00edmasetningu og umfang, hvar hafist skal handa og hvar enda\u00f0 \u00ed hverjum
  sk\u00f3la.\\n\\nVerktaki skal gera r\u00e1\u00f0 fyrir \u00fev\u00ed a\u00f0 \u00e1kj\u00f3sanlegur
  t\u00edmi til \u00feess a\u00f0 vinna vi\u00f0 senda og tengingar s\u00e9 a\u00f0
  jafna\u00f0i fr\u00e1 klukkan 13:00 \u00ed sk\u00f3lunum \u00e1 virkum d\u00f6gum,
  \u00e1 \u00f6\u00f0rum t\u00edma eftir samkomulagi. H\u00e9r er mj\u00f6g mikilv\u00e6gt
  a\u00f0 verktaki vandi til verka til \u00feess a\u00f0 uppsetning ver\u00f0i hn\u00f6kralaus.\\n\\nVi\u00f0
  m\u00f6gulegan \u00e1greining skulu fulltr\u00faar kaupanda og verktaka leysa uppkomi\u00f0
  \u00e1litam\u00e1l.  Gangi \u00fea\u00f0 ekki skulu a\u00f0ilar v\u00edsa m\u00e1linu
  til n\u00e6stu stj\u00f3rnenda sinna.\\n\\nVerktaki skal setja sendana upp og tengja
  inn \u00e1 net s\u00e9rhvers sk\u00f3la samkv\u00e6mt m\u00e6lingatill\u00f6gu verktaka,
  till\u00f6gu sem hefur \u00e1\u00f0ur veri\u00f0 sam\u00feykkt af kaupanda, sbr.
  h\u00e9r a\u00f0 framan.  Me\u00f0 tengingu er h\u00e9r \u00e1tt vi\u00f0 hvort
  tveggja nettengingu senda vi\u00f0 sviss og tengingu senda vi\u00f0 spennu (e. Power
  Over Ethernet \u2013 POE). Verktaki ber eftir sem \u00e1\u00f0ur \u00e1byrg\u00f0
  \u00e1 a\u00f0 setja sendana upp, tengja \u00fe\u00e1 og sj\u00e1 til \u00feess
  a\u00f0 \u00feeir uppfylli kr\u00f6fur \u00fatbo\u00f0sins um virkni og afkastagetu.\\n\\nVerkefni\u00f0
  skal unni\u00f0 \u00ed \u00feeirri r\u00f6\u00f0 sem tilgreint er \u00e1 forgangslista
  \u00ed sem afhentur ver\u00f0ur verktaka \u00ed upphafi verks.  Verktaki m\u00e1
  a\u00f0eins breyta r\u00f6\u00f0inni \u00ed samr\u00e1\u00f0i vi\u00f0 tengili\u00f0
  kaupanda.\\n\\nVerktaki skal n\u00fdta fyrirliggjandi lagnir a\u00f0 sendum, s\u00e9
  \u00feess kostur, annars setja upp n\u00fdjar lagnir \u00ed sta\u00f0 \u00feeirra
  sem fyrir eru.\\n\\nS\u00e9 ekki n\u00e6gjanlegt rafmagn til \u00feess a\u00f0 kn\u00fdja
  sendi og annan b\u00fana\u00f0 skal verktaki gera kaupanda vi\u00f0vart. Kaupandi
  l\u00e6tur \u00fe\u00e1 \u00ed t\u00e9 og tengir nau\u00f0synlegan vi\u00f0b\u00f3tarb\u00fana\u00f0
  (Power injector) \u00ed samr\u00e1\u00f0i vi\u00f0 verktaka.\\n\\nAthygli bj\u00f3\u00f0enda
  er vakin \u00e1 \u00fev\u00ed a\u00f0 kaupandi grei\u00f0ir fyrir uppsetningu, tengingu
  og pr\u00f3fanir \u00e1 b\u00fana\u00f0i samkv\u00e6mt framvindu verkefnisins.  Sj\u00e1
  n\u00e1nar kafla 1.2 Grei\u00f0slur h\u00e9r a\u00f0 framan. Sendar skulu tengdir
  vi\u00f0 mi\u00f0l\u00e6gan b\u00fana\u00f0 (sviss) \u00ed hverjum sk\u00f3la.\\n\\n184.108.40.206
  Almennt um t\u00f6lvulagnir\\n\\n* Verktaki skal fylgja st\u00f6\u00f0lum og reglum
  sem kve\u00f0i\u00f0 er \u00e1 um \u00ed Byggingarregluger\u00f0 um uppbyggingu
  og h\u00f6nnun rafkerfa og b\u00fana\u00f0ar\\n* Almennt gildir um lagnir, umfram
  sta\u00f0la sem um \u00fe\u00e6r gilda, a\u00f0 \u00fe\u00e6r \u00feurfa a\u00f0
  vera a\u00f0gengilegar vegna vi\u00f0halds \u00fear sem \u00fev\u00ed ver\u00f0ur
  vi\u00f0 komi\u00f0.\\n* Allur t\u00e6kjab\u00fana\u00f0ur sem verktaki notar skal
  vera vanda\u00f0ur, vel samh\u00e6f\u00f0ur og fr\u00e1 traustum birgjum og framlei\u00f0endum.\\n*
  Gera skal r\u00e1\u00f0 fyrir a\u00f0 a\u00f0albyggingar sk\u00f3lanna s\u00e9u
  tengdar lj\u00f3slei\u00f0ara.\\n\\n220.127.116.11 Afur\u00f0 Lagna- og uppsetningar\u00fe\u00e1ttar\\n\\nVi\u00f0
  lok tengingar s\u00e9rhvers sendis skal verktaki m\u00e6la og skjalfesta \u00ed
  \u00fattektarsk\u00fdrslu a\u00f0:\\n\\n* l\u00f6gn/tenging milli sendis og mi\u00f0l\u00e6gs
  b\u00fana\u00f0ar (sviss) virki fullkomlega.  S\u00e9 minnsti vafi \u00e1 \u00fev\u00ed
  a\u00f0 svo s\u00e9 skal verktaki lagf\u00e6ra e\u00f0a skipta um l\u00f6gn\\n*
  s\u00e9rhver sendir skili \u00feeim afk\u00f6stum/styrk sem gert er r\u00e1\u00f0
  fyrir \u00ed m\u00e6lingask\u00fdrslu verktaka, sem kaupandi hefur \u00e1\u00f0ur
  sam\u00feykkt, sbr. h\u00e9r a\u00f0 framan.\\n\\nSj\u00e1 d\u00e6mi um lokam\u00e6lingu
  eftir uppsetningu senda og lagna \u00e1 Mynd 2 h\u00e9r fyrir ne\u00f0an\\n\\nKaupandi
  \u00e1skilur s\u00e9r r\u00e9tt til \u00feess a\u00f0 gera pr\u00f3fanir \u00e1
  einst\u00f6kum sendum e\u00f0a h\u00f3p senda til \u00feess a\u00f0 ganga \u00far
  skugga um a\u00f0 kr\u00f6fur \u00fatbo\u00f0sl\u00fdsingar s\u00e9u uppfylltar.  Ef
  svo er ekki skal verktaki lagf\u00e6ra e\u00f0a skipta \u00fat b\u00fana\u00f0i
  eins og \u00fearf til \u00feess a\u00f0 kr\u00f6fum verkefnisins s\u00e9 n\u00e1\u00f0.\\n\\n\u00cd
  lok uppsetningar \u00ed hverjum sk\u00f3la skal verktaki \u00ed samr\u00e1\u00f0i
  vi\u00f0 fulltr\u00faa kaupanda taka \u00fat \u00ed heild sinni uppsetningu og tengingu
  senda og skjalfesta \u00ed s\u00e9rstakri \u00fattektarsk\u00fdrslu a\u00f0 markmi\u00f0um
  verkefnisins hafi veri\u00f0 n\u00e1\u00f0. Pr\u00f3fun \u00e1 \u00f6llum b\u00fana\u00f0i
  eftir uppsetningu er \u00e1 \u00e1byrg\u00f0 verktaka og undir eftirliti kaupanda.\\n\\n18.104.22.168
  \u00datbo\u00f0s\u00fe\u00e1ttur\\n\\nSj\u00e1 n\u00e1nar kafla 0.8 \u201eForsendur
  fyrir vali tilbo\u00f0s\\\", Kafla 2.4.2  \u00de\u00e1ttur 2 - \u201eLagnavinnu\u00fe\u00e1ttur\\\"
  h\u00e9r a\u00f0 framan og Tilbo\u00f0sskr\u00e1 - Fylgiskjal 1.\\n\\n3. Or\u00f0sk\u00fdringar\\n\\nBJ\u00d3\u00d0ANDI
  \u2010 Fyrirt\u00e6ki (verktaki, seljandi e\u00f0a veitandi \u00fej\u00f3nustu)
  sem lagt hefur fram tilbo\u00f0.\\n\\nCCNA - Cisco Certified Network Associate\\n\\nCCNP
  -  Cisco Certified Network Personnel.\\n\\nEES \u2010 Evr\u00f3pska efnahagssv\u00e6\u00f0i\u00f0
  \u2013 \u00fear me\u00f0 tali\u00f0 \u00cdsland.\\n\\nOIL \u2010 L\u00f6g um opinber
  innkaup nr. 120/2016.\\n\\nKAUPANDI \u2013 Stofnun, sveitarf\u00e9lag e\u00f0a annar
  opinber a\u00f0ili skv. 3. gr. OIL sem kaupir/semur vi\u00f0 verksala/\u00fej\u00f3nustua\u00f0ila
  \u00ed kj\u00f6lfar \u00fatbo\u00f0sins \u2010 h\u00e9r UTR.\\n\\nSAMNINGUR \u2013
  merkir \u00feeir almennu og s\u00e9rst\u00f6ku skilm\u00e1lar sem tilgreindir eru
  \u00ed kr\u00f6fum kaupanda, fyrirspurnir og sv\u00f6r \u00e1 tilbo\u00f0st\u00edma,
  \u00e1samt vi\u00f0aukum sem tilgreindir eru \u00ed \u00fatbo\u00f0sl\u00fdsingu,
  \u00e1samt tilbo\u00f0i \u00feess bj\u00f3\u00f0anda sem hl\u00fdtur verki\u00f0.\\n\\nSENDIR
  \u2013 \u00der\u00e1\u00f0laus (WiFi) sendir (e. Access Point)\\n\\nSKAL \u2010
  \u00cd \u00fatbo\u00f0sl\u00fdsingu \u00feessari merkir a\u00f0 tilteki\u00f0 atri\u00f0i
  e\u00f0a krafa er \u00f3fr\u00e1v\u00edkjanleg, \u00fe.e. bj\u00f3\u00f0andi ver\u00f0ur
  \u00ed tilbo\u00f0i s\u00ednu a\u00f0 uppfylla sl\u00edkt atri\u00f0i e\u00f0a kr\u00f6fu
