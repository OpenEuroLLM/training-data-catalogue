  veebis).\\n\\nKoosolek on otsustusv\u00f5imeline: kohal v\u00f5i esindatud 12 liiget
  14-st.\\n\\nP\u00e4evakord:\\n\\n1. Teadmussiirde programmi 2023. aastal ellu viidud
  tegevused\\n3. 2024. aasta tegevuste ettepanekute \u00fclevaatamine\\n2. 2023. aasta
  tegevuste muudatuste otsustamine\\n4. 2024. aasta tegevuskava kinnitamine\\n\\nTegemist
  \u00dchendPIP teise etapi ehk riigihange nr 257107 \u201eTeadmussiirde pikaajaline
  programm p\u00f5llumajanduse, toidu ja maamajanduse tegevusvaldkonnas\\\" aastakava
  kinnitamiseks vajaliku istungiga. Projekti teave on leitav veebis: https://www.pikk.ee/valdkonnad/teadmussiirde-pikaajalised-programmid/uhendpip/\\n\\n1.
  Teadmussiirde programmi 2023. aastal ellu viidud tegevused\\n\\n\u00dchendPIP-2
  ehk uue programmi raamleping allkirjastati 21/22. veebruar 2023. aastal, hankeleping
  30. mail 2023. Kogu programmi eelarve on 1 700 000 eurot. Kokku on viis kogu (juhtkogu
  ja n\u00f5ukogu), osadel kogudel mitmed teemad (nt juhtkogul \u2013 horisontaalsed
  teemad,\\n\\nTeadmussiirde programm p\u00f5llumajanduse, toidu ja maamajanduse tegevusvaldkonnas\\n\\ndigip\u00f6\u00f6rde
  soodustamine, \u00fchistegevus; maaviljeluse n\u00f5ukogul \u2013 taimekasvatus
  ja aiandus), teised on omaette (nagu loomakasvatuse, toiduohutuse ja mahemajanduse
  n\u00f5ukogu) ning \u00dcPP abin\u00f5ude tellimuse annab PRIA koos Regionaal- ja
  P\u00f5llumajandusministeeriumiga ise.\\n\\n\u00dclevaade \u00dchendPIP-2 raames
  2023. aastal ellu viidud tegevustest esitas projektijuht Hanna Tamsalu (vaata slaidid).\\n\\nToiduohutuse
  teemalisi tegevusi on toimunud nii varasema hanke nn \u00dchendPIP-1 kui ka \u00dchendPIP-2
  horisontaalse valdkonna raames. Enamik kavandatud tegevusi on toimunud, novembris-detsembris
  korraldatakse veel 2 koolitust ja 1 konverents ning avaldatakse teabematerjale ja
  videoloenguid. Osad teabematerjalid ei saanud lektoritest v\u00f5i koosk\u00f5lastamise
  keerukusest tulenevalt valmis ning seet\u00f5ttu tuleks t\u00fchistada v\u00f5i
  t\u00f5sta j\u00e4rgmisesse aastasse (aruteluks punktis 2).\\n\\nValdavalt on toimunud
  2023. a jooksul h\u00fcbriid- v\u00f5i veebitegevused. \u00dcrituste vastu on olnud
  huvi suur. N\u00e4itena v\u00f5ib tuua, et toiduohutuse \u00fcritustel osalejate
  arv on k\u00fc\u00fcndinud samasse suurusj\u00e4rku loomakasvatuse valdkonnas \u00fcritustel
  osalejate arvuga, ehkki loomakasvatuse valdkonnas on aasta jooksul korraldatud \u00fcritusi
  rohkem.\\n\\nEsitatud materjal protokolli Lisas 1 (slaidid)\\n\\n2. 2023. aasta
  tegevuste muudatuste otsustamine\\n\\nTeabematerjalid \u201eHea h\u00fcgieenitava
  toidu \u00fcmberjagamisel ja annetamisel\\\", \u201eN\u00f5uded alkoholi v\u00e4ikek\u00e4itlejatele\\\"
  aastal 2023. a kahjuks valmis ei saa. M\u00f5lemad materjalid on tellitud eelk\u00f5ige
  REMi poolt. \u201eN\u00f5uded alkoholi v\u00e4ikek\u00e4itlejatele\\\" t\u00f5staks
  j\u00e4rgmisesse aastasse (eelarve 8000\u20ac), kuid teine j\u00e4\u00e4b tegemata
  mh vajaduste muutumise t\u00f5ttu.\\n\\nEsitatud muudatusettepanekuid h\u00e4\u00e4letati
  j\u00e4rgmiselt: poolt 12, vastu 0, erapooletu 0 (kokku 14 h\u00e4\u00e4lt toiduohutuse
  n\u00f5ukogus).\\n\\nOtsus: kinnitada tellimuse v\u00e4hendamine j\u00e4rgmiselt:\\n\\n1.1
  t\u00fchistada teabematerjali \u201eHea h\u00fcgieenitava toidu \u00fcmberjagamisel
  ja annetamisel\\\" tellimus 2023. aastast;\\n1.2 t\u00fchistada teabematerjali \u201eN\u00f5uded
  alkoholi v\u00e4ikek\u00e4itlejatele\\\" tellimus 2023. aastast.\\n\\n3. 2024. aasta
  tegevuste ettepanekute \u00fclevaatamine\\n\\nEsitatud ettepanekud protokolli Lisas
  1 (slaidid) ja Lisas 2 (tabel)\\n\\n2024. aasta tegevusplaani on esitatud ettepanekuid
  rohkem kui eelarvet valdkonnas projekti l\u00f5puni j\u00e4rgi on. Tegevuste sihtr\u00fchm
