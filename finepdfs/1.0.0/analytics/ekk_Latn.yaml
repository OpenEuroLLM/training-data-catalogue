  TAIMETOIT\\nK\u00dcSI INFOT ALLERGEENIDE KOHTA TEENINDAJALT.\"", "\"Laadimise tingimused\\n\\nAudi
  charging plus\\n\\nKehtib alates 12.5.2023\\n\\nValitud partnerite v\u00f5rgustik
  koosneb laadimispunktide operaatorite (CPO) r\u00fchmast, mis v\u00f5imaldavad klientidele
  optimeeritud laadimiskogemust. Need CPO-d pakuvad suure v\u00f5imsusega laadimisinfrastruktuuri,
  kohapealseid mugavusi ja oma klassi parimat t\u00f6\u00f6kindlust. Aja jooksul v\u00f5idakse
  CPO-sid sellesse r\u00fchma lisada v\u00f5i sealt eemaldada, et s\u00e4ilitada meie
  klientidele parim v\u00f5imalik teenindustase.\\n\\nValitud partnerite v\u00f5rgustik
  on saadaval k\u00f5igile kasutajatele. CPO-de erihinnad on saadaval ainult tipptasemel
  paketi tellijatele, sealhulgas valitud partnerv\u00f5rgu hinnakujundus, ja juhul,
  kui tasu v\u00f5tja on sel ajal valitud partnerite v\u00f5rgustiku liige. Praegused
  liikmed on: IONITY, Audi Charging Hub, Ewiva ja Aral pulse.\\n\\n* K\u00f5ik hinnad
  sisaldavad k\u00e4ibemaksu ning v\u00f5ivad muutuda ja v\u00f5imalikud on vead.\\n\\nVolkswagen
  Group Charging GmbH, Mollstra\u00dfe 1, 10178 Berlin\"", "\"Teadmuss\u00fcsteemid
  - kursuse korraldus 2000.a. kevadel\\n\\nJaak Tepandi\\nTT\u00dc Informaatikainstituut\\n\\nK\u00e4esolev
  materjal selgitab kursuse korraldust ja annab iseseisvate t\u00f6\u00f6de, samuti
  teiste kursusesse kuuluvate tegevuste struktuuri.\\n\\n1. Kursuse hindamine\\n\\nT\u00f6\u00f6d
  ja (maksimum)punktid:\\n\\n- 1. iseseisev t\u00f6\u00f6 20 punkti\\n- 2. iseseisev
  t\u00f6\u00f6 20 punkti\\n- anal\u00fc\u00fcs 10 punkti\\n- ettekanne 10 punkti\\n-
  eksam 5x10=50 punkti\\n- muu (nt. uurimst\u00f6\u00f6d) ebastandardsed punktid\\n\\nEksami
  sooritamiseks on vaja eelnevalt koguda v\u00e4hemalt 25 punkti. Arvestatava hinne
  saamiseks tuleb ka eksamilt saada v\u00e4hemalt 25 punkti.\\n\\nPunktide vastavus
  hindele: 50...59 punkti - hinne 1; 60 ... 69 punkti - hinne 2; ... 90 ja enam punkti
  - hinne 5.\\n\\nSoovi korral v\u00f5ib eksamit andes kasutada enesehinnangu, mis
  esitatakse kohe eksamile tulles.\\n\\nEnesehinnangus pannakse kirja seni saadud
  punktid, antakse hinnang oma teadmistele ja pakutakse hinne. Teadmiste hinnangus
  pakutakse konspekti esimese ja teise jaotise eest kokku maksimaalselt 10 punkti,
  iga jaotise 3, 4, 5, 6 eest samuti maksimaalselt 10 punkti. Enesehinnangu andmisel
  v\u00f5ib kasutada jaotiste l\u00f5pul olevaid k\u00fcsimustikke. Iga osa teadmised
  peavad enesehinnangu korral olema v\u00e4hemalt viis punkti. Eksamil vaadeldakse
  l\u00fchidalt enesehinnangu vastavust tegelikkusele.\\n\\nIseseisvate t\u00f6\u00f6de
  hindamisel v\u00f5ib samuti kasutada enese- v\u00f5i kaastudengi anal\u00fc\u00fcsis
  pakutud hinnangut.\\n\\nN\u00e4ide enesehinnangust:\\n\\n- iseseisvate t\u00f6\u00f6de
  hinnang on 37 punkti\\n- ettekanne 9 punkti\\n- Teadmised:\\n  - 1&2. Andmed, info,
  teadmine, ekspertsus, Exsys - 9 punkti\\n  - 3. Teadmiste esitamine ja j\u00e4reldamine
  - 8 punkti\\n  - 4. \\\"Ebakindlad\\\" teadmised - 6 punkti\\n  - 5. Masin\u00f5pe
  - 8 punkti\\n  - 6. Otsing - 5 punkti\\n\\nKogusumma on 82 punkti, pakutav hinne
  - 4.\\n\\n2. Ajakava\\n\\nEsimene iseseisev t\u00f6\u00f6 annab 8. n\u00e4dala loengu
  l\u00f5puks esitatuna 100%, 9. n\u00e4dala loengu l\u00f5puks - 50%, peale seda
  - 3p.\\n\\nTeine t\u00f6\u00f6 annab 14. n\u00e4dala loengu l\u00f5puks esitatuna
  100%, 15. n\u00e4dala loengu l\u00f5puks - 50%, peale seda - 3p.\\n\\nAnal\u00fc\u00fcs
  v\u00f5ib esitada hiljemalt eksamil.\\n\\nEttekanne on soovitav esitada semestri
  jooksul \u2013 p\u00e4rast on raske saada kokku kuulajaid.\\n\\nEbastandardsete
  tegevuste t\u00e4htajad m\u00e4\u00e4ratakse kokkuleppel.\\n\\nEksam aeg lepitakse
  kokku \u00fcli\u00f5pilaste ja \u00f5ppej\u00f5u vahel. Eksam on suuline, ootamise
  v\u00e4hendamiseks v\u00f5ib koostada eksamile tuleku j\u00e4rjekorra.\\n\\nAinet\u00f6\u00f6de
  esitamise t\u00e4htaeg on m\u00e4\u00e4ratud TT\u00dc vastavate reeglitega.\\n\\n3.
  Eksam\\n\\nEksamil on kokku viis l\u00fchikest k\u00fcsimust v\u00f5i lihtsat \u00fclesannet,
  igauhe eest maksimaalselt 10 p. Seega kogusumma on <= 50p.\\n\\nKogu materjal on
  kiiresti muutuv ja lubab erinevaid t\u00f5lgendusi. \u00dcldine p\u00f5him\u00f5te
  on, et eriarvamused on (ka) eksemil teretulnud (seejures tuleb neid p\u00f5hjendada
  ja osata v\u00f5rrelda kursuse t\u00f5lgendusega \u2013 mida nii siis tuleks ka
  teada).\\n\\n4. Iseseisvad t\u00f6\u00f6d\\n\\nIseseisvate t\u00f6\u00f6de eesm\u00e4rgid
  on (1) saada kogemus uudset laadi rakenduste v\u00e4ljapakkumises ja realistliku
  spetsifikatsiooni koostamises ning (2) saada kogemus t\u00f6\u00f6s eksperts\u00fcsteemi
  kestaga.\\n\\nT\u00f6\u00f6 laad:\\n- kasutatakse ka kursuse meetodeid/vahendeid\\n\\nT\u00f6\u00f6
  maht:\\n- realiseeritav es kesta abil praktikumide k\u00e4igus\\n\\nT\u00f6\u00f6de
  hindamisel arvestatakse j\u00e4rgmist:\\n\\n- Realistik l\u00e4hteolukord loodud
  ja toimib\\n- L\u00e4hteolukord \u21d2 \u00dclesande p\u00fcstitus \u21d2 N\u00f5udmised
  \u21d2 Spetsifikatsioon \u21d2 Realisatsioon \u21d2 Testimine \u21d2 Dokumenteerimine\\n-
  N\u00f5udmised s\u00fcsteemile ja spetsifikatsioon j\u00e4relduvad l\u00e4hteolukorras\\n-
  Spetsifikatsioon v\u00f5ib olla laiem kui realiseeritud (tavaliselt ongi - kasulikul
  s\u00fcsteemil peavad tavaliselt olema sellised funktsioonid nagu uuendamine, side
  andmebaasiga, v\u00f5ib-olla ka side laoga jne, mida ei ole v\u00f5imalik praktikumide
  k\u00e4igus realiseerida)\\n- Realisatsioon ja testimine arvestavad l\u00e4hteolukorda\\n-
  Vormistamine: titelleht, sisu arvestavad l\u00e4hteolukorda\\n- Kasutatakse ka kursuse
  meetodeid/vahendeid\\n- \u00dclesande laad ja maht vastavad kursuse n\u00f5uetele\\n-
  Dokumentatsiooni k\u00f5ik osad olemas\\n- Sealhulgas l\u00e4htekoodid\\n- Vormistamine
  kvaliteetne\\n\\nT\u00f6\u00f6de dokumenteerimiseks on kaks v\u00f5imalust:\\n\\n-
  l\u00e4htudes t\u00f6\u00f6 k\u00e4igust (L\u00e4hteolukord \u21d2 \u00dclesande
  p\u00fcstitus \u21d2 N\u00f5udmised \u21d2 Spetsifikatsioon \u21d2 Realisatsioon
  \u21d2 Testimine \u21d2 Dokumenteerimine),\\n- l\u00e4htudes standarditest (ANSI/IEEE
  Std 830-1984 ja teised).\\n\\nAllj\u00e4rgnevalt kirjeldatakse vormistust vastavalt
  viimasele standardile. Realiseerimine v\u00f5ib olla tehtud s\u00f5ltuvalt \u00fclesande
  raskusastmest esimese v\u00f5i teise t\u00f6\u00f6 esitamise ajaks. Hindamine toimub
  hiljemalt eksamil.\\n\\nJ\u00e4rgmisel lehek\u00fcljel on soovituslik iseseisva
  t\u00f6\u00f6 tiitelleht. Kommentaar m\u00f5nedele selle elementidele:\\n\\n- number
  \u00fclal vasakul nurgas on kuulaja number kuulajate nimekirjast (kes seda ei tea,
  k\u00fcsige \u00f5ppej\u00f5u k\u00e4est);\\n- t\u00f6\u00f6 pealkiri kajastab t\u00f6\u00f6
  sisu;\\n- esitamise kuup\u00e4eva m\u00e4rgib \u00f5ppej\u00f5ud;\\n- ka \u00f5ppeaine
  ja muud nimetused v\u00f5ivad muutuda - pange kehtivad.\\n\\nEKSPERTS\u00dcSTEEM
  V\u00d5RGUKAARDI VALIKUKS\\nSpetsifikatsioon\\n\\n1. iseseisev t\u00f6\u00f6 \u00f5ppeaines
  \u201cEksperts\u00fcsteemid\u201d\\n\\nKoostaja: T\u00f5nu Tamm,\\n\u00d5pper\u00fchm:
  LZDXY\\nEsitatud: ....................\\nJuhendaja: Jaak Tepandi\\n\\nTALLINN 1997\\n\\n4.1.
