  \u201eToidu keemilised ohud\\\" t\u00e4iendamine \u2013 tuleks t\u00e4iendada saasteainete
  gruppidega ja oleks lihtsasti muudetav elektrooniline materjal.\\n\\nElektroonilised
  v\u00e4ljaanded\\n\\n- Eelarvesse lisatud videoloengud ajakohastel teemadel.\\n\\nKonverentsid\\n\\nKas
  teha v\u00e4iksemaid konverentse (odavama formaadiga, veebis) v\u00f5i suuremaid
