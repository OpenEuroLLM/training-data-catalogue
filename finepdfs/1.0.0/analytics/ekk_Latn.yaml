  l\u00f5pp: 31.12.2014\\n\\nnimi: Mittetulundus\u00fching TAPA VABATAHTLIKE TUGIKESKUS\\n\\nregistrikood:
  80245721\\n\\nt\u00e4nava/talu nimi, Turu 12a-6\\n\\nmaja ja korteri number:\\n\\nlinn:
  Tapa vallasisene linn\\n\\nvald: Tapa vald\\n\\nmaakond: L\u00e4\u00e4ne-Viru maakond\\n\\npostisihtnumber:
  45106\\n\\ntelefon: +372 5241275\\n\\ne-posti aadress: firstname.lastname@example.org,
  email@example.com\\n\\nSisukord\\n\\nTegevusaruanne\\n\\n2014.aasta l\u00f5ppes
  KYSK-i poolt toetatud projekt \u201eTapa Vabatahtlike Tugikeskuse kommunikatsioonialaste
  teadmiste t\u00f5stmine\\\", mille tulemusel valmis kommunikatsiooniplaan, uuenes
  koduleht, \u00fchenduse eesm\u00e4rgid, tegevus ning m\u00f5ju on avalikkusele n\u00e4htavad.\\n\\nJ\u00e4tkus
  hea koost\u00f6\u00f6 heategevusliku SA Dharmaga, mis laienes peale V\u00e4ike-Maarja,
  Laekvere ja Viru-Nigula valla kogu L\u00e4\u00e4ne-Virumaale, koos osaleti erinevatel
  koolitustel ja tegutseti ka mitmesugustel \u00fchistel ettev\u00f5tmistel (suvekool,
  j\u00f5ulupakkide kogumise ja jagamise kampaania).\\n\\n2014 kujunes MT\u00dc Tapa
  Vabatahtlike Tugikeskuse eestv\u00f5ttel v\u00e4lja tulemuslik koost\u00f6\u00f6
  Tapa piirkonna kodanike\u00fchenduste vahel, \u00fchiselt korraldati erinevaid heategevuslikke
  \u00fcritusi, j\u00e4tkati v\u00e4hekindlustatud lastega perede toetamist riide-
  ja toiduabiga (kokku toetati ~205 last 65 perest).\\n\\nLiikumine Kodukant toel
  viidi l\u00e4bi \u00fcleriigilise vabatahtlike n\u00e4dala raames osav\u00f5turohke
  (45 talgulist) talgup\u00e4ev Kaitseliidu Tapa kompanii maja korrastamiseks.\\n\\nJ\u00e4tkati
  kogukonnale vajalike teenuste arendamist s.h. rehabilitatsiooniteenuse arendust
  t\u00e4isteenuseks (lisaks plaanide koostamisele hakati osutama ka f\u00fcsioteraapia-,
  ps\u00fchholoogi-, logopeedi- ja sotsiaaln\u00f5ustamise teenust klientidele nende
  kodudes).\\n\\nMT\u00dc j\u00e4tkab 2015.aastal oma tegevust vastavalt arenguplaanile.\\n\\nRaamatupidamise
