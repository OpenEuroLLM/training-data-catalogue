  heaks kiitnud.\"", "\"Jaanip\u00e4eval taasavati ja \u00f5nnistati Simunas aastail
  1914\u20141920 kihelkonnast langenud s\u00f5durite m\u00e4lestussammas. Koopiana
  taastatuna \u2014 ka Saaremaa dolomiidist \u2014 asub see kiriku vastas \u00fcle
  tee, samas, kus oli 1946. aastal h\u00e4vitatugi.\\n\\nPidulik tseremoonia algas
  p\u00e4evakohase jumalateenistusega kirikus. Osa v\u00f5tsid EELK peapiiskop Kuno
  Pajula, V\u00e4ike-Maarja kiriku pastor, Viru praost August Laumets ja kohalik pastor
  Ain Eenmaa. Isamaalisi ja vaimulikke laule esitas Rakke\u2014Kiltsi\u2014V\u00e4ike-Maarja
  segakoor \u00abHelin\u00bb. Peapiiskop Kuno Pajula koos V\u00e4ike-Maarja ja Simuna
  pastoriga \u00f5nnistas kohaliku Muinsuskaitse Seltsi lipud.\\n\\nSeej\u00e4rel
  suunduti m\u00e4lestussamba juurde. Simuna Muinsuskaitse Seltsi esimees Guido Ploompuu
  t\u00e4nas oma avak\u00f5nes k\u00f5iki, kelle rahalisel toetusel m\u00e4lestussamba
  taasavamine teoks sai. Erilist t\u00e4nu p\u00e4lvis Rein R\u00e4\u00e4k, kes 1988.
  a. augustis algatas m\u00e4lestussamba taastamise m\u00f5tte ja oli \u00fcks selle
  elluviijad.\\n\\nM\u00e4lestussamba \u00f5nnistasid EELK peapiiskop, V\u00e4ike-Maarja
  ja Simuna koguduse \u00f5petaja. M\u00e4ngis puhkpilliorkester. K\u00f5lasid isamaalised
  laulud.\\n\\nEldor TRAKS\\n\\nSimuna pastor Ain Eenmaa k\u00f5nelemas Simuna m\u00e4lestussamba
  avamisel.\\n\\nA. ILOMETS\u00c4 foto\"", "\"Eesti V\u00f6\u00f6d Eevi Astel\\n\\nIlmamaa,
  1998 ISBN 9985-821-49-1\\n\\n\\\"Eesti v\u00f6\u00f6de\\\" m\u00fc\u00fcgiedu on
  h\u00e4mmastav. Kultuurifondide abiga v\u00e4lja antud raamat on nii populaarne,
  et selle tr\u00fckikordused l\u00e4hevad ikka ja j\u00e4lle \u00fclikiiresti kaubaks.
  Ja seda juba \u00fcle 10 aasta j\u00e4rjest. Endale ja kingiks, kohalikud ja turistid,
  lapsed ja t\u00e4iskasvanud, meistrid ja teiste t\u00f6\u00f6de imetlejad, rahvariietest
  huvituvad v\u00f5i mitte \u2013 see raamat on saavutanud \\\"must have\\\" staatuse.
  Ka Peter Collingwoodile pakkus see huvi.\\n\\nEevi Astel on hariduse poolest ajaloolane-etnograaf.
  Ta t\u00f6\u00f6tab Eesti Rahva Muuseumis 1963. aastast ning 1971. aastast on selle
  peavarahoidja. Nende aastate jooksul on ta kirjutanud ning aidanud kirjutada mitmeid
  materjale muuseumi ajaloo ning etnograafilise tekstiili teemadel. Eesti v\u00f6\u00f6de
  album on publikatsioonidest suurim.\\n\\nTegemist on \u00f5igupoolest albumi, mitte
  raamatuga. 263st lehek\u00fcljest 20 viimast h\u00f5ivavad lisad \u2013 abstraktid
  inglise ja saksa keeles, bibliograafia, l\u00fchendid, piltide register. Lisaks
  veel alateemasid tutvustavad tekstid \u2013 kokku samuti umbes 20 lehek\u00fclge.
  Ja siis pildid, suured, erksav\u00e4rvilised, kvaliteetsed fotod. Fotograaf Aldo
  Luud on teinud imehead t\u00f6\u00f6d \u2013 piltidel on palju paremini n\u00e4ha
  v\u00f6\u00f6de struktuuri ja v\u00e4rve, kui originaalidel. Virunuka v\u00f6\u00f6
  fragmentide pilt on lausa eriline \u2013 sellel saab l\u00f5imel\u00f5ngasid kokku
  lugeda, samas kui reaalsetel fragmentidel pole kerge isegi erineva v\u00e4rviga
  laike eristada.\\n\\nAlbumis  esindatud  v\u00f6\u00f6d  on  jagatud  kaheksasse  gruppi
  materjalide ja valmistamistehnoloogia j\u00e4rgi. V\u00f6\u00f6dega seotud infole
  ja nende piltidele eelneb sisukas eess\u00f5na, kus on juttu v\u00f6\u00f6de  valmistamise  ja  kandmise  traditsioonist.  Ees\u00f5na  on
  illustreeritud  Eesti  kaartidega,  kus  on  n\u00e4idatud konkreetsete v\u00f6\u00f6de  levikupiirkonnad,  ning  piltidega  rahvar\u00f5ivastes
  inimestest.  Samuti  on  pilte  k\u00e4sit\u00f6\u00f6listest  ja  nende t\u00f6\u00f6vahenditest
  \u2013 viimastest on p\u00f5hiliselt esindatud tihvad ja v\u00f6\u00f6m\u00f5\u00f5gad.\\n\\nK\u00f5lav\u00f6\u00f6dele  on  p\u00fchendatud  esimene  ning  sugugi  mitte
  mahukaim  albumi  osa.  L\u00fchike  tekst  annab  \u00fclevaadet  Eesti arheoloogilistest  leidudest  ja  terminoloogiast  erinevates
  murretes, lisatud on veidi tehnika \u00fcldajalugu. Just see viimane osa on n\u00f5rk,
  kuna sisaldab vanu andmeid ning v\u00e4iteid, mis on juba m\u00f5nda aega tagasi
  \u00fcmber l\u00fckatud. Piltidelt n\u00e4eb kahte paremini  s\u00e4ilinud  arheoloogilist  leidu  \u2013  v\u00f6\u00f6  fragmente\\n\\nParisseljast
  ja Virunukast. Virunuka leiu k\u00f5rval n\u00e4eb selle v\u00f6\u00f6 rekonstruktsiooni,
  mille autoriks soomlanna Barbro Gardberg. J\u00e4rgnevatel piltidel on 58 v\u00f6\u00f6d,
  mille valmistamisaeg langeb p\u00f5hiliselt 18.  ja  19.  sajandisse.  V\u00f6\u00f6d  on  grupeeritud  geograafilisel  p\u00f5him\u00f5ttel,  kuid  pole  arvestatud
  kronoloogia ega mustrit\u00fc\u00fcpidega. N\u00e4iteks \u00fcks mustrit\u00fc\u00fcp
  on esindatud erinevates v\u00e4rvides \u00fcle 10\\n\\nkorra samas kui m\u00f5nda
  pole \u00fcldse n\u00e4idatud. \u00dcld\u00fclevaate Eesti viimase kolme sajandi
  k\u00f5lav\u00f6\u00f6dest aga siiski saab.\\n\\nAlbumi suurim osa on p\u00fchendatud
  kiriv\u00f6\u00f6dele. Kuna tegemist on levinuima ja t\u00f5en\u00e4oliselt ka k\u00f5ige
  paremini uuritud v\u00f6\u00f6t\u00fc\u00fcbiga. Piltidele eelneb pikem tekst ajaloost,
  tehnoloogiast, mustritest ja v\u00e4rvikombinatsioonidest. 90 (!) j\u00e4rgneval
  lehek\u00fcljel leiab pilte 413 (!!!) erinevast v\u00f6\u00f6st, suurem osa piltidest
  on piisavalt suured, et nendelt saab probleemideta mustrit lugeda.\\n\\nJ\u00e4rgnevad  albumiosad  r\u00e4\u00e4givad  v\u00f5rkv\u00f6\u00f6dest,  telgedel  kootud  v\u00f6\u00f6dest  ning  muudest
  v\u00f6\u00f6valmistamise viisidest, sh heegeldamisest ja tikkimisest. Nahkv\u00f6\u00f6de
  alaosas on palju pilte pannaldest  ja  muudest  v\u00f6\u00f6de  kaunistustest,  mis  on  kahjuks  m\u00e4\u00e4ratletud  vaid  geograafilselt.
  Viimased albumi osad on p\u00fchendatud linnav\u00f6\u00f6dele.\\n\\nAlbumi miinuseks
  on tehnilise info t\u00e4ielik puudumine \u2013 kuid see on eelk\u00f5ige album,
  ning oma eesm\u00e4rki \u2013 tutvustada tervet kihti traditsioonilisest tekstiiilist
  \u2013 see t\u00e4idab igati. Silmar\u00f5\u00f5mu ning inspiratsiooni on l\u00f5pmatult.\\n\\nJulia
  Christie Amor \u00a9 2008\"", "\"Haapsalu Veeakt AS\\n\\nHaapsalu linna veet\u00f6\u00f6stuse
