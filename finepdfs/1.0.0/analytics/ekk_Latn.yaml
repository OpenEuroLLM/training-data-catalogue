  l\u00f5pp: 31.12.2022\\n\\nnimi:\\n\\nMittetulundus\u00fching Laste ja Noorte Kriisiprogramm\\n\\nregistrikood:
  80154088\\n\\nt\u00e4nava/talu nimi,\\n\\nLastekodu tn 6a maja ja korteri number:\\n\\nlinn:\\n\\nmaakond:\\n\\nTallinn\\n\\nHarju
  maakond postisihtnumber:\\n\\n10113\\n\\ntelefon: +372 5069658, +372 6311861\\n\\nfaks:
  +372 6311862\\n\\ne-posti aadress: firstname.lastname@example.org\\n\\nSisukord\\n\\nAruande
  allkirjad\\n\\n13\\n\\nTegevusaruanne\\n\\nMT\u00dc Laste ja Noorte Kriisiprogramm
  majandusaastana k\u00e4sitletakse perioodi 01.01.2022 kuni 31.12.2022 a.\\n\\n2022.
  aastal j\u00e4tkus MT\u00dc Laste ja Noorte Kriisiprogrammi peategevus - l\u00e4hedase
  pereliikme kaotanud laste rehabilitatsioonit\u00f6\u00f6. Selleks korraldasime neli
  laste leinatoetuslaagrit, viisime l\u00e4bi grupit\u00f6id ja individuaaln\u00f5ustamisi,
  toetasime leinas vanemaid.\\n\\nLeinatoetusprogrammis osalejate kolme viimase aasta
  koondarv koosneb otsesest sihtgrupist, kelleks on l\u00e4hedase pereliikme surma
  kogenud lapsed/noored, nende vanemad/eestkostjad ning sidusgrupist, kelleks on leinas
  peredega seotud kohaliku omavalitsuse spetsialistid, peredega seotud tugispetsialistid,
  vaimse tervise spetsialistid ning muud peredega seotud v\u00f5rgustik.\\n\\nMe tegeleme
  leinas lastega peredega aastaringselt. Oleme oma teenuste kohta infot jaganud nii
  kohalikele omavalitsustele, ps\u00fchholoogidele, Sotsiaalkindlustusameti ohvriabi
  t\u00f6\u00f6tajatele, koolide tugispetsialistidele jm. Laste ja Noorte Kriisiprogrammi
  poole on p\u00f6\u00f6rdunud n\u00f5u ja abi saamiseks lisaks sotsiaal-ja haridusvaldkonna
  spetsialistide ka pered ise. 2022.aastal otsustasime muuta l\u00e4henemist teenust
  vajavate leinas perede leidmisel. Kui varem j\u00f5udsid lastega pered teenusele
  KOV-de kaudu, siis n\u00fc\u00fcd keskendusime maakondlikult koost\u00f6\u00f6le
  kooliv\u00f5rgustikega. Selle muutuse p\u00f5hjuseks oli ka s\u00f5da Ukrainas,
  mis pani KOV-d suure koormuse alla. Sarnaselt varasematele aastatele lisandus 2022.aastal
  teave \u00fcle 200 leinas lapse kohta.\\n\\nKuna pered/lapsed liituvad programmiga
  aastaringselt, siis viisime  l\u00e4bi perede esmased n\u00f5ustamised (esialgu
  reeglina vanemaga) info laekumise j\u00e4rjekorras. Vanemaga toimusid esmased vestlused
  ka veebis. Kui selgus, et pere on meie teenusest huvitatud, siis kohtusime lapse
  ja vanemaga  silmast-silma. Kui \u00fchest piirkonnast oli rohkem peresid, tegime
  v\u00e4ljas\u00f5idup\u00e4evad. K\u00f5ik kohtumised viisime l\u00e4bi m\u00e4rtsis-juulis
  2022. Kuna p\u00f6\u00f6rdumisi oli rohkem, kui me oma intensiivprogrammi vastu
  v\u00f5tta saime, siis pakkusime peredele teisi teenuseid s\u00fcgisel.\\n\\nKolme
  aasta kokkuv\u00f5ttes on laste leinatoetuslaagrite, grupit\u00f6\u00f6de ja individuaaln\u00f5ustamiste
  kaudu toetatud \u00fcle 530 lapse ja vanemat, neist umbes kolmandik 2022.aastal.
  Osad lapsed on meie leinatoetusprogrammi aktiivse perioodi 2022.aasta l\u00f5puks
  l\u00f5petanud. Osadega j\u00e4tkame 2023. aastal. Leinatoetusprogrammi raames toimus
  2022.aastal 4 leinatoetuslaagrit allj\u00e4rgnevalt: talvelaager 29.01., kevadlaager
  25.-26.03., suvelaager 15.-18.08., ja s\u00fcgislaager 21.-23.10. K\u00f5ik laagrid
  toimusid Paunk\u00fclas, Audentese Spordibaasis. Viisime muude, sh loovterapeutiliste
  tegevuste k\u00f5rval l\u00e4bi 70 leinagruppi. Iga vanusegruppi juhtis 2 grupijuhti.
  Kavandasime j\u00e4tkulaagrid 2023.a. talveks ja kevadeks.\\n\\nGrupit\u00f6\u00f6dele
  lisaks pakkusime 2022.aastal leinan\u00f5ustamist, traumateraapiat ja peren\u00f5ustamist.
  Tallinnas, Raplas ja Tartus viisime l\u00e4bi trauma-ja leinafokuseeritud grupit\u00f6\u00f6d,
  kokku 11 grupit\u00f6\u00f6d. See on uus mudel, mida tahame arendada 2023.aastal
  piirkondlikuks ja paindlikuks teenuseks. Laagriprogrammi laste vanematele suunatud
  leinatoetusgrupid viidi piirkondlikult l\u00e4bi nii silmast-silma kohtumistena
  kui veebi teel.\\n\\n\u00dchingu erinevate projektide ja tegevuste l\u00e4biviimiseks
  ning erinevate meeskondade koost\u00f6\u00f6 planeerimiseks toimusid regulaarsed
  veebi ja telefonin\u00f5upidamised. Leinatoetusprogrammi meeskonnaseminarid toimusid
  kuuel p\u00e4eval seoses laagrite ning grupit\u00f6\u00f6de ettevalmistuse, arenduse
  ja tagasisidestusega.\\n\\nLaste leinatoetusprogrammi viisid ellu 12-13 meeskonnaliiget.
  Leinatoetusprogrammi teenused olid  peredele  tasuta.\\n\\nAruandeperioodil pakkusime
  kriisijuhtumite j\u00e4rgset tuge lasteasutustele, kohalikele omavalitsustele ja
  peredele.  Viisime l\u00e4bi grupisupervisioone ja leina- ning traumaalaseid koolitusi.
  Arendasime koost\u00f6\u00f6d vaimse tervise spetsialististidega, kelle huvi just
  laste trauma teemaliste supervisioonide ja koolituste vastu on viimastel aastatel
  oluliselt kasvanud. Ilmselt m\u00f5jutas seda ka s\u00f5jap\u00f5genike saabumine
  Eestisse.\\n\\nAktiivset koost\u00f6\u00f6d leina- ja traumat\u00f6\u00f6 valdkonnas
  tegime Sotsiaalkindlustusameti Ohvriabi s\u00fcsteemi spetsialistidega erinevates
  maakondades, Koolips\u00fchholoogide \u00dchinguga, Tallinna \u00dclikooliga \u00f5petaja
  magistri koolituse raames jm. J\u00e4tkus Harjumaa 6 omavalitsuse \u00fclene noorte
  suitsiidiennetuse alane koost\u00f6\u00f6. Uue arenguna loodi koost\u00f6\u00f6
  Haridusministeeriumi ja HARNO`ga.\\n\\nSelle tulemusel saab Laste ja Noorte Kriisiprogramm
  2023-2024.aastaks HARNO lepinguliseks koolituspartneriks projekti \u201eTraumateadliku
  l\u00e4henemise toetamine hariduss\u00fcsteemis\\\" elluviimisel aastatel 2023-2024.
  Projektitegevused k\u00e4ivituvad 2023.aasta kevadel. Projekti toetab Euroopa Majanduspiirkonna
  ja Norra toetustest rahastatud programmi \u201eLocal Development and Poverty Reduction\\\"
  raames.\\n\\nJ\u00e4tkus koost\u00f6\u00f6 MT\u00dc Peaasjad suitsiidiohvrite l\u00e4hedastele
  ja lastele toetuse pakkumise v\u00f5imaluste arendamiseks grupit\u00f6\u00f6de kaudu.
  MT\u00dc Peaasjad kaasas Laste ja Noorte Kriisiprogrammi koost\u00f6\u00f6partnerina
  Sotsiaalministeeriumile strateegilise partnerluse projektitaotluse raames projekti
  \\\"Suitsiidiennetus la\u25a0bi teadmiste, oskuste ja teenuste arendamise\\\" l\u00e4biviimiseks
  2022.-2024.a. Planeerimistegevustega alustati 2022.aastal. Laste ja Noorte Kriisiprogramm
  viib l\u00e4bi trauma-ja leinafokusseeritud grupit\u00f6id ja on loomas suitsiidiohvrite  lastega
  perede toetamiseks perep\u00e4eva mudelit, mida projekti k\u00e4igus piloteeritakse.\\n\\nAruandeaastal
  osalesime hankekonkursil (Tartu LV). Tartu Linnavalitsuse Sotsiaalabi osakond rahuldas
  hankepakkumuse \u201eLaste leinano\u25a0ustamisteenuse ost 2022. aastaks\\\".\\n\\nAastatel
  2020.-2022.a. oleme olnud koost\u00f6\u00f6s Sihtasutusega SAVE Sotsiaalministreeriumi
  partnerid strateegilise partnerluslepingu kaudu \u00fchisprojektis nr. RE.3.01.19-0378
  \\\"Laste ja perede heaolu tagavate teenuste koost\u00f6\u00f6pakkumine\\\". Toetuse
  abil oleme saanud l\u00e4bi viia \u00fcle-eestilisi laste leinatoetusprogrammi tegevusi
  ning leina ja trauma teemal supervisioone ja koolitusi. Selleks, et laste leinatoetusprogrammi
  teenused saaks olla peredele tasuta on projektis kaasfinantseerijateks nii kohalikud
  omavalitsused kui annetajad.\\n\\nMT\u00dc Laste ja Noorte Kriisiprogramm oli \u00fcks
  organisatsioonidest Ma Armastan Aidata annetus-keskkonnas ja Heategevusorganisatsiooni
  Aitan Eestit \u00fcks toetuse saajatest. Oleme kaasanud oma tegevustesse erineva
  valdkonna vabatahtlikke.\\n\\n2020.-2022.a olime koost\u00f6\u00f6s Sihtasutusega
  SAVE Sotsiaalministreeriumi partnerid strateegilise partnerluslepingu kaudu ka teises
  \u00fchisprojektis nr. RE.3.01.19-0560 \u201eLasterikast Eestit toetavate ja perede
  heaolu tagavate teenuste koost\u00f6\u00f6pakkumine\\\". Selle pilootprojekti k\u00e4igus
  koolitati v\u00e4lja 11 grupijuhti, kes hakkavad l\u00e4bi viima lapsep\u00f5lves
  traumeeritud vanemate stabiliseerimisgruppe \\\"Tasakaalukam vanemlus\\\". Gruppide
  eesm\u00e4rk on anda algteadmisi lapsep\u00f5lves kogetud v\u00e4\u00e4rkohtlemisest
  tulenevatest t\u00fc\u00fcpilistest probleemidest ja raskustest lapsevanemaks olemises.
  Projekti kaugemaks eesm\u00e4rgiks on \u00e4ra hoida vanema lapseeast tuleneva traumatisatsiooni
  kahjulike m\u00f5jude \u00fclekandumise j\u00e4rgmistele p\u00f5lvkondadele. Projekti
  k\u00e4igus t\u00f5lgiti soome keelest eesti keelde grupit\u00f6\u00f6 manuaal.
  2022.aastal t\u00f5lgiti grupit\u00f6\u00f6 manuaal ka vene keelde.\\n\\n2021. aasta
  l\u00f5pul kirjutati koos uue koost\u00f6\u00f6partneriga MT\u00dc Perekoolitus\u00fching
  Sina ja Mina strateegilise partnerluse projektitaotlus Sotsiaalministeeriumile \\\"Tasakaalukam
  vanemlus\\\" gruppide piloteerimiseks aastatel 2022.-2024. Projekt sai toetuse.
  Aastal 2022 hakkasid grupijuhid ette valmistama lapsep\u00f5lves traumeeritud vanemate
  stabiliseerimisgruppe \\\"Tasakaalukam vanemlus\\\" kolmes Eesti piirkonnas: Tallinnas,
  Tartus ja P\u00e4rnus. Pilootgruppidega alustatakse 2023.aastal. Kokku viiakse l\u00e4bi
  6 gruppi. Nii ettevalmistaval kui grupit\u00f6\u00f6de l\u00e4biviimise perioodil
  (3 kuud) on soome koolitajate poolt tagatud supervisioonid.Grupis osalemine on vanematele
  tasuta.\\n\\nSoovist aidata Eestisse j\u00f5udnud ukraina lapsi t\u00f5i Laste ja
  Noorte Kriisiprogrammi juht Maire Riis koost\u00f6\u00f6s Children and War Foundation\u00b4ga
  Eestisse trauma-fokusseeritud ps\u00fchholoogiliselt \u00f5petusliku ja t\u00f5endusp\u00f5hise
  programmi Teaching Recovery Techniques (TRT) koolituse. Sellel osalenud 11 ukraina
  ps\u00fchholoogi hakkasid l\u00e4bi viima ukraina lastele TRT gruppe, mis aitab
  v\u00e4hendada traumaatilise juhtumi m\u00f5ju oskuste \u00f5petamise kaudu. 2022.
  l\u00f5pu seisuga on ukraina lastele l\u00e4bi viidud 33 gruppi \u00fcle Eesti.
  TRT grupid j\u00e4tkuvad ka 2023.a. TRT gruppide l\u00e4biviimist toetavad Eesti
  annetajad, kes j\u00e4rgisid noorte Eesti noorte muusikute aprillis 2022.a. toimunud
  heategevuskontserdi \u201eMaailm mis j\u00e4\u00e4b meile\u201e  algatust toetada
  traumeeritud ukraina lapsi Laste ja Noorte Kriisiprogrammi kaudu.\\n\\nMT\u00dc
  Laste ja Noorte Kriisiprogramm on VATEK liige.\\n\\nMT\u00dc Laste ja Noorte Kriisiprogramm
  juhatuse esimees on Maire Riis. Juhatusse kuulusid aasta l\u00f5pul  Merike Sarapuu,
  Tuuli Vellama , Uku Presmann ja Kaupo J\u00f5eveer.\\n\\n4\\n\\nRaamatupidamise
  aastaaruanne\\n\\nBilanss\\n\\nTulemiaruanne\\n\\nRahavoogude aruanne\\n\\nNetovara
  muutuste aruanne\\n\\nRaamatupidamise aastaaruande lisad\\n\\nLisa 1 Arvestusp\u00f5him\u00f5tted\\n\\n\u00dcldine
  informatsioon\\n\\nK\u00e4esolev MT\u00dc Laste ja Noorte Kriisiprogramm raamatupidamise
  aastaaruanne on koostatud  l\u00e4htudes Eesti Vabariigi raamatupidamise seadusest
  ja  Eesti finantsaruandluse standarditest.\\n\\nRaamatupidamise aastaaruande koostamine
  n\u00f5uab hinnangute andmist, mis p\u00f5hinevad aktuaalsel informatsioonil \u00fchingu
  seisundist, kavatsustest ja riskidest.\\n\\nMajandustehingud on kirjendatud soetusmaksumuse
  printsiibil nende tekkimise momendil tegelikus v\u00e4\u00e4rtuses.\\n\\nVara ja
  kohustusi on hinnatud kaalutletud ja konservatiivsetel alustel.\\n\\nRaamatupidamise
  aastaruanne on koostatud eurodes, arvn\u00e4itajad on \u00fcmardatud t\u00e4iseuroni.\\n\\nRaha\\n\\nRaha
  ja selle ekvivalentidena kajastatakse bilansis raha ja pangakontode kirjel ja rahavoogude
  aruandes kassas olevat sularaha ja arvelduskonto j\u00e4\u00e4ke.\\n\\nN\u00f5uded
  ja ettemaksed\\n\\nN\u00f5udeid ostjate vastu kajastatakse bilansis  soetusmaksumuses.\\n\\nKui
  on t\u00f5en\u00e4oline, et ettev\u00f5te ei suuda koguda kokku k\u00f5iki saadaolevaid
  summasid vastavalt n\u00f5uete tingimustele, hinnatakse n\u00f5uded alla. Allahindluse
  summa kajastatakse kasumiaruandes real \\\"Muud \u00e4rikulud\\\".\\n\\nFinantskohustised\\n\\nK\u00f5iki
  finantskohustisi (v\u00f5lad tarnijatele, muud l\u00fchi- ja pikaajalised kohustised,
  saadud laenud, emiteeritud v\u00f5lakirjad) kajastatakse soetusmaksumuses.  L\u00fchiajaliste
  finantskohustiste soetusmaksumus on \u00fcldjuhul v\u00f5rdne nende nominaalv\u00e4\u00e4rtusega,
  mist\u00f5ttu l\u00fchiajalisi finantskohustisi kajastatakse bilansis maksmisele
  kuuluvas summas.\\n\\nFinantskohustis liigitatakse l\u00fchiajaliseks, kui selle
  tasumise t\u00e4htaeg on kaheteist kuu jooksul alates bilansikuup\u00e4evast.\\n\\nAnnetused
  ja toetused\\n\\nAnnetused ja toetused on kajastatud tuluna. Kasutamata annetused
  ja toetused aruandeperioodi l\u00f5pus kajastatakse bilansis real \\\"sihtotstarbelised
  tasud, annetused ja toetused\\\"\\n\\nTulud\\n\\nTulu teenuste m\u00fc\u00fcgist
  kajastatakse tekkep\u00f5hiselt saadud v\u00f5i saadaoleva tasu \u00f5iglases v\u00e4\u00e4rtuses.\\n\\nTulude
  ja kulude arvestuse korraldamisel l\u00e4htutakse tulude ja kulude vastavuse printsiibist\\n\\nSeotud
  osapooled\\n\\nAastaaruande koostamisel on loetud seotud osapoolteks:\\n\\na. omanikke
  b. tegev- ja k\u00f5rgemat juhtkonda;\\n\\nc. eespool loetletud isikute l\u00e4hedasi
  pereliikmeid ja nende poolt kontrollitavaid v\u00f5i nende olulise m\u00f5ju all
  olevaid ettev\u00f5tteid\\n\\nMajandustehingud on kirjendatud soetusmaksumuse printsiibi
  kohaselt nende tekkimise momendil tegelikus v\u00e4\u00e4rtuses. Raamatupidamise
  aruanded on koostatud tekkep\u00f5hise arvestusprintsiibi kohaselt\\n\\nLisa 2 Raha\\n\\n(eurodes)\\n\\nLisa
  3 N\u00f5uded ja ettemaksed\\n\\nLisa 4 Materiaalsed p\u00f5hivarad\\n\\n(eurodes)\\n\\nLisa
  5 V\u00f5lad ja ettemaksed\\n\\nLisa 6 Annetused ja toetused\\n\\n(eurodes)\\n\\nLisa
  7 Tulu ettev\u00f5tlusest\\n\\n(eurodes)\\n\\nLisa 8 T\u00f6\u00f6j\u00f5ukulud\\n\\n(eurodes)\\n\\nLisa
  9 Seotud osapooled\"", "\"TALUV\u00c4RAVA TOITEELEMENTIDE BILANSI JA KASUTUSE UURING
  2017. AASTAL 2016. AASTA ANDMETE KOHTA\\n\\nT\u00f6\u00f6 teostaja: Osa\u00fching
  AgriNet ja P\u00f5llumajandusuuringute Keskuse p\u00f5llumajanduskeskkonna seire
  ja uuringute b\u00fcroo.\\n\\nUuringu eesm\u00e4rk\\n\\nUuringu eesm\u00e4rgiks
  on hinnata MAK PKT keskkonnas\u00f5braliku majandamise (KSM) ja mahep\u00f5llumajandusliku
  tootmise (MAHE) meetme rakendumist ja m\u00f5ju keskkonnale. Taluv\u00e4rava toiteelementide
  bilansi tulemused annavad \u00fcldist informatsiooni p\u00f5llumajandusettev\u00f5tte
  majandamise kohta tervikuna ja kaudselt on selle p\u00f5hjal v\u00f5imalik hinnata
  survet vee- ja mullakeskkonnale. Bilansi p\u00f5hjal saab hinnata, mil m\u00e4\u00e4ral
  v\u00f5ib erinevate n\u00f5uete t\u00e4itmine v\u00e4hendada leostumise riski, kuiv\u00f5rd
  efektiivselt ettev\u00f5tte tasandil toiteelemente kasutatakse ning kui suure \u00fcle-
  v\u00f5i puuduj\u00e4\u00e4giga majandatakse. Toiteelementide bilansi tulemused
  v\u00f5ivad kaudselt kajastada ka v\u00f5imalikke muutusi (positiivseid v\u00f5i
  negatiivseid) mullaviljakuses.\\n\\nUuringu tulemusi kasutatakse p\u00f5llumajanduslike
  keskkonnatoetuste hindamise ja seire taustainformatsioonina ning seireindikaatorite
  valiku t\u00e4psustamiseks.\\n\\nMetoodika\\n\\nTaluv\u00e4rava bilansi uuringut
  teostatakse alates aastast 2004 igal aastal. Perioodil 2004-2014 kuulus PMK seirevalimisse
  olenevalt aastast 103-133 p\u00f5llumajandusettev\u00f5tet. Seireala pindala h\u00f5lmas
  aastate keskmisena ~13 300 ha p\u00f5llumajandusmaad.\\n\\nToiteelementide bilansi
  andmeid kogutakse p\u00f5llumajandustootjatelt aastase tagasinihkega, mis t\u00e4hendab,
  et 2017. aastal koguti andmeid 2016. majandusaasta tulemuste kohta.\\n\\nSeoses
  MAK 2014-2020 uue toetusperioodi algusega 2015. aastal, muudeti 2016. aastal bilansi
  seirevalimit, taluv\u00e4rava toiteelementide bilanssi arvutati teist aastat FADNi
  andmete p\u00f5hjal. 2017. aastal kuulus valimisse 661 ettev\u00f5tet.\\n\\nK\u00f5ik
  indikaatori \\\"taluv\u00e4rava toiteelementide bilanss ja kasutus\\\" n\u00e4itajad
  arvutati kaalutud keskmistena p\u00f5llumajandustootja kohta. FADNi 2016. aasta
  valimis olnud ettev\u00f5tete tulemuste laiendamisel p\u00f5llumajandustootjate
  \u00fcldkogumile, kasutati PRIA p\u00f5llumajandustoetuste ja p\u00f5llumassiivide
  registri 2016. aasta andmeid.\\n\\nToetuste l\u00f5ikes andmete kaalumiseks kasutati
  PRIA p\u00f5llumajandusloomade ning p\u00f5llumassiivide registri 2016. aasta andmeid
  ning standardtoodangu koefitsiente 1 \\\"2010\\\" (aastate 2008-2012 keskmine).
  Kasutades standardtoodangu koefitsiente ning ettev\u00f5tte andmeid maakasutuse
  ja loomade arvu kohta m\u00e4\u00e4rati ettev\u00f5tte standardkogutoodangu v\u00e4\u00e4rtus
  eurodes e. majanduslik suurus. Ettev\u00f5tte tootmist\u00fc\u00fcp ehk peamine
  tootmissuund m\u00e4\u00e4rati olenevalt \u00fche v\u00f5i teise tootmisharu osat\u00e4htsusest
  ettev\u00f5tte standardkogutoodangus.\\n\\nMajandusliku suuruse ja tootmist\u00fc\u00fcbi
  kalkulaator on avaldatud Maamajanduse Infokeskuse kodulehel: http://www.maainfo.ee/data/so_calc/.\\n\\n1
  Arvutatakse viie aasta keskmisena vastavalt vaatlusaluste aastate saagikus- ja produktiivsusn\u00e4itajatele
  ning hindadele. Toetused standardtoodangu koefitsientides ei kajastu.\\n\\nFADNi
  \u00fcldkogumisse kuuluva ettev\u00f5tte standardkogutoodangu 2 (SKT) v\u00e4\u00e4rtus
  aruandeaastal peab olema suurem kui 4000 eurot.\\n\\nNPK bilansin\u00e4itajate kaalumiskoefitsiendid
  arvutati v\u00e4lja vastavalt p\u00f5llumajandustootjate \u00fcldkogumi struktuurile
  l\u00e4htudes tootmist\u00fc\u00fcpidest ja majandusliku suuruse klassidest. Kaalutud
  keskmise tulemuse (keskmiselt p\u00f5llumajandustootja kohta) arvutamisel korrutati
  anal\u00fc\u00fcsitavasse gruppi kuuluvate ettev\u00f5tete v\u00e4\u00e4rtused nende
  kaalumiskoefitsientidega, korrutised summeeriti ja saadud kogusumma jagati ettev\u00f5tete
  kaalumiskoefitsientide summaga.\\n\\nSeoses valimi muutmisega 2016. aastal, kohandati
  toiteelementide bilansi arvutamiseks OECD taluv\u00e4rava toiteelementide bilansi
  metoodikat vastavalt FADNis olemasolevatele andmetele ja korrigeeriti toiteelementideks
  \u00fcmberarvutamise koefitsiente.\\n\\nTaluv\u00e4rava bilanss ettev\u00f5tte kohta
  arvutatakse (NPK kg/ha aastas) ajavahemiku 1. jaanuar \u2013 31. detsember kohta
  raamatupidamisandmete p\u00f5hjal. Tootmisaasta l\u00f5pul m\u00fc\u00fcmata j\u00e4\u00e4nud
  toodang v\u00f5etakse arvesse j\u00e4rgmisel aastal.\\n\\nArvesse v\u00f5etakse
  kalendriaasta jooksul ettev\u00f5ttesse ostetud/sisse toodud (sisend) ja sealt m\u00fc\u00fcdud/v\u00e4lja
  viidud (v\u00e4ljund) p\u00f5llumajandustoodang. Ettev\u00f5tte sisest toiteelementide
  ringlust selle metoodika puhul ei arvestata.\\n\\nBilansi sisendi moodustavad ettev\u00f5ttesse
  sisse ostetud/toodud s\u00f6\u00f6t, p\u00f5hk, mineraalv\u00e4etised, seemned,
  loomad, orgaaniline v\u00e4etis, l\u00e4mmastiku sidumine liblik\u00f5ieliste kultuuride
  poolt ja sademetest saadav l\u00e4mmastik. V\u00e4ljundi poole toodanguga v\u00e4lja
  m\u00fc\u00fcdud/viidud looma- ja taimekasvatussaadused, p\u00f5llumajandusloomad
  ja orgaaniline v\u00e4etis (s\u00f5nnik). K\u00f5ik kogused arvutatakse spetsiaalsete
  koefitsientide abil \u00fcmber NPK toiteelementideks ja summeeritakse (kg).\\n\\nBilansi
  arvutamiseks lahutatakse ettev\u00f5tte sisendi toiteelementide summast ettev\u00f5tte
  v\u00e4ljundi toiteelementide summa.\\n\\nBilanss on positiivne ehk \u00fclej\u00e4\u00e4giga,
  kui sisendi toiteelementide summa on suurem ettev\u00f5tte v\u00e4ljundi toiteelementide
  summast. Negatiivne ehk puuduj\u00e4\u00e4giga on bilanss juhul, kui v\u00e4ljundi
  toiteelementide summa \u00fcletab sisendi toiteelementide summat.\\n\\nKeskkonnariskide
  ja majandusliku efektiivsuse hindamiseks arvutatakse toiteelementide kasutamise
  efektiivsust 3 (v\u00e4ljundi ja sisendi suhe esitatud protsentides).\\n\\nK\u00f5ik
  NPK toiteelementide f\u00fc\u00fcsilised kogused esitatakse elementidena. Mineraalv\u00e4etiste
  puhul kasutati fosfori- ja kaaliumisisalduse oksiididest (P2O5, K2O) elementideks
  \u00fcmberarvutamisel koefitsiente: P=P2O5 \u00d7 0,44 ja K=K2O \u00d7 0,83.\\n\\nKuna
  FADNi andmebaasis kajastuvad ostetud ja m\u00fc\u00fcdud s\u00f5nniku andmed rahalises
  v\u00e4\u00e4rtuses, t\u00e4psed andmed s\u00f5nnikukoguste kohta aga puuduvad,
  kohandati s\u00f5nniku NPK sisendi ja v\u00e4ljundi senist arvutamise metoodikat.
  Selleks jagati ostetud v\u00f5i m\u00fc\u00fcdud s\u00f5nniku summad keskmise m\u00fc\u00fcgihinnaga
  10 eurot/t. Eri t\u00fc\u00fcpi s\u00f5nniku toiteelementide sisalduse m\u00e4\u00e4ramisel
  kasutati\\n\\n2 SKT - standardkogutoodangu v\u00e4\u00e4rtus eurodes ehk ettev\u00f5tte
  majanduslik suurus, mis arvutatakse standardtoodangu koefitsientide ning ettev\u00f5tte
  p\u00f5llumajandusliku maakasutuse ja kasvatatavate loomade arvu alusel\\n\\n3 Keskkonda
  s\u00e4ilitavaks loetakse p\u00f5llumajandustootmist juhul, kui toiteelemendi kasutamise
  efektiivsus on vahemikus 80-90%. Efektiivsus <70% v\u00e4ljendab suurenevat riski
  keskkonnale (suurenenud kaod \u00f5hku, mulda, vette). Efektiivsus >100% v\u00e4ljendab
  puuduj\u00e4\u00e4giga majandamist (OECD, 2007).\\n\\np\u00f5llumajandusministri
  m\u00e4\u00e4ruse nr 71 (14.07.2014) \\\"Eri t\u00fc\u00fcpi s\u00f5nniku toitainete
  sisalduse arvestuslikud v\u00e4\u00e4rtused, s\u00f5nnikuhoidlate mahu arvutamise
  metoodika ja p\u00f5llumajandusloomade loom\u00fchikuteks \u00fcmberarvutamise koefitsiendid\\\"
  lisades 3 ja 4 v\u00e4lja toodud toiteelementideks \u00fcmberarvutamise koefitsiente.\\n\\nKuna
  FADNi andmebaasis puuduvad liblik\u00f5ieliste kultuuride kasvatamise kohta nii
  detailsed andmed, et neid saaks kasutada l\u00e4mmastiku sisendi puhul liblik\u00f5ieliste
  kultuuride poolt seotud l\u00e4mmastiku koguste arvutamiseks, kasutati selleks PRIA
  2016. aasta p\u00f5llumassiivide registri andmeid.\\n\\nP\u00f5llumajandusloomade
  NPK v\u00e4ljundi arvutamisel v\u00f5eti arvesse loomade m\u00fc\u00fcki, omatarvet
  (k.a loonustasu), suunamist edasiseks t\u00f6\u00f6tlemiseks ja hukkumisi. M\u00fc\u00fcdud
  loomade puhul v\u00f5eti arvesse loomade m\u00fc\u00fcki lihaks, t\u00f5uaretuseks
  v\u00f5i edasiseks kasvatamiseks ning teadmata otstarbeks.\\n\\nLooma- ja taimekasvatussaaduste
  NPK v\u00e4ljundi arvutamisel arvestati toodangu m\u00fc\u00fcki, omatarvet (k.a
  loonustasu) ja suunamist edasiseks t\u00f6\u00f6tlemiseks.\\n\\nLoomade ostus\u00f6\u00f6t
  kajastub FADNi andmebaasis samuti ainult rahalises v\u00e4\u00e4rtuses ning andmed
  ostetud s\u00f6\u00f6tade koguste kohta puuduvad. Ostus\u00f6\u00f6da kohta on eraldi
  v\u00e4lja toodud: kontsentreeritud s\u00f6\u00f6t ning kore- ja mahlakas s\u00f6\u00f6t
  karjatatavatele loomadele, s\u00f6\u00f6dad sigadele, kodulindudele, v\u00e4ikeloomadele
  ja mesilastele. Selleks, et arvestada NPK sisendi koguseid ostus\u00f6\u00f6tade
  puhul, kasutati Maamajanduse Infokeskuse poolt 2016. aastal v\u00e4lja antud infomaterjalis
  \\\"Kattetulu arvestused taime- ja loomakasvatuses\\\" toodud vastavate loomade
  s\u00f6\u00f6davajaduse arvestusi.\\n\\nAastatel 2004-2014 teostatud toiteelementide
  bilansi uuringu tulemused ei ole seoses valimi muutumise, tulemuste laiendamise
  ja osalise metoodika kohandamise t\u00f5ttu v\u00f5rreldavad 2015. ja 2016. aasta
  tulemustega. Varasemate aastate tulemusi kasutatakse MAK 2014-2020 perioodi l\u00f5pus
  bilansin\u00e4itajate \u00fcldise trendi v\u00e4ljatoomisel.\\n\\nKuna FADNi andmetel
  arvutati NPK bilansin\u00e4itajad kaalutud keskmistena p\u00f5llumajandustootja
  kohta, annab see v\u00f5imaluse \u00fcldistada saadud tulemusi gruppi kuuluvate
  tootjate \u00fcldkogumi kohta ja Eesti keskmisena arvutatud bilansin\u00e4itajaid
  p\u00f5llumajandussektorile tervikuna. K\u00f5ik 2015. ja 2016. aasta uuringu tulemused
  esitatakse aruandes laiendatud andmetena.\\n\\nP\u00f5hjalikumalt anal\u00fc\u00fcsitakse
  aruande tulemuste osas p\u00f5llumajandusettev\u00f5tete NPK bilansin\u00e4itajaid
  toetust\u00fc\u00fcpide l\u00f5ikes ja nitraaditundlikul alal ning v\u00e4ljaspool
  nitraaditundlikku ala tegutsevates ettev\u00f5tetes.\\n\\nToetust\u00fc\u00fcbiti
  anal\u00fc\u00fcsitakse keskkonnas\u00f5braliku majandamise toetust (KSM) ja mahep\u00f5llumajandusliku
  tootmise toetust (MAHE) taotlenud tootjate NPK bilansin\u00e4itajaid. V\u00f5rdlusgrupina
  kasutatakse \u00fchtset pindalatoetust (\u00dcPT) taotlenud tootjate tulemusi (p\u00f5llumajanduskeskkonna
  toetuseid mittetaotlenud tootjad). Samas osas esitatakse ka k\u00f5igi FADNi p\u00f5llumajandustootjate
  \u00fcldkogumisse kuuluvate tootjate keskmised (Eesti keskmine) tulemused.\\n\\nNitraaditundlikul
  alal (NTA) tegutsevate ettev\u00f5tete keskmiste NPK bilansin\u00e4itajate anal\u00fc\u00fcsimisel
  v\u00f5etakse v\u00f5rdlusgrupiks v\u00e4ljaspool NTA ala tegutsevate FADNi valimi
  ettev\u00f5tete  keskmised tulemused (vp NTA).\\n\\n2016. aastal oli KSM ettev\u00f5tteid
  p\u00f5llumajandustootjate \u00fcldkogumis 1468 ja valimis esindas neid 241 ettev\u00f5tet.
  MAHE ettev\u00f5tete arv \u00fcldkogumis oli 1229 ja neid esindas valimis 139 ettev\u00f5tet.
  \u00dcPT ettev\u00f5teteid oli \u00fcldkogumis 2228, valimis esindas neid 100 ettev\u00f5tet.
  Eesti keskmine arvutati FADNi kogu p\u00f5llumajandustootjate \u00fcldkogumi (7610
  tootjat) kohta ja valimis esindas neid 661 ettev\u00f5tet.\\n\\nNTA ala ettev\u00f5tete
  arv \u00fcldkogumis oli 2016. aastal 513 ja neid esindas valimis 58 ettev\u00f5tet.
  V\u00e4ljaspool NTA ala tegutsevaid ettev\u00f5tteid oli \u00fcldkogumis 7097, valimis
  esindas neid 603 ettev\u00f5tet.\\n\\nTaluv\u00e4rava toiteelementide bilanss KSM,
  MAHE, \u00dcPT toetust\u00fc\u00fcbi ettev\u00f5tetes ja Eesti keskmisena\\n\\nKeskmiselt
  oli KSM ettev\u00f5tte kasutuses 2016. aastal 304 ha, MAHE ettev\u00f5ttel 104 ha
  ja \u00dcPT kasutuses 58 ha p\u00f5llumajandusmaad. Eesti keskmine ettev\u00f5te
  kasutas 123 ha p\u00f5llumajandusmaad. KSM ettev\u00f5te kasvatas keskmiselt 73
  loom\u00fchikut, MAHE ettev\u00f5te 23 l\u00fc, \u00dcPT 11 l\u00fc ja Eesti keskmine
  ettev\u00f5te 33 l\u00fc p\u00f5llumajandusloomi.\\n\\nL\u00e4mmastiku bilanss varieerus
  2016. aastal toetust\u00fc\u00fcbiti ja Eesti keskmisena vahemikus 9-51 kg/ha, fosfori
  bilanss 1-(-2) kg/ha kaaliumi bilanss vahemikus (-7)-11 kg/ha (Joonis 1).\\n\\nKSM
  ettev\u00f5tete N bilanss oli 2016. aastal \u00fcsna k\u00f5rge (51 kg/ha). Keskkonna
  seisukohalt v\u00f5ib k\u00f5rge N \u00fclej\u00e4\u00e4giga majandamine suurendada
  l\u00e4mmastiku v\u00f5imaliku leostumise ohtu mulda ja vette ning lendumist \u00f5hku.
  MAHE ettev\u00f5tete N bilanss oli madal (9 kg/ha).\\n\\nMulla normaalseks toimimiseks
  peetakse igati kohaseks, et l\u00e4mmastiku bilanss on m\u00f5\u00f5dukalt positiivne,
  kuna lisaks kultuurtaimedele vajab ka mulla v\u00e4ga mitmekesine makro- ja mikrofauna
  oma elutegevuseks l\u00e4mmastikku ning eluslooduses on v\u00f5imatu saavutada olukorda,
  kus l\u00e4mmastiku leostumine v\u00f5i lendumine t\u00e4ielikult puuduks (Astover,
  2015)\\n\\nV\u00f5rreldes 2015. aastaga suurenes 2016. aastal N bilanss KSMi, \u00dcPT
  ja Eesti keskmisena, (kasv KSM 14 kg/ha (38%), \u00dcPT 6 kg/ha (35%), Eesti keskmisena
  6 kg/ha (18%)), bilanss v\u00e4henes MAHE ettev\u00f5tetes (v\u00e4henemine 4 kg/ha
  (31%)).\\n\\nFosfori bilanss oli 2016. aastal minimaalselt positiivne (1 kg/ha)
  KSMi ettev\u00f5tetes ja Eesti keskmisena, \u00dcPT ja MAHE puhul negatiivne ((-1)
  kg/ha ja (-2) kg/ha).\\n\\nV\u00f5rreldes 2015. aastaga paranes fosfori bilanss
  2016. aastal KSM ja \u00dcPT ettev\u00f5tetes (kasv 2 kg/ha) ning Eesti keskmisena
  (kasv 1 kg/ha), MAHE ettev\u00f5tetes s\u00fcvenes fosfori defitsiit (v\u00e4henemine
  1 kg/ha).\\n\\n2016. aastal majandati positiivse kaaliumi bilansiga KSMi puhul ja
  Eesti keskmisena (11 kg/ha), negatiivse K bilansiga \u00dcPT ja MAHE ettev\u00f5tetes
  ((-2) kg/ha ja (-7) kg/ha).\\n\\nV\u00f5rreldes 2015. aastaga, suurenes kaaliumi
  bilanss 2016. aastal KSM ettev\u00f5tetes (kasv 2 kg/ha) ja Eesti keskmisena (kasv
  3 kg/ha), \u00dcPT ja MAHE puhul s\u00fcvenes negatiivne K bilanss (v\u00e4henemine
  2 kg/ha ja 4 kg/ha).\\n\\n\u00dche aasta toiteelementide \u00fcle- v\u00f5i puuduj\u00e4\u00e4k
  v\u00f5imaldab hinnata NPK leostumise riski konkreetsel aastal, pikema perioodi
  tulemuste k\u00f5rvutamine m\u00f5ju mulla viljakusele.\\n\\n2016. aastal varieerus
  N sisend toetust\u00fc\u00fcbiti ja Eesti keskmisena vahemikus 26-114 kg/ha P sisend
  1-12 kg/ha ja K sisend 2-32 kg/ha (Joonis 2).\\n\\nNPK sisend oli k\u00f5rgem KSM
  ettev\u00f5tetes. Eriti madal oli P ja K sisend MAHE ettev\u00f5tetes (P sisend
  1 kg/ha, K sisend 2 kg/ha).\\n\\nNPK sisend p\u00fcsis 2016. aastal KSM ettev\u00f5tete
  ja Eesti keskmisena 2015. aasta tasemel. \u00dcPT ettev\u00f5tetesse sisse ostetud
  saaduste NPK kogused suurenesid 2016. aastal v\u00f5rreldes 2015. aastaga (N sisendi
  kasv 16 kg/ha (28%), P 2 kg/ha (33%) ja K 5 kg/ha (29%)). MAHE ettev\u00f5tete NPK\\n\\nsisend
  v\u00e4henes 2016. aastal (N sisendi v\u00e4henemine 4 kg/ha (16%), P 1 kg/ha (50%)
  ja K 4 kg/ha (68%)).\\n\\nN v\u00e4ljund varieerus 2016. aastal toetust\u00fc\u00fcbiti
  ja Eesti keskmisena vahemikus 17-63 kg/ha, P v\u00e4ljund 3-11 kg/ha ja K v\u00e4ljund
  9-24 kg/ha (Joonis 2).\\n\\nV\u00f5rreldes 2015. aastaga v\u00e4henes ettev\u00f5tetest
  toodanguga v\u00e4ljam\u00fc\u00fcdud NPK toiteelementide kogus 2016. aastal KSMi
  ja Eesti keskmisena (KSM N v\u00e4ljundi v\u00e4henemine 10 kg/ha (14%), P 2 kg/ha
  (15%), K 2 kg/ha (9%); Eesti keskmisena N v\u00e4ljundi v\u00e4henemine 6 kg/ha
  (11%), P 2 kg/ha (20%), K 2 kg/ha (10%). MAHE ettev\u00f5tetes p\u00fcsis v\u00e4ljam\u00fc\u00fck
  \u00fcsna 2015. aasta tasemel. \u00dcPT ettev\u00f5tte p\u00f5llumajandustoodangu
  v\u00e4ljam\u00fc\u00fck suurenes 2016. aastal (kasv N 10 kg/ha (24%), P 1 kg/ha
  (14%) ja K 8 kg/ha (50%)).\\n\\nKuna KSM ettev\u00f5tetes ja Eesti keskmisena m\u00fc\u00fcdi
  2016.aastal p\u00f5llumajandustoodangut v\u00e4hem kui 2015. aastal, sisseostetud
  saaduste toiteelementide kogus p\u00fcsis 2015. aasta tasemel, siis 2016. aastal
  NPK bilanss suurenes. Kuigi \u00dcPT ettev\u00f5tetes suurenes 2016. aastal nii
  ettev\u00f5tetesse sisse ostetud kui v\u00e4lja m\u00fc\u00fcdud saaduste kogus,
  v\u00f5rreldes 2015. aastaga, j\u00e4i v\u00e4ljam\u00fc\u00fcgi kasv 2016. aastal
  v\u00e4iksemaks kui sisseostu kasv ja NPK bilanss suurenes ka \u00dcPT puhul. MAHE
  ettev\u00f5tetes v\u00e4henes 2016. aastal sisseostetud saaduste kogus v\u00f5rreldes
  2015. aastaga, toodangu realiseerimine p\u00fcsis \u00fcsna samal tasemel 2015.
  aastaga ja bilanss v\u00e4henes.\\n\\n2016. aasta oli p\u00f5llumajandustootjatele
  keeruline, ebasoodsate ilmastikuolude t\u00f5ttu saadi taimekasvatuses ligi kolmandiku
  v\u00f5rra v\u00e4hem saaki kui 2015. aastal, samuti olid madalamad taimekasvatustoodangu
  realiseerimishinnad. Loomakasvatuses v\u00e4henes loomade arv, osad tootjad l\u00f5petasid
  tootmise, langesid loomakasvatustoodangu kokkuostuhinnad, sigade sektorit m\u00f5jutas
  lisaks madalale hinnatasemele Aafrika sigade katk (http://www.maainfo.ee/data/trykis/aastaraamat/FADN2016.pdf).\\n\\nNPK
  sisendi ja v\u00e4ljundi jagunemine 2016. aastal toetust\u00fc\u00fcbiti ja Eesti
  keskmisena on esitatud j\u00e4rgnevatel joonistel (Joonis 3, Joonis 4, Joonis 5).\\n\\nNPK
  sisendi jagunemine erines toetust\u00fc\u00fcbiti. KSM ja \u00dcPT ettev\u00f5tetes
  ning Eesti keskmisena moodustasid NPK toiteelementide sisendist peamise osa sisseostetud
  mineraalv\u00e4etised. 2016. aastal moodustasid mineraalv\u00e4etised KSM ettev\u00f5tetes
  NPK sisendist 65-73% (2015. a 68-83%) \u00dcPT ettev\u00f5tetes 58-85% (2015. a
  65-90%), Eesti keskmisena 56-63% (2015. a 57-67%).\\n\\nV\u00f5rreldes 2015. aastaga
  v\u00e4henes 2016. aastal mineraalv\u00e4etiste osakaal (protsentides) NPK sisendist
  KSM seireettev\u00f5tetes ja Eesti keskmisena ning suurenes \u00dcPT ettev\u00f5tetes.\\n\\nKui
  k\u00f5rvutada toetust\u00fc\u00fcbiti ettev\u00f5tetesse ostetud NPK mineraalv\u00e4etiste
  koguseid kilogrammides p\u00f5llumajandusmaa hektari kohta, ilmneb et v\u00e4etiste
  kogused p\u00fcsisid 2016. aastal 2015. aastaga v\u00f5rreldes \u00fcsna samal tasemel
  KSM ettev\u00f5tetes ja Eesti keskmisena ja suurenesid \u00dcPT ettev\u00f5tetes
  (Lisa 8). Kuna ei ole teada kui suurt pinda ettev\u00f5tetes tegelikult v\u00e4etati
  ja millist v\u00e4etisnormi ha kohta kasutati, ei saa olemasolevate andmete p\u00f5hjal
  enamat v\u00e4lja tuua.\\n\\nOsaliselt v\u00f5imaldab mineraalsete l\u00e4mmastikv\u00e4etiste
  kasutamist v\u00e4hendada liblik\u00f5ieliste suuremal pinnal kasvatamine.\\n\\nMAHE
  ettev\u00f5tetes mineraalv\u00e4etiseid ei kasutata, peamise osa l\u00e4mmastiku
  sisendist moodustas liblik\u00f5ieliste poolt seotud l\u00e4mmastik (65%) (2015.
  a 56%). KSM ettev\u00f5tetes moodustas\\n\\nliblik\u00f5ieliste osakaal N sisendist
  2016. aastal 14% (2015. a 14%), \u00dcPT puhul 21% (2015. a 18%) ja Eesti keskmisena
  16% (2015. a 16%).\\n\\n*Muud taimekasvatussaadused- kartul kores\u00f6\u00f6t,
  k\u00f6\u00f6givili, puuvilja- ja marjaaiad, p\u00f5hk\\n\\nJoonis 3. L\u00e4mmastiku
  sisendi ja v\u00e4ljundi jagunemine toetust\u00fc\u00fcbiti ja Eesti keskmisena
  2016. aastal\\n\\n*Muud taimekasvatussaadused- kartul kores\u00f6\u00f6t, k\u00f6\u00f6givili,
  puuvilja- ja marjaaiad, p\u00f5hk\\n0\\n20\\n40\\n60\\n80\\n100\\nKSM P\\nsisend\\nMAHE
  P\\nsisend\\n\u00dcPT P\\nsisend\\nEesti\\nkeskmine\\nP sisend\\nKSM P\\nv\u00e4ljund\\nMAHE
  P\\nv\u00e4ljund\\n\u00dcPT P\\nv\u00e4ljund\\nEesti\\nkeskmine\\nP v\u00e4ljund\\n%\\np\u00f5llumajandusloomad,\\norgaaniline
  v\u00e4etis\\nloomakasvatussaadused\\nmuud\\ntaimekasvatussaadused*\\nkaunvili\\n\u00f5likultuurid\\nteravili\\norgaaniline
  v\u00e4etis, seeme,\\nloomad\\nloomas\u00f6\u00f6t\\nmineraalv\u00e4etis\\n\\nJoonis
  4. Fosfori sisendi ja v\u00e4ljundi jagunemine toetust\u00fc\u00fcbiti ja Eesti
  keskmisena 2016. aastal\\n\\n0\\n20\\n40\\n60\\n80\\n100\\nKSM K\\nsisend\\nMAHE
  K\\nsisend\\n\u00dcPT K\\nsisend\\nEesti\\nkeskmine K\\nsisend\\nKSM K\\nv\u00e4ljund\\nMAHE
  K\\nv\u00e4ljund\\n\u00dcPT K\\nv\u00e4ljund\\nEesti\\nkeskmine K\\nv\u00e4ljund\\n%\\np\u00f5llumajandusloomad,\\norgaaniline
  v\u00e4etis\\nloomakasvatussaadused\\nmuud taimekasvatussaadused*\\nkaunvili\\n\u00f5likultuurid\\nteravili\\norgaaniline
  v\u00e4etis, seeme,\\nloomad\\nmineraalv\u00e4etis\\nloomas\u00f6\u00f6t\\n\\n*Muud
  taimekasvatussaadused- kartul kores\u00f6\u00f6t, k\u00f6\u00f6givili, puuvilja-
  ja marjaaiad, p\u00f5hk\\n\\nJoonis 5. Kaaliumi sisendi ja v\u00e4ljundi jagunemine
  toetust\u00fc\u00fcbiti ja Eesti keskmisena 2016. aastal\\n\\nSisseostetud loomas\u00f6\u00f6t
  moodustas olenevalt toetust\u00fc\u00fcbist l\u00e4mmastiku sisendist 10-20%, fosfori
  sisendist 24-59% ja kaaliumi sisendist 13-60%.\\n\\nToetust\u00fc\u00fcbiti P ja
  K sisendi ja v\u00e4ljundi protsentides jagunemisest \u00f5ige \u00fclevaate saamiseks
  tuleb protsentidena esitatud tulemusi k\u00f5rvutada P ja K sisendi ja -v\u00e4ljundi
  (kg/ha kohta) n\u00e4itajatega, n\u00e4iteks oli MAHE ettev\u00f5tete P sisend ainult
  1 kg/ha ja P v\u00e4ljund 3 kg/ha kohta (Joonis 2, Joonis 3, Joonis 4).\\n\\nSisseostetud
  orgaanilise v\u00e4etise, seemne ja loomade osakaal oli NPK sisendist v\u00e4ike
  KSM, \u00dcPT ettev\u00f5tetes ja Eesti keskmisena (NPK sisendist 1,5-3,7%), suurem
  MAHE ettev\u00f5tetes (NPK sisendist 6-40%).\\n\\nN sisendi puhul v\u00f5eti arvesse
  veel sadematest saadav l\u00e4mmastik, mis s\u00f5ltus p\u00f5llumajandusmaa suurusest
  (N sidumine sademetega 5 kg/ha).\\n\\nNPK v\u00e4ljundi jagunemine erines samuti
  toetust\u00fc\u00fcbiti. Kuna 2015. aasta kohta taimekasvatussaaduste v\u00e4ljundi
  jagunemist detailsemalt ei anal\u00fc\u00fcsitud, esitatakse andmed 2016. aasta
  tulemuste kohta.\\n\\n2016. aastal moodustasid NPK toiteelementide v\u00e4ljundist
  peamise osa ettev\u00f5tetest v\u00e4ljam\u00fc\u00fcdud taimekasvatussaadused.
  KSM ja \u00dcPT ettev\u00f5tetes ning Eesti keskmisena m\u00fc\u00fcdi k\u00f5ige
  rohkem teravilja, MAHE ettev\u00f5tetes oli teravilja m\u00fc\u00fck v\u00e4iksem.
  Teraviljad moodustasid KSM ettev\u00f5tetes NPK v\u00e4ljundist 36-53%, \u00dcPT
  25-54%, MAHE ettev\u00f5tetes 16-37% ja Eesti keskmisena 37-54%.\\n\\n2016. aastal
  m\u00fc\u00fcdud muud taimekasvatussaadused (kartul, kores\u00f6\u00f6t, k\u00f6\u00f6givili,
  puuvilja- ja marjaaedade toodang, p\u00f5hk kokku) moodustasid KSM ettev\u00f5tete
  NPK v\u00e4ljundist 8-11%, \u00dcPT 2061%, MAHE puhul 27-70% ja Eesti keskmisena
  11-37%. Muude taimekasvatussaaduste m\u00fc\u00fcgist moodustasid valdava osa kores\u00f6\u00f6dad,
  kuna heintaimed sisaldavad rikkalikult kaaliumi, v\u00e4ljendub see ka suuremas
  osakaalus K v\u00e4ljundist.\\n\\nM\u00fc\u00fcdud toodangust oli \u00f5likultuuride
  osakaal 2016. aastal suurem KSM ettev\u00f5tetes, kaunviljade m\u00fc\u00fcgi osakaal
  MAHEs.\\n\\nLoomakasvatussaaduste (piim ja piimatooted, munad, mesi), p\u00f5llumajandusloomade
  ja s\u00f5nniku m\u00fc\u00fck kokku moodustas toetust\u00fc\u00fcpide ja Eesti
  keskmisena alla 10% toodangu m\u00fc\u00fcgist.\\n\\nN kasutamise efektiivsus varieerus
  2016. aastal toetust\u00fc\u00fcbiti ja Eesti keskmisena vahemikus 56-69%, P efektiivsus
  90- 311% ja K efektiivsus 61-441% (Joonis 6).\\n\\nKSM ettev\u00f5tete ja Eesti
  keskmine N ja K kasutamise efektiivsus oli 2016. aastal madal (N puhul 56% ja K
  puhul vastavalt 65% ja 61%), P kasutamise efektiivsus oli k\u00f5rge ehk keskkonda
  s\u00e4ilitaval tasemel (vastavalt 90% ja 91%). Madala N efektiivsusega majandamisel
  p\u00fcsib oht keskkonnale (v\u00f5imalikud kaod vette, \u00f5hku, mulda), kaaliumi
  madal kasutamise efektiivsus keskkonnale otsest kahjulikku m\u00f5ju ei avalda.\\n\\n\u00dcPT
  ja MAHE ettev\u00f5tete N kasutamise efektiivsus oli 2016. aastal k\u00fcll k\u00f5rgem
  kui KSM ettev\u00f5tetes ja Eesti keskmisena, aga keskkonna seisukohalt oli efektiivsus
  madal (\u00dcPT N efektiivsus 69%, MAHE 66%), P ja K kasutamise efektiivsus >100%.
  \u00dcle 100% efektiivsuse korral majandatakse puuduj\u00e4\u00e4giga, n\u00e4iteks
  2016. aastal oli MAHE ettev\u00f5tetes toodangu m\u00fc\u00fcgiga v\u00e4lja viidud
  kaaliumi kogus \u00fcle nelja korra suurem sisseostetud saaduste kaaliumi kogusest
  (K efektiivsus 441%). Pikaajaline P ja K puuduj\u00e4\u00e4giga majandamine v\u00f5ib
  edaspidi p\u00f5hjustada mullaviljakuse alanemist ja takistada soovitud saakide
  saamist.\\n\\nV\u00f5rreldes 2015. aastaga paranes 2016. aastal MAHE ettev\u00f5tete
  N kasutamise efektiivsus (kasv 8%), KSM, \u00dcPT ja Eesti keskmisena N kasutamise
  efektiivsus langes 2016. aastal (v\u00e4henemine KSM 10%, \u00dcPT 1%, Eesti keskmisena
  6%). P kasutamise efektiivsus paranes 2016. aastal KSM ettev\u00f5tetes (17%) ja
  Eesti keskmisena (10%) ning halvenes \u00dcPT ja MAHE ettev\u00f5tetes (s\u00fcvenes
  P defitsiidiga majandamine). K kasutamise efektiivsus halvenes k\u00f5ikide toetust\u00fc\u00fcpide
  arvestuses ja Eesti keskmisena.\\n\\n2016. aastal olid NPK bilansin\u00e4itajad
  k\u00f5rgemad KSM ettev\u00f5tetes, v\u00f5rreldes MAHE ja \u00dcPT ettev\u00f5tetega.
  Osaliselt tulenes see toetust\u00fc\u00fcbiti erinevast maakasutusest. KSM ettev\u00f5tetes
  kasvatati teravilja 48% p\u00f5llumajandusmaast, MAHE ettev\u00f5tetes 20% ja \u00dcPT
  ettev\u00f5tetes 39%. Teisi p\u00f5llukultuure (tehnilised kultuurid, kaunviljad)
  kasvatati samuti suuremal pinnal KSM ettev\u00f5tetes (18% p\u00f5llumajandusmaast)
  kui MAHE ja \u00dcPT ettev\u00f5tetes (9% ja 11%). Toetust\u00fc\u00fcbiti\\n\\nerines
  ka p\u00fcsirohumaade (>5a rohumaad) osakaal kogu maakasutusest, KSM ettev\u00f5tetes
  oli p\u00fcsirohumaid 10%, MAHE ettev\u00f5tetel 42% ja \u00dcPT tootjatel 13%.
  Sisuliselt aitab see m\u00f5ista, miks KSM ettev\u00f5tetes kasutati sisendina rohkem
  mineraalv\u00e4etiseid. Suuremal pinnal p\u00f5llukultuuride kasvatamisega kaasnes
  suurem mineraalv\u00e4etiste kasutamine.\\n\\nNPK bilansin\u00e4itajad s\u00f5ltusid
  toetust\u00fc\u00fcbiti veel ettev\u00f5tete tootmise spetsiifikast, ettev\u00f5tete
  asukohast, suurusest, ilmastikust, mullastikust, saagikusest, kehtivatest keskkonnan\u00f5uetest,
  tootmisvahendite ja toodangu realiseerimishindade muutumisest jne.\\n\\nMAK 2014-2020
  perioodil on KSM tootjatele kehtestatud toetuse saamiseks erinevad n\u00f5uded,
  mille t\u00e4itmine peaks suunama tootjaid loodushoidlikumale majandamisele. V\u00e4etiste
  kasutamise kvaliteedi parandamisele peaksid aitama kaasa viljavahelduse, v\u00e4etusplaani
  koostamise, mullaproovide tulemuste arvesse v\u00f5tmise ja koolitustel osalemise
  n\u00f5uete t\u00e4itmine. KSM tootjatel 15% ja MAHE tootjatel 20% pinnal liblik\u00f5ieliste
  kasvatamine v\u00f5imaldab m\u00f5nev\u00f5rra v\u00e4hendada mineraalv\u00e4eiste
  kasutamist. Sertifitseeritud 15% teravilja seemne kasutamine v\u00f5imaldab t\u00e4nu
  seemnete k\u00f5rgele eluj\u00f5ule, puhtusele ja idanevusele tagada taimede kiirema
  t\u00e4rkamise ja mullast parema toitainete omastamise.\\n\\nKokkuv\u00f5ttes majandati
  2016. aastal KSM toetust\u00fc\u00fcbi ettev\u00f5tetes ja Eesti keskmisena positiivse
  NPK bilansiga, l\u00e4mmastiku ja kaaliumi kasutamise efektiivsus oli ettev\u00f5tetes
  madal, fosfori efektiivsus s\u00e4\u00e4stva tootmise tasemel. V\u00f5rreldes 2015.
  aastaga suurenes 2016. aastal NPK bilanss, NPK sisend p\u00fcsis 2015. aasta tasemel,
  v\u00e4henes toodangu v\u00e4ljam\u00fc\u00fck ning halvenes N ja K kasutamise efektiivsus,
  paranes P kasutamise efektiivsus.\\n\\nMAHE toetust\u00fc\u00fcbi ettev\u00f5tetes
  majandati 2016. aastal positiivse l\u00e4mmastiku bilansiga ja negatiivse fosfori
  ja kaaliumi bilansiga, N kasutamise efektiivsus oli madal. V\u00f5rreldes 2015.
  aastaga v\u00e4henes 2016. aastal NPK bilanss ja sisend, p\u00f5llumajandustoodangu
  v\u00e4ljam\u00fc\u00fck p\u00fcsis 2015. aasta tasemel, paranes N kasutamise efektiivsus,
  halvenes P ja K kasutamise efektiivsus.\\n\\n\u00dcPT ettev\u00f5tetes oli 2016
  aastal l\u00e4mmastiku bilanss positiivne, fosfori ja kaaliumi bilanss negatiivsed,
  l\u00e4mmastiku kasutamise efektiivsus madal, P ja K kasutamise efektiivsus >100%.
  V\u00f5rreldes 2015. aastaga, suurenes NPK sisend ja toodangu v\u00e4ljam\u00fc\u00fck,
  halvenes NPK kasutamiseefektiivsus\\n\\nTaluv\u00e4rava toiteelementide bilanss
  nitraaditundlikul alal ja v\u00e4ljaspool nitraaditundlikku ala paiknevates ettev\u00f5tetes\\n\\n2016.aastal
  oli NTA 4 alal tegutseva ettev\u00f5tte kasutuses keskmiselt 211 ha ja v\u00e4ljaspool
  NTA ala 116 ha p\u00f5llumajandusmaad. NTA ala ettev\u00f5te kasvatas keskmiselt
  70 loom\u00fchikut ja v\u00e4ljaspool NTA ala tegutsev ettev\u00f5te 30 l\u00fc
  p\u00f5llumajandusloomi.\\n\\nNPK bilanss oli 2016. aastal k\u00f5rgem NTA alal
  kui v\u00e4ljaspool NTAd tegutsevates ettev\u00f5tetes. NTA ala seireettev\u00f5tte
  keskmine N bilanss oli 51 kg/ha, mis on \u00fcsna k\u00f5rge ja v\u00e4ljaspool
  NTAd 37 kg/ha (Joonis 7). Keskkonna seisukohalt v\u00f5ib k\u00f5rge N \u00fclej\u00e4\u00e4giga
  majandamine suurendada l\u00e4mmastiku v\u00f5imaliku leostumise ohtu mulda ja vette
  ning lendumist \u00f5hku.\\n\\n4 Nitraaditundlikuks loetakse ala, kus p\u00f5llumajanduslik
  tegevus on p\u00f5hjustanud v\u00f5i v\u00f5ib p\u00f5hjustada nitraatioonisisalduse
  p\u00f5hjavees \u00fcle 50 mg/l v\u00f5i mille pinnaveekogud on p\u00f5llumajanduslikust
  tegevusest tingituna eutrofeerunud v\u00f5i eutrofeerumisohus.\\n\\nV\u00f5rreldes
  2015. aastaga oli N bilanss 2016. aastal NTA alal 16 kg/ha (46%) ja v\u00e4ljaspool
  NTA ala 4 kg/ha (12%) k\u00f5rgem.\\n\\nP ja K bilanss oli NTA alal ja v\u00e4ljaspool
  NTA ala asuvates ettev\u00f5tetes 2016. aastal positiivne, (NTA P bilanss 2 kg/ha,
  K bilanss 13 kg/ha; v\u00e4ljaspool NTAd P 1 kg/ha ja K 10 kg/ha). V\u00f5rreldes
  2015. aastaga P ja K bilanss valdavalt suurenes 2016. aastal nii NTA alal kui v\u00e4ljaspool
  NTAd.\\n\\nNPK sisend ja -v\u00e4ljund oli k\u00f5ikide toiteelementide arvestuses
  2016. aastal k\u00f5rgem NTA alal kui v\u00e4ljaspool NTA ala. M\u00f5lemal juhul
  p\u00fcsis sisseostetud saaduste toiteelementide kogus 2016. aastal enamv\u00e4hem
  2015. aastaga samal tasemel, v\u00e4ljam\u00fc\u00fcdud toodangu toiteelementide
  kogus aga v\u00e4henes. P\u00f5llumajandustoodangu v\u00e4ljam\u00fc\u00fcgi langus
  oli 2016. aastal suurem NTA alal kui v\u00e4ljaspool NTAd.\\n\\nToodangu m\u00fc\u00fck
  v\u00e4henes v\u00f5rreldes 2015. aastaga, kuna 2016. aasta ebasoodsates ilmastikutingimustes
  v\u00e4henes taimekasvatussaaduste saak ja loomakasvatustoodang, samuti olid madalamad
  nii toodangu kokkuostu kui realiseerimishinnad.\\n\\nNPK sisendi ja v\u00e4ljundi
  jagunemine NTA ja v\u00e4ljaspool NTAd tegutsevates ettev\u00f5tetes on esitatud
  j\u00e4rgneval joonisel (Joonis 8).\\n\\nPeamise osa NPK toiteelementide sisendist
  moodustasid sisseostetud v\u00e4etised. 2016. aastal moodustasid mineraalv\u00e4etised
  NTA ettev\u00f5tetes NPK sisendist 63-76% (2015. a, 61- 72%) v\u00e4ljaspool NTAd
  paiknevates ettev\u00f5tetes 55-62% (2015.a 56-66%). V\u00e4etiste osat\u00e4htsus
  NPK sisendist oli suurem NTA ala ettev\u00f5tetes kui v\u00e4ljaspool NTAd.\\n\\nV\u00f5rreldes
  2015. aastaga suurenes NTA ala ettev\u00f5tetes 2016. aastal k\u00fcll sisseostetud
  mineraalv\u00e4etiste osakaal NPK sisendist protsentides, kuid NPK mineraalv\u00e4etiste
  kogus kilogrammides p\u00f5llumajandusmaa hektari kohta suurenes ainult N mineraalv\u00e4etiste
  arvestuses\\n\\n(kasv 4 kg/ha (3%)). NTA ala P ja K mineraalv\u00e4etiste kogused
  ning v\u00e4ljaspool NTA ala sisseostetud NPK mineraalv\u00e4etiste kogused hektari
  kohta v\u00e4henesid 2016. aastal.\\n\\nNTA alal tegutsevate ettev\u00f5tete suurem
  mineraalv\u00e4etiste osakaal NPK sisendist tulenes osaliselt maakasutusest. 2016.
  aastal kasvatati NTA seirealal teravilja 48% ja teisi p\u00f5llukultuure (tehnilised
  kultuurid, kaunviljad) 14% p\u00f5llumajandusmaast v\u00e4ljaspool NTA ala oli teravilja
  kasvupind 38% ja teiste kultuuride kasvupind 14%. P\u00fcsirohumaade (>5a rohumaad)
  osakaal moodustas NTA maakasutusest 11%, v\u00e4ljaspool NTAd 24%. Suuremal pinnal
  p\u00f5llukultuuride kasvatamisega kaasnes suuremas koguses mineraalv\u00e4etiste
  kasutamine.\\n\\n2016. aastal moodustas NPK sisendist arvestatava osa veel sisseostetud
  loomas\u00f6\u00f6t, NTA ettev\u00f5tetes 17-29% ja v\u00e4ljaspool NTA ala 21-39%.\\n\\nLiblik\u00f5ieliste
  poolt seotud l\u00e4mmastiku osakaal moodustas NTA ala N sisendist 14% ja v\u00e4ljaspool
  NTAd 17%. Suuremal pinnal liblik\u00f5ieliste kasvatamine v\u00f5imaldab osaliselt
  v\u00e4hendada mineraalv\u00e4etiste kasutamist.\\n\\nSisseostetud loomade, orgaanilise
  v\u00e4etise, seemnete ja sademete osa NPK sisendist j\u00e4i alla 10%. Sademetest
  saadav N kogus s\u00f5ltus p\u00f5llumajandusmaa pinnast.\\n\\n*Muud taimekasvatussaadused-
  kartul kores\u00f6\u00f6t, k\u00f6\u00f6givili, puuvilja- ja marjaaiad, p\u00f5hk\\n\\nJoonis
  8. Nitraaditundlikul alal ja v\u00e4ljaspool nitraaditundlikku ala paiknevate ettev\u00f5tete
  l\u00e4mmastiku, fosfori, kaaliumi sisendi ja v\u00e4ljundi jagunemine 2016. aastal.\\n\\nNTA
  alal ja v\u00e4ljaspool NTA ala tegutsevate ettev\u00f5tete v\u00e4lja m\u00fc\u00fcdud
  toodangust (NPK v\u00e4ljund) moodustasid 2016. aastal peamise osa taimekasvatussaadused
  (NTA 86-88%, vp NTAd 91-93%).\\n\\nSuurima osat\u00e4htsuse v\u00e4lja m\u00fc\u00fcdud
  taimekasvatustoodangu NPK toiteelementide kogusest moodustasid teraviljad (NTA 39-54%,
  vp NTAd 36-55%).\\n\\nMuud taimekasvatussaadused (kartul, kores\u00f6\u00f6t, k\u00f6\u00f6givili,
  puuvilja\u2013 ja marjaaedade toodang, p\u00f5hk kokku) moodustasid m\u00fc\u00fcdud
  toodangust, olenevalt toiteelemendist, NTA alal 6-31% ja v\u00e4ljaspool NTA ala
  9-38%. Peamise osa muud taimekasvatussaadused m\u00fc\u00fcgist moodustasid 2016.
  aastal\\n\\nkores\u00f6\u00f6dad. Kuna heintaimed sisaldavad rikkalikult kaaliumi,
  v\u00e4ljendus see ka suuremas osakaalus K v\u00e4ljundist.\\n\\nEttev\u00f5tetest
  v\u00e4lja m\u00fc\u00fcdava loomakasvatustoodangu (piim ja piimatooted, kanamunad,
  mesi, p\u00f5llumajandusloomad ja orgaanilise v\u00e4etis) osat\u00e4htsus kogu
  NPK v\u00e4ljundist j\u00e4i kordades v\u00e4iksemaks taimekasvatustoodangu m\u00fc\u00fcgist
  ja moodustas NTA alal 7-9%, v\u00e4ljaspool NTA ala 11-13%.\\n\\nN ja K kasutamise
  efektiivsus oli 2016. aastal madal nii NTA alal (N efektiivsus 54%, K 58%) kui ka
  v\u00e4ljaspool NTAd (N efektiivsus 56%, K 61%) (Joonis 9). Fosfori kasutamine oli
  s\u00e4\u00e4stva tootmise tasemel (NTA P efektiivsus 86%, vp NTA P efektiivsus
  92%).\\n\\nV\u00f5rreldes 2015. aastaga, halvenes 2016. aastal NTA alal ja v\u00e4ljaspool
  NTAd nii N kui K kasutamise efektiivsus (NTA N efektiivsuse v\u00e4henemine 14%,
  K 5%, vp NTA N efektiivsuse v\u00e4henemine 5%, K 9%). P kasutamise efektiivsus
  paranes v\u00e4ljaspool NTAd.\\n\\nKokkuv\u00f5ttes majandati 2016. aastal intensiivsemalt
  NTA alal kui v\u00e4ljaspool NTAd. NTA alal tegutsevate ettev\u00f5tete kasutuses
  oli rohkem p\u00f5llumajandusmaad, kasvatati rohkem p\u00f5llukultuure ja loomi,
  osteti suuremas koguses tootmiseks vajalikke sisendeid ja m\u00fc\u00fcdi rohkem
  toodangut kui v\u00e4ljaspool NTAd. V\u00f5rreldes 2015. aastaga p\u00fcsis NPK
  sisend NTA alal enamv\u00e4hem samal tasemel mis 2016. aastal, ebasoodsate ilmastiku
  tingimustes v\u00e4henes aga saak ja madalamate kokkuostuhindade tulemusel toodangu
  m\u00fc\u00fck, mist\u00f5ttu suurenes NPK bilanss ja langes toiteelementide kasutamise
  efektiivsus.\\n\\nKokkuv\u00f5te\\n\\n* 2017. aastal arvutati PMK \u201eTaluv\u00e4rava
  toiteelementide bilansi ja kasutuse uuringu\\\" tulemused 2016. aasta kohta FADNi
  andmetel, valimisse kuulus 661 ettev\u00f5tet, tulemused esitati laiendatud andmetena.\\n*
  2016. aastal varieerus l\u00e4mmastiku bilanss toetust\u00fc\u00fcbiti ja Eesti
  keskmisena vahemikus 951 kg/ha, fosfori bilanss 1-(-2) kg/ha ja kaaliumi bilanss
  vahemikus (-7)-11 kg/ha.\\n\\n* KSM ettev\u00f5tete N- bilanss oli 2016. aastal
  \u00fcsna k\u00f5rge (51 kg/ha). Keskkonna seisukohalt v\u00f5ib k\u00f5rge N- \u00fclej\u00e4\u00e4giga
  majandamine suurendada l\u00e4mmastiku v\u00f5imaliku leostumise ohtu mulda ja vette
  ning lendumist \u00f5hku. MAHE ettev\u00f5tete N- bilanss oli madal (9 kg/ha).\\n*
  Fosfori ja kaaliumi bilanss oli 2016. aastal positiivne KSMi ettev\u00f5tetes ja
  Eesti keskmisena, \u00dcPT ja MAHE puhul negatiivne.\\n* 2016. aastal varieerus
  N- sisend toetust\u00fc\u00fcbiti ja Eesti keskmisena vahemikus 26-114 kg/ha, P-
  sisend 1-12 kg/ha ja K- sisend 2-32 kg/ha. NPK- sisend oli k\u00f5rgem KSM ettev\u00f5tetes.
  Eriti madal oli P- ja K- sisend MAHE ettev\u00f5tetes (P- sisend 1 kg/ha, K- sisend
  2 kg/ha).\\n* N- v\u00e4ljund varieerus 2016. aastal toetust\u00fc\u00fcbiti ja
  Eesti keskmisena vahemikus 17-63 kg/ha, P- v\u00e4ljund 3-11 kg/ha ja K- v\u00e4ljund
  9-24 kg/ha.\\n* V\u00f5rreldes 2015. aastaga v\u00e4henes ettev\u00f5tetest toodanguga
  v\u00e4ljam\u00fc\u00fcdud NPK toiteelementide kogus 2016. aastal KSMi ja Eesti
  keskmisena. MAHE ettev\u00f5tetes p\u00fcsis v\u00e4ljam\u00fc\u00fck \u00fcsna
  2015. aasta tasemel. \u00dcPT ettev\u00f5tte p\u00f5llumajandustoodangu v\u00e4ljam\u00fc\u00fck
  suurenes 2016. aastal.\\n* 2016. aastal moodustasid KSM ja \u00dcPT ettev\u00f5tetes
  ning Eesti keskmisena NPK toiteelementide sisendist peamise osa sisseostetud mineraalv\u00e4etised
  (56-85%).\\n* MAHE ettev\u00f5tetes mineraalv\u00e4etiseid ei kasutata, peamise
  osa l\u00e4mmastiku sisendist moodustas 2016. aastal liblik\u00f5ieliste poolt seotud
  l\u00e4mmastik (65%), KSM ettev\u00f5tetes moodustas liblik\u00f5ieliste osakaal
  N sisendist 2016. aastal 14 %, \u00dcPT puhul 21% ja Eesti keskmisena 16%.\\n* 2016.
  aastal moodustasid KSM ja \u00dcPT ettev\u00f5tetes ning Eesti keskmisena NPK toiteelementide
  v\u00e4ljundist peamise osa ettev\u00f5tetest v\u00e4ljam\u00fc\u00fcdud teraviljad
  (25-54%) ja MAHEs muud taimekasvatussaadused (kartul, kores\u00f6\u00f6t, k\u00f6\u00f6givili,
  puuvilja- ja marjaaedade toodang, p\u00f5hk kokku) (27-70%).\\n* N- kasutamise efektiivsus
  varieerus 2016. aastal toetust\u00fc\u00fcbiti ja Eesti keskmisena vahemikus 56-69%,
  P- efektiivsus 90- 311% ja K- efektiivsus 61-441%.\\n* 2016. aastal oli NTA ala
  seireettev\u00f5tte keskmine N bilanss 51 kg/ha, v\u00e4ljaspool NTAd 37 kg/ha.
  P ja K bilanss oli ettev\u00f5tetes positiivne.\\n* NPK sisend ja -v\u00e4ljund
  oli k\u00f5ikide toiteelementide arvestuses 2016. aastal k\u00f5rgem NTA alal kui
  v\u00e4ljaspool NTA ala. M\u00f5lemal juhul p\u00fcsis sisseostetud saaduste toiteelementide
  kogus 2016. aastal enamv\u00e4hem 2015. aastaga samal tasemel, v\u00e4ljam\u00fc\u00fcdud
  toodangu toiteelementide kogus  v\u00e4henes.\\n* 2016. aastal moodustasid peamise
  osa NPK toiteelementide sisendist sisseostetud mineraalv\u00e4etised, NTA ettev\u00f5tetes
  NPK sisendist 63-76%, v\u00e4ljaspool NTAd paiknevates ettev\u00f5tetes 55-62%.\\n*
  V\u00e4lja m\u00fc\u00fcdud toodangust moodustasid 2016. aastal peamise osa taimekasvatussaadused,
  NTA alal NPK v\u00e4ljundist 86-88%, v\u00e4ljaspool NTAd 91-93%.\\n\\n* 2016. aastal
  oli N ja K kasutamise efektiivsus madal nii NTA alal (N efektiivsus 54%, K 58%)
  kui ka v\u00e4ljaspool NTAd (N efektiivsus 56%, K 61%) Fosfori kasutamine oli s\u00e4\u00e4stva
  tootmise tasemel  (>80%).\\n* Kokkuv\u00f5ttes majandati 2016. aastal intensiivsemalt
  NTA alal kui v\u00e4ljaspool NTAd.\\n* 2017. aasta uuringu tulemustel v\u00f5ib
  keskkonnas\u00e4\u00e4stlikkuse ja vee kvaliteedi paranemise seisukohalt olukorda
  hinnata keskp\u00e4raseks. Mullaviljakuse s\u00e4ilitamise ja paranemise seisukohalt
  tuleb suuremat t\u00e4helepanu p\u00f6\u00f6rata fosfori ja kaaliumi tasakaalustatud
  kasutamisele ja NPK toiteelementide kasutamise efektiivsuse parandamisele.\"", "\"Loksa
  G\u00fcmnaasiumi hetkeolukorra raport 2017/2018 \u00f5ppeaastal\\n\\nKool: Loksa
  G\u00fcmnaasium\\n\\nKinnitatud: 2018-05-23 21:46:06(Arvi Soolind)\\n\\nKirjeldus/Kokkuv\u00f5te\\n\\nLoksa
  G\u00fcmnaasiumi hetkeolukorra raport 2017/2018 \u00f5ppeaastal. Raporti aluseks
  on v\u00f5etud Loksa G\u00fcmnaasiumi 2016/2017 \u00f5ppeaasta hetkeolukorra raport.\\n\\n\u00d5pik\u00e4situs\\n\\n1.1.
  Digiajastu t\u00f6\u00f6v\u00f5tted\\n\\nB. V\u00e4hemalt veerand \u00f5petajatest
  on muutnud oma ainekavades s\u00f5nastatud \u00f5pieesm\u00e4rke ja oodatud \u00f5pitulemusi,
  l\u00e4htudes muutunud \u00f5pik\u00e4situse p\u00f5him\u00f5tetest, hindamismudelitest
  ja digitehnoloogia v\u00f5imalustest. Uuenduslikke \u00f5petamispraktikaid (uurimuslik
  \u00f5pe, projekt\u00f5pe, l\u00f5imitud \u00f5pe) kasutatakse \u00fcksikutel eraldiseisvatel
  juhtudel.\\n\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang\\n-- selgitus
  Individuaalne hinnang Digip\u00e4devused on integreeritud \u00f5petajate t\u00f6\u00f6kavadesse.
  Enamus \u00f5petajatest koostavad t\u00f6\u00f6kavasid e-kooli keskkonnas. Veerand
  \u00f5petajatest kasutavad \u00f5ppet\u00f6\u00f6s iPad''ide klassi. Uurimuslikku
  \u00f5pet viiakse l\u00e4bi kooli arvutiklassides. On korraldatud digivahendite
  kasutamist n\u00f5udvaid \u00fclekoolilisi \u00fcritusi ja m\u00e4nge. \u00d5ppetundides
  rakendatakse VOSK-metoodikat. Toimuvad l\u00f5imitud \u00f5ppe tunnid ja p\u00e4evad,
  kus kasutatakse digivahendeid. V\u00e4hemalt veerand \u00f5petajatest kasutab muutunud
  \u00f5pik\u00e4sitlusest tulenevaid uuenduslikke \u00f5petamispraktikaid.\\nK\u00fclli
  Adler (sekret\u00e4r) - 23.05.2018 Grupihinnang\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  B\\n\\nValvi Joav\u00e4li (\u00f5ppealajuhataja) - https://ekool.eu/index_et.html\\nK\u00fclli
  Adler (sekret\u00e4r) - \u00dclekooliline QR-koodi m\u00e4ng\\n\\n1.2. Digip\u00e4devuste
  arendamine\\n\\nB. V\u00e4hemalt veerand \u00f5petajaskonnast on omandanud kooli
  poolt etten\u00e4htud digip\u00e4devused ja nad rakendavad neid tihti. \u00d5pilaste
  digip\u00e4devusi arendavad erinevad aine\u00f5petajad.\\n\\nArvi Soolind (Infojuht)
  - 08.04.2018 Individuaalne hinnang On l\u00e4bi viidud \u00f5petajate ja \u00f5pilaste
  digip\u00e4devuse hinnang. \u00d5petajate digip\u00e4devuste hindamise aluseks on
  ..... \u00d5pilaste digip\u00e4devuste arendamine toimub erinevates aine- ja ringitundides.
  Kooli II ja III kooliastmes on valikaine arvuti\u00f5petus. I kooliastmes omandatakse
  digip\u00e4devuse algtase aine- ja ringitundides.\\nK\u00fclli Adler (sekret\u00e4r)
  - 23.05.2018 Grupihinnang\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase B\\n\\nK\u00fclli
  Adler (sekret\u00e4r) - Kooditund\\nK\u00fclli Adler (sekret\u00e4r) - digip\u00e4edevuse
  hindamine\\nValvi Joav\u00e4li (\u00f5ppealajuhataja) - Loksa G\u00fcmnaasiumi \u00f5ppekava\\n\\n1.3.
  \u00d5petaja roll\\n\\nA. \u00d5petajatevaheline koost\u00f6\u00f6 piirdub m\u00f5ne
  initsiatiivikama \u00f5petaja \u00fcksikute l\u00fchemaajaliste koost\u00f6\u00f6projektidega.\\n\\nArvi
  Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang\\nValvi Joav\u00e4li (\u00f5ppealajuhataja)
  - 23.05.2018 Grupihinnang\\n\\nInitsiatiivikamad \u00f5petajad on korraldanud l\u00fchiajalisi
  aineid l\u00f5imivaid koost\u00f6\u00f6projekte\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  A\\n\\nValvi Joav\u00e4li (\u00f5ppealajuhataja) - http://loksakool.ee/urituste-plaan?
  p_p_id=8&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&p_p_col_id=column2&p_p_col_count=1&_8_struts_action=%2Fcalendar%2Fview_event&_8_redirect=http%3A%2F%2Floksakool.ee%2Furitusteplaan%3Fp_p_id%3D8%26p_p_lifecycle%3D0%26p_p_state%3Dnormal%26p_p_mode%3Dview%26p_p_col_id%3Dcolumn2%26p_p_col_count%3D1%26_8_tabs1%3Dmonth%26_8_month%3D3%26_8_struts_action%3D%252Fcalendar%252Fview%26_8_year%3D2018%26_8_\\n\\n1.4.
  \u00d5pilase roll\\n\\nB. V\u00e4hemalt veerand \u00f5petajatest katsetab innovaatilisi
  \u00f5pistsenaariume ja metoodikaid, milles \u00f5pilased \u00f5pivad aktiivselt,
  loovalt, ettev\u00f5tlikult ja koost\u00f6\u00f6s. \u00d5pilastel v\u00f5imaldatakse
  l\u00e4htuvalt oma huvidest ja v\u00f5imetest kaasa r\u00e4\u00e4kida \u00f5ppe
  kavandamisel.\\n\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang \u00d5ppetundide
  kavandamisel ja l\u00e4biviimisel kaastakse \u00f5pilaste teadmisi ja oskusi digivahendite
  kasutamisel, sisu loomisel kasutatakse \u00f5pilaste teadmisi (\u00e4ppide loomine-
  LearningApps, \u00f5ppefilmide loomine, blogide kirjutamine, kodulehtede koostamine,
  esitluste valmistamine, k\u00fcsitluste koostamine Google Forms keskkonnas jms)\\nValvi
  Joav\u00e4li (\u00f5ppealajuhataja) - 23.04.2018 Grupihinnang Digip\u00e4devamad
  \u00f5pilased jagavad oma teadmisi ja oskusi klassikaaslastega.\\n\\n1.5. \u00d5ppekorraldus\\n\\nB.
  V\u00e4hemalt veerand \u00f5petajatest on omal algatusel v\u00f5tnud ette piiratud
  mahus muudatusi oma \u00f5ppekorralduses (ainekavad, tunniplaanid, tundide l\u00e4biviimine)
  seoses muutunud \u00f5pik\u00e4situsega ja digip\u00f6\u00f6rdest inspireeritud
  ainetevaheliste \u00f5piprojektide, uurimist\u00f6\u00f6de, \u00f5pim\u00e4ngude,
  konkursside v\u00f5i muude mittetraditsiooniliste \u00f5pis\u00fcndmustega. V\u00e4hemalt
  veerand \u00f5petajatest kasutab aeg-ajalt oma tundides digi\u00f5ppevara ja veebip\u00f5hiseid
  t\u00f6\u00f6vahendeid.\\n\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne
  hinnang \u00d5petajad kasutavad paljudes tundides erinevates keskkondades loodud
  esitlusi ja \u00f5ppematerjale. Kasutatakse erinevate kirjastuste e-\u00f5pikuid,\\n\\nkirjandustundides
  kasutatakse e-lugereid. Ainetundides kasutatakse erinevaid e-kursuseid.\\n\\nValvi
  Joav\u00e4li (\u00f5ppealajuhataja) - 23.05.2018 Grupihinnang\\nMuutunud \u00f5pik\u00e4situsest
  l\u00e4htuvalt on \u00f5petajad teinud korrektiive oma t\u00f6\u00f6kavades ( koostatakse
  e-koolis), \u00f5ppetundides kasutatakse digi\u00f5ppevara ja veebikeskkondi.\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  B\\n\\nValvi Joav\u00e4li (\u00f5ppealajuhataja) - http://www.biodigi.edu.ee/_/\\n\\nMuutuste
  juhtimine\\n\\n2.1 Strateegiline planeerimine\\n\\nB. Koolil on olemas vajalikud
  strateegilised raamdokumendid ja need on leitavad kooli kodulehel. Dokumendid on
  omavahel koosk\u00f5las ja neist l\u00e4htutakse v\u00e4hemalt kord aastas  kooli
  tegevustest \u00fclevaate andmisel lastevanematele, \u00f5ppen\u00f5ukogule ja hoolekogule.\\n\\nArvi
  Soolind (Infojuht) -08.04.2018 Individuaalne hinnang\\n\\nLisada link kooli kodulehele.
  Alamastme tegevusplaanid koostatakse l\u00e4htuvalt arengukavast. Regulaarselt toimuvad
  hoolekogu koosolekud,\\n\\n\u00f5ppen\u00f5ukogud ja lapsevanemate koosolekud.\\n\\nJana
  Roopa (\u00f5petaja) - 23.04.2018 Grupihinnang\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  B\\n\\nJana Roopa (\u00f5petaja) - kooli koduleht\\n\\n2.2 Kaasamine ja partnerlus\\n\\nC.
  Kooli arengukava/ IT-arengukava ja \u00f5ppekavad vaadatakse \u00f5petajate ja partnerite
  osalusel regulaarselt \u00fcle (v\u00e4hemalt kord aastas) ja neid muudetakse vastavalt
  vajadustele. Nende dokumentide \u00fcle arutletakse digisuhtluskanalites. Arutelude,
  k\u00fcsitluste ja h\u00e4\u00e4letuste tulemusi arvestatakse strateegiliste raamdokumentide
  uuendamisel.\\n\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang Kooli
  arengukavad vaadatakse kord aastas \u00fcle ja t\u00e4iendatakse. Dokumentide ettevalmistamisel
  kasutatakse Google Drive keskkonna koost\u00f6\u00f6 v\u00f5imalusi. Toimuvad e-\u00f5ppen\u00f5ukogud.
  Arvamuste v\u00e4lja selgitamiseks kasutatakse elektroonilisi k\u00fcsitluskeskkondasid
  (Google Forms, Doodle, Mentimeter jms.)\\nUrve Versoo (\u00f5petaja) - 23.04.2018
  Grupihinnang\\n\\nDigisuhtlusvahenditena kasutatakse ekooli, kooli e-maili, Doodle
  keskkonda, Google Formsi, Google Drive''i.\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  C\\n\\nUrve Versoo (\u00f5petaja) - Kooli arengukava\\n\\nUrve Versoo (\u00f5petaja)
  - Loksa G\u00fcmnaasiumi IT arengukava\\n\\n2.3. Kogemuste vahetus ja \u00fcksteiselt
  \u00f5ppimine\\n\\nB. Uuendusmeelsemad \u00f5petajad korraldavad aeg-ajalt omal
  algatusel t\u00f6\u00f6tubasid v\u00f5i esitlusi teistele \u00f5petajatele, vahendades
  oma kogemusi katsetustest digip\u00f6\u00f6rde suunal. Parimaid praktikaid ja digi\u00f5ppevara
  tutvustatakse m\u00f5nikord ka kooli kodulehel v\u00f5i sellega seotud \u00f5petajate,
  klasside v\u00f5i projektide blogides.\\n\\nArvi Soolind (Infojuht) - 08.04.2018
  Individuaalne hinnang Koolitusplaanis on kirjeldatud \u00f5petajate poolt l\u00e4bi
  viidavad regulaarsed t\u00f6\u00f6toad. Toimuvad igan\u00e4dalased \u00f5petajate
  digikoolitused. Koolituse materjalidele on osalejatel ligip\u00e4\u00e4s Google
  Classroom keskkonnas. K\u00f5ikidel \u00f5petajatel on ligip\u00e4\u00e4s \u00f5petajate
  poolt loodud kursustele Moodle keskkonnas. \u00d5petajate poolt erinevates keskkondades
  (\u00d5piveeb, Kahoot, Koolielu jms) loodud materjale kasutavad ka teiste koolide
  \u00f5petajad.\\nUrve Versoo (\u00f5petaja) - 23.04.2018 Grupihinnang\\n\\nIgan\u00e4dalaselt
  toimub \u00f5petajate arvutiring infotehnoloogi juhendamisel, kord kuus jagavad
  oma kogemusi digivaldkonnas erinevad aine\u00f5petajad.\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase
  B\\n\\nUrve Versoo (\u00f5petaja) - Loksa kooli ajaveeb\\nUrve Versoo (\u00f5petaja)
  - Loksa G\u00fcmnaasiumi Facebooki lehek\u00fclg\\n\\n2.4. Monitooring ja anal\u00fc\u00fctika\\n\\nB.
  Kooli arengukavas ja \u00f5ppekavades p\u00fcstitatud eesm\u00e4rkidest l\u00e4htudes
  korraldatakse v\u00e4hemalt kord aastas k\u00fcsitlusi \u00f5petajate, \u00f5pilaste
  ja lapsevanemate seas, nende k\u00fcsitluste andmeid anal\u00fc\u00fcsitakse. Regulaarselt
  toimub kooli juhtkonna ja \u00f5petajate eneseanal\u00fc\u00fcs.\\n\\nArvi Soolind
  (Infojuht) - 08.04.2018 Individuaalne hinnang\\nOsaletakse iga-aastases INNOVE poolt
  korraldatud rahuloluk\u00fcsitluses. L\u00e4htudes INNOVE tagasisidest anal\u00fc\u00fcsitakse
  ja korrigeeritakse kooli tegevusi. \u00d5petajate arvamuse v\u00e4ljaselgitamiseks
  korraldatakse k\u00fcsitlusi Google Forms keskkonnas. \u00d5petajate iga-aastaseid
  enesehinnanguid anal\u00fc\u00fcsitakse.\\nJana Roopa (\u00f5petaja) - 23.04.2018
  Grupihinnang\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase B\\n\\nJana Roopa (\u00f5petaja)
  - INNOVE rahuloluk\u00fcsitluse tagasiside (8.klass) 2017\\nJana Roopa (\u00f5petaja)
  - INNOVE rahuloluk\u00fcsitluse tagasiside (11.klass) 2017\\n\\n2.5. Toetus, eestvedamine
  ja motiveerimine\\n\\nB. Juhtkond innustab \u00f5petajaid digip\u00f6\u00f6rdest
  inspireeritud kooliuuendust tutvustama ning toetab teerajajaid avaliku kiituse v\u00f5i
  esile t\u00f5stmisega.\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang\\n\\nAktiivselt
  digivahendeid kasutavatel \u00f5petajatel on v\u00f5imalus koolitada kolleege. Digivaldkonnas
  tegutsevaid \u00f5petajaid t\u00f5stetakse esile ja tunnustatakse.\\n\\nJana Roopa
  (\u00f5petaja) - 23.04.2018 Grupihinnang\\n\\nDigitaristu\\n\\n3.1 V\u00f5rk ja
  digiturve\\n\\nA. \u00dcksikutes kooliruumides on Wifi, interneti v\u00e4lis\u00fchendus
  on rahuldav kuni 30 samaaegse kasutaja puhul\\n\\nArvi Soolind (Infojuht) - 08.04.2018
  Individuaalne hinnang\\nArvi Soolind (Infojuht) - 23.04.2018 Grupihinnang\\n\\nKooli
  v\u00e4lis\u00fchendus v\u00f5imaldab rahuldava \u00fchenduse \u00fcle 30 samaaegse
  kasutaja puhul. Koolil on olemas \u00fcks teisaldatav wifi seade.\\n\\n3.2 Digiseadmed\\n\\nB.
  Kool on hankinud 1-2 klassikomplekti kaasaegseid nutiseadmeid, on paika pandud reeglid
  nende laenutamiseks ja ka \u00f5pilaste oma nutiseadmete kasutamiseks. Esitlusvahendid
  (dataprojektor, IWB, TV) on olemas peaaegu k\u00f5ikides \u00f5pperuumides.\\n\\nArvi
  Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang\\nKoolil on kasutada klassikomplekt
  tahvelarvuteid. \u00d5pilastel on lubatud tundides nutiseadmete kasutamine. Esitlusvahendid
  on k\u00f5ikides klassiruumides. Koolil on olemas kaks arvutiklassi kahek\u00fcmne
  ja viieteistk\u00fcmne t\u00f6\u00f6kohaga. \u00d5pilaste k\u00e4sutuses on ka neli
  arvutit raamatukogus. Kuues klassiruumis on kasutusel interaktiivne tahvel. Koolil
  on robootika komplektid (Mindstorms EV3 ja NXT, Ozobot). Kirjandustundides on kasutada
  6 elugerit. Koolil on 3D printer\\n\\nAnnely Vill (\u00f5petaja) -23.04.2018 Grupihinnang\\n\\nViies
  klassiruumis on kasutusel dokumendikaamera.\\n\\n3.3 IT-juhtimine\\n\\nC. Kool viib
  sihip\u00e4raselt ellu oma IT-strateegiat, juhtkonnal on IT-taristust pidev \u00fclevaade,
  regulaarselt kaardistatakse kooli IT-ressursside arenguvajadusi ja korrigeeritakse
  kooli visioonis IT-taristu osa.\\n\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne
  hinnang Koolil on olemas IT-arengukava, mida korrigeeritakse igal aastal. Kool monitoorib
  oma hetkeolukorda ja koostab digiplaane Digipeegli keskkonnas. Kooli IT taristu
  on kirjeldatud Ecxel''i tabelis.\\nArvi Soolind (Infojuht) - 23.04.2018 Grupihinnang
  Kool on oma plaanides kirjeldanud v\u00e4lis\u00fchenduse kiiruse suurendamise vajadust
  ja kooli arvutiv\u00f5rgu renoveerimise vajadust, rahapuudusel on need tegevused
  j\u00e4\u00e4nud teostamata.\\n\\nT\u00d5ENDUSMATERJALID\\n\\nTase C\\n\\nArvi Soolind
  (Infojuht) - Loksa G\u00fcmnaasiumi IT arengukava\\n\\n3.4 Kasutajatugi\\n\\nB.
  Koolis pakutakse \u00f5petajatele mingil m\u00e4\u00e4ral kas IT-kasutajatuge v\u00f5i
  haridustehnoloogilist tuge.\\nArvi Soolind (Infojuht) - 08.04.2018 Individuaalne
  hinnang Kasutajatuge osutab ja tehniliste probleemide lahendamisega tegeleb kooli
  IT-juht. Koolis on \u00f5petaja, kes t\u00e4idab osaliselt haridustehnoloogi \u00fclesandeid.
  IT-alast kasutajatuge osutavad suurel m\u00e4\u00e4ral \u00fcksteisele \u00f5petajad.
  \u00d5petajad kasutavad tundide l\u00e4biviimisel digip\u00e4devate \u00f5pilaste
  abi.\\nAnnely Vill (\u00f5petaja) - 23.05.2018 Grupihinnang\\n\\n3.5 Tarkvara ja
  teenused, infos\u00fcsteemid\\n\\nB. Kooli tasandil on hakatud juurutama \u00fcksikuid
  lisateenuseid (nt veebip\u00f5hised \u00f5pikeskkonnad, blogid, raamatukogu infos\u00fcsteem).\\n\\nArvi
  Soolind (Infojuht) - 08.04.2018 Individuaalne hinnang Koolil on Moodle''i keskkond,
  mis kasutab HITSA Moodle''i serveri teenuseid. Koolil on kasutada Google Classroom
  vahendid. Kool kasutab koolide haldamise infos\u00fcsteemi EKIS. Koolil on olemas
  koduleht, kasutatakse e-kooli, raamatukogu infos\u00fcsteemi RIKS. Kool kajastab
  oma tegemisi sotsiaalmeedia kanalis FB.\\nAnnely Vill (\u00f5petaja) - 23.05.2018
  Grupihinnang\\n\\nTase B\\n\\nAnnely Vill (\u00f5petaja) - Loksa G\u00fcmnaasiumi
  Moodle keskkond\"", "\"ERT\u00dc juhatuse koosolek 05.02.2016\\n\\nKoosoleku toimumise
  aeg ja koht: 05.02.2016 kell 17.30 Tallinnas, Telliskivi loomelinnakus (Foody Allen)\\n\\nOsalejad:
  Tatjana Zamorskaja (juhatuse liige), Kertu Tombak (juhatuse liige), Monika Normann
  (juhatuse liige), Aet Toose (juhatuse liige), Pille-Riin Sepp (juhatuse liige),
  Kadri Kont-Kontson (lihtliige)\\n\\nPuudusid: Kadi Haljand, Marilis Saul\\n\\nProtokollija:
  Kertu Tombak\\n\\nP\u00e4evakord:\\n\\n1. Suvise erin\u00e4ituse korraldamine (hetkeseis,
  \u00fclesannete edasine jaotus) \u00dcldinfo, vahepeal selgunud asjaolud:\\n\\n-
  Kohtunik Rosa Agostini (ITA) on kinnitanud tuleku. V\u00f5ib hinnata lisaks .labradoridele
  ja teisi retriivereid ja spanjeleid. Hindab erin\u00e4itusel labradori retriivereid
  ja \u00fclej\u00e4\u00e4nud retriiveri t\u00f5ugusid.\\n- Kohtunik Mary Neil (UK)
  on kinnitanud tuleku. Hindab 16.07 erin\u00e4itusel kuldseid retriivereid.\\n- Ameerika
  Kokkerspanjelite \u00fchinguga tuleb veel pidada l\u00e4bir\u00e4\u00e4kimisi kohtunik
  Rosa Agostini jagamise osas nende erin\u00e4itusega.\\n- K\u00fcsimus: juhul, kui
  tuleb rohkem koeri, kes v\u00f5iks olla varukohtunik?\\n- N\u00e4ituse info juurde
  tuleb lisada info kasvatajate poolt v\u00e4ljapandavate auhindade kohta.\\n- Sponsorid:\\no
  kas koeratoidu edasim\u00fc\u00fcjatega on r\u00e4\u00e4gitud?\\no Monika uurib
  Monica Merimalt, kas ta on n\u00f5us n\u00e4itust sponsoreerima.\\no Kertu uurib
  Britta Puuseppalt n\u00e4ituse sponsoreerimise kohta\\n\\nJuhatus otsustas: N\u00e4itusele
  registreerimine algab hiljemalt 1. m\u00e4rtsil. Registreerimine l\u00f5peb juuni
  alguses. Seej\u00e4rel otsustame osalejate arvu p\u00f5hjal, kas v\u00f5tame juurde
  kohtuniku teiste retriiverite jaoks v\u00f5i pikendame registreerimist.\\n\\nN\u00e4ituse
  esialgne eelarve tuleb veebruarikuus paika saada. Selle eest vastutavad Tatjana
  ja Kertu.\\n\\nKadi uurib kohtunike lennupileteid ja sobiva variandi leidmisel broneerib
  lennupiletid.\\n\\n2. Suvep\u00e4evade korraldamine (hetkeseis, \u00fclesannete
  edasine jaotus)\\n\\n\u00dcldinfo, vahepeal selgunud asjaolud:\\n\\n- Koha otsingud
  on pooleli, on tulnud nii positiivseid kui negatiivseid vastuseid.\\n- P\u00fchap\u00e4eval
  toimub ametlik katse. Riin Kooli-K\u00f5nnusaar on kohtunik. Vaja on leida katse
  korraldamise koht.\\n- Ametliku katse taotlus vaja saata EKLi.\\n- V\u00f5imaluse
  korral iga n\u00e4dal tuleks uuendada \u00fcrituse Facebook''i infot ja kodulehel
  olevat infot.\\no 8. Veebruaril v\u00f5iks lisada info kohtunike kohta.\\n\\n[x]
  Kadi ja Kadri m\u00f5tlevad v\u00e4lja plaani kuna ja mis infot oleks veel v\u00f5imalik
  \u00fcrituse reklaamimiseks kuvada.\\n\\nJuhatus otsustas: Kertu tegeleb edasi koha
  otsimisega suvep\u00e4evade toimumiseks. Kadri saadab p\u00e4ringud P\u00e4rnumaa
  turismitaludele.\\n\\n18. veebruariks peab olema koht v\u00e4lja selgitatud.\\n\\nKadri
  saadab EKli taotluse katse korraldamise kohta ja tegeleb katse organiseerimise poolega.\\n\\n3.
  Aasta Retriiveri konkurss\\n\\nKonkurss on l\u00f5ppenud. Pille-Riin kannab tulemused
  arvutisse. Seej\u00e4rel avaldatakse tulemused nii kodulehel kui e-maili listi teel.
  Auhinnad annab \u00fcle Pille-Riin.\\n\\nOsales 11 koera.\\n\\nIdee j\u00e4rgmiseks
  aastaks \u2013 kas teha Gala Show, kus aasta alguses jagada auhindu.\\n\\nJuhatus
  otsustas: Proovida osalejate arvu j\u00e4rgmisel aastal suurendada. Selleks tuleb
  saata liikmete nimekirja mitu teavituskirja ning v\u00f5imalusel korraldada suurem
  \u00fcritus, et aasta retriivereid autasustada.\\n\\nLiikmete nimekiri tuleb saada
  online-s\u00fcsteemi ja k\u00f5ikidele juhatuse liikmetele k\u00e4ttesaadavaks.
  Registripidaja Monika seab selle exceli jaoks sobivaks.\\n\\n4. Esimese pooleaasta
  koolitused ja katsed\\n\\n- Working test\\n\\n\u00dclevaate andis Tatjana Zamorskaja:\\n\\no
  Working Test koolitus toimub 30. aprill - 1. mai 2016.\\n\\nOrganiseerimine kulgeb
  plaanip\u00e4raselt.\\n\\nEsimesel p\u00e4eval toimub mitteametlik working test.
  Teisel p\u00e4eval toimub treening. Kui osalejaid on liiga v\u00e4he, siis toimub
  esimesel p\u00e4eval samuti treening. Koht on selgitamisel (Ida-Virumaal).\\no Ametliku
  katse k\u00fcsimus. Peale kevadist mitte-ametlikku katset saab otsustada osalejate
  arvu p\u00f5hjal, kas on m\u00f5tet s\u00fcgisel v\u00f5i j\u00e4rgmisel kevadel
  korraldada ametlik katse.\\no Katse jaoks oleks vaja rohelist v\u00e4rvi dummysid.
  Kui tellida \u00fchingule dummy''d, siis v\u00f5iks peale panna ka \u00fchingu logo.
  Tatjana uurib, kui kalliks l\u00e4heks tellimine ja logo tr\u00fckkimine.\\no Karikate
  k\u00fcsimus. Tatjana otsustab eelarve t\u00e4itumise p\u00f5hjal, kas tellida uusi
  karikaid v\u00f5i kasutada ERT\u00dc olemasolevaid karikaid mitteametlike katsete
  jaoks.\\n- Tasemekatse ja tasemekatse koolitus\\n\\n\u00dclevaate andsid Aet Toose
  ja Kadri Kont-Kontson:\\n\\no Toimumisaeg 14.-15. mai 2016\\no Koolitaja on selgitamisel\\no
  Katsetel jagatavad treeningviled on otsas. Vaja oleks uusi tellida.\\n- Ametlik
  tasemekatse ja t\u00f5ukatse\\n\\n\u00dclevaate andsid Aet Toose ja Kadri Kont-Kontson\\n\\no
  Toimub 18.-19. juunil.\\no Kohtunikuks Ari-Pekka Fontell.\\n- Kutsikate ja veteranide
  Show\\n\\n\u00dclevaate andsi Pille-Riin Sepp:\\n\\no Kohtuniku osas tuleb teha
  veel eelt\u00f6\u00f6d.\\no Koht v\u00f5iks j\u00e4\u00e4da samaks, mis eelmisel
  aasta.\\no Kuup\u00e4ev pigem augustis v\u00f5i septembris, kui on soojem.\\no Sama
  \u00fcrituse raames v\u00f5iks toimuda ka t\u00f5ukatse koolitus kutsikatele\\n\\nJuhatus
  otsustas: Aet tellib juurde 50 vilet katsetel jagamiseks. J\u00e4tkata \u00fcrituste
  planeerimist.\\n\\n5. Muud k\u00fcsimused\\n\\nAetu pole juuni l\u00f5pust juuli
  l\u00f5puni.\\n\\nERT\u00dc-l on \u00fcle suures koguses linde, mist\u00f5ttu oleks
  vajalik korraldada kevadel harjutuskatse.\\n\\nKodulehele tuleks panna info \u00fcles,
  et meie \u00fchingust saab osta vareseid ja osad katsed aastal 2016 tulevad varestega.\\n\\nJ\u00e4rgmine
  juhatuse koosolek toimub 15. aprillil.\\n\\nJuhatus otsustas: ERT\u00dc planeerib
  kevadeks harjutuskatse erineva saagiga. Kodulehele pannakse \u00fcles info lindude
  m\u00fc\u00fcgi kohta. Samuti teavitatakse kodulehe kaudu retriiveriinimesi, et
  2016. aasta katsetel kasutatakse saagina ka vareseid.\"", "\"LEAF\\nTARVIKUD\\n\\nNISSAN
  LEAFI TARVIKUD\\n\\nNissani tarvikud on loodud pakkuma teile isikup\u00e4rastamise
  ja stiiliseerimise v\u00f5imalusi ning suurendama mugavust. Peale selle vastavad
  need rangeimatele kvaliteedile, j\u00f5udluse ja t\u00f6\u00f6kindluse standarditele.
  Nissan pakub tarvikuid, mis vastavad teie vajadustele, ning v\u00f5imaldab teil
  valida erinevate v\u00e4\u00e4rtuslike ja uuenduslikke tooteid hulgast: Nissani
  originaaltarvikud ja Accessory Selecti tooted.\\n\\nNISSANI ORIGINAALTARVIKUD\\n\\nNissani
  originaaltarvikud on loodud spetsiaalselt meie s\u00f5idukite jaoks ja neid disainivad
  meie enda insenerid, mis tahendab, et need vastavad k\u00f5igile asjakohastele Nissan
  standarditele. Neile keitub uue s\u00f5iduki garantii kolm aastat v\u00f5i 100 000
  km (olenevalt sellest, kumb enne taitub), kui need on paigaldatud enne s\u00f5iduki
  \u00fcleandmist v\u00f5i uue s\u00f5iduki garantiperioodi ajal.\\n\\nACCESSORY SELECT\\n\\nNissan
  valis hinnavad tarnijatelt v\u00e4lja erinevad j\u00e4reituru tooted, et rikastada
  teie s\u00f5idukikogemust ja tagada teie rahulolu. Accessory Selecti toodete garantii
  katvus oleneb tarnijast. Lisateabe saamiseks po\u00f6rduge Nissani volitatud edasim\u00fc\u00fcja
  v\u00f5i remondit\u00f6\u00f6koha poole.\\n\\nNissani originaaltarvikud peab paistma
  meie Nissan edasim\u00fc\u00fcjaga v\u00f5i Nissani remondit\u00f6\u00f6koda. Nissani
  originaaltarvikutele, mis on paigaldatud v\u00e4ljaspool uue s\u00f5iduki garantiperioodi,
  v\u00f5i mille on paigaldatud Nissani loomuliku garantiperioodi l\u00f5ppu, ei anneta
  originaaltarvikute ja -tarvikute 12-kuuiline / piiramatu l\u00e4bis\u00e4ili garantii.\\n\\nKULGEGE
  LINNA\\npaketiga Elegance\\n\\nPAKET ELEGANCE BLUE\\nUSTE ALUMISED K\u00dcLJELISTUD
  \u2013 SINISEDE\\nPAGASIRUUMI LUUGI ALUMINE ILULIST \u2013 SININE\\nPEEGLIKATTED
