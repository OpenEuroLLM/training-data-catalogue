  | 8 197 | 11 180 |\\n\\nLisa 11 Seotud osapooled\\n\\n(eurodes)\\n\\n| Liikmete
  arv majandusaasta l\u00f5pu seisuga |  |  |\\n|---|---|---|\\n|  | 31.12.2014 |
