  2014 | 2013 |\\n| Arvestatud tasu | 883 | 2 111 |\\n\\nJuhatuse liikmele Senta Malvale
  arvestatud tasu 883 eurot\"", "\"1. Olgu funktsioon $f$ m\u00e4\u00e4ratud kogu
  reaalteljel, kusjuures suvaliste $x \\\\in \\\\mathbb{R}$ ja $h > 0$ korral\\n\\n$$|f(x
  + h) - f(x - h)| < h^2.$$ \\n\\nT\u00f5estada, et $f(x) \\\\equiv \\\\text{const.}$  **10
  punkti.**\\n\\n2. T\u00f5estada v\u00f5rratus\\n\\n$$\\\\sum_{k=1}^{n} \\\\frac{1}{k^3}
  < \\\\frac{5}{4} \\\\quad (n \\\\in \\\\mathbb{N}).$$\\n\\n**12 punkti.**\\n\\n3.
  Olgu funktsioon $f$ kogu reaalteljel kaks korda pidevalt diferentseeruv. T\u00f5estada,
  et suvalise $x \\\\in \\\\mathbb{R}$ korral\\n\\n$$\\\\lim_{h \\\\to 0} \\\\frac{f(x
  + h) - 2f(x) + f(x - h)}{h^2} = f''''(x).$$\\n\\n**13 punkti.**\\n\\n4. Olgu maatriksil
  $S$ j\u00e4rgmine omadus: suvaline maatriks $A$ on \u00fchesel viisil esitatav summana
  $A = A_1 + A_2$, kus maatriksid $A_1$ ja $A_2$ rahuldavad vastavalt tingimusi $A_1S
  = SA_1$ ja $A_2S = -SA_2$.\\n\\nT\u00f5estada, et selleks on tarvilik ja piisav,
  et $S^2$ oleks \u00fchikmaatriksi kordne. (K\u00f5ik vaadeldavad maatriksid on $n$-j\u00e4rku
  ruutmaatriksid.) **15 punkti.**\\n\\n5. Olgu $E$ 3-m\u00f5\u00f5tmeline vektorruum
  \u00fcle korpuse $\\\\mathbb{Q}$ ning olgu elemendid $x, y, z \\\\in E$, $x \\\\neq
  0$, sellised, et mingi lineaarne kujutuse $T : E \\\\to E$ korral $Tx = y$, $Ty
  = z$ ja $Tz = x + y$. T\u00f5estada, et elemendid $x$, $y$ ja $z$ on lineaarselt
  s\u00f5ltumatud. **15 punkti.**\\n\\n6. Leida j\u00e4rgmised piirv\u00e4\u00e4rtused.\\n\\n1)
  $$\\\\lim_{n \\\\to \\\\infty} \\\\sum_{k=0}^{2n} \\\\frac{k}{k^2 + n^2}.$$ **15
  punkti.**\\n\\n2) $$\\\\lim_{n \\\\to \\\\infty} \\\\frac{(n + 1)^{n^2}}{n^{n^2}
  \\\\cdot e^n}.$$ **10 punkti.**\"", "\"Saarepeedi Noorte Malev 2019\\n\\nT\u00f6\u00f6aeg
  ja -koht:\\n\\nSaarepeedi Noorte Malev 2019 toimub Viljandi valla territooriumil
  ajavahemikul 17. juuni-01. juuli 2019\\n\\nT\u00f6\u00f6d tehakse p\u00e4evas 4
  tundi \u00fcldjuhul kell 08.00-12.00. Ette on n\u00e4htud 15 minutilised puhkepausid  iga
  45 minuti j\u00e4rel.\\n\\nP\u00e4rast t\u00f6\u00f6 tegemist toimuvad malevlastele
