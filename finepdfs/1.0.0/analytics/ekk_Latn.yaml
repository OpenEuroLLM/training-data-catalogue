  esitatavad n\u00f5uded\\\".\\n10.5. Ehitusprojekti koostamise eelselt tuleb Mereranna
  tee L4 kinnistul l\u00e4bi viia dendroloogiline uuring projektialale j\u00e4\u00e4vatele
  olemasolevatele puudele. Dendroloogiline uuring tuleb koosk\u00f5lastada Viimsi
  Vallavalitsuse ehitus- ja kommunaalosakonnaga ja keskkonnaosakonnaga.\\n10.6. Geodeetiliste
  uurimist\u00f6\u00f6de k\u00e4igus m\u00f5\u00f5distada tehnov\u00f5rkude asukohad
  ja koosk\u00f5lastada need v\u00f5rkude valdajatega. Geodeetiline alusplaan peab
  olema m\u00f5\u00f5distatud projekti (sh olemasolevad ja projekteeritavad tehnov\u00f5rgud
  jms) koostamiseks vajalikus mahus. Projekti koosk\u00f5lastamiseks esitamise hetkel
  peab olema geodeetilise m\u00f5\u00f5distuse, sh koosk\u00f5lastuste vanus kuni
  \u00fcks aasta, ja koosk\u00f5lastataval joonisel n\u00e4idatud geodeetilise alusplaani
  koostaja andmed ja t\u00f6\u00f6 number. Koostatud geodeetiliste uurimist\u00f6\u00f6de
  aruanne tuleb esitada Viimsi Vallavalituse planeeringute osakonnale digitaalselt
  (joonise fail, seletuskiri jm) kontrollimiseks ja registreerimiseks enne ehitusloa
  taotluse esitamist.\\n10.7. Projekt peab vastama majandus- ja taristuministri m\u00e4\u00e4rusele
  17.07.2015 nr 97 \u201eN\u00f5uded ehitusprojektile\\\" ning olema vormistatud m\u00f5\u00f5tkavas
  M 1:500 paberkandjal ja digitaalsel andmekandjal, joonised DWG faili formaadis ning
  PDF-is, seletuskiri PDF-is, sh sisukord, seletuskiri, joonised, koosk\u00f5lastuste
  koondtabel jm. V\u00e4ljastatud projekteerimistingimused ja muu projektiga seonduv
  informatsioon lisada projekti kausta.\\n10.8. Projekt peab sisaldama ehitamiseks
  vajalikel kaevet\u00f6\u00f6del teisaldatava pinnase mahte (m 3 ), sh kogu v\u00e4ljakaevatava
  pinnase maht, utiliseeritava pinnase maht, tagasit\u00e4idetava pinnase maht, juurde
  veetava pinnase maht, sealhulgas eraldi liiv, killustik ja muld. Projektis n\u00e4idata
  v\u00e4ljakaevatava pinnase ajutise ja alalise ladustamise asukohad ning utiliseeritava
  pinnase utiliseerimise asukohad.\\n10.9. Projekt peab sisaldama Viimsi Vallavolikogu
  22.09.2022 m\u00e4\u00e4rusega nr 15 kehtestatud Viimsi valla j\u00e4\u00e4tmehoolduseeskirja
  \u00a7 33 lg 3 kohaseid andmeid.\\n10.10. Enne ehitusloa taotlemist lisada projektile
  k\u00f5ik vajalikud koosk\u00f5lastused.\\n10.11. Ehitust\u00f6\u00f6de k\u00e4igus
  likvideeritavate k\u00f5rghaljastuslike elementide raie tuleb taotleda luba Viimsi
  Vallavalitsuse keskkonnaosakonnalt, kes vajadusel m\u00e4\u00e4rab asendusistutused
  l\u00e4htuvalt koostatud dendroloogilise uuringu tulemustest.\\n10.12. S\u00e4ilitatavale
  k\u00f5rghaljastusele tuleb tagada ehitusaegne kaitse vastavalt standardile EVS
  939-3:2020 \u201ePuittaimed haljastuses. Osa 3: Ehitusaegne puude kaitse\\\".\\n10.13.
  Ehitusprojekti vormistamisel v\u00f5tta aluseks majandus- ja taristuministri juhendmaterjal
  \u2013 Ehitusprojekti dokumentide digitaalse vormistamise n\u00f5uded ehitusloa
  elektroonilisel taotlemisel.\\n10.14. Enne ehitust\u00f6\u00f6dega alustamist taotleda
  ehitusluba. Ehitusloa taotlus teha ehitisregistri www.ehr.ee kaudu.\\n\\n11. Projekt
  koosk\u00f5lastada:\\n\\n11.1. Telia Eesti AS.\\n11.2. Adven Eesti AS.\\n11.3. Imatra
  Elekter AS.\\n11.4. Viimsi Vesi AS.\\n11.5. KH Energia-Konsult AS.\\n\\n11.6. K\u00f5ikide
  teiste ehitus- ja kaevealas paiknevate maa-aluste ja maapealsete rajatiste (tehnov\u00f5rkude)
  omanikega v\u00f5i valdajatega.\\n11.7. K\u00f5igi piirkonna kinnistute f\u00fc\u00fcsiliste
  isikutega, kelle omandis oleval kinnistul projekteeritavad ja ehitatavad ehitised
  hakkavad paiknema.\\n11.8. K\u00f5igi ehitust\u00f6\u00f6dega seotud kinnistute
  omanikega.\\n11.9. K\u00f5igi ehitust\u00f6\u00f6dega seotud asjaomaste instantsidega.\\n\\n12.
  N\u00f5uded ehitust\u00f6\u00f6de teostamisel:\\n\\n12.1. Sademevee torustiku ehitust\u00f6\u00f6d
  tuleb teostada soovitatavalt kinnisel meetodil suundpuurimise teel ning vastavuses
  Viimsi Vallavolikogu m\u00e4\u00e4rusele 16.03.2021 nr 10 \u201eViimsi valla kaevet\u00f6\u00f6de
  eeskiri\\\".\\n12.2. Ehitust\u00f6\u00f6de mahtudes n\u00e4ha ette kogu ehitus-
  ja kaeveala taastamine t\u00e4ies ulatuses. Ehitusprojekti koosseisus esitada katendite
  taastamise osa (haljasalade ja teekatete osas) ning teekatete taastamine kogu ehitus-
  ja kaevala l\u00f5ikes t\u00e4ies ulatuses, sh vajadusel teede ja teede uue aluse
