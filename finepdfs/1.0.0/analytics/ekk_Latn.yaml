  2 | 900 |\"", "\"ESF VAHENDITEST RAHASTATAVA T\u00c4ISKASVANUTE T\u00c4IENDUSKOOLITUSE
  \u00d5PPEKAVA\\n\\nKinnitatud direktori 09.11.2020 k\u00e4skkirjaga nr 6.2-1/133\\n\\n1.
  \u00dcldandmed\\n\\n2. Koolituse sihtgrupp ja \u00f5piv\u00e4ljundid\\n\\nSihtr\u00fchm
  ja selle kirjeldus ning \u00f5ppe alustamise n\u00f5uded.\\n\\nSihtr\u00fchm:\\n\\n-
  Koolitus on suunatud aegunud oskustega arhitektidele, aiakujundajatele, maastikuarhitektidele;\\n-
  k\u00f5igile, kel on vaja end v\u00e4ljendada erialases t\u00f6\u00f6s 3D maailmas.\\n\\nGrupi
  suurus:\\n\\n12 inimest\\n\\nKoolituse alustamise n\u00f5uded:\\n\\n- Arvutialased
  oskused tavakasutaja tasemel.\\n- Kuulumine sihtgruppi.\\n\\n\u00d5piv\u00e4ljundid.
  \u00d5piv\u00e4ljundid kirjeldatakse kompetentsidena, mis t\u00e4psustavad, millised
  teadmised, oskused ja hoiakud peab \u00f5ppija omandama \u00f5ppeprotsessi l\u00f5puks.\\n\\nKasutades
  Sketch UP programmi:\\n\\n1. koostab lihtsama mudeli enda erialal t\u00f6\u00f6s
  olevast objektist;\\n2. koostab mudeli, milles on kasutatud komponente ja materjale;\\n3.
  koostab mudeli, milles on kasutatud erit\u00f6\u00f6vahendeid loomingulise mudeli
  loomiseks;\\n4. koostab mudelitest seeria pilte ning v\u00e4ikese video;\\n5. koostab
  mudeli, kus on kasutatud objektide fotosid ja taustapilte.\\n\\n\u00d5piv\u00e4ljundite
  seos kutsestandardi v\u00f5i taseme\u00f5ppe \u00f5ppekavaga. Tuua \u00e4ra vastav
  kutsestandard ning numbriline viide konkreetsetele kompetentsidele, mida saavutatakse.\\n\\nKutsestandardi
  t\u00e4his: 11-03122012-17/5k; maastikuehitaja tase 4\\n\\nKinnitatud Toiduainet\u00f6\u00f6stuse
