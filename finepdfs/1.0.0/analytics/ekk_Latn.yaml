  Sellisena on ta v\u00e4ga kallis ning sisu \u00fchildades konverentsiga j\u00f5utaks
  rohkemate osalisteni.\\n- Infop\u00e4ev \u201eArukas k\u00fclaturism - toitlustuse
  korraldamise v\u00f5imalused\\\" esitatud Maaelu Teadmuskeskuse ettepanekul kontaktsena.
  Eelarve kokkuhoiu m\u00f5ttes korraldada veebis koost\u00f6\u00f6s Talumeireide
  Liidu sarnase ettepanekuga.\\n- Infop\u00e4ev \u201eToiduohutuse juhtimiss\u00fcsteemid
  (ISO, BRC, FSSC, IFS)\\\" veebis \u2013 \u00fcks \u00fcldine ja konkreetne infop\u00e4ev
  on igati asjakohane.\\n- Infop\u00e4ev veebis \u201eToiduh\u00fcgieen hulgilaos
  ja kauba j\u00e4lgitavus\\\": kauba vedu on problemaatiline, vajab rohkem j\u00e4relvalvet.
  Infop\u00e4eval tuleks kindlasti k\u00e4sitleda lisaks hulgiladustamisele ka kaubavedu.
  PTA aitaks vajaliku sihtr\u00fchma v\u00e4lja otsida. Kindlasti on \u00fcritusel
  vaja ka venekeelset t\u00f5lget.\\n- Infop\u00e4ev \u201eSuitsutatud toodete valmistamine\\\".
  Kontaktsena korraldamine on kindlasti vajalik, kuna pidevalt on probleem suitsutatud
  toodetes PAH-ide maksimaalse lubatud piirm\u00e4\u00e4ra \u00fcletamisega, seega
  peaks sisaldama kindlasti ka praktilist osa.\\n- Infop\u00e4ev \u201eToidualane
  teave algajatele\\\" ja \u201eToidualane teave edasij\u00f5udnutele\\\" peaks olema
  kindlasti lahus.\\n- \u201eESG toidutootjale ja \u2013t\u00f6\u00f6stusele\\\",
  \u201eKliima- ja keskkonnan\u00f5uded toidutootjatelet\u00f6\u00f6tlejatele\\\"
  t\u00f5sta kokku \u00fcheks infop\u00e4evaks, nt \u201eRessursis\u00e4\u00e4stlik
  toidutootmine\\\".\\n- Infop\u00e4ev \u201eToidupettuse ennetamise toiduk\u00e4itlemisettev\u00f5ttes\\\"
  ei ole kuigi praktiline, annab pigem teadmise, et meil on j\u00e4relvalveorganid,
  kes teevad suurep\u00e4rast t\u00f6\u00f6d toidupettuste t\u00f5kestamiseks. Kui
  huvi on suur, siis on v\u00f5imalik teostada ka tasuline infop\u00e4ev. Teema v\u00f5tta
  2025.a p\u00e4evakorda, kuna infop\u00e4ev alles 2023.a novembris toimub.\\n\\nPriit
  Dreimann lahkus koosolekult ootamatute t\u00f6\u00f6kohustuste t\u00f5ttu, volitas
  Sirje Potisepa.\\n\\nKoolitused\\n\\n- Koolituse \u201eToiduj\u00e4\u00e4kide tootmisj\u00e4\u00e4kide
  v\u00e4\u00e4rindamine\\\" vastu on huvi v\u00e4hene, aga allergeeniohje osalejate
  arvu t\u00e4itumisega pole probleeme kunagi veel tekkinud. V\u00e4\u00e4rindamise
  teema on tulevikus seotud Euroopa Liidu seadusandlusega. Suure t\u00f5en\u00e4osusega
  on v\u00f5imalik toiduj\u00e4\u00e4kide v\u00e4\u00e4rindamise teemal koolituste
  korraldamine t\u00e4nu teiste projektide rahastusele.\\n- \u201eTapale suunatavate
  loomade ja lindude puhtus\\\" \u2013 selleteemaline infomaterjal tuleb aasta l\u00f5pus
  v\u00e4lja, hetkel on koosk\u00f5lastamisel. Viia infop\u00e4evaks, kus saab infomaterjali
  infop\u00e4eval tutvustada\\n- Juhtimiss\u00fcsteemide koolitused veebis (tuleks
  teha mingi valik, k\u00f5iki juhtimiss\u00fcsteemide koolitusi korralda ei ole v\u00f5imalik).
  H\u00fcgieenikoolitused (toiduh\u00fcgieen ja \u2013ohutus) eelarve s\u00e4\u00e4stmiseks
  vaid \u00fchel korral. Patogeenid (4 erinevat koolituste ettepanekut): Toidupatogeenide
  \u00fclekandeteede teemasse integreerida lihatoodete h\u00fcgieeni ja ohutus.\\n-
  \u201eKeskastme juhi juhtimisoskuste treening\\\" tuleb viia tasuliseks v\u00f5imaluseks\\n\\n\u00d5piring,
  \u00f5ppereis, ettev\u00f5tte k\u00fclastus:\\n\\n- \u00d5ppereis v\u00e4lisriiki
  (Itaaliasse) \u2013 v\u00e4ga kallis, osalejate arv on ainult 10 inimest.\\n\\nElektroonsed
  v\u00e4ljaanded\\n\\nTeadmussiirde programm p\u00f5llumajanduse, toidu ja maamajanduse
  tegevusvaldkonnas\\n\\n- T\u00f5lket\u00f6\u00f6 \u201eToiduohutuse riskide maandamine\\\"
  on 2012.a materjal, ent ajakohane. Loodetavasti leiab ministeerium muid vahendeid.\\n-
  Materjal \u201eMolekulaarsed meetodid toidupatogeenide levikuteede tuvastamiseks
  ja t\u00fcvede iseloomustamiseks Listeria monocytogenes''e n\u00e4itel\\\" \u2013
  vajadus on tulnud PTA ametnikelt, Mihkel M\u00e4esaar oleks autoriks. Pole m\u00f5eldud
  laiale kasutajaskonnale, pigem j\u00e4relvalveasutustele, kuid molekulaarsed meetodid
