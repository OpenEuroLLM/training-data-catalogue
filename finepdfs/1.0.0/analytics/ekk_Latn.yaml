  p\u00fcsielupaiga valitseja n\u00f5usolekul lubatud.\\n(6) Saunametsa ja \u00c4nniksaare
  p\u00fcsielupaikades on lubatud aegj\u00e4rgne ja h\u00e4ilraie j\u00e4rgmiste piirangutega:\\n2)
  \u00c4nniksaare p\u00fcsielupaigas tuleb puu- ja p\u00f5\u00f5sarinde liituvus hoida
  vahemikus 20\u201340%.\\n1) Saunametsa p\u00fcsielupaigas tuleb rohumaade v\u00f5i
  teedega k\u00fclgnevatele metsamaadele j\u00e4tta puistu v\u00e4hemalt 50 meetri
  laiuse ribana ning puu- ja p\u00f5\u00f5sarinde liituvus hoida vahemikus 20\u201340%;\\n(7)
  Saunametsa ja \u00c4nniksaare p\u00fcsielupaikades on v\u00f5sastumise v\u00e4ltimiseks
  vajalik harvendada puu- ja p\u00f5\u00f5sarinnet teede, radade v\u00f5i rohumaadega
  piirnevatel, v\u00e4hemalt 50 meetri laiustel metsastunud v\u00f5i v\u00f5sastunud
  aladel ning hoida neil puu- ja p\u00f5\u00f5sarinde liituvus vahemikus 20\u201340%.\\n(8)
  Saunametsa ja \u00c4nniksaare p\u00fcsielupaikades on keelatud puidu kokku- ja v\u00e4ljavedu
  k\u00fclmumata pinnasel.\\n(9) Lao ja Kastna p\u00fcsielupaikades on emaputke elutingimuste
  s\u00e4ilimiseks ja parandamiseks vajalik: 1) niita v\u00f5i karjatada pool-looduslikke
  kooslusi ning harvendada puu- ja p\u00f5\u00f5sarinnet;\\n2) alates 1. juulist kas
  iga-aastaselt karjatada v\u00f5i niita igal aastal kolmandik alast, nii et iga kolme
  aasta jooksul oleks pool-looduslike koosluste esinemisalad v\u00e4hemalt \u00fche
  korra niidetud.\\n(10) Lao ja Kastna p\u00fcsielupaikades peab karjatamiskoormus
