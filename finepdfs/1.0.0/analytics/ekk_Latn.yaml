  | V\u00f5ime asukoha m\u00e4rk KB230-99900 |\\n\\n### NISSAN\\n\\n#### NISSANI 5*
  PIKENDATUD GARANTII\\n\\nNissan 5* pikendatud garantii annab teile uuele LEAFile
  garantii plemaks ajaks, l\u00e4bis\u00f5iduks v\u00f5i m\u00f5lemaks. Saadavatele
  lepingutele lei valit v\u00f5imaldab valida teie vajadusteks k\u00f5ige sobivama.\\n\\nRemontimisel
  kasutatakse ainult Nissan''i varuosu ja t\u00f6id teevad Nissan''i eriv\u00e4ljap\u00f5pe
  saanud mehaanikud.\\n\\nNissan 5* pikendatud garantii pakub teile ja teie s\u00f5iduki
  j\u00e4rgmisele omanikuile meelelahu, seet seda saab s\u00f5iduki eravilisel m\u00fc\u00fcmisel
  \u00fcle kauba.\\n\\n### NISSAN\\n\\n#### NISSAN+ HOOLDUSLEPINGUD\\n\\nTagage Nissan+
  hoolduslepingu abil oma uuele LEAFile v\u00e4\u00e4riline hooldus ja s\u00e4steke
  pikemaks perspektiiviks raha.\\n\\nNissan''i hooldusleping katab piisapanj\u00e4rsed
  toimingud, mida soovite teha ja mis on eestatud Nissan''i ametlikus hoolduse k\u00e4siraamatust.\\n\\nHoolduslepingu
  tellimise t\u00e4hendab, et teate algusest peale, kui palju hooldus maksma l\u00e4heb,
  ja dette kaitsust hinnaarifatsiooni eest. Valige tarvikus, mis vastab teie vajadustele,
  ja kasutage ainult Nissan''i originaalvaruosi, misiga pagaldavad teie v\u00e4ljap\u00f5pe
  saanud tehnikud.\\n\\nH\u00e4sti hooldatud autot on suurem j\u00e4reituruv\u00e4\u00e4rtus.
  Kui m\u00fc\u00fcte oma Nissan''i enne polisi kehtivuse l\u00f5ppu, saab uus omanik
  kasu j\u00e4relej\u00e4\u00e4nud lepingust.\\n\\n---\\n\\n**TERVEKU JA T\u00c4HEV\u00c4\u00c4RTUS.**
  Nii kui k\u00f5ikidest paraset muude, siis myyjatele auto esitab Nissan+ hoolduslepingu
  Nissan''i orginaalvaruosi kuni kuni uue s\u00f5iduki garantii kohta aastat v\u00f5i
  100 000 km olevalt sellest, kumb arne tattu, kui need on peegeldatud enne s\u00f5iduki
