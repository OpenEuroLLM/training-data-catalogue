sample: '["\"Lisa 5\\n\\nKilingi-N\u00f5mme G\u00fcmnaasiumi \u00f5ppet\u00f6\u00f6
  korraldamine osalise ja/v\u00f5i t\u00e4ieliku distants\u00f5ppe ajal.\\n\\n1. Distants\u00f5ppe
  \u00f5iguslik alus\\n\\n1.1. Distants\u00f5ppe \u00f5iguslik korraldus tuleneb p\u00f5hikooli-
  ja g\u00fcmnaasiumiseaduse (edaspidi PGS) \u00a7 24 l\u00f5ikest 5, mille kohaselt
  juhendatud \u00f5pe on kooli m\u00e4\u00e4ratud viisil toimuv \u00f5pe, mida v\u00f5ib
  korraldada e-\u00f5ppena. Lisaks s\u00e4testavad riiklikud \u00f5ppekavad v\u00f5imaluse
  korraldada \u00f5pet virtuaalses \u00f5ppekeskkonnas.\\n\\n2. T\u00e4ieliku distants\u00f5ppe
  ja osalise distants\u00f5ppe m\u00f5isted\\n\\n2.1. T\u00e4ielik distants\u00f5pe
  on olukord kus \u00f5ppet\u00f6\u00f6d korraldab j\u00e4tkuvalt kool, kuid \u00f5pilased
  ei viibi koolimajas ja p\u00e4evakava t\u00e4itmiseks, koolitundide l\u00e4biviimiseks,
  juhendamiseks ning info vahendamiseks kasutatakse e-kanaleid;\\n2.2. Osaline distants\u00f5pe
  on olukord, kus \u00f5ppet\u00f6\u00f6d korraldab j\u00e4tkuvalt kool, kuid vaid
  osad ained toimuvad digitaalsete kanalite kaudu; m\u00f5ni koolip\u00e4ev n\u00e4dalas
  on distants\u00f5ppena korraldatud v\u00f5i osade klasside \u00f5ppet\u00f6\u00f6
  mingil ajaperioodil toimub ekanalite vahendusel.\\n\\n3. Distants\u00f5ppe rakendamine\\n\\n3.1.
  Distants\u00f5pe v\u00f5ib olla rakendatud kas osaliselt (\u00f5ppegrupp, klass,
  klassid, kooliaste) v\u00f5i kogu kooli ulatuses t\u00e4ielikult.\\n3.2. Distants\u00f5pet
  rakendatakse:\\n3.2.1. vabariigis kehtestatud \u00f5igusaktide t\u00e4itmiseks;\\n3.2.2.
  kohaliku omavalitsuse \u00f5igusaktide t\u00e4itmiseks;\\n3.2.3. Terviseameti soovitusel;\\n3.2.4.
  \u00f5pilaste ja t\u00f6\u00f6tajate turvalisuse tagamiseks;\\n3.2.5. kooli h\u00e4daolukorra
  lahendamise plaanist tulenevalt;\\n3.2.6. muudel l\u00fchiajalistel erandlikel juhtudel
  kui see on koolikorralduslikult otstarbekas (arvestades riigip\u00fchi, \u00fclekoolilisi
  \u00fcritusi, personalikoolitusi jmt).\\n\\n4. Distants\u00f5ppe periood\\n\\n4.1.
  Distants\u00f5ppe perioodina k\u00e4sitletakse alates kahest p\u00e4evast pikemat
  \u00f5ppetegevust ekanalite vahendusel.\\n4.2. Distants\u00f5pet v\u00f5ib rakendada
  l\u00fchimaks h\u00e4davajalikuks ajaks \u00fchekordselt kuid mitte kauemaks kui
  10 kalendrip\u00e4eva.\\n\\n5. Distants\u00f5ppest teavitamine\\n\\n5.1. Distants\u00f5ppest
  teavitamine toimub v\u00e4hemalt kaks t\u00f6\u00f6p\u00e4eva ette v\u00e4lja arvatud
  juhul, kui n\u00f5ue korraldada \u00f5ppet\u00f6\u00f6 \u00fcmber distants\u00f5ppena
  on tulnud Terviseameti poolt.\\n5.2. Distants\u00f5ppe korraldamisest teavitatakse
  \u00f5pilasi ja vanemaid kooli ametliku elektroonse \u00f5piinfos\u00fcsteemi (edaspidi
  e-kool) ja kooli kodulehe vahendusel.\\n5.3. Klassijuhatajad v\u00f5ivad t\u00e4iendavate
  infokanalitena kasutada klassi \u00f5pilaste ja vanematega varem kokku lepitud teabekanaleid
  (telefon, sotsiaalmeedia, vestlusgrupid, e-kirjavahetus jmt).\\n5.4. Distants\u00f5ppest
  teavitamisel peab info sisaldama j\u00e4rgmiseid osasid:\\n5.4.1. Distants\u00f5ppe
  perioodi algust ja eeldatavat kestvust;\\n5.4.2. Distants\u00f5ppele suunatud \u00f5pilasgrupi
  (\u00f5ppegrupp, klass, klassid, kooliaste) kirjeldust;\\n5.4.3. Distants\u00f5ppe
  korralduslikele dokumentidele viiteid (korrad, soovitused, juhised jmt);\\n5.4.4.
  Kontakte kuhu p\u00f6\u00f6rduda k\u00fcsimustega, ettepanekutega jmt info vahetuseks.\\n\\n6.
  Distants\u00f5ppe korraldus \u00f5pilastele\\n\\n6.1. Distants\u00f5ppe perioodile
  t\u00e4idavad \u00f5pilased \u00f5ppet\u00f6\u00f6 \u00fclesandeid v\u00e4ljaspool
  kooli hooneid ja kinnistut.\\n6.2. Distants\u00f5ppe perioodil l\u00e4htutakse \u00f5ppet\u00f6\u00f6
  korraldamisel j\u00e4rgmistest p\u00f5him\u00f5tetest:\\n6.2.1. \u00f5ppet\u00f6\u00f6
  infovahetus toimub e-kooli keskkonnas;\\n6.2.2. \u00f5ppematerjalide jagamine ja
  kogumine toimub e-kooli, Google drive ja e-kirjade vahendusel kui aine\u00f5petaja
  ei ole \u00f5pper\u00fchmaga kokku leppinud teisi keskkondi;\\n6.2.3. koolip\u00e4eva
  \u00f5ppetunnid toimuvad kehtiva tunniplaani alusel;\\n6.2.4. \u00f5pilasel on kohustus
  osaleda v\u00e4hemalt \u00fcks t\u00f6\u00f6p\u00e4ev ette teada antud online tundides,
  teiste \u00f5ppetundide \u00fclesannete t\u00e4itmise aja valikul on \u00f5pilane
  vaba;\\n6.2.5. osalemiseks vajab \u00f5pilane laua-v\u00f5i s\u00fclearvutit ning
  interneti\u00fchendust, t\u00f6\u00f6tavat kaamerat ja mikrofoni ning kool ei taga
  interneti\u00fchendust;\\n6.2.6. kui \u00f5pilane vajab distants\u00f5ppeks kooli
  tehnilist tuge, saab lapsevanem laenutada arvuti koolist ja see tuleb distants\u00f5ppe
  l\u00f5ppemisel tagastada kooli;\\n6.2.7. et \u00f5pilane saaks oma aega plaanida,
  antakse k\u00f5ik distants\u00f5ppe \u00fclesanded ja suunised tundideks e-koolis
  tunnisisuna sama koolip\u00e4eva hommikuks hiljemalt kell 8:00;\\n6.2.8. e-kooli
  m\u00e4rgitud \u00fclesande j\u00e4rel on kirjas, kas \u00f5petaja ootab seda \u00fclesannet
  tagasi arvestamiseks (arvestatud A, mittearvestatud MA) v\u00f5i hindamiseks;\\n6.2.9.
  e-kooli kantakse t\u00f6\u00f6 esitamise t\u00e4htaeg (kuup\u00e4ev ja kellaaeg);\\n6.2.10.
  hindamise alused distants\u00f5ppes on samad, mis kontakt\u00f5ppel ning on kirjeldatud
  ainekaartidel mis on leitavad e-koolis;\\n6.3. Distants\u00f5ppe perioodi esimesel
  p\u00e4eval edastavad aine\u00f5petajad e-kooli vahendusel \u00f5pilastele ja vanematele
  ainetundide ja \u00f5petaja tegevuse p\u00f5him\u00f5tted, mis sisaldavad v\u00e4hemalt
  j\u00e4rgmist teavet:\\n6.3.1. \u00f5petaja t\u00f6\u00f6p\u00e4eva algus ja l\u00f5pp;\\n6.3.2.
  v\u00e4ljaspool ainetundi onlines suhtlemise (telefon, messenger, videok\u00f5ne
  jmt) alguse ja l\u00f5pu aeg (minimaalselt 45 minutit igal t\u00f6\u00f6p\u00e4eval
  vahemikus 8.30 \u2013 16.30);\\n\\n6.3.3. ainetunni v\u00e4liste konsultatsioonide
  n\u00e4dalap\u00e4eva, alguse ja l\u00f5pu aja ning konsultatsiooni toimumise viisi
  ja kanali.\\n6.4. Distants\u00f5ppes osalemine on \u00f5pilasele kohustuslik ning
  \u00f5ppet\u00f6\u00f6s osalemine ja mitteosalemine t\u00e4histatakse elektroonses
  \u00f5ppeinfos\u00fcsteemis analoogselt kontakt\u00f5ppega;\\n6.5. Distants\u00f5ppelt
  puudumistest teavitamine toimub analoogsetel alustel kontakt\u00f5ppest puudumiste
  teavitamisega.\\n6.6. Kooli tugiteenuste (logopeed, eripedagoog, \u00f5piabi \u00f5petaja,
  ps\u00fchholoog jmt) t\u00f6\u00f6 \u00f5pilase ja vanema n\u00f5ustamisel toimub
  e-kirja, telefoni v\u00f5i vajadusel ja kokkuleppel videosilla vahendusel ning \u00f5ppealajuhataja
  koordineerimisel.\\n\\n7. Videotundide regulatsioon\\n\\n7.1. tundide voogedastamine
  distants\u00f5ppe korral toimub avaliku \u00fclesande t\u00e4itmiseks ning ei vaja
  eelnevaid n\u00f5usolekuid;\\n7.2. videotunni otse\u00fclekandele peab olema ligip\u00e4\u00e4s
  vaid selleks etten\u00e4htud isikutel;\\n7.3. \u00f5petaja peab veenduma, et \u00fclekannet
  j\u00e4lgivad vaid etten\u00e4htud lapsed, sealhulgas ei v\u00f5i seda ilma kokkuleppeta
  j\u00e4lgida ka lapsevanemad. Selle v\u00f5ib seada tunnis osalemise tingimuseks;\\n7.4.
  soovitus on lastel hoida enda videopilti kodus nii, et peale nende ei oleks taustal
  muid isikuid ja kasutada k\u00f5rvaklappe;\\n7.5. \u00f5petaja v\u00f5ib n\u00f5uda,
  et \u00f5pilane peab oma videopilti jagama; (Reaalajas \u00f5pilastest videopildi
  j\u00e4lgimine on Andmekaitse Inspektsiooni hinnangul p\u00f5hjendatud, et \u00f5petaja
  saaks tundi l\u00e4bi viia, sh kontrollida \u00f5pilase tunnis osalemist).\\n7.6.
  videotunnis osalemine on kohustuslik;\\n7.7. enne videotundi kontrollib \u00f5pilane
  \u00fcle tehnilised vahendid (interneti\u00fchendus, kaamera, mikrofon);\\n7.8.
  videotunnis osaleb \u00f5pilane sisse l\u00fclitatud kaameraga;\\n7.9. videotundi
  siseneb \u00f5pilane alati oma isikliku kontoga, vanusepiirangutest tulenevalt on
  lubatud kasutada vanema kontot;\\n7.10. videotunnis osalemiseks valib \u00f5pilane
  vaikse ruumi, on viisaka ja korrektse riietusega;\\n7.11. tunnis l\u00fclitab \u00f5pilane
  mikrofoni sisse ainult siis, kui \u00f5petaja on selleks loa andnud;\\n7.12. videotunni
  vestlusalas kirjutab \u00f5pilane ainult \u00f5ppet\u00f6\u00f6ga seotud infot;\\n7.13.
  \u00f5pilane ei tegele videotunnis \u00f5ppet\u00f6\u00f6v\u00e4liste tegevustega;\\n7.14.
  \u00f5pilane lahkub videotunnist, kui \u00f5petaja on andnud selleks loa;\\n7.15.
  videotunni salvestamine on osalejatele keelatud;\\n7.16. \u00f5petajal on \u00f5igus
  videotundi l\u00e4bi viia tema enda poolt eelnevalt salvestatud materjalidega.\\n\\n8.
  Distants\u00f5ppe korraldus \u00f5petajatele ja personalile\\n\\n8.1. Distants\u00f5ppe
  perioodil t\u00f6\u00f6tavad \u00f5petajad ja personal vastavalt kooli p\u00e4evakavale
  t\u00e4ites oma ametijuhenditest tulenevaid kohustusi.\\n8.2. Kooli hoonetes ja
  kinnistul t\u00f6\u00f6 tegemine lepitakse kokku kooli juhtkonnaga l\u00e4htudes
  konkreetsetest distants\u00f5ppe p\u00f5hjustest, olukorrast, v\u00f5imalustest
  ja vajadustest.\\n\\n9. Distants\u00f5ppe korraldus kooliv\u00e4listele isikutele\\n\\n9.1.
  Distants\u00f5ppe perioodil lubatakse kooli hoonetesse kooliv\u00e4liseid isikuid
  vaid juhtkonnaga v\u00f5i klassijuhatajaga eelneval kokkuleppel.\\n9.2. Koolil on
  \u00f5igus distants\u00f5ppe perioodil piirata kooliv\u00e4liste isikute liikumist
