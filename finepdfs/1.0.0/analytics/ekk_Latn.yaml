  v\u00f5imalustest ja vajadustest.\\n\\n10. \u00d5ppekavav\u00e4liste tegevuste korraldamine
  distants\u00f5ppe perioodil.\\n\\n10.1. \u00d5ppekavav\u00e4liste tegevuste (huviringid,
  treeningud, laagrid, klassis\u00fcndmused, v\u00e4ljas\u00f5idud jmt) korraldamist
  otsustab kooli juhtkond l\u00e4htudes konkreetsetest distants\u00f5ppe p\u00f5hjustest,
  olukorrast, v\u00f5imalustest ja vajadustest.\\n\\nKilingi-N\u00f5mme G\u00fcmnaasiumi
  kodukorra Lisa 5 on l\u00e4bi arutatud, parandusettepanekud tehtud ja arvamuse andnud:\\n\\n\u00f5ppen\u00f5ukogu
  27. november 2020protokoll nr 1.1-6/3;\\n\\nhoolekogu 2. detsember 2020 protokoll
  nr 1.1-5/16;\\n\\n\u00f5pilasesindus 16. november 2020 protokoll nr 1.1-13/44.\"",
  "\"Peatoimetaja veerg. Kevad tuli teisiti\\n\\nHelle Ruusing (RiTo 11), peatoimetaja,
  Riigikogu Kantselei infotalituse infon\u00f5unik\\n\\nEestile on kevad 2007 olnud
  erakordne. Esimest korda viimase viieteistk\u00fcmne aasta jooksul saime tunda,
  et meil v\u00f5ib olla t\u00f5siseid sise- ja v\u00e4lispoliitilisi probleeme. Oleme
  viimastel aastatel nautinud kiire majandusedu vilju, meie elatustase on tunduvalt
  kasvanud, oleme olnud altid juurutama uusi tehnoloogiaid. V\u00e4ike, aga edukas
  ning stabiilne riik Euroopa \u00e4\u00e4realal \u2013 selline oli meie kuvand ja
  sellises riigis uskusime end elavat. Need, kes viimastel aastatel viitasid v\u00f5imalusele,
  et edasiminek toppab, et oleme silmitsi t\u00f5siste sotsiaalsete probleemidega
  ja vajaksime arutelu, kuidas edasi minna, j\u00e4eti vajaliku t\u00e4helepanuta.
  Poliitikud on aina v\u00e4itnud, et meie edu on p\u00fcsiv ning kui mingi tagasil\u00f6\u00f6k
  peakski tulema, on kukkumine sujuv. \u00dcha enam hakkas meile nii riigi kui ka
  \u00fcksikisiku tasemel tunduma, et raha pole probleem, k\u00fcsimus on, kuhu ja
  kuidas seda jagada v\u00f5i kuhu paigutada.\\n\\nSeda, et Eesti majandusedu hoovad
  on oma kiiruse kaotanud, konkurentsiv\u00f5ime v\u00e4heneb, kvalifitseeritud t\u00f6\u00f6j\u00f5ud
  lahkub Eestist, kulutused t\u00f6\u00f6j\u00f5ule kasvavad ning meil pole endiselt
  Euroopa \u00fchisraha, oleme j\u00e4\u00e4rap\u00e4iselt eiranud. Uskusime end elavat
  turvalises ja s\u00f5bralikus riigis. Olime unustanud, et meie k\u00f5rval elab
  arvestatav hulk muukeelseid ja paljudes k\u00fcsimustes ka muumeelseid kaaskodanikke.
  Kodanikke, kelle h\u00e4\u00e4li meie poliitikud valimistel meelsasti p\u00fc\u00fcavad,
  aga kelle h\u00e4\u00e4lt ei ole tegelikult keegi kuulanud. P\u00e4rast aprillis\u00fcndmusi
  r\u00e4\u00e4gitakse integratsioonipoliitika l\u00e4bikukkumisest ja n\u00f5utakse
  kiireid lahendusi. Nagu oleks v\u00f5imalik lahendada paari kuu v\u00f5i aastaga
  seda, mida pole suudetud viieteistk\u00fcmne aastaga. Valitsus omakorda v\u00e4idab,
  et neil polegi kellegagi l\u00e4bi r\u00e4\u00e4kida, keegi ei esindavat vene kogukonda.
  Loomulikult tuleks anal\u00fc\u00fcsida, kas ja kuidas oleme integratsioonipoliitikat
  teinud ning miks selle elluviimisse paigutatud miljonid riigi ja v\u00e4lisraha
  pole tulemusi andnud. Samas peaksime esimese asjana eesti \u00fchiskonna sees l\u00e4bi
  r\u00e4\u00e4kima, milliseks l\u00f5imumiseks me ise \u00fcldse valmis oleme. See
  on k\u00fcsimus, milles pronksmehe \u00fcmberpaigutamisest siirast r\u00f5\u00f5mu
  tundnud rahvuslastele saab osaks suur pettumus. Me ei saa muukeelseid Eestist v\u00e4lja
  saata, me ei saa neist eestlasi kasvatada ja ma isegi kahtlen, kas suudame neid
  veenda, et ajalugu oli selline, nagu ta meile on. Meil tuleb kardetavasti teha palju
  suuremaid j\u00e4releandmisi, kui rahvuslikult meelestatud osa Eestist kunagi sooviks.
  K\u00f5ike seda arvestades tahaks k\u00fcll kiiresti n\u00e4ha v\u00f5imuloleva
  valitsuse kava l\u00f5imumispoliitika eesm\u00e4rkide ja lahenduste \u00fcle debateerimiseks.
  Seni puudunud j\u00e4rjepidevus rahvastikuministrite haldusalas peaks asenduma valitsuste
  vahetusi \u00fcleelava pikaajalise tegevuskavaga. Muidu on nii, et m\u00f5ni valitsusliige
  r\u00e4\u00e4gib kiirest \u00fcleminekust \u00fchesugusele eestikeelsele koolis\u00fcsteemile,
  teine on valmis vene keele kasutamist oluliselt laiendama. On t\u00e4iesti kindel,
  et suur osa muukeelsest kogukonnast j\u00e4\u00e4b Eestisse elama ja on valmis riigile
  lojaalne olema, kui riik ennast ja oma n\u00f5udmisi selgelt v\u00e4ljendab.\\n\\nVenemaa
  tuletas oma olemasolu meile meelde, suur osa eestlastest oli ta vist sootuks \u00e4ra
  unustanud. V\u00e4lispoliitiline kriis, mille pronksmehe teisaldamine esile kutsus
  ja mis Venemaa r\u00e4ige k\u00e4itumise t\u00f5ttu esialgu meie kasuks p\u00f6\u00f6rdus,
  on pikemas perspektiivis meie diplomaatidele l\u00f5putu t\u00f6\u00f6p\u00f5ld.
  Usalduskrediit, mille me Euroopas ja maailmas v\u00e4lja v\u00f5tsime, kaitses meid
  k\u00fcll konkreetses olukorras, kuid tegi meist probleemidega riigi. Meie kuvand
  sai rikutud.\\n\\nAprillis\u00fcndmused n\u00e4itasid muu hulgas, kui v\u00e4he
  on meis sallivust. Valitsuse otsusesse pronkss\u00f5duri k\u00fcsimuses kriitiliselt
  suhtunud arvamusavaldajad tembeldati rumalateks intellektuaalideks v\u00f5i isegi
  riigivastasteks. \u00dchel hetkel tundus, et \u00f5igus teisiti v\u00f5i erinevalt
  m\u00f5elda ja \u00f6elda on Eesti riigis \u00e4ra keelatud. See on n\u00e4htus,
  mille vastu tuleb igal juhul astuda, sest \u00f5igus oma arvamusele kuulub demokraatia
  p\u00f5hiolemusse. Mul on v\u00e4ga kahju, et kriitilistel hetkedel eelistas suur
  osa poliitikuist vaikida, sest m\u00f5nes tunduvalt kriitilisemas olukorras v\u00f5ivad
  vaikimist eelistavad poliitikud iseseisvusele saatuslikuks saada.\\n\\nSel s\u00fcgisel
  m\u00f6\u00f6dub viisteist aastat Eesti Vabariigi neljanda p\u00f5hiseaduse vastuv\u00f5tmisest.
  See on p\u00f5hiseadus, millega Eestist sai parlamentaarne vabariik. Kui p\u00f5hiseaduse
  loojad olid pigem mures parlamendi k\u00e4tte kontsentreerunud v\u00f5imu p\u00e4rast,
  siis tegelik elu on viieteistk\u00fcmne aastaga osutunud teistsuguseks \u2013 ja
  palju halvemaks. Parlamendist on saanud t\u00e4itevv\u00f5imu otsuste vormistaja,
  asjaolu, millele esialgu arglikult viidati, aga n\u00fc\u00fcd juba t\u00e4ie enesestm\u00f5istetavusega
  osutatakse. Peab k\u00fcsima, kas parlamendil on \u00fcldse tahtmist astuda nendesse
  kingadesse, mille p\u00f5hiseadus talle annab, ja hakata t\u00e4itma edukalt k\u00f5iki
  talle antud funktsioone. Eeldused selleks peaks valitud XI Riigikogul olema, kahel
  kolmandikul valitud rahvaesindajaist on parlamendit\u00f6\u00f6 ja poliitika kogemus
  olemas, parlament koosneb professionaalsetest poliitikutest.\\n\\nRiigikohtu esimees
  ja \u00fcks p\u00f5hiseaduse loojaid M\u00e4rt Rask kirjutab oma essees: \\\"P\u00f5hiseaduse
  vaim ei mahu p\u00f5hiseaduse normidesse, teksti ega s\u00f5nadesse. See on hoopis
  laiem arusaam ideedest ja v\u00e4\u00e4rtustest, mis suunavad ja juhivad \u00fchiselu
  korraldust, kujundavad moraali ja poliitikat tavadest, traditsioonidest ja tervest
  m\u00f5istusest l\u00e4htudes. P\u00f5hiseadus on vaimule \u00fcksnes tekstiline
  tugi. Eesti erip\u00e4ra seisnes selles, et tuli luua ka uus vaim, sest radikaalne
  \u00f5igusv\u00e4\u00e4rtuste \u00fcmberhindamine ei saanud toetuda l\u00e4himineviku
  tavadele ega traditsioonidele. P\u00f5hiseaduse vaimu pole v\u00f5imalik defineerida,
  k\u00fcll aga on seda v\u00f5imalik tajuda l\u00e4bi \u00f5igluse m\u00f5\u00f5dupuu,
  seades riigi ees esikohale inimese. P\u00f5hiseaduse vaim sisaldub konstitutsionalismis
  kui m\u00f5ttesuunas, mis on oma p\u00f5hiolemuselt suunatud riigiv\u00f5imu piiramisele
  avaliku rahu ja \u00fcldise h\u00fcvangu huvides.\\\"\\n\\n\u00dcks on kindel \u2013
  p\u00f5hiseadus on rahvast h\u00e4sti teeninud.\\n\\nL\u00e4hiaastatel tuleb Eestil
  lahendada hulk majanduslikke ja sotsiaalseid probleeme. Mida varem me seda endale
  teadvustame, seda edukamad oleme. Me ei saa n\u00f5uda, et poliitikud oleksid k\u00f5igis
  k\u00fcsimustes juba ette targad, poliitikud vajavad otsuste tegemiseks palju rohkem
  teadlaste abi, kui seda seni on pakutud. Siin ei piisa arvamusavaldustest, tarvis
  on t\u00f5siseltv\u00f5etavaid uuringuid. Teadusasutused, \u00fclikoolid, m\u00f5ttekojad
  peaksid ka ise olema rohkem valmis esitama usaldusv\u00e4\u00e4rsetel uuringutel
  p\u00f5hinevaid soovitusi. Vastasel korral j\u00e4\u00e4vadki poliitikute autoriteediks
  uuringufirmade k\u00fcsitlustulemused, mis on aluseks pigem populistlike kui j\u00e4tkusuutlike
  otsuste langetamisele. Usaldusv\u00e4\u00e4rsed uuringud v\u00e4listaksid ka v\u00f5imaluse
  \u00fchiskonnateadlaste soovitustesse \u00fcleolevalt suhtuda v\u00f5i neid ignoreerida.\\n\\nRiigikogu
  Toimetiste eesm\u00e4rk on alati olnud edendada dialoogi teadlaste ja riigitegelaste
  vahel. Edaspidi pakume uuringute ja arvamuste rubriigis v\u00f5imalust avaldada
  ka eelretsenseeritud teadusartikleid, mis k\u00e4sitlevad n\u00fc\u00fcdis\u00fchiskonna,
  riigivalitsemise ja poliitika huvipakkuvaid probleeme. Samuti on oodatud autorite
  v\u00e4lismaistes teadusajakirjades avaldatud artiklite eestindused.\\n\\nSeekordsest
  numbrist leiab lugeja lisaks M\u00e4rt Raski esseele \u201eT\u00e4nu p\u00f5hiseadusele\\\"
  poliitikute ja poliitikavaatlejate Riigikogu valimise teemalise vestlusringi, artiklid
  innovatsiooni kohta. K\u00e4sitlemist leiavad eripensionide, peretoetuste ja hoolekandes\u00fcsteemi
  probleemid sotsiaalvaldkonnast ning avaliku ja kodanikualgatuse partnerlus.\\n\\nKevad
  on tulnud teistmoodi. On arvatud, et p\u00e4rast aprillis\u00fcndmusi on k\u00f5ik
  palju selgem. Mulle n\u00e4ib, et vastupidi \u2013 meile sai selgeks, et midagi
  pole p\u00e4ris selge. Peame peeglisse vaatama ja nentima, et meil on palju k\u00fcsimusi,
  aga pole vastuseid. Need tuleb aga leida.\\n\\nVist peab pronksmeest t\u00e4nama,
  et ta meid eneseimetluse unest \u00e4ratas.\"", "\"Teadmussiirde programm p\u00f5llumajanduse,
  toidu ja maamajanduse tegevusvaldkonnas\\n\\nToiduohutuse n\u00f5ukogu koosolek\\n\\nPROTOKOLL\\n\\n16.
