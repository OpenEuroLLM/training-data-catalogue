  programm p\u00f5llumajanduse, toidu ja maamajanduse tegevusvaldkonnas\\n\\nInfop\u00e4evad\\n\\n-
  Infop\u00e4ev \u201eToidu, toiduohutuse v\u00f5i toitumise alaste uuringute tulemused\\\"
