  ELEKTRIKOMPLEKT,\\n13 KLEMMEGA,\\nKE505-55O12\\nMaksimaalne vertikaalkoormus on
  52,5 kg\\n* Ei saa kokku liisavarustuses oleva varurattaga.\\n\\nOhutum, nutikam
  ja t\u00f5husam\\n\\nMeie kodused laadimisvallikud sobivad ideaalselt neile majaomahikele,
  kellel on vaja oma elektriauto kiiresti ja t\u00f5husalt valmis seada. Need nutikad
