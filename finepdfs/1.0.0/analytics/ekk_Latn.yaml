  (kes l\u00e4heb aktsiisierisuse alla) v\u00f5i tootja vaates? Alkoholi teema on
  keeruline, kuna on seotud mitme institutsiooniga. Kas ministeeriumid on omavahel
  ise v\u00f5imelised koosk\u00f5lastama tekkinud ebak\u00f5lad? Materjal on vajalik
