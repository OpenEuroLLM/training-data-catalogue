  i kirjeldus\\n\\n- testi identifikaator\\n- millist omadust testib\\n- testolukord
  (sisuline!)\\n- sisendid\\n- oodatavad v\u00e4ljundid\\n\\n4. Testimine:\\n\\n4.i.
  Testi nr. i t\u00e4itmine\\n\\n- testi tulemused\\n- tulemuste anal\u00fc\u00fcs\\n\\n5.
  Kokkuv\u00f5te:\\n\\n- testimise p\u00f5hjalikkus\\n- testimise tulemused\\n- s\u00fcsteemi
  himmang\\n\\nLisa: ahelate n\u00e4ited; ebakindluste t\u00f6\u00f6tuse n\u00e4ited\\n\\n5.
  ES projekti anal\u00fc\u00fcs\\n\\n1. Anal\u00fc\u00fcsija andmed (nr, nimi, r\u00fchm)\\n\\n2.
  Vaadeldava projekti andmed\\n\\n- autori nr, nimi, r\u00fchm\\n- projekti nimi,
  l\u00fchike sisu\\n- projekti staatus ja \u00fcleandmise kpv\\n- anal\u00fc\u00fcsi
  sisendid (programm, tekst, dokumentatsioon,\u2026)\\n\\n3. Anal\u00fc\u00fcs (\u00e4
  maks 10p)\\n\\n- \u00fclesande p\u00fcstitus: realistik l\u00e4hteolukord; tiitelleht;
  sisu; laad ja maht vastavad\\n- spetsifikatsioon: n\u00f5udmised j\u00e4relduvad
  l\u00e4hteolukorras; spetsif. on t\u00e4ielik, koosk\u00f5laline, realiseeritav,
  testitatav\\n- programm: vastavus n\u00f5udmistele\\n- dokumentatsioon: k\u00f6ik
  osad olemas; vormistamine kvaliteetne; kasutatav\\n- testimine: realistlikkus; ulatus;
  lisad\\n\\n4. Soovitus punktisumma kohta (arvestusega 100 %), maks 40\\n\\n6. Ettekanne
  ja selle hindamine\\n\\nTEEMAKS V\u00d5IB OLLA:\\n\\n- iseseisev t\u00f6\u00f6\\n-
  lisateema loengule\\n\\nESITUS:\\n\\n- Ettekanne esitatakse semestri jooksul kas
  loengul v\u00f5i praktikumil (soovitav registreerida ette).\\n- Kuulajaskonna suurus
  peab olema v\u00e4hemalt 5 tudengit pluss \u00f5ppej\u00f5ud.\\n\\n\u2022 Ettekande
  pikkus on 5..15 minutit, millele j\u00e4rgneb arutelu ca 10 minutit.\\n\u2022 \u00dchel
  loengul saab esineda max. 2..3 inimest.\\n\\nSOOVITUSI ETTEKANDEKS:\\n\u2022 Tutvustage
  ennast ja ettekande \u00fcldist struktuuri\\n\u2022 Jaotage ettekanne osadeks, tutvustage
  neid\\n\u2022 Andke selge \u00fclesande p\u00fcstitus (milleks, kellele, kuidas,
  mis keskkonnas s\u00fcsteem peaks toimima)\\n\u2022 \u00dclesande p\u00fcstitusest
  tulenevad lahendused\\n\u2022 R\u00e4\u00e4kiga kuulajatele ja kuuldavalt\\n\u2022
  Kasuks on kiled, joonised tahvilil v\u00f5i muu illustreeriv materjal (tekst kiledel
  peaks olema taha ritta loetav)\\n\\n7. Realiseerimise vahendeid praktikumis\\n\\n\u2022
  Praktikumi ruumis :\\n\u2022 Uuem Exsys - o:\\\\aps3\\\\exsys (kopeerida cars.*
  kataloogi c:\\\\rule)\\n\u2022 Vana Exsys o:\\\\naide\\\\tepandi\\\\exsys85 kaks
  alamkataloogi, ei t\u00f6\u00f6ta v\u00f5rku l\u00fclitatud arvutitel\\n\u2022 Level
  5 Object - o:\\\\aps3\\\\l5o30 ->c:\\\\l5o30 ja installeerida (kui pole tehtud)\\n\u2022
  Internet search: ES, KBS\u2026 - on v\u00f5imalik v\u00f5rgust t\u00f6mmata mitmesuguseid
  s\u00fcsteeme\\n\u2022 Muud vahendid\\n\u2022 Algokeeled, t\u00f6\u00f6lehed, AB,\u2026\\n\u2022
  R\u00fchmat\u00f6\u00f6\u2026\"", "\"Riigikaitse\u00f5petus koolides\\n\\nUurimuse
  eesm\u00e4rgid\\n\\n\u2022 Kuiv\u00f5rd rahul on noored riigikaitse \u00f5petusega?\\n\u2022
  Mida annab noortele riigikaitse-\u00f5petus?\\n\u2022 Mida parandada riigikaitse
  \u00f5petuses?\\n\u2022 Millised on noorte riigikaitselised seisukohad ja miline
  roll on riigikaitse \u00f5petusel noorte hoiakute kujundamisel?\\n\\nUuringu tehniline
  kirjeldus\\n\\nTegu on \u00fcleriigilise uuringuga. Kokku toimus k\u00fcsitlus 16
  koolis, noormehi k\u00fcsitleti 239, t\u00fctarlapsi 69. Tallinna Pol\u00fctehnikumist
  k\u00fcsitleti 3 kursuse tudengeid, g\u00fcmnaasiumidest oli 10nda klassi \u00f5pilasi
  neljas koolis, 11ndast klassist 7s koolis ning l\u00f5puklassis 11 klassist.\\n\\nL\u00dcHIKOKKUV\u00d5TE\\n\\n\u2022
  Suhtumine riigikaitse\u00f5petusse on Eestimaa kooli\u00f5pilaste hulgas p\u00e4ris
  k\u00f5rgelt hinnatud, seda nii \u00f5petamise kvaliteedi kui ka sisu aspektist.\\n\\n\u2022
  Noorte valmisolek \u00fchinemaks riigikaitseliste organisatsioonidega kas rahu ajal
  v\u00f5i v\u00f5imaliku kallaletungi puhul on suur.\\n\\n\u2022 Usaldus Eesti Kaitsev\u00e4esse
  on k\u00f5rge, sama kehtib ka NATO ja Euroopa Liidu kohta.\\n\\nL\u00dcHIKOKKUV\u00d5TE\\n\\n\u2022
  \u00d5petajatest s\u00f5ltub v\u00e4ga palju noorte meelsus riigikaitseliste k\u00fcsimuste
  suhtes. Et \u00f5petajatega ollakse reeglina rahul, siis ka \u00f5ppurite hinnangud
  riigikaitselistesse k\u00fcsimustesse on valdavalt positiivsed.\\n\\n\u2022 Riigikaitse
  aine \u00f5petamise taseimest s\u00f5ltuvad nii \u00f5pilaste suhtumiste iseloom
  kaitsek\u00fcsimustesse kui ka \u00f5ppurite teadmiste tase\\n\\n\u2022 Riigikaitse\u00f5petuses
  j\u00e4\u00e4b ebapiisavaks materiaalne k\u00fclg (vastavate klassiruumide olemasolu,
  \u00f5ppevahendid) ning \u00f5ppuste korraldamise v\u00e4hesus v\u00e4ljaspool kooliseinu\\n\\nMIDA
  ANNAB RIIGIKAITSE\u00d5PETUS?\\n\\n\u2022 suurendab teadmisi relvastuse kohta 41%\\n\u2022
  suurendab m\u00f5istmist, kuidas iga kodanik on seotud riigikaitsega 39\\n\u2022
  annab p\u00f5hjalikke teadmisi s\u00f5jav\u00e4est 37\\n\u2022 \u00f5petab relvi
  h\u00e4sti k\u00e4sitsema 27\\n\u2022 kursus parandab distsipliini 23\\n\u2022 v\u00f5imaldab
  m\u00f5ista, milliseid oma v\u00f5imeid ja v\u00f5imalusi saan kasutada riigikaitse
  huvides 22\\n\u2022 suurendab vastutustunnet 21\\n\u2022 oskused, mida l\u00e4heb
  vaja riigikaitseks 16\\n\u2022 oskused, mida on vaja oma perekonna kaitseks 6\\n\\nEsikohale
  j\u00e4\u00e4vad eelk\u00f5ige riigikaitselised teadmised ja oskused. Kui vaadelda
  tulemusi kogu skaala l\u00f5ikes, siis n\u00e4eme, et kokkuv\u00f5tvalt (n.\u00f6.
  keskmise hinde alusel) on olulisimaks tulemuseks m\u00f5istmine, kuidas iga riigi
  kodanik on seotud riigikaitsega. See \u00fcldine teadmine on vast k\u00f5ige olulisem
  v\u00e4\u00e4rtsus, mida riigikaitse\u00f5petus saab noortele anda. Teised momendid
  on kas teadmislik/tunnetuslikud ja utilitaarsed (relvade tundmine). Kahju on sellest,
  et teadmine ei j\u00f5ua p\u00e4ris h\u00e4sti n\u00f6 isikliku elu, perekonna tasandile.
  See aspekt oleks v\u00e4ga oluline noorte kaitsevalmiduse kasvatamisel.\\n\\n\u2022
  Umbes \u00be (71%) koolinoortest leiab, et riigikaitse \u00f5petus peaks olema valikainena
  (\u00f5pilane ise teeb valiku, kas \u00f5ppida \u00fcht v\u00f5i teist distsipliini).\\n\\n\u2022
  26% noortest leiab koguni, et riigikaitse-\u00f5petus peaks olema kohustuslik k\u00f5igile
  \u00f5pilastele ning vaid 2,6% k\u00fcsitletuist arvas, et nimetatud ainet pole
  vaja \u00fcldse \u00f5petada.\\n\\n\u2022 \u00be (77,6%) k\u00fcsitletuist leiab,
  et seda ainet tuleks \u00f5petada nii noormeestele kui ka neidudele.\\n\\n\u2022
  Ainult noormeeste p\u00e4rsusmaaks peab seda ainet 18,5% vastanutest.\\n\\n\u2022
  Seega, riigikaitse\u00f5petus on praegusel ajal noorte silmis selline distsipliin,
  mida peaksid \u00f5ppima nii neiud kui ka noormehed.\\n\\n\u2022 K\u00fcsitletud
  noorte hulgas domineeris seisukoht, et praegune tundide arv on sobiv (58,8%) v\u00f5i
  siis, et peaks praegusega v\u00f5rreldes olema suurem (m\u00f5nev\u00f5rra v\u00f5i
  palju suurem) \u2013 29,2%. Tundide arvu sooviks v\u00e4hendada 12% noortest.\\n\\n\u2022
  Seega on praegune tundide arv optimaalne, sest tekitab p\u00e4ris suures hulgas
  noortes soovi tundide arvu suurendamise j\u00e4relle.\\n\\nK\u00fcsimus: Mis on
  k\u00f5ige ebaolulisem, mida oled pidanud riigikaitse tundides pidanud \u00f5ppima?\\n\\nKokkuv\u00f5tvalt
  v\u00f5ib \u00f6elda, et tegelikult selliseid aspekte praktiliselt ei esine. 45,1%
  noortest v\u00e4itis, et midagi ebaolulist kursuses ei eksisteeri. 24% vastanutest
  ei oska sellele k\u00fcsimusele vastata (positiivsete aspektide puhul leidus vaid
  7,1% neid, kes ei osanud midagi leida).\\n\\nK\u00fcsimus: Mida pead k\u00f5ige
  olulisemaks, mida sa riigikaitse\u00f5petusest oled saanud?\\n\\nNoored hindavad
  k\u00f5ige enam teadmisi relvadest, nende k\u00e4sitlemisest (40,2%) ning teadmisi
  s\u00f5jav\u00e4est ning Eesti s\u00f5jav\u00e4est eraldi v\u00f5etuna (37,7%).
  Kokkuv\u00f5tlikult v\u00f5ib \u00f6elda, et noori huvitab riigikaitse\u00f5petuses
  nii teoreetiline kui ka praktiline osa (tunnetuslik kui praktilis-m\u00e4nguline-k\u00e4eline
  aspekt).\\n\\nV\u00c4LI\u00d5PPUSED\\n\\n\u2022 K\u00f5ige rohkem on noored k\u00e4inud
  ekskursioonidel (33,1%), j\u00e4rgnevad v\u00e4lilaagritest osav\u00f5tt (21,4%)
  ja matkadel k\u00e4imine (1,9%). Uuring n\u00e4itas selgelt, et eksisteerib v\u00e4ga
  selge seos: mida rohkem on riigikaitse\u00f5petuse raames toimunud v\u00e4ljaspool
  kooli ettev\u00f5tmisi, seda k\u00f5rgema hinnangu noored annavad \u00f5petuse tasemele
  ja kasulikkusele.\\n\\n\u2022 Noored tunnevad vajadust praktilise osa suurendamise
  vastu (67,9%) v\u00f5i siis selle j\u00e4tmise samale tasemele kui praegu (25,6%).
  Nende hulk, kes soovis praktilise osa v\u00e4hendamist j\u00e4\u00e4v\u00e4 v\u00e4ikseks
  (5,2%). Seega vastamaks k\u00fcsimusele, kas suurendada praktilist osa, tuleks vastata
  peasasjalikult jaataval, sest suurem osa noortest on praktilise osaga rahul \u2013
  71,3% noortest on sellega kas v\u00e4ga rahul v\u00f5i pigem rahul. Rahul ei ole
  sellega 19,5% ja 8,1% ei olnud k\u00fcsitlese ajaks praktilise osaga veel kokku
  puutunud.\\n\\nV\u00c4LI\u00d5PPUSED\\n\\n\u2022 Kui v\u00f5rrelda hinnangut riigikaitse\u00f5petuse
  teoreetilisele ning praktilisele osale hinnangua v\u00e4ljaspool kooli toimunud
  \u00fcritustele, siis n\u00e4eme,\\n  et k\u00f5rgeim hinnang antakse just viimasele.
  Need noored, kes osalesid \u00f5ppustel v\u00e4ljaspool kooli, on viimastega v\u00e4gagi
  rahul \u2013 90,9%. Seega antud aine kontekstis just v\u00e4ljaspoole kooli suunatus
  annab noorte hulgas baasi rahuloluks riigikaitse\u00f5petusega.\\n\\nHinnang \u00f5petajale\\n\\nK\u00f5ige
  k\u00f5rgemalt hinnati j\u00e4rgmisi omadusi (keskmine hinne \u00fcle 7,0 palli)\\n\\n\u2022
  oskab hoida distsipliini tunni ajal\\n\u2022 on asjatundlik\\n\u2022 oskab tuua
  elulisi n\u00e4iteid\\n\u2022 v\u00e4\u00e4rib austust s\u00f5janduse asjatundjana\\n\u2022
  aitab paremini m\u00f5ista riigikaitse olemust\\n\\nK\u00fcsimus: Kuidas Sa hindad
  riigikaitse \u00f5petuse kasulikkust Sinu enese jaoks?\\n\\n\u2022 Vaid 14,9% \u00f5ppuritest
  v\u00e4idab, et antud aine on nende peaks peaaegu kasutu. Seevastu 57% noortest
  peab riigikaitse\u00f5petust enese jaoks kasulikuks. \u00dclej\u00e4\u00e4nud noored
  j\u00e4avad oma arvamustes kuskile vahepeale.\\n\\n\u2022 \u00dcldine foon riigikaitsealaste
  teadmiste \u00f5ppimiseks on hea.\\n\\nMida n\u00e4itas riigikaitseliste teadmiste
  test?\\n\\n\u2022 \u00dcldise seosena v\u00f5ib v\u00e4lja tulla j\u00e4rgmise:
  mida k\u00f5rgemalt \u00f5ppur hindab riigikaitsealast \u00f5petust oma koolis ja
  mida kasulikumaks ta seda peab, seda suurem on t\u00f5en\u00e4osus, et ta annab
  \u00f5igeid vastuseid.\\n\\n\u2022 Siit tuleneb ka oluline j\u00e4relalus. Riigikaitse
  aine \u00f5petamise tasemest s\u00f5ltuvad nii \u00f5pilaste suhtumiste iseloom
  kaitsek\u00fcsimustesse kui ka \u00f5ppurite teadmiste tase.\\n\\nK\u00fcsimus:
  Kui Eestile tungitakse kallale, kas Sina isiklikult \u00fchineksid Eesti kaitsej\u00f5udude
  v\u00f5i m\u00f5ne muu aktiivse vastupanuorganisatsiooniga?\\n\\nKindlat \u00fchinemissoovi
  kinnitab 35,1% noortest (39,3% noormeestest ja 20,3% t\u00fctarlastest). Seisukohal,
  et t\u00f5en\u00e4oliselt \u00fchinetaks nende organisatsioonidega on 45,1% noortest.
  19,8% on neid, kes v\u00e4idavad, et nad seda kas ei teeks \u00fcldse v\u00f5i t\u00f5en\u00e4oliselt
  ei teeks.\\n\\nK\u00fcsimus: Kuiv\u00f5rd kindel oled selles, et Eesti Kaitsev\u00e4gi
  on suuteline kaitsma Eestit s\u00f5jalise kallaletungi korral?\\n\\nT\u00e4iesti
  kindel v\u00f5i pigem kindel on 49% noortest, et Eesti on suuteline end kaitsma.
  \u00dclej\u00e4\u00e4nud ei ole selles p\u00e4ris kindlad. Noormehed on Eesti kaitsev\u00f5imes
  v\u00e4hem kindlad kui t\u00fctarlapsed (t\u00f5en\u00e4oliselt on nad rohkem kursis
  selle ainevaldkonnaga).\\n\\nK\u00fcsimus: V\u00f5ttes kokku k\u00f5ike, mida Sa
  tead Eesti Kaitsev\u00e4e kohta, kuiv\u00f5rd sa usaldad Eesti Kaitsev\u00e4ge?\\n\\n78,9%
  noortest usaldab Eesti Kaitsev\u00e4ge kas t\u00e4ielikult v\u00f5i pigem usaldab,
  21,1% kas ei usalda \u00fcldse v\u00f5i pigem ei usalda.\\n\\nK\u00fcsimus: Kui
  homme toimuks Eestis referendum NATO liikmeks saamise k\u00fcsimuses ja Sina saaksid
  h\u00e4\u00e4letada, siis kas Sa isiklikult h\u00e4\u00e4letaksid selle poolt, et
  Eesti saaks NATO liikmeks v\u00f5i h\u00e4\u00e4letaksid selle vastu?\\n\\n94,2%
  noortest h\u00e4\u00e4letaks Eesti NATO liikmelisuse poolt.\\n\\nK\u00fcsimus: Kas
  oled m\u00f5elnud sellele, et v\u00f5iksid oma elus karj\u00e4\u00e4ri teha ka s\u00f5jav\u00e4elasena?\\n\\nK\u00fcsitlus
  n\u00e4itas, et 12% \u00f5pilastest on sellele sageli m\u00f5elnud, aeg-ajalt on
  see m\u00f5te p\u00e4he tulnud 46,1% k\u00fcsitletuist, kuid 41,9 % ei ole seda
  m\u00f5tetki ligi lasknud. K\u00fcllalt huvitav on asjaolu, et noormeeste ja t\u00fctarlaste
  suhtumistes eksisteerib suhteliselt v\u00e4ike erinevus.\\n\\nNende osas, kes on
  m\u00f5elnud s\u00f5jav\u00e4elase karj\u00e4\u00e4reile sageli, vahet praktiliselt
  ei olegi.\\n\\nK\u00fcsimus (lahtine): Kui oled m\u00f5elnud s\u00f5jav\u00e4elase
  karj\u00e4\u00e4riile, siis mis Sind selle juures k\u00f5ige rohkem k\u00f6idab?\\n\\nEelk\u00f5ige
  toovad noored esile j\u00e4rgmisi asjaolusid:\\n- Distsipliin\\n- Mitmekesine, mitterutiinne
  t\u00f6\u00f6\\n- S\u00f5jatehnika\\n- V\u00f5imalus kaitsta oma riiki\\n- F\u00fc\u00fcsiline
  koormus\\n- Korralik palk\\n- Kogu militaarne keskkond\\n\\nK\u00fcllalt palju toovad
  noored esile just karj\u00e4\u00e4riga seotud aspektide: v\u00f5im, juhtimine, k\u00f5rge
  palk, vastutusrikas t\u00f6\u00f6. Aga k\u00fcsimus tegelikult eeldaski seda, et
  noored vastaksid just karj\u00e4\u00e4rist l\u00e4htudes antud probleemile.\\n\\nKokkuv\u00f5ttes\\n\\n\u2022
  Eesti kaitsev\u00e4gedel on praegu selline maine, et noortel j\u00e4tkub piisavalt
  positiivseid motiive, miks oma tulevikku siduda kaitsev\u00e4gedega.\\n\\n\u2022
  Riigikaitse\u00f5petus koolides aitab sellele palju kaasa.\"", "\"J06 \u201eHankimine\\\"
  Lisa 2\\n\\nKinnitatud 18. juunil 2018\\n\\nEDI -2018-KK-25\\n\\nEdelaraudtee Infrastruktuuri
  AS HANKEKORD 2018\\n\\n1. \u00dclds\u00e4tted\\n\\n1.1. Hankekord (edaspidi HK)
  reguleerib Edelaraudtee Infrastruktuuri AS (edaspidi EDI) hangete planeerimist,
  l\u00e4biviimist, hankemenetluse tulemusel hankelepingute s\u00f5lmimist ja muutmist.
  HK n\u00f5uete j\u00e4rgimine on kohustuslik k\u00f5igile t\u00f6\u00f6tajatele
  riigihangete seaduses s\u00e4testatud p\u00f5him\u00f5tete ja n\u00f5uetega koosk\u00f5las.\\n1.2.
  EDI on v\u00f5rgustikusektori hankija transporditeenusega seotud valdkonnas, kui
  hangitavad asjad, teenused v\u00f5i ehitust\u00f6\u00f6d puudutavad v\u00f5rgustiku
  k\u00e4itamist (RHS \u00a7 5 lg 3 p 2, \u00a7 149 lg 1).\\n1.3. HK-s on s\u00e4testatud  hanke
  korraldus v\u00f5rgustikusektori tingimusel rahvusvahelistele hangetele (5.5), lihthangetele
  (5.4) ja v\u00e4ikehangetele (5.3).\\n1.4. K\u00f5ik HK-s ja riigihanke alusdokumentides
  toodud maksumused on esitatud ilma k\u00e4ibemaksuta.\\n1.5. HK uuendatakse vastavalt
  vajadusele. Uuendamise eest vastutab hankekorralduseks volitatud infrastruktuurispetsialist.
  Uuendatud ja juhatuse liikme poolt kinnitatud hankekord avalikustatakse EDI veebilehel
  hankija profiilis.\\n\\n2. \u00dcldp\u00f5him\u00f5tted\\n\\nHK kajastatud \u00fcldp\u00f5him\u00f5tted
  tulenevad Riigihanke seaduse \u00a7 3 s\u00e4tetest.\\n\\n2.1. E-hanked\\n\\n2.1.1.
  E-menetlusena riigihanke registris toimuvad \u00fcldjuhul k\u00f5ik EDI lihthanke
  piirm\u00e4\u00e4ra \u00fcletavad hanked. Riigihangete registri EDI kasutajate \u00f5igusi
  haldab EDI juhatuse liige.\\n2.1.2. Erandolukorras v\u00f5ib elektroonilise lihthankemenetluse
  (5.4.) v\u00f5imalust riigihanke registris mitte kasutada ja piirduda vaid kohustusliku
  hanke avaldamise ja l\u00f5petamisega riigihanke registris. Sellisel juhul toimub
  elektrooniline menetlus hankekeskkonnas Mercell.\\n2.1.3. Maksumusega alla lihthanke
  piirm\u00e4\u00e4ra \u00fcldjuhul hangetele e-keskkonnas menetlust ei toimu, hankimine
  toimub \u00fcldjuhul otsustuskorras v\u00e4ikehanke menetluse raames (5.3.).\\n2.1.4.
  Riigihangete registris ja alternatiivses hankekeskkonnas Mercell sisestab riigihanke
  alusdokumente ja muid vajalikke andmeid ning teavitab huvitatud isikuid hankija
  selgitustest ja hanke k\u00e4igus vastuv\u00f5etud otsustest hanke toimingute eest
  vastutav isik.\\n\\n2.2. M\u00f5istlikkuse p\u00f5him\u00f5tted\\n\\n2.2.1. Rahalisi
  vahendeid peab kasutama m\u00e4\u00e4ratud kvaliteedi juures s\u00e4\u00e4stlikult
  ja otstarbekalt. M\u00f5istlikkus v\u00e4ljendub s\u00f5ltuvalt hanke esemest pakkumuste
  madalaima\\n\\n1\\n\\nhinna v\u00f5i majandusliku soodsuse (hinna ja kvaliteedi
  suhe, arvestatakse hilisemaid hooldus- v\u00f5i olelusringi kulusid) printsiibi
  eelistamises.\\n2.2.2. Funktsionaalselt koos toimivad v\u00f5i sama eesm\u00e4rgi
  saavutamiseks vajalikud asjad, teenused v\u00f5i ehitust\u00f6\u00f6d soetatakse
  \u00fche hanke kooseisus hanget osadeks jagamata. Seejuures kaasub \u00fcle riigihanke
  piirm\u00e4\u00e4ra hangete korral kohustus p\u00f5hjendada alusdokumentides hanke
  osadeks jaotamata j\u00e4tmine.\\n2.2.3. Hange korraldatakse koos hankeobjekti teenindamisega,
  kui selle objekti hooldust, tarvikuid jms on edaspidi v\u00f5imalik hankida ainult
  samalt pakkujalt. Pakkumuste hindamisel v\u00f5etakse seejuures arvesse ka hanke
  objektiga kaasnevad hilisemad hoolduskulud.\\n2.2.4. Asja v\u00f5i s\u00fcsteemi
  hankimisel l\u00e4htutakse p\u00f5him\u00f5ttest, et juhul kui ostetava asja kasutamiseks
  on vajalik v\u00e4lja\u00f5pe, peab see sisalduma hanke maksumuses.\\n2.2.5. V\u00f5imaluse
  korral peab eelistama keskkonnas\u00e4\u00e4stlikke lahendusi.\\n\\n2.3. V\u00f5rdne
  kohtlemine\\n\\n2.3.1. K\u00f5iki hankes osalejaid peab kohtlema v\u00f5rdselt ja
  mittediskrimineerivalt. J\u00e4lgima peab, et k\u00f5ik taotlejatele/pakkujatele
  seatavad piirangud ja kriteeriumid oleksid hanke eesm\u00e4rgi suhtes proportsionaalsed,
  asjakohased ja p\u00f5hjendatud.\\n2.3.2. Piirangute korral pakkujate v\u00f5i allt\u00f6\u00f6v\u00f5tjate
  ringile (mh geograafilise v\u00f5i organisatsioonilise piirangu korral RHS \u00a73
  lg 2) peab kajastuma n\u00f5ue hanke alusdokumentides.\\n\\n2.4. Huvide konflikt\\n\\n2.4.1.
  Hanget korraldav isik peab v\u00e4ltima konkurentsi kahjustavat huvide konflikti.\\n2.4.2.
  Hankekomisjoni t\u00f6\u00f6st menetletava hanke osas ei v\u00f5i osa v\u00f5tta
  isik, kellel esineb huvide konflikt v\u00f5i kelle puhul tekib v\u00f5i v\u00f5ib
  tekkida kahtlus tema erapooletuses. Kirjeldatud juhtumi esinemisel peab komisjoni
  liige viivitamatult komisjoni sellest kirjalikult teavitama ja hoiduma menetletava
  hanke osas edasisest tegevusest komisjoni liikmena. Taandunud komisjoni liikme \u00fclesandeid
  t\u00e4idab sellisel juhul tema asendusliige.\\n\\n2.5. L\u00e4bipaistvus ja kontrollitavus\\n\\n2.5.1.
  Avalikustamine\\n\\n220.127.116.11. EDI veebilehe hankijaprofiilis on avalikustatud
  hankeplaan ja hankekord.\\n18.104.22.168. EDI v\u00f5rgustikusektori hanked kuuluvad
  avalikustamisele k\u00e4ibemaksuta eeldatava maksumuse alusel:\\n Euroopa Liidu
  V\u00e4ljaannete Talituse poolt hallatavas TED (Tenders Electronic Daily) keskkonnas,
  kus sisaldub teave Euroopa riigihangete kohta  \u2013 maksumusega alates rahvusvahelisest
  piirm\u00e4\u00e4rast;\\n Hankekeskkonnas Mercell \u2013 lihthanked, mille menetlus
  ei sooritata riigihangete registris.\\n Eesti riigihangete registris \u2013 maksumusega
  alates kehtivast lihthanke piirm\u00e4\u00e4rast;\\n22.214.171.124. V\u00e4ikehanked
  alla lihthanke piirm\u00e4\u00e4ra \u00fcldjuhul avalikustamisele ei kuulu.\\n\\n2.5.2.
  L\u00e4bir\u00e4\u00e4kimine\\n\\nV\u00f5imalus Pakkujaga l\u00e4bir\u00e4\u00e4kimisteks
  kajastub hanke alusdokumentides.\\n\\n2.5.3. Dokumenteerimine\\n\\n126.96.36.199.
  K\u00f5ik riigihangete registris olevad menetluse otsused j\u00e4\u00e4vad registris
  saadavale registri p\u00f5him\u00e4\u00e4ruse kehtestatud ajaks.\\n188.8.131.52.
  Muud hangetega seotud dokumendid s\u00e4ilitatakse vastavalt EDI dokumendi halduskorrale
  J04 \u201eDokumendi ohje\\\".\\n\\n3. Hanke planeerimine\\n\\nEDI, kui avaliku raudtee
  infrastruktuurimajandaja, hangete pikaajalise planeerimise peamine alus on raudteeinfrastruktuuri
  arendamist suunav tegevuskava (raudteeseadus \u00a7 49 2 alusel viieaastaseks perioodiks)
  vajaliku infrastruktuuri j\u00e4tkusuutlikuks rahastamiseks (hooldamine, uuendamine
  ja arendamine).\\n\\n3.1. Hankeplaan\\n\\n3.1.1. Avalikustamine\\n\\n184.108.40.206.
  EDI hankeplaani (edaspidi HP) kantakse majandusaastas planeeritavad riigihanked
  alates lihthanke piirm\u00e4\u00e4rast v\u00f5rgustikusektoris.\\n220.127.116.11.
  HP (vt HK Lisa 1. \u201eHankeplaani vorm\\\") sisaldab allj\u00e4rgnevat informatsiooni:\\n
  hanke eseme kirjeldus;\\n hanketeate avaldamise koht;\\n hanke l\u00e4biviimise
  eeldatav aeg.\\n\\n3.1.2. Koosk\u00f5lastamine\\n\\n18.104.22.168. EDI  j\u00e4rgneva
  majandusaasta HP kinnitab \u00fcldjuhul juhatuse liige detsembrikuu jooksul.\\n22.214.171.124.
  Kinnitatud HP avalikustatakse viivitamata ettev\u00f5tte veebilehel.\\n\\n3.1.3.
  Vastutus\\n\\n126.96.36.199. HP koostamise ja avalikustamise eest vastutab hankimist
  korraldav infrastruktuurispetsialist.\\n188.8.131.52. Kui tekib vajadus hanke korraldamiseks,
  mis ei ole ette n\u00e4htud eelarves ja/v\u00f5i HP-s, tuleb hanke ettevalmistamine
  koosk\u00f5lastada eelnevalt EDI juhatuse liikmega.\\n184.108.40.206. HP-s kavandatud
  hanke korraldamine ei ole siduv kohustus.\\n\\n4. Hanke korraldamine\\n\\nHankemenetluse
  kavandamise protsessiskeem asub HK Lisa 2. \u201eHanke planeerimise protsess\\\".\\n\\n4.1.
  Ettevalmistamine\\n\\n4.1.1. Hangete korraldamise vajaduse m\u00e4\u00e4ravad ja
  esmase sisendi j\u00e4rgmise majandusaasta hangete planeerimiseks annavad vastava
  valdkonna teenistuste juhid jooksva aasta esimese kvartali jooksul.\\n4.1.2. Ettev\u00f5tte
  struktuuri\u00fcksuste juhtide koosolekul tuvastatakse hankevajaduse prioriteedid
  ja prognoositakse menetlusse v\u00f5etavatele hangetele ajaline kulg ning kaasatavate
  ressursside vajadus.\\n\\n4.2. Hanke liigitus ja k\u00e4sitlus\\n\\n4.2.1. Hanke
  l\u00e4biviimisel kasutatav hanke liik tuleneb s\u00f5lmitava hankelepingu eeldatavast
  maksumusest.\\n4.2.2. Hankemenetluse liik s\u00f5ltub hankeeseme  t\u00e4iendavatest
  tingimustest.\\n4.2.3. Hankek\u00e4sitlus tuleneb \u00fcldjuhul HK-s ja RHS-s s\u00e4testatud
  regulatsioonist ning hankeregistrite reguleeritud t\u00f6\u00f6korraldusest.\\n\\n4.3.
  Vastutus\\n\\nEDI Juhatuse liige m\u00e4\u00e4rab t\u00f6\u00f6sse v\u00f5etavatele
  hangetele vastutavad isikud:\\n4.3.1. hankeeseme tehnilise dokumentatsiooni koostamiseks;\\n4.3.2.
  hanke administratiivseteks tegevusteks (eeltegevuste planeerimine, alusdokumentide
  koostamine ja registritoimingud, lepingu ettevalmistamine);\\n4.3.3. Hankelepingu
  t\u00e4itmiseks (m\u00e4rgitakse hankelepingus lepingupartneri kontaktisikuks).\\n\\n4.4.
  Hankekomisjoni t\u00f6\u00f6\\n\\n4.4.1. \u00dcldjuhul korraldavad hankemenetlusi
  ettev\u00f5tte juhatuse  liikme k\u00e4skkirjaga kinnitatud komisjonid, mille etteotsa
  m\u00e4\u00e4ratakse komisjoni juht.\\n4.4.2. Komisjon on v\u00e4hemalt kolmeliikmeline.
  Komisjoni koosseisu m\u00e4\u00e4ratakse \u00fcldjuhul: struktuuri\u00fcksuse juht,
  valdkonna tehniline spetsialist ja hanke administratiivkorraldaja.\\n4.4.3. Komisjoni
  t\u00f6\u00f6sse v\u00f5ib kaasata h\u00e4\u00e4le\u00f5iguseta vajalikke teadmisi
  omavaid ettev\u00f5tte t\u00f6\u00f6tajaid ning eksperte.\\n4.4.4. Komisjoni \u00fclesandeks
  on:\\n220.127.116.11. pakkumuste avamine;\\n18.104.22.168. pakkujate hankemenetlusest
  k\u00f5rvaldamine;\\n22.214.171.124. pakkujate ja taotlejate kvalifitseerimine v\u00f5i
  mitte kvalifitseerimine;\\n126.96.36.199. pakkumuste vastavaks tunnistamine v\u00f5i
  tagasil\u00fckkamine;\\n188.8.131.52. seaduses v\u00f5i korras ette n\u00e4htud
  juhtudel l\u00e4bir\u00e4\u00e4kimiste pidamine pakkujatega;\\n184.108.40.206. parima
  pakkumuse edukaks tunnistamine.\\n4.4.5. Komisjoni otsus on p\u00e4dev, kui kinnituse
  on andnud \u00fcle poole komisjoni liikmetest. Komisjoni liikmel puudub \u00f5igus
  loobuda otsustamisest v\u00f5i j\u00e4\u00e4da erapooletuks. H\u00e4\u00e4lte v\u00f5rdse
  jagunemise korral saab m\u00e4\u00e4ravaks komisjoni esimehe h\u00e4\u00e4l.\\n4.4.6.
  Komisjoni koosoleku toimumise korral koosolek protokollitakse ja protokolli allkirjastavad
  koosoleku juhataja, komisjoni liikmed ja protokollija. Komisjoni protokoll sisaldab
  j\u00e4rgnevat:\\n220.127.116.11. hanke nimetus;\\n\\n18.104.22.168. komisjoni otsuste
  vastuv\u00f5tmise kuup\u00e4ev;\\n22.214.171.124. komisjoni koosseis, sh vajadusel
  puudunud ja asendusliikmed;\\n126.96.36.199. komisjoni t\u00f6\u00f6sse kaasatud
  isikud (vajadusel);\\n188.8.131.52. komisjoni t\u00f6\u00f6 k\u00e4ik;\\n184.108.40.206.
  hanke avalikustamise v\u00f5i pakkumuse esitamise ettepaneku saatmise asjaolud;\\n220.127.116.11.
  hankes pakkumuste esitanute nimed ja registrikoodid;\\n18.104.22.168. hankes esitatud
  pakkumuste maksumused;\\n22.214.171.124. komisjoni motiveeritud otsused koos viidetega
  nende vastuv\u00f5tmise alustele;\\n126.96.36.199. otsusele vastu h\u00e4\u00e4letanud
  komisjoni liikme eriarvamus (vajadusel);\\n188.8.131.52. ainsa hinnatava pakkumuse
  puhul komisjoni hinnang maksumusele ja majanduslikule soodsusele (vajadusel, tuleb
  tugineda varasematele sarnastele hangetele vms);\\n184.108.40.206. hankemenetluse
  kehtetuks tunnistamise asjaolud (vajadusel);\\n220.127.116.11. protokollile lisatakse
  riigihangete registris koostatud dokumendid ja vajadusel komisjoni t\u00f6\u00f6
  k\u00e4igus pakkujatele ja/v\u00f5i kolmandatele isikutele esitatud j\u00e4relep\u00e4rimised
  koos vastustega.\\n\\n4.5. Eriolukorrad\\n\\n4.5.1. Avariiolukorra kiirmenetlus
  on etten\u00e4gematute s\u00fcndmuste tagaj\u00e4rjel tekkinud \u00e4\u00e4rmine
  vajadus s\u00f5lmida lihtsustatud korras hankeleping, mis ei v\u00f5imalda kinni
  pidada RHS-s s\u00e4testatud t\u00e4htaegadest:\\n18.104.22.168. aset on leidnud
  RdS \u00a7 40 s\u00e4testatud raudteeohutust m\u00f5jutav juhtum: \u00f5nnetusjuhtum,
  t\u00f5sine \u00f5nnetusjuhtum ja vahejuhtum;\\n22.214.171.124. v\u00f5i kui on
  t\u00e4idetud k\u00f5ik j\u00e4rgmised tingimused: etten\u00e4gematu s\u00fcndmus,
  kiireloomuline olukord ehk vajadus kiiresti reageerida ning p\u00f5hjuslik seos
  etten\u00e4gematu s\u00fcndmuse ja selle tagaj\u00e4rjel tekkinud kiireloomulise
  olukorra vahel.\\n4.5.2. Avariiolukorras rakendub tellitavatele teenustele lihtsustatud
  korras v\u00e4ljakuulutamiseta l\u00e4bir\u00e4\u00e4kimistega hankemenetlus, eesm\u00e4rgiga
  taastada v\u00f5imalikult kiiresti  avariieelne olukord ohutuks raudteeliikluseks.\\n\\n5.
  Hankemenetlus\\n\\n5.1. Hankemenetlus algab \u00fcldjuhul hanketeate avaldamisega.
  V\u00e4ljakuulutamiseta l\u00e4bir\u00e4\u00e4kimistega hankemenetlus algab hankija
  poolt hanke alusdokumentide esitamisega \u00fchele v\u00f5i mitmele tema valitud
  huvitatud isikule.\\n5.2. Hankemenetlus l\u00f5ppeb lepingu s\u00f5lmimisega, k\u00f5ikide
  pakkumuste tagasil\u00fckkamisega, k\u00f5ikide pakkujate v\u00f5i taotlejate hankemenetlusest
  k\u00f5rvaldamise v\u00f5i kvalifitseerimata j\u00e4tmisega, pakkumuste v\u00f5i
  taotluste esitamata j\u00e4tmisega, hankemenetluse kehtetuks tunnistamisega v\u00f5i
  k\u00f5igi pakkumuste j\u00f5usoleku t\u00e4htaja l\u00f5ppemisega, kui \u00fckski
  pakkuja ei ole n\u00f5us pakkumuse j\u00f5usoleku t\u00e4htaega pikendama.\\n5.3.
  Hanke l\u00e4biviimisel kasutatav kohustuslik hankemenetluse liik tuleneb s\u00f5lmitava
  hankelepingu eeldatavast maksumusest ja hankekorras v\u00f5i RHS-is s\u00e4testatud
  t\u00e4iendavatest tingimustest.\\n\\n5.4. V\u00e4ikehanke menetlus\\n\\n5.4.1.
  Piirm\u00e4\u00e4rad v\u00f5rgustikusektoris\\n\\nN\u00f5uded kohaldatakse alla
  lihthanke piirm\u00e4\u00e4ra j\u00e4\u00e4vatele v\u00f5rgustiku sektori hangetele:\\n\\nEdelaraudtee
  Infrastruktuuri AS hankekord\\n\\n asjade ostmise, teenuste tellimise ning muudel
  seaduses s\u00e4testatud hangete korral kuni 59 999 eurot;\\n ehitust\u00f6\u00f6de
  tellimise korral kuni 299 999 eurot.\\n\\n5.4.2. Menetlemine\\n\\n126.96.36.199.
  V\u00e4ikehangete teostamisel tuleb arvestada, et sarnaste asjade ja teenuste hanked
  summeeritult ei \u00fcletaks aasta arvestuses lihthanke piirm\u00e4\u00e4ra.\\n188.8.131.52.
  V\u00e4ikeostud kuni 20 000 eurot toimuvad struktuuri\u00fcksuse juhi algatusel
  juhatuse liikmega koosk\u00f5lastatult otsustuskorras ja \u00fcldjuhul hankelepingut
  ei s\u00f5lmita.\\n184.108.40.206. V\u00e4ikehankel maksumusega alates 20 000 eurost
  koosk\u00f5lastab Juhatuse liige hanke l\u00e4biviimise, vajadusel hankekomisjoni
  ja annab volituse eduka pakkumuse esitanud pakkujaga lepingu s\u00f5lmimiseks.\\n220.127.116.11.
  V\u00e4ikehangete korral m\u00e4\u00e4rab vastava struktuuri\u00fcksuse juht spetsialisti,  kes
  koostab v\u00e4ikehanke l\u00e4biviimiseks hinnap\u00e4ringu (alates 20 000 eurost
  \u00fcldjuhul kolmelt pakkujalt) ja vajalikud hanke alusdokumendid, m\u00e4rkides
  olenevalt hankeesemest \u00e4ra:\\n hangitava asja v\u00f5i teenuse nimetus;\\no
  pakkuja usaldusv\u00e4\u00e4rsus;\\n l\u00e4bir\u00e4\u00e4kimiste pidamise vajaduse
  korral tuleb m\u00e4\u00e4rata l\u00e4bir\u00e4\u00e4kimiste tingimused.\\n mitme
  kriteeriumi korral  m\u00e4\u00e4ratakse nende suhteline osakaal otsuse tegemisel;\\n18.104.22.168.
  Pakkumuste esitamiseks m\u00f5istlik t\u00e4htaeg s\u00f5ltub hankelepingu esemeks
  olevatest asjadest, teenustest v\u00f5i ehitust\u00f6\u00f6dest. Hanketeate avaldamine
  hankekeskkonnas Mercell otsustatakse juhtumip\u00f5hiselt.\\n\\n tehniline kirjeldus
  (liik, mark, t\u00fc\u00fcp, t\u00e4histus, standard, materjalid jne);\\n\\n mahud;\\n\\n
  vajadusel tarnetingimused;\\n\\n vajadusel kvalifikatsiooni kontrollimise alused;\\n\\n
  vajadusel pakkumuse sisulise vastavuse tingimused;\\n\\n vajadusel vastutavate isikute
  kutsen\u00f5uetele vastavuse;\\n\\n mitme pakkumuse v\u00f5rdlemisel on \u00fcldjuhul
  valiku  hindamiskriteeriumid:\\n\\no majanduslikult soodsaim pakkumus v\u00f5i madalaim
  hind,\\n\\no tarnetingimused,\\n\\n5.5. Lihthankemenetlus\\n\\n5.5.1. Piirm\u00e4\u00e4rad
  v\u00f5rgustikusektoris\\n\\nLihthange korraldatakse alla riigihanke rahvusvahelise
  piirm\u00e4\u00e4ra j\u00e4\u00e4vatele hangetele:\\n\\n asjade ostmise, teenuste
  tellimise ning muudel seaduses s\u00e4testatud hangete korral maksumusega 60 000
  kuni 442 999 eurot;\\n ehitust\u00f6\u00f6de tellimise korral maksumusega 300 000
  kuni 5 547 999 eurot.\\n\\n5.5.2. Menetlemine\\n\\n22.214.171.124. Lihthankemenetluse
  kord avaldatakse konkreetse hanke alusdokumentides.\\n126.96.36.199. Lihthankemenetluse
  kord tuleneb konkreetse hanke iseloomust, hankeeseme keerukusest ja vajalikest etappidest
  hankelepinguni j\u00f5udmiseks.\\n\\nEdelaraudtee Infrastruktuuri AS hankekord\\n\\n188.8.131.52.
  Lihthanke korral on kohustuslik avaldada riigihangete registris hanketeade ja hankelepingu
  s\u00f5lmimise teade. \u00dclej\u00e4\u00e4nud registris toimuv menetlusk\u00e4ik
  on kirjeldatud hankija koostatud k\u00f5nealuse hanke menetluskorras.\\n184.108.40.206.
  Lepingu s\u00f5lmimisele on kehtestatud kohustuslik ooteaeg, et mitteedukatel pakkujatel
  oleks v\u00f5imalik hankija otsus vaidlustada.\\n\\n5.6. Rahvusvaheline hankemenetlus\\n\\n5.6.1.
  Piirm\u00e4\u00e4rad v\u00f5rgustikusektoris\\n\\nRahvusvaheline hankemenetlus korraldatakse
  \u2013 riigihanke rahvusvahelist piirm\u00e4\u00e4ra \u00fcletavatele hangetele:\\n\\n
  asjade ostmise, teenuste tellimise v\u00f5i ideekonkursi hangete korral 443 000
  eurot ja \u00fcle selle;\\n ehitust\u00f6\u00f6de tellimise korral 5 548 000 eurot
  ja \u00fcle selle.\\n\\n5.6.2. Menetlemine\\n\\n220.127.116.11. Rahvusvaheliste
  hangete korral s\u00e4ilib hankija  n\u00f5ue eesti keelsele pakkumusele, teabevahetusele
  ja t\u00f6\u00f6keelele.\\n18.104.22.168. Rahvusvahelise hankemenetluse korral l\u00e4htutakse
  ennek\u00f5ike riigihangete seadusest. Menetluse kulg s\u00f5ltub finantseerimisallikatest:\\n
  kaasfinantseering struktuurifondidest.\\n omafinantseering;\\n22.214.171.124. Euroopa
  Liidu struktuurifondide ja \u00dchtekuuluvusfondi poolt rahaliselt toetatavate projektide
  raames teostatavad hanked n\u00f5uavad koosk\u00f5lastamist vastava rakendus\u00fcksusega
  (Tehnilise J\u00e4relevalve Amet). Vastavates hankedokumentides  tuleb \u00e4ra
  n\u00e4idata projekti nimi ja number. Vastavalt struktuuritoetuste seaduse ja toetuste
  andmise tingimustele l\u00e4htutakse \u00fcldjuhul avaliku sektori hankija piirm\u00e4\u00e4radest
  ja teostatakse avatud hankemenetlus.\\n\\n6. J\u00e4relevalve\\n\\n6.1. J\u00e4relevalvet
  hanke \u00fcle ettev\u00f5ttes teostab EDI siseaudiitor.\\n6.2. Heakskiidu infrastruktuuri
  rajatiste ja s\u00fcsteemide tehnilistele lahenditele ja kasutatavatele materjalidele
  annab Tehnilise J\u00e4relevalve Amet ehitus ja kasutusloa n\u00e4ol. Lubade taotlus
  ja kohustuslike teadete regulatsioon tuleneb raudteeseaduses s\u00e4testatust.\\n\\nHankeplaani
  vorm                                                                                                                                                                                       HK
  Lisa 1\\n\\nEDELARAUDTEE INFRASTRUKTUURI AS 2018 HANKEPLAAN\\n\\n(alates 01.01.201x)\\n\\nHanke
  planeerimise protsess                                                                                                                                                                     HK
  Lisa 2\"", "\"EESTI NOORTE\u00dcHENDUSTE LIIDU N\u00d5UKOGU KOOSOLEKU PROTOKOLL\\n\\nToimumisaeg:
  27.05.2012\\n\\nToimumiskoht: Tallinn, Estonia pst 5a\\n\\nAlgus: 14.15\\n\\nL\u00f5pp:
  17.25\\n\\nOsalejad: Heiki J\u00e4rveveer, Gerd Tarand, Eero Loonurm, Liina Siniveer
  (Skype)\\n\\nK\u00fclalised: Mailis Ostra, Kaidi Nurmik, Sandra Kamilova, Liina
  R\u00fc\u00fctel, Teele T\u00f5nismann\\n\\nPuudujad: Siivi Liivik\\n\\nJuhataja:
  Sandra Kamilova\\n\\nProtokollija: Kaidi Nurmik\\n\\nP\u00e4evakord:\\n\\n1. P\u00e4evakorra
  kinnitamine\\n2. N\u00f5ukogu esimehe valimine\\n3. Arengukava\\n4. Eelarve ja finants\\n5.
  Tegevuskava\\n6. Meeskond, personal\\n7. Liikmeskonna \u00fclevaade\\n8. ENLi noortepoliitika
  valdkonna strateegia, platvormi uuendamine\\n9. ENLi esindajad n\u00f5ukogudes,
  komisjonides, \u00fcmarlaudades\\n10. N\u00f5ukogu t\u00f6\u00f6korraldus, edasine
  t\u00f6\u00f6plaan, koosolekute ajad 2012\\n11. Kohapeal algatatud k\u00fcsimuse\\n\\n1.
  P\u00e4evakorra kinnitamine\\n\\nEttepanek on p\u00e4evakord kinnitada j\u00e4rgmiselt:\\n\\n1.
  P\u00e4evakorra kinnitamine\\n2. Arengukava\\n3. Eelarve ja finants\\n4. Tegevuskava\\n5.
  Liikmeskonna \u00fclevaade\\n6. Meeskond, personal\\n7. ENLi noortepoliitika valdkonna
  strateegia, platvormi uuendamine\\n8. ENLi esindajad n\u00f5ukogudes, komisjonides,
  \u00fcmarlaudades\\n9. N\u00f5ukogu t\u00f6\u00f6korraldus, edasine t\u00f6\u00f6plaan,
  koosolekute ajad 2012, suhtlus tegevmeeskonnaga\\n10. N\u00f5ukogu esimehe valimine\\n11.
  Kohapeal algatatud k\u00fcsimuse\\n\\nH\u00e4\u00e4letamise tulemus: 4 poolt\\n\\nOtsus:
  p\u00e4evakord on kinnitatud\\n\\n2. Arengukava\\n\\nHetkel ei ole olemas konkreetset
  inimest, kes arengukava koostamist eest veaks. J\u00e4rgmisel poolaastal peaks kindlasti
  olema suurem r\u00f5hk ja prioriteetne tegevus.\\n\\nSh kirja panna arengukava t\u00e4ituvus,
  mis on eelduseks uue tegemisel. Olulisemad on rakenduskava ja tegevuskavade koostamine
  ning nende ellu viimine (ehk ei tasu liialt palju aega ja r\u00f5hku p\u00f6\u00f6rata
  arengukava koostamisele).\\n\\nLeiti, et l\u00e4bi tuleks viia ka ENLi eestkoste
  audit - EMSLi poole p\u00f6\u00f6rduda. Lisaks hinnata ENLi tegevuse m\u00f5jusid
  (Heateo Sihtasutuse poole p\u00f6\u00f6rduda seoses nende poolt kevadel valmiva
  m\u00f5jude hindamise mudeliga). T. T\u00f5nismann saadab n\u00f5ukogu esimehele
  vastava info Heateo SA projekti ja m\u00f5jude hindamise raamistiku kohta.\\n\\nEttepanek:
  arengukava valmimisel v\u00f5iks olla eesm\u00e4rgiks novembri \u00fcldkoosolek
  ning arengukava koostamise eest vastutab n\u00f5ukogu esimees, kes t\u00f6\u00f6tab
  v\u00e4lja arengukava koostamise kondikava.\\n\\nH\u00e4\u00e4letamise tulemus:
  4 poolt\\n\\nOtsus: arengukava valmimisel on eesm\u00e4rgiks novembri \u00fcldkoosolek
  ning arengukava koostamise eest vastutab n\u00f5ukogu esimees, kes t\u00f6\u00f6tab
  v\u00e4lja arengukava koostamise kondikava kahe n\u00e4dala jooksul.\\n\\n3. Eelarve
  ja finants\\n\\nN\u00f5ukogu soovib saada igal koosolekul detailset infot eelarve
  seisu ja t\u00e4ituvusekohta.\\n\\nM. Ostra annab \u00fclevaate eelarvest ja peamistest
  tuluallikatest. Eelarve on \u00fcldjoontes paigas, kuid l\u00e4heb veel muutmisele.\\n\\nEelarve
  t\u00e4ituvus - hetkel teeb t\u00e4ituvust juhatuse esimees, kuna praegune raamatupidamisteenus
  ei ole kvaliteetne. Olemas on kokkulepe ministeeriumiga, et ENLile tuleb alates
  juulikuust 0,5 koormusega raamatupidaja (p\u00fc\u00fcame leida teda mh ka T\u00f6\u00f6tukassa
  kaudu, palgafond tuleb osaluskogude riigieelarvelisest eraldisest ja HTMi aastatoetusest),
  konkurss raamatupidaja leidmiseks kuulutatakse v\u00e4lja esmasp\u00e4eval, kestab
  kaks n\u00e4dalat ja intervjuud on juunis.\\n\\nMajandusaasta aruanne seisab raamatupidamisteenuse
  taga. 29. mail kohtub M. Ostra praeguse raamatupidajaga, et viimastele k\u00fcsimustele
  vastus anda.\\n\\nUus raamatupidaja peab kaasajastama raamatupidamise sise-eeskirja
  ja looma ENLi raamatupidamiss\u00fcsteemi (ENLi raamatupidamine on keeruline, kuna
  on mitmeid eri projekte ja sihtfinantseeringuid) \u2013 vaja on konkreetset ja selget
  s\u00fcsteemi. Edaspidi tuleb esitada kvartali t\u00e4ituvusaruandeid.\\n\\nRevisjonikomisjoni
  tuleks enam kaasata kui kontrollmehhanismi - samas on nad juba ka aidanud m\u00f5elda,
  kuidas uuele s\u00fcsteemile \u00fcle minna ja mida paremini teha. Kindlasti on
  nad abiks, kui tuleb uus raamatupidaja.\\n\\nEttepanek: 11. juuniks esitab kontor
  n\u00f5ukogule 5 audiitori hinnapakkumised (sh \u00fcldine raamatupidamiss\u00fcsteemi
  \u00fclevaatamine ja soovitused).\\n\\nN\u00f5ukogu liikmetele anda vaatleja\u00f5igus
  pangas. Kes soovivad, annavad sellest teada M. Ostrale.\\n\\nH\u00e4\u00e4letamise
  tulemus: 4 poolt\\n\\nOtsus: 11. juuniks esitab b\u00fcroo n\u00f5ukogule 5 audiitori
  hinnapakkumised (sh \u00fcldine raamatupidamiss\u00fcsteemi \u00fclevaatamine ja
  soovitused).\\n\\nN\u00f5ukogu liikmetele anda vaatleja\u00f5igus pangas.\\n\\n4.
  Tegevuskava\\n\\nL\u00e4htuvalt ENLil arengukavast ja tegevuskavast on j\u00e4rgmisel
  poolaastal j\u00e4rgmised prioriteedid:\\n\\n1) Noorsoot\u00f6\u00f6 strateegiasse
  noorte arvamuse kogumine 2) Noortepoliitika fookus paika ja noortepoliitika platvorm
  uuendada 3) Osaluskogude arengute suunamine 4) Liikmeskond paika - ENLi liikmeprofiil
  ja uute liikmete v\u00e4rbamine 5) Juhatuse institutsiooni/ametikoha v\u00e4lja
  kujundamine 6) ENLi personalipoliitika v\u00e4ljaarendamine 7) ENLi pakutavate teenuste
  (sh koolitusvaldkond) v\u00e4lja arendamine 8) Organisatsiooni areng ja sisemise
  tugevuse taastamine 9) Kommunikatsioonistrateegia, ENLi kuvand (2013, kuidas v\u00e4lja
  paistame) 10) E3 (koost\u00f6\u00f6 E\u00dcLi ja E\u00d5ELiga) 11) Finantsstrateegia
  12) Vilistlaskogu loomine 13) Rahastus - 3 noorte katuseorganisatsiooni eraldi RE
  reale saamine 14) Valimisea langetamine (koost\u00f6\u00f6s justiitsministeeriumiga)
  - selle teemaga edasi minna.\\n\\nT\u00e4helepanu p\u00f6\u00f6rati Noortep\u00e4evale
  ja selle korraldamisele - teeme ENTKga koost\u00f6\u00f6s, ENL koondab infot ja
  suunab noortekeskuseid, osaluskogusid noortep\u00e4eva kohalikul tasandil korraldama
  (J\u00e4rvamaal Paides on p\u00f5his\u00fcndmus). Plaanis on teha \u00fcle-Eestiliselt
  aktsioon kokku panna film \\\"P\u00e4ev noore elus\\\" (t\u00e4pne kontseptsioon
  selgumisel).\\n\\nEttepanek: teha maksimaalselt 1-2 n\u00e4dala jooksul Noortep\u00e4eva
  teemaline koosolek (mis on tehtud ja mis on plaanis).\\n\\nL. R\u00fc\u00fctel jagab
  n\u00f5ukoguga osaluskogude RE detailne tegevuskava/eelarvet.\\n\\nH\u00e4\u00e4letamise
  tulemus: 4 poolt\\n\\nOtsus: teha maksimaalselt 1-2 n\u00e4dala jooksul Noortep\u00e4eva
  teemaline koosolek (mis on tehtud ja mis on plaanis).\\n\\n5. Liikmeskonna \u00fclevaade\\n\\nK.
  Nurmik annab \u00fclevaate liikmevaldkonna senistest tegevustest ja tulevikuplaanidest.\\n\\nUusi
  liikmeid v\u00f5ib saada: nt JCI, rotarite ja Lions\u00b4 noorteklubide kaudu, eriala\u00fchendused;
  lisaks vaadata, kelle projekte on rahastajad toetanud. N\u00f5ukogu hoiab silma
  peal v\u00f5imalikel uutel liikmesorganisatsioonidel ja teeb soovitusi.\\n\\nOsaluskogude
  ja noorte\u00fchingute vajadused on erinevad - seda t\u00f6\u00f6s silmas pidada.\\n\\nK.
  Nurmik jagab n\u00f5ukoguga liikmete andmebaasi. Lisaks tuleb kodulehel liikmete
  osa uuendada. K. Nurmik saadab paari p\u00e4eva jooksul n\u00f5ukogule liikmekohtumiste
  memod ning v\u00f5imalusel osalevad n\u00f5ukogu liikmed liikmekohtumistel.\\n\\n6.
  Meeskond, personal\\n\\nK. Nurmik saadab n\u00f5ukogule personali ametijuhendid
  ja palgakulud (mis realt mis palgad l\u00e4hevad), lepingutega on v\u00f5imalik
  tutvuda ENLi kontoris.\\n\\nEttepanek: Noortepoliitika n\u00f5uniku intervjuudel
  osalevad juhatuse esimees, personali- ja haldusjuht ja n\u00f5ukogu esindaja. L\u00f5pliku
  otsuse teevad konsensusele tuginedes juhatuse esimees, personali- ja haldusjuht,
  n\u00f5ukogu esindaja ja v\u00e4hemalt \u00fcks endine noortepoliitika t\u00f6\u00f6taja.\\n\\nEdaspidi
  on n\u00f5ukogu esindajal \u00f5igus osaleda personali valiku juures, n\u00f5ukogu
  esindaja m\u00e4\u00e4rab n\u00f5ukogu igal puhul eraldi.\\n\\nPersonali- ja haldusjuht
  edastab koos kontori ja juhatuse ettepanekutega n\u00f5ukogule kandidaatide CVd
  ja ootab n\u00f5ukogu liikmete ettepanekuid, keda intervjuule kutsuda.\\n\\nH\u00e4\u00e4letamise
  tulemus: 4 poolt\\n\\nOtsus: Noortepoliitika n\u00f5uniku intervjuudel osalevad
  juhatuse esimees, personali- ja haldusjuht ja n\u00f5ukogu esindaja.\\n\\nL\u00f5pliku
  otsuse teevad konsensusele tuginedes juhatuse esimees, personali- ja haldusjuht,
  n\u00f5ukogu esindaja ja v\u00e4hemalt \u00fcks endine noortepoliitika t\u00f6\u00f6taja.\\n\\nEdaspidi
  on n\u00f5ukogu esindajal \u00f5igus osaleda personali valiku juures.\\n\\nPersonali-
  ja haldusjuht edastab koos kontori ja juhatuse ettepanekutega n\u00f5ukogule kandidaatide
  CVd ja ootab n\u00f5ukogu liikmete ettepanekuid, keda intervjuule kutsuda.\\n\\n7.
  ENLi noortepoliitika valdkonna strateegia, platvormi uuendamine\\n\\nK\u00fcsimus
  on, milline n\u00e4eb ENLi noortepoliitika valdkonna strateegia v\u00e4lja sisuliselt
  ja vormiliselt. Valminud on anal\u00fc\u00fcs noorteplatvormi t\u00e4ituvuse kohta.\\n\\nEttepanek:
  T. T\u00f5nismann saadab n\u00f5ukogule anal\u00fc\u00fcsi ja pakub v\u00e4lja kuup\u00e4evad
  aruteluks (noortepoliitika valdkonna strateegia koostamine) mis toimub l\u00e4hema
  paari n\u00e4dala sees\\n\\nH\u00e4\u00e4letamise tulemus\\n\\n: 4 poolt\\n\\nOtsus:
  T. T\u00f5nismann saadab n\u00f5ukogule anal\u00fc\u00fcsi ja pakub v\u00e4lja kuup\u00e4evad
  aruteluks mis toimub l\u00e4hema paari n\u00e4dala sees.\\n\\n6. ENLi esindajad
  n\u00f5ukogudes, komisjonides, \u00fcmarlaudades\\n\\nHetkel on \u00fcsna palju
  kommunikatsiooniprobleeme, segane on, mida on ENLi esindajad teinud t\u00f6\u00f6gruppides.
  Pigem on k\u00fcsimus, kuidas on esindajaid m\u00e4\u00e4ratud. Sisuliselt peaks
  k\u00f5ik ENLi esindajad \u00fcmber valima ja uuesti m\u00e4\u00e4rama. Arutelukoht
  on, kes m\u00e4\u00e4rab - kas n\u00f5ukogu v\u00f5i komisjon. 3-4 kohta on, kus
  esindajaks on ametikoha j\u00e4rgselt meeskonna v\u00f5i juhatuse liige, \u00fclej\u00e4\u00e4nud
  kohad tuleb \u00fcmber valida (liikmeid enam kaasata).\\n\\nEttepanek: antud punkt
  lisada j\u00e4rgmise koosoleku p\u00e4evakorda.\\n\\nH\u00e4\u00e4letamise tulemus:
  4 poolt\\n\\nOtsus: punkt \\\"ENLi esindajad n\u00f5ukogudes, komisjonides, \u00fcmarlaudades\\\"
  lisada j\u00e4rgmise koosoleku p\u00e4evakorda\\n\\n7. N\u00f5ukogu t\u00f6\u00f6korraldus,
  edasine t\u00f6\u00f6plaan, koosolekute ajad 2012, suhtlus tegevmeeskonnaga\\n\\nMeeskond
  saadab uue kuu esimesel n\u00e4dalal \u00fchtse kirjaga enda m\u00f6\u00f6dunud
  kuu tegevuste kokkuv\u00f5tte ja uue kuu plaanid n\u00f5ukogule (tegemist on kuu
  tegevusaruandega), alates juunikuust maikuu kohta.\\n\\nN\u00f5ukogul on k\u00fcsimus,
  kuidas toimivad listid - avalike suhete spetsialist saadab n\u00f5ukogule \u00fclevaate
  k\u00f5igist ENLi listidest\\n\\nN\u00f5ukogu listi saavad kirjutada k\u00f5ik,
  kes soovivad (ei ole peal modereerimist), vastav info l\u00e4heb ka ENLi teadetesse.\\n\\n2
  t\u00f6\u00f6p\u00e4eva jooksul vastab meeskond n\u00f5ukogu infop\u00e4ringutele.\\n\\nN\u00f5ukogule
  eelarve - n\u00f5ukogu teeb ettepaneku enda eelarve osas (vaatavad \u00fcle, mis
  kulud v\u00f5ivad tulla).\\n\\nMeeskond v\u00f5ib otse suhelda n\u00f5ukoguga, selle
  liikmetega ja n\u00f5ukogu omakorda meeskonnaga.\\n\\nE. Loonurm: kui on v\u00e4ga
  kiire k\u00fcsimus, siis telefonik\u00f5ne v\u00f5i sms.\\n\\nH. J\u00e4rveveer:
  kui on vaja kiiret vastust (p\u00e4eva v\u00f5i poole jooksul), siis telefonik\u00f5ne
  v\u00f5i sms.\\n\\nG. Tarand: vastab 24 h jooksul ja v\u00f5ib koguaeg p\u00f6\u00f6rduda.\\n\\nL.
  Siniveer: p\u00e4rast 21.15 ei tohi helistada ja hommikul alates 7.00st, k\u00f5ige
  parem on sms.\\n\\nJ\u00e4rgmise n\u00f5ukogu koosoleku toimumise aeg ja koht lepitakse
  kokku meili teel.\\n\\nMeeskonna ja n\u00f5ukogu \u00fchine vabamas \u00f5hus koosolek
  toimub juuli alguses (t\u00e4pne p\u00e4ev ei ole veel kindel) ja kestab kogu p\u00e4eva.\\n\\n8.
  N\u00f5ukogu esimehe valimine\\n\\nK\u00f5ik n\u00f5ukogu liikmed v\u00f5ivad enda
  kandidatuuri t\u00f5statada.\\n\\nGerd Tarand t\u00f5statab enda kandidatuuri. Siivi
  Liivik t\u00f5statab enda kandidatuuri. M\u00f5lemad kandidaadid tutvustavad enda
  motivatsiooni, miks kandideeriti. Toimub avalik h\u00e4\u00e4letus\\n\\nSiivi Liivik
  osaleb telefoni teel.\\n\\nH\u00e4\u00e4letamise tulemus\\n\\n: Gerd Tarand - 4
  poolth\u00e4\u00e4lt, Siivi Liivik - 1 poolth\u00e4\u00e4l\\n\\nOtsus\\n\\n: ENLi
  n\u00f5ukogu esimees on Gerd Tarand\\n\\n9. Muud k\u00fcsimused\\n\\nOsaluskogude
  teemat puudutav punkt j\u00e4rgmisel n\u00f5ukogu koosolekul.\\n\\nENLi j\u00e4rgmise
  aasta teema on arutluse all j\u00e4rgmisel n\u00f5ukogu koosolekul.\\n\\nSandra
  Kamilova Koosoleku juhataja\\n\\nKaidi Nurmik Koosoleku protokollija\"", "\"KEHTESTATUD\\n\\nrektori
  05. mai 2020 k\u00e4skkirjaga nr 7\\n\\nMUUDETUD\\n\\nrektori 28. septembri 2020
  k\u00e4skkirjaga nr 26\\n\\nrektori 13. mai 2021 k\u00e4skkirjaga nr 15\\n\\nrektori
  16. detsembri 2021 k\u00e4skkirjaga nr 38 rektori 18. augusti 2022 k\u00e4skkirjaga
  nr 22 rektori 5. jaanuari 2023 k\u00e4skkirjaga nr 1 rektori 6. m\u00e4rtsi 2023
  k\u00e4skkirjaga nr 6\\n\\nTallinna \u00dclikooli t\u00f6\u00f6tasustamise eeskiri\\n\\n1.
  peat\u00fckk \u00dcLDS\u00c4TTED\\n\\n1. Eeskirja reguleerimis- ja kohaldamisala\\n\\nTallinna
  \u00dclikooli (edaspidi \u00fclikool) t\u00f6\u00f6tasustamise eeskiri (edaspidi
  eeskiri) m\u00e4\u00e4rab kindlaks \u00fclikoolis t\u00f6\u00f6lepingu alusel t\u00f6\u00f6tavate
  isikute (edaspidi t\u00f6\u00f6taja) t\u00f6\u00f6tasustamise p\u00f5him\u00f5tted
  ja korra.\\n\\n2. \u00dcldp\u00f5him\u00f5tted\\n\\n2.1. T\u00f6\u00f6tajate tasustamisel
  l\u00e4htutakse Eesti Vabariigi \u00f5igusaktidest, \u00fclikooli \u00f5igusaktidest
  ja k\u00e4esolevast eeskirjast ning ka rahastaja tingimustest, kui t\u00f6\u00f6tasu
  makstakse \u00fclikooli tegevustoetuse ja teaduse baasfinantseerimise v\u00e4liselt
  rahastatavatest projektidest.\\n2.2. T\u00f6\u00f6tasustamisel j\u00e4rgitakse t\u00f6\u00f6tajate
  v\u00f5rdse kohtlemise p\u00f5him\u00f5tet.\\n2.3. Eeskirja n\u00f5uetest v\u00f5ib
  rektor teha erandeid prorektori, valdkonnajuhi, akadeemilise \u00fcksuse v\u00f5i
  asutuse direktori p\u00f5hjendatud ettepaneku alusel, mis esitatakse rektorile personaliosakonna
  kaudu ja millele personaliosakond lisab oma arvamuse.\\n2.4. T\u00f6\u00f6tasustamise
  p\u00f5him\u00f5tete ja korra toimivust hindab ning teeb selle arendamiseks ettepanekuid
  palgakomisjon. Palgakomisjoni moodustab rektor \u00fclikooli t\u00f6\u00f6tajatest
  ja komisjoni t\u00f6\u00f6sse kaasatakse t\u00f6\u00f6tajate esindaja ameti\u00fchingust.
  Palgakomisjon koguneb v\u00e4hemalt \u00fcks kord aastas.\\n\\n2. peat\u00fckk\\n\\nT\u00d6\u00d6TASU
  JA SELLE KOOSTISOSAD\\n\\n3. T\u00f6\u00f6tasu m\u00f5iste\\n\\n3.1. T\u00f6\u00f6tasu
  koosneb p\u00f5hipalgast ja v\u00f5ib sisaldada muutuvpalka, mida makstakse t\u00f6\u00f6tajale
  tehtud t\u00f6\u00f6 eest vastavalt t\u00f6\u00f6lepingule, Eesti Vabariigi \u00f5igusaktidele
  ja k\u00e4esolevale eeskirjale.\\n3.2. P\u00f5hipalk on t\u00f6\u00f6taja t\u00f6\u00f6lepingus
  kuu- v\u00f5i tunnipalgana fikseeritud t\u00f6\u00f6tasu osa, mis on kokku lepitud
  t\u00f6\u00f6\u00fclesannete, t\u00f6\u00f6soorituse ja kokkulepitud t\u00f6\u00f6aja
  kestuse p\u00f5hjal, arvestades ka eesm\u00e4rki maksta ametikoha palgaturul konkurentsiv\u00f5imelist
  tasu.\\n3.3. Muutuvpalk on t\u00f6\u00f6taja t\u00f6\u00f6tasu ebaregulaarne osa,
  mida makstakse t\u00f6\u00f6taja p\u00f5hipalgale lisaks lisatasuna t\u00e4iendavate
  t\u00f6\u00f6\u00fclesannete t\u00e4itmise eest, tulemustasuna, preemiana v\u00f5i
  lisatasuna eritingimustes t\u00f6\u00f6tamise eest.\\n\\n4. Tasustamisotsuste tegemine\\n\\n4.1.
  T\u00f6\u00f6tasu lepitakse t\u00f6\u00f6tajaga kokku v\u00f5i m\u00e4\u00e4ratakse
  j\u00e4rgmiselt:\\n4.1.1. rektor, prorektor v\u00f5i valdkonnajuht lepib kokku v\u00f5i
  m\u00e4\u00e4rab talle vahetult alluvate t\u00f6\u00f6tajate t\u00f6\u00f6tasu koosk\u00f5lastatult
  finantsallika k\u00e4sutajaga;\\n4.1.2. akadeemilise \u00fcksuse v\u00f5i asutuse
  direktor lepib kokku v\u00f5i m\u00e4\u00e4rab oma \u00fcksuse t\u00f6\u00f6tajate
  t\u00f6\u00f6tasu koosk\u00f5lastatult finantsallika k\u00e4sutajaga;\\n4.1.3. tugi\u00fcksuse
  juht lepib kokku v\u00f5i m\u00e4\u00e4rab oma \u00fcksuse t\u00f6\u00f6tajate t\u00f6\u00f6tasu
  koosk\u00f5lastatult finantsallika k\u00e4sutaja ja enda vahetu juhiga.\\n4.2. Ettepaneku
  t\u00f6\u00f6taja t\u00f6\u00f6tasu kohta v\u00f5ib punktides 4.1.1-4.1.3 nimetatud
  juhile teha t\u00f6\u00f6taja vahetu juht. Kui t\u00f6\u00f6tasu makstakse \u00fclikooli
  tegevustoetuse ja teaduse baasfinantseerimise v\u00e4liselt rahastatavast projektist,
  teeb ettepaneku t\u00f6\u00f6taja t\u00f6\u00f6tasu suuruse kohta projekti vastutav
  t\u00e4itja, leppides t\u00f6\u00f6taja osalemise projektis eelnevalt kokku t\u00f6\u00f6taja
  vahetu juhiga.\\n4.3. Tasustamisotsuste tegemisel l\u00e4htutakse t\u00f6\u00f6tasufondi
  otstarbeka ja sihip\u00e4rase kasutamise p\u00f5him\u00f5ttest.\\n\\n5. Palgaastmestik\\n\\n5.1.
  \u00dclikooli ametikohad on liigitatud vastavalt eeskirja lisale 1 palgaastmestikku
  ametikohtade liikide kaupa, l\u00e4htudes \u00fclikooli struktuurist, ametikoha
  t\u00f6\u00f6\u00fclesannete keerukusest, ametikoha t\u00e4itja vastutusest ja koost\u00f6\u00f6
  ulatusest ning ametikoha t\u00e4itjale esitatavatest n\u00f5uetest.\\n5.2. Palgaastmestikus
  vastab igale ametikoha liigile \u00fcks palgaaste. Igale palgaastmele vastab kuu
  p\u00f5hipalga alamm\u00e4\u00e4r (t\u00e4ist\u00f6\u00f6ajaga t\u00f6\u00f6tamise
  korral) ja tunni p\u00f5hipalga alamm\u00e4\u00e4r vastavalt eeskirja lisale 2.\\n5.3.
  Akadeemilise t\u00f6\u00f6taja ametikoha palgaaste m\u00e4\u00e4ratakse ametikoha
  nimetuse alusel. Teiste ametikohtade liik, ametinimetus ja palgaaste m\u00e4\u00e4ratakse
  t\u00f6\u00f6\u00fclesannete p\u00f5hjal, l\u00e4htudes t\u00f6\u00f6 eesm\u00e4rgist
  ja sisust, t\u00f6\u00f6ga kaasnevast vastutusest ja koost\u00f6\u00f6 ulatusest
  ning ametikoha t\u00e4itjale esitatavatest n\u00f5uetest.\\n5.4. Palgaastmestiku
  p\u00f5hipalga alamm\u00e4\u00e4rade muutmise p\u00f5hjendatust ja v\u00f5imalusi
  hindab palgakomisjon \u00fcldjuhul \u00fcks kord aastas.\\n\\n6. P\u00f5hipalk\\n\\n6.1.
  T\u00f6\u00f6taja p\u00f5hipalga kokkuleppimisel l\u00e4htub punktides 4.1.1-4.1.3
  nimetatud juht eeskirja lisast 1 ja selle alusel leitud t\u00f6\u00f6taja ametikoha
  liigist ja palgaastmest ning eeskirja lisast 2 ja selle alusel leitud palgaastmele
  vastavast p\u00f5hipalga alamm\u00e4\u00e4rast. Lisaks arvestatakse t\u00f6\u00f6\u00fclesandeid
  ja t\u00f6\u00f6sooritust, kokkulepitud t\u00f6\u00f6aja kestust ning eesm\u00e4rki
  maksta ametikoha palgaturul konkurentsiv\u00f5imelist tasu.\\n6.2. T\u00f6\u00f6tajaga
  kokkulepitava p\u00f5hipalga suurus peab olema v\u00e4hemalt v\u00f5rdne ametikoha
  palgaastmele vastava p\u00f5hipalga alamm\u00e4\u00e4raga t\u00e4ist\u00f6\u00f6ajaga
  t\u00f6\u00f6tamise korral v\u00f5i t\u00f6\u00f6tamisel osalise t\u00f6\u00f6ajaga
  proportsionaalselt v\u00e4iksem.\\n6.3. [kehtetu 28.09.2020, j\u00f5ustumine 29.09.2020]\\n6.4.
  Kui t\u00f6\u00f6taja j\u00e4tkab vastavalt Tallinna \u00dclikooli t\u00f6\u00f6suhete
  eeskirjale t\u00f6\u00f6tamist korralisel akadeemilisel ametikohal, kus ta t\u00f6\u00f6tas
  enne rektori, prorektori v\u00f5i akadeemilise \u00fcksuse juhina t\u00f6\u00f6leasumist,
  lisatakse t\u00f6\u00f6taja akadeemilisest \u00fcksusest makstavale p\u00f5hipalgale
  summa, mille suurus t\u00f6\u00f6taja v\u00e4hemalt 2-aastase juhistaa\u017ei korral
  on 10%, v\u00e4hemalt 3-aastase juhistaa\u017ei korral 20%, v\u00e4hemalt 4-aastase
  juhistaa\u017ei korral 30%, v\u00e4hemalt 5-aastase juhistaa\u017ei korral 40% ning
  alates 6-aastasest juhistaa\u017eist lisandub iga t\u00e4isaasta eest t\u00e4iendav
  2%, kuid summaarselt mitte rohkem kui 50% t\u00f6\u00f6taja varasemast p\u00f5hipalgast
  juhi ametikohal. T\u00e4iendavat p\u00f5hipalgaosa finantseeritakse \u00fcksuste
  eelarvetest eraldiseisvalt ja makstakse t\u00f6\u00f6tajale alates erialase eneset\u00e4iendamise
  aja l\u00f5ppemisest kuni viie aasta t\u00e4itumiseni ajast, mil ta j\u00e4tkas
  t\u00f6\u00f6tamist akadeemilisel ametikohal.\\n6.5. P\u00f5hipalk fikseeritakse
  t\u00f6\u00f6taja t\u00f6\u00f6lepingus.\\n6.6. P\u00f5hipalga alamm\u00e4\u00e4rade
  muutmisel hindab eeskirja punktides 4.1.1-4.1.3 nimetatud juht k\u00f5igi \u00fcksuse
  t\u00f6\u00f6tajate p\u00f5hipalkade eeskirjale vastavust ning otsustab vajadusel
  t\u00f6\u00f6taja p\u00f5hipalga muutmise eelarve v\u00f5imalustest l\u00e4htudes,
  arvestades punkti 6.2.\\n\\n7. T\u00e4iendavate t\u00f6\u00f6\u00fclesannete lisatasu\\n\\n7.1.
  T\u00e4iendavate t\u00f6\u00f6\u00fclesannete lisatasu v\u00f5ib maksta t\u00f6\u00f6tajale
  juhul, kui t\u00f6\u00f6taja t\u00e4idab t\u00f6\u00f6lepingus kokku lepitud \u00fclesannetega
  v\u00f5rreldes t\u00e4iendavaid \u00fclesandeid v\u00f5i t\u00f6\u00f6taja t\u00e4idab
  t\u00f6\u00f6lepingus kokku lepitud \u00fclesandeid kokku lepitust suuremas mahus.\\n7.2.
  T\u00e4iendavate t\u00f6\u00f6\u00fclesannete lisatasu suuruse m\u00e4\u00e4ramisel
  on aluseks t\u00f6\u00f6\u00fclesannete eesm\u00e4rk, sisu, \u00fclesannete t\u00e4itmiseks
  vajalikud eeldused ja t\u00f6\u00f6ga kaasnev vastutus.\\n7.3. T\u00e4iendavate
  t\u00f6\u00f6\u00fclesannete t\u00e4itmine ja selle eest lisatasu maksmine lepitakse
  t\u00f6\u00f6tajaga kokku enne t\u00f6\u00f6 alustamist. Kui t\u00f6\u00f6\u00fclesannete
  t\u00e4itmine toimub teises \u00fcksuses, tuleb see teise \u00fcksuse juhil eelnevalt
  kokku leppida ka t\u00f6\u00f6taja vahetu juhiga.\\n7.4. T\u00e4iendavate t\u00f6\u00f6\u00fclesannete
  t\u00e4itmise kohta vormistatakse enne t\u00f6\u00f6 alustamist kokkulepe t\u00f6\u00f6lepingus,
  n\u00e4idates \u00e4ra \u00fclesannete sisu, t\u00e4itmise perioodi, lisatasu suuruse
  ja maksmise tingimused. Erandina v\u00f5ib lisatasu maksta \u00fchekordse maksena
  \u00fchekordse lisatasu korralduse alusel, kui t\u00f6\u00f6\u00fclesandeid t\u00e4idetakse
  kuni viis kuud k.a. Korraldus vormistatakse, koosk\u00f5lastatakse ja kinnitatakse
  elektrooniliselt dokumendihalduss\u00fcsteemis ning selles m\u00e4rgitakse \u00fclesannete
  sisu, t\u00e4itmise periood, lisatasu suurus ja maksmise tingimused.\\n7.5. Kui
  t\u00e4iendavaid t\u00f6\u00f6\u00fclesandeid t\u00e4idetakse kauem kui viis kuud,
  on otstarbekusest l\u00e4htudes soovitav lisatasu maksmise asemel leppida t\u00e4iendavate
  t\u00f6\u00f6\u00fclesannete t\u00e4itmine kokku p\u00f5hit\u00f6\u00f6na ning muuta
  vastavalt t\u00e4htajaliselt t\u00f6\u00f6taja p\u00f5hipalka.\\n\\n8. Tulemustasu\\n\\n8.1.
  Tulemustasu v\u00f5ib maksta eelnevalt kindlaks m\u00e4\u00e4ratud kriteeriumite
  alusel konkreetse t\u00f6\u00f6 v\u00f5i perioodi tulemuste eest.\\n8.2. Tulemusliku
  teadus- ja arendustegevuse v\u00f5i loometegevuse ning teadust\u00f6\u00f6tajate
  tulemusliku \u00f5ppet\u00f6\u00f6 eest tulemustasu m\u00e4\u00e4ramiseks v\u00f5ib
  rektor kehtestada \u00fcldised p\u00f5him\u00f5tted, millest l\u00e4htuvalt kehtestab
  direktor akadeemilises \u00fcksuses tulemustasu m\u00e4\u00e4ramise t\u00e4psemad
  kriteeriumid ja maksmise korra, koosk\u00f5lastades selle eelnevalt teadusvaldkonna
  prorektoriga. [muudetud 16.12.2021, j\u00f5ustumine 17.12.2021]\\n8.3. Juhendamise
  tulemustasu makstakse t\u00f6\u00f6tajale, kelle juhendamisel on kaitstud doktorit\u00f6\u00f6.
  Rektor kehtestab juhendamise tulemustasu maksmise t\u00e4psemad kriteeriumid ja
  maksmise korra tema poolt m\u00e4\u00e4ratud teadusvaldkonna prorektori ettepanekul,
  mis on koosk\u00f5lastatud personaliosakonnaga.\\n8.4. Muudel juhtudel makstakse
  tulemustasu seoses t\u00f6\u00f6ga, mille eesm\u00e4rk on tasuliste teenuste pakkumine
  v\u00f5i sellele kaasaaitamine, et tuua \u00fclikooli eelarvesse tegevustoetuse
  ja teaduse baasfinantseerimise v\u00e4liseid vahendeid, ning selle t\u00f6\u00f6
  tulemus on m\u00f5\u00f5detav, sh rahaliselt. Tulemustasu maksmise t\u00e4psemad
  kriteeriumid ja maksmise korra kehtestab rektor \u00fcksuse juhi ettepanekul, mis
  on koosk\u00f5lastatud vahetu juhi ja personaliosakonnaga. [muudetud 13.05.2021,
  j\u00f5ustumine 14.05.2021]\\n\\n9. Preemia\\n\\nPreemiat v\u00f5ib maksta t\u00f6\u00f6tajale
  silmapaistvate t\u00f6\u00f6alaste saavutuste eest, muuhulgas seoses \u00fclikoolipoolse
  v\u00f5i \u00fclikooliv\u00e4lise tunnustuse saamisega. T\u00f6\u00f6taja t\u00f6\u00f6alaseid
  saavutusi hinnatakse muuhulgas arenguvestlusel. Preemia suurus v\u00f5ib olla kalendriaastas
  kokku kuni 20% t\u00f6\u00f6taja aastasest ametikoha p\u00f5hipalgast.\\n\\n10.
  Eritingimustes t\u00f6\u00f6tamise lisatasu\\n\\nEritingimustes t\u00f6\u00f6tamise
  lisatasu makstakse t\u00f6\u00f6tajale \u00fcletunnit\u00f6\u00f6, riigip\u00fchal
  ja \u00f6\u00f6ajal t\u00f6\u00f6tamise eest seadusest tuleneval alusel ja m\u00e4\u00e4ras,
  kui eritingimustes t\u00f6\u00f6tamist ei h\u00fcvitata vaba ajaga. \u00d6\u00f6ajal
  t\u00f6\u00f6tamise tasu v\u00f5ib sisalduda p\u00f5hipalgas, kui pooled on selles
  t\u00f6\u00f6lepingus kokku leppinud. Sellisel juhul \u00f6\u00f6ajal t\u00f6\u00f6tamist
  t\u00e4iendavalt ei h\u00fcvitata.\\n\\n3. peat\u00fckk\\n\\nT\u00d6\u00d6TASU MAKSMISE
  KORD JA TASUSTAMISE T\u00d6\u00d6KORRALDUS\\n\\n11. T\u00f6\u00f6tasu maksmine\\n\\n11.1.
  T\u00f6\u00f6tasu arvestusperiood on kalendrikuu. T\u00f6\u00f6tasu arvestatakse
  ajavahemiku eest, mil t\u00f6\u00f6taja t\u00e4itis t\u00f6\u00f6\u00fclesandeid.
  T\u00f6\u00f6tasu arvestamise aluseks on t\u00f6\u00f6ajaarvestus, mida peetakse
  t\u00f6\u00f6taja \u00fcksuses t\u00f6\u00f6ajatabelina, mille t\u00e4itmise korraldab
  ja mille kinnitab igakuiselt t\u00f6\u00f6taja \u00fcksuse juht. T\u00f6\u00f6tasu
  arvestamisel \u00fclikooli tegevustoetuse ja teaduse baasfinantseerimise v\u00e4liselt
  rahastatavast projektist on arvestamise aluseks ka t\u00f6\u00f6ajatabel, mida t\u00e4idetakse
  vastavalt rahastaja n\u00f5uetele ja mille kinnitab igakuiselt projekti vastutav
  t\u00e4itja.\\n11.2. T\u00f6\u00f6tasu makstakse \u00fcks kord kuus hiljemalt jooksva
  arvelduskuu viimasel t\u00f6\u00f6p\u00e4eval t\u00f6\u00f6taja m\u00e4\u00e4ratud
  pangakontole.\\n11.3. T\u00f6\u00f6tajal on v\u00f5imalik iseteenindusportaalis
  tutvuda andmetega talle arvestatud t\u00f6\u00f6tasu ja muude v\u00e4ljamaksete
  ning kinnipeetud summade kohta. [muudetud 06.03.2023, j\u00f5ustumine 07.03.2023]\\n\\n11
  1 . T\u00f6\u00f6andja makstavad ja kinnipeetavad maksud ja maksed\\n\\n11 1 .1.
  T\u00f6\u00f6andja maksab t\u00f6\u00f6taja t\u00f6\u00f6tasult sotsiaal- ja t\u00f6\u00f6tuskindlustusmakse
  ning t\u00f6\u00f6taja t\u00f6\u00f6tasust peetakse kinni \u00fcksikisiku tulumaks,
  t\u00f6\u00f6tuskindlustusmakse ning kohustusliku kogumispensioni makse vastavalt
  Eesti Vabariigis kehtivale maksum\u00e4\u00e4rale juhul, kui t\u00f6\u00f6taja on
  kohustusliku kogumispensioniga liitunud. T\u00f6\u00f6andja poolt kinnipeetavate
  ning t\u00f6\u00f6taja eest makstavate maksude ja maksete suurus ning liik v\u00f5ivad
  muutuda sellekohaste \u00f5igusaktide muutumisel.\\n11 1 .2. T\u00f6\u00f6andja
  tasub maksud ja maksed Maksu- ja Tolliametile. Tulumaksust finantseeritakse riigi
  ja kohaliku omavalitsuse \u00fcksuse valitsemistegevust. T\u00f6\u00f6tuskindlustusmaksest
  rahastatakse t\u00f6\u00f6tuskindlustust, mis kindlustab teatud tingimustel t\u00f6\u00f6tajale
  kaitse (h\u00fcvitised, toetused ja teenused) t\u00f6\u00f6tuks j\u00e4\u00e4mise
  korral. Kohustuslikust kogumispensioni maksest rahastatakse II samba pensioni. Sotsiaalmaksust
  rahastatakse ravikindlustust ning I ja II samba pensioni.\\n\\n[muudetud 18.08.2022,
  j\u00f5ustumine 01.08.2022]\\n\\n12. T\u00f6\u00f6tasust kinnipidamine\\n\\n12.1.
  [kehtetu 18.08.2022, j\u00f5ustumine 01.08.2022]\\n12.2. T\u00f6\u00f6taja t\u00f6\u00f6tasust
  v\u00f5ib ilma t\u00f6\u00f6taja n\u00f5usolekuta kinni pidada ettemakse, mille
  t\u00f6\u00f6taja peab \u00fclikoolile tagastama, t\u00f6\u00f6lepingu l\u00f5ppemisel
  tasu v\u00e4ljat\u00f6\u00f6tamata p\u00f5hipuhkuse eest ja t\u00f6\u00f6andjale
  kohtut\u00e4ituri esitatud arestimisaktist tuleneva n\u00f5ude.\\n12.3. T\u00f6\u00f6taja
  t\u00f6\u00f6tasust v\u00f5ib t\u00f6\u00f6taja kirjalikku taasesitamist v\u00f5imaldavas
  vormis antud n\u00f5usolekul kinni pidada t\u00f6\u00f6taja poolt \u00fclikooli
  arvel tehtavate kulude kokkulepitud limiiti \u00fcletava summa ja t\u00f6\u00f6taja
  poolt \u00fclikoolile tekitatud kahju h\u00fcvitamise summa.\\n12.4. Muid summasid
  v\u00f5ib t\u00f6\u00f6taja t\u00f6\u00f6tasust kinni pidada vastavalt Eesti Vabariigi
  \u00f5igusaktidele.\\n\\n13. T\u00f6\u00f6korraldus tasustamisel\\n\\n13.1. T\u00f6\u00f6taja
  vahetu juht, \u00fcksuse juht ning projekti vastutav t\u00e4itja annavad t\u00f6\u00f6taja
  soovil selgitusi t\u00f6\u00f6taja t\u00f6\u00f6tasustamise tingimuste kohta.\\n13.2.
  Personaliosakond arendab t\u00f6\u00f6tasustamise valdkonda, n\u00f5ustab tasustamisotsuste
  tegemisel, kontrollib t\u00f6\u00f6tasustamise vastavust Eesti Vabariigi \u00f5igusaktidele
  ja eeskirjale ning annab t\u00f6\u00f6taja soovil informatsiooni t\u00f6\u00f6taja
  t\u00f6\u00f6lepingus kindlaks m\u00e4\u00e4ratud t\u00f6\u00f6tasustamise tingimuste
  kohta.\\n13.3. Rahandusosakond arvestab ja maksab t\u00f6\u00f6tasu ning annab t\u00f6\u00f6taja
  soovil informatsiooni ning andmeid t\u00f6\u00f6tajale arvutatud ja makstud v\u00f5i
  maksmisele kuuluva t\u00f6\u00f6tasu kohta, samuti t\u00f6\u00f6tasust kinnipeetud
  summade kohta.\\n\\n[muudetud 06.03.2023, j\u00f5ustumine 07.03.2023]\\n\\n14. T\u00f6\u00f6tasu
  konfidentsiaalsus\\n\\nT\u00f6\u00f6tasu on konfidentsiaalne. \u00dclikool ja t\u00f6\u00f6tasuandmetega
  t\u00f6\u00f6\u00fclesannete t\u00e4itmisel kokku puutuvad t\u00f6\u00f6tajad kohustuvad
  mitte avaldama t\u00f6\u00f6taja n\u00f5usolekuta v\u00f5i seadusest tuleneva aluseta
  andmeid t\u00f6\u00f6tajale arvutatud, makstud v\u00f5i maksmisele kuuluva t\u00f6\u00f6tasu
  kohta.\\n\\nAMETIKOHA LIIK, NIMETUS JA PALGAASTE\\n\\n| Ametikoha liik ja/v\u00f5i
