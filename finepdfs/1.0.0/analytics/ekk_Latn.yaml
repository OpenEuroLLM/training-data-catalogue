  taastamisel peab j\u00e4rgima Viimsi valla kaevet\u00f6\u00f6de eeskirja ja taastamised
  peavad vastama majandus- ja taristuministri m\u00e4\u00e4rusele 03.08.2015 nr 101
  \u201eTee ehitamise kvaliteedi n\u00f5uded\\\".\\n12.4. Ehituse k\u00e4igus kasutatavate
  maa-alade, juurdep\u00e4\u00e4su teede ja -teeosade kahjustamisel, tuleb taastada
  nende ehituseelne seisund ja teedel teekonstruktsioon, teekatend ja teekattem\u00e4rgistus.\\n12.5.
  T\u00f6\u00f6de k\u00e4igus eemaldatud ja kahjustatud haljastuse puhul tuleb rajada
  uus haljastus l\u00e4htudes Viimsi Vallavolikogu m\u00e4\u00e4rusest 16.03.2021
  nr 10 \u201eViimsi valla kaevet\u00f6\u00f6de eeskiri\\\".\\n12.6. Ehitust\u00f6\u00f6de
  l\u00e4biviimisel projekteerimistingimustes esitatud teedel ja nendega piirnevatel
  kinnistutel, nende teede vahetus l\u00e4heduses ja juurdep\u00e4\u00e4suteede kasutamise
  korral ning vajadusel sulgeda teid osaliselt v\u00f5i ka l\u00fchiajaliselt t\u00e4ielikult,
  tuleb koostada selleks ajutine liikluskorralduste skeem vastavalt majandus- ja taristuministri
  m\u00e4\u00e4rusele 13.07.2018 nr 43 \u201eN\u00f5uded ajutisele liikluskorraldusele\\\".\\n12.7.
  Teede osalisel v\u00f5i t\u00e4ielikul sulgemisel l\u00e4htuda Viimsi Vallavolikogu
  m\u00e4\u00e4rusest 27.01.2015 nr 1 \u201eViimsi valla teede ajutise sulgemise eeskiri\\\".
  Teede osalise v\u00f5i t\u00e4ieliku sulgemise ajaks on Viimsi Vallavalitsuse ehitus-
  ja kommunaalosakonna poolt v\u00e4ljastatavale kaeveloale ning ehitaja poolt esitatud
  tee sulgemise avaldusele m\u00e4rgitud ehitust\u00f6\u00f6de teostamise periood
  tee osaliseks v\u00f5i t\u00e4ielikuks sulgemiseks.\\n12.8. Teede osalise v\u00f5i
  t\u00e4ieliku sulgemise ajaks liikluskorralduse skeemi kohaselt tuleb ehitajal tasuda
  tee sulgemise maks vastavalt Viimsi Vallavolikogu m\u00e4\u00e4rusele 27.01.2015
  nr 2 \u201eViimsi valla teede ja t\u00e4navate sulgemise maks\\\".\\n12.9. Projekteeritavatele
  ja ehitatavatele sademevee torustikule, mis hakkavad paiknema olenevalt projekteerimise
  k\u00e4igus konkreetsest trassi valikust, riigi- ja era kinnistutel, tuleb s\u00f5lmida
  kui nende rajatiste tulevasel omanikul, riigi- ja era kinnistute omanikega notariaalsed
  servituudi lepingud maade isikliku kasutus\u00f5igusega koormamiseks kasuks.\\n12.10.
  Viis p\u00e4eva enne ehitust\u00f6\u00f6de alustamist esitada ehitajal valla ehitus-
  ja kommunaalosakonnale avaldus kaevet\u00f6\u00f6de teostamiseks infos\u00fcsteemis
  OPIS (viimsi.opis.ee), mille alusel v\u00e4ljastatakse kaeveluba.\\n\\n13.  Projekteerimistingimuste
  kehtivusaeg ja vaidlustamine:\\n\\n13.1. Projekteerimistingimused on ehitusprojekti
  kohustuslik osa ja kehtivad viis aastat.\\n\\nTulenevalt eelpool toodust ja PlanS
  \u00a7 125 l\u00f5igest 5, EhS \u00a7 26 l\u00f5ikest 4, EhS \u00a7 27 lg 1 p 1,
