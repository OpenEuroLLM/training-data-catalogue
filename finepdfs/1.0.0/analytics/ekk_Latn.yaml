  1 / 1\"", "\"/K\u00f6\u00f6gitarvikud\\n\\n/Tootja: hetkel puudub /M\u00f5\u00f5dud:
  31 x 10 x 5 cm /Materjalid: karastatud nailon\\n\\n/2011\\n\\nIdee nende k\u00f6\u00f6gitarvikute
  jaoks tuli vaatlusest, et paljudel on komme j\u00e4tta spaatel, lusikas v\u00f5i
  kulp panni v\u00f5i poti servale v\u00f5i sisse, kus need v\u00f5ivad hakkata sulama.
  See komme on tingitud sellest, et paljud ei taha panna neid t\u00f6\u00f6pinnale
  mitmel p\u00f5hjusel; \u00fcheks neist on see, et mustus v\u00f5ib kandudak\u00f6\u00f6gitarvikule
  ja teiseks, et ei taheta t\u00f6\u00f6pinda v\u00e4ga mustaks ja rasvaseks teha.
  See ajendas mind \u00fcmbert\u00f6\u00f6tama ja-m\u00f5tlema k\u00f6\u00f6gitarvikuid,
  ja keskenduma k\u00e4epideme ja lusika/kulbi osa balanseerimisele ning \u00fcmberkujundama
  k\u00e4epidet nii, et see hoiaks selle osa tarvikust, mis on kaetud toiduga t\u00f6\u00f6pinnast
  k\u00f5rgemal toetudes ainult k\u00e4epidemele.\\n\\nThese cooking utensils came
  into being from observation that many people leave their spatulas and ladles on
  the edge of pots and pans where they can start to melt, and that because people
  did not want to put them down on the work surface for two reasons, one because of
  hygiene and also because they did not want to make the counter dirty. I started
  to redesign utensils, and looking into balancing and trying to redesign the handle
  so the bit that touches the food is raised from the work surface, which allows and
  guides people to put their utensils on the work surface without any extra trays.\"",
