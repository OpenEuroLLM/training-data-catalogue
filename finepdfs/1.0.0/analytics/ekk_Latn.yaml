  1 ja 3 kohaselt III kaitsekategooriasse kuuluvate liikide karvase maarjalepa (Agrimoniapilosa)
  ja emaputke (Angelica palustris) v\u00e4ljaspool kaitsealasid asuvad elupaigad,
  mida tuleb kaitsta nende liikide soodsa seisundi tagamiseks.\\n\\n\u00a7 2. Karvase
  maarjalepa ja emaputke p\u00fcsielupaikade kaitse alla v\u00f5tmine\\n\\n(1) Kaitse
  alla v\u00f5etakse j\u00e4rgmised karvase maarjalepa p\u00fcsielupaigad:\\n2) Saunametsa
  P\u00e4rnu maakonnas Surju vallas Saunametsa k\u00fclas.\\n1) \u00c4nniksaare Ida-Viru
  maakonnas Avinurme vallas \u00c4nniksaare k\u00fclas;\\n(2) Kaitse alla v\u00f5etakse
  j\u00e4rgmised emaputke p\u00fcsielupaigad:\\n2) Kastna P\u00e4rnu maakonnas T\u00f5stamaa
  vallas Kastna k\u00fclas.\\n1) Lao P\u00e4rnu maakonnas T\u00f5stamaa vallas Lao
  k\u00fclas;\\n(3) P\u00fcsielupaikade piirid on kantud kaartidele, mis on esitatud
  m\u00e4\u00e4ruse lisas 2 .\\n\\n\u00a7 3. P\u00fcsielupaiga valitseja\\n\\n\u00abLooduskaitseseaduse\u00bb
  \u00a7 21 l\u00f5ike 1 kohaselt on p\u00fcsielupaiga valitsejaks Keskkonnaamet.\\n\\n[RTL
  2009, 11, 131- j\u00f5ust. 01.02.2009]\\n\\n\u00a7 4. Kaitsekord\\n\\n(1) Karvase
  maarjalepa ja emaputke p\u00fcsielupaikade maa-ala kuulub piiranguv\u00f6\u00f6ndisse.\\n(2)
  P\u00fcsielupaigas kehtib \u00abLooduskaitseseaduses\u00bb s\u00e4testatud kaitsekord
  selle m\u00e4\u00e4ruse erisustega.\\n(3) P\u00fcsielupaigas on lubatud:\\n2) telkimine,
  l\u00f5kke tegemine ja rahva\u00fcrituse korraldamine p\u00fcsielupaigas on lubatud
  vaid selleks ettevalmistatud ja p\u00fcsielupaiga valitseja poolt t\u00e4histatud
  kohtades.\\n1) jahipidamine ja kalap\u00fc\u00fck;\\n(4) P\u00fcsielupaiga valitseja
  n\u00f5usolekul on Saunametsa ja \u00c4nniksaare p\u00fcsielupaigas lubatud:\\n2)
  ehitiste, kaasa arvatud ajutiste ehitiste p\u00fcstitamine.\\n1) maavara kaevandamine
  ning uute maaparanduss\u00fcsteemide rajamine;\\n\\n(5) Lao ja Kastna p\u00fcsielupaikades
  on v\u00e4ljaspool ehituskeeluv\u00f6\u00f6ndit p\u00fcsielupaiga kaitse eesm\u00e4rgi
