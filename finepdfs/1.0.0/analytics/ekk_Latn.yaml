  teabematerjal. LABRIS on valmis neid loenguid l\u00e4bi viima. Kala-, liha- ja taimse
  materjalide t\u00f6\u00f6tlemisel on omad l\u00e4henemised ja tuleks v\u00f5tta
  v\u00e4ga spetsiifilise grupi inimesi ja r\u00e4\u00e4kima juhtumip\u00f5hiselt.\\n-
  \u201eToiduohutuse ABC k\u00e4siraamat alustavatele toiduk\u00e4itlejatele\\\" v\u00f5iks
  tulevikus kasvada ekoolitusmooduliks (tasuline). Esimese etapina oleks vaja see
  materjal kokku kirjutada, samas neli valdkonda varasemalt tehtud (piimak\u00e4itlejad,
  lihak\u00e4itlejad, pagarit\u00f6\u00f6stus, puuja k\u00f6\u00f6giviljad) veebip\u00f5hisena
  EPKK toel 2018. aastal. Kontseptsioon on juba olemas, enesekontrolli osad on valdkonniti
  \u00fchesugused. Pigem vaadata \u00fcle, mida annab nendest materjalidest \u00fcle
  v\u00f5tta ja kas olemasolevaid materjale on vaja uuendada. Teabesalves tuleks paremini
  v\u00e4lja tuua juba olemasolevad teabematerjalid. V\u00f5imalust seda infot saada
  on palju. \u00dcle 20% toiduk\u00e4itlejatest j\u00e4tavad endast teavitamata \u2013
  kas see materjalide koostamine lahendab selle probleemi? K\u00f5ik kes tegelevad
  toiduk\u00e4itlemisega, peaksid esmalt l\u00e4bima koolituse. Tellimusse j\u00e4tta
  olemasolevate materjalide t\u00e4iendamine, eraldi toiduohutuse ABC k\u00e4siraamatut
  ei ole vaja.\\n- \u201eN\u00f5uded alkoholi v\u00e4ikek\u00e4itlejatele\\\" on aastaid
