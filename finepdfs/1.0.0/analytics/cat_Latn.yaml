  i personalitzats  per els nostres clients i familiars directes\"", "\"CIRCUIT NACIONAL
  DE 5a CATEGORIA 2024\\n\\nLa Competici\u00f3 es jugar\u00e0 d''acord amb:\\n\\n1
  Les Regles de Golf vigents\\n2 Regles Locals de la FCGolf\\n3 Termes de la Competici\u00f3
  de la Prova espec\u00edfica\\n4 Regles Locals de la Prova\\n\\nTERMES DE LA COMPETICI\u00d3
  DE LA FASE DE CLUBS\\n\\n1 PARTICIPANTS\\n\\nJugadors/es amateurs amb llic\u00e8ncia
  de la RFEG o de la Federaci\u00f3 de Golf d''Andorra (FGA) en vigor, i sense perjudici
  del que estableix la disposici\u00f3 addicional segona dona la Llei 19/2007, d''11
  de juliol.\\n\\n5a Categoria: h\u00e0ndicap de 26,5 a 36,0\\n\\nSi es produeixen
  baixades de h\u00e0ndicap que ocasionen un canvi de categoria de h\u00e0ndicap d''un
  jugador, aquest jugador podr\u00e0 seguir jugant aquest circuit amb el seu nou h\u00e0ndicap.\\n\\nEl
  nombre m\u00e0xim d''inscrits ser\u00e0 de 90 jugadors (60 homes i 30 dones).\\n\\nEn
  el cas que un dels grups (mascul\u00ed o femen\u00ed) no es completi, es podran
  afegir els jugadors excedents a l''altre.\\n\\n2 INSCRIPCIONS\\n\\nLes inscripcions
  per la Fase de Clubs es realitzaran directament al club amfitri\u00f3.\\n\\n* Import
  d''inscripci\u00f3: 20 \u20ac/jugador\\n\\nLes inscripcions per l''\u00faltima prova
  del circuit, la Copa Catalunya 5a categoria es realitzaran a trav\u00e9s de la web
  de la FCGolf, mitjan\u00e7ant inscripci\u00f3 online.\\n\\n* Import d''inscripci\u00f3:
  36\u20ac adults / 25\u20ac menors\\n\\n3 FORMAT\\n\\nLLOC I DATES\\n\\nLa Fase de
  Clubs i la Copa Catalunya 5a Categoria es jugar\u00e0 en els seg\u00fcents camps
  i dates:\\n\\n|  | PROVES DE LA FASE DE CLUBS DEL CIRCUITO NACIONAL DE 5\u00aa CATEGORIA
