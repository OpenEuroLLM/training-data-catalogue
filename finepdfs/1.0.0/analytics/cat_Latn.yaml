  "\"Un any m\u00e9s el nostre municipi celebra com cal la nostra diada nacional,
  perqu\u00e8 Caldes \u00e9s part del pa\u00eds i el Consistori se sent majorit\u00e0riament
  comprom\u00e8s amb el record del seu passat, amb la construcci\u00f3 del seu present,
  amb la millora del seu futur i amb l''anhel majoritari de m\u00e9s llibertat i de
  m\u00e9s benestar.\\n\\nEl dia en que rememorem el nostre passat i reivindiquem
  horitzons de futur, cadasc\u00fa des de les seves pr\u00f2pies conviccions, tamb\u00e9
  \u00e9s una bona ocasi\u00f3 per fer una reflexi\u00f3 sobre l''estat del pa\u00eds.
  Doncs b\u00e9; el pa\u00eds passa per moments dif\u00edcils, des de molts punts
  de vista. I \u00e9s davant de les dificultats quan col\u00b7lectivament millor hem
  de respondre. No \u00e9s arronsant-nos que ens en sortirem. \u00c9s traient el millor
  de nosaltres, com a persones per\u00f2 tamb\u00e9 com a pa\u00eds \u2013com tantes
  vegades hem fet en el passat, com ho varem fer el 12 de setembre de 1714 o durant
  la renaixen\u00e7a- que podrem tornar a mirar el futur amb confian\u00e7a. El pa\u00eds
  trontolla per\u00f2 som prou forts, encara, com per mantenir l''esperan\u00e7a en
  un futur econ\u00f2mic, social i nacional millor.\\n\\nMoments dif\u00edcils des
  d''un punt de vista econ\u00f2mic. Quan ja portem tres anys de crisis, quan moltes
  fam\u00edlies i empreses han hagut de notar i de patir el seus efectes nefastos,
  queda clar que aquesta situaci\u00f3 no \u00e9s passatgera i que caldran m\u00e9s
  esfor\u00e7os i sacrificis per iniciar amb empenta el cam\u00ed de la recuperaci\u00f3.
  La crisi \u00e9s un repte per al manteniment dels nivells de benestar assolits els
  darrers anys. I \u00e9s un repte tamb\u00e9 per a la cohesi\u00f3 social. No podem
  fer cas de les proclames m\u00e9s incendi\u00e0ries, que descarreguen la culpa de
  tot en determinats col\u00b7lectius. Portem molts anys aglutinat la societat; no
  fem cas als qui, per inter\u00e8s personal, la voldrien desmembrada.\\n\\nMoments
  dif\u00edcils, tamb\u00e9, des del punt de vista nacional. Tot l''episodi de l''estatut,
  amb el punt culminant de la sent\u00e8ncia del tribunal constitucional, ens ha ensenyat
  amb meridiana claredat els l\u00edmits de l''espanya d''avui, d''una espanya auton\u00f2mica
  que ja ha fet tot el trajecte que podia fer, que no vol anar m\u00e9s enll\u00e0
  ni ajustar-se millor a les difer\u00e8ncies nacional existents al s\u00ed de l''estat.
  Aquesta \u00e9s una opci\u00f3 leg\u00edtima, i a m\u00e9s majorit\u00e0ria en el
  conjunt espanyol, per\u00f2\\n\\ncal preguntar-se si \u00e9s la que ens conv\u00e9
  com a poble. L''evident modernitzaci\u00f3 d''Espanya els darrers trenta anys no
  ha perm\u00e8s una millora del tracte vers Catalunya ni un reconeixement ple de
  l''especificitat del nostre pa\u00eds; malgrat la tamb\u00e9 evident aportaci\u00f3
  de Catalunya a aquesta modernitzaci\u00f3, ens trobem avui amb una Espanya altiva,
  amb una actitud superba i cada cop m\u00e9s agressiva que posa, en la sent\u00e8ncia
  d''uns jutges per\u00f2 tamb\u00e9 massa sovint a peu de carrer i als mitjans de
  comunicaci\u00f3, la unitat nacional per sobre de la democr\u00e0cia. La constituci\u00f3
  serveix per tapar els forats per on el nostre pa\u00eds podria respirar millor..\\n\\nLa
  resposta catalana a aquestes actituds ha estat ben clara, per majorit\u00e0ria i
  per contundent: som una naci\u00f3, nosaltres decidim. Ara cal passar de la proclama
  a l''acci\u00f3. Cal renovar l''esfor\u00e7 col\u00b7lectiu per trobar aquell punt
  d''encontre que ens permeti anar m\u00e9s enll\u00e0 el m\u00e0xim de junts possible.
  No tots, perqu\u00e8 aix\u00f2 \u00e9s impossible, per\u00f2 s\u00ed molts. De manera
  democr\u00e0tica i civilitzada. Com sempre fem.\\n\\nTots els pobles tenim dret
  a poder treure el millor de nosaltres. I \u00e9s per aix\u00f2 que cal preguntar-se:
  perqu\u00e8 aquest pa\u00eds, que \u00e9s emprenedor i industri\u00f3s, que no va
  mancat de talent \u2013per\u00f2 tampoc sobrat- ha d''anar sempre esbufegant i traient
  la llengua, perdent competitivitat, riquesa relativa i inversions? Perqu\u00e8 hem
  de permetre, en nom d''una tramposa solidaritat, l''enorme llosa del drenatge fiscal,
  que vol dir menys estat del benestar, menys escoles, menys hospitals, menys infraestructures?
  Ni tan sols en el cas que sentim poca adhesi\u00f3 emocional al nostre pa\u00eds,
  \u00e9s racional sacrificar tot aix\u00f2. Ni per nosaltres ni per a les properes
  generacions. L''estat del qual formem part \u00e9s el 42\u00e8 en el r\u00e0nquing
  de competitivitat mundial, entre Puerto Rico i les Barbados. Em sembla que tenim
  el dret i l''obligaci\u00f3 a aspirar a quelcom millor.\\n\\nTots els pobles tenim
  tamb\u00e9 dret a viure la nostra identitat amb normalitat. I aqu\u00ed cal preguntar-se:
  perqu\u00e8 hem d''esmer\u00e7ar tants esfor\u00e7os dia rere dia en demanar all\u00f2
  que persones d''altres cultures i altres lleng\u00fces, que solen tenir al darrera
  un estat propi, viuen i practiquen amb tanta normalitat? Perqu\u00e8 acceptar per
  exemple que sistem\u00e0ticament, des de dins i fora de casa nostra, es tingui tant
  d''inter\u00e8s en fer del catal\u00e0 una llengua problem\u00e0tica i pol\u00e8mica?
  El catal\u00e0 \u00e9s la llengua de molts de nosaltres, volem que sigui acceptada
  i adoptada per als qui v\u00e9nen a aquesta terra de pas i d''acollida a provar
  sort i volem que sigui la nostra llengua comuna. Si no pot ser-ho en aquest rac\u00f3
  de m\u00f3n, que \u00e9s on va n\u00e9ixer, on voleu que ho sigui? A quin poble
  defensa la \\\"defensora del pueblo\\\" quan q\u00fcestiona tot aix\u00f2 a cop
  de recurs?\\n\\nEl dia d''avui tamb\u00e9 \u00e9s oport\u00fa per tenir un record
  per als milers i milers de persones que, tant ahir com avui, tant des de l''anonimat
  com estirant el pa\u00eds amb el propi exemple, n''han defensat la seva realitat
  hist\u00f2rica i social, la seva identitat col\u00b7lectiva i la seva dignitat,
  i han lluitat perqu\u00e8 els seus fills puguin ser m\u00e9s lliures que ells. Mentre
  aquesta actitud subsisteixi al moll de l''os del pa\u00eds, podrem seguir aspirant
  a tot. I repeteixo: no hem de renunciar a res que no sigui possible. Els pobles
  resignats ho acaben perdent tot; es comen\u00e7a per la cartera, despr\u00e9s b\u00e9
  la identitat, i s''acaba per l''autoestima. Aquest no \u00e9s ni ser\u00e0 el nostre
  cam\u00ed.\\n\\nJa per acabar, us vull agra\u00efr la vostra pres\u00e8ncia avui
  aqu\u00ed, en aquest acte d''homenatge i de celebraci\u00f3 del nostre pa\u00eds,
  i tamb\u00e9 molt especialment la participaci\u00f3 de les entitats en aquesta celebraci\u00f3;
  sense vosaltres aix\u00f2 nom\u00e9s seria un acte institucional; amb vosaltres
  \u00e9s un acte c\u00edvic i patri\u00f2tic.\\n\\nMoltes gr\u00e0cies. Visca Catalunya
  lliure!\"", "\"Manual Adobe Connect Usuari amb rol Participant\\n\\nAdobe Connect
  \u00e9s una eina per realitzar videoconfer\u00e8ncies gr\u00e0cies a la qual podrem
  realitzar o assistir a classes o reunions a dist\u00e0ncia. En aquest manual ens
  centrarem en les funcionalitats d''un usuari amb rol participant (alumne).\\n\\n-
  En primer lloc accedirem al correu UPC introduint les nostres credencials, i all\u00e0
  buscarem un missatge que ens convidi a una reuni\u00f3 de Connect.\\n- En aquest
  missatge podrem veure els detalls de la reuni\u00f3. Si \u00e9s necessari, confirmarem
  la nostra assist\u00e8ncia clicant al primer l''enlla\u00e7.\\n\\n- Aquest ens portar\u00e0
  a la seg\u00fcent p\u00e0gina, en la que podrem indicar si hi assistirem, si no,
  o si potser.\\n- Un cop confirmada l''assist\u00e8ncia, tornarem al correu i quan
  sigui el moment de la reuni\u00f3, farem clic sobre el segon enlla\u00e7.\\n\\n-
  Aquest ens dur\u00e0 a la web de sales virtuals, en la que novament haurem d''ingressar
  les nostres dades per iniciar sessi\u00f3.\\n- Havent iniciat sessi\u00f3 veurem
  un calendari i totes les reunions que tinguem previstes a la dreta. Des d''all\u00e0
  podrem accedir a la que toqui prement sobre la paraula \\\"Entrar\\\".\\n\\n- Aix\u00f2
  obrir\u00e0 una finestra emergent que ens oferir\u00e0 la possibilitat tant de descarregar
  l''Adobe Connect, com d''obrir-lo si ja el tenim instal\u00b7lat. En el cas de tenir-lo,
  clicarem sobre \\\"Abrir Adobe Connect\\\".\\n- A la part inferior dreta tenim el
  xat, a trav\u00e9s del qual podrem comunicar-nos amb el professor, doncs ell pot
  parlar, per\u00f2 nosaltres no disposem dels permisos.\\n\\n- A la part superior
  esquerra hi trobem tamb\u00e9 una s\u00e8rie de botons que ens permetran:\\n1) Alternar
  entre sentir a trav\u00e9s dels auriculars o altaveus, silenciar-ho o regular el
  volum.\\n2) Alternar entre poder parlar pel micro, o silenciar-lo (no disponible
  en el nostre cas).\\n3) Alternar entre tenir la c\u00e0mera activada o no (No disponible
  en el nostre cas).\\n4) Establir el nostre estat.\\n- L''estat \u00e9s una eina
  que ens permet expressar diverses situacions. Prement a la fletxa lateral podem
  seleccionar el que vulguem i aquest ser\u00e0 notificat al professor.\"", "\"Societat
  | Naci\u00f3SantCugat  | Actualitzat el 17/09/2020 a les 19:40\\n\\nV\u00cdDEO Un
