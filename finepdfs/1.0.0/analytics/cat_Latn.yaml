  |\\n|---|---|---|---|---|---|---|\\n| Final Nacional |  | 5 octubre |  | Centro
  Nacional Madrid |  |  |\\n\\nF\u00d3RMULA DE JOC\\n\\n* Per la Fase de Clubs la
  modalitat de joc ser\u00e0 9 forats Stableford H\u00e0ndicap.\\n* Per la Copa Catalunya
