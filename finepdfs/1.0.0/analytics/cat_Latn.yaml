  ''la Caixa'' destina m\u00e9s de 80.000 euros a tres projectes d''interculturalitat,
  inserci\u00f3 sociolaboral i prevenci\u00f3 de la depend\u00e8ncia\\n\\nLleida |
  13-11-2018 | 12:17\\n\\nM\u00e9s de 2.000 persones, principalment gent gran, persones
  amb discapacitat o malaltes de c\u00e0ncer que viuen a les comarques del Segri\u00e0,
  el Solson\u00e8s i el Pallars Juss\u00e0, a la prov\u00edncia de Lleida, seran les
  benefici\u00e0ries directes dels ajuts que l?Obra Social ?la Caixa? destina aquest
  any a la millora de la qualitat de vida de persones en situaci\u00f3 de malaltia,
  la inserci\u00f3 sociolaboral i la promoci\u00f3 de l?autonomia personal i prevenci\u00f3
  de la depend\u00e8ncia impulsats per l?Asociaci\u00f3n Espa\u00f1ola contra el C\u00e0ncer-Lleida,
  l?Associaci\u00f3 Alba i Riuverd Empresa d?Inserci\u00f3 SCCL, que han estat seleccionats
  en la convocat\u00f2ria d?Acci\u00f3 Social a l?\u00c0mbit Rural 2018, amb una dotaci\u00f3
  total de 83.700 euros. Aquesta convocat\u00f2ria t\u00e9 com a objectiu la millora
  de la qualitat de vida de les persones en risc o situaci\u00f3 d?exclusi\u00f3 social
  que viuen en el medi rural, principalment menors, joves, dones, immigrants, gent
  gran i persones discapacitades o amb malaltia mental. En el conjunt de tot l?Estat,
  han estat seleccionats 36 projectes que suposen una inversi\u00f3 total de 906.800
  euros i que tindran com a benefici\u00e0ries directes 12.000 persones. A m\u00e9s,
  els projectes compten amb la participaci\u00f3 de prop de 200 professionals del
  sector i 800 voluntaris.\\n\\nLa convocat\u00f2ria d?Acci\u00f3 Social a l?\u00c0mbit
  Rural 2018 forma part del Programa d?Ajuts a Projectes d?Iniciatives Socials que
  impulsa anualment l?Obra Social ?la Caixa? i que aquest any destina 18,5 milions
  d?euros a projectes que tenen cura de diferents \u00e0mbits,\u00a0 sempre amb el
  prop\u00f2sit d?oferir oportunitats als col\u00b7lectius en situaci\u00f3 de vulnerabilitat
  social.\\n\\nAutor: Redacci\u00f3\\n\\nPag 1\"", "\"Cursa Vertical d''Esqu\u00ed
  de Muntanya \\\"10\u00e8 Trofeu 3 Fronteres Dynafit/Grandvalira\\\" Grau Roig, dissabte
  31 desembre del 2022\\n\\nL'' Esqu\u00ed Club Pas de la Casa - Grau Roig (ECPCGR)
  organitza la 10ena cursa d''esqu\u00ed de muntanya \\\"3 Fronteres Dynafit/Grandvalira\\\".\\n\\nAquesta
  cursa \u00e9s puntuable per la Copa d''Andorra MORABANC (FAM) d''esqu\u00ed de muntanya
  i del calendari de les curses Open de la Federaci\u00f3 Catalana (FEEC), no obstant
  un any m\u00e9s l''objectiu de la cursa \u00e9s fomentar l''\u00e0mbit popular.\\n\\nEl
  circuit proposat consta d''un desnivell positiu de 680 metres i de 500m per les
  categories U14, U16 i U18 amb sortida a les 10h30 del peu de l''estaci\u00f3 de
  Grau Roig (Cubil) a 2100m i assolint el cim emblem\u00e0tic del Montmal\u00fas a
  2780m.\\n\\nCategories:\\n\\n- U14 Infantil :  13 i 14 anys complerts l''any 2023\\n\\n-
  U16 Cadets: 15 i 16  anys complerts l''any 2023 - U18 Juvenil: 17 i 18 anys complerts
  l''any 2023\\n\\n- U20  Junior: 19 i 20 complerts l''any 2023\\n\\n- O21 S\u00e8nior:
  a partir de 21 anys complerts l''any 2023\\n\\n- O40 Veter\u00e0: a partir de 40
  anys complerts l''any 2023 (subcategoria s\u00e8nior).\\n\\nRecorregut definitiu:\\n\\nLa
  sortida tindr\u00e0 lloc davant del telecadira Coma Blanca a la zona del Cubil de
  Grau Roig i la zona d''arribada ser\u00e0 al cim del pic de Montmal\u00fas.\\n\\n-
  Tra\u00e7at A: 680m de desnivell positiu  (categories U20 \u2013 O21 - O40 M i F)\\n-
  Tra\u00e7at B: 500m de desnivell positiu (categories U14, U16 i U18 M i F)\\n\\nInformaci\u00f3
  per la cursa:\\n\\n- El tra\u00e7at estar\u00e0 marcat de pujada.\\n- El cron\u00f2metre
  es parar\u00e0 un cop passada la l\u00ednia d''arribada, degudament  marcada a terra.\\n-
  Durant l''escalfament, les pistes per on transcorre la cursa (Tortuga i Granota)  romandran
  obertes, es demana seguir les normes de l''estaci\u00f3 i el sentit com\u00fa. Durant
  la cursa s''habilitar\u00e0 un carril pels corredors.\\n- El descens ser\u00e0 neutralitzat.
  Es baixar\u00e0 sense molestar els corredors que es troben en cursa i evitant trepitjar
  les traces de pujada.\\n- La sortida de la cursa ser\u00e0 per tra\u00e7a retracada
  ascendint per la Tortuga i posteriorment pel primer mur de la Granota. En aquest
  punt un control ens indicar\u00e0 que hem de girar a la dreta endinsant-nos pel
  bosc, ara ja per tra\u00e7a, en terreny m\u00e9s t\u00e8cnic i passos m\u00e9s estrets.
  Atenci\u00f3 amb el tap que es pot produir en aquesta zona, m\u00e9s endavant trobareu
  molts punts per avan\u00e7ar i encara amb molta cursa per davant. A continuaci\u00f3
  la carrera transcorrer\u00e0 per zones alternes de pla/pujada fins a trobar una\\n\\nsecci\u00f3
  de \\\"Z\\\" sempre amb doble tra\u00e7a que ens portaran fins a la carena de serra
  extremera del Montmal\u00fas. En aquest punt ja visualitzarem les \u00faltimes pales
  que ens conduiran fins a la collada del Montmal\u00fas. Al llarg d''aquest tram
  trobareu m\u00faltiples traces, tocar\u00e0 estar atents i seguir les banderes que
  ens portaran sempre pel terreny m\u00e9s evident. Des d''aquest punt la neu comen\u00e7a
  a ser m\u00e9s dura i en certs moments la podem trobar ventada.\\n\\nSegons les
  condicions de neu i meteorol\u00f2giques, l''organitzaci\u00f3 podr\u00e0 determinar
  que el tram de la collada de Montmal\u00fas fins al cim es faci a peu. En aquest
  cas, s''informaran els corredors abans de la sortida.\\n\\nJust abans d''enfilar
  les \\\"Z\\\" que ens portaran a la collada de Montmal\u00fas trobarem la l\u00ednia
  d''arribada del circuit B (U14, U16 i U18 M i F).\\n\\n- Portem dies treballant
  en el tra\u00e7at. Al ser una muntanya molt concorreguda ens podem trobar que el
  dia de la cursa trobem altres traces d''esqu\u00ed de muntanya, raquetes de neu
  i que en certs punts la tra\u00e7a estigui trepitjada per motos de neu. Si \u00e9s
  aix\u00ed, us demanem disculpes anticipades i mirarem que us trobeu les millors
  condicions possibles durant el recorregut.\\n\\nPrograma dissabte 31 de desembre:\\n\\n-
  07h30 reuni\u00f3 equip per donar les \u00faltimes consignes\\n- 8h30 \u2013 10h00
  Recollida de dorsals davant del Local de l''Esqu\u00ed Club ECPCGR.\\n- 10h00 Obertura
  Control de material\\n- 10h25 \\\"Briefing\\\" de cursa a la zona de sortida (telecadira
  Coma Blanca)\\n- 10h30 Sortida de totes les categories\\n- A partir de les 12h30
  lliurament de premis de la prova\\n\\nUn cop es tinguin els resultats dels tres
  primers classificats de cada categoria es procedir\u00e0 al lliurament de premis
  i \\\"pica pica\\\" per a tots els participants. Reglament de Competicions d''Esqu\u00ed
  de Muntanya (FAM) Tots els corredors inscrits a la competici\u00f3 han de ser coneixedors
  del Reglament de Competicions d''Esqu\u00ed de Muntanya de la FAM. Aquest reglament
  \u00e9s d''obligat compliment.\\n\\nMaterial Obligatori\\n\\nSer\u00e0 requerit
  i controlat a la sortida i arribada de la prova el material obligatori que indica
  el reglament FAM.\\n\\nCada participant haur\u00e0 de portar el seg\u00fcent material:\\n\\n-
  Esquis\\n- Botes\\n- DVA\\n- Un parell de Pals\\n- Un parell de pells. Per raons
  ambientals, es prohibida la utilitzaci\u00f3 de cinta adhesiva o materials equivalents.\\n-
  Tres capes de dalt, la primera capa pot tenir m\u00e0nigues curtes, la segona acostuma
  ser la granota i la tercera ha de ser tallavent.\\n- Un casc homologat UIAA i CE
  posat durant tota la cursa.\\n- Una manta t\u00e8rmica d''un m\u00ednim de 1,80
  m2 de superf\u00edcie.\\n- Un parell de guants que hauran de romandre posats durant
  tota la cursa.\\n- Unes ulleres de sol amb protecci\u00f3 UV.\\n- Una motxilla a
  on hi c\u00e0piga tot el material que es demana, i equipat ambd\u00f3s punts per
  fixar verticalment els esquis a l''esquena.\\n- Dorsal (facilitat per l''organitzaci\u00f3)\\n\\nInscripcions:\\n\\nInscripcions
  Online a traves de la pagina web de TOP CRONO\\n\\nhttps://topcrono.net/ca/esdeveniments/\\n\\nPreu:\\n\\n49
  \u20ac per participant.\\n\\nAquest any per tots els corredors que passin la l\u00ednia
  d''arribada (llistat crono) us obsequiem amb aquesta jaqueta del nostre col\u00b7laborador
  Dynafit.\"", "\"GUIA DOCENT DE L''ASSIGNATURA\\n\\n|  | Titulaci\u00f3 acad\u00e8mica
  |  |  | Batxillerat / Grau en Teologia |  |  |  |  |  |  |  |\\n|---|---|---|---|---|---|---|---|---|---|---|---|\\n|  |
  Assignatura |  |  | 3ME01I MORAL ESPECIAL II: MORAL DE LA VIDA |  |  |  |  |  |  |  |\\n|
  Any | Any | 2022- 2023 |  | Curs | Quart |  | Valor lectiu |  |  |  | 5 ECTS |\\n|  |
  Per\u00edode lectiu |  | 2n. semestre |  |  | Hores setmanals |  | 3 |  | \u00c0rea
  | CC institucionals |\\n|  | Professor/a |  | Dtnda. Margarida Bofarull i Bu\u00f1uel
  rscj |  |  |  |  |  | Llengua |  | Catal\u00e0 |\\n\\nDescripci\u00f3/Justificaci\u00f3\\n\\nEn
  aquesta assignatura de les morals especials es tracta un dels \u00e0mbits m\u00e9s
  importants, la vida humana a la llum del pla de D\u00e9u. Es tenen presents els
  nous reptes que les ci\u00e8ncies de la vida van posant a la moral cristiana.\\n\\nRequisits
  i orientacions pr\u00e8vies\\n\\nHaver cursat i aprovat moral fonamental.\\n\\nTenir
  cursat el primer trienni del grau.\\n\\nObjectius\\n\\nGenerals\\n\\nAssolir els
  coneixements necessaris per a fer una reflexi\u00f3 i an\u00e0lisi moral dels diferents
  temes i situacions que es presenten en relaci\u00f3 amb la vida humana, des de un
  coneixement b\u00e0sic del substrat de ci\u00e8ncies humanes corresponents.\\n\\nCopsar
  la moral de la vida com a part de la teologia, com a continuaci\u00f3 de l''antropologia
  teol\u00f2gica, per  remarcar la dignitat humana derivada de l''home-dona com a
  imatge i semblan\u00e7a de D\u00e9u.\\n\\nEspec\u00edfics\\n\\n- Con\u00e8ixer els
  grans temes de moral de la vida (Bio\u00e8tica)\\n- Con\u00e8ixer la tradici\u00f3
  en els temes de moral de la vida i el  magisteri contemporani sobre aquests temes.\\n-
  Aprendre el necessari discerniment moral davant dels nous reptes que amenacen la
  vida humana\\n- Copsar els reptes \u00e8tics de les noves tecnologies que afecten
  a la vida humana que t\u00e9 la nostra societat i la resposta des de la tradici\u00f3
  cristiana.\\n- Adquisici\u00f3 de compet\u00e8ncies per a estimar, defensar i celebrar
  la vida des de la Revelaci\u00f3 i la Tradici\u00f3 de l''Esgl\u00e9sia i les ci\u00e8ncies
  humanes.\\n- Aprendre a llegir les dades que ens aporta les ci\u00e8ncies de la
  vida i que s\u00f3n necess\u00e0ries pel discerniment \u00e8tic a la llum de l''Evangeli
  i de la tradici\u00f3 de l''Esgl\u00e9sia.\\n-Diferenciar l''esfera del dret (biodret)
  i de la moral de la vida\\n\\nCompet\u00e8ncies\\n\\n- Comprensi\u00f3 lectora i
  expressi\u00f3 verbal\\n- Capacitat de s\u00edntesi i d''argumentaci\u00f3 .\\n-
  Capacitat d''an\u00e0lisi.\\n\\n- Aprendre a aplicar els principis generals de la
  moral a les situacions concretes de la moral de la vida\\n- Aprendre a dialogar
  sobre temes morals, copsant els valors en joc\\n- Apertura intel\u00b7lectual.\\n-
  Aprendre a veure com tracta algunes q\u00fcestions la bio\u00e8tica laica, i de
  quins pressup\u00f2sits antropol\u00f2gics parteix Aprendre a llegir documents del
  magisteri que tracten temes de moral de la vida\\n- Capacitat de reflexi\u00f3 i
  de pensament cr\u00edtic en temes que representen reptes a moral de la vida\\n-
  Captar all\u00f2 essencial quan es plantegen casos problema\\n- Llenguatge teol\u00f2gic.\\n-
  Capacitat d''assimilar els coneixements teol\u00f2gics fonamentals.\\n- Capacitat
  d''expressar correcta i teol\u00f2gicament el valor de la vida, i de comprendre
  els dilemes m\u00e9s freq\u00fcents que es presenten en aquest \u00e0mbit.\\n\\nContinguts\\n\\nI
  - FONAMENTACI\u00d3 I PRINCIPIS MORALS.\\n\\n1. Valor de la vida humana.:\\n- Arguments
  fonamentals de la Tradici\u00f3 de l''Esgl\u00e9sia en relaci\u00f3 amb el valor
  de la vida humana: St. Agust\u00ed, St. Tom\u00e0s, Escoto...\\n- La B\u00edblia
  i el valor de la vida humana.\\n2. L''Enc\u00edclica Evangelium Vitae.\\n\\n3. Qualitat
  de vida. Reflexi\u00f3 cristiana.\\n4. Bio\u00e8tica: vers una definici\u00f3.\\n-
  Breu hist\u00f2ria de la Bio\u00e8tica.\\n- Factors estructurants del pensament
  i de la pr\u00e0ctica Bio\u00e8tica. Principis fonamentals.\\n- \u00c8tica de les
  virtuts. E. Pellegrino.\\n- Bio\u00e8tica i teologia moral.\\n\\nII - ALGUNES Q\u00dcESTIONS
  ESPECIALMENT IMPORTANTS\\n\\n1. T\u00e8cniques de reproducci\u00f3 assistida.\\n2.
  Estatut de l''embri\u00f3 hum\u00e0.\\n2. Avortament.\\n3. Eugen\u00e8sia. Problem\u00e0tica
  \u00e8tica.\\n4. Manipulaci\u00f3 gen\u00e8tica:\\n4.1. T\u00e8cniques d''edici\u00f3
  g\u00e8nica. CRISPR Cas 9.\\n4.2. Transg\u00e8nics.\\n5. Projecte Genoma Hum\u00e0.
  Implicacions \u00e8tiques.\\n6. Atenci\u00f3 i acompanyament al final de vida. Mort
  Digna.\\n7. Document de Voluntats Anticipades.\\n8. Eutan\u00e0sia i su\u00efcidi
  assistit. Consideracions per a una valoraci\u00f3 \u00e8tica\\n9. Problemes \u00e8tics
  derivats de la salut i la malaltia. Drets del malalt.\\n10. \u00c8tica m\u00e8dica:
  consentiment informat, confidencialitat.\\n11. Objecci\u00f3 de consci\u00e8ncia.\\n11.
  Drogues: els l\u00edmits de la llibertat. Psicof\u00e0rmacs.\\n12. Addiccions: Internet\\n13.
  Bio\u00e8tica i pand\u00e8mies :\\n13.1.SIDA:Problemes \u00e8tics entorn de la s\u00edndrome
  d''immunodefici\u00e8ncia adquirida 13.2. Covid-19.\\n14. Ecologia.\\n14.1. Laudato
  Si''\\n15. La pena de mort.\\n16. Donaci\u00f3 d''\u00f2rgans.\\n17. El Su\u00efcidi.\\n\\nMetodologia
  d''ensenyament-aprenentatge\\n\\nExposici\u00f3 te\u00f2rica a classe per part de
  la professora.\\n\\nTreball personal en base a la bibliografia i textos escollits
  orientats per la professora.\\n\\nExposici\u00f3 del treball realitzat, amb debat
  a les sessions de classe.\\n\\nAvaluaci\u00f3\\n\\nCriteris d''avaluaci\u00f3:\\n\\n-
  Mostra d''haver assolit els objectius del curs, mitjan\u00e7ant treballs, examen
  i participaci\u00f3 a classe.\\n- Inter\u00e8s per aprendre i aprofundir mostrat
  en les classes presencial\\n\\nT\u00e8cniques d''avaluaci\u00f3:\\n\\n- Examen escrit
  que garanteixi que s''han assolit els coneixements b\u00e0sics del curs.\\n- Avaluaci\u00f3
  continuada a classe per part de la professora, en base a la participaci\u00f3, exposicions
  i coneixements que l''alumne mostra que va adquirint.\\n- Treball escrit sobre un
