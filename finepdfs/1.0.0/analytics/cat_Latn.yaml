  d''Emerg\u00e8ncies M\u00e8diques tamb\u00e9 s''hi han traslladat.\\n\\nL''incendi
  est\u00e0 deixant anar una columna de fum gegant que es pot veure des de diversos
  punts de l''\u00e0rea de Barcelona i del Vall\u00e8s.\"", "\"SUBCOMISSI\u00d3 DE
  MATERIALS I EQUIPAMENT POLICIAL\\n\\nDistribuci\u00f3 de roba t\u00e8rmica\\n\\nDurant
  aquest m\u00e9s es far\u00e0 distribuci\u00f3 als efectius dels Sectors de Tr\u00e0nsit
  M\u00f3ra d''Ebre, Tarragona, Tortosa i Montblanc i a les USC de Falset, Gandesa,
  M\u00f3ra d''Ebre, Tortosa, Amposta, Montblanc i Valls. Resten pendent les regions
  metropolitanes.\\n\\nEl Departament disposa de samarretes, mitjons i protectors
  de coll (580) efectius i les Regions de Pirineu, Ponent, Girona i Central ja tenen
  aquestes peces de roba.\\n\\nGuants de motorista professional per a Tr\u00e0nsit
  i Guilles\\n\\nDe manera immediata es comen\u00e7aran a distribuir 650 guants d''hivern
  als efectius de Tr\u00e0nsit i Guilles. Els guants d''estiu es comen\u00e7aran a
  distribuir a partir del mes de febrer.\\n\\nArmilles antibales per a la nova promoci\u00f3\\n\\nS''han
  adquirit 2740 armilles que es destinaran a la nova promoci\u00f3 de l''ISPC. Tamb\u00e9
  poden servir per reposar d''altres que es facin malb\u00e9.\\n\\nUniformitat ACSO\\n\\nEl
  concurs de licitaci\u00f3 ja est\u00e0 preparat. La previsi\u00f3 \u00e9s que la
  roba es pugui lliurar a finals de 2019.\\n\\nFundes armilles antitrauma d''ARRO
  i BRIMO\\n\\nSe''ns informa que les armilles d'' ARRO i BRIMO disposen majorit\u00e0riament
  dels sistemes MK i BONOWI. Aix\u00ed mateix, s''han licitat  1500 fundes d''armilles
  antitrauma amb sistema MOLE. La previsi\u00f3 de lliurament \u00e9s de juliol a
  setembre.\\n\\nGuants antitall\\n\\nSe''ns informa que s''han licitat  6050 unitats
  de nova generaci\u00f3.\\n\\nJaqueta unitats d''investigaci\u00f3\\n\\nEns informen
  que en breu es comen\u00e7aran a lliurar. Es sol\u00b7licita jaqueta i gorra per
  les unitats de fura.\\n\\nCasc USC\\n\\nHem preguntat que faran per reposar els
  cascos retirats a les unitats de USC. Ens informen que resta en estudi quin tipus
  de casc i com adquiriran nous cascs per USC. Una possible soluci\u00f3 podria ser  un
  casc incorporat amb el r\u00e8nting dels vehicles policials (2 per vehicle).\\n\\nConfortabilitat
  T\u00e0sser\\n\\nV\u00e0rem reclamar a la comissi\u00f3 de seguretat i riscos laboral
