  ASOVALL ...... Faradai, 113\\n\\nPER SANTA CREU\\nLA FARIGOLA JA ES VEU\\n\\nJa
  han passat 10 anys des que varem recuperar la Festa de la Santa Creu pel Barri de
  Ca n\u2019Aurell. Al llarg d\u2019aquesta d\u00e8cada hem demostrat que es pot refer
  una festa al carrer, \u201cpopular i tradicional\u201d i que al mateix temps sigui
  oberta perqu\u00e8 pugui ballar i participar tothom qui ho desitgi.\\n\\nEls Padrins
  de la Festa d\u2019enguany s\u00f3n: Na Dolors Gordi, per la bona tasca que realitza
  per la gent del Barri i tamb\u00e9 per la feina feta al llarg dels anys a l\u2019Esbart
  Terrassa, i N\u2019Antoni Romainach, a t\u00edtol p\u00f2stum, en record i agratiment
  per la seva tasca durant molts anys a l\u2019Esbart Terrassa.\\n\\nVolem donar les
  gr\u00e0cies m\u00e9s expressives pel seu ajut i col\u00b7laboraci\u00f3, any darrera
  any, als grups de Cultura Popular, a les Institucions P\u00fabliques, als comer\u00e7os
  del Barri, a l\u2019Associaci\u00f3 de Personal de la Caixa de Pensions i, com no,
  a tota la gent que amb la seva assist\u00e8ncia animen la festa.\\n\\nUs convidem
  com sempre a participar de la festa, ballant les danses recuperades per aquest dia.\\n\\nEL
