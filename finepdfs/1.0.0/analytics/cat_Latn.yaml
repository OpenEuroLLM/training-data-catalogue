  Vermelles\\n\\nHORARIS DE SORTIDES\\n\\nSeran els que estableixi el Comit\u00e8
  de la Prova.\\n\\nCLASSIFICACIONS\\n\\nPROVES\\n\\nEs proclamaran guanyador i guanyadora
  de cada prova, els jugadors amb la puntuaci\u00f3 stableford m\u00e9s alta.\\n\\nRANKING\\n\\nPel
  Ranking del Circuit Nacional 5a Categoria es comptabilitzaran les 9 millors puntuacions
  de cada jugador\\n\\nPREMIS PROVES\\n\\n* Guanyadors (mascul\u00ed i femen\u00ed)\\n*
  Segons classificats (mascul\u00ed i femen\u00ed)\\n\\nTuset, 32, 8a planta - 08006
  Barcelona - tel. 93 414 52 62\\n\\nfirstname.lastname@example.org - www.catgolf.com\\n\\nEl
  premis deuran ser trofeus on aparegui el nom del torneig, el club amfitri\u00f3,
  i si son guanyadors o segons classificats de la seva categoria.\\n\\nRANKING\\n\\nEl
  3 primers homes i les 3 primeres dones rebran un premi donat per la FCGolf.\\n\\nAquests
  jugadors es classificaran per la Final Nacional sempre que siguin majors de 18 anys.\\n\\n4
  QUAN S''HA LLIURAT LA TARGETA DE RESULTATS\\n\\nLa targeta de resultats tant si
  \u00e9s f\u00edsica com a digital es considera lliurada quan el/la jugador/a ha
  sortit de la zona establerta pel Comit\u00e8.\\n\\n5 DESEMPATS\\n\\na. Proves\\n\\nEn
  cas d''empat en una prova, es desempatar\u00e0 segons estipulat en el Llibre Verd
  per a proves handicap.\\n\\nb. Ranking\\n\\nEn cas d''empat en les 3 primeres posicions
  del ranking del Circuit Nacional 5a Categoria, es desempatar\u00e0 tenint en compte
  la millot puntuaci\u00f3. Si persisteix l''empat, segons la seg\u00fcent puntuaci\u00f3
  i aix\u00ed successivament.\\n\\n6 QUAN \u00c9S DEFINITIU EL RESULTAT DE LA COMPETICI\u00d3\\n\\nLa
  competici\u00f3 es tanca una vegada celebrada l''ultima prova i actualitzat el r\u00e0nquing.\\n\\n7
  ASPECTES NO CONTEMPLATS PER AQUESTS TERMES DE LA COMPETICI\u00d3\\n\\nEl Comit\u00e8
  de la Prova decidir\u00e0 en tot el que afecta l''organitzaci\u00f3 i interpretaci\u00f3
  dels Termes de la Competici\u00f3. El Comit\u00e8 de Competici\u00f3 de la FCGolf
  queda facultat per a variar qualsevol condici\u00f3 de la prova, si existissin causes
  que aix\u00ed ho aconsellin, sempre amb la finalitat del bon desenvolupament de
  la prova.\\n\\nFederaci\u00f3 Catalana de Golf\\n\\nTuset, 32, 8a planta - 08006
  Barcelona - tel. 93 414 52 62\\n\\nemail@example.com - www.catgolf.com\"", "\"Homenatge
  a Leonid Sintsev\\n\\nDimarts, 6 de novembre de 2018 \u00b7 18.15 h. Auditori acad\u00e8mic
  de l''ESMUC, sala 4\\n\\nEn aquest concert es vol recordar la seva figura, ara que
  es compleixen deu anys de la seva mort, conversant a l''escenari amb paraules i
  m\u00fasica.\\n\\nLeonid Sintsev va ser un professor molt vinculat a l''ESMUC des
  de la seva gestaci\u00f3. Considerat com un dels pianistes m\u00e9s interessants
  de la seva generaci\u00f3, va destacar pel seu virtuosisme po\u00e8tic interpretant,
  especialment, obres de Liszt i Chopin. Fins la seva mort, va desenvolupar una intensa
  activitat concert\u00edstica i pedag\u00f2gica, compromesa en la trans\u00ad missi\u00f3
  de valors, tant human\u00edstics com art\u00edstics, i fomentant sempre la creativitat
  entre els m\u00e9s de seixanta pianistes que van passar per la seva aula.\\n\\nUna
  taula rodona que reunir\u00e0 professors i exprofessors, no nom\u00e9s de piano,
  que recordaran moments importants de la vida d''en Leonid Sintsev i tocaran obres
  d''Alb\u00e9niz, Mompou, Busoni, Rakhm\u00e0ninov, Schumann o Scriabin, entre d''altres.\\n\\nA.
  S\\n\\ncriabin\\n\\nS. R\\n\\nakhm\u00e0ninov\\n\\n\u0417\u0434\u0435\u0441\u044c
  \u0445\u043e\u0440\u043e\u0448\u043e (Qu\u00e8 b\u00e9 s\u2019est\u00e0 aqu\u00ed),
  op. 21 n\u00fam. 7\\n\\nRafael Salinas, piano\\n\\nPablo M. Fern\u00e1ndez, tuba\\n\\nF.
  Mompou\\n\\nSc\u00e8nes d''enfants\\n\\nAdolf Pla, piano\\n\\nF. B usoni\\n\\nFantasia
  nach Bach BV 253 (fragment)\\n\\nXavier Barbeta, piano\\n\\nR. S\\n\\nchumann\\n\\nVariacions
  sobre un tema de Clara Wieck, op. 14\\n\\nVladislav Bronevetski, piano\\n\\nE. Grieg\\n\\nAls
  teus peus, op. 68 n\u00fam. 3\\n\\nValse-Impromptu, op. 47 n\u00fam. 1\\n\\nJordi
  Mas\u00f3, piano\\n\\nB\\n\\nach -B\\n\\nusoni\\n\\nCoral \\\"Herr, Ich Ruf zu Dir\\\"\\n\\nPierre
  R\u00e9ach, piano\\n\\nI. Alb\u00e9niz\\n\\nEvocaci\u00f3n\\n\\nEstudi, op. 2 n\u00fam.
  1\\n\\nMaria Jes\u00fas Crespo, piano\\n\\nPresentaci\u00f3 de l''acte: Anna Serra,
  exalumna de Leonid Sintsev\\n\\nLeonid Sintsev (1944, Novosibirsk \u2013 2008, Barcelona)
  va ser un dels pia\u00ad nistes m\u00e9s interessants de la seva ge\u00ad neraci\u00f3.
  Des de molt petit va mostrar un talent excepcional per al piano que li va valer
  poder estudiar a la presti\u00ad giosa Escola Especial per a nens de Sant Petersburg
  sota la tutela de Boris Lisenko.\\n\\nLa seva formaci\u00f3 pian\u00edstica va estar
  a c\u00e0rrec de grans mestres com Samary Savshinsky i Natham Perelmann a Sant Petesburg
  i Jakob Flier i Boris Vlasenko a Moscou.\\n\\nVa desenvolupar una intensa activi\u00ad
  tat concert\u00edstica realitzant enregistra\u00ad ments per a la r\u00e0dio i actuant
  en esce\u00ad naris de tota R\u00fassia, Espanya, Cro\u00e0cia, Bulg\u00e0ria, Alemanya,
  Fran\u00e7a, It\u00e0lia o Txecoslov\u00e0quia. Va formar part de nom\u00ad brosos
  concursos internacionals i el go\u00ad vern del seu pa\u00eds el va condecorar amb
  l''ordre d''artista em\u00e8rit.\\n\\nParal\u00b7lelament va dedicar tot el seu
  es\u00ad for\u00e7, intu\u00efci\u00f3 i experi\u00e8ncia a l''exercici de la pedagogia,
  desenvolupant un m\u00e8to\u00ad de personal centrat a dotar a l''alumne de les
  eines i habilitats necess\u00e0ries per convertir-se gradualment en un artista amb
  t\u00e8cnica i personalitat pr\u00f2pies. M\u00e9s de setanta pianistes van passar
  per les seves aules i avui prossegueixen el seu magisteri en els m\u00e9s prestigiosos
  cen\u00ad tres educatius europeus.\\n\\nVa ser fundador i president de la Fundaci\u00f3
  pian\u00edstica Ant\u00f3n Rubinst\u00e9in i pro\u00ad fessor als conservatoris
  de Novosibirsk i Sant Petesburg i a l''Escola Superior de M\u00fasica de Catalunya,
  projecte aquest que el va il\u00b7lusionar especialment i va absorbir la seva dedicaci\u00f3
  fins els \u00fal\u00ad tims dies de la seva vida.\\n\\nesmuc ESCOLA SUPERIOR DE
  M\u00daSICA DE CATALUNYA\\n\\n08013 Barcelona\\n\\nC. Padilla, 155 - Edifici de
  L''Auditori www.esmuc.cat\"", "\"PROGRAMA MUNICIPAL DE\\n\\nPRESSUPOSTOS PARTICIPATIUS
  DE PEDREGUER\\n\\nSisena edici\u00f3 / 2017\\n\\n1. Qu\u00e8 s\u00f3n els pressupostos
  participatius?\\n\\nEl programa municipal de pressupostos participatius \u00e9s
  una iniciativa que l''Ajuntament de Pedreguer va engegar a l''any 2012, amb l''objectiu
  de promoure nous mecanismes de democr\u00e0cia participativa i acostar, d''eixa
  manera, la veu i la voluntat de la ciutadania al proc\u00e9s de presa de decisions
  sobre pol\u00edtiques p\u00fabliques.\\n\\nConfeccionar el pressupost municipal
  comptant amb l''opini\u00f3 directa dels ve\u00efns i ve\u00efnes no constitueix,
  almenys no encara, una obligaci\u00f3 per a les Administracions locals. Per aquesta
  ra\u00f3, parlar de pressupostos participatius suposa fer un pas endavant en la
  gesti\u00f3 democr\u00e0tica dels recursos comuns.\\n\\nL''aposta de Pedreguer,
  en aquest sentit, per fomentar un conjunt de pautes compartides entre els governants
  i la ciutadania, t\u00e9 per finalitat que es puguen assolir majors quotes de corresponsabilitat
  pol\u00edtica i c\u00edvica.\\n\\nPer sis\u00e9 any consecutiu, l''Ajuntament de
  Pedreguer convida als ve\u00efns i ve\u00efnes a proposar aquelles actuacions que
  considere priorit\u00e0ries i, en la fase posterior, a votar les propostes que s''hagen
  seleccionat entre totes les presentades.\\n\\nLes propostes hauran de correspondre''s
  amb inversions municipals i estar adre\u00e7ades a fer de Pedreguer un millor poble.
  Les iniciatives presentades seran valorades pels serveis t\u00e8cnics i aquelles
  que resulten viables es sotmetran a votaci\u00f3 p\u00fablica. L''Ajuntament inclour\u00e0
  les propostes m\u00e9s votades en el pressupost municipal de 2018.\\n\\n2. Qui pot
  participar?\\n\\n> Per a proposar: qualsevol persona.\\n> Per a votar: tots els
  ve\u00efns i ve\u00efnes empadronats a Pedreguer, amb 16 anys complerts.\\n\\n3.
  Sobre qu\u00e8 es participa?\\n\\nAquesta iniciativa es troba centrada en el pressupost
  municipal, document que per obligaci\u00f3 normativa les entitats locals han d''elaborar
  i aprovar cada any i en el qual es materialitza i quantifica el programa d''un equip
  de govern a trav\u00e9s del seu pla econ\u00f2mic sobre els recursos disponibles.
  El pressupost ofereix, aix\u00ed mateix, la informaci\u00f3 necess\u00e0ria per
  a fer un seguiment de la gesti\u00f3 econ\u00f2mica del govern local i permet millorar
  el disseny de futures pol\u00edtiques p\u00fabliques.\\n\\nEl pressupost municipal
  (qualsevol pressupost municipal) es fonamenta en la idea d''equilibri entre ingressos
  esperats i despeses previstes, expressat en llenguatge comptable i elaborat respectant
  els l\u00edmits legals estatals (estabilitat pressupost\u00e0ria, regla de la despesa,
  pla d''ajust, ...).\\n\\nEl proc\u00e9s de confecci\u00f3 del pressupost municipal
  \u00e9s complex. En ell conflueixen no sols els requisits legals d''obligatori compliment
  sin\u00f3 tamb\u00e9 aquells altres condicionants de la pr\u00f2pia din\u00e0mica
  de gesti\u00f3 p\u00fablica, com per exemple el conjunt de despeses relacionades
  amb la prestaci\u00f3 de serveis municipals, el manteniment d''infraestructures
  existents i/o l''execuci\u00f3 de projectes relacionats amb els compromisos pr\u00e8viament
  adquirits per l''equip de govern. Aquestos indefugibles factors provoquen una restricci\u00f3
  significativa del marge de maniobra pel que fa a la gesti\u00f3 econ\u00f2mica dels
  recursos disponibles.\\n\\nPer aquest motiu, la introducci\u00f3 de mecanismes de
  participaci\u00f3 ciutadana en el proc\u00e9s de confecci\u00f3 del pressupost municipal
  s''ha d''abordar desenvolupament dues l\u00ednies de treball complement\u00e0ries:\\n\\n-
  INFORMAR a la ciutadania sobre qu\u00e8 \u00e9s el pressupost municipal, com s''elabora
  i quines s\u00f3n les variables que actualment condicionen els comptes p\u00fablics
  a Pedreguer.\\n- CONSULTAR als ve\u00efns i ve\u00efnes sobre les actuacions de
  la part del pressupost municipal susceptible d''una major intervenci\u00f3 ciutadana
  (el cap\u00edtol 6, corresponent a inversions), convidant-los a plantejar propostes
  i, posteriorment, a votar aquelles actuacions que hagen estat finalment seleccionades.\\n\\n4.
  Com i on es participa?\\n\\nA l''objecte de facilitar la participaci\u00f3 de totes
  les persones en el programa, existeix la web www.pedreguerparticipa.com, a trav\u00e9s
  de la qual des de qualsevol dispositiu (tel\u00e8fon m\u00f2bil, ordinador, tauleta,
  ...) amb acc\u00e9s a Internet es pot obtenir informaci\u00f3 del proc\u00e9s (convocat\u00f2ries
  a reunions, relaci\u00f3 de propostes presentades, seleccionades i votades, bases
  generals del programa, ...) i, a m\u00e9s, formar part activa del proc\u00e9s, proposant
  accions a trav\u00e9s del formulari electr\u00f2nic, quan arriba la fase de recollida
  de propostes i tamb\u00e9 elegint les propostes que es consideren priorit\u00e0ries,
  quan es troba oberta la fase de votaci\u00f3 p\u00fablica.\\n\\nComplement\u00e0riament,
  l''Ajuntament habilita un conjunt de punts de participaci\u00f3 en alguns dels edificis
  municipals per tal que qualsevol ve\u00ed o ve\u00efna, amb independ\u00e8ncia de
  la seua capacitat de connexi\u00f3 a la web, puga accedir a la iniciativa.\\n\\n5.
  Quan es proposen les accions?\\n\\nFins el 22 de maig de 2016, qualsevol persona
  pot proposar les inversions que considere necess\u00e0ries per al municipi, a trav\u00e9s
  de www.pedreguerparticipa.com o, si ho prefereix, als punts de participaci\u00f3
  habilitats a la Casa de Cultura, al Poliesportiu, al Centre Social i a l''edifici
  de l''Ajuntament.\\n\\n6. Com se seleccionen les propostes?\\n\\nD'' entre totes
  les propostes rebudes, els serveis t\u00e8cnics municipals seleccionen aquelles
  que compleixen els seg\u00fcents requisits b\u00e0sics:\\n\\n1.- Que siguen accions
  compet\u00e8ncia de l''Ajuntament.\\n2.- Que es tracte d''inversions (cap\u00edtol
  6 del pressupost municipal).\\n3.- Que no estiguen ja executades o que la seua execuci\u00f3
  no es trobe ja aprovada.\\n4.- Que resulten viables t\u00e8cnicament i jur\u00eddicament.\\n5.-
  Que el seu cost estimat no siga superior a l''import disponible.\\n6.- Que es puguen
  desenvolupar dins d''un mateix exercici pressupostari.\\n7.- Que les despeses de
  manteniment derivades resulten assumibles.\\n\\nEl conjunt de propostes considerades
  viables s\u00f3n sotmeses a votaci\u00f3 p\u00fablica. Qualsevol ve\u00ed o ve\u00efna
  pot consultar el conjunt de les propostes presentades per la ciutadania, aix\u00ed
  com tamb\u00e9 els motius per a la seua inclusi\u00f3 o no en el proc\u00e9s de
  votaci\u00f3, a www.pedreguerparticipa.com\\n\\n7. Quan \u00e9s la votaci\u00f3
  p\u00fablica?\\n\\nDes del dia 11 fins al 25 de setembre l''Ajuntament obri la fase
  de presentaci\u00f3 p\u00fablica de propostes i votaci\u00f3, adre\u00e7ada a totes
  les persones empadronades a Pedreguer i amb 16 anys complits. Es poden triar les
  3 accions que s''estimen priorit\u00e0ries per a que l''equip de govern les incloga
  al pressupost municipal de 2018. Es vota accedint a la mateixa web o acudint als
  punts de participaci\u00f3 habilitats.\\n\\n8. Es fan p\u00fablics els resultats?\\n\\nS\u00ed.
  Tant el recompte final de la votaci\u00f3 com els resultats obtinguts a les fases
  interm\u00e8dies (recollida inicial de propostes i validaci\u00f3 t\u00e8cnica)
  s\u00f3n objecte de la m\u00e0xima transpar\u00e8ncia, facilitant-se en tot moment
  la informaci\u00f3 a trav\u00e9s de la web.\\n\\nJuntament amb l''anterior, despr\u00e9s
  de la finalitzaci\u00f3 de la votaci\u00f3 es troba prevista una reuni\u00f3 de
  presentaci\u00f3 de resultats, com a sessi\u00f3 de retorn de la informaci\u00f3
  obtinguda al proc\u00e9s, pel que fa tant als nivells de participaci\u00f3 registrats
  com a les propostes que hagen resultat majorit\u00e0riament escollides per la ciutadania.
  Aix\u00ed mateix, la finalitat d''aquesta reuni\u00f3 \u00e9s fer pal\u00e8s de
  quina manera les accions seleccionades entraran a formar part del pressupost per
  a l''any seg\u00fcent.\\n\\n9. Podeu avisar-me per a que participe en cadascuna
  de les fases?\\n\\nS\u00ed. Qui desitge estar informat de l''evoluci\u00f3 del proc\u00e9s
  i tamb\u00e9 de les convocat\u00f2ries pot subscriure''s  al llistat de correu,
  a trav\u00e9s de www.pedreguerparticipa.com\\n\\n10. \u00c9s possible fer suggeriments
  i consultes per a millorar el proc\u00e9s participatiu?\\n\\nS\u00ed, per descomptat.
  Els ve\u00efns i ve\u00efnes tenen al seu abast la seg\u00fcent adre\u00e7a de contacte:\\n\\nfirstname.lastname@example.org\"",
  "\"M\u00e9s informaci\u00f3:\\n\\nAjuntament de Sant Cugat santcugat.cat \u00b7
  email@example.com\\n\\nFons Catal\u00e0 de Cooperaci\u00f3 al Desenvolupament fonscatala.org
  \u00b7 93 412 26 02\\n\\nCol\u00b7labora:\\n\\nJORNADES\\nDE COOPERACI\u00d3 T\u00c8CNICA\\n\\nLa
  cooperaci\u00f3 entre institucions p\u00fabliques locals: promoci\u00f3 de models
  horitzontals i rec\u00edprocs.\\n\\nDel 22 al 24 de mar\u00e7 de 2017\\n\\nCasa
  de Cultura de Sant Cugat del Vall\u00e8s (Jardins del Monestir. Carrer del Castellv\u00ed,
  8)\\n\\nEl Fons Catal\u00e0 de Cooperaci\u00f3 al Desenvolupament est\u00e0 dissenyant
  i implementant un Programa de Cooperaci\u00f3 T\u00e8cnica a partir d''assist\u00e8ncies
  t\u00e8cniques entre governs locals catalans i de pa\u00efsos del Sud en diferents
  sectors d''intervenci\u00f3.\\n\\nPer aquesta ra\u00f3 proposa anar m\u00e9s enll\u00e0
  del model operatiu de cooperaci\u00f3 tradicional, centrada sobretot en la transfer\u00e8ncia
  de recursos, dissenyant accions de cooperaci\u00f3 t\u00e8cnica horitzontal i rec\u00edproca
  entre institucions p\u00fabliques locals del Sud i del Nord que permetin transversalitzar
  diferents departaments municipals i augmentar el valor afegit i el comprom\u00eds
  de la cooperaci\u00f3 local.\\n\\nDIMECRES 22 DE MAR\u00c7\\n\\n18.30 h. Visita
  guiada al Claustre (en franc\u00e8s, castell\u00e0 i angl\u00e8s).\\n\\nLloc: Claustre
  del Monestir\\n\\n19.30 h. Acte de benvinguda institucional, amb la intervenci\u00f3
  dels ajuntaments i les institucions organitzadores, l''actuaci\u00f3 musical del
  Hear Us Children''s Choir (Malawi) i piscolabis a c\u00e0rrec d''una empresa social
  i solid\u00e0ria.\\n\\nLloc: Pla\u00e7a de l''Om\\n\\nDIJOUS 23 DE MAR\u00c7\\n\\n9.30
  h. Inscripcions\\n\\nEn el marc d''aquesta iniciativa de promoci\u00f3 de la cooperaci\u00f3
  t\u00e8cnica, el FCCD i l''Ajuntament de Sant Cugat del Vall\u00e8s, amb el suport
  de l''Ajuntament de Barcelona, organitzen unes Jornades de Cooperaci\u00f3 T\u00e8cnica
  amb els seg\u00fcents objectius:\\n\\n* Posar en com\u00fa experi\u00e8ncies de
  cooperaci\u00f3 t\u00e8cnica intermunicipal i transnacional per treure lli\u00e7ons
  en clau d''aprenentatge pel foment de models de cooperaci\u00f3 transversal i rec\u00edproca.\\n*
  Situar els ajuntaments com a actors clau de la cooperaci\u00f3 internacional.\\n*
  Presentar la Guia per a la identificaci\u00f3 i implementaci\u00f3 d''accions de
  cooperaci\u00f3 t\u00e8cnica de municipi a municipi.\\n\\n10 h. Pon\u00e8ncia inaugural.
  \\\"La cooperaci\u00f3 t\u00e8cnica: un nou paradigma de treball pels Governs Locals\\\".
  David Minoves, coordinador del Fons Catal\u00e0 de Cooperaci\u00f3 al Desenvolupament
  (FCCD).\\n\\n10.30 h. Experi\u00e8ncies i models de Cooperaci\u00f3 T\u00e8cnica\\n\\n*
  Programa Municipal de Gesti\u00f3 Integral de Residus S\u00f2lids: Bol\u00edvia.
  Gobierno Aut\u00f3nomo Municipal de Tarija (Bol\u00edvia) i Ajuntament de Sant Cugat
  del Vall\u00e8s.\\n* \\\"Vacaci\u00f3ns con Traballo\\\". Fondo Galego de Cooperaci\u00f3n
  e Solidaridade.\\n* Reconstrucci\u00f3 post-emergent en clau local: Equador. PNUD
  Ecuador,  Governs Aut\u00f2noms Descentralitzats (GAD) equatorians, Diputaci\u00f3
  de Barcelona, Ajuntament de Barcelona i FCCD.\\n* Migracions i desenvolupament:
  Senegal. Agence R\u00e9gionale de D\u00e9veloppement de S\u00e9dhiou (Senegal).\\n*
  Suport als municipis de La Bekaa per a la gesti\u00f3 de la crisi dels refugiats
  sirians: Liban. Cit\u00e9s Unies Liban i Diputaci\u00f3 de Barcelona (DIBA).\\n\\n11.45
  h. Pausa caf\u00e8\\n\\n12.15 h. Grups de debat. Una aproximaci\u00f3 compartida
  a la Cooperaci\u00f3 T\u00e8cnica.\\n\\n14 h. Dinar\\n\\n16 h. Experi\u00e8ncies
  i models de Cooperaci\u00f3 T\u00e8cnica.\\n* \\\"Programa de Voluntarios Expertos\\\".
  Fondo Extreme\u00f1o Local de Cooperaci\u00f3n al Desarrollo (FELCODE).\\n* La gesti\u00f3
  de l''aigua en contextos de crisi aguda: Palestina. The Applied Research Institute,
  Jerusalem (ARIJ), Enginyeria Sense Fronteres (ESF) i FCCD.\\n* Gesti\u00f3 mancomunada
  de pol\u00edtiques p\u00fabliques locals: Guatemala, El Salvador, Honduras. \u00c0rea
  Metropolitana de Barcelona (AMB) i Mancomunidad Trinacional Fronteriza R\u00edo
  Lempa.\\n\\nSimult\u00e0niament les delegacions internacionals visitaran experi\u00e8ncies
  relacionades amb la gesti\u00f3 de residus, el cicle integral de l''aigua, les pol\u00edtiques
  d''igualtat i l''atenci\u00f3 ciutadana.\\n\\n* Pol\u00edtiques d''Igualtat amb
  perspectiva de g\u00e8nere: Marroc. R\u00e9gion Tanger, T\u00e9touan, Al Hoze\u00efma
  (RTTA).\\n\\n17 h. Plenari. Oportunitats, conflictes i reptes dels nous models de
  cooperaci\u00f3 horitzontal.\\n\\n18.30 h. Clownclusions\\n\\n19 h. Cloenda\\n\\nLloc:
  Casa de Cultura\\n\\nDIVENDRES 24 DE MAR\u00c7\\n\\n10 h. Presentaci\u00f3 de la
  Guia de Cooperaci\u00f3 T\u00e8cnica. Miquel Carrillo, Consultor.\\n\\n11.30 h.
  Pausa caf\u00e8\\n\\n12 h. Discussi\u00f3 i debat: modalitats, compet\u00e8ncies
  i procediments jur\u00eddicolaborals.\\n\\nLloc: Casa de Cultura\\n\\nLes lleng\u00fces
  de treball seran el catal\u00e0, el castell\u00e0, el franc\u00e8s i l''angl\u00e8s.\\n\\nHi
  haur\u00e0 servei d''interpretaci\u00f3 simult\u00e0nia.\"", "\"SINEU!!! Inserci\u00f3
  laboral obre les seves portes a les fam\u00edlies, usuaris i persones interessades\\n\\nBy
  Autor\\n\\nTue Feb 18 10:00:00 CET 2020\\n\\nNot\u00edcies propies Mater Sineu Formaci\u00f3
  i inserci\u00f3 laboral Not\u00edcia\\n\\nEl mes de febrer es va inaugurar amb la
  Jornada de Portes Obertes del Servei d''Inserci\u00f3 Laboral dirigida, sobre tot,
  als familiars de les persones usu\u00e0ries, per\u00f2 tamb\u00e9 a qualsevol persona
  interessada en con\u00e8ixer el servei.\\n\\nLa jornada va tenir lloc el dilluns
  3 de febrer a Mater Sineu de les 16.30 a les 19 hores. Van acudir usuaris del servei
  i els seus familiars per tal de con\u00e8ixer millor en qu\u00e8 consisteix el Servei
  d''Inserci\u00f3 Laboral.\\n\\nEn primer lloc es va projectar un v\u00eddeo de l''Organitzaci\u00f3
