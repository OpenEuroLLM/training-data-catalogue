  de la Mutual M\u00e8dica de Catalunya i Balears\"", "\"Exp.: X2020002010 RH\\n\\nANUNCI\\n\\nANUNCI
  sobre l''ampliaci\u00f3 d''informaci\u00f3 referent a les bases del concurs oposici\u00f3
  per a la cobertura definitiva de sis places de funcionari, escala administraci\u00f3
  especial, subescala Serveis especials, classe policia local i categoria d''agent,
  subgrup C2, inclosa en la Oferta P\u00fablica d''Ocupaci\u00f3 parcial de l''any
  2020 a l''Ajuntament de Viladecavalls.\\n\\nPer decret d''Alcaldia, n\u00fam. 2020DECR000764,
  de 18 de setembre de 2020 s''ha resolt publicar un anunci d''ampliaci\u00f3 d''informaci\u00f3
  referent a les bases reguladores del proc\u00e9s selectiu de 6 places d''agent de
  la Policia local que aquest Ajuntament aprov\u00e0 i convoc\u00e0 per acord de Junta
  de Govern en data 30 de juliol de 2020.\\n\\nLa part resolutiva de la resoluci\u00f3
  esmentada \u00e9s del tenor literal que seguidament s''indica:\\n\\n\\\"Publicar
  al BOPB, DOGC, tauler d''anuncis i web municipal, un anunci d''ampliaci\u00f3 d''informaci\u00f3
  de les bases en el que s''especifiqui que la reserva de 2 de les 6 places convocades
  per dones s''atendr\u00e0 a les seg\u00fcents condicions:\\n\\nDe les 3 places d''agent
  pel sistema de concurs oposici\u00f3 lliure es reserva una pla\u00e7a per a dones;
  i de les 3 places d''agent mitjan\u00e7ant mobilitat horitzontal se''n reserva una
  altra.\\n\\nEls criteris en els procediments selectius per  l''adjudicaci\u00f3
  de les places convocades, en especial pel que fa a les places reservades per a dones,
  es far\u00e0 d''acord amb el que estableix el punt 3 de la disposici\u00f3 addicional
  vuitena de la llei 16/1991, de 10 de juliol, de Policies Locals.\\n\\nEn el cas
  que les places reservades per a dones no poguessin ser ocupades, per manca d''aspirants
  o per no complir-se els criteris establerts en la disposici\u00f3 addicional vuitena
  de la llei 16/1991, de 10 de juliol, de Policies Locals, aquestes places passaran
  a ser ocupades seguint l''ordre de la llista final \u00fanica de les persones que
  hagin superat el proc\u00e9s.\\\"\\n\\nL''Alcaldessa Francesca Berenguer Priego\\n\\nViladecavalls,
  a 18 de setembre de 2020\\n\\nC. Antoni Soler i Hospital, 7-9 \u00b7 08232 \u00b7
