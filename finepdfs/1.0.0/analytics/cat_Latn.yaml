  la difer\u00e8ncia entre els per\u00edodes d''estiu i hivern. Es percep un increment
  del consum en els mesos d''estiu, degut principalment a l''obertura de la piscina
  descoberta. En els mesos d''hivern, els consums romanen m\u00e9s estables a causa
  de la rutina d''utilitzaci\u00f3 dels equipaments esportius del camp de futbol,
  pavell\u00f3 i pistes de tenis i p\u00e0del.\\n\\n5. Descripci\u00f3 de les instal\u00b7lacions
  i de l''edifici\\n\\nEquips el\u00e8ctrics\\n\\nEnllumenat:\\nLes ll\u00e0mpades
  majorit\u00e0ries de l''equipament s\u00f3n del tipus Fluorescents i Led; els focos
  de les pistes s\u00f3n tots Hal\u00f2gens.\\nLa gesti\u00f3 d''aquest enllumenat
  es realitza de forma manual.\\n\\nClimatitzaci\u00f3:\\nL''equipament no disposa
  de sistema de climatitzaci\u00f3.\\n\\nVentilaci\u00f3:\\nLa ventilaci\u00f3 dels
  edificis del centre es realitza de forma natural a trav\u00e9s de finestres.\\n\\nAigua
  calenta sanit\u00e0ria\\nEl bar disposa d''un terme el\u00e8ctric per l''escalfament
  de l''ACS.\\n\\nEquips d''inform\u00e0tica:\\nL''equipament no disposa d''equips
  d''inform\u00e0tica.\\n\\nAltres equips:\\nEl centre tamb\u00e9 disposa dels seg\u00fcents
  equips que consumeixen energia el\u00e8ctrica:\\n- Campana extractora\\n- planxa
  cuina\\n- 4 geleres\\n- bombes d''impulsi\u00f3 piscina\\n- 2 congeladors horitzontals\\n-
  3 fregidors\\n- rentaplats\\n- bombes pel reg\\n\\nEquips t\u00e8rmics\\n\\nAigua
  calenta sanit\u00e0ria:\\nEl centre disposa de 1 caldera de gasoil per calefacci\u00f3.\\nLa
  pot\u00e8ncia aproximada \u00e9s de 46,6 kW.\\nLa caldera t\u00e9 el suport d''un
  sistema solar t\u00e8rmic.\\n\\nAltres equips:\\nEl centre no disposa d''altres
  equips consumidors de gasoil.\\n\\n### Equips consumidors d''aigua\\n\\n| Punts
  consumidors                  |       |\\n|-----------------------------------|-------|\\n|
  Aixetes tipus monocomandament     | 2     |\\n| Aixetes tipus polsador            |
  20    |\\n| WC amb simple o doble desc\u00e0rrega o flux\u00f2metre | 16   |\\n|
  Urinaris                          | 4     |\\n| Dutxes tipus polsador             |
  32    |\\n\\n**Observacions:**\\n\\nEls punts de consum corresponen als vestidors
  del centre. La majoria de punts comptabilitzats disposa de mesures de reducci\u00f3
  del consum d''aigua, com polsadors i doble desc\u00e0rrega.\\n\\n### Tancaments
  i tipus de coberta\\n\\n| Coberta               | Panell sandwich |\\n|-----------------------|-----------------|\\n|
  Parets exteriors      | Sense a\u00efllament |\\n| Tipus de tancaments   | Alumini         |\\n|
  Tipus de vidres       | Simple          |\\n| Sistemes de protecci\u00f3 solar |
  -              |\\n\\n**Observacions:**\\n\\nLes cobertures presents a les instal\u00b7lacions
  corresponen al pavell\u00f3, compost per un panell sandwich, al bar de la piscina
  i els vestuaris del camp de futbol, on hi ha teules.\\n\\n6. Conclusions de la situaci\u00f3
  energ\u00e8tica de l\u2019equipament\\n\\nGran part dels punts de llum presents
  al recinte esportiu estan canviat per LED, encara que romanen pendents de canvi
  aquells que consumeixen m\u00e9s energia, com \u00e9s la il\u00b7luminaci\u00f3
  del camp de futbol, formada per bombetes hal\u00f2genes.\\n\\nPunts forts\\n\\nEnllumenat:\\nEs
  disposa d\u2019un gran nombre de punts de llum amb fluorescents compactes i LED.\\n\\nEnergia
  renovable:\\nEs disposa d\u2019un sistema solar t\u00e8rmic de suport a la caldera
  de gasoil per l\u2019escalfament de l\u2019ACS dels vestuaris.\\n\\nPunts febles\\n\\nEnllumenat:\\nEls
  punts de llum LED es limiten a la il\u00b7luminaci\u00f3 de la pista del pavell\u00f3,
  les pistes de tennis i p\u00e0del. Tots els vestuaris i passadissos s\u2019il\u00b7luminen
  amb fluorescents. Els vestuaris del pavell\u00f3 es troben al nivell -1, i al ser
  una zona que no rep llum natural, \u00e9s recomanable instal\u00b7lar un detector
  de pres\u00e8ncia que activi els llums del passad\u00eds, el qual roman enc\u00e8s
  durant tot l\u2019horari d\u2019obertura de les instal\u00b7lacions. Un punt que
  requereix el canvi a LED \u00e9s el camp de futbol, el qual s\u2019il\u00b7lumina
  mitjan\u00e7ant bombetes hal\u00f2genes d\u2019elevada potencia.\\n\\nTancaments:\\nEs
  disposa de finestres i portes amb vidre simple.\\n\\n7. Conclusions de la situaci\u00f3
  envers els impactes del canvi clim\u00e0tic a l''equipament\\n\\n1. Confort t\u00e8rmic:
  insuficient als espais tancats (bar i vestidors), que no disposen de sistema de
  climatitzaci\u00f3.\\n\\n2. Consum d''aigua: els punts de consum disposen de polsadors
  i de dobl\u00e8 desc\u00e0rrega.\\n\\n3. Potencialitat d''instal\u00b7lacions d''energies
  renovables; l''equipament ja disposa d''un sistema solar t\u00e8rmic i la coberta
  permet la instal\u00b7laci\u00f3 d''una fotovoltaica per autoconsum.\\n\\n4. Ubicaci\u00f3
  de l''equipament: no es troba ubicat en una zona potencialment inundable.\\n\\n8.
  Distribuci\u00f3 de consums de l''equipament\\n\\nObservacions:\\n\\nEls consums
  majoritaris de l''equipament s\u00f3n els d''enllumenat, que representa un 73% dels
  consums totals i \u00e9s causat especialment pels focos hal\u00f2gens presents a
  les pistes i els fluorescents dels vestuaris, que es queden enc\u00e8sos durant
  tot el per\u00edode d''obertura. Els consums dels \\\"altres equips\\\" inclouen
  les bombes d''impulsi\u00f3 de la piscina i pel reg dels camps i els aparells de
  cuina del bar. Gr\u00e0cies a l''aportaci\u00f3 del sistema solar t\u00e8rmic, el
  consum de la caldera per l''escalfament d''ACS dels vestuaris representa \u00fanicament
  un 8% dels consums totals. El consum del terme el\u00e8ctric per l''escalfament
  de l''ACS del bar t\u00e9 un pes m\u00ednim sobre el total dels consums.\\n\\n9.
  Accions proposades en relaci\u00f3 a la mitigaci\u00f3 del canvi clim\u00e0tic\\n\\nD''acord
  amb la distribuci\u00f3 dels consums, es considera que la prioritat per la reducci\u00f3
  dels consums i emissions d''aquest equipament sigui actuar en millorar l''efici\u00e8ncia
  i el control de l''enllumenat. En segon lloc es podr\u00e0 reduir la pot\u00e8ncia
  contractada i analitzar la viabilitat d''una instal\u00b7laci\u00f3 fotovoltaica.
  Aquesta \u00faltima haur\u00e0 de ser amb bateria, ja que el funcionament del centre
  \u00e9s de tarda. En aquest estudi s''han analitzat nom\u00e9s les accions que es
  refereixen a l''enllumenat, considerant que siguin les priorit\u00e0ries.\\n\\nEs
  proposen per tant 3 accions en relaci\u00f3 a la mitigaci\u00f3, que queden recollides
  al pla d''acci\u00f3 del PAESC i s\u00f3n les seg\u00fcents;\\n\\n1. Substituci\u00f3
  de FL convencionals per tubs LED\\n\\nConcepte de la millora\\nEls fluorescents
  convencionals es poden substituir directament per fluorescents LED (Light-Emitting
  Diode), els quals ofereixen un estalvi energ\u00e8tic significatiu. Alhora, l''increment
  de vida de la tecnologia LED enfrot la convencional \u00e9s tamb\u00e9 un aspecte
  important a tenir en compte per l''estalvi energ\u00e8tic i econ\u00f2mic que representa.\\n\\nHi
  ha un aspecte negatiu a tenir en compte: les prestacions lum\u00edniques que ofereix
  el fluorescent tipus LED s\u00f3n inferiors a les d''un fluorescent convencional
  sense reflector. Aix\u00f2 genera que en el moment d''aplicar el canvi de tecnologia
  (fluoresc\u00e8ncia convencional per tipus LED) s''hagi de tenir en compte si aquest
  canvi \u00e9s compatible o no amb cada zona afectada.\\n\\nA continuaci\u00f3 s''adjunta
  taula resum on s''exposen les caracter\u00edstiques dels dos sistemes:\\n\\n| Tub
  fluorescent est\u00e0ndard | Model | F 18 W T8 | F 36 W T8 | F 58 W T8 |\\n|---------------------------|-------|-----------|-----------|-----------|\\n|
  Pot\u00e8ncia (W)              |       | 18        | 36        | 58        |\\n|
  Longitud (mm)             |       | 600       | 1.200     | 1.500     |\\n| Flux
  llumin\u00f3s (lm)        |       | 1.350     | 3.350     | 5.240     |\\n| Vida
  \u00fatil (hores)         |       | 12.000    | 12.000    | 12.000    |\\n\\n| Equival\u00e8ncia
  en Tub LED   | Model | 1 x 10 W | 1 x 20 W | 1 x 22 W |\\n|---------------------------|-------|----------|----------|----------|\\n|
  Pot\u00e8ncia (W)              |       | 11       | 20       | 23       |\\n| Longitud
  (mm)             |       | 600      | 1.200    | 1.500    |\\n| Flux llumin\u00f3s
  (lm)        |       | 800      | 2.000    | 3.100    |\\n| Vida \u00fatil (hores)         |       |
  50.000   | 50.000   | 50.000   |\\n\\nEls valors anotats en tub LED s\u00f3n gen\u00e8rics
  i poden variar notablement entre diferents marques i models: un tub led de la mateixa
  pot\u00e8ncia pot tenir unes millors prestacions i tenir un rendiment lum\u00ednic
  m\u00e9s elevat que un altre que, a priori, sembli el mateix producte.\\n\\n**Descripci\u00f3
  de la mesura**\\nEs proposa la substituci\u00f3 dels tubs fluorescents convencionals
  amb un major r\u00e8gim d\u2019\u00fas pels seus equivalents en LED.\\nTenint en
  compte aquest criteri, per a la realitzaci\u00f3 de la proposta s\u2019han considerat
  els seg\u00fcents fluorescents: 50 tubs de 18W; 12 tubs de 36W; 79 tubs de 58W\\nLes
  equival\u00e8ncies considerades s\u00f3n:\\nFL 18 W T8: Led 10 W; FL 36 W T8: Led
  20 W; FL 58 W T8: Led 23 W\\n\\n**Justificaci\u00f3 de l\u2019estalvi**\\nPer al
  c\u00e0lcul de l\u2019estalvi s\u2019ha tingut en compte, per una banda el menor
  consum associat a la reducci\u00f3 de la pot\u00e8ncia instal\u00b7lada amb la substituci\u00f3
  per LED, i per l\u2019altra l\u2019estalvi associat a la reposici\u00f3 de les ll\u00e0mpades
  degut a que els LED tenen un vida \u00fatil superior a la dels fluorescents convencionals.\\n\\n---\\n\\n**2.
  Substituci\u00f3 de projectors hal\u00f2gens per focus LED**\\n\\n**Concepte de
  la millora**\\nEls projectors LED (Light-Emitting Diode) ofereixen un estalvi energ\u00e8tic
  significatiu en comparaci\u00f3 amb els actuals hal\u00f2gens. Alhora, l\u2019increment
  de vida de la tecnologia LED enfrent la convencional \u00e9s tamb\u00e9 un aspecte
  important a tenir en compte per l\u2019estalvi energ\u00e8tic i econ\u00f2mic que
  representa.\\n\\n**Descripci\u00f3 de la mesura**\\nEs proposa la substituci\u00f3
  dels 24 projectors hal\u00f2gens de 3000 W pels seus equivalents en LED.\\n\\n**Justificaci\u00f3
  de l\u2019estalvi**\\nPel c\u00e0lcul de l\u2019estalvi s\u2019ha tingut en compte,
  per una banda el menor consum associat a la reducci\u00f3 de la pot\u00e8ncia instal\u00b7lada
  amb la substituci\u00f3 per LED, i per l\u2019altra l\u2019estalvi associat a la
  reposici\u00f3 de les ll\u00e0mpades degut a que els LED tenen un vida \u00fatil
  superior a la dels fluorescents convencionals.\\n\\n3. Instal\u00b7laci\u00f3 de
  detectors de pres\u00e8ncia\\n\\nConcepte de la millora\\nUn sistema ideal de regulaci\u00f3
  d\u2019enllumenat \u00e9s aquell que proporciona suficient il\u00b7luminaci\u00f3
  perqu\u00e8 la tasca es realitzi amb confort, comoditat i seguretat durant el seu
  temps d\u2019execuci\u00f3. La resta de temps la il\u00b7luminaci\u00f3 estar\u00e0
  desconectada.\\n\\nEls sistemes de regulaci\u00f3 m\u00e9s b\u00e0sics consisteixen
  en la instal\u00b7laci\u00f3 de dispositius d\u2019aturada autom\u00e0tica, basats
  en temporitzadors que permeten limitar la durada de la il\u00b7luminaci\u00f3 en
  zones de circulaci\u00f3 o serveis d\u2019ocupaci\u00f3 intermitent.\\n\\nDins el
  grup de sistemes autom\u00e0tics tot-ress, tamb\u00e9 es troben els dispositius
  fotoel\u00e8ctrics d\u2019engegada i aturada autom\u00e0tiques de l\u2019enllumenat
  exterior i de les zones interiors perif\u00e8riques de l\u2019edifici en funci\u00f3
  del nivell de la llum natural.\\n\\nEn aquest cas es proposa la instal\u00b7laci\u00f3
  de detectors de pres\u00e8ncia, que connecten o disconnecten l\u2019enllumenat d\u2019un
  local en resposta a la pres\u00e8ncia o abs\u00e8ncia d\u2019ocupants. L\u2019\u00e0rea
  coberta pels detectors pot variar entre 15 i 200 m\u00b2.\\n\\nPer realitzar aquest
  tipus de regulaci\u00f3, cal partir d\u2019una instal\u00b7laci\u00f3 sectoritzada.\\n\\nDescripci\u00f3
  de la mesura\\nEs proposa instal\u00b7lar detectors de pres\u00e8ncia en els passadissos
  i en els vestidors del centre. Com que no es disposa de la informaci\u00f3 de detall
  sobre aquestes zones, s\u2019ha suposat un n\u00famero total de 8 detectors.\\n\\nJustificaci\u00f3
  de l\u2019estalvi\\nS\u2019estima que degut a la instal\u00b7laci\u00f3 de detectors
  de pres\u00e8ncia en els espais anteriorment descrits s\u2019assolir\u00e0 un estalvi
  al voltant del 30% degut a la reducci\u00f3 del nombre d\u2019hores en qu\u00e8
  l\u2019enllumenat es troba enc\u00e8s.\\n\\n| N\u00famero | Descripci\u00f3                                                                 |
  Estalvi energ\u00e8tic (kWh/any) | Percentatge estalvi (%) | Emissions CO\u2082
  (t/any) | Estalvi econ\u00f2mic (\u20ac/any) | Per\u00edode de retorn (anys) |\\n|--------|---------------------------------------------------------------------------|-----------------------------|-------------------------|-----------------------|--------------------------|-------------------------|\\n|
  1      | Substituci\u00f3 de FL convencionals per tubs LED                               |
  3.321                       | 2,6%                    | 2,58                  |
  432                      | 8,6                     |\\n| 2      | Substituci\u00f3
  de projectors hal\u00f2gens per focus LED                           | 33.696                      |
  26,8%                   | 26,20                 | 4.380                    | 0,8                     |\\n|
  3      | Instal\u00b7laci\u00f3 de detectors de pres\u00e8ncia                                     |
  1.661                       | 1,3%                    | 1,29                  |
  216                      | 3,7                     |\\n|        | TOTAL                                                                      |
  38.678                      | 30,8%                   | 30,07                 |
  5.028                    | 1,6                     |\"", "\"Acta de sessi\u00f3
  de la Comissi\u00f3 de M\u00e0ster Facultat de Filosofia i Lletres, Universitat
  Aut\u00f2noma de Barcelona\\n\\nDia: 26/10/2021\\n\\nLloc: A-502\\n\\nHora d''inici:
  15.00 h\\n\\nAssistents\\n\\nXavier Blanco, Josep A. Bonilla, Montse Capdevila (Presidenta),
  Eva Cod\u00f3, Rafael Cornudella, Oriol Farr\u00e9s, Jordi Figuerola, Germ\u00e1n
  Gan, Jordi Juli\u00e0, N\u00faria Lleonart, Juan Antonio M\u00f3denes, Jordi Nadal,
  Albert P\u00e8lachs, Dolors Poch, Josep Pujol\\n\\nS''excusen\\n\\nRossend Arqu\u00e9s,
  Josep Cervell\u00f3, Teresa Tapada\\n\\n1. Aprovaci\u00f3, si escau, de l''acta
  de la Comissi\u00f3 de M\u00e0ster anterior\\n\\nS''aprova per assentiment l''acta
  de la Comissi\u00f3 de M\u00e0ster anterior.\\n\\n2. Aprovaci\u00f3, si escau, de
  les modificacions seg\u00fcents:\\n\\n* S''incorpora una compet\u00e8ncia transversal
  de g\u00e8nere en el MU en An\u00e0lisi i Gesti\u00f3 del Patrimoni Art\u00edstic,
  MU en Franc\u00e8s Llengua Estrangera i Diversitat Ling\u00fc\u00edstica, MU en
  Llengua Espanyola, Literatura Hisp\u00e0nica i Espanyol com a Llengua Estrangera
  i MU en Estudis Avan\u00e7ats de Llengua i Literatura Catalanes.\\n* Canvi en el
  pes dels sistemes d''avaluaci\u00f3 del m\u00f2dul 1: Patrimoni Art\u00edstic: Vies
  d''Estudis i T\u00e8cniques d''An\u00e0lisi del MU en An\u00e0lisi i Gesti\u00f3
  del Patrimoni Art\u00edstic\\n* Es recodifiquen les sigles alfab\u00e8tiques inicials
  de les compet\u00e8ncies b\u00e0siques i de les compet\u00e8ncies generals/transversals
  en el MU en Estudis Avan\u00e7ats de Llengua i Literatura Catalanes.\\n\\nS''aproven
  les modificacions per assentiment.\\n\\n3. Aprovaci\u00f3, si escau, de les modificacions
  del M\u00e0ster en Estudis Anglesos Avan\u00e7ats\\n\\n* Canvi de denominaci\u00f3
  del m\u00f2dul optatiu M4.6 \\\"Post-colonialism: Desire and the Other \\\" per
  \\\"Transnational Literatures and Cultures\\\".\\n* Adaptaci\u00f3 de les definicions
  dels resultats d''aprenentatge incorporant el concepte \\\"transnacional\\\" a la
  definici\u00f3 dels resultats.\\n* Millora de la normativa de composici\u00f3 dels
  tribunals d''avaluaci\u00f3 del TFM i els percentatges d''avaluaci\u00f3, a trav\u00e9s
  de l''elaboraci\u00f3 d''un protocol de M\u00e0ster per part de deganat.\\n\\nS''aproven
  les modificacions per assentiment.\\n\\n4. Informacions diverses del vicedeganat\\n\\nLa
  vicedegana informa que a partir del proper dia 2 de novembre podrem penjar i compartir
  documents a trav\u00e9s de Teams.\\nL''Equip de deganat est\u00e0 treballant en
  l''elaboraci\u00f3 d''un protocol de TFM dins les accions de millora del proc\u00e9s
  PC3b de gesti\u00f3 dels TFM.\\nLa vicedegana informa de les properes fires virtuals
  de promoci\u00f3 dels m\u00e0sters i postgraus. La 1a fira virtual tindr\u00e0 lloc
  del 21 al 25 de febrer. La 2a fira virtual al mes de maig i la tercera al mes de
  setembre.\\nLa vicedegana informa que es portar\u00e0 a terme una revisi\u00f3 de
  les fitxes web, les coordinacions rebran un missatge demanant que es revisin.\\nLa
  vicedegana informa sobre la possibilitat de pagar una prematr\u00edcula per tal
  de fidelitzar els alumnes. Jos\u00e9 Bonilla explica els avantatges i com seria
  el procediment. Els m\u00e0sters interessants en aplicar aquesta opci\u00f3 s\u00f3n:
  el MU en Literatura Comparada i Estudis Literaris i Culturals, el MU en Geoinformaci\u00f3
  i el MU en Estudis Territorials i Planejament.\\n\\n5. Torn obert de paraules\\n\\nNo
  hi ha paraules\\n\\nEs tanca la sessi\u00f3 a les 17.00 h.\\n\\nMONTSERRAT CAPDEVILA
  BATET - DNI 43627440M\\n\\nFirmado digitalmente por MONTSERRAT CAPDEVILA BATET DNI
  43627440M Fecha: 2022.05.05 09:29:05 +02''00''\\n\\nVicedegana d''Afers Acad\u00e8mics
  d`Estudis de Postgrau\"", "\"Poesia Esc\u00e9nica. Joan Brossa (teatre, 1973-1983,
  Barcelona)\\n\\nPoesia Esc\u00e8nica \u00e9s el conjunt de l''obra teatral de Joan
  Brossa, publicada en sis volums per Edicions 62 entre l''any 1973 i el 1983. L''estudi
  de Xavier F\u00e0bregas que prologava el primer volum fou una aportaci\u00f3 decisiva
  al coneixement de la poesia esc\u00e8nica del poeta.  El  conjunt de llibres teatrals
  brossians s\u00f3n una aut\u00e8ntica obra completa, a difer\u00e8ncia de Poesia
  Rasa i altres volums antol\u00f2gics de poesia liter\u00e0ria, publicats en la mateixa
  \u00e8poca. La voluntat del poeta fou la de tenir-ho tot aplegat, a fi de facilitar
  el coneixement de la seva obra al p\u00fablic i directors teatrals, despr\u00e9s
  d''haver finalitzat la seva producci\u00f3 esc\u00e8nica el 1978. En conjunt, la
  poesia esc\u00e8nica brossiana es caracteritza pel trencament de convencions i g\u00e8neres,
  a fi de trobar noves possiblitats po\u00e8tiques a l''acci\u00f3. El primer volum
  de la s\u00e8rie aplega obres escrites entre 1945 i 1954, la majoria de les quals
  experimenten amb el llenguatge. S\u00f3n peces d''un sol acte, sumament breus, com
  la paradigm\u00e0tica Sord-mut de 1947, que consisteix \u00fanicament en una pujada
  i baixada de tel\u00f3. En aquest volum, trobem tamb\u00e9 les primeres peces tem\u00e0tiques,
  m\u00e9s compromeses amb la realitat i de forma m\u00e9s tradicional (tres actes),
  com Cortina de muralles de 1951. D''altra banda tamb\u00e9 s''hi inclou el conjunt
  de ballets Normes de mascarada de 1948-50, on el poeta trenca amb el g\u00e8nere
  del ballet, amb accions sorprenents. El segon volum cont\u00e9 b\u00e0sicament obres
  tem\u00e0tiques i llargues escrites entre 1955 i 1958. El tercer aplega obres entre
  1958 i 1962, la majoria dins la l\u00ednia tem\u00e0tica de den\u00fancia pol\u00edticosocial
  (com Or i sal de 1959, estrenada el 1961). Tamb\u00e9 hi inclou, per\u00f2, el conjunt
  d''accions espectacle anomenat Postteatre. El quart volum recull onze peces de 1962
  a 1964, \u00e8poca molt prol\u00edfica per a l''autor, en qu\u00e8 diversifica les
  formes, segueix amb la cr\u00edtica social i introdueix un cert costumisme, com
  a El sarau o a Cal\u00e7 i rajoles de 1963,. El cinqu\u00e8 volum compr\u00e8n algunes
  obres tem\u00e0tiques de 1964 i 1965, entre les quals sobresurt Diumenge, i un conjunt
  de ballets i accions espectacle, Troupe. Finalment, el sis\u00e8 volum \u00e9s un
  compendi de peces de g\u00e8neres parateatrals: mon\u00f2legs de transformaci\u00f3,
  strip-teases, teatre irregular i accions musicals. Aquesta part del teatre brossi\u00e0,
  rupturista i capdavantera en el seu temps, fou paral\u00b7lela a la seva poesia
  m\u00e9s sint\u00e8tica i visual i reb\u00e9 el suport del p\u00fablic durant els
  anys setanta, la qual cosa amag\u00e0 l''altra faceta del poeta esc\u00e8nic, no
  descoberta pel gran p\u00fablic fins als anys vuitanta i noranta.\\n\\nBibliografia\\n\\nBORDONS,Gl\u00f2ria
  (1999). Pr\u00f2leg a Joan Brossa, Cal\u00e7 i rajoles. Barcelona: Edicions 62.\\n\\nCOCA,
  Jordi (1992) Joan Brossa. Oblidar i caminar. Barcelona: Edicions de la Magrana (L''Esparver
  Llegir, n\u00fam.42).\\n\\nEstudios Esc\u00e9nicos (Cuadernos del Instituto del
  Teatro) n\u00fam.16 (desembre 1972)\\n\\nF\u00c0BREGAS, Xavier (1973).\\\"Joan Brossa
  en terra de meravelles\\\", introducci\u00f3 a Joan Brossa, Poesia esc\u00e8nica
  (1945-1954),volum 1, Barcelona: Edicions 62.\\n\\nF\u00c0BREGAS, Xavier (1977) \\\"El
  teatre i la segona funci\u00f3 del llenguatge\\\", Els Marges, 9, p\u00e0gs. 97-105.\\n\\nMAL\u00c9,
  Jordi (1997). \\\"Algunes consideracions sobre el llenguatge d''Or i Sal, de Joan
  Brossa\\\", Els Marges n\u00fam.59.\\n\\nPausa (Revista de la Sala Beckett) n\u00fam.12
  (juny 1992).\\n\\nPLANAS, Eduard (1996). Pr\u00f2leg a Teatre de Joan Brossa, L''Alf\u00e0s
  del Pi: Edicions Pedra de Toc.\\n\\nPUIG, Arnau. (1963). \\\"Els fonaments i l''obra
  teatral actual de Joan Brossa\\\", pr\u00f2leg a Joan Brossa, Or i Sal, Barcelona:
  Quaderns de Teatre de l''ADB, 1963.\\n\\nGl\u00f2ria Bordons\"", "\"PREUS P\u00daBLICS
  CURS 2023 \u2013 2024\\n\\nAprovats pel Ple de l''Ajuntament de 10 de maig de 2019.  Preus
  prorrogats curs 2023-2024\\n\\nNOVETAT\\n\\nPer als infants nascuts l''any 2021,
  el Departament d''Educaci\u00f3 de la Generalitat de Catalunya finan\u00e7a la part
  del cost del servei escolar que han de satisfer les fam\u00edlies.\\n\\nAquest servei
  de 5 hores inclou la franja hor\u00e0ria de 9:00 h a 12:30 h i de 15:00 h a 16:30
  h\\n\\nNo hi ha quota de servei escolar per a les fam\u00edlies dels infants nascuts
  l''any 2021.\\n\\nEls serveis complementaris de menjador, acollida i el servei de
  vacances s\u00f3n opcionals; per fer-ne \u00fas les fam\u00edlies hauran d''abonar
  el preu p\u00fablic corresponent.\\n\\nSERVEI D''ACOLLIDA\\n\\nS''ofereix en franges
  de 30 minuts.\\n\\nAcollides de 8.00 a 9.00 h; de 12.30 a 13.00 i de 16.30 a 17.30
  h.\\n\\nLa franja de 17.00 a 17.30 h, s''obre amb un m\u00ednim de 8 sol\u00b7licituds
  i s''haur\u00e0 de mantenir al llarg de tot el curs\\n\\nAcollida fixa 30min/dia  23,80
  \u20ac quota mensual // Acollida espor\u00e0dica 30 minuts 3,65 \u20ac\\n\\nSERVEI
  DE VACANCES\\n\\nPer obrir el servei a una escola cal un m\u00ednim de 24 inscripcions
  confirmades.\\n\\nEls dies del servei poden variar en funci\u00f3 del calendari
  escolar.\"", "\"Av. dels Pa\u00efsos Catalans, 86 - 17.800 OLOT (Girona)\\n\\nTel.
  972 26 18 00\\n\\nfirstname.lastname@example.org\\n\\nDOCUMENT DEL CONSENTIMENT
  INFORMAT\\n\\nTRACTAMENT QUIR\u00daRGIC DE LESIONS MALIGNES O SOSPITOSES DE MALIGNITAT
  EN GLOBUS OCULAR I ANNEXOS\\n\\n...................................................................................
  N\u00fam. HC.......................... (nom i cognoms del pacient) de...................anys,
  amb DNI n\u00fam. ............................ i domicili a...............................
  .........................................................................................................................
  .................................................................................................
  de ............ anys, (nom i cognoms del representant legal, familiar o persona
  vinculada de fet) amb domicili a ...............................................................
  i DNI n\u00fam. ......................... en qualitat de ...........................................de
  ........................................................ (representant legal, familiar
  o propparent) (nom i cognoms del / de la pacient)\\n\\nDECLARO\\n\\nQue el doctor/a
  .............................................................................. m\u2019ha
  explicat que (Nom i dos cognoms del facultatiu que facilita la informaci\u00f3)
  \u00e9s necessari/convenient en la meva situaci\u00f3 intervenir de LESI\u00d3 MALIGNA
  O SOSPITOSA DE MALIGNITAT EN GLOBUS OCULAR I ANNEXOS.\\n\\nDESCRIPCI\u00d3 DEL PROCEDIMENT
  DE LA INTERVENCI\u00d3\\n\\nAl globus ocular i/o teixits perioculars poden apar\u00e8ixer
  tumors amb malignitat potencial, que poden suposar la p\u00e8rdua de l''ull o de
  la seva funci\u00f3, escampar-se cap a altres \u00f2rgans del cos o acabar amb la
  vida del pacient.\\n\\nAlguns dels possibles tumors que podem trobar: retinoblastoma
  (\u00e9s un tumor maligne que apareix en nadons, que es desenvolupa a partir de
  la retina; en ocasions es comprova que el nad\u00f3 en n\u00e9ixer t\u00e9 una pupil\u00b7la
  blanca, o tamb\u00e9 es pot trobar en una revisi\u00f3 rutin\u00e0ria o per estrabisme),
  melanoma (tumor que pot apar\u00e8ixer a la superf\u00edcie de l''ull o en el seu
  interior; es pot desenvolupar a partir d''un nevus o taca mel\u00e0nica ja existent,
  encara que tamb\u00e9 pot apar\u00e8ixer sense cap lesi\u00f3 pr\u00e8via; pot ser
  en la conjuntiva, iris o coroide).\\n\\nAmbd\u00f3s tumors poden requerir enucleaci\u00f3
  del globus ocular i en el melanoma. Fins i tot pot ser necessari procedir a l''exenteraci\u00f3
  orbit\u00e0ria. Alguns casos es poden tractar amb criocoagulador, fotocoagulaci\u00f3
  l\u00e0ser, col\u00b7locaci\u00f3 de plaques radioactives (braquiter\u00e0pia),
  radioter\u00e0pia, quimioter\u00e0pia...\\n\\nAquestes operacions es realitzen habitualment
  amb anest\u00e8sia general, encara que en ocasions poden ser realitzades amb anest\u00e8sia
  local.\\n\\nOBJECTIUS DE LA INTERVENCI\u00d3\\n\\nConservar la vida i evitar la
  progressi\u00f3 en cas de tumors malignes.\\n\\nEn casos favorables es pot aturar
  l''avan\u00e7 tumoral, encara que en general es necessitar\u00e0 el treball conjunt
  de diversos especialistes, per les mesures complement\u00e0ries que requereix habitualment
  el tractament.\\n\\nRISCOS, MOL\u00c8STIES I EFECTES SECUNDARIS\\n\\n[x] Riscos
  generals:\\n[x] Aturada cardiorespirat\u00f2ria pel mateix procediment o per l''anest\u00e8sia.
  \u00c9s el m\u00e9s greu.\\n[x] Hemorr\u00e0gies i infeccions.\\n[x] Malaltia de
  transmissi\u00f3 sangu\u00ednia no detectable per les t\u00e8cniques utilitzades
  actualment, en cas que sorgeixi la necessitat de realitzar una transfusi\u00f3 sangu\u00ednia
  o d''administrar hemoderivats.\\n[x] Riscos espec\u00edfics:\\n\\nDolor i mol\u00e8sties
  en la zona, tant per l''efecte del mateix proc\u00e9s com de les sutures que normalment
  s\u00f3n necess\u00e0ries i han de ser mantingudes durant dies o setmanes segons
  les estructures afectades.\\n\\nInfeccions, opacitats de cristal\u00b7l\u00ed (quan
  s''intenta tractament conservador), reaparici\u00f3 del tumor que pot resoldre''s
  amb el tractament adequat o requereix una reintervenci\u00f3, cicatrius anormals
  i a vegades antiest\u00e8tiques, sagnat abundant durant o despr\u00e9s de la cirurgia,
  problemes de sequedat ocular i/o desprotecci\u00f3 de l''ull quan es tracta de tumors
  en els teixits perioculars, lesions en els teixits oculars per la radioter\u00e0pia
  i/o braquiter\u00e0pia i/o l\u00e0ser o pel bistur\u00ed el\u00e8ctric durant la
  intervenci\u00f3 quir\u00fargica.\\n\\nEl metge/la metgessa m''ha explicat que no
  existeix una alternativa terap\u00e8utica efica\u00e7 del meu cas.\\n\\nEl Servei
  d''Anest\u00e8sia informar\u00e0 el/la pacient dels riscos derivats de l''anest\u00e8sia.\\n\\nHe
  compr\u00e8s les explicacions, que han estat fetes amb un llenguatge clar i senzill.
  El metge/la metgessa que m''ha at\u00e8s m''ha deixat fer totes les observacions
  que he volgut i m''ha aclarit tots els dubtes que li he plantejat respecte a finalitats,
  alternatives, m\u00e8todes, avantatges, inconvenients i pron\u00f2stic, aix\u00ed
  com dels riscos i complicacions que per la meva situaci\u00f3 actual poden sorgir.\\n\\nTamb\u00e9
  comprenc que, en qualsevol moment i sense cap necessitat de donar explicacions,
  puc revocar el consentiment que ara atorgo. Per tot aix\u00f2, manifesto que estic
  satisfeta amb la informaci\u00f3 rebuda i que comprenc la indicaci\u00f3 i els riscos
  d''aquest proc\u00e9s.\\n\\nHe estat informada que les meves dades personals seran
  tractades per la Fundaci\u00f3 Hospital d''Olot i Comarcal de la Garrotxa com a
  responsable del tractament, amb la finalitat de recollir el meu consentiment informat
  sobre la base de l''article 6 de la Llei 21/2000. Les dades facilitades no se\\n\\nFundaci\u00f3
  Hospital d''Olot i Comarcal de la Garrotxa\\n\\nAv. dels Pa\u00efsos Catalans, 86
  - 17.800 OLOT (Girona)\\n\\nTel. 972 26 18 00\\n\\nemail@example.com\\n\\nAv. dels
  Pa\u00efsos Catalans, 86 - 17.800 OLOT (Girona)\\n\\nTel. 972 26 18 00\\n\\ncediran
  a cap tercer, excepte per obligaci\u00f3 legal. Conec, tamb\u00e9, que tinc dret
