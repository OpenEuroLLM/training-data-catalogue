sample: '["\"AUDICIONS \u00cdNTIMES\\n\\nAula de Castellar del Vall\u00e8s\\n\\nUna
  experi\u00e8ncia musical diferent.\\n\\nUna manera m\u00e9s intensa de viure la
  m\u00fasica.\\n\\nUn format creat i presentat per Xavier Chavarria Talarn\\n\\nDijous
  20 d''octubre de 2022, 18h:\\n\\nDumpy Lobsters\\n\\nJuli Aym\u00ed, clarinet \u00d2scar
  Font, tromb\u00f3 Artur Regada, contrabaix Xavier Algans, piano\\n\\nSomething Hangs
  c r  o t\\n\\nWhen You''re Smiling (L. Shay, M. Fisher, J. Goodwin)\\n\\nOne More
  Kiss Dear (Vangelis)\\n\\nI Can''t Give You Anything but Love (J. McHugh, D. Fields)\\n\\nBlues
  en Sol (Guillem d''Ef k\\n\\nFlat Foot Floogie (S. Gaillard, S. Stewart)\\n\\nSt.
  James Infirmary (Tradicional)\\n\\nExactly Like You (J. McHugh, D. Fields)\\n\\nra
  inan o  a c r  o t\\n\\nAll of Me (G. Marks, S. Simmons)\"", "\"ORDENAN\u00c7A FISCAL
  4 IMPOST SOBRE L''INCREMENT DEL VALOR DELS TERRENYS DE NATURALESA URBANA\\n\\n\u00cdNDEX\\n\\nDISPOSICI\u00d3
  FINAL.....................................................................................................................11\\n\\nARTICLE
  1 FET IMPOSABLE\\n\\n1. Constitueix el fet imposable de l''impost l''increment de
  valor que experimenten els terrenys de naturalesa urbana i que es manifesta a conseq\u00fc\u00e8ncia
  de la transmissi\u00f3 de la propietat per qualsevol t\u00edtol o de la constituci\u00f3
  o transmissi\u00f3 de qualsevol dret real de gaudi, limitatiu del domini, sobre
  els b\u00e9ns esmentats.\\n2. El t\u00edtol a qu\u00e8 es refereix l''apartat anterior
  podr\u00e0 consistir en:\\na) Negoci jur\u00eddic \\\"mortis causa\\\".\\nb) Declaraci\u00f3
  formal d''hereus \\\"ab intestato\\\".\\nc) Negoci jur\u00eddic \\\"inter vivos\\\",
  sia de car\u00e0cter oner\u00f3s o gratu\u00eft.\\nd) Alienaci\u00f3 en subhasta
  p\u00fablica.\\ne) Expropiaci\u00f3 for\u00e7osa.\\n\\nARTICLE 2 OBJECTE TRIBUTARI\\n\\nTindran
  la consideraci\u00f3 de terrenys de naturalesa urbana el s\u00f2l urb\u00e0, el
  susceptible d''urbanitzaci\u00f3, l''urbanitzable programat o urbanitzable no programat
  des del moment en qu\u00e8 s''aprovi un programa d''actuaci\u00f3 urban\u00edstica,
  els terrenys que disposin de vies pavimentades o en qu\u00e8 hagin posat vorades
  a les voreres i que comptin, a m\u00e9s, amb clavegueram, subministrament d''aigua,
  subministrament d''energia el\u00e8ctrica i enllumenat p\u00fablic i els que estiguin
  ocupats per construccions de naturalesa urbana.\\n\\nARTICLE 3 CASOS DE NO SUBJECCI\u00d3\\n\\nNo
  estan subjectes a aquest impost:\\n\\n1. Les aportacions de bens i drets realitzats
  pels c\u00f2njuges a la societat conjugal, les adjudicacions que a favor seu i en
  pagament d''aquestes es verifiquin i transmissions que es facin als c\u00f2njuges
  en pagament dels seus havers comuns.\\n2. Les transmissions de bens immobles entre
  c\u00f2njuges o a favor dels fills, com a conseq\u00fc\u00e8ncia del compliment
  de sent\u00e8ncies ens els casos de nul\u00b7litat, separaci\u00f3 o divorci matrimonial,
  sigui quin sigui el r\u00e8gim econ\u00f2mic matrimonial.\\n3. L''adjudicaci\u00f3
  de bens immobles per part de les societats cooperatives d''habitatges a favor dels
  seus socis cooperativistes.\\n4. Les transmissions de terrenys a que donin lloc
  les operacions distributives de beneficis i c\u00e0rregues per aportaci\u00f3 dels
  propietaris inclosos en l''actuaci\u00f3 de transformaci\u00f3 urban\u00edstica,
  i les adjudicacions en favor dels esmentats propietaris en proporci\u00f3 als terrenys
  aportats pels mateixos, en els termes de l''article 18 del Text Ref\u00f3s de la
  Llei del Sol, aprovat per Reial Decret Legislatiu 2/2008, de 20 de juny. No obstant
  ax\u00f3, si el valor de les parcel\u00b7les adjudicades a un propietari excedeix
  del que proporcionalment correspon als terrenys aportats pel mateix, l''exc\u00e9s
  d''adjudicaci\u00f3 si estar\u00e0 subjecte a aquest impost.\\n5. La retenci\u00f3
  o reserva del dret real d''usdefruit i els actes d''extinci\u00f3 de l''esmentat
  dret real, ja sigui per defunci\u00f3 de l''usufructuari o pel transcurs del termini
  pel que va ser constitu\u00eft.\\n6. Les transmissions de terrenys de naturalesa
  urbana derivades d''operacions a les quals resulti aplicable el r\u00e8gim especial
  de fusions, escissions, aportacions de branques d''activitat o aportacions no diner\u00e0ries
  especials, a excepci\u00f3 dels terrenys que s''aporti a l''empara del que preveu
  l''article 87 de la Llei 27/2014, de 27 de novembre, de l''Impost sobre Societats,
  quan no estiguin integrats en una branca d''activitat.\\n\\n7. Les transmissions
  de bens de naturalesa urbana derivades d''operacions de transmissions de negoci
  o d''actius o passius realitzades per entitats de cr\u00e8dit en compliment de plans
  de reestructuraci\u00f3 o plans de resoluci\u00f3 d''entitats de cr\u00e8dit a favor
  d''un altre entitat de cr\u00e8dit, a l''empara de la normativa de reestructuraci\u00f3
  banc\u00e0ria.\\n8. Les transmissions de terrenys de naturalesa urbana realitzades
  per una entitat de cr\u00e8dit a favor d''una societat per a la gesti\u00f3 d''actius,
  sempre i quan els esmentats immobles hagin estat adquirits per l''entitat de cr\u00e8dit
  en pagament de deutes relacionats amb el sol per a promoci\u00f3 immobili\u00e0ria
  i amb les construccions i promocions immobili\u00e0ries, a l''empara de la Llei
  8/2012, de 30 d''octubre, de sanejament i venda dels actius immobiliaris del sector
  financer.\\n9. Les aportacions o transmissions de bens immobles efectuades a la
  Societat de Gesti\u00f3 d''Actius Procedents de la Reestructuraci\u00f3 Banc\u00e0ria
  (SAREB) regulada a la disposici\u00f3 addicional setena de la Llei 9/2012, de 14
  de novembre, de reestructuraci\u00f3 i resoluci\u00f3 d''entitats de cr\u00e8dit.\\n10.
  Les aportacions o transmissions de bens immobles efectuades per la Societat de Gesti\u00f3
  d''Actius Procedents de la Reestructuraci\u00f3 Banc\u00e0ria (SAREB) a entitats
  participades directa o indirectament per dita Societat en al menys el 50 per cent
  del capital, fons propis, resultats o drets de vot de l''entitat participada en
  el moment immediatament anterior a la transmissi\u00f3, o com a conseq\u00fc\u00e8ncia
  de la mateixa.\\n11. Les aportacions o transmissions de bens immobles realitzades
  per la Societat de Gesti\u00f3 d''Actius Procedents de la Reestructuraci\u00f3 Banc\u00e0ria
  (SAREB), o per les entitats constitu\u00efdes per aquesta per a complir amb el seu
  objecte social, als fons d''actius bancaris (FAB), a que es refereix la disposici\u00f3
  addicional desena de la Llei 9/2012, de 14 de novembre, de reestructuraci\u00f3
  i resoluci\u00f3 d''entitats de cr\u00e8dit.\\n12. Les aportacions o transmissions
  de bens immobles realitzades entre els citats fons d''actius bancaris (FAB) durant
  el per\u00edode de temps de manteniment de l''exposici\u00f3 del Fons de Reestructuraci\u00f3
  Ordenada Banc\u00e0ria (FROB) als Fons, previst en l''apartat 10 de la disposici\u00f3
  addicional desena de la  Llei 9/2012, de 14 de novembre, de reestructuraci\u00f3
  i resoluci\u00f3 d''entitats de cr\u00e8dit.\\n13. Les transmissions de terrenys
  de naturalesa urbana que es realitzin com a conseq\u00fc\u00e8ncia de les operacions
  relatives als processos d''adscripci\u00f3 a una societat an\u00f2nima esportiva
  de nova creaci\u00f3, sempre que s''ajustin a les normes de la Llei 10/1990, de
  15 d''octubre, de l''esport i del Reial decret 1251/1999, de 16 de juliol, sobre
  societats an\u00f2nimes esportives.\\nEn la posterior transmissi\u00f3 dels terrenys
  esmentats, s''entendr\u00e0 que el nombre d''anys al llarg del quals s''ha posat
  de manifest l''increment de valor no s''ha interromput per causa de la transmissi\u00f3
  derivada de les operacions citades en els apartats anteriors.\\n14. L''adjudicaci\u00f3
  de la totalitat d''un be immoble a favor d''un dels copropietaris efectuada com
  a conseq\u00fc\u00e8ncia de la dissoluci\u00f3 d''una comunitat de bens constitu\u00efda
  sobre un immoble de naturalesa indivisible.\\n15. No es produir\u00e0 la subjecci\u00f3
  a l''impost en les transmissions oneroses de terrenys respecte de les quals el subjecte
  passiu acrediti la inexist\u00e8ncia d''increment de valor, tret que l''Administraci\u00f3
  pugui demostrar que s''ha produ\u00eft l''increment de valor.\\n\\nEl subjecte passiu
  haur\u00e0 de declarar la transmissi\u00f3 com a no subjecta, aix\u00ed com aportar
  les proves que acreditin la inexist\u00e8ncia d''increment de valor.\\n\\nARTICLE
  4 EXEMPCIONS OBJECTIVES\\n\\nEstaran exempts d''aquest impost els increments de
  valor que es manifestin com a conseq\u00fc\u00e8ncia dels actes seg\u00fcents:\\n\\n1.
  La constituci\u00f3 i la transmissi\u00f3 de drets de servitud.\\n2. Les transmissions
  de b\u00e9ns que es trobin dintre del per\u00edmetre delimitat com a conjunt hist\u00f2ric
  art\u00edstic o hagin estat declarats individualment d''inter\u00e8s cultural, segons
  el que disposa la Llei 16/1985, de 25 de juny, del patrimoni hist\u00f2ric espanyol,
  quan els seus propietaris o titulars de drets reals acreditin que han realitzat
  al seu c\u00e0rrec obres de conservaci\u00f3, millora o rehabilitaci\u00f3 en els
  immobles esmentats.\\n3. Els increments de valor que es manifestin com a conseq\u00fc\u00e8ncia
  de les transmissions realitzades per persones f\u00edsiques amb ocasi\u00f3 de la
  daci\u00f3 en pagament de l''habitatge habitual del deutor hipotecari o garant del
  mateix, per a la cancel\u00b7laci\u00f3 de deutes garantits amb hipoteca que recaigui
  aquest, contretes amb entitats de cr\u00e8dit o qualsevol altra entitat que, de
  manera professional, realitzi l''activitat de concessi\u00f3 de pr\u00e9stecs o
  cr\u00e8dits hipotecaris.\\n\\nAix\u00ed mateix, estan exempts d''aquest impost
  els increments de valor que es manifestin com a conseq\u00fc\u00e8ncia de les transmissions
  de l''habitatge habitual del deutor hipotecari realitzades en procediment d''execuci\u00f3
  hipotec\u00e0ria notarial o judicial, per a la cancel\u00b7laci\u00f3 de deutes
  garantits amb hipoteca que recaigui sobre aquest, contretes amb entitats de cr\u00e8dit
  o qualsevol altra entitat que, de manera professional, realitzi l''activitat de
  concessi\u00f3 de pr\u00e9stecs o cr\u00e8dits hipotecaris.\\n\\nA aquests efectes,
  es considera habitatge habitual la resid\u00e8ncia on hagi figurat empadronat el
  contribuent de forma ininterrompuda durant, almenys, els dos anys anteriors a la
  transmissi\u00f3 o des del moment de l''adquisici\u00f3 si l''esmentat termini fos
  inferior als dos anys.\\n\\nPer tenir dret a l''exempci\u00f3 \u00e9s necessari
  que el deutor o garant transmitent o qualsevol altre membre de la unitat familiar,
  no disposi en el moment de poder evitar la transmissi\u00f3 de l''habitatge, d''altres
  b\u00e9ns o drets, en quantia suficient per a satisfer la totalitat del deute hipotecari.
  Es presumir\u00e0 el compliment d''aquest requisit i malgrat aix\u00f2, si amb posterioritat
  es comprova el contrari, es procedir\u00e0 a girar la liquidaci\u00f3 tribut\u00e0ria
  corresponent.\\n\\nRespecte al concepte d''unitat familiar, caldr\u00e0 atenir-se
  al que disposa la Llei 35/2006, de 28 de novembre, de l''impost sobre las renda
  de els persones f\u00edsiques i de modificaci\u00f3 parcial de les lleis dels impostos
  sobre societats, sobre la renda dels no residents i sobre el patrimoni. A aquest
  efecte, s''equipara el matrimoni amb la parella de fet legalment inscrita.\\n\\nLa
  concurr\u00e8ncia dels requisits previstos anteriorment l''acreditar\u00e0 el subjecte
  passiu davant l''Ajuntament mitjan\u00e7ant la presentaci\u00f3 dels seg\u00fcents
  documents:\\n\\n- Certificat de rendes expedit per l''AEAT corresponent a l''exercici
  anterior a la transmissi\u00f3.\\n- Certificat negatiu de la presentaci\u00f3 de
  l''impost sobre patrimoni expedit per l''Ag\u00e8ncia Tribut\u00e0ria de Catalunya
  amb relaci\u00f3 als \u00faltims quatre exercicis tributaris.\\n- Certificat de
  titularitats expedit pel Registre de la Propietat.\\n- \u00daltimes tres n\u00f2mines
  percebudes.\\n\\n- Certificat expedit per l''entitat gestora de les prestacions,
  en qu\u00e8 figuri la quantia mensual percebuda en concepte de prestacions o subsidis
  per l''atur.\\n- Certificat acreditatiu dels salaris socials, rendes m\u00ednimes
  d''inserci\u00f3 o ajudes an\u00e0logues d''assist\u00e8ncia social concedides per
  la comunitat aut\u00f2noma i entitat local.\\n- En cas de treballador per compte
  propi, si estigu\u00e9s percebent la prestaci\u00f3 per cessament d''activitat,
  el certificat expedit per l''\u00f2rgan gestor en el qu\u00e8 figuri la quantia
  mensual percebuda.\\n- Llibre de fam\u00edlia o document acreditatiu de la inscripci\u00f3
  com a parella de fet.\\n- En el seu cas, declaraci\u00f3 judicial de discapacitat
  dels fills majors d''edat subjectes a la p\u00e0tria potestat prorrogada o rehabilitada.\\n-
  Certificats d''empadronament amb refer\u00e8ncia al moment de la transmissi\u00f3
  i als dos anys anteriors.\\n- Declaraci\u00f3 responsable del deutor relativa al
  compliment dels requisits per gaudir de la present exempci\u00f3.\\n\\nNo caldr\u00e0
  que l''interessat aporti aquella documentaci\u00f3 acreditativa d''aquest benefici
  fiscal quan l''administraci\u00f3 gestora del tribut pugui consultar i verificar
  telem\u00e0ticament les dades declarades i consti el consentiment de l''interessat
  per tal que es realitzi l''esmentada consulta.\\n\\nARTICLE 5 EXEMPCIONS SUBJECTIVES\\n\\nEstan
  exempts de l''impost els increments de valor quan l''obligaci\u00f3 de satisfer-lo
  recaigui sobre les seg\u00fcents persones o entitats:\\n\\n1. L''Estat, les comunitats
  aut\u00f2nomes i les entitats locals a qu\u00e8 pertanyi el municipi, aix\u00ed
  com els organismes aut\u00f2noms de l''Estat i les entitats de dret p\u00fablic
  de car\u00e0cter an\u00e0leg de les comunitats aut\u00f2nomes i de les esmentades
  entitats locals.\\n2. El municipi de Sant Joan Desp\u00ed i altres entitats locals
  integrades o en qu\u00e8 s''integri aquest municipi, aix\u00ed com les seves respectives
  entitats de dret p\u00fablic de car\u00e0cter an\u00e0leg als organismes aut\u00f2noms
  de l''Estat.\\n3. Les institucions que tinguin la qualificaci\u00f3 de ben\u00e8fiques
  o ben\u00e8fiques docents.\\n4. Les entitats gestores de la Seguretat Social i les
  mutualitats de previsi\u00f3 social regulades en la Llei 30/1995, de 8 de novembre,
  d''ordenaci\u00f3 i supervisi\u00f3 de les assegurances privades.\\n5. Els titulars
  de concessions administratives reversibles respecte dels terrenys afectes a aquestes.\\n6.
  La Creu Roja Espanyola.\\n7. Les persones o entitats a favor de les quals s''hagi
  reconegut l''exempci\u00f3 en tractats o convenis internacionals.\\n\\nARTICLE 6
  SUBJECTES PASSIUS\\n\\nTindran la condici\u00f3 de subjectes passius d''aquest impost:\\n\\n1.
  En les transmissions de terrenys o en la constituci\u00f3 o transmissi\u00f3 de
  drets reals de gaudi limitatius del domini, a t\u00edtol lucratiu, el qui adquireix
  el terreny o aquell en favor del qual es constitueixi o es transmeti el dret real
  de qu\u00e8 es tracti.\\n2. En les transmissions de terrenys o en la constituci\u00f3
  o transmissi\u00f3 de drets reals de gaudi limitatius del domini, a t\u00edtol oner\u00f3s,
  el qui transmet el terreny o la persona que constitueixi o transmeti el dret real
  de qu\u00e8 es tracti.\\n\\nARTICLE 7 BASE IMPOSABLE\\n\\n1. La base imposable d''aquest
  impost est\u00e0 constitu\u00efda per l''increment del valor dels terrenys, posat
  de manifest en el moment de l''acreditament i experimentat al llarg d''un termini
  m\u00e0xim de vint anys.\\n2. A l''efecte de determinar l''import de l''increment
  a qu\u00e8 es refereix l''apartat anterior, hom aplicar\u00e0 sobre el valor del
  terreny en el moment de l''acreditament, determinat conforme a les normes contingudes
  en els articles 9, 10, 11 i 12 de la present ordenan\u00e7a, el percentatge que
  correspongui en funci\u00f3 del nombre d''anys durant els quals s''hagu\u00e9s generat
  aquest increment.\\n3. El percentatge esmentat al punt anterior ser\u00e0 el que
  resulti de multiplicar el nombre d''anys abans esmentat pel percentatge anual corresponent
  que ser\u00e0:\\na) pels increments de valor generats en un per\u00edode de temps
  compr\u00e8s entre 1 i 5 anys el 2,8.\\nb) pels increments de valor generats en
  un per\u00edode de temps de fins a 10 anys el 2,6.\\nc) pels increments de valor
  generats en un per\u00edode de temps de fins a 15 anys el 2,5.\\nd) pels increments
  de valor generats en un per\u00edode de temps de fins a 20 anys el 2,4.\\n\\nARTICLE
  8 TERMINI IMPOSITIU\\n\\nA l''efecte de determinar el per\u00edode de temps en qu\u00e8
  es generi l''increment del valor, hom prendr\u00e0 nom\u00e9s els anys complets
  transcorreguts entre la data de l''anterior adquisici\u00f3 del terreny de qu\u00e8
  es tracti o de la constituci\u00f3 o transmissi\u00f3 igualment anterior d''un dret
  real de gaudi limitatiu del domini sobre aquest i la producci\u00f3 del fet imposable
  d''aquest impost, sense tenir en consideraci\u00f3 les fraccions d''any.\\n\\nEl
  per\u00edode de generaci\u00f3 no podr\u00e0 ser inferior a un any en cap cas.\\n\\nARTICLE
  9 VALOR DELS TERRENYS\\n\\n1. En les transmissions de terrenys, el valor dels mateixos
  en el moment del meritament ser\u00e0 el que tinguin determinat en aquest moment
  als efectes de l''impost sobre b\u00e9ns immobles.\\n2. Quan aquest valor sigui
  conseq\u00fc\u00e8ncia d''una pon\u00e8ncia de valors que no reflecteixi modificacions
  de planejament aprovades amb posterioritat a l''aprovaci\u00f3 de l''esmentada pon\u00e8ncia,
  es podr\u00e0 liquidar provisionalment aquest impost d''acord amb el mateix. En
  aquests casos, en la liquidaci\u00f3 definitiva s''aplicar\u00e0 el valor dels terrenys
  un cop s''hagi obtingut conforme als procediments de valoraci\u00f3 col\u00b7lectiva
  que s''instrueixin, referit a la data del meritament. Quan aquesta data no coincideixi
  amb la d''efectivitat dels nous valors cadastrals, aquests es corregiran aplicant
  els coeficients d''actualitzaci\u00f3 que corresponguin, establerts a aquest efecte
  en les lleis de pressupostos generals de l''Estat.\\n\\n3. Quan el terreny, malgrat
  ser de naturalesa urbana o integrat en un b\u00e9 immoble de caracter\u00edstiques
  especials, en el moment de meritament de l''impost no tingui determinat valor cadastral
  en el moment esmentat, l''Ajuntament podr\u00e0 practicar la liquidaci\u00f3 quan
  l''esmentat valor cadastral sigui determinat, referint aquest valor al moment del
  meritament.\\n\\nARTICLE 10 DRETS DE GAUDI\\n\\nEn la constituci\u00f3 i transmissi\u00f3
  de drets reals de gaudi, limitatius del domini, sobre terrenys de naturalesa urbana,
  el percentatge corresponent s''aplicar\u00e0 sobre la part del valor definit en
  l''article anterior que representi, quant al mateix, el valor dels drets esmentats,
  calculat segons les regles seg\u00fcents:\\n\\na. En el cas de constituir-se un
  dret d''usdefruit temporal, el seu valor equivaldr\u00e0 a un 2 per cent del valor
  cadastral del terreny per cada any de la seva durada, i no pot excedir del 70 per
  cent d''aquest valor cadastral.\\nb. Si l''usdefruit fos vitalici, el seu valor,
  en el cas que l''usufructuari tingu\u00e9s menys de vint anys, ser\u00e0 equivalent
  al 70 per cent del valor cadastral del terreny, i aquesta quantitat minorar\u00e0
  en un 1 per cent per cada any que passi d''aquesta edat, fins al l\u00edmit m\u00ednim
  del 10 per cent del valor cadastral esmentat.\\nc. Si l''usdefruit s''estableix
  a favor d''una persona jur\u00eddica per un termini indefinit o superior a trenta
  anys, es  considerar\u00e0 com una transmissi\u00f3 de la propietat plena del terreny
  subjecta a condici\u00f3 resolut\u00f2ria, i el seu valor equivaldr\u00e0 al 100
  per cent del valor cadastral del terreny usufructuat.\\nd. Quan es transmeti un
  dret d''usdefruit que ja existeix, els percentatges expressats en les lletres a),
  b) i c) anteriors s''aplicaran sobre el valor cadastral del terreny al temps d''aquesta
  transmissi\u00f3.\\ne. Quan es transmeti el dret de nua propietat, el seu valor
  ser\u00e0 igual a la difer\u00e8ncia entre el valor cadastral del terreny i el valor
  de l''usdefruit, calculat segons les regles anteriors.\\nf. El valor dels drets
  d''\u00fas i habitaci\u00f3 ser\u00e0 el que resulti d''aplicar al 75 per cent del
  valor cadastral dels terrenys sobre els que es constitueixin aquests drets, les
  regles corresponents a la valoraci\u00f3 dels usdefruits temporals o vitalicis,
  segons els casos.\\ng. En la constituci\u00f3 o la transmissi\u00f3 de qualssevol
  altres drets reals de gaudi limitatius del domini, diferents dels que estan enumerats
  en les lletres a, b), c), d), i f) d''aquest article i en el seg\u00fcent, es considerar\u00e0
  com el seu valor, a l''efecte d''aquest impost:\\n1. El capital, preu o valor pactat
  quan es constitueixen, si era igual o major que el resultat de la capitalitzaci\u00f3
  a l''inter\u00e8s b\u00e0sic del Banc d''Espanya de la seva renda o pensi\u00f3
  anual.\\n2. Aquest darrer, si aquell fos menor.\\n\\nARTICLE 11 DRETS DE VOL I DE
  SUBS\u00d2L\\n\\nEn la constituci\u00f3 o la transmissi\u00f3 del dret a elevar
  una o m\u00e9s plantes sobre un edifici o terreny o del dret a realitzar la construcci\u00f3
  sota terra sense que impliqui l''exist\u00e8ncia d''un dret real de superf\u00edcie,
  el percentatge corresponent s''aplicar\u00e0 sobre la part del valor cadastral que
  representi, en relaci\u00f3 al mateix, el m\u00f2dul de proporcionalitat fixat en
  l''escriptura de transmissi\u00f3 o, en el seu defecte, el que resulti d''establir
  la proporci\u00f3 entre la superf\u00edcie o el volum de les plantes que s''han
  de construir en al\u00e7ada o en subs\u00f2l i la superf\u00edcie total o el volum
  edificats una vegada que aquelles s''han constru\u00eft.\\n\\nARTICLE 12 CASOS D''EXPROPIACI\u00d3
  FOR\u00c7OSA\\n\\nEn els sup\u00f2sits d''expropiaci\u00f3 for\u00e7osa, el percentatge
  corresponent s''aplicar\u00e0 sobre la part del preu just que correspongui al valor
  del terreny.\\n\\nARTICLE 13 QUOTA TRIBUT\u00c0RIA\\n\\nLa quota d''aquest impost
  ser\u00e0 la que resulti d''aplicar a la base imposable el tipus impositiu de VINT-I-VUIT
  PER CENT (28%).\\n\\nARTICLE 14 BONIFICACIONS EN LA QUOTA\\n\\n1. Gaudiran d''una
  bonificaci\u00f3 de fins al 99 per cent les quotes que s''acreditin en les transmissions
  que es realitzin amb les operacions de fusi\u00f3 o escissi\u00f3 d''empreses a
  qu\u00e8 es refereix la Llei 76/1980, de 26 de desembre, sempre que aix\u00ed ho
  acordi l''Ajuntament.\\n\\nSi els b\u00e9ns la transmissi\u00f3 dels quals va donar
  lloc a la bonificaci\u00f3 esmentada, fossin alienats dintre dels cinc anys seg\u00fcents
  a la data de la fusi\u00f3 o escissi\u00f3, l''import d''aquesta bonificaci\u00f3
  s''haur\u00e0 de pagar a l''Ajuntament corresponent, i aix\u00f2 sense perjudici
  del pagament de l''impost que s''hagi de pagar per l''esmentada alienaci\u00f3.\\n\\nAquesta
  obligaci\u00f3 recaur\u00e0 sobre la persona o entitat que va adquirir els b\u00e9ns
  a conseq\u00fc\u00e8ncia de l''operaci\u00f3 de fusi\u00f3 o escissi\u00f3.\\n\\n2.
  En les transmissions a t\u00edtol lucratiu per causa de mort, els subjectes passius
  que tot seguit s''especifica tindran la bonificaci\u00f3 sobre la quota que s''hi
  detalla, sempre que l''objecte tributari sigui el seu habitatge habitual o b\u00e9
  es tracti de locals afectes a activitats empresarials o professionals exercides
  a t\u00edtol individual:\\n\\na/ C\u00f2njuge ......... ...............................................95%\\n\\nb/
  Descendents i adoptats .................................95%\\n\\nc/ Ascendents i
  adoptants .................................95%\\n\\nd/ C\u00f2njuge, descendents
  i adoptats, i ascendents i adoptant, discapacitats f\u00edsics, en grau igual o
  superior al 33% segons el barem de la disposici\u00f3 addicional segona de la Llei
  26/1990, de 20 de desembre, per la qual s\u2019estableixen en la Seguretat Social
  prestacions no contributives ....................... .......95%\\n\\ne/ C\u00f2njuge,
  descendents i adoptats i ascendents i adoptant discapacitats ps\u00edquics en tots
  els seus graus.............................................. 95%\\n\\nLes parelles
  de fet degudament inscrites al Registre corresponent o que hagin atorgat escriptura
  p\u00fablica, segons preveu la Llei 10/1998, de 15 de juliol, reguladora d''unions
  estables de parelles, tindran la mateixa consideraci\u00f3 que els c\u00f2njuges.\\n\\nLa
  bonificaci\u00f3 ha de ser sol\u00b7licitada pel subjecte passiu i es concedir\u00e0
  de forma expressa.\\n\\nEls interessats acreditaran documentalment, junt amb la
  sol\u00b7licitud, la condici\u00f3 que l''objecte tributari \u00e9s el seu habitatge
  habitual i que hi figuraven empadronats, abans de la mort del transmetent, aix\u00ed
  com el compliment de les altres condicions, segons el cas.\\n\\nEn cas que, una
  vegada atorgada aquesta bonificaci\u00f3, l''adquirent faci transmissi\u00f3 de
  l''objecte tributari, o aquest deixi de ser la seva resid\u00e8ncia habitual, o
  es deixi d''exercir l''activitat econ\u00f2mica a qu\u00e8 estava afecte l''objecte
  tributari, dins el termini de 10 anys, comptadors des de la mort del transmetent,
  haur\u00e0 de satisfer a l''Ajuntament l''import de la bonificaci\u00f3 concedida,
  llevat que mor\u00eds l''adquirent dins aquest termini.\\n\\nL''habitatge no perd
  el car\u00e0cter d''habitual a l''efecte d''aquesta bonificaci\u00f3, quan la baixa
  en el padr\u00f3 hagi estat motivada per causes de salut del causant suficientment
  acreditades.\\n\\nARTICLE 15 ACREDITAMENT\\n\\n1. L''impost s''acredita:\\n\\na)
  Quan es transmeti la propietat del terreny, sia a t\u00edtol oner\u00f3s o gratu\u00eft,
  entre vius o per causa de mort, en la data de la transmissi\u00f3.\\nb) Quan es
  constitueixi o es transmeti qualsevol dret real de gaudi limitatiu del domini, en
  la data en qu\u00e8 tingui lloc la constituci\u00f3 o la transmissi\u00f3.\\n2.
  A l''efecte del que es disposa en l''apartat anterior, es considerar\u00e0 com a
  data de la transmissi\u00f3:\\na) En els actes o els contractes entre vius, la de
  l''atorgament del document p\u00fablic i, quan es tracti de documents privats, la
  de la seva incorporaci\u00f3 o inscripci\u00f3 en un registre p\u00fablic o la del
  seu lliurament a un funcionari p\u00fablic per ra\u00f3 del seu ofici.\\nb) En les
  transmissions per causa de mort, la de la defunci\u00f3 de causant.\\n\\nARTICLE
  16 DEVOLUCI\u00d3 DEL DEUTE\\n\\n1. Quan es declari o es reconegui judicialment
  o administrativament que ha tingut lloc la nul\u00b7litat, la rescissi\u00f3 o la
  resoluci\u00f3 de l''acte o el contracte determinant de la transmissi\u00f3 del
  terreny o de la constituci\u00f3 o transmissi\u00f3 del dret real de gaudi sobre
  aquest, el subjecte passiu tindr\u00e0 dret a la devoluci\u00f3 de l''impost pagat,
  sempre que aquest acte o contracte no li hagu\u00e9s produ\u00eft efectes lucratius
  i que reclami la devoluci\u00f3 en el termini de cinc anys des que la resoluci\u00f3
  va ser ferma, entenent-se que hi ha efecte lucratiu quan no es justifiqui que els
  interessats hagin d''efectuar les devolucions rec\u00edproques a qu\u00e8 es refereix
  l''article 1.295 del Codi Civil. Encara que l''acte o el contracte no hagin produ\u00eft
  efectes lucratius, si la rescissi\u00f3 o la resoluci\u00f3 es declarava per incompliment
  de les obligacions del subjecte passiu de l''impost, no hi haur\u00e0 lloc per a
  cap devoluci\u00f3.\\n2. Si el contracte queda sense efecte per acord mutu de les
  parts contractants no s''escaur\u00e0 la devoluci\u00f3 de l''impost pagat i es
  considerar\u00e0 com un acte nou sotm\u00e8s a tributaci\u00f3. Com a tal mutu acord,
  s''estimar\u00e0 l''avinen\u00e7a en acte de conciliaci\u00f3 i assentiment de la
  demanda.\\n3. En els actes o els contractes entre els quals hi hagi alguna condici\u00f3,
  la seva qualificaci\u00f3 es far\u00e0 d''acord amb les prescripcions contingudes
  en el Codi Civil. Si fos suspensiva, l''impost no es liquidar\u00e0 fins que aquesta
  no es compleixi. Si la condici\u00f3 fos resolut\u00f2ria, no cal dir que l''impost
  s''exigir\u00e0, a reserva, quan la condici\u00f3 es compleixi, en el cas de fer-se
  la devoluci\u00f3 oportuna, segons la regla de l''apartat 1 anterior.\\n\\nARTICLE
  17 OBLIGACIONS MATERIALS I FORMALS DEL SUBJECTE PASSIU\\n\\n1. Modalitats:\\n\\na)
  Els subjectes passius estaran obligats a presentar davant d''aquest Ajuntament una
  declaraci\u00f3 segons el model que aquest ha determinat, on es contindran els elements
  de la relaci\u00f3 tribut\u00e0ria imprescindibles per practicar la liquidaci\u00f3
  corresponent.\\nb) Autoliquidaci\u00f3: Els subjectes passius per aquest impost
  hauran de practicar autoliquidaci\u00f3 de la quota conforme al model oficial que
  facilitar\u00e0 l''Administraci\u00f3 municipal. Aquesta\\n\\n9\\n\\nautoliquidaci\u00f3
  del tribut tindr\u00e0 car\u00e0cter provisional subjecte a comprovaci\u00f3, i
  la quantitat que en resulti s''ingressar\u00e0 a les arques municipals en el moment
  de presentar la documentaci\u00f3 a qu\u00e8 es fa refer\u00e8ncia.\\n\\nEls \u00f2rgans
  gestors comprovaran que l''autoliquidaci\u00f3 s''hagi efectuat mitjan\u00e7ant
  l''aplicaci\u00f3 correcta de les normes reguladores de l''impost i, per tant, que
  els valors atribu\u00efts i les bases i quites obtingudes son les resultants d''aquestes
  normes, sense perjudici de les facultats de comprovaci\u00f3 previstes a la Llei
  General tributaria, i en especial pel que es refereix als valors declarats pel subjecte
  passiu als efectes del que es preveu a l''apartat 15 de l''article 3 d''aquesta
  ordenan\u00e7a.\\n\\n2. Aquesta declaraci\u00f3 haur\u00e0 de ser presentada en
  els seg\u00fcents terminis, des de la data en qu\u00e8 es produeixi l''acreditament
  de l''impost:\\na) Quan es tracti d''actes \\\"inter vius\\\", el termini ser\u00e0
  de trenta dies h\u00e0bils.\\nb) Quan es tracti d''actes per causa de mort, el termini
  ser\u00e0 de sis mesos prorrogables fins a un any a sol\u00b7licitud del subjecte
  passiu.\\n3. A la declaraci\u00f3 s''adjuntaran els documents on constin els actes
  o els contractes que originen la imposici\u00f3.\\n\\nARTICLE 18 LIQUIDACIONS\\n\\nLes
  liquidacions de l''impost es notificaran \u00edntegrament als subjectes passius,
  indicant el termini d''ingr\u00e9s i els recursos corresponents.\\n\\nARTICLE 19
  ALTRES OBLIGATS\\n\\nIndependentment del que es disposa en l''apartat primer de
  l''article 17, tamb\u00e9 estan obligats a comunicar a l''Ajuntament la realitzaci\u00f3
  del fet imposable en els mateixos terminis que els subjectes passius:\\n\\na) En
  els sup\u00f2sits previstos a la lletra a) de l''article 6\u00e8 d''aquesta Ordenan\u00e7a,
  sempre que s''hagin produ\u00eft per negoci jur\u00eddic entre vius, el donant o
  la persona que constitueixi o que transmeti el dret real de qu\u00e8 es tracti.\\nb)
  En els sup\u00f2sits previstos en la lletra b) d''aquest article, l''adquirent o
  la persona a favor de la qual es constitueixi o es transmeti el dret real de qu\u00e8
  es tracti.\\n\\nARTICLE 20 RELACIONS NOTARIALS\\n\\nEls notaris tamb\u00e9 estaran
  obligats a remetre a l''Ajuntament, dins de la primera quinzena de cada trimestre,
  una relaci\u00f3 o \u00edndex comprensiu de tots els documents que han autoritzat
  en el trimestre anterior, i en els quals es continguin els fets, els actes o els
  negocis jur\u00eddics que posin de relleu la realitzaci\u00f3 del fet imposable
  d''aquest impost, amb excepci\u00f3 feta dels actes d''\u00faltima voluntat. Tamb\u00e9
  estaran obligats a remetre, dins del mateix termini, una relaci\u00f3 dels documents
  privats comprensius dels mateixos fets, actes o negocis jur\u00eddics, que els hagin
  estat presentats per a coneixement i legitimaci\u00f3 de firmes. El que es preveu
  en aquest apartat s''ent\u00e9n sense perjudici del deure general de col\u00b7laboraci\u00f3
  establert en la Llei general tribut\u00e0ria.\\n\\nARTICLE 21 INSPECCI\u00d3 I RECAPTACI\u00d3\\n\\nLa
  inspecci\u00f3 i la recaptaci\u00f3 de l''impost es realitzaran d''acord amb el
  que es preveu en la Llei general tribut\u00e0ria, en les altres lleis de l''Estat
  reguladores de la mat\u00e8ria i en les disposicions dictades per al seu desenvolupament.\\n\\nARTICLE
  22 INFRACCIONS I SANCIONS\\n\\nEn tot all\u00f2 relatiu a la qualificaci\u00f3 de
  les infraccions tribut\u00e0ries i a la determinaci\u00f3 de les sancions que els
  corresponguin en cada cas, hom aplicar\u00e0 el r\u00e8gim regulat en la Llei general
  tribut\u00e0ria i en les disposicions que la complementen i la desenvolupen.\\n\\nDISPOSICI\u00d3
  FINAL\\n\\n1. En tot all\u00f2 no previst i que no la  contradigui, ser\u00e0 d''aplicaci\u00f3
  l''Ordenan\u00e7a Fiscal General.\\n2. Aquesta Ordenan\u00e7a Fiscal entrar\u00e0
  en vigor el dia de la seva publicaci\u00f3 en el Butllet\u00ed Oficial de la Prov\u00edncia
  i ser\u00e0 aplicable a partir del dia 1 de gener de 1990. El seu per\u00edode de
  vig\u00e8ncia es mantindr\u00e0 fins que s''esdevinguin la seva modificaci\u00f3
  o derogaci\u00f3 expresses.\\n\\nAquesta Ordenan\u00e7a ha estat aprovada pel Ple
  de l''Ajuntament en sessi\u00f3 celebrada el vint-i-quatre d''octubre de 1989 i
  modificada per acord del Ple de data 30 d''octubre de 1997, de data 31 d''octubre
  de 2003, de data 14 d''octubre de 2004, de data 3 de novembre de 2005, de data 14
  de desembre de 2006, de data 13 de desembre de 2007, de data 27 d''octubre de 2008,
  de data 16 d''octubre de 2009, de data 28 d''octubre de 2011, de data 30 d''octubre
  de 2012, de data 23 d''octubre de 2013, de data 19 de desembre de 2014, de data
  29 d''octubre de 2015, de data 28 de desembre de 2018 i de data 19 de desembre de
  2019 i tal com queda redactada, regir\u00e0 en aquest terme municipal a partir de
  l''1 de gener de 2020, mentre no es modifiqui o derogui expressament.\\n\\nSant
  Joan Desp\u00ed, 2 de gener de 2021.\"", "\"ESTUDI DE NECESSITATS DELS PROFESSIONALS
  DE LA MEDICINA RELACIONADES AMB EL MOMENT DE LA JUBILACI\u00d3\\n\\nCATALUNYA 2005\\n\\nEdita:
  Fundaci\u00f3 Galatea\\nAutores: Marga S\u00e1nchez-Candamio M\u00e9ndez\\nInvestigadora
  Social\\nProfessora titular\\nUniversitat de Girona\\n\\nArantza del Valle G\u00f3mez\\nInvestigadora
  en Desenvolupament Hum\u00e0\\nUniversitat de Girona\\n\\nDip\u00f2sit legal: D-52915-2006\\nISBN-10:
  84-611-3669-1\\nISBN-13: 978-84-611-3669-8\\n\\nEstudi editat al desembre de 2006\\n\\nPresentaci\u00f3\\n\\nPodem
  dir que la medicina constitueix una activitat professionalment absorbent. Els metges
  i metgesses, en general, desenvolupen una traject\u00f2ria laboral caracteritzada
  per aspectes com la vocaci\u00f3 de servei, la necessitat d\u2019una formaci\u00f3
  permanent i actualitzaci\u00f3 cont\u00ednua, uns nivells de dedicaci\u00f3 importants
  a una activitat laboral no exempta de tensions i propera a situacions de patiment
  hum\u00e0. En definitiva, l\u2019experi\u00e8ncia de fer de metge significa per
  a molts companys de professi\u00f3 un estil de vida i l\u2019exercici d\u2019un
  rol d\u2019important transcend\u00e8ncia social.\\n\\nEn el cicle vital de les persones,
  la transici\u00f3 cap a l\u2019etapa de la jubilaci\u00f3 representa sempre un canvi
  significatiu que requereix, en m\u00e9s o menys grau, una adaptaci\u00f3. En una
  professi\u00f3 com la medicina, que generalment s\u2019exerceix de forma activa
  i amb gran implicaci\u00f3, el moment de retirar-se de la feina t\u00e9 evidentment
  unes repercussions personals que a vegades poden desembocar en situacions dif\u00edcils.\\n\\nTal
  com passa amb els afers de la pr\u00f2pia salut, el tarann\u00e0 dels metges i metgesses
  ha estat sempre el de minimitzar els problemes propis. Generalment, el professional
  de la salut \u00e9s el primer en donar ajuda i l\u2019\u00faltim en acceptar-la
  per a ell mateix. Aquest fet tan caracter\u00edstic del nostre col\u00b7lectiu es
  d\u00f3na tamb\u00e9 pel que fa al moment de la jubilaci\u00f3. I sorpr\u00e8n el
  fet que, m\u00e9s enll\u00e0 d\u2019una actitud personal i corporativa, aquesta
  idea \u00e9s compartida tamb\u00e9 per les institucions en les quals els metges
  treballen, donant lloc a una manca de cura en el tracte d\u2019aquesta q\u00fcesti\u00f3.\\n\\nLa
  import\u00e0ncia que t\u00e9 una bona entrada en aquesta etapa vital de la persona,
  per garantir-ne les millors condicions de benestar personal i del seu entorn social,
  ha menat la Fundaci\u00f3 Galatea a interessar-se en la realitzaci\u00f3 d\u2019aquest
  estudi que ara us presentem. L\u2019estudi pret\u00e9n aprofundir en el coneixement
  de la viv\u00e8ncia d\u2019aquesta etapa de la vida per part dels nostres col\u00b7legues
  per tal de considerar possibles necessitats que caldria pal\u00b7liar tant a nivell
  personal com col\u00b7lectiu i de les organitzacions.\\n\\nL\u2019estudi ha estat
  encarregat a les Dres. Margarita S\u00e1nchez-Candamio i Arantza del Valle, investigadores
  socials de la Universitat de Girona. La metodologia utilitzada ha estat la qualitativa
  i, per tant, no es tracta de resultats que detallin percentualment les opinions
  dels col\u00b7legiats. En canvi, fa un retrat molt acurat de les diferents actituds
  i necessitats \u2013percebudes i no percebudes\u2013 dels mateixos metges i metgesses
  aix\u00ed com de les institucions sanit\u00e0ries davant el fet de la jubilaci\u00f3.
  I apunta possibles l\u00ednies d\u2019acci\u00f3 que, des dels professionals i les
  diferents institucions implicades, podrien concretar-se en iniciatives a favor del
  benestar i la salut dels professionals.\\n\\nNo voldria acabar aquestes ratlles
  sense expressar l\u2019agra\u00efment a tots els companys i altres professionals
  de l\u2019\u00e0mbit sanitari que han participat directament en l\u2019estudi, exposant
  les seves experi\u00e8ncies i opinions en els grups focals i entrevistes personals,
  i sense la generositat dels quals no tindr\u00edem ara aquest material a la m\u00e0.\\n\\nJaume
  Padr\u00f3s i Selma\\nPresident de la Fundaci\u00f3 Galatea\\n\\n4\\n\\nEl que el
  prestigi s\u2019hagi devaluat, importa o no importa, per\u00f2 al menys saps qu\u00e8
  fas, que ets quelcom concret. Quan et jubiles jo penso que ets\u2026 B\u00e9, no
  s\u00e9, jo penso que una mica el tr\u00e0mit de la vida\u2026Jo a vegades dic que
  la vida, actualment, s\u00f3n dos p\u00e0rking i una autopista al mig. El p\u00e0rkings
  primer \u00e9s la guarderia, el col\u00b7legi i tal: la formaci\u00f3. Llavors entrem
  en l\u2019autovia, per aquesta hi anem a tota velocitat i no podem ni mirar el paisatge,
  i anem corrents cap al p\u00e0rking que \u00e9s la resid\u00e8ncia\u2026 B\u00e9,
  per\u00f2 \u00e9s que \u00e9s aix\u00ed\u2026I el m\u00e9s fotut del cas, per mi,
  era aquest tram d\u2019autopista, que anem a tanta velocitat i anem tan esverats
  que \u00e9s que no sentim els ocells, no mirem el paisatge, no veiem el sol\u2026
  No veiem res! No s\u00e9 si m\u2019enteneu el que vull dir?. (GF2,8)\\n\\nSin querer,
  hoy en d\u00eda se practica una medicina que cada vez me gusta menos. No es la medicina
  que a m\u00ed me ense\u00f1aron, no es la medicina para la cual yo me prepar\u00e9\u2026
  y no es la medicina que yo puedo transmitir a mis j\u00f3venes residentes. Porque
  esos tios, entre Internet y la vivencia, pues \u00a1saben m\u00e1s que yo de la
  medicina actual! Pero no estoy desencantado, \u00bfeh? Me lo he pasado muy bien.
  Pero ya no es lo que era la medicina. (...) Bueno, b\u00e1sicamente es que hoy en
  d\u00eda, pues, la experiencia no es un grado. No sirve de nada. Todo se basa en
  la evidencia nivel 1, clase A, cuando se sabe que muchos de estos estudios hacen
  aguas porque hay muchas exclusiones\u2026 Al principio todos mis residentes se pasaban
  la noche mirando el monitor del enfermo y ahora se pasan la noche mirando el monitor
  del Google, buscando art\u00edculos y todo esto\u2026 (GF2,18)\\n\\nIntroducci\u00f3
