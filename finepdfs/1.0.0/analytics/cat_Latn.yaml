  "\"28.23 Circular Informativa\\n\\nMODIFICACIONS DELS PERMISOS DEL PERSONAL FUNCIONARI\\n\\nEl
  BOE n\u00fam. 154, de 29 de juny de 2023, ha publicat el Reial Decret-llei 5/2023,
  de 28 de juny, pel qual s''adopten i prorroguen determinades mesures de resposta
  a les conseq\u00fc\u00e8ncies econ\u00f2miques i socials de la Guerra d''Ucra\u00efna,
  de suport a la reconstrucci\u00f3 de l''illa de La Palma i a altres situacions de
  vulnerabilitat, de transposici\u00f3 de Directives de la Uni\u00f3 Europea en mat\u00e8ria
  de modificacions estructurals de societats mercantils i conciliaci\u00f3 de la vida
  familiar i la vida professional dels progenitors i els cuidadors; i d''execuci\u00f3
  i compliment del Dret de la Uni\u00f3 Europea, que ja ha entrat en vigor en la mat\u00e8ria
  que tracta aquesta circular.\\n\\nMitjan\u00e7ant aquest Decret Llei es transposa
  parcialment la Directiva (UE) 2019/1158 del Parlament Europeu i del Consell, de
  20 de juny de 2019, relativa a la conciliaci\u00f3 de la vida familiar i la vida
  professional dels progenitors i cuidadors, efectuant-se modificacions en l'' Estatut
  B\u00e0sic de l''Empleat P\u00fablic, aprovat mitjan\u00e7ant Reial Decret Legislatiu
  5/2015, de 30 d''octubre, en mat\u00e8ria de permisos dels funcionaris p\u00fablics:\\n\\n-
  Es modifica la lletra a) de l''article 48 de l''EBEP. Se separa el perm\u00eds per
  defunci\u00f3 que continua sent de dos dies (aclarint que tamb\u00e9 s''inclou la
  defunci\u00f3 del c\u00f2njuge i de la parella de fet) del perm\u00eds per accident,
  malaltia greu, hospitalitzaci\u00f3 o intervenci\u00f3 quir\u00fargica sense hospitalitzaci\u00f3
  que s''amplia fins a 5 dies h\u00e0bils incloent-hi els  familiars consanguinis
  de la parella de fet i qualsevol altra persona que convisqui en el mateix domicili
  de la persona treballadora i requereixi la seva cura. Quan es tracti d''un familiar
  dins del segon grau de consanguinitat o afinitat aquest perm\u00eds s''amplia fins
  a 4 dies h\u00e0bils.\\n- Es modifica la lletra l) del mateix article 48 a efectes
  d''incorporar el perm\u00eds per registre o constituci\u00f3 formalitzada per document
  p\u00fablic de parelles de fet equiparant-lo al perm\u00eds per matrimoni de 15
  dies.\\n- S''afegeix una nova lletra g) a l''article 49 de l'' EBEP, el perm\u00eds
  parental per cura de fill o filla o menor acollit per temps superior a un any, fins
  al moment que el menor faci vuit anys, amb una durada no superior a vuit setmanes,
  cont\u00ednues o discont\u00ednues, que es podr\u00e0 gaudir a temps complet o parcial,
  quan les necessitats del servei ho permetin i conforme als termes que reglament\u00e0riament
  s''estableixin.\"", "\"\\n\\nTEMPS D''ESTUDIS A SANT MATEU DE BAGES\\n\\nL''escola,
  tradicionalment anomenada en entorns rurals \u00abl''estudi\u00bb, \u00e9s quelcom
  que resta en l''imaginari col\u00b7lectiu de manera pr\u00e0cticament inesborrable.
  I en entorns poc poblats, aquest esdev\u00e9 tot un s\u00edmbol d''identitat i eix
  cohesionador. Del record dels seus ve\u00efns, l''extens municipi de Sant Mateu
  de Bages en tenia tres, d''escoles rurals, la de Salo, la de Castelltallat i la
  de Sant Mateu poble. Espais que van albergar les primeres lli\u00e7ons, amistats,
  aprenentatges, dolenteries i c\u00e0stigs de tots aquells que, al llarg de generacions,
  hi van passar bona part de la infantesa. El tancament d''una escola rural sempre
  \u00e9s un cop dur per a un poble. El despoblament\u00a0a causa dels\u00a0canvis
  socioecon\u00f2mics viscuts al camp catal\u00e0, tocaria de mort aquests centres.
  I al municipi, en\u00a0 tan\u00a0 sols una d\u00e8cada, tancarien totes tres escoles
  (1969 tanca Castelltallat i el 78-79 s''ordenar\u00e0 el tancament definitiu de
  Sant Mateu, la darrera que estava en funcionament).\\n\\ncomunitat educativa anaven
  m\u00e9s enll\u00e0 de la mateixa escola: eren de ve\u00efnatge. Compartien parr\u00f2quia,
  entesa com a grup social o espai f\u00edsic m\u00e9s enll\u00e0 de les connotacions
  religioses.\\n\\nEn entorns poc poblats, la proximitat era un valor afegit d''aquests
  estudis. Per\u00f2 no per les dist\u00e0ncies amb l''edifici escolar (nens i nenes
  havien de caminar fins a dues o tres hores per arribar als centres educatius), sin\u00f3
  per la coneixen\u00e7a entre tothom qui en formava part. Les relacions entre la\\n\\nA
  pesar del fort simbolisme de l''escola rural com a element potenciador de la identitat
  positiva dels pobles, fins als anys 70 es va moure en la marginalitat, amb una clara
  discriminaci\u00f3 respecte als centres educatius urbans. Per ser mestre rural no
  es requeria cap concurs i tenien un sou inferior al dels mestres que exercien a
  les ciutats.  Tamb\u00e9 cal remarcar que, tot i aquest context totalment desfavorable,
  hi va haver mestres que van actuar amb plena vocaci\u00f3 i de forma compromesa
  amb els estudis que impartien.\\n\\nI en alguns casos els mestres eren els mateixos
  rectors del poble, els quals assumien aquesta doble funci\u00f3. Els m\u00e9s recordats
  s\u00f3n moss\u00e8n Josep Su\u00f1\u00e9 i moss\u00e8n Joan Marquet a Sant Mateu
  i moss\u00e8n Josep Iglesias i moss\u00e8n Ramon Reguant a Castelltallat.\\n\\nEn
  un sistema molt basat en l''autosufici\u00e8ncia de les masies, sovint els alumnes
  havien d''ajudar a casa. Aix\u00f2 provocava un elevat absentisme escolar, sobretot
  en aquelles \u00e8poques de collita o de m\u00e9s feina al camp. El fet que els
  rectors\\n\\nimpartissin classes nocturnes facilitava l''aprenentatge d''aquells
  joves que fallaven sovint a l''escola di\u00fcrna.\\n\\nL''ESCOLA DEL PRIMER FRANQUISME\\n\\nL''escola
  franquista va imposar un model educatiu basat en la memoritzaci\u00f3 de continguts
  i en la promoci\u00f3 dels valors tradicionals que propiciava el r\u00e8gim: \u00abp\u00e0tria
  (una i indivisible), religi\u00f3 (cat\u00f2lica, apost\u00f2lica i romana) i fam\u00edlia.
  L''escola era un espai polititzat que posava fi a qualsevol expressi\u00f3 de renovaci\u00f3
  pedag\u00f2gica. I l''espai f\u00edsic aix\u00ed ho denotava. El crucifix, la bandera
  \u00abnacional\u00bb i la foto del dictador Francisco Franco sempre hi eren presents.\\n\\ntar
  de cara a la paret figuren encara en la mem\u00f2ria de  molts.\\n\\nA nivell de
  continguts, la majoria de mestres hi explicaven conceptes molt b\u00e0sics, i principalment
  cal\u00b7ligrafia. Aix\u00f2 s\u00ed, els reis visigots o la geografia espanyola
  no hi podien faltar. \u00abSab\u00edem tots els rius d''Espanya i no coneix\u00edem
  el Cardener\u00bb, expliquen els alumnes d''aquells temps. El nacionalcatolicisme
  va comportar, tamb\u00e9, que s''establ\u00eds i es potenci\u00e9s en el temari
  l''assignatura d''Hist\u00f2ria Sagrada.\\n\\nEs tractava, doncs, d''un sistema
  d''ensenyament adoctrinador i jerarquitzat. El mestre era una autoritat inq\u00fcestionable
  i hi eren presents els c\u00e0stigs f\u00edsics, utilitzats o no \u2013 i de manera
  m\u00e9s severa o menys \u2013 en funci\u00f3 del tarann\u00e0 de cada mestre. Cops
  de regle, aguantar llibres de genolls i amb els bra\u00e7os oberts o es-\\n\\nI
  la imposici\u00f3 de la segregaci\u00f3 per sexes tamb\u00e9 era una caracter\u00edstica
  d''aquest tipus d''escoles, fins ben b\u00e9 la d\u00e8cada dels cinquanta. Ara
  b\u00e9, en entorns rurals aquesta norma podia ser m\u00e9s flexible. A tall d''exemple,
  a Sant Mateu es recorden diferents per\u00edodes de separaci\u00f3 i, en canvi,
  a Castelltallat i a Salo la gent recorda sempre haver anat junts nens i nenes. Finalment,
  la imposici\u00f3 del castell\u00e0 tamb\u00e9 es va veure reflectida a les aules,
  si b\u00e9 el seu \u00fas \u2013 m\u00e9s enll\u00e0 dels propis continguts del
  manual \u2013 variava en funci\u00f3 de\\n\\nsi la mestra era de qualsevol punt
  de l''estat espanyol o de Catalunya. En aquest darrer cas, molts recorden com, tot
  i que els continguts s''impartien en castell\u00e0, la llengua vehicular no deixava
  de ser-ne el catal\u00e0.\\n\\no Cal Carner, a Sant Mateu, havien acollit mestres
  a casa).\\n\\nEls mestres vinguts de fora s''havien d''allotjar al nou poble on
  estaven destinats.\\n\\nPodien fer-ho en pisos ja habilitats per aquesta funci\u00f3,
  el cas m\u00e9s evident \u00e9s el de Salo, on els baixos de l''edifici eren l''habitatge
  per al mestre. A la Casa Nova de Castelltallat tamb\u00e9 hi havia hagut un pis
  per a aquest \u00fas. Tot i aix\u00f2, tamb\u00e9 podien allotjar-se en alguna casa
  particular (a tall d''exemple, Cal Pubill\\n\\nCASTELLTALLAT\\n\\nA LA CASA NOVA
  AMB PARADA A LA CREU GROSSA\\n\\nL''escola de Castelltallat comptava amb un espai
  propi gr\u00e0cies a la iniciativa ve\u00efnal. En destaca, sobretot, l''aportaci\u00f3
  de la gent de la Casa Soldevila: l''exalcalde Pere Soldevila i Vall va fer la cessi\u00f3
  dels terrenys per a construir-hi el centre escolar. Tamb\u00e9, segons el contracte
  signat el 1922, hi va fer una aportaci\u00f3 important Joan Selvas i Carn\u00e9,
  qui va ser un destacat pol\u00edtic de la Generalitat republicana. I, a banda d''aquests
  noms propis, la construcci\u00f3 de l''immoble, ubicat en un petit altipl\u00e0
  molt proper a l''esgl\u00e9sia i\\n\\nla rectoria, va ser possible gr\u00e0cies
  a l''aportaci\u00f3 de tot el ve\u00efnat, fos amb hores de feina o b\u00e9 fent-hi
  una aportaci\u00f3 econ\u00f2mica.\\n\\nEl nou edifici es constru\u00efa, i aix\u00ed
  s''especifica, per acollir l''escola i un pis que estaria a disposici\u00f3  \u00abdel
  inspector de primera ense\u00f1anza\u00bb, \u00e9s a dir, el mestre. La cessi\u00f3
  dels terrenys es va fer el 19 de desembre de 1921, amb pres\u00e8ncia de Pere Soldevila
  i Vall i Mag\u00ed Soldevila i Bacardit, tots dos de la casa hom\u00f2nima que va
  fer la cessi\u00f3. El mateix 1922 s''inauguraria l''immoble.\\n\\nAquest edifici
  se''l coneix popularment com \u00abLa Casa Nova\u00bb i va ser durant anys epicentre
  de la vida\\n\\nsocial al poble, punt de trobada del ve\u00efnat, on hi havia la
  botiga i el bar, i on es van ubicar serveis b\u00e0sics com va ser el primer tel\u00e8fon
  p\u00fablic de la zona. En alguns per\u00edodes la rectoria tamb\u00e9 havia acollit
  l''estudi.\\n\\nA l''escola de Castelltallat no hi havia separaci\u00f3 per sexes:
  tots junts, tamb\u00e9 les diferents edats, en un mateix espai. Les classes es feien
  mat\u00ed i tarda i als qui venien de lluny \u2013 la majoria, de fet \u2013 s''enduien
  la fiambrera i ja els ho escalfaven a la mateixa Casa Nova. I un cop acabades les
  classes, calia emprendre de nou el cam\u00ed cap a casa. Un costum que tenien molts
  nens i nenes de Castelltallat era el de parar a berenar a la Creu\\n\\nGrossa. Els
  mestres que segurament van deixar m\u00e9s empremta en la mem\u00f2ria col\u00b7lectiva
  del poble eren dos clergues: moss\u00e8n Josep Iglesias i moss\u00e8n Ramon Reguant.
  Aquest darrer, a m\u00e9s a m\u00e9s, feia classes de rep\u00e0s als vespres, tant
  per aquells qui volien aprendre m\u00e9s com per facilitar l''escolaritzaci\u00f3
  en aquelles \u00e8poques de l''any on les feines del camp requerien m\u00e9s mans
  per treballar-hi.\\n\\nAmb el despoblament que a partir de mitjan segle XX van patir
  els municipis rurals i els canvis en les pol\u00edtiques d''ensenyament, Castelltallat
  es va convertir en el primer poble del municipi de Sant Mateu de Bages en quedar-se
  sense escola. L''any 1969 se''n decretava el tancament. Els alumnes es van despla\u00e7ar
  majorit\u00e0riament cap a l''escola de Fonollosa.\\n\\nELS ESTUDIS DE SALO\\n\\nL''escola
  de Salo (a l''edifici encara se l''anomena aix\u00ed)\u00a0est\u00e0 situada\u00a0en
  un terreny costerut que desemboca a la riera, a la falda del tur\u00f3 on hi ha
  el nucli de cases. Es tracta d''un edifici que estava exclusivament dedicat a l''ensenyament:
  als baixos hi havia l''habitatge per al mestre i al primer pis (al qual s''hi\u00a0accedia
  des de la part superior), l''aula on anaven junts nens i nenes. Els exalumnes expliquen
  que el centre hau-\\n\\nria pogut tenir entre 40 i 50 estudiants repartits entre
  vuit cursos: antigament pr\u00e0cticament totes les cases de la parr\u00f2quia eren
  habitades i, a m\u00e9s a m\u00e9s, a molts d''aquests masos hi vivien fam\u00edlies\u00a0nombroses.\\n\\nLes
  classes d''aquesta escola rural mixta es repartien entre mat\u00ed i tarda i, si
  b\u00e9 la majoria de nens i nenes tornaven a dinar a casa, aquells que tenien el
  trajecte llarg de tornada, s''hi quedaven a dinar: a la mateixa escola o al pis
  de la mestra, on els escalfaven la\u00a0 fiambrera\u00a0 damunt l''estufa. Com a
  la majoria de centres, a m\u00e9s a m\u00e9s, durant la d\u00e8cada dels 50 i els
  60, setmanalment es repartia una raci\u00f3 de llet en pols, que els alumnes s''enduien
  a casa. Era un aliment que provenia de l''Ajuda Social Americana, que pretenia millorar
  la nutrici\u00f3 infantil\u00a0pels\u00a0\u00edndexs negatius que s''arrossegaven
  encara de l''impacte de la guerra civil.\\n\\nEntre les mestres que van viure i
  treballar en aquest emblem\u00e0tic edifici de Salo, hom recorda la\u00a0 Paquita\u00a0
  i el seu home,\u00a0 Secundino, que tot sovint l''ajudava a l''aula. Una altra mestra
  que ha deixat empremta ha estat\u00a0 Carmen\u00a0 Pel\u00e1ez, la darrera docent
  que hi va ser de manera permanent. Aquesta va exercir a Salo\u00a0 fins a\u00a0
  una edat avan\u00e7ada, passats els seixanta\u00a0anys d''edat. Despr\u00e9s que
  marx\u00e9s la\u00a0 Carmen, l''escola ja va entrar en una etapa d''inestabilitat,
  amb per\u00edodes durant els quals la pla\u00e7a de docent quedava vacant i aix\u00f2
  era un vertader mal de cap de les fam\u00edlies.\\n\\nAmb aquest panorama, moltes
  fam\u00edlies ja van optar per buscar escoles fora de Salo, i les m\u00e9s properes
  eren les de Vallmanya (al Solson\u00e8s) i la de la col\u00f2nia Valls (llavors
  al municipi de Nav\u00e0s).\\n\\nL''any 78 l''escola era ja tancada \u00abper falta
  de mestra\u00bb, segons detalla un comuni- cat de l''Ajuntament.\u00a0Aix\u00f2
  no obstant, no havia sigut oficialment clausurada i el consistori insistia en la
  necessitat de mantenir obert aquest centre i el de Sant Mateu, \u00abcuidando de
  que una y otra se hallen provistas de maestro o maestra durante todo el curso escolar
  q ue a la vez se cree un servicio de transporte desde Castelltallat (sense escola
  des del 1969) a Sant Mateu de Bages para que los escolares de aquel agregado no
  deban desplazarse fuera del municipio\u00bb.\\n\\nSANT MATEU DE BAGES\\n\\nENTRE
  LA BOTIGA I LA SALA DE BALL\\n\\nEls estudis de Sant Mateu de Bages estaven ubicats
  a l''epicentre de la vida social del poble: Cal Gaspar \u2013 la Botiga, concretament
  damunt la sala de ball. Durant certs per\u00edodes hi va haver segregaci\u00f3 per
  sexes i l''aula per a les nenes s''ubicava al primer pis del mateix edifici de la
  botiga. Segons les pol\u00edtiques d''ensenyament franquista, separar nens i nenes
  a les aules havia de servir per atribuir determinats rols a les dones: el d''esposes
  i mares que desenvoluparien les seves tasques en l''\u00e0mbit dom\u00e8stic. A
  les tardes, doncs, les noies acostumaven a fer costura i labors.\\n\\nEra habitual,
  sobretot pel que fa a l''escola de nens, que el mestre fos el mateix rector del
  poble. En la mem\u00f2ria col\u00b7lectiva del poble en destaquen, sobretot, dos
  noms: moss\u00e8n Joan Marquet i moss\u00e8n Josep Su\u00f1\u00e9. A banda d''impartir
  classes a l''aula convencional, feien sessions al vespre, a la rectoria, una opci\u00f3
  que facilitava l''aprenentatge d''aquells adolescents del poble als quals de ben
  joves ja els tocava anar ajudar a les feines de la finca, de pag\u00e8s. Un cop
  s''havia post el sol les tasques del camp ja finalitzaven fins l''endem\u00e0 i
  molts anaven a la rectoria a fer classe.\\n\\nA banda de la implicaci\u00f3 dels
  capellans en l''ensenyament de la mainada, les classes a l''escola de Sant Mateu
  van ser majorit\u00e0riament impartides per mestres, la majoria de les quals venien
  de lluny si b\u00e9 algunes, com l''Adela de la Rabassa, s''acabaria establint al
  poble. Donada la ubicaci\u00f3 del centre escolar, damunt la botiga, era l\u00f2gic
  que la majoria s''instal\u00b7lessin en aquesta mateixa casa, acollits per la fam\u00edlia
  que regentava el negoci i vivia all\u00e0 mateix. Tamb\u00e9 s''havien allotjat
  a diferents cases particulars com s\u00f3n Cal Pubill o Cal Carner.\\n\\nSant Mateu
  va ser el darrer nucli rural de tot el municipi que es va quedar sense escola pr\u00f2pia.
  Va ser el curs 1977-1978, si b\u00e9 des del\\n\\n1975 el servei era irregular i
  passava moltes \u00e8poques sense mestre. Per q\u00fcestions de proximitat, i despr\u00e9s
  de v\u00e0ries reclamacions ve\u00efnals i de l''Ajuntament, es va habilitar transport
  escolar a Call\u00fas, on van la majoria d''alumnes santmateuencs.\"", "\"FIRA''05\\nDEL
  18 AL 28 DE NOVEMBRE\\n\\nSANTA CATERINA\\n\\nCONCURS LITERARI\\nLA FIRA 2005\\n\\nAquest
  recull del contes ens narren fets d\u2019amor, de misteri i m\u00e0gia, de guerres,
  per\u00f2 sobretot de la hist\u00f2ria del nostre poble, de la nostra Comunitat
  Valenciana i de la seua configuraci\u00f3. A m\u00e9s ens mostren l\u2019inter\u00e8s
  dels alumnes dels centres educatius de Mon\u00f2ver, aix\u00ed com tamb\u00e9 la
  recerca per con\u00e8ixer la nostra hist\u00f2ria.\\n\\nEsperem que en les properes
  edicions de la Fira de Santa Caterina puguem comptar, cada vegada, amb una major
  participaci\u00f3. Per la nostra part continuarem publicant aquests reculls d\u2019escrits
  dels xiquets i joves de Mon\u00f2ver complint el nostre comprom\u00eds de promocionar
  la llengua, la cultura i la hist\u00f2ria valencianes.\\n\\nUs recomanem que llegiu
  aquests textos, els quals s\u00f3n per a mi una satisfacci\u00f3 haver-los escollit
  i llegit, cosa que ara us deixe a les vostres mans.\\n\\nSalvador Molina Sebasti\u00e1n\\n\\nEdita:\\nGabinet
  Municipal de Normalitzaci\u00f3 Ling\u00fc\u00edstica\\nAjuntament de Mon\u00f2ver\\n\\nDibuix
  de la portada:\\nNicol\u00e0s Vidal Poveda\\n\\nDisseny i maquetaci\u00f3:\\nErnest
  Sabater Alfonso\\nEmilia Mart\u00ednez Alfonso\\n\\nImpr\u00e8s per Vda. de Manuel
  Vidal, SL\\nRonda Constituci\u00f3, 23\\n03640 Mon\u00f2ver\\n\\nUNA EXCURSI\u00d3
  INOBLIDABLE\\nCATERINA OCHOA P\u00c9REZ\\nGUANYADORA DE 5\u00e8 DE PRIM\u00c0RIA\\n\\nFa
  un grapat d''anys vivia un home anomenat l''Oncle Cany\u00eds que va ser, en aquells
  temps, una persona molt volguda i intel\u00b7ligent. Hui en dia, el seu descendent
  Caterineta passa per poble amb la seua amiga Caterineta, una xiqueta molt espavillada.
  B\u00e9, doncs comen\u00e7ar\u00e9 a contar-vos la hist\u00f2ria. Era un dia normal
  i corrent, un dissabte de vesprada avorrit i Canyisset estava al \\\"Parc del Salitre\\\"
  m\u00e9s sol que la una. De sobte escolt\u00e0 una veu que deia:\\n\\n- Canyisset,
  Canyisset!\\n- Canyisset respongu\u00e9:\\n  - Qui \u00e9s? Qui em parla?- contest\u00e0
  sorpr\u00e8s.\\n  - S\u00f3c jo, la Caterineta- cr\u00edda la veu cada vegada m\u00e9s
  prop.\\n\\nAleshores Canyisset vege que, efectivament, era Caterineta. La saluda
  i comen\u00e7a a parlar.\\n- Canyisset, qu\u00e8 vols que fem avui?- pregunt\u00e0
  la Caterineta.\\n- No s\u00e9 Caterineta, vols que anem a la fira?\\n- No. Perqu\u00e8
  sempre \u00e9s el mateix- respongu\u00e9.\\n- Doncs, per qu\u00e8 no hi anem a comprar
  llepolles?- va dir Canyisset, que era una mica golafr\u00e9.\\n- No, ni pensar-ho.\\n-
  Doncs no s\u00e9 com anem a divertir-nos.\\n- Ja ho tinc, anem-nos-en d''excursi\u00f3!-
  propos\u00e0 Caterineta.\\n- Bona idea!- digu\u00e9 Canyisset amb un somriure d''orella
  a orella.\\n\\nI Canyisset i Caterineta se n''anaren. Primer de tot al castell,
  m\u00e9s conegut com \\\"El Castell Tren\u00e7at\\\". Li posaren aquest nom els
  monovers perqu\u00e8 despr\u00e9s de tants anys al pobre castell, sols li queda
  una paret. Quan arribaren al castell, Caterineta digu\u00e9:\\n\\n- Volem fer moltes
  imatges fotografies. Encara que sols t\u00e9 una paret, li trobe el seu encant.\\n-
  Doncs a mi m''agrada m\u00e9s aix\u00ed que tot ple de turistes per tots els llocs-
  coment\u00e0 Canyisset.\\n\\nDespr\u00e9s se n''anaren a l''ermita de santa B\u00e0rbara.
  La visitaren per dins i per fora. Es va fer fosc i Caterineta digu\u00e9:\\n\\n-
  Canyisset, s''est\u00e0 fent fosc, \u00e9s millor que tornem a casa.\\nEspera un
  poc m\u00e9s, fins que tanquen l''ermita, per favor.\\n- D''acord, per\u00f2 sols
  un poc m\u00e9s.\\nVan passar 5 minuts, 10, 15 i altra vegada Caterineta va dir:\\n-
  Canyisset, anem-nos-en.\\n\\nD\u2019acord, anem-hi.\\n\\nDe cam\u00ed a sa casa
  Caterineta i Canyisset com era tan fosc, no sabien ni on es trobaven ells, ni els
  seus pares.\\n\\nCanyisset, ens hem perdut.\\n\\nNo digues ximpleries.\\n\\nAleshores
  van fer molts passos pel cam\u00ed que els van espantar, per\u00f2 de sobre una
  veu els tranquil\u00b7litza:\\n\\nQui \u00e9s?- digu\u00e9 Caterineta.\\n\\nS\u00f3c
  una ve\u00efna d\u2019aquest carrer. I vosaltres?\\n\\nSom, ell Canyisset i jo Caterineta.
  Ens hem perdut.\\n\\nTu ets Caterineta, la n\u00e9ta de Remediet?\\n\\nSi, som la
  sapa.\\n\\nPerqu\u00e8 jo s\u00f3c una de les seues amigues, Dolorettes. An\u00e0rem
  juntes a l\u2019escola el poc que pogu\u00e9rem. I ara anem a fer cam\u00ed juntes.
  Doncs vinga entreu i cridar\u00e9rem els pares.\\n\\nEl pares saben on estem.\\n\\nDoncs
  cridar\u00e9u a l\u2019\u00e0via, que jo si el tinc.\\n\\nLa cridar\u00e9u i li
  digueren que cridara els pares perqu\u00e8 vingueren a replegar-los. Mentre Dolorettes
  els cont\u00e0 unes an\u00e8cdotes:\\n\\nConta\u2019n alguna an\u00e8cdota de quan
  eres jove.- digu\u00e9 Caterineta.\\n\\n- Els exclam\u00e0 Canyisset posant-se d\u2019acord.\\n\\n-
  Vinga, anem-hi doncs. Contar\u00e9 la de quan f\u00e9rem el dinar Remediet i jo
  quan teniem 12 anys.\\n\\n- Un dia quan teniem 12 anys, jo vaig anar a sa casa a
  ajudar-la a fer el dinar per als seus pares que estaven treballant, i aix\u00ed
  donar-los una sorpresa. No sabien qu\u00e8 fer, per\u00f2 a Remediet se li ocorregu\u00e9
  que podien fer olla morisca. Agaf\u00e0rem i comen\u00e7arem tot el necessari i
  ens eix\u00ed l\u2019olla m\u00e9s bona que hav\u00edem cuinat mai.\\n\\nTan xicotetes
  ja sabieu cuinar?- pregunt\u00e0 Caterineta sorpresa.\\n\\nAi, la vida d\u2019abans
  no \u00e9s com la de hui en dia, ara tot \u00e9s m\u00e9s f\u00e0cil.\\n\\nAleshores
  tocaren a la porta, eren els pares. Eixiren i els abra\u00e7aren amb for\u00e7a,
  per\u00f2 els pares estaven malhumorats. Es despediren de Dolorettes i com era 25
  de novembre, que \u00e9s Santa Caterina, se\u2019n\u2019anaren a la Pla\u00e7a de
  la Sala a veure la foguera de Santa Caterina. Despr\u00e9s els pares, tant de Canyisset
  com de Caterineta, els digueren que no ho tornaren a fer mai m\u00e9s. Encara que
  els castigaren, aquella noia pensaren: ha valgut la pena, perqu\u00e8 ens hem divertit
  i hem apr\u00e8s coses noves.\\n\\nI quan estaven dormint somaven en tot el que
  els hi havia passat.\\n\\nEL TRESOR DE MON\u00d2VER\\nADRI\u00c0N ALFONSO ESTEVE\\nGUANYADOR
  6\u00e8 DE PRIM\u00c0RIA\\n\\nFa molts anys els moros habitaven Mon\u00f2ver. Era
  un poble xicotet amb molts bancals. En aquell temps hi havia construit l\u2019esgl\u00e9sia,
  el castell...\\n\\nEls cristians s\u2019aproximaven conquistant pobles, poble i
  m\u00e9s pobles. Per\u00f2 va arribar el dia, els cristians van arribar a Mon\u00f2ver,
  es va fer una lluita molt intensa, miraresson miraress tot hi eren morts, per\u00f2
  els moros es van rendir perqu\u00e8 ja eren massa morts.\\n\\nAl cap d\u2019un temps,
  els cristians es van convertir en els amos de Mon\u00f2ver. Anava passant el temps,
  cada vegada a lleis eren m\u00e9s dures, fins que va arribar un dia. Els cristians
  van fer un concurs, no paraven de donar-li voltes a l\u2019assumpt que era, en concret,
  qu\u00e8 podien fer amb els moros? Per\u00f2 ja van trobar la resposta, van pensar
  a expulsar els moros amb barques a un altre pa\u00eds perqu\u00e8 pogueren viure
  dins d\u2019aquell pa\u00eds.\\n\\nA poc a poc, els moros se\u2019n anaven per\u00f2
  els que vivien a Mon\u00f2ver es van assabentar que quan arribaves al port elsfurtaven
  tot l\u2019or, diners i la resta de coses valuoses. Van fer una reuni\u00f3 i van
  decidir enterrar-ho en algun lloc. Ho van enterrar un dia de nit. Van posar tot
  el tresor dins de sa sepultura.\\n\\nPer\u00f2 on est\u00e0 el tresor? Hi ha un
  escrit que diga on est\u00e0? Encara no s\u2019hi ha trobat, per\u00f2 estic segur
  que algun dia s\u2019hi trobar\u00e0.\\n\\nL''Edat Antiga:\\n\u00c9poca Ib\u00e8rica\\nLa
  Comunitat Valenciana ha sigut ocupada per diferents pobles ib\u00e8rics. Han tingut
  contacte amb altres cultures m\u00e9s avan\u00e7ades com la grega, la cartaginesa...
  i tamb\u00e9 han tingut influ\u00e8ncies indoeuropees.\\n\\nPoc se sap dels ibers;
  tan sols que vivien en poblats a\u00efllats, emmurallats i inaccesibles. Que hi
  havia nombrosos tribus i m\u00e9s importants van ser: els ilercavons (nord), edetans
  (comarques centrals), contestants (sud) s\u2019ha dedu\u00eft que eren gent guerriera.
  Les troballes m\u00e9s importants s\u00f3n: els vasos decorats d\u2019Edeta (Ll\u00edria),
  el santuari de la Serreta (Alcoi), el guerrer de Moixent a la Bastida de les Alcuses
  (Moixent) i la Dama d\u2019Elx al jaciment de l\u2019Alc\u00fadia (Elx).\\n\\nRomans/Hispanitzaci\u00f3\\nLa
  Comunitat Valenciana va ser un dels primers territoris peninsulars conquerits pels
  romans. Aquests van quedar-se des del segle III a.C. fins a la meitat del segle
  V d.C. Van fundar ciutats com Valentia (Val\u00e8ncia), Lucentum (Alacant) i Dianum
  (D\u00e9nia). Ens ha arribat poca cosa monumental dels romans: el teatre rom\u00e0
  de Sagunt, l\u2019arc de Cabanes, l\u2019aq\u00fceducte de Penya Cortada,... i algunes
  sepultures a Daim\u00fas i la Vila Joiosa.\\n\\nL\u2019edat Mitjana:\\n\u00c9poca
  Musulmana\\nL\u2019\u00e9poca musulmana no est\u00e0 molt estudiada. Els musulmans
  van dirigir tota l\u2019organitzaci\u00f3 social, econ\u00f2mica i art\u00edstica
  de la nostra Comunitat des del segle VIII fins al segle XIII i la seua entrada va
  comen\u00e7ar pel sultan Abd al Aziz i Tashfin. Van signar un pacte. No hi va haver
  cap invasi\u00f3, simplement van instal\u00b7lar-se i no hi va haver problemes fins
  a l\u2019arribada del Cid, que va fer que els musulmans pagaren molts impostos.
  Quan el Cid va morir, els musulmans van recuperar la denominaci\u00f3 i el territori
  i van viure tranquil\u00b7ls durant huit segles. Van introduir l\u2019arr\u00f2s,
  la taronja i la morera. Un dels elements que destaca \u00e9s la senia. Van construir
  fortaleses, mesquites, banys p\u00fablics.... De tot a\u00e7\u00f2 tan sols queden
  restes, ja que despr\u00e9s van ser destru\u00efts o transformats.\\n\\nNaixement
  del regne de Val\u00e8ncia\\nAl segle XIII es va comen\u00e7ar a poc a poc la nostra
  Comunitat, Prov\u00edncia Castell\u00f3 de la Plana, despr\u00e9s hist\u00f2ria
  de Val\u00e8ncia i per \u00faltim el regne musulm\u00e0 de D\u00e9nia. El 9 d\u2019octubre
  de 1238 Jaume I va entrar a Val\u00e8ncia, per aix\u00f2 \u00e9s la festa en la
  nostra Comunitat. Aquest regne va tenir lleis pr\u00f2pies que es trobaven en el
  llibre dels Furs i \u00f2rgans propis de govern: les Corts i la Generalitat. Tamb\u00e9
  tenien el Llibre del Repartiment on es donava una casa, un hort, etc. a cada fam\u00edlia.\\n\\nL\u2019Edat
  Moderna:\\nDecad\u00e8ncia del regne de val\u00e8ncia\\nLa revolta de les Germanies\\nEl
  1520 els artesans valencians van barallar-se amb la noblesa i l\u2019aristocr\u00e0cia
  que s\u2019ava sorpr\u00e8s pels tres esdeveniments que hi havia en la nostra Comunitat:
  la crisi d\u2019aliments, la pesta i les incursions dels pirates, aix\u00ed que
  els artesans i els burgesos van crear la Junta dels Tretze.\\n\\nL\u2019exiliaci\u00f3
  dels Moriscos\\nEls moriscs eren els musulmans que vivien en la Comunitat Valenciana
  i que no s\u2019havien transformat al cristianisme. El 1609 van ser expulsats, per\u00f2
  la conseq\u00fc\u00e8ncia era que hi havia menys poblaci\u00f3 i junt a a\u00e7o
  una decad\u00e8ncia econ\u00f2mica, perqu\u00e8 els moriscos treballaven en el camp.
  Fins a un segle i mig despr\u00e9s no es va tornar a recuperar la poblaci\u00f3.\\n\\nLa
  Batalla d\u2019Almansa\\nEl 1700 Felip V Carles II va morir sense descend\u00e8ncia.
  Hi havia dos candidats: Felip d\u2019Anjou i l\u2019arxiduc Carles. El poble recolevava
  aquest darrer. Despr\u00e9s de la batalla d\u2019Almansa a l\u2019any 1707 l\u2019arxiduc
  va ser derrotat. Finalment Felip V va promulgar el Decret de Nova Planta on els
  valencians perdien els Furs i les seues institucions i van estar sota la corona
  i llei de Castella.\\n\\nL\u2019Edat Contempor\u00e0nia:\\nEl comen\u00e7ament de
  L\u2019Edat Contempor\u00e0nia va estar marcat per dos esdeveniments: la Revoluci\u00f3
  Francesa i la Revoluci\u00f3 Industrial.\\n\\nS\u00e8gle XIX: La Revoluci\u00f3
  Francesa\\nEl final del segle XVIII i el comen\u00e7ament del segle XIX van estar
  marcats per la Revoluci\u00f3 Francesa. La situaci\u00f3 econ\u00f2mica a Fran\u00e7a
  era dif\u00edcil. Els burgesos i camperols van reclamar al rei la falta d\u2019igualtat.
  Aquests van lluitar amb les armes per eliminar privilegis i poder que tenien els
  reis i els nobles. Finalment va aprovar-se una constituci\u00f3 amb el lema: LLIBERTAT,
  IGUALTAT, FRATERNITAT, que reconeixia la igualtat de tot el m\u00f3n.\\n\\nAquesta
  Revoluci\u00f3 va produir tres tipus de canvis: els econ\u00f2mics, els socials
  i els pol\u00edtics. Canvis econ\u00f2mics: s''establia una llibertat econ\u00f2mica
  que permetia a cada ciutad\u00e0 fer la seva activitat i la gent tenia l''obligaci\u00f3
  de pagar els impostos. Canvis socials: s''intentava establir una societat on tots
  els ciutadans eren considerats iguals davant la llei. Canvis pol\u00edtics: l''estat
  va recon\u00e8ixer els drets b\u00e0sics del ciutad\u00e0, que eren igualtat davant
  la llei, llibertat de pensament, propietat privada i secretat. Al llarg del segle
  XIX aquests canvis es van reproduir en tota Europa.\\n\\n**La Revoluci\u00f3 Industrial**\\n\\nAquesta
  revoluci\u00f3 es produeix a finals del segle XVIII a Anglaterra. La seua base \u00e9s
  la mecanitzaci\u00f3 d''algunes fases de la fabricaci\u00f3. Per poder obrir les
  m\u00e0quines, primeres mat\u00e8ries, era necess\u00e0ria la exist\u00e8ncia de
  capital, el qual cosa estava nom\u00e9s a l''abast de la burgesia. El carb\u00f3
  va ser la font b\u00e0sica d''energia de la Revoluci\u00f3 Industrial. En aquella
  \u00e8poca el carb\u00f3 era barat per\u00f2 abundant.\\n\\nCal destacar alguns
  trets significatius com la invasi\u00f3 napole\u00f2nica, la proclamaci\u00f3 del
  cant\u00f3 valenci\u00e0, els intents de recuperar la identitat nacional, el paper
  de valencians durant la II Rep\u00fablica i la Guerra Civil, les consec\u00e8ncies
  de la Dictadura del General Franco i la recuperaci\u00f3 de l''autonomia amb l''adveniment
  de la democr\u00e0cia.\\n\\n**La Invasi\u00f3 Napole\u00f2nica**\\n\\nLes tropes
  de Napole\u00f3 van ocupar les terres valencianes. El 23 de maig de 1808 es va produir
  a Val\u00e8ncia una revolta contra els francesos, que acabada per un arrib\u00e0
  valenci\u00e0 va fallir. Entre els anys 1808 i 1814 les guerres i batalls s\u00f3n
  constants a la nostra comunitat. Durant aquest per\u00edode alguns valencians van
  participar en l''elaboraci\u00f3 de la Constituci\u00f3 de Cadis que va ser promulgada
  el 19 de mar\u00e7, dia de Sant Josep.\\n\\n**El Cant\u00f3 Valenci\u00e0**\\n\\nL''11
  de febrer de 1873 els diputats i senadors proclamaren la I Rep\u00fablica. Com a
  conseq\u00fc\u00e8ncia es va produir un moviment federalista a tot Espanya que es
  concreta amb l''aparici\u00f3 de cantons independents a Castell\u00f3 i Val\u00e8ncia.
  Un any despr\u00e9s va esdevenir un frac\u00e0s ja que un cop d''estat dissol la
  Rep\u00fablica. Val\u00e8ncia cau en les mans del general S\u00e1enz Campos el 7
  d''agost de 1874.\\n\\n**La Recerca de la Identitat**\\n\\nA finals del segle XIX
  es produeix un moviment cultural, la Renaixen\u00e7a, compartit per valencians,
  catalans i mallorquins (ja que tots parlen valenci\u00e0), que intenta recuperar
  els trets d''identitat en la societat valenciana.\\n\\n---\\n\\n**Segle XX**\\n\\n**La
  II Rep\u00fablica i la Guerra Civil**\\n\\nLa proclamaci\u00f3 de la II Rep\u00fablica
  va suposar un retroc\u00e9s en l''exportaci\u00f3, ra\u00f3 per la qual cal emprendre
  campanyes publicit\u00e0ries a l''estranger. Durant la Guerra Civil el govern es
  trasllada a Val\u00e8ncia.\\n\\n**La Dictadura de Franco**\\n\\nDurant aquest per\u00edode
  (1939-1975) les decisions de Franco van tenir dues conseq\u00fc\u00e8ncies en la
  nostra comunitat: es va produir un creixement econ\u00f2mic i l''\u00fas del valenci\u00e0
  com a llengua habitual es perd aix\u00ed com moltes altres llibertats personals.\\n\\n**La
  Recuperaci\u00f3 de l''Autonomia**\\n\\nDespr\u00e9s de la mort de Franco (1975)
  va comen\u00e7ar una nova etapa que culmina amb l''aprovaci\u00f3 de l''Estatut
  d''Autonomia (1977). A partir d''aquest data els valencians disposen de la Generalitat
  i les Corts Valencianes. En 1993 el parlament espanyol va modificar l''estatut per
  tal d''ampliar les compet\u00e8ncies del govern de la Comunitat Valenciana.\\n\\nVal\u00e8ncia,
  una ciutat preciosa, moderna... amb una gran quantitat d''habitants: joves, vells,
  acabats de naixet... \u00c9s Val\u00e8ncia la meua ciutat, on s\u00f3c feli\u00e7,
  on vaig viure la meua primera hist\u00f2ria d''amor.\\n\\nTot va comen\u00e7ar l''any
  1998, un tal Jaume va arribar a la meua classe. Venia de les illes Balears, de Mallorca.
  Era alt, fort, prim, guapa... Tenia els ulls de color marfil, els llavis menuts
  i allargats, els cabells llargs de color castell i portava una samarreta de la famosa
  marca \\\"NIKE\\\", igual que les esportives roges i grises. Tamb\u00e9 portava
  uns pantalons de mitja cama i una arracada platejada a l''orella dreta, per\u00f2
  el que m\u00e9s em va cridar l''atenci\u00f3 va ser un anell daurat que formava
  una creu benada.\\n\\nJo vaig arribar l''horari de l''esplai. Estava sol, assegut
  en una pedra, aix\u00ed que va decidir saludar-lo:\\n\\n- Hola Jaume. Em dic Carme
  i vaig a la mateixa classe que tu.\\n- Encantat de con\u00e8ixer-te! em va contestar
  Jaume, il\u00b7lusionat, com si no hagu\u00e9s parlat amb ning\u00fa des de feia
  segles.\\n- Vam estar mirant l''un a l''altre durant una llarga estona fins que
  Jaume va reaccionar:\\n  - B\u00e9, com portes els estudis?\\n  - Molt b\u00e9 gr\u00e0cies-
  li vaig dir alegre.\\n  - Tragada Jaume !?, \u00e9s a dir, la seua hist\u00f2ria?-
  em va preguntar.\\n  - No \u00e9s gens divertida, per tant, no m''agrada.\\n  -
  Doncs a mi s\u00ed. Jaume i \u00e9s el meu heroi! Va fer molt b\u00e9 expulsant
  els musulmans del territori valenci\u00e0. No el mereixien- va dir fent-se interessant.\\n  -
  Qu\u00e8?\\n  - Qu\u00e8 vols que et diga? Van malgastar aquesta terra- va dir tot
  conven\u00e7ut.\\n  - No diiges aix\u00f2. Ells la van guanyar lluitant, com despr\u00e9s
  la va guanyar Jaume vaig donar-li amb cara de pomes agres.\\n  - Vam comen\u00e7ar
  a nosaltres discutir sobre tot i va acabar amb un ''deixa-ho estar, no val la pena
  parlar amb tu''. No ens vam despedir, per\u00f2 jo seguia recordant-lo, encara que
  el veia tots els dies a classe. Estava clar: m''havia enamorat de Jaume.\\n  - Carme,
  ens vam barallar per una q\u00fcesti\u00f3 absurda. M''agradaria que em perdoneres,
  ho sent molt. Et dic a\u00e7\u00f2 perqu\u00e8 des que ens vam barallar he estat
  pensant en tu tots els dies a totes les hores.\\n\\nJaume, jo tamb\u00e9 ho sent
  molt, i tamb\u00e9 he estat pensant en tu tots els dies; i va arribar el moment
  de dir-ho, -estem fets l''un per a l''altra-. Les caresm em tremolaven com si foren
  gelatin\u00e8s, creia que el m\u00f3n s''acabava, m''enfonsava entre les pedres,
  fins que va dir:\\n\\n- Carme, t''estime molt, per\u00f2 tinc parella.\\n\\nVaig
  quedar-me destrossada. Per primera vegada en la meua vida m''havien partit el cor.
  Va comen\u00e7ar a caure''m la ll\u00e0grima per la galta, quan de s\u00fabito es
  va posar a riure:\\n  - De qu\u00e9 et rius? No fa gr\u00e0cia que un xic em trenque
  el cor- vaig xisciar.\\n  - Que \u00e9s broma dona. Je, je, jel Vinga, no plores.
  Je, je, jel-encara rient-se.\\n  - Ja ve, ja, jal Aleshores que?\\n  - Qu\u00e8
  de qu\u00e9?- em va dir.\\n  - M''estimes de veritat?\\n  - Ah! Clari! Carme eres
  la millor persona que he coneugut en la meua vida. T''estime de veritat. Vols ser
  la meua n\u00f2via?- altra volta plorant, per aquesta vegada d''emoci\u00f3.\\n  -
  Cl\u00e0r! que s\u00ed! vaig dir emocionada.- Ara posa''t la jaqueta que et convide
  a esmorzar.\\n\\nAci finalitza la meua hist\u00f2ria. Ja estem en l''any 2005 i
  encara som parella gr\u00e0cies a Jaume i a la seua hist\u00f2ria.\\n\\nX\u00c0TIVA,
  1707\\n\\nMARIA VEGA PASTOR\\nGUANYADORA 4t ESO\\n\\nDu\u00edem ja diverses nits
  sense dormir. Hav\u00edem siet de les nostres cases feia uns cinc dies que ens trob\u00e0vem
  en punt d\u2019un lloc a un altre, entre els camps principals plens d\u2019herbes
  i flors silvestres, i ja comen\u00e7\u00e0vem a notar la calor del pr\u00f2xim maig,
  encara que les pluges d\u2019abril no ens van perdonar els primers dies. Havia deixat
  la meua esposa Constan\u00e7a i les meues dues filles, Elionor i Carmesina, la tarda
  del 19 d\u2019abril. La pluja queia amb for\u00e7a quan vam eixir de la ciutat.\\n\\nEncara
  puc recordar les seues caretes menudes, els petits ulls blaus, en els quals no es
  distingien les ll\u00e0grimes de la pluja, els cabells daurats recollits en senyets
  trenes que queien sobre els seus petits musclets i les mans blanques de la seua
  m\u00e0sca, mentre ells, recollint-les en la seua salda, miraven amb els seus ulls,
  sequessos i constants, com ella, dels quals nom\u00e9s va caure una ll\u00e0grima.
  Jo estava acostumat a aquesta escena, per\u00f2 aquesta vegada era diferent.\\n\\nPantxa
  per a molts mesos, per anar fins a Flandes, Ven\u00e8cia, Amsterdam, N\u00e0pols,
  Granada, Castella, a les fires, a la de Medina del Campo, on solia acudir amb gust,
  per contemplar la bella col\u00b7legiata i el bell castell, el de \u201cLa Mota\u201d.
  Aquells viatges eren obligats per a un home com jo, que seguia amb el negoci del
  seu pare: cort i confecci\u00f3, com solia cridar-lo Constan\u00e7a. Per\u00f2 ara
  ja no viajava per a comprar vestits, ni per vendre-los, ni veles teles i brillants
  sedes, sin\u00f3 per a lluitar al costat dels meus, per a unir-me als meus companys
  maulents en aquesta \u201ccausa\u201d.\\n\\nLa \u201ccausa\u201d havia comen\u00e7at
  quan el nostre rei, Carles II, va morir sense descend\u00e8ncia. Tot Arag\u00f3
  i Val\u00e8ncia ens van unir a l\u2019arxiduc Carles d\u2019Austr\u00e0lia, que
  demanava el seu ascens al tron. Per\u00f2 els castellans ens van portar un franc\u00e8s
  que s\u2019oposava a ell, un \u201cborbo\u201d, duc d\u2019Anjou dalen que era,
  i a ells es van unir tots els nobles i terratrinitats.\\n\\nFelip, el franc\u00e8s,
  ens havia llevat ja Madrid, i ara avan\u00e7ava cap a les nostres cases. Aix\u00f2
  era l\u2019\u00fanica cosa que sab\u00edem quan el dia 19 ens va dir que, si el
  mateix dia seg\u00fcent que el general Berwick avan\u00e7ava amb les seues tropes
  franco-curl\u00e0ndies i arribava a Almansa. Les cases es van omplir d\u2019angoixa,
  tristesa, de crits i ll\u00e0grimes despr\u00e9s del que va arribar, el silenci.
  Era f\u00e0cil sentir-se maulert quan la guerra tenia lloc a Castella, per\u00f2
  ara, en veure que an\u00e0vem perdent, molts es van venir endarrere, i alguns fins
  i tot dubtaven de si no estaven en el bandid\u00f3 equivocat.\\n\\nAix\u00ed, amb
  la por en el cos, les ll\u00e0grimes de les nostres espouses en el pit i el cor
  oprimit pel p\u00e0nic, vam eixir d\u2019Almansa cap a terres de batalla pr\u00f2ximes
  a Almansa. Ens vam quedar en la rereguarda, des d\u2019on solament escoltavem el
  so lluny\u00e0 de les bales cisellants, tallant l\u2019aire, el fum i la brutetat
  de revolta que el vent ens portava i els xiscles i crits desesperats de tant de
  tant cadells que es perdien en el camp de batalla. Fins que el dia 25 d\u2019abril
  del 1707 del nostre Senyor, vam escoltar de lluny els galops cansats i trists dels
  centenars de cavalls que venien de la batalla, molts, sols, sense el seu genet,
  i altres, amb aquest a la groga, ple de sang i de ferides, que no li permetien seguir
  avan\u00e7ant.\\n\\nHav\u00edem perdut, Berwick s\u2019havia a\u00e7at a Almansa
  i mentre per a ell sonaven trompetes i cornetes, crits de viva i gl\u00f2ria, nosaltres
  torn\u00e0vem fins a la nostra X\u00e0tiva. Els qui \u00e9rem d\u2019all\u00ed port\u00e0vem
  alguns dels nostres germans antics embolicats en negres i difuses robes, o plenis
  d\u2019emotio. Cavallers, amb rapides velociades, que molt no podien ni costonar-se,
  ni perdre les brideres dels seus cavalls, que havien perdut algun membre del cos
  o la m\u00e0 sencera a la batalla. Les tropes avan\u00e7aven cap a la nostra terra,
  on, indefenses, estaven les nostres fam\u00edlies. Vam arribar tan prompte com vam
  poder per\u00f2 ells van arribar abans que nosaltres. Vam envoltar la ciutat i el
  setge va durar diversos dies, mentre la fam i la desesperaci\u00f3 arribaven a nosaltres,
  en nota que, o lluitarem o mor\u00edem.\\n\\nJaume, Rodrigo, Diego, Enric, Joan
  el de la Plana, Guzm\u00e1n el de Terol, Ricard i Jo ens vam reunir a la llum del
  foc, perqu\u00e8 ja no ens quedaven criris, per a decidir que an\u00e0vem a fer.
  Lluitarem! Quan li ho vaig dir a Constan\u00e7a, ella va mirar de la balda amb els
  seus grans ulls blaus claus, amb la meva cara, freda, gelotosa, i estic segur que
  si hi haguera sigut per ella, haguera pres en les seues grans i dures mans, com
  ella, l\u2019espasa, i haguera exigit a lluitar, amb la valentia i la destresa del
  mateix Berwick, i de qualsevol general que s\u2019atrevia a mesurar-se amb ella.\\n\\nPer\u00f2
  no, ella volia quedar-se al costat de les petites, i ella ho sabia. Es va apropar
  a mi i em va besar el front, per a despr\u00e9s, abra\u00e7ar-me fortement i trencar
  a plorar, com mal l\u2019havia vista fer-ho. Despr\u00e9s es va eixugar les ll\u00e0grimes
  amb les mans i el seu davantal, ple de fils, i va obrir la porta de la casa per
  a tornar a mirar-me seriosa i ferma, com sempre, per\u00f2 quan vaig passar pel
  seu costat, abans d\u2019anar, i D\u00e9u sabia si tornaria a veure-la, va al\u00e7ar
  el cap i va agafar la meva m\u00e0 i la vaig mirar per a la meva mirada perduda
  en el sol, perqu\u00e8 no la vegeva plorar. Vaig eixir, vaig pujar al meu cavall
  i em vaig unir a tots, que ja esperaven a l\u2019entrada de la ciutat per a eixir
  a lluitar.\\n\\nLa batalla va ser dura, m\u00e9s dura del que jo havia pogut imaginar
  en els meus somnis, que plens de sang i dolor, es convertien en malsons. Jaume tenia
  el rostre ple de sang, i despr\u00e9s d''intentar agafar-se al meu muscle, va caure
  amb els membres bra\u00e7ats, em va mirar amb els ulls negres, allargats i profunds,
  i va sospirar pel \u00faltima vegada, mentre deixava caure el seu cor sobre el meu
  peixant de bategar. L''herba s''havia tenyit de malva i els cavalls corrien sense
  rum\u00ed, perdent-se en la llunyania, en el camp, sense dest\u00ed, com tots els
  homes que havien caigut als peus dels soldats frances i jeliens sense vida sobre
  la terra. Hav\u00edem sigut derrotats i avui nom\u00e9s acudir aix\u00ed.\\n\\nAquella
  mateixa vesprada, per desgr\u00e0cia de Felip V, les tropes van entrar en les nostres
  cases, i van destrossar, van arrossegar fora a cops les nostres fam\u00edlies, es
  van dur les nostres propietats, els nostres records, la nostra llibertat, i ens
  van deixar sense no-res, per a despr\u00e9s, mentre les dones ploraven i xiscaven
  abra\u00e7ades als seus esp\u00f2sos, que maleien, com feia Guadaluca, i mentre
  els fills i els que donaven suport al bar\u00f3, lo era el que plorava, al costat
  de les meves filles, en veure que el negoci familiar que des de feia generacions
  ens ajudava a subsistir, totes aquelles teles, sedes, llanes de l''Erm segovia,
  brodats de N\u00e0pols, s''esquin\u00e7aven i es desfeien en flames, es consumien
  per mil cemers, com fora la nostra casa i la nostra llengua. Tot es perdia, el foc,
  tot consumia i deixia despr\u00e9s un fulgor d''aquell color vermell que s''apoderava
  de tot el que hav\u00edem tingut, de les nostres llars, i com, el 29 de juny d''aquest
  mateix any, vam ser testimonis de la confiscaci\u00f3 dels nostres b\u00e9ns, de
  l''abolici\u00f3 de qualsevol privilegi del nostre regne, de les nostres institucions
  i dels nostres drets, de la nostra llengua, que la flama d''aquell 19 de juny, ni
  mil decrets de cap rei podran amb la nostra llengua, i estic segur que encara que
  els anys passen i nom\u00e9s puguem parlar-la d''amagat, la nostra llengua mai ser\u00e0
  extingida i les nostres generacions seguiran utilitzant-la i lluitant per ella,
  per la nostra llengua valenciana.\\n\\nAmb motiu de La Fira de Santa Caterina es
  va publicar aquest recull de contes com a separata del butllet\u00ed d''informaci\u00f3
  municipal El Ve\u00efnat. Es va acabar d''imprimir el 19 de desembre, vespres de
  Nadal de l''any 2005 als tallers de la Imprenta Vda. de Manuel Vidal, S.l. de Mon\u00f2ver.\\n\\nRegidoria
  de Normalitzaci\u00f3 Ling\u00fc\u00edstica\\nAjuntament de Mon\u00f2ver\""]'
