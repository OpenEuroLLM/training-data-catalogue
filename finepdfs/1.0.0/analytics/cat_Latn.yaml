sample: '["\"N\u00daM 05/08\\n\\nACTA DE LA SESSI\u00d3 ORDIN\u00c0RIA DEL PLE DE
  L\u00b4AJUNTAMENT  CELEBRAT EN DATA 1 DE JULIOL DE 2008\\n\\nA la seu de l''Ajuntament
  de Castellol\u00ed, en l''Avinguda de la Uni\u00f3 n\u00fam. 60, de Castellol\u00ed,
  el dia \u00fa de juliol de 2008,  pr\u00e8via convocat\u00f2ria realitzada en legal
  forma a tots els Regidors, es constitueix el Ple ordinari de l''Ajuntament de Castellol\u00ed,
  sota la Presid\u00e8ncia de l''Alcalde Sr. Jes\u00fas Brugu\u00e9s i Brugu\u00e9s
  i amb l''assist\u00e8ncia dels Regidors Sr. Josep Centellas, Sr. F.Xavier Brugu\u00e9s,
  Sr. Joel Jorba, Sr. Vicen\u00e7 Jorba, Sr. Josep Jorba i Sra. Montserrat Costa.
  Assistint hi la  Secret\u00e0ria que est\u00e9n la present.\\n\\nConstatada l''assist\u00e8ncia
  dels Regidors descrita ut supra i l''exist\u00e8ncia del qu\u00f2rum necessari,
  l'' Alcalde obra la sessi\u00f3 quan s\u00f3n les vint hores i trenta-cinc minuts.
  Procedint-se per la Secret\u00e0ria a la lectura dels assumptes que composen l''ordre
  del dia, a fi de ser discutits en aquesta sessi\u00f3.\\n\\nPRIMER.- APROVACI\u00d3,
  SI S''ESCAU, DE L''ACTA DE LA SESSI\u00d3 ANTERIOR\\n\\nEs d\u00f3na lectura i es
  demana per part del Sr. Alcalde President si hi ha cap al\u00b7legaci\u00f3 a l''acta
  de la sessi\u00f3 de data 22 d''abril de 2008 i a l''acta de la sessi\u00f3 de data
  17 de juny de 2008, d''acord amb el que estableix l''art. 106.3 de la Llei municipal
  i de r\u00e8gim local, no es presenta cap i l''acta queda aprovada per unanimitat.\\n\\nSEGON.-
  APROVACI\u00d3, SI S''ESCAU, DEL PLA DIRECTOR D''ABASTAMENT D''AIGUA AL MUNICIPI
  DE CASTELLOL\u00cd\\n\\nEl Ple per unanimitat acorda:\\n\\nAt\u00e8s que en data
  15 de maig de 2008 l''empresa SOCADE INFORM\u00c0TICA SL ha fet entrega del Pla
  Director d''abastament d''aigua al municipi de Castellol\u00ed.\\n\\nEl Ple, per
  unanimitat acorda:\\n\\nPrimer.- Aprovar el Pla Director d''abastament d''aigua
  al municipi de Castellol\u00ed presentat per l''empresa SOCADE INFORM\u00c0TICA,
  SL.\\n\\nSegon.- Comunicar aquest acord a l''ACA i a l''empresa SOCADE\\n\\nEl Sr.
  Josep Jorba lamenta que no es contempli tota la connexi\u00f3 Ter \u2013 Llobregat
  i l''Alcalde manifesta que es una eina que s''haur\u00e0 d''anar actualitzant cont\u00ednuament
  pels t\u00e8cnics municipals.\\n\\nTERCER.- APROVACI\u00d3, SI S''ESCAU, DE LA FRA
  200800148 DE SOCADE INFORMATICA\\n\\nEl Ple, per unanimitat acorda:\\n\\nPrimer.-
  Aprovar la fra 200800148 de Socade Inform\u00e0tica Sl corresponent a la redacci\u00f3
  del Pla Director d''abastament d''aigua potable, per un import de 10.556,00 \u20ac\\n\\n(deu
  mil cinc-cents cinquanta-sis euros)\\n\\nSegon.- Disposar el pagament de l''esmentada
  factura.\\n\\nQUART.- APROVAR, SI S''ESCAU, LA DISTRIBUCI\u00d3 DE FONS DE COOPERACI\u00d3
  LOCAL, CAPITOL PER A LA PRESTACI\u00d3 SUPRAMUNICIPAL.\\n\\nVist el que estableix
  l''article 45.5 de la llei 16/2007, de 21 de desembre, de Pressupostos de la Generalitat
  de Catalunya per al 2008 sobre la participaci\u00f3 dels ingressos de la Generalitat,
  integrada en el Fons de Cooperaci\u00f3 Local, i m\u00e9s concretament la regulaci\u00f3
  que es fa del nou cap\u00edtol per a la prestaci\u00f3 supramunicipal de serveis.\\n\\nAt\u00e8s
  que d''acord amb la Resoluci\u00f3 GAP/798/2008, de 12 de mar\u00e7 publicada al
  DOGC n\u00fam. 5095, ha estat aprovada la distribuci\u00f3 per municipis corresponent
  a Castellol\u00ed una dotaci\u00f3 de 3.627,31 euros.\\n\\nEl Ple per unanimitat
  acorda:\\n\\nPrimer.- Aprovar la distribuci\u00f3 de 3.627,31 euros que correspon
  a aquest Ajuntament com a participaci\u00f3 en el Fons de Cooperaci\u00f3 local
  de Catalunya de la seg\u00fcent forma:\\n\\n- el 90% per a dotaci\u00f3 del Consell
  Comarcal de l''Anoia\\n- el 10% per a dotaci\u00f3 de la Mancomunitat de Disminu\u00efts
  Ps\u00edquics de l''Anoia.\\n\\nSegon.- Traslladar el present acord a la Direcci\u00f3
  general d''Administraci\u00f3 Local, al Consell Comarcal de l''Anoia i a la Mancomunitat
  de Disminu\u00efts Ps\u00edquics de l''Anoia.\\n\\nCINQU\u00c8.- APROVACI\u00d3
  DE LES ACTES DE LES OPERACIONS DE DELIMITACI\u00d3 ENTRE EL TERME DE CASTELLOL\u00cd
  I ELS MUNICIPIS DE PIERA, CASTELLFOLLIT DEL BOIX, ODENA, EL BRUC I LA POBLA DE CLARAMUNT\\n\\nEl
  Ple de la Corporaci\u00f3, per unanimitat acorda:\\n\\nPrimer.- Aprovar les seg\u00fcents
  actes de delimitaci\u00f3 entre terme municipal de Castellol\u00ed i els seg\u00fcents
  municipis:\\n\\n- Acta de data 17 d''abril de 2008 entre el terme de Castellfollit
  del Boix.\\n- Acta de data 16 d''abril de 2008 entre el terme d''\u00d2dena.\\n-\\nActa
  de data 7 d''abril de 2008 entre el terme de la Pobla de Claramunt.\\n- Acta de
  data 14 de maig de 2008 entre el terme de Piera.\\n- Acta de  data 22 de maig de
  2008 entre el terme del Bruc.\\n\\nSegon.- comunicar aquest acord a la Direcci\u00f3
  General d''Administraci\u00f3 Local de la Generalitat de Catalunya.\\n\\nSIS\u00c8.-
  DONAR COMPTE DE LA DECLARACI\u00d3 DE B\u00c9 CULTURAL D''INTER\u00c8S LOCAL DE
  L''ESGL\u00c9SIA DE SANT FELIU DE LA VALL I L''ESGL\u00c9SIA VELLA DE SANT VICEN\u00c7.\\n\\nPer
  part de l''Alcalde \u2013 President es dona compte del certificat del Ple del Consell
  Comarcal de l''Anoia de data 24 d''abril de 2008 pel qual s''atorga la declaraci\u00f3
  de b\u00e9 cultural d''inter\u00e8s local de l''Esgl\u00e9sia de Sant Feliu de la
  Vall i l''Esgl\u00e9sia Vella de Sant Vicen\u00e7.\\n\\nSET\u00c8.- CONDOL A LA
  FAMILIA JORBA- MABRAS\\n\\nAt\u00e8s que el dia 29 de maig es va produir la defunci\u00f3
  del  Sr. Celest\u00ed Jorba, es proposa al  Ple l''adopci\u00f3 del seg\u00fcent
  acord:\\n\\nPrimer.- Transmetre el m\u00e9s sincer sentiment de condol al Regidor
  Vicen\u00e7 Jorba pel trasp\u00e0s del seu pare, el Sr. Celest\u00ed Jorba, i acompanyar
  a la fam\u00edlia en aquest moments tant dolorosos.\\n\\nSegon.- Traslladar el present
  acord als seus familiars\\n\\nVUIT\u00c9.- RATIFICACI\u00d3 SI S''ESCAU, DEL DECRET
  DE DATA 23 DE MAIG DE 2008 DECRET N\u00daM. 72 DE DATA 23 DE MAIG DE 2008.\\n\\nAt\u00e8s
  que el Ple de la Corporaci\u00f3 en data 26 de juny de 2007 va nomenar un representant
  de l''Ajuntament en la Mancomunitat per a l''atenci\u00f3 dels minusv\u00e0lids
  ps\u00edquics de la comarca de l''Anoia \\\"APINAS\\\".\\n\\nAt\u00e8s que l''art.
  6\u00e8 dels Estatuts de l''esmentada Mancomunitat  diu que cada Ajuntament designar\u00e0,
  a part de l''Alcalde, un representant de cada deu mil habitants.\\n\\nPer tot l''exposat,\\n\\nRESOLC:\\n\\nPrimer.-
  Nomenar al Sr. F. Xavier Brugu\u00e9s Brugu\u00e9s representant de l''Ajuntament
  en la Mancomunitat per a l''atenci\u00f3 dels minusv\u00e0lids ps\u00edquics de
  la comarca de l''Anoia \\\"APINAS\\\".\\n\\nSegon.- RATIFICAR aquesta resoluci\u00f3
  en la propera sessi\u00f3 plen\u00e0ria que es celebri.\\n\\nTercer.- Comunicar
  aquesta Resoluci\u00f3 a la Mancomunitat per a l''atenci\u00f3 dels minusv\u00e0lids
  ps\u00edquics de la comarca de l''Anoia \\\"APINAS\\\" i al Sr. F. Xavier Brugu\u00e9s
  i Brugu\u00e9s .\\n\\nEl Sr. Josep Centellas manifesta que el seu grup s''abstindr\u00e0
  per tractar-se d''un tema de nomenaments de c\u00e0rrecs.\\n\\nEl Ple, per 4 vots
  a favor del grup municipal CiU i 3 abstencions del grup municipal ApC, acorda ratificar
  el decret anterior\\n\\nNOV\u00c9.- DONAR COMPTE DELS DECRETS DE L''ALCALDIA\\n\\nPer
