  |  |  |  |  |  |  |\\n| Estudi i an\u00e0lisi de documents i articles |  | 45 |  |
  1,80 |  |  |\\n\\nAvaluaci\u00f3\\n\\nEls estudiants disposen d''una \u00fanica
  convocat\u00f2ria per curs acad\u00e8mic per a superar l''assignatura. La progressi\u00f3
  acad\u00e8mica i la superaci\u00f3 de l''assignatura es valora mitjan\u00e7ant:\\n\\nAvaluaci\u00f3
  continuada.\\n\\nLes compet\u00e8ncies s\u00f3n avaluades mitjan\u00e7ant avaluaci\u00f3
  continuada.\\n\\nInstruments d''avaluaci\u00f3:\\n\\n- Diferents activitats individuals
  o en grup redu\u00eft. La seva avaluaci\u00f3 es realitza de manera num\u00e8rica
  (0-10) sobre lectura cr\u00edtica de material docent amb un pes d''un 35%. Es presenta
  un dossier reflexiu individual de manera escrita i a trav\u00e9s de medis telem\u00e0tics.\\n-
  Prova escrita que consta d''un exercici de reflexi\u00f3 amb un pes del 65%.\\n\\nLa
  qualificaci\u00f3 de l''assignatura b\u00e9 donada per la mitjana ponderada de les
  notes assolides en aquestes proves, a partir d''una puntuaci\u00f3 m\u00ednima de
  5 sobre 10 en cadascuna d''elles .\\n\\nProva Final global\\n\\nDurant el per\u00edode
  oficial de proves formatives d''avaluaci\u00f3 es programa una prova final global
  per aquells estudiants que no s''hagin presentat a l''avaluaci\u00f3 continuada
  o no l''hagin superat. La puntuaci\u00f3 obtinguda en aquesta prova equival al 100%
  de la qualificaci\u00f3 de la nota final de l''assignatura.\\n\\nInstruments d''avaluaci\u00f3:
  prova escrita de tipus reflexiu.\\n\\nUn cop superada l''assignatura, aquesta no
  pot ser objecte d''una nova avaluaci\u00f3.\\n\\nQualificaci\u00f3:\\n\\n- 0 a 4,9:
  Suspens\\n- 5,0 a 6,9: Aprovat\\n- 7,0 a 8,9: Notable\\n- 9,0 a  10: Excel\u00b7lent\\n\\n_________________________________________________________________________________________________________\\n\\nActivitat
  de recuperaci\u00f3.\\n\\nEs proposa una activitat de recuperaci\u00f3 per a aquells
  estudiants que hagin obtingut una nota final igual o superior a 4,5 i inferior a
  5 sobre 10. Aquesta activitat dona opci\u00f3 a l''aprovat amb un 5.\\n\\nL''activitat
  consistir\u00e0 en el desenvolupament d''un tema del contingut de l''assignatura.\\n\\nNo
  avaluat\\n\\nQuan l''estudiant no hagi aportat prou evid\u00e8ncies que permetin
  una qualificaci\u00f3 global de l''assignatura, en l''acta es consigna la qualificaci\u00f3
  com a \\\"no avaluat\\\".\\n\\nS\u00f3n motiu de manca d''evid\u00e8ncies suficients
  (1+2):\\n\\n1. Si l''estudiant no ha participat en cap activitat de l''avaluaci\u00f3
  continuada.\\n2. Si l''estudiant no es presenta a la Prova final global.\\n\\nRevisi\u00f3
  d''examen\\n\\nUna vegada publicada la nota final, l''examen pot ser revisat per
  l''estudiant en el per\u00edode determinat per a la \\\"revisi\u00f3 d''examen\\\".
