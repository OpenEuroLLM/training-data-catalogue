  Coral \\\"Els Amics\\\"\\n\\nPROGRAMA\\n\\nA les 10,30 del mat\u00ed\\n\\nCERCAVILA
  amb els Gegants, els Nans, els Bastoners, els Esbarts, els m\u00fasics, els Traginers,
  etc.\\n\\nRECORREGUT: Pla\u00e7a del Progr\u00e9s, Arquimedes, Dr. Ull\u00e9s, Parc
  de Sant Jordi, Pi i Margall i arribada a la Pla\u00e7a de la Parr\u00f2quia de la
  Sagrada Fam\u00edlia.\\n\\nNOTA: En arribar al Parc de Sant Jordi es far\u00e0 la
  plantada de l\u2019Arbre Maig per part dels Padrins de la Festa i cant Coral a c\u00e0rrec
  de la Coral Rossinyol.\\n\\nA les 12 del migdia\\n\\nCELEBRACI\u00d3 DE L\u2019EUCARISTIA\\n\\nA
  l\u2019oferitori, Ball dels Gegants de Terrassa i benedicci\u00f3 dels PANS DE LA
  SANTA CREU, dins de l\u2019esgl\u00e9sia.\\n\\nA les 12,30 del migdia\\n\\nBENEDICCI\u00d3
  DE LA CREU DE TERME, pel rector de la Parr\u00f2quia moss\u00e8n Joan Soler.\\n\\nHOMENATGE
  ALS PADRINS DE LA FESTA, Na Dolors Gordi i N\u2019Antoni Romainach (a t\u00edtol
  p\u00f2stum).\\n\\nTRADICIONAL BALL DE LA COCA DE CA N\u2019AURELL.\\n\\nL\u2019ESTAPERA
  DE TERRASSA, pels Bastoners de Terrassa.\\n\\nBALL DE GEGANTS, per totes les parelles
  participants dels Geganters de Terrassa.\\n\\nBALL DEL CASCAVELL I L\u2019ESTAPERA
  DE TERRASSA, per tothom qui vulgui ballar-los.\\n\\nSEGUIDAMENT: Valsets, Polques,
  etc. interpretades pels Ministrils del Raval de Terrassa.\\n\\nGRUPS QUE FAN POSSIBLE
