  "\"LLISTAT PROVISIONAL D''ALUMNES ADMESOS PER A LA REALITZACI\u00d3 DE LES PROVES
  D''ACC\u00c9S A  ENSENYANCES PROFESSIONALS DE M\u00daSICA\\n\\nCONVOCAT\u00d2RIA
  DE  SETEMBRE DE 2017\"", "\"Guia Docent 36313 Treball fi de grau del PDG de Farm\u00e0cia
  i Nutrici\u00f3 Humana i Diet\u00e8tica\\n\\nFITXA IDENTIFICATIVA\\n\\nMat\u00e8ries\\n\\nCoordinaci\u00f3\\n\\nRESUM\\n\\nEl
  Treball Final de Grau \u00e9s una assignatura de 12 cr\u00e8dits ECTS del sis\u00e8
  curs del PDG Farm\u00e0cia-Nutrici\u00f3 Humana i Diet\u00e8tica (PDG Farm\u00e0cia-NHD).\\n\\nEl
  Treball de Final de Grau (TFG) consistir\u00e0 en el desenvolupament aut\u00f2nom
  per part de l''estudiant d''un projecte sota la direcci\u00f3 d''un professor tutor,
  la realitzaci\u00f3 del qual t\u00e9 la finalitat d''afavorir que l''estudiant integre
  els continguts formatius rebuts durant els seus estudis i assegurar l''adquisici\u00f3
  de les compet\u00e8ncies associades a la titulaci\u00f3.\\n\\nEl TFG podr\u00e0
  ser de car\u00e0cter experimental o bibliogr\u00e0fic i haur\u00e0 d''abordar aspectes
  de la titulaci\u00f3 de Farm\u00e0cia i de la titulaci\u00f3 de Nutrici\u00f3 Humana
  i Diet\u00e8tica.\\n\\nEl treball fi de grau ha de ser elaborat de forma individual
  per cada estudiant (la titularitat dels drets de propietat intel\u00b7lectual dels
  treballs Fi de Grau corresponen a l''estudiant que l''ha realitzat i al tutor, en
  coautor\u00eda, d''acord a les disposicions de la llei de propietat intel\u00b7lectual
  de 1996 amb modificacions del 2003, en els seus articles 7 i 8)\\n\\n36313 Treball
  fi de grau del PDG de Farm\u00e0cia i Nutrici\u00f3 Humana i Diet\u00e8tica\\n\\n1\\n\\nGuia
  Docent 36313 Treball fi de grau del PDG de Farm\u00e0cia i Nutrici\u00f3 Humana
  i Diet\u00e8tica\\n\\nCONEIXEMENTS PREVIS\\n\\nRelaci\u00f3 amb altres assignatures
  de la mateixa titulaci\u00f3\\n\\nNo heu especificat les restriccions de matr\u00edcula
  amb altres assignatures del pla d''estudis.\\n\\nAltres tipus de requisits\\n\\nPer
  a la presentaci\u00f3 del Treball Final de Grau es requerir\u00e0 haver superat
  totes les assignatures que integren el pla d''estudis del PDG.\\n\\nPer a poder
  matricular-se del Treball Final de Grau, l''estudiant ha de tenir superats almenys
  300 cr\u00e8dits ECTS.\\n\\nCOMPET\u00c8NCIES\\n\\nRESULTATS DE L''APRENENTATGE\\n\\nSaber
  elaborar una mem\u00f2ria escrita del projecte desenvolupat atenent les normes elaborades
  pel Centre.\\n\\nSaber presentar i defensar davant un tribunal universitari un projecte
  fi de grau que siga el resultat de la integraci\u00f3 dels continguts formatius
  rebuts i les compet\u00e8ncies treballades en les diferents assignatures del PDG.\\n\\nDESCRIPCI\u00d3
  DE CONTINGUTS\\n\\n1. Treball fi de grau\\n\\n- Treballs experimentals relacionats
  amb les dues titulacions, que podran desenvolupar-se en els departaments, laboratoris,
  centres de recerca i afins.\\n\\nEl contingut del Treball fi de Grau podr\u00e0
  correspondre a un els seg\u00fcents tipus:\\n\\n- Treballs de revisi\u00f3 i recerca
  bibliogr\u00e0fica centrats en diferents temes relacionats amb les dues titulacions.\\n-
  Treballs coordinats amb les practiques externes.\\n\\n36313 Treball fi de grau del
  PDG de Farm\u00e0cia i Nutrici\u00f3 Humana i Diet\u00e8tica\\n\\n2\\n\\nGuia Docent
  36313 Treball fi de grau del PDG de Farm\u00e0cia i Nutrici\u00f3 Humana i Diet\u00e8tica\\n\\nVOLUM
  DE TREBALL\\n\\nMETODOLOGIA DOCENT\\n\\nEl TFG ha de ser elaborat de forma individual
  per cada estudiant.\\n\\nL''estudiant disposar\u00e0 de tutories individuals. A
  trav\u00e9s de les quals el tutor/tutors orientaran en la selecci\u00f3 i enfocament
  del tema de treball, maneig de la bibliograf\u00eda i m\u00e8todes de treball m\u00e9s
  \u00fatils per a la realitzaci\u00f3 del projecte, resoldran els dubtes que plantege
  l''alumne i faran un seguiment de la seva activitat.\\n\\nAVALUACI\u00d3\\n\\nLa
  mem\u00f2ria del Treball Fi de Grau a presentar per cada estudiant constar\u00e0
  com a m\u00ednim de:car\u00e1tula (amb el t\u00edtol, nom de l''estudiant, nom del
  tutor, data de presentaci\u00f3n), resum en angl\u00e8s (300 paraules com a m\u00e0xim),
  \u00edndex (general, abreviatures, taules i figures), introducci\u00f3 i antecedents
  del tema, objectius, metodologia de realitzaci\u00f3, resultats, discussi\u00f3,
  conclusions i bibliografia i tindr\u00e0 una extensi\u00f3 m\u00ednima de 30 p\u00e0gines
  numerades, escrites en lletra Times New Roman o similar, de 12 punts, a 1,5 espais
  d''interlineat, en fulles Din-A4 de 2.5 cm de marge en els 4 costats.\\n\\nEl TFG
  es lliurar\u00e0 enquadernat (no grapat) pel costat llarg. Podr\u00e0 estar escrit
  en qualsevol de les lleng\u00fces oficials de la Universitat o en angl\u00e8s. En
  aquest \u00faltim cas ha de contenir un resum en castell\u00e0 o en valenci\u00e0.\\n\\nEl/la
  estudiant haur\u00e0 de presentar tres exemplars impresos de la mem\u00f2ria final
  i una c\u00f2pia digital correctament identificada en la Secretaria de la Facultat.
  No es podr\u00e0 procedir a l''emissi\u00f3 del T\u00edtol corresponent fins que
  es comprove la integritat de la c\u00f2pia digital.\\n\\nEl Treball fi de Grau ser\u00e0
  avaluat per una comissi\u00f3 nomenada a aquest efecte per la Comissi\u00f3 de TFG
  per a cada curs acad\u00e8mic. La defensa del Treball Fi de Grau ser\u00e0 realitzada
  per els/les estudiants i ser\u00e0 p\u00fablica. El/la estudiant disposar\u00e0
  d''un m\u00e0xim de 15 minuts per a exposar el seu treball i la Comissi\u00f3 debatr\u00e0
  amb ell/ella durant un m\u00e0xim de 15 minuts al voltant del treball.\\n\\nLa qualificaci\u00f3
  ser\u00e0 el resultat de l''informe del tutor o tutora (30%) i l''avaluaci\u00f3
  de la Comissi\u00f3 (70%).\\n\\nL''avaluaci\u00f3 tindr\u00e0 en consideraci\u00f3:
  la qualitat cient\u00edfica; la claredat expositiva, tant escrita com oral i la
  capacitat de debat i defensa de la mem\u00f2ria. L''avaluaci\u00f3 de la Comissi\u00f3
  ser\u00e0 la mitjana de les avaluacions dels membres de la comissi\u00f3.\\n\\n36313
  Treball fi de grau del PDG de Farm\u00e0cia i Nutrici\u00f3 Humana i Diet\u00e8tica\\n\\n3\\n\\nGuia
  Docent 36313 Treball fi de grau del PDG de Farm\u00e0cia i Nutrici\u00f3 Humana
  i Diet\u00e8tica\\n\\nLes normes per a l''elaboraci\u00f3 de la mem\u00f2ria, els
  criteris de valoraci\u00f3 de la comissi\u00f3 d''avaluaci\u00f3 i els documents
  per a la valoraci\u00f3 del tutor i convocat\u00f2ries per a la presentaci\u00f3
  es poden consultar en la p\u00e0gina web del PDG apartat TFG.\\n\\n-  - Reglament
  Treball Fi de Grau de la UV: ACGUV 299/2011\\n\\n4\"", "\"1. Dades B\u00e0siques\\n\\n|
