  2008\\n```\\n\\nDES\u00c9.- RESOLUCI\u00d3 D''AL\u00b7LEGACIONS I APROVACI\u00d3
  PROVISIONAL, SI S''ESCAU, DE LA MODIFICACI\u00d3 PUNTUAL DE LES NORMES SUBSIDIARIES
  EN L''\u00c0MBIT DE LA UA6 I MILLORA DELS ACCESSOS VINCULATS\\n\\nEl grup municipal
  CiU presenta la seg\u00fcent proposta:\\n\\n\\\"Vist l''expedient relatiu a la Modificaci\u00f3
  Puntual de les Normes Subsidi\u00e0ries en l''\u00e0mbit de la UA6 i millora dels
  accessos vinculats.\\n\\nAt\u00e8s que en sessi\u00f3 plen\u00e0ria de data 18 de
  desembre de 2007, l''Ajuntament en Ple, va aprovar inicialment l''expedient de Modificaci\u00f3
  Puntual de les Normes Subsidi\u00e0ries en l''\u00e0mbit de la UA6 i millora dels
  accessos vinculats.\\n\\nAt\u00e8s que l''esmentada aprovaci\u00f3 inicial va ser
  sotmesa a informaci\u00f3 p\u00fablica, amb les corresponents insercions d''anuncis
  en els diaris oficials: Butllet\u00ed Oficial de la Prov\u00edncia, n\u00famero
  310, de data 27 de desembre de 2007; Diari Oficial de la Generalitat, n\u00famero  5039,
  de data 2 de gener de 2008; Avui, de data 21 de desembre de 2007, aix\u00ed com
  en el Tauler d''anuncis de la Corporaci\u00f3.\\n\\nVist que dins del termini d''exposici\u00f3
  p\u00fablica s''han presentat les al\u00b7legacions que consten a l''expedient,
  les quals han estat informades pel t\u00e8cnic municipal, segons consta en l''informe
  a tal finalitat evacuat, de data 4 de mar\u00e7 de 2008, informe que s''incorpora
  a l''expedient per a formar part integrant del mateix.\\n\\nRelaci\u00f3 d''al\u00b7legacions
  presentades a l''aprovaci\u00f3 inicial de la modificaci\u00f3 de les Normes Subsidi\u00e0ries
  de Planejament en l''\u00e0mbit de la UA6 i millora dels accessos vinculats.\\n\\n1.-
  Josep Jorba Pons, com a portaveu del grup municipal ApC, el qual manifesta, el seg\u00fcent:\\n\\nPrimer.-
  Es diu que no es necess\u00e0ria la creaci\u00f3 de mes sol urb\u00e0 residencial
  en el municipi.\\n\\nSegon.-  Que en aquesta Unitat d''actuaci\u00f3 ja es va tramitar
  una modificaci\u00f3 d''usos residencial a serveis i ara es trona a realitzar un
  nou canvi a la inversa.\\n\\nTercer.- Que es inoport\u00fa tramitar aquesta modificaci\u00f3
  puntual i que s''ha d''esperar a la aprovaci\u00f3 total i definitiva del Pla Director.\\n\\nQuart.-
  En la documentaci\u00f3 presentada no s''ha tingut en compte cap dels criteris i
  articles que disposa la Llei 16/2002 de 28 de juny, de protecci\u00f3 contra la
  contaminaci\u00f3 ac\u00fastica.\\n\\nCinqu\u00e8.- No consta a l''expedient cap
  tipus d''informe mediambiental.\\n\\nSis\u00e8.- No es contempla ni es preveu el
  torrent que delimita la unitat d''actuaci\u00f3 per l''oest.\\n\\nPer tot all\u00f2
  que s''ha exposat, es proposa al Ple l''adopci\u00f3 del seg\u00fcent acord:\\n\\nPrimer.-
  Estimar les seg\u00fcents al\u00b7legacions:\\n\\nCinquena: Es sol\u00b7licitar\u00e0  al
  promotor un informe medioambiental, que s''inclour\u00e0 a l''expedient.\\n\\nSegon.-
  Desestimar la resta d''al\u00b7legacions formulades.\\n\\nPel que fa als punts 1,
  2, 3 i 6 de l''escrit d''al\u00b7legacions del senyor Josep Jorba cal dir que no
  procedeix \u00e9sser estimats o desestimats, ja que el seu contingut \u00e9s informatiu
  i expressen parers, sense sol\u00b7licitar res en concret.\\n\\nPel que fa al punt
  4 es creu que no es el moment processal adequat, tenint en compte que el que s''est\u00e0
  realitzant ara \u00e9s l''aprovaci\u00f3 provisional de la modificaci\u00f3 puntual
  de les Normes Subsidi\u00e0ries en aquest \u00e0mbit.\\n\\nTercer.- Aprovar provisionalment
  la Modificaci\u00f3 Puntual de les Normes Subsidi\u00e0ries en l''\u00e0mbit de
  la UA6 i millora dels accessos vinculats, d''acord amb all\u00f2 previst a  l''article
  83 de la Llei 2/2002, de 14 de mar\u00e7 d''Urbanisme\\n\\nQuart.- Trametre l''expedient
  a tal efecte instru\u00eft, a la Comissi\u00f3 d''Urbanisme de Barcelona, als efectes
  de la seva aprovaci\u00f3 definitiva, si s''escau\\n\\nCinqu\u00e8.-  Notificar
  personalment als al\u00b7legadors la resoluci\u00f3 adoptada, advertint-los que
  l''acord adoptat constitueix un acte tr\u00e0mit, que no esgota la via administrativa\\n\\nEl
  Sr. Josep Centellas manifesta que el seu grup votar\u00e0 en contra perqu\u00e8
  no estan d''acord amb els par\u00e0metres generals d''aquesta Unitat d''Actuaci\u00f3,
  tal i com han manifestat en altres sessions plen\u00e0ries.\\n\\nEs procedeix a
  la votaci\u00f3, aprovant-se la proposta per 4 vots a favor del grup municipal CiU
  i tres en contra del grup municipal ApC\\n\\nONZ\u00c9.- APROVACI\u00d3, SI S''ESCAU,
  DE LES FRAS 1401 I 1505 DE CONSTRUCTORA DE CALAF.\\n\\nL''Alcalde explica que la
  fra. 1175 per import de 10.210,54 \u20ac aprovada anteriorment pel Ple, correspon
  a la partida 4.09 del projecte aprovat, concretament a l''equip de control, i que
  no est\u00e0 sumada en aquest, per error.\\n\\nLa fra. 1401 per import de 6.728,85
  \u20ac correspon a l''equip de bombament.\\n\\nEl Ple per unanimitat acorda:\\n\\nPrimer.-
  Aprovar les factures corresponent a l''obra d''ampliaci\u00f3 de la xarxa d''aigua
  Castellol\u00ed sud, de Constructora de Calaf, n\u00fam. 1401 per import de 6.728,85
  \u20ac i la fra. 1505 d''abonament, per import de \u2013 821,58 \u20ac.\\n\\nSegon.-
  Disposar el pagament de les esmentades factures.\\n\\nDOTZ\u00c9.- APROVACI\u00d3,
  SI S''ESCAU, DE LA CERTIFICACI\u00d3 N\u00daM 5 I \u00daLTIMA DE L''OBRA : URBANITZACI\u00d3
  DE LA UNITAT D''ACTUACI\u00d3 IV I TRAMS DE CARRERS COMPLEMENTARIS. SECTOR FORA
  DE LA UA.\\n\\nPer part del grup municipal CiU es presenta la seg\u00fcent proposta
  :\\n\\nPrimer.- Aprovar la certificaci\u00f3 n\u00fam. 5 i \u00faltima de l''empresa
  Constructora de Calaf Sau corresponent a l''obra URBANITZACI\u00d3 DE LA UA IV I
  TRAMS DE CARRERS COMPLEMENTARIS. SECTOR FORA DE LA UA, per un import de 16.885,10
  \u20ac (setze mil vuit-cents vuitanta-cinc amb deu euros)\\n\\nSegon.- Disposar
  el pagament de l''esmentada certificaci\u00f3.\\n\\nL''Alcalde explica que fins
  ara no s''ha donat conformitat a la factura per part de l''arquitecte municipal
  i per aquest motiu la certificaci\u00f3 es de data octubre de 2006 i fins ara no
  s''ha fet la proposta d''aprovaci\u00f3 al Ple.\\n\\nEl Sr. Josep Jorba manifesta
  que creu que el procediment es irregular i que el vot de grup ApC ser\u00e0 l''abstenci\u00f3.\\n\\nEs
  procedeix a la votaci\u00f3 aprovant-se per 4 vots a favor del grup municipal CiUi
  3 abstencions del grup municipal ApC.\\n\\nTRETZ\u00c8.- APROVACI\u00d3 DE FALLITS
  PRESENTATS PER L''ORGT\\n\\nUn cop realitzats tots els tr\u00e0mits reglamentaris
  per part de l''Organisme de Gesti\u00f3 Tributaria pel cobrament de la relaci\u00f3
  08009 i 07019, el Ple, amb 4 vots a favor del grup municipal CiU i 3 en contra del
  grup municipal ApC acorda:\\n\\nPrimer.- Aprovar la relaci\u00f3 de fallits n\u00fam.
  08009 per  un import  de 122,02 Euros i la relaci\u00f3 n\u00fam. 07019 per un import
  de 12,74 \u20ac\\n\\nSegon.- Notificar aquest acord a l''ORGT\\n\\nCATORTZ\u00c8.-
  DONAR SUPORT AL CORRELLENGUA 2008\\n\\nL''\u00fas social del catal\u00e0 segueix
  disminuint any rera any arreu dels Pa\u00efsos Catalans. Per aquest motiu, des de
  la Coordinadora d''Associacions per la Llengua Catalana (CAL) volem donar un nou
  impuls a la normalitzaci\u00f3 de la nostra llengua per mitj\u00e0 de la dotzena
  edici\u00f3 del Correllengua. Una tasca que requereix de l''esfor\u00e7 de tothom.
  Nom\u00e9s d''aquesta manera podrem garantir que el catal\u00e0 sigui una llengua
  viva i amb futur en un m\u00f3n cada cop m\u00e9s globalitzat.\\n\\nAtesa la marginaci\u00f3
  que rep el catal\u00e0 per part de les institucions estatals i comunit\u00e0ries.\\n\\nAtesa
  la necessitat d''assolir la plena normalitat del catal\u00e0 arreu del territori,
  convertint-la en la llengua vehicular i comuna de la nostra societat, i en l''element
  d''integraci\u00f3 de les persones nouvingudes.\\n\\nAtesa la consolidaci\u00f3
  que despr\u00e8s de deu anys, est\u00e0 assolint la iniciativa c\u00edvica del Correllengua
  gr\u00e0cies al suport d''ajuntaments, consells comarcals, associacions i societat
  civil en general,\\n\\nAtesa la voluntat de la Coordinadora d''Associacions per
  la Llengua (CAL), organitzadora del Correllengua, de ratificar i augmentar aquests
  suports i arribar a tots els municipis i comarques de parla catalana,\\n\\nAt\u00e8s
  el comprom\u00eds amb la llengua catalana que sempre ha caracteritzat aquest municipi,\\n\\nEl
  Ple per unanimitat acorda:\\n\\nPrimer.- Donar suport al Correllengua 2008 com un
  instrument reivindicatiu de la societat a favor de la plena normalitzaci\u00f3 i
  de l''\u00fas social de la llengua catalana arreu dels territoris de parla catalana
  i a favor del respecte a la seva unitat.\\n\\nSegon.- Donar suport a la necessitat
  d''un nou marc legislatiu per a la nostra llengua, que es concreti amb una nova
  llei de Pol\u00edtica ling\u00fc\u00edstica.\\n\\nTercer.- Donar suport a les entitats
  i grups del municipi interessats en organitzar el Correllengua i aportar la infraestructura
  i l''ajuda necess\u00e0ria per al normal desenvolupament de les activitats programades.\\n\\nQuart.-
  Fer p\u00fablica aquesta iniciativa i estendre-la a tots els \u00e0mbits que siguin
  propis d''aquesta corporaci\u00f3, i concretament a les entitats del municipi.\\n\\nCinqu\u00e8.-
  Fer una aportaci\u00f3 econ\u00f2mica general per a l''organitzaci\u00f3 dels actes
  i el bon funcionament de Correllengua 2008 i una aportaci\u00f3 econ\u00f2mica a
  les entitats del municipi que, en el seu cas, organitzin actes del Correllengua
  2008.\\n\\nSis\u00e8.- Fer arribar aquest acord a la seu nacional de la Coordinadora
  d''Associacions per la Llengua (CAL), al carrer Santa Perp\u00e8tua, 15 baixos,
  08012-Barcelona, i als organitzadors del pas del Correllengua pel municipi.\\n\\nLa
  Sra. Montserrat Costa pregunta quan ser\u00e0 la reuni\u00f3 pr\u00e8via e l''organitzaci\u00f3
  dels actes.\\n\\nEl Sr. Joel Jorba respon que encara no ho sap.\\n\\nQUINZ\u00c8.-
  APROVACI\u00d3, SI S''ESCAU, DE LA FRA 661 DE TIURANA INSTAL\u00b7LACIONS I MANTENIMENT
  SL\\n\\nPer part del grup municipal CiU es presenta la seg\u00fcent proposta:\\n\\nPrimer.-
  Aprovar la factura n\u00fam. 661 corresponent a les instal\u00b7lacions extres de
  l''edifici de la Brillante, de Tiurana Instal\u00b7lacions i manteniment SL, per
  import de 63904,34 \u20ac.\\n\\nSegon.- Disposar el pagament de les esmentades factures.\\n\\nEl
  Sr. Josep Jorba manifesta que 60.000 \u20ac d''imprevistos, extres o millores superen
  el 10 i el 20% de l''import d''adjudicaci\u00f3, sense fer un modificat ni canvi
  de projecte que justifiqui aquests canvis. No sabem quins criteris s''han seguit
  per fer aquest canvis. Per tot aix\u00f2 votarem en contra de l''aprovaci\u00f3
  de la fra. Demano un informe per part de la Sra. Secret\u00e0ria on consti si era
  o no necessari fer un modificat de projecte.\\n\\nEs procedeix a la votaci\u00f3
  aprovant-se per 4 vots a favor del grup municipal CiU i 3 en contra del grup municipal
  ApC.\\n\\nSETZ\u00c9.- APROVACI\u00d3, SI S''ESCAU, DE L''ORDENAN\u00c7A REGULADORA
  DE LA TAXA PER LA PRESTACI\u00d3 DEL SERVEI D''ACOLLIDA MATINAL D''INFANTS\\n\\nLa
  Llei 39/1988, de 28 de desembre, reguladora de les Hisendes Locals estableix en
  els seus articles 15 a 19 el procediment per a l''aprovaci\u00f3 i modificaci\u00f3
  de les Ordenances fiscals reguladores dels tributs locals.\\n\\nEn el cas d''imposici\u00f3
  de nous tributs, les Ordenances fiscals hauran d''aprovar-se simult\u00e0niament
  a l''adopci\u00f3 dels respectius acords d''imposici\u00f3. L''article 16.1 del
  text legal esmentat estableix que les Ordenances fiscals contindran com a m\u00ednim
  la determinaci\u00f3 dels elements tributaris, el r\u00e8gim de declaraci\u00f3
  i d''ingr\u00e9s, aix\u00ed com les dates d''aprovaci\u00f3 i d''inici de la seva
  aplicaci\u00f3.\\n\\nEl Ple, per unanimitat acorda:\\n\\nPrimer.- Imposar la taxa
  per la prestaci\u00f3 del servei d''acollida matinal d''infants.\\n\\nSegon.- Exposar
  al p\u00fablic en el tauler d''anuncis de l''Ajuntament l''anterior acord provisional,
  aix\u00ed com el text complet de les Ordenances fiscals aprovades de nou o modificades
  durant el termini de trenta dies h\u00e0bils, comptats des del dia seg\u00fcent
  al de la publicaci\u00f3 de l''anunci d''exposici\u00f3 en el Butllet\u00ed Oficial
  de la Prov\u00edncia.\\n\\nDurant el per\u00edode d''exposici\u00f3 p\u00fablica
  de les Ordenances, els qui tinguin un inter\u00e8s directe o resultin afectats,
  en els termes previstos a l''article 18 de la Llei 39/1988, podran examinar l''expedient
  i presentar-hi les reclamacions que estimin oportunes. Transcorregut el per\u00edode
  d''exposici\u00f3 p\u00fablica sense haver-se presentat reclamacions, els acords
  adoptats restaran definitivament aprovats.\\n\\nText de l''ordenan\u00e7a\\n\\nArticle
  1. Fonament i naturalesa\\n\\nA l''empara del previst als articles 58 i 20.4.\u00f1)
  de la Llei 39/1988, de 28 de desembre, reguladora de les Hisendes Locals, de conformitat
  amb el que disposen els articles 15  a 19 d''aquest text legal, aquest Ajuntament
  estableix la taxa per la prestaci\u00f3 del servei d''acollida matinal d''infants
  al CEIP les Passeres, que es regir\u00e0 per la present Ordenan\u00e7a.\\n\\nArticle
  2. Fet imposable\\n\\nConstitueix el fet imposable de la taxa, la prestaci\u00f3
  del servei d''acollida matinal d''infants. Aquest servei ha de possibilitar la realitzaci\u00f3
  d''activitats l\u00fadiques, art\u00edstiques o esportives, la lectura i l''\u00fas
  de la biblioteca o altres instal\u00b7lacions del centre, amb exclusi\u00f3 de les
  activitats pr\u00f2pies dels programes escolars.\\n\\nArticle 3. Subjectes passius\\n\\n1.
  S\u00f3n subjectes passius de la taxa, en concepte de contribuents, les persones
  f\u00edsiques que sol\u00b7licitin o es benefici\u00efn de la prestaci\u00f3 de
  serveis o realitzaci\u00f3 de les activitats d''ensenyament i altres complementaris.\\n\\n2.
  Estaran obligats al pagament del la taxa els pares o tutors dels menors alumnes
  del CEIP LES PASSERES.\\n\\nArticle 4. Responsables\\n\\n1. S\u00f3n responsables
  tributaris les persones f\u00edsiques i jur\u00eddiques determinades com a tals
  a la Llei General Tribut\u00e0ria i a l''Ordenan\u00e7a General.\\n2. La derivaci\u00f3
  de responsabilitat requerir\u00e0 que, pr\u00e8via audi\u00e8ncia de l''interessat,
  es dicti acte administratiu, en els termes previstos a la Llei General Tribut\u00e0ria.\\n\\nArticle
  5. Beneficis fiscals\\n\\n1. No existeixen beneficis fiscals.\\n\\nArticle 6. Quota
  tribut\u00e0ria\\n\\n1. La quantia de la taxa es determinar\u00e0 aplicant les tarifes
  seg\u00fcents:\\n- Servei d''acollida de 8 a 9 hores: 42 euros mensuals\\n- Hora
  eventual:3 euros/hora.\\n\\nArticle 7. Acreditament i per\u00edode impositiu\\n\\n1.
  En el cas que la sol\u00b7licitud del servei s''estengui a varis mesos, la taxa
  s''acreditar\u00e0 quan s''inici\u00ef la realitzaci\u00f3 de l''activitat que constitueix
  el fet imposable.\\n\\nAmb car\u00e0cter previ a l''inici del servei s''haur\u00e0
  de dipositar l''import corresponent al pagament del primer per\u00edode mensual
  de prestaci\u00f3\\n\\nArticle 8. R\u00e8gim de declaraci\u00f3 i d''ingr\u00e9s\\n\\n1.
  La taxa s''exigir\u00e0 en r\u00e8gim d''autoliquidaci\u00f3.\\n2. Quan es sol\u00b7licita
  la prestaci\u00f3 del servei,  es presentar\u00e0 degudament complimentat l''impr\u00e8s
  d''autoliquidaci\u00f3 de la taxa.\\n\\nAlternativament, poden presentar-se en el
  Servei Municipal corresponent els elements de la declaraci\u00f3 a l''objecte que
  el funcionari municipal competent presti l''assist\u00e8ncia necess\u00e0ria per
  a determinar el deute.\\n\\n3. L''ingr\u00e9s de la quota tribut\u00e0ria s''efectuar\u00e0
  simult\u00e0niament a la presentaci\u00f3 de l''autoliquidaci\u00f3.\\n4. Tractant-se
  de la taxa per serveis d''acollida que s''estenen al llarg de varis mesos, un cop
  transcorregut el primer mes natural seg\u00fcent a la data d''inici de la prestaci\u00f3
  del servei, caldr\u00e0 pagar la quota mensual durant els primers cinc dies de cada
  mes.\\n5. El pagament de la taxa es podr\u00e0 fer mitjan\u00e7ant domiciliaci\u00f3
  banc\u00e0ria, que sol\u00b7licitar\u00e0 l''interessat en les oficines municipals.
  La quota per hora eventual es realitzar\u00e0 el mateix dia pel qual es demana el
  servei.\\n6. Les quotes liquidades i no satisfetes s''exigiran per la via de constrenyiment.\\n7.
  Quan es cessi en la recepci\u00f3 del servei, es retornar\u00e0 al subjecte passiu
  la quantia dipositada i no aplicada al pagament de la taxa o d''altres responsabilitats.\\n\\nArticle
  9. Infraccions i sancions\\n\\nPel que respecta a les infraccions i sancions tribut\u00e0ries
  que, en relaci\u00f3 a la taxa reguladora en aquesta Ordenan\u00e7a, resultin procedents,
  s''aplicar\u00e0 el que disposa la Llei General Tribut\u00e0ria i l''Ordenan\u00e7a
  General.\\n\\nDisposici\u00f3 Addicional. Modificaci\u00f3 dels preceptes de l''ordenan\u00e7a
  i de les refer\u00e8ncies que fa a la normativa vigent, amb motiu de la promulgaci\u00f3
  de normes posteriors\\n\\nEls preceptes d''aquesta Ordenan\u00e7a fiscal que, per
  raons sistem\u00e0tiques reprodueixin aspectes de la legislaci\u00f3 vigent i altres
  normes de desenvolupament, i aquells en qu\u00e8 es facin remissions a preceptes
  d''aquesta, s''entendr\u00e0 que s\u00f3n autom\u00e0ticament modificats i/o substitu\u00efts,  en
  el moment en qu\u00e8 es produeixi la modificaci\u00f3 dels preceptes legals i reglamentaris
  de qu\u00e8 porten causa.\\n\\nDisposici\u00f3 final\\n\\nLa present Ordenan\u00e7a
  fiscal, aprovada provisionalment pel Ple de la Corporaci\u00f3 en sessi\u00f3 celebrada
  el                              i que ha quedat definitivament aprovada, entrar\u00e0
  en vigor al dia seg\u00fcent al de publicaci\u00f3 en el Butllet\u00ed Oficial de
  la Prov\u00edncia i regir\u00e0 fins la seva modificaci\u00f3 o derogaci\u00f3 expressa.\\n\\nDISET\u00c9.-
  SOL\u00b7LICITUD DE SUBVENCI\u00d3 PER A LA REALITZACI\u00d3 D''INVERSIONS PER A
  L''EXECUCI\u00d3 D''ACTUACIONS D''ABASTAMENT EN ALTA.\\n\\nAtesa la Resoluci\u00f3
  MAH/1014/2008, d''1 d''abril, per la qual es fa p\u00fablica la convocat\u00f2ria
  de subvencions adre\u00e7ades als ens locals per a la realitzaci\u00f3 d''inversions
  per a l''execuci\u00f3 d''actuacions d''abastament en alta.\\n\\nAt\u00e8s que l''Ajuntament
  de Castellol\u00ed ha redactat el Pla Director d''Abastament d''Aigua.\\n\\nAt\u00e8s
  que l''esmentat Pla Director proposa una s\u00e8rie d''actuacions de millora de
  les instal\u00b7lacions i entre aquestes la instal\u00b7laci\u00f3 d''una xarxa
  de comptadors generals de sortida de dip\u00f2sit.\\n\\nPer tot l''exposat el Ple
  per unanimitat acorda:\\n\\nPrimer.- Sol\u00b7licitar a l''Ag\u00e8ncia Catalana
  de l''Aigua un subvenci\u00f3 per import de 34.093,79 euros ( trenta-quatre mil
  noranta-tres amb setanta-nou euros), per a la instal\u00b7laci\u00f3 de comptadors
  generals de sortida de dip\u00f2sit.\\n\\nSegon.- Comunicar aquest acord a l''Ag\u00e8ncia
  catalana de l''Aigua\\n\\nDIVUIT\u00c9.- PRECS I PREGUNTES\\n\\nEl Sr. Josep Jorba
  manifesta que s''han donat compte de decrets autoritzant, de forma repetitiva, les
  actuacions esportives al Parcmotor, entenc que dins de l''\u00e0mbit del Parcmotor
  el tema hauria d''estar legalitzat.\\n\\nEl Sr. Alcalde respon que s''han d''autoritzar
  sempre les activitats de competici\u00f3, no les activitats l\u00fadiques i d''oci.\\n\\nEl
  Sr. Josep Jorba manifesta que en relaci\u00f3 al Decret 33 d''autoritzaci\u00f3
  provisional a l''empresa POKET BIKE , creu que no es una manera molt clara de donar
  un perm\u00eds, i pregunta que passar\u00e0 quan el perm\u00eds provisional caduqui.\\n\\nL''Alcalde
  manifesta que el problema d''aquesta instal\u00b7laci\u00f3 es que va vinculada
  a unes mesures correctores de l''\u00e0mbit general del Parcmotor que encara no
  s''han dut a terme, i altres mesures que s\u00f3n concretes de la instal\u00b7laci\u00f3.
  Si quan caduqui el perm\u00eds provisional no hi ha les mesures correctores general,
  s''haur\u00e0 d''acordar si es fa un altre perm\u00eds provisional o si es poden
  posar unes mesures correctores compensat\u00f2ries. L''Ajuntament est\u00e0 vetllant
  perqu\u00e8 Parcmotor executi les mesures correctores generals el m\u00e9s r\u00e0pid
  possible.\\n\\nEl Sr. Josep Jorba fa un comentari gen\u00e8ric de l''aplicaci\u00f3
  de la disciplina urban\u00edstica per part de l''equip de govern, i manifesta el
  seu desacord en tres casos concrets en que a un es paralitzant unes obres i posteriorment
  s''autoritzen, en un altre cas es paralitzant les obres i posteriorment s''obre
  un expedient sancionador i no es dona el perm\u00eds d''obres, i en un altre cas
  primer existeix una den\u00fancia de l''Associaci\u00f3 de ve\u00efns per abocament
  de runes en una parcel\u00b7la, no hi ha paralitzaci\u00f3 d''aquesta activitat
  i es dona perm\u00eds de rebliment d''aquest solar, i pregunta com aplica l''Ajuntament
  la  disciplina urban\u00edstica.\\n\\nL''Alcalde respon que cada expedient s''hauria
  de mirar en cada situaci\u00f3, per\u00f2 creu que no es el mateix fer una part
  d''obres que no estan incloses en la llic\u00e8ncia atorgada, o fer unes obres sense
  cap tipus de llic\u00e8ncia, ni tampoc fer un rebliment de terreny d''una obra associada
  a una llicencia atorgada, concretament en aquest cas en obres que cal fer un rebliment
  no es demana una llic\u00e8ncia apart perqu\u00e8 s''ent\u00e9n que ja est\u00e0
  previst en el projecte i contemplat en la llic\u00e8ncia d''obres.\\n\\nEl Sr. Josep
  Jorba pregunta si el rebliment de terres en la zona de Sant Feliu te perm\u00eds
  i fian\u00e7a, perqu\u00e8 els camions passen pel cam\u00ed asfaltat i el poden
  fer malb\u00e9.\\n\\nL''Alcalde respon que te llic\u00e8ncia concedida i l''aval
  demanat.\\n\\nEl Sr. Josep Centellas pregunta si quedar\u00e0 vorera en els dos
  sentits en la baixada del C/ de la Pau cap a l''Escola i demana que els t\u00e8cnics
  estudi\u00efn aquest tema.\\n\\nL''Alcalde manifesta que aquest carrer, en el seu
  moment, ser\u00e0 de direcci\u00f3 \u00fanica i ser\u00e0 possible fer voravies
  a les dues bandes. Mentre tingui que ser de dues direccions, no s''ha decidit quina
  ser\u00e0 la soluci\u00f3 ha adoptar, per\u00f2 en qualsevol cas s''adoptar\u00e0
  alguna protecci\u00f3 pels vianants.\\n\\nEl Sr. Vicen\u00e7 Jorba manifesta que
  li costa creure que no es vulgui mirar a tothom per igual. Que si el President d''una
  Associaci\u00f3 den\u00fancia uns fets, justament aquesta persona hauria de tenir
  m\u00e9s cura de no inc\u00f3rrer en cap proc\u00e9s o mala conducta.\\n\\nEl Sr.
  Josep Jorba manifesta que ell no defensa persones, que preguntava per actituds de
  l''equip de govern.\\n\\nL''Alcalde manifesta que ell intenta que no influeixin
  les relacions personals en les decisions que pren i que ha justificat les diferencies
  que presenten els casos comentats.\\n\\nI no havent-hi  altres assumptes que tractar,
  el Sr. Alcalde - President aixeca la sessi\u00f3 essent les vint-i-dues hores del
  dia de la data. En dono fe. La Secret\u00e0ria.\"", "\"La ciutat de la nostra vida\\n\\nText
  > rosa maria gil tort\\n\\nSovint cal una certa perspectiva per analitzar les coses.
  En l''urbanisme, com a fruit d''un planejament pol\u00edtic en l''accepci\u00f3
  m\u00e9s c\u00edvica, d''una participaci\u00f3 ciutadana que fa seus els espais
  urbans, i del pas del temps, que confi rma o desbarata previsions a parts iguals,
  aquesta perspectiva \u00e9s imprescindible.\\n\\nAquest llibre se situa en un escenari
  din\u00e0mic en el qual, gr\u00e0cies a l''adveniment de la democr\u00e0cia, una
  ciutat de prov\u00edncies, revellida per\u00f2 amb una pru\u00efja d''esdevenir
  estrat\u00e8gica al nord del pa\u00eds, decideix fer endre\u00e7a i expiar els pecats
  d''etapes anteriors. Canviar de pell, de vocaci\u00f3 i de tarann\u00e0, tot alhora,
  d''una manera pautada i ordenada.\\n\\nL''autor d''aquest petit gran llibre, ge\u00f2graf
  de formaci\u00f3, gestor pol\u00edtic de vocaci\u00f3 i t\u00e8cnic municipal de
  professi\u00f3, fa una an\u00e0lisi acurada d''onze grans espais ciutadans, forjats
  entre els anys 1979 i 2010, que han confi gurat la Girona del segle xxi. Per a alguns
  observadors, aquest segle va comen\u00e7ar la primavera del 2020 amb el confi nament
  causat per la covid, i d''aquesta adaptaci\u00f3 a la nova realitat, el llibre tamb\u00e9
  en recull les beceroles.\\n\\nQueda desxifrada aix\u00ed la genealogia de la pla\u00e7a
  de l''U d''Octubre, del parc Central, del sector dels Qu\u00edmics, del per a les
  senyores barcelonines era un moment de llibertat i d''activitat social en comparaci\u00f3
  amb la vida m\u00e9s aviat mon\u00f2tona que feien durant els mesos m\u00e9s freds
  de l''any a Barcelona.\\n\\nL''estiueig a la Cerdanya \u00e9s tamb\u00e9 un rep\u00e0s
  hist\u00f2ric dels noms de les principals fam\u00edlies estiuejadores d''aquesta
  comarca pirinenca (per posar-ne un exemple, la fam\u00edlia Andreu, la de les famoses
  pastilles per a la tos del Dr. Andreu); sense molts d''aquests noms, segurament
  la Cerdanya no seria com la coneixem avui dia. Un altre punt per destacar \u00e9s
  com l''autora fa una revisi\u00f3 exhaustiva de les instal\u00b7lacions i les activitats
  que es van anar implantant a la comarca amb l''arribada del turisme:\\n\\nparc del
  Migdia, de les ribes del Ter, de la Devesa, de Domeny de Baix, del parc N\u00faria
  Ter\u00e9s, del Parc Cient\u00edfi c i dels boscos de la Vora. Els onze espais relatats,
  que en realitat serien deu m\u00e9s un, perqu\u00e8 el Barri Vell hi \u00e9s sense
  serhi, esdevenen el tauler de joc de la democr\u00e0cia municipal, que segons Sastre
  va confi gurar la Girona que coneixem. L''autor explica amb la precisi\u00f3 del
  cirurgi\u00e0 aquest puzle urb\u00e0 que ha esdevingut la casa de cent mil gironins.
  Una ciutat que, amb el guiatge de Joaquim Nadal i un equip decidit de t\u00e8cnics
  i pol\u00edtics, va canviar com una mitja de la Girona grisa i negra a la Girona
  viva i de colors.\\n\\nEl llibre \u00e9s de bon llegir, interessant i ben documentat.\\n\\nGirona
  va somiar l''excel\u00b7l\u00e8ncia en els anys trenta del segle passat gr\u00e0cies
  a alguns pol\u00edtics i arquitectes il\u00b7lustrats i clarividents. Va venir el
  malson de la guerra i quaranta anys de plom, que van trastocar valors i prioritats.
  Tot passa, per\u00f2, i una generaci\u00f3 nova de pol\u00edtics i de t\u00e8cnics
  va reprendre el somni. A partir del 1980 l''estrat\u00e8gia pol\u00edtica, l''imaginari
  recuperat del coneixement hist\u00f2ric, la utopia social i les din\u00e0miques
  particulars van negociar amb el futur. Pel llibre desfi len espais i sectors renovellats,
  projectes, reptes, imatges i centres de salut, camps de golf, h\u00edpiques, pistes
  d''esqu\u00ed, l''arribada del ferrocarril o la construcci\u00f3 de m\u00e9s torres
  d''estiueig, entre d''altres. I no nom\u00e9s aix\u00f2: al voltant de l''estiueig
  tamb\u00e9 es teixia i es teixeix una xarxa d''actes culturals, de festes p\u00fabliques
  i privades que tamb\u00e9 eren i s\u00f3n bressol de negocis nous entre els estiuejants
  .\\n\\nEl resultat de la investigaci\u00f3 de Sandra Adam es plasma en aquest \u00e0lbum-llibre,
  que t\u00e9 un gran inter\u00e8s per als cerdans i els no cerdans, ja que \u00e9s
  un document hist\u00f2ric de com un fenomen com l''estiueig (i l''hiverneig) poden
  transformar el paisatge i l''economia d''una comarca; un fenomen que encara continua
  vigent i no exempt de pol\u00e8mica.\\n\\nsomnis amb una cad\u00e8ncia pautada:
  el projecte inicial, la materialitzaci\u00f3 de la idea, els moments dels c\u00e0lculs
  i les gestions i, fi nalment, el desenlla\u00e7, m\u00e9s modest, m\u00e9s contingut,
  per\u00f2 no per aix\u00f2 necess\u00e0riament pitjor del somiat.\\n\\nFa il\u00b7lusi\u00f3
  repassar d''on venim i on hem arribat, i veure les transformacions descrites en
  clau de geografi a urbana, amb termes encunyats lluny i destil\u00b7lats en giron\u00ed,
  com el collaret de maragdes dels espais verds, la ciutat de les persones, softer
  may be smarter, el reciclatge verd i gris... I sentir que tenim a l''abast una ciutat
  que ha estat objecte d''estudi i de refer\u00e8ncia per la seva manera de combinar
  la iniciativa p\u00fablica i la privada. Un testimoni honest i erudit que tensa
  un fi l entre el passat i el present.\\n\\nAdam Llauger, Sandra. L''estiueig a la
  Cerdanya. El Papiol: Efad\u00f3s, 2021. 200 p.\"", "\"GRAU INFERMERIA  - EUI SANT
  PAU\\n\\nGuia docent de l''assignatura \\\"Antropologia de la Salut\\\"                                2017/2018\\n\\nCodi:
  200734\\n\\nCr\u00e8dits ECTS: 3\\n\\n|  | Titulaci\u00f3 |  | Pla |  | Tipus |  |
  Curs | Semestre |\\n|---|---|---|---|---|---|---|---|---|\\n| 884 Infermeria |  |
  Grau en Infermeria |  | OT |  | 4 |  |  |\\n\\nPrerequisits\\n\\nNo hi ha prerequisits
  oficials. Es recomana haver assolit les compet\u00e8ncies de les assignatures de
  \\\"Educaci\u00f3 per a la Salut\\\", \\\"Ci\u00e8ncies socials i salut\\\" i \\\"Salut
  P\u00fablica\\\".\\n\\nContextualitzaci\u00f3  i objectius\\n\\nAquesta assignatura
  \u00e9s optativa i est\u00e0 planificada en el set\u00e8 semestre del grau d''Infermeria.
  S''imparteix de manera simult\u00e0nia als itineraris \\\"Cures infermeres espec\u00edfiques
  en l''\u00e0mbit de la cardiologia\\\" i \\\"Cures infermeres espec\u00edfiques
  en l''\u00e0mbit de l''oncologia\\\".\\n\\nLa finalitat principal d''aquesta assignatura
  \u00e9s explicar i analitzar, des de l''antropologia de la salut,  la relaci\u00f3
  de la l\u00f2gica social que fonamenta els diferents comportaments i la cultura
  vers la malaltia card\u00edaca i/o oncol\u00f2gica. \u00c9s a dir, entendre des
  de la mirada antropol\u00f2gica, l''empowerment de la persona, el seu sistema de
  comunicaci\u00f3, organitzaci\u00f3 social, accions quotidianes i la forma com construeix
  els m\u00e8todes i estrat\u00e8gies per solucionar el problema de la malaltia card\u00edaca
  i oncol\u00f2gica.\\n\\nObjectius d''aprenentatge de l''assignatura.\\n\\n1. Descriure
  l''impacte de la globalitzaci\u00f3 en el desenvolupament de les malalties oncol\u00f2giques
  i/o card\u00edaques en l''\u00e0mbit socioecon\u00f2mic.\\n2. Analitzar els aspectes
  socioculturals que intervenen en la persona amb la malaltia oncol\u00f2gica i/o
  card\u00edaca.\\n3. Descriure el significat i la percepci\u00f3 de les manifestacions
  i factors de risc de la malaltia oncol\u00f2gica i/o card\u00edaca en relaci\u00f3
  a factors culturals, g\u00e8nere, sistemes de creences, estructura social i causalitat.\\n\\n_________________________________________________________________________________________________________\\n\\nCompet\u00e8ncies
  i resultats d''aprenentatge\\n\\n|  | Compet\u00e8ncia |  | Resultats d\u2019aprenentatge
  |\\n|---|---|---|---|\\n| CE4. Demostrar que compren el comportament interactiu
  de la persona en funci\u00f3 del g\u00e8nere, grup o comunitat, dintre del seu context
  social i multicultural |  | CE4.33. Enumerar les diferents manifestacions dels problemes
  card\u00edacs segons g\u00e8nere, cultura i \u00e8tnia CE4.34. Identificar i utilitzar
  els elements que afavoreixen o contribueixen a desenvolupar qualitat de vida en
  les persones que pateixen aquesta malaltia en el seu context social, cultural, familiar
  i individual CE4.35. Enumera les diferents viv\u00e8ncies de la malaltia oncol\u00f2gica,
  segons g\u00e8nere, cultura i \u00e8tnia CE4.36. Analitzar la repercussi\u00f3 de
  la malaltia oncol\u00f2gica en l\u2019\u00e0mbit social, familiar i individual |  |\\n\\nContinguts\\n\\nM\u00d3DUL
  1.   Antropologia de la Salut\\n\\n1. Compet\u00e8ncia cultural infermera. Cures
  infermeres transculturals.\\n2. Elements socioculturals que intervenen en el desenvolupament
  de la malaltia card\u00edaca i/o oncol\u00f2gica.\\n\\nM\u00d3DUL 2.   Antropologia
  i malaltia oncol\u00f2gica i/o card\u00edaca.\\n\\n3. Impacte de la globalitzaci\u00f3
  en el desenvolupament de les malalties oncol\u00f2giques i/o card\u00edaques en
  l''\u00e0mbit socioecon\u00f2mic.\\n4. Manifestacions i factors de risc de la malaltia
  oncol\u00f2gica i/o card\u00edaca en relaci\u00f3 a factors culturals, de g\u00e8nere,
  sistemes de creences, estructura social i causalitat.\\n5. Atenci\u00f3 d''infermeria
  a la persona amb problemes oncol\u00f2gics i/o card\u00edacs en una societat plural
  i multicultural. Minories \u00e8tniques.\\n\\nMetodologia\\n\\nEl plantejament metodol\u00f2gic
  de l''assignatura parteix de considerar que el protagonista en el proc\u00e9s d''ensenyament
  aprenentatge \u00e9s l''estudiant. L''estudiant ha de ser actiu i aut\u00f2nom en
  tot el proc\u00e9s i la professora dona suport a l''estudiant aportant la informaci\u00f3
  i els recursos necessaris per a que es doni l''aprenentatge.\\n\\nActivitat dirigida:\\n\\nL''assignatura
  disposa d''un \u00fanic grup de teoria.\\n\\nEl desenvolupament te\u00f2ric del
  tema es compagina amb activitats a l''aula, de caire m\u00e9s pr\u00e0ctic (individuals
  i/o en grup), per tal de consolidar els continguts te\u00f2rics i assolir les compet\u00e8ncies
  de l''assignatura. Els treballs s''entreguen en suport paper i inform\u00e0tic.\\n\\nPer
  tal d''afavorir la participaci\u00f3 activa, es proporciona als alumnes articles
  i enlla\u00e7os d''ampliaci\u00f3 de coneixements.\\n\\n_________________________________________________________________________________________________________\\n\\nActivitat
  supervisada:\\n\\nTreball grupal tutoritzat  elaborat a partir de les activitats
  en l''aula, que s''entrega en format paper i inform\u00e0tic i es realitza presentaci\u00f3
  oral. Les tutories es realitzen de forma presencial o per via electr\u00f2nica.\\n\\nLes
  tutories, de car\u00e0cter presencial o per via telem\u00e0tica permeten acompanyar
  i seguir a l''alumne durant tot el proc\u00e9s.\\n\\nActivitats formatives\\n\\n|  |
  Activitat |  | Hores |  | ECTS | Resultats d\u2019aprenentatge |\\n|---|---|---|---|---|---|---|\\n|
  Tipus: Dirigides |  |  |  |  |  |  |\\n| Classes te\u00f2riques: |  | 22.5 |  |
