  4th year | 675        | 1041   |           |           |\\n| 5th year | 750        |        |           |           |\\n\\nComparaci\u00f3
  de costos\\n\\nFigura D.8: Comparaci\u00f3 de costos vehicle compartit vs. privat\\n\\nD.2
  Situaci\u00f3 actual del Carpooling\\n\\nFigura D.9: Article sobre Compartir, SL.\\n\\nUNA
  F\u00d3RMULA INNOVADORA APLICADA A LA MOVILIDAD\\n\\nEl coche comunitario\\n\\nCompartir
  SL gestiona que distintas personas puedan ir en el mismo veh\u00edculo si coinciden
  en el trayecto \u25a0 48 ayuntamientos catalanes ofrecen el servicio en su web\\n\\nSALVADOR
  SABINA\\nTERRASSA\\n\\nSi los estudiantes de varias localidades se ponen de acuerdo
  para compartir el veh\u00edculo de uno de ellos para ir o volver de la universidad,
  y as\u00ed se ahorran dinero, \u00bfpor qu\u00e9 esta f\u00f3rmula no se aplica
  en el resto de actividades? A partir de un planteamiento similar, pero con competencias
  de estado en B\u00e9lgica, Francia o Alemania, dos economistas, Francesc Pallarols
  y Jaume Prat, y un ingeniero inform\u00e1tico, Albert Morstet, decidieron en el
  2000 que tambi\u00e9n pod\u00eda ser posible en Espa\u00f1a y crearon el portal
  con el mismo nombre.\\n\\n\u00abLa idea inicial, en pleno auge de las nuevas tecnolog\u00edas,
  fue como lo han los ingresos a partir de la publicidad, pero r\u00e1pidamente se
  vio que no funcionaban\u00bb, explica Pallarols, \u00abespecialmente actividad si
  quer\u00eda un futuro claro\u00bb.\\n\\nLa soluci\u00f3n pas\u00f3 por convertir
  el portal, compartir.org, en un servicio de los ayuntamientos y las instituciones
  p\u00fablicas para facilitar a sus ciudadanos nuevos sistemas de movilidad. \u00abCompartir
  es amistad del coche, no de la propiedad, a partir de un acuerdo sobre el precio
  del servicio, los trayectos en los que se ofrece, en qu\u00e9 momento, el conductor
  y los usuarios\u00bb.\\n\\nLa herramienta inform\u00e1tica casa todos los trayectos
  y distribuye no solo punto a punto, sino tambi\u00e9n por zonas pr\u00f3ximas, posibles
  itinerarios para recoger o dejar a un viajero, consultar solo el horario del viaje,
  y los diferentes horarios.\\n\\nEl primer municipio que cre\u00f3 fueron los servicios
  de Compartir SL fue Rub\u00ed, y posteriormente, Sant Cugat. Hoy ofrecen el servicio
  vinculado a otros 72 municipios, 61 de los que 48 son catalanes. El municipio paga
  a Compartir SL una cantidad fija al mes, y el servicio es gratuito.\\n\\nLos viajes
  asociados han pasado de 3.000 a 71.142 en cuatro a\u00f1os, y el porcentaje de acuerdos
  alcanzados ha llegado casi al 20%, unos 14.000 trayectos diarios.\\n\\nMuchos de
  estos viajes son a pol\u00edgonos industriales en los que el ahorro de combustible
  es muy complicado. Los posibles usuarios pueden buscar al conductor, que, de gr\u00fafico,
  aparecen a trav\u00e9s del portal compartir.org, o desde las webs de municipios,
  dentro del apartado de movilidad. \u00abSi bien es un modelo exitoso, depende de
  lo que se implique el ayuntamiento. Bilbao es el municipio con m\u00e1s acogida,
  pero hay muchos otros, entre otros motivos porque el ayuntamiento ha hecho mucha
  publicidad\u00bb, explica Pallarols.\\n\\nLA RED DE USUARIOS\\n\\nLa empresa catalana
  gestiona 14.000 trayectos diarios en toda Espa\u00f1a\\n\\nAdem\u00e1s de compartir
  el viaje, el usuario puede compartir la plaza de aparcamiento. El que solo lo usa
  de d\u00eda, la pone a disposici\u00f3n de otros para que la use, o de varios, si
  hay horarios distintos.\\n\\nSeg\u00fan la empresa, los viajes compartidos el 2006
  han reducido el ahorro en emisiones de CO\u2082 de 21.336 toneladas al a\u00f1o,
  o de m\u00e1s de 7.000 euros de gasolina. La Carretera Comunitaria Terrassera ha
  concedido el premio a la iniciativa empresarial m\u00e1s sostenible.\\n\\nFont:
  www.compartir.es\\n\\nFigura D.10: Viatges acordats di\u00e0riament per municipi\\n\\nFont:
  Fundaci\u00f3 mobilitat sostenible i segura\\n\\nD.3 Components del sistema Bicing\\n\\nS\u2019ha
  considerat interessant afegir una descripci\u00f3 dels components del servei Bicing.\\n\\n\u00c0rees
  d\u2019aparcament (ADA)\\n\\nLes \u00c0rees d\u2019Aparcament (ADA) \u2013 estacions
  \u2013 s\u00f3n els espais on l\u2019usuari pot recollir la bicicleta i retornar-la
  posteriorment a la seva utilitzaci\u00f3. Estan formades per un Terminal d\u2019Acc\u00e9s
  al Sistema (TAS), a trav\u00e9s del qual l\u2019usuari accedeix al sistema, i una
  s\u00e8rie de Punts d\u2019Ancoratge de Bicicletes (PAB\u2019s), on aquestes queden
  estacionades de manera segura fins al seg\u00fcent \u00fas.\\n\\nLes \u00c0rees
  d\u2019Aparcament (ADA) instal\u00b7lades tenen l\u2019avantatge d\u2019ofertir
  una gran modularitat per a adaptar-se a l\u2019espai disponible i a les caracter\u00edstiques
  urban\u00edstiques de l\u2019entorn. Es tracta d\u2019una estructura \u00fanica
  en la que s\u2019integra el Terminal d\u2019Acc\u00e9s al Sistema (TAS) i els diferents
  Punts d\u2019Ancoratge de Bicicletes (PAB\u2019s). Aquestes \u00e0rees ofereixen
  una est\u00e8tica robusta i, alhora, aparenten una m\u00ednima ocupaci\u00f3 de
  la via p\u00fablica oferint una est\u00e8tica lleugera.\\n\\nFigura D.11: Exemple
  d\u2019estaci\u00f3 instal\u00b7lada\\n\\nFont: B:SM\\n\\nTerminal d''Acc\u00e9s
  al Sistema (TAS)\\n\\nEl Terminal d''Acc\u00e9s al Sistema (TAS) permet a l''usuari
  identificar-se mitjan\u00e7ant la seva targeta d''abonat i accedir al sistema Bicing.
  Tamb\u00e9 ha de permetre realitzar altres operacions com l''alta d''usuaris temporals
  (abonament setmanal) o la consulta del nivell d''ocupaci\u00f3 de les \u00c0rees
  d''Aparcament (ADA) adjacents.\\n\\nEl TAS est\u00e0 format per un lector de proximitat
  de targetes d''abonat, un lector de targetes de cr\u00e8dit o d\u00e9bit amb un
  teclat num\u00e8ric i una pantalla d''informaci\u00f3 que permet a l''usuari accedir
  al sistema.\\n\\nPunts d''Ancoratge de Bicicletes (PAB''s)\\n\\nEls Punts d''Ancoratge
  de Bicicletes (PAB''s) s\u00f3n unes barres d''ancoratge formades per un conjunt
  de pinces de subjecci\u00f3 que permeten l''obertura i el tancament autom\u00e0tic,
  possibilitant el bloqueig i desbloqueig de les bicicletes.\\n\\nLes pinces de subjecci\u00f3
  estan formades per dos forats, on s''introdueixen els elements d''ancoratge de les
  bicicletes, la indicaci\u00f3 del n\u00famero de pla\u00e7a d''ancoratge i un di\u00f2de
  que indica l''estat de l''ancoratge.\\n\\nEls possibles estats en els que es pot
  trobar un ancratge s\u00f3n:\\n\\n- Di\u00f2de de color vermell: la pin\u00e7a est\u00e0
  tancada.\\n- Di\u00f2de de color vermell intermitent: la pin\u00e7a est\u00e0 espatllada.\\n-
  Di\u00f2de de color verd: la pin\u00e7a est\u00e0 oberta i permet la retirada o
  devoluci\u00f3 de la bicicleta.\\n\\nLes pinces de subjecci\u00f3 nom\u00e9s es
  tanquen autom\u00e0ticament si estan presents els dos sistemes de control seg\u00fcents:\\n\\n-
  Introducci\u00f3 simult\u00e0nia dels dos elements d''ancoratge de la bicicleta.\\n-
  Reconeixement del xip d''identificaci\u00f3 de la bicicleta.\\n\\nD''aquesta manera
  s''eviten els tancaments involuntaris de les pinces de subjecci\u00f3.\\n\\nBicicletes\\n\\nLes
  bicicletes s\u00f3n l''element realment protagonista i les seves caracter\u00edstiques
  garantitzen la funcionalitat y la seguretat de les mateixes.\\n\\nLas caracter\u00edstiques
  funcionals m\u00e9s importants de les bicicletes s\u00f3n:\\n\\n\u2022 Imatge espec\u00edfica
  que les fa f\u00e0cilment diferenciables.\\n\\n\u2022 El pes de la bicicleta \u00e9s
  de 18 kg.\\n\\n\u2022 Dimensions adaptades a joves i adults, homes i dones, amb
  seient regulable en al\u00e7ada i impermeable.\\n\\n\u2022 Manillar ampli i ergon\u00f2mic
  que facilita la conducci\u00f3 de la bicicleta i permet la col\u00b7locaci\u00f3
  d''una cistella per al transport d''objectes.\\n\\n\u2022 Canvi de 3 velocitats.\\n\\n\u2022
  Peu de subjecci\u00f3 en posici\u00f3 de rep\u00f2s, de f\u00e0cil utilitzaci\u00f3
  i robust en el seu \u00fas.\\n\\n\u2022 Sistema d''il\u00b7luminaci\u00f3 nocturna
  autom\u00e0tic, davant i posterior. El sistema es posa en funcionament quan detecta
  una reducci\u00f3 de la llum i una vibraci\u00f3 durant la utilitzaci\u00f3 de la
  bicicleta. Un temporitzador permet mantenir la llum encesa durant 4 minuts en cas
  d''aturada.\\n\\n\u2022 Pedals reflectants i antiliscants.\\n\\n\u2022 Protector
  de cadena i parafangs davant i posterior.\\n\\n\u2022 Frens davant i posterior.\\n\\n\u2022
  Elements d''identificaci\u00f3 mitjan\u00e7ant un xip, que permet en tot moment
  gestionar de forma adequada els seus moviments entre els diferents elements del
  sistema.\\n\\n\u2022 Lloc espec\u00edfic per a la col\u00b7locaci\u00f3 d''informaci\u00f3.\\n\\n\u2022
  Material de fabricaci\u00f3 resistent i permet l''\u00fas intensiu en totes les
  condicions metereol\u00f2giques.\\n\\n\u2022 Compleixen amb tots els requisits que
  marquen les Lleis i les Ordenances Municipals.\\n\\n**Vehicles de distribuci\u00f3
  i manteniment**\\n\\nEls vehicles de distribuci\u00f3 s\u00f3n els encarregats de
  l''aprovisionament i la retirada de bicicletes. Els vehicles de distribuci\u00f3
  estan equipats amb uns tel\u00e8fons GPRS que els permet estar en comunicaci\u00f3
  amb el Centre de Control, des d''on se''ls envia les instruccions per a queda es
  procedeixi a la descongesti\u00f3 o aprovisionament d''una estaci\u00f3.\\n\\nCada
  vehicle de distribuci\u00f3 t\u00e9 una capacitat per a transportar 10 bicicletes
  i van equipats amb un remolc amb capacitat per a 15 bicicletes m\u00e9s.\\n\\nEls
  vehicles de manteniment s\u00f3n els encarregats de mantenir les bicicletes i les
  \u00e0rees d\u2019aparcament en un estat \u00f2ptim de funcionament i neteja. Es
  tracta de vehicles d\u2019intervenci\u00f3 r\u00e0pida que es desplacen fins al
  lloc on surgeix la incid\u00e8ncia per solventar-la el m\u00e9s r\u00e0pidament
  possible.\\n\\nD.4 Proposta de xarxa ortogonal realitzada per TMB i BCN Ecologia\\n\\nEl
  que segueix s\u00f3n les figures de la proposta de TMB. El document es troba a la
  p\u00e0gina web de l\u2019Associaci\u00f3 per la Promoci\u00f3 del Transport P\u00fablic:
  www.laptp.org.\\n\\nFigura D.12: Mapa de la xarxa d\u2019autobusos 2006\\n\\nFigura
  D.13: Mapa de la xarxa d\u2019autobusos ortogonal\\n\\nNou model de mobilitat\\n\\nFigura
  D.14: Mapa dels eixos verticals de la xarxa ortogonal\\n\\nFigura D.15: Mapa dels
  eixos horitzontals de la xarxa ortogonal\\n\\nFigura D.16: Mapa de les l\u00ednies
  diagonals de la xarxa ortogonal\\n\\nD.5 Criteris d\u2019implantaci\u00f3 de les
  estacions Bicing\\n\\nEl que segueix prov\u00e9 d\u2019un report intern de B:SM.\\n\\nRevisada
  la proposta de la segona fase de Implantaci\u00f3 de les estacions de BICING, model
  de transport p\u00fablic individual en bicicleta, el Departament de Projectes Urbans
  informa:\\n\\nConsiderem necessari establir un model est\u00e0ndard d\u2019implantaci\u00f3
  de les estacions de BICING: uns criteris comuns per a tots els punts de la ciutat
  i unes regles espec\u00edfiques per les estacions de BICING al districte de l\u2019Eixample.
  Aix\u00ed:\\n\\n\u2022 En general, col\u00b7locar l\u2019estaci\u00f3 de BICING
  paral\u00b7lela als fluxos de pas dels vianants i no tallar mai aquests.\\n\u2022
  Sempre que sigui possible, ubicar l\u2019estaci\u00f3 de BICING en cal\u00e7ada,
  ocupant l\u2019espai de places d\u2019aparcament de cotxes (siguin places lliures,
  \u00e0rea verda, \u00e0rea blava), places d\u2019aparcament de motos o zones de
  c\u00e0rrega i desc\u00e0rrega.\\n\\nSi \u00e9s possible, despla\u00e7ar els contenidors
  de escombraries i els aparcaments de minusv\u00e0lids, despr\u00e9s de l\u2019estaci\u00f3
  de BICING, de manera que aquesta no quedi allunyada del gual de vianants o poc visible
  pels usuaris del servei.\\n\\n- Sempre que sigui possible, ubicar l\u2019estaci\u00f3
  de BICING abans d\u2019un gual de vianants, priorit\u00e0riament vinculat a un sem\u00e0for
  de detenci\u00f3 de vehicles. Aix\u00f2 minimitza el risc per l\u2019usuari que
  recull o retorna una bicicleta, doncs accedeix a l\u2019estaci\u00f3 de BICING des
  d\u2019un gual de vianants senyalitzat i amb els vehicles aturats al sem\u00e0for.\\n\\n-
  Limitar i protegir l\u2019estaci\u00f3 de BICING en els seus extrems amb un element
  de protecci\u00f3, model a validar amb el Departament d\u2019Elements Urbans de
  l\u2019Ajuntament de Barcelona.\\n\\n- Senyalitzar amb pintura, als carrils de circulaci\u00f3,
  la proximitat d\u2019una estaci\u00f3 de BICING.\\n\\n- Senyalitzar amb pintura
  la zona de seguretat de l\u2019estaci\u00f3 de BICING on els usuaris es desplacen
  per recollir o retornar una bicicleta.\\n\\n- Sempre que sigui possible, no col\u00b7locar
  l\u2019estaci\u00f3 de BICING en passeigs centrals de rambles. Aixa mateix, en places
  i espais p\u00fablics es validar\u00e0 la posici\u00f3 definitiva de l\u2019estaci\u00f3
  de BICING amb el Departament de Projectes Urbans de l\u2019Ajuntament de Barcelona.\\n\\n-
  L\u2019\u00e0mbit d\u2019actuaci\u00f3 de la reposici\u00f3 de superf\u00edcie de
  l\u2019espai urb\u00e0 afectat per les obres ha de comprendre la superf\u00edcie
  afectada per les obres, aix\u00ed com aquella que sigui necess\u00e0ria per tal
  que la urbanitzaci\u00f3 de l\u2019entorn proper l\u2019estaci\u00f3 de BICING sigui
  coherent amb el nou \u00fas. La definici\u00f3 dels \u00e0mbits d\u2019actuaci\u00f3
  s\u2019acordaran amb Departament de Projectes Urbans de l\u2019Ajuntament de Barcelona.\\n\\n-
  Es imprescindible que quedi garantida la dotaci\u00f3 pressupost\u00e0ria per a
  la realitzaci\u00f3 de les partides corresponents a l\u2019adequaci\u00f3 de l\u2019entorn
  urb\u00e0 associat a les zones afectades per les obres d\u2019implantaci\u00f3 de
  les estacions de BICING.\\n\\n- Les obres de reposici\u00f3 d\u2019espais urbans
  afectats per la implantaci\u00f3 de les estacions de BICING hauran de ser, un cop
  acabades, recepcionades per l\u2019Ajuntament de Barcelona.\\n\\n**D.6 Pl\u00e0nols
  actuals de les l\u00ednies d\u2019autob\u00fas que passen pel Poblenou**\\n\\nEls
  pl\u00e0nols del recorregut de les l\u00ednies actuals s\u2019han tret de la p\u00e0gina
  web oficial de TMB (www.tmb.net) a data de 20 de febrer del 2008.\"", "\"AJUNTAMENT
  DE SANTA COLOMA DE CERVELL\u00d3\\n\\nAssumpte.- Certificat acord de Ple\\n\\nExp.-
