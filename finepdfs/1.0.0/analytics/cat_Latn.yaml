  64\\n\\n8\\n\\nIntroducci\u00f3 a l\u2019estudi\\n\\nIntroducci\u00f3\\n\\nAquest
  estudi sobre les necessitats dels professionals de la medicina relacionades amb
  l\u2019etapa de la jubilaci\u00f3, se situa en el marc de la perspectiva te\u00f2rica
  de l\u2019anomenada Psicologia del Cicle Vital, que defineix la jubilaci\u00f3 del
  m\u00f3n laboral com una \u201ctransici\u00f3 vital\u201d. Aquesta aproximaci\u00f3
  te\u00f2rica, com explicarem a continuaci\u00f3, ens permet abordar els guanys i
  les p\u00e8rdues que acompanyen aquest proc\u00e9s de canvi que requereix l\u2019adaptaci\u00f3
  a una nova etapa vital (Baltes, 1987).\\n\\nLa definici\u00f3 de transici\u00f3
  vital continua essent, actualment, una q\u00fcesti\u00f3 oberta. Malgrat que existeixen
  nombroses definicions, (Parkes, 1971; Levinson, 1982; Cowan, 1991; Hidalgo, 1995;
  entre d\u2019altres), P\u00e9rez Blasco (1998) proposa, com a elements comuns i
  espec\u00edfics de totes elles, que una transici\u00f3 \u00e9s:\\n\\n- Un per\u00edode
  de canvi significatiu que requereix un esfor\u00e7 d\u2019adaptaci\u00f3.\\n- Provocada
  per l\u2019ocurr\u00e8ncia o la no ocurrencia d\u2019algun esdeveniment o per l\u2019acumulaci\u00f3
  o persist\u00e8ncia de conflictes i insatisfaccions.\\n- F\u00e0cilment observable
  externament o no.\\n- Que afecta a qualsevol \u00e0rea de la vida de la persona
  (familiar, personal, laboral, salut, etc.).\\n- Que \u00e9s experimentat de manera
  caracter\u00edstica per cada persona.\\n- Amb un desenlla\u00e7 desconegut amb anterioritat.\\n\\nHidalgo
  (1995) proposa una definici\u00f3 similar quan afirma que els moments de transici\u00f3
  s\u00f3n \u201caquelles experi\u00e8ncies que tenen lloc al llarg del cicle vital
  que degut a que requereixen l\u2019adopci\u00f3 de nous rols i que plantegen noves
  exig\u00e8ncies, s\u00f3n moments potencialment prop\u00edcis perqu\u00e8 tinguin
  lloc canvis importants tant a nivell intrapersonal com interpersonal\u201d (Hidalgo,
  1995:46).\\n\\nLes transicions s\u00f3n, doncs, moments vitals en els que la persona
  s\u2019esfor\u00e7a per adaptar-se a condicions de vida noves i desafiants; s\u00f3n,
  per definici\u00f3, adaptatives i generadores de desenvolupament, per\u00f2 s\u00f3n,
  tamb\u00e9, alhora per\u00edodes de riscs i oportunitats. L\u2019oportunitat \u00e9s,
  evidentment, el desenvolupament personal. El risc \u00e9s que la persona no sigui
  capa\u00e7 d\u2019afrontar o que afronti de forma insatisfact\u00f2ria una transici\u00f3
  i que aquest tr\u00e0nsit deixi una \u201ccicatriu\u201d (Murgatroyd i Woolfe, 1982).
  Aquesta manera d\u2019entendre les transicions com a potencialment positives i/o
  negatives, marca que l\u2019objectiu de la recerca i de la intervenci\u00f3 no sigui
  la prevenci\u00f3 dels esdeveniments generadors de transicions vitals, sin\u00f3
  la intensificaci\u00f3 de les habilitats personals per desenvolupar-se com a resultat
  d\u2019una transici\u00f3 (Sugarman, 1986).\\n\\nLa perspectiva de la Psicologia
  del Cicle Vital defensa que per estudiar les transicions vitals necessitem una visi\u00f3
  global i contextual. Dins d\u2019aquesta visi\u00f3 s\u00f3n de gran import\u00e0ncia
  els ambients m\u00e9s generals i globals que transcendeixen l\u2019experi\u00e8ncia
  immediata de la persona, les condicions socials i hist\u00f2riques en les que es
  donen les transicions vitals. Aquestes condicions socials s\u00f3n canviants al
  llarg del temps i s\u00f3n modificades per l\u2019activitat de les persones, caracteritzant
  el cicle vital com un proc\u00e9s dial\u00e8ctic entre la persona i el context sociohist\u00f2ric
  en el que viu. La descripci\u00f3 \u00e9s relativa i pluralista, i observa la gran
  complexitat que envolta el canvi, posant de relleu la seva multidireccionalitat
  aix\u00ed com les seves singularitats.\\n\\nEn l\u2019estudi de les transicions
  vitals des d\u2019aquesta perspectiva classifiquem les transicions vitals, principalment,
  en tres grups: les normatives relacionades amb la hist\u00f2ria, les no-normatives
  i les normatives relacionades amb l\u2019edat. Les transicions vitals considerades
  normatives amb l\u2019edat, entre les que es troba la jubilaci\u00f3, es refereixen
  a determinants biol\u00f2gics i socials, tals com aspectes del desenvolupament f\u00edsic
  i aspectes d\u2019una societat ordenada per l\u2019edat, que mostren una alta correlaci\u00f3
  cronol\u00f2gica. Aquestes transicions impliquen l\u2019adquisici\u00f3 de nous
  rols o compet\u00e8ncies normatives relacionades amb l\u2019edat social i/o cronol\u00f2gica.
  No hem d\u2019oblidar que moltes societats, inclosa la nostra, estan basades en
  l\u2019edat com a \u00edndex que permet l\u2019acc\u00e9s a determinats drets i
  deures (per exemple, en el cas que ens ocupa, el dret a la jubilaci\u00f3 i l\u2019acc\u00e9s
  al sistema de pensions).\\n\\nUna excessiva import\u00e0ncia social de l\u2019edat
  pot comportar, per una banda, actituds, creences i accions marginalitzadores cap
  als membres de determinada edat, impedint l\u2019acc\u00e9s a drets basats \u00fanicament
  en l\u2019edat cronol\u00f2gica i segregant la societat en grups d\u2019edat dificultant,
  aix\u00ed, les relacions intergeneracionals, etc. Per altra banda, possibilita la
  creaci\u00f3 d\u2019un patr\u00f3 de \u201ccicle vital esperable o normal\u201d
  que permet a la persona comparar la seva vida i la dels seus iguals en relaci\u00f3
  a com han afrontat els reptes ocupacionals i familiars en l\u2019edat adulta, i
  determinar si els esdeveniments importants de la seva vida han succe\u00eft \u201cabans\u201d
  d\u2019hora, \u201ctard\u201d o \u201ca temps\u201d. Aquesta concreci\u00f3 dels
  esdeveniments en el temps canviar\u00e1 la seva percepci\u00f3, la seva experi\u00e8ncia
  i el seu significat. \u201cEl que importa en si no \u00e9s el fet d\u2019haver complert
  40, 50 o 60 anys d\u2019edat sin\u00f3 la resposta a la pregunta: ho estic fent
  b\u00e9 per a la meva edat?\u201d (Neugarten, 1999. P\u00e0g. 135). Per donar resposta
  a aquesta pregunta la persona adulta avalua la seva traject\u00f2ria vital fins
  el moment present en funci\u00f3 del passat i del futur. El passat es reinterpreta
  en funci\u00f3 del present i el present pren sentit en funci\u00f3 del futur que
  s\u2019anticipa.\\n\\nEn l\u2019actualitat, l\u2019acc\u00e9s al m\u00f3n laboral
  i la seva sortida, la jubilaci\u00f3, s\u2019han convertit en marcadors del cicle
  vital normal o predicable. A la nostra cultura, el treball t\u00e9 una significaci\u00f3
  molt superior a la simple obtenci\u00f3 d\u2019uns ingressos econ\u00f2mics i es
  converteix en part del rol central de l\u2019edat adulta, organitzant els dies,
  les setmanes, el desenvolupament familiar i proporcionant, a m\u00e9s d\u2019uns
  ingressos, una activitat significativa com a context de desenvolupament del creixement
  personal aix\u00ed com de la construcci\u00f3 de la identitat i de les relacions
  socials. \u00c9s la font principal de la identitat social i personal. Aix\u00ed,
  quan arriba la jubilaci\u00f3, que en la majoria dels pa\u00efsos occidentals es
  considera com un per\u00edode \u201cmerescut\u201d en la vida d\u2019una persona
  en el que no s\u2019han de satisfair les demandes d\u2019un treball retribu\u00eft,
  com un per\u00edode de descans al que tothom t\u00e9 dret, es pot produir una ruptura
  i s\u2019altera l\u2019esquema de relaci\u00f3 amb la fam\u00edlia i la societat
  en el seu conjunt.\\n\\nAra b\u00e9, existeixen moltes formes de jubilar-se. La
  jubilaci\u00f3 \u00e9s un fenomen plural i din\u00e0mic que afecta molts aspectes
  de les nostres vides. En realitat, \u00e9s m\u00e9s exacte considerar la jubilaci\u00f3
  com un proc\u00e9s o una transici\u00f3 vital que com un esdeveniment que es d\u00f3na
  en un moment determinat. La jubilaci\u00f3 comporta un canvi important en el patr\u00f3
  d\u2019activitat, una reestructuraci\u00f3 de la utilitzaci\u00f3 del temps i una
  gamma diferent de relacions. La satisfacci\u00f3 de les persones dependr\u00e0 de
  l\u2019\u00e8xit d\u2019aquesta adaptaci\u00f3 a la inactivitat remunerada despr\u00e9s
  de jubilar-se i de deixar la seva activitat professional. Aquest proc\u00e9s \u00e9s
  de gran import\u00e0ncia ja que provoca un canvi en la vida de les persones i repercuteix
  en la qualitat de vida dels anys posteriors, t\u00e9 un alt potencial estressant
  i requereix d\u2019una adaptaci\u00f3/integraci\u00f3. \u00c9s per aix\u00f2 que
  la sortida del m\u00f3n laboral mereix una planificaci\u00f3 i una preparaci\u00f3
  detallada. De totes formes, la jubilaci\u00f3 no necess\u00e0riament constitueix
  una crisi, moltes persones que es jubilen tenen una adaptaci\u00f3 a la jubilaci\u00f3
  lliure de tensions i estan satisfetes amb la seva vida. Una minoria significativa
  de jubilats, d\u2019un 10 a un 30%, pateix problemes en el proc\u00e9s d\u2019adaptaci\u00f3
  al canvi i/o una davallada del seu benestar despr\u00e9s de la jubilaci\u00f3.\\n\\nLa
  perspectiva del cicle vital (Elder i Johnson, 2003) centra l\u2019atenci\u00f3 en
  quatre conceptes que semblen crucials per comprendre el benestar postjubilaci\u00f3:\\n\\n-
  La depend\u00e8ncia contextual de la transici\u00f3 vital.\\n- La interdepend\u00e8ncia
  dels diferents \u00e0mbits de la vida.\\n- El ritme i adequaci\u00f3 del moment
  vital en que es produeix la jubilaci\u00f3.\\n- La seva traject\u00f2ria i el seu
  itinerari.\\n\\nLa depend\u00e8ncia contextual implica que l\u2019experi\u00e8ncia
  de la jubilaci\u00f3 ser\u00e0 contingent amb les circumst\u00e0ncies espec\u00edfiques
  sota les quals es produeix, inclouent tant la visi\u00f3 que es t\u00e9 de la jubilaci\u00f3,
  l\u2019estatus i els rols presents i passats, com el context social. S\u2019assumeix
  que les esferes vitals s\u00f3n interdependents, per tant experi\u00e8ncies en una
  esfera (p.e. treball) influen\u00e7en en i s\u00f3n influ\u00efdes per les experi\u00e8ncies
  en altres esferes (p.e. fam\u00edlia). A m\u00e9s, l\u2019experi\u00e8ncia de les
  transicions vitals \u00e9s contingent amb el seu moment d\u2019ocurr\u00e8ncia en
  termes de dates l\u00edmits culturals, expectatives personals i ocurr\u00e8ncies
  en altres esferes vitals. Les nocions de traject\u00f2ria i itinerari apunten cap
  al context hist\u00f2ric de les experi\u00e8ncies vitals (temps hist\u00f2ric),
  el seu desenvolupament al llarg del temps (traject\u00f2ria) i les interrelacions
  entre diverses transicions vitals (itineraris).\\n\\nLes ruptures en les traject\u00f2ries
  i els itineraris vitals porten a les persones a viure les seves transicions vitals
  amb males- tar. Quant malestar causa o pot causar una transici\u00f3 vital dep\u00e8n
  de la vulnerabilitat de les persones, de les caracter\u00edstiques de la transici\u00f3
  aix\u00ed com del significat i del context de la transici\u00f3 (Wheaton, 1996).
  La vulnerabilitat deriva, principalment, del seg\u00fcent:\\n\\n- Si existeix un
  d\u00e9ficit en les habilitats i/o la informaci\u00f3, els recursos materials i/o
  el suport social.\\n- Els trets de la transici\u00f3; si \u00e9s desitjada, esperada,
  amena\u00e7adora o refor\u00e7adora de la identitat, si afecta a una esfera sortint
  de la vida o, pel contrari, a una de poc rellevant, si altera els patrons de comportaments
  i de relacions establerts, etc. Tot aix\u00f2 configura les caracter\u00edstiques
  de la transici\u00f3 que contribuiran, o no, al seu potencial estressant.\\n- El
  significat i el context de la transici\u00f3, \u00e9s a dir, del significat de la
  nova etapa a la que la transici\u00f3 ens apropa, i del context sociocultural en
  que es produceix.\\n\\nLa jubilaci\u00f3 \u00e9s, doncs, un proc\u00e9s a llarg
  termini que s\u2019inicia quan les persones prenen consci\u00e8ncia que algun dia
  es jubilaran, es manifesta amb la jubilaci\u00f3 i s\u2019acaba quan s\u2019ha integrat
  la nova situaci\u00f3 (Atcheley, 1976). L\u2019adaptaci\u00f3 a la jubilaci\u00f3
  es considera, doncs, una transici\u00f3 vital que possibilita estudiar les p\u00e8rdues
  i els guanys que acompanyen els processos de canvi requerits per l\u2019acomodaci\u00f3
  i ajust a un nou moment vital (Baltes, 1987).\\n\\nEn la bibliografia sobre la jubilaci\u00f3
  trobem \u00e0mpliament acceptada (Boss\u00e9 et al. 1991; Theriault, 1994) la descripci\u00f3
  d\u2019aquest proc\u00e9s d\u2019adaptaci\u00f3 proposada per Atcheley (1985, 2000).
  L\u2019autor proposa que el proc\u00e9s d\u2019adaptaci\u00f3 est\u00e0 format per
  tres moments diferents: reacci\u00f3, acomodaci\u00f3 i establiment de rutines.\\n\\nDins
  del moment de reacci\u00f3 descriu tres formes de reacci\u00f3 significatives, ja
  sigui per la seva manifestaci\u00f3 o abs\u00e8ncia. Aquestes formes de reacci\u00f3
  no s\u00f3n fases per les que passi tothom ni estan associades a cap edat cronol\u00f2gica,
  poden donar-se de forma seq\u00fcencial, una d\u2019elles, dues, o fins i tot, en
  alguns casos, totes tres. La primera \u00e9s la que l\u2019autor anomena \u201cd\u2019euf\u00f2ria
  o lluna de mel\u201d en la que algunes persones intenten realitzar totes aquelles
  activitats per a les quals no tenien temps suficient. Aquesta reacci\u00f3 a la
  jubilaci\u00f3 en el seu estudi \u00e9s m\u00e9s comuna entre els que es jubilen
  de forma volunt\u00e0ria i amb recursos econ\u00f2mics elevats, i en el nostre cas,
  amb el tercer perfil descrit al cap\u00edtol seg\u00fcent. Una segona forma de reacci\u00f3
  \u00e9s l\u2019anomenada de \u201cdescans i relaxaci\u00f3\u201d on la persona jubilada
  vol dedicar el temps a descansar, en aquest estat els nivells d\u2019activitat es
  redueixen molt inicialment, per anar recuperant nivells d\u2019activitat similars
  als anteriors de la jubilaci\u00f3 gradualment. En el citat estudi, aquesta reacci\u00f3
  \u00e9s m\u00e9s habitual en els homes jubilats que en les dones, i, en el nostre
  cas, s\u2019ajusta al tercer perfil descrit al cap\u00edtol seg\u00fcent. La tercera
  reacci\u00f3 habitual \u00e9s de \u201cdesencantament\u201d, molt habitual quan
  les expectatives sobre la jubilaci\u00f3 no es compleixen i/o si els plans es veuen
  alterats per la malaltia o la mort.\\n\\nAquestes reaccions inicials a la jubilaci\u00f3
  estan habitualment seguides per una fase \u201cd\u2019acomodaci\u00f3\u201d durant
  la qual es posen en marxa estrat\u00e8gies adaptades a la nova situaci\u00f3 per
  fer front als reptes que planteja; \u00e9s aix\u00ed com s\u2019estableix una nova
  rutina amb obligacions di\u00e0ries que estructuren el temps. Aproximadament, despr\u00e9s
  d\u2019un per\u00edode de temps que no \u00e9s menor a sis mesos i pot arribar a
  ser d\u2019un parell o tres anys, la persona jubilada entra en un estat caracteritzat
  per l\u2019establiment d\u2019unes \u201crutines estables\u201d i uns patrons d\u2019activitat
  que, s\u2019assemblin o no als patrons de prejubilaci\u00f3, es consideren satisfactoris
  i possibiliten que es descriguin a si mateixos com persones ocupades o massa ocupades
  portant a terme activitats que consideren significatives.\\n\\nAra b\u00e9, en les
  \u00faltimes d\u00e8cades s\u2019han produ\u00eft canvis importants, tant en el
  desenvolupament del cicle laboral de les persones com en la poblaci\u00f3 de jubilats
  i jubilades, que han implicat nous reptes i canvis en la forma en que les persones
  afronten la jubilaci\u00f3.\\n\\nFins fa molt poc, el cicle laboral de les persones
  transcorria de forma lineal. La primera etapa de la vida es dedicava gaireb\u00e9
  completament a la formaci\u00f3, la segona a l\u2019activitat i la tercera al descans.
  Actualment en canvi, les fronteres i funcions de cada etapa comencen a estar m\u00e9s
  difuses. La fusi\u00f3 de rols en una mateixa etapa, degut al desenvolupament de
  la \u201csocietat de l\u2019oci i la formaci\u00f3\u201d est\u00e0 convivint amb
  la \u201csocietat del treball\u201d que continua predominant.\\n\\nEn l\u2019actualitat,
  cada vegada s\u00f3n m\u00e9s les persones que arriben als 65 anys amb un nivell
  de salut acceptable i amb molts anys de vida per davant. No solament ha aparegut
  un veritable per\u00edode que podria anomenar-se \u201cla vida despr\u00e9s del
  treball\u201d (Neugarten, 1990) sin\u00f3 que per a algunes persones aquest per\u00edode
  \u00e9s quasi tan llarg com la seva vida laboral. Les persones jubilades cada vegada
  s\u00f3n m\u00e9s actives i participatives en el seu entorn, les seves aportacions
  poden ser i, de fet ja fa temps que ho s\u00f3n, diversificades: aportacions en
  l\u2019entorn familiar (funcions materials de suport als fills, d\u2019assist\u00e8ncia
  tenint cura dels n\u00e9ts, de les persones grans i/o malalts de la fam\u00edlia
  o fent front a necessitats urgents; funcions dom\u00e8stiques: compra, neteja de
  la llar, alimentaci\u00f3, gestions; funcions socioeducatives: educaci\u00f3 dels
  n\u00e9ts, foment de les relacions intergeneracionals, etc.), contribucions en l\u2019\u00e0mbit
  social (en associacions, voluntariat, etc.) i en l\u2019\u00e0mbit socioprofessional
  (assessorament, comit\u00e8s d\u2019experts, divulgaci\u00f3 cient\u00edfica, etc.).\\n\\nLa
  consci\u00e8ncia d\u2019aquestes transformacions i de la import\u00e0ncia de les
  accions que s\u2019han de portar a terme han generat, en les dues \u00faltimes d\u00e8cades,
  un inter\u00e8s creixent pels estudis realitzats en aquest camp, centrats en ajudar
  a con\u00e8ixer i descriure m\u00e9s a fons les transformacions constants en la
  configuraci\u00f3 de les necessitats entorn a la jubilaci\u00f3 (Atcheley, 1992;
  Freedman, 1999; Szinovacz, 2002) i centrats en definir l\u00ednies d\u2019actuaci\u00f3
  innovadores que permetin mantenir actiu i integrat socialment aquest col\u00b7lectiu.
  En pa\u00efsos com Dinamarca, Su\u00e8cia i Gran Bretanya, entre d\u2019altres,
  les pol\u00edtiques i accions m\u00e9s innovadores se situen en la l\u00ednia de
  possibilitar la seva participaci\u00f3 en l\u2019\u00e0mbit social (en associacions
  i altres organismes: d\u2019assessorament, de conservaci\u00f3 de la mem\u00f2ria
  col\u00b7lectiva i tradicions populars, de col\u00b7laboraci\u00f3 amb l\u2019an\u00e0lisi
  de problem\u00e0tiques de tota mena, de foment de la participaci\u00f3 social, etc.)
  de forma que es produeix un aprofitament del capital hum\u00e0, els coneixements
  i l\u2019experi\u00e8ncia, a l\u2019hora que es contribueix a mantenir la persona
  activa i integrada socialment (Malrby, de Vroom, Mirabile, Overbye, 2004; IMSER-SO,
  1995).\\n\\nIntroducci\u00f3 a l\u2019estudi\\n\\nCaracter\u00edstiques de la recerca\\n\\nA
  continuaci\u00f3, presentem la recerca que s\u2019ha portat a terme, els seus objectius,
  la seva perspectiva metodol\u00f2gica i el disseny de la mateixa.\\n\\nEls objectius
  de recerca han estat els seg\u00fcents:\\n\\n- Definir les principals necessitats
  dels professionals de la medicina del nostre entorn relacionades amb el moment de
  la jubilaci\u00f3, per tal de millorar la validesa del disseny posterior d\u2019un
  q\u00fcestionari sobre aquest tema.\\n\\n- Identificar el tipus d\u2019accions que
  es mostren \u00fatils per millorar l\u2019experi\u00e8ncia i l\u2019afrontament
  d\u2019aquest moment del cicle vital/de l\u2019itinerari professional.\\n\\n- Perfilar
  aquelles accions que es considera pertinent promoure des de l\u2019\u00e0mbit professional/coll\u00e8gial.\\n\\nLa
  metodologia de recerca utilitzada ha estat qualitativa (Denzin i Lincoln, 1994;
  Vall\u00e8s, 1997; Ru\u00edz Olabu\u00e9naga, 1999; Alonso, 1998; Ir\u00ed\u00f1iguez,
  1999) i aquesta perfil\u00e0 un proc\u00e9s de recerca amb les caracter\u00edstiques
  seg\u00fcents:\\n\\n- Pret\u00e9n aconseguir una visi\u00f3 global i integrada del
  context de l\u2019objecte d\u2019estudi.\\n\\n- Intenta copsar les percepcions dels
  actors des de dins, a trav\u00e9s d\u2019un proc\u00e9s de profunda atenci\u00f3,
  de comprensi\u00f3 emp\u00e0tica i de ruptura amb les preconcepcions sobre els t\u00f2pics
  de la discussi\u00f3.\\n\\n- Pret\u00e9n identificar temes i expressions que poden
  ser revisats amb els informants, per\u00f2 que han de conservar el seu format original
  a trav\u00e9s de l\u2019estudi.\\n\\n- Explica les formes en qu\u00e8 les persones
  comprenen, narren i actuen en situacions quotidianes.\\n\\n- Genera interpretacions
  diverses a partir d\u2019un marc te\u00f2ric existent.\\n\\nLa perspectiva qualitativa
  emprada en el present treball es caracteritza perqu\u00e8 est\u00e0 orientada a
  l\u2019estudi dels processos de producci\u00f3 i reproducci\u00f3 de l\u2019acci\u00f3
  social a trav\u00e9s del llenguatge i la seva dimensi\u00f3 simb\u00f2lica. Els
  discursos ens situen en l\u2019esfera complement\u00e0ria d\u2019al\u00b7lo quantitatiu
  i poden ser definits com a combinacions de signes gr\u00e0cies als quals els individus
  expressen sentiments personals i significats intersubjectius que donen sentit a
  una col\u00b7lectivitat.\\n\\nLa metodologia quantitativa \u00e9s tamb\u00e9 una
  possible via per estudiar la realitat social i, si b\u00e9 la quantificaci\u00f3
  \u00e9s un aspecte que no pot ser oblidat en qualsevol estudi social, \u00e9s tan
  sols una posici\u00f3, una forma de mirar la visi\u00f3 que tenen els metges i metgesses
  sobre l\u2019etapa de la jubilaci\u00f3.\\n\\nConsiderem, aix\u00ed, que tant l\u2019aproximaci\u00f3
  quantitativa que es pugui fer posteriorment a aquest estudi (enquestes, estad\u00edstiques
  tancades i precodificades, ...) com la qualitativa aqu\u00ed presentada (entrevistes,
  grups de discussi\u00f3, ...) troben els seus l\u00edmits i tamb\u00e9 la seva complementarietat
  en moure\u2019s en esferes diferents de la realitat social (fets socials i discursos).
  La dicotomia entre les metodologies quantitatives i qualitatives se supera, doncs,
  amb un pluralisme metodol\u00f2gic que diversifiqui les formes d\u2019aproximaci\u00f3
  a la realitat social.\\n\\nLes eines utilitzades per generar la informaci\u00f3
  en el present estudi han estat els grups de discussi\u00f3 i les entrevistes en
  profunditat. Amb el procediment emprat s\u2019ha pret\u00e8s explorar els discursos
  dels professionals participants en els grups de discussi\u00f3 i protagonistes de
  les entrevistes, amb la finalitat de generar noves hip\u00f2tesis i l\u00ednies
  de treball.\\n\\nAquests procediments van ser utilitzats per generar informaci\u00f3
  comptant amb la perspectiva dels subjectes de l\u2019estudi i constitueixen una
  font de significats imprescindible ja que, d\u2019aquesta manera, es poden interpretar
  aspectes de la q\u00fcesti\u00f3 objecte d\u2019estudi que no s\u00f3n directament
  observables per\u00f2 s\u00ed definibles. \u00c9s aix\u00ed com es garanteix que
  es mostrar\u00e0 una visi\u00f3 global dels punts de vista dels subjectes de l\u2019estudi.\\n\\n-
  Entrevistes en profunditat dirigides: es caracteritzen per emprar una llista d\u2019aspectes
  que s\u2019han d\u2019explorar durant l\u2019entrevista. L\u2019ordre i les preguntes
  van ser lliures. Es van realitzar 9 entrevistes en profunditat, que es van registrar
  magnetof\u00f2nicament.\\n\\n- Grup focal: \u00e9s una entrevista o discussi\u00f3
  de grup per con\u00e8ixer i analitzar experi\u00e8ncies i opinions en relaci\u00f3
  a determinats temes. Es diu grup focal perqu\u00e8 se centra en persones que tenen
  aspectes comuns. Per tal de recollir un ampli ventall d\u2019opinions, es van identificar
  els subgrups m\u00e9s rellevants de totes les persones implicades, assegurant que
  en cada discussi\u00f3 hi havia membres de tots ells. L\u2019homogene\u00eftat entre
  les persones del grup tamb\u00e9 \u00e9s important perqu\u00e8 aix\u00ed la discussi\u00f3
  \u00e9s m\u00e9s espont\u00e0nia i lliure. Es van realitzar 2 grups focals (10-12
  participants per grup) atenent a la homogene\u00eftat i als criteris mostrals establerts.\\n\\nEls
  **subjectes de l\u2019estudi** han estat els professionals de la medicina i la tipologia
  d\u2019informants que s\u2019ha tingut en compte \u00e9s la seg\u00fcent:\\n\\n-
  Professionals de la medicina que actualment tinguin entre 60 i 65 anys (situaci\u00f3
  de prejubilaci\u00f3).\\n- Professionals de la medicina que actualment tinguin entre
  65 i 70 anys (situaci\u00f3 de postjubilaci\u00f3: que faci 1/3/5 anys que estiguin
  jubilats).\\n- Persones vinculades a entitats/associacions que coneguin particularment
  aquesta situaci\u00f3.\\n\\nEs va realitzar un **mostreig intensiu** per representativitat
  te\u00f2rica tenint en compte els criteris mostrals d\u2019inclusi\u00f3 seg\u00fcents:\\n\\n-
  Medi on, principalment, han treballat: rural/urb\u00e0.\\n- Xarxa: APS/hospital\u00e0ria/salut
  mental/sociosanit\u00e0ria.\\n\\nAquesta mostra intensiva es va ampliar amb l\u2019an\u00e0lisi
  secundari (metaan\u00e0lisi) d\u201911 entrevistes en profunditat amb informants
  experts del sistema sanitari catal\u00e0, 13 entrevistes amb gestors/res i de 5
  Grups Focals amb professionals de la medicina (amb 8-12 participants en cada grup).
  Aquestes dades estan referenciades en S\u00c1NCHEZ-CANDAMIO (2004)\\\\(^1\\\\),
  \u00cd\u00d1IGUEZ I S\u00c1NCHEZ-CANDAMIO (2005)\\\\(^2\\\\).\\n\\nLes principals
  refer\u00e8ncies per realitzar l\u2019an\u00e0lisi de les dades textuals en aquest
  estudi han estat les seg\u00fcents:\\n\\n- L\u2019opci\u00f3 de triar la psicologia
  del cicle vital com a marc te\u00f2ric adient com a guia per respondre a les preguntes
  de recerca formulades (en comptes de fer-ho amb la sociologia de les professions
  com en d\u2019altres interessants treballs realitzats en el nostre entorn);\\n-
  La definici\u00f3 dels objectius i el respecte a l\u2019estructura interna dels
  materials obtinguts en els grups de discussi\u00f3 i les entrevistes\\\\(^3\\\\);\\n-
  L\u2019elecci\u00f3 de l\u2019an\u00e0lisi de contingut i el de discurs com a procediments.\\n\\nL\u2019an\u00e0lisi
  de contingut, per una banda, permet treballar a partir d\u2019un marc te\u00f2ric
  adient i establir uns objectius clars en la investigaci\u00f3. \u00c9s a dir, saber
  (1) quines s\u00f3n les preguntes que guien la investigaci\u00f3, (2) quins s\u00f3n
  els t\u00f2pics que interessa estudiar.\\n\\nL\u2019an\u00e0lisi del discurs, per
  altra banda, permet abordar la producci\u00f3 de significats tal com sorgeixen del
  seu context m\u00e9s immediat. \u00c9s a dir, permet (1) copsar l\u2019heterogene\u00eftat
  de significats que els professionals poden tenir sobre la jubilaci\u00f3 a partir
  de les seves pr\u00e0ctiques quotidianes, (2) recollir els significats emergents,
  els que no contempla el nostre marc te\u00f2ric i, (3) incloure l\u2019opini\u00f3
  del professional en la producci\u00f3 del coneixement sobre la jubilaci\u00f3.\\n\\n---\\n\\n\\\\(^1\\\\)
  S\u00c1NCHEZ-CANDAMIO, M (coord) (2004). Informe del Proyecto titulat Estrategias
  para la mejora de la coordinaci\u00f3n entre los agentes y recursos que intervienen
  en la atenci\u00f3n sociosanitaria a las personas mayores y su calidad de vida (1+D
  n\u00b0BSO20000476).\\n\\n\\\\(^2\\\\) \u00cd\u00d1IGUEZ, L i S\u00c1NCHEZ-CANDAMIO,
  M (2005). Informe sobre l\u2019Estudi de les percepcions i valoracions de l\u2019atenci\u00f3
  sanit\u00e0ria des de la perspectiva dels professionals de la salut. CDSA 002837.\\n\\n\\\\(^3\\\\)
  Que en definitiva \u00e9s l\u2019estructuraci\u00f3 de sentit que el professional
  fa.\\n\\nResum del plantejament de la recerca:\\n\\n1\u00aa fase: disseny\\n\\n-
  Recollida d\u2019informaci\u00f3 espec\u00edfica sobre el tema i el context\\n-
  Elaboraci\u00f3 de tipologies\\n- Identificaci\u00f3 temes clau\\n- Elaboraci\u00f3
  guions entrevistes\\n- Definici\u00f3 procediment pel recull de dades\\n\\n2\u00aa
  fase: treball de camp\\n\\n- Realitzaci\u00f3 d\u2019entrevistes individuals a informants
  clau del sistema\\n- Realitzaci\u00f3 grups de discussi\u00f3\\n- Definici\u00f3
  i preparaci\u00f3 preguntes\\n- Construcci\u00f3 de la mostra\\n- Selecci\u00f3
  i convocat\u00f2ria de participants\\n- Realitzaci\u00f3 dels GF\\n\\n3\u00aa fase:
  formalitzaci\u00f3 de registres\\n\\n- Formalitzaci\u00f3 de registres i/o transcripci\u00f3
  gravacions entrevistes/grups\\n\\n4\u00aa fase: an\u00e0lisi\\n\\n- An\u00e0lisi
  de Contingut Categorial Tem\u00e0tic de les dades textuales\\n\\n5\u00aa fase: elaboraci\u00f3
  d\u2019informe\\n\\n- Redacci\u00f3 resultats finals\\n- Elaboraci\u00f3 informe\\n\\nIntroducci\u00f3
  a l\u2019estudi\\n\\nPresentaci\u00f3 d\u2019aquest informe\\n\\nAquest informe
  s\u2019inscriu en el projecte d\u2019actuaci\u00f3 de la Fundaci\u00f3 Galatea i
  ha de servir, per tant, d\u2019eina que informi sobre els processos de planificaci\u00f3,
  formaci\u00f3, desenvolupament i gesti\u00f3 propis de la seva activitat i, alhora,
  ha de contribuir a generar nous espais de debat i acci\u00f3 entre els professionals
  de la medicina.\\n\\nL\u2019informe s\u2019estructura en cinc cap\u00edtols. Aquest
  primer, de car\u00e0cter introductori, emmarca el treball en la l\u00ednia de recerca
  sobre psicologia del cicle vital des de la perspectiva metodol\u00f2gica qualitativa
  i en justifica te\u00f2ricament l\u2019inter\u00e8s de la Fundaci\u00f3 Galatea
  per l\u2019etapa de la jubilaci\u00f3 i per identificar necessitats i accions rellevants
  per promoure un desenvolupament professional satisfactori. Es presenten aix\u00ed
  els objectius de recerca i la justificaci\u00f3 que t\u00e9 la utilitzaci\u00f3
  de la perspectiva qualitativa com a metodologia per a l\u2019estudi d\u2019una realitat
  social com \u00e9s la jubilaci\u00f3, i es descriuen les t\u00e8cniques qualitatives,
  grups de discussi\u00f3 i entrevistes, emprades.\\n\\nLa visi\u00f3 i les representacions
  dels professionals es recullen en els cap\u00edtols un i dos, i en el cap\u00edtol
  tres es presenta la perspectiva de les organitzacions que es pot deduir a partir
  dels discursos actualment dominants i les seves actuacions caracter\u00edstiques.
  Aquests resultats se sostenen en l\u2019an\u00e0lisi de les transcripcions literals
  del material obtingut en les sessions dels grups de discussi\u00f3 i les entrevistes,
  que s\u2019il\u00b7lustra amb els fragments m\u00e9s significatius.\\n\\nL\u2019\u00faltim
  cap\u00edtol pren com a punt de partida els resultats de l\u2019an\u00e0lisi que
  han perm\u00e8s identificar aspectes emergents i rellevants sobre el tema que ens
  ocupa i planteja les necessitats mostrades aix\u00ed com algunes l\u00ednies d\u2019actuaci\u00f3
  rellevants per a la millora de la qualitat de vida i la satisfacci\u00f3 dels professionals
  de la medicina en l\u2019etapa de la jubilaci\u00f3.\\n\\nLes aportacions fetes
  semblen d\u2019inter\u00e8s i generen noves dimensions a la visi\u00f3 dels professionals
  envers la seva traject\u00f2ria professional i vital; de les quals se\u2019n poden
  derivar propostes innovadores i d\u2019inter\u00e8s per a l\u2019administraci\u00f3,
  les organitzacions i la professi\u00f3.\\n\\nCap\u00edtol 1\\n\\nL\u2019aproximaci\u00f3
  a la jubilaci\u00f3 des de la visi\u00f3 dels professionals de la medicina\\n\\nLa
  jubilaci\u00f3 afecta a molts tipus de persones i en entorns molt diversos, ra\u00f3
  per la qual t\u00e9 significats diferents, inclos dins d\u2019un mateix col\u00b7lectiu.
  Per tant, s\u2019ha de tenir cura de no considerar la jubilaci\u00f3 com una experi\u00e8ncia
  uniforme amb unes conseq\u00fc\u00e8ncies \u00faniques.\\n\\nDos s\u00f3n els elements
  claus en l\u2019aproximaci\u00f3 a la jubilaci\u00f3 que possibiliten l\u2019anticipaci\u00f3
  i orienten l\u2019adaptaci\u00f3 de la persona a aquesta:\\n\\na) La definici\u00f3
  dels escenaris futurs entorn a la seva jubilaci\u00f3 (la perspectiva des de la
  qual es defineixen),\\nb) La representaci\u00f3 de les particularitats de la feina
  remunerada.\\n\\nEn aquest context d\u2019an\u00e0lisi resulten cabdals la noci\u00f3
  de perspectiva i les de rol, posici\u00f3 i estatus professional per comprendre
  el fenomen de la jubilaci\u00f3 en el cas dels professionals de la medicina.\\n\\nEntenem
  aqu\u00ed per perspectiva el conjunt d\u2019idees i accions coordinades que una
  persona utilitza per resoldre un problema en una situaci\u00f3 determinada (les
  accions neixen de les creences i les creences justifiquen les accions). Aquesta
  elecci\u00f3 est\u00e0 mitjan\u00e7ada per l\u2019inter\u00e8s i la intenci\u00f3
  de la persona, de com concep el seu futur. S\u2019han de distingir les perspectives
  a llarg termini i a curt termini, i s\u2019ha de tenir en compte que tamb\u00e9
  existeixen les perspectives compartides per un grup. Aquestes s\u00f3n les formes
  de pensar i actuar que els membres del grup entenen com a \u201cnaturals\u201d i
  consideren leg\u00edtimes. Aquestes perspectives, doncs, posseeixen la validesa
  de les coses \u201cque tot el m\u00f3n coneix\u201d i \u201cque tot el m\u00f3n
  fa\u201d en relaci\u00f3 a la jubilaci\u00f3.\\n\\nPer posici\u00f3 entenem el lloc
  social que ocupa un membre determinat en l\u2019entramat de relacions i que aporta
  informaci\u00f3 (expl\u00edcita o impl\u00edcita) de les funcions, normes, rols
  associats a aquest lloc social (de metge, de jubilat, etc). I els rols es defineixen
  en aquest context com a comportaments associats a determinades posicions o estatus.
  Cada lloc social, com el de metge o de jubilat, porta aix\u00ed associat una valoraci\u00f3,
  significat i prestigi que \u00e9s l\u2019estatus. Volem distingir tamb\u00e9 entre:\\n\\n-
  L\u2019estatus subjectiu, ent\u00e8s com l\u2019avaluaci\u00f3, valoraci\u00f3 dels
  propis resultats o posici\u00f3 en comparaci\u00f3 amb els dem\u00e9s;\\n- L\u2019estatus
  social, si es d\u00f3na un acord sobre l\u2019esmentada valoraci\u00f3 entre els
  membres del grup.\\n\\n1.1. Perspectives de la jubilaci\u00f3 des de diferents posicions
  i escenaris\\n\\nLa jubilaci\u00f3 \u00e9s un esdeveniment vital important en la
  vida que implica una redefinici\u00f3 de la identitat personal i del sentit de la
  vida. Les persones pr\u00f2ximes a aquest esdeveniment visualitzen/construeixen
  un escenari de com ser\u00e0 la seva jubilaci\u00f3 i com ser\u00e0 la seva adaptaci\u00f3
  postjubilaci\u00f3 (Whitbourne, 1985). Aquesta construcci\u00f3 entorn a la jubilaci\u00f3
  \u00e9s utilitzada per les persones per aproximar-se a aquesta etapa i construir
  tamb\u00e9 una visi\u00f3 de futur que orientar\u00e0 la seva adaptaci\u00f3 a un
  moment vital nou.\\n\\nEn aquest estudi s\u2019han identificat quatre escenaris
  entorn a la jubilaci\u00f3 que venen definits per diferents posicions i perspectives
  respecte dels jubilats, les activitats pr\u00f2pies en aquesta etapa aix\u00ed com
  la rellev\u00e0ncia de la preparaci\u00f3 i traject\u00f2ria pr\u00e8via. S\u00f3n
  els seg\u00fcents:\\n\\na) La jubilaci\u00f3 com a una ruptura vital lesiva.\\nb)
  La jubilaci\u00f3 com a una oportunitat per al canvi.\\nc) La jubilaci\u00f3 com
  a una etapa \u201cnatural\u201d de la vida.\\nd) La jubilaci\u00f3 com a una condici\u00f3
  evitable.\\n\\na) La jubilaci\u00f3 com a una ruptura vital lesiva\\n\\nAquest primer
  tipus d\u2019escenari definit sobre la jubilaci\u00f3 es caracteritza per les perspectives,
  posicions, estatus percebut i perfil seg\u00fcents (vegeu taula 1).\\n\\nLa jubilaci\u00f3
  es considera des d\u2019aquesta perspectiva com un esdeveniment inevitable en la
  traject\u00f2ria professional. \u00c9s una obligaci\u00f3 m\u00e9s que un dret,
  que est\u00e0 en relaci\u00f3 amb la legislaci\u00f3 vigent i que no es veu en relaci\u00f3
  amb els desitjos d\u2019un mateix, la capacitat d\u2019afrontament ni amb els recursos
  de l\u2019entorn.\\n\\n\u201cLa gent et jubila, aquesta \u00e9s la q\u00fcesti\u00f3.
  I b\u00e9, ho has d\u2019aguantar com puguis (GF2,6).\u201d\\n\\nLa jubilaci\u00f3
  implica en aquest context una gran p\u00e8rdua dolorosa per a la persona. Per una
  banda, implica la p\u00e8rdua d\u2019unes expectatives de futur vital satisfactori\u00e9s
  ja que\\n\\n| Taula 1 | Posici\u00f3 | Estatus percebut | Economia | Activitat |
  Valoraci\u00f3 de la jubilaci\u00f3 | Perfil com a professional |\\n|---------|---------|------------------|----------|-----------|--------------------------|---------------------------|\\n|
  La jubilaci\u00f3 com a una ruptura vital lesiva | Continua molt definida per l\u2019estatus
  i el rol professional. | Estatus subjectiu diferent (m\u00e9s alt) del social. |
  Considerada no acceptable i \u201cinjusta\u201d; sovint molt inferior. | Baixa;
  no definida; sense possibilitats d\u2019exercici professional; desitgen ser actius.
  | No acceptable /lesiva. | Personal d\u2019hospital p\u00fablic, sense privada,
  en \u00e8poca d\u2019alt estatus social i percebut. M\u00e9s freq\u00fcent en homes
  i en dones sense parella, en professionals amb c\u00e0rregues familiars (pares o
  fills) i jubilats per canvi llei. |\\n\\nes viu la jubilaci\u00f3 com el reconeixement
  social que ja no s''\u00e9s \u00fatil i/o v\u00e0lid, com la porta d''entrada a
  la vellesa i es considera aquesta com una etapa sense objectius i sense utilitat
  ni valor. \u00c9s aix\u00ed com arriba a ser identificada: com l''etapa abans de
  la mort.\\n\\nHay otro factor que influye tambi\u00e9n, que no est\u00e1 directamente
  relacionado con la jubilaci\u00f3n, si no con lo que lleva en s\u00ed la jubilaci\u00f3n,
  que son los a\u00f1os. A m\u00ed me asusta much\u00edsimo el declinar f\u00edsicamente.
  Y digo f\u00edsicamente porque interpreto que si declinas intelectualmente enseguida
  ya no te das cuenta y ya no sufres [[riu]] (GF2,13).\\n\\nLes persones jubilades
  s\u00f3n, en conseq\u00fc\u00e8ncia, considerades persones grans que no tenen cap
  pes espec\u00edfic en la societat i a les que s''utilitza per beneficis pol\u00edtics
  i d''imatge.\\n\\nL''\u00fanic que volen quan pensen en nosaltres \u00e9s posar-se
  galons (GF1,2).\\n\\nPer altra banda, es veu que implica la p\u00e8rdua de contexts
  socials i les seves relacions; la p\u00e8rdua d''influ\u00e8ncia, poder, atenci\u00f3
  i admiraci\u00f3, la qual cosa implica un empobriment vital nom\u00e9s comparable
  amb la mort d''una part d''un mateix.\\n\\nA: Fa una estona est\u00e0vem parlant
  de que el metge XXX acabar\u00e0 jubilat. Qu\u00e8 vol dir, que ens tenim que preparar
  per jubilar-nos? B:Tota la vida, per morir-te (GF1,8).\\n\\nEl malestar produ\u00eft
  per la certesa de la proximitat d''aquestes p\u00e8rdues i la necessitat d''un canvi
  en el seu estil de vida, s''agreuja per la consci\u00e8ncia del que es va sacrificar
  en anys anteriors.\\n\\nEl que el prestigi s''hagi devaluat, importa o no importa,
  per\u00f2 al menos saps qu\u00e8 fas, que ets algo en concret. Quan et jubiles jo
  penso que ets... Bueno, no s\u00e9, jo penso que una mica el tr\u00e0mit de la vida...
  Jo, a vegades, dic que la vida, actualment, s\u00f3n dos parkings i una autopista
  al mig. El parking primer \u00e9s la guarderia, el col\u00b7legi i tal: la for-\\n\\nmaci\u00f3.
  Llavors entrem en l''autovia aquesta, que anem a tota velocitat i no podem ni mirar
  el paisatge, i anem corrents cap al parking que \u00e9s la residencia... Bueno,
  per\u00f2 \u00e9s que \u00e9s aix\u00ed... I lo m\u00e9s fotut del cas, per mi,
  era aquest tram d''autopista, que anem a tanta velocitat i anem tan esverats que
  \u00e9s que no sentim els ocells, no mirem el paisatge, no veiem el sol... No veiem
  res! No s\u00e9 i m''enteneu el que vull dir? (GF2,8).\\n\\nL''afrontament d''aquesta
  etapa es viu, llavors, amb un alt grau d''incertesa que est\u00e0 centrada sobretot
  en l''afrontament d''aspectes concrets com: l''esperada davallada d''ingressos,
  l''impacte en les relacions de parella i la utilitzaci\u00f3 del seu temps lliure.\\n\\nA
  vegades un pensa... A veure, jo la meva situaci\u00f3 personal en el sentit de salut,
  en el sentit de temps i tal, tu dius \\\"Bueno, jo, jo em trobo b\u00e9, no?\\\"
  Per\u00f2 a vegades et preguntes \\\"Bueno, no s\u00e9, que podria fer?\\\" Perqu\u00e8
  tampoc a vegades saps qu\u00e8 fer. Perqu\u00e8 a vegades moltes coses per\u00f2
  bueno... (GF1,15).\\n\\nDues actituds caracteritzen aquesta posici\u00f3 davant
  el malestar que genera la certesa d''unes p\u00e8rdues importants, properes i inevitables:
  la negaci\u00f3 i la ira.\\n\\nLa negaci\u00f3, caracteritzada pel rebuig de la
  proximitat de la jubilaci\u00f3 d''un mateix, de la realitat del pas del temps que
  cada vegada els apropra m\u00e9s a l''edat cr\u00edtica, i de qualsevol oportunitat
  per anticipar, parlar/pensar sobre el tema.\\n\\nSaps qu\u00e8 passa? Que jo tampoc
  no penso massa amb lo que em passar\u00e0 d''aqu\u00ed a dos anys, no? Si, aix\u00f2
  cadasc\u00fa...No, no, per\u00f2 no ara, sin\u00f3 mai. Jo no m''he fet mai un programa
  de dir \\\"Jo vull ser aix\u00f2, vull ser all\u00f2...\\\" Jo lo que he intentat
  fer... Lo que m''ha fet fer-ho b\u00e9, lo millor que s\u00e9 i ja est\u00e0. I
  dem\u00e0 tornar\u00e9 a fer igual i ja est\u00e0. I no, no m''angoixo, a veure
  qu\u00e8 em passar\u00e0 d''aqu\u00ed a 3 anys... (GF2,21).\\n\\nNosaltres a l''hospital
  hem posat en marxa, no pels metges sin\u00f3 per a tothom, un pla de jubilacions
  parcials que permet que quan s''arribi als 60 anys puguin jubilar-se rebent fins
  el 85 %. Dependent\\n\\nd\u2019una s\u00e8rie de condicionants que s\u2019ha de
  contractar gent i tot aix\u00f2, no? Nosaltres hem ofert aquesta possibilitat a
  tots els professionals de l\u2019empresa i poden acollir-se i treballen etc. Els
  meges que ho han rebut que estan entre 60 i 65, curiosament cap ha acceptat, cap!
  \u00c9s m\u00e9s, els hi vam dir que si alg\u00fa volia informaci\u00f3, ning\u00fa
  tampoc, tampoc... Escolta que no passa res que no t\u2019has de jubilar anticipadament,
  vale, vale... No s\u00e9 \u00e9s com si els agaf\u00e9s... Com si no s\u2019adonessin
  que els hi ha d\u2019arribar aquest moment tamb\u00e9. I aix\u00f2 en porta a dir
  que probablement s\u2019haur\u00e0 de treballar molt en processos de conscienciaci\u00f3
  i preparaci\u00f3 de tot aix\u00f2 (ES1,4).\\n\\nD\u2019aquesta forma, la jubilaci\u00f3
  arriba de cop, de forma inesperada i sobtada. El seu car\u00e0cter sobtat es veu
  com un fet que altera radicalment la continu\u00eftat en les seves vides i que els
  implica introduir canvis importants i de gran dificultat.\\n\\n\u00c9s absolutament
  radical. \u00c9s aix\u00f2 d\u2019estar avui a les 8 hores del dem\u00e0 i a l\u2019hospital
  o no (GF2,4).\\n\\nLa ira implica l\u2019admissi\u00f3 de la proximitat de la jubilaci\u00f3,
  per\u00f2 amb r\u00e0bia. Des d\u2019aquest punt de vista, la jubilaci\u00f3 els
  hi sembla que arriba abans de temps, quan encara s\u2019es \u00fatil, quan encara
  es poden fer moltes feines en l\u2019\u00e0mbit professional; i els hi sembla que
  implica una constataci\u00f3/reconeixement que ja no s\u2019es capa\u00e7 de realitzar
  la feina al mateix nivell que anys abans. \u00c9s, per tant, vista com a una \u201cinjust\u00edcia\u201d
  que pot passar a persones amb plenes capacitats i desitjos d\u2019exercir.\\n\\n\u00c9s
  una professi\u00f3 que si un est\u00e0 b\u00e9 mentalment i f\u00edsicament pot
  continuar exercint. I aix\u00f2 tamb\u00e9 significa un cert trauma que als 65 anys
  un es pot considerar jove per fer la feina i \u00fatil a la societat i de repent
  t\u00e9 que deixar-la (ES1,2).\\n\\nDes d\u2019aquesta perspectiva, les activitats
  considerades pr\u00f2pies de les persones jubilades consisteixen en l\u2019oci passiu
  i poc participatiu a nivell social, que pot incloure les activitats estereotipades
  de la gent gran (llegir, passejar, escoltar m\u00fasica, veure la TV, etc.). Aquestes
  activitats es valoren amb poc potencial gratificador, per\u00f2 tampoc es construeixen
  alternatives significatives, i tenen poc coneixement de les opcions possibles en
  el seu entorn pr\u00f2xim.\\n\\nAquesta construcci\u00f3 de la jubilaci\u00f3 dificulta
  la introducci\u00f3 d\u2019elements de preparaci\u00f3 per a un esdeveniment que
  \u00e9s, per altra banda, segur i que es pot predir, amb el que tamb\u00e9 es dificulta
  l\u2019adaptaci\u00f3 al mateix, confirmant aix\u00ed les expectatives inicials.
  Les prejubilacions es consideren com a una opci\u00f3 nom\u00e9s en el cas d\u2019aparici\u00f3
  de malalties incapacitadores i en aquelles especialitats de la medicina on els processos
  d\u2019envelleiximent biol\u00f2gic ho poden fer necessari (p.ex. cirurgia).\\n\\nPerqu\u00e8
  clar, no \u00e9s que em desagrad\u00e9s per\u00f2 jo tenia pressi\u00f3 assistencial.
  Jo no feia, digu\u00e9ssim, no estava en el meu lloc i que no m\u2019emprenyessin
  o que em podia tancar. Jo tenia que visitar 20 i pico de tios cada dia. I dos o
  tres dies fer cirurgia i... bueno. Aix\u00f2 quan tens 40 anys, ho fas encantad\u00edssim.
  Amb 60 i pico, entre que t\u2019has d\u2019operar de cataractes, t\u2019has de no
  s\u00e9 qu\u00e8... t\u2019has de no s\u00e9 quantos... Clar! La cosa canvia i molt
  adem\u00e9s (GF2,12).\\n\\nJo coneix algun cirurgi\u00e0 que, vaja, als 65 anys
  es vol jubilar perqu\u00e8 ell diu, jo no puc continuar operant, conscient de que
  hi ha unes habilitats que des d\u2019un punt de vista f\u00edsic han tingut una
  merma; jo, durant 20 anys, he estat de cirurgi\u00e0 per\u00f2 ha arribat un moment
  que, no m\u2019ha passat mai res vaja per\u00f2 jo s\u00e9 que estic arribant a
  un moment que aix\u00f2 pot comen\u00e7ar a succeir, jo ja estic preparat per a
  la jubilaci\u00f3. Determinada especialitat, determinada t\u00e8cnica, necessita
  unes habilitats que amb el temps es perdren, no el coneixement de les mateixes sin\u00f3
  la manera de practicar-les (ES1,5).\\n\\nb) La jubilaci\u00f3 com a una oportunitat
  per al canvi\\n\\nAquest segon tipus d\u2019escenari definit sobre la jubilaci\u00f3
  es caracteritza per les seg\u00fcents perspectives, posicions, estatus percebuts,
  i perfil, que hem matisat en el casos A i B (vegeu taula 2).\\n\\nLa jubilaci\u00f3
  es contempla aqu\u00ed com una oportunitat de tenir temps per fer coses que s\u00f3n
  vistes com a desitjables i quan encara es t\u00e9 salut.\\n\\nEncara que tamb\u00e9
  en els altres tres perfils descrits es comparteix la idea que pot ser un avantatge
  tenir m\u00e9s temps lliure per fer coses, els professionals de la medicina inclosos
  en aquest segon perfil ho veuen, a m\u00e9s, com un alliberament, i anticipen que
  el temps que ve potser ser\u00e0 millor. La jubilaci\u00f3 apareix aqu\u00ed com
  una etapa en la que no tindran obligaci\u00f3 d\u2019estar lligats a una feina,
  ni l\u2019estr\u00e8s, ni els horaris, ni la competitivitat, i una oportunitat per
  crear o desenvolupar un projecte vital ajornat.\\n\\n\u201cS\u00ed. Calidad de vida.
  No quiero que me suene m\u00e1s el despertador y no quiero que me llamen m\u00e1s
  por la noche...\u201d (GF2,3).\\n\\n\u201cJa en tinc prou! (es refereix al seu treball
  en un gran hospital) \u00a1Es que ni una condena, ni una condena dura 35 a\u00f1os!
  (GF2,3).\\n\\nEn la major part d\u2019aquests casos la jubilaci\u00f3 \u00e9s vista
  com un dret que s\u2019han guanyat despr\u00e9s d\u2019una carrera professional
  que consideren que est\u00e0 ja en el seu final, i amb un sentiment de tancar una
  etapa vital i obrir-ne una altra. Aquest tancament pot ser definit com un tancament
  despr\u00e9s d\u2019anys de molta dedicaci\u00f3 a una feina molt satisfact\u00f2ria
  que ha perm\u00e8s assolir els objectius proposats en la seva carrera professional,
  o com l\u2019alliberament d\u2019una feina molt exigent que no resultava gratificant
  en si mateixa. En els \u00faltims temps tamb\u00e9, i degut a les grans transformacions
  realitzades en el sistema sanitari catal\u00e0, la jubilaci\u00f3 s\u2019ha definit
  com un trencament amb la instituci\u00f3 que ja no es mereix m\u00e9s dedicaci\u00f3.\\n\\nAquest
  perfil de jubilats s\u00f3n persones que se senten amb salut i capacitat per realitzar
  activitats de tot tipus: de plaer, familiars, personals, socials, etc. Que poden
  gaudir de les seves aficions, les seves relacions socials i familiars i tenen objectius
  vitals que volen assolir abans de morir.\\n\\n\u201cPues... Jo vaig deixar... A
  veure, ara en tinc 66, vaig deixar l\u2019hospital X als 60 anys perqu\u00e8 vaig
  creure que ja n\u2019hi havia prou, ja havia treballat prou i tot m\u2019havia anat
  molt b\u00e9 i ja en tenia prou. I vaig deixar el segur\u00f3 als 65 anys perqu\u00e8
  jubilant-me cobrava m\u00e9s que treballant i llavors vaig dir que ja en tenia prou.
  I des de que no faig l\u2019hospital i que no faig el segur\u00f3 doncs estic molt
  content. Perqu\u00e8 faig molt\u00edssimes altres coses (GE1,5).\\n\\n\u201cYo,
  en diciembre de 2007, que ya tendr\u00e9 m\u00e1s de 64, porque como me han dicho
  que he cotizado mucho y esto, me retiro. \u00bfPor qu\u00e9? Porque \u201cja en
  tinc prou\u201d. Y adem\u00e1s es una opci\u00f3n personal, quiero estar m\u00e1s
  tiempo con mi mujer, que incidentalmente ella se jubila tambi\u00e9n. Y queremos
  hacer cosas juntos. Soy jefe de servicio. No tengo ning\u00fan jefe que me putee.
  Hago un trabajo que me gusta. Pero considero que \u201cja en tinc prou!\u201d Ya
  he hecho suficiente. (GF2,3).\\n\\n\u201cPero, vamos, y en cambio yo cuando me jubilen
  tengo much\u00edsimas cosas para hacer, como la mayor parte. Los m\u00e9dicos tambi\u00e9n
  tenemos la suerte de que tenemos una amplitud de miras importante. Me queda por
  leer \u00bfsabe Dios cu\u00e1nto? Me queda por escuchar m\u00fasica \u00bfsabe Dios
  cu\u00e1nta? Me queda\\n\\n| TAULA 2 | Posici\u00f3 | Estatus percebut | Economia
  | Activitat | Valoraci\u00f3 de la jubilaci\u00f3 | Perfil com a professional |\\n|---------|---------|------------------|----------|-----------|--------------------------|---------------------------|\\n|
  **La jubilaci\u00f3 com a una oportunitat per al canvi** | A. Poc definida per l\u2019estatus
  i el rol professional. | Estatus subjectiu diferent (m\u00e9s alt) del social. |
  No considerada una limitaci\u00f3 problem\u00e0tica. | Intensa i definida; no sanit\u00e0ria;
  per\u00f2 que se senten actius. | Desitjada. | Professionals sense vocaci\u00f3
  de partida o cansats, que no han tingut estatus alt. |\\n|         | B. Definida
  pel rol professional. | Estatus subjectiu m\u00e9s alt o sovint igual que el social.
  | | Intensa, definida; sanit\u00e0ria; se senten actius. | Aprofitable. | Professionals
  amb vocaci\u00f3 i alt estatus (gestors, planificadors, staff). |\\n\\npor escribir
  mi historia para que mis nietos la sepan... Pues bueno, \u00a1las tontadas esas
  que no se hacen! A otros les gusta pintar, a otros... Los m\u00e9dicos tenemos esa
  ventaja (GF2,5).\\n\\nLlavors jo vaig buscar quina cosa podia estudiar que m''interess\u00e9s
  i que em fos asequible. Clar, jo em vaig treure la XXX. Jo no podia anar a Enginyeria
  t\u00e8cnica. Llavors hi havia en el Seminari... L''ISCREP que en diuen, que \u00e9s
  l''Institut Superior d''Ensenyances Religioses, que fan una diplomatura oficial
  sobre l''ensenyan\u00e7a religiosa. Jo vaig anar all\u00e0, em vaig matricular i
  vaig fer la diplomatura. Clar i estudiaves coses que t''eren asequibles i molt maques,
  d''antropologia, \u00e8tica, metaf\u00edsica... Vull dir, coses interessant\u00edssimes.
  A m\u00e9s, vaig fer l''idioma, vaig fer pues l''hebreu i tal. Perqu\u00e8 era asequible
  per l''horari i era asequible pel nivell que donaven all\u00e0. I aix\u00f2 em va
  anar molt b\u00e9. Vaig fer la diplomatura, tres anys, em van donar el t\u00edtol,
  el Senyor Cardenal em va donar et t\u00edtol, un quadre all\u00e0 amb el t\u00edtol...
  I \u00e9s un t\u00edtol oficial. I despr\u00e9s vaig continuar amb la llicenciatura,
  dos anys que els vaig fer amb quatre. I les ensenyances que donen s\u00f3n asequibles
  pels que hem fet una carrera. Pues aix\u00f2 (GF1,26).\\n\\nDes d''aquesta posici\u00f3,
  l''entrada en una nova etapa possibilita portar a terme un projecte vital nou o
  un projecte vital sempre desitjat i apla\u00e7at per les exig\u00e8ncies de la feina.
  S''ent\u00e9n que, per fi es disposar\u00e0 de temps per realitzar aquelles activitats
  que no es van poder fer perqu\u00e8 s''havia de treballar.\\n\\nJo, per exemple,
  jo vaig ser metge. Per vocaci\u00f3? Pues no ho s\u00e9. Com que el meu pare ho
  era i als anys 55, doncs si un pare era metge, el fill era metge. \u00c9s clar,
  si a mi em diuen si vaig ser metge per vocaci\u00f3? No. Per qu\u00e8 vaig fer l''especialitat
  d''obstetricia i ginecologia? Perqu\u00e8 el meu pare ho era. Que m''ha agradat
  fer partis? Mai. I n''he fet molts. Perqu\u00e8 el meu pare ho era. Quina sort vaig
  tenir jo? Que vaig trobar un punt, i no \u00e9s que fos infeli\u00e7 fent-ho, eh!
  Cuidado! Una cosa \u00e9s que no t''agradi fer una cosa i l''altra \u00e9s que no
  la facis b\u00e9 i que, a m\u00e9s a m\u00e9s, hi disfruts fent-ho. Perqu\u00e8
  jo vaig ser ginec\u00f2leg i obstetra perqu\u00e8 el meu pare ho era. No per vocaci\u00f3.
  Clariss\u00edssament. Qu\u00e8 vaig trobar? Dins de la medicina per sort d''un viatge
  a Alemanya, vaig trobar un punt, que llavors estava lligat amb la ginecologia que
  llavors estava lligat amb la citopatologia i el diagn\u00f2stic preco\u00e7 del
  c\u00e0ncer, i all\u00e0 m''hi vaig enganxar. I aix\u00f2 \u00e9s lo que llavors
  s''en va anar mantenint amb aquesta dualitat (GF1,12).\\n\\nEls professionals que
  comparteixen aquesta perspectiva ja han elaborat plans amb activitats que volen
  desenvolupar al marge de la seva activitat professional i on la seva identitat personal
  es vegi refor\u00e7ada (aficions, fam\u00edlia, nous estudis, etc.). Encara que
  fer plans no \u00e9s exclusiu d''aquest escenari, el m\u00e9s caracter\u00edstic
  \u00e9s que els plans de futur tenen una alta implicaci\u00f3 personal, ja siguin
  en la esfera afectiva, l\u00fadico-professional o de comprom\u00eds social (per
  exemple, voluntariat) s\u00f3n considerats centrals en la seva identitat personal
  i poden mantenir o no una relaci\u00f3 amb la seva identitat professional.\\n\\nEl
  context immediat apareix aqu\u00ed com una font d''activitats significatives per
  mantenir una participaci\u00f3 que refor\u00e7a la seva identitat personal i social.\\n\\nYo
  quiero estar m\u00e1s tiempo con mi mujer... Queremos hacer cosas juntas (GF2,3).\\n\\nHi
  ha mils de maneres de ser \u00fatil (...) Hi ha una s\u00faper urgent, que per aix\u00f2
  li he dit a ell abans \\\"Ja et trucare\\\", que \u00e9s escriure en els diaris
  coses de salut p\u00fablica, medecina preventiva, de... L''altre dia hi havia un
  pediatra, el X, que escriuia una carta que nom\u00e9s deia \\\"Recordo que el codi
  civil diu que els fills no poden pegar als pares i que, a m\u00e9s....\\\" Bueno,
  doncs, \u00e9s, \u00e9s un testimoni escrit per una persona... Hi ha mils de coses
  per fer. Jo he tingut dos n\u00e9s operats i quan els han operat, jo a la sala d''espera
  m''he endut una revista i m''he asentat i he fet de traductora. Perqu\u00e8 passa
  el metge i diu \\\"El passarem a alimentaci\u00f3 parenteral\\\" i la mare plora
  perqu\u00e8 es pensa que vol dir que li obren el cap. I tu li dius \\\"No, sap qu\u00e8
  vol dir?...\\\" \u00c9s igual vull dir... si ets creient tens una parroquia a la
  cantonada que t''enganxaran perqu\u00e8 els hi portis la comptabilitat i hi ha tants
  pocs quartos per comptar que acabar\u00e0s r\u00e0pid, per\u00f2... No s\u00e9 si
  menten''s? Feina n''hi ha molta, crec jo (GF1,10).\\n\\n\u00c9s possible que es
  plantegin tamb\u00e9 la realitzaci\u00f3 d\u2019activitats relacionades amb la seva
  identitat professional, com aquelles que els permet col\u00b7laborar com a \u201cprofessionals
  de la medicina jubilats\u201d i construir una identitat \u201cprofessional\u201d
  nova. Hi ha una clara identificaci\u00f3 del que ja no podran fer, del que hauran
  de fer de forma diferent i del que encara podran continuar fent.\\n\\nLa mort tamb\u00e9
  est\u00e0 present en aquest escenari entorn a la jubilaci\u00f3, per\u00f2 vista
  com el punt final abans del qual encara es poden assolir objectius vitals que es
  consideren importants i que un determinat exercici de la professi\u00f3 no havia
  perm\u00e8s desenvolupar. Es vol gaudir amb salut el temps que queda. Habitualment,
  \u00e9s el contacte amb la proximitat de la mort, la malaltia o l\u2019experi\u00e8ncia
  diferida amb la jubilaci\u00f3 d\u2019alguna persona significativa, el que se situa
  en l\u2019origen de voler veure la jubilaci\u00f3 com una situaci\u00f3 de la que
  es pot gaudir.\\n\\n\u201cHan ocurrido varias cosas a mi alrededor. He tenido familiares
  y amigos que se han muerto a los 50 y pico de a\u00f1os. Y a mi, no estoy obsesionado,
  no estoy neurotizado, pero co\u00f1o, esto es una estafa. Entonces, quiero decir
  que no hace mucho, a un m\u00e9dico conocido, el XXX, 6 meses antes de jubilarse
  le diagnostican un c\u00e1ncer de est\u00f3mago. Y al cabo de 6 meses de jubilarse,
  despu\u00e9s de haber ido a quimioterapia y de todo tipo, se muri\u00f3. Otro jefe
  de cardiolog\u00eda\u2026 de XX, 55 a\u00f1os, el d\u00eda de la verbena de San
  Juan ahora hace un a\u00f1o \u201cMe ha sentado mal la coca, no s\u00e9 qu\u00e9\u2026\u201d
  En marzo lo enteramos. Un primo m\u00edo, c\u00e1ncer de p\u00e1ncreas, de mi misma
  edad. A los 59 a\u00f1os. Entonces digo \u201cNo\u2026 A mi no\u2026Yo no quiero
  esto\u201d (GF2,3).\\n\\n\u201cJo me\u2019n recordo de metges que m\u2019han dit
  aix\u00f2. L\u2019ur\u00f2leg que portava el meu pare, no s\u00e9 si \u00e9s mort
  o no, un dia em va dir, m\u2019ho va dir a mi, \u201cMai et passi com m\u2019ha
  passat a mi. M\u2019he passat la vida treballant i no n\u2019hi he tret res\u201d.
  Em va deixar\u2026 I era XXX, eh? Aix\u00f2, i que el meu pare quan el van jubilar
  als 70 anys, el primer dia que es lleva diu \u201cJo qu\u00e8 far\u00e9 avui?\u201d,
  jo vaig dir \u201cAix\u00f2 a mi no em passar\u00e0 (GF1,1,3).\\n\\nDes d\u2019aquesta
  perspectiva es contempla positivament la preparaci\u00f3 per a la jubilaci\u00f3,
  encara que es considera un assumpte personal, que implica gaireb\u00e9 exclusivament
  aspectes econ\u00f2mics. Per poder gaudir de la jubilaci\u00f3 resulta aqu\u00ed
  important tenir els recursos econ\u00f2mics considerats necessaris. Les prejubilacions
  es contemplen com una opci\u00f3 desitjada, una oportunitat per comen\u00e7ar de
  nou, sempre i quan es puguin garantir els ingressos que es consideren necessaris.\\n\\n\u201cYo
  tendr\u00e9 64 pero como me han dicho que he cotizado mucho y esto, me retiro (GF2,3).\\n\\n\u201cEm
  fa il\u00b7lusi\u00f3 entrar en una nova etapa, s\u00ed. Em fa il\u00b7lusi\u00f3
  entrar\u2026 en una nova etapa. En una nova etapa, fer cases que no he fet. Perqu\u00e8
  jo m\u2019he dedicat molt a la professi\u00f3 i no he fet res m\u00e9s. I llavors,
  pues, voldria fer aix\u00f2, s\u00ed. I ho far\u00e9 perqu\u00e8 ja ho tinc\u2026
  Bueno, en fi, evidentment bi ha les limitacions que podem tenir, per\u00f2\u2026
  Jo penso que llavors, jo no ni llars de jubilats ni hist\u00f2ries d\u2019aquestes.
  Res de res de res. Vull dir, jo realment penso que cadasc\u00fa s\u2019ha de buscar
  la vida. Gent que som professionals i que hem tingut una sort de poder fer funcionar
  el cervell i moltes altres coses, doncs, penso que tampoc som els m\u00e9s pobres
  del m\u00f3n. Llavors, penso que podem anar tirant\u2026 (GF2,15).\\n\\nc) La jubilaci\u00f3
  com a una etapa \u201cnatural\u201d de la vida\\n\\nAquest tercer perfil d\u2019escenari
  definit sobre la jubilaci\u00f3 es caracteritza per les seg\u00fcents perspectives,
  posicions, estatus percebuts i perfil (vegeu taula 3).\\n\\nLa jubilaci\u00f3 \u00e9s
  vista des d\u2019aquesta \u00f2ptica com una etapa m\u00e9s de la vida, en la que
  la continu\u00eftat amb la resta d\u2019etapes evolutives \u00e9s el que li d\u00f3na
  sentit. Es creu que forma part del seu curs \u201cnatural\u201d, esperat i, per
  tant, no problem\u00e0tic. Per a aquestes persones, durant aquesta etapa, es mantenen
  i desenvolupen els valors, les actituds i les creences que han orientat la vida
  adulta. Considerant que canviaran les activitats, que passaran a ser les \u201cnormals\u201d
  per als jubilats per\u00f2 que els objectius vitals que han guiat les etapes vitals
  anteriors es poden continuar desenvolupant.\\n\\n\u201cSi com a metge has ajudat
  a la salut de les persones, ajuda ara (GF1,15).\\n\\nLa jubilaci\u00f3 resulta aix\u00ed
  una transici\u00f3 normal que les persones han de fer al llarg de la seva vida perqu\u00e8
  ja hi compren. Un proc\u00e9s amb les seves dificultats per\u00f2 tamb\u00e9 amb
  les seves gratificacions. S\u2019han identificat les p\u00e8rdues que caracteritzen
  aquesta transici\u00f3, els canvis que implicaran una adaptaci\u00f3 i diferents
  camins per arribar a integrar la nova situaci\u00f3.\\n\\nLa jubilaci\u00f3 \u00e9s
  considerada, doncs, un esdeveniment m\u00e9s de la vida, equivalent a d\u2019altres
  anomenats en la teoria, transicions vitals normatives (casar-se, tenir fills, perdre
  alguna persona estimada, ...), que no \u00e9s en si mateix negatiu ni positiu, i
  al que es far\u00e0 front amb les mateixes estrat\u00e8gies que s\u2019han utilitzat
  fins el moment.\\n\\n\u201c\u00c9s que la jubilaci\u00f3 no \u00e9s una cosa de
  l\u2019altre m\u00f3n. \u00c9s una etapa, eh? Dius: \u201cOh, \u00e9s que far\u00e0s
  d\u2019avi\u2026\u201d Que no has fet ja d\u2019avi? Oh, que no he fet de ciutad\u00e0?
  Que no has actuat pol\u00edticament parlant en la teva ciutat, el teu poble, el
  teu, el teu\u2026 a la teva professi\u00f3?\u201d (GF1,11).\\n\\nVeuen als jubilats
  i jubilades com a persones actives i participatives en el seu entorn, que l\u2019\u00fanic
  que els diferencia de la resta de persones \u00e9s el fet que ja no ocupen un lloc
  de treball.\\n\\n\u00c9s en aquest sentit que es troba continu\u00eftat, ja que
  les activitats que es realitzin en un futur estaran en relaci\u00f3 amb les activitats
  que s\u2019hagin fet abans, i s\u00f3n activitats tipificades com a pr\u00f2pies
  de la gent gran i considerades com a significatives i que poden ser gratificant,
  la qual cosa implica una predisposici\u00f3 positiva per part de la persona que
  es jubila. En aquest punt es veu una difer\u00e8ncia clau amb d\u2019altres perspectives
  (com la que construeix la jubilaci\u00f3 com a una ruptura vital lesiva).\\n\\n\u201cPer\u00f2
  penso que \u00e9s una etapa de la vida ben enriquecedora, diria jo. Tot \u00e9s
  la forma que tu\u2026 La teva predisposici\u00f3 que ha dit ell, perqu\u00e8 si
  tu tens els ulls oberts a tot lo que passa, \u00e9s una etapa divina. \u00c9s una
  etapa molt bona. Igual com pot ser una etapa, l\u2019etapa d\u2019estudiar, l\u2019etapa\u2026
  Jo penso que s\u00f3n etapes de la vida. \u00c9s buscar-hi un sentit positiu\u201d
  (GF1,14).\\n\\nDos processos caracteritzen aquesta posici\u00f3 davant la jubilaci\u00f3:
  l\u2019acceptaci\u00f3 i l\u2019ajust.\\n\\nL\u2019acceptaci\u00f3 es caracteritza
  per la percepci\u00f3 de la jubilaci\u00f3 com quelcom inevitable, esperat, propi
  del viure; no se sent dolor sin\u00f3 no resist\u00e8ncia i actitud positiva davant
  de l\u2019avan\u00e7 de la vida i el pas del temps.\\n\\nL\u2019ajust implica l\u2019articulaci\u00f3
  d\u2019una vida quotidiana que s\u2019emmotlla a una visi\u00f3 t\u00edpicament
  i socialment prevista de les activitats, funcions i responsabilitats de les persones
  jubilades.\\n\\nLa preparaci\u00f3 per a la jubilaci\u00f3 resulta aix\u00ed tamb\u00e9
  un proc\u00e9s progressiu d\u2019ajustament d\u2019expectatives que es va fent durant
  els anys previs a la jubilaci\u00f3, durant els qual es generen estrat\u00e8gies
  a nivell personal, familiar i social, que permetran adaptar-se a la nova situaci\u00f3.
  Malgrat aix\u00f2, les prejubilacions s\u00f3n, com en la resta de posicions aqu\u00ed
  descrites, poc valorades i nom\u00e9s es veuen necess\u00e0ries per motius de salut
  (pr\u00f2pia o de familiars a c\u00e0rrec).\\n\\nd) La jubilaci\u00f3 com a una
  condici\u00f3 evitable\\n\\nAquest quart perfil d\u2019escenari definit sobre la
  jubilaci\u00f3 es caracteritza per les seg\u00fcents perspectives, posicions, estatus
  percebuts i perfil (vegeu taula 4).\\n\\nAquesta posici\u00f3 davant la jubilaci\u00f3
  es caracteritza per la seva negaci\u00f3 o evitaci\u00f3 en tant que etapa del cicle
  vital: per jubilar-se amb la il\u00b7lusi\u00f3 de no haver-se jubilat. Aquesta
  evitaci\u00f3 o apla\u00e7ament es pot produir, principalment, de dues maneres.
  La primera, com a estrat\u00e8gia per adaptar-se a la jubilaci\u00f3 de forma gradual
  i, en aquest cas, s\u2019utilitza la pr\u00e0ctica privada per augmentar el sentiment
  de control del proc\u00e9s i assegurar un \u201catterrament suau\u201d (soft landing)
  en la jubilaci\u00f3.\\n\\nLa segona manera d\u2019apla\u00e7ar consisteix en una
  negaci\u00f3 radical de la pr\u00f2pia jubilaci\u00f3 i la resist\u00e8ncia a qualsevol
  mena de canvi. Es busquen/activen totes les estrat\u00e8gies i recursos disponibles
  per tal d\u2019evitar qualsevol canvi. No es definenien com a jubilats i continuen
  amb la seva activitat professional, privada, amb la m\u00e0xima dedicaci\u00f3,
  el m\u00e0xim de temps possible sense contemplar cap alternativa, fins i tot amb
  posicions que podr\u00edem qualificar de clares \u201cfugides endavant\u201d.\\n\\nEls
  i les professionals de la medicina que comparteixen aquesta perspectiva s\u2019esforcen
  en que la jubilaci\u00f3 modifiqui el m\u00ednim les seves rutines quotidianes,
  la seva identitat i la seva posici\u00f3 en l\u2019estructura social aix\u00ed com
  les relacions establertes amb els dem\u00e9s. Al voler creure que no ha d\u2019haver-hi
  canvis significatius, creuen que la preparaci\u00f3 \u00e9s innecess\u00e0ria i
  les pr\u00e9jubilacions s\u00f3n positives nom\u00e9s per a aquelles persones que
  les desitgin.\\n\\n\u201cJo sempre havia pensat que treballaria fins els 70, si
  em deixessin i si em trob\u00e9s b\u00e9. Per qu\u00e8? Doncs perqu\u00e8 jo faig
  una feina que la faig a gust, tinc la gran sort de poder-la fer amb tranquil\u00b7litat.
  No vaig agobiat i per mi \u00e9s la meva vida! I a mi hi ha gent que suposo que
  espera la jubilaci\u00f3 per fer coses que no ha pogut fer mai o perqu\u00e8 est\u00e0
  agobiat de la feina\u2026 Total, com que no \u00e9s el meu cas! Jo he pogut treballar
  sempre b\u00e9 i he tingut moltes hores per mi. I llavors, clar, l\u00f2gicament,
  jo continuar\u00e9\u2026\u201d (GF2,2).\\n\\n\u201cY la privada, bueno, pues les
  sirve para ir\u2026 para ir reduciendo su actividad m\u00e9dica de forma paulatina
  y poder vivir m\u00e1s y estar m\u00e1s\u2026 Seguir manteniendo esta relaci\u00f3n
  m\u00e9dico-enfermo\u2026\u201d (GF2,4).\\n\\nAquesta manera de continuar implica,
  habitualment, mantenir la mateixa posici\u00f3, estatus i rol \u201ccom si\u201d
  no pass\u00e9s res de nou; per\u00f2 en d\u2019altres s\u2019afegeix tamb\u00e9
  una actitud de desafiament i recan\u00e7a cap a les institucions que es concreta
  en accions realitzades per tal de demostrar que es pot continuar malgrat que el
  sistema els hagi fet fora.\\n\\n| TAULA 4 | Posici\u00f3 | Estatus percebut | Economia
  | Activitat | Valoraci\u00f3 de la jubilaci\u00f3 | Perfil com a professional |\\n|---------|---------|------------------|----------|-----------|--------------------------|---------------------------|\\n|
  La jubilaci\u00f3 com a una condici\u00f3 evitable | Cont\u00ednua molt definida
  per l\u2019estatus i el rol professional. | Estatus subjectiu equivalent al social.
  | Amena\u00e7ada. | Alta; definida per la continuitat en l\u2019exercici professional.
  | Desestimada per indesirable. | Professionals amb estatus alt i amb pr\u00e0ctica
  privada continuada. M\u00e9s freq\u00fcent en homes. |\\n\\n1.2. La representaci\u00f3
  de la professi\u00f3 de metge en comparaci\u00f3 amb d\u2019altres professions\\n\\nLa
  forma en que les persones es plantegen la jubilaci\u00f3, quan comencen a assumir
  la realitat que un dia es jubilaran, i quines accions inicien amb l\u2019objectiu
  de facilitar aquesta transici\u00f3, etc., depenen en gran mesura de dues q\u00fcestions:\\n\\n-
  La representaci\u00f3 que es fan de les particularitats del seu lloc de treball
  (tipus de feina, hores invertides, demandes laborals, etc.), el context d\u2019aquests
  rols (actituds davant el treball, comprom\u00eds i import\u00e0ncia atribu\u00efda,
  o performance, etc.).\\n\\n- De la seva traject\u00f2ria professional.\\n\\nEn aquest
  context, hem identificat dues representacions marcadament diferenciades:\\n\\na)
  Ser metge com a tret diferencial i identitari.\\nb) Fer de metge com una professi\u00f3
  igual que d\u2019altres.\\n\\na) Ser metge com a tret diferencial i identitari\\n\\nLa
  professi\u00f3 de metge es representa, en la major part del col\u00b7lectiu, com
  una professi\u00f3 principalment vocacional, on el plaer per l\u2019exercici compensa
  els grans sacrificis que s\u2019han de fer (una formaci\u00f3 llarga i exigent que
  s\u2019ha d\u2019actualitzar continuament, horaris que dificulten la vida personal
  i la conciliaci\u00f3 amb la vida familiar, tensi\u00f3, etc.). La satisfacci\u00f3
  laboral \u00e9s vista aix\u00ed com una qualitat intr\u00ednseca a l\u2019exercici
  professional. Aquesta vocaci\u00f3 porta a mantenir una dedicaci\u00f3 molt forta
  a la feina aix\u00ed com moltes hores d\u2019estudi i actualitzaci\u00f3 de coneixements,
  amb el que el professional emplena una part de l\u2019activitat quotidiana m\u00e9s
  gran que altres professions.\\n\\nResulta, doncs, que ser metge pot implicar per
  complet el projecte vital i que esdev\u00e9 una part important de la identitat personal
  i social, donat que tamb\u00e9 els altres li atorguen de manera permanent aquesta
  condici\u00f3.\\n\\n\u201cMetge no ho deixes de ser mai... imprimeix car\u00e0cter
  (GF1,14).\\n\\n\u201cEn el moment que et jubiles seguir\u00e0s sent metge i, de
  tant en tant, encara la teva fam\u00edlia i far\u00e0 preguntes, i un vei et vindr\u00e0
  a ensenyar uns an\u00e0lisis... (GF1,14).\\n\\nPels professionals amb aquesta visi\u00f3,
  el reconeixement social que ha acompanyat la seva posici\u00f3 professional ha constituit
  una dimensi\u00f3 important de la seva vida. Retirar-se a una esfera privada suposa,
  aix\u00ed, un canvi complet de direcci\u00f3, en el que es veuen privats de nutrients
  fonamentals de la seva identitat: la identificaci\u00f3 amb una instituci\u00f3
  de gran prestigi, el poder d\u2019influ\u00e8ncia sobre altres persones, pol\u00edtiques
  i/o la comunitat, aix\u00ed com l\u2019afirmaci\u00f3 constant de la import\u00e0ncia
  del seu rol com a guia d\u2019altres.\\n\\nJo us ho dir\u00e9 que a mi \u00e9s una
  cosa que sempre m''ha servit molt. A mi la feina m''ha donat una identitat social.
  Diu \u201cVost\u00e8 qu\u00e8 \u00e9s?\u201d, \u201cAh, no, miri, jo s\u00f3c metge,
  treballo en un poble\u201d. \u201cAh, vale, vale...\u201d Sembla que quan est\u00e0s
  jubilat perds la teva identitat. Home, evidentment tens que tenir la teva personal
  que et serveix per viure, per\u00f2 socialment... (GF2,7).\\n\\nNo veig massa difer\u00e8ncia
  si ets metge o ets una altra cosa (GF2,2).\\n\\nQuan fem de metges no nom\u00e9s
  som metges, som persones que som metges. A mida que els anys avancen, cada vegada
  la medicina t\u00e9 que ocupar menys lloc i lo altre, sigui el que sigui, t\u00e9
  que ocupar m\u00e9s lloc (GF1,12).\\n\\nb) Fer de metge com una professi\u00f3 igual
  que d\u2019altres\\n\\nLa professi\u00f3 de metge es representa per una part significativa
  encara que menor en el col\u00b7lectiu de forma que \u00e9s nom\u00e9s un element
  m\u00e9s, lligat a l\u2019esfera laboral i que no \u00e9s m\u00e9s rellevant que
  la seva identitat com a membres d\u2019altres contexts (p. e. familiar). Aquests
  veuen que han constru\u00eft al llarg de la vida adulta, una identitat equilibrada
  entre els diferents contexts de participaci\u00f3 i que amb la jubilaci\u00f3 tindran
  l''oportunitat de desenvolupar aspectes que fins ara ocupaven un lloc m\u00e9s secundari.\\n\\n...D\u2019alguna
  manera comences a viure amb una identitat que \u00e9s la teva i no la del metge...
  (GF2,12).\\n\\nDes d\u2019aquesta perspectiva, el reconeixement social que ha acompanyat
  la seva posici\u00f3 professional ha estat un extra afegit al rol professional,
  que servia per compensar l\u2019alta dedicaci\u00f3 i les demandes de l\u2019exercici
  de la medicina.\\n\\nLes recompenses de la dedicaci\u00f3 estan aix\u00ed posades
  fora de la pr\u00f2pia professi\u00f3. L\u2019exercici de la medicina \u00e9s/ha
  estat un mitj\u00e0 per aconseguir uns objectius vitals extraprofessionals. Ser
  metges esdev\u00e9, aix\u00ed, una professi\u00f3 que han realitzat a gust i que
  els ha perm\u00e8s viure c\u00f2modament.\\n\\nLa medicina \u00e9s una feina (GF1,13).\\n\\n1.3.
  Els reptes definits en l\u2019aproximaci\u00f3 a la jubilaci\u00f3\\n\\nAra b\u00e9,
  malgrat que la major part dels professionals s\u2019han fet una idea de com seran
  les seves vides despr\u00e9s d\u2019haver-se jubilat, relativament pocs han fet
  plans espec\u00edfics o detallats pr\u00e8viament. El que caracteritza aquesta transici\u00f3,
  a difer\u00e8ncia d\u2019altres de la vida adulta, \u00e9s la percepci\u00f3 que
  est\u00e0 fora del control d\u2019un mateix i que, per tant, \u00e9s dif\u00edcil
  modificar les perspectives futures, fins i tot quan aquestes no s\u00f3n definides
  com a favorables. L\u2019estrat\u00e8gia d\u2019afrontament m\u00e9s utilitzada
  \u00e9s intentar retardar-la el m\u00e0xim possible en comptes d\u2019intentar anticipar
  necessitats i planificar el seu afrontament (Taylor i Doverspike, 2003).\\n\\nAltres
  investigacions en aquest tema coincideixen en aquest aspecte. En pa\u00efsos com
  Gran Bretanya nom\u00e9s el 40%, aproximadament, dels treballadors d\u2019edats
  entre 51 i 61 anys han fet plans concrets per la seva jubilaci\u00f3, assegurant-se
  un bon nivell d\u2019ingressos o iniciant activitats significatives que podran continuar
  despr\u00e9s de deixar de treballar. La resta, un 60%, no ha fet plans concrets
  o no desitja jubilar-se. A Espanya aquests percentatges s\u00f3n encara m\u00e9s
  alts: aproximadament el 75% dels treballadors entre 50 i 65 anys no han fet plans
  concrets o no desitgen jubilar-se (Suso, 2004). En aquest estudi es confirmen les
  mateixes proporcions.\\n\\n\u201cYo quiero contar una, una peque\u00f1a an\u00e9cdota\u2026
  Mm, yo me re\u00edno todav\u00eda con los chicos del colegio. Y el d\u00eda que
  iba a cumplir 60 a\u00f1os, hay uno que los cumple el d\u00eda siguiente, e hicimos
  una fiesta. \u00c9ramos 8 o 9. Ninguno era m\u00e9dico. Y dije \u201cDe aqu\u00ed
  a 5 a\u00f1os me jubilo\u201d. Escandalizados. \u201cYo no sabr\u00eda vivir sin
  trabajar. \u00a1Qu\u00e9 barbaridad!\u201d Que tal y que cual. Yo hace a\u00f1os
  que pienso y lo he tenido clar\u00edsimo, pero en mi entorno educativo de gente,
  con m\u00e1s o menos para m\u00ed\u2026 mi mismo background social, \u00a1es que
  no pod\u00edan ni pensar! Tampoco los iban a jubilar como en XXX\u2026 Pero vamos,
  esto es \u201cVamos, pero si est\u00e1 en la mejor \u00e9poca de tu vida, pero si
  tal y cual! (GF2,25).\\n\\nEn aquest sentit, i m\u00e9s concretament, trobem que
  una gran part de treballadors i treballadores al nostre pa\u00eds han d\u2019afrontar
  dos reptes principals:\\n\\n- Identificar els elements que dificulten la preparaci\u00f3
  i anticipaci\u00f3 d\u2019una transici\u00f3 vital normativa, predible, seq\u00fcencial.\\n-
  Reduir la incertesa entorn a la jubilaci\u00f3 i a la seva capacitat d\u2019adaptar-se
  a la transici\u00f3 vital.\\n\\nA continuaci\u00f3, definim alguns dels reptes concrets
  identificats:\\n\\n- Fer front al sentiment de malestar/por/dubte que genera la
  certesa d\u2019apropar-se a una etapa marcada per una p\u00e8rdua d\u2019identitat
  important.\\n- Fer front a la incertesa generada per apropar-se a una etapa marcada
  tamb\u00e9 per la trobada d\u2019un nou sentit de la vida quotidiana que es caracteritza
  per no tenir una activitat central que l\u2019organitzi.\\n\\n\u201cI diuen \u201cpodr\u00e1s
  llegar\u201d. Coi no em passar\u00e9 el dia llegint! (GF1,8).\\n\\n- Trobar el significat
  a la traject\u00f2ria professional desenvolupada, que donada la centralitat de l\u2019esfera
  professional, en alguns casos, \u00e9s tant com trobar significat a la traject\u00f2ria
  vital dels \u00faltims 40 anys.\\n\\nL\u2019aspecte m\u00e9s psicol\u00f2gic, jo
  crec que augmenta en general en una professi\u00f3 que ha estat, ha tingut molta
  dedicaci\u00f3 a la seva professi\u00f3, molt\u00edssima, que \u00e9s una professi\u00f3
  molt vocacional, molt vocacional. I quan de repent la persona ha de fer un alt,
  ha de fer una parada sobtada, tot aix\u00f2 t\u00e9 un impacte fort que realment
  li costa trobar o ocupar el temps psicol\u00f2gica i hor\u00e0riament en d\u2019altres
  coses que no sigui la seva professi\u00f3. Perqu\u00e8 si un analitza i mira les
  hores que ha dedicat, i els continguts d\u2019aquestes hores, es d\u00f3na compte
  que 30, 40 o 50 anys, un temps molt important, l\u2019ha dedicat a la seva professi\u00f3.
  Evidentment hi ha els aspectes familiars i l\u00fadics, per\u00f2 jo diria que percentualment
  molt menys que altres professions (ES1,2).\\n\\n- Prioritzar activitats significatives
  de la vida quotidiana que donen continu\u00eftat als valors, creences i actituds
  desenvolupats i mantinguts com a metges, dins dels espais i dimensions socials caracter\u00edstics
  de les persones grans.\\n\\n- Redefinir la seva identitat personal i social al marge
  de la seva identitat professional. Deixar anar la posici\u00f3 privilegiada en les
  relacions socials i professionals mantingudes fins ara. Aix\u00f2 \u00e9s molt dif\u00edcil
  per aquells que no disposen d\u2019expectatives de futur positives i que han viscut
  aquesta posici\u00f3 social privilegiada com a part de la seva identitat personal
  i social. Podrien exercir una posici\u00f3 no-executiva (consell assessor, etc.)
  o realitzar un treball voluntari, per\u00f2 aquestes opcions no v\u00e9nen, generalment,
  acompanyades del mateix grau de satisfacci\u00f3, ni s\u00f3n equivalents en la
  seva centralitat identit\u00e0ria.\\n\\nPer mi, el problema de la jubilaci\u00f3
  del metge no \u00e9s nom\u00e9s el sou, que aix\u00f2 \u00e9s relatiu, sin\u00f3
  \u00e9s tamb\u00e9 la situaci\u00f3 personal, que molts metges han viscut tota la
  seva vida per a la medicina i quan no fan de metges no saben qu\u00e8 fer. I aquest
  \u00e9s l\u2019error del metge. Per mi aquest \u00e9s el problema greu... que si
  el metge s\u2019ha dedicat a fer nom\u00e9s de metge, \u00e9s clar, quan es jubila,
  com qualsevol altra persona, nota un buit que no pot omplir-lo si no s\u2019ha preparat
  abans (GF1,5).\\n\\nCap\u00edtol 2\\nL\u2019experi\u00e8ncia de jubilar-se: impactes
  i afrontament\\n\\nLa jubilaci\u00f3, tradicionalment, s\u2019ha vist com una transici\u00f3
  abrupta des del treball remunerat fins al no treball remunerat, i el temps en qu\u00e8
  s\u2019assoleixen els requisits per rebre pensions i s\u2019entra en programes i/o
  activitats destinades a una poblaci\u00f3 espec\u00edfica, els jubilats. Ara b\u00e9,
  els estudis realitzats suggereixen que la transici\u00f3 a la jubilaci\u00f3 \u00e9s
  considerablement m\u00e9s complexa, que evoluciona a partir d\u2019una gran varietat
  de factors contextials i segueix diferents itineraris o direccions que es desenvolupen
  al llarg del temps.\\n\\nLa perspectiva del cicle vital considera que les diferents
  esferes vitals (p. e. treball, fam\u00edlia) estan entrela\u00e7ades (Elder i Johnson,
  2003), suggerint que l\u2019experi\u00e8ncia de la jubilaci\u00f3 no esdev\u00e9
  nom\u00e9s de les experi\u00e8ncies ocupacionals i laborals sin\u00f3 tamb\u00e9
  de les experi\u00e8ncies en altres dominis. Cadascun d\u2019aquests \u00e0mbits
  no nom\u00e9s influeix en l\u2019adaptaci\u00f3 a la jubilaci\u00f3 sin\u00f3 que
  est\u00e0 entrela\u00e7at amb els altres, configurant itineraris diversos altament
  individualitzats.\\n\\nEn aquest proc\u00e9s d\u2019adaptaci\u00f3, els \u00e0mbits
  m\u00e9s caracter\u00edstics d\u2019impacte de la jubilaci\u00f3 identificats en
  aquest estudi s\u00f3n:\\n\\n- La traject\u00f2ria vital i laboral.\\n- La posici\u00f3
  i la situaci\u00f3 familiar.\\n- La posici\u00f3 i les relacions socials.\\n- Les
  activitats i l\u2019\u00fas del temps.\\n- Els recursos econ\u00f2mics.\\n\\n2.1.
  La traject\u00f2ria vital i laboral\\n\\nL\u2019aplicaci\u00f3 de normes i programes
  basats exclusivament en l\u2019edat ens porta a una gran segmentaci\u00f3 i cronologitzaci\u00f3
  (divisions basades en l\u2019edat) de l\u2019\u00faltima part del cicle vital (Kohli,
  1986). \u00c9s aix\u00ed com les fases d\u2019exercici d\u2019una carrera professional
  i de la jubilaci\u00f3 esdevenen m\u00e9s diferenciades, la transici\u00f3 del treball
  a la jubilaci\u00f3 m\u00e9s abrupta, i es lliga el moment de la jubilaci\u00f3
  a l\u2019edat cronol\u00f2gica i no a la capacitat f\u00edsica i/o mental per fer
  front a la feina. D\u2019aquesta manera la jubilaci\u00f3 esdev\u00e9 una ruptura
  en la traject\u00f2ria vital i professional m\u00e9s que una transici\u00f3 a una
  etapa diferent del cicle vital.\\n\\nEn alguns pa\u00efsos europeus s\u2019han elaborat
  i implementat programes espec\u00edfics encaminats a desdibuxar aquest l\u00edmit
  cronol\u00f2gic, tals com els programes per motivar la jubilaci\u00f3 gradual a
  Su\u00e8cia i la jubilaci\u00f3 anticipada a Alemanya, entre d\u2019altres (Maltby,
  De Vroom, Mirabile, Overbye, 2004). Aquests programes tenen com a efectes principals
  que alteren les fronteres entre treball i jubilaci\u00f3 i s\u2019orienten cap a
  la reconstrucci\u00f3 social de lligams entre els diferents sistemes de benestar
  en el curs vital. La jubilaci\u00f3 esdev\u00e9 aix\u00ed m\u00e9s individualitzada,
  l\u2019associaci\u00f3 entre jubilaci\u00f3 i vellesa es trenca, i la relaci\u00f3
  entre els m\u00f3ns laboral, econ\u00f2mic, social i personal esdev\u00e9 m\u00e9s
  din\u00e0mica i flu\u00efda.\\n\\nEls elements caracter\u00edstics identificats
  en aquest estudi, com els que configuren aquesta experi\u00e8ncia, s\u00f3n els
  seg\u00fcents:\\n\\na) La dificultat d\u2019anticipar.\\n\\nb) La necessitat de
  redefinir els objectius vitals.\\n\\nc) La necessitat de tornar a dotar de significat
  el valor de la traject\u00f2ria professional.\\n\\nd) El trencament imposat.\\n\\na)
  La dificultat d\u2019anticipar\\n\\nUna jubilaci\u00f3 reeixida requereix d\u2019un
  proc\u00e9s continu d\u2019identificaci\u00f3 de desitjos i necessitats, del desenvolupament
  de plans de futur i de la seva revisi\u00f3 continuada. En l\u2019actualitat, tenint
  en compte que les persones vivim m\u00e9s i amb millor estat de salut, aquesta planificaci\u00f3
  entorn el temps que vivim despr\u00e9s de la jubilaci\u00f3 \u00e9s cada vegada
  m\u00e9s necess\u00e0ria.\\n\\nEntre la majoria dels professionals de la medicina,
  l\u2019anticipaci\u00f3 de les seves necessitats, desitjos i plans de futur m\u00e9s
  enll\u00e0 de la seva vida laboral \u00e9s inexistent.\\n\\n\u201cQue preparin la
  jubilaci\u00f3 alg\u00fa n\u2019hi haur\u00e0 per\u00f2 la majoria, al meu entendre
  no, aix\u00f2 es dif\u00edcil de saber perqu\u00e8 ja \u00e9s l\u2019actitud d\u2019ells
  abans d\u2019arribar a la jubilaci\u00f3, per\u00f2 que et comentin, noi jo m\u2019estic
  preparant perqu\u00e8 em trobar\u00e9 d\u2019aqu\u00ed 4 dies, a alg\u00fa li he
  sentit, per\u00f2 la majoria et diu, m\u2019he jubilat, macabo de jubilar, i jo
  els hi pregunto, \u201cI qu\u00e8 fas ara?\u201d \u201cHome surto de tant en tant\u201d\u2026
  I poca cosa m\u00e9s (ES2,83).\\n\\nCrec que encara no s\u00f3n ben conscients,
  si que ara com et deia al principi hi ha una sensaci\u00f3 de preocupaci\u00f3 per
  tot el que ha passat per\u00f2 encara col\u00b7lectivament encara o individualment,
  no s\u00f3n molt conscients, no ho s\u00f3n (ES1,3).\\n\\nAquesta manca d\u2019anticipaci\u00f3
  s\u2019atribueix, per una banda, a l\u2019acceleraci\u00f3 del ritme de vida que
  \u00e9s caracter\u00edstic durant l\u2019exercici de la professi\u00f3, i a la manca
  de\\n\\nsuport institucional per facilitar o promoure la realitzaci\u00f3 d\u2019aquest
  proc\u00e9s.\\n\\n\u201cAlgu diu... Allo de preparar-se per a jubilar-se. Jo em
  pregunto moltes vegades: treballes, surts de casa a les 8 h. del mat\u00ed i tornes
  a les 21 h. del vespre i l\u2019\u00fanic dia que et pots preparar \u00e9s el dissabte
  i el diumenge, i el dissabte i diumenge, no \u00e9s la vida d\u2019un jubilat. Dissabte
  i diumenge t\u2019en vas amb els n\u00e8ts, amb els fills, amb l\u2019altre i si
  tens una casa a fora te ni\u2019hi vas i sin\u00f3 us n\u2019aneu a menjar por ah\u00ed
  o... on vulguis. Per\u00f2 de dilluns a divendres et pots preparar? (GF1,24).\\n\\nI
  per l\u2019altra banda, la manca d\u2019anticipaci\u00f3 s\u2019atribueix a factors
  m\u00e9s psicol\u00f2gics i socials.\\n\\n\u201cJo crec que amb la gent que parlo,
  la gent el que pensa d\u2019entrada ..., moltes vegades no s\u00f3n ni conscients
  del que els hi passar\u00e0, no s\u2019imaginen com es trobaran quan es jubilaran,
  no s\u2019imaginen, \u00e9s a dir, jo crec que se n\u2019adonen quan hi s\u00f3n
  que, home, tots som animals de costums, no? (ES1,3).\\n\\n\u201cJo abans li he explicat
  l\u2019exemple d\u2019un metge que vaig anar a visitar jo, que estava associat a
  una m\u00fctua i pobre home, \u00e9s que el tinc aqu\u00ed dintre jo. Realment aquest
  home era pediatra, havia fet de metge, havia treballat tota la seva vida i s\u2019havia
  quedat a quatre veles. \u201cOh, \u00e9s que no va preveure el dia de dem\u00e0\u201d.
  Mira, aix\u00f2 \u00e9s molt relatiu i molt maco diu-ho per\u00f2 quan un est\u00e0
  exercint no preveu masses coses perqu\u00e8 no pot preveure-les. Perqu\u00e8 se
  li presenta... D\u2019entrada estem en una societat de consum que ens fa consumir
  coses i ens fa gastar coses. Segona, si est\u00e0s en una situaci\u00f3 social et
  mou en nivell d\u2019aquesta situaci\u00f3 social. No pots anar amb texans, que
  avui hi van els metges joves d\u2019ara. Per\u00f2 en la meva \u00e8poca no podies
  anar amb texans, ni sense corbata, ni, ni, ni amb sabatilles. Havies d\u2019anar
  ben vestit. Tot aix\u00f2 et condicionava una s\u00e8rie de situacions i d\u2019actituds
  (GF1,17).\\n\\nb) La necessitat de redefinir els objectius vitals\\n\\nPer una banda,
  el cessament de l\u2019activitat professional implica la p\u00e8rdua d\u2019un objectiu
  que donava sentit a moltes activitats de la vida quotidiana que, encara que es puguin
  continuar realitzant, modificaran la seva finalitat i els seus objectius, i la seva
  valoraci\u00f3.\\n\\n\u201cDespr\u00e9s de temps hauran d\u2019aprendre a ocupar
  el temps d\u2019una altre manera, normalment, el metge s\u2019ha dedicat molt a
  formar-se en la seva professi\u00f3, moltes hores de llegir i moltes hores d\u2019estudiar,
  moltes hores d\u2019actualitzar coneixements, amb una finalitat que \u00e9s millorar
  la salut. Quan aquesta finalitat desapareix segurament la gent continua formant-se,
  per\u00f2 ja no \u00e9s el mateix, hauran d\u2019aprendre a formar-se o a incorporar
  coneixements d\u2019altres coses, i aix\u00f2 tinc la intu\u00efci\u00f3 encara
  que no... no... no ho veuen (ES1,3).\\n\\nPer altre banda, se sent com a necess\u00e0ria
  la definici\u00f3 dels objectius vitals que es volen aconseguir despr\u00e9s de
  la jubilaci\u00f3 per evitar la buidor de passar la resta de la vida \u201csense
  fer res\u201d, posici\u00f3, aquesta segona, que s\u2019assimila a la mort simb\u00f2lica.\\n\\n\u201cI
  l\u2019altre problema, \u00e9s el problema de la situaci\u00f3 personal en la que
  queda el metge quan es jubila. Tinc l\u2019experi\u00e8ncia d\u2019una persona que
  el dia que es va jubilar, l\u2019endem\u00e0 va dir \u201cJo qu\u00e8 far\u00e9
  avui?\u201d Clar, si tu quan et jubiles dius \u201cI jo qu\u00e8 far\u00e9?\u201d,
  ja est\u00e0s llest, ja est\u00e0s llest (GF1,5).\\n\\nc) La necessitat de tornar
  a dotar de significat el valor de la pr\u00f2pia pr\u00e0ctica legitimada en un
  context professional passat\\n\\nExisteix una percepci\u00f3 que la seva compet\u00e8ncia,
  el seu rendiment i els seus \u00e8xits no s\u00f3n valorats ni per l\u2019organitzaci\u00f3
  ni pels treballadors m\u00e9s joves. Per una banda, l\u2019organitzaci\u00f3 no
  posa en marxa accions encaminades a facilitar/possibilitar el relleu generacional;
  per l\u2019altra, aquest relleu ha de v\u00e8ncer la dist\u00e0ncia generacional
  en sabers, valors i utilitzaci\u00f3 d\u2019eines per fer front a la mateixa feina.
  Aquesta situaci\u00f3 genera tensions perqu\u00e8 a all\u00f2 aconseguit i als coneixements
  adquirits en tota una vida professional ja no se li d\u00f3na valor.\\n\\nQuer\u00eda
  aportar un tema nuevo de la jubilaci\u00f3n, y es que, todos somos de la misma quinta.
  Sin querer hoy en d\u00eda se practica una medicina que cada vez me gusta menos.
  No es la medicina que a mi me ense\u00f1aron, no es la medicina para la cual yo
  me prepar\u00e9\u2026 y no es la medicina que yo puedo transmitir a mis j\u00f3venes
  residentes. Porque esos tios, entre Internet, y la vivencia, \u00bfpues saben m\u00e1s
  que yo, de la medicina actual? Pero no estoy desencantado, \u00bfeh? Me lo he pasado
  muy bien. Pero ya no es lo que era la medicina\u2026 (GF2,18).\\n\\n\u00c9s aix\u00ed
  com la persona que es jubila es veu obligada a tornar a dotar de significat i actualitzar
  el valor d\u2019all\u00f2 assolit professionalment i de la seva relaci\u00f3 amb
  la instituci\u00f3. \u00c9s general la refer\u00e8ncia als canvis percebuts en la
  pr\u00e0ctica professional avui validada per la instituci\u00f3: m\u00e9s tecnocr\u00e0tica,
  controlada per protocols, desestimant el judici cl\u00ednic i el pacient, desconsiderant
  les marques de respecte en la relaci\u00f3 amb els pacients i amb els residents
  (aparen\u00e7a, tracte de vost\u00e8,\u2026) i els canvis en el sistema sanitari.
  Tamb\u00e9 en el paper dels metges en les organitzacions (afirmen que els han \u201cfuncionaritzat\u201d)
  i en la p\u00e8rdua d\u2019estatus social.\\n\\nAl principio todos mis residentes
  se pasaban la noche mirando el monitor del enfermo y ahora se pasan la noche mirando
  el monitor del Google\u2026 (GF2,18).\\n\\nd) El trencament imposat\\n\\nExisteixen
  diferents investigacions entorn a la identificaci\u00f3 de factors que reduueixen/augmenten
  les dificultats en l\u2019adaptaci\u00f3 a la transici\u00f3 vital de la jubilaci\u00f3
  (Marshall, Clarke i Ballantyne, 2001; Szinovacz, 1989, entre d\u2019altres). Aquests
  estudis coincideixen en la identificaci\u00f3 de dos factors que resulten molt bons
  predictors de possibles dificultats en l\u2019adaptaci\u00f3 d\u2019aquesta transici\u00f3
  vital: el temps i la possibilitat d\u2019elecci\u00f3 (\u201ctime and choice\u201d).\\n\\nQuan
  una transici\u00f3 vital es d\u00f3na fora de temps (massa d\u2019hora o massa tard),
  \u00e9s a dir, quan contradiu el temps socialment marcat per a la seva ocurr\u00e8ncia
  o contradiu les expectatives individuals de la persona que la viu i/o quan la persona
  sent que no ha tingut cap control ni possibilitat d\u2019elecci\u00f3 sobre si iniciar
  o no determinada transici\u00f3, les possibilitats d\u2019aparici\u00f3 de dificultats
  a l\u2019hora d\u2019adaptar-se a la nova situaci\u00f3 augmenten considerablement
  mani-festant-se habitualment en una viv\u00e8ncia de ruptura del cicle vital i de
  p\u00e8rdua de control sobre el propi projecte vital des d\u2019un per\u00edode
  previ a la jubilaci\u00f3 i fins algun temps despr\u00e9s (Heckhausen i Schulz,
  1995).\\n\\n- La violentaci\u00f3 de les expectatives\\n\\nAmb la recent aplicaci\u00f3
  de l\u2019Estatut Marc s\u2019ha imposat entre els professionals de la medicina
  la jubilaci\u00f3 for\u00e7osa als 65 anys. L\u2019impacte d\u2019aquesta norma
  \u00e9s determinant ja que redueix en 5 anys el l\u00edmit de la carrera professional,
  violentant les expectatives de tots aquells professionals amb edats pr\u00f2ximes
  a la citada.\\n\\nJo coneix caps de secci\u00f3 que han rebut una carta el 23 de
  novembre de que el dia 30 es jubila perqu\u00e8 havia complert els 65 anys (GF1,13).\\n\\n-
  L\u2019obligatorietat inesperada\\n\\nAquesta obligatorietat sobtada de la jubilaci\u00f3
  anul\u00b7la la possibilitat d\u2019elecci\u00f3 de molts professionals i marca
  un abans i un despr\u00e9s en el desenvolupament de la tasca professional, l\u2019ambient
  de treball i les relacions interpersonals.\\n\\nI ara ja \u00e9s obligatori\u2026
  Bueno, ens ho faran a tots (GF2,9).\\n\\nHi ha un tema que m\u2019agrada riar tocar,
  que \u00e9s el de la jubilaci\u00f3 obligat\u00f2ria, per exemple, qu\u00e8 ha passat
  en els hospitals, que aix\u00f2 ha creat un ambient molt desagradable en la gent
  que ha marxat recentment i molt mala lletr entre nosaltres perqu\u00e8 veus una
  obligaci\u00f3 (GF2,1).\\n\\nAquesta situaci\u00f3 imposada genera una ruptura que
  complica molt la viv\u00e8ncia de la jubilaci\u00f3 i potencia la viv\u00e8ncia
  de la jubilaci\u00f3 com un esdeveniment no desitjat que arriba abans de temps,
  que \u00e9s injust i respon \u00fanicament a necessitats de l\u2019organitzaci\u00f3.
  La jubilaci\u00f3 deixa de ser vista com un dret del treballador per ser una obligaci\u00f3
  imposada per l\u2019organitzaci\u00f3.\\n\\nPrimer problema, que un arriba i un
  bon dia a les 9 del demat\u00ed ja no ha de fer, com a tota professi\u00f3 evidentment,
  per\u00f2 en el cas dels facultatius all\u00f2 que ha fet durant 40-50 anys i en
  un aspecte vocacional, \u00a1que aix\u00f2 \u00e9s molt heavy! (ES1,2).\\n\\nDespr\u00e9s
  de tants anys d\u2019estar en una s\u00e8rie de maneres de fer les coses, de repent
  vulguis o no t\u2019afecta (ES1,3).\\n\\nEvidentment jo s\u00e9 que hi ha moltes
  coses a fer despr\u00e9s i penso fer-ho per\u00f2 no m\u2019ha fet gr\u00e0cia que
  em posessin el l\u00edmit, no? (GF2,4).\\n\\n2.2. La posici\u00f3 i la situaci\u00f3
  familiar\\n\\nEn aquest estudi resulten rellevants les poques refer\u00e8ncies que
  trobem entorn al context familiar. En l\u2019an\u00e0lisi qualitatiu de dades textuals
  resulta tan indicatiu el que apareix en el text com el que no apareix. El que apareix
  pren consideraci\u00f3, per exemple, per la seva concurr\u00e8ncia, per la significaci\u00f3
  que posseeix, etc., segons els objectius de la investigaci\u00f3. De la mateixa
  forma, les abs\u00e8ncies poden tenir certa rellev\u00e0ncia. En ocasions esperem
  trobar quelcom que no apareix, aix\u00f2 pot prendre significat donat que pot ser
  una elusi\u00f3 volunt\u00e0ria d\u2019opinions, desconeixement d\u2019un tema,
  etc.\\n\\nA m\u00e9s, hem de tenir en compte que la noci\u00f3 d\u2019interdepend\u00e8ncia
  de les diferents esferes de la vida senyala la import\u00e0ncia dels contextos de
  no-treball en la jubilaci\u00f3, que aquests contextos proveeixen a les persones
  amb identitats sortints alternatives despr\u00e9s de la sortida del m\u00f3n laboral,
  i li ofereixen oportunitats de vinculaci\u00f3 futures. I considerant tamb\u00e9
  que per moltes persones les relacions de parella i familiars constitueixen l\u2019esfera
  m\u00e9s important, com queda confirmat en els resultats de les investigacions que
  mostren la import\u00e0ncia d\u2019aquest context en el benestar de les persones
  jubilades (Atcheley, 1992; Freedman, 1999; Szinovacz, 2002).\\n\\nA la vista dels
  resultats, podem afirmar que els principals impactes que hem identificat en aquest
  \u00e0mbit s\u00f3n els seg\u00fcents:\\n\\na) La redefinici\u00f3 dels rols de
  g\u00e8nere i les relacions de parella.\\nb) El reajustament de les relacions intergeneracionals.\\nc)
  Les difer\u00e8ncies en les possibilitats d\u2019adaptaci\u00f3 marcades pel g\u00e8nere.\\n\\nSabem
  que quan es produeix una identificaci\u00f3 entre treball i productivitat i, impl\u00edcitament,
  amb estatus social i reconeixement social, es produeix una devaluaci\u00f3 de la
  import\u00e0ncia de l\u2019entorn familiar i les seves relacions (Freedman, 1999).
  D\u2019aquesta forma es configuren unes rutines familiars molt marcades pel ritme
  laboral, que entren en q\u00fcesti\u00f3 en el moment de la jubilaci\u00f3. La jubilaci\u00f3
  es converteix, doncs, i en el cas dels mertges de manera particular, en un element
  important en el desenvolupament del cicle vital familiar generant la necessitat
  de redefinir les posicions i les relacions en un entorn familiar que sovint ha esdevingut
  lluny\u00e0.\\n\\na) La redefinici\u00f3 dels rols de g\u00e8nere i les relacions
  de parella\\n\\nLa jubilaci\u00f3 t\u00e9 un impacte important en els rols de g\u00e8nere
  i les relacions de parella. Per una banda, malgrat que en l\u2019actualitat moltes
  dones treballen, els homes s\u00f3n encara considerats com els responsables de la
  major part dels ingressos familiars. Aquesta imatge fomenta patrons de jubilaci\u00f3
  en els que la dona o b\u00e9 es jubila abans, o b\u00e9 simult\u00e0niament al marit,
  encara que aix\u00f2 impliqui reduir els anys de cotitzaci\u00f3 i per tant la seva
  pensi\u00f3. Aquest dilema \u00e9s m\u00e9s pronunciat quan la difer\u00e8ncia d\u2019edat
  entre la parella \u00e9s gran o les perspectives laborals de la dona s\u00f3n bones,
  cosa no poc com\u00fa quan es redueixen les responsabilitats envers els fills que
  ja s\u2019han fet grans.\\n\\nLes parelles que no s\u2019ajusten als mandats socioculturals,
  seguint els patrons de jubilaci\u00f3 abans esmentats, tendeixen a patir una sacsejada
  en les seves relacions. La investigaci\u00f3 al respecte (Szinovacz, 2002) coincideix
  en assenyalar dos aspectes especialment conflictius: el fet que el rol\\n\\nde l\u2019home
  com a sustentador de la fam\u00edlia es veu amena\u00e7at i els conflictes generats
  per la participaci\u00f3 de l\u2019home en les tasques dom\u00e8stiques quan la
  dona continua treballant.\\n\\nPer altre banda, en el cas de les dones que no han
  realitzat un treball remunerat i per tant no s\u2019han integrat mai al mercat laboral,
  la jubilaci\u00f3 de les seves parelles implica la necessitat de compartir un espai,
  un temps i una esfera de decisions i, per tant, de poder, en l\u2019entorn familiar
  que fins ara li havien pertangut de forma exclusiva.\\n\\nEn ambd\u00f3s casos l\u2019avaluaci\u00f3,
  les expectatives i l\u2019adaptaci\u00f3 de la parella en relaci\u00f3 a la jubilaci\u00f3
  de l\u2019altre, aix\u00ed com el compartir tant d\u2019activitats de plaer com
  de presa de decisions, s\u00f3n de gran import\u00e0ncia en la satisfacci\u00f3
  vital en aquesta etapa (Szinovacz, 2002).\\n\\nUn cas particular en qu\u00e8 l\u2019home
  merge vol fer de la jubilaci\u00f3 l\u2019oportunitat de tornar a la vida de la
  parella i aquesta \u00e9s dibuixada com l\u2019assignatura pendent o l\u2019idealitzat
  parad\u00eds perdut.\\n\\nb) El reajustament de les relacions intergeneracionals\\n\\nLa
  jubilaci\u00f3 tamb\u00e9 pot ressaltar la import\u00e0ncia de les relacions familiars.
  Molts jubilats s\u2019impliquen molt en l\u2019atenci\u00f3 dels nets, recuperen
  relacions que havien desat\u00e8s durant temps amb fills, germans o fins i tot parets.
  Ara b\u00e9, aquesta import\u00e0ncia recobrada de les relacions intergeneracionals
  a la fam\u00edlia, en alguns casos no \u00e9s tan positiva. En l\u2019actualitat,
  el nucli familiar d\u2019una persona de 65 anys no \u00e9s estrany que es vegi marcat
  per relacions de depend\u00e8ncia intergeneracional. \u00c9s a dir, perqu\u00e8
  hi ha al nucli familiar fills que encara no disposen d\u2019una situaci\u00f3 psico-socioecon\u00f2mica
  independent i/o pares grans en situaci\u00f3 de depend\u00e8ncia que necessiten
  atenci\u00f3 i/o ajuda.\\n\\n\u201cPer\u00f2 cuidado, no s\u00e9 vosaltres els fills
  que teniu, per\u00f2 n\u2019hi ha que tenen cases que es t\u00e9 que ajudar. Jo
  encara tinc fills que els tinc que ajudar o perqu\u00e8 vull. Llavors...\u201d (GF2,7).\\n\\nEn
  aquests casos podem dir que la generaci\u00f3 de jubilats recents, en el nostre
  pa\u00eds, s\u00f3n pioners afrontant situacions familiars absolutament noves en
  el nostre context (per la intensitat de les c\u00e0rregues que encara poden tenir).
  \u00c9s cert, que a nivell internacional, RU, EUA, Fran\u00e7a, aquesta situaci\u00f3
  va manifestar-se als anys 80 (Held, 1982), per\u00f2, el relativament nou desenvolupament
  a Espanya de l\u2019Estat del benestar fa que aquests processos apareguin, amb tota
  la seva for\u00e7a, actualment.\\n\\nc) Les difer\u00e8ncies en les possibilitats
  d\u2019adaptaci\u00f3 marcades pel g\u00e8nere\\n\\nLes investigacions al respecte
  ens mostren que davant d\u2019una situaci\u00f3 familiar d\u2019increment de la
  demanda d\u2019atenci\u00f3 i cura d\u2019algun membre familiar (fills, pares o
  parella) es posen de manifest, una vegada m\u00e9s, les difer\u00e8ncies de g\u00e8nere
  entorn al significat del treball i de la jubilaci\u00f3. En aquestes situacions
  els homes tendeixen, si els \u00e9s possible, a retardar la seva jubilaci\u00f3
  com a forma per fer front a la situaci\u00f3 de demanda familiar, mentre que la
  dona tendeix a anticipar la seva jubilaci\u00f3 per assumir la responsabilitat d\u2019atenci\u00f3
  i cura dels membres del nucli familiar que ho necessiten (Szinovacz, De Viney i
  Davey, 2001).\\n\\nPer\u00f2 a m\u00e9s, es coneixen efectes de g\u00e8nere que
  van m\u00e9s enll\u00e0 dels mencionats fins ara. Els esdeveniments vitals influencien
  m\u00e9s en l\u2019esfera laboral de les dones. Habitualment s\u00f3n les dones
  les que renuncienc a la seva progressi\u00f3 professional per poder fer front als
  esdeveniments vitals que succeixen en altres esferes, familiar (cura dels membres
  de la fam\u00edlia que ho necessiten), social (atenci\u00f3 a xarxa de relacions),
  etc. Aquest impacte diferencial dels esdeveniments vitals continua durant l\u2019adaptaci\u00f3
  a la jubilaci\u00f3, significant que les dones tenen m\u00e9s risc de coincid\u00e8ncia
  de m\u00faltiples esdeveniments vitals, amb l\u2019impacte negatiu que aix\u00f2
  implica per a la seva salut i qualitat de vida.\\n\\nPer altra banda, la major implicaci\u00f3
  de la dona, durant la seva maduresa, en l\u2019establiment i manteniment de relacions
  altament significatives i gratificantcs actua com a protector de l\u2019estr\u00e8s
  i el patiment associats a la jubilaci\u00f3. De fet, al nostre pa\u00eds, les dones
  dels metges sovint han jugat aquest paper important de mantenir la xarxa social
  de la fam\u00edlia, tasca que despr\u00e9s, en l\u2019etapa de la jubilaci\u00f3,
  es torna molt important.\\n\\n2.3. La posici\u00f3 i les relacions socials\\n\\nEls
  principals impactes identificats en aquest \u00e0mbit s\u00f3n els seg\u00fcents:\\n\\na)
  La p\u00e8rdua del lloc ocupat a la societat i als grups.\\n\\nb) La modificaci\u00f3
  de les relacions.\\n\\nc) La necessitat de gestionar la incertesa i l\u2019ambival\u00e8ncia.\\n\\nL\u2019exercici
  d\u2019una professi\u00f3 fixa la posici\u00f3 de la persona en l\u2019estructura
  social i les relacions que estableix amb els altres, \u00e9s a dir: constitueix
  una part de la seva identitat.\\n\\na) La p\u00e8rdua del lloc ocupat a la societat
  i als grups\\n\\nLes transicions que impliquen l\u2019aband\u00f3 d\u2019un rol
  considerat sortint i perdurable, s\u00f3n considerades de major impacte i m\u00e9s
  negatives si existeix una manca de socialitzaci\u00f3 anticipant i si no estan disponibles
  altres rols sortints. Pel contrari, aquelles transicions que redueixen el conflicte
  entre rols i impliquen desenvolupar rols que s\u00f3n sortints o intensifiquen objectius
  desitjats, s\u00f3n perceptibles de tenir un impacte positiu en la satisfacci\u00f3
  vital de la persona (Burr, 1973).\\n\\nEntre els professionals de la medicina podem
  afirmar que, en general, no existeixen altres rols sortints disponibles.\\n\\n\u201cEl
  que shagi devaluat, importa o no importa, per\u00f2 al menos saps qu\u00e8 fas,
  que ets algo en concret. Quan et jubiles jo penso que ets...\u201d (GF2,8).\\n\\nEntre
  les dificultats per poder substituir aquest rol ens trobem que el rol de metge porta
  un estatus social associat que \u00e9s molt dif\u00edcil d\u2019aconseguir amb els
  rols disponibles despr\u00e9s de la jubilaci\u00f3.\\n\\n\u201c\u00c9s un tipus
  de professi\u00f3 que quan la deixa perd l\u2019estatus que tenia social en 24 hores.
  \u00c9s a dir, la gent s\u2019oblida pr\u00e0cticament d\u2019aquella persona, una
  persona que per la seva feina havia tingut un reconeixement o un prestigi i, moltes
  vegades en la interacci\u00f3 di\u00e0ria feia que estiguis reconegut, o fa que
  estigui reconegut per la gent. En el moment que deixa de fer aix\u00f2, desapareix
  del mapa com es diu vulgarment (ES1,2).\u201d\\n\\n\u201cI parl\u00e0vem d\u2019aix\u00f2,
  de l\u2019economia i la part social. Que tamb\u00e9 volia comentar. En el cas que
  tu dis, bueno, tu deixes de ser metge i per tant, socialment, est\u00e0s vist d\u2019una
  altra manera, no? I econ\u00f2micament, pues baixes. I hi ha altres coses, a mi
  migra da molt viatjar, per exemple, \u00e9s el meu gran hobby, i a mi ara em conviden.
  El dia que em jubilita a mi em deixaran de convidar. Els viatges, no solament tindr\u00e9
  menys diners sin\u00f3 que mels tindr\u00e9 que pagar. I ara en canvi... O sigui
  que realment si tu et dediques nom\u00e9s a aix\u00f2, el canvi econ\u00f2mic \u00e9s
  bastant important. Tant en n\u00famero com en possibilitats de reconeixement, que
  vol dir aix\u00f2, que et conviden XXX... (GF2,11).\u201d\\n\\nb) La modificaci\u00f3
  de les relacions\\n\\nEl canvi d\u2019estatus que es produeix com a conseq\u00fc\u00e8ncia
  de la jubilaci\u00f3 porta associat un canvi en la xarxa de relacions,\\n\\namb
  l\u2019aband\u00f3 progressiu de les relacions procedents de l\u2019\u00e0mbit professional.\\n\\nUn
  dels impactes m\u00e9s grans de la jubilaci\u00f3 dels metges es produeix precisament
  en relaci\u00f3 a la composici\u00f3 de la xarxa de relacions. Els companys de la
  feina que es deixa s\u00f3n reempla\u00e7ats, habitualment, per altres persones
  que, generalment, tamb\u00e9 estan fora del m\u00f3n laboral. Aquestes noves relacions
  podrien facilitar l\u2019adaptaci\u00f3 a la jubilaci\u00f3 i l\u2019entrada en
  una altra etapa vital ja que, aquesta nova configuraci\u00f3 de la xarxa de relacions
  marcar\u00e0 en gran manera l\u2019establiment de patrons d\u2019activitat de la
  vida quotidiana.\\n\\nPer\u00f2 quan l\u2019\u00e0mbit laboral ha concentrat la
  majoria de les interaccions socials, com \u00e9s habitual en el cas d\u2019alguns
  metges, resulta molt complicat trobar suport social en el moment de la jubilaci\u00f3.
  La import\u00e0ncia de les relacions interpersonals favorables dins de l\u2019esfera
  laboral (per tenir en elles m\u00e9s estatus o per ser satisfactori\u00e9s personalment)
  fa que metges en actiu retardin la seva jubilaci\u00f3 i anticipin la seva transici\u00f3
  com a lesiva, donat que mantenir aquestes relacions despr\u00e9s de la jubilaci\u00f3
  resulta molt dif\u00edcil.\\n\\nc) La necessitat de gestionar la incertesa i l\u2019ambival\u00e8ncia\\n\\nEls
  professionals de la medicina, actualment, experimenten una pressi\u00f3 social ambigua
  i ambivalent envers el significat de la jubilaci\u00f3 en el discurs professional,
  econ\u00f2mic o social.\\n\\nPer una banda, senten la pressi\u00f3 social derivada,
  en gran part, de les expectatives que els treballadors m\u00e9s grans han de deixar
  el m\u00f3n laboral per fer lloc als treballadors m\u00e9s joves, \u201cbien preparados\u201d,
  refor\u00e7ada pel poc reconeixement de les institucions cap als seus coneixements
  acumulats durant els anys de pr\u00e0ctica professional. Els programes dirigits
  a les persones jubilades impliquen, de forma impl\u00edcita o expl\u00edcita, que
  els treballadors grans haurien de deixar el m\u00f3n laboral o, al menys, reduir
  dr\u00e0sticament el seu horari laboral, i aix\u00f2 ha de fer-se a partir d\u2019una
  edat especificada.\\n\\nPer altra banda, a nivell social continua mantenint-se la
  idea que la jubilaci\u00f3 \u00e9s una sortida quan ja no s\u2019\u00e9s capa\u00e7
  de treballar, i resulta impensable en alg\u00fa amb plenes capacitats.\\n\\nA m\u00e9s
  experimenten l\u2019ambival\u00e8ncia entorn a la necessitat o no de retardar la
  jubilaci\u00f3 donat que segons els experts la feblesa de l\u2019estat del benestar
  fa que entri en crisi al fer-se c\u00e0rrec de les despeses generades pel creixement
  del col\u00b7lectiu de jubilats i gent gran dependent.\\n\\nI molts sostenen l\u2019argument
  que en diferents pa\u00efsos europeus, inclos Espanya, existeixen mesures encaminades
  a mantenir les persones de 65 anys en amunt dins del mercat laboral.\\n\\nAquestes
  contraccions poden portar a actituds ambivalentes sobre la pertin\u00e8ncia o no
  de la continu\u00eftat dels treballadors grans en el m\u00f3n laboral. Aquesta situaci\u00f3
  ha estat assenyalada per estudis als Pa\u00efsos Baixos, Gran Bretanya i EUA, entre
  d\u2019altres (Van Dalen i Henkens, 2002; Taylor, 2004). Aix\u00ed doncs, els treballadors
  grans estan sota pressi\u00f3 social per jubilar-se, per\u00f2 aquesta pressi\u00f3
  \u00e9s sovint ambivalent o contingent amb el mercat laboral i altres condicions
  socials.\\n\\n2.4. Les activitats i l\u2019\u00fas del temps\\n\\nEn general, sabem
  que els treballadors en edat pr\u00f2xima a la jubilaci\u00f3, habitualment, tenen
  moltes expectatives en relaci\u00f3 a les activitats que realitzaran quan es jubilin,
  tenen molts plans per aquesta etapa, per\u00f2 la majoria no arriba mai a realitzar-los.
  Quan es construeixen aquests plans poques vegades es preveu que l\u2019impacte m\u00e9s
  gran de la jubilaci\u00f3 es produeix en relaci\u00f3 a la composici\u00f3 de la
  xarxa de relacions, m\u00e9s que en les activitats socials. El tipus d\u2019activitats
  socials o de plaer que acaben per fer-se possibles dep\u00e8n, en gran part, de
  les noves relacions interpersonals que es generen en aquesta etapa, de les relacions
  de parella i dels altres contextos rellevants com l\u2019econ\u00f2mic, la salut,
  etc. I aix\u00f2 tamb\u00e9 en el cas dels metges.\\n\\nA m\u00e9s, \u00e9s important
  l\u2019oferta d\u2019activitats per a persones jubilades en el seu entorn, la riquesa
  de la vida associativa o les infraestructures locals.\\n\\n\u201cEls que mantenen
  un mica de privada, els que tenen una afici\u00f3, els que s\u2019ho passen b\u00e9,
  els que busquen coses per fer com el Dr. X que col\u00b7labora amb la Creu Roja
  (ES2,2).\\n\\nL\u2019impacte de la jubilaci\u00f3 en l\u2019\u00e0mbit de l\u2019activitat
  i l\u2019\u00fas del temps \u00e9s desigual en funci\u00f3 del g\u00e8nere, tal
  com tamb\u00e9 es mostra en altres investigacions (Sz\u00ednovac, 1996). Les metgesses
  jubilades desenvolupen activitats principalment en l\u2019esfera familiar, realitzant
  funcions de suport als fills, de cura dels nets, de les persones grans i/o malalts
  de la fam\u00edlia, o fent front a funcions dom\u00e8stiques de compra, de neteja
  de la llar, d\u2019alimentaci\u00f3, de gestions, de manteniment de les relacions
  socials, etc. Els metges jubilats homes, en canvi, centren les seves activitats,
  principalment, en l\u2019esfera l\u00fadico-social (golf, concerts, etc.) tenint
  aix\u00ed els homes una major dificultat perqu\u00e8 aquestes activitats siguin
  significatives en relaci\u00f3 al seu projecte vital.\\n\\n2.5. Els recursos econ\u00f2mics\\n\\na)
  La certesa d\u2019una davallada dels ingressos\\n\\nLa certesa que es tindran suficients
  ingressos \u00e9s un factor molt important en l\u2019adaptaci\u00f3 a la jubilaci\u00f3
  i est\u00e0 inversament relacionada amb l\u2019edat de jubilaci\u00f3. En aquest
  sentit, la planificaci\u00f3 econ\u00f2mica (estalvis, plans de pensions privats,
  etc.) \u00e9s un factor molt rellevant. Una bona planificaci\u00f3 financera influeix
  en el temps, generalment anticipant la jubilaci\u00f3, i en la possibilitat d\u2019elecci\u00f3,
  (fins i tot fent que la jubilaci\u00f3 es produeixi per decisi\u00f3 pr\u00f2pia,
  com apunten Taylor i Doverspike, 2003).\\n\\nEn l\u2019actualitat, entre els professionals
  de la medicina ens trobem amb una situaci\u00f3 que \u00e9s similar a la d\u2019altres
  treballadors amb salaris en la franja alta de les retribucions i sense contacte
  quotidi\u00e0 amb organitzacions financeres i/o amb poc inter\u00e8s i/o coneixements
  d\u2019economia. Aquests professionals, en el moment de la jubilaci\u00f3, pateixen
  una dr\u00e0stica reducci\u00f3 dels ingressos principals, aproximadament en un
  50%, la qual cosa els impedeix mantenir l\u2019est\u00e0ndard de vida al que estan
  habituats.\\n\\n\u201c...perqu\u00e8 se suposa que aquest pla de pensions ens l\u2019estem
  pagant des de fa 35 anys. Perqu\u00e8 ens hav\u00edem de... Evidentment que... Per\u00f2
  per qu\u00e8 ens l\u2019hav\u00edem de fer, si a Pap\u00e1 Estado le hemos estado
  cotizando las autopistas (referint-se a les cotitzacions a la Seguretat Social)
  desde hace 40 a\u00f1os los que estamos aqu\u00ed? (GF2,28).\u201d\\n\\nAquesta
  situaci\u00f3 no \u00e9s exclusiva del nostre pa\u00eds, en la majoria dels pa\u00efsos
  europeus el m\u00e0xim legal de la prestaci\u00f3 de jubilaci\u00f3 no arriba en
  alguns casos a la meitat del salari dels treballadors de les franges altes. Per\u00f2
  en el nostre pa\u00eds es d\u00f3na la particularitat que els plans de pensions
  de l\u2019estat que, inicialment, es van dissenyar per completar els estalvis personals
  i/o assegurar uns ingressos b\u00e0sics/m\u00ednims despr\u00e9s de la jubilaci\u00f3
  pels treballadors m\u00e9s desafavorits (aquells que degut als baixos salaris i/o
  a una vida laboral curta no havien tingut la possibilitat d\u2019estalviar), s\u2019han
  convertit en la font d\u2019ingressos principals despr\u00e9s de la jubilaci\u00f3
  (Suso, 2004). En comparaci\u00f3 amb altres pa\u00efsos europeus (p.e. Gran Bretanya)
  el rati de plans de pensions privats o de fons d\u2019estalvis per a la jubilaci\u00f3
  \u00e9s encara minoritarit a Espa-nya; molts treballadors encara depenen totalment
  de les pensions estatals com a font d\u2019ingressos despr\u00e9s de la jubilaci\u00f3.\\n\\n\u201cEn
  el moment en que te jubiles, tus ingresos bajan como m\u00ednimo, como m\u00ednimo...
  de ganar 800 a 320 brutas, de hoy a ma\u00f1ana (GF2,5).\u201d\\n\\nb) La sobredimensi\u00f3
  de la p\u00e8rdua econ\u00f2mica\\n\\nMalgrat no haver pres mesures pr\u00e8vies
  (estalvis, plans de pensions, etc.) veiem com una part d\u2019aquest col\u00b7lectiu
  sobredimensiona la p\u00e8rdua econ\u00f2mica i aix\u00f2 no els hi permet parlar/pensar/preveure
  altres aspectes que tamb\u00e9 es modificaran i que s\u00ed poden ser objecte d\u2019atenci\u00f3
  i millora.\\n\\n\u201cJo crec que el que m\u00e9s detecten d\u2019entrada, perqu\u00e8
  aix\u00f2 \u00e9s molt racional, \u00e9s l\u2019aspecte econ\u00f2mic. Aquest s\u00ed
  que el veuen, deixa de guanyar-ne 300. Potser \u00e9s l\u2019aspecte que m\u00e9s
  els hi preocupa d\u2019entrada, per\u00f2 jo diria que el m\u00e9s complicat els
  hi ve despr\u00e9s que \u00e9s aix\u00f2 \u00e9s el subjectiu no ho podran modificar
  ni que tinguin altres sortides en quant a ingressos, cosa dif\u00edcil!, lo futut,
  el complicat del cas \u00e9s que di\u00e0riament es troben, com em deia un, amb
  els bra\u00e7os plegats, es troben amb els bra\u00e7os plegats. \u00c9s a dir, psicologicament
  no han incorporat aquesta nova situaci\u00f3 (ES1,3).\\n\\n\u201cLa privada se\u2019n
  va en orris i llavors tu et quedes amb les 300.000 pessetes brutes de la pensi\u00f3
  i tens que mantenir un petit... Un patrimoni, pues amb 3 o 4 pisos, anem a suposar,
  anem a suposar, perqu\u00e8 tots XXX no estem amb aix\u00f2, per\u00f2 \u00e9s un
  canvi radical. Per\u00f2 no un canvi d\u2019omplir hores, un canvi per veure com
  et solucions la vida teva i els que encara d\u2019alguna forma, ni que sigui psicologicament,
  depenen de tu\u2026 (GF2,7).\\n\\n\u201cAqu\u00ed el problema que ha sortit \u00e9s
  dels diners, com pot ajudar la Fundaci\u00f3 Galatea o el Col\u00b7legi de Metges
  a solucionar aquest problema, per exemple, no? T\u00e9 alguna soluci\u00f3 o parl\u00e9m,
  parl\u00e9m i no, no fem res (GF2,16).\\n\\n\u201cNo, no, si no espero res\u2026
  Jo lo que et dic \u00e9s que si t\u2019han d\u2019ajudar i resulta que el problema
  m\u00e9s important (es refereix a la q\u00fcesti\u00f3 econ\u00f2mica) per lo que
  hem dit aqu\u00ed, \u00e9s aix\u00f2 [riu], i amb aix\u00f2 no t\u2019ajuden\u2026
  Pos llavors t\u2019ajuden amb lo que \u00e9s secundari, per\u00f2 no amb lo que
  \u00e9s m\u00e9s important, per lo que jo he sentit per aqu\u00ed, no? (GF2,22).\\n\\nSi
  es compara la situaci\u00f3 econ\u00f2mica actual amb situacions experimentades
  pel col\u00b7lectiu en el passat, podem afirmar que el nivell econ\u00f2mic despr\u00e9s
  de la jubilaci\u00f3 no configura una situaci\u00f3 de necessitat entre aquest col\u00b7lectiu.\\n\\n\u201cAra
  no \u00e9s com abans fa 30 anys, llavors s\u00ed que n\u2019hi havia molts que no
  van entrar al segur\u00f3 i tampoc tenien estalvis (ES2,45).\\n\\n\u00c9s a dir,
  metges amb necessitats (econ\u00f2miques), dels que hi ha ara, parlar d\u2019un
  1%, ja \u00e9s molt (...) Necessitats de veritat, m\u00ednim i que passin gana,
  cap ( ES2,60).\\n\\nCom a conclusi\u00f3 podem dir que aquest no \u00e9s el problema,
  el nivell econ\u00f2mic. Tenint en compte els n\u00fameros s\u00f3n casos molt anormals,
  han de ser fora de circuit, s\u00f3n molt pocs (ES2,76).\\n\\nCap\u00edtol 3\\n\\nEl
  paper de les organitzacions sanit\u00e0ries en la definici\u00f3 actual de la jubilaci\u00f3\\n\\nEn
  aquest cap\u00edtol perfilarem els principals esquemes sobre els que es construeixen
  les accions de les organitzacions sanit\u00e0ries entorn a la jubilaci\u00f3. Aquests
  esquemes configuren les representacions socials de la jubilaci\u00f3 en l\u2019actual
  context professional.\\n\\nDenise Jodelet (1984) defineix les representacions socials
  com a:\\n\\n\u201cIm\u00e1genes que condensan un conjunto de significados y sistemas
  de referencia que permiten interpretar lo que nos sucede, e incluso, dar un sentido
  a lo inesperado; categor\u00edas que sirven para clasificar las circunstancias,
  los fen\u00f3menos y a los individuos con quienes tenemos algo que ver; teor\u00edas
  que permiten establecer hechos sobre ellos. Y, a menudo, cuando se les comprende
  dentro de la realidad concreta de nuestra vida social, las representaciones sociales
  son todo ello junto.\u201d\\n\\nI l\u2019esquema figuratiu de les representacions
  socials \u00e9s el conjunt d\u2019imatges que substitueixen els continguts conceptuals
  abstractes i m\u00e9s complexos per formes figuratives i ic\u00f2niques que s\u00f3n
  m\u00e9s accessibles al pensament concret.\\n\\n\u00c9s per aix\u00f2 que el concepte
  de representaci\u00f3 social \u00e9s complex de precisar ja que es refereix, globalment,
  a la manera en qu\u00e8 s\u2019apren i pensa sobre la vida quotidiana. En aquest
  sentit, les representacions socials s\u00f3n una forma de coneixement social, de
  sentit com\u00fa i pr\u00e0ctic, que al mateix temps que \u00e9s socialment elaborat
  i compartit, participa en la construcci\u00f3 de la realitat. O sigui que, en aquest
  sentit, considerem la jubilaci\u00f3 conjuntament com a: producte i proc\u00e9s
  d\u2019una elaboraci\u00f3 psicol\u00f2gica i social d\u2019all\u00f2 real (Jodelet,
  1984).\\n\\nEn aquest cap\u00edtol tamb\u00e9 mostrem com la transici\u00f3 de la
  jubilaci\u00f3 constitueix un proc\u00e9s din\u00e0mic i complex que est\u00e0 entrela\u00e7at
  amb les estructures socials i organitzacionals, i lligat a les experi\u00e8ncies
  constru\u00efdes personal i col\u00b7lectivament passades i presents.\\n\\n3.1.
  Idees compartides que sostenen i legitimen les accions a curt i llarg termini\\n\\nS\u2019han
  identificat quatre esquemes o idees principals compartides pels professionals que
  configuren formes determinades de representar el paper de les organitzacions sanit\u00e0ries
  en la definici\u00f3 de la jubilaci\u00f3.\\n\\na) La jubilaci\u00f3 \u00e9s un
  tema personal, no de l\u2019organitzaci\u00f3.\\nb) Els professionals de la medicina
  sempre tenen una bona sortida.\\nc) L\u2019organitzaci\u00f3 est\u00e0 interessada,
  priorit\u00e0riament, en el compliment dels objectius econ\u00f2mics m\u00e9s que
  en les persones.\\nd) En la pr\u00e0ctica professional actual, l\u2019experi\u00e8ncia
  resulta, nom\u00e9s, un valor relatiu.\\n\\na) La jubilaci\u00f3 \u00e9s un tema
  personal, no de l\u2019organitzaci\u00f3\\n\\nL\u2019organitzaci\u00f3 sanit\u00e0ria
  considera la jubilaci\u00f3 com un fet que marca la desvinculaci\u00f3 del treballador
  amb el m\u00f3n laboral, posant fi a la relaci\u00f3 organitzaci\u00f3-professional.
  Aix\u00ed doncs, la jubilaci\u00f3 s\u2019ha convertit, en l\u2019\u00e0mbit sanitari,
  tan sols en una norma que s\u2019ha d\u2019aplicar, i la seva preparaci\u00f3 i
  adaptaci\u00f3 formen part, llavors, de l\u2019\u00e0mbit individual i privat dels
  treballadors on l\u2019organitzaci\u00f3 no sent cap responsabilitat.\\n\\nRes de
  res de res. Vull dir, jo realment penso que cadasc\u00fa s\u2019ha de buscar la
  vida (GF2,15).\\n\\n- La falta de planificaci\u00f3 i la desatenci\u00f3 de les
  organitzacions\\n\\nAl considerar la jubilaci\u00f3 un esdeveniment de l\u2019\u00e0mbit
  privat, les organitzacions sanit\u00e0ries no han realitzat una pol\u00edtica de
  recursos humans orientada a con\u00e8ixer les necessitats de les persones en fase
  de prejubilaci\u00f3; i tampoc s\u2019han iniciat processos d\u2019adaptaci\u00f3
  a la jubilaci\u00f3 ni s\u2019han tingut en compte els efectes del procediment seguit,
  darrerament, per fer efectiva la jubilaci\u00f3.\\n\\nEls metges que s\u2019han
  jubilat ara, \u00e9s natural que no estiguessin preparats, \u00e9s que es pensaven
  que els hi quedaven 5 anys, jo coneix algun que encara est\u00e0 desconcertat (ES2,81).\\n\\nAquesta
  manca de previsi\u00f3 que ja s\u2019havia consolidat, ha esdevingut un problema
  cabadal en aquest \u00faltim any a l\u2019hora d\u2019aplicar l\u2019Estatut marc
  del personal estatutari dels serveis de salut, ja que ha generat malestar entre
  els professionals, ha enterbolit l\u2019ambient de treball i les relacions interpersonals,
  i ha provocat desconcert entre les persones jubilades.\\n\\nHi ha un tema que m\u2019agradaria
  tocar, que \u00e9s el de la jubilaci\u00f3 obligat\u00f2ria, per exemple, qu\u00e8
  ha passat en els hospitals, que aix\u00f2 ha creat un ambient molt desagradable
  en la gent que ha marxat recentment i molt mala llei entre nosaltres perqu\u00e8
  veus una obligaci\u00f3 (GF2,1).\\n\\nMolt brusca i molt mal feta, eh?... Si ara
  tens 60 anys i et diuen que et jubilar\u00e0s als 65, et vas preparant. Per\u00f2
  si et diuen... Lo que ha passat a X, no: \u201cVos\u00e8 dem\u00e0 ja 65, al carrer\u201d,
  o clar, \u00e9s... Canvia (GF2,2).\\n\\nAquesta situaci\u00f3, a m\u00e9s de dificultar
  el desenvolupament de la tasca professional, no facilita en cap cas la transici\u00f3
  de la vida professional activa a la jubilaci\u00f3 (Marshall, Clarke, i Ballantyne,
  2001; Szinovacz, 1989).\\n\\n- La manca de demandes per part dels professionals
  en actiu\\n\\nLa idea que la jubilaci\u00f3 i la seva preparaci\u00f3 s\u00f3n temes
  personals responsabilitat de la persona que es jubila, esdev\u00e9 un factor implicat
  en l\u2019abs\u00e8ncia de demandes expressades pre i post transici\u00f3 en aquest
  col\u00b7lectiu.\\n\\nAltres col\u00b7lectius, en d\u2019altres pa\u00efsos europeus,
  que formen part d\u2019organitzacions laborals que promouen l\u2019anticipaci\u00f3,
  la preparaci\u00f3 i la planificaci\u00f3 de la jubilaci\u00f3 com un dret col\u00b7lectiu,
  viuen aquests esdeveniments com a part de la seva vida laboral, ajusten les seves
  expectatives en relaci\u00f3 a la situaci\u00f3 social i econ\u00f2mica futura,
  i realitzen demandes de millora com a col\u00b7lectiu (Szinovacz, 2003).\\n\\n-
  La gesti\u00f3 activa de les jubilacions com a un tema \u201cnou\u201d en les organitzacions
  sanit\u00e0ries\\n\\nCom ja hem esmentat, \u00e9s amb l\u2019aplicaci\u00f3 del
  nou Estatut marc que aquest tema ha emergit, ha pres rellev\u00e0ncia i se l\u2019hi
  ha atorgat l\u2019estatus de problema. \u00c9s aix\u00ed com tamb\u00e9, a partir
  del moment en que la jubilaci\u00f3 ha generat un conflicte entre els interessos
  de les organitzacions i dels professionals de la medicina, el tema ha esdevingut
  m\u00e9s significatiu per a l\u2019agenda de les organitzacions.\\n\\nEn l\u2019actualitat,
  l\u2019aplicaci\u00f3 de la norma que obliga als professionals de la medicina en
  el sistema sanitari p\u00fablic a jubilar-se als 65 anys enlla\u00e7 dels 70, ha
  generat que molts professionals manifestin el seu malestar davant la violentaci\u00f3
  de les seves expectatives professionals i que s\u2019hagin mobilitzat accions encaminades
  a evitar aquesta aplicaci\u00f3 (per exemple, el Sindicato M\u00e9dico Andaluz ha
  decidit impugnar la norma, i a Catalunya s\u2019han interposat 124 reclamacions,
  tal com es detalla al Diario M\u00e9dico).\\n\\n- La desatenci\u00f3 per part de
  la instituci\u00f3 dels processos implicats en l\u2019aplicaci\u00f3 de la normativa,
  i del patiment de les persones que es jubilen\\n\\nEls professionals assenyalen
  que l\u2019organitzaci\u00f3 no at\u00e9n al proc\u00e9s de jubilaci\u00f3 dels
  seus treballadors i que aquesta manca d\u2019atenci\u00f3 al proc\u00e9s genera
  en alguns casos situacions que resulten molt doloroses pels professionals que es
  jubilen i, incomprensibles i injustificables pels professionals que resten en actiu
  dins de la instituci\u00f3.\\n\\nNo, y que, y que es \u201cMa\u00f1ana no voy\u201d.
  Porque nosotros tenemos compa\u00f1eros en la XXX y les ha sentado fatal y\u2026
  Ya desde mezquindades como que la tarjeta del parking ya no les iba al d\u00eda
  siguiente, y han seguido yendo por ah\u00ed durante 15 d\u00edas para ver si pod\u00edan
  hacer algo, y hacer una cosita y hacer otra\u2026 Y al cabo de los 15 d\u00edas
  se han cansado \u201cNo, no, yo aqu\u00ed no hago nada. Me voy y sigo jugando al
  tenis (GF2,6).\\n\\nb) Els professionals de la medicina sempre tenen una bona sortida\\n\\nEn
  l\u2019\u00e0mbit de la pr\u00e0ctica m\u00e8dica es comparteix la idea de que els
  metges s\u00f3n un col\u00b7lectiu que est\u00e0 en molt bona posici\u00f3 per afrontar
  la jubilaci\u00f3 d\u2019igual manera que gaireb\u00e9 qualsevol altre repte vital.
  Dir\u00edem que forma part de la cultura professional aquesta necessitat de sentir
  que sempre poden aguantar qualsevol situaci\u00f3 de dificultat, sense demanar ajuda
  i sense mostrar patiment.\\n\\nGent que som professionals i que hem tingut una sort
  de poder fer funcionar el cervell i moltes altres coses, doncs, penso que tampoc
  som els m\u00e9s pobres\\n\\ndel m\u00f3n. Llavors, penso que sempre podem anar
  tirant (GF2,15).\\n\\nPer una banda, la majoria assenyala que molts tenen la possibilitat
  de continuar amb la privada i, per tant, allargar la seva vida professional i accedir
  a una jubilaci\u00f3 gradual.\\n\\nA tots aquells que han estat actius i han continuat,
  els hi ha anat espl\u00e8ndidament b\u00e9... El metge que est\u00e0 actiu, encara
  que sigui amb la visita privada, que deixi el que els \u00e9s m\u00e9s pesat l\u2019ICS
  que per la majoria \u00e9s m\u00e9s pesat quan es fan grans, s\u2019en surt perfectament
  (ES2,35).\\n\\nY la privada, bueno, pues les sirve para ir... para ir reduciendo
  su actividad m\u00e9dica de forma paulatina y poder vivir m\u00e1s y estar m\u00e1s...
  Seguir manteniendo esta relaci\u00f3n m\u00e9dico-enfermo... (GF2,4).\\n\\nPer altra
  banda, donat el seu nivell cultural, creuen que gaudeixen d\u2019aficions socioculturals
  significatives a les que es poden dedicar intensament despr\u00e9s de la jubilaci\u00f3,
  resultant aquest per\u00edode molt satisfactori.\\n\\nPer exemple el Dr.XX que li
  agrada la fotografia i no para mai!, es passa el dia fent fotografies, t\u00e9 una
  c\u00e0mera digital, i ho passa tot a l\u2019ordinador i representa unes hores d\u2019ocupaci\u00f3
  (ES2,55).\\n\\nTamb\u00e9 veuen una gran oportunitat en la col\u00b7laboraci\u00f3
  amb ONG i/o programes de voluntariat on la seva experi\u00e8ncia professional sigui
  d\u2019utilitat.\\n\\nN\u2019hi ha un altre, el Dr.XX, que aix\u00f2 trobo que est\u00e0
  molt b\u00e9, si se sap fer, que es va posar en contacte amb la Creu Roja. Li donen
  els tel\u00e8fons de 100 o 150 persones grans que viuen soles i ell es dedica sistem\u00e0ticament
  a trucar-les per veure si estan b\u00e9 si tal o qual. En aquest cas el ser metge
  li ajuda molt, no? (ES2, 65).\\n\\nI senten que poden, com altres professionals,
  trobar en les activitats de la vida quotidiana una gratificaci\u00f3 personal i
  una vinculaci\u00f3 amb l\u2019entorn satisfact\u00f2ria.\\n\\nI tamb\u00e9 hi ha
  algun metge, per\u00f2 d\u2019aquests no en coneix gaires, que han deixat la medicina
  gaireb\u00e9 de manera absoluta, que no tenen un hobbie determinat i que a pesar
  de tot s\u2019ho passen b\u00e9. El Dr. XX, que viu a fora, s\u2019aiseca a les
  7 del demat\u00ed, s\u2019en va a caminar 7 o 8 km quan torna ja s\u2019han fet
  les 9 tocades i llegieix el diari, que diu que amb aix\u00f2 ja li passa tot el
  demat\u00ed i el veus perfectament b\u00e9 (ES2,60).\\n\\nGlobalment, consideren
  tamb\u00e9 que tots els membres del col\u00b7lectiu amb els recursos econ\u00f2mics
  que tenen poden assegurar-se una jubilaci\u00f3 amb les necessitats b\u00e0siques
  cobertes. Encara que molts creuen que s\u00f3n insuficients per mantenir el nivell
  de vida desitjat.\\n\\nc) L\u2019organitzaci\u00f3 est\u00e0 interessada, priorit\u00e0riament,
  en el compliment dels objectius econ\u00f2mics m\u00e9s que en les persones.\\n\\nL\u2019objectiu
  de l\u2019organitzaci\u00f3 vist com a prioritari \u00e9s complir amb els objectius
  fixats, econ\u00f2mics i d\u2019atenci\u00f3 (nombre d\u2019intervencions realitzades,
  etc.).\\n\\n- L\u2019organitzaci\u00f3 pot decidir en funci\u00f3 dels seus interessos
  econ\u00f2mics, sobre la jubilaci\u00f3 dels professionals sense tenir-los en compte\\n\\nEs
  considera que la jubilaci\u00f3 s\u2019ha utilitzat com una eina de l\u2019organitzaci\u00f3
  per regular la plantilla, els costos econ\u00f2mics, l\u2019homogene\u00eftzaci\u00f3
  de funcions, horaris i salaris entre els treballadors. D\u2019aquesta forma, la
  jubilaci\u00f3 ha esdevingut pel treballador una obligaci\u00f3 marcada per l\u2019organitzaci\u00f3
  i no un dret que ha d\u2019exercir un mateix.\\n\\nSi m\u2019\u00e9n recordo del
  llat\u00ed, jubilaci\u00f3 vol dir jubil (alegria) i aqu\u00ed ho estem construint
  al rev\u00e9s, no? Doncs a veure si ho podem canviar un mica, no? Tot aix\u00f2
  (ES1,5).\\n\\nPer\u00f2 si aix\u00f2 es fa molt a l\u2019estrangeir... No obligat\u00f2ria
  per\u00f2 si volunt\u00e0ria (GF1,20).\\n\\nI els professionals assenyalen com els
  interessos de l\u2019organitzaci\u00f3 s\u00f3n, principalment, econ\u00f2mics.\\n\\nLa
  idea inicial tant absurda, que \u00e9s la xocolata del lloro, \u201cAquest senyor
  est\u00e0 cobrant tal, tal. Si ara tots aquests els substitu\u00efm\u2026 Un per
  cada dos. Per cada dos que jubilem un resident que cobrar\u00e0 la tercera part
  i far\u00e0 les mateixes visites o m\u00e9s\u201d. \u00c9s aquest simplista. \u00c9s
  aquest raonament dels gerents d\u2019avui en dia. No pensen en les capacitats ni
  en la transmissi\u00f3 d\u2019experi\u00e8ncia i coneixement (GF1,22).\\n\\n- La
  p\u00e8rdua de capital hum\u00e0 no sembla que per l\u2019organitzaci\u00f3 sigui
  vista com un problema\\n\\nEls treballadors perceben que la seva experi\u00e8ncia
  i coneixements no s\u00f3n valorats per l\u2019organitzaci\u00f3 i, per tant, s\u2019est\u00e0
  produint una p\u00e8rdua de capital hum\u00e0 ja format i expert. Per\u00f2 la seva
  desvinculaci\u00f3 de l\u2019organitzaci\u00f3 fa que no ho sentin com un problema
  que els afecti, ja que ells ja no s\u2019identifiquen com a membres d\u2019una organitzaci\u00f3
  amb aquestes caracter\u00edstiques.\\n\\nNosaltres tenim una cultura que l\u2019estat
  va gastar molts diners en nosaltres en formar-nos, eh? i que s\u2019est\u00e0 perdent.
  I si els hi sobra, all\u00e0 ells (GF1,11).\\n\\nPer qu\u00e8 serveixo? Per m\u00e9s
  que jo sabent o haver fet iantes coses, ara ning\u00fa m\u2019aprofiti (GF1,20).\\n\\n-
  La pr\u00e0ctica privada passa a perfilar-se com una forma de protegir-se i compensar\\n\\nL\u2019exercici
  de la medicina en l\u2019\u00e0mbit privat adquireix m\u00e9s rellev\u00e0ncia a
  l\u2019hora d\u2019analisitz i plantejar-se la jubilaci\u00f3 ja que esdev\u00e9
  l\u2019espai on compensar els efectes de la pressi\u00f3 o el considerat maltractament
  institucional, aix\u00ed com el lloc on gaudir de la pr\u00e0ctica de la medicina
  que a un li agrada.\\n\\nEls que han continuat amb la privada els hi va esplendidament,
  que deixin el que per a ells \u00e9s pesat i desagradable, la Seguretat Social,
  quan es fan grans sobretot, i continuen no al mateix ritme de quan eren m\u00e9s
  joves per\u00f2 si amb alguns malalts, aquests van fent esplendidament (ES2,1).\\n\\nAra
  b\u00e9, la gran desigualtat que volem remarcar aqu\u00ed \u00e9s que aquesta opci\u00f3
  vista com a molt favorable no existeix per a aquells professionals que han exercit
  la medicina nom\u00e9s en el sistema sanitari p\u00fablic i amb una dedicaci\u00f3
  exclusiva.\\n\\nMuchos m\u00e9dicos tienen esa suerte, que se pueden jubilar y pueden
  seguir dedic\u00e1ndose de forma, con m\u00e1s tranquilidad, a la medicina privada.
  Pueden seguir\u2026 pueden seguir ejerciendo su profesi\u00f3n y les gusta. Los
  que nos hemos dedicado exclusivamente a la medicina oficial o a la medicina\u2026
  Esto es un corte absolutamente radical (GF2,4).\\n\\nd) En la pr\u00e0ctica professional
  actual l\u2019experi\u00e8ncia resulta, nom\u00e9s, un valor relatiu\\n\\n- L\u2019experi\u00e8ncia
  \u00e9s un valor del que es pot prescindir quan resulta car\\n\\nL\u2019experi\u00e8ncia
  ja no resulta un mitj\u00e0 efica\u00e7 per a la generaci\u00f3 de coneixement v\u00e0lid.
  En l\u2019actualitat, sembla que l\u2019accessibilitat de la informaci\u00f3 ha
  relegat el valor de l\u2019experi\u00e8ncia a un lloc secundari.\\n\\nBueno, b\u00e1sicamente
  es que hoy en d\u00eda, pues, la experiencia no es un grado. No sirve de nada. Todo
  es basado en la evidencia nivel 1, clase A, cuando se sabe que muchos de estos estudios
  hacen aguas porque hay muchas exclusiones\u2026 Al principio todos mis residentes
  se pasaban la noche mirando el monitor del enfermo y ahora se pasan la noche mirando
  el monitor del Google, buscando art\u00edculos y todo esto\u2026 (GF2,18).\\n\\nL\u2019experi\u00e8ncia
  \u00e9s, en l\u2019actualitat, quelcom del que es pot prescindir si no s\u2019ajusta
  als objectius econ\u00f2mics de l\u2019organitzaci\u00f3.\\n\\nEn canvi, un metge
  amb una gran experi\u00e8ncia pot orientar, pot dir, pot opinar, pot aconsellar\u2026
  Per\u00f2 ara no interessen ni les opinions ni els consells. Ara interessen els
  objectius i els hospitals tenen uns objectius que es tenen que complir (GF1,22).\\n\\nEn
  aquest context \u00e9s el malalt qui es converteix en l''\u00fanica font de reconeixement
  de l''experi\u00e8ncia dels professionals m\u00e9s grans.\\n\\n\\\"Jo no estic conforme
  que l''experi\u00e8ncia no \u00e9s un grau. Jo crec que no. Mira, tu tens un malalt,
  no? que l''has de visitar tu. Tu aquell dia no pots visitar-lo i el visita un resident,
  veur\u00e0s si li agrada o no. Al malalt no li agradar\u00e0. Dir\u00e0 \\\"Jo!
  Ara aquest em visita avui?\\\" Clar, el malalt valora l''experi\u00e8ncia? \u00c9s
  clar que ho valora, segur! (GF2,21).\\n\\n- El treballador amb experi\u00e8ncia
  no \u00e9s tan interessant com el treballador que \u00fanicament compleix la forma
  de pr\u00e0ctica dissenyada\\n\\nMalgrat existeix abundant evid\u00e8ncia de que
  els treballadors grans tenen un rendiment a la feina equivalent al dels treballadors
  m\u00e9s joves (War, 1998; entre d''altres), aquests primers no resulten tan atractius
  per la instituci\u00f3 com els joves. La investigaci\u00f3 al respecte (Mortimer
  i Lorence, 1994) mostra que els treballadors grans presenten difer\u00e8ncies al
  seu favor respecte als m\u00e9s joves en factors com l''\u00e8tica del treball,
  el valor del treball, el comprom\u00eds i la responsabilitat, la qualitat del treball,
  la capacitat de lideratge, i el pensament flexible i cr\u00edtic a l''hora d''afrontar
  les q\u00fcestions professionals.\\n\\n\\\"Els vells fora i els joves dintre. Per\u00f2
  aquests joves que entren no s''aprofiten de l''experi\u00e8ncia dels vells. I l''hospital,
  o sigui, la medicina hospital\u00e0ria i els serveis hospitalaris i els serveis
  docents, l''experi\u00e8ncia de la gent gran no la t\u00e9 en compte. O serveixes
  per tot o al carrer (GF1,21).\\n\\n\\\"A la que no serveixes, fora. I la teva experi\u00e8ncia?
  No val. Tu tens que rendir, fer tantes peces al dia i prou. La teva experi\u00e8ncia
  tant \u00e9s, tantes peces al dia (GF1,21).\\n\\nEls professionals joves s''ajusten
  m\u00e9s f\u00e0cilment als mandats de la instituci\u00f3 (S\u00e1nchez-Candamio
  i d''altres, 1999). El compliment dels mandats de la instituci\u00f3 es genera m\u00e9s
  f\u00e0cilment en els joves, ra\u00f3 per la que el professional jove resulta m\u00e9s
  \\\"col\u00b7laborador\\\" per a l''organitzaci\u00f3, encara que el seu grau de
  comprom\u00eds com a treballadors sigui menor.\\n\\n\\\"I llavors, clar, els adjunts,
  la gent jove, no els hi diguis tu que s''han de quedar un rato m\u00e9s perqu\u00e8
  han de fer aix\u00f2... \\\"No, no, jo faig l''horari... i com que jo he aconseguit
  que fos m\u00e9s barato... o lo que sigui, pos aix\u00f2 est\u00e0 b\u00e9\\\".
  No senyor. \u00c9s una feina molt m\u00e9s burocratitzada, molt m\u00e9s burocratitzada,
  cosa que a mi no m''agrada gens... (GF2,20).\\n\\n\\\"Per\u00f2 si us fixeu en la
  gent jove, i aix\u00f2 \u00e9s a lo que anava, perqu\u00e8... Bueno, ara nosaltres
  tenim una hist\u00f2ria anterior, que ha estat la que ha estat i punt. Per\u00f2
  que fa la gent jove ara? Fixeu-vos que ja no van tan a sac a dedicar-se a una professi\u00f3
  en un sentit a \\\"full time\\\", per entendre''s... Per\u00f2 ara no. La gent volen
  temps per viure, per... (GF1,18).\\n\\n- L''estatus dels treballadors grans es perd
  progressivament abans de la jubilaci\u00f3\\n\\nEls canvis produ\u00efts en l''exercici
  de la medicina, la incorporaci\u00f3 de nous procediments (per exemple per cercar
  i validar la informaci\u00f3), la desestimaci\u00f3 dels procediments v\u00e0lids
  fins ara i el canvi en les relacions tipificades entre professionals i professional-usuari
  fan que fins i tot abans de jubilar-se aquests professionals ja no se sentin considerats
  de la mateixa forma dins i fora de l''organitzaci\u00f3.\\n\\n\\\"I molt m\u00e9s
  tecnificada. Jo lo que volia apuntar \u00e9s que hi ha hagut, amb aix\u00f2 que
  dius, penso que hem passat del que deies tu de l''experi\u00e8ncia personal, del
  que teniem la gent al cervell. Ara aix\u00f2 ja sembla que no \u00e9s v\u00e0lid!
  Els llibres no s\u00f3n v\u00e0lids, les revistes no s\u00f3n v\u00e0lids, l''\u00fanic
  que \u00e9s v\u00e0lid \u00e9s el buscador... els buscadors d''Internet (GF2,20).\\n\\n\\\"La
  meva impressi\u00f3 \u00e9s que molts metges al fer-se grans i ja abans de fer-se
  grans, lo que m\u00e9s perden, no \u00e9s nom\u00e9s l''economia, sin\u00f3 l''estatus
  social. La manera en que ara es tracten els metges les persones... (GF1,3).\\n\\nEste
  tipo de medicina \u00a1pues ya me lo est\u00e1 poniendo tan dif\u00edcil! Y yo tengo
  especialidad quir\u00fargica que cambia poco, pero b\u00e1sicamente, hoy en d\u00eda
  escuchas a esa gente que sabe much\u00edsimo, que son... Hoy en d\u00eda hay un
  tipo de ense\u00f1anzas y un tipo de medicina, de pr\u00e1cticas de medicina, chico,
  que no se me XXX muchos a\u00f1os as\u00ed (GF2,19).\\n\\nHa cambiado la relaci\u00f3n
  con el paciente. Ha cambiado la relaci\u00f3n con los familiares. Ha cambiado la
  relaci\u00f3n con los... \u00a1hasta con los compa\u00f1eros! Ha cambiado la relaci\u00f3n
  con el resto del estamento del hospital. Ha cambiado... Yo no hago juicios de valor
  si para bien o para mal. Creo que para mal, pero bueno... Ha cambiado la forma misma
  de hacer la medicina. Ha cambiado todo (GF2,19).\\n\\nA m\u00e1s, el reconocimiento
  social de la profesi\u00f3n de metge s\u2019ha modificado muy en los \u00faltimos
  a\u00f1os. Abans donava una posici\u00f3n de prestigio social que actualmente muchos
  no venen.\\n\\nI per altra banda, jo almenys a nivell de les consultes de prim\u00e0ria,
  noto que hi ha hagut una cosa molt dolenta, pel malalt, i \u00e9s que ha fet una
  transfer\u00e8ncia de confian\u00e7a, que abans la tenia dipositada en una persona,
  ho ha transferit a una serie de t\u00e8cniques eh? Tu li pots dir a una persona
  que t\u00e9 mal de cap \u201cEscolti, aix\u00f2 \u00e9s un mal de cap de tensi\u00f3
  nerviosa, una cefalea\u2026\u201d \u201cNo, no, a mi, escolti\u2019m, fotim un esc\u00e0ner\u201d,
  eh? I llavors ja t\u2019agafen ganes de dir-li, quan et porten l\u2019esc\u00e0ner,
  dir-li \u201cEscolti, i qu\u00e8 li ha dit la m\u00e0quina? Perqu\u00e8 vost\u00e8
  t\u00e9 confian\u00e7a en la m\u00e0quina i no en mi\u201d. Aix\u00f2 tamb\u00e9
  \u00e9s una cosa\u2026 Clar, tot aix\u00f2 ha anat fent canviar la professi\u00f3!
  (GF2,20).\\n\\nLa manera en que ara es tracten els metges les persones\u2026 Aix\u00f2
  de que els mosos estiguin entrenant per posar-se a la porta de l\u2019ambulatori
  de Girona i que cada CAP tingui que tenir un mosso all\u00e0 vigilant de que no
  atonyinin el metge\u2026 Tot aix\u00f2 \u00e9s un canvi social vinculat amb tots
  els altres canvis sociales: reben els professors, les mares reben\u2026 Crec que
  hi ha un problema de viol\u00e8ncia, tot aix\u00f2 ja ho sabem. Per\u00f2 un canvi
  en els metges l\u2019he vist brutal. O sigui, la manera en qu\u00e8, en qu\u00e8
  et tracten en un hospital o\u2026 Bueno, jo ara he tingut el meu marit ingresat
  i la manera en qu\u00e8 els altres metges joves\u2026 \u00c9s que em semblava inconcebible!
  I com les infermeres i les auxiliars i els camillers els tracten a ells. Llavors
  aix\u00f2 ja ve durant una \u00e9poca i quan arriba el moment de la jubilaci\u00f3
  \u00e9s lo que diu ell, s\u2019hi suma el desprestigi social, la q\u00fcesti\u00f3
  econ\u00f2mica, la\u2026 (GF1,3).\\n\\nSituaci\u00f3n que los profesionales reconocen
  como compartida, en parte, con otros colectivos profesionales como el de maestros,
  pero con una situaci\u00f3n de m\u00e9dicos sensiblemente mejor.\\n\\nPer\u00f2
  la medicina est\u00e1 fent lo mateix que fa la societat. Vull dir, els metges\u2026
  Passa lo mateix\u2026 Si tu et relaciones, per exemple, amb professors, que jo tinc
  relaci\u00f3 amb gent que es dedica al m\u00f3n de l\u2019ense\u00f1yament, doncs
  es queixen de moltes altres coses i, a banda, estan molt m\u00e9s mal pagats, pobres
  gent. Vull dir, a veure\u2026 Vull dir que la societat \u00e9s un canvi important
  i llavors nosaltres ho patim (GF2,21).\\n\\n3.2. Contradiccions principals en la
  definici\u00f3 de la jubilaci\u00f3 com a soluci\u00f3 i com a problema\\n\\na)
  La soluci\u00f3 per rejevenir plantilles i reduir costos\\n\\nLa institucionalitzaci\u00f3
  de la jubilaci\u00f3, les regulacions de les cotitzacions i les pensions tenen,
  tamb\u00e9, implicacions directes en les organitzacions. Per una banda, possibiliten
  la renovaci\u00f3 de les forces de treball, amb nous treballadors i amb la promoci\u00f3
  interna de treballadors, i la reducci\u00f3 de costos derivada del fet que habitualment
  els treballadors m\u00e9s joves i amb menys experi\u00e8ncies impliquen costos salarials
  m\u00e9s baixos.\\n\\n\\\"Jo he parlat amb el jefe... S\u00ed, mira... Mira, el
  problema que tenen els hospitals \u00e9s que tenen una poblaci\u00f3 de mitja enve\u00eflida,
  no? Llavors, a partir d''una certa edat ning\u00fa fa gu\u00e0rdies, no? I llavors
  resulta que tenen gent que no fa gu\u00e0rdies i llavors el servei d''urg\u00e8ncies
  d''alguna manera, doncs, amb manca de personal. Si tu fas fora [friu] a la gent
  que t\u00e9 de 50 anys en amunt, tothom que entra fa les dues feines: la feina assistencial
  di\u00e0ria i la gu\u00e0rdia. I representa per a l''hospital un estalvi de diners
  i despr\u00e9s es treu de sobre a gent amb un sou que comencen...\\\" (GF2,17).\\n\\nS''assenyala
  que les jubilacions for\u00e7oses haurien de suposar una oportunitat per rejevenir
  les plantilles, mantenint la qualitat del servei i l''atenci\u00f3, per\u00f2 que
  en realitat s\u00f3n una forma d''abaratir els costos en la partida de personal,
  ja que als joves se''ls paga menys i sovint fan m\u00e9s hores. A m\u00e9s, en molts
  casos, s\u00f3n professionals que provenen d''altres pa\u00efsos, aix\u00ed que,
  fins i tot, s''estalvia en la seva formaci\u00f3.\\n\\n\\\"Bueno, a veure, aqu\u00ed
  un 85% de les residencies, dels domicilis, de XXX l''estant fent sud-americans i
  tal... I jo una vegada quan estava el conseller al XXX, a Vic, va venir... Vam tenir
  una reuni\u00f3 i li vam platejar aix\u00f2 i jo, \u00e9s un tema que sempre m''ha
  interessat molt, aix\u00f2 de la falta de metges. I va dir que \\\"Cap problema\\\",
  que hi havia metges sud-americans, hi havia metges b\u00fclgars, polonesos... Que
  \\\"cap problema\\\"... (GF2,9).\\n\\n\\\"A: No, per\u00f2 aix\u00f2 passa a Anglaterra.
  Tu vas a Anglaterra i metges anglesos no n''hi ha. S\u00f3n de l''\\\"overseas\\\"
  tots.\\nB: Bueno, puede ser una forma como otra cualquiera de ahorrar dinero. Se
  gastan otros pa\u00edses form\u00e1ndolos y los recogen aqu\u00ed... (GF2,10).\\n\\nb)
  El problema de la p\u00e8rdua de treballadors experts i dif\u00edcilment substitu\u00efbles\\n\\nPer
  altra banda, la jubilaci\u00f3 implica costos salarials derivats de la p\u00e8rdua
  de treballadors valuosos, formats i compromesos amb l''organitzaci\u00f3, i de les
  contribucions al sistema de pensions. Els treballadors que ocupen llocs de responsabilitat
  amb alt nivell d''estr\u00e8s acostumen a ser, en comparaci\u00f3 amb la resta de
  treballadors, els que m\u00e9s utilitzen les jubilacions anticipades. Habitualment
  s\u00f3n treballadors amb molts recursos socials i financers, que han planificat
  la seva jubilaci\u00f3 amb suficient anticipaci\u00f3 i poden triar el moment de
  la seva ocurr\u00e8ncia.\\n\\nAix\u00ed doncs, la situaci\u00f3 actual pot derivar
  en una manca de treballadors qualificats per fer front a llocs de treball de\\n\\nmolta
  responsabilitat, al mateix temps que dificulta la planificaci\u00f3 per part de
  l\u2019organitzaci\u00f3 de les seves forces de treball.\\n\\n\u201cI aix\u00f2
  s\u00ed que no s\u00e9 si el XX amb aix\u00f2 hi podria fer o no, perqu\u00e8 estem
  perdent un gran capital d\u2019experi\u00e8ncia. Un gran capital d\u2019experi\u00e8ncia
  humana als centres hospitalaris\u201d (GF1,21).\\n\\n\u201cPerqu\u00e8, en el fons
  aix\u00f2 \u00e9s coneixement de la societat, un coneixement que realment va comen\u00e7ar
  a la universitat, va continuar amb uns programes MIR, etc., etc., va continuar durant
  molt anys ampliant-los, perqu\u00e8 en el fons ens hem socialitzat sota el paraig\u00fces
  de que \u00e9s l\u2019Estat, i de repent, alegremen, menyspreem tot aix\u00f2. I
  jo no crec que hi hagi cap l\u00f2gica que per una norma llen\u00e7ar un capital
  que ha costat tant d\u2019adquirir, en 24 hores \u00e9s com si no exist\u00eds.
  Crec que hi ha una obligaci\u00f3, que haur\u00edem de tenir un repte com a societat,
  de no permetre aix\u00f2. Aquests professionals haurien de continuar proporcionant
  valor afegit a lo que \u00e9s la sanitat\u201d (ES1,4).\\n\\n3.3. Millores conegudes
  per\u00f2 sense ress\u00f2 ni valor en la cultura dels professionals i les organitzacions\\n\\na)
  Incrementar la individualitzaci\u00f3 i la flexibilitat en la transici\u00f3 a la
  jubilaci\u00f3\\n\\n- Flexibilitzar les jubilacions\\n\\nEls programes de la Seguretat
  Social i els programes de pensions privats indiquen una finestra en la que \u201cla
  jubilaci\u00f3 normal o a temps\u201d s\u2019ha de produir. Per\u00f2 com \u00e9s
  sabut, existeixen programes, p\u00fablics i privats, orientats a promoure la jubilaci\u00f3
  dels treballadors grans abans d\u2019aquesta edat. En el nostre pa\u00eds, l\u2019edat
  mitjana per jubilar-se \u00e9s de 62,5 anys, si b\u00e9 \u00e9s cert que des de
  l\u2019any 1995 el nombre de persones que s\u2019han acollit a la jubilaci\u00f3
  anticipada s\u2019ha redu\u00eft en m\u00e9s d\u2019un 30% (Souso, 2004).\\n\\nCom
  a factors que incideixen en aquest retard de la jubilaci\u00f3 podem assenyalar
  la millora de la salut de les persones de 60 a 65 anys, l\u2019increment de l\u2019esperan\u00e7a
  de vida, la integraci\u00f3 de la dona al mercat laboral, els plans i programes
  governamentals orientats a promoure la perman\u00e8ncia en el m\u00f3n laboral dels
  treballadors m\u00e9s grans, implementats a partir de 1997, entre d\u2019altres.\\n\\nEl
  treball amb horari flexible i el treball compartit poden resoldre tamb\u00e9 les
  necessitats de productivitat i d\u2019oferta de llocs de treball estables.\\n\\nEl
  canvi cap a un sistema on les persones de m\u00e9s de 65 anys poden mantenir-se
  actives en el m\u00f3n laboral contribueix a incrementar la individualitzaci\u00f3
  i la flexibilitat en la transici\u00f3 a la jubilaci\u00f3, a l\u2019hora que esmorteix
  els efectes de la suposada crisi que viu l\u2019estat del benestar.\\n\\n\u201cNo,
  lo de les jubilacions paulatines dels 65 als 75 anys, que primer treballles 8 hores
  i despr\u00e9s 6, despr\u00e9s 4 i tot aix\u00f2, \u00e9s una soluci\u00f3 a la
  que s\u2019hauria de poder... (GF1,20).\\n\\nHaur\u00edem d\u2019anar no nom\u00e9s
  al que ens passa sin\u00f3 quines condicions trobem perqu\u00e8 aquesta professi\u00f3,
  pues el que deia abans, pugui continuar tenint una activitat en el moment que es
  jubili des del punt de vista social, i que les persones que han estat m\u00e9s anys
  doncs realment pues no tinguin aquesta mena de desil\u00b7lusi\u00f3 per entrar
  en el m\u00f3n de jubilaci\u00f3 (ES1,5).\\n\\nNo s\u00e9 si la societat s\u2019hauria
  de plantejar, jo torno al mateix, de al menos, donar l\u2019opci\u00f3 a la gent
  que est\u00e0 en aquesta edat, que la que es vulgui jubilar, qui vulgui viure la
  seva vida, que la visqui. I el que vulgui seguir donant la seva experi\u00e8ncia
  a la societat, que la doni. I incl\u00fas hi ha sistemes, crec que a Fran\u00e7a
  se n\u2019havia parlat o es fa\u2026 I aqu\u00ed tamb\u00e9 se n\u2019havia parlat\u2026
  de fer una mitja jornada o\u2026 (GF2,27).\\n\\n- Promoure i deixar fluir les propostes
  d\u2019associacions/organitzacions professionals\\n\\nPer poder arribar a definir
  sistemes din\u00e0mics i contextualitzats a les diferents organitzacions i caracter\u00edstiques
  dels centres i dels professionals, els experts entrevistats assenyalen la necessitat
  d\u2019ampliar el sistema de propostes i d\u2019alternatives possibles per part
  de l\u2019administraci\u00f3.\\n\\nL\u2019administraci\u00f3 en el fons el que fa
  \u00e9s la norma, \u00e9s a dir, les normes. Escolta, moltes vegades parlen de blanc
  i negre per\u00f2 en aquest cas jo crec que si deixessin la iniciativa als propis
  col\u00b7legis o a les pr\u00f2pies institucions jo crec que sortirien idees bones
  d\u2019aqu\u00ed. L\u2019administraci\u00f3, jo crec, els hauria de deixar fluir,
  que no contravinguessin les normes evidentment, per\u00f2 jo m\u2019inclin\u00f3
  m\u00e9s per aqu\u00ed. L\u2019administraci\u00f3 el que ha de dir ja ho va dir:
  65 anys casa i 300 mil peles. Vale, m\u00e9s enll\u00e0 de dir aix\u00f2 el que
  hauria de fer \u00e9s escoltar probablement idees que poden sortir d\u2019aquests
  col\u00b7lectius, que no ens quedem all\u00e0 \u201cllorando\u201d. Que no ens en
  sortirem! (ES1,5).\\n\\n- Buscar i generar recursos en l\u2019entorn proper\\n\\nL\u2019entorn
  proper es dibuixa com una font de recursos importants tant pel que fa a oferir activitats
  com a la possibilitat de mantenir el sentiment d\u2019utilitat i la identitat personal
  a trav\u00e9s de la col\u00b7laboraci\u00f3 en associacions de malalts, de divulgaci\u00f3
  en temes de salut a col\u00b7lectius com els joves, infants, immigrants, etc.\\n\\n-
  Potenciar l\u2019atenci\u00f3 a les situacions generades pels canvis legislatius\\n\\nEls
  canvis legislatius han generat situacions complicades d\u2019assumir pels treballadors
  donat que han violenat les seves expectatives laborals i els seus plans de futur.
  Aquestes situacions han de ser ateses des de les organitzacions posant a l\u2019abast
  dels afectats diferents serveis i recursos transitoris.\\n\\nO sigui, van passar
  una s\u00e8rie de persones en un any de tenir unes expectatives de 70 a 65. En uns
  mesos 9 o 10. L\u00f2gicament van patir d\u2019aquesta situaci\u00f3 que deia de
  fractura, por\u2026, el que nosaltres vam fer, efectivament, a partir d\u2019anar
  jubilant als 65 els vam mantenir a la instituci\u00f3 fins als 70 i a alguns fins
  als 72 i tot continuant amb l\u2019experi\u00e8ncia aquesta que parlavem, no? Formant
  part d\u2019organs de decisi\u00f3, no tant de jerarquia sin\u00f3 de s\u00e8niors
  que donessin l\u2019opini\u00f3, comit\u00e9s, i reconeixent-los una retribuci\u00f3
  tamb\u00e9, conscient de que l\u00f2gicament si estaven a 100 van passar a 60. Els
  vam ajudar a que aquesta gent tingu\u00e9s, pues b\u00e9, una soluci\u00f3 a la
  problem\u00e0tica que ells veien. A m\u00e9s a m\u00e9s, que els hi va agafar de
  cop, una mica el que est\u00e0 passant amb el sistema, \u00e9s dir que de repent
  de 65 a 70 i aquestes coses generen molta preocupaci\u00f3, no? (ES1,3).\\n\\nb)
  Implicar activament les organitzacions en la preparaci\u00f3 de la jubilaci\u00f3\\n\\nLa
  import\u00e0ncia de la preparaci\u00f3 a la jubilaci\u00f3 no pot ser sobreestimada.
  La preparaci\u00f3 t\u00e9 conseq\u00fc\u00e8ncies econ\u00f2miques, psicol\u00f2giques
  i socials. El repte de la preparaci\u00f3 \u00e9s saber quan, com i de qu\u00e8
  hem de prescindir (pel que fa als diners, el poder i el reconeixement social) i
  en quines altres coses, a m\u00e9s del treball, hem d\u2019invertir (relacions interpersonals,
  activitats alternatives). Ajudar els treballadors a ajustar les seves expectatives
  entorn la jubilaci\u00f3 de forma realista, a marcar-se objectius assolibles, etc.,
  reduex les dificultats en l\u2019adaptaci\u00f3. Aix\u00f2 suggerex que aquelles
  organitzacions interessades en promoure una adaptaci\u00f3 positiva han de fer accessible
  i f\u00e0cil als treballadors l\u2019acc\u00e9s a programes de preparaci\u00f3 i
  planificaci\u00f3 de la jubilaci\u00f3.\\n\\n- Obrir espais d\u2019assessorament
  i participaci\u00f3 en les organitzacions\\n\\nEls professionals assenyalen com
  a conegudes, situacions de companys que podrien ser receptors d\u2019ajuda individualitzada.\\n\\nHi
  ha gent que deambula pels hospitals dient \u201cEm deixen venir en un despaxet\u201d
  (GF2,24).\\n\\nTinc\u2026 Exacte, el s\u00edndrome d\u2019abstin\u00e8ncia. Doncs
  vaig dos vegades a la setmana a l\u2019hospital i a la biblioteca, i el s\u00edndrome
  d\u2019abstin\u00e8ncia el vaig curant de mica en mica, eh? (GF1,7).\\n\\n- Facilitar
  l''acc\u00e9s a la preparaci\u00f3\\n\\nTant els professionals com els experts que
  han participat en l''estudi assenyalen la necessitat que des de les organitzacions
  es faciliti l''acc\u00e9s a la preparaci\u00f3 de la jubilaci\u00f3. Altres estudis
  (Taylor i Doverspike, 2003) coincideixen en que les persones haurien de disposar,
  uns quatre o cinc anys abans de la jubilaci\u00f3, del temps suficient per organitzar
  el futur.\\n\\nAvisal''s d''alguna forma, digues-los-hi \u201cEscolta, aix\u00f2
  s''acaba\u201d. No s\u00e9 a quina edat, als 50, 60 o 70, m\u00e9s igual, per\u00f2
  un dia que et don\u00e9s compte dius \u201cBueno, aix\u00f2 s''acaba\u201d. Ara
  busca (GF1,16).\\n\\nA partir d''aqu\u00ed, dius, davant d''aquestes dues realitats
  s''ha d''intentar fer plans de preparaci\u00f3, com si digu\u00e9sim, i de sortida,
  de mentalitzaci\u00f3 d''aquests professionals i d''intentar trobar-los ocupaci\u00f3
  perqu\u00e8 no tinguin aquesta fractura de la vida. Perqu\u00e8 en el fons \u00e9s
  una fractura de la vida i \u00e9s dif\u00edcil. Aqu\u00ed est\u00e0 una mica el
  repte de treballar per tot aix\u00f2 (ES1,4).\\n\\nSense oblidar que abans s''han
  de plantejar estrat\u00e8gies per fer front a la dificultat que els metges, per
  definici\u00f3, no es veuen a s\u00ed mateixos com a necessitats d''ajuda i que
  facin \u00fas d''aquests serveis.\\n\\nSi es fa la preparaci\u00f3 a la jubilaci\u00f3,
  primer que el problema principal \u00e9s saber si venen el metges o no, que una
  cosa \u00e9s la proposta i despr\u00e9s la resposta (ES2,159).\\n\\n- Promoure plans
  de pensions empresarials\\n\\nNo, per\u00f2 despr\u00e9s hi ha pa\u00efsos que la
  gent cobra un pla de pensions empresarial, un, un... la pensi\u00f3 i el propi.
  O sigui, hi ha empreses que ja fan... (GF2,29).\\n\\nSobretot haurien d''intentar
  sensibilitzar-los. I dir \u201cEscolti''m, no s\u00e9, tenim aix\u00f2 o oferim
  aquest pla\u201d o el que sigui m\u00e9s enll\u00e0 del pla t\u00edpic de jubilaci\u00f3
  i pensi\u00f3. \u00c9s a dir, perqu\u00e8 aquest tipus de professi\u00f3, que realment
  com deia abans fent un poder adquisitiu i b\u00e9, anem vivint mentre treballen
  mentre estan a la vida professional despr\u00e9s ho notaran molt aix\u00f2. Es nota
  molt\u00edssim, per\u00f2 no 5 anys abans, aix\u00f2 hauria de ser abans, mentalitzar-lo
  \u201cEscolti que vost\u00e8 cobr\u00e0ra aix\u00f2 el dia que es jubili\u201d i
  mentalitzar-lo que vagi fent guardiola, per dir-ho d''alguna manera (ES1,4).\\n\\nc)
  Realitzar una pol\u00edtica activa orientada al treballadors m\u00e9s veterans\\n\\nAugmentar
  la consideraci\u00f3 dels treballadors veterans, de la seva experi\u00e8ncia i capacitats
  aix\u00ed com la seva utilitat a les institucions, requereix prendre mesures i comporta
  incrementar el comprom\u00eds entre el treballador i l''organitzaci\u00f3, i valorar
  la qualitat del seu treball i el seu rendiment (Sciae i Willis, 2003).\\n\\n- Redefinir
  funcions i horaris\\n\\nPermetent que els treballadors grans puguin transmetre coneixements
  i/o formar els seus \u201csuccessors\u201d, i reduir la c\u00e0rrega de treball
  gradualment i/o modificar les funcions (menys atenci\u00f3 directe, m\u00e9s formaci\u00f3
  de nous professionals).\\n\\nL''hospital, o sigui, la medicina hospitalaria i els
  serveis hospitalaris i els serveis docents, l''experi\u00e8ncia de la gent gran
  no la t\u00e9 en compte. O serveixes per tot o al carrer. Llavors es perd l''experi\u00e8ncia
  d''aquesta gent, que \u00e9s lo que deies tu: treballar menos a la medicina assistencial
  i treballar m\u00e9s el suport, experi\u00e8ncia que tu pots donar a les persones
  (GF1,21).\\n\\nLlavors, als hospitals, quan tu est\u00e0s com a cirurgi\u00e0 a
  un hospital, tant et consideren als 45 com als 65. I quin \u00e9s el fallo? Tu als
  65 anys com a cirurgi\u00e0, no rendir\u00e0s com als 45. No rendir\u00e0s. Per
  qu\u00e8? Perqu\u00e8 els anys et marquen. I els hospitals no consideren aix\u00f2.
  Vull dir, aquesta idea que s''ha de donar ara de que tu treballant en un hospital,
  la teva feina en aquell hospital es vagi adequant a les teves possibilitats a mida
  que l''edat avanci fins a arribar un moment que et jubilar\u00e0s... (GF1,21).\\n\\nEl
  paper de les organitzacions sanit\u00e0ries en la definici\u00f3 actual de la jubilaci\u00f3\\n\\n\u201cJo
  crec que aix\u00f2, fent opcionalment una reducci\u00f3 d''horari paulatina i una
  distribuci\u00f3 de funcions diferent. Clar! Menos assist\u00e8ncia directa per\u00f2
  en canvi m\u00e9s doc\u00e8ncia, m\u00e9s... (GF1,22).\\n\\n- Dissenyar f\u00f3rmules
  perqu\u00e8 el coneixement dels professionals experts no es perdi\\n\\nAdaptar de
  forma flexible i contextualitzada les organitzacions a les noves configuracions
  de les forces de treball, facilitant la continuaci\u00f3 de la vinculaci\u00f3 amb
  l''organitzaci\u00f3 (comit\u00e8s, comissions, etc.), la complementaci\u00f3 dels
  ingressos, el manteniment del sentiment de ser \u00fatil i el prestigi social.\\n\\n\u201cEl
  repte a nivell de cada una de les persones, perqu\u00e8 hem d''intentar aprofitar
  aquest capital. El repte no \u00e9s entretenir-los, sin\u00f3 intentar que aquest
  capital que durant molts anys s''ha adquirit durant molts anys, no es dilueixi.
  Aix\u00f2 \u00e9s una il\u00b7lustrina perqu\u00e8 estem enviant a casa, gent que
  t\u00e9 unes compet\u00e8ncies i uns coneixements fruit d''una llarga experi\u00e8ncia,
  i s''han de buscar f\u00f3rmules, s''han de trobar sistemes perqu\u00e8 aquest capital
  reverteixi en la societat a trav\u00e9s d''unes organitzacions que hi bagi, per\u00f2
  que no es perdi, que no quedi all\u00e0, i despr\u00e9s, a m\u00e9s a m\u00e9s,
  buscar una sortida individual per a aquestes persones (ES1,4).\\n\\n\u201cLa necessitat
  de continuar a les organitzacions o al sistema on hi ha estat aquest professional.
  El tema \u00e9s tenir f\u00f3rmules, no es troben f\u00f3rmules per recuperar-los,
  rescatar-los o incorporar-los... (Que) contin\u00fain incorporats a comit\u00e8s,
  comissions, de l''organitzaci\u00f3 i se''l''s reconeix el seu prestigi i la seva
  autoritat (...) Creu, que aquest \u00e9s un factor que els ajuda i la veritat \u00e9s
  que en les experi\u00e8ncies que tenim hi participen molt i continuen vinculats
  amb aquest entorn professional. Penso que \u00e9s una de les poques coses que en
  aquest moment podem fer des dels mitjans que tenim comptables, no? (ES1,3).\\n\\nCap\u00edtol
  4\\nNecessitats i l\u00ednies d\u2019acci\u00f3 rellevants\\n\\n4.1. Tipus de necessitats\\ndels
  metges relacionades amb la jubilaci\u00f3\\n\\nPer donar resposta a aquesta q\u00fcesti\u00f3
  que constitueix el punt de partida d\u2019aquest estudi, utilitzarem la terminologia
  proposada per Bradshaw en la seva classificaci\u00f3 dels diferents tipus de necessitats
  que es poden definir.\\n\\n**Necessitats normatives:** definides pels experts en
  base a les seves expectatives sobre el nivell de resultats i recursos considerats
  adequats.\\n\\nLes necessitats definides pels experts i conegudes pel propi col\u00b7lectiu
  es poden llegir en el cap\u00edtol anterior, en l\u2019apartat 3.3.\\n\\nNom\u00e9s,
  doncs, destacar aqu\u00ed que aquestes \u00e0mplies necessitats normatives no s\u00f3n
  percebudes pel col\u00b7lectiu de metges en el seu conjunt com a necessitats principals
  i que no estan en l\u2019agenda dels planificadors de l\u2019administraci\u00f3
  ni del gestors de les organitzacions m\u00e9s que en casos excepcionals.\\n\\n**Necessitats
  percebudes:** sentides pel col\u00b7lectiu a partir de les seves expectatives respecte
  del seu proc\u00e9s de jubilaci\u00f3.\\n\\nEn el cas dels metges se centren en:\\n\\n-
  L\u2019estabilitat econ\u00f2mica.\\n- El respecte dels companys de treball i l\u2019organitzaci\u00f3.\\n-
  L\u2019agra\u00efment/reconeixement de l\u2019organitzaci\u00f3.\\n- La flexibilitat
  i possibilitat de gradualitat en el proc\u00e9s.\\n- L\u2019ofertiment d\u2019activitats
  interessants i espec\u00edfiques.\\n\\n\u00c9s cabdal tenir en compte que aquestes
  necessitats percebudes depenen molt de la informaci\u00f3 i la consci\u00e8ncia
  que tingui el col\u00b7lectiu dels seus problemes aix\u00ed com de les possibilitats
  i recursos que se li ofereixen. I en aquest estudi s\u2019ha mostrat com hi ha una
  dificultat generalitzada en aquest col\u00b7lectiu per manifestar mancances i per
  fer demandes, la qual cosa explica la baixa definici\u00f3 dels problemes i dificultats
  implicits en l\u2019etapa de la jubilaci\u00f3.\\n\\n**Necessitats expressades:**
  se sustenten sobre les expectatives dels resultats obtinguts de l\u2019an\u00e0lisi
  del comportament del col\u00b7lectiu. Aquestes expectatives poden manifestar-se
  a trav\u00e9s de taxes d\u2019utilitzaci\u00f3 de serveis, recursos, etc.\\n\\nNo
  disposem d\u2019informaci\u00f3 donat que no sabem quants metges demanen ajuda professional
  per simptomatologia derivada de l\u2019experi\u00e8ncia d\u2019aquesta etapa, ni
  del consum de psicof\u00e0rmacs, ni de l\u2019assist\u00e8ncia a activitats d\u2019oci
  espec\u00edfiques, ni de demandes d\u2019assessorament sobre plans de pensions,
  etc.\\n\\n**Necessitats comparatives:** les expectatives en aquest cas se centren
  en la comparaci\u00f3 entre les dades disponibles sobre el col\u00b7lectiu de metges
  i les d\u2019altres grups de professionals. Si les corresponents als metges mostren,
  per exemple, que tenen menys recursos o els utilitzen menys, es podr\u00e0 dir que
  hi ha un problema o una situaci\u00f3 de desatenci\u00f3.\\n\\nComparant amb d\u2019altres
  col\u00b7lectius amb perfils professionals no equivalents (professionals amb retribucions
  salarials de franja baixa i/o activitats perilloses o de gran esfor\u00e7 f\u00edsic,
  amb gran pres\u00e8ncia d\u2019organitzacions sindicals en els llocs de treball),
  els metges es troben amb menys recursos col\u00b7lectius per l\u2019anticipaci\u00f3,
  la preparaci\u00f3 i la planificaci\u00f3 de la jubilaci\u00f3, per\u00f2 al mateix
  temps disposen de m\u00e9s recursos personals i socials per a l\u2019afrontament.\\n\\nComparant
  amb d\u2019altres col\u00b7lectius amb perfils professionals equivalents podem dir
  que: a nivell nacional, el col\u00b7lectiu de professionals de la medicina es troba
  en una situaci\u00f3 d\u2019igualtat; a nivell internacional, prenent com a refer\u00e8ncia
  pa\u00efsos com Gran Bretanya, Holanda o Dinamarca, la situaci\u00f3 \u00e9s m\u00e9s
  desfavorable donada la poca tradici\u00f3 de planificaci\u00f3 de la jubilaci\u00f3
  en el nostre pa\u00eds.\\n\\n4.2. Difer\u00e8ncies en les accions que s\u2019han
  de prendre segons la perspectiva d\u2019an\u00e0lisi\\n\\nModel de discrep\u00e0ncies:
  incideix en les expectatives normatives i en l\u2019an\u00e0lisi de les discrep\u00e0ncies
  entre el que hi ha i el que hi hauria d\u2019haver.\\n\\nSeguint aquesta perspectiva
  per l\u2019an\u00e0lisi de necessitats podem afirmar, clarament, que hi ha una alta
  discrep\u00e0ncia entre les accions que es fan actualment per donar suport al col\u00b7lectiu
  respecte de la jubilaci\u00f3 i les que es podrien estar portant a terme. I aix\u00f2
  \u00e9s aix\u00ed, principalment, perqu\u00e8 no hi ha demandes expl\u00edcites
  i perqu\u00e8 tampoc hi ha ofertes espec\u00edfiques. En l\u2019actualitat, nom\u00e9s
  el Col\u00b7legi Oficial de Metges t\u00e9 definida alguna activitat, i aquesta
  \u00e9s concreta gaireb\u00e9 de manera exclusiva en oferir activitats d\u2019oci
  i culturals espec\u00edfiques.\\n\\nPrentent aquest model com a refer\u00e8ncia
  es pot afirmar que estan per desenvolupar tot el cat\u00e0leg d\u2019accions conegudes
  i dissenyades amb car\u00e0cter general pels experts en l\u2019\u00e0mbit de la
  jubilaci\u00f3, per tal de millorar l\u2019afrontament d\u2019aquesta etapa tamb\u00e9
  en els metges.\\n\\nEl que caldria preguntar-se \u00e9s si fer aix\u00f2 resultaria
  pertinent actualment pel col\u00b7lectiu de metges, i considerat rellevant en el
  context.\\n\\nModel del m\u00e0rqueting: se centra en les necessitats i desitjos
  del col\u00b7lectiu per satisfer-los a trav\u00e9s del disseny, la comunicaci\u00f3
  i la prestaci\u00f3 dels serveis apropiats.\\n\\nDes d\u2019aquesta perspectiva
  resulta gaireb\u00e9 impossible pensar en accions que s\u2019han de desenvolupar
  donat que, com ja hem dit en diferents ocasions, el col\u00b7lectiu de metges no
  expressa expl\u00edcitament el desig que \u201calg\u00fa\u201d faci alguna cosa
  per donar-li suport en aquesta etapa, ja que consideren que \u00e9s una q\u00fcesti\u00f3
  que cadasc\u00fa ha de gestionar a nivell individual.\\n\\nPodem dir que de manera
  expl\u00edcita nom\u00e9s demanen: respecte i bones pensions. Tamb\u00e9 es podria
  dir que demanen just\u00edcia davant de la indefensi\u00f3 que senten per la manera
  d\u2019executar els \u00faltims canvis relatius a l\u2019anticipaci\u00f3 de l\u2019edat
  de jubilaci\u00f3.\\n\\nPrentent aquest model com a refer\u00e8ncia es pot afirmar
  que, donat que gaireb\u00e9 no hi ha demanda, no cal posar en marxa m\u00e9s accions
  que les dirigides a satisfer les necessitats percebudes descriptes anteriorment.
  I seguint aquesta l\u00f2gica no es posaria en marxa cap acci\u00f3 orientada a
  la facilitaci\u00f3 d\u2019informaci\u00f3 i assessorament per fer front als canvis
  o per construir un nou projecte vital (ja que no s\u00f3n demandades), etc.\\n\\nLa
  pregunta seria llavors, si s\u00f3n les accions (o els serveis) demanades les que
  resulten eficaces per resoldre els problemes i per satisfer les necessitats reals
  del col\u00b7lectiu o podem pensar que satisfer desitjos no \u00e9s el mateix que
  donar eines per resoldre les necessitats de fons.\\n\\nSeguir el model del m\u00e0rqueting
  en l\u2019an\u00e0lisi de necessitats sempre \u00e9s rentable per a l\u2019entitat
  que promou les accions (ja que es limita a donar el que es demana) per\u00f2 tamb\u00e9
  sabem que molt sovint no \u00e9s efica\u00e7 ni resulta significatiu en termes de
  millora.\\n\\nModel de la presa de decisions a partir dels valors: s\u2019interessa
  per fer expl\u00edcits els valors i el paper que juguen en l\u2019an\u00e0lisi de
  necessitats.\\n\\nDes d\u2019aquesta perspectiva i a la vista dels resultats mostrats,
  interpretem que hi ha dos valors \u00e0mpliament compartits en el col\u00b7lectiu
  de metges i profundament arrelats en la cultura de les organitzacions sanit\u00e0ries,
  que adquireixen en el seu proc\u00e9s de socialitzaci\u00f3, i que s\u00f3n principals
  per analitzar les necessitats relatives a l\u2019etapa de la jubilaci\u00f3:\\n\\n-
  Apar\u00e8ixer davant de s\u00ed mateixos i de la societat com a invulnerables o
  com a professionals/persones amb prou recursos per fer front a qualsevol dolor/dificultat
  necessitant, el menys possible, els recursos de l\u2019entorn (hum\u00e0 i organitzacional).\\n\\n-
  Ser considerats com a diferents d\u2019altres professionals i tractats com a *metges
  per sempre m\u00e9s* i reconeguts com a individus que han fet un b\u00e9 pels altres.
  D\u2019aquesta manera s\u2019aconseguiria la continu\u00eftat biogr\u00e0fica no
  nom\u00e9s en la seva identitat sin\u00f3 tamb\u00e9 en el seu estatus.\\n\\nAquests
  dos valors dificulten, clarament, percebre i sentir necessitat de preparar la jubilaci\u00f3,
  anticipar els seus punts de dificultat o participar en activitats considerades caracter\u00edstiques
  de la categoria \u201cjubilats\u201d.\\n\\nSeguir el model d\u2019an\u00e0lisi centrat
  en els valors \u00e9s l\u2019opci\u00f3 que es mostra consistent amb la posici\u00f3
  te\u00f2rica i metodol\u00f2gica que sost\u00e9n aquest estudi.\\n\\n\u00c9s en
  aquest sentit que considerem que les accions que s\u2019han de prendre han d\u2019estar
  centrades, de partida, en \u201cdesnaturalitzar\u201d en el col\u00b7lectiu i en
  les organitzacions aquesta idea central que la jubilaci\u00f3 \u00e9s nom\u00e9s
  una realitat normativa a la que s\u2019ha de fer front exclusivament amb els recursos
  individuals de cada professional i que es donar\u00e0 \u201cnaturalment\u201d la
  desitjada continu\u00eftat en la identitat personal i social.\\n\\n4.3. Reptes,
  objectius i accions significatives\\n\\nA continuaci\u00f3, presentem un quadre
  en el que es perfilen algunes de les accions concretes que es poden promoure per
  part dels diferents actors implicats, organitzades en relaci\u00f3 als reptes que
  les fan necess\u00e0ries. Aquestes dificultats i propostes d\u2019iniciativa s\u2019han
  mostrat rellevants, pertinents i significatives en els resultats d\u2019aquest estudi.\\n\\n|
  Dificultats | Reptes i objectius | Accions |\\n|-------------|-------------------|--------|\\n|
  La connotaci\u00f3 negativa de la jubilaci\u00f3, amb formes d\u2019aproximaci\u00f3
  a la jubilaci\u00f3 basades en la r\u00e0bia/ira i la negaci\u00f3. | Tenir ocasi\u00f3
  de preparar-se i con\u00e8ixer la jubilaci\u00f3 com a una oportunitat i un dret
  i no com a una obligaci\u00f3. | Oferir assessorament amb suport informatiu, avaluatiu
  i socioemocional en l\u2019esfera econ\u00f2mica, sociofamiliar, formativa, cultural
  i d\u2019esbarjo. |\\n| La dificultat de definir demandes i/o accions. | Crear contextos
  col\u00b7lectius i estrat\u00e8gies eficaces per tornar a dotar de significat la
  jubilaci\u00f3 ja que \u00e9s una q\u00fcesti\u00f3 que implica a tot el col\u00b7lectiu
  professional. | Promoure el debat entorn a la jubilaci\u00f3 entre els professionals.
  Sensibilitzar de la import\u00e0ncia de la preparaci\u00f3 a la jubilaci\u00f3.
  |\\n| L\u2019alta centralitat de l\u2019esfera laboral en la vida quotidiana. |
  Fer front al buit que deixa l\u2019exercici d\u2019una activitat molt vocacional,
  amb la que es defineix la identitat personal, es refor\u00e7a l\u2019autosestima
  i a la que es dedica gran quantitat de temps. | Informar/fer possible la pr\u00e0ctica
  de hobbies i/o aficions, esports, etc. Informar sobre activitats de voluntariat
  a ONG i/o fundacions. |\\n| El trencament o la discontinu\u00eftat en el projecte
  vital que s\u2019ha tingut. | Reconstructur un projecte vital que sigui v\u00e0lid
  pels propers anys, que mantingui la continuitat vital i que resulti raonablement
  satisfactori. | Oferir assessorament i preparaci\u00f3 a la jubilaci\u00f3. |\\n|
  | Recuperar o crear nous objectius/activitats/interessos que durant l\u2019etapa
  anterior no es va tenir temps de desenvolupar. | Realitzar activitats significatives
  i/o satisfactories que ara es poden fer perqu\u00e8 es disposa de temps. |\\n| L\u2019arribada
  relativament sobtada d\u2019uns canvis que necessiten d\u2019un temps per l\u2019adaptaci\u00f3.
  | Acomodar la jubilaci\u00f3 al rellotge del \u201ccicle vital esperat\u201d. Flexibilitzar
  el processos de jubilaci\u00f3. | Tenir la possibilitat d\u2019anar deixant gradualment
  la dedicaci\u00f3 laboral. Mantenir la pr\u00e0ctica privada. |\\n\\n| La revaloritzaci\u00f3
  de l\u2019entorn familiar i la vida quotidiana. | Renegociar les din\u00e0miques
  i posicions familiars, relacions de parella i relacions intergeneracionals. | Oferir
  assessorament. |\\n|----------------------------------------------------------|-------------------------------------------------------------------------------------------------|---------------------|\\n|
  Els canvis de l\u2019estatus social i del lloc ocupat a la societat. | Redefinir
  el lloc ocupat a la societat i a les relacions interpersonals. | Possibilitar la
  vinculaci\u00f3 a activitats significatives que tinguin un alt prestigi social.
  Creaci\u00f3 d\u2019espais professionals o socioprofessionals d\u2019assessorament
  i expertesa. |\\n| La dr\u00e0stica disminuci\u00f3 dels ingressos. | Planificar
  amb antelaci\u00f3 suficient la situaci\u00f3 econ\u00f2mica iniciant alguna f\u00f3rmula
  privada que asseguri un bon nivell adquisitiu a partir de la jubilaci\u00f3. Mantenir
  un estil de vida relativament/raonablement equivalent a l\u2019habitual. | Millorar
  l\u2019oferta del plans de pensions privats. Oferir assessorament en sistemes privats
  per completar les pensions. |\\n| La manca de reconeixement a la diversitat en el
  proc\u00e9s de la jubilaci\u00f3. | Incrementar la individualitzaci\u00f3 i la flexibilitat
  en la transici\u00f3 a la jubilaci\u00f3. | Promoure i deixar fluir les propostes
  d\u2019associacions/organitzacions professionals. Potenciar l\u2019atenci\u00f3
  a les situacions generades pels canvis legislatius. |\\n| La sobrevaloraci\u00f3
  dels criteris econ\u00f2mics en la gesti\u00f3 de les organitzacions. | Dissenyar
  f\u00f3rmules per no perdre un capital hum\u00e0 que \u00e9s un b\u00e9 social.
  Definir en les organitzacions una pol\u00edtica activa de recursos humans orientada
  als treballadors veterans. | Possibilitar la participaci\u00f3 en comit\u00e8s,
  comissions, etc. Possibilitar l\u2019acc\u00e9s a programes de preparaci\u00f3 a
  la jubilaci\u00f3. Redefinir funcions i horaris en relaci\u00f3 a l\u2019edat del
  treballador. |\\n| La p\u00e8rdua de valor progressiu del coneixement expert. |
  Redefinir el lloc/rol ocupat pels professionals veterans en les organitzacions.
