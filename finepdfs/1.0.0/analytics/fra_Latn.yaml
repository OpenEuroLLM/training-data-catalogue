  24\\n\\nLa m\u00e9thodologie\\n\\nM\u00e9thodologie\\n\\nCe document pr\u00e9sente
  les r\u00e9sultats d''une \u00e9tude r\u00e9alis\u00e9e par l''Ifop. Elle respecte
  fid\u00e8lement les principes scientifiques et d\u00e9ontologiques de l''enqu\u00eate
  par sondage. Les enseignements qu''elle indique refl\u00e8tent un \u00e9tat de l''opinion
  \u00e0 l''instant de sa r\u00e9alisation et non pas une pr\u00e9diction.\\n\\nAucune
  publication totale ou partielle ne peut \u00eatre faite sans l''accord expr\u00e8s
  de l''Ifop.\\n\\nEtude r\u00e9alis\u00e9e par l''Ifop pour SOS \u00c9ducation\\n\\n**\u00c9chantillon**\\n\\nL''enqu\u00eate
  a \u00e9t\u00e9 men\u00e9e aupr\u00e8s d''un \u00e9chantillon de 1009 personnes,
  repr\u00e9sentatif de la population fran\u00e7aise \u00e2g\u00e9e de 18 ans et plus.\\n\\n**M\u00e9thodologie**\\n\\nLa
  repr\u00e9sentativit\u00e9 de l''\u00e9chantillon a \u00e9t\u00e9 assur\u00e9e par
  la m\u00e9thode des quotas (sexe, \u00e2ge, profession de la personne interrog\u00e9e)
  apr\u00e8s stratification par r\u00e9gion et cat\u00e9gorie d''agglom\u00e9ration.\\n\\n**Mode
  de recueil**\\n\\nLes interviews ont \u00e9t\u00e9 r\u00e9alis\u00e9es par questionnaire
  auto-administr\u00e9 en ligne du 7 au 9 octobre 2015.\\n\\nRetrouvez gracieusement
  les sondages et analyses publi\u00e9s de l''Ifop sur :\\n\\n- Nos applications mobiles\\n-
  Notre site Internet\\n- Les r\u00e9seaux sociaux\\n\\nAndroid  iPhone / iPad  www.ifop.com  @IfopOpinion  Ifop
  Opinion\\n\\nLa th\u00e9orie statistique permet de mesurer l\u2019incertitude \u00e0
  attacher \u00e0 chaque r\u00e9sultat d\u2019une enqu\u00eate. Cette incertitude
  s\u2019exprime par un intervalle de confiance situ\u00e9 de part et d\u2019autre
  de la valeur observ\u00e9e et dans lequel la vraie valeur a une probabilit\u00e9
  d\u00e9termin\u00e9e de se trouver. Cette incertitude, commun\u00e9ment appel\u00e9e
  \u00ab marge d\u2019erreur \u00bb, varie en fonction de la taille de l\u2019\u00e9chantillon
  et du pourcentage observ\u00e9 comme le montre le tableau ci-dessous :\\n\\n###
