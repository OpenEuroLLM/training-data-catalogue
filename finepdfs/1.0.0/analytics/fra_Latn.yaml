sample: '["\"Applaudi plus de 500 fois en France, Alain Choquette rentre au bercail
  avec *Dr\u00f4lement magique*. Enfin. Le magicien s''y r\u00e9v\u00e8le en meilleure
  forme que jamais, mais surtout franchement hilarant et arm\u00e9 d''un charisme
  \u00e0 toute \u00e9preuve.\\n\\nIl y a longtemps qu''Alain Choquette ne s''\u00e9tait
  produit sur les sc\u00e8nes du Qu\u00e9bec. Mais force est de constater que le public
  montr\u00e9alais ne l''a pas oubli\u00e9 pour autant ; quelques minutes ont suffi,
  mercredi soir, pour constater que la complicit\u00e9 entre le magicien et ses fans
  est demeur\u00e9e intacte.\\n\\nAccueilli en v\u00e9ritable star sur la sc\u00e8ne
  du Th\u00e9\u00e2tre St-Denis, Alain Choquette nous est apparu comme un homme nouveau.
  De m\u00e9moire, le magicien n''a jamais \u00e9t\u00e9 aussi \u00e0 l''aise sur
  sc\u00e8ne, ni aussi dr\u00f4le et, avouons-le, divertissant.\\n\\n\u00c0 ce chapitre,
  le spectacle *Dr\u00f4lement magique* porte tr\u00e8s bien son nom. L''humour prend
  davantage de place que la magie qui devient, \u00e0 certains moments, secondaire
  ou, du moins, accessoire. La magie sert donc plusieurs gags, et non le contraire.
  Et c''est loin d''\u00eatre une mauvaise id\u00e9e.\\n\\nAlors, la magie dans tout
  \u00e7a ? Classique, certes, mais impressionnante. Alain Choquette nous a soutir\u00e9
  de nombreuses onomatop\u00e9es, et encore plus de regards incr\u00e9dules au fil
  du spectacle de 90 minutes bien tass\u00e9es. Et on sait d''ores et d\u00e9j\u00e0
  qu''on se demandera encore plusieurs jours durant comment il a fait pour nous bernner
  de la sorte. Il a beau ne pas r\u00e9inventer son art, mais il l''ex\u00e9cute avec
  brio.\\n\\nMais la force d''Alain Choquette, outre la magie, r\u00e9side v\u00e9ritablement
  dans sa personnalit\u00e9. Ses interactions avec le public, ses moments d''improvisation,
  mais surtout sa spontan\u00e9it\u00e9 ont donn\u00e9 lieu \u00e0 des moments absolument
  savoureux. Avec un charisme aussi fort que le sien, on comprend pourquoi les Fran\u00e7ais
  sont tomb\u00e9s sous son charme. Esp\u00e9rons seulement qu''il passe plus de temps
  aupr\u00e8s de ses fans qu\u00e9b\u00e9cois dans les prochaines ann\u00e9es.\\n\\n\u25b6
  Alain Choquette remontera sur la sc\u00e8ne du Th\u00e9\u00e2tre St-Denis vendredi
  et samedi soir. Il sera \u00e9galement en spectacle au Capitole de Qu\u00e9bec les
  17 et 18 octobre.\"", "\"R\u00e9forme de la voie pro :\\n\\nMacron d\u00e9truit
  le lyc\u00e9e professionnel !\\n\\nLes personnels s''\u00e9taient mobilis\u00e9s
  \u00e0 l''automne contre la mise \u00e0 sac de l''enseignement professionnel. Macron
  revient \u00e0 la charge au mois de mai avec des annonces d\u00e9sastreuses pour
  l''enseignement professionnel et pour les conditions de travail des PLP.\\n\\nDans
  les lyc\u00e9es professionnels devenus Lyc\u00e9es des M\u00e9tiers, les discours
  d''entreprise ont pris une place centrale. Pour le gouvernement, l''enseignement
  professionnel doit \u00eatre subordonn\u00e9 aux besoins des entreprises pour pallier
  les difficult\u00e9s des entreprises \u00e0 recruter dans certaines fili\u00e8res
  aux emplois les plus pr\u00e9caires ou les plus p\u00e9nibles.\\n\\nAlors que 70%
  des \u00e9l\u00e8ves de lyc\u00e9e professionnel sont issus de milieux populaires,
  le gouvernement entend imposer l''employabilit\u00e9 \u00e0 court terme comme objectif
  unique de l''enseignement professionnel au d\u00e9triment d''une formation de qualit\u00e9.\\n\\nCette
  r\u00e9forme est brutale, le gouvernement entend l''imposer contre les personnels,
  sans concertation !\\n\\nPACTE\\nFermeture\\nde fili\u00e8res\\nLP\\n\\nGratification
  des p\u00e9riodes de stage des \u00e9l\u00e8ves : sous payer les \u00e9l\u00e8ves
  plut\u00f4t que de combattre la pr\u00e9carit\u00e9 !\\n\\nPlut\u00f4t que de prendre
  de v\u00e9ritables mesures contre l''inflation, contre la pauvret\u00e9 et pour
  l''autonomie de la jeunesse, il choisit de sous-payer les \u00e9l\u00e8ves en stage
  avec des indemnit\u00e9s allant de 1,4 \u20ac de l''heure pour les \u00e9l\u00e8ves
  de seconde professionnelle \u00e0 2,8 \u20ac de l''heure en terminale.\\n\\nUn grand
  plan social dans les LP !\\n\\nLe gouvernement annonce brutalement la fermeture
  de 80 fili\u00e8res \u00e0 la rentr\u00e9e. Au comble du m\u00e9pris, le Ministre
  de l''\u00c9ducation nationale a d\u00e9clar\u00e9 que les enseignant\u00b7es des
  fili\u00e8res concern\u00e9es pourraient \u00eatre r\u00e9orient\u00e9\u00b7es en
  \u00e9cole et au coll\u00e8ge ou rejoindre les \\\"bureaux des entreprises\\\" pour
  aider les \u00e9l\u00e8ves \u00e0 trouver des stages. Quel m\u00e9pris pour nos
  m\u00e9tiers et pour nos comp\u00e9tences !\\n\\nR\u00e9organisation de l''ann\u00e9e
  de terminale bac pro !\\n\\nLes \u00e9l\u00e8ves de terminale bac pro choisiront
  en fin de terminale :\\n\\n* soit des \\\"cours intensifs\\\" pour pr\u00e9parer
  la poursuite d''\u00e9tudes.\\n* soit 4 \u00e0 6 semaines de stage en entreprise,\\n\\nMOBILISONS
  nous pour les LYC\u00c9ES PRO\\n\\nLes personnels devront accompagner les \u00e9l\u00e8ves
  dans le cadre du Pacte, on peut craindre de grandes in\u00e9galit\u00e9s selon les
  lyc\u00e9es dans la mise en oeuvre de ces deux parcours.\\n\\nLe pacte : une attaque
  sans pr\u00e9c\u00e9dent contre nos statuts !\\n\\nC''est une orientation forc\u00e9e
  d\u00e9guis\u00e9e car ce sont les \u00e9l\u00e8ves les plus pauvres qui seront
  attir\u00e9\u00b7es par les semaines de stage suppl\u00e9mentaires et la promesse
  d''une r\u00e9mun\u00e9ration au d\u00e9triment de la poursuite d''\u00e9tudes.\\n\\nLes
  personnels des LP d\u00e9noncent le gel et la sous indexation du point d''indice
  : nos salaires n''augmentent pas autant que l''inflation. La revalorisation annonc\u00e9e
  sera moins \u00e9lev\u00e9e que pr\u00e9vu (+5,5% en moyenne) et sera vite rattrap\u00e9e
  par l''inflation. C''est dans ce contexte que le gouvernement entend nous imposer
  la logique du travailler plus pour gagner plus avec le Pacte ! Conscient de l''impopularit\u00e9
  de la r\u00e9forme des lyc\u00e9es professionnels, le gouvernement promet un \\\"Pacte
  sp\u00e9cial LP\\\" \u00e0 7500 euros par an, ins\u00e9cable, pour forcer les personnels
  \u00e0 mettre en place la r\u00e9forme. Le Pacte est sur la base du volontariat,
  il ne peut \u00eatre impos\u00e9.\\n\\nQuelles sont les missions du Pacte?\\n\\n*
  Le remplacement de courte dur\u00e9e : 18h par an,\\n* Accompagnement des \u00e9l\u00e8ves
  en difficult\u00e9,\\n* Intervention dans le cadre d\u00e9couverte des m\u00e9tiers
  dans les coll\u00e9ges : 24h par an,\\n* Enseignement et accompagnement dans les
  p\u00e9riodes post bac professionnel : 24h par an,\\n* Coordination et prise en
  charge des projets d''innovation p\u00e9dagogique dans le cadre de la r\u00e9forme
  avec la mise en place d''options.\\n* Enseignement compl\u00e9mentaire en groupes
  d''effectifs r\u00e9duits dans les savoirs fondamentaux (fran\u00e7ais-maths) :
  24h par an,\\n* Accompagnement des \u00e9l\u00e8ves \u00e0 besoins particuliers,\\n*
  Accompagnement vers l''emploi,\\n\\nSi on fait le calcul, c''est \u00e0 minima 90
  heures annualis\u00e9es que devront les signataires du Pacte, en plus des 2 heures
  suppl\u00e9mentaires qui sont d\u00e9j\u00e0 trop souvent impos\u00e9es dans les
  services des PLP.\\n\\nSUD \u00e9ducation appelle les personnels \u00e0 :\\n\\n*
  se r\u00e9unir dans les LP pour \u00e9changer sur ce projet de r\u00e9forme et envisager
  ensemble les moyens pour l''emp\u00eacher,\\n* se r\u00e9unir en AG dans les villes
  et les d\u00e9partements pour construire la gr\u00e8ve,\\n* se mobiliser le 31 mai
  contre le Pacte et la r\u00e9forme de la Voie Pro,\\n* se saisir de la gr\u00e8ve
  contre la r\u00e9forme des retraites du 6 juin pour mener des actions pour visibiliser
  la lutte des lyc\u00e9es pro !\"", "\"Historische luswandeling door Wemmel\\nBoucle
  historique \u00e0 travers Wemmel\\n\\nnl Ga links (gezicht naar het kasteel) langs
  het kasteel het park in. Hou aan de uitgang van de Maalbeeklaan links het wandelpad
  aan. Kruis de Steenweg op Merchtem en Markt tot aan het beeld van Victor Guti\u00e9rrez
  (een Mexicaans kunstenaar). Volg de wandelweg evenwijdig aan de J. Vanden Broeckstraat.
  Steek aan caf\u00e9 Famex de straat (Dries) over richting Beverbos. Ga in Beverbos
  links naar villa Beverbos en het oude park. Neem de uitgang aan de Haagdoornlaan
  en hou links aan tot de Parklaan. Kruis de Parklaan en volg de Torentjeslaan tot
  aan de Populierendreef. Volg de Populierendreef. Ga aan Dries naar rechts tot aan
  de restanten van het IJzeren Kasteel. Keer terug en ga rechts in de J. Verhasseltstraat.
  Volg deze tot het Glazenhuis (Steenweg op Merchtem) en verderop de Sint-Servaaskerk.
  Ga daar links naar de Dr. H. Folletlaan. Passeer daar de Laermansmuur en de gemeentelijke
  muziekacademie, verder naar het kasteel.\\n\\nStraten: Dr. H. Folletlaan - Maalbeeklaan
  \u2013 Steenweg op Merchtem oversteken \u2013 Markt oversteken \u2013 evenwijdig
  aan J. Vanden Broeckstraat \u2013 Dries oversteken \u2013 Parklaan oversteken \u2013
  Beverbos \u2013 uitgang Haagdoornlaan \u2013 Parklaan oversteken \u2013 Torentjeslaan
  \u2013 Populierendreef \u2013 Dries \u2013 J. Verhasseltstraat \u2013 Steenweg op
  Merchtem rondpunt Glazenhuis \u2013 plein Sint Servaaskerk \u2013 Dr.H.Folletlaan\\n\\nAfstand:
  ongeveer 2,5 km\\n\\nBezienswaardigheden met documentatie: kasteel (gemeentehuis)
  \u2013 Banmolen, banbrouwerij en herberg De Kam \u2013 oude tramstation \u2013 Beverbos
  \u2013 Villa Beverbos \u2013 restanten IJzeren Kasteel \u2013 caf\u00e9 Glazen Huis
  \u2013 Sint Servaaskerk \u2013 caf\u00e9 Hooghuis \u2013 oude pastorij (muziekacademie)
  met Laermansmuur\\n\\nfr Faisant face \u00e0 la maison communale, nous entrons dans
  le parc par la gauche. A la sortie donnant dans l\u2019avenue du Maalbeek, nous
  suivons le sentier sur la gauche. Nous croisons la chauss\u00e9e de Merchtem et
  le Markt jusqu\u2019\u00e0 la statue de Victor Guti\u00e9rrez (un artiste mexicain).
  Nous poursuivons le sentier de promenade, dont le trac\u00e9 est parall\u00e8le
  \u00e0 celui de la rue J. Vanden Broeck. \u00c0 hauteur du caf\u00e9 Famex, nous
  traversons la rue (Dries) en direction du Beverbos. Arriv\u00e9s au Beverbos, nous
  prenons \u00e0 gauche en direction de la Villa Beverbos et de l\u2019ancien parc.
  Nous sortons du parc \u00e0 hauteur de l\u2019avenue des Aub\u00e9pines et prenons
  \u00e0 gauche jusqu\u2019\u00e0 d\u00e9boucher sur l\u2019avenue du Parc, que nous
  traversons. Nous empruntons l\u2019avenue des Tourelles, que nous suivons jusqu\u2019\u00e0
  arriver \u00e0 gauche \u00e0 la dr\u00e8ve des Peupliers. Nous empruntons cette
  derni\u00e8re et une fois au Dries, nous poursuivons un instant sur la droite jusqu\u2019aux
  vestiges du Ch\u00e2teau de la Ferraille (\u201cIJzeren Kasteel\u201d). Nous revenons
  sur nos pas et prenons \u00e0 droite la rue J. Verhasselt, que nous suivons jusqu\u2019au
  caf\u00e9 Glazenhuis (chauss\u00e9e de Merchtem) et, plus loin, l\u2019\u00e9glise
  Saint-Servais. L\u00e0, nous prenons \u00e0 gauche l\u2019avenue Dr. H. Follet.
  Nous passons devant le mur Laermans et l\u2019acad\u00e9mie de musique, et revenons
  ainsi \u00e0 la maison communale.\\n\\nRues: avenue Dr. H. Follet \u2013 avenue
  du Maalbeek \u2013 traverser la chauss\u00e9e de Merchtem \u2013 traverser le Markt
  \u2013 sentier parall\u00e8le \u00e0 la rue J. Vanden Broeck \u2013 traverser le
  Dries \u2013 traverser l\u2019avenue du Parc \u2013 Beverbos \u2013 sortie avenue
  des Aub\u00e9pines \u2013 traverser l\u2019avenue du Parc \u2013 avenue des Tourelles
  \u2013 dr\u00e8ve des Peupliers \u2013 Dries \u2013 rue J. Verhasselt \u2013 chauss\u00e9e
  de Merchtem rond-point Glazenhuis \u2013 parvis de l\u2019\u00e9glise Saint-Servais
  \u2013 avenue Dr. H. Follet\\n\\nDistance: environ 2,5 km\\n\\nCuriosit\u00e9s avec
  documentation: Ch\u00e2teau (maison communale) \u2013 moulin (\u2018Banmolen\u2019),
  brasserie et auberge De Kam \u2013 ancienne station de tram \u2013 Beverbos \u2013
  Villa Beverbos \u2013 vestiges du Ch\u00e2teau de la Ferraille (\u201cIJzeren Kasteel\u201d)
  \u2013 caf\u00e9 Glazen Huis \u2013 \u00e9glise Saint-Servais \u2013 caf\u00e9 Hooghuis
  \u2013 ancien presbyt\u00e8re (acad\u00e9mie de musique) flanqu\u00e9 du mur Laermans\"",
  "\"Visseuse pour cloisons s\u00e8ches sans fil\\n\\nTE-DY 18 Li-Solo\\n\\nNum\u00e9ro
  article: 4259980\\n\\nNum\u00e9ro de s\u00e9rie: 11018\\n\\nCode EAN: 4006825635607\\n\\nLa
  visseuse pour cloisons s\u00e8ches sans fil Einhell TE-DY 18 Li-Solo fait partie
  de la gamme Power X-Change ; Elle est puissante et pr\u00e9cise. Son design compact
  et l\u00e9ger et ses surfaces de pr\u00e9hension ergonomiques \u00e0 rev\u00eatement
  tendre \u201eSoftgrip\\\" permettent une utilisation en continu et sans effort.
  Le coupleur de pression int\u00e9gr\u00e9 assure un vissage ais\u00e9. Utilisation
  sans fatigue gr\u00e2ce au fonctionnement en continu r\u00e9glable. Une lampe LED
  \u00e9claire les endroits sombres. Une but\u00e9e r\u00e9glable d\u00e9finit la
  profondeur exacte. Le changement d''embouts est rapide et facile gr\u00e2ce au porte-embouts
  magn\u00e9tique. Le clip de ceinture est pratique. L''outil est livr\u00e9 dans
  le coffret pratique et universel \u201eE-Box\\\". Batterie et chargeur sont disponibles
  s\u00e9par\u00e9ment.\\n\\nCaract\u00e9ristiques\\n\\n- Fait partie de la gamme
  Power X-Change\\n- R\u00e9glage pr\u00e9cis de la profondeur \u00e0 l''aide d''une
  but\u00e9e\\n- Travail sans fatigue gr\u00e2ce au fonctionnement en continu r\u00e9glable\\n-
  Vissage ais\u00e9 gr\u00e2ce au coupleur de pression int\u00e9gr\u00e9\\n- Design
  compact et l\u00e9ger avec des surfaces de pr\u00e9hension ergonomiques \u00e0 rev\u00eatement
  tendre \u201eSoftgrip\\\"\\n- Travail optimal dans les endroits sombres gr\u00e2ce
  \u00e0 l''\u00e9clairage LED\\n- Changement rapide et facile des embouts gr\u00e2ce
  au porte-embouts magn\u00e9tique\\n- Clip de ceinture pratique pour un rangement
  momentan\u00e9 en toute s\u00e9curit\u00e9 pendant les temps morts\\n- Livr\u00e9
  en coffret universel \u201eE-Box\\\"\\n\\nDonn\u00e9es techniques\\n\\n- Tension\\n\\n18
  V\\n\\n- R\u00e9gime\\n\\n0 - 4000 tr/min.\\n\\n- Porte-outils\\n\\nporte-embouts
  (6,35mm/\u00bc\\\")\\n\\nInformations logistiques\"", "\"Une mode en sant\u00e9\\n\\nCe
  d\u00e9pliant a \u00e9t\u00e9 r\u00e9alis\u00e9 par le R\u00e9seau qu\u00e9b\u00e9cois
  d\u2019action pour la sant\u00e9 des femmes (RQASF) dans le cadre de son projet
  Pour une mode en sant\u00e9. Le RQASF travaille sur la question de l\u2019image
  corporelle depuis plus d\u2019une dizaine d\u2019ann\u00e9es. Au fil des ans, il
  a \u00e9t\u00e9 en mesure de suivre l\u2019\u00e9volution de la probl\u00e9matique
  et de constater les r\u00e9percussions des normes de beaut\u00e9 sur la sant\u00e9
  des femmes et des jeunes filles.\\n\\nPourquoi s\u2019int\u00e9resser particuli\u00e8rement
  \u00e0 l\u2019univers de la mode? Parce qu\u2019il faut bien le reconna\u00eetre,
  la mode fa\u00e7onne la d\u00e9finition courante de la beaut\u00e9. Mais attention,
  c\u2019est l\u2019ensemble de l\u2019industrie de l\u2019image et des m\u00e9dias
  qui est concern\u00e9e. Au Qu\u00e9bec, l\u2019adoption de la Charte qu\u00e9b\u00e9coise
  pour une image corporelle saine et diversifi\u00e9e*, en 2009, marquait un premier
  pas qui a \u00e9t\u00e9 salu\u00e9 par le RQASF. Il s\u2019agit toutefois d\u2019une
  charte d\u2019adh\u00e9sion volontaire; il nous appartient donc collectivement de
  passer \u00e0 l\u2019action, les sp\u00e9cialistes de l\u2019image aussi bien que
  le public.\\n\\nMais qu\u2019est-ce qu\u2019une image corporelle saine et diversifi\u00e9e,
  au fait? Avec son guide d\u2019\u00e9valuation, le RQASF propose quelques balises
  pour nous aider \u00e0 prendre conscience des impacts des images que nous produisons,
  diffusons, ou regardons.\\n\\n* http://www.signeeenligne.com/fr/charte.php\\n\\nUne
  responsabilit\u00e9 individuelle et collective\\n\\nVous \u00eates de l\u2019univers
  de la mode ou de l\u2019image (designer, photographe, styliste, publicitaire, etc.)?
  Innovez, \u00e0 votre fa\u00e7on, pour que plus d\u2019hommes et de femmes repr\u00e9sentatives
  de la diversit\u00e9 de la population d\u00e9fient sur les passerelles et posent
  devant les objectifs des photographes. Osez, en privil\u00e9giant des sc\u00e9narios
  qui ne sont pas essentiellement bas\u00e9s sur la s\u00e9duction sexuelle et sur
  le culte de la jeunesse et de la minceur.\\n\\nConsommateurs, consommatrices\u2026
  fashionistes passionn\u00e9es mais conscientis\u00e9es, vous pouvez vous aussi vous
  faire entendre. Manifestez vos pr\u00e9f\u00e9rences par le biais de votre pouvoir
  d\u2019achat, et n\u2019h\u00e9sitez pas \u00e0 \u00e9crire aux entreprises dont
  les publicit\u00e9s vous d\u00e9plaisent. Vous voulez faire plus encore?\\n\\nD\u00e9couvrez
  de quelle fa\u00e7on c\u2019est possible : http://rqasf.qc.ca/information/image-corporelle\\n\\nGraziella
  Battista\\n\\nApr\u00e8s avoir tenu le restaurant Il Sole pendant plus de 10 ans,
  Graziella Battista m\u00e8ne d\u00e9sormais ses plats raffin\u00e9s dans un autre
  excellent restaurant montr\u00e9alais, baptis\u00e9 Graziella. Mais la c\u00e9l\u00e9brit\u00e9
  de cette chef et entrepreneure ne se limite pas \u00e0 la m\u00e9tropole qu\u00e9b\u00e9coise:
  elle publie ses recettes \u00e0 travers le monde et trouve place parmi les chefs
  italiens les plus en vue des cinquante derni\u00e8res ann\u00e9es, selon La Culi\u00e8re
  d\u2019argent, bible des gastronomes depuis plus d\u2019un demi-si\u00e8cle.\\n\\nFrance
  Geoffroy\\n\\nL\u2019accident tragique qui a suivi France Geoffroy a boulevers\u00e9
  sa vie, mais cette danseuse contemporaine professionnelle dit souvent que \u00abses
  roulettes l\u2019ont amen\u00e9e l\u00e0 o\u00f9 ses jambes l\u2019auraient s\u00fbrement
  abandonn\u00e9e\u00bb. Directrice artistique et g\u00e9n\u00e9rale de Corpuscula
  Danse, France Geoffroy est aussi enseignante, conf\u00e9renci\u00e8re et tr\u00e8s
  impliqu\u00e9e dans sa communaut\u00e9. Elle est entre autres porte-parole de la
  Fondation du Centre de R\u00e9adaptation Lucie-Bruneau et, en 2011, de l\u2019\u00e9v\u00e9nement
  de danse Corps-d\u2019style et du Colloque International sur la r\u00e9silience.\\n\\nMichelle
  Blanc\\n\\nConsultante, blogueuse, auteure et conf\u00e9renci\u00e8re en marketing
  et strat\u00e9gie Web, Michelle Blanc est une superwoman qui a pratiqu\u00e9 tous
  les m\u00e9tiers avant de se passionner pour l\u2019Internet et de devenir une gourou
  dans le domaine des m\u00e9dias sociaux. Mais sa plus grande r\u00e9ussite est sans
  doute d\u2019\u00eatre devenue Michelle, c\u2019est-\u00e0-dire elle-m\u00eame,
  apr\u00e8s avoir \u00e9t\u00e9 Michel pendant des ann\u00e9es. \u00abCompetence\u00bb,
  \u00abcourage\u00bb, \u00abhumour\u00bb, \u00abengag\u00e9e\u00bb, \u00abauthenticit\u00e9
  d\u00e9sarmante\u00bb... tous ceux et celles qui ont la chance de croiser cette
  grande dame talentueuse sous son vrai nom!\\n\\nAmina Gerba\\n\\nEntrepreneure d\u2019origine
  camerounaise, Amina Gerba est pr\u00e9sidente fondatrice d\u2019Afrique Expansion,
  entreprise qui fait la promotion de l\u2019Afrique et des produits africains au
  Canada, et du savoir-faire canadien en Afrique. Elle est aussi \u00e0 la t\u00eate
  des Laboratoires Karliks, et cofondatrice de la marque de beurre de karit\u00e9
  Karderm. En 2008, elle a \u00e9t\u00e9 class\u00e9e parmi les 25 femmes d\u2019influence
  du Qu\u00e9bec par le Journal Les Affaires.\\n\\nSinon, AGISSEZ!\"", "\"CONSEIL
  MUNICIPAL\\n\\nLe Conseil municipal est convoqu\u00e9 en s\u00e9ance publique ordinaire,\\n\\nMERCRIDI
  18 OCTOBRE 2023\\nEN MAIRIE \u00e0 20h00\\n\\nCarnet\\nPouvoirs\\nD\u00e9signation
