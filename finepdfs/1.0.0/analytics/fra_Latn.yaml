  MUNICIPALES\\n- AFFAIRES GENERALES \u2013 SOUTIEN POUR ACTE DE COURAGE\\n- FOR\u00caT
  - CONVENTION D\u2019UTILISATION D\u2019UNE PARCELLE COMMUNALE\\n- FOR\u00caT\u2013
  PROGRAMME DE COUPE 2024\\n\\nLe Maire\\nJulie NOVELLI\"", "\"OFFRE DE POSTE :\\n\\nResponsable
  Exp\u00e9rience Client H/F\\n\\nMadame, Monsieur\\n\\nA\u00efga Resort thermal de
  Ch\u00e2tel-Guyon recrute son Responsable Exp\u00e9rience Client en contrat \u00e0
  dur\u00e9e ind\u00e9termin\u00e9e.\\n\\nLe Resort thermal de Ch\u00e2tel-Guyon (www.aiga-resort.com)
  totalement neuf et ouvert en ao\u00fbt est constitu\u00e9 :\\n\\n* d''un \u00e9tablissement
  thermal conventionn\u00e9 & thermal premium,\\n* d''un spa thermal,\\n* d''un restaurant
  d''une capacit\u00e9 de 90 couverts et d''une terrasse,\\n* d''une r\u00e9sidence
  de tourisme de 90 clefs,\\n* de salles de r\u00e9union, d''une boutique, de salles
  d''activit\u00e9s physiques, de cabinets m\u00e9dicaux\u2026\\n\\nle Resort offre
  une large gamme de s\u00e9jours \u00e0 destination des patients, des clients et
  des touristes en individuel ou en groupe. L''accent strat\u00e9gique repose sur
  quatre axes majeurs :\\n\\n* la qualit\u00e9 de l''accueil et de la prise en charge
  de chaque client,\\n* une offre diversifi\u00e9e r\u00e9pondant \u00e0 tous les
  besoins possibles d''un client ou d''un curiste,\\n* la mise en avant et la capitalisation
  sur les propri\u00e9t\u00e9s th\u00e9rapeutiques exceptionnelles de l''eau min\u00e9rale
  de Ch\u00e2tel-Guyon, notamment dans la prise en charge des pathologies digestives
  et celles en rapport avec le microbiote intestinal.\\n* une offre de restauration
  de qualit\u00e9 gustative et nutritive, adapt\u00e9e aux principes de la micronutrition,
  compos\u00e9e de produits sains, naturels (voire bio) pr\u00e9par\u00e9s dans le
  respect de leurs atouts nutritifs (acides gras essentiels, vitamines, min\u00e9raux\u2026)
  et r\u00e9pondant \u00e0 4 principes fondamentaux : une cuisine Simple, Saine, Savoureuse
  et Sur-Mesure (Cuisine 4S).\\n\\nL''accent strat\u00e9gique de la soci\u00e9t\u00e9,
  en vue de garantir une croissance de l''activit\u00e9, repose sur la qualit\u00e9
  de l''accueil et de la prise en charge de chaque client. Une forte pr\u00e9sence
  aupr\u00e8s des clients et des \u00e9quipes est attendue sur ce poste et notamment
  :\\n\\n* Les jours de fortes arriv\u00e9es,\\n* Lors des accueils clients organis\u00e9s
  avec l''office de tourisme,\\n\\nP a g e  1 : 3\\n\\nPour des raisons pratiques,
  cette offre d''emploi n''est pas sexu\u00e9e dans sa r\u00e9daction mais ce poste
  est ouvert \u00e0 toute personne sans aucune discrimination, conform\u00e9ment aux
  dispositions du code du travail et \u00e0 la politique de l''entreprise d''\u00e9gale
  opportunit\u00e9.\\n\\n* Lors des \u00e9v\u00e8nements festifs dans la ville ou
  la participation du Resort aux salons professionnels dans le cadre de sa politique
  commerciale et marketing,\\n* Lors des \u00e9v\u00e8nements dans nos espaces de
  r\u00e9union et s\u00e9minaires.\\n\\n1. Descriptif de poste et principales missions\\n\\nEn
  tant que Responsable Exp\u00e9rience client, vous \u00eates principalement en charges
  des missions suivantes :\\n\\n1.1 Op\u00e9rationnel\\n\\n* Animer les services concourant
  \u00e0 l''accueil de la client\u00e8le sur l''ensemble des sites du Resort (accueil
  des thermes, accueil g\u00e9n\u00e9ral du Resort, exploitation de l''h\u00f4tel
  et des r\u00e9sidences et de leurs services\u2026),\\n* Travailler \u00e9troitement
  avec les responsables de la restauration et responsables de services du Resort,\\n*
  Informer fr\u00e9quemment chaque collaborateur du degr\u00e9 d''atteinte des objectifs
  (avec le cas \u00e9ch\u00e9ant intervention en soutien de chaque collaborateur pour
  assister \u00e0 la d\u00e9finition d''un discours ou argumentaire commercial, \u2026),\\n*
  D\u00e9cliner la politique commerciale et veiller \u00e0 la mise en \u0153uvre,\\n*
  Examiner et analyser quotidiennement le portefeuille clients (analyse des niveaux
  de r\u00e9servation, des comptes clients, suivi de la fid\u00e9lit\u00e9 et de l''historique
  client\u00e8le, \u00e9tablissement du rapport d''arriv\u00e9e de chaque jour, analyse
  des no-shows, des r\u00e9servations annul\u00e9es tardivement, \u2026\\n* Maitriser
  l''ensemble des proc\u00e9dures op\u00e9rationnelles et \u00eatre source de proposition
  d''am\u00e9lioration.\\n\\n1.2 Conformit\u00e9\\n\\n* Veiller au respect des proc\u00e9dures
  commerciales (grilles tarifaires et conditions commerciales, tenue des dossiers
  clients\u2026),\\n* Contr\u00f4ler la qualit\u00e9 du discours et de la relation
  commerciale pour garantir la qualit\u00e9 des services,\\n* Gestion des litiges
  clients avec l''appui de la direction du site, des services administratifs, des
  services transversaux du si\u00e8ge.\\n\\n1.3 Ressources humaines\\n\\n* Animer
  l''\u00e9quipe (participation au recrutement, coordination, planification et contr\u00f4le
  du travail de l''\u00e9quipe, validation des temps de travail, int\u00e9gration
  d''un nouveau collaborateur),\\n* Participer \u00e0 la d\u00e9finition d''une organisation
  cible dans une logique d''optimisation budg\u00e9taire et assurer sa mise en \u0153uvre,\\n*
  Participer \u00e0 la d\u00e9finition du plan de formation et accompagner son \u00e9quipe
  dans le d\u00e9veloppement de ses comp\u00e9tences par des actions de formation.\\n\\n2.
  Comp\u00e9tences requises\\n\\nNotre objectif d''offrir un service d''excellence
  \u00e0 nos clients requiert une v\u00e9ritable volont\u00e9 d''engagement de votre
  part et un attrait certain pour l''univers thermal et touristique d''un Resort.\\n\\nP
  a g e  2 : 3\\n\\nPour des raisons pratiques, cette offre d''emploi n''est pas sexu\u00e9e
  dans sa r\u00e9daction mais ce poste est ouvert \u00e0 toute personne sans aucune
  discrimination, conform\u00e9ment aux dispositions du code du travail et \u00e0
  la politique de l''entreprise d''\u00e9gale opportunit\u00e9.\\n\\nSur la base de
  votre exp\u00e9rience professionnelle, vous avez d\u00e9velopp\u00e9 des comp\u00e9tences
  pratiques pour ce poste :\\n\\n* Une autonomie et une r\u00e9activit\u00e9 imm\u00e9diate
  dans une logique de satisfaction de la client\u00e8le,\\n* Une capacit\u00e9 d''organisation
  en vue de garantir la continuit\u00e9 de service et afin d''optimiser la structure
  d''exploitation,\\n* De fortes pr\u00e9dispositions manag\u00e9riales, et une volont\u00e9
  d''atteindre les objectifs.\\n\\nEn contrepartie de votre engagement, nous veillons
  \u00e0 vous former et \u00e0 vous accompagner dans votre \u00e9volution professionnelle.\\n\\n3.
  Caract\u00e9ristiques du contrat\\n\\nVous pouvez candidater en envoyant un CV \u00e0
  firstname.lastname@example.org en pr\u00e9cisant le poste pour lequel vous postulez.\\n\\nVeuillez
  agr\u00e9er, Madame, Monsieur, l''expression de mes sentiments distingu\u00e9s.\\n\\nLa
  Direction du Resort Thermal de Ch\u00e2tel-Guyon\\n\\nPour des raisons pratiques,
  cette offre d''emploi n''est pas sexu\u00e9e dans sa r\u00e9daction mais ce poste
  est ouvert \u00e0 toute personne sans aucune discrimination, conform\u00e9ment aux
  dispositions du code du travail et \u00e0 la politique de l''entreprise d''\u00e9gale
  opportunit\u00e9.\"", "\"La terre est bleue comme une orange (Paul Eluard)\\n\\nCommunisme
  et \u00e9cologie\\n\\nLettre de la commission \u00e9cologie et d\u00e9veloppement
  durable du PCF\\n\\nLettre n\u00b02 du 15 mai  2006\\n\\nE Ed di it to or ri ia
  al l_ _\\n\\nSommaire\\n\\nPage 2 : R\u00e9chauffement\\n\\nclimatique. Il n''y
  a plus de\\n\\ntemps \u00e0 perdre !\\n\\nPage 4 : EPR\\n\\nPage 6 : ITER, un espoir
  ?\\n\\nPage 7: Trois questions sur\\n\\nl''\u00e9nergie nucl\u00e9aire.\\n\\nPage
  10 : Plan Climat\\n\\nPage 12 : Communiqu\u00e9 de\\n\\npresse du PCF sur les quotas
  de CO2.\\n\\nBrochure\\n\\nLa  brochure du Forum national \u00ab \u00e9cologie et
  d\u00e9veloppement durable \u00bb des 23 et 24 septembre 2005 est  toujours disponible
  au si\u00e8ge du PCF.\\n\\nAnimateurs Alain Hayot\\n\\nMembre de l''Ex\u00e9cutif
  national charg\u00e9 de l''\u00e9cologie et du d\u00e9veloppement durable.\\n\\nDenis
  Cohen\\n\\nMembre du Comit\u00e9 national.\\n\\nCollaborateurs\\n\\nClaudine Ludwig
  Patrice Busque\\n\\nContact\\n\\nClaudine Ludwig 01 40 40 13 67 firstname.lastname@example.org\\n\\nSite
  web : www.pcf.fr\\n\\nTCHERNOBYL, 20 ANS APRES\\n\\nAlain Hayot\\n\\nA la suite
  d''une s\u00e9rie de dysfonctionnements techniques et d''erreurs humaines, le r\u00e9acteur
  num\u00e9ro 4 de la centrale de Tchernobyl explose, le 26 avril 1986. Il s''agit
  de la plus importante catastrophe nucl\u00e9aire civile de l''histoire cette industrie.\\n\\nLe
  vingti\u00e8me anniversaire de ce drame nous rappelle que cette forme d''\u00e9nergie
  doit \u00eatre d\u00e9velopp\u00e9e avec toutes les pr\u00e9cautions et les garanties
  qu''elle requiert.\\n\\nC''est d''autant plus n\u00e9cessaire que le nucl\u00e9aire
  s''av\u00e8re incontournable pour lutter contre le r\u00e9chauffement climatique.
  L''\u00e9puisement progressif des ressources naturelles en p\u00e9trole et en gaz
  et la n\u00e9cessit\u00e9 absolue de r\u00e9duire les \u00e9missions de gaz \u00e0
  effet de serre pour prot\u00e9ger le climat impose d''en r\u00e9duire la consommation
  et d''y trouver des alternatives. L''humanit\u00e9 a besoin de toutes les formes
  de production d''\u00e9nergie qui n''\u00e9mettent pas de gaz \u00e0 effet de serre\\n\\nC''est
  dans cet \u00e9tat d''esprit que le PCF agit :\\n\\n- pour que la fili\u00e8re reste
  publique et qu''il se prononce pour la cr\u00e9ation d''un p\u00f4le public de l''\u00e9nergie
  ;\\n- pour que tout soit mis en \u0153uvre pour d\u00e9velopper la comp\u00e9tence
  et les capacit\u00e9s techniques dans la conception des installations ;\\n- pour
  l''\u00e9l\u00e9vation des qualification et la culture de s\u00fbret\u00e9 des \u00e9quipe
  de conduite et de maintenance, ce qui exclut la sous-traitance ;\\n- pour un contr\u00f4le
  rigoureux et un souci constant d''am\u00e9lioration de la s\u00fbret\u00e9 des installations\\n\\nPopulation,
  salari\u00e9s, \u00e9lus doivent agir pour que ces imp\u00e9ratifs ne soient pas
  mis en cause sous la pression d''une gestion lib\u00e9rale privil\u00e9giant la
  rentabilit\u00e9 \u00e0 court terme.\\n\\nPour la mise en \u0153uvre et le suivi
  du fonctionnement des installations nucl\u00e9aires, un v\u00e9ritable contr\u00f4le
  citoyen s''impose au travers de la poursuite du d\u00e9bat d\u00e9mocratique permettant
  \u00e0 chacun d''\u00eatre inform\u00e9, d''\u00eatre acteur, auteur et d\u00e9cideur
  des orientations et des choix.\\n\\nRECHAUFFEMENT CLIMATIQUE ; IL N'' Y A PLUS DE
  TEMPS A PERDRE !\\n\\nPatrice Busque\\n\\nLa question du r\u00e9chauffement climatique  et
  de ses causes ne fait plus gu\u00e8re  d\u00e9bat. Toutes les \u00e9tudes et les
  recherches ne font que confirmer l''acuit\u00e9 du probl\u00e8me.\\n\\nL''activit\u00e9
  humaine, essentiellement \u00e0 travers  la consommation de combustible fossile,  est
  responsable de l''augmentation de gaz carbonique  (CO2) dans l''atmosph\u00e8re
  et d''un surcro\u00eet d''effet de serre, ce qui provoque un r\u00e9chauffement
  du climat. C''est maintenant une certitude partag\u00e9e par quasiment tous les
  gouvernements  du monde  et ainsi que de nombreux citoyens. Un r\u00e9cent sondage
  sur les Fran\u00e7ais et l''environnement, place \u00e0 42 % le r\u00e9chauffement
  climatique comme l''un des risques les plus inqui\u00e9tants pour l''avenir de la
  plan\u00e8te.\\n\\nSelon les experts du Groupement Intergouvernemental sur l''Evolution  du
  Climat rattach\u00e9 \u00e0 l''ONU, la temp\u00e9rature moyenne du globe est d\u00e9j\u00e0
  sup\u00e9rieure de 0,8 degr\u00e9s aux valeurs relev\u00e9es au d\u00e9but de la
  r\u00e9volution industrielle et  il ne faudrait  pas d\u00e9passer un r\u00e9chauffement
  de 2 degr\u00e9s \u00e0 la fin du si\u00e8cle pour \u00e9viter des catastrophes
  et une situation incontr\u00f4lable.\\n\\nUn nouveau rapport parlementaire d\u00e9but
  avril  vient s''ajouter aux nombreux rapports d\u00e9j\u00e0 publi\u00e9s sur la
  question du r\u00e9chauffement climatique.\\n\\nLe rapport de la mission d''information
  parlementaire sur l''effet de serre  lance un cri d''alarme : \u00ab le changement
  climatique constitue la plus grande menace du 21 \u00e8me si\u00e8cle \u00bb \u00ab
  Il est donc non seulement n\u00e9cessaire d''agir, mais il faut agir vite. \u00ab
  On ne pourra plus dire, comme pour l''amiante \u00ab on ne savait pas \u00bb et
  encore \u00ab le changement climatique porte en germe la menace de catastrophes
  majeures \u00bb.\\n\\nMarie-George Buffet d\u00e9clarait, de son cot\u00e9, \u00e0
  l''ouverture  du forum national organis\u00e9  par le PCF en septembre dernier sur
  le d\u00e9veloppement durable  \u00ab  la conscience de la gravit\u00e9 des enjeux
  progresse  aujourd''hui consid\u00e9rablement, mais force est de constater que les
  r\u00e9ponses apport\u00e9es peinent \u00e0 en prendre la mesure. La question est
  pourtant cruciale tant pour les conditions de vie actuelles des hommes et des femmes
  que pour l''avenir. Le d\u00e9veloppement de l''humanit\u00e9 ne peut se concevoir
  dans la d\u00e9gradation de son cadre de vie et la destruction de son bien commun
  ; la plan\u00e8te \u00bb.\\n\\nDonc, de l''avis de tous, la situation est \u00e0
  prendre au s\u00e9rieux et la prochaine p\u00e9riode va donc \u00eatre d\u00e9cisive
  pour ce qui va se passer dans la deuxi\u00e8me moiti\u00e9 du 21 \u00e8me si\u00e8cle.
  Notre g\u00e9n\u00e9ration porte la lourde responsabilit\u00e9, comme jamais auparavant,
  de ce que sera la vie des g\u00e9n\u00e9rations futures.\\n\\nLe protocole de Kyoto
  de d\u00e9cembre 1997 et sa ratification \u00e0 l''exception notable des Etats Unis  a
  ouvert en 2005 la voie \u00e0 une premi\u00e8re \u00e9tape de l''action des Etats
  pour r\u00e9duire les \u00e9missions de GES.  Il aura fallu 20 ans entre la d\u00e9couverte
  du lien entre le r\u00e9chauffement climatique et la concentration de gaz carbonique
  dans l''atmosph\u00e8re et le d\u00e9but d''une action concert\u00e9e. C''est \u00e0
  la fois long mais aussi un d\u00e9lai court quand il faut mettre  d''accord tous
  les Etats de la plan\u00e8te\\n\\nCe premier accord concerne les pays industrialis\u00e9s
  et les pays de l''Est de l''Europe et la Russie pour un  objectif global de r\u00e9duction
  des \u00e9missions de  5,2% des gaz \u00e0 effet de serre (GES) \u00e0 l''horizon  2008-2012
  par rapport \u00e0 1990, soit  8% pour l''Union europ\u00e9enne et 0% pour la France
  du fait de l''importance de l''\u00e9nergie d''origine nucl\u00e9aire. Les pays
  du Sud eux ayant  \u00e9t\u00e9  exempt\u00e9s durant  cette premi\u00e8re   phase
  d''objectif de r\u00e9duction de GES.\\n\\nLa r\u00e9duction de 5,2% des \u00e9missions
  de GES par rapport \u00e0 1990 est certes une premi\u00e8re \u00e9tape mais est
  tr\u00e8s loin de r\u00e9pondre \u00e0 l''ampleur du d\u00e9fi  qui est pos\u00e9.\\n\\n___________________________________________________________________________________________
  ____________________________________________________________________________________________\\n\\nPr\u00e9parer
  d\u00e8s maintenant l''apr\u00e8s 2012\\n\\nEngager une action urgente de grande
  ampleur sur toute la plan\u00e8te. Il ne sera pas suffisant de stabiliser les \u00e9missions
  de CO2 mais il faudra rapidement r\u00e9duire fortement ces \u00e9missions pour
  enrayer le r\u00e9chauffement climatique. La conf\u00e9rence de Montr\u00e9al de
  la fin 2005 \u00e0 mis sur pied un groupe de travail pour de nouveaux  engagements
  sur de nouveaux objectifs et un calendrier. Pour La France et l''Europe une diminution
  de 25% \u00e0 30% des GES en 2020 nous parait n\u00e9cessaire.\\n\\nUne course de
  vitesse est engag\u00e9e. Il n''est pas trop tard pour \u00e9viter un changement
  climatique incontr\u00f4lable. Tous les gouvernements et tous les citoyens doivent
  r\u00e9agir. Cela implique un changement radical dans la mani\u00e8re de produire,
  de consommer et de se comporter.\\n\\nUne r\u00e9volution politique et culturelle
  est devenue n\u00e9cessaire : prendre en compte les cons\u00e9quences \u00e9cologiques
  de notre activit\u00e9 dans les d\u00e9cisions \u00e9conomiques. Bannir les visions
  \u00e0 courte vue  qui sont celles du capitalisme financier et mondialis\u00e9 toujours
  plus avide de profits maximums imm\u00e9diat pour les actionnaires. Autrement dit
  b\u00e2tir un d\u00e9veloppement durable et solidaire de la plan\u00e8te.\\n\\nCela
  implique donc une information compl\u00e8te et mondiale des citoyens pour une prise
  de conscience r\u00e9elle de ces probl\u00e8mes cruciaux pour l''avenir de l''humanit\u00e9.
  La connaissance, la ma\u00eetrise et la capacit\u00e9 d''intervention des citoyens
  sont absolument indispensables.\\n\\nPour une nouvelle r\u00e9duction importante
  des \u00e9missions de GES, des investissements consid\u00e9rables  seront n\u00e9cessaires
  et donc la mobilisation des cr\u00e9dits publics mais aussi des banques qui devront
  r\u00e9orienter leurs financements. Il faut maintenant envisager une action r\u00e9solue
  \u00e0 long terme pour les d\u00e9cennies \u00e0 venir et donc avoir une vision
  \u00e0 long terme et une feuille de route. En effet  le march\u00e9 est  totalement
  myope sur ces questions (il ne peut expliquer pourquoi les glaciers fondent) cela
  implique un retour en force de la politique au sens noble du terme (la gestion de
  la cit\u00e9 du local au mondial) et ''une vision \u00e0 long terme dans les d\u00e9cisions
  \u00e0 prendre dans une d\u00e9marche de d\u00e9mocratie participative. Qu''on le
  veuille ou non une action solidaire de tous les pays du monde devient incontournable
  pour \u00e9viter le pire.\\n\\n\u2663 \u2663\\n\\n\u2663\\n\\n3 3\\n\\nL''EPR (Evolutionary
  Pressurized Water Reactor)\\n\\nLe nucl\u00e9aire : une vision de long terme\\n\\nDenis
  Cohen\\n\\nLes politiques \u00e9nerg\u00e9tiques mettent en jeu le tr\u00e8s long
  terme : il faut plusieurs d\u00e9cennies pour construire un parc nucl\u00e9aire
  comme celui de la France, dont la construction s''est \u00e9chelonn\u00e9e, pour
  les r\u00e9acteurs actuels dits de \\\"2 \u00e8me g\u00e9n\u00e9ration\\\", entre
  le milieu des ann\u00e9es 70 et la fin des ann\u00e9es 90. Ces \u00e9chelles de
  temps supposent une p\u00e9rennit\u00e9 de la volont\u00e9 politique, qui elle-m\u00eame
  est une condition n\u00e9cessaire pour convaincre des investisseurs d''investir
  dans des installations amorties aujourd''hui sur 20 ans.\\n\\nLe parc nucl\u00e9aire
  actuel compos\u00e9 de 58 r\u00e9acteurs dits \\\"REP\\\" s''est construit \u00e0
  un rythme soutenu depuis le milieu des ann\u00e9es 70 et EDF est ainsi devenue le
  premier exploitant mondial d''un parc nucl\u00e9aire. La standardisation des mod\u00e8les
  de centrales a permis une exploitation syst\u00e9matique du \\\"retour d''exp\u00e9rience\\\"
  sur le fonctionnement de ce parc, conduisant \u00e0 un niveau de s\u00fbret\u00e9
  tr\u00e8s \u00e9lev\u00e9.\\n\\nLa France conna\u00eet pour l''instant une situation
  particuli\u00e8rement favorable pour sa production et sa consommation d''\u00e9nergie
  \u00e9lectrique. Elle a produit, en 2004, 547 TWh d''\u00e9nergie \u00e9lectrique
  dont 477 TWh pour la consommation int\u00e9rieure, 7 TWh autoconsomm\u00e9s pour
  la production d''\u00e9lectricit\u00e9 et 62 TWh vendus \u00e0 l''export. Les exportations
  fran\u00e7aises contribuent, depuis une vingtaine d''ann\u00e9e, \u00e0 l''\u00e9quilibre
  \u00e9nerg\u00e9tique de l''Europe.\\n\\nL''\u00e9lectricit\u00e9 produite en France
  b\u00e9n\u00e9ficie d''un co\u00fbt de production du kWh comp\u00e9titif. De plus,
  la part \u00e9lev\u00e9e du nucl\u00e9aire dans la production \u00e9lectrique (78
  % en 2004) permet de produire une \u00e9lectricit\u00e9 sans \u00e9mission de CO2.\\n\\nC''est
  d\u00e8s 2030 que l''on verra les cons\u00e9quences des choix industriels d''aujourd''hui.
  Les d\u00e9cisions d''investissement prises en 2005 montreront tous leurs effets
  et \u00e0 l''inverse, si les d\u00e9cisions sont retard\u00e9es, c''est vers 2030
  que la p\u00e9nurie \u00e9nerg\u00e9tique atteindra son point maximum.\\n\\nEntre
  2000 et 2005, la demande d''\u00e9lectricit\u00e9 fran\u00e7aise a augment\u00e9
  de 2,2 % par an en moyenne, soit davantage que les pr\u00e9visions de l''Agence
  internationale de l''\u00e9nergie de l''OCDE. M\u00eame si les vingt prochaines
  ann\u00e9es voient une am\u00e9lioration n\u00e9cessaire des \u00e9conomies d''\u00e9nergie
  et une croissance tr\u00e8s mod\u00e9r\u00e9e de la demande, il faudra de nouveaux
  moyens de production pour faire face \u00e0 cette croissance et pour faire face
  de surcro\u00eet aux plus de 20 TWh par an (soit plus de 36% de la production actuelle)
  qui auront \u00e9t\u00e9 perdus d''ici l\u00e0 par l''arriv\u00e9e en fin de vie
  des moyens de production d''aujourd''hui.\\n\\nLes centrales qui composent le parc
  actuel ont \u00e9t\u00e9 pr\u00e9vues pour avoir une dur\u00e9e de vie d''au moins
  30 \u00e0 40 ans. Elles sont amorties \u00e9conomiquement au bout de 20 ans et font
  l''objet d''une r\u00e9\u00e9valuation de s\u00fbret\u00e9 tous les 10 ans par l''autorit\u00e9
  de s\u00fbret\u00e9.\\n\\nLes gains en dur\u00e9e de vie, obtenus notamment avec
  l''appui de la Recherche et D\u00e9veloppement, se traduisent d''abord par des \u00e9conomies
  importantes sur le prix de revient du kWh. Mais les exigences de s\u00fbret\u00e9
  se traduisent aussi par des co\u00fbt de jouvence de plus en plus \u00e9lev\u00e9s
  de telle sorte qu''\u00e0 un moment il devient plus \u00e9conomique de renouveler
  le parc que d''effectuer ces travaux de jouvence. De plus, les standards de s\u00fbret\u00e9
  \u00e9voluent dans le sens d''une s\u00e9v\u00e9rit\u00e9 croissante et il est logique
  de remplacer progressivement les anciennes centrales par des mod\u00e8les qui r\u00e9pondent
  encore mieux aux normes actuelles de s\u00fbret\u00e9, ce qui est le cas de l''EPR
  par rapport au \\\"palier\\\" pr\u00e9c\u00e9dent (dit \\\"N4\\\").\\n\\nOutre des
  gains en mati\u00e8re de s\u00fbret\u00e9 \u2013pr\u00e9vention renforc\u00e9e des
  risques d''accidents de fusion du c\u0153ur et protection accrue contre les cons\u00e9quences
  d''une \u00e9ventuelle fusion du c\u0153ur- l''EPR pr\u00e9sente par rapport aux
  r\u00e9acteurs de \\\"2 \u00e8me g\u00e9n\u00e9ration\\\" (parc actuel) des avantages
  au regard du d\u00e9veloppement durable et des attentes de la soci\u00e9t\u00e9
  : une meilleure utilisation des ressources en uranium par MWh, une capacit\u00e9
  de limiter l''inventaire en plutonium ou m\u00eame de la diminuer si n\u00e9cessaire
  avec un c\u0153ur \\\"Mox\u00e9\\\" jusqu''\u00e0 100 % et surtout une diminution
  du co\u00fbt du kWh li\u00e9e \u00e0 plusieurs am\u00e9liorations technologiques
  : des \u00e9conomies d''\u00e9chelle gr\u00e2ce \u00e0 une puissance unitaire port\u00e9e
  \u00e0 1 600 MWh, une meilleure utilisation du combustible, une simplification de
  la maintenance et un taux de disponibilit\u00e9 plus \u00e9lev\u00e9 et enfin une
  dur\u00e9e de vie technique de 60 ans.\\n\\nL''ensemble de ces am\u00e9liorations
  devrait permettre de r\u00e9duire le co\u00fbt de production du MWh d''environ 10
  % par rapport au \\\"N4\\\", dernier concept install\u00e9 en France \u00e0 Chooz
  et Civaux.\\n\\n______________________________________________________________________________________________\\n\\nREPERES\\n\\n______________________________________________________________________________________________\\n\\nEn
  2020, 14 r\u00e9acteurs auront 40 ans ou plus et, en 2005, 34 r\u00e9acteurs, soit
  plus de 50 % du parc, au plus tard aux environs de 2020. Pour des raisons \u00e9conomiques,
  il serait pr\u00e9f\u00e9rable de lisser ce renouvellement dans le temps (EDF privil\u00e9gie
  l''hypoth\u00e8se d''un renouvellement sur 30 ans).\\n\\nEn 2020, la demande d''\u00e9lectricit\u00e9
  aura vraisemblablement augment\u00e9 d''au moins un tiers par rapport \u00e0 aujourd''hui.
  Le recours aux \u00e9conomies d''\u00e9nergie et aux \u00e9nergies renouvelables
  ne pourra \u00e0 lui seul r\u00e9pondre \u00e0 la demande.Il faudra donc remplacer
  les centrales mises \u00e0 l''arr\u00eat par des nouvelles unit\u00e9s nucl\u00e9aires
  qui constituent, en base, la r\u00e9ponse la plus \u00e9conomique et la moins polluante.\\n\\nLa
  construction d''une t\u00eate de s\u00e9rie sur la p\u00e9riode 2007/2011 permettrait
  de disposer du retour d''exp\u00e9rience d''exploitation n\u00e9cessaire -il faut
  un minimum de 3 ans- pour prendre la d\u00e9cision de construire une s\u00e9rie
  en 2015 selon un nombre et un rythme \u00e0 d\u00e9finir et mettre en service en
  2020 le premier r\u00e9acteur en s\u00e9rie.\\n\\nDe fait, la d\u00e9cision de mise
  en service de l''EPR repr\u00e9sente le trait d''union avec les r\u00e9acteurs du
  futur.\\n\\nLa g\u00e9n\u00e9ration suivante de syst\u00e8mes de production nucl\u00e9aires
  dite \\\"4 \u00e8me g\u00e9n\u00e9ration\\\" ne sera pas disponible \u00e0 l''\u00e9chelle
  industrielle avant les ann\u00e9es 2040, avec des variations suivant le degr\u00e9
  de maturit\u00e9 actuel des concepts. La mise au point de prototypes puis de t\u00eates
  de s\u00e9rie suppose que l''on franchisse de nombreux verrous technologiques \u00e0
  la fois sur les mat\u00e9riaux (mat\u00e9riaux supportant des temp\u00e9ratures
  tr\u00e8s \u00e9lev\u00e9es de l''ordre de 1 000 degr\u00e9s) et sur les installations
  du cycle du combustible.\\n\\nLes ressources en uranium disponibles dans le monde
  suffisent pour alimenter l''industrie nucl\u00e9aire mondiale pendant le si\u00e8cle
  \u00e0 venir, peut-\u00eatre m\u00eame au-del\u00e0 si l''on consid\u00e8re la possibilit\u00e9
  d''extraire de l''uranium de l''eau de mer. Cependant, avec les technologies actuelles
  \u2013r\u00e9acteurs \u00e0 eau pressuris\u00e9e ou bouillants- les ressources ne
  sont pas utilis\u00e9es de mani\u00e8re optimale.\\n\\nDans le cadre du Forum G\u00e9n\u00e9ration
  IV, qui a \u00e9t\u00e9 lanc\u00e9 en 2000 par le DoE am\u00e9ricain, dix pays parmi
  les plus avanc\u00e9s dans le nucl\u00e9aire, dont la France, la Grande Bretagne
  et le Japon, se sont regroup\u00e9s pour d\u00e9finir quels devraient \u00eatre
  les syst\u00e8mes de production d''\u00e9nergie nucl\u00e9aire du futur si l''on
  veut qu''ils satisfassent des crit\u00e8res de d\u00e9veloppement durable.\\n\\nLes
  crit\u00e8res retenus pour s\u00e9lectionner les technologies sur lesquelles porteront
  les recherches sont, outre les crit\u00e8res aujourd''hui d\u00e9j\u00e0 satisfaits
  tels la s\u00fbret\u00e9 (incluant la s\u00fbret\u00e9 intrins\u00e8que des r\u00e9acteurs
  et la r\u00e9sistance aux agressions externes) et la comp\u00e9titivit\u00e9 du
  co\u00fbt de production du kWh par rapport aux autres sources d''\u00e9nergie (notamment
  gaz et charbon), des crit\u00e8res en rupture tels l''\u00e9conomie des ressources
  combustibles et la r\u00e9duction maximale des d\u00e9chets ultimes, qui supposent
  un cycle ferm\u00e9 et le recours \u00e0 la technologie des r\u00e9acteurs rapides,
  l''\u00e9largissement des applications au-del\u00e0 de la production d''\u00e9lectricit\u00e9
  et notamment \u00e0 la production de carburants tels que l''hydrog\u00e8ne pour
  le transport, ce qui fait appel \u00e0 des proc\u00e9d\u00e9s \u00e0 tr\u00e8s haute
  temp\u00e9rature et enfin une r\u00e9sistance accrue aux risques de prolif\u00e9ration
  par rapport aux syst\u00e8mes de production actuels.\\n\\nLes moyens et expertises
  \u00e0 mobiliser pour mener \u00e0 bien la Recherche et D\u00e9veloppement de long
  terme sur les syst\u00e8mes nucl\u00e9aires du futur (horizon 2040 et au-del\u00e0)
  font que ces recherches ne peuvent \u00eatre men\u00e9es qu''\u00e0 un niveau international,
  \u00e0 travers des coop\u00e9rations bilat\u00e9rales (Russie, Japon) et multilat\u00e9rales
  (Forum G\u00e9n\u00e9ration IV, 7 \u00e8me PCRD d''Euratom...).\\n\\nIl est capital
  que la France conserve son leadership dans cette dynamique de Recherche et D\u00e9veloppement
  men\u00e9e aujourd''hui sur un plan mondial.\\n\\nParce que le nucl\u00e9aire est
  indispensable pour lutter contre le r\u00e9chauffement climatique, nous consid\u00e9rons
  qu''il doit \u00eatre 100 % public, que la pr\u00e9carit\u00e9 doit \u00eatre bannie
  de ce secteur et que celui-ci doit \u00eatre mis sous la responsabilit\u00e9 d''un
  d\u00e9bat citoyen.\\n\\n\u2663 \u2663\\n\\n\u2663\\n\\nITER : la fusion nucl\u00e9aire,
  un espoir ?\\n\\nJean-Claude Cauvin\\n\\nCette exp\u00e9rience technologique peut-elle
  r\u00e9pondre \u00e0 la mutation \u00e9nerg\u00e9tique qui s''annonce avec la fin
  des \u00e9nergies fossiles ?\\n\\nLa fusion thermonucl\u00e9aire ouvre de nouveaux
  espoirs pour contribuer vers la fin du si\u00e8cle \u00e0 la production d''\u00e9lectricit\u00e9.
  Il est de la responsabilit\u00e9 des chercheurs et des scientifiques de travailler
  sur le long terme et d''ouvrir des perspectives nouvelles permettant aux politiques
  de d\u00e9cider \u00e0 tout moment en \u00e9largissant le choix des possibles. Les
  potentialit\u00e9s de la fusion thermonucl\u00e9aire sont telles que nous devons
  les explorer sans attendre. Pour autant, il faut \u00eatre clair sur le fait qu''ITER
  ne r\u00e9soudra pas les probl\u00e8mes auxquels nous sommes d\u00e8s \u00e0 pr\u00e9sent
  confront\u00e9s avec l''\u00e9puisement des ressources fossiles et les risques de
  d\u00e9r\u00e9glementation climatique.\\n\\nLa recherche a besoin de projets f\u00e9d\u00e9rateurs\\n\\n.
  ITER est un exemple de ces types de projets. Il aura des retomb\u00e9es scientifiques,
  techniques et industrielles difficiles \u00e0 estimer. Il ouvrira des champs nouveaux
  de la connaissance.\\n\\nLa recherche a besoin de coop\u00e9ration internationale\\n\\n.
  La ma\u00eetrise de la fusion thermonucl\u00e9aire est, de ce point de vue, une
  aventure plan\u00e9taire unique qui est n\u00e9e en pleine guerre froide et qui
  est appel\u00e9e \u00e0 se poursuivre et \u00e0\\n\\ns''\u00e9largir. Plus que jamais
  nous avons besoin de construire une soci\u00e9t\u00e9 de partage des connaissances.\\n\\nMais
  le plus dur reste \u00e0 faire. Il faut maintenant tout mettre en \u0153uvre pour
  r\u00e9ussir. Incontestablement, une des conditions de la r\u00e9ussite de ce projet
  est son acceptabilit\u00e9 sociale. Entre ceux qui instrumentalisent le projet pour
  se valoriser et masquer les d\u00e9g\u00e2ts de leur politique et ceux qui, faute
  de se rassembler sur une logique anti-lib\u00e9rale, agitent les peurs et les angoisses,
  il y a la place pour travailler le contenu qu''aura ce projet.\\n\\nLes enjeux de
  la recherche\\n\\nITER n''est pas une installation de production d''\u00e9lectricit\u00e9.
  C''est une exp\u00e9rience technologique majeure qui permettra des \u00e9tudes indispensables
  pour juger de la faisabilit\u00e9 d''une r\u00e9alisation industrielle d''un r\u00e9acteur
  de fusion nucl\u00e9aire. La concr\u00e9tisation de cet espoir \u00e9nerg\u00e9tique
  demandera beaucoup d''efforts et de temps et les d\u00e9fis \u00e0 relever sont
  nombreux et difficiles.\\n\\nLes futurs r\u00e9acteurs \u00e0 fusion nucl\u00e9aire
  ne pourront, \u00e9ventuellement, contribuer significativement \u00e0 la production
  d''\u00e9lectricit\u00e9 qu''au plus t\u00f4t, dans le quatri\u00e8me quart du si\u00e8cle.
  Raison de plus pour ne pas perdre de temps mais aussi pour ne pas l\u00e2cher la
  proie pour l''ombre. La construction d''ITER ne doit, d''aucune mani\u00e8re, servir
  d''alibi pour ralentir et remettre \u00e0 plus tard la lutte pour \u00e9conomiser
  les ressources fossiles naturelles et  limiter les \u00e9missions de gaz \u00e0
  effet de serre. Dans l''imm\u00e9diat l''utilisation de la diversit\u00e9 \u00e9nerg\u00e9tique
  avec la poursuite et l''amplification des efforts selon trois axes s''imposent :
  les \u00e9nergies dites renouvelables, les progr\u00e8s de l''efficacit\u00e9 \u00e9nerg\u00e9tique
  et l''\u00e9nergie de fission. Nous avons besoin de tout et en particulier d''un
  formidable effort de recherche dans tous ces domaines. L''effort de recherche \u00e0
  long terme que repr\u00e9sente ITER ne doit pas nuire aux efforts \u00e0 engager
  sur les v\u00e9hicules \u00e9lectriques et (ou) hybrides, sur la s\u00e9paration
  et la s\u00e9questration du gaz carbonique, sur le stockage de l''\u00e9nergie qui
  conditionne le d\u00e9veloppement des \u00e9nergies renouvelables intermittentes,
  sur la mise au point des r\u00e9acteurs \u00e0 fission surg\u00e9n\u00e9rateurs
  (dits de 4 \u00e8me g\u00e9n\u00e9ration) qui utilisent de fa\u00e7on efficiente
  l''Uranium....\\n\\nMais aujourd''hui, le gouvernement voit la recherche comme un
  co\u00fbt qu''il convient de r\u00e9duire en limitant l''effort aux seules activit\u00e9s
  laissant esp\u00e9rer un retour rapide sur investissement. Il institutionnalise
  la pr\u00e9carit\u00e9 dans le m\u00e9tier de chercheurs. Les orientations \u00e0
  moyen et long terme du CEA visent \u00e0 asservir ses missions (\u00e9nergie et
  nouvelle technologie de la communication) \u00e0 l''aval industriel. La d\u00e9r\u00e9glementation
  et la privatisation d''EDF et GDF mettent l''\u00e9nergie sous la d\u00e9pendance
  exclusive des int\u00e9r\u00eats priv\u00e9s. Les investissements \u00e0 long terme,
  notamment ceux de la recherche, indispensables pour garantir le bon fonctionnement
  de notre outil de production, ne sont plus r\u00e9alis\u00e9s. C''est cette logique
  qu''il faut inverser.\\n\\nDes financements \u00ab pharaoniques \u00bb ?\\n\\nPour
  justifier leur rejet du projet, certains parlent d''un budget \\\"pharaonique\\\".
  Ramenons \u00e0 son juste niveau cet investissement (5 M\u20ac sur 10 ans) support\u00e9
  au niveau plan\u00e9taire par 32 pays.\\n\\nSi les collectivit\u00e9s territoriales
  sont capables d''en financer 10%, on peut penser que chaque partenaire ne devrait
  pas avoir de difficult\u00e9s pour apporter cette m\u00eame somme dans la corbeille.\\n\\n___________________________________________________________________________
  ______________________________________________________________________________\\n\\nLes
  d\u00e9penses d''armements des pays du G8 repr\u00e9sentent 2000 fois le co\u00fbt
  de la construction. Lorsque l''utilisation de l''arme nucl\u00e9aire fait l''objet
  de propos inqui\u00e9tants de notre pr\u00e9sident de la R\u00e9publique, lorsqu''elle
  est au c\u0153ur d''une surench\u00e8re dans la provocation entre les USA et l''Iran,
  on peut penser que cet argent serait mieux employ\u00e9 pour les \u0153uvres de
  vie que pour les \u0153uvres de mort.\\n\\nLes profits engrang\u00e9s par les grands
  du p\u00e9trole correspondent \u00e0 500 fois le co\u00fbt de la r\u00e9alisation.
  La proposition de l''UFC (Union Fran\u00e7aise des Consommateurs) de mettre en place
  une taxe de 10% sur ces profits d\u00e9gagerait des marges largement suffisantes
  pour financer la recherche et les investissements indispensables pour, tout \u00e0
  la fois, r\u00e9pondre aux enjeux \u00e9nerg\u00e9tiques imm\u00e9diats et  financer
  les \u00e9tudes sur la fusion.\\n\\n\u2663 \u2663\\n\\n\u2663\\n\\nTROIS QUESTIONS
  A FREDERIC MARILLIER  ET ALAIN HAYOT SUR L''ENERGIE NUCLEAIRE\\n\\nNous avons r\u00e9cemment
  rencontr\u00e9 Fr\u00e9d\u00e9ric Marillier de Greenpeace sur les questions concernant
  l''\u00e9nergie nucl\u00e9aire. A l''issue de cette  rencontre, nous avons pos\u00e9
  trois questions \u00e0 Fr\u00e9d\u00e9ric Marillier et \u00e0 Alain Hayot.\\n\\n1)
  Transparence nucl\u00e9aire\\n\\nC&E : Citoyens et associations attendent depuis
  longtemps des garanties sur la transparence et la s\u00fbret\u00e9 nucl\u00e9aires.
  Le  projet de loi  actuellement en d\u00e9bat  consacre une Haute autorit\u00e9
  de s\u00fbret\u00e9 nucl\u00e9aire ind\u00e9pendante des pouvoirs publics, ayant
  les pleins pouvoirs et constitu\u00e9e de personnalit\u00e9s toutes issues des milieux
  nucl\u00e9aires ainsi qu''un Haut comit\u00e9 de la transparence et de l''information
  ayant droit de regard sur les installations et les transports de d\u00e9chets. Selon
  vous, cette Haute autorit\u00e9, telle qu''elle se constitue, peutelle  leur donner
  satisfaction ? Quelles autres solutions pr\u00e9conisez-vous ?\\n\\nFr\u00e9d\u00e9ric
  Marillier :\\n\\nOn peut tout d''abord noter que pour une loi sur la Transparence,
  l''\u00e9laboration du projet du Gouvernement s''est faite d''une mani\u00e8re particuli\u00e8rement
  opaque.\\n\\nSur le fond, ce texte ne vise qu''\u00e0 organiser l''ind\u00e9pendance
  de l''industrie nucl\u00e9aire et de son contr\u00f4le vis \u00e0 vis du pouvoir
  politique en cr\u00e9ant une Haute Autorit\u00e9 de S\u00fbret\u00e9 Nucl\u00e9aire.
  La loi concentre tous les pouvoirs \u00e0 un coll\u00e8ge de 5 personnes irr\u00e9vocables
  sans aucun contr\u00f4le et d\u00e9pouille les Ministres concern\u00e9s de leurs
  services. Les sites nucl\u00e9aires seraient par ailleurs exclus du champ d''application
  de nombreuses dispositions des Code de l''Environnement et de la Sant\u00e9 Publique
  et leur contr\u00f4le, y compris en mati\u00e8re de droit du travail, exclusivement
  confi\u00e9 \u00e0 la nouvelle autorit\u00e9. Ce texte est inacceptable.\\n\\nEn
  mati\u00e8re de transparence les trois points suivants nous paraissent un minimum
  :\\n\\n\u2013 La s\u00e9paration des pouvoir r\u00e9glementaire, de contr\u00f4le
  et d''information doit \u00eatre au contraire renforc\u00e9e et la pluralit\u00e9
  des avis et expertises recherch\u00e9e.\\n\u2013 Le contr\u00f4le des installations
  et transports nucl\u00e9aires doit \u00eatre assur\u00e9 par des organismes d\u00e9pendant
  des minist\u00e8res charg\u00e9s de la sant\u00e9 et de l''environnement et en toute
  ind\u00e9pendance de celui de l''industrie qui ne doit pas \u00eatre juge et parti.\\n\u2013
  Cr\u00e9ation d''une autorit\u00e9 ind\u00e9pendante de composition pluraliste,
  dot\u00e9e de capacit\u00e9s d''instruction de dossiers, du pouvoir d''injonction
  sur les industriels et l''administration et d''un r\u00f4le d''appel pour les citoyens.
  Elle remplacerait avantageusement le Haut Comit\u00e9 de Transparence propos\u00e9.\\n\\nAlain
  Hayot :\\n\\nTelle qu''elle est envisag\u00e9e, la Haute autorit\u00e9 ne r\u00e9pond
  en rien \u00e0 ces attentes. Constitu\u00e9e de cinq personnalit\u00e9s toutes issues
  des milieux du nucl\u00e9aire, ind\u00e9pendante de l''Etat, elle dispose de tous
  les pouvoirs en cas de tension ou de crise. Cela est d''autant plus inqui\u00e9tant
  dans l''actuel processus de privatisation d''EDF et GDF que nous connaissons. La
  d\u00e9r\u00e9glementation, la recherche du profit, la pr\u00e9carisation des personnels
  sont, dans un secteur aussi sensible source de graves  dangers. Nous proposons la
  constitution d''un p\u00f4le public de l''\u00e9nergie regroupant toute les grandes
  entreprises de la fili\u00e8re \u00e9nerg\u00e9tique. Plut\u00f4t qu''\u00e0 cette
  Haute autorit\u00e9 qui n''aurait de compte \u00e0 rendre \u00e0 personne, je suis
  favorable \u00e0 un Haut conseil, largement ouvert sur la soci\u00e9t\u00e9, repr\u00e9sentatif
  de l''ensemble des courants politiques, syndicaux et associatifs ainsi que de l''ensemble
  de la communaut\u00e9 scientifique, aupr\u00e8s du Parlement et du gouvernement,
  qui resteraient  ma\u00eetre des d\u00e9cisions\\n\\n______________________________________________________________________________________________\\n\\n2)
  Loi sur les d\u00e9chets radioactifs\\n\\nC&E : Comme pr\u00e9vu par la loi Bataille
  de 1991, le projet de loi sur les d\u00e9chets radioactifs est venu en discussion
  \u00e0 l''Assembl\u00e9e nationale d\u00e9but avril. Le texte pr\u00e9voit un choix
  d\u00e9finitif en 2015 d''un site de stockage r\u00e9versible pour les d\u00e9chets
  les plus radioactifs \u00e0 tr\u00e8s longue dur\u00e9e de vie. Dans le m\u00eame
  temps, il est pr\u00e9vu de poursuivre les recherches sur s\u00e9paration, transmutation
  ainsi que sur l''entreposage de longue dur\u00e9e en surface. Qu''en pensez-vous
  ? En outre, le projet vous semble-t-il laisser une place suffisante \u00e0 la d\u00e9mocratie
  locale ?\\n\\nFr\u00e9d\u00e9ric Marillier :\\n\\nLe projet de loi sur la gestion
  des d\u00e9chets radioactifs ignore les conclusions du d\u00e9bat public et tente
  d''imposer des orientations tr\u00e8s contest\u00e9es dans un processus de d\u00e9cision
  irr\u00e9versible et d''o\u00f9 toute ouverture d\u00e9mocratique est absente.\\n\\nIl
  referme d\u00e9finitivement la parenth\u00e8se ouverte en 1991. Apr\u00e8s des ann\u00e9es
  d''oppositions dures \u00e0 l''enfouissement, la Loi dite \u00ab Bataille \u00bb
  avait en effet op\u00e9r\u00e9 une ouverture sur les diff\u00e9rentes options de
  gestion et ouvrait une p\u00e9riode de recherche. Le texte actuel donne le feu vert
  \u00e0 l''enfouissement des d\u00e9chets, qu''il consid\u00e8re comme solution de
  r\u00e9f\u00e9rence, en l''absence de certitudes scientifiques et en d\u00e9pit
  du principe de pr\u00e9caution.\\n\\nEnfin, Il confirme aussi le statut de poubelle
  nucl\u00e9aire internationale de la France. Les d\u00e9marches juridiques men\u00e9es
  par Greenpeace ces derni\u00e8res ann\u00e9es ont r\u00e9cemment d\u00e9montr\u00e9
  les probl\u00e8mes de l\u00e9galit\u00e9 du stockage de bon nombre de d\u00e9chets
  nucl\u00e9aires \u00e9trangers en France. Le projet de loi, loin de rem\u00e9dier
  \u00e0 cette situation la l\u00e9galise ! En r\u00e9sum\u00e9, la loi en d\u00e9bat
  est un texte dangereux pour l''environnement et les g\u00e9n\u00e9rations futures.\\n\\nAlain
  Hayot :\\n\\nCertes nous arrivons au bout du d\u00e9lai de quinze ans pr\u00e9vu
  par la loi Bataille. Pour autant, je pense pr\u00e9matur\u00e9 de passer \u00e0
  un nouveau stade, \u00e0 savoir la constitution d''un centre de stockage pour 2025
  alors m\u00eame qu''aucun bilan de cette loi n''a \u00e9t\u00e9 tir\u00e9 et qu''aucune
  garantie n''est donn\u00e9e sur la r\u00e9versibilit\u00e9 de l''entreposage des
  d\u00e9chets.\\n\\nJe pense qu''avant de prendre de d\u00e9cisions \u00e0 caract\u00e8re
  d\u00e9finitif, engageant pour des centaines voire des milliers d''ann\u00e9e notre
  responsabilit\u00e9 vis \u00e0 vis des g\u00e9n\u00e9rations futures, les recherches
  doivent se poursuivre, notamment sur la transmutation pour r\u00e9duire la quantit\u00e9
  et la toxicit\u00e9 des d\u00e9chets (Superph\u00e9nix ou g\u00e9n\u00e9rateur de
  4 \u00e8me g\u00e9n\u00e9ration par exemple). Dans tous les cas la r\u00e9versibilit\u00e9
  des sites doit \u00eatre assur\u00e9e. Pour l''ensemble de ces questions, aussi
  bien les parlementaires que les populations locales et leurs \u00e9lus doivent \u00eatre
  associ\u00e9s.\\n\\n3) L''avenir du nucl\u00e9aire\\n\\nC&E : Confront\u00e9s \u00e0
  la rar\u00e9faction des ressources fossiles, \u00e0 la d\u00e9gradation catastrophique
  du climat, nombre d''Etats consid\u00e8rent d\u00e9sormais le nucl\u00e9aire comme
  n\u00e9cessaire pour produire l''\u00e9nergie de demain. N''y a-t-il pas lieu de
  conjuguer tous les efforts et les exigences pour rendre cette \u00e9nergie plus
  s\u00fbre pour les populations et pour l''environnement ?\\n\\nFr\u00e9d\u00e9ric
  Marillier :\\n\\nLe nucl\u00e9aire pose des probl\u00e8mes insurmontables depuis
  qu''il existe que sont : la gestion de ces d\u00e9chets, le risque de catastrophe
  et enfin le risque de prolif\u00e9ration. Au cours des derni\u00e8res d\u00e9cennies
  ces risques se sont malheureusement concr\u00e9tis\u00e9s comme nous le rappelle
  les 20 ans de Tchernobyl cette ann\u00e9e. Aujourd''hui aucune perspective s\u00e9rieuse
  pour r\u00e9gler ces probl\u00e8mes ne se montre. Par ailleurs, comme le d\u00e9montre
  le texte de loi sur la transparence, le danger repr\u00e9sent\u00e9 par le nucl\u00e9aire
  pousse nos soci\u00e9t\u00e9s \u00e0 des d\u00e9rives opaques, anti-d\u00e9mocratiques,
  voire polici\u00e8res ou militaires. Est-ce vraiment ce que nous voulons ?\\n\\nCertes
  les enjeux \u00e9nerg\u00e9tiques sont immenses comme vous le soulignez. Mais il
  faut rappeler que le nucl\u00e9aire reste une \u00e9nergie mineure (6% de la production
  primaire d''\u00e9nergie au niveau mondial, soit moins que les renouvelables) et
  que par ailleurs il existe d''ores et d\u00e9j\u00e0 des technologies qui associ\u00e9es
  \u00e0 des politiques d''efficacit\u00e9 et de sobri\u00e9t\u00e9, peuvent nous
  permettre de relever ces enjeux comme le d\u00e9montre le sc\u00e9nario N\u00e9gawatt
  (www.negawatt.org) que j''invite chacun et chacune \u00e0 consulter.\\n\\n_____________________________________________________________________________________________\\n\\nEnfin,
  nous r\u00e9sumons trop souvent le probl\u00e8me \u00e9nerg\u00e9tique \u00e0 un
  probl\u00e8me technologique. Le c\u0153ur du probl\u00e8me \u00e9nerg\u00e9tique
  r\u00e9side dans nos choix de soci\u00e9t\u00e9, de consommation, de production\u2026
  Si nous nous attelons s\u00e9rieusement \u00e0 ces points il existe un futur sans
  nucl\u00e9aire. Si nous oublions ou n\u00e9gligeons ces points, il nous faudra poursuivre
  le nucl\u00e9aire, mais aussi le gaz, le p\u00e9trole, le charbon\u2026\\n\\nAlain
  Hayot :\\n\\nC''est dans ce contexte de r\u00e9chauffement climatique et de rar\u00e9faction
  des ressources en hydrocarbures que l''Humanit\u00e9 doit r\u00e9pondre \u00e0 un
  immense d\u00e9fi : fournir \u00e0 chaque habitant de la plan\u00e8te l''\u00e9nergie
  dont il a besoin (actuellement 2,6 milliards en sont priv\u00e9s). Face \u00e0 cette
  situation, le parti communiste consid\u00e8re que dans l''avenir toutes les formes
  d''\u00e9nergie non productrices de gaz \u00e0 effet de serre seront indispensables.
  Par exemple nous sommes favorables \u00e0 un ambitieux programme de recherche concernant
  les \u00e9conomies d''\u00e9nergie et les \u00e9nergies renouvelables.\\n\\nLoin
  d''affirmer que le nucl\u00e9aire soit la solution unique, nous pensons qu''il n''y
  a pas aujourd''hui  de solution sans le nucl\u00e9aire, \u00e9nergie non productrice
  de gaz \u00e0 effet de serre.\\n\\nPour la rendre plus sure et plus efficace les
  programmes de recherche doivent se poursuivre et s''intensifier aussi bien en ce
  qui concerne la fission (r\u00e9acteurs de 4 \u00e8me g\u00e9n\u00e9ration) que
  la fusion (ITER).\\n\\nSur  cette question, je pense qu''il est souhaitable de mener
  un grand d\u00e9bat national qui pourrait d\u00e9boucher sur un r\u00e9f\u00e9rendum.\\n\\n\u2663
  \u2663\\n\\n\u2663\\n\\n9 9\\n\\n(Les textes en d\u00e9bat refl\u00e8tent celles
  des groupes de travail de la commission et pas n\u00e9cessairement celles du PCF)\\n\\nPLAN
  CLIMAT 2004 DU GOUVERNNEMENT\\n\\nGroupe de travail effet de serre\\n\\nR\u00e9action
  de L. Pic \u00e0  l''article paru dans le N\u00b0 1 de \u00ab Communisme et Ecologie
  \u00bb sur le \u00ab Plan Climat \u00bb :\\n\\nTRANSPORTS\\n\\nEn mati\u00e8re de  transports
  de marchandises :\\n\\nToute r\u00e9flexion sur les transports se doit se commencer
  par \u00ab mais de quels transports disposons nous ? \u00bb, sinon, le tout routier
  nous emporte, tant il est pr\u00e9gnant dans notre vie de tous les jours\u2026\\n\\nDonc,
  n''oublions pas (en transport de marchandises) :\\n\\nle ferroviaire bien s\u00fbr,
  le maritime (cabotage France/France et cabotage Europe),\\n\\nle fluvial, et pourquoi
  pas l''a\u00e9rien, si le dirigeable revient \u00e0 l''honneur (pour des convois
  exceptionnels, toujours plus contraints par l''entrelacs de ponts, de tunnels de
  ronds points et par les gabarits, routiers ou ferroviaires), et peut-\u00eatre d''autres.\\n\\nEnsuite
  il faut amener ces modes \u00e0 coop\u00e9rer en favorisant le multi modal : route/fer/mer,
  en soutenant (via les agences diverses) la conception de contenants permettant un
  passage fluide d''un mode \u00e0 l''autre.\\n\\nLes containers, mais aussi le chargement
  direct des camions sur wagons, permettent cette transition souple d''un mode \u00e0
  l''autre. De plus les chauffeurs peuvent r\u00e9cup\u00e9rer pendant le trajet non
  routier, et la suite du voyage se fera plus en s\u00e9curit\u00e9 pour tous avec
  un chauffeur repos\u00e9. Il est m\u00eame envisageable que ce soit un autre chauffeur
  avec un autre tracteur qui r\u00e9cup\u00e8re la remorque \u00e0 la sortie de la
  gare, ce qui faciliterait la vie de famille de cette profession !\\n\\nIl serait
  n\u00e9cessaire \u00e9galement que les textes l\u00e9gislatifs et r\u00e9glementaires
  soient harmonis\u00e9s. Cela favoriserait justement la culture multi modale. Par
  exemple le transports de mati\u00e8res dangereuses pourrait relever d''un seul texte
  europ\u00e9en transpos\u00e9 France (et Rhin), et non d''un pour le routier (l''ADR),
  un autre pour le ferroviaire (RID), un autre pour le maritime et un pour le fluvial
  (ADNR). En effet des textes sp\u00e9cifiques cr\u00e9ent des pr\u00e9textes, en
  tout cas n''incitent pas \u00e0 r\u00e9fl\u00e9chir globalement. A noter que le
  Bordereau de Suivi des D\u00e9chets Dangereux (BSDD), en vigueur depuis le 01 d\u00e9cembre
  2005, envisage bien le multi modal.\\n\\nEn ce qui concerne le transport des personnes
  :\\n\\nComment vanter le multi modal, sans d\u00e9plorer ici le r\u00e9tr\u00e9cissement
  de l''offre \u00ab voiture sur train \u00bb. Non seulement peu de gares le proposent,
  mais en plus leur nombre diminue !\\n\\nUne r\u00e9flexion pourrait s''engager aussi
  sur la disparition des trains de nuit. La SNCF argue de la baisse de fr\u00e9quentation
  et de la rapidit\u00e9 des trains. Incidemment, le  Quimper Paris dure toujours
  5 heures, et \u00eatre \u00e0 10 heures en r\u00e9union \u00e0 Paris suppose avoir
  pris le TGV de 04h17 (qui n''est pas un train couchette). Peut-on avoir derri\u00e8re
  la m\u00eame locomotive des wagons voyageurs et des wagons marchandises ? Il semblerait
  que non, \u00ab les r\u00e8gles de s\u00e9curit\u00e9 n''\u00e9tant pas les m\u00eames
  \u00bb. Et les populations voisines des voies, elles ont droit \u00e0 la m\u00eame
  s\u00e9curit\u00e9, quel que soit le convoi ? Une r\u00e9flexion d\u00e9passionn\u00e9e
  am\u00e8nerait peut-\u00eatre un progr\u00e8s, surtout si le but vis\u00e9 est une
  progression du bien \u00eatre de tous, et une harmonisation des flux et des d\u00e9penses
  \u00e9nerg\u00e9tiques.\\n\\n______________________________________________________________________________________________
  _____________________________________________________________________________________________\\n\\nPRODUCTION
  D''ENERGIE\\n\\nDans le cadre de cette r\u00e9flexion globale sur les \u00e9nergies
  renouvelables, il n''est pas possible de faire l''\u00e9conomie d''une r\u00e9flexion
  sur ce que l''on appelle la \u00ab valorisation \u00e9nerg\u00e9tique des d\u00e9chets
  \u00bb, en clair, les br\u00fbler plut\u00f4t que les recycler autrement. D''abord
  parce qu''il restera toujours des d\u00e9chets  non recyclables ou en fin de cycles
  (le papier est recyclable une dizaine de fois, et les plastiques ont le m\u00eame
  niveau de performances en mati\u00e8re de recyclage). Ce qui pr\u00e9dispose \u00e0
  avoir des incin\u00e9rateurs r\u00e9partis sur le territoire, sinon cela cr\u00e9e
  du transport (voir ci dessus). Notons que le m\u00eame compromis \u00e9conomico
  - environnemental est \u00e0 trouver pour le tri des d\u00e9chets (les divers types
  de plastiques, par exemple) : A l''\u00e9chelle de la communaut\u00e9 de communes,
  du d\u00e9partement, de la r\u00e9gion ? Avec toutes les questions de quelle comp\u00e9tence
  pour quelle entit\u00e9 ? Je pense que nous pourrons \u00eatre d''accord pour noter
  que les enjeux sont trop importants pour \u00eatre laiss\u00e9 entre les mains du
  \u00ab march\u00e9 libre et non fauss\u00e9 \u00bb tenu ici, au niveau europ\u00e9en,
  par 3 ou 4 grandes entreprises.\\n\\nEn m\u00eame temps que cette r\u00e9flexion,
  n''oublions pas un autre pan du m\u00eame probl\u00e8me, celui des cultures \u00e0
  but \u00e9nerg\u00e9tique : colza et autres pour amortir le choc p\u00e9trolier,
  mais aussi d''autres produits pouvant fournir une \u00e9nergie \u00e9lectrique proche
  des lieux de consommation, voire des incin\u00e9rateurs cit\u00e9s ci dessus. Ces
  cultures se devront d''\u00eatre dans le d\u00e9veloppement durable, et non dans
  l''agriculture industrielle et chimique.\\n\\n\u2663 \u2663\\n\\n\u2663\\n\\nCOMMUNIQUE
  DE PRESSE DU PCF : QUOTAS DE CO2\\n\\nLe syst\u00e8me d''\u00e9change de quotas
  d''\u00e9mission de gaz carbonique, ou \u00ab  bourse du CO2 \u00bb est le grand
  dispositif de l'' Europe lib\u00e9rale pour traiter l''effet de serre dans l''industrie
  : tout s''ach\u00e8te, tout se vend.\\n\\nL''Union europ\u00e9enne vient de rendre
  publiques des donn\u00e9es tr\u00e8s \u00e9difiantes : en France les installations
  industrielles b\u00e9n\u00e9ficient de 150 millions de tonnes de CO2 de quotas ,
  alors qu''elles en ont \u00e9mis 131 Millions de tonnes de CO2 en 2005. Ceci r\u00e9sulte
  des \u00ab cadeaux \u00bb faits au MEDEF lors des allocations de quotas.\\n\\nLes
  entreprises auront donc la chance de vendre 18, 8 Millions de tonnes de CO2. V\u00e9ritables
  subventions, ces allocations gratuites imm\u00e9rit\u00e9es repr\u00e9sentent un
  scandale au moment ou tant de d\u00e9penses publiques seraient n\u00e9cessaires
  pour  d\u00e9velopper le transport ferroviaire de marchandises, le transport public
  urbain, les \u00e9nergies renouvelables.\\n\\nPlus grave : les entreprises pourront
  aussi conserver les quotas exc\u00e9dentaires jusqu''en 2012, autant d''\u00e9missions
  non r\u00e9duites dans l''industrie et la production d''\u00e9nergie : l''objectif
  de la France de stabiliser les \u00e9missions en 2008-2012 ne pourra pas \u00eatre
  atteint.\\n\\nLe PCF demande d''urgence que le Gouvernement  rehausse sa politique
  de lutte contre l''effet de serre dans notre pays. Il demande que la directive du
  13 octobre 2003  instaurant un syst\u00e8me d''\u00e9change de quotas d''\u00e9mission
  soit profond\u00e9ment remani\u00e9e pour encadrer le march\u00e9, en mettant en
  place un prix plancher, des m\u00e9canismes d''intervention, et surtout que les
  choix politiques  soient effectu\u00e9s pour que les objectifs de Kyoto  de lutte
  contre l''effet de serre, passe du simulacre \u00e0 la r\u00e9alit\u00e9.\\n\\nParis,
  le 15 mai  2006\\n\\n\u2663 \u2663\\n\\n\u2663\"", "\"Alumni \u2014 Iels font l''actualit\u00e9,\\n\\nMulhouse
  023\\n\\nEmma Genty, \u00c9milie Gaid et Margot Leclerc, anciennes \u00e9tudiantes
  de l\u2019ESADHaR sont s\u00e9lectionn\u00e9es pour la 15e \u00e9dition de la biennale
  Mulhouse 023 \u2013 d\u00e9di\u00e9e aux jeunes artistes europ\u00e9ens.\\n\\nBeware
  the beast in black, Margot Leclerc\\nInstallation de 4 vid\u00e9os et son, vid\u00e9oprojecteurs,
  enceintes, dimensions variables, boucle vid\u00e9o environ 60\u201d, 2020.\\n\\n*Beware
  the Beast in Black* est une installation immersive de vid\u00e9os et sons qui s\u2019inscrit
  dans ma recherche de la perception de la nuit sous la forme d\u2019une balade.\\n\\n\u2014
  Elle continue donc mes projets de photos, de vid\u00e9os et de captures d\u2019\u00e9cran,
  mais cette fois-ci le paysage n\u2019est r\u00e9v\u00e9l\u00e9 qu\u2019une fraction
  de seconde par un flash. Le spectateur est plong\u00e9 dans l\u2019obscurit\u00e9
  et est d\u00e9stabilis\u00e9 lorsque les flashes apparaissent par surprise, tandis
  que le reste du temps les vid\u00e9os affichent des \u00e9crans noirs. Le paysage
  reste aussi dans la vision du spectateur par la persistance r\u00e9tinienne et donc
  il interpr\u00e8te le paysage comme il peut.\\n\\nQuant \u00e0 la bande sonore diffus\u00e9e
  sur les enceintes dispos\u00e9es aux quatre coins de la pi\u00e8ce, elle est r\u00e9alis\u00e9e
  exclusivement avec des bruits captur\u00e9s en ext\u00e9rieur pendant la nuit, \u00e0
  l\u2019exception du flash. Ils ont \u00e9t\u00e9 modifi\u00e9s, \u00e9tendus et
  distordus. Le volume sonore est volontairement \u00e9lev\u00e9 pour apporter un
  \u00e9l\u00e9ment perturbateur et d\u00e9rangeant aux projections.\\n\\nLa biennale
  Mulhouse 023 \u2014 du 10 au 13 juin\\n\\n\u25ca Initi\u00e9e en 2001, transform\u00e9e
  en biennale en 2008, cette manifestation pr\u00e9sente plus de 800 plasticiens fran\u00e7ais
  et europ\u00e9ens.\\n\\n\u25ca La biennale assure la repr\u00e9sentation de la jeune
  cr\u00e9ation contemporaine fran\u00e7aise et europ\u00e9enne et favorise \u00e9galement
  la compr\u00e9hension des disciplines artistiques contemporaines aupr\u00e8s des
  publics novices et sp\u00e9cialis\u00e9s.\\n\\n\u00c9milie Gaid\\nD\u00e9tail de
  l''installation \u00ab Multiverts \u00bb - Sculptures \u00e9volutives - divers objets
  du quotidien - gaze - graines - 13 jours\\n\\n\u2014 Mon travail s''articule autour
  de la notion du vivant et des contraintes qu''elle soul\u00e8ve.\\nJe travaille
  principalement avec des mat\u00e9riaux organiques notamment pour leurs facult\u00e9s
  \u00e0 se transformer et \u00e0 \u00e9voluer dans le temps.\\nJ''essaie d''explorer
  les vies potentielles de l''organique sans pr\u00e9juger des diff\u00e9rentes formes
  qu''adopteront mes pi\u00e8ces en fonction de l''environnement dans lequel elles
  sont pr\u00e9sent\u00e9es. \u00c9volution, solidification, alt\u00e9ration, dislocation,
  germination, cristallisation, d\u00e9composition, effondrement, disparition... apparaissent
  sous un curieux r\u00e9gime d''\u00e9quivalences mobilisant les sens et l''exp\u00e9rience
  de chacun.\\n\\nLa vocation de la Biennale de la jeune cr\u00e9ation dans l\u2019art
  contemporain Mulhouse 00 s\u2019inscrit dans son nom: permettre aux visiteurs de
  d\u00e9couvrir les grandes tendances de la cr\u00e9ation contemporaine europ\u00e9enne
  gr\u00e2ce \u00e0 la s\u00e9lection des meilleurs artistes issus d\u2019\u00e9coles
  d\u2019art, dipl\u00f4m\u00e9s ces deux derni\u00e8res ann\u00e9es.\\n\\n\u25ca
  D\u00e8s sa cr\u00e9ation, l\u2019ambition de la manifestation \u00e9tait de f\u00e9d\u00e9rer
  des \u00e9coles d\u2019art de tous les pays europ\u00e9ens et d\u2019attirer des
  professionnels et collectionneurs qui viennent \u00e0 la m\u00eame p\u00e9riode
  dans la r\u00e9gion pour Art\u2019Basel. Le brassage des cultures passe par la pr\u00e9sence
  des \u00e9coles d\u2019art de toute l\u2019Europe.\\n\\nPlus d\u2019infos: https://www.motoco.fr/\u00e9v\u00e9nements/la-biennale-021/\\n\\nD\u00e9tail
  d\u2019Archives de *Trop Beau*, 2021\\n\u00a9Emma Genty\"", "\"Le Calvados f\u00eate
  la Coquille\\n\\nReine de la f\u00eate dans le Calvados, la coquille Saint-Jacques
  vous convie \u00e0 6 rendez-vous du 20 octobre au 2 d\u00e9cembre 2018\\n\\nChaque
  automne le rendez-vous est pris. Alors que d\u00e9bute la p\u00eache au pr\u00e9cieux
  mollusque au large des c\u00f4tes normandes, les quais du Calvados s''embrasent  pour
  f\u00eater le retour de la Coquille Saint-Jacques. Du 20 octobre au 2 d\u00e9cembre,
  pas moins de 6 rendez-vous sont organis\u00e9s \u00e0 Ouistreham Riva-Bella, Villers-surmer,
  Port-en-Bessin, Courseulles-sur-Mer, Trouville-sur-mer et Grandcamp-Maisy pour c\u00e9l\u00e9brer
  le retour tr\u00e8s attendu du produit phare de la p\u00eache calvadosienne. Chaque
  ann\u00e9e en effet, entre 10 000 et 15 000 tonnes de coquilles Saint-Jacques sont
  d\u00e9barqu\u00e9es dans  les ports  de p\u00eache du Calvados.\\n\\nAu programme
  de ces r\u00e9jouissances, vente de coquilles sous la cri\u00e9e, d\u00e9gustations
  de recettes de chefs ou de femmes de p\u00eacheurs, animations dans les villes et
  les ports par\u00e9s pour l''occasion.  C''est certain, ces rendez-vous seront riches
  d''\u00e9changes de recettes sur les quais, de confidences de chef, de d\u00e9monstrations
  ou d\u00e9gustations \u2026. Mais ces journ\u00e9es de f\u00eate offrent \u00e9galement
  une belle opportunit\u00e9 de d\u00e9couvrir l''univers des gens de mer lors de
  rencontres, ateliers, expositions ou visites.\\n\\nAlors profitez de cet agenda
  gourmand pour d\u00e9couvrir la pecten maximus et faites votre march\u00e9 \u2026
  \u00e0 prix de f\u00eate.\\n\\nLes 6 rendez-vous autour de la Coquille Saint-Jacques\\n\\n20
  et 21 octobre 2018 : F\u00eate de la Coquille Saint Jacques \u00e0 Ouistreham Riva-Bella.
  Et profitez-en pour d\u00e9couvrir aussi le port depuis le haut du phare, ouvert
  pour l''occasion.\\n27 au 28 octobre 2018 : F\u00eate de la coquille Saint Jacques
  et des fruits de mer \u00e0 Villers sur Mer. Au programme : ateliers culinaires
  et battles entre chefs !\\n10 et 11 novembre 2018 : Le Go\u00fbt du Large \u00e0
  Port en Bessin. D\u00e9couvrez la vie d''un des premiers ports coquilliers de France
  : visite de chalutier, d\u00e9barque de la p\u00eache, visite de la cri\u00e9e...\\n24
  et 25 novembre 2018 : F\u00eate de la Coquille, des produits de la mer et de la
  gastronomie \u00e0 Courseulles-sur-Mer avec de nombreuses animations pout toute
  la famille.\\n1er et 2 d\u00e9cembre 2018 : Avec son rendez-vous Coquille Saint
  Jacques en f\u00eate les 1 er et 2 d\u00e9cembre, le port de Grandcamp Maisy c\u00e9l\u00e8bre
  l''ouverture de la p\u00eache en Baie de Seine.\\n1er et 2 d\u00e9cembre 2018 :
  Coquille en f\u00eate \u00e0 Trouville sur Mer vous donnera l''occasion d''assister
  \u00e0 de nombreuses d\u00e9monstrations culinaires sur le th\u00e8me de la coquille
  bien s\u00fbr.\\n\\n Contact presse : Armelle Le Goff - CALVADOS ATTRACTIVIT\u00c9
  - 02 31 27 90 37 - firstname.lastname@example.org -  www.calvados-tourisme.com\\n\\nLe
  D\u00e9partement soutient les f\u00eates de la Coquille Saint-Jacques Dans le cadre
  de son plan tourisme 2017-2022, le D\u00e9partement a souhait\u00e9 structurer quatre
  univers de s\u00e9jour identitaires autour de produits embl\u00e9matiques parmi
  lesquels la Coquille Saint-Jacques.\\n\\nLes f\u00eates de la Coquilles Saint-Jacques
  font ainsi l''objet d''un soutien promotionnel qui se traduit par l''\u00e9dition
  de flyers, une campagne de communication et un affichage dans le r\u00e9seau d\u00e9partemental
  des abribus (300 faces).\\n\\nPour ne rien manquer du programme des f\u00eates de
  la Coquille Rendez-vous sur le site : www.fetesdelacoquille.com.\"", "\"Th\u00e8me
