  as-tu retenu ? | | | |\\n\\nTransformer les barres en comp\u00e9tences :\\n\\n-
  Pratiquer diff\u00e9rents langages : s''exprimer \u00e0 l''oral\\n\\nEXERCICE 3
  : Raconte la vie d\u2019un personnage historique\\n\\nEn l\u2019an 800 trois grands
  empereurs r\u00e8gnent dans trois des empires situ\u00e9s autour de la mer M\u00e9diterran\u00e9e
  : Charlemagne, Ir\u00e8ne et Haroun al-Rachid.\\n\\nEn quelques phrases raconte
  la vie de l\u2019un de ses trois empereurs.\\n\\n(\u2713 Pense \u00e0 dire : o\u00f9
  il r\u00e8gne / s\u2019il a fait des conqu\u00eates / ses liens avec les autres
  empereurs)\\n\\n| Classe de 6\u00b0 | Classe de 5\u00b0 | Classe de 4\u00b0 | Classe
  de 3\u00b0 |\\n|-------------|-------------|-------------|-------------|\\n| Histoire
  : L\u2019empire romain dans le monde antique \u00ab l\u2019unit\u00e9 de l\u2019empire
  romain est assur\u00e9 par la romanisation \u00bb Ruche : les b\u00e2timents caract\u00e9ristiques
  de l\u2019empire romain. Exemple en classe enti\u00e8re : les thermes En Ruche :
  un temple / un arc de triomphe/ un amphith\u00e9\u00e2tre/ une domus | Histoire
  : Ruche les empereurs (exemple d\u00e9velopp\u00e9 ci-dessus) | EMC : Conna\u00eetre
  et comprendre les valeurs de la R\u00e9publique | Histoire : La seconde guerre mondiale
  : Ruche : quatre personnalit\u00e9s dans la guerre (Genevi\u00e8ve Anthonioz de
  Gaulle / Ir\u00e8ne N\u00e9miroski / Gabriel Brunet (r\u00e9sistant tu\u00e9 au
  bois du Thouraud)/ Isidore Canova (r\u00e9sistant creusois d\u00e9port\u00e9)) |\"",
  "\"Atlanti Culture\\n\\n\\\"Churchill\\\" de Andrew Roberts : sp\u00e9cial rentr\u00e9e
  litt\u00e9raire, Churchill encore, Churchill toujours, une belle nouveaut\u00e9,
  d''autres moins \u00e9patantes et plusieurs r\u00e9\u00e9ditions bienvenues\\n\\nLa
  biographie de Churchill sign\u00e9e par Andrew Roberts a \u00e9t\u00e9 publi\u00e9e
  aux \u00e9ditions Perrin.\\n\\nAvec Fran\u00e7oise Thibaut pour CultureTops\\n\\n\\\"Churchill\\\"
  de Andrew Roberts\\n\\nTraduit de l''anglais par Antoine Capet, Perrin, 1360 p.,
  29 \u20ac\\n\\nRECOMMANDATION\\n\\nExcellent\\n\\nTHEME\\n\\nIl ne faut pas \u00eatre
  rebut\u00e9 par cet \u00e9norme pav\u00e9, tr\u00e8s bien \u00e9crit (et tr\u00e8s
  bien traduit) d''un sp\u00e9cialiste britannique. Ce dernier opus reprend des recherches
  pr\u00e9c\u00e9dentes sur l''enfance (de chien), l''adolescence besogneuse, le bonheur
  d''\u00eatre \u00e0 la fois militaire et journaliste dans des conflits \u00e0 Cuba,
  aux Indes, au Soudan, contre les Boers...il souligne \u00e9galement la chance formidable
  de Winston d''avoir \u00e9pous\u00e9 Clementine Hozier, la seule femme capable de
  le supporter, ses r\u00e9ussites, ses \u00e9checs.\\n\\nPOINTS FORTS\\n\\nLes travaux
  de Roberts sur le grand Winston ont l''incontestable qualit\u00e9 de la proximit\u00e9,
  de la compr\u00e9hension de l''originalit\u00e9 du personnage.\\n\\nOn peut appr\u00e9cier
  des \u00e9clairages nouveaux, notamment sur ses relations avec la famille royale,
  son r\u00f4le tr\u00e8s important pour dissuader Edouard VIII d''abdiquer, ses relations
  difficiles avec son fils Randolf, son amour immod\u00e9r\u00e9 pour la guerre secr\u00e8te,
  sa \u00ab quatri\u00e8me force \u00bb.\\n\\n1/3\\n\\nPOINTS FAIBLES\\n\\nMais peu
  de nouveaut\u00e9s sur ce grand d\u00e9pressif qui se soigne dans la suractivit\u00e9,
  cet \u00e9ternel \u00ab fauch\u00e9 \u00bb roi des pique-assiettes, amateur de cigares
  et de champagne. L''extravagance affich\u00e9e cache en fait une perspicacit\u00e9
  rare.\\n\\nEN DEUX MOTS\\n\\nDonc un tr\u00e8s bon livre d''histoire moderne, excellent
  compagnon pour les longues soir\u00e9es d''automne.\\n\\nUN EXTRAIT\\n\\n...\\\"les
  essais de la nouvelle arme furent spectaculaires et ravirent \u00e0 tel point le
  Premier Ministre qu''il demanda s''il pouvait la tester luim\u00eame. Il prit le
  pistolet-mitrailleur et tira une longue rafale...Il se pr\u00e9occupait si peu de
  la s\u00e9curit\u00e9 que les spectateurs durent prendre refuge derri\u00e8re lui.
  Churchill s''amusait tellement qu''il troua la cible de ses initiales...Quand il
  eut vid\u00e9 le chargeur, il en redemanda un autre et tendit la mitraillette \u00e0
  sa fille cadette Mary qui tira avec enthousiasme\\\"....\\n\\nL''AUTEUR\\n\\nAndrew
  Roberts (n\u00e9 en 1963) historien, issu du King''s Coll\u00e8ge, enseignant au
  Royaume Uni et aux Etats Unis, est tr\u00e8s connu pour ses chroniques journalistiques
  et ses prestations t\u00e9l\u00e9vis\u00e9es.\\n\\nMr Roberts a \u00e9galement produit
  un \u00abNapol\u00e9on, une vie\u00bb traduit en fran\u00e7ais, qui lui a valu en
  2014 le Prix tr\u00e8s parisien de la Fondation Napol\u00e9on.\\n\\nET AUSSI\\n\\nToutefois,
  lire Winston Churchill par Churchill lui-m\u00eame reste incontournable, m\u00eame
  s''il \u00e9lude parfois des circonstances qui l''ennuient ou affabule un peu dans
  l''exploit.\\n\\nMes jeunes ann\u00e9es :  \u00e9crit vers 1930 (il a 55 ans).  Point
  n''est besoin de lire autre chose : enfance, \u00e9tudes, famille, Sandhurst, le
  4\u00e8me hussards, Cuba, l''Inde, l''exp\u00e9dition du Malakand, les charges de
  cavalerie, puis prisonnier des Boers, son \u00e9vasion, ses d\u00e9buts aux Communes.
  Un livre \u00e9patant, \u00e9crit d''une plume alerte (\u00e9ditions Tallandier
  en poche) tout comme Mon voyage en Afrique en 1907, mais moins bien, qui rassemble
  les articles qu''il \u00e9crivit  -\u00e0 prix d''or- pour le Daily Telegraph, puis
  le Morning Post.\\n\\nConversations intimes :  il s''agit d''une s\u00e9lection  parmi
  les 4000 lettres \u00e9chang\u00e9es avec son \u00e9pouse Clementine, de 1908 \u00e0
  1964, choisies par leur plus jeune fille, Mary Soames (en fran\u00e7ais, 2013, Tallandier).
  Vraiment \u00abintime\u00bb entre le Pug (Churchill) et Clempussy (l''une des signatures
  de Clementine), souvent tr\u00e8s dr\u00f4le, \u00e9mouvant, qui m\u00e9lange les
  enfants, les soucis d''argent, les guerres, la diplomatie, la noblesse, la mort
  du roi, les d\u00e9m\u00e9nagements, la C\u00f4te d''Azur, les tranch\u00e9es de
  1917, les rencontres de Clem avec Mussolini (en 35) et Staline (en 47), la peinture
  \u00e0 Marrakech et les s\u00e9jours avec Roosevelt \u00e0 Washington. Tout cela
  est passionnant.\\n\\nM\u00e9moires de Guerre, 2vol. (1914-18) et (1940-45) (Texto
  Tallandier) :  l''envers du d\u00e9cor, par celui qui en organisa une grande partie.
  Dans le 1er :  ses premi\u00e8res adversit\u00e9s politiques, le d\u00e9sastre des
  Dardanelles, l''exp\u00e9rience des tranch\u00e9es, Cl\u00e9menceau. Dans le 2\u00e8me
  : Seul contre tous, l''\u00e9limination de Chamberlain et Halifax, la relation complexe
  avec de Gaulle, puis celle avec les Am\u00e9ricains. T\u00e9h\u00e9ran, Yalta, Potsdam,
  le marchandage, l''imm\u00e9diate apr\u00e8s guerre, les Bermudes. Avec une intelligente
  pr\u00e9face de l''historien Fran\u00e7ois Kersaudy (lequel a publi\u00e9 un Winston
  Churchill chez Tallandier en 2015)\\n\\nPourquoi ne pas mentionner \u00e9galement
  l''incroyable Winston Comment un seul homme a fait l''Histoire (Stock, 2015) par
  Boris Johnson, avant qu''il ne soit Prime Minister et ait compris ce que cela signifie.
  Admiratif mais approximatif. Une sorte de  psychanalyse pour Spice girls.\\n\\nOn
  peut aussi aimer les 2 volumes (le 3\u00e8me ne fut jamais termin\u00e9) de William
  Manchester (chez Laffont en 1988) Winston Churchill : 1/ Les r\u00eaves de gloire
  (1874-1932). 2/ L''\u00e9preuve de la solitude (1932-1940). Une rare et p\u00e9n\u00e9trante
  approche. (l''auteur a \u00e9galement \u00e9crit une belle \u00e9tude sur le g\u00e9n\u00e9ral
  Macarthur, qui pr\u00e9f\u00e9ra  le maintien de l''Empereur du Japon \u00e0 une
  possible pr\u00e9sidence des USA : Un C\u00e9sar am\u00e9ricain 1880-1964).\\n\\nAutre
  genre - Autre style :\\n\\nVient de repara\u00eetre : Les Coups tordus de Winston
  Churchill par Bob Maloubier  (Texto Tallandier, 2020, 313 pages, 10 euros). Robert
  (dit Bob) Maloubier (1923 \u2013 2015) fut l''un des principaux acteurs fran\u00e7ais
  du fameux SOE (Special Operations Executive) cr\u00e9\u00e9 par Churchill d\u00e8s
  1939, \u00ab4\u00e8me force\u00bb secr\u00e8te, hors les militaires et les politiques
  (aussi obtus les uns que les autres), sous son unique autorit\u00e9, sp\u00e9cialis\u00e9e
  dans le renseignement, les sabotages et les attentats. Roi de la cordite, du plastic
  et des d\u00e9tonateurs, Maloubier eut pour fonction \u00abinstructeur en sabotages\u00bb.
  Il en pr\u00e9para beaucoup, survivant miracul\u00e9 2 ou 3 fois, il est \u00e9galement
  le p\u00e8re des nageurs de combat du SOE.\\n\\nCe livre, le dernier, publi\u00e9
  en 2015 et r\u00e9\u00e9dit\u00e9 aujourd''hui, se lit bien malgr\u00e9 une narration
  pas toujours tr\u00e8s orthodoxe et parfois d\u00e9sordonn\u00e9e, rendant d\u00e9cevants
  certains passages mal r\u00e9dig\u00e9s. Cependant, il rend un hommage enthousiaste
  \u00e0 l''intr\u00e9pide Winston, \u00e0 sa passion pour la \u00abd\u00e9stabilisation\u00bb
  de l''adversaire par tous moyens. Les 2 premiers chapitres consacr\u00e9s \u00e0
  \u00abl''imbroglio\u00bb DarlanGiraud-deGaulle,  en d\u00e9couvrent d''inattendus
  dessous (sur ce sujet, on lira surtout le tr\u00e8s remarquable L''imbroglio  de
  Charles Zorgbibe, seule approche vraiment claire et compl\u00e8te de ce jeu de dupes).
  Les chapitre 3 et 4 r\u00e9sument assez bien la vie de Winston et ses exploits  jusqu''en
  1940 et la cr\u00e9ation \u00absouterraine\u00bb du SOE.\\n\\n2/3\\n\\nan\u00e9antir
  l''eau lourde et la possibilit\u00e9 d''engins nucl\u00e9aires nazis (la premi\u00e8re
  rat\u00e9e, la seconde r\u00e9ussie), l''assassinat du chef SS Heydrich en Tch\u00e9coslovaquie,
  l''invention insens\u00e9e d''un officier noy\u00e9 pr\u00e8s de Gibraltar, porteur  fictif
  des plans d''une invasion des Balkans en 43 (un tr\u00e8s bon film \u00ab L''homme
  qui n''a jamais exist\u00e9 \u00bb a \u00e9t\u00e9 tir\u00e9 de cette histoire vraie,
  r\u00e9alis\u00e9 par par Ronald Neame en 1956, avec Clifton Webb et Stephen Boyd),
  le plan Fortitude destin\u00e9 \u00e0 tromper l''ennemi sur le lieu du d\u00e9barquement
  de Juin 44, et la pr\u00e9paration du \u00abvrai\u00bb sur le sol fran\u00e7ais.\\n\\nOn
  peut cependant pr\u00e9f\u00e9rer le magnifique Des Anglais dans la R\u00e9sistance,
  le SOE en France 1940/44 de Michael R.D.Foot, pr\u00e9fac\u00e9 par Jean-Louis Cr\u00e9mieux-Brilhac
  : un monument ! (Tallandier).   Plus de 800 pages rigoureuses, pr\u00e9cises, remplies
  d''anecdotes allant du meilleur au pire (les terribles pertes de l''ann\u00e9e 43).
  C''est \u00e0 la fois tr\u00e8s beau et tr\u00e8s int\u00e9ressant.\\n\\nEgalement
  Les saboteurs de l''ombre, la guerre secr\u00e8te de Churchill contre Hitler, de
  Giles Milton (\u00e9ditions noir sur blanc, 2018), historien reconnu, fort bien
  r\u00e9dig\u00e9, qui d\u00e9crit dans le d\u00e9tail la formation des commandos,
  leur apprentissage des meurtres silencieux et des destructions impossibles, la remont\u00e9e
  de la Gironde pour aller d\u00e9truire les abris des U-boats stationn\u00e9s \u00e0
  Bordeaux, l''invention des mines sous marines, de l''allumage \u00e0 retardement.
  Le tout sous la f\u00e9rule du Colonel Gubbins  et de ses acolytes pas toujours
  recommandables. Une certaine ironie et des d\u00e9tails loufoques. Tout cela fut
  \u00abclass\u00e9 d\u00e9fense\u00bb jusqu''en 1974.\\n\\nEnfin le beau r\u00e9cit
  de Noreen Riols Ma vie dans les services secrets (1943/45) (Calmann-L\u00e9vy, 340
  pages) : la version f\u00e9minine des services, le destin d''une centaine de femmes
  dans des actions toujours difficiles et parfois cruelles. Elle connut bien Maloubier
  et ses nageurs, pr\u00e9parant leurs exp\u00e9ditions souvent saugrenues. L\u00e0
  aussi la reconnaissance britannique ne vint que fort tard, en 2008.\\n\\nPlusieurs
  ouvrages sur Churchill font l''objet d''une chronique sur le site Culture-Tops,
  notamment :\\n\\nChurchill et la France de Christian Destremeau, par Anne Jouffroy\\n\\nComment
  un seul homme a fait l''Histoire, de Boris Johnson, par Jean-PierreTirouflet\\n\\n3/3\"",
  "\"FICHES DE REFERENCES PROFESSIONNELLES\\n\\nNom et fonctions des principaux responsables
  :\\n\\nPersonnel cl\u00e9\\n\\nTriki Jamel, Chef de Mission, Zouari Mourad, Ing\u00e9nieur
  Routier 1, Oumar Traor\u00e9, Expert Environnementaliste, Briki Hachemi, Economiste
  Transport,Bengaly Kamano, Ing\u00e9nieur Routier 2 Lamine Sagna, Topographe, Ibrahima
  Ciss\u00e9 , G\u00e9otechnicien, Bakary Coly Ing\u00e9nieur mat\u00e9riaux de construction,
  Jmel Samir, Ing\u00e9nieur Ouvrage d''Art, Ali Ben Hmida , Ing\u00e9nieur Hydrologue
  hydraulicien.\\n\\nDescription du projet :\\n\\nLa route Atar \u2013 Tidjikja est
  raccord\u00e9e \u00e0 la route bitum\u00e9e d''Atar-Akjoujt (RN1) ; une premi\u00e8re
  section d''Atar jusqu''\u00e0 Ras Taref (d''une longueur de 35 km) est d\u00e9j\u00e0
  am\u00e9nag\u00e9e.\\n\\nLa construction de la route Atar \u2013 Tidjikja s''inscrit
  dans le cadre d''une politique volontariste de d\u00e9senclavement des wilayas du
  centre et du Nord, d''am\u00e9nagement harmonieux du territoire, de d\u00e9veloppement
  des potentialit\u00e9s oasiennes et touristiques de la zone d''influence du projet
  particuli\u00e8rement entre les villes d''Atar capitale de la wilaya d''Adrar et
  Tidjikja capitale de la wilaya du Tagant et d''int\u00e9gration nationale et r\u00e9gionale..    le
  Gouvernement Mauritanien \u00e0 lanc\u00e9 le dossier de consultation pour la r\u00e9alisation
  des Etudes d\u00e9taill\u00e9es et Elaboration des Dossiers d''Appels d''Offres
  des Travaux de Construction de la Route. Les \u00e9tudes comprennent les volets
  suivants :\\n\\n- Etudes Techniques et D\u00e9taill\u00e9es (\u00e9tudes topographique,
  g\u00e9otechnique, hydrologique et hydraulique etc.),\\n- Etude Socio-\u00e9conomique\\n-
  L''\u00e9tude d''impact environnemental\\n- Et la confection d''un dossier d''appel
