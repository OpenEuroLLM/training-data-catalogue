  "\"Maladies bucco-dentaires\\n\\nMaladie parodontale\\n\\nLa maladie parodontale
  est la principale cause de maladie dentaire chez le chien. Pourtant caract\u00e9ris\u00e9e
  par une mauvaise haleine, elle est souvent non identifi\u00e9e par le propri\u00e9taire.
  Sa pr\u00e9vention passe par des soins r\u00e9guliers car elle peut entra\u00eener
  la perte des dents voire des infections graves.\\n\\nCauses\\n\\nLa plupart des
  chiens de plus de 2 ans pr\u00e9sentent une maladie parodontale, \u00e0 des degr\u00e9s
  divers. La pr\u00e9sence de bact\u00e9ries dans la bouche est normale mais lorsqu''elles
  se d\u00e9veloppent trop rapidement, elles peuvent entra\u00eener la formation de
  plaque dentaire. Si la plaque s''accumule et n''est pas \u00e9limin\u00e9e, une
  gingivite (inflammation des gencives) peut appara\u00eetre. \u00c0 ce stade, le
  traitement peut \u00eatre compl\u00e8tement curatif. Cependant, en l''absence de
  traitement, la maladie \u00e9volue en p\u00e9riodontite caract\u00e9ris\u00e9e par
  une inflammation plus importante des gencives, des d\u00e9p\u00f4ts de tartre sur
  les dents et la disparition de l''os et des structures de soutien entourant la dent.
  L''atteinte peut \u00eatre prise en charge mais est irr\u00e9versible. La parodontite
  peut entra\u00eener la perte des dents et la propagation d''infections graves au
  niveau du foie, du c\u0153ur ou des poumons.\\n\\nSympt\u00f4mes\\n\\nLa mauvaise
  haleine (halitose) est souvent le premier signe de maladie dentaire chez un chien.
  L''halitose est tellement fr\u00e9quente chez les chiens que souvent, les propri\u00e9taires
  ne s''en soucient pas.\\n\\nEn l''absence de traitement, la maladie parodontale
  peut provoquer des abc\u00e8s parodontaux et une bact\u00e9ri\u00e9mie (pr\u00e9sence
  de bact\u00e9ries dans le sang) \u00e0 l''origine d''une propagation de l''infection
  au niveau du c\u0153ur, du foie ou des reins, pouvant entra\u00eener de graves pathologies.\\n\\nAu
  stade pr\u00e9coce (gingivite), il existe des signes d''inflammation des gencives
  autour des dents touch\u00e9es par la maladie. Cette inflammation \u00e9volue en
  parodontite caract\u00e9ris\u00e9e par des gencives tr\u00e8s enflamm\u00e9es, rouges,
  enfl\u00e9es et douloureuses. Le tartre se d\u00e9pose sur les dents qui se d\u00e9chaussent
  et peuvent finir par tomber si aucun traitement n''est instaur\u00e9. Les chiens
  peuvent avoir des difficult\u00e9s \u00e0 manger.\\n\\nDiagnostic\\n\\nIl est souvent
  n\u00e9cessaire d''examiner la bouche du chien, apr\u00e8s avoir anesth\u00e9si\u00e9
  l''animal, et d''effectuer des radiographies dentaires pour d\u00e9finir l''\u00e9tendue
  de la maladie. Ces mesures peuvent parfois \u00eatre r\u00e9alis\u00e9es lors de
  l''instauration du traitement.\\n\\nTraitement\\n\\nIl convient d''instaurer un
  traitement le plus t\u00f4t possible une fois la maladie diagnostiqu\u00e9e. Le
  traitement permet de rem\u00e9dier \u00e0 la gingivite, le stade pr\u00e9coce de
  la maladie. Lorsque la gingivite a \u00e9volu\u00e9 en p\u00e9riodontite, les modifications
  ne peuvent plus \u00eatre compl\u00e8tement m\u00e9canique la plaque et le tartre
  pr\u00e9sents\\n\\nneutralis\u00e9es mais il est possible de les traiter afin d''\u00e9viter
  qu''elles n''\u00e9voluent. Le traitement repose essentiellement sur le d\u00e9tartrage
  qui consiste \u00e0 \u00e9liminer de mani\u00e8re sur chaque dent. \u00c0 un stade
  plus avanc\u00e9, une intervention chirurgicale consistant \u00e0 extraire les dents
  atteintes peut \u00eatre n\u00e9cessaire. Ces deux interventions doivent \u00eatre
  pratiqu\u00e9es sous anesth\u00e9sie.\\n\\nLes antibiotiques peuvent avoir un r\u00f4le
  important dans le traitement de la maladie dentaire, en compl\u00e9ment du traitement
  m\u00e9canique ou chirurgical. Ils sont utilis\u00e9s en cas de p\u00e9riodontite
  grave, lorsqu''il existe un risque d''infection osseuse ou de propagation de l''infection
  au reste de l''organisme.\\n\\nPr\u00e9vention\\n\\nLa pr\u00e9vention reste la
  meilleure approche. Une alimentation ad\u00e9quate, un brossage r\u00e9gulier des
  dents \u00e0 domicile et un nettoyage r\u00e9gulier des dents chez le v\u00e9t\u00e9rinaire
  doivent faire partie du programme pr\u00e9ventif de maintien de la sant\u00e9 bucco-dentaire
  du chien. Le fait de donner \u00e0 votre chien des aliments secs et durs plut\u00f4t
  que des aliments humides et\\n\\nLes d\u00e9tartrages r\u00e9guliers consistant
  \u00e0 \u00e9liminer la plaque et le tartre permettent d''\u00e9viter que la gingivite
  n''\u00e9volue en parodontite. Il est essentiel de commencer \u00e0 brosser les
  dents de votre chien le plus t\u00f4t possible afin qu''il s''y habitue.\\n\\nmous
  contribue \u00e0 pr\u00e9venir la maladie.\"", "\"Les graphes : semaine 40\\n\\nGuillaume
