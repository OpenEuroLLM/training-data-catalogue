  Preliminarni podaci  \\nIzvor: CBCG\\n\\n---\\n\\n\\\\(^{28}\\\\) Podaci platnog
  bilansa Crne Gore objavljeni u skladu sa novom metodologijom MMF-a (Priru\u010dnik
  za platni bilans, \u0161esto izdanje-BPM6).\\n\\nPozitivna kretanja na ra\u010dunima
  usluga nisu bila dovoljna da kompenziraju visok spoljnotrgovinski deficit. Na ra\u010dunu
  usluga, koji je pod uticajem povoljnih kretanja u turizmu i u oblasti transporta,
  ostvaren je suficit u iznosu od 121 milion eura. Prihodi od usluga bili su za dva
  puta ve\u0107i od izvoza roba, \u0161to ukazuje na zna\u010daj sektora usluga za
  crnogorsku ekonomiju.\\n\\nU posmatranom periodu na ra\u010dunima primarnih i sekundarnih
  dohodaka ostvaren je suficit u iznosu od 75,3 miliona eura. Pokrivenost spoljnotrgovinskog
  deficitta suficitom ostvarenim na ostalim ra\u010dunima teku\u0107eg ra\u010duna
  iznosila je 28,6% i za 2,5 p.p. je manja u pore\u0111enju sa istim periodom 2014.
  godine.\\n\\n### 7.1.1. Robna razmjena\\n\\nU prvoj polovini 2015. godine, prema
  preliminarnim podacima Monstata, ukupna robna razmjena Crne Gore sa inostranstvom
  bila je ve\u0107a za 2,7% u pore\u0111enju sa istim periodom prethodne godine. Do
  pove\u0107anja robne razmjene do\u0161lo je kao rezultat ve\u0107eg uvoza roba,
  \u0161to je rezultiralo ve\u0107im spoljnotrgovinskim deficitom. U strukturi izvoza
  dominiraju proizvodi aluminijumske industrije i elektri\u010dna energija, dok je
  uvoz vi\u0161e diverzifikovan i dominiraju proizvodi \u0161iroke namjene. Pokrivenost
  uvoza izvozom iznosila je 16,7%, \u0161to je za 1 p.p. manje nego u istom periodu
  2014. godine i predstavlja najmanju ostvarenu pokrivenost od 2009. godine.\\n\\nPrema
  preliminarnim podacima Monstata, ukupan izvoz roba iznosio je 143,7 miliona eura,
  \u0161to je pad od 1,9% u pore\u0111enju sa istim periodom 2014. godine. Na pad
  izvoza roba najvi\u0161e je uticalo smanjenje izvoza mesa i prera\u0111e od mesa
  i elektri\u010dne energije. Izvoz elektri\u010dne energije je smanjen za 29,5% u
  pore\u0111enju sa istim periodom 2014. godine i iznosio je 16,5 miliona eura ili
  11,5% ukupnog izvoza. U posmatranom periodu izvoz aluminijuma i proizvoda od aluminijuma
  je ve\u0107i za 4,2% i iznosio 36,5 miliona eura, \u0161to \u010dini 25,4% ukupnog
  izvoza.\\n\\n---\\n\\n29 Metodolo\u0161ke napomene: Podaci o spoljoj trgovini u
  platnom bilansu Crne Gore prikazani su po specijalnom sistemu trgovine. CBCG vr\u0161i
  prilagodavanje podataka dobijenih od Monstata za potrebe platnog bilansa u skladu
  sa metodologijom MMF-a (Balance of Payments Manual, sixth edition, IMF, 2009). Podaci
  o uvozu roba u platnom bilansu prikazani su po f.o.b.-u.\\n\\nU strukturi izvoza
  prema SMTK\\\\textsuperscript{30} najvi\u0161e je izvezeno proizvoda svrstanih prema
