  i lokalnu samoupravu.\\n\\n** Suficit / Deficit kao razlika izme\u0111u ukupnih
  primitaka (umanjenih za pozajmice i kredite, i prihode od privatizacije), i izdataka
  (umanjenih za otplatu dugova rezidentima, nerezidentima i otplatu obaveza iz prethodnog
  perioda).\\n\\nIzvor: Ministarstvo finansija\"", "\"Prilog 1\\n\\nCrna Gora\\nMinistarstvo
  vanjskih poslova i evropskih integracija\\n\\nINFORMACIJA O IZMJENI OPERATIVNOG
  PROGRAMSKOG DOKUMENTA TRANSNACIONALNOG  PROGRAMA JUGOISTO\u010cNA EVROPA 2007 -
  2013\\n\\nI UVOD\\n\\nBudu\u0107i da u toku sprovo\u0111enja programa saradnje u
  okviru Instrumenta pretpristupne podr\u0161ke (Ipa II komponenta) mogu nastati nepredvi\u0111ene
  promjene, Evropska komisija je Implementacionom regulativom Ipe predvidjela mogu\u0107nost
  izmjene Operativnog programskog dokumenta, kako bi se omogu\u0107ilo nesmetano sprovo\u0111enje
  projekata. U skladu s ovakvom praksom, Evropska komisija je predlo\u017eila izmjenu
  Operativnog programskog dokumenta transnacionalnog programa Jugoisto\u010dna Evropa,
  koje se odnose na promjene nastale usled pristupanja Republike Hrvatske Evropskoj
  uniji, kao i na odre\u0111ene finansijske realokacije u okviru prioriteta Operativnog
  programa, a koje nemaju uticaj na bud\u017eet Crne Gore.\\n\\nII IZMJENE OPERATIVNOG
  PROGRAMSKOG DOKUMENTA TRANSNACIONALNOG PROGRAMA  JUGOISTO\u010cNA EVROPA\\n\\nEvropska
  komisija je 28. novembra 2013. godine donijela Odluku C(2013)8528 kojom se mijenja
  i dopunjuje Odluka C(2007)6590, kojom se usvajaju izmjene Operativnog programa Jugoisto\u010dna
  Evropa za strukturnu pomo\u0107 Zajednice iz Evropskog fonda za regionalni razvoj
  (ERDF) na osnovu cilja o evropskoj teritorijalnoj saradnji i u cilju integracije
  fondova iz Instrumenta za pretpristupnu pomo\u0107 (Ipa) i Evropskog susjedskog
  i partnerskog instrumenta (ENPI) (Aneks I Finansijskog sporazuma).\\n\\nOdluka o
  izmjenama je donesena s ciljem da se u okviru transnacionalnog programa Jugoisto\u010dna
  Evropa (JIE) na adekvatan na\u010din predstave izmjene proistekle pristupanjem Republike
  Hrvatske Evropskoj uniji.\\n\\nDruga izmjena ogleda se u preraspodjeli IPA sredstava
  po prioritetima, u odnosu na inicijalnu raspodjelu predvi\u0111enu Operativnim programom
  (Aneks III Finansijskog sporazuma).\\n\\nOsnovna izmjena u odnosu na prethodni period
  (alokacije za 2010-2013. godinu, faza integrisanog upravljanja IPA sredstvima) ogleda
  se u: a) smanjenju iznosa inicijalno opredijeljenog za prioritet P4 (Razvijanje
  transnacionalne saradnje radi uspostavljanja oblasti odr\u017eivog rasta) sa 3.847.463,00
  eura na 3.101.071,00 eura, kao i b) preraspodjeli pomenute razlike u iznosu (746.392,00
  eura) na preostala tri prioriteta programa (P1 Razvijanje inovativnih pristupa i
  preduzetni\u0161tva uve\u0107an za 354.642,00 eura, P2 - Za\u0161tita i unapre\u0111enje
  \u017eivotne sredine uve\u0107an za 459,00 eura, P3 - Unapre\u0111ivanje pristupa\u010dnosti
  uve\u0107an za 391.291,00 eura).\\n\\nIznos opredijeljen za prioritet P5 \u2013
  Pru\u017eanje tehni\u010dke pomo\u0107i primjeni Programa i izgradnji kapaciteta
  ostao je neizmijenjen. Preraspodjela sredstava po prioritetima ne\u0107e imati uticaja
  na ukupne IPA alokacije zemalja u\u010desnica u Programu, niti \u0107e dovesti do
  izmjena ostalih odredbi definisanih u prethodnoj verziji Operativnog programa.\\n\\nIzmjene
  Operativnog programa izvr\u0161ene su u okviru sljede\u0107ih djelova:\\n\\n1) Prvi
  dio - Uvod: 1.2 Transnacionalna saradnja u okviru teritorijalne saradnje;\\n2) Prvi
  dio - Uvod: 1.3 Programska oblast;\\n3) Drugi dio - Analiza: 2.5  Pristupa\u010dnost
  saobra\u0107aja i informacione i telekomunikacione mre\u017ee;\\n4) \u010cetvrti
  dio \u2013 Strate\u0161ki pristup programa: 4.5.2 Komplementarnost sa drugim programima
  i mjerama koji se finansiraju iz strukturnih fondova;\\n5) \u010cetvrti dio \u2013
  Strate\u0161ki pristup programa: 4.6 Osnovni nalazi ex-ante evaluacije i strate\u0161ke
  procjene uticaja na \u017eivotnu sredinu;\\n7) \u0160esti dio - Finansijski plan:
  6.3 Finansijski plan koji prikazuje raspodjelu IPA sredstava prema dr\u017eavama
  \u2013 partnerima za 2007. Godinu;\\n6) \u0160esti dio - Finansijski plan: 6.2 Indikativna
  raspodjela prema prioritetnim osama;\\n8) \u0160esti dio - Finansijski plan: 6.4
  Finansijski plan za ENPI doprinos;\\n9) Sedmi dio - Odredbe o sprovo\u0111enju Operativnog
  programa: 7.7. Specifi\u010dna pravila sprovo\u0111enja programskog bud\u017eeta
  za Tehni\u010dku pomo\u0107.\\n\\nU skladu sa izmjenama i dopunama Operativnog programa
  Odlukom Evropske komisije C(2013) 8528, \u010dlan 1.2 Transnacionalna saradnja u
  okviru teritorijalne saradnje, mijenja se i glasi:\\n\\n\\\"Nakon procesa pro\u0161irenja
  koji se odigrao 2007. godine i pristupanja Republike Hrvatske 2013. godine, devet
  zemalja \u010dlanica u\u010destvuje, u potpunosti ili djelimi\u010dno, u Programu
  teritorijalne transnacionalne saradnje 2007\u20132013, namijenjenom Jugoisto\u010dnoj
  Evropi. U drugim regionima obuhva\u0107enim Programom u\u010destvuju zemlje koje
  nisu \u010dlanice EU, odnosno zemlje kandidati, potencijalni kandidati i druge zemlje.
  Integrisanje zemalja kandidata i potencijalnih kandidata, kao i drugih zemalja,
  od su\u0161tinske je va\u017enosti za podru\u010dje saradnje na teritoriji Jugoisto\u010dne
  Evrope.\\\"\\n\\nU okviru prvog (uvodnog) dijela, \u010dlan 1.3. Programska oblast,
  Tabela 3. Zemlje koje u\u010destvuju u programu JIE mijenja se kako je prikazano:\\n\\nUvodni
  dio drugog dijela - Analiza: 2.5 Pristupa\u010dnost saobra\u0107aja i informacione
  i telekomunikacione mre\u017ee, mijenja se i glasi:\\n\\n\\\"Kada je u pitanju pristupa\u010dnost,
  postoje dva obrasca. U zemljama EU 25 pristupa\u010dnost je relativno visoka (ni\u017ea
  je na obodu nego u sredi\u0161tu EU 25, odnosno u \u201epetouglu\\\" koji \u010dine
  London, Pariz, Milano, Minhen i Hamburg). U zemljama koje su postale \u010dlanice
  EU 2007. godine situacija je ne\u0161to nepovoljnija. Najlo\u0161iju pristipa\u010dnost
  mre\u017eama imaju zemlje kandidati i potencijalni kandidati. Uzrok tome je te\u0161ka
  ekonomska situacija zbog koje je malo ulagano u odr\u017eavanje mre\u017ee.\\\"\\n\\nUvodni
  dio \u010detvrtog dijela \u2013 Strate\u0161ki pristup programa, dio \u010dlana
  4.5.2 Komplementarnost sa drugim programima i mjerama koji se finansiraju iz strukturnih
  fondova, IPA, ENPI, EAFRD i EFF, mijenja se i glasi:\\n\\n\\\"Nacionalni strate\u0161ki
  referentni okvir (NSRO) pripremaju nadle\u017ene institucije zemalja \u010dlanica,
  a strate\u0161ki koherentni okvir (SKO) pripremaju nadle\u017ene institucije zemalja
  kandidata. Ovi okviri defini\u0161u nacionalne strate\u0161ke prioritete u periodu
  od 2007. do 2013. godine. U toku ex-ante evaluacije analizirani su NSRO i SKO svih
  zemalja \u010dlanica EU (dostupne kao nacrt tokom izrade programa) i sa njima su
  zatim uskla\u0111eni ciljevi koji se odnose na konvergentnost, konkurentnost i zapo\u0161ljavanje
