  - serijski broj \u0161asije\\nE - maksimalna dozvoljena te\u017eina potpuno optere\u0107enog
  vozila\\nF - maksimalna dozvoljena te\u017eina potpuno optere\u0107enog vozila sa
  prikolicom\\nG - maksimalno dozvoljena te\u017eina na prvoj (prednjoj) osovini\\nH
  - maksimalno dozvoljena te\u017eina na drugoj (zadnjoj) osovini\\nI - tip motora\\nL
  - \u0161ifra verzije karoserije\\nM - broj za rezervne delove\\nN - ta\u010dna vrednost
  koeficijenta dimnosti (za dizel motore)\\n\\nslika 208\\n\\nIDENTIFIKACIONA PLO\u010cICA
