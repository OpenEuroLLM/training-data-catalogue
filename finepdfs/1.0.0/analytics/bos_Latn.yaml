  ZA RECIKLIRANJE VOZILA NA KRAJU NJEGOVOG Veka\\n\\nFiat je ve\u0107 godinama posve\u0107en
  za\u0161titi \u017eivotne sredine kroz stalna pobolj\u0161anja svojih proizvodnih
  procesa i proizvodnje proizvoda koji sve vi\u0161e odgovaraju ekosistemu. U cilju
  garantovanja najbolje mogu\u0107e usluge kupcima u vidu punog po\u0161tovanja ekolo\u0161kih
  zakona i kao odgovor na obaveze koje name\u0107e evropska direktiva 2000/53/EC za
  vozila na kraju svog veka, Fiat nudi svim kupcima mogu\u0107nost da predaju svoja
  vozila* na kraju njihovog veka bez dodatnih tro\u0161kova.\\n\\nEvropska direktiva
  nala\u017ee u stvari vra\u0107anje vozila bez tro\u0161kova za poslednjeg korisnika
  ili vlasnika zbog toga \u0161to je tr\u017ei\u0161na vrednost takvih vozila nula
  ili ispod nule. Ovo zna\u010di da \u0107e se u skoro svim zemljama Evropske unije
  do 1. januara 2007. besplatno vra\u0107ati vozila koja su registrovana posle 1.
  jula 2002., dok \u0107e od 2007. godine vra\u0107anje biti besplatno, bez obzira
  na godinu registracije, pod uslovom da vozila jo\u0161 uvek sadr\u017ee sve svoje
  osnovne komponente (pogotovo motor i karoseriju) i nemaju dodatne otpadne materijale.\\n\\nZa
  predaju va\u0161eg vozila na kraju njegovog veka bez dodatnih tro\u0161kova, obratite
  se jednom od na\u0161ih dilera ili Fiatovom ovla\u0161\u0107enom centru sa skupljanje
  i recikliranje. Ovi centri su izabrani pa\u017eljivo kako bi nudili visoko kvalitetne
