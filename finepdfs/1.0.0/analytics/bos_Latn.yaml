  191.4                               |\\n\\nIzvor: Ministarstvo finansija\\n\\nProcijenjeni
  izdaci lokalne samouprave u prvom polugodi\u0161tu 2015. godine iznose 56,2 miliona
  eura ili 1,5% BDP-a, \u0161to je ni\u017ee u odnosu na ostvarenje u istom periodu
  2014. godine za 2,9%, ili 1,7 miliona eura. Zna\u010dajniji pad rashoda evidentiran
  je kod kapitalnog bud\u017eeta, koji je bio za 4,4 miliona eura manji u odnosu na
  pro\u0161logodi\u0161nji period, i iznosio je 13,8 miliona eura.\\n\\nSuficit lokalne
  samouprave u prvom polugodi\u0161tu 2015. godine procijenjen je u iznosu od 41,9
  miliona eura ili 1,2% BDP-a, a otplata duga iznosila je 27,4 miliona eura (tabela
  br. 5.3).\\n\\n**Boks 5.3 - Pregled fiskalnih rizika u srednjem roku**\\n\\n**POZITIVNI**\\n\\n**Politi\u010dki**\\n\\n-
  Poziv za \u010dlanstvo u NATO tokom 2015. godine pove\u0107a\u0107e povjerenje zapadnih
  investitora i turista \u0161to \u0107e se pozitivno odraziti na ekonomiju Crne Gore;\\n-
  Napredak na putu pristupanja Evropskoj uniji, uslovi\u0107e pove\u0107anje povjerenja
  investitora, stabilniji poslovni ambijent i pristup EU fondovima;\\n- Nastavak politi\u010dke
  krize u Isto\u010dnoj Evropi i na Bliskom Istoku mo\u017ee predstavljati pozitivan
  rizik po ostvarenje projekcija, zbog \u010dinjenice da se kapital iz tog regiona
  seli i plasira u druge, sigurnije destinacije.\\n\\n**Ekonomski**\\n\\n- Mjere i
  instrumenti fiskalne politike definisani u Analizi pojedinih aspekata poreskog sistema,
  zavisno od njihovog karaktera, mogu imati pozitivan ili negativan uticaj na ostvarenje
  projekcija;\\n- Multiplikativni efekti po\u010detka gradnje autoputa i realizacije
  najavljenih investicija predstavljaju rizik za pozitivno uskla\u0111ivanje projekcije
  prihoda;\\n- Nastavak napora na smanjenju sive ekonomije i ostvarivanje rezultata
  na tom polju, pove\u0107a\u0107e poresku bazu koja \u0107e dati dodatni zamajac
  bud\u017eetskim prihodima;\\n- Reprogram poreskog duga op\u0161tina i obaveza da
  se zarade upla\u0107uju u bruto iznosu ima\u0107e pozitivan efekat po realizaciju
  projektovanih bud\u017eetskih prihoda.\\n\\n**NEGATIVNI**\\n\\n**Politi\u010dki**\\n\\n-
  Nastavak krize u Isto\u010dnoj Evropi mo\u017ee dati negativni impuls - smanjenje
  interesovanja investitora tog regiona za realizaciju investicija u na\u0161oj dr\u017eavi,
  \u0161to se jo\u0161 uvijek nije desilo;\\n- Nestabilna politi\u010dka situacija
  na globalnom nivou negativno uti\u010de na povjerenje investitora;\\n- Neusvajanje
  fiskalnih mjera u obliku i rokovima koji su predvi\u0111eni Analizom pojedinih aspekata
  fiskalne reforme mo\u017ee dovesti do pove\u0107anja bud\u017eetskog deficitca,
  a time i pove\u0107ane potrebe za zadu\u017eivanjem kako bi se redovno izmirivala
  sve bud\u017eetske obaveze.\\n\\n**Ekonomski**\\n\\n- Valutni rizik zemalja partnera,
  koji se, prvenstveno, odnose na valutne fluktuacije u Rusiji, Ukrajini, Srbiji i
  Azerbejd\u017eanu;\\n- Recesija u Rusiji i Ukrajini odrazila bi se na pad kupovne
  mo\u0107i, a time i na pad dolazaka turista iz ovih zemalja i pad prihoda od turizma;\\n\\n-
  Infrastrukturne slabosti ekonomije;\\n- Neodr\u017eivost penzijskog sistema;\\n-
  Pove\u0107anje cijene izgradnje autoputa potencijalno do 10%;\\n- Dalje odlaganje
  po\u010detka i/ili zastoji u realizaciji investicionih projekata ugro\u017ei\u0107e
  predstavljeni makroekonomski okvir, a time i fiskalne projekcije za srednjoro\u010dni
  period;\\n- Visina dr\u017eavnog duga predstavlja negativan ekonomski pritisak na
  ostvarenje projekcija, a pove\u0107anje dr\u017eavnog duga negativno uti\u010de
  na uslove zadu\u017eivanja na me\u0111unarodnom tr\u017ei\u0161tu.\\n\\nIzvor: Ministarstvo
  finansija Crne Gore\\n\\n5.4. Dr\u017eavni fondovi\\n\\nPrema podacima Fonda penzijskog
  i invalidskog osiguranja Crne Gore, u prvom polugodi\u0161tu 2015. godine ostvareni
  su ukupni primici u iznosu od 193,1 milion eura, \u0161to je za 0,1% vi\u0161e nego
  u istom periodu 2014. godine. U\u010de\u0161\u0107e doprinosa, kao osnovnog izvora
  finansiranja Fonda PIO, u ukupnim prihodima iznosilo je 60%. Ova kategorija prihoda
  bila je za 2,4% vi\u0161a u odnosu na prvo polugodi\u0161te 2014. godine. Istovremeno,
  transferi iz bud\u017eeta, koji \u010dine 40% ukupnih primitaka, smanjeni su za
  3,2% u odnosu na uporedni period prethodne godine.\\n\\nUkupni izdaci Fonda PIO
  iznosili su 193,1 milion eura, \u0161to je za 0,1% vi\u0161e nego u istom periodu
  2014. godine, a 1,3% ni\u017ee u odnosu na planirani nivo. Najzna\u010dajniju rashodnu
  stavku predstavljaju izdaci za penzije, koji su iznosili 99% ukupnih izdataka, dok
  se 1% izdataka odnosilo na administrativne tro\u0161kove i otplate dugova. Izdaci
  po osnovu penzija bili su na pribli\u017eno istom nivou u odnosu na prvo polugodi\u0161te
  2014. godine.\\n\\nPorede\u0107i ostvarene prihode i izdatke, Fond je imao uravnote\u017een
  bud\u017eet.\\n\\nPrema podacima Zavoda za zapo\u0161ljavanje Crne Gore, u prvom
  polugodi\u0161tu 2015. godine ostvareni su ukupni primici u iznosu od 14,1 milion
  eura, \u0161to je u odnosu na isti period prethodne godine vi\u0161e za 4,6%.\\n\\nIzdaci
  Zavoda iznosili su 7,4 miliona eura i bili su ni\u017ei za 8,9% u odnosu na isti
  period 2014. godine, a 29,7% ni\u017ei od plana. U ukupnim izdacima 22,9% odnosilo
  se na teku\u0107e izdatke, dok je po osnovu transfera za socijalnu za\u0161titu
  izdvojeno 57,9%, za transfere pojedincima, institucijama i javnom sektoru 19%, a
  za kapitalne izdatke, pozajmice, kredite i ostala dugovanja 0,2%.\\n\\nPorede\u0107i
  ostvarene primitke i izdatke u prvom polugodi\u0161tu 2015. godine, Zavod je poslova\u043e
  sa suficitom u iznosu od 6,7 miliona eura.\\n\\nNeizmirene obaveze Zavoda na kraju
  prvog polugodi\u0161ta iznosile su 2,9 miliona eura.\\n\\nPrema podacima Fonda za
  zdravstveno osiguranje Crne Gore, u prvom polugodi\u0161tu 2015. godine ostvareni
  su ukupni primici u iznosu od 97 miliona eura, \u0161to je za 24,4% vi\u0161e nego
  u istom periodu 2014. godine, a za 13,3% vi\u0161e u odnosu na plan za prvo polugodi\u0161te.\\n\\nUkupni
  izdaci Fonda za zdravstveno osiguranje iznosili su 97 miliona eura, tako da je Fond
  u prvom polugodi\u0161tu ove godine imao uravnote\u017een bud\u017eet. Najve\u0107e
  u\u010de\u0161\u0107e u ukupnim izdacima odnosilo se na izdatke po osnovu redovne
  djelatnosti (transf\u0435\u0440\u0438 institucijama, pojedin\u0446\u0438\u043c\u0430,
  nevladinom i javnom \u0441\u0435\u043a\u0442\u043e\u0440\u0443 \u0443 \u0438\u0437\u043d\u043e\u0441\u0443
  \u043e\u0434 63,3 miliona eura \u0438 transferi \u0437\u0430 \u0441\u043e\u0446\u0438\u0458\u0430\u043b\u043d\u0443
  \u0437\u0430\u0448\u0442\u0438\u0442\u0443, 11,2 miliona eura), dok \u0458\u0435
  \u043e\u0441\u0442\u0430\u0442\u0430\u043a \u0441\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0430
  \u0443\u0442\u0440\u043e\u0448\u0435\u043d \u0437\u0430 \u0440\u0430\u0434 \u0424\u043e\u043d\u0434\u0430.\\n\\nNeizmirene
  obaveze Fonda \u043d\u0430 kraju prvog \u043f\u043e\u043b\u0443\u0433\u043e\u0434\u0438\u0448\u0430
  \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0435 \u0441\u0443 22 miliona eura.\\n\\nPrema
  podacima Investiciono-\u0440\u0430\u0437\u0432\u043ejnog fonda Crne Gore, u prvom
  \u043f\u043e\u043b\u0443\u0433\u043e\u0434\u0438\u0161\u0442\u0443 2015. \u0433\u043e\u0434\u0438\u043d\u0435
  \u043e\u0441\u0442\u0432\u0430\u0440\u0435\u043d\u0438 \u0441\u0443 \u0443\u043a\u0443\u043f\u043d\u0438
  \u043f\u0440\u0438\u043c\u0446\u0438 \u0443 \u0438\u0437\u043d\u043e\u0441\u0443
  \u043e\u0434 2,5 miliona eura, \u0448\u0442\u043e \u0458\u0435 \u0443 \u043e\u0434\u043d\u043e\u0441\u0443
  \u043d\u0430 \u0438\u0441\u0442\u0438 \u043f\u0435\u0440\u0438\u043e\u0434 2014.
  \u0433\u043e\u0434\u0438\u043d\u0435 \u0432\u0438\u0448\u0435 \u0437\u0430 2,8%.\\n\\n\u0423\u043a\u0443\u043f\u043d\u0438
  \u0438\u0437\u0434\u0430\u0446\u0438 \u0424\u043e\u043d\u0434\u0430 \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0438
  \u0441\u0443 1,7 miliona eura \u0438 \u0431\u0438\u043b\u0438 \u0441\u0443 \u0432\u0438\u0448\u0438
  \u0443 \u043e\u0434\u043d\u043e\u0441\u0443 \u043d\u0430 \u0438\u0441\u0442\u0438
  \u043f\u0435\u0440\u0438\u043e\u0434 2014. \u0433\u043e\u0434\u0438\u043d\u0435
  \u0437\u0430 62%.\\n\\n\u041f\u043e\u0440\u0435\u0434\u0435\u045b\u0438 \u043e\u0441\u0442\u0432\u0430\u0440\u0435\u043d\u0435
  \u043f\u0440\u0438\u043c\u0442\u043a\u0435 \u0438 \u0438\u0437\u0434\u0430\u0442\u043a\u0435
  \u0443 prvom \u043f\u043e\u043b\u0443\u0433\u043e\u0434\u0438\u0161tu 2015. \u0433\u043e\u0434\u0438\u043d\u0435,
  Fond \u0458\u0435 \u043f\u043e\u0441\u043b\u043e\u0432\u0430\u043e \u0441\u0430
  suficitom u \u0438\u0437\u043d\u043e\u0441\u0443 \u043e\u0434 0,8 miliona eura.\\n\\nNeizmirene
  obaveze Fonda, \u043d\u0430 dan 30.06.2015. \u0433\u043e\u0434\u0438\u043d\u0435,
  \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0435 \u0441\u0443 58,3 miliona eura
  (\u043e\u0434 \u0447\u0435\u0433\u0430 \u0441\u0435 \u043d\u0430\u0458\u0432\u0435\u0107i
  dio \u043e\u0434\u043d\u043e\u0441\u0438 \u043d\u0430 dugoro\u010d\u043d\u0438 \u043a\u0440\u0435\u0434\u0438\u0442
  \u0415\u0432\u0440\u043e\u043f\u0441\u043a\u0435 \u0438\u043d\u0432\u0435\u0441\u0442\u0438\u0446\u0438\u043e\u043d\u0435
  \u0431\u0430\u043d\u043a\u0435 \u0443 \u0438\u0437\u043d\u043e\u0441\u0443 \u043e\u0434
  57,2 miliona eura).\\n\\nFond rada, kao klasi\u010dni bud\u017eetski korisnik koji
  se \u0444\u0438\u043d\u0430\u043d\u0441\u0438\u0440\u0430 \u0438\u0437 \u043e\u043f\u0448\u0442\u0438\u0445
  \u0438 \u043d\u0430\u043c\u0458\u0435\u043d\u0441\u043a\u0438\u0445 \u043f\u0440\u0438\u0445\u043e\u0434\u0430,
  \u0443 prvom \u043f\u043e\u043b\u0443\u0433\u043e\u0434\u0438\u0161\u0442\u0443
  2015. \u0433\u043e\u0434\u0438\u043d\u0435 \u043e\u0441\u0442\u0432\u0430\u0440\u0438\u043e
  \u0458\u0435 \u043f\u0440\u0438\u0445\u043e\u0434\u0435 \u0443 \u0438\u0437\u043d\u043e\u0441\u0443
  \u043e\u0434 1,5 miliona eura, \u043a\u043e\u043b\u0438\u043a\u043e \u0441\u0443
  \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0438 \u0438 \u0443\u043a\u0443\u043f\u043d\u0438
  \u0438\u0437\u0434\u0430\u0446\u0438, \u0448\u0442\u043e \u0458\u0435 \u0437\u0430
  61,6% \u043d\u0438\u017ee \u0443 \u043e\u0434\u043d\u043e\u0441\u0443 \u043d\u0430
  \u0438\u0441\u0442\u0438 \u043f\u0435\u0440\u0438\u043e\u0434 \u043f\u0440\u0435\u0442\u0445\u043e\u0434\u043d\u0435
  \u0433\u043e\u0434\u0438\u043d\u0435.\\n\\n\u041daj\u0437\u043d\u0430\u0447\u0430\u0458\u043d\u0438\u0458\u0443
  rashodnu stavku \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0459\u0430\u0458\u0443
  \u0438\u0437\u0434\u0430\u0446\u0438 \u043a\u043e\u0458\u0438 \u0441\u0435 \u043e\u0434\u043d\u043e\u0441\u0435
  \u043d\u0430 transfere \u0437\u0430 \u0441\u043e\u0446\u0438\u0458\u0430\u043b\u043d\u0443
  \u0437\u0430\u0448\u0442\u0438\u0442\u0443, \u0442\u043e \u0458\u0435\u0441\u0442
  \u0441\u0440\u0435\u0434\u0441\u0442\u0432\u0430 \u0437\u0430 \u0442\u0435\u0445\u043d\u043e\u043b\u043e\u0448\u043a\u0435
  \u0432\u0438\u0448\u043a\u043e\u0432\u0435 (1,4 miliona eura).\\n\\nNeizmirene obaveze
  Fonda \u043d\u0430 dan 30.06.2015. \u0433\u043e\u0434\u0438\u043d\u0435 \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0435
  \u0441\u0443 5,3 miliona eura.\\n\\nFond za obe\u0161te\u0107enje \u0458\u0435 \u0443
  prvom \u043f\u043e\u043b\u0443\u0433\u043e\u0434\u0438\u0161\u0442\u0443 2015. \u0433\u043e\u0434\u0438\u043d\u0435
