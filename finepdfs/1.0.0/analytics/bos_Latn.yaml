  NOVCA 03\\n\\nU toku drugog kvartala 2015. godine nije odr\u017eana nijedna aukcija
  dr\u017eavnih zapisa.\\n\\nTokom prve polovine 2015. godine odr\u017eane su \u010detiri
  aukcije dr\u017eavnih zapisa sa rokom dospije\u0107a od 182 dana.\\n\\nUkupna vrijednost
  emitovanih dr\u017eavnih zapisa iznosila je 72,2 miliona eura na kraju prve polovine
  2015. godine. U odnosu na isti period prethodne godine, iznos emitovanih zapisa
  je ni\u017ei za 43,8%, \u0161to govori o manjoj potrebi za kratkoro\u010dnim finansijskim
  sredstvima sa doma\u0107eg tr\u017ei\u0161ta u ovom periodu.\\n\\nU posmatranom
  periodu tra\u017enja za dr\u017eavnim zapisima je bila za 25,4% manja u odnosu na
  isti period prethodne godine. Ukupna tra\u017enja je iznosila 109,9 miliona eura
  i prema\u0161ila je vrijednost emitovanih zapisa za 52,3%.\\n\\nTokom prvih \u0161est
  mjeseci 2015. godine prodati su dr\u017eavni zapisi u vrijednosti od 97,5 miliona
  eura, \u0161to zna\u010di da su prodati dr\u017eavni zapisi prema\u0161ili ukupnu
  vrijednost emitovanih dr\u017eavnih zapisa\\\\(^{13}\\\\). Kupci na svim aukcijama
  dr\u017eavnih zapisa bile su crnogorske banke, dok je na dvije aukcije kupac bio
  i Fond za za\u0161titu depozita.\\n\\nTrend smanjenja prosje\u010dnih ponderisanih
  kamatnih stopa na dr\u017eavne zapise zapo\u010det u 2012. godini, nastavljen je
  i u 2015. godini. Tako je ostvarena prosje\u010dna ponderisana kamatna stopa na
  ukupne prodate dr\u017eavne zapise iznosila 0,51% u prvoj polovini 2015. godine,
  \u0161to je za 1,24 p.p. manje od prosje\u010dne ponderisane kamatne stope na prodate
  zapise u prvoj polovini prethodne godine. Me\u0111utim, na posljednjoj aukciji odr\u017eanoj
  u martu teku\u0107e godine, ostvarena je zna\u010dajno ve\u0107a ponderisane kamatna
  stopa, u iznosu od 1,20%.\\n\\nDr\u017eavni dug po osnovu dr\u017eavnih zapisa,
  na dan 30.06.2015. godine, iznosio je 97,5 miliona eura.\\n\\n---\\n\\n\\\\(^{13}\\\\)
  Ministarstvo finansija je na aukcijama dr\u017eavnih zapisa odr\u017eanim tokom
  prvog kvartala 2015. godini izvr\u0161ilo emisiju dr\u017eavnih zapisa ro\u010dnosti
  od 182 dana sa mogu\u0107no\u0161\u0107u prodaje ve\u0107eg broja dr\u017eavnih
  zapisa od broja koji je inicijalno emitovan.\\n\\nTR\u017dI\u0160TE KAPITALA\\n\\n04\\n\\nTokom
  prve polovine 2015. godine na Montenegroberzi je ostvareno 21,2 miliona eura prometa,
  \u0161to je za 67,4% manje u odnosu na isti period prethodne godine.\\n\\nPrilikom
  pore\u0111enja prometa, treba imati u vidu \u010dinjenicu da je promet u istom periodu
  prethodne godine bio zna\u010dajno ve\u0107i zbog prodaje dr\u017eavnih obveznica
  u martu 2014. godine u ukupnom iznosu od 43,2 miliona eura, \u0161to je \u010dinilo
  66,4% ukupnog prometa u tom periodu. Ukoliko bi isklju\u010dili ovu prodaju, promet
  u toku prvih \u0161est mjeseci teku\u0107e godine bi bio za 3% ni\u017ei u odnosu
  na isti period prethodne godine.\\n\\nProsje\u010dni mjese\u010dni promet iznosio
  je 3,5 miliona eura tokom prve polovine 2015. godine, \u0161to je znatno manje od
  prosje\u010dnog mjese\u010dnog prometa ostvarenog u istom periodu 2014. godine u
  iznosu od 10,8 miliona eura. Najve\u0107i mjese\u010dni promet u iznosu od 6,3 miliona
  eura je zabilje\u017een u februaru, dok je najni\u017ei zabilje\u017een u maju i
  iznosio je 1,3 miliona eura.\\n\\nTokom posmatranog perioda, ostvareno je 2.584
  transakcija, pri \u010demu je u odnosu na isti period prethodne godine zabilje\u017een
  pad broja transakcija od 14%. Prosje\u010dan mjese\u010dni broj transakcija je iznosio
  431. Mjesec sa najve\u0107im brojem transakcija bio je april (557), dok je januar
  bio mjesec sa najmanjim brojem sklpljenih poslova (316).\\n\\nU toku prvih \u0161est
  mjeseci 2015. godine, sklpljena su dva blok posla ukupne vrijednosti 2,2 miliona
  eura. Odr\u017eana je jedna aukcija za paket akcija \u010dija je vrijednost iznosila
  152.693 eura.\\n\\nCjelokupan promet je ostvaren kroz sekundarnu trgovinu.\\n\\n**Struktura
  prometa**\\n\\nU strukturi prometa ostvarenog u prvoj polovini 2015. godine, najve\u0107e
  u\u010de\u0161\u0107e od 49,2% bilje\u017ei promet raznim vrstama obveznica, \u0161to
  je za 22,5 procentnih poena manje nego u istom periodu prethodne godine, dok je
  u\u010de\u0161\u0107e prometa akcija kompanija iznosilo 48,8%, i bilje\u017ei pove\u0107anje
  od 29,3 procentnih poena na godi\u0161njem nivou. Preostalih 2% posto ukupnog prometa
  odnosilo se na promet akcijama investicionih fondova, \u010dije je u\u010de\u0161\u0107e
  smanjeno za 6,8 procentnih poena.\\n\\nPromet obveznicama je tokom prve polovine
  2015. godine iznosio 10,4 miliona eura, \u0161to je 4,5 puta manje nego u istom
  periodu prethodne godine. Cjelokupan promet obveznicama je realizovan kroz 70 transakcija.\\n\\nOd
  ukupnog prometa obveznicama, najve\u0107i dio od 93,5% se odnosio na promet dr\u017eavnim
  obveznicama, zatim slijedi promet korporativnim obveznicama sa 5,4% u\u010de\u0161\u0107a,
  dok se neznatan dio odnosio na promet obveznicama stare devizne \u0161tednje 0,6%,
  kao i na promet obveznicama restitucije 0,5%.\\n\\nUkupan promet akcijama kompanija
  u iznosu od 10,3 miliona eura\\\\(^{14}\\\\) ostvaren je kroz 2.061 transakciju,
  \u0161to predstavlja 79,8% ukupno realizovanih transakcija u posmatranom periodu.
  Ostvareni promet akcijama kompanija bio je ni\u017ei za 18,4% u odnosu na isti period
  prethodne godine, dok je broj realizovanih poslova smanjen za 1,4%. Tokom prvih
  \u0161est mjeseci 2015. godine najvi\u0161e se trgovalo akcijama Crnogorskog Telekoma,
  Crnogorskog elektroprenosnog sistema i Universal Capital banke, \u010diji je promet
  za ovaj period predstavljao 60,9% ukupnog prometa akcijama kompanija.\\n\\n---\\n\\n\\\\(^{14}\\\\)
  Uklju\u010duju\u0107i blok poslova i aukcije.\\n\\nGrafik 4.5\\n\\nPromet u 000
  eura i broj transakcija akcijama FZU, prva polovina 2013, 2014 i 2015. godine\\n\\nTrgovina
  akcijama fondova zajedni\u010dkog ulaganja (FZU) je u prvih \u0161est mjeseci 2015.
  godine iznosila 412.238 eura, i realizovana je kroz 453 transakcije (uklju\u010duju\u0107i
  prodaje putem aukcije odr\u017eane u maju). Ostvareni promet akcijama FZU bio je
  13,8 puta manji u odnosu na isti period prethodne godine.\\n\\nBerzanski indeksi\\n\\nTokom
  prvih \u0161est mjeseci 2015. godine, Index Monex je imao rastu\u0107i trend. Tako
  je, nakon zabilje\u017eenog blagog pada u januaru 2015. godine, indeks Monex tokom
  naredna tri mjeseca bilje\u017eio rast, da bi ponovo zabilje\u017eio pad u maju
  i junu teku\u0107e godine. Kao rezultat navedenih kretnja, vrijednost indeksa na
  kraju juna je iznosila 12.354,55 i bila je ve\u0107a od vrijednosti ostvarene na
  kraju prethodne godine za 998,44 indeksnih poena ili 8,8%. U poredenju sa istim
  periodom prethodne godine vrijednost ovog indeksa je ve\u0107a za 2.629,71 indeksnih
  poena ili 27%.\\n\\nS druge strane, indeks investicionih fondova Monex PIF je bilje\u017eio
  mjese\u010dni pad u januaru i februaru, dok je tokom naredna \u010detiri mjeseca
  bilje\u017eio rast. Vrijednost ovog indeksa je na kraju juna 2015. godine iznosila
  2.875,73 indeksnih poena i bilje\u017ei pad od 161,65 indeksnih poena ili 5,3% u
  odnosu na kraj 2014. godine, dok je u odnosu na jun 2014. godine zabilje\u017eio
  rast od 48,78 indeksnih poena ili 1,6%.\\n\\nNovoformirani indeks MNSE10, koji je
  na crnogorskom tr\u017ei\u0161tu kapitala uveden 01. aprila 2015. godine, zabilje\u017eio
  je rast od 1,33 indeksnih poena, odnosno 0,1% u odnosu na po\u010detnu vrijednost.\\n\\nKapitalizacija\\n\\nOstvarena
  tr\u017ei\u0161na kapitalizacija na Montenegroberzi na kraju juna 2015. godine iznosila
  je 3,043,3 miliona eura. Tr\u017ei\u0161na kapitalizacija je zabilje\u017eila rast
  od 2,8% u odnosu na kraj prethodne godine, dok je na godi\u0161njem nivou porasla
  za 5,9%.\\n\\nLikvidnost mjerena koeficijentom obra\u010dunava se na Montenegroberzi
  je u junu 2015. godine iznosila 0,000959, i bila je ve\u0107a u odnosu na decembar
  2014. godine kada je iznosila 0,000511, dok je manja u pore\u0111enju sa juna 2014.
  godine kada je iznosila 0,001152.\\n\\nIzvor: Montenegroberza\\n\\nBoks 4.1 - Regionalne
  berze, odabrani pokazatelji poslovanja\\n\\nU toku prvih \u0161est mjeseci 2015.
  godine, na svim berzama u regionu je zabilje\u017een pad prometa. Najve\u0107i pad,
  u odnosu na prvih \u0161est mjeseci prethodne godine, zabilje\u017een je na Montenegroberzi
  (67,4%), kao i na Makedonskoj berzi, gdje je promet bio za 44,2% ni\u017ei u odnosu
  na isti period prethodne godine. Najni\u017ei pad prometa od 11,1% je ostvaren na
  Beogradskoj berzi. Na svim berzama u regionu, u toku prve polovine 2015. godine,
