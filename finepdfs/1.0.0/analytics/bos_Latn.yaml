  finansija\\n\\nNajzna\u010dajniji rast u odnosu na prvo polugodi\u0161te prethodne
  godine ostvaren je kod prihoda po osnovu doprinosa koji su ve\u0107i za 7 miliona
  eura, kao i kod naplate akciza (ve\u0107e su za 4,7 miliona eura), a rezultat su
  pove\u0107anja stope akciza na cigarete. Prihodi po osnovu doprinosa iznosili su
  187,9 miliona eura i vi\u0161i su za 8,5% u odnosu na plan za prvo polugodi\u0161te
  2015. godine, dok u odnosu na isti period prethodne godine bilje\u017ee rast od
  3,9%. Pozitivno odstupanje ostvareno je i kod primitaka od otplate kredita i to
  za 2,5 miliona eura.\\n\\nUkupni izdaci bud\u017eeta za \u0161est mjeseci 2015.
  godine iznosili su 973 miliona eura ili 26,8% procijenjenog BDP-a. U pore\u0111enju
  sa istim periodom 2014. godine, bud\u017eetska potro\u0161nja bila je vi\u0161a
  za 27,1%, a u odnosu na planiranu ni\u017ea je za 0,9% (tabela br. 5.2).\\n\\nKonsolidovani
  izdaci bud\u017eeta iznosili su 843,4 miliona eura, \u0161to \u010dini 23,3% procijenjenog
  BDP-a. Ostvareni izdaci su u odnosu na plan za \u0161est mjeseci teku\u0107e godine
  bili vi\u0161i za 7,8%, a u odnosu na isti period 2014. godine vi\u0161i su za 29,1%
  ili 190,3 miliona eura, i to najvi\u0161e zbog pove\u0107anja kapitalnih izdataka
  koji bilje\u017ee rast od 161,4 miliona eura, zatim otplate obaveza iz prethodnih
  godina (rast od 20,2 miliona eura) i transfera institucijama, pojedinicima, nevladinom
  i javnom sektoru, u iznosu od 14,8 miliona eura.\\n\\nTeku\u0107a bud\u017eetska
  potro\u0161nja iznosila je 658,3 miliona eura ili 18,2% BDP-a, dok je kapitalni
  bud\u017eet iznosio 185,1 milion eura ili 5,1% BDP-a.\\n\\nTeku\u0107i izdaci u
  posmatranom periodu iznosili su 308,1 milion eura i bili su ni\u017ei od planiranih
  za 2,5%. Gotovo svi rashodi, izuzev rashoda za ostala li\u010dna primanja, za kamatu
  i rentu, bili su ispod planiranih.\\n\\nRashodi za bruto zarade smanjeni su za 1,4%
  u odnosu na isti period 2014. godine. Smanjenje rashoda u odnosu na uporedni period
  prethodne godine zabilje\u017eeno je i kod rashoda za materijal, usluge i subvencije.\\n\\nAko
  posmatramo strukturu bud\u017eetske potro\u0161nje (tabela br. 5.2), najve\u0107e
  u\u010de\u0161\u0107e imaju transferi za socijalnu za\u0161titu oko 28,8%, bruto
  zarade 22,1% i kapitalni bud\u017eet 21,9%. Na ostale namjene odnosi se 27,2% bud\u017eetskih
  izdataka, od \u010dega transferi institucijama, pojedinicima, NVO i javnom sektoru
  u\u010destvuju sa 7,2%, kamate 5,9%, otplata obaveza iz prethodnih godina sa 4,7%,
  a rashodi za materijal i usluge 3,6% bud\u017eetske potro\u0161nje.\\n\\nOtplate
  duga iznosila je 129,6 miliona eura i u odnosu na isti period prethodne godine bilje\u017ei
  rast od 17,2 miliona eura.\\n\\nZa \u0161est mjeseci 2015. godine, pozajmice i krediti
  iz doma\u0107ih izvora (dominantno emisija obveznica) iznosili su 35,4 miliona eura,
  dok su pozajmice i krediti iz inostranih izvora iznosili 499 miliona eura.\\n\\n---\\n\\n20
