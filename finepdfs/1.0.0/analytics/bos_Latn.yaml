  / zadnjeg stakla E. Ko\u010diona te\u010dnost F. Akumulator\\n\\nVerzije 1.3 16
  V Multijet\\n\\nA. \u0160ipka za merenje nivoa motornog ulja\\nB. \u010cep/ nalivno
  grlo motornog ulja\\nC. Sredstvo za hla\u0111enje motora\\nD. Te\u010dnost pera\u010da
  vetrobranskog / zadnjeg stakla\\nE. Ko\u010diona te\u010dnost\\nF. Akumulator\\n\\nslika
  201\\n\\n1.6 16V Multijet verzija\\n\\nA. \u0160ipka za merenje nivoa motornog ulja\\nB.
  \u010cep/ nalivno grlo motornog ulja\\nC. Rashladna te\u010dnost motora\\nD. Te\u010dnost
  pera\u010da vetrobranskog / zadnjeg stakla\\nE. Ko\u010diona te\u010dnost\\nF. Akumulator\\n\\nslika
  201a\\n\\nMOTORNO ULJE\\n\\nProveravajte nivo ulja nekoliko minuta (oko 5) posle
  ga\u0161enja motora, kada je vozilo parkirano na ravnom tlu.\\n\\nVerzije 1.4 16V
  i 1.3 i 1.6 16 V Multijet\\n\\nIzvadite \u0161ipku za merenje nivoa ulja B, o\u010distite
  je sa krpom i ubacite je ponovo. Izvucite ponovo \u0161ipku za merenje nivoa ulja
  i proverite da li je nivo ulja izme\u0111u oznaka MIN i MAX na \u0161ipci za merenje
  nivoa ulja. Raspon izme\u0111u oznaka MIN i MAX odgovara koli\u010dini od oko 1
  litre ulja. Ukoliko je nivo ulja blizu ili ispod linije MIN, dolijte ulje kroz nalivno
  grlo A dok ne dostigne liniju MAX.\\n\\nNivo ulja ne sme nikada da pre\u0111e oznaku
  MAX.\\n\\nVerzije 0.9 TwinAir 105 KS\\n\\n\u0160ipka za merenje nivoa motornog ulja
  B je sastavni deo \u010depa A. Odvijte \u010dep, izbri\u0161ite \u0161ipku za merenje
  nivoa ulja \u010distom krpom, ubacite je ponovo i zategnite \u010dep. Odvijte ponovo
  \u010dep i proverite da li je nivo motornog ulja izme\u0111u oznaka MIN i MAX na
  \u0161ipci za merenje nivoa ulja.\\n\\nPotro\u0161nja motornog ulja\\n\\nMaksimalna
  potro\u0161nja motornog ulja iznosi oko 400 grama na svakih 1.000 km. Tokom prvog
  perioda kori\u0161\u0107enja vozila, motor se razra\u0111uje, stoga potro\u0161nja
  motornog ulja mo\u017ee da se stabilizuje tek posle prvih 5.000 \u2013 6.000 km.
  VA\u017dNO: Posle dodavanja ili zamene ulja, pustite motor da radi nekoliko sekundi
  i sa\u010dekajte nekoliko minuta po \u0161to ga ugasite, pre nego \u0161to proveravate
  nivo.\\n\\nNemojte dodavati ulje druk\u010dijih karakteristika od onog koje se ve\u0107
  nalazi u motoru.\\n\\nUpotrebljeno ulje i filteri ulja sadr\u017ee supstance koje
  su \u0161tetne za \u017eivotnu sredinu. Preporu\u010dujemo vam da se obratite Fiatovom
  dileru za zamenu ulja i filtera.\\n\\nSREDSTVO ZA HLA\u0110ENJE MOTORA\\n\\nNivo
  sredstva za hla\u0111enje motora treba kontrolisati kada je motor hladan i on mora
  biti izme\u0111u oznaka MIN i MAX na rezervoaru. Ukoliko je nivo suvi\u0161e nizak,
  skinite \u010dep rezervoara C (videti prethodne strane) i dolijte te\u010dnost kako
  je opisano u poglavlju \\\"Tehni\u010dke specifikacije\\\".\\n\\nAntifriz PARAFLU\\\\textsuperscript{UP}
  koristi se u sistemu za hla\u0111enje motora. Upotrebite istu te\u010dnost kao \u0161to
  je ona koja je ve\u0107 u sistemu za hla\u0111enje, kada je dolivate. PARAFLU\\\\textsuperscript{UP}
  se ne mo\u017ee me\u0161ati sa drugim vrstama te\u010dnosti. Ukoliko bi se to dogodilo,
  nemojte startovati motor, ve\u0107 se obratite Fiatovom dileru.\\n\\n**UPAZORENJE**\\n\\nSistem
  za hla\u0111enje je pod pritiskom. Ukoliko je potrebno, zamenite \u010dep sa drugim
  istog kvaliteta i istih specifikacija kao \u0161to je originalni, ina\u010de \u0107e
  efikasnost sistema biti ugro\u017eena. Nemojte skidati \u010dep rezervoara kada
  je motor vru\u0107: rizikujete da se ope\u010dete.\\n\\n**TE\u010cNOST PERA\u010cA
  VETROBRANSKOG / ZADNJEG STAKLA**\\n\\nUkoliko je nivo suvi\u0161e nizak, skinite
  \u010dep rezervoara D (videti prethodne stranice) i dolijte te\u010dnost kao \u0161to
  je opisano u poglavlju \\\"Tehni\u010dke specifikacije\\\".\\n\\n**UPAZORENJE**\\n\\nNemojte
  voziti sa praznim rezervoarom pera\u010da vetrobranskog stakla: pera\u010d vetrobranskog
  stakla je neophodan za dobru vidljivost. Neki aditivi, koji su u prodaji za pera\u010d
  vetrobranskog stakla, su zapaljivi. Prostor za motor sadr\u017ei vru\u0107e komponente
  koje se mogu zapaliti.\\n\\n**KO\u010cIONA TE\u010cNOST**\\n\\nProverite da li je
  ova te\u010dnost na maksimalnom nivou (nivo te\u010dnosti u rezervoaru ne sme da
  pre\u0111e oznaku MAX).\\n\\nUkoliko je nivo te\u010dnosti u rezervoaru suvi\u0161e
  nizak, skinite \u010dep rezervoara E (videti prethodne strane) i dolijte te\u010dnost
  kako je opisano u poglavlju \\\"Tehni\u010dke specifikacije\\\".\\n\\nVA\u017dNO:
  Pa\u017eljivo o\u010distite \u010dep rezervoara E i okolnu povr\u0161inu.\\n\\nPrilikom
  otvaranja \u010depa, obavezno pazite da prljav\u0161tina ne u\u0111e u rezervoar.\\n\\nZa
  dolivanje koristite uvek levak sa ugra\u0111enim filterom fino\u0107e od 0,12 mm
  ili manje od 0,12 mm.\\n\\nVA\u017dNO: Ko\u010diona te\u010dnost je higroskopna
  (tj. apsorbuje vlagu). Iz ovog razloga ukoliko se vozilo koristi uglavnom u oblastima
  sa visokim stepenom atmosferske vlage, ovu te\u010dnost treba menjati u \u010de\u0161\u0107im
  intervalima od onih koji su navedeni u dinamici Plana servisiranja.\\n\\nPazite
  da ko\u010diona te\u010dnost, koja je jako korozivna, ne do\u0111e u kontakt sa
  ofarbanim delovima. Ukoliko se to desi, odmah ih operite vodom.\\n\\nUPAZORENJE\\n\\nKo\u010diona
  te\u010dnost je otrovna i jako korozivna. Ukoliko do\u0111e do slu\u010dajnog kontakta,
  odmah operite takva mesta sa vodom i neutralnim sapunom. Zatim ih dobro isperite.
  Obratite se odmah lekaru, ukoliko je progutate.\\n\\nUPAZORENJE\\n\\nSimbol na ambala\u017ei
  ozna\u010dava sinteti\u010dku ko\u010dionu te\u010dnost, za razliku od ko\u010dione
  te\u010dnosti mineralnog tipa. Kori\u0161\u0107enje te\u010dnosti mineralnog tipa
  o\u0161teti\u0107e trajno specijalne gumene zaptivke ko\u010dionog sistema.\\n\\nPRE\u010cISTA\u010c
  VAZDUHA / FILTER ZA POLEN / DIZEL FILTER\\n\\nZa zamenu filtera obratite se Fiatovom
  dileru.\\n\\nAKUMULATOR\\n\\nAkumulator ne zahteva dolivanje destilovane vode elektrolitu.
  Me\u0111utim, radi provere njegove efikasnosti, treba da vr\u0161ite periodi\u010dnu
  kontrolu, koju mo\u017eete uraditi kod Fiatovog dilera.\\n\\nZAMENA AKUMULATORA\\n\\nUkoliko
  je potrebno, zamenite akumulator sa drugim istog kvaliteta i istih specifikacija
  kao \u0161to je originalni. Po\u0161tujte uputstva proizvo\u0111a\u010da akumulatora
  za njegovo odr\u017eavanje.\\n\\nKORISNI SAVETI ZA PRODU\u017dAVANJE VEGA TRAJANJA
  VA\u0160EG AKUMULATORA\\n\\nDa biste izbegli pra\u017enjenje va\u0161eg akumulatora
  i produ\u017eili mu vek trajanja, po\u0161tujte slede\u0107a uputstva:\\n\\n- kada
  parkirate vozilo, proverite da li ste dobro zatvorili vrata, prtlja\u017enik i poklopac
  motora, kako biste spre\u010dili da krovna svetla ostanu upaljena u putni\u010dkoj
  kabini;\\n- ugasite unutra\u0161nja krovna svetla. Me\u0111utim, vozilo ima sistem
  koji automatski gasi unutra\u0161nja svetla;\\n- nemojte dugo dr\u017eati upaljene
  ure\u0111aje (npr. zvu\u010dni sistem, svetla za upozorenje na opasnost itd.) kada
  je uga\u0161en motor;\\n- pre nego \u0161to radite bilo \u0161ta na elektri\u010dnom
  sistemu, isklju\u010dite negativni kabl akumulatora;\\n- zategnite do kraja kleme
  akumulatora.\\n\\nVA\u017dNO: Ukoliko nivo punjenja dugo ostane ispod 50%, akumulator
  je o\u0161te\u0107en sulfacijom, \u0161to smanjuje njegov kapacitet i efikasnost
  prilikom startovanja. Akumulator tako\u0111e mo\u017ee biti izlo\u017een riziku
  od smrzavanja (ovo mo\u017ee da se dogodi ve\u0107 na \u201310\u00b0C). Pogledajte
  deo \\\"Mirovanje vozila\\\" pod \\\"Startovanje i vo\u017enja\\\" ukoliko vozilo
  ostavljate da dugo stoji parkirano.\\n\\nUkoliko po kupovini vozila, \u017eelite
  da instalirate elektri\u010dne ure\u0111aje koji zahtevaju stalno napajanje elektri\u010dnom
  energijom (alarm itd.) ili ure\u0111aje koji uti\u010du na potro\u0161nju struje,
  obratite se Fiatovom dileru, \u010dije \u0107e kvalifikovano osoblje proceniti ukupnu
  potro\u0161nju elektri\u010dne energije.\\n\\nUPPOZORENJE\\n\\nTe\u010dnost akumulatora
  je otrovna i korozivna. Izbegavajte kontakt sa ko\u017eom i o\u010dima. Nemojte
  prinositi otvoren plamen akumulatoru i nemojte upotrebljavati predmete koji mogu
  da varni\u010de u njegovoj blizini: rizik od eksplozije i po\u017eara.\\n\\nUPPOZORENJE\\n\\nUpotreba
  akumulatora koji nema dovoljno te\u010dnosti, o\u0161teti\u0107e trajno akumulator
  i mo\u017ee da uzrokuje eksploziju.\\n\\nNepravilno instaliranje elektri\u010dnih
  i elektronskih ure\u0111aja mo\u017ee da uzrokuje ozbiljno o\u0161te\u0107enje va\u0161eg
  vozila. Ukoliko po kupovini vozila \u017eelite da instalirate neke ure\u0111aje
  (za za\u0161titu od kra\u0111e, telefon u vozilu itd.) obratite se Fiatovom dileru,
  koji \u0107e vam predlo\u017eiti ure\u0111aje koji najbolje odgovaraju va\u0161em
  vozilu i \u0161to je najva\u017enije, savetova\u010de vam da li je potrebno da se
  instalira akumulator ve\u0107eg kapaciteta.\\n\\nAkumulatori sadr\u017ee supstance
  koje su vrlo opasne za \u017eivotnu sredinu. Za zamenu akumulatora, obratite se
  Fiatovom dileru.\\n\\n**UPozorenje**\\n\\nUkoliko vozilo ne\u0107ete koristiti du\u017ee
  vreme u izuzetno hladnim vremenskim uslovima, izvadite akumulator i ostavite ga
  da stoji na zagrejanom mestu kako se ne bi smrzao.\\n\\n**UPozorenje**\\n\\nUvek
  stavite odgovaraju\u0107e nao\u010dare kada radite sa akumulatorom ili u njegovoj
  blizini.\\n\\nKO\u010cNICE\\n\\nVozilo je opremljeno sa 4 sistema za registrovanje
  mehani\u010dkog tro\u0161enja ko\u010dionih plo\u010dica: po jedan za svaki sklop
  to\u010dka.\\n\\nKada su ko\u010dione obloge blizu istro\u0161enosti, \u010du\u0107ete
  blago \u0161i\u0161tanje kada pritisnete pedalu ko\u010dnice: ova indikacija traje
  oko 100 km (zavisno od stila vo\u017enje i tipa puta).\\n\\nU ovim okolnostima mogu\u0107e
  je i dalje voziti, ali oprezno.\\n\\nU svakom slu\u010daju, obratite se Fiatovom
  dileru \u0161to je mogu\u0107e pre da vam zameni ko\u010dione plo\u010dice.\\n\\nTO\u010cKOVI
  I PNEUMATICI\\n\\nPre polaska na duga putovanja i svake dve nedelje, provjeravajte
  pritisak naduvavanja pneumatika i rezervnog to\u010dka koji \u0161tedi prostor (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno). Pneumatike pregledajte
  kada su hladni. Pritisak se pove\u0107ava tokom vo\u017enje pod standardnim uslovima:
  za pravilan pritisak naduvavanja pneumatika pogledajte deo \\\"To\u010dkovi\\\"
  u poglavlju \\\"Tehni\u010dke specifikacije\\\".\\n\\nNepravilan pritisak uzrokuje
  nepravilno tro\u0161enje pneumatika sl. 202:\\n\\nA normalan pritisak: ravnomerno
  tro\u0161enje gaze\u0107e povr\u0161ine;\\n\\nB nizak pritisak: gaze\u0107a povr\u0161ina
  posebno istro\u0161ena na ivicama;\\n\\nC visok pritisak: gaze\u0107a povr\u0161ina
  posebno istro\u0161ena u sredini.\\n\\nPneumatici se moraju zameniti kada je gaze\u0107a
  povr\u0161ina tanja od 1,6 mm. U svakom slu\u010daju, po\u0161tujte va\u017ee\u0107e
  zakone u zemlji u kojoj vozite.\\n\\nVA\u017dNO\\n\\nPreduzmite slede\u0107e mere
  preostro\u017enosti da spre\u010dite o\u0161te\u0107enje pneumatika:\\n\\n- izbegavajte
  nagla ko\u010denja, trkanja prilikom startovanja i jake udare o ivi\u010dnjake,
  rupe ili druge prepreke i dug\u0435 vo\u017enje po neravnim povr\u0161inama puteva;\\n-
  proveravajte periodi\u010dno da pneumatici nemaju posekotine u bo\u010dnom zidu,
  da nisu nenormalno naduveni ili da nemaju nepravilno tro\u0161enje gaze\u0107e povr\u0161ine;\\n-
  izbegavajte vo\u017enje sa preoptere\u0107enim vozilom. Ukoliko je jedan od pneumatika
  probu\u0161en, stanite odmah i zamenite ga;\\n- pneumatici stare, \u010dak i ako
  se ne koriste mnogo. Putotine u gumi gaze\u0107e povr\u0161ine i sa strana predstavljaju
  znake starenja. U svakom slu\u010daju, ukoliko su pneumatici na vozilu du\u017ee
  od 6 godina, treba da ih pregleda stru\u010dno osoblje. Isto tako, nemojte zaboraviti
  da pregledate vrlo pa\u017eljivo rezervni to\u010dak koji \u0161tedi prostor (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno);\\n- menjajte me\u0111usobno
  prednje i zadnje pneumatike, na svakih 10 \u2013 15 hiljada kilometara, tako \u0161to
  \u0107ete ih zadr\u017eati na istoj strani vozila, kako ne biste obrnuli smer rotacije;\\n-
  u slu\u010daju zamene, stavljajte uvek nove pneumatike, izbegavajte one koji su
  sumnjivog porekla;\\n- ukoliko menjate pneumatik, zamenite tako\u0111e i ventil
  za naduvavanje.\\n\\nBRISA\u010c VETROBRANSKOG / ZADNJEG STAKLA\\n\\nMETLICE\\nZamenite
  metlice ukoliko su gumene ivice deformisane ili istro\u0161ene. U svakom slu\u010daju,
  preporu\u010duje se da se zamene jednom godi\u0161nje.\\n\\nNekoliko jednostavnih
  mera predostro\u017enosti mo\u017ee da smanji mogu\u0107nost o\u0161te\u0107enja
  metlica:\\n\\n- ukoliko temperatura padne ispod nule, proverite da led nije zale\u0111io
  gumu za staklo. Upotrebite antifriz da ih odvojite, ukoliko je potrebno;\\n- skinite
  sneg sa stakla: pored toga \u0161to \u0107ete za\u0161titi metlice brisa\u010da,
  na ovaj na\u010din \u0107ete sa\u010duvati i motor brisa\u010da od napornog rada
  i pregrejavanja;\\n- nemojte uklju\u010divati brisa\u010de vetrobranskog / zadnjeg
  stakla po suvom staklu.\\n\\nUPAZORENJE\\nVo\u017enja sa istro\u0161enim metlicama
  brisa\u010da vetrobranskog / zadnjeg stakla predstavlja ozbiljnu opasnost, zbog
  smanjene vidljivosti po lo\u0161em vremenu.\\n\\nPodizanje metlica brisa\u010da\\n\\nUkoliko
  je potrebno da podignite metlice brisa\u010da sa vetrobranskog stakla (npr. u slu\u010daju
  snega ili potrebe da se zamene metlice) postupite kao \u0161to slije:\\n\\n- okrenite
  prstenasti prekida\u010d A sl. 203 u polo\u017eaj (isklju\u010den brisa\u010d vetrobranskog
  stakla);\\n- klju\u010d za paljenje okrenut je u polo\u017eaj OFF (isklju\u010den);\\n-
  posle okretanja klju\u010da za paljenje u polo\u017eaj STOP, pomerite najmanje na
  pola sekunde desnu polugu u nestabilan polo\u017eaj u roku od 2 minute kako biste
  aktivirali brisa\u010d vetrobranskog stakla na brisanje;\\n- prethodni postupak
  se mo\u017ee ponoviti najvi\u0161e 3 puta u cilju pomeranja metlica u najpodesniji
  polo\u017eaj za njihovu zamenu;\\n- za ponovno spu\u0161tanje metlica, okrenite
  klju\u010d u polo\u017eaj MAR-ON.\\n\\nVA\u017dNO: Vratite metlice brisa\u010da
  na vetrobransko staklo pre nego \u0161to ponovo aktivirate brisa\u010d vetrobranskog
  stakla i/ ili okrenete klju\u010d za paljenje u polo\u017eaj MAR-ON.\\n\\nZamena
  metlica brisa\u010da vetrobranskog stakla\\n\\nPostupite kao \u0161to slije:\\n\\n-
  podignite ru\u010dicu brisa\u010da, pritisnite jezi\u010dak A sl. 204 opruge za
  pri\u010dvr\u0161\u0107ivanje i skinite metlicu sa ru\u010dice;\\n- namestite novu
  metlicu, ubacivanjem jezi\u010dka u specijalan prorez u ru\u010dici i proverite
  da li je fiksirana.\\n- spustite ru\u010dicu brisa\u010da vetrobranskog stakla na
  vetrobransko staklo.\\n\\nNemojte uklju\u010divati brisa\u010d vetrobranskog stakla
  kada su metlice podignute sa vetrobranskog stakla.\\n\\nZamena metlice brisa\u010da
  zadnjeg stakla\\n\\nPostupite kao \u0161to slije:\\n\\n- podignite poklopac A sl.
  205, odvijte navrtku B i skinite ru\u010dicu C;\\n- postavite pravilno novu ru\u010dicu,
  zategnite do kraja navrtku B zatim spustite poklopac A.\\n\\nMLAZNICE PERA\u010cA
  VETROBRANSKOG STAKLA\\n\\nPera\u010d vetrobranskog stakla\\n\\nMlaznice pera\u010da
  vetrobranskog stakla A sl. 206 su fiksirane. Ukoliko nema mlaza te\u010dnosti, proverite
  prvo da li ima te\u010dnosti u rezervoaru (videti deo \\\"Kontrola nivoa te\u010dnosti\\\"
  u ovom poglavlju).\\n\\nZatim proverite da nisu zapu\u0161eni otvori mlaznica; upotrebite
  iglu da ih otpu\u0161ite, ukoliko je potrebno.\\n\\nVA\u017dNO: Kod verzija sa krovom
  na otvaranje, prvo zatvorite krov, pa onda uklju\u010dite mlaznice pera\u010da prozora.\\n\\nPera\u010d
  zadnjeg stakla\\n\\nMlaznice pera\u010da zadnjeg stakla su fiksirane. Dr\u017ea\u010d
  mlaznica nalazi se na zadnjem staklu sl. 207.\\n\\nKAROSERIJA\\n\\nZA\u0160TITA
  OD ATMOSFERSKIH AGENASA\\n\\nKaroserija vozila je od korozije za\u0161ti\u0107ena
  trenutno najboljim tehnolo\u0161kim re\u0161enjima.\\n\\nOva obuhvataju:\\n\\n-
  proizvode i sisteme za farbanje koji daju vozilu posebnu otpornost na koroziju i
  abraziju\\n- upotreba galvaniziranih (ili unapred za\u0161ti\u0107enih) limova,
  visoke otpornosti na koroziju\\n- prskanje donjeg dela karoserije, prostora za motor,
  unutra\u0161njosti lukova lima iznad to\u010dkova i drugih delova sa za\u0161titnim
  proizvodima od voska\\n- prskanje plasti\u010dnih delova sa za\u0161titnom funkcijom
  na izlo\u017eenijim mestima: ispod vrata, unutra\u0161nje krilo, ivice itd.\\n-
  upotreba \\\"otvorenih\\\" kutijastih delova kako bi se spre\u010dilo da kondenzacija
  i d\u017eepovi vlage uzrokuju r\u0111u sa unutra\u0161nje strane.\\n\\nGARANCIJA
  ZA KAROSERIJU I DONJI DEO KAROSERIJE\\n\\nVa\u0161e vozilo je pokriveno garancijom
  za perforacije nastale od korozije na bilo kom originalnom elementu strukture ili
  karoserije.\\n\\nZa op\u0161te uslove ove garancije, pogledajte va\u0161u Garantnu
  knji\u017eicu.\\n\\nODR\u017dAVANJE KAROSERIJE\\n\\nBoja\\n\\nPopravite odmah abrazije
  i ogrebotine kako biste spre\u010dili nastanak r\u0111e.\\n\\nOdr\u017eavanje boje
  se sastoji od pranja vozila: u\u010destalost zavisi od uslova i sredine u kojoj
  se vozilo koristi. Na primer, u visoko zaga\u0111enim podru\u010djima, ili ukoliko
  su putevi posuti solju, preporu\u010duje se \u010de\u0161\u0107e pranje vozila.
  Za pravilno pranje vozila, postupite kao \u0161to sledi:\\n\\n- skinite antenu sa
  krova kako biste spre\u010dili njeno o\u0161te\u0107enje ukoliko se vozilo pere
  u servisu za automatsko pranje;\\n- ukoliko se koriste mlazevi pod visokim pritiskom
  za pranje vozila, udaljite ih najmanje 40 cm od karoserije kako biste izbegli o\u0161te\u0107enje
  ili menjanje. Treba imati u vidu da nagomilavanje vode mo\u017ee da o\u0161te\u0107i
  vozilo tokom vremena;\\n- perite vozilo sa mlazom vode koji je pod niskim pritiskom;\\n-
  prema\u017eite karoseriju kori\u0161\u0107enjem sun\u0111era sa slabim rastvorom
  sapuna i \u010desto ispirajte sun\u0111er;\\n- isperite dobro vodom i osu\u0161ite
  mlazom vazduha ili jelenskom ko\u017eom.\\n\\nOsu\u0161ite manje vidljiva mesta
  (npr. okvire vrata, poklopac motora, okvire farova itd.) sa posebnom pa\u017enjom,
  po\u0161to voda mo\u017ee lak\u0161e da prodre u ove povr\u0161ine. Vozilo ne bi
  trebalo odmah ostaviti u zatvorenom prostoru, ve\u0107 ga treba ostaviti na otvorenom,
  kako bi preostala voda isparila.\\n\\nNemojte prati vozilo po\u0161to je stalalo
  na suncu ili kada je poklopac motora vru\u0107: ovo mo\u017ee da promeni sjaj boje.
  Spolja\u0161nje plasti\u010dne delove treba prati na isti na\u010din kao i ostale
  delove vozila.\\n\\nIzbegavajte \u0161to je mogu\u0107e vi\u0161e parkiranje ispod
  drve\u0107a; smola sa drve\u0107a matira boju i pove\u0107ava mogu\u0107nost korozije.\\n\\nVA\u017dNO:
  Pti\u010dji izmet treba odmah i dobro oprati, po\u0161to je kiselina koju on sadr\u017ei
  posebno agresivna.\\n\\nDeterd\u017eenti zaga\u0111uju \u017eivotnu sredinu. Perite
  vozilo samo na povr\u0161inama koje imaju mogu\u0107nost skupljanja i prerade otpadne
  vode koja nastane pranjem vozila.\\n\\nNemojte koristiti abrazivne proizvode ili
  sredstva za poliranje za pranje vozila kako biste sa\u010duvali lep izgled boje.\\n\\nProzori\\n\\nKoristite
  specijalne deterd\u017eente i \u010diste krpe kako biste spre\u010dili nastanak
  ogrebotina ili gubitak providnosti.\\n\\nVA\u017dNO: Pa\u017eljivo izbri\u0161ite
  unutra\u0161nju povr\u0161inu zadnjeg stakla sa krpom u pravcu vlakana kako biste
  izbegli o\u0161te\u0107enje grejnog ure\u0111aja.\\n\\nPrednji farovi\\n\\nKoristite
  mekanu, vla\u017enu krpu natopljenu vodom i deterd\u017eentom za pranje vozila.\\n\\nVA\u017dNO:
  Nikada nemojte koristiti aromati\u010dne supstance (npr. benzin) ili ketene (npr.
  aceton) za \u010di\u0161\u0107enje plasti\u010dnih so\u010diva prednjih farova.\\n\\nVA\u017dNO:
  Kada perete sa pera\u010dem pod pritiskom, dr\u017eite mlaz vode najmanje 20 cm
  od farova.\\n\\nProstor za motor\\n\\nNa kraju svake zime, dobro operite prostor
  za motor; paze\u0107i da ne usmerite mlaz vode direktno na elektronske kontrolne
  jedinice ili motore brisa\u010da vetrobranskog stakla. Neka vam ovo uradi stru\u010dno
  osoblje u radionici.\\n\\nVA\u017dNO: Pranje treba uraditi kada je motor hladan,
  a klju\u010d za paljenje u polo\u017eaju STOP. Posle pranja, obavezno proverite
  da nisu skinuti ili o\u0161te\u0107eni razni za\u0161titni ure\u0111aji (npr. gumene
  kape i za\u0161titni poklopci).\\n\\nENTERIJER\\n\\nProveravajte povremeno da li
  je ostala voda ispod tepiha, koja bi mogla da uzrokuje r\u0111u na limenim povr\u0161inama.\\n\\nUPPOZORENJE\\n\\nNikada
  nemojte koristiti zapaljive proizvode, kao \u0161to je petrol etar ili pre\u010di\u0161\u0107eni
  benzin za \u010di\u0161\u0107enje enterijera vozila. Elektrostaticki naboj koji
  nastaje trljanjem tokom \u010di\u0161\u0107enja mo\u017ee da uzrokuje po\u017ear.\\n\\nUPPOZORENJE\\n\\nNemojte
  dr\u017eati kantice aerosola u vozilu: mogle bi da eksplodiraju. Kantice aerosola
  ne smeju biti izlo\u017eene temperaturama ve\u0107im od 50\u00b0C. Temperature u
  vozilu izlo\u017eenom suncu mogu z\u043d\u0430\u0442\u043d\u043e da pre\u0111u ovu
  vrednost.\\n\\nSEDI\u0160TA I DELOVI OD \u0160TOFA\\n\\nO\u010distite pra\u0161inu
  sa mekom \u010detkom ili usisiva\u010dem. Preporu\u010dujemo vam da koristite vla\u017enu
  \u010detku po somotskom tapacirungu.\\n\\nSedi\u0161ta istrljajte sa sun\u0111erom
  i rastvorom vode i blagog sapuna.\\n\\nPLASTI\u010cNI I OBLO\u017dENI DELOVI\\n\\n\u010cistite
  unutra\u0161nje plasti\u010dne delove sa vla\u017enom krpom (ukoliko je mogu\u0107e
  od mikrofibra) i rastvorom vode i neutralnog, neabrazivnog deterd\u017eenta. Za
  \u010di\u0161\u0107enje masnih ili upornih mrlja, koristite specijalne proizvode
  koji ne sadr\u017ee rastvara\u010de i koji su predvi\u0111eni za odr\u017eavanje
  originalnog izgleda i boja komponenata.\\n\\nO\u010distite pra\u0161inu kori\u0161\u0107enjem
  krpe od mikrofibera, ukoliko je potrebno, ovlazenu vodom. Upotreba papirnih maramica
  se ne preporu\u010duje, po\u0161to one mogu da ostave tragove.\\n\\nVA\u017dNO:
  Nemojte nikada koristiti alkohol ili petrolej za \u010di\u0161\u0107enje instrument
  plo\u010de.\\n\\nKO\u017dNI DELOVI\\n(za verzije / tr\u017ei\u0161ta za koje je
  predvi\u0111eno)\\n\\nKoristite samo vodu i neutralan sapun za \u010di\u0161\u0107enje
  ovih delova. Nikada nemojte koristiti alkohol ili proizvode na bazi alkohola. Pre
  kori\u0161\u0107enja specijalnih proizvoda za \u010di\u0161\u0107enje enterijera,
  proverite da ne sadr\u017ee alkohol i/ili supstance na bazi alkohola.\\n\\nTEHNI\u010cKE
  SPECIFIKACIJE\\n\\nIDENTIFIKACIONI PODACI\\n\\nPreporu\u010dujemo vam da zabele\u017eite
  identifikacione \u0161ifre. Slede\u0107e identifikacione \u0161ifre od\u0161tampane
  su i prikazane na plo\u010dicama:\\n\\n- VIN plo\u010dica (plo\u010dica sa identifikacionim
  brojem vozila)\\n- oznaka \u0161asije\\n- identifikaciona plo\u010dica boje karoserije\\n-
  oznaka motora\\n\\nVIN PLO\u010cICA\\n\\nStavlja se na levu stranu prtlja\u017enika
