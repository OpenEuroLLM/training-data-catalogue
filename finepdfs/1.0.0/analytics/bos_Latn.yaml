  TRACK NUMBER (emituj datoteku broj) <5>\\nEmituj datoteku broj \\\"5\\\" (videti
  NAPOMENU 9)\\n\\nCHANGE (emituj \u017eanr) <Jazz> (d\u017ee\u017e)\\nIzaberij USB
  medij kao aktivni audio izvor (videti NAPOMENU 10)\\n\\nSHOW (poka\u017ei) <Album>\\nPrika\u017ei
  listu raspolo\u017eivih albuma (videti NAPOMENE 1 i 11)\\n\\nNAPOMENE\\n\\n1. Multimedijski
  fajlovi memorisani u izvorima MEDIJA (USB, iPod preko USB, MP3 CD) treba da imaju
  pravilno pode\u0161ene informacije o pesmama (naslov pesme, izvo\u0111a\u010d, album,
  \u017eanr, podkast, audio knjiga) ina\u010de ne\u0107e biti dostupni putem govornih
  komandi.\\n\\n2. <Volare> se mo\u017ee zameniti bilo kojim drugim naslovom pesme
  koja je na raspolaganju u uba\u010denom i aktivnom izvoru MEDIJA (raspolo\u017eivim
  na USB, iPod preko USB, MP3 CD).\\n\\n3. <I Giardini di Marzo> se mo\u017ee zameniti
  bilo kojim drugim naslovom albuma koji je na raspolaganju u uba\u010denom i aktivnom
  izvoru MEDIJA (raspolo\u017eivim na USB, iPod preko USB, MP3 CD).\\n\\n4. <Lucio
  Battisti> se mo\u017ee zameniti bilo kojim drugim imenom izvo\u0111a\u010da koji
  je na raspolaganju u uba\u010denom i aktivnom izvoru MEDIJA (raspolo\u017eivim na
  USB, iPod preko USB, MP3 CD).\\n\\n5. <Jazz> se mo\u017ee zameniti sa bilo kojim
  drugim \u017eanrom koji je na raspolaganju u uba\u010denom i aktivnom izvoru MEDIJA
  (raspolo\u017eivim na USB, iPod preko USB, MP3 CD).\\n\\n6. <Recent> se mo\u017ee
  zameniti sa bilo kojim drugim nazivom plejliste raspolo\u017eivom u uba\u010denom
  i aktivnom izvoru MEDIJA (raspolo\u017eivim na USB, iPod preko USB, MP3 CD).\\n\\n7.
  <Radio I> se mo\u017ee zameniti bilo kojim drugim nazivom podkasta raspolo\u017eivim
  u uba\u010denom i aktivnom izvoru MEDIJA (raspolo\u017eivim na iPod preko USB).\\n\\n8.
  <Bo\u017eanstvena komedija> se mo\u017ee zameniti sa bilo kojim drugim naslovom
  audio knjige raspolo\u017eivim u uba\u010denom i aktivnom izvoru MEDIJA (raspolo\u017eivim
  na iPod preko USB).\\n\\n9. <5> se mo\u017ee zameniti sa bilo kojim brojem datoteke
  raspolo\u017eivim u uba\u010denom i aktivnom izvoru MEDIJA (raspolo\u017eivim na
  audio CD).\\n\\n10. <USB> se mo\u017ee zameniti sa bilo kojim drugim izvorom MEDIJA:
  USB, iPod, CD, AUX i Bluetooth.\\n\\n11. <Album> se mo\u017ee zameniti sa bilo kojom
