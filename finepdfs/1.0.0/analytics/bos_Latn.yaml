  smetnjama i te\u0161ko\u0107ama u razvoju \u201cBiseri\u201c Budva\\n\\n1. Daje
  se saglasnost na Statut Javne Ustanove Dnevni centar za djecu i omladinu sa smetnjama
  i te\u0161ko\u0107ama u razvoju \u201cBiseri\u201c Budva broj: 487 od 15.08.2020.
  godine, koji je\\n\\ndonio Upravni odbor na sjednici odr\u017eanoj dana 15.08.2020.
  godine.\\n\\n2. Rje\u0161enje stupa na snagu danom dono\u0161enja, a objavi\u0107e
  se u \u201eSlu\u017ebenom listu Crne Gore-\\n\\nOp\u0161tinski propisi\\\".\\n\\nBroj:10-040/20-617/1
  Budva, 22. avgust 2020. godine\\n\\nSKUP\u0160TINA OP\u0160TINE BUDVA PREDSJEDNICA,\\n\\nAn\u0111ela
  Ivanovi\u0107\"", "\"Na osnovu \u010dlana 70. Zakona o javnim nabavkama (\\\"Slu\u017ebeni
  glasnik BiH\\\", broj 39/14) i Pravilnika o javnim nabavkama JP Cesta Federacije
  BiH d.o.o. Sarajevo, i u skladu sa preporukom Komisije za nabavke Uprava donosi\\n\\nODLUKU\\n\\no
  dodjeli ugovora za nabavku usluga izrade a\u017eurirane studije utjecaja na okoli\u0161
  (EIA) i procjene utjecaja na socijalne aspekte za dionicu Neum-Stolac ponu\u0111a\u010du
  Ecoplan d.o.o. Mostar\\n\\nI\\n\\nNa osnovu odluke o pokretanju postupka javne nabavke
  predmetnih usluga proveden je konkurentski postupak. Obavje\u0161tenje o nabavci
  je objavljeno na Portalu javnih nabavki dana 11.09.2015. godine. Izvr\u0161eno je
  prikupljanje, otvaranje, analiza i ocjena ponuda.\\n\\nDo utvr\u0111enog roka dostavljeno
  je 6 (\u0161est) ponuda koje je Komisija na otvorenom sastanku otvorila dana 28.09.2015.godine
  u 12.30 sati:\\n\\n| Ponu\u0111a\u010d                        | Cijena KM bez PDV-a
  | Cijena KM s PDV-om |\\n|--------------------------------|---------------------|--------------------|\\n|
  IG d.o.o. Banja Luka           | 16.690,00           |                    |\\n|
  Zagrebinspekt d.o.o. Mostar    | 19.527,30           |                    |\\n|
  AD Projekt Banja Luka          | 25.270,00           |                    |\\n|
  CETEOR d.o.o. Sarajevo         | 29.565,90           |                    |\\n|
  Konzorcij Dvokut Pro d.o.o. Sarajevo, Enova d.o.o. Sarajevo, Institut za hidrotehniku
  GF Sarajevo | 30.000,00           |                    |\\n| Ecoplan d.o.o. Mostar          |
  35.100,00           |                    |\\n\\nAnalizom primljenih ponuda, Komisija
  je u svom Izvje\u0161taju br.01-02.3-63782-4/15 od 06.10.2015.godine utvrdila da
  je navedeni ponu\u0111a\u010d dostavio najpovoljniju ponudu, za dodjelu ugovora
  za nabavku predmetnih usluga, prema kriteriju najni\u017ea cijena utvr\u0111enim
  u tenderskoj dokumentaciji, te je u skladu s tim dala preporuku Upravi da ovaj ugovor
  za nabavku usluga izrade a\u017eurirane studije utjecaja na okoli\u0161 (EIA) i
  procjene utjecaja na socijalne aspekte za dionicu Neum-Stolac, dodijeli ponu\u0111a\u010du
  Ecoplan d.o.o. Mostar.\\n\\nPonu\u0111a\u010d Ecoplan d.o.o. Mostar je du\u017ean
  u skladu sa zahtjevima iz tenderske dokumentacije \u010dlan 4.2. stav (a) dostaviti
  originale ili ovjerene kopije dokumenta iz \u010dlana 45.stav (2) Zakona o javnim
  nabavkama. Ukoliko izabranu ponu\u0111a\u010d ne dostavi tra\u017eenu dokumentaciju
  u odre\u0111enom roku, ugovor za javnu nabavku dodijelit \u0107e se drugorangiranom
  ponu\u0111a\u010du u skladu sa \u010dlanom 72. stav 3. Zakona o javnim nabavkama.\\n\\nCijene\u0107i
  navedeno, Uprava donosi odluku kao u dispozitivu.\\n\\nII\\n\\nPo okon\u010danju
  roka za \u017ealbu, ugovorni organ \u0107e pozvati odabranog ponu\u0111a\u010da
  na zaklju\u010denje ugovora kojim \u0107e se regulisati me\u0111usobna prava i obaveze
  vezane za predmetnu nabavku shodno nacrtu ugovora datom u tenderskoj dokumentaciji.\\n\\nPravna
  pouka:\\n\\nProtiv ove Odluke mo\u017ee se izjaviti \u017ealba, najkasnije u roku
  od 5 (pet) dana od dana prijema ove Odluke.\\n\\n\u017dalba se izjavljuje Kancelariji
  za razmatranje \u017ealbi Bosne i Hercegovine, putem ugovornog organa u pisanoj
  formi direktno ili preporu\u010denom po\u0161tanskom po\u0161iljkom na adresu ugovornog
  organa. \u017dalba se podnosi u najmanje 3 (tri) primjerka.\\n\\nv.d. Direktora:\\nLjubo
  Pravdi\u0107, dipl.ing.gra\u0111.\"", "\"SEKS-AFERA\\n\\nAdvokati prof. Lu\u010di\u0107a
  tvrde da Tu\u017eila\u0161tvo nema dokaze\\n\\nZa\u0161to su studentice mijenjale
  iskaz\\n\\nProces je pun nelogi\u010dnosti, tvrdi advokatski tim prof. Lu\u010di\u0107a\\n\\nU
  Op\u0107inskom sudu Tu\u017eila danas \u0107e biti nastavljeno su\u0111enje profesorima
  Zdravku Lu\u010di\u0107u i Enesu Durmi\u0161evi\u0107u, koji se tere\u0107e da su
  po\u010dinili krivi\u010dna djela u predmetu poznatom kao seksafera na Pravnom fakultetu.
  U optu\u017enici se navodi da su krivi\u010dna djela po\u010dinili dok su radili
  kao profesori na tu\u017eila\u0161kom odjeljenju Pravnog akulteta Sarajevo.\\n\\nDodatni
  pritisak\\n\\nDurmi\u0161evi\u0107a optu\u017enica te\u017ei da krivi\u010dno djelo
  spolni odnosaj kao zloupotrebu pozajma, dok se Lu\u010di\u0107 tereti da je 17.
  oktobra 2003. godine, bez dolaganja ispita iz predmeta Rimsko pravo, upisao pozitivnu
  ocjenu studentici Jeleni Had\u017ei\u0107-Hribar. On se sumnji\u010di da je 17.
  juna 2006., bez poagjanja ispita, studenticama Jasmi Ma\u0161i\u0107u i Selmi Troki\u0107
  upisao pozitivne ocjene iz predmeta Institucije rimskog prava i Pravne kulture.\\n\\nRagib
  Had\u017ei\u0107 i Almin Datutbegovi\u0107, koji \u010dine advokatski tim prof.
  Lu\u010di\u0107a, komentiraju\u0107i ovaj slu\u010daj, kazali su da Tu\u017eila\u0161tvo
  ne posjeduje kvalitete doksne dokaze i da u presudnim momentima procesa uklju\u010duje
  medije da bi se izvr\u0161io pritisak.\\n\\nFilozofija optu\u017enice je da tu\u017eilac
  treba dokazati navode putem svjedo\u010denja \u010detiri djevojke, biv\u0161e studentice
  i voza\u010da Jasmina Ma\u0161i\u0107a. Da bi se ovo pretvorilo u presudu, ove djevojke
  bi morale kazati da je sve ta\u010dno \u0161to pi\u0161e u optu\u017enici. To zna\u010di
  da i same priznaju krivi\u010dno djelo. Me\u0111utim, takav imunitet one nisu dobile.
  I, naravno, na glavnom pretresu one negiraju da je ista ta\u010dno iz optu\u017enice
  - navodi Datutbegovi\u0107. Poznato je da je tu\u017eilac nakon toga posegnuo za
  ranijim iskazima iz istrage, jer su tokom pretresa studentice kazale ono \u0161to
  je u suprotnosti s optu\u017enicom.\\n\\nTo nas dovodi do saznanja da su studentice
  mnogo puta tokom isprave ispitivane. I svaki put su druga\u010dije govorile. Sporno
  je to \u0161to se proces protiv njih izgubio, ne znamo kako je zavr\u0161en, ako
  je istraga otvorena i ako su bile osumnji\u010dene - ka\u017ee Datutbegovi\u0107.\\n\\nNajva\u017eniji
  dogadaj u ovom sudskom postupku je, kako tvrdi Had\u017ei\u0107, poku\u0161aj tu\u017eilaca
  da na voza\u010da Jasmina Ma\u0161i\u0107a izvr\u0161i pritisak da bi postao svjedok
  optu\u017enice.\\n\\nPredlo\u017eili su Ma\u0161i\u0107a kao svjedoka optu\u017enice.
  Dobio sam predmet od ranije advokata i vidim da nema ni jednog Ma\u0161i\u0107evog
  iskaza iz ranije istrage, \u0161to je bilo neobi\u010dno. To je svojevrsni paradoks,
  pozivaju ga da bude svjedok, a nema iskaza. Na kraju nije ni svjedo\u010dio, a kon\u010da
  smo predo\u017eili bude svjedok odrane - govori Had\u017ei\u0107.\\n\\nUnakrsno
  ispitivanje\\n\\nUslijedilo je unakrsno ispitivanje u kojem Ma\u0161i\u0107 tvrdi
  da je mnogo puta bio Tu\u017eila\u0161tvu.\\n\\nPrema njegovom kazivanju, tu\u017eioc
  Dragan Rado\u010dnovi\u0107 i Mirzeta Begi\u0107 su ga u svom kabinetu nagovarali
  bude svjedok protiv profesora i da potvrdi navod optu\u017enice - ka\u017ee Had\u017ei\u0107.\"",
  "\"Amir Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog prou e\u0161kih\\n\\n\u010d\\n\\ninovnika
  u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nDOI\\n\\n10.51558/2490-3647.2022.7.3.107\\n\\nUDK
  94(497.6)\\\"1884/1914\\\"\\n\\nPrimljeno: 02. 06. 2022.\\n\\nPregledni rad\\n\\nReview
  paper\\n\\nAmir Krpi\u0107\\n\\nPREGLED \u010cE\u0160KIH \u010cINOVNIKA U UPRAVI
  TUZLANSKOG OKRUGA (1884-1914): PRILOG PROU\u010cAVANJU U\u010cE\u0160\u0106A \u010cEHA
  U UPRAVI BOSNE I HERCEGOVINE\\n\\nU ovom radu dat je pregled \u010de\u0161kih \u010dinovnika
  u upravi Okruga Donja Tuzla u vremenu austrougarske vladavine u Bosni i Hercegovini.
  Rad je napisan u okviru autorovih obaveza na doktorskom studiju, te mu je svrha
  da bude osnova za daljnja istra\u017eivanja u\u010de\u0161\u0107a \u010ceha u bosanskohercegova\u010dkoj
  upravi austrougarskog perioda. Rad je napisan na osnovu \u0161ematizama objavljenih
  u kalendaru lista \u201eBo\u0161njak\\\", zvani\u010dnih izvje\u0161taja o upravi,
  zakona i naredbi koje je vlast donosila za Bosnu i Hercegovinu, listova i relevantne
  literature. Op\u0107i zaklju\u010dak je da su \u010cesi bili veoma brojni stranci
  na slu\u017ebi u upravi tuzlanskog okruga, da su bili prisutni i na okru\u017enom
  i na kotarskom nivou, da ih je bilo u svim kotarima tuzlanskog Okruga, kao i u svim
  odjeljenjima ili kategorijama uprave.\\n\\nKlju\u010dne rije\u010di: \u010dinovnici;
  \u010cesi; uprava; tuzlanski Okrug; Austro-Ugarska\\n\\nUVODNE NAPOMENE\\n\\nOvaj
  rad je ve\u0107im dijelom napisan na osnovu podataka iz objavljenih \u0161ematizama,
  prostim prebrojavanjem \u010dinovnika, pa iz tih razloga vrijedi na po\u010detku
  ostaviti odre\u0111ene napomene. Objavljeni \u0161ematizmi nisu sadr\u017eavali
  podatke o nacionalnoj (ili etni\u010dkoj) pripadnosti \u010dinovnika, tako da se
  s tim u vezi metod rada svodio na prepoznavanje karakteristi\u010dnih \u010de\u0161kih
  imena ili, \u010de\u0161\u0107e, prezimena \u010dinovnika. Imena su te\u017ee otkrivala
  \u010de\u0161ku nacionalnost jednog \u010dinovnika i zbog toga \u0161to su prire\u0111iva\u010di\\n\\nPrilog
  prou\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\n\u0161ematizama
  \u010desto neka imena pisali po doma\u0107em, a ne izvornom izgovoru. 1 Primjera
  radi, u \u0161ematizmu su navedeni Franjo Kola\u0159 (Bo\u0161njak 1907: 23) i Franjo
  Kotr\u010d (Bo\u0161n\u00ad jak 1911: 77) za osobe koje su se zvale Franti\u0161ek
  Kol\u00e1\u0159 (Balaban 2009: 131) i Fran\u00ad ti\u0161ek Kotr\u010d (Balaban
  2009: 132); zatim je naveden Antun B\u0159e\u0161tan (Bo\u0161njak 1908: 32) koji
  se zapravo zvao Anton\u00edn B\u0159e\u0161\u0165an (Balaban 2009: 134), te Josip
  \u0160imerka (Bo\u0161njak 1911: 78) kojemu je pravo ime zapravo bilo Josef \u0160ime\u010dka
  (Balaban 2009: 136). Ipak, imena \u010dinovnika navodit \u0107e se kako su zapisana
  u \u0161ematizmima, iako je izvjesno da se izvorno malo druga\u010dije pi\u0161u
  (npr. V\u00e1clav Podh\u016frsk\u00fd umjesto Vencel Podhursky i sl.)\\n\\nPrezimena
  su, prema tome, bila ne\u0161to sigurniji pokazatelj da se radi o \u010de\u0161kim
  \u010dinovnicima, budu\u0107i da su \u010de\u0161ka prezimena u zna\u010dajnom broju
  slu\u010dajeva karakteristi\u010dna i ne tako te\u0161ko prepoznatljiva. 2 Ovdje,
  ipak, treba imati na umu jednu va\u017enu \u010dinjenicu. Naime, usljed dugotrajnog
  zajedni\u010dkog \u017eivota Nijemaca i \u010ceha, kako u \u010de\u0161kim zemljama,
  tako i izvan njih, do\u0161lo je do toga da su brojni Nijemci vremenom \u201epostali\\\"
  \u010cesi i obratno \u2013 u zavisnosti od toga sa kojom ve\u0107inskom zajednicom
  su pojedinci ili manje grupe \u017eivjeli. To je u kona\u010dnici dovelo do toga
  da su i u vremenu o kojem je ovdje rije\u010d, neki \u010cesi nosili karakteristi\u010dna
  njema\u010dka prezimena i obratno. Primjer toga su, recimo, Anton\u00edn B\u00f6hm
  ili Karel Fasse (Vo\u0161ahlikov\u00e1 1998: 77, 244), a tako\u0111er tu je i dobro
  poznat slu\u010daj Anne Bayerove. 3 Sa druge strane, poznat je primjer njema\u010dkog
  pisca knjiga za djecu, Otfrieda Preu\u00dflera, kojem je ro\u0111eno prezime zapravo
  bilo Syrowatka \u2013 tako da se, dakle, radi o Nijemcu sa karakteristi\u010dnim
  \u010de\u0161kim prezimenom (do promjene prezimena). 4\\n\\nKod prepoznavanja prezimena
  olak\u0161icu je predstavljalo i to \u0161to su novija izdanja \u0161ematizama donosila
  i preciznije pisanje stranih imena i prezimena. Budu\u0107i da skoro svaki jezik
  ima bar po ne\u010demu prepoznatljivu ortografiju, izvorno pisanje imena i prezimena
  bilo je od velike pomo\u0107i. U slu\u010daju \u010ceha, konkretno, od pomo\u0107i
  su bili grafemi \u011b, \u0159, \u00fd, \u00e1, \u00ed, \u00e9 \u2013 kojih nema
  u drugim slavenskim jezicima, tj. kod drugih slavenskih naroda Monarhije. Izuzetak
  su \u010cesima najbli\u017ei Slovaci, pa je sasvim mogu\u0107e da se u nekim slu\u010dajevima
  radilo i o \u010dinovniku slova\u010dkog porijekla. Me\u0111utim, Slovaka je generalno
  bilo veoma malo o austrougarskoj upravi u Bosni i Hercegovini,\\n\\n1 Tako su, recimo,
  u ve\u0107ini slu\u010dajeva pisali Karlo bez obzira na izvornu verziju istog imena
  \u010dinovnika koji dolazi iz drugog govornog podru\u010dja (za Nijemce je karakteristi\u010dno
  Karl, za \u010cehe i Slovence Karel, za Italijane Carlo, za Poljake i Slovake Karol
  itd). Isto vrijedi za verzije imena Franjo (Franz/Franti\u0161ek/Ferenc/Franciszek/Fran\u010di\u0161ek
  itd.). Tako\u0111er se mo\u017ee primijetiti da su skoro uporedo kori\u0161tene
  razli\u010dite verzije imena Ivan (Jan, J\u00e1n, Janez, Jovan). Sli\u010dno vrijedi
  i za imena koja su kod nas naj\u010de\u0161\u0107e u obliku Josip, Antun, Ljudevit
  i sl.\\n\\n2 Kao jedan vid potvrde da se radi o \u010de\u0161kim prezimenima, kori\u0161ten
  je online leksikon \u010de\u0161kih imena i prezimena: https://www.kdejsme.cz\\n\\n3
  Vi\u0161e o njoj: Ne\u010das (1992), Fuchs, Tahirovi\u0107 (2019).\\n\\n4 O \u010de\u0161ko-njema\u010dkim
  prezimenima op\u0161irnije: Bene\u0161 (1998) i \u0160milauer (1936).\\n\\npa su
  i \u0161anse za gre\u0161ke srazmjerno male. Recimo, prema izvje\u0161tajima o upravi,
  Slovaka je 1906. godine na slu\u017ebi u Bosni i Hercegovini bilo samo 0,38% (brojem
  samo 34), dok je kod \u010ceha taj postotak iznosio 11,63. Pet godina kasnije samo
  0,33% (brojem 37) \u010dinovnika u Bosni i Hercegovini bili su Slovaci, dok su \u010cesi
  \u010dinili 10,97% ukupnog broja \u010dinovnika. Ne ra\u010dunaju\u0107i doma\u0107e
  \u010dinovnike, u oba slu\u010daja je samo Nijemaca bilo vi\u0161e od \u010ceha
  (Izvje\u0161taj 1906: 27, Izvje\u0161taj 1911: 9). Stoga, dakle, mogu\u0107nost
  za gre\u0161ke postoji, ali je ona minimalna.\\n\\nU \u0161ematizmu, koji se redovno
  objavljivao u kalendaru lista Bo\u0161njak 5 od 1884. godine do kraja austrougarske
  uprave, na podru\u010dju Okruga Donja Tuzla prona\u0161li smo 147 \u010de\u0161kih
  \u010dinovnika. Broj funkcija koje su oni obavljali je ne\u0161to ve\u0107i, budu\u0107i
  da su neki od njih obavljali dvije, a neki i tri razli\u010dite funkcije ili iste
  funkcije u razli\u010ditim mjestima. U ovom radu oni \u0107e biti predstavljeni
  prema svojoj funkciji, odnosno prema kategoriji uprave kojoj su pripadali. Glavne
  kategorije uprave na koje smo razvrstali sve \u010dinovnike su: politi\u010dka,
  pravosudna, finansijska, gra\u0111evinska, rudarska, \u0161umarska, \u017eeljezni\u010dka
  i \u017eandarmerijska, a tu je jo\u0161 nekoliko podru\u010dja u kojima je radilo
  tek nekoliko \u010dinovnika.\\n\\nNa kraju, vrijedi ostaviti i uvodnu napomenu u
  vezi sa navo\u0111enjem podataka iz \u0161ematizama objavljenih u spomenutim kalendarima.
  Uredni\u0161tvo lista Bo\u0161njak je stranice na kojima se nalazi \u0161ematizam
  numerisalo od po\u010detka, tako da se i brojevi stranica u ovom radu, navo\u0111eni
  u nekim napomenama, odnose na broj stranice u \u0161ematizmu, a ne u cijelom broju
  kalendara. Tako\u0111er, \u010dinovni\u010dka zvanja, funkcije koje su obavljali
  i dijelovi uprave kojima su pripadali navo\u0111eni su izvorno kako stoji u \u0161ematizmu.\\n\\nTERMINOLOGIJA\\n\\nU
  ovom radu navode se mnogi pojmovi koji su se tada koristili u upravnom sistemu,
  a vremenom su djelomi\u010dno ili u cijelosti nestali, odnosno potisnuti su iz upotrebe
  u korist drugih, modernijih pojmova. S obzirom da su podaci iz \u0161ematizama direktno
  preuzimani, u tekstu i prilo\u017eenim tabelama na kraju rada ti pojmovi su izvorno
  navo\u0111eni. S tim u vezi, ovdje \u0107emo abecednim redom navesti te ''sporne''
  pojmove i ukratko navesti njihova zna\u010denja.\\n\\n5 List Bo\u0161njak pokrenut
  je s ciljem promocije bo\u0161nja\u010dkog narodnog imena i bosanskog jezika. Njegov
  pokreta\u010d bio je Mehmed-beg Kapetanovi\u0107 Ljubu\u0161ak. Namijenjen je bio
  \u0161irim, prvenstveno muslimanskim dru\u0161tvenim krugovima. U pogledu nacionalnog
  pitanja bio je na liniji K\u00e1llayevog interkonfesionalnog bo\u0161nja\u0161tva,
  te su mu suprotstavljeni listovi \u010desto prisipivali prore\u017eimski kurs. Uredni\u0161tvo
  lista redovno je izdavalo i godi\u0161nje kalendare, koji su kori\u0161teni za pisanje
  ovog rada. Op\u0161irnije vidjeti: Kru\u0161evac (1978), Solak (2014).\\n\\nPrilog
  prou\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nPrvi me\u0111u
  njima je pojam aspirant. Ozna\u010dava odre\u0111eni \u010din u datoj hijerarhiji
  prije postizanja zavr\u0161nog ranga. Ukratko, pojam se mo\u017ee u savremenom jeziku
  ozna\u010diti kao pripravnik. Zatim imamo pojam auskultant. Rije\u010d je o jednom
  od naj\u010de\u0161\u0107ih pojmova koji se navodi u radu, a odnosi se na oblast
  pravosu\u0111a. U savremenom jeziku to je sudski pripravnik. Sljede\u0107i pojam
  sa kojim se sre\u0107emo je kancelista. Tako\u0111er je rije\u010d o \u010desto
  kori\u0161tenom pojmu, koji se mo\u017ee poistovijetiti sa pojmom pisar. Jo\u0161
  jedan od pojmova koji je vremenom skoro u potpunosti i\u0161\u010dezao je lugar,
  ili savremenim jezikom re\u010deno \u0161umar. Dalje se \u010desto sre\u0107e pojam
  manipulativni \u010dinovnik. Ovaj pojam ozna\u010davao je \u010dinovnika, uglavnom
  u finansijskim odjeljenjima uprave, \u010diji opis poslova mo\u017eemo objasniti
  pojmom manipulacija. Naime, jedno od zna\u010denja pojma manipulacija je \u201eutjecanje
  na porast ili pad cijena umjetnim putem u \u010demu sudjeluje neki investitor ili
  u dogovoru vi\u0161e njih\\\". U upravi rudarskih poslova nailazimo i na ne u cijelosti
  i\u0161\u010dezao, ali uglavnom napu\u0161ten pojam me\u0161tar. Rije\u010d je o
  pojmu kojim se ozna\u010davao majstor svoga posla ili zanimanja. Zatim imamo pojam
  perovo\u0111a, koji je ozna\u010davao ni\u017eeg administrativnog \u010dinovnika
  ili pisara. Veoma \u010dest pojam tako\u0111er je i pojam pristav, naj\u010de\u0161\u0107e
  kori\u0161ten u pravosudnim organima, a koji je ozna\u010davao pomo\u0107nog sudskog
  (ili uop\u0107e upravnog) \u010dinovnika. Na jednom mjestu susre\u0107emo i pojam
  re\u0161picient, koji je ozna\u010davao \u010dinovnika finansijske stra\u017ee.
  Na kraju tu je i pojam vje\u017ebenik, koji se danas vrlo rijetko susre\u0107e u
  upotrebi, a ozna\u010dava nekoga ko je po\u010detnik u odre\u0111enom poslu. Za
  nekoga ko je prije ne\u0161to vi\u0161e od jednog stolje\u0107a obavljao posao vje\u017ebenika,
  danas bi se moglo re\u0107i da je bio praktikant ili pripravnik. U \u0161ematizmu
  susre\u0107emo i pojam koji se navodi u radu na vi\u0161e mjesta, a rije\u010d je
  o pojmu elev (elev za evidenciju). Upore\u0111ivanjem se mo\u017ee konstatovati
  da je rije\u010d o pojmu koji je imao potpuno ili pribli\u017eno identi\u010dno
  zna\u010denje kao i geometar. U \u0161ematizmima se ta dva pojma na neki na\u010din
  prepli\u0107u, pa se \u010dak i u razli\u010ditim godinama koriste za iste osobe
  ili na istom mjestu za razli\u010dite osobe.\\n\\nSva obja\u0161njenja gore navedenih
  pojmova donesena su konsultovanjem hrvatskog rje\u010dni\u010dkog portala. 6 Razlog
  za konsultovanje hrvatskog rje\u010dnika le\u017ei u tome \u0161to je u jeziku \u0161tampe
  \u2013 lista Bo\u0161njak i Zbornika zakona i naredaba me\u0111u ostalim \u2013
  u Bosni i Hercegovini u nazna\u010denom periodu preovladavala hrvatska terminologija,
  posebno u upravi i posebno u prvim godinama austrougarske vladavine. 7\\n\\n***\\n\\nOkupacija
  Bosne i Hercegovine u austrougarskom politi\u010dkom vrhu pra\u0107ena je stavom
  o izbjegavanju radikalnih promjena postoje\u0107eg stanja, odnosno o potrebi oslanjanja\\n\\n6
  https://hjp.znanje.hr/index.php?show=main\\n\\n7 Op\u0161irnije vidjeti Bakovi\u0107
  (2019). Up. Solak (2014).\\n\\nPrilog prou\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nna osmansko socijalno-politi\u010dko
  naslije\u0111e (Kasumovi\u0107 2019). U tom smislu, upravnoteritorijalno ure\u0111enje
  habsbur\u0161ke Bosne i Hercegovine naslije\u0111eno je iz kasnoosmanskog Bosanskog
  vilajeta. Sand\u017eaci su postali okruzi, kaze su postale kotari, a nahije kotarske
  ispostave (Imamovi\u0107 2007). Sjeveroisto\u010dni dio Bosne i Hercegovine, odnosno
  nekada\u0161nji Zvorni\u010dki sand\u017eak postao je, prema tome, Okrug (Donja)
  8 Tuzla. Prema podacima iz prvog austrougarskog popisa stanovni\u0161tva neposredno
  nakon okupacije, ovaj okrug imao je kotare Donja Tuzla, Bijeljina, Br\u010dko, Gra\u010danica,
  Grada\u010dac, Maglaj, Ora\u0161je, Srebrenica, Vlasenica i Zvornik (HauptUebersicht
  1880). Ubrzo je, me\u0111utim, do\u0161lo do promjena. Ora\u0161je je izgubilo status
  kotara i svedeno je najprije u rang gradske op\u0107ine (Ortschafts 1886), da bi
  potom bilo uspostavljeno kao kotarska ispostava u sastavu kotara Br\u010dko (ABH-ZVS
  1884: k35, 1/3). S druge strane, tuzlanskom Okrugu je iz sarajevskog priklju\u010den
  kotar Kladanj naredbom Zemaljske vlade od 22. maja 1883. godine, koja je stupila
  na snagu 1. jula te godine (Zbornik 1883: 125).\\n\\nOd ve\u0107ih upravno-teritorijalnih
  promjena treba izdvojiti i podjelu tuzlanskog kotara na gradski (zvani\u010dno Gradski
  i industrijski kotar Donja Tuzla) i Seoski kotar Donja Tuzla. Gradskom kotaru pripale
  su gradska op\u0107ina Tuzla, te industrijska mjesta Lukavac i Simin Han, kojima
  je time dodijeljen status seoskih op\u0107ina. Seoskom kotaru pripadao je ostatak
  do tada jedinstvenog kotara. Ovo je u\u010dinjeno naredbom Zemaljske vlade donesenom
  21. februara, koja je na snagu stupila 1. marta 1897. godine (Glasnik 1897: 45-47).
  Sa takvom upravno-teritorijalnom slikom Okrug Donja Tuzla do\u010dekao je Prvi svjetski
  rat.\\n\\nKada je vremenski okvir ovog rada u pitanju, on po\u010dinje sa 1884.
  godinom, \u0161to u neku ruku izgleda neobi\u010dno. Razlog tome je, me\u0111utim,
  \u0161to su podaci o imenima \u010dinovnika i njihovim funkcijama poznati tek od
  te godine. Jedini stariji dokument koji sam, do trenutka pisanja ovog rada, uspio
  prona\u0107i jeste popis finansijskih \u010dinovnika u austrougarskoj upravi u Bosni
  i Hercegovini iz 1884. godine (ABH-ZVS 1884: k35, 3/1). U njemu se navode imena
  nekih \u010dinovnika \u010de\u0161kog porijekla koja se i kasnije susre\u0107u.
  Me\u0111utim, taj dokument ne daje dovoljno informacija da bi se vremenski okvir
  ovog rada mogao pomjeriti na sami po\u010detak austrougarske uprave, a za \u010dinovnike
  koji se tu navode je ostavljena napomena. Krajnja vremenska granica je, o\u010digledno,
  godina po\u010detka Prvog svjetskog rata.\\n\\n***\\n\\nAustrougarska uprava u Bosni
  i Hercegovini u po\u010detnim godinama imala je problema sa \u010dinovni\u010dkim
  kadrom. Ona je zatekla jedan upravni sistem koji se nije uklapao u\\n\\n8 U po\u010detku
  se okrug, kao i kotar i sam grad, zvao Donja Tuzla, a od 1910. godine samo Tuzla.\\n\\nAmir
  Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog prou e\u0161kih\\n\\n\u010d\\n\\ninovnika
  u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nstandarde zapadnoevropske
  administracije (Lis 2020). William Miller, britanski putnik, zabilje\u017eio je
  razgovor sa austrougarskim \u010dinovnikom o jednom zanimljivom slu\u010daju iz
  prvih mjeseci nakon okupacije, koji slikovito opisuje ovu razliku izme\u0111u osmanske
  i austrougarske uprave. \u010cinovnik mu je ispri\u010dao da je \u201eodmah nakon
  okupacije, u \u017dep\u010du, na\u0161ao jednu staru torbu punu raznih papira koji
  su predstavljali \u010ditavu tursku arhivu. Svaki put kad mu je trebao neki dokument,
  sadr\u017eaj torbe bi istresao na pod.\\\" Nasuprot tome, austrougarska uprava je
  sve bilje\u017eila i slagala u dosjee, o \u010demu je ovaj \u010dinovnik, mo\u017eda
  malo i pretenciozno, rekao da su oni \u201enapisali vi\u0161e (...) za dvadeset
  godina nego Turci za \u010detiri stotine.\\\" (Had\u017eiselimovi\u0107 1989: 192).\\n\\nNova
  vlast je ipak zadr\u017eala neke osmanske \u010dinovnike, ali je dotada\u0161nji
  \u010dinovni\u010dki aparat uglavnom smatran nepouzdanim i nekompetentnim (Kasumovi\u0107
  2019), dok su prvi \u010dinovnici, koji su do\u0161li iz Monarhije uglavnom bili
  niskokvalifikovani \u201eili mladi\u0107i bez iskustva ili starci bez karaktera,\\\"
  podmitljivi, oholi, lijeni i nespremni za u\u010denje bosanskog zemaljskog jezika.
  Prema ocjeni britanskog konzula, \u201e\u0161ljam austrijskog \u010dinovni\u010dkog
  svijeta\\\", sa rijetkim izuzecima, bio je u Bosni u prvim godinama okupacije (Imamovi\u0107
  2007: 78-79). Ovo je svakako te\u0161ka optu\u017eba na ra\u010dun austrougarske
  uprave, koja je pritom i nekarakteristi\u010dna za Britance, budu\u0107i da su oni
  uglavnom blagonaklono gledali na Monarhiju i njenu ulogu na Balkanu. Tako se u jednom
  izvje\u0161taju iz 1879. godine hvali austrougarska uprava kao mudra i pravedna.
  Osim toga, jedan putnik zabilje\u017eio je kako zapravo austrougarski \u010dinovnici
  u Bosni i Hercegovini podsje\u0107aju na britanske \u201epo svom integritetu, potpunoj
  odanosti du\u017enosti i nepokolebljivoj energiji.\\\" Me\u0111utim, ova ocjena
  do\u0161la je dvadeset godina nakon okupacije, kada je \u010dinovni\u010dki aparat
  nesumnjivo bio bolji nego u po\u010detnim godinama (Had\u017eiselimovi\u0107 1989:
  177, 189, 190).\\n\\nIako je od po\u010detka okupacione uprave rastao broj stranih
  \u010dinovnika, pravu promjenu donio je Benj\u00e1min von K\u00e1llay (B\u00e9ni
  K\u00e1llay). Sa ambicijama da u Bosni i Hercegovini uspostavi modernu, stabilnu
  i funkcionalnu upravu, K\u00e1llayu je upravo \u010dinovni\u010dki aparat predstavljao
  jedno od osnovnih sredstava vladavine (Imamovi\u0107 2007). Zato se on trudio da
  u Bosnu i Hercegovinu privu\u010de kvalifikovan kadar, te je u tom smislu onima
  koji, vlastitim izborom, odlu\u010de slu\u017eiti u bosanskoj upravi 1886. godine
  osigurao status stalnih \u010dinovnika, \u010dime je napu\u0161ten provizorni status
  uspostavljen u prvim mjesecima okupacije (Kasumovi\u0107 2022). Osim toga, u narednim
  godinama se trudio unaprijediti njihov materijalni status \u2013 u \u010demu je
  i uspio \u2013 u\u010diniv\u0161i slu\u017ebu u bosanskoj upravi privla\u010dnom
  za \u010dinovnike iz obiju konstitutivnih zemalja Monarhije (Kralja\u010di\u0107
  1987). \u010cinovnici bosanske uprave su, osim pristojnih plata i osiguranih penzija,
  vremenom dobijali i razne pogodnosti, poput privilegovanog kori\u0161tenja \u017eeljeznica
  (Sbornik 1882; Zbornik 1883; Zbornik 1884; Zbornik 1885;\\n\\nZbornik 1896). Broj
  \u010dinovnika je usljed svega toga rastao (Kralja\u010di\u0107 1987; Imamovi\u0107
  2007), a u vrijeme K\u00e1llayeve uprave Zemaljska vlada osiguravala je i doma\u0107im
  mladi\u0107ima stipendije za studije u zemljama Austro-Ugarske, zatim Njema\u010dkoj,
  Gr\u010dkoj i Srbiji \u2013 sve sa ciljem stvaranja obrazovanog sloja koji \u0107e
  biti oslonac njene vlasti (Lis 2020). K\u00e1llay je insistirao na obrazovanom \u010dinovni\u010dkom
  kadru, tako da je \u010dinovnik u bosanskoj upravi morao biti obrazovan sa posebnim
  akcentom na poznavanju pravnih propisa, tim vi\u0161e \u0161to su vremenom uvedeni
  i prijemni ispiti za \u010dinovnike (Lis 2020).\\n\\nNaravno, pored gore spomenutih
  pogodnosti, \u010dinovnici su imali i svoje obaveze, koje se mogu svesti na ispunjavanje
  povjerene im du\u017enosti i pona\u0161anje koje dolikuje \u010dinovni\u010dkom
  stale\u017eu. Oni su, tako\u0111er, bili podlo\u017eni i disciplinskom postupku
  u slu\u010daju neizvr\u0161avanja du\u017enosti ili nedoli\u010dnog pona\u0161anja,
  te u skladu s tim odgovaraju\u0107im kaznama. Prestupi su generalno mogli biti ocijenjeni
  kao neurednost u poslu, \u0161to je povla\u010dilo bla\u017ee usmene, pismene ili
  nov\u010dane kazne, ili kao formalni disciplinski prekr\u0161aji, koji su, naravno,
  povla\u010dili te\u017ee kazne. Te te\u017ee kazne imale su raspon od pismenih ukora,
  preko premje\u0161tanja u drugu slu\u017ebu, privremenog smanjenja plate, odga\u0111anja
  napredovanja i premje\u0161tanja u ni\u017ei \u010dinovni\u010dki razred, do prisilnog
  penzionisanja ili otpu\u0161tanja iz slu\u017ebe (Sladovi\u0107 1916).\\n\\nSvojim
  energi\u010dnim radom K\u00e1llay je Bosnu i Hercegovinu u\u010dinio privla\u010dnom
  za \u010dinovnike raznih profila iz skoro svih pokrajina Monarhije. Me\u0111u njima
  su, naravno, bili i \u010cesi, i to u ne malom broju. Izvje\u0161taji o upravi,
  kao i \u0161ematizmi koje je objavljivala i Zemaljska vlada, ali i listovi poput
  Bo\u0161njaka i Bosanskog glasnika (Bosnischer Bote), pokazuju da su \u010cesi bili
  najbrojniji stranci (tj. oni koji su dolazili iz neke od zemalja Monarhije, ne ra\u010dunaju\u0107i
  Bosnu i Hercegovinu) u bosanskoj upravi nakon Nijemaca (Izvje\u0161taj 1906; Izvje\u0161taj
  1911; Juzba\u0161i\u0107 1999). Njihov broj se stalno kretao oko 10-11% svih \u010dinovnika
  na slu\u017ebi u Bosni i Hercegovini. \u010cesi su, kao i Poljaci, bili po\u017eeljni
  kao \u010dinovnici uprave u Bosni i Hercegovini zbog svoje odanosti i sli\u010dnosti
  njihovih maternjih jezika sa jezikom doma\u0107eg stanovni\u0161tva (Kralja\u010di\u0107
  1987; Poloni 2009). \u0160tavi\u0161e, jedan Britanac je ve\u0107 1879. godine zapisao
  da \u010cesi brzo u\u010de zemaljski jezik i da su prili\u010dno cijenjeni od strane
  doma\u0107eg stanovni\u0161tva. 9 Prema podacima iz 1910. godine, od ukupno 11.559
  \u010dinovnika iz \u010ce\u0161ke i Moravske uop\u0107e na slu\u017ebi u Bosni i
  Hercegovini, u Okrugu Donja Tuzla bilo je njih 1.315 (Poloni 2009), s tim \u0161to
  to ne zna\u010di da su svi oni bili \u010cesi, budu\u0107i da je bilo i Nijemaca
  u zemljama \u010de\u0161ke krune. Osim \u0161to je jasno samo po sebi, to nam potvr\u0111uje
  i podatak\\n\\n9 \u201eBilo mi je drago kad sam vidio da \u010cesi brzo u\u010de
  bosanski dijalekat; izgleda da ih op\u0107enito vi\u0161e cijene nego Hrvate\\\"
  (Had\u017eiselimovi\u0107 1989: 177). Britanac o kojem je rije\u010d je R. Hamilton-Lang,
  a cijeli \u010dlanak dostupan je u Morley (1879: 650-671).\\n\\nAmir Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog
  prou e\u0161kih\\n\\n\u010d\\n\\ninovnika u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nda je, recimo, u posljednjoj
  godini pred Prvi svjetski rat bilo 410 pripadnika \u017eandarmerijskog korpusa u
  Bosni i Hercegovini koji su dolazili iz \u010ce\u0161ke i Moravske, a ''samo'' 389
  pripadnika je imalo \u010de\u0161ki kao maternji jezik (Bericht 1917).\\n\\nOKRU\u017dNI
  NIVO\\n\\nUprava jedne okru\u017ene oblasti imala je u svom sastavu politi\u010dko,
  gra\u0111evinsko, finansijsko, \u0161umarsko, \u0161kolsko, ljekarsko i veterinarsko
  osoblje (Izvje\u0161taj 1906). Organi uprave unutar okru\u017ene oblasti sastojali
  su se od tri nivoa \u2013 okru\u017enog, kotarskog i op\u0107inskog. Najni\u017ei,
  op\u0107inski nivo, pokrivala su uglavnom lokalna lica, razumljivo, doma\u0107eg
  porijekla. Prema tome, \u010de\u0161ke \u010dinovnike zati\u010demo na okru\u017enom
  i kotarskom nivou. Na okru\u017enom nivou u Okrugu Donja Tuzla imamo 25 \u010dinovnika
  \u010de\u0161kog porijekla. Samo jedan od njih obavljao je dvije razli\u010dite
  funkcije. Najvi\u0161e ih je radilo u pravosudnim organima uprave (16). Trojica
  su radili u finansijama, jedan u upravi \u0161umarstva, a petorica su bili tehni\u010dki
  \u010dinovnici. Ovi \u010dinovnici pripadaju upravi okru\u017ene oblasti u u\u017eem
  smislu, te ne obuhvataju sve \u010dinovnike koji su popunjavali funkcije na ovom
  nivou. Pored uprave u u\u017eem smislu, na nivou okru\u017enih oblasti postojala
  su i finansijska nadzorni\u0161tva, duhanska re\u017eija, rudarsko satni\u0161tvo,
  \u0161umsko upraviteljtvo i oru\u017eni\u010dki zbor (tj. komanda \u017eandarmerije)
  (Vidjeti prilog Tabela 1.)\\n\\nNa okru\u017enom nivou djelovalo je, dakle, i finansijsko
  nadzorni\u0161tvo. Ono, me\u0111utim, nije bilo dio uprave (uprave u u\u017eem smislu)
  jedne okru\u017ene oblasti, ve\u0107 su to bile \u201esamostalne dohodarstvene oblasti\\\"
  (Izvje\u0161taj 1906).U finansijskom nadzorni\u0161tvu tuzlanskog Okruga nabrojali
  smo deset \u010de\u0161kih \u010dinovnika. Od toga, tri su bila vezana za carinske
  poslove, pet za ostale finansijske poslove, a dvojica su radili kao manipulativni
  \u010dinovnici. Carinska nadzorni\u0161tva, uredi i stanice su ina\u010de bili sredstvo
  visokih austrougarskih organa za provo\u0111enje u djelo odluke o priklju\u010denju
  Bosne i Hercegovine zajedni\u010dkom austrougarskom carinskom podru\u010dju (Juzba\u0161i\u0107
  2002). Odluka o otvaranju carinsko-poreznih ureda u Bijeljini i Zvorniku, te njima
  podre\u0111enih usputnih carinskih stanica u Bosanskoj Ra\u010di i Janji, odnosno
  \u0160epku, Ljuboviji i Skelanima donesena je u decembru 1879. godine (BH. novine
  1880), dok je od 1. januara 1880. godine po\u010dela sa radom carinska i finansijska
  stra\u017ea Donja Tuzla, podre\u0111ena nadzorni\u0161tvu u Sarajevu (BH. novine
  1880). Zadatak finansijske stra\u017ee bio je da vodi ra\u010duna o pravilnom izvr\u0161avanju
  svih finansijsko-tehni\u010dkih i poreznih propisa i svih poslova podlo\u017enih
  prijavljivanju i oporezivanju, kao i u nadgledanju i spre\u010davanju krijum\u010darenja
  robe (Sladovi\u0107 1916) (Vidjeti prilog Tabela 2.)\\n\\nPrilog prou\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nU zavodima rudarskog satni\u0161tva,
  tj. uprave rudarskih poslova, koji se odnose na podru\u010dje tuzlanskog Okruga,
  nabrojano je devet \u010de\u0161kih \u010dinovnika. Jedan od njih bio je upravnik,
  a me\u0111u ostalima tu su bili ra\u010dunovo\u0111e, rudarski stru\u010dnjaci,
  administrativni radnici i rudarski ljekari. Njih osam vezano je za ugljeni majdan
  u Kreki, a jedan za solanu. Rije\u010d je, ina\u010de, o prili\u010dno va\u017enim
  industrijskim postrojenjima izgra\u0111enim u prvim godinama austrougarske okupacione
  uprave. Rudnik uglja u Kreki otvoren je 1885. godine, a u njegovom sastavu je 1905.
  izgra\u0111ena i elektrana koja je elektri\u010dnom energijom snabdijevala i rudnik
  i solane, ali i sam grad (Bericht 1917). Solane su izgra\u0111ene 1885. u Siminom
  Hanu i 1892. u Kreki (U\u017ei\u010danin 2014), a u martu 1914. donesen je zakon
  o uzimanju zajma kako bi se solana u Kreki pro\u0161irila u dovoljnoj mjeri da se
  ona u Siminom Hanu mo\u017ee napustiti (Glasnik 1914) (Vidjeti prilog Tabela 3.)\\n\\nVa\u017ean
  segment austrougarske uprave u Bosni i Hercegovini bila je \u017eandarmerija. Ona
  je uspostavljena neposredno nakon okupacije, a prvobitna regulacija statusa \u017eandarmerije
  provedena je ve\u0107 1879. godine. Novi statut za \u017eandarmeriju donesen je
  1883. godine u sklopu K\u00e1llayevih mjera za uspostavljanje efikasne i stabilne
  uprave. Ovim statutom \u017eandarmerija je imala zadatak o\u010duvanja sigurnosti
  u zemlji, sa izuzetkom gradskih op\u0107ina koje su imale svoje snage sigurnosti
  (Sladovi\u0107 1916), a u ispunjavanju tog zadatka bila je podre\u0111ena politi\u010dkim
  vlastima. O\u010duvanje sigurnosti je, me\u0111utim, uklju\u010divalo \u0161irok
  spektar slu\u010dajeva iz onovremene bosanske svakodnevice. Franti\u0161ek Valou\u0161ek,
  \u010ceh koji je \u0161esnaest godina slu\u017eio u \u017eandarmeriji u Bosni i
  Hercegovini, osim redovnih i ''normalnih'' zadataka, zabilje\u017eio je i takve
  \u017eivopisne, ponekad i nevjerovatne slu\u010dajeve u kojima je \u017eandarmerija
  morala intervenisati. Neki me\u0111u njima su, recimo, izvla\u010denje cijele zmije
  iz \u017eeluca jednog \u010dovjeka koji ju je progutao spavaju\u0107i otvorenih
  usta na livadi, zatim provo\u0111enje istrage slu\u010daja u kojem je mladi\u0107
  odgrizao djevojci nos kako niko drugi osim njega ne bi htio sa njom stupiti u brak,
  potom istrage slu\u010daja u kojem je lokalnom begu i jednoj od njegove \u010detiri
  supruge glave odsjekla druga od \u010detiri supruge, onda hap\u0161enje Romkinja
  koje su ispod haljina nosile \u017eive ukradene pijetlove, hap\u0161enje o\u010duha
  koji je djetetu dao eksere da jede i tako dalje (Valou\u0161ek 2016). Kada je rije\u010d
  o teritorijalnoj organizaciji \u017eandarmerije, ona se uglavnom poklapala sa okruzima,
  na na\u010din da je jedno krilo Oru\u017eni\u010dkog zbora (tj. \u017eandarmerijskog
  korpusa) odgovaralo jednom okrugu. Izuzetak u tom smislu bilo je 7. krilo smje\u0161teno
  u Trebinju, a od 1890. u Bile\u0107i, te iste godine formirano 8. krilo u Gora\u017edu
  (Kralja\u010di\u0107 1987).\\n\\nNa podru\u010dju tuzlanskog Okruga bilo je smje\u0161teno
  5. krilo Oru\u017eni\u010dkog zbora, koje se sastojalo od pet vodova. Prvi vod bio
  je smje\u0161ten u Tuzli, drugi u Br\u010dkom, tre\u0107i u\\n\\nPrilog prou\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nBijeljini, \u010detvrti u Srebrenici
  i peti u Zvorniku (Bo\u0161njak 1913). Vodovi su se dalje sastojali od stanica,
  a njihov broj i razmje\u0161taj utvr\u0111ivao je zemaljski poglavar u saradnji
  sa civilnim adlatusom i komandantom \u017eandarmerijskog korpusa (Kralja\u010di\u0107
  1987). 10\\n\\nU \u017eandarmerijskom korpusu u Bosni i Hercegovini bilo je dosta
  \u010ceha. Uo\u010di Prvog svjetskog rata, 1913. godine, bilo je 368 (16,4%), a
  1914. godine 389 (17,2%) pripadnika \u017eandarmerijskog korpusa u Bosni i Hercegovini
  kojima je \u010de\u0161ki bio maternji jezik, po \u010demu su \u010cesi bili najbrojniji
  stranci u ovoj slu\u017ebi (Bericht 1917). Zbog \u010dega je to bio slu\u010daj,
  te\u0161ko je re\u0107i, a dodatna istra\u017eivanja mogla bi ponuditi precizniji
  odgovor na to pitanje. Neke naznake, ipak, donekle nude narativni izvori. Ranije
  spomenuti Valou\u0161ek, prisje\u0107aju\u0107i se jedne \u0161kole za komandire
  stanica koju je poha\u0111ao, a u kontekstu u\u010de\u0161\u0107a \u010ceha u \u017eandarmeriji,
  zabilje\u017eio je sljede\u0107e:\\n\\n\u201eOd svih 56 kandidata, 15 su bili \u010cesi
  i Moravci, skoro svi na prvim mjestima po redoslijedu. I prije po\u010detka nastave,
  gospodin konji\u010dki kapetan je skoro sve osnovne funkcije rasporedio isklju\u010divo
  me\u0111u kandidatima \u010de\u0161ke narodnosti. Bilo je to skoro pravilo u \u0161kolama
  \u0161irom Bosne i Hercegovine, jer su \u010cesi, navodno, lak\u0161e u\u010dili
  od npr. Poljaka, Hrvata...\\\" (Valou\u0161ek 2016: 87)\\n\\nKada je u pitanju uprava
  5. krila \u017eandarmerijskog korpusa, nalazimo pet \u010ceha, od \u010dega su trojica
  bili dio oficirskog kadra, a jo\u0161 dvojica su radili kao ra\u010dunovo\u0111e.
  Na poziciji komandanta 5. krila bila su dvojica \u010ceha, dok su dvojica bili komandanti
  vodova (Vidjeti prilog Tabela 4.).\\n\\n\u010ce\u0161ke \u010dinovnike zatekli smo
  i u drugim organima uprave, ali u manjem broju, pa one nisu izdvojene u posebnu
  kategoriju. Naime, jedan \u010ceh \u2013 Ferdinand Pr\u00e1t \u2013 radio je u duhanskoj
  re\u017eiji na podru\u010dju tuzlanskog Okruga. On je jedanaest godina (18991909)
  obavljao poslove u otkupnom uredu u Srebrenici, gdje je bio kontrolor duhanske proizvodnje,
  potom upravnik (od 1902. godine), a zatim tajnik (1909), nakon \u010dega je preba\u010den
  u \u010capljinu. U sekciji za uzdr\u017eavanje \u017eeljeznica u sklopu zemaljske
  uprave \u017eeljeznica radio je Karlo Kolejka. On je 1913. godine obavljao posao
  pristava u Tuzli. Na kraju, jedan \u010ceh je radio i u zemaljskoj poljoprivrednoj
  stanici u Modri\u010di. Njegovo ime je Fridrik Kr\u00e1l pl. Dobr\u00e1-Voda, a
  bio je poljoprivredni (od 1913. privredni) pristav, kao i stru\u010dni u\u010ditelj
  u lokalnoj \u0161koli od 1910. do 1914. godine. 11\\n\\n10 \u201eBroj i sjedi\u0161ta
  oru\u017eni\u010dkih postaja opredijeljuje poglavar zemaljske vlade, doti\u010dno
  civilni doglavnik, na predlog zapovjednika oru\u017eni\u010dkog zbora tako, da u
  svakom sjedi\u0161tu kotarske oblasti i njezinih ispostava, a prema potrebi takodjer
  u drugim mjestima bude po jedna postaja.\\\" \u0160tatut oru\u017eni\u010dkog zbora
  za Bosnu i Hercegovinu, Zbornik zakona i naredaba za Bosnu i Hercegovinu. Godina
  1883., Sarajevo, 1883, 552.\\n\\n11 Svi podaci o \u010dinovnicima, ako druga\u010dije
  nije navedeno, dobijeni su iz \u0161ematizama objavljivanih u kalendaru lista Bo\u0161njak.
  Bibliografski podaci o njima navedeni su u popisu referenci na kraju rada.\\n\\nKOTARSKI
  NIVO\\n\\nKao i u slu\u010daju okru\u017enog nivoa i kotarska uprava imala je \u010dinovnike
  za razli\u010dita odjeljenja. Kotarski uredi su od 1882. godine, kada su uspostavljeni
  i kada im je propisan djelokrug (ABH-ZVS 1882: k18, 18/51), bili mje\u0161oviti
  uredi koji su djelovali kao politi\u010dka oblast prve instance, pravosudna oblast
  prve instance, porezni uredi i \u0161umski uredi. Uspostavljanjem zasebnih kotarskih
  sudova, kojima je, naravno, dodijeljena pravosudna vlast na kotarskom nivou, kotarski
  uredi ostali su pri politi\u010dkim i finansijskim poslovima (Izvje\u0161taj 1906).
  Kotarski sudovi osnovani su naredbom Zemaljske vlade od 21. februara, koja je na
  snagu stupila 1. jula 1906. godine (Glasnik 1907).\\n\\nU pore\u0111enju sa okru\u017enim
  nivoom mnogo vi\u0161e \u010ceha radilo je na kotarskom nivou, \u0161to je sasvim
  i razumljivo, kada se uzme u obzir \u010dinjenica da su kotarske uprave zajedno
  imale ve\u0107i broj \u010dinovnika od uprave na okru\u017enom nivou. U kotarima
  tuzlanskog Okruga nabrojali smo 94 razli\u010dita \u010de\u0161ka \u010dinovnika.\\n\\nU
  okviru politi\u010dke uprave radilo je njih dvanaest, od \u010dega su \u010detvorica
  obavljali po dvije funkcije i to u razli\u010ditim kotarima. Ukupno su trojica obavljali
  funkciju kotarskih predstojnika, sedmorica su bili na poziciji politi\u010dkih perovodnih
  \u010dinovnika, dvojica politi\u010dki pristavi (od \u010dega jedan upravitelj kotarske
  ispostave), te tri perovodna vje\u017ebenika. Po kotarima, najvi\u0161e ih je bilo
  u (Donjoj) Tuzli \u2013 njih pet, od \u010dega su \u010detvorica radili u upravi
  seoskog kotara Donja Tuzla. \u010cetiri \u010de\u0161ka \u010dinovnika radila su
  u upravi kotara Bijeljina, tri u Br\u010dkom, te po jedan u kotarima Gra\u010danica,
  Grada\u010dac, Srebrenica i Zvornik (Vidjeti prilog Tabela 5.).\\n\\nU pravosu\u0111u
  na kotarskom nivou radilo je najvi\u0161e \u010de\u0161kih \u010dinovnika \u2013
  njih 19, od \u010dega su dvojica obavljali funkciju kotarskog sudije (u tri razli\u010dita
  kotara). Sudski pristavi (12) i auskultanti (6) bile su naj\u010de\u0161\u0107e
  pozicije \u010de\u0161kih \u010dinovnika, a osim njih po jednog \u010dinovnika nalazimo
  na pozicijama sudskog savjetnika (jedan od spomenutih kotarskih sudija), sudskog
  tajnika (jedan od kotarskih sudija) i dodijeljenog vladinog perovo\u0111e. Gledaju\u0107i
  po kotarima, najvi\u0161e ih je bilo u (Donjoj) Tuzli (\u010detiri), zatim u Bijeljini,
  Grada\u010dcu, Srebrenici i Zvorniku (po tri), Br\u010dkom, Gra\u010danici i Vlasenici
  (po dva), te u Maglaju (jedan) (Vidjeti prilog Tabela 6.).\\n\\nU odjeljenjima kotarskih
  uprava zadu\u017eenim za finansijska pitanja radio je jedan \u010ceh manje u odnosu
  na pravosu\u0111e. Od 18 \u010dinovnika, jedan je radio u carinskoj slu\u017ebi,
  dok su svi ostali bili vezani za poreze (poreznici, porezni oficijali, kontrolori,
  vje\u017ebenici). Bilo ih je u svim kotarima tuzlanskog okruga, a najvi\u0161e u
  Bijeljini i Br\u010dkom (po \u010detiri), potom u Donjoj Tuzli, Maglaju i Vlasenici
  (po tri), u Kladnju,\\n\\nVlasenici, Gra\u010danici i Grada\u010dcu (po dva), te
  Srebrenici (jedan). Od 18 \u010dinovnika, njih \u010detvorica radili su u dva kotara,
  a jo\u0161 dvojica u tri kotara (Vidjeti prilog Tabela 7.).\\n\\nVe\u0107i broj
  \u010de\u0161kih \u010dinovnika nalazimo i na drugim, tehni\u010dkim pozicijama
  u kotarskim upravama. Njih osam su ozna\u010deni kao manipulativni \u010dinovnici,
  kanceliste ili pisari, a radili su na ukupno deset pozicija od \u010dega tri u Br\u010dkom
  i u Bijeljini, te po jednoj u Grada\u010dcu, Srebrenici i Vlasenici. \u010cesi su
  bili \u010desti i na pozicijama geometara. Trinaest ih je radilo kao geometri (tako\u0111er
  i nadgeometri i elevi za evidenciju). Njih dvojica su obavljali taj posao u dva
  razli\u010dita kotara. Najvi\u0161e ih je bilo u Donjoj Tuzli (\u010detiri, od \u010dega
  tri u seoskom kotaru), zatim u Bijeljini, Grada\u010dcu, Kladnju i Srebrenici (po
  dva), dok po jednog susre\u0107emo u Br\u010dkom, Gra\u010danici, Vlasenici i Zvorniku.
  Osim toga, na pozicijama iz ove kategorije susre\u0107emo i dva gruntovni\u010dara,
  koji su radili u kotarima Maglaj i Donja Tuzla (Vidjeti prilog Tabela 8.).\\n\\nUvo\u0111enje
  gruntovnica je ina\u010de bila jedna od novina koju je donijela austrougarska uprava
  u Bosni i Hercegovini. Iako je i osmanska uprava poznavala vo\u0111enje zemlji\u0161nog
  registra, to nisu bile gruntovnice u modernom smislu rije\u010di (Sladovi\u0107
  1916). One su, prema tome, uspostavljene tek Gruntovni\u010dkim zakonom za Bosnu
  i Hercegovinu, koji je donio Car i Kralj odlukom od 13. septembra 1884. godine zajedno
  sa uputstvom za provo\u0111enje tog zakona, uputstvom za vo\u0111enje gruntovnica
  i naredbom o ure\u0111enju i djelokrugu gruntovni\u010dkih povjerenstava, dok je
  Zemaljska vlada 28. septembra donijela naredbu o progla\u0161enju Gruntovni\u010dkog
  zakona za Bosnu i Hercegovinu (Glasnik 1886). Nakon dono\u0161enja Gruntovni\u010dkog
  zakona za Bosnu i Hercegovinu (1884), gruntovnice su postepeno uspostavljane u kotarima
  \u0161irom zemlje. U tuzlanskom Okrugu uspostavljene su ovim redom: 1888. u Grada\u010dcu
  (Gesetz- 1888), 1889. u Br\u010dkom i Bijeljini (Gesetz- 1889), 1890. u Donjoj Tuzli
  (Gesetz- 1890), 1891. u Maglaju (Gesetz- 1890), 1892. u Gra\u010danici (Glasnik
  1892), 1893. u Zvorniku (Glasnik 1893), 1895. u Srebrenici (Glasnik 1895), 1897.
  u Vlasenici (Glasnik 1897) i 1899. u Kladnju (Glasnik 1899). Do osnivanja gruntovnica
  gruntovni\u010dka povjerenstva u kotarima pripadala su odgovaraju\u0107im kotarskim
  sudovima (Glasnik 1907).\\n\\n\u010ce\u0161ke \u010dinovnike nalazimo i u oblasti
  \u017eeljeznica, \u0161umarstva i graditeljstva. \u017deljeznice su u Bosni i Hercegovini
  u vrijeme austrougarske uprave tek bile u fazi razvoja i \u017eeljezni\u010dka mre\u017ea
  jo\u0161 se nije bila pro\u0161irila na sve kotare u Bosni i Hercegovini. Sa glavnom
  \u017eeljezni\u010dkom prugom Bosanski Brod \u2013 Doboj \u2013 Sarajevo \u2013
  Mostar \u2013 Metkovi\u0107, tuzlanski Okrug bio je povezan prugom Doboj \u2013
  Simin Han izgra\u0111enom 1886. godine (Juzba\u0161i\u0107 2002), a osim nje kroz
  ovaj okrug prolazio je i dio pruge Zavidovi\u0107i \u2013 Han Pijesak (U\u017ei\u010danin
  2014). U smislu uprave, svi \u017eeljezni\u010dki\\n\\nAmir Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog
  prou e\u0161kih\\n\\n\u010d\\n\\ninovnika u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nposlovi bili su podre\u0111eni
  Direkciji zemaljskih \u017eeljeznica u Sarajevu, koja se sastojala od \u010detiri
  odjeljenja (za op\u0107u upravu, za odr\u017eavanje \u017eeljeznica, za saobra\u0107ajnu
  i komercijalnu slu\u017ebu, za otpremanje vozova i radionica) (Sladovi\u0107 1916).
  U \u017eeljezni\u010dkoj slu\u017ebi na podru\u010dju tuzlanskog Okruga nabrojali
  smo deset \u010de\u0161kih \u010dinovnika. Uglavnom je rije\u010d o na\u010delnicima
  ili upravnicima \u017eeljezni\u010dkih stanica. Takvih je \u0161est, a tu su bila
  jo\u0161 dva asistenta i dva aspiranta. Sedam od ovih deset \u010dinovnika radilo
  je na stanicama u tuzlanskom kotaru, od \u010dega jedan u Tuzli, tri u Kreki, dva
  u Pura\u010di\u0107u i jedan u Siminom Hanu. Preostala dva \u010dinovnika radila
  su u Gra\u010danici i jedan u Maglaju (Vidjeti prilog Tabela 9.)\\n\\nU kotarskim
  upravama \u0161umarskih poslova nabrojali smo tako\u0111er deset \u010de\u0161kih
  \u010dinovnika, koji su pokrivali jedanaest razli\u010ditih pozicija (jedan je radio
  na dva mjesta). Me\u0111u njima bila su dva \u0161umska upravitelja, \u0161est nad\u0161umara/nadlugara
  i tri \u0161umska vje\u017ebenika. Najvi\u0161e ih je bilo u kotaru Kladanj, ta\u010dnije
  u \u0161umskom upraviteljstvu Olovo, koje je pripadalo ovom kotaru. Po dvojica su
  radila u kotarima Br\u010dko i Donja Tuzla, a po jedan u kotarima Gra\u010danica,
  Grada\u010dac, Maglaj (u Vozu\u0107oj) i Vlasenica (u Han Pijesku) (Vidjeti prilog
  Tabela 10.).\\n\\n\u010cetiri \u010dinovnika \u010de\u0161kog porijekla radila su
  u gra\u0111evinskim odsjecima kotarskih uprava na podru\u010dju tuzlanskog Okruga.
  Oni su obavljali poslove cestara (cestarnika, kasnije nadcestarnika). Susre\u0107emo
  ih u kotarima Srebrenica, Donja Tuzla i Kladanj. Treba dodati i jednog \u010dinovnika
  u oblasti zdravstva \u2013 kotarskog ljekara u Gra\u010danici po imenu Egon Zahr\u00e1dka
  (Vidjeti prilog Tabela 11.)\\n\\nPosmatraju\u0107i \u010dinovnike na kotarskom nivou
  po kotarima, primje\u0107ujemo da ih je najvi\u0161e bilo u kotaru Donja Tuzla (27).
  Me\u0111u njima, nakon \u0161to je ovaj kotar podijeljen, bilo ih je osam u seoskom
  i jedan u gradskom kotaru. Zatim dolazi kotar Bijeljina, gdje je radilo 18 \u010de\u0161kih
  \u010dinovnika, a onda Br\u010dko sa 16. Dalje slijede kotari Grada\u010dac (11),
  Gra\u010danica i Srebrenica (po 9), Kladanj i Vlasenica (po 8), Maglaj (7) i Zvornik
  (6). 12\\n\\nTRAJANJE SLU\u017dBE\\n\\nMe\u0111u velikim brojem \u010de\u0161kih
  \u010dinovnika u tuzlanskom Okrugu, nekoliko njih se izdvaja po du\u017eini sta\u017ea
  koji su stekli na ovom podru\u010dju. \u010ce\u0161ki \u010dinovnik sa najdu\u017eim
  sta\u017eom u tuzlanskom Okrugu je Wenzel Sk\u0159ivanek, koji je u slu\u017ebi
  proveo \u010dak 23 godine (1892-1914). Bio je kotarski pisar, kancelista i manipulativni
  \u010dinovnik u kotaru Grada\u010dac. Nakon njega dolazi Vladislav Tykal, koji je
  radio kao geometar u kotaru\\n\\n12 Podaci dobijeni prebrojavanjem u \u0161ematizmu
  redovno objavljivanom u kalendaru lista Bo\u0161njak od 1884. do 1914. godine. Bibliografski
  podaci o njima nalaze se u popisu referenci na kraju rada.\\n\\nPrilog prou\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nGra\u010danica od 1893. do 1899.
  godine, a naredne godine sve do izbijanja Prvog svjetskog rata kao nadgeometar za
  evidenciju u kotaru Br\u010dko. Tykal je, dakle, ukupno u administrativnoj slu\u017ebi
  na podru\u010dju tuzlanskog Okruga proveo 22 godine. Zatim slijedi Rudolf Slade\u010dek,
  rudarski upravnik na ugljenom majdanu Kreka (kotar Donja Tuzla). Na ovoj poziciji
  u sastavu rudarskog satni\u0161tva Slade\u010dek je proveo 16 godina (1896-1911).
  Trinaest godina u slu\u017ebi na podru\u010dju tuzlanskog Okruga proveo je Wilibald
  Hrdli\u010dka. On je od 1895. do 1907. godine radio kao na\u010delnik \u017eeljezni\u010dke
  stanice u Donjoj Tuzli, da bi svoju slu\u017ebu u Bosni i Hercegovini kasnije nastavio
  u Mostaru. Dvije godine kra\u0107e u slu\u017ebi su proveli Ve\u0107eslav (negdje
  Vencel) Uhli\u0159 i Fer\u00ad dinand Pr\u00e1t. Prvi je radio kao kancelista, najprije
  osam godina u Bijeljini (1895-1902), a potom tri godine u Br\u010dkom (1903-1905).
  Drugi je od 1899. do 1909. godine bio \u010dinovnik duhanske re\u017eije i obavljao
  poslove kontrolora duhanske fabrike, potom upravnika (od 1902) i tajnika (1909)
  u Srebrenici, da bi slu\u017ebu kasnije nastavio u \u010capljini.\\n\\nDecenijski
  sta\u017e u upravi na podru\u010dju tuzlanskog Okruga ostvarilo je jo\u0161 pet
  \u010de\u0161kih \u010dinovnika. Gustav Pola\u010dek je bio \u010dinovnik finansijskog
  nadzorni\u0161tva Donja Tuzla od 1885. do 1894. godine. Za to vrijeme obavljao je
  poslove povjerenika carinske i finansijske (od 1888. samo finansijske) stra\u017ee
  u Zvorniku (do 1888) i Bijeljini (od 1889). Od 1891. do 1900. godine kao nadlugar
  u kotarskoj upravi Gra\u010danice radio je Josip K\u0159ivanek. Oskar Vesely (negdje
  Veselsky) 1892. godine zapo\u010deo je svoju slu\u017ebu kao rudarski me\u0161tar
  (od 1896. rudarnik) na ugljenom majdanu Kreka u sastavu rudarskog satni\u0161tva
  i tu ostao do 1901. godine. Aleksandar Csanik radio je kao cestar od 1896. do 1905.
  godine u Donjoj Tuzli. Budu\u0107i da je 1897. godine do\u0161lo do razdvajanja
  gradskog i seoskog kotara, Csanik je od 1898. do 1900. radio u gradskom, a u preostalom
  periodu u seoskom kotaru. Ukupno deset godina u slu\u017ebi, ali u dva perioda sa
  prekidom izme\u0111u, proveo je Franjo Vani\u010dek (negdje Wani\u010dek). Najprije
  je dvije godine radio kao porezni kontrolor u Grada\u010dcu (1893-1894), a zatim
  \u0161est godina kao poreznik u Gra\u010danici (1895-1900). Nakon decenijske pauze,
  vratio se na podru\u010dje tuzlanskog Okruga i dvije godine (1910-1911) proveo kao
  poreznik u Br\u010dkom.\\n\\nVi\u0161e od pet godina u slu\u017ebi u tuzlanskom
  Okrugu provelo je jo\u0161 20 \u010de\u0161kih \u010dinovnika. Franjo Hl\u00e1sek
  radio je devet godina na poziciji mjernog pristava u upravi Okruga Donja Tuzla (1895-1903).
  Isto toliko slu\u017eio je i Vencel Podhursky (negdje Ve\u0107eslav Podhursk\u00fd).
  U slu\u017ebu je stigao 1884. godine kao sudski pristav u kotarskoj upravi u Br\u010dkom,
  da bi se nakon vi\u0161egodi\u0161nje pauze vratio 1896. godine na istu poziciju
  u kotar Vlasenica. Tu se tako\u0111er zadr\u017eao samo jednu godinu, a potom je\\n\\nAmir
  Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog prou e\u0161kih\\n\\n\u010d\\n\\ninovnika
  u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nproveo sedam
  godina na poziciji sudskog tajnika u Okru\u017enom sudu Donja Tuzla (1897-1903).
  U Okru\u017enom sudu je radio i Karl Sedla\u010dek, kao sudski pristav 1893. i auskultant
  1894. godine. Nakon nekoliko godina odsustva, u Okru\u017eni sud u Tuzli vratio
  se 1899. godine na poziciju finansijskog perovo\u0111e, gdje je ostao sedam godina.
  Devet godina je u slu\u017ebi proveo i Ivan (negdje Jovan) Chitr\u00fd i to kao
  carinski oficijal u tri razli\u010dita ureda podre\u0111ena finansijskom nadzorni\u0161tvu.
  Od 1898. do 1900. godine radio je u carinskom uredu u Skelanima (kotar Srebrenica).
  Potom ga nekoliko godina nije bilo na podru\u010dju tuzlanskog Okruga, a vratio
  se 1908. godine kao \u010dinovnik u carinskom uredu Ra\u010da (kotar Bijeljina).
  Tu je ostao dvije godine, a potom isti posao obavljao u carinskom uredu \u0160epak
  (kotar Zvornik), zaklju\u010dno sa 1913. godinom. Peti \u010dinovnik koji je devet
  godina proveo u upravi na podru\u010dju tuzlanskog Okruga bio je Ferdinand Podhradsky.
  Sa slu\u017ebom je po\u010deo u upravi bijeljinskog kotara kao porezni \u010dinovnik
  (porezni oficijal), gdje je radio od 1905. do 1909. godine. Godinu dana nakon toga
  proveo je na istoj poziciji u upravi kotara Kladanj, a potom je jo\u0161 tri godine
  slu\u017eio kao porezni kontrolor u upravi maglajskog kotara.\\n\\nGodinu kra\u0107e
  od prethodno navedenih u slu\u017ebi su proveli Karl (negdje Karlo) Merli\u010dek,
  Antun (negdje Anton) Indr\u00e1k, Viktor Pollak i Karlo Wessel\u00fd (negdje Karl
  Vesely). Merli\u010dek, po \u010dinu kapetan, je svih osam godina (1891-1899) proveo
  kao za\u00ad povjednik 5. krila Oru\u017eni\u010dkog zbora, koje je obuhvatalo tuzlanski
  Okrug. Wessel\u00fd je tako\u0111er bio \u010dinovnik Oru\u017eni\u010dkog zbora.
  On je tri godine (1899-1901) proveo kao za\u00ad povjednik 3. voda stacioniranog
  u Bijeljini. Nakon vi\u0161egodi\u0161njeg odsustva sa podru\u010dja tuzlanskog
  Okruga, vratio se 1910. godine i u \u010dinu kapetana obavljao funkciju za\u00ad
  povjednika cijelog ovog krila Oru\u017eni\u010dkog zbora. Na toj funkciji do\u010dekao
  je i izbijanje Prvog svjetskog rata. Indr\u00e1k je 1897. radio kao sudski pristav,
  a 1898. kao sudija u kotarskoj upravi Vlasenice, da bi se nakon pauze od nekoliko
  godina vratio u tuzlanski Okrug i radio kao sudski savjetnik u Okru\u017enom sudu
  u Donjoj Tuzli (1909-1914). Pollak je svoju slu\u017ebu u tuzlanskom Okrugu zapo\u010deo
  1898. godine kao politi\u010dki pris\u00ad tav u upravi seoskog kotara Donje Tuzle,
  gdje je ostao i narednu godinu. Sljede\u0107e dvije godine proveo je na istoj poziciji
  u kotarskoj upravi Grada\u010dca, a zatim \u010detiri godine (1902-1905) kao upravitelj
  ispostave u Bosanskom \u0160amcu.\\n\\nSimeon Zahradnik, Zdenko Van\u011bk, Franjo
  Syrov\u00e1tka, Karlo Josip K\u00e1cl, Emil Navratil i Alois St\u0159eha proveli
  su u slu\u017ebi po sedam godina. Zahradnik je sa slu\u017ebom po\u010deo 1892.
  godine kao kotarski pisar (od 1895. kao kancelista) u kotarskoj upravi u Srebrenici,
  ostav\u0161i tu do 1898. godine. Van\u011bk je svojih sedam godina proveo u Br\u010dkom,
  po\u010dev\u0161i od 1905. godine. Radio je kao porezni \u010dinovnik. Poreznim
  kontrolorom postao je 1908, a posljednju godinu slu\u017ebe (1911) proveo je kao\\n\\nnadkontrolor.
  Syrov\u00e1tka i K\u00e1cl su tako\u0111er svih sedam godina proveli na istom mjestu
  \u2013 prvi kao rudarnik na ugljenom majdanu u Kreki u sastavu rudarskog satni\u0161tva
  (1906-1912), a drugi kao mjernik u upravi okru\u017ene oblasti (1908-1914). Navratil
  je bio \u010dinovnik pravosudne uprave, ta\u010dnije kotarski sudija. \u0160est
  godina je taj posao obavljao u Bijeljini (1906-1911), a jednu godinu (1914) u Tuzli.
  \u010cinovnik uprave \u0161umarstva Alois St\u0159eha radio je u kotarima Maglaj
  i Kladanj. \u0160umski upravitelj u Vo\u00ad zu\u0107oj bio je od 1906. do 1908.
  godine, a od 1909. do 1912. godine nad\u0161umar u Olovu.\\n\\nPet \u010de\u0161kih
  \u010dinovnika ostalo je po \u0161est godina u slu\u017ebi u upravi na podru\u010dju
  tuzlanskog Okruga. To su Adalbert \u0160ramek, Ivan Vaclavek, Anton Stoli\u010dka,
  Franjo Zl\u00e1mal i Viktor \u010cern\u00fd. Od njih prvi je sa slu\u017ebom po\u010deo
  \u0160ramek, 1884. godine. On je svih \u0161est godina radio u okru\u017enoj upravi
  na poziciji poreznog nadzornika, a 1888. godine postao je porezni vrhovni nadzornik.
  Na nivou Okruga radio je i Vaclavek, ali kao \u010dinovnik Oru\u017eni\u010dkog
  zbora, odnosno njegovog 5. krila. On je tu, od 1895. do 1900. godine, radio kao
  ra\u010dunovo\u0111a. I Zl\u00e1mal je bio \u010dinovnik uprave na okru\u017enom
  nivou, ta\u010dnije okru\u017enog finansijskog nadzorni\u0161tva. Od 1906. do 1911.
  godine on je bio finansijski perovo\u0111a, podtajnik, a potom i tajnik. Preostala
  dvojica bili su \u010dinovnici uprave na kotarskom nivou. \u010cern\u00fd je bio
  gruntovni\u010dar u kotarskim upravama u Bijeljini (1893-1894) i Maglaju (1910-1913;
  od 1911. nadgruntovni\u010dar u kotarskom sudu). 13 Stoli\u010dka je, sa druge strane,
  svih \u0161est godina proveo u upravi jednoga kotara. Rije\u010d je o kotaru Kladanj,
  u kojem je ovaj \u010dinovnik uprave \u0161umarstva radio na poziciji nadlugara
  u \u0161umskom upraviteljstvu u Olovu (1902-1907).\\n\\nVeliki broj drugih \u010dinovnika
  radio je pet ili manje godina u upravi na podru\u010dju tuzlanskog okruga, a \u010dak
  42 \u010dinovnika provela su tu samo jednu godinu. Procentualno je, dakle, skoro
  jedna tre\u0107ina (28,5%) \u010de\u0161kih \u010dinovnika u tuzlanskom Okrugu provela
  samo jednu godinu u slu\u017ebi. 14\\n\\nU ovom trenutku te\u0161ko bi bilo re\u0107i
  za\u0161to je tako bilo, odnosno za\u0161to su neki \u010dinovnici deceniju ili
  du\u017ee ostajali u Bosni i Hercegovini, a skoro tre\u0107ina njih samo jednu godinu.
  Bez dodatnih istra\u017eivanja, prvenstveno arhivske gra\u0111e o \u010dinovnicima
  i o \u010cesima posebno, ali i narativnih izvora, nemogu\u0107e je predstaviti bilo
  kakav obrazac ili neko precizno obja\u0161njenje. Naravno, \u010dak i ako su postojali
  neki posebni razlozi koji su navodili \u010dinovnike da ostanu tako dugo, ili sa
  druge strane tako kratko u Bosni i Hercegovini, mo\u017ee se pretpostaviti da su
  zna\u010dajnu ulogu igrali njihovi li\u010dni\\n\\n13 U \u0161ematizmu Bo\u0161njakovog
  Kalendara za 1912. godinu Viktor \u010cern\u00fd je naveden kao \u0161erijatski
  sudija, dok je Ibrahim ef. Kadi\u0107 naveden kao nadgruntovni\u010dar. Jasno je
  da je gre\u0161ka u pitanju. Bo\u0161njak. Kalendar za prestupnu godinu 1912., God.
  30, Sarajevo, 1911, 84.\\n\\n14 Svi podaci dobijeni su prebrojavanjem \u0161ematizama
  u kalendaru lista Bo\u0161njak.\\n\\nafiniteti i njihov stepen zadovoljstva radom
  i \u017eivotom u Bosni i Hercegovini. Znamo, na primjer, da su neki me\u0111u njima
  \u2013 \u010dinovnicima, ne nu\u017eno \u010cesima \u2013 voljeli svoj posao. Ranije
  spomenuti William Miller zabilje\u017eio je i u najmanjim gradovima sreo \u010dinovnike
  koji su potpuno posve\u0107eni svom poslu; zabilje\u017eio je da se svi \u010dinovnici
  \u201eizuzetno ponose (...) dostignu\u0107ima u posljednjih dvadeset godina i ni\u0161ta
  im ne pri\u010dinjava vi\u0161e zadovoljstva nego da tu zemlju poka\u017eu strancu\\\",
  da mu je jedan od njih rekao da nema drugog posla koji bi vi\u0161e volio raditi
  (Had\u017eiselimovi\u0107 1989: 192). Nesumnjivo je, naravno, da je \u2013 ako spomenuti
  britanski putnik nije pretjerivao \u2013 me\u0111u takvim \u010dinovnicima bilo
  i \u010ceha. Jedan od njih bio je i spomenuti Franti\u0161ek Valou\u0161ek. Iako
  nije bio na slu\u017ebi konkretno u tuzlanskom Okrugu, njegovi memoari (Valou\u0161ek
  2016) o \u0161esnaestogodi\u0161njoj slu\u017ebi u \u017eandarmeriji u Bosni i Hercegovini
  govore u prilog tome da je li\u010dno zadovoljstvo \u010dinovnika slu\u017ebom u
  Bosni i Hercegovini igralo va\u017enu ulogu u njihovoj odluci da se u ovoj zemlji
  zadr\u017ee ne\u0161to du\u017ee.\\n\\nZAKLJU\u010cAK\\n\\nKako se iz prilo\u017eenog
  mo\u017ee vidjeti, \u010cesi su bili prili\u010dno zastupljeni u organima uprave
  u tuzlanskom Okrugu. Na slu\u017ebi u cijeloj Bosni i Hercegovini bili su drugi
  stranci po brojnosti, odmah iz Nijemaca. Za potrebe ovog rada nisu razmatrani drugi
  strani \u010dinovnici u upravi tuzlanskog Okrugu, pa u tom smislu nije mogu\u0107e
  donijeti zaklju\u010dke o brojnosti \u010ceha u odnosu na druge strance samo u ovom
  okrugu. To pitanje ostaje zada\u0107a za budu\u0107a istra\u017eivanja.\\n\\nNa
  osnovu podataka obra\u0111enih za potrebe pisanja ovog rada zaklju\u010dujemo da
  su \u010de\u0161ki \u010dinovnici bili prisutni i na okru\u017enom i na kotarskom
  nivou. Bilo ih je u upravama svih kotara tuzlanskog Okruga, kao \u0161to ih je bilo
  i u svim kategorijama ili odjeljenjima uprave.\\n\\nNa okru\u017enom nivou najvi\u0161e
  ih je radilo u pravosu\u0111u, ta\u010dnije u Okru\u017enom sudu, a zatim u finansijskom
  nadzorni\u0161tvu i rudarskom satni\u0161tvu. Na kotarskom nivou tako\u0111er su
  naj\u010de\u0161\u0107i bili na pozicijama u pravosu\u0111u i finansijama. Bili
  su tako\u0111er \u010desto geometri, a pribli\u017eno jednako ih je radilo u politi\u010dkoj
  upravi, \u0161umarstvu, \u017eeljeznicama i na kancelarijskim poslovima. Po kotarima,
  najvi\u0161e ih je bilo u Donjoj Tuzli, a potom u Bijeljini i Br\u010dkom, dok su
  najrje\u0111e obavljali poslove u Maglaju i Zvorniku.\\n\\nOd velikog broja \u010dinovnika,
  bilo je onih koji su se istakli po du\u017eini sta\u017ea. Do Prvog svjetskog rata
  najdu\u017ei sta\u017e jednog \u010de\u0161kog \u010dinovnika iznosio je 23 godine.
  Ukupno je jedanaest \u010ceha ostalo najmanje jednu deceniju na slu\u017ebi u bosanskoj
  upravi. Ipak,\\n\\nPrilog prou\\n\\n\u010d\\n\\navanju u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha
  u upravi Bosne i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nveliki broj \u010dinovnika
  \u2013 \u010dak skoro jedna tre\u0107ina od ukupnog broja \u2013 ostao je samo jednu
  godinu u slu\u017ebi. U ovom trenutku, bez dodatnih istra\u017eivanja ovoga fenomena,
  mo\u017eemo samo re\u0107i da su li\u010dni afiniteti i stepen zadovoljstva slu\u017ebom
  u Bosni i Hercegovini bili glavni faktori koji su odre\u0111ivali du\u017einu ostanka
  jednog \u010dinovnika u ovoj zemlji.\\n\\nRezultati prikupljanja podataka za potrebe
