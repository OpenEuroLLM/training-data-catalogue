  | 466.274.102 | 100,00 |\\n\\nStruktura aktive ne\u017eivotnih osiguranja\\n\\nU
  strukturi aktive najve\u0107e u\u010de\u0161\u0107e imaju ulaganja sa 43,89%, materijalna
  imovina 18,82% i potra\u017eivanja 14,14%.\\n\\nUlaganja sredstava ne\u017eivotnih
  osiguranja\\n\\nU skladu sa novim Pravilnikom o visini i na\u010dinu ulaganja sredstava,
  kojim su propisani oblici imovine u koje se mogu ulagati sredstva tehni\u010dkih
  rezervi ne\u017eivotnih osiguranja i garantnog fonda, dru\u0161tva su bila obavezna
  uskladiti ulaganja sredstava sa odredbama navedenog Pravilnika do 30.06.2014. godine.
  Struktura ulaganja se zahvaljuju\u0107i nadzornim aktivnostima Agencije pobolj\u0161ava.\\n\\nObra\u010dunata
  sredstva garantnog fonda ne\u017eivotnih osiguranja na dan 31.12.2014.godine iznosila
  su 149.643.519 KM. Obra\u010dunata sredstva tehni\u010dkih rezervi ne\u017eivotnih
  osiguranja na dan\\n\\n31.12.2014.godine iznosila su 259.255.814 KM.\\n\\nPotra\u017eivanja
  uklju\u010duju\u0107i i reosiguranje\\n\\nPotra\u017eivanja, zajedno sa potra\u017eivanjima
  po osnovu zajmova (u bilansu iskazana u okviru ulaganja), iznosila su ukupno 94.668.210
  KM (na dan 31.12.2013. iznosila su 97.275.718 KM), od \u010dega su dospjela potra\u017eivanja
  u  iznosu 76.472.781 KM.\\n\\nStruktura pasive ne\u017eivotnih osiguranja\\n\\nU
  strukturi pasive najve\u0107e u\u010de\u0161\u0107e imaju tehni\u010dke rezerve
  62,20%, zatim kapital i rezerve (zakonske, statutarne i revalorizacijske) 31,35%
  dok obaveze u\u010destvuju sa 6,45%.\\n\\nKapital  ne\u017eivotnih osiguranja\\n\\nKapital
  dru\u0161tva \u010dine dioni\u010dki kapital, rezerve, akumulirana dobit i dobit
  teku\u0107eg perioda umanjen za dionice u vlasni\u0161tvu dru\u0161tva i gubitak
  u poslovanju.\\n\\nKapital na dan 31.12.2014. godine iznosio je 146.195.995 KM,
  od \u010dega je dioni\u010dki kapital iznosio 98.302.894 KM i u\u010destvovao u
  ukupnom kapitalu sa 67,24%.\\n\\nTehni\u010dke rezerve ne\u017eivotnih osiguranja\\n\\nDru\u0161tva
  za osiguranje imaju obavezu formirati adekvatan nivo tehni\u010dkih rezervi radi
  pokri\u0107a teku\u0107ih i budu\u0107ih obaveza prema osiguranicima. Tehni\u010dke
  rezerve se formiraju iz sredstava premije osiguranja.\\n\\nBruto tehni\u010dke rezerve
  ne\u017eivotnih osiguranja  na dan 31.12.2014. iznose 290.009.282 KM i ve\u0107e
  su za   12,51%   u odnosu na dan 31.12.2013.godine.\\n\\nTehni\u010dke rezerve \u010dine:
  prenosne premije (52,88%), rezerve za nastale prijavljene i nastale neprijavljene
  \u0161tete (46,68%) i ostale rezerve(0,44%).\\n\\nUdio reosiguranja u tehni\u010dkim
  rezervama iznosi 52.168.344,00KM odnosno 17,99%.\\n\\nBilans uspjeha ne\u017eivotnih
  osiguranja\\n\\nPrihodi ne\u017eivotnih osiguranja\\n\\nOstvareni prihod iz poslova
  ne\u017eivotnih osiguranja iznosi 311.198.673 KM i ve\u0107i je u odnosu na prethodnu
  godinu za 3,24 %. U strukturi prihoda ne\u017eivotnih osiguranja, prihodi iz neposrednih
  poslova osiguranja \u010dine 88,87 %, prihodi od ulaganja 5,63 %, dok ostali prihodi
  u\u010destvuju sa 5,50 %.\\n\\nStruktura prihoda ne\u017eivotnih osiguranja\\n\\nRashodi
  ne\u017eivotnih osiguranja\\n\\nU okviru ne\u017eivotnih osiguranja rashodi su ostvareni
  u iznosu 304.648.432KM i ve\u0107i su u odnosu na prethodnu godinu za 3,09 %.\\n\\nStruktura
  rashoda ne\u017eivotnih osiguranja\\n\\n\u0160tete ne\u017eivotnih osiguranja\\n\\nU
  okviru poslova ne\u017eivotnih osiguranja po broju rije\u0161eno je 79.215 \u0161teta
  ili 82,62% od ukupnog broja prijavljenih \u0161teta. Ostvareni koeficijent efikasnosti
  rje\u0161avanja \u0161teta je uglavnom na nivou prethodne godine (u istom periodu
  2013. godine koeficijent je iznosio 82,02%).\\n\\nOd ukupnog broja  rje\u0161enih  \u0161teta,
  13.960 \u0161teta ili 17,62 % se odnosi na \u0161tete koje su prijavljene u prethodnim
  periodima, a 65.255 \u0161teta ili 82,38 % na \u0161tete koje su prijavljene i rije\u0161ene
  u izvje\u0161tajnom periodu.\\n\\nUkupan iznos rije\u0161enih \u0161teta ne\u017eivotnih
  osiguranja po vrijednosti je 143.338.666KM ili 66,61 % od ukupno prijavljenih \u0161teta.
  U istom periodu prethodne godine koeficijent efikasnosti rje\u0161avanja \u0161teta
  iznosio je 63,43 %, a u 2012. godini 65,24 %. U ukupnom iznosu rije\u0161enih \u0161teta
  ne\u017eivotnih osiguranja, \u0161tete po osnovu osiguranja od automobilske odgovornosti
  (AO) u\u010destvuju sa 38,39 %.\\n\\nPregled prijavljenih i rije\u0161enih \u0161teta
