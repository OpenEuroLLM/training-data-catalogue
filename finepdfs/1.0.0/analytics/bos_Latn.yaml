  Bosanska rije\u010d, Sarajevo\\n20. Vo\u0161ahlikov\u00e1, Pavla (1998),Von Amtswegen:
  k. k. Beamteerz\u00e4hlen, Bohlau Verlag, Wien \u2013 K\u00f6ln \u2013 Weimar\\n21.
  \u0160milauer, Vladim\u00edr (1936), \u02dd\u010cesko-n\u011bmeck\u00e1 p\u0159\u00edjmeni\u02dd,
  Na\u0161e \u0159e\u010d. Listy pro vzd\u011bl\u00e1v\u00e1n\u00ed a t\u0159\u00edben\u00ed
  jazyka \u010desk\u00e9ho, God. 20, br. 2-3, 49-52.\\n\\nAmir Krpi\\n\\n\u0107\\n\\nPregled\\n\\n\u010d\\n\\nPrilog
  prou e\u0161kih\\n\\n\u010d\\n\\ninovnika u upravi tuzlanskog Okruga (1884-1914):\\n\\n\u010d\\n\\navanju
  u\\n\\n\u010d\\n\\ne\u0161\\n\\n\u0107\\n\\na\\n\\n\u010c\\n\\neha u upravi Bosne
  i Hercegovine\\n\\nDHS 3 (20) (2022),  107-138\\n\\nOVERVIEW OF CZECH OFFICIALS
  IN THE ADMINISTRATION OF THE TUZLA DISTRICT (1884-1914): A CONTRIBUTION TO THE STUDY
  OF CZECH PARTICIPATION IN THE ADMINISTRATION OF BOSNIA-HERZEGOVINA\\n\\nSummary\\n\\nThis
  paper is an overview of the Czech officials in the administration of the Donja Tuzla
  District during the Austro-Hungarian rule in Bosnia-Herzegovina. The paper has been
  written as a part of the author''s obligation in the Ph.D. studies, and it aims
  to represent a basis for further research in this field. The paper has been written
  according to the schemes of the administration published in the \u201eBosniak\\\"
  journal, official reports on the administration, laws, and order imposed upon Bosnia-Herzegovina,
  journals, and relevant studies. A general conclusion is that the Czechs were very
  numerous strangers in service in the administration of the Donja Tuzla District,
  that they were present on both district and county levels, that they worked in every
  county of the district, as well as in every department of the administration.\\n\\nKeywords:\\n\\nofficials;
  Czechs; administration; Tuzla District; Austria-Hungary\\n\\nAdresa autora Author''s
  address\\n\\nAmir Krpi\u0107 Univerzitet u Tuzli Filozofski fakultet firstname.lastname@example.org\"",
  "\"Bosna i Hercegovina FEDERACIJA BOSNE I HERCEGOVINE\\n\\nAGENCIJA ZA NADZOR OSIGURANJA
  FEDERACIJE BOSNE I HERCEGOVINE\\n\\nINFORMACIJAO POSLOVANJU DRU\u0160TAVA ZA OSIGURANJE
  U 2014. GODINI\\n\\nSarajevo, maj 2015. godine\\n\\nUvod\\n\\nInformacija o poslovanju
  dru\u0161tava za osiguranje  u Federaciji Bosne i Hercegovine (u daljem tekstu:
  Federacija), ura\u0111ena je na osnovu analize finansijskih, statisti\u010dkih i
  dodatnih izvje\u0161taja, revizorskih i aktuarskih mi\u0161ljenja dru\u0161tava
  za osiguranje, te na osnovu provedenog posrednog i neposrednog nadzora u skladu
  sa zakonskim i podzakonskim aktima koji ure\u0111uju oblast osiguranja.\\n\\nU\u010desnici
  na tr\u017ei\u0161tu osiguranja\\n\\nDru\u0161tva za osiguranje\\n\\nNa dan 31.12.2014.
  godine u Federaciji je 13 dru\u0161tava za osiguranje registrirano za obavljanje
  poslova osiguranja, od \u010dega pet dru\u0161tava obavlja isklju\u010divo poslove
  ne\u017eivotnih osiguranja, sedam dru\u0161tava poslove ne\u017eivotnih i \u017eivotnog
  osiguranja (kompozitna dru\u0161tva) i jedno dru\u0161tvo poslove reosiguranja:\\n\\n|
  Ne\u017eivotna osiguranja | Ne\u017eivotna i \u017eivotna osiguranja |\\n|---|---|\\n|
  ASA | BSO |\\n| Camelija | Croatia |\\n| Euroherc | Grawe |\\n| VGT | Merkur BH
  |\\n| Zovko | Sarajevo |\\n|  | Triglav |\\n|  | Uniqa |\\n\\nOd navedenih dru\u0161tava
  jedanaest posluje na podru\u010dju Republike Srpske (u daljem tekstu: RS) putem
  podru\u017enica i to: ASA, BSO, Camelija, Croatia, Euroherc, Merkur BH, Sarajevo,
  Triglav, Uniqa, VGT i Zovko.\\n\\nSedam dru\u0161tava iz RS ima dozvolu da posluje
  na podru\u010dju Federacije putem podru\u017enica i to: Aura, Dunav, Drina, Bobar,
  Br\u010dko Gas, Wiener i Mikrofin.\\n\\nSedam od trinaest dru\u0161tava je u ve\u0107inskom
  vlasni\u0161tvu rezidenata.\\n\\nOstali u\u010desnici na tr\u017ei\u0161tu osiguranja\\n\\nPored
  vlastitog kanala prodaje osiguranja dru\u0161tva sve vi\u0161e prodaju police osiguranja
  putem posrednika u osiguranju, koji u ime i za ra\u010dun dru\u0161tva zaklju\u010duju
  ugovore o osiguranju (zastupnici u osiguranju) ili dovode u vezu dru\u0161tvo sa
  osiguranicima s ciljem ugovaranja osiguranja (brokeri u osiguranju).\\n\\nSa 31.12.2014.
  godine u registrima Agencije za nadzor upisano je 176 pravnih i fizi\u010dkih lica,
  posrednika u osiguranju i to: 41 pravno lice (33 dru\u0161tva za zastupanje u osiguranju,
  5 brokerskih dru\u0161tava i 3 dru\u0161tva registrovana u RS a koja pru\u017eaju
  usluge posredovanja u osiguranju u Federaciji putem organizacione jedinice) i 135
  fizi\u010dkih lica \u2013 zastupnici u osiguranju (od navedenog iznosa registrovano
  je 90 obrtni\u010dkih djelatnosti).\\n\\nZa\u0161titni fond Federacije Bosne i Hercegovine\\n\\nZa\u0161titni
  fond Federacije Bosne i Hercegovine  (u daljem tekstu: Za\u0161titni fond) uspostavljen
  je Zakonom o osiguranju od odgovornosti za motorna vozila i ostale odredbe o obaveznom
  osiguranju od odgovornosti, kao posebno pravno lice. Nadle\u017enost Za\u0161titnog
  fonda je pokrivanje \u0161teta koje pretrpe \u017ertve saobra\u0107ajnih nezgoda,
  koje ne mogu biti nadokna\u0111ene sistemom obaveznog osiguranja od odgovornosti
  ( ako je lice koje je odgovorno za nezgodu nepoznato-nematerijalna \u0161teta ili
  ako je nezgodu prouzro\u010dilo neosigurano vozilo-materijalna i nematerijalna \u0161teta),
  kao i \u0161tete kada je dru\u0161tvu oduzeto odobrenje za rad i pokrenut postupak
  posebne likvidacije.\\n\\nDru\u0161tva za osiguranje u Federaciji koja se bave obaveznim
  osiguranjem, uklju\u010duju\u0107i i podru\u017enice dru\u0161tava za osiguranje
  sa sjedi\u0161tem u RS su \u010dlanovi Za\u0161titnog fonda i imaju obavezu uplate
  doprinosa Fondu, srazmjerno ostvarenoj godi\u0161njoj premiji osiguranja od odgovornosti
  za motorna vozila.\\n\\nU narednoj tabeli daje se pregled rje\u0161avanja i isplate
