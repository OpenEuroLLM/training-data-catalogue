  i objavit \u0107e se u \\\"Slu\u017ebenom glasniku Grada Mostara\\\".\\n\\nBroj:
  02-M-10084 /2024\\nDatum: 28.11.2024\\n\\nGradona\u010delnik\\nMario Kordi\u0107\\n\\nOperativni
