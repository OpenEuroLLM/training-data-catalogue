  da pola\u017eu sve predmete koji su zavr\u0161eni u zimskom semestru.\\n- U junsko-julskom,
  septembarskom i oktobarskom roku studenti mogu da pola\u017eu sve predmete iz teku\u0107e
  \u0161kolske godine.\\n- Studenti pola\u017eu predmete iz diferencijalnog programa
  i ispite prene\u0161ene iz prethodnih godina studija u rokovima i terminima u kojima
  se organizuje polaganje ispita iz tih predmeta za redovne studente u teku\u0107oj
  godini studija. Izuzetak od navedenog pravila \u010dine ispiti iz predmeta koji
  predstavljaju uslov za pristup i polaganje bar dva ili vi\u0161e predmeta u teku\u0107oj
  godini studija. Za ove predmete mogu da se organizuju ispiti i u ostalim rokovima
  pod uslovom da je student odslu\u0161ao te predmete i ispunio sve planirane predispitne
  obaveze o \u010demu odluku donosi rektor univerziteta.\\n- Jedan ispitni termin
  se organizuje za studente koji imaju status apsolventa za polaganje preostalih predmeta
  u svakom nastavnom ciklusu, kao i u mjesecu septembru odn. oktobru. Odluku o organizovanju
  apsolventskih ispitnih termina donosi rektor univerziteta.\\n- Zbog specifi\u010dnosti
  nastavnog procesa na pojedinim predmetima i potrebe ispunjavanja planiranih predispitnih
  obaveza u sistemu kompleksne evaluacije znanja studenata ispitni termini pojedinih
  ispitnih rokova mogu da se organizuju i u drugoj polovini prethodnog mjeseca odn.
  u prvoj polovini narednog mjeseca u odnosu na op\u0161te ispitni rokove. Ispitni
  termini pojedinih parcijalnih ispita odn. polaganja predispitnih obaveza organizuju
  se neposredno po zavr\u0161etku obrade nastavnog predmeta i planiranih nastavno-pedago\u0161kih
  aktivnosti za pojedine predmete u skladu sa Nastavnim planom i programom predmeta.\\n\\nD/
