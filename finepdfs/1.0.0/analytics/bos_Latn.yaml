  Shodno novom Zakonu o bud\u017eetu i fiskalnoj odgovornosti, koji je donijet u 2014.,
  struktura javnog duga je promijenjena. Javni dug je definisan kao dug centralnog
  nivoa dr\u017eave (dr\u017eavni dug) i lokalnog nivoa (dug lokalne samouprave).
  Dug lokalnih samouprava isklju\u010den je iz strukture unutra\u0161njeg dr\u017eavnog
  duga, dok sa druge strane, u unutra\u0161nji dug je dodat iznos koji se odnosi na
  dug pravnim licima i privrednim dru\u0161tvima.U skladu sa novim Zakonom, u kvartalnim
  izvje\u0161tajima prikazuje se dr\u017eavni dug, dok se u godi\u0161njem izvje\u0161taju
  prikazuje javni dug.\\n\\nMAKROEKONOMSKO OKRU\u017dENJE U CRNOJ GORI\\n\\nPrema
  procjeni CBCG, realni rast crnogorske privrede, u prvoj polovini 2015. godine, kre\u0107e
  se u o\u010dekivanom rasponu za projektovani godi\u0161nji rast, sa centralnom projekcijom
  od oko 3,5%. Ve\u0107ina statisti\u010dkih pokazatelja, tokom prvih \u0161est mjeseci
  ove godine, ima trend rasta i potvr\u0111uje ovakva o\u010dekivanja. Pove\u0107ana
  je ukupna industrijska proizvodnja, obim aktivnosti u \u0161umarstvu, ve\u0107ini
  vidova saobra\u0107aja, pove\u0107an je promet u maloprodaji, ve\u0107a je vrijednost
  izvr\u0161enih gra\u0111evinskih radova, a zabilje\u017een je i rast dolazaka i
  no\u0107enja turista. Po\u010detak godine obilje\u017eilo je pove\u0107anje deficitu
  teku\u0107eg ra\u010duna, ali i rast priliva stranih direktnih investicija. Bankarski
  sistem je stabilan, solventan i likvidan. Podaci iz fiskalnog sektora ukazuju na
  stabilna kretanja koja se ogledaju u pove\u0107anju ostvarenja prihoda u odnosu
  na plan za 1,5% i smanjenja izdataka, u ovom periodu, u odnosu na plan u iznosu
  od 9,8%. Rast javnog duga zahtjeva dugoro\u010dni pristup i kontinuirani oprez u
  vo\u0111enju fiskalne politike, kako se ne bi ugrozila fiskalna stabilnost.\\n\\nInflacija
  u Crnoj Gori, mjerenja potro\u0161a\u010dkim cijenama, u julu je, u odnosu na decembar
  2014. godine iznosila 2,2%. Prosje\u010dna stopa potro\u0161a\u010dkih cijena u
  prvih \u0161est mjeseci 2015. godine u odnosu na isti period prethodne godine iznosila
  je 1,5%, dok su na godi\u0161njem nivou cijene bile ve\u0107e za 1,9%.\\n\\nU prvih
  \u0161est mjeseci 2015. godine ostvaren je rast ukupne industrijske proizvodnje
  od 9,6% u odnosu na isti period 2014. godine. Rast proizvodnje je zabilje\u017een
  u sva tri sektora: preradiva\u010dke industrije od 15,9%, vadenja rude i kamena
  od 2,4% i sektoru snabdijevanje elektri\u010dnom energijom, gasom i parom od 2,3%.\\n\\nPrema
  podacima Monstata, Crnu Goru je u prvih \u0161est mjeseci posjetilo 390.174 turista,
  \u0161to predstavlja pove\u0107anje od 13,8% u odnosu na isti period prethodne godine.
  Broj dolazaka doma\u0107ih turista pove\u0107an je za 29,5%, a stranih za 11,7%.
  Ostvareno je 2 miliona no\u0107enja, \u0161to je za 13,7% vi\u0161e u odnosu na
  isti period 2014. godine. Pove\u0107an je broj no\u0107enja doma\u0107ih turista
  za 21%, dok je broj stranih turista pove\u0107an za 12,8%.\\n\\nU vazdu\u0161nom
  saobra\u0107aju je broj prevezenih putnika, za prvih \u0161est mjeseci 2015. godine
  u odnosu na isti period prethodne smanjen za 1%, dok je prevoz robe pove\u0107an
  za 9,3%. U istom periodu pove\u0107an je broj prevezenih putnika u drumskom saobra\u0107aju
  za 3,1%, dok je prevoz robe pove\u0107an za 14,7%. U \u017eeljezni\u010dkom saobra\u0107aju,
  u posmatranom periodu, prevoz putnika ve\u0107i je za 7,7%, dok je prevoz robe ve\u0107i
  za 20,9%.\\n\\n\u0160umarstvo je ostvarilo rast proizvodnje od 27,1% u odnosu na
  isti period prethodne godine. Prema preliminarnim podacima Monstata, gra\u0111evinarstvo
  je ostvarilo rast, mjerenog vrijedno\u0161\u0107u izvr\u0161enih gra\u0111evinskih
  radova od 9,7%, dok je mjereno efektivnim \u010dasovima rada ostvareno pove\u0107anje
  od 5,3%, u odnosu na prvu polovinu 2014. godine.\\n\\nBankarski sektor je bio stabilan,
  \u0161to potvr\u0111uju koeficijenti likvidnosti i solventnosti koji su tokom posmatranog
  perioda bili zna\u010dajno iznad propisanog nivoa. Bilansna suma banaka je pove\u0107ana,
  pri \u010demu je njen rast na strani active najve\u0107im dijelom rezultat rasta
  potra\u017eivanja banaka po osnovu plasmana u hartije od vrijednosti. Ukupan iznos
  nekvalitetnih kredita, kao i njihovo u\u010de\u0161\u0107e u ukupnim kreditima banaka
  je smanjeno u posmatranom periodu. Me\u0111utim, oni i dalje predstavljaju najve\u0107u
  ranjivost bankarskog sistema. Me\u0111utim, o\u010dekuje se da \u0107e se implementacijom
  normativnog okvira za dobrovoljno finansijsko restrukturiranje duga podsta\u0107i
  oporavak du\u017enika i, na taj na\u010din, ubla\u017eiti ovaj problem.\\n\\nU julu
  2015. godine, prosje\u010dna ponderisana efektivna kamatna stopa banaka na ukupno
  odobrene kredite je iznosila 9,01%, \u0161to predstavlja pad od 0,21 p.p. u odnosu
  na kraju prethodne godine. Prosje\u010dna ponderisana efektivna kamatna stopa na
  novoodobrene kredite iznosila je 8,85%, \u0161to predstavlja pad od 0,17 p.p. u
  odnosu na kraju prethodne godine. Prosje\u010dno ponderisana efektivna kamatna stopa
  na ukupne depozite iznosila je 1,49% na kraju juna 2015. godine i bila je za 0,37
  p.p. ni\u017ea u odnosu na kraju 2014. godine.\\n\\nPrema preliminarnim podacima
  Ministarstva financija, deficit bud\u017eeta Crne Gore za \u0161est mjeseci 2015.
  godine, iznosio je 117,9 miliona eura, odnosno 3,3% procijenjenog BDP-a. Deficit
  je vi\u0161i u odnosu na isti period prethodne godine uslijed ve\u0107ih izdataka
  za kapitalni bud\u017eet, kao i zbog pove\u0107anja otplate obaveza iz prethodnih
  godina. Na kraju juna 2015. godine, dr\u017eavni dug (bruto) Crne Gore je, prema
  podacima Ministarstva financija, iznosio 2.532,4 miliona eura. Od ukupnog iznosa
  bruto dr\u017eavnog duga, 2.160,2 miliona eura ili 85,3% odnosilo se na spoljni
  dug, dok se preostalih 372,2 miliona eura ili 14,7% odnosilo na unutra\u0161nji
  dug. Ukoliko uklju\u010dimo depozite Ministarstva financija zajedno sa 38.477 uncii
  zlata, neto dr\u017eavni dug Crne Gore, na kraju prvog polugodi\u0161ta 2015. godine,
  iznosio je 2.159,6 miliona eura.\\n\\nU prvoj polovini 2015. godine deficit teku\u0107eg
  ra\u010duna je pove\u0107an za 9,6% u pore\u0111enju sa prethodnom godinom i iznosio
  je 490,4 miliona eura. U posmatranom periodu zabilje\u017een je pad izvoza uz istovremeni
  rast uvoza roba, \u0161to je rezultiralo ve\u0107im deficitom na ra\u010dunu roba.
  Prema preliminarnim podacima, deficit na ra\u010dunu roba je za 5,7% ve\u0107i nego
  u istom periodu prethodne godine. Izvoz roba se smanjio za 5,7%, dok je uvoz bio
  ve\u0107i za 3,5% u odnosu na isti period 2014. godine. Na ra\u010dunu usluga zabilje\u017een
  je suficit u iznosu od 121 milion eura, \u0161to je na gotovo istom nivou kao i
  2014. godine. U posmatranom periodu na podra\u010dunima faktorskih dohodaka i teku\u0107ih
  transfera ostvaren je suficit u iznosu od 75,3 miliona eura ili 8,5% manje nego
  prethodne godine.\\n\\nPrema preliminarnim podacima, neto priliv stranih direktnih
  investicija iznosio je 185,4 miliona eura ili 19,1% vi\u0161e u odnosu na isti period
  2014. godine. Ukupan priliv SDI iznosio je 222,3 miliona eura, od \u010dega se najve\u0107i
  dio odnosio na interkompanijski dug 48,8% i kupovinu nekretnina 31,5%.\\n\\nBroj
  zaposlenih u prvoj polovini ove godine u prosjeku je iznosio 174.170 i bio je vi\u0161i
  za 1,1% u odnosu na isti period prethodne godine, dok je broj zaposlenih u julu
  teku\u0107e godine u odnosu na\\n\\n---\\n\\n1 Iskazano ponderisanim indeksom, a
  neponderisanim je proizvodnja ve\u0107a 30,4 % za isti period.\\n\\n2 Shodno Zakonu
  o bud\u017eetu i fiskalnoj odgovornosti, na kvartalnom nivou objavljuju se podaci
  samo za dr\u017eavni dug.\\n\\ndecembar prethodne godine bio vi\u0161i za 5,7%.
  Petnaest od ukupno devetnaest sektora ostvarilo je rast broja zaposlenih u pore\u0111enju
  sa prvom polovinom prethodne godine. Najve\u0107i rast broja zaposlenih evidentiran
  je u sektoru poslovanja sa nekretninama, a najve\u0107i pad u sektoru poljoprivrede,
  \u0161umarstva i ribarstva.\\n\\nBroj registrovanih nezaposlenih lica u prvim \u0161est
  mjeseci ove godine, u prosjeku, iznosio je 33.774, \u0161to je za 0,1% vi\u0161e
  nego u istom periodu prethodne godine. U julu 2015. godine broj nezaposlenih se
  smanjio za 6,6% u odnosu na decembar 2014. Stopa nezaposlenosti je, prema podacima
  Zavoda za zapo\u0161ljavanje, u julu 2015. godine iznosila 13,4% \u0161to je za
  0,21 p.p. ni\u017ee od stope iz jula 2014. godine.\\n\\nPrema podacima Monstata,
  prosje\u010dna zarada u Crnoj Gori u prvoj polovini 2015. godine iznosila je 726
  eura i bila je vi\u0161a za 0,3% od prosje\u010dne zarade u istom periodu prethodne
  godine. Prosje\u010dna zarada bez poreza i doprinosa je iznosila 480 eura i bila
  je vi\u0161a za 0,6%. U pore\u0111enju sa zemljama iz okru\u017eenja, Crna Gora
  po visini prosje\u010dne plate zauzima tre\u0107e mjesto, i to iza Slovenije i Hrvatske,
  a ispred BiH, Srbije i Makedonije.\\n\\nREALNI SEKTOR\\n\\n01\\n\\n1.1. Bruto doma\u0107i
  proizvod\\n\\nNa osnovu preliminarnih podataka Monstat-a rast BDP-a za 2014. godinu
  iznosio je 1,5%, a za prvi kvartal ove godine 3,2%. Iako zvani\u010dni podaci o
  kretanju BDP-a za drugi kvartal 2015. godine nisu dostupni, raspolo\u017eivi statisti\u010dki
  pokazatelji u ve\u0107ini sektora, tokom prvih \u0161est mjeseci ove godine, uglavnom
  imaju trend rasta. Rast se bilje\u017ei u sektoru turizma, trgovine, ve\u0107ini
  vidova saobra\u0107aja, \u0161umarstvu, gra\u0111evinarstvu. Zabilje\u017een je
  i rast ukupne industrijske proizvodnje, kao rezultat rasta proizvodnje u sva tri
  sektora. Procjena CBCG je da je ekonomski rast u prvoj polovini 2015. godine iznosio
  oko 3,5%.\\n\\nTabela 1.1\\n\\n| Kvartalni bruto doma\u0107i proizvod \u2013 promjena
  u % (preliminarni podaci) | 2014. | 2015. |\\n|---------------------------------------------------------------|-------|-------|\\n|                                                             |
  I     | II    | III   | IV    | I     |\\n| BDP - nominalna stopa                                       |
  2,9   | 1,1   | 3,5   | 3,8   | 3,0   |\\n| BDP \u2013 realna stopa                                           |
  1,5   | 0,3   | 1,3   | 2,6   | 3,2   |\\n\\nIzvor: Monstat\\n\\nTokom ovog perioda
  bilje\u017ei se rast broja zaposlenih u odnosu na isti period prethodne godine,
  kao i u odnosu na kraj prethodne godine, dok je broj registrovanih nezaposlenih
  lica od marta mjeseca 2015. godine u kontinuiranom padu. Ovaj period karakteri\u0161e
  skroman rast bruto i neto plata, dok je stopa inflacije u julu u odnosu na decembar
  prethodne godine iznosila 2,2%, a godi\u0161nja inflacija je iznosila 1,9%.\\n\\n1.2.
  Djalatnosti\\n\\n1.2.1. Industrijska proizvodnja\\n\\nU prvoj polovini 2015. godine
  do\u0161lo je do rasta ukupne industrijske proizvodnje za 9,6%, u odnosu na isti
  period prethodne godine. Rast proizvodnje je zabilje\u017een u sva tri sektora:
  preradiva\u010dke industrije za 15,9%, va\u0111enja rude i kamena za 2,4% i snabdijevanja
  elektri\u010dnom energijom, gasom i parom za 2,3%. Na godi\u0161njem nivou tako\u0111e
  je ostvaren rast ukupne industrijske proizvodnje od 29,7%, zbog rasta proizvodnje
  u sva tri sektora: snabdijevanja elektri\u010dnom energijom, gasom i parom od 36,9%,
  va\u0111enje rude i kamena 29,8% i sektoru preradiva\u010dka industrija od 27,6%.
  Posmatrano po mjesecima rast\\n\\n---\\n\\n3 U septembru 2015. godine MONSTAT \u0107e
  pre\u0107i na novu verziju metodologije ESA 2010 u obra\u010dunu BDP-a kada \u0107e
  i objaviti kona\u010dne rezultate BDP-a za 2014. godinu, a \u0161to \u0107e u odre\u0111enoj
  mjeri uticati na rezultate ve\u0107 objavljenih obra\u010duna.\\n\\n4 Stope u odnosu
  na isti kvartal prethodne godine. Prikazani podaci su preliminarni sve do objave
  kona\u010dnog obra\u010duna BDP-a za 2014. godinu u septembru ove godine.\\n\\nIndustrijska
  proizvodnja je zabilje\u017een u februaru (10,1%), martu (5,3%) i julu (8,9%), dok
  je pad proizvodnje ostvaren u januaru (19,1%), aprilu (6,2%) i maju (24,3%).\\n\\nTokom
  prvih \u0161est mjeseci ove godine, u odnosu na isti period prethodne, zabilje\u017een
  je rast u dvanaest oblasti preradiva\u010dke industrije, koji \u010dine 41,6% ukupne
  industrijske proizvodnje. Posmatrano po oblastima, najve\u0107i rast je zabilje\u017een
  u oblastima: proizvodnja proizvoda od gume i plastike (preko 200%) i proizvodnja
  metalnih proizvoda, osim ma\u0161ina i ure\u0111aja (preko 200%). Rast je zabilje\u017een
  i u oblastima: proizvodnja osnovnih farmaceutskih proizvoda i preparata (37,4%),
  proizvodnja hemikalija i hemijskih proizvoda (37%), proizvodnja duvanskih proizvoda
  (32,4%), popravka i monta\u017ea ma\u0161ina i opreme (25,4%).\\n\\nGrafik 1.1\\n\\nIndustrijska
  proizvodnja, godi\u0161nja stopa\\n\\nIzvor: Monstat\\n\\nGrafik 1.2\\n\\nIndustrijska
  proizvodnja po sektorima. \u00d8 2010 = 100\\n\\nIzvor: Monstat\\n\\n5 Niska osnovica
  iz prethodne godine i pojava novog privrednog subjekta u obuhvatu industrije su
  doveli do pojave enormne stope rasta.\\n\\nproizvodnja ma\u0161ina i opreme na drugom
  mjestu nepomenute (23,2%), proizvodnja proizvoda od drva i plute i sl. (23,1%),
  proizvodnja proizvoda od ostalih nemetalnih minerala (18,3%), proizvodnja osnovnih
  metala (11,9%), proizvodnja odjevnih predmeta (8,6%) i \u0161tampanje i umno\u017eavanje
  video zapisa (6,8%).\\n\\nPad proizvodnje zabilje\u017een je u pet oblasti preradiva\u010dke
  industrije koji \u010dine 12,3% ukupne industrijske proizvodnje. Najve\u0107i pad
  ostvaren je u oblasti proizvodnja prehrambenih proizvoda (-27,3%) i proizvodnji
  ko\u017ee i predmeta od ko\u017ee (-25%). Pad je zabilje\u017een i u oblastima:
  proizvodnja pi\u0107a (-12,2%), proizvodnja papira i proizvoda od papira (-11,1%)
  i proizvodnji namje\u0161taja (-7,5%).\\n\\nSektor va\u0111enja ruda i kamena bilje\u017ei
  rast proizvodnje od 2,4%, najvi\u0161e zbog rasta proizvodnje u oblastima ostalo
  rudarstvo od 11,4% i va\u0111enje uglja od 2,8%. Pad proizvodnje je zabilje\u017een
  u oblasti va\u0111enja ruda metala od 10,9%.\\n\\nSnabdijevanje elektri\u010dnom
  energijom, gasom i parom, u prvih \u0161est mjeseci ove godine, bilo je vi\u0161e
  za 2,3% u odnosu na uporedni period prethodne godine. Proizvodnja elektri\u010dne
  energije je, prema podacima Elektroprivrede, bila uglavnom na nivou uporednog perioda
  prethodne godine. HE \u201ePiva\u201c i \u201ePeru\u0107ica\u201c su proizvele 743
  GWh elektri\u010dne energije, odnosno 0,8% manje nego u prvoj polovini 2014. godine.
  TE \u201ePljevlja\u201c je zbog remonta koji je trajao od 25. aprila do 24. maja
  i kasnijeg priklju\u010denja na mre\u017eu, 15 dana nakon remonta, proizvela 95%
  plana odnosno 610 GWh elektri\u010dne energije.\\n\\nPrate\u0107i kretanje industrijske
  proizvodnje tokom prikazanog perioda primjetan je blago opadaju\u0107i trend sve
  do po\u010detka 2013. godine, kada dolazi do stagnacije odnosno zaustavljanja opadaju\u0107eg
  trenda i zna\u010dajnijeg rasta u posljednja dva mjeseca. Industrijska proizvodnja
  je tokom 2014. godine, sa izrazitim opadaju\u0107im fluktuacijama posebno sredinom
  godine, bilje\u017eila skroman godi\u0161nji rast u januaru, februaru, septembru
  i oktobru. U prvoj polovini 2015. godine dolazi do rasta ukupne industrijske proizvodnje.\\n\\n1.2.2.
  Turizam\\n\\nPrema podacima Monstata, tokom prvih \u0161est mjeseci Crnu Goru posjetilo
  je 390.174 turista, \u0161to je za 13,8% vi\u0161e nego u istom periodu prethodne
  godine. Broj dolazaka doma\u0107ih turista pove\u0107an je za 29,5%, a stranih za
  11,7%. Tokom prvih \u0161est mjeseci sva mjesta bilje\u017ee rast broja posjetilaca.
  Porast broja posjetilaca registrovan je u glavnom gradu za 21,7%, primorskim mjestima
  za 10,7%, planinskim mjestima za 47,4%, ostalim turisti\u010dkim mjestima za 21,8%
  i ostalim mjestima za 3,4% u odnosu na isti period prethodne godine. U strukturi
  dolazaka stranih turista u ukupnim dolascima, najzastupljeniji su bili turisti iz
  Rusije (17%), Srbije (13,9%), Albanije (5,1%), Bosne i Hercegovine (4,3%) i Francuske
  (3,9%).\\n\\nOstvareno je 2 miliona no\u0107enja, \u0161to je za 13,7% vi\u0161e
  u odnosu na isti period 2014. godine. Od toga 217.708 su bili doma\u0107i turisti,
  \u0161to je za 21% vi\u0161e nego u istom periodu prethodne godine, dok su strani
  turisti ostvarili 1,8 miliona no\u0107enja, \u0161to predstavlja rast od 12,8%.
  Broj no\u0107enja se pove\u0107ao u glavnom gradu za 24,3%, primorskim mjestima
  za 12,7%, planinskim mjestima za 39,6% i ostalim turisti\u010dkim mjestima za 16,5%,
  dok je smanjen broj no\u0107enja u ostalim mjestima za 1,5%.\\n\\nVe\u0107i broj
  no\u0107enja, u prvih \u0161est mjeseci, ostvarili su turisti iz Njema\u010dke (37,7%),
  Ukrajine (23,4%), Ujedinjenog Kraljevstva (21,8%), Rusije (9,1%) i Bjelorusije (3,4%),
  dok je smanjen broj no\u0107enja turista iz Poljske (-11,2%) i Francuske (-1,9%).
  Vi\u0161e no\u0107enja iz zemalja regiona ostvarili su turisti iz Srbije (20,2%),
  Bosne i Hercegovine (8,8%), Kosova (21%), Albanije (37,6%), Hrvatske (2,4%) i Makedonije
  (3,1%).\\n\\nTokom drugog kvartala nastavljeno je sa promocijom turisti\u010dke
  ponude, a intenzivirana je i promocija ljetne turisti\u010dke ponude u zemljama
  regiona. U okviru road show kampanje koju Nacionalna turisti\u010dka organizacija
  Crne Gore uobi\u010dajeno realizuje u regionu, predstavljena je ovo-godi\u0161nja
  turisti\u010dka ponuda u Beogradu, Novom Sadu, Kragujevcu, Ljubljani, Pri\u0161tini,
  Sarajevu i Banja Luci.\\n\\nNastavljena je i promocija na inostranim sajmovima:
  na berzi turizma AITF 2015. u Bakuu, koji je odr\u017ean od 02. do 04. aprila, zatim
  na 19. me\u0111unarodnom sajmu turizma \u201eOdmor bez grani\u010da \u2013 ljeto
  2015\u201c, koji je odr\u017ean od 03. do 05. aprila u Sankt Peterburgu. Predstavljena
  je turisti\u010dka ponuda Crne Gore i na konferenciji u kineskom gradu Ningbou,
  koja se odr\u017eava u sklopu ve\u0107 postoje\u0107eg projekta saradnje izme\u0111u
  zemalja CenNacionalna turisti\u010dka organizacija u\u010destovala je na 24. Me\u0111unarodnoj
  turisti\u010dkoj berzi i sajmu turizma, opreme za hotelijerstvo i ugostiteljstvo
  - METUBES koji je odr\u017ean u Budvi od 16. do 18. aprila. Sajam je okupio najva\u017enije
  nosioci turisti\u010dke ponude gdje je prezentovana aktuelna ponuda za predstoje\u0107u
  turisti\u010dku sezonu. U Budvi je u julu odr\u017eana i druga UNWTO Konferencija
  o upravljanju destinacijom na Mediteranu. Konferencija je okupila desetine renomiranih
  me\u0111unarodnih i doma\u0107ih ekspertaca iz oblasti turizma i vi\u0161e od 200
  u\u010desnika koji su imali priliku da prenesu svoja iskustva iz oblasti turizma.\\n\\nNacionalna
  turisti\u010dka organizacija Crne Gore potpisala je Memorandum o saradnji sa Agencijom
  za promociju i podr\u0161ku turizma Republike Makedonije. Cilj potpisivanja memoranduma
  je razvoj turizma dvije dr\u017eave i saradnja nadle\u017enih organa, posebno u
  dijelu realizacije promotivnih aktivnosti na udaljenim tr\u017ei\u0161tima.\\n\\nU
  organizaciji Nacionalne turisti\u010dke organizacije Crne Gore u maju je u Crnoj
  Gori boravila studijska grupa turoperatora iz Kine. Grupu su \u010dinili predstavnici
  12 kineskih turoperatora \u0161to je od izuzetnog zna\u010daja za dalju promociju
  crnogorskog turizma na tr\u017ei\u0161tu Kine, najbr\u017ee rastu\u0107eg tr\u017ei\u0161ta
  u svijetu.\\n\\nVode\u0107i svjetski turisti\u010dki vodi\u010d, Lonely Planet,
  uvrstio je pla\u017eu Jaz na prvo mjesto liste deset najboljih evropskih pla\u017ea
  koje ovog ljeta treba posjetiti, pozicioniraju\u0107i Crnu Goru kao turisti\u010dku
  destinaciju. Lonely Planet izdava\u010dka ku\u0107a posjeduje veliku distributivnu
  mre\u017eu, \u0161to mo\u017ee imati velikog uticaja na dalju promociju Crne Gore
  kao turisti\u010dke destinacije.\\n\\n**Boks 1.1 \u2013 Turizam \u2013 osnovni pokazatelji
  po regijama**\\n\\nPrema najnovijem Izvje\u0161taju UNWTO-a (World Tourism Barometer
  - jun 2015. godine) zabilje\u017een je rast ukupnih me\u0111unarodnih dolazaka turista
  od 4,4% za prva \u010detiri mjeseca ove godine, u odnosu na isti period 2014. godine.
  Ovim je nastavljen rastu\u0107i trend dolazaka (+4,5% prosje\u010dno od 2010. godine).
  Rast turista je evidentiran u skoro svim regijama, osim u Africi, gdje je ostvaren
  pad najvi\u0161e zbog pojave bolesti Ebole u regionu Zapadne Afrike. U Izvje\u0161taju
  su date optimisti\u010dne prognoze i za period maj-avgust 2015. godine, kada se
  o\u010dekuje oko 500 miliona me\u0111unarodnih dolazaka.\\n\\nNajve\u0107i rast
  je zabilje\u017een u Americi od 6% (grafik br. 1), jer su svi regioni ostvarili
  zna\u010dajan rast dolazaka turista u prva \u010detiri mjeseca. Evropa, kao najposje\u0107eniji
  turisti\u010dki\\n\\n**Grafik 1**\\nMe\u0111unarodni dolasci turista (promjena u
  %)\\n\\n| Regija          | 2014*/2013 | 2015*/2014 |\\n|-----------------|------------|------------|\\n|
  Svijet          | 4,3        | 4          |\\n| Evropa          | 2,7        | 5          |\\n|
  Azija i Pacifik | 5,4        | 4          |\\n| Amerika         | 8          | 6          |\\n|
  Afrika          | 2,6        | -6         |\\n| Srednji Istok   | 5,4        | 4          |\\n\\nIzvor:
  World Tourism Organization (UNWTO)\\n\\nregion, bilje\u017ei rast od 4,9%, na \u0161ta
  je uticao i oporavak u regionu Centralne i Isto\u010dne Evrope, nakon lo\u0161ih
  rezultata u prethodnoj godini prouzrokovanih konfliktom u Ukrajini i usporavanjem
  ekonomije Rusije. Broj me\u0111unarodnih dolazaka u Aziji i Pacifiku, tokom posmatranog
  perioda, pove\u0107an je za 4,4%, dok je na Srednjem Istoku, nakon negativnog trenda
  iz perioda 2011.-2013. godina, nastavljen pozitivan trend iz prethodne godine (ostvaren
  je rast od 4,2%). Afrika je jedini region koji je ostvario pad dolazaka od 5,6%
  u prva \u010detiri mjeseca.\\n\\nPosmatrano po podregijama najve\u0107i rast me\u0111unarodnih
  dolazaka turista zabilje\u017een je u Ju\u017enoj Americi i Okeaniji (po 8%), zatim
  na Karibima i Isto\u010dnoj i Centralnoj Evropi (po 7%), dok je najve\u0107i pad
  dolazaka zabilje\u017een u Sjevernoj Africi (-7%).\\n\\nPrema projekcijama UNWTO-a
  do kraja 2015. godine o\u010dekuje se rast me\u0111unarodnih dolazaka izme\u0111u
  3% i 4%, \u0161to je u granicama dugoro\u010dnih projekcija (3,8% godi\u0161nje
  od 2010. do 2020. godine).\\n\\n| Tabela 1 |\\n|----------|\\n| Projekcije rasta
