  \u0438\u0437\u043d\u043e\u0441\u0438\u043b\u0435 \u0441\u0443 1,9 hiljada eura.\\n\\nDR\u017dAVNI
  DUG 06\\n\\nBruto dr\u017eavni dug\\\\textsuperscript{22} Crne Gore je, prema podacima
  Ministarstva finansija, iznosio 2.532,4 miliona eura na kraju juna 2015. godine,
  i u odnosu na kraj 2014. godine ve\u0107i je za 589,5 miliona eura ili za 30,3%.
  Na rast dr\u017eavnog duga u prvom polugodu 2015. godine najvi\u0161e je uticala
  emisija euroobveznica, kao i povla\u010denje dvije tran\u0161e kredita za izgradnju
  dijela autoputa od kineske Exim banke. U odnosu na isti period prethodne godine,
  dr\u017eavni dug zabilje\u017eio rast od 25,2%.\\n\\nOd ukupnog iznosa bruto dr\u017eavnog
  duga, 2.160,2 miliona eura ili 85,3% odnosilo se na spoljni dug, dok se preostalih
  372,2 miliona eura ili 14,7% odnosilo na unutra\u0161nji dug.\\n\\nUkoliko uklju\u010dimo
  depozite Ministarstva finansija zajedno sa 38.477 unci zlata, \\\\textit{neto dr\u017eavni
  dug} Crne Gore na kraju prvog polugoda 2015. godine, iznosio je 2.159,6 miliona
  eura. U odnosu na kraj 2014. godine, neto dr\u017eavni dug je zabilje\u017eio rast
  od 14,1%, dok je u odnosu na isti period prethodne godine ve\u0107i za 16,6%.\\n\\n\\\\begin{table}[h]\\n\\\\centering\\n\\\\begin{tabular}{|l|c|c|c|}\\n\\\\hline\\n
  & Jun 2014. & Decembar 2014. & Jun 2015. \\\\\\\\\\n\\\\hline\\nUnutra\u0161nji
