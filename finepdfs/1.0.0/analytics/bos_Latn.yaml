  \u201eIzgleda globalne ekonomije\u201c (WEO), izdanje a\u017eurirano jula 2015.\\n\\nSvjetska
  ekonomija je u drugom kvartalu 2015. nastavila da raste sporijim intenzitetom, a
  nedovoljno jasni \u201esignalni\u201c oko budu\u0107eg rasta su bili prisutni u
  ve\u0107ini klju\u010dnih svjetskih ekonomija. Ekonomija SAD-a je tokom drugog kvartala
  rasla po znatno ve\u0107oj stopi nego u prvom kvartalu o.g., dok stimulativne vladine
  mjere u Kini tek treba da daju efekte. Japan i Eurozona su zabilje\u017eili rast
  koji je dijelom potpomognut i mjerama ekspanzivne monetarne politike.\\n\\n---\\n\\n34
  A\u017eurirano izdanje.\\n\\nPrema MMF-u, kratkoro\u010dni rizici za svjetsku ekonomiju
  su rast volatilnosti na finansijskim tr\u017ei\u0161tima, uklju\u010duju\u0107i
  krizu u Gr\u010dkoj, kao i geopoliti\u010dka de\u0161avanja. U srednjem roku rizici
  za svjetsku ekonomiju su odsustvo rasta zaposlenosti kod razvijenih zemalja, ni\u017ee
  cijene berzanskih roba, dalje ja\u010danje dolara i ve\u0107e usporavanje rasta
  kineske ekonomije.\\n\\nNiska ili negativna stopa inflacije je i tokom drugog kvartala
  2015. godine bila karakteristi\u010dna za ve\u0107inu razvijenih zemalja. Pod uticajem
  geopoliti\u010dkih odnosno finansijskih nestabilnosti, kod odre\u0111enih zemalja
  u razvoju/usponu stope inflacije su bile izuzetno visoke. Veliki pad cijene goriva,
  koji se desio u drugoj polovini 2014. godine i u 2015. godini, imao je veliki uticaj
  na dezinflatorna kretanja \u0161irom svijeta. U drugom kvartalu je do\u0161lo do
  blagog oporavka cijena nafte.\\n\\nKod nekoliko zemalja, razvijenih i u usponu/razvoju,
  na snazi su politike koje imaju za cilj potpomaganje privrednog oporavka i/ili rast
  cijena. Mnoga su tr\u017ei\u0161ta uslovno re\u010deno zavisna od monetarnih politika
  i nagli prestanak istih bi imao negativne efekte.\\n\\nTr\u017ei\u0161na o\u010dekivanja
  su da bi u narednom periodu Federalne rezerve mogle pove\u0107ati kamatnu stopu,
  \u0161to bi bio prvi rast od nastanka krize. Takva o\u010dekivanja su ve\u0107 inkorporirana
  u rast LIBOR-a. Tr\u017ei\u0161na o\u010dekivanja su da taj rast ne\u0107e biti
  ve\u0107i od 0,25 p.p. Me\u0111utim, FED-ovi potezi \u0107e i u narednom periodu
  zavistiti od tr\u017ei\u0161nih podataka, prvenstveno inflacije i stope nezaposlenosti.
  Glavno pitanje koje se postavlja jeste da li \u0107e brzina promjene monetarne politike
  biti usagla\u0161ena sa promjenama u realnoj ekonomiji, odnosno onim \u0161to joj
  je potrebno.\\n\\nPokazatelji volatilnosti finansijskih tr\u017ei\u0161ta (npr.
  VIX), kao i pokazatelji kreditnog i rizika likvidnosti na tr\u017ei\u0161tima novca
  (kakvi su TED spred i LIBOR-OIS spred) tokom drugog kvartala 2015. godine, istorijski
  gledano, bili su na prili\u010dno niskim nivoima\\\\(^{35}\\\\). VIX indeks je tokom
  ovog kvartala bio prili\u010dno\\n\\n---\\n\\n\\\\(^{35}\\\\) VIX je mjera implicitne
  volatilnosti opcija na berzanski indeks S&P 500, i time mjera o\u010dekivane volatilnosti
  cijena akcija (za narednih 30 dana). TED spred je razlika izme\u0111u tromjese\u010dnog
  USD LIBOR-a i ameri\u010dkih dr\u017eavnih zapisa iste ro\u010dnosti, dok je LIBOR-OIS
  spred razlika izme\u0111u LIBOR-a i prekono\u0107ne svop (fiksne) stope, koja je
  prakti\u010dno tr\u017ei\u0161na o\u010dekivana vrijednost neke referentne prekono\u0107ne
  kamatne stope (u Americi obi\u010dno efektivne \u201estope na federalne fondove\u201c)
  tokom odre\u0111enog budu\u0107eg perioda.\\n\\nujedna\u010den ali se volatilnost
  pove\u0107ala krajem juna i po\u010detkom jula o.g. TED spred je nastavio da raste
  i u ovom kvartalu, \u0161to je rezultat blagog rasta tromjese\u010dnog USD LIBOR-a,
  ali to u svakom slu\u010daju nijesu zabrinjavaju\u0107e vrijednosti indeksa.\\n\\n\u0160angajski
  SSE kompozitni indeks, kao rezultat pove\u0107ane likvidnosti, bilje\u017eio je
  ogroman rast ali je u sredinom juna nastao ogroman pad, koji je prisutan i u tre\u0107em
  kvartalu, uz pribli\u017eno 30% gubitka vrijednosti. Berzanski indeksi u SAD-u su
  tokom drugog kvartala, pored manjih oscilacija, ostali na pribli\u017eno istim vrijednostima.
  Indeks Nikkei 225 je tokom drugog kvartala nastavio rastu\u0107i trend iz prethodnog
  perioda, ali je rast bio manjeg intenziteta nego u prvom kvartalu o.g. (5,4%), a
  rast indeksa je po\u010detkom tre\u0107eg kvartala prili\u010dno zaustavljen. Glavni
  indeksi Eurozone su bili u padu tokom ovog kvartala.\\n\\n8.1. Razvijene zemlje\\n\\n8.1.1.
  Sjedinjene ameri\u010dke dr\u017eave\\n\\nEkonomija SAD-a je tokom drugog kvartala
  o.g. ostvarila rast od 2,3%36 u odnosu na prethodni kvartal37. Gledano u odnosu
  na drugi kvartal 2014. tako\u0111e je ostvaren rast od 2,3%. Najve\u0107i pozitivni
  doprinos BDP-u je ostvarila potro\u0161nja doma\u0107instava koja je na kvartalnom
  nivou rasla 2,9%, pri \u010demu su li\u010dni prihodi i raspolo\u017eivi dohodak
  takode rasli. Javna potro\u0161nja je tako\u0111e imala ve\u0107i pozitivni doprinos.
  Izvoz je nakon lo\u0161ijeg prvog kvartala ostvario rast u drugom kvartalu. Uvoz
  roba i usluga je u drugom kvartalu tako\u0111e rastao, ali manjim intenzitetom.\\n\\nGrafik
  8.3\\n\\nKvartalni BDP, %\\n\\n| Kvartal | Kvartalni BDP, Q/Q-1 | Kvartalni BDP,
