  za realizaciju projekata nevladinih organizacija.\\n\\nNa Konkurs se javilo 48(\u010detrdesetosam)
  nevladinih organizacija. 47(\u010detrdesetsedam) nevladinih organizacija je podnijelo
  urednu konkursom propisanu dokumentaciju, dok je 1(jedna) nevladina organizacija
  podnijela nepotpunu dokumentaciju.\\n\\nKomisija je prihvatila i razmatrala 47 (\u010detrdesetsedam)
  projekata, a 1 (jedan) je projekat odbijen. Naime, NVO \u201cUDRU\u017dENJE BORACA
  RATOVA OD 1990. GODINE HERCEG NOVI\u201d je podnijelo nepotpunu dokumentaciju, a
