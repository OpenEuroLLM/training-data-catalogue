  | -0,50 |\\n\\nIzvor: Monstat\\n\\n### 1.3. Cijene\\n\\nPotro\u0161a\u010dke cijene
  su u junu u odnosu na kraj prethodne godine pove\u0107ane za 2,2%. U ovom periodu
  najve\u0107i rast zabilje\u017eile su cijene iz kategorije *hoteli i restorani*
  za 7,8%, zatim cijene iz kategorije *prevoz* 4,6%, kategorije *hrana i bezalkoholna
  pi\u0107a* 3,4% i *alkoholna pi\u0107a i duvan* 3%. Pad cijena u junu u odnosu na
  decembar prethodne godine zabilje\u017een je u kategoriji *odje\u0107a i obu\u0107a*
  (-1,4%), kao i kategoriji *komunikacije* (-0,2%). Posmatraju\u0107i kretanje cijena
  na mjese\u010dnom nivou najve\u0107i rast potro\u0161a\u010dkih cijena zabilje\u017een
  je u martu (1,1%), dok je mjese\u010dni pad zabilje\u017een samo u januaru (-0,2%).
  Godi\u0161nja inflacija u junu iznosila je 1,9% i vi\u0161a je za 2,2 p. p. od godi\u0161nje
  inflacije iz decembra prethodne godine.\\n\\nU prvih \u0161est mjeseci ove godine
  cijene pojedinih prehrambenih proizvoda su pove\u0107ane i to cijene vo\u0107a za
  34,6%, ulja i masti za 5,9%, povr\u0107a za 2,7%, \u0161e\u0107era, d\u017eema,
  meda, \u010dokolade i konditorskih proizvoda za 2,1%, ostalih prehrambenih proizvoda
  za 2,1%, mesa za 2%, bezalkoholnih pi\u0107a za 1,5%, ribe za 1% i hljeba i \u017eitarica
  za 0,6%, dok su cijene mlijeka sira i jaja ni\u017ee za 0,3%. Pove\u0107anje cijena
  ve\u0107ine proizvoda u kategoriji *hrana i bezalkoholna pi\u0107a* su uticali da
  ova grupa ostvari najve\u0107i doprinos inflaciji od 1,3%. Doprinos od 0,5% ostvarila
  je kategorija *prevoz* zbog rasta cijena goriva i maziva od 8,2%, dok je doprinos
  od 0,2% zabilje\u017eila kategorija *hoteli i restorani* zbog rasta cijena usluga
  smje\u0161taja od 25,1%.\\n\\n---\\n\\n8 Izra\u017eeno preko prevezenih putnika
  u hiljadama, a preko putni\u010dkih kilometara pad je 1,7%.\\n\\n9 Izra\u017eeno
  preko hiljada tona, a izra\u017eeno tonskim kilometrima pove\u0107anje je iznosilo
  39,2%.\\n\\nPove\u0107anje cijena duvana od 3,6% i alkoholnih pi\u0107a od 1,8%
  uticale su na rast cijena u kategoriji *alkoholna pi\u0107a i duvan* (3%). Tokom
  ovog perioda rast cijena zabilje\u017een je i u kategorijama *poku\u0107stvo* i
  *rutinsko odr\u017eavanje stana* (1,1%), *zdravlje* (0,9%), *ostali proizvodi i
  usluge* (0,7%), *stanovanje, voda, struja, gas i druga goriva* (0,6%) i *rekreacija
  i kultura* (0,4%). Pad cijena zabilje\u017een je u kategorijama *odje\u0107a i obu\u0107a*
  (-1,4%) i *komunikacije* (-0,2%). U kategoriji *obrazovanje* nije bilo promjena
  cijena u julu ove godine u odnosu na decembar 2014. godine.\\n\\nMjese\u010dna *bazna
  inflacija* je tokom aprila i maja imala ni\u017ei nivo od zvani\u010dne mjese\u010dne
  inflacije, dok je u julu bazna inflacija bila vi\u0161a od zvani\u010dne. Bazna
  inflacija je u aprilu imala negativan a zvani\u010dna pozitivan predznak, dok su
  u maju i julu zabilje\u017eene pozitivne stope oba pokazatelja.\\n\\nGodi\u0161nja
  inflacija u julu iznosila je 1,9%, a najve\u0107i rast na godi\u0161njem nivou su
  zabilje\u017eile cijene iz kategorije *hoteli i restorani* 4,2%, *alkoholna pi\u0107a
  i duvan* 3,4%, *rekreacija i kultura* 3%, *odje\u0107a i obu\u0107a* i *zdravlje*
  od po 2,7%. Rast je zabilje\u017een i u kategorijama *hrana* i *bezalkoholna pi\u0107a*
  od 2,4%, *stanovanje, voda, struja, gas i druga goriva* od 2,3%, *poku\u0107stvo*
  i *rutinsko odr\u017eavanje stana* od 0,7% i *ostali proizvodi i usluge* od 0,1%.
  Godi\u0161nji pad zabilje\u017eile su cijene u kategoriji *prevoz* od 0,7%, dok
  su cijene u kategorijama *komunikacije* i *obrazovanje* ostale nepromijenjene.\\n\\nPoredjenjem
  godi\u0161nje inflacije ostvarene u Crnoj Gori i inflacije u izabranim zemljama,
  vidi se da je u Crnoj Gori i Srbiji zabilje\u017eena najve\u0107a godi\u0161nja
  stopa inflacije od 1,9%. Negativnu godi\u0161nju stopu imaju: Rumunija (-0,9%),
  Slovenija (-0,9%), Bugarska (-0,6%), Poljska (-0,6%), Bosna i Hercegovina (-0,5%),
  Litvanijska (-0,2%) i Slova\u010dka (-0,1%). Od susjednih zemalja, pored Srbije,
  najvi\u0161a godi\u0161nja inflacija ostvarena je u Albaniji (1,4%).\\n\\n**Grafik
  1.12**\\n\\n*Kretanje ukupne inflacije i bazne inflacije (%)*\\n\\n![Grafik 1.12](image)\\n\\nIzvor:
  Monstat i kalkulacija CBCG\\n\\n**Grafik 1.13**\\n\\n*Godi\u0161nja inflacija u
  izabranim zemljama, jun 2015. Godine*\\n\\n![Grafik 1.13](image)\\n\\nIzvor: Nacionalni
  zavodi za statistiku i Eurostat\\n\\nU Euro zoni godi\u0161nja inflacija iznosila
  je 0,2%, pri \u010demu su najve\u0107i pozitivan uticaj na inflaciju imale cijene
  duvana sa godi\u0161njim rastom od 3,2%, restorani i kafi\u0107i 1,4% i rente 1,2%,
  dok su najve\u0107i negativan uticaj imale cijene lo\u017e ulja sa godi\u0161njom
  stopom od (-19,6%), goriva za transport (-7,5%) i gasa (-3,1%).\\n\\nCijene nafte
  u prvoj polovini ove godine su ni\u017ee u odnosu na prvu polovinu prethodne godine.
  Prosje\u010dna cijena referentne korpe OPEC-a, u prvih \u0161est mjeseci iznosila
  je 55,1 USD/barel, \u0161to je za 47,7% ni\u017ee u odnosu na prosje\u010dnu cijenu
  iz istog perioda prethodne godine. Prosje\u010dna cijena brenta u prvih \u0161est
  mjeseci bila je 57,91 USD/barel, \u0161to je za 46,9% ni\u017ee u odnosu na prosje\u010dnu
  cijenu iz istog perioda prethodne godine. Rast cijena nafte na svjetskim tr\u017ei\u0161tima
  u prvoj polovini 2015. godine rezultat je zna\u010dajno ve\u0107e tra\u017enje za
  sirovom naftom od o\u010dekivane, zatim smanjenja ameri\u010dkih zaliha, kao i prisutnih
  geopoliti\u010dkih nemira. Najvi\u0161a cijena brenta tokom prvog polugodi\u0161ta
  ove godine zabilje\u017eena je u maju i iznosila je 64,32 USD/barel i bila je vi\u0161a
  za 2,9% od cijene iz decembra prethodne godine.\\n\\nIzvor: Monstat i \u201cMonhly
  Oil Market Reports\u201d, OPEC\\n\\n---\\n\\n10 Napominjemo da se, i pored indeksnih
  promjena, doprinos u\u010de\u0161\u0107a pojedinih kategorija zbog ponderacione
  strukture evidentira tek na drugoj, odnosno tre\u0107oj decimali.\\n\\nCijene proizvo\u0111a\u010da
  industrijskih proizvoda, su u julu u odnosu na kraj 2014. godine zabilje\u017eile
  rast od 0,1%, zbog rasta cijena u sektoru prera\u0111iva\u010dka industrija od 0,2%.
  Pad cijena zabilje\u017een je u sektoru vadenje ruda i kamena od 0,6%, dok su cijene
  u sektoru snabdijevanja elektri\u010dnom energijom, gasom i parom ostale nepromijenjene.
  Cijene proizvo\u0111a\u010da industrijskih proizvoda, na godi\u0161njem nivou, porasle
  su za 0,4%.\\n\\n1.4. Tr\u017ei\u0161te rada\\n\\nBroj zaposlenih u prvih \u0161est
  mjeseci ove godine, u prosjeku je iznosio 174.170 i bio je vi\u0161i za 1,1% u odnosu
  na isti period prethodne godine, dok je broj zaposlenih u julu u odnosu na decembar
  prethodne godine bio vi\u0161i za 5,7%. Petnaest sektora od ukupno devetnaest bilje\u017ei
  rast broja zaposlenih, a posmatrano po pojedinim sektorima, najve\u0107i rast zabilje\u017een
  je u sektoru poslovanje s nekretninama (12,2%), zatim sektoru umjetnost, zabava
  i rekreacija (6,1%), kao i stru\u010dne, nau\u010dne i tehni\u010dke djelatnosti
  (6%). Najve\u0107i pad broja zaposlenih zabilje\u017een je u sektoru prera\u0111iva\u010dke
  industrije i poljoprivrede, \u0161umarstva i ribarstva od po 5,7%.\\n\\nPosmatraju\u0107i
  strukturu zaposlenih, tokom prvih \u0161est mjeseci ove godine, uo\u010dava se da
  je najvi\u0161e zaposlenih u sektoru trgovine (20,7%) i sektoru dr\u017eavna uprava
  i odbrana, obavezno socijalno osiguranje (12,1%), dok je najmanje zaposlenih u sektoru
  poslovi s nekretninama (1%) i sektoru vadenje ruda i kamena (1,1%).\\n\\nBroj registrovanih
  nezaposlenih lica u prvoj polovini ove godine, u prosjeku, iznosio je 33.774, \u0161to
  je za 0,1% vi\u0161e nego u istom periodu prethodne godine. Trend postepenog pada
  nezaposlenih bilje\u017ei se od marta ove godine i u julu je, na evidenciji Zavoda
  za zapo\u0161ljavanje, bilo registrovano 31.092 lica koja tra\u017ee zaposlenje,
  \u0161to je za 10,4% manje nego u decembru 2014. godine.\\n\\nU Skup\u0161tini je
  28. maja 2015. godine usvojen Zakon o izmjeni Zakona o strancima. Novim zakonom
  se odlaze sprovodenje djelova prethodnog zakona za 1. novembar ove godine, a koji
  se od...\\n\\nnose na potrebne dozvole iz Zavoda za zapo\u0161ljavanje stranaca
  u slu\u010daju nedostatka doma\u0107eg kadra. Ove odredbe zakona imaju za cilj uskla\u0111ivanje
  broja stranaca i njihove kvalifikacione strukture na tr\u017ei\u0161tu rada Crne
  Gore sa realnim potrebama poslodavaca. Madutim, zbog problema koji su se javili
  u obezbjedivanju odgovaraju\u0107e strukture zaposlenih, prilikom pripreme turisti\u010dke
  sezone, Zakonom o izmjeni Zakona o strancima je odlo\u017eena njihova primjena.\\n\\nPrema
  podacima Zavoda za zapo\u0161ljavanje stopa nezaposlenosti, u julu, iznosila je
  13,40% i ni\u017ea je za 0,21 p.p. od stope nezaposlenosti iz juna prethodne godine.
  Drugu stopu nezaposlenosti objavljuje Monstat na kvartalnom nivou, a na osnovu Ankete
  o radnoj snazi koja je usagla\u0161ena sa preporukama Eurostat-a. Kretanje ove dvije
  stope prikazano je na grafiku br. 1.18.\\n\\n**Zarade**\\n\\nU prvih \u0161est mjeseci
  prosje\u010dna zarada u Crnoj Gori iznosila je 726 eura i bila je vi\u0161a za 0,3%
  u odnosu na isti period prethodne godine. Prosje\u010dna zarada bez poreza i doprinosa
  iznosila je 480 eura, \u0161to je za 0,6% vi\u0161e u odnosu na isti period prethodne
  godine. Rast bruto zarada, u prvih \u0161est mjeseci ove godine u odnosu na isti
  period prethodne godine, zabilje\u017een je u jedanaest sektora, dok je rast neto
  zarada zabilje\u017een u dvanaest od ukupno devetnaest sektora. Najve\u0107e zarade
  bez poreza i doprinosa zabilje\u017eene su u oblasti finansijske djelatnosti i djelatnosti
  osiguranja (881 eura), snabdijevanje elektri\u010dnom energijom (846 eura), informisanje
  i komunikacije (677 eura), poslovanje s nekretninama (675 eura), dok najmanju zaradu
  bilje\u017ee zaposleni u trgovini na veliko i trgovini na malo (335 eura). Najve\u0107i
  rast zarada bez poreza i doprinosa zabilje\u017een je u sektoru gra\u0111evinarstva
  8,1%, dok je najmanji rast zabilje\u017een u sektoru preradiva\u010dke industrije
  0,5%. Pad zarada bez poreza i doprinosa evidentiran je u sedam sektora, pri \u010demu
  je najve\u0107i pad evidentiran u sektoru ostale uslu\u017ene djelatnosti od 7,8%,
  a najmanji u sektorima administrativne i pomo\u0107ne uslu\u017ene djelatnosti i
  umjetnost, zabava i rekreacija od po 0,8%.\\n\\n### Tabela 1.3\\n\\n| Sektor                                                                 |
