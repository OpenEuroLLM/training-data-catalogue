  \u2013                       | +381.34.356.010  |\\n\\nU srcu va\u0161eg motora.\\n\\nAlways
  ask your mechanic for Selenia\u00ae\\n\\nMotor va\u0161eg vozila je fabri\u010dki
  napunjen sa uljem SELENIJA. Ovo je asortiman motornih ulja koji zadovoljava najsavremenije
  me\u0111unarodne specifikacije. Njegove superiorne tehni\u010dke karakteristike
  omogu\u0107avaju da ulje Selenia garantuje najbolje performanse i za\u0161titu va\u0161eg
  motora.\\n\\nSELENIJA K PURE ENERGY\\nSinteti\u010dko mazivo proizvedeno za najnoviju
  generaciju benzinskih motora, male emisije. Njegova specifi\u010dna formulacija
  garantuje maksimalnu za\u0161titu tako\u0111e i za motore visokih performansi sa
  turbopunjenjem i velikim termalnim stresom. Njegov mali sadr\u017eaj pepela poma\u017ee
  odr\u017eavanju potpune \u010disto\u0107e modernih katalizatora.\\n\\nSELENIJA WR
  PURE ENERGY\\nPotpuno sinteti\u010dko mazivo koje zadovoljava potrebe najnovijih
  dizel motora. Nizak sadr\u017eaj pepela \u0161titi filter \u010destica od ostataka
  sagorevanja. Sistem velike ekonomi\u010dne potro\u0161nje goriva koji omogu\u0107ava
  zna\u010dajnu u\u0161tedu goriva. Smanjuje opasnost od prilanja turbine i obezbe\u0111uje
  za\u0161titu sve boljih performansi dizel motora.\\n\\nSELENIJA MULTIPOWER\\nPosebno
  idealno za za\u0161titu nove generacije benzinskih motora, vrlo efikasno \u010dak
  i u najo\u0161trijim vremenskim uslovima. Garantuje smanjenje potro\u0161nje goriva
  (\u0161tedi energiju) i tako\u0111e je idealno za alternativne motore.\\n\\nSELENIJA
  SPORT\\nPotpuno sinteti\u010dko mazivo koje zadovoljava potrebe motora visokih performansi.
  Predvi\u0111eno je za za\u0161titu motora i u uslovima visokog termalnog stresa,
  spre\u010dava talo\u017eenje na turbinama kako bi se postigla maksimalna performansa
  i potpuna bezbednost.\\n\\nOvaj asortiman obuhvata tako\u0111e Selenia StAR Pure
  Energy, Selenia Racing, Selenia K, Selenia WR, Selenia 20K, Selenia 20K AR.\\n\\nZa
  vi\u0161e informacija o proizvodima Selenia, posetite na\u0161 web sajt www.selenia.com\\n\\nBELE\u0160KE\\n\\n|
