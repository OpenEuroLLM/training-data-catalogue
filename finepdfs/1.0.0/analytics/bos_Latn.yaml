  Biro za ekonomske analize SAD-a\\n\\n36 Anualizovana stopa, Biro za ekonomske analize
  SAD-a, prva procjena.\\n37 Podatak za prvi kvartal je revidiran sa -0,7% na 0,6%.\\n\\nIndustrijska
  proizvodnja je i tokom drugog kvartala o.g. nastavila negativnu tendenciju iz prethodnog
  perioda, i tek u posljednjem mjesecu drugog kvartala ostvaren je blagi rast, koji
  je bio evidentiran i u julu o.g.. Preradiva\u010dka industrija je ostvarila bolje
  rezultate tokom drugog kvartala u odnosu na prvi kvartal o.g.. Iskori\u0161\u0107enost
  kapaciteta je i dalje ispod dugoro\u010dnog prosjeka iskori\u0161\u0107enosti.\\n\\nIndikatori
  sa tr\u017ei\u0161ta rada su generalno pozitivni. Stopa nezaposlenosti i dalje ima
  opadaju\u0107i trend, a na kraju drugog kvartala o.g. iznosila je 5,3%. Trenutna
  stopa je blizu stopama iz perioda prije krize. Podaci o broju novih radnih mjesta
  u privatnom sektoru i dalje ukazuju na dinami\u010dnost tr\u017ei\u0161ta rada.\\n\\nNiske
  stope inflacije iz prvog kvartala su nastavljene i tokom drugog kvartala o.g. pa
  je godi\u0161nja stopa inflacije neznatno varirala oko nulte stope. Veliki uticaj
  na pad stope imale su cijena energenata, a ukoliko se izuzmu efekti hrane i energenata,
  godi\u0161nja inflacija je na kraju ovog kvartala iznosila 1,8%, kao i na kraju
  prvog kvartala, i bila je blizu ciljanim vrijednostima centralne banke.\\n\\n8.1.2.
  Eurozona\\n\\nPrethodno procijenjeni rast bruto doma\u0107eg proizvoda, u iznosu
  od 0,4% za prvi kvartal 2015. godine je i potvr\u0111en. Posljednji rezultati istra\u017eivanja,
  pokazuju da se nastavlja trend umjerenog rasta i da rast BDP-a na kraju drugog kvartala
  iznosi 0,3%. U odnosu na isti kvartal prethodne godine BDP je na kraju drugog kvartala
  2015. godine porastao za 1,2%. Predvi\u0111a se nastavak ekonomskog rasta u narednom
  periodu, zahvaljuju\u0107i mjerama fiskalne konsolidacije koje se sprovode i rastu
  doma\u0107e tra\u017enje, podstaknute mjerama monetarne politike koje sprovodi ECB,
  a koje imaju pozitivan efekat na uslove finansiranja. Niske cijene nafte nastavi\u0107e
  da podr\u017eavaju kupovnu mo\u0107 stanovni\u0161tva i uspje\u0161no poslovanje
  kompanija, i time podsticati potro\u0161nju i investicije.\\n\\nTabela 8.2\\n\\n|
  Stopa rasta BDP-a (na osnovu sezonski uskla\u0111enih podataka) | Procentualna promjena
