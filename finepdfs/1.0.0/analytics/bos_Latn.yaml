  relevantnim evropskim direktivama.\\n\\nNi\u017ee navedeni postupci po\u0161tovani
  su prilikom merenja potro\u0161nje:\\n\\n- gradski ciklus: hladan start pra\u0107en
  vo\u017enjom koja simulira kori\u0161\u0107enje vozila u gradskoj vo\u017enji;\\n-
  vangradski ciklus: \u010desta dodavanja gasa u svim brzinama, koji simuliraju vangradsko
  kori\u0161\u0107enje vozila: brzina varira izme\u0111u 0 i 120 km/h;\\n- kombinovana
  potro\u0161nja goriva: izra\u010dunata merenjem oko 37% gradskog ciklusa i 63% vangradskog
  ciklusa.\\n\\nVA\u017dNO: Vrsta puta, uslovi u saobra\u0107aju, vremenski uslovi,
