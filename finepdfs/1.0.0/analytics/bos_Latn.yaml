  U toku drugog kvartala do\u0161lo je do povla\u010denja dvije tran\u0161e kredita
  u iznosu od 169,8 miliona eura, dok je ukupan iznos odobrenog kredita 847,9 miliona
  eura.\\\\(^{24}\\\\)\\n\\n### 6.3. Izdate garancije\\n\\nNa kraju prvog polugodja
  2015. godine garancije Crne Gore iznosile su 314,1 milion eura ili 8,8% procijenjenog
  BDP-a, i bile su na pribli\u017eno istom nivou kao i na kraju 2014. godine.\\n\\n\\\\(^{24}\\\\)
  Originalan iznos povu\u010denih sredstava je 188,8 miliona dolara, dok je ukupan
  iznos odobrenog kredita 944 miliona dolara. Kori\u0161\u0107en je kurs EUR/USD na
  dan 30.06.2015. godine koji je objavila Centralna banka Crne Gore, i iznosio je
  1,113300.\\n\\nStrane garancije Crne Gore iznosile su 306,5 miliona eura ili 8,6%
  BDP-a. Ako uklju\u010dimo strane garancije u iznos spoljnog dr\u017eavnog duga,
  onda bi on iznosio 68,9% BDP-a. Va\u017eno je ista\u0107i da se pomenuti iznos stranih
  garancija odnosi na povu\u010dena kreditna sredstva. Kada se uzme u obzir cijeli
  ugovoreni iznos, strane garancije dosti\u017eu iznos od 489,5 miliona eura.\\n\\nUkupan
  iznos doma\u0107ih garancija na kraju prvog polugoda 2015. godine je iznosio 7,6
  miliona eura (0,2% BDP-a). Unutra\u0161nji dug sa garancijama iznosi 10,6% BDP-a.\\n\\nU
  toku prvih \u0161est mjeseci 2015. godine nije bilo aktiviranja garancija. I pored
  toga, narednom periodu neophodan je veoma oprezan i restriktivitan pristup u pogledu
  izdavanja novih garancija, jer one predstavljaju potencijalni javni dug.\\n\\n###
  6.4. Otplata duga\\n\\nUkupna otplata duga\\\\(^{25}\\\\), u prvih \u0161est mjeseci
  2015. godine, iznosila je 219,5 miliona eura ili 6,1% procijenjenog BDP-a za 2015.
  godinu. Otplata duga po osnovu glavnice finansirana je iz inostranih i doma\u0107ih
  pozajmica, prihoda od privatizacije i\\n\\n---\\n\\n\\\\(^{25}\\\\) Ukupna otplata
  duga obuhvata glavnice, kamate, garancije i pla\u0107ene provizije.\\n\\nkori\u0161\u0107enjem
  dr\u017eavnih depozita, dok su se kamata, obaveze iz prethodnog perioda i provizije
  financirale iz teku\u0107ih prihoda.\\n\\n6.5. Projekcija i odr\u017eivost dr\u017eavnog
  duga\\n\\nPrema poslednjim projekcijama Ministarstva finansija\\\\textsuperscript{26},
  o\u010dekuje se rast dr\u017eavnog duga Crne Gore. Rast dr\u017eavnog duga bi\u0107e
  uzrokovan rastom spoljnog duga, dok \u0107e doma\u0107i dug imati pozitivnu tendenciju
  i bilje\u017ei\u0107e pad do kraja 2017. godine (tabela br. 6.5). Potreba finansiranja
  izgradnje dijela autoputa Bar-Boljare, najve\u0107im dijelom \u0107e uticati na
  rast spoljnog duga u narednom periodu.\\n\\nTabela 6.5\\n\\n| Dr\u017eavni dug Crne
