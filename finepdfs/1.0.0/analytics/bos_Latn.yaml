  3. Edition\"", "\"SUPREME COURT OF KOSOVO GJYKATA SUPREME E KOSOV\u00cbS VRHOVNI
  SUD KOSOVA\\n\\nKOSOVO PROPERTY AGENCY (KPA) APPEALS PANEL KOLEGJI I APELIT T\u00cb
  AKP-s\u00eb \u017dALBENO VE\u0106E KAI\\n\\nGSK-KPA-A-135/13\\n\\nPri\u0161tina,\\n\\n08.
  april 2015. godine\\n\\nU postupku:\\n\\nI H\\n\\nUl. V G  br..\\n\\nU\\n\\n\u017dalilac\\n\\nprotiv\\n\\nM
  \u0110 K, \u017d 681/z S\\n\\nPodnosilac zahteva/Tu\u017eenik\\n\\n\u017dalbeno
  ve\u0107e KAI Vrhovnog suda Kosova u sastavu Sylejman Nuredini, predsedavaju\u0107i
  sudija, Rolandus Bruin i Willem Brouwer, sudije, u \u017ealbi na odluku Komisije
  za imovinske zahteve Kosova KPCC/D/A/140/2012 (spis predmeta upisan u KAI pod brojem
  KPA48394), od dana 29. februara 2012. godine, nakon zasedanja odr\u017eanog dana
  08. aprila 2015. godine, donosi slede\u0107e:\\n\\nPresuda\\n\\n1. Prihvata se \u017ealba
  I H na odluku Komisije za imovinske zahteve Kosova KPCC/D/A/140/2012 (spis predmeta
  upisan u KAI pod brojem KPA48394) od dana 29. februara 2012. godine.\\n2. Poni\u0161tava
  se odluka Komisije za imovinske zahtev KPCC /D/A/140/2012 (u delu koji se odnosi
  na spis predmeta upisan u KAI pod brojem KPA48394) od dana 29. februara 2012. godine,
  te se odbacuje imovinski zahtev M  \u0110  po\u0161to isti ne spada u okviru nadle\u017enosti
  KIZK.\\n\\nProceduralni i \u010dinjeni\u010dni si\u017ee:\\n\\n1. Dana 12. decembra
  2007. godine, M  \u0110  (u daljem tekstu: Podnosilac zahteva) u ime svog pokojnog
  oca, Veljka \u0110or\u0111evi\u0107a, podneo je imovinski zahtev u Kosovskoj agenciji
  za imovinu (KAI), kojim je potra\u017eivao potvr\u0111ivanje njegovog svojinskog
  prava i ponovni posed imovine koja se nalazi i selu Talinoc i Muhaxher\u00ebve,
  Uro\u0161evac, parcela br. 760, njiva tre\u0107e klase, u povr\u0161ini od 20 ari
  i 63 m 2 (u daljem tekstu: imovina u zahtevu). On izjavljuje da je njegov pokojni
  otac bio su-vlasnik parcele te i da je izgubio pravo svojine dana 15. juna 1999.
  godine, kao rezultat okolnosti na Kosovu u 1998/1999. godini. Podnosilac zahteva
  navodi da je imovina uzurpirana te potra\u017euje naknadu za kori\u0161\u0107enje
  imovine.\\n2. U prilogu imovinskom zahtev, on je me\u0111u ostalog dostavio slede\u0107e:\\n-
  Predlog za fizi\u010dku podelu imovine, podnet od strane predlaga\u010da V  \u0110  (koga
  zastupa M \u0110 ) pred Op\u0161tinskim sudom u Uro\u0161evcu dana 20. februara
  1998. godine. Na osnovu predloga za fizi\u010dku podelu, 1/3 idealnog dela imovine
  u zahtevu, parcele br. 760, njiva tre\u0107e klase u povr\u0161ini od 20 ari i 63
  m 2 , pripada predlaga\u010du, V  \u0110 .\\n- Izvod iz mati\u010dne knjige umrlih
  br. 203-29, izdat dana 06. juna 2006. godine, od strane Kancelarije za upis stanovni\u0161tva
  u Kraljevu, na osnovu kojeg je ustanovljeno da je V  \u0110  preminuo dana 30. novembra
  2001. godine.\\n- Posedovni list br. 165 od dana 30. oktobra 2007. godine, izdat
  od strane Geodetskog instituta Srbije, Centar za katastar nepokretne imovine u Uro\u0161evcu,
  gde je imovina u zahtevu upisana na ime Veljka \u0110 , kao su-vlasnika 1/4 idealnog
  dela.\\n3. Dana 06. juna 2008. godine, KAI je obavila obave\u0161tenje imovine postavljanjem
  znaka na mestu na kome se nalazila parcela, koju ozna\u010dava da je imovina predmet
  imovinskog zahteva te i da\\n\\nzainteresovane strane trebaju podneti odgovor u
  vremenskom roku od 30. dana. Niko nije podneo odgovor na obave\u0161tenje te se
  prema tome imovinski zahtev tretirao kao nesporan.\\n4. Na osnovu izve\u0161taja
  o verifikaciji od dana 07. jula 2007. godine, posednovi list br. 165 je pozitivno
  verifikovan.\\n5. Odlukom KPCC/RES/16/2010 od dana 24. februara 2010. godine, KIZK
  je obave\u0161tena od strane Izvr\u0161nog sekretarijata da imovinski zahtev nije
  valjano obra\u0111en ili ta\u010dnije da imovinski zahtev nije valjano obave\u0161ten
  te i da Komisija nije bila obave\u0161tena povodom ove \u010dinjenice. Imovinski
  zahtev je vra\u0107en Izvr\u0161nom sekretarijatu KAI za dalje obra\u0111ivanje
  zasnovanog na pravilno obave\u0161tenje imovine.\\n6. Dana 31. avgusta 2010. godine,
  KAI je ponovo obavila obave\u0161tenje imovine ali ovoga puta putem objavljivanja
  u Listu za obave\u0161tenje br. 8 i Biltenu UNHCR kancelarije za imovinu. List i
  bilten su ostavljeni vlasniku prodavnice u Talinoc i Muhaxher\u00ebve Uro\u0161evac,
  koji je prihvatio da raspodeli iste zainteresovanim stranama. Ova objavljivanja
  su tako\u0111e ostavljena na ulazu u izlazu sela Talinoc i Muhaxher\u00ebve, Op\u0161tinskom
  sudu, Skup\u0161tini op\u0161tine, i u brojnim kancelarijama op\u0161tinske nadle\u017enosti
  u Uro\u0161evcu.\\n7. Unutar zakonskog kora od 30. dana, kao \u0161to je predvi\u0111eno
  \u010dlanom 10.2. Zakona br. 03/L-079, nijedna stranka nije izrazila pravni interes
  da u\u010destvuje u postupku povodom imovine koja je predmet imovinskog zahteva;
  prema tome, imovinski zahtev je ponovo tretiran kao nesporan.\\n8. Odlukom od dana
  29. februara 2012. godine, (KPCC/D/A/140/2012) Komisija za imovinske zahtev Kosova
  (KIZK) je ustanovila da je podnosilac zahteva dokazao da je njegov pokojni otac,
  Veljko \u0110or\u0111evi\u0107, bio su-vlasnik \u00bc idealnog dela imovine u zahtevu,
  te prema tome podnosilac zahteva ima pravo na ponovni posed imovine koja je predmet
  imovinskog zahteva.\\n9. Dana 25. maja 2012. godine, odluka KIZK je uru\u010dena
  podnosiocu zahteva.\\n10. Dana 20. maja 2013. godine, I  H  (u daljem tekstu: \u017ealilac),
  ulo\u017eio je \u017ealbu pred KAI gde je izjavio da je njegov otac, A  H , u 1979.
  godini, kupio imovinu u zahtevu, parcelu br. 760, koja se nalazi u Talinoc i Muhaxher\u00ebve
  od njegovog kom\u0161ije, V  \u0110 .\\n\\nNavodi \u017ealioca:\\n\\n11. \u017dalilac
  obja\u0161njava da je njegov pokojni otac kupio parcelu br. 760 od V  \u0110  za
  iznos od 6 0000 Nema\u010dkih maraka, te je u potpunosti isplatio cenu i da je primio
  u posed i kori\u0161\u0107enje parcelu jo\u0161 od 1979. godine. Prenos imovine
  od prodavca na kupca se nije mogao obaviti po\u0161to je prodavac po\u010detno trebao
  da re\u0161i problem sa njegovom bra\u0107om koji su upisani kao su-vlasnici, te
  kasnije od 1981. godine prenos imovine je bio zakonom zabranjen od strane Srpskog
  re\u017eima.\\n\\n12. \u017dalilac tvrdi da je nakon 2000. godine kontaktirao naslednike
  V  \u0110  (V  i M ) koji su bili obave\u0161teni povodom kupoprodaje te su isti
  pripremili kupoprodajni ugovor koji su sami potpisali i poslali \u017ealioci. Eventualno,
  on je izjavio da je odluka KIZK neta\u010dna jer je doneta na osnovu nedostatka
  dokumentacije te isti zahteva od Vrhovnog suda Kosova da razmotri njegovu izjavu
  i pravedno je tretira.\\n\\n13. U prilogu \u017ealbi, on je dostavio slede\u0107a
  dokumenat:\\n\\n- Kupoprodajni ugovor od dana 13. juna 1984. godine, izme\u0111u
  Veljka \u0110or\u0111evi\u0107a, kao prodavca i S  i I H  kao kupce parcele br.
  760, njive u povr\u0161ini od 20 ari i 63 m 2 , na osnovu posednovnog lista br.
  165. Mom\u010dilo i Vujadin \u0110or\u0111evi\u0107 su potpisali ugovor kao prodavci
  dok su S  i I  H  potpisali isti kao kupci. Ugovor nije legalizovan.\\n- Posedovni
  list br. 165, izdat dana 27. februara 2007. godine, od strane Katastarske agencije
  Kosova, Odeljenje za katastar, geodeziju i nepokretnu imovine Op\u0161tine Uro\u0161evac.
  Imovina u zahtevu je upisana na ime V  \u0110 , kao su-vlasnika \u00bc idealnog
  dela.\\n14. M  \u0110 , tu\u017eenik, nije prihvatio da primi \u017ealbu; me\u0111utim,
  dostavio je izjavu od dana 02. septembra 2013. godine.\\n15. U svojoj pismenoj izjavi,
  tu\u017eenik izjavljuje slede\u0107e:\\n\\n\\\"Ovim izjavljujem da je parcela br.
  760 u povr\u0161ini od 20 ari i 63 m\\n\\n2\\n\\n, koja se nalazi u katastarskoj
  zoni Talinoc i\\n\\nMuhaxher\u00ebve,\\n\\nUro\u0161evac\\n\\n, upisana u Posedovnom
  kistu br. 165, prodata jo\u0161 dok je moj pokojni otac, V  \u0110 jo\u0161 uvek
  bio \u017eiv te kupac koji je u posedu parcele mo\u017ee preneti istu na svoje ime.\\\"\\n\\nPravni
  savet:\\n\\nPrihvatljivost:\\n\\n16. \u017dalba je nedozvoljena kao \u017ealilac
  nije u\u010destvovao u postupku pred KIZK, osim u slu\u010daju kada je \u017ealilac
  zainteresovana strana koji nije primio (valjano) obave\u0161tenje povodom imovinskog
  zahteva ili druga\u010dije nije bio obave\u0161ten ili opravdano nije bio obave\u0161ten
  povodom imovinskog zahtev pre ulaganja \u017ealbe (\u010dlan 12.1 Zakona br. 03/L-079
  i tako\u0111e vidi presudu GSK-KPA-A-095/12).\\n17. Nema indikacija da je \u017ealilac
  bio obave\u0161ten povodom postupka pred KAI tokom postupka obave\u0161tenja ili
  do maja meseca 2013. godine. Prema tome, \u017ealba je prihvatljiva. Tako\u0111e
  nema sumnje da je \u017ealilac zainteresovana strana.\\n\\n4\\n\\nZasnovanost:\\n\\n18.
  Tu\u017eenik je u svom odgovoru izjavio slede\u0107e:\\n\\\" Ovim izjavljujem da
  je parcela br. 760 u povr\u0161ini od 20 ari i 63 m2, koja se nalazi u katastarskoj
  zoni Talinoc i Muhaxher\u00ebve, Uro\u0161evac, upisana u Posedovnom kistu br. 165,
  prodata jo\u0161 dok je moj pokojni otac, V  \u0110 jo\u0161 uvek bio \u017eiv te
  kupac koji je u posedu parcele mo\u017ee preneti istu na svoje ime..\\\"\\n19. Ova
  izjava se treba tuma\u010diti kao povla\u010denje imovinskog zahteva (\u010dlan
  149. Zakona o parni\u010dnom postupku) koji ne samo da je u primeni pred KIZK ve\u0107
  tako\u0111e u postupcima pred \u017dalbenim ve\u0107em KAI (\u010dlan 193. Zakona
  o parni\u010dnom postupku).\\n20. Nakon povla\u010denja imovinskog zahteva, bez
  daljeg postupka, Sud \u0107e doneti presudu na osnovu koje odbija imovinski zahtev
  podnosioca zahteva. Ovo, me\u0111utim, ima preduslov koji je op\u0161te pravilo
  da imovinski zahtev treba da bude u okviru nadle\u017enosti suda. \u0160to vi\u0161e,
  ovaj predmet ne spada u okviru nadle\u017enosti KIZK/\u017dalbenog ve\u0107a KAI.\\n21.
  U smislu \u010dlana 3.1. Zakona br. 03/L-079, podnosilac zahteva ima pravo na nalog
  Komisije za ponovni posed imovine, ako podnosilac zahteva ne samo doka\u017ee svojinsko
  pravo ve\u0107 tako\u0111e doka\u017ee da ona ili on trenutno nije u stanju da u\u017eiva
  ovo svojinsko pravo usled okolnosti koje su direktno povezane ili rezultiraju iz
  oru\u017eanog sukoba koji se dogodio na Kosovu izme\u0111u 27. februara 1998. godine
  i 20. juna 1999. godine.\\n22. Me\u0111utim, u ovom predmetu, tu\u017eenik je prihvatio
  da je njegova parcela \\\"prodata ili data tre\u0107oj strani\\\" u 1984. godini.
  Prema tome, gubitak svojinskog prava nije povezan sa oru\u017eanim sukobom koji
  se dogodio na Kosovu izme\u0111u 27. februara 1998. i 20. juna 1999. godine. Prema
  tome, imovinski zahtev ne spada u okviru nadle\u017enosti KIZK.\\n23. U smislu gore
  navedenog i na osnovu \u010dlana 12.2. (c) Zakona br. 03/L-079 i \u010dlana 198.1.
  Zakona o parni\u010dnom postupku (Zakon br. 03/L-006), odlu\u010deno je da se poni\u0161ti
  odluka KIZK i odbaci imovinski zahtev.\\n\\nPravni savet:\\n\\n24. U smislu \u010dlana
  13.6 Zakona br. 03/L-079, ova presuda je pravosna\u017ena i primenljiva te se ne
  mo\u017ee napasti putem redovnih ili vanrednih pravnih lekova.\\n\\nSylejman Nuredini,
  EULEX predsedavaju\u0107i sudija\\n\\nWillem Brouwer, EULEX sudija\\n\\nRolandus
  Bruin, EULEX sudija\"", "\"Na osnovu \u010dlana 92. stav 2., a u vezi sa \u010dlanom
  104. stav 3. Zakona o socijalnoj i dje\u010djoj za\u0161titi (\u201eSl. list Crne
  Gore\\\", broj: 27/13, 1/15, 42/15, 56/16, 66/16, 1/17, 31/17, 42/17 i 50/17), \u010dlana\\n\\n44.
  stav 1. ta\u010dka 49. Statuta Op\u0161tine Budva (\u201eSl. list Crne Gore-Op\u0161tinski
  propisi\\\", broj: 2/19)\\n\\ni \u010dlana 9. stav 1. alineja 4. Odluke o osnivanju
  Javne ustanove Dnevni centar za djecu i omladinu sa smetnjama i te\u0161ko\u0107ama
  u razvoju \u201eBiseri\u201c Budva (\u201cSl. list Crne Gore-Op\u0161tinski\\n\\npropisi\\\",
  broj: 5/14, 54/17, 50/19 i 5/20), Skup\u0161tina Op\u0161tine Budva na sjednici
