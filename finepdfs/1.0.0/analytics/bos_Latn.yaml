  SEKTOR\\n\\n05\\n\\nUspostavljanje dugoro\u010dne stabilnosti javnih finansija je
  osnovni preduslov ukupne ekonomske stabilnosti i dugoro\u010dnog ekonomskog rasta.
  U tom smislu, nastavljaju se aktivnosti na smanjenju nivoa sive ekonomije, pove\u0107anju
  discipline poreskih obveznika i smanjenju poreskog duga.\\n\\nTako\u0111e, primarni
  cilj fiskalne politike je i smanjenje deficit-a javnih finansija. Smanjenje deficit-a
  je mogu\u0107e posti\u0107i kroz racionalizaciju potro\u0161nje uz pove\u0107anje
  prihoda bud\u017eeta. U narednom periodu \u0107e se nastaviti sa implementacijom
  mjera fiskalne politike i fiskalnih pravila koja su utvr\u0111ena Zakonom o bud\u017eetu
  i fiskalnoj odgovornosti. Vlada Crne Gore je u aprilu 2015. godine usvojila Smjernice
  makroekonomske i fiskalne politike za period od 2015-2018. godine koje su osnov
  za izradu godi\u0161njeg Zakona o bud\u017eetu. Fiskalni okvir za srednji rok proizlazi
  iz makroekonomskog scenarija rasta i reforme poreskog sistema kako bi se dostigao
  potencijalni rast, \u0161to doprinosi efikasnijoj valorizaciji doma\u0107ih resursa,
  ja\u010danju konkurentnosti ekonomije, dostizanju vi\u0161ih stopa privrednog rasta
  i pove\u0107anju \u017eivotnog standarda stanovni\u0161tva.\\n\\n**Boks 5.1 \u2013
  Implementacija ESA 2010 metodologije u statistici javnih finansija**\\n\\nU 2015.
  godini donesena je \u201eStrategija implementacije ESA 2010 metodologije u statistici
  javnih finansija\u201d koja je preduslov za uvo\u0111enje i implementaciju ESA 2010
  metodologije u sistem javnih finansija u Crnoj Gori.\\n\\nEvropski sistem nacionalnih
  ra\u010duna (European System of Account), ESA, je me\u0111unarodno uporediva statisti\u010dka
  metodologija koja se koristi za sistematsko, detaljno i sveobuhvatno prikazivanje
  i mjerjenje ekonomije, njenih komponenti i njihovih me\u0111uzavisnosti. ESA 2010
  metodologiju, definisanu regulativama i uputstvima Eurostata, koriste \u010dlanice
  Evropske unije od septembra 2014. godine.\\n\\nUsvajanje Evropskog sistema ra\u010duna
  \u201eESA 2010\u201d jedan je od zahtjeva EU, kako bi se postigla uporedivost rezultata
  dr\u017eava \u010dlanica EU, odnosno definisala metodologija zajedni\u010dkih standarda,
  definicija, klasifikacija i ra\u010dunovodstvenih pravila.\\n\\nStrategijom je definisano
  postoje\u0107e stanje, plan prelaska na sistem ESA 2010, ciljevi koji se \u017eele
  posti\u0107i reformom ra\u010dunovodstva i izvje\u0161tavanja, kao i predlog mjera
  i aktivnosti na polju implementacije ESA 2010.\\n\\nTako\u0111e, Ministarstvo finansija
  je u 2015. godini donijelo Strategiju za prelazak javnog sektora na obra\u010dunsko
  ra\u010dunovodstvo koja defini\u0161e osnovne korake prelaska ra\u010dunovodstva
  javnog sektora na obra\u010dunsko ra\u010dunovodstvo, a sve u cilju efektivnijeg
  upravljanja javnim sektorom.\\n\\n5.1. Javne finansije Crne Gore\\n\\nPrema procjeni
  Ministarstva finansija, u prvom polugodi\u0161tu 2015. godine javni prihodi iznosili
  su 684,5 miliona eura, odnosno 18,9% procijenjenog BDP-a za 2015. godinu. U poredenju
  sa istim periodom 2014. godine, javni prihodi su vi\u0161i za 2,9%, \u0161to predstavlja
  nominalni rast od 19,3 miliona eura, \u010demu je doprinijelo pove\u0107anje prihoda
  od doprinosa za 7 miliona eura, prihoda od poreza za 6,8 miliona eura i primitaka
  od otplate kredita i sredstava prenijetih iz prethodne godine za 6,1 milion eura.\\n\\nU
  strukturi javnih prihoda dominantni su prihodi od poreza (60,4%), kao i prihodi
  od doprinosa (27,4%), dok se na sve ostale prihode odnosi 12,2% javnih prihoda.\\n\\nJavna
  potro\u0161nja u prvom polugodi\u0161tu 2015. godine iznosila je 899,4 miliona eura,
  odnosno 24,8% procijenjenog BDP-a. U poredenju sa istim periodom 2014. godine javna
  potro\u0161nja je ostvarena na vi\u0161em nivou za 26,7%, kao posljedica po\u010detka
  izgradnje autoputa Bar\u2013Boljare. Rashodi su pove\u0107ani zbog zna\u010dajno
  ve\u0107ih kapitalnih izdataka (ve\u0107i su za 157 miliona eura), kao i zbog pove\u0107anja
  rashoda za transfere institucijama, pojedinicima, nevladinom i javnom sektoru.\\n\\nNedostaju\u0107a
  sredstva na kraju juna iznosila su 371,9 miliona eura. U prvom polugodi\u0161tu
  2015. godine dr\u017eava se zadu\u017eila u iznosu od 501,1 milion eura preko inostranih
  izvora financiranja, odnosno 37,7 miliona eura preko doma\u0107ih.\\n\\nGrafik 5.1\\n\\n|
  Konsolidovana javna potro\u0161nja, 000.000 eura |\\n|---------------------------------------------|\\n|
  ![Grafik](image)                             |\\n\\nIzvor: Ministarstvo finansija\\n\\nTeku\u0107a
  javna potro\u0161nja iznosila je 700,4 miliona eura ili 19,3% BDP-a i vi\u0161a
  je u odnosu na isti period 2014. godine za 4,8%.\\n\\nPosmatrano po ekonomskoj klasifikaciji,
  najve\u0107u stavku izdataka predstavljaju transferi za socijalnu za\u0161titu (243,3
  miliona eura, ili 6,7% BDP-a, dominantno zbog izdataka za penzije) i bruto zarade
  (202,6 miliona eura, ili 5,6% BDP-a), dok je kapitalni bud\u017eet iznosio 199 miliona
  eura, ili 5,5% BDP-a.\\n\\nNivo javnih prihoda na kraju prvog polugodi\u0161ta 2015.
  godine ni\u017ei je od ostvarene javne potro\u0161nje, tako da je deficit javnog
  sektora iznosio 214,9 miliona eura ili 5,9% procijenjenog BDP-a, dok je u istom
  periodu prethodne godine deficit javnog sektora iznosio 44,9 miliona eura. (Prilog
  D, tabela 12).\\n\\n---\\n\\n15 Strukturu javnih finansija Crne Gore \u010dini bud\u017eet
  Crne Gore sa dr\u017eavnim fondovima (Fond penzijskog i invalidskog osiguranja,
  Fond zdravstvenog osiguranja, Fond za obe\u0161te\u0107enje, Zavod za zaposljavanje,
  Fond rada i Investiciono-razvojni fond) i bud\u017eeti lokalne samouprave (Prijestonica
  Cetinje, Glavni grad Podgorica i 19 op\u0161tina).\\n\\n16 Ukupni javni prihodi
  obuhvataju prihode bud\u017eeta, dr\u017eavnih fondova i lokalne samouprave.\\n\\n17
  Izvor: Ministarstvo finansija; procijenjeni BDP za 2015. godinu iznosi 3,63 milijarde
  eura.\\n\\n18 Javna potro\u0161nja umanjena za ukupne kapitalne izdatke.\\n\\nBoks
  5.2 \u2013 Kvalitet javnih finansija i institucionalni okvir\\n\\nKvalitet javnih
  finansija karakteri\u0161e nastavak fiskalnog prilagodavanja i racionalizacije bud\u017eetske
  potro\u0161nje, kao i uskla\u0111ivanje javnih finansija sa regulativom i praksom
  u EU.\\n\\nReformom poreske politike, u 2015. godini, smanjena je vi\u0161a stopa
  poreza na dohodak fizi\u010dkih lica sa 15% na 13%, a pove\u0107ana je stopa doprinosa
  za zdravstveno osiguranje za 0,5 pp.\\n\\nU skladu sa Zakonom o izmjenama i dopunama
  Zakona o porezu na dohodak fizi\u010dkih lica uvedeno je oporezivanje prihoda od
  igara na sre\u0107u. Naime, propisano je da se za svaki pojedina\u010dno ispla\u0107eni
  prihod od dobitaka od igara na sre\u0107u pla\u0107a porez po stopi od 15%.\\n\\nTako\u0111e,
  u cilju obezbje\u0111ivanja odr\u017eivosti javnih finansija, uz ograni\u010davanje
  rasta javnog duga, u 2015. godini uvedena je namjenska taksa na maloprodajnu cijenu
  goriva u visini od 0,07 eura po litru. Sredstva su namijenjena za finansiranje dijela
  tro\u0161kova izgradnje autoputa i reprezentativni sport.\\n\\nU 2015. godini po\u010deo
  je da se primjenjuje porez na kafu, a izmjenama Zakona o akcizama ustanovljen je
  \u201cakcizni kalendar\u201d za period od pet godina, odnosno utvr\u0111ena je dinamika
  postepenog pove\u0107anja visine akcize na cigarete.\\n\\n5.2. Bud\u017eet Crne
  Gore\\n\\nPrema preliminarnim podacima Ministarstva finansija, ukupni primici bud\u017eeta
  sa dr\u017eavnim fondovima\u00b9\u2079 za \u0161est mjeseci 2015. godine iznosili
  su 1,13 milijardi eura ili 31,1% procijenjenog BDP-a. U strukturi bud\u017eetskih
  prihoda, 52,2% se odnosilo na izvorne prihode, 44,3% na pozajmice i kredite iz inostranih
  izvora, a 3,5% na prihode od prodaje imovine i pozajmice i kredite iz doma\u0107ih
  izvora (tabela br. 5.1).\\n\\nIzvorni prihodi bud\u017eeta iznosili su 587,9 miliona
  eura ili 16,2% procijenjenog BDP-a. U odnosu na plan, ovi prihodi vi\u0161i su za
  1,5%, kao rezultat vi\u0161eg ostvarenja prihoda od doprinosa, naknada i primitaka
  od otplate kredita i sredstava prenijetih iz prethodne godine. U odnosu na isti
  period 2014. godine, izvorni prihodi vi\u0161i su za 2,3%.\\n\\nGrafik 5.2\\n\\nIzvorni
  prihodi, 000.000 eura\\n\\n| Izvor: Ministarstvo finansija |\\n|-------------------------------|\\n|
  Primici uklju\u010duju izvorne prihode (direktne i indirektne poreze i neporeske
  prihode), pozajmice i kredite iz doma\u0107ih i inostranih izvora i prihode od prodaje
  imovine. |\\n\\nU strukturi izvornih prihoda najve\u0107e u\u010de\u0161\u0107e
  ostvarili su prihodi od poreza (62,3%), zatim doprinosi (32%), dok se preostalih
  5,7% odnosilo na prihode od taksi, naknada, ostalih prihoda, primitaka od otplate
  odobrenih kredita i donacija.\\n\\nNaplata poreskih prihoda (porezi i doprinosi)
  ostvarena je u iznosu od 554 miliona eura, od \u010dega se na direktn\u0435 poreze
  odnosi 260,7 miliona eura, a na indirektn\u0435 poreze 293,3 miliona eura.\\n\\nPrihodi
  po osnovu poreza iznosili su 366,1 milion eura i ostvarili su pad od 1,4% u odnosu
  na plan, a u odnosu na isti period 2014. godine bili su vi\u0161i za 1,5%.\\n\\nNominalno,
  najve\u0107i pad prihoda u odnosu na prethodnu godinu ostvaren je kod poreza na
  dohodak fizi\u010dkih lica od 4,2 miliona eura ili 9,4%, zbog smanjenja stope kriznog
  poreza na zarade sa 15% na 13%. Tako\u0111e, smanjeni su i prihodi od poreza na
  promet nepokretnosti, 11,9% i od naplate taksi za 2,2 miliona eura, kao posljedica
  ukidanja taksi na SIM kartice, kablovsku TV i elektri\u010dna brojila. Pad prihoda
  ostvaren je kod ostalih prihoda i donacija, dok svi ostali porezi bilje\u017ee pozitivno
