  Izve\u0161taja nezavisnog revizora i izradi radnih papira, 2-4 radna dana i\\n*
  kona\u010dna verzija Izve\u0161taja nezavisnog revizora, 1 radni dan nakon usvajanja
  finalne verzije.\\n\\n4. NAKNADA\\n\\nNaknadu za obavljanje revizije finansijskih
