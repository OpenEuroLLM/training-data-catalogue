  m\u00b3\\n\\n\u0160esti Festival investicija i nekretnina - FREI 2015 odr\u017ean
  je u Budvi, od 11. do 14. Maja 2015. godine. FREI je manifestacija usmjerena na
  razvoj investicija u nekretnine, sa fokusom na turisti\u010dki sektor i namijenjena
  je investitorima i komercijalnim kompanijama u sektoru nekretnina, reprezentima
  dr-\\n\\n---\\n\\n6 Iskazano ponderisanim indeksom, a neponderisanim je proizvodnja
  vi\u0161a za 30,4% za isti period.\\n\\n7 U trenutku pisanja ovog Izvje\u0161taja
  nisu bili raspolo\u017eivi podaci za vrijednost novih ugovora na zgradama i ostalim
  gra\u0111evinama.\\n\\nGrafik 1.8\\n\\nGra\u0111evinske aktivnosti\\n\\nIzvor: Monstat\\n\\n\u017eavne
  i javne uprave, predstavnicima medunarodnih institucija, kao i stru\u010dnoj javnosti.
  Na festivalu su predstavljeni neki od klju\u010dnih investicionih projekata u Crnoj
  Gori.\\n\\n1.2.5. Saobra\u0107aj\\n\\nPrema podacima Monstata, u prvih \u0161est
  mjeseci 2015. godine, u drumskom saobra\u0107aju prevezeno je 3,1% vi\u0161e putnika
  nego u istom periodu prethodne godine, dok je prevoz putnika mjeren putni\u010dkim
  kilometrima ve\u0107i za 3,9%. Prevoz robe, u posmatranom periodu bio je ve\u0107i
  za 14,7%, dok je prevoz robe mjeren tonskim kilometrima manji za 2,7%.\\n\\nU maju
  2015. godine otpo\u010deli su radovi na autoputu koji predstavlja najva\u017eniji
  infrastrukturni projekat u Crnoj Gori. Izgradnja prioritetne dijone Smokovac\u2013Uvac\u2013Mate\u0161evo,
  du\u017eine 41 km, bi trebala da traje \u010detiri godine. Osim \u0161to \u0107e
  zna\u010dajno doprinijeti pobo\u0161anju saobra\u0107ajne mre\u017ee, ovaj projekat
  \u0107e uticati i na cijelokupni ekonomski razvoj zemlje.\\n\\nU junu je potpisan
  Protokol o obavljanju me\u0111unarodnog drumskog saobra\u0107aja izme\u0111u Crne
  Gore i Republike Letonije u oblasti me\u0111unarodnog drumskog prevoza putnika i
  tereta. Protokolom je dogovoreno da se u cilju smanjenja administrativnih barijera
  dosada\u0161nje izdavanje bilateralnih i dozvola za tre\u0107e zemlje, zamijeni
  izdavanjem univerzalnih dozvola, koje pokrivaju obije vrste me\u0111unarodnog prevoza.\\n\\nGrafik
  1.9\\n\\nPrevoz putnika u drumskom saobra\u0107aju (u hiljadama)\\n\\nIzvor: Monstat\\n\\nPrevoz
  putnika u \u017eeljezni\u010dkom saobra\u0107aju, u posmatranom periodu, bio je
  ve\u0107i za 7,7%, a prevoz robe za 20,9%.\\n\\nTokom prvog polugodi\u0161ta, u
  vazdu\u0161nom saobra\u0107aju prevezeno je 574.658 putnika, \u0161to je za 1% manje
  nego u istom periodu prethodne godine, dok je prevoz robe pove\u0107an za 9,3%.\\n\\nUkupan
  promet u lukama iznosio je 761.899 tona, i bio je ve\u0107i za 38,1% u pore\u0111enju
  sa istim periodom prethodne godine, pri \u010demu se na izvoz odnosilo 58%, a na
  uvoz 41,9%. Izvoz je u ovom periodu pove\u0107an za 99%, a uvoz smanjen za 2,9%.\\n\\n###
  Grafik 1.10\\n\\n**Prevoz putnika u vazdu\u0161nom saobra\u0107aju**\\n\\n|   |
