  na kraju prvog polugoda, najve\u0107e u\u010de\u0161\u0107e bilje\u017ee obaveze
  po osnovu prodatih dr\u017eavnih zapisa \u2013 26,2% i obaveze po osnovu restitucije
  \u2013 25,2%.\\n\\n### 6.2. Spoljni dug\\n\\nSpoljni dug je i tokom prvog polugoda
  2015. godine bilje\u017eio zna\u010dajan rast. Na kraju juna 2015. godine, spoljni
  dug iznosio je 2.160,2 miliona eura ili 60,3% procijenjenog BDP-a. U odnosu na kraj
  prethodne godine, spoljni dug je zabilje\u017eio rast od 38,3% (598,5 miliona eura).
  U odnosu na kraj juna 2014. godine, spoljni dug je ve\u0107i za 36,4%.\\n\\nRast
  spoljnog duga u toku prvih \u0161est mjeseci 2015. godine, u odnosu na kraj prethodne
  godine, rezultat je:\\n\\n- Emisije euroobveznica u iznosu od 500 miliona eura,\\n-
  Povla\u010denje sredstava kineske EXIM banke u izmosu od 169,6 miliona eura\\\\(^{23}\\\\)
  za potrebe finansiranja izgradnje dijela autoputa \u201eBar \u2013 Boljari\u201c,\\n\\n---\\n\\n\\\\(^{23}\\\\)
  Povu\u010dene su dvije tran\u0161e kredita od po 84,8 miliona eura.\\n\\n\u2022
  Povla\u010denja sredstava KfW-a u iznosu od 6,1 milion eura (III, IV i V faza, i
  za potrebe energetske efikasnosti),\\n\u2022 Povla\u010denja sredstava od IBRD-a
