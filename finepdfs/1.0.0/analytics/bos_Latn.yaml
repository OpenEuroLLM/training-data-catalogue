  svakih pet godina.\\n\\n(1) Ukoliko se vozilo koristi uglavnom za gradsku vo\u017enju
  ili je godi\u0161nja kilometra\u017ea manja od 10.000 km, neophodno je zameniti
  motorno ulje i filter motornog ulja svakih 12 meseci.\\n\\n(2) Stvarni intervali
  za zamenu ulja i filtra motornog ulja zavise od uslova kori\u0161\u0107enja vozila,
  a na njih upozorava lampica upozorenja ili poruka na instrument plo\u010di, ili
  u svakom slu\u010daju to je svakih 12 meseci.\\n\\nPERIODI\u010cNE KONTROLE\\n\\nProverite
  na svakih 1.000 km ili pre polaska na duga putovanja i ukoliko je potrebno, dovedite
  u normalno stanje slede\u0107e:\\n\\n- nivo sredstava za hla\u0111enje motora, ko\u010dione
  te\u010dnosti i te\u010dnosti pera\u010da vetrobranskog stakla;\\n- pritisak naduvavanja
  i stanje pneumatika;\\n- rad svetlosnih ure\u0111aja (farova, pokaziva\u010da pravca,
  svetla za upozoravanje na opasnost itd.);\\n- rad sistema pera\u010da / brisa\u010da
  vetrobranskog stakla i polo\u017eaj / istro\u0161enost metlica brisa\u010da vetrobranskog
  / zadnjeg stakla.\\n\\nNa svakih 3.000 km proverite i dolivajte, ukoliko je potrebno,
  nivo motornog ulja.\\n\\nTE\u0160KI USLOVI KORI\u0160\u0106ENJA VOZILA\\n\\nUkoliko
  se vozilo uglavnom koristi pod jednim od slede\u0107ih uslova:\\n\\n- za vu\u010du
  prikolice ili kamp ku\u0107ice;\\n- po pra\u0161njavim putevima;\\n- za kratke,
  ponovljene vo\u017enje (kra\u0107e od 7 \u2013 8 km) po spolja\u0161njim temperaturama
  ispod nule;\\n- motor je \u010desto u praznom hodu ili se voze duga ras- tojanja
  sa malim brzinama ili dugi periodi praznog hoda;\\n\\ntreba \u010de\u0161\u0107e
  uraditi slede\u0107e kontrole nego \u0161to je to predvi\u0111eno u dinamici Planiranog
  servisiranja:\\n\\n- proveriti stanje i istro\u0161enost disk plo\u010dica prednjih
  ko\u010dnica;\\n- proveriti \u010disto\u0107u brava haube i prtlja\u017enika, \u010disto\u0107u
  i podmazanost spojeva;\\n- vizuelnu kontrolu stanja: motora, menja\u010da, transmisije,
  cevi i creva (izduvnog sistema \u2013 sistema za gorivo \u2013 ko\u010dnica) i gumenih
  delova (za\u0161titnih navlaka, spojnica, \u010daura itd.);\\n- proveriti punjenje
  akumulatora i nivoa te\u010dnosti akumulatora (elektrolita);\\n- vizuelno pregledati
  stanje pomo\u0107nih pogonskih kai\u0161eva;\\n- proveriti i, ukoliko je potrebno,
  zameniti motorno ulje i filter za ulje;\\n\\nproveriti i, ukoliko je potrebno, zameniti
  filter za polen;\\n\\nproveriti i, ukoliko je potrebno, zameniti pre\u010dista\u010d
  vazduha.\\n\\n**UPOZORENJE**\\n\\nNemojte nikada pu\u0161iti dok radite u prostoru
  za motor: mogu\u0107e je da u njemu ima gasa i zapaljivih isparenja, \u0161to predstavlja
  rizik od po\u017eara.\\n\\n**UPOZORENJE**\\n\\nPazite kada radite u prostoru za
  motor kada je motor vru\u0107: mo\u017eete se ope\u0107i. Zapamtite da ventilator
  mo\u017ee da po\u010dne da radi ukoliko je motor vru\u0107: ovo bi moglo da vas
  povredi. Pokretni delovi mogu da povuku \u0161aleve, kravate i druge lepr\u0161ave
  delove garderobe.\\n\\nKada dolivate te\u010dnosti, pazite da ne pome\u0161tate
  razne vrste te\u010dnosti: one nisu me\u0111usobno kompatibilne i mogu da ozbiljno
  o\u0161tete vozilo.\\n\\nVerzije 0.9 TwinAir Turbo 105 KS\\n\\nslika 199\\n\\nA.
  \u010cep/ nalivno grlo motornog ulja\\nB. \u0160ipka za merenje nivoa motornog ulja\\nC.
  Sredstvo za hla\u0111enje motora\\nD. Te\u010dnost pera\u010da vetrobranskog / zadnjeg
