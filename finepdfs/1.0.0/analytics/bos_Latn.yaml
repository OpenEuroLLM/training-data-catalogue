  to PK Zmaj-Alpamm - Tuzla\\n\\n07.05.2011 11:34 - Strana 1\"", "\"PONUDA\\n\\nZA
  OBAVLJANJE REVIZIJE FINANSIJSKIH IZVE\u0160TAJA \\\"BA\u010cKA\\\" AD, SIVAC\\n\\nZA  2021.
  GODINU\\n\\nSADR\u017dAJ\\n\\n1. REVIZOR\\n\\nRevizorska firma \\\"Lege Artis Audit\\\"
  d.o.o., Beograd je osnovana 20. maja 2016. godine i registrovana je kod Agencije
  za privredne registre Republike Srbije pod brojem BD 40795/2016. Dru\u0161tvo obavlja
  poslove iz oblasti revizije izve\u0161taja u skladu sa Me\u0111unarodnim standardima
  revizije, Zakonom o ra\u010dunovodstvu, Zakonom o reviziji i Kodeksom etik za profesionalne
  ra\u010dunovo\u0111e.\\n\\nPored revizorskih poslova dru\u0161tvo pru\u017ea i usluge
  iz ra\u010dunovodstva, poreskog i finansijskog konsaltinga kao i sve druge konsultantske
  usluge vezane za unapre\u0111enje poslovanja i dono\u0161enje pravovremenih odluka
  menad\u017ementa. \\\"Lege Artis Audit\\\" d.o.o., Beograd garantuje najvi\u0161i
  kvalitet za svaki anga\u017eman jer poseduje idealan spoj znanja i iskustva iz oblasti
  revizije, finansija, ra\u010dunovodstva i poreskog konsaltinga. Uspe\u0161no i blagovremeno
  obavljanje sve poverene poslove od strane na\u0161ih klijenata uz  po\u0161tovanje
  me\u0111unarodnog i doma\u0107eg ra\u010dunovodstva i finansija, poreskih zakona,
  kao i pa\u017eljivo planiranje i uskla\u0111enost razli\u010ditih zahteva klijenata,
  uz visok stepen profesionalne diskrecije. Klijenti u nama vide pouzdanog partnera
  koji je uvek spreman da pru\u017ei profesionalne savete i mi\u0161ljenja u cilju
  ostvarivanja \u0161to bolje poslovne strategije.\\n\\nNa\u0161i klijenti su renomirane
  svetske i doma\u0107e kompanije kojima pru\u017eamo \u0161irok spektar prvoklasnih
  usluga na jednom mestu, \u0161tede\u0107i im vreme, novac i energiju.\\n\\n2. NA\u0160
  TIM\\n\\nIvan Ili\u0107\\n\\nLicencirani ovla\u0161\u0107eni revizor\\n\\nOsniva\u010d
  i direktor u Lege Artis Audit doo, Beograd firme za pru\u017eanje revizorskokonsultantskih
  usluga. Prethodno iskustvo sticao na poziciji  revizora u Dru\u0161tvima PKF d.o.o.,
  Beograd. Diplomirao na Ekonomskom fakultetu u Beogradu, a licencu ovla\u0161\u0107enog
  revizora stekao kod Komore ovla\u0161\u0107enih revizora, Beograd 2015. godine.\\n\\niskustvo
  je stekao obavljanjem revizije finansijskih izve\u0161taja u skladu sa Me\u0111unarodnim
  standardima revizije i u skladu sa Me\u0111unarodnim ra\u010dunovodstvenim standardima
  kod pravnih lica iz razli\u010ditih delatnosti (trgovina, gra\u0111evinarstvo, proizvodnja,
  rudarstvo, saobra\u0107aj i dr.) kao i revizije javnih preduze\u0107a i korisnika
  bud\u017eetskih sredstava. Tako\u0111e, obavlja usluge poreskog i finansijskog konsaltinga,
  aktivno je participirao u mno\u0161tvu projekata restrukturiranja, izrade due diligence
  izve\u0161taja, reviziji utro\u0161aka sredstava iz doma\u0111ih i me\u0111unarodnih
