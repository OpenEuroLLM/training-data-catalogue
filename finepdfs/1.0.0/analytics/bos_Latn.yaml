  2.1.6. Strana aktiva i pasiva banaka\\n\\nStrana aktiva banaka je tokom prve polovine
  2015. godine bilje\u017eila oscilacije u kretanju, da bi na kraju juna 2015. godine
  dostigla vrijednost od 625,2 miliona eura. U odnosu na kraj 2014. godine, strana
  aktiva je zabilje\u017eila rast od 12,3 miliona eura ili 2%, dok je u odnosu na
  isti period prethodne godine pove\u0107ana za 63,4 miliona eura ili 11,3%.\\n\\nPosmatrano
  u odnosu na kraj prethodne godine, rast strane aktive je najve\u0107im dijelom rezultat
  pove\u0107anja gotovine u ukupnom iznosu od 33,6 miliona eura ili 41,3%, zatim i
  kredita odobrenih nerezidentima u iznosu od 14,1 milion eura ili 22,7% i kategorije
  \u201eostalo\u201c (2,2 miliona eura ili 23,6%). Istovremeno, u strukturi strane
  aktive pad bilje\u017ee depoziti banaka kod nerezidenata, u ukupnom iznosu od 34,8
  miliona eura ili 9,4%, kao i hartije od vrijednosti nerezidenata koje su bile za
  2,9 miliona eura ili 3,2% ni\u017ee.\\n\\nNa godi\u0161njem nivou, sve stavke strane
  aktive bilje\u017ee rast, pri \u010demu je najve\u0107i rast zabilje\u017een kod
  hartija od vrijednosti, koje su bile za 26,5 miliona eura ili 45% ve\u0107e, zatim
  kod depozita u ino-bankama u iznosu od 14,9 miliona eura ili 4,6% i gotovine koja
  je bila za 14,8 miliona eura ili 14,8% ve\u0107a.\\n\\nNajzna\u010dajnija kategorija
  u strukturi strane aktive su depoziti banaka u inostranim bankama, koji su na kraju
  juna 2015. godine iznosili 337,1 milion eura i \u010dinili su 53,9% strane aktive.\\n\\nU
  kretanju strane pasive banaka tokom prvih \u0161est mjeseci tako\u0111e su prisutne
  oscilacije u kretanju uz evidentan rastu\u0107i trend. Na kraju posmatranog perioda
  strana pasiva je iznosila 713,2 miliona eura, i zabilje\u017eila je rast od 26,6
  miliona eura ili 3,9% u odnosu na kraj prethodne godine i rast od 1,6 miliona eura
  ili 0,2% na godi\u0161njem nivou.\\n\\nRast strane pasive u odnosu na kraj 2014.
  godine rezultat je rasta depozita nerezidenata, u iznosu od 48,6 miliona eura ili
  11,4%. Istovremeno, obaveze po osnovu hartija od vrijednosti nerezidenata su bile
  na istom nivou, dok su sve ostale stavke zabilje\u017eile pad. Tako su pozajmice
  banaka zabilje\u017eile pad od 18,5 miliona eura ili 7,8%. Sve ostale obaveze prema
  nerezidentima su bile za 3,5 miliona eura ili 46,7% ni\u017ee.\\n\\nNa godi\u0161njem
  nivou, zabilje\u017eeni rast strane pasive najve\u0107im dijelom je rezultat rasta
  depozita nerezidenata u iznosu od 87,1 milion eura ili 22,4%, i kategorije \u201eostalo\u201c
  koja je bila za 2,3 miliona eura ili 143,6% ve\u0107a. Negativnu tendenciju u kretanju
  imale su ino pozajmice banaka koje su zabilje\u017eile pad od 87,8 miliona eura
  ili 28,6% na godi\u0161njem nivou, dok obaveze po osnovu hartija od vrijednosti
  bilje\u017ee neznatan pad od 3.000 eura ili 0,02%.\\n\\nU strukturi strane pasive
  na kraju drugog kvartala teku\u0107e godine, dominantno u\u010de\u0161\u0107e od
  66,6% ostvarili su depoziti nerezidenata, dok se na pozajmice banaka odnosilo 30,7%,
  na hartije od vrijednosti 2,1%, a neznatan dio (0,6%) na ostale stavke strane pasive.\\n\\nDepoziti
  nerezidenata su tokom posmatranog perioda konstantno rasli. U strukturi ino depozita
  dominiraju depoziti fizi\u010dkih lica nerezidenata sa 79,7%, koji u posmatranom
  periodu bilje\u017ee konstantan rast. Drugi po zna\u010daju ino deponent su inostrane
  kompanije (18%), koje tako\u0111e bilje\u017ee rast deponovanih sredstava u doma\u0107im
  bankama. Svega 1,6% je deponovano od strane inostranih finansijskih institucija,
  dok se neznatan dio ino depozita odnosi na sve ostale ino izvore.\\n\\nVi\u0161egodi\u0161nji
  trend smanjenja ino pozajmica banaka je nastavljen i u prvoj polovini 2015. godine.
  Prosje\u010dno mjes\u0435\u0447\u043d\u043e, ino pozajmice banaka su u ovom periodu
  opadale po stopi od 1,3%, \u0161to predstavlja isti intenzitet razdu\u017eivanja
  kao u prvoj polovini prethodne godine. Konstantno razdu\u017eivanje banaka u inostranstvu
  rezultat je pove\u0107anja jeftinih doma\u0107ih depozita (pasivne kamatne stope
  su na izuzetno niskom nivou), zatim visoke likvidnosti bankarskog sistema kao i
  slabije kreditne aktivnosti u prethodnom periodu.\\n\\n2.1.7. Kapital banaka\\n\\nUkupan
  kapital banaka je na kraju juna 2015. godine iznosio 455,3 miliona eura, \u0161to
  je za 11,3 miliona eura ili 2,5% vi\u0161e nego na kraju 2014. godine, odnosno za
  27,2 miliona eura ili 6,4% vi\u0161e nego u istom periodu prethodne godine. Na rast
  kapitala u posmatranom periodu je uticala dokapitalizacija dvije banke u februaru
  i aprilu mjesecu u ukupnom iznosu od 4,8 miliona eura, zatim osnivanje nove banke
  u drugom kvartalu kao i ostvaren profit tokom posmatranog perioda.\\n\\nGrafik 2.28\\n\\nU\u010de\u0161\u0107e
  strane aktive, strane pasive i neto strane aktive banaka u bilansnoj sumi banaka,
  %\\n\\nTokom prvih \u0161est mjeseci 2015. godine strana aktiva je bila konstantno
  ni\u017ea od strane pasive, pa je na kraju posmatranog perioda strana aktiva iznosila
  -88 miliona eura. Kao rezultat zna\u010dajnijeg rasta strane pasive u odnosu na
  stranu aktivu banaka, razlika izme\u0111u strane aktive i pasive je pove\u0107ana
  na kraju posmatranog perioda u odnosu na kraj prethodne godine kada je iznosila
  -73,6 miliona eura. U odnosu na kraj drugog kvartala prethodne godine zna\u010dajno
  je ni\u017ea kada je razlika izme\u0111u ove dvije kategorije iznosila -149,8 miliona
  eura.\\n\\nOdnos strane pasive i ukupne bilansne sume banaka pokazuje da nerezidenti
  finansiraju 22% ukupne aktive banaka na kraju juna 2015. godine, dok se 19,3% bilansne
  sume banaka odnosilo na potra\u017eivanja banaka od nerezidenata. Jaz izme\u0111u
  strane aktive i strane pasive banaka iznosio je -2,7.\\n\\nGrafik 2.29\\n\\nFinansijski
  rezultat na agregatnom nivou, 000 eura\\n\\nGrafik 2.30\\n\\nUkupan kapital banaka
  (lijeva skala) u 000.000 eura i koeficijent solventnosti (desna skala), u %\\n\\nUkupan
  kapital banaka je na kraju juna 2015. godine iznosio 455,3 miliona eura, \u0161to
  je za 11,3 miliona eura ili 2,5% vi\u0161e nego na kraju 2014. godine, odnosno za
  27,2 miliona eura ili 6,4% vi\u0161e nego u istom periodu prethodne godine. Na rast
  kapitala u posmatranom periodu je uticala dokapitalizacija dvije banke u februaru
  i aprilu mjesecu u ukupnom iznosu od 4,8 miliona eura, zatim osnivanje nove banke
  u drugom kvartalu kao i ostvaren profit tokom posmatranog perioda.\\n\\nUkupan finansijski
  rezultat tokom prva dva kvartala 2015. godine je bio pozitivan i iznosio je 7,7
  miliona eura, \u0161to predstavlja zna\u010dajno smanjenje od 47,1% u odnosu na
  isti period prethodne godine. Devet banaka je prvu polovinu 2015. godine zavr\u0161ilo
  sa dobitkom, a \u010detiri sa gubitkom.\\n\\nKoeficijent solventnosti bankarskog
  sistema je u prvoj polovini 2015. godine bio iznad zakonom propisanog minimuma od
  10%. Na kraju perioda, koeficijent solventnosti je iznosio 15,83% i zabilje\u017eio
  je pad u odnosu na kraj prethodne godine, kada je iznosio 16,18%, odnosno bio je
  na istom nivou kao i na kraju drugog kvartala prethodne godine.\\n\\nU vlasni\u010dkoj
  strukturi kapitala banka na kraju drugog kvartala 2015. godine dominirao je inostrani
  kapital sa 81,4%, doma\u0107i privatni kapital je \u010dinio 16,1%, dok je dr\u017eava
  imala u\u010de\u0161\u0107e od svega 2,5% u kapitalu bankarskog sistema.\\n\\nPovra\u0107aj
  na prosje\u010dni kapital bankarskog sistema (ROE) na kraju posmatranog perioda
  je bio pozitivan, i iznosio je 3,42%. Vrijednost koeficijenta ROE zabilje\u017eio
  je pogor\u0161anje u odnosu na kraj prethodne godine kada je iznosio 5,35%, kao
  i u odnosu na drugi kvartal 2014. godine kada je iznosio 6,84%. Ovaj pokazatelj
  je bio pozitivan kod devet banaka, dok je kod \u010detiri banke ROE imao negativnu
  vrijednost.\\n\\n### 2.1.8. Obavezna rezerva banaka\\n\\nKao rezultat rasta depozita
  u bankama, u posmatranom periodu raste i izdvajanje banaka po osnovu obavezne rezerve.
  Na kraju posmatranog perioda, izdvojena obavezna rezerva je iznosila 220,3 miliona
  eura, i pove\u0107ana je za 5,3 miliona eura ili 2,5% u odnosu na kraj 2014. godine,
  dok je u odnosu na isti period prethodne godine izdvojeno za 22,4 miliona eura ili
  11,3% vi\u0161e sedstava po osnovu obavezne rezerve.\\n\\nEfektivna stopa obavezne
  rezerve, mjerena odnosom izdvojene obavezne rezerve i ukupnih depozita, iznosila
  je 9,17% na kraju drugog kvartala 2015. godine, i smanjena je u odnosu na kraj 2014.
  godine kada je iznosila 9,31%, kao i u odnosu na isti period prethodne godine kada
  je iznosila 9,22%. Odnos obavezne rezerve i depozita uve\u0107anih za pozajmice,
  na kraju juna 2015. godine...\\n\\niznosio je 8,29% i smanjen je u odnosu na kraj
  prethodne godine kada je iznosio 8,41%, dok je pove\u0107an u odnosu na isti period
  prethodne godine kada je iznosio 8,07%.\\n\\nStruktura izdvojene obavezne rezerve
  zna\u010dajno je izmijenjena u odnosu na strukturu iz prethodne godine. Na kraju
  juna 2015. godine, 51,6% je izdvojeno na ra\u010dun obavezne rezerve u zemlji, 28,2%
  je izdvojeno u vidu dr\u017eavnih zapisa, dok je 20,2% izdvojeno na ra\u010dun CBCG
  u inostranstvu.\\n\\nTokom prve polovine 2015. godine, nijedna banka nije koristila
  obaveznu rezervu za likvidnost, a sve banke su izdvajale obaveznu rezervu u propisanom
  iznosu.\\n\\n### 2.2. Kamatne stope banaka\\n\\n#### 2.2.1. Aktivne kamatne stope\\n\\n**Na
  ukupno odobrene kredite**\\n\\nIzrazito visok nivo aktivnih kamatnih stopa banaka
  i mikrokreditnih finansijskih institucija je rizik od potencijalnog sistemskog zna\u010daja
  za finansijsku stabilnost. U pravcu smanjenja visokog nivoa kamatnih stopa, Centralna
  banka aktivno djeluje jo\u0161 od novembra 2012. godine, kada je propisala pri-vremenu
  mjeru za limitiranje aktivnih kamatnih stopa. Nakon isteka propisanog roka, uslijed
  uo\u010denih pozitivnih pomaka u kretanju aktivnih kamatnih stopa, regulisanje nivoa
  kamatnih stopa prepu\u0161teno je tr\u017ei\u0161tu, dok je Centralna banka nastavila
  aktivno da prati njihovo kretanje.\\n\\nTokom 2014. godine statistika kretanja kamatnih
  stopa je ukazivala na rastu\u0107i trend, uslijed \u010dega je Centralna banka preporu\u010dila
  bankama da sni\u017ee nivo kamatnih stopa do isteka tre\u0107eg kvartala, \u0161to
  je u najve\u0107oj mjeri postignuto. Trend opadanja prosje\u010dnih ponderisanih
  nominalnih i efektivnih kamatnih stopa (PPNKS i PPEKS), zapo\u010det u posljednjem
  kvartalu prethodne godine, nastavljen je i u posmatranom periodu teku\u0107e godine
  (grafik br. 2.35).\\n\\nTako je u julu 2015. godine PPNKS na ukupno odobrene kredite
  iznosila 8,14% i ostvarila je pad od 0,27 procenatnih poena u odnosu na kraj prethodne
  godine i pad od 0,50 p.p. na godi\u0161njem nivou. PPEKS na ukupno odobrene kredite
  banaka je u julu iznosila 9,01% i bila ni\u017ea za 0,21 p.p. u odnosu na decembar
  2014. godine, a na godi\u0161njem nivou za 0,53 p.p.\\n\\nPosmatrano po ro\u010dnosti,
  primjetna je razlika u kretanju kod PPEKS na kratkoro\u010dne i dugoro\u010dne kredite.
  PPEKS na kratkoro\u010dne kredite su tokom prva dva kvartala 2015. godine bilje\u017eila
  zna\u010dajne oscilacije u kretanju, da bi u julu 2015. godine dostigla iznos od
  9,25%. Tako je ova stopa bila za 0,04 p.p. iznad nivoa zabilje\u017eenog na kraju
  2014. godine, odnosno za 0,21 p.p. ispod nivoa zabilje\u017eenog u julu prethodne
  godine. S druge strane, PPEKS na dugoro\u010dne kredite je konstantno opadao tokom
  posmatranog perioda, i u julu je iznosila 8,99%, \u0161to je u odnosu na decembar
  i jun prethodne godine ni\u017ee za 0,23 p.p. i 1,05 p.p. respektivno.\\n\\nPosmatrano
  po sektorima, gotovo svi sektori u posmatranom periodu bilje\u017ee pad PPEKS. Dva
  klju\u010dna korisnika kredita banaka, sektor privrede i stanovni\u0161tva bilje\u017ee
  pad PPEKS od 0,33 p.p. i\\n\\nGrafik 2.36\\n\\nPPEKS na kredite po ro\u010dnosti,
  godi\u0161nji nivo, %\\n\\nGrafik 2.37\\n\\nPPEKS na kredite po sektorima, godi\u0161nji
  nivo, %\\n\\n0,16 p.p. respektivno u odnosu na decembar prethodne godine, i pad
  od 0,87 p.p. i 0,36 p.p. respektivno na godi\u0161njem nivou. Tokom prve polovine
  2015. godine, najni\u017ee PPEKS bilje\u017ei Sektor Op\u0161te vlade i privrede,
  dok su se najvi\u0161e stope odnosile na ostale nefinansijske institucije i stanovni\u0161tvo.\\n\\n**Na
  novoodobrene kredite**\\n\\nPPNKS i PPEKS na novoodobrene kredite banaka su tokom
  prva dva kvartala bilje\u017eile oscilacije u kretanju, pri \u010demu su obje stope
  imale opadaju\u0107i trend. U julu 2015. godine PPNKS na novoodobrene kredite banaka
  je iznosila 7,54% i zabilje\u017eila je pad od 0,24 p.p. u odnosu na kraju 2014.
  godine, i pad od 1,30 p.p. na godi\u0161njem nivou. S druge strane, PPEKS na novoodobrene
  kredite banaka je iznosila 8,85% u julu i zabilje\u017eila je pad od 0,17 p.p. u
  odnosu na kraju 2014. godine, odnosno pad od 1,20 p.p. u odnosu na juli prethodne
  godine.\\n\\nPosmatrano po ro\u010dnosti, PPEKS na kratkoro\u010dne kredite je u
  julu 2015. godine iznosila 9,99% i bila za 0,24 p.p. ni\u017ea u odnosu na decembar
  2014. godine i 0,11 p.p. ve\u0107a u odnosu na isti mjesec prethodne godine. Istovremeno,
  kamatna stopa na dugoro\u010dne kredite je iznosila 8,36%, i zabilje\u017eila pad
  od 0,16 p.p. u odnosu na kraju 2014. godine i zna\u010dajan pad od 1,76 p.p. na
  godi\u0161njem nivou.\\n\\nPosmatrano po sektorima, oscilacije u kretanju su bilje\u017eile
  PPEKS na novoodobrene kredite privredi i stanovni\u0161tvu, uz evidentan opadaju\u0107i
  trend. Tako su su u drugom kvartalu 2015. godine oba sektora zabilje\u017eili najni\u017ee
  efektivne kamatne stope na novoodobrene kredite u periodu od 2012. godine. PPEKS
  na kredite odobrene fizi\u010dkim licima je u junu 2015. godine iznosila 10,64%
  i zabilje\u017eila je pad od 0,51 p.p. u odnosu na decembar 2014. godine, i pad
  od 1,30 p.p. u odnosu na isti mjesec prethodne godine. Istovremeno, PPEKS na kredite
  odobrene privredi je u posmatranom periodu bila na ni\u017eem nivou od stope po
  kojoj su banke odobravale kredite fizi\u010dkim licima. Ova stopa je u junu iznosila
  7,82% i zabilje\u017eila pad od 0,28 p.p. u odnosu na decembar prethodne godine,
  odnosno pad od 0,77 p.p. na godi\u0161njem nivou.\\n\\nTokom prve polovine teku\u0107e
  godine, zabilje\u017eene su najni\u017ee PPEKS na kredite za ve\u0107inu namjena
  za koje su odobreni novi krediti od 2012. godine.\\n\\n### 2.2.2. Pasivne kamatne
  stope\\n\\nProsje\u010dna ponderisana efektivna kamatna stopa na depozite nastavila
  je trend smanjenja i u drugom kvartalu 2015. godine. U junu, ova stopa je iznosila
  1,49% i bila je za 0,37 p.p. ni\u017ea u odnosu na kraj 2014. godine, a za 0,69
  p.p. u odnosu na jun prethodne godine.\\n\\nPosmatrano po ro\u010dnosti, u odnosu
  na decembar i jun prethodne godine, kamatne stope za sve ro\u010dnosti depozita
  su bile na ni\u017eim nivoima, pri \u010demu je najve\u0107i pad zabilje\u017eila
  stopa na depozite ro\u010dnosti od 1 do 3 godine, i to pad od 0,68 p.p u odnosu
  na decembar 2014. godine, i pad od 1,44 p.p. na godi\u0161njem nivou.\\n\\nPPEKS
  na depozite fizi\u010dkih lica je iznosila 1,89% u junu 2015. godine i u odnosu
  na kraj prethodne godine bilje\u017ei pad od 0,39 p.p., dok je u odnosu na isti
  mjesec 2014. godine ni\u017ea za 0,79 p.p. Tokom drugog kvartala 2015. godine, najvi\u0161e
  kamatne stope zabilje\u017eene su na depozite fizi\u010dkih lica ro\u010dnosti od
  3 do 5 godina. PPEKS na depozite pravnih lica iznosila je 0,96% i u odnosu na kraj
  prethodne godine bilje\u017ei pad od 0,31 p.p., dok je u odnosu na isti mjesec prethodne
  godine ni\u017ea za 0,53 p.p.\\n\\nI pored zabilje\u017eenog pada PPEKS na ukupne
  kredite, kao rezultat zna\u010dajnijeg pada PPEKS na depozite banaka, u posmatranom
  periodu kamatni spred i dalje ima rastu\u0107i trend. U junu 2015. godine, razlika
  izme\u0111u aktivnih i pasivnih kamatnih stopa (kamatni spred) na ukupne kredite
  i depozite banaka je iznosila 7,52 p.p., i pove\u0107ana je u odnosu na decembar
  i jun 2014. godine kada je iznosio 7,36 p.p.\\n\\n2.3. Mikrokreditne finansijske
  institucije\\n\\nBilansna suma mikrokreditnih finansijskih institucija (MFI) je
  na kraju drugog kvartala 2015. godine iznosila 44,7 miliona eura i pove\u0107ana
  je za 6,4 miliona eura ili 16,6% u odnosu na kraju 2014. godine, a u odnosu na isti
  period prethodne godine za 3 miliona eura ili 7,3%.\\n\\nUkupni krediti MFI su na
  kraju juna 2015. godine iznosili 45,2 miliona eura, \u0161to je za 5,9 miliona eura
  ili 15,1% vi\u0161e nego na kraju 2014. godine, odnosno za 5,8 miliona eura ili
  14,8% vi\u0161e na godi\u0161njem nivou. Sektorska alokacija pokazuje da se dominantan
  dio (92,6%) kredita MFI odnosio na sektor stanovni\u0161tva, dok se 4,1% odnosilo
  na nefinansijske institucije, a preostalih 3,3% na finansijske institucije.\\n\\nGrafik
  2.43\\n\\nKrediti MFI po sektorima, u 000 eura\\n\\n|  | Stanovni\u0161tvo | Ostalo
  |\\n|---|---|---|\\n| I | 40,000 | 40,000 |\\n| II | 40,000 | 40,000 |\\n| III |
  40,000 | 40,000 |\\n| IV | 40,000 | 40,000 |\\n| V | 40,000 | 40,000 |\\n| VI |
  40,000 | 40,000 |\\n| VII | 40,000 | 40,000 |\\n| VIII | 40,000 | 40,000 |\\n| IX
  | 40,000 | 40,000 |\\n| X | 40,000 | 40,000 |\\n| XI | 40,000 | 40,000 |\\n| XII
  | 40,000 | 40,000 |\\n| XIII | 40,000 | 40,000 |\\n| XIV | 40,000 | 40,000 |\\n|
  XV | 40,000 | 40,000 |\\n| XVI | 40,000 | 40,000 |\\n\\nTokom prve polovine 2015.
  godine MFI su odobrile ukupno 10,7 milion eura novih kredita. Kreditna aktivnost
  je tako u posmatranom periodu intenzivirana, zabilje\u017eiv\u0161i rast novoooborenih
  kredita od 3,4 miliona eura ili 19,9% u odnosu na isti period prethodne godine.
  Najve\u0107i dio novih plasmana MFI (98,5%) se odnosio na sektor stanovni\u0161tva,
  dok se preostali dio odnosio na sektor privrede.\\n\\nU strukturi ukupne pasive
  MFI dominantno u\u010de\u0161\u0107e od 50,4% bilje\u017ee pozajmice, dok se na
  ukupan kapital MFI odnosilo 45,9%, a na ostale obaveze 3,7% bilansne sume. Kapital
  MFI je na kraju drugog kvartala 2015. godine iznosio 20,5 miliona eura, \u0161to
  je za 699.000 ili 3,5% vi\u0161e nego na kraju 2014. godine, dok je na godi\u0161njem
  nivou zabilje\u017een pad od 4,3 miliona eura ili 17,5%. Od ukupnog iznosa kapitala,
  85,7% se odnosilo na kapital iz donacija, 10,5% na neraspore\u0111enu dobit, a 3,9%
  na dobit iz teku\u0107e godine.\\n\\nNa kraju drugog kvartala 2015. godine pozajmice
  MFI su iznosile 22,5 miliona eura i zabilje\u017eile su rast od 6 miliona eura ili
  36,2% u odnosu na kraju 2014. godine, dok je na godi\u0161njem nivou ostvaren rast
  od 7,4 miliona eura ili 49,4%. Mikrokreditne finansijske institucije su najve\u0107i
  dio pozajmica (82,7%) uzele od inostranih finansijskih institucija, dok se 17,2%
  odnosilo na pozajmice uzete od doma\u0107ih banaka.\\n\\nNa agregatnom nivou, MFI
  su za prvu polovinu 2015. godine ostvarile neto dobit u iznosu od 794.000 eura.\\n\\n2.3.1.
  Kamatne stope MFI\\n\\nNa ukupno odobrene kredite\\n\\nTokom prve polovine 2015.
  godine, prosje\u010dne ponderisane nominalne i efektivne kamatne stope (PPNKS i
  PPEKS) na ukupne kredite MFI konstantno su blago opadale, i time nastavile trend
  iz posljednjeg kvartala prethodne godine. Kao rezultat, PPNKS je iznosila 20,98%
  i bila ni\u017ea za u odnosu na kraj 2014. godine za 0,35 p.p., dok je u odnosu
  na isti mjesec prethodne godine ni\u017ea za 0,25 p.p. Istovremeno, PPEKS je u julu
  iznosila 24,96% i zabilje\u017eila pad u odnosu na kraj i isti mjesec prethodne
  godine za 0,70 p.p. odnosno 1,16 p.p.\\n\\nPPEKS na ukupne kratkoro\u010dne kredite
  je iznosila 26,02% u julu 2015. godine, dok je na dugoro\u010dne kredite iznosila
  24,86%. Obije stope zabilje\u017eile su pad u odnosu na kraj 2014. godine (za 0,67
  p.p. odnosno 0,70 p.p. respektivno), kao i na godi\u0161njem nivou (za 0,86 p.p.
  i 1,14 p.p. respektivno).\\n\\nPPEKS na kredite MFI odobrene privedi iznosila je
  21,38%, i zabilje\u017eila je pad u odnosu na decembar i juli 2014. godine od 0,45
  p.p. i 4,33 p.p. respektivno. Istovremeno, PPEKS na kredite odobrene fizi\u010dkim
  licima iznosila je 25,01%, pri \u010demu je ostvarila pad od 0,68 p.p. u odnosu
  na kraj 2014. godine, odnosno pad od 1,12 p.p. u odnosu na isti mjesec prethodne
  godine.\\n\\nNa novoodobrene kredite\\n\\nPPNKS na novoodobrene kredite MFI u julu
  2015. godine je iznosila 20,84%, \u0161to je bilo za 0,34 p.p. vi\u0161e nego na
  kraju 2014. godine, dok je na godi\u0161njem nivou zabilje\u017een pad od 0,92 p.p.
  PPEKS na novoodobrene kredite MFI u julu iznosila je 24,86%, \u0161to predstavlja
  rast od 0,24 p.p. u odnosu na decembar prethodne godine, i pad od 1,77 p.p. na godi\u0161njem
  nivou.\\n\\nPosmatrano po ro\u010dnosti, PPEKS na novoodobrene kratkoro\u010dne
  kredite je iznosila 26,14%, i u odnosu na decembar i juli prethodne godine bilje\u017ei
  pad od 0,08 p.p. i 1,27 p.p. respektivno. PPEKS na kredite odobrene sa ro\u010dno\u0161\u0107u
  preko jedne godine u julu je iznosila 24,62% i bilje\u017ei rast od 0,26 p.p. u
  odnosu na decembar 2014. godine, a pad od 1,73 p.p. na godi\u0161njem nivou.\\n\\nPosmatrano
  po namjeni za koju su odobravani krediti, tokom posmatranog perioda zabilje\u017eena
  MFI su odobravale nove kredite po najve\u0107im stopama za kupovinu zemlji\u0161ta,
  pri \u010demu je u julu 2015. godine ova stopa iznosila 30,01%.\\n\\n**Boks 2.3
  \u2013 Pore\u0111enje kamatnih stopa po kojima su kredite odobravale banke i MFI**\\n\\nKamatne
  stope po kojima su banke i MFI odobravale kredite se zna\u010dajno razlikuju. Naime,
  PPNKS na ukupne kredite kod banaka je iznosila 8,14%, a efektivna 9,01%, dok su
  iste stope kod MFI iznosile 20,98%, odnosno 24,96%.\\n\\nBanke su odobravale kratkoro\u010dne
