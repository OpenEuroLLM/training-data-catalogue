  Ministarstvo finansija, \u201ePravci razvoja Crne Gore 2015-2018. godine\u201c,
  jun 2015. i kalkulacije CBCG\\n\\nU prvom polugodu 2015. godine, od predvi\u0111enih
  635 miliona eura novog zadu\u017eivanja, 500 miliona eura je obezbijedeno kroz emisiju
  euroobveznica, u skladu sa Zakonom o bud\u017eetu za 2015. godinu, \u0161to je dovelo
  do rasta spoljnog duga. Dio sredstava \u0107e biti iskori\u0161\u0107en za otplate
  duga po osnovu euroobveznica emitovanih 2010. godine, dok \u0107e dio biti iskori\u0161\u0107en
  za otplate duga iz ranijeg perioda. Takode, u istom periodu povu\u010den je dio
  sredstava iz kredita odobrenog od strane kineske Exim banke za finansiranje izgradnje
  dijela autoputa, \u0161to je tako\u0111e uticalo na porast spoljnog duga, tako da
  se o\u010dekuje da \u0107e dr\u017eavni dug na kraju 2015. godine biti na nivou
  60,1% BDP-a.\\n\\nPored navedenog zadu\u017eivanja u 2015. godini, tokom 2016. i
  2017. godine bi\u0107e potrebna zna\u010dajna sredstva za servisiranje duga. Kao
  rezultat toga, u narednom periodu o\u010dekuje se porast dr\u017eavnog duga i to
  na 63,5% u 2016. godini, odnosno na 65,7% na kraju 2018. godine. Zna\u010dajan uticaj
  na kretanje dr\u017eavnog duga u posmatranom periodu ima\u0107e povla\u010denje
  sredstva za realizaciju projekta autoputa Bar-Boljare, prioritetna dionica Smokovac-Mate\u0161evo
  (u iznosu od po 200 miliona eura).\\n\\nIz svega navedenog, predvi\u0111a se da
  \u0107e se dr\u017eavni dug u naredne \u010detiri godine kretati van granica definisanih
  Zakonom o bud\u017eetu i fiskalnoj odgovornosti (60% BDP-a), tako da \u0107e postojati
  zakonska obaveza preduzimanja mjera i pripreme plana za njegovu sanaciju. Prema
  tome, bi\u0107e neophodna detaljna strategija upravljanja dugom, kako bi se otklonio
  rizik koji mo\u017ee uzrokovati visoko u\u010de\u0161\u0107e javnog duga u BDP-u.\\n\\nNakon
  perioda izgradnje dionice autoputa, o\u010dekuje se da \u0107e visina duga imati
  silazni trend.\\n\\n\\\\textsuperscript{26} Izvor: Ministarstvo finansija: \u201ePravci
  razvoja Crne Gore 2015-2018. godine\u201c, jun 2015.\\n\\nEKSTERNI SEKTOR\\n\\nPrema
  preliminarnim podacima, u prvoj polovini 2015. godine u eksternom sektoru zabilje\u017een
  je rast deficitu teku\u0107eg ra\u010duna. Deficit teku\u0107eg ra\u010duna iznosio
  490,4\\\\textsuperscript{27} miliona eura i ve\u0107i je za 9,6% u poredenju sa
  istim periodom 2014. godine. Pove\u0107anje deficitu teku\u0107eg ra\u010duna posljedica
  je ve\u0107e neravnote\u017ee na ra\u010dunu roba, smanjenja izvoza i pove\u0107anja
  uvoza roba, i smanjenja suficita na ra\u010dunu sekundarnih dohodaka. Na finansijskom
  ra\u010dunu ostvaren je veliki neto priliv portfolio investicija, najve\u0107i u
  istoriji kompiliranja platnog bilansa Crne Gore, kao i pove\u0107anje priliva stranih
  direktnih investicija, koji nije rezultat ve\u0107eg ulaganja stranog kapitala ve\u0107
  je posljedica manjeg povla\u010denja investicija od strane nerezidenata u poredenju
  sa 2014. godinom.\\n\\nPogor\u0161anje salda na teku\u0107em ra\u010dunu uslijed
  nepovoljnih trendova u robnoj razmjeni sa inostranstvom rezultiralo je spoljnotrgovinskim
  deficitom. Smanjenjem izvoza roba za 5,7%, kao i pove\u0107anjem uvoza za 3,5% ostvaren
  je spoljnotrgovinski deficit u iznosu od 686,7 miliona eura ili 5,7% vi\u0161e nego
  u istom periodu 2014. godine. Visoka uvozna zavisnost, kao i opadaju\u0107i trend
  izvoza uti\u010de na dalje produbljanje spoljnotrgovinske neravnote\u017ee. Pokrivenost
  spoljnotrgovinskog deficitu suficitom ostvarenim na ostalim ra\u010dunima teku\u0107eg
  ra\u010duna iznosila je 28,6%, \u0161to je za 2,5% manje nego u istom periodu prethodne
  godine.\\n\\nU periodu januar-jun 2015. godine obim razmjene usluga iznosio je 468,7
  miliona eura i za 11,1% je ve\u0107i nego u istom periodu prethodne godine. Na pove\u0107anje
  obima razmjene najve\u0107i uticaj je imalo kretanje na ra\u010dunima usluga putovanje-turizam
  i transporta. U posmatranom periodu suficit na ra\u010dunu usluga iznosio je 121
  milion eura, \u0161to je za 1% vi\u0161e nego u istom periodu 2014. godine..\\n\\nU
  posmatranom periodu zabilje\u017een je rast suficita primarnih (faktorskih) dohodaka
  iz inostranstva za 2,8% \u010dime je ostvaren neto priliv od 25,2 miliona eura.
  Na ra\u010dunu sekundarnih dohodaka zabilje\u017een je suficit u iznosu od 50 miliona
  eura, \u0161to je za 13,3% manje nego u prvoj polovini 2014. godine, a posljedica
  je ve\u0107eg odliva po osnovu otplate kamata i ispla\u0107enih dividendi.\\n\\nNa
  kapitalnom i finansijskom ra\u010dunu ostvaren je neto priliv po osnovu stranih
  direktnih investicija i portfolio investicija, dok je neto odliv ostvaren na ra\u010dunu
  ostalih investicija. Neto priliv stranih direktnih investicija u prvoj polovini
  2015. godine iznosio je 185,4 miliona eura ili 19,1% vi\u0161e nego u istom periodu
  prethodne godine. Na ra\u010dunu portfolio investicija zabilje\u017eeno je ve\u0107e
  zadu\u017eivanje dr\u017eave emisijom euroobveznica na me\u0111unarodnom tr\u017ei\u0161tu
  kapitala u poredenju sa 2014. godinom, \u0161to je rezultiralo neto prilivom u iznosu
  od 350 miliona eura, dok je istovremeno na ra\u010dunu ostalih investicija ostvaren
  neto odliv u iznosu od 62,8 miliona eura. U periodu januar-jun 2015. godine zabilje\u017eeno
  je smanjenje obaveza dr\u017eave i banaka, dok su ostali sektori (privreda) pove\u0107ali
  svoje obaveze po osnovu kredita.\\n\\n\\\\textsuperscript{27} Podaci platnog bilansa
