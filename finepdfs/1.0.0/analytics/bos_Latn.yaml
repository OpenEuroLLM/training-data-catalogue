sample: '["\"Projekat \u201cBudi DRUGa\u010diji!\u201d\\n\\nRezultati anketnog upitnika
  o nasilju u \u0161kolama\\n\\n\u2022 anonimno anketno ispitivanje sprovedno u 8
  srednjih \u0161kola Subotice i 3 srednje \u0161kole u Ba\u010dkoj Topoli\\n\u2022
  anketni upitnik ima 11 pitanja\\n\u2022 anketirano 489 srednjo\u0161kolaca\\n\u2022
  statisti\u010dka obrada u SPSS v.13\\n\\nDa li ste bili svedoci nasilja u \u0161koli
  u toku ove \u0161kolske godine?\\n\\n56.9% - da\\n43.1% - ne\\n\\nwww.fppit.info\\n\\nKoji
  oblik nasilja ste videli u \u0161koli me\u0111u vr\u0161njacima u toku ove \u0161kolske
  godine?\\n\\n- fizi\u010dko: 34.3%\\n- verbalno: 70.2%\\n- socijalno: 38.2%\\n-
  drugo nasilje: 4.5%\\n\\nKoji oblik nasilja ste videli u \u0161koli me\u0111u vr\u0161njacima
  u toku ove \u0161kolske godine?\\n\\ndrugi oblici nasilja:\\n\\n- elektronsko: 71.4%\\n-
  psiholo\u0161ko: 19.1%\\n- seksualno: 9.5%\\n\\nwww.fppit.info\\n\\nNa kom mjestu
  u \u0161koli se nasilje naj\u010de\u0161\u0107e desilo?\\n\\n- u dvori\u0161tu:
  27.1%\\n- u u\u010dionici: 58.1%\\n- na hodniku: 33.7%\\n- drugo: 8.4%\\n\\nNa kom
  mjestu u \u0161koli se nasilje naj\u010de\u0161\u0107e desilo?\\n\\ndrugo mesto:\\n\\n-
  u WC: 10.5%\\n- u fiskulturnoj sali: 5.3%\\n- ispred/van \u0161kole: 73.7%\\n- bez
  odgovora: 10.5%\\n\\nwww.fppit.info\\n\\nKako ste se Vi pona\u0161ali ako ste bili
  svedok nasilja u \u0161koli u toku ove \u0161kolske godine?\\n\\n- nisam ni\u0161ta
  uradio, samo sam gledao: 24.4%\\n- prijavio sam nasilje: 8.4%\\n- poku\u0161ao da
  interveni\u0161em: 31.8%\\n- ne ti\u010de me se/ne treba da se me\u0161am: 38.0%\\n-
  drugo: 5.6%\\n\\nKako ste se Vi pona\u0161ali ako ste bili svedok nasilja u \u0161koli
  u toku ove \u0161kolske godine?\\n\\ndrugo:\\n\\n- priklju\u010dio se nasilniku:
  32.0%\\n- pomagao, na lep na\u010din probao: 20.0%\\n- bio \u017ertva: 8.0%\\n-
  bez odgovora: 40.0%\\n\\nwww.fppit.info\\n\\nKoji je po Vama naj\u010de\u0161\u0107i
  oblik nasilja u \u0161koli me\u0111u vr\u0161njacima?\\n\\n- \u010dupanje, udranje,
  \u0161utiranje...\\n  - 26.2%\\n- olimanje i uni\u0161tavanje stvari\\n  - 10.7%\\n-
  ismevanje i omalova\u017eavanje\\n  - 71.8%\\n- ogovaranje i \u0161irenje la\u017ei
  o nekome\\n  - 54.4%\\n- slanje uzne\u0107enih \u010din i uvredljivih sadr\u017eaja...\\n  -
  15.3%\\n- drugo\\n  - 2.7%\\n\\nKoji je po Vama naj\u010de\u0161\u0107i oblik nasilja
  u \u0161koli me\u0111u vr\u0161njacima?\\n\\ndrugo nasilje:\\n\\n- provokacija:
  15.4%\\n- odbacivanje: 7.7%\\n- vre\u0111anje: 7.7%\\n- bez odgovora: 69.2%\\n\\nwww.fppit.info\\n\\nDa
  li bi prijavili nasilje koje primetite u \u0161koli?\\n\\n- da, uvek: 30.6%\\n-
  ne, poku\u0161ao ne, ako mi je drug: 22.1%\\n- ne, nisam cinkaro\u0161: 11.7%\\n-
  ne, ako nisam ume\u0161an: 27.2%\\n- ne, nikada: 7.4%\\n- drugo: 6.6%\\n\\nDa li
  bi prijavili nasilje koje primetite u \u0161koli?\\n\\ndrugo:\\n\\n- da, anonimno:
  38.7%\\n- zavisi od situacije/ponekad: 32.3%\\n- ne znam: 3.2%\\n- bez odgovora:
  25.8%\\n\\nDa li znate kome treba prijaviti nasilje u \u0161koli?\\n\\n- znam: 81.7%\\n-
  ne znam: 6.0%\\n- nisam siguran: 12.3%\\n\\nDa li si nekada bio/la \u017ertva maltretiranja
  ili zlostavljanja u \u0161koli u toku svog \u0161kolovanja?\\n\\n- ne: 54.2%\\n-
  da, fizi\u010dkog: 14.9%\\n- da, verbalnog: 35.0%\\n- da, socijalnog: 14.7%\\n-
  da, drugog nasilja: 1.2%\\n\\nDa li si nekada bio/la \u017ertva maltretiranja ili
  zlostavljanja u \u0161koli u toku svog \u0161kolovanja?\\n\\ndrugo nasilje:\\n\\n-
  psiholo\u0161ko: 33.3%\\n- elektronsko: 16.7%\\n- bez odgovora: 50.0%\\n\\nwww.fppt.info\\n\\nDa
  li si nekada bio/la \u017ertva maltretiranja ili zlostavljanja u \u0161koli u toku
  ove \u0161kolske godine?\\n\\n13.1%  da\\n\\n86.9%  ne\\n\\nDa li si nekada bio/la
  \u017ertva maltretiranja ili zlostavljanja u \u0161koli u toku ove \u0161kolske
  godine?\\n\\noblik nasilja:\\n\\n- verbalno: 28.6%\\n- fizi\u010dko: 14.3%\\n- socijalno:
  4.8%\\n- psiholo\u0161ko: 3.2%\\n- bez odgovora: 49.2%\\n\\nDa li je po tebi reakcija
  nadle\u017enih u \u0161koli na nasilje adekvatna i pravovremena?\\n\\n- da: 26.3%\\n-
  ne: 34.4%\\n- ne znam: 39.2%\\n\\n\u0160ta bi trebalo preduzeti da se smanji nasilje
  u \u0161kolama?\\n\\n- stro\u017eije ka\u017enjavati nasilnike: 54.8%\\n- preventivni
  programi: 33.0%\\n- obuke za komunikacione ve\u0161tine: 25.2%\\n- ne znam: 13.8%\\n-
  drugo: 1.6%\\n\\n\u0160ta bi trebalo preduzeti da se smanji nasilje u \u0161kolama?\\n\\ndrugo:\\n\\n-
  nove reforme: 25.0%\\n- nau\u010diti uzvratiti: 12.5%\\n- nekome nema pomo\u0107i:
  25.0%\\n- bez odgovora: 37.5%\"", "\"KLJU\u010c\\n\\nDer erste Teil\\n\\nZadaci
  pod rednim brojem 2, 3, 4, 6, 7, 9, 10, 11, 13, 14, 15, 16,  18, 19, 20, 22, 23,
  24, 25 i 26 nose po 2 poena, a ostali po jedan poen. Ukupno: 40 + 6 = 46\\n\\nDer
  zweite Teil\\n\\nDve verzije ta\u010dnih re\u0161enja\\n\\nSvaki zadatak nosi po
  jedan poen i to je ukupno: 18 poena\\n\\nDer dritte Teil\\n\\nSvaki zadatak 1 poen.
  Ukupno 20 poena.\\n\\nDer vierte Teil\\n\\nSvaki zadatak 1 poen. Ukupno 6 poena.\\n\\nDer
  f\u00fcnfte Teil\\n\\nKategorije koje se ocenjuju (za svaku kategoriju dobija se
  maksimalno 5 poena)\\n\\n1. ispunjenost postavljenog zadatka (da li je u\u010denik
  prepoznao vrstu teksta koju treba da pi\u0161e i koja diktira formu teksta)\\n2.
  sadr\u017eaj, obim, registar (da li je u\u010denik prepoznao temu i pisao o njoj,
  koliko je pisao)\\n3. koherentnost (gradnja teksta, smislena povezanost re\u010denica
  i re\u010deni\u010dnih delova)\\n4. re\u010dnik (ovladanost re\u010dnikom, izrazima
  neophodnim za sporazumevanje u dru\u0161tvu)\\n5. strukture (ovladanost jezi\u010dkim
  i gramati\u010dkim strukturama- morfologija i sintaksa)\\n6. ortografija (ovladanost
  pravilima grafije i primene interpunkcije) ukupno 30 poena\\n\\n46 + 18 + 20 + 6
  + 30 = 120\"", "\"Tehni\u010dki list\\n\\nISOFLEX-PU 500 DTL\\n\\nJednokomponentna,
  poliuretanska, te\u010dna, vodonepropusna, membrana za obradu detalja na ravnim
  krovovima, oja\u010dana vlaknima\\n\\nOpis\\n\\n2. Svojstva o\u010dvrsle membrane\\n\\nTiksotropna,
  jednokomponentna, te\u010dna poliuretanska, hidroizolaciona membrana za obradu detalja
  na ravnim krovovima, oja\u010dana vlaknima. ISOFLEX-PU 500 DTL se bazira na elastomernim,
  hidrofobnim, poliuretanskim smolama odli\u010dne mehani\u010dke, hemijske, otpornosti,
  kao i otpornosti na termi\u010dke i atmosferske uticaje. Proizvod ima sledec\u0301a
  svojstva:\\n\\n* Formira uniforman, elasti\u010dan, vodonepropusni, paropropusni
  zaptivni sloj, bez \u0161avova ili spojeva.\\n* Primena je moguc\u0301a, \u010dak
  i na nepravilnim podlogama.\\n* Odli\u010dna adhezija na razli\u010dite podloge,
  kao \u0161to su beton, cementni malteri, drvo, metal, bitumenske membrane i postojec\u0301e
  akrilne i hibridne te\u010dne hidroizolacione membrane.\\n\\nSertifikovan prema
  EN 1504-2 i klasifikovan kao premaz za povr\u0161insku za\u0161titu betona. Broj
  sertifikata: 2032-CPR-10.11. CE oznaka.\\n\\nPolje primene\\n\\nISOFLEX-PU 500 DTL
  je pogodan za hidroizolaciju detalja krovova, kao \u0161to su:\\n\\n* Cevi.\\n*
  Spojnice na zidu.\\n* Okapnice.\\n* Svetlarnici.\\n* Oluci.\\n* Dimljaci.\\n* Jedinice
  za ventilaciju i klimatizaciju na krovu.\\n* Solarni sistemi.\\n\\nTehni\u010dki
  podaci\\n\\n1. Svojstva proizvoda u te\u010dnoj formi Oblik: pre-polimer\\n\\npoliuretan\\n\\nBoje:\\n\\nsiva,
  bela\\n\\nGustina:\\n\\n1,40 kg/l\\n\\nPrekidno izdu\u017eenje: > 100%\\n\\n(EN-ISO
  527)\\n\\nZatezna sila:\\n\\n2,8 N/mm 2\\n\\n(EN-ISO 527)\\n\\nTvrdoc\u0301a prema
  SHORE \u0391: 78 2\\n\\nKapilarno upijanje:\\n\\n0,01 kg/m\\n\\n2\\n\\n*h\\n\\n0,5\\n\\n(EN
  1062-3,\\n\\nUslov prema EN 1504-2: w < 0,1)\\n\\nParopropusnost vodene pare:\\n\\nSd
  = 0,82 m\\n\\n(EN ISO 7783-2, propusno,\\n\\nKlasa I < 5 m)\\n\\nSila prijanjanja
  za beton: > 2 N/mm\\n\\n2\\n\\n(EN 1542)\\n\\nVe\u0161ta\u010dko vreme: Prolazi
  (bez pojave\\n\\n(EN 1062-11,\\n\\nbalon\u010dic\u0301a, pukotine i\\n\\nposle 2000
  h)\\n\\nljuspanja)\\n\\nReakciju na vatru:\\n\\nEuroclass F\\n\\n(EN 13501-1)\\n\\nTemperaturna
  otpornost: od -40\u00b0C do +90\u00b0C\\n\\nUputstvo za upotrebu\\n\\n1. Priprema
  podloge\\n\\nPodloga mora biti suva (sadr\u017eaj vlage <4%) i bez masti, slabo
  vezanih delova, pra\u0161ine itd.\\n\\n1.1 Betonske povr\u0161ine\\n\\nSve postojec\u0301e
  \u0161upljine u betonu treba unapred popraviti.\\n\\nIntenzivne pukotine na podlozi
  moraju se premazati lokalno, a nakon 2-3 sata (u zavisnosti od vremenskih uslova)
  moraju se zaptiti poliuretanskim zaptivnim gitovima FLEX PU-30 S ili FLEX PU-50
  S.\\n\\nBeton i druge porozne povr\u0161ine sa sadr\u017eajem vlage <4%, treba tretirati
  prajmerom PRIMER-PU 100, uz prose\u010dnu potro\u0161nju od 200 g/m 2 .\\n\\nPovr\u0161ine
  sa sadr\u017eajem vlage >4% treba tretirati specijalnim dvokomponentnim poliuretanskim
  prajmerom PRIMER-PU 140, sa potro\u0161njom od 100-250 g/m 2 .\\n\\n1.2 Glatka-neupijajuc
  a povr\u0161ina\\n\\n\u0301\\n\\nGlatke i neupijajuc\u0301e povr\u0161ine, bitumenske
  hidroizolacione membrane oblo\u017eene granulama i postojec\u0301e akrilne ili hibridne
  te\u010dne hidroizolacione membrane, moraju biti premazane epoksidnim prajmerom
  EPOXYPRIMER-500 na vodenoj bazi, razre\u0111en vodom do 30% te\u017einski. Proizvod
  se nanosi \u010detkom ili valjkom u jednom sloju.\\n\\nPotro\u0161nja: 150-200 g/m
  2 .\\n\\nU zavisnosti od vremenskih uslova, ISOFLEX-PU 500 DTL se primenjuje u roku
  od 24-48 sati od prajmerisanja, \u010dim sadr\u017eaj vlage padne ispod 4%.\\n\\n1.3
  Metalna povr\u0161ina\\n\\nMetalna povr\u0161ina treba biti:\\n\\n* Bez materijala
  koji mogu ometati adheziju, npr. pra\u0161ine, tro\u0161nih delova, mast itd.\\n*
  Suva i stabilna.\\n* Bez r\u0111e ili korozije koja mo\u017ee ometati adheziju.\\n\\nPripremljena
  \u010detkanjem, \u0161mirglanjem, peskiranjem itd. A zatim temeljno o\u010distiti
  od pra\u0161ine. Nakon pripreme, metalne povr\u0161ine se prema\u017eu sa EPOXYCOAT-AC
  antikorozivnim epoksidnim prajmerom u 1 ili 2 sloja. EPOXYCOAT-AC se nanosi valjakom,
  \u010detkom ili u spreju.\\n\\nDrugi sloj sledi nakon \u0161to se prvi osu\u0161i,
  ali u roku od 24 sata.\\n\\nPotro\u0161nja: 150-200 g/m 2 /sloj.\\n\\nPrimena ISOFLEX-PU
  500 DTL-a treba da sledi u narednih 24-48 sati.\\n\\n2. Primena - Potro\u0161nja\\n\\nPre
  nano\u0161enja preporu\u010duje se blago me\u0161anje ISOFLEX-PU 500 DTL sa drvenim
  ili metalnim \u0161tapom, sve dok ne postane homogen. Treba izbegavati prekomerno
  me\u0161anje, kako bi se spre\u010dilo uvla\u010denje vazduha u materijal.\\n\\nISOFLEX-PU
  500 DTL se nanosi \u010detkom u dva sloja. Prvi sloj se nanosi 2-3 sata nakon prajmerisanja
  i dok je PRIMER-PU 100 jo\u0161 uvek lepljiv. Drugi sloj treba naneti nakon 16-36
  sati, u zavisnosti od vremenskih uslova.\\n\\nUkupna potro\u0161nja: prose\u010dno
  1,2-1,5 kg/m 2 , u zavisnosti od podloge.\\n\\nAlat o\u010distiti rastvara\u010dem
  SM-28 dok je ISOFLEXPU 500 DTL jo\u0161 uvek sve\u017e.\\n\\nPakovanje\\n\\nISOFLEX-PU
  500 DTL se isporu\u010duje u kantama od 1 kg i 5 kg.\\n\\nSkladi\u0161tenje\\n\\n12
  meseci od datuma proizvodnje ako se \u010duva u originalnoj, neotvorenoj ambala\u017ei,
  na mestima za\u0161tic\u0301enim od vlage i direktnog izlaganju suncu. Preporu\u010dena
  temperatura skladi\u0161tenja je izme\u0111u\\n\\n+5\u00b0C i +35\u00b0C.\\n\\nNapomene\\n\\n*
  ISOFLEX-PU 500 DTL nije pogodan za kontakt sa hemijski tretiranom vodom iz bazena.\\n*
  Pakovanje se mora upotrebiti \u010dim se otvori jer se ne mo\u017ee ponovo \u010duvati
  i koristiti.\\n* Temperatura tokom nano\u0161enja i o\u010dvr\u0161c\u0301avanja
  proizvoda treba biti izme\u0111u +8\u00b0C i +35\u00b0C.\\n\\nIspariva organska
  jedinjenja (VOCs)\\n\\nU skladu sa Pravilnikom o ograni\u010denjima i zabranama
  proizvodnje, stavljanja u promet i kori\u0161c\u0301enja hemikalija (\\\"Sl. glasnik
  RS\\\", br. 90/2013, 25/2015, 2/2016, 44/2017 i 36/2018) (Tabela A Prilog 3. Deo
  1. Lista A), Maksimalno dozvoljene vrednosti sadr\u017eaja VOC za podkategoriju
  proizvoda z, tip SB je 500 g/l (2013) za gotov proizvod.\\n\\nGotov proizvod ISOFLEX-PU
  500 DTL sadr\u017ei maksimalno 500 g/l VOC.\\n\\n2032\\n\\nISOMAT S.A.\\n\\n17 th
  km Thessaloniki \u2013 Ag. Athanasios P.O. BOX 1043, 570 03 Ag Athanasios, Greece\\n\\n18\\n\\n2032-CPR-10.11\\n\\nDoP
  No.: ISOFLEX-PU 500 DTL / 1865-01\\n\\nEN 1504-2\\n\\nSurface protection products
  Coating\\n\\nPermeability to CO2\\n\\n: Sd > 50m\\n\\nWater vapor permeability:
  Class I (permeable)\\n\\nCapillary absorption: w < 0.1 kg/m2 \u00b7h 0.5\\n\\nAdhesion:
  \u2265 0.8 N/mm\\n\\n2\\n\\nReaction to fire: Euroclass F\\n\\nDangerous substances
  comply with 5.3\\n\\nISOMAT D.O.O.\\n\\nGRA\u0110EVINSKA HEMIJA I MALTERI\\n\\nPrhova\u010dka
  bb, 22310 \u0160imanovci, Srbija\\n\\nT+381 22 222 150 100,F+381 22 215 150 101\\n\\nwww.isomat.rs   e-mail:
  firstname.lastname@example.org\"", "\"UGOVOR O NABAVCI ROBE\\n\\nOvaj ugovor zaklju\u010den
  je dana 02.09.2020. godine izme\u0111u:\\n\\nNaru\u010dioca: \u201eOtpadne vode\u201c
  DOO sa sjedi\u0161tem u Budvi, Ul. Omladinskih brigada bb, PIB: 03304388, Broj ra\u010duna:
  525-7326-85 kod Komercijalne banka AD Podgorica, koga zastupa Goran Pejovi\u0107,
  izvr\u0161ni direktor (u daljem tekstu: Naru\u010dilac) i\\n\\nPonu\u0111a\u010da:
  \u201cAlliance\u201d doo, sa sjedi\u0161tem u Podgorici, Cetinjski put bb, Broj
  ra\u010duna: 520-825100-21, Naziv banke: Hipotekarna banka, koga zastupa Ratko Pavi\u010devi\u0107,
  izvr\u0161ni direktor (u daljem tekstu: Dobavlja\u010d).\\n\\nOSNOV UGOVORA:\\n\\nZahtjev
  za dostavljanje ponuda za jednostavne nabavke broj: 463 od 18.08.2020. godine, za
  nabavku robe \u2013 Rezervni djelovi i usluge odr\u017eavanja automobile po partijama
  za partiju 3: Rezervni djelovi i odr\u017eavanje vozila marke \u201cRenault\u201d,
  za potrebe \u201eOtpadne vode\u201c DOO Budva; Ponuda ponu\u0111a\u010da \u201cAlliance\u201d
  doo Podgorica, broj: 475 od 24.08.2020.godina; Broj i datum Obavije\u0161tenja o
  ishodu postupka jednostavne nabavke broj: 463/4 od 26.08.2020. godine.\\n\\n\u010clan
  1\\n\\nPredmet ovog ugovora je nabavka robe \u2013 Rezervni djelovi i usluge odr\u017eavanja
  automobile po partijama za partiju 3: Rezervni djelovi i odr\u017eavanje vozila
  marke \u201cRenault\u201d, prema Zahtjevu za dostavljanje ponuda za jednostavne
  nabavke broj: 463 od 18.08.2020. godine, ponudi Dobavlja\u010da sa specifikacijom
  broj: 475 od 24.08.2020. godine i Obavije\u0161tenju o ishodu postupka jednostavne
  nabavke broj: 463/4 od 26.08.2020. godine.\\n\\n\u010clan 2\\n\\nVrijednost robe
  i usluga, prema prihva\u0107enoj cijeni ponude broj: 475 od 18.08.2020.godina, iznosi
  692,17 \u20ac bez ura\u010dunatog PDV-a.\\nPDV: 145,35 \u20ac\\n\\n\u010clan 3\\n\\nNaru\u010dilac
  se obavezuje da vrijednost izvr\u0161ene isporuke robe po ovom Ugovoru plati dobavlja\u010du
  kod Hipotekarne banke, na broj ra\u010duna 520-825100-21, virmanski, 30 dana po
  prijemu fakture.\\n\\n\u010clan 4\\n\\nRok trajanja ugovora je do potro\u0161nje
  procijenjene vrijednosti za predmetnu partiju u iznosu od 1200,00 \u20ac bez ura\u010dunatog
  PDV-a, sukcesivno, na zahtjev naru\u010dioca, uz po\u0161tovanje jedini\u010dnih
  cijena iz ponude, obzirom da Naru\u010dilac ne mo\u017ee predvidjeti broj opravki
  na predmetnim vozilima.\\n\\n\u010clan 5\\n\\nMjesto izvr\u0161enja ugovora: Sjedi\u0161te
  ponu\u0111a\u010da, Cetinjski put bb Podgorica i Industrijska zona bb Kotor.\\n\\n\u010clan
  6\\n\\nUkoliko usluge nijesu izvr\u0161ene na ugovoren na\u010din, odnosno imaju
  vidljive mane, predstavnik Naru\u010dioca du\u017ean je da odbije prijem usluge
  (vozila), i zahtijeva ponovno izvr\u0161enje usluga.\\n\\nAko se nakon primopredaje
  vozila pokaze neki nedostatak koji nije vidljiv (u tom trenutku), Naru\u010dioc
  je du\u017ean da o tom nedostatku obavijesti Izvr\u0161iocu i zahtijeva ponovno
  izvr\u0161enje usluge, najkasnije narednog dana od dana prijema. Opravke moraju
  biti ura\u0111ene u skladu sa preporukama i normativima proizvo\u0111a\u010da, ulja
  i maziva u skladu sa preporukom proizvo\u0111a\u010da.\\n\\n\u010clan 7\\n\\nUgovorne
  strane su saglasne da do raskida ovog Ugovora mo\u017ee do\u0107i ako Dobavlja\u010d
  ne bude izvr\u0161avao svoje obaveze u rokovima i na na\u010din predvi\u0111en Ugovorom
  i kada Naru\u010dilac ustanovi da kvalitet robe koja je predmet ovog ugovora ili
  na\u010din na koji se isporu\u010duje, odstupa od tra\u017eenog, odnosno ponu\u0111enog
  kvaliteta iz ponude Dobavlja\u010da.\\n\\nNaru\u010dilac je obavezan da u slu\u010daju
  uo\u010davanja propusta u obavljanju posla pisanim putem pozove Dobavlja\u010da
  i da putem Zapisnika zajedni\u010dki konstatuju uzrok i obim uo\u010denih propusta
  u isporuci predmetne robe.\\n\\nUkoliko Dobavlja\u010d i pored upozoravanja od strane
  Naru\u010dioca ne isporu\u010di predmetnu robu u rokovima i na na\u010din predvi\u0111en
  ugovorom Naru\u010dilac ima pravo da raskine ugovor.\\n\\n\u010clan 8\\n\\nDOBAVLJA\u010c
  garantuje kvalitet isporu\u010dene robe i izvr\u0161ene usluge i obavezuje se da
  bez odlaganja, o svom tro\u0161ku, izvr\u0161i zamjenu robe, koja nije posljedica
  nepravilnog rukovanja NARU\u010cILOCA.\\n\\nGarancija je 12 mjeseci od dana izvr\u0161enja
  usluge.\\n\\n\u010clan 9\\n\\nUkoliko u toku va\u017enosti ovog ugovora do\u0111e
  do bilo kakvih promjena u nazivu ili drugim statusnim promjenama ugovornih strana,
  tada \u0107e sva prava i obaveze ugovorne strane kod koje do\u0111e do takve promjene,
  pre\u0107i na njenog pravnog sljedbenika.\\n\\n\u010clan 10\\n\\nZa sve \u0161to
  nije predvi\u0111eno ovim ugovorom primjenjuju se odredbe Zakona o obligacionim
  odnosima i drugih pozitivnih propisa.\\n\\n\u010clan 11\\n\\nUgovorne strane su
  saglasne da eventualne sporove povodom ovog ugovora rje\u0161avaju sporazumom. U
  protivnom, ugovara se nadle\u017enost Privrednog suda.\\n\\n\u010clan 12\\n\\nNepo\u0161tovanje
  antikorupcijskog pravila iz \u010dlana 38 Zakona o javnim nabavkama (\u201eSlu\u017ebeni
  list Crne Gore\u201c, broj 74/19) povla\u010di ni\u0161tavost ugovora.\\n\\n\u010clan
  13\\n\\nOvaj ugovor je zaklju\u010den i potpisan od ovla\u0161\u0107enih zakonskih
  zastupnika strana ugovora i sa\u010dinjen je u 6 (\u0161est) istovjetnih primjeraka,
  od kojih po 3 (tri) primjerka za Naru\u010dioca i Dobavlja\u010da.\\n\\nNARU\u010cILAC\\nGoran
  Pejovi\u0107,\\nizvr\u0161ni direktor\\n\\nDOBAVLJA\u010c\\nRatko Pavi\u010devi\u0107,\\nizvr\u0161ni
