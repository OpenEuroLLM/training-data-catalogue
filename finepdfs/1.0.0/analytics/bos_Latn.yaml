  i preparati \u017eitarica} u vrijednosti od 25 miliona eura i povr\u0107e i vo\u0107e
  24,9 miliona eura. U okviru sektora \\\\textit{ma\u0161ine i transportni ure\u0111aji}
  najvi\u0161e je uvezeno drumskih vozila u iznosu od 61,2 miliona eura, elektri\u010dnih
  ma\u0161ina i aparat u iznosu od 37,2 miliona eura, industrijskih ma\u0161ina za
  op\u0161tu upotrebu od 32,9 miliona eura i telekomunikacionih aparata i ure\u0111aja
  u vrijednosti od 31,1 milion eura.\\n\\nPosmatrano po podkategorijama SMTK pove\u0107anju
