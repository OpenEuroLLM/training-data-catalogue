  Licencirani ovla\u0161\u0107eni revizor\"", "\"IZBOR ORIGINALNIH DELOVA JE NAJPRIRODNIJI
  IZBOR\\n\\nPERFORMANSE\\nORIGINALNI DELOVI\\n\\nUDOBNOST\\nORIGINALNI DELOVI\\n\\nBEZBEDNOST\\nORIGINALNI
  DELOVI\\n\\nAMBIJENT\\nORIGINALNI DELOVI\\n\\nURE\u0110AJI\\nORIGINALNI DELOVI\\n\\nBEZBEDNOST\\nORIGINALNI
  DELOVI\\n\\nKAKO PREPOZNATI ORIGINALNE DELOVE\\n\\nZa prepoznavanje originalnih
  delova, proverite da li komponente imaju oznake na\u0161ih brendova, koje su uvek
  jasno vidljive na originalnim delovima, od ko\u010dionog sistema do brisa\u010da
  vetrobranskog stakla, od amortizera do filtra za polen.\\n\\nSvi originalni delovi
  prolaze kroz stroge kontrole stru\u010dnjaka, kako tokom faze projektovanja tako
  i tokom proizvodnje, koji koriste najnovije materijale da testiraju pouzdanost komponenata.
  Sve to je u cilju garantovanja performansi i bezbednosti za vas i va\u0161e putnike
  u vozilu, tokom dugog vremena. Tra\u017eite uvek originalne delove i proverite da
  li su kori\u0161\u0107eni.\\n\\nPo\u0161tovani kup\u010de,\\n\\n\u017delimo da vam
  \u010destitamo i da vam se zahvalimo \u0161to ste izabrali Fiat 500L.\\n\\nNapisali
  smo ovaj priru\u010dnik da bismo vam pomogli da upoznate sve karakteristike va\u0161eg
  vozila i da ga koristite na najbolji mogu\u0107i na\u010din.\\n\\nPreporu\u010dujemo
  vam da ga pro\u010ditate do kraja pre nego \u0161to krenete u prvu vo\u017enju.\\n\\nU
  njemu \u0107ete na\u0107i va\u017ene podatke, savete i uputstva za kori\u0161\u0107enje
  vozila koja \u0107e vam pomo\u0107i da dobijete ono najbolje iz va\u0161eg Fiata.\\n\\nOva
  knji\u017eica tako\u0111e daje opis posebnih karakteristika i savete kao i bitne
  podatke za pravilnu negu, odr\u017eavanje, bezbednu vo\u017enju i kori\u0161\u0107enje
  i o\u010duvanje va\u0161eg Fiata tokom vremena.\\n\\nPa\u017eljivo pro\u010ditate
  upozorenja i indikacije obele\u017eene slede\u0107im znacima:\\n\\n- li\u010dna
  bezbednost\\n- bezbednost vozila\\n- za\u0161tita \u017eivotne sredine\\n\\nPrilo\u017eena
  Garancijska knji\u017eica daje spisak servisa koje Fiat nudi svojim kupcima:\\n-
  Potvrda o garanciji sa uslovima za odr\u017eavanje njene va\u017enosti;\\n- Ponudu
  dodatnih usluga koje su na raspolaganju kupcima Fiata.\\n\\nSigurni smo da \u0107e
  vam ova uputstva pomo\u0107i da se upoznate sa va\u0161im novim vozilom i da u\u017eivate
  u njemu, kao i da saznate mogu\u0107nosti nege vozila koju obezbe\u0111uju ljudi
  iz Fiata. U\u017eivajte u \u010ditanju.\\n\\nSre\u0107na vo\u017enja!\\n\\nOvaj
  priru\u010dnik opisuje sve verzije Fiata 500L. Shodno tome, treba da uzmete u obzir
  samo one podatke koji se odnose na nivo opreme enterijera, motor i verziju koju
  ste vi kupili. Svi podaci sadr\u017eani u ovom izdanju su isklju\u010divo indikativni.
  Grupa Fiat Automobili mo\u017ee u svakom trenutku da menja specifikacije modela
  vozila opisanog u ovom izdanju iz tehni\u010dkih ili marketin\u0161kih razloga.
  Za vi\u0161e informacija, kontaktirajte Fiatovog dilera.\\n\\nBITNE INFORMACIJE!\\n\\nDOLIVANJE
  GORIVA\\n\\nBenzinski motori: koristite samo bezolovni benzin oktanske vrednosti
  (RON) od najmanje 95 u skladu sa evropskom specifikacijom EN228. Upotreba benizina
  koji ne odgovara prethodno pomenutoj specifikaciji uzrokuje paljenje lampice upozorenja
  EOBD (evropska dijagnostika na vozilu) i nepravilan rad motora.\\n\\nDizel motori:
  sipajte samo dizel gorivo za motorna vozila koje je u skladu sa evropskom specifikacijom
  EN590. Kori\u0161\u0107enje drugih proizvoda ili me\u0161avina mo\u017ee trajno
  da o\u0161te\u0107i motor i shodno tome da poni\u0161ti va\u017eenje garancije.\\n\\nSTARTOVANJE
  MOTORA\\n\\nRu\u010dna ko\u010dnica treba da je povu\u010dena; ubacite menja\u010d
  u neutralni polo\u017eaj. Pritisnite do kraja pedalu kva\u010dila, ne pritiskaju\u0107i
  pritom gas, zatim okrenite klju\u010d za paljenje na MAR-ON i sa\u010dekajte da
  se ugasi lampica upozorenja (i lampica upozorenja za dizel verzije); okrenite klju\u010d
  za paljenje u AVV i pustite ga \u010dim motor startuje.\\n\\nPARKIRANJE NA ZAPALJIVOM
  MATERIJALU\\n\\nKataliti\u010dki konvertor dosti\u017ee visoke temperature tokom
  rada. Nemojte parkirati vozilo na travi, suvom li\u0161\u0107u, borovim iglicama
  ili drugom zapaljivom materijalu: rizik od po\u017eara.\\n\\nPO\u0160TOVANJE \u017dIVOTNE
  SREDINE\\n\\nVozilo je opremljeno sa sistemom koji stalno dijagnostikuje komponente
  vezane za emisije kako bi obezbedio bolju za\u0161titu \u017eivotne sredine.\\n\\nELEKTRI\u010cNI
  URE\u0110AJI\\n\\nUkoliko posle kupovine odlu\u010dite da dodate elektri\u010dne
  ure\u0111aje (sa rizikom od postepenog pra\u017enjenja akumulatora) obratite se
  Fiatovom dileru. Oni mogu da izra\u010dunaju ukupne potrebe za elektri\u010dnom
  energijom i da provere da li elektri\u010dni sistem vozila mo\u017ee da podr\u017ei
  tra\u017eeno optere\u0107enje.\\n\\nPLANIRANO SERVISIRANJE\\n\\nPravilno odr\u017eavanje
  vozila neophodno je za obezbe\u0111ivanje odr\u017eavanja njegovih performansi,
  bezbednosnih karakteristika, za\u0161tite \u017eivotne sredine i niskih tro\u0161kova
  eksploatacije tokom dugog vremena.\\n\\nPRIRU\u010cNIK ZA VLASNIKA SADR\u017dI\\n\\n...va\u017ene
  informacije, savete i upozorenja za pravilno kori\u0161\u0107enje, bezbednu vo\u017enju
  i odr\u017eavanje va\u0161eg vozila tokom vremena. Posebnu pa\u017enju treba obratiti
  na podatke obele\u017eene slede\u0107im oznakama:\\n\\n\u26a0\ufe0f (li\u010dna
  bezbednost)\\n\ud83c\udf33 (za\u0161tita \u017eivotne sredine)\\n\u26a0\ufe0f (za\u0161tita
  vozila).\\n\\nUPOZNAVANJE SA VA\u0160IM VOZILOM\\n\\nINSTRUMENT TABLA\\nPostojanje
  i mesto komandi, instrumenata i indikatora mo\u017ee da varira zavisno od razli\u010ditih
  verzija.\\n\\nslika 1\\n\\n1. Podesivi i usmerivi otvori za vazduh \u2013 2. Komande
  za radio na upravlja\u010du (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)
  \u2013 3. Komandna ru\u010dica spolja\u0161njeg svetla \u2013 4. Instrument tabla
  \u2013 5. Komanda ru\u010dica brisa\u010da vetrobranskog stakla / brisa\u010da zadnjeg
  stakla /putnog kompjutera \u20136. Podesivi i usmerivi sredi\u0161nji ventilacioni
  otvori \u2013 7. Fiksni gornji ventilacioni otvor - 8. Prednji vazdu\u0161ni jastuk
  suvoza\u010da \u2013 9. Gorna pregrada za sitne stvari i dokumenta (za verzije/
  tr\u017ei\u0161ta za koje je predvi\u0111eno mo\u017ee biti klimatizovana)\u2013
  10. Pregrada za odlaganje stvari\u2013 11. Donja pregrada za sitne stvari i dokumenta
  \u2013 12. Komandna dugmad\u2013 13. Sistem za grejanje/ventilaciju ili ru\u010dna
  kontrola klime (za verzije /tr\u017ei\u0161ta za koje je predvi\u0111eno) ili automatska
  dvozonska kontrola klime (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\u2013
  14. USB port/AUX uti\u010dnica (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)
  \u2013 15. Uconnect (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno) ili
  instalacija radio sistema \u2013 16. Prekida\u010d paljenja \u2013 17. Prednji vazdu\u0161ni
  jastuk voza\u010da\u2013 18. Ru\u010dica za elektronsku kontrolu brzine/ ograni\u010diva\u010d
  brzine (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nKOMANDNA
  TABLA\\nI INSTRUMENTI\\n\\nBoja pozadine i tip instrumenata mo\u017ee da varira
  zavisno od verzije.\\nSamo dizel verzije imaju lampice upozorenja \\\\( \\\\text{TO}
  \\\\) i \\\\( \\\\text{E} \\\\).\\nMaksimalna brzina motora kod dizel verzija (crvena
  zona na broja\u010du obrtaja) iznosi 5000 obrtaja u minuti.\\n\\nVERZIJE SA MULTIFUNKCIONALnim
  DISPLEJEM\\n\\nslika 2\\nA. Brzinomer (indikator brzine)\\nB. Multifunkcionalni
  displej\\nC. Broja\u010d obrtaja\\nD. Mera\u010d nivoa goriva sa lampicom upozorenja
  o rezervi\\nE. Mera\u010d temperature rashladnog sredstva motora sa lampicom upozorenja
  o pregrejavanju\\n\\nVERZIJE SA REKONFIGURABILNIM MULTIFUNKCIONALnim displejem\\n\\nslika
  3\\n\\nA. Brzinomer (indikator brzine) B. Refkonfigurabilni multifunkcionalni displej
  C. Broja\u010d obrtaja D. Mera\u010d nivoa goriva sa lampicom upozorenja o rezervi
  E. Mera\u010d temperature rashladnog sredstva motora sa lampicom upozorenja o pregrevanju\\n\\nBRZINOMER
  (INDIKATOR BRZINE)\\nPokazuje brzinu vozila (brzinomer).\\n\\nBROJA\u010c OBRTAJA\\nPokazuje
  broj obrtaja motora u minuti.\\n\\nMERA\u010c NIVOA GORIVA\\nPokazuje koli\u010dinu
  preostalog goriva u rezervoaru goriva\\n\\nE \u2013 prazan rezervoar\\nF - pun rezervoar\\n\\nLampica
  upozorenja A sl. 4 (kod nekih verzija pra\u0107ena porukom na displeju) pali se
  kako bi ukazala da je u rezervoaru ostalo jo\u0161 oko 6 do 8 litara goriva; u ovom
  slu\u010daju dolijte gorivom \u0161to je mogu\u0107e pre.\\n\\nNemojte voziti sa
  skoro praznim rezervoarom za gorivo: prekidi u napajanju gorivom mogli bi da o\u0161tete
  katalizator.\\n\\nVA\u017dNO: Ukoliko kazaljka pokazuje E, a lampica upozorenja
  A trep\u0107i kako bi ukazala na gre\u0161ku u sistemu, obratite se Fiatovom dileru
  kako bi proverio sistem.\\n\\nINDIKATOR TEMPERATURE SREDSTVA ZA HLA\u0110ENJE MOTORA\\nKazaljka
  mera\u010da pokazuje temperaturu sredstva za hla\u0111enje motora i po\u010dinje
  da daje indikacije kada temperatura ove te\u010dnosti pre\u0111e oko 50\u00b0C.\\n\\nU
  normalnim uslovima kazaljka mera\u010da ima razli\u010dite polo\u017eaje na skali,
  zavisno od uslova kori\u0161\u0107enja.\\n\\nC \u2013 niska temperatura sredstva
  za hla\u0111enje motora\\nH \u2013 visoka temperatura sredstva za hla\u0111enje
  motora\\n\\nMogu\u0107e je da se upali lampica upozorenja B sl. 4 (pra\u0107ena
  porukom na displeju kod nekih verzija) kako bi ukazala na to da je temperatura sredstva
  za hla\u0111enje previsoka; ugasite motor u tom slu\u010daju i obratite se Fiatovom
  dileru.\\n\\nUkoliko kazaljka mera\u010da temperature sredstva za hla\u0111enje
  motora do\u0111e u crvenu zonu, odmah ugasite motor i obratite se Fiatovom dileru.\\n\\nDISPLEJ\\n\\nVozilo
  mo\u017ee imati multifunkcionalni ili rekonfigurabilni multifunkcionalni displej
  koji pokazuje korisne informacije tokom vo\u017enje, zavisno od prethodnih pode\u0161avanja.\\n\\nKada
  se izvadi klju\u010d za paljenje, displej se aktivira i pokazuje vreme i ukupnu
  kilometra\u017eu ili milja\u017eu (u km ili miljama) tokom nekoliko sekundi kada
  se prednja vrata otvore/zatvore.\\n\\nVA\u017dNO: Kada je spolja\u0161nja temperatura
  vrlo niska (ispod 0\u00b0C) mogu\u0107e je da potraje du\u017ee nego \u0161to je
  uobi\u010dajeno da se ovi podaci pojave na displeju.\\n\\nMULTIFUNKCIONALNI DISPLEJ\\n\\\"STANDARDNI\\\"
  EKRAN\\n\\nDisplej pokazuje slede\u0107e informacije, slika 5:\\n\\nA Datum\\nB
  Aktiviranje elektri\u010dnog servo upravlja\u010da (dupli pogon) (indikacija CITY)
  ili na\u010din vo\u017enje ECO (indikacija ECO)\\nC indikator menja\u010da (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nD polo\u017eaj centriranih farova (samo sa upaljenim
  oborenim svetlima)\\nE Odometar (prikaz pre\u0111enog puta u kilometrima/miljama)\\nF
  Vreme (pokazuje se stalno, \u010dak i sa izva\u0111enim klju\u010dem i zatvorenim
  vratima)\\nG indikacija funkcije Start&Stop (za verzije/tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\nH Spolja\u0161nja temperatura (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nI prikaz ograni\u010diva\u010da brzine (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nslika 5\\n\\nREKONFIGURABILNI MULTIFUNKCIONALNI\\nDISPLEJ
  \\\"STANDARDNI\\\" EKRAN\\n\\nVerzije bez ograni\u010diva\u010da brzine\\n\\nSlede\u0107e
  informacije se pojavljuju na displeju, slika 6:\\n\\nA Vreme\\nB Prikaz datuma ili
  pre\u0111enog puta u kilometrima (ili miljama)\\nC Spolja\u0161nja temperatura (za
  verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nD Indikator menja\u010da
  (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nE Odometar (prikaz
  pre\u0111enog puta u kilometrima/miljama)\\nF polo\u017eaj centriranih farova (samo
  sa upaljenim oborenim svetlima)\\nG Indikacija o stanju vozila\\n\\nKod nekih verzija
  displej pokazuje pritisak turbine slika 7.\\n\\nVerzije sa ograni\u010diva\u010dem
  brzine\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nSlede\u0107e
  informacije se pojavljuju na displeju, slika 8:\\n\\nA Vreme\\nB Prikaz datuma ili
  pre\u0111enog puta u kilometrima (ili miljama)\\nC Indikator menja\u010da\\n   (za
  verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n   ili indikacija funkcije
  Start&Stop\\n   (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nD Ograni\u010diva\u010d
  brzine\\n   (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nE Odometar\\n   (prikaz
  pre\u0111enog puta u kilometrima/miljama)\\nF Polo\u017eaj centriranih farova\\n   (samo
  sa upaljenim oborenim svetlima)\\nG Spolja\u0161nja temperatura\\n   (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nH Indikacija o stanju vozila\\n   (npr. otvorena vrata,
  mogu\u0107 led na putu itd.)\\n\\nINDIKATOR STEPENA PRENOSA MENJA\u010cA\\n\\nSistem
  indikatora stepena prenosa menja\u010da (GSI) savetuje voza\u010du da menja brzine
  putem odre\u0111enih indikacija na instrument tabli (slika 9).\\n\\nVoza\u010d se
  obave\u0161tava pomo\u0107u sistema indikatora stepena prenosa menja\u010da da \u0107e
  smanjiti potro\u0161nju goriva, ukoliko promeni stepen prenosa.\\n\\nKada se na
  displeju pojavi ikona SHIFT UP (\u25b2SHIFT) zna\u010di da sistem indikatora stepena
  prenosa menja\u010da savetuje voza\u010du da ubaci menja\u010d u vi\u0161i stepen
  prenosa, dok ikona SHIFT DOWN (\u25bcSHIFT) zna\u010di da mu savetuje ni\u017ei
  stepen prenosa.\\n\\nOva indikacija ostaje na instrument tabli dok voza\u010d ne
  promeni stepen prenosa ili dok se uslovi u vo\u017enji ne vrate u situaciju u kojoj
  nije potrebno menjanje stepena prenosa da bi se smanjila potro\u0161nja goriva.\\n\\nKOMANDNA
  DUGMAD\\n\\nVA\u017dNO: Dugmad \u25b2 i \u25bc opisana su na slede\u0107im stranama.\\n\\nKod
  nekih verzija dugmad su \u25b2 i \u25bc.\\n\\n\u25b2\\n\\nZa skrolovanje nagore
  po ekranu i odgovaraju\u0107im opcijama ili za pove\u0107anje prikazane vrednosti.\\n\\n\u25bc\\n\\nDr\u017eite
  ga pritisnutim da se vratite na standardni ekran. Za skrolovanje nadole po prikazanom
  meniju i odgovaraju\u0107im opcijama ili za smanjenje prikazane vrednosti.\\n\\nDugmad
  \u25b2 i \u25bc aktiviraju razne funkcije zavisno od slede\u0107ih situacija:\\n\\n-
  u okviru menija omogu\u0107avaju skrolovanje nagore i nadole;\\n- tokom operacija
  pode\u0161avanja, pove\u0107avaju ili smanjuju prikazanu vrednost.\\n\\nMENI PODE\u0160AVANJA\\n\\nMeni
  obuhvata niz opcija koje se mogu birati pomo\u0107u dugmadi i za pristup mogu\u0107em
  izboru i operacijama pode\u0161avanja (Setup), kako je navedeno u daljem tekstu.
  Neke opcije imaju podmeni.\\n\\nMeni se mo\u017ee aktivirati kratkim pritiskanjem
  dugmeta SET.\\n\\nMeni sadr\u017ei slede\u0107e opcije:\\n\\n- MENI\\n- OSVETLJENJE\\n-
  PODE\u0160AVANJE POLO\u017dAJA FAROVA\\n  (za verzije/tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\n- ZUJALICA ZA BRZINU\\n- SENZOR FAROVA\\n  (za verzije tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n- SVETLA ZA KRIVINE\\n  (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n- SENZOR ZA KI\u0160U\\n  (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n- AKTIVIRANJE / PODACI VO\u017dNJE B\\n- PODE\u0160ENO
  VREME\\n- PODE\u0160EN DATUM\\n- AUTOCLOSE (automatsko zaklju\u010davanje vrata)\\n-
  JEDINICA MERENJA\\n- JEZIK\\n- JA\u010cINA ZVUKA UPOZORENJA\\n- ZUJALICA ZA SIGURNOSNI
  POJAS\\n- SERVISIRANJE\\n- VAZDU\u0160NI JASTUK/\\n  VAZDU\u0160NI JASTUK SUVOZA\u010cA\\n  (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n- DNEVNA SVETLA\\n  (za
  verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n- SISTEM KO\u010cENJA U
  GRADSKOJ VO\u017dNJI SISTEM\\n  ZA UBLA\u017dAVANJE SUDARA\\n  (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n- izlaz iz menija (EXIT MENU)\\n  (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nIzbor opcije iz glavnog menija bez podmenija:\\n\\n-
  kratko pritisnite dugme SET za izbor opcije iz glavnog menija koju treba pode\u0161iti;\\n-
  pritisnite dugmad \u25b2 ili \u25bc (pojedina\u010dno pritiskanje) za izbor novog
  pode\u0161avanja;\\n- kratko pritisnite dugme SET za memorisanje novog pode\u0161avanja
  i za vra\u0107anje na istu prethodno izabranu opciju glavnog menija.\\n\\nIzbor
  opcije iz glavnog menija sa podmenijem:\\n\\n- kratko pritisnite dugme SET za prikaz
  opcije prvog podmenija;\\n- pritisnite dugmad \u25b2 ili \u25bc (pojedina\u010dno
  pritiskanje) kako biste skrolovali po svim opcijama podmenija;\\n- kratko pritisnite
  dugme SET za izbor prikazane opcije podmenija i za otvaranje odgovaraju\u0107eg
  menija pode\u0161avanja;\\n- pritisnite dugmad \u25b2 ili \u25bc (pojedina\u010dno
  pritiskanje) za izbor novog pode\u0161avanja za ovu opciju iz podmenija;\\n- kratko
  pritisnite dugme SET za memorisanje novog pode\u0161avanja i istovremeno za vra\u0107anje
  na prethodno izabranu opciju menija.\\n\\nSTAVKE MENIJA\\n\\nVA\u017dNO: Kod Uconnect
  sistema (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno) neke stavke menija
  se prikazuju na displeju ovog sistema umesto na displeju instrument table.\\n\\nMENI\\n\\nOva
  opcija vam omogu\u0107ava pristup meniju pode\u0161avanja. Pritisnite dugme \u25b2
  ili \u25bc za izbor raznih stavki menija. Dr\u017eite pritisnuto dugme SET za vra\u0107anje
  na standardni ekran.\\n\\nOSVETLJENJE (Pode\u0161avanje unutra\u0161njeg svetla)
  (samo sa upaljenim pozicionim svetlima)\\n\\nSa upaljenim pozicionim svetlima, ova
  funkcija se koristi za pode\u0161avanje ja\u010dine svetla instrument table, komandi
  Uconnect sistema (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno) i komande
  automatskog kontrolnog sistema klimatizacije (za verzije/tr\u017ei\u0161ta za koje
  je predvi\u0111eno) na 8 nivoa. Postupite kao \u0161to sledi da podesite ja\u010dinu
  svetlosti:\\n\\n- kratko pritisnite dugme SET. Prethodno pode\u0161eni nivo trepti
  na displeju;\\n- pritiskajte dugme \u25b2 ili \u25bc da podesite potreban nivo ja\u010dine
  svetlosti;\\n- kratko pritisnite dugme SET za vra\u0107anje na ekran menija ili
  dr\u017eite pritisnuto dugme za vra\u0107anje na standardni ekran bez \u010duvanja
  trenutnog pode\u0161avanja.\\n\\nVA\u017dNO: Kod verzija sa rekonfigurabilnim multifunkcionalnim
  displejem, pode\u0161avanje je mogu\u0107e i sa uga\u0161enim svetlima (nivo ja\u010dine
  svetla za dnevni na\u010din rada) i sa upaljenim svetlima (nivo ja\u010dine svetla
  za no\u0107ni na\u010din rada).\\n\\n**PODE\u0160AVANJE POLO\u017dAJA FAROVA**\\n(Korektor
  polo\u017eaja farova i pode\u0161avanje polo\u017eaja)\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva funkcija omogu\u0107ava korekciju i pode\u0161avanje
  polo\u017eaja (na 4 nivoa).\\nZa izvr\u0161enje ovog pode\u0161avanja, postupite
  kao \u0161to sli\u010di:\\n- kratko pritisnite dugme SET. Na displeju \u0107e treptati
  prethodno pode\u0161eni nivo;\\n- pritisnite dugme \u25b2 ili \u25bc za pode\u0161avanje
  polo\u017eaja;\\n- kratko pritisnite dugme SET za vra\u0107anje na ekran menija
  ili dr\u017eite dugme pritisnuto za vra\u0107anje na standardni ekran bez \u010duvanja
  trenutnih vrednosti.\\n\\n**Zujalica za brzinu (ograni\u010denje brzine)**\\n\\nOva
  funkcija se koristi za pode\u0161avanje ograni\u010denja brzine vozila (km/h ili
  mph); voza\u010d se odmah upozorava kada se ova granica prekora\u010di.\\nZa pode\u0161avanje
  \u017eeljenog ograni\u010denja brzine, postupite kao \u0161to sli\u010di:\\n- kratko
  pritisnite dugme SET: displej \u0107e pokazati natpis \\\"Speed Beep\\\" (zujalica
  za brzinu);\\n- pritisnite dugme \u25b2 ili \u25bc za izbor aktiviranja (On) ili
  deaktiviranja (Off) ograni\u010denja brzine;\\n- ukoliko je ova funkcija uklju\u010dena,
  pritisnite za izbor \u017eeljenog ograni\u010denja brzine, a zatim pritisnite dugme
  SET da potvrdite.\\n\\n**VA\u017dNO:** Pode\u0161avanje je mogu\u0107e izme\u0111u
  30 i 200 km/h, ili 20 i 125 mph, zavisno od prethodno pode\u0161ene jedinice merenja.
  Pogledajte ni\u017ee opisani deo \\\"Pode\u0161avanje jedinice merenja\\\". Ovim
  pode\u0161avanjem se pove\u0107ava / smanjuje brzina za po 5 jedinica, svakim pritiskom
  dugmeta \u25b2/\u25bc. Dr\u017eite pritisnuto dugme \u25b2/\u25bc za automatsko
  brzo pove\u0107avanje/smanjivanje. Zavr\u0161ite pode\u0161avanje kratkim pritiscima
  kako se budete pribli\u017eavali \u017eeljenoj vrednosti.\\n\\n- kratko pritisnite
  dugme SET da se vratite na ekran menija ili dr\u017eite dugme pritisnuto, da se
  vratite na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\nZa poni\u0161tavanje
  pode\u0161ene vrednosti, postupite na slede\u0107i na\u010din sli\u010di:\\n- kratko
  pritisnite dugme SET: Na displeju \u0107e treptati \\\"On\\\";\\n- pritisnite dugme
  \u25bc: Na displeju \u0107e treptati \\\"Off\\\";\\n- kratko pritisnite dugme SET
  da se vratite na ekran menija ili dugo pritisnite dugme da se vratite na standardni
  ekran, bez \u010duvanja trenutnih vrednosti:\\n\\n**SENZOR FAROVA**\\n(Automatski
  rad farova /pode\u0161avanje osetljivosti senzora za sumrak)\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva funkcija se koristi za paljenje ili ga\u0161enje
  farova zavisno od uslova spolja\u0161nje svetlosti.\\nOsetljivost senzora za sumrak
  mo\u017ee se podesiti na 3 nivoa (nivo 1 = minimalna osetljivost, nivo 2 = srednja
  osetljivost, nivo 3 = maksimalna osetljivost); \u0161to je ve\u0107a osetljivost,
  to je potrebna manja promena svetlosti.\\n\\nza paljenje farova (npr. kada je ovaj
  senzor pode\u0161en na nivo 3, svetla \u0107e se upaliti ranije prilikom zalaska
  sunca nego kada je on pode\u0161en na 1 i 2).\\nZa pode\u0161avanje, postupite kao
  \u0161to sli\u010di:\\n\\n- kratko pritisnite dugme SET. Prethodno pode\u0161eni
  nivo trepti na displeju;\\n- za pode\u0161avanje pritisnite dugme \u25b2 ili \u25bc;\\n-
  kratko pritisnite dugme SET da se vratite na ekran menija ili dr\u017eite dugme
  pritisnuto da se vratite na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\n**Svetla
  za skretanje**\\n(Aktiviranje/deaktiviranje svetla za skretanje)\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva funkcija aktivira/deaktivira (\\\"On\\\"/\\\"Off\\\")
  svetla za skretanje (videti opis u delu \\\"Spolja\u0161nja svetla\\\").\\n\\n-
  kratko pritisnite dugme SET. \\\"On\\\" ili \\\"Off\\\" \u0107e treptati na displeju,
  zavisno od prethodnog pode\u0161avanja;\\n- da napravite izbor, pritisnite \u25b2
  ili \u25bc;\\n- kratko pritisnite dugme SET da se vratite na ekran menija ili dr\u017eite
  dugme pritisnuto da se vratite na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\n**Senzor
  za ki\u0161u**\\n(Pode\u0161avanje osetljivosti senzora za ki\u0161u)\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva funkcija vam omogu\u0107ava da podesite osetljivost
  senzora za ki\u0161u na 4 nivoa.\\n\\nZa pode\u0161avanje \u017eeljenog nivoa osetljivosti,
  postupite kao \u0161to sli\u010di:\\n\\n- kratko pritisnite dugme SET. Prethodno
  pode\u0161eni nivo osetljivosti trepti na displeju;\\n- pritisnite dugme \u25b2
  ili \u25bc da uradite pode\u0161avanje;\\n- kratko pritisnite dugme SET da se vratite
  na ekran menija ili dr\u017eite dugme pritisnuto da se vratite na standardni ekran
  bez \u010duvanja trenutnih vrednosti.\\n\\n**Aktiviranje /Podaci vo\u017enje B**\\n(Aktiviranje
  vo\u017enje B)\\n\\nOvom funkcijom mogu\u0107e je aktiviranje (\\\"On\\\") ili deaktiviranje
  (\\\"Off\\\") displeja vo\u017enje B (deo vo\u017enje). Za vi\u0161e podataka pogledati
  deo \\\"Putni kompjuter\\\".\\n\\nZa aktiviranje/deaktiviranje postupite kao \u0161to\\n\\n-
  kratko pritisnite dugme SET kako bi displej treptao sa On ili Off, zavisno od prethodnog
  pode\u0161avanja;\\n- pritisnite dugme \u25b2 ili \u25bc kako biste izvr\u0161ili
  pode\u0161avanje;\\n- kratko pritisnite dugme SET da se vratite na ekran menija
  ili dugo pritiska\u0107te dugme da se vratite na standardni ekran bez \u010duvanja
  trenutnih vrednosti.\\n\\nPode\u0161avanje vremena (pode\u0161avanje sata)\\n\\nOva
  funkcija omogu\u0107ava pode\u0161avanje sata pomo\u0107u dva podmenija: \\\"Vreme\\\"
  i \\\"Format\\\".\\nZa izvr\u0161avanje ovog pode\u0161avanja, postupite kao \u0161to
  sledi:\\n\\n- kratko pritisnite dugme SET. Displej \u0107e pokazati dva podmenija
  \\\"Vreme\\\" i \\\"Format\\\";\\n- pritisnite dugme \u25b2 ili \u25bc za prelazak
  iz jednog u drugi podmeni;\\n- po\u0161to izaberete podmeni koji treba promeniti,
  pritisnite kratko dugme SET;\\n- ukoliko se izabere podmeni \\\"Vreme\\\" i kratko
  se pritisne dugme, na displeju \u0107e treptati \\\"hours\\\" (sati). Pritisnite
  dugme \u25b2 ili \u25bc da izvr\u0161ite pode\u0161avanje;\\n- ponovnim kratkim
  pritiskanjem dugmeta SET na displeju \u0107e treptati \\\"minutes\\\". Pritisnite
  dugme \u25b2 ili \u25bc da izvr\u0161ite pode\u0161avanje;\\n- ukoliko je izabran
  podmeni \\\"Format\\\" i kratko se pritisne dugme SET, na displeju \u0107e treptati
  na\u010din rada displeja. Pritisnite dugme \u25b2 ili \u25bc da iza-\\nberete da
  li \u017eelite na\u010din rada sa \\\"12h\\\" ili \\\"24h\\\". Po\u0161to izvr\u0161ite
  potrebna pode\u0161avanja, kratko pritisnite dugme SET kako biste se vratili na
  ekran podmenija ili dr\u017eite dugme pritisnuto kako biste se vra-\\ntili na ekran
  glavnog menija bez sa\u010duvanja novih pode\u0161avanja.\\n\\nPonovo pritiskajte
  dugme SET kako biste se vratili na standardni ekran ili glavni meni zavisno od stavki
  menija u kojima se nalazite.\\n\\nVA\u017dNO: Pode\u0161ene vrednosti \u0107e se
  pove\u0107avati ili smanjivati za po jednu jedinicu, svakim pritiskom dugmeta ili
  \u25b2 ili \u25bc. Dr\u017eanjem dugmeta pritisnutim dolazi do automatskog brzog
  pove\u0107avanja / smanjivanja. Zavr\u0161ite pode\u0161avanje kratkim pritiskanjem
  dugmeta kada se pribli\u017eite \u017eeljenoj vrednosti.\\n\\nPode\u0161en datum
  (Pode\u0161avanje datuma)\\n\\nKori\u0161\u0107enjem ove funkcije mogu\u0107e je
  a\u017eurirati datum (godina \u2013 mesec \u2013 dan).\\nZa izvr\u0161enje pode\u0161avanja,
  postupite kao \u0161to sledi:\\n\\n- kratko pritisnite dugme SET. Na displeju \u0107e
  treptati \\\"year\\\" (godina);\\n- pritisnite dugme \u25b2 ili \u25bc da izvr\u0161ite
  pode\u0161avanje;\\n- kratko pritisnite dugme SET. Na displeju \u0107e treptati
  \\\"month\\\" (mesec);\\n- pritisnite dugme \u25b2 ili \u25bc da izvr\u0161ite pode\u0161avanje;\\n-
  kratko pritisnite dugme SET. Na displeju \u0107e treptati \\\"day\\\" (dan);\\n-
  pritisnite dugme \u25b2 ili \u25bc da izvr\u0161ite pode\u0161avanje;\\n- kratko
  pritisnite dugme SET da biste se vratili na ekran menija ili dugo pritiskajte dugme
  da se vratite na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\nVA\u017dNO:
  Pode\u0161ene vrednosti \u0107e se pove\u0107avati ili smanjivati za po jednu jedinicu,
  svakim pritiskom dugmeta \u25b2 ili \u25bc. Dr\u017eanjem dugmeta pritisnutim dolazi
  do automatskog brzog pove\u0107avanja / smanjivanja. Zavr\u0161ite pode\u0161avanje
  kratkim pritiskanjem dugmeta kada se pribli\u017eite potrebnoj vrednosti.\\n\\n**AUTOCLOSE**\\n*(automatsko
  zaklju\u010davanje vrata kada je vozilo u pokretu)*\\n\\nUkoliko je ova funkcija
  uklju\u010dena (On), ona \u0107e automatski zaklju\u010dati vrata kada brzina vozila
  predje preko 20 km/h.\\n\\nPostupite kao \u0161to slije\u0111e da aktivirate ili
  deaktivirate ovu funkciju:\\n\\n- Kratko pritisnite dugme SET. Na ekranu \u0107e
  treptati \\\"On\\\" (uklju\u010dena) ili \\\"Off\\\" (isklju\u010dena), zavisno
  od prethodnog pode\u0161avanja;\\n- Pritisnite \u25b2 ili \u25bc da izvr\u0161ite
  izbor;\\n- Kratko pritisnite dugme SET da se vratite na ekran podmenija ili dr\u017eite
  dugme pritisnuto da se vratite na ekran glavnog menija bez \u010duvanja trenutnih
  vrednosti;\\n- Ponovo dr\u017eite dugme SET pritisnuto kako biste se vratili na
  standardni ekran ili glavni meni, zavisno od stavki menija u kojima se nalazite.\\n\\n**Jedinica
  merenja**\\n*(Pode\u0161avanje jedinice merenja)*\\n\\nOvom funkcijom je mogu\u0107e
  podesiti jedinice pomo\u0107u tri podmenija: \\\"Distances\\\" (rastojanja), \\\"Consumption\\\"
  (potro\u0161nja) i \\\"Temperature\\\".\\n\\nZa pode\u0161avanje \u017eeljene jedinice
  merenja, postupite kao \u0161to slije\u0111e:\\n\\n- Kratko pritisnite dugme SET.
  Displej \u0107e prikazati tri podmenija;\\n- Pritisnite dugme \u25b2 ili \u25bc
  za skrolovanje po ova tri podmenija;\\n- Po \u0161to izaberete podmeni koji treba
  menjati, kratko pritisnite dugme SET;\\n- Ukoliko ste izabrali podmeni \\\"Distances\\\"
  (rastojanja) i kratko pritisnete dugme SET, displej \u0107e pokazati \\\"km\\\"
  ili \\\"mi\\\", zavisno od prethodnog pode\u0161avanja;\\n- Pritisnite \u25b2 ili
  \u25bc da napravite izbor;\\n- Ukoliko ste izabrali podmeni \\\"Consumption\\\"
  (potro\u0161nja) i kratko pritisnete dugme SET, displej \u0107e pokazati \\\"km/l\\\",
  \\\"l/100 km\\\" ili \\\"mpg\\\" zavisno od prethodnog pode\u0161avanja. Ako je
  za merenje rastojanja pode\u0161ena jedinica \\\"km\\\", displej \u0107e omogu\u0107iti
  pode\u0161avanje jedinica za merenje potro\u0161nje (\\\"km/l\\\" ili \\\"l/100km\\\").
  Ukoliko je \\\"mi\\\" pode\u0161ena kao jedinica za merenje rastojanja, displej
  \u0107e prikazati potro\u0161nju u \\\"mpg\\\".\\n- Pritisnite \u25b2 ili \u25bc
  da izvr\u0161ite izbor;\\n- Ukoliko ste izabrali podmeni \\\"Temperature\\\", i
  kratko pritisnete dugme SET, displej \u0107e pokazati \u00b0C ili \u00b0F, zavisno
  od prethodnog pode\u0161avanja;\\n- Pritisnite \u25b2 ili \u25bc da izvr\u0161ite
  izbor;\\n- Po \u0161to ste izvr\u0161ili potrebna pode\u0161avanja, kratko pritisnite
  dugme SET kako biste se vratili na ekran podmenija ili dr\u017eite dugme pritisnuto
  da se vratite na ekran glavnog menija bez \u010duvanja trenutnih vrednosti.\\n\\nPonovo
  pritisnite dugme SET kako biste se vratili na standardni ekran ili na glavni meni,
  zavisno od stavki menija u kojima se nalazite.\\n\\n**Jezik (Izbor jezika)**\\n\\nMogu\u0107e
  je pode\u0161iti prikazivanje poruka na raznim jezicima: italijanski, nema\u010dki,
  engleski, \u0161panski, francuski, portugalski, poljski, holandski, turski (lista
  varira zavisno od tr\u017ei\u0161ta).\\n\\nZa pode\u0161avanje \u017eeljenog jezika,
  postupite kao \u0161to sli\u0111e:\\n\\n- kratko pritisnite dugme SET. Prethodno
  pode\u0161eni jezik \u0107e treptati na displeju;\\n- pritisnite \u25b2 ili \u25bc
  kako biste izvr\u0161ili izbor;\\n- kratko pritisnite dugme SET kako biste se vratili
  na ekran menija ili dr\u017eite dugme pritisnuto za vra\u0107anje na standardni
  ekran bez \u010duvanja trenutnih vrednosti.\\n\\n**Ja\u010dina zvuka upozorenja**\\n\\n(Pode\u0161avanje
  ja\u010dine akusti\u010dnog signala upozorenja)\\n\\nOvom funkcijom mo\u017ee se
  podesiti na 8 nivoa ja\u010dine zvuka zualice koja prati prikaz nekog defekta/upozorenja.\\n\\nZa
  pode\u0161avanje \u017eeljene ja\u010dine zvuka, postupite kao \u0161to sli\u0111e:\\n\\n-
  kratko pritisnite dugme SET. Na displeju \u0107e treptati prethodno pode\u0161eni
  nivo;\\n- pritisnite dugme \u25b2 ili \u25bc kako biste izvr\u0161ili izbor;\\n-
  kratko pritisnite dugme SET da se vratite na ekran menija ili dr\u017eite dugme
  pritisnuto da se vratite na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\n**Zualica
  za sigurnosni pojas**\\n\\n(ponovno aktiviranje podsetnika za vezivanje sigurnosnog
  pojasa)\\n\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOva
  funkcija se mo\u017ee prikazati samo po \u0161to Fiatov diler deaktivira sistem
  podsetnika za vezivanje sigurnosnog pojasa (videti deo \\\"Sistem podsetnika za
  vezivanje sigurnosnog pojasa\\\" u poglavlju \\\"Bezbednost\\\").\\n\\n**Servisiranje
  (Planirano servisiranje)**\\n\\nSa ovom funkcijom je mogu\u0107e videti informaciju
  o kilometra\u017ei ili vremenskim intervalima koji odre\u0111uju potrebu za servisiranjem.\\n\\nSa
  funkcijom za servisiranje tako\u0111e je mogu\u0107e videti interval (u kilometrima
  ili miljama) do slede\u0107e zamene ulja.\\n\\nZa dobijanje ove informacije na displeju,
  postupite kao \u0161to sli\u0111e:\\n\\n- kratko pritisnite dugme SET. Displej pokazuje
  servisni interval u kilometrima (km) ili miljama (mi) zavisno od prethodnog pode\u0161avanja
  (videti deo \\\"Jedinice merenja\\\");\\n- kratko pritisnite dugme SET da se vratite
  na ekran menija ili dr\u017eite dugme pritisnuto da se vratite na standardni ekran.\\n\\nVA\u017dNO:
  Planirano servisiranje zahteva da se vozilo servisira svakih 20.000 km (ili 12.000
  milja). Ova poruka se prikazuje automatski \u2013 kada se klju\u010d okrene na MAR-ON
  \u2013 2.000 km (ili ekvivalentne vrednosti u miljama) pre ovih rokova i ponovo
  se javlja svakih 200 km (ili ekvivalentne vrednosti u miljama). Servisne indikacije
  su u\u010destalije kada preostane manje od 200 km. Displej \u0107e biti u km ili
  mi zavisno od pode\u0161enih jedinica merenja. Kada se pribli\u017eava slede\u0107i
  planirani rok, na displeju \u0107e se pojaviti re\u010d \\\"Service\\\", pra\u0107ena
  brojem preostalih kilometara ili milja, kada se klju\u010d okrene na MAR-ON. Obratite
  se Fiatovom dileru. On \u0107e uraditi sve operacije koje sadr\u017ei plan servisiranja
  i relevantna poruka \u0107e biti resetovana.\\n\\nVazdu\u0161ni jastuk / vazdu\u0161ni
  jastuk suvoza\u010da\\n(Aktiviranje/deaktiviranje prednjeg vazdu\u0161nog jastuka
  suvoza\u010da i bo\u010dnog vazdu\u0161nog jastuka za za\u0161titu grudnog ko\u0161a
  / karlice \u2013 za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOva
  funkcija omogu\u0107ava aktiviranje / deaktiviranje vazdu\u0161nog jastuka suvoza\u010da.
  Postupite kao \u0161to slijedi:\\n\\n- pritisnite dugme SET i, po\u0161to se pritiskanjem
  dugmadi \u25b2 ili \u25bc prika\u017ee poruka \\\"Bag pass: Off\\\" (za deaktiviranje)
  ili \\\"Bag pass: On\\\" (za aktiviranje), pritisnite ponovo dugme SET;\\n- na displeju
  \u0107e se pojaviti poruka kojom se tra\u017ei potvrda;\\n- pritiskanjem dugmadi
  \u25b2 ili \u25bc izaberite \\\"Yes\\\" (da potrdite aktiviranje / deaktiviranje)
  ili \\\"No\\\" (da ga poni\u0161tite);\\n- kratko pritisnite dugme SET; poruka koja
  potvr\u0111uje izbor bi\u0107e prikazana na displeju, a vi \u0107ete se vratiti
  na ekran menija; dr\u017eite dugme pritisnuto da se vratite na standardni ekran
  bez \u010duvanja trenutnih vrednosti.\\n\\nDnevna svetla (DRL)\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva funkcija se mo\u017ee koristiti za aktiviranje
  / deaktiviranje dnevnog svetla. Postupite kao \u0161to slijedi da aktivirate ili
  deaktivirate ovu funkciju:\\n\\n- kratko pritisnite dugme SET. Displej \u0107e pokazati
  podmeni;\\n- kratko pritisnite dugme SET. Na displeju \u0107e treptati \\\"On\\\"
  ili \\\"Off\\\", zavisno od prethodnog pode\u0161avanja;\\n- pritisnite \u25b2 ili
  \u25bc kako biste napravili izbor;\\n- kratko pritisnite dugme SET da se vratite
  na ekran podmenija ili dr\u017eite dugme pritisnuto kako biste se vratili na ekran
  glavnog menija bez \u010duvanja trenutnih vrednosti;\\n- ponovo dr\u017eite pritisnuto
  dugme SET da se vratite na standardni ekran ili na glavni meni zavisno od stavki
  menija u kojima se nalazite.\\n\\nSistem za ko\u010denje u gradskoj vo\u017enji
  / sistem za ubla\u017eavanje sudara\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOva
  funkcija omogu\u0107ava aktiviranje (\\\"On\\\") ili deaktiviranje (\\\"Off\\\")
  sistema ko\u010denja u gradskoj vo\u017enji \u2013 sistema za ubla\u017eavanje sudara.\\n\\nZa
  pode\u0161avanje postupite kao \u0161to slije:\\n\\n- kratko pritisnite dugme SET.
  Na displeju \u0107e treptati \\\"On\\\" ili \\\"Off\\\", zavisno od prethodnog pode\u0161avanja;\\n-
  na displeju \u0107e se pojaviti poruka kojom se tra\u017ei potvrda;\\n- pritiskanjem
  dugmadi \u25b2 ili \u25bc izaberite \\\"Yes\\\" (za potvrdu aktiviranja/deaktiviranja)
  ili \\\"No\\\" (za poni\u0161tavanje);\\n- kratko pritisnite dugme SET; displej
  \u0107e pokazati poruku koja potvr\u0111uje izbor i vi \u0107ete se vratiti na ekran
  menija; dr\u017eite dugme pritisnuto kako biste se vratili na standardni ekran bez
  \u010duvanja trenutnih vrednosti.\\n\\nIZLAZ IZ MENIJA\\n\\nPoslednja funkcija za
  zatvaranje ciklusa pode\u0161avanja navednih na ekranu menija.\\n\\nKratko pritiskanje
  dugmeta SET vra\u0107a displej na standardni ekran bez \u010duvanja trenutnih vrednosti.\\n\\nPritisnite
  dugme \u25bc da se vratite na prvu opciju menija (Osvetljenje).\\n\\nPUTNI KOMPUTER\\n\\nOP\u0160TI
  PODACI\\n\\nPutni komputer se koristi za prikaz informacija o radu vozila kada je
  klju\u010d okrenut na MAR-ON.\\n\\nOva funkcija vam omogu\u0107ava da defini\u0161ete
  dve odvojene vo\u017enje koje se identifikuju kao \\\"Trip A\\\" i \\\"Trip B\\\",
  pri \u010demu se \\\"kompletne vo\u017enje\\\" prate na recipro\u010dno nezavisan
  na\u010din.\\n\\nObe vo\u017enje se mogu resetovati (resetovanje \u2014 startovanje
  nove vo\u017enje).\\n\\n\\\"Trip A\\\" se koristi da prika\u017ee podatke koji se
  odnose na:\\n\\n- spolja\u0161nju temperaturu (za verzije/tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\n- domet\\n- pre\u0111eno rastojanje A\\n- prose\u010dna potro\u0161nja
  A\\n- trenutna potro\u0161nja\\n- prose\u010dna brzina A\\n- vreme vo\u017enje A\\n\\n\\\"Trip
  B\\\" mo\u017ee da se koristi za prikaz podataka koji se odnose na:\\n\\n- pre\u0111eno
  rastojanje B\\n- prose\u010dna potro\u0161nja B\\n- prose\u010dna brzina B\\n- vreme
  vo\u017enje B\\n\\nVA\u017dNO: \\\"Trip B\\\" je mogu\u0107e deaktivirati (videti
  deo \\\"Trip B \u2013 aktiviranje\\\"). Nije mogu\u0107e resetovati parametre \\\"Domet\\\"
  i \\\"Trenutna potro\u0161nja goriva\\\".\\n\\n**PRIKAZANE VREDNOSTI**\\n\\n**Spolja\u0161nja
  temperatura**\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nPokazuje
  temperaturu izvan putni\u010dke kabine.\\n\\n**Domet**\\nOvo pokazuje pribli\u017eno
  rastojanje koje se mo\u017ee pre\u0107i sa koli\u010dinom goriva koja je trenutno
  u rezervoaru. Na displeju \u0107e se pojaviti \u201c- - - -\u201d u slede\u0107im
  slu\u010dajevima:\\n\\n- domet je ispod 50 km (ili 30 mi)\\n- vozilo je du\u017ee
  vreme parkirano sa upaljenim motorom\\n\\nVA\u017dNO: Nekoliko faktora mo\u017ee
  da uti\u010de na menjanje vrednosti dometa: stil vo\u017enje, vrsta puta (autoput,
  gradski, planinski putevi itd.), uslovi kori\u0161\u0107enja (optere\u0107enje,
  pritisak u pneumaticima itd.). Stoga prethodno navedeno treba uzeti u obzir prilikom
  planiranja vo\u017enje.\\n\\n**Pre\u0111eno rastojanje**\\nPokazuje pre\u0111eno
  rastojanje od po\u010detka nove vo\u017enje.\\n\\n**Prose\u010dna potro\u0161nja**\\nPokazuje
  okvirnu prose\u010dnu potro\u0161nju goriva od po\u010detka nove vo\u017enje.\\n\\n**Trenutna
  potro\u0161nja**\\nOva vrednost pokazuje potro\u0161nju goriva. Ova vrednost se
  stalno a\u017eurira. Displej \u0107e pokazati \u201c- - - -\u201d ukoliko je vozilo
  parkirano sa upaljenim motorom.\\n\\n**Prose\u010dna brzina**\\nPokazuje prose\u010dnu
  brzinu vozila kao funkciju ukupno proteklog vremena od po\u010detka nove vo\u017enje.\\n\\n**Vreme
  vo\u017enje**\\nPokazuje proteklo vreme od po\u010detka nove vo\u017enje.\\n\\nVA\u017dNO:
  Ukoliko nema nikakvih podataka, putni kompjuter \u0107e umesto vrednosti pokazati
  \u201c- - - -\u201d. Kada se ponovo uspostave normalni uslovi rada, ponovo \u0107e
  po\u010deti redovno ra\u010dunanje raznih vrednosti. Nijedna od prikazanih vrednosti
  pre defekta ne\u0107e biti resetovana niti \u0107e po\u010deti novo merenje.\\n\\nPRIKAZANE
  INFORMACIJE\\n\\nNi\u017ee prikazani displeji dati su kao primer: za vi\u0161e podataka
  pogledajte deo \\\"Displej\\\" u ovom poglavlju. Svaki put kada se prika\u017ee
  neka vrednost, prikazuju se slede\u0107e informacije sl. 11:\\n\\n- A - animirana
  ikona u gornjem delu;\\n- B \u2013 naziv, vrednost i jedinica merenja izabranog
  parametra (npr. \\\"Domet 150 km\\\");\\n- C \u2013 re\u010d \\\"Trip\\\" (ili \\\"Trip
  A\\\" ili \\\"Trip B\\\").\\n\\nPosle nekoliko sekundi naziv i vrednost izabranog
  parametra zamenjuje ikona sl. 12.\\n\\nIkone koje se odnose na razne parametre su
  kao \u0161to sledi:\\n\\n- \\\"Domet\\\"\\n- \\\"Prose\u010dna potro\u0161nja A\\\"
  (ako je aktivan Trip A, ili \\\"B\\\" ako je aktivan Trip B);\\n- \\\"Rastojanje\\\"
  (ako je aktivan Trip A, ili \\\"B\\\" ako je aktivan Trip B);\\n- \\\"Trenutna potro\u0161nja\\\"\\n-
  \\\"Prose\u010dna brzina A\\\" (ako je aktivan Trip A, ili \\\"B\\\" ako je aktivan
  Trip B);\\n- \\\"Vreme vo\u017enje\\\" (ako je aktivan Trip A, ili \\\"B\\\" ako
  je aktivan Trip B);\\n\\nDUGME TRIP\\n\\nNalazi se na desnoj ru\u010dici sl. 13.
  Kada je klju\u010d za paljenje okrenut na MAR, ovo dugme vam omogu\u0107ava da vidite
  prethodno opisane parametre i tako\u0111e da ih resetujete za po\u010detak novog
  merenja:\\n\\n- kratko pritiskanje: prikazuje razne vrednosti;\\n- dugo pritiskanje:
  resetovanje prikazanih vrednosti i po\u010detak novog merenja.\\n\\nNovo merenje\\n\\nPo\u010dinje
  posle resetovanja:\\n\\n- \\\"ru\u010dno\\\" resetovanje korisnika, pritiskanjem
  odgovaraju\u0107eg dugmeta;\\n- \\\"automatsko\\\" resetovanje, kada \\\"Trip distance\\\"
  (pre\u0111eno rastojanje) dostigne 99999.9 km ili kada \\\"Travel time\\\" (vreme
  vo\u017enje) dostigne 999:59 (999 sati i 59 minuta);\\n- posle isklju\u010denja/ponovnog
  priklju\u010denja akumulatora.\\n\\nVA\u017dNO: Postupkom resetovanja u toku prikazivanja
  podataka za \\\"Trip A\\\" ili \\\"Trip B\\\" resetuju se informacije koje se odnose
  na prikazanu funkciju.\\n\\nProcedura po\u010detka vo\u017enje\\n\\nKada je klju\u010d
  za paljenje u poziciji MAR, pritisnite i dr\u017eite dugme TRIP du\u017ee od 2 sekunde
  da biste uradili resetovanje.\\n\\nIzlaz iz funkcije TRIP\\n\\nAutomatski mo\u017eete
  iza\u0107i iz funkcije TRIP po\u0161to sve vrednosti budu prikazane ili dr\u017eanjem
  pritisnutog dugmeta SET du\u017ee od 1 sekunde.\\n\\nSIMBOLI\\n\\nSpecijalne oznake
  u boji stavljene su blizu ili na neke od komponenata vozila. Ove oznake nose simbole
  koji vas podse\u0107aju na mere predostro\u017enosti koje treba preduzeti vezano
  za odre\u0111ene komponente.\\n\\nIspod haube se tako\u0111e nalazi \u0161ema koja
  re\u017eimira sve simbole.\\n\\nFIATOV SISTEM KODIRANJA\\n\\nU cilju za\u0161tite
  od kra\u0111e va\u0161e vozilo je opremljeno sa sistemom za blokadu motora. On se
  automatski aktivira kada se izvadi klju\u010d za paljenje.\\n\\nSvaki klju\u010d
  ima elektronski ure\u0111aj koji mo\u017ee da identifikuje emitovani signal, kada
  se motor startuje, iz antene koja je ugra\u0111ena u prekida\u010du paljenja. Ovaj
  signal predstavlja \\\"password\\\" (lozinku) i menja se svaki put kada se startuje
  vozilo, a kontrolna jedinica preko njega prepoznaje klju\u010d i omogu\u0107ava
  startovanje.\\n\\nRAD\\n\\nSvaki put kada se vozilo startuje okretanjem klju\u010da
  za paljenje u MAR-ON, kontrolna jedinica Fiatovog sistema kodiranja \u0161alje \u0161ifru
  potvrde kontrolnoj jedinici motora da deaktivira blokadu. Ova \u0161ifra se \u0161alje
  samo ako kontrolna jedinica Fiatovog sistema kodiranja potvrdi \u0161ifru primljenu
  od klju\u010da.\\n\\nSvaki put kada se klju\u010d za paljenje okre\u0107e na STOP,
  Fiatov sistem kodiranja deaktivira funkcije kontrolne jedinice za upravljanje motorom.\\n\\nUkoliko
  k\u00f4d ne bude pravilno prepoznat tokom startovanja, na instrument tabli \u0107e
  se upaliti lampica upozorenja.\\n\\nU ovom slu\u010daju, okrenite klju\u010d u polo\u017eaj
  STOP, a zatim ponovo na MAR-ON; ukoliko je motor i dalje blokiran, poku\u0161ajte
  ponovo sa ostalim klju\u010devima koje ste dobili uz vozilo. Ukoliko i dalje ne
  mo\u017eete da startujete motor, obratite se Fiatovom dileru.\\n\\n**Paljenje lampice
  upozorenja u toku vo\u017enje**\\n\\nUkoliko se upali lampica upozorenja, to zna\u010di
  da sistem sprovodi postupak samo-dijagnostike (na primer ispituje pad napona). Ukoliko
  se ova nepravilnost nastavi, obratite se Fiatovom dileru.\\n\\n**KLJU\u010cEVI**\\n\\n**KLJU\u010c
  BEZ DALJINSKE KOMANDE**\\n\\nMetalni umetak A sl. 14 omogu\u0107ava:\\n\\n- funkciju
  prekida\u010da paljenja;\\n- funkciju brave vrata.\\n\\nDa biste dobili duplikate
  klju\u010da, obratite se Fiatovom dileru. Ponesite neki identifikacioni dokument
  i dokumenta o vlasni\u0161tvu vozila.\\n\\nKLJU\u010c SA DALJINSKOM KOMANDOM\\n\\n(za
  verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nMetalni umetak klju\u010da
  A slike 15 omogu\u0107ava:\\n- funkciju prekida\u010da paljenja;\\n- funkciju brave
  vrata.\\n\\nPritisnite dugme B za otvaranje / zatvaranje metalnog umetka.\\n\\nUPAZORENJE\\n\\nDugme
  B treba pritiskati samo kada se klju\u010d nalazi dalje od tela, pogotovo o\u010diju
  i od predmeta koji bi se mogli o\u0161tetiti (npr. ode\u0107a). Nemojte ostavljati
  klju\u010d bez nadzora, kako biste izbegli slu\u010dajno pritiskanje ovog dugmeta
  npr. od strane dece.\\n\\nslika 15\\n\\nOtklju\u010davanje vrata i petih vrata\\n\\nKratko
  pritisnite dugme : za otklju\u010davanje vrata i prtlja\u017enog prostora, tempirano
  paljenje unutra\u0161njih krovnih svetala i duplo treptanje pokaziva\u010da pravca
  (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nVrata se automatski
  otklju\u010davaju ukoliko interveni\u0161e sistem za prekid napajanja gorivom.\\n\\nPo
  \u0161to zaklju\u010date vrata, ukoliko jedna ili vi\u0161e vrata ili prtlja\u017enik
  nisu pravilno zaklju\u010dani, LED lampica i pokaziva\u010di pravca po\u010dnu da
  brzo trep\u0107u.\\n\\nZaklju\u010davanje vrata i petih vrata\\n\\nKratko pritisnite
  dugme : za zaklju\u010davanje vrata i prtlja\u017enika, sa isklju\u010divanjem krovnog
  svetla i jednim treptanjem pokaziva\u010da pravca (za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno).\\n\\nUkoliko su jedna ili vi\u0161e vrata otvorena,
  vrata se ne\u0107e zaklju\u010dati. Na ovo \u0107e ukazati brzo treptanje pokaziva\u010da
  pravca (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno). Me\u0111utim,
  vrata \u0107e se zaklju\u010dati iako je prtlja\u017enik otvoren.\\n\\nKada se dostigne
  brzina ve\u0107a od 20 km/h, vrata se automatski zaklju\u010davaju ukoliko je ova
  funkcija pode\u0161ena (samo kod verzija sa multifunkcionalnim rekonfigurabilnim
  displejem).\\n\\nKada se vrata zaklju\u010daju sa spolja\u0161nje strane vozila
  (kori\u0161\u0107enjem daljinske komande), upali\u0107e se na nekoliko sekundi LED
  lampica iznad dugmeta , a onda \u0107e po\u010deti da trepti (funkcija upozorenja).
  Kada se vrata zaklju\u010daju sa unutra\u0161nje strane vozila (prikasanjem dugmeta
  ) LED lampica \u0107e ostati neprekidno upaljena.\\n\\n**Otvaranje prtlja\u017enog
  prostora**\\n\\nPritisnite dugme  za otvaranje prtlja\u017enog prostora kori\u0161\u0107enjem
  daljinske komande. Pokaziva\u010di pravca \u0107e zatreptati dva puta kako bi ukazali
  na to da je prtlja\u017enik otvoren.\\n\\n**Elektronske komponente u klju\u010du
  mogu biti o\u0161te\u0107ene ukoliko klju\u010d pretrpi jake udare. Da biste obezbedili
  punu efikasnost elektronskih ure\u0111aja u klju\u010du, nemojte ga nikad izlagati
  direktnoj sun\u010devoj svetlosti.**\\n\\n**ZAHTEV ZA DODATNIM DALJINSKIM KOMANDAMA**\\n\\nSistem
  mo\u017ee da prepozn\u00e1 do 8 daljinskih komandi. Ukoliko vam treba nova daljinska
  komanda, obratite se Fiatovom dileru, ponesite neki identifikacioni dokument i dokumenta
  o vlasni\u0161tvu vozila.\\n\\nKompjuter za vozilo (sa ugra\u0111enim sistemom za
  daljinski pristup i za\u0161titu od neovla\u0161\u0107enog pristupa vozilu) je sertifikovan
  od strane Republi\u010dke agencije za elektronske komunikacije.\\n\\nKlju\u010d
  za vrata automobila i deblokadu motora sa daljinskom komandom je sertifikovan od
  strane Republi\u010dke agencije za elektronske komunikacije.\\n\\nZAMENA BATERIJE
  U KLJU\u010cU SA DALJINSKOM KOMANDOM\\n\\nZa zamenu baterije, postupite kao \u0161to
  slije:\\n\\n- pritisnite dugme A (slika 16) i otvorite metalni umetak B;\\n- okrenite
  vijak C na kori\u0161\u0107enjem malog \u0161rafcigera;\\n- izvadite ku\u0107i\u0161te
  baterije D i zamenite bateriju E, pazeci da pravilno namestite polove;\\n- vratite
  ku\u0107i\u0161te baterije D u klju\u010d i zaklju\u010dajte ga okretanjem vijka
  C na .\\n\\nUpotrebljene baterije treba baciti, onako kako to predvi\u0111a zakon
  u specijalne kontejnere, u suprotnom odnesite ih Fiatovom dileru, koji \u0107e se
  pobrinuti za njihovo odlaganje.\\n\\nBEZBEDNO ZAKLJU\u010cAVANJE VRATA\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOvaj sigurnosni ure\u0111aj spre\u010dava rukovanje
  unutra\u0161njim ru\u010dkama vrata i dugmetom za zaklju\u010davanje / otklju\u010davanje
  vrata.\\nSamim tim spre\u010dava otvaranje vrata iz unutra\u0161njosti putni\u010dke
  kabine, \u010dime spre\u010dava poku\u0161aje provale (npr. kroz polomljen prozor).\\nPreporu\u010dujemo
  vam da aktivirate ovaj ure\u0111aj svaki put kad parkirate vozilo.\\n\\nAktiviranje
  ure\u0111aja\\n\\nUre\u0111aj se aktivira na svim vratima brzim duplim pritiskanjem
  dugmeta na klju\u010du.\\nPokaziva\u010di pravca trepnu 3 puta, a LED lampica iznad
  dugmeta sl. 17 trepti kako bi ukazala na to da je ure\u0111aj aktiviran. Ukoliko
  se jedna ili vi\u0161e vrata ne zatvore pravilno, ure\u0111aj se ne\u0107e aktivirati,
  na taj na\u010din se spre\u010dava da se neko zaglavi u putni\u010dkoj kabini po\u0161to
  u\u0111e u vozilo, a zatim zatvori vrata koja su ostala otvorena.\\n\\nDeaktiviranje
  ure\u0111aja\\n\\nOvaj ure\u0111aj se deaktivira automatski:\\n\\n- otklju\u010davaju\u0107i
  vrata (pritiskom na dugme \\\\( \\\\text{unlock} \\\\) na klju\u010du sa daljinskom
  kontrolom);\\n- okretanjem klju\u010da za paljenje u poziciju MAR.\\n\\n**UPAZORENJE**\\n\\nOtvaranje
  vrata sa unutra\u0161nje strane vozila nije mogu\u0107e, po\u0161to se aktivira
  sistem za bezbedno zaklju\u010davanje. Stoga pre nego \u0161to iza\u0111ete iz vozila,
  proverite da nije neko ostao u vozilu.\\n\\n**URE\u0110AJ ZA PALJENJE**\\n\\nKlju\u010d
  se mo\u017ee okretati u 3 razli\u010dita polo\u017eaja sl. 18:\\n\\n- **STOP**:
  uga\u0161en motor, klju\u010d se mo\u017ee izvaditi, stub upravlja\u010da je zaklju\u010dan.
  Neki elektri\u010dni ure\u0111aji (npr. zvu\u010dni sistem, centralni sistem zaklju\u010davanja
  vrata itd.) mogu da rade,\\n- **MAR**: polo\u017eaj za vo\u017enju. Aktivirani su
  svi elektri\u010dni ure\u0111aji;\\n- **AVV**: startovanje motora.\\n\\nPrekida\u010d
  paljenja ima ugra\u0111en jedan bezbednosni sistem koji zahteva da se klju\u010d
  za paljenje v\u0440\u0430\u0442\u0438 \u043d\u0430 STOP, ako motor ne startuje,
  pre ponavljanja postupka.\\n\\n**UPAZORENJE**\\n\\nUkoliko je neko dirao ure\u0111aj
  za paljenje (npr. prilikom poku\u0161aja kra\u0111e), obratite se Fiatovom dileru
  da ga pregleda, pre nego \u0161to ponovo krenete da vozite.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nIzvadite
  uvek klju\u010d kada napu\u0161tate vozilo, kako biste spre\u010dili da neko slu\u010dajno
  dira komande. Nemojte zaboraviti da aktivirate ru\u010dnu ko\u010dnicu. Ukoliko
  vozilo parkirate na uzbrdici, ubacite menja\u010d u prvu brzinu, a ukoliko ga parkirate
  na nizbrdici, ubacite menja\u010d u hod unazad. Nemojte nikada ostavljati samu decu
  u vozilu.\\n\\n---\\n\\n**BRAVA UPRAVLJA\u010cA**\\n\\n**Aktiviranje:** kada je
  klju\u010d u polo\u017eaju STOP, izvadite klju\u010d i okre\u0107ite upravlja\u010d
  dok se ne zaklju\u010da.\\n\\n**Deaktiviranje:** pomerite malo upravlja\u010d dok
  okre\u0107ete klju\u010d za paljenje u polo\u017eaj MAR.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nApsolutno
  je zabranjeno vr\u0161iti bilo kakve post-prodajne operacije koje uklju\u010duju
  modifikacije sistema upravljanja ili stuba upravlja\u010da (npr. ugradnja ure\u0111aja
  za za\u0161titu od kra\u0111e) koje bi mogle lo\u0161e da uti\u010du na performanse
  i bezbednost, poni\u0161te garanciju i isto tako da dovedu do nesaobra\u0107nosti
  vozila sa uslovima za odobrenje tipa vozila.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nNemojte
  nikada vaditi klju\u010d dok je vozilo u pokretu. Upravlja\u010d \u0107e se zaklju\u010dati
  \u010dim ga okrenete. Ovo tako\u0111e va\u017ei i za vozila koja se vuku.\\n\\nSEDI\u0160TA\\n\\nUPAZORENJE\\n\\nSva
  pode\u0161avanja treba uraditi kada vozilo miruje.\\n\\n\u0160tof tapacirunga sedi\u0161ta
  predvi\u0111en je da izdr\u017ei dugo kori\u0161\u0107enje normalnom upotreboom
  vozila. Me\u0111utim, neke mere predostro\u017enosti su ipak neophodne. Izbegavajte
  du\u017ee ili lili prekomerno trenje sa metalnim kop\u010dama i \u010di\u010dak
  trakom na ode\u0107i, koje pod velikim pritiskom na malim povr\u0161inama \u0161tofa,
  mo\u017ee da uzrokuje njegovo cepanje, a samim tim i o\u0161te\u0107enje tapacirunga.\\n\\nPREDNJA
  SEDI\u0160TA\\n\\nPode\u0161avanje po du\u017eini\\n\\nPodignite polugu A sl. 19
  (sa unutra\u0161nje strane sedi\u0161ta) i gurnite sedi\u0161te prema napred ili
  prema nazad: u polo\u017eaju za vo\u017enju ruke treba da vam se oslanjaju na upravlja\u010d.\\n\\nUPAZORENJE\\n\\nPo
  \u0161to otpustite polugu za pode\u0161avanje, proverite uvek da li je sedi\u0161te
  fiksirano u vodicama tako \u0161to \u0107ete poku\u0161ati da ga pomorate napred
  i nazad. Ukoliko sedi\u0161te nije fiksirano u jednom polo\u017eaju, mo\u017ee neo\u010dekivano
  klizati i uzrokovati da voza\u010d izgubi kontrolu nad vozilom.\\n\\nslika 19\\n\\nPode\u0161avanje
  po visini\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nPomerite
  polugu B sl. 20 nagore ili nadole kako biste dobili odgovaraju\u0107u visinu.\\nVA\u017dNO:
  Izvr\u0161ite pode\u0161avanje dok sedite na sedi\u0161tu koje pode\u0161avate (voza\u010dko
  ili suvoza\u010devo).\\n\\nPode\u0161avanje nagiba naslona sedi\u0161ta\\nKoristite
  polugu C sl. 21 da podesite nagib naslona sedi\u0161ta, uz istovremeno pomeranje
  tela (polugu koristite dok ne dobijete \u017eeljeni polo\u017eaj, zatim je otpustite).\\n\\nPode\u0161avanje
  suvoza\u010devog sedi\u0161ta kao stola.\\n(za verzije/tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\nPomerite sedi\u0161te do kraja unazad, koriste\u0107i polugu
  A (videti deo \\\"Pode\u0161avanje po du\u017eini\\\"), upotrebite polugu C, preklopite
  naslon sedi\u0161ta na sedalni deo i otpustite polugu C.\\nPreporu\u010dujemo da
  ovu proceduru izvr\u0161avate sa spolja\u0161nje strane, sa levom rukom.\\n\\nslika
  20\\n\\nslika 21\\n\\nElektri\u010dno lumbalno pode\u0161avanje\\n(za verzije /
  tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nKada je klju\u010d u polo\u017eaju
  MAR-ON, pritisnite dugme A sl. 22 za pode\u0161avanje ure\u0111aja koji podr\u017eava
  lumbalni deo, kako biste regulisali nivo udobnosti tokom vo\u017enje. Otpustite
  dugme kada dobijete \u017eeljeni polo\u017eaj.\\n\\nElektri\u010dno grejanje sedi\u0161ta\\n(za
  verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nKada je klju\u010d okrenut
  na MAR-ON, pritisnite dugme B, kako biste uklju\u010dili / isklju\u010dili ovu funkciju.
  Kada je funkcija uklju\u010dena, pali se LED lampica na dugmetu.\\n\\nVA\u017dNO:
  Ako se ova funkcija aktivira kada je motor uga\u0161en, mo\u017ee do\u0107i do pra\u017enjenja
  akumulatora.\\n\\nNaslon za ruke na voza\u010devom sedi\u0161tu\\n(za verzije /
  tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nKod nekih verzija voza\u010devog
  sedi\u0161te ima naslon za ruke. Ovaj naslon za ruke se mo\u017ee podizati / spu\u0161tati
  pomeranjem u pravcu koji pokazuju strelice (sl. 23)\\n\\nProstor za odlaganje stvari\\n\\nIza
  naslona prednjeg sedi\u0161ta nalazi se prostor za odlaganje stvari sl. 24\\n\\nSto\u010di\u0107\\n\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nNeke verzije imaju
  na pole\u0111ini naslona prednjeg sedi\u0161ta jednu preklapaju\u0107u nose\u0107u
  povr\u0161inu A sl. 25 koja ima dr\u017ea\u010de za \u0161olje/konzerve. Za preklapanje
  ove povr\u0161ine upotrebite ta\u010dku B.\\n\\nslika 24\\n\\nslika 25\\n\\nU donjem
  delu pole\u0111ine naslona sedi\u0161ta nalazi se tako\u0111e i mre\u017ea za stvari
  C.\\n\\n**VA\u017dNO:** Nemojte stavljati stvari te\u017ee od 3kg na nose\u0107u
  povr\u0161inu: iz bezbednosnih razloga ova nose\u0107a povr\u0161ina \u0107e ispasti
  iz svog ku\u0107i\u0161ta, kada se na nju stave ve\u0107a optere\u0107enja.\\n\\n**UPPOZORENJE**\\n\\n*Nemojte
  voziti sa otvorenom nose\u0107om povr\u0161inom: nastojte uvek da bude pravilno
  zatvorena.*\\n\\n**KLIZE\u0106A I PREKLAPAJU\u0106A ZADNJA SEDI\u0160TA**\\n\\n**Pode\u0161avanje
  po du\u017eini**\\n\\nPodignite polugu A sl. 26, tako \u0161to \u0107ete je uhvatiti
  za sredi\u0161nji deo i gurnite napred ili nazad.\\n\\nOba dela sedi\u0161ta se
  pode\u0161avaju pojedina\u010dno.\\n\\n**Pode\u0161avanje nagiba naslona sedi\u0161ta**\\n\\nPodignite
  polugu B sl. 27 i pode\u0161avajte nagib naslona sedi\u0161ta, sa istovremenim pomeranjem
  tela.\\n\\nNaslon sedi\u0161ta se mo\u017ee dalje preklopiti kako bi se pobolj\u0161ala
  udobnost vo\u017enje.\\n\\nDa biste pove\u0107ali prostor izme\u0111u sedi\u0161ta
  i police za stvari uhvatite jezi\u010dak C na polici za stvari i pri\u010dvrstite
  ga za magnetni ure\u0111aj D, zatim upotrebite polugu B da namestite naslon sedi\u0161ta
  u \u017eeljeni polo\u017eaj.\\n\\nZadnji naslon za ruke\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nZa kori\u0161\u0107enje naslona za ruke sl. 29,
  spustite ga kao \u0161to je prikazano na slici.\\n\\nslika 27\\n\\nNASLONI ZA GLAVU\\n\\nPREDNJI\\n\\nPodesivi
  su po visini: za pode\u0161avanje postupite kao \u0161to sli\u010di:\\nPode\u0161avanje
  nagore: podi\u017eite naslon za glavu dok ne bude postavljen u fiksn polo\u017eaj.\\nPode\u0161avanje
  nadole: pritisnite dugme A sl. 30 i spu\u0161tajte naslon za glavu.\\nZa va\u0111enje
  naslona za glavu, postupite kao \u0161to sli\u010di:\\n- podi\u017eite naslone za
  glavu do maksimalne visine;\\n- pritisnite dugmad A i B (sa strane dva nosa\u010da
  naslona za glavu), zatim izvadite naslone za glavu, tako \u0161to \u0107ete ih povu\u0107i
  nagore.\\n\\nslika 28\\n\\nslika 29\\n\\nZADNJI\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nZadnja sedi\u0161ta imaju dva naslona za glavu
  podesiva po visini. Neke verzije imaju tako\u0111e i naslon za glavu za srednje
  sedi\u0161te.\\n\\nPode\u0161avanje nagore: podi\u017eite naslon za glavu dok ne
  bude postavljen u fiksn polo\u017eaj.\\n\\nPode\u0161avanje nadole: pritisnite dugme
  A sl. 31 i spu\u0161tajte naslon za glavu.\\n\\nPostupite kao \u0161to sli\u010di
  da izvadite naslone za glavu:\\n\\n- di\u017eite naslone za glavu do maksimalne
  visine;\\n- pritisnite dugmad A i B sl. 31 sa strane dva nosa\u010da, zatim izvadite
  naslone za glavu tako \u0161to \u0107ete ih povu\u0107i nagore.\\n\\nVA\u017dNO:
  Ako koristite zadnja sedi\u0161ta, naslone za glavu podesite uvek u potpuno podignut
  polo\u017eaj.\\n\\nUPRAVLJA\u010c\\n\\nUpravlja\u010d se mo\u017ee pode\u0161avati
  kako po osovini, tako i vertikalno.\\n\\nZa pode\u0161avanje pomerajte polugu A
  sl. 32 nadole u poziciju 1, zatim pode\u0161avajte upravlja\u010d u najpodesniji
  polo\u017eaj i zaklju\u010dajte ga u tom polo\u017eaju pomeranjem poluge A u polo\u017eaj
  2.\\n\\n**UPPOZORENJE**\\n\\nSva pode\u0161avanja treba uraditi samo kada vozilo
  miruje i kada je motor uga\u0161en.\\n\\n**UPPOZORENJE**\\n\\nApsolutno je zabranjeno
  vr\u0161iti bilo kakve post-prodajne operacije koje uklju\u010duju modifikacije
  sistema upravljanja ili stuba upravlja\u010da (npr. ugradnja ure\u0111aja za za\u0161titu
  od kra\u0111e) koje bi mogle lo\u0161e da uti\u010du na performanse i bezbednost,
  poni\u0161tite garanciju i isto tako da dovedu do nesaobraznosti vozila sa uslovima
  za odobrenje tipa vozila.\\n\\nRETROVIZORI\\n\\nUNUTRA\u0160NJI RETROVIZOR\\n\\nOvaj
  ure\u0111aj ima ugra\u0111en bezbednosni ure\u0111aj koji uzrokuje njegovo izbacivanje
  u slu\u010daju jakog \u010deonog udara.\\n\\nUpotrebite polugu A sl. 33 za pode\u0161avanje
  retrovizora u dva razli\u010dita polo\u017eaja: normalni i polo\u017eaj sa za\u0161titom
  od blje\u0161tanja.\\n\\nELEKTROHROMNI UNUTRA\u0160NJI RETROVIZOR\\n\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nNeke verzije imaju elektrohromni
  retrovizor sl. 34 sa prekida\u010dem ON / OFF za aktiviranje / deaktiviranje elektrohromne
  funkcije.\\n\\nKada je menja\u010d u polo\u017eaju za hod unazad, retrovizor se
  automatski pode\u0161ava u polo\u017eaj za dnevnu upotrebu.\\n\\nRETROVIZORI NA
  VRATIMA\\n\\nRu\u010dno pode\u0161avanje\\nUpotrebite polugu A sl. 35 da podesite
  retrovizor sa unutra\u0161nje strane vozila.\\n\\nElektri\u010dno pode\u0161avanje\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nRetrovizori se mogu pode\u0161avati
  samo ako je klju\u010d za paljenje u polo\u017eaju MAR.\\n\\nZa pode\u0161avanje
  postupite kao \u0161to sli\u010di:\\n- upotrebite ure\u0111aj A sl. 36 da izaberete
  retrovizor koji \u017eelite da podesite (desni ili levi);\\n- pomerite ure\u0111aj
  A u polo\u017eaj B i pomerajte ga dok ne podesite retrovizor na levim vratima;\\n-
  pomerite ure\u0111aj A u polo\u017eaj D i pomerajte ga dok ne podesite retrovizor
  na desnim vratima;\\nPo \u0161to zavr\u0161ite sa pode\u0161avanjem, vratite ure\u0111aj
  A u srednji polo\u017eaj C za zaklju\u010davanje.\\n\\nRu\u010dno preklapanje\\n\\nUkoliko
  je potrebno, preklopite retrovizore tako \u0161to \u0107ete ih pomeriti iz polo\u017eaja
  1 (otvoren) u polo\u017eaj 2 (zatvoren) sl. 37.\\n\\nVA\u017dNO: Tokom vo\u017enje
  retrovizori treba uvek da budu u polo\u017eaju 1 (otvoren).\\n\\nKONTROLA KLIMATIZACIJE\\n\\nBO\u010cNI
  USMERIVA\u010cI VAZDUHA\\n\\nA Sl. 38 \u2013 Podesivi i usmerivi bo\u010dni usmeriva\u010di
  vazduha:\\n- koristite ure\u0111aj B za pode\u0161avanje ventilacionog otvora u
  \u017eeljeni polo\u017eaj;\\n- okre\u0107ite to\u010dki\u0107 C za pode\u0161avanje
  protoka vazduha.\\n\\nD \u2013 fiksni bo\u010dni usmeriva\u010d vazduha.\\n\\nGORNJI
  USMERIVA\u010cI VAZDUHA\\n\\nA Sl. 39 \u2013 Gornji podesivi usmeriva\u010d vazduha.
  Okre\u0107ite to\u010dki\u0107 B za pode\u0161avanje protoka vazduha.\\n\\nC \u2013
  fiksni gornji usmeriva\u010d vazduha.\\n\\nSREDI\u0160NJI USMERIVA\u010cI VAZDUHA\\n\\nA
  Sl. 40 \u2013 podesivi i usmerivi sredi\u0161nji usmeriva\u010di vazduha:\\n- koristite
  ure\u0111aj B za pode\u0161avanje ventilacionog otvora u \u017eeljeni polo\u017eaj;\\n-
  okre\u0107ite to\u010dki\u0107 C za pode\u0161avanje protoka vazduha.\\n\\nslika
  39\\n\\nslika 40\\n\\nUDOBNOST KLIMA URE\u0110AJA\\n\\nUSMERIVA\u010cI\\n\\nslika
  41\\n\\n1. fiksni gornji usmeriva\u010d\\n2. Podesivi bo\u010dni usmeriva\u010di\\n3.
  fiksni usmeriva\u010di za bo\u010dne prozore\\n4. podesivi sredi\u0161nji usmeriva\u010di
  vazduha\\n5. podesivi gornji usmeriva\u010d\\n\\nGREJANJE I VENTILACIJA\\n\\nKOMANDE\\n\\nslika
  42\\n\\nA \u2013 dugme za pode\u0161avanje temperature vazduha:\\n- plava zona =
  hladan vazduh\\n- crvena zona = vru\u0107 vazduh\\n\\nB \u2013 dugme za uklju\u010divanje
  / isklju\u010divanje recirkulacije vazduha\\n\\nC \u2013 dugme za aktiviranje /
  pode\u0161avanje ventilatora:\\n- 0 = isklju\u010den ventilator\\n- 1 \u2013 2 \u2013
  3 \u2013 4 = brzina ventilatora\\n\\nD \u2013 dugme za uklju\u010divanje / isklju\u010divanje
  grejanja zadnjeg stakla\\n\\nE \u2013 dugme za distribuciju vazduha:\\n- vazduh
  iz sredi\u0161njih otvora i bo\u010dnih ventilacionih otvora\\n- vazduh iz sredi\u0161njih
  otvora, bo\u010dnih ventilacionih otvora i prednjih i zadnjih ventilacionih otvora
  kod nogu\\n- vazduh samo iz prednjih i zadnjih ventilacionih otvora kod nogu\\n-
  vazduh iz prednjih i zadnjih ventilacionih otvora kod nogu, za vetrobransko staklo
  i bo\u010dne prozore.\\n\\nVENTILACIJA/GREJANJE PUTNI\u010cKE KABINE\\nZa grejanje
  putni\u010dke kabine, postupite kao \u0161to slije:\\n- okrenite dugme A na crvenu
  zonu;\\n- okrenite dugme E na ;\\n- okrenite dugme C na 4 (maksimalna brzina ventilatora).\\n\\nZatim
  rukujte komandama kako biste odr\u017eali \u017eeljene uslove udobnosti.\\n\\nVA\u017dNO:
  Kada je motor hladan, potrebno je nekoliko minuta da se postigne optimalna zagrejanost
  putni\u010dke kabine.\\n\\nBRZO ODMAGLJIVANJE / ODMRZAVANJE\\nOva funkcija aktivira
  brzo odmaglivanje / odmrzavanje vetrobranskog stakla i prednjih bo\u010dnih prozora.
  Za brzo odmaglivanje / odmrzavanje, postupite kao \u0161to slije:\\n- okrenite dugme
  A na crvenu zonu;\\n- pritisnite dugme B i deaktivirajte recirkulaciju unutra\u0161njeg
  vazduha (uga\u0161ena LED lampica na dugmetu);\\n- okrenite dugme C na 4 (maksimalna
  brzina ventilatora);\\n- okrenite dugme E na .\\n\\nOdmaglivanje prozora\\nKontrolni
  sistem klime je vrlo koristan za spre\u010davanje zamagljivanja prozora u slu\u010dajevima
  visokog nivoa vlage. U slu\u010daju znatne spolja\u0161nje vlage i/ili ki\u0161e
  i/ili velike razlike u temperaturi unutar i izvan putni\u010dke kabine, uradite
  slede\u0107u preventivnu proceduru odmaglivanja prozora:\\n- okrenite dugme A na
  crvenu zonu;\\n- pritisnite dugme B i deaktivirajte recirkulaciju unutra\u0161njeg
  vazduha (uga\u0161ena LED lampica na dugmetu);\\n\\nokrenite dugme E na \\\\( \\\\text{W}
  \\\\) uz mogu\u0107nost da ga pomerete u polo\u017eaj \\\\( \\\\text{W} \\\\) ukoliko
  ne do\u0111e do zamagljivanja;\\n\\nokrenite dugme C u 2. brzinu (preporu\u010dena
  brzina). Mo\u017eete da izaberete i neku drugu brzinu, zavisno od va\u0161e procene.\\n\\n**ODMAGLJIVANJE
  / ODMRZAVANJE ZADNJEG GREJANOG STAKLA**\\n\\nPritisnite dugme D ( \\\\( \\\\text{W}
  \\\\) ) da aktivirate / deaktivirate ovu funkciju. Na aktiviranje ove funkcije ukazuje
  paljenje LED lampice na samom dugmetu. Sama funkcija se automatski deaktivira posle
  20 minuta. Za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno, pritisnite
  dugme \\\\( \\\\text{W} \\\\) da aktivirate odmaglivanje / odmrzavanje retrovizora
  na vratima i vetrobranskog stakla (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\n**VA\u017dNO:**
  nemojte stavljati nikakve nalepnice sa unutra\u0161nje strane zadnjeg grejanog stakla
  preko grejnih vlakana, kako biste izbegli o\u0161te\u0107enje koje mo\u017ee da
  dove\u0111e do toga da prestanu da rade pravilno.\\n\\n**RECIRKULACIJA UNUTRA\u0160NJEG
  VAZDUHA**\\n\\nPritisnite dugme B ( \\\\( \\\\text{W} \\\\) ) tako da se upali LED
  lampica na dugmetu. Preporu\u010duje se uklju\u010divanje recirkulacije unutra\u0161njeg
  vazduha prilikom stajanja u saobra\u0107aju ili u tunelima kako bi se spre\u010dio
  ulazak zaga\u0111enog vazduha. Nemojte koristiti ovu funkciju dugo, posebno kada
  je vi\u0161e putnika u vozilu, kako biste spre\u010dili zamagljivanje prozora.\\n\\n**VA\u017dNO:**
  Recirkulacija unutra\u0161njeg vazduha omogu\u0107ava br\u017ee postizanje \u017eeljenog
  zagrejavanja ili hla\u0111enja, zavisno od izabranog na\u010dina rada. Nemojte koristiti
  funkciju za recirkulaciju unutra\u0161njeg vazduha ki\u0161nim/hladnim danima po\u0161to
  bi ona znatno pove\u0107ala mogu\u0107nost zamagljivanja prozora.\\n\\n**SELEKCIJA
  DISTRIBUCIJE VAZDUHA**\\n\\nOkre\u0107ite dugme E kako biste ru\u010dno izabrali
  jedan od pet mogu\u0107ih pode\u0161avanja distribucije vazduha u putni\u010dkoj
  kabini:\\n\\n- protok vazduha usmeren na otvore za vetrobransko staklo, prednje
  bo\u010dne prozore i prednje / zadnje prostore za noge.\\n\\n- protok vazduha usmeren
  na otvore za prednje / zadnje prostore za noge. Ova distribucija vazduha omogu\u0107ava
  brzo zagrevanje putni\u010dke kabine.\\n\\n- protok vazduha distribuiran izme\u0111u
  sredi\u0161njih i bo\u010dnih ventilacionih otvora na instrument tabli i prednjih
  i zadnjih ventilacionih otvora prostora za noge.\\n\\n- protok vazduha usmeren na
  sredi\u0161nje / bo\u010dne ventilacione otvore na instrument tabli (telo putnika).\\n\\n-
  protok vazduha usmeren na vetrobransko staklo i bo\u010dne prozore.\\n\\nKLIMA URE\u0110AJ
  SA RU\u010cNIM KOMANDAMA\\n\\nKOMANDE\\n\\nslika 43\\n\\nA \u2013 dugme za pode\u0161avanje
  temperature vazduha:\\n- plava zona = hladan vazduh\\n- crvena zona = vru\u0107
  vazduh\\n\\nB \u2013 dugme za uklju\u010divanje / isklju\u010divanje recirkulacije
  vazduha\\n\\nC \u2013 dugme za aktiviranje / pode\u0161avanje ventilatora:\\n- 0
  = isklju\u010den ventilator\\n- 1 \u2013 2 \u2013 3 \u2013 4 = brzina ventilatora\\n\\nD
  \u2013 dugme za uklju\u010divanje / isklju\u010divanje kompresora kontrolnog sistema
  klime\\n\\nE \u2013 dugme za uklju\u010divanje / isklju\u010divanje grejanja zadnjeg
  stakla;\\n\\nF \u2013 dugme za distribuciju vazduha:\\n- vazduh iz sredi\u0161njih
  otvora i bo\u010dnih ventilacionih otvora\\n- vazduh iz sredi\u0161njih otvora,
  bo\u010dnih ventilacionih otvora i prednjih i zadnjih ventilacionih otvora kod nogu\\n-
  vazduh samo iz prednjih i zadnjih ventilacionih otvora kod nogu\\n- vazduh iz prednjih
  i zadnjih ventilacionih otvora kod nogu, za vetrobransko staklo i bo\u010dne prozore.\\n\\nKONTROLNI
  SISTEM KLIME (hla\u0111enje)\\n\\nZa hla\u0111enje putni\u010dke kabine, postupite
  kao \u0161to slije:\\n- okrenite dugme A na plavu zonu;\\n- pritisnite dugme B kako
  biste omogu\u0107ili recirkulaciju unutra\u0161njeg vazduha (upaljena LED lampica
  na dugmetu);\\n- okrenite dugme F na ;\\n- pritisnite dugme D da aktivirate kontrolni
  sistem klime i okrenite dugme C na najmanje 1 (prva brzina). Za brzo hla\u0111enje
  okrenite dugme C na 4 (maksimalna brzina ventilatora).\\n\\nVA\u017dNO: Zavisno
  od odre\u0111enih spolja\u0161njih uslova, kontrolni sistem klime automatski aktivira
  recirkulaciju (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111en dodatni
  greja\u010d).\\n\\nSmanjenje hla\u0111enja\\n- okrenite dugme A u pravcu kretanja
  kazaljki na satu, kako biste pove\u0107ali temperaturu;\\n- pritisnite dugme B da
  deaktivirate recirkulaciju unutra\u0161njeg vazduha (LED lampica na dugmetu je uga\u0161ena);\\n-
  okrenite dugme C da smanjite brzinu ventilatora.\\n\\nZAGREVANJE PUTNI\u010cKE KABINE\\n\\nZa
  zagrevanje putni\u010dke kabine, postupite kao \u0161to slije:\\n- okrenite dugme
  A na crvenu zonu;\\n- pritisnite dugme B kako biste omogu\u0107ili recirkulaciju
  unutra\u0161njeg vazduha (LED lampica na dugmetu je upaljena);\\n- okrenite dugme
  F na ;\\n- okrenite dugme C na najmanje 1 (prva brzina). Za brzo zagrevanje, okrenite
  dugme C na 4 (maksimalna brzina ventilatora).\\n\\nSmanjenje grejanja\\n\\n- okrenite
  dugme A u pravcu suprotnom od pravca kretanja kazaljki na satu kako biste smanjili
  temperaturu;\\n- pritisnite dugme B da deaktivirate recirkulaciju unutra\u0161njeg
  vazduha (LED lampica na dugmetu je uga\u0161ena);\\n- okrenite dugme C da smanjite
  brzinu ventilatora.\\n\\nVA\u017dNO: Kada je motor hladan, potrebno je nekoliko
  minuta da se postigne optimalno zagrevanje putni\u010dke kabine.\\n\\nBRZO ODMAGLJIVANJE
  / ODMRZAVANJE\\n\\nOva funkcija omogu\u0107ava brzo odmaglivanje / odmrzavanje vetrobranskog
  stakla i prednjih bo\u010dnih prozora. Za brzo odmaglivanje / odmrzavanje, postupite
  kao \u0161to sledi:\\n\\n- okrenite dugme A na crvenu zonu;\\n- okrenite dugme C
  na 4 (maksimalna brzina ventilatora);\\n- okrenite dugme F na .\\n\\nVA\u017dNO:
  U ovom stanju, kontrolni sistem klime deaktivira funkciju recirkulacije (LED lampica
  na dugmetu B je uga\u0161ena) i aktivira kompresor (LED lampica na dugmetu D je
  upaljena). Cilj ove automatske operacije jeste da spre\u010di zamagljivanje prozora.\\n\\nOdmaglivanje
  prozora\\n\\nKontrolni sistem klime je vrlo koristan za spre\u010davanje zamagljivanja
  prozora u slu\u010daju visokog nivoa vlage. U slu\u010daju z\u043d\u0430\u0442\u043d\u0435
  spola\u0161nje vlage i/ili ki\u0161e i/ili velike razlike u temperaturi unutar i
  izvan putni\u010dke kabine, uradite slede\u0107u preventivnu proceduru odmaglivanja
  prozora:\\n\\n- okrenite dugme A na crvenu zonu;\\n- okrenite dugme F na uz mogu\u0107nost
  da ga pomerite na polo\u017eaj , ukoliko ne do\u0111e do zamagljivanja;\\n- okrenite
  dugme C na 2. brzinu.\\n\\nODMAGLJIVANJE/ODMRZAVANJE ZADNJEG GREJANOG STAKLA\\n\\nPritisnite
  dugme E ( ) kako biste uklju\u010dili /isklju\u010dili ovu funkciju. Na aktiviranje
  ove funkcije ukazuje paljenje LED lampice na samom dugmetu. Ova funkcija se automatski
  deaktivira posle 20 minuta. Za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno,
  pritisnite dugme  da aktivirate odmaglivanje / odmrzavanje retrovizora na vratima
  i grejanog vetrobranskog stakla (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nVA\u017dNO:
  Nemojte stavljati nikakve nalepnice sa unutra\u0161nje strane zadnjeg grejanog stakla
  preko grejnih vlakana, kako biste izbegli o\u0161te\u0107enje koje mo\u017ee da
  dove\u0111e do toga da prestanu da rade pravilno.\\n\\nRECIRKULACIJA UNUTRA\u0160NJEG
  VAZDUHA\\n\\nPritisnite dugme B (\ud83d\ude97) tako da se upali LED lampica na dugmetu.
  Preporu\u010duje se uklju\u010divanje recirkulacije unutra\u0161njeg vazduha dok
  stojite u saobra\u0107aju ili u tunelu kako biste spre\u010dili ulazak zaga\u0111enog
  vazduha. Nemojte dugo koristiti ovu funkciju, posebno ukoliko ima puno putnika u
  vozilu, kako biste spre\u010dili zamagljivanje prozora.\\n\\nVA\u017dNO: Recirkulacija
  unutra\u0161njeg vazduha omogu\u0107ava br\u017ee postizanje \u017eeljenog zagrevanja
  ili hla\u0111enja, zavisno od izabranog na\u010dina rada. Nemojte koristiti funkciju
  recirkulacije unutra\u0161njeg vazduha ki\u0161nim/hladnim danima, po\u0161to bi
  ona znatno pove\u0107ala mogu\u0107nost zamagljivanja prozora.\\n\\nSELEKCija DISTRIBUTUCIJE
  VAZDUHA\\n\\nOkre\u0107ite dugme F kako biste ru\u010dno izabrali jedan od pet mogu\u0107ih
  pode\u0161avanja distribucije vazduha u putni\u010dkoj kabinii:\\n\\n- protok vazduha
  usmeren na otvore za vetrobransko staklo, prednje bo\u010dne prozore i prednje /
  zadnje prostore za noge.\\n- protok vazduha usmeren na otvore za prednje / zadnje
  prostore za noge. Ova distribucija vazduha omogu\u0107ava brzo zagrevanje putni\u010dke
  kabine.\\n- protok vazduha distribuiran izme\u0111u sredi\u0161njih i bo\u010dnih
  otvora na instrument tabli i prednjih i zadnjih raspr\u0161iva\u010da prostora za
  noge.\\n- protok vazduha usmeren na sredi\u0161nje / bo\u010dne ventilacione otvore
  na instrument tabli (telo putnika).\\n- protok vazduha usmeren na vetrobransko staklo
  i bo\u010dne prozore.\\n\\nIzbor distribucije za prostor za noge / vetrobransko
  staklo ili samo distribuciju za vetrobransko staklo aktivira kompresor kontrolnog
  sistema klime (upaljena LED lampica na dugmetu A/C), a recirkulacija vazduha je
  pode\u0161ena na \\\"outside air\\\" (spolja\u0161nji vazduh) (uga\u0161ena LED
  lampica na dugmetu B). Ovaj na\u010din rada garantuje optimalnu vidljivost kroz
  prozore. Korisnik mo\u017ee uvek da pode\u0161ava recirkulaciju vazduha i kompresor
  kontrolnog sistema klime.\\n\\nSTART&STOP\\n\\nRu\u010dni kontrolni sistem klime\\n\\nUkoliko
  se aktivira funkcija Start&Stop (ga\u0161enje motora kada je brzina vozila jednaka
  nuli), sistem klime \u0107e odr\u017eati protok vazduha koji je izabrao korisnik.
  U ovim uslovima, nije mogu\u0107e garantovati hla\u0111enje i grejanje putni\u010dke
  kabine, po\u0161to kompresor prestaje da radi kada i pumpa rashladnog sredstva motora.
  Mogu\u0107e je deaktivirati funkciju Start&Stop u cilju boljeg rada kontrolnog sistema
  klime, pritiskanjem za to namenjenog dugmeta na instrument tabli.\\n\\nDODATNI ELEKTRI\u010cNI
  GREJA\u010c\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nDodatni
  elektri\u010dni greja\u010d obezbe\u0111uje br\u017ee zagrevanje putni\u010dke kabine.\\nAktivira
  se u uslovima hladnog vremena, ukoliko postoje slede\u0107i uslovi:\\n\\n- niska
  spolja\u0161nja temperatura;\\n- niska temperatura rashladnog sredstva motora;\\n-
  upaljen motor;\\n- brzina ventilatora pode\u0161ena na 1. brzinu;\\n- dugme A okrenuto
  do kraja u pravcu kretanja kazaljki na satu do crvene zone.\\n\\nOvaj greja\u010d
  se isklju\u010duje kada vi\u0161e nema barem jednog od prethodno navedenih uslova.\\n\\nVa\u017eno
  Snaga elektri\u010dnog greja\u010da zavisi od napona akumulatora.\\n\\nODR\u017dAVANJE
  SISTEMA\\n\\nZimi se kontrolni sistem klime mora uklju\u010divati barem jednom mese\u010dno
  u trajanju od oko 10 minuta. Nastojte da vam Fiatov diler pregleda ovaj sistem pre
  po\u010detka leta.\\n\\nOvaj sistem koristi sredstvo za hla\u0111enje R134a koje
  ne zaga\u0111uje \u017eivotnu sredinu ukoliko do\u0111e do slu\u010dajnog curenja.
  Nemojte ni pod kojim okolnostima da koristite te\u010dnost R12, koja nije kompatibilna
  sa komponentama ovog sistema.\\n\\nAUTOMATSKI DVOZONSKI KONTROLNI SISTEM KLIME\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nKOMANDE\\n\\nslika
  44\\n\\nA \u2013 dugme za pode\u0161avanje temperature vazduha na strani voza\u010da;\\nB
  \u2013 dugme za uklju\u010divanje / isklju\u010divanje recirkulacije unutra\u0161njeg
  vazduha\\nC \u2013 dugme za uklju\u010divanje / isklju\u010divanje zadnjeg grejanog
  stakla i termalne za\u0161tite vetrobranskog stakla (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno);\\nD \u2013 dugme za uklju\u010divanje / isklju\u010divanje
  kompresora kontrolnog sistema klime\\nE \u2013 dugme za uklju\u010divanje / isklju\u010divanje
  kontrolnog sistema klime;\\nF \u2013 dugme za pode\u0161avanje brzine ventilatora;\\nG
  \u2013 LED indikator brzine ventilatora;\\nH \u2013 dugmad za izbor distribucije
  vazduha;\\nI \u2013 dugme za aktiviranje funkcije MAX-DEF (brzo odmrzavanje / odmaglivanje
  prednjih prozora), grejanja zadnjeg stakla i grejanja retrovizora na vratima (za
  verzije / tr\u017ei\u0161ta za koje je predvideno);\\nL \u2013 dugme za pode\u0161avanje
  temperature na strani suvoza\u010da;\\nM \u2013 dugme za aktiviranje funkcije MONO
  na strani voza\u010da/suvoza\u010da (izjedna\u010denje pode\u0161enih temperatura);\\nN
  \u2013 dugme za aktiviranje funkcije AUTO (automatski rad).\\n\\n**OPIS**\\n\\nAutomatski
  dvozonski kontrolni sistem klime reguli\u0161e temperature vazduha u putni\u010dkoj
  kabini u dve zone: na strani voza\u010da i na strani suvoza\u010da.\\n\\nOvaj sistem
  odr\u017eava udobnost unutar putni\u010dke kabine i nadokna\u0111uje mogu\u0107e
  promene u spolja\u0161njim klimatskim uslovima.\\n\\nKontrolni sistem klime mo\u017ee
  da prepozn\u00e1 ekstremno hladne (ili ekstremno tople) uslove u putni\u010dkoj
  kabini i shodno tome da obezbedi optimalno upravljanje mogu\u0107nostima ovog sistema.\\n\\n**VA\u017dNO:**
  Referentna temperatura je 22\u00b0C za upravljanje optimalnom udobno\u0161\u0107u.\\n\\nAutomatski
  kontrolisani parametri i funkcije su:\\n\\n- temperatura vazduha kod ventilacionih
  otvora na strani voza\u010da / suvoza\u010da;\\n- distribucija vazduha kod ventilacionih
  otvora na strani voza\u010da / suvoza\u010da;\\n- brzina ventilatora (neprekidna
  varijacija protoka vazduha);\\n- uklju\u010divanje kompresora (za hla\u0111enje
  /isu\u0161ivanje vazduha);\\n- recirkulacija vazduha.\\n\\nSve ove funkcije se mogu
  podesiti ru\u010dnim upravljanjem sistemom, izborom jedne ili vi\u0161e funkcija
  i menjanjem njihovih parametara.\\n\\nAutomatska kontrola funkcija mo\u017ee biti
  obustavljena: sistem \u0107e poni\u0161titi pode\u0161avanja samo iz bezbednosnih
  razloga.\\n\\nRu\u010dne selekcije imaju uvek prioritet nad automatskim i memorisane
  su dok se ne pritisne dugme AUTO ili dok sam sistem ne interveni\u0161e iz odre\u0111enih
  bezbednosnih razloga.\\n\\nBrzina vozila ne uti\u010de na koli\u010dinu vazduha
  unetog u putni\u010dku kabinu; nju reguli\u0161e ventilator, koji je elektronski
  kontrolisan.\\n\\nTemperatura vazduha se uvek kontroli\u0161e automatski zavisno
  od pode\u0161ene temperature na displeju (izuzev kada je sistem isklju\u010den ili
  u odre\u0111enim uslovima kada kompresor ne radi).\\n\\nSistem dozvoljava ru\u010dno
  pode\u0161avanje ili prilago\u0111avanje slede\u0107eg:\\n\\n- temperature vazduha
  na strani voza\u010da / suvoza\u010da\\n- brzine ventilatora (neprekidna varijacija);\\n-
  distribucije vazduha u 7 polo\u017eaja;\\n- uklju\u010divanje kompresora;\\n- funkcije
  brzog odmrzavanja / odmagljivanja;\\n- recirkulacije vazduha;\\n- grejanja zadnjeg
  stakla;\\n- deaktiviranja sistema;\\n\\n**UKLJU\u010cIVANJE KONTROLNOG SISTEMA KLIME**\\n\\nKontrolni
  sistem klime mo\u017ee se uklju\u010diti na razne na\u010dine: preporu\u010duje
  se pritiskanje dugmeta AUTO i okretanje dugmadi za pode\u0161avanje \u017eeljenih
  temperatura.\\n\\nSistem na ovaj na\u010din radi potpuno automatski da podesi temperaturu,
  koli\u010dinu i distribuciju vazduha unetog u putni\u010dku kabinu. On tako\u0111e
  upravlja funkcijom recirkulacije vazduha i aktiviranjem kompresora klime.\\n\\nU
  toku automatskog rada, mo\u017eete promeniti pode\u0161ene temperature, distribuciju
  vazduha i brzinu ventilatora u bilo kom trenutku kori\u0161\u0107enjem odgovaraju\u0107e
  dugmadi: sistem \u0107e automatski promeniti pode\u0161avanja kako bi se prilagodio
  novim zahtevima.\\n\\nU toku potpuno automatskog rada (AUTO), variranje protoka
  i/ili distribucije vazduha (koji nisu prikazani) uzrokuje nestanak LED lampice AUTO
  funkcije i rad sistema u RU\u010cNOM na\u010dinu rada (prikazivanjem tra\u017eenog
  toka i distribucije).\\n\\nKada se deaktivira kompresor, AUTO na\u010din rada ostaje
  aktivan samo ukoliko sistem mo\u017ee da garantuje udobnost u vozilu. U suprotnom,
  sistem prelazi na RU\u010cNI na\u010din rada (pode\u0161ene temperature \u0107e
  treptati na displeju). Brzina ventilatora je ista u svim zonama putni\u010dke kabine.\\n\\n*Kontrolni
  sistem klime registruje temperaturu putni\u010dke kabine kori\u0161\u0107enjem senzora
  srednje temperature toplotnog zra\u010denja koji se nalazi u unutra\u0161njem retrovizoru
  i za\u0161ti\u0107en je odre\u0111enim poklopcem. Opstrukcijom vidnog polja ovog
  senzora bilo kakvim predmetom mo\u017ee da ugrozi optimalnu efikasnost rada kontrolnog
  sistema klime.*\\n\\nPODE\u0160AVANJE TEMPERATURE VAZDUHA\\n\\nOkre\u0107ite dugme
  A ili L u pravcu kretanja kazaljki na satu ili u pravcu suprotnom od pravca kretanja
  kazaljki na satu kako biste pode\u0161ili temperaturu vazduha u prednjoj levoj (dugme
  A) ili desnoj (dugme L) zoni putni\u010dke kabine.\\n\\nPode\u0161ene temperature
  se prikazuju na dva zasebna displeja.\\n\\nPritisnite dugme MONO za izjedna\u010denje
  temperature vazduha izme\u0111u dve zone.\\n\\nOkrenite dugme L da se vratite na
  odvojeno upravljanje temperaturama vazduha u dve zone.\\n\\nPotpunim okretanjem
  dugmadi u jednom ili drugom pravcu aktivira funkcije \\\"HI\\\" (maksimalno grejanje)
  odnosno (\\\"LO\\\") (maksimalno hla\u0111enje).\\n\\nZa deaktiviranje ovih funkcija,
  okrenite dugmad za temperaturu na \u017eeljenu temperaturu.\\n\\nSELEKCIJA DISTRIBUCIJE
  VAZDUHA\\n\\nPritiskanjem dugmadi H (\u25b3/\u25bd/\u25b7), mogu\u0107e je ru\u010dno
  pode\u0161iti jednu od 7 mogu\u0107ih distribucija vazduha:\\n\\n\u25b3 protok vazduha
  do otvora vetrobranskog stakla i prednjih bo\u010dnih prozora za njihovo odmaglivanje
  / odmrzavanje.\\n\\n\u25b7 protok vazduha iz sredi\u0161njih i bo\u010dnih ventilacionih
  otvora na instrument tabli za ventilaciju grudnog ko\u0161a i lica tokom vru\u0107e
  sezone.\\n\\n\u25bd protok vazduha do otvora prednjeg i zadnjeg prostora nogu. Ovo
  pode\u0161avanje distribucije vazduha najbr\u017ee zagreva putni\u010dku kabinu,
  davanjem brzog ose\u0107aja toplote.\\n\\n\u25b7 \u25bd distribucija protoka vazduha
  izme\u0111u otvora za prostor za noge (toplij vazduh) i sredi\u0161njih i bo\u010dnih
  ventilacionih otvora na instrument tabli (hladniji vazduh). Ovakvo pode\u0161avanje
  distribucije je korisno za sun\u010dane dane u prolje\u0107e i na jesen.\\n\\n\u25b3
  \u25bd distribucija protoka vazduha izme\u0111u otvora za prostor za noge i raspr\u0161iva\u010da
  za odmrzavanje / odmaglivanje vetrobranskog stakla i prednjih bo\u010dnih prozora.
  Ovakvo pode\u0161avanje distribucije omogu\u0107ava efikasno zagrevanje putni\u010dke
  kabine i spre\u010dava zamagljivanje prozora.\\n\\n\u25b3 \u25b7 \u25bd distribucija
  protoka vazduha izme\u0111u otvora za odmaljivanje / odmrzavanje vetrobranskog stakla
  i bo\u010dnih i sredi\u0161njih ventilacionih otvora na instrument tabli. Ovo omogu\u0107ava
  slanje vazduha na vetrobransko staklo u uslovima jake sun\u010deve svetlosti.\\n\\n\u25b3
  \u25b7 \u25bd distribucija protoka vazduha na sve otvora u vozilu.\\n\\nVA\u017dNO:
  Vazduh uvek te\u010de iz bo\u010dnih otvora na instrument tabli: mogu\u0107e je,
  me\u0111utim, da se prekine protok vazduha kori\u0161\u0107enjem to\u010dki\u0107a
  koji se nalazi blizu odgovaraju\u0107ih ventilacionih otvora.\\n\\nKontrolni sistem
  klime u na\u010dinu rada AUTO, automatski upravlja distribucijom vazduha (uga\u0161ene
  su LED lampice na dugmadi H).\\n\\nPaljenje LED lampica na izabranoj dugmadi ukazuje
  na ru\u010dno pode\u0161enu distribuciju vazduha. U kombinovanom na\u010dinu rada
  funkcija, one se aktiviraju zajedno sa onima koje su ve\u0107 pode\u0161ene pritiskom
  relevantnog dugmeta. Ako se pritisne dugme neke funkcije koja je ve\u0107 aktivna,
  poni\u0161tava se njen rad, a odgovaraju\u0107a LED lampica se gasi. Za ponovno
  vra\u0107anje automatske kontrole distribucije vazduha posle ru\u010dne selekcije,
  pritisnite dugme AUTO.\\n\\n**PODE\u0160AVANJE BRZINE VENTILATORA**\\n\\nOkrenite
  dugme F da pove\u0107ate / smanjite brzinu ventilatora. Paljenje G LED lampica na
  dugmetu F pokazuje brzinu.\\n\\n- maksimalna brzina ventilatora = upaljene sve LED
  lampice;\\n- minimalna brzina ventilatora = upaljena jedna LED lampica.\\n\\nVentilator
  je mogu\u0107e isklju\u010diti samo ukoliko je isklju\u010den kompresor kontrolnog
  sistema klime, pritiskanjem dugmeta D.\\n\\n**VA\u017dNO:** Za ponovno vra\u0107anje
  automatske kontrole brzine ventilatora posle ru\u010dnog pode\u0161avanja, pritisnite
  dugme AUTO.\\n\\n**DUGME \\\"AUTO\\\"**\\n\\nKada je dugme AUTO pritisnuto (LED
  lampica na dugmetu je upaljena), kontrolni sistem klime automatski pode\u0161ava
  slede\u0107a pode\u0161avanja u odgovaraju\u0107im zonama:\\n\\n- koli\u010dine
  i distribucije vazduha unetog u putni\u010dku kabinu.\\n- kompresora kontrolnog
  sistema klime\\n- recirkulaciju vazduha\\n\\nponi\u0161tavaju\u0107i sva prethodna
  ru\u010dna pode\u0161avanja. Na ovo ukazuje paljenje LED lampice na dugmetu AUTO.\\n\\nUkoliko
  se pritisnute dugme AUTO kada je upaljena LED lampica AUTO, sistem kompletno prelazi
  na ru\u010dni na\u010din rada; prikazuje stanje teku\u0107eg toka i distribucije,
  kojima se ne\u0107e vi\u0161e upravljati automatski.\\n\\nUkoliko do\u0111e do ru\u010dne
  intervencije najmanje na distribuciju vazduha ili na brzinu ventilatora, LED lampica
  \u0107e se ugasiti kako bi se pokazalo da sistem vi\u0161e ne kontroli\u0161e automatski
  sve funkcije.\\n\\nDeaktiviranje kompresora dovodi do deaktiviranja automatskog
  rada samo ukoliko sistem ne mo\u017ee vi\u0161e da garantuje uslove udobnosti (\u0161to
  zavisi od pode\u0161ene temperature).\\n\\n**VA\u017dNO:** Ukoliko sistem ne mo\u017ee
  vi\u0161e da garantuje \u017eeljenu pode\u0161enu temperaturu u razli\u010ditim
  zonama putni\u010dke kabine, pode\u0161ena vrednost temperature \u0107e treptati
  nekoliko sekundi na displeju.\\n\\nZa vra\u0107anje automatskog kontrolnog sistema
  posle jednog ili vi\u0161e ru\u010dnih pode\u0161avanja, pritisnite dugme AUTO.\\n\\nDUGME
  \\\"MONO\\\"\\n\\nPritisnite dugme MONO (pali se LED lampica na dugmetu) kako biste
  izjedna\u010dili temperaturu na strani suvoza\u010da sa temperaturom na strani voza\u010da.
  Ova funkcija olak\u0161ava regulisanje temperature kada voza\u010d putuje sam.\\n\\nOkrenite
  dugme L da podesite temperaturu na strani suvoza\u010da i vratite se na odvojeno
  upravljanje temperaturom vazduha.\\n\\nRECIRKULACIJA VAZDUHA\\n\\nRecirkulacijom
  vazduha se upravlja zavisno od slede\u0107e logike rada:\\n\\n- prinudno aktiviranje
  (uvek uklju\u010dena recirkulacija vazduha): na to ukazuje upaljena LED lampica
  na dugmetu B;\\n- prinudno deaktiviranje (uvek isklju\u010dena recirkulacija vazduha,
  ulaz spolja\u0161njeg vazduha), na to ukazuje uga\u0161ena LED lampica na dugmetu
  B.\\n\\nPrinudno aktiviranje/deaktiviranje mo\u017ee se izabrati pritiskanjem dugmeta
  B.\\n\\nKada je pritisnuto dugme, kontrolni sistem klime automatski aktivira recirkulaciju
  unutra\u0161njeg vazduha (upaljena je LED lampica na dugmetu B).\\n\\nI dalje je
  mogu\u0107e aktivirati recirkulaciju spolja\u0161njeg vazduha (uga\u0161ena je LED
  lampica na dugmetu) i obrnuto, pritiskanjem dugmeta B.\\n\\nKod automatskog rada,
  sistem automatski upravlja recirkulacijom, zavisno od uslova spolja\u0161nje sredine.\\n\\nVA\u017dNO:
  Uklju\u010divanje sistema za recirkulaciju omogu\u0107ava br\u017ee postizanje \u017eeljenog
  stanja zagrevanja / hla\u0111enja. Me\u0111utim, nije preporu\u010dljivo da se ovaj
  sistem koristi ki\u0161nim / hladnim danima po\u0161to bi zna\u010dajno pove\u0107ao
  mogu\u0107nost unutra\u0161njeg magljenja prozora (pogotovo ukoliko je isklju\u010den
  kontrolni sistem klime). Kada je spolja\u0161nja temperatura niska, recirkulacija
  se prinudno isklju\u010duje (vazduh se uvla\u010di od spolja) kako bi se spre\u010dilo
  zamaglivanje prozora.\\n\\nNije preporu\u010dljivo da se koristi recirkulacija unutra\u0161njeg
  vazduha kada je spolja\u0161nja temperatura niska, po\u0161to bi se prozori mogli
  brzo zamagliti.\\n\\nKOMPRESOR KONTROLNOG SISTEMA KLIME\\n\\nPritisnite dugme D
  za aktiviranje / deaktiviranje kompresora (na aktiviranje ukazuje upaljena LED lampica
  na dugmetu).\\n\\nSistem pampti da je kompresor isklju\u010den, \u010dak i po\u0161to
  se motor ugasi.\\n\\nSistem deaktivira recirkulaciju vazduha kada je kompresor ugasen,
  kako bi spre\u010dio zamaglivanje prozora. U ovom slu\u010daju, ako je sistem u
  stanju da odr\u017ei \u017eeljenu temperaturu, ne\u0107e se ugasiti LED lampica
  na dugmetu AUTO.\\n\\nTemperatura \u0107e umesto toga treptati nekoliko sekundi,
  a LED lampica \u0107e se ugasiti na dugmetu AUTO, ukoliko nije mogu\u0107e odr\u017eati
  \u017eeljenu temperaturu.\\n\\nZa ponovno uspostavljanje automatske kontrole uklju\u010divanja
  kompresora, pritisnite ponovo dugme C ili pritisnite dugme AUTO.\\n\\nKada je kompresor
  isklju\u010den:\\n\\n- a spolja\u0161nja temperatura je ve\u0107a od one koja je
  pode\u0161ena, kontrolni sistem klime ne\u0107e biti u stanju da zadovolji zadatak.
  Vrednosti temperature \u0107e tada treptati na displeju tokom nekoliko sekundi,
  kako bi ukazale na to;\\n- brzina ventilatora se mo\u017ee ru\u010dno podesiti.\\n\\nSa
  upaljenim kompresorom i upaljenim motorom, ru\u010dna ventilacija ne mo\u017ee biti
  manja od minimalne brzine (upaljena je samo jedna LED lampica).\\n\\nVA\u017dNO:
  Kada je uga\u0161en kompresor, vazduh se ne mo\u017ee unositi u putni\u010dku kabinu
  sa temperaturom ni\u017eom od spolja\u0161nje temperature. \u0160tavi\u0161e, pod
  odre\u0111enim uslovima sredine, moglo bi do\u0107i do brzog zamagljivanja prozora,
  po\u0161to vazduh nije isu\u0161en.\\n\\n**BRZO ODMAGLJIVANJE / ODMRZAVANJE**\\n\\n(funkcija
  MAX-DEF)\\n\\nPritisnite dugme  da aktivirate (upaljena LED lampica na dugmetu)
  funkciju za odmaglivanje / odmrzavanje vetrobranskog stakla i bo\u010dnih prozora.\\n\\nKontrolni
  sistem klime vr\u0161i slede\u0107e operacije:\\n\\n- uklju\u010duje kompresor klime
  kada su odgovaraju\u0107i uslovi sredine;\\n- isklju\u010duje recirkulaciju vazduha;\\n-
  pode\u0161ava maksimalnu temperaturu vazduha (HI) u obe zone;\\n- pode\u0161ava
  brzinu ventilatora zavisno od temperature sredstva za hla\u0111enje motora;\\n-
  usmerava protok vazduha na raspr\u0161iva\u010de za vetrobransko staklo i prednje
  bo\u010dne prozore;\\n- aktivira zadnje grejano staklo;\\n- aktivira grejano vetrobransko
  staklo (za verzije / tr\u017ei\u0161ta za koje je predvideno);\\n- prikazuje brzinu
  ventilatora (upaljena LED lampica G).\\n\\nVA\u017dNO: Funkcija MAX-DEF ostaje uklju\u010dena
  tokom 3 minute od kada sredstvo za hla\u0111enje motora dostigne odgovaraju\u0107u
  temperaturu.\\n\\nKada se ova funkcija aktivira, gasi se LED lampica na dugmetu
  AUTO. Kada je ova funkcija aktivirana, jedina mogu\u0107a ru\u010dna pode\u0161avanja
  su pode\u0161avanje brzine ventilatora i isklju\u010divanje grejanja zadnjeg stakla.\\n\\nKada
  se pritisne dugmad B, C ili AUTO, kontrolni sistem klime \u0107e deaktivirati funkciju
  MAX-DEF.\\n\\nSelekcijom distribucije na prostor za noge/ vetrobransko staklo ili
  samo na vetrobransko staklo aktivira se kompresor kontrolnog sistema klime (upaljena
  LED lampica na dugmetu A/C), a recirkulacija vazduha je pode\u0161ena na usisavanje
  spolja\u0161njeg vazduha (uga\u0161ena LED lampica na dugmetu ).\\n\\nOvakav na\u010din
  rada garantuje optimalnu vidljivost kroz prozore. Me\u0111utim, uvek postoji mogu\u0107nost
  ru\u010dnog upravljanja recirkulacijom vazduha i kompresorom kontrolnog sistema
  klime.\\n\\nODMAGLJIVANJE / ODMRZAVANJE ZADNJEG GREJANOG STAKLA\\n\\nPritisnite
  dugme  da aktivirate odmagljivanje / odmrzavanje zadnjeg grejanog stakla.\\n\\nNa
  efektivno aktiviranje ove funkcije ukazuje paljenje lampice upozorenja  na instrument
  plo\u010di.\\n\\nOva funkcija se automatski gasi posle oko 20 minuta ili kada se
  ugasi motor. Ne\u0107e se automatski upaliti kada se slede\u0107i put upali motor.\\n\\nZa
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno, pritisnite dugme  da aktivirate
  odmagljivanje / odmrzavanje retrovizora na vratima i grejane mlaznice (za verzije
  / tr\u017ei\u0161ta za koje je predvideno).\\n\\nVA\u017dNO: nemojte stavljati nikakve
  nalepnice sa unutra\u0161nje strane zadnjeg grejanog stakla preko grejnih vlakana,
  kako biste izbegli o\u0161te\u0107enje koje mo\u017ee da dovede do toga da prestanu
  da rade pravilno.\\n\\nGrejano vetrobransko staklo\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nPritisnite dugme C  da aktivirate ovu funkciju.
  Lampica upozorenja  se pali na instrument plo\u010di, kada je ova funkcija aktivna.\\n\\nZa
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno, pritisnite dugme C da aktivirate
  i odmagljivanje / odmrzavanje vetrobranskog stakla (samo sa upaljenim motorom) i
  grejane retrovizore na vratima (za verzije / tr\u017ei\u0161ta za koje je predvideno).\\n\\nOva
  funkcija je tempirana i isklju\u010duje se automatski posle 4 minute za vetrobransko
  staklo i 20 minuta za zadnje staklo i retrovizore na vratima. Pritisnite ponovo
  dugme C da isklju\u010dite ovu funkciju pre tog vremena.\\n\\nPritisnite dugme C
  da ponovo aktivirate grejano vetrobransko staklo:\\n\\n- jednim pritiskanjem dugmeta
  pali se lampica upozorenja  na instrument plo\u010di;\\n- pritiskanjem dugmeta dva
  puta pali se lampica upozorenja  na instrument plo\u010di (ostaje upaljena lampica
  upozorenja zadnjeg grejanog stakla);\\n- pritiskanjem dugmeta po tre\u0107i put
  gase se lampice upozorenja  e .\\n\\nVA\u017dNO: nemojte stavljati nikakve nalepnice
  sa unutra\u0161nje strane zadnjeg stakla preko grejnih vlakana, kako biste izbegli
  o\u0161te\u0107enje.\\n\\nISKLJU\u010cIVANJE KONTROLNOG SISTEMA KLIME\\n\\nPritisnite
  dugme \u2460.\\n\\nKada je isklju\u010den kontrolni sistem klime:\\n\\n- uklju\u010dena
  je recirkulacija vazduha, tako je putni\u010dka kabina izolovana od spolja\u0161nje
  sredine;\\n- isklju\u010den je kompresor;\\n- isklju\u010den je ventilator;\\n-
  mo\u017ee se aktivirati/deaktivirati zadnje grejano staklo.\\n\\nVA\u017dNO: kontrolna
  jedinica kontrolnog sistema klime memori\u0161e pode\u0161ene temperature pre ga\u0161enja
  sistema i ponovo ih uspostavlja pritiskanjem bilo kog dugmeta ovog sistema (izuzev
  dugmeta D).\\n\\nZa ponovno startovanje kontrolnog sistema klime u potpuno automatskom
  na\u010dinu rada, pritisnite dugme AUTO.\\n\\nSTART&STOP\\n\\nAutomatski dvozonski
  kontrolni sistem klime\\n\\nAutomatski dvozonski kontrolni sistem klime upravlja
  funkcijom Start&Stop (uga\u0161en motora kada je brzina vozila jednaka nuli) kako
  bi obezbedio adekvatnu udobnost u vozilu.\\n\\nFunkcija Start&Stop se deaktivira
  dok se ne obezbedi odgovaraju\u0107i nivo udobnosti u putni\u010dkoj kabini; stoga
  se motor ne gasi tokom ovih privremenih faza, \u010dak i kada je brzina vozila jednaka
  nuli.\\n\\nKada je aktivna funkcija Start&Stop (uga\u0161en motora pri brzini vozila
  jednakoj nuli), kontrolni sistem klime \u0107e tra\u017eiti ponovno aktiviranje
  motora, ukoliko se brzo pogor\u0161aju uslovi unutra\u0161nje temperature ili ukoliko
  se tra\u017ei maksimalno hla\u0111enje (\\\"LO\\\") ili brzo odmagljivanje (MAX-DEF).\\n\\nKada
  je aktivna funkcija Start&Stop (uga\u0161en motor pri brzini vozila jednakoj nuli),
  protok vazduha je smanjen kako bi se zadr\u017eali uslovi udobnosti unutar putni\u010dke
  kabine \u0161to je mogu\u0107e du\u017ee kada je sistem u na\u010dinu rada AUTO
  (upaljena LED lampica na dugmetu).\\n\\nKada je izabran slab protok vazduha, kontrolna
  jedinice kontrolnog sistema klime aktivira uvek funkciju Start&Stop.\\n\\nKontrolna
  jedinica kontrolnog sistema klime poku\u0161ava da upravlja neudobno\u0161\u0107u
  koju uzrokuje ga\u0161enje motora (deaktiviranje kompresora i pumpe rashladnog sredstva
  motora) najbolje \u0161to mo\u017ee, me\u0111utim rad kontrolnog sistema klime mo\u017ee
  se pobolj\u0161ati deaktiviranjem funkcije Start&Stop pritiskanjem dugmeta \u2461
  komande na instrument tabli (videti sadr\u017eaj dela \\\"Sistem Start&Stop\\\"
  u ovom poglavlju).\\n\\nVA\u017dNO: U posebno te\u0161kim klimatskim uslovima preporu\u010duje
  se ograni\u010deno kori\u0161\u0107enje funkcije Start&Stop kako bi se spre\u010dilo
  stalno uklju\u010divanje i isklju\u010divanje kompresora, sa posledi\u010dnim brzim
  magljenjem prozora i akumuliranjem vlage sa neprijatnim mirisima u putni\u010dkoj
  kabini.\\n\\nVA\u017dNO: Kada je uklju\u010dena funkcija Start&Stop (motor je uga\u0161en,
  a brzina vozila jednaka nuli), isklju\u010deno je upravljanje automatskom recirkulacijom,
  a vazduh se stalno uzima od spolja, kako bi se smanjila verovatno\u0107a zamagljivanja
  prozora (po\u0161to je uga\u0161en kompresor).\\n\\nDODATNI GREJA\u010c\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOvo omogu\u0107ava br\u017ee
  zagrevanje putni\u010dke kabine u uslovima hladnog vremena.\\n\\nGreja\u010d se
  automatski gasi kada se postignu \u017eeljeni uslovi udobnosti.\\n\\nDodatni greja\u010d
  se automatski aktivira zavisno od uslova sredine i sa upaljenim motorom.\\n\\nVA\u017dNO:
  Ovaj greja\u010d radi samo ako je niska spolja\u0161nja temperatura i temperatura
  sredstva za hla\u0111enje motora. Greja\u010d se ne\u0107e uklju\u010diti ako je
  nizak napon akumulatora.\\n\\nSPOLJA\u0160NJA SVETLA\\n\\nLeva ru\u010dica upravlja
  ve\u0107inom spolja\u0161njih svetala.\\n\\nKlju\u010d za paljenje mora biti u polo\u017eaju
  MAR kako bi se upalila spolja\u0161nja svetla.\\n\\nSa spolja\u0161njim svetlima
  pali se i instrument plo\u010da i razne komande na instrument tabli.\\n\\nDNEVNA
  SVETLA (DRL)\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nDnevna
  svetla se pale automatski kada je klju\u010d za paljenje okrenut na MAR-ON, a prstenasta
  navrtka A sl. 45 je okrenuta na ; ostala svetla i unutra\u0161nja svetla ostaju
  isklju\u010dena.\\n\\nDnevna svetla su alternativa oborenim svetlima za dnevnu vo\u017enju
  u zemljama u kojima su obavezna svetla u toku dana; tamo gde nisu obavezna, kori\u0161\u0107enje
  dnevnih svetala je dozvoljeno.\\n\\nDnevna svetla ne mogu da zamene oborena svetla
  u no\u0107noj vo\u017enji niti u vo\u017enji kroz tunele. Upotreba dnevnog svetla
  regulisana je zakonom o javnim putevima zemlje u kojoj vozite. Po\u0161tujte zakonske
  odredbe.\\n\\n**BO\u010cNA SVETLA I OBORENI SNOP FAROVA**\\n\\nKada je klju\u010d
  za paljenje okrenut u polo\u017eaj MAR, okrenite prstenasti prekida\u010d A sl.
  45 na \\\\( \\\\text{D} \\\\). Ukoliko se aktiviraju oborena svetla, ugasi\u0107e
  se dnevna svetla i upali\u0107e se bo\u010dna i oborena svetla. Na instrument tabli
  \u0107e se upaliti lampica upozorenja \\\\( \\\\text{D} \\\\).\\n\\nKada je klju\u010d
  za paljenje okrenut u polo\u017eaj STOP ili je izva\u0111en, a prstenasti prekida\u010d
  A je okrenuta iz polo\u017eaja \\\\( \\\\text{O} \\\\) u \\\\( \\\\text{D} \\\\),
  pale se sva bo\u010dna svetla i svetla registrarske tablice.\\n\\nNa instrument
  plo\u010di se pali lampica upozorenja \\\\( \\\\text{D} \\\\).\\n\\n**AUTOMATSKA
  KONTROLA SVETLA**\\n\\n(senzor za sumrak)\\n(za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\n\\nOvaj LED infracrveni senzor, kombinovan sa senzorom za
  ki\u0161u i sme\u0161ten na vetrobranskom staklu, registruje promene u spolja\u0161njoj
  ja\u010dini svetla, zavisno od pode\u0161ene osetljivosti na svetlo u meniju pode\u0161avanja:
  \u0161to je ve\u0107a osetljivosti, to je potrebno manje spolja\u0161nje svetlosti
  da se aktiviraju spolja\u0161nja svetla.\\n\\n**Aktiviranje**\\n\\nSenzor za sumrak
  se aktivira kada se prstenasti prekida\u010d A Sl. 45 okrene na \\\\( \\\\text{D}
  \\\\). Na ovaj na\u010din se bo\u010dna svetla i oborena svetla automatski aktiviraju
  zavisno od nivoa spolja\u0161nje svetlosti.\\n\\nNakon automaskog aktiviranja svetla,
  svetla za maglu (za verzije / tr\u017ei\u0161ta za koje je predvideno) i zadnja
  svetla za maglu mogu i dalje biti upaljena. Kada se svetla automatski ugase, gase
  se i prednja i zadnja svetla za maglu (ukoliko su aktivirana). Svetla za maglu se
  moraju ponovo aktivirati ru\u010dno (ukoliko je potrebno), kada se svetla automaski
  upale slede\u0107i put.\\n\\nKada je senzor za sumrak aktivan, nije mogu\u0107e
  neprekidno dr\u017eati upaljena duga\u010dka svetla; dozvoljeno je samo treptanje.
  Da bi ova svetla bila neprekidno upaljena, okrenite prstenastu navrtku A na \\\\(
  \\\\text{D} \\\\) i povucite ru\u010dicu prema upravlja\u010du.\\n\\nNakon deaktiviranja
  koje automatski kontroli\u0161e senzor, prvo se deaktiviraju oborena svetla, pra\u0107ena
  bo\u010dnim svetlima nekoliko sekundi kasnije.\\n\\nUkoliko je senzor aktiviran
  ali nepravilno radi, bo\u010dna svetla i oborena svetla se pale bez obzira na nivo
  spolja\u0161nje svetlosti: displej ukazuje na defekt senzora. Tako\u0111e je mogu\u0107e
  deaktivirati senzor i upaliti svetla koja \u017eelite, ukoliko je potrebno.\\n\\nVA\u017dNO:
  Senzor ne mo\u017ee da registruje postojanje magle. Ova svetla se stoga moraju upaliti
  ru\u010dno u ovim okolnostima.\\n\\n**DUGA\u010cKA SVETLA**\\n\\nZa aktiviranje
  duga\u010dkog svetla, povucite ru\u010dicu prema upravlja\u010du, kada je prstenasta
  navrtka u polo\u017eaju 3. Lampica upozorenja 3 \u0107e se upaliti na instrument
  tabli.\\n\\nKada ru\u010dicu ponovo povu\u010dete prema upravlja\u010du, deaktivira\u0107e
  se duga\u010dka svetla, ponovo se aktiviraju oborena svetla, a lampica upozorenja
  3 se gasi.\\n\\nNije mogu\u0107e upaliti duga\u010dka svetla da neprekidno rade,
  ako je aktivan automatski kontrolni sistem svetla.\\n\\n**ABLENDOVANJE**\\n\\nFarovi
  mogu da ablenduju ako se povu\u010de ru\u010dica prema upravlja\u010du (nestabilan
  polo\u017eaj). Lampica upozorenja 3 \u0107e se upaliti na instrument tabli.\\n\\n**POKAZIVA\u010cI
  PRAVCA**\\n\\nNamestite ru\u010dicu u stabilan polo\u017eaj:\\n\\n- **nagore**:
  aktiviranje desnog pokaziva\u010da pravca;\\n- **nadole**: aktiviranje levog pokaziva\u010da
  pravca.\\n\\nNa instrument plo\u010di \u0107e treptati lampica upozorenja 4 ili
  5.\\n\\nPokaziva\u010di pravca se automatski gase kada se upravlja\u010d ispravi.\\n\\n**Funkcija
  menjanja trake**\\n\\nUkoliko \u017eelite da signalizirate promenu trake, namestite
  levu ru\u010dicu u nestabilan polo\u017eaj u trajanju od manje od jedne sekunde.\\n\\nPokaziva\u010d
  pravca na izabranoj strani bi\u0107e aktiviran i trepnu\u0107e 5 puta, a zatim \u0107e
  se automatski ugasiti.\\n\\n**Svetla za krivine**\\n\\nKada su upaljena oborena
  svetla, a brzina je ispod 40 km/h, ukoliko je ugao rotacije upravlja\u010da velik
  ili su upaljeni pokaziva\u010di pravca, upali\u0107e se svetlo (ugra\u0111eno u
  svetlu za maglu) na relevantnoj strani kako bi pobolj\u0161alo no\u0107nu vidljivost.\\n\\n**URE\u0110AJ
  \\\"PRATI ME DO KU\u0106E\\\"**\\n\\nOvo omogu\u0107ava osvetljavanje prostora ispred
  vozila tokom ograni\u010denog vremena trajanja.\\n\\nAktiviranje: kada je klju\u010d
  za paljenje okrenut na STOP ili je izva\u0111en, povucite ru\u010dicu prema upravlja\u010du
  u roku od 2 minute od trenutka kada ugasite motor.\\n\\nSvaki put kada se pomeri
  ru\u010dica, svetla ostaju upaljena dodatnih 30 sekundi do maksimuma od 210 sekundi;
  zatim se svetla gase automatski.\\n\\nIsto tako, svakim pokretanjem ru\u010dice,
  pali se lampica upozorenja \\\\( \\\\text{300} \\\\) na instrument tabli. Displej
  pokazuje poruku i pode\u0161eno vreme za ovu funkciju.\\n\\nLampica upozorenja \\\\(
  \\\\text{300} \\\\) se pali \u010dim se ru\u010dica pomeri i ostaje upaljena dok
  se ova funkcija automatski ne deaktivira. Svako pomeranje ru\u010dice samo pove\u0107ava
  du\u017einu vremena tokom kojeg \u0107e svetla ostati upaljena.\\n\\nDeaktiviranje:
  dr\u017eite ru\u010dicu povu\u010denu prema upravlja\u010du du\u017ee od dve sekunde.\\n\\n---\\n\\n**PRANJE
  PROZORA**\\n\\nDesna ru\u010dica kontroli\u0161e rad brisa\u010da / pera\u010da
  vetrobranskog stakla i brisa\u010da / pera\u010da zadnjeg grejanog stakla.\\n\\n**PERA\u010c/BRISA\u010c
  VETROBRANSKOG STAKLA**\\n\\nOve ure\u0111aje je mogu\u0107e koristiti samo kada
  je klju\u010d za paljenje okrenut u polo\u017eaj MAR.\\n\\nPrstenastu navrtku A
  sl. 46 je mogu\u0107e pomerati u \u010detiri razli\u010dita polo\u017eaja:\\n\\n-
  isklju\u010den brisa\u010d vetrobranskog stakla.\\n- isprekidan rad.\\n- neprekidan
  spor rad.\\n- neprekidan brz rad.\\n\\n---\\n\\nslika 46\\n\\nPomerite ru\u010dicu
  nagore (nestabilan polo\u017eaj) kako biste ograni\u010dili rad na vreme dr\u017eanja
  ove ru\u010dice u ovom polo\u017eaju. Kada se otpusti, ru\u010dica se vra\u0107a
  u standardni polo\u017eaj i brisa\u010d \u0107e automatski biti zaustavljen.\\n\\nKada
  je prstenasta navrtka A sl. 46 u poziciji OD, brisa\u010d vetrobranskog stakla \u0107e
  automatski prilagoditi brzinu rada brzini vozila.\\n\\nPrilikom hoda unazad, brisa\u010d
  zadnjeg stakla se automatski aktivira kada rade brisa\u010di vetrobranskog stakla.\\n\\n**Nemojte
  koristiti brisa\u010de vetrobranskog stakla za skidanje slojeva snega ili leda sa
  vetrobranskog stakla. Ukoliko biste to uradili, brisa\u010di vetrobranskog stakla
  bi bili izlo\u017eeni preteranom naporu, tako da je mogu\u0107e da do\u0111e do
  intervencije prekida\u010da za ga\u0161enje motora brisa\u010da, \u0161to bi obustavilo
  njihov rad na nekoliko sekundi. Ukoliko ne nastave da rade (\u010dak ni posle okretanja
  klju\u010da i ponovnog startovanja motora vozila), obratite se Fiatovom dileru.**\\n\\n**Nemojte
  uklju\u010divati brisa\u010de vetrobranskog stakla kada su metlice podignute od
  vetrobranskog stakla.**\\n\\n**Funkcija \\\"pametnog pranja\\\"**\\n\\nPovucite
  polugu prema upravlja\u010du (nestabilan polo\u017eaj) kako biste aktivirali pera\u010d
  vetrobranskog stakla.\\n\\nDr\u017ee\u0107i ru\u010dicu povu\u010denu du\u017ee
  od pola sekunde, mogu\u0107e je istovremeno uklju\u010diti mlaz pera\u010da i brisa\u010de,
  sa samo jednim pokretom.\\n\\nBrisa\u010di prestaju da rade po \u0161to naprave
  tri pokreta posle pu\u0161tanja ru\u010dice.\\n\\nJo\u0161 jedan pokret posle oko
  \u0161est sekundi zavr\u0161ava ciklus brisanja (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno).\\n\\n**SENZOR ZA KI\u0160U**\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOvaj senzor se nalazi iza unutra\u0161njeg retrovizora
  i u kontaktu je sa vetrobranskim staklom sl. 47 tako da mo\u017ee da registruje
  prisustvo ki\u0161e i shodno tome da upravlja \u010di\u0161\u0107enjem vetrobranskog
  stakla zavisno od koli\u010dine vode na staklu.\\n\\nSenzor ima raspon pode\u0161avanja
  koji varira progresivno od mirovanja brisa\u010da (nema pokreta) kada je vetrobransko
  staklo suvo, do brisa\u010da u 2. neprekidnoj brzini (brz neprekidan rad) u slu\u010daju
  intenzivne ki\u0161e.\\n\\nAktiviranje\\n\\nSenzor se aktivira kada je prstenasta
  navrtka A sl. 46 okrenuta u polo\u017eaj \\\\(\\\\text{ON}\\\\): u\u010destalost
  pokreta brisa\u010da vetrobranskog stakla se tada pode\u0161ava zavisno od koli\u010dine
  vode na vetrobranskom staklu.\\n\\nNa aktiviranje senzora signalizira jedan pokret
  koji pokazuje da je komanda primljena.\\n\\nOsetljivost senzora za ki\u0161u mo\u017ee
  se podesiti putem menija pode\u0161avanja (videti deo \\\"Stavke menija\\\" u ovom
  odeljku).\\n\\nNa promenu u osetljivosti tokom rada senzora za ki\u0161u signalizira
  tako\u0111e jedan pokret brisa\u010da. Do ovog pokreta dolazi tako\u0111e kada je
  suvo vetrobransko staklo.\\n\\nVA\u017dNO: Odr\u017eavajte \u010disto\u0107u stakla
  na mestu gde se nalazi senzor.\\n\\nUkoliko se koristi pera\u010d vetrobranskog
  stakla sa aktiviranim senzorom za ki\u0161u, izvr\u0161i\u0107e se normalan ciklus
  pranja, posle koga \u0107e senzor za ki\u0161u da nastavi sa svojim normalnim automatskim
  radom.\\n\\nDeaktiviranje\\n\\nPomerite prstenasti prekida\u010d na ru\u010dici
  iz polo\u017eaja \\\\(\\\\text{ON}\\\\) ili okrenite klju\u010d za paljenje u polo\u017eaj
  STOP.\\n\\nUkoliko je klju\u010d za paljenje okrenut u polo\u017eaj STOP, a prstenasti
  prekida\u010d A ostavljen u polo\u017eaju \\\\(\\\\text{ON}\\\\), ne\u0107e biti
  ciklusa brisanja prilikom slede\u0107eg startovanja (klju\u010d za paljenje u polo\u017eaju
  MAR-ON) \u010dak ni u slu\u010daju ki\u0161e.\\n\\nOvo spre\u010dava ne\u017eeljeno
  aktiviranje senzora za ki\u0161u kada se startuje motor (npr. kada se vetrobransko
  staklo pere ru\u010dno ili kada su se brisa\u010di zalepili za vetrobransko staklo
  zbog leda).\\n\\nZa ponovno uspostavljanje automatskog rada senzora za ki\u0161u,
  okrenite prstenastu navrtku A iz polo\u017eaja \\\\(\\\\text{ON}\\\\) u polo\u017eaj
  \\\\(\\\\text{OFF}\\\\), a zatim vratite prstenasti prekida\u010d u polo\u017eaj
  \\\\(\\\\text{ON}\\\\).\\n\\nKada se senzor za ki\u0161u ponovo aktivira primenom
  nekog od prethodno opisanih postupaka, jedan pokret brisa\u010da vetrobranskog stakla
  \u0107e ukazati na njegovo ponovno aktiviranje, bez obzira na stanje na vetrobranskom
  staklu.\\n\\nU slu\u010daju nepravilnog rada senzora za ki\u0161u dok je aktiviran,
  brisa\u010di vetrobranskog stakla \u0107e isprekidano raditi brzinom koja odgovara
  pode\u0161enoj osetljivosti senzora za ki\u0161u, bez obzira da li ima ki\u0161e
  na staklu ili ne (kod nekih verzija se na displeju ukazuje na defekt senzora).\\n\\nSenzor
  nastavlja da radi i mogu\u0107e je podesiti brisa\u010d vetrobranskog stakla na
  neprekidan na\u010din rada (1. ili 2. brzina). Indikacija defekta ostaje dokle god
  je senzor aktivan.\\n\\nSenzor za ki\u0161u je u stanju da prepozna i da se automatski
  podesi kada postoje slede\u0107i uslovi:\\n\\n- prljav\u0161tina na kontrolisanoj
  povr\u0161ini (so, prljav\u0161tina itd.);\\n- tragovi vode uzrokovani istro\u0161enim
  metlicama brisa\u010da stakla;\\n- razlika izme\u0111u dana i no\u0107i.\\n\\nNemojte
  aktivirati senzor za ki\u0161u kada pere vozilo u servisu za automatsko pranje vozila.\\n\\nNastojte
  da ure\u0111aj bude isklju\u010den ukoliko ima leda na vetrobranskom staklu\\n\\nUPAZORENJE\\n\\nNastojte
  da ure\u0111aj bude isklju\u010den svaki put kada morate da perete vetrobransko
  staklo.\\n\\nPERA\u010c/BRISA\u010c ZADNJEG STAKLA\\n\\nMo\u017ee se koristiti samo
  kada je klju\u010d za paljenje u polo\u017eaju MAR.\\n\\nAktiviranje\\n\\nOkrenite
  prstenasti prekida\u010d B sl. 46 iz polo\u017eaja O u polo\u017eaj kako biste uklju\u010dili
  brisa\u010d zadnjeg stakla kao \u0161to sli\u010di:\\n\\n- isprekidan na\u010din
  rada kada ne radi brisa\u010d vetrobranskog stakla;\\n- sinhronizovan na\u010din
  rada (u pola brzine brisa\u010da vetrobranskog stakla) kada radi brisa\u010d vetrobranskog
  stakla;\\n- neprekidan na\u010din rada kada je uklju\u010den hod unazad.\\n\\nKada
  je uklju\u010den brisa\u010d vetrobranskog stakla i vozilo je u hodu unazad, brisanje
  zadnjeg stakla \u0107e biti neprekidno i na isti na\u010din kao i vetrobranskog
  stakla. Pomeranjem ru\u010dice prema instrument tabli (nestabilan polo\u017eaj)
  aktivira\u0107e se mlaz pera\u010da zadnjeg stakla. Dr\u017eite ovu ru\u010dicu
  ovako pomerenu du\u017ee od pola sekunde kako biste aktivirali i brisa\u010d zadnjeg
  stakla. Otpu\u0161tanjem ru\u010dice aktivira\u0107e se funkcija pametnog pranja,
  kako je opisano za brisa\u010d vetrobranskog stakla.\\n\\nDeaktiviranje\\n\\nOva
  funkcija prestaje kada se otpusti ru\u010dica.\\n\\nNemojte koristiti brisa\u010d
  zadnjeg stakla za skidanje slojeva snega ili leda. Ukoliko biste to uradili, brisa\u010d
  bi mogao biti izlo\u017een preteranom naporu i moglo bi do\u0107i do intervencije
  za\u0161tite njegovog motora, \u0161to bi obustavilo njegov rad na nekoliko sekundi.
  Ukoliko posle toga ne nastavi da radi, obratite se Fiatovom dileru.\\n\\nELEKTRONSKA
  KONTROLA BRZINE\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOvo
  je elektronski kontrolisan ure\u0111aj za pomo\u0107 u vo\u017enji koji omogu\u0107ava
  odr\u017eavanje \u017eeljene brzine vozila, bez potrebe da se pritiska pedala gasa.\\nOvaj
  ure\u0111aj se mo\u017ee koristiti kod brzina ve\u0107ih od 30 km/h na dugim potezima
  suvih, pravih puteva sa malo varijacija (npr. autoputevi).\\nStoga se ne preporu\u010duje
  kori\u0161\u0107enje ovog ure\u0111aja na vangradskim putevima sa saobra\u0107ajem.
  Nemojte koristiti ovaj ure\u0111aj u gradu.\\n\\nAKTIVIRANJE URE\u0110AJA\\n\\nOkrenite
  prstenasti prekida\u010d A sl. 48 na . Paljenje lampice upozorenja na instrument
  tabli, a kod nekih verzija poruka na displeju, ukazuju na aktiviranje ovog ure\u0111aja.\\n\\nFunkciju
  pode\u0161avanja brzine nije mogu\u0107e aktivirati u I. brzini niti u hodu unazad;
  aktiviranje ove funkcije se preporu\u010duje u 4. ili jo\u0161 ve\u0107oj brzini.\\nKada
  vozite nizbrdo sa ovim ure\u0111ajem aktivnim, mogu\u0107e je da se brzina vozila
  malo pove\u0107a u odnosu na memorisanu.\\n\\nMemorisanje brzine vozila\\n\\nPostupite
  kao \u0161to sli\u010di:\\n- okrenite prstenasti prekida\u010d A sl. 48 u i pritisnite
  pedalu gasa tako da vozilo dostigne \u017eeljenu brzinu;\\n- pomerajte ru\u010dicu
  nagore (+) tokom barem jedne sekunde, zatim je otpustite: brzina je memorisana i
  stoga mo\u017eete da otpustite pedalu gasa.\\n\\nUkoliko je potrebno (na primer
  prilikom preticanja), mo\u017eete pove\u0107ati brzinu jednostavnim pritiskanjem
  pedale gasa: kad otpustite pedalu, vozilo se vra\u0107a na prethodno memorisanu
  brzinu.\\n\\nPonovno uspostavljanje memorisane brzine\\n\\nUkoliko je ure\u0111aj
  deaktiviran, na primer pritiskanjem pedale ko\u010dnice ili kva\u010dila, pode\u0161ena
  brzina se mo\u017ee ponovo uspostaviti kao \u0161to sli\u010di:\\n- pove\u0107avajte
  brzinu progresivno dok ne dostignete brzinu blizu one koja je memorisana;\\n- ubacite
  menja\u010d u polo\u017eaj u kom je bio u vreme kada je brzina memorisana;\\n- pritisnite
  dugme CANC RES (B sl. 48)\\n\\nPOVE\u0106AVANJE MEMORISANE BRZINE\\n\\nOvo se mo\u017ee
  uraditi na dva na\u010dina:\\n\\n- pritiskanjem gasa i memorisanjem nove dobijene
  brzine\\n- pomeranjem ru\u010dice nagore (+) dok se ne dobije nova brzina, koja
  \u0107e biti automatski memorisana.\\n\\nSvako pomeranje ru\u010dice odgovara pove\u0107anju
  brzine od oko 1 km/h, dok se brzina neprekidno pove\u0107ava, dr\u017eanjem ru\u010dice
  pomerene nagore.\\n\\nSMANJIVANJE MEMORISANE BRZINE\\n\\nOvo se mo\u017ee uraditi
  na dva na\u010dina:\\n\\n- deaktiviranjem ure\u0111aja, a zatim memorisanjem nove
  brzine\\n- pomeranjem poluge nadole (-) dok se ne dostigne nova brzina, koja \u0107e
  automatski ostati memorisana.\\n\\nSvako pomeranje poluge odgovara smanjenju brzine
  od oko 1 km/h, dok dr\u017eanje ru\u010dice pomerene nadole, neprekidno smanjuje
  brzinu.\\n\\nDEAKTIVIRANJE URE\u0110AJA\\n\\nVoza\u010d mo\u017ee da deaktivira
  ovaj ure\u0111aj na slede\u0107e na\u010dine:\\n\\n- okretanjem prstenaste navrtke
  A u O;\\n- ga\u0161enjem motora\\n- priiskanjem pedale ko\u010dnice, kva\u010dila
  ili gasa; u ovom poslednjem slu\u010daju sistem nije potpuno deaktiviran, ve\u0107
  daje prioritet zahtevanoj akceleraciji. Ure\u0111aj ostaje i dalje aktivan, bez
  potrebe da se pritiska dugme CANC RES za vra\u0107anje na prethodno stanje po zavr\u0161etku
  akceleracije.\\n\\nAutomatsko deaktiviranje\\n\\nUre\u0111aj se automatski deaktivira
  u slede\u0107im slu\u010dajevima:\\n\\n- intervencija sistema ABS ili ESC (elektronska
  kontrola stabilnosti);\\n- brzina vozila je ispod pode\u0161ene granice\\n- u slu\u010daju
  otkazivanja sistema.\\n\\nUPAZORENJE\\n\\nKada vozite sa ovim ure\u0111ajem aktivnim,
  nemojte nikada prebacivati polugu menja\u010da u neutralan polo\u017eaj.\\n\\nUPAZORENJE\\n\\nU
  slu\u010daju gre\u0161aka ili otkazivanja ovog ure\u0111aja okrenite dugme A u O
  i obratite se Fiatovom dileru.\\n\\n**OGRANI\u010cIVA\u010c BRZINE**\\n\\nOvaj ure\u0111aj
  omogu\u0107ava ograni\u010denje brzine vozila na vrednosti koje voza\u010d mo\u017ee
  da podesi.\\n\\nMaksimalna brzina se mo\u017ee podesiti i kada vozilo miruje i kada
  je u pokretu. Minimalna brzina koja se mo\u017ee podesiti je 30 km/h.\\n\\nKada
  je ure\u0111aj aktivan, brzina vozila zavisi od pritiska na pedali gasa, dok se
  ne dostigne programirano ograni\u010denje brzine (videti deo \\\"Programiranje ograni\u010denja
  brzine\\\").\\n\\nUkoliko je potrebno (na primer u slu\u010daju preticanja), mogu\u0107e
  je prekora\u010diti programirano ograni\u010denje brzine, pritiskanjem pedale gasa
  do kraja:\\n\\nPostepenim smanjenjem pritiska na pedali gasa, do\u0107i \u0107e
  do ponovnog aktiviranja ove funkcije \u010dim brzina vozila padne ispod programirane
  brzine.\\n\\n**Aktiviranje ure\u0111aja**\\n\\nZa aktiviranje ovog ure\u0111aja
  okrenite prstenastu navrtku A sl. 48 na .\\n\\nNa aktiviranje ure\u0111aja ukazuje
  paljenje lampice upozorenja na instrument plo\u010di i, kod nekih verzija, poruka
  na displeju plus poslednja programirana vrednost brzine.\\n\\n**Programiranje ograni\u010denja
  brzine**\\n\\nOgrani\u010denje brzine se mo\u017ee programirati bez obaveznog aktiviranja
  ovog ure\u0111aja.\\n\\nZa memorisanje ve\u0107e vrednosti brzine od one koja je
  prikazana na displeju, pomerite ru\u010dicu A nagore (+). Svako pomeranje ru\u010dice
  odgovara pove\u0107anju brzine od oko 1 km/h, dok dr\u017eanje ru\u010dice pomerene
  nagore pove\u0107ava brzinu za po 5 km/h.\\n\\nZa memorisanje manje vrednosti brzine
  od one koja je prikazana na displeju, pomerite ru\u010dicu A nadole (-). Svako pomeranje
  ru\u010dice odgovara smanjenju brzine od oko 1 km/h, dok dr\u017eanje ru\u010dice
  pomerene nadole smanjuje brzinu za po 5 km/h.\\n\\n**Aktiviranje / deaktiviranje
  ure\u0111aja**\\n\\nPritisnite dugme CANC RES da aktivirate / deaktivirate ure\u0111aj.\\n\\nNa
  aktiviranje ovog ure\u0111aja ukazuje paljenje lampice upozorenja na instrument
  plo\u010di.\\n\\nUmesto toga na deaktiviranje ove funkcije ukazuje na displeju.\\n\\n**Prekora\u010denje
  programirane brzine**\\n\\nPritiskanjem pedale gasa do kraja, mogu\u0107e je prekora\u010diti
  programirani brzinu, \u010dak i kada je ovaj ure\u0111aj aktivan.\\n\\nU tom slu\u010daju
  se ure\u0111aj privremeno deaktivira, a pode\u0161ena brzina trepti na displeju.\\n\\nSmanjenje
  brzine ispod programirane vrednosti, automatski ponovo aktivira ovaj ure\u0111aj.\\n\\nTreptanje
  programirane brzine\\n\\nProgramirana brzina trepti u slede\u0107im slu\u010dajevima:\\n\\n-
  kada je pedala gasa pritisnuta do kraja, a brzina vozila je ve\u0107a od programirane
  brzine;\\n- kada ure\u0111aj ne mo\u017ee da smanji brzinu vozila usled nagiba puta;\\n-
  u slu\u010daju naglog ubrzavanja.\\n\\nDeaktiviranje ure\u0111aja\\n\\nZa deaktiviranje
  ure\u0111aja okrenite prstenasti prekida\u010d A u O.\\n\\nNa deaktiviranje ure\u0111aja
  ukazuje ga\u0161enje lampice upozorenja na instrument plo\u010di i, kod nekih verzija,
  poruka i na displeju.\\n\\nAutomatsko deaktiviranje ure\u0111aja\\n\\nUre\u0111aj
  se automatski deaktivira u slu\u010daju gre\u0161ke u sistemu.\\n\\nKROVNA SVETLA\\n\\nPREDNJA
  KROVNA SVETLA\\n\\nPrekida\u010d A sl. 49 uklju\u010duje / isklju\u010duje krovna
  svetla.\\n\\nPolo\u017eaji prekida\u010da A:\\n\\n- sredi\u0161nji polo\u017eaj:
  svetla C i E se pale/gase kada se vrata otvore/zatvore;\\n- pritisnut ulevo (polo\u017eaj
  OFF /isklju\u010den/): svetla C i E su stalno uga\u0161ena;\\n- pritisnut udesno
  (polo\u017eaj ): svetla C i D su stalno upaljena.\\n\\nSvetla se postepeno pale/gase.\\n\\nPrekida\u010d
  B uklju\u010duje / isklju\u010duje svetlo C.\\n\\nPrekida\u010d D uklju\u010duje
  / isklju\u010duje svetlo E.\\n\\nVA\u017dNO: Pre izlaska iz vozila proverite da
  li su uga\u0161ena krovna svetla; tako \u0107ete spre\u010diti pra\u017enjenje akumulatora
  kada zatvorite vrata. U svakom slu\u010daju, ukoliko neko svetlo gre\u0161kom ostane
  upaljeno, krovna svetla \u0107e se automatski ugasiti posle oko 15 minuta od ga\u0161enja
  motora.\\n\\nTEMPIRANJE KROVNOG SVETLA\\n\\nNeke verzije imaju dva na\u010dina tempiranog
  rada, radi lak\u0161eg ulaska u vozilo / izlaska iz vozila, posebno no\u0107u ili
  u slabo osvetljenim obastima.\\n\\nTempiranje prilikom ulaska u vozilo\\nKrovna
  svetla se uklju\u010duju prema slede\u0107im na\u010dinima rada:\\n- na oko 10 sekundi
  kada se vrata otklju\u010daju;\\n- na oko 3 minute kada se otvore jedna vrata;\\n-
  na oko 10 sekundi kada se vrata zatvore.\\n\\nTempirano vreme se prekida kada se
  klju\u010d za paljenje okre\u0107e u polo\u017eaj MAR-ON.\\n\\nSvetla se gase na
  tri na\u010dina:\\n- kada se sva vrata zatvore, prestaje rad tajmera programiranog
  na 3 minute i po\u010dinje da radi drugi tajmer programiran na 10 sekundi. Ovaj
  tajmer prestaje da radi, kada se klju\u010d okrene na MAR-ON;\\n- kada se zaklju\u010daju
  vrata (bilo daljinskom komandom ili klju\u010dem na strani voza\u010devih vrata),
  gase se krovna svetla;\\n- unutra\u0161nja svetla se gase u svakom slu\u010daju
  posle 15 minuta kako bi se za\u0161titio akumulator od pra\u017enjenja;\\n\\nTempiranje
  prilikom izlaska iz vozila\\nPosle va\u0111enja klju\u010da iz prekida\u010da paljenja,
  krovna svetla se uklju\u010duju kao \u0161to sledi:\\n- ako se klju\u010d za paljenje
  izvadi u roku od 3 minute od ga\u0161enja motora, uklju\u010duju se krovna svetla
  na 10 sekundi;\\n- na oko 3 minute, kada se otvore jedna vrata;\\n- na oko 10 sekundi,
  kada se zatvore jedna vrata;\\nTempiranje prestaje automatski, kada se vrata zaklju\u010daju.\\n\\nZADNJE
  KROVNO SVETLO\\n\\nVerzije bez krova na otvaranje (ili staklenog krova)\\nPritisnite
  poklopac A sl. 50 da upalite / ugasite svetlo. Svetlo \u0107e ostati upaljeno nekoliko
  sekundi po \u0161to se zatvore vrata, a onda \u0107e se automatski ugasiti. Svetlo
  se gasi u svakom slu\u010daju kada se klju\u010d za paljenje okrene u polo\u017eaj
  MAR-ON. Svetlo se automatski gasi posle nekoliko minuta, ako neka vrata ostanu otvorena.
  Da biste ga ponovo upalili, ukoliko je potrebno, otvorite neka druga vrata ili zatvorite,
  pa ponovo otvorite ista vrata ili pritisnite poklopac A.\\n\\nVerzije sa krovom
  na otvaranje (ili sa staklenim krovim)\\n\\nVerzije sa krovom na otvaranje (ili
  sa staklenim krovim) imaju dva krovna svetla A sl. 51 sa strane (iznad zadnjih vrata).
  Za uklju\u010divanje / isklju\u010divanje svetla, pritisnite znak + na poklopcu
  krovnog svetla. Zadnja krovna svetla se tako\u0111e uklju\u010duju u istim okolnostima
  koje uzrokuju uklju\u010divanje prednjeg krovnog svetla.\\n\\nKROVNO SVETLO\\nPRTLJA\u017dNOG
  PROSTORA\\n\\nKrovno svetlo A sl. 52 nalazi se s leve strane prtlja\u017enog prostora.
  Ono se automatski uklju\u010duje kada se otvori prtlja\u017eni prostor, i isklju\u010duje
  kada se on zatvori.\\n\\nOvo svetlo se uklju\u010duje / isklju\u010duje nezavisno
  od polo\u017eaja klju\u010da za paljenje.\\n\\nUNUTRA\u0160NJA POMO\u0106NA SVETLA\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOva svetla se kod nekih
  verzija ugra\u0111uju iza suncobra na.\\n\\nKoristite prekida\u010d A sl. 53 da
  uklju\u010dite / isklju\u010dite ova svetla.\\n\\nSVETLO U PROSTORU ZA SITNE STVARI
  I DOKUMENTA\\n\\nKrovno svetlo A sl. 54 se automatski uklju\u010duje kada se otvori
  prostor za sitne stvari i dokumenta i isklju\u010duje se kada se on zatvori.\\n\\nOvo
  svetlo se uklju\u010duje / isklju\u010duje nezavisno od polo\u017eaja klju\u010da
  za paljenje.\\n\\nKOMANDE\\n\\nSVETLA ZA UPOZORENJE NA OPASNOST\\n\\nPritisnite
  dugme sa sl. 55 da uklju\u010dite / isklju\u010dite ova svetla. Lampice upozorenja
  \u26a0\ufe0f i \u26a0\ufe0f trep\u0442\u0435 kada su uklju\u010dena svetla za upozorenje
  na opasnost.\\n\\nVA\u017dNO: Upotreba svetla za upozorenje na opasnost regulisana
  je zakonom o javnim putevima zemlje u kojoj vozite: po\u0161tujte zakonske propise.\\n\\nHitno
  ko\u010denje\\n\\nSvetla za upozorenje na opasnost se automatski uklju\u010duju
  kao i lampice upozorenja \u26a0\ufe0f i \u26a0\ufe0f na instrument plo\u010di, u
  slu\u010daju hitnog ko\u010denja.\\n\\nOva svetla se automatski isklju\u010duju
  kada prestane hitno ko\u010denje.\\n\\nSVETLA ZA MAGLU\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nPritisnite dugme \u26a1 sl. 56 da uklju\u010dite
  / isklju\u010dite svetla. LED lampica iznad dugmeta \u0107e se tako\u0111e upaliti
  kada su ova svetla uklju\u010dena.\\n\\nZADNJE SVETLO ZA MAGLU\\n\\nPritisnite dugme
  \u26a1 sl. 56 da uklju\u010dite / isklju\u010dite svetlo. LED lampica iznad dugmeta
  \u0107e se tako\u0111e upaliti kada je ovo svetlo uklju\u010deno.\\n\\nZadnje svetlo
  za maglu se uklju\u010duje samo kada su uklju\u010dena oborena svetla ili prednja
  svetla za maglu. Pritisnite ponovo dugme da isklju\u010dite ovo svetlo, ili isklju\u010dite
  oborena svetla ili prednja svetla za maglu (za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno).\\n\\nCENTRALNI SISTEM ZAKLJU\u010cAVANJA\\n\\nPritisnite dugme  sl.
  57 da istovremeno zaklju\u010date sva vrata. LED lampica iznad dugmeta se pali kada
  su sva vrata zaklju\u010dana.\\n\\nZaklju\u010davanje je mogu\u0107e nezavisno od
  polo\u017eaja klju\u010da za paljenje.\\n\\nELEKTRI\u010cNI SERVO UPRAVLJA\u010c
  (DUPLI POGON)\\n\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nPritisnite
  dugme CITY sl. 58 da aktivirate ovu funkciju. Kada je ova funkcija aktivna, upali\u0107e
  se re\u010d CITY na instrument plo\u010di.\\n\\nOva funkcija ostaje u memoriji,
  tako da kada se vozilo ponovo startuje, sistem zadr\u017eava pode\u0161avanje koje
  je imao pre ga\u0161enja motora.\\n\\nZa vi\u0161e podataka, pogledajte sadr\u017eaj
  dela \\\"Elektri\u010dni servo upravlja\u010d (dupli pogon)\\\" u ovom poglavlju.\\n\\nslika
  57\\n\\nslika 58\\n\\nslika 59\\n\\nECO FUNKCIJA\\n\\n(za verzije/tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nPritisnite dugme ECO sl. 59 kako biste aktivirali
  ovu funkciju.\\n\\nKada je aktivirana funkcija ECO, vozilo je pode\u0161eno za gradsku
  vo\u017enju, koju karakteri\u0161e manje napora za upravljanje upravlja\u010dem
  (uklju\u010den dupli pogon) i smanjena potro\u0161nja goriva.\\n\\nKada je ova funkcija
  aktivirana, na displeju se kod nekih verzija/tr\u017ei\u0161ta pojavljuje poruka
  o aktiviranju ili deaktiviranju.\\n\\nOva funkcija ostaje u memoriji, tako da kada
  se vozilo ponovo startuje, sistem zadr\u017eava pode\u0161avanje koje je imao pre
  ga\u0161enja motora. Pritisnite ponovo dugme ECO da deaktivirate ovu funkciju i
  vratite pode\u0161avanje za obi\u010dnu vo\u017enju.\\n\\n**SISTEM ZA PREKID DOVODA
  GORIVA**\\n\\nOvaj sistem interveni\u0161e u slu\u010daju sudara i dovodi do:\\n\\n-
  prekida u napajanju gorivom i samim tim ga\u0161enja motora\\n- automaskog otklju\u010davanja
  vrata\\n- automatskog uklju\u010divanja unutra\u0161njih svetala\\n- uklju\u010divanja
  svetla upozorenja na opasnost.\\n\\nKod nekih verzija, poruka na displeju ukazuje
  na intervenciju ovog sistema.\\n\\n**VA\u017dNO:** Pa\u017eljivo proverite da li
  curi gorivo iz vozila, na primer u prostoru za motor, ispod vozila ili blizu rezervoara
  za gorivo. Posle sudara, okrenite klju\u010d za paljenje na STOP kako biste spre\u010dili
  pra\u017enjenje akumulatora.\\n\\nDa ponovo uspostavite pravilan rad vozila, postupite
  kao \u0161to slijedi:\\n\\n- okrenite klju\u010d za paljenje u polo\u017eaj MAR;\\n-
  aktivirajte desni pokaziva\u010d pravca;\\n- deaktivirajte desni pokaziva\u010d
  pravca;\\n- aktivirajte levi pokaziva\u010d pravca;\\n- deaktivirajte levi pokaziva\u010d
  pravca;\\n- aktivirajte desni pokaziva\u010d pravca;\\n- deaktivirajte desni pokaziva\u010d
  pravca;\\n- aktivirajte levi pokaziva\u010d pravca;\\n- deaktivirajte levi pokaziva\u010d
  pravca;\\n- okrenite klju\u010d za paljenje u polo\u017eaj STOP.\\n\\n**UPPOZORENJE**\\n\\nUkoliko
  posle sudara ose\u0107ate miris goriva ili primetite da ono curi iz sistema za gorivo
  nemojte ponovo aktivirati sistem, kako biste izbegli rizik od po\u017eara.\\n\\nUNUTRA\u0160NJA
  OPREMA\\n\\nPROSTORI ZA ODLAGANJE STVARI\\n\\nGornji prostor\\n\\nZa otvaranje ovog
  prostora pritisnite dugme A sl. 60, tako \u0161to \u0107ete ga gurnuti nagore i
  dr\u017eite ga pritisnuto dok rotirate klapnu kao \u0161to pokazuje slika, dok ne
  do\u0111ete do potpuno otvorenog polo\u017eaja.\\n\\nVA\u017dNO: Nemojte stavljati
  predmete takve veli\u010dine da ne mo\u017eete da potpuno zatvorite ovu pregradu.
  Proverite da li je pregrada potpuno zatvorena tokom vo\u017enje.\\n\\nKod nekih
  verzija ovaj prostor mo\u017ee imati hla\u0111enje kroz ventilacioni otvor za vazduh
  povezan na kontrolni sistem klime (upotrebite to\u010dki\u0107 B sl. 61 da podesite
  brzinu protoka vazduha u ovom prostoru).\\n\\nFunkcija hla\u0111enja funkcioni\u0161e
  samo kada je uklju\u010den kontrolni sistem klime.\\n\\nDonji prostor\\n\\nZa otvaranje
  ovog prostora upotrebite ru\u010dicu A sl. 62. Kada se ovaj prostor otvori pali
  se svetlo da ga osvetli.\\n\\nProstor ispod sedi\u0161ta\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nNeke verzije imaju prostor za odlaganje stvari ispod
  suvoza\u010devog sedi\u0161ta sl. 63: nemojte ga koristiti za odlaganje predmeta
  koji su te\u017ei od 1,5 kg.\\nZa otvaranje ovog prostora koristite ru\u010dicu
  A.\\n\\nUTI\u010cNICE ZA STRUJU\\nUti\u010dnica za struju u putni\u010dkoj kabini\\nNalazi
  se u centralnom tunelu sl. 64, blizu poluge ru\u010dne ko\u010dnice. U funkciji
  je samo kada je klju\u010d za paljenje u polo\u017eaju MAR-ON.\\nVA\u017dNO: Nemojte
  uklju\u010divati ure\u0111aje \u010dija je snaga ve\u0107a od 180 W u ovu uti\u010dnicu.
  Nemojte o\u0161tetiti uti\u010dnicu kori\u0161\u0107enjem neodgovaraju\u0107ih adaptera.\\nKod
  verzije koje imaju opciju \\\"oprema za pu\u0161a\u010da\\\", upalja\u010d za cigarete
  se nalazi na mestu uti\u010dnice za struju (videti deo \\\"Upalja\u010d za cigarete\\\").\\n\\nUti\u010dnica
  za struju u prtlja\u017eniku\\n\\nNalazi se sa leve strane u prtlja\u017eniku sl.
  65. U funkciji je samo kada je klju\u010d za paljenje u polo\u017eaju MAR-ON.\\n\\nVA\u017dNO:
  Nemojte uklju\u010divati ure\u0111aje \u010dija je snaga ve\u0107a od 180 W u ovu
  uti\u010dnicu. Nemojte o\u0161tetiti uti\u010dnicu kori\u0161\u0107enjem neodgovaraju\u0107ih
  adaptera.\\n\\nUPALJA\u010c ZA CIGARETE\\n(za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\n\\nNalazi se u centralnom tunelu sl. 66 pored poluge ru\u010dne
  ko\u010dnice. Za aktiviranje upalja\u010da za cigarete, pritisnite dugme A.\\n\\nPosle
  nekoliko sekundi dugme \u0107e se vratiti u svoj prvobitni polo\u017eaj, a upalja\u010d
  je spreman za upotrebu.\\n\\nVA\u017dNO: Uvek proverite da li je isklju\u010den
  upalja\u010d za cigarete.\\n\\nVA\u017dNO: Nemojte uklju\u010divati ure\u0111aje
  \u010dija je snaga ve\u0107a od 180 W u ovu uti\u010dnicu. Nemojte o\u0161tetiti
  uti\u010dnicu kori\u0161\u0107enjem neodgovaraju\u0107ih adaptera.\\n\\n**UPOZORENJE**\\n\\nUpalja\u010d
  za cigarete se jako zagreva. Pa\u017eljivo rukujte s njim i pazite da ne do\u0111e
  u ruke dece: rizik od po\u017eara i opekotina.\\n\\nSUNCOBRANI\\n\\nNalaze se sa
  jedne i druge strane unutra\u0161njeg retrovizora. Mogu se pode\u0161avati prema
  napred ili prema bo\u010dnim stranama.\\n\\nZa bo\u010dno usmeravanje suncobrana,
  izvadite suncobran iz kuke pored unutra\u0161njeg retrovizora i okrenite ga prema
  bo\u010dnom prozoru.\\n\\nNa pole\u0111ini suncobrana kod nekih verzija nalazi se
  ogledalo sa osvetljenjem. Ovo svetlo omogu\u0107ava upotrebu ogledala \u010dak i
  u uslovima slabog osvetljenja.\\n\\nRadi kori\u0161\u0107enja ogledala, neophodno
  je da se poklopac A sl. 67 pomeri kliznim pokretom, kao \u0161to je prikazano na
  slici.\\n\\nDR\u017dA\u010c ZA NAO\u010cARE\\n\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nNalazi se sa leve strane voza\u010devog suncobrana,
  iznad vrata sl. 68,\\n\\nOGLEDALO ZA NADZOR ZADNJEG SEDI\u0160TA\\n\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nNalazi se pored prednjeg krovnog
  svetla.\\n\\nDa biste ga namestili u odgovaraju\u0107i polo\u017eaj koristite povr\u0161inu
  A sl. 69, i okrenite ga nadole.\\n\\nURE\u0110AJ ZA GA\u0160ENJE PO\u017dARA\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nUkoliko je potrebno,
  ure\u0111aj za ga\u0161enje po\u017eara se nalazi u prtlja\u017eniku.\\n\\nVA\u017dNO:
  Uvek proverite da li je isklju\u010den upalja\u010d za cigarete.\\n\\nVA\u017dNO:
  Nemojte uklju\u010divati ure\u0111aje \u010dija je snaga ve\u0107a od 180 W u ovu
  uti\u010dnicu. Nemojte o\u0161tetiti uti\u010dnicu kori\u0161\u0107enjem neodgovaraju\u0107ih
  adaptera.\\n\\nURE\u0110AJ ZA ZA\u0160TITU OD PRIGNJE\u010cENJA\\n\\nZastor za sunce
  ima ure\u0111aj za za\u0161titu od prignje\u010denja koji mo\u017ee da registruje
  prisustvo bilo kakve prepreke tokom svog kretanja prilikom zatvaranja (prednji deo
  i deo centralnog popre\u010dnog nosa\u010da).\\n\\nKada na\u0111e na prepreku zastor
  odmah prekida svoju putanju.\\n\\nELEKTRI\u010cNI POKRETNI KROV\\n(za verzije /
  tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nPokretni krov se sastoji od dve
  staklene plo\u010de (prednja je pokretna, a zadnja je fiksirana) i ima ugra\u0111en
  elektri\u010dni zastor.\\n\\nPomeranje krova i zastora je mogu\u0107e samo kada
  je klju\u010d za paljenje okrenut u polo\u017eaj MAR-ON.\\n\\nOTVARANJE\\n\\nPritisnite
  dugme A sl. 71: prednja staklena plo\u010da \u0107e se pomeriti u polo\u017eaj spojlera.\\n\\nPosle
  pomeranja u polo\u017eaj spojlera, pritisnite ponovo dugme A du\u017ee od pola sekunde
  kako bi se krov automatski otvorio do kraja.\\n\\nAutomatsko pomeranje se mo\u017ee
  prekinuti u bilo kom polo\u017eaju ponovnim pritiskanjem dugmeta A.\\n\\nZATVARANJE\\n\\nIz
  potpuno otvorenog polo\u017eaja pritisnite dugme A sl. 71: prednja staklena plo\u010da
  \u0107e se pomeriti u polo\u017eaj spojlera.\\n\\nPosle otvaranja u polo\u017eaju
  spojlera, pritisnite ponovo dugme A du\u017ee od pola sekunde kako bi se krov automatski
  zatvorio do kraja. Automatsko pomeranje se mo\u017ee prekinuti u bilo kom polo\u017eaju
  ponovnim pritiskanjem dugmeta A.\\n\\nNemojte otvarati krov ukoliko je montiran
  popre\u010dni krovni nosa\u010d. Nemojte otvarati krov ukoliko na njemu ima snega
  ili leda: mogli biste ga o\u0161tetiti.\\n\\nPOMERANJE ZASTORA\\n\\nPritisnite ponovo
  dugme B sl. 71: zastor \u0107e se pomerati prema zadnjem delu vozila, dok se ne
  otvori potpuno. Kada je zastor potpuno otvoren pritisnite dugme B: zastor \u0107e
  se pomerati prema prednjem delu vozila, dok se potpuno ne zatvori.\\n\\nTokom faza
  automatskog otvaranja i zatvaranja, pritisnite ponovo dugme B da prekinete pomeranje
  zastora.\\n\\nURE\u0110AJ ZA ZA\u0160TITU OD PRIGNJE\u010cENJA\\n\\nKrov na otvaranje
  i elektri\u010dni zastor imaju ugra\u0111en sistem za za\u0161titu od prignje\u010denja
  koji mo\u017ee da registruje prisustvo prepreka tokom zatvaranja krova: ukoliko
  se to dogodi, sistem interveni\u0161e i odmah se menja smer pomeranja stakla.\\n\\nUPAZORENJE\\n\\nKada
  izlazite iz vozila, uvek izvadite klju\u010d iz prekida\u010da paljenja kako biste
  izbegli rizik od povrede onih koji ostaju u vozilu usled slu\u010dajnog pomeranja
  krova. Nepravilno kori\u0161\u0107enje krova mo\u017ee biti opasno. Pre i tokom
  pokretanja krova, proverite uvek da niko nije izlo\u017een riziku od povrede usled
  pokretanja krova ili predmeta koje on uhvati ili udari.\\n\\nPOSTUPANJE U VANREDNOJ
  SITUACIJI\\n\\nUkoliko komandna dugmad otka\u017eu, zastor i krov se mogu ru\u010dno
  pomerati, kao \u0161to je opisano u daljem tekstu:\\n\\n- **pomeranje zastora**:
  skinite za\u0161titnu kapu A sl. 72 sa unutra\u0161nje strane vozila;\\n- **pomeranje
  krova**: skinite za\u0161titnu kapu B sa unutra\u0161nje strane vozila;\\n- uzmite
  inbus C koji ste dobili sa vozilom i koji se nalazi u kutiji sa alatom ili, zavisno
  od verzije, u kompletu Fix&Go (za brzu popravku pneumatika) koji se nalaze u prtlja\u017eniku;\\n-
  ubacite inbus C u ku\u0107i\u0161te A (za pomeranje zastora) ili B (za pomeranje
  krova) i okrenite ga u pravcu kretanja kazaljki na satu kako biste otvorili krov
  (ili zastor) ili u pravcu suprotnom od pravca kretanja kazaljki na satu kako biste
  zatvorili krov (ili zastor).\\n\\n**VRATA**\\n\\n**CENTRALNO ZAKLJU\u010cAVANJE
  / OTKLJU\u010cAVANJE VRATA**\\n\\n**Zaklju\u010davanje vrata sa spolja\u0161nje
  strane**\\n\\nKada su vrata zatvorena, pritisnite dugme  na daljinskoj komandi ili
  okrenite metalni umetak (koji se nalazi u klju\u010du) u bravi voza\u010devih vrata.\\n\\nUpali\u0107e
  se LED lampica iznad dugmeta  sl. 73 koja ukazuje na to da su vrata zaklju\u010dana.\\n\\nZaklju\u010davanje
  vrata se obavlja kada su sva vrata zatvorena, bez obzira da li je prtlja\u017enik
  otvoren/zatvoren.\\n\\n**Otklju\u010davanje vrata sa spolja\u0161nje strane**\\n\\nPritisnite
  dugme  na daljinskoj komandi ili okrenite metalni umetak (koji se nalazi u klju\u010du)
  u bravi voza\u010devih vrata.\\n\\nZaklju\u010davanje / otklju\u010davanje vrata
  sa unutra\u0161nje strane\\n\\nPritisnite dugme \\\\( \\\\text{A} \\\\). Ovo dugme
  ima LED lampicu koja pokazuje da li su vrata zaklju\u010dana ili su otklju\u010dana.\\n\\nUpaljena
  LED lampica: vrata su zaklju\u010dana. Pritisnite ponovo dugme \\\\( \\\\text{A}
  \\\\) za centralno otklju\u010davanje svih vrata. LED lampica \u0107e se ugasiti.\\n\\nUga\u0161ena
  LED lampica: sva vrata su otklju\u010dana. Pritisnite ponovo dugme \\\\( \\\\text{A}
  \\\\) za centralno zaklju\u010davanje svih vrata. Vrata \u0107e se zaklju\u010dati
  samo ako su sva vrata pravilno zatvorena.\\n\\nPo \u0161to se zaklju\u010daju vrata
  pomo\u0107u daljinske komande ili zapora klju\u010da, ne\u0107e vi\u0161e biti mogu\u0107e
  da se otklju\u010daju pritiskanjem dugmeta \\\\( \\\\text{A} \\\\).\\n\\nUkoliko
  nema napajanja elektri\u010dnom energijom (pregoreo osigura\u010d, isklju\u010den
  akumulator itd.) mogu\u0107e je ru\u010dno otklju\u010davanje vrata.\\n\\nVA\u017dNO:
  Kada je aktivno centralno zaklju\u010davanje, povla\u010denje unutra\u0161nje poluge
  za otvaranje suvoza\u010devih vrata, otklju\u010dava vrata (LED lampica ostaje upaljena).
  Povla\u010denje unutra\u0161nje poluge za otvaranje voza\u010devih vrata, aktivira
  centralno otklju\u010davanje.\\n\\nVA\u017dNO: Zadnja vrata se ne mogu otvarati
  sa unutra\u0161nje strane kada se aktivira sistem za zaklju\u010davanje dece (videti
  opis u slede\u0107em delu).\\n\\n**BRAVE ZA DECU**\\n\\nOvaj sistem spre\u010dava
  otvaranje zadnjih vrata sa unutra\u0161nje strane.\\n\\nOvaj ure\u0111aj A sl. 74
  se mo\u017ee uklju\u010diti samo sa otvorenim vratima:\\n\\n- polo\u017eaj 1 \u2013
  uklju\u010den ure\u0111aj (zaklju\u010dana vrata);\\n- polo\u017eaj 2 \u2013 ure\u0111aj
  nije uklju\u010den (vrata se mogu otvarati sa unutra\u0161nje strane).\\n\\nOvaj
  ure\u0111aj ostaje uklju\u010den \u010dak i ako se vrata otklju\u010davaju elektri\u010dno.\\n\\nVA\u017dNO:
  Zadnja vrata se ne mogu otvarati sa unutra\u0161nje strane kada je uklju\u010den
  ure\u0111aj za zaklju\u010davanje dece.\\n\\n**UPOZORENJE**\\n\\nKoristite uvek
  ovaj ure\u0111aj kada vozite decu. Po \u0161to uklju\u010dite brave za decu na oba
  zadnja vrata, provjerite da li sistem efikasno radi, tako \u0161to \u0107ete poku\u0161ati
  da otvorite vrata sa unutra\u0161njom ru\u010dkom.\\n\\n**URE\u0110AJ ZA ZAKLJU\u010cAVANJE
  SUVOZA\u010cEVIH VRATA I ZADNJIH VRATA U VANREDNIM SLU\u010cAJEVIMA**\\n\\nSuvoza\u010deva
  vrata i zadnja vratia imaju ure\u0111aj za njihovo zaklju\u010davanje kada nema
  napajanja elektri\u010dnom energijom.\\n\\nU ovom slu\u010daju postupite kao \u0161to
  slije:\\n\\n- stavite metalni umetak klju\u010da za paljenje u polo\u017eaj A sl.
  75 (suvoza\u010deva vrata) ili B sl. 74 (zadnja vrata);\\n- okrenite klju\u010d
  u pravcu kretanja kazaljki na satu, a zatim ga izvadite iz ku\u0107i\u0161ta A ili
  B.\\n\\nZa ponovno uspostavljanje po\u010detnog stanja brava vrata (samo ako je
  punjenje akumulatora ponovo regulisano), postupite kao \u0161to slije:\\n\\n- pritisnite
  dugme  na daljinskoj komandi;\\n- pritisnite dugme  za zaklju\u010davanje / otklju\u010davanje
  vrata na instrument tabli;\\n\\nili\\n\\n- stavite metalni umetak klju\u010da za
  paljenje u zapor prednjih vrata;\\n- povucite unutra\u0161nju ru\u010dku vrata.\\n\\nNemojte
  otvarati krov ukoliko je montiran popre\u010dni krovni nosa\u010d. Nemojte otvarati
  krov ukoliko na njemu ima snega ili leda: mogli biste ga o\u0161tetiti.\\n\\nUvo\u0111enje
  u rad mehanizma za otvaranje / zatvaranje vrata\\n\\nUkoliko je akumulator isklju\u010den
  ili pregori za\u0161titni osigura\u010d, neophodno je ponovno uvo\u0111enje u rad
  mehanizma za otvaranje / zatvaranje vrata kao \u0161to sledi:\\n\\n- zatvorite sva
  vrata;\\n- pritisnite dugme  na daljinskoj komandi ili dugmetu  za zaklju\u010davanje
  / otklju\u010davanje vrata na instrument plo\u010di;\\n- pritisnite dugme  na daljinskoj
  komandi ili dugme  za zaklju\u010davanje / otklju\u010davanje vrata na instrument
  plo\u010di.\\n\\nDaljinsko otvaranje/zatvaranje prozora putem klju\u010da sa daljinskom
  kontrolom (za verzije/tr\u017ei\u0161ta, ukoliko su ponu\u0111ena)\\n\\nProzor mo\u017ee
  biti spu\u0161ten/podignut dr\u017eanjem dugmeta za otklju\u010davanje  / zaklju\u010davanje
  .\\n\\nProzori se pomeraju istovremeno sve dok se odgovaraju\u0107e dugme dr\u017ei
  pritisnuto; zaustavljaju se kad dostignu gornju ili donju granicu kretanja, ili
  nakon otpu\u0161tanja dugmeta.\\n\\nELEKTRI\u010cNI PODIZA\u010cI STAKALA\\n\\nOva
  funkcija se mo\u017ee koristiti kada je klju\u010d za paljenje okrenut u polo\u017eaj
  MAR-ON i oko tri minute po\u0161to se klju\u010d za paljenje okrene na STOP ili
  se izvadi izuzev ukoliko se neka od prednjih vrata ne otvore.\\n\\nOva dugmad se
  nalaze na unutra\u0161njoj strani vrata (za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno). Svi prozori se mogu kontrolisati sa komandne plo\u010de na
  vratima voza\u010da.\\n\\nUPPOZORENJE\\n\\nNepravilno kori\u0161\u0107enje elektri\u010dnih
  prozora mo\u017ee biti opasno. Pre i tokom njihovog kori\u0161\u0107enja proverite
  uvek da li su putnici izlo\u017eeni riziku od povrede bilo direktno kretanjem prozora
  ili predmetima koje oni uhvate ili se zaglave u njima. Uvek izvadite klju\u010d
  za paljenje kada izlazite iz vozila kako biste izbegli rizik od povrede ljudi koji
  ostaju i dalje u vozilu usled slu\u010dajnog pokretanja elektri\u010dnih prozora.\\n\\nKOMANDE\\n\\nVoza\u010deva
  vrata\\nA sl. 76: otvaranje / zatvaranje prednjeg levog prozora. Automatsko neprekidno
  kretanje prozora tokom otvaranja / zatvaranja, kada je klju\u010d za paljenje u
  polo\u017eaju MAR-ON;\\nB: otvaranje / zatvaranje prednjeg desnog prozora. Automatsko
  neprekidno kretanje prozora tokom otvaranja / zatvaranja, ru\u010dno rukovanje samo
  tokom zatvaranja prozora;\\nC: aktiviranje / deaktiviranje komandi elektri\u010dnih
  prozora zadnjih vrata\\nD: otvaranje / zatvaranje zadnjeg levog prozora (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno). Automatsko neprekidno kretanje
  prozora tokom otvaranja / zatvaranja, ru\u010dno rukovanje samo tokom zatvaranja
  prozora;\\nE: otvaranje / zatvaranje zadnjeg desnog prozora (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno). Automatsko neprekidno kretanje prozora tokom otvaranja
  / zatvaranja, ru\u010dno rukovanje samo tokom zatvaranja prozora.\\n\\nKoristite
  dugmad za otvaranje/zatvaranje prozora po \u017eelji.\\nKada se jedno od dva dugmeta
  kratko pritisne, prozor se kre\u0107e u fazama; ukoliko se dugme dr\u017ei pritisnuto,
  aktivira se neprekidno automatsko kretanje i za zatvaranje i za otvaranje (samo
  kada je klju\u010d za paljenje u polo\u017eaju MAR-ON i u okolnostima koje dozvoljavaju
  automatski rad).\\nAko se dugme ponovo pritisne, prozor \u0107e stati u \u017eeljenom
  polo\u017eaju.\\n\\nPrednja i zadnja vrata putnika\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nNa unutra\u0161njoj strani suvoza\u010devih vrata,
  a kod nekih verzija isto tako i na zadnjim vratima, nalaze se komandna dugmad za
  odgovaraju\u0107e prozore.\\nUvo\u0111enje u rad sistema za elektri\u010dne prozore
  Proceduru uvo\u0111enja u rad treba uraditi sa zatvorenim vratima i za svaka vrata,
  kako je opisano u daljem tekstu:\\n- ru\u010dno zatvorite do kraja prozor, \u010diji
  sistem treba uvesti u rad;\\n- po\u0161to prozor do\u0111e do gornjeg kraja svog
  kretanja, dr\u017eite pritisnuto dugme za kretanje prozora nagore tokom najmanje
  jedne sekunde.\\n\\nPRTLJA\u017dNI PROSTOR\\n\\nOtklju\u010davanje prtlja\u017enog
  prostora je elektri\u010dno i deaktivira se kada je vozilo u pokretu.\\n\\nOTVARANJE\\n\\nKada
  je otklju\u010dan, prtlja\u017eni prostor je mogu\u0107e otvoriti sa spolja\u0161nje
  strane vozila kori\u0161\u0107enjem elektri\u010dne ru\u010dice za otvaranje A sl.
  77 koja se nalazi ispod ru\u010dke dok ne \u010dujete klik otklju\u010davanja ili
  pritiskanjem dugmeta \ud83d\ude90 na daljinskoj komandi.\\n\\nPokaziva\u010di pravca
  \u0107e trepnuti dva puta ovom prilikom i upali\u0107e se unutra\u0161nje svetlo
  kada se otvori prtlja\u017enik: svetlo se automatski gasi kada se prtlja\u017enik
  zatvori. Svetlo se automatski gasi posle nekoliko minuta, ako prtlja\u017enik ostane
  otvoren.\\n\\nUPAZORENJE\\n\\nPazite da ne udarite predmete na polici za stvari
  kada otvarate prtlja\u017enik.\\n\\nVanredno otvaranje s unutra\u0161nje strane\\n\\nPostupite
  kao \u0161to slije:\\n\\n- skinite zadnje naslone za glavu i potpuno preklopite
  sedi\u0161ta (videti deo \\\"Pove\u0107avanje prtlja\u017enika\\\");\\n- uzmite
  \u0161rafciger iz kutije sa alatom ili iz kompleta Fix&Go (za brzo popravljanje
  pneumatika), zavisno od verzije;\\n- upotrebite \u0161rafciger da skinete \u017euti
  jezi\u010dak A sl. 78\\n\\nzatim ubacite \u0161rafciger u ku\u0107i\u0161te B sl.
  79 kako biste aktivirali jezi\u010dak za osloba\u0111anje prtlja\u017enika.\\n\\n**ZATVARANJE**\\n\\nUhvate
  ru\u010dku A sl. 80 i spustite peta vrata, pritiskanjem pored brave dok ne \u010dujete
  klik.\\n\\n**VA\u017dNO:** Pre zatvaranja prtlja\u017enika provjerite da li imate
  klju\u010deve, po\u0161to se prtlja\u017enik zaklju\u010dava automatski.\\n\\n**UVO\u0110ENJE
  U RAD SISTEMA PRTLJA\u017dNOG PROSTORA**\\n\\n**VA\u017dNO:** Ukoliko je akumulator
  isklju\u010den ili je pregoreo za\u0161titni osigura\u010d, neophodno je ponovo
  uvesti u rad mehanizam za otvaranje / zatvaranje prtlja\u017enog prostora kao \u0161to
  slijedi:\\n\\n- zatvorite sva vrata i prtlja\u017eni prostor;\\n- pritisnite dugme
  na daljinskoj komandi;\\n- pritisnite dugme na daljinskoj komandi.\\n\\n**POVE\u0106ANJE
  PRTLJA\u017dNOG PROSTORA**\\n\\nPogledajte opise u delovima \\\"Skidanje police
  za stvari\\\" i \\\"Preklapanje sedi\u0161ta\\\" da vidite kako se pove\u0107ava
  prtlja\u017eni prostor.\\n\\nVa\u0111enje police za stvari\\n\\nPostupite kao \u0161to
  sli\u010di:\\n\\n- oslobodite krajeve veza dva nosa\u010da police B sl. 81 tako
  \u0161to \u0107ete izvaditi u\u0161ice C iz osovinica nosa\u010da;\\n- podignite
  zadnji deo police za stvari, postupaju\u0107i kao \u0161to pokazuje sl. 82;\\n-
  oslobodite osovine D sl. 83 sa spolja\u0161nje stranice police, zatim izvadite policu
  za stvari B, tako \u0161to \u0107ete je povu\u0107i nagore;\\n\\nposle va\u0111enja,
  policu mo\u017eete staviti u prtlja\u017enik ili izme\u0111u naslona prednjih sedi\u0161ta
  i preklopljenih i oborenih zadnjih sedi\u0161ta (sa maksimalno pove\u0107anim prtlja\u017enikom).\\n\\nslika
  81\\n\\nslika 82\\n\\nslika 83\\n\\nPreklapanje naslona sedi\u0161ta (delimi\u010dno
  pove\u0107anje)\\n\\nPostupite kao \u0161to slije:\\n\\n- spustite do kraja naslone
  za glavu zadnjih sedi\u0161ta;\\n- pomerite u stranu sigurnosne pojaseve, nastojte
  pritom da budu pravilno ispravljeni i da nisu uvrnuti;\\n- upotrebite polugu A sl.
  84 da podesite sedi\u0161te u \u017eeljeni polo\u017eaj;\\n- podignite polugu B
  sl. 85 kako biste preklopili naslon sedi\u0161ta (videti sl. 86).\\n\\nPa\u017enja:
  Preporu\u010duje se da se ova procedura uradi sa spolja\u0161nje strane, sa levom
  rukom.\\n\\nPonovno name\u0161tanje naslona sedi\u0161ta\\n\\nZa vra\u0107anje naslona
  sedi\u0161ta u polo\u017eaj za normalnu upotrebu, podignite polugu B sl. 85, a zatim
  podignite naslon sedi\u0161ta.\\n\\n**UPOZORENJE**\\n\\nProverite da li je naslon
  sedi\u0161ta pravilno fiksiran sa obe strane kako se ne bi pomerao prema napred
  u slu\u010daju naglog ko\u010denja, koje mo\u017ee da uzrokuje povrede putnika.\\n\\nPreklapanje
  naslona i sedi\u0161ta (totalno pove\u0107anje)\\n\\nPostupite kao \u0161to sli\u010di:\\n-
  spustite do kraja naslone za glavu zadnjih sedi\u0161ta;\\n- pomerite u stranu sigurnosne
  pojaseve, nastojte pritom da budu pravilno ispravljeni i da nisu uvrnuti;\\n- upotrebite
  polugu A sl. 84, da do kraja pomerite sedi\u0161te napred kako biste dobili maksimalno
  pove\u0107anje prtlja\u017enog prostora (zavisno od \u017eeljenog polo\u017eaja
  prednjih sedi\u0161ta);\\n- podignite polugu za otpu\u0161tanje B sl. 87 kako biste
  preklopili levi ili desni deo naslona sedi\u0161ta: naslon sedi\u0161ta i sedalni
  deo \u0107e se automatski preklopiti prema napred (videti sl. 88). Ukoliko je potrebno,
  pridr\u017eavajte naslon sedi\u0161ta tokom po\u010detne faze preklapanja.\\n\\nVa\u017eno:
  Preporu\u010duje se da se ova procedura radi sa spolja\u0161nje strane, sa levom
  rukom\\n\\nPonovno name\u0161tanje zadnjeg sedi\u0161ta\\n\\nZa vra\u0107anje zadnjeg
  sedi\u0161ta u normalan polo\u017eaj, gurnite naslon sedi\u0161ta nazad kao \u0161to
  pokazuje sl. 89 i fiksirajte ga (kada klikne u polo\u017eaj, zna\u010di da je u
  pravilnom polo\u017eaju).\\n\\nslika 88\\n\\nslika 87\\n\\nslika 89\\n\\n**UPAZORENJE**\\n\\nProverite
  da li je sedi\u0161te pravilno fiksirano pri\u010dvr\u0161\u0107iva\u010dima na
  podu (sa obe strane) kako bi se spre\u010dilo pomeranje naslona sedi\u0161ta prema
  napred u slu\u010daju naglog ko\u010denja, koje mo\u017ee da uzrokuje povredu putnika.\\n\\nPonovo
  name\u0161tanje naslona\\n\\nZa vra\u0107anje naslona sedi\u0161ta u polo\u017eaj
  za normalnu upotrebu, podignite polugu B sl. 85, a zatim podignite naslon sedi\u0161ta
  dok ne legne u vertikalan polo\u017eaj.\\n\\n**MAGI\u010cNI TOVARNI PROSTOR**\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nVozilo ima tovarnu
  platformu koja se mo\u017ee pode\u0161avati na tri razli\u010dite visine, \u0161to
  daje magi\u010dni tovarni prostor i omogu\u0107ava zapreminu modularnog prtlja\u017enika:\\n\\n-
  **Polo\u017eaj 0 (potpuno spu\u0161tena platforma):**\\n  omogu\u0107ava maksimalan
  kapacitet prtlja\u017enika;\\n\\n- **Polo\u017eaj 1 (platforma u nivou praga):**\\n  omogu\u0107ava
  nivelisan prag prtlja\u017enika radi lak\u0161eg utovarivanja / istovarivanja predmeta
  u prtlja\u017enik. Tako\u0111e omogu\u0107ava kori\u0161\u0107enje prostora ispod
  ove platforme kao prostora za odlaganje lomljivih i malih stvari;\\n\\n- **Pozicija
  2 (potpuno podignuta platforma):**\\n  povezano sa spu\u0161tanjem naslona zadnjih
  sedi\u0161ta i sedi\u0161ta suvoza\u010da, omogu\u0107ava prevoz duga\u010dkih predmeta.
  Preporu\u010duje se kori\u0161\u0107enje ovog polo\u017eaja samo tokom perioda prevoza
  takvih predmeta, zatim vra\u0107anje platforme u polo\u017eaj 0 ili 1.\\n\\nDimenzije
  platforme omogu\u0107avaju maksimalan kapacitet od 70 kg (u polo\u017eaju 1): nemojte
  unositi predmete ve\u0107e te\u017eine.\\n\\n**Pristup duplom tovarnom prostoru**\\n\\nZa
  pristup duplom tovarnom prostoru, postupite kao \u0161to sledi:\\n\\n- uhvatite
  ru\u010dku A sl. 90 i podignite platformu B, dr\u017ee\u0107i je jednom rukom;\\n-
  stavite stvari koje \u017eelite u prostor C sl. 91;\\n- zatim pravilno vratite platformu
  B u ku\u0107i\u0161ta D sl. 92 na bo\u010dnim stranicama i zadnjem popre\u010dnom
  nosa\u010du E.\\n\\nVA\u017dNO: Pomeranja tovarne platforme moraju biti u sredi\u0161njem
  polo\u017eaju u odnosu na prtlja\u017enik.\\n\\n**Pomeranje tovarne platforme**\\n\\nZa
  pomeranje tovarne platforme iz donjeg u gornji polo\u017eaj, postupite kao \u0161to
  slijedi:\\n\\n- uhvatite ru\u010dku A sl. 90 i podignite platformu B, dr\u017ee\u0107i
  je s jednom rukom;\\n- namestite pravilno platformu B na ku\u0107i\u0161ta C i D
  sl. 93 na bo\u010dnim stranicama.\\n\\n**Pristup kompletu Fix&Go (za brzu popravku
  pneumatika) (ili va\u0111enje rezervnog to\u010dka koji \u0161tedi prostor)**\\n\\nZa
  pristup kompletu Fix&Go za brzu popravku i naduvavanje pneumatika (za na\u010din
  upotrebe, videti sadr\u017eaj poglavlja \\\"U vanrednoj situaciji\\\") ili za va\u0111enje
  rezervnog to\u010dka koji \u0161tedi prostor (za verzije / tr\u017ei\u0161ta za
  koje je predvi\u0111eno) i kutije sa alatom, postupite kao \u0161to slijedi:\\n\\n-
  uhvatite ru\u010dku A sl. 90 i sklonite platformu B;\\n- povucite jezi\u010dak A
  sl. 94 i podignite tepih B.\\n\\nFIKSIRANJE TERETA\\n\\nU prtlja\u017eniku se nalaze
  dve kuke A sl. 95 za pri\u010dvr\u0161\u0107ivanje sajli kojima se mo\u017ee vezati
  teret koji se prevozi.\\n\\nJo\u0161 dve kuke se nalaze na zadnjem popre\u010dnom
  nosa\u010du.\\n\\nDve kuke se tako\u0111e nalaze na bo\u010dnim stranicama za fiksiranje
  tereta koji nije previ\u0161e te\u017eak (npr. ta\u0161ne). Za kori\u0161\u0107enje
  ovih kuka, pritisnite dugme A sl. 96. VA\u017dNO: Nemojte ka\u010diti teret te\u017ei
  od 10 kg na jednu kuku.\\n\\n**PREGRADE ZA ODLAGANJE STVARI**\\n\\nU bo\u010dnim
  stranicama se nalaze dve pregrade za odlaganje stvari sl. 97. Unutar prtlja\u017enika
  tako\u0111e postoji jedna pregrada za odlaganje stvari A sl. 98. Za va\u0111enje
  ove pregrade, povucite je nagore iz njenih ku\u0107i\u0161ta.\\n\\nZa vra\u0107anje
  ove pregrade na mesto, ubacite ponovo jezi\u010dke u ku\u0107i\u0161ta sa unutra\u0161nje
  strane bo\u010dnih stranica, paz\u0435\u0107i da je pri\u010dvrstite sa tri trake
  naspram prtlja\u017enika.\\n\\nPOKLOPAC MOTORA\\n\\nOTVARANJE\\n\\nPostupite kao
  \u0161to slije:\\n\\n- povucite polugu A sl. 99 u pravcu koji pokazuje strelica;\\n-
  upotrebite polugu B sl. 100 u pravcu koji pokazuje strelica, i podignite poklopac
  motora.\\n\\nVA\u017dNO: Dva bo\u010dna gasna amortizera poma\u017eu u otvaranju
  poklopc motora. Nemojte dirati ove amortizere i pridr\u017eavajte haubu tokom dizanja.\\n\\nVA\u017dNO:
  Pre dizanja poklopc motora, proverite da nisu dignute ru\u010dice brisa\u010da i
  da brisa\u010di ne rade.\\n\\nU prostoru za motor nalazi se plo\u010dica prikazana
  u sl. 101.\\n\\nZATVARANJE\\n\\nSputite poklopac motora na oko 20 centimetara od
  prostora za motor i pustite je da pada. Proverite da li je poklopac motora potpuno
  zatvoren, a ne samo pri\u010dvr\u0161\u0107en ure\u0111ajem za zaklju\u010davanje,
  tako \u0161to \u0107ete poku\u0161ati da je otvorite.\\n\\nAko nije dobro zatvorena,
  nemojte poku\u0161avati da je pritiskate, ve\u0107 je otvorite i ponovite celu proceduru.\\n\\nslika
  100\\n\\nslika 101\\n\\nPoklopac motora, branik i farovi ovog vozila razvijeni su
  kao sastavni deo pasivnih bezbednosnih sistema va\u0161eg vozila kako bi obezbedili
  optimalnu za\u0161titu pe\u0161aka i svih putnika. Imaju\u0107i to u vidu, u slu\u010daju
  zamene, nastojte da koristite originalne delove za karoseriju, koji su posebno razvijeni
  za va\u0161e vozilo.\\n\\nKROVNI NOSA\u010c/NOSA\u010c ZA SKIJE\\n\\nObezbe\u0111ena
  mesta za pri\u010dvr\u0161\u0107ivanje ovih nosa\u010da A sl. 102 nalaze se iznad
  prednjih i zadnjih vrata i mo\u017ee im se pri\u010di samo kada su vrata otvorena.
  Lineaccessori Fiat ima namenski krovni nosa\u010d / nosa\u010d za skije specijalno
  za ovo vozilo.\\n\\n**UPOZORENJE**\\n\\nPo \u0161to pre\u0111ete nekoliko kilometara,
  proverite da li su dobro zategnuti vijci za pri\u010dvr\u0161\u0107ivanje ovih nosa\u010da.\\n\\n**UPOZORENJE**\\n\\nNemojte
  nikada prekora\u010divati dozvoljena maksimalna optere\u0107enja (videti poglavlje
  \\\"Tehni\u010dke specifikacije\\\").\\n\\nslika 102\\n\\nRavnomerno rasporedite
  optere\u0107enje uzimaju\u0107i u obzir pove\u0107anu reakciju vozila na bo\u010dne
  vetrove tokom vo\u017enje.\\n\\nPo\u0161tujte sve va\u017ee\u0107e propise vezano
  za maksimalno rastojanje vozila od tla.\\n\\nFAROVI\\n\\nPRAVAC SVETLOSNOG SNOPA\\n\\nPravilno
  pode\u0161avanje polo\u017eaja farova je va\u017eno za udobnost i bezbednost ne
  samo voza\u010da, ve\u0107 i svih ostalih korisnika puteva. Ovo je tako\u0111e regulisano
  odre\u0111enim propisima zakona o javnim putevima.\\n\\nPode\u0161avanje polo\u017eaja
  farova mora biti pravilno, kako bi se garantovali najbolji mogu\u0107i uslovi vidljivosti
  svim voza\u010dima u toku vo\u017enje sa upaljenim farovima.\\n\\nObratite se Fiatovom
  dileru da pregleda i podesi farove, ukoliko je potrebno.\\n\\nProverite pode\u0161avanje
  polo\u017eaja svetlosnog snopa svaki put kada do\u0111e do promene optere\u0107enja
  ili njegovog raspore\u0111ivanja.\\n\\nKOREKTOR POLO\u017dAJA FAROVA\\n\\nOvaj ure\u0111aj
  funkcioni\u0161e kada je klju\u010d za paljenje u polo\u017eaju MAR i kada su uklju\u010dena
  oborena svetla.\\n\\nPode\u0161avanje centriranja farova\\n\\nPritisnite dugme \u25b2
  ili \u25bc za pode\u0161avanje sl. 103. Polo\u017eaj pode\u0161avanja je prikazan
  na displeju.\\n\\nPolo\u017eaj O - jedna ili dve osobe na prednjim sedi\u0161tima\\nPolo\u017eaj
  I - \u010detiri osobe\\nPolo\u017eaj 2 - \u010detiri osobe + optere\u0107enje u
  prtlja\u017eniku\\nPolo\u017eaj 3 - voza\u010d + maksimalno dozvoljeno optere\u0107enje
  sme\u0161teno samo u prtlja\u017eniku.\\n\\nVA\u017dNO: Proverite pode\u0161enost
  farova svaki put kada do\u0111e do promena u te\u017eini tereta koji prevozite.\\n\\nPODE\u0160AVANJE
  POLO\u017dAJA\\nSVETLA ZA MAGLU\\n\\n(za verzije / tr\u017ei\u0161ta za koje je
  predvi\u0111eno)\\n\\nObratite se Fiatovom dileru da pregleda i podesi farove, ukoliko
  je potrebno.\\n\\nPODE\u0160AVANJE FAROVA KADA STE VAN ZEMLJE\\n\\nOborena svetla
  se pode\u0161avaju za vo\u017enju u zemlji u kojoj je vozilo prvobitno kupljeno.
  Kada vozite u zemljama u kojima se vozi suprotnom stranom puta, da biste izbegli
  zaslepljivanje voza\u010da iz suprotnog smera, treba da pokrijete delove farova
  u skladu sa zakonom o javnim putevima zemlje u kojoj vozite: sl. 104 (prednji desni
  far), sl. 105 (prednji levi far).\\n\\nABS\\n\\nABS je sastavni deo ko\u010dionog
  sistema koji spre\u010dava, bez obzira na uslove na putu i primenjenu silu na pedalu
  ko\u010dnice, da do\u0111e do blokade to\u010dkova i shodno tome proklizavanja,
  obezbe\u0111uju\u0107i tako da vozilo ostane pod kontrolom \u010dak i u slu\u010daju
  hitnog ko\u010denja.\\n\\nSistem EBD (elektronska raspodela sile ko\u010denja) upotpunjuje
  ovaj sistem omogu\u0107avaju\u0107i raspodelu ko\u010dione sile izme\u0111u prednjih
  i zadnjih to\u010dkova.\\n\\nVA\u017dNO: Za postizanje maksimalne efikasnosti ko\u010dionog
  sistema, potrebna je razrada od oko 500 km: tokom ovog perioda bolje je da izbegavate
  nagla, ponovljena i produ\u017eena ko\u010denja.\\n\\nUPPOZORENJE\\n\\nABS izvla\u010di
  maksimum iz mogu\u0107eg prijanjanja, ali ne mo\u017ee da ga pobolj\u0161a; stoga
  treba da preduzmete sve mere predostro\u017enosti kada vozite po klizavim povr\u0161inama
  i da se ne izla\u017eete nepotrebnim rizicima.\\n\\nINTERVENCIJA SISTEMA\\n\\nVoza\u010d
  mo\u017ee da oseti kada ABS sistem interveni\u0161e, zato \u0161to pedala ko\u010dnice
  blago pulsira i sistem postaje bu\u010dniji: to zna\u010di da treba promeniti brzinu
  kako bi odgovarala vrsti povr\u0161ine kolovoza.\\n\\nUPPOZORENJE\\n\\nKada ABS
  interveni\u0161e i osetite pulsiranje pedale ko\u010dnice, nemojte sklanjati nogu
  sa pedale, ve\u0107 je pritiskajte i dalje; na taj na\u010din \u0107ete se zaustaviti
  u najkra\u0107em mogu\u0107em rastojanju zavisno od trenutnih uslova na putu.\\n\\nUPPOZORENJE\\n\\nUkoliko
  ABS interveni\u0161e, to zna\u010di da se trakcija pneumatika na putu pribli\u017eava
  granici. Morate smanjiti brzinu tako da ona odgovara raspolo\u017eivoj trakciji.\\n\\nSISTEM
  MSR\\n(Kontrola obrtnog momenta motora)\\n\\nOvaj sistem je sastavni deo ABS i interveni\u0161e
  ukoliko do\u0111e do iznenadnog prebacivanja u ni\u017eu brzinu, uspostavljuju\u0107i
  obrtni momenat motora, \u010dime spre\u010dava da prekomerni pogon u pogonskim to\u010dkovima,
  posebno u uslovima slabog prijanjanja, dove\u0111e do gubitka stabilnosti vozila.\\n\\nSISTEM
  ESC\\n(Elektronska kontrola stabilnosti)\\n\\nOvo je elektronski sistem koji kontroli\u0161e
  stabilnost vozila u slu\u010daju da pneumatici vi\u0161e ne prianjaju za put, \u010dime
  poma\u017ee da se odr\u017ei kontrola pravca.\\n\\nOvaj sistem je u stanju da prepozna
  potencijalno opasne situacije u smislu stabilnosti i interveni\u0161e automatski
  na ko\u010dnice na razli\u010dit na\u010din na \u010detiri to\u010dka kako bi obezbedio
  stabiliziraju\u0107i obrtni momenat.\\n\\nSistem ESC tako\u0111e obuhvata slede\u0107e
  pod-sisteme:\\n\\n- Hill Holder (sistem za asistenciju pri polasku na ubrdici)\\n-
  ASR (spre\u010davanje proklizavanja pogonskih to\u010dkova)\\n- HBA (automatsko
  pove\u0107avanje pritiska ko\u010denja u slu\u010daju naglog ko\u010denja)\\n- DST
  (dinami\u010dka kontrola raspolo\u017eivog obrtnog momenta / sistem protiv zano\u0161enja
  vozila)\\n- ERM (elektronsko ubla\u017eavanje prevrtanja)\\n\\nINTERVENCIJA SISTEMA\\n\\nNa
  intervenciju sistema signalizira lampica upozorenja sistema ESC na instrument tabli,
  kako bi obavestila voza\u010da da je vozilo u stanju kriti\u010dne stabilnosti i
  prianjanja.\\n\\nAKTIVIRANJE SISTEMA\\n\\nSistem ESC se automatski uklju\u010duje
  kada se motor startuje i ne mo\u017ee se isklju\u010diti.\\n\\nSISTEM HILL HOLDER\\n(asistencija
  pri polasku na uzbrdici)\\n\\nOvaj sistem je sastavni deo sistema ESC i olak\u0161ava
  startovanje na kosinama.\\n\\nAktivira se automatski u slede\u0107im slu\u010dajevima:\\n\\n-
  uzbrdica: vozilo miruje na putu sa nagibom ve\u0107im od 5%, motor radi, ko\u010dnica
  je pritisnuta i menja\u010d je uba\u010den u neutralan polo\u017eaj ili u neku brzinu
  (ali ne u hod unazad);\\n- nizbrdica: vozilo miruje na putu sa nagibom ve\u0107im
  od 5%, motor radi, ko\u010dnica je pritisnuta, a menja\u010d je uba\u010den u hod
  unazad.\\n\\nPri polasku, kontrolna jedinica sistema ESC odr\u017eava ko\u010dioni
  pritisak na to\u010dkove dok se ne postigne potreban obrtni momenat za startovanje
  ili, u svakom slu\u010daju tokom maksimum 2 sekunde, tako da se desna noga mo\u017ee
  slobodno prebaciti sa pedale ko\u010dnice na pedalu gasa.\\n\\nUkoliko po isteku
  2 sekunde vozilo ne krene, sistem se automatski deaktivira, postepeno otpu\u0161taju\u0107i
  ko\u010dioni pritisak. Tokom ove faze otpu\u0161tanja, mogu\u0107e je \u010duti
  tipi\u010dan zvuk mehani\u010dkog otpu\u0161tanja ko\u010dnice, \u0161to ukazuje
  na to da \u0107e vozilo uskoro da krene.\\n\\nVA\u017dNO: Sistem Hill Holder nije
  parkirna ko\u010dnica; stoga, nemojte nikada ostavljati vozilo, a da ne aktivirate
  parkirnu ko\u010dnicu, ugasite motor i ubacite menja\u010d u prvi stepen prenosa,
  tako da vozilo bude parkirano u bezbednim uslovima (za vi\u0161e informacija pro\u010ditajte
  deo \\\"Kada je vozilo parkirano\\\" u poglavlju \\\"Startovanje i vo\u017enja\\\").\\n\\nSISTEM
  ASR\\n(spre\u010davanje proklizavanja pogonskih to\u010dkova)\\n\\nOvaj sistem je
  sastavni deo sistema ESC. On funkcioni\u0161e automatski u slu\u010daju proklizavanja
  jednog ili oba pogonska to\u010dka, prestanka prianjanja na klizavim putevima (akvaplaning)
  i ubrzavanja na klizavim, snegom ili ledom prekrivenim putevima itd.\\n\\nZavisno
  od uslova proklizavanja, dolazi do aktiviranja dva razli\u010dita kontrolna sistema:\\n\\n-
  ukoliko proklizavanje obuhvata oba pogonska to\u010dka, ASR interveni\u0161e smanjuju\u0107i
  snagu koju prenosi motor;\\n- ukoliko proklizavanje obuhvata jedan od pogonskih
  to\u010dkova, ovaj sistem interveni\u0161e automatski, ko\u010de\u0107i to\u010dak
  koji proklizava.\\n\\nAktiviranje / deaktiviranje sistema ASR\\n\\nSistem ASR se
  aktivira automatski svaki put kada se startuje motor.\\n\\nASR je mogu\u0107e deaktivirati
  tokom vo\u017enje i shodno tome ponovo aktivirati pritiskanjem dugmeta ASR OFF sl.
  106.\\n\\nKod nekih verzija na intervenciju ovog sistema ukazuje poruka prikazana
  na displeju.\\n\\n**UPPOZORENJE**\\n\\nESC funkcioni\u0161e \u010dak i kada se koristi
  rezervni to\u010dak koji \u0161tedi prostor. Zapamtite da po\u0161to je rezervni
  to\u010dak koji \u0161tedi prostor manji od originalnog to\u010dka, slabije prijanja
  na put.\\n\\n**Aktiviranje/deaktiviranje sistema ASR**\\n\\nKada je sistem deaktiviran,
  pali se LED lampica na dugmetu ASR OFF (isklju\u010den ASR) i, kod nekih verzija,
  se pojavljuje poruka na displeju.\\n\\nUkoliko je ASR isklju\u010den tokom vo\u017enje,
  bi\u0107e automatski ponovo aktiviran prilikom slede\u0107eg startovanja vozila.\\n\\nPrilikom
  vo\u017enje sa lancima za sneg po putevima prekrivenim snegom, mo\u017ee biti korisno
  da se isklju\u010di ASR: u stvari, u ovim uslovima, proklizavanje pogonskih to\u010dkova
  prilikom polaska omogu\u0107ava postizanje boje trakcije.\\n\\n**UPPOZORENJE**\\n\\nDa
  bi ESC i ASR sistemi radili pravilno, sva \u010detiri pneumatika moraju pre svega
  biti propisane marke i tipa, moraju biti u odli\u010dnom stanju i propisanog tipa
  i veli\u010dine.\\n\\n**UPPOZORENJE**\\n\\nNemojte se izlagati nepotrebnim rizicima
  \u010dak i ako va\u0161e vozilo ima ugra\u0111ene sisteme ESC i ASR. Va\u0161 stil
  vo\u017enje mora uvek biti prilago\u0111en uslovima na putu, vidljivosti i saobra\u0107aju.
  Voza\u010d je uvek odgovoran za bezbednost na putu.\\n\\nSISTEM HBA (automatsko
  pove\u0107avanje pritiska ko\u010denja u slu\u010daju naglog ko\u010denja)\\n\\nHBA
  sistem slu\u017ei pobolj\u0161anju ko\u010denja vozila u slu\u010dajevima naglog
  ko\u010denja. Sistem detektuje naglo ko\u010denje pra\u0107enjem brzine i snage
  kojom je pedala ko\u010dnice pritisnuta, i na osnovu toga primenjuje optimalni ko\u010dioni
  pritisak. Na taj na\u010din se mo\u017ee smanjiti du\u017eina zaustavljanja, \u0161to
  zna\u010di da HBA sistem nadopunjuje ABS.\\n\\nNajve\u0107i u\u010dinak HBA sistema
  se dobija veoma brzim pritiskanjem pedale ko\u010dnice. Pored toga, pedalu ko\u010dnice
  bi trebalo neprekidno pritisniti za vreme ko\u010denja, izbegavaju\u0107i pri tom
  isprekidana pritiskanja, ne bi li se na taj na\u010din iskoristile prednosti sistema.\\n\\nNe
  smanjujte pritisak na pedalu ko\u010dnice sve dok vi\u0161e nije potrebno ko\u010diti.\\n\\nHBA
  sistem se deaktivira nakon otpu\u0161tanja pedale ko\u010dnice.\\n\\nUPAZORENJE\\n\\nHBA
  sistem ne mo\u017ee da pove\u0107a prianjanje pneumatika na putu preko granica koje
  name\u0107u zakoni fizike: uvek vozite pa\u017eljivo u skladu sa uslovima koji vladaju
  na putu.\\n\\nHBA sistem ne mo\u017ee da spre\u010di nesre\u0107e, uklju\u010duju\u0107i
  one koje su izazvane prekomernom brzinom u krivinama, vo\u017enjom po klizavim povr\u0161inama
  ili akvaplaningom.\\n\\nUPAZORENJE\\n\\nHBA sistem predstavlja pomo\u0107 voza\u010du
  koji uvek mora da obra\u0107a punu pa\u017enju u toku vo\u017enje. Odgovornost uvek
  le\u017ei na voza\u010du. Karakteristike HBA sistema ne smeju nikad biti isprobavane
  na nepromi\u0161ljen i opasan na\u010din, koji bi mogao da dovede voza\u010da, putnike
  i ostale u\u010desnike u saobra\u0107aju u opasnost.\\n\\nERM (elektronsko ubla\u017eavanje
  prevrtanja)\\n\\nOvaj sistem prati tendenciju dizanja to\u010dkova od tla ukoliko
  voza\u010d izvodi ekstremna manevriranja kao \u0161to su nagli potezi upravljanja
  u cilju izbegavanja prepreka, posebno na lo\u0161im putevima.\\n\\nU ovakvim uslovima
  sistem interveni\u0161e na ko\u010dnice i snagu motora kako bi smanjio mogu\u0107nost
  dizanja to\u010dkova od tla.\\n\\nNije mogu\u0107e izbe\u0107i tendenciju prevrtanja,
  ukoliko je prethodno pomenuta pojava posledica vo\u017enje po velikim bo\u010dnim
  nagibima, sudara sa predmetima ili drugim vozilima.\\n\\nUPAZORENJE\\n\\nDST je
  pomo\u0107ni sistem u vo\u017enji i ne zamenuje postupke voza\u010da tokom vo\u017enje.\\n\\nUPPOZORENJE\\n\\nPerformanse
  vozila sa sistemom ERM ne treba nikad testirati na nerazuman ili opasan na\u010din,
  uz mogu\u0107nost ugro\u017eavanja bezbednosti voza\u010da ili drugih ljudi.\\n\\nSISTEM
  START&STOP\\n\\nUVOD\\n\\nSistem Start&Stop automatski gasi motor svaki put kada
  vozilo miruje i startuje ga ponovo kada voza\u010d \u017eeli da ponovo krene.\\n\\nNa
  ovaj na\u010din se pobolj\u0161ava efikasnost vozila, tako \u0161to se smanjuje
  potro\u0161nja goriva, emisije \u0161tetnih gasova i zvu\u010dno zagadenje.\\n\\nOvaj
  sistem je aktivan svaki put kada se startuje motor.\\n\\nNA\u010cINI RADA\\n\\nNa\u010din
  ga\u0161enja motora\\n\\nKada vozilo stane, gasi se motor, menja\u010d je u neutralnom
  polo\u017eaju, a pedala kva\u010dila je otpu\u0161tena.\\n\\nVA\u017dNO: Motor se
  mo\u017ee ugasiti automatski samo po \u0161to dostigne brzinu preko 10 km/h, kako
  bi se spre\u010dilo ponovljeno ga\u0161enje motora prilikom vo\u017enje brzinom
  hoda \u010doveka.\\n\\nNa displeju se pojavljuje simbol A kada se motor ugasi.\\n\\nRestartovanje
  motora\\n\\nPritisnite pedalu kva\u010dila da restartujete motor.\\n\\nRU\u010cNO
  AKTIVIRANJE / DEAKTIVIRANJE SISTEMA\\n\\nZa ru\u010dno aktiviranje / deaktiviranje
  sistema, pritisnite dugme A sl. 107 (koje se nalazi na komandama instrument table).\\n\\nAktiviranje
  sistema Start&Stop\\n\\nPoruka na displeju signalizira da je aktiviran sistem Start&Stop.
  U ovom slu\u010daju je uga\u0161ena LED lampica na dugmetu A.\\n\\nDeaktiviranje
  sistema Start&Stop\\n\\nVerzije sa multifunkcionalnim displejem: poruka se pojavljuje
  na displeju kada se deaktivira sistem Start&Stop.\\n\\nVerzije sa rekonfigurdbilnim
  multifunkcionalnim displejem: pojavljuje se simbol A i odgovaraju\u0107a poruka
  na displeju, kada se deaktivira sistem Start&Stop.\\n\\nKada je sistem deaktiviran,
  upaljena je LED lampica iznad dugmeta A.\\n\\n**USLOVI POD KOJIMA NE DOLAZI DO GA\u0160ENJA
  MOTORA**\\n\\nKada ovaj sistem radi u cilju udobnosti, razloga kontrole emisija
  i bezbednosti, motor se ne\u0107e ugasiti pod odre\u0111enim uslovima, me\u0111u
  kojim su:\\n\\n- motor je jo\u0161 uvek hladan;\\n- izuzetno niska spolja\u0161nja
  temperatura;\\n- akumulator nije dovoljno pun;\\n- u toku je regeneracija filtera
  dizel \u010destica (DPF) (samo kod dizel motora);\\n- voza\u010deva vrata nisu zatvorena;\\n-
  voza\u010dev sigurnosni pojas nije vezan;\\n- menja\u010d je uba\u010den u hod unazad
  (na primer, za manevriranje tokom parkiranja);\\n- kod vezira koje su opremljene
  sa automatskom kontrolom klimatizacije (za verzije / tr\u017ei\u0161ta gde je predvi\u0111eno),
  ukoliko nije dostignut odgovaraju\u0107i nivo termalne udobnosti ili sa aktivnim
  na\u010dinom rada MAX-DEF;\\n- tokom prvog perioda kori\u0161\u0107enja, dok se
  sistem uvodi u rad.\\n\\n**USLOVI ZA RESTARTOVANJE MOTORA**\\n\\nIz razloga udobnosti,
  ograni\u010davanja \u0161tetnih emisija i bolje bezbednosti, pogonska jedinica mo\u017ee
  da se automatski restartuje, bez ikakve intervencije voza\u010da, ukoliko su ispunjeni
  odre\u0111eni uslovi, uklju\u010duju\u0107i:\\n\\n- akumulator nije dovoljno pun;\\n-
  smanjen vakum ko\u0161ionog sistema (npr. ako se pedala ko\u010dnice ponovljeno
  pritiska);\\n- vozilo se kre\u0107e (npr. na putevima sa nagibom);\\n- sistem Start&Stop
  je ugasio motor i on ne radi du\u017ee od 3 minute;\\n- kod vezira koje su opremljene
  sa automatskom kontrolom klime (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno),
  ukoliko nije dostignut odgovaraju\u0107i nivo termalne udobnosti ili sa aktivnim
  na\u010dinom rada MAX-DEF.\\n\\nSa menja\u010dem uba\u010denim u brzinu, automatsko
  restartovanje motora je mogu\u0107e samo pritiskanjem pedale kva\u010dila do kraja.
  Na ovu operaciju voza\u010du signalizira poruka prikazana na displeju.\\n\\n---\\n\\nUkoliko
  se **prednost daje udobnosti koju omogu\u0107a sistem klimatizacije**, mogu\u0107e
  je deaktivirati sistem Start&Stop, kako bi kontrolni sistem klimatizacije radio
  bez prekida.\\n\\nVA\u017dNO:\\nUkoliko kva\u010dilo nije pritisnuto, oko 3 minute
  po ga\u0161enju motora, restartovanje motora je mogu\u0107e samo kori\u0161\u0107enjem
  klju\u010da za paljenje.\\nU slu\u010dajevima ne\u017eeljenog ga\u0161enja motora,
  na primer usled naglog otpu\u0161tanja pedale kva\u010dila kada je menja\u010d uba\u010den
  u brzinu, mogu\u0107e je restartovanje motora, ako je sistem Start&Stop aktivan,
  tako \u0161to treba pritisnuti pedalu kva\u010dila do kraja ili ubaciti polugu menja\u010da
  u neutralan polo\u017eaj.\\n\\nBEZBEDNOSNE FUNKCIJE\\nKada sistem Start&Stop ugasi
  motor, ako voza\u010d odve\u017ee svoj sigurnosni pojas i otvori svoja vrata ili
  vrata suvoza\u010da, motor je mogu\u0107e restartovati samo kori\u0161\u0107enjem
  klju\u010da za paljenje.\\nZvu\u010dni signal ukazuje voza\u010du na ovu situaciju.\\n\\nFUNKCIJA
  ZA \u0160TEDNJU ENERGIJE\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nUkoliko,
  posle automatskog restartovanja motora, voza\u010d ne preduzme nikakve radnje sa
  vozilom du\u017ee od 3 minuta, sistem Start&Stop \u0107e trajno ugasiti motor, kako
  bi spre\u010dio potro\u0161nju goriva.\\nU ovim slu\u010dajevima motor je mogu\u0107e
  restartovati samo kori\u0161\u0107enjem klju\u010da za paljenje.\\n\\nVA\u017dNO:
  U svakom slu\u010daju mogu\u0107e je odr\u017eati neprekidan rad motora, deaktiviranjem
  sistema Start&Stop.\\n\\nNEPRAVILAN RAD\\n\\nSistem Start&Stop se deaktivira u slu\u010daju
  defektnog rada.\\n\\nVerzije sa multifunkcionalnim displejem: paljenje lampice upozorenja
  \u26a0\ufe0f na instrument tabli i poruka na displeju, ukazuju na otkazivanje sistema
  Start&Stop.\\n\\nVerzije sa rekonfigurabilnim multifunkcionalnim displejem:\\n\\nSimbol
  \u26a0\ufe0f i namenska poruka pojavljuju se na displeju kada se registruje defekt
  sistema Start&Stop.\\n\\nU slu\u010daju defekta sistema Start&Stop, obratite se
  Fiatovom dileru.\\n\\nMIROVANJE VOZILA\\n\\nU slu\u010daju nekori\u0161\u0107enja
  vozila (ili ukoliko se menja akumulator), posebnu pa\u017enju treba obratiti na
  isklju\u010divanje elektri\u010dnog sistema akumulatora.\\n\\nPritisnite dugme A
  sl. 108 kako biste odvojili konektor B od senzora C, koji prati stanje akumulatora
  i nalazi se na negativnoj klemi samog akumulatora.\\n\\nUPPOZORENJE\\n\\nObratite
  se uvek Fiatovom dileru ukoliko treba zameniti akumulator. Zamenite akumulator sa
  akumulatom istog tipa HEAVY DUTY i sa istim specifikacijama.\\n\\nVA\u017dNO: Posle
  okretanja klju\u010da za paljenje u STOP, sa\u010dekajte najmanje 1 minutu pre isklju\u010divanja
  napajanja akumulatora elektri\u010dnom energijom.\\n\\nSTARTOVANJE MOTORA SA PREMO\u0160\u0106ENIM
  KABLOVIMA\\n\\nPrilikom startovanja motora sa premo\u0161\u0107enim kablovima nemojte
  nikada povezivati negativan kabl ( - ) pomo\u0107nog akumulatora sa negativnim polom
  A sl. 109 akumulatora vozila, ve\u0107 sa uzemljenjem motora / menja\u010da.\\n\\nVA\u017dNO\\n\\nUPAZORENJE\\n\\nPre
  otvaranja poklopcia motora, proverite da li je uga\u0161en motor i klju\u010d za
  paljenje u polo\u017eaju STOP. Konsultujte uvek plo\u010dicu sl. 110 sa unutra\u0161nje
  strane poklopcia motora. Preporu\u010dujemo da izvadite klju\u010d iz paljenja ukoliko
  ostali putnici ostanu u vozilu. Izadite iz vozila, tek po \u0161to izvadite klju\u010d
  za paljeve ili po \u0161to ga okrenete u polo\u017eaj STOP. Prilikom dolivanja goriva
  proverite da li je motor uga\u0161en i da li je klju\u010d za paljenje u polo\u017eaju
  STOP.\\n\\nSISTEM EOBD\\n\\nSistem EOBD (evropska dijagnostika na vozilu) vr\u0161i
  stalnu dijagnostiku komponenata vozila vezano za emisije. On tako\u0111e upozorava
  voza\u010da, paljenjem lampice upozorenja \\\\(\\\\text{\u26a0\ufe0f}\\\\) na instrument
  tabli (zajedno sa porukom na displeju kod nekih verzija), kada ove komponente vi\u0161e
  nisu u najboljem stanju (videti deo \\\"Lampice upozorenja i poruke\\\").\\n\\nCilj
  sistema EOBD (evropska dijagnostika na vozilu) jeste da:\\n\\n- prati efikasnost
  sistema;\\n- ukaze na pove\u0107anje emisija;\\n- ukaze na potrebu zamene o\u0161te\u0107enih
  komponenata.\\n\\nOvaj sistem ima tako\u0111e jedan dijagnosti\u010dki konektor
  koji se mo\u017ee povezati sa odgovaraju\u0107im instrumentima, za o\u010ditavanje
  \u0161ifri gre\u0161aka memorisanih u kontrolnoj jedinici zajedno sa nizom specifi\u010dnih
  parametara za rad i dijagnostiku motora.\\n\\nVA\u017dNO: Posle eliminisanja defekta,
  u cilju pregleda celog sistema, Fiatov diler \u0107e uraditi test na stolu i, ukoliko
  je potrebno, testove na putu, koji tako\u0111e mogu zahtevati duge vo\u017enje.\\n\\nELEKTRI\u010cNI
  SERVO UPRAVLJA\u010c (DUPLI POGON)\\n\\nOvo funkcioni\u0161e samo kada je klju\u010d
  okrenut na MAR i motor startovan. Upravljanje omogu\u0107ava da se sila koja je
  potrebna za upravlja\u010d podesi tako da odgovara uslovima vo\u017enje.\\n\\nVA\u017dNO:
  kada se brzo okrene klju\u010d za paljenje, mogu\u0107e je posti\u0107i punu funkcionalnost
  servo upravlja\u010da posle nekoliko sekundi.\\n\\nAKTIVIRANJE / DEAKTIVIRANJE GRADSKE
  FUNKCIJE\\n\\nPritisnite dugme CITY sl. 111 kako biste aktivirali / deaktivirali
  ovu funkciju. Na aktiviranje ove funkcije signalizira pojavljivanje re\u010di CITY
  (verzije sa multifunkcionalnim displejem) ili aktiviranje lampice upozorenja CITY
  na instrument plo\u010di (verzije sa rekonfigurabilnim multifunkcionalnim displejem).\\n\\nslika
  111\\n\\nKada je uklju\u010dena funkcija CITY, manje napora je potrebno za rukovanje
  upravlja\u010dem, lak\u0161e je manevarsanje priklikom parkiranja: stoga je ova
  funkcija posebno korisna za vo\u017enju u gradskom centru.\\n\\n**UPPOZORENJE**\\n\\nApsolutno
  je zabranjeno raditi bilo kakve post-prodajne operacije vezano za sistem upravljanja
  ili modifikacije stuba upravlja\u010da (npr. ugradnja ure\u0111aja za za\u0161titu
  od kra\u0111e) koji bi mogli da lo\u0161e uti\u010du na performanse i bezbednost,
  poni\u0161tite garanciju i isto tako da dovedu do nesaobra\u017eenosti vozila sa
  uslovima za odobrenje tipa.\\n\\n**VA\u017dNO:** Prilikom manevarsanja tokom parkiranja
  koje zahteva dosta upravljanja, mogu\u0107e je da upravljanje postane ote\u017eano;
  ovo je normalna pojava i posledica je intervencije sistema za za\u0161titu motora
  elektri\u010dnog upravljanja od pregrejavanja: U ovom slu\u010daju nije potrebna
  nikakva popravka. Kada se vozilo bude ponovo koristilo, elektri\u010dno servo upravljanje
  \u0107e ponovo normalno raditi.\\n\\n**UPPOZORENJE**\\n\\nUvek ugasite motor i izvadite
  klju\u010d iz paljenja kako biste zaklju\u010dali stub upravlja\u010da (posebno
  kada to\u010dkovi vozila ne dodiruju tlo), pre vr\u0161enja bilo kakvih operacija
  na odr\u017eavanju. Ukoliko to nije mogu\u0107e (na primer ukoliko je potrebno da
  se klju\u010d okrene u polo\u017eaj MAR-ON ili motor mora da radi), izvadite glavni
  osigura\u010d koji \u0161titi elektri\u010dni servo upravlja\u010d.\\n\\nSISTEM
  ZA PODE\u0160AVANJE RADIJA\\n(za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nVozilo
  mo\u017ee biti opremljeno sa duplom pregradom sl. 112 na instrument tabli.\\n\\nSistem
  za pode\u0161avanje radija sastoji se od:\\n\\n- kablova za napajanje radija;\\n-
  2 prednja visokotonska zvu\u010dnika \u00d838 mm, sme\u0161tenih na ru\u010dki vrata;\\n-
  2 zvu\u010dnika za srednje-niske tonove \u00d8165 mm, sme\u0161tenih na stranici
  vrata;\\n- 2 zvu\u010dnika \u0161irokog zvu\u010dnog opsega \u00d8165 mm, sme\u0161tenih
  na stranici vrata;\\n- ku\u0107i\u0161ta radija;\\n- antene (na krovu vozila).\\n\\nRadio
  se mo\u017ee instalirati umesto pregrade A sl. 112, tako \u0161to se postavi u odgovaraju\u0107e
  le\u017ei\u0161te i mo\u017ee se izvaditi tako \u0161to se povu\u010de napolje.
  Kada se to uradi mogu\u0107 je pristup obezbe\u0111enim kablovima.\\n\\nPRIPREMA
  ZA INSTALIRANJE PORTABL NAVIGACIONOG SISTEMA\\n\\nPortabl navigacioni sistem treba
  instalirati tako \u0161to se montira odgovaraju\u0107i nosa\u010d u ku\u0107i\u0161tu
  kao \u0161to je prikazano na sl. 113.\\n\\nslika 112\\n\\nslika 113\\n\\nZa povezivanje
  na instalaciju za sistem radija, obratite se Fiatovom dileru kako biste spre\u010dili
  bilo kakve probleme koji bi mogli da ugroze bezbednost vozila.\\n\\nURE\u0110AJI
  KOJE KUPUJE VLASNIK\\n\\nUkoliko posle kupovine vozila odlu\u010dite da instalirate
  elektri\u010dne ure\u0111aje koji zahtevaju stalno napajanje elektri\u010dnom energijom
  (radio, satelitski sistem za za\u0161titu od kra\u0111e itd.) ili ure\u0111aje koji
  u svakom slu\u010daju optere\u0107uju napajanje elektri\u010dnom energijom, obratite
  se Fiatovom dileru, \u010dije \u0107e kvalifikovano osoblje, pored toga \u0161to
  \u0107e vam dati savete o najpodesnijim ure\u0111ajima Lineaccessori Fiat, tako\u0111e
  izra\u010dunati ukupnu potro\u0161nju elektri\u010dne energije, proveriti da li
  elektri\u010dni sistem vozila mo\u017ee da izdr\u017ei tra\u017eeno optere\u0107enje
  i da li je potrebno da se ugradi ja\u010di akumulator.\\n\\nUPAZORENJE\\n\\nPazite
  kada ugra\u0111ujete dodatne spojlera, to\u010dkove od legure ili nestandardne glav\u010dine
  to\u010dkova: oni bi mogli da smanje ventilaciju ko\u010dnica i da uti\u010du na
  efikasnost prilikom naglog, ponovljenog ko\u010denja ili dugih spu\u0161tanja nizbrdo.
  Nastojte da ni\u0161ta ne ometa hod pedala (tepisi itd.)\\n\\nINSTALIRANJE ELEKTRI\u010cNIH
  / ELEKTRONSKIH URE\u0110AJA\\n\\nElektri\u010dni i elektronski ure\u0111aji koji
  se instaliraju posle kupovine vozila u kontekstu post-prodajnih usluga moraju imati
  oznaku (videti sl. 114):\\n\\nGrupa Fiat automobili S.p.A. odobrava instaliranje
  transiver ure\u0111aja (primopredajnika) pod uslovom da se ova instaliranja urade
  stru\u010dno, po\u0161tovanjem uputstava proizvo\u0111a\u010da, u specijalizovanim
  centrima.\\n\\nVA\u017dNO: Saobra\u0107ajna policija mo\u017ee da zabrani u\u010de\u0161\u0107e
  vozila u saobra\u0107aju ukoliko imaju instalirane ure\u0111aje koji menjaju karakteristike
  vozila. Ovo tako\u0111e mo\u017ee da uzrokuje poni\u0161tavanje garancije vezano
  za defekte uzrokovane takvim promenama bilo da su direktno ili indirektno u vezi
  sa njima.\\n\\nGrupa Fiat automobili S.p.A. ne\u0107e biti odgovorna za o\u0161te\u0107enja
  uzrokovana instaliranjem ure\u0111aja koje nije isporu\u010dila ili preporu\u010dila
  Grupa Fiat automobili S.p.A. i /ili koji nisu instalirani u skladu sa datim uputstvima.\\n\\nRADIO
  PRENOSNICI I MOBILNI TELEFONI\\n\\nOprema radio prenosnika (mobilni telefoni u vozilu,
  CB radio itd.) ne mo\u017ee se koristiti unutar vozila ukoliko se spolja ne montira
  posebna antena.\\n\\nVA\u017dNO Upotreba ovih ure\u0111aja u putni\u010dkoj kabini
  (bez spolja\u0161nje antene) mo\u017ee da uzrokuje defektan rad elektri\u010dnih
  sistema.\\n\\nOvo mo\u017ee da ugrozi bezbednost vozila pored toga \u0161to predstavlja
  potencijalnu opasnost za zdravlje putnika. Pored toga, \u0161titno dejstvo karoserije
  vozila mo\u017ee negativno da uti\u010de na prenos i prijem ovih ure\u0111aja. \u0160to
  se ti\u010de kori\u0161\u0107enja EC odobrenih mobilnih telefona (GSM \u2013 globalni
  sistem za mobilnu komunikaciju, GPRS \u2013 op\u0161ti paket radio usluga, UMTS
  \u2013 univerzalni mobilni telekomunikacioni sistem), po\u0161tujte uputstva za
  upotrebu koje daje proizvo\u0111a\u010d mobilnih telefona.\\n\\nPODE\u0160AVANJE
  LAVAZZA 500 ESPRESSO EXPERIENCE\\n(za verzije/tr\u017ei\u0161ta, ukoliko su ponu\u0111ena)\\n\\nPode\u0161avanje
  se nalazi u zadnjem odeljku dr\u017ea\u010da za boce, na centralnom tunelu, sl.
  121.\\n\\nKod upotrebe Lavazza opreme, koja mo\u017ee biti naru\u010dena od kompanije
  Lineaccessori Fiat, pregledati dokumentaciju dobijenu uz samu opremu.\\n\\nWARNING\\nOpremu
  koristiti dok je vozilo u stacionarnom polo\u017eaju.\\n\\nNe koristiti opremu dok
  je motor isklju\u010den, u cilju o\u010duvanja kapaciteta baterije.\\n\\nSENZORI
  ZA PARKIRANJE\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nNalaze
  se u zadnjem braniku sl. 115, a funkcija im je da registruju prisustvo bilo kakve
  prepreke blizu zadnjeg dela vozila; shodno tome obave\u0161tavaju voza\u010da, pomo\u0107u
  isprekidanog zvu\u010dnog signala.\\n\\nAKTIVIRANJE / DEAKTIVIRANJE\\n\\nOvi senzori
  se automatski aktiviraju kada je vozilo u hodu unazad. Kako se vozilo pribli\u017eava
  prepreci, zvu\u010dni signal postaje sve u\u010destaliji.\\n\\nZVU\u010cNI SIGNAL\\n\\nKada
  je vozilo u hodu unazad, a iza njega se nalazi neka prepreka, emituje se zvu\u010dni
  signal koji varira zavisno od rastojanja branika od prepreke.\\n\\nU\u010destalost
  zvu\u010dnog signala:\\n\\n- se pove\u0107ava kako se smanjuje rastojanje izme\u0111u
  zila i prepreke, sa kulminacijom u neprekidnom zvu\u010dnom signalu, kada je rastojanje
  manje od oko 30 cm;\\n- se smanjuje ukoliko se pove\u0107ava rastojanje od prepreke,
  dok signal na kraju ne prestane potpuno;\\n- ostaje isti ukoliko rastojanje izme\u0111u
  vozila i prepreke ostaje nepromenjeno; ukoliko se ova situacija odnosi na bo\u010dne
  senzore, signal \u0107e prestati posle oko 3 sekunde kako bi se izbegle indikacije
  kao u slu\u010daju manevarsanja du\u017e zida.\\n\\nUkoliko senzori registruju nekoliko
  prepreka, samo \u0107e se najbli\u017ea uzeti u obzir.\\n\\nINDIKACIJA DEFEKTA\\n\\nNa
  defekte senzora za parkiranje kada je vozilo u hodu unazad ukazuje lampica upozorenja
  \u0394 na instrument tabli zajedno sa porukom na multifunkcionalnom displeju (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno) (videti deo \\\"Lampice
  upozorenja i poruke\\\").\\n\\nRAD SA PRIKOLICOM\\n\\nRad senzora se automatski
  deaktivira kada se utika\u010d elektri\u010dnog kabla prikolice uklju\u010di u uti\u010dnicu
  vu\u010dne kuke vozila.\\n\\nSenzori se automatski ponovo aktiviraju, kada se izvadi
  utika\u010d kabla prikolice.\\n\\nUPPOZORENJE\\n\\nZa pravilan rad, senzori moraju
  uvek da budu \u010disti, bez blata, prljavi\u0161tine, snega ili leda. Pazite da
  ih ne ogrebete ili o\u0161tetite kada ih \u010distite. Izbegavajte upotrebu suvih,
  grubih ili tvrdih krpa. Senzore treba prati \u010distom vodom sa dodatkom \u0161ampona
  za vozila, ukoliko je potrebno. Ako koristite specijalnu opremu za pranje kao \u0161to
  je mlaz pod pritiskom ili para, o\u010distite senzore vrlo brzo, dr\u017ee\u0107i
  mlaz na udaljenosti od 10 cm. Isto tako, nemojte stavljati nikakve nalepnice na
  senzore.\\n\\nOP\u0160TA UPOZORENJA\\n\\nPrilikom parkiranja pazite na prepreke
  koje mogu biti iznad ili ispod senzora.\\n\\nMogu\u0107e je da sistem pod odre\u0111enim
  okolnostima ne registruje predmete blizu vozila koji stoga mogu da o\u0161te\u0107ete
  vozilo ili da se i sami o\u0161te\u0107ete.\\n\\nNeki uslovi mogu da uti\u010du
  na rad senzora za parkiranje:\\n\\n- prisustvo leda, snega, blata ili farbe na povr\u0161ini
  senzora mo\u017ee da smanji osetljivost samog senzora i stoga da smanji performanse
  sistema;\\n\\n- mehani\u010dka dejstva (npr. pranje vozila, ki\u0161a, jak vetar,
  grad) mogu da uzrokuju da senzor registruje nepostoje\u0107u prepreku (echo interferencija);\\n\\n-
  prisustvo ultrazvu\u010dnih sistema (npr. pneumatski ko\u010dioni sistema kamiona
  ili pneumatske bu\u0161ilice) blizu vozila mogu da promene signale koje \u0161alje
  senzor;\\n\\n- promena polo\u017eaja senzora, uzrokovana promenama u vozilu (usled
  tro\u0161enja komponenti ve\u0161anja), zamena pneumatika, preoptere\u0107enosti
  vozila, ili pode\u0161avanja kojima se spu\u0161ta vozilo, predstavljaju primere
  koji mogu da uti\u010du na performanse sistema senzora za parkiranje.\\n\\nUPPOZORENJE\\n\\nUvek
  je voza\u010d odgovoran za manevrisanje tokom parkiranja. Kada vr\u0161ite ove manevre,
  proverite uvek da nema ljudi (posebno dece) ili \u017eivotinja u prostoru manevrisanja.
  Senzori za parkiranje su pomo\u0107no sredstvo za voza\u010da, ali on ne sme nikada
  da dozvoli da smanji pa\u017enju tokom potencijalno opasnih manevara, \u010dak i
  onih koji se vr\u0161e pri malim brzinama.\\n\\nKomanda gradske ko\u010dnice\\n\\nSISTEM
  ZA UBLA\u017dAVAJE SUDARA\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOvo
  je pomo\u0107ni sistem u vo\u017enji koji mo\u017ee da registruje vozila koja se
  nalaze na malom rastojanju ispred vozila i u slu\u010daju predstoje\u0107eg sudara
  da automatski interveni\u0161e ko\u010denjem vozila kako bi se spre\u010dio udar
  ili smanjile njegove posledice.\\n\\nOvaj sistem je uvek aktivan svaki put kada
  se klju\u010d za paljenje okrene u polo\u017eaj MAR-ON i kada je brzina vozila izme\u0111u
  5 i 30 km/h.\\n\\nSistem se mo\u017ee deaktivirati (a zatim ponovo aktivirati) sa
  menijem pode\u0161avanja na displeju (videti deo \\\"Stavke menija\\\" u ovom poglavlju).\\n\\nSistem
  se aktivira ukoliko postoji rizik od predstoje\u0107eg sudara, a voza\u010d ne pritisne
  brzo pedalu ko\u010dnice. Ukoliko detektuje da bi vozilo koje se nalazi ispred moglo
  biti udarenog, sistem mo\u017ee pripremiti kola za eventualno naglo ko\u010denje.\\n\\nUkoliko
  voza\u010d ne uradi ni\u0161ta da bi izbegao sudar, sistem mo\u017ee automatski
  da uspori kola, u cilju pripreme za eventualni sudar.\\n\\nU slu\u010daju rizika
  od sudara, ako pritisak na pedalu ko\u010dnice od strane voza\u010da nije dovoljan,
  sistem mo\u017ee da interveni\u0161e u cilju pobolj\u0161anja reagovanja ko\u010dionog
  sistema, dodatno smanjuju\u0107i brzinu automobila na taj na\u010din.\\n\\nKod vo\u017enje
  uzbrdo na strmoj nizbrdici, sistem mo\u017ee da interveni\u0161e, aktiviranjem ko\u010dionog
  sistema.\\n\\nVerzije opremljene sa sistemom Start&Stop: na kraju automatskog ko\u010denja,
  sistem Start&Stop se aktivira kako je opisano u delu \\\"Sistem Start&Stop\\\" ovog
  poglavlja.\\n\\nVerzije opremljene sa ru\u010dnim menja\u010dem: na kraju automatskog
  ko\u010denja mo\u017ee do\u0107i do isprekidanog rada motora i zatim njegovog ga\u0161enja,
  ukoliko voza\u010d ne pritisne pedalu kva\u010dila.\\n\\nVerzije opremljene automatskom
  transmisijom (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno): na kraju
  ko\u010denja ostaje aktivna poslednja memorisana brzina.\\n\\nVA\u017dNO: I kod
  verzija opremljenih sa ru\u010dnim menja\u010dem i onim sa automatskom transmisijom
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno), po zaustavljanju vozila
  mo\u017ee do\u0107i do zaglavljivanja ko\u010dione \u010deljusti na oko 2 sekunde
  iz bezbednosnih razloga. Nastojte da pritisnete pedalu ko\u010dnice ukoliko vozilo
  krene malo napred.\\n\\nVA\u017dNO: Ovaj sistem je aktivan samo kod brzine vozila
  izme\u0111u 5 i 30 km/h.\\n\\nVA\u017dNO: Sistem se NE\u0106E aktivirati ukoliko
  je menja\u010d uba\u010den u hod unazad ili ukoliko nisu vezani prednji sigurnosni
  pojasevi.\\n\\nLASERSKI SENZOR\\n\\nOvaj sistem sadr\u017ei laserski senzor, koji
  se nalazi u gornjem delu vetrobranskog stakla sl. 116.\\n\\nVA\u017dNO\\n\\nUPPOZORENJE\\n\\nIz
  bezbednostnih razloga hauba mora uvek biti pravilno zatvorena tokom vo\u017enje.
  Stoga proverite da li je hauba pravilno zatvorena i da li je brava zaklju\u010dana.
  Ukoliko u toku vo\u017enje otkrijete da brava nije potpuno zaklju\u010dana, odmah
  stanite i pravilno zatvorite haubu.\\n\\nUPPOZORENJE\\n\\nUkoliko voza\u010d pritisne
  pedalu ko\u010dnice do kraja ili napravi nagle pokrete upravlja\u010dem tokom rada
  ovog sistema, mo\u017ee do\u0107i do prekida rada funkcije automatskog ko\u010denja
  (npr. kako bi se omogu\u0107io mogu\u0107i manevar za izbegavanje prepreke).\\n\\nLaserski
  senzor mo\u017ee imati ograni\u010den rad ili je mogu\u0107e da ne radi usled vremenskih
  uslova kao \u0161to su: jaka ki\u0161a, grad, gusta magla, jak sneg, formiranje
  slojeva leda na vetrobranskom staklu.\\n\\nRad senzora mo\u017ee tako\u0111e da
  ugrozi pra\u0161ina, kondenzacija, prljav\u0161tina ili led na vetrobranskom staklu,
  uslovi u saobra\u0107aju (npr. vozila koja nisu u liniji sa va\u0161im vozilom,
  kre\u0107u se u popre\u010dnom ili suprotnom smeru u istoj traci, krivini sa malim
  polupre\u010dnikom), uslovi na povr\u0161ini kolovoza i uslovi vo\u017enje (npr.
  vo\u017enja po terenu van puteva). Nastojte da vetrobransko staklo bude uvek \u010disto.
  Koristite specijalne deterd\u017eente i \u010diste krpe kako biste izbegli grebanje
  vetrobranskog stakla. Rad senzora mo\u017ee tako\u0111e biti ograni\u010den ili
  je mogu\u0107e da ne radi u odre\u0111enim uslovima vo\u017enje, saobra\u0107aja
  i povr\u0161ina kolovoza.\\n\\nIstureni tovari na krovu vozila mogu da poremete
  pravilan rad senzora. Pre polaska nastojte da pravilno stavite teret, kako ne biste
  pokrili radni domet senzora.\\n\\nNemojte pokrivati radni domet senzora sa nalepnicama
  ili drugim predmetima. Isto tako obratite pa\u017enju na druge predmete na haubi
  (npr. sneg) i nastojte da oni ne reaguju na svetlo koje emituje laser.\\n\\nUkoliko
  je neophodno da se zameni vetrobransko staklo usled ogrebotina, o\u0161te\u0107enja
  ili lomljenja, obratite se isklju\u010divo Fiatovom dileru. Nemojte sami zamenjivati
  vetrobransko staklo usled rizika od nepravilnog postavljanja! Preporu\u010dujemo
  da zamenite vetrobransko staklo ukoliko je o\u0161te\u0107eno na mestu gde se nalazi
  laserski senzor.\\n\\nNemojte dirati laserski senzor. Nemojte zatvarati otvore na
  estetskom poklopcu koji se nalazi ispod unutra\u0161njeg retrovizora. U slu\u010daju
  defekta senzora, obratite se Fiatovom dileru.\\n\\nLaserski snop nije vidljiv golim
  okom. Nemojte gledati direktno, niti sa opti\u010dkim instrumentima (npr. so\u010diva)
  u laserski snop na rastojanju manjem od 10 cm: ovo mo\u017ee da uzrokuje o\u0161te\u0107enje
  vida. Laserski snop je tako\u0111e prisutan kada je klju\u010d u MAR-ON, a njegov
  rad isklju\u010den, nije na raspolaganju ili je ru\u010dno deaktiviran sa menijem
  pode\u0161avanja na displeju (videti deo \\\"Stavke menija\\\" u ovom poglavlju).\\n\\n**UPAZORENJE**\\n\\nOvaj
  sistem interveni\u0161e za vozila koja se kre\u0107u istom trakom. Mala vozila (npr.
  bicikli ili motocikli) ili ljudi, \u017eivotinje i stvari (npr. de\u010dija kolica)
  i generalno sve one prepreke sa malom refleksijom svetla koju emituje laser (npr.
  vozila prljava od blata) ne\u0107e biti registrovani.\\n\\nUPOZORENJE\\n\\nUkoliko
  vozilo treba testirati na valjicima (sa brzinom izme\u0111u 5 i 30 km/h) za potrebe
  odr\u017eavanja ili ukoliko se pere u tunelu sa automatskim valjcima za pranje,
  a ispred vozila se nalazi prepreka (npr. drugo vozilo, zid ili neka druga prepreka),
  mogu\u0107e je da sistem registruje njeno postojanje i da se aktivira. U ovom slu\u010daju
  treba sistem deaktivirati pomo\u0107u menija pode\u0161avanja na displeju (videti
  deo \\\"Stavke menija\\\" u ovom poglavlju).\\n\\nVO\u017dNJA U POSEBNIM USLOVIMA\\n\\nU
  odre\u0111enim uslovima vo\u017enje, kao \u0161to su, na primer:\\n- vo\u017enja
  blizu krivine;\\n- vozila malih dimenzija koja nisu postrojena u voznoj traci;\\n-
  promena trake od strane drugih vozila;\\n\\nIntervencija sistema mo\u017ee biti
  neo\u010dekivana ili odlo\u017eena. Voza\u010d zato mora biti veoma oprezan, i mora
  odr\u017eavati kontrolu nad vozilom da bi vozio na potpuno bezbedan na\u010din.\\n\\nVA\u017dNO
  Kod naro\u010dito komplikovanih uslova u saobra\u0107aju, voza\u010d mo\u017ee ru\u010dno
  da deaktivira sistem u Setup meniju (pogledaj paragraf \u201eStavke menija\u201c
  u ovom poglavlju).\\n\\nSistem treba deaktivirati ukoliko se vu\u010de prikolica
  ili vozilo pomo\u0107u menija pode\u0161avanja na displeju (videti deo \\\"Stavke
  menija\\\" u ovom poglavlju).\\n\\nVo\u017enja blizu krivine\\n\\nPrilikom savladavanja
  \u0161iroke krivine, laserski senzor mo\u017ee detektovati prisustvo vozila koje
  se ne kre\u0107e istom trakom ispred automobila, sl. 115: u ovom slu\u010daju sistem
  se mo\u017ee aktivirati.\\n\\nVozila malih dimenzija koja nisu postrojena u voznoj
  traci\\n\\nSistem ne mo\u017ee da detektuje vozila ispred automobila koja su izvan
  dometa laserskog senzora i ne mo\u017ee da reaguje na prisustvo malih vozila, kao
  \u0161to su bicikli i motocikli, sl. 116.\\n\\nPromena trake od strane drugih voz\u0438\u043b\u0430\\n\\nVozila
  koja iznenada menjaju pravac, ulaze u traku automobila, sl. 117, i unutar operativnog
  dometa laserskog senzora, mogu da izazovu aktiviranje sistema.\\n\\nDOLIVANJE GORIVA
  U VOZILO\\n\\nPre dolivanja goriva, proverite da li je vrsta goriva odgovaraju\u0107a.
  Tako\u0111e, ugasite motor pre dolivanja goriva.\\n\\nBENZINSKI MOTORI\\n\\nKoristite
  samo bezolovni benzin, oktanske vrednosti (RON) koja nije manja od 95.\\n\\nVA\u017dNO:
  Neefikasan kataliti\u010dki konvertor dovodi do emisija \u0161tetnih gasova, doprinose\u0107i
  tako zagadenju vazduha.\\n\\nVA\u017dNO: Nemojte koristiti olovni benzin, \u010dak
  ni u malim koli\u010dinama ili hitnim slu\u010dajevima, po\u0161to bi on trajno
  o\u0161tetio katalliti\u010dki konvertor.\\n\\nDIZEL MOTORI\\n\\nRad na niskim temperaturama\\n\\nUkoliko
  je spolja\u0161nja temperatura vrlo niska, dizel se zgu\u0161njava usled formiranja
  parafinskih ugru\u0161aka \u0161to dovodi do defektnog rada sistema za napajanje
  gorivom.\\n\\nDa bi se izbegli ovi problemi, u prodaji su razli\u010dite vrste dizel
  goriva zavisno od sezone: letnji tip, zimski tip i arkti\u010dki tip (hladna / planinska
  podru\u010dja).\\n\\nUkoliko dolivate dizel gorivo \u010dije specifikacije ne odgovaraju
  upotrebi u uslovima odre\u0111ene temperature, preporu\u010duje se me\u0161anje
  dizel goriva sa aditivom TUTELA DIESEL ART u proporcijama koje su navedene na ambala\u017ei.
  Sipajte aditiv u rezervoar pre dizel goriva.\\n\\nKada vozilo koristite ili parkirate
  du\u017ee vreme u planinskim ili hladnim podru\u010djima, preporu\u010duje se dolivanje
  goriva koje je na raspolaganju u tim podru\u010djima. U tom slu\u010daju se tako\u0111e
  preporu\u010duje da odr\u017eavate rezervoar napunjen vi\u0161e od 50%.\\n\\nZa
  dizel motore koristite samo dizel gorivo za motorna vozila u skladu sa evropskim
  specifikacijama EN590. Upotreba drugih proizvoda ili me\u0161avina mo\u017ee da
  trajno o\u0161teti motor i shodno tome da poni\u0161ti garanciju, zavisno od uzrokovanih
  o\u0161te\u0107enja.\\n\\nUkoliko slu\u010dajno sipate neku drugu vrstu goriva,
  nemojte startovati motor i ispraznite rezervoar za gorivo. Ukoliko je motor ve\u0107
  radio, \u010dak i samo vrlo kratko vreme, mora\u0107ete pored rezervoara da ispraznite
  i ceo sistem za gorivo.\\n\\nKAPACITET DOLIVANJA\\n\\nZa punjenje rezervoara do
  kraja, dolijte jo\u0161 dva puta posle isklju\u010denja pumpe.\\n\\nDalja dolivanja
  bi mogla da uzrokuju defekte u sistemu za napajanje gorivom.\\n\\nPROCEDURE DOLIVANJA
  GORIVA\\n\\nSmart Fuel je ure\u0111aj na otvoru rezervoara za gorivo koji se automatski
  otvara i ponovo zatvara kada se ubaci / izvadi pi\u0161tolj za punjenje goriva.\\n\\nSmart
  Fuel spre\u010dava dolivanje neodgovaraju\u0107eg goriva.\\n\\nProcedura dolivanja
  goriva opisana u daljem tekstu ilustrovana je na \u0161emi B sl. 117, koja se nalazi
  sa unutra\u0161nje strane klapne za gorivo. Ova \u0161ema tako\u0111e pokazuje vrstu
  goriva (BEZOLOVNO GORIVO = benzin, DIZEL = dizel gorivo).\\n\\nZa dolivanje goriva
  postupite kao \u0161to slije:\\n\\n- otvorite klapnu A sl. 117 tako \u0161to \u0107ete
  je povu\u0107i prema spolja;\\n- unesite pi\u0161tolj za punjenje u nalivno grlo
  i sipajte gorivo;\\n- na kraju dolivanja goriva, pre va\u0111enja pi\u0161tolja,
  sa\u010dekajte najmanje 10 sekundi kako bi gorivo pro\u0161lo u rezervoar;\\n- zatim
  izvadite pi\u0161tolj iz nalivnog grla i zatvorite klapnu A.\\n\\nKlapna A sl. 117
  ima poklopac za za\u0161titu od pra\u0161ine C koji spre\u010dava talo\u017eenje
  ne\u010disto\u0107a i pra\u0161ine na kraju nalivnog grla kada se zatvori klapna.\\n\\nDolivanje
  goriva u vanrednim situacijama\\n\\nUkoliko nema ni malo goriva u vozilu ili je
  instalacija napajanja potpuno prazno, postupite kao \u0161to sli\u0111e kako biste
  ponovo sipali gorivo u rezervoar:\\n\\n- otvorite prtlja\u017enik i uzmite adapter
  A koji se nalazi u kutiji sa alatom (verzije opremljene rezervnim to\u010dkom koji
  \u0161tedi prostor \u2013 za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)
  sl. 118 ili u kutiji sa kompletom Fix&Go (za brzu popravku pneumatika) (verzije
  opremljene sa kompletom Fix&Go) sl. 119;\\n- otvorite klapnu A sl. 117 tako \u0161to
  \u0107ete je povu\u0107i prema spolja;\\n- ubacite adapter u nalivno grlo kao \u0161to
  pokazuje sl. 120 i sipajte gorivo;\\n\\n- posle sipanja goriva, skinite adapter
  i zatvorite klapnu;\\n- vratite adapter u kutiju, a ovu vratite natrag u prtlja\u017enik.\\n\\nslika
  119\\n\\nslika 118\\n\\nslika 120\\n\\n**ZA\u0160TITA \u017dIVOTNE SREDINE**\\n\\nSlede\u0107i
  ure\u0111aji se koriste za smanjenje emisija benzinskog motora: kataliti\u010dki
  konvertor, senzori za kiseonik i kontrolni sistem isparenja.\\n\\nNemojte ostavljati
  upaljen motor, \u010dak in u cilju testiranja, kada je isklju\u010dena jedna ili
  vi\u0161e sve\u0107ica.\\n\\nSlede\u0107i ure\u0111aji se koriste za smanjenje emisija
  dizel motora: oksidiraju\u0107i kataliti\u010dki konvertor, sistem recirkulacije
  izdavnih gasova (EGR) i filter dizel \u010destica (DPF).\\n\\n**FILTER DIZEL \u010cESTICA**\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nFilter dizel \u010destica
  je mehani\u010dki filter, koji je sastavni deo izduvnog sistema i fizi\u010dki hvata
  \u010destice koje se nalaze u izduvnim gasovima dizel motora.\\n\\nFilter dizel
  \u010destica je potreban za eliminisanje skoro svih \u010destica u skladu sa teku\u0107im
  / budu\u0107im zakonima.\\n\\nTokom obi\u010dnog kori\u0161\u0107enja vozila, kontrolna
  jedinica motora evidentira niz podataka (npr. vreme vo\u017enje, tip putanje, temperature
  itd.), a zatim ra\u010duna koliko je \u010destica filter uhvatio.\\n\\nKako ovaj
  filter fizi\u010dki hvata \u010destice, potrebno je da se regeneri\u0161e (\u010disti)
  u redovnim intervalima sagorevanjem \u010destica ugljenika.\\n\\nKontrolna jedinica
  za upravljanje motorom kontroli\u0161e automatski ovu proceduru regeneracije zavisno
  od stanja filtra i uslova kori\u0161\u0107enja vozila.\\n\\nTokom regeneracije mogu\u0107e
  je ograni\u010deno pove\u0107anje praznog hoda motora, aktiviranje ventilatora,
  ograni\u010deno pove\u0107anje dima i visoke temperature iz izduvne cevi. Ovo nisu
  defekti; oni ne \u0161tete normalne performanse vozila niti \u0161tete \u017eivotnoj
  sredini. Ukoliko se prika\u017ee odgovaraju\u0107a poruka na displeju, pogledajte
  sadr\u017eaj poglavlja \\\"Lampice upozorenja i poruke\\\".\\n\\n**UPOZORENJE**\\n\\nKataliti\u010dki
  konvertor i filter dizel \u010destica (DPF) dosti\u017eu vrlo visoke temperature
  tokom rada. Stoga, nemojte parkirati vozilo na zapaljivim materialima (travi, suvom
  li\u0161\u0107u, borovim iglicama itd.) kako biste izbegli rizik od po\u017eara.\\n\\nSIGURNOSNI
  POJASEVI\\n\\nKORI\u0160\u0106ENJE SIGURNOSNIH POJASEVA\\n\\nPojas treba vezati
  po\u0161to gornji deo tela ispravite i naslonite na sedi\u0161te.\\n\\nZa vezivanje
  pojasa uzmite jezi\u010dak A sl. 121 i ubacite ga u kop\u010du B, dok ga ne zabravite.\\n\\nUkoliko
  se pojas zaglavi prilikom skidanja, pustite ga da se malo namota, zatim ga ponovo
  izvucite bez trzanja.\\n\\nZa odvezivanje pojasa, pritisnite dugme C. Pridr\u017eavajte
  pojas rukom dok se namota, kako biste izbegli da do\u0111e do uvrtanja. Pojas se
  preko kalema automatski prilago\u0111ava telu putnika koji ga koristi, omogu\u0107avaju\u0107i
  pritom slobodu pokreta.\\n\\nUPAZORENJE\\n\\nNemojte nikada pritiskati dugme C sl.
  121 tokom vo\u017enje.\\n\\nMogu\u0107e je da se kalem zaklju\u010da kada je vozilo
  parkirano na strmoj kosini: ovo je potpuno normalna pojava. \u0160tavi\u0161e, mehanizam
  kalema zaklju\u010dava pojas ukoliko je naglo povu\u010den ili u slu\u010daju naglog
  ko\u010denja, sudara i ulaska u krivine velikom brzinom.\\n\\nZadnja sedi\u0161ta
  imaju inercijalne sigurnosne pojaseve pri\u010dvr\u0161ene u tri ta\u010dke i kalem.
  Sigurnosne pojaseve zadnjih sedi\u0161ta treba vezivati kao \u0161to pokazuje slika
  122.\\n\\nSISTEM SBR\\n(Podsetnik za vezivanje pojaseva)\\n\\nOvaj sistem se sastoji
  od jednog ure\u0111aja koji u sprezi sa paljenjem lampice upozorenja sl. 123 (koja
  u po\u010detku svetli neprekidno i pra\u0107ena je neprekidnim zvu\u010dnim signalom,
  a zatim trepti, pra\u0107ena isprekidanim zvu\u010dnim signalom), upozorava voza\u010da
  i suvoza\u010da da nisu vezali svoje pojaseve.\\n\\nVA\u017dNO: Pomeranja tovarne
  platforme moraju biti u sredi\u0161njem polo\u017eaju u odnosu na prtlja\u017enik.\\n\\nZa
  verzije/tr\u017ei\u0161ta za koje je predvideno, obratite se Fiatovom dileru ukoliko
  \u017eelite da vam trajno deaktivira sistem SBR. Ovaj sistem je mogu\u0107e ponovo
  aktivirati samo putem displeja menija pode\u0161avanja (videti deo \\\"Upoznavanje
  sa va\u0161im vozilom\\\").\\n\\nslika 123\\n\\nVOZA\u010c\\n\\nCiklus zvu\u010dnog
  signala za prednja sedi\u0161ta (neprekidan zvu\u010dni signal u trajanju od 6 sekundi
  pra\u0107en isprekidanim zujuanjem u trajanju 90 sekundi) i treptanje lampice upozorenja
  uklju\u010duju se ukoliko se u vozilu nalazi samo voza\u010d koji nije vezao svoj
  pojas, \u010dim postigne ve\u0107u brzinu od 20 km/h ili ukoliko vozi brzinom izme\u0111u
  10 i 20 km/h du\u017ee od 5 sekundi.\\n\\nLampica upozorenja \u0107e ostati neprekidno
  upaljena na kraju ovog ciklusa dok se motor ne ugasi. Zvu\u010dni podsetnik se odmah
  isklju\u010duje kada voza\u010d ve\u017ee svoj pojas, a lampica upozorenja se gasi.\\n\\nCiklus
  podsetnika (zvu\u010dni i vizuelni) ponovi\u0107e se kako je prethodno opisano,
  ukoliko se sigurnosni pojas odve\u017ee u toku vo\u017enje.\\n\\nSUVOZA\u010c\\n\\nSli\u010dno
  re\u0161enje va\u017ei i za suvoza\u010da, ali ova indikacija se tako\u0111e i obustavlja
  \u010dim suvoza\u010d iza\u0111e iz vozila.\\n\\nUkoliko se oba sigurnosna pojasa
  prednjih sedi\u0161ta odve\u017eu u toku vo\u017enje i to u me\u0111usobnom razmaku
  od nekoliko sekundi, zvu\u010dni signal i paljenje lampice upozorenja odnosi\u0107e
  se na poslednje odvezivanje.\\n\\nURE\u0110AJI ZA PREDZATEZANJE\\n\\nVozilo je opremljeno
  sa ure\u0111ajima za predzatezanje sigurnosnih pojaseva prednjih sedi\u0161ta, koji
  povla\u010de sigurnosne pojaseve za nekoliko centimetara u slu\u010daju jakih prednjih
  sudara. Ovo garantuje savr\u0161eno prianjanje sigurnosnih pojaseva na va\u0161em
  telu pre nego \u0161to po\u010dne dejstvo ograni\u010davanja pomeranja.\\n\\nAktiviranje
  ure\u0111aja za predzatezanje je primetno kada se sigurnosni pojas povu\u010de prema
  kalemu.\\n\\nVozilo tako\u0111e ima i drugi ure\u0111aj za predzatezanje (u predelu
  donjeg dela vrata). Na njegovo aktiviranje ukazuje skra\u0107enje metalne sajle.\\n\\nMogu\u0107e
  je da do\u0111e do malog ispu\u0161tnja dima prilikom aktiviranja ure\u0111aja za
  predzatezanje, koji nije \u0161tetan i ne predstavlja opasnost od po\u017eara.\\n\\nVA\u017dNO:
  Za postizanje najve\u0107eg stepena za\u0161tite dejstvom ure\u0111aja za predzatezanje,
  ve\u017eite pojas tako da dobro prianja preko grudnog ko\u0161a i karlice.\\n\\nUre\u0111aj
  za predzatezanje ne zahteva nikakvo odr\u017eavanje niti podmazivanje: bilo kakve
  promene u njegovom prvobitnom stanju poni\u0161tice njegovu efikasnost. Ukoliko
  usled vanrednih prirodnih pojava (poplave oluje na moru itd.), ure\u0111aj do\u0111e
  u kontakt sa vodom i blatom, obavezno ga zamenite.\\n\\n**UPPOZORENJE**\\n\\nUre\u0111aj
  za predzatezanje je mogu\u0107e upotrebiti samo jednom. Obratite se Fiatovom dileru
  da ga zameni, ukoliko je upotrebljen. Rok upotrebe ure\u0111aja za predzatezanje
  naveden je na etiketi koja se nalazi na limu konture vrata. Ure\u0111aje za predzatezanje
  treba zameniti kod Fiatovog dilera kako se ovaj datum pribli\u017eava.\\n\\nPostupci
  koji dovode do udara, vibracija ili lokalizovanog zagrevanja (preko 100\u00b0C tokom
  maksimum \u0161est sati) u predelu ure\u0111aja za predzatezanje mogu da o\u0161tete
  ili gre\u0161kom aktiviraju ove ure\u0111aje. Na njih ne uti\u010du vibracije uzrokovane
  neravninama na kolovozima niti male prepreke kao \u0161to su ivi\u010dnjaci itd.
  Obratite se Fiatovom dileru ukoliko je potrebna intervencija.\\n\\n**OGRANI\u010cIVA\u010cI
  OPTERE\u0106ENJA**\\n\\nU cilju ve\u0107e bezbednosti putnika, kalemovi sigurnosnih
  pojaseva prednjih sedi\u0161ta imaju ograni\u010diva\u010d optere\u0107enja koji
  omogu\u0107ava kontrolisano popu\u0161tanje tako da predstavlja protivte\u017eu
  sili koja deluje na grudni ko\u0161 i ramena tokom dejstva ograni\u010denja pomeranja
  koje vr\u0161i pojas u slu\u010daju prednjih sudara.\\n\\n**OP\u0160TA UPUTSTVA
  ZA KORI\u0160\u0106ENJE SIGURNOSNIH POJASEVA**\\n\\nVoza\u010d je odgovoran za po\u0161tovanje
  i obezbe\u0111ivanje da svi putnici u vozilu tako\u0111e po\u0161tuju va\u017ee\u0107e
  lokalne zakone vezano za kori\u0161\u0107enje sigurnosnih pojaseva. Ve\u017eite
  uvek sigurnosne pojaseve pre startovanja. Trudnice moraju tako\u0111e da se ve\u017eu:
  rizik od povreda u slu\u010daju udesa je znatno smanjen za njih kao i za nero\u0111eno
  dete, ukoliko ve\u017eu sigurnosni pojas. Trudnice treba da nameste donji deo pojasa
  vrlo nisko dole tako da prelazi preko karlice i ispod stomaka (videti sl. 124)\\n\\nslika
  124\\n\\n**UPPOZORENJE**\\n\\n*Za maksimalnu bezbednost, namestite naslon sedi\u0161ta
  u uspravan polo\u017eaj, lepo se naslonite i nastojte da vam sigurnosni pojas pranja
  preko grudnog ko\u0161a i karlice. Uvek ve\u017eite pojaseve i na prednjim i zadnjim
  sedi\u0161tima! Vo\u017enja bez vezanih pojaseva pove\u0107ava rizik od ozbiljnih
  povreda, pa \u010dak i smrti u slu\u010daju udesa.*\\n\\n**UPPOZORENJE**\\n\\n*Strogo
  je zabranjeno skidanje ili neovla\u0161\u0107eno diranje komponenata sigurnosnih
  pojaseva i ure\u0111aja za predzatezanje na drugi na\u010din. Sve radnje na ovim
  komponentama moraju izvr\u0161avati kvalifikovani i ovla\u0161\u0107eni tehni\u010dari.
  Obratite se uvek Fiatovom dileru.*\\n\\nSvaki pojas treba da koristi samo jedna
  osoba. Nemojte nikada dozvoliti da dete u vo\u017enji sedi u krilu suvoza\u010da
  i da se zajedno ve\u017eu jednim pojasom sl. 126. Op\u0161te pravilo je da ne treba
  stavljati ni\u0161ta izme\u0111u tela putnika u vozilu i sigurnosnih pojaseva.\\n\\nPojas
  ne sme biti uvrnut. Gornji deo mora da prelazi dijagonalno preko ramena i grudnog
  ko\u0161a. Donji deo mora da pranja na karlicu (kako je prikazano na sl. 125) pre
  nego na stomak putnika. Nemojte nikada koristiti ure\u0111aje (spojnice, \u0161tipaljke
  itd.) kako biste odmakli sigurnosni pojas od tela.\\n\\n**UPAZORENJE**\\n\\nUkoliko
  do\u0111e do o\u0161trog povla\u010denja pojasa, na primer kao posledica udesa,
  sigurnosni pojas, zajedno sa ure\u0111ajima za pri\u010dvr\u0161\u0107ivanje, vijcima
  za montiranje ure\u0111aja za pri\u010dvr\u0161\u0107ivanje i ure\u0111aji za predzatezanje
  moraju biti kompletno zamenjeni. \u010cak i ako sigurnosni pojas ne pokazuje nikakve
  spolja\u0161nje znake istro\u0161enosti ili o\u0161te\u0107enja, mogu\u0107e je
  da je izgubio svoje karakteristike spre\u010davanja pomeranja.\\n\\n**ODR\u017dAVANJE
  SIGURNOSNIH POJASEVA**\\n\\nZa odr\u017eavanje sigurnosnih pojaseva u efikasnom
  stanju, po\u0161tujte slede\u0107e:\\n\\n- uvek koristite pojas tako \u0161to \u0107ete
  ga lepo izvu\u0107i i nemojte dozvoliti da se uvrne; obezbedite da mo\u017ee slobodno
  da se kre\u0107e i da ne nailazi ni na kakve prepreke;\\n- zamenite pojas posle
  ja\u010deg udesa, \u010dak i ako ne izgleda da je o\u0161te\u0107en. Zamenite uvek
  pojas ukoliko su bili aktivirani ure\u0111aji za predzatezanje;\\n- za \u010di\u0161\u0107enje
  pojasa, operite ih ru\u010dno sa vodom i neutralnim sapunom, isperite ih i ostavite
  da se su\u0161i u hladu. Nemojte nikada koristiti jake deterd\u017eente, izbeljiva\u010de,
  farbe ili druge supstance koje bi mogle da o\u0161t\u0435\u0442\u0435 vlakna pojasa;\\n-
  nastojte da ne ovla\u017eite kalem: njegov pravilan rad je mogu\u0107e garantovati
  samo ako voda ne u\u0111e unutra;\\n- zamenite sigurnosni pojas \u010dim vidite
  da je istro\u0161en ili pocepan.\\n\\n**BEZBEDNA VO\u017dNJA DECE**\\n\\nU cilju
  optimalne za\u0161tite u slu\u010daju udesa, neophodno je da svi putnici sede i
  da su vezani adekvatnim sistemima za vezivanje.\\n\\nOvaj propis je obavezuju\u0107i
  u svim zemljama Evropske unije u skladu sa njenom direktivom 2003/20/EC.\\n\\nOvo
  je jo\u0161 va\u017enije za decu, po\u0161to je njihova glava ve\u0107a i te\u017ea
  od glave odraslih lica u proporciji sa njihovim telom, dok njihova muskulturna i
  ko\u0161tana struktura nisu razvijene do kraja.\\n\\nStoga, su neophodni odgovaraju\u0107i
  sistemi za vezivanje koji se razlikuju od sigurnosnih pojaseva za odrasle.\\n\\nRezultati
  istra\u017eivanja o najboljoj za\u0161titi dece sadr\u017eani su u evropskom standardu
  ECE-R44, koji nala\u017ee upotrebu sistema za vezivanje i klasifikuje ih u pet grupa:\\n\\n|
  Grupa       | Te\u017einska grupa |\\n|-------------|----------------|\\n| Grupa
  0     | do 10 kg       |\\n| Grupa 0+    | do 13 kg       |\\n| Grupa 1     | 9
  \u2013 18 kg      |\\n| Grupa 2     | 15 \u2013 25 kg     |\\n| Grupa 3     | 22
  \u2013 36 kg     |\\n\\nSvi ure\u0111aji za vezivanje moraju imati podatke o odborenju
  tipa zajedno sa kontrolnom oznakom na etiketi koja treba da bude \u010dvrsto fiksirana
  na de\u010dije sedi\u0161te i koja se ne sme nikada skidati.\\n\\nDeca \u010dija
  je visina ve\u0107a od 1,50 m smatraju se odraslim licima \u0161to se ti\u010de
  sistema za vezivanje i vezuju se sa sigurnosnim pojasevima vozila kao i odrasli.
  Lineaccessori Fiat ima u ponudi sisteme za vezivanje svih te\u017einskih grupa.
  Ovi ure\u0111aji se preporu\u010duju po\u0161to su projektovani posebno za vozila
  Fiat.\\n\\n**UPPOZORENJE**\\n\\nKada je ugra\u0111en aktivni vazdu\u0161ni jastuk
  za suvoza\u010da, **NEMOJTE** montirati de\u010dija sedi\u0161ta na prednje sedi\u0161te
  okrenuto le\u0111ima prema vetrobranskom staklu. Razme\u0161tanje vazdu\u0161nog
  jastuka u slu\u010daju udesa moglo bi da uzrokuje smrtonosne povrede bebe bez obzira
  na ozbiljnost sudara. Preporu\u010duje se da se deca uvek voze u de\u010dijim sedi\u0161tima
  na zadnjem sedi\u0161tu, koje je najza\u0161ti\u0107enije mesto u slu\u010daju sudara.\\n\\n**UPPOZORENJE**\\n\\nUkoliko
  je apsolutno neophodno da vozite dete na prednjem sedi\u0161tu suvoza\u010da u de\u010dijem
  sedi\u0161tu okrenutom le\u0111ima prema vetrobranskom staklu, obavezno deaktivirajte
  bo\u010dni vazdu\u0161ni jastuk (za\u0161tita karlice, grudnog ko\u0161a i ramena)
  i prednji vazdu\u0161ni jastuk suvoza\u010da preko menija pode\u0161avanja. Deaktiviranje
  treba proveriti tako \u0161to treba videti da li je upaljena lampica upozorenja
  \\\\( \\\\text{\u26a0\ufe0f} \\\\) na instrument plo\u010di. Sedi\u0161te suvoza\u010da
  morate tako\u0111e pomeriti \u0161to je mogu\u0107e vi\u0161e unazad, kako biste
  spre\u010dili da de\u010dije sedi\u0161te do\u0111e u kontakt sa instrument tablom.\\n\\n**MONTIRANJE
  DE\u010cIJEG SEDI\u0160TA \\\"UNIVERSAL\\\"**\\n(sa sigurnosnim pojasevima)\\n\\n**GRUPA
  0 i 0+**\\n\\n**UPPOZORENJE**\\n\\nDijagram je samo indikativan i za potrebe monta\u017ee.
  Montirajte de\u010dije sedi\u0161te u skladu sa uputstvima, koja morate dobiti uz
  ovaj tip sistema za vezivanje.\\n\\nBebe do 13 kg te\u017eine moraju se voziti u
  sedi\u0161tu za bebe okrenutom le\u0111ima prema vetrobranskom staklu, koje je takvog
  tipa da daje oslonac glavi i ne pritiska vrat u slu\u010daju naglih usporena.\\n\\nSedi\u0161te
  za bebe se fiksira pomo\u0107u sigurnosnih pojaseva vozila kao \u0161to to pokazuje
  slika 127, a dete se vezuje pojasevima de\u010dijeg sedi\u0161ta.\\n\\n**UPPOZORENJE**\\n\\nDijagram
  je samo indikativan i za potrebe monta\u017ee. Montirajte de\u010dije sedi\u0161te
  u skladu sa uputstvima, koja morate dobiti uz ovaj tip sistema za vezivanje.\\n\\nOd
  9 kg do 18 kg te\u017eine, deca se mogu voziti u polo\u017eaju okrenutom prema napred
  sl. 128.\\n\\n**UPPOZORENJE**\\n\\nU ponudi su de\u010dija sedi\u0161ta sa ISOFIX
  priklju\u010dkom za bezbedno pri\u010dvr\u0161\u0107ivanje za sedi\u0161te bez kori\u0161\u0107enja
  sigurnosnih pojaseva vozila.\\n\\nGRUPA 2\\n\\n**UPOZORENJE**\\n\\nDijagram je samo
  indikativan i za potrebe monta\u017ee. Montirajte de\u010dije sedi\u0161te u skladu
  sa uputstvima, koja morate dobiti uz ovaj tip sistema za vezivanje.\\n\\nDeca od
  15 do 25 kg mogu direktno da koriste sigurnosne pojaseve vozila sl. 129. U ovom
  slu\u010daju, de\u010dije sedi\u0161te se koristi za pravilno name\u0161tanje deteta
  u odnosu na pojaseve, tako da dijagonalni deo pojasa prelazi preko grudnog ko\u0161a
  deteta, a ne preko vrata, a donji deo prianja na karlicu, a ne na stomak.\\n\\nslika
  129\\n\\nGRUPA 3\\n\\n**UPOZORENJE**\\n\\nDijagram je samo indikativan i za potrebe
  monta\u017ee. Montirajte de\u010dije sedi\u0161te u skladu sa uputstvima, koja morate
  dobiti uz ovaj tip sistema za vezivanje.\\n\\nZa decu od 22 kg do 36 kg postoje
  odgovaraju\u0107i vertikalni strukturni elementi za pravilno pozicioniranje sigurnosnog
  pojasa. Slika 130 pokazuje primer pravilnog pozicioniranja de\u010dijeg sedi\u0161ta
  na zadnjem sedi\u0161tu. Deca \u010dija visina prelazi 1,50 m mogu da koriste sigurnosne
  pojaseve isto kao odrasla lica.\\n\\nslika 130\\n\\nPODESNOST SEDI\u0160TA ZA MONTIRANJE
  DE\u010cIJEG SEDI\u0160TA \\\"UNIVERSAL\\\"\\n\\nVozilo odgovara novoj evropskoj
  direktivi 2000/3/EC koja reguli\u0161e mogu\u0107nosti montiranja sistema za vezivanje
  dece na sedi\u0161tima vozila kao \u0161to to pokazuje slede\u0107a tabela:\\n\\n|
  Grupa   | Te\u017einska grupa | Sedi\u0161te suvoza\u010da | Zadnje srednje sedi\u0161te
  | Zadnja bo\u010dna sedi\u0161ta |\\n|---------|----------------|------------------|------------------------|----------------------|\\n|
  Grupa 0 | do 10 kg       | U                | X                      | U                    |\\n|
  Grupa 0+| do 13 kg       | U                | X                      | U                    |\\n|
  Grupa I | 9 \u2013 18 kg      | U                | X                      | U                    |\\n|
  Grupa 2 | 15 \u2013 25 kg     | U                | X                      | U                    |\\n|
  Grupa 3 | 22 \u2013 36 kg     | U                | X                      | U                    |\\n\\nU
  = podesno za sisteme za vezivanje dece u kategoriji \\\"Universal\\\", u skladu
  sa evropskim propisom EEC-R44 za navedene grupe.\\n\\nX = sedi\u0161te nije podesno
  za decu ove te\u017einske kategorije.\\n\\nGlavna bezbednosna pravila koja treba
  po\u0161tovati kada vozite decu:\\n\\n- montirajte de\u010dije sedi\u0161te na zadnje
  sedi\u0161te, koje je najza\u0161ti\u0107enije mesto u slu\u010daju udesa.\\n- ukoliko
  je deaktiviran vazdu\u0161ni jastuk suvoza\u010da, provjerite uvek lampicu upozorenja
  na instrument tabli, kako biste bili sigurni da je stvarno deaktiviran.\\n- pa\u017eljivo
  po\u0161tujte uputstva data uz de\u010dije sedi\u0161te, koja proizvo\u0111a\u010d
  mora da obezbedi. \u010cuvajte ova uputstva u vozilu zajedno sa ostalim dokumentima
  i ovim priru\u010dnikom. Nemojte koristiti polovna de\u010dija sedi\u0161ta koja
  nemaju uputstva.\\n- Samo jedno dete treba vezati sa jednim sistemom za vezivanje;
  nemojte nikada voziti dvoje dece u jednom de\u010dijem sedi\u0161tu.\\n- Proverite
  uvek da sigurnosni pojasevi na prelaze detetu preko vrata.\\n- Proverite uvek da
  li je sigurnosni pojas dobro vezan, tako \u0161to \u0107ete ga povu\u0107i.\\n-
  Nemojte dozvoliti deci tokom vo\u017enje da sede nepravilno ili da odvezuju pojaseve.\\n-
  Nemojte nikada dr\u017eati dete u krilu tokom vo\u017enje, \u010dak ni novoro\u0111en\u010de.
  Niko ne mo\u017ee da zadr\u017ei dete u slu\u010daju udesa.\\n- U slu\u010daju udesa,
  zamenite de\u010dije sedi\u0161te sa novim.\\n\\nMONTA\u017dA DE\u010cIJEG SEDI\u0160TA
  \\\"ISOFIX\\\"\\n\\nU vozilu je mogu\u0107e montirati de\u010dije sedi\u0161te \\\"Universal
  Isofix\\\" koje predstavlja nov evropski standardizovan sistem za bezbedan prevoz
  dece.\\n\\n\\\"Isofix\\\" sistemi se mogu montirati pored tradicionalnih de\u010dijih
  sedi\u0161ta.\\n\\nJedan primer de\u010dijeg sedi\u0161ta \\\"Universal Isofix\\\"
  za te\u017einsku grupu I prikazan je na sl. 131.\\n\\nOstale te\u017einske grupe
  pokrivene su odre\u0111enim de\u010dijim sedi\u0161tim \\\"Isofix\\\", koja se mogu
  koristiti samo ukoliko su posebno testirana za ovo vozilo (videti spisak vozila
  dat uz de\u010dije sedi\u0161te).\\n\\nVA\u017dNO: Srednje zadnje sedi\u0161te (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno) nije odobreno ni za jedan
  tip \\\"Isofix\\\" de\u010dijih sedi\u0161ta.\\n\\nZa montiranje de\u010dijih sedi\u0161ta
  preporu\u010dujemo pomeranje zadnjeg sedi\u0161ta unazad do kraja.\\n\\nMONTIRANJE
  DE\u010cIJEG SEDI\u0160TA \\\"UNIVERSAL ISOFIX\\\"\\n\\nFiksirajte sedi\u0161te
  kori\u0161\u0107enjem specijalnih donjih metalnih prstenova A sl. 132 koji se nalaze
  na zadnjem sedi\u0161tu, zatim fiksirajte gornji ka\u0161 (na de\u010dijem sedi\u0161tu)
  za priklju\u010dke B sl. 133 koji se nalaze u zadnjem delu naslona sedi\u0161ta.
  Zapamtite da kada koristite de\u010dije sedi\u0161te \\\"Universal Isofix\\\", mo\u017eete
  koristiti samo odobrena de\u010dija sedi\u0161ta sa oznakom ECE R44/03 \\\"Universal
  Isofix\\\".\\n\\nU ponudi Lineaccessori Fiat su de\u010dija sedi\u0161ta \\\"Universal
  Isofix\\\", \\\"Duo Plus\\\" i \\\"SafeFix\\\" kao i specijalno sedi\u0161te \\\"G0/1S\\\".
  Za vi\u0161e informacija obratite se Fiatovom dileru.\\n\\nZa vi\u0161e informacija
  o montiranju i/ili kori\u0161\u0107enju, pogledajte uputstva koja prate de\u010dije
  sedi\u0161te.\\n\\n**UPAZORENJE**\\n\\nMontirajte de\u010dije sedi\u0161te kada
  vozilo miruje. De\u010dije sedi\u0161te je pravilno pri\u010dvr\u0161\u0107eno za
  nosa\u010de kada \u010dujete da je mehanizam zabravljen. Po\u0161tujte instrukcije
  za monta\u017eu, skidanje i pozicioniranje koje proizvo\u0111a\u010d mora da obezbedi
  uz de\u010dije sedi\u0161te.\\n\\nPODESNOST SEDI\u0160TA ZA KORI\u0160\u0106ENJE
  DE\u010cIJEG SEDI\u0160TA \\\"ISOFIX\\\"\\n\\nNi\u017ee data tabela pokazuje razne
  mogu\u0107nosti monta\u017ee de\u010dijih sedi\u0161ta \\\"Isofix\\\" na sedi\u0161tima
  opremljenim sa priklju\u010dcima \\\"Isofix\\\" u skladu sa evropskim standardom
  ECE 16.\\n\\n| Te\u017einska grupa | Polo\u017eaj de\u010dijeg sedi\u0161ta | Klasa
  veli\u010dine \\\"Isofix\\\" | Zadnje sedi\u0161te |\\n|----------------|-------------------------|------------------------|---------------|\\n|
  Sedi\u0161te za bebe | Okrenuto licem prema nazad | F                      | X             |\\n|                 |
  Okrenuto licem prema nazad | G                      | X             |\\n| Grupa
  0 \u2013 do 10 kg | Okrenuto licem prema nazad | E                      | IL            |\\n|
  Grupa 0+ - do 13 kg | Okrenuto licem prema nazad | E                      | IL            |\\n|                 |
  Okrenuto licem prema nazad | D                      | IL            |\\n|                 |
  Okrenuto licem prema nazad | C                      | IL            |\\n| Grupa
  I \u2013 od 9 do 18 kg | Okrenuto licem prema nazad | D                      | IL            |\\n|                 |
  Okrenuto licem prema nazad | C                      | IL            |\\n|                 |
  Okrenuto licem prema napred | B                      | IUF           |\\n|                 |
  Okrenuto licem prema napred | BI                     | IUF           |\\n|                 |
  Okrenuto licem prema napred | A                      | IUF           |\\n\\nX: Polo\u017eaj
  \\\"Isofix\\\" nije podesan za de\u010dija sedi\u0161ta u ovoj te\u017einskoj grupi
  i/ili klasi veli\u010dine.\\n\\nIL: De\u010dije sedi\u0161te \\\"Isofix\\\" mo\u017ee
  se montirati pode\u0161avanjem prednjeg sedi\u0161ta.\\n\\nIL (*): podesno za namenske
  sisteme za vezivanje dece \\\"Isofix\\\" opisane u prilo\u017eenom listu. Ovi \\\"Isofix\\\"
  sistemi za vezivanje dece su kategorije za \\\"odre\u0111ena vozila\\\", \\\"ograni\u010dena\\\"
  ili \\\"polu-univerzalna\\\".\\n\\nIUF: podesna za sisteme za vezivanje dece \\\"Isofix\\\"
  sa licem okrenutim prema napred u \\\"Universal\\\" kategoriji i sa tipskim odobrenjem
  za kori\u0161\u0107enje u te\u017einskoj grupi.\\n\\nVAZDU\u0160NI JASTUK\\n\\nVozilo
  je opremljeno prednjim vazdu\u0161nim jastucima za voza\u010da i suvoza\u010da,
  vazdu\u0161nim jastukom za kolena voza\u010da (za verzije / tr\u017ei\u0161ta za
  koje je predvi\u0111eno), prednjim bo\u010dnim vazdu\u0161nim jastucima za voza\u010da
  i suvoza\u010da za za\u0161titu karlice, grudnog ko\u0161a, ramena (za verzije /
  tr\u017ei\u0161ta za koje je predvi\u0111eno) i prozorskim vazdu\u0161nim jastucima
  za za\u0161titu glava osoba na prednjim sedi\u0161tima.\\n\\nPREDNJI VAZDU\u0160NI
  JASTUCI\\n\\nPrednji vazdu\u0161ni jastuci za voza\u010da / suvoza\u010da i vazdu\u0161ni
  jastuk za kolena voza\u010da (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)
  \u0161tite osobe na prednjim sedi\u0161tima u slu\u010daju prednjih sudara srednje
  / velike ozbiljnosti, tako \u0161to se jastuk postavlja izme\u0111u osoba u vozilu
  i upravlja\u010da ili instrument table.\\n\\nStoga nerazmje\u0161tanje vazdu\u0161nih
  jastuka u drugim vrstama sudara (bo\u010dni sudari, udari otpozadi, prevrtanja itd.)
  ne zna\u010di da je sistem neispravan.\\n\\nPrednji vazdu\u0161ni jastuci (za voza\u010da
  / suvoza\u010da) nisu zamena, ve\u0107 dopuna sigurnosnim pojasevima, koje vam preporu\u010dujemo
  da uvek vezete, kako to nalaze zakon u Evropi i ve\u0107ini zemalja izvan Evrope.\\n\\nU
  slu\u010daju udara, oni koji nisu vezali sigurnosne pojaseve lete prema napred i
  mogu do\u0107i u kontakt sa vazdu\u0161nim jastukom koji se jo\u0161 uvijek naduvava.
  U ovakvim okolnostima je ugro\u017eena za\u0161tita koju pru\u017ea vazdu\u0161ni
  jastuk.\\n\\nMogu\u0107e je da se prednji vazdu\u0161ni jastuci ne aktiviraju u
  slede\u0107im situacijama:\\n\\n- prednji sudari sa predmetima velike deformabilnosti
  koji ne uklju\u010duju prednju povr\u0161inu vozila (npr. udari krilom u ograde
  itd.);\\n- podvla\u010denje vozila pod druga vozila ili za\u0161titne ograde (npr.
  kamioni ili za\u0161titne ograde).\\n\\nPropust u aktiviranju u prethodno opisanim
  uslovima posledica je \u010dinjenice da oni ne bi mogli da obezbede nikakvu dodatnu
  za\u0161titu u pore\u0111enju sa sigurnosnim pojasevima, tako da bi njihovo aktiviranje
  bilo neodgovaraju\u0107e.\\n\\nU ovim slu\u010dajevima, izostanak aktiviranja vazdu\u0161nih
  jastuka ne mora da zna\u010di da je sistem neispravan.\\n\\n**UPOZORENJE**\\n\\n*Nemojte
  stavljati bilo kakve nalepnice niti druge predmete na upravlja\u010d, instrument
  tablu na mestu vazdu\u0161nog jastuka suvoza\u010da, na bo\u010dni tapacirung na
  krovu ili na sedi\u0161ta. Nikada ne stavljajte bilo kakve predmete (npr. mobilne
  telefone) na instrument tablu ispred suvoza\u010da, po\u0161to bi oni mogli da poremete
  pravilno naduvavanje vazdu\u0161nog jastuka suvoza\u010da i isto tako da uzrokuju
  ozbiljne povrede putnika.*\\n\\nPrednji vazdu\u0161ni jastuk voza\u010da\\n\\nSastoji
  se od jastuka koji se naduvava u trenutku, a nalazi se u specijalnom udubljenju
  u upravlja\u010du sl. 134.\\n\\n**UPOZORENJE**\\n\\nVozite uvek sa rukama na upravlja\u010du
  kako bi vazdu\u0161ni jastuk mogao slobodno da se naduva, ukoliko je potrebno. Nemojte
  voziti sa telom nagnutim napred. Ispravite le\u0111a i lepo se naslonite na naslon
  sedi\u0161ta.\\n\\n**UPPOZORENJE**\\n\\nOZBILJNA OPASNOST: Nemojte nikada stavljati
  sedi\u0161te za bebe okrenuto le\u0111ima prema vetrobranskom staklu na prednje
  sedi\u0161te suvoza\u010da vozila sa aktivnim vazdu\u0161nim jastukom suvoza\u010da.
  Naduvavanje vazdu\u0161nog jastuka nakon sudara moglo bi da uzrokuje smrtonosne
  povrede deteta. Deaktivirajte uvek vazdu\u0161ni jastuk suvoza\u010da, kada stavljate
  de\u010dije sedi\u0161te na prednje sedi\u0161te. Sedi\u0161te suvoza\u010da morate
  tako\u0111e da pomerite \u0161to je mogu\u0107e vi\u0161e unazad kako biste izbegli
  da de\u010dije sedi\u0161te do\u0111e u kontakt sa instrument tablom. Iako ovo nije
  obavezuju\u0107e po zakonu, vazdu\u0161ni jastuk treba odmah ponovo aktivirati kada
  vi\u0161e ne vozite decu, kako biste obezbedili bolju za\u0161titu odraslih.\\n\\nPrednji
  vazdu\u0161ni jastuk suvoza\u010da\\n\\nSastoji se od jastuka koji se naduvava u
  trenutku, a sme\u0161ten je u posebnoj pregradi u instrument tabli sl. 135: ovaj
  jastuk je ve\u0107i od voza\u010devog.\\n\\nJastuk za kolena voza\u010da\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nOvaj jastuk se nalazi u namenskoj
  pregradi ispod upravlja\u010da sl. 136. On obezbe\u0111uje dodatnu za\u0161titu
  u slu\u010daju \u010deonog sudara.\\n\\nDeaktiviranje prednjeg vazdu\u0161nog jastuka
  suvoza\u010da i bo\u010dnog vazdu\u0161nog jastuka za za\u0161titu karlice, grudnog
  ko\u0161a i ramena\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nUkoliko
  morate da vozite dete na prednjem sedi\u0161tu u de\u010dijem sedi\u0161tu okenutom
  le\u0111ima prema vetrobranskom staklu, deaktivirajte prednji vazdu\u0161ni jastuk
  suvoza\u010da i bo\u010dne vazdu\u0161ne jastuke za za\u0161titu karlice, grudnog
  ko\u0161a i ramena (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nLampica
  upozorenja se pali na instrument tabli, kada su deaktivirani vazdu\u0161ni jastuci.\\nVA\u017dNO:
  Za deaktiviranje vazdu\u0161nih jastuka pogledajte opis u delu \\\"Opcije menija\\\"
  u poglavlju \\\"Upoznavanje va\u0161eg vozila\\\".\\n\\nBO\u010cNI VAZDU\u0160NI
  JASTUCI\\n(Bo\u010dni vazdu\u0161ni jastuk \u2013 prozorski vazdu\u0161ni jastuk)\\n\\nBo\u010dni
  vazdu\u0161ni jastuk\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nOvi
  obuhvataju dve vrste vazdu\u0161nih jastuka koji se nalaze u naslonima prednjih
  sedi\u0161ta sl. 137 koji \u0161tite karlicu, grudni ko\u0161 i ramena osoba u vozilu
  u slu\u010daju bo\u010dnih udara srednje / velike ozbiljnosti.\\n\\nProzorski vazdu\u0161ni
  jastuk\\nPredstavlja vazdu\u0161nu zavesu sme\u0161tenu iza bo\u010dnih obloga krova
  sa posebnim poklopcima sl. 138.\\nPredvi\u0111en je da za\u0161tititi glave prednjih
  i zadnjih putnika u slu\u010daju bo\u010dnih udara, zahvaljuju\u0107i \u0161irokoj
  povr\u0161ini naduvavanja jastuka.\\nNije potrebno aktiviranje bo\u010dnih vazdu\u0161nih
  jastuka u slu\u010daju bo\u010dnih udara male ozbiljnosti.\\n\\nU slu\u010daju bo\u010dnih
  udara, sistem pru\u017ea najbolju za\u0161titu ukoliko putnik sedi u pravilnom polo\u017eaju
  na sedi\u0161tu, \u010dime omogu\u0107ava pravilno razme\u0161tanje prozorskog vazdu\u0161nog
  jastuka.\\n\\nVA\u017dNO: Nemojte ka\u010diti tvrde predmete na kuke za ode\u0107u
  niti na ru\u010dke.\\n\\nVA\u017dNO: Nemojte naslanjati glavu, ruke niti laktove
  na vrata, prozore niti na povr\u0161ine gde se nalaze vazdu\u0161ni jastuci, kako
  biste izbegli mogu\u0107e povrede prilikom naduvavanja vazdu\u0161nih jastuka.\\n\\nVA\u017dNO:
  Nemojte nikada naslanjati glavu, ruke niti laktove na prozor.\\n\\n**VA\u017dNO**\\n\\nNemojte
  prati sedi\u0161ta vodom niti sa parom pod pritiskom (ru\u010dno ili u servisima
  za automatsko pranje sedi\u0161ta).\\n\\nMogu\u0107e je da do\u0111e do aktiviranja
  prednjih vazdu\u0161nih jastuka i/ili bo\u010dnih vazdu\u0161nih jastuka ukoliko
  se vozilo izlo\u017ei jakim udarima koji uklju\u010duju donji deo karoserije (npr.
  jaki udari u stepenike ili ivi\u010dnjake, velike rupe ili ulegnu\u0107a u putu
  itd.).\\n\\nVazdu\u0161ni jastuci ispu\u0161taju malo pra\u0161ine prilikom razme\u0161tanja:
  ova pra\u0161ina je bezopasna i ne zna\u010di po\u010detak po\u017eara. Me\u0111utim
  ova pra\u0161ina mo\u017ee da iritira ko\u017eu i o\u010di: u ovom slu\u010daju,
  operite ih vodom sa neutralnim sapunom.\\n\\nKontrolu, popravku i zamenu vazdu\u0161nih
  jastuka mora da uradi Fiatov diler.\\n\\nAko vozilo ide na otpad, obratite se Fiatovom
  dileru da deaktivira sistem vazdu\u0161nih jastuka.\\n\\nUre\u0111aji za predzatezanje
  i vazdu\u0161ni jastuci razme\u0161taju se na razli\u010dite na\u010dine, zavisno
  od vrste udara. Nerazme\u0161tanje jednog ili vi\u0161e ovih ure\u0111aja ne zna\u010di
  da je taj sistem neispravan.\\n\\n**UPPOZORENJE**\\n\\nUkoliko se ne upali lampica
  upozorenja \ud83d\udea7 kada klju\u010d okrenete u polo\u017eaj MAR-ON, ili ukoliko
  ona ostane upaljena tokom vo\u017enje, mogu\u0107e je da je do\u0161lo do kvara
  u sigurnosnim sistemima. U ovom slu\u010daju je mogu\u0107e da vazdu\u0161ni jastuci
  ili ure\u0111aji za predzatezanje ne\u0107e funkcionisati u slu\u010daju sudara
  ili u manjem broju slu\u010daja mogu se aktivirati slu\u010dajno. Pre nego \u0161to
  krenete dalje, obratite se odmah Fiatovom dileru da prekontroli\u0161e sistem.\\n\\n**UPPOZORENJE**\\n\\nZa
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno u slu\u010daju otkazivanja
  lampice upozorenja \ud83d\udea7, pali se lampica upozorenja \ud83d\udea7 i deaktiviraju
  se eksplozivna punjenja suvoza\u010devog vazdu\u0161nog jastuka.\\n\\n**UPPOZORENJE**\\n\\nNemojte
  stavljati presvlake na naslone prednjih sedi\u0161ta vozila koja imaju bo\u010dne
  vazdu\u0161ne jastuke.\\n\\nNemojte dr\u017eati ni\u0161ta u krilu, ispred grudnog
  ko\u0161a ili izme\u0111u usni (lule, olovke itd.) tokom vo\u017enje. Ovakvi predmeti
  bi mogli da uzrokuju ozbiljne povrede u slu\u010daju aktiviranja vazdu\u0161nog
  jastuka.\\n\\nDatumi isteka roka va\u017enosti eksplozivnog punjenja i spiralne
  opruge prikazani su na odre\u0111enoj oznaci koja se nalazi u donjoj pregradi za
  sitne stvari i dokumenta. Obratite se Fiatovom dileru da vam zameni ove ure\u0111aje
  kako se ovi datumi pribli\u017ee.\\n\\nUkoliko je vozilo ukradeno ili ste imali
  poku\u0161aj kra\u0111e, ukoliko je bilo o\u0161te\u0107eno ili u poplavi, obratite
  se Fiatovom dileru da pregleda sistem vazdu\u0161nih jastuka.\\n\\nVazdu\u0161ni
  jastuci se tako\u0111e mogu aktivirati i kada vozilo nije u pokretu, ukoliko je
  klju\u010d u prekida\u010du paljenja i okrenut na MAR-ON ili kada je motor uga\u0161en,
  ukoliko ga udari drugo vozilo. Iz ovog razloga, decu ne treba nikada stavljati na
  prednje sedi\u0161te u de\u010dijem sedi\u0161tu okrenutom le\u0111ima prema vetrobranskom
  staklu, \u010dak i ako vozilo miruje. Aktiviranje vazdu\u0161nog jastuka nakon udara
  moglo bi da uzrokuje smrtonosne povrede deteta. Deaktivirajte uvek vazdu\u0161ni
  jastuk suvoza\u010da ukoliko je potrebno da stavljate de\u010dije sedi\u0161te na
  prednje sedi\u0161te. Tako\u0111e morate gurnuti sedi\u0161te suvoza\u010da \u0161to
  je mogu\u0107e vi\u0161e unazad kako biste spre\u010dili da de\u010dije sedi\u0161te
  do\u0111e u kontakt sa instrument tablom. Iako ne postoji zakonska obaveza za to,
  vazdu\u0161ni jastuk treba odmah ponovo aktivirati \u010dim decu vi\u0161e ne vozite,
  kako biste obezbedili bolju za\u0161titu odraslih. S druge strane, ako je klju\u010d
  okrenut na STOP, ne\u0107e se aktivirati nijedan od sigurnosnih ure\u0111aja (vazdu\u0161ni
  jastuci, ure\u0111aji za predzatezanje) u slu\u010daju sudara. Neaktiviranje ovih
  ure\u0111aja ne zna\u010di da je sistem neispravan.\\n\\nKada je klju\u010d za paljenje
  okrenut u polo\u017eaj MAR-ON pali se na nekoliko sekundi lampica upozorenja \u26a0\ufe0f
  da vas podseti da \u0107e se vazdu\u0161ni jastuk aktivirati u slu\u010daju sudara,
  posle \u010dega, sa aktivnim vazdu\u0161nim jastukom, treba da se ugasi.\\n\\nPrag
  za aktiviranje vazdu\u0161nih jastuka je vi\u0161i od praga ure\u0111aja za predzatezanje.
  Za sudare u rasponu izme\u0111u ova dva praga, normalno je da se aktiviraju samo
  ure\u0111aji za predzatezanje.\\n\\nLampica upozorenja \u26a0\ufe0f trepti da ukazuje
  na neispravnost lampice upozorenja \u26a0\ufe0f. U ovom slu\u010daju, za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno, deaktivirana su eksplozivna punjenja
  vazdu\u0161nog jastuka suvoza\u010da. Obratite se odmah Fiatovom dileru da pregleda
  sistem.\\n\\nVazdu\u0161ni jastuk ne zamenjuje sigurnosne pojaseve ve\u0107 pove\u0107ava
  njihovu efikasnost. Po\u0161to se prednji vazdu\u0161ni jastuci ne razme\u0161taju
  u slu\u010daju sudara pri malim brzinama, bo\u010dnih sudara, sudara otpozadi ili
  u slu\u010daju prevrtanja, putnici su za\u0161ti\u0107eni, pored bo\u010dnih jastuka,
  samo svojim sigurnosnim pojasevima, koje stoga treba uvek vezati.\\n\\nSTARTOVANJE
  I VO\u017dNJA\\n\\nSTARTOVANJE MOTORA\\n\\nPROCEDURA ZA BENZINSKE VERZIJE\\n(isklju\u010duju\u0107i
  verzije 0.9 TwinAir 105 KS)\\n\\nPostupite kao \u0161to slije:\\n\\n- aktivirajte
  parkirnu ko\u010dnicu i ubacite polugu menja\u010da u neutralan polo\u017eaj;\\n-
  pritisnite pedalu kva\u010dila do kraja, ne diraju\u0107i gas;\\n- okrenite klju\u010d
  za paljenje u polo\u017eaj AVV i otpustite ga \u010dim motor startuje.\\n\\nUkoliko
  motor ne startuje iz prvog poku\u0161aja, vratite klju\u010d za paljenje u polo\u017eaj
  STOP, pa ponovite ovu proceduru.\\n\\nUkoliko se desi da na instrument tabli ostane
  upaljena lampica upozorenja zajedno sa lampicom upozorenja , kada je klju\u010d
  za paljenje u polo\u017eaju MAR-ON, okrenite klju\u010d na STOP, a zatim ponovo
  na MAR-ON. Ukoliko lampica upozorenja ostane upaljena i dalje, poku\u0161ajte sa
  ostalim klju\u010devima koje ste dobili uz vozilo.\\n\\nObratite se Fiatovom dileru
  ukoliko i dalje ne mo\u017eete da startujete motor.\\n\\nNikada ne ostavljajte klju\u010d
  za paljenje u polo\u017eaju MAR-ON, kada ugasite motor.\\n\\nStartovanje verzija
  motora 0.9 TwinAir od 105 KS\\n\\nPostupite kao \u0161to slije:\\n\\n- aktivirajte
  parkirnu ko\u010dnicu i ubacite polugu menja\u010da u neutralan polo\u017eaj ili
  pritisnite pedalu kva\u010dila do kraja, ukoliko je menja\u010d uba\u010den u neku
  brzinu izuzev neutralnog polo\u017eaja;\\n- okrenite klju\u010d za paljenje u polo\u017eaj
  AVV i otpustite ga \u010dim startuje motor.\\n\\nVa\u017eno: Ukoliko vozilo ne startuje
  pri prvom poku\u0161aju, vratite klju\u010d za paljenje u polo\u017eaj STOP i ponovite
  proceduru startovanja, tako \u0161to \u0107ete ubaciti polugu menja\u010da u neutralan
  polo\u017eaj i pritisnuti pedalu kva\u010dila do kraja.\\n\\nUkoliko se desa da
  na instrument tabli ostane upaljena lampica upozorenja zajedno sa lampicom upozorenja
  , kada je klju\u010d za paljenje u polo\u017eaju MAR-ON, okrenite klju\u010d na
  STOP, a zatim ponovo na MAR-ON. Ukoliko lampica upozorenja ostane upaljena i dalje,
  poku\u0161ajte sa ostalim klju\u010devima koje ste dobili uz vozilo.\\n\\nObratite
  se Fiatovom dileru ukoliko i dalje ne mo\u017eete da startujete motor.\\n\\nNikada
  ne ostavljajte klju\u010d za paljenje u polo\u017eaju MAR-ON, kada ugasite motor.\\n\\nPROCEDURA
  ZA DIZEL VERZIJE\\n\\nPostupite kao \u0161to slije:\\n\\n- aktivirajte parkirnu
  ko\u010dnicu i ubacite polugu menja\u010da u neutralan polo\u017eaj;\\n- okrenite
  klju\u010d za paljenje u polo\u017eaj MAR-ON: na instrument tabli se pale lampice
  upozorenja 00 i 01;\\n- sa\u010dekajte da se ugase lampice upozorenja 01 i 00;\\n-
  pritisnite pedalu kva\u010dila do kraja, ne diraju\u0107i pedalu gasa;\\n- okrenite
  klju\u010d za paljenje u polo\u017eaj AVV \u010dim se ugasi lampica upozorenja 00.
  Ukoliko \u010dekate previ\u0161e dugo, ne\u0107ete iskoristiti zagrevanje koje su
  postigli greja\u010di. Otpustite klju\u010d, \u010dim startuje motor.\\n\\nVA\u017dNO:
  Kada je motor hladan, pedalu gasa morate potpuno otpustiti, kada okre\u0107ete klju\u010d
  za paljenje u polo\u017eaj AVV.\\n\\nUkoliko motor ne startuje pri prvom poku\u0161aju,
  okrenite klju\u010d za paljenje u polo\u017eaj STOP, pre nego \u0161to ponovite
  proceduru.\\n\\nUkoliko se desi da ostane upaljena lampica upozorenja 01 kada je
  klju\u010d u polo\u017eaju MAR-ON, okrenite klju\u010d na STOP, a zatim ponovo na
  MAR-ON. Ukoliko lampica upozorenja ostane upaljena i dalje, poku\u0161ajte sa ostalim
  klju\u010devima koje ste dobili uz vozilo.\\n\\nObratite se Fiatovom dileru ukoliko
  i dalje ne mo\u017eete da startujete motor.\\n\\nTreptanje lampice upozorenja 00
  tokom 60 sekundi po startovanju ili tokom produ\u017eenog verglanja motora ukazuje
  na neispravnost sistema zagrevanja greja\u010da. Vozilo mo\u017eete koristiti kao
  i obi\u010dno ukoliko motor startuje, ali bi trebalo da se obratite Fiatovom dileru
  \u0161to je mogu\u0107e pre.\\n\\nUPAZORENJE\\n\\nOpasno je pustiti motor da radi
  u zatvorenim prostorima. Motor usisava kiseonik, a ispu\u0161ta ugljen dioksid,
  ugljen monoksid i druge otrovne gasove.\\n\\nUPAZORENJE\\n\\nImajte u vidu da servo
  ko\u010dnica i servo upravlja\u010d nisu operativni dok se motor ne startuje, stoga
  je potrebno vi\u0161e napora nego obi\u010dno za kori\u0161\u0107enje pedale ko\u010dnice
  i upravlja\u010da.\\n\\nPreporu\u010dujemo da tokom po\u010detnog perioda ne zahtevate
  pune performanse od vozila (npr. preterana ubrzavanja, duge vo\u017enje maksimalnom
  brzinom, nagla ko\u010denja itd.).\\n\\nNikada ne ostavljajte klju\u010d u polo\u017eaju
  MAR-ON kada je motor uga\u0161en, kako biste spre\u010dili nepotrebnu apsorpciju
  elektri\u010dne energije iz akumulatora i samim tim njegovo pra\u017enjenje.\\n\\nNikada
  nemojte startovati motor guranjem, vu\u0107om vozila ili spu\u0161tanjem niz nizbrdicu.
  Ovo bi moglo da uzrokuje da gorivo procuri u kataliti\u010dki konvertor i da ga
  trajno o\u0161teti.\\n\\nGA\u0160ENJE MOTORA\\n\\nOkrenite klju\u010d za paljenje
  u polo\u017eaj STOP dok je motor u praznom hodu.\\n\\nVA\u017dNO: Posle naporne
  vo\u017enje, pre ga\u0161enja motora trebalo bi da ga pustite da radi u praznom
  hodu kako bi temperatura u prostoru za motor mogla da se smanji.\\n\\nJako dodavanje
  gasa pre ga\u0161enja motora nema apsolutno nikakvu prakti\u010dnu svrhu, time se
  nepotrebno tro\u0161i gorivo i posebno je \u0161tetno za motore sa turbo punjenjem.\\n\\nZAGREVANJE
  MOTORA\\nODMAH PO STARTOVANJU\\n\\nPostupite kao \u0161to sledi:\\n\\n- krenite
  polako, tako \u0161to \u0107ete pustiti motor da se okre\u0107e srednjom brzinom.
  Nemojte dodavati gas naglo;\\n- nemojte zahtevati pune performanse od po\u010detka.
  Sa\u010dekajte da po\u010dne da se pomera mera\u010d temperature sredstva za hla\u0111enje
  motora.\\n\\nPARKIRANJE\\n\\nPostupite kao \u0161to slije:\\n\\n- ugasite motor
  i aktivirajte parkirnu ko\u010dnicu;\\n- ubacite menja\u010d u neku brzinu (prvu
  brzinu ukoliko se parkirate na uzbrdici ili u hod unazad ukoliko je to na nizbrdici)
  i okrenite to\u010dkove.\\n\\nUkoliko je vozilo parkirano na strmoj kosini, preporu\u010duje
  se tako\u0111e da se blokiraju to\u010dkovi sa klinom ili kamenom.\\n\\nNemojte
  ostavljati klju\u010d u prekida\u010du paljenja kako biste spre\u010dili pra\u017enjenje
  akumulatora.\\n\\n**UPPOZORENJE**\\n\\nNe ostavljajte nikada samu decu u vozilu.
  Izvadite uvek klju\u010d iz paljenja kada izlazite iz vozila i ponesite ga sa sobom.\\n\\n**PARKIRNA
  KO\u010cNICA**\\n\\nParkirna ko\u010dnica se nalazi izme\u0111u prednjih sedi\u0161ta.
  Povucite polugu A nagore i rukujte parkirnom ko\u010dnicom sl. 139, dok ne zako\u010dite
  vozilo.\\n\\n\u010cetiri do pet zvuka preskakanja zubaca su obi\u010dno dovoljna
  kada je vozilo na ravnom tlu, dok deset ili jedanaest mo\u017ee biti potrebno ukoliko
  je vozilo na strmoj kosini ili je optere\u0107eno.\\n\\n**UPPOZORENJE**\\n\\nUkoliko
  primetite da prethodno navedeno nije slu\u010daj, obratite se Fiatovom dileru da
  izvr\u0161i potrebna pode\u0161avanja.\\n\\nLampica upozorenja (1) na instrument
  tabli se pali kada je aktivirana parkirna ko\u010dnica, a klju\u010d za paljenje
  u polo\u017eaju MAR-ON.\\n\\nPostupite kao \u0161to slije\u0111e da otpustite ru\u010dnu
  ko\u010dnicu:\\n\\n- malo povucite polugu i pritisnite dugme za otpu\u0161tanje
  B;\\n- dr\u017eite pritisnuto dugme B i spustite polugu: lampica upozorenja (1)
  na instrument tabli se gasi.\\n\\nPritisnite pedalu ko\u010dnice tokom ovog postupka
  kako biste spre\u010dili iznenadno kretanje vozila.\\n\\nVA\u017dNO: Kod vozila
  koja imaju prednji naslon za ruke, podignite ovaj naslon kako biste obezbedili neometano
  aktiviranje parkirne ko\u010dnice.\\n\\n**UPOTREBA MENJA\u010cA**\\n\\nRadi promene
  stepena prenosa, pritisnite pedalu kva\u010dila do kraja i ubacite polugu menja\u010da
  u \u017eeljeni polo\u017eaj (dijagram je prikazan na dugmetu sl. 140).\\n\\nZa ubacivanje
  u hod unazad R iz neutralnog polo\u017eaja kod verzija 0.9 TwinAir Turbo 105 KS
  i 1.4 16V, podignite prsten A sl. 140 ispod dugmeta i pomerite polugu udesno, a
  zatim unazad.\\n\\nZa ubacivanje u hod unazad R iz neutranog polo\u017eaja kod verzija
  1.3 16V Multijet, pomerite polugu udesno, a zatim unazad.\\n\\nZa ubacivanje u \u0161estu
  brzinu (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno), gurnite jako
  udesno kada rukujete polugom, kako biste izbegli da gre\u0161kom ubacite menja\u010d
  u \u010detvrtu brzinu. Isto va\u017ei kod prebacivanja iz \u0161este u petu brzinu.\\n\\nVA\u017dNO:
  Menja\u010d mo\u017eete ubaciti u hod unazad samo kada vozilo potpuno miruje. Kada
  je upaljen motor, sa\u010dekajte najmanje 2 sekunde sa pedalom kva\u010dila pritisnutom
  do kraja, pre nego \u0161to menja\u010d ubacite u hod unazad, kako biste spre\u010dili
  o\u0161te\u0107enje i tro\u0161enje zup\u010danika.\\n\\nVA\u017dNO: Pedalu kva\u010dila
  treba koristiti samo za menjanje brzina. Nemojte voziti sa nogom na pedali kva\u010dila,
  \u010dak ni ako je ne pritiskate. Za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno,
  mogu\u0107e je da interveni\u0161e elektronska kontrola kva\u010dila, koja tuma\u010di
  ovaj nepravilan stil vo\u017enje kao neispravnost.\\n\\n**UPPOZORENJE**\\n\\nPritisnite
  pedalu kva\u010dila do kraja za pravilno menjanje brzina. Stoga je neophodno da
  nemate ni\u0161tta ispod pedala: nastojte da tepisi budu zategnuti i da ne ometaju
  rad pedala.\\n\\nPreporu\u010dujemo da tokom po\u010detnog perioda ne zahtevate
  pune performanse od vozila (npr. preterana ubrzavanja, duge vo\u017enje maksimalnom
  brzinom, nagla ko\u010denja itd.).\\n\\n**\u0160TEDNJA GORIVA**\\n\\nEvo nekih saveta
  koji \u0107e vam pomo\u0107i da u\u0161tedite gorivo i smanjite \u0161tetne emisije.\\n\\n**OP\u0160TI
  SAVETI**\\n\\n**Odr\u017eavanje vozila**\\nVr\u0161ite kontrole i pode\u0161avanja
  kako je to predvi\u0111eno \\\"Planiranim servisiranjem\\\".\\n\\n**Pneumatici**\\nKontroli\u0161ite
  pritisak pneumatika najmanje jednom svake 4 nedelje: ukoliko je pritisak suvi\u0161e
  nizak, pove\u0107a\u0107e se nivo potro\u0161nje, po\u0161to je ve\u0107i otpor
  pri okretanju.\\n\\n**Nepotrebna optere\u0107enja**\\nNemojte voziti sa pretovarenim
  prtlja\u017enikom. Te\u017eina vozila i razme\u0161taj tereta uti\u010du u velikoj
  meri na potro\u0161nju goriva i stabilnost.\\n\\n**Krovni nosa\u010d / nosa\u010d
  za skije**\\nSkinite krovni nosa\u010d ili nosa\u010d za skije sa krova ukoliko
  ih ne koristite. Ovi pribori pove\u0107avaju aerodinami\u010dki otpor i \u0161tetno
  deluju na potro\u0161nju goriva. Kada prevozite posebno velike predmete, koristite
  prikolicu, ukoliko je to mogu\u0107e.\\n\\nElektri\u010dni ure\u0111aji\\n\\nKoristite
  elektri\u010dne ure\u0111aje samo onoliko koliko su potrebni. Grejanom zadnjem staklu,
  dodatnim farovima, brisa\u010dima vetrobranskog / zadnjeg stakla i ventilatoru greja\u010da
  treba zna\u010dajna koli\u010dina energije, \u0161to pove\u0107ava potro\u0161nju
  goriva (do 25% u gradskoj vo\u017enji).\\n\\nKontrolni sistem klimatizacije\\n\\nKori\u0161\u0107enje
  kontrolnog sistema klimatizacije pove\u0107ava potro\u0161nju goriva. Ukoliko to
  spolja\u0161nja temperatura dozvoljava, poku\u0161ajte da koristite samo ventilaciju.\\n\\nUre\u0111aji
  za aerodinami\u010dnu kontrolu\\n\\nUpotreba necertifikovanih ure\u0111aja za aerodinami\u010dnu
  kontrolu mo\u017ee \u0161tetno da uti\u010de na otpor vazduha i potro\u0161nju goriva.\\n\\nSTIL
  VO\u017dNJE\\n\\nStartovanje\\n\\nNemojte zagrevati motor sa malim ili velikim brojem
  obrtaja dok vozilo miruje; ovo uzrokuje sporije zagrevanje motora, \u010dime se
  pove\u0107ava potro\u0161nja goriva i emisije.\\n\\nPreporu\u010duje se da odmah
  krenete i to polako, izbegavaju\u0107i veliki broj obrtaja motora: ovo omogu\u0107ava
  motoru da se br\u017ee zagreje.\\n\\nNepotrebne radnje\\n\\nIzbegavajte da kre\u0107ete
  sa dodavanjem gasa kada ste na semaforu ili pre ga\u0161enja motora. Ovo kao i duplo
  isklju\u010divanje kva\u010dila apsolutno nema nikakve svrhe kod savremenih vozila
  i tako\u0111e pove\u0107ava potro\u0161nju i zaga\u0111enje.\\n\\nIzbor brzina\\n\\nKoristite
  ve\u0107u brzinu \u010dim to dozvole uslovi u saobra\u0107aju i na putu. Kori\u0161\u0107enje
  ni\u017eeg stepena prenosa radi ubrzavanja pove\u0107ava potro\u0161nju.\\n\\nIsto
  tako nepravilno kori\u0161\u0107enje ve\u0107e brzine pove\u0107ava potro\u0161nju,
  emisije i tro\u0161enje motora.\\n\\nMaksimalna brzina\\n\\nPotro\u0161nja goriva
  se zna\u010dajno pove\u0107ava sa brzinom. Odr\u017eavajte brzinu \u0161to je mogu\u0107e
  vi\u0161e ujedna\u010denom, izbegavaju\u0107i nepotrebna ko\u010denja i ubrzavanja,
  koji se zna\u010dajno odra\u017eavaju i na potro\u0161nju goriva i na emisije.\\n\\nUbrzavanje\\n\\nIznena\u0111eno
  ubrzavanje ima vrlo negativno dejstvo na potro\u0161nju goriva i emisije: postepeno
  dodajte gas.\\n\\nUSLOVI KORI\u0160\u0106ENJA\\n\\nHladan start\\nKratka rastojanja
  i u\u010destalo hladno startovanje spre\u010davaju motor da dostigne optimalnu radnu
  temperaturu. Shodno tome dolazi do pove\u0107anja i potro\u0161nje (od +15 do +30%
  u gradskoj vo\u017enji) i emisija.\\n\\nUslovi u saobra\u0107aju i na putu\\nGust
  saobra\u0107aj uzrokuje prili\u010dno veliku potro\u0161nju goriva, na primer kada
  vozite u koloni sa \u010destim kori\u0161\u0107enjem ni\u017eih stepena prenosa
  ili u velikim gradovima sa mnogo semafora. Planinski predeli i neravni putevi tako\u0111e
  lo\u0161e uti\u010du na potro\u0161nju goriva.\\n\\nStajanja u saobra\u0107aju\\nTokom
  du\u017eih stajanja (npr. ukr\u0161tanja nivoa) treba ugasiti motor.\\n\\nVU\u010cA
  PRIKOLICA\\n\\nVA\u017dNO\\nVozilo mora imati montiranu kuku za vu\u010du koja je
  tipski odobrena i adekvatan elektri\u010dni sistem da bi moglo da vu\u010de kamp
  prikolice ili obi\u010dne prikolice. Ovo instaliranje mora da uradi stru\u010dnjak.
  Montirajte odgovaraju\u0107e i/ili dodatne retrovizore kako je predvi\u0111eno zakonom
  o javnim putevima. Imajte u vidu kada vu\u010dete prikolicu, da je te\u017ee penjanje
  uz strme kosine, da se pove\u0107ava rastojanje ko\u010denja i da du\u017ee traje
  preticanje zavisno od ukupne te\u017eine prikolice. Koristite ni\u017ei stepen prenosa
  kada vozite nizbrdo, umesto da stalno koristite ko\u010dnicu. Te\u017eina prikolice
  na kuki za vu\u010du vozila smanjuje kapacitet optere\u0107enja vozila za istu vrednost.
  Kako biste bili sigurni da niste prekora\u010dili maksimalno dozvoljenu te\u017einu
  za vu\u010du (data u registracionom dokumentu vozila) treba da uzmete u obzir kompletno
  optere\u0107enu prikolicu, uklju\u010duju\u0107i ure\u0111aje i prtljag. Po\u0161tujte
  ograni\u010denja brzine koja su specifi\u010dna za svaku zemlju za vozila sa prikolicama.
  U svakom slu\u010daju, maksimalna brzina ne sme biti ve\u0107a od 100 km/h. Elektri\u010dna
  ko\u010dnica ili neki drugi ure\u0111aj (npr. vitlo) treba da se direktno napajaju
  iz akumulatora putem kabla \u010diji popre\u010dni presek ne sme biti manji od 2,5
  mm\u00b2.\\n\\nUPAZORENJE\\nABS kojim je vozilo opremljeno ne\u0107e kontrolisati
  ko\u010dioni sistem prikolice. Posebna preostro\u017enost je neophodna na klizavim
  putevima.\\n\\nElektri\u010dni sistem vozila mo\u017ee se povezivati samo na kabl
  za napajanje za elektri\u010dnu ko\u010dnicu i na kabl za unutra\u0161nje svetlo
  prikolice, iako ne vi\u0161e od 15W. Za povezivanje koristite prethodno pode\u0161enu
  kontrolnu jedinicu sa kablom za akumulator \u010diji popre\u010dni presek nije manji
  od 2,5 mm\u00b2.\\n\\nVA\u017dNO: Kori\u0161\u0107enje dodatnog optere\u0107enja
  osim za spolja\u0161nja svetla (elektri\u010dna ko\u010dnica, vitlo itd.) treba
  da bude sa upaljenim motorom.\\n\\nVA\u017dNO: Obratite se Fiatovom dileru za montiranje
  kuke za vu\u010du.\\n\\n**UPOZORENJE**\\n\\n*Nikada ne menjajte ko\u010dioni sistem
  vozila u cilju kontrolisanja ko\u010dnice prikolice. Ko\u010dioni sistem prikolice
  mora biti potpuno nezavisan od hidrauli\u010dnog sistema vozila.*\\n\\n**UPOZORENJE**\\n\\n*Maksimalna
  brzina za zimske pneumatike obele\u017eene sa \\\"Q\\\" je 160 km/h, dok je 190
  km/h za pneumatike sa \\\"T\\\" i 210 km/h za pneumatike sa \\\"H\\\". Me\u0111utim
  morate uvek po\u0161tovati ograni\u010denja brzine koja nala\u017ee zakon o javnim
  putevima.*\\n\\n**ZIMSKI PNEUMATICI**\\n\\nKoristite zimske pneumatike iste veli\u010dine
  kao \u0161to su obi\u010dni pneumatici koje ste dobili sa vozilom. Fiatov diler
  \u0107e vam rado dati savet vezano za najpodesniji tip pneumatika za va\u0161e potrebe.\\n\\n\u0160to
  se ti\u010de tipa pneumatika koje treba koristiti, pritisaka naduvavanja i specifikacija
  zimskih pneumatika, po\u0161tujte uputstva data u delu \\\"To\u010dkovi\\\" pod
  \\\"Tehni\u010dke specifikacije\\\".\\n\\nPerformanse ovih pneumatika u zimskim
  uslovima su znatno smanjene ukoliko je dubina profila gaze\u0107e povr\u0161ine
  pneumatika manja od 4 mm. Zamenite ih u tom slu\u010daju.\\n\\nUsled specifi\u010dnih
  karakteristika zimskih pneumatika, njihove performanse su slabije od obi\u010dnih
  pneumatika u normalnim vremenskim uslovima ili u dugim vo\u017enjama po autoputevima.\\n\\nStoga
  njihovo kori\u0161\u0107enje treba ograni\u010diti zavisno od njihovog tipskog odobrenja;
  po\u0161tujte uvek specifi\u010dne lokalne propise vezano za kori\u0161\u0107enje
  zimskih pneumatika.\\n\\nSva \u010detiri pneumatika treba da budu ista (brend i
  gaze\u0107a povr\u0161ina) kako bi se obezbedila ve\u0107a bezbednost tokom vo\u017enje
  i ko\u010denja i bolje vozne karakteristike vozila. Nemojte zaboraviti da ne bi
  trebalo da menjate pravac rotacije pneumatika.\\n\\nMONTIRANJE KUKE ZA VU\u010cU\\n\\nUre\u0111aj
  za vu\u010du mora biti pri\u010dvr\u0161\u0107en za karoseriju automobila od strane
  specijalizovanog osoblja u skladu sa bilo kojim dodatnim i/ili pripadaju\u0107im
  informacijama dostavljenim od strane proizvo\u0111a\u010da.\\n\\nUre\u0111aj za
  vu\u010du mora da ispuni sada\u0161nje propise, u skladu sa Direktivom 94/20/EC
  i kasnijim izmenama i dopunama.\\n\\nUre\u0111aj za vu\u010du, bilo koje verzije,
  mora da odgovara vu\u010dnoj te\u017eini automobila na koji \u0107e biti pri\u010dvr\u0161\u0107en.\\n\\nPrilikom
  elektri\u010dnog povezivanja koristi se standardni priklju\u010dak koji je obi\u010dno
  postavljen na posebnom dr\u017ea\u010du i pri\u010dvr\u0161\u0107en na ure\u0111aju
  za vu\u010du, dok posebni ECU (uredaj za spoljno povezivanje) za kontrolu spoljnog
  svetla na prikolici mora biti montiran na kolima.\\n\\nUpotrebljavaju se priklju\u010dci
  od 7 ili 12-pinova, 12 V DC (u skladu sa CUNA/UNI i ISO/DIN standardima). Sledite
  sva uputstva dostavljena od strane proizvo\u0111a\u010da automobila i/ili proizvo\u0111a\u010da
  ure\u0111aja za vu\u010du.\\n\\nGrafikon ugradnje, sl. 141\\n\\nVu\u010dna kuka
  mora biti pri\u010dvr\u0161\u0107ena na ta\u010dkama prikazanim na slici u ukupnom
  iznosu od 8 fiksnih ta\u010daka na karoseriji.\\n\\n**UPOZORENJE**\\n\\nNakon ugradnje,
  otvori za \u0161rafove moraju biti zaptiveni da bi se spre\u010dio ulazak izduvnih
  gasova.\\n\\nLANCI ZA SNEG\\n\\nUpotreba lanaca za sneg treba da bude u skladu sa
  lokalnim propisima.\\n\\nLanci za sneg se mogu namestiti samo na pneumatike prednjih
  to\u010dkova (pogonskih to\u010dkova).\\n\\nProverite zategnutost lanaca za sneg
  po\u0161to pre\u0111ete nekoliko metara.\\n\\nLanci se ne mogu staviti na 17-in\u010dne
  pneumatike. Za ostale pneumatike (15-in\u010dne i 16-in\u010dne) stavljajte samo
  manje lance za sneg koji dodaju maksimum 9 mm na profil pneumatika.\\n\\n**VA\u017dNO:**
  Lanci za sneg se ne mogu stavljati na rezervni to\u010dak koji \u0161tedi prostor
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno). Ukoliko do\u0111e do
  defekta prednjeg pneumatika, zamenite zadnji to\u010dak sa rezervnim to\u010dkom
  koji \u0161teti prostor, a zadnji to\u010dak prebacite na prednju osovinu. Na ovaj
  na\u010din \u0107ete napred imati dva normalna pogonska to\u010dka na koja mo\u017eete
  da stavite lance za sneg.\\n\\n*Nemojte voziti brzo kada ste stavili lance za sneg;
  nemojte prekora\u010diti brzinu od 50 km/h. Izbegavajte rupe, stepenike i ivi\u010dnjake
  i izbegavajte duge vo\u017enje na putevima na kojima nema snega kako biste spre\u010dili
  o\u0161te\u0107enje vozila i kolovoza.*\\n\\nMIROVANJE VOZILA\\n\\nUkoliko vozilo
  ostavljate da miruje du\u017ee od mesec dana, treba preduzeti slede\u0107e mere
  predostro\u017enosti:\\n\\n- parkirajte vozilo u zatvoren, suv i ukoliko je mogu\u0107e,
  dobro provetren prostor sa malo otvorenim prozorima;\\n- ubacite menja\u010d u neki
  stepen prenosa i nemojte povu\u0107i ru\u010dnu ko\u010dnicu;\\n- isklju\u010dite
  negativnu klemu akumulatora (za verzije sa sistemom Start&Stop, pogledajte deo \\\"Sistem
  Start&Stop\\\" u poglavlju \\\"Upoznavanje sa va\u0161im vozilom\\\"); ukoliko akumulator
  ne isklju\u010dite iz elektri\u010dnog sistema, proverite njegovo punjenje svakih
  trideset dana;\\n- o\u010distite i za\u0161titite ofarbane delove sa za\u0161titnim
  voskom;\\n- o\u010distite i za\u0161titite sjajne metalne delove kor\u0438\u0448\u045benjem
  specijalnih jedinjenja koja se nude u prodaji;\\n- posipajte talk puder na gumu
  metlica brisa\u010da vetrobranskog i zadnjeg stakla i podignite ih sa stakla;\\n-
  pokrite vozilo tkaninom ili perforiranom plasti\u010dnom folijom. Nemojte koristiti
  neperforirane plasti\u010dne folije, po\u0161to one ne omogu\u0107avaju isparavanje
  vlage sa karoserije vozila;\\n- naduvajte pneumatike na +0.5 bara iznad standardnog
  utvr\u0111enog pritiska i proveravajte ga povremeno;\\n- nemojte isprazniti sistem
  za hla\u0111enje motora.\\n\\nslika 141\\n\\nLAMPICE UPZOZRENJA I PORUKE\\n\\nOP\u0160TA
  UPZOZRENJA\\nLampica upozorenja se pali, pra\u0107ena odgovaraju\u0107om porukom
  i/ili akusti\u010dnim signalom kada je to potrebno. Ove indikacije su koncizne i
  predostro\u017ene i, kao takve ne smeju se smatrati iscrpnim i/ili alternativnim
  u odnosu na informacije sadr\u017eane u ovom Priru\u010dniku za vlasnike, koji vam
  savetujemo da pro\u010ditate pa\u017eljivo u svakom slu\u010daju. U slu\u010daju
  indikacije za defekt, pogledajte uvek sadr\u017eaj ovog poglavlja.\\n\\nVA\u017dNO:
  Prikazane indikacije za defekte dele se u dve kategorije: vrlo ozbiljne i manje
  ozbiljne defekte. Na vrlo ozbiljne defekte ukazuje ponovljeni i produ\u017eeni ciklus
  upozoravanja. Na manje ozbiljne defekte ukazuje kra\u0107i ciklus upozoravanja.
  Ciklus ukazivanja na obe kategorije defekata mo\u017ee se prekinuti pritiskanjem
  dugmeta SET. Lampica upozorenja na komandnoj tabli ostaje upaljena dok se uzrok
  defekta ne otkloni.\\n\\nNIZAK NIVO KO\u010cIONE TE\u010cNOSTI (crveno) / AKTIVIRANA
  PARKIRNA KO\u010cNICA (crveno)\\nOkretanjem klju\u010da u polo\u017eaj MAR-ON pali
  se lampica upozorenja, ali bi trebalo da se ona ugasi posle nekoliko sekundi.\\n\\nNIZAK
  NIVO KO\u010cIONE TE\u010cNOSTI\\nLampica upozorenja se pali kada nivo ko\u010dione
  te\u010dnosti u rezervoaru padne ispod minimalnog nivoa, usled mogu\u0107eg curenja
  u kolu. Kod nekih verzija displej pokazuje odgovaraju\u0107u poruku.\\n\\nUPPOZORENJE\\nUkoliko
  se lampica upozorenja (!) upali tokom vo\u017enje, odmah stanite i obratite se Fiatovom
  dileru.\\n\\nAKTIVIRANA PARKIRNA KO\u010cNICA\\nKada je klju\u010d okrenut u polo\u017eaj
  MAR pali se lampica upozorenja, ali bi trebalo da se ona ugasi posle nekoliko sekundi.\\n\\nVA\u017dNO:
  Ukoliko se lampica upozorenja upali tokom vo\u017enje, proverite da nije aktivirana
  parkirna ko\u010dnica.\\n\\nDEFEKT EBD (Elektronska raspodela sile ko\u010denja)
  (crvena)( \u017euta)\\n\\nIstovremeno paljenje (crvene), (\u017eute) i ESC lampica
  upozorenja kada je motor upaljen, ukazuje ili na defekt sistema EBD ili na to da
  ovaj sistem nije na raspolaganju.\\n\\nU ovom slu\u010daju, mo\u017ee do\u0107i
  do iznenadnog blokiranja zadnjih to\u010dkova i vozilo mo\u017ee da naglo promeni
  pravac prilikom naglog ko\u010denja. Odgovaraju\u0107a poruka se prikazuje kod odre\u0111enih
  verzija.\\n\\nVozite vrlo pa\u017eljivo do najbli\u017eeg Fiatovog dileru kako bi
  odmah pregledao ovaj sistem.\\n\\nDEFEKT SISTEMA ABS (\u017euta)\\n\\nOkretanjem
  klju\u010da u polo\u017eaj MAR-ON pali se lampica upozorenja, ali bi trebalo da
  se ona ugasi posle nekoliko sekundi.\\n\\nLampica upozorenja se pali (kod nekih
  verzija zajedno sa porukom i simbolom na displeju) kada sistem nije efikasan. U
  ovom slu\u010daju ko\u010dioni sistem zadr\u017eava svoju nepromenjenu efikasnost,
  ali bez mogu\u0107nosti kori\u0161\u0107enja prednosti koju daje ABS sistem.\\n\\nVozite
  pa\u017eljivo i obratite se Fiatovom dileru \u0161to je mogu\u0107e pre.\\n\\nDEFEKT
  VAZDU\u0160NIH JASTUKA (crvena)\\n\\nOkretanjem klju\u010da u polo\u017eaj MAR-ON
  pali se lampica upozorenja, ali bi trebalo da se ona ugasi posle nekoliko sekundi.\\n\\nLampica
  upozorenja svetli neprekidno (kod nekih verzija, zajedno sa porukom i simbolom na
  displeju) kako bi ukazala na defekt sistema vazdu\u0161nih jastuka.\\n\\nUPPOZORENJE\\n\\nUkoliko
  se lampica upozorenja ne upali kada se klju\u010d okrene u polo\u017eaj MAR-ON ili
  ukoliko ostane upaljena tokom vo\u017enje, mogu\u0107e je da postoji problem sa
  bezbednosnim sistemom vazdu\u0161nih jastuka. U ovom slu\u010daju, mogu\u0107e je
  da se vazdu\u0161ni jastuci ili ure\u0111aji za predzatezanje ne aktiviraju u slu\u010daju
  udesa ili, u manjem broju slu\u010dajeva, mogu se aktivirati kada to nije potrebno.
  Pre nego \u0161to krenete dalje, obratite se odmah Fiatovom dileru da pregleda sistem.\\n\\n**UPAZORENJE**\\n\\nNa
  defekt lampice upozorenja \u26a0\ufe0f ukazuje treptanje lampice upozorenja \u26a0\ufe0f,
  koja ukazuje na deaktiviranje prednjeg vazdu\u0161nog jastuka suvoza\u010da. Pored
  toga sistem vazdu\u0161nih jastuka deaktivira automatski vazdu\u0161ne jastuke suvoza\u010da
  (i prednji i bo\u010dni vazdu\u0161ni jastuk \u2013 za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno). U ovom slu\u010daju, lampica upozorenja \u26a0\ufe0f
  mo\u017ee da ne uka\u017ee na problem sa sistemom vazdu\u0161nih jastuka. Pre nego
  \u0161to krenete dalje, obratite se odmah Fiatovom dileru da pregleda sistem.\\n\\n---\\n\\n**DEAKTIVIRANI
  SUVOZA\u010cEVI VAZDU\u0160NI JASTUCI (\u017euta)**\\n\\nLampica upozorenja \u26a0\ufe0f
  se pali kada su deaktivirani prednji i bo\u010dni vazdu\u0161ni jastuci suvoza\u010da.\\n\\nOkretanjem
  klju\u010da u polo\u017eaj MAR-ON, kada je aktivan prednji vazdu\u0161ni jastuk
  suvoza\u010da, pali se lampica upozorenja \u26a0\ufe0f i svetli neprekidno nekoliko
  sekundi, trepti jo\u0161 nekoliko sekundi, a onda bi trebalo da se gasi.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nNa
  defekt lampice upozorenja \u26a0\ufe0f ukazuje paljenje lampice upozorenja \u26a0\ufe0f.
  Pored toga sistem vazdu\u0161nih jastuka automatski deaktivira vazdu\u0161ne jastuke
  suvoza\u010da (i prednji i bo\u010dni vazdu\u0161ni jastuk \u2013 za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno). Pre nego \u0161to krenete dalje, obratite se odmah
  Fiatovom dileru da pregleda ovaj sistem.\\n\\n---\\n\\n**NEVEZANI SIGURNOSNI POJASEVI
  (crvena)**\\n\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nLampica
  upozorenja se pali i svetli neprekidno kada vozilo miruje, a sigurnosni pojas voza\u010da
  ili suvoza\u010da (kada je suvoza\u010d u vozilu) nije vezan.\\n\\nLampica upozorenja
  \u0107e treptati, a zujalica zujati ukoliko je vozilo u pokretu, a sigurnosni pojasevi
  prednjih sedi\u0161ta nisu pravilno vezani.\\n\\nObratite se Fiatovom dileru ukoliko
  \u017eelite da vam trajno deaktivira zujalicu sistema SBR (podsetnik za vezivanje
  sigurnosnih pojaseva). Ovaj sistem je mogu\u0107e ponovo aktivirati kori\u0161\u0107enjem
  menija pode\u0161avanja (videti opis u poglavlju \\\"Upoznavanje sa va\u0161im vozilom\\\").\\n\\nISPRA\u017dNJENOST
  AKUMULATORA (crvena)\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nKada
  se klju\u010d za paljenje okrene u polo\u017eaj MAR, pali se lampica upozorenja,
  ali bi trebalo da se ona ugasi \u010dim se startuje motor (sa motorom u praznom
  hodu, mo\u017ee se o\u010dekivati malo ka\u0161njenje).\\n\\nUkoliko lampica upozorenja
  (ili kod nekih verzija poruka i simbol na displeju) ostanu neprekidno upaljeni ili
  trepte, obratite se Fiatovom dileru.\\n\\nNEPREKIDNO UPALJENA: NIZAK PRITISAK MOTORNOG
  ULJA (crvena)\\n\\nTREPTI: ISTRO\u0160ENO MOTORNO ULJE (samo dizel verzije sa DPF
  \u2013 crvena)\\n\\nKada se klju\u010d za paljenje okrene na MAR, pali se lampica
  upozorenja, ali bi trebalo da se ugasi \u010dim se startuje motor.\\n\\n1. Nedovoljan
  pritisak motornog ulja\\n\\nLampica se pali i svetli neprekidno zajedno (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno) sa porukom na displeju, kada sistem
  registruje da je pritisak motornog ulja suvi\u0161e nizak.\\n\\n2. Istro\u0161eno
  motorno ulje (samo za dizel verzije sa DPF)\\n\\nLampica upozorenja trepti i odgovaraju\u0107a
  poruka se pojavljuje na displeju (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nLampica
  upozorenja mo\u017ee da trepti na slede\u0107e na\u010dine, zavisno od verzije:\\n\\n-
  1 minutu svaka dva sata;\\n- u ciklusima od po 3 minute sa intervalima sa uga\u0161enom
  lampicom upozorenja tokom 5 sekundi, dok se ulje ne zameni.\\n\\nPosle prve indikacije,
  prilikom svakog startovanja motora, lampica upozorenja \u0107e nastaviti da trepti
  kako je prethodno opisano dok se ulje ne zameni. Kod nekih verzija, displej pokazuje
  odgovaraju\u0107u poruku zajedno sa lampicom upozorenja.\\n\\nTreptanje lampice
  upozorenja ne treba smatrati defektom, ona jednostavno obave\u0161tava voza\u010da
  da je u kori\u0161\u0107enju vozila normalno da se ulje zamenuje.\\n\\nImajte u
  vidu da se tro\u0161enje motornog ulja ubrzava:\\n\\nUkoliko se vozilo koristi uglavnom
  za gradsku vo\u017enju, zbog \u010dega je potrebno da se \u010de\u0161\u0107e obavlja
  proces regeneracije DPF (filtera dizel \u010destica);\\n\\nukoliko se vozilo koristi
  za kratke vo\u017enje, u toku kojih motor nema vremena da dostigne svoju normalnu
  radnu temperaturu;\\n\\nponovljenim prekidima procesa regeneracije, na \u0161ta
  ukazuje paljenje lampice upozorenja DPF.\\n\\nUPOZORENJE\\n\\nUkoliko se upali lampica
  upozorenja, istro\u0161eno motorno ulje treba zameniti \u0161to je mogu\u0107e pre,
  a nikada kasnije od 500 km od kada se prvi put upalila lampica upozorenja. Propust
  u po\u0161tovanju prethodno mo\u017ee da dovede do ozbiljnog o\u0161te\u0107enja
  motora i da poni\u0161ti va\u017enost garancije. Aktiviranje ove lampice nije povezano
  sa koli\u010dinom ulja u motoru. Stoga, nemojte nikada dolivati ulje, kada ova lampica
  po\u010dne da trepti.\\n\\nVRU\u0106E SREDSTVO ZA HLA\u0110ENJE MOTORA (crvena)\\n\\nOkretanjem
  klju\u010da u polo\u017eaj MAR-ON pali se lampica upozorenja, ali bi trebalo da
  se ona ugasi posle nekoliko sekundi.\\n\\nLampica upozorenja se pali (kod nekih
  verzija zajedno sa porukom i simbolom na displeju) kada je motor pregrejan.\\n\\nUkoliko
  se lampica upozorenja upali tokom vo\u017enje, postupite kao \u0161to sliedi:\\n\\ntokom
  normalne vo\u017enje: zaustavite vozilo, ugasite motor i proverite da li je nivo
  vode u rezervoaru ispod oznake MIN. Ukoliko jeste, sa\u010dekajte nekoliko minuta
  da se motor ohladi, zatim polako i pa\u017eljivo otvorite poklopac, doli\u0111te
  sredstvo za hla\u0111enje i proverite da li je nivo izme\u0111u oznaka MIN i MAX.
  Proverite tako\u0111e vizuelno da li te\u010dnost negde curi. Ukoliko se lampica
  upozorenja ponovo upali kada ponovo startujete, obratite se Fiatovom dileru.\\n\\nukoliko
  se vozilo koristi pod zahtevnim uslovima: (npr. vu\u010da prikolice uzbrdo ili pod
  punim optere\u0107enjem): usporite i, ukoliko svetlo ostane upaljeno, zaustavite
  vozilo. Sa\u010dekajte 2 ili 3 minute sa upaljenim motorom i sa malim gasom kako
  biste poja\u010dali cirkulaciju sredstva za hla\u0111enje. Zatim ugasite motor.
  Proverite nivo sredstva za hla\u0111enje kako je prethodno opisano. Ukoliko je nivo
  te\u010dnosti suvi\u0161e nizak, doli\u0111te ga (\u0161to se ti\u010de koli\u010dine
  i vrste te\u010dnosti koju treba koristiti, pogledajte opis u delu \\\"Dolivanje
  goriva\\\" u poglavlju \\\"Tehni\u010dke specifikacije\\\").\\n\\nVA\u017dNO: Posle
  zahtevnih vo\u017enji, preporu\u010duje se da ostavite motor upaljen i sa blagim
  gasom nekoliko minuta pre nego \u0161to ga ugasite.\\n\\nGORIVO NA REZERVI\\nOGRANI\u010cEN
  DOMET\\n(\u017euta)\\n\\nOva lampica upozorenja se pali kada je u rezervoaru ostalo
  oko 6 do 8 litara goriva. Kod nekih verzija \u0107e displej pokazati poruku upozorenja
  kada je preostali domet manji od oko 50 km (ili ekvivalentna vrednost u miljama).\\n\\nVA\u017dNO:
  Lampica upozorenja \u0107e treptati da ukaze na defekt u sistemu. Ukoliko je to
  slu\u010daj, obratite se Fiatovom dileru da pregleda sistem.\\n\\nDEFEKT EOBD\\n(evropska
  dijagnostika na vozilu)\\n/SISTEMA UBRZIGAVANJA\\n(\u017euta)\\n\\nLampica upozorenja
  se u normalnim uslovima pali kada se klju\u010d okrene u polo\u017eaj MAR (kod nekih
  verzija sa porukom na displeju), ali bi trebalo da se ugasi \u010dim se startuje
  motor.\\n\\nUkoliko lampica upozorenja ostane upaljena ili se upali tokom vo\u017enje,
  to zna\u010di da sistem ubrizgavanja ne radi pravilno; posebno, ako se lampica upozorenja
  upali i svetli neprekidno, to zna\u010di da je defektan sistem za napanje/paljenje
  \u0161to mo\u017ee da uzrokuje prekomerne izduvne emisije, mogu\u0107 gubitak performansi,
  slabe vozne karakteristike vozila i veliku potro\u0161nju goriva.\\n\\nPod ovim
  uslovima mo\u017eete nastaviti da vozite umerenom brzinom bez ve\u0107ih zahteva
  od motora. Du\u017ee kori\u0161\u0107enje vozila sa ovom lampicom neprekidno upaljenom
  mo\u017ee da uzrokuje o\u0161te\u0107enje: obratite se Fiatovom dileru \u0161to
  je mogu\u0107e pre.\\n\\nLampica upozorenja se gasi kada se ovaj defekt otkloni,
  ali \u0107e on biti memorisan u sistemu.\\n\\nNOTE (va\u017ei samo za benzinske
  motore)\\n\\nUkoliko lampica upozorenja trepti, mogu\u0107e je da je o\u0161te\u0107en
  kataliti\u010dki konvertor.\\n\\nU ovom slu\u010daju, neophodno je da otpustite
  pedalu gasa na manju brzinu motora dok lampica upozorenja ne prestane da trepti.\\n\\nNastavite
  vo\u017enju umerenom brzinom, tako \u0161to \u0107ete izbegavati situacije u vo\u017enji
  koje mogu da uzrokuju dalje treptanje i obratite se Fiatovom dileru \u0161to je
  mogu\u0107e pre.\\n\\nObratite se Fiatovom dileru \u0161to je mogu\u0107e pre ukoliko
  se lampica upozorenja ne upali kada se klju\u010d okrene u polo\u017eaj MAR-ON ili
  ukoliko se lampica upozorenja upali ili trepti tokom vo\u017enje (pra\u0107ena porukom
  i simbolom na displeju kod nekih verzija). Organi saobra\u0107ajne kontrole mogu
  provjeriti nivoe izduvnih emisija kori\u0161\u0107enjem odgovaraju\u0107e opreme.
  Po\u0161tujte zakone i propise zemlje u kojoj vozite.\\n\\nDEFEKT SISTEMA ESC (elektronska
  kontrola stabilnosti) (\u017euta)\\n\\nOkretanjem klju\u010da u polo\u017eaj MAR-ON
  pali se lampica upozorenja, koja bi trebalo da se ugasi posle nekoliko sekundi.\\n\\nUkoliko
  se lampica upozorenja ne ugasi ili ostane upaljena (zajedno sa porukom i simbolom
  na displeju kod nekih verzija) tokom vo\u017enje, obratite se Fiatovom dileru.\\n\\nTreptanje
  lampice upozorenja tokom vo\u017enje ukazuje na dejstvo ESC sistema.\\n\\nDefekt
  sistema za pomo\u0107 pri polasku na uzbrdici\\n\\nOva lampica upozorenja se pali,
  kod nekih verzija zajedno sa simbolom \ud83d\udea7 i porukom na displeju, u slu\u010daju
  defekta sistema za pomo\u0107 pri polasku na uzbrdici. Obratite se Fiatovom dileru
  u ovom slu\u010daju.\\n\\nDEFEKT FIATOVOG SISTEMA KODIRANJA (\u017euta)\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nLampica upozorenja se pali
  (kod nekih verzija zajedno sa porukom i simbolom na displeju) kako bi ukazala na
  defekt Fiatovog sistema kodiranja: obratite se Fiatovom dileru u ovom slu\u010daju
  \u0161to je mogu\u0107e pre.\\n\\nZAGREVANJE GREJA\u010cA / DEFEKT ZAGREVANJA GREJA\u010cA
  (dizel verzije) (\u017euta)\\n\\nZAGREVANJE GREJA\u010cA\\n\\nOva lampica upozorenja
  se pali kada se klju\u010d okrene u polo\u017eaj MAR-ON. Ugasi\u0107e se \u010dim
  greja\u010di dostignu prethodno pode\u0161enu temperaturu.\\n\\nMotor se mo\u017ee
  startovati \u010dim se ugasi lampica upozorenja.\\n\\nVA\u017dNO: Pri visokim temperaturama
  ambijenta, mogu\u0107e je da lampica upozorenja ostane upaljena izuzetno kratko
  vreme.\\n\\nDEFEKT ZAGREVANJA GREJA\u010cA\\n\\nLampica upozorenja \u0107e treptati
  (kod nekih verzija zajedno sa porukom i simbolom na displeju) kako bi ukazala na
  defekt u sistemu predzagrevanja greja\u010da.\\n\\nObratite se Fiatovom dileru \u0161to
  je mogu\u0107e pre da popravi ovaj defekt.\\n\\nDEFEKT ELEKTRI\u010cNOG SERVO UPRAVLJA\u010cA
  (DUAL DRIVE) (crvena)\\n\\nTokom startovanja motora\\nKada je klju\u010d okrenut
  u polo\u017eaj MAR-ON, pali se lampica upozorenja, koja bi trebalo da se ugasi posle
  nekoliko sekundi. Ukoliko lampica upozorenja ostane upaljena, okrenite klju\u010d
  za paljenje u polo\u017eaj STOP i zatim startujte ponovo motor. Ukoliko lampica
  upozorenja ostane upaljena (kod nekih verzija zajedno sa porukom i simbolom na displeju),
  mogu\u0107e je da \u0107e biti potreban ve\u0107i napor za rukovanje upravlja\u010dem;
  me\u0111utim, upravljanje je ipak mogu\u0107e. Obratite se Fiatovom dileru \u0161to
  je mogu\u0107e pre u ovom slu\u010daju.\\n\\nTokom vo\u017enje\\nUkoliko se lampica
  upozorenja upali tokom vo\u017enje (kod nekih verzija, zajedno sa porukom i simbolom
  na displeju) mogu\u0107e je da ne\u0107ete imati asistenciju u upravljanju. Iako
  \u0107e upravljanje vozilom biti mogu\u0107e i dalje, mogu\u0107e je da \u0107e
  biti potreban ve\u0107i napor za rukovanje upravlja\u010dem: obratite se Fiatovom
  dileru \u0161to je mogu\u0107e pre.\\n\\nVA\u017dNO: U nekim okolnostima, paljenje
  lampice upozorenja na instrument tabli mogu da uzrokuju neki faktori koji nemaju
  veze sa elektri\u010dnim servo upravlja\u010dem. U ovom slu\u010daju, odmah zaustavite
  vozilo (ukoliko je u pokretu), ugasite motor na oko 20 sekundi, a zatim ga ponovo
  startujte. Ukoliko lampica upozorenja (ili kod nekih verzija poruka i simbol na
  displeju) ostane neprekidno upaljena, obratite se Fiatovom dileru.\\n\\nVA\u017dNO:
  Posle isklju\u010denja akumulatora, potrebno je ponovo uvesti sistem upravljanja
  u rad. Lampica upozorenja se pali da ukaze na ovo. Da biste izvr\u0161ili ovu proceduru,
  jednostavno okre\u0107ite upravlja\u010d od jednog kraja do drugog ili vozite u
  pravoj liniji oko sto metara.\\n\\nELEKTRONSKA KONTROLA BRZINE (zelena)\\n(za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOva lampica upozorenja se pali
  kada se klju\u010d za paljenje okrene u polo\u017eaj MAR, ali bi trebalo da se ugasi
  posle nekoliko sekundi, ukoliko je deaktivirana elektronska kontrola brzine. Lampica
  upozorenja se pali kada je prstenasta navrtka elektronske kontrole brzine okrenuta
  u polo\u017eaj (videti deo \\\"Elektronska kontrola brzine\\\" u poglavlju \\\"Upoznavanje
  sa va\u0161im vozilom\\\").\\n\\nOdre\u0111ena poruka se pojavljuje kod odre\u0111enih
  verzija.\\n\\nOGRANI\u010cIVA\u010c BRZINE (zelena)\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nOva lampica upozorenja se pali kada je klju\u010d
  okrenut u polo\u017eaj MAR-ON, ali bi trebalo da se ugasi posle nekoliko sekundi,
  ukoliko je deaktiviran ograni\u010diva\u010d brzine.\\n\\nAktiviranje\\nLampica
  upozorenja se pali kada je prstenasta navrtka elektronske kontrole brzine okrenuta
  u polo\u017eaj (videti deo \\\"Elektronska kontrola brzine\\\" u poglavlju \\\"Upoznavanje
  sa va\u0161im vozilom\\\").\\nKod nekih verzija na intervenciju ovog sistema ukazuje
  poruka i simbol prikazani na displeju i poslednja memorisana brzina vozila.\\n\\nDeaktiviranje\\nNa
  deaktiviranje sistema ukazuje ga\u0161enje lampice upozorenja na displeju i, kod
  nekih verzija, prikazivanje poruke i simbola .\\n\\n\u010cI\u0160\u0106ENJE DPF
  (filtera dizel \u010destica) (samo dizel verzije sa DPF) (\u017euta)\\n\\nOkretanjem
  klju\u010da na polo\u017eaj MAR-ON pali se lampica upozorenja, koja bi trebalo da
  se ugasi posle nekoliko sekundi.\\nLampica upozorenja (kod nekih verzija zajedno
  sa porukom i simbolom na displeju) neprekidno svetli kako bi obavestila voza\u010da
  da sistem DPF treba da elimini\u0161e uhva\u0107ene zagadiva\u010de (\u010destice)
  putem procesa regeneracije.\\nLampica upozorenja se ne pali prilikom svake regeneracije
  DPF, ve\u0107 samo kada uslovi u vo\u017enji zahtevaju da voza\u010d bude obave\u0161ten.\\nDa
  bi se ugasila lampica upozorenja, treba voziti dok se ne zavr\u0161i proces regeneracije.\\nOvaj
  proces traje u proseku petnaest minuta. Najbolji uslovi za zavr\u0161avanje procesa
  regeneracije ostvaruju se vo\u017enjom pri brzini od oko 60 km/h sa brzinom motora
  od preko 2000 obrtaja u minuti.\\nKada se ova lampica upozorenja upali, ona ne ukazuje
  na defekt vozila i stoga ne treba i\u0107i kod mehani\u010dara. Kod nekih verzija,
  zajedno sa paljenjem lampice upozorenja, displej pokazuje odgovaraju\u0107u poruku.\\n\\n**UPPOZORENJE**\\n\\nBrzinu
  kretanja vozila treba uvek prilagoditi uslovima u saobra\u0107aju i vremenu i ona
  mora uvek da odgovara saobra\u0107ajnim propisima. Motor mo\u017eete ugasiti \u010dak
  i ako je upaljena lampica upozorenja za DPF: me\u0111utim, ponovljeni prekidi procesa
  regeneracije mogli bi da uzrokuju preuranjeno tro\u0161enje motornog ulja. Iz ovog
  razloga se savetuje da treba sa\u010dekati da se ugasi lampica upozorenja pre ga\u0161enja
  motora, u skladu sa prethodno datim uputstvima. Nemojte zavr\u0161avati proces regeneracije
  DPF filtera kada zaustavite vozilo.\\n\\n**INDIKACIJA OP\u0160TIH UPPOZORENJA**\\n(\u017euta)\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nLampica upozorenja
  se pali u slede\u0107im okolnostima i tada treba da se obratite Fiatovom dileru
  \u0161to je mogu\u0107e pre, kako bi uradio popravku.\\n\\n**Prekora\u010deno ograni\u010denje
  brzine**\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nLampica
  upozorenja se pali kada se prekora\u010di ograni\u010denje brzine pode\u0161eno
  u meniju pode\u0161avanja.\\n\\nKada vozilo prekora\u010di ovu vrednost, kod nekih
  verzija se na displeju pokazuje poruka i simbol i emituje se zvu\u010dni signal.\\n\\n**Intervencija
  / defekt sistema za prekid napajanja gorivom**\\n(za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nLampica upozorenja se pali (zajedno sa porukom
  na displeju) u slu\u010daju intervencije / defekta sistema za prekid napajanja gorivom.\\n\\n**Neispravnost
  spolja\u0161njeg svetla**\\n\\nLampica upozorenja se pali kada se registruje neispravnost
  jednog od slede\u0107ih svetala:\\n\\n- dnevna svetla (DRL) (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno);\\n- bo\u010dna svetla;\\n- pokaziva\u010di pravca;\\n-
  zadnje svetlo za maglu;\\n- svetla za hod unazad;\\n- svetla registrarskih tablica;\\n-
  ko\u010diona svetla (samo za verzije sa multifunkcionalnim displejem)\\n\\nNeispravnost
  vezana za ova svetla mo\u017ee da bude: jedna ili vi\u0161e pregorelih sijalica,
  pregoreli za\u0161titni osigura\u010di ili prekid u elektri\u010dnoj vezi.\\n\\nNeispravnost
  sistema DST (dinami\u010dka kontrola raspolo\u017eivog obrtnog momenta / sistem
  protiv zano\u0161enja vozila)\\nLampica upozorenja se pali (zajedno sa porukom na
  displeju) kada se registruje neispravnost sistema DST.\\n\\nVoda u filteru dizel
  goriva\\nLampica upozorenja se pali (zajedno sa porukom na displeju) kako bi ukazala
  na prisustvo vode u filteru dizel goriva.\\n\\nNeispravnost sistema Start&Stop (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nLampica upozorenja se
  pali (zajedno sa porukom na displeju) kada se registruje neispravnost sistema Start&Stop.\\n\\nNeispravnost
  senzora nivoa te\u010dnog naftnog gasa / metana (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nLampica upozorenja se pali (zajedno sa porukom na
  displeju) kada se registruje neispravnost senzora nivoa TNG/metana.\\n\\nPrivremena
  ili trajna neispravnost sistema komande gradske ko\u010dnice \u2013 ubla\u017eavanja
  sudara (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nLampica upozorenja
  se pali (zajedno sa porukom na displeju) kada se registruje privremena ili trajna
  neispravnost sistema komande gradske ko\u010dnice\u2014ubla\u017eavanja sudara.\\n\\nNeispravnost
  senzora za ki\u0161u (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nLampica
  upozorenja se pali (zajedno sa porukom na displeju) kada se registruje neispravnost
  senzora za ki\u0161u.\\n\\nNeispravnost sistema za pomo\u0107 pri parkiranju (za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nLampica upozorenja se
  pali (zajedno sa porukom na displeju) kada se registruje neispravnost sistema za
  pomo\u0107 pri parkiranju.\\n\\nNeispravnost senzora za sumrak (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nLampica upozorenja se pali (zajedno sa porukom na
  displeju) kada se registruje neispravnost senzora za sumrak.\\n\\nNeispravnost senzora
  za pritisak motornog ulja\\nVerzije sa multifunkcionalnim displejem: na neispravnost
  senzora za pritisak motornog ulja ukazuje paljenje lampice upozorenja na instrument
  tabli.\\nVerzije sa rekonfigurabilnim multifunkcionalnim displejem: paljenje ikone
  na displeju ukazuje na neispravnost senzora za pritisak motornog ulja.\\n\\nGREJANO
  ZADNJE STAKLO (\u017euta)\\nLampica upozorenja se pali kada se uklju\u010di grejano
  zadnje staklo.\\n\\nLampica upozorenja se pali kada se uklju\u010di grejano zadnje
  staklo.\\n\\nGREJANO VETROBRANSKO STAKLO (\u017euta) (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\nLampica upozorenja se pali aktiviranjem grejanog vetrobranskog
  stakla (videti deo \\\"Automatski dvozonski kontrolni sistem klimatizacije\\\" u
  poglavlju \\\"Upoznavanje sa va\u0161im vozilom\\\").\\n\\nBO\u010cNA SVETLA I OBORENA
  SVETLA (zelena) / SISTEM \\\"PRATI ME DO KU\u0106E\\\" (zelena)\\n\\nBO\u010cNA
  SVETLA I OBORENA SVETLA\\nLampica upozorenja se pali kada se upale bo\u010dna /
  zadnja ili oborena svetla\\n\\nSISTEM \\\"PRATI ME DO KU\u0106E\\\"\\nLampica upozorenja
  se pali (kod nekih verzija, zajedno sa porukom i simbolom na displeju) kada se koristi
  ovaj ure\u0111aj (videti deo \\\"Prati me do ku\u0107e\\\" u poglavlju \\\"Upoznavanje
  sa va\u0161im vozilom\\\").\\n\\nDUGA\u010cKA SVETLA (plava)\\nLampica upozorenja
  se pali kada su upaljena duga\u010dka svetla.\\n\\nLEVI POKAZIVA\u010c PRAVCA (zelena)
  (isprekidana)\\nLampica upozorenja se pali kada se komandna ru\u010dica pokaziva\u010da
  pravca pomeri nadole ili zajedno sa desnim pokaziva\u010dem pravca, kada se pritisne
  dugme svetla za upozorenje na opasnost.\\n\\nDESNI POKAZIVA\u010c PRAVCA (zelena)
  (isprekidana)\\nLampica upozorenja se pali kada se komandna ru\u010dica pokaziva\u010da
  pravca pomeri nagore ili zajedno sa levim pokaziva\u010dem pravca, kada se pritisne
  dugme svetla za upozorenje na opasnost.\\n\\nUKLJU\u010cEN ELEKTRI\u010cNI SERVO
  UPRAVLJA\u010c (DUAL DRIVE) (zelena)\\n\\nIndikacija CITY se javlja (ikona se pojavljuje
  na displeju kod nekih verzija) kada se aktivira elektri\u010dni servo upravlja\u010d
  (dual drive) pritiskanjem odgovaraju\u0107eg dugmeta (videti deo \\\"Elektri\u010dni
  servo upravlja\u010d /dupli pogon/\\\" u poglavlju \\\"Upoznavanje sa va\u0161i
  vozilom\\\"). Indikacija CITY (ili simbol na displeju) nestaje kada se ponovo pritisne
  dugme.\\n\\nOTVORENA VRATA/ POKLOPAC MOTORA/ PRTLJA\u017dNIK (crvena)\\n\\nLampica
  upozorenja se pali (kod nekih verzija zajedno sa porukom i simbolom na displeju)
  kada jedna ili vi\u0161e vrata, poklopac motora ili prtlja\u017enik nisu pravilno
  zatvoreni. Zvu\u010dni signal se emituje kada su vrata otvorena, a vozilo je u pokretu.\\n\\nDEFEKT
  SISTEMA Komande gradske ko\u010dnice \u2013 Ubla\u017eavanja sudara (\u017euta)
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nLampica upozorenja
  se pali kada je registrovan defekt sistema komande gradske ko\u010dnice \u2013 ubla\u017eavanja
  sudara. U ovom slu\u010daju treba da se obratite Fiatovom dileru \u0161to je mogu\u0107e
  pre.\\n\\nAKTIVIRANJE / DEAKTIVIRANJE SISTEMA START&STOP\\n\\nAktiviranje sistema
  Start&Stop\\nPoruka se pojavljuje na displeju kada se aktivira sistem Start&Stop.\\nU
  ovom stanju uga\u0161ena je LED lampica na dugmetu \\\\(\\\\text{R}\\\\) na komandnoj
  tabli (videti deo \\\"Start&Stop\\\" u poglavlju \\\"Upoznavanje sa va\u0161im vozilom\\\").\\n\\nIsklju\u010divanje
  sistema Start&Stop\\n\\n- Verzije sa multifunkcionalnim displejem: poruka se pojavljuje
  na displeju kada se deaktivira sistem Start&Stop.\\n\\n- Verzije sa rekonfigurabilnim
  multifunkcionalnim displejem: simbol \\\\(\\\\text{R}\\\\) i odgovaraju\u0107a poruka
  pojavljuju se na displeju kada se deaktivira sistem Start&Stop.\\nUpaljena je LED
  lampica iznad dugmeta \\\\(\\\\text{R}\\\\) kada je ovaj sistem deaktiviran.\\n\\nNEISPRAVNOST
  SISTEMA START&STOP\\n\\nVerzije sa multifunkcionalnim displejem\\nNa neispravnost
  sistema Start&Stop ukazuje paljenje lampice upozorenja \\\\(\\\\Delta\\\\) (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno) na instrument tabli i poruka na
  displeju.\\n\\nVerzije sa rekonfigurabilnim multifunkcionalnim displejem\\nSimbol
  \\\\(\\\\text{R}\\\\) i odgovaraju\u0107a poruka pojavljuju se na displeju kada
  se registruje neispravnost u sistemu Start&Stop. U slu\u010daju neispravnosti sistema
  Start&Stop, obratite se Fiatovom dileru.\\n\\nU VANREDNIM SLU\u010cAJEVIMA\\n\\nPreporu\u010dujemo
  vam da u vanrednim situacijama besplatno pozovete broj koji je dat u Garantnoj knji\u017eici.
  Tako\u0111e mo\u017eete da odete na internet stranu www.fiatsrbija.rs da na\u0111ete
  vama najbli\u017ee Fiatovog dileru.\\n\\nSTARTOVANJE MOTORA\\n\\nOdmah se obratite
  se Fiatovom dileru ukoliko se na instrument tabli upali i neprekidno svetli lampica
  upozorenja \u26a0\ufe0f.\\n\\nSTARTOVANJE MOTORA SA PREMO\u0160\u0106ENIM KABLOVIMA\\n\\nUkoliko
  je akumulator ispra\u017enjen, motor se mo\u017ee startovati kori\u0161\u0107enjem
  pomo\u0107nog akumulatora istog kapaciteta ili malo ve\u0107eg od onog koji je ispra\u017enjen.\\n\\nPostupite
  kao \u0161to slije\u0111e da startujete vozilo:\\n\\n- pove\u017eite pozitivne kleme
  (+ blizu kleme) dva akumulatora sa kablom za njihovo spajanje sl. 141;\\n- sa drugim
  kablom, pove\u017eite negativnu klemu \u2013 pomo\u0107nog akumulatora sa ta\u010dkom
  uzemljenja \u2193 na motoru ili menja\u010du vozila koje treba startovati;\\n- startujte
  motor;\\n- kada je motor startovan, skinite kablove obrnutim redosledom od prethodno
  opisanog.\\n\\nKod verzija sa sistemom Start&Stop uradite postupak startovanja motora
  sa premo\u0161\u0107enim kablovima, tako \u0161to \u0107ete slediti uputstva data
  u delu \\\"Sistem Start&Stop\\\" u poglavlju \\\"Upoznavanje sa va\u0161im vozilom\\\".\\n\\nUkoliko
  posle nekoliko poku\u0161aja motor i dalje ne\u0107e da startuje, nemojte uporno
  nastavljati, ve\u0107 se obratite Fiatovom dileru.\\n\\nVA\u017dNO: Nemojte da direktno
  pove\u017eete negativne kleme dva akumulatora: varnice bi mogle da zapale eksplozivni
  gas koji ispu\u0161ta akumulator. Ukoliko je pomo\u0107ni akumulator ugra\u0111en
  u neko drugo vozilo, nastojte da ne do\u0111e do slu\u010dajnog kontakta izme\u0111u
  metalnih delova ova dva vozila.\\n\\nNemojte nikada koristiti brzi punja\u010d akumulatora
  za startovanje motora, po\u0161to bi on mogao da o\u0161teti elektronske sisteme
  va\u0161eg vozila, posebno kontrolne jedinice za paljenje i napajanje goriva.\\n\\n**UPPOZRENJE**\\n\\nOvu
  proceduru treba da urade stru\u010dnjaci, zato \u0161to ukoliko se uradi nepravilno
  mo\u017ee uzrokovati elektri\u010dno pra\u017enjenje znatnog intenziteta. \u0160tavi\u0161e,
  te\u010dnost iz akumulatora je otrovna i korozivna: izbegavajte kontakt sa ko\u017eom
  i o\u010dima. Nemojte prinositi otvoren plamen i upaljene cigarete akumulatoru i
  pazite da ne izazovete varnice.\\n\\n**STARTOVANJE MOTORA GURANJEM NIZ NIZBRDICU
  MALOM BRZINOM I SA PRITISNUTIM KVA\u010cILOM**\\n\\nNemojte nikada startovati motor
  guranjem, vu\u0107om ili spu\u0161tanjem niz nizbrdicu.\\n\\n**VA\u017dNO:** Zapamtite
  da sistem servo ko\u010dnice i elektri\u010dnog servo upravlja\u010da nije aktivan
  dok se motor ne startuje. Stoga je potreban mnogo ve\u0107i napor za kori\u0161\u0107enje
  pedale ko\u010dnice ili okretanje upravlja\u010da.\\n\\n---\\n\\n**ZAMENA TO\u010cKA**\\n\\n**OP\u0160TA
  UPUTSTVA**\\n\\nVozilo je opremljeno sa kompletom \\\"Fix&Go\\\" za brzu popravku
  pneumatika: videti deo \\\"komplet Fix&Go\\\" za dalje uputstva o kori\u0161\u0107enju
  ovog ure\u0111aja. Kao alternativa kompletu \\\"Fix&Go\\\" vozilo mo\u017ee biti
  opremljeno sa rezervnim to\u010dkom koji \u0161tedi prostor: videti uputstva na
  narednim stranama za zamenu to\u010dka.\\n\\n**UPPOZRENJE**\\n\\nRezervni to\u010dak
  koji \u0161tedi prostor (za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno)
  je specifi\u010dan za va\u0161e vozilo, nemojte ga koristiti na drugim modelima,
  isto tako nemojte koristiti na va\u0161em vozilu, rezervni to\u010dak koji \u0161tedi
  prostor drugih modela. Rezervni to\u010dak koji \u0161tedi prostor treba koristiti
  samo u vanrednim slu\u010dajevima. Treba ga koristiti samo onoliko koliko je potrebno
  da se do\u0111e do servisa, a brzina vozila ne sme da pre\u0111e 80 km/h. Rezervni
  to\u010dak koji \u0161tedi prostor ima narand\u017eastu nalepnicu koja rezimira
  sve glavne mere preostro\u017enosti i ograni\u010denja u kori\u0161\u0107enju. Nemojte
  nikada skidati ili pokrivati ovu nalepnicu. Sled\u0435\u0107\u0430 informacija je
  data na \u010detiri jezika na ovoj nalepnici: \\\"Va\u017eno! Samo za privremenu
  upotrebu! maksimum 80 km/h! Zamenite standardnim pneumatikom \u0161to je mogu\u0107e
  pre. Nemojte nikada pokrivati ovo uputstvo.\\\" Nemojte nikada stavljati poklopac
  glav\u010dine to\u010dka na rezervni to\u010dak koji \u0161tedi prostor.\\n\\n**UPAZORENJE**\\n\\nUpozorite
  ostale voza\u010de da vozilo miruje u skladu sa lokalnim propisima: svetla upozorenja
  na opasnost, trougao za upozoravanje itd. Svi putnici iz vozila treba da napuste
  vozilo, posebno ukoliko je te\u0161ko optere\u0107eno. Putnici treba da se udalje
  od dolaze\u0107eg saobra\u0107aja dok se to\u010dak menja. Ukoliko se nalazite na
  nekoj kosini ili neravnoj povr\u0161ini, stavite klin koji ste dobili sa vozilom
  ispod to\u010dka (videti uputstva na narednim stranama).\\n\\n---\\n\\n**UPAZORENJE**\\n\\nVozne
  karakteristike vozila \u0107e se promeniti sa montiranim rezervnim to\u010dkom koji
  \u0161tedi prostor. Izbegavajte nagla startovanja ili zastavljanja, nagla ili brza
  skretanja. Ukupno trajanje rezervnog to\u010dka koji \u0161tedi prostor je oko 3000km,
  posle \u010dega mu treba zameniti pneumatik drugim istog tipa. Nemojte nikada stavljati
  standardni pneumatik na to\u010dak koji je projektovan za kori\u0161\u0107enje sa
  rezervnim to\u010dkom koji \u0161tedi prostor. Popravite i vratite neispravni to\u010dak
  \u0161to je mogu\u0107e pre. Ne bi trebalo nikada da se dva ili vi\u0161e rezervna
  to\u010dka koji \u0161tede prostor koriste istovremeno. Nemojte zamastiti navoje
  vijaka to\u010dka pre nego \u0161to ih stavite: mogli bi da iskliznu.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nDizalicu
  treba koristiti samo za dizanje onog modela vozila sa kojim je isporu\u010dena.
  Nemojte nikada koristiti ovu dizalicu za neke druge svrhe, kao \u0161to je dizanje
  drugih mod\u0435\u043b\u0430 vozila. Nemojte nikada koristiti dizalicu za popravke
  ispod vozila. Nepravilno postavljena dizalica mo\u017ee da dovede do pada vozila.
  Nemojte koristiti dizalicu za ve\u0107a optere\u0107enja od onog koje je navedeno
  na njenoj oznaci. Na rezervni to\u010dak koji \u0161tedi prostor nije mogu\u0107e
  stavljati lance. Ukoliko je defektan pneumatik prednjeg (pogonskog) to\u010dka,
  a potrebni su lanci, upotrebite standardni to\u010dak sa zadnje osovine, a rezervni
  to\u010dak koji \u0161tedi prostor, stavite na zadnju osovinu. Na ovaj na\u010din,
  sa dva normalna pogonska to\u010dka na prednjoj osovini, mogu\u0107e je koristiti
  lance za sneg.\\n\\n---\\n\\n**UPAZORENJE**\\n\\nNepravilno name\u0161ten poklopac
  to\u010dka mo\u017ee da otpadne tokom kretanja vozila. Nikada nemojte dirati ventil
  za naduvavanje. Nikada ne stavljajte alate bilo koje vrste izme\u0111u to\u010dka
  i pneumatika. Redovno kontroli\u0161ite pritiske pneumatika i pneumatika rezervnog
  to\u010dka koji \u0161tedi prostor, tako da budu u skladu sa datim vrednostima u
  poglavlju \\\"Tehni\u010dke specifikacije\\\".\\n\\nDIZALICA\\n\\nMolimo vas da
  imate u vidu da:\\n\\n- te\u017eina dizalice je 1,76 kg;\\n- dizalicu nisu potrebna
  nikakva pode\u0161avanja;\\n- dizalica se ne mo\u017ee popravljati i u slu\u010daju
  defekta mora se zameniti drugom, originalnom dizalicom;\\n- nikakav alat, izuzev
  njene obrtne ru\u010dice, ne sme se montirati na dizalicu.\\n\\nZa zamenu to\u010dka,
  postupite kao \u0161to slije:\\n\\n- Zauzavite vozilo u polo\u017eaju koji nije
  opasan za dolaze\u0107i saobra\u0107aj, gde mo\u017eete bezbedno da zamenite to\u010dak.
  Tlo mora biti ravno i dovoljno \u010dvrsto;\\n- ugasite motor, povucite ru\u010dnu
  ko\u010dnicu i ubacite menja\u010d u prvu brzinu ili u hod unazad. Obucite reflektuju\u0107i
  bezbednosni prsluk (obavezan po zakonu) pre nego \u0161to iza\u0111ete iz vozila;\\n-
  otvorite prtlja\u017enik, povucite jezi\u010dak A sl. 142 i podignite tepih B;\\n-
  upotrebite klju\u010d A sl. 143 koji se nalazi u kutiji sa alatom, da olabavite
  ure\u0111aj za zaklju\u010davanje, uzmite kutiju sa alatom B i stavite je blizu
  to\u010dka koji treba zameniti.\\n- Zatim uzmite rezervni to\u010dak koji \u0161tedi
  prostor C;\\n- uzmite klju\u010d A sl. 144 i olabavite zavrtnje za pri\u010dvr\u0161\u0107ivanje
  tako \u0161to \u0107ete ih okrenuti otpriklake za jedan krug. Za verzije sa felnama
  od legure, prodrmajte vozilo da olak\u0161ate razdvajanje felne od glavchine to\u010dka;\\n\\n-
  uzmite klin A iz kutije za alat i rasklopite ga kao \u0161to je predstavljeno na
  slici 145;\\n\\nstavite klin iza to\u010dka koji se nalazi diagonalno suprotno od
  onog koji treba zameniti (videti sl. 146) kako biste spre\u010dili kretanje vozila
  kada je podignuto;\\n\\nstavite dizalicu ispod vozila, blizu to\u010dka koji treba
  zameniti;\\nubacite klju\u010d A sl. 147 kako biste digli dizalicu dok vrh dizalice
  B pravilno ne legne na nose\u0107i element \u0161asije C (pored oznake na samom
  nose\u0107em elementu \u0161asije);\\n\\n\u25a1 upozorite ostale putnike, da \u0107e
  ste da di\u017eete vozilo; sva lica treba da se udalje od vozila, dok ga ne spustite;\\n\u25a1
  namestite ru\u010dicu D sl. 147 u ku\u0107i\u0161te u ure\u0111aju A, rukujte dizalicom
  i podignite vozilo dok se to\u010dak ne digne nekoliko centimetara od tla;\\n\u25a1
  skinite poklopac to\u010dka po \u0161to olabavite 4 zavrtnja za pri\u010dvr\u0161\u0107ivanje
  i na kraju olabavite peti zavrtnj i izvucite to\u010dak (samo za verzije sa poklopcima
  to\u010dkova koji su pri\u010dvr\u0161\u0107eni sa zavrtnjima);\\n\u25a1 pazite
  da povr\u0161ine kontakta izme\u0111u rezervnog to\u010dka koji \u0161tedi prostor
  i glav\u010dine budu \u010diste, tako da se zavrtnji za pri\u010dvr\u0161\u0107ivanje
  ne olabave;\\n\u25a1 namestite rezervni to\u010dak koji \u0161tedi prostor tako
  \u0161to \u0107ete ubaciti prvi zavrtnj do dva navoja u otvor koji je najbli\u017ei
  ventilu;\\n\u25a1 zategnite zavrtnj za nekoliko navoja i postupite na isti na\u010din
  i sa ostalim zavrtnjima;\\n\u25a1 uzmite klju\u010d A sl. 144 i zategnite do kraja
  zavrtnje za pri\u010dvr\u0161\u0107ivanje;\\n\u25a1 rukujte ru\u010dicom dizalice
  D kako biste spustili vozilo. Zatim izvucite dizalicu;\\n\u25a1 upotrebite klju\u010d
  A da do kraja unakrsno zategnete zavrtnje po numeri\u010dkom redosledu kako je prikazano
  na slici 148;\\n\u25a1 kada menjate to\u010dak sa felnom od legure, preporu\u010dujemo
  vam da ga stavite tako da spolja\u0161nji deo bude okrenut nagore.\\n\\nNastojte
  da popravite \u0161to pre standardni to\u010dak, zato \u0161to kada ga stavite u
  odgovaraju\u0107u pregradu, teretna platforma prtlja\u017enika ne\u0107e vi\u0161e
  biti ravna, po\u0161to je standardni to\u010dak ve\u0107i od rezervnog to\u010dka
  koji \u0161tedi prostor.\\n\\n**PONOVNO NAME\u0160TANJE STANDARDNOG TO\u010cKA**\\n\\nPrate\u0107i
  prethodno opisanu proceduru, podignite vozilo i skinite rezervni to\u010dak koji
  \u0161tedi prostor.\\n\\nVerzije sa \u010deli\u010dnim felnama\\n\\nPostupite kao
  \u0161to sliedi:\\n\\n\u25a1 pazite da povr\u0161ine kontakta izme\u0111u standardnog
  to\u010dka i glav\u010dine budu \u010diste, tako da se zavrtnji za pri\u010dvr\u0161\u0107ivanje
  ne olabave;\\n\u25a1 namestite standardni to\u010dak ubacivanjem 5 zavrtnja u otvore\\n\\n![slika
  148]\\n\\n\u25a1 pritisnite poklopac glav\u010dine tako da legne u svoje le\u017ei\u0161te,
  po\u0161to prethodno poravnate specijalnu traku metala koja treba da legne u \u017eleb
  (na poklopcu) sa ventilom za naduvavanje;\\n\\n\u25a1 kori\u0161\u0107enjem datog
  klju\u010da, zategnite zavrtnje za pri\u010dvr\u0161\u0107ivanje;\\n\\n\u25a1 spustite
  vozilo i sklonite dizalicu;\\n\\n\u25a1 kori\u0161\u0107enjem datog klju\u010da,
  zategnite do kraja zavrtnje po prethodno prikazanom redosledu.\\n\\n**Verzije sa
  to\u010dkovima od legure**\\n\\nPostupite kao \u0161to sli\u0111e:\\n\\n\u25a1 stavite
  to\u010dak na glav\u010dinu i kori\u0161\u0107enjem datog klju\u010da zategnite
  zavrtnje;\\n\\n\u25a1 spustite vozilo i sklonite dizalicu;\\n\\n\u25a1 kori\u0161\u0107enjem
  datog klju\u010da, zategnite do kraja 5 zavrtnja po prikazanom redosledu;\\n\\n\u25a1
  namestite ponovo poklopac glav\u010dine, pazeci da postavite 3 plasti\u010dne osovinice
  u za to odre\u0111ena mesta na to\u010dku. Blago pritisnite poklopac da spre\u010dite
  o\u0161te\u0107enje plasti\u010dnih osovinica.\\n\\n**VA\u017dNO:** Ukoliko se ne
  namesti pravilno, poklopac glav\u010dine mo\u017ee da se otka\u010di tokom vo\u017enje.\\n\\n**Posle
  zamene pneumatika**\\n\\n\u25a1 odlo\u017eite rezervni to\u010dak koji \u0161tedi
  prostor u predvi\u0111enu pregradu u prtlja\u017eniku;\\n\\n\u25a1 ubacite dizalicu
  i ostale alate u kutiju;\\n\\n\u25a1 namestite kutiju i alate na rezervni to\u010dak
  koji \u0161tedi prostor;\\n\\n\u25a1 namestite pravilno tvrdi poklopac prtlja\u017enika.\\n\\nKomplet
  Fix&Go\\n\\nU prtlja\u017eniku sl. 149 (verzije bez podvufera) ili sl. 150 (verzije
  sa podvuferom \u2013 za verzije/tr\u017ei\u0161ta za koje je predvi\u0111eno) se
  nalazi odgovaraju\u0107a kutija. Ona tako\u0111e sadr\u017ei i \u0161rafciger i
  kuku za vu\u010du.\\n\\nOvaj komplet sadr\u017ei tako\u0111e:\\n\\n- jedan cilindar
  A sl. 151 koji sadr\u017ei zaptivno sredstvo i opremljen je sa:\\n  - lulom za punjenje
  B;\\n  - nalepnicu C sa informacijom \\\"maksimum 80 km/h\\\", koju treba staviti
  na vidno mesto za voza\u010da (na instrument plo\u010du) posle popravke pneumatika;\\n  -
  kompresor D koji ima mera\u010d pritiska i konekcije, a nalaze se u pregradi;\\n\\n-
  bro\u0161uru sa uputstvom (videti sl. 152) koju treba koristiti za brzu i pravilnu
  upotrebu kompleta za popravku pneumatika, a zatim je predati osoblju koje je zadu\u017eeno
  za postupanje sa popravljenim pneumatikom;\\n\\njedan par za\u0161titnih rukavica
  koje se nalaze u bo\u010dnoj pregradi kompresora;\\n\\nadaptere za naduvavanje raznih
  elemenata.\\n\\n**UPAZORENJE**\\n\\nDajte bro\u0161uru sa uputstvima tehni\u010darima
  koji su zadu\u017eeni za postupanje sa pneumatikom koji je popravljan kori\u0161\u0107enjem
  kompleta za brzu popravku pneumatika.\\n\\nU slu\u010daju bu\u0161enja uzrokovanih
  stranim telima, komplet se mo\u017ee koristiti za popraku pneumatika \u010dija su
  o\u0161te\u0107enja na gaze\u0107oj povr\u0161ini ili ramenu do maksimum 4 mm u
  pre\u010dniku.\\n\\n**UPAZORENJE**\\n\\nRupe i o\u0161te\u0107enja na bo\u010dnim
  zidovima pneumatika ne mogu se popraviti. Nemojte koristiti komplet za brzu popravku
  pneumatika ukoliko je pneumatik o\u0161te\u0107en kao posledica vo\u017enje za izduvanim
  pneumatikom.\\n\\nPopravke nisu mogu\u0107e u slu\u010daju o\u0161te\u0107enja to\u010dka
  (jaka deformacija \u017eljeba koja uzrokuje gubitak vazduha). Nemojte vaditi strano
  telo (vijak ili ekser) iz pneumatika.\\n\\nNemojte pustiti da kompresor radi du\u017ee
  od 20 uzastopnih minuta. Rizik od pregrevanja. Pneumatike popravljene sa kompletom
  za brzu popravku treba koristiti samo privremeno.\\n\\nCilindar sadr\u017ei etil
  glikol.\\n\\nSadr\u017ei lateks: mo\u017ee da uzrokuje alergijske reakcije. \u0160kodljiv
  je ukoliko se proguta. Iritira o\u010di. Mo\u017ee da uzrokuje iritaciju ukoliko
  se udi\u0161e ili pri kontaktu. Izbegavajte kontakt sa o\u010dima, ko\u017eom ili
  ode\u0107om. U slu\u010daju kontakta, odmah isperite sa puno vode. Ukoliko se proguta,
  nemojte izazvati povra\u0107anje. Isperite usta, popijte velike koli\u010dine vode
  i odmah potra\u017eite lekarsku pomo\u0107. \u010cuvajte van dohvata dece. Astmati\u010dari
  ne smeju da koriste ovaj proizvod. Nemojte udisati isparenja tokom ubacivanja i
  usisavanja. Pozovite odmah lekara ukoliko primetite alergijske reakcije. Dr\u017ei\u0161te
  posudu u njenoj odgovaraju\u0107oj pregradi, dalje od izvora toplote. Zaptivna te\u010dnost
  ima rok trajanja. Zamenite fla\u0161u koja sadr\u017ei zaptivnu te\u010dnost kojoj
  je istekao rok trajanja.\\n\\nU slu\u010daju bu\u0161enja uzrokovanih stranim telima,
  komplet se mo\u017ee koristiti za popravku pneumatika \u010dija su o\u0161te\u0107enja
  na gaze\u0107oj povr\u0161ini ili ramenu do maksimum 4 mm u pre\u010dniku.\\n\\nPostupite
  kao \u0161to slije:\\n\\n- Aktivirajte parkirnu ko\u010dnicu. Odvijte poklopac ventila
  pneumatika, izvadite elasti\u010dnu lulu punja\u010da A sl. 153 i zategnite prstenastu
  navrtku B na ventil pneumatika;\\n\\n- pazite da prekida\u010d kompresora A sl.
  154 bude u polo\u017eaju 0 (isklju\u010den), startujte motor, uklju\u010dite ga
  u uti\u010dnicu za struju u centralnom tunelu ili u prtlja\u017eniku sl. 155 i uklju\u010dite
  kompresor, okretanjem prekida\u010da A u polo\u017eaj I (uklju\u010den). Naduvajte
  pneumatik do pritiska kako je navedeno u delu \\\"Pritisak naduvavanja\\\" u odeljku
  \\\"Tehni\u010dke specifikacije\\\". Proverite pritisak pneumatika na mera\u010du
  B kada je isklju\u010den kompresor kako biste dobili preciznije o\u010ditavanje;\\n\\n-
  ukoliko posle pet minuta i dalje nije mogu\u0107e posti\u0107i najmanje 1,8 bara,
  isklju\u010dite kompresor iz ventila i uti\u010dnice za struju, zatim pomerite vozilo
  napred za oko deset metara kako bi se ravnomerno rasporedila zaptivna te\u010dnost
  unutar pneumatika, zatim ponovite proceduru naduvavanja;\\n\\n- ako posle ovog postupka
  i dalje ne mo\u017eete da postignete najmanje 1,8 bara posle 5 minuta od uklju\u010divanja
  kompresora, nemojte nastaviti da vozite, ve\u0107 se obratite Fiatovom dileru.\\n\\n**UPOZORENJE**\\n\\nStavite
  nalepnicu na mesto koje je lako uo\u010dljivo voza\u010du, kao podsetnik da je pneumatik
  popravljan kompletom za popravku pneumatika. Vozite pa\u017eljivo, posebno u krivinama.
  Nemojte prekora\u010divati brzinu od 80 km/h. Nemojte naglo dodavati gas niti ko\u010diti.\\n\\nposle
  vo\u017enje od oko 10 minuta, stanite i ponovo proverite pritisak u pneumatiku;
  aktivirajte parkirnu ko\u010dnicu;\\n\\nRadi bezbednosti vozila kada je parkirano,
  sledite uputstva data u delu \\\"Parkiranje\\\" u poglavlju \\\"Startovanje i vo\u017enja\\\".\\n\\n**UPOZORENJE**\\n\\nUkoliko
  je pritisak pao ispod 1,8 bara, nemojte voziti dalje: komplet za brzo popravljanje
  pneumatika ne mo\u017ee da garantuje pravilno odr\u017eavanje pritiska, zato \u0161to
  je pneumatik suvi\u0161e o\u0161te\u0107en. Obratite se Fiatovom dileru.\\n\\nukoliko
  registrujete vrednost pritiska od najmanje 1,8 bara, vratite pravilan pritisak (sa
  upaljenim motorom i aktiviranom parkirnom ko\u010dnicom), nastavite da vozite i
  pa\u017eljivo vozite do najbli\u017eeg Fiatovog dilera.\\n\\n**UPOZORENJE**\\n\\nObavestite
  dileru da je pneumatik popravljen kori\u0161\u0107enjem kompleta za brzu popravku
  pneumatika. Dajte bro\u0161uru sa uputstvima osoblu koje je zadu\u017eeno za postupanje
  sa popravljenim pneumatikom.\\n\\n**PROVERA I PONOVNO USPOSTAVLJANJE PROPISANOG
  PRITISKA PNEUMATIKA**\\n\\nKompresor se tako\u0111e mo\u017ee koristiti za proveru
  i, ukoliko je potrebno, pode\u0161avanje pritiska pneumatika. Otputite kliznu spojnicu
  A sl. 157 i konektujte ga direktno na ventil pneumatika koji treba naduvati.\\n\\nZAMENA
  FLA\u0160E\\n\\nPostupite kao \u0161to slije.\\n\\n- isklju\u010dite spojnicu A
  sl. 157;\\n- okrenite cilindar koji treba zameniti u pravcu suprotnom od pravca
  okretanja kazaljki na satu i podignite ga;\\n- namestite novi cilindar i okrenite
  ga u pravcu okretanja kazaljki na satu;\\n- uklju\u010dite spojnicu A za cilindar
  i ubacite providnu lulu B u njeno ku\u0107i\u0161te.\\n\\nZAMENA SIJALICA\\n\\nOP\u0160TA
  UPUTSTVA\\n\\n- pre zamene sijalice proverite kontakte da nema oksidacije;\\n- pregorele
  sijalice treba zameniti sijalicama istoga tipa i snage;\\n- posle zamene sijalice
  farova, proverite uvek da li je svetlosni snop pravilno pode\u0161en;\\n- kada neko
  svetlo ne radi, proverite da li je ispravan odgovaraju\u0107i osigura\u010d, pre
  nego \u0161to zamenite sijalicu. \u0160to se ti\u010de mesta osigura\u010da, pogledajte
  deo \\\"Ako osigura\u010d pregori\\\" u ovom odeljku.\\n\\nUPAZORENJE\\n\\nIzmene
  ili popravke elektri\u010dnog sistema koje se ne urade pravilno ili se pritom ne
  uzmu u obzir tehni\u010dke specifikacije ovog sistema, mogu da uzrokuju defektan
  rad koji dovodi do rizika od po\u017eara.\\n\\nUPAZORENJE\\n\\nHalogene sijalice
  sadr\u017ee gas pod pritiskom, u slu\u010daju lomljenja mogu da eksplodiraju i da
  uzrokuju raspr\u0161ivanje komada stakla.\\n\\nVA\u017dNO: Kada je napolju hladno
  ili vla\u017eno ili posle jake ki\u0161e ili pranja, mogu\u0107e je da se pojavi
  para i/ili da se formiraju kaplice kondenzacije na unutra\u0161njoj povr\u0161ini
  farova ili zadnjih svetala. Ovo je prirodna pojava usled razlike u temperaturi i
  vla\u017enosti izme\u0111u unutra\u0161nje i spolja\u0161nje strane stakla i ne
  ukazuje na defekt niti ugro\u017eava normalan rad ure\u0111aja za osvetljavanje.
  Zamagljenost nestaje brzo kada se upale svetla, po\u010dev od centra difuzora, pra\u0107eno
  progresivnim \u0161irenjem prema ivicama.\\n\\nSa halogenim sijalicama treba rukovati
  tako \u0161to ih treba uhvatiti samo za metalni deo. Diranjem providnog dela sijalice
  prstima mo\u017ee da smanji intenzitet emitovanog svetla i \u010dak da smanji vek
  trajanja sijalice. Ukoliko do\u0111e do slu\u010dajnog kontakta, obri\u0161ite sijalicu
  krpom ovla\u017eenom alkoholom i ostavite je da se osu\u0161i.\\n\\nKad god je to
  mogu\u0107e, preporu\u010duje se da sijalice menja Fiatov diler. Pravilan rad i
  pravac spolja\u0161njih svetala apsolutno su neophodni za bezbednost vozila i po\u0161tovanje
  zakona.\\n\\nVRSTE SIJALICA\\n\\nRazne vrste sijalica ugra\u0111ene su u va\u0161e
  vozilo:\\n\\nSijalice od stakla: (tip A) name\u0161taju se pritiskanjem. Povucite
  ih kada \u017eelite da ih izvadite.\\n\\nBajonet sijalice: (tip B) za va\u0111enje
  treba da pritisnete sijalicu zatim da je okrenete u pravcu suprotnom od pravca kretanja
  kazaljki na satu.\\n\\nTubularne sijalice: (tip C) oslobodite ih iz kontakta, kako
  biste ih izvadili.\\n\\nHalogene sijalice: (tip D) za va\u0111enje ovih sijalica,
  otpustite spojnicu, koja dr\u017ei ove sijalice.\\n\\nHalogene sijalice: (tip E)
  za va\u0111enje ovih sijalica, otpustite spojnicu, koja dr\u017ei ove sijalice.\\n\\n|
  Namena sijalica                        | Tip       | Ja\u010dina  | Referenca |\\n|---------------------------------------|-----------|---------|-----------|\\n|
  Oborena / duga\u010dka svetla               | H7        | 55W     | D         |\\n|
  Prednja bo\u010dna svetla / dnevna svetla (DRL) | W21/5W   | 21W/5W  | B         |\\n|
  Zadnja bo\u010dna svetla / Ko\u010diona svetla   | P21/5W   | 21W/5W  | B         |\\n|
  Prednji pokaziva\u010di pravca              | WY21W    | 21W     | B         |\\n|
  Bo\u010dni pokaziva\u010di pravca                | WY5W     | 5W      | A         |\\n|
  Zadnji pokaziva\u010di pravca               | P21W     | 21W     | B         |\\n|
  Tre\u0107e stop svetlo                      | LED      | -       | -         |\\n|
  Svetla za maglu                       | H11      | 55W     | E         |\\n| Hod
  unazad                             | W16W     | 16W     | B         |\\n| Zadnja
  svetla za maglu                 | W16W     | 16W     | B         |\\n| Svetla registrarskih
  tablica          | C5W      | 5W      | C         |\\n| Prednje krovno svetlo                  |
  C5W      | 5W      | C         |\\n| Prednja krovna svetla (suncobrana)     | C5W      |
  5W      | C         |\\n| Krovno svetlo prtlja\u017enika              | W5W      |
  5W      | A         |\\n| Svetlo prostora za dokumenta i sitne stvari | C5W   |
  5W      | C         |\\n| Zadnja unutra\u0161nja svetla               | C5W      |
  5W      | C         |\\n\\nZAMENA SPOLJA\u0160NJIH SIJALICA\\n\\nPogledajte deo
  \\\"Zamena sijalica\\\" da vidite koji vam tip i ja\u010dina sijalice treba.\\n\\nPREDNJI
  GORNJI FAR\\n\\nSadr\u017ei sijalice za pokaziva\u010de pravca i oborena svetla.
  Sijalice su raspore\u0111ene kao \u0161to sledi sl. 158:\\n\\nA pokaziva\u010di
  pravca\\nB oborena svetla\\n\\nPOKAZIVA\u010cI PRAVCA\\n\\nZa zamenu sijalica postupite
  kao \u0161to sli\u010di:\\n\\n- skinite poklopac A sl. 158;\\n- okrenite dr\u017ea\u010d
  sijalice B sl. 159 u pravcu kretanja kazaljki na satu, izvucite sijalicu C i zamenite
  je;\\n- namestite novu sijalicu u dr\u017ea\u010d sijalice i obavezno proverite
  da li je pravilno fiksirana;\\n- namestite ponovo dr\u017ea\u010d sijalice u njegovo
  ku\u0107i\u0161te i okrenite ga u pravcu kretanja kazaljki na satu, dok ne \u010dujete
  zvuk zabravljalivanja \u0161to zna\u010di da je legao u le\u017ei\u0161te;\\n- zatim
  ponovo namestite poklopac A sl. 158.\\n\\n**OBORENA SVETLA**\\n\\nZa zamenu sijalice
  postupite kao \u0161to sli\u010di:\\n\\n- skinite poklopac B sl. 158;\\n- skinite
  konektor + dr\u017ea\u010d sijalice C sl. 160, osloba\u0111aju\u0107i ga prema spolja;\\n-
  izvadite sijalica D iz konektora E i zamenite je;\\n- stavite novu sijalicu na konektor,
  proverite da li je dobro pri\u010dvr\u0161\u0107ena;\\n- namestite ponovo konektor
  + dr\u017ea\u010d sijalice C u njegovo ku\u0107i\u0161te;\\n- namestite ponovo poklopac
  B sl. 158.\\n\\n**PREDNJI DONJI FAR**\\n\\nSadr\u017ei sijalice za duga\u010dka
  svetla i bo\u010dna svetla / dnevna svetla (DRL),\\n\\nSijalice su raspore\u0111ene
  kao \u0161to sli\u010di sl. 161:\\n\\n- **C** duga\u010dka svetla\\n- **D** bo\u010dna
  svetla / dnevna svetla (DRL)\\n\\n**DUGA\u010cKA SVETLA**\\n\\nZa zamenu sijalice
  postupite kao \u0161to sli\u010di:\\n\\n- okrenite upravlja\u010d do kraja prema
  unutra;\\n- odvijte vijke A sl. 162 i skinite klapnu B;\\n- skinite poklopac C sl.
  161;\\n- skinite konektor + dr\u017ea\u010d sijalice D sl. 163, osloba\u0111aju\u0107i
  ga prema spolja;\\n\\nizvadite sijalicu E iz konektora F i zamenite je;\\nnamestite
  novu sijalicu na konektor i obavezno provjerite da li je pravilno pri\u010dvr\u0161\u0107ena;\\n\\nnamjestite
  ponovo konektor + dr\u017ea\u010d sijalice D u njegovo ku\u0107i\u0161te;\\nna kraju
  namestite ponovo poklopac C sl. 161.\\n\\nBO\u010cNA SVETLA / DNEVNA SVETLA (DRL)\\n\\nZa
  zamenu sijalice postupite kao \u0161to slijedi:\\nokrenite upravlja\u010d do kraja
  prema unutra;\\nodvijte vijke A sl. 162 i skinite klapnu B;\\nskinite poklopac D
  sl. 161;\\nokrenite dr\u017ea\u010d sijalice E sl. 164 u pravcu kretanja kazaljki
  na satu, izvucite sijalicu F iz konektora G i zamenite je;\\nnamestite novu sijalicu
  na konektor i obavezno provjerite da li je pravilno pri\u010dvr\u0161\u0107ena;\\n\\n\u25a1
  nameste ponovo dr\u017ea\u010d sijalice E u njegovo ku\u0107i\u0161te i okrenite
  ga u pravcu kretanja kazaljki na satu, dok ne \u010dujete zvuk zabravljuvania, \u0161to
  zna\u010di da je pri\u010dvr\u0161\u0107en;\\n\u25a1 na kraju nameste poklopac D
  sl. 161.\\n\\nBO\u010cNI POKAZIVA\u010cI PRAVCA\\n\\nZa zamenu sijalice, potupite
  kao \u0161to slije:\\n\\n\u25a1 podesite so\u010divo A sl. 165 tako da pritisnete
  unutra\u0161nji dr\u017ea\u010d B sl. 166, zatim povucite snop prema spolja;\\n\u25a1
  okrenite dr\u017ea\u010d sijalice C u pravcu suprotnom od pravca kretanja kazaljki
  na satu, izvucite sijalicu D i zamenite je;\\n\\n\u25a1 vratite dr\u017ea\u010d
  sijalice C u so\u010divo A i okrenite ga u pravcu kretanja kazaljki na satu;\\n\u25a1
  nameste ponovo snop i proverite pritom da li je unutra\u0161nji dr\u017ea\u010d
  B legao na svoje mesto.\\n\\nSVETLA ZA MAGLU\\n(za verzije / tr\u017ei\u0161ta za
  koje je predvi\u0111eno)\\nZa zamenu sijalice postupite kao \u0161to sledi:\\n-
  okrenite upravlja\u010d do kraja prema unutra;\\n- odvijte vijke A sl. 167 i skinite
  klapnu B;\\n- podesite dr\u017ea\u010d C sl. 168 i isklju\u010dite elektri\u010dni
  konektor D;\\n- okrenite i izvadite dr\u017ea\u010d sijalice E;\\n- izvadite sijalicu
  i zamenite je;\\n- namestite novo svetlo i uradite obrnutim redosledom prethodno
  opisani postupak.\\n\\nSNOPOVI ZADNJEG SVETLA\\nOvi sadr\u017ee sijalice za bo\u010dna
  svetla, ko\u010diona svetla i pokaziva\u010de pravca.\\n\\nZa zamenu sijalica postupite
  kao \u0161to sledi:\\n- uzm\u0438\u0442\u0435 inbus A sl. 169 koji ste dobili uz
  vozilo;\\n- stavite ga u jezi\u010dak B sl. 170 i skinite za\u0161titni poklopac
  C (koji se nalazi sa bo\u010dne strane prtlja\u017enika);\\n\\n- upotrebite inbus
  A da odvijete ure\u0111aje za pri\u010dvr\u0161\u0107ivanje D sl. 171 snopa zadnjeg
  svetla;\\n- izvucite snop svetla tako \u0161to \u0107ete ga izvaditi pomo\u0107u
  obe ruke u pravcu koji pokazuju strelice sl. 172;\\n\\n- isklju\u010dite elektri\u010dni
  konektor, odvijte vijke za pri\u010dvr\u0161\u0107ivanje E sl. 173 i izvadite sklop
  dr\u017ea\u010da sigalice;\\n\\nzamenite sijalice po potrebi: F = pokaziva\u010di
  pravca, G = bo\u010dna svetla / ko\u010diona svetla sl. 174.\\n\\nFIKSNI FAR ZADNJEG
  SVETLA\\n\\nSadr\u017ee sijalice zadnjeg svetla za maglu (leva strana) i sijalice
  svetla za hod unazad (desna strana):\\n\\nZa zamenu sijalica postupite kao \u0161to
  slije:\\n\\n- otvorite prtlja\u017enik, skinite unutra\u0161nji okvir, odvijte \u010detiri
  vijka za pri\u010dvr\u0161\u0107ivanje A sl. 175 i skinite snop svetla B;\\n- isklju\u010dite
  elektri\u010dni konektor i okre\u0107ite dr\u017ea\u010d sijalice C u pravcu suprotnom
  od pravca kretanja kazaljki na satu sl. 176;\\n- izvadite sijalicu D iz dr\u017ea\u010da
  sijalice i zamenite je;\\n- namestite novu sijalicu na dr\u017ea\u010d sijalice
  i obavezno proverite da li je propisno pri\u010dvr\u0161\u0107ena;\\n\\n- vratite
  dr\u017ea\u010d sijalice C u so\u010divo tako \u0161to \u0107ete ga okretati u pravcu
  kretanja kazaljki na satu i ponovo pove\u017eite elektri\u010dni konektor;\\n- pravilno
  namestite snop svetla B sl. 175 zatezanjem \u010detiri vijka za fiksiranje A, zatim
  zatvorite prtlja\u017enik.\\n\\nslika 175\\n\\nslika 174\\n\\nslika 176\\n\\nTRE\u0106E
  STOP SVETLO\\n\\nNalazi se u petim vratima i to su LED svetla. Ukoliko ih treba
  zameniti, obratite se Fiatovom dileru.\\n\\nSVETLA REGISTARSKIH TABLICA\\n\\nZa
  zamenu postupite kao \u0161to slije:\\n\\n- skinite so\u010divo A sl. 177;\\n- zamenite
  sijalicu B sl. 178 tako \u0161to \u0107ete je osloboditi iz bo\u010dnih kontakata;\\n\\n-
  ubacite novu sijalicu B i obavezno proverite da li je pravilno pri\u010dvr\u0161\u0107ena
  izme\u0111u kontakata;\\n- na kraju vratite so\u010divo A sl. 177.\\n\\nZAMENA UNUTRA\u0160NJIH
  SIJALICA\\n\\nPREDNJE KROVNO SVETLO\\n\\nVerzije bez ogledala za nadzor zadnjeg
  sedi\u0161ta\\nZa zamenu sijalica postupite kao \u0161to slije:\\n\\n- skinite krovno
  svetlo A sl. 179 sa mesta na koje ukazuju strelice;\\n- oslobodite ku\u0107i\u0161ta
  sijalice B sl. 180 i skinite ih tako \u0161to \u0107ete ih izvu\u0107i prema spolja,
  zatim zamenite sijalice C;\\n- namestite pravilno nove sijalice u odgovaraju\u0107a
  ku\u0107i\u0161ta B;\\n- namestite krovno svetlo A sl. 179 u njegovo ku\u0107i\u0161te
  i obavezno proverite da li je pri\u010dv\u0161eno.\\n\\nVerzije sa ogledalom za
  nadzor zadnjeg sedi\u0161ta (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\nZa
  zamenu sijalica, postupite kao \u0161to slije:\\n\\n- postupak izvr\u0161ite na
  mjestu A i stavite ogledalo B u radni polo\u017eaj;\\n\\nslika 180\\n\\nslika 179\\n\\nslika
  181\\n\\nodvijte vijak i skinite poklopac za fiksiranje C sl. 181;\\nrade\u0107i
  sa zadnje strane povucite krovno svetlo nadole i oslobodite ga\\n\\nZa ponovno name\u0161tanje
  uradite obrnutim redosledom prethodno navedene operacije.\\n\\nZa zamenu sijalice
  pogledajte deo \\\"Verzije bez ogledala za nadzor zadnjeg sedi\u0161ta\\\".\\n\\n**Verzije
  sa fiksnim staklenim krovom ili elektri\u010dnim krovom na otvaranje**\\n\\nZa skidanje
  krovnog svetla izamenu sijalica obratite se Fiatovom dileru.\\n\\n**ZADNJE KROVNO
  SVETLO**\\n\\nVerzije bez krova na otvaranje\\n\\nZa zamenu sijalica postupite kao
  \u0161to sledi:\\n\\n- iz ta\u010dke na koju pokazuju strelice skinite krovno svetlo
  A sl. 182;\\n- otvorite klapnu C sl. 183 i zamenite sijalicu B tako \u0161to \u0107ete
  je osloboditi iz bo\u010dnih kontakata;\\n\\nubacite novu sijalicu i obavezno proverite
  da li je pravilno pri\u010dvr\u0161\u0107ena izme\u0111u kontakata.\\n\\nnamestite
  ponovo krovno svetlo A sl. 182 tako \u0161to \u0107ete ga ubaciti u pravilan polo\u017eaj
  prvo s jedne strane, a zatim pritiskanjem na drugoj strani dok ne bude zabravljenno
  u svom le\u017ei\u0161tu na svoje mesto.\\n\\nslika 182\\n\\nslika 183a\\n\\nVerzije
  sa krovom na otvaranje\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nZa
  zamenu sijalica, postupite kao \u0161to sledi:\\n\\n- iz ta\u010dke na koju pokazuje
  strelica skinite krovno svetlo A sl. 184;\\n- zamenite sijalicu B sl. 185 osloba\u0111aju\u0107i
  je iz bo\u010dnih kontakata;\\n\\n- ubacite novu sijalicu i obavezno proverite da
  li je pravilno pri\u010dvr\u0161\u0107ena izme\u0111u kontakata.\\n- namestite ponovo
  krovno svetlo A sl. 184 tako \u0161to \u0107ete ga ubaciti u njegov pravilan polo\u017eaj
  prvo s jedne strane, a zatim pritiskanjem na drugu stranu dok ne klikne na svoje
  mesto.\\n\\nslika 184\\n\\nslika 185\\n\\nKROVNO SVETLO PRTLJA\u017dNIKA\\n\\nZa
  zamenu sijalice, postupite kao \u0161to slije:\\n\\n- otvorite prtlja\u017enik i
  izvucite krovno svetlo A sl. 186 iz ta\u010dke na koju ukazuje strelica;\\n- otvorite
  za\u0161titu B i zamenite sijalicu;\\n- zatvorite ponovo za\u0161titu B na so\u010divu;\\n-
  namestite ponovo krovno svetlo A tako \u0161to \u0107ete ga ubaciti u njegov pravilan
  polo\u017eaj prvo s jedne strane, a zatim pritiskanjem na drugu stranu dok ne klikne
  na svoje mesto.\\n\\nslika 186\\n\\nSVETLO PREGRADE ZA DOKUMENTA I SITNE STVARI\\n\\nZa
  zamenu sijalice, postupite kao \u0161to slije:\\n\\n- otvorite pregradu za dokumenta
  i sitne stvari i izvucite krovno svetlo A sl. 187;\\n- otvorite za\u0161titu B i
  zamenite sijalicu;\\n- zatvorite ponovo za\u0161titu B na so\u010divu;\\n- namestite
  ponovo krovno svetlo A tako \u0161to \u0107ete ga ubaciti u njegov pravilan polo\u017eaj
  prvo s jedne strane, a zatim pritiskanjem na drugu stranu dok ne legne na svoje
  mesto.\\n\\nslika 187\\n\\nZAMENA OSIGURA\u010cA\\n\\nOP\u0160TI PODACI\\n\\nOsigura\u010di
  \u0161tite elektri\u010dni sistem: oni interveni\u0161u (pregore) u slu\u010daju
  neispravnosti ili nepravilne intervencije na sistemu.\\n\\nKada neki ure\u0111aj
  ne radi, proverite stanje njegovog za\u0161titnog osigura\u010da: element provodnika
  A sl. 188 mora biti neo\u0161te\u0107en. Ukoliko to nije slu\u010daj, zamenite pregoreli
  osigura\u010d sa drugim iste amperaze (iste boje).\\n\\nB = neo\u0161te\u0107en
  osigura\u010d;\\nC = osigura\u010d sa o\u0161te\u0107enim elementom provodnika:\\n\\nslika
  188\\n\\nZa zamenu osigura\u010da, upotrebite klje\u0161ta D koja su zaka\u010dena
  sa unutra\u0161nje strane poklopcu kutije sa osigura\u010dima u prostoru za motor.\\n\\nPogledajte
  tabele na narednim stranicama za identifikaciju pojedinih za\u0161titnih osigura\u010da.\\n\\nUPAZORENJE\\n\\nUkoliko
  zamenjeni osigura\u010d ponovo pregori, obratite se Fiatovom dileru.\\n\\nUPAZORENJE\\n\\nNemojte
  nikada menjati osigura\u010de metalnim \u017eicama ili bilo \u010dim drugim.\\n\\nUPAZORENJE\\n\\nNemojte
  nikada menjati osigura\u010de drugim ve\u0107e amperaze: OPASNOST OD PO\u017dARA.\\n\\nUPOZORENJE\\n\\nUkoliko
  glavni osigura\u010d (MEGA-FUSE, MIDI-FUSE, MAXI-FUSE) pregori, obratite se Fiatovom
  dileru.\\n\\nUPOZORENJE\\n\\nPre nego \u0161to zamenite osigura\u010d, proverite
  da li je izva\u0111en klju\u010d za paljenje i da li su svi ostali sistemi uga\u0161eni
  ili deaktivirani.\\n\\nUPOZORENJE\\n\\nUkoliko se aktivira neki od glavnih za\u0161titnih
  osigura\u010da bezbednosnih sistema (sistem vazdu\u0161nih jastuka, ko\u010dioni
  sistem), pogonskog sistema (sistem motora, sistem transmisije) ili upravlja\u010dkog
  sistema, obratite se Fiatovom dileru.\\n\\nMESTO OSIGURA\u010cA\\n\\nKutija sa osigura\u010dima
  u prostoru za motor\\nNalazi se pored akumulatora sl. 190.\\nZa pristup osigura\u010dima,
  postupite kao \u0161to slije:\\n- odvijte dva vijka A sl. 189;\\n- skinite poklopac
  B u pravcu u kome pokazuje strelica.\\n\\nVA\u017dNO: Pre skidanja poklopca B pritisnite
  i okrenite dva bajonet \u0161rafa A polako u pravcu suprotnom od pravca kretanja
  kazaljki na satu (kori\u0161\u0107enjem \u0161rafcigera ravnog vrha koji ste dobili
  uz vozilo) dok ih ne oslobodite, a to zna\u010di dok se ne podignu glave \u0161rafova.\\n\\nBrojevi
  koji identifikuju elektri\u010dne komponente koje odgovaraju svakom osigura\u010du
  prikazani su na poklopcu.\\nPosle zamene osigura\u010da obavezno dobro zatvorite
  poklopac B na kutiji osigura\u010da.\\n\\nUkoliko je potrebno da se pere prostor
  za motor, pazite da ne uperite voden mlaz direktno na kutiju sa osigura\u010dima
  i na motore brisa\u010da vetrobranskog stakla.\\n\\nslika 190\\n\\nKutija sa osigura\u010dima
  u komandnoj tabli\\n\\nZa pristup ovim osigura\u010dima skinite poklopac A sl. 191.\\n\\nOsigura\u010di
  se nalaze u kutiji sa osigura\u010dima kao \u0161to je prikazano na sl. 192.\\n\\nslika
  192\\n\\nKutija sa osigura\u010dima u prtlja\u017eniku\\n\\nZa pristup osigura\u010dima
  upotrebite ta\u010dku na koju ukazuje strelica sl. 193 i skinite klapnu A.\\n\\nOsigura\u010di
  se nalaze u kutiji sa osigura\u010dima kao \u0161to je prikazano na slici 194.\\n\\n|
  POTRO\u0160A\u010cI                        | OSIGURA\u010c | AMPERA |\\n|---------------------------------|----------|--------|\\n|
  Sirena                          | F10      | 15     |\\n| Grejano zadnje staklo           |
  F20      | 30     |\\n| Upalja\u010d za cigarete / prednja uti\u010dnica za struju
  | F85 | 15     |\\n| Uti\u010dnica za struju u prtlja\u017eniku | F86      | 15     |\\n|
  Greja\u010di spolja\u0161njih retrovizora | F88      | 7,5    |\\n\\n| POTRO\u0160A\u010cI                                      |
  OSIGURA\u010c | AMPERA |\\n|------------------------------------------------|----------|--------|\\n|
  Zadnji elektri\u010dni podiza\u010d stakla (levi)        | F33      | 20     |\\n|
  Zadnji elektri\u010dni podiza\u010d stakla (desni)       | F34      | 20     |\\n|
  +30 Radio, UConnect, zadnja unutra\u0161nja svetla (desno i levo) | F36      | 10     |\\n|
  Centralno zaklju\u010davanje                        | F38      | 20     |\\n| Dvosmerna
  pumpa pera\u010da vetrobranskog stakla    | F43      | 20     |\\n| Prednji elektri\u010dni
  podiza\u010d stakla (voza\u010da)     | F47      | 20     |\\n| Prednji elektri\u010dni
  podiza\u010d stakla (suvoza\u010da)   | F48      | 20     |\\n| Duga\u010dko svetlo
  (levo)                          | F90      | 7,5    |\\n| Duga\u010dko svetlo (desno)                         |
  F91      | 7,5    |\\n| Svetlo za maglu (levo)                         | F92      |
  7,5    |\\n| Svetlo za maglu (desno)                        | F93      | 7,5    |\\n\\n|
  POTRO\u0160A\u010cI                                      | OSIGURA\u010c | AMPERA
  |\\n|------------------------------------------------|----------|--------|\\n| Elektri\u010dni
  regulator lumbalnog dela prednjeg sedi\u0161ta | F1       | 15     |\\n| Elektri\u010dni
  greja\u010d prednjeg sedi\u0161ta               | F2       | 15     |\\n| HI-FL
  sistem                                     | F3       | 20     |\\n| Elektri\u010dni
  zastor krova na otvaranje             | F5       | 20     |\\n| Elektri\u010dni
  krov na otvaranje                     | F6       | 20     |\\n\\nPUNJENJE AKUMULATORA\\n\\nVA\u017dNO:
  Postupak punjenja akumulatora dat je samo informativno. Savetujemo vam da se obratite
  Fiatovom dileru, da uradi ovaj postupak.\\n\\nSavetujemo vam sporo punjenje strujom
  male ja\u010dine u trajanju od oko 24 sati. Du\u017ee punjenje mo\u017ee da o\u0161teti
  akumulator.\\n\\nVERZIJE BEZ SISTEMA START&STOP (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno)\\n\\nPunite akumulator kao \u0161to slije:\\n\\n- isklju\u010dite
  negativnu klemu akumulatora;\\n- pove\u017eite kablove punja\u010da za kleme akumulatora,
  pazeci pritom na polaritet;\\n- uklju\u010dite punja\u010d;\\n- kada se postupak
  zavr\u0161i, isklju\u010dite punja\u010d pre nego \u0161to isklju\u010dite akumulator;\\n-
  pove\u017eite ponovo negativnu klemu akumulatora.\\n\\nVERZIJE SA SISTEMOM START&STOP
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nPunite akumulator
  kao \u0161to slije:\\n\\n- isklju\u010dite konektor A sl. 195 (pritiskanjem dugmeta
  B) iz senzora za pra\u0107enje stanja akumulatora C (koji se nalazi na negativnoj
  klemi akumulatora D);\\n- pove\u017eite pozitivni kabl (+) punja\u010da akumulatora
  na pozitivnu klemu akumulatora (+);\\n- pove\u017eite negativni kabl (-) punja\u010da
  akumulatora za osovinicu D negativne kleme akumulatora (-);\\n- uklju\u010dite punja\u010d
  akumulatora. Kada se napuni, isklju\u010dite punja\u010d, pre nego \u0161to uklonite
  veze sa akumulatorom;\\n- pove\u017eite ponovo konektor A sl. 195 za senzor C akumulatora.\\n\\nslika
  195\\n\\n**UPOZORENJE**\\n\\nTe\u010dnost akumulatora je otrovna i korozivna: izbegavajte
  kontakt sa ko\u017eom i o\u010dima. Akumulator treba puniti u dobro provetrenim
  prostorima, dalje od otvorenog plamena ili mogu\u0107ih izvora varnica: opasnost
  od eksplozije i po\u017eara.\\n\\n**UPOZORENJE**\\n\\nNemojte poku\u0161avati da
  punite smrznut akumulator; prvo ga odmrznite kako biste spre\u010dili rizik od eksplozije.
  Ukoliko je akumulator bio smrznut, dajte ga stru\u010dnim tehni\u010darima da ga
  pregledaju pre punjenja kako bi proverili da mu unutra\u0161nji elementi nisu o\u0161te\u0107eni
  i da ku\u0107i\u0161te nije napuklo, \u0161to bi moglo da dovede do curenja otrovne,
  korozivne kiseline.\\n\\n**DIZANJE VOZILA**\\n\\nUkoliko je potrebno da se vozilo
  di\u017ee, obratite se Fiatovom dileru, koji je opremljen sa radioni\u010dkim dizalicama
  i propratnom opremom.\\n\\n**UPOZORENJE**\\n\\nDi\u017eite vozilo isklju\u010divo
  tako \u0161to \u0107e ga dizalica uhvatiti na obele\u017eenim ta\u010dkama kao \u0161to
  je prikazano na slici 196.\\n\\nslika 196\\n\\nVU\u010cA VOZILA\\n\\nKuka za vu\u010du,
  koju ste dobili sa vozilom, nalazi se u kutiji sa alatom, ispod tepiha u prtlja\u017eniku.\\n\\nMONTIRANJE
  KUKE ZA VU\u010cU\\n\\nSkinite poklopac A sl. 197 (prednji branik) ili A sl. 198
  (zadnji branik) pritiskanjem donjeg dela; uzmite kuku za vu\u010du B sl. 197 (prednji
  branik) ili B sl. 198 (zadnji branik) iz njenog ku\u0107i\u0161ta u kutiji sa alatom
  i zavijte je do kraja na prednjoj ili zadnjoj osovinici sa navojem.\\n\\nUPPOZORENJE\\n\\nPre
  vu\u010de, okrenite klju\u010d za paljenje u polo\u017eaj MAR, a zatim u STOP i
  nemojte ga vadi\u0107i. Stub upravlja\u010da bi se automatski zaklju\u010dao, ukoliko
  biste izvadili klju\u010d i ne biste mogli da upravljate to\u010dkovima.\\n\\nUPPOZORENJE\\n\\nPre
  zatezanja kuke, o\u010distite dobro ku\u0107i\u0161te sa navojem. Obavezno proverite
  da li je kuka dobro pri\u010dvr\u0161\u0107ena u ku\u0107i\u0161tu pre vu\u010de
  vozila.\\n\\nImajte u vidu da tokom vu\u010de nemate na raspolaganju pomo\u0107
  servo ko\u010dnice i elektri\u010dnog servo upravlja\u010da, stoga je potrebna ve\u0107a
  sila prilikom kori\u0161\u0107enja ko\u010dnice i vi\u0161e napora za rukovanje
  upravlja\u010dem. Nemojte koristiti elasti\u010dne sajle za vu\u010du i izbegavajte
  trzaje prilikom kretanja. Nastojte da ne o\u0161tetite delove koji su u kontaktu
  sa vozilom tokom vu\u010de. Kada vu\u010dete vozilo, morate po\u0161tovati sve saobra\u0107ajne
  propise koji se odnose na vu\u010du i pona\u0161ati se u saobra\u0107aju kako je
  predvi\u0111eno u takvoj situaciji. Nemojte startovati motor tokom vu\u010de vozila.\\n\\nPrednju
  i zadnju kuku treba koristiti samo u hitnim slu\u010dajevima na putu. Dozvoljeno
  je da vu\u010dete vozilo u kratkim rastojanjima kori\u0161\u0107enjem odgovaraju\u0107eg
  ure\u0111aja u skladu sa zakonom o javnim putevima (kruta \u0161ipka), da vam vozilo
  pripremljeno za vu\u010du, vu\u010de \u0161lep slu\u017eba. Kuke za vu\u010du NE
  SMETE koristiti za vu\u010du vozila van puteva ili gde ima prepreka ili/ili za vu\u010du
  kori\u0161\u0107enjem sajli ili drugih ure\u0111aja koji nisu kruti. U skladu sa
  prethodnim uslovima, u vu\u010di treba da u\u010destvuju dva vozila (jedno koje
  vu\u010de, drugo koje je vu\u010deno) postavljena \u0161to je mogu\u0107e vi\u0161e
  u istoj centralnoj liniji.\\n\\nSERVISIRANJE I ODR\u017dAVANJE\\n\\nPLANIRANO SERVISIRANJE\\n\\nPravilno
  servisiranje je neophodno za obezbe\u0111ivanje dugog veka trajanja vozila u najboljim
  uslovima. Fiat je stoga predvideo niz postupaka za kontrolu i odr\u017eavanje koje
  treba izvr\u0161iti na svakih 20.000 kilometara.\\n\\nKontroli\u0161ite stavke sadr\u017eane
  u dinamici Plana servisiranja (npr. periodi\u010dno proveravajte nivoe te\u010dnosti,
  pritisak u pneumaticima itd.) pre 20.000 i izme\u0111u ovih krajnijih rokova za
  servisiranje.\\n\\nSvi Fiatovi dileri obavljaju Planirano servisiranje u skladu
  sa utvr\u0111enom dinamikom. Ukoliko se u toku predvi\u0111enih operacija ukaze
  potreba da se urade dodatne zamene ili popravke, one se mogu uraditi samo uz izri\u010ditu
  saglasnost vlasnika vozila. Ukoliko va\u0161e vozilo \u010desto koristite za vu\u010du,
  treba da smanjijete intervale izme\u0111u servisnih operacija.\\n\\nUPOZORENJE\\n\\nPoruka
  \u0107e se pojaviti na displeju kada preostane 2000 km do slede\u0107eg servisa.\\n\\nIntervale
  Planiranog servisiranja utvr\u0111uje proizvo\u0111a\u010d. Propust u po\u0161tovanju
  ove dinamike mo\u017ee da dovede do poni\u0161tavanja garancije.\\n\\nPreporu\u010dujemo
  vam da obavestite Dileru o svim malim nepravilnostima u radu, ne \u010dekaju\u0107i
  slede\u0107e servisiranje.\\n\\n## DINAMIKA PLANIRANOG SERVISIRANJA\\n\\n### BENZINSKE
