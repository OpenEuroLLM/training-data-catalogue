  Eurostat\\n\\nNezaposlenost je iznosila 11,1% u junu. U odnosu na maj 2015. godine
  nije bilo promjena. Me\u0111utim, zabilje\u017een je blazi pad u pore\u0111enju
  sa junom 2014. godine, kada je nezaposlenost iznosila 11,6%. Sto-\\n\\n---\\n\\n38
  Eurostat, http://ec.europa.eu/eurostat/documents/2995521/6940166/2-14082015-AP-EN.pdf/660ae7cb-bb7d-4905-a78f-64034b4b659b.\\n39
  ECB, Economic Bulletin, issue 5/2015.\\n40 Sezonski usla\u0111eni podaci ne uklju\u010duju
  korekcije radnih dana za Irsku, Slova\u010dku i Island.\\n41 Eurostat.\\n42 Eurostat.\\n\\npa
  nezaposlenosti mladih je iznosila 22,5% i bila je manja u odnosu na jun prethodne
  godine, kada je iznosila 23,6%.\\n\\nPrema rezultatima poslednjeg ECB-ovog istra\u017eivanja
  profesionalnih prognozera za tre\u0107i kvartal 2015. godine, kratkoro\u010dne i
  dugoro\u010dne procjene za rast BDP-a su ostale gotovo nepromijenjene. Projekcija
  za 2015. godinu iznosi 1,4%. Inflacija je prognozirana na nivou od 0,2% za 2015.
  godinu, zatim 1,3% i 1,6%, za 2016. i 2017. godinu. Prognoze inflacije su revidirane
  navi\u0161e u odnosu na rezultate istra\u017eivanja iz prethodnog kvartala, kada
  su iznosile 0,1%, 1,2% i 1,6% za 2015., 2016. i 2017. godinu, respektivno. Procjene
  nezaposlenosti za 2015. godinu su u posljednjem izvje\u0161taju revidirane nani\u017ee
  u svim posmatranim periodima.\\n\\nTabela 8.4\\n\\n| Rezultati Istra\u017eivanju
