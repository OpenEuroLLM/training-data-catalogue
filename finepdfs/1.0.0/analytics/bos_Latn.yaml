  Smailbegovi\u0107\"", "\"11. novembar 2002. godine\\n\\nG.-din. Markan Zelic\\nOpcinski
  nacelnik\\nOpcina Ljubuski\\nZupanija zapadnohercegova\u010dka\\nFederacija Bosne
  i Hercegovine\\nBosna i Hercegovina\\n\\nOHR-RRTF/LA/2002/598\\n\\nPo\u0161tovani
  gospodine Zelic\\n\\nObra\u0107am Vam se u vezi sa pismom od 23. januara 2002. godine,
  u kome u ime Op\u0107ine Ljubuski zahtijevate pismeno izuze\u0107e od Odluke Visokog
  predstavnika od 27. aprila 2000. godine kojom se zabranjuje dodjela imovine u dr\u017eavnom
  vlasni\u0161tvu, uklju\u010duju\u0107i imovinu u biv\u0161em dru\u0161tvenom vlasni\u0161tvu.\\n\\nKonkretno,
  tra\u017eite od ovog Ureda da dozvoli Op\u0107ini Ljubuski da na osnovu raspisanog
  natjecaja usmenim javnim nadmetanjem odrzanim 14.juna 2002, dodijeli neizgradjeno
  gradjevinsko zemlji\u0161te, uknji\u017eeno u zemlji\u0161nim knjigama kao katastarska
  \u010destica broj 110/1224, zvana \\\"Lovrec\\\", neizgradjeno gradjevinsko zemlji\u0161te,
  povr\u0161ine 1500 m\u00b2 \u2013 zemlji\u0161no knjizno ulozak broj 152, katastarske
  op\u0107ine Hardomilje, investitoru Rupcic Ivanu iz Hardomilja u svrhu izgradnje
  stambene zgrade.\\n\\nZemlji\u0161noknji\u017eni izvaci koje prila\u017eete ukazuju
  da se gore pomenuti katastarski broj odnosi na neizgradjeno zemlji\u0161te ozna\u010deno
  kao opstenarodna imovina sa dijelom 1/1.\\n\\nNa osnovu \u010dlanova 47. Zakona
  o gra\u0111evinskom zemlji\u0161tu, stav 2, I na osnovu clana 103, stav1, Statuta
  Opcine Ljubuski, kao i u skladu sa rezultatima javnog usmenog nadmetanja broj 06/6-31-72/01
  od 14.juna 2001, Op\u0107insko vije\u0107e Ljubuski je odobrilo predmetnu dodjelu
  zemlji\u0161ta svojim Rje\u0161enjem broj 01/2/-02-137/01 od 17. oktobra 2001. godine,
  dok je Slu\u017eba graditeljstva, prostornog ure\u0111enja i stambeno komunalnih
  poslova dala okvirne urbanisti\u010dke uvjete za formiranje: lokacije broj 1 za
  stambenu zgradu broj 05/1-23-404/99 od 29.marta 1999. Predmetnu dodjelu zemlji\u0161ta
  je tako\u0111e odobrio op\u0107inski javni pravobranilac, koji navodi u svom pravnom
  misljenju broj M-28/01 od 6. decembra 2001. godine da je predmetna dodjela zemlji\u0161ta
  utemeljena i u skladu sa zakonom. Opcinski sud u Ljubuskom svojim aktom broj Su:
  276/01 od 18. decembra 2001 potvr\u0111uje da se ne vodi spor u vezi sa dodijeljenim
  zemljestem, niti na su\u0111u niti kao gra\u0111ansko upravni spor. Prema Rje\u0161enju
  Op\u0107inskog vije\u0107a od 17. oktobra 2001. godine, investitor je duzan platiti
  naknadu za dodijeljeno zemlji\u0161te u iznosu 4.520 KM u korist Opcine Ljubuski.\\n\\nGospodin
  Ivan Rupcic iz Hardomilja biti \u0107e uknji\u017een u zemlji\u0161nim knjigama
  kao novi korisnik predmetnog zemlji\u0161ta po stupanju na snagu Rje\u0161enja Op\u0107inskog
  vije\u0107a.\\n\\nU svjetlu informacija koje ste dostavili, ovaj Ured ovla\u0161\u0107uje
  Op\u0107inu Ljubuski da dodijeli ranije pomenuto zemlji\u0161te u gore opisanu svrhu.\\n\\nKako
  je ovo izuze\u0107e dodijeljeno na osnovu valjanosti dokumentacije koju ste dostavili,
  ono \u0107e samo po sebi prestati va\u017eiti ako nadle\u017eni sud, kona\u010dnom
  i obavezuju\u0107om odlukom, dovede u pitanje vjerodostojnost ili ta\u010dnost ove
  dokumentacije, i/ili informacija koje ona sadr\u017ei.\\n\\nOvo izuze\u0107e je
  tako\u0111e dodijeljeno pod pretpostavkom i uslovom da gore imenovani korisnik,
  ako su on li\u010dno ili \u010dlanovi njegove naju\u017ee porodice korisnici napu\u0161tene/potra\u017eivane
  imovine, on i/ili \u010dlanovi njegove naju\u017ee porodice \u0107e, u roku ne du\u017eem
  od 60 dana od datuma Va\u0161eg prijema ove odluke, potpuno napustiti ovu imovinu.
  Dodatno, u navedenom roku, on mora dostaviti Va\u0161em uredu ta\u010dnu dokaznu
  dokumentaciju koju je odobrio nadle\u017eni stambeni organ, da su on li\u010dno
  i/ili \u010dlanovi njegove naju\u017ee porodice potpuno napustili svu takvu imovinu,
  te da imovina ostaje u useljivom stanju. Ako ovi uslovi nisu ispunjeni, ovo izuze\u0107e
  prestaje va\u017eiti neposredno po isteku navedenog roka.\\n\\nS po\u0161tovanjem,\\n\\n(potpisao)\\nAmbasador
