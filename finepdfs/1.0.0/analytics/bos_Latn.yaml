  5.3. Lokalna samouprava\\n\\nKvartalne izvje\u0161taje o planiranim i ostvarenim
  prihodima, planiranim i izvr\u0161enim rashodima i bud\u017eetskom zadu\u017eenju,
  shodno Zakonu o finansiranju lokalne samouprave, op\u0161tine su obavezne da dostavljaju
  Ministarstvu finansija, najkasnije u roku od 30 dana od dana isteka kvartala. S
  obzirom na to da je samo jedan broj op\u0161tina dostavio podatke, podaci za \u0161est
  mjeseci 2015. godine zasnivaju se na procjeni Ministarstva finansija.\\n\\n---\\n\\n\\\\(^{21}\\\\)
