  aprilskog istra\u017eivanja iz 2015. godine. Za barometar euro zone dugoro\u010dne
  projekcije su preuzete iz istra\u017eivanja iz aprila 2015. godine.\\n\\n** Kao
  procenat radne snage.\\n\\nIzvor: Preuzeto iz: The ECB Survey of Professional Forecasters,
  3rd Quarter of 2015, jul 2015\\n\\nDrugi kvartal 2015. godine posebno su obilje\u017eila
  de\u0161avanja na finansijskim tr\u017ei\u0161tima u Eurozoni, koja karakteri\u0161u
  zna\u010dajna kolebanja u posljednjim sedmicama juna i po\u010detkom jula. Fluktuacije
  na tr\u017ei\u0161tu su izazvane neizvijesnim de\u0161avanjima u pregovorima izme\u0111u
  Vlade Gr\u010dke i kreditora po pitanju prihvatanja restriktivnih mjera \u0161tednje.\\n\\nKretanja
  kamatnih stopa su bila prili\u010dno neujedna\u010dena u periodu od po\u010detka
  juna do sredine jula. Po\u010detkom juna, prinosi na dugoro\u010dne dr\u017eavne
  obveznice sa AAA rejtingom su zna\u010dajno porasli (po-\\n\\n---\\n\\n43 Eurostat.\\n44
  ECB, The ECB Survey of Professional Forecasters, 3rd Quarter of 2015, jul 2015\\n\\ngledati
  Grafik 8.8.). Pove\u0107anje u ovom periodu se mo\u017eda mo\u017ee, izme\u0111u
  ostalih faktora, povezati sa donekle ve\u0107im o\u010dekivanjima dugoro\u010dne
  inflacije. Nepovoljna kretanja tr\u017ei\u0161ne lividnosti dr\u017eavnih obveznica
  je tako\u0111e navodno povezana sa ve\u0107im prinosima u ovom periodu. U periodu
  od 10. juna do sredine jula, prosje\u010dni prinosi na 10-godi\u0161nje dr\u017eavne
  obveznice sa AAA rejtingom u Eurozoni su se smanjili na 1% uz malo \u0161ira pomjeranja
  u vrijeme poostre\u00f1enih tr\u017ei\u0161nih zabrinutosti u vezi ishoda referenduma
  u Gr\u010dkoj. Kratkoro\u010dno, haritije velikog broja dr\u017eava Eurozone su
  nastavile sa negativnim prinosima, a prinosi su se dalje smanjili u nekim slu\u010dajevima
  dovode\u0107i do naglog pada krivulje prinosu u ovim dr\u017eavama.\\n\\nKretanje
  cijena akcija u Eurozoni tako\u0111e je bilo pod uticajem de\u0161avanja u Gr\u010dkoj.
  U periodu izme\u0111u 5. i 26. juna Euro STOxx indeks je porastao 3%. Zbog neizvjesnosti
  ishoda gr\u010dkog referenduma na kraju juna i u prvoj sedmici jula cijene akcija
  u Eurozoni pale su 8,5% u finansijskom i oko 7% u nefinansijskom sektoru. Po zavr\u0161etku
  referenduma u Gr\u010dkoj situacija na tr\u017ei\u0161tima kapitala se stabilizovala.\\n\\nBoks
  8.1 - Ideja o osnivanju evropske unije tr\u017ei\u0161ta kapitala (CMU)\\n\\nProjekat
  osnivanja evropske bankarske unije podstakao je ideje za dalje ujedinjavanje unutra\u0161njeg
  tr\u017ei\u0161ta Eurozone i Evropske unije. Tako je, u cilju ja\u010danja integracije
  evropskog tr\u017ei\u0161ta razvijena ideja o formiranju unije tr\u017ei\u0161ta
  kapitala (CMU \u2013 Capital Markets Union). Za razliku od bankarske, unija tr\u017ei\u0161ta
  kapitala se ne odnosi samo na Eurozonu ve\u0107 na cijelu Evropsku uniju.\\n\\nKao
  \u0161to je poznato, bankarska unija se odnosi na ujedinjavanje bankarskog sektora
  Eurozone. Me\u0111utim, postavilo se pitanje da li je dovoljno raditi na ujedinjavanju
  i smanjivanju fragmentacije tr\u017ei\u0161ta samo u bankarskom sektoru. Osim toga,
  pojavilo se i niz drugih pitanja, poput pitanja kako omogu\u0107iti malim i srednjim
  preduze\u0107ima pristup kapitalu van bankarskog sektora, ako su ta tr\u017ei\u0161ta
  podijeljena i nisu regulasana usagla\u0161enim pravilima i sl.\\n\\nTako\u0111e,
  treba imati u vidu da bankarska unija, sa Jedinstvenim mehanizmom za sanaciju i
  likvidaciju koji je u fazi stvaranja, nije sistem koji mo\u017ee da funkcioni\u0161e
  potpuno zatvoreno i odvojeno od ostalih djelova finansijskog sistema. Evropska bankarska
  supervizija zavisi od standarda u drugim oblastima. Odgovor na ova pitanja je nastavak
  razvoja bankarske unije i postepeno osnivanje unije tr\u017ei\u0161ta kapitala na
  evropskom nivou.\\n\\nKlju\u010dni doprinosi CMU finansijskom sistemu EU su:\\n\\n---\\n\\n45
  ECB Economic Bulletin, 5/2015.\\n46 Isto\\n\\n\u2022 Diversifikovanije tr\u017ei\u0161te
  kapitala, koje \u0107e funkcionisati efikasnije i time bolje finansirati rast,\\n\u2022
  Unapre\u0111enje raspodjele rizika, \u010dime bi se pove\u0107ala otpornost i kapacitet
  apsorpcije \u0161okova u cijelom sistemu.\\n\\nRazvoj CMU ne bi samo poja\u010dao
  konkurentnost me\u0111u investitorima (investiciona unija) ili zajmoprincipima (finansijska
  unija), ve\u0107 i izme\u0111u finansijskih centara. CMU bi omogu\u0107ila finansijskim
  centrima da se direktno bore na tr\u017ei\u0161tu ostvaruju\u0107i koristi od svojih
  komparativnih prednosti. Na primjer: Velika Britanija se smatra jednim od najve\u0107ih
  svjetskih finansijskih centara, Luksemburg ima jednu od najrazvijenijih industrija
  investicionih fondova na svijetu, zatim najrazvijenija industrija penzionog osiguranja
  je u Holandiji i sli\u010dno.\\n\\nRazvoj CMU trebao bi da bude pra\u0107en uspostavljanjem
  mjera za suzbijanje potencijalnih novih rizika izvan bankarskog sektora i ve\u0107im
  nadzorom. Nacionalne institucije su klju\u010dne, uzimaju\u0107i u obzir njihovu
  specijalnost u doma\u0107im tr\u017ei\u0161tima kapitala i njihovu bliskost sa lokalnim
  ekonomskim u\u010desnicima, kao \u0161to su mala i srednja preduze\u0107a i finansijski
  posrednici. Tako\u0111e, da bi CMU mogla funkcionisati efikasno, bi\u0107e potrebno
  utvrditi podjelu odgovornosti izme\u0111u nadnacionalnih i nacionalnih institucija
  u Evropskoj uniji.\\n\\nU junu 2015. godine napravljen je veliki iskorak prema kreiranju
  CMU, otpo\u010dinjanjem sa radom Target-2Securities (T2S), jedinstvene platforme
  za poravnanje hartija od vrijednosti u Evropi, \u010diji je operater Eurosistem.
  Potpuna migracija na T2S platformu \u0107e biti sprovedena kroz par faza, a trebalo
  bi da bude okon\u010dana s po\u010detka 2017. kada se o\u010dekuje da na nju pre\u0111u
  posljednje centralne depozitarne agencije koje su sklopile sporazum za Eurosistemom.
  T2S \u0107e vr\u0161iti centralizovano poravnanje po principu \u201eisporuka po
  pla\u0107anju\u201c (delivery-versus-payment, DvP), u novcu (pasivi, tj. knjigama)
  centralne banke. Najopiplijiviji benefit je to \u0161to \u0107e cijena usluga poravnanja
  biti ista za nacionalne i prekograni\u010dne transakcije, uz identi\u010dan na\u010din
  i efikasnost procesuiranja, tj. jedinstven set standarda, pravila i tarifa. To \u0107e
  u praksi voditi zna\u010dajnom padu cijena poravnanja za prekograni\u010dne transakcije,
  uz ve\u0107u bezbjednost, a u krajinjem uticati na ja\u010du konkurenciju, stabilnost
  i harmonizaciju u finansijskom sistemu Evrope.\\n\\nPrema posljednjim dostupnim
  podacima Eurostata, na kraju prvog kvartala 2015. godine, dr\u017eavni dug Eurozone
  je iznosio 92,9% BDP-a i bio je ve\u0107i u odnosu na kraj 2014. godine kada je
  iznosio 92% BDP-a. Najve\u0107i dr\u017eavni dug na kraju prvog kvartala u Eurozoni
  je zabilje\u017een u Gr\u010dkoj, u iznosu od 168,8% BDP-a.\\\\(^{47}\\\\)\\n\\nBud\u017eetski
  deficit u Eurozoni iznosio je 2,3% BDP-a na kraju prvog kvartala 2015. godine, \u0161to
  predstavlja smanjenje u pore\u0111enju sa posljednjim kvartalom 2014. godine, kada
  je deficit bud\u017eeta iznosio 2,5% BDP-a.\\\\(^{48}\\\\)\\n\\nGodi\u0161nji rast
  kredita odobrenih sektoru stanovni\u0161tva iznosio je 1,7% u julu, dok je u maju
  2015. godine iznosio 1,4%. Godi\u0161nji rast kredita odobrenih nefinansijskom sektoru
  iznosio je 0,1% i bio je nepromijenjen u odnosu na rast u maju.\\\\(^{49}\\\\)\\n\\nECB
  uspje\u0161no sprovodi program \u00abkvantitativnog popu\u0161tanja\u00bb, koje
  je zapo\u010deto u martu 2015. godine. Indikatori inflacije pokazuju znake oporavka,
  kreditiranje nefinansijskog sektora je u porastu i\\n\\n\\\\(^{47}\\\\) Eurostat\\n\\\\(^{48}\\\\)
  Eurostat\\n\\\\(^{49}\\\\) ECB, https://www.ecb.europa.eu/press/pdf/md/md1506.pdf\\n\\no\u010dekivanja
  su da \u0107e inflacija dosti\u0107i targetirani nivo od ispod 2%, ali blizu 2%
  do septembra 2016. godine.\\n\\nSavjet ECB-a je u julu donio odluku o zadr\u017eavanju
  postoje\u0107ih nivoa kamatnih stopa: na glavne operacije refinansiranja od 0,05%,
  na prekono\u0107ne pozajmice kod centralne banke od 0,3% i na prekono\u0107ne depozite
  od -0,2%.\\n\\n**Boks 8.2 - Evropski monetarni fond (EMF)**\\n\\nZa drugi kvartal
  2015. godine, karakteristi\u010dno je i ponovno aktiviranje ideje o formiranju **Evropskog
  monetarnog fonda** (EMF). Na konferenciji \u201cKa arhitekturi u Eurozoni kojoj
  mo\u017eemo vjerovati\u201d, koja je odr\u017eana u Firenci u maju 2015. godine
  Portugalija je pokrenula inicijativu za osnivanje EMF-a, koji bi u budu\u0107nosti
  rje\u0161avao probleme zemalja Eurozone, u slu\u010daju da zapadnu u finansijske
  te\u0161ko\u0107e. Ubrzo posle Portugalije i Italija je pokrenula pitanje osnivanja
  EMF-a.\\n\\nOvaj fond bi fakti\u010dki preuzeo ulogu koju je Me\u0111unarodni monetarni
  fond imao u Evropskoj du\u017eni\u010dkoj krizi. Fond bi bio uskladen sa nezavisnom
  monetarnom politikom koju vodi ECB. EMF bi bio stalni mehanizam za pru\u017eanje
  tehni\u010dke i finansijske podr\u0161ke pojedina\u010dno zemljama \u010dlanicama
  kada se nalaze u lo\u0161im finansijskim okolnostima, pod odgovaraju\u0107im uslovima.
  Mehanizam bi trebao biti \u0161to vi\u0161e nezavisan u odnosu na vlade dr\u017eava
  po pitanju dono\u0161enja odluka. Fond bi morao imati obezbje\u0111ene adekvatne
  tehni\u010dke i finansijske kapacitete kako bi mogao reagovati brzo i sa dovoljno
  informacijama. EMF bi bila institucija koja obavlja nadzor i prati napredak programa
  prilagodavanja, \u010dime bi se smanjila uloga Evropske centralne banke i Me\u0111unarodnog
  monetarnog fonda. Ovakvim rasporedom snaga Evropska centralna banka bi imala ulogu
  \u201cposmatra\u010da\u201d, a u\u010de\u0161\u0107e MMF-a bi bilo svedeno na \u201cneobavezno\u201d.\\n\\nDalje,
  EMF bi trebalo da raspola\u017ee sa dovoljno finansijskih sredstava kako bi mogao
  da finansira nacionalne strukturne reforme sa efektima koji \u0107e se pozitivno
  odraziti na cijelu Eurozonu, kao \u0161to su investicioni projekti usmjereni na
  modernizaciju infrastrukture od koje zavisi jedinstveno tr\u017ei\u0161te.\\n\\nNa
  kraju, EMF bi trebalo da da doprinos u ja\u010danju funkcije absorbovanja \u0161okova
  i ja\u010danja otpornosti Eurozone kao sistema. Unapre\u0111enje funkcije apsorpcije
  \u0161okova na neki na\u010din \u0107e pomo\u0107i prekograni\u010dnu raspodjelu
  rizika i time smanjiti ekonomske i socijalne tro\u0161kove prilagodavanja zemalja
  koje se uklju\u010dene.\\n\\nIna\u010de, sama ideja o formiranju EMF prvi put je
  pokrenuta 2010. godine, od strane Njema\u010dke i Francuske. Preciznije, Njema\u010dka
  je predo\u010dila, a Francuska odmah podr\u017eala inicijativu za osnivanje fonda,
  kao evropskog ekvivalenta Me\u0111unarodnom monetarnom fondu, obja\u0161njavaju\u0107i
  da je Eurozoni potrebna institucija s iskustvom i sli\u010dnih mo\u0107i kao \u0161to
  ih ima MMF.\\n\\nKriti\u010dari ideje EMF-a tvrde da njegovo osnivanje ne bi oja\u010dalo,
  ve\u0107 oslabilo EU.\\n\\nU\u010destale diskusije o ovoj temi tokom 2015. godine
  upu\u0107uju na zaklju\u010dak da \u0107e vrijeme koje je pred nama donijeti odgovor
  kakva \u0107e biti sudbina ove ideje i kako \u0107e se ta ideja razvijati nakon
  najnovijih inicijativa.\\n\\n---\\n\\n50 ECB, https://www.ecb.europa.eu/press/key/date/2015/html/sp150727.en.html\\n51
  ECB, https://www.ecb.europa.eu/press/pr/date/2015/html/pr150716.en.html\\n52 Izvori
  za tekst: European University Institute, Towars a Eurozone Architecture We can Trust,
  retrieved from: https://stateoftheunion.eui.eu/TOWARDS-A-EUROZONE-ARCHITECTURE-WE-CAN-TRUST
  and http://www.welt.de/politik/deutschland/article6668719/Schaeuble-liebaeugelt-mit-einem-EU-Waehrungsfonds.html
  http://www.thelocal.it/20150804/italy-in-favour-of-a-european-monetary-http://lexicon.ft.com/Term?term=European-Monetary-Fund\\n\\n8.1.3.
  Japan\\n\\nPrivreda Japana je nakon pozitivnih kretanja u prethodna dva kvartala,
  tokom drugog kvartala 2015. godine zabilje\u017eila pad od 0,4% u odnosu na prvi
  kvartal 2015. Pad privredne aktivnosti se najvi\u0161e odnosio na pad privatne potro\u0161nje
  a zatim i izvoza roba i usluga, uprkos slabljenju valute. Doma\u0107e investicije
  su rasle kao i javna potro\u0161nja. Indeks pouzdanosti potro\u0161nje za stanovni\u0161tvo
  je stagnirao tokom ovog kvartala. Prema prognozama iz MMF-ovog izvje\u0161taja o
  \u201eIzgledima globalne ekonomije\u201c iz jula o.g., stopa rasta ekonomije Japana
  za ovu godinu je revidirana nani\u017ee za 0,2 p.p, pa prognozirana stopa iznosi
  0,8%.\\n\\nGrafik 8.9\\n\\n| Kvartalni BDP, u % |\\n|-------------------|\\n| Q1
  2011. | -1,9 |\\n| Q2 2011. | -0,7 |\\n| Q3 2011. | 2,7 |\\n| Q4 2011. | 0,2 |\\n|
  Q1 2012. | 1 |\\n| Q2 2012. | -0,5 |\\n| Q3 2012. | -0,4 |\\n| Q4 2012. | 1,3 |\\n|
  Q1 2013. | 0,6 |\\n| Q2 2013. | 0,6 |\\n| Q3 2013. | -0,2 |\\n| Q4 2013. | 1,1 |\\n|
  Q1 2014. | -1,9 |\\n| Q2 2014. | -0,3 |\\n| Q3 2014. | 0,3 |\\n| Q4 2014. | 1,1
  |\\n| Q1 2015. | -0,4 |\\n\\nIzvor: Vlada Japana\\n\\nIndustrijska proizvodnja i
  korporativni profiti bilje\u017ee rast. Nezaposlenost je blago rasla u aprilu, ali
  je u maju i julu bila ne\u0161to ni\u017ea. Stopa nezaposlenosti bilje\u017ei opadaju\u0107i
  trend jo\u0161 od 2009. godine i izme\u0111u ostalog ukazuje na visoku konkurentnost
  japanske privrede.\\n\\nGodi\u0161nja stopa inflacije je zna\u010dajno smanjena,
  s tim da je mjese\u010dna inflacija bila pozitivna u aprilu i maju o.g. Pad cijena
  je bio najizra\u017eeniji kod kategorija stanovanja, energenata i komunikacija.
  Prema ministarstvu ekonomije, smanjena potro\u0161nja je mogu\u0107e uzrokovana
  rastom cijena hrane, \u0161to je dijelom uzrokovano slabijim jenom. U prilog ovakvom
  kretanju cijena treba pomenuti i pove\u0107anje poreza u drugom kvartalu 2014. godine,
  koje je imalo za efekat zna\u010dajan rast cijena.\\n\\nIndeks Nikkei 225 je tokom
  drugog kvartala nastavio rastu\u0107i trend iz prethodnog perioda, ali je rast bio
  manjeg intenziteta nego u prvom kvartalu o.g. (5,4%). Rast indeksa je po\u010detkom
  tre\u0107eg kvartala prili\u010dno zaustavljen.\\n\\n8.2. Zemlje u usponu\\n\\nPrema
  prognozama iz julskog izvje\u0161taja MMF-a, zemlje u usponu \u0107e u ovoj godini
  rasti po ni\u017eim stopama nego tokom 2014. godine. MMF je prognozirao stopu rasta
  od 4,2% za 2015. godunu (revidirana nani\u017ee za 0,1 p.p. u odnosu na april),
  dok stopa za 2016. godinu iznosi 4,7%. Usporavanje rasta ekonomija u usponu se reflektovalo
  i kroz lo\u0161ije performanse tr\u017ei\u0161nih indeksa, koji su ve\u0107 du\u017ei
  period daleko ispod dinamike indeksa na razvijenim tr\u017ei\u0161tima. Geopoliti\u010dka
  kretanja na istoku Ukrajine bi mogla da nastave da predstavljaju problem za taj
  region, a prvenstveno dalji tok ekonomskih sankcija Rusije. Najve\u0107i izazov
  ove grupe zemalja je uspostavljanje dugoro\u010dnog i stabilnog rasta, \u0161to
  kod mnogih zemalja iziskuje strukturne promjene. Takode, pove\u0107anje doma\u0107e
  tra\u017enje i oporavak eksterne tra\u017enje sa fokusom na razvijena tr\u017ei\u0161ta
  trebalo bi da omogu\u0107e dinami\u010dniji rast ovim ekonomijama.\\n\\n---\\n\\n53
  Anualizovana kvartalna stopa je iznosila -1,6%.\\n\\n8.2.1. Rusija\\n\\nPrema prvim
  podacima ruskog zavoda za statistiku, ekonomija Rusije je u drugom kvartalu 2015.
  godine ostvarila pad od 4,6%54, \u0161to je znatno ve\u0107i nego u prvom kvartalu,
  kada je pad iznosio 2,2%.\\n\\nPrema najnovijim prognozama MMF-a i Svjetske banke,
  negativna stopa rasta je smanjena za ovu godinu na -3,4% (za 0,4 p.p.) odnosno -2,7%
  (za 0,2 p.p.). Prema navedenim me\u0111unarodnim institucijama, ruska privredna
  aktivnost bi trebalo da u 2016. godini ostvari znatno bolje rezultate od prognoza
  za ovu godinu, 0,7% prema SB55, odnosno 0,2% prema MMF-u.\\n\\nGeopoliti\u010dka
  de\u0161avanja su u ovom kvartalu imala veliki uticaj na ekonomiju Rusije. Potro\u0161nja
  stanovni\u0161tva je u padu, a depreciacija rublje, rast cijena (15,3%), pad zarada
  i pad kreditiranja su dodatno uticali na kupovnu mo\u0107. Minimalna potro\u0161a\u010dka
  korpa je u julu o.g. ve\u0107a za 14,3% u odnosu na decembar 2014. Zarade su na
  kraju kvartala nominalno vi\u0161e, ali su realno ni\u017ee u odnosu na uporedni
  period 2014. Stopa nezaposlenosti je blago porasla u odnosu na pro\u0161logodi\u0161nji
  prosjek, ali i dalje je relativno niska, pa je na kraju juna iznosila 5,4%.\\n\\nSlabije
  investicije su rezultat negativnih izgleda za cijelokupnu ekonomiju, povi\u0161enih
  cijena uvoznih dobara, slabijih korporativnih zarada, slabijeg pristupa me\u0111unarodnim
  kapitalnim tr\u017ei\u0161tima i te\u017eim uslovima kreditiranja. Vlada namjerava
  da implementira antirecesione mjere koje bi u narednom periodu potpomogle investiranje.\\n\\nIndustrijska
  proizvodnja je u drugom kvartalu ostvarila pad od 4,9% u odnosu na isti period 2014.
  Pad izvoza \u0107e biti slabije izra\u017een zbog fluktuiraju\u0107eg kursa56 rublje
  pa se o\u010dekuje da \u0107e neto izvoz imati pozitivan doprinos godi\u0161njem
  rastu proizvodnje. Rublja je, uslovljena kretanjem cijena nafte, tokom aprila i
  do polovine maja je aprecirala u odnosu na dolar da bi od tog momenta deprecirala,
  \u0161to je posebno bilo izra\u017eeno u prvim mjesecima tre\u0107eg kvartala o.g.
  RTS indeks57 je tokom ovog kvartala tako\u0111e pratio kretanja cijene nafte i vrijednosti
  rublje. Razvoj ekonomske situacije \u0107e u velikoj mjeri zavisiti od cijena energenata,
  pri \u010demu je trenutno ve\u0107a vjerojatno\u0107a za scenario da \u0107e cijene
  nafte ostati ispod 60 USD.\\n\\n---\\n\\n54 U odnosu na isti kvartal prethodne godine.\\n\\n55
  Treba imati u vidu da su prognoze SB bazirane na podacima prije najnovijeg pada
  cijena nafte i slabljenja rublje, te se mo\u017ee o\u010dekivati korekcija prognoza
  u narednom periodu.\\n\\n56 Centralna banka Rusije je odlu\u010dila da pove\u0107a
  fleksibilnost kursa tako \u0161to ne\u0107e intervenisati, odnosno pove\u0107avati
  operacije na tr\u017ei\u0161tu, ukoliko valuta pre\u0111e granice \\\"operativnog
  fluktuiranja\\\" u poredenju sa dvovalutnom korptom (euro i dolar). Odluka je stupila
  na snagu 05.11.2014.\\n\\n57 RTSI (\\\"Russian Trading System Cash Index\\\") \u2013
  indeks pedeset najve\u0107ih ruskih akcija na moskovskoj berzi\\n\\nCentralna banka
  je i u ovom kvartalu dva puta mijenjala referentnu kamatnu stopu, koja je na kraju
  juna iznosila 11,5%. Trenutna stopa je 11,0%. Ciljana stopa inflacije za 2017. godinu
  iznosi 4%.\\n\\nEkonomske sankcije su ve\u0107 imale efekta na privredu Rusije u
  pogledu promjene na strukturu privrede i njene interakcije sa me\u0111unarodnim
  okru\u017eenjem. S obzirom da je privreda prili\u010dno bazirana na izvoz energenata,
  cjenovne fluktuacije \u0107e nastaviti da budu ote\u017eavaju\u0107i faktor. Najve\u0107i
  rizik \u0107e u narednom periodu predstavljati nedostatak investicija i kretanja
  u finansijskom sektoru.\\n\\n8.2.2. Kina\\n\\nUsporavanje ekonomske aktivnosti u
  Kini je evidentno ve\u0107 du\u017ei period. Prema zvani\u010dnim podacima za drugi
  kvartal 2015. godine, BDP je rastao po stopi od 7% u odnosu na isti kvartal prethodne
  godine, \u0161to je bolje od tr\u017ei\u0161nih o\u010dekivanja\\\\(^{58}\\\\).
  U odnosu na prvi kvartal 2015. rast je iznosio 1,7%. Prognoze MMF-a\\\\(^{59}\\\\)
  o rastu kineske ekonomije su ostale nepromijenjene, odnosno prognozirani rast za
  2015. je 6,8%, dok je za 2016. godinu 6,3%. Prognoze Svjetske banke tako\u0111e
  ukazuju na usporavanje rasta, ali su stope ne\u0161to vi\u0161e. Na usporavanje
  ekonomije je najvi\u0161e uticala slabija doma\u0107a potra\u017enja i neravnote\u017ee
  na tr\u017ei\u0161tu nekretnina, kao i me\u0111unarodna tr\u017ei\u0161ta, kroz
  uticaj na kineski izvoz i industriju.\\n\\nRizik od deflacji i realni rast kamata
  na kredite su uslovile da centralna banka snizi referentnu kamatnu stopu - posljednji
  put u julu (4,85%), \u0161to je je drugi put u istom kvartalu, a \u010detvrti put
  od novembra 2014. Inflacija je na mjese\u010dnom nivou tokom kvartala bila negativna
  ili nulta, dok je na godi\u0161njem nivou u julu bila 1,4%. Centralna banka je u
  aprilu snizila obaveznu rezervu za jedan p.p. kako bi dalje pomogla strukturno prilagodavanje
  finansijskih institucija, pomogla malim i srednjih preduze\u0107ima i djelovima
  privrede koji nisu adekvatno razvijeni itd.\\n\\nVlada i centralna banka Kine su
  krenule u podsticaj ekonomije opse\u017enim fiskalnim i monetarnim mjerama u smislu
  pove\u0107anja potro\u0161nje putem javnih projekata, stimulisanja kreditiranja,
  podsticanja \u201epravilnog\u201c razvoja tr\u017ei\u0161ta nekretni-\\n\\n\\\\(^{58}\\\\)
  Rojters 6,9%\\n\\n\\\\(^{59}\\\\) MMF-ov izvje\u0161taj o \u201eIzgledima globalne
  ekonomije\u201c, jul 2015, a\u017eurirano izdanje.\\n\\nna, smanjenja obavezne rezerve
  i uvodenja poreskih olak\u0161ica\\\\textsuperscript{60}. Industrijska proizvodnja
  je na kraju kvartala ostvarila blagi rast dok trgovina na malo i investicije stagniraju
  odnosno padaju.\\n\\n\u0160angajski SSE kompozitni indeks je u julu o.g. krahirao,
  pa je pad do kraja kvartala iznosio 17,2%, a nastavio se i u tre\u0107em kvartalu.\\n\\n\\\\subsection*{8.2.3.
  Turska}\\n\\nProjekcija rasta ekonomske aktivnosti u Turskoj za 2015. godinu, prema
  MMF-u, iznosi 3,1%. Turska ekonomija je tokom prvog kvartala 2015. godine rasla
  po stopi od 2,4%, odnosno 2,3% u poredenju s istim kvartalom prethodne godine. Najve\u0107i
  doprinos rastu realne stope BDP-a su ostvarili potro\u0161nja doma\u0107instava
  i potro\u0161nja dr\u017eave. Izvoz roba i usluga je manji nego tokom upore\u0111enog
  perioda 2014. godine, pri \u010demu je uvoz zna\u010dajno porastao drugi kvartal
  za redom.\\n\\nIndustrijska proizvodnja ostvaruje stabilan rast. Nakon ogromnih
  investicija 2011. godine, do\u0161lo je do zna\u010dajnog pada u narednim godinama,
  ali posljednji podaci ukazuju na blagi rast, koji bi u narednom periodu trebalo
  da bude odr\u017eiv. Dr\u017eavna potro\u0161nja je kori\u0161\u0107ena kao pomo\u0107
  tokom volatilnih perioda, uglavnom na polju infrastrukturnih projekata. Nezaposlenost
  je na kraju maja 2015. iznosila 9,3%, i u blagom je padu od po\u010detka godine.
  Inflacija u Turskoj je prili\u010dno visoka, a na kraju juna o.g. godi\u0161nja
  stopa je iznosila 7,2%, uz silazni trend.\\n\\nKurs turske lire je tokom kvartala
  bio relativno ujedna\u010den, iako, gledano iz ugla posljednjih dvanaest mjeseci,
  kurs je slabio u odnosu na dolar. Pored izlo\u017eenosti uticajima me\u0111unarodnih
  kapitalnih tokova, politi\u010dka nestabilnost i sigurnosna situacija u regionu
  su uticali da turska lira dodatno izgubi na vrijednosti, \u0161to je posebno bilo
  izra\u017eeno u tre\u0107em kvartalu.\\n\\n\\\\subsection*{8.3. Zemlje okru\u017eenja}\\n\\nGeneralno
  posmatrano, u ekonimijama regiona su se nastavile neke negativne tendencije iz prethodnog
  perioda. To se najbolje moglo vidjeti kroz prizmu javnih finansija, gdje pored drasti\u010dnih
  smanjenja rashoda, \u201epunjenja\u201c bud\u017eeta zapravo predstavljaju klju\u010dni
  problem fiskalne politike. Izvjesno je da se smanjenje javne potro\u0161nje odra\u017eava
  na BDP, ali su\u0161tinski problem su strukturne neravnote\u017ee ovih ekonomija,
  koje bilje\u017ee visoke stope nezaposlenosti, nelikvidnosti, visoke stope nekvalitetnih
  kredita, nekonkurentnosti, niske nivoje produktivnosti, nedovoljne ili spore realizacije
  stranih direktnih investicija itd.\\n\\n\\\\textsuperscript{60} Izvje\u0161taj 30.04.2015.
  godine, Politbiro NRK.\\n\\n8.3.1. Srbija\\n\\nRealni rast privredne aktivnosti
  je u drugom kvartalu 2015. godine, prema preliminarnoj ocjeni, iznosio 0,9%, \u0161to
  je prvi pozitivni kvartal nakon pet uzastopnih negativnih kvartala.\\n\\nPrema anketi
  o radnoj snazi, nezaposlenost je u prvom kvartalu o.g. iznosila 19,2% i bilje\u017ei
  zna\u010dajan rast od 2,4 p.p. u odnosu na prethodni kvartal. Prosje\u010dna zarada
  u julu 2015. godine, iako ve\u0107a na mese\u010dnom nivou, bila je nominalno i
  realno manja za 1,1% odnosno 2,9% od prosje\u010dne zarade ispla\u0107ene u julu
  2014. godine.\\n\\nIndustrijska proizvodnja pokazuje pozitivne pomake, a prema procjenama
  NBS-a izvoz \u0107e u II kvartalu imati znatno ve\u0107i rast od rasta uvoza. Godi\u0161nja
  stopa inflacije je u julu iznosila 1,9%, \u0161to je i dalje ispod donje granice
  dozvoljenog odstupanja od cilja, a prema projekcijama Narodne banke Srbije ista
  \u0107e se u granice dozvoljenog odstupanja od cilja vratiti u drugoj polovini godine.
  Bazna inflacija je relativno niska, a dijelom je rezultat niske agregatne tra\u017enje
  i niske inflacije na globalnom nivou.\\n\\nDeficit teku\u0107eg ra\u010duna platnog
  bilansa smanjen je u drugom kvartalu sa 7,2% na 2,6% BDP-a. Deficit republi\u010dkog
  bud\u017eeta je tako\u0111e smanjen u drugom kvartalu i iznosio je 0,5% BDP-a. Javni
  dug Republike Srbije iznosio je 73,8% BDP-a, \u0161to je pad od 1,3 p.p. u odnosu
  na prvi kvartal. Rast javnog duga predstavlja veliki rizik s obzirom da je dug u
  2008. godine iznosio svega 28,3% BDP-a.\\n\\nKreditni rejting Srbije je potvr\u0111en
  u januaru o.g. i od agencije Standard and Poor\u2019s i od agencije Fitch na BB-/negativni
  izgledi, odnosno B+/stabilni izgledi, respektivno. Rejting je potvr\u0111en od agencije
  Fitch u julu.\\n\\n---\\n\\n61 Procjena Narodne banke Srbije.\\n\\n8.3.2. Hrvatska\\n\\nEkonomija
  Hrvatske je u prvom kvartalu 2015. godine ostvarila rast od 0,5% u odnosu prvi kvartal
  prethodne godine. Prema projekcijama MMF-a, ekonomija Hrvatske bi u 2015. trebalo
  da ostvari rast od 0,5%, dok bi u 2016. rast iznosio 1,0%. Sli\u010dne prognoze
  je dala i Evropska komisija.\\n\\nTabela 8.5\\n\\n| Prognoze Evropske komisije |
  2013. | 2014. | 2015. | 2016. |\\n|---------------------------|-------|-------|-------|-------|\\n|
  BDP, %                    | -0,9  | -0,4  | 0,3   | 1,2   |\\n| Inflacija, %              |
  2,3   | 0,2   | 0,1   | 1,3   |\\n| Nezaposlenost, %         | 17,3  | 17,3  | 17,0  |
  16,6  |\\n| Bud\u017eetski deficit (% BDP-a) | -5,4  | -5,7  | -5,6  | -5,7  |\\n|
  Javni dug (% BDP-a)      | 80,6  | 85,0  | 90,5  | 92,9  |\\n| Bilans teku\u0107eg
  ra\u010duna (% BDP-a) | 0,1   | 0,6   | 2,0   | 3,0   |\\n\\nIzvor: Ekonomske prognoze,
  prolje\u0107e 2015\\n\\nFinalna potro\u0161nja je u prvom kvartalu o.g. ostvarila
  pozitivan uticaj na stopu realnog rasta BDP-a, pri \u010demu je potro\u0161nja doma\u0107instava
  imala najsnazniji pozitivni uticaj na kretanje privredne aktivnosti u prvom kvartalu.
  Veliki doprinos rastu BDP-a ostvaren je kroz rast izvoza roba i usluga. Bruto investicije
  u fiksnii kapital su pak imale negativan doprinos, kao i tokom cijele prethodne
  godine.\\n\\nGodi\u0161nja stopa inflacije\\\\(^{62}\\\\) je u maju i junu 2015.
  bila nulta. Prosje\u010dne neto zarade su u maju o.g. bile nominalno i realno ve\u0107e
  za 3,3% u odnosu na maj 2014. Stopa nezaposlenosti, koja u Hrvatskoj ima izra\u017eene
  sezonske oscilacije, je na kraju juna iznosila 16,1%.\\n\\nUkupna industrijska proizvodnja
  je tokom drugog kvartala o.g. imala pozitivna kretanja u odnosu na drugi kvartal
  2014. godine. Industrijska proizvodnja je za prvih pola godine bila 1,4% ve\u0107a
  nego tokom uporednih perioda prethodne godine. Me\u0111utim, to je i dalje daleko
  ispod predkriznog nivoa. Sli\u010dno je sa gra\u0111evinarstvom, koje ima gotovo
  konstantan pad od nastanka krize s tim da su stope pada u posljednjem periodu manje.
  S druge strane, dolasci i no\u0107enja turista su u osjetnom porastu.\\n\\n8.3.3.
  Makedonija\\n\\nEkonomija Makedonije je nastavila da raste po stabilnim stopama,
  pa je rast u prvom kvartalu iznosio 3,2%, potpomognut finalnom potro\u0161njom koja
  je rasla 1,6%. Izvoz roba i usluga je nominalno porastao 13,4% dok je rast uvoza
  bio 5,5%.\\n\\nPrema projekcijama MMF-a, ekonomija Makedonije bi trebalo da raste
  po stopi od 3,8% u 2015. odnosno 3,9% u 2016. godini, a niska inflacija bi trebalo
  da ostane i u narednom periodu. O\u010dekivanja Evropske komisije su da \u0107e
  generalno pozitivni trendovi nastaviti u narednom periodu pa tako prognoza EK za
  BDP u 2015. iznosi 3,8%, a u 2016. godini 3,9%. To \u0107e biti potpomognuto stabilnim
  rastom privatne i javne potro\u0161nje i neto izvozom.\\n\\n---\\n\\n\\\\(^{62}\\\\)
  Indeks potro\u0161a\u010dkih cijena.\\n\\nGodi\u0161nja stopa inflacije je tokom
  sva tri mjeseca drugog kvartala bila negativna. Industrijska proizvodnja je za prvih
  \u0161est mjeseci ostvarila rast od 0,8% u odnosu na isti period prethodne godine.\\n\\nDeficit
  teku\u0107eg ra\u010duna je u 2014. bio 1,3% BDP-a, a prema MMF-u, u narednom periodu
  je projektovan ve\u0107i deficit. S druge strane, deficit prema EK \u0107e biti
  tek 0,1 p.p ve\u0107i u 2015, tj. 1,4%.\\n\\nZarade su u maju 2015. godine ostvarile
  nominalni i realni rast u odnosu na nivo iz uporednog perioda prethodne godine.
  Ipak, ogroman problem je visoka stopa nezaposlenosti koja je u prvom kvartalu iznosila
  27,3%.\\n\\n### 8.4. Kamatne stope centralnih banaka\\n\\nU situaciji i dalje skromnog
  ekonomskog rasta, a posebno uzimaju\u0107i u obzir o\u010dekivanja, centralne banke
  vode\u0107ih ekonomija su nastavile sa politikom rekordno niskih kamatnih stopa
  i u drugom kvartalu 2015. godine.\\n\\nSavjet ECB-a je uslijed deflatornih pritisaka
  i intenziviranja rizika od pada ekonomske aktivnosti tokom 2014. u dva navrata snizavao
  referentnu kamatnu stopu, koja od septembra 2014. iznosi 0,05%, \u0161to je rekordno
  nizak nivo. Istovremeno, kamatna stopa na prekono\u010dne depozite sna\u017eena
  je na -0,2%. U martu o.g. ECB je po\u010dela da kupuje i eurske obveznice javnog
  sektora, kao dio pro\u0161irenog programa kupovine aktive. FED dr\u017ei svoju ciljanu
  stopu federalnih fondova nepromijenjenom jo\u0161 od decembra 2008. godine na nivou
  0-0,25%, a sa posljednjih sjednica Federalnog komiteta za operacije na otvorenom
  tr\u017ei\u0161tu u drugom kvartalu 2015. godine ta je stopa potvr\u0111ena. Uprkos
  \u0161pekulacijama na tr\u017ei\u0161tu oko podizanja referentne stope, FED smatra
  da iako se ekonomska situacija pobolj\u0161ava, jo\u0161 nijesu stvoreni uslovi
  za takvu promjenu smjera monetarne politike.\\n\\n**Grafik 8.16**\\n\\nReferentne
  kamatne stope centralnih banaka, %, 2013-Q2 2015.\\n\\nI banke Engleske i Japana
  nastavljaju da dr\u017ee svoje referentne kamatne stope na izuzetno niskim nivoima,
  od 0,5%, odnosno 0-0,1%, jo\u0161 od marta 2009. godine, odnosno decembra 2008.
  godine, respektivno. Pritom Banka Japana je tokom II kvartala uvjeravala da \u0107e
  i dalje sprovoditi mjere u skladu sa op\u0161tom politikom ja\u010danja privrede
  i rasta inflacije, koja je u ovom kvartalu, ipak, znatno ispod o\u010dekivanje i
  ispod onih stopa koje su zabilje\u017eene od po\u010detka implementacije mjera.\\n\\nReferentne
  me\u0111ubankarske stope, EONIA i Euribor su tako\u0111e bile na rekordno niskim
  nivoima; EONIA se u 2015. kretala u oblasti izme\u0111u -0,01% i -0,14%; tromjese\u010dni
  EURIBOR je tako\u0111e negativan i trenutno iznosi oko -0,023%. S druge strane,
  \u0161estomjese\u010dni LIBOR na ameri\u010dki dolar iznosio je oko 0,49% na kraju
  jula i ima rastu\u0107i trend, \u0161to je velikim dijelom uzrokovano tr\u017ei\u0161nim
  o\u010dekivanjima da \u0107e FED podi\u0107i svoju referentnu stopu.\\n\\n8.5. Kretanje
  deviznih kurseva\\n\\nEuro je aprecirao tokom drugog kvartala 2015. godine u odnosu
  na dolar (3,8%) i jen (5,8%) dok je u odnosu na funtu (2,1%) i franak (0,2%) deprecirao.\\n\\nNa
  grafiku 8.18. prikazan je rast dolara u odnosu na ostale valute, gdje se mo\u017ee
  vidjeti efekat promjene FED-ove monetarne politike od sredine pro\u0161le godine,
  odnosno efekat monetarnih politika ECB-a i BJ.\\n\\nGrafik 8.17\\n\\nEuro prema
  drugim valutama, 2013-Q2 2015, 01.01.2013=100 (rast/pad ozna\u010dava ja\u010danje/slabljenje
  eura)\\n\\nGrafik 8.18\\n\\nUSD prema drugim valutama, 2013-Q2 2015, 01.01.2013=100
  (rast/pad ozna\u010dava ja\u010danje/slabljenje USD)\\n\\nIzvor: Blumberg, kalkulacije
  CBCG\\n\\nNAJZNA\u010cAJNIJI DOGA\u0110AJI\\n\\n09\\n\\nNajva\u017eniji doga\u0111aji
  u drugom kvartalu 2015. godine\\n\\nApril\\n\\nVlada je usvojila smjernice makroekonomsk\u0435
  i fiskalne politike za period do 2018. godine i donijela zaklju\u010dak da se intenzivno
  nastave mjere racionalizacije, odnosno \u0161tednje.\\n\\nSavjet Centralne banke
  (CBCG) donio je rje\u0161enje o izdavanju dozvole za rad turskoj banci \u201cZiraat\u201d.\\n\\nCrnogorsko
  turisti\u010dko udru\u017eenje (CTU) u naredne dvije godine bi\u0107e na \u010delu
  regionalne Asocijacije turisti\u010dkih agencija jugoisto\u010dne Evrope (ISTA).\\n\\nMaj\\n\\nFond
  za razvoj op\u0161tinske infrastrukture (Municipal Infrastructure Development Fund-MIDF)
  i Erste banka potpisali su sporazum koji predvi\u0111a podr\u0161ku razvoju odr\u017eive
  infrastrukture u Crnoj Gori putem kreditne linije u iznosu od deset miliona eura.
  Sredstva su namijenjena op\u0161tinama i javnim i privatnim preduze\u0107ima koja
  pru\u017eaju komunalne usluge lokalnim samoupravama.\\n\\nEvropska banka za obnovu
  i razvoj (EBRD) odobrila je Alter Modusu, vode\u0107oj mikrofinansijskoj instituciji
  u Crnoj Gori, kredit vrijedan pet miliona eura za podsticanje razvoja mikro, malih
  i srednjih preduze\u0107a.\\n\\nCrna Gora je u izvje\u0161taju Svjetskog ekonomskog
  foruma (WEF) o konkurentnosti u oblasti putovanja i turizma, \u010diji je naziv
  \\\"Rast kroz pote\u0161ko\u0107e\\\" zauzela 67. poziciju od 141 rangirane dr\u017eave,
  sa 3,75 bodova.\\n\\nMini hidroelektrana (mHE) Vrelo, \u010dija je izgradnja ko\u0161tala
  1,7 miliona eura, po\u010dela je da radi u bjelopoljskom selu Lijeska.\\n\\nJun\\n\\nOsniva\u010di
  banke, koja je trebalo da se zove \\\"Gora\\\", odustali su od licence u Crnoj Gori.\\n\\nCrna
  Gora je postala 44. \u010dlanica Sporazuma o vladinim nabavkama Svjetske trgovinske
  organizacije (STO), \u010dime je ispunila jednu od zna\u010dajnih obaveza iz \u010dlanstva
  u STO i obezbijedila dodatni pristup tr\u017ei\u0161tima najrazvijenijih \u010dlanica
  za svoju poslovnu zajednicu.\\n\\nU Crnoj Gori je sni\u017eena cijena rominga nakon
  \u0161to je Savjet Agencije za elektronske komunikacije i po\u0161tansku djelatnost
  (EKIP) donio odluku o utvr\u0111ivanju dinamike sni\u017eavanja cijena rominga,
  koju su du\u017eni da primijene operatori javnih mobilnih komunikacionih mre\u017ea
  na teritoriji Crne Gore. Sporazum koji su pro\u0161le godine potpisale Srbija, Crna
  Gora, Bosna i Hercegovina i Makedonija, po\u010deo je da se primjenjuje 30. juna.\\n\\nFabrika
  sto\u010dne hrane u Spu\u017eu, koja je do nedavno bila u ste\u010daju, dobila je
  novog vlasnika - firme Agromont i Agroglob, a zapo\u010deta je realizacija investicije
  vrijedne 1,5 miliona eura.\\n\\nPRILOZI 10\\n\\n## Prilog A: Realna kretanja\\n\\n###
