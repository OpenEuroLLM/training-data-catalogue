  LISTA BROJEVA ZA USLUGE KUPCIMA                                    | 327  |\\n\\nUVOD\\n\\nVozilo
  je opremljeno sa infotelematskim sistemom projektovanim prema specifi\u010dnim karakteristikama
  putni\u010dke kabine, sa prilago\u0111enim dizajnom koji odgovara stilu instrument
  table.\\n\\nOvaj sistem je instaliran na ergonomskom mestu za voza\u010da i suvoza\u010da,
  a komande je lako na\u0107i pomo\u0107u grafi\u010dkog prikaza koji se nalazi napred
  i omogu\u0107ava laku upotrebu ovog ure\u0111aja.\\n\\nDa bi se pove\u0107ala za\u0161tita
  od kra\u0111e, sistem ima za\u0161titni sistem koji mu omogu\u0107ava da se koristi
  samo u vozilu u kome je originalno ugra\u0111en.\\n\\nUputstva za upotrebu su data
  u daljem tekstu i mi vam preporu\u010dujemo da ih pro\u010ditate pa\u017eljivo i
  da ih uvek dr\u017eite pri ruci (na primer u pregradi za dokumenta i sitne stvari).\\n\\nU\u017eivajte
  u \u010ditanju. Sre\u0107na vo\u017enja!\\n\\nInformacije u ovoj publikaciji su
  date kao primer. Grupa Fiat automobili mo\u017ee bilo kada da menja specifikacije
  modela vozila koji je opisan u ovoj publikaciji, iz tehni\u010dkih ili marketin\u0161kih
  razloga. Za vi\u0161e informacija obratite se Fiatovom dileru.\\n\\nSAVETI, KOMANDE
  I OP\u0160TE INFORMACIJE\\n\\nSAVETI\\n\\nBezbednost na putu\\nNau\u010dite kako
  da koristite razne funkcije sistema pre nego \u0161to krenete da vozite. Pro\u010ditajte
  pa\u017eljivo uputstva za ovaj sistem pre nego \u0161to krenete da vozite.\\n\\nUPOZORENJE\\nPrejaka
  ja\u010dina zvuka mo\u017ee da predstavlja opasnost. Podesite ja\u010dinu zvuka
  tako da i dalje mo\u017eete da \u010dujete i okolne zvuke (npr. sirene, vozila hitne
  pomo\u0107i, policije itd.).\\n\\nUslovi prijema\\nUslovi prijema se stalno menjaju
  tokom vo\u017enje. Na prijem mogu da uti\u010du okolne planine, zgrade ili mostovi
  ili ukoliko se nalazite daleko od emitera.\\n\\nVA\u017dNO: Ja\u010dinu zvuka mo\u017eete
  poja\u010dati kada primate upozorenja o saobra\u0107aju i vesti.\\n\\nNega i odr\u017eavanje\\nPo\u0161tujte
  slede\u0107e mere predostro\u017enosti kako biste obezbedili da sistem bude potpuno
  operativan:\\n\\n- displej se lako mo\u017ee ogrebati, osetljiv je na te\u010dnosti
  i deterd\u017eente. Izbegavajte kontakt sa o\u0161trim ili tvrdim predmetima koji
  mogu da mu o\u0161tete povr\u0161inu. Nemojte pritiskati displej kada ga \u010distite.\\n-
  pazite da nikakva te\u010dnost ne u\u0111e u sistem: ovo bi moglo da ga trajno o\u0161teti.\\n\\n\u010cistite
  samo prednji panel i displej sa mekom, \u010distom, suvom i antistati\u010dkom krpom.
  Proizvodi za \u010di\u0161\u0107enje i glancanje mogu da o\u0161tete povr\u0161inu.
  Nemojte koristiti alkohol niti sli\u010dne proizvode za \u010di\u0161\u0107enje
  panela ili displeja.\\n\\nVa\u017eno\\n\\nU slu\u010daju kvara, samo Fiatov diler
  treba da pregleda i popravi ovaj sistem.\\n\\nUkoliko je temperatura posebno niska,
  mogu\u0107e je da \u0107e displeju trebati malo vremena da postigne optimalnu ja\u010dinu
  osvetljenja.\\n\\nUkoliko vozilo stoji du\u017ee vreme, a spolja\u0161nja temperatura
  je vrlo visoka, mogu\u0107e je da sistem pre\u0111e u na\u010din rada \\\"thermalne
  za\u0161tite\\\", \u0161to zna\u010di da \u0107e obustaviti rad dok temperatura
  u putni\u010dkoj kabini ne bude ponovo na prihvatljivom nivou.\\n\\nCD\\n\\nPrljav\u0161tina,
  ogrebotine ili deformacije na CD mogu da uzrokuju smetnje tokom emitovanja i lo\u0161
  kvalitet zvuka. Sledite ove savete kako biste imali optimalne uslove emitovanja:\\n\\n-
  koristite samo CD sa slede\u0107om oznakom:\\n\\n  ![Compact Disc Digital Audio](image)\\n\\n-
  dobro o\u010distite svaki CD mekom krpom, tako da uklonite otiske prstiju ili pra\u0161inu.
  Dr\u017eite CD za obod i \u010distite ga od sredine prema ivici;\\n\\n- nemojte
  nikada koristiti hemijske proizvode (npr. antistatike, razre\u0111iva\u010de ili
  sprejeve) za \u010di\u0161\u0107enje, po\u0161to bi oni mogli da o\u0161tetite povr\u0161inu
  CD;\\n\\n- posle slu\u0161anja, vratite CD u svoju kutiju, kako biste izbegli da
  se o\u0161teti;\\n\\n- nemojte dugo izlagati CD direktnoj sun\u010devoj svetlosti,
  visokim temperaturama ili vlazi;\\n\\n- nemojte stavljati nalepnice na povr\u0161inu
  CD i nemojte pisati sa olovkama, hemijskim olovkama po snimenoj povr\u0161ini;\\n\\n-
  nemojte nikada koristiti CD koji su mnogo ogrebani, napukli, deformisani itd. Njihova
  upotreba mogla bi da uzrokuje o\u0161te\u0107enje plejera ili da ga pokvari.\\n\\nDa
  biste postigli najbolji kvalitet audio reprodukcije, preporu\u010dujemo vam da koristite
  originalne CD medije. Pravilan rad nije mogu\u0107e garantovati kada se koriste
  CD-R/RW mediji koji nisu pravilno narezani i/ili su maksimalnog kapaciteta preko
  650 Mb.\\n\\nVA\u017dNO: Nemojte koristiti za\u0161titne folije za CD niti diskove
  sa stabilizatorima koji se nalaze u prodaji, po\u0161to bi oni mogli da se zaglave
  u unutra\u0161njem mehanizmu i da o\u0161tetite disk.\\n\\nVA\u017dNO: Ukoliko koristite
  CD koji ima za\u0161titu od presnimavanja, mogu\u0107e je da \u0107e sistemu trebati
  nekoliko sekundi da po\u010dne da ga emituje. Nije mogu\u0107e garantovati da \u0107e
  CD plejer mo\u0107i da emituje sve za\u0161ti\u0107ene diskove. Za\u0161tita od
  presnimavanja je obi\u010dno navedena malim slovima i mogu\u0107e je da ju je te\u0161ko
  pro\u010ditati na omotu samog CD, a mo\u017ee da bude data na primer kao COPY CONTROL,
  COPY PROTECTED (za\u0161tita od presnimavanja), THIS CD CANNOT BE PLAYED ON A PC
  / MAC (ovaj CD nije mogu\u0107e emitovati na PC / MAC) ili mo\u017ee da bude obele\u017eena
  kori\u0161\u0107enjem simbola, kao \u0161to su, na primer:\\n\\nVA\u017dNO: Ukoliko
  se ubaci multisesijski disk, samo \u0107e prva sesija biti emitovana.\\n\\nMULTIMEDIJSKI
  URE\u0110AJI:\\nPODR\u017dANE AUDIO DATOTEKE I FORMATI\\n\\nZa CD, USB i iPod izvore,
  sistem mo\u017ee da emituje fajlove sa slede\u0107im ekstenzijama i formatima:\\n\\n-
  .MP3 (32 \u2013 320 Kbps);\\n- .WAV;\\n- .WMA (5 \u2013 320 Kbps) mono i stereo;\\n-
  .AAC (8 \u2013 96 KHz) mono i stereo;\\n- .M4A (8 \u2013 96 KHz) mono i stereo;\\n-
  .M4B (8 \u2013 96 KHz) mono i stereo;\\n- .MP4 (8 \u2013 96 KHz) mono i stereo;\\n\\nZa
  sve izvore (CD, AUX, iPod i Bluetooth, sistem mo\u017ee tako\u0111e da emituje slede\u0107e
  formate playlisti:\\n\\n- .M3U\\n- .PLS\\n- .WPL\\n\\nVA\u017dNO: Nije uop\u0161te
  va\u017eno da li su sufiksi napisani velikim ili malim slovima.\\n\\nINFORMACIJE
  O ZA\u0160TITNIM ZNA\u010cIMA\\n\\niPod, iTunes i iPhone su registrovani za\u0161titni
  znaci kompanije Apple Inc.\\nSvi ostali za\u0161titni znaci su vlasni\u0161tvo njihovih
  odre\u0111enih vlasnika.\\n\\nKompanija Apple nije odgovorna za rad ovog ure\u0111aja
  i za njegovu saobraznost sa pravilima i standardima bezbednosti.\\n\\nEKSTERNI AUDIO
  IZVORI\\n\\nDrugi elektronski ure\u0111aji (npr. iPod, PDA itd.) mogu se koristiti
  u vozilu.\\nMe\u0111utim, neki od njih mogu da uzrokuju eletromagnetne smetnje.
  Isklju\u010dite takve ure\u0111aje ukoliko se pogor\u0161a rad sistema.\\nVA\u017dNO:
  Sistem podr\u017eava samo USB ure\u0111aje FAT32 formata. Sistem ne podr\u017eava
  ure\u0111aje \u010diji je kapacitet ve\u0107i od 64 Gb.\\n\\nFunkcija digitalnog
  radija DAB/DAB+/DMB certifikovana je u skladu sa specifikacijama bele nalepnice
  ARD, za audio usluge Klase A.\\nARD je za\u0161titni znak Asocijacije za digitalnu
  radiofoniju u Italiji.\\n\\nTEHNI\u010cKE SPECIFIKACIJE\\n\\nZvu\u010dnici za osnovnu
  specifikaciju\\n\\nPrednji zvu\u010dnici\\n\\n- 2 \u00d8 38 mm visokotonska zvu\u010dnika
  na ru\u010dki vrata;\\n- 2 \u00d8 165 mm niskotonska zvu\u010dnika u stranici vrata.\\n\\nZadnji
  zvu\u010dnici\\n\\n- 2 \u00d8 165 mm zvu\u010dnika punog opsega u stranici vrata.\\n\\nZVU\u010cNICI
  HI-FI SPECIFIKACIJE (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nPrednji
  zvu\u010dnici\\n\\n- 2 \u00d8 38 mm visokotonska zvu\u010dnika na ru\u010dki vrata;\\n-
  2 \u00d8 165 mm niskotonska zvu\u010dnika u stranici vrata.\\n\\nZadnji zvu\u010dnici\\n\\n-
  2 \u00d8 165 mm zvu\u010dnika punog opsega u stranici vrata;\\n- 1 8 \u2013 kanalsko
  poja\u010dalo u prtlja\u017eniku;\\n- 1 kutija bas zvu\u010dnika u prtlja\u017eniku\\n  (polo\u017eaj
  varira zavisno od verzije).\\n\\nBRZI VODI\u010c\\n\\nKOMANDE NA PREDNJEM PANELU\\n\\nslika
  1.\\n\\n| Dugme | Funkcije | Na\u010din rada |\\n|-------|---------|------------|\\n|
