  \\\\\\\\\\nDr\u017eavni dug (bruto) & 2.022,1 & 1.942,9 & 2.532,4 \\\\\\\\\\nDepoziti
  Ministarstva finansija uklju\u010duju\u0107i i 38.477 unci zlata & 170,4 & 49,5
  & 372,8 \\\\\\\\\\nDr\u017eavni dug (neto) & 1.851,7 & 1.893,4 & 2.159,6 \\\\\\\\\\n\\\\hline\\n\\\\end{tabular}\\n\\\\caption{Struktura
  dr\u017eavnog duga, u mil. eura}\\n\\\\end{table}\\n\\nIako je u toku prvog polugoda
  povu\u010den zna\u010dajan dio sredstava u dolarima, valutna struktura dr\u017eavnog
  duga je i dalje povoljna. Dominantni dio duga je u eurima (oko 88,8%), dok je dio
  obaveza prema Pariskom klubu povjerilaca, kao i obaveze po osnovu IDA kredita, dug
  prema EUROFIMA i dug prema kineskoj EXIM banci u drugim valutama.\\n\\n\\\\subsection*{6.1.
  Unutra\u0161nji dug}\\n\\nUnutra\u0161nji dug je, na kraju juna 2015. godine, iznosio
  372,2 miliona eura i, u odnosu na kraj 2014. godine, manji je za 9 miliona eura
  ili 2,4%. Smanjenju unutra\u0161njeg duga najvi\u0161e je doprinijelo smanjenje
  duga po osnovu kredita komercijalnih banaka od 17,4 miliona eura, kao i smanjenje
  obaveza po osno-\\n\\n\\\\textsuperscript{22} U skladu sa novim Zakonom o bud\u017eetu
  i fiskalnoj odgovornosti, u kvartalnim izvje\u0161tajima prikazuje se dr\u017eavni
  dug, dok se u godi\u0161njem izvje\u0161\u0107aju prikazuje javni dug. Shodno ovom
  Zakonu, javni dug je definisan kao dug centralnog nivoa dr\u017eave (dr\u017eavni
  dug) i dug lokalnog nivoa (dug lokalne samouprave). Dr\u017eavni dug obuhvata dug
  centralne dr\u017eave i dug privrednih dru\u0161tava u ve\u0107inskom dr\u017eavnom
  vlasni\u0161tvu. Za razliku od ranijeg perioda, dr\u017eavni dug ne uklju\u010duje
  dug lokalnih samouprava.\\n\\nvu stare devizne \u0161tednje (5,4 miliona eura) i
  dr\u017eavnih obveznica (5,1 milion eura). Pozicije unutra\u0161njeg duga koje su
  zabilje\u017eile pove\u0107anje u uporednom periodu su obaveze po osnovu emitovanih
  dr\u017eavnih zapisa (19,8 miliona eura) i obaveze po osnovu restitucije (3,9 milina
  eura).\\n\\nU odnosu na kraj juna 2014. godine, unutra\u0161nji dug je zabilje\u017eio
  pad od 66,3 miliona eura ili 15,1%, najvi\u0161e zahvaljuju\u0107i smanjenju obaveza
  po osnovu kredita komercijalnih banaka od 41,3 miliona eura (tabela br. 6.2).\\n\\n**Tabela
