  osiguranja\\n\\nNajve\u0107e u\u010de\u0161\u0107e u aktivi odnosi se na ulaganja  89,21%
  u iznosu od 374.620.989KM.\\n\\nUlaganja sredstava \u017eivotnog osiguranja\\n\\nUlaganja
  sredstava garantnog fonda \u017eivotnog osiguranja\\n\\nObra\u010dunata sredstva
  garantnog fonda \u017eivotnog osiguranja iznosila su 43.011.346 KM i uglavnom su
  ulo\u017eena u namjene i na na\u010din propisan Pravilnikom o ulaganjima.\\n\\nUlaganja
  sredstava tehni\u010dkih rezervi \u017eivotnih osiguranja\\n\\nSredstva tehni\u010dkih
  rezervi \u017eivotnog osiguranja iznosila su 7.822.483 KM. Navedeni iznos dru\u0161tva
  su ulo\u017eila u namjene propisane Pravilnikom.\\n\\nOd ukupno ulo\u017eenih sredstava
  najve\u0107i procent se odnosi na sredstva na ra\u010dunima 69,78 % i na depozite
  18,10 %.\\n\\nUlaganja sredstava matemati\u010dke rezerve\\n\\nDru\u0161tva koja
  obavljaju djelatnost \u017eivotnog osiguranja, imaju obavezu formiranja i o\u010duvanja
  sredstava matemati\u010dke rezerve, nastoje\u0107i pri tome da u svakom trenutku
  za\u0161tite interese osiguranika.\\n\\nObra\u010dunata sredstva neto matemati\u010dke
  rezerve iznosila su 345.279.688 KM i uglavnom  su ulo\u017eena u namjene i na na\u010din
  propisan Pravilnikom.\\n\\nNajve\u0107i procent se odnosi na ulaganja u depozite
  79,30 %.\\n\\nPotra\u017eivanja uklju\u010duju\u0107i i reosiguranje\\n\\nPotra\u017eivanja,
  zajedno sa potra\u017eivanjima po osnovu zajmova(u bilansu iskazana u okviru ulaganja),
  iznosila su ukupno 12.351.831 KM (na dan 31.12.2013. iznosila su 10.857.673 KM),
  od \u010dega su dospjela potra\u017eivanja u  iznosu 1.161.339 KM.\\n\\nStruktura
  pasive \u017eivotnog osiguranja\\n\\nU strukturi pasive najve\u0107e u\u010de\u0161\u0107e
  imaju tehni\u010dke rezerve 84,71%, zatim kapital i 13,50% dok  obaveze u\u010destvuju
  sa 1,79%.\\n\\nKapital \u017eivotnog osiguranja\\n\\nKapital na dan 31.12.2014.
  godine je iznosio 56.693.927 KM i ve\u0107i je u odnosu na 31.12.2013.godine za
  12,97%. Dioni\u010dki kapital je  iznosio 21.116.205 KM i u\u010destvovao u ukupnom
  kapitalu sa 37,24%.\\n\\nTehni\u010dke rezerve \u017eivotnog osiguranja\\n\\nTehni\u010dke
  rezerve \u017eivotnog osiguranja (bruto) na dan 31.12.2014. godine iznosile su 355.725.708
  KM i bile su ve\u0107e  za 15,07 % u odnosu na stanje 31.12.2013.godine. Udio reosiguranja
  u tehni\u010dkim rezervama iznosio je 2.623.539 KM odnosno 0,73%. Najve\u0107i iznos
  tehni\u010dke rezerve \u010dinila je matemati\u010dka rezerva(bruto)koja je   na
  dan 31.12.2014. godine iznosila 346.314.506 KM.Udio reosiguranja u matemati\u010dkoj
  rezervi iznosio je 1.034.818 KM.\\n\\nBilans uspjeha \u017eivotnog osiguranja\\n\\nPrihodi
  \u017eivotnog osiguranja\\n\\nDru\u0161tva koja se bave poslovima \u017eivotnog
  osiguanja ostvarila su ukupan prihod u iznosu 115.576.680 KM i ve\u0107i je za 15,83%
  u odnosu na  2013. godinu. U strukturi prihoda \u017eivotnog osiguranja prihodi
  iz neposrednih poslova osiguranja \u010dine 82,18 %, prihodi od ulaganja 16,83 %
  i ostali prihodi 0,99 %.\\n\\nStruktura prihoda \u017eivotnog osiguranja\\n\\nRashodi
  \u017eivotnog osiguranja\\n\\nRashodi  u okviru \u017eivotnog osiguranja iznose
  109.362.738 KM i ve\u0107i su za 14,24% u odnosu na isti period prethodne godine.\\n\\nStruktura
  rashoda \u017eivotnog osiguranja\\n\\n\u0160tete \u017eivotnog osiguranja\\n\\nU
  \u017eivotnom osiguranju po broju rije\u0161eno je 7.319 \u0161teta ili 89,99 %
  od ukupnog broja prijavljenih \u0161teta. Ostvaren je povoljniji koeficijent efikasnosti
  rje\u0161avanja \u0161teta u odnosu na isti period prethodne godine (88,27 %). U
  okviru \u017eivotnog osiguranja, od ukupnog broja rije\u0161enih \u0161teta 513
  ili 7,00 % \u0161teta se odnosi na \u0161tete  koje su prijavljene  u prethodnim
  periodima, a 6.806 ili 93,00 % na \u0161tete koje su prijavljene i rije\u0161ene
  u teku\u0107em  periodu.\\n\\nUkupan iznos rije\u0161enih \u0161teta po vrijednosti
  je 33.145.792 KM ili 89,17 % od ukupno prijavljenih \u0161teta.\\n\\nDobit/gubitak
  \u017eivotnog osiguranja\\n\\nNa poslovima \u017eivotnog osiguranja dru\u0161tva
  su ostvarila bruto dobit u ukupnom iznosu od 6.213.942 KM.\\n\\nReosiguranje\\n\\nDru\u0161tva
  reosiguranjem vr\u0161e tzv. izravnavanje rizika i za\u0161titu osiguravatelja od
  \u0161teta sa ve\u0107im vrijednostima, koje mogu ugroziti poslovanje dru\u0161tva,
  te na taj na\u010din vr\u0161e disperziju rizika koji omogu\u0107ava stabilnije
  poslovanje i blagovremeno izmirenje obaveza prema osiguranicima.\\n\\nPoslovima
  reosiguranja u Federaciji bavi se dru\u0161tvo Bosna reosiguranje d.d. Sarajevo.\\n\\nDru\u0161tvo
  je ostvarilo aktivne premije u iznosu 51.282.318 KM (od \u010dega se 48.245.671
  KM odnosi na premiju iz poslova ne\u017eivotnih osiguranja a 3.036.647 KM na premiju
  iz poslova \u017eivotnih osiguranja).\\n\\nUkupna pasivna premija dru\u0161tva je
  iznosila 24.661.535 KM, tako da je premija u samopridr\u017eaju iznosila 26.620.783
  KM.\\n\\nAktiva dru\u0161tva na dan 30.06.2014. godine iznosila je  116.937.531
  KM i ve\u0107a je u odnosu na stanje sa 31.12.2013. godine za 4,81 %.\\n\\nU strukturi
  aktive najve\u0107e u\u010de\u0161\u0107e se odnosi na  udjele reosiguranja u tehni\u010dkim
  rezervacijama 44,52%, ulaganja 31,99 % i potra\u017eivanja 16,51 %.\\n\\nU pasivi
  dru\u0161tva tehni\u010dke rezervacije u\u010destvuju sa 62,78 %, kapital 22,13%,
  a obaveze u\u010destvuju sa 15,09 %.\\n\\nDru\u0161tvo je ostvarilo dobit u izvje\u0161tajnom
  periodu.\\n\\n*****\"", "\"Crna Gora\\nMinistarstvo za ljudska i manjinska prava\\n\\nPROGRAM
  RADA MINISTARSTVA ZA LJUDSKA I MANJINSKA PRAVA ZA 2018. GODINU\\n\\nSADR\u017dAJ\\n\\nNa
  osnovu \u010dlana 52 stav 3 Uredbe o organizaciji i na\u010dinu rada dr\u017eavne
  uprave (\u00bbSlu\u017ebeni list Crne Gore\u00ab, br. 05/12, 25/12, 61/12, 20/13,
  17/14 06/15, 80/15, 35/16, 41/16, 61/16, 73/16, 3/17, 19/17 i 68/17), ministar za
  ljudska i manjinska prava donosi\\n\\nProgram rada Ministarstva za ljudska i manjinska
  prava za 2018. godinu\\n\\nI UVODNE NAPOMENE\\n\\nProgram rada 1 Ministarstva za
  ljudska i manjinska prava temelji se na obavezama koje za Ministarstvo proizilaze
  iz:\\n\\n- Ustava Crne Gore;\\n- Zakona i drugih akata iz nadle\u017enosti Ministarstva;\\n-
  Programa rada Vlade Crne Gore za 2018. godinu;\\n- Program pristupanja Crne Gore
  u Evropsku uniju 2018- 2020;\\n- Plana aktivnosti na ispunjavanju preporuka iz Izvje\u0161taja
  EK o napretku Crne Gore za 2017. godinu;\\n- Zaklju\u010daka Vlade Crne Gore i\\n-
  \u010clanstva Crne Gore u Ujedinjenim nacijama, Savjetu Evrope, OEBS-u, kao i drugim
  me\u0111unarodnim organizacijama i inicijativama koje doprinose zajedni\u010dkom
  napretku i prosperitetu dr\u017eava \u010dlanica.\\n\\nOsnovni, prioritetni ciljevi
  Programa rada Ministarstva su:\\n\\n- Sprovo\u0111enje pravnih propisa, strate\u0161ko
  planiranje i pra\u0107enje stanja u oblasti: ljudskih prava (iz nadle\u017enosti
  Ministarstva), prava pripadnika manjinskih naroda i drugih manjinskih nacionalnih
  zajednica, odnosa sa vjerskim zajednicama u Crnoj Gori, unapre\u0111enje i za\u0161tita
  prava Roma  i Egip\u0107ana i poslova rodne ravnopravnosti;\\n- Priprema nacrta
  i predloga zakona iz nadle\u017enosti Ministarstva;\\n- Priprema predloga propisa
  koje donosi Vlada Crne Gore i priprema i dono\u0161enja propisa u nadle\u017enosti
  Ministarstva;\\n- Priprema strategija, programa i projekata za efikasno sprovo\u0111enje
  utvr\u0111enih politika;\\n- Doprinos nastavku ostvarivanja spoljno-politi\u010dkih
  prioriteta Crne Gore: integracija u Evropsku uniju, unapre\u0111enje dobrosusjedskih
  odnosa i regionalne saradnje, razvijanje bilateralne i multilateralne saradnje;\\n-
  Izvr\u0161avanje obaveza koje proizilaze iz Programa rada Vlade Crne Gore i prioritetnih
  aktivnosti za 2018. godinu;\\n- Izvr\u0161avanje obaveza koji proizilaze iz zaklju\u010daka
  Vlade Crne Gore;\\n- U\u010de\u0161\u0107e i doprinos u kreiranju i sprovo\u0111enju
  politika koje se ti\u010du nadle\u017enosti Ministarstva, a u dominantnoj su nadle\u017enosti
  drugih dr\u017eavnih organa;\\n- Izvr\u0161avanje obaveza prema Ujedinjenim nacijama,
  Savjetu Evrope, OEBS-u i drugim organizacijama i inicijativama;\\n\\n1 Izrazi koji
  se u ovom Programu rada koriste za fizi\u010dka lica u mu\u0161kom rodu podrazumijevaju
  iste izraze u \u017eenskom rodu.\\n\\n- Ostvarivanje produktivne saradnje sa institucijama,
  organizacijama i inicijativama sa sjedi\u0161tem u Crnoj Gori, regionu ili \u0161ire
  i\\n- Dalji razvoj organizacionih, kadrovskih i materijalno-tehni\u010dkih kapaciteta
  Ministarstva;\\n\\nProgramom rada Ministarstva za ljudska i manjinska prava definisane
  su ukupno 94 obaveze i to: 93 u tematskom i 1 obaveza u normativnom dijelu, od kojih
  su 3 obaveze definisane Programom rada Vlade Crne Gore za 2018. godinu. Broj\u010dani
  pregled aktivnosti po pojedinim organizacionim jedinicama Ministarstva je:\\n\\n1.
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda (16)\\n2.
  Direktorat za unapre\u0111enje i za\u0161titu prava manjinskih naroda i drugih manjinskih
  nacionalnih zajednica (12)\\n3. Direktorat za odnose sa vjerskim zajednicama (9)\\n4.
  Odjeljenje za poslove rodne ravnopravnosti (16)\\n5. Odjeljenje za unapre\u0111enje
  i za\u0161titu prava Roma i Egip\u0107ana (16)\\n6. Odeljenje za evropske integracije,
  programiranje i implementaciju EU fondova (9)\\n7. Slu\u017eba za op\u0161te poslove
  (2)\\n8. Slu\u017eba za finansije (4)\\n9. Kabinet ministra (4)\\n10. Zajedni\u010dke
  aktivnosti (9)\\n\\nII PREGLED AKTIVNOSTI\\n\\n1. DIREKTORAT ZA UNAPRE\u0110ENJE
  I ZA\u0160TITU LJUDSKIH PRAVA I SLOBODA\\n\\nA. Normativni dio\\n\\n1. Donijeti
  Zakon o registrovanom partnerstvu\\n\\nU 2018. godini predvi\u0111ene su zakonodavne
  aktivnosti na izradi Predloga novog Zakona koji se odnosi na regulisanje ravnopravnog
  partnerstva (istopolnih zajednica) i koji \u0107e biti inkorporiran u zakonodavni
  sistem Crne Gore.\\n\\nFokus \u0107e biti stavljen i na zaokru\u017eivanje normativno-pravnog
  okvira kojim \u0107e se u cjelosti predvidjeti i zaokru\u017eiti obim prava LGBTI
  osoba u skladu sa me\u0111unarodnim standardima u predmetnoj oblasti, po\u0161tuju\u0107i
  norme i na\u010dela Ustava Crne Gore. S tim u vezi treba definisati pravne standarde
  privatnog i porodi\u010dnog \u017eivota LGBTI osoba, kroz dono\u0161enje Zakona
  o registrovanom partnerstvu.\\n\\nObra\u0111iva\u010d: Ministarstvo za ljudska i
  manjinska prava\\n\\nRok: IV kvartal\\n\\nNadle\u017eno radno tijelo Vlade: Komisija
  za politi\u010dki sistem, unutra\u0161nju i vanjsku politiku i Komisija za ekonomsku
  politiku i finansijski sistem\\n\\n2. Strategija za unapre\u0111enje kvaliteta \u017eivota
  LGBTI osoba u Crnoj Gori 2019-2024\\n\\nU 2018. godini predvi\u0111ene su aktivnosti
  na izradi nove LGBTI Strategije sa prate\u0107im akcionim planom, kojom \u0107e
  se nastaviti implementacija politike Vlade Crne Gore u predmetnoj oblasti.\\n\\nObra\u0111iva\u010d:
  Ministarstvo za ljudska i manjinska prava\\n\\nRok: IV kvartal\\n\\nNadle\u017eno
  radno tijelo Vlade: Komisija za politi\u010dki sistem, unutra\u0161nju i vanjsku
  politiku i Komisija za ekonomsku politiku i finansijski sistem\\n\\nB. Tematski
  dio\\n\\n1. Akcioni plan za sprovo\u0111enje Strategije za unapre\u0111enje kvaliteta
  \u017eivota LGBTI osoba 2013-2018, za 2018. godinu s Izvje\u0161tajem o realizaciji
  Akcionog plana u 2017. godini\\n\\nOvim planom \u0107e se bli\u017ee utvrditi na\u010din
  i dinamika sprovo\u0111enja Strategije za unapre\u0111enje kvaliteta \u017eivota
  LGBTI osoba u Crnoj Gori 2013-2018, u 2018. godini, a izvje\u0161taj o sprovo\u0111enju\\n\\nProgram
  rada Ministarstva za ljudska i manjinska prava za 2018. godinu\\n\\nStrategije za
  unapre\u0111enje kvaliteta \u017eivota LGBTI osoba 2013-2018, sadr\u017ea\u0107e
  opisni i tabelarni prikaz realizacije svih mjera planiranih AP za 2017. godinu.\\n\\nObra\u0111iva\u010d:
  Ministarstvo za ljudska i manjinska prava\\n\\nRok: I kvartal\\n\\nNadle\u017eno
  radno tijelo Vlade: Komisija za politi\u010dki sistem, unutra\u0161nju i vanjsku
  politiku i Komisija za ekonomsku politiku i finansijski sistem\\n\\n2.\\n\\nInformacija
  o realizaciji aktivnosti proisteklih iz potpisanih Memoranduma o razumijevanju i
  saradnji sa lokalnim vlastima u vezi unapre\u0111enja polo\u017eaja i za\u0161tite\\n\\nprava
  LGBTI populacije na lokalnom nivou\\n\\nCilj ove informacije bi\u0107e pra\u0107enje
  realizacije aktivnosti i obaveza na unapre\u0111enju polo\u017eaja i za\u0161tite
  prava LGBTI zajednice koje su proistekle iz potpisanih Memoranduma o razumijevanju
  i saradnji sa lokalnim vlastima, te me\u0111usobne konsultacije, razmjene informacija
  i preduzimanje drugih zajedni\u010dkih mjera i aktivnosti, radi uspostavljanja tolerantog
  okru\u017eenja prema LGBTI osobama u lokalnoj zajednici. Informacija se sa\u010dinjava
  na osnovu analize upitnika i dr. metoda pra\u0107enja stanja u lokalnim samoupravama
  u vezi sa po\u0161tovanjem memoranduma.\\n\\nObra\u0111iva\u010d: Direktorat za
  unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok: I kvartal\\n\\n3.\\n\\nInformacija
  o aktivnostima i praksi policijskih i pravosudnih organa (policija, sudstvo, tu\u017eila\u0161tvo)
  u vezi sa prijavljenim i procesuiranim slu\u010dajevima\\n\\ndiskriminacije, nasilja,
  govora mr\u017enje i drugih oblika napada na pripadnike LGBTI\\n\\npopulacije\\n\\nCilj
  izrade ove informacije jeste prikupljanje podataka i informacija o prijavljenim
  i procesuiranim slu\u010dajevima diskriminacije, nasilja, govora mr\u017enje i drugih
  oblika napada na pripadnike LGBTI zajednice od nadle\u017enih policijskih i pravosudnih
  organa u Crnoj Gori radi pra\u0107enja primjene antidiskriminacionih i drugih propisa
  i usmjeravanja aktivnosti na suzbijanje ovih negativnih pojava.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  I kvartal\\n\\n4. Organizovanje Regionalne konferencije na temu vi\u0161estruke
  diskriminacije lica sa invaliditetom, sa posebnim akcentom na \u017eene i djevoj\u010dice
  sa invaliditetom, pripadnike LGBTI zajednice i  Rome.\\n\\nRegionalna konferencija  ima
  za  cilj  razmjenu znanja i iskustva u\u010desnika  iz regiona  o antidiskriminacionom
  zakonodavstvu i mehanizmima za\u0161tite od vi\u0161estruke diskriminacije  lica
  sa invaliditetom.\\n\\nObra\u0111iva\u010d: Direktorat za unapre\u0111enje i za\u0161titu
  ljudskih prava i sloboda\\n\\nRok: II kvartal\\n\\n5. Plan promocije antidiskriminacionog
  zakonodavstva - medijska kampanja o zabrani diskriminacije i afirmaciji antidiskriminatornog
  pona\u0161anja\\n\\nMedijska kampanja o zabrani diskriminacije i afirmaciji antidiskriminatornog
  pona\u0161anja, u 2018. godini, za temu \u0107e imati podizanje nivoa svijesti op\u0161te
  populacije prema diskriminaciji, stvaranje tolerantnog okru\u017eenja i senzibilisanja
  javnosti posebno prema osobama sa invaliditetom, LGBTI populaciji, Romima, zatim,
  diskriminaciji po osnovu rodnog identiteta i drugim naj\u010de\u0161\u0107e diskriminisanim
  dru\u0161tvenim grupama. Nakon izrade vizuelnog identiteta kampanje, predstoji izrada
  medija-plana koji \u0107e omogu\u0107iti postizanje zadatog cilja, odnosno, podizanje
  svijesti cjelokupne crnogorske javnosti, posebno prema najranjivijim kategorijama
  stanovni\u0161tva, s ciljem po\u0161tovanja svih ljudskih prava, stvaranja podr\u017eavaju\u0107eg
  i tolerantnijeg okru\u017eenja, te po\u0161tovanja razli\u010ditosti drugog.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  II \u2013 IV kvartal\\n\\n6. Realizacija \\\"Nastavnog plana za edukaciju dr\u017eavnih
  slu\u017ebenika, nosioca pravosudnih funkcija i zaposlenih u drugim organima, organizacijama
  i institucijama koji dolaze u kontakt sa slu\u010dajevima diskriminacije\\\" \u2013
  (Edukacije o antidiskriminacionom zakonodavstvu i praksi)\\n\\nOva aktivnost je
  dugoro\u010dnog karaktera i ozna\u010dena je kao kontinuirana aktivnost ovog Ministarstva,
  te je i nakon realizacije Plana edukacije u 2011, 2012, 2013, 2014, 2015, 2016.
  i 2017. godini, predvi\u0111eno da se i u 2018. godini nastavi u istom pravcu kroz
  osposobljavanje \u0161to ve\u0107eg broja onih koji su posredno i/ili neposredno
  uklju\u010deni u sprovo\u0111enje antidiskriminacionog zakononodavstva. Obuke su
  namijenjene, prije svega, profesionalcima, te svima onima koji na bilo koji na\u010din
  dolaze u kontakt sa slu\u010dajevima diskriminacije.\\n\\nEdukacijom su u dosada\u0161njem
  periodu bili obuhva\u0107eni predstavnici dr\u017eavnih organa, Kancelarije ombudsmana,
  nevladinih organizacija koje se bave za\u0161titom ljudskih prava, zatim, predstavnici
  svih podru\u010dnih jedinica i ispostava policije, predstavnici svih lokalnih samouprava,
  zatim, predstavnici svih inspekcijskih slu\u017ebi, predstavnici svih sudova za
  prekr\u0161aje, predstavnici dr\u017eavnog tu\u017eila\u0161tva, predstavnici centara
  za socijalni rad, te predstavnici organa dr\u017eavne uprave zadu\u017eeni za rad
  i sprovo\u0111enje politika za\u0161tite ranjivih dru\u0161tvenih grupa .\\n\\nPlanom
  edukacije za 2018. godinu, ukazano je na potrebu za edukovanjem u ovoj oblasti nastavnika
  srednjo\u0161kolskog obrazovanja, \u0161kolskih pedagoga i psihologa.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  II-IV kvartal\\n\\n7.\\n\\nRazvijanje saradnje sa lokalnim samoupravama u cilju
  promocije Zakona o zabrani lica sa invaliditetom od diskriminacije i promocije jednakosti  i  Strategije
  za za\u0161titu\\n\\nlica sa invaliditetom od diskriminacije i promocije jednakosti
  za period 2017-2021.\\n\\nsa Akcionim planom za 2018. godinu i implementacija  u
  praksi.\\n\\nRazvijanje saradnje sa lokalnim samoupravama u cilju promocije Zakona
  o zabrani diskriminacije lica sa invaliditetom i promocije jednakosti i obaveza
  iz  Strategije za za\u0161titu lica sa invaliditetom od diskriminacije i promocije
  jednakosti za period 2017-2021. sa Akcionim planom za 2018. godinu i implementacija
  u praksi, sprove\u0161\u0107e se kroz organizovanje po jedne dvodnevne radionice
  u ve\u0107im gradovima sva tri crnogorska regiona kako bi se obuhvatile sve lokalne
  samouprave. U\u010desnici radionica \u0107e pored predstavnika organa dr\u017eavne
  uprave, biti i predstavnici organa lokalne samouprave, NVO i drugih subjekata nadle\u017enih
  za implementaciju Zakona i Strategije sa ciljem  izrade lokalnih akcionih planova.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  II \u2013IV kvartal\\n\\n8. Regionalna  konferencija  o uklju\u010divanja lica sa
  invaliditetom u politi\u010dki i javni \u017eivot.\\n\\nRegionalna  konferencija
  ima za cilj  primjenu dobre prakse iz okru\u017eenja  kojim se ostvaruje pravo lica
  sa invaliditetom da biraju i budu birani u predstavni\u010dkim tijelima na dr\u017eavnom
  i lokalnom nivou kao i na drugim mjestima odlu\u010divanja.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  IV kvartal\\n\\n9. Za\u0161tita od diskriminacije i postizanje ravnopravnosti djece
  sa intelektualnim smetnjama sa drugom djecom\\n\\nMinistarstvo za ljudska i manjinska
  prava \u0107e u 2018. godini nastaviti sa aktivnostima na za\u0161titi od diskriminacije
  i postizanju ravnopravnosti djece sa intelektualnim smetnjama sa drugom djecom.
  S tim u vezi, organizova\u0107e se aktivnosti koje se odnose na rad sa djecom najranijeg
  \u0161kolskog uzrasta vezano za po\u0161tovanje ljudskih prava, uklju\u010divanje
  djece sa intelektualnim smetnjama u oblast za\u0161tite ljudskih prava bez diskriminacije
  i na ravnopravnim osnovama, te objavljivanju niza publikacija korisnih djeci sa
  intelektulanim smetnjama u lako razumljivom formatu i njihova distribucija organizacijama,
  savezima, dnevnim centrima, kao i djeci najranijeg \u0161kolskog uzrasta.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  IV kvartal\\n\\n10. Organizovanje doga\u0111aja povodom Me\u0111unarodnog dana ljudskih
  prava\\n\\nMinistarstvo za ljudska i manjinska prava organizuje doga\u0111aj povodom
  10. decembra Me\u0111unarodnog dana osoba sa invaliditetom, koji ima za cilj promovisanje
  razumjevanja po\u0161tovanja ljudskih prava, uva\u017eavaju\u0107i princip jednakosti
  i ravnopravnosti, bez diskriminacije.\\n\\nObra\u0111iva\u010d: Direktorat za unapre\u0111enje
  i za\u0161titu ljudskih prava i sloboda\\n\\nRok: IV kvartal\\n\\n11. Pra\u0107enje
  realizacije mjera predvi\u0111enih Akcionim planom za sprovo\u0111enje Strategije
  za za\u0161titu lica sa invaliditetom od diskriminacije i promociju jednakosti za
  period 2017-2021. godine\\n\\nVlada Crne Gore usvojila je, u decembru 2016. godine
  Strategiju za za\u0161titu lica sa invaliditetom od diskriminacije i promociju jednakosti
  za period 2017-2021. godine sa Akcionim planom za 2017-2018. godine. Ministarstvo
  za ljudska i manjinska prava vr\u0161i monitoring pra\u0107enja primjene ove Strategije
  uz koordinaciju Komisije za izradu prate\u0107ih akcionih planova, te izvje\u0161tavanje
  u vezi sa implementacijom istih.\\n\\nObra\u0111iva\u010d: Direktorat za unapre\u0111enje
  i za\u0161titu ljudskih prava i sloboda\\n\\nRok: Kontinuirano\\n\\n12.\\n\\nRealizovati
  potpisivanje\\n\\nMemoranduma o razumijevanju i\\n\\nsaradnji sa\\n\\npredstavnicima
  lokalnih vlasti u Crnoj Gori u cilju unapre\u0111enja kvaliteta \u017eivota\\n\\nLGBTI
  osoba na lokalnom nivou.\\n\\nCilj potpisivanja ovih Memoranduma sa crnogorskim
  op\u0161tinama (pojedina\u010dno), preduzima se radi obezbje\u0111ivanja efikasnih
  mjera u borbi protiv diskriminacije po osnovu seksualne orijenatcije ili rodnog
  identiteta i promocije tolerancije prema LGBT osobama sa lokalnim vlastima. Do sada
  je potpisano ukupno 16 memoranduma sa lokalnim samoupravama.\\n\\nObra\u0111iva\u010d:
  Direktorat za unapre\u0111enje i za\u0161titu ljudskih prava i sloboda\\n\\nRok:
  Kontinuirano\\n\\n13.\\n\\nPra\u0107enje i izvje\u0161tavanje o realizaciji mjera
  iz Akcionog plana za potrebe pregovora za Poglavlje 23 i Poglavlje 19\\n\\nS obzirom
  da je oblast temeljnih prava jedna od klju\u010dnih u pregovara\u010dkom Poglavlju
  23, potrebno je pratiti definisane mjere iz Akcionog plana za potrebe pregovora,
  kontinuirano unositi podatke o stepenu realizacije zadatih mjera, kao i periodi\u010dno
  izvje\u0161tavati o ukupnom stanju u oblasti za\u0161tite i promocije temeljnih
  ljudskih prava. Tako\u0111e, dio aktivnosti ovog Direktorata, koji je obuhva\u0107en
  mjerama iz Poglavlja 19, realizova\u0107e se u okviru prate\u0107eg Akcionog plana
  za ovo Poglavlje.\\n\\nObra\u0111iva\u010d: Direktorat za unapre\u0111enje i za\u0161titu
  ljudskih prava i sloboda\\n\\nRok: Kontinuirano\\n\\n14.\\n\\nOdr\u017eavanje  javnih
  \u010dasova  za u\u010denike osnovnih \u0161kola u 10 crnogorskih op\u0161tina  sa
  ciljem  upoznavanja  o ljudskim pravima, antidiskriminaciji lica sa invaliditetom
  i\\n\\ndrugih ranjivih grupa\\n\\nObra\u0111iva\u010d: Direktorat za unapre\u0111enje
  i za\u0161titu ljudskih prava i sloboda\\n\\nRok: Kontinuirano\\n\\n2. DIREKTORAT
  ZA UNAPRE\u0110ENJE I ZA\u0160TITU PRAVA MANJINSKIH NARODA I DRUGIH MANJINSKIH NACIONALNIH
  ZAJEDNICA\\n\\nA. Normativni dio\\n\\n1. Strategija manjinske politike 2018-2023.\\n\\nOvom
  Strategijom, u skladu sa uporedno-pravnim me\u0111unarodnim standardima, definisa\u0107e
  se mjere, na\u010din i dinamika za sprovo\u0111enje mjera koje imaju za cilj za\u0161titu
  i unapredjivanje uslova \u017eivota manjinskih naroda i drugih manjinskih nacionalnih
  zajednica u cjelini, a koje su dr\u017eavni organi du\u017eni postepeno da realizuju
  u periodu implementacije dokumenta u cilju pune integracije manjina u crnogorsko
  dru\u0161tvo i izgradnji Crne Gore kao interkulturalnog du\u0161tva.\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: II kvartal\\n\\n2. Pravilnik o kriterijumima
  za vrednovanje, izgledu i sadr\u017eaju obrasca i potrebnoj dokumentaciji za finansiranje
  projekata iz sredstava Fonda za za\u0161titu i ostvarivanje manjinskih prava sa
  tabelom za bodovanje projekata\\n\\nNa osnovu \u010dlana 36i stav 9 Zakona o manjinskim
  pravima i slobodama (\\\"Slu\u017ebeni list Republike Crne Gore\\\", br. 31/06,
  br.51/06, br. 38/07 i \\\"Slu\u017ebeni list Crne Gore\\\", br. 02/11, 08/11 i br.
  31/17) Ministarstvo za ljudska i manjinska prava donosi Pravilnik o kriterijumima
  za vrednovanje, izgledu i sadr\u017eaju obrasca i potrebnoj dokumentaciji za finansiranje
  projekata iz sredstava Fonda za za\u0161titu i ostvarivanje manjinskih prava sa
  tabelom za bodovanje projekata. Ovim Pravilnikom propisuju se kriterijumi za vrijednovanje,
  izgled, sadr\u017eaj obrasca i potrebna dokumentacija za finansiranje projekata
  iz sredstava Fonda za za\u0161titu i ostvarivanje manjinskih prava.\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih\\n\\nmanjinskih
  nacionalnih zajednica\\n\\nRok: I kvartal\\n\\nB. Tematski dio\\n\\n1. Izvje\u0161taj
  o razvoju i za\u0161titi prava manjinskih naroda i drugih manjinskih nacionalnih
  zajednica za 2017. godinu\\n\\nU skladu sa \u010dlanom 38 Zakona o manjinskim pravima
  i slobodama, Vlada najmanje jednom godi\u0161nje podnosi Skup\u0161tini izvje\u0161taj
  o razvoju i za\u0161titi prava manjinskih naroda i drugih manjinskih nacionalnih
  zajednica. Izvje\u0161taj za 2017. godinu \u0107e prikazati ostvarivanje politike
  razvoja i za\u0161tite prava manjina u Crnoj Gori.\\n\\nObra\u0111iva\u010d: Direktorat
  za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih manjinskih\\n\\nnacionalnih
  zajednica\\n\\nRok: I kvartal\\n\\n2. Organizacija tematskih okruglih stolova\\n\\nU
  skladu sa dogovorenom dinamikom organizovani okrugli stolovi sa jasno nazna\u010denim
  temama.\\n\\na) Okrugli sto na temu:  \u201eManjinski narodi  u kontekstu evropskih
  integracija\\\"\\n\\nU cilju upoznavanja sa kriterijumima evroatlanskih integracija,
  Ministarstvo za ljudska i manjinska prava \u0107e organizovati Okrugli sto na temu:
  \u201ePrava manjinskih naroda u kontekstu evropskih integracija\\\".\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: II kvartal\\n\\nb) Okrugli sto na temu:
  \u201eOd multikulturalizma ka interkulturalizmu\\\"\\n\\nU cilju upoznavanja sa
  pojmovima kao \u0161to su multikulturalizam i interkulturalizam, sterotipi, predrasude,
  afirmativna akcija, i sl. kao i zna\u010daja ja\u010danja svijesti o gra\u0111anskom
  dru\u0161tvu, Ministarstvo za ljudska i manjinska prava \u0107e organizovati Okrugli
  sto na temu: \u201eOd multikulturalizma ka interkulturalizmu\\\".\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: IV kvartal\\n\\n3. Informacija o zastupljenosti
  manjina\\n\\nU skladu sa \u010dlanom 79, ta\u010dka 10 Ustava Crne Gore, kojim se
  pripadnicima manjina jam\u010di pravo srazmjerne zastupljenosti manjinskih naroda
  i drugih manjinskih nacionalnih zajednica u dr\u017eavnim organima, organima dr\u017eavne
  uprave, organima lokalnih uprava, sudovima i Dr\u017eavnom tu\u017eila\u0161tvu.\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: IV kvartal\\n\\n4. Pra\u0107enje i izvje\u0161tavanje
  realizacije mjera iz Akcionog plana za potrebe pregovora za poglavlje 23 (manjinska
  prava)\\n\\nS obzirom da je Crna Gora otvorila pregovara\u010dko poglavlje 23, potrebno
  je pratiti definisane mjere iz Akcionog plana za potrebe pregovora, kao i periodi\u010dno
  izvje\u0161tavati o stepenu njihove realizacije (poseban sastavni dio koji se odnosi
  na manjinska prava).\\n\\nU skladu sa obavezama iz Pregovara\u010dkog poglavlja
  23 \\\"Provosu\u0111e i temeljna prava\\\" potrebno je pratiti realizaciju mjera
  predvi\u0111enih u Akcionom planu za ovo pregovara\u010dko poglavlje, kao i periodi\u010dno
  izvje\u0161tavati o stepenu njihove realizacije.\\n\\nObra\u0111iva\u010d: nacionalnih
  zajednica\\n\\nDirektorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda
  i drugih manjinskih\\n\\nRok: kontinuirano\\n\\n5. Upis studenata na univerzitete
  u Republici Albaniji\\n\\nMinistarstvo za ljudska i manjinska prava \u0107e u saradnji
  sa Ministarstvom prosvjete Vlade Crne Gore realizovati aktivnosti na upisu studenata
  iz Crne Gore na Univerzitete u Republici Albaniji u skladu sa odredbama Sporazuma
  o saradnji izme\u0111u Vlade Crne Gore i Savjeta ministara Republike Albanije u
  oblasti obrazovanja.\\n\\nObra\u0111iva\u010d: Direktorat za unaprje\u0111enje i
  za\u0161titu prava manjinskih naroda i drugih manjinskih nacionalnih zajednica\\n\\nRok:
  kontinuirano\\n\\n6. Upis studenata na univerzitete u Republici Kosovo\\n\\nMinistarstvo
  za ljudska i manjinska prava \u0107e u saradnji sa Ministarstvom prosvjete Vlade
  Crne Gore realizovati aktivnosti na upisu studenata iz Crne Gore na Univerzitete
  u Republici Kosovo u skladu sa odredbama Sporazuma o saradnji izme\u0111u Vlade
  Crne Gore i Vlade Republike Kosovo u oblasti obrazovanja.\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: kontinuirano\\n\\n7. Saradnja sa savjetima
  manjinskih naroda i drugih manjinskih nacionalnih zajednica\\n\\nMinistarstvo \u0107e
  nastaviti kontinuiranu saradnju sa konstituisanim savjetima manjinskih naroda i
  drugih manjinskih nacionalnih zajednica u Crnoj Gori. Tokom godine predstavnici
  Ministarstva \u0107e najmanje dva puta godi\u0161nje biti na radnim sastancima svim
  Savjetima u Crnoj Gori.\\n\\nObra\u0111iva\u010d: Direktorat za unaprje\u0111enje
  i za\u0161titu prava manjinskih naroda i drugih manjinskih nacionalnih zajednica\\n\\nRok:
  kontinuirano\\n\\n8. Sastanci komisije za pra\u0107enje sprovo\u0111enja Strategije
  manjinske politike 2018-2023.\\n\\nMinistarstvo \u0107e organizovati sastanke Komisije
  za pra\u0107enje sprovo\u0111enja Strategije manjinske politike 2018-2023. Tako\u0111e,
  Ministarstvo \u0107e organizovati i sastanke sa Komisijom za izradu Izvje\u0161taja
  Crne Gore o sprovo\u0111enju Okvirne konvencije o pravima nacionalnih manjina i
  Evropske povelje o regionalnim i manjinskim jezicima, kao i pra\u0107enje sprovo\u0111enja
  preporuka Komiteta ministara Savjeta Evrope vezano za Okvirnu konvenciju o pravima
  nacionalnih manjina i Evropsku povelju o regionalnim ili manjinskim jezicima.\\n\\nObra\u0111iva\u010d:
  Direktorat za unaprje\u0111enje i za\u0161titu prava manjinskih naroda i drugih
  manjinskih nacionalnih zajednica\\n\\nRok: kvartalno\\n\\n9. Prevod i \u0161tampanje
  pravnih propisa na albanski i romski jezik\\n\\nMinistarstvo \u0107e nastaviti sa
  praksom prevo\u0111enja i publikovanja pravnih propisa koji se ti\u010du manjinskih
  naroda na manjinskim jezicima.\\n\\nObra\u0111iva\u010d: Direktorat za unaprje\u0111enje
  i za\u0161titu prava manjinskih naroda i drugih manjinskih\\n\\nnacionalnih zajednica\\n\\nRok:
  kontinuirano\\n\\n10. Kvartalni sastanci sa NVO sektorom\\n\\nU cilju \u0161to uspje\u0161nije
  saradnje i realizovanja zajedni\u010dkih aktivnosti nastavi\u0107e se ustanovljena
  praksa  Kvartalnih sastanaka sa predstavnicima NVO sektora u prostorijama  Ministarstva
  za ljudska i manjinska prava.\\n\\nObra\u0111iva\u010d: Direktorat za unaprje\u0111enje
  i za\u0161titu prava manjinskih naroda i drugih manjinskih nacionalnih zajednica\\n\\nRok:
  kontinuirano\\n\\n3. DIREKTORAT ZA ODNOSE SA VJERSKIM ZAJEDNICAMA\\n\\nA. Tematski
  dio\\n\\n1. Smjernice za unaprje\u0111enje saradnje dr\u017eave i vjerskih zajednica\\n\\nCrna
  Gora u procesu evropskih integracija ima obavezu unaprje\u0111enja sistema promocije
  i za\u0161tite ljudskih prava i sloboda, me\u0111u kojima sloboda vjeroispovjesti
  zauzima posebno mjesto. Prvi cilj ovog dokumenta je stvaranje pretpostavki za unaprje\u0111enje
  saradnje dr\u017eave i vjerskih zajednica, odnosno valorizacija njihovog socijalnog
  kapitala, \u0161to podrazumijeva mapiranje oblasti za socijalni aktivizam vjerskih
  zajednica, kao i unaprje\u0111enje i intenziviranje socijalnog aktivizma vjerskih
  zajednica.\\n\\nObra\u0111iva\u010d: Direktorat za odnose sa vjerskim zajednicama\\n\\nRok:
  I kvartal\\n\\n2. Organizovati Okrugli sto na temu \u201eMe\u0111ureligijska, me\u0111uvjerska
  tolerancija i dijalog\\\"\\n\\nCrna Gora mora promovisati univerzalne vrijednosti
  zasnovane na me\u0111uvjerskom i me\u0111ureligiskom dijalogu, koji je zasnovan
  na solidarnosti i odgovornosti, na jednakosti svih religija i uvjerenja. Na ovaj
  na\u010din stvaraju se i grade demokratske politi\u010dke zajednice i dobri me\u0111uljudski
  odnosi. Ministarstvo za ljudska i manjinska prava mora u ovom dijalogu imati aktivnu
  ulogu, jer i u ovoj oblasti moramo usvajati me\u0111unarodne standarde i na taj
  na\u010din unaprje\u0111ujemo op\u0161ti ekonomski, bezbjedonosni i politi\u010dki
  prosperitet.\\n\\nObra\u0111iva\u010d: Direktorat za odnose sa vjerskim zajednicama\\n\\nRok:
  I kvartal\\n\\n3. Organizovati Regionalnu Konferenciju na temu: \u201eNormativni
  i institucionalni okvir za odnose dr\u017eave i vjerskih zajednica: evropski standardi
  i regionalna rje\u0161enja\\\"\\n\\nNa ovoj Konferenciji zemlje u\u010desnice su:
  Slovenija, Hrvatska, Srbija, Makedonija, Bosna i Hercegovina, Albanija, Kosovo i
  Crna Gora, odnosno kolege direktori Direktorata za odnose sa vjerskim zajednicama.
  Bi\u0107e posve\u0107ena pa\u017enja va\u017enom pitanju normativnog i institucionalnog
  okvira za odnose dr\u017eave i vjerskih zajednica, odnosno implementacije evropskih
  standarda i regionalnih rje\u0161enja.\\n\\nObra\u0111iva\u010d: Direktorat za odnose
  sa vjerskim zajednicama\\n\\nRok: I kvartal\\n\\n4. Organizovati Konferenciju na
  temu \u201eNormativni i pravni okvir u oblasti religijskih prava ili vjerovanja\\\"\\n\\nNa
  ovoj Konferenciji u\u010desnici bi raspravljali o normativnom i pravnom okviru u
  oblasti religijskih prava ili vjerovanja sa ciljem da se konceptualizuju i implementiraju
  preporuke OEBS-a. Takav koncept podrazumijeva da dr\u017eave rade i sara\u0111uju
  sa me\u0111unarodnim organizacijama, civilnim dru\u0161tvom, religijskim i vjerskim
  zajednicama kako bi izgradile koherentan pristup implementaciji me\u0111unarodnih
  standarda u oblasti ljudskih prava uklju\u010duju\u0107i prevenciju od nasilja.\\n\\nObra\u0111iva\u010d:
  Direktorat za odnose sa vjerskim zajednicama\\n\\nRok: II kvartal\\n\\n5. Prezentacija
  me\u0111unarodnih nau\u010dnih mre\u017ea u oblasti prava i religije\\n\\nNa ovoj
  prezentaciji u\u010desnici \u0107e imati priliku za diskusiju na temu prava i religije:
  nauka i stvarnost.\\n\\nObra\u0111iva\u010d: Direktorat za odnose sa vjerskim zajednicama\\n\\nRok:
  III kvartal\\n\\n6. Organizovati Konferenciju na temu \u201eSloboda vjeroispovjesti:
  Pitanja, mogu\u0107nosti, specifi\u010dni izazovi u borbi sa antisemitizmom i netolerancijom,
  diskriminacijom protiv Hri\u0161\u0107ana, Muslimana i pripadnika drugih religija\\\"\\n\\nKonferencija
  \u0107e biti prilika za diskusiju o postoje\u0107im izazovima sa kojima se dr\u017eave,
  relevantne institucije i organi, suo\u010davaju prilikom sprovo\u0111enja obaveza
  u oblasti slobode vjeroispovjesti, tolerancije i nediskriminacije. Tako\u0111e,
  bi\u0107e prilika za razmjenu mi\u0161ljenja o multidimenzionalnoj prirodi ovog
  pitanja i njegovom uticaju na sigurnost i stabilnost u regionu.\\n\\nObra\u0111iva\u010d:
  Direktorat za odnose sa vjerskim zajednicama\\n\\nRok: III kvartal\\n\\n7. Organizovati
  Konferenciju na temu \u201eOdgovornost dr\u017eava, institucija i pojedinaca u borbi
  protiv antisemitizma i antisemitskih zlo\u010dina iz mr\u017enje\\\"\\n\\nPosveti\u0107emo
  pa\u017enju ovoj veoma va\u017enoj temi u cilju ja\u010danja napora u borbi protiv
  netolerancije i diskriminacije, uklju\u010duju\u0107i prema Muslimanima, Hri\u0161\u0107anima
  i pripadnicima drugih religija.\\n\\nObra\u0111iva\u010d: Direktorat za odnose sa
  vjerskim zajednicama\\n\\nRok: IV kvartal\\n\\n8. Saradnja i finansijska podr\u0161ka
  vjerskim zajednicama u Crnoj Gori\\n\\nMinistarstvo \u0107e nastaviti aktivnosti
  na implementaciji potpisanog Temeljnog ugovora izme\u0111u Crne Gore i Svete Stolice,
  Ugovora o pitanjima od zajedni\u010dkog interesa sa Islamskom zajednicom u Crnoj
  Gori i Jevrejskom zajednicom u Crnoj Gori. U cilju unapre\u0111enja dalje saradnje
  sa vjerskim zajednicama, Ministarstvo \u0107e kroz dijalog raditi na iznala\u017eenju
  najboljih rje\u0161enja da se i sa Pravoslavnom, odnosno Pravoslavnim crkvama zaklju\u010di
  sporazum koji \u0107e definisati saradnju Dr\u017eave sa Pravoslavnim crkvama u
  Crnoj Gori. Nastavi\u0107e se finansijska podr\u0161ka rada svim vjerskim zajednicama
  u Crnoj Gori u granicama raspolo\u017eivih bud\u017eetskih sredstava.\\n\\nObra\u0111iva\u010d:
  Direktorat za odnose sa vjerskim zajednicama\\n\\nRok: Kontinuirano\\n\\n9.\\n\\nPra\u0107enje
  sprovo\u0111enja aktivnosti Mje\u0161ovite komisije za implementaciju Temeljnog
  ugovora i Ugovora o ure\u0111enju odnosa od zajedni\u010dkog interesa Vlade Crne
  Gore i\\n\\nIslamske zajednice i Jevrejske zajednice u Crnoj Gori\\n\\nU skladu
  sa Zaklju\u010dkom Vlade Crne Gore, br. 08-2912/3 od 19. decembra 2013. godine,
  Ministarstvo je, u saradnji sa Ministarstvom vanjskih poslova i evropskih integracija,
  formiralo Mje\u0161ovitu komisiju za implementaciju Temeljnog ugovora i Ugovora
  o ure\u0111enju odnosa od zajedni\u010dkog interesa Vlade Crne Gore i Islamske zajednice
  u Crnoj Gori, kao i Ugovora o ure\u0111enju odnosa od zajedni\u010dkog interesa
  Vlade Crne Gore i Jevrejske zajednice u Crnoj Gori, te u skladu sa Odlukama o formiranju
  dijela tih komisija, Ministarstvo za ljudska i manjinska prava u obavezi je da obavlja
  administrativno-tehni\u010dke poslove za potrebe istih.\\n\\nObra\u0111iva\u010d:
  Direktorat za odnose sa vjerskim zajednicama\\n\\nRok: Kontinuirano\\n\\n4. ODJELJENJE
  ZA POSLOVE RODNE RAVNOPRAVNOSTI\\n\\nA. Tematski dio\\n\\n1. Izvje\u0161taj o realizaciji
  Plana aktivnosti za postizanje rodne ravnopravnosti za period 2017-2021. za 2017.
  godinu\\n\\nPlan aktivnosti za postizanje rodne ravnopravnosti, koji je Vlada Crne
  Gore usvojila u martu 2017. godine, done\u0161en je za period 2017-2021. Postoji
  potreba kontinuiranog  pra\u0107enja realizacije aktivnosti plana postizanja rodne
  ravnopravnosti za predvi\u0111eni period. U vezi sa tim, Ministarstvo priprema godi\u0161nji
  Izvje\u0161taj o realizaciji aktivnosti iz navedenog plana na osnovu izvje\u0161taja
  nosioca aktivnosti. Izvje\u0161taj treba da sadr\u017ei ocjenu stanja rodne ravnopravnosti
  u pojedina\u010dnim oblastima, rezultate sprovedenih mjera, te preporuke za dalje
  unapre\u0111enje rodne ravnopravnosti. S obzirom na to da se prate\u0107i Program
  sprovo\u0111enja aktivnosti donosi za period od dvije godine, te da je Program sprovo\u0111enja
  PAPRR-a koji je Vlada usvojila u martu 2017. godine, predvidio aktivnosti za 2017.
  i 2018. godinu, to je neophodno sa\u010diniti Izvje\u0161taj o realizaciji aktivnosti
  predvi\u0111enih ovim Programom za 2017. godinu.\\n\\nObra\u0111iva\u010d: Ministarstvo
  za ljudska i manjinska prava\\n\\nRok: I kvartal 2018. godine\\n\\nNadle\u017ena
  radna tijela Vlade: Komisija za politi\u010dki sistem, unutra\u0161nju i vanjsku
  politiku; Komisija za ekonomsku politiku i finansijski system\\n\\n2. Sprovoditi
  edukacije za kadar u obrazovno-vaspitnim ustanovama na svim nivoima po pitanju nasilja
  u porodici i nasilja nad \u017eenama, o jednakoj zastupljenosti \u017eena i mu\u0161karaca
  u svim sferama drustvenog \u017eivota\\n\\nPitanja nasilja i diskriminacije su kao
  posebno va\u017ena prepoznata i me\u0111unarodnim dokumentima: CEDAW konvencija
  i Istanbulska konvencija. U cilju realizacije predvi\u0111eno je odr\u017eavanje
  obuka za stru\u010dnjake koji rade u obrazovnom sistemu, \u0161to podrazumijeva
  i nastavnike i profesore gra\u0111anskog obrazovanja i vaspitanja. Odjeljenje planira
  odr\u017eavanje \u0161to ve\u0107eg broja radionica na navedenu temu, u zavisnosti
  od odobrenih sredstava.\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok:
  II kvartal\\n\\n3. Edukacije za zaposlene u medijima na temu rodne ravnopravnosti\\n\\nU
  PAPRR-u je kao posebna oblast djelovanja prepoznata ravnopravnost u medijima i kulturi
  i strate\u0161ki cilj suzbijanje rodnih stereotipa i uvo\u0111enje politike rodne
  ravnopravnosti u medijima i kulturi. U cilju realizacije predvi\u0111eno je odr\u017eavanje
  edukativnih radionica za zaposlene u\\n\\nProgram rada Ministarstva za ljudska i
  manjinska prava za 2018. godinu medijima i kulturi na temu rodne ravnopravnosti
  kao jednom od na\u010dina podizanja svijesti na pomenutu temu. Odjeljenje planira
  odr\u017eavanje jedne radionice na navedenu temu.\\n\\nObra\u0111iva\u010d: Odjeljenje
  za poslove rodne ravnopravnosti\\n\\nRok: II kvartal\\n\\n4.\\n\\nOrganizovati javne
  tribine, konferencije, predavanja o nasilju nad \u017eenama kao i obuke raznih ciljnih
  grupa\\n\\nPlanom aktivnosti za postizanje rodne ravnopravnosti je predvi\u0111eno
  da se sprovode kampanje podizanja svijesti o me\u0111unarodnim i doma\u0107im instrumentima
  za za\u0161titu ljudskih prava \u017eena i kampanje u borbi protiv nasilja. U vezi
  sa tim kao jedna od aktivnosti predvi\u0111eno je i odr\u017eavanje redovnih regionalnih
  mehanizama za rodnu ravnopravnost.\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove
  rodne ravnopravnosti\\n\\nRok: II kvartal\\n\\n5. Organizovanje dva foruma za saradnju
  sa NVO\\n\\nNacionalnim strate\u0161kim dokumentom za rodnu ravnopravnost predvi\u0111eno
  je ja\u010danje saradnje sa \u017eenskim NVO - ima u primjeni i pra\u0107enju implementacije
  me\u0111unarodnih i doma\u0107ih standarda za rodnu ravnopravnost. U primjeni i
  pra\u0107enju implementacije me\u0111unarodnih i doma\u0107ih standarda za rodnu
  ravnopravnost, sa tim kao jedna od aktivnosti predvi\u0111eno je i organizovanje
  redovnih sasatanaka - foruma za dijalog sa predstavnicima civilnog dru\u0161tva.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: III kvartal\\n\\n6. Organizovanje
  konferencije o razmatranju CEDAW preporuka\\n\\nCrna Gora je u\u010destvovala na
  67. zasijedanju CEDAW komiteta povodom odbrane II periodi\u010dnog izvje\u0161taja
  o sprovo\u0111enju CEDAW konvencije, jula 2017. godine. Nakon toga, Crnoj Gori su
  upu\u0107ena zaklju\u010dna razmatranja i preporuke CEDAW komiteta, prevedene na
  crnogorski jezik, koji su proslije\u0111eni na uvid svim zainteresovanim stranama.
  U tom cilju planirano je organizovanje konferencije na kojoj \u0107e se razmatrati
  CEDAW preporuke. Konferencija \u0107e okupiti koordinatore za rodnu ravnopravnosti
  na nacionalnom i lokalnom nivou, predstavnike Skup\u0161tine i lokalnih parlamenata,
  medija, me\u0111unarodnih organizacija i NVO sektora.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: III kvartal\\n\\n7. Obuka inspektora
  rada i sudija zadu\u017eenih za pra\u0107enje i kontrolu primjene Zakona o rodnoj
  ravnopravnosti, Zakona o radu, Zakona o zabrani diskriminacije i drugih zakona\\n\\nPlanom
  aktivnosti za postizanje rodne ravnopravnosti 2017-2021. se kao jedna od mjera predvi\u0111a
  i pove\u0107anje informisanosti i unapre\u0111ivanje nivoa znanja sudija i tu\u017eilaca
  zadu\u017eenih za pra\u0107enje i kontrolu primjene pravnih normi - o pitanjima
  rodne ravnopravnosti (me\u0111unarodnim okvirima \u2013 Pekin\u0161koj deklaraciji,
  CEDAW konvenciji, OP, Istanbulskoj konvenciji i drugim dokumenatima); ja\u010danje
  kapaciteta za primjenu rodne ravnopravnosti u svakodnevnom radu i na temu za\u0161tite
  od rodne diskriminacije primjenom va\u017ee\u0107eg Zakona o rodnoj ravnopravnosti
  i antidiskriminatornih normi - Zakona o radu, Zakona o zabrani diskriminacije i
  drugih zakona.\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok:
  IV kvartal\\n\\n8. Organizovanje okruglih stolova, obuka i podr\u0161ka ekonomskom
  osna\u017eivanju \u017eena.\\n\\n\u017densko preduzetni\u0161tvo predstavlja samo
  9,6% ukupnih registrovanih preduzetni\u010dkih firmi. Imaju\u0107i u vidu da ukupan
  ekonomski program dr\u017eava oslanja na razvoj preduzetni\u010dkog potencijala
  u zemlji ovaj podatak o \u017eenama i preduzetni\u0161tvu  dolazi kao razlog za
  zna\u010dajnu zabrinutost zbog upotrebe ljudskog kapitala, ali i rodne dimenzije
  razvoja u ekonomiji.\\n\\nU vezi sa tim, planira se odr\u017eavanje okruglih stola
  i obuka na pomenutu temu, u zavisnosti od odobrenih sredstava, kao i konferencija/savjetovanja
  za razmjenu dobre i lo\u0161e prakse \u017eena preduzetnica, na kojima \u0107e u\u010destvovati
  i pripadnice nacionalnih manjina i lica s invaliditetom.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: IV kvartal\\n\\n9. Nastaviti
  edukacije za nosioce pravosudnih funkcija, kao i advokate na temu primjene me\u0111unarodnog
  i doma\u0107eg zakonodavstva iz oblasti za\u0161tite od nasilja nad \u017eenama
  i nasilja u porodici \u2013 CEDAW konvencija i Istanbulska konvencija\\n\\nOva oblast
  je kao posebno va\u017ena prepoznata i me\u0111unarodnim dokumentima: CEDAW konvencija
  i Istanbulska konvencija. Tako\u0111e je i doma\u0107im dokumentima prepoznata oblast
  rodno zasnovano nasilje i suzbijanje svih oblika nasilja nad \u017eenama. U cilju
  realizacije predvi\u0111eno je odr\u017eavanje obuka za stru\u010dnjake koji rade
  u oblasti za\u0161tite od nasilja, \u0161to podrazumijeva i nosioce\\n\\nProgram
  rada Ministarstva za ljudska i manjinska prava za 2018. godinu pravosudnih funkcija
  i advokate. Odjeljenje planira odr\u017eavanje \u0161to ve\u0107eg broja radionica
  na navedenu temu, u zavisnosti od odobrenih sredstava.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: IV kvartal\\n\\n10. Kampanja
  u sklopu obilje\u017eavanja \u201e16 dana aktivizma u borbi protiv nasilja nad\\n\\n\u017eenama\\\"\\n\\nOblast
  nasilja je kao posebno va\u017ena prepoznata i me\u0111unarodnim dokumentima: CEDAW
  konvencija i Istanbulska konvencija. U vezi sa tim predvi\u0111a se sprovo\u0111enje
  kampanje koja \u0107e za cilj imati pove\u0107anu informisanost i podizanje svijesti
  javnosti o pojavi i posledicama rodno zasnovanog nasilja, a sve u sklopu obilje\u017eavanja
  \u201e16 dana aktivizma u borbi protiv nasilja nad \u017eenama\\\". Kampanja \u0107e
  biti usmjerena i na pripadnice RE populacije zbog nagla\u0161avanja potrebe obrazovanja
  i nastavka \u0161kolovanja. Tema suzbijanja nasilja se tretira kao izuzetno prepoznata
  i Planom aktivnosti za postizanje rodne ravnopravnosti 2017-2021.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: IV kvartal\\n\\n11. Izrada
  publikacije \u201e\u017dene i mu\u0161karci u Crnoj Gori\\\"\\n\\nPAPRR predvi\u0111a
  dvogodi\u0161nje publikovanje rezultata istra\u017eivanja i statisti\u010dki prikupljenih
  podataka o zastupljenosti mu\u0161karaca i \u017eena na svim nivoima, u saradnji
  sa Zavodom za statistiku\\n\\nCrne Gore \u2013 MONSTAT. S tim u vezi, predvi\u0111ena
  je izrada navedene publikacije2018. godine.\\n\\nObra\u0111iva\u010d: Odjeljenje
  za poslove rodne ravnopravnosti\\n\\nRok: IV kvartal\\n\\n12. Obilje\u017eavanje
  me\u0111unarodnih dana\\n\\nPlanom aktivnosti za postizanje rodne ravnopravnosti
  2017-2021. je kao oblast djelovanja prepoznato i unaprije\u0111enje ljudskih prava
  \u017eena i rodne ravnopravnosti, te u vezi sa tim kao strate\u0161ki cilj uspostavljanje
  dru\u0161tva jednakih mogu\u0107nosti. U vezi sa tim kao jedna od aktivnosti predvi\u0111eno
  je i obilje\u017eavanje Me\u0111unarodnog dana \u017eena 8. mart, te obilje\u017eavanje
  Me\u0111unarodnog dana preduzetnica \u2013 tre\u0107i petak u mjesecu maju, kao
  i Dana \u017eena sa sela 15. oktobar. Organizovanjem simboli\u010dnih aktivnosti
  \u0107e se obilje\u017eiti ovi me\u0111unarodni dani.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: kontinuirano\\n\\n13. Odr\u017eavanje
  sastanaka Nacionalnog savjeta za rodnu ravnopravnost\\n\\nOsnovan je Savjet za rodnu
  ravnopravnost kao tijelo koje prati implementaciju politike rodne ravnopravnosti
  u svim zakonskim i strate\u0161kim dokumentima na nacionalnom nivou, te implementaciju
  me\u0111unarodnih dokumenata u doma\u0107em zakonodavstvu. U cilju uspje\u0161nijeg
  pra\u0107enja implementacije me\u0111unarodnih i doma\u0107ih standarda za rodnu
  ravnopravnost, neophodno je odr\u017eavanje redovnih sjednica Savjeta, najmanje
  dva puta godi\u0161nje, koji \u0107e planiranom dinamikom i po potrebi odr\u017eavati
  tematske sjednice.\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok:
  kontinuirano\\n\\n14. Odr\u017eavanje redovnih sastanaka Komisije za pra\u0107enje
  Plana aktivnosti za postizanje rodne ravnopravnosti\\n\\nVlada Crne Gore je 30.
  marta 2017. godine je usvojila Plan aktivnosti za postizanje rodne ravnopravnosti
  2017-2021. i Program sprovo\u0111enja 2017-2018. godinu kojim je postavljen strate\u0161ki
  cilj: stvaranje odr\u017eivih mehanizama na nacionalnom i lokalnom nivou za postizanje
  rodne ravnopravnosti. Jedan od tih mehanizama je i Komisija za pra\u0107enje sprovo\u0111enja
  Plana aktivnosti za postizanje rodne ravnopravnosti 2017-2021. (Komisija za PAPRR),
  a \u0161to je i u skladu sa Zakonom o rodnoj ravnopravnosti. Nadle\u017enost Komisije
  je pra\u0107enje sprovo\u0111enja strate\u0161kog dokumenta za rodnu ravnopravnost
  \u2013 Plana aktivnosti za postizanje rodne ravnopravnosti 2017-2021. i prate\u0107eg
  akcionog plana \u2013 Programa sprovo\u0111enja 2017-2018. godinu. U cilju uspje\u0161nijeg
  pra\u0107enja implementacije PAPRR-a, neophodno je odr\u017eavanje redovnih sjednica
  Komisije, najmanje jedan put godi\u0161nje, a po potrebi tematskih sjednica.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za poslove rodne ravnopravnosti\\n\\nRok: kontinuirano\\n\\n15. Odr\u017eavanje
  redovnih sastanaka koordinacionog odbora za osnivanje Muzeja \u017eena\\n\\nU cilju
  organizovanja i realizacije kulturno umjetni\u010dkih programa i projekata koji
  afirmi\u0161u rodnu ravnopravnost, a u cilju promovisanja \u017eenskog istorijsko-kulturnog
  nasle\u0111a CrneGore, Odjeljenje u saradnji sa drugim nadle\u017enim institucijama
  organizuje sastanke Muzeja \u017eena.\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove
  rodne ravnopravnosti\\n\\nRok: kontinuirano\\n\\n16. Podr\u0161ka op\u0161tinama
  \u2013 obuke - nastaviti saradnju i podr\u0161ku op\u0161tinama u cilju efikasnije
  primjene politika rodne ravnopravnosti na lokalnom nivou\\n\\nMinistarstvo za ljudska
  i manjinska prava \u0107e u 2018. godini raditi na daljem unapre\u0111enju saradnje
  sa lokalnim samoupravama i razvoju mre\u017ee koordinatorki (organizovanjem sastanaka
  i susreta o ljudskim pravima s predstavnicima op\u0161tina, edukovanjem slu\u017ebenika
  iz lokalne samouprave na temu rodne ravnopravnosti, ekonomskog, politi\u010dkog
  osna\u017eivanja \u017eena i suzbijanja nasilja nad \u017eenama i nasilja u porodici,
  potpisivanjem memoranduma, podr\u0161kom u kampanjama i  pri izradi lokalnih akcionih
  planova za rodnu ravnopravnost).\\n\\nObra\u0111iva\u010d: Odjeljenje za poslove
  rodne ravnopravnosti\\n\\nRok: kontinuirano\\n\\n5. ODJELJENJE ZA UNAPRE\u0110ENJE
  I ZA\u0160TITU PRAVA ROMA I EGIP\u0106ANA\\n\\nA. Tematski dio\\n\\n1. Izvje\u0161taj
  o implementaciji Akcionog plana za sprovo\u0111enje  Strategije za inkluziju Roma
  i Egip\u0107ana u Crnoj Gori  2016-2020. u 2017. godini\\n\\nOvim Izve\u0161tajem
  da\u0107e se prikaz mjera i aktivnosti na sprovo\u0111enju i evaluaciji Strategije
  za inkluziju Roma i Egip\u0107ana u Crnoj Gori 2016-2020. u 2017. godini, a Akcionim
  planom \u0107e se definisati mjere i aktivnosti, nadle\u017eni organi i rokovi za
  sprovo\u0111enje pojedinih aktivnosti za 2018.\\n\\nPredlaga\u010d: Ministarstvo
  za ljudska i manjinska prava\\n\\nRok: I kvartal\\n\\nNadle\u017eno radno tijelo
  Vlade: Komisija za politi\u010dki sistem, unutra\u0161nju i spoljnu politiku i Komisija
  za ekonomsku politiku i finansije\\n\\n2. Akcioni plan za sprovo\u0111enje Strategije
  za inkluziju Roma i Egip\u0107ana u Crnoj Gori 2016-2020. za 2018. godinu\\n\\nVlada
  Crne Gore je 24. 03. 2016. godine donijela Strategiju za socijalnu inkluziju Roma
  i Egip\u0107ana u Crnoj Gori 2016-2020. Strategijom je predvi\u0111eno da se ista
  realizuje kroz jednogodi\u0161nje Akcione planove koje donosi Vlada Crne Gore u
  prvom kvartalu teku\u0107e godine.\\n\\nPredlaga\u010d: Ministarstvo za ljudska
  i manjinska prava\\n\\nRok: I kvartal\\n\\nNadle\u017eno radno tijelo Vlade: Komisija
  za politi\u010dki sistem, unutra\u0161nju i spoljnu politiku i Komisija za ekonomsku
  politiku i finansije\\n\\n3. Obilje\u017eavanje 8.  aprila, Svjetskog dana Roma\\n\\nMinistarstvo
  \u0107e prigodnim programom obilje\u017eiti 8. april - Svjetski dan Roma.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana\\n\\nRok:
  II kvartal\\n\\n4. Pove\u0107ati svijest Roma i Egip\u0107ana o borbi protiv diskriminacije,
  nasilja u porodici, kao i rodnoj ravnopravnosti\\n\\nKoncept nediskriminacije potrebno
  je na razumljiv i jednostavan na\u010din  pribli\u017eiti  ranjivim grupama, posebno
  populaciji Roma i Egip\u0107ana, te ih treba upoznati sa oblicima, za\u0161titom,
  efektima i posledicama ovog fenomena, kako sa sociolo\u0161kog stanovi\u0161ta,
  tako i u formi pravnog instituta da bi mogle da za\u0161tite svoja prava.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana Rok: II
  kvartal\\n\\n5. Unapre\u0111ivanje zdravlja romske i egip\u0107anske populacije/preventivni
  pregledi\\n\\nMinistarstvo za ljudska i manjinska prava \u0107e u saradnji sa Ministarstvom
  zdravlja povremeno organizovati akcije preventivnih pregleda za pripadnike/ce romske
  i egip\u0107anske populacije.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje
  i za\u0161titu prava Roma i Egip\u0107ana Rok: II kvartal\\n\\n6. Program stipendiranja
  romskih srednjo\u0161kolaca i studenata\\n\\nU saradnji sa Zavodom za \u0161kolstvo
  i Romskim obrazovnim fondom nastavi\u0107e se sa aktivnostima stipendiranja srednjo\u0161kolaca
  i studenata romske i egip\u0107anske populacije u Crnoj Gori.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana Rok: III
  kvartal\\n\\n7. Obezbje\u0111ivanje besplatnih ud\u017ebenika za  u\u010denike romske
  i egip\u0107anske populacije I, II i III razreda osnovne \u0161kole\\n\\nMinistarstvo
  \u0107e obezbjediti sredstva i u saradnji sa Ministarstvom prosvjete, izvr\u0161iti
  nabavku i distribuciju ud\u017ebenika i \u0161kolskog pribora za sve romske u\u010denike
  I, II i III razreda osnovne \u0161kole.\\n\\nObra\u0111iva\u010d: Odjeljenje za
  unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana Rok: III kvartal\\n\\n8.\\n\\nObilje\u017eavanje
  5. novembra, Svjetskog dana romskog jezika\\n\\nMinistarstvo \u0107e prigodnim programom
  obilje\u017eiti 5. novembar, Svjetski dan romskog jezika.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana\\n\\nRok:
  IV kvartal\\n\\n9. Organizovati edukacije za pripadnice nacionalnih manjina, sa
  fokusom na Romkinje i Egip\u0107anke, u cilju osna\u017eivanja za bavljenje politikom\\n\\nMinistarstvo
  za ljudska i manjinska prava \u0107e organizovati edukacije za pripadnice nacionalnih
  manjina sa fokusom na Romkinje u cilju osna\u017eivanja za bavljenje politikom.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana\\n\\nRok:
  IV kvartal\\n\\n10. Saradnja sa lokalnim samoupravama na polju izrade i sprovo\u0111enja
  lokalnih Akcionih planova za Rome i Egip\u0107ane\\n\\nMinistarstvo \u0107e uspostaviti
  saradnju sa organima lokalne samouprave u sredinama gdje Romi i Egip\u0107ani \u010dine
  zna\u010dajan dio stanovni\u0161tva u cilju izrade i sprovo\u0111enja lokalnih Akcionih
  planova za Rome i Egip\u0107ane.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje
  i za\u0161titu prava Roma i Egip\u0107ana\\n\\nRok: IV kvartal\\n\\n11. Edukacija
  roditelja, djece, RE aktivistkinja, slu\u017ebenika/ca dr\u017eavne uprave o za\u0161titi
  od nasilja u porodici i maloljetni\u010dkih i prisilnih brakova me\u0111u romskom
  i egip\u0107anskom populacijom\\n\\nMinistarstvo za ljudska i manjinska prava \u0107e
  organizovati edukacije za pomenute kategorije lica u cilju podizanja svijesti o
  za\u0161titi od nasilja u porodici i maloljetni\u010dkim prisilnim  brakovima me\u0111u
  romskom i egip\u0107anskom populacijom.\\n\\nObra\u0111iva\u010d: Odjeljenje za
  unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana\\n\\nRok: kontinuirano\\n\\n12.
  Organizovati kampanje u romskim i egip\u0107anskim naseljima o problemu nasilja
  u porodici i dje\u010djim prisilnim brakovima u romskoj i egip\u0107anskoj zajednici\\n\\nMinistarstvo
  za ljudska i manjinska prava \u0107e organizovati kampanje u romskim naseljima o
  problemu nasilja u porodici i prisilnim brakovima me\u0111u romskom i egip\u0107anskom
  populacijom.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje i za\u0161titu
  prava Roma i Egip\u0107ana\\n\\nRok: kontinuirano\\n\\n13. Organizacija tematskih
  okruglih stolova sa NVO sektorom\\n\\nU skladu sa dogovorenom dinamikom, Ministarstvo
  \u0107e u saradnji sa predstavnicima nevladinih organizacija organizovati okrugle
  stolove na dogovorene teme.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje
  i za\u0161titu prava Roma i Egip\u0107ana Rok: Kontinuirano\\n\\n14. Podizanje nivoa
  javne svijesti o potrebi suzbijanja diskriminacije pripadnika/ca romske i egip\u0107anske
  nacionalne zajednice\\n\\nU cilju suzbijanja diskriminacije pripadnika/ca romske
  i egip\u0107anske manjine bi\u0107e organizovane aktivnosti usmjerene na edukovanje
  pripadnike/ce Roma i Egip\u0107ana, nadle\u017enih institucija, stru\u010dne zajednice,
  \u0161ire javnosti, medija kao i civilnog sektora o  antidisktiminacijskom zakonodavstvu
  i njegovoj primjeni u praksi u cilju upoznavanja romske nacionalne manjine o njihovim
  pravima i odgovornostima u pogledu suzbijanja diskriminacije, sa posebnim naglaskom
  na polo\u017eaj Romkinja i Egip\u0107anki.\\n\\nObra\u0111iva\u010d: Odjeljenje
  za unapre\u0111enje i za\u0161titu prava Roma i Egip\u0107ana Rok: Kontinuirano\\n\\n15.
  Organizacija ljetnjih i zimskih boravaka u dje\u010dijim odmarali\u0161tima za u\u010denike
  romske i egip\u0107anske populacije\\n\\nMinistarstvo \u0107e za najbolje u\u010denike
  zavr\u0161nih razreda osnovne \u0161kole romske i egip\u0107anske populacije obezbjediti
  vi\u0161ednevne boravake u dje\u010dijim odmarali\u0161tima u cilju motivacije za
  daljim obrazovanjem.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje i
  za\u0161titu prava Roma i Egip\u0107ana Rok: Kontinuirano\\n\\n16. Regionalni projekat
  \u00bb Integracija Roma 2020 \u00ab\\n\\nCrna Gora je jedna od zemalja potpisnica
  integrativnog procesa Regionalnog projekta \u201eIntegracija Roma 2020\\\". Projekat  implementira
  Savjet za regionalnu saradnju, finansiraju Evropska unija i Fondacija za otvoreno
  dru\u0161tvo i zapravo \u010dini nastavak Dekade za inkluziju Roma 2005-2015. Glavni
  cilj projekta je ekonomska i dru\u0161tvena integracija romskog stanovni\u0161tva
  u zemljama Zapadnog Balkana i Turske, te ja\u010danje institucionalne obaveze vlada
  u regionu da ugrade i ispune konkretne ciljeve za integraciju Roma u glavne tokove
  politi\u010dkog razvoja.\\n\\nObra\u0111iva\u010d: Odjeljenje za unapre\u0111enje
  i za\u0161titu prava Roma i Egip\u0107ana Rok: Kontinuirano\\n\\n6. ODJELJENJE ZA
  EVROPSKE INTEGRACIJE, PROGRAMIRANJE I IMPLEMENTACIJU EU FONDOVA\\n\\nA. Tematski
  dio\\n\\n1. Koordiniranje i pra\u0107enje sprovo\u0111enja projekta IPA 2014 \\\"Podr\u0161ka
  antidiskriminacionim i politikama rodne ravnopravnosti\\\"\\n\\nMinistarstvo za
  ljudska i manjinska prava je korisnik projekta IPA 2014 \\\"Podr\u0161ka antidiskriminacionim
  i politikama rodne ravnopravnosti\\\" koji je finasiran iz pretpristupnih fondova
  Evropske unije i kojeg implementira kancelarija UNDP-a u Crnoj Gori. Implementacija
  navedenog projekta je po\u010dela 2016, aktivnosti su sprovo\u0111ene 2017. i nastavi\u0107e
  se i u 2018. godini. Odjeljenje \u0107e pratiti sprovo\u0111enje ovog IPA projekta,
  odr\u017eavati redovne sastanke sa implementatorom projekta, u cilju \u0161to boljeg
  sprovo\u0111enja aktivnosti.\\n\\nObra\u0111iva\u010d: Odjeljenje za evropske integracije,
  programiranje i implementaciju EU fondova Rok: kontinuirano\\n\\n2. Koordiniranje
  i pra\u0107enje sprovo\u0111enja IPA 2015 projekta \u201ePromocija i za\u0161tita
  ljudskih prava Roma i Egip\u0107ana i drugih ranjivih grupa\\\"\\n\\nMinistarstvo
  za ljudska i manjinska prava je korisnik projekta IPA 2015 \u201ePromocija i za\u0161tita
  ljudskih prava Roma i Egip\u0107ana\\\" koji je finasiran iz pretpristupnih fondova
  Evropske unije i kojeg implementira kancelarija HELP u Crnoj Gori. Implementacija
  navedenog projekta je po\u010dela u 2017. godini, i nastavi\u0107e se sa aktivnostima
  i u 2018. godini.\\n\\nOdjeljenje \u0107e pratiti sprovo\u0111enje ovog IPA projekta,
  odr\u017eavati redovne sastanke sa implementatorom projekta, u cilju \u0161to boljeg
  sprovo\u0111enja aktivnosti.\\n\\nObra\u0111iva\u010d: Odjeljenje za evropske integracije,
  programiranje i implementaciju EU fondova Rok: 2018. godina\\n\\n3. Priprema projekata
  za apliciranje za pretpristupne fondove EU, kao i za apliciranje kod me\u0111unarodnih
  organizacija ili dr\u017eava koje \u0107e ponuditi donatorska sredstva\\n\\nMinistarstvo
  za ljudska i manjinska prava je ve\u0107 korisnik IPA projekata, a u 2018. \u0107e
  se nastaviti sa aktivnostima apliciranja za pretpristupne fondove EU, kao i za apliciranje
  kod me\u0111unarodnih organizacija ili dr\u017eava koje \u0107e ponuditi donatorska
  sredstva za odre\u0111ene kategorije projekata. Odjeljenje \u0107e nastaviti da
  koordinira ovim aktivnostima i da u saradnji sa Ministarstvom evropskih poslova
  i Ministarstvom vanjskih poslova predla\u017ee odgovaraju\u0107e projekte, za sprovo\u0111enje
  aktivnosti iz nadle\u017enosti Ministarstva za ljudska i manjinska prava.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za evropske integracije, programiranje i implementaciju EU fondova Rok:
  kontinuirano\\n\\n4. Koordiniranje i pra\u0107enje sprovo\u0111enja SOP projekta\\n\\nMinistarstvo
  za ljudska i manjinska prava je jedan od korisnika projekta Sektorskog operativnog
  programa za zapo\u0161ljavanje, obrazovanje i socijalnu politiku 2015-2017. (SOP)
  koji \u0107e biti finasiran iz fondova Evropske unije. Implementacija navedenog
  projekta bi trebala da po\u010dne u 2018. godini. Ovaj projekat \u0107e se sprovoditi
  po principu \u201edecentralizovanog modela\\\", \u0161to zna\u010di da \u0107e u
  nadle\u017enosti Ministarstvo za ljudska i manjinska prava biti implementacija akcije
  u okviru SOP-a \u201eUklju\u010divanje marginalizovanih grupa u dru\u0161tvo\\\"
  \u010dija je vrijednost 600.000,00 eura. Odjeljenje \u0107e sprovodite i sve neophodne
  procedure za implementaciju ove akcije u okviru SOPa, kao i pratiti njeno sprovo\u0111enje.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za evropske integracije, programiranje i implementaciju EU fondova Rok:
  kontinuirano\\n\\n5. Pra\u0107enje realizacije i priprema izvje\u0161taja o realizaciji
  mjera iz Programa pristupanja Crne Gore Evropskoj uniji, kao i akcionih planova
  za pregovara\u010dka poglavlja 23 i 19\\n\\nOdjeljenje \u0107e pratiti implementaciju
  definisanih obaveza iz Programa pristupanja Crne Gore Evropskoj uniji. U cilju pra\u0107enja
  realizacije mjera i pripreme izvje\u0161taja za implementaciju Akcionih planova
  za Pregovara\u010dka poglavlja 23 Pravosu\u0111e i temeljna prava i 19 Socijalna
  politika i zapo\u0161ljavanje, Odjeljenje \u0107e pratiti implementaciju definisanih
  mjera u Akcionim planovima za ova poglavlja i koordinirati procesom pripreme i slanja
  informacija iz nadle\u017enosti Ministarstva za ljudska i manjinska prava za periodi\u010dne
  izvje\u0161taje za ova poglavlja.\\n\\nObra\u0111iva\u010d: Odjeljenje za evropske
  integracije, programiranje i implementaciju EU fondova Rok: kontinuirano\\n\\n6.
  Koordiniranje aktivnosti iz TAIEX programa EU\\n\\nOdjeljenje \u0107e pratiti i
  koordinirati aktivnosti iz TAIEX programa (Instrument tehni\u010dke podr\u0161ke
  i razmjene informacija) Evropske Komisije, i pratiti doga\u0111aje koje organizuje
  Ministarstvo za ljudska i manjinska prava, u cilju realizacije obaveza iz akcionih
  planova za pregovara\u010dka poglavlja i strate\u0161kih dokumenata iz nadle\u017enosti
  Ministarstva.\\n\\nObra\u0111iva\u010d: Odjeljenje za evropske integracije, programiranje
  i implementaciju EU fondova Rok: kontinuirano\\n\\n7. Organizovanje obuka za pisanje
  projekata finansiranih iz pretpristupnih fondova EU\\n\\nU saradnji sa nadle\u017enim
  institucijama bi\u0107e organizovane obuke za slu\u017ebenike/ce u Ministarstvu
  za ljudska i manjinska prava za pisanje projekata finansiranih iz pretpristupnih
  fondova EU. Obra\u0111iva\u010d: Odjeljenje za evropske integracije, programiranje
  i implementaciju EU fondova Rok: kontinuirano\\n\\n8. Organizovanje radionica iz
  oblasti evropskih integracija\\n\\nOdjeljenje \u0107e organizovati radionice za
  slu\u017ebenike u Ministarstvu za ljudska i manjinska prava iz oblasti evropskih
  integracija, u cilju njihovog boljeg upoznavanja sa procesom pristupanja EU.\\n\\nObra\u0111iva\u010d:
  Odjeljenje za evropske integracije, programiranje i implementaciju EU fondova Rok:
  kontinuirano\\n\\n9. Organizovanje tematskih konferencija, okruglih stolova i kampanja\\n\\nOblast
  ljudskih prava u okviru pristupanja EU je veoma bitna, naro\u010dito u kontekstu
  obaveza koje Crna Gora treba da ispuni u ovom procesu. Ministarstvo za ljudska i
  manjinska prava je ve\u0107 sprovodilo aktivnosti uskla\u0111ivanja zakonodavnog
  okvira sa EU standardima, kao i druge aktivnosti koje su od zna\u010daja za procese
  EU integracija. Neophodno je i dalje upoznavati \u0161iru javnost i  pove\u0107avati
  informisanost svih relevantnih institucija na nacionalnom i lokalnom nivou o zna\u010daju
  po\u0161tovanja ljudskih prava u procesu EU integracija. Odjeljenje \u0107e u tom
  cilju organizovati tematske konferencije, okrugle stolove i kampanje.\\n\\nObra\u0111iva\u010d:
  Rok: kontinuirano\\n\\nOdjeljenje za evropske integracije, programiranje i implementaciju
  EU fondova\\n\\n7. SLU\u017dBA ZA OP\u0160TE POSLOVE\\n\\nA. Tematski dio\\n\\n1.
  Analiza kadrovskih kapaciteta\\n\\nU skladu sa Pravilnikom o unutra\u0161njoj organizaciji
  i sistematizaciji koji je Vlada utvrdila novembru 2017. godine i njegovom implementacijom,
  u cilju ja\u010danja administrativnih kadrovskih kapaciteta Ministarstva za ljudska
  i manjinska prava, potrebno je, pored obuka zaposlenih koje se obavljaju u kontinuitetu
  i preraspodjele postoje\u0107ih kadrovskih kapaciteta, zaposliti nove slu\u017ebenike
  radi efikasnosti u radu za uspje\u0161no obavljanje poslova i radnih zadataka kako
  bi odgovorili obavezama iz djelokruga rada Ministarstva.\\n\\nObra\u0111iva\u010d:
  Slu\u017eba za op\u0161te poslove\\n\\nRok: IV kvartal\\n\\n2. Procedure Prijema
  slu\u017ebenika i namje\u0161tenika \u2013 razvoj ljudskih resursa\\n\\nNakon usvajanja
  Analize kadrovskih kapaciteta Ministarstva, kontinuirano \u0107e se sagledavati
  potreba za ja\u010danje, unapre\u0111enje i efikasnost kadrovskih kapaciteta za
  uspje\u0161no obavljanje poslova  i radnih zadataka iz djelokruga rada Ministarstva.\\n\\nOgla\u0161avanje
  slobodnih radnih mjesta, prijem slu\u017ebenika i  namje\u0161tenika i njihovo stru\u010dno
  usavr\u0161avanje na nivou Ministarstva \u0107e se vr\u0161iti u skladu sa Zakonom
  o dr\u017eavnim slu\u017ebenicima i\\n\\nnamje\u0161tenicima, Kadrovskim planom
  i Programom nadle\u017ene institucije za planiranje, organizovanje i usavr\u0161avanje
  slu\u017ebenika i namje\u0161tenika.\\n\\nObra\u0111iva\u010d: Slu\u017eba za op\u0161te
  poslove\\n\\nRok: Kontinuirano\\n\\n8. SLU\u017dBA ZA FINANSIJE\\n\\nA. Tematski
  dio\\n\\n1. Izrada i dostavljanje Godi\u0161njeg finansijskog izvje\u0161taja za
  2017. godinu Ministarstvu finansija \u2013 Dr\u017eavni trezor\\n\\nMinistarstvo
  dostavlja godi\u0161nje finansijske izvje\u0161taje za 2017. godinu Ministarstvu
  finansija \u2013 Dr\u017eavni trezor, do 28. 02. 2018. godine, na obrascima 3, 5,
  8, i 9. Tako\u0111e, do kraja januara 2018. Ministarstvo \u0107e dostaviti strukturu
  neizmirenih obaveza na dan 31. 12. 2017. godine. U skladu sa Me\u0111unarodnim ra\u010dunovodstvenim
  standardima za javni sektor na gotovinskoj i modifikovanoj gotovinskoj osnovi izvje\u0161tavanja
  o nov\u010danim tokovima i dostavljanju na obrascima iz \u010dlana  2 Pravilnika.\\n\\nObra\u0111iva\u010d:
  Slu\u017eba za finansijske poslove\\n\\nRok: I kvartal\\n\\n2. Izvje\u0161taj o
  popisu imovine  sa kojom raspola\u017ee Ministarstvo\\n\\nU skladu sa Zakonom o
  dr\u017eavnoj imovini i Uredbom o na\u010dinu vo\u0111enja pokretnih i nepokretnih
  stvari, Komisija formirana od strane Ministarstva na osnovu obilaska prostorija
  na stanje dana 31. 12. 2017. godine, u popisne liste unosi osnovna sredstva za svaku
  kancelariju pojedina\u010dno, amortizaciju osnovnih sredstava vodi u posebnu evidenciju
  OA obrasca po kontima, dostavlja podatke Upravi za imovinu u pisanoj i elektronskoj
  formi. Nakon toga, Komisija Izvje\u0161taj o popisu imovine dostavlja Ministru na
  uvid uz propratne obrasce.\\n\\nObra\u0111iva\u010d: Slu\u017eba za finansijske
  poslove\\n\\nRok: I kvartal\\n\\n3. Izrada Predloga bud\u017eeta Ministarstva za
  2019. godinu\\n\\nU cilju kvalitetne pripreme Zakona o bud\u017eetu Crne Gore za
  2019. godinu, Ministarstvo \u0107e izraditi svoj predlog za bud\u017eetska sredstva,
  u skladu sa planiranim aktivnostima za 2019. godinu, koji \u0107e razmatrati sa
  Ministarstvom finansija.\\n\\nObra\u0111iva\u010d: Slu\u017eba za finansijske poslove\\n\\nRok:
  III kvartal\\n\\n4. Sprovo\u0111enje postupaka javnih nabavki\\n\\nU skladu sa Planom
  javnih nabavki neophodno je kontinuirano sprovoditi postupke javnih nabvaki, radi
  nesmetanog funkcionisanja Ministarstva.\\n\\nObra\u0111iva\u010d: Slu\u017eba za
  finansijske poslove\\n\\nRok: Kontinuirano.\\n\\n9. KABINET MINISTRA\\n\\nA. Tematski
  dio\\n\\n1. Obavljanje protokolarnih i administrativno tehni\u010dkih poslova potrebnih
  za ostvarivanje funkcije ministra\\n\\nU cilju blagovremenog obavljanja protokolarnih
  i administrativno tehni\u010dkih poslova potrebnih za ostvarivanje funkcije ministra
  u Kabinetu ministra se organizuju i izvr\u0161avaju pomenuti poslovi.\\n\\nObra\u0111iva\u010d:
  Kabinet ministra\\n\\nRok: Kontinuirano\\n\\n2. Obavljanje poslova pripreme i sprovo\u0111enja
  interne i eksterne komunikacije i aktivnosti vezanih za odnose sa javno\u0161\u0107u\\n\\nU
  Kabinetu ministra kontinuirano se obavljaju poslovi pripreme i sprovo\u0111enja
  interne i eksterne komunikacije, kao i preduzimaju aktivnosti vezani za odnose sa
  javno\u0161\u0107u.\\n\\nObra\u0111iva\u010d: Kabinet ministra\\n\\nRok: Kontinuirano\\n\\n3.
  Ostvarivanje komunikacije prema Vladi Crne Gore i drugim organima dr\u017eavne uprave\\n\\nU
  Kabinetu ministra kontinuirano se obavljaju poslovi koji se odnose na ostvarivanje
  komunikacije prema Vladi Crne Gore i drugim organima dr\u017eavne uprave.\\n\\nKabinet
  ministra\\n\\nObra\u0111iva\u010d:\\n\\nRok: Kontinuirano\\n\\n4. Organizacija sastanaka
  ministra\\n\\nU Kabinetu ministra kontinuirano se obavljaju poslovi koji se odnose
  na organizaciju sastanaka ministra.\\n\\nObra\u0111iva\u010d: Kabinet ministra\\n\\nRok:
  Kontinuirano\\n\\n10. ZAJEDNI\u010cKE AKTIVNOSTI\\n\\nA. Tematski dio\\n\\n1. Izvje\u0161taj
  Ministarstva za ljudska i manjinska prava o radu i stanju u upravnim oblastima za
  2017. godinu\\n\\nU skladu sa Uredbom o organizaciji i na\u010dinu rada dr\u017eavne
  uprave Ministarstvo \u0107e pripremiti Izvje\u0161taj o radu u upravnim oblastima
  za 2017. godinu.\\n\\nObra\u0111iva\u010d: Sve organizacione jedinice Ministarstva\\n\\nRok:
  I kvartal\\n\\nNadle\u017eno radno tijelo Vlade: Komisija za politi\u010dki sistem,
  unutra\u0161nju i vanjsku politiku\\n\\n2. Me\u0111unarodna saradnja\\n\\nU Ministarstvu
  se obavlja i veoma \u017eiva diplomatska aktivnost, kroz susrete sa stranim diplomatama,
  pogotovu sa predstavnicima EU, SE, UN i OEBS. Ministarstvo sara\u0111uje i sa dr\u017eavama
  u okru\u017eenju kao i sa drugim me\u0111unarodnim organizacijama i inicijativama.\\n\\nMinistarstvo
  za ljudska i manjinska prava u okviru svojih nadle\u017enosti ostvaruje saradnju
  sa institucijama iz EU , kao i  sa me\u0111unarodnim organizacijama kao \u0161to
  su Savjet Evrope, UN, OEBS. Kroz zajedni\u010de projekte realizuju se aktivnosti
  u oblasti za\u0161tite ljudskih i manjinskih prava, kao i prava ranjivih grupa.\\n\\nObra\u0111iva\u010d:
  Sve organizacione jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n3. U\u010de\u0161\u0107e
  u radu interresorskih timova\\n\\nPredstavnici Ministarstva su dali svoj doprinos
  u izradi va\u017enih dokumenta Vlade Crne Gore, interresorskih timova za pojedina
  pitanja, kao i drugih projekata, \u0161to \u0107e i u budu\u0107e \u010diniti.\\n\\nObra\u0111iva\u010d:
  Sve organizacione jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n4. U\u010de\u0161\u0107e
  u pretpristupnim pregovorima za ulazak u EU\\n\\nMinistarstvo za ljudska i manjinska
  prava aktivno u\u010destvuje u pretpristupnim pregovorima za ulazak u EU, u pregovara\u010dkim
  poglavljima 19 i 23.\\n\\nCrna Gora je otvorila pregovara\u010dki proces sa EU,
  i to sa poglavljima 19 i 23, \u0161to podrazumijeva aktivno u\u010de\u0161\u0107e
  Ministarstva u ovom procesu.\\n\\nPredstavnici Ministarstva za ljudska i manjinska
  prava su \u010dlanovi Radnih grupa za pregovara\u010dko poglavlje 23 Pravosu\u0111e
  i temeljna prava, 19 Socijalna politika i zapo\u0161ljavanje, 22 regionalna politika
  i koordinacija strukturnih instrumenata. U kontinuitetu se ralizuju aktivnosti predvi\u0111ena
  akcionim planovima za ova pregovara\u010dka poglavlja.\\n\\nObra\u0111iva\u010d:
  Sve organizacione jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n5. Organizacija
  okruglih stolova i debata\\n\\nMinistarstvo \u0107e organizovati vi\u0161e okruglih
  stolova koji \u0107e kao teme imati pitanja za\u0161tite ljudskih i manjinskih prava
  iz razli\u010ditih oblasti.\\n\\nObra\u0111iva\u010d: Sve organizacione jedinice
  Ministarstva\\n\\nRok: Kontinuirano\\n\\n6. Davanje mi\u0161ljenja, sugestija i
  predloga na nacrte i predloge zakona, programa i strategija na zahtjev drugih organa
  dr\u017eavne uprave\\n\\nKroz davanje mi\u0161ljenja, sugestija i predloga na nacrte
  i predloge zakona, programa, strategija i dr. na zahtjev drugih organa dr\u017eavne
  uprave, Ministarstvo \u0107e u\u010destvovati u kreiranju Vladinih politika koje
  se ti\u010du njegovog rada i nadle\u017enosti.\\n\\nObra\u0111iva\u010d: Sve organizacione
  jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n7. Sprovo\u0111enje stavova i
  zaklju\u010daka Vlade Crne Gore\\n\\nMinistarstvo \u0107e raditi na sprovo\u0111enju
  stavova i zaklju\u010daka Vlade Crne Gore koji se odnose na njegovu nadle\u017enost.\\n\\nObra\u0111iva\u010d:
  Sve organizacione jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n8. Dostavljanje
  informacija u skladu sa Zakonom o slobodnom pristupu informacijama\\n\\nU skladu
  sa Zakonom o slobodnom pristupu informacijama, obaveza Ministarstva je da odgovori
  na zahtjev stranke koja tra\u017ei informaciju.\\n\\nObra\u0111iva\u010d: Sve organizacione
  jedinice Ministarstva\\n\\nRok: Kontinuirano\\n\\n9. Izrada Programa rada Ministarstva
