  Q3          | Q4          | Q1          | Q2          |\\n\\nIzvor: Eurostat\\n\\nInflacija
  je u Eurozoni u junu iznosila 0,2% i ni\u017ea je u odnosu na maj, kada je bila
  0,3%. Procjenjuje se da \u0107e rast cijena za jul 2015. godine ostati na nivou
  junskih, odnosno 0,2%. Takode, o\u010dekuje se da inflacija ostane na niskom nivou
  i tokom narednih mjeseci, dok se za kraj 2015. godine o\u010dekuje njen rast. Klju\u010dni
  razlog niske inflacije je niska cijena nafte sa kraja 2014. godine. Me\u0111utim,
  prognoze su da \u0107e planirani ekonomski oporavak, oslabljeni kurs eura, zatim
  rast cijene nafte u narednim godinama uticati na pove\u0107anje stope inflacije
  u 2016. i 2017. godini.\\n\\nTabela 8.3\\n\\n| Godi\u0161nja stopa inflacije u Eurozoni,
