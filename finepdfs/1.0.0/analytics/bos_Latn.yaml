  "\"project summary document\\n\\nZemlja\\n\\nSrbija\\n\\nIdentifikacioni broj projekta
  52398\\n\\nPoslovni sektor\\n\\nFinansiranje putem lizinga\\n\\nJavni/Privatni\\n\\nPrivatni\\n\\nEkolo\u0161ka
  kategorizacija FI\\n\\nCiljani datum odobrenja\\n\\n16. februar 2020.\\n\\nStatus\\n\\nFaza
  razmatranja, \u010deka se kona\u010dni pregled\\n\\nPSD objavljen\\n\\nOpis projekta\\n\\nPru\u017eanje
  kredita u iznosu do 20 miliona evra u dve jednake tran\u0161e kompaniji UniCredit
  Leasing Srbija (u daljem tekstu \u201eUCL\\\") u okviru Regionalnog programa podr\u0161ke
  konkurentnosti malim i srednjim preduze\u0107ima (u daljem tekstu \u201eMSP\\\").
  Kredit \u0107e u potpunosti biti obezbe\u0111en garancijom od strane mati\u010dne
  kompanije, UniCredit Banke Srbija (u daljem tekstu \u201eUCB\\\").\\n\\nCiljevi
  projekta\\n\\nProjekat \u0107e podr\u017eati investicije MSP za unapre\u0111enje
  proizvodnih kapaciteta i uskla\u0111ivanje procesa sa EU direktivama za za\u0161titu
  \u017eivotne sredine, za\u0161titu radnika i bezbednost i kvalitet proizvoda. Projekti
  koji ispunjavaju uslove bira\u0107e se na osnovu tehni\u010dkih i finansijskih kriterijuma
  odre\u0111enih unutar Odredbi Regionalnog programa podr\u0161ke konkurentnosti MSP.
  Podr\u0161ka MSP predstavlja kombinaciju olak\u0161anog pristupa finansiranju sa
  i bez podr\u0161ke tehni\u010dke saradnje. Barem 60% sredstava \u0107e se upotrebiti
  za finansiranje investicija koje se kvalifikuju kao GET investicije, u skladu sa
  Odredbama programa.\\n\\nUticaj na tranziciju\\n\\nProjekat doprinosi ciljevima
  Regionalnog programa podr\u0161ke konkurentnosti MSP tako \u0161to podr\u017eava
  konkurentnost i otpornost kada je u pitanju uticaj na tranziciju.\\n\\nKonkurentnost:
  Projekat \u0107e doprineti (i) podr\u0161ci MSP prilikom pristupanja finansiranju  za
  investicije koje su u skladu sa standardima EU; i (ii) pomo\u0107i \u0107e MSP pri
  dobijanju saveta i znanja za uklju\u010divanje i implementiranje EU standarda i
  postizanja konkurentnosti.\\n\\nOtpornost: Od daljih korisnika kredita \u0107e se
  tra\u017eiti da budu poslovno odr\u017eivi, \u0161to \u0107e se ogledati u jakoj
  ekspertizi za preuzimanje rizika i adekvatnom kvalitetu portfolija partnerskih finansijskih
  institucija..\\n\\nKlijent\\n\\nUNICREDIT LEASING SRBIJA DOO\\n\\nUniCredit Leasing
  Srbija (\u201eUCL\\\") je \u010detvrta po veli\u010dini lizing kompanija u Srbiji
  sa aktivom od 122,5 miliona evra i udelom na tr\u017ei\u0161tu od 13,4% po podacima
  iz septembra 2020. Kompanija ima sedi\u0161te u Beogradu i 28 zaposlenih, pri \u010demu  pru\u017ea
  \u0161irok spektar lizing proizvoda MSP, korporacijama i privatnim licima. UCL je
  u potpunosti u vlasni\u0161tvu UCB Srbija, \u010diji je krajnji vlasnik UniCredit
  Spa, koja je listirana na italijanskoj berzi.\\n\\nFinansiranje EBRD-a\\n\\n20 miliona
  evra\\n\\nUkupna vrednost projekta\\n\\n20 miliona evra\\n\\nEkolo\u0161ka i socijalna
  kategorizacija, uticaj i ubla\u017eavanje\\n\\nU kategoriji FI \u2013 Finansijske
  institucije (ESP 2019). UCL je postoje\u0107i klijent i od njega \u0107e se zahtevati
  da nastavi sa primenom  Procedure za upravljanje za\u0161titom \u017eivotne sredine
  i dru\u0161tvenim rizikom (E&S) vezanim za lizing; da se pridr\u017eava odredbi
  PR 2, 4 i 9, uklju\u010duju\u0107i i pro\u0161irenu E&S listi EBRD-a za izuze\u0107e
  i preporuke kao dela ESP 2019, kao i da podnosi godi\u0161nje izve\u0161taje Banci
  o za\u0161titi \u017eivotne sredine, zdravlja i za\u0161tite na radu.\\n\\nTehni\u010dka
  saradnja\\n\\nTS: tehni\u010dka saradnja \u0107e uklju\u010divati podr\u0161ku Konsultanata
  koji \u0107e pomo\u0107i pri implementaciji, marketingu i pra\u0107enju Programa
  i odvojenoj verifikaciji tehni\u010dke implementacije investicija od strane daljih
  korisnika kredita pre pu\u0161tanja podsticajnih sredstava.\\n\\nKo-investiciona
  bespovratna sredstva (grantovi): 3 miliona evra za investicione podsticaje daljim
  korisnicima kredita za implementaciju investicija koje ispunjavaju uslove u skladu
  sa Odredbama Programa.\\n\\nDodata vrednost\\n\\nDodata vrednost se posti\u017ee
  kombinovanjem neophodnog dugoro\u010dnog finansiranja sa TS i investicionim podsticajima
  u zajedni\u010dki paket, kojim se potpomo\u017ee ostvarivanje punog potencijal MSP
  u Srbiji a koji je strukturisan tako da promovi\u0161e uskla\u0111enost sa\\n\\nEU
  i me\u0111unarodnim standardima tako \u0161to pobolj\u0161ava ponudu namenskog finansiranja
  i pove\u0107ava potra\u017enju za takvim vidom investicija.\\n\\nKontakt u kompaniji
  klijenta\\n\\nAna Mili\u0107\\n\\nemail@example.com +381113204546 https://www.unicreditleasing.rs
  Jurija Gagarina 12, Beograd, Srbija\\n\\nOp\u0161te informacije o tranziciji\\n\\nDodatne
  informacije o pristupu EBRD u oblasti merenja uticaja tranzicije mogu se na\u0107i
  ovde.\\n\\nPoslovne prilike\\n\\nU vezi sa mogu\u0107nostima za poslovnu saradnju
  ili nabavkama, obratite se kompaniji koja je klijent.\\n\\nU vezi sa mogu\u0107nostima
  za poslovanje sa EBRD (koje se ne odnose na nabavku) kontaktirajte:\\n\\nTel: +44
  20 7338 7168\\n\\nAdresa elektronske po\u0161te: firstname.lastname@example.org\\n\\nU
  vezi sa projektima u dr\u017eavnom sektoru, posetite EBRD nabavke\\n\\nTel: +44
  20 7338 6794\\n\\nAdresa elektronske po\u0161te: email@example.com\\n\\nOp\u0161ti
  upiti\\n\\nKonkretni upiti se mogu uputiti kori\u0161\u0107enjem EBRD obrasca za
  upite.\\n\\nPolitika za\u0161tite \u017eivotne sredine i socijalna politika (eng.
  ESP)\\n\\nU ESP i Uslovima za realizaciju (eng. PR) vezanim za nju utvr\u0111eni
  su na\u010dini na koje EBRD sprovodi svoju opredeljenost za promovisanje \u201eekolo\u0161ki
  prihvatljivog i odr\u017eivog razvoja\\\". ESP i PR sadr\u017ee konkretne odredbe
  kojima se od klijenata tra\u017ei da po\u0161tuju va\u017ee\u0107e zahteve predvi\u0111ene
  nacionalnim zakonima u oblasti javnog informisanja i javnih konsultacija, kao i
  da uspostave \u017ealbeni mehanizam za primanje i omogu\u0107avanje re\u0161avanja
  \u017ealbi i pritu\u017ebi zainteresovanih strana, posebno u vezi sa ekolo\u0161kim
  i socijalnim u\u010dinkom klijenta i projekta. Srazmerno prirodi i obimu rizika
  i uticaja projekta na \u017eivotnu sredinu i socijalna pitanja, EBRD dodatno zahteva
  od svojih klijenata da po potrebi objavljuju informacije o rizicima i uticajima
  koji proisti\u010du iz projekata, ili da sprovedu konstruktivne konsultacije sa
  zainteresovanim stranama, razmotre njihove komentare i odgovore na njih.\\n\\n:\\n\\nVi\u0161e
  informacija o praksi EBRD u ovoj oblasti dato je u ESP.\\n\\nIntegritet i uskla\u0111enost
  sa propisima\\n\\nKancelarija Glavnog stru\u010dnjaka EBRD za kontrolu uskla\u0111enosti
  sa propisima (eng. OCCO) promovi\u0161e dobro upravljanje i osigurava da, u skladu
  sa najboljom me\u0111unarodnom praksom, sve aktivnosti Banke ispunjavaju najvi\u0161e
  standarde integriteta. Za sve klijente Banke sprovodi se detaljna analiza integriteta
  kako bi se osiguralo da projekti ne predstavljaju neprihvatljiv rizik po integritet
  ili reputaciju Banke. Banka smatra da je identifikovanje i re\u0161avanje pitanja
  tokom faza ocenjivanja i odobravanja projekta najdelotvorniji na\u010din da se osigura
  integritet poslovanja Banke. OCCO ima klju\u010dnu ulogu u ovim naporima za za\u0161titu,
  a tako\u0111e poma\u017ee u pra\u0107enju rizika po integritet projekata u periodu
  nakon ulaganja.\\n\\nOCCO je tako\u0111e nadle\u017ena za ispitivanje navoda o prevari,
  korupciji i zloupotrebi slu\u017ebene du\u017enosti u projektima koje finansira
  EBRD. Svako, bilo unutar ili izvan Banke, ko sumnja da je do\u0161lo do prevare
  ili korupcije, treba da podnese pisanu prijavu glavnom stru\u010dnjaku za kontrolu
  uskla\u0111enosti sa propisima putem elektronske po\u0161te na firstname.lastname@example.org.
  OCCO \u0107e postupati po svim prijavljenim stvarima u cilju daljeg pra\u0107enja.
  Sve prijave, uklju\u010duju\u0107i i one anonimne, \u0107e biti razmotrene. Prijave
  se mogu dostaviti na bilo kom jeziku Banke ili jeziku neke od zemalja u kojima Banka
  posluje. Dostavljene informacije moraju biti date u dobroj veri.\\n\\nPolitika pristupa
  informacijama (eng. AIP)\\n\\nOvom politikom se utvr\u0111uje na\u010din na koji
  EBRD objavljuje informacije i sprovodi konsultacije sa zainteresovanim stranama
  Banke, kako bi podigla nivo poznavanja i razumevanja njenih strategija, politika
  i operacija, posle njenog stupanja na snagu 1. januara 2020. godine. Da biste saznali
  koje informacije su dostupne na veb sajtu EBRD posetite stranicu Politika pristupa
  informacijama.\\n\\nKonkretne zahteve za dobijanje informacija mo\u017eete uputiti
  kori\u0161\u0107enjem EBRD obrasca za upite.\\n\\nNezavisni projektni mehanizam
  odgovornosti (eng. IPAM)\\n\\nAko napori klijenta ili Banke za otklanjanje razloga
  za zabrinutost vezanih za \u017eivotnu sredinu, socijalna pitanja ili objavljivanje
  podataka (npr. putem mehanizma koji je klijent uspostavio za re\u0161avanje pritu\u017ebi
  na nivou projekta ili kroz direktnu saradnju sa rukovodstvom Banke) ostanu bez uspeha,
  pojedinci i organizacije mogu da poku\u0161aju da otklone svoje razloge za zabrinutost
  preko mehanizma EBRD pod nazivom Nezavisni projektni mehanizam odgovornosti (IPAM).\\n\\nIPAM
  nezavisno razmatra pitanja projekta za koja se veruje da su prouzrokovala (ili bi
  mogla da prouzrokuju) \u0161tetu. Svrha ovog mehanizma je: da podr\u017ei dijalog
  izme\u0111u zainteresovanih strana na projektu radi re\u0161avanja pitanja vezanih
  za za\u0161titu \u017eivotne sredine, socijalnih pitanja ili pitanja vezanih za
  javno objavljivanje podataka; da utvrdi da li je Banka po\u0161tovala svoju Politiku
  za\u0161tite \u017eivotne sredine i socijalnu politiku ili odre\u0111ene odredbe
  svoje Politike pristupa informacijama koje se odnose na konkretan projekat; i po
  potrebi, da re\u0161ava bilo koje postoje\u0107e nepo\u0161tovanje ovih politika,
  istovremeno spre\u010davaju\u0107i budu\u0107e slu\u010dajeve neuskla\u0111enosti
  Banke sa propisima.\\n\\nPosetite veb stranicu Nezavisnog projektnog mehanizma odgovornosti
  da biste se obavestili o tome kako podneti Zahtev za preispitivanje putem na\u0161eg
  poverljivog elektronskog obrasca, po\u0161tom ili telefonom. IPAM vam stoji na raspolaganju
  za razgovor o razlozima za va\u0161u zabrinutost i za odgovore na sva va\u0161a
  pitanja u vezi sa podno\u0161enjem zahteva ili postupanjem po zahtevima, koji su
  u skladu sa Politikom odgovornosti za projekte i Smernicama. Identitet podnosilaca
  zahteva mo\u017ee da ostane poverljiv, na njihov zahtev.\"", "\"Me\u0111unarodni
