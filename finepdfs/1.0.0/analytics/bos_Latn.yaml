  | Kratko pritiskanje dugmeta |\\n| 11 \u2013 MEDIA | Izbor izvora: CD, USB / iPod,
  AUX ili Bluetooth | Kratko pritiskanje dugmeta |\\n| 12 \u2013 RADIO | Pristup radio
  modu (na\u010dinu rada) | Kratko pritiskanje dugmeta |\\n\\nKOMANDE UPRAVLJA\u010cA\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nOPIS\\n\\nKomande za
  glavne funkcije sistema nalaze se na upravlja\u010du kako bi se olak\u0161alo njihovo
  kori\u0161\u0107enje. Aktiviranje izabrane funkcije kontroli\u0161e se, u nekim
  slu\u010dajevima, du\u017einom pritiskanja dugmeta (kratko ili dugo pritiskanje)
  kako je opisano u ni\u017ee d\u0430\u0442\u043ej \u0442\u0430\u0431\u0435\u043b\u0438.\\n\\nslika
  2.\\n\\n| Dugme | Interakcija (pritiskanje / okretanje) |\\n|-------|-------------------------------------|\\n|       |
  - Prihvatanje dolaznog poziva        |\\n|       | - Prihvatanje drugog dolaznog
  telefonskog poziva i stavljanje aktivnog telefonskog poziva na \u010dekanje |\\n|       |
  - Aktiviranje prepoznavanja glasa za funkciju Phone |\\n|       | - Prekid govorne
  poruke u cilju davanja nove govorne komande |\\n|       | - Prekid prepoznavanja
  glasa         |\\n|       | - Odbijanje dolaznog poziva          |\\n|       | -
  Zavr\u0161avanje poziva koji je u toku  |\\n|       | Pritiskanje sredine levog
  to\u010dka:    |\\n|       | - deaktiviranje / ponovno aktiviranje mikrofona tokom
  telefonskog razgovora |\\n|       | - aktiviranje / deaktiviranje CD, USB /iPod,
  Bluetooth izvora Pauze |\\n|       | - aktiviranje / deaktiviranje funkcije isklju\u010divanja
  tona na radiju (Mute)- |\\n| +/\u2212   | Okretanje levog to\u010dka nagore ili
  nadole: |\\n|       | - pode\u0161avanje ja\u010dine zvuka: bez ruku, \u010dita\u010da
  SMS poruka; izvora govornih najava i muzike |\\n| \u25ba     | Skrolovanje po memorisanim
  radio stanicama (prethodno pode\u0161enim) |\\n|       | - Aktiviranje prepoznavanja
  glasa    |\\n|       | - Prekid govorne poruke u cilju davanja nove govorne komande
  |\\n|       | - Prekid prepoznavanja glasa         |\\n|       | Okretanje desnog
  to\u010dka nagore ili nadole: |\\n|       | -Radio mod (na\u010din rada): izbor
  prethodne / naredne radio stanice |\\n|       | -CD, USB /iPod, Bluetooth mod (na\u010din
  rada): izbor prethodnog / narednog treka |\\n| SRC   | Pritiskanje sredine desnog
  to\u010dka:    |\\n|       | -izbor raspolo\u017eivih audio izvora: radio, CD, USB
  /iPod, AUX i Bluetooth |\\n\\nUKLJU\u010cIVANJE / ISKLJU\u010cIVANJE SISTEMA\\n\\nRADIO
  (TUNER) MOD (na\u010din rada)\\n\\nSistem se uklju\u010duje / isklju\u010duje kada
  se pritisne dugme (ON / OFF) (I \u2013 sl. 1).\\nElektronska komanda za pode\u0161avanje
  ja\u010dine zvuka okre\u0107e se skroz u krug (3600) u oba smera bez pozicija za
  zaustavljanje.\\nOkrenite dugme u pravcu kretanja kazaljki na satu kako biste poja\u010dali
  ja\u010dinu zvuka radija ili u pravcu suprotnom od pravca kretanja kazaljki na satu,
  kako biste je smanjili.\\nSistem ima slede\u0107e pode\u0161iva\u010de: AM, FM i
  DAB (digitalno audio emitovanje) (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nIZBOR
  RADIO MODA (na\u010dina rada)\\n\\nPritisnite dugme RADIO (I 2 \u2013 sl. I) na
  prednjem panelu kako biste aktivirali radio kao na\u010din rada.\\nRazli\u010dite
  na\u010dine pode\u0161avanja mo\u017eete birati sa odgovaraju\u0107im dugmetom na
  displeju (videti sl. 4).\\nSvaki na\u010din pode\u0161avanja mo\u017ee imati specifi\u010dan
  prethodno izabrani set.\\n\\nIZBOR FREKVENCIJSKOG OPSEGA\\n\\nKratko pritisnite
  dugme AM / FM za prebacivanje sa AM na FM i obrnuto.\\nUkoliko imate pode\u0161iva\u010d
  DAB, kratko pritisnite dugmad\\nAM / FM, AM / DAB, FM / DAB kako biste izabrali
  \u017eeljenu frekvenciju.\\n\\nPRIKAZANE INFORMACIJE\\n\\nPo \u0161to izaberete
  \u017eeljenu radio stanicu na displeju (videti sl. 5) \u0107e se pojaviti slede\u0107e
  informacije:\\n\\nGore u vrhu: lista memorisanih radio stanica (prethodno pode\u0161enih);
  stanica koju slu\u017eate \u0107e biti obele\u017eena.\\n\\nU sredini: naziv radio
  stanice koju slu\u017eate i dugmad za izbor prethodne ili naredne radio stanice\\n\\nU
  dnu: se prikazuje slede\u0107a dugmad:\\n\\n- BROWSE (pretra\u017eivanje): lista
  rasplo\u017eivih radio stanica;\\n- AM/FM, AM/DAB, FM/DAB: izbor \u017eeljenog opsega
  frekvencija (rekonfigurabilno dugme zavisno od izabranog opsega: AM, FM ili DAB);\\n-
  TUNE (pode\u0161avanje): ru\u010dno pode\u0161avanje radio stanica (nije na raspolaganju
  za radio DAB);\\n- INFO: dodatne informacije o izvoru koji slu\u017eate;\\n- AUDIO:
  pristup ekranu za pode\u0161avanje zvuka\\n\\nIZBOR RADIO STANICA\\n\\nZa tra\u017eenje
  \u017eeljene radio stanice pritiskajte dugmad << ili >> na displeju ili koristite
  komande na upravlja\u010du.\\n\\nTRA\u017dENJE PRETHODNE / NAREDNE RADIO STANICE\\n\\nKratko
  pritisnite dugmad \\\\(\\\\ll\\\\) i \\\\(\\\\gg\\\\) na displeju: kada se dugme
  otpusti displej \u0107e pokazati prethodnu ili narednu radio stanicu.\\n\\nKada
  tra\u017eite unapred, ukoliko sistem stigne do kraja opsega, automatski staje na
  stanicu od koje je po\u010delo tra\u017eenje.\\n\\nBRZO TRA\u017dENJE PRETHODNE
  / NAREDNE RADIO STANICE\\n\\nDr\u017eite pritisnutu dugmad \\\\(\\\\ll\\\\) ili
  \\\\(\\\\gg\\\\) na displeju kako biste po\u010deli brzo tra\u017eenje: kada dugme
  otpustite, \u010du\u0107ete prvu radio stanicu koju je mogu\u0107e podesiti.\\n\\nPODE\u0160AVANJE
  AM/FM RADIO STANICA\\n\\nUpotrebite dugme TUNE za biranje radio stanica.\\n\\nPritisnite
  dugme TUNE na displeju zatim izaberite prvi broj \u017eeljene radio stanice (videti
  sl. 6).\\n\\nGrafi\u010dka tastatura na displeju se koristi za uno\u0161enje broja
  stanice.\\n\\nKoristite dugmad + i \u2013 u ovom na\u010dinu rada za fino pode\u0161avanje
  frekvencije.\\n\\nPritisnite dugme \\\\(\\\\times\\\\) (Delete \u2013 poni\u0161tavanje)
  da poni\u0161tite pogre\u0161an broj (i unesite ta\u010dan broj stanice).\\n\\nPosle
  uno\u0161enja poslednje cifre stanice, deaktivira se ekran TUNE i sistem automatski
  pode\u0161ava izabranu stanicu (broj radio stanice se prikazuje u tekstualnom polju
  TUNE).\\n\\nEkran nestaje automatski posle 5 sekundi ili ukoliko se ru\u010dno pritisnu
  dugmad OK ili \\\\(\\\\times\\\\) (Delete).\\n\\nNepotpun izbor radio stanice (OK)\\n\\nPritisnite
  dugme OK na displeju da podesite izabranu radio stanicu i zatvorite ekran DIRECT
  TUNE (direktno pode\u0161avanje) (ru\u010dno pode\u0161avanje).\\n\\nIzlaz iz ekrana
  DIRECT TUNE\\n\\nPritisnite dugme EXIT ili RADIO na displeju kako biste se vratili
  na glavni ekran sistema.\\n\\nRADIO DAB\\n(za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno)\\n\\nKada se na displeju izabere radio DAB kao na\u010din rada
  radija, on \u0107e pokazati informaciju o stanici koja se slu\u0161a (videti sl.
  7) i slede\u0107i na\u010dini rada \u0107e biti u ponudi:\\n\\nIzbor prethodne /
  naredne radio stanice pomo\u0107u:\\n\\n- okretanjem dugmeta BROWSE ENTER (7 \u2013
  sl. 1);\\n- kratkim pritiskanjem dugmadi \u23ea ili \u23e9 na displeju;\\n- pritiskanjem
  komandi \u23ea ili \u23e9 na upravlja\u010du.\\n\\nDr\u017eite pritisnuto dugmad
  \u23ea ili \u23e9 za brzo skrolovanje po listi stanica.\\n\\nDugme BROWSE se koristi
  za prikaz:\\n\\n- liste svih stanica DAB;\\n- liste stanica filtriranih po \\\"\u017danrovima\\\"\\n-
  liste stanica filtriranih po \\\"Ansamblima\\\" (grupama izvo\u0111a\u010da).\\n\\nKoristite
  dugme ABC u okviru svake liste za preskakanje na \u017eeljeno slovo.\\n\\nDugme
  REFRESH (osve\u017eavanje) zahteva a\u017euriranje liste stanica radija DAB: a\u017euriranje
  mo\u017ee da traje nekoliko sekundi do oko dve minute.\\n\\nslika 7.\\n\\nPODE\u0160AVANJE
  PREDSELEKCIJA\\n\\nPredselekcije su na raspolaganju u svim na\u010dinima rada sistema
  i aktiviraju se dodirivanjem jednog od dugmadi predselekcije u vrhu displeja.\\n\\nZa
  memorisanje radio stanice koja se slu\u0161a, pritisnite i dr\u017eite pritisnuto
  dugme koje odgovara \u017eeljenom pretpode\u0161avanju dok ne \u010dujete zvu\u010dni
  signal potvrde.\\n\\nSistem mo\u017ee da memori\u0161e do 12 radio stanica u svakom
  na\u010dinu rada: 4 radio stanice se prikazuju u vrhu.\\n\\nPritisnite dugme ALL
  (sve) na displeju za prikazivanje svih memorisanih radio stanica u izabranom opsegu
  frekvencija.\\n\\nAUDIO\\n\\nZa ulazak u meni AUDIO, pritisnite dugme SETTINGS (10
  \u2013 sl. 1) na prednjem panelu, skrolujte po meniju zatim izaberite i pritisnite
  stavku AUDIO na displeju.\\n\\nSlede\u0107a pode\u0161avanja je mogu\u0107e uraditi
  kori\u0161\u0107enjem menija AUDIO:\\n\\n- EQUALIZER (izjedna\u010davanje zvu\u010dnih
  kanala)\\n  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno);\\n\\n-
  BALANCE / FADE (izjedna\u010davanje levo-desno / napred-nazad) (pode\u0161avanje
  ravnote\u017ee izme\u0111u levog / desnog i prednjeg / zadnjeg dela);\\n\\n- VOLUME
  / SPEED (ja\u010dina zvuka / brzina) (isklju\u010duju\u0107i verzije sa Hi-Fi sistemom)
  automatsko pode\u0161avanje ja\u010dine zvuka zavisno od brzine;\\n\\n- LOUDNESS
  (glasnost) (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno);\\n\\n- AUTO-ON
  RADIO;\\n\\n- RADIO OFF DELAY, (odlo\u017eeno ga\u0161enje radija u prethodno pode\u0161enom
  trajanju posle ga\u0161enja motora)\\n\\nZa izlaz iz menija AUDIO pritisnite dugme
  \u279e /Done.\\n\\nVA\u017dNO: Kada se promeni neko pode\u0161avanje, re\u010d Done
  \u0107e zameniti dugme \u279e.\\n\\nEQUALIZER (izjedna\u010davanje zvu\u010dnih
  kanala)\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nIzaberite
  EQUALIZER na displeju za pode\u0161avanje basa, srednjih i visokih tonova.\\n\\nUpotrebite
  dugmad + ili \u2013 da uradite \u017eeljena pode\u0161avanja (videti sl. 8).\\n\\nZatim
  pritisnite dugme \u25c4/Done da se vratite na meni AUDIO.\\n\\nBALANCE / FADE\\n(izjedna\u010davanje
  levo-desno / napred-nazad)\\n\\nPritisnite dugme BALANCE / FADE da uravnote\u017eite
  zvuk iz zvu\u010dnika prednjih i zadnjih sedi\u0161ta.\\n\\nPritisnite dugmad \u25b2
  ili \u25bc za postizanje ravnote\u017ee izme\u0111u prednjih i zadnjih zvu\u010dnika
  (videti sl. 9).\\n\\nPritisnite dugmad \u25c4 ili \u25ba za postizanje ravnote\u017ee
  izme\u0111u zvu\u010dnika sa leve i desne strane\\n\\nPode\u0161avanje je tako\u0111e
  mogu\u0107e pomeranjem simbola \u266b na desnoj strani displeja nagore / nadole
  / ulevo/udesno.\\n\\nPritisnite centralno dugme C da uravnote\u017eite pode\u0161avanja\\n\\nZatim
  pritisnite dugme \u25c4/Done da se vratite na meni AUDIO.\\n\\nVOLUME / SPEED (ja\u010dina
  zvuka / brzina)\\n\\nPritisnite dugme VOLUME / SPEED kako biste izabrali OFF (isklju\u010deno)
  i 1, 2 ili 3.\\n\\nNa displeju \u0107e se pojaviti izabrana opcija (videti sl. 10).
  Izaberite 1, 2 ili 3 da poja\u010date zvuk proporcionalno sa napravljenim izborom.\\n\\nZatim
  pritisnite dugme \u25c4/Done da se vratite na meni AUDIO.\\n\\nLOUDNESS (glasnost)\\n(za
  verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nAktiviranje / deaktiviranje
  funkcije LOUDNESS za pobolj\u0161anje kvaliteta zvuka kod malih ja\u010dina.\\n\\nAUTO
  ON RADIO\\n\\nZa pode\u0161avanje pona\u0161anja radija kada je klju\u010d za paljenje
  okrenut u polo\u017eaj MAR.\\n\\nOpcije su uklju\u010den radio, isklju\u010den radio
  ili ponovno pode\u0161avanje stanja koje je bilo aktivno kada je klju\u010d za paljenje
  poslednji put bio okrenut na STOP.\\n\\nRADIO OFF DELAY,\\n(odlo\u017eeno ga\u0161enje
  radija u prethodno pode\u0161enom trajanju posle ga\u0161enja motora)\\n\\nDa radio
  ostane uklju\u010den tokom prethodno pode\u0161enog vremena, posle okretanja klju\u010da
  za paljenje na STOP.\\n\\nMOD (na\u010din rada) MEDIJA\\n\\nOvo poglavlje se bavi
  interakcijskim na\u010dinima rada vezano za rad CD, Bluetooth, AUX, USB / iPod.\\n\\nMENJANJE
  DATOTEKA (prethodna / naredna)\\n\\nKratko pritisnite dugme \u27a4 ili okre\u0107ite
  dugme BROWSE ENTER (pretra\u017eivanje) (7 \u2013 sl.I) u pravcu kretanja kazaljki
  na satu kako biste emitovali narednu datoteku ili kratko pritisnite dugme \u27a4
  ili okre\u0107ite dugme BROWSE ENTER u pravcu suprotnom od pravca kretanja kazaljki
  na satu da se vratite na po\u010detak izabranog treka ili na po\u010detak prethodne
  datoteke ukoliko se ovaj emituje manje od 8 sekundi.\\n\\nBRZO PREMOTAVANJE DATOTEKA
  UNAPRED / UNAZAD\\n\\nPritisnite i dr\u017eite pritisnuto dugme \u27a4 za brzo premotavanje
  izabrane datoteke unapred ili dr\u017eite pritisnuto dugme \u27a4 za brzo premotavanje
  datoteke unazad.\\n\\nBrzo premotavanje unapred ili unazad \u0107e stati \u010dim
  pustite dugme ili kada do\u0111ete do prethodne / naredne datoteke.\\n\\nIZBOR DATOTEKA
  (pretra\u017eivanje)\\n\\nKoristite ovu funkciju za skrolovanje ili izbor datoteka
  na aktivnom ure\u0111aju.\\n\\nOpcije selekcije zavise od konektovanog ure\u0111aja
  ili tipa uba\u010denog CD.\\n\\nNa primer, na audio CD mo\u017eete birati datoteku
  koji treba da se emituje, dok na CD-ROM, USB/iPod ili Bluetooth ure\u0111aju mo\u017eete
  skrolovati po listi izvo\u0111a\u010da, \u017eanrova i albuma koji su na raspolaganju
  zavisno od postoje\u0107ih informacija o trekovima.\\n\\nUpotrebite dugme ABC u
  okviru svake liste za preskakanje do \u017eeljenog slova na listi.\\n\\nVA\u017dNO:
  Mogu\u0107e je da ovo dugme ne radi za neke ure\u0111aje kompanije Apple.\\n\\nVA\u017dNO:
  Dugme BROWSE ne dozvoljava nikakav rad na AUX ure\u0111aju.\\n\\nVA\u017dNO: Za
  konsultovanje liste Bluetooth audio ure\u0111aja i podr\u017eanih fukcija, posetite
  internet stranu www.fiatsrbija.rs ili pozovite Slu\u017ebu za usluge kupcima 0800
  342800 (ovaj broj mo\u017ee da varira zavisno od zemlje; molimo vas da pogledate
  referentnu tabelu u ovde sadr\u017eanom odeljku \\\"Lista brojeva Slu\u017ebe za
  usluge kupcima\\\").\\n\\nPritisnite dugme BROWSE da aktivirate ovu funkciju na
  izvoru koji emituje.\\n\\nOkre\u0107ite dugme BROWSE ENTER (7 \u2013 sl.1) kako
  biste izabrali \u017eeljenu kategoriju, a zatim pritisnite ovo dugme da potvrdite
  izbor.\\n\\nPritisnite dugme X da poni\u0161tite ovu funkciju.\\n\\nVA\u017dNO Vreme
  indeksiranja USB ure\u0111aja mo\u017ee da varira zavisno od medija u koji se ubacuje(
  u nekim slu\u010dajevima mo\u017ee da traje nekoliko minuta).\\n\\nIZBOR AUDIO IZVORA\\n\\nPriitisnite
  dugme SOURCE da izaberete \u017eeljeni audio izvor me\u0111u raspolo\u017eivom ponudom:
  CD, AUX, USB/iPod ili Bluetooth.\\n\\nUkoliko se ne izabere nijedan izvor, ekran
  nestaje posle nekoliko sekundi, a displej pokazuje ponovo glavni ekran.\\n\\nPRIKAZ
  INFORMACIJA O DATOTEKAMA\\n\\nPritisnite dugme INFO kako bi se na displeju pokazale
  informacije o datoteci koji slu\u017eate za ure\u0111aje koji podr\u017eavaju ovu
  funkciju.\\n\\nPritisnite dugme X za izlazak iz ovog ekrana.\\n\\nREPRODUKCIJA DATOTEKA
  PO NASUMI\u010cNOM REDOSLEDU\\n\\nPritisnite dugme > zatim dugme SHUFFLE (slu\u010dajni
  izbor) kako biste emitovali datoteke na CD, USB/iPod ili Bluetooth po nasumi\u010dnom
  redosledu.\\n\\nPritisnite ponovo dugme SHUFFLE kako biste deaktivirali ovu funkciju.\\n\\nPONAVLJANJE
  DATOTEKA\\n\\nPritisnite dugme > zatim dugme REPEAT (ponoviti) kako biste aktivirali
  ovu funkciju.\\n\\nPritisnite ponovo dugme REPEAT da deaktivirate ovu funkciju.\\n\\nCD
  PLEJER\\n\\nZa aktiviranje CD mod (na\u010dina rada), ubacite neki audio CD ili
  MP3 u odgovaraju\u0107i prorez 4 (sl. I) ili pritisnite dugme MEDIA (I I \u2013
  sl. I) na prednjem panelu.\\n\\nUkoliko je CD ve\u0107 unutra, pritisnite grafi\u010dko
  dugme SOURCE (izvor), zatim izaberite CD.\\n\\nUkoliko uba\u010deni CD ne mo\u017ee
  da se o\u010dita (npr. uba\u010den je CD-ROM ili je pogre\u0161no uba\u010den CD
  ili postoji gre\u0161ka u \u010ditanju) displej \u0107e pokati poruku o gre\u0161ci.\\n\\nUBACIVANJE
  / IZBACIVANJE CD\\n\\nZa ubacivanje CD, ubacite ga polako u prorez kako biste aktivirali
  motorizovani sistem za ubacivanje, koji \u0107e ga namestiti pravilno (pojavljuje
  se simbol CD na displeju).\\n\\nUno\u0161enjem CD kada je sistem uklju\u010den,
  automatski se bira CD mod (na\u010din rada) i sistem po\u010dinje da emituje trekove.\\n\\nDisplej
  pokazuje broj datoteke i vreme (minute i sekunde).\\n\\nPritisnite dugme \u25b2
  (EJECT \u2013 izbacivanje) (3 \u2013 sl. I) na prednjem panelu, kada je sistem uklju\u010den,
  kako biste aktivirali motorizovano izbacivanje CD.\\n\\nPosle izbacivanja, audio
  izvor \u0107e automatski biti izabran.\\n\\nUkoliko se CD ne izvadi iz proreza,
  sistem \u0107e ga automatski ponovo uvu\u0107i posle oko 10 sekundi, ali ga ne\u0107e
  emitovati.\\n\\nBluetooth\\n\\nOvaj na\u010din rada se aktivira uparivanjem Bluetooth
  ure\u0111aja koji sadr\u017ei muzi\u010dke datoteke sa sistemom.\\n\\nUPARIVANJE
  BLUETOOTH AUDIO URE\u0110AJA\\n\\nZa uparivanje Bluetooth audio ure\u0111aja, postupite
  kao \u0161to slije:\\n\\n- aktivirajte Bluetooth funkciju na ure\u0111aju;\\n- pritisnite
  dugme MEDIA (II \u2013 sl.1) na prednjoj plo\u010di;\\n- ukoliko je izvor MEDIA
  aktivan, pritisnite dugme SOURCE (izvor);\\n- izaberite Bluetooth izvor medija;\\n-
  pritisnite dugme ADD DEVICE (dodaj ure\u0111aj);\\n- tra\u017eite uconnect na Bluetooth
  audio ure\u0111aju (tokom faze uparivanja prikazuje se ekran koji pokazuje napredovanje
  ovog postupka);\\n\\n- kada audio ure\u0111aj to tra\u017ei, unesite PIN kod prikazan
  na displeju sistema ili potvr\u0111ite na ure\u0111aju prikazani PIN;\\n- ukoliko
  se procedura uparivanja uspe\u0161no zavr\u0161i, prikaz\u0107e se odgovaraju\u0107a
  poruka na ekranu. Odgovorite YES na pitanje da li da se Bluetooth audio ure\u0111aj
  upari kao favorit (ure\u0111aj \u0107e imati prioritet u odnosu na sve ostale ure\u0111aje
  koji \u0107e kasnije biti uparivani). Ukoliko izaberete NO, prioritet \u0107e se
  utvr\u0111ivati zavisno od redosleda konekcije. Poslednji konektovani ure\u0111aj
  \u0107e imati najve\u0107i prioritet.\\n- audio ure\u0111aji se tako\u0111e mogu
  uparivati pritiskanjem dugmeta SETTINGS (pode\u0161avanja) (I 0 \u2013 sl. 1) na
  prednjem panelu i biranjem Phone / Bluetooth.\\n\\nVA\u017dNO: Ukoliko se izgubi
  Bluetooth konekcija izme\u0111u mobilnog telefona i sistema, konsultujte priru\u010dnik
  za vlasnike mobilnih telefona.\\n\\nUSB/iPod PODR\u0160KA\\n\\nZa aktiviranje USB/iPod
  moda (na\u010dina rada) ubacite odgovaraju\u0107i ure\u0111aj (USB ili iPod) u USB
  port sl. 11 koji se nalazi u vozilu.\\n\\nAko se USB /iPod ure\u0111aj ubaci kada
  je uklju\u010den sistem, po\u010de\u0107e emitovanje datoteka koji se nalaze na
  ovom ure\u0111aju.\\n\\nAUX PODR\u0160KA\\n\\nZa aktiviranje AUX moda (na\u010dina
  rada) uklju\u010dite odgovaraju\u0107i ure\u0111aj u AUX port sl. 12 u vozilu.\\n\\nAko
  se stavi ure\u0111aj kada je uklju\u010den sistem, po\u010de\u0107e emitovanje datoteka
  na ure\u0111aju (emitovanje po\u010dinje od prve datoteke).\\n\\nPodesite ja\u010dinu
  zvuka pomo\u0107u dugmeta (I \u2013 sl. I) koje se nalazi napred ili pomo\u0107u
  komande za pode\u0161avanje ja\u010dine zvuka na priklju\u010denom ure\u0111aju.\\n\\n\u0160to
  se ti\u010de funkcije AUDIO SOURCE SELECTION (izbor audio izvora), pogledajte poglavlje
  \\\"Media mod (na\u010din rada)\\\".\\n\\nVA\u017dNO\\n\\nFunkcijama ure\u0111aja
  konektovanog sa AUX portom direktno upravlja sam ure\u0111aj: nije mogu\u0107e menjati
  datoteku / folder / plejlistu sa komandama koje se nalaze napred ili na upravlja\u010du.\\n\\nNemojte
  dozvoliti da kabl va\u0161eg portabl plejera ostane konektovan sa AUX uti\u010dnicom
  posle isklju\u010divanja, kako biste izbegli mogu\u0107e \u0161u\u0161tanje iz zvu\u010dnika.\\n\\nTELEFON
  MOD (na\u010din rada)\\n\\nAKTIVIRANJE TELEFON MODA\\n\\nPritisnite dugme PHONE
  (9 \u2013 sl. I) na prednjoj plo\u010di da aktivirate telefon mod.\\n\\nSlede\u0107i
  ekran se pojavljuje na displeju (videti sl. 13).\\n\\nGLAVNE FUNKCIJE\\n\\nKoristite
  dugmad na displeju za:\\n\\n- izbor telefonskog broja (kori\u0161\u0107enjem grafi\u010dke
  tastature na displeju);\\n- prikazivanje i pozivanje kontakata iz telefonskog imenika
  mobilnog telefona;\\n- prikazivanje i pozivanje kontakata iz registara prethodnih
  poziva;\\n\\nslika 13.\\n\\n\u25a1 uparivanje do 10 telefona / audio ure\u0111aja
  kako biste imali lak\u0161i i br\u017ei pristup i konekciju;\\n\u25a1 prebacivanje
  poziva iz sistema na mobilni telefon i obrnuto i deaktiviranje mikrofona u privatnim
  razgovorima.\\n\\nTon va\u0161eg mobilnog telefona se prenosi kroz audio sistem
  va\u0161eg vozila; sistem \u0107e automatski isklju\u010diti ton va\u0161eg radija
  kada koristite funkciju telefona.\\n\\nPRIKAZANE INFORMACIJE\\n\\nKada je telefon
  priklju\u010den na sistem, displej prikazuje razne informacije (ukoliko ih ima):\\n\\n\u25a1
  status rominga\\n\u25a1 intenzitet mre\u017enog signala;\\n\u25a1 napunjenost baterije
  mobilnog telefona\\n\u25a1 naziv mobilnog telefona.\\n\\nVA\u017dNO:\\nZa informaciju
  o listi mobilnih telefona i podr\u017eanih funkcija, posetite internet stranu www.fiatsrbija.rs
  ili pozovite Slu\u017ebu za usluge kupcima na broj 0800 342800 (ovaj broj mo\u017ee
  da varira zavisno od zemlje: molimo vas da pogledate referentnu tabelu u ovde sadr\u017eanom
  odeljku \\\"Lista brojeva slu\u017ebe za usluge kupcima\\\").\\n\\nUPARIVANJE MOBILNOG
  TELEFONA\\n\\nVA\u017dNO: Uradite ovu operaciju samo kada vozilo miruje i u bezbednim
  uslovima; ova funkcija se deaktivira kada je vozilo u pokretu.\\n\\nIako je procedura
  uparivanja telefona opisana u daljem tekstu, mi uvek preporu\u010dujemo da pogledate
  priru\u010dnik za vlasnike mobilnih telefona.\\n\\nZa uparivanje mobilnog telefona,
  postupite kao \u0161to slijedi:\\n\\n- aktivirajte funkciju Bluetooth na mobilnom
  telefonu;\\n- pritisnite dugme PHONE (9 \u2013 sl. 1) na prednjem panelu;\\n- ako
  jo\u0161 nijedan telefon nije uparen sa sistemom, displej pokazuje namenski ekran;\\n-
  izaberite YES da po\u010dnete proceduru uparivanja zatim tra\u017eite ure\u0111aj
  uconnect na mobilnom telefonu (ukoliko je NO izabrano, prikazuje se glavni ekran
  telefona);\\n- na tra\u017eenje mobilnog telefona, upotrebite njegovu tastaturu
  da unesete PIN kod prikazan na displeju sistema ili potvrdite na mobilnom telefonu
  prikazani PIN;\\n- iz ekrana telefona mo\u017eete uvek da uparite mobilni telefon
  pritiskanjem dugmeta SETTINGS (pode\u0161avanja): pritisnite dugme ADD DEVICE (dodaj
  ure\u0111aj) i postupite kao \u0161to je prethodno opisano;\\n- tokom faze uparivanja
  prikazuje se ecran koji pokazuje napredovanje operacije;\\n- ukoliko se procedura
  uparivanja uspe\u0161no zavr\u0161i, prikazuje se odgovaraju\u0107a poruka na ekranu:
  odgovorite YES na pitanje da li da se mobilni telefon upari kao favorit (mobilni
  telefon \u0107e imati prioritet u odnosu sve ostale mobilne telefone koji \u0107e
  se kasnije uparivati). Ukoliko nijedan drugi ure\u0111aj nije uparen, sistem \u0107e
  smatrati prvi povezani ure\u0111aj kao favorit.\\n\\nVA\u017dNO\\n\\nPrioritet se
  utvr\u0111uje zavisno od redosleda konekcije mobilnih telefona koji nisu odre\u0111eni
  kao favoriti. Poslednji konektovani telefon ima\u0107e najve\u0107i prioritet.\\n\\nMEMORISANJE
  IMENA / BROJEVA U IMENIKU MOBILNOG TELEFONA\\n\\nPre uparivanja va\u0161eg mobilnog
  telefona, proverite da li ste memorisali imena koja \u017eelite da kontaktirate
  u telefonskom imeniku va\u0161eg mobilnog telefona, kako biste mogli da ih pozovete
  kori\u0161\u0107enjem sistema slobodnih ruku koji vozilo ima.\\n\\nUkoliko va\u0161
  telefonski imenik ne sadr\u017ei nijedno ime, unesite imena za one brojeve koje
  naj\u010de\u0161\u0107e koristite.\\n\\nZa vi\u0161e detalja, pogledajte uputstvo
  za kori\u0161\u0107enje va\u0161eg mobilnog telefona.\\n\\nVA\u017dNO: Imena u telefonskom
  imeniku koja nemaju brojeve telefona ili ime i prezime ne\u0107e biti prikazana.\\n\\nKONEKC\u0132A
  / DISKONEKC\u0132A MOBILNOG TELEFONA ILI Bluetooth AUDIO URE\u0110AJA\\n\\nKonekcija\\n\\nSistem
  se konektuje automatski na mobilni telefon koji je uparen sa najve\u0107im prioritetom.\\n\\nZa
  izbor odre\u0111enog mobilnog telefona ili Bluetooth audio ure\u0111aja, postupite
  kao \u0161to sledi:\\n\\n- pritisnite dugme SETTINGS (I 0 \u2013 sl. I) na prednjoj
  plo\u010di;\\n- izaberite PHONE / BLUETOOTH na displeju;\\n- izaberite listu PAIRED
  PHONES (upareni telefoni) ili PAIRED AUDIO (uparen AUDIO) kori\u0161\u0107enjem
  odgovaraju\u0107eg dugmeta na displeju;\\n- izaberite odre\u0111eni ure\u0111aj
  (mobilni telefon ili Bluetooth ure\u0111aj)\\n- pritisnite dugme CONNECT (konektovanje);\\n-
  tokom faze konekcije bi\u0107e prikazan ekran koji pokazuje napredovanje procesa;\\n-
  konektovani ure\u0111aj bi\u0107e obele\u017een na listi.\\n\\nDiskonekcija (isklju\u010divanje)\\n\\nZa
  isklju\u010divanje odre\u0111enog mobilnog telefona ili Bluetooth audio ure\u0111aja,
  postupite kao \u0161to sli:\\n\\n- pritisnite dugme SETTINGS (pode\u0161avanja)
  (I 0 \u2013 sl. I) na prednjem panelu;\\n- izaberite PHONE / BLUETOOTH na displeju;\\n-
  izaberite listu PAIRED PHONES (upareni telefoni) ili PAIRED AUDIO (upareni AUDIO)
  kori\u0161\u0107enjem odgovaraju\u0107eg dugmeta na displeju;\\n- izaberite odre\u0111eni
  ure\u0111aj (mobilni telefon ili Bluetooth ure\u0111aj);\\n- pritisnite dugme DISCONNECT
  (isklju\u010divanje).\\n\\nBRISANJE MOBILNOG TELEFONA ILI Bluetooth AUDIO URE\u0110AJA\\n\\nZa
  brisanje moiblnog telefona ili Bluetooth audio ure\u0111aja sa liste, postupite
  kao \u0161to sli:\\n\\n- pritisnite dugme SETTINGS (I 0 \u2013 sl. I) na prednjem
  panelu;\\n- izaberite PHONE / BLUETOOTH na displeju;\\n- izaberite listu PAIRED
  PHONES ili PAIRED AUDIO kori\u0161\u0107enjem odgovaraju\u0107eg dugmeta na displeju;\\n-
  izaberite ure\u0111aj (mobilni telefon ili Bluetooth ure\u0111aj);\\n- pritisnite
  dugme DELETE DEVICE (izbri\u0161i ure\u0111aj);\\n- na displeju \u0107e se pojaviti
  ekran za potvrdu: pritisnite YES za brisanje ure\u0111aja ili NO da poni\u0161tite
  postupak.\\n\\nPODE\u0160AVANJE MOBILNOG TELEFONA\\nILI Bluetooth AUDIO URE\u0110AJA\\nKAO
  FAVORITA\\n\\nZa pode\u0161avanje mobilnog telefona ili Bluetooth audio ure\u0111aja
  kao favorita, postupite kao \u0161to sli\u010di:\\n\\n- pritisnite dugme SETTINGS
  (10 \u2013 sl. 1) na prednjoj plo\u010di;\\n- izaberite PHONE / BLUETOOTH na displeju;\\n-
  izaberite listu PAIRED PHONES (upareni telefoni) ili PAIRED AUDIO (upareni AUDIO)
  kori\u0161\u0107enjem odgovaraju\u0107eg dugmeta na displeju;\\n- izaberite odre\u0111eni
  ure\u0111aj (mobilni telefon ili Bluetooth ure\u0111aj);\\n- pritisnite dugme MAKE
  FAVOURITE (u\u010dini favoritom);\\n- izabrani ure\u0111aj se preme\u0161ta u vrh
  liste\\n\\nBRISANJE TELEFONSKIH PODATAKA\\n(TELEFONSKOG IMENIKA I LISTE POZIVA)\\n\\nIzaberite
  PHONE DATA DELETE (brisanje telefonskih podataka) na displeju za brisanje liste
  novijih poziva i telefonskog imenika.\\n\\nPRENOS TELEFONSKIH PODATAKA\\n(TELEFONSKOG
  IMENIKA I LISTE POZIVA)\\n\\nUkoliko va\u0161 mobilni telefon ima funkciju za slanje
  telefonskog imenika putem Bluetooth tehnologije.\\n\\nTokom procedure uparivanja
  pojavlje se ekran sa pitanjem DO YOU WANT TO DOWNLOAD YOUR PHONE DATA AND RECENT
  CALLS? (da li \u017eelite da primite va\u0161e telefonske podatke i novije pozive?).\\n\\nOdgovorite
  YES za kopiranje celog telefonskog imenika i liste novijih poziva u sistem.\\n\\nOdgovorite
  NO da ovu operaciju uradite kasnije.\\n\\nPosle prvog prenosa telefonskih podataka,
  procedura prenosa i a\u017euriranja telefonskog imenika (ukoliko je podr\u017eana)
  po\u010dinje \u010dim se uspostavi Bluetooth konekcija izme\u0111u mobilnog telefona
  i sistema.\\n\\nSvaki put kada je mobilni telefon konektovan na sistem, mogu\u0107e
  je primiti i a\u017eurirati maksimum 1000 kontakata za svaki telefon.\\n\\nZavisno
  od koli\u010dine primljenih stavki iz telefonskog imenika, mogu\u0107e je da do\u0111e
  do malog ka\u0161njenja pre nego \u0161to je mogu\u0107e koristiti poslednja primljena
  imena. Do tada \u0107e biti na raspolaganju prethodno primljeni telefonski imenik
  (ukoliko ga ima).\\n\\nPristup je mogu\u0107 samo telefonskom imeniku mobilnog telefona
  koji je trenutno konektovan na sistem. Primljeni telefonski imenik iz mobilnog telefona
  se ne mo\u017ee ni menjati ni brisati putem sistema uconnect: promene \u0107e biti
  prenete i a\u017eurirane u sistemu kada se mobilni telefon konektuje slede\u0107i
  put.\\n\\n**PRAVLJENJE TELEFONSKOG POZIVA**\\n\\nPristup ni\u017ee opisanim postupcima
  je mogu\u0107 samo ukoliko je podr\u017ean mobilnim telefonom koji je u upotrebi.
  Za sve raspolo\u017eive funkcije, pogledajte priru\u010dnik za vlasnika mobilnog
  telefona.\\n\\nPoziv mo\u017eete napraviti:\\n\\n- biranjem ikone (telefonski imenik
  mobilnog telefona);\\n- biranjem RECENT CALLS (noviji pozivi)\\n- biranjem ikone\\n-
  pritiskanjem dugmeta REDIAL (ponovno biranje broja).\\n\\n**BIRANJE TELEFONSKOG
  BROJA KORI\u0160\u0106ENJEM IKONE TASTATURE NA DISPLEJU**\\n\\nUnesite telefonski
  broj kori\u0161\u0107enjem prikazane grafi\u010dke tastature.\\n\\nPostupite kao
  \u0161to slije:\\n\\n- pritisnite dugme PHONE (9 \u2013 sl.I) na prednjoj plo\u010di;\\n-
  pritisnite dugme na displeju i upotrebite numerisana dugmad za uno\u0161enje broja;\\n-
  ipritisnite dugme CALL (pozovi) da pozovete broj.\\n\\n**Biranje telefonskog broja
  kori\u0161\u0107enjem mobilnog telefona**\\n\\nMogu\u0107e je biranje telefonskog
  broja mobilnim telefonom i nastavljanje kori\u0161\u0107enja sistema (nemojte dovoliti
  da vam popusti pa\u017enja dok vozite).\\n\\nKada se bira telefonski broj pomo\u0107u
  tastature mobilnog telefona, zvuk poziva se emituje preko zvu\u010dnog sistema va\u0161eg
  vozila.\\n\\nLista poziva\\n\\nMogu\u0107 je prikaz liste poslednjih napravljenih
  poziva za svaku od slede\u0107ih vrsta poziva:\\n\\n- primljeni pozivi;\\n- napravljeni
  pozivi;\\n- neodgovoreni pozivi;\\n- svi pozivi.\\n\\nZa pristup ovim vrstama poziva,
  pritisnite dugme RECENT CALLS (noviji pozivi) na glavnom ekranu menija telefona.\\n\\nUPRAVLJANJE
  DOLAZNIM POZIVOM\\n\\nKomande poziva\\n\\nDugmad na displeju omogu\u0107ava upravljanje
  slede\u0107im funkcijama telefonskih poziva:\\n\\n- Javljanje;\\n- Kraj;\\n- Ignorisanje;\\n-
  Stavljanje na \u010dekanje / nastavljanje;\\n- Deaktiviranje / aktiviranje mikrofona;\\n-
  Prebacivanje poziva;\\n- Prebacivanje s jednog poziva na drugi;\\n- Konferencijska
  opcija / spajanje dva aktivna poziva.\\n\\nPrihvatanje telefonskog poziva\\n\\nKada
  se prima telefonski poziv na mobilni telefon, sistem deaktivira audio sistem (ukoliko
  je aktivan) i prikazuje odgovaraju\u0107u poruku na ekranu.\\n\\nPritisnite dugme
  ANSWER (odgovori) ili dugme \u23f1\ufe0f na komandama upravlja\u010da da biste se
  javili.\\n\\nOdbijanje telefonskog poziva\\n\\nPritisnite dugme IGNORE ili dugme
  \ud83d\udcde na komandama upravlja\u010da da odbijete poziv.\\n\\nPrihvatanje dolaznog
  poziva u toku aktivnog razgovora\\n\\nZa prihvatanje dolaznog poziva dok je drugi
  telefonski razgovor u toku, pritisnite dugme ANSWER kako biste stavili teku\u0107i
  poziv na \u010dekanje i javili se na nov dolazni poziv.\\n\\nVA\u017dNO: Ne mogu
  svi mobilni telefoni da podr\u017ee upravljanje dolaznim pozivom kada je drugi telefonski
  razgovor aktivan.\\n\\nPRAVLJENJE DRUGOG TELEFONSKOG POZIVA\\n\\nKada je jedan telefonski
  razgovor aktivan, mo\u017eete napraviti drugi poziv na slede\u0107i na\u010din:\\n\\n-
  izaberite broj / kontakt sa liste novijih poziva;\\n- izaberite kontakt iz telefonskog
  imenika;\\n- pritisnite dugme HOLD (\u010dekanje) i izaberite broj kori\u0161\u0107enjem
  grafi\u010dke tastature na displeju.\\n\\nUPRAVLJANJE SA DVA TELEFONSKA POZIVA\\n\\nUkoliko
  su dva poziva u toku (jedan aktivan i jedan na \u010dekanju), mogu\u0107e je prebacivanje
  s jednog na drugi, pritiskanjem dugmeta CALL ON HOLD (poziv na \u010dekanju) ili
  spajanje dva poziva u konferencijski razgovor pritiskanjem dugmadi MERGE CALLS (spajanje
  poziva).\\n\\nVA\u017dNO:\\nProverite da li telefon koji koristite podr\u017eava
  upravljanje drugim pozivom i konferencijski na\u010din rada.\\n\\nZAVR\u0160AVANJE
  POZIVA\\n\\nPritisnite dugme END ili dugme  na komandama upravlja\u010da kako biste
  zavr\u0161ili poziv koji je u toku.\\n\\nSamo \u0107e se teku\u0107i poziv zavr\u0161iti,
  a poziv koji je na \u010dekanju, ukoliko ga ima, postaje novi aktivni poziv.\\n\\nZavisno
  od vrste mobilnog telefona, ukoliko poziva\u010d zavr\u0161i teku\u0107i poziv,
  mogu\u0107e je da se poziv na \u010dekanju ne aktivira automatski.\\n\\nPONOVNO
  BIRANJE BROJA\\n\\nZa pozivanje broja / kontakta poslednjeg napravljenog poziva,
  pritisnite dugme REDIAL (ponovno pozivanje broja).\\n\\nNASTAVAK TELEFONSKOG POZIVA\\n\\nPo
  ga\u0161enju motora, i dalje je mogu\u0107e nastaviti telefonski poziv.\\n\\nPoziv
  se nastavlja dok se ru\u010dno ne zavr\u0161i ili maksimalno u trajanju od oko 20
  minuta.\\n\\nKada se sistem isklju\u010di, poziv se prebacuje na mobilni telefon.\\n\\nAKTIVIRANJE
  / DEAKTIVIRANJE MIKROFONA\\n\\nMogu\u0107e je deaktivirati mikrofon tokom poziva,
  pritiskanjem dugmeta  na prednjem panelu (ili na komandama upravlja\u010da) ili
  dugmeta MUTE (isklju\u010diti ton) na displeju.\\n\\nKada je mikrofon deaktiviran
  i dalje je mogu\u0107e slu\u0161ati poziv koji je u toku.\\n\\nZa reaktiviranje
  mikrofona, pritisnite ponovo odgovaraju\u0107e dugme.\\n\\nPREBACIVANJE POZIVA\\n\\nTeku\u0107i
  pozivi se mogu prebacivati sa mobilnog telefona na sistem i obrnuto bez zavr\u0161avanja
  poziva.\\n\\nZa prebacivanje poziva, pritisnite dugme TRANSFER.\\n\\n\u010cITA\u010c
  SMS PORUKA\\n\\nSistem mo\u017ee da \u010dita poruke koje primi mobilni telefon.\\n\\nZa
  kori\u0161\u0107enje ove funkcije mobilni telefon mora da podr\u017eava funkciju
  razmene SMS preko Bluetooth.\\n\\nUkoliko telefon ne podr\u017eava ovu funkciju,
  deaktivira se odgovaraju\u0107e dugme (posivi).\\n\\nKada je primljena tekstualna
  poruka, displej pokazuje ekran na kome je mogu\u0107e birati opcije LISTEN (slu\u0161aj),
  CALL (zovi) ili IGNORE (ignorisi).\\n\\nPritisnite dugme za pristup listi primljenih
  SMS poruka u mobilnom telefonu (lista prikazuje maksimum 60 primljenih poruka).\\n\\n\\\"MORE\\\"
  (jo\u0161) MOD (na\u010din rada)\\n\\nPritisnite dugme MORE (8 \u2013 sl. I) na
  prednjem panelu za prikaz (videti sl. 14) slede\u0107ih pode\u0161avanja operacija:\\n\\n-
  putni kompjuter;\\n- sat;\\n- eco:Drive\\n\\nPUTNI KOMPUITER\\n\\nPritisnite dugme
  TRIP (videti sl. 14) za prikaz informacija o vo\u017enji.\\n\\nOva funkcija vam
  omogu\u0107ava da prika\u017eete nivoe potro\u0161nje i da utvrdite dve odvojene
  vo\u017enje ozna\u010dene kao TRIP A (vo\u017enja A) i TRIP B (vo\u017enja B) za
  pra\u0107enje cele vo\u017enje vozila na recipro\u010dno nezavisan na\u010din.\\n\\nObe
  funkcije se mogu resetovati (resetovati \u2013 star tovanje nove vo\u017enje): za
  resetovanje \u017eeljene vo\u017enje (TRIP) pritisnite dugme TRIP A ili TRIP B.\\n\\nSAT\\n\\nPritisnite
  dugme SAT (videti sl. 14) za prikaz sata.\\n\\neco: Drive\\n\\neco:Drive (videti
  sl. 15) prati va\u0161 stil vo\u017enje u vozilu i u stvarnom vremenu pomo\u0107u
  ubrzavanja, usporavanja, stepena prenosa (isklju\u010duju\u0107i verzije sa automatskom
  transmisijom kori\u0161\u0107enom u AUTO na\u010dinu rada) i indeksa brzina koji
  se ra\u010dunaju i memori\u0161u direktno u sistemu;\\n\\nKonektujte se na eco:Drive
  sajt (www.fiat.com/ecodrive) da konfiguri\u0161ete USB koji \u0107ete koristiti
  za ocenu podataka o vo\u017enji i stilu vo\u017enje.\\n\\nNemojte sklanjati USB
  dok sistem ne primi podatke po\u0161to mogu biti izgubljeni potpuno ili delimi\u010dno.\\n\\nslika.
  15\\n\\nAktiviranje\\n\\nPritisnite dugme eco:Drive (videti sl. 14) za interakciju
  sa ovom funkcijom.\\n\\nZa aktiviranje ove funkcije pritisnite dugme eco:Drive ON.\\n\\nPrikaza\u0107e
  se ekran (videti sl. 16) koji \u0107e pokazati 4 indeksa:\\n\\n- ubrzavanje\\n-
  usporavanje\\n- stepena prenosa (samo 3 indeksa za verzije sa automatskom transmisijom
  bez indeksa stepena prenosa);\\n- brzine.\\n\\nOvi indeksi su sivi dok sistem ne
  dobije dovoljno podataka da oceni stil vo\u017enje ili u slu\u010daju dugih stajanja.\\n\\nPo
  \u0161to dobije dovoljno podataka, indeksi \u0107e imati 4 boje, zavisno od ocene:
  zelena (vrlo dobra), \u017euta, narand\u017easta i crvena (vrlo lo\u0161a).\\n\\nProsek
  ovih indeksa bi\u0107e prikazan iznad njih, u stvarnom vremenu, ukazuju\u0107i na
  eko-odr\u017eivost stila vo\u017enje, od 0 (slaba) do 100 (jaka).\\n\\nZa proveru
  proseka podataka prethodne vo\u017enje (vo\u017enja po\u010dinje kada se klju\u010d
  za paljenje okrene na MAR i zavr\u0161ava kada se okrene na STOP), izaberite dugme
  PREVIOUS TRIP (prethodna vo\u017enja) (videti sl. 17).\\n\\nPodaci se automatski
  prebacuju na USB kada se ugasi motor. Preba\u010deni podaci se bri\u0161u iz memorije
  sistema.\\n\\nKada se podaci prebace na USB, mogu\u0107e je da displej pokaze uputstva
  o koracima pravilnog postupka: po\u0161tujte ova uputstva.\\n\\nOve poruke se prikazuju
  samo kada je klju\u010d za paljenje u polo\u017eaju STOP, a isklju\u010divanje radija
  odlo\u017eeno za vi\u0161e od 0 minuta.\\n\\n**Va\u017eno**\\n\\nLampice upozorenja
  \u0107e biti prikazane, kada je puna memorija USB.\\n\\n*Deaktiviranje*\\n\\nPritisnite
  dugme eco:Drive Off da deaktivirate ovu funkciju.\\n\\n**PODE\u0160AVANJA**\\n\\nPritisnite
  dugme SETTINGS (pode\u0161avanja) (10 \u2013 sl. I) na prednjoj plo\u010di za prikaz
  glavnog menija SETTINGS (videti sl. 18).\\n\\n**VA\u017dNO:** Prikazane stavke menija
  variraju zavisno od verzije.\\n\\nMeni sadr\u017ei slede\u0107e opcije:\\n\\n- DISPLAY
  (prikaz)\\n- TIME & DATE (vreme i datum)\\n- SAFETY / ASSISTANCE (bezbednost / pomo\u0107)
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n- LIGHTS (svetla)
  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno);\\n- DOORS & LOCKS (vrata
  i brave)\\n- AUDIO\\n- RADIO\\n- RESTORE DEFAULT SETTINGS (vra\u0107anje standardnog
  pode\u0161avanja)\\n\\nslika. 18\\n\\nDisplej (prikaz)\\n\\nMeni DISPLAY sadr\u017ei
  slede\u0107e opcije:\\n\\n- **BRIGHTNESS** (ja\u010dina osvetljenja) (ovo pode\u0161avanje
  nije na raspolaganju kada se na\u010din rada displeja pode\u0161i na AUTOMATIC):
  izaberite BRIGHTNESS i pritisnite dugmad + ili - za pode\u0161avanje ja\u010dine
  osvetljenja displeja sa upaljenim ili uga\u0161enim farovima (pode\u0161avanje koje
  ne odgovara aktivnom stanju farova je sivo).\\n\\n- **DISPLAY MODE** (na\u010din
  rada displeja): pritisnite dugme DISPLAY MODE da podesite ja\u010dinu osvetljenja
  displeja zavisno od toga da li se radi o danu (DAY), no\u0107i (NIGHT) ili AUTO
  (automatsko). Ja\u010dina osvetljenja displeja u AUTO na\u010dinu rada izjedna\u010dena
  je sa ja\u010dinom osvetljenja instrument table.\\n\\n- **LANGUAGE** (jezik): pritisnite
  dugme LANGUAGE za izbor jednog od jezika koji su na raspolaganju.\\n\\n- **UNITS**
  (jedinice): pritisnite dugme UNITS za izbor odgovaraju\u0107e jedinice za TEMPERATURE
  (\u00b0C ili \u00b0F), DISTANCE (rastojanja) (km ili mi) i FUEL CONSUMPTION (potro\u0161nja
  goriva). Ukoliko \u0107e rastojanja biti merena u km, za potro\u0161nju goriva je
  mogu\u0107 izbor km/l ili l/100 km. Ukoliko su rastojanja u mi (miljama), onda se
  automatski pode\u0161ava miles per gallon (mpg) (milja po galonu).\\n\\n- **VOICE
  RESP. LENGTH** (du\u017eina poruke): pritisnite odgovaraju\u0107e dugme da pode\u0161ite
  nivo detalja govornih poruka koje daje sistem i prikazanih sugestija.\\n\\n- **TOUCHSCREEN
  BEEP** (zujalica ekrana na dodir): pritisnite odgovaraju\u0107e dugme da aktivirate
  / deaktivirate akusti\u010dni signal koji se javlja pritiskanjem dugmadi na displeju.\\n\\n-
  **DISPLAY TRIP B** (prikaz vo\u017enje B): pritisnite odgovaraju\u0107e dugme da
  aktivirate/ deaktivirate prikaz vo\u017enje B na displeju instrument plo\u010de\\n\\n**Clock
  & Date. (sat i datum)**\\n\\nUpotrebite ovu funkciju da podesite sat.\\n\\nPode\u0161avanje
  vremena\\n\\nPritisnite dugme SETTINGS (10 \u2013 sl. 1) na prednjem panelu, zatim
  izaberite CLOCK&DATE (videti sl. 18). Izaberite SET TIME (podesi vreme) i pritiskajte
  dugmad \u25b2 ili \u25bc (videti sl. 19) kako biste podesili sate i minute. Pritisnite
  dugmad 12h ili 24h za izbor formata vremena.\\n\\nU na\u010dinu rada sa 12h imate
  am (prepodne) i pm (popodne).\\n\\nU meniju CLOCK, mo\u017eete izabrati SHOW TIME
  STATUS (poka\u017ei status vremena) za aktiviranje / deaktiviranje prikazivanja
  sata u vrhu displeja (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno).\\n\\nPode\u0161avanje
  datuma\\n\\nZa pode\u0161avanje datuma postupite isto kao za pode\u0161avanje vremena:
  izaberite SET DATE (podesi datum) za pode\u0161avanje dana, meseca i godine.\\n\\nSAFETY/ASSISTANCE
  (bezbednost / pomo\u0107)\\n\\n(za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)\\n\\nIzaberite
  ovu funkciju da podesite osetljivost senzora za ki\u0161u (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno).\\n\\nSvetla\\n\\n(za verzije / tr\u017ei\u0161ta za
  koje je predvi\u0111eno)\\n\\nUpotrebite ovu funkciju da izvr\u0161ite slede\u0107a
  pode\u0161avanja:\\n\\n- TWILIGHT SENSOR (senzor za sumrak)\\n  (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno): pode\u0161avanje osetljivosti za uklju\u010divanje
  farova;\\n\\n- DAYTIME LIGHTS (DRL)\\n  (za verzije / tr\u017ei\u0161ta za koje
  je predvi\u0111eno): aktiviranje / deaktiviranje dnevnih svetala;\\n\\n- CORNERING
  LIGHTS (svetla za skretanje)\\n  (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno):
  aktiviranje / deaktiviranje svetla za krivine.\\n\\nVrata i brave\\n\\nUpotrebite
  ovu funkciju da aktivirate / deaktivirate automatsko zaklju\u010davanje vrata kada
  je vozilo u pokretu (funkcija AUTOCLOSE).\\n\\nAudio\\n\\nVideti deo \\\"Audio\\\"
  u poglavlju \\\"Uklju\u010divanje / isklju\u010divanje sistema\\\".\\n\\nTelefon
  / Bluetooth\\n\\nVideti opis u delu \\\"Konektovanje / diskonektovanje mobilnog
  telefona ili Bluetooth audio ure\u0111aja u poglavlju \\\"Telefon mod (na\u010din
  rada)\\\".\\n\\nRadio\\n\\nUpotrebite ovu funkciju za konfiguraciju slede\u0107ih
  opcija:\\n\\n- TRAFFIC ANNOUNCEMENT (saop\u0161tenje o saobra\u0107aju): aktiviranje
  / deaktiviranje automatskog uklju\u010divanja saop\u0161tenja o saobra\u0107aju
  (funkcija TA);\\n- ALTERNATIVE FREQUENCY (alternativna frekvencija): aktiviranje
  / deaktiviranje automatskog pode\u0161avanja ja\u010deg signala za izabranu stanicu
  (funkcija AF);\\n- REGIONAL: aktiviranje / deaktiviranje automatskog pode\u0161avanja
  na stanicu koja emituje regionalne vesti (funkcija REG);\\n- PLAYING DAB ANNOUNCEMENTS
  (digitalno audio emitovanje saop\u0161tenja): aktiviranje / deaktiviranje automatskog
  pode\u0161avanja na saop\u0161tenja DAB i izbor kategorija saop\u0161tenja po \u017eelji
  me\u0111u raspolo\u017eivim.\\n\\nVra\u0107anje standardnih pode\u0161avanja\\n\\nUpotrebite
  ovu funkciju da vratite pode\u0161avanja za displej, vreme, datum, audio i radio
  na standardne vrednosti koje je podesio proizvo\u0111a\u010d.\\n\\nGOVORNE KOMANDE\\n\\nUPOTREBA
  GOVORNIH KOMANDI\\n\\nMolimo vas da sledite ni\u017ee date savete kako biste bili
  sigurni da \u0107e sistem uvek prepoznati govorne komande:\\n\\n- govorite normalnom
  ja\u010dinom zvuka;\\n- sa\u010dekajte uvek zvu\u010dni signal pre nego \u0161to
  govorite;\\n- sistem je u stanju da prepozna date govorne komande, bez obzira na
  pol, po tonu glasa i intonaciji lica koje daje instrukcije;\\n- ukoliko je mogu\u0107e,
  nastojte da svedete buku u putni\u010dkoj kabini na minimum;\\n- pre davanja govornih
  komandi, zamolite ostale putnike da ne govore. Ovo je u cilju da spre\u010dite nesporazum,
  po\u0161to sistem mo\u017ee da prepozn\u00e1 druge re\u010di (pored onih iz va\u0161e
  govorne komande ili drug\u010dije od njih) ukoliko nekoliko ljudi govori;\\n- za
  optimalan rad preporu\u010duje se da zatvorite prozore i krov na otvaranje (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno) kako bi se izbegle spolja\u0161nje
  smetnje.\\n\\nVA\u017dNO: Govorne komande treba uvek davati u uslovima bezbedne
  vo\u017enje, uz po\u0161tovanje va\u017ee\u0107ih zakona u zemlji u kojoj vozite
  i pravilno kori\u0161\u0107enje mobilnog telefona.\\n\\nUPOTREBA KOMANDI UPRAVLJA\u010cA
  ZA AKTIVIRANJE GOVORNIH KOMANDI\\n\\nDugme PHONE\\n\\nDugme na komandama upravlja\u010da
  aktivira sistem za prepoznavanje glasa za telefon u cilju pravljenja poziva, prikazivanja
  novijih dolaznih i odlaznih poziva i telefonskog imenika itd.\\n\\nSvaki put kada
  se pritisne dugme , \u010duje se zvu\u010dni signal i displej prikazuje ekran sa
  predlozima, kojim se korisnik poziva da izda komandu.\\n\\nDugme VOICE (glas)\\n\\nDugme
  na komandama upravlja\u010da aktivira sistem za prepoznavanje glasa za radio / medije
  u cilju:\\n\\n- pode\u0161avanja odre\u0111ene radio stanice;\\n- pode\u0161avanja
  odre\u0111ene AF/FM radio frekvencije;\\n- emitovanja treka na USB /iPod/CD MP3;\\n-
  emitovanja datoteke sa albuma na USB /iPod/CD MP3.\\n\\nSvaki put kada se pritisne
  dugme , \u010duje se zvu\u010dni signal i displej prikazuje ekran sa predlozima,
  kojim se korisnik poziva da izda komandu.\\n\\nBrzo kori\u0161\u0107enje glasovne
  interakcije\\n\\nKada se pritisne dugme  ili  tokom govorne poruke sistema, mogu\u0107e
  je direktno izgovoriti govornu komandu.\\n\\nNa primer, ukoliko sistem izgovara
  govornu poruku pomo\u0107i, a vi znate komandu koju treba dati sistemu, pritisnite
  dugme  ili , govorna poruka \u0107e se prekinuti, a vi mo\u017eete re\u0107i \u017eeljenu
  govornu komandu direktno (ne morate da saslu\u0161tate celu govornu poruku pomo\u0107i).\\n\\nUkoliko
  se pritisne dugme  ili  kada sistem \u010deka govornu komandu korisnika, zatvara
  se govorna sesija.\\n\\nSTATUS GOVORNE SESIJE\\n\\nSistem prikazuje status govorne
  sesije sa odgovaraju\u0107im ikonama:\\n\\n-  (zelena ikona): prikazuje se kada
  sistem slu\u0161a. U ovom slu\u010daju mo\u017eete re\u0107i govornu komandu;\\n\\n-  (zelena
  ikona): prikazuje se kada je sistem protuma\u010dio izgovorenu govornu komandu i
  njena funkcija se izvr\u0161ava. U ovom slu\u010daju ne mo\u017eete izgovoriti govornu
  komandu.\\n\\n-  (zelena ikona): prikazuje se kada sistem obra\u0111uje datu govornu
  komandu. U ovom slu\u010daju ne mo\u017eete izgovoriti govornu komandu.\\n\\n- ?  (\u017euta
  ikona): prikazuje se kada sistem govori poruku pomo\u0107i, informacija ili vi\u0161estrukog
  izbora. U ovom slu\u010daju ne mo\u017eete izgovoriti govornu komandu;\\n\\n- \u00d7  (crvena
  ikona): prikazuje se kada korisnik zavr\u0161ava govornu interakciju. U ovom slu\u010daju
  ne mo\u017eete da izgovorite govornu komandu.\\n\\nVI\u0160ESTRUKI IZBOR\\n\\nU
  nekoliko specifi\u010dnih slu\u010dajeva sistem ne mo\u017ee sa sigurno\u0161\u0107u
  da defini\u0161e izgovorenu komandu i tra\u017ei da se napravi izbor izme\u0111u
  maksimum \u010detiri alternative.\\n\\nNa primer, ako vi tra\u017eite da se pozove
  neko ime iz telefonskog imenika, a u njemu ima sli\u010dnih imena, sistem \u0107e
  predlo\u017eiti numeri\u010dku listu raspolo\u017eivih alternativa (videti sl. 20)
  i tra\u017eiti da se ka\u017ee pripadaju\u0107i broj.\\n\\nslika. 20\\n\\nGLOBALNE
  GOVORNE KOMANDE\\n\\nuconnect GOVORNE KOMANDE\\nGLOBALNE govorne komande\\n\\nOve
  komande se mogu prikazati na bilo kom displeju posle pritiskanja komandne dugmadi
  \u2318 ili \u232c na upravlja\u010du, pod uslovom da nema teku\u0107ih telefonskih
  poziva.\\n\\nHELP (pomo\u0107)\\nDaje korisniku generi\u010dku podr\u0161ku, predlaganjem
  nekih raspolo\u017eivih komandi\\n\\nCANCEL (ponisti)\\nZatvara teku\u0107i vodi\u010d
  za govorne komande\\n\\nREPEAT (ponovi)\\nPonavlja poslednju govornu poruku\\n\\nVOICE
  TUTORIAL (vodi\u010d za govorne komande)\\nDaje korisniku detaljan opis kori\u0161\u0107enja
  govornog sistema.\\n\\nslika. 21\\n\\nUkoliko je neki telefon konektovan preko Bluetooth
  na sistem uconnect, ove komande se mogu dati putem bilo kog od glavnih displeja
  posle pritiskanja dugmeta \u2b07\ufe0f pod uslovom da nema teku\u0107ih telefonskih
  poziva.\\n\\nUkoliko nijedan telefon nije konektovan preko Bluetooth, sistem uconnect
  \u0107e dati govornu poruku: \\\"THERE ARE NO PAIRED PHONES. PAIR A PHONE AND TRY
  AGAIN\\\" (Nema uparenih telefona. Uparite telefon i poku\u0161ajte ponovo) i sesija
  \u0107e biti zavr\u0161ena.\\n\\nCALL (pozovi) Mario Rossi\\nPoziva broj telefona
  koji pripada kontaktu Mario Rossi (videti NAPOMENE 1 i 4)\\n\\nCALL (pozovi) Mario
  Rossi mobilni\\nPoziva broj telefona sa mobilnom zastavicom koji pripada kontaktu
  Mario Rossi. (videti NAPOMENE 2 i 4)\\n\\nDIAL (okreni broj) 0127457322\\nPoziva
  broj 0127457322 (videti NAPOMENU 3)\\n\\nREDIAL (okreni ponovo broj)\\nPoziva broj
  ili kontakt vezano za poslednji odlazni poziv.\\n\\nUkoliko je neki telefon konektovan
  preko Bluetooth na sistem uconnect, ove komande se mogu dati putem bilo kog od glavnih
  displeja posle pritiskanja dugmeta t, pod uslovom da nema teku\u0107ih telefonskih
  poziva.\\n\\nUkoliko nijedan telefon nije konektovan preko Bluetooth, sistem uconnect
  \u0107e dati govornu poruku: \\\"THERE ARE NO PAIRED PHONES. PAIR A PHONE AND TRY
  AGAIN\\\" (Nema uparenih telefona. Uparite telefon i poku\u0161ajte ponovo) i sesija
  \u0107e biti zavr\u0161ena.\\n\\nCALL BACK (povratni poziv)\\nPoziva broj ili kontakt
  koji odgovara poslednjem dolaznom pozivu.\\n\\nDISPLAY THE RECENT CALLS (prika\u017ei
  novije pozive)\\nPrikazuje kompletnu listu poslednjih poziva: odlaznih, propu\u0161tenih
  i dolaznih. (videti NAPOMENU 4)\\n\\nOUTGOING CALLS (odlazni pozivi)\\nPrikazuje
  listu odlaznih poziva (videti NAPOMENU 4)\\n\\nDISPLAY MISSED (prikaz propu\u0161tenih
  poziva)\\nPrikazuje listu propu\u0161tenih poziva (videti NAPOMENU 4)\\n\\nUkoliko
  je neki telefon konektovan preko Bluetooth na sistem uconnect, ove komande se mogu
  dati putem bilo kog od glavnih displeja posle pritiskanja dugmeta pod uslovom da
  nema teku\u0107ih telefonskih poziva. Ukoliko nijedan telefon nije konektovan preko
  Bluetooth, sistem uconnect \u0107e dati govornu poruku: \\\"THERE ARE NO PAIRED
  PHONES. PAIR A PHONE AND TRY AGAIN\\\" (Nema uparenih telefona. Uparite telefon
  i poku\u0161ajte ponovo) i sesija \u0107e biti zavr\u0161ena.\\n\\n- **INCOMING
  CALLS** (dolazni pozivi)\\n  - Prikazuje listu dolaznih poziva (videti NAPOMENU
  4)\\n\\n- **PHONEBOOK** (telefonski imenik)\\n  - Prikazuje telefonski imenik uparenih
  telefona (videti NAPOMENU 4)\\n\\n- **SEARCH FOR** (tra\u017ei) Mario Rossi\\n  -
  Prikazuje kontakt Marija Rosija koji se nalazi u telefonskom imeniku zajedno sa
  svim memorisanim pripadaju\u0107im brojevima (videti NAPOMENE 1 i 4)\\n\\n- **SEARCH
  FOR** (tra\u017ei) Mario Rossi mobilni\\n  - Prikazuje telefonski broj sa mobilnom
  zastavicom koji pripada kontaktu Mariju Rosiju u telefonskom imeniku. (videti NAPOMENE
  2 i 4)\\n\\n- **DISPLAY SMS** (tra\u017ei) prika\u017ei SMS poruke\\n  - Prikazuje
  listu SMS poruka koje je primio upareni telefon. (videti NAPOMENU 5)\\n\\nNAPOMENE\\n\\n1.
  <Mario Rossi> se mo\u017ee zameniti sa bilo kojim imenom iz telefonskog imenika
  va\u0161eg mobilnog telefona.\\n\\nUkoliko telefon dozvoljava memorisanje <name>
  (imena) (Mario) i <surname> (prezimena) (Rossi) u dva razli\u010dita polja, mogu\u0107e
  je dati slede\u0107e govorne komande:\\n\\nCALL (pozovi) <Mario> <Rossi>\\n\\nCALL
  (pozovi) <Rossi> <Mario>\\n\\nSEARCH FOR (tra\u017ei) <Mario> <Rossi>\\n\\nSEARCH
  FOR (tra\u017ei) <Rossi> <Mario>\\n\\n2. <mobile> se mo\u017ee zameniti sa jednom
  od 3 raspolo\u017eive zastavice: <home> (ku\u0107i), <office> (kancelarija), <other>
  (ostalo).\\n\\nUkoliko telefon dozvoljava memorisanje <name> (Mario) i <surname>
  (Rossi) u dva razli\u010dita polja, mogu\u0107e je dati slede\u0107e govorne komande:\\n\\nCALL
  (pozovi) <Mario> <Rossi> <mobile>\\n\\nCALL (pozovi) <Rossi> <Mario> <mobile>\\n\\nSEARCH
  FOR (tra\u017ei) <Mario> <Rossi> <mobile>\\n\\nSEARCH FOR (tra\u017ei) <Rossi> <Mario>
  <mobile>\\n\\n3. Telefonski broj <0127457322> mo\u017ee se zameniti sa bilo kojim
  drugim telefonskim brojem.\\n\\n4. Ova funkcija je na raspolaganju samo ako telefon,
  konektovan preko Bluetooth, podr\u017eava prijem telefonskog imenika i poslednjih
  poziva na uconnect sistemu i ako je prijem izvr\u0161en.\\n\\n5. Ova funkcija je
  na raspolaganju samo ako telefon, konektovan preko Bluetooth na sistem uconnect,
  podr\u017eava funkciju govornog \u010ditanja SMS poruka.\\n\\nGOVORNE KOMANDE ZA
  RADIO AM/FM/DAB\\n\\nuconnect GOVORNE KOMANDE\\ngovorne komande za RADIO AM/FM/DAB\\n\\nOve
  komande se mogu dati putem bilo kog glavnog displeja posle pritiskanja komandnog
  dugmeta \u23f9 na upravlja\u010du, pod uslovom da nema teku\u0107ih telefonskih
  poziva.\\n\\n- TUNE TO (podesi na) <105.5> <FM>\\n  Pode\u0161ava radio na FM frekvenciju
  105.5 (videti NAPOMENU 1)\\n\\n- TUNE TO (podesi na) <940> <AM>\\n  Pode\u0161ava
  radio na AM frekvenciju 940 (videti NAPOMENU 2)\\n\\n- TUNE TO (podesi na) <EMMEDUEO>
  FM\\n  Pode\u0161ava radio na stanicu EMMEDUEO (videti NAPOMENU 3)\\n\\n- TUNE TO
  DAB CHANNEL (podesi na kanal DAB) <Radio Deejay>\\n  Pode\u0161ava radio DAB na
