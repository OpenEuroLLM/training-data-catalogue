  3.715 |  | 837.165 |  |  |\\n\\nStruktura portfelja\\n\\nU strukturi ukupnog osigurateljnog
  portfelja preovladavaju ne\u017eivotna osiguranja sa 75,57 % u\u010de\u0161\u0107a
  i u odnosu na prethodnu godinu manje je za 2,02 procentnih poena, kada je u\u010de\u0161\u0107e
  iznosilo 77,59 %, \u0161to ukazuje na blago smanjenje u\u010de\u0161\u0107a ne\u017eivotnih
  osiguranja.\\n\\nOd ukupnog iznosa premije 35.981.553 KM ili 8,85 % ostvareno je  putem
  podru\u017enica u RS, \u0161to je u odnosu na prethodnu godinu pove\u0107anje od
  11,24 %.\\n\\n\u017divotno osiguranje u strukturi ukupnog portfelja u\u010destvuje
  sa 24,43 %. U 2013.godini u\u010de\u0161\u0107e je iznosilo 22,41 %, a u 2012. godini
  20,42 %. Navedeno ukazuje na rast u\u010de\u0161\u0107a \u017eivotnog osiguranja  u
  ukupnom portfelju.\\n\\nU okviru ne\u017eivotnih osiguranja, 91,30 % se odnosi na
  sljede\u0107e vrste osiguranja: osiguranje od odgovornosti za motorna vozila (automobilske
  odgovornosti) 54,96%, osiguranje cestovnih vozila \u2013 kasko 14,85 %, imovinska
  osiguranja 12,78 % i osiguranje od nezgode 8,71 %.\\n\\nU\u010de\u0161\u0107e premije
  obaveznih osiguranja u ukupnoj premiji iznosi 43,08 %, i uglavnom se odnosi na obavezno
  osiguranje od autoodgovornosti (41,53 %). Premija osiguranja od automobilske odgovornosti
  iznosi 168.772.291 KM i pove\u0107ana je za 3,76 % u odnosu na prethodnu godinu.
  Navedeno ukazuje da je i\\n\\ndalje prisutna dominacija osiguranja od autoodgovornosti,
  koja je karakteristi\u010dna i za druge zemlje u okru\u017eenju koje su tranzicijske
  zemlje.\\n\\nU\u010de\u0161\u0107e premije kasko osiguranja u ukupnoj premiji iznosi  11,22
  %. Premija kasko osiguranja  iznosi 45.600.883 KM i manja je za 1,56 % u odnosu
  na 2013. godinu. Posmatrano broj\u010dano, raste broj zaklju\u010denih polica kaska  i
  iznosi 6,31 %. Navedeno ukazuje da na kretanje ove vrste osiguranja zna\u010dajno
  uti\u010de lo\u0161iji standard stanovni\u0161tva i slaba kupovna mo\u0107, smanjenje
  kupovine vozila na lizing, pove\u0107ana starost vozila i efekti javnih nabavki.\\n\\nPremija
  imovinskih osiguranja u\u010destvuje u ukupnoj premiji sa 9,66 %. U premiji ne\u017eivotnih
  osiguranja u\u010destvuje sa 12,78 %. Premija ostalih osiguranja imovine iznosi
  18.523.366 KM i manja je za 1,86% u odnosu na prethodnu godinu, dok premija osiguranja
  imovine od po\u017eara iznosi 20.720.915 KM i bilje\u017ei pad od 0,86 % u odnosu
  na prethodnu godinu. U 2013.godini smanjenje premije iznosilo je 3,53 %. I ovdje
  je evidentan uticaj ekonomske situacije ali i nedovoljnog promi\u0161ljanja o potrebi
  osiguranja (naro\u010dito od osiguranja od elementarnih nepogoda).\\n\\nPremija
  osiguranja osoba od nezgode i zdravstvenog osiguranja u ukupnoj premiji u\u010destvuje
  sa 7,88 %, i bilje\u017ei blagi pad u odnosu na prethodne godine kada je u\u010de\u0161\u0107e
  iznosilo 8,48 % u 2013. i 8,88 % u 2012. godini.\\n\\nBilansna struktura\\n\\nVrijednost
  bilansne sume u sektoru osiguranja na dan 31.12.2014. godine iznosila je 1.003.125.943
  KM i ve\u0107a je za 10,16 % u odnosu na prethodnu godinu.\\n\\nAKTIVA\\n\\nOpis
