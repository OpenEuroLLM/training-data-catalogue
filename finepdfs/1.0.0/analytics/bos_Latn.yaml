  Monstat\\n\\nU prvoj polovini 2015. godine najve\u0107a robna razmjena je ostvarena
  sa zemljama EU (41,4%) i CEFTA (37,3%). U strukturi izvoza po regionima, glavni
  spoljnotrgovinski partner Crne Gore su zemlje CEFTA sa 45,4%, zatim zemlje EU gdje
  je izvezeno 41,6% i ostale zemlje sa 13,1%. Najvi\u0161e roba uvozi se iz EU (41,4%),
  a zatim slijedi CEFTA (37,3%) i ostale zemlje (21,3%). Pojedina\u010dno najve\u0107i
  partneri u izvozu su: Srbija (31,6 miliona eura), Italija (29,4 miliona eura), Bosna
  i Hercegovina (17,7 miliona eura) i Kosovo (7,7 miliona eura). U uvozu na prvom
  mjestu je Srbija (232,7 miliona eura), zatim slijede Kina (91,8 miliona eura), Bosna
  i Hercegovina (60,4 miliona eura) i Italija (56,8 miliona eura). Najve\u0107i negativan
  saldo u robnoj razmjeni sa inostranstvom Crna Gora ostvaruje sa Srbijom (201 miliona
  eura), Kinom (89 miliona eura) i Gr\u010dkom (54,6 miliona eura), dok je suficit
  zabilje\u017een u razmjeni sa Kosovom (6,7 miliona eura).\\n\\nGrafik 7.3\\n\\nStruktura
  izvoza i uvoza roba u periodu januar-jun 2015. godine, po zemljama\\n\\nIzvor: Monstat\\n\\n7.1.2.
  Usluge\\n\\nU prvoj polovini 2015. godine ukupan obim razmjene usluga iznosio je
  468,7 miliona eura, \u0161to je za 11,1% vi\u0161e nego u istom periodu prethodne
  godine. U posmatranom periodu ostvaren je suficit u iznosu od 121 milion eura, \u0161to
  je za 1% vi\u0161e u odnosu na isti period prethodne godine. Ukupni prihodi od usluga
  iznosili su 294,8 miliona eura ili 8,9% vi\u0161e u odnosu na isti period 2014.
  godine. Najve\u0107i prihodi ostvareni su u oblasti putovanja-turizma 138,1 milion
  eura, transporta 88,7 miliona eura i ostalih poslovnih usluga 22,5 miliona eura.\\n\\nRashodi
  od usluga u prvoj polovini 2015. godine iznosili su 173,9 miliona eura i bili su
  ve\u0107i za 15,1% u odnosu na prethodnu godinu. U strukturi rashoda najve\u0107e
  u\u010de\u0161\u0107e imaju rashodi ostvareni po osnovu transporta od 38,6% (67,1
  milion eura). Rashodi ostvareni po osnovu ostalih poslovnih usluga iznosili su 36,9
  miliona eura, i njihovo u\u010de\u0161\u0107e u ukupnim rashodima je 21,2%. U okviru
  ostalih poslovnih usluga najve\u0107i rashodi su ostvareni po osnovu profesionalnih
  i konsulting usluga 17,4 miliona eura i raznovrsnih tehni\u010dkih, trgovinskih
  i ostalih poslovnih usluga 13,1 milion eura.\\n\\nNa ra\u010dunu transportnih usluga
  u prvoj polovini 2015. godine ostvaren je suficit u iznosu od 21,6 miliona eura
  ili 43,5% vi\u0161e nego u prethodnoj godini. Transportni prihodi su iznosili 88,7
  miliona eura i bili su za 22,2% ve\u0107i. Najve\u0107i prihod je ostvaren u pomorskom
  saobra\u0107aju 27 miliona eura, i bio je ve\u0107i za 44,3% u odnosu na 2014. godinu.
  Prihodi u vazdu\u0161nom saobra\u0107aju iznosili su 22,4 miliona eura, \u0161to
  je na pribli\u017eno istom nivou kao prethodne godine. U oblasti drumskog saobra\u0107aja
  ostvareni su prihodi u iznosu od 21 milion eura i ve\u0107i su za 71,5% u odnosu
  na isti period 2014. godine, uslijed pove\u0107anja obima prevoza robe. Prihodi
  u oblasti \u017eeljezni\u010dkog saobra\u0107aja iznosili su 4,5 miliona eura, \u0161to
  je za 30% manje u pore\u0111enju sa prethodnom godinom.\\n\\nUkupni transportni
  rashodi iznosili su 67,1 milion eura i za 16,6% su ve\u0107i u odnosu na isti period
  prethodne godine. Najve\u0107i rashodi ostvareni su u oblasti drumskog i vazdu\u0161nog
  saobra\u0107aja. U oblasti drumskog saobra\u0107aja rashodi su iznosili 36,6 miliona
  eura i bili su ve\u0107i za 22,4% u odnosu na isti period prethodne godine. Rashodi
  u oblasti vazdu\u0161nog saobra\u0107aja u posmatranom periodu iznosili su 16,3
  miliona eura i bili su ve\u0107i za 2,8% u pore\u0111enju sa prethodnom godinom.\\n\\nU
  prvoj polovini 2015. godine procijenjeni prihodi od putovanja-turizma zabilje\u017eili
  su rast od 12,3%, \u0161to je rezultat pove\u0107anja broja dolazaka i no\u0107enja
  stranih turista. Prihodi ostvareni u oblasti putovanja iznosili su 138,1 milion
  eura, \u0161to je doprinijelo ostvarenju suficita na ra\u010dunu putovanja-turizam
  od 121,9 miliona eura ili 11,4% vi\u0161e u odnosu na prethodnu godinu. Zna\u010dajno
  pove\u0107anje dolazaka i no\u0107enja stranih turista, koje je ostvareno u prvoj
  polovini godine, umnogome \u010dini da se sa optimizmom mo\u017ee gledati na zavr\u0161etak
  glavne turisti\u010dke sezone, kada je mogu\u0107e i bolje sagledati njen rezultat
  i sveukupan u\u010dinak.\\n\\nBoks 7.1 - Kretanje prihoda od turizma u svijetu\\n\\nPrema
  podacima Svjetske turisti\u010dke organizacije, ukupni prihodi od me\u0111unarodnog
  turizma u 2014. godini dostigli su 937 milijardi eura, \u0161to predstavlja rast
  od oko 4% u odnosu na 2013. godinu. Radi se o rekordno ostvarenim rezultatima u
  posljednje dvije decenije.\\n\\nNajve\u0107i rast prihoda od turizma ostvarile su
  Azija i Pacifik (4,2%), zatim Evropa (3,6%), Afrika 3,4% i Amerika (3%). Najve\u0107e
  u\u010de\u0161\u0107e u ukupnim prihodima od turizma u svijetu, posmatrano po regijama,
  ima Evropa sa ostvarenih 383 milijardi eura (40,9%), zatim slijede destinacije Azije
  i Pacifika sa ostvarenih 283,7 milijardi eura (30,3%) i Amerika sa 206,3 milijardi
  eura (22%). Bliski Istok bilje\u017ei prihode od 37 milijardi eura i Afrika 27,2
  milijardi eura.\\n\\n---\\n\\n31 Izvor: World. Tourism Barometer, UNWTO\\n\\nPored
  prihoda u destinacijama (prihodne pozicije u platnom bilansu), turizam generi\u0161e
  i prihode po osnovu usluga prevoza putnika-nerezidenata u me\u0111unarodnim saobra\u0107aju.
  Prema izvje\u0161taju Svjetske turisti\u010dke organizacije, me\u0111unarodni turizam
  (putovanje i prevoz putnika) \u010dini 30% svjetskog izvoza usluga, odnosno 6% ukupnog
  izvoza roba i usluga. Posmatrano globalno, kao kategorija izvoza turizam se nalazi
  na \u010detvrtom mjestu, poslije izvoza goriva, hemikalija i hrane. Me\u0111u prvi
  deset turisti\u010dkih destinacija prema ostvarenim prihodima od putovanja-turizma
  nalaze se: SAD, \u0160panija, Kina, Francuska, Makao, Italija, Velika Britanija,
  Njema\u010dka, Tajland i Hong Kong. Najve\u0107u potro\u0161nju u turizmu ostvarili
  su turisti iz slede\u0107ih zemlja: Kine, SAD, Njema\u010dke, Velike Britanije,
  Ruske Federacije, Francuske, Kanade i Italije.\\n\\nGrafik 2\\n\\nKretanje prihoda
  od turizma u 2014. godini u svijetu po regionima, % u\u010de\u0161\u0107a\\n\\nIzvor:
  UNWTO, Svjetska turisti\u010dka organizacija\\n\\nUkupni prihodi po osnovu gra\u0111evinskih
  usluga iznosili su 17,1 milion eura ili 25,3% manje u odnosu na januar-jun 2015.
  godine. Istovremeno rashodi po osnovu anga\u017eovanja nerezidenata u oblasti gra\u0111evinarstva
  u posmatranom periodu su iznosili 13,9 miliona eura, i bilje\u017ee rast u odnosu
  na prethodnu godinu kada su iznosili 10 miliona eura. U posmatranom periodu na ra\u010dunu
  gra\u0111evinskih usluga ostvaren je suficit u iznosu od 3,2 miliona eura, \u0161to
  predstavlja zna\u010dajan pad u odnosu na isti period 2014. godine (12,9 miliona
  eura).\\n\\nPrihodi po osnovu ostalih poslovnih usluga iznosili su 22,5 miliona
  eura, od \u010dega je najve\u0107i dio prihoda ostvaren po osnovu pru\u017eanja
  raznih poslovnih, profesionalnih i konsulting usluga u iznosu od 14,6 miliona eura.
  Rashodi po osnovu ostalih poslovnih usluga iznosili su 36,9 miliona eura, \u0161to
  je rezultiralo ostvarenjem deficita na ovom ra\u010dunu u iznosu od 14,4 miliona
  eura \u0161to je zna\u010dajno vi\u0161e u pore\u0111enju sa istim periodom 2014.
  godine kada je ostvaren deficit u iznosu od 8,4 miliona eura.\\n\\n7.1.3. Primarni
  dohodak\\n\\nNa ra\u010dunu primarnog dohotka u prvoj polovini 2015. godine zabilje\u017een
  je suficit u iznosu od 25,2 miliona eura, \u0161to je za 2,8% vi\u0161e nego u istom
  periodu 2014. godine. U posmatranom periodu ostvaren je ukupan prihod od 116,8 miliona
  eura, \u0161to je za 6,6% vi\u0161e nego u 2014. godini. Tako\u0111e je zabilje\u017eeno
  pove\u0107anje ukupnih rashoda za 7,6%, zbog ve\u0107eg odliva po osnovu otplate
  kamata i dividendi.\\n\\nPrihodi ostvareni po osnovu faktorskih dohodaka iznosili
  su 116,8 miliona eura. Najve\u0107i dio prihoda \u010dine kompenzacije zaposlenih
  u iznosu od 108,8 miliona eura, \u0161to je za 6,8% vi\u0161e nego u istom periodu
  2014. godine. Prihodi po osnovu dohotka od me\u0111unarodnih ulaganja iznosili su
  8 miliona eura, od \u010dega se najve\u0107i dio odnosio na napla\u0107ene kamate
  u iznosu od 7,1 milion eura.\\n\\nRashodi po osnovu dohotka u posmatranom periodu
  iznosili su 91,6 miliona eura, \u0161to je za 7,6% vi\u0161e nego u istom periodu
  2014. godine. Od ukupnih rashoda, 85,1 milion eura odnosilo se na dohodak ostvaren
  po osnovu me\u0111unarodnih ulaganja (ulaganja u obliku kredita, stranih direktnih
  i portfolio investicija), dok se 6,5 miliona eura odnosilo na zarade nerezidencnata
  zaposlenih u Crnoj Gori. Od ukupnih rashoda po osnovu me\u0111unarodnih ulaganja
  na otplatu kamata odnosilo se 59,7 miliona eura \u0161to je za 7,8% vi\u0161e u
  poredjenju sa istim periodom 2014. godine. Odliv po osnovu ispla\u0107enih dividendi
  iznosio je 25,3 miliona eura ili 10,5% vi\u0161e nego prethodne godine.\\n\\n###
  7.1.4. Sekundarni dohodak\\n\\nU prvoj polovini 2015. godine na ra\u010dunu sekundarnog
  dohotka zabilje\u017een je pad priliva transfera u Crnu Goru za 3,4% u poredjenju
  sa istim periodom prethodne godine. Suflcit na ra\u010dunu sekundarnih dohodaka
  iznosio je 50,1 milion eura i predstavlja pad od 13,3%.\\n\\nU posmatranom periodu
  ostvaren je priliv transfera od 86,2 miliona eura. U strukturi priliva 77 miliona
  eura odnosilo se na ostale sektore, a na sektor dr\u017eave 9,2 miliona eura. Od
  ukupnog priliva transfera ostalih sektora, 56,8 miliona eura ostvareno je po osnovu
  li\u010dnih transfera iz inostranstva, \u0161to predstavlja rast od 1,9% u odnosu
  na januar-jun 2014. godine, dok je priliv po osnovu ostalih teku\u0107ih transfera
  bio za 13,7% ve\u0107i i iznosio je 20,2 miliona eura. U istom periodu transferi
  u inostranstvo su iznosili 36,1 milion eura, \u0161to je za 14,8% vi\u0161e u odnosu
  na prethodnu godinu. U strukturi rashoda na sektor dr\u017eava odnosilo se 7,5 miliona
  eura, dok se 28,6 miliona eura odnosilo na ostale sektore. Odliv nov\u010danih sredstava
  po osnovu li\u010dnih transfera iznosio je 17,5 miliona eura, dok je odliv po osnovu
  ostalih teku\u0107ih transfera iznosio 11,1 milion eura, \u0161to je za 10,9% vi\u0161e
  nego u prvoj polovini 2014. godine.\\n\\n### 7.2. Ra\u010dun kapitalnih i finansijskih
  transakcija\\n\\nU prvoj polovini 2015. godine na kapitalnom i-finansijskom ra\u010dunu
  ostvaren je neto priliv kapitala, uslijed zna\u010dajnog priliva portfolio i stranih
  direktnih investicija, dok je zabilje\u017eeno razdu\u017eivanje po osnovu ostalih
  investicija. Visok priliv portfolio investicija rezultat je pove\u0107anog interesovanja
  stranih investitora za ulaganje u dr\u017eavne hartije od vrijednosti i zadu\u017eivanja
  dr\u017eave emisijom euroobveznica na me\u0111unarodnom tr\u017ei\u0161tu kapitala.\\n\\nPrema
  preliminarnim podacima, u prvoj polovini 2015. godine neto priliv stranih direktnih
  investicija iznosio je 185,4 miliona eura ili 19,1% vi\u0161e u poredenju sa istim
  periodom prethodne godine. Pove\u0107anje neto priliva SDI posljedica je manjeg
  povla\u010denja stranih investicija u poredenju sa 2014. godinom, dok je ukupan
  priliv bio na pribli\u017eno isto nivou. Ukupan priliv stranih direktnih investicija
  iznosio je 222,3 milion eura, dok je istovremeno ostvaren odliv od 37 miliona eura.\\n\\nU
  posmatranom periodu ostvaren je rast priliva po osnovu vlasni\u010dkih ulaganja
  koja su iznosila 111,3 miliona eura, \u0161to \u010dini 50,1% ukupno ostvarenog
  priliva. U strukturi vlasni\u010dkih ulaganja, 41,2 miliona eura se odnosilo na
  investicije u preduze\u0107a i banke, dok je priliv po osnovu ulaganja u nekretnine
  iznosio 70,1 milion eura. Priliv SDI u formi interkompanijskog duga iznosio je 108,5
  miliona eura ili 8,7% manje nego u istom periodu 2014. godine, dok su povla\u010denja
  sredstava rezidenata investiranih u inostranstvu iznosila 2,5 miliona eura.\\n\\nUkupan
  odliv stranih direktnih investicija iznosio je 37 miliona eura, \u0161to je za 42,6%
  manje nego u istom periodu 2014. godine. U strukturi odliva, najvi\u0161e se odnosilo
  na povla\u010denja sredstava nerezidenata investiranih u na\u0161u zemlju 27,2 miliona
  eura, dok je odliv po osnovu ulaganja rezidenata u inostranstvo iznosio 9,8 miliona
  eura.\\n\\nBoks 7.2 \u2013 Reforme re\u017eima investiranja u svijetu\\n\\nU uslovima
  rastu\u0107e uloge dr\u017eave u privredi i evolucije mogu\u0107nosti i oblika investiranja,
  javila se potreba za reformom me\u0111unarodnog okvira za investiranje, sa cijem
  da se prilagodi postoje\u0107im izazovima. Globalna finansijska kriza i zna\u010dajne
  promjene na regionalnim nivoima uticali su na reformu me\u0111unarodnih investicionih
  sporazuma.\\n\\nMe\u0111unarodni investicioni sporazumi (MIS) defini\u0161u pravni
  okvir za ulaganja u svijetu i obi\u010dno se zaklju\u010duju u specifi\u010dnom
  istorijskom, ekonomskom i dru\u0161tvenom kontekstu. Cilj ovih sporazuma je liberalizacija
  i harmonizacija zakonodavstva u oblasti stranih investicija sa ciljem da se pobolj\u0161aju
  uslovi pod kojim se vr\u0161e strana ulaganja. Prvi bilateralni investicioni sporazum
  je potpisan prije vi\u0161e od pola vijeka i od tada su me\u0111unarodni investicioni
  sporazumi pro\u0161li kroz zna\u010dajan evolutivni proces koji se mo\u017ee podijeliti
  u \u010detiri glavne faze: era ranog po\u010detka, era dihotomije, era proliferacije
  i era preorijentacije.\\n\\n\u0160ema 1\\nEvolucija me\u0111unarodnih investicionih
  sporazuma\\n\\n| ERA RANOG PO\u010cETKA | 1950-1964 | Novi MIS: 37 | Ukupno MIS:
  37 |\\n|-------------------|-----------|--------------|----------------|\\n| ERA
  DIHOTOMIJE    | 1965-1989 | Novi MIS: 367 | Ukupno MIS: 404 |\\n| ERA PROLIFERACIJE
  | 1990-2007 | Novi MIS: 2663 | Ukupno MIS: 3067 |\\n| ERA PREORIENTACIJE| 2008-DANAS|
  Novi MIS: 410 | Ukupno MIS: 3271 |\\n\\nIzvor: UNCTAD\\n\\nDo aprila 2015. godine
  broj potpisanih me\u0111unarodnih investicionih sporazuma (MIS) dostigao je brojku
  od skoro 3.300. U periodu nakon pojave krize potpisano je ukupno 410 me\u0111unarodnih
  investicionih sporazuma. Zna\u010dajan je podatak da je stupanjem na snagu Lisabonskog
  sporazuma u 2009. godini, kojim su kompentencije u oblasti stranih direktnih investicija
  transferisane od zemalja \u010dlanica ka EU, pove\u0107an broj potpisanih sporazuma.\\n\\nOsnovni
  ciljevi reformi me\u0111unarodnih investicionih sporazuma su:\\n\\n1. **Za\u0161tita
  prava na regulaciju** \u2013 jasno definisani standardi MIS-a obuhvataju fer i pravedan
  tretman, indirektnu ekspropriaciju, zatim tzv. \u201esigurnosne ventile\u201d odnosno
  izuzetke u cilju za\u0161tite javnih politika, nacionalne bezbjednosti i krize platnog
  bilansa.\\n2. **Reforma investicionih sporova** \u2013 uvo\u0111enje klauzula koje
  \u0107e pobolj\u0161ati postoje\u0107e mehanizme za unapre\u0111ivanje transparentnosti,
  \u010dime \u0107e se ograni\u010diti pristup investitora i pobolj\u0161ati kontrola
  ugovornih strana.\\n3. **Promovisanje i olak\u0161avanje ulaganja** \u2013 ja\u010danje
  mjera za promovisanje i privla\u010denje SDI, posebno onih koje \u0107e osigurati
  odr\u017eiv dugoro\u010dan razvoj.\\n4. **Osigurati odgovorne investicije** \u2013
  spre\u010davanje uru\u0161avanja ekolo\u0161kih i socijalnih standarda, obezbijedivanje
  usagla\u0161enosti sa doma\u0107im zakonima; ja\u010danje dru\u0161tvene odgovornosti
  i podsticanje saradnje u tom pogledu.\\n5. **Unapre\u0111ivanje sistemsk\u0435 konzistentnosti**
  \u2013 uvo\u0111enje klauzula i mehanizama koji upravljaju interakcijom izme\u0111u
  MIS-a i drugih organa me\u0111unarodnog prava, MIS-a i doma\u0107ih investicionih
  i drugih politika.\\n\\n---\\n\\n32 Izvor: UNCTAD\\n\\nDanas se pravni okvir za
  investiranja u svijetu nalazi na raskr\u0161\u0107u, a mnoge zemlje i regionalne
  grupe su u procesu razmatranja, reformi i revizije njihovih me\u0111unarodnih investicionih
  sporazuma. U budu\u0107nosti \u0107e biti va\u017eno da reforma me\u0111unarodnih
  investicionih sporazuma bude vo\u0111ena zajedni\u010dkim planom i vizijom, jer
  svaki korak ka reformi bez multilateralne koordinacije mo\u017ee samo pogor\u0161ati
  fragmentaciju. Samo zajedni\u010dki pristup reformama mo\u017ee dovesti do re\u017eima
  u kojem \u0107e me\u0111unarodni investicioni ugovori obezbijediti stabilnost, preciznost
  i predvidljivost za sve u\u010de\u0161nike.\\n\\nU prvoj polovini 2015. godine ukupan
  priliv po osnovu portfolio investicija iznosio je 527 miliona eura, \u0161to je
  zna\u010dajno vi\u0161e nego u istom periodu prethodne godine kada je iznosio 328,7
  miliona eura\\\\(^{33}\\\\). Investicije u doma\u0107e hartije od vrijednosti od
  strane nerezidenata iznosile su 483,8 miliona eura, od \u010dega najve\u0107i dio
  \u010dini zadu\u017eivanje dr\u017eave emisijom euroobveznica na me\u0111unarodnom
  tr\u017ei\u0161tu kapitala. Priliv po osnovu povla\u010denja sredstava ulo\u017eenih
  u strane hartije od vrijednosti iznosio 43,1 milion eura. Istovremeno, ukupan odliv
  sredstava po osnovu portfolio investicija iznosio je 177 miliona eura, \u0161to
  je manje za 3,8% u pore\u0111enju sa 2014. godinom. Kao rezultat ovakvih kretanja
  na ra\u010dunu portfolio investicija u posmatranom periodu ostvaren je neto priliv
  u iznosu od 350 miliona eura, \u0161to je najve\u0107i ostvareni priliv na ovom
  ra\u010dunu u istoriji kompiliranja platnog bilansa.\\n\\nNa ra\u010dunu ostalih
  investicija zabilje\u017een je neto odliv u iznosu od 62,8 miliona eura. U posmatranom
  periodu banke su pove\u0107ale depozite u inostranstvu za 1,2 miliona eura, dok
  su smanjene obaveze po osnovu uzetih kredita za 18,5 miliona eura. Zabilje\u017eeno
  je pove\u0107anje zadu\u017eivanja ostalih sektora (privreda) u inostranstvu. Priliv
  po osnovu povla\u010denja sredstava kredita iznosio je 104,2 miliona eura i ve\u0107i
  je za 60,3%, a istovremeno je pove\u0107an i odliv po osnovu otplate glavnice i
  iznosio je 79,2 miliona eura ili duplo vi\u0161e nego u 2014. godini (39,6 miliona
  eura).\\n\\nNa kraju juna 2015. godine nov\u010dana sredstva Centralne banke na
  inora\u010dunima i u trezoru bila su ve\u0107a za 271,2 miliona eura u odnosu na
  31. decembar 2014. godine.\\n\\n\\\\(^{33}\\\\) Zna\u010dajno pove\u0107anje priliva
  portfolio investicija je rezultat zadu\u017eivanja dr\u017eave na me\u0111unarodnom
  tr\u017ei\u0161tu kapitala putem emisije euroobveznica.\\n\\nME\u0110UNARODNA EKONOMIJA\\n\\n08\\n\\nPrema
  prognozama iz MMF-ovog izvje\u0161taja o \u201eIzgledima globalne ekonomije\u201c
  iz jula o.g., svjetska ekonomija bi u ovoj godini trebalo da raste po blago ni\u017eoj
  stopi od pro\u0161logodi\u0161nje, s tim da se o\u010dekuje rast kod razvijenih
  ekonomija (2,1%) a usporavanje kod ekonomija u usponu (4,2%).\\n\\n**Tabela 8.1**\\n\\n|
