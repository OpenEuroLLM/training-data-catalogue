  10. Prekida\u010d paljenja 11. Prednji vazdu\u0161ni jastuk voza\u010da 12. Komandna
  poluga elektronske kontrole brzine / ograni\u010diva\u010da brzine (za verzije /
  tr\u017ei\u0161ta za koje je predvi\u0111eno) 13. Instalacija za Uconnect (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno) ili za radio sistem 14. USB port
  / AUX uti\u010dnica (za verzije / tr\u017ei\u0161ta za koje je predvi\u0111eno)
  15. Sistem grejanja / ventilacije ili ru\u010dna kontrola klime (za verzije / tr\u017ei\u0161ta
  za koje je predvi\u0111eno) ili automatska dvozonska kontrola klime (za verzije
  / tr\u017ei\u0161ta za koje je predvi\u0111eno) 16. Komandna dugmad 17. Donja pregrada
  za dokumenta i sitne stvari 18. Pregrada za razne stvari\\n\\nKOMANDNA TABLA I INSTRUMENTI\\n\\nBoja
  pozadine instrumenata i tip mogu da variraju zavisno od verzije\\n\\nSamo dizel
  verzije imaju lampice upozorenja $\\\\text{CO}_2$ i $\\\\text{CO}_3$. Kod dizel
  verzija maksimalni broj obrtaja u minuti (crvena zona na broja\u010du obrtaja) odgovara
  5000 obrtaja u minuti.\\n\\nVERZIJE SA MULTIFUNKCIONALnim displejem\\n\\nslika.
  2\\n\\nA. Brzinomer (indikator brzine) B. Multifunkcionalni displej C. Broja\u010d
  obrtaja D. Mera\u010d nivoa goriva sa lampicom upozorenja na rezervu goriva E. mera\u010d
  temperature sredstva za hla\u0111enje motora sa lampicom upozorenja na pregrevanje\\n\\nVERZIJE
  SA REKONFIGURABILNIM MULTIFUNKCIONALnim displejem\\n\\nslika. 3\\n\\nA. Brzinomer
  (indikator brzine) B. Rekonfigurabilni multifunkcionalni displej C. Broja\u010d
  obrtaja D. Mera\u010d nivoa goriva sa lampicom upozorenja na rezervu goriva E. mera\u010d
  temperature sredstva za hla\u0111enje motora sa lampicom upozorenja na pregrevanje\\n\\nZAMENA
  OSIGURA\u010cA\\n\\nMESTO OSIGURA\u010cA\\n\\nRazvodna kutije instrument table\\n\\nDa
  biste imali pristup kutiji sa osigura\u010dima, postupite kao \u0161to slije:\\n\\n-
  otvorite donju pregradu za razne stvari;\\n- upotrebite \u0161rafciger koji ste
  dobili sa vozilom sl. 4 da skinete dva bo\u010dna poklopca A sl. 5;\\n\\n- pritisnite
  ure\u0111aj B sl. 6 iznutra prema spolja iz pregrade;\\n- nagnite pregradu C sl.
  7 prema napred: na ovaj na\u010din \u0107ete imati pristup kutiji sa osigura\u010dima
  sl. 8.\\n\\nslika. 5\\n\\nslika. 4\\n\\nslika. 6\\n\\nZa vra\u0107anje pregrade
  za razne stvari postupite obrnutim redosledom od prethodno opisanog, paze\u0107i
  pritom na novu konekciju ure\u0111aja za usporavanje, povezanog na istu pregradu
  preko ure\u0111aja B sl. 6\\n\\nslika. 7\\n\\nslika. 8\\n\\nVERZIJE SA UPRAVLJA\u010cEM
