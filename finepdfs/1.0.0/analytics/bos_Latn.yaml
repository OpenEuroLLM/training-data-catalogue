  uzmite u obzir podatke iz ovog drugog. U cilju bezbedne vo\u017enje potrebno je
  da vozilo ima pneumatike istog tipa na svim to\u010dkovima.\\n\\nVA\u017dNO Nemojte
  koristiti unutra\u0161nje gume sa pneumaticim koji su bez unutra\u0161njih guma.\\n\\nGEOMETRIJA
  TO\u010cKA\\n\\nUvla\u010denje prednjih to\u010dkova mereno od to\u010dka do to\u010dka:
  - 0,5 \u00b1 1 mm.\\n\\nVrednosti se odnose na vozilo po uzastopnom redosledu.\\n\\n\u010cITANJE
