  411     | 92,2                |\\n\\nIzvor: Monstat\\n\\n### Boks 1.2 \u2013 Prosje\u010dne
  plate po zemljama biv\u0161e Jugoslavije, maj 2015. godine\\n\\nPodaci o prosje\u010dnim
  platama u maju 2015. godine pokazuju razlike u visini primanja pojedinih zemalja
  biv\u0161e Jugoslavije. Zarade bez poreza i doprinosa su u maju ove godine, u odnosu
  na isti mjesec prethodne godine, zabilje\u017eile nominalan rast u Hrvatskoj 3,3%,
  Makedoniji 2,7% i Crnoj Gori 0,4%. Nominalni pad neto plata zabilje\u017een je u
  Srbiji za 0,5%, Sloveniji za 0,3%, dok su u Bosni i Hercegovini neto plate ostale
  na nivou iz maja prethodne godine. Slovenija je po neto iznosu prosje\u010dne plate
  i dalje na prvom mjestu, zatim ide Hrvatska, dok je Crna Gora po prosjeku neto plate
  iznad Bosne i Hercegovine, Srbije i Makedonije.\\n\\n### Tabela 1\\n\\n| Zemlja          |
  Neto plate | Bruto plate |\\n|-----------------|------------|-------------|\\n|
  Slovenija       | 998        | 1.529       |\\n| Hrvatska        | 749        |
  1.057       |\\n| Crna Gora       | 480        | 726         |\\n| Bosna i Hercegovina
  | 424    | 659         |\\n| Srbija          | 365        | 502         |\\n| Makedonija      |
  359        | 526         |\\n\\nIzvor: zavodi za statistiku i centralne banke navedenih
  zemalja\\n\\nMONETARNA KRETANJA\\n\\nBankarski sistem Crne Gore je tokom prva dva
  kvartala 2015. godine bio likvidan, solventan i poslovan je sa dobitkom u ukupnom
  iznosu od 7,7 miliona eura.\\n\\nTokom prve polovine 2015. godine bilansna suma
  banaka je imala rastu\u0107i trend. Na strani aktive, rast je najve\u0107im dijelom
  rezultat rasta potra\u017eivanja banaka po osnovu hartija od vrijednosti, dok je
  na strani pasive rast prvenstveno rezultat rasta depozita. Pozitivnu tendenciju
  u kretanju su tokom posmatranog perioda bilje\u017eili i ukupno odobreni krediti
  banaka. I pored zabilje\u017eenog blagog rasta u posmatranom periodu, uslijed konstantnog
  i zna\u010dajnijeg rasta depozita polo\u017eenih u bankama, krediti banaka su na
  kraju posmatranog perioda po prvi put od 2006. godine bili na nivou ni\u017eem od
  depozita polo\u017eenih u bankama.\\n\\nUkoliko se posmatraju novoodobreni krediti
  tokom prva dva kvartala teku\u0107e godine, mo\u017ee se zaklju\u010diti da je kreditna
  aktivnost banaka bila intenzivnija u odnosu na isti period prethodne godine. U ovom
  periodu odobreno je za 85 miliona eura ili 23,7% vi\u0161e kredita nego u prvoj
  polovini prethodne godine, pri \u010demu rast novoodobrenih kredita bilje\u017ee
  dva klju\u010dna sektora \u2013 privreda i stanovni\u0161tvo.\\n\\nIako je i dalje
  zna\u010dajan dio kredita bankarskog sistema lo\u0161eg kvaliteta, tokom posmatranog
  perioda do\u0161lo je do pobolj\u0161anja kvaliteta kreditnog portfolija banaka.
  Ovo pobolj\u0161anje se ogleda u smanjenju iznosa nekvalitetnih kredita, kao i u
  smanjenju njihovog u\u010de\u0161\u0107a u ukupnim kreditima banaka u odnosu na
  uporedni period prethodne godine.\\n\\nIno pozajmice su tokom posmatranog perioda
  nastavile negativnu tendenciju u kretanju. Konstantno razdu\u017eivanje banaka u
  inostranstvu rezultat je pove\u0107anja jeftinih doma\u0107ih depozita (pasivne
  kamatne stope na izuzetno niskom nivou), zatim visoke likvidnosti bankarskog sistema
  kao i slabije kreditne aktivnosti u prethodnom periodu.\\n\\nProsje\u010dne ponderisane
  aktivne i pasivne kamatne stope su u prvoj polovini teku\u0107e godine nastavile
  opadaju\u0107i trend. Me\u0111utim, pad kamatnih stopa na depozite banaka je u ovom
  periodu ipak bio zna\u010dajniji, pa je kao rezultat kamatni spred u prvom kvartalu
  i dalje imao rastu\u0107i trend. U junu 2015. godine, razlika izme\u0111u aktivnih
  i pasivnih kamatnih stopa na ukupne kredite i depozite banaka je iznosila 7,52 p.p.\\n\\nU
  aprilu i julu 2015. godine dvije nove banke su otpo\u010dele sa poslovanjem. Kao
  rezultat ulaska novih banaka, realna su o\u010dekivanja da \u0107e pove\u0107anje
  konkurencije na bankarskom tr\u017ei\u0161tu biti dodatan stimulans za smanjenje
  aktivnih kamatnih stopa, kao i za intenziviranje kreditne aktivnosti u narednom
  periodu.\\n\\n2.1. Banke\\n\\n2.1.1. Likvidnost banaka\\n\\nBankarski sektor Crne
  Gore tokom prve polovine 2015. godine karakteri\u0161e visok nivo likvidnosti. Prema
  osnovnim pokazateljima likvidnosti, sve banke su u ovom periodu ure\u0111no izmirivale
  svoje teku\u0107e obaveze i imale su dnevne i dekadne koeficijente likvidnosti iznad
  propisanog minimuma\\\\(^{11}\\\\).\\n\\nIako su tokom prvih \u0161est mjeseci 2015.
  godine bili na nivou iznad propisanog minimuma, koeficijenti likvidnosti su imali
  opadaju\u0107i trend, pri \u010demu su, nakon zabilje\u017eenog pada u prvom kvartalu,
  u drugom kvartalu oba koeficijenta zabilje\u017eila rast.\\n\\nDnevni koeficijent
  likvidnosti je na kraju posmatranog perioda imao identi\u010dnu vrijednost kao u
  istom periodu prethodne godine (1,86). Prosje\u010dni dnevni pokazatelj likvidnosti
  je tokom prvih \u0161est\\n\\n---\\n\\n\\\\(^{11}\\\\) Na snazi je Odluka o minimalnim
  standardima za upravljanje rizikom likvidnosti u bankama (\\\"Sl. list Crne Gore\\\",
  br. 60/08), kojom je propisana obaveza banaka za odr\u017eavanjem minimalnih koeficijenata
  likvidnosti na dnevnoj (0,9) i dekadnoj osnovi (1,0).\\n\\nmjeseci teku\u0107e godine
  iznosio 1,88, \u0161to je ni\u017ee nego u istom periodu prethodne godine kada je
  iznosio 1,91.\\n\\nProsje\u010dni dekadni pokazatelj likvidnosti je tokom prvih
  \u0161est mjeseci 2015. godine iznosio 1,86, \u0161to je ni\u017ee nego u istom
  periodu prethodne godine kada je iznosio 1,91.\\n\\nLikvidna aktiva banaka je iznosila
  662,4 miliona eura na kraju juna 2015. godine. U odnosu na kraj prethodne godine
  ni\u017ea je za 5%, dok je na godi\u0161njem nivou zabilje\u017eila rast od 17,1%.
  U\u010de\u0161\u0107e likvidne u ukupnoj aktivi na kraju prve polovine 2015. godine
  je iznosilo 20,5%, \u0161to je ni\u017ee u odnosu na kraj prethodne godine kada
  je iznosilo 22,2%, odnosno vi\u0161e nego na kraju drugog kvartala prethodne godine
  kada je iznosilo 18,8%.\\n\\nKoeficijent krediti/depoziti je iznosio 0,99 na kraju
  juna 2015. godine, i ni\u017ei je u odnosu na kraj 2014. godine kada je iznosio
  1,03, kao i u odnosu na kraj juna prethodne godine kada je iznosio 1,11. Koeficijent
  krediti/depoziti po prvi put nakon devet godina ima vrijednost ni\u017eu od 1.\\n\\n2.1.2.
  Agregatni bilans stanja banaka\\n\\nUkupna aktiva banaka na kraju juna 2015. godine
  je iznosila 3.236,3 miliona eura, i bila je za 100 miliona eura ili 3,2% vi\u0161a
  nego na kraju prethodne godine, dok je u odnosu na isti period prethodne godine
  bila vi\u0161a za 231 milion eura ili 7,7%.\\n\\nU strukturi aktive banaka, u posmatranom
  periodu dominantno u\u010de\u0161\u0107e od 73,6% su imali ukupni krediti banaka,
  dok na strani pasive najve\u0107e u\u010de\u0161\u0107e od 74,3% bilje\u017ee depoziti.
  Iako je do\u0161lo do rasta kredita banaka, uslijed zna\u010dajnijeg rasta depozita,
  ukupni krediti su na kraju drugog kvartala po prvi put od 2006. godine bili na nivou
  ispod ukupnih depozita.\\n\\nU strukturi aktive, rast u odnosu na kraj prethodne
  godine bilje\u017ee sve stavke izuzev nov\u010danih sredstava i ra\u010duna depozita
  kod centralnih banaka, dok na godi\u0161njem nivou sve stavke bilje\u017ee rast.\\n\\nGrafik
  2.4\\n\\n| Ukupna aktiva, krediti i depoziti banaka, u 000.000 eura |\\n|----------------------------------------------------------|\\n|
  ![Grafik 2.4](image) |\\n\\nGrafik 2.5\\n\\n| Kretanje potra\u017eivanja banaka
  po osnovu hartija od vrijednosti, u 000.000 eura |\\n|-------------------------------------------------------------------------------|\\n|
  ![Grafik 2.5](image) |\\n\\nRast aktive banaka je najve\u0107im dijelom rezultat
  rasta hartija od vrijednosti, koje su bile za 100,1 milion eura ili 41,3% vi\u0161e
  u odnosu na kraj 2014. godine, odnosno za 119,8 miliona eura ili 53,7% vi\u0161e
  u odnosu na kraj juna 2014. godine. Evidentno je da su banke u prvoj polovini 2015.
  godine dio vi\u0161ka likvidnih sredstava, nastalog usljed manje intenzivne kreditne
  aktivnosti u proteklim godinama, plasirale u hartije od vrijednosti kao alternativni
  vid izvora prihoda. Me\u0111utim, opreznost se ogleda i u ovom vidu ulaganja, jer
  su banke najve\u0107i dio sredstava plasirale u dr\u017eavne hartije od vrijednosti,
  kao najsigurniji izvor prihoda.\\n\\nDominantna stavka u strukturi aktive - krediti
  banaka, bilje\u017ee blagi rast u posmatranom periodu, pri \u010demu su u odnosu
  na kraj prethodne godine bili za 14,1 milion eura ili 0,6% vi\u0161i, dok su na
  godi\u0161njem nivou zabilje\u017eili rast od 5,1 milion eura ili 0,2%.\\n\\nNov\u010dana
  sredstva i ra\u010duni depozita kod centralnih banaka bilje\u017ee pad od 42 miliona
  eura ili 8,4% u odnosu na kraj prethodne godine, dok su u odnosu na isti period
  prethodne godine pove\u0107ana za 70,5 miliona eura ili 18,2%.\\n\\nNa strani pasive,
  ukupni depoziti zabilje\u017eili su rast od 95 miliona eura ili 4,1% u odnosu na
  decembar 2014. godine, dok su u odnosu na jun prethodne godine pove\u0107ani za
  256,7 miliona eura ili 12%. Kapital banaka je sa 14,1% druga stavka po u\u010de\u0161\u0107u
  u strukturi pasive banaka, i bilje\u017ei rast kako u odnosu na kraj prethodne godine
  (2,5%), tako i na godi\u0161njem nivou (6,4%). Ukupne pozajmice banaka su \u010dinile
  7,9% pasive banaka i zabilje\u017eile su rast od 2,3% u odnosu na kraj prethodne
  godine, dok su u odnosu na isti period prethodne godine ni\u017ee za 16,3%.\\n\\nGrafik
  2.6\\n\\nNekvalitetna aktiva, u 000.000 eura (lijeva skala), u\u010de\u0161\u0107e
  nekvalitetne u ukupnoj aktivi banaka, u % (desna skala)\\n\\nU kretanju nekvalitetne
  aktive banaka tokom posmatranog perioda prisutne su oscilacije u kretanju. Na kraju
  juna 2015. godine, nekvalitetna aktiva je iznosila 440,1 milion eura, i bila je
  za 1,1% ve\u0107a nego na kraju 2014. godine, dok je u odnosu na jun prethodne godine
  zabilje\u017eila pad od 6,1%. U\u010de\u0161\u0107e nekvalitetne aktive u ukupnoj
  aktivi banaka je iznosilo 13,6% na kraju posmatranog perioda, \u0161to je za 0,3
  p.p. ni\u017ee nego na kraju 2014. godine, i za 6 p.p. ni\u017ee na godi\u0161njem
  nivou.\\n\\nTokom prve polovine 2015. godine banke su ostvarile pozitivan finansijski
  rezultat u ukupnom iznosu od 7,7 miliona eura. Dobit banaka ni\u017ea je nego u
  istom periodu prethodne godine za 47%. Povra\u010daj na prosje\u010dnu aktivu (ROA)
  na agregatnom nivou je iznosio 0,49% na kraju drugog kvartala, dok je povra\u010daj
  na prosje\u010dni kapital (ROE) iznosio 3,42%. Oba pokazatelja su zabilje\u017eila
  pad kako u odnosu na kraj prethodne godine, kada su iznosili 0,79% i 5,35% respektivno,
  tako i u odnosu na isti period prethodne godine kada su iznosili 0,98% i 6,84%.\\n\\n2.1.3.
  Kreditna aktivnost banaka\\n\\nTokom prvih dva kvartala 2015. godine, kreditna aktivnost
  banaka pokazuje znake oporavka, pri \u010demu su u ovom periodu ukupni krediti oscilirali
  uz zabilje\u017een blago rastu\u0107i trend. Ostvaren je rast kredita prosje\u010dno
  mjese\u010dno po stopi od 0,1% (u istom periodu prethodne godine zabilje\u017een
  je pad po stopi od 0,3%). U odnosu na kraju prethodne godine, kao i na godi\u0161njem
  nivou, rast kredita je zabilje\u017eilo \u0161est banaka\\\\(^{12}\\\\).\\n\\nNa
  kraju juna, krediti banaka su iznosili 2.381,3 miliona eura, \u0161to je za 14,1
  milion eura ili 0,6% vi\u0161e nego na kraju prethodne godine, odnosno za 5,1 milion
  eura ili 0,2% vi\u0161e nego na kraju juna prethodne godine.\\n\\nOd ukupnog iznosa
  kredita banaka, na kraju drugog kvartala teku\u0107e godine najve\u0107i dio od
  42,9% je odobren nefinansijskom sektoru, zatim slijedi stanovni\u0161tvo sa 38,5%,
  finansijske institucije sa 14,7%, Op\u0161ta Vlada sa 3,7% ukupno odobrenih kredita,
  dok se 0,2% odnosilo na kategoriju \u201eostalo\u201c.\\n\\nU odnosu na kraju prethodne
  godine, zabilje\u017een rast kredita je najve\u0107im dijelom rezultat rasta kredita
  odobrenih nefinansijskom sektoru i stanovni\u0161tvu koji su zajedno zabilje\u017eili
  rast od 45,6 miliona eura ili 4,7% i 22,9 miliona eura ili 2,6% respektivno. Negativan
  uticaj na rast ukupnih kredita imali su svi ostali sektori, pri \u010demu su krediti
  finansijskog sektora zabilje\u017eili pad od 30,2 miliona eura ili 7,9%, sektor
  Op\u0161te vlade 23,8 miliona eura ili 21,4%, dok su krediti svih ostalih sektora
  bili za 436,000 eura ili 8,5% ni\u017ei.\\n\\nNa godi\u0161njem nivou, izuzev sektora
  Op\u0161te vlade, svi sektori su zabilje\u017eili rast ukupnih kredita, pri \u010demu
  prednja\u010de fizi\u010dka lica i finansijske institucije za 25,2 miliona eura
  ili 2,8% i 20,9 miliona eura ili 6,3% respektivno. Sektor Op\u0161te vlade bilje\u017ei
  zna\u010dajniji pad kredita u iznosu od 48,9 miliona eura ili 35,8%.\\n\\nUkoliko
  se posmatraju mjese\u010dne stope rasta kredita po sektorima, mo\u017ee se uo\u010diti
  da najmanje oscilacije u kretanju ukupno odobrenih kredita ima sektor stanovni\u0161tva
  i nefinansijski sektor, dok su zna\u010dajne oscilacije prisutne kod svih ostalih
  sektora.\\n\\n---\\n\\n\\\\(^{12}\\\\) Na kraju juna 2015. godine, bankarski sistem
  \u010dinilo je trinaest banaka. Broj banaka u odnosu na jun prethodne godine uve\u0107an
  je za dvije banke, pri \u010demu je jedna banka po\u010dela sa radom u avgustu prethodne
  godine, a druga nova banka je otpo\u010dela sa radom u aprilu teku\u0107e godine.\\n\\nRezidentna
  pravna lica su na kraju prvog kvartala teku\u0107e godine imala dug po osnovu kredita
  u ukupnom iznosu od 1.075,8 miliona eura, \u0161to je za 2,1% vi\u0161e nego na
  kraju prethodne godine, odnosno za 2,8% ni\u017ee nego na kraju istog perioda prethodne
  godine. Posmatrano po djelatnostima, dominantno u\u010de\u0161\u0107e od 37,3% su
  ostvarili krediti za djelatnost trgovine na veliko i malo i popravku motornih vozila
  i motocikala, zatim slijedi gra\u0111evinarstvo sa 11,6% i preradiva\u010dka industrija
  sa 10,4%.\\n\\nPosmatrano po namjeni, najvi\u0161e kredita banaka se odnosilo na
  likvidnost (20,1%), gotovinske kredite (17,2%), stambene kredite (13,3%), kredite
  za nabavku osnovnih sredstava (7,4%) i kredite za izgradnju i adaptaciju gra\u0111evinskih
  objekata (6,5%). Zna\u010dajno manje sredstava banaka iskori\u0161\u0107eno je putem
  potro\u0161a\u010dkih kredita, \u201eoverdrafta\u201c, kreditnih kartica, refinansiranja
  obaveza prema drugim bankama, za pripremu turisti\u010dke sezone, kupovinu automobila
  i kupovinu hartija od vrijednosti i ostale namjene.\\n\\nKrediti banaka se najve\u0107im
  dijelom odobravaju u eurima i na rok du\u017ei od jedne godine. Tako se na kraju
  juna 2015. godine, od ukupno odobrenih kredita, 2.209,1 milion eura ili 92,8% odnosilo
  na kredite odobrene u eurima. Posmatrano po ro\u010dnosti, ukupno 1.701,6 miliona
  eura ili 71,5% kredita banaka se odnosilo na dugoro\u010dne kredite banaka.\\n\\nNa
  kraju juna teku\u0107e godine nekvalitetni krediti banaka su iznosili 371,1 milion
  eura. U kretanju nekvalitetnih kredita i dalje je prisutna pozitivna tendencija,
  koja se ogleda u smanjenju od 1,2% u\\n\\nGrafik 2.10\\n\\nStruktura kredita banaka
  po namjeni, u %\\n\\n- Likvidnost: 20,1%\\n- Gotovinski: 17,2%\\n- Stambeni: 13,3%\\n-
  Nabavka osnovnih sredstava: 7,4%\\n- Izgradnja i adaptacija gra\u0111evinskih objekata:
  6,5%\\n- Refinansiranje obaveza prema drugim bankama: 4,1%\\n- Overdraft: 2,7%\\n-
  Ostalo: 26,1%\\n\\nGrafik 2.11\\n\\nNekvalitetetni krediti i ispravka vrijednosti
  kredita, u 000.000 eura (lijeva skala), u\u010de\u0161\u0107e nekvalitetnih kredita
  u ukupnim kreditima, u % (desna skala)\\n\\n- Nekvalitetni krediti\\n- Ispravka
  vrijednosti kredita\\n- Nekvalitetni krediti (C, D i E)/Ukupni krediti, %\\n\\nodnosu
  na kraj 2014. godine, i smanjenju od 7,8% u odnosu na isti period prethodne godine.
  Kao rezultat smanjenja iznosa nekvalitetenih kredita, s jedne strane, i rasta ukupnih
  kreditima banaka, s druge strane, u\u010de\u0161\u0107e nekvalitetenih kredita u
  ukupnim kreditima banaka u posmatranom periodu tako\u0111e bilje\u017ei smanjenje.
  Na kraju posmatranog perioda iznosilo je 15,59%, i bilo je za 0,28 p.p. ni\u017ee
  nego na kraju prethodne godine, odnosno za 1,36 p.p. manje na godi\u0161njem nivou.
  Ukupna ispravka vrijednosti kredita banaka je iznosila 166,9 miliona eura i \u010dinila
  je 45% nekvalitetenih kredita banaka. Pokrivenost nekvalitetenih kredita ispravkama
  vrijednosti kredita je smanjena u odnosu na kraj 2014. godine kada je iznosila 46%,
  dok je pove\u0107ana u odnosu na isti period prethodne godine, kada je iznosila
  44,8%.\\n\\nNa kraju posmatranog perioda, krediti koji kasne sa otplatom su iznosili
  454,3 miliona eura i \u010dinili su 19,1% ukupnih kredita banaka. Krediti koji kasne
  s otplatom su zabilje\u017eili rast od 2,1% u odnosu na kraj 2014. godine, dok su
  na godi\u0161njem nivou ni\u017ei za 11,3%.\\n\\n**Boks 2.1 \u2013 Nekvalitetni
  krediti u Crnoj Gori i pore\u0111enje u odnosu na zemlje EU i zemlje regiona**\\n\\nVisok
  nivo nekvalitetenih kredita problem je koji je u crnogorskom bankarskom sistemu
  izra\u017een od pojave finansijske krize. U proteklim godinama banke su primjenjivale
  mjere za pobolj\u0161anje kvaliteta kreditnog portfolija kroz izmje\u0161tanje nekvalitetenih
  kredita u bilanse mati\u010dnih banaka, prodaju i restrukturiranje kredita.\\n\\nCrna
  Gora nije izuzetak po pitanju visokog nivoa nekvalitetenih kredita. Evidentno je
  da je visok nivo nekvalitetenih kredita prisutan u velikom broju zemalja EU, iako
  se moraju imati u vidu i metodolo\u0161ke razlike kod definisanja nekvalitetenih
  kredita, \u0161to ote\u017eava pore\u0111enje po zemljama. Prema posljednjim podacima
  Me\u0111unarodnog monetarnog fonda o indikatorima finansijske stabilnosti, Crna
  Gora se nalazi uz Bugarsku, Hrvatsku, Italiju, Irsku, Gr\u010dku, San Marino i Kipar.
  Kod svih navedenih zemalja u\u010de\u0161\u0107e nekvalitetenih kredita u ukupnim
  kreditima iznosilo je preko 15%. Pri tom, najve\u0107i iznos ovog pokazatelja od
  45% registriran je u Kipru.\\n\\nPo u\u010de\u0161\u0107u nekvalitetenih kredita
  u ukupnim, Crna Gora ne odsko\u010da ni od zemalja regiona. Tako je prema posljednjem
  raspolo\u017eivom podatku, na kraju prvog kvartala 2015. godine u Srbiji u\u010de\u0161\u0107e
  nekvalitetenih kredita u ukupnim kreditima banaka iznosilo 22,6%, u Hrvatskoj 17,1%,
  u Bosni i Hercegovini 14,2%, a u Makedoniji 11,1%. Crna Gora se nalazi u sredini
  sa zabilje\u017eenih 15, 59% u\u010de\u0161\u0107a na kraju drugog kvartala 2015.
  godine.\\n\\nIako nekvalitetni krediti u Crnoj Gori tokom protekle tri godine imaju
  tendenciju smanjenja, neophodno je aktivnije pristupiti rje\u0161avanju ovog najzna\u010dajnijeg
  problema bankarskog sektora. Zato je od velikog zna\u010daja stupanje na snagu Zakona
  o sporazumnom finansijskom restrukturiranju dugova prema\\n\\n---\\n\\n**Grafik
  1**\\nU\u010de\u0161\u0107e nekvalitetenih kredita u ukupnim bruto kreditima depozitnih
  institucija zemalja Evropske unije i Crne Gore, u %*\\n\\n* Podaci za zemlje EU
  su posljednji raspolo\u017eivi preuzeti iz Indikatora finansijske stabilnosti MMF-a
  (FSI), a za Crnu Goru podatak je za jun 2015. godine.\\n\\nse zaklju\u010diti da
  \u0107e krajem 2016. godine do\u0107i do zaustavljanja negativnih trendova u kretanju
  nekvalitetnih kredita i njihovog smanjenja na agregatnom nivou.\\n\\n**Grafik 2**\\n\\n*U\u010de\u0161\u0107e
  nekvalitetnih kredita u ukupnim kreditima banaka u zemljama regiona, u %*\\n\\n*
  Izvor podataka za Makedoniju, Srbiju i Hrvatsku su publikacije centralnih banaka,
  a za Bosnu i Hercegovinu - Indikatori finansijske stabilnosti MMF-a.\\n\\nfinansijskim
  institucijama u maju teku\u0107e godine, koji \u0107e se primjenjivati dvije godine
  od dana stupanja na snagu. O efektima primjene ovog zakona je jo\u0161 uvijek rano
  govoriti, ali su o\u010dekivanja primjene ovakvog zakonskog rje\u0161enja usmjerena
  u pravcu podsticaja oporavka du\u017enika, o\u010duvanju stabilnosti finansijskog
  sistema i omogu\u0107avanju pristupa novim sredstvima finansiranja radi stimulisanja
  ekonomskog oporavka i rasta.\\n\\nU okviru istog projekta, u 2014. godini je po\u010dela
  da se primjenjuje Odluka o izmjena-ma i dopunama Odluke o minimalnim standardima
  za upravljanje kreditnim rizikom u bankama, kojom je Centralna banka obavezala banke
  da usvoje trogodi\u0161nje strategije i godi\u0161nje operativne ciljeve za upravljanje
  nekvalitetnim kreditima i da je na kvartalnoj osnovi izvje\u0161tavaju o njihovoj
  realizaciji. Na osnovu dostavljenih strategija banaka za postupanje sa nekvalitetnim
  kreditima, mo\u017ee\\n\\n**Novoodobreni krediti**\\n\\nPozitivna tendencija u kreditanju
  kredita evidentna je i kada se posmatraju ukupno novoodobreni krediti tokom prvih
  \u0161est mjeseci teku\u0107e godine. Banke su u ovom periodu odobrile ukupno 443,6
  miliona eura novih plasmana u vidu kredita, \u0161to je za 85 miliona eura ili 23,7%
  vi\u0161e nego u prvoj polovini prethodne godine.\\n\\nRo\u010dna struktura novoodobrenih
  kredita pokazuje da je dominantan dio ovih kredita (68,2%) odobren na rok du\u017ei
  od 1 godine. U\u010de\u0161\u0107e dugoro\u010dnih kredita u strukturi novoodobrenih
  kredita zna\u010dajno je pove\u0107ano u odnosu na isti period prethodne godine
  kada je iznosilo 59,5%.\\n\\nPosmatrano po sektorima, tokom prve polovine teku\u0107e
  godine, najvi\u0161e kredita banke su odobravale nefinskijskom sektoru (59,8%) i
  stanovni\u0161tvu (36,1%). Oba sektora bilje\u017ee rast novoodobrenih kredita na
  godi\u0161njem nivou, i to za 52,7 miliona eura ili 24,8% i 32,6 miliona eura ili
  25,6% respektivno.\\n\\nNamjenska struktura novoodobrenih kredita pokazuje da se
  tokom prvih \u0161est mjeseci teku\u0107e godine dominantan dio od 171,3 miliona
  eura ili 38,6% ukupno novoodobrenih kredita odobravao za likvidnost, nakon \u010dega
  slijede gotovinski krediti sa 105,9 miliona eura ili 23,9% u\u010de\u0161\u0107a
  u ukupno novoodobrenim kreditima.\\n\\n### 2.1.4. Depoziti\\n\\nSredstva deponovana
  u bankama su tokom prve polovine teku\u0107e godine imala trend rasta, zabilje\u017eiv\u0161i
  prosje\u010dan mjese\u010dni rast po stopi od 0,7%. Na kraju juna 2015. godine,
  depoziti kod banaka su iznosili 2.403,1 milion eura, \u0161to je za 95 miliona eura
  ili 4,1% vi\u0161e u odnosu na kraj 2014. godine, odnosno za 256,7 miliona eura
  ili 12% vi\u0161e nego godinu dana ranije.\\n\\nNajve\u0107i deponenti u crnogorskom
  bankarskom sistemu su sektor stanovni\u0161tva i nefinansijski sektor. Depoziti
  ova dva sektora su \u010dinili 89,8% ukupnih depozita na kraju posmatranog perioda,
  pri \u010demu su oba sektora pove\u0107ala sredstva deponovana u bankama za 10,1%
  i 20,8% respektivno na godi\u0161njem nivou. Op\u0161ta vlada je tre\u0107i po zna\u010daju
  deponent u crnogorskom bankarskom sistemu sa 4,6% depozita, i pritom bilje\u017ei
  rast deponovanih sredstava od 17,6% na godi\u0161njem nivou. Istovremeno, depoziti
  finansijskih institucija su \u010dinili 2,3% ukupno deponovanih sredstava u bankama
  i bilje\u017ee pad od 27%.\\n\\nOd ukupnih depozita, na depozite po vi\u0111enju
  se na kraju posmatranog perioda odnosilo 1.119,3 miliona eura ili 46,6% ukupnih
  depozita u bankama, dok se 1.282,1 milion eura ili 53,4% odnosilo na oro\u010dene
  depozite u bankama. U strukturi oro\u010denih depozita u bankama primjetna je pozitivna
  tendencija, koja se ogleda u porastu u\u010de\u0161\u0107a depozita oro\u010denih
  na period preko jedne godine, na ra\u010dun smanjenja u\u010de\u0161\u0107a kratkoro\u010dnih
  depozita. U\u010de\u0161\u0107e dugoro\u010dnih u ukupnim depozitima je tako na
  kraju juna 2015. godine iznosilo 30,4% i pove\u0107ano je za 5,7 p.p. na godi\u0161njem
  nivou, dok se 23% odnosilo na depozite ro\u010dnosti do jedne godine, koji su zabilje\u017eili
  smanjenje u\u010de\u0161\u0107a u ukupnim depozitima za 9,1 p.p. u odnosu na isti
  period prethodne godine.\\n\\nPove\u0107anje u\u010de\u0161\u0107a depozita oro\u010denih
  na period preko jedne godine u strukturi depozita zna\u010dajno je sa aspekta pobolj\u0161anja
  ro\u010dne uskladenosti aktive i pasive banaka, koju i dalje karakteri\u0161e neuskladenost.\\n\\nValutna
  struktura depozita pokazuje da je na kraju posmatranog perioda najve\u0107i dio
  depozita polo\u017een u eurima (93,6%), dok se na druge strane valute odnosilo 6,4%
  ukupnih depozita.\\n\\n2.1.5. Sektor stanovni\u0161tva i privrede\\n\\n188.8.131.52.
  Sektor stanovni\u0161tva\\n\\nTokom prvih \u0161est mjeseci 2015. godine, krediti
  odobreni sektoru stanovni\u0161tva bilje\u017eili su konstantan rast. Ovaj sektor
  je prosje\u010dno mjese\u010dno bilje\u017eio rast kredita po stopi od 0,4%, \u0161to
  predstavlja blago intenziviranje u odnosu na isti period prethodne godine kada su
  krediti ovom sektoru bilje\u017eili prosje\u010dan mjese\u010dni rast po stopi od
  0,2%. Na kraju juna 2015. godine ukupni krediti sektora stanovni\u0161tva su iznosili
  916,7 miliona eura, \u0161to je za 22,9 miliona eura ili 2,6% vi\u0161e nego na
  kraju 2014. godine, odnosno za 25,2 miliona eura ili 2,8% na godi\u0161njem nivou.\\n\\nSektor
  stanovni\u0161tva se uglavnom zadu\u017euje kod banaka na rok du\u017ei od jedne
  godine. Na kraju juna teku\u0107e godine, od ukupno odobrenih kredita ovom sektoru
  94,7% se odnosilo na dugoro\u010dne kredite.\\n\\nPosmatrano po vrsti kredita, dominantan
  dio od 460 miliona eura ili 50,2% ukupno odobrenih kredita stanovni\u0161tvu je
  bilo namjensko, a zna\u010dajno u\u010de\u0161\u0107e od 41% u ukupno odobrenim
  kreditima ovom sektoru bilje\u017ee i gotovinski krediti, dok hipotekarni krediti
  \u010dine 5,4%. Zadu\u017eenost stanovni\u0161tva po osnovu platnih kartica \u010dini
  3,1% ukupnog duga ovog sektora prema bankama na kraju drugog kvartala 2015. godine,
  dok se neznatan dio odnosio na poslove lizinga (0,3%).\\n\\nU strukturi namjenskih
  kredita odobrenih stanovni\u0161tvu, najve\u0107i dio (63,5%) se odnosio na stambene
  kredite. Stambeni krediti su iznosili 292 miliona eura na kraju juna teku\u0107e
  godine i bilje\u017ee blagi pad od 0,1% u odnosu na kraj prethodne godine, i pad
  od 1,2% na godi\u0161njem nivou.\\n\\nUkoliko se posmatraju novoodobreni krediti,
  mo\u017ee se zaklju\u010diti da je kreditna aktivnost banaka prema sektoru stanovni\u0161tva
  bila intenzivnija tokom prve polovine teku\u0107e godine u odnosu na isti period
  prethodne godine. Tako je tokom posmatranog perioda odobreno ukupno 160,1 milion
  eura novih kredita, \u0161to je za 32,6 miliona eura ili 25,6% vi\u0161e nego u
  istom periodu prethodne godine. Posmatrano po namjeni uzetih kredita, sektor stanovni\u0161tva
  je tokom ovog perioda najve\u0107im dijelom (64,2%)\\n\\nuzima gotovinske kredite,
  zatim kredite za likvidnost (15,1%) i kredite za kupovinu stanova i adaptaciju (8,9%),
  dok se 11,8% novoodobrenih kredita odnosilo na sve ostale namjene. U ro\u010dnoj
  strukturi novoodobrenih kredita, tokom prvih \u0161est mjeseci 2015. godine dominiraju
  krediti odobreni sa rokom dospije\u0107a preko jedne godine (93,8%).\\n\\nNa kraju
  juna 2015. godine depoziti sektora stanovni\u0161tva su iznosili 1.370,3 miliona
  eura, \u0161to je za 38,6 miliona eura ili 2,9% vi\u0161e nego na kraju prethodne
  godine, odnosno za 125,8 miliona eura ili 10,1% vi\u0161e nego u istom periodu prethodne
  godine. Ovaj sektor je deponovao sredstva u bankama ne\u0161to intenzivnije u odnosu
  na isti period prethodne godine, na \u0161to ukazuje vi\u0161a zabilje\u017eena
  prosje\u010dna mjese\u010dna stopa rasta ovih depozita u prvoj polovini teku\u0107e
  godine (0,5%) u odnosu na uporedni period prethodne godine (0,1%).\\n\\nNa kraju
  prve polovine 2015. godine depoziti po vi\u0111enju su \u010dinili 38% ukupnih depozita
  stanovni\u0161tva, kratkoro\u010dni depoziti 25,9%, dok se 36,1% odnosilo na sredstva
  deponovana na rok du\u017ei od jedne godine. U ro\u010dnoj strukturi depozita stanovni\u0161tva
  nastavljena je tendencija smanjenja kratkoro\u010dnih depozita u korist dugoro\u010dnih.
  Tako su dugoro\u010dni depoziti stanovni\u0161tva zabilje\u017eili najzna\u010dajniji
  rast od 107,2 miliona eura ili 27,7% na godi\u0161njem nivou, depoziti po vi\u0111enju
  su bili za 100,7 miliona eura ili 24% vi\u0161i, dok su kratkoro\u010dni depoziti
  ovog sektora zabilje\u017eili pad od 82 miliona eura ili 18,8%.\\n\\nNa kraju drugog
  kvartala 2015. godine neto \u0161tednja stanovni\u0161tva iznosila je 453,6 miliona
  eura i bila je za 15,6 miliona eura ili 3,6% vi\u0161a nego na kraju prethodne godine,
  dok je na godi\u0161njem nivou zabilje\u017eila rast od 100,6 miliona eura ili 28,5%.\\n\\nKrediti,
  depoziti i neto \u0161tednja stanovni\u0161tva, u 000.000 eura\\n\\nGrafik 2.20\\n\\nKoeficijent
  krediti/depoziti za ovaj sektor je iznosio 0,67 na kraju posmatranog perioda, i
  na istom je nivou kao na kraju prethodne godine, dok je smanjen u odnosu na kraju
  prvog kvartala prethodne godine kada je iznosio 0,72.\\n\\n184.108.40.206. Sektor
  privrede\\n\\nKreditna aktivnost banaka prema sektoru privrede blago je pobolj\u0161ana
  u posmatranom periodu. Prosje\u010dno mjese\u010dno krediti odobreni privredi bilje\u017eili
  su rast po stopi od 0,7%, \u0161to predstavlja pobolj\u0161anje, kako u odnosu na
  isti period prethodne godine kada su krediti ovom sektoru stagnirali (0% prosje\u010dan
  mjese\u010dni rast kredita), tako i u odnosu na cijelu 2014. godinu kada je zabilje\u017een
  prosje\u010dan mjese\u010dni pad po stopi od 0,3%.\\n\\nNa kraju juna 2015. godine
  sektor privrede je dugovao bankama po osnovu kredita 958 miliona eura, \u0161to
  je za 40 miliona eura ili 4,4% vi\u0161i nego na kraju prethodne godine, odnosno
  za 7,5 miliona eura ili 0,8% vi\u0161e nego godinu dana ranije. Rast kredita odobrenih
  ovom sektoru od velikog je zna\u010daja za oporavak kreditne aktivnosti banaka,
  s obzirom na \u010dinjenicu da je kreditna aktivnost banaka najve\u0107im dijelom
  usmjerena na ovaj sektor (40,2% ukupno odobrenih kredita banaka odnosi na kredite
  odobrene ovom sektoru).\\n\\nTako\u0111e, pobolj\u0161anje kreditne aktivnosti prema
  ovom sektoru evidentno je i kada se posmatraju novoodobreni krediti banaka. Banke
  su ovom sektoru tokom prve polovine teku\u0107e godine odobrile ukupno 246,6 miliona
  eura novih kredita, \u0161to je za 55,8 miliona eura ili 29,2% vi\u0161e nego u
  istom periodu.\\n\\nGrafik 2.21\\n\\nGrafik 2.22\\n\\nNovoodobreni krediti sektoru
  privrede, ro\u010dnost, u 000 eura\\n\\nprethodne godine. U strukturi ukupno novoodobrenih
  kredita ovom sektoru, dominirali su krediti odobreni na rok du\u017ei od 1 godine
  sa 59,2% u\u010de\u0161\u0107a.\\n\\n**Boks 2.2 \u2013 Dug po osnovu blokade ra\u010duna**\\n\\nU
  Centralnom registru ra\u010duna na kraju juna 2015. godine evidentirano je 74.223
  ra\u010duna pravnih lica i preduzetnika. Od ukupnog broja evidentiranih ra\u010duna,
  19,3% ili 14.332 ra\u010duna je bilo u blokadi. Broj blokiranih ra\u010duna je zabilje\u017eio
  rast u odnosu na kraj prethodne godine za 172, a na godi\u0161njem nivou za 778.\\n\\nUkupan
  dug po osnovu blokade je iznosio 525,3 miliona eura na kraju drugog kvartala teku\u0107e
  godine, i u njegovom kretanju je prisutna negativna tendencija koja se ogleda u
  pove\u0107anju duga na blokiranim ra\u010dunima u odnosu na kraj prethodne godine
  u iznosu od 29,2 miliona eura ili 5,9%. U odnosu na isti period prethodne godine
  tako\u0111e je zabilje\u017eeno pove\u0107anje duga na blokiranim ra\u010dunima
  u iznosu od 37,1 miliona eura ili 7,6%.\\n\\n**Grafik 1**\\n\\nBroj pravnih lica
  i preduzetnika u blokadi, iznos duga po osnovu blokade (u 000.000 eura)\\n\\n|  |  |\\n|---|---|\\n|
  I | II |\\n| III | IV |\\n| V | VI |\\n| VII | VIII |\\n| IX | X |\\n| XI | XII
  |\\n\\n- Vrijednosni iznos duga po osnovu blokade\\n- Ukupan broj pravnih lica i
  preduzetnika u blokadi\\n\\nIzvor: CBCG\\n\\nSektor privrede je drugi po zna\u010daju
  deponent u crnogorskom bankarskom sistemu. Na kraju juna 2015. godine, ukupan iznos
  deponovanih sredstava privrede u crnogorskim bankama je iznosio 681,2 miliona eura
  i \u010dinio je 28,3% ukupnih depozita. Depoziti privrede zabilje\u017eili su rast
  od 40,6 miliona eura ili 6,3% u odnosu na kraj 2014. godine, dok na godi\u0161njem
  nivou bilje\u017ee rast od 104,8 miliona eura ili 18,2%.\\n\\nSektor privrede je
  i na kraju drugog kvartala teku\u0107e godine bio najzna\u010dajniji neto du\u017enik,
  sa dugom po osnovu kredita ve\u0107im za 276,7 miliona eura u odnosu na sredstva
  ovog sektora deponovana u bankama. Zabilje\u017een neto dug ovog sektora je bio
  za 0,2% ni\u017ei nego na kraju 2014. godine, dok je u odnosu na jun 2014. godine
  bio ni\u017ei za 26%.\\n\\nKoeficijent krediti/depoziti za sektor privrede je na
  kraju juna 2015. godine iznosio 1,41, i pobolj\u0161an je u odnosu na kraj 2014.
  godine kada je iznosio 1,43, kao i u odnosu na kraju juna 2014. godine kada je iznosio
  1,65.\\n\\n### Grafik 2.24\\n\\n**Struktura strane aktive banaka, u 000 eura**\\n\\n-
