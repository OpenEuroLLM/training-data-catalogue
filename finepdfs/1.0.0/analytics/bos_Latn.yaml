sample: '["\"Naru\u010dilac:\u201eSportsko-rekreativni centar\\\" doo Bar\\n\\nBroj:
  1181/19\\n\\nMjesto i datum: Bar, 06.12.2019. godine\\n\\nNa osnovu \u010dlana 30
  Zakona o javnim nabavkama (\\\"Sl. List CG\\\", br. 42/11, 57/14 i 42/17), kao i
  na osnovu \u010dlana 6 Pravilnika o sprovo\u0111enju postupaka male vrijednosti
  br. 586/17  od 04.08.2017. godine , donosi se\\n\\nOBAVJE\u0160TENJE O ISHODU POSTUPKA
  NABAVKE MALE VRIJEDNOSTI\\n\\nI   PODACI O  NARU\u010cIOCU\\n\\nII Predmet nabavke:\\n\\nRobe\\n\\nIII  Opis
  predmeta nabavke:\\n\\nNabavka robe:\\n\\n- \u0161tampa pvc-rezervacije 15x10, 54
  kom.\\n- trenerke sa \u0161tampom, 5 kom.\\n- \u0161tampa pvc-tabla obavje\u0161tenja,
  1 kom.\\n- \u0161tampa postera + forex, 1 kom.\\n\\nIV Procijenjena vrijednost nabavke:\\n\\nProcijenjena
  vrijednost nabavke sa ura\u010dunatim PDV-om 253,50 \u20ac.\\n\\nV Ishod postupaka
  nabavke male vrijednosti je\\n\\nizbor najpovoljnije ponude\\n\\nVI Naziv ponudja\u010da
  \u010dija je ponuda izabrana kao najpovoljnija:\\n\\nVII  Cijena najpovoljnije ponude\\n\\n253,50  \u20ac\\n\\nVIII
  Sa izabranim ponu\u0111a\u010demnaru\u010dilac\\n\\n\u0107e realizovati predmetnu
  nabavku na osnovu ra\u010duna broj 507/19 od 02.12.2019. godine, zaveden kod DOO
  \\\"Sportsko-rekreativnicentar\\\" Bar pod brojem 1180/19 od 06.12.2019. godine.\"",
  "\"NISOTEC 4T GARDEN\\n\\nNISOTEC 4T GARDEN je sezonsko monogradno motorno SAE 30
  ulje visokog u\u010dinka, za \u010detvorotaktne motore motokultivatora i ba\u0161tenske
  opreme. Prednosti upotrebe:\\n\\n- Dobro podmazivanje sklopova motora svodi habanje
  na minimum\\n- Optimalan rad motora pri kontinualnoj upotrebi u svim uslovima\\n-
  Odli\u010dnu za\u0161titu od r\u0111e i korozije u vla\u017enim uslovima\\n\\nKvalitetni
  nivo: API SL/CF\\n\\nFizi\u010dko-hemijske osobine\\n\\nNamena\\n\\nNISOTEC 4T GARDEN
  koristi se za podmazivanje motora motokultivatora, kosilica, kosa\u010dica, rotacionih
  motika, generatora i drugih malih \u010detvorotaktnih motora. Optimalno podmazivanje
  obezbe\u0111uje kinemati\u010dka viskoznost koja odgovara gradaciji SAE 30.\\n\\nSkladi\u0161tenje\\n\\nProizvod
  \u010duvati u originalnoj ambala\u017ei i rezervoarima  za\u0161ti\u0107enim od
  direktnog uticaja atmosferilija.\\n\\nPakovanje i isporuka\"", "\"Datum: 31.12.2024.\\n\\nUstanova:
