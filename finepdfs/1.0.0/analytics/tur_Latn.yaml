  edilecek paylar ile ilgili ayr\u0131nt\u0131l\u0131 bilgileri i\u00e7eren izahname
  ortakl\u0131\u011f\u0131m\u0131z\u0131n ve halka arzda sat\u0131\u015fa arac\u0131l\u0131k
  edecek Invest AZ Yat\u0131r\u0131m Menkul De\u011ferler A.\u015e.\u2019nin www.investaz.com.tr
  adresli internet siteleri ile Kamuyu Ayd\u0131nlatma Platformu (\u201cKAP\u201d)\u2019nda
  (kap.gov.tr) 27.02.2018 tarihinde yay\u0131mlanm\u0131\u015ft\u0131r. Ayr\u0131ca
  ba\u015fvuru yerlerinde inceleme a\u00e7\u0131k tutulmaktad\u0131r. Halka arz edilecek
  paylara ili\u015fkin yat\u0131r\u0131m kararlar\u0131, izahnamenin bir b\u00fct\u00fcn
  olarak de\u011ferlendirilmesi sonucu verilmelidir.\\n\\n1. PAYLARIN HALKA ARZINA
  \u0130L\u0130\u015eK\u0130N B\u0130LG\u0130\\n\\na) Halka Arz S\u00fcresi:\\n\\nHalka
  arz edilecek olan 6.998.215.663 TL nominal de\u011ferli paylar 19.03.2018 ile 20.03.2018
  tarihleri aras\u0131nda 2 (iki) i\u015f g\u00fcn\u00fc s\u00fcreyle sat\u0131\u015fa
  sunulacakt\u0131r.\\n\\nBir pay\u0131n nominal de\u011feri 0.01 TL olup, 1 lot (100
  adet) pay 1 TL\u2019den az olmamak \u00fczere Borsa \u0130stanbul A.\u015e. Birincil
  Piyasa\u2019da olu\u015facak fiyattan sat\u0131\u015fa sunulacakt\u0131r.\\n\\nb)
  Ba\u015fvuru \u015eekli:\\n\\nBa\u015fvuru \u015fekline ili\u015fkin ayr\u0131nt\u0131l\u0131
  bilgi, \u0130zahname\u2019nin \u201cHalka Arza Ba\u015fvuru S\u00fcreci\u201d ba\u015fl\u0131\u011f\u0131n\u0131n
  alt\u0131nda bulunan \u201ca) Sat\u0131\u015f Y\u00f6ntemi ve Ba\u015fvuru \u015eekli\u201d
  altba\u015fl\u0131\u011f\u0131nda verilmektedir.\\n\\nc) Ba\u015fvuru Yerleri:\\n\\nBa\u015fvuru
  yerlerine ili\u015fkin ayr\u0131nt\u0131l\u0131 bilgi, \u0130zahname\u2019nin \u201cHalka
  Arza Ba\u015fvuru S\u00fcreci\u201d ba\u015fl\u0131\u011f\u0131n\u0131n alt\u0131nda
  bulunan \u201cc) Ba\u015fvuru Yerleri\u201d altba\u015fl\u0131\u011f\u0131nda verilmektedir.\\n\\nd)
  Paylar\u0131n Teslim \u015eekli:\\n\\nPaylar\u0131n teslim \u015fekline ili\u015fkin
  ayr\u0131nt\u0131l\u0131 bilgi, \u0130zahname\u2019nin \u201cHalka Arza Ba\u015fvuru
  S\u00fcreci\u201d ba\u015fl\u0131\u011f\u0131n\u0131n alt\u0131nda bulunan \u201cd)
  Paylar\u0131n Da\u011f\u0131t\u0131m Zaman\u0131 ve Yeri\u201d altba\u015fl\u0131\u011f\u0131nda
  verilmektedir.\\n\\n2. TASARRUF SAH\u0130PLER\u0130NE SATI\u015e DUYURUSUNUN SORUMLULU\u011eUNU
  Y\u00dcKLENELEN K\u0130\u015e\u0130LER\\n\\nBu tasarruf sahiplerine sat\u0131\u015f
  duyurusunda yer alan bilgilerin, sahip oldu\u011fumuz t\u00fcm bilgiler \u00e7er\u00e7evesinde,
  ger\u00e7e\u011fe uygun oldu\u011funu ve tasarruf sahiplerine sat\u0131\u015f duyurusunda
  bu bilgilerin anlam\u0131n\u0131 de\u011fi\u015ftirecek nitelikte bir eksiklik bulunmamas\u0131
