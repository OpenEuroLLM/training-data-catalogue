  ABD, Osmanl\u0131 topraklar\u0131nda kendisi i\u00e7in a\u00e7\u0131k alanlar\u0131
  meydana getirmek i\u00e7in iki \u00f6nemli ara\u00e7tan yararlanm\u0131\u015ft\u0131r.
  Ticaret ve Misyonerlik faaliyetleri, ABD\u2019yi bu topraklara ta\u015f\u0131m\u0131\u015f,
  emperyalist y\u00f6nde de\u011fi\u015fen d\u00fcnya siyasetinde ABD, bu iki enstr\u00fcman
  sayesinde kendisini koruyan Monroe Doktrinini delmeden di\u011fer devletlerin aras\u0131nda
  d\u00fcnya siyasetinde yer edinebilmek i\u00e7in a\u00e7\u0131k kap\u0131 emperyalist
  hareketine ge\u00e7mi\u015ftir. 1810 y\u0131l\u0131nda kurulan Amerikan Board misyoner
  \u00f6rg\u00fct\u00fc, kendisine hedef kitle olarak Anadolu\u2019nun her taraf\u0131na
  yay\u0131lm\u0131\u015f olan Ermenileri se\u00e7erek Osmanl\u0131 topraklar\u0131nda
  a\u00e7m\u0131\u015f oldu\u011fu misyoner okullar\u0131 sayesinde Ermeni gen\u00e7lerini
  kendi istedikleri gibi yeti\u015ftirip Ermeni isyanlar\u0131n\u0131n olu\u015fumuna
  zemin haz\u0131rlayarak ABD\u2019nin bu topraklarda s\u00f6z sahibi yap\u0131lmas\u0131
  planlanmaktayd\u0131. Isyanlar\u0131n \u00f6nemli bir propaganda malzemesi olarak
  ABD\u2019de misyonerler taraf\u0131ndan kullan\u0131lmas\u0131 bu \u00fclkede Osmanl\u0131
  Devleti\u2019ne kar\u015f\u0131 bir kamuoyunun olu\u015fmas\u0131na neden oldu.
  Bu \u00e7al\u0131\u015fmam\u0131zda Amerikan Protestan misyonerlerin Anadolu\u2019daki
  faaliyetlerine de\u011finerek Sason \u0130syanlar\u0131n\u0131n nas\u0131l bir propaganda
  arac\u0131 haline d\u00f6n\u00fc\u015ft\u00fcr\u00fcld\u00fc\u011f\u00fcn\u00fc
  ABD\u2019de kullan\u0131ld\u0131\u011f\u0131na g\u00f6rece\u011fiz.\\n\\nAnahtar
  Kelimeler: Sason isyan\u0131, Amerikan Board, Ermeni isyanlar\u0131\\n\\nSason Armenian
  Revolts and the American Missionaries\\n\\nAbstract: America had used to have a
  considerable role among the external reasons of the Armenian revolts which took
  place particularly in Anatolia\u2019s geography. Since the beginning of the nineteen
  century, America had tried to utilize two instruments for constituting its interest
  regions in Ottoman territories. Trade and Missionary activities, were the only open
  doors to penetrate into Middle East according to the Monroe Doctrine, which kept
  America in its continent and also forced it not to intervene other European countries
  imperialist activities in the world. Ottoman Armenians were put on the agenda of
  American Board by the American missionaries, who were sent by ABCFM from America
  since 1819. After a long-term education, health service, protestantism and history-language
  renovation among the Anatolian Armenians, American missionaries had paved the way
  to make Armenians feel to found thier own state on their ansectral land. So a series
  of revolts occurred in many provinces of Ottoman Empire. Sason Armenian Revolt was
  one of them in which American missionaries had taken a role. So we will try to focus
  on the role of American missionaries in this revolt especially according to the
  Ottoman archive documents.\\n\\nKey words: ABCFM, Sason Armenain Revolt, American
  Boards, Ermeni isyanlar\u0131\\n\\n1. G\u0130R\u0130\u015e\\n\\nErmeni Meselesi\u2019nin
  en \u00f6nemli \u00e7\u0131k\u0131\u015f noktalar\u0131ndan bir tanesi 19. y\u00fczy\u0131l\u0131n
  sonlar\u0131 ile 20. y\u00fczy\u0131l\u0131n ba\u015flar\u0131 itibariyle Anadolu\u2019da
  meydana gelen Ermeni isyanlard\u0131r. \u0130syanlar\u0131n olu\u015fum s\u00fcrecinde
  rol oynayan nedenlerin ba\u015f\u0131nda misyonerlik faaliyetleri b\u00fcy\u00fck
  \u00f6nem arz etmektedir\\\\(^1\\\\). Osmanl\u0131 Devleti topraklar\u0131nda H\u0131ristiyan
  dinin propagandas\u0131, bu dinin ba\u015fta Katolik, Ortodoksluk ve Protestanl\u0131k
  mezheplerinin yay\u0131lmas\u0131 amac\u0131yla Fransa, Rusya, \u0130ngiltere, Almanya,
  Amerika, \u0130svi\u00e7re ve Norve\u00e7 k\u00f6kenli misyoner \u00f6rg\u00fctler
  taraf\u0131ndan ger\u00e7ekle\u015ftiriliyordu. \u0130mparatorlu\u011fun sahip oldu\u011fu
  Ermeni az\u0131nl\u0131\u011f\u0131, 19. y\u00fczy\u0131l\u0131n ortalar\u0131nda
  bu misyoner gruplar\u0131n\u0131n ana hedefi olmu\u015ftu. M\u00fcsl\u00fcmanlar\u0131n,
  Rumlar\u0131n ve Yahudilerin misyonerlik faaliyetleri etkisinde kal\u0131p din de\u011fi\u015ftirmeleri
  pek kolay olmam\u0131\u015f, Rusya\u2019n\u0131n Ortodoks Rumlar \u00fczerindeki
  bask\u0131s\u0131, M\u00fcsl\u00fcmanlar\u0131n din de\u011fi\u015ftirmeye s\u0131cak
  bakmamas\u0131 ve hatta idam ile yarg\u0131lanma korkusu ve ayr\u0131ca Yahudilerin
  dinlerine s\u0131k\u0131 s\u0131k\u0131ya ba\u011fl\u0131 olmas\u0131 \u00f6zellikle
  Amerikan misyonerlerini Anadolu\u2019nun her taraf\u0131na yay\u0131lm\u0131\u015f,
  kilseleri ile problem ya\u015fayan ve e\u011fitime b\u00fcy\u00fck \u00f6nem veren
  Ermenilerin \u00fczerine yo\u011funla\u015fmalar\u0131n\u0131 sa\u011flam\u0131\u015ft\u0131.\\n\\n19.
  y\u00fczy\u0131l misyonerlik faaliyetlerinin alt\u0131n \u00e7a\u011f\u0131 olmu\u015f
  ve bu \u00e7a\u011fda \u00f6zellikle Asya k\u0131tas\u0131n\u0131n H\u0131ristiyanla\u015ft\u0131r\u0131lmas\u0131
  hedef al\u0131nm\u0131\u015ft\u0131. Bu hedefin ger\u00e7ekle\u015fmesinde yabanc\u0131lar\u0131n
  belirtti\u011fi *Asia Minor* yani T\u00fcrkiye bir anahtar g\u00f6rev \u00fcstlenecekti.
  Asya\u2019n\u0131n fethine Anadolu topraklar\u0131ndan ba\u015flanacakt\u0131\\\\(^2\\\\).
  Emperyalizm kavram\u0131 bu \u00e7a\u011fda anlamsal olarak geni\u015fleyerek i\u00e7ine
  *Kapitalizm* ve *S\u00f6m\u00fcrgecilik* kavramlar\u0131n\u0131 da alarak bat\u0131l\u0131
  devletlerin \u00fczerinde yay\u0131lma hayali kurdu\u011fu \u00f6zellikle Orta Do\u011fu
  co\u011frafyas\u0131nda hem hayat bulacak hem de ger\u00e7ek anlam\u0131n\u0131
  kazanacakt\u0131r. Misyoner \u00f6rg\u00fctlerin bu co\u011frafyada faaliyet g\u00f6stermek
  i\u00e7in can atmas\u0131, ilk y\u0131llarda her ne kadar dini ve ba\u011f\u0131ms\u0131z
  hareketler \u015feklinde kendini g\u00f6stermi\u015f ise de, sonraki y\u0131llarda
  emperyalizmin bir arac\u0131 olmaktan kendini kurtaramayan misyoner \u00f6rg\u00fctler,
  faaliyet g\u00f6sterdikleri sahalarda destek\u00e7i olan devletler ad\u0131na yay\u0131lma
  alan\u0131 ve \u00e7\u0131kar sahalar\u0131 olu\u015fturma g\u00f6revlerini \u00fcstlenmi\u015flerdi\\\\(^3\\\\).\\n\\n---\\n\\n\\\\(^1\\\\)
  Ermeni Meselesinin Ortaya \u00c7\u0131k\u0131\u015f\u0131nda Etkili Olan Unsurlar,
  Ayr\u0131nt\u0131l\u0131 bilgi i\u00e7in bkz. Tu\u011frul \u00d6zcan, II. Abd\u00fclhamid
  D\u00f6neminde Orta ve Do\u011fu Karadeniz\u2019de Meydana Gelen Ermeni Olaylar\u0131,
  Akis Kitap, \u0130stanbul, 2007, s.17-32.\\n\\n\\\\(^2\\\\) S.C. Bartlett, Historical
  Sketch of The American Board: Turkey Report, Published By American Board, Boston,
  1889, s.1-2\\n\\n\\\\(^3\\\\) Dil\u015fen Ince Erdo\u011fan, Merzifon\u2019da Amerikal\u0131
  Misyonerler ve Ermeniler, \u00c7a\u011fda\u015f T\u00fcrkiye Ara\u015ft\u0131rmalar\u0131
  Dergisi, Cilt: 4, Say\u0131: 11, \u0130zmir, 2005, s.18.\\n\\nAmerican Board Of
  Commissioners For Foreign Missions, (ABCFM) ya da di\u011fer ad\u0131yla Amerikan
  Board, ABD\u2019nin Boston eyaletinde 1810 y\u0131l\u0131nda kurulmu\u015f olan
  bir misyoner \u00f6rg\u00fct\u00fcd\u00fcr. ABD\u2019de b\u00fcy\u00fck uyan\u0131\u015f
  d\u00f6nemlerinden sonra (Great Awakenings) Protestanl\u0131k, \u00f6nemli bir unsur
  olarak g\u00f6\u00e7men olan, farkl\u0131 din, irk ve k\u00fclt\u00fcrlerden gelen
  ABD halk\u0131n\u0131 ortak bir payda da birle\u015ftirmek i\u00e7in kullan\u0131lmaya
  ba\u015fland\u0131. Kurulan bir\u00e7ok Protestan misyoner \u00f6rg\u00fctleri Amerika
  k\u0131tas\u0131n\u0131n Protestanla\u015ft\u0131r\u0131lmas\u0131na girdi. Protestanl\u0131\u011f\u0131
  ger\u00e7ek ve yenilenmi\u015f H\u0131ristiyanl\u0131k olarak g\u00f6ren bu misyoner
  \u00f6rg\u00fctler H\u0131ristiyanl\u0131\u011f\u0131n \u00e7\u0131k\u0131\u015f
  b\u00f6lgesi olan Osmanl\u0131\u2019n\u0131n Ortado\u011fu\u2019daki topraklar\u0131n\u0131
  hedef almaya ba\u015fladilar. Misyon b\u00f6lgelerinin payla\u015f\u0131m\u0131nda
  Osmanl\u0131 topraklar\u0131nda faaliyet g\u00f6sterecek olan Protestan misyon \u00f6rg\u00fct\u00fc
  \u201cAmerikan Board\u201d i\u015fte bu \u00f6rg\u00fctlerden sadece biri olarak
  Kongregesyonalist\\\\(^4\\\\) kiliselerinin, zengin Amerikan t\u00fcccarlar\u0131n\u0131n
  ve fakir kilise \u00fcyelerinin yard\u0131mlar\u0131 ile kurulmu\u015ftu\\\\(^5\\\\).\\n\\nABD,
  Monroe Doktrini\u2019ni ortaya koyarak hem d\u00fcnya siyasetinden uzak durmay\u0131
  ve hem de kendi k\u0131tas\u0131 d\u0131\u015f\u0131nda geli\u015fen siyasetin bir
  s\u00f6m\u00fcrge hareketine d\u00f6n\u00fc\u015f\u00fcp ABD\u2019ye zarar vermesini
  engellemeye \u00e7al\u0131\u015fmaktayd\u0131\\\\(^6\\\\). Fakat emperyalist y\u00f6nde
  de\u011fi\u015fen d\u00fcnya siyaseti ABD\u2019nin mutlaka bu siyasetin i\u00e7ine
  girmesini gerektiriyordu. ABD\u2019yi kendi kabu\u011funa hapseden Monroe Doktrini
  bir \u00f6l\u00e7\u00fcde delinmeli ve d\u00fcnyan\u0131n payla\u015f\u0131m\u0131ndan
  pay elde edilerek \u00fcretim fazlas\u0131 olan mallar\u0131n sat\u0131lmas\u0131
  gereken bir tak\u0131m etki sahalar\u0131 meydana getirmeliydi\\\\(^7\\\\). Devletten
  ba\u011f\u0131ms\u0131z ve sivil kurulu\u015flar olan misyoner \u00f6rg\u00fctler
  ABD\u2019nin a\u00e7\u0131k kap\u0131 emperyalist faaliyetlerini y\u00fcr\u00fctmesinde
  kullan\u0131lmaya ba\u015fland\u0131. Bu nedenle Bat\u0131l\u0131 devletleraras\u0131nda
  pop\u00fcler olan Osmanl\u0131 topraklar\u0131 ABD\u2019nin de istahm\u0131 kabart\u0131yordu.
  Devletin misyonerleri bu \u015fekilde kabul etmesi misyoner \u00f6rg\u00fctlerinde
  i\u015fine geliyor ve ticaret ili\u015fkisi kurulan her devlete mal ile birlikte
  y\u00fcz\u00fcnde g\u00fclm\u00fc\u015fseme olan misyonerler de getiriliyordu\\\\(^8\\\\).
  B\u00f6yle bir ticaret gemisiyle Amerikan Board, ilk misyonerlerini Osmanl\u0131\\n\\n---\\n\\n\\\\(^4\\\\)
  Ayr\u0131nt\u0131l\u0131 bilgi i\u00e7in bkz. H\u00fcseyin Erdem, H\u0131ristiyanl\u0131kta
  Kongregesyonalist Ak\u0131m\u0131n Ortaya \u00c7\u0131k\u0131\u015f\u0131 ve G\u00f6r\u00fc\u015fleri,
  Yay\u0131nlanmam\u0131\u015f Y\u00fcksek Lisans Tezi, Ankara \u00dcniversitesi Sosyal
  Bilimler Enstit\u00fcs\u00fc, Felsefe ve Dinler Tarihi Ana Bilim Dal\u0131, Ankara,
  2009, s.32-63.\\n\\n\\\\(^5\\\\) William E. Strong, The Story Of The American Board,
  The Pilgrim Press, Boston, 1910, s.388-390\\n\\n\\\\(^6\\\\) Yavuz G\u00fcler, Osmanl\u0131
  Devleti D\u00f6nemi T\u00fcrk - Amerikan \u0130li\u015fkileri (1795 \u2013 1914),
  Gazi \u00dcniversitesi K\u0131r\u015fehir E\u011fitim Fak\u00fcltesi Dergisi, Cilt:
  6, Say\u0131: 1, Ankara 2005, s.56.\\n\\n\\\\(^7\\\\) G\u00fclbad\u0131 Alan, G\u00f6khann
  Polat, The American Board And The Ottoman Women\u2019s Education, History Studies
  ABD ve B\u00fcy\u00fck Ortado\u011fu \u0130li\u015fkileri \u00d6zel Say\u0131s\u0131,
  2011, s.106-107\\n\\n\\\\(^8\\\\) Mithat Aydin, Amerikan Protestan Misyonerlerin
  Ermeniler aras\u0131ndaki Faaliyetleri ve Bunun Osmanl\u0131-Amerikan \u0130li\u015fkilerine
  \u0130li\u015fkisi, Ankara \u00dcniversitesi Osmanl\u0131 Tarihi Ara\u015ft\u0131rmalar\u0131
  Merkezi Dergisi. (OTAM), S: 19, Ankara, 2005, s.81\\n\\ntopraklar\u0131nda saha
  ara\u015ft\u0131rmas\u0131n\u0131n yan\u0131nda bu topraklarda ya\u015fayan halklar\u0131n
  her t\u00fcrl\u00fc \u00f6zelli\u011fini inceleyecek ve bu incelemenin sonu\u00e7lar\u0131n\u0131
  daha sonra sahaya g\u00f6nderilecek yeni misyonerlerin e\u011fitiminde kullanaca\u011f\u0131
  raporlar halinde merkez olan Boston\u2019a g\u00f6ndermelerini istemektediydi. Pliny
  Fisk, Levy Parsons, Otis Dwight, Eli Smith Osmanl\u0131 topraklar\u0131na ilk gelen
  Amerikal\u0131 Protestan misyonerlerdi\\\\(^9\\\\).\\n\\nAsl\u0131nda Protestanl\u0131k
  Osmanl\u0131 topraklar\u0131na Amerikal\u0131lar sayesinde gelmemi\u015fti. \u0130ngiltere,
  Osmanl\u0131 Devleti topraklar\u0131nda kendisine \u00e7\u0131kar sa\u011flayacak
  bir unsur meydana getirmek istiyordu. Frans\u0131zlar, Katoliklerin haklar\u0131n\u0131
  bahane ederek ve Ruslar ise imparatorlu\u011fun Ortodoks milletini bahane ederek
  Osmanl\u0131 Devleti\u2019nin i\u00e7 i\u015flerine m\u00fcdahale ederek bir hegemonya
  olu\u015fturup tarihten beri s\u00fcre gelen bu topraklar \u00fczerindeki ideolojik
  ama\u00e7lar\u0131n\u0131n ger\u00e7ekle\u015fmesinin alt yap\u0131lar\u0131n\u0131
  haz\u0131rl\u0131yorlard\u0131\\\\(^10\\\\). \u0130ngiltere ise Protestanl\u0131k
  mezhebini kullanarak misyonerleri bu mezhebi kabul edebilecek en uygun ve ayr\u0131lc\u0131
  hareketlere ilgi g\u00f6steren Ermeniler aras\u0131na g\u00f6ndererek bu mezhebin
  Ermeniler aras\u0131nda yay\u0131lmas\u0131 ba\u015flam\u0131\u015ft\u0131. B\u00f6ylelikle
  Osmanl\u0131 Ermenileri, Katolik, Protestan ve Ortodoks mezheplerine b\u00f6l\u00fcnerek
  bu mezheplerin yay\u0131lmas\u0131na destek veren devletlerin Osmanl\u0131 \u0130mparatorlu\u011fu\u0131ndaki
  \u00e7\u0131kar oda\u011f\u0131 olmu\u015ftu\\\\(^11\\\\). \u0130ngiltere, ABD\u2019nin
  Osmanl\u0131 topraklar\u0131nda ticaret kolonileri kurma konusunda yard\u0131m etmi\u015f
  ve Amerikan misyonerlerinin \u00f6zellikle Anadolu\u2019da rahat\u00e7a gezmeleri
  konusunda g\u00fcvenlik sa\u011flam\u0131\u015ft\u0131r\\\\(^12\\\\). \u0130ngiltere,
  bu yard\u0131m\u0131 asl\u0131nda bilin\u00e7li olarak yapmaktayd\u0131. As\u0131l
  amac\u0131 Protestanl\u0131\u011f\u0131 yaymak i\u00e7in gelen Amerikan misyonerlerine
  kendi misyonerlerinin g\u00f6revini devrederek \u00f6zellikle Anadolu\u2019nun orta
  ve do\u011fu b\u00f6lgelerinde Ermenilerin yo\u011funlukta ya\u015fad\u0131\u011f\u0131
  alanlarda hem Protestanl\u0131\u011f\u0131n yay\u0131lmas\u0131n\u0131 sa\u011flayacakt\u0131
  hem de ABD\u2019nin bu b\u00f6lgeye yerle\u015fmesiyle Rusya\u2019n\u0131n bu b\u00f6lgelerdeki
  Ermeniler \u00fczerindeki etkisini kuracak bir tampon olu\u015fturmay\u0131 hedeflemekteydi\\\\(^13\\\\).\\n\\n---\\n\\n\\\\(^9\\\\)
  Hasan Tahsin Fendo\u011flu, Amerika Birle\u015fik Devletleri\u2019nin Misyonerleri
  ve Osmanl\u0131 Devleti, T\u00fcrkler Ansiklopedisi, Ed: Hasan \u00c7elal G\u00fczel,
  Cilt:14, Yeni T\u00fcrkiye Yay\u0131nlar\u0131, Ankara, 2002, s.190\\n\\n\\\\(^10\\\\)
  Mithat Ayd\u0131n, a.g.m., s.80-81.\\n\\n\\\\(^11\\\\) Ayten Sezer, Osmanl\u0131\u2019dan
  Cumhuriyete Misyonerlerin T\u00fcrkiye\u2019deki E\u011fitim ve \u00d6\u011fretim
  Faaliyetleri, Hacettepe \u00dcniversitesi Edebiyat Fak\u00fcltesi Dergisi, Ankara,
  Ekim 1999, s.17-174.\\n\\n\\\\(^12\\\\) Esra Danac\u0131o\u011flu, Osmanl\u0131
  \u0130mparatorlu\u011fu\u2019nda Amerikan Board Okullar\u0131 ve Ermeniler, Dokuz
  Eyl\u00fcl \u00dcniversitesi Atat\u00fcrk \u0130lkeleri ve \u0130nk\u0131lap Tarihi
  Enstit\u00fcs\u00fc Dergisi, Cilt: 3, Say\u0131: 9-10, s.137\\n\\n\\\\(^13\\\\)
  Hikmet Umunc, On The Edge Of The Civilized Word: Cyrus Hamlin And The American Missionary
  Work In Turkey, T\u00fcrk Tarih Kurumu Belleten, Cilt:LXIII. Say\u0131: 253, Ankara,
  2004, s.7.\\n\\nAmerikan Board Protestan misyoner \u00f6rg\u00fct\u00fcn\u00fcn
  Osmanl\u0131 topraklar\u0131nda ba\u015flayan maceras\u0131 halen g\u00fcn\u00fcm\u00fcze
  kadar devam etmektedir. Hristiyanl\u0131\u011f\u0131n di\u011fer mezheplerine adam
  kazand\u0131rmak i\u00e7in bu topraklarda faaliyet g\u00f6stermi\u015f olan di\u011fer
  misyoner \u00f6rg\u00fctlerden farkl\u0131 olarak sahaya 100 y\u0131l ge\u00e7 girmesine
  ra\u011fmen kararl\u0131 ve \u00f6rg\u00fctl\u00fc faaliyetleri ile \u00f6zellikle
  Anadolu\u2019nun her taraf\u0131na yay\u0131lm\u0131\u015ft\u0131r\\\\(^{14}\\\\).
  En verimli d\u00f6nemine ne gariptir ki II. Abd\u00fclhamid\u2019\u0131n h\u00fck\u00fcmdarl\u0131k
  d\u00f6neminde ula\u015fm\u0131\u015ft\u0131\\\\(^{15}\\\\).\\n\\nErmenilerin, 1829
  y\u0131l\u0131nda meydana gelen ve Yunanistan\u2019\u0131n ba\u011f\u0131ms\u0131zl\u0131\u011f\u0131
  ile sonu\u00e7lanan Yunan \u0130syan\u0131 sonras\u0131nda Rum simslardan bo\u015falan
  Osmanl\u0131 deniz ticaretinde \u00f6ne \u00e7\u0131kmalar\u0131 ve Amerikan ticaret
  kolonileri ile ili\u015fki kurup Amerikan mallar\u0131n\u0131n Anadolu\u2019nun
  i\u00e7 k\u0131s\u0131mlar\u0131na kadar ula\u015ft\u0131r\u0131lmas\u0131nda g\u00f6rev
  almalar\u0131, Ermenilerin Amerika ile olan ili\u015fkisini ba\u015flatm\u0131\u015ft\u0131r\\\\(^{16}\\\\).
  Ticaret gemileri ile birlikte gelen misyonerler, yirmi y\u0131l gibi bir s\u00fcrede
  fizibilite \u00e7al\u0131\u015fmas\u0131 yaparak, \u0130zmir\u2019den Tebriz\u2019e
  at s\u0131rt\u0131nda Anadolu\u2019yu gezip misyon i\u00e7in uygun \u015fartlar
  aranm\u0131\u015f ve sahaya gelecek di\u011fer misyonerlerin e\u011fitiminde kullan\u0131lacak
  Anadolu insan\u0131n\u0131 k\u00fclt\u00fcr t\u00fcrl\u00fc, inanc\u0131yla ve diliyle
  desifre eden matelyallerin haz\u0131rlanmas\u0131nda b\u00fcy\u00fck rol oynam\u0131\u015flard\u0131r\\\\(^{17}\\\\).
  Ermenilerin, \u00f6zellikle Anadolu\u2019nun Do\u011fu b\u00f6lgelerinde merkez
  y\u00f6netimini bask\u0131 etkisinden uzak alanlarda yo\u011fun olmas\u0131, \u00fcyesi
  olduklar\u0131 kilise ile ayr\u0131l\u0131klar ya\u015famas\u0131 ve di\u011fer
  gruplar\u0131n din de\u011fi\u015ftirmeye s\u0131cak bakmamas\u0131 Amerikal\u0131
  misyonerleri Ermeniler aras\u0131nda daha fazla faaliyet g\u00f6stermesine neden
  olmu\u015ftur\\\\(^{18}\\\\).\\n\\nAmerikan Board misyonerleri faaliyetlerinin ilk
  y\u0131llar\u0131nda sadece dini telkinler kullanarak Protestanl\u0131\u011fa insan
  kazand\u0131rma y\u00f6ntemini se\u00e7ti. Bu nedenle ba\u015fta \u0130stanbul olmak
  \u00fczere Anadolu\u2019da bulunan Ermeni kiliselerine sizarak kendilerini Ermenilere
  yard\u0131m etmek ve bu toplumu y\u00fcceltmek i\u00e7in burada olduklar\u0131n\u0131
  belirterek Ermeni milleti aras\u0131nda k\u00fc\u00e7\u00fck n\u00fcveler olu\u015fturmaya
  \u00e7al\u0131\u015ftilar\\\\(^{19}\\\\). Fakat bu telkinler sadece misyonerlerin
  evlerinde yard\u0131mc\u0131 ola-\\n\\n---\\n\\n\\\\(^{14}\\\\) Hasan Tahsin Fendo\u011flu,
  *a.g.m.*, s.190-192\\n\\n\\\\(^{15}\\\\) Se\u00e7il Akg\u00fcn, Amerikal\u0131 Misyonerlerin
  Anadolu\u2019ya Bak\u0131\u015flar\u0131, Ankara \u00dcniversitesi Osmanl\u0131
  Tarihi Ara\u015ft\u0131rmalar\u0131 Merkezi Dergisi. (OTAM), S: 3, Ankara, 1992,
  s.1.\\n\\n\\\\(^{16}\\\\) Mustafa Nulman Malkoc, T\u00fcrkiye\u2019de Protestan
  Misyonerli\u011fi, Tart\u0131\u015fmal\u0131 \u0130limi Toplant\u0131lar Dizisi,
  No 43, T\u00fcrkiye\u2019de Misyonerlik, Isav Yay\u0131nlar\u0131, \u0130stanbul,
  2004, s.161.\\n\\n\\\\(^{17}\\\\) Hikmet Umunc, On The Edge Of The Civilized Word:
  Cyrus Hamlin And The American Missionary Work In Turkey, T\u00fcrk Tarih Kurumu
  Belleteni, Cilt:LXIII. Say\u0131: 253, Ankara, 2004, s.7\\n\\n\\\\(^{18}\\\\) Adnan
  \u015ei\u015fman, Misyonerlik ve Osmanl\u0131 Devleti\u2019nin Son D\u00f6neminde
  Kurulan Yabanc\u0131 Sosyal ve K\u00fclt\u00fcrel M\u00fcesseseler, T\u00fcrkler
  Ansiklopedisi, Yeni T\u00fcrkiye Yay\u0131nlar\u0131, Cilt: 14, Ed. Hasan Celal
  G\u00fczel, Ankara, 2002, s.174.\\n\\n\\\\(^{19}\\\\) Uygur Kocabaso\u011flu, Anadolu\u2019daki
  Amerika Kendi Belgeleriyle 19. Y\u00fczy\u0131lda Osmanl\u0131 \u0130mparatorlu\u011fu\u2019ndaki
  Amerikan Misyoner Okullar\u0131, \u0130mge Yay\u0131nlar\u0131, Ankara, 2000, s.48.\\n\\nrak
  \u00e7al\u0131\u015fan Ermenilerin Protestan yap\u0131lmas\u0131ndan \u00f6teye
  ge\u00e7emedi\\\\(^{20}\\\\). Osmanl\u0131 Devleti\u2019nin di\u011fer n\u00fcfus
  gruplar\u0131nda ya\u015fam\u0131\u015f olduklar\u0131 ba\u015far\u0131s\u0131zl\u0131\u011f\u0131n
  tekrarlanmas\u0131n\u0131 istemiyordular. Bu sorun misyonerlerin daha farkl\u0131
  y\u00f6ntemler geli\u015ftirmesine neden oldu. Osmanl\u0131 Devleti\u2019nin \u00f6zellikle
  Anadolu\u2019da e\u011fitim ve sa\u011fl\u0131k alan\u0131ndaki yetersizlikleri
  misyonerlerin dikkatinden ka\u00e7mad\u0131\\\\(^{21}\\\\). \u00d6yleyse Ermenilerin
  kalbine gidecek olan yol e\u011fitimden ge\u00e7ecekti. Ayr\u0131ca misyonerlerin
  en \u00f6nemli ukdelerinden biri olan M\u00fcsl\u00fcmanlar\u0131n Protestanla\u015ft\u0131r\u0131lmas\u0131
  yine M\u00fcsl\u00fcmanlar\u0131n da b\u00fcy\u00fck ihtiya\u00e7 hissett\u011fi
  sa\u011fl\u0131k ve e\u011fitim hizmetleri ile ger\u00e7ekle\u015febilecekti\\\\(^{22}\\\\).
  ABD ile Osmanl\u0131 Devleti aras\u0131nda ger\u00e7ekle\u015fen ticaretin her ge\u00e7en
  g\u00fcn artmas\u0131, imzalanan *Seyr-\u00fc Sefain* anla\u015fmas\u0131 ile ABD\u2019nin
  ele ge\u00e7irmi\u015f oldu\u011fu kapitulasyonlar misyonerlere ihtiya\u00e7lar\u0131
  oldu\u011fu her seye ula\u015fma imk\u00e2n\u0131 tan\u0131yordu\\\\(^{23}\\\\).
  Ayr\u0131ca ABD\u2019nin gizlide olsa misyonerlere vermi\u015f oldu\u011fu destek
  ve ayr\u0131nt\u0131s\u0131 \u00fczerinde daha sonra duraca\u011f\u0131m\u0131z
  Anadolu\u2019nun bir\u00e7ok vilayetinde a\u00e7\u0131lacak konsolosluklar Amerikan
  Board \u00f6rg\u00fct\u00fcn\u00fcn d\u00fcnya genelinde en fazla yat\u0131r\u0131m
  yapt\u0131\u011f\u0131 ve en fazla misyoner g\u00f6nderdi\u011fi misyonun T\u00fcrkiye
  Misyonu olmas\u0131n\u0131 sa\u011flayacakt\u0131\\\\(^{24}\\\\).\\n\\nOsmanl\u0131
  topraklar\u0131nda *misyon*, *istasyon* ve \u00fc\u00e7 *istasyon* \u015femas\u0131
  \u00e7er\u00e7evesinde \u00f6rg\u00fctlenme yoluna giden Amerikan misyonerleri,
  1869 y\u0131l\u0131na gelindi\u011finde di\u011fer misyon b\u00f6lgelerini kapatarak
  Anadolu\u2019da *Bat\u0131 T\u00fcrkiye Misyonu*, *Merkezi T\u00fcrkiye Misyon*
  ve *Do\u011fu T\u00fcrkiye Misyonu* olmak \u00fczere \u00fc\u00e7 misyon b\u00f6lgesi
  olu\u015fturdu\\\\(^{25}\\\\). E\u011fitim, sa\u011fl\u0131k, yetimhane ve Bas\u0131m-
  Yay\u0131n d\u00f6rtgeninde bu misyon alanlar\u0131nda Kolejler, \u0130lahiyat okullar\u0131,
  ilk ve orta okullar, ana okullar\u0131, k\u00f6rl\u00fck okulu, Sa\u011f\u0131rlar
  okulu, Hastaneler, klinikler ve yetimhaneler ve birer matbaaya sahip bas\u0131m
  evleri gibi tesisler v\u00fccuda getirdiler\\\\(^{26}\\\\). Misyonerlik y\u00f6ntemlerine
  yeni anlay\u0131\u015flar kazand\u0131ran Amerikan misyonerleri okullarda vermi\u015f
  oldu\u011fu dini karakterli e\u011fitim ile uzun vadede hedeflemi\u015f oldu\u011fu
  toplumu meydana getirmeyi art\u0131k ufukta\\n\\n---\\n\\n\\\\(^{20}\\\\) \u0130lknur
  Polat Haydaro\u011flu, *Osmanl\u0131 \u0130mparatorlu\u011fu\u2019nda Yabanc\u0131
  Okullar*, T\u00fcrkler Ansiklopedisi, Yeni T\u00fcrkiye Yay\u0131nlar\u0131, Cilt:
  14, Ed. Hasan Celal G\u00fczel, Ankara, 2002, s.182-185.\\n\\n\\\\(^{21}\\\\) Uygur
  Kocabaso\u011flu, a.g.e., s.40-41.\\n\\n\\\\(^{22}\\\\) \u015eamil Mutlu, *Osmanl\u0131
  Devleti\u2019nde Misyoner Okullar\u0131*, G\u00f6kkube Yay\u0131nlar\u0131, \u0130stanbul,
  2005, s.285-286.\\n\\n\\\\(^{23}\\\\) Nurdan \u015eafak, *Osmanl\u0131 Amerikan
  \u0130li\u015fkileri*, Osmanl\u0131 Ara\u015ft\u0131rmalar\u0131 Vakf\u0131 Yay\u0131nlar\u0131,
  \u0130stanbul 2003, s.119-133, Uygur Kocabaso\u011flu, a.g.e., s.10. , \u00c7a\u011fr\u0131
  Erhan, *T\u00fcrk Amerikan \u0130li\u015fkilerinin Tarihsel K\u00f6kenleri*, \u0130mge
  Kitapevi, Ankara 2001, s.72.\\n\\n\\\\(^{24}\\\\) Uygur Kocabaso\u011flu, a.g.e.,
  s.15-17.\\n\\n\\\\(^{25}\\\\) \u0130lber Ortayl\u0131, *Osmanl\u0131\u2019daki Milletler
  ve Diplomasi*, T\u00fcrkiye \u0130\u015f Bankas\u0131 K\u00fclt\u00fcr Yay\u0131nlar\u0131,
  Ed. Ali Berktay, \u0130stanbul, 2008, s.75.\\n\\n\\\\(^{26}\\\\) S\u00fcleyman Kocabas,
  *T\u00fcrkiye\u2019de Gizli Tarih III Misyonerlik ve Misyonerler*, Vatan Yay\u0131nlar\u0131:
  29, \u0130stanbul, 2002, s.119\\n\\ng\u00f6rebiliyordu\\\\textsuperscript{27}. Din,
  E\u011fitim ve Milliyet\u00e7ilik kavramlar\u0131n\u0131n bir potada eritilerek
  haz\u0131rlanan okul m\u00fcfredatlar\u0131 ve bu m\u00fcfredatlar\u0131 doyuran
  bilgilerin ihtiva etti\u011fi kitaplar\u0131n hemen okullar\u0131n yan ba\u015f\u0131nda
  yer alan matbaalar taraf\u0131ndan istenilen say\u0131da \u00f6zg\u00fcrc\u00fc
  bas\u0131lmas\u0131 bu okullarda yeti\u015ftirilen gen\u00e7li\u011fin istenilen
  y\u00f6nde hareket ettilirmesini ve istenilen davran\u0131\u015f ve tutumlar\u0131n
  \u00f6\u011frenciler taraf\u0131ndan benimsenmesini sa\u011flam\u0131\u015ft\u0131r\\\\textsuperscript{28}.
  Beyrut\u2019taki Suriye Protestan Koleji, \u0130stanbul\u2019daki Robert Kolej ve
  Amerikan K\u0131z Koleji, \u0130zmir\u2019deki Uluslararas\u0131 Kolej, Merzifon\u2019daki
  Anadolu Koleji, Harput\u2019taki F\u0131rat Koleji, Antep\u2019teki Merkezi T\u00fcrkiye
  Koleji ve Van\u2019daki Amerikan Koleji, Osmanl\u0131 topraklar\u0131nda Millet
  sistemi i\u00e7erisinde ya\u015fayan ba\u015fta Ermeniler olmak \u00fczere Rumlar,
  S\u00fcryaniler, Araplar ve Bulgarlar aras\u0131nda a\u011f\u0131rl\u0131kl\u0131
  olarak e\u011fitim faaliyeti y\u00fcr\u00fct\u00fcp bu milletlerin gen\u00e7 insanlar\u0131n\u0131,
  atalar\u0131n\u0131n uzun y\u0131llar boyunca bar\u0131\u015f i\u00e7inde ya\u015fad\u0131\u011f\u0131
  imparatorluk topraklar\u0131na ihanet etmelerine sebep oldular\\\\textsuperscript{29}.
  Sa\u011fl\u0131k alan\u0131nda y\u00fcr\u00fct\u00fclen faaliyetler a\u00e7\u0131lan
  hastane, dispanser ve klinikler daha \u00e7ok M\u00fcsl\u00fcmanlara y\u00f6nelik
  misyonerlik \u00e7al\u0131\u015fmalar\u0131n\u0131n rahat\u00e7a yap\u0131lmasi
  i\u00e7in olup ayr\u0131ca bu topraklarda uzun s\u00fcre kalmak ve Osmanl\u0131
  Devleti\u2019nin bu y\u00f6ndeki takdirini kazanmak i\u00e7in yap\u0131lmaktayd\u0131\\\\textsuperscript{30}.
  Amerikan Board misyonerlerinin bir di\u011fer \u00f6nemli \u00e7al\u0131\u015fmas\u0131
  \u00f6zellikle do\u011fu ve g\u00fcneydo\u011fu Anadolu b\u00f6lgelerinde kurmu\u015f
  olduklar\u0131 yetimhanelerdir. Yetimhanelerin a\u00e7\u0131lmas\u0131 her ne kadar
  masum nedenler alt\u0131nda g\u00f6sterilmeye \u00e7al\u0131\u015f\u0131lsa da madalyonun
  bir de di\u011fer y\u00fcz\u00fc vard\u0131. Yetimhanelerin genellikle stratejik
  \u00f6neme sahip b\u00f6lgelerde a\u00e7\u0131lmas\u0131na dikkat edilmi\u015ftir\\\\textsuperscript{31}.
  Zaten yetimhanelerde bak\u0131lan \u00e7ocuklar alm\u0131\u015f olduklar\u0131 anaokulu
  e\u011fitimi ile birer Protestan yap\u0131lm\u0131yordu, bu durum Protestanl\u0131\u011fa
  insan kazand\u0131rmak i\u00e7in gelen misyonerlerin temel hedefiydi ve k\u00fc\u00e7\u00fck
  \u00e7ocuklar\u0131n bu t\u00fcr ortamlarda Protestanla\u015ft\u0131r\u0131lmas\u0131
  yeti\u015fkinlere g\u00f6re daha az bir maliyete mal oluyordu. Yetimhanelerin \u00e7o\u011funda
  Ermeni \u00e7ocuklar\u0131 hizmet alm\u0131\u015ft\u0131\\\\textsuperscript{32}.
  Anadolu\u2019da bir b\u00f6lge stratejik \u00f6neme sahipse misyon i\u00e7in gelecek
  vaat ediyorsa, hemen bu g\u00f6lge misyon merkezine ba\u011fl\u0131 bir u\u00e7
  istasyon\\n\\n\\\\textsuperscript{27} Ad\u00fclkad\u0131r Yuval\u0131, Ermeni \u0130syanlar\u0131nda
  Misyoner Okullar\u0131n Rol\u00fc, http://strateji.cukurova.edu.tr/ER-MENI/05.htm,
  Ula\u015f\u0131m: 24-Mar-12\\n\\n\\\\textsuperscript{28} B\u00fclent \u00c7ukurova,
