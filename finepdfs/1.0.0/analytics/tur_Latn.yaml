  |\\n\\nMASTERBATCH VE COMPOUND NED\u0130R?\\n\\nHayat\u0131m\u0131zda bir as\u0131rdan
  daha uzun bir s\u00fcredir plastik hayat\u0131m\u0131z\u0131n par\u00e7as\u0131.
  En gen\u00e7 malzemelerden biri olan plastikler \u00e7ok k\u0131sa s\u00fcrede hayat\u0131m\u0131z\u0131n
  b\u00fcy\u00fck par\u00e7as\u0131 olmay\u0131 ba\u015farm\u0131\u015ft\u0131r. Bu
  g\u00fcn \u00e7evremizde g\u00f6rd\u00fc\u011f\u00fcm\u00fcz her ekipmanda plastik
  malzeme bulunmaktad\u0131r. Evimizdeki mutfak e\u015fyalar\u0131m\u0131z, elektronik
  e\u015fyalar\u0131m\u0131z, kirtasiye malzemelerimiz, arabalar\u0131m\u0131z, bilgisayar\u0131m\u0131z,
  cep telefonumuz ve bunun gibi bir\u00e7ok alanda plastik hayat\u0131m\u0131z \u00e7ok
  b\u00fcy\u00fck bir par\u00e7as\u0131 art\u0131k. Bu kadar \u00e7ok alandan kullan\u0131lan
  plastiklerden beklentilerde kullan\u0131m yeri geni\u015fli\u011fine paralel olarak
  her ge\u00e7en g\u00fcn artmaktad\u0131r. Renkler, darbe dayan\u0131m\u0131, \u0131s\u0131
  dayan\u0131m\u0131, maliyet gibi fakt\u00f6rler plastikte \u00e7ok \u00f6nemli bir
  lanan geli\u015fmesine sebep oldu. Bu alan compound ve masterbatch \u00fcretimidir.\\n\\nCompound
  ve masterbatch ikiside m\u00fc\u015fterilerin bekleti\u015fi ve isteklerine g\u00f6re
  (Renkler, darbe dayan\u0131m\u0131, \u0131s\u0131 dayan\u0131m\u0131, maliyet) plastik
  gran\u00fcl\u00fcn i\u00e7in kat\u0131lan katk\u0131, renk, dolgular ile \u00e7ok
  \u00f6zel i\u015fleme makinelerinde i\u015flenerek plastik \u00fcreticilerinin kullanabilece\u011fi
  gran\u00fcl formunda \u00fcretilmesine denir. Bu katk\u0131lar\u0131n, renklerin,
  dolgular\u0131n plastik \u00fcreticileri taraf\u0131ndan direk prosese kat\u0131lmas\u0131
  m\u00fcmk\u00fcn m\u00fcd\u00fcr diye bir soru ak\u0131l\u0131m\u0131za gelebilir.
  M\u00fcmk\u00fcnd\u00fcr, ancak h\u0131z\u0131n, kalitenin, Standard \u00fcr\u00fcn\u00fcn
  \u00e7ok \u00f6nemli oldu\u011fu ve rekabet ko\u015fullar\u0131n\u0131n artt\u0131\u011f\u0131
  g\u00fcn\u00fcm\u00fcz de boyalar\u0131n, katk\u0131lar\u0131n, dolgular\u0131n
  direk proses kat\u0131lmas\u0131, makine temizli\u011finde uzun durma s\u00fcrelerine,
  makine ekipmanlar\u0131nda a\u015f\u0131nmalara ve istenilen kalitenin elde edilmemesi
  gibi sonu\u00e7lar do\u011furur.\\n\\nResim 1 de bir compound ve masterbatch firmas\u0131n\u0131n
  \u00e7al\u0131\u015fma diyagram\u0131n\u0131 inceledi\u011finizde bu i\u015fin ne
  kadar profesyonellik gerektiren zor bir proses oldu\u011funu anlayacaks\u0131n\u0131z.\\n\\nCOMPOUND
  VE MASTERBATCH ARASINDAK\u0130 FAKLAR\\n\\nCompound ve masterbatch \u00fcretim \u015fekilleri
  a\u00e7\u0131s\u0131ndan benzer olasalarda, kullan\u0131m \u015fekilleri y\u00f6n\u00fc
  ile birbilerinden ayr\u0131l\u0131rlar.\\n\\nCompound; Ana hammaddenin \u0131s\u0131
  dayan\u0131m\u0131, darbe dayan\u0131m\u0131, sertlik gibi fakt\u00f6rlerini i\u00e7ine
  \u00e7e\u015fitli katk\u0131lar katarak art\u0131rarak m\u00fc\u015fteriye istedi\u011fi
  \u00f6zellikte hammadde olu\u015fturulmas\u0131na compound denir. Compound sonras\u0131nda
  m\u00fc\u015fteriye g\u00f6nderilen hammadde art\u0131k saf bir malzeme de\u011fil,
  katk\u0131lar ile \u00f6zellikler g\u00fc\u00e7lendirilmi\u015f kompozit bir malzemedir.
  M\u00fc\u015fteri bu malzemeyi compound \u00fcreticisinden alarak hammadde olarak
  kullan\u0131r.\\n\\nMasterbatch; Ana hammaddenin renk, fiziksel \u00f6zellikler
  ve maliyet \u00f6zelliklerini geli\u015ftirilmek i\u00e7in i\u00e7ine pigment, katk\u0131lar
  ve dolgular kar\u0131\u015ft\u0131r\u0131larak m\u00fc\u015fteriye gran\u00fcl halde
  sunulur. Compound dan dan farkl\u0131 olarak m\u00fc\u015fteri bunu hammadde olarak
  kullanmaz, Hammaddesine belirli oranlarda kar\u0131\u015ft\u0131rarak onun rengini,
  maliyetini ve fiziksel eksikliklerini gidermeye \u00e7al\u0131\u015f\u0131r.\\n\\n\u015eEK\u0130L
  1: B\u0130R MASTERBATCH VE COMPOUND \u00dcRET\u0130M D\u0130YAGRAMI\\n\\nCOMPOUND
  VE MASTERBATCH PROSES\u0130NDE KULLANILAN KATKILAR\\n\\nPROSES VE D\u0130SPERS\u0130YON
  AJANLARI\\n\\nLIBAID T-2 (MULT\u0130 FONKS\u0130YONEL PROSES YARDIMCISI)\\n\\nLibaid
  T-2 \u00f6zellikle y\u00fcksek Dolgu (kalsit, talk, ATH) ve y\u00fcksek pigment
  y\u00fcklemeli masterbatch ve compoundlarda pigment ve dolgu malzemelerinin uniform
  bir \u015fekilde polimer matriksi i\u00e7erisinde da\u011f\u0131lmas\u0131n\u0131
  sa\u011flayan multi fonksiyonel proses ajan\u0131d\u0131r.\\n\\nLibaid T-2 \u00e7ok
  iyi bir ba\u011flay\u0131c\u0131d\u0131r. Bu y\u00fczden dolgu ile polimer sistemi
  aras\u0131nda iyi bir ba\u011flay\u0131c\u0131 olarak g\u00f6rev yapar. Compound
  yada masterbatch i\u00e7ine kat\u0131lan katk\u0131lar\u0131n homojen da\u011f\u0131l\u0131m\u0131n\u0131
  ve dolgular\u0131n ve pigmentlerin ana ta\u015f\u0131y\u0131c\u0131 polimere daha
  iyi ba\u011flanmas\u0131n\u0131 sa\u011flar.\\n\\nLIBWAX C \u2013 AM\u0130D WAX\\n\\nLibwax
  C y\u00fcksek s\u0131cakl\u0131k ile i\u015flenen, m\u00fchendislik plastiklerinde
  m\u00fckemmel bir kal\u0131p ay\u0131r\u0131c\u0131 ve dispersiyon sa\u011flay\u0131c\u0131d\u0131r.
  Geleneksel kullan\u0131lan kayd\u0131rc\u0131lardan \u00e7ok daha y\u00fcksek bir
  \u0131s\u0131 dayan\u0131m\u0131na sahiptir. Ayr\u0131ca geleneksel kayd\u0131rc\u0131lardan
  %50 kadar daha az kullan\u0131larak daha y\u00fcksek performans elde edilebilmektedir.
  Libwax C b\u00fct\u00fcn termoplastik ve termosetlerde hem i\u00e7 hemde d\u0131\u015f
  kayd\u0131rc\u0131 \u00f6zelli\u011fi g\u00f6sterir. Libwax C compound ve masterbatch
  proseslerinde sa\u011flad\u0131\u011f\u0131 avantajlar;\\n\\nABS ve Polisitiren
  Malzemelerde kullan\u0131m\u0131; ABS ve PS malzemenin ak\u0131\u015f karakteristi\u011fini
  art\u0131r\u0131r\\n\\nLibwax C Poliolefinlerde pigment dispersiyon sa\u011flay\u0131c\u0131
  olarak kullan\u0131labilir.\\n\\nPoliamidlerde Libwax C i\u00e7sel bir kal\u0131p
  ay\u0131r\u0131c\u0131 ajan olarak \u00e7al\u0131\u015f\u0131r.\\n\\nAcetal Plastikler
  de Libwax C kayd\u0131rc\u0131 olarak ve kal\u0131p ay\u0131r\u0131c\u0131 ajan
  olarak kullan\u0131l\u0131r.\\n\\nPoli\u00fcretanlar; Termoplastik PUR \u2018un
  enjeksiyon ile kal\u0131plamas\u0131nda Libwax C i\u00e7sel\\n\\nLIBNOL 101\\nTitanium
  dioksit ve di\u011fer inorganik pigment masterbatch uygulamalar\u0131nda \u00e7ok
  iyi \u0131slat\u0131c\u0131 ve dispersiyon ajans\u0131 olarak kullan\u0131l\u0131r.\\n\\nPE
  WAX \u2013 DISPERS\u0130YON AJANI:\\nPE wax d\u00fcnya \u00fczerinde en fazla kullan\u0131lan
  dispersiyon ajans\u0131 ve d\u0131\u015f kayd\u0131r\u0131c\u0131d\u0131r. Neredeyse
  b\u00fct\u00fcn compound ve masterbatch proseslerinin vazge\u00e7ilmez dispersiyon
  ajand\u0131r. Ancak burada malzeme safl\u0131\u011f\u0131 ve kalitesi etkilidir.
  Zirve polimer PE Wax 4 y\u0131ld\u0131r b\u00fcy\u00fck orandaki mastebatch ve compound
  \u00fcreticileri taraf\u0131ndan kalitesi onaylanm\u0131\u015f bir waxterdir.\\n\\n\u0130\u00c7
  VE D\u0130\u015e KAYDIRICILAR\\nMAGNEZYUM STEARAT\\nMagnezyum stearat do\u011fal
  bir magnezyum sabundur. PVC \u00fcretiminde baryum, kadmiyum, kalsiyum, kur\u015fun
  ve kalay stearatla birlikte kullan\u0131l\u0131ld\u0131\u011f\u0131nda \u00f6nemli
  bir \u0131s\u0131 stabilizat\u00f6r\u00fc g\u00f6revi g\u00f6r\u00fcr. ABS y\u00fczeyinde
  yap\u0131\u015fmay\u0131 \u00f6nlemeyi sa\u011flayan, m\u00fckemmel bir tozlama
  ajans\u0131d\u0131r. Kau\u00e7uk end\u00fcstrisinde yumu\u015fat\u0131c\u0131, vulkanize
  i\u015flemini h\u0131zland\u0131r\u0131c\u0131, kal\u0131plama i\u015flemini kolayla\u015ft\u0131r\u0131c\u0131,
  kavrulmay\u0131 \u00f6nleyici ajans\u0131 olarak kullan\u0131lmaktad\u0131r. Re\u00e7inelenmi\u015f
  kau\u00e7uklarda oksidasyon ve sertle\u015fitici ajans i\u015flevi g\u00f6rmekteydi.\\n\\n\u00c7INKO
  STEARAT \u2013 D\u0130\u015e KAYDIRICI\\nPlastik end\u00fcstrisinde PP, LLDPE, HDPE
  ve PS malzemelerde d\u0131\u015f kayd\u0131r\u0131c\u0131, asit temizleyici, kal\u0131p
  ay\u0131r\u0131c\u0131, proses ajans\u0131 olarak\\nKau\u00e7uk ta proses ajans\u0131
  kal\u0131p ay\u0131r\u0131c\u0131 olarak, sentetik ve polyester malzemelerde proses
  iyile\u015ftirici olarak, kullan\u0131l\u0131r.\\n\\nKALSIYUM STEARAT \u2013 \u0130\u00c7
  KAYDIRICI:\\nKalsiyum stearatlar plastik ve kau\u00e7uk end\u00fcstrisinde i\u00e7
  kayd\u0131r\u0131c\u0131 olarak kal\u0131p ay\u0131r\u0131c\u0131 ajans\u0131, asit
  temizleyici, elastomerlerde elastomer proses ajans\u0131, PVC boru, fitting, ve
  siding \u00fcretiminde ekstruder bas\u0131nc\u0131n\u0131 d\u00fc\u015f\u00fcrmec
  i\u00e7in proses ajans\u0131 olarak kullan\u0131l\u0131r.\\nBunun d\u0131\u015f\u0131nda
  kalsiyum stearatlar Poliolefinlerde i\u00e7kayd\u0131r\u0131c\u0131 g\u00f6revi
  g\u00f6rerek topaklanmay\u0131 engelleyici olarak kullan\u0131l\u0131r.\\n\\nLIBNOL
  G 4011 \u2013 SIVI \u0130\u00c7 KAYDIRICI\\nPA kal\u0131planmas\u0131 uygulamalar\u0131nda,
  M\u00fchendislik plastikleri, poliolefinler de, PET, SEBS, SBS de i\u00e7 kayd\u0131r\u0131c\u0131
  ve kal\u0131p ay\u0131r\u0131c\u0131 g\u00f6revi g\u00f6ren malzemenin ergiyik ak\u0131\u015f\u0131n\u0131
  h\u0131zland\u0131r\u0131r.\\nM\u00fchendislik plastiklerinde, poliolefinlerde,
  PET gibi malzemelerde ergime davran\u0131\u015f\u0131n\u0131 art\u0131rarak malzemenin
  erken renklenemas\u0131n\u0131 sa\u011flar. Malzeme dispersiyon ajans\u0131 \u00f6zelli\u011fi
  de verir.\\n\\nOLEAMID SLIP AJAN\\nLUTAMID P 98 y\u00fcksek safl\u0131\u011fa sahip
  oleamid\u2019dir. LUTAMID P 98 film katmanlar\u0131 aras\u0131nda ya da iki film
  aras\u0131nda s\u00fcrt\u00fcnme oran\u0131n\u0131 d\u00fc\u015f\u00fcrerek birbiri
  \u00fczerinden kaymas\u0131n\u0131 sa\u011flar\\nLUTAMID P 98 matbaa m\u00fcrekkeplerinde,
  kapak \u00fcretiminde, eva kopolimerlerde, kau\u00e7uk kompoundlarda, kaplamalarda
  kal\u0131p ay\u0131r\u0131c\u0131 ajans\u0131 olarak kullan\u0131lmaktad\u0131r.
  Finawax O malzemesine muadil bir \u00fcr\u00fcn\u00fcd\u00fcr.\\n\\nANTIOX\u0130DANTLAR\\nRICHFOS
  168\\nRICHFOS 168 bir \u00e7ok polimerik malzeme proses s\u0131ras\u0131nda olu\u015fan
  y\u00fcksek is\u0131larda malzemenin bozunmas\u0131n\u0131 engelleyerek \u0131s\u0131
  stabilizat\u00f6r\u00fc g\u00f6revi g\u00f6r\u00fcr. D\u00fc\u015f\u00fck u\u00e7uculuk
  oran\u0131 sayesinde i\u015flenen polimerin gerekli y\u00fcksek is\u0131larda ve
  zaman diliminde i\u015flenmesini sa\u011flar. RICHFOS 168 PP, PE, PC, ABS ve polyesterlerde
  kullan\u0131ma uygundur\\n\\nRICHNOX 1010\\n\\nRICHNOX 1010 uzun s\u00fcreli ya\u015flanmalarda
  s\u0131ras\u0131nda polimer bozulmalar\u0131na kar\u015f\u0131 \u00f6zellikle etkilidir.
  Ayn\u0131 zamanda, bir i\u015flem stabilize edici olarak \u00e7ok etkilidir. Termoplastik
  polimer i\u015flemlerile ile kar\u015f\u0131la\u015f\u0131lan y\u00fcksek s\u0131cakl\u0131klarda
  renk de\u011fi\u015fimine RICHNOX 1010 iyi bir diren\u00e7 sergiler. RICHNOX 1010
  d\u00fc\u015f\u00fck u\u00e7uculu\u011fa sa\u011flayan y\u00fcksek molek\u00fcl
  a\u011f\u0131rl\u0131kl\u0131 antioxidantd\u0131r.\\n\\nIrganox 1010 Muadili\\n\\nRICHNOX
  1076\\n\\nRICHNOX 1076 bir \u00e7ok polimerik proses ve son kullan\u0131mda olu\u015facak
  oxidative degradasyonunu etkili bir \u015fekilde \u00f6nler. RICHNOX 1076, poliolefinler,
  darbe dayan\u0131ml\u0131 stirenilker, block copolymerler, elastomerler, PVC ve
  Poli\u00fcretenlarda m\u00fckemmel bir Stabilizat\u00f6rd\u00fcr.\\n\\nIrganox 1076
  Muadili\\n\\nRICHNOX 1098\\n\\nRICHNOX 1098 uzun s\u00fcreli ya\u015flanmalarda
  s\u0131ras\u0131nda polimer bozulmalar\u0131na kar\u015f\u0131 stabilizasyon \u00f6zelli\u011fi
  sa\u011flayan fenolik antioksidand\u0131r. \u00d6zellikle PA compound, masterbatch,
  par\u00e7a \u00fcretimlerinde kar\u015f\u0131la\u015f\u0131lan y\u00fcksek s\u0131cakl\u0131klarda
  renk de\u011fi\u015fimine RICHNOX 1098 iyi bir diren\u00e7 sergiler.\\n\\nPolyacetals,
  polyesters, polyurethanes, adhesives, elastomers \u00fcr\u00fcnlerde de kullan\u0131labilmektedir.\\n\\nIrganox
  1098 Muadili\\n\\nRICHNOX MD 1024 METAL DEAKT\u0130V\u0130T\u00d6R\u00dc\\n\\nRichnox
  MD 1024, bir metal deaktivat\u00f6r ve primer (fenolik) antioksidand\u0131r. E\u015fsiz
  ekstraksiyon direnci ve i\u015flem stabilizasyonu sa\u011flar. Tel ve kablo plastikleri,
  dolgulu poliolefinler ve NBR yak\u0131t hortumlar\u0131 i\u00e7in kullan\u0131l\u0131r.
  Richnox MD 1024 ayr\u0131ca X-SBR, SBR, stiren homo ve kopolimerlerinde kullan\u0131l\u0131r.\\n\\nIrganox
  MD 1024 Muadili\\n\\nRICHNOX DLTDP\\n\\nBir birincil fenolik antioksidan ile birlikte
  kullan\u0131lan RICHNOX DLTDP, genel ama\u00e7l\u0131 \u0131s\u0131 stabilizasyonu
  sa\u011flar. Yayg\u0131n tiosynergistlerin en y\u00fcksek uyumlulu\u011fu ve en
  d\u00fc\u015f\u00fck erime noktas\u0131 ile nihai \u00fcrune en kolay \u015fekilde
  dahil edilir. Peroksit \u00e7apraz ba\u011fl\u0131 g\u00fc\u00e7 kablolar\u0131
  i\u00e7in en yayg\u0131n olarak Richnox 1035 ile birlikte kullan\u0131l\u0131r.\\n\\nUV
  STAB\u0130L\u0130ZAT\u00d6RLER\u0130\\n\\nHINDERED AMINE LIGHT STABILIZERS (HALS)\\n\\nRICHVIN
  622\\n\\nRichvin 622 uygulama alanlar\u0131 aras\u0131nda poliolefinler (PP, PE),
  EVA gibi olefin kopolimerleri ve ayr\u0131ca elastomerlerle polipropilen kar\u0131\u015f\u0131m\u0131lar\u0131,
  poliasetallerde, poliamidlerde ve poli\u00fcretan uygulamalar\u0131nda olduk\u00e7a
  etkilidir.\\n\\nRICHVIN 770\\n\\nRichvin 770, \u00f6zellikle y\u00fcksek \u0131\u015f\u0131k
  stabilitesi gerektiren uygulamalar i\u00e7in d\u00fc\u015f\u00fck molek\u00fcler
  a\u011f\u0131rl\u0131kl\u0131 engellemi\u015f bir amin \u0131\u015f\u0131k stabilizat\u00f6r\u00fcd\u00fcr
  (HALS). Kal\u0131n b\u00f6l\u00fcmler i\u00e7in m\u00fckemmel \u0131\u015f\u0131k
  stabilitesi sa\u011flar, ancak filmler ve bantlar gibi y\u00fcksek y\u00fczey alan\u0131na
  sahip \u00fcr\u00fcnler i\u00e7in de kullan\u0131labilir. Richvin 770\u2019in polipropilen,
  darbeli modifiye PP (TPO), EPDM, polistiren, darbeli polistiren, ABS, SAN, ASA,
  poli\u00fcretanlarda kullan\u0131lmas\u0131 tavsiye edilir ve poliamidlerde ve poliasetallerde
  de etkilidir.\\n\\nRICHVIN 944\\n\\nRichvin 944 uygulama alanlar\u0131 poliolefinleri
  (PP, PE), EVA gibi olefin kopolimerlerinin yan\u0131 s\u0131ra polipropilen ile
  elastomerlerin compoundlar\u0131n\u0131 da i\u00e7erir. Buna ek olarak baz\u0131
  durumlarda Richvin 944, pollaketaller, poliamidler, poli\u00fcretanlar, esnek ve
  sert PVC de, ayr\u0131ca PVC kar\u0131\u015f\u0131mlar\u0131nda ve belirli stirenik
  elastomer ve yap\u0131\u015fkan \u00f6zel uygulamalarda olduk\u00e7a etkilidir.\\n\\nRichvin
  944, ince malzemeler, \u00f6zellikle elyaf ve filmlere m\u00fckemmel \u0131\u015f\u0131k
  stabilitesi kazand\u0131r\u0131r. Kal\u0131n kesitlerde polietilen e\u015fyalar
  i\u00e7in \u00f6zel olarak uygundur.\\n\\n**UV ABSORBERLER**\\n\\n**RICHVIN 234**\\n\\nRICHVIN
  234, hidroksifenil benzotriazol s\u0131n\u0131f\u0131n\u0131n y\u00fcksek molek\u00fcler
  a\u011f\u0131rl\u0131kl\u0131 ultraviyole \u0131\u015f\u0131k emicidir (UVA) ve
  \u00e7e\u015fitli polimerlere m\u00fckemmel \u0131\u015f\u0131k stabilitesi kazand\u0131r\u0131r.
  RICHVIN 234, y\u00fcksek s\u0131cakl\u0131kta polikarbonatlar, polialkilen tereftalatlar,
  poliaseteller, poliamiler, polifenilen s\u00fcfit, polifenilen oksit, aromatik kopolimerler,
  termoplastik poli\u00fcretan ve poli\u00fcretan elyaflar gibi i\u015flenen polimerler
  i\u00e7in olduk\u00e7a etkilidir. Uygulamalar, kal\u0131planm\u0131\u015f \u00fcr\u00fcnler,
  filmleri, tabakalar\u0131 ve elyaflar\u0131 i\u00e7erir.\\n\\n**RICHVIN 326**\\n\\nRICHVIN
  326, Ultraviyole radyasyona kar\u015f\u0131 koruma sa\u011flayan benzotriazol ailesine
  ait bir stabilizat\u00f6rd\u00fcr. Richvin 326 Poliolefin ve k\u00fcrle\u015ftilmi\u015f
  polyesterlerde kullan\u0131labilen UV Absorber''dir. Richvin 326 y\u00fcksek s\u0131cakl\u0131klarda
  d\u00fc\u015f\u00fck u\u00e7uculuk ve termal bozulmaya kar\u015f\u0131 y\u00fcksek
  diren\u00e7 sa\u011flar. Bu nedenle PVC, poliolefin, compound, polyester kaplama
  i\u015flemlerinde \u00f6nemli bir kay\u0131p veya bozulma olmadan kullan\u0131labilir.\\n\\n**RICHVIN
  329**\\n\\nRICHVIN 329, d\u00fc\u015f\u00fck u\u00e7uculu\u011fu ile UV emici, y\u00fcksek
  etkili \u0131\u015f\u0131k stabilizat\u00f6r\u00fcd\u00fcr. Polistiren, polyester,
  sert PVC, PC, ABS re\u00e7ine vb. Malzemelerde kullan\u0131l\u0131r. Y\u00fcksek
  s\u0131cakl\u0131kta i\u015flenmi\u015f plastik ve m\u00fchendislik \u015feffaf
  \u00fcr\u00fcnler i\u00e7in olduk\u00e7a yeteneklidir. RICHVIN 329, HALS RICHVIN
  770 ve 944 ile kullan\u0131ld\u0131\u011f\u0131nda da iyi kombinasyon \u00f6zelli\u011fi
  g\u00f6sterir. %0,2 -%1 aras\u0131 kullan\u0131m tavsiye edilmektedir.\\n\\n**RICHVIN
  P**\\n\\nRichvin P g\u00fcne\u015fin UV I\u015f\u0131nlar\u0131na kar\u015f\u0131
  geni\u015f \u00f6l\u00e7ekteki plastik malzemenize UV dayan\u0131m\u0131 sa\u011flar.
  Richvin P \u00c7ok g\u00fc\u00e7l\u00fc bir UV emici ve y\u00fcksek \u00f6zellikte
  photo stabilite sa\u011flar. Richvin P ABS, Polyester, PS, PU, PVC, Elastomers ve
  polyesterlerde kullan\u0131ma uygundur.\\n\\n**ANT\u0130STAT\u0130K AJANLAR**\\n\\n**LIBSTAT
  95 GMS ANT\u0130STAT\u0130K AJAN**\\n\\nLibstat 95 yeni nesil, y\u00fcksek aktiviteli
  nitrojen i\u00e7ermeyen GMS i\u00e7erikli Antistatik ajan ve lubrikantt\u0131r.
  \u00d6zellikle geni\u015f \u00e7e\u015fit yap\u0131s\u0131na sahip olan termoplastiklerden
  polipropilen, polietilen, PVC gibi malzemeler de statik elektrik kontrol\u00fcnde
  uygundur. Yap\u0131s\u0131 bak\u0131m\u0131ndan bitkisel \u00fcr\u00fcnlerden yap\u0131ld\u0131\u011f\u0131ndan
  gida uygulamalar\u0131nda kullan\u0131ma uygundur.\\n\\n**OPT\u0130K BEYAZLATICILAR**\\n\\n**ZIRTEX
  OB-1**\\n\\nPolyester fiber, nylon fiber, PP fiber beyazlatma uygulamalar\u0131nda
  uygundur. Sert PVC, ABS, EVA, PS, PC gibi plastik uygulamalarda kullan\u0131ma uygundur.
  Polyester ve Nylon polimerizasyonlar\u0131nda kullan\u0131ma uygundur. Su itici
  \u00f6zelli\u011fe sahiptir, suda \u00e7\u00f6z\u00fcnmez ancak ergime s\u0131cakl\u0131\u011f\u0131
  y\u00fcksek olan parafin, mineral ya\u011flar ve organik solventler de \u00e7\u00f6z\u00fcnebilir.
  \u00d6zellikle y\u00fcksek s\u0131cakl\u0131klarda i\u015flenen plastiklerin prosesin
  de kullan\u0131ma uygundur.\\n\\n**ZIRTEX OB**\\n\\nD\u00fc\u015f\u00fck kullan\u0131mda
  dahi y\u00fcksek beyazl\u0131k ile sonu\u00e7lan\u0131r. Polyoletin, PVC, polyamide,
  polya\u00e7rylonitrile di\u011fer plastiklerde de i\u015flemeye uygundur. Suda \u00e7\u00f6z\u00fcnmez,
  parafin de, mineral ya\u011flar ve organik solventlerde \u00e7\u00f6z\u00fcnebilir.\\n\\n**ALEV
  GEC\u0130KT\u0130R\u0130C\u0130LER**\\n\\n**ANTIMONI TRIOKSID**\\n\\nAntimoni trioxide
  halojenli bile\u015fiklerle birlikte kimyasal bir bile\u015fim olu\u015fturur buda
  a\u015fa\u011f\u0131daki i\u015flemler ile birlikte alev geciktirici \u00f6zellik
  meydana getirir. A\u015fa\u011f\u0131da EVA Elektrik Par\u00e7alar\u0131, LDPE Elektrik
  Pargalar\u0131, EVA Elektrik Kablo Yal\u0131t\u0131m\u0131, PP Elektrikli Par\u00e7alar,
  ULDPE Kablo K\u0131l\u0131f\u0131, Polyamidler de alev geciktirici olarak kullan\u0131l\u0131r.\\n\\n\u00c7INKO
  BORAT\\n\\n\u00c7inko boratlar, alev geciktirici, duman bast\u0131r\u0131c\u0131,
  korozyon geciktirici olarak polimerler de ve kaplamalarda, \u00f6zellikle PVC, halojenli
  polyester ve naylonlarda kullan\u0131l\u0131r. Y\u00fcksek dehidrasyon s\u0131cakl\u0131\u011f\u0131na
  (290 \u2013 300 \u00b0C gibi) sahip oldu\u011fu i\u00e7in y\u00fcksek s\u0131cakl\u0131kla
  radyan\u0131kl\u0131 plastik malzemelerin imalat\u0131nda kullan\u0131l\u0131r.
  \u00c7inko boratlar, kablolarda, yanmaya dayan\u0131kl\u0131 boyalarda, kuma\u015flarda,
  elektrik / elektronik par\u00e7alarda, otomobil/u\u00e7ak i\u00e7 aksamlar\u0131nda,
  tekstil ve ka\u011f\u0131t end\u00fcstrisinde kullan\u0131m alan\u0131na sahiptir.\\n\\nDECABROMODIPHENYL
  ETHANE (FR 1410 MUAD\u0130L\u0130)\\n\\nY\u00fcksek brom, \u00e7ok iyi is\u0131l
  stabilize, d\u00fc\u015f\u00fck toksite ve UV dayan\u0131m\u0131 sa\u011flamaktad\u0131r.
  Bu \u00f6zellikleri sayesinde m\u00fchendislik plastikleri, elastomerler ve thermoset
  plastiklerinde kullan\u0131l\u0131r.\\n\\nTETRABROMOBISPHENOLA,BIS(2,3-D\u0130BROMOPROPYL
  ETHER) (FR 720 MUAD\u0130L\u0130)\\n\\nYanma geciktirici olan Tetrabromobisphenola,Bis(2,3-dibromopropyl
  ether) y\u00fcksek brom, \u00e7ok iyi is\u0131l stabilize, d\u00fc\u015f\u00fck
  toksite ve UV dayan\u0131m\u0131 sa\u011flamaktad\u0131r. Bu \u00f6zellikleri sayesinde
  m\u00fchendislik plastikleri, \u00f6zellikle polipropilen hammaddesinde kullan\u0131l\u0131r.\\n\\nNEM
  ALICI AJANLAR\\n\\nZENA 10\\n\\nCompound prosesinin en \u00f6nemli problemlerinden
  biri nem olay\u0131d\u0131r. Hem compound hem de compound sonras\u0131nda son \u00fcr\u00fcn
  \u00fcreticilerinde etkisini g\u00f6stererek hem prosesi zorla\u015ft\u0131rm\u0131r
  hemde mekaniksel \u00f6zelliklerinde zay\u0131fl\u0131\u011f\u0131na sebep olurlar.\\n\\nPIGMENTLER\\n\\nRUT\u0130L
  T\u0130TAN\\n\\nOrganik yap\u0131s\u0131 y\u00fczey i\u015flemleriyle silikon ve
  zirkon maddelerle zenginle\u015ftirilmi\u015f, kararl\u0131 bir kimyasal yap\u0131ya
  sahip \u00fcr\u00fcn\u00fcd\u00fcr. Beyazl\u0131\u011f\u0131, parlakl\u0131\u011f\u0131,
  \u00f6rt\u00fcc\u00fclu\u011fu ve ezimi m\u00fckemmel olan, hava ko\u015fullar\u0131na,
  tebesirlenme gibi etkenlere kar\u015f\u0131 \u00e7ok iyi dayan\u0131m g\u00f6steren
  ve etki veren bir \u00fcr\u00fcn\u00fcd\u00fcr. Suda \u00e7\u00f6z\u00fcn\u00fcr.\\n\\nULTRAMARINE
  BLUE\\n\\nUltramarine Blue, Sentetik \u0130norganiktir. S\u00fcl\u00fcr i\u00e7eren
  mavi sodyum al\u00fcminosilikat pigmentidir. Kaolin, sodyum karbonat, k\u00fck\u00fcrt
  ve di\u011fer pahal\u0131 olmayan bile\u015fenlerin bir arada \u0131s\u0131t\u0131lmas\u0131yla
  haz\u0131rlan\u0131r. Isiya ve alkailere kar\u015f\u0131 dayan\u0131kl\u0131d\u0131r.
  Plastik, kau\u00e7uk, m\u00fcrekkep, boya, kozmetik, deterjan, \u00e7imento, tekstil
  ve ka\u011f\u0131tta optik beyazl\u0131kta kullan\u0131l\u0131r.\\n\\n| POL\u0130MER  |
