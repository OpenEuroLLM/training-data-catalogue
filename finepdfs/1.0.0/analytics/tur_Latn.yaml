  ili\u015fkin bir tavsiye olarak da kabul edilemez. Ayr\u0131ca halka arz edilecek
  paylar\u0131n fiyat\u0131n\u0131n belirlenmesinde Kurul\u2019un herhangi bir takdir
  ya da onay yetkisi yoktur.\\n\\nOrtakl\u0131\u011f\u0131m\u0131z\u0131n \u00e7\u0131kar\u0131lm\u0131\u015f/\u00f6denmi\u015f
  sermayesinin 60.000.000 TL\u2019den 105.000.000 TL\u2019ye \u00e7\u0131kar\u0131lmas\u0131
