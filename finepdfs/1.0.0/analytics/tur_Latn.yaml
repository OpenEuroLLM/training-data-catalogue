  Masa \u00fczerinde her \u00f6\u011frenci i\u00e7in bir adet \u00e7ekmece olmal\u0131d\u0131r.\\n20.
  Masan\u0131n ayaklar\u0131 ayarlanabilir vidal\u0131 olmal\u0131, yere basan k\u0131s\u0131mlar\u0131
  plastik olmal\u0131d\u0131r.\\n21. Her \u00f6\u011frenci i\u00e7in bir adet s\u0131rtl\u0131kl\u0131,
  amortis\u00f6rl\u00fc ve tekerlekli tabure verilmelidir. Bu taburelerin rengi kurum
