  Ula\u015f\u0131m: 31-Mar-12,\\n\\n\\\\(^{36}\\\\) \u0130hsan \u015eerif Kaymaz,
  Wilson Prensipleri ve Liberal Emperyalizm, Atat\u00fcrk Ara\u015ft\u0131rma Merkezi
  Dergisi, Say\u0131 67-68-69, Cilt: XXIII, Mart-Temmuz-Kas\u0131m 2007, \u0130nternet
  \u00c7\u0131kt\u0131s\u0131, s.11-13.\\n\\n\\\\(^{37}\\\\) Mehmet \u00c7elik, Osmanl\u0131\u2019da
  Misyoner Kiliseler Nas\u0131l ve Neden Kuruldu, http://www.tbbd.org/index.php?option=com_content&view=article&id=153%3Aosmanlida-misyoner-kiliseler&catid=36&Itemid=48
  Ula\u015f\u0131m: 31.03.2012\\n\\n\\\\(^{38}\\\\) Mehmet \u00c7elik, a.g.m., Ula\u015f\u0131m:
  31.03.2012\\n\\nkilisesi korku arac\u0131 olarak kulland\u0131\u011f\u0131 bu cezay\u0131,
  kendi kiliselerini hedef alan misyoner \u00f6rg\u00fctlerle ilgi duyan, onlara yard\u0131m
  eden ve onlar\u0131n yaymaya \u00e7al\u0131\u015ft\u0131\u011f\u0131 mezhebi kabul
  eden Ermeniler \u00fczerine uygulayarak veya uygulama tehdidine bulunarak kilisenin
  sahip oldu\u011fu cemaatinin par\u00e7alanmas\u0131n\u0131 engellemeye \u00e7al\u0131\u015fm\u0131\u015ft\u0131\\\\textsuperscript{39}.
  B\u00f6ylelikle Osmanl\u0131 \u0130mparatorlu\u011fu\u2019nda Katolik Ermeni Milleti
  gibi Protestan Ermeni Milleti\u2019nin resmen tan\u0131nmas\u0131 ve bu millet i\u00e7in
  devlet nezdinde ayr\u0131 bir defter a\u00e7\u0131lmas\u0131na kadar Amerikan Board
  misyonerleri rahat bir \u00e7al\u0131\u015fma ortam\u0131 bulmam\u0131\u015f \u00fcstelik
  Ermeni kilisesinin arkas\u0131nda duran ve destek veren Rusya\u2019n\u0131n devaml\u0131
  tacizlerine maruz kalm\u0131\u015ft\u0131r\\\\textsuperscript{40}. 1850 y\u0131l\u0131nda
  haz\u0131rlanan ferman ile Protestan Ermeniler ayr\u0131 bir millet olarak Osmanl\u0131
  Devleti taraf\u0131ndan tan\u0131t\u0131ld\u0131. Bu ferman sayesinde Amerikan Board
  yar\u0131lma alan\u0131n\u0131 Ermenilerin ya\u015fam merkezleri paralelliginde
  geni\u015fletmeye ba\u015flayarak Osmanl\u0131 Devleti\u2019nin di\u011fer Hristiyan
  milletleri aras\u0131nda s\u00fcrd\u00fcrmekte oldu\u011fu misyon alanlar\u0131n\u0131
  kapat\u0131p Ermeni milleti \u00fczerinde yo\u011funla\u015fmaya ba\u015flad\u0131\\\\textsuperscript{41}.
  Bu s\u00fcre\u00e7 zarf\u0131nda Ermeni kilisesinin kopmalar ve Anadolu\u2019daki
  Protestan Ermenilerin say\u0131s\u0131nda h\u0131zl\u0131 bir art\u0131\u015f ya\u015fanmaya
  ba\u015flad\u0131\\\\textsuperscript{42}. Antep, imparatorlu\u011fun en fazla Protestan
  n\u00fcfusuna sahip olan bir \u015fehir haline geldi\\\\textsuperscript{43}. Bu
  do\u011frultuda Ermeni Kilisesi ise kendisine \u00e7ekti d\u00fczen verme \u00e7al\u0131\u015fmas\u0131
  i\u00e7ine girerek, okul, yetimhane gibi konularda yenilenmeye giderek, kilise ile
  Amiralar aras\u0131ndaki rekabetten az zararl\u0131 \u00e7\u0131kma yolunu aramaya
  ba\u015flad\u0131.\\n\\nAmerikan Board misyonerler, Ermeni isyanlar\u0131ndaki rollerini
  a\u00e7m\u0131\u015f olduklar\u0131 okullarda art\u0131k daha iyi sahneye koymaya
  ba\u015flam\u0131\u015flard\u0131r. Verilen e\u011fitim kapsamunda milliyet\u00e7i
  duygular\u0131n, bat\u0131 hayranl\u0131\u011f\u0131n\u0131n, Protestan ahlak\u0131n\u0131n,
  Ermenicenin yeniden do\u011fu\u015funu sa\u011flayacak s\u00fcrecin ve Amerika\u2019ya
  ilgi duyacak bir neslin haz\u0131rlanmas\u0131nda \u00f6nemli bir etken olan ders
  m\u00fbfredatlar\u0131n\u0131n haz\u0131rlanmas\u0131 ve bu m\u00fbfredat do\u011frultusunda
  e\u011fitim kitaplar\u0131 \u00e7\u00f6ktan bas\u0131lm\u0131\u015f, Ermeni gen\u00e7lerin
  \u00f6n\u00fcne konmu\u015ftu\\\\textsuperscript{44}. Burada belirtilmesi gereken
  bir di\u011fer \u00f6nemli husus Anadolu\u2019nun bir\u00e7ok vilayetinde a\u00e7\u0131lan
  Amerikan konsolosluklar\u0131d\u0131r.\\n\\n\\\\textsuperscript{39} \u00d6mer Turan,
  Amerikan Misyonerlerine Ermeni Patrikhanesinin Tepkisi, Hosg\u00f6r\u00fcden Yol
  Ayr\u0131m\u0131na Ermeniler, (Ed: Metin H\u00fclag\u00fc, \u015eakir Batmaz, G\u00fclbad\u0131
  Alan), EUSAS II, Cilt: 3, Kayseri 2008, s.421.\\n\\n\\\\textsuperscript{40} \u0130ber
  Ortayl\u0131, \\\\textit{a.g.e.}, s.73.\\n\\n\\\\textsuperscript{41} Mehmet Alparslan
  K\u00fc\u00e7\u00fck, Anadolu\u2019da \u201cProtestan Ermeni Milleti\u201dnin Olu\u015fumu,
  Ankara \u00dcniversitesi \u0130lahiyat Fak\u00fcltesi Dergisi, 502, Ankara 2009,
  s.176-179.\\n\\n\\\\textsuperscript{42} Mehmet Alparslan K\u00fc\u00e7\u00fck, \\\\textit{a.g.m},
  s.178.\\n\\n\\\\textsuperscript{43} Ramazan Erhan G\u00fcll\u00fc, Antep Ermenileri
  (Sosyal, Siyasi ve K\u00fclt\u00fcrel Hayat\u0131), IQ K\u00fclt\u00fcr Sanat Yay\u0131nc\u0131l\u0131k,
  \u0130stanbul 2010, s.89-91.\\n\\n\\\\textsuperscript{44} Uygur Kocabaso\u011flu,
  \\\\textit{a.g.e.}, s.142-149.\\n\\n\u0130stanbul, \u0130zmir gibi, baz\u0131 liman
  \u015fehirlerinde a\u00e7\u0131lm\u0131\u015f olan konsolosluklar hari\u00e7inde,
  Anadolu\u2019nun i\u00e7 k\u0131s\u0131mlar\u0131nda a\u00e7\u0131lm\u0131\u015f
  olan b\u00fct\u00fcn konsolosluklar Ermeniler ve misyonerlere yard\u0131m i\u00e7in
  a\u00e7\u0131lm\u0131\u015ft\u0131. Amerikal\u0131lar\u0131n, Anadolu\u2019nun i\u00e7
  k\u0131s\u0131mlar\u0131nda a\u00e7m\u0131\u015f oldu\u011fu ilk konsolosluk, Sivas
  Konsoloslu\u011fu\u2019dur. Bu konsolosluk vas\u0131tas\u0131yla Anadolu\u2019nun
  i\u00e7 k\u0131s\u0131mlar\u0131ndaki Amerikan vatanda\u015flar\u0131n\u0131n problemleri
  ile ilgilenilmeye \u00e7al\u0131\u015f\u0131lm\u0131\u015fsa da, daha sonraki y\u0131llarda
  misyonerlerin de \u0131srarl\u0131 istekleri sonucu, Erzurum ve Harput\u2019a da
  birer Amerikan Konsoloslu\u011fu a\u00e7\u0131lmas\u0131 i\u00e7in giri\u015fimler
  yap\u0131lm\u0131\u015ft\u0131r\\\\(^{45}\\\\). \u00d6zellikle Harput\u2019ta, 1890\u2019lardan
  itibaren bir Amerikan Konsoloslu\u011fu\u2019nun a\u00e7\u0131lmas\u0131 konusunda,
  Board misyonerleri olduk\u00e7a \u0131srarl\u0131 davranm\u0131\u015flard\u0131r.
  Daha sonra \u00e7evrede olaylar\u0131n patlak verisi, Ermenilerin yo\u011fun bir
  \u015fekilde Amerika\u2019ya g\u00f6\u00e7 etmeye ba\u015flamas\u0131 ve misyonerlerin
  vermi\u015f oldu\u011fu raporlar do\u011frultusunda bu istekler ABD yetkililerince
  de uygun g\u00f6r\u00fclm\u00fc\u015ft\u00fc. Bundan sonra, Amerikan H\u00fck\u00fcmeti\u2019nin
  Osmanl\u0131 Devleti\u2019nde konsolosluk a\u00e7mak i\u00e7in yapt\u0131\u011f\u0131
  bask\u0131lar da artm\u0131\u015ft\u0131. Amerikal\u0131 misyonerler, hem koruduklar\u0131
  Ermenileri, hem de kendi g\u00fcvenliklerini ve yerli yard\u0131mc\u0131lar\u0131n\u0131
  garanti alt\u0131na almak i\u00e7in adeta bask\u0131 olu\u015fturmu\u015flard\u0131r.
  \u00d6yle ki bu konu Amerikan senatosuna kadar ula\u015facakt\u0131\\\\(^{46}\\\\).
  Misyonerler \u00e7evredeki olaylarla beraber \u00e7al\u0131\u015fanlar\u0131n\u0131n
  sald\u0131rya u\u011frad\u0131\u011f\u0131n\u0131, m\u00fcesseselerinin zarar g\u00f6rd\u00fc\u011f\u00fc
  gibi olaylar\u0131 anlatan mektup ve yaz\u0131lar\u0131 s\u00fcrekli olarak ABD\u2019ye
  g\u00f6ndermi\u015flerdi. B\u00f6ylelikle Amerikan Board misyonerleri devaml\u0131
  konsolosluk h\u0131mayesi istemelerini hakl\u0131 g\u00f6stermeye \u00e7al\u0131\u015fm\u0131\u015flard\u0131r\\\\(^{47}\\\\).
  Osmanl\u0131 Devleti, konsolosluk a\u00e7\u0131lmas\u0131na kar\u015f\u0131 olmaktan
  \u00e7ok, konsolosluklar\u0131n yapacaklar\u0131 faaliyetlerin do\u011furaca\u011f\u0131
  sakincalardan rahats\u0131z olmu\u015ftu. Konsolosluklar\u0131n a\u00e7\u0131lma
  gayeleri olan ticaret ve benzeri i\u015fleri y\u00fcr\u00fctmekten \u00e7ok bunun
  \u00f6tesinde devlet i\u00e7in zarar do\u011furacak ve devletleraras\u0131 hukukta
  belirlenmi\u015f olan kurallara uymayarak g\u00f6revleri haricinde baz\u0131 i\u015flerle
  ilgilenmelerinden korktu\u011fu i\u00e7indi. Osmanl\u0131 Devleti bu korkusunda
  da hakl\u0131 idi\\\\(^{48}\\\\). Anadolu\u2019nun belli ba\u015fl\u0131 yerlerinde
  a\u00e7\u0131lan ve ileride a\u00e7\u0131lmas\u0131 planlanan konsolosluklar, ilk
  a\u015famada kendilerine Osmanl\u0131 topraklar\u0131nda rakip olan Rusya\u2019n\u0131n
  Anadolu\u2019ya s\u0131zmas\u0131n\u0131 ve misyonerlik faaliyetlerinde bulunmas\u0131n\u0131
  engellemek i\u00e7in \u00f6nlerine bir bent \u00e7ekmeye \u00e7al\u0131\u015farak
  Merzifon, Sivas, Har-\\n\\n---\\n\\n\\\\(^{45}\\\\) Erdal A\u00e7\u0131kses, Amerikal\u0131lar\u0131n
  Harput\u2019taki Misyonerlik Faaliyetleri, T\u00fcrk Tarih Kurumu Yay\u0131nlar\u0131,
  Ankara 2003, s. 181-183.\\n\\n\\\\(^{46}\\\\) \u015eenol Kantarc\u0131, Amerika
  Birle\u015fik Devletleri\u2019nde Ermeniler ve Ermeni Lobisi, Akt\u00fcel Yay\u0131nlar\u0131,
  \u0130stanbul 2004, s. 138.\\n\\n\\\\(^{47}\\\\) Latif Din\u00e7arslan, Zeytun\u2019da
  Misyoner Faaliyetleri, Hosg\u00f6r\u00fcnden Yol Ay\u0131r\u0131na Ermeniler, (Ed:
  Metin H\u00fclag\u00fc, \u015eakir Batmaz, G\u00fclbad\u0131 Alan), EUSAS II, Cilt:
  3, Kayseri 2008, s.13-15.\\n\\n\\\\(^{48}\\\\) B.O.A., Y.A., HUS, 328/60 (19.May\u0131s.1985)\\n\\nput,
  Erzurum, Bitlis ve Van vilayetlerinde a\u00e7\u0131lm\u0131\u015ft\u0131. Daha sonra
  bu konsolosluklar etki alanlar\u0131n\u0131 geni\u015fleterek bu b\u00f6lgede misyonerlerin
  rahat bir \u015fekilde hareket etmesini sa\u011flayarak Amerikan menfaatlerinin
  kar\u015f\u0131lanmas\u0131 yolunda ad\u0131m att\u0131lar\\\\textsuperscript{49}.\\n\\nAnadolu\u2019daki
  Amerikan Konsolosluklar\u0131n\u0131n di\u011fer bir \u00f6nemli g\u00f6revi ise
  Ermenilerin Amerika\u2019ya g\u00f6\u00e7\u00fcn\u00fc kolayla\u015ft\u0131rmak
  ve h\u0131zland\u0131rmakt\u0131\\\\textsuperscript{50}. Son d\u00f6nemlerde Osmanl\u0131
  topraklar\u0131nda ya\u015fanan ekonomik bunal\u0131mlar ve Amerika\u2019n\u0131n
  f\u0131rsatlar \u00fclkesi oldu\u011fu y\u00f6n\u00fcndeki s\u00f6ylentiler ve buna
  ek olarak misyoner okullar\u0131nda Ermeni gen\u00e7lerine verilen e\u011fitimle
  Amerika \u00f6zlemi \u00e7eken bir gen\u00e7 nesil yeti\u015ftirilmesi bu g\u00f6\u00e7\u00fcn
  \u00f6nemli nedenleri aras\u0131ndayd\u0131. Bu g\u00f6\u00e7 sayesinde Amerika\u2019da
  ilk olarak Fresno, Boston, Worcester gibi \u015fehirlerde Ermeniler bir topluluk
  olu\u015fturup kilise \u00e7evresinde \u00f6rg\u00fctlenip Anadolu\u2019da ba\u015flayan
  Ermeni ba\u011f\u0131ms\u0131zl\u0131k hareketine destek vermek amac\u0131yla Osmanl\u0131
  Devleti aleyhinde bir kamuoyu meydana getirmek i\u00e7in \u00e7al\u0131\u015fmaya
  ba\u015flam\u0131\u015ft\u0131r\\\\textsuperscript{51}.\\n\\nAmerika\u2019da Osmanl\u0131
  aleyhine olu\u015fturulan kamuoyunun olu\u015fumunda Osmanl\u0131 Devleti\u2019nden
  bihaber olan Amerikan vatanda\u015flar\u0131 da Ermeniler taraf\u0131ndan y\u00fcr\u00fct\u00fclmekte
  olan propaganda sayesinde kand\u0131r\u0131ld\u0131lar\\\\textsuperscript{52}. Anadolu\u2019daki
  Amerikan misyonerlerinin faaliyet y\u00fcr\u00fctt\u00fckleri sahadan g\u00f6ndermi\u015f
  olduklar\u0131 foto\u011fraflar, yaz\u0131ms\u0131 olduklar\u0131 mektuplar Amerika\u2019da
  kiliselerde Amerikan halk\u0131n\u0131 bu davaya inand\u0131r\u0131p onlardan maddi
  yard\u0131m edinmek i\u00e7in \u00e7ok kullan\u0131ld\u0131\\\\textsuperscript{53}.
  Bu s\u0131rada Anadolu\u2019da Ermeni isyanlar\u0131n\u0131n say\u0131s\u0131 art\u0131yor
  ve isyanlar\u0131n hakim oldu\u011fu alanlar geni\u015fliyordu. \u0130syanlar\u0131n
  bast\u0131r\u0131lmas\u0131 s\u0131ras\u0131nda yakalanan Ermenilerin birer Amerikan
  vatanda\u015f\u0131 oldu\u011fu sahip olduklar\u0131 pasaporttan anla\u015f\u0131lyordu.
  Tabiiyet de\u011fi\u015ftirip Amerika\u2019ya giden Ermenilerin \u00e7o\u011fu,
  \u00e7ifte vatanda\u015fl\u0131k istismarl\u0131\u011f\u0131ndan yararlanarak tekrar
  yurda d\u00f6n\u00fcp tek tek Ermeni k\u00f6ylerini gezerek bitaraf durmaka kararl\u0131
  olan Ermenileri harekete yard\u0131m etmeleri i\u00e7in ikna etmeye \u00e7al\u0131\u015ft\u0131lar\\\\textsuperscript{54}.
  Tabiiyet konusunu g\u00fcndeme alan Osmanl\u0131 Devleti, ABD h\u00fck\u00fcmetleri
  ile m\u00fczakereler ederek Ame-\\n\\n\\\\textsuperscript{49} Remzi K\u00fclc, Osmanl\u0131
  Devleti\u2019nde Amerikan Misyonerlerin Ermeni Okullar\u0131nda Ermeni Milliyet\u00e7ili\u011fine
  Etkileri, H\u00f6gskruden Yol Ayr\u0131m\u0131na Ermeniler, (Ed: Metin H\u00fclag\u00fc,
  \u015eakir Batmaz, G\u00fclbad\u0131 Alan), EUSAS II, Cilt: 4, Kayseri 2008, s.65.\\n\\n\\\\textsuperscript{50}
  Erdal A\u00e7\u0131kse, a.g.e., s.195\\n\\n\\\\textsuperscript{51} \u015eenol Kantarc\u0131,
  a.g.e., s.87-90.\\n\\n\\\\textsuperscript{52} Bilal \u015eimsir, Ermeni Propagandas\u0131n\u0131n
  Amerika Boyutu \u00dczerine, Tarih Boyunca T\u00fcrklerin Ermeni Toplumu ile \u0130li\u015fkileri
  (8-12 Ekim 1984 Erzurum), Ankara 1985, s. 90-94.\\n\\n\\\\textsuperscript{53} Bilal
  \u015eimsir, a.g.m., s.96-98.\\n\\n\\\\textsuperscript{54} B.O.A., HR. SYS. 2741/75
  (5.May\u0131s. 1897)\\n\\nrikan vatanda\u015flar\u0131n\u0131n Osmanl\u0131 topraklar\u0131nda
  ikametleri s\u0131ras\u0131nda Osmanl\u0131 kanunlar\u0131na tabii olmalar\u0131
  gerekli\u011fini bildirmeye gayret g\u00f6sterdi. Asl\u0131nda Osmanl\u0131 Devleti,
  Ermenilerin Amerika''ya g\u00f6\u00e7 etmesine kar\u015f\u0131 \u00e7\u0131km\u0131yor
  fakat tabiiyet de\u011fi\u015ftirip bu \u00fclkeye giden Ermenilerin orada olu\u015fan
  Ermeni fesat cemiyetlerinin eline d\u00fc\u015f\u00fcp bir Osmanl\u0131 aleyhtar\u0131
  olup tekrar yurda g\u00f6nderilip Ermeni milletini k\u0131sk\u0131rtmas\u0131ndan
  korkuyordu\\\\(^{55}\\\\). Protestan misyoner okullar\u0131 i\u015fte bu Amerika''dan
  milliyet\u00e7i fikir donan\u0131m\u0131na sahip olarak d\u00f6nen ki\u015filerin
  yuvas\u0131 olmaya ba\u015flam\u0131\u015ft\u0131. Siyasi propaganda, silah deposu,
  \u00f6rg\u00fctlenme, propaganda materyallerinin bas\u0131m evi ve isyan edecek
  Ermeni gen\u00e7leri hepsi bu okullarda mevcuttu art\u0131k. Bulgaristan \u00f6rne\u011fini
  benimseyerek, Berlin Antla\u015fmas\u0131n\u0131 61. maddesi neden g\u00f6stererek
  Bat\u0131l\u0131 devletlerin deste\u011fini arkalar\u0131n oldu\u011funu zan ederek
  Osmanl\u0131 Devleti''ne kar\u015f\u0131 isyan eden Ermeniler tarihin ac\u0131 y\u00fcz\u00fc
  olan ihanet ile \u00e7ok ge\u00e7meden y\u00fczle\u015fecekti.\\n\\n2. SASON ERME\u00d1\u0130
  \u0130SYANINA D\u0130N\u0130 M\u0130SYON KAZANDIRMA \u00c7ALI\u015eMALARI\\n\\n\u0130ngiltere,
  Fransa, Rusya ve ABD''de kurulan Ermeni komitelerinin yeg\u00e2ne amac\u0131 ba\u011f\u0131ms\u0131z
  bir Ermeni Devleti meydana getirmekt\u0131. Bu gayeye ula\u015fmak i\u00e7in yine
  hepsinin uygulad\u0131klar\u0131 politika da, dini duygular\u0131 istismar etmek
  ve her t\u00fcrl\u00fc vast\u0131ta ba\u015fvurmak suretiyle her kesim Ermeniler
  aras\u0131nda milliyet\u00e7ilik hislerini yaymak, Ermenileri silahland\u0131rmak,
  Osmanl\u0131 Devleti''nin her yerinde isyanlar, ihtilaller \u00e7\u0131karmak, \u00e7eteler
  vas\u0131tas\u0131yla gerilla harbi ba\u015flatmak ve bat\u0131l\u0131 devletlerin
  m\u00fcdahalesini sa\u011flayarak amaca ula\u015fmakt\u0131\\\\(^{56}\\\\). Osmanl\u0131
  Devleti ise tebaas\u0131na zarar veren bu \u00f6rg\u00fctlerin meydana getirmi\u015f
  olduklar\u0131 tedhi\u015f olaylar\u0131n\u0131 bast\u0131rmak ve bu olaylar\u0131n
  Amerika ve Avrupa''da belli ama\u00e7lar do\u011frultusunda kullan\u0131p aleyhte
  bir kamuoyunun olu\u015fumuna zemin haz\u0131rlayacak etkenleri ortadan kald\u0131rma
  yolunu takip etti. Anadolu''nun \u00e7e\u015fitli b\u00f6lgelerinde meydana gelen
  isyanlar\u0131n \u00e7o\u011funda Bat\u0131l\u0131 devletlerin Ermeni komitecilerini
  k\u0131sk\u0131rtarak Bulgaristan''\u0131n ba\u011f\u0131ms\u0131zl\u0131k s\u00fcrecinde
  izledi\u011fi yolu Ermenilerin de izlemesi gerekti\u011fini ve Ermenilerin her hareketlerinde
  bu devletlerin desteklerinin hep arkalar\u0131nda olaca\u011f\u0131na belirterek
  isyanlar\u0131n fitin''in ate\u015flenmesinde \u00f6nemli rol oynad\u0131lar. Isyanlar\u0131n
  di\u011fer \u00f6nemli bir rol\u00fc d\u0131\u015far\u0131da Osmanl\u0131 Devleti''ne
  kar\u015f\u0131 bir propaganda arac\u0131 olarak kullan\u0131lmas\u0131 olup, as\u0131l
  devleti \u00fczen i\u015fte bu konudur. Ara\u015ft\u0131rmam\u0131z\u0131n\\n\\n\\\\(^{55}\\\\)
  B.O.A., Y. PRK. ZB. 26/92 (26. Mart. 1901)\\n\\n\\\\(^{56}\\\\) http://www.ermeniteroru.8m.com/isy.htm
  Ula\u015f\u0131m Tarihi: 02/04/2012.\\n\\nbu b\u00f6l\u00fcm\u00fcnde Sason isyanlar\u0131n\u0131n
  \u00f6zellikle ABD topraklar\u0131nda nas\u0131l bir propaganda arac\u0131 olarak
  kullan\u0131ld\u0131\u011f\u0131na Osmanl\u0131 ar\u015fiv belgelerinden bakmaya
  \u00e7al\u0131\u015faca\u011f\u0131z.\\n\\nSason isyan\u0131, Avrupa devletlerine
  Osmanl\u0131 Devleti\u2019nin i\u00e7 i\u015flerine kar\u0131\u015fma f\u0131rsat\u0131
  vermi\u015ftir. Bunda Osmanl\u0131 Devleti\u2019nin g\u00fc\u00e7s\u00fczl\u00fc\u011f\u00fcn\u00fcn
  rol\u00fc b\u00fcy\u00fck oldu\u011fu gibi Avrupa\u2019n\u0131n \u00e7ifte standarth
  yakla\u015f\u0131mlar\u0131n\u0131n da etkisi bulunmaktad\u0131r. \u00c7\u00fcnk\u00fc
  ayn\u0131 devletler, Bulgar \u00e7etelerinin M\u00fcsl\u00fcman halka uygulad\u0131klar\u0131
  bask\u0131 ve zul\u00fcmle ilgili a\u00e7\u0131klama bile yapmam\u0131\u015flard\u0131r\\\\(^{57}\\\\).\\n\\nOsmanl\u0131
  Devleti \u00e7evre vilayetlerden kuvvet sevk ederek isyan\u0131 bast\u0131r\u0131msa
  da isyan\u0131n yank\u0131lar\u0131 i\u00e7eride ve d\u0131\u015f\u0131nda devam
  etmi\u015f, isyanda \u00f6len Ermenilerin say\u0131lar\u0131 bat\u0131l\u0131 devletlere
  abart\u0131larak aktar\u0131lm\u0131\u015f ve bunun \u00fczerine tart\u0131\u015fmalar
  ba\u015flam\u0131\u015ft\u0131. \u0130syan\u0131n olu\u015fturulmas\u0131nda b\u00fcy\u00fck
  rol oynayan Murat Boyac\u0131yan istedigiine kavu\u015farak, \u00f6zellikle Avrupal\u0131
  devletlerin dikkatlerini ermeni meselesine \u00e7ekmeyi ba\u015farm\u0131\u015ft\u0131.
  B\u00f6ylelikle \u0130ngiltere, Rusya ve Fransa durumun yerinde incelenmesi konusunda
  Osmanl\u0131 Devletine bask\u0131 uygulayarak bir tahkik heyetinin olu\u015fturulup
  olaylar\u0131n ara\u015ft\u0131r\u0131lmas\u0131 y\u00f6n\u00fcnde istek belirterek
  Osmanl\u0131 Devletinin i\u00e7 i\u015flerine m\u00fcdahale etmekten ka\u00e7\u0131nmam\u0131\u015flard\u0131.
  Sonu\u00e7ta Sason isyan\u0131n\u0131 incelemek \u00fczere bir \u201cTahkik Heyeti\u201d
  kurulmu\u015ftu\\\\(^{58}\\\\).\\n\\nSason isyan\u0131n\u0131n Avrupa\u2019daki
  yank\u0131lanmas\u0131 \u00e7ok farkl\u0131 olmu\u015f T\u00fcrk milletini zalim
  ve ac\u0131mas\u0131z g\u00f6sterme \u00e7al\u0131\u015fmalar\u0131 h\u0131z kazanm\u0131\u015f
  Ermeniler ise mazlum ve zavall\u0131 g\u00f6sterilerek bir Ermeni katliam\u0131n\u0131n
  ger\u00e7ekle\u015fti\u011fi durumu yarat\u0131lm\u0131\u015ft\u0131. Konunun sahipli\u011fi
  \u00fcstlenen \u0130ngiltere Sason isyan\u0131 ile ilgili inceleme komisyonun kurulmas\u0131
  konusunda b\u00fcy\u00fck bir \u00e7aba i\u00e7ine girmi\u015fti. Sonu\u00e7ta Osmanl\u0131
  y\u00f6netimi b\u00f6yle bir komisyonun kurulmas\u0131n\u0131 kabul etmek zorunda
  kalm\u0131\u015ft\u0131. \u0130ngiltere, bu komisyonda Erzurum\u2019da konsoloslu\u011fu
  bulunan devletlerin de birer temsilcisinin bulunmas\u0131n\u0131 istemi\u015fti.
  Yani Osmanl\u0131\u2019n\u0131n i\u00e7 i\u015fleri ile ilgili bir konuda bu topraklar
  \u00fczerinde emelleri bulunan \u00fclkelerinde temsilcilerinin bulundu\u011fu karma
  bir komisyonun kurulmas\u0131n\u0131 sa\u011flam\u0131\u015ft\u0131\\\\(^{59}\\\\).\\n\\nOsmanl\u0131
  Devleti, Avrupal\u0131 devletlerin komisyona kat\u0131lma teklif ve \u0131srarlar\u0131
  \u00fczerine karma tahkik heyetinin kurulmas\u0131n\u0131 kabul etmi\u015fti. Ancak
  Osmanl\u0131 Devleti, ABD\u2019nin de komisyona kat\u0131lmas\u0131\u0131n\u0131
  teklif etmi\u015f fakat ABD h\u00fck\u00fcmeti ilk ba\u015flarda bu teklife s\u0131cak
  bakmam\u0131\u015f fakat daha sonra kat\u0131lmak istemi\u015fse de Osmanl\u0131
  Devleti bu teklifi kabul etmemi\u015fti\\\\(^{60}\\\\).\\n\\n---\\n\\n\\\\(^{57}\\\\)
  Nurettin G\u00fclmez, Tahkik Hey\u2019eti Raporlar\u0131na G\u00f6re 1894 Sason
  Isyan\u0131, Belleten, Cilt: LXX - Say\u0131: 258 - Y\u0131l: 2006 A\u011fustos,
  258, s.699.\\n\\n\\\\(^{58}\\\\) Nurettin G\u00fclmez, a.g.m., s.699.\\n\\n\\\\(^{59}\\\\)
  Nurettin G\u00fclmez, a.g.m., s.701\\n\\n\\\\(^{60}\\\\) Nurettin G\u00fclmez, a.g.m.,
  s.702.\\n\\nSason isyan\u0131n yank\u0131lar\u0131 sadece Avrupa devletlerinde yank\u0131lanmam\u0131\u015ft\u0131
  ayn\u0131 zamanda Amerika\u2019da da \u00f6nemli bir propaganda malzemesi haline
  d\u00f6n\u00fc\u015fm\u00fc\u015ft\u00fc. ABD\u2019nin Ermeni Meselesinin neresinde
  durdu\u011fu \u00f6zellikle Osmanl\u0131 ar\u015fiv \u00e7al\u0131\u015fmalar\u0131n\u0131n
  son y\u0131llarda h\u0131z kazan\u0131p g\u00fcn y\u00fcz\u00fcne \u00e7\u0131kmas\u0131yla
  a\u015f\u0131k\u00e2r olmaya ba\u015flad\u0131. Haluk Selvi ve Bilal \u015eimsir
  gibi ara\u015ft\u0131rmac\u0131lar, Ermeni isyanlar\u0131n\u0131n Amerika\u2019da
  bulunan baz\u0131 Ermeniler taraf\u0131ndan kilise ekseninde ger\u00e7ekle\u015ftirilen
  propagandalar sayesinde Amerikan halk\u0131n\u0131n bu olaylara dikkatinin \u00e7ekilmesi
  ve birer Osmanl\u0131 aleyihtar\u0131 olmalar\u0131 konusunda \u00f6nemli \u00e7al\u0131\u015fmalara
  imza atarak bu alandaki \u00f6nemli bir eksikli\u011fi doldurmu\u015flard\u0131r.\\n\\nABD\u2019nin
  farkl\u0131 eyaletlerinde kurulmu\u015f olan Ermeni kiliseleri bu \u00fclkede Osmanl\u0131\u2019ya
  kar\u015f\u0131 geli\u015fen cemiyetle\u015fmenin ana \u00fcsleri konumundayd\u0131lar.
  \u00c7\u00fcnk\u00fc kilise Ermenilerin bir arada tutulmas\u0131 ve kendi benliklerinin
  var olmas\u0131\u0131n \u00f6nemli nedenlerindendi. Sason isyan\u0131 ABD\u2019de
  \u00f6nemli bir propaganda arac\u0131 olarak kullan\u0131ld\u0131. \u00d6zellikle
  Anadolu\u2019da g\u00f6rev yap\u0131p tekrar ABD\u2019ye d\u00f6nen misyonerler
  burada da bo\u015f durmay\u0131p bu tilkeye g\u00f6\u00e7 eden Ermenilerin \u00f6rg\u00fctlenmesi,
  i\u015f bulmas\u0131 k\u0131sacas\u0131 kendilerine ya\u015fam alan\u0131 olu\u015fturmalari
  konusunda b\u00fcy\u00fck rol oynad\u0131lar. Sason isyan\u0131n ABD\u2019deki yank\u0131s\u0131,
  daha \u00e7ok bu isyana dini bir motif vermek isteyen misyonerler taraf\u0131ndan
  olu\u015fturulmaya \u00e7al\u0131\u015f\u0131ld\u0131. H\u0131ristiyanlar\u0131n
  yok edilmesi, M\u00fcsl\u00fcmanlar taraf\u0131ndan katledilmesi ki \u00f6zellikle
  Protestanlar\u0131n b\u00fcy\u00fck kay\u0131p i\u00e7erisinde olmalar\u0131 gibi
  sloganlar olu\u015fturulup bunlar d\u00fczenlenen mitingler ile Amerikan halk\u0131na
  duyurulmaya \u00e7al\u0131\u015f\u0131ld\u0131. New York ve Boston\u2019da yap\u0131lan
  mitinglerde Sason olaylar\u0131 protesto edilmi\u015f, H\u0131ristiyan Sason halk\u0131n
  kad\u0131n \u00e7ocuk demeden M\u00fcsl\u00fcmanlar taraf\u0131na kat\u0131ld\u0131\u011f\u0131
  mitinglerde yap\u0131lan konu\u015fmalarla dile getirilerek H\u0131ristiyan d\u00fcnyas\u0131n\u0131n
  dikkati bu isyana \u00e7ekilmeye \u00e7al\u0131\u015f\u0131lm\u0131\u015ft\u0131.
  Bu t\u00fcr mitinglerin d\u00fczenlenmesinde ve uygulanmas\u0131nda Amerikal\u0131
  misyonerlerin rol\u00fc \u00f6nemlidir. Misyonerlerin bu yolla hem Amerikan halk\u0131ndan
  bu olaylarda zarar g\u00f6ren H\u0131ristiyan karde\u015fleri i\u00e7in ba\u011f\u0131\u015f
  toplam\u0131\u015f hem de Amerika\u2019daki Ermenilerin kendi buyruklar\u0131 alt\u0131nda
  kalmalar\u0131n\u0131 sa\u011flam\u0131\u015ft\u0131. Mitingin Di\u011fer \u00f6nemli
  bir rol\u00fc ise Sason olaylar\u0131 kullan\u0131larak H\u0131ristiyan d\u00fcnyas\u0131n\u0131
  yanl\u0131\u015f bilgilendirmek ve Avrupa devletlerinin ki buna Amerika da dahil,
  Osmanl\u0131 Devleti\u2019ne m\u00fcdahale \u015fans\u0131n\u0131 art\u0131rmakt\u0131.
  Bir di\u011fer \u00f6nemli olay ise baz\u0131 Amerikal\u0131 Protestan rahiplerin
  Baltimore ve Boston\u2019daki kiliselerde vermi\u015f\\n\\n---\\n\\n61 Haluk Selvi,
  Amerika Birle\u015fik Devletlerinde Ermeni Faaliyetleri, Milli E\u011fitim Bakanl\u0131\u011f\u0131,
  E\u011fitim Dergisi, Y\u0131l:3, Say\u0131: 38, (Nisan 2003), Bilal \u015eimsir,
  Ermeni Propagandas\u0131n\u0131n Amerika Boyutu \u00dczerine, Tarih Boyunca T\u00fcrklerin
  Ermeni Toplumu \u0130le \u0130li\u015fkileri (8-12 Ekim 1984 Erzurum), Ankara 1985\\n\\n62
  B.O.A., HR. SYS, 2834/12 (23 Kas\u0131m 1895)\\n\\nolduklar\u0131 nutuklar ile Sason
  olaylar\u0131 g\u00fcndeme tutularak Ermeniler bu yolla yard\u0131m toplanmakla
  birlikte Ermeni Meselesinin H\u0131ristiyan aleminin g\u00fcndeminde canl\u0131
  tutulmas\u0131na \u00e7al\u0131\u015f\u0131lmaktayd\u0131\\\\(^63\\\\). Bu s\u00fcre\u00e7te
  Sason isyan\u0131ndan ka\u00e7an baz\u0131 Ermeniler misyonerlerin yard\u0131m\u0131yla
  Londra \u00fczerinden Amerika''ya g\u00f6nderilmeye \u00e7al\u0131\u015f\u0131lm\u0131\u015f
  \u00f6zellikle Amerikal\u0131 misyoner Green, Londra''da bulunan \u00fc\u00e7 Ermeni
  m\u00fclteciyi k\u0131sk\u0131rtarak Sason meselesi ile ilgili a\u00e7\u0131klamalar
  yapmalar\u0131n\u0131 sa\u011flamas\u0131 ve bu a\u00e7\u0131klamalar\u0131n Times
  gazetesinde yay\u0131nlanmas\u0131n\u0131 i\u00e7in m\u00fccadele vermi\u015ftir.
  Amerikal\u0131 misyonerler, propaganda ama\u00e7lar\u0131nda kullanmaya \u00e7al\u0131\u015f\u0131klar\u0131
  bu t\u00fcr haberleri genellikle terc\u00fcmanlar\u0131 olan Ermenilerden edinmi\u015fler,
  yani g\u00f6rd\u00fcklerini de\u011fil sadece duyduklar\u0131n\u0131 ve hayal d\u00fcnyalar\u0131ndan
  ekleyebildiklerini kullanarak bu t\u00fcr telgraflar\u0131 Amerika''daki gazetelere
  \u00e7ekerek yay\u0131nlanmalar\u0131n\u0131 sa\u011flam\u0131\u015flard\u0131.
  Elbette ki bu t\u00fcr \u00e7al\u0131\u015fmalar\u0131n sonucu, misyonerler taraf\u0131ndan
  iyi bilinmekteydi o da parayd\u0131. Bu haberleri okuyan Amerikan halk\u0131 hem
  Osmanl\u0131 Devleti''ne kin duyacak hem de H\u0131ristiyanl\u0131\u011f\u0131 ilk
  kabul eden Ermenilerin, M\u00fcsl\u00fcmanlar taraf\u0131ndan ezilmesini engellemek
  i\u00e7in maddi yard\u0131m yapacakt\u0131. Bu durum misyonerlerin g\u00fc\u00e7lenmesi,
  Protestan misyonlar\u0131n g\u00fc\u00e7lenmesi ve Amerika''n\u0131n d\u0131\u015far\u0131nda
  bir g\u00fc\u00e7 haline gelmesini sa\u011flayacakt\u0131\\\\(^64\\\\).\\n\\n3.
  SONU\u00c7\\n\\n1819 y\u0131l\u0131ndan itibaren Osmanl\u0131 topraklar\u0131nda
  faaliyet y\u00fcr\u00fcten Amerikal\u0131 misyonerler Osmanl\u0131 toplumuna verdikleri
  zarar\u0131 sadece Anadolu co\u011frafyas\u0131n\u0131n s\u0131n\u0131rlar\u0131
  ile s\u0131n\u0131rlamam\u0131\u015f olarak ABD''deki Osmanl\u0131 vatanda\u015flar\u0131na
  da ayn\u0131 zarar\u0131 vermeye \u00e7al\u0131\u015fm\u0131\u015ft\u0131. Protestanl\u0131\u011f\u0131
  yaymak amac\u0131yla gelen misyonerler, daha sonraki y\u0131llarda Osmanl\u0131
  topraklar\u0131n\u0131n payla\u015f\u0131lmas\u0131 s\u00f6z konusu olunca ABD''nin
  bu topraklarda Monroe Doktrinini delmeden kendi a\u00e7\u0131k kap\u0131 emperyalist
  faaliyetlerini y\u00fcr\u00fctmek i\u00e7in bir ara\u00e7 olmu\u015f ve misyon kurumlar\u0131
  \u00fczerinde s\u00f6z sahibi hakk\u0131 kazanan ABD, Ermenileri kullanarak Osmanl\u0131
  Devleti''nin i\u00e7 i\u015flerine m\u00fcdahale etme \u015fans\u0131n\u0131 yakalam\u0131\u015ft\u0131.
  \u00d6zellikle Amerikan Board \u00f6rg\u00fct\u00fc ge\u00e7en y\u0131llar itibariyle
  artan giderlerinin b\u00fcy\u00fck bir b\u00f6l\u00fcm\u00fcn\u00fc Amerikan halk\u0131n
  kilselere yapt\u0131klar\u0131 yard\u0131m ile kar\u015f\u0131lam\u0131\u015f bu
  kayna\u011f\u0131n canl\u0131 kalabilmesi i\u00e7in Do\u011funun Yankileri dedikleri
  Ermenilerin Osmanl\u0131 taraf\u0131ndan kat\u0131lama u\u011frad\u0131klar\u0131n\u0131
  iddia ederek ve bu iddialar\u0131n\u0131 misyoner yay\u0131nlar\u0131yla destekleyip
  Amerikan halk\u0131n\u0131n Osmanl\u0131 aleyhtar\u0131 olmalar\u0131n\u0131\\n\\n---\\n\\n\\\\(^{63}\\\\)
  B.O.A, HR. SYS. 2834/9 (26 Kas\u0131m 1895)\\n\\n\\\\(^{64}\\\\) B.O.A, Y.PRK. B\u015eK,
  41/18, B.O.A, HR. SYS. 2838/27, B.O.A, Y.A. HUS. 331/82\\n\\nsa\u011flam\u0131\u015flard\u0131.
  Osmanl\u0131 Devleti, Washington sefiri Mavroyeni Bey\u2019in ortaya koymu\u015f
  oldu\u011fu Amerika\u2019daki Ermeni \u00f6rg\u00fctlenmesinin \u00f6n\u00fcn\u00fc
  alamam\u0131\u015f ve bug\u00fcn dahi var olan bu propagandan\u0131n meydana getirmi\u015f
  oldu\u011fu olumsuz hava halen varl\u0131\u011f\u0131m\u0131 korumaktad\u0131r.\\n\\n4.
