  E\u011e\u0130T\u0130M\u0130 KURSUNA KATILACA\u011eLARDA ARANILACAK KO\u015eULLAR\\n\\n1.
  En az lise veya dengi okul mezunu olmak,\\n2. G\u00f6revini yapmaya mani fiziki
  engeli bulunmamak,\\n3. Taksirli su\u00e7lar ile k\u0131sa s\u00fcreli hapis cezas\u0131na
  se\u00e7enek yapm\u0131\u015ft\u0131r\u0131mlara \u00e7evrilmi\u015f veya a\u015fa\u011f\u0131da
  say\u0131lan su\u00e7lar d\u0131\u015f\u0131nda tecil edilmi\u015f h\u00fck\u00fcmler
  hari\u00e7 olmak \u00fczere, kasten i\u015flenen bir su\u00e7tan dolay\u0131 bir
  y\u0131l veya daha fazla s\u00fcreyle hapis cezas\u0131na ya da affa u\u011fram\u0131\u015f
  olsa bile Devletin g\u00fcvenli\u011fine kar\u015f\u0131 su\u00e7lar, anayasal d\u00fczene
  ve bu d\u00fczenin i\u015fleyi\u015fine kar\u015f\u0131 su\u00e7lar, zimmet, irtikap,
  r\u00fc\u015fvet, h\u0131rs\u0131zl\u0131k, doland\u0131r\u0131c\u0131l\u0131k,
  sahtecilik, g\u00fcveni k\u00f6t\u00fcye kullanma, hileli iflas, ihaleye fesat kar\u0131\u015ft\u0131rma,
  edenim iflas\u0131na fesat kar\u0131\u015ft\u0131rma, su\u00e7tan kaynaklanan mal
  varl\u0131\u011f\u0131 de\u011ferlerini aklama, ka\u00e7ak\u00e7\u0131l\u0131k veya
  cinsel dokunulmazl\u0131\u011fa kar\u015f\u0131 su\u00e7lar, fuhu\u015f, uyu\u015fturucu
  ve uyar\u0131c\u0131 madde imal ve ticareti, kullan\u0131m\u0131, kullan\u0131m
  kolayla\u015ft\u0131rma, kullanmak i\u00e7in sat\u0131n alma, kabul etme veya bulundurma,
  haks\u0131z mal edinme, \u015fike ve te\u015fvik primi su\u00e7lar\u0131ndan mahk\u00fbm
  olmamak,\\n4. En az on sekiz ya\u015f\u0131n\u0131 bitirmi\u015f olmak,\\n5. Antren\u00f6r
