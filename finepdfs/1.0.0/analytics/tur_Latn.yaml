  firstname.lastname@example.org Web: www.antcev.org.tr\"", "\"1.\\n\\n2.\\n\\n3.\\n\\n4.\\n\\n5.\\n\\n6.\\n\\nPREKL\u0130N\u0130K
  \u00d6\u011eRENC\u0130 \u00c7ALI\u015eMA MASASI TEK\u0130K \u015eARTNAMES\u0130\\n\\nMasalar\u0131n
  ana g\u00f6vde k\u0131s\u0131mlar\u0131 en az 1,20mm DKP sa\u00e7, kabinler en az
  0,90mm DKP sa\u00e7, \u00e7ekmece i\u00e7leri 0,80mm\\n\\nDKP sacdan yap\u0131lm\u0131\u015f
  olmal\u0131d\u0131r.\\n\\nDKP \u00e7elik sa\u00e7 k\u0131s\u0131mlar\u0131 \u00fczeri
  demir fosfat kaplamas\u0131 yap\u0131lmal\u0131, daha sonra elektro-statik toz boya
  ile boyanmal\u0131\\n\\nve 200 derecede f\u0131r\u0131nlanm\u0131\u015f olmal\u0131d\u0131r.
