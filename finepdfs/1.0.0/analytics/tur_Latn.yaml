  beyan ederiz.\\n\\n| \u0130hra\u00e7\u00e7\u0131: | Sorumlu Oldu\u011fu K\u0131s\u0131m:
  |\\n| Alt\u0131nya\u011f Kombinalar\u0131 A.\u015e Yetkilisi |  |\\n\\n| Arac\u0131
  Kurum: | Sorumlu Oldu\u011fu K\u0131s\u0131m: |\\n| Invest AZ Yat\u0131r\u0131m
  Menkul De\u011ferler A.\u015e. |  |\\n\\n| Kenan ULUC | Dr. Hakan AVDAN |\\n| Mali
  ve \u0130dari \u0130\u015fler GMY | Genel M\u00fcd\u00fcr |\\n\\nTASARRUF SAH\u0130PLER\u0130NE
  SATI\u015e DUYURUSUNUN TAMAMI\\n\\n26 \u015eubat 2018\"", "\"$\\n\\n$\\n\\nCoppa
  Tekstil Kids \u00a9 2017 - T\u00fcm Haklar\u0131 Sakl\u0131d\u0131r.\\nPowered By\\nTipExport.com\\ntext_information\\nHakk\u0131m\u0131zda\\nKalite
  Politikam\u0131z\\nGizlilik Politikam\u0131z\\nSat\u0131\\n\u015f\\nS\u00f6zle\\n\u015f\\nmesi\\nM\u00fc\u015fteri
  Servisi\\n\u0130\\nleti\\n\u015f\\nim\\n\u00dcr\u00fcn\\n\u0130\\nadesi\\nSite Haritas\u0131\\nEkstralar\\nMarkalar\\nHediye
  \u00c7eki\\nOrtakl\u0131k Program\u0131\\nKampanyalar\\nHesab\u0131m\\nHesab\u0131m\\nSipari\\n\u015f\\nlerim\\nAl\u0131\\n\u015f\\nveri\\n\u015f\\nListem\\nB\u00fclten
  Aboneli\u011fi\"", "\"ANTALYA \u00c7A\u011eDA\u015e E\u011e\u0130T\u0130M VE K\u00dcLT\u00dcR
  VAKFI 2023 ANT\u00c7EV K\u0130T\u0130\\n\\n\\\"E\u011fitimdir ki, bir milleti ya
  h\u00fcr, ba\u011f\u0131ms\u0131z, \u015fanl\u0131, y\u00fcksek bir toplum halinde
  ya\u015fat\u0131r veya bir milleti k\u00f6lelik ve yoksullu\u011fa terk eder.\\\"\\n\\nAntalya
  \u00c7a\u011fda\u015f E\u011fitim ve K\u00fclt\u00fcr Vakf\u0131 (ANT\u00c7EV)\\n\\nVakf\u0131m\u0131z,
  \u00e7a\u011fda\u015f e\u011fitime destek olmak ve bu ama\u00e7la; \u00f6zg\u00fcveni
  olan, kendini ifade edebilen, \u00fcretken, sorgulayan ve sorumluluk alan gen\u00e7ler
  yeti\u015ftirilmesine katk\u0131da bulunmak \u00fczere\u2026\\n\\nAntalya \u00c7a\u011fda\u015f
  E\u011fitim ve K\u00fclt\u00fcr Vakf\u0131 (ANT\u00c7EV)\\n\\n1995 y\u0131l\u0131nda,
  Antalya''da 228 \u00fcyenin bir araya gelerek kurdu\u011fu bir sivil toplum kurulu\u015fudur.\\n\\nMaddi
  Deste\u011fe ihtiyac\u0131 olan, ba\u015far\u0131l\u0131 \u00fcniversite \u00f6\u011frencilerine
  burs vermekte, AB \u00fcyesi \u00fclkelerle gen\u00e7lere ve yeti\u015fkinlere y\u00f6nelik
  uluslararas\u0131 k\u00fclt\u00fcrel de\u011fi\u015fim projeleri ger\u00e7ekle\u015ftirmektedir,\\n\\nSergi
  ve Konserler d\u00fczenlemekte, Sosyal, k\u00fclt\u00fcrel, sportif ve e\u011fitsel
  \u00e7al\u0131\u015fmalar yapmakta, Antalya''n\u0131n sosyal-k\u00fclt\u00fcrel
  a\u00e7\u0131dan geri kalm\u0131\u015f b\u00f6lgelerinde ve o b\u00f6lgedeki \u0130lk
  \u00d6\u011fretim Okullar\u0131nda, alan \u00e7al\u0131\u015fmalar\u0131 yaparak
  hem e\u011fitim destek hem de gen\u00e7lerin birey olarak yetenek ve becerilerinin
  fark\u0131na varmalar\u0131na ve bu yeteneklerini geli\u015ftirmelerine yard\u0131mc\u0131
  olan projeler y\u00fcr\u00fctmektedir.\\n\\nY\u00dcKSEK\u00d6\u011eREN\u0130M BURSLARIMIZ;\\n\\n\u00d6\u011frencilerimizi
  her y\u00f6n\u00fcyle tan\u0131mak amac\u0131yla objektif ve g\u00fcvenilir tan\u0131ma
  teknikleri ve m\u00fclakatlardan yararlan\u0131lmaktad\u0131r.\\n\\nY\u00dcKSEK\u00d6\u011eREN\u0130M
  BURSU;\\n\\n\u00dclkemizde her ge\u00e7en y\u0131l daha fazla ihtiya\u00e7 duyulan
  bu katk\u0131lar\u0131, toplumsal sorumluluk duygusu ta\u015f\u0131yan herkesin
  \u00f6rnek almas\u0131 gereken bir davran\u0131\u015f olarak de\u011ferlendiriyoruz.\\n\\nY\u00dcKSEK\u00d6\u011eREN\u0130M
  BURS HAVUZU\\n\\nBu nedenle, d\u00fc\u015f\u00fcnen, \u00e7a\u011f\u0131n\u0131
  sorgulayan bir gen\u00e7li\u011fin toplumumuzu \u00e7a\u011fda\u015f uygarl\u0131k
  d\u00fczeyine ta\u015f\u0131yaca\u011f\u0131na inan\u0131yorsan\u0131z, sizde ANT\u00c7EV
  \u00e7elenklerinden kullanarak, burs havuzuna destek olabilirsiniz.\\n\\nVAKFIMIZ;
  Bu g\u00fcne kadar toplam 1200 E\u011fitim Bursu ve 86 Kitap Bursu verilmi\u015ftir.\\n\\n1000
  KIZ \u00c7OCU\u011eU OKULLANDIRMA PROJES\u0130\\n\\nVakf\u0131m\u0131z, Antalya
  il merkezinde okul \u00e7a\u011f\u0131na gelmi\u015f ancak okula gidemeyen veya
  g\u00f6nderilmeyen k\u0131z \u00e7ocuklar\u0131n\u0131n okula kay\u0131tlar\u0131n\u0131n
  yapt\u0131r\u0131lmas\u0131n\u0131 ve okula ba\u015flat\u0131lmalar\u0131n\u0131
  hedefleyen \\\"1000 KIZ \u00d6\u011eRENC\u0130Y\u0130 OKULA BA\u015eLATMA Projesi''ni
  hayata ge\u00e7irmi\u015ftir.\\n\\n1000 KIZ \u00c7OCU\u011eU OKULLANDIRMA PROJES\u0130\\n\\n250
  \u00f6\u011frencinin b\u00fct\u00fcn e\u011fitim giderlerini kar\u015f\u0131layarak,
  okulla kay\u0131tlar\u0131 yap\u0131lm\u0131\u015f ve e\u011fitimleri takip edilmi\u015ftir.\\n\\n\u0130LK\u00d6\u011eRET\u0130ME
  DESTEK PROJES\u0130\\n\\nBurslu \u00d6\u011frencilerimizin i\u015fbirli\u011fi yapma,
  yard\u0131mla\u015fma, payla\u015fma davran\u0131\u015flar\u0131n\u0131 geli\u015ftirmek,
  Toplumsal olaylara duyarl\u0131 olmay\u0131 ve Toplumsal Sorumluluk Duygusunu kavranmalar\u0131,\\n\\nD\u00f6nem
  ba\u015flar\u0131nda uygulay\u0131c\u0131lar ANT\u00c7EV taraf\u0131ndan se\u00e7ilerek
  Program \u00f6ncesinde belirtilecek yerde koordinasyon toplant\u0131s\u0131 yap\u0131l\u0131r.
  Ard\u0131ndan uygulay\u0131c\u0131lar TEGV (T\u00fcrkiye E\u011fitim G\u00f6n\u00fcll\u00fcleri
  Vakf\u0131) E\u011fitim Park\u0131nda 2 g\u00fcnl\u00fck uygulamal\u0131 staja tabi
  tutulur.\\n\\n\u0130LK\u00d6\u011eRET\u0130ME DESTEK PROJES\u0130\\n\\n\u00d6\u011frencilerin
  sosyal bir varl\u0131k olma ve toplum i\u00e7erisinde bir yer edinme, kendine g\u00fcven
  duyma, insanlara kar\u015f\u0131 sevgi ve sayg\u0131 davran\u0131\u015flar\u0131n\u0131
  g\u00f6sterebilme, mutlu olabilmesi i\u00e7in yard\u0131m etmeyi ama\u00e7lamaktad\u0131r.\\n\\nToplumda
  geli\u015fimi i\u00e7in a\u00e7\u0131k f\u0131rsatlar\u0131, okul i\u00e7i ve okul
  d\u0131\u015f\u0131 e\u011fitsel ve k\u00fclt\u00fcrel olanaklardan, yararlanmay\u0131,
  meslekleri, toplumun beklentilerini tan\u0131mas\u0131na ve bir birey olarak yeti\u015fmesine
  yard\u0131m etmektir.\\n\\nS\u00fcleyman Demirel \u0130lk\u00f6\u011fretim Okulu
  (2003\u20132006) S\u00fcleyman Demirel \u0130lk\u00f6\u011fretim Okulu (2003\u20132006)
  Cumhuriyet \u0130lk\u00f6\u011fretim Okulu (2007\u20132009)\\n\\nA\u011f\u0131z
  ve Di\u015f Sa\u011fl\u0131\u011f\u0131 E\u011fitimi\\n\\n\u0130lk\u00f6\u011fretim
  Destek Projesi kapsam\u0131nda, Cumhuriyet \u0130lk \u00d6\u011fretim Okulunda,
  Antalya Di\u015f Hekimleri Odas\u0131 Ortakl\u0131\u011f\u0131yla \\\"A\u011f\u0131z
  ve Di\u015f Sa\u011fl\u0131\u011f\u0131\\\" E\u011fitimi ba\u015flat\u0131lm\u0131\u015ft\u0131r.\\n\\nE\u011fitimin
  birinci aya\u011f\u0131 olan 16 Nisan 2008 tarihinde, 5 ve 6nc\u0131 s\u0131n\u0131f
  \u00f6\u011frencilerine (200 \u00d6\u011frenci) e\u011fitim verilmi\u015ftir.\\n\\nE\u011fitimin
  ikinci aya\u011f\u0131nda ise, 28 May\u0131s 2008 tarihinde, 1., 2., 3., ve 4nc\u00fc
  s\u0131n\u0131f \u00f6\u011frencilerine (300 \u00d6\u011frenci) e\u011fitim verilmi\u015ftir.\\n\\nA\u011f\u0131z
  ve Di\u015f Sa\u011fl\u0131\u011f\u0131 E\u011fitimi\\n\\nProje Bitiminde, t\u00fcm
  \u00f6\u011frencilere di\u015f macunu ve di\u015f f\u0131r\u00e7as\u0131 hediye
  edilmi\u015ftir.\\n\\nB\u00f6ylece, toplam 500 \u00d6\u011frenci a\u011f\u0131z
  ve di\u015f sa\u011fl\u0131\u011f\u0131 e\u011fitimi ile birlikte, ald\u0131klar\u0131
  e\u011fitimi uygulayabilecekleri di\u015f f\u0131r\u00e7as\u0131 ve di\u015f macununa
  sahip olmu\u015ftur.\\n\\n\u0130BRAH\u0130M DO\u011eANER \u0130LK\u00d6\u011eRET\u0130M
  OKULUNDA VER\u0130LEN SEM\u0130NER\\n\\n\u0130brahim Do\u011faner \u0130lk \u00d6\u011fretim
  Okulundan gelen talep \u00fczerine, \u00dcyemiz Orman M\u00fchendisi, S\u00fcleyman
  D\u0130NG\u0130L taraf\u0131ndan Bitki \u00c7e\u015fitleri hakk\u0131nda bir seminer
  verilmi\u015f ve \u00f6\u011frenciler ilgiyle izlemi\u015ftir\u2026\\n\\nK\u0130TAP
  ve OYUNCAK BA\u011eI\u015eI K\u0130R\u0130\u015e\u00c7\u0130LER \u0130LK\u00d6\u011eRET\u0130M
  OKULU''NA\\n\\n\u00dcyelerimiz ve g\u00f6n\u00fcll\u00fclerimiz yard\u0131m\u0131yla
  toplad\u0131\u011f\u0131m\u0131z kitaplar\u0131 ve oyuncaklar\u0131 dezavantajl\u0131
  bir b\u00f6lgede bulunan Kiri\u015f\u00e7iler \u0130lk \u00d6\u011fretim Okulu \u00f6\u011frencilerine
  hediye ettik.\\n\\n2014 Kas\u0131m ay\u0131nda, \u0130lkokula yapt\u0131\u011f\u0131m\u0131z
  ziyaretle kitaplar\u0131 ve oyuncaklar\u0131, okula teslim ettik. Okul m\u00fcd\u00fcr\u00fc,
  \u00f6\u011fretmenler ve \u00f6\u011frencilerle g\u00fczel bir g\u00fcn ge\u00e7irdik.\\n\\nOKULLARA
  K\u0130TAP BA\u011eI\u015eI\\n\\nK\u00e2hta Lisesinden bir ba\u015fvuru ald\u0131k.
  K\u00fct\u00fcphaneleri i\u00e7in yard\u0131m talep eden Okul M\u00fcd\u00fcr\u00fc''n\u00fcn
  \u00e7a\u011fr\u0131s\u0131na kulak vererek bir ba\u015fka kitap toplama kampanyas\u0131
  ba\u015flatt\u0131k. Siz duyarl\u0131 \u00fcyelerimizin kat\u0131l\u0131m\u0131yla
  toplayaca\u011f\u0131m\u0131z kitaplar\u0131 da \u00f6n\u00fcm\u00fczde ki g\u00fcnlerde
  K\u00e2hta Lisesine ula\u015ft\u0131raca\u011f\u0131z.\\n\\nG\u00d6N\u00dcLL\u00dc
  H\u0130ZMET STAJI\\n\\nG\u00f6n\u00fcll\u00fc olmak, Toplumsal duyarl\u0131l\u0131\u011f\u0131n
  artmas\u0131 ve\\n\\nSivil Toplum Kurulu\u015flar\u0131n\u0131n \u00f6nem kazanmas\u0131
  i\u00e7in \u00f6nemli bir ad\u0131m.\\n\\nT\u00fcm\u00fcyle g\u00f6n\u00fcll\u00fc
  \u00e7abas\u0131yla y\u00fcr\u00fct\u00fclen Vakf\u0131m\u0131z \u00e7al\u0131\u015fmalar\u0131
  hem gen\u00e7lerimize hem de g\u00f6n\u00fcll\u00fclerimize \u00e7ok \u015fey kazand\u0131r\u0131yor.\\n\\nG\u00d6N\u00dcLL\u00dc
  H\u0130ZMET STAJI\\n\\nAntalya Denizcilik Anadolu Lisesinde okuyan 4 \u00d6\u011frenci,
  fark yarat\u0131p bir g\u00fcnl\u00fck g\u00f6n\u00fcll\u00fc hizmet staj\u0131n\u0131
  Ant\u00e7ev'' de ger\u00e7ekle\u015ftirdiler...\\n\\nDile\u011fimiz bu \u00e7al\u0131\u015fmalar\u0131n
  artarak \u00e7o\u011falmas\u0131\u2026\\n\\n23 N\u0130SAN \u00c7OCUK \u015eENL\u0130\u011e\u0130\\n\\n23
  Nisan 2013 tarihinde B\u00fcy\u00fck\u015fehir Belediyesinin d\u00fczenledi\u011fi
  \u00e7ocuk \u015fenli\u011fi kapsam\u0131nda vak\u0131f olarak, \u00e7ocuklara at\u00f6lye
  \u00e7al\u0131\u015fmalar\u0131 yapt\u0131r\u0131lm\u0131\u015ft\u0131r.\\n\\nBu
  kapsamda origami sanat\u0131 ve resim \u00e7al\u0131\u015fmalar\u0131 yapt\u0131r\u0131lm\u0131\u015ft\u0131r.\\n\\nGER\u00c7EKLE\u015eEN
  VE DEVAM EDEN PROJELER\\n\\n2002 y\u0131l\u0131nda D\u00fcnya Bankas\u0131 taraf\u0131ndan
  K\u00fc\u00e7\u00fck Hibeler Program\u0131na sunmu\u015f oldu\u011fumuz \\\"Yoksul
  Gen\u00e7 Kad\u0131nlar\u0131n G\u00fc\u00e7lendirilmesi\\\" Projemiz hibe almaya
  hak kazanarak, proje \u00e7al\u0131\u015fmalar\u0131m\u0131z h\u0131zland\u0131r\u0131lm\u0131\u015f
  ve 15 Temmuz 2002 tarihinde Adrasan (\u00c7avu\u015f k\u00f6y) Antalya''da uygulanmaya
  ba\u015flanm\u0131\u015ft\u0131r.\\n\\nYerel G\u00fcndem 21 Antalya Kad\u0131n Dan\u0131\u015fma
  ve Dayan\u0131\u015fma Merkezi ortakl\u0131\u011f\u0131 ile Antalya Barosu ve T\u00fcrk
  Tabipler Odas\u0131 Antalya \u015eubesi \u0130\u015fbirli\u011fi ve di\u011fer baz\u0131
  kurum ve kurulu\u015flar\u0131n deste\u011fi ile 15\u201323 Temmuz 2002 ve 24 Temmuz
  \u2013 01 A\u011fustos 2002 olmak \u00fczere, iki d\u00f6nem halinde ger\u00e7ekle\u015ftirilmi\u015ftir.
  Seminere 40 kad\u0131n kat\u0131lm\u0131\u015ft\u0131r.\\n\\nGER\u00c7EKLE\u015eEN
  VE DEVAM EDEN PROJELER\\n\\n2002 y\u0131l\u0131nda D\u00fcnya Bankas\u0131 taraf\u0131ndan
  K\u00fc\u00e7\u00fck Hibeler Program\u0131na sunmu\u015f oldu\u011fumuz,\\n\\n\\\"Yoksul
  Gen\u00e7 Kad\u0131nlar\u0131n G\u00fc\u00e7lendirilmesi\\\"\\n\\nProjemiz hibe
  almaya hak kazanarak, proje \u00e7al\u0131\u015fmalar\u0131m\u0131z h\u0131zland\u0131r\u0131lm\u0131\u015f
  ve 15 Temmuz 2002 tarihinde Adrasan (\u00c7avu\u015f k\u00f6y) Antalya''da uygulanmaya
  ba\u015flanm\u0131\u015ft\u0131r.\\n\\n\\\"Biyolojik \u00c7e\u015fitlili\u011fin
  Ke\u015fif Yollar\u0131''''\\n\\n2004 YILI AB Gen\u00e7lik Projesi \\\"Biyolojik
  \u00c7e\u015fitlili\u011fin Ke\u015fif Yollar\u0131'''' ad\u0131yla Burslu \u00f6\u011frencilerimizin
  koordinat\u00f6rl\u00fc\u011f\u00fcnde ger\u00e7ekle\u015fen proje, gen\u00e7lerdeki
  do\u011fa seviyesini artt\u0131rmay\u0131 hedefledik.\\n\\nAnketler incelendi\u011finde
  ba\u015far\u0131m\u0131z ortaya \u00e7\u0131kartm\u0131\u015ft\u0131r. Dostluk ortam\u0131nda
  ve \u0131rk\u00e7\u0131l\u0131\u011fa kar\u015f\u0131 bir ortamda ger\u00e7ekle\u015ftirilen
  proje, bize yeni projeler yapmam\u0131zda b\u00fcy\u00fck bir g\u00fcven sa\u011flad\u0131.\\n\\n2004\u20132006
  YILI DEZAVANTAJLI B\u00d6LGELERDE ANNE-BABA E\u011e\u0130T\u0130M\u0130\\\" PROJES\u0130\\n\\n\u00c7ocuklar\u0131n\u0131n
  e\u011fitimi ile daha fazla ilgilenmelerini sa\u011flamak i\u00e7in Anne & Baba
  ve Velilere e\u011fitimler verilmi\u015f,\\n\\nAnne baba-velilerin \u00e7ocuklar\u0131n\u0131n
  e\u011fitimi ile ilgilenmeleri konusunda nitelik ve niceliksel art\u0131\u015f,
  dolay\u0131s\u0131yla \u00e7ocuklar\u0131n e\u011fitimde ba\u015far\u0131lar\u0131n\u0131n
  art\u0131\u015f\u0131 sa\u011flanm\u0131\u015f,\\n\\n\\\"Anne Baba E\u011fitimi
  El Kitab\u0131\\\" haz\u0131rlanm\u0131\u015f,\\n\\nOkul Aile Birlikleri gibi veli
  \u00f6rg\u00fctlenmelerine ve veli toplant\u0131lar\u0131na kat\u0131l\u0131m\u0131n
  art\u0131\u015f\u0131 sa\u011flanm\u0131\u015ft\u0131r.\\n\\n2005\u20132006 YILI
  S\u0130NERJ\u0130 KAR\u0130YER MERKEZ\u0130\\n\\nAB-\u0130\u015eKUR Aktif i\u015fg\u00fcc\u00fc
  programlar\u0131 projesi, ''Yeni F\u0131rsatlar Hibe Program\u0131'' \u00e7er\u00e7evesinde
  ger\u00e7ekle\u015ftirilmi\u015f.\\n\\n\u00c7e\u015fitli nedenlerle i\u015f kayb\u0131na
  u\u011fram\u0131\u015f veya yeni mezun olarak i\u015f aramakta olan ki\u015filere
  i\u015f bulma s\u00fcre\u00e7lerinde yard\u0131mc\u0131 olmay\u0131 hedefleyen proje
  i\u00e7in, halen kullan\u0131lmak \u00fczere olan Sinerji Kariyer Destek Merkezi
  kurulmu\u015f.\\n\\nProje sonunda 345 ki\u015fi Temel Bilgisayar E\u011fitimi, 735
  ki\u015fi de seminerlerden ve insan kaynaklar\u0131 hizmetlerinden yararlanm\u0131\u015ft\u0131r.
  Ki\u015filerin i\u015fe yerle\u015ftirme a\u015famas\u0131nda bilgileri ANT\u00c7EV
  taraf\u0131ndan olu\u015fturulan veri taban\u0131ndan i\u015fletmelere bilgi verilmi\u015ftir.
  Proje bitiminden sonra ula\u015f\u0131labilen 345 yararlan\u0131c\u0131dan 209''unun
  i\u015f buldu\u011fu ve i\u015finden memnun oldu\u011fu tespit edilmi\u015f.\\n\\n2007\u20132008
  YILI G\u00d6\u00c7MENL\u0130K UZMANLARININ T\u00dcRK\u0130YE''DE DENEY\u0130M B\u00dcT\u00dcNLE\u015eMES\u0130
  PROJES\u0130\\n\\nHollanda Tilburg''dan ROC MIDDEN BRABANT Kurumunun koordinat\u00f6r
  oldu\u011fu \\\"G\u00f6\u00e7menlik Uzmanlar\u0131n\u0131n T\u00fcrkiye''de Deneyim
  B\u00fct\u00fcnle\u015fmesi Program\u0131\\\" ba\u015fl\u0131kl\u0131 Grundtvig\u20132
  projesi \u00e7al\u0131\u015fmalar\u0131 ba\u015flad\u0131.\\n\\nProje, ba\u015fka
  k\u00fclt\u00fcrleri anlama ve buna uygun olarak hareket etme konusunda duyulan
  bir gereksinim y\u00fcz\u00fcnden ortaya \u00e7\u0131km\u0131\u015ft\u0131r.\\n\\nG\u00d6\u00c7MENL\u0130K
  UZMANLARININ T\u00dcRK\u0130YE''DE DENEY\u0130M B\u00dcT\u00dcNLE\u015eMES\u0130
  PROJES\u0130\\n\\nAntalya''da 8 de\u011fi\u015fik \u00fclkeden 25 g\u00f6\u00e7menle
  \u00e7al\u0131\u015fan uzman\u0131n g\u00f6\u00e7menlik \u015fartlar\u0131n\u0131
  daha iyi anlayabilmelerini ve onlara g\u00f6re davran\u0131\u015f geli\u015ftirmelerini
  sa\u011flamaya y\u00f6nelik program uygulamas\u0131na karar verildi.\\n\\nAntalya''da
  bir araya gelen 7 farkl\u0131 \u00fclkeden 25 kat\u0131l\u0131mc\u0131 ile projenin
  en \u00f6nemli a\u015famas\u0131 hayata ge\u00e7irildi.\\n\\nG\u00d6\u00c7MENL\u0130K
  UZMANLARININ T\u00dcRK\u0130YE''DE DENEY\u0130M B\u00dcT\u00dcNLE\u015eMES\u0130
  PROJES\u0130\\n\\nAntalya''daki toplant\u0131da kat\u0131l\u0131mc\u0131lar bir
  yandan T\u00fcrk\u00e7e ve T\u00fcrkiye ilgili dersler al\u0131rken bir yandan da
  g\u00f6\u00e7men olma durumunu ya\u015fad\u0131lar. Bu s\u0131rada yap\u0131lan
  t\u00fcm etkinlikler profesyonel kameramanlar arac\u0131l\u0131\u011f\u0131 ile
  g\u00f6r\u00fcnt\u00fclendi.\\n\\nBu deneyim, hem projenin Antalya aya\u011f\u0131n\u0131
  ger\u00e7ekle\u015ftiren biz ANT\u00c7EV \u00e7al\u0131\u015fanlar\u0131 a\u00e7\u0131s\u0131ndan
  hem de g\u00f6\u00e7menlik duygusunu belli bir \u00f6l\u00e7\u00fcde ya\u015fayan
  kat\u0131l\u0131mc\u0131lar a\u00e7\u0131s\u0131ndan son derece yararl\u0131 sonu\u00e7lar
  elde edilmesini sa\u011flad\u0131.\\n\\nAvrupa Konseyi taraf\u0131ndan da 2008 y\u0131l\u0131
  ''Creativity and Innovation'' (Yarat\u0131c\u0131l\u0131k ve Yenilik\u00e7ilik)
  yar\u0131\u015fmas\u0131nda 200 proje aras\u0131ndan ilk 10''a girmeye ve \\\"Yarat\u0131c\u0131l\u0131k
  ve Yenilik\\\" \u00d6d\u00fcl\u00fcne lay\u0131k bulunmu\u015ftur.\\n\\n2007\u20132009
  \u0130\u015fsizlik Riski Alt\u0131ndaki B\u00f6lgelerdeki Yeti\u015fkinleri \u0130\u015f
  Hayat\u0131na Kazand\u0131rmak Ama\u00e7l\u0131 Bilgi Teknolojileri E\u011fitimi
  Projesi\\n\\n(IT Education As An Activating Factor of Adults From Areas Under Danger
  of Unemployment \u2013 ITEFAFU )\\n\\nPolonya''dan \\\"Var\u015fova Tar\u0131m \u00dcniversitesinin
  Koordinat\u00f6rl\u00fc\u011f\u00fcn\u00fc y\u00fcr\u00fctt\u00fc\u011f\u00fc projede;
  yine Polonya''dan \\\"Var\u015fova Ekonomi \u00dcniversitesi\\\", Slovakya''dan
  \\\"Kosice Teknik \u00dcniversitesi\\\", \u0130spanya''dan \\\"ROVC Teknik E\u011fitim
  Birimi\\\", K\u0131br\u0131s''tan \\\"E\u011fitim Enstit\u00fcs\u00fc\\\" ve Vakf\u0131m\u0131z
  proje ortaklar\u0131 olarak yer almaktad\u0131r.\\n\\nProjenin toplam s\u00fcresi
  36 ay olup, iki y\u0131ll\u0131k faaliyetleri tamamlanm\u0131\u015ft\u0131r. Proje
  kapsam\u0131nda \u00f6zellikle e-\u00f6\u011frenme (e-learning) platformlar\u0131
  ve bilgi teknolojileri ile internet kullan\u0131lacakt\u0131r.\\n\\nKat\u0131l\u0131mc\u0131lara
  i\u015f arama ve ki\u015fisel niteliklerinin iyile\u015ftirilmesi y\u00f6n\u00fcnde
  \u00e7e\u015fitli konu ve kapsamlarda bilgisayar kurslar\u0131 ile i\u015f hayat\u0131
  ve sorunlar\u0131 ile ilgili seminerler verilecektir. Proje kat\u0131l\u0131mc\u0131lar\u0131
  verilen e\u011fitimler sonunda i\u015f d\u00fcnyas\u0131 ve i\u015fsizlik sorunlar\u0131
  ile daha kolay ba\u015f edebilir duruma gelmi\u015f olacaklard\u0131r. Proje kapsamda
  d\u00fczenlenen kurslar ve kat\u0131l\u0131mc\u0131 say\u0131lar\u0131 tabloda yer
  almaktad\u0131r.\\n\\n2008\u20132009 YILI ''Madalyonun Di\u011fer Y\u00fcz\u00fc''\\n\\nLeonardo
  Da Vinci Projesi\\n\\nY\u00fcr\u00fct\u00fclen G\u00f6\u00e7menlik Projesi arac\u0131l\u0131\u011f\u0131
  ile elde edilen yen ortakl\u0131klar\u0131n bir \u00fcr\u00fcn\u00fc olan bu projenin
  koordinat\u00f6r\u00fc Hollanda''dan Dutch Alliance adl\u0131 bir okuldur. Bu okul
  \u015femsiye bir \u00f6rg\u00fct gibidir ve bu ba\u015fl\u0131k alt\u0131nda 9 farkl\u0131
  okul faaliyet g\u00f6stermektedir.\\n\\n2008\u20132009 YILI ''Madalyonun Di\u011fer
  Y\u00fcz\u00fc''\\n\\nLeonardo Da Vinci Projesi\\n\\n\u00c7al\u0131\u015fmalar\u0131,
  13 ya\u015ftan itibaren gen\u00e7ler ve yeti\u015fkinlere d\u00f6n\u00fck bi\u00e7imsel
  ve mesleki e\u011fitim etkinliklerini kapsamaktad\u0131r. G\u00f6\u00e7menlik projesinde
  oldu\u011fu gibi, g\u00f6\u00e7menlere e\u011fitim veren meslek \u00f6\u011fretmenlerinin
  T\u00fcrkiye''ye gelerek, T\u00fcrk\u00e7e \u00f6\u011frenmelerini, T\u00fcrkiyeli
  ailelerin evlerinde konaklayarak,\\n\\nAnadolu k\u00fclt\u00fcr\u00fc konusunda
  fikir edinmelerini ve b\u00f6ylece kendi \u00f6\u011frencileriyle daha olumlu ili\u015fkiler
  kurmalar\u0131n\u0131 hedeflenmi\u015ftir.\\n\\nSOSYAL VE K\u00dcLT\u00dcREL ETK\u0130NL\u0130KLER
  ANT\u00c7EV KARMA RES\u0130M SERG\u0130S\u0130\\n\\nHer y\u0131l d\u00fczenlenen
  geleneksel ANT\u00c7EV Karma Resim Sergisi bu y\u0131l\\n\\n13.sini \\\"09 Ocak\u2013
  16 Ocak tarihleri aras\u0131nda ANSAN Galerisinde a\u00e7m\u0131\u015ft\u0131r...\\n\\nGeleneksel
  ANT\u00c7EV Karma Resim Sergileri, bug\u00fcne kadar, Antalya Sanat\u00e7\u0131lar
  Derne\u011finin (ANSAN)\\n\\n, Sergiye Kat\u0131lan De\u011ferli Sanat\u00e7\u0131lar\u0131n
  ve Sponsorlar\u0131m\u0131z\u0131n Katk\u0131lar\u0131yla ger\u00e7ekle\u015fmi\u015ftir.
  Sergiye kat\u0131lan Sanat\u00e7\u0131lar\u0131m\u0131z, sat\u0131lan eserlerden
  elde edilen gelirlerin bir k\u0131sm\u0131 ANT\u00c7EV Burs Havuzuna ba\u011f\u0131\u015flanm\u0131\u015ft\u0131r.\\n\\nHer
  sene bu serginin d\u00fczenlenmesinde b\u00fcy\u00fck katk\u0131s\u0131 olan ba\u015fta
  vak\u0131f \u00fcyemiz Hikmet\\n\\nU\u011eURLU''YA, ANSAN''A, SANAT\u00c7ILARIMIZA
  ve DE\u011eERL\u0130 SPONSORLARIMIZA bir kez daha te\u015fekk\u00fcr\u00fc bor\u00e7
  biliriz\u2026\\n\\nT\u0130YATRO G\u00d6STER\u0130LER\u0130\\n\\n3.Zil Tiyatro Toplulu\u011fu,
  Ant\u00e7ev Burslu \u00f6\u011frencileri yarar\u0131na,\\n\\n6 Nisan 2010 saat 19.30
  da B\u00fcy\u00fck\u015fehir Belediye K\u00fclt\u00fcr Salonunda \\\"Albay\u0131n
  Kar\u0131s\u0131\\\" ve 16\\n\\nOcak 2012 20.00 AKM Aspendos Salonunda oynanan \\\"Ku\u015flar\\\"
  adl\u0131 oyunu onam\u0131\u015flard\u0131r.\\n\\nOyun bilet sat\u0131\u015f\u0131nda
  Ant\u00e7ev Burs havuzuna katk\u0131 sa\u011flanm\u0131\u015ft\u0131r. Oyunun oynanmas\u0131
  i\u00e7in\\n\\nBa\u015fta \u00dcyemiz Tevfik Fikret\\n\\nK\u00fc\u00e7\u00fckerciyes''e
  ve De\u011ferli 3.Zil Tiyatro Toplulu\u011funa te\u015fekk\u00fcr\u00fc bor\u00e7
  biliriz.\\n\\nVAN DEPREM\u0130 \u0130\u00c7\u0130N YARDIM KAMPANYASI\\n\\n23 Ekim
  2011de Van''da meydana gelen deprem felaketi nedeniyle, Vak\u0131f olarak ba\u015flatt\u0131\u011f\u0131m\u0131zkampanya
  ya, \u00dcyelerimiz birlik, beraberlik ve yard\u0131mseverlik duygusuyla bu ac\u0131
  g\u00fcnde yaralar\u0131n en k\u0131sa s\u00fcrede sar\u0131lmas\u0131 i\u00e7in
  gerekli hassasiyeti g\u00f6stermi\u015ftir.\\n\\nToplanan yard\u0131m malzemeleri
  vak\u0131f merkezimizde paketlenerek, Muratpa\u015fa Belediyesi''nin afet yard\u0131m
  merkezine, Depremzedeler ula\u015ft\u0131r\u0131lmak \u00fczere teslim edilmi\u015ftir.
  Katk\u0131lar\u0131ndan dolay\u0131, \u00dcyelerimize ve g\u00f6n\u00fcll\u00fclerimize
  te\u015fekk\u00fcr ederiz.\\n\\nGEZ\u0130LER\u0130M\u0130Z, YEMEK VE BRAUNCH ETK\u0130NL\u0130KLER\u0130M\u0130Z\\n\\nBirlikte
  olmak, payla\u015fmak, daha fazla dayan\u0131\u015fma i\u00e7in y\u00f6netim kurulu
  olarak, \u00fcyelerimiz, burslu \u00f6\u011frencilerimiz ve kendini ANT\u00c7EV''li
  olarak hisseden dostlar\u0131m\u0131zla ger\u00e7ekle\u015fen etkinliklerimiz, olduk\u00e7a
  keyifli ge\u00e7mektedir.\\n\\n\u00c7AR\u015eAMBA S\u00d6YLE\u015e\u0130LER\u0130\\n\\nMart
  2008 ay\u0131ndan itibaren Vakf\u0131m\u0131z Merkezinde \u00dcyelerimiz ve \u00dcye
  d\u0131\u015f\u0131nda kat\u0131l\u0131m\u0131n a\u00e7\u0131k oldu\u011fu serbest
  konulu k\u00fclt\u00fcrel etkinlikler ba\u015flat\u0131lm\u0131\u015f, Ekim 2008
  ay\u0131ndan itibaren bu \u00e7al\u0131\u015fmalar Vakf\u0131m\u0131z ile\\n\\nREHBERANT
  Derne\u011fiyle ortakla\u015fa d\u00fczenlenerek \\\"\u00c7ar\u015famba Etkinlikleri\\\"
  ad\u0131 alt\u0131nda, s\u00fcrd\u00fcr\u00fclmektedir.\\n\\nAyl\u0131k olarak haz\u0131rlanan
  program Kent B\u00fclteninde, Vakf\u0131m\u0131z e-mail grubunda ve SMS arac\u0131l\u0131\u011f\u0131yla
  d\u00fczenli olarak duyurulmaktad\u0131r. May\u0131s sonuna kadar devam edecek etkinliklere
  g\u00f6n\u00fcll\u00fc olarak katk\u0131da bulunan \u00e7al\u0131\u015fmalar\u0131n\u0131
  bizlerle payla\u015fan, ayd\u0131nlatan de\u011ferli konuklar\u0131m\u0131za ve
  REHBERANT Derne\u011fine te\u015fekk\u00fcr ediyoruz.\\n\\nB\u00fcy\u00fck\u015fehir
  ve Muratpa\u015fa Belediyeleri ile yapm\u0131\u015f oldu\u011fumuz etkinlikler\\n\\n2013
  y\u0131l\u0131nda B\u00fcy\u00fck\u015fehir Belediyesi ile ortakla\u015fa d\u00fczenlenen
  etkinlikler se\u00e7imlerden sonra ne yaz\u0131k ki ask\u0131ya al\u0131nd\u0131.
  Ancak Muratpa\u015fa Belediye Ba\u015fkan\u0131 say\u0131n \u00dcmit Uysal bu konuda
  gereken duyarl\u0131l\u0131\u011f\u0131 g\u00f6stermi\u015f ve etkinliklerin ger\u00e7ekle\u015fmesi
  i\u00e7in gereken deste\u011fi sa\u011flam\u0131\u015ft\u0131r.\\n\\n\u00dcCRETS\u0130Z
  YABANCI D\u0130L KURSU\\n\\nVak\u0131f merkezimizde bulunan salonumuzda ak\u015fam
  saatlerinde Almanca dil e\u011fitimi kursu d\u00fczenlendi. 2015 \u015eubat ay\u0131nda
  yap\u0131lan e\u011fitim, \u00dcyemiz Sayin, Osman Kesmen taraf\u0131ndan verilmi\u015ftir.\\n\\nKERMES
  VE AT\u00d6LYE \u00c7ALI\u015eMALARIMIZ\\n\\nG\u00d6N\u00dcLL\u00dcLER\u0130M\u0130ZLE
