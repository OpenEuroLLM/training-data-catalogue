  Tarihi: 02/04/2012.\"", "\"20. Y\u00fczy\u0131l\u0131n Dengelerine Neler Oluyor?\\nDo\u00e7.
  Dr. Erel Tellal, A.\u00dc. Siyasal Bilgiler Fak\u00fcltesi\\n\\n20. y\u00fczy\u0131lda
  d\u00fcnya, bir b\u00fcy\u00fck devrim ve iki b\u00fcy\u00fck sava\u015f\u0131n
  ard\u0131ndan uluslararas\u0131 sistemde iki kutuplu bir yap\u0131 ile dengeye kavu\u015fmu\u015f
  g\u00f6r\u00fcn\u00fcyor. En az\u0131ndan y\u00fczy\u0131l\u0131n sonundan bakan
  bir ara\u015ft\u0131rmac\u0131 bu saptamay\u0131 rahatl\u0131kla yapabilir. 21.
  y\u00fczy\u0131l\u0131n ba\u015f\u0131ndan bak\u0131nca ise ba\u015fka bir manzaraya
  kar\u015f\u0131l\u0131yoruz: S\u00f6z\u00fc edilen \u201cdenge\u201d ad\u0131n\u0131
  bozuluyor. 11 Eyl\u00fcl Sald\u0131r\u0131lar\u0131 sonras\u0131nda h\u0131z kazanan
  geli\u015fmeler, bu saptamay\u0131 hakl\u0131 k\u0131lacak verilerle dolu. Son olarak
  ge\u00e7ti\u011fimiz 2007 y\u0131l\u0131, yeni y\u00fczy\u0131lda eski denge unsurlar\u0131n\u0131n
  yerinde yeller esti\u011fine tank\u0131l\u0131k etti. Bu de\u011ferlendirme yaz\u0131s\u0131nda,
  20. y\u00fczy\u0131l\u0131n ikinci yar\u0131s\u0131nda kurulan dengenin ne oldu\u011fu,
  ortadan kalk\u0131\u015f s\u00fcreci ile birlikte ele al\u0131nacakt\u0131r.\\n\\n19.
  y\u00fczy\u0131lda Avrupa\u2019da egemen olan 1815 tarihli (\u201cpentar\u015fik\u201d)
  Viyana Sistemi, eksiklik ve yanl\u0131\u015f\u0131lar\u0131yla 1848 (Avrupa\u2019da
  proleter kalk\u0131\u015fmalar), bilemediniz 1871\u2019e (Alman ulusal birli\u011fi)
  de\u011fin s\u00fcrm\u00fc\u015f, \u015eansolye Bismarck\u2019\u0131n ittifaklar
  sistemiyle uzatmalar\u0131 oynam\u0131\u015ft\u0131r. 20. y\u00fczy\u0131lda yeni
  bir denge, ancak II. D\u00fcnya Sava\u015f\u0131\u2019n\u0131n ard\u0131ndan So\u011fuk
  Sava\u015f ortam\u0131nda sa\u011flam\u0131\u015ft\u0131r. Kolay oldu\u011fu s\u00f6ylenemez:
  Bir yandan Avrupa (Almanyalar gibi) Do\u011fu ve Bat\u0131 olmak \u00fczere ikiye
  ayr\u0131lm\u0131\u015f, \u00f6te yandan ortaya \u00e7\u0131kan iki blok aras\u0131nda
  d\u00fcnya \u00e7ap\u0131nda etkinlik savas\u0131m\u0131 ya\u015fam\u0131\u015f,
  e\u015f zamanl\u0131 olarak iki s\u00fcper g\u00fc\u00e7 ABD ve SSCB aras\u0131nda
  h\u0131zla bir n\u00fckleer silahlanma yar\u0131\u015f\u0131 ba\u015flam\u0131\u015ft\u0131r.
  So\u011fuk Sava\u015f\u2019\u0131n zirve noktas\u0131 olarak g\u00f6sterilen K\u00fcba
  bunalm\u0131nda iki s\u00fcper g\u00fcc\u00fcn sahip olduklar\u0131 n\u00fckleer
  silahlar\u0131 kullanma noktas\u0131na gelmeleri ayn\u0131 zamanda \u201cYumu\u015fama\u201dn\u0131n
  da ba\u015flang\u0131c\u0131 olmu\u015ftur. S\u00f6z\u00fc edilen \u201cdenge\u201d
  ancak yumu\u015fama d\u00f6neminde olanak kazanm\u0131\u015ft\u0131r.\\n\\nSo\u011fuk
  Sava\u015f\u2019taki dengenin iki temel dire\u011finden s\u00f6z edilebilir: \u0130kinci,
  n\u00fckleer dengedir. K\u00fcba bunalm\u0131n\u0131n ard\u0131ndan (1968 tarihli
  N\u00fckleer Silahlar\u0131n Yay\u0131lmas\u0131\u2019n\u0131n \u00d6nlenme S\u00f6zle\u015fmesi
  gibi) \u00e7ok tarafl\u0131 \u00e7abalard\u0131n yan\u0131 s\u0131ra ABD ve SSCB
  silahs\u0131zlanma g\u00f6r\u00fc\u015fmelerine ba\u015flam\u0131\u015flard\u0131r.
  Di\u011fer \u00f6nemli anla\u015fmalar\u0131n yan\u0131 s\u0131ra, 1972 tarihli
  ABM (Anti-balistik F\u00fcze) Antla\u015fmas\u0131\u2019yla bir denge sa\u011flam\u0131\u015flard\u0131r.
  Taraflar, bu antla\u015fmayla \u00e7ok basit bir anlat\u0131mla n\u00fckleer ba\u015fl\u0131k
  ta\u015f\u0131yan f\u00fczeleri hedeflerine ula\u015fmadan havada (uzayda) yok e\u062f\u0647cek
  f\u00fcze yap\u0131m\u0131n\u0131 yasaklam\u0131\u015flar, ba\u015fka bir deyi\u015fle
  n\u00fckleer \u015femsiyelerini kar\u015f\u0131l\u0131kl\u0131 olarak\\n\\nkapatm\u0131\u015flard\u0131r.
  Bu, her iki taraf\u0131 da n\u00fckleer hedef haline getirmi\u015f ve gerek ABD,
  gerek SSCB 1950\u2019lerdeki \u00e7\u0131\u011fl\u0131nca silahlanma yar\u0131\u015f\u0131ndan
  kopmu\u015flard\u0131r. S\u00f6z konusu geli\u015fme, teknoloji geli\u015ftirme
  \u00e7abalar\u0131n\u0131 sonland\u0131rmad\u0131ysa da, n\u00fckleer silahlarla
  \u201cvurulgan\u201d hale gelen iki s\u00fcper g\u00fc\u00e7 bu temel \u00fczerinde
  silahs\u0131zlanma \u00e7abalar\u0131n\u0131 s\u00fcrd\u00fcrm\u00fc\u015flerdir.\\\\(^1\\\\)
  Bu kapsamda 1987\u2019de imzalanan INF Antla\u015fmas\u0131yla, varolan t\u00fcm
  orta menzilli f\u00fczeler ortadan kald\u0131r\u0131lm\u0131\u015f, b\u00f6ylece
  Avrupa k\u0131tas\u0131 olas\u0131 bir n\u00fckleer sava\u015f alan\u0131 olmaktan
  \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r.\\n\\n**\u0130kincisi,** Avrupa\u2019da
  konvansiyonel dengedir. Neredeyse e\u015f zamanl\u0131 bi\u00e7imde Avrupa G\u00fcvenlik
  ve \u0130\u015fbirli\u011fi Konferans\u0131 \u00e7al\u0131\u015fmalar\u0131 ba\u015flam\u0131\u015f,
  1975 Helsinki Son Senediyle ta\u00e7lanm\u0131\u015ft\u0131r. Son Senet, sava\u015f
  sonras\u0131nda Avrupa\u2019da s\u0131n\u0131rlar\u0131n kabul edildi\u011fi ilk
  belgedir (I. Sepet). SSCB, Bat\u0131\u2019ya bunu kabul ettirirken, kar\u015f\u0131l\u0131\u011f\u0131nda
  \u201cinsan haklar\u0131\u201dn\u0131n bir devletin i\u00e7i\u015fleri olamayaca\u011f\u0131
  \u00f6d\u00fcn\u00fcn\u00fc vermi\u015ftir (III. Sepet). Yar\u0131 s\u0131ra ekonomik,
  teknolojik i\u015fbirli\u011fi (II. Sepet) ba\u015fta Do\u011fu Avrupa \u00fclkeleri
  olmak \u00fczere, SSCB\u2019nin Bat\u0131\u2019ya olan ba\u011f\u0131ml\u0131l\u0131\u011f\u0131n\u0131
  artt\u0131rm\u0131\u015ft\u0131r. Helsinki\u2019yle ba\u015flayan s\u00fcre\u00e7
  burada kalmam\u0131\u015f, 1990\u2019da imzalanan Avrupa Konvansiyonel Kuvvetler
  Antla\u015fmas\u0131yla (AKKA), bu co\u011frafya olas\u0131 konvansiyonel sava\u015f
  tehdidinden azad edilmeye \u00e7al\u0131\u015f\u0131lm\u0131\u015ft\u0131r. \u0130mzac\u0131
  devletler, konvansiyonel g\u00fc\u00e7lerini en az d\u00fczeyde indirmekle kalmam\u0131\u015flar,
  o g\u00fcne dek geli\u015ftirilen en kapsaml\u0131 denetim d\u00fczeneklerini de
  kabul etmi\u015flerdir.\\n\\n\u0130ki kutuplu sistemin son ermesinin ard\u0131ndan
  ge\u00e7en 15 y\u0131l i\u00e7erisinde ya\u015fanan geli\u015fmelerle bu \u201cdenge\u201d
  tamamen bozulmu\u015ftur. Ku\u015fkusuz s\u00fcre\u00e7, \u00f6ncelikle Do\u011fu
  Blo\u011fu\u2019nun, hemen ard\u0131ndan SSCB\u2019nin y\u0131k\u0131lmas\u0131yla
  ba\u015flam\u0131\u015ft\u0131r. \u0130lk 10 y\u0131l i\u00e7erisinde Avrupa\u2019da
  \u201cde\u011fi\u015fmezli\u011fi\u201d \u00fczerine hemfikir olunan s\u0131n\u0131rlar
  birer birer yeniden \u00e7izilmi\u015ftir: Almanyalar birle\u015fmi\u015f, Yugoslavya
  \u201cmolek\u00fcllerine ayr\u0131lm\u0131\u015f\u201d,\\\\(^2\\\\) \u00c7ekoslovakya
  \u201cmedeni\u201d bi\u00e7imde \u201cbo\u015fanm\u0131\u015ft\u0131r\u201d. S\u00fcrecin
  hemen ba\u015f\u0131nda g\u00f6rev tan\u0131\u0131m ve alan\u0131n\u0131 yeniden
  belirleyen NATO, yeni kimli\u011filey bir iki istisna d\u0131\u015f\u0131nda do\u011fu
  Avrupa\u2019n\u0131n tamam\u0131n\u0131 i\u00e7erisine alm\u0131\u015ft\u0131r.
  AB i\u00e7erisindeki b\u00fct\u00fcnle\u015fme s\u00fcrecinde derinle\u015fme ile
  geni\u015fleme atba\u015f\u0131 gitmi\u015ftir. Bu s\u00fcre i\u00e7erisinde, kendisine
  SSCB\u2019den kalan miraslardan biri olarak AKKA\u2019y\u0131 kabul eden Rusya Federasyonu
  (RF), 1994-1996 y\u0131llar\u0131nda ya\u015fad\u0131\u011f\u0131 I. \u00c7e\u00e7enya
  Sava\u015f\u0131 ve sonras\u0131nda Antla\u015fma\u2019n\u0131n gerektirdi\u011fi
  d\u00fczenlemeleri Kafkaslar b\u00f6lgesinde uygulamakta zorlanm\u0131\u015f, bunu
  ba\u015faramam\u0131\u015f, y\u00fcr\u00fctt\u00fc\u011f\u00fc yo\u011fun diplomasi\\n\\n---\\n\\n1
  Bu geli\u015fmelerin kapitalist ekonomik sisteme tkanman\u0131n ya\u015fad\u0131\u011f\u0131,
  bu ba\u011flamda ABD\u2019nin hem ekonomik ve hem de (Vietnam i\u015fgal\u00fc nedeniyle)
  siyasal anlamda bunalma girdi\u011fi d\u00f6neme rastlamas\u0131 maniard\u0131r.\\n\\n2
  Do\u011fu Avrupa\u2019n\u0131n \u201csisteme eklenmesi\u201d s\u00fcrecinde neredeyse
  yaln\u0131zca eski Yugoslavya\u2019da kan d\u00f6k\u00fclmesi de maniard\u0131r.
  1990\u2019lardaki \u201cmedeniyetler \u00e7at\u0131\u015fmas\u0131\u201d senaryosu
  \u00f6ncelikle burada sahneye konmu\u015f ve \u201cdenetlenebilir\u201d \u00e7at\u0131\u015fmalar\u0131n
  \u00f6n\u00fc a\u00e7\u0131lm\u0131\u015ft\u0131r.\\n\\nyard\u0131myla 1999 \u0130stanbul
  Zirvesi\u2019nde ek d\u00fczenlemeleri taraflara kabul ettirmi\u015ftir. Bu tarihten
  sonra iki \u00f6nemli geli\u015fme AKKA ile sa\u011flanan konvansiyonel dengenin
  sonunu getirmi\u015ftir. Birincisi, aradan sekiz y\u0131l ge\u00e7mesine kar\u015f\u0131n
  NATO \u00fcyesi \u00fclkelerin hi\u00e7 biri antla\u015fman\u0131n 1999\u2019da
  d\u00fczenlenenmi\u015f bi\u00e7imini parlamentolar\u0131ndan ge\u00e7irmemi\u015fler
  ve uygulamaya sokmam\u0131\u015flard\u0131r. \u0130kincisi, Antla\u015fma\u2019ya
  ba\u015f\u0131ndan ba\u015flayarak kat\u0131lmayan Balt\u0131k \u00fclkeleri ile
  ayr\u0131lmadan sonra kat\u0131lmaya yana\u015fmayan \u00c7ek Cumhuriyeti\u2019nin
  NATO \u00fcyelikleri zaten dengeyi sa\u011flamas\u0131 beklenen d\u00fczenlemeler
  i\u00e7in \u201ckara delikler\u201d olu\u015fturmu\u015ftur. S\u00fcrecin sonunda,
  s\u00f6z\u00fc edilen geli\u015fmelerden rahats\u0131z olan RF\u2019nin de 2007
  i\u00e7erisinde AKKA\u2019dan \u00e7ekilmesiyle Avrupa\u2019da kurulan konvansiyonel
  denge son bulmu\u015f g\u00f6r\u00fcnmektedir.\\n\\nN\u00fckleer dengenin sona ermesi
  de birka\u00e7 a\u015famada ger\u00e7ekle\u015fmi\u015ftir. ABD taraf\u0131ndan
  1972 ABM Antla\u015fmas\u0131\u2019n\u0131 ortadan kald\u0131r\u0131m\u0131ya y\u00f6nelik
  ilk giri\u015fim 1980\u2019lerin ba\u015f\u0131nda Ba\u015fkan Reagan d\u00f6neminde
  \u201cY\u0131ld\u0131z Sava\u015flar\u0131 Projesi\u201d ad\u0131 alt\u0131nda ba\u015flat\u0131lm\u0131\u015ft\u0131r.
  Buna gerek\u00e7e olarak SSCB\u2019nin Aral\u0131k 1979\u2019da Afganistan\u2019a
  m\u00fcdahalesi g\u00f6sterilmi\u015f ve ekonomik ambargo e\u015flik etmi\u015ftir.
  Ama\u00e7, zaten \u00e7\u00f6k\u00fcn\u00fct\u00fc i\u00e7ersindeki Sovyet ekonomisini
  yeni bir silahlanma yar\u0131\u015f\u0131na zorlayarak \u00e7\u00f6ke\u011fermektir.
  Bu giri\u015fimi \u00f6neleyen Garba\u00e7ov ve onun d\u0131\u015f politikas\u0131,
  \u201cyeni d\u00fc\u015f\u00fcnce\u201d olmu\u015ftur. SSCB\u2019nin ABD\u2019yi
  bu giri\u015fiminden alkoymaya y\u00f6nelik izledi\u011fi politika ba\u015far\u0131l\u0131
  olsa da, bu onun \u00e7\u00f6k\u00fc\u015f\u00fcn\u00fc engellememi\u015ftir. 1990\u2019lar\u0131n
  ba\u015f\u0131nda ABD\u2019nin \u00f6nceli\u011fi Rusya\u2019d\u0131r (izledi\u011fi
  politikan\u0131n ad\u0131 ise \u201cRussia first\u201d). 1996\u2019da Yeltsin\u2019in
  ikinci kez se\u00e7ilmesinin ard\u0131ndan bu politika a\u015famalarla terk edilse
  ve Clinton\u2019\u0131n ikinci d\u00f6neminde f\u00fcze kar\u015f\u0131t\u0131 f\u00fczelerin
  \u00fcretimi yeniden g\u00fcndeme gelse de s\u00fcrecin ba\u015flang\u0131\u00e7
  kurdelas\u0131n\u0131 kesmek George W. Bush\u2019a kalm\u0131\u015ft\u0131r. G\u00f6reve
  geldi\u011fi g\u00fcnden ba\u015flayarak \u201cUlusal F\u00fcze Savunma Sistemi\u201d
  ad\u0131 alt\u0131nda bu proje i\u00e7in \u00e7al\u0131\u015fan W. Bush, 11 Eyl\u00fcl\u2019\u00fcn
  ard\u0131ndan Aral\u0131k 2001\u2019de ABM Antla\u015fmas\u0131\u2019ndan resmen
  \u00e7ekilmi\u015ftir. Bu tarihten ba\u015flayarak f\u00fcze kar\u015f\u0131t\u0131
  f\u00fcze denemeleri s\u00fcrd\u00fcr\u00fclmektedir. 2007\u2019de g\u00fcndeme
  gelen bir boyutu ise, ABD\u2019nin \u201cF\u00fcze Kalkan\u0131\u201dn\u0131n Avrupa
  aya\u011f\u0131m\u0131 \u00c7ek Cumhuriyeti ile Polonya\u2019ya kurmak istemesi
  ve ilgili devletlerin bunu kabul etmesi olmu\u015ftur. ABD, buna gerek\u00e7e olarak
  \u0130ran\u2019dan gelen tehdidi g\u00f6sterdiyse de, bu en az\u0131ndan RF taraf\u0131ndan
  inand\u0131r\u0131c\u0131 bulunmam\u0131\u015ft\u0131r. Zira, \u0130ran\u2019dan
  Avrupa ya da ABD\u2019ye bir n\u00fckleer sald\u0131r\u0131 olas\u0131l\u0131\u011f\u0131
  yoktur. 2008\u2019in ba\u015flar\u0131nda ABD\u2019y\u0131 n\u00fckleer silahlarla
  tehdit edebilecek tek devlet RF\u2019dir. Bu nedenle, ABD\u2019nin giri\u015fimlerinden
  do\u011frudan tehdit alglayan devlet de RF\u2019dir. Bu kayg\u0131 Ba\u015fkan Putin
  taraf\u0131ndan 10 \u015eubat 2007 tarihli M\u00fcnih Konu\u015fmas\u0131\u2019nda
  a\u00e7\u0131k\u00e7a dile getirilmi\u015ftir: \u201c\u2026F\u00fcze savar savunma
  sistemini Avrupa\u2019da geni\u015fle\u015ftirme planlar\u0131, sadece bizi rahats\u0131z
  edebilir. Gelecek a\u015famasi ka\u00e7\u0131n\u0131lmaz bir silahlanma yar\u0131\u015f\u0131
  olacak bu \u015feye kim ihtiya\u00e7 duymaktad\u0131r?\u201d. Kisacas\u0131, 11
  Eyl\u00fcl\u2019\u00fcn ard\u0131ndan ABD\u2019nin ABM\u2019den \u00e7ekilmesine
  ses \u00e7\u0131karmayan RF, F\u00fcze Kalkan\u0131\u2019n\u0131n Do\u011fu Avrupa\u2019da
  kurulmas\u0131na seyirci kalmayaca\u011f\u0131n\u0131 g\u00f6stermi\u015ftir. Tepki
  olarak bir yandan n\u00fckleer f\u00fcze teknolojisini geli\u015ftirmeye y\u00f6nelmi\u015f,
  \u00f6te yandan INF Antla\u015fmas\u0131\u2019n\u0131n g\u00f6zden ge\u00e7irilmesini
  g\u00fcndeme getirmi\u015ftir. Sonu\u00e7ta, n\u00fckleer denge de ad\u0131m ad\u0131m
  ortadan kalkmaktad\u0131r.\\n\\nSSCB\u2019nin y\u0131k\u0131lmas\u0131n\u0131n d\u00fcnya
  tarihi a\u00e7\u0131s\u0131ndan sonu\u00e7lar\u0131 yava\u015f yava\u015f ortaya
  \u00e7\u0131kmaya ba\u015flamaktad\u0131r. Bunlardan biri de 20. y\u00fczy\u0131lda
  en az\u0131ndan kuzey yar\u0131mk\u00fcrede sa\u011flanan askeri dengenin bozulmas\u0131d\u0131r.
  W. Bush \u00f6nderli\u011findeki ABD yeni y\u00fczy\u0131lda \u201cimparatorluk\u201d
  \u00f6zlemiyle emperyalist politikalar izlemi\u015ftir. Art\u0131k s\u00f6z konusu
  olan Avrupa\u2019d\u0131r. ABD\u2019nin Avrupa\u2019daki geleneksel muhalifleri
  Almanya ve Fransa Merkel/Sarkozy iktidarlar\u0131nda bu \u00e7izgilerinden ayr\u0131lm\u0131\u015f
  g\u00f6r\u00fcnse de, yak\u0131n gelecekte bu konumlar\u0131n\u0131 sorgulamak zorunda
  kalacaklard\u0131r. W. Bush d\u00f6neminde Avrupa\u2019da tek muhalif ses Putin
  \u00f6nderli\u011findeki RF\u2019den y\u00fckselmi\u015ftir. 2008 hem RF hem de
  ABD i\u00e7in se\u00e7im y\u0131l\u0131d\u0131r. RF\u2019de Mart ay\u0131nda yap\u0131lacak
  se\u00e7imlerin sonucu \u015fimdiden \u00f6ng\u00f6r\u00fclebilir. Zira, ikinci
  g\u00f6rev s\u00fcresi dolan Putin, yerine halefi olarak Medvedev\u2019i g\u00f6stermi\u015f,
  kendisi de Ba\u015fbakanl\u0131\u011f\u0131n\u0131 yapmaktan mutluluk duyaca\u011f\u0131n\u0131
  belirtmi\u015ftir. ABD\u2019de ise durum biraz daha kar\u0131\u015f\u0131k g\u00f6r\u00fclmektedir.
  Yeni ba\u015fkan\u0131n Demokrat m\u0131 Cumhuriyet\u00e7i mi; (e\u011fer Demokrat
  olacaks\u0131) Obama m\u0131 Clinton mu olaca\u011f\u0131 \u00f6nem kazanmaktad\u0131r.
  Zira, ABD ekonomisinde k\u0131sa/orta erimde bir bunal\u0131m beklentisi yan\u0131nda,
  t\u00fcm d\u00fcnyada \u201cimparatorluk\u201da soyunan bu devlet, Irak\u2019tan
  Afganistan\u2019a, Iran\u2019dan El-Kaide\u2019ye bir dizi sorun yumu\u015f\u0131n\u0131n
  i\u00e7ine g\u00f6m\u00fclm\u00fc\u015f durumdad\u0131r. \u00d6n\u00fcm\u00fczde
  yeni dengelerin aranaca\u011f\u0131 bir d\u00f6nem s\u00f6z konusudur. Ku\u015fkusuz,
  bu d\u00f6nemde Japonya, \u00c7in Halk Cumhuriyeti gibi kat\u0131l\u0131mc\u0131lar
  da \u00f6nemli rol oynayacaklard\u0131r. Yine de as\u0131l g\u00fc\u00e7 savas\u0131n\u0131
  iki \u00f6nemli n\u00fckleer g\u00fc\u00e7 olan ABD ve RF aras\u0131nda ge\u00e7ecek
  gibi g\u00f6r\u00fclmektedir.\""]'
