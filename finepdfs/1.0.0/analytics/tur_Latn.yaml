  ba\u015flat\u0131lm\u0131\u015ft\u0131r.\\n\\nEkonomik deste\u011fe ihtiyac\u0131
  olan, \u00fcniversite \u00f6\u011frencilerinin bar\u0131nma sorununa \u00e7\u00f6z\u00fcm
