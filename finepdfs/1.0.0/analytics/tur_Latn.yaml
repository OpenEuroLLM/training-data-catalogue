  yap\u0131m\u0131 tamamlanm\u0131\u015ft\u0131r. Bu yap\u0131n\u0131n zemin kat\u0131nda
  vakf\u0131n di\u011fer sosyal projelerine kaynak yaratmak \u00fczere 4 adet d\u00fckk\u00e2n
  bulunmaktad\u0131r. Projenin yap\u0131m\u0131 i\u00e7in sat\u0131n al\u0131nan arsa
  430 m2 olup, toplam 2000 metrekare in\u015faat alan\u0131na sahiptir, \u015fehrin
  merkezinde yer almaktad\u0131r. Yak\u0131n \u00e7evresi dezavantajl\u0131 ailelerin
  ya\u015fam alan\u0131d\u0131r, ayr\u0131ca orta \u00f6\u011fretim ile ilgili e\u011fitim
  kurumlar\u0131 yo\u011funlu\u011fu vard\u0131r. Gen\u00e7lik merkezinde ger\u00e7ekle\u015ftirilecek
  sosyal projeler ile bu ailelerin \u00e7ocuklar\u0131, ebeveynleri, burslu \u00f6\u011frencilerimizle
