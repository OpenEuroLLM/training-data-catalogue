  uygun yerler olmal\u0131d\u0131r.\\n\\n12.\\n\\nMasa gruplar\u0131nda her iki veya
  \u00fc\u00e7 \u00f6\u011frenci i\u00e7in bir adet monit\u00f6r olmal\u0131d\u0131r.
  Bu monit\u00f6rlerin \u00f6zellikleri a\u015fa\u011f\u0131daki gibi olmal\u0131d\u0131r;\\n\\n-
