  Tezi, Ortado\u011fu Teknik \u00dcniversitesi, Sosyal Bilimler Enstit\u00fcs\u00fc,
  Ankara 2009, s.27-34\\n\\n\\\\textsuperscript{31} Mary Caroline Holmes, Urfa Ermeni
  Yetimhanesi (1919-1921), \u00c7ev: Vedii \u0130lmen, Yaba Yay\u0131nlar\u0131, s.
  23-26\\n\\n\\\\textsuperscript{32} Haluk Selvi, Birinci D\u00fcnya Sava\u015f\u0131ndan
  Lozan\u2019a Ermeni Sorunu, Sakarya \u00dcniversitesi Rekt\u00f6rl\u00fc\u011f\u00fc
  Yay\u0131nlar\u0131 2. Bask\u0131, Sakarya 2004, s.110-114\\n\\nolarak kabul edilip
  orada ya\u015fayan Hristiyan az\u0131nl\u0131klar incelenir e\u011fer b\u00f6yle
  bir durum s\u00f6z konusu yoksa bu b\u00f6lgelere di\u011fer yetimhanelerden \u00e7ocuk
  g\u00f6t\u00fcr\u00fcl\u00fcp hemen orada bir yetimhane kurma \u00e7al\u0131\u015fmas\u0131
  ba\u015flat\u0131l\u0131r. Amerikan m\u00fcesseslerinin Anadolu\u2019nun bir\u00e7ok
  b\u00f6lgesine yay\u0131lmas\u0131 ve Amerikan misyonerlerinin y\u00f6netimi alt\u0131nda
  idare edilen Ermeni yetim ve \u00f6ks\u00fczlerinin bak\u0131ld\u0131\u011f\u0131
  yetimhanelerin Do\u011fu ve G\u00fcneydo\u011fu Anadolu b\u00f6lgelerinde ve hatta
  daha sonraki y\u0131llarda Suriye ve Irak topraklar\u0131nda say\u0131ca fazla olmalar\u0131n\u0131n
  alt\u0131nda bu zihniyet yap\u0131s\u0131 yatmaktad\u0131r\\\\(^{33}\\\\). 2010
  y\u0131l\u0131nda meydana gelen Haiti depremi sonras\u0131nda b\u00f6lgeye intikal
  eden Amerikal\u0131 misyonerlerin 33 yetim \u00e7ocu\u011fu ka\u00e7\u0131rma giri\u015fimleri
  bu zihniyetin halen devam etti\u011fi bize a\u00e7\u0131k\u00e7a g\u00f6stermektedir\\\\(^{34}\\\\).
  Ayr\u0131ca 2003 Irak-ABD sava\u015f\u0131nda Amerikan askerlerinin ard\u0131ndan
  Irak\u2019a giren Amerikal\u0131 misyonerlerin, sava\u015fan asker say\u0131s\u0131ndan
  fazla olmas\u0131 ve g\u00fcn\u00fcm\u00fczde Ortado\u011fu\u2019nun \u00f6nemli
  devletlerinden biri olan kom\u015fumuz Suriye\u2019de yard\u0131m ad\u0131 alt\u0131nda
  ger\u00e7ekle\u015ftirilen misyonerlik faaliyetlerinin ka\u00e7 yetim ve \u00f6ks\u00fcz
  \u00e7ocu\u011fu etkisi alt\u0131na ald\u0131\u011f\u0131 \u00f6nemli bir konudur
  \u00fczerinde durulmas\u0131 gerekiyor\\\\(^{35}\\\\). T\u00fcm bu \u00f6rnekler
  g\u00f6steriyor ki ABD\u2019nin bu topraklarda 18. y\u00fczy\u0131lda ba\u015flayan
  a\u00e7\u0131k kap\u0131 emperyalizm hareketi halen devam etmektedir\\\\(^{36}\\\\).\\n\\nAnadolu\u2019daki
  S\u00fcryaniler hakk\u0131nda \u00f6nemli \u00e7al\u0131\u015fmalara imza atm\u0131\u015f
  Mehmet \u00c7elik, ba\u015fta Protestan misyonerleri olmak \u00fczere di\u011fer
  misyoner gruplar\u0131n\u0131n Anadolu\u2019da ba\u015far\u0131l\u0131 olmalar\u0131n\u0131n
  en \u00f6nemli nedeni yapm\u0131\u015f olduklar\u0131 faaliyetler de\u011fil aksine
  kendi kiliselerinden aforoz edilip kovulan, sosyal, dini ve ekonomik hayatlar\u0131nda
  yaln\u0131z kalan az\u0131nl\u0131k tebaan\u0131n misyonerleri bir sig\u0131nma
  liman\u0131 olarak g\u00f6rmesinden kaynakland\u0131\u011f\u0131n\u0131 belirtmektedir\\\\(^{37}\\\\).
  Mehmet \u00c7elik, bu teorisinde hakl\u0131d\u0131r. \u00d6zellikle Ermeni kilisesinden
  aforoz cezas\u0131na \u00e7arpt\u0131r\u0131lan Ermeniler kendi cemaatleri i\u00e7inde
  ya\u015fayan \u00f6l\u00fclere d\u00f6n\u00fckmekte, h\u00e2yattaki bir\u00e7ok
  hakk\u0131ndan mahrum kalmakta ve hatta \u00f6ld\u00fcklerinde dah\u0131 Ermeni
  mezarl\u0131klar\u0131na g\u00f6m\u00fclmeyip cesetleri a\u00e7\u0131kta b\u0131rak\u0131lmaktayd\u0131\\\\(^{38}\\\\).
  Ermeni\\n\\n---\\n\\n\\\\(^{33}\\\\) Salih \u00d6zkan, T\u00fcrkiye\u2019de Dar\u00fcleytamlar\u0131n
