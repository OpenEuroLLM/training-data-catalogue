  firstname.lastname@example.org\\n\\nMetrikler\"", "\"Bu tasarruf sahiplerine sat\u0131\u015f
  duyurusu, Sermaye Piyasas\u0131 Kurulu (\u201cKurul\u201d)\u2019na 12.02.2018 tarihinde
  onaylanm\u0131\u015ft\u0131r.\\n\\nOrtakl\u0131\u011f\u0131m\u0131z\u0131n \u00e7\u0131kar\u0131lm\u0131\u015f/\u00f6denmi\u015f
  sermayesinin 60.000.000 TL\u2019den 105.000.000 TL\u2019ye \u00e7\u0131kar\u0131lmas\u0131
  nedeniyle yeni pay alma haklar\u0131n\u0131n kullan\u0131lmas\u0131ndan sonra kalan
  toplam 6.998.215.663 TL nominal de\u011ferli paylar\u0131n halka arz\u0131na ili\u015fkin
  duyurudur.\\n\\nAncak izahnamenin ve i\u015fbu duyurunun onaylanmas\u0131 s\u00f6z
