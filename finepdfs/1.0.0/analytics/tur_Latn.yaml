  OKTAY\\nKamp\\n\\nA.B\\n5966/14.6.2017\"", "\"-\u0130\u00e7eceklerden \u00e7ay\u0131
  \u00e7ok, kolay\u0131 hi\u00e7 sevmezdim.\\n-Annesini her zaman \u00f6zler, s\u00fcrekli
  dua ederdi.\\n-K\u0131rtasiyeden kalem ald\u0131, \u00e7antas\u0131na koydu.\\n\\n1-Yukar\u0131daki
  \u00f6rneklerde a\u015fa\u011f\u0131dakilerden hangisiyle ilgili bir anlat\u0131m
  bozuklu\u011fu yap\u0131lmam\u0131\u015ft\u0131r?\\n\\nANLATIM BOZUKLU\u011eU\\n\\nYi\u011fidi
  siz vefay\u0131 da biz g\u00f6md\u00fck.\\n\\n8-C\u00fcmlesindeki anlat\u0131m bozuklu\u011funun
  nedeni a\u015fa\u011f\u0131dakilerden hangisinde do\u011fru belirtilmi\u015ftir?\\n\\nA)
  Tamlama eksikli\u011fi                  B) Y\u00fcklem eksikli\u011fi\\n\\nA) \u00d6zne
  eksikli\u011fi                       B) Y\u00fcklem eksikli\u011fi\\n\\nC) Yer tamlay\u0131c\u0131s\u0131
  eksikli\u011fi       D) Nesne eksikli\u011fi\\n\\nAksam yeme\u011fini yedikten sonra
  ben masay\u0131, Danyal oday\u0131 d\u00fczenledi.\\n\\n2-C\u00fcmlesindeki anlat\u0131m
  bozuklu\u011funun nedeni a\u015fa\u011f\u0131dakilerden hangisinde do\u011fru belirtilmi\u015ftir?\\n\\nA)
  Tamlama eksikli\u011fi                 B) Y\u00fcklem eksikli\u011fi\\n\\nC) Yer
  tamlay\u0131c\u0131s\u0131 eksikli\u011fi        D) Nesne eksikli\u011fi\\n\\nAr\u0131za
  nedeniyle \u00e7ok say\u0131da resmi daire ve evlerde bir sure elektrikler kesildi.\\n\\n3-C\u00fcmlesindeki
  anlat\u0131m bozuklu\u011fu nas\u0131l giderilir?\\n\\nA) \u00e7ok say\u0131da yerine,
  pek \u00e7ok getirilmeli\\n\\nB) Y\u00fcklem yoktu olarak de\u011fi\u015ftirilmeli\\n\\nC)
  bir sure yerine, uzun zaman getirilmeli\\n\\nD) resmi daire ve evlerde yerine resmi
  dairede ve evde getirilmeli\\n\\nSon teknolojiyle \u00fcretilen cihazlar, insanlara
  pek \u00e7ok kolayl\u0131k sunuyorlar.\\n\\n4-C\u00fcmlesindeki anlat\u0131m bozuklu\u011funun
  nedeni a\u015fa\u011f\u0131dakilerden hangisinde do\u011fru belirtilmi\u015ftir?\\n\\nA)
  Tamlama eksikli\u011fi       B) Y\u00fcklem eksikli\u011fi\\n\\nC) \u00d6zne eksikli\u011fi              D)
  \u00d6zne-y\u00fcklem uyumsuzlu\u011fu\\n\\nEkonomik ve sa\u011fl\u0131k faaliyetleri
  ile ilgili faaliyet raporu haz\u0131rlad\u0131.\\n\\nHer zaman dersine \u00e7al\u0131\u015f\u0131r,
  \u00fcmidini yitirmezdi.\\n\\nHerkes onu su\u00e7luyor, onun s\u00f6zlerine ald\u0131r\u0131\u015f
  etmiyordu.\\n\\n5-Yukar\u0131daki \u00f6rneklerde a\u015fa\u011f\u0131dakilerden
  hangisiyle ilgili\\n\\nbir anlat\u0131m bozuklu\u011fu yap\u0131lmam\u0131\u015ft\u0131r?\\n\\nA)
  \u00d6zne eksikli\u011fi                        B) Zarf t\u00fcmleci eksikli\u011fi\\n\\nC)
  Yer tamlay\u0131c\u0131s\u0131 eksikli\u011fi        D) Tamlama eksikli\u011fi\\n\\nGitti
  gideli ne telefon ne de mektup yazd\u0131 bize.\\n\\n6-C\u00fcmlesindeki anlat\u0131m
  bozuklu\u011fu hangisi ile giderilebilir?\\n\\nA) \\\"bize\\\" s\u00f6zc\u00fc\u011f\u00fc
  at\u0131larak\\n\\nB) \\\"de\\\" ba\u011flac\u0131 c\u00fcmleden \u00e7\u0131kar\u0131larak.\\n\\nC)
  \\\"telefon\\\" s\u00f6zc\u00fc\u011f\u00fcnden sonra \\\"a\u00e7t\u0131\\\" s\u00f6zc\u00fc\u011f\u00fc
  getirilerek\\n\\nD) \\\"Gideli\\\" s\u00f6zc\u00fc\u011f\u00fc c\u00fcmleden \u00e7\u0131kar\u0131larak.\\n\\n7-
  A\u015fa\u011f\u0131dakilerin hangisinde bir anlat\u0131m bozuklu\u011fu yoktur?\\n\\nA)
  Y\u00fcz\u00fcme dikkatle bak\u0131yor ve dinliyor.\\n\\nB) Herkese sayg\u0131s\u0131
  var, korkusu yoktu.\\n\\nC) \u0130slerini bir plan ve program dahilinde y\u00fcr\u00fct\u00fcrd\u00fc.\\n\\nD)
  Sa\u011fl\u0131kl\u0131 ve s\u0131hhatli nesiller yeti\u015ftirmek her milletin
  amac\u0131d\u0131r.\\n\\nC) Yer tamlay\u0131c\u0131s\u0131 eksikli\u011fi         D)
  Nesne eksikli\u011fi\\n\\nC\u00fcmlede bulunan bir nesne, bazen ayn\u0131 s\u00f6zc\u00fckten
  olu\u015fturulan dolayl\u0131 t\u00fcmleci unutturabilir. Bu tur c\u00fcmlelerde
  dolayl\u0131 t\u00fcmle\u00e7 eksikli\u011fi olur.\\n\\n9-A\u015fa\u011f\u0131daki
  c\u00fcmlelerin hangisinde bu t\u00fcr bir anlat\u0131m bozuklu\u011fu vard\u0131r?\\n\\nA)
  Onunla yapt\u0131\u011f\u0131m\u0131z kar\u015f\u0131l\u0131kl\u0131 tart\u0131\u015fmalara
  bir sure ara verdik.\\n\\nB) Yazar\u0131n konuya ilgisini \u00e7eken, yazmaya iten
  nedir, belli de\u011fil.\\n\\nC) Sizi \u00f6nceden tan\u0131yor ve g\u00fcveniyoruz.\\n\\nD)
  Sanat\u00e7\u0131n\u0131n dil sorununa e\u011filmesi, bu konuyla ilgilenmesi gerekir.\\n\\n\\\"Bu
  \u00e7ocu\u011fun zeki ve yaramaz olmad\u0131\u011f\u0131n\u0131 herkes bilir.\\\"\\n\\n10-C\u00fcmlesindeki
  anlat\u0131m bozuklu\u011fu a\u015fa\u011f\u0131dakilerin hangisiyle\\n\\ngiderilebilir?\\n\\nA)
  \\\"ve\\\" s\u00f6zc\u00fc\u011f\u00fc c\u00fcmleden \u00e7\u0131kar\u0131larak.\\n\\nB)
  \\\"olmad\u0131\u011f\u0131n\u0131\\\" s\u00f6zc\u00fc\u011f\u00fc yerine \\\"oldu\u011fu\\\"
  getirilerek.\\n\\nC) \\\"ve\\\" den \u00f6nce \\\"oldu\u011funu\\\" s\u00f6zc\u00fc\u011f\u00fc
  getirilerek.\\n\\nD) \\\"bilir\\\" s\u00f6zc\u00fc\u011f\u00fc yerine \\\"bilmeli\\\"
  getirilerek.\\n\\nOlanlar\u0131 duyunca \u00e7ok k\u0131zd\u0131 bana, azarlamaya
  ba\u015flad\u0131.\\n\\n11-Bu c\u00fcmledeki anlat\u0131m bozuklu\u011funun nedeni
  hangisidir?\\n\\nA) \u00d6zne eksikli\u011fi                         B) Nesne eksikli\u011fi\\n\\nC)
  Dolayl\u0131 t\u00fcmle\u00e7 eksikli\u011fi.        D) Y\u00fcklem eksikli\u011fi\\n\\n12-A\u015fa\u011f\u0131daki
  c\u00fcmlelerin hangisinde, anlat\u0131m bozuklu\u011fu nesne eksikli\u011fine dayal\u0131d\u0131r?\\n\\nA)
  Hem sigaradan nefret etti\u011fini soyluyor hem de durmadan i\u00e7iyor.\\n\\nB)
  \u0130ki yazar\u0131n teknikleri aras\u0131nda baz\u0131 de\u011fi\u015fik farkl\u0131l\u0131klar\u0131
  var.\\n\\nC) Kap\u0131n\u0131n \u00f6n\u00fcndeki arabay\u0131 inceledi ve \u00e7ok
  be\u011fendi.\\n\\nD) U\u00e7ak y\u00fckseldik\u00e7e havan\u0131n s\u0131cakl\u0131\u011f\u0131
  giderek d\u00fc\u015f\u00fcyor.\\n\\nKopekleri, hem \u00e7ok seviyor hem de korkuyor.
  13-C\u00fcmlesindeki anlat\u0131m bozuklu\u011funun nedeni a\u015fa\u011f\u0131dakilerden
  hangisinde do\u011fru belirtilmi\u015ftir?\\n\\nA) Tamlama eksikli\u011fi            B)
  Y\u00fcklem eksikli\u011fi\\n\\nC) Yer tamlay\u0131c\u0131s\u0131 eksikli\u011fi    D)
  Nesne eksikli\u011fi\\n\\n\\\"San\u0131yor musun ki halk bu s\u00f6zleri dinler
  ve inan\u0131r?\\\"\\n\\n14-Bu c\u00fcmledeki anlat\u0131m bozuklu\u011funun nedeni
  hangisidir?\\n\\nA) Nesne eksikli\u011fi.               B) Dolayl\u0131 t\u00fcmle\u00e7
  eksikli\u011fi.\\n\\nC) \u00d6zne eksikli\u011fi.                 D) Y\u00fcklem
  eksikli\u011fi.\\n\\nAnnesini \u00e7ok \u00f6zlemi\u015fti; ama d\u00f6nmek istemiyordu.
  Bu yaz\u0131ya dikkat etmeli, herkesle payla\u015fmal\u0131y\u0131z \u00d6zel ve
  tur adlar\u0131 c\u00fcmlede \u00f6zne olabilir.\\n\\n15-Yukar\u0131daki \u00f6rneklerde
  a\u015fa\u011f\u0131dakilerden hangisiyle ilgili bir anlat\u0131m bozuklu\u011fu
  yap\u0131lmam\u0131\u015ft\u0131r?\\n\\n23-A\u015fa\u011f\u0131daki c\u00fcmlelerin
  hangisinde farkl\u0131 bir anlat\u0131m bozuklu\u011fu var?\\n\\nA) G\u00f6bekli
  tepe''ye yapaca\u011f\u0131 ziyareti iptal etti fakat rahats\u0131zl\u0131\u011f\u0131
  sebebiyle dinlenmesi gerekiyordu\\n\\nA) \u00d6zne eksikli\u011fi                        B)
  Nesne eksikli\u011fi\\n\\nC) Yer tamlay\u0131c\u0131s\u0131 eksikli\u011fi        D)
  Tamlama eksikli\u011fi\\n\\n16-A\u015fa\u011f\u0131daki c\u00fcmlelerin hangisinde
  \u00f6zne-y\u00fcklem uyumsuzlu\u011fundan kaynaklanan bir anlat\u0131m bozuklu\u011fu
  vard\u0131r?\\n\\nA) \u00d6\u011frenciler, s\u0131n\u0131fta sessizce beklediler.\\n\\nB)
  A\u011fa\u00e7lar bu ya\u011fmurlardan sonra \u00e7i\u00e7ek a\u00e7t\u0131.\\n\\nC)
  Bu hayaller y\u00fcre\u011fime umut tohumlar\u0131 ekti.\\n\\nD) G\u00fcl kokular\u0131
  papatya kokular\u0131n\u0131 aratmad\u0131lar.\\n\\n17-\\\"Bir ele\u015ftirmenin
  eserlere bak\u0131\u015f ac\u0131s\u0131 ve yorumlay\u0131\u015f\u0131 \u00f6nemlidir.\\\"
  c\u00fcmlesindeki anlat\u0131m bozuklu\u011fu nas\u0131l giderilebilir?\\n\\nA)
  \\\"ac\u0131s\u0131\\\" yerine \\\"y\u00f6n\u00fc\\\" getirilerek\\n\\nB) \\\"bak\u0131\u015f
  ac\u0131s\u0131\\\" s\u00f6zleri yerine \\\"bak\u0131s\u0131\\\" diyerek\\n\\nC)
  \\\"\u00f6nemlidir\\\" s\u00f6zc\u00fc\u011f\u00fcnden \u00f6nce \\\"ne kadar\\\"
  s\u00f6zleri getirilerek\\n\\nD) \\\"ve\\\" s\u00f6zc\u00fc\u011f\u00fcnden sonra
  \\\"eserleri\\\" s\u00f6zc\u00fc\u011f\u00fcn\u00fc getirerek\\n\\n18-A\u015fa\u011f\u0131daki
  c\u00fcmlelerin hangisinde farkl\u0131 bir anlat\u0131m bozuklu\u011fu var?\\n\\nA)
  Yerine git ve g\u00fczelce temizle\\n\\nB) Herkese dikkat et i\u00e7eri alma\\n\\nC)
  Onun yoluna \u00e7\u0131k\u0131p kesmeye kalkma\\n\\nD) Sevdiklerini arar, bol bol
  hediye da\u011f\u0131t\u0131rd\u0131.\\n\\n\\\"Su\u00e7 ve Ceza''n\u0131n bu \u00e7evirisinde
  yanl\u0131\u015flar var hem de roman\\n\\n\u00fcslubuna hi\u00e7 uygun de\u011fil.\\\"\\n\\n19-Bu
  c\u00fcmledeki anlat\u0131m bozuklu\u011funun nedeni a\u015fa\u011f\u0131dakilerden
  hangisidir?\\n\\nA) \u00d6zne eksikli\u011fi                      B) Y\u00fcklem
  eksikli\u011fi\\n\\nC) Yanl\u0131\u015f ba\u011fla\u00e7 kullan\u0131m\u0131     D)
  Dolayl\u0131 t\u00fcmle\u00e7 eksikli\u011fi\\n\\n20-A\u015fa\u011f\u0131daki c\u00fcmlelerden
  hangisinde \\\"-ler, -lar\\\" ekinin gereksiz kullan\u0131lmas\u0131ndan kaynaklanan
  bir anlat\u0131m bozuklu\u011fu vard\u0131r?\\n\\nA) Bah\u00e7elievler''de yasam
  \u00e7ok renkli.\\n\\nB) Evlerin onu temiz tutulmal\u0131d\u0131r.\\n\\nC) Teyzemler
  dun bizdeydi.\\n\\nD) Birka\u00e7 adamlar arabadan h\u0131zla indiler.\\n\\nG\u00f6zlerine
  de\u011fdi g\u00f6zlerim, kaybetti\u011fim hayat\u0131 buldum. 21-Bu c\u00fcmledeki
  anlat\u0131m bozuklu\u011funun nedeni a\u015fa\u011f\u0131dakilerden hangisidir?\\n\\nA)
  \u00d6zne eksikli\u011fi                      B) Y\u00fcklem eksikli\u011fi\\n\\nC)
  Nesne eksikli\u011fi                  D) Dolayl\u0131 t\u00fcmle\u00e7 eksikli\u011fi\\n\\nMektubu
  okudu; hemen cevap yazmaya koyuldu.\\n\\n22-Bu c\u00fcmledeki anlat\u0131m bozuklu\u011funun
  nedeni a\u015fa\u011f\u0131dakilerden hangisidir?\\n\\nA) Tamlama eksikli\u011fi                     B)
  Y\u00fcklem eksikli\u011fi\\n\\nC) Nesne eksikli\u011fi                           D)
  Dolayl\u0131 t\u00fcmle\u00e7 eksikli\u011fi\\n\\nB) Herkesin derdini dinliyor ve
  \u00e7areler ar\u0131yor.\\n\\nC) Gelenlere g\u00fcler y\u00fcz g\u00f6steriyor,
  ikramda bulunuyordu.\\n\\nD) Bu oyunu be\u011fenmi\u015f, iki kez gitmi\u015f.\\n\\n24-\\\"Ofiste
  gurultunun ve kotu manzaral\u0131 dekorlar\u0131n kars\u0131s\u0131nda dergi okumak
  olduk\u00e7a zordu.\\\" c\u00fcmlesindeki anlat\u0131m bozuklu\u011funun nedeni
  a\u015fa\u011f\u0131dakilerden hangisidir?\\n\\nA) \u00d6zne - y\u00fcklem uyu\u015fmazl\u0131\u011f\u0131     B)
  Tamlama yanl\u0131\u015fl\u0131\u011f\u0131\\n\\nC) \u00d6zne eksikli\u011fi                             D)
  Nesne eksikli\u011fi\\n\\n25-A\u015fa\u011f\u0131daki c\u00fcmlelerin hangisinde
  \u00f6zne eksikli\u011finden kaynaklanan bir anlat\u0131m bozuklu\u011fu vard\u0131r?\\n\\nA)
  Vaktin bilginlerini toplar, d\u00fc\u015f\u00fcncelerini sorarm\u0131\u015f.\\n\\nB)
  Kap\u0131ya dayanmay\u0131n, dun boyand\u0131.\\n\\nC) Bir \u015fey bilmeyen, bir
  sey unutmaz.\\n\\nD) Y\u00fcksek yerlerde hem y\u0131lana, hem kusa rastlan\u0131r.\\n\\nUzun
  zamand\u0131r, kendisine gelen pek \u00e7ok ki\u015finin derdine \u00e7are buluyor;
  bu gibi tehlikeli \u015feylerden uzak tutman\u0131n yollar\u0131n\u0131 ar\u0131yordu.\\n\\n26-Bu
  c\u00fcmledeki anlat\u0131m bozuklu\u011fu a\u015fa\u011f\u0131dakilerden hangisiyle
  giderilebilir?\\n\\nA) \\\"Uzun zamand\u0131r\\\" s\u00f6z grubu at\u0131larak.\\n\\nB)
  \\\"\u00e7are buluyor\\\" yerine \\\"derman oluyor\\\" getirerek.\\n\\nC) \u0130kinci
  c\u00fcmleye uygun \u00f6zne getirerek.\\n\\nD) \\\"buluyor\\\" s\u00f6zc\u00fc\u011f\u00fcnden
  sonra \\\"\\\"onlar\u0131\\\" s\u00f6zc\u00fc\u011f\u00fc getirerek.\\n\\n27-A\u015fa\u011f\u0131daki
  c\u00fcmlelerden hangisinde anlat\u0131m bozuklu\u011fu yoktur?\\n\\nA) K\u0131rlang\u0131\u00e7lar,
  iklimin s\u0131cak oldu\u011fu t\u00fcm \u00fclkelerde ya\u015farlar.\\n\\nB) Tarih\u00ee
  romanlar\u0131 az, macera romanlar\u0131n\u0131 hi\u00e7 mi hi\u00e7 sevmem.\\n\\nC)
  \u00d6\u011frencilerime her zaman inand\u0131m ve onlar\u0131 destekledim.\\n\\nD)
  Karda mahsur kalan ara\u00e7lara yard\u0131m edip \u015fehre d\u00f6n\u00fcld\u00fc\\n\\n28-A\u015fa\u011f\u0131daki
  c\u00fcmlelerin hangisinde \u00f6zne eksikli\u011finden kaynaklanan bir anlat\u0131m
  bozuklu\u011fu vard\u0131r?\\n\\nA) Babam mutfa\u011fa girince hemen yemekleri yap\u0131verdi.\\n\\nB)
  Karde\u015fimin g\u00f6revi yak\u0131nda bitecek ve yan\u0131m\u0131za ta\u015f\u0131nacak.\\n\\nC)
  G\u00f6revli, \u00e7ocu\u011fun ald\u0131\u011f\u0131 oyunca\u011f\u0131 k\u00e2\u011f\u0131da
  sard\u0131 ve \u00e7ocu\u011fa verdi.\\n\\nD) \u015eehrimize a\u015fa\u011f\u0131
  yukar\u0131 tam otuz y\u0131l \u00f6nce ailesiyle gelmi\u015f.\\n\\nTak\u0131m elbisenin
  temizli\u011fini be\u011fenmeyip yeniden y\u0131kamaya g\u00f6nderdi.\\n\\n29-A\u015fa\u011f\u0131dakilerin
  hangisinde bu c\u00fcmledekine benzer bir anlat\u0131m bozuklu\u011fu vard\u0131r?\\n\\nA)
  Arkada\u015f\u0131m\u0131n a\u011fr\u0131lar\u0131 d\u00fczelmi\u015f, pazartesi
  g\u00fcn\u00fc g\u00f6reve ba\u015flayacakm\u0131\u015f.\\n\\nB) Kasabaya yakla\u015f\u0131yor
  muyuz yoksa uzakla\u015f\u0131yor muyuz anlamad\u0131m.\\n\\nC) Dilek\u00e7elere
  g\u00f6z gezdirip raflara yerle\u015ftiriyordu.\\n\\nD) Gece yar\u0131s\u0131 olunca
  kurtlar, aniden ulumaya ba\u015flad\u0131lar.\\n\\n30-A\u015fa\u011f\u0131dakilerin
  hangisinde farkl\u0131 bir \u00f6\u011fe eksikli\u011finden kaynaklanan anlat\u0131m
  bozuklu\u011fu vard\u0131r?\\n\\nGen\u00e7     sanat\u00e7\u0131lara,     yap\u0131tlar\u0131n\u0131n     konular\u0131n\u0131
  se\u00e7erken nelere \u00f6nem vermelerini anlat\u0131yor.\\n\\nA) Otob\u00fcse
  binerken ve inerken di\u011fer yolculara sayg\u0131l\u0131 olmak bizi uygar bir
  insan yapar.\\n\\n36-Bu c\u00fcmledeki anlat\u0131m bozuklu\u011fu a\u015fa\u011f\u0131daki
  de\u011fi\u015fikliklerin hangisiyle giderilebilir?\\n\\nA) \\\"vermelerini\\\"  yerine  \\\"vermeleri  gerekti\u011fini\\\"
  s\u00f6z\u00fc getirilmeli.\\n\\nB) Kitaplar\u0131n \u00fczerini karalayanlara ve
  yaz\u0131 yazanlara art\u0131k tahamm\u00fcl edemiyorum.\\n\\nC) Tatilde ben o\u011flumun
  yan\u0131na, e\u015fim k\u0131z\u0131m\u0131n yan\u0131na gitti.\\n\\nD) Ak\u015fam\u00fcst\u00fc
  sessizce eve girdi fakat kimseye haber vermeden \u00e7\u0131kt\u0131.\\n\\nBir tamlanana
  ayn\u0131 anda ba\u011flanan isimler ve s\u0131fatlar \u00e7o\u011fu zaman tamlayan
  eksikli\u011finden kaynaklanan anlat\u0131m bozuklu\u011funa sebep olur.\\n\\n31-A\u015fa\u011f\u0131daki
  c\u00fcmlelerin hangisinde bu a\u00e7\u0131klamada belirtilen t\u00fcrde anlat\u0131m
  bozuklu\u011fu vard\u0131r?\\n\\nA) Bu hafta belgisiz ve i\u015faret s\u0131fatlar\u0131
  konusunu i\u015fledik.\\n\\nB) Cam \u00e7er\u00e7eveli demir kap\u0131n\u0131n kilidi
  bozulmu\u015ftu.\\n\\nC) \u00d6zel ve resm\u00ee mektuplar art\u0131k kalemle yaz\u0131lmaz
  oldu.\\n\\nD) Bat\u0131 ve Do\u011fu medeniyetini bu m\u00fczik bir araya getirdi.\\n\\nHerkes
  ona g\u00fcvendi, kar\u015f\u0131 \u00e7\u0131kmad\u0131.\\n\\nG\u00f6\u00e7men
  ku\u015flar bat\u0131ya do\u011fru u\u00e7uyorlar.\\n\\nKahvalt\u0131da \u00fc\u00e7
  simit, bir bardak \u00e7ay i\u00e7ti.\\n\\n32-Yukar\u0131daki \u00f6rneklerde a\u015fa\u011f\u0131dakilerden
  hangisiyle ilgili bir anlat\u0131m bozuklu\u011fu yap\u0131lmam\u0131\u015ft\u0131r?\\n\\nA)
  \u00d6zne eksikli\u011fi                              B) Y\u00fcklem eksikli\u011fi\\n\\nC)
  \u00d6zne y\u00fcklem uyumsuzlu\u011fu       D) Nesne eksikli\u011fi\\n\\nSpor yapmay\u0131
  \u00e7ok seviyor fakat derslerine de \u00e7al\u0131\u015f\u0131yordu. Her zaman
  kar\u015f\u0131s\u0131ndakini d\u00fc\u015f\u00fcn\u00fcr, de\u011fer verirdi. \u00c7ocuklar\u0131
  \u00e7ok sever, ilgilenirdi.\\n\\n33-Yukar\u0131daki \u00f6rneklerde a\u015fa\u011f\u0131dakilerden
  hangisiyle ilgili bir anlat\u0131m bozuklu\u011fu yap\u0131lmam\u0131\u015ft\u0131r?\\n\\nA)
  \u00d6zne eksikli\u011fi                      B) Zarf t\u00fcmleci eksikli\u011fi\\n\\nC)
  Yanl\u0131\u015f ba\u011fla\u00e7 kullan\u0131m\u0131      D) Dolayl\u0131 t\u00fcmle\u00e7
  eksikli\u011fi\\n\\n34-A\u015fa\u011f\u0131daki c\u00fcmlelerin hangisinde anlat\u0131m
  bozuklu\u011fu vard\u0131r?\\n\\nA) Elektrik\u00e7ilerin kulland\u0131\u011f\u0131
  kontrol kalemi, elektri\u011fi \u0131\u015f\u0131k olarak g\u00f6rmemizi sa\u011flar.\\n\\nB)
  Bilim insanlar\u0131, d\u00f6rt ya\u015f\u0131ndaki \u00e7ocuklar\u0131n bilim e\u011fitimi
  g\u00f6rebilece\u011fini kabul etmektedir.\\n\\nC) Herkes kendi balonunun a\u011f\u0131zlar\u0131n\u0131
  d\u00fc\u011f\u00fcmleyip \u00fczerine kendi ad\u0131n\u0131 yazs\u0131n.\\n\\nD)
  Braille alfabesi, g\u00f6rme engellilerin okumas\u0131na yard\u0131m etmek i\u00e7in
  Louis Braille taraf\u0131ndan icat edildi.\\n\\nYap\u0131lan t\u00f6rende bir\u00e7ok
  \u00fcnl\u00fc isim haz\u0131r bulundular.\\n\\n35-A\u015fa\u011f\u0131dakilerin
  hangisinde anlat\u0131m bozuklu\u011funun nedeni bu c\u00fcmledekiyle \u00f6zde\u015ftir?\\n\\nA)
  Tiyatroyu \u00e7ok seviyor, her hafta sonu gidiyordu.\\n\\nB) Ali''yi eve \u00e7a\u011f\u0131rd\u0131m,
  her \u015feyi anlatt\u0131m.\\n\\nC) Ailesine hi\u00e7 bakm\u0131yor, s\u00fcrekli
  ihmal ediyordu.\\n\\nD) Birka\u00e7 \u00f6\u011frenci bug\u00fcn okula ge\u00e7
  geldiler.\\n\\nB) \\\"nelere\\\" yerine \\\"hangi noktalara\\\" s\u00f6z\u00fc getirilmeli.\\n\\nC)
  \\\"sanat\u00e7\u0131lara\\\" yerine \\\"sanat\u00e7\u0131lar\u0131n\\\" s\u00f6z\u00fc
  getirilmeli.\\n\\nD) \\\"se\u00e7erken\\\" yerine \\\"se\u00e7mekte\\\" s\u00f6z\u00fc
  getirilmeli.\\n\\n\\\"Hi\u00e7biri -Ali Suavi''den ba\u015fka- \u00fclkede bir ayaklanmay\u0131
  d\u00fc\u015f\u00fcnmemi\u015f, Padi\u015faha ba\u011fl\u0131l\u0131\u011f\u0131
  kutsal bir g\u00f6rev saym\u0131\u015ft\u0131r.\\\" 37-Yukar\u0131daki \u00f6rneklerde
  a\u015fa\u011f\u0131dakilerden hangisiyle ilgili bir anlat\u0131m bozuklu\u011fu
  yap\u0131lmam\u0131\u015ft\u0131r?\\n\\nA) \u00d6zne eksikli\u011fi                              B)
  Y\u00fcklem eksikli\u011fi\\n\\nC) \u00d6zne y\u00fcklem uyumsuzlu\u011fu       D)
  Nesne eksikli\u011fi\\n\\n38-A\u015fa\u011f\u0131dakilerin hangisinde, \\\"Sana
  asla k\u0131zm\u0131yor, \u00e7ok seviyoruz.\\\" c\u00fcmlesindekine benzer bir
  anlat\u0131m bozuklu\u011fu vard\u0131r?\\n\\nA) A\u011fa\u00e7lar\u0131 suluyor,
  ila\u00e7l\u0131yor.\\n\\nB) Arkada\u015flar\u0131yla bulu\u015fmuyor, haberle\u015fmiyor.\\n\\nC)
  Kitaplar\u0131n\u0131 yerlerine yerle\u015ftirmiyor, \u00fcst \u00fcste y\u0131\u011f\u0131yor.\\n\\nD)
  Derslerine \u00e7al\u0131\u015fm\u0131yor, ihmal ediyor.\\n\\nBir sorunun \u00fczerinde
  enine boyuna d\u00fc\u015f\u00fcnmeyi, anlamak i\u00e7in \u00e7aba harcamay\u0131
  \u00f6\u011frenmemi\u015fler.\\n\\n39-Bu c\u00fcmledeki anlat\u0131m bozuklu\u011fu
  a\u015fa\u011f\u0131daki de\u011fi\u015fikliklerden hangisiyle giderilebilir?\\n\\nA)
  \\\"\u00fczerinde\\\" yerine \\\"\u00fczerine\\\" s\u00f6z\u00fc getirilmeli\\n\\nB)
  \\\"d\u00fc\u015f\u00fcnmeyi\\\" yerine \\\"d\u00fc\u015f\u00fcnerek\\\" s\u00f6z\u00fc
  getirilmeli\\n\\nC) \\\"anlamak\\\" tan \u00f6nce \\\"onu\\\" s\u00f6z\u00fc getirilmeli\\n\\nD)
  \\\"d\u00fc\u015f\u00fcnmeyi\\\" yerine \\\"d\u00fc\u015f\u00fcnmek\\\" s\u00f6z\u00fc
  getirilmeli\"", "\"AMER\u0130KAN BOARD VE SASON ERME\u00d1\u0130 \u0130SYANININ\\nAMER\u0130KA\u2019DA
