  \u00e7e\u015fitli alt markalar\u0131 ile yay\u0131n hayat\u0131na devam edilmi\u015ftir.\\n\\n2011
  y\u0131l\u0131 Ocak ay\u0131nda Blue Jean, Burda, Capital, Mart ay\u0131nda Maison
  Fran\u00e7aise, Eyl\u00fcl ay\u0131nda Atlas, Tempo, Lezzet ve Yacht T\u00fcrkiye
  dergilerinde pazar ko\u015fullar\u0131na paralel olarak farkl\u0131 oranlarda kapak
  fiyat\u0131 art\u0131\u015f\u0131 ger\u00e7ekle\u015ftirilmi\u015ftir.\\n\\nC. Operasyonel
  Performans\\n\\nTiraj\\n\\nT\u00fcrkiye''de 2011 y\u0131l\u0131n\u0131n ilk dokuz
  ay\u0131nda 29,9 milyon adet dergi sat\u0131ld\u0131\u011f\u0131 hesaplanmaktad\u0131r
  (2010 ilk dokuz ay: 28,1 milyon adet). Do\u011fan Burda''n\u0131n da i\u00e7inde
  bulundu\u011fu reklam alan dergiler pazar\u0131nda sat\u0131lan dergi say\u0131s\u0131
  ise tahminen 16,4 milyon adet olup reklam alan dergilerin net sat\u0131\u015f adetlerinde
  % 6,5 oran\u0131nda art\u0131\u015f ger\u00e7ekle\u015fmi\u015ftir.\\n\\nDo\u011fan
  Burda''n\u0131n, reklam alan dergiler pazar\u0131 i\u00e7erisinde 2011 y\u0131l\u0131nda
  yay\u0131nlad\u0131\u011f\u0131 toplam 4 adet haftal\u0131k, 20 adet ayl\u0131k,
  2 adet \u00f6zel periyotlu ve 29 adet di\u011fer periyotlardaki yay\u0131n\u0131yla
  5,1 milyon sat\u0131\u015f adedi (2010 ilk dokuz ay: 5,1 milyon) seviyesinde % 31''lik
  pazar pay\u0131 ile liderli\u011fini s\u00fcrd\u00fcrd\u00fc\u011f\u00fc g\u00f6r\u00fclmektedir.\\n\\nReklam\\n\\nT\u00fcrkiye
  toplam dergi reklam pazar\u0131n\u0131n 2011''in ilk dokuz ayl\u0131k d\u00f6neminde
  2010''un ayn\u0131 d\u00f6nemine g\u00f6re yakla\u015f\u0131k % 7,7 b\u00fcy\u00fcyerek  82,7
  milyon TL seviyesinde ger\u00e7ekle\u015fti\u011fi tahmin edilmektedir.\\n\\n\u015eirketimizin
  reklam gelirleri Ocak \u2013 Eyl\u00fcl 2011 d\u00f6neminde 43,9 milyon TL olarak
  ger\u00e7ekle\u015firken 2010 y\u0131l\u0131n\u0131n ayn\u0131 d\u00f6nemine g\u00f6re
  % 19,7 seviyesinde ilerleme ile pazar\u0131n iki kat\u0131n\u0131n \u00fczerinde
  bir b\u00fcy\u00fcme g\u00f6stermi\u015ftir.\\n\\nB\u00f6ylelikle \u015eirket''in
  dergi reklam pazar\u0131 liderli\u011fi de devam etmektedir.\\n\\nD. \u00d6zet Mali
  Sonu\u00e7lar ve Karl\u0131l\u0131k\\n\\n\u015eirketin 30 Eyl\u00fcl 2011 ve 30
  Eyl\u00fcl 2010 tarihleri itibariyle \u00f6zet gelir tablosu ve se\u00e7ilen hesaplar\u0131n
  y\u0131ll\u0131k de\u011fi\u015fimi a\u015fa\u011f\u0131daki gibidir;\\n\\nKonsolide
  (Bin TL)\\n\\n30.09.2011\\n\\n30.09.2010\\n\\n2011 Ocak-Eyl\u00fcl d\u00f6neminde
  net sat\u0131\u015f gelirlerinde 2010''un ayn\u0131 d\u00f6nemine g\u00f6re % 13,8''lik
  bir geli\u015fme sa\u011flanm\u0131\u015ft\u0131r. Bu art\u0131\u015fta \u00f6zellikle
  reklam gelirlerinin b\u00fcy\u00fcmesi etkili olmakla birlikte tiraj gelirleri de
  ayn\u0131 d\u00f6nemde % 6,9''luk y\u00fckseli\u015f g\u00f6stermi\u015ftir. Di\u011fer
  taraftan, sat\u0131\u015flar\u0131n maliyetindeki art\u0131\u015f\u0131n % 11,5
  seviyesinde tutulmas\u0131 ile br\u00fct sat\u0131\u015f kar\u0131nda % 17,3''l\u00fck
  bir iyile\u015fme ger\u00e7ekle\u015fmi\u015ftir.\\n\\n25 \u015eubat 2011 tarih
  ve 27857 say\u0131l\u0131 (I.M\u00fckerrer) Resmi Gazete''de yay\u0131mlanarak y\u00fcr\u00fcrl\u00fc\u011fe
  giren 6111 Say\u0131l\u0131 \\\"Baz\u0131 Alacaklar\u0131n Yeniden Yap\u0131land\u0131r\u0131lmas\u0131
  ile Sosyal Sigortalar ve Genel Sa\u011fl\u0131k Sigortas\u0131 Kanunu ve Di\u011fer
  Baz\u0131 Kanun ve Kanun H\u00fckm\u00fcnde Kararnamelerde De\u011fi\u015fiklik
  Yap\u0131lmas\u0131 Hakk\u0131nda Kanun\\\"(6111 say\u0131l\u0131 Kanun)''un \\\"matrah
  art\u0131r\u0131m\u0131\\\" h\u00fck\u00fcmlerinden, yararlan\u0131lmas\u0131na
  karar verilmesi neticesinde, 18 taksit ve 36 ayda \u00f6denecek olan toplam 3.227
  bin TL i\u00e7in 409 bin TL tutar\u0131nda reeskont hesaplanm\u0131\u015ft\u0131r.
  Hesaplanan 409 bin TL tutar\u0131ndaki reeskont gideri ve reeskont giderinin d\u00fc\u015f\u00fclmesinden
  sonra kalan 2.818 bin TL tutar\u0131ndaki anapara tutar\u0131 konsolide finansal
  tablolarda s\u0131ras\u0131yla \\\"di\u011fer faaliyet giderleri\\\" ve \\\"di\u011fer
  k\u0131sa ve uzun vadeli y\u00fck\u00fcml\u00fcl\u00fckler\\\" hesaplar\u0131nda
  izlenmektedir. 30 Eyl\u00fcl 2011 tarihi itibariyle 6111 say\u0131l\u0131 Kanun
  kapsam\u0131nda, 544 bin TL anapara ve 67 bin TL faiz olmak \u00fczere toplam 611
  bin TL tutar\u0131nda \u00f6deme yap\u0131lm\u0131\u015f olup; \u00f6deme sonras\u0131nda
  kalan k\u0131sa ve uzun vadeli anapara y\u00fck\u00fcml\u00fcl\u00fck tutar\u0131
  2.273 bin TL''dir.\\n\\n6111 say\u0131l\u0131 kanun kapsam\u0131ndaki giderler ad\u0131
  alt\u0131nda \\\"Di\u011fer Faaliyetlerden Giderler\\\" i\u00e7erisinde g\u00f6sterilen
  2.818 bin TL''lik tutar hari\u00e7 finansal tablolar de\u011ferlendirildi\u011finde,
  faaliyet karl\u0131l\u0131\u011f\u0131n\u0131n 5.452 bin TL seviyesinde ger\u00e7ekle\u015fti\u011fi
  g\u00f6r\u00fclmektedir. Bu tutar dikkate al\u0131nd\u0131\u011f\u0131nda, gelirlerdeki
  y\u00fckseli\u015f ile birlikte giderlerdeki kontroll\u00fc art\u0131\u015f sonucu,
  2010 y\u0131l\u0131n\u0131n ayn\u0131 d\u00f6nemine g\u00f6re % 11 civar\u0131nda
  bir b\u00fcy\u00fcme yakaland\u0131\u011f\u0131 g\u00f6r\u00fclmektedir.\\n\\n30.09.2011
  itibariyle 1.694 bin TL''lik net d\u00f6nem kar\u0131 olu\u015fmu\u015ftur. Ancak
  s\u00f6z konusu matrah art\u0131r\u0131m gideri ve ilgili faiz gideri hari\u00e7
  bak\u0131ld\u0131\u011f\u0131nda, net d\u00f6nem kar\u0131n\u0131n 4.579 bin TL
  seviyesinde ger\u00e7ekle\u015fti\u011fi g\u00f6r\u00fclmekte olup, ge\u00e7en senenin
  ayn\u0131 d\u00f6nemine g\u00f6re % 20 seviyesinde  bir b\u00fcy\u00fcme sa\u011fland\u0131\u011f\u0131
  anla\u015f\u0131lmaktad\u0131r.\\n\\n\u015eirket''in son iki d\u00f6neme ait bilan\u00e7osundaki
  aktif ve pasifteki ana kalemlerin de\u011fi\u015fimi \u015f\u00f6yledir;\\n\\nY\u00fck\u00fcml\u00fcl\u00fckler
  ve \u00d6zsermaye (Konsolide Bin TL)\\n\\n30.09.2011\\n\\n31.12.2010\\n\\nMay\u0131s
  ay\u0131nda tamamlanan nakit temett\u00fc da\u011f\u0131t\u0131m\u0131na ba\u011fl\u0131
  olarak nakit ve nakit benzeri de\u011ferlerdeki azalmaya (%17 oran\u0131nda) kar\u015f\u0131n;
  reklam gelirleri ile dergi sat\u0131\u015f gelirlerindeki iyile\u015fmeye ba\u011fl\u0131
  olarak ticari alacaklar\u0131n art\u0131\u015f\u0131n etkisiyle d\u00f6nen varl\u0131klar
  bir \u00f6nceki y\u0131l\u0131n sonuna g\u00f6re % 14,1 y\u00fckseli\u015f g\u00f6stermi\u015ftir.\\n\\n6111
  Say\u0131l\u0131 \\\"Baz\u0131 Alacaklar\u0131n Yeniden Yap\u0131land\u0131r\u0131lmas\u0131
  ile Sosyal Sigortalar ve Genel Sa\u011fl\u0131k Sigortas\u0131 Kanunu ve Di\u011fer
  Baz\u0131 Kanun ve Kanun H\u00fckm\u00fcnde Kararnamelerde De\u011fi\u015fiklik
  Yap\u0131lmas\u0131 Hakk\u0131nda Kanun\\\"un \\\"matrah art\u0131r\u0131m\u0131\\\"
  h\u00fck\u00fcmlerinden yararlan\u0131lmas\u0131na karar verilmesi neticesinde,
  18 taksitte ve 36 ayda \u00f6denecek olan 3.227 bin TL i\u00e7in 30 Eyl\u00fcl 2011
  tarihi itibariyle hesaplanan 409 bin TL''lik reeskont tutar\u0131 ile 611 bin TL''lik
  \u00f6demeye ili\u015fkin 544 bin TL''lik anapara \u00f6demesinin d\u00fc\u015f\u00fclmesinden
  sonra kalan 2.273 bin TL''nin 837 bin TL''si bir y\u0131ldan k\u0131sa vadeli y\u00fck\u00fcml\u00fcl\u00fckler
  i\u00e7erisinde, 1.436 bin TL''si ise uzun vadeli y\u00fck\u00fcml\u00fcl\u00fckler
  i\u00e7erisinde yer almaktad\u0131r.\\n\\nK\u0131sa vadeli y\u00fck\u00fcml\u00fcl\u00fcklerdeki
  3.469 bin TL''lik art\u0131\u015f\u0131 olu\u015fturan ba\u015fl\u0131ca kalemler,
  mevsimsel etkilere ba\u011fl\u0131 olarak artan bor\u00e7 kar\u015f\u0131l\u0131klar\u0131
  ile gelecek aylara ait gelirler (4.109 bin TL) ve 6111 say\u0131l\u0131 kanun kapsam\u0131ndaki
  bor\u00e7lar (837 bin TL) olarak g\u00f6r\u00fclmektedir. Buna kar\u015f\u0131l\u0131k
  Ticari Bor\u00e7larda %12,9 oran\u0131nda azalma s\u00f6z konusudur.\\n\\n\u00d6zkaynaklar
  kaleminde g\u00f6r\u00fclen d\u00fc\u015f\u00fc\u015f, 4 May\u0131s 2011 tarihi
  itibariyle da\u011f\u0131t\u0131m\u0131 tamamlanan nakit 3.000 bin TL''lik temett\u00fc
  da\u011f\u0131t\u0131m\u0131ndan kaynaklanmaktad\u0131r.\"", "\"| 1. Soyad\u0131n\u0131z
