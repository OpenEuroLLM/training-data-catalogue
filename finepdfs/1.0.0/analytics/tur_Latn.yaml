  Ba\u011flant\u0131 Tipi: Dijital HDMI\\n\\n13. Her \u00f6\u011frenci i\u00e7in ayr\u0131
  vakum motoru bulunmal\u0131d\u0131r. Bu motorlar en az 800 Watt g\u00fcc\u00fcnde,
  sessiz \u00e7al\u0131\u015fmal\u0131d\u0131r.\\n\\n14. Vakum motorlar\u0131, elektronik
  \u015falter ile en az 8 kademeli kumanda edilebilmelidir.\\n\\n15.\\n\\nMasa \u00fczerinde
  her \u00f6\u011frenci i\u00e7in \u00f6zel dizayn edilmi\u015f g\u00f6z koruma siperli\u011fi
  ve s\u00fczgeci olan plastik emi\u015f \u00e7enesi olmal\u0131d\u0131r.\\n\\n16.
  Vakum motorlar\u0131n\u0131n emi\u015f filtreleri, \u00f6zel filtre bezinden imal
