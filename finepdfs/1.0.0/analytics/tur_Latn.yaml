  Masalar 230 Volt 50Hz AC \u015febeke cereyan\u0131 ile \u00e7al\u0131\u015fmal\u0131d\u0131r.\\n24.
  Masa imalat ve montaj hatalar\u0131na kar\u015f\u0131 \u00fccretsiz 2 (iki) y\u0131l
