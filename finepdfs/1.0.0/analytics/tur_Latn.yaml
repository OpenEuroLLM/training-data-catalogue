  istiyoruz.\\n\\n\u0130leti\u015fim ve/veya e\u011fitim ba\u015fvuru formumuz vas\u0131tas\u0131yla
  veya verdi\u011fimiz e\u011fitimlere ili\u015fkin baz\u0131 anket \u00e7al\u0131\u015fmalar\u0131
  ile elde edilen ki\u015fisel verilerinizin 6698 say\u0131l\u0131 Ki\u015fisel Verilerin
  Korunmas\u0131 Kanununa uygun \u015fekilde i\u015flenip muhafaza edilmesine b\u00fcy\u00fck
  \u00f6nem vermekteyiz.\\n\\nVeri Sorumlusu: Ela Uysal Pozitif \u0130li\u015fkiler
  Akademisi\\n\\nKi\u015fisel verileriniz, hukuka ve d\u00fcr\u00fcstl\u00fck kurallar\u0131na
  uygun ve belirli, a\u00e7\u0131k ve me\u015fru ama\u00e7lar i\u00e7in i\u015flenmekte,
  do\u011fru ve gerektik\u00e7e g\u00fcncel tutulmakta, i\u015flendikleri ama\u00e7la
  ba\u011flant\u0131l\u0131, s\u0131n\u0131rl\u0131 ve \u00f6l\u00e7\u00fcl\u00fc
  kullan\u0131lmakta ve hukuka uygun olarak belirledi\u011fimiz saklama s\u00fcresi
  boyunca muhafaza edilmektedir.\\n\\n6698 say\u0131l\u0131 Ki\u015fisel Verilerin
  Korunmas\u0131 Kanunu kapsam\u0131nda ki\u015fisel veri olarak tan\u0131mlanabilecek
  ad soyad, telefon, posta adresi, e posta adresi, e\u011fitim ge\u00e7mi\u015fi gibi
  veriler, sizlere hizmet sunabilmek, e\u011fitime kaydolmay\u0131 sa\u011flamak,
  e\u011fitim sonras\u0131 sertifika bas\u0131m\u0131nda kullanmak, \u00fcyeliklerin
  y\u00f6netimi ve s\u00fcrd\u00fcr\u00fclmesi ile s\u00f6zle\u015fmenin kurulmas\u0131
  ve ifas\u0131n\u0131 sa\u011flamak amac\u0131yla ve ayn\u0131 zamanda ilgili mevzuattan
  kaynaklanan yasal y\u00fck\u00fcml\u00fcl\u00fcklerin yerine getirilmesi kapsam\u0131nda
  ve ilgili mevzuatta belirlenen s\u00fcreler boyunca taraf\u0131m\u0131zca kaydedilebilir,
  muhafaza alt\u0131na al\u0131nabilir, kullan\u0131labilir ve sair suretlerde i\u015flenebilir.\\n\\nKi\u015fisel
  verileriniz taraf\u0131m\u0131zca g\u00fcvenli bir \u015fekilde korunmakta ve amac\u0131na
  uygun olarak kullan\u0131lmaktad\u0131r. Bununla birlikte internet sitemiz \u00fczerinden
  y\u00f6nlendirilen ba\u015fka sitelere girmeniz durumunda, bu sitelerin politikalar\u0131na
  dair Ela Uysal Pozitif \u0130li\u015fkiler Akademisi herhangi bir taahh\u00fctte
  bulunamayaca\u011f\u0131ndan ki\u015fisel verilerinizin korunmas\u0131na dair de
  o siteler ad\u0131na size herhangi bir taahh\u00fctte bulunmamaktay\u0131z.\\n\\n6698
  say\u0131l\u0131 Ki\u015fisel Verilerin Korunmas\u0131 Kanunu''nun 11nci maddesi
  gere\u011fince, Taraf\u0131m\u0131za ba\u015fvurarak,\\n\\na) Ki\u015fisel veri
  i\u015flenip i\u015flenmedi\u011fini \u00f6\u011frenme,\\nb) Ki\u015fisel verileri
  i\u015flenmi\u015fse buna ili\u015fkin bilgi talep etme,\\nc) Ki\u015fisel verilerin
  i\u015flenme amac\u0131n\u0131 ve bunlar\u0131n amac\u0131na uygun kullan\u0131l\u0131p
  kullan\u0131lmad\u0131\u011f\u0131n\u0131 \u00f6\u011frenme,\\n\u00e7) Yurt i\u00e7inde
  veya yurt d\u0131\u015f\u0131nda ki\u015fisel verilerin aktar\u0131ld\u0131\u011f\u0131
  \u00fc\u00e7\u00fcnc\u00fc ki\u015fileri bilme,\\nd) Ki\u015fisel verilerin eksik
  veya yanl\u0131\u015f i\u015flenmi\u015f olmas\u0131 h\u00e2linde bunlar\u0131n
  d\u00fczeltilmesini isteme,\\n\\ne) 6698 say\u0131l\u0131 Ki\u015fisel Verilerin
  Korunmas\u0131 Kanunu''nun 7nci maddesinde \u00f6ng\u00f6r\u00fclen \u015fartlar
  \u00e7er\u00e7evesinde ki\u015fisel verilerin silinmesini veya yok edilmesini isteme,\\nf)
  (d) ve (e) bentleri uyar\u0131nca yap\u0131lan i\u015flemlerin, ki\u015fisel verilerin
  aktar\u0131ld\u0131\u011f\u0131 \u00fc\u00e7\u00fcnc\u00fc ki\u015filere bildirilmesini
  isteme,\\ng) \u0130\u015flenen verilerin m\u00fcnhas\u0131ran otomatik sistemler
  vas\u0131tas\u0131yla analiz edilmesi suretiyle aleyhe bir sonucun ortaya \u00e7\u0131kmas\u0131na
  itiraz etme,\\nh) Ki\u015fisel verilerin kanuna ayk\u0131r\u0131 olarak i\u015flenmesi
  sebebiyle zarara u\u011framas\u0131 h\u00e2linde zarar\u0131n\\ngiderilmesini talep
  etme haklar\u0131na sahip oldu\u011funuzu bildirmek isteriz. Ela Uysal Pozitif \u0130li\u015fkiler
  Akademisi KVKK h\u00fck\u00fcmlerine uygun olarak hareket edilmekte olup bu kanun
  \u00e7er\u00e7evesindeki her t\u00fcrl\u00fc hakk\u0131n\u0131z mahfuzdur. KVKK''da
  de\u011fi\u015fiklik yap\u0131lmas\u0131 halinde, s\u00f6zle\u015fmede de\u011fi\u015fiklik
  yap\u0131lmas\u0131na gerek olmadan, yasan\u0131n yeni h\u00fck\u00fcmleri y\u00fcr\u00fcrl\u00fcl\u00fck
  tarihi itibar\u0131yla uygulan\u0131r.\"", "\"T\u00dcRK\u0130YE HERKES \u0130\u00c7\u0130N
