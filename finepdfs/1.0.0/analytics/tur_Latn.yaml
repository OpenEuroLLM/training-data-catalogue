  olmal\u0131d\u0131r.\\n\\n\u00dcr\u00fcnler kurum taraf\u0131ndan belirlenecek renklerde
  boyanmal\u0131d\u0131r.\\n\\nMasan\u0131n \u00fcst tablas\u0131 en az 12 mm anti-bakteriyel,
  \u0131s\u0131ya ve darbeye dayan\u0131kl\u0131 compact laminat (Yanlar\u0131 siyah
  kraft, \u00fczeri istenilen renkte laminat s\u0131k\u0131lm\u0131\u015f olacakt\u0131r.)
  olmal\u0131d\u0131r.\\n\\nMasan\u0131n \u00fcst tablas\u0131n\u0131n \u00fczerinde,
  elektrik malzemelerini i\u00e7ine alan bir kanal olmal\u0131d\u0131r. Kanal\u0131n
  \u00fcst\u00fcnde raf olmal\u0131d\u0131r. Bu raf, en az 12mm anti-bakteriyel, \u0131s\u0131ya
  ve darbeye dayan\u0131kl\u0131 compact laminat olmal\u0131d\u0131r.\\n\\nMasalar
  toprak hatl\u0131 olmal\u0131, 3x1,5 SIHO-S5 (-60\u00b0C / +250\u00b0C) siaf kablo
  ve \u0131s\u0131ya dayan\u0131kl\u0131 klemens ile tesisat\\n\\n\u00e7ekilmi\u015f
  olmal\u0131d\u0131r.\\n\\n7. Hava ta\u015f\u0131y\u0131c\u0131lar\u0131nda silikon
  pnomatik hortum kullan\u0131lmal\u0131d\u0131r.\\n\\n8. Masalarda her \u00f6\u011frenci
  i\u00e7in bir adet hava spreyi bulunmal\u0131d\u0131r.\\n\\n9.\\n\\nMasalarda ki
  hava spreyi kullan\u0131m esnas\u0131nda kendini kilitleyen, i\u015f bitiminde geri
  \u00e7eken otomatik mekanizmaya ba\u011fl\u0131 olmal\u0131d\u0131r.\\n\\n10. Ayd\u0131nlatma
  i\u00e7in masa \u00fczerinde, led \u0131\u015f\u0131k kaynakl\u0131 lamba olmal\u0131d\u0131r.\\n11.
