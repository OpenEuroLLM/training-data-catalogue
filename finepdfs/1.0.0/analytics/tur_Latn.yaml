sample: '["\"Adana Alparslan T\u00fcrke\u015f Bilim ve Teknoloji \u00dcniversitesi
  Rekt\u00f6rl\u00fc\u011f\u00fcnden;\\n\\n\u00dcN\u0130VERS\u0130TEM\u0130ZDE \u0130ST\u0130HDAM
  ED\u0130LMEK \u00dcZERE ESK\u0130 H\u00dcK\u00dcML\u00dc VEYA TER\u00d6RLE M\u00dcCADELEDE
  MALUL SAYILMAYACAK \u015eEK\u0130LDE YARALANANLARDAN \u0130\u015e\u00c7\u0130 ALIM
  \u0130LANI\\n\\nAdana Alparslan T\u00fcrke\u015f Bilim ve Teknoloji \u00dcniversitesi
  ve ba\u011fl\u0131 birimlerinde g\u00f6rev yapmak \u00fczere, 4857 Say\u0131l\u0131
  \u0130\u015f Kanunu ve 19/09/2009 tarihli ve 27354 say\u0131l\u0131 Resmi Gazetede
  yay\u0131mlanan Kamu Kurum ve Kurulu\u015flar\u0131na Eski H\u00fck\u00fcml\u00fc
  Veya Ter\u00f6rle M\u00fccadelede Malul Say\u0131lmayacak \u015eekilde Yaralananlar\u0131n
  \u0130\u015f\u00e7i Olarak Al\u0131nmas\u0131nda Uygulanacak Usul ve Esaslar Hakk\u0131nda
  Y\u00f6netmelik h\u00fck\u00fcmleri kapsam\u0131nda \u0130\u015f-Kur \u00fczerinden
  Eski H\u00fck\u00fcml\u00fc Veya Ter\u00f6rle M\u00fccadelede Malul Say\u0131lmayacak
  \u015eekilde Yaralanan kontenjan\u0131nda KPSS ile ''''S\u00fcrekli \u0130\u015f\u00e7i\\\"
  al\u0131nacakt\u0131r.\\n\\n\u015eartlar\u0131 uyan adaylar, 13.02.2020-17.02.2020
  tarihleri aras\u0131nda ba\u015fvurular\u0131n\u0131 Adana \u0130\u015f-Kur \u0130l
  M\u00fcd\u00fcrl\u00fc\u011f\u00fcne \u015fahsen veya www.iskur.gov.tr adresinden
  yapmalar\u0131 gerekmektedir.\\n\\nGENEL A\u00c7IKLAMALAR:\\n\\n1- \u0130lan edilen
  kadroya ba\u015fvurusu sonucu hak kazanan adaylar, 657 Say\u0131l\u0131 Kanunun
  4/D maddesi ve 4857 Say\u0131l\u0131 \u0130\u015f Kanunu H\u00fck\u00fcmleri \u00e7er\u00e7evesinde
  Eski H\u00fck\u00fcml\u00fc Veya Ter\u00f6rle M\u00fccadelede Malul Say\u0131lmayacak
  \u015eekilde Yaralanan kontenjan\u0131nda s\u00fcrekli i\u015f\u00e7i olarak istihdam
  edileceklerdir.\\n2- S\u00fcrekli i\u015f\u00e7i kadrosuna yerle\u015fen aday\u0131n
  \u00fccreti Merkez B\u00fct\u00e7eden \u00f6denecektir.\\n3- \u00d6n lisans d\u00fczeyindeki
  s\u00fcrekli i\u015f\u00e7i talepleri KPSS puan\u0131na tabidir.\\n4- Aday listeleri
  ve di\u011fer her t\u00fcrl\u00fc duyurular www.atu.edu.tr internet adresinden ilan
  edilecektir.\\n\u0130lan edilecek olan bu duyurular, tebli\u011f mahiyetinde kabul
  edilir ve ilgililerin adreslerine posta yolu ile ayr\u0131ca tebligat yap\u0131lmaz.\\n5-
  Kamu kurum ve kurulu\u015flar\u0131n\u0131n ilgili disiplin mevzuat\u0131 uyar\u0131nca;
  g\u00f6revinden veya meslekten ihra\u00e7 edilenlerin ba\u015fvurular\u0131 kabul
  edilmeyecektir.\\n6- Yerle\u015ftirme sonucu atama i\u00e7in \u00f6ng\u00f6r\u00fclen
  niteliklere sahip olmayan adaylar ile yanl\u0131\u015f, yan\u0131lt\u0131c\u0131
  veya yalan beyanda bulunmu\u015f olup, tercihlerine yerle\u015fenlerin atama i\u015flemleri
  yap\u0131lmayacakt\u0131r. Yap\u0131lsa dahi atama i\u015flemleri iptal edilecektir.
  Yerle\u015ftirildi\u011fi kadrolar\u0131n nitelik ve \u015fartlar\u0131n\u0131 ta\u015f\u0131d\u0131\u011f\u0131
  halde istenilen belgeleri s\u00fcresi i\u00e7erisinde teslim etmeyen adaylar g\u00f6reve
  ba\u015flat\u0131lmayacaklard\u0131r.\\n\\n7- Atanmaya hak kazananlardan g\u00f6reve
  ba\u015flamayan ve atanma \u015fartlar\u0131n\u0131 ta\u015f\u0131mad\u0131\u011f\u0131ndan
  g\u00f6reve ba\u015flat\u0131lamayanlar\u0131n yerine, ihtiya\u00e7 duyulacak say\u0131da
  yedek adaylar aras\u0131ndan belirlenecektir.\\n\\nBA\u015eVURU \u015eARTLARI:\\n\\nS\u00fcrekli
  i\u015f\u00e7i kadrolar\u0131na ba\u015fvuran adaylar\u0131n a\u015fa\u011f\u0131daki
  \u015fartlar\u0131 ta\u015f\u0131malar\u0131 gerekmektedir.\\n\\n1- 2527 Say\u0131l\u0131
  T\u00fcrk soylu Yabanc\u0131lar\u0131n T\u00fcrkiye''de Meslek ve Sanatlar\u0131n\u0131
  Serbest\u00e7e yapabilmelerine, Kamu, \u00d6zel Kurulu\u015f ve \u0130\u015fyerlerinde
  \u00c7al\u0131\u015ft\u0131r\u0131labilmelerine \u0130li\u015fkin Kanun h\u00fck\u00fcmleri
  sakl\u0131 kalmak kayd\u0131yla T\u00fcrk Vatanda\u015f\u0131 olmak,\\n2- Son ba\u015fvuru
  tarihi itibariyle, 18 ya\u015f\u0131n\u0131 tamamlam\u0131\u015f olmak,\\n3- Kamu
  kurum ve kurulu\u015flar\u0131n\u0131n \u00f6zel kanunlar\u0131nda yer alan \u00f6zel
  \u015fartlar\u0131 ta\u015f\u0131mak,\\n4- Y\u00f6netmeli\u011fin 4. maddenin birinci
  f\u0131kras\u0131n\u0131n (a) bendinde tan\u0131mland\u0131\u011f\u0131 \u015fekilde
  eski h\u00fck\u00fcml\u00fc veya 4. Maddenin birinci f\u0131kras\u0131n\u0131n (\u011f)
  bendinde tan\u0131mland\u0131\u011f\u0131 \u015fekilde ter\u00f6rle m\u00fccadelede
  malul say\u0131lmayacak \u015fekilde yaralanan olmak,\\n5- Herhangi bir Sosyal G\u00fcvenlik
  Kurumundan emeklilik, ya\u015fl\u0131l\u0131k veya malull\u00fck ayl\u0131\u011f\u0131
  alm\u0131yor olmak.\\n6- Eski H\u00fck\u00fcml\u00fc adaylar hakk\u0131ndaki ilgili
  mevzuat h\u00fck\u00fcmleri ile 2527 Say\u0131l\u0131 Kanun h\u00fck\u00fcmleri
  sakl\u0131 kalmak kayd\u0131 ile 657 Say\u0131l\u0131 Devlet Memurlar\u0131 Kanununun
  48. Maddesinin birinci f\u0131kras\u0131n\u0131n (A) bendinin (1), (4), (6) ve (7)
  numaral\u0131 alt bentlerinde belirtilen ko\u015fullar\u0131 ta\u015f\u0131mak.\\n7-
  KPSS sonucuna g\u00f6re, a\u00e7\u0131klanan listede yer alan i\u015f\u00e7iler,
  kurumca belirlenecek m\u00fclakat sonucuna g\u00f6re i\u015fe ba\u015flat\u0131lacak
  olup, www.atu.edu.tr internet adresinde sonu\u00e7lar\u0131n ilan edilmesinden sonra
  5 (be\u015f) i\u015f g\u00fcn\u00fc i\u00e7erisinde istenilen belgeler ile birlikte
  Adana Alparslan T\u00fcrke\u015f Bilim ve Teknoloji \u00dcniversitesi Personel Daire
  Ba\u015fkanl\u0131\u011f\u0131 \u0130dari Personel \u015eube M\u00fcd\u00fcrl\u00fc\u011f\u00fcne
  \u015fahsen m\u00fcracaat etmeleri gerekmektedir. Bu s\u00fcre i\u00e7erisinde istenilen
  belgeleri teslim etmeyen ve m\u00fcracaat etmeyen adaylar hakk\u0131n\u0131 kaybetmi\u015f
  say\u0131l\u0131rlar.\\n\\nBilgi i\u00e7in: Personel Daire Ba\u015fkanl\u0131\u011f\u0131:
  0(322) 455 00 13\"", "\"Sa\u011f Atriumdan Cerrahi Olarak \u00c7\u0131kart\u0131lan
  Subklavyan Ven Kateter Par\u00e7as\u0131: Olgu Sunumu\\n\\nYrd. Dr. Mustafa Zengin,
  Yrd. Do\u00e7. Dr. \u0130slam Kakl\u0131kaya, Dr. Derya Yava\u015f, Dr. Hasan Fizilo\u011flu,
  Do\u00e7. Dr. Fahri \u00d6zcan\\n\\nKaradeniz \u00dcniversitesi T\u0131p Fak\u00fcltesi,
  G\u00f6\u011f\u00fcs Kalp Damar Cerrahisi ABD, Trabzon\\n\\nSubklavyan hemodializ
  kateterinin kullan\u0131lmas\u0131 s\u0131ras\u0131nda vena cava veya kalbin perforasyonu
  ile ortaya \u00e7\u0131kan ya\u015fam\u0131 tehdit edici komplikasyonlar bildirilmi\u015ftir.
  Hemodializ ama\u00e7l\u0131 subklavyan ven kan\u00fclasyonu s\u0131ras\u0131nda
  hemotoraks veya pnomotaraks gibi teknik uygulan\u0131mla ilgili baz\u0131 komplikasyonlar\u0131n
  olmas\u0131 m\u00fcmk\u00fcnd\u00fcr. Hemodializin sona ermesinden ve subklavyan
  kateterin yerinden \u00e7\u0131kar\u0131lmas\u0131 sonras\u0131nda herhangi bir
  komplikasyonun ortaya \u00e7\u0131kmas\u0131 ise olduk\u00e7a nadirdir.\\n\\nBu
  yaz\u0131m\u0131zda sa\u011f artirumdan cerrahi olarak \u00e7\u0131kart\u0131lan
  subklavyan hemodializ kateter par\u00e7as\u0131 ile ilgili nadir bir olguyu sunuyoruz.\\n\\nGKD
  Cer. Derg. 1994; 2-200-202\\n\\nSurgical Removel of Subclavian Catheter Fragremnt
  From the Right Atrium; Case Report\\n\\nLifte threatening emergencies, including
  perforation of the heart or vena cava associated with the use of subclavian hemodialysis
  catheters, have been reported. During subclavian vein cannulation for hemodialysis,
  it is possible to be some iatrogenic (technical) complications like as pneumothorax
  or haemothorax. After hemodialysis was terminated and removing inefective subclavian
  catheter, it is very rare to be any complicaiton.\\n\\nWe have presented on unusual
  case of subclavian hemodialysis catheter fragment removal from the right atrium.\\n\\nSubklavyan
  ven kateterizasyonu 1952''de Aubaniac taraf\u0131ndan uygulanmas\u0131ndan bu yana,
  kardiak perforasyon ve b\u00fcy\u00fck damar yaralanmalar\u0131 dahil olmak \u00fczere,
  hastan\u0131n hayat\u0131n\u0131 tehdit edici boyutlarda b\u00fcy\u00fck komplikasyonlar
  bildirilmi\u015ftir (1) . \u0130lk defa 1969 y\u0131l\u0131nda subklavyan ven hemodializ
  amac\u0131 ile kateterize edilmi\u015ftir (2) . Son y\u0131llarda hemodializ kateteri
  uygulamas\u0131nda, subklavyan ven s\u0131kl\u0131kla tercih edilmekte ve beraberinde
  komplikasyonlar\u0131 getirmektedir. \u0130nfeksiyon (%7-16) ve ven trombozu (%4-35)
  en s\u0131k g\u00f6r\u00fclen komplikasyonlard\u0131r (3,4) .\\n\\nOlgu\\n\\nBu
  yaz\u0131m\u0131zda kronik b\u00f6brek hastal\u0131\u011f\u0131 nedeniyle hemodialize
  al\u0131nan bir hastada, kateterin \u00e7\u0131kar\u0131lmas\u0131 s\u0131ras\u0131nda
  kar\u015f\u0131la\u015f\u0131lan ilgin\u00e7 bir komplikasyon ve tedavisi sunulmu\u015ftur.\\n\\n60
  ya\u015f\u0131ndaki kad\u0131n hastan\u0131n 15 y\u0131ldan beri hipertansiyon,
  10 y\u0131ldan beri kronik b\u00f6brek yetmezli\u011fi nedeniyle tedavi g\u00f6rmekte
  oldu\u011fu saptand\u0131. Sa\u011f subklavyan vene uygulanan hemodializ kateteri
  ile hemodiyaliz program\u0131na al\u0131nan hastan\u0131n hemodializ ama\u00e7l\u0131
  arteriyoven\u00f6z fist\u00fcl olu\u015fturulmas\u0131n\u0131 takiben, kateterin
  al\u0131nmas\u0131 karar\u0131 al\u0131nm\u0131\u015f. Bir yard\u0131mc\u0131 sa\u011fl\u0131k
  personeli taraf\u0131ndan al\u0131nmas\u0131 s\u0131ras\u0131nda kateter kesilerek,
  distal k\u0131sm\u0131n\u0131n embolizasyonuna neden olunmu\u015f. Intravask\u00fcler
  yabanc\u0131 cisim tan\u0131s\u0131 ile merkezimize sevk edilmi\u015ftir.\\n\\n\u00c7ekilen
  akci\u011fer grafisinde superior vena kavadan trik\u00fcspit kapa\u011fa kadar uzanan
  15 cm''lik radyoopak kateter par\u00e7as\u0131 saptand\u0131 (Resim 1).\\n\\n\u0130ntrakardiak
  yabanc\u0131 cisim tan\u0131s\u0131 konulan hastada, floroskop alt\u0131nda ve ven\u00f6z
  yakla\u015f\u0131m ile, bronkoskopi forsepsi kullan\u0131larak yabanc\u0131 cisim
  \u00e7\u0131kar\u0131lmaya \u00e7al\u0131\u015f\u0131ld\u0131. \u0130\u015flemin
  ba\u015far\u0131s\u0131z olmas\u0131 nedeniyle hasta hemen ameliyata al\u0131nd\u0131.
  Median sternotomi ile ve perikard a\u00e7\u0131larak kalbe ula\u015f\u0131ld\u0131.
  Sa\u011f atrium apendiksine kese a\u011fz\u0131 s\u00fct\u00fcr konarak atrium a\u00e7\u0131ld\u0131.
  Kateter atrium d\u0131\u015f duvar\u0131ndan y\u00f6nlendirilerek, klemp ile kese
  a\u011fz\u0131ndaki insizyon yerinden \u00e7\u0131kar\u0131ld\u0131. Kese a\u011fz\u0131
  s\u00fct\u00fcr ba\u011fland\u0131. Tel s\u00fct\u00fcrlerle sternum kapat\u0131ld\u0131.
  Ameliyat sonras\u0131 erken veya ge\u00e7 komplikasyon saptanmad\u0131. Postoperatif
  \u00e7ekilen akci\u011fer grafisi Resim 2''de g\u00f6r\u00fclmektedir.\\n\\nTart\u0131\u015fma\\n\\nKronik
  b\u00f6brek hastal\u0131\u011f\u0131 nediniyle hemodializ gerektiren hastalarda
  \u00e7ift l\u00fcmenli kateterler rutin olarak bir\u00e7ok merkezde uygulanmaktad\u0131r.
  Subklavyan ven kateterizasyonu kolay yap\u0131labilirli\u011fi, hastan\u0131n g\u00fcnl\u00fck
  akitvitesine engel olmamas\u0131, enfeksiyon riskinin daha az olmas\u0131 nedeniyle
  di\u011fer santral venlere (internal-juguler ven, femoral ven) tercih edilmektedir.
  Buna kar\u015f\u0131 subklavyan ven kateterizasyonunda pn\u00f6motoroks hatta hemotoraks
  risi fazlad\u0131r (5) . Ayr\u0131ca yine uygulama s\u0131ras\u0131nda kullan\u0131lan
  k\u0131lavuz tel veya kateterin superior vena kava ve sa\u011f atrium perforasyonu
  yapabilece\u011fi bildirilmi\u015ftir (6) .\\n\\nK\u0131lavuz tel veya kateter embolisi
  nadir kar\u015f\u0131la\u015f\u0131lan komplikasyonlard\u0131r. \u0130lk kateter
  embolisi 1954 y\u0131l\u0131nda Tonner taraf\u0131ndan bildirilmi\u015ftir (7) .
  G\u00fcn\u00fcm\u00fcze kadar literat\u00fcrde 230 olgu vard\u0131r. Olgumuzda kardiak
  yabanc\u0131 cisim, bir yard\u0131mc\u0131 sa\u011fl\u0131k personelinin, subklavyan
  pozisyonda yerle\u015ftirilmi\u015f hemodializ kateterini \u00e7\u0131karma i\u015flemi
  s\u0131ras\u0131nda kateteri kesmesi ile olu\u015fmu\u015f ilgin\u00e7\\n\\nbir
  komplikasyondur. Bu t\u00fcr i\u015flemlerin, e\u011fitimli ki\u015filerce yap\u0131lmas\u0131
  gerekir. \u0130ntravask\u00fcler ya da intrakardiak yabanc\u0131 cisimler, tromboz
  formasyonu ya da emboli olu\u015fturmas\u0131 ayr\u0131ca aritmi, kalp ve damar
  perforasonu yapmas\u0131 ve enfesiyon kayna\u011f\u0131 olmas\u0131 nedeniyle al\u0131nmalar\u0131
  gerekmektedir (8,9) . Olgumuzda, 11F ve 15 cm''lik kateter fragman\u0131n\u0131n
  intrakardiak yerle\u015fimi, bu t\u00fcr riskleri y\u00fcksek oranda ta\u015f\u0131d\u0131\u011f\u0131
  i\u00e7in acil giri\u015fim karar\u0131 al\u0131nd\u0131.\\n\\nIntrakardiak yabanc\u0131
  cisim ilk kez 1964 yl\u0131nda, ven\u00f6z yakla\u015f\u0131m ile ve bronkoskopi
  forsepsi kullan\u0131larak \u00e7\u0131kar\u0131lm\u0131\u015ft\u0131r (10) . G\u00fcn\u00fcm\u00fczde,
  giri\u015fimsel radyologlar bu ama\u00e7la \u00f6zel forseps ve basket''ler kullanmaktad\u0131rlar
  (9,11,12) . Olgumuzda, kateter delto-pektoral groove''de sefalik venotomiden bronkoskopi
  forsepsi ilerletilerek floroskopi alt\u0131nda al\u0131nmaya \u00e7al\u0131\u015f\u0131ld\u0131.
  Hemodializ kateter fagman\u0131n\u0131n proksimali internal juguler vene do\u011fru
  y\u00f6nlenmi\u015f olmas\u0131 nedeniyle al\u0131namad\u0131. Kateter fragman\u0131n\u0131n
  yeri iyi lokalize edilebilirse, floroskopi alt\u0131nda fosepsle al\u0131nmaya \u00e7al\u0131\u015f\u0131lmal\u0131d\u0131r.
  \u00c7\u00fcnk\u00fc bu y\u00f6ntemin major cerrahi giri\u015fime g\u00f6re riski
  \u00e7ok daha azd\u0131r. \u0130ntravask\u00fcler forsepslerle al\u0131namayan yabanc\u0131
  cisimler, hayati tehlike yaratan komplikasyonlar\u0131 nedeniyle, cerrahi giri\u015fim
  ile al\u0131nmal\u0131d\u0131r.\"", "\"ATM, \u0130nternet ve Telefon Bankac\u0131l\u0131\u011f\u0131
  \u0130\u015flemlerinde G\u00fcvenli\u011finiz \u0130\u00e7in \u00d6nemli Uyar\u0131lar\\n\\nATM\u2019lerde
  \u0130\u015flem G\u00fcvenli\u011finizin Sa\u011flayacak \u00d6neriler\\n\\n- Kart\u0131n\u0131z\u0131n
  \u00fczerine veya c\u00fczdan\u0131n\u0131za kart \u015fifrenizi kesimliyle yazmay\u0131n.
  \u0130sim, do\u011fum g\u00fcn\u00fc veya telefon numaras\u0131 gibi ba\u015fka
  ki\u015filerin kolayca tahmin edebilece\u011fi \u015fifreler kullanmaktan ka\u00e7\u0131n\u0131n.
  \u015eifrenizi banka g\u00f6revlisi dahil kimseyle payla\u015fmay\u0131n.\\n\\n-
  Paran\u0131z\u0131 \u00e7ekerken ATM\u2019ye yak\u0131n durun.\\n\\n- Paran\u0131z\u0131
  emniyetli bir yere koyduktan sonra ATM\u2019den ayr\u0131ln.\\n\\n- \u0130\u015flem
  yapt\u0131\u011f\u0131n\u0131z ATM\u2019de \u015f\u00fcpheli bir durumla kar\u015f\u0131la\u015ft\u0131\u011f\u0131n\u0131zda
  (\u00f6zel olarak yerle\u015ftirilmi\u015f bir cihaz vs.) i\u015flem yapmayarak
  derhal bankan\u0131za haber verin.\\n\\n- ATM\u2019de i\u015flem yaparken \u00e7evrenize
  dikkat edin. \u00c7evrenizde \u015f\u00fcpheli \u015fah\u0131slar olmad\u0131\u011f\u0131ndan
  emin olun.\\n\\n- Kart\u0131n\u0131z\u0131n ATM\u2019de s\u0131k\u0131\u015fmas\u0131,
  alkolunmas\u0131 gibi ocurrumlarda size yard\u0131mc\u0131 olmak isteyen ki\u015filere
  dikkat edin. K\u00f6tniyetli ki\u015filer, ATM\u2019de kart\u0131n\u0131z s\u0131k\u0131\u015ft\u0131\u011f\u0131nda
  ATM\u2019ye tekrar \u015fifrenizi girmeniz halinde kart\u0131n\u0131z\u0131n iptal
  edilece\u011fini belirtebilir ve hatta kendi cep telefonlar\u0131 ile bankan\u0131z\u0131
  araman\u0131za yard\u0131mc\u0131 olmay\u0131 teklif ederek kart \u015fifrenizi
  elde edebilirler. Bu t\u00fcr durumlarda, tan\u0131mad\u0131\u011f\u0131n\u0131z
  ki\u015filerden yard\u0131m almay\u0131n. Varsa kendi cep telefonunuzla veya en
  yak\u0131ndaki g\u00fcvenli bir telefona bilgi verin.\\n\\n- \u015eifrenizi girerken
  \u015fifreninizi seslenmeyin.\\n\\nG\u00fcvenli\u011finiz ile ilgili konularda sorular\u0131n\u0131z
  ve teredd\u00fct ett\u00fc\u011f\u00fcn\u00fcz konuslar i\u00e7in l\u00fctfen bankan\u0131za
  ba\u015fvurun.\\n\\n\u0130nternet Bankac\u0131l\u0131\u011f\u0131nda \u0130\u015flem
  G\u00fcvenli\u011finizin Sa\u011flayacak \u00d6neriler\\n\\n- \u0130nternet \u015fifreleriniz,
  online hesap bilgilerinize eri\u015fimin anahtar\u0131d\u0131r. \u015eifrenizi bir
  yere yazmay\u0131n, bilgisayar\u0131n\u0131za veya taray\u0131c\u0131n\u0131za kaydettirmeyin.
  \u0130sim, do\u011fum g\u00fcn\u00fc veya telefon numaras\u0131 gibi ba\u015fka
  ki\u015filerin kolayca tahmin edebilece\u011fi \u015fifreler kullanmay\u0131n.\\n\\n-
  Ba\u015fkalar\u0131na ait veya g\u00fcvenli\u011finden emin olmad\u0131\u011f\u0131n\u0131z
  bilgisayardan internet bankac\u0131l\u0131\u011f\u0131 i\u015flemleri yapmay\u0131n.\\n\\n-
  Bankalar ki\u015fisel bilgilerinizi sizden e-posta yoluya talep etmez. Ki\u015fisel
  bilgilerinizi soran e-postalara cevap vermeyin; ki\u015fisel bilgilerinizi e-posta
  ile g\u00f6ndermeyin ve bu t\u00fcr durumlarda bankan\u0131za derhal konu hakk\u0131nda
  bilgi verin.\\n\\n- Tan\u0131d\u0131\u011f\u0131n\u0131z ki\u015fi ya da kurumlardan
  g\u00f6nderildi\u011finden emin olmad\u0131\u011f\u0131n\u0131z e-postalar\u0131n
  i\u00e7erisinde bulunan linkleri t\u0131klamay\u0131n, ekleri bilgisayar\u0131n\u0131za
  y\u00fcklemeyin.\\n\\n- Eri\u015fmek istedi\u011finiz web sayfas\u0131n\u0131n adresini,
  internet taray\u0131c\u0131s\u0131n\u0131n adres sat\u0131r\u0131na yaz\u0131n.\\n\\n-
  Bilgisayar\u0131n\u0131za anti-vir\u00fcs ve g\u00fcvenlik duvar\u0131 (firewall)
  programlar\u0131 kurun ve s\u00fcrekli g\u00fcncel tutun.\\n\\nTelefon Bankac\u0131l\u0131\u011f\u0131nda
  \u0130\u015flem G\u00fcvenli\u011finizin Sa\u011flayacak \u00d6neriler\\n\\n- Telefon
  \u015fifreniz hesap bilgilerinize eri\u015fimin anahtar\u0131d\u0131r. \u015eifrenizi
  bir yere yazmay\u0131n veya bilgisayar\u0131n\u0131za kaydettirmeyin. \u0130sim,
  do\u011fum g\u00fcn\u00fc veya telefon numaras\u0131 gibi kolayca tahmin edilebilecek
  \u015fifreler kullanmay\u0131n.\\n\\n- Telefon \u015fifreleri telefona tu\u015flanarak
  girilmelidir. Bankalar\u0131n \\\"telefon bankac\u0131l\u0131\u011f\u0131 servisleri\\\"
  g\u00f6r\u00fc\u015fmelerinize sizden i\u015flem \u015fifrelerinizi s\u00f6z\u00fc
  olarak talep etmez. \u015eifrelerinizi s\u00f6z\u00fc veya yaz\u0131l\u0131 olarak
  talep edilirse kesinlikle bilgi vermeyin; g\u00f6r\u00fc\u015fmelerinizi derhal
  sonland\u0131rarak bankan\u0131za konu hakk\u0131nda bilgi verin.\\n\\n- Ba\u015fkalar\u0131na
  ait ve kamuya a\u00e7\u0131k alanlardaki telefonlardan g\u00f6r\u00fc\u015fme yapmak
  i\u00e7in, arad\u0131\u011f\u0131n\u0131z numaray\u0131 kendiniz \u00e7evirin. Numaray\u0131
  do\u011fru \u00e7evirdi\u011finizden emin olun.\\n\\n- Yapt\u0131\u011f\u0131n\u0131z
  g\u00f6r\u00fc\u015fmeler sonras\u0131nda, tu\u015flad\u0131\u011f\u0131n\u0131z
  i\u015flem \u015fifrelerinizin telefon haf\u0131zas\u0131na al\u0131nmad\u0131\u011f\u0131ndan
  emin olun.\\n\\n- K\u00f6t\u00fc niyetli ki\u015filer, kendi cep telefonlar\u0131n\u0131
  vererek size yard\u0131m teklifinde bulunabilirler. Bu ki\u015filer, haz\u0131rlad\u0131klar\u0131
  mizansenlerle banka g\u00f6revlisi gibi konu\u015farak \u015fifre ve do\u011fum
  tarihi, anne k\u0131zl\u0131k soyad\u0131 gibi \u00f6zl\u0131k bilgilerinizi elde
  etmeye \u00e7al\u0131\u015fabilir, hatta geli\u015fmi\u015f cep telefonlar\u0131
  ile tu\u015flad\u0131\u011f\u0131n\u0131z \u015fifreleri saklayabilir ve g\u00f6r\u00fc\u015fmelerinizin
  ses kayd\u0131n\u0131 alabilirler.\"", "\"YURT\u0130\u00c7\u0130 TOPLU APS KURYE,  POSTA
  KARGOSU VE KARGO \u00dcCRET \u0130ND\u0130R\u0130M TAR\u0130FES\u0130 AYLIK POSTAYA
  VER\u0130LEN G\u00d6NDER\u0130LER\\n\\nA\u00c7IKLAMALAR:\\n\\n1- Tabloda yer alan
  adet ve ciro rakamlar\u0131 ayl\u0131k olup adet veya ciro rakamlar\u0131n\u0131n
  12 ile \u00e7arp\u0131lmas\u0131 suretiyle y\u0131ll\u0131k taahh\u00fct al\u0131nabilecektir.\\n2-
  Ayl\u0131k verilen taahh\u00fctlerde kabul edilen g\u00f6nderi say\u0131s\u0131n\u0131n
  20 adet veya \u00fccret tutar\u0131n\u0131n 440 TL''nin alt\u0131nda kalmas\u0131
  halinde indirim uygulanmaz. Y\u0131ll\u0131k verilen taahh\u00fctlerde kabul edilen
  g\u00f6nderi say\u0131s\u0131n\u0131nn 240 adet veya \u00fccret tutar\u0131n\u0131n
  5.280 TL''nin alt\u0131nda kalmas\u0131 halinde ayl\u0131k 20 adet veya \u00fccret
  tutar\u0131n\u0131n 440 TL'' nin alt\u0131nda kalan aylar i\u00e7in indirim uygulanmaz,
  ayn\u0131 anda 10 adetten az g\u00f6nderi kabullerine ayr\u0131ca adresten al\u0131m
  \u00fccreti taahhuk ettirilir.\\n3- \u00dccreti al\u0131c\u0131dan tahsil \u00f6zel
  hizmetiyle verilen g\u00f6nderiler adet olarak de\u011ferlendirilecek olup, ciro
  olarak verilen taahh\u00fctler dikkate al\u0131nmayacakt\u0131r.\\n4- Tabloda belirtilen
  ayl\u0131k adet veya postaya verilen g\u00f6nderilerin indirimsiz toplam \u00fccreti
  (Ciro) kar\u015f\u0131l\u0131\u011f\u0131ndaki indirim oranlar\u0131ndan hangisi
  y\u00fcksek ise o indirim oran\u0131 uygulan\u0131r.\\n5- Dini bayramlar ve y\u0131lba\u015f\u0131
  ile anneler, babalar, sevgililer, \u00f6\u011fretmenler g\u00fcn\u00fc ve PTT''nin
  kurulu\u015f y\u0131ld\u00f6n\u00fcm\u00fc olan 23 Ekim g\u00fcn\u00fcnden \u00f6nceki
  5 i\u015f g\u00fcn\u00fc i\u00e7inde postaya verilen yurti\u00e7i APS Kurye ve posta
  kargosuna %25 indirim uygulan\u0131r. (Herhangi bir indirimden faydalanan g\u00f6nderilere
  ayr\u0131ca bu indirim uygulanmaz)\\n6- Kargolara (30 kg./100 DES\u0130 \u00fczeri)
  yap\u0131lacak indirim %30''dan fazla olamaz.\\n7- S\u00f6zle\u015fmelerinde g\u00f6nderi
  say\u0131s\u0131 veya ciro taahh\u00fct eden m\u00fc\u015fterilerin taahh\u00fctlerini
  yerine getirememeleri halinde yukar\u0131da yer alan tarifeye g\u00f6re \u00fccretlendirilir.\\n8-
  APS Kurye, Posta Kargosu ve Kargolar i\u00e7in m\u00fc\u015fterek yap\u0131lan s\u00f6zle\u015fmelerde
  adet veya ciro \u00fczerinden uygulanacak indirimin tespitinde kargo adedi veya
  cirosu dikkate al\u0131nacak, ancak kargolara uygulanacak indirim oran\u0131 %30''u
  ge\u00e7meyecektir. Di\u011fer g\u00f6nderilere ise toplam adet ve ciro miktar\u0131na
  g\u00f6re tabloda kar\u015f\u0131l\u0131k gelen indirim oranlar\u0131 uygulanacakt\u0131r.\\n9-
  \u0130ndirimler APS Kurye, Posta Kargosu veya Kargo \u00fccreti ile \u00f6zel hizmet
  \u00fccretleri toplam\u0131ndan KDV hari\u00e7 hesaplan\u0131r.\"", "\"Ki\u015fisel
