  obejmuj\u0105ce obiad oraz przerw\u0119 kawow\u0105 na zaj\u0119cia trwaj\u0105ce
  co najmniej 6 godzin w ci\u0105gu dnia,\\nd) \u015brodki ochrony osobistej.\\n\\n\u00a7
  5\\n\\nZAKO\u0143CZENIE I PRZERWANIE UDZIA\u0141U W PROJEKCIE\\n\\n1. Zako\u0144czenie
  udzia\u0142u w Projekcie jest r\u00f3wnoznaczne ze zrealizowaniem zgodnie z I\u015aR
  ca\u0142ej zaplanowanej dla danego uczestnika \u015bcie\u017cki wsparcia, z zastrze\u017ceniem
  \u017ce w trakcie uczestnictwa w Projekcie mo\u017cliwa jest aktualizacja I\u015aR
