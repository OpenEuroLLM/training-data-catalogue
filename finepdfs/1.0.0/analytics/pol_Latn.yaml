  uchybia dyspozycji art. 226 ust. 2a ustawy o finansach publicznych jednoznacznie
  stanowi\u0105cej, i\u017c do wieloletniej prognozy finansowej do\u0142\u0105cza
  si\u0119 obja\u015bnienia przyj\u0119tych warto\u015bci; w obja\u015bnieniach mog\u0105
  by\u0107 zawarte tak\u017ce informacje uszczeg\u00f3\u0142awiaj\u0105ce dane, o
  kt\u00f3rych mowa w ust. 1 (2 przypadki),\\n\\n\u2212 korekty wymagaj\u0105 informacje
  zamieszczone w kolumnie 12.5 za\u0142\u0105cznika nr 1 do wieloletniej prognozy
  finansowej, gdy\u017c nie s\u0105 sp\u00f3jne z danymi wskazanymi w pozosta\u0142ej
  cz\u0119\u015bci wieloletniej prognozy finansowej (2 przypadki),\\n\u2212 niezale\u017cnie
  od przed\u0142o\u017cenia projektu wieloletniej prognozy finansowej w formie dokumentu
  elektronicznego do Izby dor\u0119czono tak\u017ce wersj\u0119 papierow\u0105 ww.
  projektu. W zakresie przedsi\u0119wzi\u0119\u0107 wymienionych w pozycjach 18.104.22.168.
  oraz 22.214.171.124. zwiera ona dodatkowe obja\u015bnienia, kt\u00f3re nie zosta\u0142y
  zamieszczone w przes\u0142anym dokumencie w formie elektronicznej. Sk\u0142ad Orzekaj\u0105cy
  wskazywa\u0142, i\u017c w za\u0142\u0105czniku nr 2 zawieraj\u0105cym wykaz przedsi\u0119wzi\u0119\u0107
  nale\u017cy dostosowa\u0107 limit wydatk\u00f3w do okresu realizacji. Limit wydatk\u00f3w
  zaplanowano do roku 2021, natomiast okres realizacji przedmiotowego zadania okre\u015blono
  na lata 2018-2023 (1 przypadek),\\n\u2212 w za\u0142\u0105czniku do wieloletniej
  prognozy finansowej w latach 2028-2030 nie zosta\u0142y uzupe\u0142nione dane w
  zakresie poszczeg\u00f3lnych rodzaj\u00f3w dochod\u00f3w (1 przypadek),\\n\u2212
  zaplanowano w za\u0142\u0105czniku do wieloletniej prognozy finansowej inne przychody
  niezwi\u0105zane z zaci\u0105gni\u0119ciem d\u0142ugu przy czym w obja\u015bnieniach
  do wieloletniej prognozy finansowej nie odniesiono si\u0119 do tych warto\u015bci
  (1 przypadek),\\n\u2212 poziom planowanych wydatk\u00f3w na obs\u0142ug\u0119 d\u0142ugu
  w projekcie uchwa\u0142y o wieloletniej prognozie finansowej zakre\u015blono w ramach
  czasowych, co w \u015bwietle przywo\u0142anego okresu sp\u0142aty zad\u0142u\u017cenia
  winno zosta\u0107 zweryfikowane w kontek\u015bcie dyspozycji art. 92 ust. 1 ustawy
  o finansach publicznych (1 przypadek),\\n\u2212 sk\u0142ad orzekaj\u0105cy jednoznacznie
  zauwa\u017cy\u0142, i\u017c istotny wp\u0142yw na r\u00f3\u017cnic\u0119 pomi\u0119dzy
  wska\u017anikiem planowanej \u0142\u0105cznej kwoty sp\u0142aty zobowi\u0105za\u0144
  (po uwzgl\u0119dnieniu ustawowych wy\u0142\u0105cze\u0144), o kt\u00f3rej mowa w
  art. 243 ust. 1 ustawy o finansach publicznych, a dopuszczalnym wska\u017anikiem
  sp\u0142aty zobowi\u0105za\u0144 posiada\u0107 b\u0119dzie wykonanie dochod\u00f3w
  ze sprzeda\u017cy maj\u0105tku, W powo\u0142anym kontek\u015bcie sk\u0142ad orzekaj\u0105cy
  zwr\u00f3ci\u0142 uwag\u0119 na zr\u00f3\u017cnicowany poziom dotychczasowego wykonania
  powo\u0142anego \u017ar\u00f3d\u0142a dochodu bud\u017cetu. Uzasadnienie realno\u015bci
  prognozy planowanych wielko\u015bci dochod\u00f3w ze sprzeda\u017cy maj\u0105tku
  nie wynika z zawartych obja\u015bnie\u0144 do projektu uchwa\u0142y w sprawie wieloletniej
  prognozy finansowej, kt\u00f3re zgodnie z art. 226 ust. 2a ustawy o finansach publicznych
  winny zawiera\u0107 tak\u017ce informacje uszczeg\u00f3\u0142awiaj\u0105ce dane,
  o kt\u00f3rych mowa w ust. 1 w zakresie przyj\u0119tych warto\u015bci, co w \u015bwietle
  stopnia realizacji tego \u017ar\u00f3d\u0142a dochodu gminy maj\u0105cego bezpo\u015brednie
  prze\u0142o\u017cenie na spe\u0142nienie wska\u017anika z art. 243 ustawy o finansach
  publicznych i mo\u017cliwo\u015b\u0107 uchwalania bud\u017cet\u00f3w w latach przysz\u0142ych
  posiada donios\u0142e znaczenie (2 przypadki),\\n\\n\u2212 w obja\u015bnieniach
  do projektu wieloletniej prognozy finansowej nie odniesiono si\u0119 do planowanego
  wzrostu dochod\u00f3w bie\u017c\u0105cych, osi\u0105gniecia dochod\u00f3w ze sprzeda\u017cy
  mienia, jak r\u00f3wnie\u017c do dzia\u0142a\u0144, kt\u00f3re zostan\u0105 podj\u0119te
  w zwi\u0105zku z szukaniem oszcz\u0119dno\u015bci w ramach wydatk\u00f3w bie\u017c\u0105cych
  (1 przypadek),\\n\u2212 niskie wykonanie dochod\u00f3w maj\u0105tkowych \u2013 sk\u0142ad
  orzekaj\u0105cy zwr\u00f3ci\u0142 uwag\u0119, \u017ce realizacja dochod\u00f3w ze
  sprzeda\u017cy mienia  ma istotny wp\u0142yw na spe\u0142nienie relacji, o kt\u00f3rych
  mowa w art. 243 ustawy o finansach publicznych. Niskie wykonanie zaplanowanych dochod\u00f3w
  maj\u0105tkowych (ze sprzeda\u017cy mienia) to sytuacja, kt\u00f3ra utrzymuje si\u0119
  od kilku lat. W \u015bwietle powy\u017cszego sk\u0142ad wyrazi\u0142 zastrze\u017cenia  co
  do wykonania zaplanowanych dochod\u00f3w ze sprzeda\u017cy mienia w roku 2019 (1
  przypadek),\\n\u2212 gmina zaplanowa\u0142a w roku 2019 dochody maj\u0105tkowe w
  rozdziale 92195, paragraf 078 \u201eWp\u0142ywy ze zbycia praw maj\u0105tkowych\\\",
  z czego wi\u0119ksza  cz\u0119\u015b\u0107 kwoty zostanie wydatkowana na sp\u0142at\u0119
  zobowi\u0105za\u0144 wobec Inwestora. Powy\u017csze wskazuje, \u017ce gmina po raz
  kolejny planuje uzyska\u0107 \u015brodki finansowe na sp\u0142at\u0119 zobowi\u0105za\u0144
  od Sp\u00f3\u0142ki. W kolejnych latach \u017ar\u00f3d\u0142em sp\u0142aty zobowi\u0105za\u0144
  b\u0119d\u0105 wypracowane nadwy\u017cki operacyjne oraz umorzenia udzia\u0142\u00f3w
  w Sp\u00f3\u0142ce, jednak w poprzednich latach nie uda\u0142o si\u0119 wygospodarowa\u0107
  nadwy\u017cek operacyjnych na zaplanowanym poziomie. Jednostka w obja\u015bnieniach
  wskaza\u0142a, \u017ce zosta\u0142y podj\u0119te dzia\u0142ania w celu zwi\u0119kszenia
  dochod\u00f3w bie\u017c\u0105cych w kolejnych latach, jak r\u00f3wnie\u017c rozpocz\u0119to
  ograniczanie wydatk\u00f3w bie\u017c\u0105cych. Bior\u0105c pod uwag\u0119 dzia\u0142ania
  zmierzaj\u0105ce do uzyskania dodatkowych dochod\u00f3w bie\u017c\u0105cych (wzrost
  podatk\u00f3w oraz op\u0142aty z tytu\u0142u gospodarowania odpadami komunalnymi)
  trudno bez zastrze\u017ce\u0144 przyj\u0105\u0107 fakt, \u017ce gmina w trakcie
  roku b\u0119dzie w stanie wygospodarowa\u0107 planowan\u0105 kwot\u0119 nadwy\u017cki
  operacyjnej, a w kolejnym roku jeszcze wi\u0119ksz\u0105 kwot\u0119. W ramach ograniczania
  wydatk\u00f3w w kolejnych latach w obja\u015bnieniach wskazano jedynie og\u00f3lnikowo
  na oszcz\u0119dno\u015bci na wynagrodzeniach w administracji i o\u015bwiacie (wygaszanie
  gimnazj\u00f3w, utworzenie referatu obs\u0142ugi finansowo-ksi\u0119gowej jednostek
  organizacyjnych gminy). Maj\u0105c na uwadze powy\u017csze przyj\u0119ty mechanizm
  finansowania, zgodnie z kt\u00f3rym gmina uzyskuje ze Sp\u00f3\u0142ki \u015brodki
  finansowe (umorzenie udzia\u0142\u00f3w) w celu poniesienia wydatk\u00f3w z tytu\u0142u
  nabycia udzia\u0142\u00f3w w Sp\u00f3\u0142ce na podstawie umowy zawartej pomi\u0119dzy
  Gmin\u0105 a Inwestorem, budzi istotne zastrze\u017cenia sk\u0142adu bowiem uzyskane
  przez Sp\u00f3\u0142k\u0119 \u015brodki nie s\u0105 przeznaczane na cele, na kt\u00f3re
  zgodnie z umow\u0105 powinny zosta\u0107 wykorzystane. Gmina, w kolejnym roku, nie
  jest w stanie wygospodarowa\u0107 \u201eoszcz\u0119dno\u015bci\\\", z kt\u00f3rych
  by\u0142aby w stanie uregulowa\u0107 swoje zobowi\u0105zanie wobec Inwestora. Natomiast
  w kolejnych latach \u017ar\u00f3d\u0142em sp\u0142at zobowi\u0105za\u0144 b\u0119d\u0105
  wypracowane nadwy\u017cki operacyjne oraz umorzenia udzia\u0142\u00f3w w Sp\u00f3\u0142ce.
  Taki model sp\u0142at potwierdza wskazane powy\u017cej zastrze\u017cenia sk\u0142adu
  orzekaj\u0105cego dotycz\u0105ce zar\u00f3wno wypracowania cz\u0119\u015bci nadwy\u017cki
  operacyjnej na sp\u0142at\u0119 zobowi\u0105za\u0144, jak r\u00f3wnie\u017c celu
  wykorzystywania \u015brodk\u00f3w, kt\u00f3re mia\u0142y by\u0107 przeznaczone na
  realizacj\u0119 zada\u0144 inwestycyjnych a nie na zwrot do Inwestora (1 przypadek).\\n\\nWydano
  jedn\u0105 opini\u0119 negatywn\u0105. Relacja planowanej \u0142\u0105cznej kwoty
  sp\u0142aty zobowi\u0105za\u0144 (po uwzgl\u0119dnieniu ustawowych wy\u0142\u0105cze\u0144),
  jest bliska przekroczenia maksymalnego dopuszczalnego wska\u017anika sp\u0142aty.
  W tej sytuacji nawet nieznaczne niewykonanie kwot zaplanowanych zar\u00f3wno w bud\u017cecie
  roku 2018, jak r\u00f3wnie\u017c w projekcie bud\u017cetu na rok 2019 w zakresie
  wielko\u015bci wp\u0142ywaj\u0105cych na relacj\u0119, o kt\u00f3rej mowa w art.
  243 ustawy o finansach publicznych b\u0119dzie skutkowa\u0107 niespe\u0142nieniem
  przez powiat relacji, o kt\u00f3rej mowa w art. 243 cyt. ustawy, umo\u017cliwiaj\u0105cej
  zgodne z prawem uchwalenie bud\u017cetu w latach przysz\u0142ych. Sytuacja ta nie
  jest hipotetyczna, bowiem w wyliczeniu dopuszczalnych limit\u00f3w sp\u0142at zad\u0142u\u017cenia
  uj\u0119to przewidywane wykonanie dochod\u00f3w ze sprzeda\u017cy mienia w roku
  2018 (powielaj\u0105c plan z uchwa\u0142y bud\u017cetowej wed\u0142ug stanu na 30
  wrze\u015bnia 2018 r.). Natomiast, jak wynika z wyja\u015bnie\u0144 Zarz\u0105du
  Powiatu, wykonanie dochod\u00f3w ze sprzeda\u017cy mienia wynios\u0142o 0,7% planu.
  Oznacza to w istocie, \u017ce zaplanowane dochody ze sprzeda\u017cy mienia powiatu
  nie zostan\u0105 zrealizowane, stopie\u0144 ich wykonania prawdopodobnie nie przekroczy
  1 % planu, a jednak Zarz\u0105d Powiatu wprowadzi\u0142 je w projekcie WPF w kolumnie
  dochody ze sprzeda\u017cy maj\u0105tku 1.2.1 , w wierszu - \u201ewykonanie 2018\\\"
  w pe\u0142nej wysoko\u015bci.\\n\\nDzia\u0142ania takiego nie spos\u00f3b oceni\u0107
  inaczej ni\u017c jako opieranie projektu wieloletniej prognozy finansowej powiatu
  na nierzetelnych i nierealnych podstawach. Sk\u0142ad orzekaj\u0105cy wskazywa\u0142,
  \u017ce dochody ze sprzeda\u017cy tych samych nieruchomo\u015bci, zosta\u0142y zaplanowane
  w projekcie bud\u017cetu roku 2019. Jest oczywiste, \u017ce dochody ze sprzeda\u017cy
  tych samych nieruchomo\u015bci nie mog\u0105 by\u0107 osi\u0105gni\u0119te w dw\u00f3ch
  r\u00f3\u017cnych latach bud\u017cetowych.\\n\\nPrzeprowadzenie symulacji polegaj\u0105cej
  na wprowadzeniu do projektu wieloletniej prognozy finansowej realnych warto\u015bci
  w zakresie wykonania dochod\u00f3w ze sprzeda\u017cy mienia w roku 2018, spowoduje,
  i\u017c powiat nie spe\u0142ni relacji, o kt\u00f3rej mowa w art. 243 ustawy o finansach
  publicznych w latach 2019, 2020 i 2021. Oznacza to, \u017ce bud\u017cet na rok 2019
  w takim kszta\u0142cie nie mo\u017ce by\u0107 zgodnie z prawem uchwalony (art. 243
  ust. 1 ustawy o finansach publicznych).\\n\\nSk\u0142ad orzekaj\u0105cy wskazywa\u0142
  r\u00f3wnie\u017c, i\u017c jak wynika m. in. z obja\u015bnie\u0144 do WPF powiat
  posiada r\u00f3wnie\u017c zobowi\u0105zania z tytu\u0142u zawartych um\u00f3w leasingu
  na nieruchomo\u015bciach. Maj\u0105c na wzgl\u0119dzie zar\u00f3wno Mi\u0119dzynarodowe
  Standardy\\n\\nRachunkowo\u015bci, procedowane w parlamencie zmiany w przepisach
  o finansach publicznych a tak\u017ce przejrzysto\u015b\u0107 gospodarki finansowej
  powiatu, zobowi\u0105zania z tego tytu\u0142u winny by\u0107 zakwalifikowane w WPF
  jako d\u0142ug, a sp\u0142ata tych zobowi\u0105za\u0144 winna by\u0107 wykazana
  jako wydatki zmniejszaj\u0105ce d\u0142ug.\\n\\nSk\u0142ad wskazuje r\u00f3wnie\u017c,
  i\u017c szereg danych zawartych w projekcie WPF nie znajduje przekonywuj\u0105cego
  uzasadnienia, jak przyk\u0142adowo spadek wydatk\u00f3w bie\u017c\u0105cych w 2020
  roku w stosunku do 2019 co stanowi 4,2%. W\u0105tpliwo\u015bci Sk\u0142adu budzi
  r\u00f3wnie\u017c spadek wydatk\u00f3w na obs\u0142ug\u0119 d\u0142ugu w 2020 r.
  w stosunku do 2019 r. czyli o 24%, w sytuacji gdy kwota d\u0142ugu w analogicznym
  okresie zmniejsza si\u0119 o 2,44%.\\n\\nWy\u017cej wskazane okoliczno\u015bci,
  w tym w szczeg\u00f3lno\u015bci zwi\u0105zane z nierzetelnym wykazaniem danych w
  zakresie wykonania dochod\u00f3w ze sprzeda\u017cy maj\u0105tku w roku 2018 jak
  r\u00f3wnie\u017c nierealistycznym prognozowaniem dochod\u00f3w ze sprzeda\u017cy
  mienia w roku 2019 wp\u0142ywaj\u0105 bezpo\u015brednio na nierealistyczno\u015b\u0107
  przed\u0142o\u017conego projektu wieloletniej prognozy finansowej co skutkuje wydaniem
  opinii negatywnej o przed\u0142o\u017conym projekcie Wieloletniej Prognozy Finansowej
  powiatu na lata 2019-2038.\\n\\nNa podstawie art. 20 ust. 1 ustawy o regionalnych
  izbach obrachunkowych, od opinii sk\u0142ad\u00f3w orzekaj\u0105cych s\u0142u\u017cy
  odwo\u0142anie do Kolegium Izby.\\n\\nOd opinii o przed\u0142o\u017conych projektach
  uchwa\u0142 w sprawie wieloletniej prognozy finansowej nie wniesiono odwo\u0142ania.\\n\\nOpracowa\u0142a
  Zatwierdzi\u0142a Kinga Chodorowska                                                           Magdalena
  Przybylska\\n\\n6\"", "\"OG\u0141OSZENIE OTWARTEGO KONKURSU OFERT NA REALIZACJ\u0118
  W 2017 ROKU ZADA\u0143 PUBLICZNYCH W SFERZE KULTURY, SZTUKI, OCHRONY D\u00d3BR KULTURY
  I DZIEDZICTWA NARODOWEGO, W SFERZE UPOWSZECHNIANIA I OCHRONY WOLNO\u015aCI I PRAW
  CZ\u0141OWIEKA ORAZ SWOB\u00d3D OBYWATELSKICH, A TAK\u017bE DZIA\u0141A\u0143 WSPOMAGAJ\u0104CYCH
  ROZW\u00d3J DEMOKRACJI ORAZ W SFERZE DZIA\u0141ALNO\u015aCI NA RZECZ MNIEJSZO\u015aCI
  NARODOWYCH I ETNICZNYCH ORAZ J\u0118ZYKA REGIONALNEGO.\\n\\nI. RODZAJE ZADA\u0143\\n\\n1.
  Festiwale i wydarzenia artystyczne o zasi\u0119gu og\u00f3lnopolskim i mi\u0119dzynarodowym
  - wysoko\u015b\u0107 \u015brodk\u00f3w publicznych przeznaczonych na realizacj\u0119
  tego zadania: 300.000 z\u0142.\\n\\nCelem zadania jest realizacja projekt\u00f3w
  o wysokiej randze artystycznej z udzia\u0142em profesjonalnych tw\u00f3rc\u00f3w:
  festiwali, koncert\u00f3w, wystaw, przedsi\u0119wzi\u0119\u0107 teatralnych, wydawnictw
  i innych, maj\u0105cych szczeg\u00f3lne znaczenie dla kultury wojew\u00f3dztwa podlaskiego.\\n\\n2.
  Dziedzictwo, tradycja, to\u017csamo\u015b\u0107 - wysoko\u015b\u0107 \u015brodk\u00f3w
  publicznych przeznaczonych na realizacj\u0119 tego zadania: 110.000 z\u0142.\\n\\nCelem
  zadania jest realizacja inicjatyw s\u0142u\u017c\u0105cych popularyzacji i ochronie
  element\u00f3w tradycyjnej kultury ze szczeg\u00f3lnym uwzgl\u0119dnieniem materialnego
  i niematerialnego dziedzictwa kulturowego wojew\u00f3dztwa podlaskiego w formie
  m.in. przegl\u0105d\u00f3w, konkurs\u00f3w, festiwali, wystaw, konferencji, bada\u0144,
  wydawnictw oraz organizacja obchod\u00f3w, uroczysto\u015bci i przedsi\u0119wzi\u0119\u0107
  rocznicowych zwi\u0105zanych z budowaniem niepodleg\u0142o\u015bci suwerenno\u015bci
  Rzeczypospolitej Polskiej.\\n\\n3. Edukacja kulturalna dzieci i m\u0142odzie\u017cy
  - wysoko\u015b\u0107 \u015brodk\u00f3w publicznych przeznaczonych na realizacj\u0119
  tego zadania: 110.000 z\u0142.\\n\\nW ramach zadania wspierane b\u0119d\u0105 projekty
  edukacyjne realizowane poprzez r\u00f3\u017cnorodne formy dzia\u0142a\u0144 artystycznych
  i warsztatowych adresowane do r\u00f3\u017cnych grup wiekowych, w szczeg\u00f3lno\u015bci
  do dzieci i m\u0142odzie\u017cy, g\u0142\u00f3wnie nie maj\u0105cych bezpo\u015bredniego
  dost\u0119pu do instytucji kultury.\\n\\n4. Przedsi\u0119wzi\u0119cia artystyczne
  o zasi\u0119gu regionalnym, s\u0142u\u017c\u0105ce popularyzacji r\u00f3\u017cnych
  dziedzin kultury - wysoko\u015b\u0107 \u015brodk\u00f3w publicznych przeznaczonych
  na realizacj\u0119 tego zadania: 80.000 z\u0142.\\n\\nW ramach zadania wspierane
  b\u0119d\u0105 projekty kreuj\u0105ce, realizuj\u0105ce i wspieraj\u0105ce dzia\u0142alno\u015b\u0107
  artystyczn\u0105 o zasi\u0119gu regionalnym poprzez: koncerty, spektakle, przegl\u0105dy,
  konkursy, festiwale, warsztaty, wydawnictwa, itp.\\n\\n5. Dialog mi\u0119dzykulturowy
  i rozw\u00f3j \u015bwiadomo\u015bci obywatelskiej - wysoko\u015b\u0107 \u015brodk\u00f3w
  publicznych przeznaczonych na realizacj\u0119 tego zadania: 50.000 z\u0142.\\n\\nCelem
  zadania jest realizacja zada\u0144  przyczyniaj\u0105cych si\u0119 do rozwoju dialogu
  mi\u0119dzykulturowego, kszta\u0142towania otwartych postaw wobec odmienno\u015bci,
  a tak\u017ce przyczyniaj\u0105cych si\u0119 do rozwoju \u015bwiadomo\u015bci obywatelskiej
  i spo\u0142ecznej mieszka\u0144c\u00f3w.\\n\\n6. Wspieranie inicjatyw kulturalnych
  mniejszo\u015bci narodowych i etnicznych zamieszkuj\u0105cych na terenie wojew\u00f3dztwa
  podlaskiego - wysoko\u015b\u0107 \u015brodk\u00f3w publicznych przeznaczonych na
  realizacj\u0119 tego zadania: 100.000 z\u0142.\\n\\nCelem zadania jest realizacja
  przedsi\u0119wzi\u0119\u0107 polegaj\u0105cych na budowaniu dialogu w\u015br\u00f3d
  grup narodowych i etnicznych, organizowaniu lub uczestnictwie w dzia\u0142aniach
  zmierzaj\u0105cych do ochrony, zachowania i rozwoju  to\u017csamo\u015bci kulturowej.
  Zadania maj\u0105 by\u0107 organizowane lub wsp\u00f3\u0142organizowane przez organizacje
  mniejszo\u015bci narodowych i etnicznych.\\n\\nII. ZASADY PRZYZNAWANIA DOTACJI\\n\\n1.
  Przyznawanie dotacji nast\u0119puje na zasadzie wspierania wykonywania zadania publicznego,\\n\\no
  kt\u00f3rym m\u00f3wi art. 5 ust. 4 pkt. 2  ustawy z dnia 24 kwietnia 2003 r. o
  dzia\u0142alno\u015bci po\u017cytku publicznego i o wolontariacie (Dz. U. z 2016
  r. poz. 1817)\\n2. Wnioskowana maksymalna kwota dotacji na wsparcie realizacji zadania
  nie mo\u017ce przekracza\u0107 85 % koszt\u00f3w finansowych realizacji ca\u0142o\u015bci
  zadania:\\n1) oferent ma obowi\u0105zek wniesienia wk\u0142adu w\u0142asnego w wysoko\u015bci
  co najmniej 15% ca\u0142kowitego kosztu zadania, z czego wk\u0142ad finansowy musi
  wynosi\u0107 co najmniej 5% warto\u015bci zadania,\\n2) wk\u0142ad w\u0142asny mo\u017ce
  by\u0107 wniesiony w ca\u0142o\u015bci ze \u015brodk\u00f3w finansowych (\u015brodki
  w\u0142asne, inne \u017ar\u00f3d\u0142a finansowania, op\u0142aty adresat\u00f3w
  zadania) lub ze \u015brodk\u00f3w finansowych i wk\u0142adu niefinansowego, w proporcjach
  wymienionych w punkcie 1,\\n3) wk\u0142ad finansowy \u2013 \u015brodki finansowe
  w\u0142asne oferenta lub pozyskane przez niego ze \u017ar\u00f3de\u0142 innych ni\u017c
  bud\u017cet samorz\u0105du wojew\u00f3dztwa,\\n4) wk\u0142ad osobowy \u2013 nieodp\u0142atna,
  dobrowolna praca, w tym \u015bwiadczenia wolontariuszy i praca spo\u0142eczna cz\u0142onk\u00f3w
  organizacji,\\n5) wk\u0142ad rzeczowy \u2013kalkulacja warto\u015bci wk\u0142adu
  rzeczowego dokonywana jest jedynie w zakresie w jakim wk\u0142ad ten b\u0119dzie
  w rzeczywisto\u015bci wykorzystany podczas realizacji zadania publicznego i powinna
  opiera\u0107 si\u0119 na cenach rynkowych.\\n6) Stawki godzinowe do wyceny wk\u0142adu
  osobowego s\u0105 okre\u015blone w nast\u0119puj\u0105cy spos\u00f3b:\\n\\nw przypadku
  prac administracyjnych i pomocniczych: maksymalnie 30 z\u0142/godz.,\\n w przypadku
  prac ekspert\u00f3w i specjalist\u00f3w: maksymalnie 100 z\u0142/godz.,\\n w przypadku
  prac ekspert\u00f3w, specjalist\u00f3w, w tym zagranicznych, kt\u00f3rych stawki
  godzinowe przekraczaj\u0105 maksymalnie 100 z\u0142/godz. oferent musi uzasadni\u0107
  wysoko\u015b\u0107 wy\u017cszej stawki.\\n3. Dopuszcza si\u0119 pobieranie \u015bwiadcze\u0144
  pieni\u0119\u017cnych od odbiorc\u00f3w zadania publicznego pod warunkiem, \u017ce
  podmiot realizuj\u0105cy zadanie publiczne prowadzi dzia\u0142alno\u015b\u0107 odp\u0142atn\u0105
  po\u017cytku publicznego, z kt\u00f3rej zysk przeznacza wy\u0142\u0105cznie na dzia\u0142alno\u015b\u0107
  statutow\u0105.\\n\\nIII.PODMIOTY UPRAWNIONE DO SK\u0141ADANIA OFERT\\n\\n1. Organizacje
  pozarz\u0105dowe w rozumieniu ustawy z dnia 24 kwietnia 2003 r. o dzia\u0142alno\u015bci
  po\u017cytku publicznego i o wolontariacie (Dz. U. z 2016 r. poz. 1817),\\n2. Podmioty
  wymienione w art. 3 ust. 3 ustawy z dnia 24 kwietnia 2003 r. o dzia\u0142alno\u015bci
  po\u017cytku publicznego i o wolontariacie (Dz. U. z 2016 r. poz. 1817) w zakresie
  prowadzenia dzia\u0142alno\u015bci po\u017cytku publicznego:\\n1) osoby prawne i
  jednostki organizacyjne dzia\u0142aj\u0105ce na podstawie przepis\u00f3w o stosunku
  Pa\u0144stwa do Ko\u015bcio\u0142a Katolickiego w Rzeczpospolitej Polskiej, o stosunku
  Pa\u0144stwa do innych ko\u015bcio\u0142\u00f3w i zwi\u0105zk\u00f3w wyznaniowych
  oraz o gwarancjach wolno\u015bci sumienia i wyznania, je\u017celi ich cele statutowe
  obejmuj\u0105 prowadzenie dzia\u0142alno\u015bci po\u017cytku publicznego,\\n2)
  stowarzyszenia jednostek samorz\u0105du terytorialnego,\\n3) sp\u00f3\u0142dzielnie
  socjalne,\\n4) sp\u00f3\u0142ki akcyjne i sp\u00f3\u0142ki z ograniczon\u0105 odpowiedzialno\u015bci\u0105,
  kt\u00f3re nie dzia\u0142aj\u0105 w celu osi\u0105gni\u0119cia zysku oraz przeznaczaj\u0105
  ca\u0142o\u015b\u0107 dochodu na realizacj\u0119 cel\u00f3w statutowych oraz\\nnie
  przeznaczaj\u0105 zysku do podzia\u0142u mi\u0119dzy swoich cz\u0142onk\u00f3w,
  udzia\u0142owc\u00f3w, akcjonariuszy i pracownik\u00f3w.\\n3. O dotacje na realizacj\u0119
  zadania mog\u0105 ubiega\u0107 si\u0119 oferenci, o kt\u00f3rych mowa w ust.2, z
  zastrze\u017ceniem, \u017ce prowadz\u0105 dzia\u0142alno\u015b\u0107 statutow\u0105
  w dziedzinie kultury, sztuki, ochrony d\u00f3br kultury i dziedzictwa narodowego.\\n4.
  Realizacja zg\u0142oszonego zadania publicznego powinna wynika\u0107 z prowadzonej
  przez oferenta dzia\u0142alno\u015bci statutowej- nieodp\u0142atnej lub/i odp\u0142atnej
  po\u017cytku publicznego ( konkurs nie obejmuje dzia\u0142alno\u015bci gospodarczej).\\n\\nIV.
  TERMIN REALIZACJI ZADA\u0143\\n\\nNiniejszy konkurs obejmuje zadania publiczne,
  kt\u00f3re maj\u0105 by\u0107 realizowane w terminie od 08 lutego 2017 r. do 31
  grudnia 2017 r.\\n\\nV. TERMINY I WARUNKI SK\u0141ADANIA OFERT\\n\\n1. Termin z\u0142o\u017cenia
  ofert elektronicznie w systemie witkac.pl -05.12.2016 r. \u2013 27.12.2016 r.\\n2.
  Termin z\u0142o\u017cenia potwierdze\u0144 z\u0142o\u017conych ofert w wersji papierowej
  wraz z obowi\u0105zuj\u0105cymi za\u0142\u0105cznikami- 05.12.2016 r. \u2013 29.12.2016
  r.\\n\\n3.\\n\\nOfert\u0119 nale\u017cy sporz\u0105dzi\u0107 przez serwis witkac.pl\\n\\nFormularz
  oferty konkursowej nale\u017cy z\u0142o\u017cy\u0107 poprzez serwis witkac.pl, kt\u00f3ry
  jest zgodny z wzorem oferty, stanowi\u0105cym za\u0142\u0105cznik do Rozporz\u0105dzenia
  Ministra Rodziny Pracy i Polityki Spo\u0142ecznej z dnia 17 sierpnia 2016 r. w sprawie
  wzor\u00f3w ofert i ramowych wzor\u00f3w um\u00f3w dotycz\u0105cych realizacji zada\u0144
  publicznych oraz wzor\u00f3w sprawozda\u0144 z wykonania tych zada\u0144 (Dz. U.
  z 2016 r. poz. 1300).\\n\\nPo z\u0142o\u017ceniu oferty przez serwis witkac.pl nale\u017cy
  wydrukowa\u0107 Potwierdzenie z\u0142o\u017cenia oferty (wygenerowane automatycznie
  po prawid\u0142owym z\u0142o\u017ceniu oferty) i dostarczy\u0107 Potwierdzenie wraz
  z obowi\u0105zuj\u0105cymi za\u0142\u0105cznikami do Biura Obs\u0142ugi  Urz\u0119du
  Marsza\u0142kowskiego Wojew\u00f3dztwa Podlaskiego, 15-888 Bia\u0142ystok, ul. Kard.
  St. Wyszy\u0144skiego 1 (parter, pok\u00f3j 022) lub przes\u0142a\u0107 poczt\u0105
  na ten adres (liczy si\u0119 data stempla pocztowego).\\n\\n4. Warunkiem rozpatrzenia
  oferty jest dostarczenie Potwierdzenia z\u0142o\u017cenia oferty w\\n1 egzemplarzu,
  podpisanego przez osoby upowa\u017cnionego do reprezentowania podmiotu zgodnie z
  wpisem w KRS lub innym dokumentem potwierdzaj\u0105cym status prawny oferenta i
  umocowanie os\u00f3b go reprezentuj\u0105cych wraz z obowi\u0105zuj\u0105cymi za\u0142\u0105cznikami
  w terminie okre\u015blonym w punkcie V.2.\\n5. Ka\u017cdy projekt na realizacj\u0119
  zadania powinien by\u0107 z\u0142o\u017cony jako oddzielna oferta.\\n6. W przypadku
  publikacji wydawniczych z zakresu kultury i ochrony dziedzictwa narodowego do potwierdzenia
  z\u0142o\u017cenia oferty nale\u017cy za\u0142\u0105czy\u0107    recenzj\u0119 w\u0142a\u015bciwego
  merytorycznie krytyka lub opini\u0119 samodzielnego pracownika naukowego b\u0119d\u0105cego
  specjalist\u0105 w danej dziedzinie.\\n7. Oferta winna zawiera\u0107 dodatkowe informacje
  dotycz\u0105ce rezultat\u00f3w zadania publicznego.\\n\\nV. KWALIFIKOWALNO\u015a\u0106
  KOSZT\u00d3W:\\n\\n1. Koszty zostan\u0105 uznane za kwalifikowane tylko wtedy, gdy:\\n1)
  s\u0105 zwi\u0105zane z realizowanym zadaniem i s\u0105 niezb\u0119dne do jego realizacji,\\n2)
  zosta\u0142y uwzgl\u0119dnione w kosztorysie zadania,\\n3) zosta\u0142y skalkulowane
  racjonalnie na podstawie cen rynkowych,\\n4) odzwierciedlaj\u0105 koszty rzeczywiste,
  s\u0105 skalkulowane proporcjonalnie dla zadania obj\u0119tego finansowaniem,\\n5)
  zosta\u0142y poniesione w okresie realizacji zadania publicznego,\\n6) s\u0105 poparte
  w\u0142a\u015bciwymi dowodami ksi\u0119gowymi (faktury, umowy oraz rachunki do um\u00f3w)
  oraz zosta\u0142y prawid\u0142owo odzwierciedlone w ewidencji ksi\u0119gowej (oferent
  zobowi\u0105zany jest do prowadzenia wyodr\u0119bnionej dokumentacji finansowo-ksi\u0119gowej
  \u015brodk\u00f3w finansowych otrzymanych na realizacj\u0119 zadania zgodnie z ustaw\u0105
  o rachunkowo\u015bci, w spos\u00f3b umo\u017cliwiaj\u0105cy identyfikacj\u0119 poszczeg\u00f3lnych
  operacji ksi\u0119gowych).\\n2. Ze \u015brodk\u00f3w Wojew\u00f3dztwa Podlaskiego
  mog\u0105 by\u0107 pokryte nast\u0119puj\u0105ce koszty:\\n1) Koszty merytoryczne
  w tym koszty promocji np: wynagrodzenia trener\u00f3w, ekspert\u00f3w, specjalist\u00f3w
  realizuj\u0105cych zadania (jedynie w cz\u0119\u015bci odpowiadaj\u0105cej zaanga\u017cowaniu
  danej osoby w realizacj\u0119 projektu), wynagrodzenia innych os\u00f3b zatrudnionych
  specjalnie na potrzeby realizacji dzia\u0142a\u0144 w ramach projektu, wydatki  zwi\u0105zane
  z uczestnictwem bezpo\u015brednich adresat\u00f3w zadania np. materia\u0142y szkoleniowe,
  wynajem sal, niezb\u0119dny dla beneficjent\u00f3w sprz\u0119t niezb\u0119dny do
  prowadzenia zaj\u0119\u0107, odzie\u017c, \u017cywno\u015b\u0107, zakwaterowanie,
  przejazdy beneficjent\u00f3w, trener\u00f3w i ekspert\u00f3w, nagrody dla beneficjent\u00f3w
  w konkursach.\\n2) Koszty obs\u0142ugi zadania publicznego w tym koszty administracyjne,
  np. koordynacja projektu, wykonanie prac administracyjnych, ksi\u0119gowych, op\u0142aty
  za Tel., internet, op\u0142aty pocztowe, czynsz, CO, op\u0142aty za przelewy bankowe,
  koszty adaptacji pomieszcze\u0144 dla cel\u00f3w realizacji zadania (np. koszt malowania
  pomieszcze\u0144), koszty wyjazd\u00f3w s\u0142u\u017cbowych os\u00f3b zaanga\u017cowanych
  w realizacj\u0119 zadania do wysoko\u015bci 15% dotacji,\\n3) Koszty dofinansowania
  wyposa\u017cenia zwi\u0105zane z realizacj\u0105 zadania (koszt zakupu lub wypo\u017cyczenia
  \u2013 w przypadku dofinansowania inwestycji, wydatek ten nie mo\u017ce by\u0107
  pokryty z dotacji w 100%).\\n3. Dotacja nie mo\u017ce by\u0107 wykorzystana na zobowi\u0105zania
  powsta\u0142e przed dat\u0105 zawarcia umowy oraz po dacie zako\u0144czenia zadania,
  a tak\u017ce na pokrycie koszt\u00f3w statutowych niezwi\u0105zanych bezpo\u015brednio
  z realizacj\u0105 danego zadania lub trudnych do wyodr\u0119bnienia.\\n4. Inne koszty,
  kt\u00f3re nie zostan\u0105 uznane za kwalifikowane:\\n1) budowa, zakup budynk\u00f3w
  lub lokali, zakup grunt\u00f3w lub innych nieruchomo\u015bci,\\n2) podatki, z wy\u0142\u0105czeniem
  podatku dochodowego od os\u00f3b fizycznych (PDOF) oraz podatk\u00f3w od towar\u00f3w
  i us\u0142ug (VAT), pod warunkiem, \u017ce podatek VAT nie mo\u017ce zosta\u0107
  odzyskany w oparciu o przepisy ustawy o podatku od towar\u00f3w i us\u0142ug,\\n3)
  dotowanie przedsi\u0119wzi\u0119\u0107, kt\u00f3re s\u0105 dofinansowywane z bud\u017cetu
  wojew\u00f3dztwa lub jego funduszy celowych na podstawie przepis\u00f3w szczeg\u00f3lnych,
  dla kt\u00f3rych organizatorem jest samorz\u0105d wojew\u00f3dztwa,\\n4) pokrycie
  deficytu zrealizowanych wcze\u015bniej przedsi\u0119wzi\u0119\u0107,\\n5) dzia\u0142alno\u015b\u0107
  gospodarcza,\\n6) dzia\u0142alno\u015b\u0107 polityczna i religijna,\\n7) koszty
  poniesione przed dat\u0105 zawarcia umowy oraz po dacie zako\u0144czenia zadania,\\n8)
  odsetki ustawowe i umowne,\\n9) premie i nagrody pracownicze,\\n10) kary umowne.\\n\\nVI.
  OCENA OFERT\\n\\n1. Z\u0142o\u017cone oferty s\u0105 rozpatrywane pod wzgl\u0119dem
  formalnym przez Departament Kultury i Dziedzictwa Narodowego Urz\u0119du Marsza\u0142kowskiego
  Wojew\u00f3dztwa Podlaskiego.\\n2. Ocena formalna polega na sprawdzeniu prawid\u0142owo\u015bci
  oraz kompletno\u015bci oferty i jest dokonywana w oparciu o kart\u0119 oceny formalnej
  stanowi\u0105cej za\u0142\u0105cznik nr 1 niniejszego og\u0142oszenia.\\n3. Do oceny
  merytorycznej ofert z\u0142o\u017conych w og\u0142oszonym konkursie powo\u0142uje
  si\u0119 uchwa\u0142\u0105 Zarz\u0105du Wojew\u00f3dztwa Podlaskiego Komisj\u0119
  Konkursow\u0105.\\n4. W sk\u0142ad Komisji Konkursowej wchodz\u0105:\\n1) pracownicy
  departamentu przygotowuj\u0105cego i przeprowadzaj\u0105cego otwarty konkurs ofert,\\n2)
  pracownicy departamentu wyznaczeni przez dyrektora departamentu merytorycznego,\\n3)
  osoby wskazane przez organizacje pozarz\u0105dowe,\\n4) eksperci- osoby posiadaj\u0105ce
  specjalistyczn\u0105 wiedz\u0119 w dziedzinie obejmuj\u0105cej zakres zada\u0144
  publicznych, kt\u00f3rych konkurs dotyczy,\\n5) Pe\u0142nomocnik Zarz\u0105du Wojew\u00f3dztwa
  Podlaskiego ds. wsp\u00f3\u0142pracy z organizacjami pozarz\u0105dowymi w charakterze
  obserwatora Zarz\u0105du Wojew\u00f3dztwa.\\n5. W sk\u0142ad Komisji nie b\u0119d\u0105
  powo\u0142ywane osoby wskazane przez organizacje pozarz\u0105dowe, kt\u00f3re ubiegaj\u0105
  si\u0119 w danym post\u0119powaniu konkursowym o dotacj\u0119 oraz pozostaj\u0105ce
  z nimi w relacjach, kt\u00f3re mog\u0142yby wywo\u0142a\u0107 podejrzenie o stronniczo\u015b\u0107
  lub interesowno\u015b\u0107.\\n6. Cz\u0142onkowie Komisji przed przyst\u0105pieniem
  do oceny sk\u0142adaj\u0105 o\u015bwiadczenia o bezstronno\u015bci do protoko\u0142u
  komisji. W przypadku wyst\u0105pienia okoliczno\u015bci wskazuj\u0105cych na brak
  bezstronno\u015bci lub interesowno\u015bci cz\u0142onka Komisji opiniuj\u0105cego
  podlega on wy\u0142\u0105czeniu z prac Komisji.\\n7. Szczeg\u00f3\u0142owe zasady
  dzia\u0142ania Komisji Konkursowych zostan\u0105 okre\u015blone w uchwa\u0142ach
  Zarz\u0105du Wojew\u00f3dztwa Podlaskiego powo\u0142uj\u0105cych poszczeg\u00f3lne
  Komisje.\\n8. Zarz\u0105d Wojew\u00f3dztwa Podlaskiego powo\u0142uj\u0105c Komisj\u0119
  wskazuje jej przewodnicz\u0105cego, wiceprzewodnicz\u0105cego oraz sekretarza.\\n9.
  Ocena merytoryczna ofert dokonywana jest w oparciu o kart\u0119 oceny merytorycznej
  stanowi\u0105cej za\u0142\u0105cznik nr 2 do niniejszego og\u0142oszenia.\\n10.
  Przy rozpatrywaniu ofert uwzgl\u0119dniana b\u0119dzie analiza i ocena realizacji
  przez wnioskodawc\u0119 w latach poprzednich zada\u0144 zleconych, brana b\u0119dzie
  pod uwag\u0119 rzetelno\u015b\u0107 i terminowo\u015b\u0107 oraz spos\u00f3b rozliczenia
  otrzymanych na ten cel \u015brodk\u00f3w.\\n11. Po zsumowaniu wszystkich punkt\u00f3w,
  komisja ustala ranking ofert wg punktacji i wybiera najlepsze oferty, proponuj\u0105c
  wysoko\u015b\u0107 dotacji.\\n12. Ze swoich prac komisja sporz\u0105dza protok\u00f3\u0142,
  kt\u00f3ry przedk\u0142adany jest Zarz\u0105dowi Wojew\u00f3dztwa Podlaskiego.\\n\\nVII.
  WYB\u00d3R OFERT\\n\\n1. Ostateczn\u0105 decyzj\u0119 o wyborze ofert i przyznaniu
  b\u0105d\u017a odmowie przyznania dotacji podejmuje Zarz\u0105d Wojew\u00f3dztwa
  Podlaskiego w drodze uchwa\u0142y, po zapoznaniu si\u0119 z protoko\u0142em komisji,
  w terminie 40 dni od daty zako\u0144czenia naboru ofert.\\n2. Wysoko\u015b\u0107
  dotacji mo\u017ce by\u0107 ni\u017csza, ni\u017c wnioskowana w ofercie i proponowana
  przez Komisj\u0119, w takim przypadku oferent mo\u017ce negocjowa\u0107 zmniejszenie
  zakresu rzeczowego zadania lub wycofa\u0107 swoj\u0105 ofert\u0119.\\n3. Rozstrzygni\u0119cie
  konkursu podaje si\u0119 do publicznej wiadomo\u015bci na stronie internetowej Urz\u0119du,
  w Biuletynie Informacji Publicznej oraz na tablicy og\u0142osze\u0144 w siedzibie
  Urz\u0119du.\\n4. Od uchwa\u0142y Zarz\u0105du Wojew\u00f3dztwa Podlaskiego w sprawie
  wyboru oferty i udzielenia dotacji nie ma zastosowania tryb odwo\u0142awczy.\\n5.
  Zarz\u0105d Wojew\u00f3dztwa Podlaskiego mo\u017ce odm\u00f3wi\u0107 podmiotowi
  wy\u0142onionemu w konkursie przyznania dotacji w\u00f3wczas, gdy podmiot lub jego
  reprezentanci utrac\u0105 zdolno\u015bci do czynno\u015bci prawnych, zostan\u0105
  ujawnione nieznane wcze\u015bniej okoliczno\u015bci podwa\u017caj\u0105ce wiarygodno\u015b\u0107
  merytoryczn\u0105 lub finansow\u0105 oferenta.\\n\\nIX. ZAWARCIE UMOWY I PRZEKAZANIE
  \u015aRODK\u00d3W\\n\\n1. Podmioty, kt\u00f3rych oferty zosta\u0142y wybrane, przedk\u0142adaj\u0105
  do Departamentu Kultury i Dziedzictwa Narodowego tutejszego Urz\u0119du za po\u015brednictwem
  systemu witkac.pl zaktualizowany harmonogram i kosztorys wykonania zadania, celem
  zawarcia umowy o wsparcie realizacji zadania.\\n2. Po otrzymaniu niezb\u0119dnych
  danych (w tym informacji na temat os\u00f3b, kt\u00f3re s\u0105 uprawnione do podpisania
  umowy), pracownik departamentu przygotowuje umow\u0119 na realizacj\u0119 zadania
  publicznego zgodnie z zasadami obowi\u0105zuj\u0105cymi w departamentach i jednostkach
  organizacyjnych Urz\u0119du.\\n3. Warunkiem przekazania dotacji jest zawarcie umowy
  sporz\u0105dzonej wed\u0142ug wzoru, stanowi\u0105cego za\u0142\u0105cznik do Rozporz\u0105dzeniu
  Ministra Rodziny Pracy i Polityki Spo\u0142ecznej z dnia 17 sierpnia 2016 r. w sprawie
  wzor\u00f3w ofert i ramowych wzor\u00f3w um\u00f3w dotycz\u0105cych realizacji zada\u0144
  publicznych oraz wzor\u00f3w sprawozda\u0144 z wykonania tych zada\u0144 (Dz. U.
  z 19 sierpnia 2016 r. poz. 1300).\\n4. Przekazanie \u015brodk\u00f3w finansowych
  na numer rachunku bankowego podany w umowie nast\u0119puje po podpisaniu jej przez
  obie strony (Zleceniodawc\u0119 i Zleceniobiorc\u0119) we wskazanym w umowie terminie.\\n5.
  Zleceniobiorca musi by\u0107 jedynym posiadaczem wskazanego rachunku bankowego oraz
  jest zobowi\u0105zany do prowadzenia wyodr\u0119bnionej dokumentacji finansowo ksi\u0119gowej
  i ewidencji ksi\u0119gowej dotycz\u0105cej realizowanego zadania, zgodnie z zasadami
  wynikaj\u0105cymi z ustawy z 29 wrze\u015bnia 1994 r. o rachunkowo\u015bci (Dz.
  U. 1994 Nr 121 poz. 591 z p\u00f3\u017an. zm.), w spos\u00f3b umo\u017cliwiaj\u0105cy
  identyfikacj\u0119 poszczeg\u00f3lnych operacji ksi\u0119gowych.\\n6. Zleceniobiorca
  zobowi\u0105zany jest do bie\u017c\u0105cego informowania Zleceniodawcy w formie
  pisemnej o wszelkich zmianach dotycz\u0105cych podmiotu wnioskuj\u0105cego (zmiana
  reprezentacji organizacji, siedziby, nr rachunku bankowego, itp.) lub realizowanego
  zadania (np. miejsca i terminu realizacji zadania) kieruj\u0105c wniosek do departamentu.\\n7.
  Zmiany, o kt\u00f3rych mowa s\u0105 wprowadzane do umowy aneksem.\\n8. Informacje
  o zmianach powinny by\u0107 podpisane przez osoby upowa\u017cnione, dla kt\u00f3rych
  upowa\u017cnienie wynika z KRS lub innego rejestru lub ewidencji.\\n\\nX. KONTROLA
  WYKONANIA ZADANIA:\\n\\n1. Kontroli i oceny wykonania zadania i postanowie\u0144
  umowy dokonuj\u0105 upowa\u017cnieni wed\u0142ug w\u0142a\u015bciwo\u015bci pracownicy
  Urz\u0119du zar\u00f3wno w siedzibie Zleceniobiorcy, jak i w miejscu realizacji
  zadania.\\n2. Kontrola mo\u017ce by\u0107 przeprowadzona w toku realizacji zadania
  oraz po jego zako\u0144czeniu.\\n3. W trakcie czynno\u015bci kontrolnych sprawdzane
  s\u0105:\\n1) stan realizacji zadania;\\n2) efektywno\u015b\u0107 i rzetelno\u015b\u0107
  oraz jako\u015b\u0107 wykonania zadania;\\n3) prawid\u0142owo\u015b\u0107 wykorzystania
  \u015brodk\u00f3w publicznych otrzymanych na realizacje zadania;\\n4) prowadzenie
  dokumentacji okre\u015blonej w przepisach prawa i postanowieniach umowy.\\n\\nXI.
  SPRAWOZDAWCZO\u015a\u0106:\\n\\n1. Zleceniobiorca ma obowi\u0105zek z\u0142o\u017cenia
  sprawozdania z wykonania zadania w terminie 30 dni od daty zako\u0144czenia zadania.\\n2.
  Rozliczenia zadania nale\u017cy dokona\u0107 elektronicznie za pomoc\u0105 serwisu
  Witkac.pl zgodnie ze wzorem z rozporz\u0105dzenia Ministra Rodziny, Pracy i Polityki
  Spo\u0142ecznej z dnia 17 sierpnia 2016 r. w sprawie wzor\u00f3w ofert i ramowych
  wzor\u00f3w um\u00f3w dotycz\u0105cych realizacji zada\u0144 publicznych oraz wzor\u00f3w
  sprawozda\u0144 z wykonania tych zada\u0144 (Dz. U. 2016 poz. 1300) w terminie 30
  dni od dnia zako\u0144czenia realizacji zadania publicznego. Po z\u0142o\u017ceniu
  sprawozdania w serwisie Witkac.pl, nale\u017cy je wydrukowa\u0107 wraz z potwierdzeniem
  z\u0142o\u017cenia i dostarczy\u0107 do zleceniodawcy w terminie 30 dni od dnia
  zako\u0144czenia realizacji zadania publicznego.\\n3. Do sprawozdania nie za\u0142\u0105cza
  si\u0119 orygina\u0142\u00f3w faktur (rachunk\u00f3w), kt\u00f3re nale\u017cy przechowywa\u0107
  zgodnie z obowi\u0105zuj\u0105cymi przepisami i udost\u0119pnia\u0107 podczas przeprowadzanych
  czynno\u015bci kontrolnych.\\n4. Wszystkie orygina\u0142y dokument\u00f3w powinny
  by\u0107 wystawione na Zleceniobiorc\u0119 i zawiera\u0107 trwa\u0142y opis zgodnie
  z nast\u0119puj\u0105cym wzorem: \u201eKwota w wysoko\u015bci...z\u0142 zosta\u0142a
  op\u0142acona z dotacji Wojew\u00f3dztwa Podlaskiego, zgodnie z umow\u0105 nr...z
  dnia...Dotyczy pozycji nr...kosztorysu\\\".\\n5. W przypadku nieprzed\u0142o\u017cenia
  sprawozdania w terminie okre\u015blonym w umowie, pracownik przygotowuje pisemne
  wezwanie do z\u0142o\u017cenia sprawozdania w terminie 7 dni od daty otrzymania
  wezwania.\\n6. Niezastosowanie si\u0119 do wezwania mo\u017ce by\u0107 podstaw\u0105
  do rozwi\u0105zania umowy oraz zwrotu dotacji.\\n\\nXII. INFORMACJA O ZADANIACH
  PUBLICZNYCH TEGO SAMEGO RODZAJU ZREALIZOWANYCH PRZEZ SAMORZ\u0104D WOJEW\u00d3DZTWA
  PODLASKIEGO W LATACH  2015 oraz 2016 ORAZ O ZWI\u0104ZANYCH Z TYM KOSZTACH\\n\\nPodaje
  si\u0119 do wiadomo\u015bci, \u017ce w bud\u017cecie Wojew\u00f3dztwa Podlaskiego
  suma \u015brodk\u00f3w przeznaczonych na realizacj\u0119 zada\u0144 w sferze  kultury,
  sztuki, ochrony d\u00f3br kultury dziedzictwa narodowego, w sferze upowszechniania
  i ochrony wolno\u015bci i praw cz\u0142owieka oraz swob\u00f3d obywatelskich, a
  tak\u017ce dzia\u0142a\u0144 wspomagaj\u0105cych rozw\u00f3j demokracji oraz w sferze
  dzia\u0142alno\u015bci na rzecz mniejszo\u015bci narodowych i etnicznych oraz j\u0119zyka
  regionalnego wynios\u0142a w roku 2015- 1 090 700z\u0142, w roku 2016- 1 457 560z\u0142.\"",
