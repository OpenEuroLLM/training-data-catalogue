sample: '["\"Uchwa\u0142a nr 5\\nRady Nadzorczej UHY ECA S.A. z dnia 4 maja 2016 r.\\nw
  sprawie zatwierdzenia sprawozdania Rady Nadzorczej UHY ECA S.A.\\nz wynik\u00f3w
  oceny przed\u0142o\u017conych przez Zarz\u0105d UHY ECA S.A. dokument\u00f3w za
  2015 r.\\n\\n\u00a7 1\\nRada Nadzorcza UHY ECA S.A. postanawia zatwierdzi\u0107
  sprawozdanie Rady Nadzorczej UHY ECA S.A. o poni\u017cszej tre\u015bci:\\n\\nSPRAWOZDANIE
  RADY NADZORCZEJ UHY ECA S.A.\\nz wynik\u00f3w oceny:\\n\\n1. sprawozdania Zarz\u0105du
  UHY ECA S.A. z dzia\u0142alno\u015bci UHY ECA S.A. w 2015 roku,\\n2. sprawozdania
  Zarz\u0105du UHY ECA S.A. z dzia\u0142alno\u015bci Grupy Kapita\u0142owej UHY ECA
  w 2015 roku,\\n3. jednostkowego sprawozdania finansowego UHY ECA S.A. za 2015 rok,\\n4.
  skonsolidowanego sprawozdania finansowego Grupy Kapita\u0142owej UHY ECA za 2015
  rok,\\n5. wniosku Zarz\u0105du UHY ECA S.A. w sprawie podzia\u0142u zysku UHY ECA
  S.A. za 2015 rok.\\n\\nRada Nadzorcza UHY ECA S.A. otrzyma\u0142a od Zarz\u0105du
  UHY ECA S.A. dokumenty wymienione w punktach 1-5 powy\u017cej. Po przeprowadzeniu
  analizy tre\u015bci tych dokument\u00f3w i po zapoznaniu si\u0119 z opini\u0105
  bieg\u0142ego rewidenta, badaj\u0105cego jednostkowe sprawozdanie finansowe UHY
  ECA S.A. za 2015 rok oraz skonsolidowane sprawozdanie finansowe Grupy Kapita\u0142owej
  UHY ECA za 2015 rok oraz sporz\u0105dzaj\u0105cego opini\u0119 w zakresie tego badania,
  Rada Nadzorcza UHY ECA S.A. - wype\u0142niaj\u0105c obowi\u0105zek wynikaj\u0105cy
  z tre\u015bci \u00a7 17 ust. 2 pkt 1) Statutu UHY ECA S.A. - niniejszym uznaje dokumenty,
  o kt\u00f3rych mowa w punktach 1-4 powy\u017cej za zgodne z ksi\u0119gami i dokumentami
  UHY ECA S.A. oraz ze stanem faktycznym i jako takie rekomenduje Zwyczajnemu Walnemu
  Zgromadzeniu Akcjonariuszy UHY ECA S.A. ich zatwierdzenie.\\n\\nJednocze\u015bnie
  Rada Nadzorcza UHY ECA S.A. potwierdza, i\u017c w dniu 4 maja 2016 r. otrzyma\u0142a
  wniosek Zarz\u0105du UHY ECA S.A. dotycz\u0105cy podzia\u0142u zysku za rok obrotowy
  2015 w wysoko\u015bci 262 354,46 z\u0142 i przeznaczenia go na kapita\u0142 zapasowy
  Sp\u00f3\u0142ki. Dzia\u0142aj\u0105c w trybie \u00a7 17 ust. 2 pkt 2) Statutu UHY
  ECA S.A., Rada Nadzorcza UHY ECA S.A. ocenia pozytywnie wniosek Zarz\u0105du UHY
  ECA S.A. o przeznaczeniu zysku UHY ECA S.A. za 2015 rok na kapita\u0142 zapasowy
  Sp\u00f3\u0142ki i rekomenduje Zwyczajnemu Walnemu Zgromadzeniu Akcjonariuszy UHY
  ECA S.A. akceptacj\u0119 tego wniosku.\\n\\n\u00a7 2\\n\\nUchwa\u0142a wchodzi w
  \u017cycie z dniem podj\u0119cia.\\n\\nUchwa\u0142a nr 5 przyj\u0119ta jednog\u0142o\u015bnie
  w g\u0142osowaniu jawnym.\\n\\nAGNIESZKA REMBIESA\\n\\nBARBARA J\u0118DRZEJEK\\n\\nDAGNA
  SZOSTAK\\n\\nROBERT SAMEK\\n\\nJAROS\u0141AW LENARTOWSKI\\n\\nUchwa\u0142a nr 6\\nRady
  Nadzorczej UHY ECA S.A. z dnia 4 maja 2016 r.\\nw sprawie zatwierdzenia sprawozdania
  z dzia\u0142alno\u015bci Rady Nadzorczej UHY ECA S.A.\\nza 2015 r.\\n\\n\u00a7 1\\nRada
  Nadzorcza UHY ECA S.A. postanawia zatwierdzi\u0107 sprawozdanie z dzia\u0142alno\u015bci
  Rady\\nNadzorczej UHY ECA S.A. za 2015 rok, stanowi\u0105ce za\u0142\u0105cznik
  do niniejszej uchwa\u0142y.\\n\\n\u00a7 2\\n\\nUchwa\u0142a wchodzi w \u017cycie
  z dniem podj\u0119cia.\\n\\nUchwa\u0142a nr 6 przyj\u0119ta jednog\u0142o\u015bnie
  w g\u0142osowaniu jawnym.\\n\\nAGNIESZKA REMBIESA\\n\\nBARBARA J\u0118DRZEJEK\\n\\nDAGNA
  SZOSTAK\\n\\nROBERT SAMEK\\n\\nJAROS\u0141AW LENARTOWSKI\\n\\nSPRAWOZDANIE Z DZIA\u0141ALNO\u015aCI\\nRADY
  NADZORCZEJ UHY ECA SP\u00d3\u0141KA AKCYJNA\\nZA 2015 ROK\\n\\nW okresie obj\u0119tym
  niniejszym sprawozdaniem, tj. od dnia 1 stycznia 2015 r. do dnia 31 grudnia 2015
  r., sk\u0142ad organu nadzoru UHY ECA S.A. ulega\u0142 pewnym zmianom.\\n\\nPocz\u0105tkowo,
  na dzie\u0144 1 stycznia 2015 r. pi\u0119cioosobowy sk\u0142ad Rady Nadzorczej UHY
  ECA S.A. przedstawia\u0142 si\u0119 nast\u0119puj\u0105co: Pani Agnieszka Rembiesa
  pe\u0142ni\u0105ca funkcj\u0119 Przewodnicz\u0105cej organu nadzoru, Pani Barbara
  J\u0119drzejek pe\u0142ni\u0105ca funkcj\u0119 Wiceprzewodnicz\u0105cej Rady Nadzorczej
  oraz Pan Robert Samek, Pan Robert Kuc i Pan Jaros\u0142aw Lenartowski jako Cz\u0142onkowie
  organu nadzoru. Nast\u0119pnie, w dniu 28 maja 2015 r. Pan Robert Kuc z\u0142o\u017cy\u0142
  rezygnacj\u0119 z cz\u0142onkostwa w Radzie Nadzorczej UHY ECA S.A. ze skutkiem
  na dzie\u0144 30 czerwca 2015 r. W zwi\u0105zku z powy\u017cszym Zwyczajne Walne
  Zgromadzenia Akcjonariuszy Sp\u00f3\u0142ki UHY ECA S.A. w dniu 30 czerwca 2015
  r. dokona\u0142o wyboru nowego cz\u0142onka Rady Nadzorczej w osobie Pani Dagny
  Szostak. Do dnia 31 grudnia 2015 r., a wi\u0119c do ko\u0144ca okresu obj\u0119tego
  niniejszym sprawozdaniem, sk\u0142ad Rady Nadzorczej UHY ECA S.A. oraz funkcje pe\u0142nione
  przez poszczeg\u00f3lnych Cz\u0142onk\u00f3w organu nadzoru nie uleg\u0142y ju\u017c
  \u017cadnym dalszym zmianom.\\n\\nW ca\u0142ym okresie sprawozdawczym Rada Nadzorcza
  UHY ECA S.A. odby\u0142a trzy posiedzenia w siedzibie Sp\u00f3\u0142ki (posiedzenia
  te mia\u0142y miejsce w dniach 28 maja 2015 r., 1 lipca 2015 r. oraz 9 grudnia 2015
  r.) i przeprowadzi\u0142a dwa g\u0142osowania przy wykorzystaniu \u015brodk\u00f3w
  bezpo\u015bredniego porozumiewania si\u0119 na odleg\u0142o\u015b\u0107 (g\u0142osowania
  te zosta\u0142y przeprowadzone w dniach: 31 marca \u2013 1 kwietnia 2015 r., 28
  - 29 grudnia 2015 r.). Rada Nadzorcza UHY ECA S.A. dzia\u0142aj\u0105c na posiedzeniach
  oraz w trybie opisanym w zdaniu poprzednim podj\u0119\u0142a \u0142\u0105cznie pi\u0119tna\u015bcie
  uchwa\u0142.\\n\\nW okresie obj\u0119tym niniejszym sprawozdaniem, Rada Nadzorcza
  UHY ECA S.A. koncentrowa\u0142a si\u0119 przede wszystkim na wype\u0142nianiu swojego
  podstawowego obowi\u0105zku wynikaj\u0105cego z \u00a7 3 ust. 1 Regulaminu Rady
  Nadzorczej UHY ECA S.A., tj. na sprawowaniu nadzoru nad dzia\u0142alno\u015bci\u0105
  UHY ECA S.A. we wszystkich sprawach przedsi\u0119biorstwa Sp\u00f3\u0142ki.\\n\\nW
  roku 2015 r. Rada Nadzorcza nadzorowa\u0142a i kontrolowa\u0142a przebieg poszczeg\u00f3lnych
  najwa\u017cniejszych wydarze\u0144 w Sp\u00f3\u0142ce UHY ECA S.A., w tym w szczeg\u00f3lno\u015bci
  przyst\u0105pienie Sp\u00f3\u0142ki do mi\u0119dzynarodowej sieci UHY International,
  wyb\u00f3r bieg\u0142ego rewidenta do badania sprawozda\u0144 finansowych Sp\u00f3\u0142ki
  UHY ECA S.A. oraz Grupy Kapita\u0142owej UHY ECA, jak r\u00f3wnie\u017c kontynuowanie
  dzia\u0142alno\u015bci przez poszczeg\u00f3lne sp\u00f3\u0142ki z Grupy w przydzielonych
  im segmentach tematycznych.\\n\\nW zwi\u0105zku z faktem zako\u0144czenia kadencji
  dotychczasowego Zarz\u0105du Rada Nadzorcza ustali\u0142a uchwa\u0142\u0105 liczb\u0119
  Cz\u0142onk\u00f3w Zarz\u0105du nowej kadencji oraz powo\u0142a\u0142a do pe\u0142nienia
  funkcji w Zarz\u0105dzie Sp\u00f3\u0142ki Pana Romana Serdy\u0144skiego oraz Pana
  Piotra\\n\\nKrak\u00f3w, dnia 4 maja 2016 r.\\n\\nWo\u017aniaka. Funkcja Prezesa
  Zarz\u0105du Sp\u00f3\u0142ki UHY ECA S.A. zosta\u0142a powierzona Panu Romanowi
  Serdy\u0144skiemu. Rada Nadzorcza ustali\u0142a r\u00f3wnie\u017c uchwa\u0142\u0105
  wynagrodzenie dla poszczeg\u00f3lnych Cz\u0142onk\u00f3w Zarz\u0105du Sp\u00f3\u0142ki
  UHY ECA S.A.\\n\\nJednym z g\u0142\u00f3wnych temat\u00f3w pojawiaj\u0105cych si\u0119
  na kolejnych posiedzeniach organu nadzoru by\u0142a r\u00f3wnie\u017c analiza bie\u017c\u0105cej
  sytuacji ekonomiczno - finansowej UHY ECA S.A. oraz prognozowanych wynik\u00f3w
  finansowych na kolejne kwarta\u0142y 2015 roku. Rada Nadzorcza zapozna\u0142a si\u0119
  r\u00f3wnie\u017c z planami i celami biznesowymi oraz za\u0142o\u017ceniami bud\u017cetowymi
  na kolejne lata kalendarzowe.\\n\\nNa posiedzeniach Rady Nadzorczej UHY ECA S.A.
  omawiano r\u00f3wnie\u017c w spos\u00f3b szczeg\u00f3\u0142owy stan post\u0119powania
  s\u0105dowych.\\n\\nW okresie obj\u0119tym niniejszym sprawozdaniem Rada Nadzorcza
  UHY ECA S.A. podj\u0119\u0142a r\u00f3wnie\u017c dwie uchwa\u0142y w przedmiocie
  wyboru bieg\u0142ego rewidenta do badania jednostkowego sprawozdania finansowego
  Sp\u00f3\u0142ki UHY ECA S.A. oraz skonsolidowanego sprawozdania finansowego Grupy
  Kapita\u0142owej UHY ECA (w dniu 1 kwietnia 2015 r., za okres od dnia 1 stycznia
  2014 r. do dnia 31 grudnia 2014 r. oraz w dniach 28 \u2013 29 grudnia 2015 r. za
  okres od dnia 1 stycznia 2015 r. do dnia 31 grudnia 2015 r.).\\n\\nW okresie obj\u0119tym
  niniejszym sprawozdaniem Rada Nadzorcza UHY ECA S.A. uchwali\u0142a tak\u017ce tekst
  jednolity Statutu UHY ECA S.A. (uchwa\u0142a zosta\u0142a podj\u0119ta na posiedzeniu
  w dniu 28 maja 2015 r.).\\n\\n*****\\n\\nPodczas wype\u0142niania swych obowi\u0105zk\u00f3w
  Rada Nadzorcza UHY ECA S.A. przede wszystkim d\u0105\u017cy\u0142a do zachowania
  pe\u0142nego obiektywizmu i wymog\u00f3w profesjonalnej oceny, dbaj\u0105c jednocze\u015bnie
  o zachowanie interes\u00f3w UHY ECA S.A. i przestrzeganie norm obowi\u0105zuj\u0105cego
  prawa oraz zasad \u0142adu korporacyjnego. Funkcje Rady Nadzorczej UHY ECA S.A.
  jako organu o charakterze kontrolno-doradczym, mog\u0142y by\u0107 realizowane wy\u0142\u0105cznie
  w formie zalece\u0144 i rekomendacji do Zarz\u0105du UHY ECA S.A., kt\u00f3rych
  celem by\u0142o usprawnienie sposobu zarz\u0105dzania Sp\u00f3\u0142k\u0105 i Grup\u0105
  Kapita\u0142ow\u0105, zmierzaj\u0105ce do coraz pe\u0142niejszej optymalizacji cel\u00f3w
