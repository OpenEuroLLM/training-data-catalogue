  email@example.com\"", "\"II\\n\\n(Akty o charakterze nieustawodawczym)\\n\\nROZPORZ\u0104DZENIA\\n\\nROZPORZ\u0104DZENIE
  KOMISJI (UE) NR 146/2010\\n\\nz dnia 23 lutego 2010 r.\\n\\nzmieniaj\u0105ce rozporz\u0105dzenie
  (WE) nr 1122/2009 ustanawiaj\u0105ce szczeg\u00f3\u0142owe zasady wykonania rozporz\u0105dzenia
  Rady (WE) nr 73/2009 odno\u015bnie do zasady wzajemnej zgodno\u015bci, modulacji
  oraz zintegrowanego systemu zarz\u0105dzania i kontroli w ramach system\u00f3w wsparcia
  bezpo\u015bredniego przewidzianych w wymienionym rozporz\u0105dzeniu oraz wdra\u017cania
  rozporz\u0105dzenia Rady (WE) nr 1234/2007 w odniesieniu do zasady wzajemnej zgodno\u015bci
  w ramach systemu wsparcia ustanowionego dla sektora wina\\n\\nKOMISJA EUROPEJSKA,
  uwzgl\u0119dniaj\u0105c Traktat o funkcjonowaniu Unii Europejskiej,\\n\\nuwzgl\u0119dniaj\u0105c
  rozporz\u0105dzenie Rady (WE) nr 1234/2007 z dnia 22 pa\u017adziernika 2007 r. ustanawiaj\u0105ce
  wsp\u00f3ln\u0105 organizacj\u0119 rynk\u00f3w rolnych oraz przepisy szczeg\u00f3\u0142owe
  dotycz\u0105ce niekt\u00f3\u00ad rych produkt\u00f3w rolnych (\u201erozporz\u0105dzenie
  o jednolitej wsp\u00f3lnej organizacji rynku\\\") ( 1 ), w szczeg\u00f3lno\u015bci
  jego art. 85x i 103za w zwi\u0105zku z art. 4,\\n\\n(3) W art. 64 ust. 2 rozporz\u0105dzenia
  (WE) nr 73/2009 usta\u00ad nawia si\u0119 odst\u0119pstwo, w przypadku gdy rolnik,
  kt\u00f3rego dotyczy w\u0142\u0105czenie wsparcia zwi\u0105zanego z wielko\u015bci\u0105
  produkcji, nie posiada \u017cadnych uprawnie\u0144 do p\u0142atno\u015bci, lecz
  zg\u0142asza pewn\u0105 liczb\u0119 dzier\u017cawionych uprawnie\u0144 do p\u0142atno\u015bci
  w pierwszym roku w\u0142\u0105czenia tego wsparcia. Takiemu rolnikowi nale\u017cy
  przyzna\u0107 uprawnienia, w odniesieniu do kt\u00f3rych stosuje si\u0119 odst\u0119pstwo
  w zakresie ich aktywacji. W celu zagwarantowania skutecznej kontroli nale\u017cy
  zapewni\u0107 identyfikowalno\u015b\u0107 tych uprawnie\u0144.\\n\\nuwzgl\u0119dniaj\u0105c
  rozporz\u0105dzenie Rady (WE) nr 73/2009 z dnia 19 stycznia 2009 r. ustanawiaj\u0105ce
  wsp\u00f3lne zasady dla system\u00f3w wsparcia bezpo\u015bredniego dla rolnik\u00f3w
  w ramach wsp\u00f3lnej polityki rolnej i ustanawiaj\u0105ce okre\u015blone systemy
  wsparcia dla rolnik\u00f3w, zmieniaj\u0105ce rozporz\u0105dzenia (WE) nr 1290/2005,
  (WE) nr 247/2006, (WE) nr 378/2007 oraz uchy\u00ad laj\u0105ce rozporz\u0105dzenie
  (WE) nr 1782/2003 ( 2 ), w szczeg\u00f3lno\u015bci jego art. 142 lit. c), k) i n),
  a tak\u017ce maj\u0105c na uwadze, co nast\u0119puje:\\n\\n(1) Po przedstawieniu
  Radzie w kwietniu 2009 r. wniosk\u00f3w w sprawie uproszczenia okre\u015blono pewn\u0105
  liczb\u0119 mo\u017cli\u00ad wych do wprowadzenia ulepsze\u0144 w zakresie skuteczno\u015bci
  i uproszczenia przepis\u00f3w reguluj\u0105cych wdra\u017canie zasady wzajemnej
  zgodno\u015bci. Nale\u017cy w\u0142\u0105czy\u0107 te ulepszenia do rozporz\u0105dzenia
  Komisji (WE) nr 1122/2009 ( 3 ).\\n(2) System identyfikacji dzia\u0142ek rolnych
  stanowi kluczowy element procesu gwarantuj\u0105cego prawid\u0142ow\u0105 realizacj\u0119
  wyp\u0142at dla rolnik\u00f3w i chroni\u0105cego unijne fundusze. W celu poprawy
  jako\u015bci tego systemu nale\u017cy wprowadzi\u0107 przepisy przewiduj\u0105ce
  obowi\u0105zek rocznej oceny systemu. Pa\u0144stwa cz\u0142onkowskie powinny dokona\u0107
  oceny systemu zgodnie ze zharmonizowan\u0105 metod\u0105 i przedstawi\u0107 spra\u00ad
  wozdanie na tyle wcze\u015bnie, by umo\u017cliwi\u0107 skuteczne wykorzystanie wynik\u00f3w
  oceny.\\n\\n( 1 ) Dz.U. L 299 z 16.11.2007, s. 1.\\n\\n( 3 ) Dz.U. L 316 z 2.12.2009,
  s. 65.\\n\\n( 2 ) Dz.U. L 30 z 31.1.2009, s. 16.\\n\\n(4) W celu przeprowadzenia
  kontroli w zakresie zasady wzajemnej zgodno\u015bci, przewidzianych w rozporz\u0105dzeniu
  (WE) nr 1122/2009, pa\u0144stwa cz\u0142onkowskie mog\u0105 korzysta\u0107 jedynie
  z wynik\u00f3w kontroli na miejscu przeprowadzonych przez w\u0142a\u015bciwe organy
  kontroli. W celu zapewnienia skuteczno\u015bci pa\u0144stwa cz\u0142onkowskie powinny
  mie\u0107 mo\u017cliwo\u015b\u0107 wykorzystania r\u00f3wnie\u017c wynik\u00f3w
  kontroli na miejscu przeprowadzonych zgodnie z prawodawstwem maj\u0105cym zastosowanie
  do odno\u015bnych akt\u00f3w prawnych i norm, tak aby osi\u0105gn\u0105\u0107 minimalny
  poziom kontroli. Nale\u017cy jednak zapewni\u0107 utrzymanie skutecznego systemu
  kontroli.\\n(5) Przy wyborze pr\u00f3by poddawanej kontroli na miejscu pod k\u0105tem
  przestrzegania zasady wsp\u00f3\u0142zale\u017cno\u015bci pa\u0144stwo cz\u0142onkowskie
  mo\u017ce uwzgl\u0119dni\u0107, w analizie ryzyka, uczestnictwo rolnik\u00f3w we
  w\u0142a\u015bciwych systemach certyfi\u00ad kacji. Nale\u017cy wyja\u015bni\u0107
  skorzystanie z tej mo\u017cliwo\u015bci.\\n(6) Sprawozdania z kontroli nale\u017cy
  przes\u0142a\u0107 do agencji p\u0142at\u00ad niczej lub organu koordynuj\u0105cego
  w wyznaczonym terminie. Je\u017celi sprawozdanie z kontroli nie zawiera \u017cadnych
  wniosk\u00f3w, w celu zmniejszenia obci\u0105\u017ce\u0144 admi\u00ad nistracyjnych
  nale\u017cy uzna\u0107, \u017ce wystarczy, by sprawoz\u00ad dania z kontroli by\u0142y
  bezpo\u015brednio udost\u0119pniane agencji p\u0142atniczej lub organowi koordynuj\u0105cemu.\\n\\n(7)
  Przy okazji niniejszej zmiany rozporz\u0105dzenia (WE) nr 1122/2009 nale\u017cy
  poprawi\u0107 dwa nieprawid\u0142owe odes\u0142ania odpowiednio do rozporz\u0105dzenia
  (WE) nr 73/2009 i rozporz\u0105dzenia Komisji (WE) nr 1121/2009 ( 1 ).\\n(8) Nale\u017cy
  zatem odpowiednio zmieni\u0107 rozporz\u0105dzenie (WE) nr 1122/2009.\\n(9) Zmiany
  przewidziane w niniejszym rozporz\u0105dzeniu odnosz\u0105 si\u0119 do wniosk\u00f3w
  o przyznanie pomocy doty\u00ad cz\u0105cych lat gospodarczych lub okres\u00f3w premiowych
  rozpoczynaj\u0105cych si\u0119 z dniem 1 stycznia 2010 r. W zwi\u0105zku z tym nale\u017cy
  odpowiednio stosowa\u0107 niniejsze rozporz\u0105dzenie.\\n(10) Komitet Zarz\u0105dzaj\u0105cy
  ds. Wsp\u00f3lnej Organizacji Rynk\u00f3w Rolnych i Komitet Zarz\u0105dzaj\u0105cy
  ds. P\u0142atno\u015bci Bezpo\u015bred\u00ad nich nie wyda\u0142y opinii w terminie
  wyznaczonym przez ich przewodnicz\u0105cego,\\n\\nPRZYJMUJE NINIEJSZE ROZPORZ\u0104DZENIE:\\n\\nArtyku\u0142
  1\\n\\nW rozporz\u0105dzeniu (WE) nr 1122/2009 wprowadza si\u0119 nast\u0119\u00ad
  puj\u0105ce zmiany:\\n\\n1) art. 6 ust. 2 otrzymuje brzmienie:\\n\u201e2. Pa\u0144stwa
  cz\u0142onkowskie dokonuj\u0105 corocznej oceny jako\u015bci systemu identyfikacji
  dzia\u0142ek rolnych. Ocena ta obej\u00ad muje nast\u0119puj\u0105ce elementy jako\u015bciowe:\\na)
  poprawne uj\u0119cie ilo\u015bciowe maksymalnego kwalifikowal\u00ad nego obszaru;\\nb)
  proporcje i rozmieszczenie dzia\u0142ek referencyjnych, gdzie maksymalny kwalifikowalny
  obszar uwzgl\u0119dnia obszary niekwalifikowalne, a nie uwzgl\u0119dnia powierzchni
  u\u017cytk\u00f3w rolnych;\\nc) kategoryzacj\u0119 dzia\u0142ek referencyjnych,
  gdzie maksymalny kwalifikowalny obszar uwzgl\u0119dnia obszary niekwalifiko\u00ad
  walne, a nie uwzgl\u0119dnia powierzchni u\u017cytk\u00f3w rolnych;\\nd) wyst\u0119powanie
  dzia\u0142ek referencyjnych ze znacznymi defektami;\\ne) stosunek obszaru zg\u0142oszonego
  do maksymalnego kwali\u00ad fikowalnego obszaru w obr\u0119bie dzia\u0142ek referencyjnych;\\nf)
  odsetek dzia\u0142ek referencyjnych, kt\u00f3re by\u0142y przedmiotem zmian na przestrzeni
  lat;\\ng) odsetek nieprawid\u0142owo\u015bci stwierdzony podczas kontroli na miejscu.\\n\\nPodczas
  przeprowadzania oceny okre\u015blonej w akapicie pierwszym pa\u0144stwa cz\u0142onkowskie:\\n\\na)
  wykorzystuj\u0105 dane umo\u017cliwiaj\u0105ce im ocen\u0119 bie\u017c\u0105cej
  sytuacji na miejscu;\\nb) dokonuj\u0105 losowo wyboru odpowiedniej pr\u00f3by wszystkich
  dzia\u0142ek referencyjnych.\\n\\nKomisja jest powiadamiana o sprawozdaniu z oceny
  i, w razie potrzeby, dzia\u0142aniach zaradczych, jak r\u00f3wnie\u017c o harmonogramie
  ich wdra\u017cania najp\u00f3\u017aniej dnia 31 stycznia nast\u0119puj\u0105cego
  po danym roku kalendarzowym. W odniesieniu do roku kalendarzowego 2010 informacje
  te s\u0105 jednak przekazywane Komisji najp\u00f3\u017aniej dnia 28 lutego 2011
  r.\\\";\\n\\n2) w art. 7 ust. 1 lit. f) otrzymuje brzmienie:\\n\u201ef) rodzaj uprawnienia,
  w szczeg\u00f3lno\u015bci uprawnienia specjalne przewidziane w art. 44 rozporz\u0105dzenia
  (WE) nr 73/2009, uprawnienia przyznane zgodnie z art. 68 ust. 1 lit. c) rozporz\u0105dzenia
  (WE) nr 73/2009 oraz uprawnienia do p\u0142atno\u015bci b\u0119d\u0105ce przedmiotem
  odst\u0119p\u00ad stwa zgodnie z art. 64 ust. 2) rozporz\u0105dzenia (WE) nr 73/2009;\\\";\\n3)
  w art. 28 ust. 1 lit. a) wyrazy \u201eza\u0142\u0105cznikach I i IV\\\" otrzymuj\u0105
  brzmienie \u201eza\u0142\u0105cznikach I i VI\\\";\\n4) w art. 50 dodaje si\u0119
  ust. 1a w brzmieniu:\\n\u201e1a. W drodze odst\u0119pstwa od ust. 1, w celu osi\u0105gni\u0119cia
  minimalnego poziomu kontroli, o kt\u00f3rym mowa w wymienionym ust\u0119pie, na
  poziomie ka\u017cdego aktu praw\u00ad nego lub normy b\u0105d\u017a grupy akt\u00f3w
  prawnych lub norm, pa\u0144stwo cz\u0142onkowskie mo\u017ce:\\na) w odniesieniu
  do wybranych rolnik\u00f3w \u2013 wykorzystywa\u0107 wyniki kontroli na miejscu
  przeprowadzonych zgodnie z prawodawstwem maj\u0105cym zastosowanie do tych akt\u00f3w
  prawnych lub norm; lub\\nb) zast\u0105pi\u0107 wybranych rolnik\u00f3w rolnikami,
  kt\u00f3rych gospo\u00ad darstwa zosta\u0142y poddane kontroli na miejscu, przeprowa\u00ad
  dzonej zgodnie z prawodawstwem maj\u0105cym zastoso\u00ad wanie do tych akt\u00f3w
  prawnych lub norm, pod warun\u00ad kiem \u017ce rolnicy ci przedstawi\u0105 wnioski
  o przyznanie pomocy z tytu\u0142u system\u00f3w wsparcia bezpo\u015bredniego w rozumieniu
  art. 2 lit. d) rozporz\u0105dzenia (WE) nr 73/2009 lub z tytu\u0142u system\u00f3w
  wsparcia obj\u0119tych art. 85t i 103z rozporz\u0105dzenia (WE) nr 1234/2007.\\n\\nW
  takich przypadkach kontrole na miejscu obejmuj\u0105 wszystkie aspekty zwi\u0105zane
  z zasad\u0105 wzajemnej zgodno\u015bci okre\u015blone w odpowiednich aktach prawnych
  lub normach. Ponadto pa\u0144stwo cz\u0142onkowskie gwarantuje, \u017ce kontrole
  na miejscu s\u0105 co najmniej tak samo skuteczne jak kontrole przeprowadzane przez
  w\u0142a\u015bciwe organy kontroli.\\\";\\n\\n5) w art. 51 ust. 1 po akapicie drugim
  dodaje si\u0119 akapity w brzmieniu:\\n\\n\u201eNa podstawie analizy ryzyka pa\u0144stwo
  cz\u0142onkowskie mo\u017ce wykluczy\u0107 rolnik\u00f3w uczestnicz\u0105cych w
  systemie certyfikacji, o kt\u00f3rym mowa w lit. b) akapit drugi, z pr\u00f3by kontrolnej
  opartej na analizie ryzyka. Je\u017celi jednak system certyfikacji obejmuje jedynie
