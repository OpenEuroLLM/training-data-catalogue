  w \u017cycie z dniem podj\u0119cia.\\n\\nprof. dr hab. Marcin Gruchala\\n\\nPrzewodnicz\u0105cy
  Konferencji Rektor\u00f3w Akademickich Uczelni Medycznych w kadencji 2020-2024\"",
  "\"Za\u0142\u0105cznik nr 4: Regulamin Projektu \u201eCi\u0119\u017car\u00f3wk\u0105
  przez \u015bwiat \u2013 JaZDAMowy rozw\u00f3j zawodowy\\\"\\n\\nREGULAMIN PROJEKTU\\n\\n\u201eCi\u0119\u017car\u00f3wk\u0105
  przez \u015bwiat \u2013 JaZDAMowy rozw\u00f3j zawodowy\\\"\\n\\nProjekt realizowany
  jest w ramach Regionalnego Programu Operacyjnego Wojew\u00f3dztwa Kujawsko-Pomorskiego
  na lata 2014-2020, O\u015b Priorytetowa 11, Dzia\u0142anie: 11.1 W\u0142\u0105czenie
  spo\u0142eczne na obszarach obj\u0119tych LSR\\n\\n\u00a7 1 INFORMACJE OG\u00d3LNE\\n\\n1.
  Projekt \u201eCi\u0119\u017car\u00f3wk\u0105 przez \u015bwiat \u2013 JaZDAMowy rozw\u00f3j
  zawodowy\\\", zwany dalej Projektem jest realizowany przez PPHU NW-BD EFEKT Nikodem
  Dolata (zwanym dalej Grantobiorc\u0105).\\n2. Projekt jest wsp\u00f3\u0142finansowany
  ze \u015brodk\u00f3w Europejskiego Funduszu Spo\u0142ecznego w ramach Regionalnego
  Programu Operacyjnego Wojew\u00f3dztwa Kujawsko-Pomorskiego na lata 2014-2020, Dzia\u0142anie
  11.1 W\u0142\u0105czenie spo\u0142eczne na obszarach obj\u0119tych LSR.\\n3. Projekt
  jest realizowany w okresie od 01.04.2022 r. do 31.01.2023 r.\\n4. W przypadku wyst\u0105pienia
  si\u0142y wy\u017cszej np. COVID, dopuszcza si\u0119 mo\u017cliwo\u015b\u0107 przed\u0142u\u017cenia
  czasu realizacji Projektu oraz realizacj\u0119 wszystkich mo\u017cliwych dzia\u0142a\u0144
  w formie zdalnej.\\n5. Projekt jest realizowany na obszarze wskazanym w Lokalnej
  Strategii Rozwoju Stowarzyszenia Lokalna Grupa Dzia\u0142ania S\u0105siedzi wok\u00f3\u0142
  Szlaku Piastowskiego tj. powiatu mogile\u0144skiego.\\n6. Biuro Projektu znajduje
  si\u0119 w Miejsko - Gminnym O\u015brodku Pomocy Spo\u0142ecznej, ul. Rynek 10,
  88300 Mogilno, strona internetowa: https://jazdam.pl/, telefon: 506 506 886.\\n7.
  Niniejszy regulamin okre\u015bla zasady rekrutacji i udzia\u0142u we wszystkich
  formach wsparcia realizowanych w ramach Projektu.\\n8. Zobowi\u0105zania stron,
  w tym szczeg\u00f3\u0142owe prawa i obowi\u0105zki stron, zosta\u0142y okre\u015blone
  w umowie uczestnictwa w projekcie \u201eCi\u0119\u017car\u00f3wk\u0105 przez \u015bwiat
  \u2013 JaZDAMowy rozw\u00f3j zawodowy\\\".\\n9. Celem Projektu jest zwi\u0119kszenie
  aktywnej postawy spo\u0142eczno-zawodowej u 15 os\u00f3b zagro\u017conych ub\u00f3stwem
  lub wykluczeniem spo\u0142ecznym, zamieszkuj\u0105cych na terenie LSR, do 31.01.2023
  r.\\n10. Projekt realizowany b\u0119dzie zgodnie z zasadami polityki r\u00f3wnych
  szans kobiet i m\u0119\u017cczyzn i niedyskryminacji.\\n11. Dzia\u0142ania projektowe
  b\u0119d\u0105 realizowane w trosce o zachowanie zasady zr\u00f3wnowa\u017conego
  rozwoju, nie naruszaj\u0105c istniej\u0105cego stanu \u015brodowiska naturalnego
  oraz w oparciu o poszanowanie dla ochrony przyrody, klimatu i zasob\u00f3w wodnych.\\n\\nS\u0142ownik
  poj\u0119\u0107:\\n\\n1. Grantobiorca \u2013 PPHU NW-BD EFEKT Nikodem Dolata, ul.
  Okr\u0119\u017cna 15/26,  88-192 Piechcin.\\n2. Projekt obj\u0119ty grantem\u2013
  \u201eCi\u0119\u017car\u00f3wk\u0105 przez \u015bwiat \u2013 JaZDAMowy rozw\u00f3j
  zawodowy\\\".\\n3. Kandydat \u2013 osoba ubiegaj\u0105ca si\u0119 o zakwalifikowanie
  do udzia\u0142u w Projekcie na podstawie zasad okre\u015blonych w niniejszym regulaminie.\\n4.
  Uczestnik Projektu \u2013 osoba zakwalifikowana do udzia\u0142u w Projekcie, bezpo\u015brednio
  korzystaj\u0105ca ze wsparcia w Projekcie.\\n5. Osoba niepracuj\u0105ca na dzie\u0144
  przyst\u0105pienia do Projektu \u2013 osoby bierne zawodowo oraz osoby ze statusem
  osoby bezrobotnej.\\n6. I\u015aR \u2013 Indywidualna \u015acie\u017cka Reintegracji,
  czyli zindywidualizowana \u015bcie\u017cka wsparcia planowana dla uczestnika Projektu.\\n\\n\u00a7
  2 GRUPA DOCELOWA PROJEKTU\\n\\nProjekt adresowany jest do 15 os\u00f3b, w tym 6
  kobiet i 9 m\u0119\u017cczyzn, spe\u0142niaj\u0105cych nast\u0119puj\u0105ce kryteria
  dost\u0119pu:\\n\\na) osoby zagro\u017cone ub\u00f3stwem lub wykluczeniem spo\u0142ecznym,
  tj. spe\u0142niaj\u0105ce przynajmniej jedn\u0105 z poni\u017cszych przes\u0142anek:\\n\u2212
  osoby lub rodziny korzystaj\u0105ce ze \u015bwiadcze\u0144 pomocy spo\u0142ecznej
  zgodnie z ustaw\u0105 z dnia 12 marca 2004 r. o pomocy spo\u0142ecznej lub kwalifikuj\u0105ce
  si\u0119 do obj\u0119cia wsparciem przez pomoc spo\u0142eczn\u0105, tj. spe\u0142niaj\u0105ce
  co najmniej jedn\u0105 z przes\u0142anek okre\u015blonych w art. 7 ustawy z dnia
  12 marca 2004 r. o pomocy spo\u0142ecznej \u2013 \u017ar\u00f3d\u0142o weryfikacji:
  o\u015bwiadczenie uczestnika (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie
  o\u015bwiadcze\u0144 niezgodnych z prawd\u0105) lub za\u015bwiadczenie z o\u015brodka
  pomocy spo\u0142ecznej, przy czym nie ma obowi\u0105zku wskazywania, kt\u00f3ra
  przes\u0142anka okre\u015blona w/w ustawie zosta\u0142a spe\u0142niona,\\n\u2212
  osoby o kt\u00f3rych mowa w art. 1 ust. 2 ustawy z dnia 13 czerwca 2003 r. o zatrudnieniu
  socjalnym \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie uczestnika
  (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych
  z prawd\u0105) lub za\u015bwiadczenie z w\u0142a\u015bciwej instytucji, przy czym
  nie ma obowi\u0105zku wskazywania, kt\u00f3ra przes\u0142anka okre\u015blona w w/w
  ustawie zosta\u0142a spe\u0142niona,\\n\u2212 osoby przebywaj\u0105ce w pieczy zast\u0119pczej,
  w tym r\u00f3wnie\u017c osoby przebywaj\u0105ce w pieczy zast\u0119pczej na warunkach
  okre\u015blonych w art. 37 ust. 2 ustawy z dnia 9 czerwca 2011 r. o wspieraniu rodziny
  i systemie pieczy zast\u0119pczej lub opuszczaj\u0105ce piecz\u0119 zast\u0119pcz\u0105,
  rodziny prze\u017cywaj\u0105ce trudno\u015bci w pe\u0142nieniu funkcji opieku\u0144czo
  wychowawczych, o kt\u00f3rych mowa w ustawie z dnia 9 czerwca 2011 r. o wspieraniu
  rodziny i systemie pieczy zast\u0119pczej \u2013 \u017ar\u00f3d\u0142o weryfikacji:
  o\u015bwiadczenie uczestnika lub jego opiekuna prawnego w przypadku os\u00f3b niepe\u0142noletnich
  np. rodzica zast\u0119pczego (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie
  o\u015bwiadcze\u0144 niezgodnych z prawd\u0105) lub za\u015bwiadczenie z w\u0142a\u015bciwej
  instytucji lub za\u015bwiadczenie od kuratora,\\n\u2212 osoby nieletnie, wobec kt\u00f3rych
  zastosowano \u015brodki zapobiegania i zwalczania demoralizacji i przest\u0119pczo\u015bci
  zgodnie z ustaw\u0105 z dnia 26 pa\u017adziernika 1982 r. o post\u0119powaniu w
  sprawach nieletnich \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie
  uczestnika (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144
  niezgodnych z prawd\u0105) lub za\u015bwiadczenie od kuratora lub za\u015bwiadczenie
  z zak\u0142adu poprawczego lub innej instytucji czy organizacji spo\u0142ecznej
  zajmuj\u0105cej si\u0119 prac\u0105 z nieletnimi o charakterze wychowawczym, terapeutycznym
  lub szkoleniowym lub inny dokument potwierdzaj\u0105cy zastosowanie \u015brodk\u00f3w
  zapobiegania i zwalczania demoralizacji i przest\u0119pczo\u015bci,\\n\u2212 osoby
  przebywaj\u0105ce w m\u0142odzie\u017cowych o\u015brodkach wychowawczych i m\u0142odzie\u017cowych
  o\u015brodkach socjoterapii, o kt\u00f3rych mowa w ustawie z dnia 7 wrze\u015bnia
  1991 r. o systemie o\u015bwiaty (Dz. U. z 2017 r. poz. 2198 z p\u00f3\u017an. zm.)
  \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie uczestnika (z pouczeniem
  o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105)
  lub za\u015bwiadczenie z o\u015brodka wychowawczego/ m\u0142odzie\u017cowego/ socjoterapii\\n\u2212
  osoby z niepe\u0142nosprawno\u015bci\u0105, tj. osoby z niepe\u0142nosprawno\u015bci\u0105
  w rozumieniu Wytycznych w zakresie realizacji zasady r\u00f3wno\u015bci szans i
  niedyskryminacji, w tym dost\u0119pno\u015bci dla os\u00f3b z niepe\u0142nosprawno\u015bciami
  oraz zasady r\u00f3wno\u015bci szans kobiet i m\u0119\u017cczyzn w ramach funduszy
  unijnych na lata 2014-2020 lub uczniowie/dzieci z niepe\u0142nosprawno\u015bciami
  w rozumieniu Wytycznych w zakresie realizacji przedsi\u0119wzi\u0119\u0107 z udzia\u0142em
  \u015brodk\u00f3w Europejskiego Funduszu Spo\u0142ecznego w obszarze edukacji na
  lata 2014-2020 \u2013 \u017ar\u00f3d\u0142o weryfikacji: odpowiednie orzeczenie
  lub inny dokument po\u015bwiadczaj\u0105cy stan zdrowia,\\n\u2212 cz\u0142onkowie
  gospodarstw domowych sprawuj\u0105cy opiek\u0119 nad osob\u0105 z niepe\u0142nosprawno\u015bci\u0105,
  o ile co najmniej jeden z nich nie pracuje ze wzgl\u0119du na konieczno\u015b\u0107
  sprawowania opieki nad osob\u0105\\nz niepe\u0142nosprawno\u015bci\u0105 \u2013
  \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie uczestnika (z pouczeniem o
  odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105)
  lub inny dokument potwierdzaj\u0105cy w/w sytuacj\u0119,\\n\\n\u2212 osoby potrzebuj\u0105ca
  wsparcia w codziennym funkcjonowaniu \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie
  uczestnika lub jego opiekuna, je\u015bli niemo\u017cliwe jest uzyskanie o\u015bwiadczenia
  uczestnika (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144
  niezgodnych z prawd\u0105) lub za\u015bwiadczenie od lekarza lub odpowiednie orzeczenie
  lub inny dokument po\u015bwiadczaj\u0105cy stan zdrowia,\\n\u2212 osoby bezdomne
  lub dotkni\u0119te wykluczeniem z dost\u0119pu do mieszka\u0144 w rozumieniu Wytycznych
  w zakresie monitorowania post\u0119pu rzeczowego realizacji program\u00f3w operacyjnych
  na lata 20142020 \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie uczestnika
  (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych
  z prawd\u0105) lub za\u015bwiadczenie od w\u0142a\u015bciwej instytucji lub inny
  dokument potwierdzaj\u0105cy w/w sytuacj\u0119,\\n\u2212 osoby odbywaj\u0105ce kary
  pozbawienia wolno\u015bci w formie dozoru elektronicznego \u2013 \u017ar\u00f3d\u0142o
  weryfikacji: o\u015bwiadczenie uczestnika (z pouczeniem o odpowiedzialno\u015bci
  za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105) lub za\u015bwiadczenie
  od w\u0142a\u015bciwej instytucji lub inny dokument potwierdzaj\u0105cy w/w sytuacj\u0119,\\n\u2212
  osoby korzystaj\u0105ce z PO P\u017b \u2013 \u017ar\u00f3d\u0142o weryfikacji: o\u015bwiadczenie
  uczestnika (z pouczeniem o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144
  niezgodnych z prawd\u0105) lub inny dokument potwierdzaj\u0105cy korzystanie z PO
  P\u017b.\\nb) osoby zamieszkuj\u0105ce na obszarze obj\u0119tym LSR Stowarzyszenia
  Lokalna Grupa Dzia\u0142ania S\u0105siedzi wok\u00f3\u0142 Szlaku Piastowskiego,
  tj. powiatu mogile\u0144skiego (w rozumieniu kodeksu cywilnego) [weryfikacja na
  podstawie formularza zg\u0142oszeniowego zawieraj\u0105cego pouczenie o odpowiedzialno\u015bci
  za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105],\\nc) osoby, kt\u00f3re
  nie uczestniczy\u0142y wcze\u015bniej i nie uczestnicz\u0105 w projektach obj\u0119tych
  grantem dofinansowanych ze \u015brodk\u00f3w LSR Stowarzyszenia Lokalna Grupa Dzia\u0142ania
  S\u0105siedzi wok\u00f3\u0142 Szlaku Piastowskiego do roku 2023 [weryfikacja na
  podstawie formularza zg\u0142oszeniowego zawieraj\u0105cego pouczenie o odpowiedzialno\u015bci
  za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105],\\nd) osoby niepracuj\u0105ce
  na dzie\u0144 przyst\u0105pienia do projektu [weryfikacja na podstawie za\u015bwiadczenia
  z PUP lub ZUS],\\n\\nW przypadku z\u0142o\u017cenia o\u015bwiadczenia niezgodnego
  z prawd\u0105 uczestnik mo\u017ce zosta\u0107 zobowi\u0105zany do zwrotu ca\u0142kowitego
  kosztu uczestnictwa w projekcie wraz z kosztami administracyjnymi.\\n\\n\u00a7 3
  REKRUTACJA DO PROJEKTU\\n\\n1. Rekrutacj\u0119 poprzedzi akcja informacyjna. Wykorzystane
  w tym celu zostan\u0105 media spo\u0142eczno\u015bciowe (fanpage), strona www Grantobiorcy,
  przes\u0142anie informacji do  instytucji z terenu LSR (m.in. do organizacji pozarz\u0105dowych,
  JST (Urz\u0119dy Miasta/Gminy) i instytucjach jej podleg\u0142ych (m.in. GOPS),
  szk\u00f3\u0142 oraz do w\u0142a\u015bciwych terytorialnie OWES, PCPR, PUP.\\n2.
  Przewidziano jeden nab\u00f3r uczestnik\u00f3w, w terminie kt\u00f3ry zostanie wskazany
  na stronie www Grantobiorcy. W przypadku niewystarczaj\u0105cej liczby os\u00f3b
  zakwalifikowanych do udzia\u0142u w Projekcie przewiduje si\u0119 wyd\u0142u\u017cenie
  procesu rekrutacji na analogicznych zasadach, ze wskazaniem terminu naboru na stronie
  www Grantobiorcy.\\n3. Dokumenty rekrutacyjne w formie papierowej b\u0119d\u0105
  dost\u0119pne w biurze Projektu i podczas spotka\u0144 informacyjnych organizowanych
  na terenie obj\u0119tym LSR oraz w formie elektronicznej do pobrania ze strony www
  Grantobiorcy.\\n4. Komplet dokument\u00f3w rekrutacyjnych obejmuje formularz rekrutacyjny
  wraz z za\u0142\u0105cznikami, tj. odpowiednimi za\u015bwiadczeniami b\u0105d\u017a
  o\u015bwiadczeniami potwierdzaj\u0105cymi przynale\u017cno\u015b\u0107 kandydata
  do grupy docelowej. Formularz rekrutacyjny nale\u017cy wype\u0142ni\u0107 zgodnie
  ze wzorem stanowi\u0105cym za\u0142\u0105cznik do niniejszego regulaminu.\\n\\n5.
  Wype\u0142nione przez kandydat\u00f3w dokumenty rekrutacyjne b\u0119dzie mo\u017cna
  dostarczy\u0107 osobi\u015bcie do biura Projektu lub przes\u0142a\u0107 poczt\u0105/kurierem
  na adres biura Projektu lub mailowo (w formie zeskanowano podpisanego dokumentu)
  na adres firstname.lastname@example.org. Dla os\u00f3b maj\u0105cych trudno\u015bci
  z dostarczeniem formularza (spowodowane ograniczeniami mobilno\u015bciowymi wynikaj\u0105cymi
  z niepe\u0142nosprawno\u015bci) dost\u0119pna jest mo\u017cliwo\u015b\u0107 odbioru
  dokument\u00f3w przez pracownika projektu.\\n6. Zgodnie z \u201eWytycznymi w zakresie
  kwalifikowalno\u015bci wydatk\u00f3w w ramach Europejskiego Funduszu Rozwoju Regionalnego,
  Europejskiego Funduszu Spo\u0142ecznego oraz Funduszu Sp\u00f3jno\u015bci na lata
  2014-2020\\\" w przypadku braku mo\u017cliwo\u015bci uzyskania pisemnego potwierdzenia
  spe\u0142nienia kryteri\u00f3w kwalifikowalno\u015bci uczestnika projektu oraz przyj\u0119cia
  do wiadomo\u015bci o przetwarzaniu danych osobowych w postaci w\u0142asnor\u0119cznie
  z\u0142o\u017conego podpisu zastosowywanie maj\u0105 poni\u017csze procedury:\\na)
  w przypadku os\u00f3b ubezw\u0142asnowolnionych formularz oraz wszelk\u0105 dokumentacj\u0119
  projektow\u0105 podpisuje opiekun prawny,\\nb) w przypadku os\u00f3b nieubezw\u0142asnowolnionych,
  kt\u00f3re nie potrafi\u0105 samodzielnie si\u0119 podpisa\u0107 przyjmowana jest
  nast\u0119puj\u0105ca procedura:\\n\u2212 wyra\u017cenie zgody przez opiekuna Kandydata,
  posiadaj\u0105cego upowa\u017cnienie notarialne do podejmowania decyzji dotycz\u0105cych
  leczenia i post\u0119powania medycznego,\\n\u2212 z\u0142o\u017cenie przez opiekuna
  Kandydata adnotacji na formularzu zg\u0142oszeniowym informuj\u0105cej, i\u017c
  chory nie potrafi si\u0119 podpisa\u0107. W\u00f3wczas nast\u0119puje z\u0142o\u017cenie
  o\u015bwiadczenia poprzez tuszowe odci\u015bni\u0119cie palca na dokumencie w obecno\u015bci
  opiekuna i personelu projektu. Przy odcisku palca opiekun wpisuje imi\u0119 i nazwisko
  chorego i umie\u015bci sw\u00f3j podpis. Z\u0142o\u017cenie takiego o\u015bwiadczenia
  nast\u0119puje w warunkach umo\u017cliwiaj\u0105cych kandydatowi skupienie i pe\u0142ne
  zapoznanie si\u0119 z tre\u015bci\u0105 sk\u0142adanych o\u015bwiadcze\u0144.\\n7.
  Z\u0142o\u017cone dokumenty nie podlegaj\u0105 zwrotowi. Osoba ch\u0119tna do udzia\u0142u
  w Projekcie zobowi\u0105zana jest do podania informacji zgodnych ze stanem faktycznym
  oraz do wype\u0142nieniu dokument\u00f3w w spos\u00f3b kompletny i czytelny.\\n8.
  Z\u0142o\u017cone dokumenty b\u0119d\u0105 podlega\u0142y ocenie formalnej \u2013
  zgodnie z kryteriami obligatoryjnymi (dost\u0119pu) i ocenie merytorycznej \u2013
  zgodnie z kryteriami punktowymi. Do oceny merytorycznej dopuszczone zostaj\u0105
  wy\u0142\u0105cznie formularze, kt\u00f3re spe\u0142niaj\u0105 kryteria formalne.
  Oceny formularzy dokonaj\u0105 pracownicy biura Projektu.\\n9. Kryteria formalne
  (dost\u0119pu) zostan\u0105 zweryfikowane poprzez odpowied\u017a na poni\u017csze
  pytania:\\na) cz\u0119\u015b\u0107 pierwsza \u2013 kompletno\u015b\u0107 i poprawno\u015b\u0107
  dokument\u00f3w:\\n\u2212 czy formularz zosta\u0142 z\u0142o\u017cony we w\u0142a\u015bciwym
  miejscu i czasie, z zastrze\u017ceniem \u017ce decyduj\u0105cy jest moment wp\u0142ywu,
  a nie data nadania,\\n\u2212 czy formularz zosta\u0142 z\u0142o\u017cony na obowi\u0105zuj\u0105cym
  wzorze,\\n\u2212 czy formularz jest kompletny (posiada wszystkie strony),\\n\u2212
  czy wszystkie wymagane pola zosta\u0142y wype\u0142nione,\\n\u2212 czy we wskazanym
  miejscu formularz zosta\u0142 podpisany ze wskazaniem daty (dotyczy zar\u00f3wno
  formularza, jak i klauzuli RODO),\\n\u2212 czy za\u0142\u0105czono wszystkie zadeklarowane
  w formularzu rekrutacyjnym za\u0142\u0105czniki.\\nb) cz\u0119\u015b\u0107 druga
  \u2013 przynale\u017cno\u015b\u0107 do grupy docelowej:\\n\u2212 czy kandydat jest
  osob\u0105 zagro\u017con\u0105 ub\u00f3stwem lub wykluczeniem spo\u0142ecznym [weryfikacja
  na podstawie o\u015bwiadczenia kandydata na uczestnika z pouczeniem o odpowiedzialno\u015bci
  za sk\u0142adanie o\u015bwiadcze\u0144 niezgodnych z prawd\u0105 lub za\u015bwiadczenia,
  zgodnie z zapisami \u00a7 2 pkt. a)],\\n\u2212 czy kandydat zamieszkuje na obszarze
  obj\u0119tym LSR Stowarzyszenia Lokalna Grupa Dzia\u0142ania S\u0105siedzi wok\u00f3\u0142
  Szlaku Piastowskiego (tj. powiat mogile\u0144ski) [weryfikacja na podstawie\\n\\nformularza
  zg\u0142oszeniowego zawieraj\u0105cego pouczenie o odpowiedzialno\u015bci za sk\u0142adanie
  o\u015bwiadcze\u0144 niezgodnych z prawd\u0105],\\n\u2212 czy kandydat jest osob\u0105,
  kt\u00f3ra nie uczestniczy\u0142a i nie uczestniczy w innych w projektach obj\u0119tych
  grantem dofinansowanych ze \u015brodk\u00f3w LSR Lokalna Grupa Dzia\u0142ania S\u0105siedzi
  wok\u00f3\u0142 Szlaku Piastowskiego [weryfikacja na podstawie formularza zg\u0142oszeniowego
  zawieraj\u0105cego pouczenie o odpowiedzialno\u015bci za sk\u0142adanie o\u015bwiadcze\u0144
  niezgodnych z prawd\u0105],\\n\u2212 czy kandydat jest osob\u0105 niepracuj\u0105c\u0105
  w chwili przyst\u0105pienia do Projektu [weryfikacja na podstawie za\u015bwiadczenia
  z PUP lub ZUS],\\n\u2212 czy kandydat z\u0142o\u017cy\u0142 o\u015bwiadczenie dot.
  gromadzenia, przetwarzania i przekazywania danych osobowych na potrzeby rekrutacji
  do Projektu oraz zobowi\u0105za\u0142 si\u0119 do przekazania informacji na temat
  sytuacji po opuszczeniu Projektu [weryfikacja na podstawie o\u015bwiadczenia w formularzu]
  \u2013 warunkiem uczestnictwa w Projekcie jest przekazanie danych typu p\u0142e\u0107,
  status na rynku pracy, wiek, wykszta\u0142cenie potrzebnych do monitorowania wska\u017anik\u00f3w
  kluczowych oraz przeprowadzenia ewaluacji.\\n10. Kryteria merytoryczne \u2013 punktowe
  (sumuj\u0105ce si\u0119 do maksymalnie 8 punkt\u00f3w), zgodnie z poni\u017cszymi
  zasadami:\\n\u2212 kobiety zarejestrowane jako bezrobotne +2 punkty [weryfikacja
  na podstawie p\u0142ci wskazanej w formularzu oraz za\u015bwiadczenia z PUP],\\n\u2212
  osoby m\u0142ode (poni\u017cej 25 roku \u017cycia) zarejestrowane jako bezrobotne
  +2 punkty [weryfikacja na podstawie daty urodzenia wskazanej w formularzu oraz za\u015bwiadczenia
  z PUP],\\n\u2212 osoby niepe\u0142nosprawne zarejestrowane jako bezrobotne +2 punkty
  [weryfikacja na podstawie odpowiedniego orzeczenia lub innego dokumentu po\u015bwiadczaj\u0105cego
  stan zdrowia oraz za\u015bwiadczenia z PUP],\\n\u2212 osoby powy\u017cej 45 roku
  \u017cycia zarejestrowane jako bezrobotne +2 punkty [weryfikacja na podstawie daty
  urodzenia wskazanej w formularzu oraz za\u015bwiadczenia z PUP],\\n\u2212 osoby
  zarejestrowane jako bezrobotne z wykszta\u0142ceniem podstawowym lub gimnazjalnym
  oraz z wykszta\u0142ceniem zawodowym +2 punkty [weryfikacja na podstawie wykszta\u0142cenia
  wskazanego w formularzu oraz za\u015bwiadczenia z PUP],\\n\u2212 osoby spoza grup
  defaworyzowanych - 0 punkt\u00f3w.\\n11. Formularze niekompletne lub zawieraj\u0105ce
  uchybienia formalne podlegaj\u0105 uzupe\u0142nieniu, kandydat ma mo\u017cliwo\u015b\u0107
  jednorazowego uzupe\u0142nienia z\u0142o\u017conego formularza w terminie 3 dni
  roboczych od dnia przekazania informacji o konieczno\u015bci uzupe\u0142nienia brak\u00f3w/b\u0142\u0119d\u00f3w.
  W przypadku, gdy nie nast\u0105pi prawid\u0142owe uzupe\u0142nienie brak\u00f3w/b\u0142\u0119d\u00f3w
  w wyznaczonym terminie, formularz zostaje odrzucony. Uzupe\u0142nienie mo\u017cliwe
  jest jedynie w przypadku wyst\u0105pienia nast\u0119puj\u0105cych brak\u00f3w lub
  b\u0142\u0119d\u00f3w oczywistych:\\n\u2212 brak daty lub podpisu,\\n\u2212 niewype\u0142nione
  pola w formularzu,\\n\u2212 brak co najmniej jednej strony w formularzu,\\n\u2212
  brak kt\u00f3rego\u015b z za\u0142\u0105cznik\u00f3w.\\n12. Po zako\u0144czeniu
  naboru, na podstawie oceny merytorycznej (punktowej) utworzona zostanie lista rankingowa
  i rezerwowa wed\u0142ug malej\u0105cej liczby punkt\u00f3w. Osoby, kt\u00f3re spe\u0142ni\u0105
  wymogi (kryteria formalne \u2013 dost\u0119pu), ale nie zostan\u0105 zakwalifikowane
  do uczestnictwa w Projekcie z powodu braku miejsc, zostan\u0105 umieszczone na li\u015bcie
  rezerwowej. W przypadku takiej samej liczby punkt\u00f3w uzyskanych przez kandydat\u00f3w
  o zakwalifikowaniu do Projektu decydowa\u0107 b\u0119dzie kolejno\u015b\u0107 zg\u0142osze\u0144.\\n\\n13.
  Osoby z listy rezerwowej b\u0119d\u0105 kwalifikowane do Projektu w przypadku rezygnacji
  lub wykre\u015blenia os\u00f3b z listy rankingowej.\\n14. Po zakwalifikowaniu do
  Projektu z uczestnikami podpisywana b\u0119dzie umowa uczestnictwa w Projekcie,
  na wz\u00f3r kontraktu socjalnego. Warunkiem koniecznym przyst\u0105pienia do Projektu
  jest podpisanie o\u015bwiadczenia o przetwarzaniu danych osobowych i z\u0142o\u017cenie
  deklaracji uczestnictwa w projekcie obj\u0119tym grantem wraz z danymi uczestnika
  projektu obj\u0119tego grantem otrzymuj\u0105cego wsparcie w ramach EFS, zgodnie
  z za\u0142\u0105cznikiem do wzoru umowy uczestnictwa w Projekcie.\\n\\n\u00a7 4
  FORMY WSPARCIA W PROJEKCIE\\n\\n1. Wsparcie udzielane b\u0119dzie na podstawie umowy
  uczestnictwa w Projekcie i obejmowa\u0107 b\u0119dzie indywidualnie dobrane instrumenty
  aktywnej integracji (okre\u015blone w ramach I\u015aR \u2013 Indywidualnej \u015acie\u017cki
  Reintegracji, kt\u00f3rej opracowanie stanowi pierwsze dzia\u0142anie w projekcie,
  dopuszcza si\u0119 mo\u017cliwo\u015b\u0107 aktualizacji I\u015aR w trakcie uczestnictwa
  w projekcie). W ramach wsparcia ka\u017cdy uczestnik skorzysta z minimum jednego
  instrumentu aktywnej integracji w ramach \u015bcie\u017cki spo\u0142ecznej i/lub
  zawodowej.\\n2. Wsparcie w projekcie obejmuje dwie \u015bcie\u017cki: aktywizacji
  spo\u0142ecznej i aktywizacji zawodowej.\\n3. \u015acie\u017cka spo\u0142eczna,
  obligatoryjna dla wszystkich uczestnik\u00f3w, obejmuje:\\na) poradnictwo psychologiczne
  \u2013 wsparcie indywidualne,\\nb) warsztaty z zakresu instrument\u00f3w aktywizacji
  spo\u0142ecznej \u2013 wsparcie grupowe.\\n4. \u015acie\u017cka zawodowa, realizowana
  po wzmocnieniu potencja\u0142u spo\u0142ecznego i osobistego uczestnik\u00f3w zostaje
  obejmuje:\\na) doradztwo zawodowe,\\nb) pakiet \u201ekierowca zawodowy\\\" tj.:\\n\u2212
  badania lekarskie i psychologiczne dla kandydat\u00f3w na kierowc\u00f3w kat. C,\\n\u2212
  kurs prawa jazdy kat. C,\\n\u2212 egzamin pa\u0144stwowy w zakresie prawa jazdy
  kat. C,\\n\u2212 kurs kwalifikacji wst\u0119pnej.\\n\\n\u015acie\u017cka zawodowa
  stanowi\u0107 b\u0119dzie uzupe\u0142nienie pozosta\u0142ych dzia\u0142a\u0144 aktywizacji
  i przygotowuj\u0105cych do funkcjonowania w spo\u0142ecze\u0144stwie. Us\u0142ugi
  o charakterze zawodowym nie b\u0119d\u0105 stanowi\u0142y pierwszego elementu wsparcia
  i \u015bwiadczone b\u0119d\u0105 po wzmocnieniu potencja\u0142u spo\u0142ecznego
  i osobistego uczestnik\u00f3w.\\n\\n5. Uczestnikom bior\u0105cym udzia\u0142 w Projekcie
