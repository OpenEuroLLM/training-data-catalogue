  opiniowania projekt\u00f3w uchwa\u0142\\n\\nw sprawie wieloletniej prognozy finansowej
  na 2019 r.\\n\\nNa mocy ustawy z dnia 27 sierpnia 2009 r. o finansach publicznych
  1 , jednostki samorz\u0105du terytorialnego oraz ich zwi\u0105zki zosta\u0142y zobligowane
  do uchwalenia wieloletnich prognoz finansowych. Ich projekty s\u0105 opiniowane
  przez sk\u0142ady orzekaj\u0105ce regionalnych izb obrachunkowych, a uchwa\u0142y
  w sprawie przyj\u0119cia tych prognoz, podj\u0119te przez organy stanowi\u0105ce,
  s\u0105 badane w trybie nadzoru przez kolegia izb.\\n\\nW okresie od 29 pa\u017adziernika
  do 27 listopada 2018 r. jednostki samorz\u0105du terytorialnego przedk\u0142ada\u0142y
  do tutejszej Izby, w celu zaopiniowania, projekty uchwa\u0142 w sprawie wieloletniej
  prognozy finansowej (WPF) na 2019 r.\\n\\nSk\u0142ady orzekaj\u0105ce, na podstawie
  art. 13 pkt 12 w zwi\u0105zku z art. 19 ust. 2 ustawy o regionalnych izbach obrachunkowych
  2 , opiniowa\u0142y przed\u0142o\u017cone projekty WPF na 2019 rok. \u0141\u0105cznie
  wydano 88 opinii, w tym 70 (79,6%) pozytywnych, 12 (13,6%) z uwagami, 5 (5,7%) z
  zastrze\u017ceniami oraz 1 (1,1%) opini\u0119 negatywn\u0105.\\n\\nWyniki opiniowania
  w podziale na poszczeg\u00f3lne typy jednostek samorz\u0105du terytorialnego przedstawia
  poni\u017csza tabela.\\n\\n| Wyszczeg\u00f3lnienie | Opinie pozytywne |  | Opinie
  z uwagami lub zastrze\u017ceniami |  | Opinie negatywne |  |\\n|---|---|---|---|---|---|---|\\n|  |
  ilo\u015b\u0107 | % | ilo\u015b\u0107 | % | ilo\u015b\u0107 | % |\\n| Gminy | 57
  | 81,4 | 13 | 18,6 | - | - |\\n| Miasto na prawach powiatu | 1 | 100,0 | - | - |
  - | - |\\n| Powiaty | 6 | 54,5 | 4 | 36,4 | 1 | 9,1 |\\n| Wojew\u00f3dztwo | 1 |
  100,0 | - | - | - | - |\\n| Zwi\u0105zki | 5 | 100,0 | - | - | - | - |\\n| Razem
  | 70 | 79,6 | 17 | 19,3 | 1 | 1,1 |\\n\\nW podj\u0119tych uchwa\u0142ach sk\u0142ady
  orzekaj\u0105ce zwraca\u0142y uwag\u0119 na nast\u0119puj\u0105ce nieprawid\u0142owo\u015bci
  b\u0105d\u017a usterki w projektach, kt\u00f3rych wyeliminowanie przed podj\u0119ciem
  uchwa\u0142y w sprawie wieloletniej prognozy finansowej na 2019 r., pozwoli\u0142o
  unikn\u0105\u0107 wskazania w niej przez Kolegium naruszenia prawa:\\n\\n\u2212
  struktura za\u0142\u0105cznika z przedsi\u0119wzi\u0119ciami narusza wymogi art.
  226 ust. 3 pkt 4 i 5 ustawy o finansach publicznych w cz\u0119\u015bci dotycz\u0105cej
  braku powi\u0105zania pomi\u0119dzy poszczeg\u00f3lnymi przedsi\u0119wzi\u0119ciami
  na tle wysoko\u015bci ustalonych limit\u00f3w zobowi\u0105za\u0144 oraz na tle\\n\\n1
  Ustawa z dnia 27 sierpnia 2009 r. o finansach publicznych (j.t. Dz.U. z 2017 r.,
  poz. 2077 ze zm.)\\n\\n2 Ustawa z dnia 7 pa\u017adziernika 1992 r. o regionalnych
  izbach obrachunkowych (j.t. Dz.U. z 2016 r. poz. 561 ze zm.)\\n\\nplanowanych okres\u00f3w
  realizacji a kwotami limit\u00f3w wydatk\u00f3w w poszczeg\u00f3lnych latach, co
  winno zosta\u0107 skorygowane (3 przypadki),\\n\u2212 wskazano na zasadno\u015b\u0107
  weryfikacji danych wykazanych w zakresie wydatk\u00f3w maj\u0105tkowych, a danymi
  wynikaj\u0105cymi z kolumn 11.4 Wydatki inwestycyjne kontynuowane, 11.5 Nowe wydatki
  inwestycyjne oraz 11.6 Wydatki maj\u0105tkowe w formie dotacji (8 przypadk\u00f3w),\\n\u2212
  nale\u017ca\u0142o doprowadzi\u0107 do wzajemnej zgodno\u015bci pomi\u0119dzy poziomem
