  Projektu (zako\u0144czenie uczestnictwa we wszystkich formach wsparcia przewidzianych
  dla danego uczestnika w ramach Projektu).\\n\\n2. Rezygnacja z udzia\u0142u w Projekcie
  mo\u017cliwa jest tylko w uzasadnionych przypadkach i nast\u0119puje poprzez z\u0142o\u017cenie
