  \u00c4l\u00e4 koskaan anna tajuttomalle vett\u00e4 tai vastaavaa.\\n\\nSis\u00e4\u00e4nhengitt\u00e4minen\\n\\nHengitysvaikeuksien
  tai hengitystie\u00e4rsytyksen ilmetess\u00e4: Vie henkil\u00f6 raittiiseen ilmaan
  ja pid\u00e4 h\u00e4net tarkkailun alaisena.\\n\\nKosketus ihoon\\n\\nSaastuneet
