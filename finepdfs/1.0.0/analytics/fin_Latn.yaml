  HALLINTO JA TIETEELLiset NEUVONANTAJAT | 35 |\\n| BIOHITIN HISTORIAN T\u00c4RKEIMM\u00c4T
  TAPAHTUMAT | 39 |\\n\\nBIOHIT\\n\\nBiohit valmistaa laboratoriolaitteita ja -tarvikkeita
  sek\u00e4 kehitt\u00e4\u00e4 diagnostisia testij\u00e4rjestelmi\u00e4 tutkimuslaitosten,
  terveydenhuoltoalan ja teollisuuden laboratorioiden k\u00e4ytt\u00f6\u00f6n. Nesteannosteluliiketoiminnan
  alueella Biohitin p\u00e4\u00e4tuotteet ovat elektroniset ja mekaaniset pipettit
  sek\u00e4 niiden kertak\u00e4ytt\u00f6k\u00e4rjet. Vuonna 1988 toimintansa aloittanut
  Biohit on elektronisten nesteannostelijoiden globaali markkinajohtaja. Yhti\u00f6n
  markkinoimien nesteannostelijoiden valikoima on t\u00e4ll\u00e4 hetkell\u00e4 laajin
  maailmassa.\\n\\nBiohitin tavoitteena on kehitty\u00e4 johtavaksi analysointij\u00e4rjestelmien
  toimittajaksi maailmassa. N\u00e4m\u00e4 j\u00e4rjestelm\u00e4t tulevat koostumaan
  nykyisest\u00e4 p\u00e4\u00e4tuotealueesta eli nesteannostelijoista sek\u00e4 uusista
  alueista eli diagnostisista tuotteista, instrumenteista sek\u00e4 huolto- ja koulutuspalveluista.
  N\u00e4m\u00e4 uudet tuotealueet ovat olleet mittavan kehitysty\u00f6n kohteena
  ja ne on tarkoitus liitt\u00e4\u00e4 Biohitin tuotevalikoimaan 2000-luvun alussa.\\n\\nEdell\u00e4
  mainitut j\u00e4rjestelm\u00e4t ja niiden osakokonaisuudet mahdollistavat sen, ett\u00e4
  Biohit kykenee tarjoamaan kokonaisvaltaisia ratkaisuja tutkimuksen, terveydenhuoltoalan
  ja teollisuuden laboratorioiden analysointitarpeisiin. Yhti\u00f6n on t\u00e4rke\u00e4\u00e4
  suunnata jatkossa voimavarojen erityisesti n\u00e4iden toisinsa liittyvien tuotekokonaisuuksien
  edelleenkehitt\u00e4miseen. T\u00e4ll\u00e4 tavoin Biohit pyrkii hy\u00f6dynt\u00e4m\u00e4\u00e4n
  tuotealueiden v\u00e4lill\u00e4 vallitsevia synergiaetteja sek\u00e4 niit\u00e4
  vahvuustekij\u00f6it\u00e4, jotka syntyv\u00e4t em. alueille tapahtuvan erikoistumisen
  kautta.\\n\\nBiohitin menestyksellisen kehityksen ja kasvun perusteita ovat:\\n\\n-
  Innovaatiiviset, korkealaatuiset ja patentein suojaat high-tech tuotteet\\n- Jatkuva
  panostus tuotekehitykseen ja yhteisty\u00f6 tutkijojen kanssa\\n- Yhteisty\u00f6
  toimialan johtavien suuryritysten kanssa\\n- Ulkomainen tyt\u00e4ryritysverkosto
  kattaaan t\u00e4rkeimm\u00e4t markkina-alueet\\n- Huolto- ja koulutuspalvelut\\n-
  Yhti\u00f6n johdon ja muiden avainhenkil\u00f6iden kokemus ja menestyminen toimialalla\\n-
  Yhti\u00f6n johto ja muu henkil\u00f6st\u00f6 sek\u00e4 tieteelliset neuvonantajat
  omistavat yhti\u00f6n osakkeita\\n- Koko henkil\u00f6kunnalle suunnattu optio-ohjelma\\n\\nVuoden
  1999 keskeiset tapahtumat\\n\\n- Listautuminen Helsingin P\u00f6rssin NM-listalle
  ja uuden p\u00e4\u00e4toman hankkiminen\\n- U.S. patentti 5,895,838 ja useita patenttihakemuksia
  nesteannosteluliiketoiminnan alueella\\n- Diagnostiikkaliketoiminnan alueella patenttihakemukset
  keksinn\u00f6ille; menetelm\u00e4 disakkaridaasien m\u00e4\u00e4r\u00e4tt\u00e4miseksi
  ja testipakkauks, menetelm\u00e4 irreversiibeleille neurovahingoille riskialttiin
  yksil\u00f6n identifiointiseksi, menetelm\u00e4 peptisen haavan riskin m\u00e4\u00e4r\u00e4tt\u00e4miseksi
