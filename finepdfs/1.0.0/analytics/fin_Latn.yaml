  "\"Talousvaliokunnalle\\n\\nE 51/2020 vp Valtioneuvoston selvitys: Komission tiedonanto
  ja pankkien vakavaraisuusasetuksen muutosehdotus COVID-19 pandemian vastaamiseksi\\n\\nRahoitusvakausvirasto
  kiitt\u00e4\u00e4 mahdollisuudesta kommentoida kirjelm\u00e4\u00e4 ja toteaa seuraavaa.\\n\\nRahoitusvakausvirasto
  pit\u00e4\u00e4 komission esitt\u00e4mi\u00e4 muutosehdotuksia kannatettavana ja
  yhtyy kirjelm\u00e4ss\u00e4 todettuun Suomen kantaan siit\u00e4, ett\u00e4 luottolaitosten
  on t\u00e4rke\u00e4\u00e4 kyett\u00e4 luottamaan reaalitaloutta COVID-19-pandemian
  ja siit\u00e4 todenn\u00e4k\u00f6isesti seuraavan laskusuuhdanteen yli. Toisaalta
  on perusteltua, ett\u00e4 t\u00e4ss\u00e4 poikkeuksellisessa tilanteessa tehtyjen
  vakavaraisuuss\u00e4\u00e4ntelyn muutosten tulisi olla rajattuja, v\u00e4liaikaisia
  ja kohdennettuja COVID-19-pandemian vaikutuksiin.\\n\\nRahoitusvakausvirasto toteaa,
  ett\u00e4 muutosehdotukset eiv\u00e4t suoranaisesti liity EU:n krisinratkaisus\u00e4\u00e4ntelyn
  tarkistamiseen. Vakavaraisuuslaskennan l\u00e4heisen kytkenn\u00e4n vuoksi er\u00e4ill\u00e4
  lievennyksill\u00e4 on kuitenkin v\u00e4lillis\u00e4 vaikutuksia erityisesti krisinratkaisuviranomaisten
  toimivallassa olevan omien varojen ja alentamiskelpoisten velkojen v\u00e4himm\u00e4isvaateeseen
