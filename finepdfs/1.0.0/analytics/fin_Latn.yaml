  and a Liquid Dispensing Device.\\n\\n**DIAGNOSTIINKA**\\n\\nDiagnostiikkalaitoktoiminnan
  alueella Biohit kehitt\u00e4\u00e4, valmistaa ja markkinoi entsyymi-immunom\u00e4\u00e4ritys
  (EIA) -menetelmi\u00e4 perustuvia testipiteit\u00e4 ja monoklonaalisia vasta-aineita
  (MAb) sy\u00f6p\u00e4tautien tunnistamiseksi. Sy\u00f6p\u00e4tautien diagnostiikka
  ja erityisesti mahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaissuoillaavan riskin
  mittaus tulee olemaan er\u00e4s Biohitin keskeinen diagnostiikkatuotealue l\u00e4hutelevaisuudessa\\\\textsuperscript{20}.\\n\\n**Mahasy\u00f6v\u00e4n
  sek\u00e4 maha- ja pohjukaissuoillaavan riskin mittaukseen tarkoitettu testipaneeli**\\n\\nMahasy\u00f6p\u00e4
  on t\u00e4ll\u00e4 hetkell\u00e4 er\u00e4s yleisimmist\u00e4 ja letaaleimmist\u00e4
  sy\u00f6p\u00e4taudista maailmassa. Mahasy\u00f6v\u00e4n toteaminen varhaisessa
  vaiheessa on kuitenkin vaikeaa, ja useassa maassa viiden vuoden eloonj\u00e4\u00e4mistodenn\u00e4k\u00f6isyys
  on alle 20\\\\%\\\\textsuperscript{21}. Mahasy\u00f6p\u00e4\u00e4 esiintyy erityisen
  paljon tietyill\u00e4 alueilla maailmassa, kuten Japanissa ja Aasiassa yleens\u00e4.
  T\u00e4ll\u00e4 hetkell\u00e4 ainoa mahdollisuus hoitaa mahasy\u00f6p\u00e4 menestyksellisesti
  on sen varhaisototaminen, jolloin leikkaukseen j\u00e4lkeinen viiden vuoden eloonj\u00e4\u00e4mistodenn\u00e4k\u00f6isyys
  on 90\\\\%\\\\textsuperscript{22}.\\n\\nBiohit ja sen tieteelliset neuvonantajat
  ovat tutkinneet ja kehitt\u00e4neet yli 10 vuotta ainutlaatuista, koko mahan alueen
  sy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaissuoillaavan riskin mittaukseen tarkoitettua
  testipaneelia\\\\textsuperscript{23,24}. Testipaneelin kehitysty\u00f6 perustuu
  mm. tutkimuksiin\\\\textsuperscript{25,26}, joissa selvitetiin mahasy\u00f6v\u00e4n
  ja sen esiasteiden esiintyvyytt\u00e4 ja diagnosointimahdollisuuksia n. 22.000 suomalaisen
  miehen joukossa\\\\textsuperscript{27,28}.\\n\\nTestipaneelin avulla verin\u00e4ytteest\u00e4
  voidaan m\u00e4\u00e4ritt\u00e4\u00e4 Helicobacter pylori (H. pylori) \u2013vasta-aineet,
  pepsinogeeni I \u2013 ja II \u2013pituisuudet, gastriimi-17 toituus sek\u00e4 B-12
  -vitamiinipitoisuus. Kudosn\u00e4yteanalysin perusteella m\u00e4\u00e4ritet\u00e4\u00e4n
  syklo-oksigeneasi-2 (COX-2) \u2013proteiinin esiintyminen tutkittavassa kudoksessa.\\n\\n\\\\textsuperscript{20}
