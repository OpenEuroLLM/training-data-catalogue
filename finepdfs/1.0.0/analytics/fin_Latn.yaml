  viikoitta 3 lahteen, Jani Kela.\\nHYLYKKALON SRK-KODIN KELLARIN NUORISOTILA:\\n-
  ti klo 18\u201319 Emilia Lehtim\u00e4ki ja Johanna Syrj\u00e4m\u00e4ki.\\n\\nTytt\u00f6ille
