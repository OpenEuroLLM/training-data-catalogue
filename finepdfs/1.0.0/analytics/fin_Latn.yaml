  Kauko:\\n\\nSe suuri kuntauudistus, 2016\\n\\nSeuraavat sis\u00e4lt\u00f6alueet:\\n\\nOsa
  II: Suomi kuntavaltiona, s. 59 \u2013 92\\n\\nLis\u00e4ksi luin joitakin paikallislehtien
  vanhoja artikkeleita ja pengoin kunnan vanhoja arkistoituja asiakirjoja, joita kyll\u00e4
  oli runsaasti, mutta joista t\u00e4ss\u00e4 tapauksessa oli melko v\u00e4h\u00e4n
