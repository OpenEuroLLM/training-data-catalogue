  kehittyv\u00e4n sellaisen\\\\textsuperscript{30}. Kudosn\u00e4ytteanalysi\u00e4
  m\u00e4\u00e4ritett\u00e4v\u00e4 COX-2-proteiini ilmenee vain solujen muuttuessa
  neoplastisiksi ja pahanlaatuiski\\\\textsuperscript{31}.\\n\\nPepsinogeneeni I-,
  pepsinogeneeni II- ja gastrini-17-testeill\u00e4 voidaan erottella ne potilaita,
  jotka kuuluvat mahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaisuolihaavan riskiryhm\u00e4\u00e4n.
  N\u00e4it\u00e4 veritestiit mitatav\u00e4t miss\u00e4 osassa mahalaukkuja gastritti-
  ja atrofiamuutokset ovat ja mink\u00e4asteisia n\u00e4m\u00e4 muutokset ovat. K\u00e4ytett\u00e4ess\u00e4
  pepsinogeneeni- ja gastrini-17-testeij\u00e4 yhdess\u00e4 (yhdistettyyn H. pylori-testtiin)
  voidaan gastritin topografiisten tyyppien osalta ennustaa atrofiamuutosten vaikeusaste
  ilman muuten tarvittavaa t\u00e4hyystyst\u00e4 ja kudosn\u00e4ytteit\u00e4.\\n\\nMahalaukun
  t\u00e4hyystutkimusten ei voida tehd\u00e4 kaikille mahavaivoista k\u00e4rsiville
  potilaille rajoitetujen tutkimuskapasiteettien vuoksi. Siksi k\u00e4ytt\u00e4m\u00e4ll\u00e4
  yksinkertaisia veritestej\u00e4 yksin tai muiden tavanomaisten testien ohella voidaan
  vatsavaivoista k\u00e4rsiv\u00e4t tai mahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaisuolihaavan
  riskiryhmiiin kuuluvat potilaita seuloa sek\u00e4 tunnistaa paremmin ja tarkemmin.
  Tutkimusten kohdistaminen riskiryhmii\\\\textsuperscript{32} tehostaa t\u00e4hyystutkimusten
  mielekkyytt\u00e4 ja tehokkuutta.\\n\\nVaikea atrofinen gastritti mahalaukun corpusalueella
  johtaa aineenvaihduntah\u00e4iri\u00f6ihin, ameniaan ja neurologisiin puutostoihin
  sek\u00e4 liis\u00e4\u00e4 demenian riski\u00e4. T\u00e4m\u00e4 johtuu siit\u00e4,
  ett\u00e4 atrofinen gastritti vaikeuttaa B-12-vitamiinin imeytymist\u00e4 ja johtaa
  lopulta t\u00e4m\u00e4n vitamiinin puutostaan. B-12-vitamiinin puutosta johtaa taas
  solua-neenvaihdunan h\u00e4iri\u00f6ihin, joiden merkkein\u00e4 seerumin homokysteiniason
  nousee. Korkea veren homokysteiniitaso puolestaan on riippumaton riskitekij\u00e4
  verisuonisairauksien ja verisuonitikutosten suhteen.\\n\\nYhdist\u00e4m\u00e4ll\u00e4
  B-12-vitamiinim\u00e4\u00e4ritys ja homokysteinim\u00e4\u00e4ritys edell\u00e4 mainittuihin
  pepsinogeneeni- ja gastrini-17-testeihin voidaan erotella ne atrofista gastrittia
  sairastavat potilaita, joiden kohdalla aineenvaihdunta- ja solua-neenvaihdunan h\u00e4iri\u00f6it\u00e4
  ilmenee tai ne potilaat, joilla n\u00e4iden h\u00e4iri\u00f6iden riski on suuri.
  Noin 10% H. pylori-infektioon sairastuneista kuuluu t\u00e4h\u00e4n riskiryhm\u00e4\u00e4n,
  joilla ilmenee kyseisi\u00e4 aineenvaihdunan h\u00e4iri\u00f6it\u00e4 el\u00e4m\u00e4ns\u00e4
  aikana, useimmiten vanhusi\u00e4ss\u00e4.\\n\\nBiohitin monoklonalisia vasta-aineita
  voidaan k\u00e4ytt\u00e4\u00e4 sy\u00f6p\u00e4tutkimuksessa esimerkiksi sy\u00f6v\u00e4n
  lev\u00e4v\u00e4misen ja et\u00e4pes\u00e4kkeiden tutkimiseen. Mikroskooppikuvassa
  transformoidut CHO-solut on v\u00e4ritetty immunofluoresenssitieteikk\u00e4\u00e4
  k\u00e4ytt\u00e4en Biohitin Alfa-IIb-integriini-vasta-aineella.\\n\\n\\\\textsuperscript{29}
  Lim, D. (1996). \\\\textit{Microbiology}, 2nd ed.:522.\\n\\\\textsuperscript{30}
  Ristom\u00e4ki A, Honkanen N, J\u00e4\u00e4skil\u00e4 H, Sipponen P, and H\u00e4kkinen
  M. (1997). Expression of Cyclooxygenase-2 in Human Gastric Carcinoma. \\\\textit{Cancer
  Res.} 57:1276-80\\n\\\\textsuperscript{31} Potilaita, joilla on pitk\u00e4lle kehittyneet
  atrofinen gastritti.\\n\\n\\\"Biohitin testipaneeli auttaa mahasy\u00f6v\u00e4n
  sek\u00e4 maha- ja pohjukaissuolihavaan riskin kartottamisessa\\\", sanoa professori
  Penti Sipponen.\\n\\nMahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaissuolihavaan
  riskei\u00e4 mittavan testipaneelin eri veritestit perustuvat immunoagnostisiin
  menetelmiin ja niiden puutteissa Biohitin monoklonalisiin vasta-aineisiin (MAbs)
  ja mikrolevyihin, joita voidaan k\u00e4ytt\u00e4\u00e4 vertikaalimittaussovelluksissa.
  T\u00e4ll\u00e4 hetkell\u00e4 Biohit valmistaa ja markkinoi 24 monoklonaalista vasta-ainetta,
  joita k\u00e4ytet\u00e4\u00e4n perustutkimuksessa ja eri sy\u00f6p\u00e4tapyyppien
  tunnistamisessa kudosn\u00e4ytteist\u00e4. N\u00e4m\u00e4 monoklonaalista vasta-ainetta
  k\u00e4sitt\u00e4v\u00e4t solujen v\u00e4litt\u00e4en proteiinien vasta-aineet,
  integrimivasta-aineet, solun tukirangan proteiinien vasta-aineet ja hermov\u00e4litt\u00e4j\u00e4aineiden
  vasta-aineet.\\n\\nOn arvioitu, ett\u00e4 verin\u00e4ytteest\u00e4 koko mahan alueen
  sy\u00f6v\u00e4n riskei\u00e4 mittavan testipaneelin ja mahasy\u00f6v\u00e4n diagnosoin
  kudosn\u00e4ytteest\u00e4 vahvistavan COX-2 -testin globaalilla markkinapotentiaali
  on n. USD 450 miljoonaa. Koska kyseisen testipaneelin avulla on mahdollista m\u00e4\u00e4ritt\u00e4\u00e4
  my\u00f6s maha- ja pohjukaissuolihavaan riski, todellisen markkinapotentiaalin voi
  arvioida olevan em. verrattuna moninkertainen.\\n\\nVuonna 1999 Biohit j\u00e4tti
  seuraavat patenttihakemukset koskien mahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaissuolihavaan
  riskei\u00e4 mittavaa testipaneelia sek\u00e4 laktoosi-intoleranssia ja B-12 -vitamiinin
  puutosta m\u00e4\u00e4ritt\u00e4vi\u00e4 testej\u00e4: menetelm\u00e4 maha- ja pohjukaissuolihavaan
  riskin m\u00e4\u00e4ritt\u00e4miseksi, menetelm\u00e4 verisuoni- sek\u00e4 sy\u00f6p\u00e4taudille
  riskialttiin yksil\u00f6n identifioimiseksi ja menetelm\u00e4 irreversiibleille
  neurovahingoille riskialttiin yksil\u00f6n identifioimiseksi.\\n\\n**Laktoosi-intoleranssin
  diagnosointi**\\n\\nHypolaktasiaa sairastaa Suomessa yli 10% v\u00e4est\u00f6st\u00e4.
  Aasian ja Afrikan valtioissa t\u00e4m\u00e4 sairastuvuus nousee jopa 90%-iin. Hypolaktasia
  aiheuttaa maitosokeria (laktoosi) pilkovan entsyymi\u00e4 (laktaasi) puutoksesta
  tai poikkeavan alhaisesta tasosta ohutsuolen limakalvon pinnaepiteiss\u00e4. Puutos
  aiheuttaa vatsavaivoja, ripulia ja turvotusta silloin kun hypolaktasiaa sairastava
  henkil\u00f6 sy\u00f6 ma\u30a4\u30c8uoitteita.\\n\\nOsalla vatsavaivoja (gastrodyspepsia)
  sairastavilla potilailla on diagnosoimaton hypolaktasia oireiden syyn\u00e4. N\u00e4it\u00e4
  potilaat ohjauttuvat ep\u00e4m\u00e4\u00e4r\u00e4isten kroonisten vatsavaivojen
  vuoksi useimahalaukun t\u00e4htystykseen eli gastroskopiaan. Hypolaktasiaa ei kuitenkaan
  voida diagnoosida gastroskopian avulla eik\u00e4 koepalan\u00e4ytteist\u00e4, koska
  entsymin puute ei n\u00e4y mikroskooppiudons\u00e4ytteiss\u00e4 eli limakalvo on
  mikroskooppisesti normaalairakenteinen. Jos hypolaktasiamahdollisuus kuitenkin tulee
  hoihtavan l\u00e4\u00e4k\u00e4rin mieleen vaivojen syyn\u00e4, h\u00e4nen ainoa
  mahdollisuutensa on l\u00e4hettt\u00e4\u00e4 potilas laboratorioon rastitusteihin
  tai puhalluskokeeseen tai laktasaientsymin pitosuus on m\u00e4\u00e4ritett\u00e4v\u00e4
  biokemiallisesti limakalvokudosn\u00e4ytteist\u00e4 laboratoriossa. Kaikki n\u00e4m\u00e4
  kokeet ovat aikaa vievi\u00e4, potilaasta rasittavia ja kalliita.\\n\\nBiohitin
  perendoskoopinen, t\u00e4htystyksen yhteydess\u00e4 teht\u00e4v\u00e4 hypolaktasiapiikatesti
  perustuu siihen, ett\u00e4 t\u00e4htystyksen yhteydess\u00e4 pohjukaissuolesta otetaan
  yksi ylim\u00e4\u00e4r\u00e4inen kudosn\u00e4yte, joka asetetaan testiputkeen. Kahdenkymmenen
  minuutin kuluttua testiliuoksen v\u00e4rimuutos ilmaisee onko limakalvokudosn\u00e4ytteess\u00e4
  laktasaientsyymia vai ei. Mik\u00e4li v\u00e4rimuutosta ei tule, on potilaalla hypolaktasia
  eli laktasaentsyymi\u00e4 puutos. T\u00e4m\u00e4\\n\\n---\\n\\n37 Tutkijoille Milstein
