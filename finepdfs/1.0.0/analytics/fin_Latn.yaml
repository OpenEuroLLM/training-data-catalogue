  Pirkanmaan kunnista on kuulunut kes\u00e4kuussa p\u00e4\u00e4ttyv\u00e4\u00e4n Terps2
  -hankkeeseen, jossa kuntien terveys- ja hyvinvointiasioita ja hyvinvointikertomusty\u00f6t\u00e4
  on tehty yhteisty\u00f6ss\u00e4. Hanketta koordinoi PSPH:n perusterveydenhuollon
  yksik\u00f6n ylil\u00e4\u00e4k\u00e4ri Maarit VarjonenToivonen, jonka vastuualueeseen
  kuuluu terveyden edist\u00e4minen. Hankekuntiin on nimetty hyvinvointikoordinaattorit,
  jotka ovat kokoontuneet yhteisiin palavereihin. Kihni\u00f6n hyvinvointikoordinaattoriksi
  on nimetty Leila Pusa.\\n\\nKihni\u00f6n hyvinvointity\u00f6ryhm\u00e4 on laatinut
  hyvinvointikertomuksen s\u00e4hk\u00f6isen\u00e4 hyvinvointikertomuksena, liite
  nro 1. Se on tehty kuluvalle valtuustokaudelle.\\n\\nP\u00f6yt\u00e4kirjantarkastajat
  nimikirjaimet\\n\\nLautakunta Hallitus\\n\\nValtuusto\\n\\nP\u00f6yt\u00e4kirjantarkastajat
  nimikirjaimet\\n\\nLautakunta Hallitus\\n\\nValtuusto\\n\\nVastaava hoitaja /  hyvinvointikoordinaattori
  Leila Pusa esittelee s\u00e4hk\u00f6ist\u00e4 hyvinvointikertomusta ty\u00f6v\u00e4lineen\u00e4
  tarkemmin kokouksessa.\\n\\nPerusturvalautakunta on hyv\u00e4ksynyt hyvinvointikertomuksen
