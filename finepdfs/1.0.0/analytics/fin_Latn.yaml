  H. and Mazur W. (1997). Phyto-Oestrogens and Western Diseases. \\\\textit{Ann. Med.}
  29:95-120.\\n\\n\\\\textsuperscript{51} Adlercreutz H. and Mazur W. (1997). Phyto-Oestrogens
  and Western Diseases. \\\\textit{Ann. Med.} 29:95-120.\\n\\n\\\\textsuperscript{52}
