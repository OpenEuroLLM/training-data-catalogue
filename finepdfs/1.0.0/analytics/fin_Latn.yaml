  Hallitus\\n\\nValtuusto\\n\\nKIHNI\u00d6N KUNNAN HYVINVOINTIKERTOMUS\\n\\nKhall
  25.08.2014\\n\\n96 \u00a7\\n\\n1.5.2011 voimaan tullut terveydenhuoltolaki (12 \u00a7)
  edellytt\u00e4\u00e4 kuntia seuraamaan asukkaittensa terveytt\u00e4 ja hyvinvointia
  sek\u00e4 niihin vaikuttavia tekij\u00f6it\u00e4 v\u00e4est\u00f6ryhmitt\u00e4in.
  Lain mukaan kunnan on my\u00f6s arvioitava toteutettuja toimenpiteit\u00e4, joilla
  vastataan kuntalaisten hyvinvointitarpeisiin. Kuntalaisten terveydest\u00e4 ja hyvinvoinnista
  sek\u00e4 toteutetuista toimenpiteist\u00e4 on raportoitava valtuustolle vuosittain,
  mink\u00e4 lis\u00e4ksi valtuustolle on kerran valtuustokaudessa valmisteltava laajempi
  hyvinvointikertomus.\\n\\nKunnan on suunnittelussaan asetettava paikallisiin olosuhteisiin
  ja tarpeisiin perustuvat terveyden ja hyvinvoinnin edist\u00e4misen tavoitteet,
  m\u00e4\u00e4ritelt\u00e4v\u00e4 niit\u00e4 tukevat toimenpiteet ja k\u00e4ytett\u00e4v\u00e4
  n\u00e4iden perustana kuntakohtaisia hyvinvointi- ja terveysosoittimia.Terveydenhuoltolaki
  on velvoittanut kuntia nime\u00e4m\u00e4\u00e4n terveyden ja hyvinvoinnin edist\u00e4misen
  vastuutahot. Kunnan eri toimialojen on teht\u00e4v\u00e4 yhteisty\u00f6t\u00e4 terveyden
  ja hyvinvoinnin edist\u00e4misess\u00e4. Lis\u00e4ksi kunnan on teht\u00e4v\u00e4
  yhteisty\u00f6t\u00e4 muiden kunnassa toimivien julkisten tahojen sek\u00e4 yksityisten
  yritysten ja yleishy\u00f6dyllisten yhteis\u00f6jen kanssa.\\n\\nKihni\u00f6ss\u00e4
  on viranhaltijoiden toimesta organisoitu poikkihallinnollinen ty\u00f6ryhm\u00e4
  edist\u00e4m\u00e4\u00e4n suunnitelman toteutumista. Hyvinvointity\u00f6ryhm\u00e4n
  j\u00e4seniin kuuluvat kunnanjohtaja, hallintojohtaja, perusturvajohtaja, teknisen
  johtaja, nuoriso- ja vapaa-aika ohjaaja ja johtava hoitaja, vastaava hoitaja ja
  vastaava l\u00e4\u00e4k\u00e4ri.\\n\\nKihni\u00f6n kunnan hyvinvointikertomuksessa
  selvitet\u00e4\u00e4n ja analysoidaan kunnassa vallitsevan hyvinvoinnin tasoa ja
  palveluiden kyky\u00e4 vastata olemassa oleviin tarpeisiin. Hyvinvointikertomuksessa
  on keskitytty kuvaamaan hyvinvointia erilaisten indikaattoreiden kautta. Hyvinvointia
  on haluttu tarkastella eri v\u00e4est\u00f6ryhmiss\u00e4 ja eri-ik\u00e4isten kohdalla.
  Esille on pyritty saamaan haastavimmat tarpeet ja tavoitteet hyvinvoinnin edist\u00e4misen
  n\u00e4k\u00f6kulmasta.\\n\\nHyvinvointikertomuksen laatimista varten on suunniteltu
  s\u00e4hk\u00f6inen hyvinvointikertomus (www.hyvinvointikertomus.fi), joka siirtynyt
