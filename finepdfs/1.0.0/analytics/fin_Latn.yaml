  \u00a7\\n\\nKhall\\n\\nEhdotus:\\n\\nKunnanvaltuusto hyv\u00e4ksyy liitteen\u00e4
  nro 1 olevan Kihni\u00f6n kunnan hyvinvointi- kertomuksen.\\n\\nKvalt\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\nKunnanvaltuusto
  hyv\u00e4ksyi yksimielisesti kunnanhallituksen p\u00e4\u00e4t\u00f6sehdotuksen.\\n\\nUUDEN
  MUISTISAIRAIDEN ASUMISPALVELUYKSIK\u00d6N HANKE JA KIINTEIST\u00d6N V\u00c4LIVUOKRAUS\\n\\nKunnanhallitus
  25.08.2014\\n\\n97 \u00a7\\n\\nMuistisairaiden asumispalveluyksik\u00f6n suunnitteluty\u00f6n
  k\u00e4ynnist\u00e4miseksi perusturvalautakunta valitsi 18.3.2014 ty\u00f6ryhm\u00e4n
  vastaamaan palveluasumisyksik\u00f6n suunnittelun eri toteuttamisen vaihtoehdoista.
  Ty\u00f6ryhm\u00e4 aloitti toimintansa 24.4.2014. Ty\u00f6ryhm\u00e4 on tehnyt yhden
  tutustumis-k\u00e4ynnin Kankaanp\u00e4\u00e4ss\u00e4 sijaitseviin asumispalveluyksik\u00f6ihin.
  Ty\u00f6ryhm\u00e4 p\u00e4\u00e4tti k\u00e4ytt\u00e4\u00e4 suunnittelussa apuna
  yksityist\u00e4 konsulttia, Teemu Bj\u00f6rnist\u00e4 Porista. Kokouksia on pidetty
  yhteens\u00e4 kolme.\\n\\nTy\u00f6ryhm\u00e4 p\u00e4\u00e4tti konsultin laatiman
  ty\u00f6paperin ja selvityksen perusteella esitt\u00e4\u00e4 kunnanhallitukselle,
  ett\u00e4 kyseinen hanke on eritt\u00e4in tarpeellinen ajatellen muistisairaiden
  asumispalveluiden tarvetta. Hanke on my\u00f6s v\u00e4ltt\u00e4m\u00e4t\u00f6n aluehallintoviraston
  tekemien selvitys- ja ohjausk\u00e4yntien perusteella. Ty\u00f6ryhm\u00e4n ajatuksena
  on l\u00f6yt\u00e4\u00e4 yleishy\u00f6dyllinen ja yhteiskuntavastuullinen asuntosijoitusyhti\u00f6
  rakentamaan muistisairaiden asumispalveluyksikk\u00f6\u00e4 kunnan osoittamalle
  tontille. Kyseiselle rakennukselle olisi tarkoitus hakea ARA-rahoitusta, johon kunta
  antaisi lausunnon hankkeen tarpeellisuudesta ja teknisest\u00e4 toteutuksesta. Kyseeseen
  tulisi v\u00e4livuokraus, joka tarkoittaa, ett\u00e4 kunta vuokraisi v\u00e4livuokrausmenettelyll\u00e4
  rakennettavan yksik\u00f6n tilat arvonlis\u00e4verollisella vuokralla omistajalta
  ja vuokraisi tilat edelleen joko yksityisille henkil\u00f6ille tai palveluiden tuottajalle.\\n\\nN\u00e4in
  ollen palvelutalon rakentamiskustannuksiin sis\u00e4ltyv\u00e4 arvonlis\u00e4vero
  voidaan v\u00e4hent\u00e4\u00e4, ja arvonlis\u00e4veron palautus kohdistuu t\u00e4ysim\u00e4\u00e4r\u00e4isesti
  asukkailta peritt\u00e4v\u00e4\u00e4n vuokratasoon sit\u00e4 alentaen.\\n\\nRakennukseen
  tulisi yhteens\u00e4 20- 40 asuntoa. Toimitilat soveltuvat erityisesti dementoituvien
  ja fyysisesti toimintarajoitteisten asukkaiden tarpeisiin t\u00e4ytt\u00e4en aluehallintoviraston
  asettamat toimitilavaatimukset. ARA:n tukemassa asuntokannassa vuokranm\u00e4\u00e4rityksess\u00e4
  noudatetaan omakustannusperiaatetta, jonka mukaan asukkailta peritt\u00e4v\u00e4n
  vuokran tulee kattaa korkotukilainalla tuettujen asuntojen ja niihin liittyvien
  tilojen p\u00e4\u00e4omameno- ett\u00e4 yll\u00e4pitokustannukset. N\u00e4in arvonlis\u00e4veron
  palautuksesta saatava hy\u00f6ty tulee kokonaisuudessaan talon asukkaille eik\u00e4
  esim. vuokranantajalle. J\u00e4rjestelyn vaikutuksesta asukaskohtainen vuokra laskee
  selv\u00e4sti alle paikkakuntakohtaisen Kela-rajan.\\n\\nV\u00e4livuokrausmallin
  k\u00e4ytt\u00f6 ei aiheuta ylim\u00e4\u00e4r\u00e4isi\u00e4 kustannuksia kunnalle.
  Kiinteist\u00f6n t\u00e4ytt\u00f6asteriskin poistamisesta sovitaan erillisell\u00e4
  sopimuksella palveluntuottajan ja kunnan v\u00e4lill\u00e4, jonka vakuudeksi palveluntuottaja
  asettaa tarvittaessa pankki- tai emoyhti\u00f6takauksen. Kyseess\u00e4 oleva v\u00e4livuokrausj\u00e4rjestely
  on my\u00f6s milloin tahansa irtisanottavissa. Kunnalle ei synny kustannuksia my\u00f6sk\u00e4\u00e4n
  sellaisessa tilanteessa, jossa nykyinen palveluntuottaja ei tulevaisuudessa menestyisi
  palvelutuotannon tarjouskilpailussa ja palveluntuottaja vaihtuisi\\n\\nP\u00f6yt\u00e4kirjantarkastajat
  nimikirjaimet\\n\\nLautakunta Hallitus\\n\\nValtuusto\\n\\npalvelutalossa. Mainittu
  asia huomioidaan palveluntuottajan ja kunnan v\u00e4lisess\u00e4 sopimuksessa.\\n\\nV\u00e4livuokrausmallin
  k\u00e4ytt\u00f6\u00e4 korkotukilainalla rakennettavissa palveluasuntokohteissa
  kannattaa my\u00f6s ARA, ja se todetaan er\u00e4\u00e4n\u00e4 vaihtoehtona mm. tuoreessa
  Ymp\u00e4rist\u00f6ministeri\u00f6n ty\u00f6ryhm\u00e4n palveluasumisen julkista
  rahoitusta k\u00e4sittelev\u00e4ss\u00e4 raportissa. My\u00f6s Kuntaliiton syksyll\u00e4
  2012 antamassa palveluasumisen hankintaoppaassa v\u00e4livuokraus todetaan keinona
  alentaa asukasvuokria.\\n\\nVastaavanlaista v\u00e4livuokrausmallia Suomessa hy\u00f6dynt\u00e4\u00e4
  jo yli 30 kuntaa, mm. Forssa, H\u00e4meenlinna, Kankaanp\u00e4\u00e4 ja Orivesi.\\n\\nLiitteen\u00e4
  nro 2 Kihni\u00f6n kunnan muistisairaiden vanhusten palveluasumisyksik\u00f6n suunnittelu
  / ty\u00f6ryhm\u00e4n ty\u00f6paperi.\\n\\nLiitteen\u00e4 nro 3 muistisairaiden
  asumispalveluyksik\u00f6n suunnitteluty\u00f6ryhm\u00e4n 3. kokouksen muistio.\\n\\nEsittelij\u00e4
  Ehdotus:\\n\\nKunnanhallitus p\u00e4\u00e4tt\u00e4\u00e4 esitt\u00e4\u00e4 kunnanvaltuustolle,
  ett\u00e4 kunta tai rakennuttaja hakee ARA- rahoitusta  20- 40 paikkaisen asumispalveluyksik\u00f6n
  rakentamiseksi.\\n\\nToteutusmallina on esill\u00e4 ollut ns. v\u00e4livuokraus,
  jossa kiinteist\u00f6sijoitusyhti\u00f6ill\u00e4 olisi mahdollisuus tehd\u00e4 tarjouksia
  kyseisen rakennuksen rakentamisesta kunnan osoittamalle tontille ja kunta sitoutuisi
  v\u00e4livuokraamaan rakennuksen tilat ja joka edelleenvuokraisi tilat lopulliselle
  palveluntuottajalle.\\n\\nMik\u00e4li valittava tontti ei kaavallisesti sovellu
  ko. k\u00e4ytt\u00f6tarkoitukseen kunta aloittaa kaavamuutoksen laatimisen alueelle.\\n\\nKhall
  P\u00e4\u00e4t\u00f6s:\\n\\nKunnanhallitus hyv\u00e4ksyi yksimielisesti esittelij\u00e4n
  p\u00e4\u00e4t\u00f6sehdotuksen.\\n\\n_______________________\\n\\n18 \u00a7\\n\\nKhall
  Ehdotus:\\n\\nKunnanvaltuusto p\u00e4\u00e4tt\u00e4\u00e4, ett\u00e4 kunta tai rakennuttaja
  hakee ARA- rahoitusta 20- 40 paikkaisen asumispalveluyksik\u00f6n rakentamiseksi.\\n\\n|
