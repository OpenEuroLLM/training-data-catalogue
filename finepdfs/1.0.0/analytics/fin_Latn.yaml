  1916.\\n\\nSyksyll\u00e4 samana vuonna valtuusto oli ryhtynyt toteuttamaan paikallishallintoa
  voimassa olevan lain mukaiseksi. Ja se onkin t\u00e4m\u00e4n juhlamme aihe.\\n\\nValtuuston
  ensimm\u00e4inen kokous pidettiin kuitenkin vasta 51 vuotta sen j\u00e4lkeen, kun
  keisarin antama s\u00e4\u00e4d\u00f6s kuntien uudesta paikallishallintolaista oli
  tullut voimaan koko Suomessa vuonna 1865.\\n\\nT\u00e4m\u00e4 on tarina Sodankyl\u00e4n
  paikallishallinnon kehityshistoriasta ja samalla kertomus Lapinmaan omaleimaisuudesta,
  pohjoisten pit\u00e4jien is\u00e4ntien j\u00e4\u00e4r\u00e4p\u00e4isyydest\u00e4
  ja horjumattomasta halusta itse m\u00e4\u00e4r\u00e4t\u00e4, mit\u00e4 t\u00e4\u00e4ll\u00e4
  tapahtuu ja miten t\u00e4\u00e4ll\u00e4 toimitaan.\\n\\nOlen rakentanut t\u00e4m\u00e4n
  kunnallishallinnon kehityshistoriaa esittelev\u00e4n puheenvuoroni niiden kirjallisten
  l\u00e4hteiden ja arkistomateriaalien turvin, jotka kohtuudella ovat olleet saatavilla.\\n\\nSODANKYL\u00c4N
  KUNNAN ALUEELLISEN ITSEHALLINNON KIRJOITETTU JA DOKUMENTOITU HISTORIA ALKAA K\u00c4R\u00c4J\u00c4LAITOKSESTA\\n\\nLapin
  asukkaiden paikallisen itsehallinnon pohjana on ollut se muinaispohjoismainen ajatus
  ja ymm\u00e4rrys, ett\u00e4 vapailla miehill\u00e4 on oikeus ja velvollisuus kokoontua
  k\u00e4r\u00e4jille p\u00e4\u00e4tt\u00e4m\u00e4\u00e4n yhteisist\u00e4 asioista
  ja ett\u00e4 heit\u00e4 koskevia p\u00e4\u00e4t\u00f6ksi\u00e4 ei voitu tehd\u00e4
  heid\u00e4n itsens\u00e4 niit\u00e4 hyv\u00e4ksym\u00e4tt\u00e4.    (Soikkanen 1966,
  s. 9) Jo 1300-luvulla kaupungeissa, kyl\u00e4yhteis\u00f6iss\u00e4 ja pit\u00e4jiss\u00e4
  alueellinen itsehallinto perustui varauksetta k\u00e4sitteisiin: vapaus, itsem\u00e4\u00e4r\u00e4\u00e4misoikeus,
  kansanvaltaisuus.\\n\\nTosin vapaus, tasavertaisuus ja kansanvaltaisuus nykyaikaisessa
  mieless\u00e4 eiv\u00e4t kuitenkaan toteutuneet viel\u00e4 vuosisatoihin.  Yhteiskunta
  saattoi kuitenkin jo varhain olla jollakin tavalla demokraattinen, mutta se oli
  sit\u00e4 vain samanarvoisten ihmisten kesken.\\n\\n1300-luvulla\\n\\nKoska k\u00e4r\u00e4jille
  kokoontuivat vain sukujensa p\u00e4\u00e4miehet, heid\u00e4n kohdallaan toteutui
  keskin\u00e4inen yhdenvertaisuus. Vapaat miehet ja heid\u00e4n mielipiteens\u00e4
  olivat vallan l\u00e4hde. Valtaa k\u00e4ytettiin k\u00e4r\u00e4jill\u00e4 ja siell\u00e4
  toteutui paikallinen itsehallinto.\\n\\nMy\u00f6s seurakuntien yll\u00e4pit\u00e4m\u00e4t
  pit\u00e4j\u00e4nkokoukset alkoivat jo 1300-luvulla toimia joillakin maallisen aluehallinnon
  alueilla. (Soikkanen 1966, s. 9) T\u00e4ll\u00e4 tavalla ja viel\u00e4p\u00e4 hyvin
  j\u00e4rjest\u00e4ytyneesti oli satojen vuosien ajan hoidettu aluehallintoa ja yhteisi\u00e4
  asioita my\u00f6s Lapin kyliss\u00e4, ja t\u00e4\u00e4ll\u00e4, niin kuin muuallakin
  pohjoisessa, olivat p\u00e4\u00e4tt\u00e4jin\u00e4 p\u00e4\u00e4asiallisesti perheiden
  ja sukujen vanhimmat miehet.\\n\\nHyv\u00e4t kuulijat\\n\\nT\u00e4ss\u00e4 yhteydess\u00e4
  en erikseen k\u00e4sittele sukujen ja kylien erilaisia toimintamuotoja saamelaisyhteis\u00f6iss\u00e4.  Sen
  esityksen vuoro tulee joskus my\u00f6hemmin.\\n\\n1500-luvulla\\n\\nSek\u00e4 hallitsijan
  valta ett\u00e4 kirkollinen valta alkoivat ty\u00f6nty\u00e4 kyl\u00e4n miesten
  paikallisen itsehallinnon alueelle, ja hallitsijan mielipide muuttui   hallintoa
  koskevaksi laiksi. Se ei v\u00e4ltt\u00e4m\u00e4tt\u00e4 ollut is\u00e4ntien mieleen.
  Mutta onneksi\\n\\npaikallinen itsehallinto pystyi muuttuneissakin olosuhteissa
  s\u00e4ilytt\u00e4m\u00e4\u00e4n ja kehitt\u00e4m\u00e4\u00e4n is\u00e4ntien vahvaa
  asemaa   itsen\u00e4isin\u00e4 p\u00e4\u00e4t\u00f6ksentekij\u00f6in\u00e4 kotipit\u00e4jiss\u00e4\u00e4n.
  (Soikkanen 1966, s. 9) Merkitt\u00e4v\u00e4 syy paikallisen itsehallinnon edelleen
  vahvistumiseen oli se historiallinen tosiseikka, ett\u00e4 alueellinen itsehallinto
  oli syntynyt kyl\u00e4yhteis\u00f6jen omasta tahdosta \u2013 ei mahtik\u00e4skyst\u00e4.\\n\\nPIT\u00c4J\u00c4NKOKOUKSET\\n\\n1500-1600-luvuilla
  Ruotsin valtakunnassa k\u00e4r\u00e4j\u00e4toiminnan rinnalla toimivat pit\u00e4j\u00e4nkokoukset
  aluehallinnon p\u00e4\u00e4asiallisina edustajina. Neh\u00e4n oli luotu kirkollisen
  vallan toimesta jo 1300-luvulla, mutta 1500-luvulla is\u00e4ntien hallitsema k\u00e4r\u00e4j\u00e4laitos
  alkoi sulautua l\u00e4hes koko maassa pit\u00e4j\u00e4nkokouksiin.\\n\\nSeurakuntien
  piiriss\u00e4 oli tuolloin her\u00e4nnyt halu osallistua entist\u00e4 n\u00e4kyv\u00e4mmin
  aluehallinnolliseen p\u00e4\u00e4t\u00f6ksentekoon. Valtionhallinnon kannalta j\u00e4rjestelm\u00e4
  oli valmis ja toimiva, eik\u00e4 pit\u00e4jiss\u00e4k\u00e4\u00e4n sit\u00e4 vastustettu.
  Papistohan nautti jo valmiiksi seurakuntalaisten kunnioitusta ja arvostusta. Niinp\u00e4
  pit\u00e4j\u00e4nkokouksien asemaa vahvistettiin entisest\u00e4\u00e4n Ruotsin koko
  maata koskevalla lailla v. 1634 seuraavasti:\\n\\n\\\"Niin pit\u00e4\u00e4 my\u00f6s
  Papeilla kaupungeissa ja maalla olla valta pit\u00e4\u00e4 pit\u00e4j\u00e4nkokouksia
  niiden neuvosta, jotka sen voivat vaatia (maata omistavat vapaat talonpojat) ja
  aina kun seurakunnan oma tarve sit\u00e4 vaatii (kuitenkin v\u00e4hint\u00e4\u00e4n
  kaksi kertaa vuodessa)\\\"\\n\\nN\u00e4in seurakuntien yll\u00e4pit\u00e4mist\u00e4
  pit\u00e4j\u00e4nkokouksista kehittyi valtakunnan t\u00e4rkein aluehallinnon p\u00e4\u00e4t\u00f6ksentekij\u00e4,
  ja is\u00e4ntien hallitsema k\u00e4r\u00e4j\u00e4laitos sulautui pit\u00e4j\u00e4nkokouksiin.
  T\u00e4m\u00e4 uusi kokousk\u00e4yt\u00e4nt\u00f6 erosi kuitenkin k\u00e4r\u00e4jist\u00e4
  siin\u00e4, ett\u00e4 pit\u00e4j\u00e4nkokouksiin   saivat osallistua kaikki pit\u00e4j\u00e4n
  veroa maksavat miehet \u2013 eiv\u00e4tk\u00e4 ainoastaan tilojen is\u00e4nn\u00e4t.
  Kuitenkin edelleen tilojen koko m\u00e4\u00e4r\u00e4si kullakin is\u00e4nn\u00e4ll\u00e4
  k\u00e4yt\u00f6ss\u00e4 olevan \u00e4\u00e4nivallan m\u00e4\u00e4r\u00e4n.\\n\\nN\u00e4in
  muualla\u2026 mutta Lapissa k\u00e4yt\u00e4nt\u00f6 oli toinen.\\n\\nT\u00e4\u00e4ll\u00e4
  vanha k\u00e4r\u00e4j\u00e4laitos is\u00e4ntineen pysyi uudesta laista huolimatta
  vakaasti paikallishallinnon ylimp\u00e4n\u00e4 p\u00e4\u00e4tt\u00e4v\u00e4n\u00e4
  elimen\u00e4 viel\u00e4 yli 100 vuotta! Niinp\u00e4 toisin kuin muualla maassa,
  kirkkoherrat eiv\u00e4t Sodankyl\u00e4ss\u00e4 olleet aluehallinnon ensisijaisia
  edustajia ja toimeenpanijoita.\\n\\nJo tuohon aikaan Lapin is\u00e4ntien toiminta
  vahvisti ennest\u00e4\u00e4n hyvin laajalti tunnettua kuvaa Lapin asukkaiden omaleimaisuudesta,
  mutta my\u00f6s omavaltaisuudesta ja haluttomuudesta muuttaa aluehallintoa koskevaa\\n\\np\u00e4\u00e4t\u00f6ksentekovaltaa
  pit\u00e4jiss\u00e4\u00e4n. Sellainen mielikuva meist\u00e4 Lapin asukkaista taisi
  s\u00e4ily\u00e4 valtakunnan monissa piireiss\u00e4 viel\u00e4 useita satoja vuosia.\\n\\nSuomessa
  ja varsinkin Lapin kyliss\u00e4 on alueellisen hallinnon periaatteena ollut talonpoikaisuuteen
  vahvasti pit\u00e4ytyv\u00e4 asenne, jossa p\u00e4\u00e4llimm\u00e4iseksi oli noussut
  \\\"itse hallitseminen\\\" eik\u00e4 niink\u00e4\u00e4n itsehallinto. Syyn\u00e4
  oli p\u00e4\u00e4asiassa pelko verorasitusten kasvamisesta sellaisessa tilanteessa,
  jossa valtion hallinto alkaa ohjailla aluehallinnon toimintaa.  (Heuru 2001, s.
  13) Eik\u00e4 t\u00e4m\u00e4 pelko ollut mitenk\u00e4\u00e4n aiheeton.  Ei se taida
  olla sit\u00e4 t\u00e4n\u00e4 p\u00e4iv\u00e4n\u00e4k\u00e4\u00e4n. Erikoisesti
  juuri Sodankyl\u00e4n is\u00e4nn\u00e4t olivat uudistusten sitkeimpi\u00e4 vastustajia.
  Heid\u00e4n mielest\u00e4\u00e4n:\\n\\n\\\"Lapissa tehd\u00e4\u00e4n niin kuin ennenkin
  on tehty\\\".\\n\\n(Soikkanen 1966, s. 20-21)\\n\\nNiinp\u00e4 Sodankyl\u00e4n ensimm\u00e4inen
  pit\u00e4j\u00e4nkokous pidettiinkin vasta vuonna 1764, siis 130 vuotta lain voimaantulon
  j\u00e4lkeen.\\n\\n(Onnela 2006, s. 383)\\n\\n(Soikkanen 1966, s. 26)\\n\\nKuitenkin
  voidaan kohtuudella sanoa, ett\u00e4 vuonna 1764 alettiin Sodankyl\u00e4ss\u00e4
  kehitt\u00e4\u00e4 my\u00f6s uudenlaista pit\u00e4j\u00e4n itsehallintoa, joka edelsi
  modernin kunnallisen aluehallinnon tuloa seuraavilla vuosisadoilla. Tuolloin jo
  asiakirjoissa esiintyv\u00e4t ne vanhojen sodankyl\u00e4l\u00e4isten sukujen nimet,
  jotka pitk\u00e4lle 1900-luvulle s\u00e4ilyv\u00e4t kokousp\u00f6yt\u00e4kirjoissa,
  luottamusmiesluetteloissa ja hallintorekistereiss\u00e4.\\n\\nSODANKYL\u00c4N ENSIMM\u00c4INEN
  PIT\u00c4J\u00c4NKOKOUS 18.11.1764\\n\\nKokouksen johti kirkkoherra Nicolaus Fellman.
  J\u00e4senet olivat pit\u00e4j\u00e4n vanhimmat ja kuudennusmiehet:\\n\\nOlli Kairavuopio\\n\\nOlli
  Jeesi\u00f6\\n\\nLauri Ollinpoika Tepsa\\n\\nMatti Hannunpoika Aska\\n\\nJuho Tepsa\\n\\nErkki
  Pumpanen\\n\\nMatti Sassali\\n\\nAntti Hannunpoika Musta\\n\\nSompion lapinmies
  Olli Hannunpoika Musta\\n\\nKirkkov\u00e4\u00e4rti Olli Ollinpoika Tepsa\\n\\nmukana
  \\\"rahvasta\\\" menige allmogen\\n\\n(Onnela 2006, s. 385)\\n\\nVuonna 1764 Sodankyl\u00e4n
  aluehallinnossa noudatettiin Ruotsin valtion lakeja.\\n\\nVALTIOP\u00c4IV\u00c4MIES
  MATTI RIIPI\\n\\nYksi tuon aikakauden merkitt\u00e4vimmist\u00e4 p\u00e4\u00e4t\u00f6ksist\u00e4
  Lapin tulevaisuuden kannalta oli se, kuka valittiin edustamaan Lapin pit\u00e4ji\u00e4
  Ruotsin valtiop\u00e4ivill\u00e4 Tukholmassa \u2013 vai valittiinko ket\u00e4\u00e4n!
  T\u00e4m\u00e4n asian p\u00e4\u00e4ttiv\u00e4t pit\u00e4j\u00e4nkokoukset.\\n\\nLapin
  tuomiokunnan edustaja tiedustelikin Lapinkylien is\u00e4nnilt\u00e4, halusivatko
  n\u00e4m\u00e4 l\u00e4hett\u00e4\u00e4 edustajan Tukholmaan, vuoden 1760 valtiop\u00e4iville.\\n\\nK\u00e4r\u00e4jien
  is\u00e4nn\u00e4t vastasivat:\\n\\nKittil\u00e4 ei halunnut edustajaa.\\n\\nUtsjoen
  asukkailla ei katsottu olevan varaa edustajaan.\\n\\nEnonteki\u00f6 kielt\u00e4ytyi
  valinnasta.\\n\\nSompion-Keminkyl\u00e4n k\u00e4r\u00e4j\u00e4t ilmoitti ehdokkaakseen
  uustilallisen,\\n\\nMatti Paavalinpoika Riipin Sodankyl\u00e4st\u00e4, h\u00e4nt\u00e4
  kannattivat my\u00f6s inarilaiset.\\n\\nMatti Paavalinpoika Riipi toimi Lapinmaan
  talonpoikaiss\u00e4\u00e4dyn edustajana Ruotsin valtiop\u00e4ivill\u00e4 6 vuotta.
  H\u00e4nen edustajakautensa ei kuitenkaan ollut Lapin is\u00e4ntien mieleen, siit\u00e4
  huolimatta, ett\u00e4 Matti Riipi itse oli saanut hoitaakseen arvovaltaisia teht\u00e4vi\u00e4
  toimiessaan Lapin aktiivisena ja luotettavana edustajana Tukholman valtiop\u00e4ivill\u00e4.
  Niinp\u00e4 Riipin valtiop\u00e4iv\u00e4miesura p\u00e4\u00e4ttyi riitaisesti vuonna
  1766, eik\u00e4 h\u00e4nen ty\u00f6lleen valittu jatkajaa.\\n\\nViel\u00e4 1800-luvullakaan
  Lapin pit\u00e4jien is\u00e4nn\u00e4t eiv\u00e4t pit\u00e4neet valtiop\u00e4ivi\u00e4
  lainkaan tarpeellisina, eik\u00e4 valtiop\u00e4iv\u00e4miesten l\u00e4hett\u00e4mist\u00e4
  nyt Helsinkiin n\u00e4hty muuna kuin joutavanp\u00e4iv\u00e4isen\u00e4 rahanmenona.
  Niinp\u00e4 Lapin seuraava valtiop\u00e4iv\u00e4mies, Yrj\u00f6 Halonen Enonteki\u00f6lt\u00e4,
  valittiin teht\u00e4v\u00e4\u00e4n vasta vuonna 1897, siis 131 vuotta sen j\u00e4lkeen,
  kun Matti Riipi oli luopunut omasta teht\u00e4v\u00e4st\u00e4\u00e4n Lapinmaan valtiop\u00e4iv\u00e4edustajana.\\n\\nMoni
  asia oli nyt aivan toisin kuin Riipin aikaan. Suomi oli Ven\u00e4j\u00e4n suuriruhtinaskunta
  ja meill\u00e4 oli oma senaatti. (Onnela 2006, s. 397)\\n\\nLapinmaan is\u00e4ntien
  j\u00e4\u00e4r\u00e4p\u00e4isyyden seurauksena meniv\u00e4t meilt\u00e4 lappilaisilta
  \\\"sivu suun\\\" vuoden 1863 hyvin t\u00e4rke\u00e4t Helsingin valtiop\u00e4iv\u00e4t,
  jossa uudesta aluehallintolaista annettiin keisarillinen esitys.  T\u00e4m\u00e4
  on Lapin poliittisessa historiassa sellainen asia, ett\u00e4 sit\u00e4  ei kannata
  sivuuttaa nytk\u00e4\u00e4n, kun pohditaan Lapinkylien  asemaa ja kehityst\u00e4  sek\u00e4
  Ven\u00e4j\u00e4n vallan aikana  ett\u00e4 Suomen itsen\u00e4isyyden aikana  my\u00f6hemminkin.
  Kysymysh\u00e4n on imagosta, eli siit\u00e4, millainen mielikuva meist\u00e4 Lapin
  asukkaista poliittisina toimijoina ja valtakunnan hallinnon yhteisty\u00f6kumppaneina
  noihin aikoihin muualla Suomessa syntyi. Mutta asiasta ei liene tarpeen nyt t\u00e4ss\u00e4
  yhteydess\u00e4 en\u00e4\u00e4 enemp\u00e4\u00e4 muistuttaa. Sitten vain takaisin
  Sodankyl\u00e4n paikallishallinnon historiaan.\\n\\nSodankyl\u00e4n kirkkoherrojen
  johtamien pit\u00e4j\u00e4nkokousten p\u00f6yt\u00e4kirjoja 1700- ja 1800-luvuilta
  on s\u00e4ilynyt hyvin. Niist\u00e4 l\u00f6ytyv\u00e4t p\u00e4\u00e4t\u00f6kset
  ESIM seuraavista asioista:\\n\\n1. k\u00f6yh\u00e4in- ja sairaanhoito,\\n2. irtolaisuuden
  ja siveellisyyden valvonta,\\n3. pit\u00e4j\u00e4n hallinnollisen rakenteen yll\u00e4pito
  ja hoito\\n4. toimihenkil\u00f6iden ja luottamusmiesten valinta, p\u00e4tevyys,
  sopivuus ja palkkaus,\\n5. sek\u00e4 esimerkiksi kansakoulun perustamisaikeet vuonna
  1858 annetun kansakoululain mukaisesti.\\n\\nPit\u00e4j\u00e4nkokoukset hoitivat
  nyt p\u00e4\u00e4asiassa \\\"maallisia\\\" asioita. T\u00e4st\u00e4 syyst\u00e4
  kokouksiin osallistuminen alkoikin papiston mielest\u00e4 h\u00e4irit\u00e4 kohtuuttomasti
  heille varsinaisesti kuuluvien kirkollisten asioiden hoitoa. 1800-luvun alussa,
  kun pit\u00e4j\u00e4nkokouksia koskeva laki oli ollut voimassa noin 150 vuotta,
  papisto esitti omasta toivomuksestaan halun luopua Sodankyl\u00e4n aluehallinnollisista
  teht\u00e4vist\u00e4. Ja n\u00e4in tapahtuikin.\\n\\nHelsingin valtiop\u00e4ivill\u00e4
  v. 1863 keisarin esityksen\u00e4 annettu uusi kunnallishallintolaki tuli lainvoimaiseksi
  koko Suomessa v. 1865.\\n\\n(Soikkanen 1966, s. 89) Uuden asetuksen p\u00e4\u00e4tavoitteena
  oli kunnan ja seurakunnan erottaminen toisistaan sek\u00e4 seurakuntaa vastaavan
  maallisen yhteis\u00f6n ja aluehallinnon luominen.\\n\\nKokouksien nimet muuttuivat:
  pit\u00e4j\u00e4nkokoukset lakkautettiin, tilalle m\u00e4\u00e4r\u00e4ttiin kuntakokoukset
  ja kunnallislautakunnat. Pit\u00e4jill\u00e4 oli vain kolme vuotta aikaa siirty\u00e4
  uuteen kunnallishallintoon.  N\u00e4in kaikkialla muualla paitsi tietysti taas Lapissa,
  jossa siirtym\u00e4aika aluksi m\u00e4\u00e4r\u00e4ttiin noin kymmeneksi vuodeksi,
  kuitenkin niin, ett\u00e4 pit\u00e4jill\u00e4 oli oikeus itse valita sopivin hetki
  uuteen hallintoj\u00e4rjestelm\u00e4\u00e4n siirtymiseen. T\u00e4llaisen my\u00f6nnytyksen
  uskottiin olevan osoitus siit\u00e4, ett\u00e4 valtiovalta halusi kunnioittaa Lapinmaan
  is\u00e4ntien alueellista itsem\u00e4\u00e4r\u00e4\u00e4misoikeutta.\\n\\nKUNTAKOKOUS
  UUDEN LAIN MUKAAN\\n\\nKuntakokous k\u00e4ytti kunnassa ylint\u00e4 p\u00e4\u00e4t\u00f6svaltaa
  niin kuin nyky\u00e4\u00e4n kunnanvaltuusto. Mutta toisin kuin pit\u00e4j\u00e4nkokouksiin,
  nyt kuntakokouksiin saivat osallistua puhe- ja \u00e4\u00e4nivaltaisina kaikki verovelvolliset
  kuntalaiset, my\u00f6s veroa maksavat yhteis\u00f6t. \u00c4\u00e4nest\u00e4jien
  \u00e4\u00e4nivallan vahvuus m\u00e4\u00e4r\u00e4ytyi kuitenkin edelleen maanomistuksen
  ja verom\u00e4\u00e4r\u00e4n perusteella.\\n\\nVaikka t\u00e4t\u00e4 erikoista \u00e4\u00e4nivaltaa
  vuosien varrella supistettiinkin, oli Lapissa toimivilla mets\u00e4yhti\u00f6ill\u00e4
  melkoinen p\u00e4\u00e4t\u00f6svalta kuntakokouksissa. T\u00e4m\u00e4 osa kunnallislakia
  muuttui nykyisen kaltaiseksi v. 1917. P\u00e4\u00e4t\u00f6ksi\u00e4 valmisteleva
  ja toimeenpaneva elin oli tuolloin kunnallislautakunta, joka toimi niin kuin nykyinen
  kunnanhallitus lautakuntineen.\\n\\nLapissa lupa uuden hallintoj\u00e4rjestelm\u00e4n
  k\u00e4ytt\u00f6\u00f6notosta omaan tahtiin sai aikaan sen, ett\u00e4 p\u00e4\u00e4t\u00f6st\u00e4
  siirrettiin ja venytettiin hamaan tulevaisuuteen. N\u00e4in Sodankyl\u00e4ss\u00e4
  alkoi 51 vuotta kest\u00e4nyt sitke\u00e4 taistelu uuteen kunnallishallintoon siirtymist\u00e4
  vastaan.  (Onnela 2006, s. 397)\\n\\nKun sodankyl\u00e4l\u00e4isilt\u00e4 kysyttiin,
  \\\"josko seurakunnan miehet tahtovat kunnallishallitusta, niin siihen vastattiin,
  ettei sit\u00e4 tahdota \u2026\\\"\\n\\n(Onnela 2006, s. 399) Asiaa k\u00e4siteltiin
  seuraavina vuosina pit\u00e4j\u00e4nkokouksissa sek\u00e4 sodankyl\u00e4l\u00e4isten
  omasta aloitteesta ett\u00e4 kuvern\u00f6\u00f6rin k\u00e4skyst\u00e4.\\n\\nKokousten
  p\u00e4\u00e4t\u00f6ksist\u00e4 valitettiin s\u00e4\u00e4nn\u00f6llisesti. Viel\u00e4
  vuoden 1892 alussa sodankyl\u00e4l\u00e4iset kielt\u00e4ytyiv\u00e4t hallinnonuudistuksesta
  monin sek\u00e4 todellisin syin ett\u00e4 keksityin verukkein. Er\u00e4skin kokous
  todettiin laittomaksi, koska \\\"l\u00f6ys\u00e4l\u00e4iset ja irtolaisetkin\\\"
  olivat saaneet \u00e4\u00e4nest\u00e4\u00e4 ja poissaolevien puolesta oli \u00e4\u00e4nestetty
  ilman valtakirjoja.\\n\\n(Onnela 2006, s. 400)\\n\\nMutta viimein 9.5.1892 kuvern\u00f6\u00f6ri
  Oulusta l\u00e4hetti Sodankyl\u00e4\u00e4n vihaisen uhkauskirjeen:\\n\\n\\\"Koska
  Sodankyl\u00e4n pit\u00e4j\u00e4 on suurin Lapinmaan pit\u00e4jist\u00e4 ja ainoa
  niist\u00e4, jossa ei viel\u00e4 ole kunnallishallitusta, l\u00e4hetet\u00e4\u00e4n
  n\u00e4m\u00e4 asiakirjat (kunnan miesten, is\u00e4ntien kielteinen p\u00e4\u00e4t\u00f6s)
  takaisin Sodankyl\u00e4n pit\u00e4j\u00e4n kirkkoherralle, joka ensi tulevan Juhannuksen
  ajaksi kuuluttakoon uuden pit\u00e4j\u00e4nkokouksen kunnallishallituksen toimeenpanemisesta,
  tullen kirkkoherra aikanaan t\u00e4nne l\u00e4hett\u00e4m\u00e4\u00e4n mainitussa
  kokouksessa pidetty p\u00f6yt\u00e4kirja ja samalla palauttakoon t\u00e4m\u00e4n
  l\u00e4hetteen.\\\" (Onnela 2006, s. 401)\\n\\nSodankyl\u00e4 ja Kuolaj\u00e4rvi
  olivat Suomessa viimeinen pit\u00e4j\u00e4, joissa uutta kunnallislakia ei tuolloin
  viel\u00e4 noudatettu.\\n\\nKuvern\u00f6\u00f6rin uhkauskirjeen mukaisesti kirkkoherra
  Rechardin johtamassa pit\u00e4j\u00e4nkokouksessa 24.6. 1892 Sodankyl\u00e4ss\u00e4
  p\u00e4\u00e4tettiin n\u00f6yr\u00e4sti siirty\u00e4 kuntakokouksen ja kunnallislautakunnan
  j\u00e4rjestelm\u00e4\u00e4n. Sodankyl\u00e4n ensimm\u00e4isen kuntakokouksen puheenjohtajaksi
  valittiin talokas Olli Hietanen sek\u00e4 kunnallislautakunnan esimieheksi J.G.
  Matlein. Samalla valittiin j\u00e4senet ensimm\u00e4iseen kunnallislautakuntaan.\\n\\nSodankyl\u00e4n
  ensimm\u00e4isen kunnallislautakunnan j\u00e4senet olivat\\n\\nJ.G. Matlein, kunnallislautakunnan
  esimies Matti Onnela, varaesimies\\n\\nJ\u00e4senet:\\n\\nSimuna Metti\u00e4inen\\n\\nAkseli
  Autio\\n\\nOskari Mikkola\\n\\nAleksi Moskuvaara\\n\\nJuho Savukoski\\n\\nHenrik
  Torvinen Fredrik Syv\u00e4j\u00e4rvi Henrik Torvinen Fredrik Syv\u00e4j\u00e4rvi
  Varalle: Pekka Paarman Matti Penius Janne Onnela Juho Sattaskangas\\n\\nMerkitt\u00e4v\u00e4\u00e4
  oli, ett\u00e4 Sodankyl\u00e4n   kunnallislautakunnassa oli vuosina 1897 \u2013
  1898 kolme naista:\\n\\nMaria Mellenius\\n\\nStina Posti\\n\\nAnna Gustava Anneberg
  eli Lauri\\n\\nMutta viel\u00e4k\u00e4\u00e4n is\u00e4nn\u00e4t eiv\u00e4t suostuneet
  valitsemaan varsinaista kunnanvaltuustoa! (Onnela 2006, s. 404) Sen valitsemisesta
  ei p\u00e4\u00e4sty yksimielisyyteen. T\u00e4rke\u00e4 syy lienee ollut pelko siit\u00e4,
  ett\u00e4 kunnanvaltuustossa ehk\u00e4 sittenkin tulisi vallitsemaan mies ja \u00e4\u00e4ni
  -periaate. N\u00e4in oli Sodankyl\u00e4ss\u00e4 kuitenkin l\u00e4hdetty liikkeelle
  kohti kokonaan uutta kunnallishallintoa. Mutta matka kuntakokouksesta kunnanvaltuustoon
  kesti Sodankyl\u00e4ss\u00e4 kuitenkin viel\u00e4 22 vuotta.\\n\\nVuodelta 1911
  on s\u00e4ilynyt er\u00e4s hyvin kuvaava esimerkki siit\u00e4, kuinka ep\u00e4toivoisestikin
  t\u00e4\u00e4ll\u00e4 vastustettiin kunnanvaltuuston valintaa. Er\u00e4skin kuntalainen
  l\u00e4hetti Ouluun kuvern\u00f6\u00f6rille kirjeen, jossa h\u00e4n totesi   27.11.
  1910 pidetyn kuntakokouksen laittomaksi. Kokous oli kutsuttu pidett\u00e4v\u00e4ksi
  Sodankyl\u00e4n kunnan tuvalla, mutta se pidettiinkin Korvan talossa, koska t\u00e4m\u00e4
  kunnan kokoustupa oli palanut kokouskutsun l\u00e4hett\u00e4misen j\u00e4lkeen,
  mutta kuitenkin ennen kokousp\u00e4iv\u00e4\u00e4. Valittajan mielest\u00e4 kokouksen
  p\u00e4\u00e4t\u00f6kset eiv\u00e4t n\u00e4in olleet lainvoimaisia, koska kokouspaikka
  ei ollut kokouskutsun mukainen.\\n\\nKuvern\u00f6\u00f6ri Oulussa tuskin suhtautui
  valitukseen kovin vakavasti. Sen sijaan tulipalot saattavat hyvinkin selitt\u00e4\u00e4
  sen, ett\u00e4 noista Sodankyl\u00e4n kuntakokouksista ei ole juurikaan s\u00e4ilynyt
  p\u00f6yt\u00e4kirjoja tai muita yksityiskohtaisia dokumentteja ennen vuotta 1915.\\n\\n4.
  LOPULTAKIN KUNNANVALTUUSTO!\\n\\n27.12.1915 kuntakokous p\u00e4\u00e4tti viimein
  ryhty\u00e4 toimenpiteisiin kunnanvaltuuston valitsemiseksi ja maaliskuun 27. p\u00e4iv\u00e4n\u00e4
  1916 valittiin Sodankyl\u00e4n ensimm\u00e4isen kunnanvaltuuston 18 j\u00e4sent\u00e4:\\n\\nty\u00f6mies
  Juuso Karjalainen\\n\\ntalokas Iivari Oja\\n\\ntalokas Benjamin Annaberg,\\n\\ntalokas
  Aleksanteri Takala\\n\\nmets\u00e4nhoitaja Aarne Snellman\\n\\ntalokas Reeti Marttiini\\n\\nkauppias
  Heikki Ilmari Mannermaa\\n\\nvuokraaja Arvid Seip\u00e4j\u00e4rvi\\n\\ntalokas Samu
  Tervo\\n\\ntalollinen Juho Onnela\\n\\ntalokas Robert Kujala\\n\\ntalokas Reeti
  Rantala\\n\\ntalokas Sanfrid Hihnavaara talokas Robert Keskitalo talokas Kalle Peuraniemi\\n\\nvuokraaja
  Juho Kalle Vikev\u00e4korva talollinen Aksel Aleksanteri Autio\\n\\nSanoilla talollinen
  ja talokas ei kieless\u00e4mme ole sis\u00e4lt\u00f6- tai merkityseroa, mutta joissakin
  yhteyksiss\u00e4 olen voinut todeta sanan talollinen tarkoittaneen vanhan kantatilan
  is\u00e4nt\u00e4\u00e4 ja talokas-sana, joka johdoksena on kieless\u00e4mme talollinensanaa
  nuorempi, lienee tarkoittanut uudistalon is\u00e4nt\u00e4\u00e4. N\u00e4m\u00e4
  nimityserot ja muut samankaltaiset seikat ovat saattaneet jonkin aikaa aiheuttaa
  erimielisyyksi\u00e4 kunnallisiin luottamusteht\u00e4viin valittujen vaalikelpoisuudesta.\\n\\nValtuuston
  ensimm\u00e4isist\u00e4 vaaleista tehtiin Ouluun kuvern\u00f6\u00f6rille j\u00e4lleen
  useita valituksia vanhan sodankyl\u00e4l\u00e4isen tavan mukaan. Valituksi oli tullut
  sellaisia henkil\u00f6it\u00e4, jotka virkamiesteht\u00e4viens\u00e4 vuoksi eiv\u00e4t
  olleet lainkaan vaalikelpoisia, tai valituksi oli tullut vain talonpoikia, joten
  valtuuston kokoonpano ei edustanut kaikkia sodankyl\u00e4l\u00e4isi\u00e4.\\n\\nValituksista
  huolimatta ensimm\u00e4inen valtuuston kokous pidettiin 20. 6. 1916. Puheenjohtajana
  toimi kauppias Heikki Ilmari Mannermaa. Kuvern\u00f6\u00f6rin vastasi syksyll\u00e4
  valituksiin (18.8. 1916).\\n\\nNelj\u00e4n jo valitun tilalle jouduttiin valitsemaan
  seuraavat uudet valtuutetut.\\n\\nlukkari August Mellenius mets\u00e4nhoitaja Paavo
  Pelttari pientilallinen Edvard Araj\u00e4rvi talokas Juho Ollinpoika Keskitalo\\n\\nEnsimm\u00e4isen
  valtuuston ensimm\u00e4isi\u00e4 teht\u00e4vi\u00e4 olivat mm. seuraavat asiat:\\n\\nMist\u00e4
  saadaan rahat kunnan teht\u00e4vien hoitoon?\\n\\nMit\u00e4 on teht\u00e4v\u00e4,
  kun ei viel\u00e4 ole saatu tili\u00e4 kunnan raha-asioiden hoidosta vuodelta 1915?\\n\\nMiten
  j\u00e4rjestet\u00e4\u00e4n Torvisen kansakoulun k\u00e4yt\u00e4nt\u00f6\u00f6n
  pano?\\n\\nMiten suoritetaan virkamiesten ja erityisesti kunnankirjurin viran perustaminen,
  valinta ja palkkaus?\\n\\nTohtori Samuli Onnelaa teksti\u00e4 lainaten voitaneen
  todeta, ett\u00e4 \\\"Normaali kunnallisel\u00e4m\u00e4 oli alkanut Sodankyl\u00e4ss\u00e4
  (v.1916).\\\"\\n\\nSamaan aikaan, kun Sodankyl\u00e4n kunnanvaltuusto jo toimi,
  istui viel\u00e4 edellisen lain mukainen kuntakokous vuoden 1918 alkupuolelle asti.
  Viimeisen kerran kaikki Suur-Sodankyl\u00e4n edustajat kokoontuivat yhteiseen kuntakokouksessa
  marraskuun 18. p\u00e4iv\u00e4n\u00e4 vuonna 1917. Edellisen\u00e4 vuonna (1916)
  keisarillisen senaatin oli tehnyt p\u00e4\u00e4t\u00f6ksen   erottaa Savukoski ja
  Pelkosenniemi omiksi kunnikseen. Tuosta marraskuisesta kokouksesta tohtori Samuli
  Onnela on SuurSodankyl\u00e4n historia   \u2013teoksessaan maininnut seuraavaa:\\n\\n\\\"Viimeinen
  yhteinen paikallista itsehallintoa edustanut kokous oli sopuisa; yhteiset kunnalliset
  ja paikkakunnalliset riidat oli jo riidelty ja Suur-Sodankyl\u00e4n jakamisestakin
  oli lopullinen p\u00e4\u00e4t\u00f6s tehty kaukana Kemin Lapin syd\u00e4mest\u00e4.
  \\\"\\n\\n(Onnela 2006, s. 412)\\n\\nSuur-Sodankyl\u00e4st\u00e4 oli muodostunut
  3 itsen\u00e4ist\u00e4 kuntaa.\\n\\nOn tosin kuultu, ett\u00e4 Savukoski ja Pelkosenniemi
  ovat nyt 100 vuotta my\u00f6hemmin suunnittelemassa j\u00e4lleen yhdistymist\u00e4
  - ja ilman Sodankyl\u00e4\u00e4. 100 vuotta tuntuu siis edelleenkin olevan sopivan
  mittainen aika asioiden suunnitteluun ja muutoksen toteuttamiseen Lapin kunnissa.\\n\\nKuntien
  itsehallinto vahvistettiin vuonna 1919 itsen\u00e4isen Suomen hallitusmuodossa.
  Siihen on kirjattu kunnallisen itsehallinnon muoto ja perustuslain suojaa koskeva
  s\u00e4\u00e4d\u00f6s. T\u00e4m\u00e4 s\u00e4\u00e4d\u00f6s oli er\u00e4s niist\u00e4,
  joista silloin t\u00e4ll\u00f6in on jouduttu keskustelemaan. Onhan toki Suomenkin
  kokoisen valtion aluehallinnoissa kysymyksi\u00e4, jotka eri alueilla vaativat erilaisia
  ratkaisuja - Lappi erityisesti on juuri t\u00e4llainen, erilainen ja sen ovat entiset
  is\u00e4nn\u00e4t hyvin tienneet.\\n\\nLopullinen siirtyminen itsen\u00e4isen Suomen
  hallitusmuodon mukaiseen kunnallishallintoon tapahtui Sodankyl\u00e4ss\u00e4 vasta
  vuonna 1949, kun\\n\\nkunnallislautakunnan toiminta lakkautettiin ja tammikuussa
  10.1.1949 kokoontui Sodankyl\u00e4n ensimm\u00e4inen kunnanhallitus puheenjohtajanaan
  Akseli Paarman.\\n\\nUuden aluehallinnon mukaisessa j\u00e4rjestelm\u00e4ss\u00e4k\u00e4\u00e4n
  Sodankyl\u00e4\u00e4n ei kuitenkaan viel\u00e4 haluttu palkata kuntaan kunnanjohtajaa.
  T\u00e4m\u00e4kin p\u00e4\u00e4t\u00f6s oli suoraan samassa linjassa Sodankyl\u00e4n
  is\u00e4ntien vuosisataisten periaatteiden kanssa: he halusivat itse valvoen s\u00e4ilytt\u00e4\u00e4
  aluehallinnollisen itsen\u00e4isyyden ja itsem\u00e4\u00e4r\u00e4\u00e4misoikeuden
  omissa k\u00e4siss\u00e4.\\n\\nVieraita miehi\u00e4 ei tarvita!\\n\\nAjatus ei ole
  mitenk\u00e4\u00e4n poikkeuksellinen, vanhanaikainen tai edes itsek\u00e4s \u2013
  se on pikemmin moderni. Sill\u00e4 t\u00e4n\u00e4 p\u00e4iv\u00e4n\u00e4kin k\u00e4yd\u00e4\u00e4n
  politiikan tutkimuksessa ja lakien laadinnassa niin filosofian kuin k\u00e4yt\u00e4nn\u00f6nkin
  tasolla keskustelua siit\u00e4, tulisiko aluehallintoa kehitt\u00e4\u00e4 mieluummin
  omaper\u00e4isen itse hallitsemisen kuin yleisluontoisen itsehallinnon suuntaan
  perustuslakia ja hallitusmuotoa loukkaamatta. Aika n\u00e4ytt\u00e4\u00e4! Edelleenkin
  t\u00e4m\u00e4 asia on Suomessa hallintolains\u00e4\u00e4d\u00e4nn\u00f6n ehk\u00e4p\u00e4
  kiperimpi\u00e4 kysymyksi\u00e4.\\n\\n1900-luvulla ja viel\u00e4 korostuneemmin
  nyt 2000-luvulla aluehallintolakeja on alettu uudistaa ja t\u00e4ydent\u00e4\u00e4
  sit\u00e4 mukaa kuin yhteiskunnan kehitys ja tapahtuneet muutokset ovat vaatineet
  tai antaneet muutokseen aiheen tai osoittaneet siihen syyn.\\n\\nErilaiset ja jopa
  kesken\u00e4\u00e4n vastakkaiset n\u00e4kemykset kuuluvat yhteiskunnalliseen kehityskeskusteluun
  ja uuden luomiseen, niin kuin Sodankyl\u00e4nkin kunnallisen hallintokehityksen
  pitk\u00e4 ja monivaiheinen historia osoittaa. Onhan kysymys demokratiasta, joka
  saa voimansa tavoitteellisesta yhteis\u00f6llisyydest\u00e4 ja oikein ymm\u00e4rrettyn\u00e4
  siet\u00e4\u00e4 sek\u00e4 mieluiset ett\u00e4 ep\u00e4mieluiset asiat. Yhteisten
  asioiden hoidossa meill\u00e4 on tilaa onnistumisille, erehdyksille, ep\u00e4onnistumiselle
  ja korjausliikkeille. Niin kunta toimii ja yleens\u00e4 vasta historia paljastaa,
  kuinka todella k\u00e4vi.  Ja niin kuin nyt - me enimm\u00e4kseen olemme historiaamme
  tyytyv\u00e4isi\u00e4.\\n\\nMuutosvastarinta on sana, jota takavuosina on paljon
  k\u00e4ytetty ja joka olisi voinut hyvin kuvata sodankyl\u00e4l\u00e4isi\u00e4 is\u00e4nti\u00e4,
  kun he vuosisatoja tekiv\u00e4t p\u00e4\u00e4t\u00f6ksi\u00e4 kotipit\u00e4j\u00e4ns\u00e4
  asioista \u2013 hallinnollisia muutoksia jarruttaen. Olisikohan kuitenkin mahdollista
  jo todeta, ett\u00e4 heid\u00e4n kohdallaan olikin kysymys hyv\u00e4st\u00e4 harkintakyvyst\u00e4
  ja rohkeasta poliittisesta toiminnasta, halusta hallita ja kehitt\u00e4\u00e4 omaa
  kotiseutuaan itse oikeaksi katsomallaan tavalla, niin sanottua itse\\n\\nhallitsemisen
  periaatetta noudattaen. Vastuullinen itse hallitseminen yhdess\u00e4 alueen erityisarvot
  huomioon ottavan ja lakiin perustuvan itsehallinnon kanssa ovatkin aikojen saatossa
  ohjannee Sodankyl\u00e4n kunnan p\u00e4\u00e4tt\u00e4ji\u00e4 vastuulliseen toimintaan
  ja kotikuntamme tulokselliseen kehitt\u00e4miseen.\\n\\nNykyisen modernin kunnan
  kehitt\u00e4misen v\u00e4ltt\u00e4m\u00e4tt\u00f6mist\u00e4 teht\u00e4vi\u00e4 mainitsen
  t\u00e4ss\u00e4 Sipposta lainaten vaikkapa seuraavat:\\n\\nalueellisen elinvoimaisuuden
  vahvistaminen, kuntalaisten hyvinvoinnin tukeminen,\\n\\nkoulutuksen ja muiden lakis\u00e4\u00e4teiset
  palvelujen vastuullinen kehitt\u00e4minen taloudellisesti, sosiaalisesti ja ekologisesti,
  ymp\u00e4rist\u00f6llisesti kest\u00e4v\u00e4ll\u00e4 tavalla.\\n\\nJa kun n\u00e4m\u00e4
  toteutuvat, syntyy yleens\u00e4 kest\u00e4vi\u00e4 p\u00e4\u00e4t\u00f6ksi\u00e4
  ja edelleen kasvaa hyv\u00e4 kunta. (Sipponen 2016, s.61 alk.)\\n\\nHyv\u00e4t juhlavieraat\\n\\n100
  vuotta toimineen Sodankyl\u00e4n kunnanvaltuuston yksitt\u00e4isi\u00e4 hankkeita
  ja tuloksia en l\u00e4hde t\u00e4ss\u00e4 yhteydess\u00e4 luettelemaan. Mutta yhteisesti
  voinemme varmasti todeta, ett\u00e4 paljon on tehty hyvin ja oikein.  Kiitos siit\u00e4.\\n\\nKuulin
  t\u00e4ss\u00e4 salissa muutama viikko sitten kunnanjohtajan esityksen kunnan t\u00e4m\u00e4nhetkisest\u00e4
  tilasta, elinkeinorakenteesta ja tulevaisuuden n\u00e4kymist\u00e4. Se on ollut
  mieluisaa kuultavaa, mutta ei kuitenkaan anna aihetta haihatteluun tai turhaan haaveiluun.
  Kun kunnan kehityksen suunta on my\u00f6nteinen, on mielest\u00e4ni syyt\u00e4 uskoa
  se tosiseikka, ett\u00e4 vaikka kasvulle on mahdollisuus, muitakin tilanteita ja
  mahdollisuuksia valitettavasti on. Viisas varautuminen tulevaan on luotettava voimavara
  yhteisten asioiden hoidossa.\\n\\nProfessori Arto Haveri on teoksessaan Kunnanhallinnon
  legitimiteetti (2012) esitt\u00e4nyt mielipiteen\u00e4\u00e4n seuraavaa:\\n\\nKunnat
  ovat vaikuttaneet itsen\u00e4isill\u00e4 toimillaan siihen, ett\u00e4 Suomesta on
  vuosikymmenien aikana \u2013 vaikeidenkin olosuhteiden l\u00e4pi \u2013   kehittynyt
  monella hyvinvoinnin, koulutuksen ja kilpailukyvyn mittarilla mitattuna yksi maailman
  menestyneimmist\u00e4 yhteiskunnista.  T\u00e4m\u00e4n tilanteen keskeinen tekij\u00e4
  on ollut kansalaisten luottamus yhteiskunnan toimivuuteen, siis my\u00f6s kunnaallisen
  itsehallinnon jatkuvaan toteutumiseen ja kehittymiseen.  Se puolestaan on asia,
  jota kunnan luottamushenkil\u00f6t toimillaan sek\u00e4 turvaavat ett\u00e4 vahvistavat.\\n\\nJa
  n\u00e4in on Sodankyl\u00e4ss\u00e4 tapahtunut. T\u00e4ss\u00e4kin muistutan teit\u00e4
  viel\u00e4 niist\u00e4 entisist\u00e4 is\u00e4nnist\u00e4 ja heid\u00e4n p\u00e4\u00e4tt\u00e4v\u00e4isyydest\u00e4\u00e4n.\\n\\nLOPUKSI\\n\\nYhdess\u00e4
  kaikkien sodankyl\u00e4l\u00e4isten kanssa kiit\u00e4n kuntamme luottamushenkil\u00f6it\u00e4,
  jotka vaikeinakin vuosikymmenin\u00e4 ansiokkaasti ja viisain valinnoin kukin vuorollaan
  ovat ja kehitt\u00e4neet Sodankyl\u00e4\u00e4 hyv\u00e4ksi kotikunnaksi meille kaikille.\\n\\nNyt
  toimivalle kunnanvaltuustolle toivon valtuustoty\u00f6ss\u00e4 tietenkin onnea,
  mutta my\u00f6s   aivan erikoisesti valppautta ja viisautta.\\n\\nTulevaisuutta
  ei pid\u00e4 j\u00e4\u00e4d\u00e4 odottamaan. Se t\u00e4ytyy tehd\u00e4 \u2013 joka
  p\u00e4iv\u00e4.\\n\\nHyv\u00e4\u00e4 juhlap\u00e4iv\u00e4\u00e4\\n\\nBrita Turunen\\n\\nSodankyl\u00e4n
