  Kela tilik\u00f6it\u00e4.\\nHYLYKKALON SRK-KODIN KELLARIN NUORISOTILA:\\n- 5\u20136
  ik k lo klo 16\u201318 kokkerkko ja Rintala, Merja Syrj\u00e4m\u00e4 ja Anna-Pearla.\\nHuomi!
  Hintta 5 \u20ac/vuosi.\\n\\nLiis\u00e4tiedot\\n\\nVARHAISNUORISO-\\nRYHM\u00c4T:\\nHarri
  Saarinen\\npuh. 050 561 7765,\\nfirstname.lastname@example.org\\n\\nJani Kela\\npuh.
  050 435 9346\\nemail@example.com\\n\\nNeuvostot valittiin\\n\\nUusi kirkkovaltuusto
  kokoontui 29.1. ensimm\u00e4isen\u00e4 kokoukseensa ja valitsi seurakunnan kirkkoneuvoston
  kaksivuotiskaudelle ja alueenuvoston ja kappelinneuvostot nelivuotiskaudelle.\\n\\nKirkkovaltuuston
  puheenjohtaja ja puheenjohtajana Jukka Ilmola.\\n\\nKirkkoneuvosto johtaa ohje-s\u00e4\u00e4nt\u00f6ns\u00e4
  mukaan yleisesti seurakunnan toimintaa, edist\u00e4\u00e4 sen hengellist\u00e4 el\u00e4m\u00e4\u00e4
  ja muutokkin toimii seurakunnan teht\u00e4v\u00e4n toteuttamiseksi. Se johtaa seurakunnan
  hallintoa sek\u00e4 taloudellista tukea ja kirkollisen t\u00e4rj\u00e4n-t\u00f6intipinnasta,
  valvoa p\u00e4\u00e4osien lainsuorua ja valmistele kirkkovaltuustossa k\u00e4sitelt\u00e4vi\u00e4
  asioita. Kirkkoneuvosto my\u00f6s valmistele seurakunnan talousarvioon sek\u00e4
  antaa toimintakerroksen kirkkovaltuustolle. Teht\u00e4v\u00e4n\u00e4 on pit\u00e4\u00e4,
  ett\u00e4 kirkkovaltuusto on my\u00f6s delegoinut muunmaa teht\u00e4vi\u00e4 kirkko-neuvostolle.\\n\\nKappelinneuvostor
  ja alueenuvosto johtavat, suunnittelevat ja kehitt\u00e4v\u00e4t alueensa seurakunnallista
  toimintaa. Ne antavat lausuntoja ja aloitteita, laatavat toimintakerroksen, toiminta-suunnitelman
  ja talousarvion luotuksen. Kappelinneuvostor ja alueenuvosto valitsevat alueensa
  ty\u00f6ntekij\u00e4t rekrytointis\u00e4\u00e4nn\u00f6n mukaan sek\u00e4 perustavat
  toimikunta, vastuuryhm\u00e4\u00e4 ja ty\u00f6ryhm\u00e4\u00e4 ja m\u00e4\u00e4ritt\u00e4v\u00e4t
  niiden teht\u00e4v\u00e4t.\\n\\nKirkkoneuvosto\\n\\nKirkkoneuvoston puheenjohtaja
  on virallisesti puheenjohtajana Jukka Salo. Seurakunnan kirkkovaltuuston j\u00e4senet
  ovat (suluisia henkil\u00f6kohtainen varaj\u00e4sen): Esa Perttu, varapuheenjohtaja
  (Mikko Aila), Jussi Juurakko (Petri Yli-Soini), Anne Katila (Elina Kalliokallava),
  Piia Kattelus (Heikki Kujala), Matti Kuva ja (Milla Haurala), Mikael Luotola (Kari
  Holkkonen), Markku Muurim\u00e4ki (Jari Heiska), Hanna M\u00e4kynen (Mervi Uusi-Pohjola),
  Liisa Pihlaja (Johanna Keski-Lyra), Seppo Perki\u00f6 (Markku Lehtola), Pentti Taipalus
  (Lei Saarinen).\\n\\nAlueenuvosto ja kappelinneuvostot\\n\\nAlueenuvosto ja kappelinneuvostot
  valittiin nelj\u00e4ksi vuodeksi. Neuvostojen ohjes\u00e4\u00e4nt\u00f6 toteaa,
  ett\u00e4 puheenjohtajana toimii johtava kappalainen \u2013 ja n\u00e4in on ollut
  normiin lukuisan aikaa - eli kirkkovaltuuston toimielin. Nyt valtuusto valitsi jokaisen
  neuvoston puheenjohtajaksi luottamushenkil\u00f6n. Johtava kappalainen on j\u00e4senen\u00e4
  virkansa puolesta ja toimii esittelij\u00e4n\u00e4.\\n\\nSein\u00e4joen alueenrakunnan
  alueenuvosto: Paola Sihlo, puheenjohtaja (Antti Hierrama), Matti Kuvaja (Mikko Aila),
  Juha Hihnalta (Ilmari Yli-Soini), Arija Kankaanp\u00e4\u00e4 (Liisa Panula), Jari
  Kivim\u00e4ki (Jari Oravasaari), Jesse Luhtala (Jarmo Raitila), Peikka Manninen
  (Matti Marttila), Satu M\u00e4kinen (Annukka Latvala), Aosa Ristim\u00e4ki (Karri
  Kallio), Lea Saarinen (Susanna Koskimies), sek\u00e4 Liisa Rantala, johtava kappalainen.\\n\\nNurmion
  kappelinneuvosto: Petri Yli-Soini, puheenjohtaja (Kimmo P\u00f6l\u00f6nen), Tuija
  Alapihla (Paula M\u00e4ki-Annala), Jenni Hyyp\u00e4 (Jukka Pasanen), Jari Jaskari
  (Asko Savolainen), Elina Kalliokallava (Susanna Vehkalajo), Alpo M\u00e4kinen (Kari
  Korpi), Hannu Purola (Rau Kisko), Markku Saari (Hannu Rantala), Jaakko Tiitinen
  (Aira Keski-Luoma), Mervi Uusi-Pohjola (Kalle Hiltunen), Jouko Ikola, johtava kappalainen.\\n\\nPer\u00e4sein\u00e4joen
  kappelinneuvosto: Pentti Taipalus, puheenjohtaja (Matti Kiviniemi), Anne Flinkkil\u00e4
  (Anelma Kantola), Anne Katila (Tuula Koskimies-Hautaniemi), Tarja Katila (Merja
  M\u00e4ki-Kihni\u00e4), Sarita K\u00e4rki (P\u00e4ivi Ilom\u00e4ki), Anna M\u00e4ki-Pavola
  (Pirkko Ojanen), Timo Niemi (Jarmo Rissanen), Sirpa Syrj\u00e4l\u00e4 (Jussi Pohjola),
  Matti Uusi-Pohjola (Markku Lehtola), Vouto Valim\u00e4ki (Keijo Manni), Markku Ylinen,
  johtava kappalainen.\\n\\nYlistaron kappelinneuvosto: Mikko Aila, puheenjohtaja
  (Ari Kekkarainen), Jari Heiska (Hannu Sippola), Ville Karhu (Matti Palo), Hannu
  Kontruri (Mauno Hiem\u00e4k\u00e4), Heikki Kujala (Antti Hierrama), Jari Oravasaari
  (Kari H\u00f6ls\u00e4), Suvi Loukola (Anne-Maria Hakala), Pekka Niemi (Mika Suomalainen),
  Leena Valli (Irene Rauno), Emma Valo (Minna Yli-Rantala), Minna Lainimo, vs. johtava
  kappalainen.\\n\\nJohtokunnan\\n\\nSeurakuntaan perustettiin kiinteist\u00f6t- ja
  hankintakomitea johtokunnan ja, ensimm\u00e4isen\u00e4 johtokunnan valittiin: Mikko
  Aila, puheenjohtaja (Esa Perttu), Satu H\u00e4nninen (Tarja Larva-K\u00e4yr\u00e4),
  Hannu Ilov\u00e4ki (Markku Saari), Matti Kuva ja (Vouto Valim\u00e4ki), Kalle L\u00e4hdesm\u00e4ki
  (Tapio Kolkka), Tuula Potka-Solinen (Suvi Lehtim\u00e4ki), Susanna Vehkalajo (Tero
  Alapihla). Irtyseisjohdon kaudelle 2015 \u2013 2018 valittiin Milla Hautala.\\n\\nYhteisen
  varhaiskasvatuksen johtokuntaan pilotin ajaksi vuosiksi 2015-2016 valittiin Arja
  Kankaanp\u00e4\u00e4, puheenjohtaja (Milla Louvaj\u00e4rvi), Kalle Hiltunen (Katri
  Pohjamaa), Marja-Leena Kurhela (Heli M\u00e4ntysalo), Ari Luoma (Ville Ojala), Kari
  M\u00e4nnikk\u00f6 (Minna Venttaranen).\\n\\nSairaalaselunhoitoon yhteisjohtokuntaan
  valittiin Pekka Niemi ja Etel\u00e4-Pohjamaan perhaseisi neuvottelukeskuksen johtokuntaan
  Mikko Viinikka (Juhani Hihnalta).\\n\\nErkki Kauran palvelusvuodet t\u00e4yttiyv\u00e4t\\n\\nVuodesta
  1987 Sein\u00e4joen alueenrakunnassa ty\u00f6skennelleen Erkki Kauran palvelusvuodet
  t\u00e4yttiv\u00e4t 30.\\n\\nH\u00e4n toimi vahrimestarien ja keitti\u00f6henkil\u00f6kunnan
  apuna Lakeuden Ristiiss\u00e4 ja seurakuntakeskuksen keitti\u00f6ill\u00e4. Mieluisin
  ty\u00f6-teht\u00e4v\u00e4 Erkille oli pikareen kililuotus, mutta muutakin ty\u00f6t
  tiluivat aina hoidettuiksi.\\n\\n\\\"Taamailenkin on sujunut rippe\u00e4sti, muttainkin
  jos sen j\u00e4lkeen oli kalkkauhytarjolla, muistelen vat ty\u00f6kaverit hyviss\u00e4
  suin.\\\"\\n\\nKermakalke on aina Erkille maistunut ja sit\u00e4 tarjoltiin my\u00f6s
  l\u00e4hi\u00f6juhlissa, jossa katseltiin vanhoja valokuvia ja muisteluiin menneit\u00e4
  y\u00f6nt\u00e4ry\u00e4iset vuosia. Sinua siunata tahdon -laulun my\u00f6tyi toisetakin
  hyv\u00e4t el\u00e4ke-vuodet, kun taas paljastetaan kirkkomell\u00e4 muutakin. Erkki
  Kauran l\u00e4hi\u00f6juhajana on toiminut Maarit Ilonen.\\n\\nTeksti:\\nMinna Ylim\u00e4ki-Hemminki\\n\\nRuokapankki
  kiitt\u00e4\u00e4 lahjoittajia\\n\\nL\u00e4mmin kiitos kaikille yrityksille ja yksityisille
  ihmisille, jotka antovat omastaan Ruokapankin jouluker\u00e4ykseen.\\n\\nKer\u00e4yksen
  tuotolla 661 v\u00e4\u00e4r\u00e4varaisista sein\u00e4jokelaisperheit\u00e4 sai
  jouluruokapussin jouluviihkeell\u00e4 ja paljon hyv\u00e4\u00e4 jouluniiht\u00e4\u00e4.\\n\\nKiitos!\\n\\nKrematorion
  korjausty\u00f6 etenee\\n\\nTammikuun puoleen v\u00e4liss\u00e4 saakka p\u00e4\u00e4asassa
  purettiin, sitten ryhdyttiin rakentamaan uutta. Sein\u00e4joen krematorion korjaus
  etenee, ja valmistaa pit\u00e4isi olla maaliskuun loppuun menness\u00e4.\\n\\nKrematorion
  katolle on jo tehnyt uusi tila, johon siirret\u00e4\u00e4n krematorion vanhaa teollisuutta
  ja krematorion huoneistolojen ilmastointilaitteet. Uusittu krematorion savu on vanhaan
  verrattuna puhdaampaa. Ymp\u00e4rist\u00f6olvassa arvor on m\u00e4\u00e4ritelty
  tarkemmin.\\n\\nPari vuokko siten urakoisista ja maailmallaan Finess Energy Oy:n
  toimitusjohtaja Juha-Pekka Paavola sek\u00e4 uunitoimittajan, saksalaisen H. R.
  Heinicke GmbH:n projektivastaava Andy Ritter vierailivat Sein\u00e4joella tuustumassa
  y\u00f6n edistymiseen.\\n\\nJoulukuussa aloitettiin purkutoiolla, purettiin sek\u00e4
  uuni ett\u00e4 savukana. Samalla levitetettiin akkureittoriteit\u00e4 alue niin,
  ett\u00e4 siit\u00e4 muuttui uusi, leve\u00e4mpi automaattinen sis\u00e4vainenteilate
  sek\u00e4 automaattinen tuhkanpoistoilate.\\n\\nKun vanhaa ryhdyttiin korjaamaan,
  yll\u00e4tt\u00e4ksikin tulee. Puistop\u00e4\u00e4llikk\u00f6 Esko Karttunen kertoo,
  ett\u00e4 savukanaa jouduttiin purkamaan ja sen eristyks\u00e4 lis\u00e4\u00e4ntym\u00e4\u00e4n.\\n\\nJuha-Pekka
  Paavola ja Andy Ritter kertoivat, ett\u00e4 uuni muurajaat tulevat Saksasta. Sein\u00e4joelle
  tulee ensimm\u00e4iseksi valheessa kolme henkil\u00f6\u00e4, kaksi p\u00e4\u00e4muuraria
  ja ty\u00f6njohtaja. Andy Ritter kertoi paikalla tarpeen muukaan.\\n\\nTuulivoimainen
  muuraus on vaativaa erikoisty\u00f6t\u00e4, painottaa Juha-Pekka Paavola.\\n\\nH\u00e4n
  sanoo, ett\u00e4 saksalaisesta yritysyrkumpaanista on Finess Oy:ll\u00e4 hyv\u00e4t
  kokemukset. Yhti\u00f6ll\u00e4 on eritt\u00e4in pitk\u00e4 kokemus, yli 100 vuotta,
  ja esim. sen k\u00e4ytt\u00e4mist\u00e4 erikoismateriaaleista on jo lyhyimmill\u00e4\u00e4nkin
  15 vuoden kokemuksen.\\n\\n- Asennus- ja muurausty\u00f6ntekij\u00e4t menev\u00e4t
  paikasta toiseen. Purkuv- ja rakennustoimissa k\u00e4yt\u00e4mme paljon alkuper\u00e4ist\u00e4,
  kertoo toimitusjohtaja Paavola.\\n\\nKrematorion uuniin pit\u00e4isi olla muurattuna
  niin, ett\u00e4 maaliskuun alussa voitaisiin aloitta kuivaus ja l\u00e4mmitys, joka
  kest\u00e4\u00e4 kaksi viikkoa.\\n\\nTy\u00f6 turvallisemmaksi\\n\\nUusi uuni krematoriossa
  vaikeuttaa my\u00f6s tuhkaajan ty\u00f6turvallisuuteen ja ty\u00f6erogonomiaan my\u00f6nteisesti.
  \u00c4rk\u00fcn uuniin vienti sek\u00e4 tuhkan poisto arinalta muuttuvat automaattiseksi,
  koko prosessia hallitaan ja valvotaan erillisest\u00e4 valvontahuoneesta tietokoneella.
  Krematorion muuttuu siis suurempiin konstruktioihin, ilmanvaihto ja valaistus paranevat.
  Koska uuniin tulee kaksi polttoita, kaasut palavat j\u00e4lkipolttimesa ja ulos
  menev\u00e4 savu on puhdaampaa. Kuuminimillaan uuni on 850 - 1200 asteineen.\\n\\n-
  Ymp\u00e4rist\u00f6lavan mukaan tuhkauskia voi olla 500 vuodessa. Siit\u00e4 suurempia
  tuhkausten m\u00e4\u00e4r\u00e4\u00e4 olisi v\u00e4ltt\u00e4m\u00e4t\u00f6nt\u00e4
  ottaa asentamista. Kun rakennus on suojeltu, ne olisivat vaatteet lis\u00e4\u00e4
  uutta tilaa, muutaneet rakennuksen ulkon\u00e4k\u00f6\u00e4 ja lis\u00e4ksi olisivat
  lis\u00e4\u00e4neet korjausen kustannuksia merkitt\u00e4v\u00e4sti, kertoo puistop\u00e4\u00e4llikk\u00f6
  Esko Karttunen. Krematorion korjausen oli viime vuonna ehdotettava budjetoiden 300
  000 euroa, t\u00e4m\u00e4n noin talousarvioon 400 000, yhteens\u00e4 siis 700 000
  euroa.\\n\\nTy\u00f6kohde valvoina on seurakunnasta kiinteist\u00f6p\u00e4\u00e4llikk\u00f6
  Juha Tupeli.\\n\\nKrematorion korjausty\u00f6n aikana sein\u00e4jokeilaiset tuhkauskien
  on hoidettu Vaassassa. Sein\u00e4joelaula hautauksista oli vuonna 2014 tuhkahautauska
  46,3 %.\\n\\nLeena Hautala\\n\\nYksin- ja yhteishuoltajien olohuone\\n\\nVertaistuskirhyhm\u00e4
  olohuone yksin- ja yhteishuoltajille kokoontuu t\u00e4ll\u00e4 vuonna kev\u00e4\u00e4t-
  ja syyskaudella keskustelemaan yhteisest\u00e4 seurakuntakodilla V\u00e4in\u00f6l\u00e4nniukkula.\\n\\nKokoontumisia
  on kev\u00e4\u00e4ll\u00e4 tiistaina 3.3., 14.4. ja 12.5., syksyll\u00e4 jatkettaan
  15.9., 13.10., 10.11. ja 8.12. kello 17.30 \u2013 19.30.\\n\\nOlohuoneiltojen tarkoitus
  on olla matalan kynnyksen kokoonnuttua, joissa yksin- tai yhteishuoltajat voivat
  tavata toisistaan keskusteleman ja joutua toimialtojen merkeiss\u00e4. Illossa on
  j\u00e4senyyst\u00e4 lastenhoito. Pient\u00e4 purtavaa on tarjolla n\u00e4ytt\u00e4en
  tapaan.\\n\\nYhteyshenkil\u00f6 on diakoni Seija Saari, jonka tavoitetaan numerosta
  050 570 6273, s\u00e4hk\u00f6postilla osoitteesta firstname.lastname@example.org\\n\\nJ\u00e4rjest\u00e4j\u00e4in
  ovat Sein\u00e4joen alueurkurakunta ja Yhden vanhemman perheden liitto ry.\\n\\nLapin
  hangille\\n\\nHihtoreissu Saariselle j\u00e4rjest\u00e4\u00e4 Sein\u00e4joen seurakunnasta
  viikolla 13 (21.\u201328.3.2015). Muutamia paikkoja on viel\u00e4 vapaaena. Kiilop\u00e4\u00e4n
  ladulta avautuvat Suomen parhaat hiiltomaisemat. Hihtoreissu sopii erityisesti \\\"sunnuntaihiit\u00e4lle\\\".
  T\u00e4rkeint\u00e4 ei ole matka ja nopeus, vaan ulkoilmansy\u00f6ksy ja T\u00e4ysilento
  on Tiekivess\u00e4. Kokonaisluettelo on edullinen, 450 \u2013 600 \u20ac. Matkanjohtajana
  on pastori Helena Turia. Mukaan haluvan olisi ilmoittauduttava pikaisesti numeroon
  06 418 4230.\\n\\nLahjoituksia tarvitaan Lankarin vanhaan tupaan\\n\\nKev\u00e4\u00e4n
  aikana sisustetaan Lankarin vanhan tuvan yksi kamari. Kamari keskityt\u00e4si nurmolaisten
  ja koiristetun monipuoliseen esittelyyn.\\n\\nVanha tuvan yl\u00e4kerrossa on esili\u00e4
  seurakunnan, her\u00e4nn\u00e4isyyden ja kotirinnatun historia sek\u00e4 nurmolaisten
  rippikoulujen historia. Lahjoituksia on tarvittavaan tonttupukua ja mietien k\u00f6yttipukua,
  lottaryhm\u00e4 ja k\u00f6yttimies, varuste. Molemmissa keruuta l\u00f6ytyv\u00e4t
  niiss\u00e4 kaavat ja Lankarik\u00e4\u00e4r\u00f6 voi tarvittaessa avustaa tarvikkeiden
  hankkimisessa. Muitakin lahjoituksia (kirjallisuutta luukunnottamatta) otetaan vastaan,
  mik\u00e4li ne sopivat tiloihin.\\n\\nVaikea kunnonstettuhi tiloihin tulee museoineistoa,
  niiden tarinaus on ensisijaisesti palvelu rippikoulujen historiaan.\\n\\nYhteydet
  ja tiedustelut: Jouko Ikola 050 342 2094 email@example.com\\n\\nTalkoot Lankarin
  vanhan tuvan vinttil\u00e4 aloitettiin jo 2013, ja tiloja on kunnostettu v\u00e4h\u00e4n
  kerrallaan. Jouko Ikola esittelee l\u00f6yt\u00f6j\u00e4 vinttil\u00e4st\u00e4.
  Nyt kunnostettuun kamariin tarvittaisiin lahjoituksia.\\n\\nAskatelukerhossa on
  kivaa!\\n\\nEri puolilla aineksurakuntaa j\u00e4rjestett\u00e4v\u00e4n askatelukerhoihin
  ovat tervetulleita kouluikaiset ja alle koulul\u00e4iset lapset vanhempiensa kanssa.
  Jokaisella kerralla askarelalaan eri aiheen parissa.\\n\\nMerja Eerikainen k\u00e4y
  lastensa Ainoa, 6, Annin, 4, ja Maijun, 1, kanssa askerasti Kultavuoren askatelukerhossa.\\n\\n-
  Lapset pit\u00e4v\u00e4t askareleemisest\u00e4. Heill\u00e4 ei ole aamuilla her\u00e4\u00e4misvalkeuksia,
  kun kerroin, ett\u00e4 menn\u00e4\u00e4n askatelukerhoon, hymyilee Merja-\u00e4iti.
  - Ei haittaa, vaikka my\u00f6h\u00e4stytt\u00e4isiin, sill\u00e4 t\u00e4ne voi tulla
  oman aikataulun mukaan, Merja sanoo.\\n\\nKultavuoren askatelukerhossa on askarelletta
  ainakin joulukarttipussit, joulukalenterit, maitsopurkitonttorit, muistioriin\u00e4p\u00e4iv\u00e4ksi,
  erilaisia kortteja, taikataikinaa, sek\u00e4 liian vohvileikkaankaista.\\n\\n- Parhaimmillaan
  mukana on ollut 14 askarelleta, sanoo kerhonhoitaja Minna Kilim\u00e4ki.\\n\\n-
  Jokaisen on hiljaisempiakin p\u00e4ivi\u00e4, ja usein osallisuutta onvotaan kovasti
  mukaan, kerhonhoitajat sanovat.\\n\\nOhjaaja Pirko Martikkala auttaa yksivuotiaasta
  Maiuja maalaamisessa.\\n\\n- Ohjaajar ovat mukavia, kun he auttavat askarellessa
  lapsia, kertoo Maria Eckmann.\\n\\nKultavuoren kerho on suunnattu p\u00e4\u00e4asiassa
  yli 4-vuotiaille, mutta my\u00f6s pienemmille l\u00f6ytyy omantasoista askarellevat.\\n\\nPajuloman,
  Pohjan ja Kasperin askatelukerhoissa k\u00e4y enemm\u00e4n kouluik\u00e4isi\u00e4
  lapsia. Askatelukerhoissa on euron materiaalimaksu kerralta. Ohjaajina toimivat
  lapsi- ja perhey\u00f6n perustuttaneen suorittaneet lastenohjaajat. Kerhoihin ei
  tarvitse ilmoittautua etuk\u00e4teen.\\n\\nSaana Korpi\\n\\nKuusivuotias Aino maalaa
  moniv\u00e4rist\u00e4 taiteosta. H\u00e4n kertoo, ett\u00e4 kaikki v\u00e4rit ovat
  lempiv\u00e4rej\u00e4, mutta ei aina.\\n\\nSeurakunnan askatelukerhot kokoontuvat:\\n\\nMaanantaisin
  klo 13 \u2013 15 Pajuloman seurakuntakoti, Suunnistajanreitti 1 E\\nTiistaisin klo
  9 \u2013 11 Kultavuoren seurakuntakoti, Ilmolantere 3\\nTiistaisin klo 13 \u2013
  15 Kasperin seurakuntakoti, Lintuvirta 5\\nTorstaisin klo 13 \u2013 15 Pohjan seurakuntakoti,
  Vainoinkatu 4 B\\n\\nKuormia Ristin tiell\u00e4\\n\\nRistin tie \u2013tapauhtuma
  j\u00e4rjestettiin Kansalaistorilla t\u00e4n\u00e4kin vuonna p\u00e4\u00e4si\u00e4isen
  alla.\\n\\nTapahtumassa on perjantaina 27.3. ja alkavaksi kello 18 Amadeus-n\u00e4ytelm\u00e4ll\u00e4
  kampunginteatterissa. Kello 20.30 alkaen kuljetetaan Kansalaistorilla teatterilailla
  Ristin tie, jossa kello 21.15 alkaa Mozartin Requiem Sein\u00e4joen kaupunginorkesterin,
  solistien ja kuoron esitt\u00e4m\u00e4n\u00e4.\\n\\nKoko illan kaupunkipartapuhunen
  j\u00e4rjest\u00e4v\u00e4 yhteisty\u00f6ss\u00e4 Sein\u00e4joen kaupunginteatteri
  ja Sein\u00e4joen kaupunginorkesteri. KulS: Kulttuurikollektiivi Silta ja Sein\u00e4joen
  kaupunginorkesteri.\\n\\nRistin tie \u2013tapauhtuman teema on t\u00e4n\u00e4 vuonna
  Kuorma (k)annettavaksi. Se on kulkue-esitys, joka liikkuu Kansalaistorin halki.
  Esityksen kohtauteket avautuvat n\u00e4k\u00f6kulmista, jotka ovat auttuneiseen
  sek\u00e4 konkreettiseen ett\u00e4 hetkenesii ja kuljetavat mielj\u00e4 p\u00e4\u00e4si\u00e4isen
  iloon valmistautumiseen.\\n\\nKulkue-esityksen ovat t\u00e4n\u00e4 vuonna k\u00e4sikirjoittaneet
  ja sen ohjaavat teatteri-ilmaisun ohjaajat Tanja Huuskonen ja Venla Korja Kulttuurikollektiiviin.
  Sillasten esityksen yhteydess\u00e4 kosketuu aineksia Ristin tie. T\u00e4ss\u00e4
  mukana olleista oliselta avuena teatteriharastajista sek\u00e4 Kulttuurikollektiivi
  Sillan Kunningasryhm\u00e4n j\u00e4senist\u00e4. Musiikkia tapahtumassa rikastuttaa
  Gospelkuoro Verso Tea Polson johdolla. Jesuksena\\n\\nEnsimm\u00e4inen Ristin tie
  \u2013 tapauhtuma j\u00e4rjestettiin 2013. Lunta saattoi, mutta v\u00e4ke\u00e4
  oli paljalla runsaassa. Jesuksena oli silloinkin, kuten on my\u00f6s t\u00e4m\u00e4n
  vuoden tapahtumassa Jukka Purolanl\u00e4hde.\\n\\nn\u00e4hd\u00e4\u00e4n aiempien
  vuosien tapaana Sein\u00e4joen kaupunginteatterin n\u00e4yttelij\u00e4 Jukka Purola.
  Esiintyj\u00e4 ovat altti. Baard O. Numm, tenori sek\u00e4 Markus Sulkkonen, basso.
  Requiem-koron valmentaa Johanna Ojala-Haapala. Kansalaistorin Ristin tie \u2013tapauhtuman
  on vapaat p\u00e4\u00e4sy. Teatterilla ovat myynniss\u00e4 niin Amadeus-n\u00e4ytelm\u00e4n
  liput kuin yhteis\u00f6lippu Amadeukseen ja Requiemin esitykseen, yhteens\u00e4
  34 euroa. Pelk\u00e4st\u00e4 Requiemia (20 \u20ac/15 \u20ac) ovat myynniss\u00e4
  joko Lakeuden Ristin ovelta ennen esityst\u00e4 tai ennakkoon osoitteesta www. skor.fi
  tai soittohallan numeroon 06 420 2924.\\n\\nRequiemin johtaa kapellimestari Juomas
  Hannikainen, solisteina ovat Tiuuli Lindberg, soprano, Essi M\u00e4ntynen, altti,
  Baard O. Numm, tenori sek\u00e4 Markus Sulkkonen, basso. Requiem-koron valmentaa
  Johanna Ojala-Haapala. Kansalaistorin Ristin tie \u2013tapauhtuman on vapaat p\u00e4\u00e4sy.
  Teatterilla ovat myynniss\u00e4 niin Amadeus-n\u00e4ytelm\u00e4n liput kuin yhteis\u00f6lippu
  Amadeukseen ja Requiemin esitykseen, yhteens\u00e4 34 euroa. Pelk\u00e4st\u00e4
  Requiemia (20 \u20ac/15 \u20ac) ovat myynniss\u00e4 joko Lakeuden Ristin ovelta
  ennen esityst\u00e4 tai ennakkoon osoitteesta www. skor.fi tai soittohallan numeroon
  06 420 2924.\\n\\n50 vuoden takaiset rippikoululaiset koolle\\n\\nPerinteiseen tapaan
  50 vuotta sitten rippikoulun k\u00e4yneet kokoontuvat kev\u00e4ll\u00e4 ja kes\u00e4ll\u00e4.\\n\\nPer\u00e4sinajoen
  rippikoululaisia kutsutaan Kirkkon ja muutelaisuuteen suunnitaima 24.5. kello 10
  alkaen.\\n\\nYlistarossa perinteinen \u201driemu-rippikoululaiset\u201d kokoontuminen
  on helatorstaina, t\u00e4n\u00e4 vuonna tuo kokoontuminen on 14.5. kello 10 alkaen
  Ylistaron kirkossa ja seurakuntakeskuksessa. Koolla ovat my\u00f6s t\u00e4m\u00e4n
  vuoden rippikoululaiset, heill\u00e4 on opetusp\u00e4iv\u00e4.\\n\\nSein\u00e4joen
  seurakunnan vuoden 1965 rippikoululaiset kokoneuvottelusta l\u00e4pp\u00e4kesk\u00e4st\u00e4,
  18. Juhla alkaa kello 10 Lakeuden Ristin osoitalla ja jatkuu muutelaitisaudella
  seurakuntakeskuksessa.\\n\\nNurmion juhlan p\u00e4iv\u00e4m\u00e4\u00e4r\u00e4 ei
  ole viel\u00e4 varmistunut.\\n\\nSeuravassa Lakeuden Risti \u2013lehdeess\u00e4
  on lisaa tietoa kokoontumisesta. Lehti ilmestyy 27.3.\\n\\nSeitsem\u00e4n vapaata
  viikkoa\\n\\nPaaston aikana Sein\u00e4joen seurakunnassa kokoontuu ryhm\u00e4 Sein\u00e4joen
  vapaata viikkoa. Ryhm\u00e4 kokoontuu viistaina 17.3. klo 18 Sein\u00e4joen seurakuntakeskuksesta
  ja sen j\u00e4lkeen joka viikko hiljaiselle viikolle eli 31.3. asti. Seitsem\u00e4n
  vapaata viikkoa on arkitriteetti\u2013ryyppinen ryhm\u00e4, jossa keskustellaan
  viikon Raamatun teksteist\u00e4. Mukana tulisi ilmoittautua viimeist\u00e4\u00e4n
  10.2. numeroon 06 418 4230.\\n\\nTuhkari-kirjoitus- eli 18.2. alkava p\u00e4\u00e4si\u00e4ismunnitraitin
  kest\u00e4v\u00e4 paasto. Laskaisena laskenduutaan paaston. Paastoa kutsutaan seitsem\u00e4ksi
  vapaaksi viikoksik. Se vapauttaa ep\u00e4olemissaista ja auttaa suuntautumaan t\u00e4rke\u00e4mp\u00e4\u00e4n.
  Perinteisess\u00e4 paastossa luovutaan lihansy\u00f6nnist\u00e4 sek\u00e4 pid\u00e4tt\u00e4ydyt\u00e4\u00e4n
  esimerkiksi kahvista, teest\u00e4, alkoholista tai tupakasta. Paasto voi olla monimutkainen
  luovutus: Televisio- ja netti\u00e4 ei kuitenkaan tarvitseminen tai tarjottomuus
  kiireevoi voi j\u00e4\u00e4\u00e4. Paasto raivaa tilaa olenneelle. Se ohjaa rukoilemaan,
  Raamatun tutkisteluun ja Jumalan kohtaamiseen.\\n\\nTuhkaristi on katukumisen merkki\\n\\nTuhkari-kirjoitus
  18.2. kello 17 vietet\u00e4\u00e4n Lakeuden Ristin toimitus- ja kirkollisrakennuksessa,
  jossa papit pit\u00e4v\u00e4t jokaisen orsaan tuhkailla ristin ja lausuu: \\\"Ota
  vastaan katukumisen merkki.\\\" Tapa on per\u00e4isin vuoden 1000 tienolta ja pohjatuuri
  Raamatun, jossa tuhka ja tomu ovat katukumisen n\u00e4kyvi\u00e4 merkkej\u00e4.\\n\\nYhteisvastuu-tapahtumat
  Sein\u00e4joella\\n\\nYhteisvauker\u00e4yksen hyv\u00e4ksi ker\u00e4t\u00e4\u00e4n
  varoja muutakin tavalla kuin listaker\u00e4yskell\u00e4. Viime vuoden yhdistyksell\u00e4
  tapahtumia ker\u00e4ttiin yhteens\u00e4 yli 20 000 euroa. Kokonaisuutena oli 100
  594 euroa.\\n\\nAlueeseurakunnassa\\nTi 17.2. klo 11 alkaen hernekeiton ja kropsun
  myynti seurakuntakeskuksen yl\u00e4sillalla. Ruokulta paljastu 6 \u20ac, juoma 3
  \u20ac, leip\u00e4 6 \u20ac/litra, kaalit 4 \u20ac/palaa.\\n\\nKe 25.3. klo 11 alkaen
  piim\u00e4velin ja klinippiospan myynti seurakuntakeskuksen alasillalla. Omaan astian
  6 \u20ac/litra ja paikalle 6 \u20ac/annos.\\n\\nMa 30.3. klo 10 alkaen leivonnaislaptauma
  keskussairaalan p\u00e4\u00e4ll\u00e4. Myynnin yhteydess\u00e4 vanvan kakkakakkujen,
  naudatia, gluteenittomia ym. ruoas\u00e4\u00e4lepo-muksia myyrt\u00e4v\u00e4n Yhteisvastuun
  hyv\u00e4ksi. Laita mielell\u00e4si l\u00e4pin\u00e4ky-viin pakkauksen ja tee tuotese-loste
  mukaan. Yhteyshenkil\u00f6: Elli Hirvilammi, puh. 0400 665 858.\\n\\nTo 30.4. klo
  10 alkaen vappupiikin myynti keskussairaalan p\u00e4\u00e4ll\u00e4, hinta 70 sentti\u00e4
  / kilo.\\n\\nPe 1.5. klo 11 alk. niin kauan kuin nuoka riitt\u00e4\u00e4 vappulounas
  seurakuntakeskuksen alasillalla. Menu: porsaan ulkoille, kasvisgratini, salaatit
  ja kahvi + kiiseleli. Hinta: 15 \u20ac aikuiset, 6 \u20ac lapset 4-12-v., alle 4-v.
  maksutta.\\n\\nViinim\u00e4ist\u00e4 15.5. tilaukset lusikkaileipoihin (leip\u00e4pullo
  30 kg 25,5.) ja karjalapiirakoista (leip\u00e4pullo 2 000 kpl 26,5.) numpoon 06
  418 4230. Hintta: Lu-sikkeleit\u00e4 22 \u20ac / kilo, karjalapiirakoita 50 sentti\u00e4
  / kappale. Leivonnaiset noutamisesta sovitaan tilauksen yhteydess\u00e4.\\n\\nMa
  25.5. klo 15 - 17 lusikkaileipoihin, seurakuntakeskukseen ala. Latausto 20kg.\\n\\nTi
  26.5. klo 15 - 17 karjalani-piirakoiden nouto seurakuntakeskuksen alasillalla.\\n\\nHUOM!
  Talkov\u00e4ke\u00e4 tarvitaan lusikkaileipien ja karjalani-piirakoiden leipomiseen
  25. ja 26.5.! Ota yhteytt\u00e4: Elli Hirvilammi, puh. 0400 665858.\\n\\nNurmossa\\nSu
  8.2. klo 11\u201314 Yhteisvastuu-ulkollitapautuma. Lankarin leirikeskus, Kourantie
  122. Ohjelmasa mm.: klo 11\u201314 lounas, klo 11 ja 13 perhehypp\u00e4koulu, pulkkam\u00e4ki,
  moottorikellok-ajelu, perin-neleikk\u00e4j\u00e4, kasvomaalausta, pikarapajatieto.\\n\\nMa
  14.3 klo 12-15 kirja-, koru- laulu- ja huvijoukkue Hyllykallion seurakuntakodilla.\\n\\nPe
  24.4. klo 12-19 Yhteisvastuu-tilan lipaseik\u00e4ys Prisman kauppakeskuksessa\\n\\nKe
  11.3. Isotet ker\u00e4\u00e4v\u00e4t Yhteisvastuuta Hyllykallion alueella.\\n\\nPer\u00e4sein\u00e4jolla\\nViikko
  14 nuorten lipaseik\u00e4ys kaupoissa\\n\\nTo 30.4. munkki- ja simayyj\u00e4iset
  seurakuntatalolla\\n\\nYlistarossa\\nKe 11.2. klo 10 alkaen yst\u00e4v\u00e4n-p\u00e4iv\u00e4n
  temppaus. Hernekeiton ja kropsun myynniss\u00e4 Ylistaron S-Marketin pihassa. Voi
  k\u00e4yd\u00e4 ostamassa suoraan my\u00f6s keitti\u00f6it\u00e4!\\n\\nTi 17.2.
  klo 17 alkaen laski-aitapalautuma Ylistaron seurakuntatalon pihamaalla. Hevosajelua,
  makkaraa, l\u00e4tt\u00e4j\u00e4 ja lasikiaispullia sek\u00e4 kuuluisa liukum\u00e4ki
  kirkonm\u00e4ell\u00e4. Tapautuma p\u00e4\u00e4ttyy yhteiseen kirkkokheetoon.\\n\\nSu
  29.3. klo 11-14 Yhteisvastuu-lounas seurakuntatalolla.\\n\\nVapaaehtoisty\u00f6t\u00e4
  tehd\u00e4\u00e4n suurella syd\u00e4mell\u00e4\\n\\nSein\u00e4joen seurakunnassa
  on nelj\u00e4n vuoden aikana ilmoittautunut vapaaehtoisty\u00f6h\u00f6n Suurella
  syd\u00e4mell\u00e4 -nettisivujen kautta. Sielt\u00e4 on l\u00f6ydetty seurakunnan
  paikattujen ty\u00f6ntekij\u00f6iden rinnalle ty\u00f6skentelemaan kolehinker\u00e4ilij\u00e4\u00e4,
  l\u00e4hetysty\u00f6n tukijoita ja tekij\u00f6it\u00e4, Yhteisvastuu-ker\u00e4ji\u00e4,
  yst\u00e4vi\u00e4 vanhuksille ja opiskelijoille, saatopaulaisia sairaalaa, sukankutoja,
  valokuvaajaa jne.\\n\\nOn ilmoittautunut ns. vapaaehtospaikkia. He kaikki ovat niit\u00e4
  suurella syd\u00e4mel\u00e4 varustettuja ihmisj\u00e4, joilla on ollut aikaa ja
  halua tehd\u00e4 hyv\u00e4\u00e4. Verkkosivuston kautta on tavoitettu eriasti muoria,
  paikkumalle mukaan lukien juuri el\u00e4kkeisi\u00e4 j\u00e4seni\u00e4. He ovat
  l\u00f6yt\u00e4neet oman paikkansa seurakunnan vapaaehtoisent joukossa. Edelleen
  tarvitaan uusia vapaaehroisia moniin teht\u00e4viin. Luettelto l\u00f6ytyy osoitteesta
  www.suurella-sydamella.fi.\\n\\nVapaaehtoista sairaalaa saatetaa tarvittaessa jatkuvaa.
  L\u00e4hes p\u00e4ivitt\u00e4in tulee pyyt\u00e4m\u00e4\u00e4n kehitysvelata, omailta
  ja itse vanhuskin joskus soittaa saatajaa, kerrottaa diakonity\u00f6ntekij\u00e4
  Aino V\u00e4\u00e4rh\u00e4ss\u00e4 t\u00e4m\u00e4n hetken tilanteesta.\\n\\nAlkaa
  ja halua auttaa\\n\\n- Televisiota n\u00e4hm\u00e4ni ilmisten h\u00e4\u00e4t ja
  miutut liikkelle\u00e4. Ajattelemi\u00e4ni miehi\u00e4 voisin jopa teh\u00e4 niin
  hyv\u00e4\u00e4. Yhteendotro oli helppoa nettisivujen kautta, kerrotta Tuomas Vihtonen.
  H\u00e4n aloitti vapaaehtoisty\u00f6sarjansa Yhteisvastuu-ker\u00e4ij\u00e4n\u00e4
  kolme vuotta sitten. Nyt h\u00e4n toimii my\u00f6s kolehinkantajana Lakeuden Ristussa
  ja rohkeutta mutkien mukaan.\\n\\n- Rohkistin heid\u00e4t teht\u00e4vi\u00e4 on
  monenlaisia, sanoo Tuomas Vihtonen ja jatkaa, ett\u00e4 vapaaehtoisty\u00f6 on lis\u00e4nnyt
  intoo ja paloa hyv\u00e4n tekemisen.\\n\\nMy\u00f6s Maija Ala-Lipasti l\u00f6ysi
  Suurella syd\u00e4mell\u00e4 -sivulta itselleen vapaaehtoisteht\u00e4v\u00e4\u00e4,
  jotka ovat tuoneet mielek\u00e4st\u00e4 sis\u00e4lt\u00f6\u00e4 el\u00e4m\u00e4\u00e4n.\\n\\n-
  El\u00e4kkeelle j\u00e4\u00e4ty\u00e4ni oli mahdollista osallistua seurakunnan toimintaan
  enemm\u00e4n kuin aikaisemmin. Aikaa j\u00e4\u00e4 my\u00f6s vapaaehtoisty\u00f6h\u00f6,
  sanoo Maija Ala-Lipasti. H\u00e4n toimii L\u00e4hetysopissa taloudella, 85 vuotta
  t\u00e4ytt\u00e4vien seurakuntalaisten omitteluhyv\u00e4ns\u00e4 ja Yhteisvastuu-ker\u00e4ij\u00e4.
  Kerrottaa h\u00e4n, ett\u00e4 h\u00e4n viikkolehde noin 170 ovelle Joupissa ja k\u00e4ymisen
  i\u00e4ki\u00e4miin ovella omitteluuk\u00e4ynnil\u00e4.\\n\\n- Siin\u00e4 teht\u00e4v\u00e4ss\u00e4
  n\u00e4kee, miten paljon on yksin\u00e4isyytt\u00e4, mutta my\u00f6s sen, miten
  virke\u00e4 viel\u00e4 moni 85-vuotias on.\\n\\nL\u00e4hetysty\u00f6 on Maijan syd\u00e4nt\u00e4
  l\u00e4heell\u00e4 ja siksi h\u00e4n ilmoittautui L\u00e4hetyssopeli vapaaehtoiseksi.
  H\u00e4n on illalla tukemaan oman seurakunnan l\u00e4hetyst\u00e4. Siell\u00e4 tavalla
  apu menee varmasti perille, h\u00e4n kerroo. L\u00e4hetyssopelia on t\u00e4\u00e4h\u00e4n
  hyv\u00e4 mahdollisuus.\\n\\n- Vapaaehtoisty\u00f6h\u00f6n l\u00e4hteminen vaatii
  rohkeutta, omalta makuvuusaluetta l\u00e4htemist\u00e4.\\n\\n- Varsinkin meid\u00e4n
  el\u00e4kel\u00e4isten pit\u00e4\u00e4 osata l\u00e4hte\u00e4 liikkeelle. Kalenterissa
  on hyv\u00e4 olla jotain merkint\u00f6j\u00e4 ja menoja. Kotiin nelj\u00e4n sein\u00e4n
  sis\u00e4lle ei saa j\u00e4\u00e4d\u00e4, h\u00e4n muistuttaa.\\n\\nJuttuseuraa
  ja hyv\u00e4\u00e4 ajankulua\\n\\nJuhani Kotaj\u00e4rvi ilmoittautui vapaaehtoiseksi
  muutettuaan Sein\u00e4joelle 3,5 vuotta sitten. Tuolloin h\u00e4n ei tuntenut juuri
  ket\u00e4\u00e4n, mutta vapaaehtoistoiminnan my\u00f6t\u00e4 yst\u00e4vi\u00e4 ja
  tuttavia on l\u00f6ydetty.\\n\\n- L\u00e4hden mukaan vapaaehtoisty\u00f6h\u00f6n,
  kun oli ylim\u00e4\u00e4r\u00e4ist\u00e4 aikaa. J\u00e4in nuorena jo el\u00e4kkeelle
  ja aika tuli pitk\u00e4ksi. Vapaaehtoistoimien parissa puitaan on riippunut h\u00e4n
  kertoo. Lunta ja s\u00e4hk\u00f6rahoja, joissa on mukana: Hautausvuoottaja, muuttoapuna,
  saatopaulaisia sairaalassa, tekem\u00e4ss\u00e4 lumit\u00f6it\u00e4 ja ruohonleikkauuta,
  ruokapuksen viej\u00e4n\u00e4 jne.\\n\\n- Toitit on ollut tarpeeksi. Joskus liikukainen,
  h\u00e4n kerrota ja sanoo muidenimmaksi vapaaehtoisteht\u00e4v\u00e4n\u00e4 on ollut
  rehun teht\u00e4v\u00e4, jollain h\u00e4n vie vanhuksia sairaalasta.\\n\\n- Siin\u00e4
  jutellaan ja pohtiaan yhdess\u00e4 el\u00e4m\u00e4\u00e4. Ne ovat mukavia kohtaamisia,
  h\u00e4n sanoo.\\n\\nToinen toista tarvitsee\\n\\nRiitta Moisio ilmoittautuu vapaaehtoiseksi
  jatkuvaan el\u00e4kkeelle. Eli kuitenkin ihon heti. Ensin oli leiv\u00e4t\u00e4v\u00e4t
  40 ty\u00f6vuotta, j\u00e4lleen aiku uusi, erilainen el\u00e4m\u00e4nvaihe.\\n\\n-
  V\u00e4hitellen aloin k\u00e4yd\u00e4 erilaisissa tilaisuuksissa ja etsin nettiin
  kautta tietoa seurakunnan eri toimintamuotoista. Sit\u00e4 kautta my\u00f6s Suurella
  syd\u00e4mell\u00e4 \u2013siivut tulivat vastaan. Ilmoittautumisen j\u00e4lkeen
  seurakunnan ty\u00f6ntekij\u00e4 oli orsi yhteytt\u00e4 ja palvelutehov\u00e4 l\u00f6ytyi
  keitti\u00f6lt\u00e4.\\n\\n- Vuosia aikaisemmin olin Yhteisvastuu-ker\u00e4ij\u00e4ni.
