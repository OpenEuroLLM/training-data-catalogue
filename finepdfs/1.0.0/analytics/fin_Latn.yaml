  Kallio, Tuulia Saukko-Viita, Helena Vuorela, Hilikka Peltola, Marjatta Viitasaari,
  Raija Tuomi, Maija-Liisa Rautianen, Raili Katajam\u00e4ki, Anne Lentonen, Arja Koski,
  Leena Toivio\\n\\nRippikoululaulujen illassa rentoa mutta pyh\u00e4\u00e4\\n\\nYli
  500 seurakunnalaisia koontuii tammikuun viimeisen\u00e4 sunnuntaina laulamaan rippikoululauluja
  Lakeuden Ristiin. Mukaan oli kutsutu t\u00e4n\u00e4n vuoden rippikoulukselle perilleen.\\n\\nTunnelma
  kirkossa oli kirjailmelist\u00e4kin l\u00e4mmin. Tammisunnuntain rippikoulutapahumalla
  on erityinen merkitys, sill\u00e4 kuitenkin ilta on ollut joko konsertti tai osin
  konsertti ja osin yhteis\u00e4ululta. T\u00e4n\u00e4 vuonna esinytj\u00e4t l\u00f6ytyiv\u00e4t
  oman seurakunnan nuorista, ja yhteis\u00e4ulujen lomassa esiteltiin paikalla olleet
  ripaiden ty\u00f6ntekij\u00e4t, kuulittien rippikoulumuistoja nuorilta sek\u00e4
  hiljennytin ehtoollispojatytt\u00f6 \u00e4itien tunnelma oli renkaan muuta pyh\u00e4.\\n\\nRippikoulu-
  ja rippialulut liittyv\u00e4t kiinti\u00e4sti yhteen. Jokainen muistaa jonkun merkitt\u00e4viss\u00e4\u00e4n
  laulun omala rippialuilla!\\n\\nKranniKospel-b\u00e4ndi kiert\u00e4\u00e4 ymp\u00e4ri
  Sein\u00e4jokea s\u00e4est\u00e4m\u00e4ss\u00e4 messuja ja tekem\u00e4ss\u00e4 rippialulutautuutta.
  Lakeuden Ristiin ilan lis\u00e4ksi he ovat my\u00f6s Ylisonnon messuilla, ja tulossa
  on viel\u00e4 messu Nurmon kirkossa 4.3. klo 19 ja Per\u00e4sein\u00e4joen kirkossa
  toukokuussa 19.\\n\\nKranniKospel -musiikkitapahtuma j\u00e4rjestet\u00e4\u00e4n
  14.3.2015 klo 18-21 Rytmikorjaamolla, ja siell\u00e4 messub\u00e4ndin lis\u00e4ksi
  musiisovat Miriam and The Rain. My\u00f6s seurakuntamme ty\u00f6murod ja muuta kristillisi\u00e4
  toimijoita on mukana eliitt\u00e4v\u00e4n teemap\u00f6ydill\u00e4 ilan toteuttamiseen.\\n\\nRippialulujia
  p\u00e4\u00e4see laulamaan my\u00f6s nuorten messuissa. Lakeuden Ristiiss\u00e4
  seuraavat nuorten messut ovat 13. helmikuuta, 13. maaliskuuta, 17.huhtikuuta ja
  13.toukokuussa klo 19.\\n\\nYlisonnan perjantaimessaa vietet\u00e4\u00e4n 20. helmikuuta,
  27. maaliskuuta, 24.huhtikuuta ja 29. toukokuuta kello 20.\\n\\nNurmon kirkossa
  nuorten messu on 13. helmikuuta, 3. huhtikuuta ja 6. toukokuuta.\\n\\nNuorisoakihvila
  Kiusmukseessa Kvaleynkadulla j\u00e4rjestet\u00e4\u00e4n lauantaina 7.2., kello
  19 j\u00e4\u00e4hyv\u00e4isiltaa vuoden 2010 veisurikirjalle, sill\u00e4 tammikuussa
  otettiin k\u00e4ytt\u00f6\u00f6n veisurikirja mallia 2015!\\n\\nAntaa rippialulujen
  osalta:\\n\\nTuire WuoriJ\u00e4rvi\\n\\nKes\u00e4ll\u00e4 kipin\u00f6i Partaharjulla\\n\\nHien\u00e4kuussa
  j\u00e4rjestet\u00e4\u00e4n legendaarinen Kipin\u00e4-Spark -suurelle pojille ja
  tyt\u00f6ille Partaharjulla. Piekasmaalla Lemp\u00e4\u00e4l\u00e4ss\u00e4, silke\u00e4ss\u00e4,
  askartelua, uutta yst\u00e4v\u00e4\u00e4, j\u00e4nnityst\u00e4, sauvotuksia, harmaa
  herkki\u00e4, riemukasta menoa, kilpailuja, tetrael\u00e4m\u00e4\u00e4 ja paljon
  paljon muuta. Ilmoittautuminen on menneill\u00e4!\\n\\nPartaharjulla, Piekasmaan
  leiriparatiisissa, j\u00e4rjestet\u00e4\u00e4n suurellej\u00e4 nelj\u00e4n vuoden
  v\u00e4lein ja ne kokovat noin 2 000 leiril\u00e4ist\u00e4 eri puolilta Suomea.\\n\\nLeirille
  kutsutaan mukaan noin 10\u201314-vuotiaita poikia ja tyt\u00f6it\u00e4 sek\u00e4
  my\u00f6s perheit\u00e4. Sein\u00e4joen alueseurakunnan ja Nurmon kappeliseurakunnan
  ilmoittautumiset ovat alkanneet. Yleinen kappeliseurakunnan ilmoittautuminen alkaa
  kev\u00e4\u00e4ll\u00e4mm\u00e4ss\u00e4. My\u00f6s Per\u00e4sein\u00e4joen kappeliseurakunnan
  ilmoittautumisesta tietoa tulee l\u00e4hemp\u00e4n\u00e4.\\n\\nLeirin hinta on 70
  \u20ac (sisarealisena 20 \u20ac). Leirille voi tulla my\u00f6s perheen! Hintaa aiakoitus
  my\u00f6s 70 \u20ac.\\n\\nEnsi kes\u00e4n Kipin\u00e4-Spark leirist\u00e4 l\u00f6ytyy
  jo nyt valtavaa tietoa netist\u00e4, esimerkiksi: http://kipina.jipeenetti.fi, Twitteriss\u00e4:
  #kipinaspark2015, Facebookissa: www.facebook.com/kipinapark2015 ja Yoububessa: https://www.youtube.com/user/Jipeenetti.\\n\\nIlmoittautuminen\\n\\nLinkki
  Sein\u00e4joen alueeseurakunnan ilmoittautumiseen: bit.ly/kipina_sjk\\n\\nLinkki
  Nurmon kappeliseurakunnan ilmoittautumiseen: bit.ly/Kipinapark2015Nurmo\\n\\nSein\u00e4joen
