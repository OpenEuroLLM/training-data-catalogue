  B-osakkeet       | 0,71%   | 4,98%           |\\n\\nJohdon omistus 15.2.2000\\n\\nHallituksen
  j\u00e4senet ja toimitusjohtaja omistivat 15.2.2000 yhteens\u00e4 2.285.340 A-osaketta
  ja 2.432.252 B-osaketta. N\u00e4m\u00e4 vastaavat 38,3 % yhti\u00f6n kaikista osakkeista
  ja 56,0 % kaikkien osakkeiden tuottamasta \u00e4\u00e4nim\u00e4\u00e4r\u00e4st\u00e4.
  Lis\u00e4ksi heid\u00e4n omistamansa k\u00e4ytt\u00e4m\u00e4tt\u00f6m\u00e4t optiot
  vastaavat 7,5 % Biohitin liikkelle laskemienv henkil\u00f6st\u00f6optioiden m\u00e4\u00e4r\u00e4st\u00e4,
  joka on 0,44 % osakep\u00e4\u00e4omasta ja 0,07 % \u00e4\u00e4nist\u00e4.\\n\\nHenkil\u00f6kuntaoptiot
  ja muut optioj\u00e4rjestelyt\\n\\nBiohit-konsernin henkil\u00f6kunta ja hallituksen
  j\u00e4senet merkitsiv\u00e4t tilikauden aikana t\u00e4ysim\u00e4\u00e4r\u00e4isesti
  heille tarjotut vastikkeettomat henkil\u00f6kuntaoptiot. Henkil\u00f6kuntaoptiot
  oikeuttavat merkitsem\u00e4\u00e4n ajanjaksoilla 1.1.2000 - 1.4.2000 yhteens\u00e4
  400.000 B-osaketta 12,50 markan merkint\u00e4hinnasta ja ajanjaksoilla 1.1.2002
  - 1.4.2002 yhteens\u00e4 400.000 B-osaketta 20,00 markan merkint\u00e4hinnasta.
  Yhti\u00f6n osakep\u00e4\u00e4oma voi optioiden perusteella tapahtuvien merkint\u00f6jen
  seurauksena nousta enint\u00e4\u00e4n 136.000 eurolla. Vastaavasti osakkeiden m\u00e4\u00e4r\u00e4
  voi nousta enint\u00e4\u00e4n 800.000 osakkeella, joka vastaa 0,9 % kaikkien osakkeiden
  tuottamasta \u00e4\u00e4nim\u00e4\u00e4r\u00e4st\u00e4.\\n\\nVarsinaisen yhti\u00f6kokous
  p\u00e4\u00e4tti 21.4.1999 tarjota Biohitin tuotteiden j\u00e4lleenmyyj\u00e4n\u00e4
  toimivan Jencons Scientific Limited:n omistajatahoni eli Martin John Anthony Williamsin
  ja Robert Erwin Williamsin merkitt\u00e4vaksi yhteens\u00e4 625.000 kappaletta optio-oikeuksia,
  jotka oikeuttavat merkitsem\u00e4\u00e4n 26.4.1999 - 30.9.2002 v\u00e4lisen\u00e4
  aikana 625.000 B-osaketta 10,00 markan merkint\u00e4hinnasta. Osakkeisiin liittyv\u00e4t
  yhti\u00f6oikeudelliset oikeudet alkavat osakep\u00e4\u00e4oman korotuksen tulutta
  merkityksi kaupparekisteriin. Merkit\u00e4\u00e4n oikeutetut merkitsiv\u00e4t t\u00e4ysim\u00e4\u00e4r\u00e4isesti
  heille tarjotut optio-oikeudet. Yhti\u00f6n osakep\u00e4\u00e4oma voi optioiden
  perusteella tapahtuvien merkint\u00f6jen seurauksena nousta enint\u00e4\u00e4n 106.250
  eurolla. Vastaavasti osakkeiden m\u00e4\u00e4r\u00e4 voi nousta enint\u00e4\u00e4n
  625.000 kappaletta, joka vastaa 0,7 % kaikkien osakkeiden tuottamasta \u00e4\u00e4nim\u00e4\u00e4r\u00e4st\u00e4.\\n\\nTunnuslukujen
