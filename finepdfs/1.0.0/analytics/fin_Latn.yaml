  Lautakunta | Hallitus | Valtuusto |\\n\\nToteutusmallina on esill\u00e4 ollut ns.
  v\u00e4livuokraus, jossa kiinteist\u00f6sijoitusyhti\u00f6ill\u00e4 olisi mahdollisuus
  tehd\u00e4 tarjouksia kyseisen rakennuksen rakentamisesta kunnan osoittamalle tontille
  ja kunta sitoutuisi v\u00e4livuokraamaan rakennuksen tilat ja joka edelleenvuokraisi
  tilat lopulliselle palveluntuottajalle.\\n\\nMik\u00e4li valittava tontti ei kaavallisesti
  sovellu ko. k\u00e4ytt\u00f6tarkoitukseen kunta aloittaa kaavamuutoksen laatimisen
  alueelle.\\n\\nKvalt P\u00e4\u00e4t\u00f6s:\\n\\nKeskustan ryhm\u00e4puheenvuorossa
  tehtiin muutosesitys kunnanhallituksen pohjaehdotukseen siten, ett\u00e4 sana tarjouksia
  muutetaan sanaksi tonttivarauksia.\\n\\nPuheenjohtaja totesi, ett\u00e4 koska oli
  tehty kunnanhallituksen esityksest\u00e4 poikkeava esitys, on siit\u00e4 \u00e4\u00e4nestett\u00e4v\u00e4.\\n\\nPuheenjohtajan
  ehdotuksesta hyv\u00e4ksyttiin suoritettavaksi nimenhuuto\u00e4\u00e4nestys. Ne,
  jotka kannattavat kunnanhallituksen esityst\u00e4, \u00e4\u00e4nest\u00e4v\u00e4t
  JAA. Ne, jotka kannattavat keskustan ryhm\u00e4puheenvuorossa tehty\u00e4 muutosesityst\u00e4,
  \u00e4\u00e4nest\u00e4v\u00e4t EI.\\n\\nKunnanhallituksen esitys ei saanut kannatusta
  ja keskustan ryhm\u00e4puheenvuorossa tehty\u00e4 muutosesityst\u00e4 kannatti 21.\\n\\nPuheenjohtaja
  totesi, ett\u00e4 kunnanvaltuuston p\u00e4\u00e4t\u00f6kseksi tuli keskustan ryhm\u00e4puheenvuorossa
  tehty muutosesitys yksimielisesti \u00e4\u00e4nin 21 \u2013 0.\\n\\nP\u00f6yt\u00e4kirjantarkastajat
  nimikirjaimet\\n\\nLautakunta Hallitus\\n\\nValtuusto\\n\\nSUUNNITELMA TALOUDEN
  TASAPAINOTTAMISEKSI VUOSILLE 2014 JA 2015\\n\\nKunnanhallitus 25.08.2014\\n\\n106
  \u00a7\\n\\nKuntien harkinnanvaraisen valtionosuuden korotuksen my\u00f6nt\u00e4misen
  ehtona on, ett\u00e4 kunta on hyv\u00e4ksynyt suunnitelman taloutensa tasapainottamiseksi
  toteutettavista toimenpiteist\u00e4.\\n\\nKihni\u00f6n kunta tasapainottaa talouttaan
  jatkamalla kaikkiin hallintokuntiin perustettuja talouden tasapainottamisen ty\u00f6ryhmi\u00e4,
  joiden teht\u00e4v\u00e4n\u00e4 on ennakkoluulottomasti hakea kustannuss\u00e4\u00e4st\u00f6j\u00e4
  ja tehostaa toimintaa.\\n\\nVuodelle 2015 korotetaan tuloveroprosenttia v\u00e4hint\u00e4\u00e4n
  1 prosenttiyksik\u00f6ll\u00e4 ja my\u00f6s mahdollisuus kiinteist\u00f6verotuksen
  korotuksiin tutkitaan.\\n\\nMaksujen, taksojen ja vuokrien tarkistukset lain edellytt\u00e4miss\u00e4
  puitteissa. Vertailua tulee tehd\u00e4 my\u00f6s naapurikuntiin.\\n\\nMets\u00e4taloussuunnitelman
  mukaisia hakkuita mets\u00e4nhoidollisin toimenpitein noin 100.000 eurolla vuodelle
  2015-\\n\\nHenkil\u00f6kuntaa suositellaan vaihtamaan lomarahoja lomarahavapaaksi
  ja laaditaan osastoittain el\u00e4kesuunnitelma, jota hyv\u00e4ksik\u00e4ytt\u00e4en
  tavoitellaan kustannuss\u00e4\u00e4st\u00f6j\u00e4.\\n\\nPerusturvalautakunnan palvelutuotannon
  ulkoistamisen tutkiminen-\\n\\nEsittelij\u00e4 Ehdotus:\\n\\nKunnanhallitus hyv\u00e4ksyy
  esittelytekstiss\u00e4 olevat toimenpiteet suunnitelmaksi talouden tasapainottamisesta
  ja esitt\u00e4\u00e4 asiaa edelleen kunnanvaltuuston hyv\u00e4ksytt\u00e4v\u00e4ksi\\n\\nKhall\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\nKunnanhallitus
  hyv\u00e4ksyi yksimielisesti esittelij\u00e4n p\u00e4\u00e4t\u00f6sehdotuksen.\\n\\n______________________\\n\\n19
