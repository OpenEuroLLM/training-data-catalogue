  11.3. n. klo 17. Voivit ilmoittautua ker\u00e4\u00e4ji\u00e4 omalle alueellesi,
  kaikki ker\u00e4j\u00e4t eiv\u00e4t viel\u00e4 varmistuneet lehdet painoon menness\u00e4.
  Ota yhteytt\u00e4 diakoniaty\u00f6ntekij\u00f6ihin.\\n\\nMartikkala-Koskela\\nRiina
