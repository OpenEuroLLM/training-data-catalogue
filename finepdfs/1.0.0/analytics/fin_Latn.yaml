  50 652 538        |\\n\\nBiohit Oy:n vuoden 2000 osavuosikatsausten julkistaminen\\n\\nBiohit
  Oyj tulee julkistamaan vuoden 2000 osavuosikatsaukset 16.5., 15.8. ja 8.11.2000.\\n\\nBiohitin
  osakkeenomistajille\\n\\nBiohit Oyj keskittyy toiminnassaan vain niille liiketoiminta-alueille,
  joilla sill\u00e4 on luotettavaa tieteellist\u00e4 ja teknist\u00e4 osaamista ja
  patenttoja innovaatioita. Runsaan vuoden aikana Suomessa p\u00f6rssiin listautuneista
  yli pariskymmenest\u00e4 yrityksest\u00e4 Biohitill\u00e4 on 16 suomalaista patenttia
  ja n\u00e4ist\u00e4 yrityksist\u00e4 kaikkiolla muilla yhteens\u00e4 11 patenttia\u00b9.\\n\\nBiohitin
  laaja patenttisuojoa on luonut yhti\u00f6lle vahvan ja turvallisen perustan globaalille
  yhteisty\u00f6lle ja kasvulle. Biohitin koti- ja ulkomaiset patentit, tuotteiden
  korkea laatu ja toimitusvarmuus ovat taanneet pitk\u00e4ik\u00e4iseen yhteisty\u00f6n
  jatkumisen kansainv\u00e4listen suuryritysten, kuten Becton Dickinsonin, bioM\u00e9rieux:n,
  Johnson & Johnsonin ja 3M:n kanssa. T\u00e4st\u00e4 samasta syyst\u00e4 Biohitin
  kuusi ulkomaisista myynti- ja markkinointiyhti\u00f6it\u00e4 ovat edelleenkin kasvanneet
  ja kehittyneet suotuisasti. Samoin Biohitin maailmanlaajuinen jakelijaverkosto on
  entist\u00e4 vahvemmin panostanut yhti\u00f6n tuotteiden markkinointiin ja myyntiin.\\n\\nVuoden
  1999 liikevaihto muodostui edelleenkin p\u00e4\u00e4osin elektronisista ja mekaanisista
  pipeteist\u00e4 sek\u00e4 niiden kertak\u00e4ytt\u00f6k\u00e4rjist\u00e4 ja huollossa.
  Vuoden 1999 kuluessa yhti\u00f6 toi markkinoille joukon uusia nesteannostelijoita.
  Nykyisten tuotteiden rinnalle yhti\u00f6 on valmistautunut esittelem\u00e4\u00e4n
  vuoden 2000 kuluessa uusiin innovaatioihin perustuvat, uuden sukupolven elektroniset
  nesteannostelijat sek\u00e4 eri tyypisi\u00e4 kertak\u00e4ytt\u00f6k\u00e4rki\u00e4.
  T\u00e4ll\u00f6in yhti\u00f6 kykenee tarjoamaan tuotteita jo usean eri hintatasoon
  markkinasegmentille. Yhti\u00f6 on panostanut my\u00f6s automaattisen nesteannostelyyksik\u00f6n
  kehitt\u00e4miseen. Kyseisen annostelyyksikon eri versiot palvelevat yhti\u00f6n
  omien instrumenttien kehitysty\u00f6t\u00e4 ja t\u00e4ydent\u00e4v\u00e4t muiden
  yhti\u00f6iden diagnostisia j\u00e4rjestelmi\u00e4.\\n\\nBiohitin diagnostiikkatuotteiden
  perustana on my\u00f6s luotettava tieteellinen tutkimus ja lukuisat innovaatiot.
  Vuoden 1999 kuluessa mahasy\u00f6v\u00e4n sek\u00e4 maha-ja pohjukaisuoluhaavan
  riskin mittaukseen tarkoitettun testipaneelin kehitysty\u00f6 eteni asetettujen
  tavoitteiden mukaisesti. T\u00e4ll\u00e4 hetkell\u00e4 testipaneelin eri testit
  ovat kliniikassa koek\u00e4yt\u00f6ss\u00e4 ja ne tulevat markkinoille vuoden 2000
  kuluessa. Laktosointoleranssin ja systeemisen lupus erytematosuksen (SLE) diagnoosimiseksi
  tarkoitettut testit ovat my\u00f6s kliniikassa testeiss\u00e4 ja tulevat markkinoille
  kev\u00e4\u00e4n 2000 kuluessa. Keliakian m\u00e4\u00e4ritt\u00e4miseen tarkoitettun
  kolmen eri testin markkinointi on aloitettu. T\u00e4ss\u00e4 mainitut ja suunnitteilla
  olevat testit yhdess\u00e4 nesteannostelijoiden ja instrumenttien kanssa tulevat
  muodostamaan synergisi\u00e4 analysointij\u00e4rjestelmi\u00e4.\\n\\nLaboratoriotoimintaa
  ja tutkimusta sek\u00e4 l\u00e4\u00e4ketiedett\u00e4 ja ihmisten hyvinvointia edist\u00e4vill\u00e4
  Biohitin nykyisill\u00e4 ja kehitysty\u00f6n kohteena olevilla korkean teknologian
  tuotteilla on globaalit markkinat, joiden tasaisesti kasvavien markkinapotentiaalien
  suuruus on miljardeja markkoja. Eri tyypiset tutkimuslaboratoriot, teollisuus ja
  terveydenhuolto ovat Biohitin tuotteiden p\u00e4\u00e4k\u00e4ytt\u00e4ji\u00e4.
  T\u00e4m\u00e4n lis\u00e4ksi edell\u00e4 mainitut ja monet muut kansainv\u00e4listet
  suuryritykset t\u00e4ydent\u00e4v\u00e4t Biohitin tuotteilla ja teknologiolla omia
  tuotevalikoimiaan ja diagnostisia j\u00e4rjestelmi\u00e4\u00e4n.\\n\\n\u00b9 National
  Board of Patents and Registration of Finland 27.1.2000.\\n\\nBiohitin kokenut ja
  motivoitunut henkil\u00f6st\u00f6 sek\u00e4 moderni teknologia muodostavat laadukkaiden
  tuotteiden ja palveluiden perustan. Yhti\u00f6lle valmistuu vuoden 2000 kulussa
  Kajaanissa uusi tuotantolaitos, jonka kapasiteetti ylitt\u00e4\u00e4 v\u00e4hint\u00e4\u00e4n
  kolminkertaistamaan nykyisen tuotantovolymimme. Nesteannostelijoiden kokoonpanoon
  ja niiden tarkkuusmuoviosien ruiskupuristamiiseen tarkoitettu uusi tuotantolaitos
  Kajaanissa ja vastaava pilottityyssik\u00f6 Helsingiss\u00e4 lis\u00e4\u00e4v\u00e4t
  merkitt\u00e4v\u00e4sti tuottavuutta ja parantavat entisest\u00e4\u00e4n tuotteiden
  laatua.\\n\\nVuoden 1999 kulussa Biohitist\u00e4 on kypsynyt yritys, jossa vuosien
  aikana mittavilla intellektuaalisilla ja taloudellisilla panostuksillamme on luotu
  kansainv\u00e4lisesti jo koeteltu ja tunnustettu vankka osaaminisperusta ja sen
  mukainen liikeidea. T\u00e4m\u00e4 on l\u00e4ht\u00f6kohta yhti\u00f6n kansainv\u00e4liselle
  kilpailukyvylle ja hallituille globaalille kasville. Biohitin kasvupotentiaalia
  vahvistettiin merkitt\u00e4v\u00e4sti vuoden 1999 kes\u00e4kuussa lujittamalla yhti\u00f6n
  rahoitusasemaa suurella yleis\u00f6lt\u00e4 ja institutionaalisilta sijoittajilta
  yritykselle hankitulla p\u00e4\u00e4omalla ja listautumalla Helsingin P\u00f6rssin
  NM-listalle.\\n\\nVuoden 1999 kulussa yhti\u00f6 on valmistautunut laajentamaan
  teknologioitaan ja kansainv\u00e4lisi\u00e4 markkinointaan tutkimalla eri yritysoisto-
  ja yhteisty\u00f6mahdollisuuksia. On mahdollista, ett\u00e4 viel\u00e4 vuoden 2000
  kulussa yhti\u00f6 toteuttaa yritysoistoja ja laajentaa yhteisty\u00f6t\u00e4 kansainv\u00e4lissten
  suuryritysten kanssa voidakseen parhaimmalla mahdollisella tavalla hy\u00f6dynt\u00e4\u00e4
  nykyisten ja tulevien tuoteinnovaatioiden globaalia markkinapotentiaalia.\\n\\nEsit\u00e4n
  parhaimat kiitoksetni Biohitin henkil\u00f6st\u00f6lle, osakkeenomistajille ja muille
  sidorsyrhmille yhti\u00f6llemme osoittamastanne luottamuksesta ja ihmisten hyvinvointiin
  suunnatusta arvokkaasta ja menestyksellisest\u00e4 yhteisty\u00f6st\u00e4mme.\\n\\nHelsingiss\u00e4
  15. maaliskuuta, 2000\\n\\nKunnioittavasti,\\n\\nLKT Osmo Suovaniemi\\nBiohit Oyj:n
  toimitusjohtaja\\n\\nBiohitin oma perus- ja soveltava tutkimus, yhteisty\u00f6 koti-
  ja ulkomaisen tiedeyhteis\u00f6jen kanssa sek\u00e4 yhti\u00f6n tuotekehitys luovat
  intellektuaalista p\u00e4\u00e4omaa, jota suojataan kansainv\u00e4lisill\u00e4 patentteilla
  ja eri tyypillisill\u00e4 sopimuksilla. Muiden yhti\u00f6iden patentteja ja tuotteita
  huolellisesti seuraamalla saadaan kilpailijatietoa ja erityisesti minimoidaan riski\u00e4,
  ett\u00e4 Biohitin tai muiden yhti\u00f6iden oikeuksia loukkaataisiin. Biohitill\u00e4
  ei ole immateriaalioikeuksia liittyvi\u00e4 kistoja vireill\u00e4.\\n\\nBiohit keskittyy
  toiminnassaan vain niille liiketoiminta-alueille, joilla sill\u00e4 on luotettavaa
  tieteellist\u00e4 ja teknist\u00e4 osaamista ja patentoituja innovaatioita. Runsaan
  vuoden aikana Suomessa p\u00f6rssiin listautuneista yli pariskymmenest\u00e4 yrityksest\u00e4
  Biohitill\u00e4 on 16 suomalaista patenttia.\\n\\nBiohitin laaja koti- ja ulkomainen
  patenttiusoja sek\u00e4 erityyppiset sopimukset ovat luoneet yhti\u00f6lle vahvan
  ja turvallisen perustan globaalille yhteisty\u00f6lle ja kasvulle. Biohitin patentit,
  tuotteiden korkea laatu ja toimitusvarmuus ovat taanneet pitk\u00e4aikaisten yhteisty\u00f6n
  jatkumisen kansainv\u00e4listen suuryritysten, kuten Becton Dickinsonin, bioM\u00e9rieux:n,
  Johnson & Johnsonin ja 3M:n kanssa. T\u00e4st\u00e4 samasta syyst\u00e4 Biohitin
  kuusi ulkomaisa myynti- ja markkinointiyhti\u00f6t\u00e4 ovat edelleenkin kasvaneet
  ja kehittyneet suutuisasti. Samoin maailmanlaajuinen jakelijaverkosto on entist\u00e4
  vahvemmin panostanut Biohitin tuotteiden markkinointiin ja myyntiin. Yhti\u00f6
  tulee my\u00f6s jatkossa kiinnitt\u00e4m\u00e4\u00e4n erityist\u00e4 huomiota poikkitieteellisen
  intellektuaalisen omaisuutensa voimakkaaseen kehitt\u00e4miseen.\\n\\n**Tuotanto**\\n\\nNesteannostelijat
  ja niiden kertak\u00e4ytt\u00f6iset k\u00e4rjet tuotetaan Kajaanin ja Helsingin
  tuotantoyksik\u00f6iss\u00e4. Nesteannostelutootteiden valmistuksen osalta Helsingin
  yksikk\u00f6 toimii tuotannollisena koeyksikk\u00f6n\u00e4. T\u00e4m\u00e4n lis\u00e4ksi
  yhti\u00f6n diagnostiset tuotteet valmistetaan Helsingiss\u00e4. T\u00e4ll\u00e4
  hetkell\u00e4 Kajaanissa tarkkuusmuoviosia, pipetin osia ja kertak\u00e4ytt\u00f6isi\u00e4
  pipetin k\u00e4rki\u00e4 valmistava ruiskupuristusosasto toimii kolmessa vuorossa
  seitsem\u00e4n p\u00e4iv\u00e4\u00e4 viikossa. Mekaanisten ja elektronisten pipettien
  kokoonpano-osastot ym. aputoiminnot ty\u00f6skentelev\u00e4t p\u00e4\u00e4t\u00f6sin
  yhdess\u00e4 vuorossa viisi p\u00e4iv\u00e4\u00e4 viikossa.\\n\\nBiohitin tutkimus-
  ja kehitysty\u00f6ss\u00e4 eri alojen asiantuntemus yhdistyy kokonaisvaltaiseksi
  osaamiseksi. Ty\u00f6ntekij\u00e4t ovat elektroniikan, optiikan, mekaniikan ja ruiskupuristusteknologian
  asiantuntijoita. Kuvassa p\u00e4\u00e4suunnittelija Perti Ekholm.\\n\\nVuonna 1999
  Biohit teki p\u00e4\u00e4t\u00f6ksen koskien uusien tuotantolilojen rakentamista
  Kajaaniin. Rakennushanke k\u00e4ynnistet\u00e4\u00e4n kev\u00e4\u00e4ll\u00e4 2000
  kuluessa ja uudet toimintialat on mahdollista ottaa k\u00e4ytt\u00f6\u00f6n vuoden
  2000 aikana. Rakennushanke mahdollistaa yhti\u00f6n tuotantoitominnan keskitt\u00e4misen
  Kajaanissa yksin tiloihin ja pipettien, ker-tak\u00e4ytt\u00f6k\u00e4rkien sek\u00e4
  diagnostiikka- ja instrumenttiliike-toimintaan liittyvien muovituotteiden valmistukseen
  ja laadun edelleenkehitt\u00e4miseen. Yhti\u00f6n arvion mukaan uussa toimintiloissa
  on mahdollista v\u00e4hint\u00e4\u00e4n kolminkertaisataa nykyisen tuotannon volyymi.
  Biohitin uusi tuotantoteknologia, lis\u00e4kapasiteetti sek\u00e4 uudet tuotantolaitat
  luovat valmiudet yhti\u00f6n kasvulle tulevaisuudessa.\\n\\nBiohitin tuotteiden
  kotimaisuusaste on n. 95% ja 96% myynnist\u00e4 kertyy ulkomailta. Biohit on t\u00e4ll\u00e4
  hetkell\u00e4 er\u00e4s maailman johtavista nesteannostelutuotteiden valmistajista.
  Kansainv\u00e4liset suuryritykset, kuten Becton Dickinson, bioM\u00e9rieux, Johnson
  & Johnson ja 3M t\u00e4ydent\u00e4v\u00e4t diagnostiisia j\u00e4rjestelm\u00e4\u00e4m\u00e4
  Biohitin lukuisiin innovaatioihin ja patentteihin perustuvilla tuotteilla. T\u00e4m\u00e4n
  lis\u00e4ksi Biohit on kehitt\u00e4nyt ja toimittanut elektroniisia pipettej\u00e4
  saksalaisyhti\u00f6 Eppendorfille, joka valmistaa mm. mekaanisia pipetteja. Biohit
  on my\u00f6s lisensoinut kyseiselle yhti\u00f6lle maailmanlaajuisen patentin uuden
  sukupolven mekaanisen pipettiperheen kehitt\u00e4mist\u00e4 varten. Biohit Oy:lle
  on my\u00f6nnetty ISO 9001 \u2013laatuj\u00e4rjestelm\u00e4sertifikaatti, ja laadun
  kokonaisvaltainen sek\u00e4 jatkuva kehitt\u00e4minen on keskeisess\u00e4 asemassa
  Biohitiss\u00e4.\\n\\nKansainv\u00e4linen myynti ja markkinointi\\n\\nTuotteiden
  myynti- ja markkinointiverkoston rakentaminen on onnistuneen kansainv\u00e4listymisen
  perusedellytyks. Biohit on verraten lyhyess\u00e4 ajassa kyennyt luomaan oman jakelu-
  ja markkinointiorganisaation, joka kattaa t\u00e4rkeim\u00e4t markkina-alueet.\\n\\nBiohitin
  kansainv\u00e4linen myynti- ja markkinointiverkosto k\u00e4sitt\u00e4\u00e4 noin
  50 itsen\u00e4ist\u00e4 jakelijaa, joilla on laaja paikallinen jakelijaverkosto.
  Kokonaisuudessaan t\u00e4m\u00e4 verkosto, johon kuuluu yli 200 jakelijaa, kattaa
  noin 50 maata. T\u00e4m\u00e4n lis\u00e4ksi Biohitin ulkomaiset tyt\u00e4ryritykset
  Isoon-Britanniassa, Italiassa, Japanissa, Ranskassa, Saksaan ja USA:ssa toimivat
  Biohit-tuotteiden myynti- ja markkinointiyksik\u00f6in\u00e4 sek\u00e4 tarjoavat
  paikallisesti huolto- ja koulutuspalveluita. N\u00e4m\u00e4 yhti\u00f6 pyrkii luomaan
  maailmanlaajuisen Biohit-tavaramerkin sek\u00e4 parantamaan entisest\u00e4\u00e4n
  asiakastyytyv\u00e4isyysit\u00e4. Biohit-tuotteiden lis\u00e4ksi em. tyt\u00e4ryritykset
  myyv\u00e4t OEM- ja private label -tuotteita. Biohitin merkitt\u00e4vimill\u00e4
  OEM- ja private label -asiakkailta on kattavat maailmanlaajuiset myyntiverkostot,
  jotka ovat t\u00e4rkeit\u00e4 Biohitin nesteannostelu- ja diagnostisten tuotteiden
  instrumenttien sek\u00e4 n\u00e4ist\u00e4 osa-alueisiin koostuvien analysointij\u00e4rjestelmien
  tuote- ja markkinointistrategiaissa. Biohit Oy:n Suomessa toimiva tyt\u00e4ryritys
  Locus genex Oy on erikoistunut diagnostisten tuotteiden tutkimukseen, kehitykseen
  ja tuotantoon.\\n\\nVuonna 1999 tyt\u00e4ryritysten liikevaihto muodosti 62% Biohit-konsernin
  liikevaihdosta. Tilikaudella Biohitin ulkomaiset tyt\u00e4ryritykset ryhtyiv\u00e4t
  tarjoamaan entist\u00e4 monipuolisempia huoltopalveluja sek\u00e4 Biohitin ett\u00e4
  muiden yritysten valmistamille pipeteille. T\u00e4h\u00e4n liittyen Biohit jatkoi
  nesteannostelutuotteiden kansainv\u00e4lisen huoltopalveluksen edelleenkehitt\u00e4mist\u00e4
  ja harmonisointia. Vuonna 1999 yhti\u00f6 jatkoi panostusta Biohit-tuotelinjojen
  sek\u00e4 OEM-tuotteiden markkinointiin. Tulevaisuudessa Biohit aikoo vahvistaa
  t\u00e4rkeimmill\u00e4 markkina-alueilla toimivien tyt\u00e4ryritysten perinteisi\u00e4
  sek\u00e4 ekstranet- ja internet-pohjaisia toimintoja.\\n\\nBiohitin tuotantoysik\u00f6t
  sijaitsevat Kajaanissa ja Helsingiss\u00e4. Helsingin yksik\u00f6ss\u00e4 valmistetaan
  tiettyj\u00e4 erikoisuutteita sek\u00e4 tehd\u00e4\u00e4n uusien tuotteiden ja teknologioiden
  kehitys- ja testausty\u00f6t\u00e4.\\n\\nAsiakaskunta\\n\\nBiohitin asiakaskunta
  k\u00e4sitt\u00e4\u00e4 tutkimuslaitosten, yliopistojen, l\u00e4\u00e4ke- ja bioteknologia-alan
  yritysten ja sairaaloiden laboratorioita. My\u00f6skin elintarvike- ja ymp\u00e4rist\u00f6alan
  laboratoriot ovat Biohitin t\u00e4rkeit\u00e4 asiakkaita. T\u00e4m\u00e4n lis\u00e4ksi
  yhti\u00f6 valmistaa omaan teknologiseen osaamiseensa perustuen useille OEM-asiakkaille
  heid\u00e4n tarpeidensa mukaisesti r\u00e4\u00e4t\u00e4l\u00f6ityj\u00e4 tuotteita.
  Sellaiset kansainv\u00e4liset suuryritykset kuten Becton Dickinson, bioM\u00e9rieux,
  Johnson & Johnson ja 3M t\u00e4ydent\u00e4v\u00e4t omia tuotevalikoimiaan ja diagnostiisia
  j\u00e4rjestelm\u00e4\u00e4m\u00e4 Biohitin valmistamilla OEM-tuotteilla.\\n\\nListautuminen
  Helsingin P\u00f6rssiin\\n\\nBiohit muutti julkiseksi osakeyhti\u00f6ksi huhtikuussa
  1999 ja listautui Helsingin P\u00f6rssin NM-listalle kes\u00e4kuussa 1999. Biohitin
  B-osakkeiden kaupank\u00e4ynti alkoi 18.6.1999.\\n\\nListautumisen yhteydess\u00e4
  toteutettiin suunnattu osakeanti, jossa tarjottiin 2.000.000 uutta B-osaketta nimellisarvoltaan
  EUR 0,17 suomalaisen ja ulkomaisen institutionaalisten sijoittajien ja suomalaisenyleis\u00f6n
  merkit\u00e4v\u00e4ksi EUR 4,5 kappaleehinnalla. Osakkeiden merkit\u00e4v\u00e4ik\u00e4
  oli 2. \u2013 15.6.1999. Osakeanti keskeytettiin 14.6.1999 ylimerkinn\u00e4n johdosta.\\n\\nOsakkeet
  allokoitiin merkit\u00e4vij\u00f6iden kesken siten, ett\u00e4 institutionaalisten
  sijoittajien osuudeksi muodostui 750.000 ja yleis\u00f6n osuudeksi 1.250.000 osaketta.
  Osakeannen seurauksena yhti\u00f6n B-osakkeiden lukum\u00e4\u00e4r\u00e4 nousi 8.389.037
  kappaleeseen sek\u00e4 A- ja B-osakkeiden yhteens\u00e4laskettu lukum\u00e4\u00e4r\u00e4
  12.264.537 kappaleeseen. Osakep\u00e4\u00e4t\u00f6maa kasvoi 340.000 eurolla (FIM
  2 Mmk). Uudet osakkeet oikeuttivat t\u00e4yteen osinokoon 1.1.1999 alkaneeelta tilikaudelta
  lukien. Osakkeet tuottivat muut oikeudet osakep\u00e4\u00e4t\u00f6man korottamisen
  rekister\u00f6innist\u00e4 lukien. Osakkeenomistajien lukum\u00e4\u00e4r\u00e4 kasvoi
  l\u00e4hes 3000:een. Saadut varat tultaan k\u00e4ytt\u00e4m\u00e4\u00e4n kansainv\u00e4lisen
  markkinoinnin ja huoltotoiminnan vahvistamiseen sek\u00e4 poikkitieteellisen tutkimusty\u00f6n,
  tuotekehityksen ja tuotannon edelleenkehitt\u00e4miseen.\\n\\nHelsingin P\u00f6rssi
  on antanut sis\u00e4piiriohjes\u00e4\u00e4nn\u00f6n, joka on tullut voimaan 1.3.2000.
  Biohit on kuitenkin ryhtynyt noudattamaan mainittua ohjes\u00e4\u00e4nt\u00f6\u00e4
  jo yhti\u00f6n listautumishetkest\u00e4 eli 18.6.1999 lukien.\\n\\nNESTEANNOSTELU\\n\\nTutkittavien
  n\u00e4ytteiden ja reagenssien tarkka annostelu ja mittaaminen ovat luotettavien
  analysointitulosten saannin perusedellytys. Viel\u00e4 1970-luvulla nestetii mitattua
  ja siirrettiin imem\u00e4ll\u00e4 k\u00e4ytt\u00e4en lasipipettej\u00e4 l\u00e4hes
  kaikissa laboratorioissa. Tri Suovaniemen 1960-luvun lopussa keksimist\u00e4 s\u00e4\u00e4dett\u00e4vist\u00e4
  yksi- ja monikanavaisista pipeteist\u00e4 (Finnpipette*) tuli esimerkki mekaanisten
  nesteannostelijoiden valmistajille maailmassa. T\u00e4t\u00e4 esimerkki\u00e4 on
  hy\u00f6dynnetty niin laajalti, ett\u00e4 sit\u00e4 voi perustellusti kutsua teolliseksi
  standardiksi.\\n\\nBiohitin kehitt\u00e4mist\u00e4 yksi- ja monikanavaisista elektronisista
  pipeteist\u00e4 on muodostunut toinen nesteannostelun tekninen standardi. Biohitin
  innovatiivisissa nesteannostelutuotteissa on kiinnitetty erityist\u00e4 huomiota
  k\u00e4ytt\u00e4j\u00e4yst\u00e4v\u00e4llisyyteen, ergonomiaan sek\u00e4 nesteenk\u00e4sittelyn
  tehokkuuteen ja turvallisuuteen.\\n\\nBiohit Proline \u2013nesteannostelijoiden
  tuotevalikoima on t\u00e4ll\u00e4 hetkell\u00e4 laajin maailmassa. Valikoima k\u00e4sitt\u00e4\u00e4
  elektroniset ja mekaaniset pipetit, kertak\u00e4ytt\u00f6iset pipetin k\u00e4rijet
  ja dekontaminointituotteet. T\u00e4m\u00e4n lis\u00e4ksi Biohit tarjoaa jakelu-
  ja ty\u00f6t\u00e4ryitysverkostonsa kautta huolto-, kalibrointi- ja koulutuspalveluita.
  Biohitin nesteannostelutuotteet ovat kansainv\u00e4listen laatustandardien mukaiset
  ja niille on my\u00f6nnetty GS- ja CE-sertifikaatit.\\n\\nMarkkinat\\n\\nNesteannostelijoiden
  ja niiden kertak\u00e4ytt\u00f6isten k\u00e4irkien markkinoiden maailmanlaajuinen
  v\u00e4hitt\u00e4isarvo on yli FIM 2 mrd. Mekaanisten pipettien vuotuiset kokonaismarkkinat
  ovat suuruudeltaan yli 1.000.000 kappaletta ja elektronisten n. 30.000 yksikk\u00f6\u00e4.
  Elektronisten pipettien markkinat ovat kuitenkin vasta kasvunsa alkuvaiheessa kasvun
  ollessa n. 20-30% vuosittain, kun taas mekaanisten pipettien myyntim\u00e4\u00e4r\u00e4t
  kasvavat n. 5% vuodessa. Voi olettaa, ett\u00e4 laboratorioiden tiukentuvat turvallisuus-,
  laatu- ja tehokkuusvaatimuksit lis\u00e4\u00e4v\u00e4t merkitt\u00e4v\u00e4sti elektronisten
  pipettien kysynt\u00e4\u00e4 tulevaisuudessa.\\n\\nBiohit on t\u00e4ll\u00e4 hetkell\u00e4
  elektronisten pipettien maailmanlaajuinen markkinajohtaja n. 70%-n markkinasuodullana.
  Mekaanisten pipettien osalta Biohitill\u00e4 on n. 8%-n ja kertak\u00e4ytt\u00f6k\u00e4irkien
  osalta n. 1,5%-n maailmanmarkkinasuus*.\\n\\nElektroniset nesteannostelijat\\n\\nElektronisissa
  nesteannostelijoissa elektroniikka, optiikka, hienomekaniikka ja materiaaliteknologia
  yhdistyv\u00e4t tavalla, joka monin tavoin tehostaa nesteenk\u00e4sittely\u00e4
  ja parantaa ty\u00f6skentelyn ergonomiaa. Mikroprosessori-ohjausksesta ansioista
  elektroniset pipetit v\u00e4hent\u00e4v\u00e4t k\u00e4ytt\u00e4j\u00e4st\u00e4 aiheutuvia
  virheit\u00e4 sek\u00e4 parantavat nesteenk\u00e4sittelyn tarkkuutta ja toisittavuutta.\\n\\nElektronisia
  Biohit Proline \u2013nesteannostelijoita on saatavilla yksi- ja monikanavaisina
  malleina, jotka kattavat tilavuusalueet 0.2 \u00b5l - 25 ml. Annostelijat edustavat
  tarkkuuden, ergonomian ja toimivuuden kannalta uutta nesteenk\u00e4sittelyteknologiaa.
  Biohitin elektronisten pipettien ergonominen muotoilu ja niiden kevyes v\u00e4hent\u00e4v\u00e4t
  merkitt\u00e4v\u00e4sti ty\u00f6skentelyst\u00e4 aiheutuvaa rasitusta ja t\u00e4ten
  ennaltaehk\u00e4isev\u00e4t yl\u00e4raajojen v\u00e4symist\u00e4 ja ty\u00f6per\u00e4isten\\n\\n---\\n\\n*
  Finnpipette on Labsystems Oy:n rekister\u00f6im\u00e4 tuvaramerkki.\\n\u2020 Merita
  Corporate Finance Oy (1999), Biohit Oy:n tarjousesite, 31.5.:33.\\n\u2021 Merita
  Corporate Finance Oy (1999), Biohit Oy:n tarjousesite, 31.5.:33.\\n\u00b9 1 \u00b5l
  = yksi miljoonanosaa litra.\\n\\nrasitusvammojen syntyy. Esimerkiksi, voima, joka
  vaaditaan mekaanisen pipetin k\u00e4ytt\u00e4miseen vastaa usean kilogramman suuruisen
  painon liikututtamista peukalolla. Elektronisen pipetin k\u00e4ytt\u00f6 sen sijaan
  vaatii ainoastaan 50. osan t\u00e4st\u00e4 voimasta.\\\\textsuperscript{10,11,12,13,14,15}
  Hoskins et al:n mukaan yhdysvaltalainen Occupational Safety and Health Administration
  (OSHA) on todennut, ett\u00e4 toistuvasta liikkeest\u00e4 johtuvat rasitusvammoat
  ovat yleisin ty\u00f6per\u00e4isten sairauksien muoto\\\\textsuperscript{16}.\\n\\nAutomaattisiin
  laboratorioinstrumentteihin ja analysaattorij\u00e4rjestelmiin liitett\u00e4viin
  elektronisten nesteannostelijoiden sovellusten sek\u00e4 laboratorioiden lis\u00e4\u00e4ntyvien
  turvallisuus- ja laatuvaatimusten voi olettaa lis\u00e4\u00e4v\u00e4n merkitt\u00e4v\u00e4sti
  elektronisten nesteannostelijoiden kysynt\u00e4\u00e4. Ty\u00f6turvallisuusn\u00e4k\u00f6kohtien
  lis\u00e4ksi mikroprosessoriohjauksensa ansioista elektroninen annostelija on eritt\u00e4in
  monipuolinen ty\u00f6v\u00e4line; yksi annostelija mahdollistaa pipetoinnin, sarja-annostelun
  ja laumennuksen, mink\u00e4 lis\u00e4ksi elektronista annostelijaa voi k\u00e4ytt\u00e4\u00e4
  nesteiden sekoittamiseen.\\n\\nBiohit on t\u00e4ll\u00e4 hetkell\u00e4 elektronisten
  pipettien maailmanlaajuisen markkinajohtaja n. 70%:n markkinaosuudellaan\\\\textsuperscript{17}.
  T\u00e4m\u00e4n lis\u00e4ksi Biohit on maailman johtava elektronisten OEM-pohjaisen
  nesteannostelijoiden valmistaja. Yhti\u00f6n OEM-asiakaskuntaan kuuluvat mm. Becton
  Dickinson, bioM\u00e9rieux, Eppendorf, Johnson & Johnson and 3M.\\n\\nBiohit on
  elektronisten pipettien maailmanmarkkinajohtaja. Biohitin elektronisten pipettien
  erinomainen ergonomia ennaltaehk\u00e4isee ty\u00f6per\u00e4isten k\u00e4den rasitusvammojen
  syntyt\u00e4. Mikroprosessoriohjaus parantaa tuottavuutta ja Pipetointitarkeutta
  sek\u00e4 helpottaa ty\u00f6skentely\u00e4.\\n\\n**Mekaaniset nesteannostelijat**\\n\\nMekaaniset
  nesteannostelijat ovat edelleen laboratorioiden k\u00e4ytetyimpia ty\u00f6kaluja.
  Mekaanisten annostelijoiden suosioon vaikuttavat k\u00e4ytt\u00e4jien totumus sek\u00e4
  annostelijan edullisempi hinta elektroniseen pipettiin verrattuna. Mekaaninen Biohit
  Proline \u2013tuoteperhe k\u00e4sitt\u00e4\u00e4 kiinteit\u00e4-lavuukset ja s\u00e4\u00e4dett\u00e4v\u00e4t
  yksi- ja monikanavaiset mallit tilavuusalueille 0,1 \u00b5l \u2013 5 ml. Annostelijoiden
  keveys ja sujuva m\u00e4nn\u00e4n liike helpottavat ty\u00f6skentely\u00e4 sek\u00e4
  v\u00e4hent\u00e4v\u00e4t mahdollisten pitk\u00e4kestoisesta pipetoinnista aiheutuvien
  rasitusvammojen synty\u00e4.\\n\\nBiohitin mekaanisten pipettien valikoima on laajin
  maailmassa.\\n\\nBiohitin nestetestiprosessi ja kalibrointilaboratorio on FINASin
  akkreditoima. Biohitill\u00e4 on tekninen valmius my\u00f6nt\u00e4\u00e4 pipeteille
  kalibrointidistuksesta, jotka voidaan j\u00e4ljit\u00e4\u00e4 kansallisten ja kansainv\u00e4listen
  (EN 45001) standardien mukaisesti. Biohitill\u00e4 on yksi harvoista akkreditoitujista
  laboratorioista maailmassa.\\n\\n\\\\textsuperscript{10} Suovaniemi, O. (1994).
