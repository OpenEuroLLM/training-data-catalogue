  kolmannen osapuolen yllap\u0308 itotavan mukaisesti. Rekisterin kay\u0308 tto \u0308on
  ohjeistettu. Paa\u0308 s\u0308 y rekisteritietoja sisal\u0308tav\u0308 aa\u0308
  n\u0308 tietokantaan on rajoitettu seka \u0308verkkotekniikan etta \u0308henkilok\u0308
  ohtaisten kay\u0308 ttaj\u0308at\u0308unnusten ja salasanojen avulla. Rekisterin
  kay\u0308 ttoo\u0308 ikeus on tapahtumaa jar\u0308 jestav\u0308 illa \u0308toimihenkiloi\u0308lla.\u0308
  Rekisterin yllap\u0308 ito- oikeudet on rajoitetulla joukolla toimihenkiloi\u0308ta,\u0308
  joiden toimenkuvaan jar\u0308 jestelma\u0308n yllap\u0308 ito kuuluu. Toimikauden
  paa\u0308 t\u0308tyessa,\u0308 rekisterien ylla\u0308pitaj\u0308illa \u0308on velvollisuus
  siirtaa\u0308 \u0308rekisterien kay\u0308 ttoo\u0308 ikeudet seuraajilleen ja samalla
  poistaa asianmukaisesti itseltaa\u0308 n\u0308 kay\u0308 ttoo\u0308 ikeudet (tai
  pyyta\u0308a \u0308niiden poistoa). |\\n| 10 Tarkastusoikeus | Rekisteriss\u00e4
  olevalla on oikeus tietojensa tarkastukseen korvauksetta kerran vuodessa. Sen, joka
  haluaa tarkastaa itse\u00e4\u00e4n koskevat tiedot, on esitett\u00e4v\u00e4 t\u00e4st\u00e4
