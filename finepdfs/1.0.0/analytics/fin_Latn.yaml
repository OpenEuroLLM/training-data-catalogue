  puhelin: 040 3585417 ella.tanskanen(a)hel.fi\\n\\n11 (11)\"", "\"Vuosittainen Min\u00e4
  Olen -messut lukeutuu maamme tunnetuimpiin kokonaisvaltaisen hyvinvoinnin tapahtumiin.\\n\\nFinlandia-talossa
  9-10.2.2019 jo 24. kertaa j\u00e4rjestett\u00e4v\u00e4 alan suurkatselmus tarjoaa
  t\u00e4n\u00e4kin vuonna monipuolista ohjelmaa kahden p\u00e4iv\u00e4n ajan nelj\u00e4ss\u00e4
  kerroksessa, nelj\u00e4ss\u00e4 salissa muutaman kansainv\u00e4lisen sek\u00e4 lukuisten
  kotimaisten alansa eturivin nimien johdolla.\\n\\nMy\u00f6t\u00e4tunto on p\u00e4iv\u00e4n
  sana ja my\u00f6s yritykset ovat her\u00e4nneet sen merkitykseen p\u00e4ivitt\u00e4isess\u00e4
  kommunikaatiossa. My\u00f6t\u00e4tuntotaitojen kehitt\u00e4misen my\u00f6t\u00e4
  organisaatioista on saatu tehokkaampia ja ty\u00f6hyvinvointia parannettua. Messuilla
  my\u00f6t\u00e4tunnosta esitelm\u00f6i sen johtava tutkija suomessa, Helsingin yliopiston
  professori Anne Birgitta Pessi.\\n\\nMy\u00f6t\u00e4tunto on my\u00f6s osana koulutus-
  ja opetusalan ammattilaisille suunnitellussa kokonaisuudessa, jota vet\u00e4v\u00e4t
  Professori/tietokirjailija Kirsti Lonka, Lyhytterapiainstituutin toimitusjohtaja
  Maiju Ahola, Kehoterapeutti Tuula Styrman ja Hyvinvoivan ja My\u00f6t\u00e4tuntoisen
  koulukulttuurin kehitt\u00e4mishankkeen johtaja Viivi Pentik\u00e4inen.\\n\\nMessuilla
  on ohjelmassa my\u00f6s runsas tarjonta kokonaisvaltaista hyvinvointia. Etenkin
  ravinnon merkityksest\u00e4 terveyteemme saa messuilta mittavan tietopaketin. L\u00e4\u00e4kkeet\u00f6n
  el\u00e4m\u00e4 -kirjan kirjoittanut l\u00e4\u00e4k\u00e4ri Antti Heikkil\u00e4,
  ravintoterapeutti ja Biohakkeri Jaakko Halmetoja sek\u00e4 itsens\u00e4 johtamisen
  valmentaja Ilkka Koppelom\u00e4ki eiv\u00e4t j\u00e4t\u00e4 ket\u00e4\u00e4n kylm\u00e4ksi
  ohjatessaan ihmisi\u00e4 tekem\u00e4\u00e4n el\u00e4m\u00e4ntaparemontin.\\n\\nAntioksidanttiklinikan
  l\u00e4\u00e4k\u00e4ri Pyry Suonsivu valottaa tutkittua tietoa hivenaineiden ja
  vitamiinien merkityksest\u00e4 terveyteemme. Pyry kohautti suomalaisia jo toimiessaan
  Raahen Kaupunginhallituksen puheenjohtajana, kun h\u00e4n ehdotti Raahen kouluruokailussa
  siirtymist\u00e4 margariinista voihin. Pyryn luento sis\u00e4lt\u00e4\u00e4 huumorilla
  maustettua faktatietoa, jolla tyrm\u00e4t\u00e4\u00e4n useita \\\"oletettuja totuuksia\\\".\\n\\nMielen,
  kehon ja sielun yhteys on ymm\u00e4rretty jo tuhansia vuosia, ja Min\u00e4 Olen
  \u2013 messutapahtuma tarjoaa oivat puitteet tutustua kokonaisvaltaisen itsehoidon
  maailmaan lukuisista eri n\u00e4k\u00f6kulmista. N\u00e4ytteilleasettajia messuilla
  on vuosittain yli 200.\\n\\nLis\u00e4tietoja:\\n\\nTeppo Ahom\u00e4ki, gsm: 050-2715,
