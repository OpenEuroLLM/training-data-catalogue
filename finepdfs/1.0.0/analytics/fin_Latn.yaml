  109,611  | 140,144  | 103,521  |\\n\\nTULOSLASKELMAN JA TASEEN LIITETIEDOT\\n\\n1.
  TILINP\u00c4\u00c4T\u00d6KSEN LAADINTAPERIAATTEET\\n\\nTilinp\u00e4\u00e4t\u00f6s
  on laadittu Suomen kirjanpitolain mukaisesti.\\n\\nKun tilinp\u00e4\u00e4t\u00f6st\u00e4
  laaditaan hyv\u00e4n kirjanpitotavan mukaisesti, yhti\u00f6n johto joutuu tekem\u00e4\u00e4n
  arvioita ja oletuksia, jotka vaikuttavat tilinp\u00e4\u00e4t\u00f6ksen sis\u00e4lt\u00f6\u00f6n.
  Lopputulotemat voivat poiketa n\u00e4ist\u00e4 arviointista.\\n\\nTilinp\u00e4\u00e4t\u00f6stiedot
  esitett\u00e4in Suomen markkinoina, ja ne perustuvat liiketapahtumien alkuper\u00e4isiin
  arvoihin.\\n\\nARVOSTUS- JA JAKSOTUSPERIAATTEET\\n\\nK\u00e4ytt\u00f6omaisuuden
  arvostus\\n\\nK\u00e4ytt\u00f6omaisuus on merkitty taseeseen hankintamenoon v\u00e4hennetty\u00e4
  suunnitelman mukaisilla poistoilla. Suunnitelmanmukaiset poistot on laskettu tasapainoina
  k\u00e4ytt\u00f6omaisuusessineiden taloudellisen pitojajan perusteella.\\n\\nSuunnitelmanmukaiset
  poistoajat ovat:\\n\\n| Aineettomat oikeudet | 5\u201310 v |\\n|----------------------|--------|\\n|
  Konserniliikearvo     | 5\u20137 v  |\\n| Muut pitk\u00e4vaikutteiset menot | 5\u201310
  v |\\n| Koneet ja kalusto     | 3\u201310 v |\\n\\nEnnen vuotta 1998 aktivoiduista
  tuotekehitysmenoista on tehty vuonna 1998 alkuper\u00e4isen poistosuunnitelman mukainen
  10 %:n tasapaino ja sen lis\u00e4ksi varovaisuuden periaatteen mukaisesti 4,4 Mmk:n
  suuruisen kertaluonteinen poisto. 31.12.1998 kehitt\u00e4mismenojen poistamaton
  hankintameno oli konsermissa 6,8 Mmk ja enonyhti\u00f6ss\u00e4 6,0 Mmk. N\u00e4ist\u00e4
  on vuonna 1999 poistettu 50% ja loppu 50% tullaan poistamaan tilikauden 2000 aikana.\\n\\nLocus
  genex Oy:\u00f6\u00f6n liittyv\u00e4 konsernilikearvo poistetaan 7 vuoden aikana.
  Viiden vuoden poistoajasta on poikettu, koska investointi on luonteehtaan pitk\u00e4aikainen
  ja yhti\u00f6n l\u00e4hiuvoina markkinoille tulevien p\u00e4\u00e4tuotteiden elinik\u00e4
  on v\u00e4hint\u00e4\u00e4n 7 vuotta.\\n\\nVaihto-omaisuuden arvostus\\n\\nVaihto-omaisuus
  esitet\u00e4\u00e4n fifo-periaatteen mukaisesti hankintamenon tai sit\u00e4 alempaan
  j\u00e4lleenhankintahinnan tai todenn\u00e4k\u00f6isen myyntihinnan m\u00e4\u00e4r\u00e4isena.
  Vaihto-omaisuuden arvoon on sis\u00e4llytetty muuttuvien menojen lis\u00e4ksi niiden
  osuus hankinnan ja valmistuksen kiinteist\u00e4 menoista.\\n\\nKehitt\u00e4mismenot\\n\\nAineettomiin
  hy\u00f6dykkeisiin sis\u00e4ltyy ennen vuotta 1998 aktivoiduja kehitt\u00e4mismenoja
  konsermissa 3,4 Mmk ja enonyhti\u00f6ss\u00e4 3,0 Mmk. Tutkimus- ja tuotekehitysmenot
  on kirjattu vuosikuluksi vuodesta 1998 l\u00e4htien. Aktivoidut kehitt\u00e4mismenot
  kohdistuvat p\u00e4\u00e4asiassa s\u00e4hk\u00f6pippettiin kehitystoimintaan.\\n\\nTuloutusperiaate\\n\\nLiikevaihtoa
  laskettaessa myyntituotoista v\u00e4hennet\u00e4\u00e4n myynnin v\u00e4lilliset
  verot ja alennukset. Suoriteidien myynti on tuloutettu niiden luovutusten yhteydess\u00e4.\\n\\nKunnossapito
  ja korjaukset\\n\\nKunnossapito- ja korjausmenot kirjataan tilikauden kuluki. Vuokrattujen
  toimitilojen peruskorjausmenot on aktivoitu muuhin pitk\u00e4vaikutteisiin menoihin
  ja poistetaan tasapainoin 8 vuoden vuokrakautena.\\n\\nEl\u00e4kemenojen jaksotus\\n\\nLakis\u00e4\u00e4teinen
  elaketurva mahdollisine lis\u00e4suutuneen on vakuutettu el\u00e4kevakuutusyhti\u00f6iss\u00e4.
  El\u00e4kemenot kirjataan ty\u00f6ntekij\u00f6iden ty\u00f6ss\u00e4oloiakuna suoriteperusteisesti.\\n\\nValuuttaom\u00e4\u00e4r\u00e4iset
  er\u00e4t\\n\\nUlkomankaanrahan m\u00e4\u00e4r\u00e4iset saamiset ja velat on muutettu
  Suomen markkinoiksi tilinp\u00e4\u00e4t\u00f6s p\u00e4iv\u00e4n Suomen Pankin noteeraamaan
  kursseihin. K\u00e4ytt\u00f6omaisuuden hankintaan liittyvill\u00e4 kurssierroilla
  on oikaistu k\u00e4ytt\u00f6omaisuuden hankintamenoa.\\n\\nKONSERNITILINP\u00c4\u00c4T\u00d6KSEN
  LAADINTAPERIAATTEET\\n\\nKonsernitilinp\u00e4\u00e4t\u00f6ksen laajuus\\n\\nKonsernitilinp\u00e4\u00e4t\u00f6s
  sis\u00e4lt\u00e4\u00e4 enonyhti\u00f6 Biohit Oyj:n sek\u00e4 kaikki ne yhti\u00f6t,
  joista konsermissa on yli 50 % \u00e4\u00e4nivallasta. Tyt\u00e4ryhti\u00f6t on
  sis\u00e4llytetty konsernitilinp\u00e4\u00e4t\u00f6kseen niiden hankintahetkest\u00e4
  l\u00e4htien.\\n\\nSis\u00e4inen osakkeenomistus\\n\\nKonsernitilinp\u00e4\u00e4t\u00f6s
  on laadittu hankintamenometelm\u00e4ll\u00e4. Tyt\u00e4ryhti\u00f6iden hankintamenon
  ja hankittua osuutta vastaavaan oman p\u00e4\u00e4omian ero on esitetty konsernilikearvon.\\n\\nSis\u00e4iset
  liiketapahtumat ja katteet\\n\\nKonsernin sis\u00e4iset liiketapahtumat, sis\u00e4isten
  toimitusten realisoitumattomat katteet, sis\u00e4iset saamiset ja velat samoin kuin
  sis\u00e4inen voitonjakso on eliminoitu konsernitilinp\u00e4\u00e4t\u00f6ksess\u00e4.\\n\\nMuuntoerot\\n\\nUlkomaisen
  konsernyhti\u00f6iden tuloslaskelmat on muutettu Suomen markkinoiksi tilikauden
  keskikursseihin ja taseet tilinp\u00e4\u00e4t\u00f6s p\u00e4iv\u00e4n kursseihin.
  Muuntamisessa syntyneet muuntoerot samoin kuin omien p\u00e4\u00e4omien muuntoerot
  on esitetty konsernitilinp\u00e4\u00e4t\u00f6ksess\u00e4 er\u00e4ss\u00e4 \\\"Edellisten
  tilikausien tappio\\\".\\n\\n2. TULOSLASKELMAN LIITETIEDOT\\n\\n2.1. Liikevaihto
