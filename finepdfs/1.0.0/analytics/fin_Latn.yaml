  "\"Moottoriurheilukeskuksen aluetta koskevat kaavat\\n\\nPohjois-Savon maakuntakaava\\n\\n-
  Ampumarata ja/tai moottoriurheilualue EA1/ea1\\n\\nMerkinn\u00e4ll\u00e4 osoitetaan
  valtakunnallista, maakunnallista ja seudullista merkityst\u00e4 omaavat ampumarata-alueet,
  ajoharjoitteluradat ja moottoriurheilualueet.\\n\\nSuunnittelum\u00e4\u00e4r\u00e4ys:
  Toiminnasta aiheutuvan meluhaitan vuoksi ei melualueelle tule sijoittaa uusia asuinrakennuksia
  tai muuta melulle herkk\u00e4\u00e4 toimintaa. Ampumarataalueilla toiminnot tulee
  sijoittaa siten, ett\u00e4 toiminnasta ei aiheudu siihen rajautuvilla alueilla maaper\u00e4n
  tai pohjaveden pilaantumisvaaraa.\\n\\nVarkauden moottoriurheilukeskus on rataluokitukseltaan
  merkitty valtakunnallisesti merkitt\u00e4v\u00e4ksi.\\n\\nOte yhdistelm\u00e4maakuntakaavasta.\\n\\nVarkauden
  kaupungin keskusta-alueen strateginen yleiskaava 2030\\n\\nHyv\u00e4ksytty kaupunginvaltuustossa
  27.3.2017\\n\\no Erityisalue\\no Seveso-konsultointivy\u00f6hyke; Harkittaessa rakennushankkeen
  sijoittamista ja rakennuspaikan soveltuvuutta on huolehdittava vaarallisista aineista
  aiheutuvan suuronnettomuusvaaran torjumiseksi riitt\u00e4vist\u00e4 suojaet\u00e4isyyksist\u00e4
  ja muista pelastustoimen asettamista velvoitteista. (huom. Seveso-rajaus muuttunut
  strategisen yleiskaavan hyv\u00e4ksymisen j\u00e4lkeen, ajantasainen rajaus tarkistettava
  Tukesin sivuilta)\\n\\nOte strategisesta yleiskaavasta\\n\\nLuttila-Pussilanjoki-Lapinm\u00e4ki-Puurtila
  osayleiskaava\\n\\nEM Moottoriurheilualue\\n\\nsaa-1 PUHDISTETTAVA / KUNNOSTETTAVA
  MAA-ALUE.\\n\\nAlueella ei saa tehd\u00e4 kaivamista, massojen siirtoa tai rakentamista
  ennen kuin maaper\u00e4 on tutkittu ja tarpeen mukaan puhdistettu.\\n\\nme 55dBa
  MELUALUEEN RAJA.\\n\\nMerkinn\u00e4ll\u00e4 osoitetaan ne alueet, joiden melutaso
  ylitt\u00e4\u00e4 ennustetulla liikennem\u00e4\u00e4r\u00e4ll\u00e4 valtioneuvoston
  meluntorjuntalain nojalla antamassaan p\u00e4\u00e4t\u00f6ksess\u00e4 annetut melutason
  ohjearvot. Luku merkinn\u00e4n yhteydess\u00e4 osoittaa alueen, jolla melutaso ylitt\u00e4\u00e4
  sallitun p\u00e4iv\u00e4melun ohjearvon (55dB).\\n\\nAlueelle ei saa sijoittaa uusia
  asuinrakennuksia tai muita toimintoja, jotka ovat herkki\u00e4 melun haittavaikutuksille.
  Alueella olevia asuinrakennuksia saa peruskorjata, laajentaa ja korvata uusilla\\n\\nOte
  Luttila-Puurtila osayleiskaavasta\"", "\"Lakeuden Risti\\n\\nSein\u00e4joen seurakunnan
  tiedotuslehti jokaiseen kotiin\\n\\nNro 1 / 2015 37. vsk\\n\\nUusi kirkkoneuvosto
  sivu 12\\nKastepuuun lehti\u00e4 sivu 5\\nRistin tie 27.3. sivu 14\\n\\nYhteisvastuu-asiaa
  sivut 7-9 ja 15\\n\\nHerk\u00e4ksi tee syd\u00e4meni ett\u00e4 toiset huomaisin...\\nVirsi
  439:3\\n\\nKukkaronvartija vaihtuu\\n\\nKukkaronvartija vaihtuu loppuvuoden ajaksi.
  Hallintojohdaja Titta Luoma-Kohtalan j\u00e4\u00e4dess\u00e4 virkaavapale kirkkoneuvosto
  on valinnut minun h\u00e4nen sijaisenkin viiden vuoden lopussa. V\u00e4lisen\u00e4
  virkani on Alavuden seurakunnassa, miss\u00e4 olen hoitanut talousp\u00e4\u00e4llik\u00f6n
  teht\u00e4v\u00e4\u00e4 muutaman vuoden ajan. Olen t\u00e4m\u00e4n vuoden ajan sielt\u00e4
  virkavapalla ja hoidan hallintojohdajan sijaisuutta t\u00e4ll\u00e4 Sein\u00e4joen
  seurakunnassa.\\n\\nJo n\u00e4iden muutaman viikon alkuun olisin halunnut hyv\u00e4ksi
  taittuen siit\u00e4, kuinka monenlaisia ja eri lenkint\u00f6ist\u00e4 hallintojohdajan
  ty\u00f6 on suuressa seurakunnassa. Olen kiitollinen, ett\u00e4 tiiminni kuuluu
  eri ammattialojen asiantuntijoita, joiden kanssa yhdess\u00e4 voimme tutkipalvelujen
  kautta kehitt\u00e4\u00e4 seurakunnan toimintaa. Toivon, ett\u00e4 toimivat tutkipalvelut
  mandoilistavat ja niit\u00e4 osallistutaan seurakunnan perusteell\u00e4ni eli hellgellisen
  ty\u00f6n totuttamista.\\n\\nOn ollut ilo huomata, ett\u00e4 Sein\u00e4joen seurakunnan
  talous on kunnossa. T\u00e4k\u00e4na on muutamaa haasteellista vuosia, joten t\u00e4ytyy
  olla kiitollinen siit\u00e4, ett\u00e4 t\u00e4\u00e4ll\u00e4 on tehty hyv\u00e4\u00e4
  ja maaratietoisia toimia ajan mukaan. T\u00e4m\u00e4 ei olisi ollut mahdollista,
  ellei koko henkil\u00f6kunta olisi sitoutunut talkoissiin. Kiitos t\u00e4st\u00e4
  kuuluu kaikille. Vuoden 2014 tilinp\u00e4\u00e4t\u00f6ksen valmistelu on k\u00e4ynnis\u00e4,
  eiv\u00e4tk\u00e4 lupailleet luvut ole viel\u00e4 tiedossa. Jo nyt voidaan kuitenkin
  sen varan todeta, ett\u00e4 tulee on v\u00e4sin-t\u00e4in\u00e4 pyydyst\u00e4v\u00e4,
  ellei jopa hyv\u00e4.\\n\\nVuosi on varmasti liian lyhyt aika siihen, ett\u00e4
  oppisin edes kasvoita tunnistamaan koko henkil\u00f6kuntaa ja luottamuksenhiil\u00f6t\u00e4,
  seurakuntalaistasi puhumatta kaan. Siirtyminen sek\u00e4 henkil\u00f6kunnasta ett\u00e4
  seurakunnan j\u00e4senm\u00e4\u00e4r\u00e4n osalta viisi kertaa suurempaan seurakuntaan
  tuonee t\u00e4h\u00e4n liian suuria haasteita. Tulkaa silti rohkeasti esitt\u00e4ytym\u00e4\u00e4n!
  Toivottavasti tavataan Sein\u00e4joen seurakunnassa eri yhteyksiss\u00e4.\\n\\nOlen
  kiitollinen, ett\u00e4 tiiminni kuuluu eri ammattialojen asiantuntijoita, joiden
  kanssa yhdess\u00e4 voimme tutkipalvelujen kautta kehitt\u00e4\u00e4 seurakunnan
  toimintaa.\\n\\nPaula Per\u00e4l\u00e4mpi vs. hallintojohdaja\\n\\nVirsimaraton
  2/4 Sein\u00e4joen seurakunnassa\\n\\nVirsimaraton j\u00e4rjestettiin viime kev\u00e4\u00e4n\u00e4
  ja se jatkuu Sein\u00e4joen seurakunnassa kaikkilla alueilla sunnuntaina 8.3.2015.\\n\\nVuosi
  sitten aloitettua virsinenmaratonin Sein\u00e4joen seurakunnassa veistattiin nelj\u00e4sosa
  virsikirja virtaa. T\u00e4n\u00e4 vuonna jatketaan seuraavalla nelj\u00e4sosalla
  ja numerosta 1 Hooisanna aloittaavat normaaliset. Kahden vuoden kuluttua jokaisessa
  seurakunnassa on veistattu koko virsikirja l\u00e4pi. Virsikirjassa on yhteens\u00e4
  632 virrta.\\n\\n150 virrasta on veistetty yhteen p\u00e4iv\u00e4ksi kulun noin
  9-10 tunnia virsinen s\u00e4keist\u00e4m\u00e4st\u00e4 riippuen. Kanttoriot ovat
  s\u00e4\u00e4st\u00e4m\u00e4ss\u00e4 ja joka tunnille on kutsutu kuoro kiritt\u00e4m\u00e4\u00e4n
  laulua, joten yksin ei kenenk\u00e4\u00e4n tarvitse veistata ja kaveria kannustetaan
  jaksamaan.\\n\\nJos airot urakoikaa pidemp\u00e4\u00e4 kerrotaa, ett\u00e4 kahta
  haastetta on ottaa omalle vauhtikseen. Joka seurakunnassa on tarjolla kaikille osallistujille
  pirist\u00e4in kahvia, tee\u00e4, mehua ja pikkuileip\u00e4\u00e4. Taapahumaan voi
  kiireht\u00e4\u00e4 oman aikataulun mukaan. T\u00e4t\u00e4 maratonia ei tarvitse
  suorittaa kerralla vaan voi esimerkiksi tulla tunniksi laulamaan, k\u00e4yd\u00e4
  v\u00e4lill\u00e4 kotona tanakkakseen tai juuri ilmenn\u00e4 uudestaan. Viime vuonna
  muutama seurakuntalainen jaksoi laulaa koko p\u00e4iv\u00e4n kerraltaan!\\n\\nVirret
  alueittain:\\n1\u2013158 Nurmo\\n159\u2013316 Ylistaro\\n317\u2013474 Sein\u00e4joen
  alueurakunta\\n475\u2013632 Per\u00e4sein\u00e4joki\\n\\nVirsimaratonin ohella tapahtuu:\\n\\nSein\u00e4joella
  8.3. Meid\u00e4n sunnuntai, messu Lakeuden Ristiss\u00e4 klo 10 toteutetaan virsimessuna,
  jossa virsi\u00e4 k\u00e4ytet\u00e4\u00e4n uudella ja ehk\u00e4 pit\u00e4tt\u00e4v\u00e4ll\u00e4kin
  messussa. Messuun ilkeen keittoluoitus ja kahvit seurakuntakeskuksessa, vapaaehtoinen
  maksu. Lis\u00e4ksi meid\u00e4n seurakuntamme ohjelmassa on virsimessu klo 12 lasten
  virret \u2013 lauluhetki, yks\u00e4li 4. Klo 12.30 rakkaus virsist\u00e4, tuustutaan
  yhdess\u00e4 lauluaan ja pohdiskellen, yks\u00e4li.\\n\\nHylykkallion seurakuntakodilla
  Meid\u00e4n sunnuntai 8.3. klo 10 alkavan messun j\u00e4lkeen. Messu Nurmon kirkossa.\\n\\nTerveuloa
  kokemaan virsimessun huimaan laulun, kuunnellen! Jos aikaa ja viiselt\u00e4isyytt\u00e4
  riitt\u00e4\u00e4, aloita veisaaminen yhdest\u00e4 paikasta ja kierra kaikki veisulpakat.\\n\\nKuvat:
  Leena Hautala\\n\\nVirsimaratonin ajat ja paikat:\\n\\nSein\u00e4joki klo 12\u201316
  Lakeuden Risti, klo 16\u2013 seurakuntasali\\nNurmo klo 12\u2013 Hylykkallion seurakuntakoti\\nYlistaro
  klo 11.30\u2013 seurakuntatalo\\nPer\u00e4sein\u00e4joki klo 11.30\u2013 seurakuntatalo\\n\\nVirsimaratonin
  ohella tapahtuu:\\n\\nSein\u00e4joella 8.3. Meid\u00e4n sunnuntai, messu Lakeuden
  Ristiss\u00e4 klo 10 toteutetaan virsimessuna, jossa virsi\u00e4 k\u00e4ytet\u00e4\u00e4n
  uudella ja ehk\u00e4 pit\u00e4tt\u00e4v\u00e4ll\u00e4kin messussa. Messuun ilkeen
  keittoluoitus ja kahvit seurakuntakeskuksessa, vapaaehtoinen maksu. Lis\u00e4ksi
  meid\u00e4n seurakuntamme ohjelmassa on virsimessu klo 12 lasten virret \u2013 lauluhetki,
  yks\u00e4li 4. Klo 12.30 rakkaus virsist\u00e4, tuustutaan yhdess\u00e4 lauluaan
  ja pohdiskellen, yks\u00e4li.\\n\\nHylykkallion seurakuntakodilla Meid\u00e4n sunnuntai
  8.3. klo 10 alkavan messun j\u00e4lkeen. Messu Nurmon kirkossa.\\n\\nTerveuloa kokemaan
  virsimessun huimaan laulun, kuunnellen! Jos aikaa ja viiselt\u00e4isyytt\u00e4 riitt\u00e4\u00e4,
  aloita veisaaminen yhdest\u00e4 paikasta ja kierra kaikki veisulpakat.\\n\\nKuvat:
  Leena Hautala\\n\\nAltarilla\\n\\nT\u00e4m\u00e4 on se sanoma, jonka olemme h\u00e4nnelt\u00e4
  kuuleet ja jonka julistamme teille: Jumala on valo, h\u00e4ness\u00e4 ei ole pimeyden
  h\u00e4iv\u00e4\u00e4.\\n\\n1. Joh. 1:5\\n\\nP\u00e4\u00e4rakko\\n\\nSein\u00e4joella
  6.2.2015\\n\\nLiisa Rantala\\nSein\u00e4joen alueeseurakunnan johtava kappalainen\\n\\nLepo
  vaan\\n\\nJumala loi ajan, mutta ihminen loi kiireen \u2013 v\u00e4itt\u00e4v\u00e4t
  afrikkalaiset todennee n\u00e4in, kun valkoiset miehet rannekelloineen ilmestyiv\u00e4t
  heid\u00e4n maailmaansa.\\n\\nVoihan siin\u00e4 sanomassa olla v\u00e4h\u00e4n per\u00e4jakin.
  Aamuruuhiika on niin lyhyt kuin y\u00f6, t\u00e4rke\u00e4mp\u00e4\u00e4 kuin muuten.
  H\u00e4n riitt\u00e4\u00e4 eteenp\u00e4in vaarallistenkin ohitusten avulla voittaakseen
  aikaa enk\u00e4 per\u00e4ti muutaman sekunnin.\\n\\nMielens\u00e4ni on pitk\u00e4
  lista asioita, jotka aion tehd\u00e4 sitten joskus. Sitten, kun on aikaa.\\n\\nOnneksi
  on asioita, jotka aika hoitaa. Mutta samalla harmitellen, miten paljon hyvi\u00e4
  ja t\u00e4rkeit\u00e4 asioita j\u00e4\u00e4 syrj\u00e4\u00e4n, kun on aina muuta
  kiireett\u00e4.\\n\\nMit\u00e4? Ihmeess\u00e4 meille kaikkien konkien ja keskit\u00f6imij\u00e4n
  keskell\u00e4 voi olla aina kiire jonnekin toisalle! Sen sijaan isovanhempamme eliv\u00e4t
  vaille kaikkia mukavuksia ja k\u00e4det olivat t\u00e4ynn\u00e4 ty\u00f6t\u00e4
  niin kauan kuin valoisaa p\u00e4iv\u00e4\u00e4 riitti.\\n\\nKuitenkin heill\u00e4
  oli aina aikaa ihmisille. He kerkesiv\u00e4t piiputtaa usein tarkistamassa, ett\u00e4
  toisikin mummalla oli kaikki hyvin. Ja kun naapurikyl\u00e4n is\u00e4nt\u00e4 tuli
  k\u00e4v\u00e4isem\u00e4\u00e4n, ei oluttut kirje minnekan. Ehdiittiin kohdata kaikessa
  rauhassa, ja takaisin sai l\u00e4hte\u00e4 mieli paljon kev\u00e4\u00e4mp\u00e4\u00e4n.\\n\\nEi
  se aika varmaan kaikkeen riit\u00e4 t\u00e4n\u00e4k\u00e4\u00e4n vuonna. Mutta jospa
  osaisin aikaa aloittaa niit\u00e4 t\u00e4rkeimmist\u00e4 asioista.\\n\\nUusi tulisi
  kyll\u00e4 vertaa, ett\u00e4 jo muutama muututtu mets\u00e4ss\u00e4 tekee ihmiselle
  hyvi\u00e4. Mit\u00e4 jos kokaisi? Ja sitten: tied\u00e4mme, ett\u00e4 yksin\u00e4isyys
  on yksi ihmisten suurimpia ongelmia. Ket\u00e4h\u00e4n min\u00e4 voisin ilahduttaa
  sill\u00e4, ett\u00e4 l\u00e4hitsin joskus k\u00e4v\u00e4isem\u00e4\u00e4n?\\n\\nMutta
  aivan aluksi ajattelin kokeilla, jos ottaisi k\u00e4skeyn lepop\u00e4iv\u00e4st\u00e4
  tissossaan. Jos k\u00e4visi kirkossa, ja antaisi silla aikaa kokena muun odottaa.
  Alkaisiko siit\u00e4 versoa jotakin el\u00e4m\u00e4\u00e4 suurempaa?\\n\\nVirren
  viem\u00e4\u00e4\\n\\nVarsinaisuomalainen pappi Jaakko Haavio (1904\u20131984) tunnettiin
  sek\u00e4 etev\u00e4n\u00e4 saarnamiehen\u00e4 ett\u00e4 monipuolisena kirjailijana.
  H\u00e4n oli visiirikirjan 1963 hyv\u00e4ksytty\u00e4 lis\u00e4vinkoa valmisteleen
  komitean puheenjohtajana, ja her\u00e4nnieden Siidon virisen uudistus 1970-luvun
  alussa on p\u00e4\u00e4osin h\u00e4nen ty\u00f6t\u00e4\u00e4n. Jaakko Haavion alun
  perin nuoria ajettaen kirjoittamassa aamuvirress\u00e4, leesusta puhutellaan sarjoilla
  \\\"Valkeus iankaikkinen\\\", leesustiin itselleen: \\\"Min\u00e4 olen maailman
  valo. Se, joka seuraa minua, ei kuitenkaan, halua h\u00e4nell\u00e4 on el\u00e4m\u00e4n
  valo.\\\" (Joh. 8:12) T\u00e4t\u00e4 Jeesuksen valon s\u00e4teily\u00e4 pyydett\u00e4en
  ty\u00f6h\u00f6n, vapaa-aikaan ja ihmisten kohtaamiseen. S\u00e4velm\u00e4, pohjoissavolainen
  koraltoisinto, on yhteinen kolmen muun virren kanssa.\\n\\nOlemme kaikki Jumalan
  sel\u00e4n takana\\n\\nJos sanomme, ett\u00e4 joku on Jumalan sel\u00e4n takana,
  tarjoitamme yleens\u00e4 ihmist\u00e4, joka on j\u00e4\u00e4nyt erityisen yksin
  tai paikkaa, joka on kaukana meist\u00e4. Mielell\u00e4ni Jumalan sel\u00e4n takana
  olemisesta on arkiajattelussa kieletein ja v\u00e4heskyv\u00e4\u00e4. Joku on jossain
  niin kaukana tai ep\u00e4toivoinen, ett\u00e4 Jumalakin on k\u00e4\u00e4nt\u00e4nyt
  sel\u00e4n.\\n\\nT\u00e4rkeimm\u00e4n tarkastelutieto tuo tuttu lausundus, ei kerrokanalamaista,
  vaan alvan johdosta. Jokaisen niitt\u00e4m\u00e4n se kertoo, ett\u00e4 Jumalan sel\u00e4n
  takana tarjoita jotkuta, jonka me ihmiset olemme j\u00e4tt\u00e4neet yksin tai se
  tarkoittaa paikkaa, johon me emme halua menn\u00e4. Jumalan sel\u00e4n takana tarkoittaa
  olottaa tai paikkaa, joka on kaukana toisista ihmisist\u00e4 tai kaukana meille
  tutuista ympyr\u00f6ist\u00e4. Laushdukseilla laitamme Jumalan piikiin jotain, mit\u00e4
  itse olemme hyl\u00e4nneet tai mist\u00e4 haluamme pysty\u00e4 kaukana.\\n\\nTodellisen
  Jumalan tai Hanen selk\u00e4ns\u00e4 kanssa lausuhdella ei ole liian taittunut.
  Mielell\u00e4ni Jumalan sel\u00e4n selk\u00e4 on olemassa, mutta onkin enemm\u00e4n
  hyv\u00e4 ja turvallinen, toisin kuin toisten ihmisten sel\u00e4n taakse j\u00e4\u00e4minen.
  Jumalan selk\u00e4 on jotain niin sellit\u00e4m\u00e4tt\u00f6m\u00e4 suurta, eett\u00e4
  kukaan voi joutua sen turvasta pois. Sen taakse mahvatut kaikki. Jumalalle ei mik\u00e4\u00e4n
  paikka ole liian kaukana tai syrj\u00e4ss\u00e4, eik\u00e4 yksik\u00e4\u00e4n ihminen
  arvoton. Jumala ei koskaan hylk\u00e4\u00e4. Jumalan sel\u00e4n takana riitt\u00e4\u00e4
  jokaiselle armoa, sen edess\u00e4 olemme kaikki samavaroisia.\\n\\nT\u00e4st\u00e4
  turvasta, Jumalan sel\u00e4n takaa ja armosta rohkaistuneina on mahdollista l\u00e4hte\u00e4
  kohtaamaan niit\u00e4, jotka ovat j\u00e4\u00e4neet valle toisten ihmisten apua
  tai niit\u00e4, jotka kaipaavat l\u00e4htim\u00e4st\u00e4. T\u00e4h\u00e4n ty\u00f6h\u00f6n
  Jumala meit\u00e4 kutsuu ja saamme ruokilla:\\n\\nHyv\u00e4 Jumala, taivaallinen
  Is\u00e4mmme. Sin\u00e4 valitset usien k\u00e4ytt\u00f6si niit\u00e4, jotka ovat
  pieni\u00e4 ja vastimattomia. Sin\u00e4 osaat voimasi niiss\u00e4, jotka ovat itse
  heikkoa ja voimattomia. Auta meit\u00e4 ymm\u00e4rt\u00e4m\u00e4\u00e4n jotakin
  sinun valtakuntasi salaisuudesta.\\n\\nKiiht\u00e4, ett\u00e4 me kaikki voimme kasvaa
  sinun hoidossasi niihin teht\u00e4viin, joita olet meit\u00e4 varten valmistanut.
  Sin\u00e4 vet meid\u00e4n mahdollisuuteimme, kaikka meid\u00e4n valtakuntamme. Anna
  meid\u00e4n kaikkien yhdess\u00e4 rakentaa sinun valtakuntasi. Kuule rukoulkuntasi
  Jesuksen tahden. Amen.\\n\\nAnna Saaristo\\nSein\u00e4joen alueeseurakunnan seurakuntapastori\\n\\nVastuuta\\n\\nT\u00e4ss\u00e4
  lehdess\u00e4 k\u00e4sitell\u00e4\u00e4n paljon Yhteisvastuuker\u00e4yst\u00e4 ja
  sit\u00e4 mihin ker\u00e4ysen varat suuntautuvat.\\n\\nSein\u00e4joella on er\u00e4iden
  seurosten hoitavat omalla tavallaan t\u00e4t\u00e4 yhteist\u00e4 teht\u00e4v\u00e4\u00e4.
  T\u00e4m\u00e4 vuonna Yhteisvastuuker\u00e4yksen esimiehen\u00e4 on meille sein\u00e4jokelaisille
  ja monille etel\u00e4pohjalaisille tuttu Tapio Luoma, joka omassa kirjotuksessaan
  pohtii vapaaehtoisty\u00f6t\u00e4, \u201dk\u00f6kk\u00e4ty\u00f6t\u00e4\u201d ja
  sen vaikutuksivattona.\\n\\nSeurakunnassamme on monessa eri ty\u00f6ss\u00e4 v\u00e4h\u00e4
  \u201dkokkimassa\u201d. Mit\u00e4 sitten merkitsee, kun ihminen ottaa vastaan vapaaehtoisty\u00f6t\u00e4
  ty\u00f6t\u00e4 ja teht\u00e4v\u00e4\u00e4? Silloin ihminen sitoutuu, ottaa osan
  teht\u00e4v\u00e4st\u00e4 ty\u00f6st\u00e4 itselleen ja kantaa omaan vastuunsa.
  Se on samalla my\u00f6s arvostuksen rakkaus ja yhteis\u00f6ltuen osuloutsa sille
  yhteis\u00f6lle, jonka osalta vapaaehtoisty\u00f6t\u00e4 tehd\u00e4\u00e4n.\\n\\nSein\u00e4jokella
  seurakunta on vuosikausia ollut seurakuntalaisten, seurakunnan ty\u00f6ntekij\u00f6iden
  ja vapaaehtoisty\u00f6ntekij\u00f6iden yhteis\u00f6. T\u00e4ss\u00e4 seurakunnassa
  on erityisen laaja joukko vastuunkantajia. Hyvin voimakkaasti t\u00e4m\u00e4 on
  havaittavissa erilaisissa tilaisuuksissa ja toiminnossa vuoden aikana.\\n\\nYhteisvastuuker\u00e4ys
  on vuosittain aivan oma erityinen vastuunkantajien ja vastuunjakajien tapahtuma,
  joka n\u00e4kyy jo tuuluihi eri puolilla kaupunkia. Kun ker\u00e4j\u00e4t k\u00e4tev\u00e4t
  oven ovella, he ovat kevyesti totuttuneita tapahtumaa samaan aikaan. Ker\u00e4j\u00e4t
  tuovat viest\u00e4\u00e4 avun tarpeessa olevista l\u00e4heisim\u00e4st\u00e4 ja
  ker\u00e4ykseen t\u00e4rke\u00e4st\u00e4 kohteesta. Ker\u00e4j\u00e4t tuovat viest\u00e4\u00e4
  ja kutsuun vastuun kantamiseen. Samalla t\u00e4m\u00e4 kaikki on hyvin konkreettinen
  muistutus meid\u00e4n omasta seurakunnamme, jolle on annettu v\u00e4litt\u00e4misen,
  jakamisen ja rakkaiden vastuullinen teht\u00e4v\u00e4.\\n\\n\\\"Yrit\u00e4 pyyd\u00e4n
  Vapahtajaa, t\u00e4n\u00e4\u00e4n yht\u00e4 pyyd\u00e4n vain:\\nN\u00e4yt\u00e4
  yhden p\u00e4iv\u00e4n matka,\\naskel jonka t\u00e4n\u00e4\u00e4n voin,\\nKedess\u00e4
  t\u00e4n\u00e4\u00e4n suuntaan\\npolku t\u00e4n\u00e4\u00e4n avautuu!\\nMill\u00e4
  tavoin Is\u00e4n tahto\\nmeiss\u00e4 t\u00e4n\u00e4\u00e4n tapahtuu.\\\"\\n\\nVK
  525:3\\n\\nJukka Salo\\nkirkkoherra\\n\\nKeitti\u00f6st\u00e4 kuntosalille\\n\\nKokki-keitt\u00e4j\u00e4
  Sanna Ala-Huikku on aktiivinen kuntosalin k\u00e4vij\u00e4.\\n\\nSanna kehui kuntosaliharrastusta
  saamaansa hy\u00f6ty\u00e4: - Nulkun hyvin, uni tulee heti, kun menen nukkumaan,
  ja jaksan t\u00f6s\u00e4\u00e4t\u00e4 paljon enemm\u00e4n. Sek\u00e4 liikkeell\u00e4
  ett\u00e4 jalkalihaksen v\u00e4\u00e4ss\u00e4 kunnossa. Nyt var koetellen ty\u00f6ss\u00e4ni
  alueurakunnan keitti\u00f6ll\u00e4.\\n\\n-Tavoitteenani on pysy\u00e4 kunnossa.
  On joskus sellaisiakin p\u00e4ivi\u00e4, ett\u00e4 en jaksaa menn\u00e4 sallille.
  Yleens\u00e4 k\u00e4yn 4\u20135 ker\u00e4\u00e4t viikossa treenimassa. Sen j\u00e4lkeen
  lenkkeilem\u00e4 ja py\u00f6rill\u00e4 t\u00f6ihin. Kouluaikosta keskustaan. Kovilla
  palkeilla kuljen autolla. Saan samalla v\u00e4h\u00e4n pidempi\u00e4 y\u00f6niin,
  kun ty\u00f6matkana ei meene aikaa.\\n\\nSanna on harrastanut liikuntaa aktiivisesti
  lapsesta asti. Yleisurheilua, sallbandya ja jumpaa.\\n\\n-Lihiiset ovat tortuneet
  siiben ennen, ennen kuin osa ymm\u00e4rt\u00e4isi ja vie osan aikani. Omneki avopuolisonkin
  harrastaa liikuntaa, niin h\u00e4n ymm\u00e4rt\u00e4\u00e4.\\n\\n-Suosittelen rohkeasta
  kokeilemaan kuntosaliharrastusta. Sill\u00e4 ei tarvita mukaan muuta kuin verkkaohjust
  ja t-paita. Kun itse k\u00e4vin ensimm\u00e4isi\u00e4 kertoja salilla, en oikein
  tienneyt, mit\u00e4 pit\u00e4\u00e4 tehd\u00e4 ja kuinka paljon. Personal trainer
  auttoi minua samaan teknikkaan kohdalleen, ja san aiemmin toisenlaiseksi hetken\u00e4
  koko hoitoa. Nykyisin tein itse itse treeniohjelman, ja v\u00e4lill\u00e4 sen tekee
  PT. Ohjelma on hyv\u00e4 vaihtaa 4\u20136 viikon v\u00e4lein, koska lihas ei en\u00e4\u00e4
  kehitty, jos treeniohjelma ei v\u00e4lill\u00e4 vaihda.\\n\\nSanna kertoo, ett\u00e4
  kuntosaliharrastusessa saa paljon onnistumisia kokemuksia.\\n\\nSilta voittaa itsens\u00e4,
  jakaa aina enemm\u00e4n, isompi painoja. Ja silta tulee hyv\u00e4 olo! Ennen sallille
  menoa on odotavainen fiilis, ja kun sielt\u00e4 l\u00e4htee, on viel\u00e4 parempi
  olo, kun on kaikkensa antanut.\\n\\n-Onnettomuuksiriski siin\u00e4 on, mutta itse
  olen onneksi v\u00e4\u00e4ritynyt niilt\u00e4, toistaiseksi, hymyilee Sanna.\\n\\nTeksti
  ja kuva:\\nSaana Korpi\\n\\nPila ja kuva\\n\\nEldustamani asia p\u00e4\u00e4si viime
  vuonna pilapirroksen kohdeeksi. Olin mukana tekem\u00e4ss\u00e4 aloitetta kirkolliskouluoselle
  uusperheden avioittoisasiaa. Helsingin Sanomissa oli pian Karisma-kirjassa julkaistu
  kirjoituskoneinen aporiisi seiso tulevan v\u00e4vyn vieress\u00e4 kirkoon alttarilla.
  Morisan on kuvassa takavasemmalla, pienien pojan kanssa. Tuhti pappi kysyy kuvassa
  miehelt\u00e4: \\\"...ent\u00e4 tahdotko ottaa t\u00e4m\u00e4n Lylli Amanda Kyyl\u00e4sen
  anopikseesi?\\\" Miehen hymy oli alkaa ilmesty\u00e4. Valtka juuri oli alkanut saa
  eik\u00e4 tarkoitettu, kuva osui johonkin oleelliseen. Se sai jatkamaan ty\u00f6t\u00e4
  ja nauroi anopellei lempiest\u00e4. T\u00e4m\u00e4 nousi mieleen alkuvuoden tapahumien
  my\u00f6t\u00e4. Ranskassa tehtiin murha pilapirrosten takia. Valtavat joukot ihmis\u00e4
  l\u00e4hti liikkeelle. Sananpavaus on nykyinen pyh\u00e4 asia ja se, ett\u00e4 saa
  piirt\u00e4\u00e4 ja kuvata. Jokaisen kontokoin pit\u00e4\u00e4 kuulemma voida kyseenalaistaa
  ja sen kustannukella pilalla.\\n\\nMitk\u00e4 ovat pilan, hyv\u00e4n huumin ja pilkan
  rajat? Pulpetti piritt\u00e4\u00e4 r\u00e4kinnokkainen koulupolkia on ikiluvallantekij\u00e4,
  koska piritt\u00e4\u00e4 pulpettiin. Lehtitaloissa on taas arvostettuja pilapirjoita.
  Isoisaita ajattelee, ett\u00e4 vanhat hahmottelevat on pari jotka itselleen nauravat
  ja makarivat. Talj sanottien, ett\u00e4 omalle el\u00e4m\u00e4ntavalle saa nauraa,
  mutta toisaan alihaita pilkata. Niinkin se on, mutta jos pysyy hyv\u00e4n maan raajoissa,
  saa sit\u00e4 joskus v\u00e4h\u00e4n toistenkin toliauluille nauraa. Iva ja pilkka
  ovat sill\u00e4 eri aisiota kuin heit\u00e4 tai niit\u00e4 kiert\u00e4v\u00e4t keskustelu.
  Itseell\u00e4 naurauttaa on suuri vaikuttaa on ehk\u00e4 harvinainen tavara. Er\u00e4s
  kalju mies tatuoi kaljuunsa kuvan, jossa mies ty\u00f6nsi ruohonleikkuria. N\u00e4ytti
  silta kuivan kuvan mies oliisi juuri ajellut p\u00e4\u00e4l\u00e4en paljaiksi. Hiusten
  puute k\u00e4\u00e4ntyi huomioriki. Toinen esimerkki voisit olla kuva muistaa konnavasta
  Jeesuksesta. Kuvaan Jeesuksen sel\u00e4ss\u00e4 ratsastaa muuttama hussin n\u00e4k\u00f6inen
  aasi. Kuvatekstiss\u00e4 lukii: \\\"Ensin Jeesus ratsasti aasilla, mutta siit\u00e4
  l\u00e4htien...\\\" Min\u00e4kin olen aasina joskus\\n\\nKinkereill\u00e4 maan ja
  taivaan v\u00e4lill\u00e4\\n\\nKinkerit ovat alkaneet ri puolilla sin\u00e4pisen
  seurakuntaa. Tervetuloa kinkereille!\\n\\nNyt kun kinkerkirkuut on saatuna, mietit
  ehk\u00e4, mink\u00e4lainen tapahtuma kinkerit mahtaaakseen olla. T\u00e4m\u00e4
  kysymys mielest\u00e4si niin n\u00e4kisi l\u00e4mm\u00e4n pitkin kuoliaa siten enemm\u00e4lle
  Ylistaron kappeliseurakunnan kinkereille.\\n\\nVanhemmalle v\u00e4elle kinkerit
  tuovat mieleen vuosikymmenen takaisen kyl\u00e4n suurtaapautman, jossa oli niin
  luettamista kuin kuuluteltujaakin. Nykyp\u00e4iv\u00e4n kinkereill\u00e4 tunneilma
  on toisenlainen. Kinkereille k\u00e4yv\u00e4t seurakunnan kyff\u00e4iset koostuvat
  kinkerkirkoon iloisen puheneosanan saattelemana ja kinkerkirton em\u00e4nn\u00e4n
  kahvip\u00f6yd\u00e4n antimasta nauttien k\u00e4yd\u00e4\u00e4n keskustelua kaikesta
  maan ja taivaan v\u00e4lill\u00e4.\\n\\nRentous ei h\u00e4vi\u00e4, vaikka seurakunnan
  pappi ja kanttori saavat kinkerkirkoon taittuaan kinkereille allekseen alkujoulun
  alla. Kinkerkirksyn t\u00e4m\u00e4 vuonna ovat Matteuksen evankeliumin 9 luku ja
  nelj\u00e4s k\u00e4skey \u201cKunnioita is\u00e4\u00e4si ja \u00e4iti\u00e4si\u201d.
  Ylistarossa pidet\u00e4\u00e4n tammi-maaliskuussa 19 kinkerit. Kinkereill\u00e4
  kokoonnutaan kinkerpireitt\u00e4in ja yleisens\u00e4 kinkerpalkka ja istutetaan
  koti. Viihde-aitta Ylistarossa kokoontuu kinkereille noin 500 k\u00e4vij\u00e4\u00e4.
  Mukana on pikkuvaunuja, pyh\u00e4koululaisia, ripikoululaisia, ty\u00f6v\u00e4ki\u00e4
  v\u00e4\u00e4ke ja varttuneempaa joukkoa.\\n\\nKinkereill\u00e4 luetaan Raamatusta
  kinkeri\u00e4ksy, pappi alustaa ahjeseta ja sitten on tilaa keskustelelta ja kyyvymyksille.
  Samoin yhdess\u00e4 pohditaan kinkereille valmiin Kattekesmukseen kapaleen sanomaa
  t\u00e4m\u00e4n p\u00e4iv\u00e4n n\u00e4k\u00f6kulmasta.\\n\\nKinkerit tarjoavat
  hienon paikan seurakuntalaisille kuulla toisten ajatuksia ja jakaa el\u00e4m\u00e4ns\u00e4kokemuksia.
  Esimerkiksi alkuvuodesta jo pideryill\u00e4 kinkereill\u00e4 on keskusel\u00e4inten
  uskon kontesteita, lasten kankutusseminaari, vanhainkodosta, valtiovallan p\u00e4\u00e4toimistosta
  suuren kohtamisesta kuin Jeesuksen ihmeekorjen merkitysdestaakin. V\u00e4hva virreveneiss\u00e4
  kuuluu kinkereille. Alustuksen ja keskustelun lomassa kanttori veisauttaa ahjepiiriin
  sopivia virsi\u00e4. Kinkereill\u00e4 ovat esill\u00e4 diakonian l\u00e4hesyysj\u00e4rjestelm\u00e4,
  kirkkoty\u00f6, ajatuksia ja asioita. Kinkereill\u00e4 ker\u00e4t\u00e4\u00e4n my\u00f6s
  kohletta kyl\u00e4l\u00e4isten valitsemaan kohteeseen. Kyll\u00e4 asioiden k\u00e4sittelyss\u00e4
  on kyl\u00e4nvanhimalla puhennuorsoa. Kinkereill\u00e4 seurakunnan ty\u00f6ntekij\u00e4t
  kuuntelevat herk\u00e4ll\u00e4 korvalla, millaisia miehet kinkerkirkoissa ovat seurakunnan
  el\u00e4m\u00e4st\u00e4 ja toiminnasta.\\n\\nKinkerpireitteet jatkuminen varmistetaan
  sill\u00e4, ett\u00e4 kyl\u00e4nvanhin on kysellyt on joen vuoden kinkeriopakan
  valmiuksia. Keskustelu kaikesta maan ja taivaan v\u00e4lill\u00e4 jatkuuon.\\n\\nMinna
  Lainimo\\n\\nPer\u00e4sein\u00e4joen Liikanpalan p\u00e4\u00e4samitin kinkerit j\u00e4rjestettiin
  V\u00e4limalaan maatalimatkaailun tiloissa, kinkereille kutsuivat Anna ja Veli-Matti
