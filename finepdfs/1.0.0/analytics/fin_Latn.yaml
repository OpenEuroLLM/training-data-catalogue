sample: '["\"Syyskokous Spahotel Casinolla\\n\\nParhaat p\u00e4\u00e4t\u00f6kset tehd\u00e4\u00e4n
  hyviss\u00e4 puitteissa Saimaan rannalla, ja kokouspakettimme tekev\u00e4t onnistumisesta
  helppoa.\\n\\nAjankohta syyskokoukselle: 1.10.-16.12.2023.\\n\\nVaraustiedustelut
  Primehotelsin myyntipalvelusta:\\nAvoinna arkisin klo 8.30 \u2013 17.30\\np. +358
  (0)293 200 200\\nfirstname.lastname@example.org\\n\\nPuhelun hinta 3,02 snt/min
  + pvm/mpm\\n\\nPaketti 1  13 \u20ac / hl\u00f6\\n\\nKahvi ja suolainen tai makea
  kahvileip\u00e4 (minimi 4 henkil\u00f6\u00e4).\\nKokoustila k\u00e4yt\u00f6ss\u00e4
  2h. Lis\u00e4tunnit 20\u20ac/h.\\n\\nSUOLAISET KAHVILEIV\u00c4T, valitse 1/ryhm\u00e4:\\n\\nKana-Caesar-Wrap
  L\\nT\u00e4ysjyv\u00e4torilla, broilerileikett\u00e4, salaattia,\\ntomaattia, paahdetta
  sipulia, parmesanjuustoa\\nja Caesar-kastiketta\\n\\nT\u00e4ytetty kauras\u00e4mpyl\u00e4
  L\\n-Taikinajuureen leivottu kauras\u00e4mpyl\u00e4,\\nsavujuustoa, salaattia, paprikaa\\n\\nT\u00e4ytetty
  ruistasku L\\nTaikinajuureen leivottu ruistasku,\\nmaalaispalvikinkkua, salaattia,
  maustekurkkua,\\ntomaattia, voita ja sinappimajoneesia\\n\\nT\u00e4ytetty pitaleip\u00e4
  L\\nPaistettua halloumijuustoa, salaattia, tomaattia,\\noliiveja, punasipulia ja
  tsatsikia\\n\\nL\u00f6rtsybaari\\nLaurikaisen leipomon minil\u00f6rtsy (1kpl), sinappi,\\nketsuppi,
  kurkkusalaatti, hienonnettu sipuli,\\nmajoneesi\\n\\nMAKEAT KAHVILEIV\u00c4T, valitse
  1/ryhm\u00e4:\\n\\nToscapiiirakkaa L\\nVaniljavaahtoa ja vadelmia\\n\\nTalon marjapiirakkaa
  L\\nKinuskivahtaoa ja marjoja\\n\\nSuklaajuustokakku G, L\\nMantelimarenkia ja hedelm\u00e4kreemi\u00e4\\n\\nTalon
  pulla\\n-Kanelikerrepulla L\\n-Kuningatarpulla L\\n\\nT\u00c4YDENN\u00c4\\nKOKOUSTARJOILUITASI:\\n\\nLaurikaisen
  leipomon minil\u00f6rtsy 4,50 \u20ac / hl\u00f6\\nSis\u00e4lt\u00e4\u00e4: sinappi,
  ketsuppi, kurkkusalaatti,\\nhienonnettu sipuli, majoneesi\\n\\nKeksivalikoima (annos)
  3 \u20ac / hl\u00f6\\n\\nLeikatut hedelm\u00e4t (annos) Veg, G 4,00 \u20ac / hl\u00f6\\n\\nP\u00e4hkin\u00e4mix
  1 dl Veg, G 4,00 \u20ac / hl\u00f6\\n\\nKarkkikippo 1 dl 4,00 \u20ac / hl\u00f6\\n\\nKonvehdit
  / marmeladit 4,00 \u20ac / hl\u00f6\\n\\nMacarons 2,00 \u20ac / kpl\\n\\nSmoothie
  4,50 \u20ac / hl\u00f6\\n\\nPaketti 2 35 \u20ac / hl\u00f6\\n\\nKokous ja ruokailu
  (minimi 20 henkil\u00f6\u00e4).\\nKokoustila k\u00e4yt\u00f6ss\u00e4 2h. Lis\u00e4tunnit
  20\u20ac/h.\\n\\nMENU\\nKoko ryhm\u00e4lle tulee valita yhten\u00e4inen p\u00e4\u00e4ruoka.\\nKahdella
  p\u00e4\u00e4ruoalla + 8 \u20ac / hl\u00f6.\\n\\nAlkuun\\n\\nViher salaattia ja
  karpalovinegrette\u00e4 Veg, G\\nPisaratomaatteja Veg, G\\nKurkkua Veg, G\\nRosmariinilla
  maustettua puolukkapunasipulihilloketta Veg, G\\nPikkel\u00f6ity\u00e4, sahramilla
  maustettua ker\u00e4kaalia Veg, G\\nMaalaisperunasalaattia ja kokojyv\u00e4sinappimajoneesia
  Veg, G\\nMaalaissaalaattia ja lehtipersilja\u00f6ljy\u00e4 Veg, G\\nPaahdettuja
  siemeni\u00e4 Veg, G\\nP\u00e4hkin\u00f6it\u00e4 Veg, G\\nKuivattua sipulia L\\nYrttikrutonkeja
  L\\nHapanjuurileip\u00e4\u00e4 L ja luomuruuisleip\u00e4\u00e4 L\\nVaahdotettua
  voita L, G, margariinia Veg, G\\n\\nP\u00e4\u00e4ruoaksi\\n\\nPaistettua lohta M,
  G\\nYrttismetanakastiketta L, G\\nKauden kasviksia Veg, G\\nPaahdettuja perunoita
  Veg, G\\n\\ntai\\n\\nPariloitua broileria M, G\\nPunaviinikastiketta M, G\\nKauden
  kasviksia Veg, G\\nPaahdettuja yrttimarinoituja perunoita Veg, G\\n\\nKasvisruokailijoille\\n\\nPaistettua
  tofua Veg, G\\nChilimajoneesia Veg, G\\nKauden kasviksia Veg, G\\nPaahdettuja uusia
  perunoita Veg, G\\n\\nJ\u00e4lkiruoka\\n\\nMarjapiirakkaa L, (G), vaniljavaahtoa
  L, G\\nKahvi tai tee\\n\\nPaketti 3\\n\\nYhdist\u00e4 pikkujoulut ja kokous alk.
  44 \u20ac / hl\u00f6!\\n\\nPikkujouluruokailun varaaajalle kokoustila veloituksetta
  2h koodilla: syyskokous2023\\n\\nTutustu Ravintola Est.1969:n ja Ravintola Wanhan
  Kasinon pikkujoulumenuihin, sek\u00e4 ohjelmatarjontaan verkkosivuiltamme: spahotelcasino.fi/pikkujoulut-2023/\\n\\nTarvetta
  y\u00f6paikalle kokouksen j\u00e4lkeen?\\n\\nMajoitus varaustunnuksella \\\"syyskokous2023\\\"
  alk. 45 \u20ac / hl\u00f6 / 2hh, sis\u00e4lt\u00e4en pys\u00e4k\u00f6innin, WiFin,
  runsaan buffetaamiaisen sek\u00e4 kylpyl\u00e4n ja kuntosalin k\u00e4yt\u00f6n.\\n\\nMeilt\u00e4
  varattavissa my\u00f6s virkistys- ja ty\u00f6hyvinvointip\u00e4iv\u00e4t:\\n\\nspahotelcasino.fi/virkistys-ja-ty\u00f6hyvinvointip\u00e4iv\u00e4t/\"",
  "\"Kohteen tiedot:\\n\\nYhti\u00f6: Kiinteist\u00f6-Oy V\u00e4ritehtaankatu 4\\nKatuosoite:
