  +1-858-551 1009\\nE-mail: email@example.com\"", "\"126.96.36.199 Saate kunnalle\\n\\nToivon,
  ett\u00e4 t\u00e4m\u00e4 saatetaan my\u00f6s kaupunginhallitukselle tiedoksi, kun
  he k\u00e4sittelev\u00e4t t\u00e4t\u00e4 asiaa l\u00e4hiaikoina. Kannattaa my\u00f6s
  tsekata kaupunkisuunnittelulautakunnan ev\u00e4stykset Hannuskallioiden kaavoitukselle
  kokouksessa, jossa Kaitaa-Iivisniemi osayleiskaavasta p\u00e4\u00e4tettiin. Yst\u00e4v\u00e4llisin
  terveisin Seppo Salo\\n\\n188.8.131.52 Kuntalaisaloite\\n\\n184.108.40.206 Hannuskallioiden
  liitt\u00e4minen Hannusmets\u00e4n maakunnalliseeen arvokohteeseen Espoo\\n\\nAloite
  luotu Kuntalaisaloite.fi-palveluun 18.5.2021\\n\\nAloitteen julkaisup\u00e4iv\u00e4m\u00e4\u00e4r\u00e4
  19.5.2021\\n\\nMe allekirjoittaneet vetoamme, ett\u00e4 Espoon kaupungin valtuusto
  p\u00e4\u00e4tt\u00e4\u00e4 tehd\u00e4 \\\"Luonnon monimuotoisuuden toimenpideohjelmaan
  ja selvitykseen\\\" seuraavan muutoksen ennen sen hyy\u00e4ksymist\u00e4.\\n\\nSivulla
  79 kohde 139 Hannusmets\u00e4 maakunnallinen arvokohde. T\u00e4h\u00e4n kohteeseen
  lis\u00e4t\u00e4\u00e4n Bondaksenkalliot seuraavista syist\u00e4:\\n\\nBondaksen
  kalliot ovat aina olleet osa Hannusmets\u00e4\u00e4:\\n\\nNe ovat mets\u00e4lain
  10\u00a7 kohteita (v\u00e4h\u00e4tuottoisa ja v\u00e4h\u00e4puustoinen kallioalue,
  jolla on vanhoja matalia puita ja silokallioalueita). Bondaksen kallioilla on paikallisesti
  arvokas rapakivilohkare ja edustava Litorinameren aikainen rantakivikko.\\n\\nKerrostalojen
  rakentaminen t\u00e4lle alueelle tuhoaisi itse kallioalueen ja pilaisi vieress\u00e4
  olevan maakunnallisen arvokohteen maiseman, koska rakennukset nousisivat n\u00e4kyviin
  mets\u00e4rajan yli.\\n\\nBondaksen kallioalueen yhdist\u00e4mist\u00e4 puoltaa
  my\u00f6skin Kaitaa-Iivisniemi osayleiskaavan merkinn\u00e4t, jonka mukaan kallio
  on \\\"Virkistyksen kohdealue\\\" ja ett\u00e4 t\u00e4lt\u00e4 alueelta on \\\"Yhteystarve\\\"
  Hannusmets\u00e4\u00e4n.\\n\\nBondaksen kallioita koskevat samat perustelut kuin
  koko Hannusmets\u00e4\u00e4:\\n\\nP\u00e4\u00e4radan etel\u00e4puolen mantereen
  ainoan j\u00e4rven, Hannusj\u00e4rven, valuma-alueesta merkitt\u00e4v\u00e4 osa
  sijaitsee Hannusmets\u00e4ss\u00e4.\\n\\nHannusmets\u00e4 on er\u00e4s Etel\u00e4-
  Espoon suurimmista hiilinieluista ja hiilivarastoista, se my\u00f6s torjuu melun
  ja liikenteen p\u00e4\u00e4st\u00f6jen levi\u00e4mist\u00e4 asuinalueille.\\n\\nHannusmets\u00e4
  on luonnonvarainen mets\u00e4kokonaisuus, joka sopii parhaiten organisoimattomaan
  virkistysk\u00e4ytt\u00f6\u00f6n. Ihmiset ohjataan k\u00e4ytt\u00e4m\u00e4\u00e4n
  polkuverkostoa, joka sijaitsee enemm\u00e4n kulutusta kest\u00e4vill\u00e4 alueilla.\\n\\nHannusmets\u00e4
  on etel\u00e4isen Espoon eniten k\u00e4ytetty koulu- ja p\u00e4iv\u00e4kotimets\u00e4.\\n\\n1930-
  luvun j\u00e4lkipuoliskosta l\u00e4htien se on ollut merkitt\u00e4v\u00e4 l\u00e4hialueiden
  asukkaiden marjastus- ja sienestyspaikka sek\u00e4 ulkoilumets\u00e4.\\n\\nMets\u00e4n
  l\u00e4helle tullaan rakentamaan asuntoja tuhansille uusille asukkaille ja senkin
  vuoksi Hannusmets\u00e4 on s\u00e4ilytett\u00e4v\u00e4 nykyisen kokoisena.\\n\\nSiis
  arvoisat valtuutetut lis\u00e4tk\u00e4\u00e4 Hannuskalliot kokonaisuutena suunniteltuun
  maakunnallisesti t\u00e4rke\u00e4\u00e4n arvokohteeseen: Hannusmets\u00e4\u00e4n.\\n\\n220.127.116.11
  Lis\u00e4tiedot\\n\\nhttps://asiakas.kotisivukone.com/files/hannusjarvensuojelu.kotisivukone.com/tiedostot/hannusjarvi
  _2015_net.pdf\\n\\n18.104.22.168 Vastuuhenkil\u00f6\\n\\nSeppo Salo, Espoo / Esbo\\n\\n22.214.171.124
  Osallistujia yhteens\u00e4 660\\n\\nOsallistujaluettelo liitteen\u00e4\\n\\n126.96.36.199
  Jos aloitteeseen on lis\u00e4tty video\\n\\nVideo on katseltavissa aloitteen sivulla
