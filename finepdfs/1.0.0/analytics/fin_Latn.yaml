  kuluja koskevaa selvitysmenettely eli ns. taxation-menettely p\u00e4\u00e4ttyi 21.10.1999.
  Menettelyn p\u00e4\u00e4ttytty\u00e4 osapuolten kesken jatkettiin sovintoneuvotteluja,
  joissa saavutettiin ratkaisu 14.1.2000. Sovintoratkaisun perusteella yhti\u00f6n
  maksettavaksi tuli oikeudenk\u00e4yntikuluja yhteens\u00e4 3,4 Mmk. Maksettu m\u00e4\u00e4r\u00e4
  ylitt\u00e4\u00e4 edellisen tilikauden pakollisiin varauksiin kirjatun ja yhti\u00f6n
  k\u00e4ytt\u00e4mien paikallisten asiantuntijoiden esitt\u00e4m\u00e4n arvion (2,6
  Mmk) 0,8 Mmk:lla.\\n\\nKajaanin toimitiloihin perustuvat maksuvetoitteet\\n\\nYhti\u00f6n
  ja Kajaanin kaupungin, Kajaanin Teknologiaupisto Oy:n ja Kajaanin Teknokiinteist\u00f6
  Oy:n v\u00e4list\u00e4 sovintoratkaisua koskien Biohit Oy:n irtautumista nykyisist\u00e4
  Vienankatu 5:n toimitiloista on tilikauden lopussa muutettu. Muutoksen perusteella
  Kajaanin kaupunki luovuttaa sovintoratkaisussa sovitujen erien lis\u00e4ksi yhti\u00f6lle
  rakentamiseen tarvittavan noin 1,4 ha:n suuruisen Kajaanin Pet\u00e4isem\u00e4ss\u00e4n
  teollisuusalueella sijaitsevan toiminn nimellist\u00e4 vuokraa vastaan, mink\u00e4
  lis\u00e4ksi yhti\u00f6ll\u00e4 on oikeus lunastaa toimii itselleen 10 vuoden kuluttua
  nimellisell\u00e4 lunastushinnalla. Kajaanin kaupungin valtuusto on vahvistanut
  sovintoratkaisuun tehdyt muutokset 10.1.2000 pit\u00e4m\u00e4ss\u00e4\u00e4n kokouksessa
  ja asiakkokonaisuuteen liittyv\u00e4t sopimukset on allekirjoitettu osapuolten kesken
  4.2.2000. Osapuolten ovat t\u00e4m\u00e4n j\u00e4lkeen vet\u00e4neet puolin ja toisin
  vaateensa pois Kajaanin karjalioikeudesta.\\n\\nYhti\u00f6 on tulouttanut tilinp\u00e4\u00e4t\u00f6kss\u00e4\u00e4n
