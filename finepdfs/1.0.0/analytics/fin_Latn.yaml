  "\"Varausm\u00f6kki Aihkin s\u00e4\u00e4nn\u00f6t\\n\\n1. Varausm\u00f6kki Aihki
  on Tunturiladun omistama kiinteist\u00f6 ja kaikkien tunturilatulaisten varattavissa.\\n2.
  Aihkin voi varata johtokunnan m\u00e4\u00e4r\u00e4\u00e4m\u00e4st\u00e4 paikasta
  tai henkil\u00f6lt\u00e4.\\n3. Varaus annetaan varausj\u00e4rjestyksess\u00e4 enint\u00e4\u00e4n
  kahdeksi per\u00e4kk\u00e4iseksi viikoksi ja sen voi tehd\u00e4 enint\u00e4\u00e4n
  12 kk ennen varattavaa ajankohtaa. Poikkeuksena ovat viikot 12\u201318 ja 36\u201339,
  jolloin Aihkin voi varata enint\u00e4\u00e4n viikoksi kerrallaan. Mik\u00e4li samalle
  viikolle on useampia varauksia, etusijalla ovat ne, jotka eiv\u00e4t viimeisen kolmen
  vuoden aikana ole olleet Aihkissa.\\n4 Avaimesta vastaa varaaja, jonka tulee olla
  Tunturiladun j\u00e4sen. Varauksen p\u00e4\u00e4tytty\u00e4 avain on palautettava
  v\u00e4litt\u00f6m\u00e4sti varausten hoitajalle. Kadonneesta avaimesta perit\u00e4\u00e4n
  johtokunnan erillisell\u00e4 p\u00e4\u00e4t\u00f6ksell\u00e4 100 euron korvaus.\\n5.
  Aihki saunoineen on varaajan yksityisk\u00e4yt\u00f6ss\u00e4.\\n6. Aihkiin voi tuoda
  yhden vieraan, joka ei ole Tunturiladun j\u00e4sen, kun tunturilatulainen on varaajana
  ja yht\u00e4 aikaa majoittuneena Aihkiin.\\n7. Aihkin vuorokausimaksun suuruuden
  p\u00e4\u00e4tt\u00e4\u00e4 Tunturiladun vuosikokous.\\n8. Varausajalta peritt\u00e4v\u00e4
  maksu suoritetaan etuk\u00e4teen Tunturiladun tilille, viitenumero 806.\\n9. Varauksen
  mahdollisesta peruuntumisesta on ilmoitettava varausten hoitajalle v\u00e4litt\u00f6m\u00e4sti.\\n10.
  Varauksen mahdollisesta peruuntumisesta on ilmoitettava varaustenhoitajalle v\u00e4litt\u00f6m\u00e4sti.
  Peruutuksen tapahtuessa aikaisemmin kuin 14 vuorokautta ennen varatun ajan alkua,
  varauksesta ei perit\u00e4 maksua.\\nPeruutuksen tapahtuessa 7-14 vuorokautta ennen
  varatun ajan alkua, maksu on 1/3 varatun ajan maksusta.\\nPeruutuksen tapahtuessa
  alle 7 vuorokautta ennen varatun ajan alkua, maksu tulee suorittaa kokonaisuudessaan.\\nPeruutusmaksuihin
  on puheenjohtajan tai varaustenhoitajan p\u00e4\u00e4t\u00f6ksell\u00e4 mahdollisuus
  saada lievennyst\u00e4 erityisist\u00e4 syist\u00e4 (esimerkiksi onnettomuus, vakava
  sairaus, l\u00e4heisen kuolemantapaus ym. vastaavat).\\n11. Aihkilla ja Susikyr\u00f6ll\u00e4
  on yhteinen kaivo ja puuliiteri, joiden k\u00e4ytt\u00f6oikeus on Aihkin vuokraajalla,
  samoin kuin oikeus k\u00e4ytt\u00e4\u00e4 Susikyr\u00f6n rantasaunaa, Pekan-Oskaria
  ja venett\u00e4.\\n12. Aihkia l\u00e4hinn\u00e4 olevan autonl\u00e4mmitystolpan
  ohjauskytkin sijaitsee Aihkin kuistilla olevassa komerossa. Muiden tolppien ohjauskytkimet
  sijaitsevat Pekan-Oskarin k\u00e4yt\u00e4v\u00e4ss\u00e4. Vuosikokouksen m\u00e4\u00e4r\u00e4\u00e4m\u00e4
  autonl\u00e4mmitystolppien k\u00e4ytt\u00f6maksu suoritetaan Tunturiladun pankkitilille
  Aihkin viitteell\u00e4 tai Pekan-Oskarin k\u00e4yt\u00e4v\u00e4ss\u00e4 olevaan
  lippaaseen ja maksusuoritus merkit\u00e4\u00e4n samassa paikassa olevaan vihkoon.
  Asuntovaunut ja -autot saavat k\u00e4ytt\u00e4\u00e4 l\u00e4mmitystolppia vain moottorin
  l\u00e4mmitt\u00e4miseen. L\u00e4mmitystolppia tulee k\u00e4ytt\u00e4\u00e4 vain
  ennen koti tai muulle matkalle l\u00e4ht\u00f6\u00e4.\\n13. Aihkin irtaimistoa ei
  saa siirt\u00e4\u00e4 edes tilap\u00e4isesti pois m\u00f6kist\u00e4.\\n\\n14. Aihkiin
  ei saa vied\u00e4 lemmikkiel\u00e4imi\u00e4.\\n15. M\u00f6kin ja saunan l\u00e4ht\u00f6siivouksen
  hoitaa varaaja. Mahdolliset irtaimistolle ja kiinteist\u00f6lle tapahtuneet vahingot
  ilmoitetaan kirjallisesti varausten hoitajalle avaimen palautuksen yhteydess\u00e4.\\n16.
  Avaimen luovuttamisesta ulkopuolisille ja muusta s\u00e4\u00e4nt\u00f6jen vastaisesta
  toiminnasta johtokunta voi m\u00e4\u00e4r\u00e4t\u00e4 m\u00e4\u00e4r\u00e4aikaisen
  k\u00e4ytt\u00f6kiellon.\\n17. Tunturiladun johtokunnalla on tarvittaessa oikeus
