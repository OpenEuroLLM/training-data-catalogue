  j\u00e4lkeen.\\n\\nainutlaatuisen testi mahdollistaa sen, ett\u00e4 t\u00e4htyst\u00e4
  tekev\u00e4 l\u00e4\u00e4k\u00e4ri voi nopeasti, yksinkertaisesti ja potilaasta
  rasittamatta seudua t\u00e4htyst\u00e4 tehess\u00e4\u00e4n ne potilaita jotka saavastavat
  hypolaktasiaa. Ilman Biohitin pikatesti\u00e4 t\u00e4m\u00e4 ei ole mahdollista.
  T\u00e4m\u00e4n vuoksi jokaisen t\u00e4htystksen yhteydess\u00e4 hypolaktasiamaahdollisuus
  tulisi sulkea pois t\u00e4m\u00e4n pikatestin avulla.\\n\\nKeliakian takana oleva
  biokeimallinen perusta on mahdollisesti se, ett\u00e4 gluteiinin aiheuttamaan toksiseen
  vaurioon himalakvon pinnalla liittyy transglutaminasientyymin ilmautuminen solun
  pinnalle, jolloin gluteiinin ja entsyymin kompleksia vastaan muodostuu vasta-aineita.
  T\u00e4st\u00e4 syyst\u00e4 transglutaminasiaa vastaan muodostuvat vasta-aineet
  voivat olla keliakian spesifinen ja ensisijainen merkki.\\n\\nKeliakiaan liittyv\u00e4n
  villusatrofian yhteydess\u00e4 kehittyv\u00e4n my\u00f6s hypolaktasia ja keliakiapotilaat
  eiv\u00e4t voi, hypolaktasiapotilaiden tavoin, k\u00e4ytt\u00e4\u00e4 ma\u30a4\u30c8uotteita.
  Biohitin hypolaktasiapikatestill\u00e4 mahalaukun t\u00e4htystyksen yhteydess\u00e4
  todettiin laktasaan puute voi my\u00f6s merkit\u00e4 sit\u00e4, ett\u00e4 taustalla
  on keliakia. Anti-gliadiini-, anti-endomyysiini-, anti-retikuliini- ja anti-transglutaminasitestit
  ovat positiiviset n\u00e4ill\u00e4 hypolaktasiapotilailta.\\n\\n**Systeemisen Lupus
  Erytematosuksen diagnosointi**\\n\\nBiohit on kehitt\u00e4m\u00e4ss\u00e4 menetelmi\u00e4,
  joilla voidaan diagnostoida systeeminen lupus erytematosus (SLE), joka on monimuotoisine
  oireineen reumatateuta muistuttava autoimmuunita. Menetelm\u00e4 on uusi anti-dsDNA-vastainemenetelm\u00e4,
  jonka ainutlaatuisuus perustuu telomeerivasta-aineiden mittaukseen. Telomeeritutkimus
  on erityisen mielenkiinnon kohteena, koska telomeraasisentsyymiaktiviteetin l\u00f6ytyminen
  85%:ssa kaikista sy\u00f6vist\u00e4 on tehnyt telomeraasia uuden sy\u00f6v\u00e4n
  merkkin\u00e4iseen. Vuoden 1999 alkana Biohit on hankkinut tietotaitoa, teknologiaa
  ja patentteja (esim. U.S. 5,700,641 ja FI 100556) telomeerivasta-aineiden m\u00e4\u00e4ritt\u00e4miseksi
  verin\u00e4ytteist\u00e4.\\n\\nSysteemisen lupus erytematosuksen (SLE) oireet muistuttavat
  usein reumatautien oireita. Biohitin telomeerivastainetestill\u00e4 SLE voidaan
  erottaa reumasta tarkasti m\u00e4\u00e4ritelm\u00e4ll\u00e4 vasta-aineet verin\u00e4ytteest\u00e4.\\n\\n---\\n\\n2.
  McMillan, S.A., Haughton, D.J., Biggart, J.D., Edgar, J.D., Porter, K.G. and McNeil,
  T.A., (1991). Predictive Value for Celiac Disease of Antibodies to Glutid, Endomyosium
  and Jejunum Patients for Attending for Jejunal Biopsy. *BMJ* 303: 1163-5.\\n3. Shay,
  J.W. (1997). Telomerase in Human Development and Cancer. *Journal of Cellular Physiology*
  173:266-270.\\n4. Salonen-E.M. (1997). U.S. patent 5,700,641: Diagnostic Method,
  Test Kit, Drug and Therapeutic Treatment for Autoimmune Diseases.\\n\\nKorkeiden
  telomeeri DNA-vasta-aineepitoisuksien mitaaminen entsyymi-immunologisella menetelm\u00e4ll\u00e4
  (EIA) on herk\u00e4 ja spesifinen veriseloutantesti SLE-taudille\\\\textsuperscript{45,46}.
  SLE:n erottaminen muista sidekudossairauksista kuten nivrelreumasta sis\u00e4lt\u00e4\u00e4
  Amerikan reumayhdistyksen vuoden 1982 kriteerien mukaisesti my\u00f6s dsDNA-autovastaa-aineiden
  m\u00e4\u00e4ritt\u00e4misen.\\n\\n**Fytoestrogeenit ja sy\u00f6v\u00e4n ehk\u00e4isy**\\n\\nBiohitin
  tavoitteena on kehitt\u00e4\u00e4 edelleen uusia ja ainutlaatuisia liiketoimintamahdollisuuksia
  sy\u00f6p\u00e4tautiien toteamisen ja ehk\u00e4isyyn aloilla. Biohit kehitt\u00e4\u00e4
  yhteisty\u00f6ss\u00e4 prof. Herman Adlercreutzin kanssa testej\u00e4 virtaan ja
  seerumin fytoestrogeeneille. N\u00e4m\u00e4 testit, jotka suoritetaan entsyymi-immunologisia
  m\u00e4\u00e4ritysmenetelmi\u00e4 ja monoklonaalisia vasta-aineita k\u00e4ytt\u00e4en,
  perustuvat yli 20 vuotta kest\u00e4neeseen perustutkimukseen ja kahden Yhdysvaltojen
  terveysinstituultilta National Institute of Health (NIH) saadun 3-vuotisen apurahan
  ja yhden EU:n my\u00f6nt\u00e4m\u00e4n 3-vuotisen apurahan turvin tehtyyn tutkimukseen.
  Suomessa projekti saa tukea Teknologian kehitt\u00e4miskeskus TEKESilt\u00e4.\\n\\nFytoestrogeenien
  alhainen m\u00e4\u00e4r\u00e4 elimist\u00f6ss\u00e4 saattaa viestitt\u00e4\u00e4
  tiettyjen sy\u00f6p\u00e4muotojen, kuten paksunsuolen-, rinta- ja eturauhassy\u00f6v\u00e4n\\\\textsuperscript{47,48,49,50}
  samoin kuin isokeisemien syd\u00e4ntautien vaaraa\\\\textsuperscript{51}. T\u00e4llaisissa
  tapauksissa tautien ehk\u00e4iseminen edellytt\u00e4\u00e4 siirtymist\u00e4 ruokavalioon,
  joka sis\u00e4lt\u00e4\u00e4 enemm\u00e4n kokojyv\u00e4leip\u00e4\u00e4, marjoja,
  vihanneksia ja soijavalmisteita\\\\textsuperscript{52,53}. Ravinto ja terveys kiinnostavat
  ihmisi\u00e4 entist\u00e4 enemm\u00e4n. T\u00e4m\u00e4n vuoksi fytoestrogeenien
  tutkimusta tehd\u00e4\u00e4n eritt\u00e4in intensiivisesti jo maailmanlaajuisesti.
  Kehitteill\u00e4 olevat fytoestrogeenitestit vastaavat markkinoiden kysynt\u00e4\u00e4n.\\n\\n---\\n\\n**Diagnostiikkatuotteiden
