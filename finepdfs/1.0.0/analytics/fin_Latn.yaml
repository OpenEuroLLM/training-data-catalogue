  | X |  |  |\\n\\n1) Ari-Pekka Luoma saapui \u00a7:n 3 aikana klo 12.34.\\n\\n1 \u00a7\\n\\nKokouksen
  avaus ja alkuhartaus\\n\\nPuheenjohtaja avasi kokouksen.\\n\\n2 \u00a7\\n\\nNimenhuuto
  sek\u00e4 laillisuuden ja p\u00e4\u00e4t\u00f6svaltaisuuden toteaminen\\n\\nKirkkolain
  7 luvun 4 \u00a7:n mukaan seurakunnan toimielin on p\u00e4\u00e4t\u00f6svaltainen,
  kun enemm\u00e4n kuin puolet j\u00e4senist\u00e4 on saapuvilla.\\n\\nKirkkoj\u00e4rjestyksen
  8 luvun 5 \u00a7:n mukaan kirkkovaltuuston kokouskutsussa on ilmoitettava kokouksen
  aika ja paikka ja siihen on liitett\u00e4v\u00e4 luettelo k\u00e4sitelt\u00e4vist\u00e4
  asioista. Kutsu asialuetteloineen on l\u00e4hetett\u00e4v\u00e4 kirkkovaltuuston
  ja kirkkoneuvoston j\u00e4senille viimeist\u00e4\u00e4n viikkoa ennen kokousta.\\n\\nKirkkovaltuuston
  ty\u00f6j\u00e4rjestyksen 3 \u00a7:n mukaan kokouksen alussa toimitetaan nimenhuuto,
  jonka j\u00e4lkeen valtuuston on todettava, onko kokous laillisesti koolle kutsuttu
  ja p\u00e4\u00e4t\u00f6svaltainen.\\n\\nKun valtuutettu on tilap\u00e4isesti estynyt
  saapumasta kokoukseen, h\u00e4nen on ilmoitettava siit\u00e4 viivytyksett\u00e4
  valtuuston puheenjohtajalle. Puheenjohtajalle teht\u00e4v\u00e4 ilmoitus voidaan
  j\u00e4tt\u00e4\u00e4 my\u00f6s valtuuston sihteerille. Estyneen valtuutetun sijaan
  kutsutaan varaj\u00e4sen. (Kirkkovaltuuston ty\u00f6j\u00e4rjestyksen 2 \u00a7)\\n\\nKirkkovaltuusto
  toimittaa nimenhuudon.\\n\\nKirkkovaltuusto hyv\u00e4ksyy varaj\u00e4senet toimimaan
  estyneiden tilalla.\\n\\nKirkkovaltuusto toteaa, onko kokous laillisesti koolle
  kutsuttu ja p\u00e4\u00e4t\u00f6svaltainen.\\n\\nKirkkovaltuusto toimitti nimenhuudon,
  mink\u00e4 j\u00e4lkeen puheenjohtaja totesi, ett\u00e4 valtuuston 33 j\u00e4senest\u00e4
  25 varsinaista j\u00e4sent\u00e4 ja 4 varaj\u00e4sent\u00e4 oli paikalla eli yhteens\u00e4
  29 valtuutettua oli l\u00e4sn\u00e4. Poissa oli 4 j\u00e4sent\u00e4. Ari-Pekka Luoma
  saapui \u00a7:n 3 aikana, klo 12.34, jonka j\u00e4lkeen paikalla oli 26 varsinaista
  j\u00e4sent\u00e4 ja 4 varaj\u00e4sent\u00e4 eli yhteens\u00e4 30 valtuutettua.\\n\\nKirkkovaltuusto
  hyv\u00e4ksyi yksimielisesti varaj\u00e4sen Marja-Liisa Noren toimimaan estyneen
  Marika Hietasen tilalla, Ismo Saaren toimimaan estyneen Mikko Lund\u00e9nin tilalla,
  Merja Lepp\u00e4virran toimimaan estyneen Sanna Lundstr\u00f6min tilalla ja Marjaana
  M\u00e4nk\u00e4rin toimimaan estyneen Pirjo Parviaisen tilalla.\\n\\nKokous todettiin
  yksimielisesti laillisesti koolle kutsutuksi ja p\u00e4\u00e4t\u00f6svaltaiseksi.\\n\\nJ\u00e4rjest\u00e4ytyminen:\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\n3
  \u00a7\\n\\nP\u00f6yt\u00e4kirjan tarkastus ja n\u00e4ht\u00e4v\u00e4n\u00e4 pit\u00e4minen\\n\\nKirkkovaltuuston
  ty\u00f6j\u00e4rjestyksen 4 \u00a7:n mukaan valtuusto valitsee kaksi p\u00f6yt\u00e4kirjantarkastajaa
  tarkastamaan kokouksen p\u00f6yt\u00e4kirjan.\\n\\nKirkkolain 25 luvun 3 \u00a7:n
  mukaan kirkkovaltuuston p\u00f6yt\u00e4kirja on pidett\u00e4v\u00e4 n\u00e4ht\u00e4v\u00e4n\u00e4
  v\u00e4hint\u00e4\u00e4n oikaisuvaatimuksen tai valituksen tekemiselle varatun ajan
  eli 30 p\u00e4iv\u00e4\u00e4.\\n\\nTarkastusvuorossa ovat aakkosj\u00e4rjestyksen
  mukaan j\u00e4senet  Saku Nikkanen ja Anja Palmu.\\n\\nKirkkovaltuusto valitsee
  kaksi p\u00f6yt\u00e4kirjantarkastajaa.\\n\\nKirkkovaltuusto p\u00e4\u00e4tt\u00e4\u00e4
  p\u00f6yt\u00e4kirjan tarkastamisesta. P\u00f6yt\u00e4kirja tarkastetaan kirkkoherranvirastossa
  9.2.2018 klo 13.00 menness\u00e4.\\n\\nKirkkovaltuusto p\u00e4\u00e4tt\u00e4\u00e4,
  ett\u00e4 p\u00f6yt\u00e4kirja pidet\u00e4\u00e4n yleisesti n\u00e4ht\u00e4v\u00e4n\u00e4
  kirkkoherranvirastossa 12.2.\u201314.3.2018 klo 9.00\u201313.00.\\n\\nP\u00f6yt\u00e4kirjan
  tarkastajiksi valittiin yksimielisesti ilman suljettua lippu\u00e4\u00e4nestyst\u00e4
  Saku Nikkanen ja Eija Panttila.\\n\\nP\u00f6yt\u00e4kirja tarkastetaan kirkkoherranvirastossa
  9.02.2018 klo 13.00 menness\u00e4.\\n\\nP\u00f6yt\u00e4kirja pidet\u00e4\u00e4n
  yleisesti n\u00e4ht\u00e4v\u00e4n\u00e4 kirkkoherranvirastossa 12.2.2018\u201314.3.2018
  klo 9.00\u201313.00.\\n\\n------------------------------------------\\n\\nAri-Pekka
  Luoma saapui klo 12.34.\\n\\n4 \u00a7\\n\\nTy\u00f6j\u00e4rjestyksen hyv\u00e4ksyminen\\n\\nKirkkoneuvoston
  esitys: L\u00e4hetetty esityslista toimii ty\u00f6j\u00e4rjestyksen\u00e4.\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\nHyv\u00e4ksyttiin
  yksimielisesti esityksen mukaan.\\n\\n5 \u00a7\\n\\nKoskisen l\u00e4hetysrahaston
  toimintasuunnitelma vuodelle 2018\\n\\nL\u00e4hetysty\u00f6n johtokunta 20.9.2017
  \u00a7 8\\n\\nL\u00e4hetysty\u00f6n johtokunnan ja Salon seurakunnan kirkkoneuvoston
  hyv\u00e4ksymien perusteiden mukaan: Koskisen l\u00e4hetysrahastosta voidaan my\u00f6nt\u00e4\u00e4
  avustuksia Salon seurakunnan l\u00e4hetysty\u00f6n ajankohtaisiin hankkeisiin ja
  tarpeisiin l\u00e4hetysty\u00f6n johtokunnan vuosittain laatiman toimintasuunnitelman
  mukaisesti. Avustuksiin voidaan k\u00e4ytt\u00e4\u00e4 sek\u00e4 p\u00e4\u00e4omaa
  ett\u00e4 korkotuottoa.\\n\\nTarkastaminen ja n\u00e4ht\u00e4v\u00e4n\u00e4 pito:\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\nKirkkoneuvosto
  p\u00e4\u00e4tti kokouksessaan 19.3.2013, ett\u00e4 rahaston varoista p\u00e4\u00e4s\u00e4\u00e4nt\u00f6isesti
  k\u00e4ytet\u00e4\u00e4n rahaston korkotuottoa ja vain erityisen harkinnan perusteella
  p\u00e4\u00e4omaa. Koskisen rahaston tuottoa on vuonna 2018 k\u00e4ytett\u00e4viss\u00e4
  n. 20 832 \u20ac.\\n\\nP\u00e4\u00e4oma on 520 816 \u20ac. Viro on neuvostoajan
  j\u00e4lkeen yksi maailman maallistuneimpia maita.  Salon seurakunnan pitk\u00e4aikaiset
  nimikkol\u00e4hetit Anu ja Juha V\u00e4liaho (Juha nyt jo el\u00e4kkeell\u00e4,
  mutta jatkaa ty\u00f6t\u00e4) siirtyiv\u00e4t Ven\u00e4j\u00e4lt\u00e4 Viroon vuosikymmenen
  alkupuolella ja saivat teht\u00e4v\u00e4kseen aloittaa seurakuntaty\u00f6n Sauessa,
  joka on ollut ainoa Viron kaupunki ilman luterilaista seurakuntaa.  Luterilainen
  yhteis\u00f6 on syntynyt ja toimii l\u00e4hikaupungin Keilan seurakunnan yhteydess\u00e4
  (my\u00f6s kirjanpidon osalta). V\u00e4liahojen apuna toimii nykyisin my\u00f6s
  Anna Mishina, Evankelisen l\u00e4hetysyhdistyksen ty\u00f6ntekij\u00e4.\\n\\nOmien
  toimitilojen saaminen on ollut ajankohtainen jo pari vuotta. Sauen kaupungin taholta
  on ehdotettu kirkon rakentamista ja osoitettu siihen hyv\u00e4 tontti keskeiselt\u00e4
  paikalta. Sauen kirkon rakennuslupa-asia tulee n\u00e4ill\u00e4 n\u00e4kymin p\u00e4\u00e4tett\u00e4v\u00e4ksi
  lokakuun loppupuolella (kaupunginarkkitehdin pitk\u00e4n sairausloman vuoksi).  Koskisen
  rahaston vuoden 2017 avustuksella on laadittu alustavat piirustukset pinta-alaltaan
  210 neli\u00f6metrin suuruiseen rakennukseen (kustannusarvio n. 250 000 \u20ac).
  Vuoden 2018 toukokuussa on tarkoitus aloittaa yksityiskohtainen ja kustannuksiltaan
  ainakin kolminkertainen arkkitehtisuunnittelu (alustavan suunnitelman hinta 3500
  \u20ac, j\u00e4ljell\u00e4 1500 \u20ac). Rakennusty\u00f6t on mahdollista aloittaa
  aikaisintaan loppusyksyst\u00e4 2018. Rakentamisen p\u00e4\u00e4paino ajoittuisi
  vuosille 2019 ja 2020.\\n\\nVuoden 2018 kustannuksiin V\u00e4liahot pyyt\u00e4v\u00e4t
  Salon lis\u00e4ksi avustusta Tampereen etel\u00e4iselt\u00e4 seurakunnalta, ja seuraavina
  vuosina kaikilta viidelt\u00e4 yst\u00e4vyysseurakunnaltaan. Kun kaupungin virallinen
  lupa on saatu, on mahdollista aloittaa my\u00f6s vapaaehtoisen kannatuksen ker\u00e4\u00e4minen.
  Salon seurakunnalla ja seurakuntalaisilla on ennest\u00e4\u00e4n pitk\u00e4 perinne
  V\u00e4liahojen ty\u00f6h\u00f6n liittyneiden kirkkohankkeiden tukijana.\\n\\nVammaisten
  ja vaikeasti sairaiden lasten ja perheiden tukis\u00e4\u00e4ti\u00f6 (Jokainen-s\u00e4\u00e4ti\u00f6)
  on Suomen L\u00e4hetysseuran yhteisty\u00f6kumppani Ven\u00e4j\u00e4ll\u00e4. Vammaiset
  ovat Ven\u00e4j\u00e4ll\u00e4 v\u00e4liinputoajia yhteiskunnassa ja kirkossakin.
  S\u00e4\u00e4ti\u00f6 j\u00e4rjest\u00e4\u00e4 vuosittain integroidun leirin, jossa
  on sek\u00e4 vammaisia ett\u00e4 terveit\u00e4 lapsia (my\u00f6s Salon nimikkokohteesta
  turvakoti Dikonista).\\n\\nJohtavan viranhaltijan esitys: Koskisen rahaston toimintasuunnitelma
  vuodelle 2018: Avustusta annetaan 1) 20 000 Viron kirkolle/ Keilan seurakunnalle
  Sauen kirkon arkkitehtity\u00f6h\u00f6n ja rakennust\u00f6iden aloittamiseen, mik\u00e4li
  kaupunki antaa rakennusluvan.  2) 832 \u20ac vaikeavammaisten ja sairaiden lasten
  perheit\u00e4 tukevalle Jokainen-s\u00e4\u00e4ti\u00f6lle (Ven\u00e4j\u00e4, Inkerin
  kirkko) integroidun leirin j\u00e4rjest\u00e4miseen. P\u00e4\u00e4t\u00f6s: Keskustelun
  j\u00e4lkeen hyv\u00e4ksyttiin. Irma Iho j\u00e4tti eri\u00e4v\u00e4n mielipiteen.\\n\\nKirkkoneuvosto
  22.11.2017 \u00a7 135\\n\\nKirkkoherran esitys: Kirkkoneuvosto p\u00e4\u00e4tt\u00e4\u00e4
  esitt\u00e4\u00e4 kirkkovaltuustolle l\u00e4hetysty\u00f6n johtokunnan esitt\u00e4m\u00e4n
  Koskisen l\u00e4hetysrahaston toimintasuunnitelman hyv\u00e4ksymist\u00e4.\\n\\nP\u00e4\u00e4t\u00f6s:
  Hyv\u00e4ksyttiin yksimielisesti esityksen mukaan.\\n\\nKirkkovaltuusto 13.12.2017
  \u00a7 57\\n\\nKirkkoneuvoston esitys: Kirkkovaltuusto hyv\u00e4ksyy Koskisen l\u00e4hetysrahaston
  toimintasuunnitelman.\\n\\n--------------------------------------------\\n\\nIrma
  Iho esitti, ett\u00e4 johtokunnan m\u00e4\u00e4r\u00e4rahajakoa muutetaan siten,
  ett\u00e4 Viron kirkolle esitetyst\u00e4 m\u00e4\u00e4r\u00e4rahasta siirret\u00e4\u00e4n
  Jokainen-s\u00e4\u00e4ti\u00f6lle 5.000 euroa. H\u00e4nt\u00e4 kannattivat Simo
  Vesa ja Marja-Liisa Nore.\\n\\nJari Laiho esitti, ett\u00e4 toimintasuunnitelma
  palautetaan uudelleen valmisteluun. H\u00e4nt\u00e4 kannatti Eija Panttila.\\n\\nKirkkoneuvoston
  esitys:\\n\\nP\u00e4\u00e4t\u00f6s:\\n\\nKirkkovaltuusto \u00e4\u00e4nesti Jari
  Laihon esityksest\u00e4 asian palauttamiseksi uudelleen valmisteluun. K\u00e4ydyss\u00e4
  \u00e4\u00e4nestyksess\u00e4 asian palauttamisen kannalla oli 26 valtuutettua ja
  6 valtuutettua kannatti asian k\u00e4sittelyn jatkamista kirkkovaltuustossa.\\n\\nP\u00e4\u00e4t\u00f6s:
  Kirkkovaltuusto p\u00e4\u00e4tti \u00e4\u00e4nin 26\u20136 palauttaa Koskisen l\u00e4hetysrahaston
  toimintasuunnitelman uudelleen valmisteluun.\\n\\nKirkkoneuvosto 24.1.2018 \u00a7
  6\\n\\nKirkkoherran esitys: Kirkkoneuvosto esitt\u00e4\u00e4 kirkkovaltuustolle
  Koskisen rahaston toimintasuunnitelman hyv\u00e4ksymist\u00e4 johtokunnan alkuper\u00e4isen
  suunnitelman mukaisena.\\n\\nP\u00e4\u00e4t\u00f6s: Hyv\u00e4ksyttiin yksimielisesti
  esityksen mukaan lis\u00e4yksell\u00e4, ett\u00e4 l\u00e4hetysty\u00f6n johtokunta
  tutkii mahdollisuutta antaa lis\u00e4tukea Jokainens\u00e4\u00e4ti\u00f6lle omista
  talousarviovaroistaan tai tekee tarvittaessa esityksen kirkkoneuvostolle.\\n\\nKirkkoneuvosto
  esitt\u00e4\u00e4 kirkkovaltuustolle Koskisen rahaston toimintasuunnitelman hyv\u00e4ksymist\u00e4
  johtokunnan alkuper\u00e4isen suunnitelman mukaisena.\\n\\nHyv\u00e4ksyttiin yksimielisesti
  esityksen mukaan.\\n\\n6 \u00a7\\n\\nKirkkoneuvoston varaj\u00e4senet\\n\\nKirkkoneuvosto
  24.1.2018 \u00a7 12\\n\\nKirkkoneuvoston varapuheenjohtaja Jouko Siivo esitti, ett\u00e4
  kirkkoneuvosto esitt\u00e4\u00e4 kirkkovaltuustolle, ett\u00e4 P\u00e4ivi Uusitalon
  ja Iiris M\u00e4\u00e4tt\u00e4sen varaj\u00e4senet vaihtavat kesken\u00e4\u00e4n
  varaj\u00e4senyytt\u00e4. N\u00e4in ollen P\u00e4ivi Uusitalon varaj\u00e4senen\u00e4
  toimii Pirjo Parviainen ja Iiris M\u00e4\u00e4tt\u00e4sen varaj\u00e4senen\u00e4
  Seppo Heikkinen. Kaikilta asianosaisilta on kysytty lupa j\u00e4rjestelyyn.\\n\\nP\u00e4\u00e4t\u00f6s:
