  on osoitettava rekisteriasioista vastaavalle yhteyshenkil\u00f6lle. |\\n| 12 Muut
  henkil\u00f6tietojen k\u00e4sittelyyn liittyv\u00e4t oikeudet | Rekister\u00f6idyll\u00e4
