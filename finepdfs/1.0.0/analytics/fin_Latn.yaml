  11\\n\\nTIIVISTELM\u00c4\\n\\nT\u00e4ss\u00e4 tutkimuksessa tutkittiin ravinteiden,
  kokonaishiihen ja hapen saatavuuden ja m\u00e4\u00e4r\u00e4n vaikutusta \u00f6ljyhiilivetyjen
  hajoamisnopeuteen kahdella eri \u00f6ljyll\u00e4 pilaantuneella maamassalla (4A
  ja \u201dpima-massa\u201d) laboratorio- ja kentt\u00e4olosuhteissa. Hapen saatavuutta
  parannettiin mekaanisella sekoituksella. Ravinteita lis\u00e4ttiin molempiin maamassoihin
  sekoittamalla tutkimuksen alussa. Ravinteiden m\u00e4\u00e4r\u00e4 mitotettiin maamassojen
  TOC-pitoisuuden perusteella. Laboratoriokokeet suoritettiin Doranova Oy:n toimipisteess\u00e4
  Vesilahdella ja kentt\u00e4testaus suoritettiin Suomen Erityisj\u00e4te Oy:n alueella
  toukoo-elokuun aikana vuonna 2019.\\n\\nTutkimuksessa saatujen tulosten perusteella
  voidaan todeta, ett\u00e4 ravinteiden m\u00e4\u00e4r\u00e4 ei ole aumak\u00e4sittelyss\u00e4
  \u00f6ljyhiilivetyjen hajoamista rajoittava tekij\u00e4. T\u00e4ll\u00f6in hypoteesi
  siit\u00e4, ett\u00e4 ravinteita olisi Doranovan aikaisemmin suorittamissa tutkimuksissa
  ollut korkean TOC-pitoisuuden takia liian v\u00e4h\u00e4n, osoitettiin v\u00e4\u00e4r\u00e4ksi.\\n\\nYleisesti
  on tiedossa, ett\u00e4 maamassojen ilmastuksella (k\u00e4\u00e4nt\u00e4misell\u00e4)
  nopeutetaan \u00f6ljyhiilivetyjen hajoamista aumak\u00e4sittelyiss\u00e4. T\u00e4m\u00e4
  on luonnollista, koska aumoissa mikrobien tarvitseman hapen saatavuus on rajattua
  ja k\u00e4\u00e4nt\u00e4misell\u00e4 saadaan m\u00e4\u00e4r\u00e4 lis\u00e4tty\u00e4
  kustannustehokkaasti. T\u00e4m\u00e4 todettiin paikkansapit\u00e4v\u00e4ksi my\u00f6s
  t\u00e4ss\u00e4 tutkimuksessa, vaikka kent\u00e4ll\u00e4 ollessa pilot-aumassa \u00f6ljyhiilivetypitoisuudet
  eiv\u00e4t laskeneetkaan. \u00c4mp\u00e4rikokeissa ilmastuksen vaikutus oli kuitenkin
  odotettua pienempi. Kokonaihajoaminen massoilla oli varsinkin hyv\u00e4, ollen massalla
  4A 62 % ja pima-massalla 50 %, 8 viikon seurantajaksolla. Korkea hajoamisprosentti
  ei voida selitt\u00e4\u00e4 haihtumisella, koska t\u00e4ll\u00f6in kevyempien \u00f6ljyhiilivetyjakeiden
  osuus hajoamisessa pit\u00e4isi olla muita suurempi. Nyt se on ollut kaikissa jakeissa
  samaa suuruusluokkaa. Hajoaminen maamassoissa on luultavasti tapahtunut p\u00e4\u00e4asiassa
  maamassan pintosissa ja oissa, joihin happea on p\u00e4\u00e4syt kulkeutumaan. T\u00e4llaisen
  maamassan osuus \u00e4mp\u00e4ritilavuudessa on huomattavan suuri verrattuna j\u00e4teenk\u00e4sittelykent\u00e4ll\u00e4
  olevaan auman, jossa maakerroksen paksuus voi olla useita metrej\u00e4.\\n\\nMik\u00e4li
  \u00e4mp\u00e4rikokeet pystytt\u00e4isiin skaalaamaan isompaa mittakaavaan, saataisiin
  \u00f6ljyj\u00e4 hajotettua pilaantuneista maamassoista tehokkaasti. T\u00e4m\u00e4
  edellytt\u00e4isi j\u00e4teenk\u00e4sittelykentill\u00e4 eritt\u00e4in ohuita maakerrokseja,
  joka ei sellaisenaan tilanpuutteen vuoksi ole k\u00e4yt\u00e4nn\u00f6ss\u00e4 mahdollista.
  \u00c4mp\u00e4rikokeiden skaalaaminen isompaan mittakaavaan onnistuisikin vain erityisesti
  kyseiseen k\u00e4ytt\u00f6tarkoitukseen rakennetulla on-site reaktorilla tai k\u00e4sittelylavoilla,
  joissa hapensaanti olisi turvattu aivan kuten kokeessa k\u00e4ytetyiss\u00e4 \u00e4mp\u00e4reiss\u00e4.
  Jotta kyseinen laitteisto saataisiin rakennettua riitt\u00e4v\u00e4n kustannustehokkaaksi
  isoon mittakaavaan, tulisi t\u00e4st\u00e4 suunnitella ja rakentaa ensin laboratorio-
  ja pilot-mittakaavaan soveltuvaa laite lis\u00e4tulosten saamiseksi.\\n\\n1 Johdanto\\n\\nT\u00e4ss\u00e4
  raportissa kuvataan Tredea Oy:n kokeilupalveluhankintaan \u201dPilaantuneiden maiden
  puhdistaminen\u201d kuuluneet ty\u00f6t ja sen tulokset. Tehty ty\u00f6 on perustunut
  \u201dPuhtia pilotointiin\u201d-hankkeeseen ja siihen laadittuun pilotointirahoitushakemukseen
  (p\u00e4iv\u00e4tty 25.4.2019).\\n\\n2 Koej\u00e4rjestelyt ja laboratorioanalyysit\\n\\n2.1
  Tutkittavien massojen ominaisuudet\\n\\nMassaa 4A on kompostoitu puuhakkeen kanssa.
  \u00d6ljyhiilivetyn kokonaispitoisuus (C\\\\textsubscript{10}-C\\\\textsubscript{40})
  oli vuonna 2018 joulukuussa 7 100 mg/kg, joista raskaita jakeita (C\\\\textsubscript{21}-C\\\\textsubscript{40})
  oli noin 70 %. Massan kokonaisorgaanisen hiilen (TOC) pitoisuus oli 12 %, mik\u00e4
  on melko korkea, johtuen osittain massoihin lis\u00e4tyst\u00e4 orgaanisesta aineesta
  ja osittain massojen alkuper\u00e4st\u00e4 (mm. \u00f6ljyisi\u00e4 puhdistamoliitteit\u00e4).
  Massassa 4A kokonaisystyen ja kokonaisfosforin pitoisuudet olivat vuoden 2018 mittauksissa
  5,4 kg/tn ja 2,9 kg/tn, vastaavasti. \u00d6ljyhiilivetyn hajoamista on aiemmin testattu
  mitoittamalla ravinteet C:N:P-suhteessa 100:10:1 perustuen \u00f6ljyhiilivetyn sis\u00e4lt\u00e4m\u00e4n
  hiilen massaan (n. 86 % \u00f6ljyhiilivetyn massasta). Massoja on k\u00e4sitelty
  staattisissa biopile-kasoissa, joissa on ollut passiivinen ilmastus puhaltamalla.\\n\\n-
  \u00c4mp\u00e4rikokeissa haluttiin tutkia, voiko \u00f6ljyhiilivetyn hajoamista
  nopeuttaa sekoittamalla massaa aktiivisesti, jolloin ilma ja happi on paremmin saatavilla
  mikro-organismeille.\\n- \u00c4mp\u00e4rikokeissa haluttiin tutkia, onko massaaress\u00e4
  ravinnevajausta, joka aiheuttaa sen, etteiv\u00e4t \u00f6ljyhiilivedyt hajoa odotetusti.
  T\u00e4m\u00e4n vuoksi ravinnem\u00e4\u00e4ri\u00e4 mitoitettiin TOC:n mukaan, jolloin
  tarvittava ravinnem\u00e4\u00e4ri on suurempi kuin pelk\u00e4st\u00e4\u00e4n \u00f6ljyhiilivetyn
  pitoisuuden perusteella mitoitettuna. Oletuksena k\u00e4ytettiin, ett\u00e4 80 %
  TOC:sta on biosaatavaa mikrobeille.\\n- Ravinnemitoituksissa oletuksena oli, ett\u00e4
  massassa valmiina olevat kokonaisytypi ja -fosfori ovat biosaatavissa mikro-organismeille.\\n\\nPima-massa
  on aiemmin Doranovan kokeissa tutkimaton massa. Kokeisiin haluttiin ottaa \u00f6ljyhiilivedyll\u00e4
  pilaantunutta maata, jota ei ole k\u00e4sitelty kompostoimalla, ja jonka TOC on
  oletettavasti alhaisempi kuin massassa 4A. Massan \u00f6ljyhiilivetypitoisuus (C\\\\textsubscript{10}-C\\\\textsubscript{40})
  oli alustavan tiedon mukaan 9 200 mg/kg, josta raskaiden jakeiden (C\\\\textsubscript{21}-C\\\\textsubscript{40})
  osuus noin 62 %. Massasta ei ollut muita analyysitietoja saatavilla. Massa oli koostumukseen
  soraa, hiekkaa ja savea. Ravinteet mitoitettiin C:N:P-suhteessa 100:10:1.\\n\\n-
  \u00c4mp\u00e4rikokeissa haluttiin tutkia (osittain vertailuna massaan 4A), miten
  vaikuttaa erilainen massan tyyppi \u00f6ljyhiilivetyn hajoamiseen pelk\u00e4st\u00e4\u00e4n
  sekoittamalla.\\n- \u00c4mp\u00e4rikokeissa haluttiin my\u00f6s tutkia, onko havaittavissa
  ero ravinnelis\u00e4tyyn ja pelk\u00e4st\u00e4\u00e4n sekoitetun massan v\u00e4lill\u00e4,
  sek\u00e4 vertailla massan tyyppin vaikutusta tuloksiin.\\n- Ravinnemitoituksessa
  oletuksena oli, ett\u00e4 pima-massassa ei ole ravinteita entuudestaan lainkaan.\\n\\n2.2
  Koej\u00e4rjestely\\n\\nKoej\u00e4rjestely toteutettiin \u00e4mp\u00e4rimittakaavassa
  Doranovan tiloissa Vesilahdella. Massat jaettiin 10 litran \u00e4mp\u00e4reihin
  niin, ett\u00e4 \u00e4mp\u00e4rit tulivat melko t\u00e4yteen. Massaer\u00e4t koodattiin
  taulukon 1 mukaisesti riippuen siit\u00e4, oliko kyseess\u00e4 nollan\u00e4yte (4A_nolla
  ja pima_0), sekoitettuinko niit\u00e4 (4A+S_1&2, pima+S_1&2) vai lis\u00e4ttiink\u00f6
  niihin ravinteita sekoittamisen lis\u00e4ksi (4A+R+S_1&2, pima+R+S_1&2). Massoista
  otettiin laboratorion\u00e4ytteit\u00e4 0, 2, 5 ja 8 viikon aikapisteiss\u00e4.\\n\\nMassaan
  4A lis\u00e4ttiin kokonaisorgaanisen hiilin pitoisuuden perusteella 54 g ureaa,
  ja vastaavasti pima-massoihin lis\u00e4ttiin vain oletetun \u00f6ljyhiiliveltyl\u00e4ht\u00f6pitoisuuden
  mukaan 11,7\u201314,5 g ureaa. Urean m\u00e4\u00e4r\u00e4 perustui my\u00f6s jokaisen
  \u00e4mp\u00e4rin sis\u00e4lt\u00e4m\u00e4\u00e4n massan painoon. Massoihin \u2019pima+R+S_1&2\u2019
  lis\u00e4ttiin my\u00f6s 0,9 g diammoniumfosfaattia (DAP) fosforin l\u00e4hteeksi.
  DAP:n sis\u00e4lt\u00e4m\u00e4 typpi on huomioitu aiemmin lis\u00e4tyst\u00e4 typen
  m\u00e4\u00e4r\u00e4ss\u00e4. Massaan 4A ei DAPIa lis\u00e4tty, sill\u00e4 laskennallisesti
  massassa olisi riitt\u00e4v\u00e4sti fosforia.\\n\\n| \u00c4mp\u00e4ri | Massa          |
  Koodi     | Massa/kg | Urea/g | DAP/g |\\n|--------|----------------|-----------|----------|--------|-------|\\n|
  1      | 4A             | 4A_0      | 4,4      |        |       |\\n| 2      | 4A+sekoitus_1  |
  4A+S_1    | 4,6      |        |       |\\n| 3      | 4A+sekoitus_2  | 4A+S_2    |
  4,6      |        |       |\\n| 4      | 4A+sekoitus+ravinne_1 | 4A+R+S_1 | 4,3      |
  54     |       |\\n| 5      | 4A+sekoitus+ravinne_2 | 4A+R+S_2 | 4,3      | 54     |       |\\n|
  6      | pima           | pima_0    | 6,4      |        |       |\\n| 7      | pima+sekoitus_1
  | pima+S_1  | 6,5      |        |       |\\n| 8      | pima+sekoitus_2 | pima+S_2  |
  7        |        |       |\\n| 9      | pima+sekoitus+ravinne_1 | pima+R+S_1 |
  7,4      | 14,5   | 0,9   |\\n| 10     | pima+sekoitus+ravinne_2 | pima+R+S_2 |
  6        | 11,7   | 0,9   |\\n\\nKuva 1. \u00c4mp\u00e4rikokeiden aloitus. Vasemmalla
  massa 4A ja oikealla pima-massa. Varsinkin pima-massa oli savista ja vetist\u00e4.\\n\\nMassat
  sekoitettiin kerran viikossa py\u00f6ritt\u00e4m\u00e4ll\u00e4 yksi kerrallaan betonimyllyss\u00e4
  noin 1,5 min ajan. Kuvassa 1 on esitetty kuva \u00e4mp\u00e4reist\u00e4 sen j\u00e4lkeen,
  kun massojen jako, ravinteiden lis\u00e4ys ja alkun\u00e4ytteiden otto oli tehty.
  Massat s\u00e4ilytettiin lukittavassa kontissa ulkona. Massat olivat p\u00e4\u00e4sseen
  kastumaan ennen koej\u00e4rjestelyn aloittamista, mink\u00e4 vuoksi ne olivat osittain
  melko vetisi\u00e4. Kuhunkin \u00e4mp\u00e4riin pyrittiin samaan mahdollisimman
  v\u00e4h\u00e4n ylim\u00e4\u00e4r\u00e4ist\u00e4 vett\u00e4. Massaa 4A punnittiin
  keskim\u00e4\u00e4rin $4,44 \\\\pm 0,15$ kg ja pima-massaa keskim\u00e4\u00e4rin
  $6,66 \\\\pm 0,55$ kg.\\n\\n2.3 Pilottiaumakoe\\n\\n\u00c4mp\u00e4rikokeiden lis\u00e4ksi
  haluttiin tutkia aktiivisen ilmastuksen vaikutusta massaer\u00e4\u00e4n 4A sek\u00e4
  ravinteiden mitoittamista TOC:n mukaan. T\u00e4m\u00e4n vuoksi Suomen Erityisj\u00e4tteen
  k\u00e4sittelykent\u00e4lle (Kiimassuontie 127, Forssa) tehtiin noin $10 \\\\text{
  m}^3$ pilottiauma (kuva 2). Kauhakuormaaja kasasi aumasata 4A soveltuman m\u00e4\u00e4r\u00e4n
  massaa. T\u00e4h\u00e4n massaan sekoitettiin allukauhalla noin 120 kg ureaa, jotta
  tarvittava typen m\u00e4\u00e4r\u00e4 saavutettaisiin pilottiaumassa. Urean m\u00e4\u00e4r\u00e4
  arvioitiin punnitsemalla \u00e4mp\u00e4riilinen ureaa (noin 6,2 kg) ja sekoittamalla
  20 \u00e4mp\u00e4riillist\u00e4 massaan. Sekoituksen j\u00e4lkeen pikkuauma siirrettiin
  soveltuvalle paikalle, ja kasaukseen yhteydess\u00e4 massasta otettiin alkun\u00e4ytteet.
  Pilottiauma sekoitettiin kauhakuormaajan avulla kerran kuussa, jolloin sit\u00e4
  otettiin sekoituksen yhteydess\u00e4 my\u00f6s n\u00e4ytteet. Sekoitettaessa massa
  siirrettiin kauhakuormaajalla toiseen kohtaan ja jokaisen kauhallisen j\u00e4lkeen
  otettiin noin 10 osan\u00e4ytett\u00e4. T\u00e4m\u00e4n j\u00e4lkeen pikkuauma siirrettiin
  taakaisin oikealle paikalleen eli k\u00e4yt\u00e4nn\u00f6ss\u00e4 se sekoitettiin
  kahdesti jokaisen n\u00e4ytteenoton yhteydess\u00e4.\\n\\nKuva 2. Pilottiauman kasausta
  A), B) valmis pilottiauma.\\n\\n2.4 Laboratorioanalyysit\\n\\nEri aikapisteiss\u00e4
  massoista otetut n\u00e4ytteet l\u00e4hetettiin analysoitavaksi Synlab Analytics
  & Services Finland Oy -laboratorioon Karkkilaan. N\u00e4ytteist\u00e4 analysoitiin
  aikapisteest\u00e4 riippuen \u00f6ljyhiilivetypitoisuus, heterotrofiset mikro-organismit,
  ravinnepitoisuus (kokonaistyppi ja -fosfori, ammoniumtyppi) sek\u00e4 TOC. Analyyseiss\u00e4
  k\u00e4ytett\u00e4v\u00e4t menetelm\u00e4t on dokumentoitu analyysisertifikaateissa.
  Analyysisertifikaatit ovat t\u00e4m\u00e4n raportin liitteen\u00e4 1. Tulokset on
  koottu liitteeseen 2.\\n\\n3 Tulokset ja niiden tarkastelu\\n\\n3.1 Massojen sekoitus\\n\\nKuvassa
  3 on esitetty massojen sekoitusta betonimyllyss\u00e4. Massa 4A sekoittui hyvin
  ja hajosi pienemm\u00e4ksi. Kuvassa 3B oleva pima-massa sit\u00e4 vastoin oli ensimm\u00e4isen
  viikon j\u00e4lkeen edelleen m\u00e4rk\u00e4\u00e4 ja muodosti suurempia kokkareita
  myllyss\u00e4. Mylly piti v\u00e4lill\u00e4 sammuttaa ja kokkareet hajottaa, jotta
  massan sekoittumista voitiin edist\u00e4\u00e4.\\n\\n![Image](image1.png) ![Image](image2.png)\\n\\nKuva
  3. A) massa 4A, B), pima-massaa, joka sekoitettaessa paakkuuntui.\\n\\nKuvissa 4A
  on pima-massa kokeen alussa, ja 4B vasemmalla myllytetty ja oikealla koskematon
  pima-koe\u00e4mp\u00e4ri. Koskemattomassa koe\u00e4mp\u00e4ris\u00e4 massa oli paljon
  tiiviimp\u00e4\u00e4 ja j\u00e4nyt \u00e4mp\u00e4riin kiinni. Kuvassa 5 on esitetty
  massan 4A koostumus kokeen alussa ja yhden viikon ja sekoituksen j\u00e4lkeen. Massojen
  vetisyydet eiv\u00e4t en\u00e4\u00e4 olleet niin korkeita kuin koetta aloitettaessa.\\n\\n![Image](image3.png)
  ![Image](image4.png)\\n\\nKuva 4. Pima-massojen koostumus kokeen alussa.\\n\\nKuva
  5. Massan 4A muutos yhden viikon ja sekoituksen j\u00e4lkeen.\\n\\nViikon 5 n\u00e4ytteit\u00e4
  otettaessa massat olivat jo hyvin kuivuneet, ja pima-massa oli muuttunut osittain
  hienoksi p\u00f6lyksi. Pima-massassa oli pieni\u00e4 kovia kokkareita, jotka ovat
  muodostuneet massassa olleesta savesta.\\n\\n3.2 \u00d6ljyhiilivetypitoisuuksien
  muutos k\u00e4sittelyn aikana\\n\\n3.2.1 Massa 4A\\n\\n\u00d6ljyhiilivetypitoisuuden
  ($C_{10}-C_{40}$) muutos n\u00e4ytteiss\u00e4 on esitetty kuvassa 6. Massan 4A tulosten
  perusteella voidaan todeta, ett\u00e4 sekoituksella (ilmastuksella) ja/tai ravinteiden
  lis\u00e4yksell\u00e4 ei ole selv\u00e4\u00e4 vaikutusta \u00f6ljyhiilivetyjen hajoamisnopeuteen.
  \u00d6ljyhiilivetypitoisuus on tippunut kuitenkin selv\u00e4sti 8 viikon seurantajakson
  aikana, nollan\u00e4ytteell\u00e4 51 %, ilmastetulla n\u00e4ytteell\u00e4 62 % ja
  ravinnelis\u00e4tyll\u00e4 ilmastetulla n\u00e4ytteell\u00e4 34 %. T\u00e4ss\u00e4
  tutkimuksessa ravinteiden lis\u00e4\u00e4minen n\u00e4ytt\u00e4\u00e4 jopa hidastavan
  hajoamista, mutta koska rinnakkaisen m\u00e4\u00e4r\u00e4 tutkimuksessa on ollut
  pieni, voi ero t\u00e4ss\u00e4 selitty\u00e4 my\u00f6s satunnaisvaihtelulla.\\n\\nKuva
  6. Ilmastuksen ja ravinteiden lis\u00e4\u00e4misen vaikutus \u00f6ljyhiilivetyjen
  hajoamisnopeuteen \u201c4A-massalla\u201d\\n\\n3.2.2 Pima-massa\\n\\nPima-massan
  aloitusn\u00e4ytteist\u00e4 todettiin \u00f6ljyhiilivetypitoiisuudet, jotka olivat
  alle 1000 mg/kg. Olettamus koej\u00e4rjestely\u00e4 suunniteltaessa oli (l\u00e4ht\u00f6tietojen
  perusteella), ett\u00e4 massojen pitoisuudet olisivat noin 9000 mg/kg, joten t\u00e4m\u00e4n
  perusteella massoihin on laitettu moninkertaisesti ravinteita.\\n\\nPima-massojen
  \u00f6ljyhiilivetyjen ($C_{10}-C_{40}$) pitoisuuden muutokset on esitetty kuvassa
  7. Tulosten perusteella voidaan todeta, ett\u00e4 sekoituksella (ilmastuksella)
  ja/tai ravinteiden lis\u00e4yksell\u00e4 ei ole selv\u00e4\u00e4 vaikutusta \u00f6ljyhiilivetyjen
  hajoamisnopeuteen. \u00d6ljyhiilivetypitoisuus on tippunut kuitenkin selv\u00e4sti
  8 viikon seurantajakson aikana, nollan\u00e4ytteell\u00e4 42 %, ilmastetulla n\u00e4ytteell\u00e4
  50 % ja ravinnelis\u00e4tyll\u00e4 ilmastetulla n\u00e4ytteell\u00e4 42 %. T\u00e4ss\u00e4kin
  tapauksessa ravinnelis\u00e4ys ei n\u00e4ytt\u00e4 nopeuttavan prosessia mil\u00e4\u00e4n
  tavalla, ehk\u00e4 jopa hieman hidastaa hajoamisprosessia.\\n\\n![Ilmastuksen ja
  ravinteiden vaikutus \u00f6ljyjen hajoamisnopeuteen](image)\\n\\nKuva 7. Ilmastuksen
  ja ravinteiden lis\u00e4\u00e4misen vaikutus \u00f6ljyhiilivetyjen hajoamisnopeuteen
  \\\"pima-massalla\\\"\\n\\n3.2.3 Pilottiauma\\n\\nPilottiaumaa k\u00e4\u00e4nnettiin
  kerran kuussa touko-elokuun v\u00e4lill\u00e4, jolloin kasasta otettiin my\u00f6s
  kokoom\u00e4n\u00e4yte. Yhden kuukauden k\u00e4sittelyn j\u00e4lkeen aumaa sekoitettaessa
  siit\u00e4 tuli hyvin vahva ammoniakin haju, joka todenn\u00e4k\u00f6isesti johtuu
  lis\u00e4tyst\u00e4 ureasta. Urea muuttuu maaper\u00e4n kosteissa olosuhteissa ammonium-ioneiksi,
  jotka em\u00e4ksisiss\u00e4 olosuhteissa muuttuvat ammoniakiksi.\\n\\nPilottiauman
  \u00f6ljyhiilivetypitoisuuden muutokset on esitetty kuvassa 8. Tulosten perusteella
  voidaan todeta, ett\u00e4 hajoamista ei ole tapahtunut. Lis\u00e4ksi voidaan todeta,
  ett\u00e4 ravinteiden lis\u00e4ys ei nopeuta hajoamista.\\n\\n3.2.4 Yhteenveto\\n\\n\u00d6ljyhiilivetyjen
  hajoamistestauksen tulosten perusteella ravinteiden lis\u00e4\u00e4misell\u00e4
  ei ole vaikutusta \u00f6ljyhiilivetyjen hajoamisnopeuteen. T\u00e4ll\u00f6in hypoteesi
  siit\u00e4, ett\u00e4 ravinteiden m\u00e4\u00e4r\u00e4 olisi tutkittavilla massoilla
  ollut hajoamista rajoittava tekij\u00e4, osoitettiin v\u00e4\u00e4r\u00e4ksi. Maamassojen
  ilmastuksella (k\u00e4\u00e4nnt\u00e4misell\u00e4) laboratorion \u00e4mp\u00e4rikokeissa
  todetaan olevan hajoamista nopeuttava vaikutus. \u00c4mp\u00e4rikokeissa vaikutus
  on kuitenkin melko pieni, korkeintaan vain noin 10 %. Tulosten perusteella pilot-aumassa
  (\\\"pikkuauma\\\") auman k\u00e4\u00e4nnt\u00e4misell\u00e4 ei ollut hajoamiseen
  mit\u00e4\u00e4n vaikutusta, mik\u00e4 on tuloksena yll\u00e4tt\u00e4v\u00e4, koska
  k\u00e4\u00e4n\u00e4misen on todettu yleisesti nopeuttavan \u00f6ljyhiilivetyjen
  hajoamista aumak\u00e4sittelyiss\u00e4.\\n\\n3.3 Muiden ominaisuuksien muutos\\n\\n3.3.1
  Kuiva-aineepitoisuus\\n\\n\u00c4mp\u00e4rikokeissa kuiva-aineepitoisuus muuttui
  tutkimuksen aikana melko nopeasti: Tutkimuksen alussa massat olivat hyvin m\u00e4rki\u00e4
  ja lopussa melko kuivia. Suurin syy massojen kuivumiseen oli se, ett\u00e4 maamassojen
  m\u00e4\u00e4r\u00e4t olivat hyvin pieni\u00e4, mink\u00e4 vuoksi veden haihtumista
  tapahtui pilot au- maa enemm\u00e4n. T\u00e4m\u00e4n lis\u00e4ksi \u00e4mp\u00e4rit
  s\u00e4ilytettiin sateelta suojuvassa kuivassa tilassa, kun taas pilot-auma sijaitsi
  ulkona peittelem\u00e4tt\u00f6m\u00e4n\u00e4 j\u00e4tteenk\u00e4sittelykent\u00e4ll\u00e4.
  Kuiva-aineepitoisuuden muutokset \u00e4mp\u00e4rikokeissa on esitetty kuvassa 8.\\n\\n3.3.2
  Ravinnepitoisuudet\\n\\nYhteist\u00e4 ravinnepitoisuksien osalta kaikissa n\u00e4ytteiss\u00e4
  oli se, ett\u00e4 vesiliukoisen typen (N) m\u00e4\u00e4r\u00e4 lis\u00e4\u00e4ntyi
  kokeen aikana, typen kokonaispitoisuksien pysyess\u00e4 ennallaan. Kokonaisfosforipitoisuudet
  pysyiv\u00e4t kokeen aikana my\u00f6skin ennallaan ja liukoista fosforia ei havaittu
  ollenkaan.\\n\\n4 Johtop\u00e4\u00e4t\u00f6kset\\n\\n\u00d6ljyhiilivetyjen hajoamistestauksen
  tulosten perusteella voidaan todeta, ett\u00e4 ravinteiden m\u00e4\u00e4r\u00e4
  ei ole aumak\u00e4sittelyss\u00e4 \u00f6ljyhiilivetyjen hajoamista rajoittava tekij\u00e4.
  T\u00e4ll\u00f6in hypoteesi siit\u00e4, ett\u00e4 ravinteita olisi aikaisemissa
  tutkimuksissa ollut korkean TOC-pitoisuuden takia liian v\u00e4h\u00e4n, osoitettiin
  v\u00e4\u00e4r\u00e4ksi.\\n\\nYleisesti on tiedossa, ett\u00e4 maamassojen ilmastuksella
  (k\u00e4ant\u00e4misell\u00e4) nopeutetaan \u00f6ljyhiilivetyjen hajoamista aumak\u00e4sittelyiss\u00e4.
  T\u00e4m\u00e4 on luonnollista, koska aumoissa mikrobien tarvitseman hapen saatavuus
  on rajattua ja k\u00e4ant\u00e4misell\u00e4 saadaan hapen m\u00e4\u00e4r\u00e4 lis\u00e4tt\u00e4v\u00e4
  kustannustehokkaasti. T\u00e4m\u00e4 todettiin paikkansapitav\u00e4ksi my\u00f6s
  t\u00e4ss\u00e4 tutkimuksessa, vaikka kent\u00e4ll\u00e4 olleessa pilot-aumassa
  \u00f6ljyhiilivetypitoisuudet eiv\u00e4t laskeneetkaan. \u00c4mp\u00e4rikokeissa
  ilmastuksen vaikutus oli kuitenkin odotettua pienempi. Toisaalta kokonaihajoaminen
  oli varsin hyv\u00e4, ollen massalla 4A jopa 62 % 8 viikon seurantajaksolla. Korkea
  hajoamisprosenttia ei voida selitt\u00e4\u00e4 haihtumisella, koska t\u00e4ll\u00f6in
  kevyempien \u00f6ljyhiilivetjakeiden osuus hajoamisessa pit\u00e4isi olla muita
  suurempi. Nyt se on ollut kaikissa jakeissa samaa suuruusluokkaa. Hajoaminen maamassoissa
  on luultavasti tapahtunut p\u00e4\u00e4asiassa maamassan pintaoissa ja oissa, joihin
  happea on p\u00e4\u00e4sytt kulkeutumaan. T\u00e4llaisen maamassan osuus \u00e4mp\u00e4ritilavuudessa
  on huomattavan suuri verrattuna j\u00e4tteenk\u00e4sittelykent\u00e4ll\u00e4 olevaan
  aumaan, jossa maakerroksen paksuus voi olla useita metrej\u00e4.\\n\\nMik\u00e4li
  \u00e4mp\u00e4rikokeet pystytt\u00e4isiin skaalaamaan isompaan mittakaavaan, saataisiin
  \u00f6ljyj\u00e4 hajotettua pilaantuneista maamassoista tehokkaasti. T\u00e4m\u00e4
  edellytt\u00e4isi j\u00e4tteenk\u00e4sittelykentill\u00e4 eritt\u00e4in ohuita maakerrokseja,
  joka ei sellaisenaan tilanpuutteen vuoksi ole k\u00e4yt\u00e4nn\u00f6ss\u00e4 mahdollista.
  \u00c4mp\u00e4rikokeiden skaalaaminen isompaan mittakaavaan onnistuisiin vain erityisesti
  kyseiseen k\u00e4ytt\u00f6tarkoitukseen rakennetulla on-site reaktorilla tai k\u00e4sittelylavoilla,
  joissa hapensaanti olisi turvattu aivan kuten kokeessa k\u00e4ytettyss\u00e4 \u00e4mp\u00e4reiss\u00e4.
  Jotta kyseinen laitteisto saataisiin rakennettua\\n\\nriitt\u00e4v\u00e4n kustannustehokkaaksi
  isoon mittakaavaan, tulisi t\u00e4st\u00e4 suunnitella ja rakentaa ensin laboratorio-
  ja pilot-mittakaavaan soveltuvu laite lis\u00e4tulosten saamiseksi.\\n\\nVesilahdella
