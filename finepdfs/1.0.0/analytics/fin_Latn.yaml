  Ennen k\u00e4ytt\u00f6ist\u00e4 k\u00e4ytt\u00f6\u00e4 USAssa-FDA:n hyv\u00e4ksynt\u00e4
  kest\u00e4\u00e4 n. 6 kk; Japanissa hyv\u00e4ksynt\u00e4 kest\u00e4\u00e4 arviolta
  6-12 kuukautta. Vastaavia hyv\u00e4ksynt\u00f6j\u00e4 kliiniselle k\u00e4yt\u00f6lle
  ei tarvita useimmissa muissa maissa. Hyv\u00e4ksynt\u00f6j\u00e4 tutkimusk\u00e4yt\u00f6lle
  ei tarvita maailmanlaajuisesti.\\n\\nNesteannostelun robottisovelluksiin Biohit
  kehitt\u00e4\u00e4 ns. remote control -annostelijaa, joka takaa korkean suorituskyvyn
  n\u00e4iden instrumenttien osana.\\n\\nBiohitin systeemiajattelu kehitetyiss\u00e4
  nesteenannosteluteknologiassa, diagnostikassa ja instrumenteissa muodostavat yhti\u00f6llemme
  vahvan kasvupohjan.\\n\\n**INSTRUMENTIT**\\n\\nBiohit kehitt\u00e4\u00e4 parhaillaan
  instrumenttien liiketoimintaryhm\u00e4\u00e4n kuuluvia tuotteita. Biohitin tavoitteena
  on tarjota instrumentteja seuraaville kolmelle markkinasegmentille: tutkimuksessa
  k\u00e4ytett\u00e4v\u00e4t instrumentit, kliinisiss\u00e4 sovelluksissa k\u00e4ytett\u00e4v\u00e4t
  instrumentit ja teollisissa sovelluksissa k\u00e4ytett\u00e4v\u00e4t instrumentit.
  Liiketoiminta-alueeseen tulee kuulumaan seuraavat tuoteryhm\u00e4t: mikrolevylukijat,
  nesteannostelutekniikan instrumentit ja tiettyt muut mikrolevyinstrumentit molekyylibiologian
  sovelluksia varten.\\n\\nInstrumenttiiperheen eri tuotteet tulevat perustumaan modulaariseen
  rakenteeseen, jossa tiettyt osat, kuten esim. kotelot ja robotiikka tulevat olemaan
  yhteisi\u00e4 kaikille tuotteille. T\u00e4m\u00e4 mahdollistaa tuotantokustannusten
  alentuminen ja uusien tuotteiden nopeamman lansseeraamisen. Tuotteita tullaan markkinoimaan
  yksitt\u00e4isesti sek\u00e4 osana synergieit\u00e4v\u00e4\u00e4 hy\u00f6dynt\u00e4vi\u00e4
  analysointij\u00e4rjestelmi\u00e4, jotka instrumenttien lis\u00e4ksi k\u00e4sitt\u00e4v\u00e4t
  Biohitin nesteannostelutuotteita ja diagnostisia testej\u00e4.\\n\\n**Instrumenttien
  tuotekehitys ja markkinapotentiali**\\n\\nJo 1970-luvun lopulla Biohitin nykyinen
  johto ja er\u00e4\u00e4t avainhenkil\u00f6t kehittiv\u00e4t ja kaupallisivat kaksi
  tri Osmo Suovanimen 1960-lopulla tekem\u00e4\u00e4 keksint\u00f6\u00e4: yksi- ja
  monikanavaiset s\u00e4\u00e4dett\u00e4v\u00e4t, mekaaniset pipetit (Finnpipette\u00ae)
  sek\u00e4 vertikaalimittausperiaatteen ja sen instrumenttisovelluksen (nim. Multiskan\u00ae).
  Biohit on tutkinut ja kehitt\u00e4nyt edelleen vertikaalimittautua 1980-luvun lopulta
  ja 1990-luvun alussa.\\n\\nOn arvioitu, ett\u00e4 vertikaalimittaukseen perustuvien
  mikrolevylukijoiden, monikanavaisten pipetien, mikrolevyjen sek\u00e4 muiden vertikaalimittausperiaatteiden
  mukaisesti kehitettyjen oheistuotteiden markkinat ovat suuruudeltaan yli USD 1 mrd.
  vuosittain.\\n\\nVertikaalimittaukseen perustuvat instrumentit ovat mahdollistaneet
  laajamittaisen tutkimuksen ja erityisesti entsyymi-immunom\u00e4\u00e4ritys (EIA)
  -teknologian nopean kehityksen ja sen sovellukset, kuten sy\u00f6p\u00e4- ja tarttumatautiien
  analysoinnin ja toteamisen. EIA-teknologian kehityst\u00e4 on seurannut viimeisen
  kymmenen vuoden aikana molekyylibiologian teknikoiden nopea kehittyminen. N\u00e4ihin
  molekyylibiologian teknikoihin kuuluu mm. Polymerase Chain Reaction (PCR) \u2013teknikka,
  jota k\u00e4ytet\u00e4\u00e4n DNA:n monistamiseen. Vertikaalimittauksen sovelluksia
  on viime vuosina k\u00e4ytetty laajalti PCR-teknikan ja vastaavien sovellusten yhteydess\u00e4.\\n\\n---\\n\\n58
  Finnpipette on Labsystems Oy:n rekister\u00f6im\u00e4 tavaramerkki.\\n59 Multiskan
  on Labsystems Oy:n rekister\u00f6im\u00e4 tavaramerkki.\\n60 Suovanenmi, O. (1994).
  *Automated Instrumentation for Clinical and Research Laboratories \u2013 Innovations
  and Development of Vertical Light Beam Photometers and Electronic Pipettors*, v\u00e4it\u00f6skirja,
  Helsingin Yliopisto.\\n61 Tsuzuki, M. (1992). *Inner-Filter Correction with a Fluorometer-Based
  Multifunctional Instrument*, v\u00e4it\u00f6skirja, Helsingin Yliopisto.\\n62 McGrath
  & Associates, Inc., 1999.\\n63 Suovanenmi, 1994:46.\\n64 Tutkija Kary Mullis keksi
  PCR-teknikan vuonna 1983, jota koskien h\u00e4nen my\u00f6nnettiin Nobelin palkinto
  vuonna 1993.\\n\\nHALLITUKSEN TOIMINTAKERTOMUS\\n\\nBiohit valmistan laboratoriolaitteita
  ja \u2013t\u00e4rvikkeit\u00e4 sek\u00e4 kehitt\u00e4\u00e4 diagnostisia testij\u00e4rjestelmi\u00e4
  tutkimuslaitosten, terveydenhuoltolaisten ja teollisuuden laboratorioihen k\u00e4ytt\u00f6\u00f6n.
  Nesteannosteluliiketoiminnan alueella Biohitin p\u00e4\u00e4tootteet ovat elektroniset
  ja mekaaniset pipetti sek\u00e4 niiden kertak\u00e4ytt\u00f6k\u00e4rjet. Vuonna
  1988 toimintansa aloittanut Biohit on elektronisten nesteannostelijoiden globaali
  markkinajohtaja.\\n\\nLiikevaihto\\nBiohit\u2013konsernin liikevaihto kasvoi 22%
  edellisvuodesta eli 100,4 Mmk:sta 122,2 Mmk:aan. Ulkomaan myynnin osuus oli sama
  kuin edellisen\u00e4 vuonna eli 96%. Liikevaihdosta 72% kertyi Euroopan maista,
  13% Amerikasta ja loput 15% p\u00e4\u00e4asiassa Aasiasta. Liikevaihdon kasvu vastasi
  asettettuja tavoitteita ja koostui p\u00e4\u00e4asiassa elektronisten nesteannostelijoiden
  lis\u00e4\u00e4ntyneest\u00e4 myynnist\u00e4.\\n\\nTulos\\nTilikauden liikevoitto
  oli 7,9 Mmk, kun se edellisell\u00e4 tilikaudella oli 8,2 Mmk. Vuosien 1998 ja 1999
  liikevoitot eiv\u00e4t kuitenkaan ole t\u00e4ysin vertailukelpoisia, koska vuoden
  1999 liikevoitto rasisitavat 5,3 Mmk:n suuruinen, 30.12.1998 liitteen konserniin
  kuuluneisiin Locus genex Oy:n ja Biohit Systems, Inc.:n liittyv\u00e4n konserniliikevaron
  poisto sek\u00e4 Locus genex Oy:n 2,8 Mmk:n liiketappio. Toisaalta vuoden 1998 tulosta
  heikent\u00e4v\u00e4t aktiviteetit kehitt\u00e4misenhojen poistumisesta ja muutoksesta
  aiheuttamat 3,5 Mmk suuruinen poisto, joka oli suurempi kuin vuonna 1999. Ilman
  konserniliikevaropistoista tilikauden liikevoitto olisi ollut 13,2 Mmk eli 5,0 Mmk
  (61%) parempi kuin edellisvuonna.\\n\\nNettorahoituskulut olivat 3,0 Mmk, 2,5 Mmk,
  pienemmin edellisell\u00e4 tilikauden verrattuna johtuen p\u00e4\u00e4osin rahoitusraakenteen
  parannemisesta. Toisaalta tilikauden korkohkin sis\u00e4ltyy edellisvuodesta poiketen
  Biohit Oyj:n p\u00e4\u00e4omalaanolle kertyneet korot sek\u00e4 kuluneelta tilikaudelta
  (0,2 Mmk) ett\u00e4 aikaisemmilta tilikausilta (1,4 Mmk).\\n\\nTilikauden satunnaiset
  tuotot 2,0 Mmk sis\u00e4lt\u00e4\u00e4 Kajaanin kaupungilta saatavan vahingonkorvauskseen
  ja vuoden 1998 4,0 Mmk koostuu vaihto-omaisuuden arvostusperiaatteen muutoksen vaikutuksesta
  ja tiettyjen maksuvelvoitteiden poistumisesta.\\n\\nVoitto ennen veroja oli 6,9
  Mmk, joka on edellisvuoden tasolla. Tilikauden voitto 4,1 Mmk j\u00e4\u00e4 kuitenkin
  2,4 Mmk edellisvuotta pienemm\u00e4ksi konsernin maksamien tuloverojen vuoksi.\\n\\nMaksuvalmius\\nKonsernin
  maksuvalmius on edelleen vahva. Kes\u00e4kuussa 1999 toteutettu osakeanti on olennaisesti
  vahvistanut konsernin rahoitusasemaa ja mahdollistanut uusien investointihankkeiden
  suunnitellun k\u00e4ynnist\u00e4misen ja konsernin vieraan p\u00e4\u00e4oman v\u00e4hent\u00e4misen.
  Korollista vierasta p\u00e4\u00e4oma on lyhenetty 16,7 Mmk:lla, joista 9,4 Mmk on
  ennen\u00e4k\u00e4istettuja lyhennyksi\u00e4.\\n\\nOmavaraisuusaste kasvoi edellisvuoden
  lopun 38,8%:sta 66,0 %:iin.\\n\\nInvestoinnit\\nTilikauden kokonaisinvestoinnit
  olivat 7,6 Mmk, joka koostuu p\u00e4\u00e4osin investoinneista tietoj\u00e4rjestelmiin
  ja tuotannon koneisiin ja laitteisiin.\\n\\nTuotekehitys\\nNesteannosteluliiketoiminnan
  alueella Biohit saa tilikaudella tuotantovalmiuksia kuusi uutta Biohit Proline\u00ae
  \u2013tuotetta. Vuonna 1999 yhti\u00f6 kehitti useita uusia OEM-nesteannostelutoiteita,
  jotka t\u00e4ydent\u00e4v\u00e4t Biohitin sek\u00e4 muiden yritysten instrumenteista
  ja diagnostisista tuotteista koostuvia j\u00e4rjestelmi\u00e4.\\n\\nDiagnostiikkaaliiketoiminnan
  alueella yhti\u00f6n mm. mahasy\u00f6v\u00e4n sek\u00e4 maha- ja pohjukaisuusolihaavan
  riskin mittaukseen tarkoitettun testipaneelin kehitysty\u00f6 eteni asettettujen
  tavoitteiden mukaisesti.\\n\\nTuotekehityksen menot olivat 6,4 Mmk (4,4 Mmk) eli
  5,2% (4,4%) liikevaihdosta.\\n\\nListautuminen Helsingin P\u00f6rssiin\\nBiohit
  muutti julkiseksi osakeyhti\u00f6ksi huhtikuussa 1999 ja listautui Helsingin P\u00f6rssin
  NM-listalle kes\u00e4kuussa 1999. Biohitin B-osakeiden kaupank\u00e4ynti alkoi 18.6.1999.\\n\\nListautumisen
  yhteydess\u00e4 toteutettiin suunnattu osakeanti, jossa tarjottiin 2.000.000 uutta
  B-osaketta nimellisarvoltaan EUR 0,17 suomalaista ja ulkomaisten institutionaalisten
  sijoittajien ja suomalaisen yleis\u00f6n merkitt\u00e4v\u00e4ksi EUR 4,5 kappaleihinalla.
  Osakekoiden merkit\u00e4-aika oli 2. \u2013 15.6.1999. Osakeanti keskeyttiin 14.6.1999
  ylimerkinn\u00e4n johdosta.\\n\\nOsakkeet alkoivat merkit\u00e4 osakekoiden lukum\u00e4\u00e4r\u00e4
  nousee 750.000 ja leisit\u00f6n osuudeksi 1.250.000 osaketta. Osakkeen myyntiin
  tuli 12.264.537 kappaaleeseen sek\u00e4 A- ja B-osakekoiden yhteens\u00e4 12.264.537
  kappaaleeseen. Osakkep\u00e4\u00e4oma kasvoi 340.000 eurolla (FIM 2 Mmk). Uudet
  osakkeet oikeuttavat t\u00e4yteen osinkoon 1.1.1999 alkanelta tilikaudelta lukien.
  Osakkeet tuottavat muut oikeudet osakelp\u00f6m\u00e4\u00e4n korottamisen rekister\u00f6innist\u00e4
  lukien. Osakkeenomistajien lukum\u00e4\u00e4r\u00e4 kasvoi l\u00e4hes 3000:een.
  Saadut varat tullaan k\u00e4ytt\u00e4m\u00e4\u00e4n kansainv\u00e4lisen markkinoinnin
  ja huoltotoiminnan vahvistamiseen sek\u00e4 tuotekehityksen ja tuotannon edelleenkehitt\u00e4miseen.\\n\\nOsmo
  Suovaniemi ja h\u00e4nen l\u00e4hipiirins\u00e4 omistusosuus ennen antia oli 65,5%
  ja annin j\u00e4lkeen 54,8%. Osakkeilla oli vain v\u00e4h\u00e4inen vaikutus \u00e4\u00e4nivalvion
  jakautumiseen.\\n\\nTyt\u00e4ryhti\u00f6t ja muut yhti\u00f6j\u00e4rjestelyt\\nKonserniin
  kuuluvat 31.12.1999 Englannissa Biohit Ltd. ja Wolf Laboratories Ltd., Ranskassa
  Biohit S.A., Italiana Biohit s.r.l., Saksassa Biohit Deutschland GmbH, Japanissa
  Biohit Japan Co., USA:ssa Biohit Systems Inc. ja Suomessa Locus genex Oy sek\u00e4
  Vantaan Hiionmekano Oy, joilla ei ole liiketoimintaa.\\n\\nLaser Laboratories Ltd:n
  toiminnot yhdistettiin osaksi Biohit Ltd:\u00e4\u00e4 1.5.1999, johon asti se toimi
  konsermissa erillisen\u00e4 yhti\u00f6n\u00e4.\\n\\nHallinto ja henkil\u00f6st\u00f6\\nBiohit
  Oy:n hallituksen ovat kuuluneet tilikaudella puheenjohtajana professori Reijo Luostarinen
  ja j\u00e4senin\u00e4 LKT Osmo Suovaniemi, professori M\u00e5rten Wikstr\u00f6m
  ja Erja-Kiinteist\u00f6 Oy:n hallituksen puheenjohtaja Pekka Salonoja. Yhti\u00f6n
  toimitusjohtajana on toiminut LKT Osmo Suovaniemi.\\n\\nN\u00e4kym\u00e4t vuodelle
  2000\\nBiohitin myymin ennakoitaa edelleen kasvanut vuonna 2000 noin 20% edellisvuoteen
  verrattuna. Vuoden 2000 tuloksen arvioidaan olevan hieman vuoden 1999 tulosta parempi
  perustuen konsernin uusien toimialojen k\u00e4ynnistymiseen. Uudet toimialat ovat
  kuitenkin edelleen osittain kehitysvaiheessa ja tulosta tulee edelleen rasisittamaan
  vuoden 1998 lopussa toteutettujen yhti\u00f6j\u00e4rjestelyjen seurauksena syntynneen
  konserniliikevaron poisto.\\n\\n## TULOSLASKELMA JA RAHOITUSLASKELMA\\n\\n### TULOSLASKELMA
