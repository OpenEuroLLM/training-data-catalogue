  Finance Oy (1999). \\\\textit{Biohit Oy:n tarjousesite}, 31.5.:33\\n\\nKertak\u00e4ytt\u00f6k\u00e4rjet\\n\\nBiohitin
  valmistamat nesteannostelijat ja muovista puristetut kertak\u00e4ytt\u00f6k\u00e4rjet
  muodostavat yhdess\u00e4 toimivan ja luotettavan kokonaisuuden. Biohit takaa nesteannostelijoidensa
  tarkkuuden ja toistettavuuden asiakkaan k\u00e4ytt\u00e4ess\u00e4 Biohitin kehitt\u00e4m\u00e4\u00e4
  ja valmistamia k\u00e4rki\u00e4. Nesteannosteluj\u00e4rjestelm\u00e4n kokonaisvaltaiseen
  kehitysty\u00f6h\u00f6n liittyy aina oloellisena osana k\u00e4rkin edelleenkehitt\u00e4minen.\\n\\nBiohit
  Proline -k\u00e4rjet t\u00e4ydent\u00e4v\u00e4t mekaanisten ja elektronisten pipettien
  valikoimaa.\\n\\nHuolto- ja koulutuspalvelut\\n\\nBiohit tarjoaa osana tuote- ja
  markkinointistrategiaansa huolto-, kalibrointi ja koulutuspalveluita tyt\u00e4ryritys-
  ja jakelijaverkostonsa kautta. N\u00e4ill\u00e4 eritt\u00e4in tarpeellisilla palveluillaan
  yhti\u00f6 hankkii uusia pitk\u00e4aikaisia asiakkaita, parantaa asiakastytt\u00e4vyisyytt\u00e4
  ja -uskollisuutta, imagoaan sek\u00e4 tulostaan.\\n\\nVuonna 1999 lanseeratut tuotteet\\n\\nToimitavuonna
  1999 Biohit julkisti seuraavat kuusi uutta nesteannostelutuotetta.\\n\\nElektronista
  Biohit Proline \u2013nesteannostelutuoteperhe\u00e4 t\u00e4ydennettiin uusilla yksi-
  ja 12-kanavaisilla 50 \u2013 1200 \u03bcl:n tilavuusalueelle tarkoitettuilla pipetteill\u00e4.
  Kyseiset pipettit on kehitetty Biohitin mikrolevyphojaisen ja tulevien vertikaalimitauksen
  perustuvien instrumenttien kanssa tapahtuvan ty\u00f6skentelyyn sek\u00e4 ty\u00f6kaluki
  tutkijoille, jotka tarvitsevat ty\u00f6skentelyss\u00e4\u00e4n joustavuutta ja laatuja.
  1200 \u03bcl:n maksimitilavuus ja pienet s\u00e4\u00e4tovalit tekev\u00e4t n\u00e4ist\u00e4
  tuotteista ideaalisia nopeaan mikrolevyty\u00f6skentelyyn. Kahdeksans- ja 12-kanavaiset
  annostelijat soveltuvat eritt\u00e4in hyvin korvaamaan perinteiset mikrolevypesurit
  k\u00e4ytett\u00e4ess\u00e4 mikrolevypohjaisia immunom\u00e4ritysmenetelmi\u00e4.
  Yksikanavainen malli soveltuu hyvin nesteiden annosteluun mm. putkiin, ampulleihin,
  pulloihin, petrimaljoille ja solulviljelylevyille.\\n\\nKevytrakenteinen, johdoton
  pipetointilaitte Midi Plus on kehitetty solubiologian ja kemian teollisuuden sovel-\\n\\nluksiin.
  Ainutlaatuisen lis\u00e4varusteena avulla Midi Plus voidaan kiinnitt\u00e4\u00e4
  ty\u00f6skentelyn ajaksi ripustuslaitteeseen ja laskea sopivalle ty\u00f6skentelykorkeudelle.
  T\u00e4m\u00e4 lis\u00e4varuste v\u00e4hent\u00e4\u00e4 pitkien ty\u00f6skentelyaikojen
  aiheuttamaa rasitus ta. T\u00e4m\u00e4n lis\u00e4ksi kiinte\u00e4n tukijalan avulla
  laite voidaan asettaa ty\u00f6skentelyjaksojen v\u00e4lill\u00e4 p\u00f6yd\u00e4lle
  pipetin ollessa laitteessa kiinni.\\n\\nVuonna 1999 Biohit saattoi p\u00e4\u00e4t\u00f6kseen
  uuden elektronisen pipettiperheen kehitysty\u00f6n. Suurin ero t\u00e4m\u00e4n uuden
  tuoteperheen ja vakiomallisten elektronisten Biohit Proline \u2013annostelijoiden
  v\u00e4lill\u00e4 on se, ett\u00e4 akun laturi on kiinnitetty pipetin yl\u00e4osaan
  ja t\u00e4tten erillist\u00e4 lataustelinett\u00e4 ei tarvita. Kyseinen uusi pipettiperhe
  on tarkoitettu p\u00e4\u00e4s\u00e4\u00e4nt\u00f6isesti korvaamaan mekaanisten pipettien
  korkean hintalukovan tuotteita. Kyseinen tuoteperhe on rekister\u00f6ity vuonna
  1999 USA:ssa ePETin nimell\u00e4.\\n\\nTilikaudella Biohit t\u00e4ydensi mekaanisten
  pipettien valikoimaansa 0.1 \u2013 2.5 \u03bcl:n tilavuusalueelle taroitettulla
  ePET s\u00e4hk\u00f6pipetti on edullisempi vaihtoehto elektroniselle Biohit Proline
  -pipettille. ePET mahdollistaa nesteannostelun perustoiminnot, kuten pipettoinnin,
  sarjaannostelun ja laimennuksen, kun taas Proline-pipetti mahdollis tavat useamman
  nesteannostelutoiminnon suorittamisen. Pipettit korroosiolta suojaavat suodattimet,
  jotka minimoivat aerosolien ja nesteen p\u00e4\u00e4syn pipetin sis\u00e4\u00e4n,
  ovat Biohitin ainutlaatuisen keksint\u00f6.\\n\\nBiohit tarjoaa huolto- ja varaosalipeluita
  kaikille nesteanostelijoillensa. Lis\u00e4ksi yhti\u00f6 tarjoaa kalibrointi- ja
  koulutuspalveluita.\\n\\ns\u00e4\u00e4dett\u00e4v\u00e4ll\u00e4 pipettiill\u00e4.
  Kyseinen tuote on suunniteltu erityisesti molekyylibiologian ja biotekniikan sovelluksille,
  joissa ammotteluaan pieni\u00e4 nestem\u00e4\u00e4ri\u00e4.\\n\\nKehitt\u00e4j\u00e4sen
  edelleen pipetoinnin turvallisuutta Biohit lanseerasi pipetteihin tarkoitettut suodatimet,
  jotka ennaltaehk\u00e4isev\u00e4t pipetin sis\u00e4osien ja t\u00e4tten k\u00e4sitelt\u00e4v\u00e4n
  n\u00e4ytteen kontaminointumisen esim. geeniteknologisissa tutkimuksissa\\\\textsuperscript{14}.
  T\u00e4m\u00e4n lis\u00e4ksi suodatimet ennaltaehk\u00e4isev\u00e4t pipetin sis\u00e4ll\u00e4
  olevan mekanismin vaarotuuminen. Aieminin Biohit on tarjonnut suodattimia suurimpana
  osana yksikanaavaisista pipettimalleistaan mutta vuodesta 1999 l\u00e4htien suodatin
  on ollut mahdollista saada my\u00f6s kaikkiin monikanavaisiin yli 50 \u00b5l:n malleihin.\\n\\nVuonna
  1999 Biohit luajensi kertak\u00e4ytt\u00f6tuoitteidensa valikoimaan tuomalla markkinoilta
  5 \u2013 350 \u00b5l:n tilavuukselliseen tarkoitettut k\u00e4rjet elektromiiliseen
  ja mekaanisille pipeteille sek\u00e4 laajentamalla erikoisk\u00e4rjen valikoimaansa
  hankkimalla toimittajaverkostonsa kautta mm. suodattink\u00e4rki\u00e4 ja geelik\u00e4rki\u00e4.\\n\\nHuhuikussa
  1999 Biohitille my\u00f6nnettiin U.S.-patenti 5,895,838 \\\\textsuperscript{15}
  koskien nesteanostelijaa, joka automaattisesti korjaa pipetoihtavan nesteen lamp\u00f6tilavaheteluista
  aiheutuvat virheet. Kyselleen keksinn\u00f6lle on aiemmin my\u00f6nnetty kaksi suomalaista
  patenttia (FI 98604, FI 101864), ja yhti\u00f6 on j\u00e4tt\u00e4nyt patenttiluokkumisia
  useissa muissa maissa. Vuodenvahteessa 1999-2000 p\u00e4\u00e4tytti kyselleen innovaatioon
  liittyv\u00e4 TEKESin tutkima tutkimusprojekti. Biohit uskoo, ett\u00e4 kyseen keksint\u00f6
  tulee vahvistamaan yhti\u00f6n asemaa nesteanosteluliiketoiminnan sek\u00e4 diagnostiikan
  ja instrumentituoitteiden markkinoilta.\\n\\n\\\\textsuperscript{14} Kolari M.,
