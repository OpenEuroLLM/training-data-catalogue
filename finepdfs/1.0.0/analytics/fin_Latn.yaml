  "\"Tavaroiden ulkomaankaupan ennakkotilasto Syyskuu 2019\\n\\nTavaraviennin arvo
  nousi 1,3 prosenttia syyskuussa Teollisuuskoneiden ja \u00f6ljytuotteiden viennin
  kasvu syyskuussa vahvaa\\n\\nSuomen tavaraviennin arvo oli syyskuussa Tullin ennakkotilaston
  mukaan l\u00e4hes 5,3 miljardia euroa. Viennin arvo oli 1,3 prosenttia suurempi
  kuin viime vuoden syyskuussa. Tuonti nousi syyskuussa 2,6 prosenttia ja oli arvoltaan
  hieman alle 5,5 miljardia euroa. Tammi-syyskuussa yhteenlaskettu viennin arvo nousi
  2,6 prosenttia, mutta yhteenlaskettu tuonnin arvo v\u00e4heni 0,4 prosenttia viime
  vuodesta.\\n\\nKauppatase oli syyskuussa 210 miljoonaa euroa alij\u00e4\u00e4m\u00e4inen.
  Tammi-syyskuussa vajetta kertyi 770 miljoonaa euroa. Viime vuoden syyskuussa kauppatase
  oli 138 miljoonaa euroa alij\u00e4\u00e4m\u00e4inen ja tammisyyskuussa 2,2 miljardia
  euroa alij\u00e4\u00e4m\u00e4inen.\\n\\nTeollisuuden koneiden ja laitteiden sek\u00e4
  \u00f6ljyjalosteiden viennin arvo kasvoi selv\u00e4sti syyskuussa. S\u00e4hk\u00f6teknisten
  koneiden ja laitteiden, kojeiden ja mittareiden sek\u00e4 kuljetusv\u00e4lineiden
  viennin arvon kasvu oli hitaampaa. Paperin ja pahvin, paperimassan sek\u00e4 metallien
  viennin arvo laski vuoden takaisesta. \u00d6ljytuotteiden ja raaka\u00f6ljyn, muovien
  ja malmien tuonnin arvoon tilastoitiin laskua, mutta muiden arvoltaan suurimpien
  ryhmien tuonnin arvo nousi.\\n\\nVienti EU-maihin nousi syyskuussa prosentin ja
  tuonti EU:sta 8,7 prosenttia. Samaan aikaan vienti EU:n ulkopuolelle nousi 1,9 prosenttia,
  mutta tuonti EU:n ulkopuolelta v\u00e4heni 5,7 prosenttia. Tammisyyskuussa vienti
  EU-maihin kasvoi 1,4 prosenttia ja ulkokaupan vienti 4,5 prosenttia. Samalla ajanjaksolla
  tuonti EU-maista nousi my\u00f6s 1,4 prosenttia kun taas tuonti EU:n ulkopuolelta
  laski 3,1 prosenttia.\\n\\nVienti Yhdysvaltoihin, Ven\u00e4j\u00e4lle ja Isoon-Britanniaan
  kasvoi selv\u00e4sti syyskuussa. Vienti Saksaan ja Ruotsiin kasvoi hitaammin. Vienti
  Kiinaan ja Alankomaihin laski syyskuussa. Tuonti Saksasta, Yhdysvalloista, Kiinasta
  ja Ruotsista kasvoi syyskuussa, mutta tuonti Ven\u00e4j\u00e4lt\u00e4 ja Alankomaista
  laski.\\n\\nTaulu 1: Vienti 2017-2019, miljoonaa euroa\\n\\nTaulu 2: Tuonti 2017-2019,
  miljoonaa euroa\\n\\nTaulu 3: Kauppatase 2017-2019, miljoonaa euroa\\n\\n* ennakkotieto\\n\\nTulli\\n\\nTilastointi\\n\\nKuvio
  2. Viennin muutokset edellisen vuoden vastaavasta kuukaudesta 2017-2019\\n\\nKuvio
