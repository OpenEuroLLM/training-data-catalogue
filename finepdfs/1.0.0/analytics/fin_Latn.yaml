  Elina ja Kari Kalliovuorela, Nurmonjoentie 533.\\n\\nLevossa ja hiljaisuudessa\\n\\nKuva
  hiljentymisen apuna\\n\\nPaasto on luopumista, se voi olla my\u00f6s sanoista luopumista,
  vaikenemista, kuulolle asettumista. Mutta mit\u00e4 merkitsee t\u00e4ll\u00f6in
  se, ett\u00e4 kysy kuva kertoo enemm\u00e4n kuin tuhat sanaa.\\n\\nHiljaisuuden
  toiminnassa kuvilla on oma paikkansa. Kuva voi luoda jotakin uutta, t\u00e4m\u00e4n
  ajan ihmisen uskova ja kaipausta ilment\u00e4v\u00e4\u00e4. Kuva voi kutsua toisenlaiseen
  maailmaan, pyh\u00e4 kuva on ikkuna ikuisuuteen.\\n\\nMutta ei my\u00f6s harvoin
  kuvat tuottavat puhu. On heit\u00e4, jotka paljas kuvat pit\u00e4v\u00e4t. Ilman
  on hyv\u00e4, sill\u00e4 ihmin\u00e4 koemme asiat eri tavoin. Kaikki eiv\u00e4t
  ole visualisia.\\n\\nTavallisessa el\u00e4m\u00e4ss\u00e4 meit\u00e4 ymp\u00e4r\u00f6i
  aggressiivinen mainonta, joka k\u00e4ytt\u00e4\u00e4 kuvaan tehokkaasti. Kuva on
  myymisen ja vaikuttamisen v\u00e4line. Modernin markkinointiviestinn\u00e4n \u00e4\u00e4rell\u00e4
  vanhan pyh\u00e4koululaulun kehotus \u201d\u00c4l\u00e4 silm\u00e4 pieni katso minne
  vain\u201d on yll\u00e4tt\u00e4v\u00e4n ajankohtainen.\\n\\nPaaston on olemassaan
  kyselemist\u00e4, omien riippuvuuksien ja sidonnaisuuksien tutkimista ja niist\u00e4
  luopumista. Pyh\u00e4 kuva seurassa voi havaita ymm\u00e4rt\u00e4m\u00e4\u00e4n
  kuivan voiman. Jokainen sana vaikuttaa meliin, jokainen kuva koskettaa meit\u00e4.
  Millaisen virkkeiden ale haluamme antautua? T\u00e4t\u00e4 meid\u00e4n on hyv\u00e4
  kysell\u00e4 paaston aikana.\\n\\nHiljaisuuden l\u00e4htee \u00e4it\u00e4hett\u00e4ss\u00e4
  ikonit ovat tulleet tuttuksi my\u00f6s Sein\u00e4joen seurakunnassa. Moni on kysynyt,
  kuuluvatko ikonit lateralaiseen kirkkoon?\\n\\nSeitsenkuun ekumeeninen kirkkiliikokous,
  johon osallistuvat sek\u00e4 id\u00e4n ett\u00e4 lannen kirkon edustajat, ei ainostaan
  kuvaa, vaan ikoneita. Ikoneita on vain kaksi, mutta ikoneja tulee kunnioittaa kuten
  pyh\u00e4it\u00e4 risti\u00e4. Edelleen tuon kirkkiliikokouksen p\u00e4\u00e4t\u00f6kset
  ovat voimassa. Ikoni ei siis ole ortodoksinen yksinoikeus.\\n\\nIkonit ovat k\u00e4yt\u00f6kk\u00f6polsia
  niin yksityisestiin hiljentymisess\u00e4 kuin yhteisiss\u00e4 rukousketuksissa.
  Niiden pelkistetty ikisuutuus ja jumalallisuutta kuvaava ilmaisu auttaa keskitym\u00e4\u00e4n
  ja helpottaa ajatusten irrottamista siit\u00e4, mik\u00e4 on t\u00e4h\u00e4n aikaan
  ja paikkaan sidottu.\\n\\nAntoisaan on uskaltautua pys\u00e4hty\u00e4 ikonin eteen
  ja antaa sen saman puhutelman.\\n\\nHelena Turja\\n\\nYhteisvastuu-ker\u00e4j\u00e4t
  ja alueet Nurmossa\\n\\nNurmos on ker\u00e4\u00e4jin\u00e4 my\u00f6s rippikoululaisia.
