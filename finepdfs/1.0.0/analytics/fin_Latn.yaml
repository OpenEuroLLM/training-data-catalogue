  rahastoamilla. Rahastoamissa ei annettu uusia osakkeita. Muutokset merkittiin kaupparekisteriin
  28.4.1999.\\n\\nYlim\u00e4\u00e4r\u00e4inen yhti\u00f6kokous korotti 13.6.1999 yhti\u00f6n
  osakep\u00e4\u00e4oman 340.000 euron suuruisella uusannilla tarjoamalla 2.000.000
  kappaletta yhti\u00f6n B-osakkeita suomalaisen ja kansainv\u00e4lisen institutionaalisten
  sijoittajien sek\u00e4 suomalaisen yleis\u00f6n merkitt\u00e4viksi. Yhti\u00f6n
  osakep\u00e4\u00e4oma korvai korotuksen seurauksena 2.084.971,29 euroon ja osakkeiden
  kokonaism\u00e4\u00e4r\u00e4 12.264.537 kappaleeseen. Osakep\u00e4\u00e4oman korotus
  merkittiin kaupparekisteriin 17.6.1999.\\n\\nYhti\u00f6j\u00e4rjestykseen mukaan
  yhti\u00f6n v\u00e4himm\u00e4isp\u00e4\u00e4oma on 1.063.101,29 euroa ja enimm\u00e4isp\u00e4\u00e4oma
  4.252.405,16 euroa, joissa rajoissa osakep\u00e4\u00e4oma voidaan korottaa ja alentaa
  yhti\u00f6j\u00e4rjestyst\u00e4 muuttamatta.\\n\\nYhti\u00f6n hallussa ei ole omia
  osakkeita. Yhti\u00f6n hallituksella ei ole voimassaolevaa valtuutusta osakkeiden
  tai vaihtovelkakirja- tai optiolainan liikkeellanelaskuun eik\u00e4 omien osakkeiden
  lunastamiseen.\\n\\nOsakeomistus omistajaryhmitt\u00e4in 15.2.2000\\n\\n| Osakkeiden
