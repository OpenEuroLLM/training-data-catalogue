  J\u00c4\u00c4\\n\\n98 470 euroa (13 % asukasosallisuusavustuksista)\\n\\nKaupunginhallitus
  p\u00e4\u00e4tti 28.9.2015, ett\u00e4 asukastalojen vuokrat ja yll\u00e4pito sek\u00e4
  toiminnan koordinointi asukastaloilla ja kaupunginosissa keskitet\u00e4\u00e4n kaupunginhallitukselle
  vuodesta 2017 alkaen. Kaupungin lautakunnat ja toimialat my\u00f6nt\u00e4v\u00e4t
  edelleen avustuksia asukastaloilla j\u00e4rjestett\u00e4v\u00e4\u00e4n lautakuntien
  omaan substanssiin liittyv\u00e4n ja t\u00e4ydent\u00e4v\u00e4n toiminnan tukemiseen.\\n\\nAvustuslajit
  vuonna 2018\\n\\nYleisavustus, joka on tarkoitettu muiden kuin kaupungin yll\u00e4pit\u00e4mien
  asukastilojen yll\u00e4pit\u00e4miseen ja toiminnan koordinointiin.\\n\\nToiminta-avustus,
  joka on tarkoitettu asukasosallisuutta parantavien rakenteiden ja menetelmien kehitt\u00e4miseen.\\n\\nAsia/13\\n\\n8.1.2018\\n\\nPienavustus,
  joka on tarkoitettu asukasosallisuusavustusten kriteerien mukaisten alkavien tai
  kertaluonteisten hankkeiden toteuttamiseen.\\n\\nYleis- ja toiminta-avustukset valmistellaan
  vuosittain kaupunginhallituksen p\u00e4\u00e4tett\u00e4v\u00e4ksi. Asukasosallisuuden
  avustuksiin osoitetusta 750 000 euron m\u00e4\u00e4r\u00e4rahasta suurin osa k\u00e4ytet\u00e4\u00e4n
  yleis- ja toiminta-avustuksiin. Summasta varataan vuosittain osa pienavustuksiin.
  Entisest\u00e4 projektiavustuksesta k\u00e4ytet\u00e4\u00e4n jatkossa nime\u00e4
  asukasosallisuuden pienavustukset, joka kuvaa paremmin avustuslajin luonnetta.\\n\\nKaupunginhallitus
  p\u00e4\u00e4tti 6.2.2017, ett\u00e4 1.1.2017 lukien kaupunginkanslian tietotekniikka-
  ja viestint\u00e4johtaja p\u00e4\u00e4tt\u00e4\u00e4 asukasosallisuuden pienavustusten
  (entiselt\u00e4 nimelt\u00e4\u00e4n projektiavustukset) my\u00f6nt\u00e4misest\u00e4,
  jos haettu avustus on enint\u00e4\u00e4n 3 000 euroa. Pienavustukset ovat luonteeltaan
  erilaisia kuin yleis- ja toiminta-avustuslajit, jotka kohdistuvat laajempiin ja
  vakiintuneempiin toimintakokonaisuuksiin ja joissa on kiinte\u00e4 rajoitettu hakuaika.
  Pienavustuksilla ei ole kiinte\u00e4\u00e4 hakuaikaa, joka mahdollistaa vuoden kuluessa
  nopean ja ketter\u00e4n reagoinnin kaupunkiyhteis\u00f6st\u00e4 nouseviin tarpeisiin.
  Pienavustusten hakijoina voivat olla my\u00f6s rekister\u00f6itym\u00e4tt\u00f6m\u00e4t
  toimijat ja ryhm\u00e4t.\\n\\nKaupunginkanslian tietotekniikka- ja viestint\u00e4osaston
  osallisuus ja neuvonta -yksikk\u00f6 on valmisteluvastuussa kaikissa asukasosallisuuden
  avustuslajeissa.\\n\\nAvustuskriteerit\\n\\nAsukasosallisuuden avustuksia my\u00f6nnet\u00e4\u00e4n
  Helsingin kaupungin strategian mukaiseen ja kaupungin toimintaa t\u00e4ydent\u00e4v\u00e4\u00e4n,
  yleishy\u00f6dylliseen, avoimeen ja p\u00e4\u00e4s\u00e4\u00e4nt\u00f6isesti maksuttomaan,
  innovatiiviseen ja monipuolisesti eri v\u00e4est\u00f6ryhmille suunnattuun toimintaan.\\n\\nAvustettavan
  toiminnan tavoitteena tulee olla asukkaiden osallistumisja vaikutusmahdollisuuksien,
  yhteis\u00f6llisyyden, alueen viihtyisyyden ja vetovoiman parantaminen.\\n\\nAvustusten
  hakijoina voivat olla rekister\u00f6idyt yhteis\u00f6t, kuten asukas/kaupunginosayhdistykset,
  muut yhdistykset, s\u00e4\u00e4ti\u00f6t, osuuskunnat, sosiaaliset yritykset, asukastaloja
  hallinnoivat pys\u00e4k\u00f6intiyhti\u00f6t ja muut yritykset, sik\u00e4li kun
  avustettava toiminta on yleishy\u00f6dyllist\u00e4 ja kohdistuu Helsingin kaupungin
  asukkaisiin. Yritysmuotoisiin hakijoihin sovelletaan kaupungin yleisi\u00e4 ohjeita.
  Asukasosallisuuden pienavustuksia voivat hakea my\u00f6s rekister\u00f6itym\u00e4tt\u00f6m\u00e4t
  toimijat kuten kaupunginosaliikkeet ja erilaiset toimintaryhm\u00e4t.\\n\\nToiminnan
  tulee edist\u00e4\u00e4 yhteisty\u00f6t\u00e4 alueen eri toimijoiden kanssa.\\n\\nAsia/13\\n\\n8.1.2018\\n\\nTavoitteena
  on alueellinen tasapaino ja tarveperustainen harkinta.\\n\\nTukea voidaan priorisoida
  alueille, joissa toimintaa on ennest\u00e4\u00e4n v\u00e4hemm\u00e4n tai joiden
  katsotaan siit\u00e4 eniten hy\u00f6tyv\u00e4n.\\n\\nHakijalla tulee olla toimintaa
  varten muitakin resursseja, jotka voivat koostua varainhankinnasta, j\u00e4senmaksuista,
  tiloista tai niiden edelleen vuokraamisesta saaduista tuloista, vapaaehtoisty\u00f6st\u00e4
  sek\u00e4 muista avustuksista.\\n\\nHakijalta edellytet\u00e4\u00e4n toiminnan tulosten
  ja hy\u00f6tyjen n\u00e4kyv\u00e4ksi tekemist\u00e4 ja niist\u00e4 raportointia.\\n\\nN\u00e4m\u00e4
  kriteerit t\u00e4ydent\u00e4v\u00e4t Helsingin kaupungin avustusten my\u00f6nt\u00e4misess\u00e4
  noudatettavia yleisohjeita (12.12.2011), jotka ovat esityslistan liitteen\u00e4.\\n\\nValmistelun
  kehitt\u00e4minen\\n\\nKaupunginhallituksen p\u00e4\u00e4tt\u00e4ess\u00e4 asukasosallisuuden
  avustuksista 6.3.2017 (\u00a79), se kehotti selvitt\u00e4m\u00e4\u00e4n asukasosallisuusavustusten
  uusien kriteereiden toimivuuden sek\u00e4 mahdollisuutta aikaistaa avustusp\u00e4\u00e4t\u00f6ksi\u00e4.
  Selvityksiss\u00e4 tuli kuulla avustuksia hakeneita yhdistyksi\u00e4. Asukasosallisuuden
  avustuskriteereit\u00e4 arvioitiin syksyll\u00e4 2017 yhdess\u00e4 avustusten hakijoiden
  kanssa. Aiheesta j\u00e4rjestettiin ty\u00f6paja, johon osallistui 19 avustusta
  hakeneiden j\u00e4rjest\u00f6jen edustajaa. Kommentointi oli mahdollista my\u00f6s
  s\u00e4hk\u00f6isen kyselyn kautta. Osallistujat pitiv\u00e4t nyt voimassa olevia,
  yhdess\u00e4 hakijoiden kanssa luotuja avustuskriteereit\u00e4 p\u00e4\u00e4osin
  hyvin\u00e4. Kritiikki\u00e4 kohdistui siihen, ett\u00e4 avustuksia jaettaessa alueet
  asetetaan vastakkain kilpailemaan niukoista resursseista. Avustamiseen toivottiin
  pitk\u00e4j\u00e4nteisyytt\u00e4, joka helpottaisi toiminnan suunnittelua. Toisaalta
  pidettiin t\u00e4rke\u00e4n\u00e4, ett\u00e4 my\u00f6s uuteen toimintaan on mahdollista
  saada avustusta. Kriteereiss\u00e4 ja niiden tulkinnassa toivottiin painotettavan
  toiminnan vaikuttavuutta ja tuloksellisuutta. Todettiin, ett\u00e4 vaikuttavuuden
  arvioiminen edellytt\u00e4\u00e4 laadukasta ja yhteismitallista raportointia. Toisaalta
  osa hakijoista toivoi kevytt\u00e4 raportointitapaa, joka ei ty\u00f6llist\u00e4isi
  j\u00e4rjest\u00f6j\u00e4 liikaa.\\n\\nAsukasosallisuuden avustusten p\u00e4\u00e4t\u00f6saikataulu
  on sidottu kaupungin talousarviovalmisteluun. Asukasosallisuuden avustusesitys voidaan
  tuoda kaupunginhallitukseen aikaisintaan talousarvion vahvistamisen j\u00e4lkeen.\\n\\nHakuprosessi
  2018\\n\\nAvustuskuulutus julkaistiin kaupungin yhteisess\u00e4 ilmoituksessa joulukuussa
  2016. Mahdollisille hakijoille j\u00e4rjestettiin kaksi kaikille avointa\\n\\nAsia/13\\n\\n8.1.2018\\n\\nkeskustelutilaisuutta
  huhtikuussa 2017. Kirje ja muistutus asukasosallisuuden avustuksista l\u00e4hti
  22.3.2017 kaikille edellisen\u00e4 vuonna avustusta saaneille.\\n\\nKaupunginhallituksen
  asukasosallisuuden avustushakemuksia vuodelle 2018 tuli m\u00e4\u00e4r\u00e4aikaan
  2.5.2017 menness\u00e4 32 kappaletta, joista yhden hakija my\u00f6hemmin veti pois
  hakuprosessista. Lis\u00e4ksi yksi hakemus saapui my\u00f6h\u00e4ss\u00e4. Avustusta
  haettiin yhteens\u00e4 1 060 730 euroa. Talousarvioon 2018 vahvistettiin asukasosallisuuden
  avustusm\u00e4\u00e4r\u00e4rahaksi 750 000 euroa. M\u00e4\u00e4r\u00e4rahaan sis\u00e4ltyv\u00e4t
  asukasosallisuuden pienavustukset, jotka avataan haettavaksi tammikuussa 2018.\\n\\nVuoden
  2017 avustusesityksess\u00e4 m\u00e4\u00e4r\u00e4rahasta j\u00e4tettiin sitomatta
  30 000 euroa, joka varattiin matalan byrokratian ja pienimuotoisemman toiminnan
  mahdollistaviin pienavustuksiin. T\u00e4m\u00e4n summan katsottiin olevan uskottava
  ja toiminnan kannalta tarkoituksenmukainen pienavustuksien riitt\u00e4vyyden n\u00e4k\u00f6kulmasta.
  Kaupunginhallituksen avustusp\u00e4\u00e4t\u00f6ksen 6.3.2017 j\u00e4lkeen projektiavustuksiin
  j\u00e4i kuitenkin vain 16 845 euroa, josta my\u00f6hemmin kaupunginhallitus p\u00e4\u00e4tti
  viel\u00e4 my\u00f6nt\u00e4\u00e4 varsinaisella hakukierroksella kielteisen p\u00e4\u00e4t\u00f6ksen
  saaneelle Mellunm\u00e4kiSeuralle 8 400 euroa .  Pienavustusten jakovaraksi vuodelle
  2017 j\u00e4i n\u00e4in ollen 8 445 euroa. T\u00e4st\u00e4 syyst\u00e4 pienavustuksia
  ei juurikaan voitu markkinoida. Pienavustuksia on my\u00f6nnetty vuonna 2017 joulukuun
  alkuun menness\u00e4 yhteens\u00e4 6 820 euroa.\\n\\nVuodelle 2018 esitett\u00e4v\u00e4ll\u00e4  pienavustuksiin
  varattavalla 98 470 euron m\u00e4\u00e4r\u00e4rahalla varaudutaan viime vuoden prosessin
  kokemuksella mahdollisiin lis\u00e4p\u00e4\u00e4t\u00f6ksiin ja muutoksenhakuihin.
  Lis\u00e4ksi suurempaa pienavustusm\u00e4\u00e4r\u00e4rahaa puoltaa varsinaisen
  avustusesityksen linjaus ohjata hakijoita hakemaan yksitt\u00e4isiin tapahtumiin
  ja alueelliseen viestint\u00e4\u00e4n pienavustuksia yleis- ja toiminta-avustusten
  sijaan.\\n\\nHakemuksia on k\u00e4sitelty ja p\u00e4\u00e4t\u00f6st\u00e4 valmisteltu
  vuorovaikutuksessa hakijatahojen sek\u00e4 kaupungin muiden avustuksia my\u00f6nt\u00e4vien
  hallintokuntien kanssa. Lis\u00e4selvitysten pyyt\u00e4misess\u00e4 on oltu asukasl\u00e4ht\u00f6isi\u00e4
  ja joustavia. 17.11.2017 menness\u00e4 hakemuksia ja liitteit\u00e4 on ehditty t\u00e4ydent\u00e4\u00e4
  riitt\u00e4v\u00e4sti.\\n\\nVuoden 2018 avustusten my\u00f6nt\u00e4misen perusteet\\n\\nAsukasosallisuuden
  avustuskriteerien kriteerien mukaan my\u00f6nnet\u00e4\u00e4n yleisavustusta asukastalojen
  yll\u00e4pit\u00e4miseen ja toiminnan koordinointiin sek\u00e4 asukasosallisuutta
  parantavien rakenteiden ja menetelmien kehitt\u00e4miseen. Asukasosallisuuden avustusta
  my\u00f6nnet\u00e4\u00e4n asukastiloille, jotka ovat p\u00e4\u00e4s\u00e4\u00e4nt\u00f6isesti
  helsinkil\u00e4isten avoimesti ja maksutta k\u00e4ytett\u00e4viss\u00e4 ja joita
  k\u00e4ytet\u00e4\u00e4n monipuolisesti ja yhteisty\u00f6ss\u00e4 eri toimijoiden\\n\\nP\u00f6yt\u00e4kirja\\n\\nAsia/13\\n\\n8.1.2018\\n\\nkanssa.
  Asukasosallisuuden avustuksissa pyrit\u00e4\u00e4n alueelliseen tasapainoon, yhdenvertaisuuteen
  ja tarveperustaiseen harkintaan.\\n\\nVuoden 2018 avustusesityksess\u00e4 turvataan
  nykyisten yhteis\u00f6jen yll\u00e4pit\u00e4mien asukastalojen toiminta vuokrien
  sek\u00e4 v\u00e4ltt\u00e4m\u00e4tt\u00f6mien kiinteiden kulujen osalta. Jaettavissa
  olevan m\u00e4\u00e4r\u00e4rahan puitteissa ei ole ollut mahdollisuutta avustaa
  muita kuin v\u00e4ltt\u00e4m\u00e4tt\u00f6mi\u00e4 yll\u00e4pito- ja toimintakuluja.\\n\\nPalkkakulujen
  p\u00e4\u00e4s\u00e4\u00e4nt\u00f6n\u00e4 on ollut, ett\u00e4 palkka-avustusta my\u00f6nnet\u00e4\u00e4n
  enint\u00e4\u00e4n 29 500 euroa kaupunginosaa kohden. Yht\u00e4 ty\u00f6ntekij\u00e4\u00e4
  kohden my\u00f6nnet\u00e4\u00e4n avustusta enint\u00e4\u00e4n 29 500 euroa vuodessa.
  Esityksen mukaisella m\u00e4\u00e4r\u00e4rahan tasapuolisella kohdentamisella tavoiteltiin
  mahdollisimman oikeudenmukaista tilannetta hakijoiden kesken. Tavoitteena oli saavuttaa
  hakijaa kohden m\u00e4\u00e4r\u00e4rahojen mahdollistama palkka-avustuksen taso,
  jota voidaan pit\u00e4\u00e4 kokonaisuutta ajatellen tyydytt\u00e4v\u00e4n\u00e4.
  Yhtenev\u00e4ll\u00e4 palkka-avustuksella vastataan my\u00f6s asukasosallisuuden
  kriteerist\u00f6n yhteisvalmistelussa yhteis\u00f6jen esiin nostamaan kritiikkiin
  avustusm\u00e4\u00e4r\u00e4rahojen ep\u00e4tasaisesta jakautumisesta kaupunginosittain.\\n\\nMik\u00e4li
  toiminnasta, johon avustusta haetaan, vain osa on kaikille avointa ja maksutonta,
  avustus esitet\u00e4\u00e4n my\u00f6nnett\u00e4v\u00e4ksi osittain. Avustusta ei
  my\u00f6nnet\u00e4 yhdistysten perushallinnon toimeenpanoon tai yhdistyksen hallinnon
  toimitiloihin.\\n\\nAvustusta tulee kohdentaa my\u00f6s niille alueille, joissa
  ei entuudestaan ole asukastilatoimintaa. T\u00e4n\u00e4 vuonna uutena hakijana on
  Tapanilan Kyl\u00e4taloyhdistys ry, joka hakee avustusta entisess\u00e4 alakoulurakennuksessa
  k\u00e4ynnistett\u00e4v\u00e4\u00e4n asukastalotoimintaan. Alueella ei entuudestaan
  ole kaupungin tukemaa asukastilaa.\\n\\nP\u00e4\u00e4osa avustusm\u00e4\u00e4r\u00e4rahasta
  kohdentuu asukastalotoiminnan vuokraja palkkakuluihin. Avustusm\u00e4\u00e4r\u00e4rahoista
  298 830 euroa kohdentuu asukastalojen vuokriin ja yll\u00e4pitoon. Avustuksilla
  tuetaan 16 asukastaloa.  Palkka-avustusta my\u00f6nnet\u00e4\u00e4n yhteens\u00e4
  343 500 euroa. Palkkaavustuksella tuetaan 14 ty\u00f6ntekij\u00e4n palkkausta.  Esitett\u00e4v\u00e4t
  avustussummat vaihtelevat 3 000 eurosta 70 000 euroon.\\n\\nTapahtumiin ja yhteis\u00f6llisesti
  ja osallistavin menetelmin tuotetun alueellisen tiedonkulun parantamiseen tukea
  hakeneet hakijat ohjataan hakemaan vuonna 2018 avattavia pienavustuksia. Vuodelle
  2018 pienavustuksiin varataan 98 470 euroa.\\n\\nHylk\u00e4ysperusteet\\n\\nHyl\u00e4tt\u00e4v\u00e4ksi
  esitet\u00e4\u00e4n seuraavat hakemukset seuraavin perustein:\\n\\nEsittelij\u00e4\\n\\nLis\u00e4tiedot\\n\\nLiitteet\\n\\nMuutoksenhaku\\n\\nOtteet\\n\\nP\u00f6yt\u00e4kirja\\n\\n1/2018\\n\\nAsia/13\\n\\n8.1.2018\\n\\nMyllypuro-Seura
  ry:n hakemus hyl\u00e4t\u00e4\u00e4n, koska se on saapunut my\u00f6h\u00e4ss\u00e4.\\n\\nT\u00f6\u00f6l\u00f6n
  Kyl\u00e4talon Yst\u00e4v\u00e4t ry:n hakemus hyl\u00e4t\u00e4\u00e4n, koska hakija
  ei pyynn\u00f6ist\u00e4 huolimatta toimittanut vaadittavia liitteit\u00e4. Hakemus
  ei t\u00e4yt\u00e4 kaupunginhallituksen avustusohjeiden kohtaa 2.9.\\n\\nTapahtumiin,
  asukastilaisuuksiin sek\u00e4 yhteis\u00f6llisesti ja osallistavin menetelmin tuotetun
  alueellisen tiedonkulun parantamiseen avustusta hakeneiden yhdistysten (Etel\u00e4iset
  kaupunginosat ry - S\u00f6dra stadsdelarna rf:n, Herttoniemi-seura ry:n, Pihlajam\u00e4ki-seura
  ry:n, Siltam\u00e4ki-Suutarilaseura ry:n ja Tapulikaupunki-Seura ry:n) hakemukset
  hyl\u00e4t\u00e4\u00e4n, koska kyse on hankeluontoisesta toiminnasta, johon voidaan
  hakea pienavustusta.\\n\\nkansliap\u00e4\u00e4llikk\u00f6\\n\\nSami Sarvilinna\\n\\nTitta
  Reunanen, asukasyhteisty\u00f6p\u00e4\u00e4llikk\u00f6, puhelin: 040 5781428\\n\\ntitta.reunanen(a)hel.fi\\n\\nElla
