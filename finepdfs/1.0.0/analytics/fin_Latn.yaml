sample: '["\"Delta\\n\\nUusin tuotteemme on Mousetrapper Delta, joka t\u00e4ydent\u00e4\u00e4
  ergonomisten hiiriohjainten valikoimaamme. Deltassa kursoria ohjataan uudella hiilikuituisella
  Control Bar -ohjaustangolla, ainutlaatuisen ohjainmattomme sijaan. Ohjaustanko mahdollistaa
  keskitetyn ja rennon ty\u00f6skentelyasennon ja kuusi (6) ohjelmoitavaa painiketta
  Mahdollistavat entist\u00e4 tehokkaamman ty\u00f6skentelyn. Delta on suunniteltu
  ja valmistettu Ruotsissa kierr\u00e4tysmuovista.\\n\\nDeltan edut\\n\\nT\u00e4rkeimm\u00e4t
  ominaisuudet\\n\\nDelta tuo uuden ulottuvuuden Mousetrapperin laajaan ergonomisten
  keskihiiriohjaimien valikoimaan. Sen ainutlaatuisen leve\u00e4 ja pehme\u00e4 hiilikuituinen
  ohjaustanko mahdollistaa tarkan ja tehokkaan ty\u00f6skentelyn.\\n\\nKuusi ohjelmoitavaa
  painiketta mahdollistaa omien pikavalintojen tallentamisen, esiohjelmoitujen toimintojen
  sijaan. Painikkeiden toimintojen muuttaminen onnistuu sujuvasti MT Keys -ohjelmiston
  avulla.\\n\\nOhjaustangon leveys on suunniteltu niin, ett\u00e4 sen k\u00e4ytt\u00f6
  on mahdollisimman sujuvaa n\u00e4pp\u00e4imist\u00f6n kanssa. 4000 dpi:n resoluutio
  tekee kursorin liikkeest\u00e4, klikkaamisesta ja zoomaamisesta jouhevaa ja mahdollistaa
  \u00e4\u00e4rimm\u00e4isen tarkan tuntuman ty\u00f6skentelyyn.\\n\\nUSB Hubi useiden
  laitteiden lataamista/liitt\u00e4mist\u00e4 varten.\\n\\n\u00bb Ergonominen muotoilu\\n\u00bb
  Kuusi (6) ohjelmoitavaa painiketta, joiden mukautus on helppoa MT Keys -ohjelmistolla
  www.mousetrapper.fi/software\\n\u00bb 255 mm leve\u00e4 ohjaustanko, jossa ohjaus-
  ja klikkaustoiminto sek\u00e4 125 mm sivuttaisliike\\n\u00bb Pehme\u00e4, desinfioitava
  keinonahkainen rannetuki\\n\u00bb Valmistettu kierr\u00e4tysmuovista\\n\u00bb Helposti
  vaihdettava magneettikiinnitteinen rannetuki\\n\u00bb N\u00e4pp\u00e4imist\u00f6n
  korkeudens\u00e4\u00e4t\u00f6levyt\\n\u00bb Yhdistet\u00e4\u00e4n mukana tulevalla
  USB-mikrokaapelilla\\n\u00bb 2 USB-porttia (3,3 V) useiden laitteiden liitt\u00e4mist\u00e4
  ja lataamista varten\\n\u00bb 4000 dpi\\n\\nTietoja\\n\\nDelta on saatavilla kahdessa
  eri v\u00e4riss\u00e4 ja koossa.\\n\\nDelta Regular Grey\\n\\nDelta Extended Grey\\n\\n\u00bb
  Korkeus: 27 mm\\n\u00bb Leveys: 500 mm\\n\u00bb Leveys: 500 mm\\n\u00bb Syvyys:
  120 mm\\n\u00bb Tuotekoodi: MT151\\n\u00bb Paino: 830 g\\n\\nDelta Regular Black\\n\\n\u00bb
  Korkeus: 27 mm\\n\u00bb Leveys: 500 mm\\n\u00bb Syvyys: 120 mm\\n\\n\u00bb Tuotekoodi:
  MT153\\n\\n\u00bb Paino: 830 g\\n\u00bb Syvyys: 145 mm\\n\u00bb Korkeus: 27 mm\\n\u00bb
  Paino: 910 g\\n\u00bb Tuotekoodi: MT150\\n\\nBlack\\n\\nDelta Extended\\n\\n\u00bb
  Korkeus: 27 mm\\n\u00bb Leveys: 500 mm\\n\u00bb Syvyys: 145 mm\\n\\n\u00bb Tuotekoodi:
  MT152\\n\\n\u00bb Paino: 910 g\\n\\nTuotekoodi: MT150\\n\\nMousetrapper hiiriohjain
  sijoitetaan n\u00e4pp\u00e4imist\u00f6n eteen, jolloin ty\u00f6asennosta tulee tasapainoinen.
  Hiiren asemointi n\u00e4pp\u00e4imist\u00f6n eteen, pit\u00e4\u00e4 k\u00e4det l\u00e4hell\u00e4
  vartaloa ja ty\u00f6skentely tapahtuu ergonomisesti hartialinjan sis\u00e4puolella.\\n\\nHartialinjan
  sis\u00e4puolella tapahtuva hiirity\u00f6skentely v\u00e4hent\u00e4\u00e4 toistuvaa
  olkavarren ulkokiertoa ja kyyn\u00e4rvarren sis\u00e4kiertoa, joita yleens\u00e4
  tapahtuu perinteisess\u00e4 hiirity\u00f6skentelyss\u00e4 ja jotka pitk\u00e4ll\u00e4
  aikav\u00e4lill\u00e4 voivat aiheuttaa rasitusvammoja. Mousetrapper hiiriohjaimen
  pehme\u00e4t rannetuet v\u00e4hent\u00e4v\u00e4t niska-hartiaseudulle ja k\u00e4sivarsiin
  kohdistuvaa painetta.\\n\\nAinutlaatuinen Mousetrapper Control Bar -ohjaustanko\\n\\nNeuvoja
  ergonomisempaan ty\u00f6skentelyasentoon:\\n\\nOhjaat kursoria helposti Mousetrapperin
  uuden ohjaustangon avulla, jota kevyesti painamalla aktivoit klikkaustoiminnon.
  Pitk\u00e4 tutkimus- ja kehitysty\u00f6 on mahdollistanut sen, ett\u00e4 olemme
  l\u00f6yt\u00e4neet t\u00e4ydellisen ohjaustangon materiaalin, joka mahdollistaa
  kevyen ja l\u00e4hes kitkattoman liikkeen ohjaustangossa. Mousetrapper Control Bar
  -ohjaustangon avulla ty\u00f6skentely on helppoa, ergonomista ja tehokasta.\\n\\nMOUSETRAPPER.FI\\n\\n\u00bb
  S\u00e4\u00e4d\u00e4 tuoli niin, ett\u00e4 jalkasi ovat tukevasti lattialla ja pystyt
  istumaan selk\u00e4 suorana.\\n\u00bb Aseta k\u00e4sivarret kyyn\u00e4rvarsituen
  tai ty\u00f6p\u00f6yd\u00e4n p\u00e4\u00e4lle.\\n\u00bb Pid\u00e4 k\u00e4sivarret
  l\u00e4hell\u00e4 kehoa ty\u00f6skennelless\u00e4si.\\n\u00bb Vaihtele ty\u00f6skentelyasentoa
  ja k\u00e4yt\u00e4 korkeuss\u00e4\u00e4dett\u00e4v\u00e4\u00e4 ty\u00f6p\u00f6yt\u00e4\u00e4
  vaihdellaksesi istumisen ja seisomisen v\u00e4lill\u00e4.\\n\u00bb V\u00e4lt\u00e4
  toistuvat rasitusvammat (RSI) k\u00e4ytt\u00e4m\u00e4ll\u00e4 ergonomista hiirt\u00e4.\\n\u00bb
  Sijoita n\u00e4ytt\u00f6 sellaiselle et\u00e4isyydelle, ett\u00e4 se tuntuu mukavalta
  sek\u00e4 silmille ett\u00e4 niskalle.\"", "\"H\u00e4iri\u00f6 liittym\u00e4v\u00e4lill\u00e4
  tie 14510 \u2013 Ratatie\\n\\n* pituus 1,3 km\\n* 1-ajoratainen\\n\\nVarareitti
  tie 14510 \u2013 Ratatie\\n\\n* pituus 1,7 km\\n* 1-ajoratainen\\n* soveltuu henkil\u00f6autoliikenteelle
  2-suuntaisena\\n* kulkee osittain katuverkolla\\n* laskennallinen viive alle 10
  min\\n\\nVarareitin k\u00e4ytt\u00f6\u00f6notossa huomioitavaa:\\n\\n* Liukkauden
