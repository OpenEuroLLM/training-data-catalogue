  (P/E)\\n\\nosakeantioikaistu p\u00f6rssikurssi 31.12.\\n\\ntulos/osake\\n\\nHALLITUKSEN
  VOITONJAKOEHDDOTUS JA TILINTARKASTUSKERTOMUS\\n\\nEsitys voittoa koskevaksi toimenpiteiksi\\n\\nEmoyhti\u00f6n
  jakokelpoinen oma p\u00e4\u00e4oma on 7.536.673,68 mk. Konsernilla ei ole jakokelpoista
  omaa p\u00e4\u00e4omaa.\\n\\nHallitus esitt\u00e4\u00e4, ett\u00e4 voittoa ei jaeta
  ja, ett\u00e4 tilikauden voitto 7.536.673,68 mk siirret\u00e4\u00e4n edellisten
  kausien voitto-/tappiotilille.\\n\\nHelsingiss\u00e4, 3. p\u00e4iv\u00e4n\u00e4
  maaliskuuta 2000\\n\\nReijo Luostarinen Osmo Suovaniemi M\u00e5rten Wikstr\u00f6m
  Pekka Salonoja\\nHallituksen puheenjohtaja Hallituksen j\u00e4sen Hallituksen j\u00e4sen
  Hallituksen j\u00e4sen\\nToimitusjohtaja\\n\\nBiohit Oy:n osakkeenomistajille\\n\\nOlemme
  tarkastaneet Biohit Oy:n kirjanpidon, tilinp\u00e4\u00e4t\u00f6ksen ja hallinnon
  tilikaudelta 1.1.-31.12.1999. Hallituksen ja toimitusjohtajan laatima tilinp\u00e4\u00e4t\u00f6s
  sis\u00e4lt\u00e4\u00e4 toimintakertomuksen sek\u00e4 konsernin ja emoyhti\u00f6n
  tuloslaskelman, taseen ja liitetiedot. Suorittamamme tarkastuksen perusteella annamme
  lausunnon tilinp\u00e4\u00e4t\u00f6ksest\u00e4 ja hallinnosta.\\n\\nTilintarkastus
  on suoritettu hyv\u00e4n tilintarkastustavan mukaisesti. Kirjanpitoa ja tilinp\u00e4\u00e4t\u00f6ksen
  laatimisperiaatteita, sis\u00e4lt\u00f6j\u00e4 ja esitt\u00e4mistapaa on t\u00e4ll\u00f6in
  tarkastettu riitt\u00e4viss\u00e4 laajuudessa sen toteamiseksi, ettei tilinp\u00e4\u00e4t\u00f6s
  sis\u00e4ll\u00e4 olemaisia virheit\u00e4 tai puutteita. Hallinnon tarkastuksessa
  on selvitetty hallituksen j\u00e4senten sek\u00e4 toimitusjohtajan toiminnan laiminmaksuutta
  osakeyhti\u00f6lain s\u00e4\u00e4nn\u00f6sten perusteella.\\n\\nLausuntonaamme esitimme,
  ett\u00e4 tilinp\u00e4\u00e4t\u00f6s on laadittu kirjanpitolain sek\u00e4 tilinp\u00e4\u00e4t\u00f6ksen
  laatimista koskevien muiden s\u00e4\u00e4nn\u00f6sten ja m\u00e4\u00e4r\u00e4ysten
  mukaisesti. Tilinp\u00e4\u00e4t\u00f6s antaa kirjanpitolaissa tarkoitettulla tavalla
  oikeat ja riitt\u00e4v\u00e4t tiedot konsernin sek\u00e4 emoyhti\u00f6n toiminnan
  tuloksesta ja taloudellisesta asemasta. Tilinp\u00e4\u00e4t\u00f6s konsernihilinp\u00e4\u00e4t\u00f6ksineen
  voidaan valvistaa sek\u00e4 vastuuvapaus my\u00f6nt\u00e4\u00e4 emoyhti\u00f6n hallituksen
  j\u00e4senille sek\u00e4 toimitusjohtajalle tarkastamaltaamme tilikaudelta. Hallituksen
  esitys jakokelpoisten varojen k\u00e4sitelt\u00e4st\u00e4 on osakeyhti\u00f6lain
  mukainen.\\n\\nHelsingiss\u00e4, 8. p\u00e4iv\u00e4n\u00e4 maaliskuuta 2000\\n\\nSVH
  Pricewaterhouse Coopers Oy\\nKHT-yhteis\u00f6\\n\\nHannele Selesvuo\\nKHT\\n\\nHALLINTO
  JA TIETEELLISTEN NEUVONANTAJAT\\n\\nBiohitin avainhenkil\u00f6ill\u00e4 on 10-25
  vuoden kokemus laboratorioinstrumenttien kehityksest\u00e4, valmistuksesta ja kansainv\u00e4liseen
  markkinoinnista. Heille on my\u00f6nnetty lukuisia patentteja nesteiden k\u00e4sittelyn
  ja diagnostiikan aloilta. Biohitin tieteelliset neuvonantajat ovat l\u00e4\u00e4ketieteen
  sek\u00e4 molekyylibiologian, fysiikan ja kemian asiantuntijoita. He toimivat oman
  tieteenalansa asiantuntijoina Biohitin tutkimus- ja kehitysty\u00f6ss\u00e4.\\n\\nHallitus\\n\\n\u2022
  **Reijo Luostarinen**, KTT, Biohit Oy:n hallituksen puheenjohtaja, Biohit Oy:n hallituksen
  j\u00e4sen vuodesta 1993. Helsingin kauppakorkeakoulun (HKKK) kansainv\u00e4listen
  liiketoiminnan aineen professori ja johtaja, HKKK:n kansainv\u00e4listen kaupan
  tutkimuskeskuksen johtaja, vararehtori 1990-1995 sek\u00e4 useiden muiden opetusyksik\u00f6iden
  johtaja. Teknillisen korkeakoulun ja Vaasan Yliopiston dosentti. Vierailleva professori
  tai luennoinnija 23 eri maassa. Asla Fulbright -stipendiaatti Michiganin yliopistossa.
  Euroopan kansainv\u00e4listen liiketoimintaa-katekemian presidentti ja Yhdysvaltain
  kansainv\u00e4listen liiketoiminta-akatemian alueellinen puheenjohtaja Euroopassa.
  Er\u00e4iden tieteellisten neuvostojen ja rahastojen hallituksen j\u00e4sen. Nelj\u00e4n
  kansainv\u00e4listen akateemisen konferenssin puheenjohtaja. Kansainv\u00e4listen
  liiketoiminnan asiantuntija YK:n eri organisaatioissa sek\u00e4 er\u00e4iss\u00e4
  ministeri\u00f6iss\u00e4. Kahden konsultityyryksen omistaja, kolmen yrityksen hallituksen
  puheenjohtaja ja osakas sek\u00e4 kymmenen yrityksen hallituksen j\u00e4sen 1980-1997.
  Viidentoista kirjan kirjoittaja, lukujen kirjoittaja viidess\u00e4 kirjassa, kahden
  kirjan toimitaja, 70:n artikkelin, ty\u00f6paperin tai tutkimuspaperin kirjoittaja.
  Viiden kansainv\u00e4lisen tieteellisen lehden toimitusneuvoston j\u00e4sen. Kansainv\u00e4lisen
  operaatioiden ja globaalin liiketoimintastrategian asiantuntija eri maissa sijaitsevissa
  yrityksiss\u00e4.\\n\\n\u2022 **Pekka Salonoja**, merkonomi, Biohit Oy:n hallituksen
  j\u00e4sen vuodesta 1998. Pekka Salonoja on toiminut vuodesta 1991 Erja-konsenriyt\u00f6iden
  hallituksen puheenjohtajana. Aiemminkin h\u00e4n on toiminut is\u00e4nn\u00f6itsij\u00e4n\u00e4
  Erja-kiinteist\u00f6t Oy:ss\u00e4, myyntip\u00e4\u00e4llikk\u00f6n\u00e4 ja toimitusjohtajan
  varamiehen\u00e4 Keskuskunta OK-Liha / Lihakolmio Oy:ss\u00e4, myyntip\u00e4\u00e4llikk\u00f6n\u00e4
  Maurin Liha Oy:ss\u00e4 ja myyntiedustajana Nestle Food Oy:ss\u00e4.\\n\\n\u2022
  **Osmo Suovanen**, LKT, Biohit Oy:n perustaja, nykyinen toimitusjohtaja. Biohit
  Oy:n hallituksen j\u00e4sen vuodesta 1988. Labsystems Oy:n ja Eflab Oy:n perustaja,
  p\u00e4\u00e4osakas, hallituksen puheenjohtaja sek\u00e4 keskeinen n\u00e4iden yritysten
  tuotteiden keksij\u00e4. Tri Suovanen ei valmistui l\u00e4\u00e4ketieteen lisensiaatiksi
  1972 ja l\u00e4\u00e4ketieteen tohtoriksi 1994 Helsingin Yliopistosta. Vuonna 1976
  Suomen keksint\u00f6s\u00e4\u00e4ti\u00f6 my\u00f6nsi tri Suovaniemelle tunnustuspalkinnon
  menestykselliseen tuotantotoimintaan johtaneista 1- ja monikanaavaisista Finnpipette-keksinn\u00f6ist\u00e4.
  H\u00e4n on suorittanut Helsingin kauppakorkeakoulun johtamiskoulutusharjoitman
