  versio.\\n\\nKansilehden kuvaoikeudet:\\n\\nTomi Muukkonen, Metso (vas.).\\n\\nOlliveikko
  Silvonen, Kuuset (kesk.)\\n\\nOlliveikko Silvonen, Auditoija (oik.).\\n\\nForest
  Stewardship Council (FSC) on riippumaton ja taloudellista hy\u00f6ty\u00e4 tavoittelematon
  kansalaisj\u00e4rjest\u00f6, joka on perustettu edist\u00e4m\u00e4\u00e4n ymp\u00e4rist\u00f6n
  kannalta vastuullista, yhteiskunnallisesti hy\u00f6dyllist\u00e4 ja taloudellisesti
  kest\u00e4v\u00e4\u00e4 maailman metsien k\u00e4ytt\u00f6\u00e4.\\n\\nFSC:n visiossa
  maailman metsi\u00e4 hoidetaan siten, ett\u00e4 pidet\u00e4\u00e4n samalla huolta
  niin nykyisten kuin tulevienkin sukupolvien sosiaalisista, ekologisista ja taloudellisista
  oikeuksista ja tarpeista.\\n\\n\u2013 2/22 \u2013\\n\\nJohdanto\\n\\nFSC-sertifioinnin
  hankkiminen voi olla pienmets\u00e4nomistajalle yksin hallinnollisesti tai taloudellisesti
  haastavaa. FSC-sertifikaatin saamisen ja yll\u00e4pit\u00e4misen helpottamiseksi
  on mahdollista luoda ryhmi\u00e4: usea mets\u00e4talousyksikk\u00f6 (usean mets\u00e4nomistajan
  alaisuudessa) muodostaa ryhm\u00e4n, jota johtaa ryhm\u00e4nvet\u00e4j\u00e4, jolla
  on hallussaan koko ryhm\u00e4n yhteinen FSC-sertifikaatti.\\n\\nRyhm\u00e4sertifioinnista
  on taloudellista hy\u00f6ty\u00e4, sill\u00e4 se laskee sertifioinnin kustannuksia,
  voi parantaa palvelujen saatavuutta ja tarjota paremman markkinoille p\u00e4\u00e4syn.
  Ryhm\u00e4n ansiosta my\u00f6s jokaisen j\u00e4senen hallinnollinen taakka on pienempi.
  Ryhm\u00e4nvet\u00e4j\u00e4 voi jakaa vastuita ryhm\u00e4sertifioinnin vaatimuksista
  ryhm\u00e4n eri toimijoille. Tarkoituksena on mahdollistaa riitt\u00e4v\u00e4 joustavuus,
  jonka avulla kukin ryhm\u00e4 voi luoda toimivan j\u00e4rjestelm\u00e4n ja jakaa
  vastuut niin, ett\u00e4 ryhm\u00e4 t\u00e4ytt\u00e4\u00e4 FSC:n vaatimukset. Ryhm\u00e4nvet\u00e4j\u00e4
  voi esimerkiksi kehitt\u00e4\u00e4 ymp\u00e4rist\u00f6vaikutusten arviointimenettely\u00e4
  tai korkeiden suojeluarvojen (\\\"High Conservation Value\\\" eli \\\"HCV\\\") arviointia
  kattamaan koko ryhm\u00e4n, kunhan kukin mets\u00e4talousyksikk\u00f6 toimii n\u00e4iden
  arviointien tulosten mukaisesti ja noudattaa kaikkia sovellettavia FSC-vaatimuksia.\\n\\nRyhm\u00e4n
  sis\u00e4lle voidaan my\u00f6s perustaa resurssienhoitoyksik\u00f6it\u00e4 (\\\"Resource
  Management Unit\\\", \\\"RMU\\\"), joiden resurssip\u00e4\u00e4llikk\u00f6 on vastuussa
  joistain tai kaikista ryhm\u00e4n mets\u00e4talousyksik\u00f6ist\u00e4. T\u00e4llaisen
  rakenteen ansiosta resurssip\u00e4\u00e4llikk\u00f6 pystyy hoitamaan asioita keskitetysti
  ja yhten\u00e4isesti, mik\u00e4 v\u00e4hent\u00e4\u00e4 mets\u00e4nhoitoon liittyvien
  toimien riskitekij\u00f6it\u00e4.\\n\\nStandardin t\u00e4ss\u00e4 versiossa on my\u00f6s
  mahdollisuus sis\u00e4llytt\u00e4\u00e4 ryhm\u00e4sertifikaattiin mets\u00e4alan
  urakoitsijoita ja hy\u00f6dynt\u00e4\u00e4 n\u00e4iden mets\u00e4palveluita ryhm\u00e4n
  mets\u00e4talousyksik\u00f6iss\u00e4. Ryhm\u00e4nvet\u00e4j\u00e4 kouluttaa ja arvioi
  mets\u00e4alan urakoitsijat. T\u00e4m\u00e4 tuo lis\u00e4turvaa ja v\u00e4hent\u00e4\u00e4
  mets\u00e4nhoitoon liittyvi\u00e4 riskitekij\u00f6it\u00e4.\\n\\nRyhm\u00e4sertifiointia
  k\u00e4ytt\u00e4v\u00e4t yleens\u00e4 pienmets\u00e4nomistajat, mutta sit\u00e4
  voivat hy\u00f6dynt\u00e4\u00e4 kaikentyyppiset mets\u00e4talousyksik\u00f6t ja
  omistajat maailmanlaajuisesti.\\n\\nVersiohistoria\\n\\nV 1-0 Vuonna 1996 FSC:n
  yleiskokous hyv\u00e4ksyi uusien l\u00e4hestymistapojen kehitt\u00e4misen pienmets\u00e4nomistajien
  mets\u00e4omaisuuden sertifiointiin. Vuonna 1998 FSC hyv\u00e4ksyi ryhm\u00e4sertifiointia
  koskevan FSC-toimintaperiaatteen Group Certification: FSC Guidelines for certification
  bodies (31.7.1998). Vuonna 2005 FSC tunnisti tarpeen laajentaa standardia mets\u00e4ammattilaisia
  ja sertifiointiorganisaatioita koskevien vaatimusten osalta. Elokuun 31. p\u00e4iv\u00e4n\u00e4
  vuonna 2009 FSC:n kansainv\u00e4linen hallitus hyv\u00e4ksyi ensimm\u00e4isen version
  ryhm\u00e4standardista FSC Standard for Group Entities in Forest Management Groups
  (FSCSTD-30-005 V1-0).\\nV 1-1 Pienimuotoisella p\u00e4ivityksell\u00e4 selvennettiin
  resurssip\u00e4\u00e4llik\u00f6n velvollisuuksia ja sertifikaatin voimassaoloajan
  valvontavaatimuksia. FSC:n p\u00e4\u00e4johtaja Kim Carstensen hyv\u00e4ksyi t\u00e4m\u00e4n
  version joulukuun 21. p\u00e4iv\u00e4n\u00e4 vuonna 2017.\\nV 2-0 T\u00e4m\u00e4
  p\u00e4ivitys oli seurausta FSC:n vuoden 2017 yleiskokouksen aloitteesta numero
  46. P\u00e4ivitys aloitettiin vuoden 2018 lopussa, ja sen tarkoitus oli helpottaa
  pienmets\u00e4nomistajien p\u00e4\u00e4sy\u00e4 FSC-j\u00e4rjestelm\u00e4\u00e4n
  ja huomioida huolet, joita sidosryhm\u00e4t toivat esille standardin ensimm\u00e4isen
  version hyv\u00e4ksymisen j\u00e4lkeen. Standardin piiriin lis\u00e4ttiin my\u00f6s
  kontrolloitu puu, mahdollisuus sis\u00e4llytt\u00e4\u00e4 mets\u00e4alan urakoitsijoita
  ryhm\u00e4sertifikaatin piiriin sek\u00e4 p\u00e4ivitetty sis\u00e4isen valvonnan
  riskiperustainen otantamenetelm\u00e4. FSC:n hallitus hyv\u00e4ksyi t\u00e4m\u00e4n
  version asiakirjasta 86. kokouksessaan marraskuun 16. p\u00e4iv\u00e4n\u00e4 vuonna
  2020.\\n\\n\u2013 3/22 \u2013\\n\\nSis\u00e4llysluettelo\\n\\n\u2013 4/22 \u2013\\n\\nA
  Tavoite\\n\\nStandardin tavoitteena on m\u00e4\u00e4ritell\u00e4 FSC-mets\u00e4nhoitoryhmien
  perustamiseen ja johtamiseen liittyv\u00e4t vaatimukset. Ryhm\u00e4sertifikaatit
  jaotellaan seuraavasti: mets\u00e4nhoidon (\\\"Forest Management\\\" eli \\\"FM\\\"),
  mets\u00e4nhoidon ja alkuper\u00e4ketjun (\\\"Chain of Custody\\\" eli yhdess\u00e4
  \\\"FM/CoC\\\") sek\u00e4 kontrolloidun puun ja mets\u00e4nhoidon (\\\"Controlled
  Wood\\\" eli yhdess\u00e4 \\\"CW/FM\\\") ryhm\u00e4sertifikaatit.\\n\\nB Kattavuus\\n\\nStandardi
  on tarkoitettu ryhm\u00e4nvet\u00e4jien k\u00e4ytt\u00f6\u00f6n, jotta he voivat
  hakea tai yll\u00e4pit\u00e4\u00e4 FSC FM-, FM/CoC- tai CW/FM-ryhm\u00e4sertifiointia.\\n\\nHUOM:
  Kun standardissa viitataan FSC FM/CoC -ryhmiin, niihin luetaan mukaan my\u00f6s
  FM-ryhm\u00e4t.\\n\\nKaikki standardin osa-alueet ovat normatiivisia, mukaan lukien
  kattavuus, voimaantulo- ja voimassaoloajat, viitteet, termit ja m\u00e4\u00e4ritelm\u00e4t,
  huomiot, alaviitteet, taulukot ja liitteet, ellei toisin mainita (esim. esimerkkein\u00e4).
  Tietolaatikoiden sis\u00e4lt\u00f6 EI ole normatiivista.\\n\\nC Voimaantulo- ja
  voimassaoloaika\\n\\nHyv\u00e4ksymisp\u00e4iv\u00e4:\\n\\n19.11.2020\\n\\nJulkaisup\u00e4iv\u00e4:
  16.12.2020\\n\\nVoimaantulop\u00e4iv\u00e4:\\n\\n16.3.2021\\n\\nSiirtym\u00e4aika:
  16.3.2021\u201315.3.2022\\n\\nVoimassaoloaika: Kunnes korvataan tai perutaan\\n\\nD
  L\u00e4hdeluettelo\\n\\nSeuraavat l\u00e4hdemateriaalina k\u00e4ytetyt asiakirjat
  ovat oleellisia t\u00e4m\u00e4n asiakirjan sis\u00e4lt\u00f6\u00e4 sovellettaessa.
  P\u00e4iv\u00e4\u00e4m\u00e4tt\u00f6mien asiakirjojen kohdalla sovelletaan uusinta
  painosta (mukaan lukien sen kaikkia lis\u00e4yksi\u00e4).\\n\\nFSC-STD-01-001 FSC
  Principles and Criteria for Forest Stewardship\\n\\nFSC-STD-60-004 International
  Generic Indicators\\n\\nFSC-STD-01-002 FSC Glossary of Terms\\n\\nFSC-STD-01-003
  SLIMF Eligibility Criteria\\n\\nFSC-STD-20-007 Forest Management Evaluations\\n\\nFSC-STD-30-010
  FSC Controlled Wood Standard for Forest Management Enterprises\\n\\nE Termit ja
  m\u00e4\u00e4ritelm\u00e4t\\n\\nStandardiin sovelletaan sek\u00e4 FSC:n sanakirjassa
  FSC-STD-01-002 Glossary of Terms ett\u00e4 alla olevia termej\u00e4 ja m\u00e4\u00e4ritelmi\u00e4:\\n\\nAktiivinen
  mets\u00e4talousyksikk\u00f6 (\\\"Active management unit\\\"): Mets\u00e4talousyksikk\u00f6,
  useimmiten mets\u00e4tila, jossa on tehty mets\u00e4nhoitotoimenpiteit\u00e4 edellisen
  sertifiointiorganisaation tekem\u00e4n arvioinnin j\u00e4lkeen tai viimeisten 12
  kuukauden aikana, mik\u00e4li sertifiointiorganisaatio ei ole viel\u00e4 tehnyt
  arviota.\\n\\n\u2013 5/22 \u2013\\n\\nLaatikko 1. Esimerkkej\u00e4 aktiivisista
  mets\u00e4talousyksik\u00f6ist\u00e4\\n\\nEsimerkkej\u00e4 aktiivisesta mets\u00e4nhoidosta:\\n\\nPuun,
  energiapuun ja luonnontuotteiden korjuu (kaikki kaupalliset hakkuu- ja ker\u00e4ysmenetelm\u00e4t);
  muokkaus; istuttaminen ja siement\u00e4minen; siemenpuuasentoon hakkaus; lannoitus;
  harvennushakkuu; ojitus; hakkuunj\u00e4lkeiset kunnostustoimet; liikenneyhteyksien
  rakentaminen (esim. mets\u00e4teiden tekeminen); teiden sulkeminen (k\u00e4yt\u00f6st\u00e4
  poisto); polttoaineen hallinta (esim. manuaalinen raivaus); louhinta; kemiallisten
  torjuntaaineiden k\u00e4ytt\u00f6; kulotus; karsiminen; hakkuun valmistelutoimet
  (esim. puiden merkint\u00e4, vesist\u00f6jen suojavy\u00f6hykkeiden merkint\u00e4,
  ymp\u00e4rist\u00f6n tai kulttuuristen arvojen kannalta herkkien alueiden tunnistaminen).\\n\\nHUOM.
  Luonnontuotteilla tarkoitetaan esimerkiksi marjoja, sieni\u00e4, rauhoittamattomia
  kasveja ja k\u00e4\u00e4pi\u00e4, ks. koko lista Suomen mets\u00e4nhoidon FSC-standardista
  FSC-STD-FIN-02-2023 (osoitteessa https://fi.fsc.org/fifi/node/28406)\\n\\nEsimerkkej\u00e4
  ep\u00e4aktiivisesta mets\u00e4nhoidosta:\\n\\nMets\u00e4nsuojelun valvontatoimet
  (esim. palovartijat, luvattoman toiminnan valvonta); pysyvien koealojen perustaminen
  ja/tai seuranta; palokujan yll\u00e4pito; tienlaidan niitt\u00e4minen; tien tasoittaminen
  (muotoilu); rajalinjojen merkitseminen ja yll\u00e4pito; mets\u00e4resurssien selvitt\u00e4minen
  ja luettelointi; kemikaaliton tulokaslajien hallinta; mets\u00e4suunnitelman laatiminen
  ja yll\u00e4pito; mets\u00e4nhoitotoimen teoreettinen suunnittelu (esim. paikkatietoj\u00e4rjestelm\u00e4\u00e4n
  liittyv\u00e4t toimet, rajalinjan merkint\u00e4, puuston m\u00e4\u00e4ritys).\\n\\nSovellettava
  mets\u00e4nhoidon FSC-standardi: T\u00e4m\u00e4n standardin puitteissa termill\u00e4
  viitataan:\\n\\n- valtion tai alueen hyv\u00e4ksyttyyn kansalliseen standardiin/standardeihin.
  Ne voivat olla v\u00e4liaikaisia kansallisia standardeja (\\\"Interim National Standard\\\"),
  v\u00e4liaikaisia alueellisia standardeja (\\\"Interim Regional Standard\\\") tai
  kansallisia mets\u00e4nhoidon FSC-standardeja (\\\"National Forest Stewardship Standard\\\")
  1 ; TAI\\n- kontrolloidun puun standardiin FSC-STD-30-010 FSC Controlled Wood Standard
  for Forest Management Enterprises.\\n\\nPaikallisyhteis\u00f6t (\\\"Communities\\\"):
  T\u00e4m\u00e4n standardin puitteissa t\u00e4ll\u00e4 yleisell\u00e4 termill\u00e4
  viitataan paikallisiin yhteis\u00f6ihin, perinteisesti el\u00e4viin kansoihin ja
  alkuper\u00e4iskansoihin, jotka on m\u00e4\u00e4ritelty englanniksi FSC:n periaatteissa
  ja kriteereiss\u00e4 (FSC-STD-01-001 FSC Principles & Criteria).\\n\\nHUOM. Suomessa
  periaate 3:n [Alkuper\u00e4iskansat] ulkopuolella paikallisyhteis\u00f6ill\u00e4
  [Periaate 4] ei t\u00e4ll\u00e4 hetkell\u00e4 ole mets\u00e4taloustoimiin vaikuttavia
  tapaoikeuksia. Jos sellaisia tapaoikeuksia paljastuu tai tunnustetaan, Indikaattoreita
  4.2.5 ja 4.2.6 sovelletaan automaattisesti muiden kriteerin 4.2 indikaattoreiden
  lis\u00e4ksi (Suomen mets\u00e4nhoidon FSC-standardi).\\n\\nMets\u00e4n portti (\\\"Forest
  gate\\\"): Ensimm\u00e4inen ryhm\u00e4n ulkopuolinen myyntipiste.\\n\\nHUOM: FM/CoC-ryhm\u00e4sertifikaatti
  kattaa ryhm\u00e4n eri toimijoiden (esim. j\u00e4senten, urakoitsijoiden, ryhm\u00e4nvet\u00e4j\u00e4n)
  v\u00e4lisen myynnin. Kun FSC-sertifioitua raaka-ainetta myyd\u00e4\u00e4n ryhm\u00e4n
  ulkopuolelle, tulee ostajalla olla oma sertifikaattinsa, mik\u00e4li t\u00e4m\u00e4
  haluaa siirt\u00e4\u00e4 FSC-v\u00e4itt\u00e4m\u00e4n eteen p\u00e4in.\\n\\nMets\u00e4alan
  urakoitsija (\\\"Forestry contractor\\\"): Laillisesti rekister\u00f6ity henkil\u00f6
  tai ryhm\u00e4 (esim. mets\u00e4koneyritt\u00e4j\u00e4 tai mets\u00e4palveluyritys),
  jonka vastuulla on mets\u00e4n hakkuu, mets\u00e4nhoidollinen toimi tai muunlaisten
  asioiden toimittaminen alueella ryhm\u00e4nvet\u00e4j\u00e4n, resurssip\u00e4\u00e4llik\u00f6n
  tai ryhm\u00e4n j\u00e4senen kanssa tehdyn sopimuksen mukaisesti. Mets\u00e4alan
  urakoitsija voi tarjota palveluita suoraan tai aliurakoitsijan kautta (alihankintana).\\n\\nHUOM:
  T\u00e4m\u00e4n standardin puitteissa \\\"mets\u00e4alan urakoitsija\\\"-termill\u00e4
  viitataan mets\u00e4alan urakoitsijaan, joka on liittynyt ryhm\u00e4\u00e4n ja toimii
  ryhm\u00e4n mets\u00e4talousyksik\u00f6ss\u00e4 FSC FM/CoC -ryhm\u00e4sertifikaatin
  puitteissa.\\n\\n1 Englanninkieliset m\u00e4\u00e4ritelm\u00e4t termeille \\\"Interim
  National Standard\\\", \\\"Interim Regional Standard\\\" ja \\\"National Forest
  Stewardship Standard\\\" l\u00f6yd\u00e4t FSC-PRO-60-007-asiakirjasta. Viittaukset
  sovellettavan mets\u00e4nhoidon FSC-standardin kriteereihin viittaavat FSC:n periaatteiden
  ja kriteerien (FSC Principles and Criteria, \\\"P&C\\\") 5. versioon.\\n\\n\u2013
  6/22 \u2013\\n\\nRyhm\u00e4nvet\u00e4j\u00e4 (\\\"Group Entity\\\"): Yksi tai useampi
  henkil\u00f6 (esim. osuuskunta, omistajien yhdistys, yritys), joka on rekister\u00f6ity
  juridiseksi henkil\u00f6ksi ja edustaa niit\u00e4 mets\u00e4talousyksik\u00f6it\u00e4
  ja mets\u00e4alan urakoitsijoita, jotka muodostavat ryhm\u00e4n FSC FM/CoC- tai
  CW/FM-ryhm\u00e4sertifiointia varten. Ryhm\u00e4nvet\u00e4j\u00e4 hakee sertifiointiorganisaatiolta
  ryhm\u00e4sertifikaattia ja edustaa ryhm\u00e4\u00e4 FSC-sertifiointiprosessin alusta
  sertifikaatin voimassaoloajan loppuun. Ryhm\u00e4nvet\u00e4j\u00e4 on vastuussa
  ryhm\u00e4n sis\u00e4isist\u00e4 j\u00e4rjestelyist\u00e4 (eli ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4st\u00e4)
  ja siit\u00e4, ett\u00e4 t\u00e4m\u00e4n standardin vaatimukset t\u00e4yttyv\u00e4t.\\n\\nRyhm\u00e4n
  j\u00e4sen (\\\"Group member\\\"): Mets\u00e4nomistaja tai -vuokraaja, joka kuuluu
  mets\u00e4talousyksikk\u00f6(je)ns\u00e4 kanssa FSC FM/CoC- tai CW/FM-sertifiointiryhm\u00e4\u00e4n.
  Ryhm\u00e4n j\u00e4senill\u00e4 ei ole omia FSC-sertifikaatteja, vaan heid\u00e4n
  mets\u00e4talousyksikk\u00f6ns\u00e4 kuuluvat ryhm\u00e4nvet\u00e4j\u00e4n hallussa
  olevaan ryhm\u00e4sertifikaattiin.\\n\\nHUOM: Ryhmiin saa liitt\u00e4\u00e4 kaikenlaisia
  mets\u00e4talousyksik\u00f6it\u00e4 (esim. viljelysmets\u00e4t, luonnonmets\u00e4t,
  pienet, suuret jne.), vaikka joillain ryhmill\u00e4 voi olla omat s\u00e4\u00e4nt\u00f6ns\u00e4
  siit\u00e4, millaiset mets\u00e4talousyksik\u00f6t voivat liitty\u00e4 heid\u00e4n
  ryhm\u00e4\u00e4ns\u00e4.\\n\\nRyhm\u00e4n s\u00e4\u00e4nn\u00f6t (\\\"Group Rules\\\"):
  Ryhm\u00e4nvet\u00e4j\u00e4n m\u00e4\u00e4ritt\u00e4m\u00e4t menettelytavat, joiden
  avulla t\u00e4ytet\u00e4\u00e4n sovellettavan mets\u00e4nhoidon FSC-standardin vaatimukset
  ja johdetaan ryhm\u00e4\u00e4.\\n\\nResurssip\u00e4\u00e4llikk\u00f6 (\\\"Resource
  Manager\\\"): Luonnollinen tai juridinen henkil\u00f6, jolle osa tai kaikki ryhm\u00e4n
  j\u00e4senist\u00e4 ovat antaneet teht\u00e4v\u00e4ksi varmistaa, ett\u00e4 sovellettavan
  mets\u00e4nhoidon FSC-standardin vaatimukset t\u00e4yttyv\u00e4t. Ryhm\u00e4n resurssip\u00e4\u00e4llikk\u00f6
  ja vet\u00e4j\u00e4 voivat olla sama luonnollinen tai juridinen henkil\u00f6. Resurssip\u00e4\u00e4llikk\u00f6
  valvoo mets\u00e4nhoitotoimia, mutta h\u00e4nell\u00e4 ei ole omistusoikeutta mets\u00e4n
  resursseihin. Resurssip\u00e4\u00e4llikk\u00f6 voi olla ulkopuolinen tai yksi mets\u00e4nomistajista.
  Resurssip\u00e4\u00e4llik\u00f6n nime\u00e4minen ryhm\u00e4\u00e4n ei ole v\u00e4ltt\u00e4m\u00e4t\u00f6nt\u00e4.\\n\\nResurssienhoitoyksikk\u00f6
  (\\\"Resource Management Unit\\\" eli \\\"RMU\\\"): Mets\u00e4talousyksik\u00f6t,
  jotka kuuluvat yhdelle tai useammalle ryhm\u00e4n j\u00e4senelle ja joiden hallinnollisia
  asioita hoitaa sama resurssip\u00e4\u00e4llikk\u00f6.\\n\\nMets\u00e4aluetta muuttavat
  toimet (\\\"Site-disturbing activities\\\"): sellaiset mets\u00e4nhoitotoimet, jotka
  saattavat olla vahingollisia joillekin mets\u00e4n arvoille, kuten taloudellisille,
  ekologisille ja/tai sosiaalisille arvoille.\\n\\nJ\u00e4senen alakoodi (\\\"Sub-certificate
  code\\\"): Ryhm\u00e4nvet\u00e4j\u00e4n ryhm\u00e4n j\u00e4senelle antama tunnistekoodi,
  jonka tarkoitus on erottaa ryhm\u00e4n j\u00e4senet toisistaan. J\u00e4senten alakoodit
  ovat valinnaisia, ja ryhm\u00e4nvet\u00e4j\u00e4 p\u00e4\u00e4tt\u00e4\u00e4 k\u00e4ytet\u00e4\u00e4nk\u00f6
  niit\u00e4.\\n\\nHUOM: Ryhm\u00e4nvet\u00e4j\u00e4 voi m\u00e4\u00e4ritt\u00e4\u00e4
  j\u00e4senille omat alakoodit eriytt\u00e4\u00e4kseen ja erottaakseen ryhm\u00e4n
  j\u00e4senet toisistaan. Alakoodeja k\u00e4ytet\u00e4\u00e4n vain ryhm\u00e4n sis\u00e4ll\u00e4,
  eik\u00e4 niit\u00e4 saa sekoittaa ryhm\u00e4n sertifikaattikoodiin tai k\u00e4ytt\u00e4\u00e4
  laskuissa tai myyntiasiakirjoissa.\\n\\n\u2013 7/22 \u2013\\n\\nLaatikko 2. Esimerkkej\u00e4
  ryhm\u00e4n sis\u00e4isist\u00e4 j\u00e4rjestelyist\u00e4\\n\\nAlta l\u00f6yd\u00e4t
  joitain esimerkkej\u00e4 ryhm\u00e4n sis\u00e4isist\u00e4 j\u00e4rjestelyist\u00e4.
  Resurssienhoitoyksik\u00f6iden k\u00e4ytt\u00f6 ryhm\u00e4n sis\u00e4ll\u00e4 on
  valinnaista, ja ryhm\u00e4n j\u00e4senet voivat itse p\u00e4\u00e4tt\u00e4\u00e4,
  haluavatko he kuulua sellaiseen vai eiv\u00e4t. T\u00e4ss\u00e4 mainitaan vain joitain
  esimerkkej\u00e4; ryhm\u00e4n toiminta voidaan organisoida muillakin tavoin.\\n\\nEi
  resurssienhoitoyksikk\u00f6\u00e4 ryhm\u00e4ss\u00e4\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\n\\nResurssip\u00e4\u00e4llikk\u00f6\\nRMU\\nRyhm\u00e4nvet\u00e4j\u00e4\\n\\nRyhm\u00e4ss\u00e4
  yksi resurssienhoitoyksikk\u00f6, johon kuuluu osa j\u00e4senist\u00e4\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\nResurssip\u00e4\u00e4llikk\u00f6\\nRMU\\n\\nRyhm\u00e4ss\u00e4
  yksi resurssienhoitoyksikk\u00f6, johon kuuluvat kaikki j\u00e4senet\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\nResurssip\u00e4\u00e4llikk\u00f6
  1\\nRMU 1\\nResurssip\u00e4\u00e4llikk\u00f6 2\\nRMU 2\\n\\nUseita resurssienhoitoyksik\u00f6it\u00e4
  ryhm\u00e4ss\u00e4\\n\\nMets\u00e4talousyksikk\u00f6\\n\\nResurssienhoitoyksikk\u00f6\u00f6n
  kuuluvien mets\u00e4talousyksik\u00f6iden m\u00e4\u00e4r\u00e4 riippuu resurssip\u00e4\u00e4llik\u00f6n
  henkil\u00f6st\u00f6- ja teknisist\u00e4 resursseista ja kattaa enimmill\u00e4\u00e4n
  kaikki ryhm\u00e4n mets\u00e4talousyksik\u00f6t.\\n\\nRyhm\u00e4nvet\u00e4j\u00e4
  ja resurssip\u00e4\u00e4llikk\u00f6 voivat olla yksi ja sama juridinen henkil\u00f6.\\n\\nResurssienhoitoyksik\u00f6iden
  perustamisen etuna on se, ett\u00e4 j\u00e4senet hy\u00f6tyv\u00e4t resurssip\u00e4\u00e4llik\u00f6n
  tiedoista ja tuesta mets\u00e4nhoidossa. Koska resurssienhoitoyksik\u00f6it\u00e4
  johdetaan yhten\u00e4isell\u00e4 tavalla, ryhm\u00e4nvet\u00e4j\u00e4 voi oman harkinnan
  mukaan p\u00e4\u00e4tt\u00e4\u00e4 sis\u00e4isest\u00e4 valvonnasta (tai delegoida
  p\u00e4\u00e4t\u00f6ksen resurssip\u00e4\u00e4llik\u00f6lle).\\n\\nOSA I Mets\u00e4nhoitoryhmien
  perustaminen\\n\\n1 Vaatimukset ryhm\u00e4nvet\u00e4j\u00e4n ominaisuuksista\\n\\n1.1.
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee olla yksi tai useampi henkil\u00f6, joka on rekister\u00f6ity
  yhdeksi itsen\u00e4iseksi juridiseksi henkil\u00f6ksi.\\n1.2. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee suorittaa kaikki asiaankuuluvat lailliset velvoitteet, kuten rekister\u00f6inti
  ja asiaankuuluvien verojen ja muiden maksujen maksaminen.\\n1.3. Kun ryhm\u00e4nvet\u00e4j\u00e4
  hoitaa useampaa kuin yht\u00e4 ryhm\u00e4\u00e4, sill\u00e4 tulee olla riitt\u00e4v\u00e4sti
  resursseja useamman sertifikaatin hallinnon hoitamiseen.\\n\\nHUOM: Kukin ryhm\u00e4
  saa yhden sertifikaatin. Kunkin ryhm\u00e4n j\u00e4senet ovat kaikki joko FSC FM/CoC-
  tai CW/FM-sertifioituja; mik\u00e4li jotkin j\u00e4senet sertifioidaan FM-standardien
  ja toiset CW-standardien mukaan, ne kuuluvat eri ryhmiin.\\n\\n1.4. Ryhm\u00e4nvet\u00e4j\u00e4
  on vastuussa siit\u00e4, ett\u00e4 standardin vaatimukset t\u00e4yttyv\u00e4t.\\n1.5.
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee varmistaa, ett\u00e4 kaikki ryhm\u00e4n toimijat
  osoittavat riitt\u00e4v\u00e4\u00e4 osaamista omien vastuualueidensa hoitamiseen.\\n\\nMets\u00e4nhoidon
  FSC-ryhm\u00e4standardi\\n\\n\u2013 8/22 \u2013\\n\\n2 Vaatimukset ryhm\u00e4n j\u00e4senille\\n\\n2.1.
  Jokaisen ryhm\u00e4n j\u00e4seneksi pyrkiv\u00e4n pit\u00e4\u00e4 allekirjoittaa
  kirjallinen suostumus. Suostumuksen my\u00f6t\u00e4 j\u00e4sen:\\na) sitoutuu noudattamaan
  sovellettavaa mets\u00e4nhoidon FSC-standardia ja ryhm\u00e4n s\u00e4\u00e4nt\u00f6j\u00e4;\\nb)
  vakuuttaa, ettei heid\u00e4n ryhm\u00e4\u00e4n tuomansa mets\u00e4talousyksik\u00f6t
  kuulu jo toisen FSC-sertifikaatin piiriin;\\nc) lupaa antaa ryhm\u00e4nvet\u00e4j\u00e4n,
  sertifiointiorganisaation, FSC:n ja ASI:n hoitaa velvollisuutensa; (HUOM: ASI tarkoittaa
  Accreditation Services Internationalia, auditoijien ty\u00f6t\u00e4 valvovaa organisaatiota.)\\nd)
  suostuu siihen, ett\u00e4 ryhm\u00e4nvet\u00e4j\u00e4 on sertifioinnin p\u00e4\u00e4asiallinen
  yhteyshenkil\u00f6.\\nHUOM: Kirjallisen suostumuksen ei tarvitse olla erillinen
  asiakirja. Se voi olla osa liittymissopimusta tai jotain toista asiakirjaa (esim.
  kokousp\u00f6yt\u00e4kirjaa), jossa m\u00e4\u00e4ritell\u00e4\u00e4n ryhm\u00e4n
  j\u00e4senen ja ryhm\u00e4nvet\u00e4j\u00e4n roolit ja ty\u00f6njako.\\nHUOM. 2:
  Paikallisyhteis\u00f6jen kohdalla suostumus voidaan kirjata my\u00f6s jonkin toisenlaisen
  sopimuksen kautta, kuten kokousp\u00f6yt\u00e4kirjan, mets\u00e4nhoitosopimuksen,
  alkuper\u00e4iskansasopimuksen tms.\\n2.1.1. Ryhm\u00e4n j\u00e4senen tai sen edustajan
  (esimerkiksi resurssip\u00e4\u00e4llik\u00f6n tai konsultin) tulee allekirjoittaa
  suostumus.\\n2.1.2. Kun joku (esim. resurssip\u00e4\u00e4llikk\u00f6 tai konsultti)
  toimii j\u00e4senen edustajana, suostumukseen tulee liitt\u00e4\u00e4 (laillisesti
  tai muuten) oikeaksi todistettavissa oleva sopimus j\u00e4senen ja edustajan v\u00e4lill\u00e4.\\n\\nHUOM:
  Vaatimus siit\u00e4, ett\u00e4 sopimuksen tulee olla todistettavissa oikeaksi tarkoittaa
  sit\u00e4, ett\u00e4 edustajien pit\u00e4\u00e4 pysty\u00e4 todistamaan j\u00e4senen
  valtuuttaneen heid\u00e4t toimimaan puolestaan.\\n\\n3 Vastuiden jako\\n\\n3.1.
  Ryhm\u00e4nvet\u00e4j\u00e4 voi jakaa vastuut ryhm\u00e4n eri toimijoiden v\u00e4lille
  (esim. ryhm\u00e4nvet\u00e4j\u00e4n, j\u00e4senten, urakoitsijoiden yms.).\\nHUOM:
  Ryhm\u00e4nvet\u00e4j\u00e4 saa m\u00e4\u00e4ritt\u00e4\u00e4, mill\u00e4 tasolla
  vaatimuksien mukaan toimitaan, kunhan jokaisen mets\u00e4talousyksik\u00f6n kohdalla
  voidaan osoittaa vaatimustenmukainen toiminta (lausekkeen 4.1 mukaisesti).\\n3.2.
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee m\u00e4\u00e4ritell\u00e4 ja kirjata yl\u00f6s
  p\u00e4\u00e4velvollisuuksien jakautuminen ryhm\u00e4n sis\u00e4ll\u00e4 lausekkeen
  3.1 mukaisesti.\\n\\n\u2013 9/22 \u2013\\n\\nLaatikko 3. Sovellettava mets\u00e4nhoidon
  FSC-standardi.\\n\\nFM/CoC-sertifioinnissa sovellettava mets\u00e4nhoidon FSC-standardi
  perustuu FSC:n Periaatteisiin ja kriteereihin (Principles and Criteria) sek\u00e4
  Kansainv\u00e4lisiin yleisindikaattoreihin (International Generic Indicators). Kaikissa
  n\u00e4iss\u00e4 asiakirjoissa osapuoleen, joka on vastuussa kaikkien vaatimusten
  noudattamisesta, viitataan sanalla \\\"organisaatio\\\" (\\\"The Organization\\\").\\n\\nRyhmien
  kohdalla \\\"organisaatio\\\" on ryhm\u00e4nvet\u00e4j\u00e4, joka voi delegoida
  vastuita muille ryhm\u00e4n toimijoille. Siksi ryhm\u00e4sertifioinnin kontekstissa
  \\\"organisaatio\\\" on se ryhm\u00e4n toimija, joka on vastuussa jonkin tietyn
  sovellettavassa mets\u00e4nhoidon FSC-standardissa olevan vaatimuksen noudattamisesta.
  Se voi olla ryhm\u00e4nvet\u00e4j\u00e4, mutta se voi olla my\u00f6s ryhm\u00e4n
  j\u00e4sen, urakoitsija, konsultti, resurssip\u00e4\u00e4llikk\u00f6 tms.\\n\\nRyhm\u00e4nvet\u00e4j\u00e4
  voi esimerkiksi jakaa vastuun j\u00e4tteiden poistamista koskevan kriteerin 10.12
  noudattamisesta ryhm\u00e4n j\u00e4senille. T\u00e4ll\u00f6in j\u00e4senet olisivat
  se \\\"organisaatio\\\", joka on vastuussa kyseisen kriteerin t\u00e4yttymisest\u00e4,
  vaikka ryhm\u00e4nvet\u00e4j\u00e4 olisikin p\u00e4\u00e4vastuussa vaatimustenmukaisuudesta.\\n\\nMik\u00e4li
  tunnistetaan kriteerin t\u00e4yttymisen este, ryhm\u00e4nvet\u00e4j\u00e4 analysoi,
  onko se l\u00e4ht\u00f6isin j\u00e4sentasolta (j\u00e4senet eiv\u00e4t poistaneet
  j\u00e4tteit\u00e4 saamansa tiedon ja vastuunsa mukaisesti) vai johtuuko se siit\u00e4,
  ettei ryhm\u00e4nvet\u00e4j\u00e4 jakanut tarpeeksi tietoa j\u00e4senille (silloin,
  kun useampi j\u00e4sen ep\u00e4onnistuu ohjeiden noudattamisessa, on syy mahdollisesti
  ryhm\u00e4nvet\u00e4j\u00e4n).\\n\\nKontrolloitu puu (\\\"Controlled Wood\\\"):\\n\\nCW/FM-sertifioinnissa
  \\\"mets\u00e4talousyhti\u00f6\\\" (\\\"Forest Management Enterprise\\\") on vastuussa
  FSC-STD-30-010 FSC Controlled Wood Standard for Forest Management Enterprises -standardin
  vaatimusten noudattamisesta. Kuten aiemmassa esimerkiss\u00e4, ryhm\u00e4nvet\u00e4j\u00e4
  toimisi \\\"mets\u00e4talousyhti\u00f6n\u00e4\\\", joka voi jakaa vastuun standardin
  FSC-STD-30-010 vaatimusten t\u00e4ytt\u00e4misest\u00e4 muille ryhm\u00e4n toimijoille.\\n\\nLaatikko
  4. Toteutus tai vaatimustenmukaisuus ryhm\u00e4tasolla.\\n\\nKukin ryhm\u00e4 p\u00e4\u00e4tt\u00e4\u00e4
  sis\u00e4isesti ty\u00f6njaosta, ja ryhm\u00e4nvet\u00e4j\u00e4 p\u00e4\u00e4tt\u00e4\u00e4,
  miten jakaa eri vastuut sovellettavan mets\u00e4nhoidon FSC-standardin noudattamisesta.\\n\\nKun
  ryhm\u00e4nvet\u00e4j\u00e4 tai muu toimija (kuten kuvattu tietolaatikossa 3) on
  vastuussa sovellettavan mets\u00e4nhoidon FSC-standardin vaatimuksen noudattamisesta
  ja vaatimuksen noudattamista edellytet\u00e4\u00e4n koko ryhm\u00e4lt\u00e4 ja kaikilta
  mets\u00e4talousyksik\u00f6ilt\u00e4, kutsutaan t\u00e4t\u00e4 yleens\u00e4 nimityksell\u00e4
  \\\"toteutus tai vaatimustenmukaisuus ryhm\u00e4tasolla\\\". T\u00e4llainen on sallittua,
  ja sit\u00e4 hy\u00f6dynnet\u00e4\u00e4n l\u00e4hinn\u00e4 hallinnollisten tai asiakirjapainotteisten
  vaatimusten noudattamisessa. On t\u00e4rke\u00e4\u00e4 korostaa, ett\u00e4 kaikki
  ryhm\u00e4tasolla toteutettujen analyysien tulokset ja kaikki n\u00e4ihin vaatimuksiin
  liittyv\u00e4t mets\u00e4nhoitotoimet pit\u00e4\u00e4 toteuttaa vaatimusten mukaisesti
  ryhm\u00e4n jokaisessa mets\u00e4talousyksik\u00f6ss\u00e4.\\n\\nAlla on esimerkki
  ymp\u00e4rist\u00f6arvojen arviointia koskevan kriteerin 6.1 noudattamisesta ryhm\u00e4tasolla:\\n\\nToinen
  esimerkki terveys- ja turvallisuusk\u00e4yt\u00e4nteit\u00e4 koskevan kriteerin
  2.3 noudattamisesta voisi olla: ryhm\u00e4nvet\u00e4j\u00e4 valmistelee korjuut\u00f6iden
  riskinarviointipohjan tarkistuslistoineen ja terveys- ja turvallisuusvaatimuksineen.
  Arviointipohjaa k\u00e4ytet\u00e4\u00e4n kussakin mets\u00e4talousyksik\u00f6ss\u00e4
  jokaisen korjuuoperaation riskien tunnistamiseen.\\n\\nResurssip\u00e4\u00e4llikk\u00f6
  (\\\"Resource Manager\\\") ja resurssienhoitoyksikk\u00f6 (\\\"Resource Management
  Unit\\\" eli \\\"RMU\\\")\\n\\n3.3. Jotkin tai kaikki ryhm\u00e4n j\u00e4senet voivat
  halutessaan siirt\u00e4\u00e4 mets\u00e4talousyksikk\u00f6ns\u00e4 vastuun sovellettavan
  mets\u00e4nhoidon FSC-standardin vaatimusten noudattamisesta yhdelle resurssip\u00e4\u00e4llik\u00f6lle.
  N\u00e4ist\u00e4 mets\u00e4talousyksik\u00f6ist\u00e4 voidaan muodostaa yksi resurssienhoitoyksikk\u00f6
  (\\\"RMU\\\").\\n3.3.1. RMU:n resurssip\u00e4\u00e4llik\u00f6n tulee ottaa vastuu
  sovellettavan mets\u00e4nhoidon FSC-standardin vaatimusten t\u00e4yttymisest\u00e4
  ja ryhm\u00e4n s\u00e4\u00e4nt\u00f6jen noudattamisesta kaikkien RMU:n j\u00e4senten
  puolesta.\\n\\nHUOM: RMU:hun voivat kuulua kaikki tai vain osa ryhm\u00e4n j\u00e4senist\u00e4.
  Yhdess\u00e4 ryhm\u00e4ss\u00e4 voi olla useampi RMU.\\n\\nHUOM. 2: RMU:n j\u00e4senet
  voivat tehd\u00e4 joitain hallinnollisia t\u00f6it\u00e4 omissa mets\u00e4talousyksik\u00f6iss\u00e4\u00e4n,
  kunhan vastuu sovellettavan mets\u00e4nhoidon FSC-standardin vaatimusten noudattamisesta
  s\u00e4ilyy resurssip\u00e4\u00e4llik\u00f6ll\u00e4.\\n\\n4 Mets\u00e4talousyksik\u00f6iden
  vaatimustenmukaisuus\\n\\n4.1. Jokaisen FSC:n FM/CoC- tai CW/FM-ryhm\u00e4sertifikaattiin
  kuuluvan mets\u00e4talousyksik\u00f6n tulee osoittaa, ett\u00e4 sovellettavan mets\u00e4nhoidon
  FSC-standardin vaatimukset t\u00e4yttyv\u00e4t, paitsi lausekkeen 4.2 mukaisessa
  tilanteessa.\\n4.2. SLIMF-mets\u00e4talousyksik\u00f6it\u00e4 koskee seuraava s\u00e4\u00e4nt\u00f6:
  Aluerajoja koskevan kriteerin 6.5 vaatimusten t\u00e4yttymisen voi osoittaa yhteisesti
  kaikissa mets\u00e4talousyksik\u00f6iss\u00e4 yksitt\u00e4isten mets\u00e4talousyksik\u00f6iden
  sijaan.\\nHUOM. SLIMF viittaa pieniin ja matalalla intensiteetill\u00e4 hoidettuihin
  metsiin (\\\"small and low intensity managed forests\\\"): Suomen kansallisessa
  mets\u00e4nhoidon FSC-standardissa mets\u00e4talousyksik\u00f6t, jotka kuuluvat
  kokoluokkiin XS (<20 ha) ja S (20\u2013500 ha Etel\u00e4Suomessa ja 20\u20131000
  ha Pohjois-Suomessa) luokitellaan pieniksi.\\n4.2.1. Ryhmiss\u00e4, joissa on sek\u00e4
  SLIMF- ett\u00e4 muunlaisia mets\u00e4talousyksik\u00f6it\u00e4, muunlaiset mets\u00e4talousyksik\u00f6t
  voivat auttaa SLIMF-mets\u00e4talousyksik\u00f6it\u00e4 t\u00e4ytt\u00e4m\u00e4\u00e4n
  n\u00e4it\u00e4 vaatimuksia joko osittain tai kokonaan.\\nHUOM: Muiden kuin SLIMF-mets\u00e4talousyksik\u00f6iden
  tulee aina noudattaa kriteeri\u00e4 6.5 jokaisessa mets\u00e4talousyksik\u00f6ss\u00e4.\\n\\nLaatikko
  5. Kriteerin 6.5 (s\u00e4\u00e4stett\u00e4v\u00e4t arvokkaat elinymp\u00e4rist\u00f6t)
  noudattaminen SLIMF-mets\u00e4talousyksik\u00f6iss\u00e4\\n\\nKussakin mets\u00e4talousyksik\u00f6ss\u00e4
  noudatetaan oletusarvoisesti kriteeri\u00e4 6.5 (Kuva 1). Jos se ei kuitenkaan ole
  mahdollista yksitt\u00e4isiss\u00e4 SLIMF-mets\u00e4talousyksik\u00f6iss\u00e4,
  ryhm\u00e4n SLIMF-mets\u00e4talousyksik\u00f6t voivat yhdess\u00e4 t\u00e4ytt\u00e4\u00e4
  vaatimuksen (Kuva 2). Se tarkoittaa esimerkiksi sit\u00e4, ett\u00e4 kahdella SLIMF-mets\u00e4talousyksik\u00f6ll\u00e4
  voi olla suurempi prosenttiosuus suojeltua mets\u00e4\u00e4, jolloin ne t\u00e4ytt\u00e4v\u00e4t
  kaikkien ryhm\u00e4n SLIMF-mets\u00e4talousyksik\u00f6iden vaatimukset. Ehtona on,
  ett\u00e4 suojellun mets\u00e4n pinta-ala on yht\u00e4 suuri tai suurempi kuin ryhm\u00e4n
  kaikilta SLIMF-mets\u00e4talousyksik\u00f6ilt\u00e4 vaadittu pinta-ala on yhteens\u00e4.\\n\\nKuva
  2. Osa SLIMF-mets\u00e4talousyksik\u00f6ist\u00e4 t\u00e4ytt\u00e4\u00e4 kriteerin
  6.5 vaatimuksen ryhm\u00e4n kaikkien SLIMF-yksik\u00f6iden puolesta.\\n\\nRyhm\u00e4n
  suurempien mets\u00e4talousyksik\u00f6iden pit\u00e4\u00e4 kunkin itse t\u00e4ytt\u00e4\u00e4
  kriteeri 6.5. Ne voivat kuitenkin lis\u00e4t\u00e4 suojeltua pinta-alaa kattaakseen
  ryhm\u00e4n SLIMF-mets\u00e4talousyksik\u00f6iden s\u00e4\u00e4stett\u00e4v\u00e4n
  pinta-alan vaatimukset. N\u00e4in voi tehd\u00e4 joko niin, ett\u00e4 yhdist\u00e4\u00e4
  alueensa ryhm\u00e4n SLIMF-mets\u00e4talousyksik\u00f6iden suojeltuihin alueisiin
  (Kuva 3) tai niin, ett\u00e4 ainoastaan suuremmilla yksik\u00f6ill\u00e4 on s\u00e4\u00e4stett\u00e4vi\u00e4
  mets\u00e4alueita (Kuva 4), jolloin ne t\u00e4ytt\u00e4v\u00e4t vaatimuksen kaikkien
  ryhm\u00e4n SLIMF-mets\u00e4talousyksik\u00f6iden puolesta.\\n\\nKuva 3. Jotkin
  SLIMF- ja suuremmat mets\u00e4talousyksik\u00f6t t\u00e4ytt\u00e4v\u00e4t kriteerin
  6.5 ryhm\u00e4n kaikkien SLIMF-mets\u00e4talousyksik\u00f6iden puolesta.\\n\\nKuva
  4. Suuret mets\u00e4talousyksik\u00f6t t\u00e4ytt\u00e4v\u00e4t kriteerin 6.5 ryhm\u00e4n
  kaikkien SLIMF-mets\u00e4talousyksik\u00f6iden puolesta.\\n\\nSLIMF-mets\u00e4talousyksikk\u00f6\\nSuurempi
  mets\u00e4talousyksikk\u00f6\\nKriteerin 6.5 noudattaminen jaetusti\\nKriteerin
  6.5 mukaiset s\u00e4\u00e4stett\u00e4v\u00e4t alueet\\n\\nEsimerkiss\u00e4 kuvataan
  poikkeustilanne: sellaiset SLIMF-mets\u00e4talousyksik\u00f6t, joilla ei ole alueita,
  joilla olisi luontaisia ekosysteemej\u00e4 edustavia osia, tai joissa t\u00e4llaiset
  alueet eiv\u00e4t ole riitt\u00e4vi\u00e4, voivat jakaa kriteerin 6.5 vaatimustenmukaisuuden
  ryhm\u00e4ns\u00e4 muille mets\u00e4talousyksik\u00f6ille.\\n\\nPoikkeus ei oikeuta
  tekem\u00e4\u00e4n korjuutoimia luontaisissa ekosysteemeiss\u00e4, joita tulee sen
  sijaan suojella 6. periaatteen (\\\"Principle 6\\\") muiden kriteerien mukaisesti.\\n\\n5
  Ryhm\u00e4n koko\\n\\n5.1. Ryhm\u00e4nvet\u00e4j\u00e4 m\u00e4\u00e4rittelee henkil\u00f6st\u00f6-
  ja teknisten resurssiensa perusteella ryhm\u00e4n enimm\u00e4iskoon, joka lasketaan:\\na)
  ryhm\u00e4n j\u00e4senten m\u00e4\u00e4r\u00e4n;\\nb) yksitt\u00e4isten mets\u00e4talousyksik\u00f6iden
  koon; ja/tai\\nc) metsien yhteispinta-alan ja sijainnin mukaan.\\n5.2. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee kehitt\u00e4\u00e4 ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4 (t\u00e4m\u00e4n
  standardin Osan II mukaisesti), joka mahdollistaa kaikkien ryhm\u00e4n j\u00e4senten
  jatkuvan ja tehokkaan hallinnoinnin.\\n\\n6 Monikansalliset ryhm\u00e4t\\n\\n6.1.
  FM/CoC- ja CW/FM-ryhmi\u00e4 voi perustaa vain kansallisella tasolla, paitsi lausekkeen
  6.2 mukaisissa tilanteissa.\\n6.2. Sellaisissa tapauksissa, joissa eri maiden yhten\u00e4iset
  olosuhteet mahdollistavat tehokkaan ja uskottavan monikansallisen ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4n,
  ryhm\u00e4nvet\u00e4j\u00e4n tulee pyyt\u00e4\u00e4 kansainv\u00e4liselt\u00e4 FSC:lt\u00e4
  virallista hyv\u00e4ksynt\u00e4\u00e4 t\u00e4llaisen ryhm\u00e4n sertifiointia varten
  oman sertifiointiorganisaationsa kautta.\\n\\nOSA II Ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4\\n\\n7
  Uusien j\u00e4senten lis\u00e4\u00e4minen ryhm\u00e4\u00e4n\\n\\n7.1. Ennen uuden
  j\u00e4senen lis\u00e4\u00e4mist\u00e4 ryhm\u00e4nvet\u00e4j\u00e4n tulee arvioida
  jokainen hakija varmistaakseen, ett\u00e4 hakijalla on edellytykset t\u00e4ytt\u00e4\u00e4
  jatkossa sovellettavan mets\u00e4nhoidon FSC-standardin vaatimukset ja ryhm\u00e4n
  s\u00e4\u00e4nn\u00f6t.\\n7.1.1. Ryhm\u00e4nvet\u00e4j\u00e4n tulee tehd\u00e4 maastoarviointi
  lausekkeen 7.1 noudattamisesta, paitsi sellaisten hakijoiden kohdalla, jotka t\u00e4ytt\u00e4v\u00e4t
  SLIMF-kriteerit tai t\u00e4m\u00e4n standardin m\u00e4\u00e4ritelm\u00e4n paikallisyhteis\u00f6lle,
  sill\u00e4 ne voidaan arvioida et\u00e4n\u00e4.\\n7.1.2. Mik\u00e4li ryhm\u00e4n
  j\u00e4sen haluaa vaihtaa toiseen, saman ryhm\u00e4nvet\u00e4j\u00e4n johtamaan
  ryhm\u00e4\u00e4n, ryhm\u00e4nvet\u00e4j\u00e4 tekee t\u00e4llaisen arvioinnin siirron
  mahdollistamiseksi.\\n\\n8 Tiedon jakaminen j\u00e4senille\\n\\n8.1. Ryhm\u00e4nvet\u00e4j\u00e4
  jakaa kaikille j\u00e4senille tietoa tai p\u00e4\u00e4syn tietoihin, joista k\u00e4y
  ilmi, miten ryhm\u00e4 toimii. Tiedoista tulee l\u00f6yty\u00e4:\\na) ryhm\u00e4n
  s\u00e4\u00e4nn\u00f6t, sovellettava mets\u00e4nhoidon FSC-standardi ja ohjeet,
  miten niit\u00e4 noudatetaan. Ryhm\u00e4nvet\u00e4j\u00e4n tulee pyydett\u00e4ess\u00e4
  tarjota p\u00e4\u00e4sy muihin normatiivisiin asiakirjoihin;\\nb) selvitys sertifiointiorganisaation
  auditointiprosessista;\\nc) selvitys siit\u00e4, ett\u00e4 sertifiointiorganisaatiolla
  (auditoijalla), FSC:ll\u00e4 ja ASI:lla on p\u00e4\u00e4syoikeudet j\u00e4senten
  mets\u00e4talousyksik\u00f6ihin ja asiakirjoihin;\\nd) selvitys siit\u00e4, ett\u00e4
  sertifiointiorganisaatio julkaisee julkisen yhteenvedon arviointiraportistaan, ett\u00e4
  ASI saattaa julkaista julkisen yhteenvedon arvioinnistaan ja ett\u00e4 FSC lis\u00e4\u00e4
  ryhm\u00e4n tietoja tietokantaansa;\\ne) selvitys ryhm\u00e4\u00e4n liittymisen
  kustannuksista.\\n8.1.1. Yhteenvedon antamisen lis\u00e4ksi ryhm\u00e4nvet\u00e4j\u00e4n
  tulee pyydett\u00e4ess\u00e4 antaa ryhm\u00e4n j\u00e4senelle p\u00e4\u00e4sy kaikkiin
  n\u00e4ihin asiakirjoihin.\\n8.1.2. Tiedot tulee esitt\u00e4\u00e4 j\u00e4senille
  ymm\u00e4rrett\u00e4v\u00e4ss\u00e4 muodossa.\\n\\n9 Ryhm\u00e4n s\u00e4\u00e4nn\u00f6t\\n\\n9.1.
  Ryhm\u00e4n tulee kehitt\u00e4\u00e4, toteuttaa ja yll\u00e4pit\u00e4\u00e4 ryhm\u00e4n
  toiminnan kirjallisia s\u00e4\u00e4nt\u00f6j\u00e4, jotka kattavat kaikki t\u00e4m\u00e4n
  standardin sovellettavat vaatimukset, ottavat huomioon ryhm\u00e4n koon ja moninaisuuden,
  ja joihin sis\u00e4ltyy:\\na) s\u00e4\u00e4nn\u00f6t siit\u00e4, kuka voi kuulua
  ryhm\u00e4\u00e4n;\\nb) s\u00e4\u00e4nn\u00f6t siit\u00e4, miten uudet j\u00e4senet
  lis\u00e4t\u00e4\u00e4n ryhm\u00e4\u00e4n;\\nc) s\u00e4\u00e4nn\u00f6t siit\u00e4,
  miss\u00e4 tilanteessa j\u00e4senyys perutaan tai j\u00e4sen poistetaan ryhm\u00e4st\u00e4;\\nd)
  ryhm\u00e4n sis\u00e4inen valvontaj\u00e4rjestelm\u00e4;\\n\\ne) menettelyohjeet
  tilanteeseen, jossa auditoinnista seuraa pyynt\u00f6j\u00e4 korjaaviksi toimenpiteiksi
  (\\\"corrective action requests\\\", \\\"CAR\\\"), mukaan lukien sis\u00e4iset toimet
  ja toimet sertifiointiorganisaation kanssa, sek\u00e4 aikajanat ja seuraamukset
  korjaavien toimenpiteiden tekem\u00e4tt\u00e4 j\u00e4tt\u00e4misest\u00e4;\\nf)
  menettelyohjeet tilanteeseen, jossa ryhm\u00e4n j\u00e4senest\u00e4 tehd\u00e4\u00e4n
  valitus;\\ng) j\u00e4rjestelm\u00e4t ryhm\u00e4n j\u00e4senten tuottamien FSC-sertifioitujen
  mets\u00e4tuotteiden j\u00e4ljitt\u00e4miseen ja seuraamiseen \\\"mets\u00e4n portille\\\"
  asti sovellettavan mets\u00e4nhoidon FSC-standardin kriteerin 8.5 mukaisesti;\\nh)
  tuotteiden markkinointiin tai myyntiin liittyv\u00e4t vaatimukset;\\ni) s\u00e4\u00e4nn\u00f6t
  FSC-tavaramerkkien ja tavaramerkin lisenssikoodin k\u00e4yt\u00f6st\u00e4.\\n\\nHUOM:
  Ryhm\u00e4n koolla ja moninaisuudella tarkoitetaan sit\u00e4, ett\u00e4 suuremmat
  ja monimuotoisemmat ryhm\u00e4t, joihin liittyy enemm\u00e4n riskej\u00e4, saattavat
  tarvita kattavampia menetelmi\u00e4 sellaisten ymp\u00e4rist\u00f6- ja sosiaalisten
  arvojen kuten korkeiden suojeluarvojen, alkuper\u00e4iskansojen tai harvinaisten
  ja uhanalaisten lajien suojelun varmistamiseksi. Pienemm\u00e4t ryhm\u00e4t, joihin
  liittyy v\u00e4hemm\u00e4n riskej\u00e4, voivat kehitt\u00e4\u00e4 yksinkertaisempia
  menetelmi\u00e4, vaikka niidenkin pit\u00e4\u00e4 m\u00e4\u00e4ritell\u00e4 kaikki
  mainitut ryhm\u00e4n s\u00e4\u00e4nn\u00f6t.\\n\\n10 Ryhm\u00e4n tietorekisteri\\n\\n10.1.
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee yll\u00e4pit\u00e4\u00e4 p\u00e4ivitetty\u00e4
  rekisteri\u00e4 kaikista t\u00e4m\u00e4n standardin soveltuvista vaatimuksista sek\u00e4
  sovellettavan mets\u00e4nhoidon FSC-standardin vaatimuksista. Tietorekisteriss\u00e4
  tulee olla:\\na) lista ryhm\u00e4n j\u00e4senist\u00e4, ja kustakin j\u00e4senest\u00e4
  seuraavat tiedot:\\ni. nimi ja yhteystiedot;\\nii. ryhm\u00e4\u00e4n liittymisen
  p\u00e4iv\u00e4m\u00e4\u00e4r\u00e4 ja, mik\u00e4li sovellettavissa, ryhm\u00e4st\u00e4
  eroamisen p\u00e4iv\u00e4m\u00e4\u00e4r\u00e4 sek\u00e4 syy ryhm\u00e4st\u00e4 eroamiseen;\\niii.
  ryhm\u00e4\u00e4n kuuluvien mets\u00e4talousyksik\u00f6iden lukum\u00e4\u00e4r\u00e4
  ja pinta-ala;\\niv. jokaisen ryhm\u00e4\u00e4n kuuluvan mets\u00e4talousyksik\u00f6n
  maantieteellinen sijainti (esim. koordinaatit) ja tietoja tukeva kartta tai muu
  todiste;\\nv. jokaisen j\u00e4senen mets\u00e4nomistajuustyyppi (esim. yksityisomistus,
  valtion omistama, yhteis\u00f6n omistama tms.);\\nvi. p\u00e4\u00e4asialliset tuotteet;\\nvii.
  j\u00e4senten alakoodit, mik\u00e4li sellaisia on annettu.\\n\\nHUOM: Ryhm\u00e4nvet\u00e4j\u00e4n
  on t\u00e4ytett\u00e4v\u00e4 tietosuojavelvollisuutensa n\u00e4it\u00e4 tietoja
  ker\u00e4tess\u00e4\u00e4n.\\n\\nb) tiedot kaikesta henkil\u00f6kunnalle ja/tai
  ryhm\u00e4n j\u00e4senille annetusta koulutuksesta;\\nc) kaikkien ryhm\u00e4n j\u00e4senten
  kirjallinen suostumus lausekkeen 2.1 mukaisesti;\\nd) asiakirjoja ja muuta aineistoa
  suositelluista mets\u00e4nhoitomenetelmist\u00e4 ja niiden toteutuksesta;\\ne) tiedot,
  joista ilmenee, ett\u00e4 ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4\u00e4 toteutetaan.
  T\u00e4m\u00e4n tulee sis\u00e4lt\u00e4\u00e4 sis\u00e4isen valvonnan asiakirjat,
  tiedot valvonnassa ilmenneist\u00e4 puutteista vaatimusten noudattamisessa ja niiden
  korjaustoimista yms.;\\nf) tiedot ryhm\u00e4n arvioiduista tai todellisista vuosittaisista
  korjuum\u00e4\u00e4rist\u00e4 ja todellisista vuosittaisista FSC-tuotteiden myyntim\u00e4\u00e4rist\u00e4.\\n\\nMets\u00e4nhoidon
  FSC-ryhm\u00e4standardi\\n\\nHUOM: Ryhm\u00e4nvet\u00e4j\u00e4n keskitetysti yll\u00e4pit\u00e4m\u00e4n
  tietorekisterin laajuus riippuu tapauksesta. Jotta kustannukset olisivat mahdollisimmat
  pienet ja sertifiointiorganisaation arviointi sek\u00e4 FSC:n ja ASI:n valvonta
  olisi mahdollisimman tehokasta, tietorekisteri\u00e4 tulisi pit\u00e4\u00e4 keskitetysti
  tai digitaalisesti aina kun mahdollista.\\n\\n10.2. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee s\u00e4ilytt\u00e4\u00e4 kaikkia tietorekisterin materiaaleja v\u00e4hint\u00e4\u00e4n
  viisi (5) vuotta.\\n10.3. Sellaisissa maissa, joissa on kansainv\u00e4lisen FSC:n
  arvion mukaan korkea v\u00e4\u00e4rien FSC-v\u00e4itt\u00e4mien riski koskien ryhmiss\u00e4
  korjattuja raaka-aineita, ryhm\u00e4nvet\u00e4j\u00e4n tulee yll\u00e4pit\u00e4\u00e4
  ajantasaista tietorekisteri\u00e4 kunkin ryhm\u00e4n mets\u00e4talousyksik\u00f6n
  korjuu- ja FSC-myynnin m\u00e4\u00e4rist\u00e4.\\nHUOM: Sellaisten mets\u00e4talousyksik\u00f6iden
  kohdalla, joiden korjuun ja myynnin hoitaa urakoitsija, ryhm\u00e4nvet\u00e4j\u00e4n
  tulisi varmistaa, ett\u00e4 urakoitsijan myyntim\u00e4\u00e4r\u00e4t vastaavat ryhm\u00e4st\u00e4
  ostettujen raaka-aineiden arvioituja m\u00e4\u00e4ri\u00e4. T\u00e4m\u00e4n takia
  mets\u00e4nomistajan ja urakoitsijan v\u00e4lisess\u00e4 sopimuksessa tulisi olla
  urakoitsijalle vaatimus tiedottaa mets\u00e4nomistajalle ja ryhm\u00e4nvet\u00e4j\u00e4lle
  todellinen (mitattu) korjuu- ja myyntim\u00e4\u00e4r\u00e4.\\n\\n11 Sis\u00e4inen
  valvonta\\n\\n11.1. Ryhm\u00e4nvet\u00e4j\u00e4n tulee toteuttaa sis\u00e4inen valvontaj\u00e4rjestelm\u00e4,
  jonka toiminnan tiedot kirjataan muistiin ja joka sis\u00e4lt\u00e4\u00e4 ainakin
  seuraavat:\\na) kuvaus sis\u00e4isest\u00e4 valvontaj\u00e4rjestelm\u00e4st\u00e4,
  joka v\u00e4hint\u00e4\u00e4n:\\ni. takaa sovellettavan mets\u00e4nhoidon FSC-standardin
  vaatimusten yht\u00e4mittaisen t\u00e4yttymisen ryhm\u00e4n mets\u00e4talousyksik\u00f6iss\u00e4;\\nii.
  takaa ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4n ja ryhm\u00e4nvet\u00e4j\u00e4n
  toiminnan asianmukaisuuden tarkastamisen.\\nb) s\u00e4\u00e4nn\u00f6lliset (v\u00e4hint\u00e4\u00e4n
  vuosittaiset) valvontak\u00e4ynnit osaan ryhm\u00e4n mets\u00e4talousyksik\u00f6ist\u00e4;\\nc)
  s\u00e4\u00e4nn\u00f6llinen (v\u00e4hint\u00e4\u00e4n vuosittainen) analyysi sis\u00e4isen
  valvonnan tuloksista, mink\u00e4 avulla ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4\u00e4
  voidaan kehitt\u00e4\u00e4.\\n11.2 Ryhm\u00e4nvet\u00e4j\u00e4n tulee valita sovellettavasta
  mets\u00e4nhoidon FSC-standardista sis\u00e4isiss\u00e4 tarkastuksissa huomioitavat
  vaatimukset ottaen huomioon toiminnan laajuuden, intensiteetin ja riskit.\\nHUOM:
  Ryhm\u00e4nvet\u00e4j\u00e4 voi yksitt\u00e4isen sis\u00e4isen tarkastuksen aikana
  keskitt\u00e4\u00e4 valvonnan sovellettavan mets\u00e4nhoidon FSC-standardin yksitt\u00e4isiin
  osa-alueisiin sill\u00e4 ehdolla, ett\u00e4 sertifikaatin voimassaoloaikana arvioidaan
  kaikki sovellettavan mets\u00e4nhoidon FSC-standardin osa-alueet koko ryhm\u00e4n
  laajuudelta mets\u00e4talousyksik\u00f6iden otantaa arvioimalla.\\n11.3 Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee selvent\u00e4\u00e4, mitk\u00e4 ryhm\u00e4n mets\u00e4talousyksik\u00f6ist\u00e4
  lasketaan aktiivisiksi ja miten m\u00e4\u00e4ritell\u00e4\u00e4n aktiivinen ja ep\u00e4aktiivinen
  mets\u00e4nhoito.\\n\\n11.4 Mets\u00e4talousyksik\u00f6iden v\u00e4himm\u00e4ism\u00e4\u00e4r\u00e4
  vuotuisia sis\u00e4isen valvonnan tarkastusk\u00e4yntej\u00e4 varten lasketaan oheisen
  taulukon mukaisesti:\\n\\nTaulukko 1. Sis\u00e4isen valvonnan otannan laskeminen.\\n\\nJossa:
  X = tarkastettavien mets\u00e4talousyksik\u00f6iden m\u00e4\u00e4r\u00e4,\\n\\ny
  = aktiivisten tai ep\u00e4aktiivisten mets\u00e4talousyksik\u00f6iden m\u00e4\u00e4r\u00e4
  kussakin kategoriassa.\\n\\n11.5 Taulukon 1 mukaan laskettujen yksik\u00f6iden m\u00e4\u00e4r\u00e4
  (X) tulee py\u00f6rist\u00e4\u00e4 yl\u00f6sp\u00e4in seuraavaan kokonaislukuun.\\n11.6
  Ep\u00e4aktiivisia mets\u00e4talousyksik\u00f6it\u00e4 voidaan valvoa et\u00e4n\u00e4,
  mik\u00e4li tarvittavat tiedot ovat saatavilla (esim. kaukokartoitus, digitaaliset
  kuvat, puhelinhaastattelut, materiaalien ja koulutusten maksuja/myynti\u00e4/hankintaa
  koskevat asiakirjat).\\n11.7 Ryhm\u00e4nvet\u00e4j\u00e4 voi v\u00e4hent\u00e4\u00e4
  lausekkeessa 11.4 kuvattujen yksik\u00f6iden v\u00e4himm\u00e4ism\u00e4\u00e4r\u00e4\u00e4
  lausekkeen 11.1 kohdan c) mukaisen valvonnan tulosten s\u00e4\u00e4nn\u00f6llisen
  analysoinnin perusteella.\\n11.8 Ryhm\u00e4nvet\u00e4j\u00e4n tulee kasvattaa laskettua
  v\u00e4himm\u00e4ism\u00e4\u00e4r\u00e4\u00e4 silloin, kun tunnistetaan korkeampia
  riskej\u00e4 (esim. toteen n\u00e4ytetyt, ratkaisemattomat kiistat maan omistuksesta
  tai maan k\u00e4ytt\u00f6oikeudesta, uhat korkeille suojeluarvoille (\\\"HCV\\\",
  \\\"High Conservation Values\\\"), toteen n\u00e4ytetyt sidosryhmien valitukset
  yms.).\\n11.9 Ryhm\u00e4nvet\u00e4j\u00e4n tulisi sis\u00e4isen valvonnan aikana
  k\u00e4yd\u00e4 eri mets\u00e4talousyksik\u00f6iss\u00e4 kuin niiss\u00e4, joissa
  sertifiointiorganisaatio on aiemmin k\u00e4ynyt, ellei jotkin avoimet korjaavat
  toimet, valitukset tai riskitekij\u00e4t edellyt\u00e4 k\u00e4yntej\u00e4 samoissa
  yksik\u00f6iss\u00e4.\\n11.10 Ryhm\u00e4nvet\u00e4j\u00e4n tulee tehd\u00e4 pyynt\u00f6j\u00e4
  korjaavista toimista, mik\u00e4li sis\u00e4isen valvonnan aikana ilmenee poikkeamia
  vaatimustenmukaisuudessa, sek\u00e4 seurata toimien toteutusta.\\nHUOM: Poikkeamat
  ryhm\u00e4n j\u00e4senen tasolla saattavat johtaa poikkeamiin ryhm\u00e4nvet\u00e4j\u00e4n
  tasolla silloin, kun puutteet johtuvat ryhm\u00e4nvet\u00e4j\u00e4n puutteellisesta
  toiminnasta.\\n\\nLaatikko 6. Sis\u00e4inen valvonta\\n\\nRyhm\u00e4n sis\u00e4iseen
  valvontaan kuuluu vuotuisia maastok\u00e4yntej\u00e4 osassa ryhm\u00e4n mets\u00e4talousyksik\u00f6it\u00e4.
  Vuosittain maastok\u00e4ynneill\u00e4 valvottavien mets\u00e4talousyksik\u00f6iden
  v\u00e4himm\u00e4ism\u00e4\u00e4r\u00e4 lasketaan k\u00e4ytt\u00e4en lausekkeessa
  11.4 olevaa taulukkoa.\\n\\nRyhm\u00e4nvet\u00e4j\u00e4 voi my\u00f6s perustella
  harvemman valvontatiheyden lausekkeen 11.5 mukaisesti. T\u00e4t\u00e4 varten ryhm\u00e4nvet\u00e4j\u00e4n
  pit\u00e4\u00e4 analysoida sis\u00e4isen valvonnan tulokset. Analyysin perusteella
  ryhm\u00e4nvet\u00e4j\u00e4 voi kehitt\u00e4\u00e4 ryhm\u00e4n hallintoj\u00e4rjestelm\u00e4\u00e4
  ja mukauttaa sis\u00e4isen valvonnan toimia olosuhteisiin sopiviksi.\\n\\nRyhm\u00e4nvet\u00e4j\u00e4n
  pit\u00e4\u00e4 pysty\u00e4 osoittamaan sertifiointiorganisaatiolle, ett\u00e4 ryhm\u00e4lle
  laaditut sis\u00e4isen valvonnan menetelm\u00e4t mahdollistavat sen todentamisen,
  ett\u00e4 ryhm\u00e4n mets\u00e4talousyksik\u00f6t noudattavat sovellettavan mets\u00e4nhoidon
  FSC-standardin vaatimuksia, ja ett\u00e4 poikkeamat niiden noudattamisessa tunnistetaan.\\n\\nSis\u00e4isen
  valvonnan tulosten analyysin perusteella ryhm\u00e4nvet\u00e4j\u00e4n on mahdollisesti
  tarkastettava useampi yksikk\u00f6 kuin lauseke 11.4 edellytt\u00e4\u00e4. Useampaa
  tarkastusta edellytet\u00e4\u00e4n, mik\u00e4li ryhm\u00e4ss\u00e4 ilmaantuu korkean
  riskin tilanteita, joista kerrotaan tarkemmin lausekkeessa 11.8.\\n\\n12 Alkuper\u00e4ketju
  (\\\"Chain of Custody\\\", \\\"CoC\\\")\\n\\n12.1. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee toteuttaa FSC-sertifioitujen tuotteiden j\u00e4ljitt\u00e4mis- ja seurantaj\u00e4rjestelm\u00e4,
  jolla varmistetaan, etteiv\u00e4t tuotteet sekoitu sertifioimattomiin raakaaineisiin.\\n12.2.
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee varmistaa, ett\u00e4 kaikki laskut FSC-sertifioitujen
  raaka-aineiden myynnist\u00e4 sis\u00e4lt\u00e4v\u00e4t vaaditut tiedot (sovellettavan
  mets\u00e4nhoidon FSC-standardin mukaisesti).\\n12.3. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee varmistaa, ett\u00e4 sertifiointiorganisaatio on etuk\u00e4teen hyv\u00e4ksynyt
  kaiken FSC-tavaramerkkien k\u00e4yt\u00f6n.\\n12.4. Ryhm\u00e4nvet\u00e4j\u00e4n
  ei tule antaa j\u00e4senilleen mink\u00e4\u00e4nlaisia sertifikaatteja, jotka voitaisiin
  sekoittaa FSC-sertifikaatteihin.\\n\\nHUOM: Mik\u00e4li ryhm\u00e4n j\u00e4sen haluaa
  todistaa, ett\u00e4 tietyt mets\u00e4talousyksik\u00f6t ovat ryhm\u00e4sertifioituja,
  h\u00e4n voi k\u00e4ytt\u00e4\u00e4 listaa ryhm\u00e4n j\u00e4senist\u00e4 tai sertifiointiorganisaation
  antamaa j\u00e4sensertifikaattia. On t\u00e4rke\u00e4\u00e4, ettei mit\u00e4\u00e4n
  n\u00e4ist\u00e4 asiakirjoista sekoiteta ryhm\u00e4nvet\u00e4j\u00e4n hallussa olevaan
  ryhm\u00e4n FSC-sertifikaattiin.\\n\\nLaatikko 7. Ekosysteemipalvelut\\n\\nRyhm\u00e4nvet\u00e4j\u00e4
  tai osa ryhm\u00e4n j\u00e4senist\u00e4/kaikki ryhm\u00e4n j\u00e4senet voivat halutessaan
  k\u00e4ytt\u00e4\u00e4 ekosysteemipalvelumenettely\u00e4 (FSC-PRO-30-006 Ecosystem
  Services Procedure: Impact Demonstration and Market Tools) mets\u00e4talousyksik\u00f6iss\u00e4\u00e4n,
  mik\u00e4li ryhm\u00e4 on FM- tai FM/CoC-sertifioitu.\\n\\nTeknisi\u00e4 lis\u00e4tietoja
  siit\u00e4, miten ekosysteemipalvelumenettely\u00e4 voi k\u00e4ytt\u00e4\u00e4 ekosysteemipalvelumarkkinoille
  p\u00e4\u00e4syn helpottamiseksi, l\u00f6ytyy FSC-GUI-30-006 Guidance for Demonstrating
  Ecosystem Services Impacts asiakirjasta.\\n\\nOSA III Mets\u00e4alan urakoitsijoiden
  valinnainen mukaan ottaminen ryhmiin\\n\\n13 Vaatimukset mets\u00e4alan urakoitsijoiden
  ominaisuuksista\\n\\n13.1. Mets\u00e4alan urakoitsijat voivat liitty\u00e4 ainoastaan
  FSC FM/CoC-ryhm\u00e4\u00e4n.\\nHUOM: Mets\u00e4alan urakoitsijat voivat liitty\u00e4
  useampaan kuin yhteen ryhm\u00e4\u00e4n. Ne voivat toimia FSC-ryhm\u00e4sertifikaatin
  alaisuudessa, mutta vain niiden ryhmien mets\u00e4talousyksik\u00f6iss\u00e4, joihin
  ovat liittyneet.\\nHUOM. 2: Mets\u00e4alan urakoitsijoilla voi olla erillinen CoC-sertifikaatti
  ryhm\u00e4n ulkopuolisissa mets\u00e4talousyksik\u00f6iss\u00e4 toimimiseen.\\nHUOM.
  3: Kun parhaillaan meneill\u00e4\u00e4n oleva Kontrolloidun puun standardin (FSC-STD30-010
  V2-0 FSC Controlled Wood Standard for Forest Management Enterprises) tarkastaminen
  on valmis, t\u00e4m\u00e4 lauseke tarkistetaan sen m\u00e4\u00e4ritt\u00e4miseksi,
  voisivatko mets\u00e4alan urakoitsijat liitty\u00e4 my\u00f6s CW/FM-ryhmiin.\\n13.2.
  Ryhm\u00e4nvet\u00e4j\u00e4 voi jakaa vastuita sovellettavan mets\u00e4nhoidon FSC-standardin
  noudattamisesta ryhm\u00e4\u00e4n kuuluville mets\u00e4alan urakoitsijoille lausekkeen
  3.1 mukaisesti.\\n13.3. Jokaisen ryhm\u00e4n j\u00e4seneksi pyrkiv\u00e4n mets\u00e4alan
  urakoitsijan tulee allekirjoittaa sopimus, jossa urakoitsijan tulee:\\na) sitoutua
  noudattamaan sovellettavaa mets\u00e4nhoidon FSC-standardia ja ryhm\u00e4n s\u00e4\u00e4nt\u00f6j\u00e4
  sek\u00e4 vakuuttaa, ett\u00e4 mahdolliset aliurakoitsijat noudattavat niit\u00e4
  my\u00f6s;\\nb) luvata, ett\u00e4 antaa ryhm\u00e4nvet\u00e4j\u00e4n, sertifiointiorganisaation,
  FSC:n ja ASI:n hoitaa niiden velvollisuudet;\\nc) suostua siihen, ett\u00e4 ryhm\u00e4nvet\u00e4j\u00e4
  on sertifioinnin p\u00e4\u00e4asiallinen yhteyshenkil\u00f6;\\nd) sitoutua mets\u00e4alan
  urakoitsijan ja ryhm\u00e4nvet\u00e4j\u00e4n v\u00e4lill\u00e4 sovittuihin ehtoihin.\\n\\n14
  Ryhm\u00e4n s\u00e4\u00e4nn\u00f6t urakoitsijoille\\n\\n14.1. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee muuttaa ryhm\u00e4n s\u00e4\u00e4nt\u00f6j\u00e4 niin, ett\u00e4 niiss\u00e4
  huomioidaan mets\u00e4alan urakoitsijan rooli.\\n14.2. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee m\u00e4\u00e4ritell\u00e4, miten mets\u00e4alan urakoitsija raportoi ryhm\u00e4nvet\u00e4j\u00e4lle
  mets\u00e4taloustoimiensa tyypist\u00e4 (esim. korjuu, istuttaminen, mets\u00e4nhoitosuunnitelma),
  sijainnista (ryhm\u00e4n mets\u00e4talousyksik\u00f6t) ja tuloksista (esim. korjatun
  puun m\u00e4\u00e4r\u00e4, istutettujen taimien m\u00e4\u00e4r\u00e4, laaditut asiakirjat).\\n\\n15
  Uusien mets\u00e4alan urakoitsijoiden arviointi\\n\\n15.1. Ryhm\u00e4nvet\u00e4j\u00e4n
  tulee ennen hakemuksen hyv\u00e4ksynt\u00e4\u00e4 arvioida kukin ryhm\u00e4\u00e4n
  pyrkiv\u00e4 mets\u00e4alan urakoitsija seuraavasti:\\n15.1.1. tekem\u00e4ll\u00e4
  kentt\u00e4arviointi jossain mets\u00e4talousyksik\u00f6ss\u00e4 ja/tai\\n15.1.2.
  varmistamalla, ett\u00e4 urakoitsijalla on riitt\u00e4v\u00e4 p\u00e4tevyys tai
  osaaminen ty\u00f6skennell\u00e4kseen sovellettavan mets\u00e4nhoidon FSC-standardin
  mukaisesti ja t\u00e4ytt\u00e4\u00e4kseen velvollisuutensa ryhm\u00e4ss\u00e4.\\n15.2.
  Mik\u00e4li mets\u00e4alan urakoitsija haluaa vaihtaa toiseen, saman ryhm\u00e4nvet\u00e4j\u00e4n
  johtamaan ryhm\u00e4\u00e4n, ryhm\u00e4nvet\u00e4j\u00e4 tekee samanlaisen arvioinnin
  siirron mahdollistamiseksi.\\n\\n16 Urakoitsijoiden tietorekisteri\\n\\n16.1. Kun
  mets\u00e4alan urakoitsijoita otetaan ryhm\u00e4\u00e4n mukaan, ryhm\u00e4nvet\u00e4j\u00e4n
  tulee yll\u00e4pit\u00e4\u00e4 p\u00e4ivitetty\u00e4 tietorekisteri\u00e4, josta
  l\u00f6ytyy seuraavat tiedot:\\na) nimi ja yhteystiedot;\\n\\nMets\u00e4nhoidon
  FSC-ryhm\u00e4standardi\\n\\nb) ryhm\u00e4\u00e4n liittymisen p\u00e4iv\u00e4m\u00e4\u00e4r\u00e4
  ja, mik\u00e4li sovellettavissa, ryhm\u00e4st\u00e4 eroamisen p\u00e4iv\u00e4m\u00e4\u00e4r\u00e4
  sek\u00e4 syy ryhm\u00e4st\u00e4 eroamiseen;\\nc) tiedot ryhm\u00e4nvet\u00e4j\u00e4n
  tarjoamasta koulutuksesta;\\nd) urakoitsijoiden ty\u00f6n laadunvalvonnan tulokset,
  jotka on saatu otannalla tehdyill\u00e4 valvontak\u00e4ynneill\u00e4 (lauseke 17.1)
  ja kohdistetulla sis\u00e4isell\u00e4 tarkastuksella (lauseke 18.1.);\\ne) mik\u00e4li
  sovellettavissa: v\u00e4hint\u00e4\u00e4n vuosittaiset tiedot korjuu- ja myyntim\u00e4\u00e4rist\u00e4,
  jotka urakoitsija on toteuttanut ryhm\u00e4sertifioinnin alaisuudessa.\\n\\n17 Sis\u00e4inen
  valvonta, kun ryhm\u00e4ss\u00e4 on urakoitsijoita\\n\\n17.1. Sellaisissa mets\u00e4talousyksik\u00f6iss\u00e4,
  joissa palveluita ostetaan vain ryhm\u00e4\u00e4n kuuluvilta urakoitsijoilta, ryhm\u00e4nvet\u00e4j\u00e4n
  tulee noudattaa t\u00e4m\u00e4n standardin osiota 11. Lausekkeen 11.4 taulukon 1
  sijaan lasketaan sis\u00e4isesti valvottavien mets\u00e4talousyksik\u00f6iden v\u00e4himm\u00e4ism\u00e4\u00e4r\u00e4
  kuitenkin taulukon 2 mukaan:\\n\\nTaulukko 2: Sis\u00e4isen valvonnan k\u00e4yntien
  v\u00e4himm\u00e4ism\u00e4\u00e4rien laskeminen silloin, kun ryhm\u00e4ss\u00e4
  on urakoitsijoita.\\n\\nJossa: X = tarkastettavien mets\u00e4talousyksik\u00f6iden
  m\u00e4\u00e4r\u00e4,\\n\\ny = aktiivisten tai ep\u00e4aktiivisten mets\u00e4talousyksik\u00f6iden
  m\u00e4\u00e4r\u00e4 kussakin kategoriassa.\\n\\n18 Urakoitsijoiden sis\u00e4inen
  valvonta\\n\\n18.1. Ryhm\u00e4nvet\u00e4j\u00e4n tulee tehd\u00e4 kaikille ryhm\u00e4\u00e4n
  kuuluville mets\u00e4alan urakoitsijoille kohdistettu sis\u00e4inen tarkastus v\u00e4hint\u00e4\u00e4n
  kerran sertifikaatin voimassaolon aikana.\\nHUOM: Urakoitsijoiden kohdistettu sis\u00e4inen
  tarkastus tehd\u00e4\u00e4n vuotuisen otannalla valittujen mets\u00e4talousyksik\u00f6iden
  sis\u00e4isen (lausekkeen 17.1 mukaisen) valvonnan lis\u00e4ksi. Sis\u00e4isen tarkastuksen
  tarkoituksena on varmistaa, ett\u00e4 urakoitsijat pystyv\u00e4t riitt\u00e4v\u00e4n
  hyvin t\u00e4ytt\u00e4m\u00e4\u00e4n ryhm\u00e4nvet\u00e4j\u00e4n heille m\u00e4\u00e4r\u00e4\u00e4m\u00e4t
  velvollisuudet (esim. suunnittelu, uusien j\u00e4senten arviointi, sis\u00e4inen
  valvonta, asiakirjojen laatiminen).\\n18.1.1 Ryhm\u00e4nvet\u00e4j\u00e4n tulee
  tehostaa sis\u00e4ist\u00e4 tarkastusta, mik\u00e4li tunnistetaan korkeita riskej\u00e4
  (esim. urakoitsijan toistuvat poikkeamat vaatimustenmukaisuudessa, sidosryhm\u00e4n
  j\u00e4senten toteen n\u00e4ytetyt valitukset urakoitsijan suorituksesta).\\n18.2
  Ryhm\u00e4nvet\u00e4j\u00e4n tulee tehd\u00e4 pyynt\u00f6j\u00e4 korjaavista toimista,
  mik\u00e4li urakoitsijoiden valvonnan aikana ilmenee poikkeamia vaatimustenmukaisuudessa,
  sek\u00e4 seurata niiden noudattamista.\\n\\n19 Urakoitsijoiden alkuper\u00e4ketju\\n\\n19.1
  Mets\u00e4alan urakoitsijan tulee pit\u00e4\u00e4 kirjaa vuotuisista ryhm\u00e4sertifikaatin
  alaisista korjuu- ja FSC-myynnin m\u00e4\u00e4rist\u00e4.\\n19.2 N\u00e4m\u00e4
  tiedot tulee v\u00e4litt\u00e4\u00e4 ryhm\u00e4nvet\u00e4j\u00e4lle.\\n19.3 Mets\u00e4alan
  urakoitsijoiden tulee varmistaa, ett\u00e4 kaikki laskut FSC-sertifioitujen raakaaineiden
  myynnist\u00e4 sis\u00e4lt\u00e4v\u00e4t vaaditut tiedot (sovellettavan mets\u00e4nhoidon
  FSC-standardin mukaisesti), ja toimittaa laskujen kopiot ryhm\u00e4nvet\u00e4j\u00e4lle.\\n\\n19.4
  Myydess\u00e4\u00e4n FSC-sertifioituja raaka-aineita, urakoitsijan tulee k\u00e4ytt\u00e4\u00e4
  laskuissa sen ryhm\u00e4n sertifikaattikoodia, mist\u00e4 materiaalit ovat l\u00e4ht\u00f6isin.\\n\\nLaatikko
  8. Mets\u00e4alan urakoitsijat ryhm\u00e4ss\u00e4\\n\\nMets\u00e4alan urakoitsijoita
  voidaan ottaa ryhm\u00e4sertifikaatin alaisuuteen noudattamalla t\u00e4m\u00e4n
  standardin Osassa III lueteltuja vaatimuksia. Urakoitsijoiden mukaan ottaminen on
  vapaaehtoista, ja siit\u00e4 on joitain hy\u00f6tyj\u00e4:\\n\\n- sis\u00e4isen
  valvonnan kevent\u00e4minen sellaisissa mets\u00e4talousyksik\u00f6iss\u00e4, joissa
  mets\u00e4nhoitopalveluita ostetaan vain ryhm\u00e4\u00e4n kuuluvilta urakoitsijoilta,\\n-
  mets\u00e4nhoidon toimenpiteisiin liittyvien riskien mahdollinen pieneneminen k\u00e4ytt\u00e4m\u00e4ll\u00e4
  ryhm\u00e4nvet\u00e4j\u00e4n kouluttamia ja valvomia urakoitsijoita,\\n- p\u00e4\u00e4syn
  tarjoaminen FM/CoC-ryhmien alkuper\u00e4ketjuj\u00e4rjestelm\u00e4\u00e4n mets\u00e4alan
  urakoitsijoille esimerkiksi seuraavin tavoin:\\nA. Ryhm\u00e4\u00e4n kuuluva mets\u00e4alan
  urakoitsija voi ostaa FSC-sertifioituja raaka-aineita usealta ryhm\u00e4n j\u00e4senelt\u00e4
  ja myyd\u00e4 ne yhdess\u00e4 ryhm\u00e4nvet\u00e4j\u00e4lle. Ryhm\u00e4nvet\u00e4j\u00e4
  voi sitten myyd\u00e4 raaka-aineet \\\"mets\u00e4n portin\\\" ulkopuolelle (ryhm\u00e4n
  toimijoiden ulkopuolelle). Kaikki n\u00e4m\u00e4 toimet kuuluisivat ryhm\u00e4sertifioinnin
  piiriin, eik\u00e4 urakoitsijan tarvitsisi hankkia erillist\u00e4 CoC-sertifikaattia.
  FSC-sertifioitujen raaka-aineiden myyntim\u00e4\u00e4rist\u00e4 tulee pit\u00e4\u00e4
  kirjaa.\\nB. Mets\u00e4alan urakoitsija ostaa puuta (tai luonnontuotteita) yhdelt\u00e4
  ryhm\u00e4n j\u00e4senelt\u00e4 ja myy sen joko ryhm\u00e4n sis\u00e4ll\u00e4 tai
  ulkopuolelle. N\u00e4m\u00e4 toimet kuuluisivat ryhm\u00e4sertifioinnin piiriin
  (eik\u00e4 urakoitsijan tarvitsisi hankkia erillist\u00e4 CoC-sertifikaattia).\\nC.
  Urakoitsija X, joka kuuluu ryhm\u00e4\u00e4n Y, myy FSC-sertifioituja raaka-aineita
  urakoitsija A:lle, joka kuuluu ryhm\u00e4\u00e4n B. Urakoitsija X voi myyd\u00e4
  raaka-aineita oman ryhm\u00e4sertifikaattinsa alaisuudessa, sill\u00e4 raakaaineet
  tulevat ryhm\u00e4st\u00e4 Y. Urakoitsija A tarvitsisi erillisen CoC-sertifikaatin
  pit\u00e4\u00e4kseen urakoitsija X:n raakaaineet FSC-sertifioituina, sill\u00e4
  sen ostamat raaka-aineet eiv\u00e4t tule sen omasta ryhm\u00e4st\u00e4. HUOM. Urakoitsija
  tarvitsee erillisen CoC-sertifikaatin vain, jos raaka-aineiden omistus siirtyy h\u00e4nelle.
  Muussa tapauksessa urakoitsijan ty\u00f6n vaatimustenmukaisuudesta vastaa ryhm\u00e4nvet\u00e4j\u00e4.\\n\\nMik\u00e4li
  ryhm\u00e4\u00e4n kuuluva mets\u00e4alan urakoitsija haluaa ty\u00f6skennell\u00e4
  ryhm\u00e4n ulkopuolisissa mets\u00e4talousyksik\u00f6iss\u00e4, se tarvitsee oman
  erillisen CoC-sertifikaatin pit\u00e4\u00e4kseen ryhm\u00e4n ulkopuolisista mets\u00e4talousyksik\u00f6ist\u00e4
  tulevat raaka-aineet FSC-sertifioituina.\\n\\nKoskien FSC-sertifioitujen raaka-aineiden
  myymist\u00e4 ja laskuissa k\u00e4ytett\u00e4v\u00e4\u00e4 sertifikaattikoodia:
  kun mets\u00e4alan urakoitsija kuuluu useampaan kuin yhteen ryhm\u00e4\u00e4n, urakoitsija
  voi:\\n\\n- pit\u00e4\u00e4 hallussaan omaa, erillist\u00e4 CoC-sertifikaattia niin,
  ett\u00e4 urakoitsija voi ottaa ostetuista raaka-aineista omistusoikeuden ja sekoittaa
  usealta ryhm\u00e4lt\u00e4 ostettuja raaka-aineita, tai\\n- mik\u00e4li urakoitsija
  haluaa toimia ryhm\u00e4sertifikaatin alaisuudessa, sen t\u00e4ytyy pit\u00e4\u00e4
  raaka-aineet erill\u00e4\u00e4n ja seurata niit\u00e4 k\u00e4ytt\u00e4en ryhmien
  CoC-seurantaj\u00e4rjestelmi\u00e4.\\n\\nMets\u00e4alan urakoitsijat voivat jatkaa
  ryhmiss\u00e4 ty\u00f6skentely\u00e4 ilman, ett\u00e4 ne kuuluvat ryhm\u00e4sertifikaatin
  (/-sertifikaattien) piiriin. Siin\u00e4 tapauksessa urakoitsijan ei tarvitse noudattaa
  t\u00e4m\u00e4n standardin Osan III vaatimuksia, eik\u00e4 se kuuluisi ryhm\u00e4sertifikaatin
  piiriin, eli se tarvitsisi oman, erillisen CoC-sertifikaatin.\\n\\nHUOM. Urakoitsija
  tarvitsee erillisen CoC-sertifikaatin vain, jos raaka-aineiden omistus siirtyy h\u00e4nelle.
  Muussa tapauksessa urakoitsijan ty\u00f6n vaatimustenmukaisuudesta vastaa ryhm\u00e4nvet\u00e4j\u00e4.\\n\\nAlla
  olevissa kuvissa on joitain esimerkkej\u00e4 siit\u00e4, miten mets\u00e4alan urakoitsijat
  voivat olla osa ryhm\u00e4\u00e4/ryhmi\u00e4:\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\nResurssip\u00e4\u00e4llikk\u00f6\\nRMU\\n\\nYksi
  urakoitsija ryhm\u00e4ss\u00e4\\n\\nRMU\\nRyhm\u00e4nvet\u00e4j\u00e4\\n\\nRyhm\u00e4ss\u00e4
  yksi urakoitsija, joka toimii resurssip\u00e4\u00e4llikk\u00f6n\u00e4\\n\\nRyhm\u00e4ss\u00e4
  resurssip\u00e4\u00e4llik\u00f6n ohjauksessa toimiva urakoitsija\\n\\nRyhm\u00e4nvet\u00e4j\u00e4\\n\\nRyhm\u00e4ss\u00e4
  useita urakoitsijoita\\n\\nMets\u00e4talousyksikk\u00f6\\nMets\u00e4alan urakoitsija\\n\\nwww.fsc.org\\n\\nFSC
  International Center gGmbH Adenauerallee 134 \u00b7 53113 Bonn \u00b7 Germany\\n\\nJ\u00e4lkipainos
