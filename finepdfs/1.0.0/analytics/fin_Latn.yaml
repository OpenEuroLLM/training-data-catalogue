  Raija Tuomi, Maija-Liisa Rautianen, Raili Katajam\u00e4ki, Anne Lentonen, Arja Koski,
  Leena Toivio\\n\\nKirja-, koru-, huivi- ja laukkukirppis Hylykalliolla\\n\\nKiinnostako
  kirjojen kautta avautua toinen maailma? Haetaan lukumata kauneutta ja n\u00e4ytt\u00e4vyytt\u00e4
  tai k\u00e4ytettykolpoina suurta ja tuijottavaa? Pirist\u00e4ko pulaa, hankkia kirjallisia
  huvia vaille korulla?\\n\\nJos vastaat yhteenkymmenkseen kyll\u00e4, kannattaa tulla
  viett\u00e4m\u00e4\u00e4n lauantai 14. maaliskuuta l\u00f6yt\u00f6jen parin. Hylykallion
  seura-kuntakodilla j\u00e4rjestet\u00e4\u00e4n taas kirja-, koru-, laukku-, huivikirppis
  Yhteisvastuukierr\u00e4yksess\u00e4. Viimekarreisena kirppiksen verrattuna uutena
  tulokseena on nyt huivit. Viini-, vuo- ja korukirppis on johtanut Yhteisvastuukierr\u00e4yksess\u00e4
  1. 100 \u20ac. Kirppus toimii n\u00e4in sek\u00e4 tevarin kier\u00e4ytt\u00e4misess\u00e4
  ett\u00e4 hyvin tekemisess\u00e4.\\n\\nLahjoituksia otetaan vastaan. Jos sinulta
  l\u00f6ytyy huvikontakirjoja (ei tietosanakirjoja eik\u00e4 Valitutten Palojen kirjavaloita),
  koruja, laukkuja tai huiveja, voit tuoda niit\u00e4 Hylykallion sirk-kodille perjantaina
  13.3. saakka. Voit osoittaa my\u00f6s yhteyst\u00e4 tarvittaessa. Katso yhteystiedot
  Yhteisvastuukierr\u00e4yksess\u00e4, puh. 050 369 7755 tai Saima Kurkkoon, puh.
  050 468 3730.\\n\\nKirja-, koru-, laukku- ja huivikirppis on Hylykallion sirk-kodilta
  la 14.3. klo 12\u201315. Hylykammalla hoitaa kalvituksen. Pulallakivit voi ostaa
  2 euron hintaan.\\n\\nPer\u00e4sein\u00e4joen Yhteisvastuu-ker\u00e4j\u00e4t\\n\\nYhteisvastuu-ker\u00e4j\u00e4t
