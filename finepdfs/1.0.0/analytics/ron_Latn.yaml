  a rectificarea bugetului local de venituri \u0219i cheltuieli al comunei Mereni
  pe Trimestrul IV al anului 2021;\\n- Raportul de specialitate nr. 4601 din 13.10.2021
  al compartimentului contabilitate, privind rectificarea bugetului local pe Trimestrul
  IV, anul 2021;\\n- Raportul compartimentului contabilitate nr. 4602 din 13.10.2021,
  propus ca Anexa nr. 1 la Proiectul de hotarare;\\n- Dispozi\u021bia primarului comunei
  Mereni nr. 122 / 05.10.2021 privind rectificarea bugetului local de venituri \u0219i
  cheltuieli pe anul 2021 al comunei Mereni, jude\u021bul Constan\u021ba, trimestrul
  IV;\\n- Hot\u0103r\u00e2rea Consiliului Local Mereni nr. 32 din 27.05.2021, privind
  aprobarea bugetului de venituri \u0219i cheltuieli propriu al comunei Mereni pe
  anul 2021;\\n- Hot\u0103rarea Consiliului Local al comunei Mereni nr. 31 din 07.05.2021
  privind aprobarea listei de investi\u021bii a U.A.T. comuna Mereni pentru anul 2021;\\n\\nLu\u00e2nd
  \u00een considerare:\\n\\n- art. 129 alin. (2) lit. a), b) \u0219i d), alin. (4)
  lit. a), alin. (5) pct. d) \u0219i alin. (7) lit. b) \u0219i n) din Ordonan\u021ba
  de urgen\u021b\u0103 a Guvernului nr. 57/2019 privind Codul administrativ;\\n- art.
  19 din Legea finan\u021belor publice locale nr. 273/2006, cu modific\u0103rile \u0219i
  complet\u0103rile ulterioare;\\n- Legii bugetului de stat nr. 15/2021, sectiuna
  2 \u2013 Dispozitii referitoare la bugetele locale pe anul 2021;\\n\\nFiind \u00eendeplinite
  prevederile cuprinse la art. 136 \u0219i la art. 139 din Ordonan\u021ba de urgen\u021b\u0103
  a Guvernului nr. 57/2019 privind Codul administrativ;\\n\\n\u00cen temeiul competen\u021belor
  stabilite prin art. 129 alin.1, alin.2 lit. b si alin 4 lit. a, in baza art. 196
  alin. (1) lit. a) din Ordonan\u021ba de urgen\u021b\u0103 a Guvernului nr. 57/2019
  privind Codul administrativ;\\n\\nSE PROPUNE:\\n\\nArt. I. Aprobarea rectificari
