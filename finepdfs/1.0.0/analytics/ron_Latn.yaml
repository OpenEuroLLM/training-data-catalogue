  propor\u021bional cu gradul de realizare a veniturilor.\\n\\nArt. 3. \u2014 Se aprob\u0103
  bugetul proiectelor cu finan\u021bare din fonduri externe nerambursabile, prev\u0103zut
  \u00een anexa nr. 2.\\n\\nArt. 4. \u2014 Anexele nr. 1 \u0219i 2 fac parte integrant\u0103
  din prezentul ordin.\\n\\nArt. 5. \u2014 Autoritatea Na\u021bional\u0103 de Reglementare
  \u00een Domeniul Energiei r\u0103spunde de modul de formare, administrare, angajare
