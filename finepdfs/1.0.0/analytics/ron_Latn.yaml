  2021\\n\\nConsiliul Local al comunei Mereni \u00eentrunit \u00een \u0219edin\u021b\u0103
  ordinar\u0103 la data de 23.09.2021,\\n\\nAv\u00e2nd \u00een vedere:\\n\\n- Referatul
