  "\"Dinastia Goryeo: Imparatul Mokjong\\n\\nKoreaFilm.ro\\nPrimul site romanesc dedicat
  cinematografiei si culturii coreene\\nhttp://koreafilm.ro/blog\\n\\nMokjong (980
  - 1009) (a domnit \u00een perioada 997 - 1009) a fost al saptelea domnitor al Dinastiei
  Goryeo din Coreea. El a fost precedat de Imparatul Seongjong \u0219i succedat de
  Imparatul Hyeonjong.\\n\\nDomnia Printul Wang Song a urcat pe tron \u00een anul
  997, imediat dup\u0103 moartea fostului \u00eemp\u0103rat Seongjong.\\n\\nImparatul
  Mokjong este cunoscut pentru reforma sa din Jeonsigwa (sistemul de alocare a terenurilor
  agricole) \u0219i pentru complotul mamei lui, Regina Honae, \u0219i al lui Kim Chi-yang
  \u00eempotriva sa.\\n\\n\u00cen cursul acestor evenimente turbulente, Imparatul
  Mokjong a fost detronat de c\u0103tre generalul Gang Jo \u0219i trimis \u00een exil
  \u00een Chungju. Cu toate acestea, el a fost ucis \u00eenainte de a ajunge acolo.\\n\\nMormantul
  Imparatului Mokjong este cunoscut sub numele de Gongneung, dar locatia sa actuala
  nu este stiuta.\\n\\nPortretizarea in drame Imparatul Mokjong este interpretat \u00een
  drama istoric\u0103 \\\"Cheon Chu Taehu\\\"/\\\"Imparateasa Chunchu\\\"/\\\"Empress
  Chunchu\\\"/\\\"The Iron Empress\\\" de actorul Lee In.\\n\\nKoreaFilm.ro\\nPrimul
  site romanesc dedicat cinematografiei si culturii coreene\\nhttp://koreafilm.ro/blog\\n\\nSursa:
  Wikipedia Urmeaza Imparatul Hyeonjong.\"", "\"bombarda\u0163i de alegeri \u015fi
  v\u0103 vor oferi r\u0103spunsuri simple la \u00eentreb\u0103ri care \u00eei deruteaz\u0103
  pe cei \u00eenv\u0103\u0163a\u0163i \u015fi pe cei care cred c\u0103 sunt \u00een\u0163elep\u0163i.\\n\\nCei
  care se bazeaz\u0103 exclusiv pe ei\u00a0\u00een\u015fi\u015fi \u015fi \u00ee\u015fi
  urmeaz\u0103 propriile do\u00ad rin\u0163e \u015fi porniri sunt at\u00e2t de limita\u0163i
  \u00een compara\u0163ie cu cei care \u00cel urmeaz\u0103 pe Dumnezeu \u015fi apeleaz\u0103
  la \u00eenv\u0103\u0163\u0103tura, puterea \u015fi darurile Sale. Se spune c\u0103
  cineva care este preocupat doar de sine \u00eensu\u015fi este o persoan\u0103 cu
  un caracter mic. Supunerea deplin\u0103 \u015fi proactiv\u0103 nu este deloc ceva
  slab \u015fi pasiv. Este felul \u00een care ne declar\u0103m credin\u0163a \u00een
  Dumnezeu \u015fi devenim demni pentru a primi puterile cerului. Supunerea este o
  alegere. Este o ale\u00ad gere \u00eentre cunoa\u015fterea \u015fi puterea noas\u00ad
  tr\u0103 limitat\u0103 \u015fi \u00een\u0163elepciunea nelimitat\u0103 \u015fi puterea
  infinit\u0103 ale lui Dumnezeu. Conform lec\u0163iei pe care bunicul meu mi-\u00ada
  dat-\u00ado, este alegerea de a sim\u0163i z\u0103bala spiritual\u0103 \u00een gura
  noastr\u0103 \u015fi a\u00a0urma \u00eendrumarea conduc\u0103torului.\\n\\nPrea
  des ne g\u00e2ndim c\u0103 supunerea presupune ascultarea unor ordine sau a unor
  porunci ale unei autorit\u0103\u0163i \u00eenalte \u00een mod pasiv \u015fi f\u0103r\u0103
  discern\u0103\u00ad m\u00e2nt. De fapt, supunerea reprezint\u0103 credin\u0163a
  noastr\u0103 \u00een \u00een\u0163elepciunea \u015fi puterea celei mai \u00eenalte
  autorit\u0103\u0163i, care este Dumnezeu. C\u00e2nd Avraam a dat dovad\u0103 de
  credin\u0163a sa neclintit\u0103 \u015fi supunere fa\u0163\u0103 de Dumnezeu, chiar
  \u015fi c\u00e2nd a primit porunca de a-\u00ad\u015fi sacrifica propriul fiu, Dumnezeu
  l-\u00ada salvat. \u00cen mod asem\u0103n\u0103tor, c\u00e2nd ne dovedim credin\u0163a
  prin supunere, \u00een cele din urm\u0103, Dumnezeu ne va salva.\\n\\nFie ca noi
  s\u0103 devenim mo\u015ftenitorii leg\u0103m\u00e2ntului lui Avraam \u015fi urma\u015fii
  semin\u0163iei sale prin intermediul cre\u00ad din\u0163ei noastre \u015fi primind
  r\u00e2nduielile Evangheliei restaurate. V\u0103 promit c\u0103 binecuv\u00e2nt\u0103rile
  vie\u0163ii eterne sunt dis\u00ad ponibile oricui este credincios \u015fi supus.
  \u00cen numele lui Isus Hristos, amin. \u25fc\\n\\nV\u00e2rstnicul Lawrence\u00a0E.
  Corbridge\\n\\nCei \u015eaptezeci\\n\\nProfetul Joseph Smith\\n\\nRevela\u0163iile
  rev\u0103rsate asupra lui Joseph Smith sus\u0163in faptul c\u0103 el a fost profet
  al lui Dumnezeu.\\n\\nPrima Viziune\\n\\nEl este ner\u0103bd\u0103tor s\u0103 \u015ftie
  care biseric\u0103 \u00eel poate conduce spre adev\u0103r \u015fi salvare. A \u00eencercat
  aproape orice, iar acum el face apel la Biblie \u015fi cite\u015fte aceste cuvinte:
  \u201eDac\u0103 vreunuia dintre voi \u00eei lipse\u015fte \u00een\u0163elepciunea,
  s-\u00ado cear\u0103 de la Dumnezeu, care d\u0103 tuturor cu m\u00e2n\u0103 larg\u0103
  \u015fi f\u0103r\u0103 mustrare, \u015fi ea \u00eei va\u00a0fi dat\u0103\\\" 1 .\\n\\nEl
  se tot g\u00e2nde\u015fte la acest verset. Prima raz\u0103 de lumin\u0103 str\u0103bate
  \u00eentuneri\u00ad cul din mintea lui. O fi acesta r\u0103spunsul, calea de ie\u015fire
  din confuzie \u015fi obscuri\u00ad tate? Poate fi at\u00e2t de simplu? \u00centreab\u0103-\u00adL
  pe Dumnezeu \u015fi El va r\u0103spunde? \u00cen cele din urm\u0103, ajunge la concluzia
  c\u0103 trebuie, fie s\u0103-\u00adL \u00eentrebe pe Dumnezeu, fie s\u0103 r\u0103m\u00e2n\u0103
  \u00een \u00eentuneric \u015fi confuzie.\\n\\nUn t\u00e2n\u0103r cite\u015fte Biblia
  \u015fi privirea i se opre\u015fte asupra unui fragment din scriptur\u0103. Acesta
  este un moment care avea s\u0103 schimbe lumea.\\n\\n\u015ei totu\u015fi, ner\u0103bd\u0103tor
  cum este, nu d\u0103 fuga \u00eentr-\u00adun col\u0163 retras \u015fi spune o rug\u0103ciune
  \u00een grab\u0103. Are numai 14 ani dar, de\u015fi dore\u015fte s\u0103 afle r\u0103spunsul
  c\u00e2t mai repede, are grij\u0103 de felul \u00een care \u00eel\u00a0cere. Aceast\u0103
  rug\u0103ciune nu va fi una oarecare. Hot\u0103r\u0103\u015fte unde s\u0103 mearg\u0103
  \u015fi c\u00e2nd s\u0103 fac\u0103 \u00eencercarea. Se preg\u0103te\u015fte s\u0103
  vorbeasc\u0103 cu Dumnezeu.\\n\\nDescriind ce se \u00eent\u00e2mpl\u0103 dup\u0103
  aceea, el spune:\\n\\n\u015ei, apoi, sose\u015fte ziua cu pricina. Este \u201ediminea\u0163a
  unei zile frumoase, senine, la \u00eenceputul prim\u0103verii anului [1820]\\\"
  2 . Merge singur \u00eentr-\u00ado p\u0103dure lini\u015ftit\u0103 din apropiere,
  printre copacii care se \u00eenal\u0163\u0103 deasupra lui. Ajunge \u00een locul
  \u00een care stabilise dinainte s\u0103 mearg\u0103. \u00cengenuncheaz\u0103 \u015fi
  \u00eenal\u0163\u0103 dorin\u00ad \u0163ele inimii sale.\\n\\n\u201eAm v\u0103zut
  un st\u00e2lp de lumin\u0103 exact deasupra capului meu mai luminos ca str\u0103lucirea
  soarelui, care a cobor\u00e2t trep\u00ad tat p\u00e2n\u0103 c\u00e2nd a c\u0103zut
  deasupra mea\u2026\\n\\nC\u00e2nd lumina s-\u00ada oprit asupra mea,\\n\\nam v\u0103zut
  dou\u0103 Personaje, ale c\u0103ror str\u0103lucire \u015fi slav\u0103 \u00eentreceau
  orice descriere \u015fi care st\u0103teau deasupra mea, \u00een aer. Unul dintre
  ele mi-\u00ada vorbit, chem\u00e2ndu-\u00adm\u0103 pe nume, \u015fi a spus, ar\u0103t\u00e2nd
  c\u0103tre cel\u0103lalt: [Joseph,] Acesta\u00a0este\u00a0Fiul Meu Iubit. Ascult\u0103-\u00adL!\\\"
  3\\n\\nzilele noastre, au existat \u015fi vor exista \u00eentotdeauna eforturi pentru
  a \u00een\u015fela, a denatura, a se opune \u015fi a z\u0103d\u0103rnici planul
  vie\u0163ii.\\n\\nMultitudinea de revela\u0163ii\\n\\nDup\u0103 numai 24 de ani,
  Joseph Smith \u015fi fratele s\u0103u Hyrum vor muri din cauza a ceea ce a \u00eenceput
  aici.\\n\\nRevela\u0163iile rev\u0103rsate asupra lui Joseph Smith sus\u0163in faptul
  c\u0103 el a fost profet al lui Dumnezeu. S\u0103 ne g\u00e2ndim la c\u00e2teva,
  g\u00e2ndi\u0163i-\u00adv\u0103 la lumina \u015fi adev\u0103\u00ad rul revelate
  prin intermediul s\u0103u, care str\u0103lucesc \u00een contrast cu crezurile simi\u00ad
  lare din zilele lui \u015fi din zilele noastre.\\n\\nOpozi\u0163ia\\n\\n\u00cen
  prezen\u0163a adev\u0103rului, apar adesea opozi\u0163ie, critici \u015fi conflicte.
  De fiecare dat\u0103 c\u00e2nd este revelat adev\u0103rul cu privire la scopul \u015fi
  destinul omului, va exista \u00eentotdeauna o for\u0163\u0103 care s\u0103 i se
  opun\u0103. \u00cencep\u00e2nd de la Adam si Eva \u00een gr\u0103dina Edenului,
  continu\u00e2nd cu sluji\u00ad rea lui Hristos \u015fi mai departe, p\u00e2n\u0103\u00a0\u00een\\n\\nJoseph
  a povestit c\u0103, la v\u00e2rsta de 17 ani, un \u00eenger i-\u00ada spus c\u0103
  \u201enumele [s\u0103u avea s\u0103 fie] \u0163inut de bine \u015fi de r\u0103u
  printre toate na\u0163iunile,\u2026 printre toate popoarele\\\" 4 . Aceast\u0103
  profe\u0163ie uimi\u00ad toare continu\u0103 s\u0103 fie \u00eendeplinit\u0103 ast\u0103zi
  c\u00e2nd Biserica lui Isus Hristos a Sfin\u0163ilor din Zilele din Urm\u0103 s-\u00ada
  r\u0103sp\u00e2ndit \u00een toat\u0103 lumea.\\n\\n* Dumnezeu este o persoan\u0103
  indivi\u00ad dual\u0103, exaltat\u0103, un Tat\u0103 Ve\u015fnic. El este Tat\u0103l
  nostru.\\n* Dumneavoastr\u0103 sunte\u0163i mai mult dec\u00e2t un om. Sunte\u0163i
  un copil al lui Dumnezeu, Tat\u0103l Ve\u015fnic \u015fi pute\u0163i de\u00ad veni
  ca El 6 , dac\u0103 ve\u0163i avea credin\u0163\u0103 \u00een Fiul S\u0103u, v\u0103
  ve\u0163i poc\u0103i, ve\u0163i primi r\u00e2nduieli, \u00cel ve\u0163i primi pe
  Duhul Sf\u00e2nt \u015fi ve\u0163i \u00eendura p\u00e2n\u0103 la sf\u00e2r\u015fit.
  7\\n* Dumnezeu Tat\u0103l, Isus Hristos \u015fi Duhul Sf\u00e2nt sunt fiin\u0163e
  separate. 5\\n* La baz\u0103, Biserica lui Isus Hristos de ast\u0103zi este aceea\u015fi
  cu Biserica pe care a organizat-\u00ado El \u00een timpul slujirii Sale muritoare,
  cu profe\u0163i \u015fi apostoli, Preo\u0163ia lui Melhisedec \u015fi Preo\u0163ia
  le\u00ad vitic\u0103, v\u00e2rstnici, \u00eenal\u0163i preo\u0163i, diaconi, \u00eenv\u0103\u0163\u0103tori,
  episcopi \u015fi Cei \u015eaptezeci, a\u015fa cum este descris \u00een Biblie.\\n\\nC\u0103uta\u0163i-\u00adL
  pe Acela care a fost cel mai persecutat dintre to\u0163i, Unul care a \u00eent\u00e2mpinat
  cea mai mare opozi\u0163ie, a avut parte de cele mai multe provoc\u0103ri \u015fi
  a fost cel mai respins, b\u0103tut, aban\u00ad donat \u015fi r\u0103stignit, Unul
  care a cobor\u00e2t sub toate lucrurile \u015fi ve\u0163i g\u0103si adev\u0103\u00ad
  rul, pe Fiul lui Dumnezeu, Salvatorul \u00eentregii omeniri. De ce nu l-\u00adau
  l\u0103sat oamenii \u00een pace?\\n\\nApoi, c\u0103uta\u0163i-\u00adl pe cel care
  a scos la lumin\u0103 un alt testament al lui Isus Hristos \u015fi alte scripturi,
  c\u0103uta\u0163i-\u00adl pe cel care a fost instrumentul prin care plenitudinea
  Evangheliei \u015fi Biserica lui Isus Hristos au fost restaurate pe p\u0103\u00ad
  m\u00e2nt, c\u0103uta\u0163i-\u00adl \u015fi a\u015ftepta\u0163i-\u00adv\u0103 s\u0103
  g\u0103si\u0163i oameni care l-\u00adau tratat nedrept. De ce nu l-\u00adau l\u0103sat
  \u00een pace?\\n\\nDe ce? Deoarece El este adev\u0103rul, iar adev\u0103rului i
  se va opune \u00eentot\u00ad deauna cineva.\\n\\nDe ce? Deoarece el a propov\u0103duit
  adev\u0103rul, iar adev\u0103rului i se va opune \u00eentotdeauna cineva.\\n\\n*
  Dup\u0103 moartea Salvatorului \u015fi a apostolilor S\u0103i, autoritatea preo\u00ad
  \u0163iei a fost luat\u0103 de pe p\u0103m\u00e2nt \u015fi a fost restaurat\u0103,
  din nou, \u00een zilele noastre.\\n* Exist\u0103 mai mult dec\u00e2t numai rai \u015fi
  iad dup\u0103 aceast\u0103 via\u0163\u0103. Exist\u0103 grade de glorie \u015fi
  conteaz\u0103 foarte mult ceea ce facem \u00een aceast\u0103 via\u0163\u0103. 9\\n*
  Revela\u0163ia nu a \u00eencetat \u015fi cerurile nu sunt \u00eenchise. Dumnezeu
  le vorbe\u015fte profe\u0163ilor ast\u0103zi \u015fi El ne va vorbi \u015fi dumneavoastr\u0103
  \u015fi mie. 8\\n* Trebuie s\u0103 ar\u0103t\u0103m mai mult dec\u00e2t o simpl\u0103
  credin\u0163\u0103 pasiv\u0103 \u00een Hristos, trebuie s\u0103 \u201e[ne \u00eentoarcem]
  c\u0103tre [El] \u00een fiecare g\u00e2nd\\\" 10 , \u201e[s\u0103 facem] tot ceea
  ce [vom face] \u00een numele Fiului\\\" 11 , \u201es\u0103 [ne amintim] totdeauna
  de El, \u015fi s\u0103 [\u0163inem] poruncile pe care El [ni] le-\u00ada dat\u2026
  pentru ca [noi] s\u0103 [putem] avea totdeauna Spiritul S\u0103u\u00a0cu [noi]\\\"
  12 .\\n* Na\u015fterea nu a fost \u00eenceputul. A\u0163i tr\u0103it \u00eenainte
  \u00een prezen\u0163a lui Dumne\u00ad zeu \u00een calitate de fiu sau fiic\u0103
  a Sa \u015fi v-\u00ada\u0163i preg\u0103tit pentru aceast\u0103 via\u0163\u0103
  muritoare. 15\\n* Miliardele de oameni care tr\u0103iesc \u015fi\u00a0mor f\u0103r\u0103
  Evanghelie \u015fi f\u0103r\u0103 r\u00e2n\u00ad duielile necesare salv\u0103rii
  nu sunt pierdu\u0163i. Prin isp\u0103\u015firea lui Hristos, \u00eentreaga omenire
  \u201e[poate] fi [salvat\u0103] supun\u00e2ndu-\u00adse legilor \u015fi r\u00e2nduielilor
  Evangheliei\\\" 13 , care sunt adminis\u00ad trate at\u00e2t pentru cei vii, c\u00e2t
  \u015fi pentru cei mor\u0163i. 14\\n* C\u0103s\u0103toria \u015fi familia nu sunt
  conven\u00ad \u0163ii ale oamenilor care dureaz\u0103 doar p\u00e2n\u0103 c\u00e2nd
  moartea ne va desp\u0103r\u0163i. Ele sunt menite s\u0103 fie f\u0103cute ve\u015fnice
  prin leg\u0103minte pe care le facem cu Dumnezeu. Familia reprezint\u0103 tiparul
  ceresc. 16\\n\\n\u015ei aceasta este doar o parte a multi\u00ad tudinii de revela\u0163ii
  rev\u0103rsate asupra lui Joseph Smith. De unde au venit toate aceste revela\u0163ii
  care ofer\u0103 lumin\u0103 celor afla\u0163i \u00een \u00eentuneric, claritate
  celor care au \u00eendoieli \u015fi care i-\u00adau inspirat \u015fi i-\u00adau
  f\u0103cut mai buni pe milioane de oameni? Ce este mai plauzibil, c\u0103 a putut
  el s\u0103 scrie \u015fi s\u0103 propov\u0103duiasc\u0103 toate aceste lucruri sau
  c\u0103 a primit ajutorul Cerului? Scripturile care au ie\u015fit din m\u00e2inile
  lui sun\u0103 ca \u015fi cum ar fi cuvintele omului sau cuvintele lui Dumnezeu?\\n\\nConcluzie\\n\\nNu
  exist\u0103 dezacord cu privire la ceea ce a realizat Joseph Smith, numai cu privire
  la cum a f\u0103cut ceea ce a f\u0103cut \u015fi de ce. \u015ei nu sunt prea multe
  op\u0163iuni. El a fost fie un pref\u0103cut, fie un profet. Fie a f\u0103cut ceea
  ce a f\u0103cut singur, fie a primit ajutor ceresc. Uita\u0163i-\u00adv\u0103 la
  dovezi, dar uita\u0163i-\u00adv\u0103 la tot ce s-\u00ada \u00eent\u00e2mplat \u00een
  via\u0163a lui, nu numai la o singur\u0103 parte. Cel mai important,\\n\\nface\u0163i
  precum a f\u0103cut t\u00e2n\u0103rul Joseph \u015fi \u201e[cere\u0163i \u00een\u0163elepciune]
  de la Dumnezeu, care d\u0103 tuturor cu m\u00e2n\u0103 larg\u0103 \u015fi f\u0103r\u0103
  mustrare, \u015fi ea [v\u0103] va fi dat\u0103\\\" 17 . Aceasta, nu numai c\u0103
  v\u0103 va ajuta s\u0103 afla\u0163i adev\u0103rul despre Cartea lui Mormon \u015fi
  Joseph Smith, ci reprezint\u0103, de asemenea, modelul afl\u0103rii adev\u0103ru\u00ad
  lui tuturor lucrurilor. 18\\n\\nDumnezeu este Tat\u0103l nostru Ve\u015fnic \u015fi
  Isus este Hristosul. Noi \u00cei preasl\u0103vim pe Ei. Nimic nu se compar\u0103
  cu crea\u0163iile Lor, cu planul salv\u0103rii \u015fi cu sacrificiul is\u00ad p\u0103\u015fitor
  f\u0103cut de Mielului lui Dumnezeu. \u00cen aceast\u0103 dispensa\u0163ie, \u00eendeplinim
  planul Tat\u0103lui \u015fi ne bucur\u0103m de fructele isp\u0103\u015firii numai
  prin supunere fa\u0163\u0103 de legile \u015fi r\u00e2nduielile Evangheliei restau\u00ad
  rate prin intermediul profetului Joseph Smith. Depun m\u0103rturie despre Ei \u2212
  Dumnezeu, Tat\u0103l Ve\u015fnic, \u015fi Isus Hristos, Salvatorul lumii. \u015ei
  fac acest lucru \u00een numele lui Isus Hristos, amin. \u25fc\\n\\nJoseph Smith
  a fost un profet al lui Dumnezeu, la fel cum este Thomas\u00a0S. Monson ast\u0103zi.
  Prin Joseph Smith, \u201echeile \u00eemp\u0103r\u0103\u0163iei lui Dumnezeu sunt
  [din nou] \u00eencredin\u0163ate omului pe p\u0103\u00ad m\u00e2nt \u015fi\u2026
  Evanghelia se va rostogoli\u2026 a\u015fa cum piatra care se desprinde din munte,
  f\u0103r\u0103 ajutorul vreunei m\u00e2ini\u2026 p\u00e2n\u0103 c\u00e2nd umple
  tot p\u0103m\u00e2ntul\\\" 19 .\\n\\nNOTE\\n\\n2. Joseph Smith \u2013 Istorie 1:14.\\n1.
  Iacov 1:5.\\n3. Joseph Smith \u2013 Istorie 1:16\u201317.\\n5. Vezi Doctrin\u0103
  \u015fi leg\u0103minte 130:22.\\n4. Joseph Smith \u2013 Istorie 1:33.\\n6. Vezi
  Doctrin\u0103 \u015fi leg\u0103minte 50:24.\\n8. Vezi Moroni 10:3\u20135.\\n7. Vezi
  2\u00a0Nefi 31; 3\u00a0Nefi 27.\\n9. Vezi Doctrin\u0103 \u015fi leg\u0103minte 76.\\n11.
  Moise 5:8.\\n10. Doctrin\u0103 \u015fi leg\u0103minte 6:36.\\n\\n12. Doctrin\u0103
  \u015fi leg\u0103minte 20:77.\\n\\n14. Vezi Doctrin\u0103 \u015fi leg\u0103minte
  76; 128; 138.\\n13. Articolele de credin\u0163\u0103 1:3.\\n15. Vezi Doctrin\u0103
  \u015fi leg\u0103minte 49:17; 138; Moise 3:5; 6:36.\\n17. Iacov 1:5.\\n16. Vezi
  Doctrin\u0103 \u015fi leg\u0103minte 131:1\u20132; 132:5\u201333.\\n18. Vezi Moroni
  10:3\u20135.\\n19. Doctrin\u0103 \u015fi leg\u0103minte 65:2.\"", "\"EXPUNERE DE
  MOTIVE\\n\\nCandida\u021bii pentru alegerile parlamentare \u0219i alegerile locale
  ar trebui s\u0103 informeze electoratul prin declara\u021bii pe proprie r\u0103spundere
  \u00een leg\u0103tur\u0103 cu plata obliga\u021biilor fiscale ca persoane fizice
  \u0219i ca persoane juridice fa\u021b\u0103 de care candida\u021bii au calitatea
  de asociat sau membru \u00een consiliul de administra\u021bie.\\n\\nEste necesar\u0103
  \u0219i aprecierea comportamentului candida\u021bilor fa\u021b\u0103 de prevederile
  legilor fiscale pentru c\u0103, adesea, sunt alese \u00een func\u021bii publice
  persoane care nu respect\u0103 minima cerin\u021b\u0103 de a-\u0219i pl\u0103ti,
  pentru ei, pentru firmele proprii sau pentru cele conduse de ei, d\u0103riile obligatorii
  c\u0103tre statul pe care pretind c\u0103 vor s\u0103 \u00eel serveasc\u0103.\\n\\nAlegerile
  din anul 2012 au ar\u0103tat c\u0103 mul\u021bi candida\u021bi pentru alegerile
  parlamentare sau alegerile locale care aveau probleme de integritate au fost sus\u021binu\u021bi
  de partidele politice din care f\u0103ceau parte \u0219i chiar au fost alesi, uneori
  cu majorit\u0103\u021bi confortabile de voturi.\\n\\nDe multe ori, nici membrii
  de r\u00e2nd ai partidelor respective, nici conducerile lor \u0219i, cu at\u00e2t
  mai pu\u021bin, elecroatul nu cuno\u0219teau problemele de integritate ale acestor
  persoane.\\n\\nInteresul na\u021bional cere ca \u00een func\u021biile publice s\u0103
  fie promova\u021bi numai oameni integrii \u0219i competen\u021bi \u0219i, cum fiecare
  partid afirm\u0103 c\u0103 este c\u0103l\u0103uzit de interesul na\u021bional \u0219i
  nu de cel de grup sau personal, instituirea unui filtru sever privind candida\u021bii
  la nivelul fiec\u0103rui partid \u00eenainte de promovarea acestora, pare c\u0103
  ar fi de dorit de toate forma\u021biunile politice \u0219i, cu siguran\u021b\u0103,
  ar fi benefic pentru statul rom\u00e2n.\\n\\nIntegritatea \u0219i compatibilitatea
  cu func\u021biile elective poate fi apreciat\u0103 dup\u0103 comportamentul fiec\u0103rei
  persoane legat de cerin\u021bele statului fa\u021b\u0103 de cet\u0103\u021benii
  s\u0103i. Legile alegerilor locale \u0219i parlamentare cer ca fiecare candidat
  s\u0103 depun\u0103 o declara\u021bie de avere \u0219i o declara\u021bie de interese.
  Pe baza acestor declara\u021bii se poate aprecia compatibilitatea persoanelor respective
  cu func\u021biile publice, pentru a se evita alegerea persoanelor care pot abuza
  de func\u021bie \u00een interes propriu.\\n\\nEste necesar\u0103 modificarea legii
  pentru alegerile parlamentare \u0219i alegerile locale pentru ca s\u0103 fie furnizat\u0103
  o declara\u021bie pe proprie r\u0103spundere \u00een leg\u0103tur\u0103 cu plata
  obliga\u021biilor fiscale ca persoane fizice \u0219i ca persoane juridice fa\u021b\u0103
  de care candida\u021bii au calitatea de manager, ac\u021bionar unic sau majoritar,
  administrator sau membru \u00een consiliul de administra\u021bie.\\n\\nAceste declara\u021bii
  nu \u00eengr\u0103desc dreptul persoanelor de a fi alese, dar furnizeaz\u0103 informa\u021bii
  dup\u0103 care partidele pot judeca \u0219i evita sus\u021binerea unor candida\u021bi
  incompatibili cu cerin\u021bele lor de integritate \u0219i furnizeaz\u0103 aleg\u0103torilor
  interesa\u021bi \u0219i presei date despre onestitatea \u0219i corectitudinea candida\u021bilor,
  pentru ca ace\u0219tia s\u0103 fie vota\u021bi \u00een cuno\u0219tin\u021b\u0103
  de cauz\u0103.\\n\\n\u00cen acest sens s-a formulat actuala propunere legislativ\u0103.\\n\\nAm
  ata\u0219at tabelul cu parlamentarii semnatarii ai prezentei ini\u021biative legislative.\\n\\n|
