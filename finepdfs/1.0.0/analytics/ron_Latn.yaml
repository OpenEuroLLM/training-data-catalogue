sample: '["\"PROIECT DE HOT\u0102R\u00c2RE\\n\\nprivind anularea HCL nr. 19 / 25.03.2021
  privind completarea si actualizarea inventarului bunurilor care alcatuiesc domeniul
  public al comunei Mereni.\\n\\nConsiliul local Mereni, jud. Constanta, intrunit
  in sedinta ordinara la data de 22.10.2021, sedinta fiind publica,\\n\\nAv\u00e2nd
  \u00een vedere:\\n\\n- H.C.L. Mereni nr. 19 / 25.03.2021 privind completarea si
  actualizarea inventarului bunurilor care alcatuiesc domeniul public al comunei Mereni;\\n-
  Adresa Institutiei Prefectului Judetul Constanta nr. 13762 / 26.05.2021 inregistrata
  la Primaria comunei Mereni sub nr. 2504 / 31.05.2021 prin care solicita revocarea
  HCL nr. 19 / 25.03.2021;\\n- Adresa Institutiei Prefectului Judetul Constanta nr.
  24126 / 24.09.2021 inregistrata la Primaria comunei Mereni sub nr. 4288 / 29.09.2021;\\n-
  Referatul de aprobare al Primarului comunei Mereni inregistrat sub nr. 4575 / 12.10.2021
  intocmit in conformitate cu prevederile art. 136, alin. (8), lit. a) din OUG nr.
  57/ 2019 privind Codul administrativ, cu modificarile si completarile ulterioare,
  in calitate de initiator, coroborat cu prevederile art. 240 din acelasi act normativ;\\n-
  Raportul de specialitate al secretarului general al U.A.T. Mereni inregistrat sub
  nr. 4576 / 12.10.2021;\\n- Prevederile art. 136, alin. (3) din Constitutie, art.
  286, alin. (1) si alin. (4), art. 287, art. 289, art. 607, alin. (1) si alin. (3)
  si anexa 4 la OUG nr. 57 / 2019 privind Codul administrativ, cu modificarile si
  completarile ulterioare;\\n- Prevederile art. 6, alin. (3), lit. c), lit. a)-d)
  din HG nr. 392 / 2020 privind aprobarea Normelor tehnice pentru intocmirea inventarului
  bunurilor care alcatuiesc domeniul public si privat al comunelor, al oraselor, al
  municipiilor si al judetelor;\\n- Prevederile art. 41, alin 5 teza II din Legea
  nr. 7/1996 a cadastrului si a publicitatii imobiliare, republicata, cu modificarile
  si completarile ulterioare;\\n\\n\u00cen temeiul dispozitilor art. 45 alin 1, art.
  129, alin (2), lit. c, precum si in baza art. 196 alin (1) lit. a din Ordonanta
  de Urgenta a Guvernului nr.57/2019 privind Codul Administrativ,\\n\\nSE PROPUNE:\\n\\nART.
  1 \u2013 Revocarea HCL Mereni nr. 19 / 25.03.2021 privind completarea si actualizarea
  inventarului bunurilor care alcatuiesc domeniul public al comunei Mereni.\\n\\nART.
  2 Cu ducerea la indeplinire a prezentei hotarari se insarcineaza primarul comunei
  Mereni, prin intermediul aparatului de specialitate al primarului.\\n\\nART. 3 Prezenta
  hotarare poate fi contestata la Instanta de contencios administrativ si fiscal in
  termenul prevazut de Legea 554/2004.\\n\\nART. 4 Secretarul general al U.A.T. Mereni
  va comunica prezenta hotarare Institutiei Prefectului \u2013 Judetul Constanta,
  in vederea exercitarii controlului de legalitate si compartimentelor urbanism si
  contabilitate.\\n\\nInitiator,\\nPrimar\\n\\nGurita Dumitru\\n\\nAvizat pentru legalitate\\n\\nPrivind
  declararea ca fiind bunuri de uz \u0219i interes public local a unor imobile \u2013
  terenuri intravilane situate \u00een localitatea Mereni, comuna Mereni, jude\u021bul
  Constan\u021ba\\n\\nConsiliul Local al comunei Mereni, jude\u021bul Constan\u021ba
  \u00eentrunit \u00een sedin\u021ba ordinar\u0103 la data de 22.10.2021;\\n\\nAv\u00e2nd
  \u00een vedere:\\n\\n-- Adresa Institutiei Prefectului Judetul Constan\u021ba nr.
  13762 / 26.05.2021 \u00eenregistrata la Primaria comunei Mereni sub nr. 2504 / 31.05.2021
  prin care solicita revocarea HCL nr. 19 / 25.03.2021;\\n\\n- Referatul de aprobare
  al primarului comunei Mereni \u00eenregistrat sub nr. 4590 13.10.2021 \u00eentocmit
  \u00een conformitate cu prevederile art. 136, alin. (8), lit. a) din OUG nr. 57
  / 2019 privind Codul administrativ, cu modific\u0103rile \u0219i compelt\u0103rile
  ulterioare, \u00een calitate de initiator, coroborat cu prevederile art. 240 din
  acela\u0219i act normativ;\\n\\n- Raportul de specialitate nr. 4591 / 13.10.2021
  \u00eentocmit de c\u0103tre secretarul general al comunei Mereni privind declararea
  ca fiind bunuri de uz \u0219i interes public local a unor imobile \u2013 terenuri
  intravilane situate \u00een localitatea Mereni, comuna Mereni, jude\u021bul Constan\u021ba;\\n\\n-
  Prevederile art. 15, alin. (2), art. 120, alin. (1), art. 121, alin. (1) \u0219i
  (2) \u0219i art. 138, alin. (4) \u0219i alin. (5) din Constitutia Rom\u00e2niei;\\n\\n-
  Prevederile art. 3 \u0219i art. 4 din Carta european\u0103 a autonomiei locale,
  adoptat\u0103 la Strasbourg la 15 octombrie 1985, ratificat\u0103 prin Legea nr.
  199 / 1997;\\n\\n- Prevederile art. 7, alin. (2) din Codul civil al Rom\u00e2niei,
  adoptat prin Legea nr. 287 / 2009, republicat\u0103, cu modific\u0103rile \u0219i
  complet\u0103rile ulterioare;\\n\\n- Prevederile Legii nr. 7 / 1996 a cadastrului
  \u0219i publicit\u0103\u021bii imobiliare republicat\u0103, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare;\\n\\n- Prevederile Ordinului Directorului
  General al Agentiei Nationale de Cadastru Si Publicitate Imobiliara nr. 700 / 2014
  privind aprobarea Regulamentului de avizare, recep\u021bie \u0219i \u00eenscriere
  \u00een evidentele de cadastru \u0219i carte funciar\u0103,\\n\\n- Inventarul bunurilor
  care apar\u021bin domeniului public al comunei Mereni, jude\u021bul Constan\u021ba
  aprobat prin HCL nr. 30 / 19.09.2000 \u0219i atestat prin HG nr. 904 / 30.08.2002
  privind atestarea domeniului public al jude\u021bului Constan\u021ba, precum \u0219i
  al municipiilor, ora\u0219elor \u0219i comunelor din jude\u021bul Constan\u021ba,
  Anexa nr. 44, cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n\\n-
  Planul de situa\u021bie \u00eentocmit cu ocazia masuratorilor efectuate \u00een
  vederea realiz\u0103rii cadastrului \u0219i intabularii sediului unit\u0103\u021bii
  administrativ-teritoriale comuna Mereni;\\n\\n- Prevederile HG nr. 392 / 2020 privind
  aprobarea Normelor tehnice pentru \u00eentocmirea inventarului bunurilor care alc\u0103tuiesc
  domeniul public \u0219i privat al comunelor, al ora\u0219elor, al municipiilor \u0219i
  al jude\u021belor;\\n\\n- Prevederile Legii nr. 287 / 2009 privind Codul Civil,
  republicat\u0103, cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n\\n-
  Prevederile Legii nr. 24 / 2000 privind normele de tehnica legislativa pentru elaborarea
  actelor normative, republicata, cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n\\nIn
  temeiul prevederilor art. 286, alin. (1), alin. (4), art. 287, art. 289, art. 129,
  alin. (1), alin. (2), lit. c), art. 139, alin. (1), alin. (3), lit. g) corroborat
  cu art. 5, lit. cc), art. 196, alin. (1), lit. a) din OUG nr. 57 / 2019 privind
  Codul administrativ, cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n\\nSE
  PROPUNE:\\n\\nArt. 1- Declararea ca fiind bunuri de uz \u0219i interes public local
  a unor imobile - terenuri intravilane situate \u00een localitatea Mereni, comuna
  Mereni, jude\u021bul Constan\u021ba identificate conform anexei nr. 1 care face
  parte integranta din prezentul proiect de hotarare, \u00een vederea atest\u0103rii
  apartenen\u021bei acestora la inventarul bunurilor aflate \u00een domeniul public
  al comunei Mereni, jude\u021bul Constan\u021ba.\\n\\nArt. 2- Se insuseste planul
  de situa\u021bie \u00eentocmit cu ocazia masur\u0103torilor efectuate \u00een vederea
  realiz\u0103rii cadastrului \u0219i intabularii, anexa nr. 2 care face parte integranta
  din prezentul proiect de hotarare, cu destina\u021bia de terenuri intravilane, identificate
  ca bunuri ne\u00eenscrise \u00een inventarul bunurilor care alc\u0103tuiesc domeniul
  public al comunei Mereni, jude\u021bul Constan\u021ba aprobat prin HCL nr. 30 /
  19.09.2000 \u0219i atestat prin HG nr. 904 / 30.08.2002, Anexa nr. 44, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare;\\n\\nArt. 3- Aprobarea \u00eenscrierii \u00een
  cartea funciar\u0103 \u201eprima \u00eenregistrare imobil,\u201d \u00een favoarea
  Comunei Mereni, jude\u021bul Constan\u021ba a imobilelor descrise \u00een anexa
  nr. 1 la prezentul proiect de hotarare, cu destina\u021bia terenuri intravilane,
  domeniul public al comunei Mereni.\\n\\nArt. 4- Prezentul proiect de hotarare este
  act premerg\u0103tor \u00een vederea \u00eentabularii dreptului de proprietate \u00een
  domeniul public al comunei, iar ulterior pentru elaborarea proiectului de hotarare
  de atestare a inventarului domeniului public, care, insotit de extrasul de carte
  funciar\u0103 \u0219i de alte documente va fi transmis Ministerului cu atribu\u021bii
  \u00een domeniul administra\u021biei publice pentru comunicarea punctului de vedere
  cu privire la proiectul hotar\u0103rii de atestare, potrivit art. 289, alin. (10)
  din OUG nr. 57 / 2019 privind Codul administrativ, cu modific\u0103rile \u0219i
  complet\u0103rile ulterioare.\\n\\nArt. 5- Secretarul general al comunei Mereni
  va comunica prezenta hotarare institu\u021biilor \u0219i persoanelor interesate
  pentru ducerea ei la \u00eendeplinire, Institutiei Prefectului Jude\u021bul Constan\u021ba
  pentru control \u0219i verificarea legalit\u0103\u021bii.\\n\\nINITIATOR\\n\\nPRIMAR\\n\\nDUMITRU
  GURITA\\n\\nAVIZAT PENTRU LEGALITATE\\n\\nSECRETAR GENERAL\\n\\nSERIF SIBEL\\n\\n|
  Nr Crt. | Codul de clasificare | Denumirea bunului | Elemente de identificare |
  Anul dob\u00e2ndirii sau darii \u00een folosinta | Valoarea de inventar (lei) |
  Situa\u021bia juridic\u0103 actuala |\\n|---------|---------------------|------------------|--------------------------|----------------------------------------|---------------------------|--------------------------|\\n|
  6/1     | 1000000             | Teren            | Suprafa\u021ba=1515 p. E-str.
  Libertatii V-imobil nr. cad. 102096 S-teren aferent cladire primarie N-str. Morii
  | 2021                        | 26.481,41                | O.U.G.57/2019 HCL...../2021
  |\\n| 6/2     | 1000000             | Parcare 1        | Suprafa\u021ba=194 mp.
  E-str. Libertatii V-teren primarie S-alee acces N-intrare cladire primarie | 2021                        |
  3.391,92                 | O.U.G. 57/2019 H.C.L. ....../2021 |\\n| 6/3     | 1000000             |
  Parcare 2        | Suprafa\u021ba=387 m.p. E-str. Libertatii V-teren primarie S-intrare
  cladire primarie N-str. Morii | 2021                        | 6764,55                  |
  O.U.G. 57/2019 H.C.L. ....../2021 |\\n\\n- Bunurile se identific\u0103 conform planului
  de amplasament ata\u0219at\\n\\nInitiator\\nPrimar\\nGurita Dumitru\\n\\nAvizat
  pentru legalitate\\n\\nprivind aprobarea acordarii unui sprijin financiar de urgen\u021ba,
  necesar repara\u021biilor la lacasurile de cult pentru parohiile cre\u0219tin \u2013
  ortodoxe Mereni \u0219i Osmancea, precum \u0219i la geamia cultului musulman Osmancea\\n\\nConsiliul
  local al comunei Mereni, constituit \u00een sedin\u021ba ordinar\u0103 la data de
  22.10.2021;\\n\\nAv\u00e2nd \u00een vedere:\\n\\n- Cererea nr. 10 din 30.09.2021
  \u00eenregistrat\u0103 la Primaria comunei Mereni sub nr. 4612 / 13.10.2021, formulata
  de catre preotul paroh al Parchiei cre\u0219tin-ortodoxe Mereni prin care solicit\u0103
  10.000 lei sprijin financiar de urgen\u021ba pentru completarea fondurilor proprii
  necesare repara\u021biilor la biseric\u0103;\\n- Cererea nr. 3928 / 07.09.2021 formulat\u0103
  de catre preotul paroh al Parchiei cre\u0219tin-ortodoxe Osmancea, prin care solicit\u0103
  10.000 lei ajutor de urgen\u021ba pentru achitarea partial\u0103 a lucr\u0103rilor
  de reparatie a acoperisului bisericii;\\n- Cererea formulat\u0103 de catre apartin\u0103torii
  cultului musulman din localitatea Osmancea, prin care solicit\u0103 5.000 lei ajutor
