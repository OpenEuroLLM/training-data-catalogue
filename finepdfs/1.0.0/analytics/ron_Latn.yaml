  de mai sus au fost comparate cu datele din Registrul agricol si evidentele fiscale
  ale comunei Rusanesti, judetul Olt\"", "\"CODUL ETIC \u015eI DE INTEGRITATE AL FUNC\u0162IONARILOR
  PUBLICI \u015eI AL PERSONALULUI CONTRACTUAL DIN CADRUL PRIM\u0102RIEI COMUNEI PADE\u015e\\n\\nANEXA
  LA DISPOZI\u0162IA NR. 206/2021\\n\\n| Num\u0103r | Titlu                                                                 |
  Pagina |\\n|-------|----------------------------------------------------------------------|--------|\\n|
  1     | Domeniul de aplicare                                                  |
  pag. 2 |\\n| 2     | Obiective                                                            |
  pag. 2 |\\n| 3     | Cadru normativ                                                        |
  pag. 3 |\\n| 4     | Principiile care guverneaz\u0103 conduita profesional\u0103
  a func\u021bionarilor publici \u0219i a personalului contractual | pag. 4 |\\n|
  5     | Valori \u0219i principii                                                   |
  pag. 5 |\\n| 6     | \u00cendeplinirea atribu\u021biilor                                              |
  pag. 10 |\\n| 7     | Folosirea imaginii proprii                                             |
  pag. 11 |\\n| 8     | P\u0103strarea secretului de stat, secretului de serviciu
  \u0219i confidentialitatea | pag. 11 |\\n| 9     | Protec\u021bia datelor                                                     |
  pag. 11 |\\n\\n1. Domeniul de aplicare\\n\\nCodul etic \u0219i de integritate al
  func\u021bionarilor publici, reglementeaz\u0103 normele de conduit\u0103 profesional\u0103
  \u0219i de integritate ale func\u021bionarilor publici, iar Codul etic \u0219i de
  integritate al personalului contractual din Prim\u0103ria comunei Pade\u0219, reglementeaz\u0103
  normele de conduit\u0103 profesional\u0103 \u0219i integritatea personalului contractual
  \u0219i sunt definite \u00een continuare Cod etic \u0219i de integritate.\\n\\nNormele
  de conduit\u0103 profesional\u0103 prev\u0103zute de prezentul Cod etic \u0219i
  de integritate sunt obligatorii pentru func\u021bionarii publici, precum \u0219i
  pentru persoanele care ocup\u0103 temporar o func\u021bie public\u0103, pentru personalul
  contractual, \u00eencadrat \u00een baza prevederilor Legii nr.53/2003 \u2013 Codul
  muncii, republicat\u0103.\\n\\n2. Obiective\\n\\nObiectivele prezentului Cod etic
  \u0219i de integritate urm\u0103resc s\u0103 asigure cre\u0219terea calit\u0103\u021bii
  serviciului public, o bun\u0103 administrare \u00een realizarea interesului public,
  precum \u0219i eliminarea birocra\u021biei \u0219i a faptelor de corup\u021bie din
  administra\u021bia public\u0103, prin:\\n\\na) reglementarea normelor de conduit\u0103
  profesional\u0103 necesare realiz\u0103rii unor raporturi sociale \u0219i profesionale
  corespunz\u0103toare cre\u0103rii \u0219i men\u021binerii la nivel \u00eenalt a
  prestigiului Prim\u0103riei Comunei Pade\u0219, al func\u021bionarilor publici \u0219i
  al personalului contractual;\\n\\nb) informarea publicului cu privire la conduit\u0103
  profesional\u0103 la care este \u00eendrept\u0103\u021bit s\u0103 se a\u0219tepte
  din partea func\u021bionarilor publici \u00een exercitarea func\u021biilor publice
  \u0219i din partea personalului contractual \u00een exercitarea func\u021biei;\\n\\nc)
  crearea unui climat de \u00eencredere \u0219i respect reciproc \u00eentre cet\u0103\u021beni
  \u0219i func\u021bionarii publici, personalul contractual din cadrul Prim\u0103riei
  comunei Pade\u0219, pe de o parte \u0219i \u00eentre cet\u0103\u021beni \u0219i
  Prim\u0103rie, pe de alt\u0103 parte.\\n\\n3. Cadrul normativ:\\n\\n- Ordonan\u021ba
  de urgen\u021b\u0103 nr. 57/2019 privind Codul administrativ;\\n- Legea nr. 53/2003
  privind Codul muncii, cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n-
  Legea nr. 161/2003 privind unele m\u0103suri pentru asigurarea transparen\u021bei
  \u00een exercitarea demnit\u0103\u021bilor publice, a func\u021biilor publice \u0219i
  \u00een mediul de afaceri, prevenirea \u0219i sanc\u021bionarea corup\u021biei,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n- Legea nr. 115/1996
  privind declararea \u0219i controlul averii demnitarilor, magistra\u021bilor, func\u021bionarilor
  publici \u0219i unor persoane cu func\u021bii de conducere, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare;\\n- Legea nr. 78/2000 privind prevenirea,
  descoperirea \u0219i sanc\u021bionarea faptelor de corup\u021bie, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare;\\n- Ordinul MF nr. 252/2004 pentru aprobarea
  Codului privind conduita etic\u0103 a auditorului intern;\\n- Legea nr. 682/2002
  privind protec\u021bia martorilor, cu modific\u0103rile \u0219i complet\u0103rile
  ulterioare;\\n- Legea nr. 571/2004 privind protec\u021bia personalului din autorit\u0103\u021bile
  publice, institu\u021biile publice \u0219i din alte unit\u0103\u021bi care semnaleaz\u0103
  \u00eenc\u0103lc\u0103ri ale legii;\\n- Legea nr. 155/2010 a poli\u021biei locale,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare;\\n- Legea nr. 448/2006
  privind protec\u021bia \u0219i promovarea drepturilor persoanelor cu handicap, cu
  modific\u0103rile \u0219i complet\u0103rile ulterioare.\\n\\n4. Principiile care
  guverneaz\u0103 conduita profesional\u0103 a func\u021bionarilor publici \u0219i
  a personalului contractual\\n\\nConform art. 368 din O.U.G. 57/2019 privind Codul
  administrativ, principiile care guverneaz\u0103 conduita profesional\u0103 a func\u021bionarilor
  publici \u0219i a personalului contractual din administra\u021bia public\u0103 sunt:\\n\\na)
  suprema\u021bia Constitu\u021biei \u0219i a legii, principiu conform c\u0103ruia
  persoanele care ocup\u0103 diferite categorii de func\u021bii au \u00eendatorirea
  de a respecta Constitu\u021bia \u0219i legile \u021b\u0103rii;\\n\\nb) prioritatea
  interesului public, \u00een exercitarea func\u021biei de\u021binute;\\n\\nc) asigurarea
  egalit\u0103\u021bii de tratament a cet\u0103\u021benilor \u00een fa\u021ba autorit\u0103\u021bilor
  \u0219i institu\u021biilor publice, principiu conform c\u0103ruia persoanele care
  ocup\u0103 diferite categorii de func\u021bii au \u00eendatorirea de a aplica acela\u0219i
  regim juridic \u00een situa\u021bii identice sau similare;\\n\\nd) profesionalismul,
  principiu conform c\u0103ruia persoanele care ocup\u0103 diferite categorii de func\u021bii
  au obliga\u021bia de a \u00eendeplini atribu\u021biile de serviciu cu responsabilitate,
  competen\u021b\u0103, eficien\u021b\u0103, corectitudine \u0219i con\u0219tiinciozitate;\\n\\ne)
  impar\u021bialitatea \u0219i independen\u021ba, principiu conform c\u0103ruia persoanele
  care ocup\u0103 diferite categorii de func\u021bii sunt obligate s\u0103 aib\u0103
  o atitudine obiectiv\u0103, neutr\u0103 fa\u021b\u0103 de orice interes altul dec\u00e2t
  interesul public, \u00een exercitarea func\u021biei de\u021binute;\\n\\nf) integritatea
  moral\u0103, principiu conform c\u0103ruia persoanelor care ocup\u0103 diferite
  categorii de func\u021bii le este interzis s\u0103 solicite sau s\u0103 accepte,
  direct ori indirect, pentru ei sau pentru al\u021bii, vreun avantaj ori beneficiu
  \u00een considerarea func\u021biei pe care o de\u021bin sau s\u0103 abuzeze \u00een
  vreun fel de aceast\u0103 func\u021bie;\\n\\ng) libertatea g\u00e2ndirii \u0219i
  a exprim\u0103rii, principiu conform c\u0103ruia persoanele care ocup\u0103 diferite
  categorii de func\u021bii pot s\u0103-\u0219i exprime \u0219i s\u0103-\u0219i fundamenteze
  opiniile, cu respectarea ordinii de drept \u0219i a bunelor moravuri;\\n\\nh) cinstea
  \u0219i corectitudinea, principiu conform c\u0103ruia \u00een exercitarea diferitelor
  categorii de func\u021bii ocupan\u021bii acestora trebuie s\u0103 fie de bun\u0103-credin\u021b\u0103;\\n\\ni)
  deschiderea \u0219i transparen\u021ba, principiu conform c\u0103ruia activit\u0103\u021bile
  desf\u0103\u0219urate \u00een exercitarea diferitelor categorii de func\u021bii
  sunt publice \u0219i pot fi supuse monitoriz\u0103rii cet\u0103\u021benilor;\\n\\nj)
  responsabilitatea \u0219i r\u0103spunderea, principiu potrivit c\u0103ruia persoanele
  care ocup\u0103 diferite categorii de func\u021bii r\u0103spund \u00een conformitate
  cu prevederile legale atunci c\u00e2nd atribu\u021biile de serviciu nu au fost \u00eendeplinite
  corespunz\u0103tor.\\n\\n5. Valori \u0219i principii\\n\\nPrezentul Cod are drept
  fundament patru valori:\\n\\n- responsabilitate,\\n- profesionalism,\\n- integritate,\\n-
  transparen\u021b\u0103\\n\\n\u0219i patru principii corespondente, care trebuie
  s\u0103 guverneze comportamentul etic \u0219i profesional al personalului Prim\u0103riei
  comunei Pade\u0219. Principiile care corespund celor patru valori sunt:\\n\\n(a)
  Principiul responsabilit\u0103\u021bii\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219
  trebuie s\u0103 se asigure c\u0103 prin modul \u00een care \u00eendepline\u0219te
  atribu\u021biile de serviciu sau desf\u0103\u0219oar\u0103 orice alt\u0103 activitate
  profesional\u0103 colateral\u0103 respect\u0103 interesul public, interesele legitime
  \u0219i drepturile cet\u0103\u021benilor \u0219i nu afecteaz\u0103 demnitatea \u0219i
  integritatea acestora.\\n\\n(b) Principiul profesionalismului\\n\\nToate atribu\u021biile
  de serviciu care revin personalului Prim\u0103riei comunei Pade\u0219 trebuie \u00eendeplinite
  cu maximum de eficien\u021b\u0103 \u0219i eficacitate, conform competen\u021belor
  de\u021binute \u0219i \u00een cuno\u0219tin\u021b\u0103 de cauz\u0103 \u00een ceea
  ce prive\u0219te reglement\u0103rile legale.\\n\\n(c) Principiul integrit\u0103\u021bii\\n\\n\u00cen
  orice situa\u021bie, personalul Prim\u0103riei comunei Pade\u0219 trebuie s\u0103
  adopte un comportament bazat pe respect, impar\u021bialitate, obiectivitate, onestitate,
  egalitate de \u0219anse \u0219i nediscriminare, deschidere \u0219i diligen\u021b\u0103
  fa\u021b\u0103 de cet\u0103\u021bean \u0219i f\u0103r\u0103 ingerin\u021be care
  s\u0103 afecteze interesul public, interesele legitime \u0219i drepturile cet\u0103\u021benilor
  ori prestigiul institu\u021bional.\\n\\n(d) Principiul transparen\u021bei\\n\\nPersonalul
  Prim\u0103riei comunei Pade\u0219 trebuie s\u0103 promoveze guvernarea deschis\u0103
  c\u0103tre cet\u0103\u021bean, s\u0103 asigure accesul ne\u00eengr\u0103dit la informa\u021biile
  de interes public, dar \u00een acela\u0219i timp s\u0103 protejeze informa\u021biile
  care nu sunt publice de care sunt responsabili ori de care au luat la cuno\u0219tin\u021b\u0103.\\n\\n5.1
  Responsabilitatea\\n\\nRespectul fa\u021b\u0103 de interesul public\\n\\n\u00cen
  \u00eendeplinirea atribu\u021biilor de serviciu, personalul Prim\u0103riei comunei
  Pade\u0219 au responsabilitatea moral\u0103 fundamental\u0103 de a respecta interesul
  public, adic\u0103 de a lua deciziile \u0219i de a \u00eentreprinde acele ac\u021biuni
  care asigur\u0103 un impact pozitiv asupra societ\u0103\u021bii \u00een ansamblul
  ei \u0219i indivizilor care o compun, \u00een mod particular, sau care fac ca impactul
  negativ asupra acestora s\u0103 fie c\u00e2t mai mic cu putin\u021b\u0103.\\n\\nRespectul
  fa\u021b\u0103 de cet\u0103\u021bean\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219
  are responsabilitatea de a respecta interesele legitime \u0219i drepturile cet\u0103\u021beanului.
  Aceast\u0103 responsabilitate nu se limiteaz\u0103 la oferirea unor servicii publice,
  ci prive\u0219te \u0219i efectele pe care le pot avea aceste servicii asupra cet\u0103\u021beanului.\\n\\nRespectul
  fa\u021b\u0103 de institu\u021bie\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219
  are obliga\u021bia de a \u00eendeplini atribu\u021biile de serviciu cu maximum de
  eficien\u021b\u0103 \u0219i eficacitate \u0219i de a utiliza \u00een mod judicios
  resursele institu\u021biei \u0219i \u00een scopul pentru care au fost alocate.\\n\\nResponsabilitatea
  personalului este de a contribui la \u00eembun\u0103t\u0103\u021birea permanent\u0103
  a performan\u021bei institu\u021biei din care fac parte.\\n\\nPersonalul Prim\u0103riei
  comunei Pade\u0219 trebuie s\u0103 se asigure ca prin ac\u021biunile \u0219i opiniile
  sale nu aduce atingere prestigiului profesional al colegilor sau prestigiului Prim\u0103riei
  comunei Pade\u0219.\\n\\nPersonalul prim\u0103riei are, de asemenea, responsabilitatea
  fa\u021b\u0103 de promovarea valorilor etice incluse \u00een acest cod \u0219i asupra
  promov\u0103rii \u0219i men\u021binerii unei culturi organiza\u021bionale bazate
  pe aceste valori.\\n\\n**Respectul fa\u021b\u0103 de ordinea constitutional\u0103
  \u0219i stat**\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219 trebuie s\u0103
  \u00ee\u0219i exercite atribu\u021biile cu maxim\u0103 responsabilitate av\u00e2nd
  \u00een vedere c\u0103, prin natura lor, aceste atribu\u021bii trebuie s\u0103 consolideze
  ordinea constitu\u021bional\u0103 \u0219i autoritatea statului. Orice ac\u021biune
  \u0219i atitudine contrar\u0103 acestui spirit descalific\u0103 persoanele pentru
  a de\u021bine aceste atribu\u021bii \u0219i func\u021bii.\\n\\n**5.2 Profesionalismul**\\n\\nPersonalul
  Prim\u0103riei comunei Pade\u0219 este responsabil \u0219i r\u0103spunz\u0103tor
  din punct de vedere profesional pentru modul \u00een care \u00ee\u0219i desf\u0103\u0219oar\u0103
  atribu\u021biile de serviciu \u0219i le revine sarcina de a se asigura c\u0103 respect\u0103
  principiile de legalitate, eficien\u021b\u0103 \u0219i eficacitate \u00een \u00eendeplinirea
  lor.\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219 trebuie s\u0103 fie informat
  \u0219i s\u0103 cunoasc\u0103 legisla\u021bia din domeniul atribu\u021biilor pe
  care le exercit\u0103, s\u0103 se informeze \u0219i s\u0103 solicite informa\u021bii
  despre cele mai bune practici \u00een domeniul \u00een care \u00ee\u0219i exercit\u0103
  atribu\u021biile.\\n\\nAtunci c\u00e2nd conducerea institu\u021biei ori un ter\u021b
  (persoan\u0103 fizic\u0103 sau juridic\u0103) solicit\u0103 servicii care exced
  atribu\u021biilor de serviciu \u0219i competen\u021belor personalului Prim\u0103riei
  comunei Pade\u0219, ace\u0219tia din urm\u0103 au obliga\u021bia de a \u00ee\u0219i
  face cunoscut\u0103 limitarea profesional\u0103.\\n\\nPersonalul de conducere al
  Prim\u0103riei comunei Pade\u0219 are obliga\u021bia de a se asigura c\u0103 func\u021bionarii
  publici, personalul contractul ai institu\u021biei afla\u021bi \u00een subordine
  au competen\u021bele, condi\u021biile \u0219i resursele necesare unei bune \u00eendepliniri
  a sarcinilor de serviciu, c\u0103 sunt proteja\u021bi \u00een fa\u021ba unor abuzuri
  la nivel institu\u021bional \u0219i c\u0103 respect\u0103 prevederile prezentului
  Cod de etic\u0103 \u0219i conduit\u0103 profesional\u0103, \u00een conformitate
  cu legisla\u021bia \u00een vigoare aplicabil\u0103 \u0219i cu principiile sistemului
  de control managerial.\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219 sunt datori
  s\u0103 respecte at\u00e2t prevederile prezentului cod de etic\u0103 \u0219i conduit\u0103
  profesional\u0103, al\u0103turi de toate celelalte norme, politici, \u0219i proceduri
  institutionale, c\u00e2t \u0219i prevederile legale \u0219i profesionale aplicabile
  domeniului \u00een care \u00ee\u0219i exercit\u0103 atribu\u021biile de serviciu.\\n\\n\u00cen
  situa\u021biile \u00een care exist\u0103 diferen\u021be de reglementare, va prevala
  norma juridic\u0103, etic\u0103 sau profesional\u0103 cea mai restrictiv\u0103.\\n\\nLibertatea
  de exprimare \u0219i dreptul la imaginea proprie sunt garantate prin Constitu\u021bie,
  iar angaja\u021bii Prim\u0103riei comunei Pade\u0219 au obliga\u021bia de a se asigura
  c\u0103 opiniile proprii exprimate \u00een public sau \u00een privat nu aduc atingere
  imaginii Prim\u0103riei comunei Pade\u0219, precum \u0219i demnitatea \u0219i reputa\u021bia
  unei persoane, indiferent de statutul acestiei. Aceste prevederi nu se refer\u0103
  la situa\u021biile de avertizor de integritate.\\n\\nPersonalul Prim\u0103riei comunei
  Pade\u0219 are garantat\u0103 libertatea de exprimare \u0219i dreptul la opinie
  \u00een formularea unei pozi\u021bii profesionale, \u00eens\u0103 exprimarea unui
  punct de vedere \u00een numele institu\u021biei sau despre activitatea acesteia,
  \u00een scris sau verbal, f\u0103r\u0103 existen\u021ba unui mandat \u00een acest
  sens sau \u00een contradic\u021bie total\u0103 cu politica institu\u021biei pe acel
  domeniu, nu reprezint\u0103 o situa\u021bie de exercitare a libert\u0103\u021bii
  de exprimare. Personalul trebuie s\u0103 se asigure c\u0103 atunci c\u00e2nd exprim\u0103
  un punct de vedere al institu\u021biei sau c\u00e2nd este invitat \u00een calitate
  de reprezentant al institu\u021biei, exprim\u0103 acele puncte de vedere asupra
  c\u0103rora \u00een cadrul institu\u021biei s-a decis sau s-a \u00eentrunit un acord.\\n\\nAtunci
  c\u00e2nd se solicit\u0103 puncte de vedere sau opinii avizate, personalul Prim\u0103riei
  comunei Pade\u0219 trebuie s\u0103 formuleze aceste opinii exclusiv pe baza principiilor
  profesionale \u0219i pe cele ale garant\u0103rii unui act administrativ obiectiv,
  f\u0103r\u0103 a fi influen\u021bat de convingerile personale sau interesele grupurilor
  din care face parte.\\n\\n\u00cen timpul deplas\u0103rilor interne \u0219i/sau externe,
  personalul Prim\u0103riei comunei Pade\u0219 are obliga\u021bia de a avea o conduit\u0103
  corespunz\u0103toare regulilor de protocol \u0219i diplomatie aplicabile, intr\u00e2nd
  \u00een responsabilitatea lor de a cunoa\u0219te \u0219i de a respecta tradi\u021biile,
  obiceiurile \u0219i legile \u021b\u0103rii sau comunit\u0103\u021bii gazd\u0103.\\n\\n5.3
  Integritatea\\n\\n\u00cen rela\u021bia cu publicul, cu colegii din institu\u021bie
  sau din cadrul altor organiza\u021bii sau sfere profesionale, precum \u0219i cu
  superiorii ierarhici, personalul Prim\u0103riei comunei Pade\u0219 trebuie s\u0103
  adopte o atitudine bazat\u0103 pe respect \u2013 o atitudine impar\u021bial\u0103,
  nediscriminatorie, deschis\u0103 \u0219i diligent\u0103.\\n\\nConflictele de interese\\n\\nPersonalul
  Prim\u0103riei comunei Pade\u0219 are datoria legal\u0103, moral\u0103 \u0219i profesional\u0103
  de a se asigura c\u0103 \u00een timpul exercit\u0103rii activit\u0103\u021bii nu
  se afl\u0103 \u00een conflict de interese sau \u00eentr-o situa\u021bie de incompatibilitate,
  a\u0219a cum sunt definite acestea \u00een legisla\u021bia actual\u0103 \u0219i
  \u00een spiritul acestui cod de etic\u0103.\\n\\n\u00cen cazul \u00een care intervine
  o situa\u021bie de conflict de interese sau incompatibilitate, personalul Prim\u0103riei
  comunei Pade\u0219 trebuie s\u0103 sesizeze \u00een scris, \u00een maximum 7 zile
  lucr\u0103toare de la apari\u021bia situa\u021biei de conflict de interese sau st\u0103rii
  de incompatibilitate, superiorii ierarhici. \u00cen astfel de situa\u021bii, conducerea
  Prim\u0103riei comunei Pade\u0219 are obliga\u021bia de a asigura, prin m\u0103suri
  institu\u021bionale, c\u0103 a fost evitat conflictul de interese sau incompatibilitatea
  declarate, f\u0103r\u0103 a aduce atingere demnit\u0103\u021bii persoanei \u0219i
  drepturilor profesionale \u0219i contractuale ale celui care face obiectul conflictului
  de interese, respectiv incompatibilit\u0103\u021bii sesizate.\\n\\n**Cadourile,
  aten\u021biile \u0219i materialele cu caracter promotional**\\n\\nPersonalului Prim\u0103riei
  comunei Pade\u0219 \u00eei este interzis s\u0103 solicite \u0219i s\u0103 primeasc\u0103
  cadouri, servicii, favoruri, invita\u021bii sau orice alt avantaj, indiferent de
  natura \u0219i contextul acord\u0103rii lor.\\n\\n**Avertizarea de integritate**\\n\\nAngaja\u021bii
  Prim\u0103riei comunei Pade\u0219 au obliga\u021bia moral\u0103 \u0219i profesional\u0103,
  suplimentar celei legale, de a sesiza orice abatere de la procedurile, normale,
  politicile interne ale institu\u021biei, precum \u0219i de la lege, de care iau
  cuno\u0219tin\u021b\u0103.\\n\\n\u00cen baza Legii nr. 571/2004 privind protec\u021bia
  personalului din autorit\u0103\u021bile publice, institu\u021biile publice \u0219i
  din alte unit\u0103\u021bi care semnaleaz\u0103 \u00eencalc\u0103ri ale legii \u0219i
  \u00een spiritul acestui Cod de etic\u0103 \u0219i conduit\u0103 profesional\u0103,
  se prezum\u0103 c\u0103 avertizarea de integritate se bazeaz\u0103 pe buna credin\u021b\u0103
  a avertizorului.\\n\\n**Neutralitatea politic\u0103 \u0219i participarea la activit\u0103\u021bi
  politice**\\n\\nPersonalul Prim\u0103riei comunei Pade\u0219 are obliga\u021bia
  de a se asigura c\u0103 prin prezen\u021ba lor \u00eentr-un anumit context politic,
  prin opiniiile publice pe care le exprim\u0103 \u0219i prin activitatea pe care
  o desf\u0103\u0219oar\u0103 nu se afl\u0103 \u00eentr-o situa\u021bie de conflict
  de interese, real sau aparent, cu obliga\u021biile legale, morale \u0219i profesionale
  pe care le au \u00een situa\u021bie de conflict de interese, real sau aparent, cu
  obliga\u021biile legale, morale \u0219i profesionale pe care le au \u00een calitatea
  lor de membri sau de reprezentan\u021bi ai institu\u021biei.\\n\\nFunc\u021bionarilor
  publici, personalului contractual din cadrul Prim\u0103riei comunei Pade\u0219,
  le este interzis ca pe durata raportului de serviciu/contractului de munc\u0103
  s\u0103 participe la activit\u0103\u021bi cu scopuri electorale, la activit\u0103\u021bi
  de colectare de fonduri pentru partide politice, pentru organiza\u021bii asimilate
  cu partidele politice sau c\u0103rora li se aplic\u0103 acela\u0219i regim juridic
  ca \u0219i partidelor politice, pentru funda\u021bii/asocia\u021bii care func\u021bioneaz\u0103
  pe l\u00e2ng\u0103 partide politice sau au orient\u0103ri politice clar exprimate,
  ori juridice privind oferirea de dona\u021bii/sponsoriz\u0103ri de orice natur\u0103
  \u00een favoare entit\u0103\u021bilor amintite.\\n\\n5.4 Transparent\u0103\\n\\nAccesul
  liber la informa\u021biile de interes public\\n\\n\u00cen conformitate cu legisla\u021bia
  \u00een vigoare, activitatea Prim\u0103riei comunei Pade\u0219 trebuie s\u0103 fie
  transparent\u0103 \u0219i accesibil\u0103 cet\u0103\u021beanului, garant\u00e2nd
  o bun\u0103 comunicare cu cet\u0103\u021benii, cu societatea civil\u0103 \u0219i
  cu mediul de afaceri.\\n\\n\u00cen temeiul rela\u021biilor de parteneriat dezvoltate
  cu societatea civil\u0103, personalul Prim\u0103riei comunei Pade\u0219 furnizeaz\u0103
  reprezentan\u021bilor acestieia informa\u021bii referitoare la proiectele, programele
  \u0219i alte documente de interes public care au leg\u0103tur\u0103 cu activitatea
  institu\u021biei, \u00een limita competen\u021belor ce \u00eei/le revin.\\n\\nPersonalul
  Prim\u0103riei comunei Pade\u0219 potrivit atribu\u021biilor ce \u00eei revin \u0219i
  conform legisla\u021biei privind accesul la informa\u021bii de interes public, este
  obligat:\\n\\n1. s\u0103 asigure informarea activ\u0103, corect\u0103 \u0219i la
  timp a cet\u0103\u021benilor asupra chestiunilor de interes public;\\n2. s\u0103
  asigure accesul liber la informa\u021biile de interes public \u00een condi\u021biile
  legii;\\n3. s\u0103 respecte termenele prev\u0103zute de lege privind furnizarea
  informa\u021biilor.\\n\\nProtectia datelor \u0219i a informa\u021biilor\\n\\nPersonalul
  Prim\u0103riei comunei Pade\u0219 este obligat s\u0103 respecte limit\u0103rile
  impuse de lege privind accesul la informa\u021bii, \u00een scopul protej\u0103rii
  informa\u021biilor confiden\u021biale, a secretului de stat sau de serviciu, a protej\u0103rii
  vie\u021bii private a persoanelor \u0219i a securit\u0103\u021bii na\u021bionale.\\n\\nPersonalul
  \u0219i colaboratorii Prim\u0103riei comunei Pade\u0219 au obliga\u021bia s\u0103
  p\u0103streze, \u00een condi\u021biile legii, confiden\u021bialitatea deplin\u0103
  a datelor \u0219i informa\u021biilor pe care le de\u021bin sau la care au acces
  pe perioada desf\u0103\u0219ur\u0103rii activit\u0103\u021bii \u0219i s\u0103 nu
  le utilizeze abuziv sau \u00een folos personal, sau s\u0103 le fac\u0103 cunoscute
  unui ter\u021b, inclusiv dup\u0103 \u00eencetarea activit\u0103\u021bii care le
  confer\u0103 acces la aceste informa\u021bii.\\n\\nCulegerea stocarea \u0219i utilizarea
  datelor cu caracter personal de c\u0103tre personalul Prim\u0103riei comunei Pade\u0219
  se fac \u00een condi\u021biile legii \u0219i vor fi limitate strict la ceea ce este
  necesar pentru realizarea obiectivelor legale, legitime \u0219i specifice institu\u021biei.\\n\\n6.
  \u00cendeplinirea atribu\u021biilor\\n\\nFunc\u021bionarii publici \u0219i personalul
  contractual r\u0103spund, potrivit legii, de \u00eendeplinirea atribu\u021biilor
  ce le revin din func\u021bia public\u0103 pe care o de\u021bin, precum \u0219i a
  atribu\u021biilor ce le sunt delegate.\\n\\nFunc\u021bionarul public \u0219i personalul
  contractual au \u00eendatorirea s\u0103 \u00eendeplineasc\u0103 dispozi\u021biile
  primite de la superiorii ierarhici.\\n\\nFunc\u021bionarul public \u0219i personalul
  contractual au dreptul s\u0103 refuze, \u00een scris \u0219i motivat, \u00eendeplinirea
  dispozi\u021biilor primite de la superiorul ierarhic, dac\u0103 le consider\u0103
  ilegale.\\n\\nFunc\u021bionarul public are \u00eendatorirea s\u0103 aduc\u0103 la
  cuno\u0219tin\u021ba superiorului ierarhic al persoanei care a emis dispozi\u021bia
  astfel de situa\u021bii.\\n\\n7. Folosirea imaginii proprii\\n\\n\u00cen considerarea
  func\u021biei publice sau a func\u021biei contractuale pe care o de\u021bin, func\u021bionarii
  publici \u0219i personalul contractual au obliga\u021bia de a nu permite utilizarea
  numelui sau a imaginii proprii \u00een ac\u021biuni publicitare pentru promovarea
  unei activit\u0103\u021bi comerciale, precum \u0219i \u00een scopurile electorale.\\n\\n8.
  P\u0103strarea secretului de stat, secretului de serviciu \u0219i confiden\u021bialitatea\\n\\nFunc\u021bionarii
  publici \u0219i personalul contractual au obliga\u021bia s\u0103 p\u0103streze secretul
  de stat, secretul de serviciu, precum \u0219i confiden\u021bialitatea \u00een leg\u0103tur\u0103
  cu faptele, informa\u021biile sau documentele de care iau cuno\u0219tin\u021b\u0103
  \u00een exercitarea func\u021biei publice sau contractuale, \u00een condi\u021biile
  legii, cu aplicarea dispozi\u021biilor \u00een vigoare privind liberul acces la
  informa\u021biile de interes public.\\n\\n9. Protec\u021bia datelor\\n\\nPrim\u0103ria
  comunei Pade\u0219 prin func\u021bionarii publici \u0219i personalul contractual
  este obligat\u0103 s\u0103 respecte confiden\u021bialitatea \u00een leg\u0103tur\u0103
  cu datele cu caracter personal, informa\u021biile sau documentele clasificate despre
  care iau cuno\u0219tin\u021b\u0103 \u00een exercitarea atribu\u021biilor \u0219i
  sarcinilor de serviciu, conform legisla\u021biei \u0219i procedurilor interne aprobate.\\n\\n\u00centocmit,\\nConsilier
  etic\u0103\\nCurelea Corina Maria\\n\\nAvizat,\\nSecretar general,\\nPopescu Aurel\\n\\nAPROB,\\nPRIMAR,\\nTROAC\u0102
  MIH\u0102IT\u0102 GABRIEL\"", "\"NOTA INFORMATIV\u0102\\n\\nla proiectul Ordinului
  Ministrului justi\u021biei pentru aprobarea Regulamentului cu privire la \u021binerea
  registrului de stat al hot\u0103r\u00eerilor \u0219i deciziilor Cur\u021bii Europene
  a Drepturilor Omului \u00een cauze \u00eendreptate \u00eempotriva Republicii Moldova.\\n\\nNumele
  ini\u0163iatorului \u015fi a autorului, precum \u015fi a participan\u0163ilor la
  elaborarea proiectului. Condi\u021biile ce au impus elaborarea proiectului, scopul
  \u0219i obiectivele urm\u0103rite.\\n\\nMinisterul Justi\u021biei a elaborat \u0219i
  promoveaz\u0103 proiectul Ordinului Ministrului justi\u021biei pentru aprobarea
  Regulamentului cu privire la \u021binerea registrului de stat al hot\u0103r\u00eerilor
  \u0219i deciziilor Cur\u021bii Europene a Drepturilor Omului \u00een cauze \u00eendreptate
  \u00eempotriva Republicii Moldova.\\n\\nLa data de 30 iulie 2015 a fost adoptat\u0103
  Legea nr. 151 cu privire la Agentul guvernamental.\\n\\nArt. 20 alin. (1) din Legea
  precitat\u0103 prevede, c\u0103 \u201eAgentul guvernamental asigur\u0103 \u021binerea
  registrului de stat al hot\u0103r\u00eerilor \u0219i deciziilor Cur\u021bii Europene
  \u00een cauze \u00eendreptate \u00eempotriva Republicii Moldova. Modalitatea de
  \u0163inere a acestui registru este stabilit\u0103 \u00een regulamentul aprobat
  prin ordinul ministrului justi\u0163iei.\\\".\\n\\nRespectiv se instituie un nou
  Registru \u2013 Registrul de stat al hot\u0103r\u00eerilor \u0219i deciziilor Cur\u021bii
  Europene \u00een cauze \u00eendreptate \u00eempotriva Republicii Moldova.\\n\\nFinalit\u0103\u0163ile
  urm\u0103rite prin promovarea acestui proiect sunt:\\n\\n- instituirea registrului
  de stat al hot\u0103r\u00eerilor \u0219i deciziilor Cur\u021bii Europene a Drepturilor
  Omului \u00een cauze \u00eendreptate \u00eempotriva Republicii Moldova;\\n- elaborarea
  cadrului normativ necesar func\u0163ion\u0103rii acestui registru;\\n- asigurarea
  suportului financiar necesar pentru crearea, dezvoltarea \u015fi func\u0163ionarea
  Registrului de stat al hot\u0103r\u00eerilor \u0219i deciziilor Cur\u021bii Europene
  a Drepturilor Omului \u00een cauze \u00eendreptate \u00eempotriva Republicii Moldova.\\n\\nExpunerea
  problemelor abordate \u00een proiect prin prisma cadrului normativ \u00een vigoare,
  argumentarea necesit\u0103\u0163ii de reglementare, eviden\u0163ierea elementelor
  noi\\n\\nPrin proiectul Ordinului Ministrului justi\u021biei se aprob\u0103 proiectul
  Regulamentului cu privire la \u021binerea Registrului de stat al hot\u0103r\u00eerilor
  \u0219i deciziilor Cur\u021bii Europene a Drepturilor Omului \u00een cauze \u00eendreptate
  \u00eempotriva Republicii Moldova (\u00een continuare Registru).\\n\\nProiectul
  Regulamentului reglementeaz\u0103 urm\u0103toarele aspecte:\\n\\n1) Obiectul de
  reglementare a Regulamentului;\\n2) Statutul Registrului de baz\u0103 de date public\u0103
  cu privire la hot\u0103r\u00eerile \u0219i deciziile CEDO adoptate \u00een cauzele
  contra Moldovei;\\n3) Subiec\u021bii raporturilor juridice de \u021binere a Registrului:
  Statul, Ministerul Justi\u021biei, Centrul de Informa\u021bii Juridice, Direc\u021bia
  general\u0103 Agent Guvernamental,  Curtea European\u0103 a Drepturilor Omului \u00een
  calitate de furnizor al informa\u021biilor \u0219i orice persoan\u0103 fizic\u0103
  sau juridic\u0103 \u00een calitate de destinatar al informa\u021biilor din Registru;\\n4)
  Obiectele care se \u00eenregistreaz\u0103 \u00een Registru (hot\u0103r\u00eerile
  \u0219i deciziile Cur\u021bii Europene a Drepturilor Omului \u00een cauze \u00eendreptate
  \u00eempotriva Republicii Moldova) \u0219i datele aferente acestor obiecte;\\n5)
  Modalitatea de acces la datele din Registru: acestea vor putea fi accesate pe pagina
  web agent.gov.md;\\n6) Modalitatea de \u021binere a Registrului;\\n7) Procedura
  de \u00eenregistrare \u00een Registru a hot\u0103r\u00eerilor \u0219i deciziilor
  CEDO;\\n8) M\u0103surile de asigurare a securit\u0103\u021bii \u0219i a integrit\u0103\u021bii
  informa\u021biei din Registru;\\n\\n9) Institu\u021biile abilitate cu atribu\u021bii
  de control a modului de \u021binere a Registrului: controlul intern va fi realizat
  de c\u0103tre Ministerul Justi\u021biei, iar controlul extern va fi efectuat de
  c\u0103tre autoritatea administra\u021biei publice abilitat\u0103 prin lege s\u0103
  realizeze un atare control.\\n\\nSolu\u021bia tehnic\u0103 adoptat\u0103 pentru
  func\u021bionarea Registrului rezid\u0103 \u00een crearea unui compartiment distinct
  pe pagina web agent.gov.md, care s\u0103 includ\u0103 jurispruden\u021ba CEDO \u00een
  cauzele contra Moldovei, grupat\u0103 \u00een categoriile \u201eHot\u0103r\u00eeri\\\"
  \u0219i \u201eDecizii\\\" \u0219i \u00een func\u021bie de anii adopt\u0103rii acestor
  acte ale Cur\u021bii, cuprinz\u00eend hot\u0103r\u00eerile \u0219i deciziile CEDO
  expuse \u00een ordine cronologic\u0103.\\n\\nFundamentarea economico-financiar\u0103\\n\\nAsigurarea
  cre\u0103rii \u0219i func\u0163ion\u0103rii Registrului se efectueaz\u0103 din contul
  \u015fi \u00een limitele mijloacelor alocate Ministerul Justi\u021biei din bugetul
  de stat pentru anul respectiv.\\n\\nModul de incorporare a proiectului \u00een sistemul
  actelor normative \u00een vigoare, actele normative care trebuie elaborate sau modificate\\n\\nProiectul
  nu implic\u0103 modificarea sau completarea altor acte normative.\\n\\nAvizarea
  \u0219i consultarea public\u0103 a proiectului\\n\\n\u00cen scopul respect\u0103rii
  prevederilor Legii nr. 239-XVI din 13 noiembrie 2008 privind transparen\u0163a \u00een
  procesul decizional, proiectul a fost plasat pe pagina web a Ministerului Justi\u0163iei
  (directoriul \u201eTransparen\u0163a decizional\u0103\\\", compartimentul \u201eproiecte
  de acte normative remise spre coordonare\\\").\\n\\nViceministru\\n\\nNicolae E\u0218ANU\"",
  "\"ORDIN\\npentru aprobarea bugetului de venituri \u0219i cheltuieli rectificat
  al Autorit\u0103\u021bii Na\u021bionale de Reglementare \u00een Domeniul Energiei
  pe anul 2024 \u0219i a bugetului proiectelor cu finan\u021bare din fonduri externe
  nerambursabile\\n\\nTin\u00e2nd cont de Referatul nr. 142.349 din 23.10.2024 privind
  rectificarea bugetului de venituri \u0219i cheltuieli al Autorit\u0103\u021bii Na\u021bionale
  de Reglementare \u00een Domeniul Energiei pe anul 2024,\\n\\nav\u00e2nd \u00een
  vedere prevederile art. 16 alin. (1) lit. b), art. 21, art. 62 alin. (1) lit. c)
  \u0219i ale art. 65 din Legea nr. 500/2002 privind finan\u021bele publice, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare,\\n\\n\u00een temeiul art. 2 alin. (4) din
  Ordonan\u021ba de urgen\u021b\u0103 a Guvernului nr. 33/2007 privind organizarea
  \u0219i func\u021bionarea Autorit\u0103\u021bii Na\u021bionale de Reglementare \u00een
  Domeniul Energiei, aprobat\u0103 cu modific\u0103ri \u0219i complet\u0103ri prin
  Legea nr. 160/2012, cu modific\u0103rile \u0219i complet\u0103rile ulterioare,\\n\\npre\u0219edintele
  Autorit\u0103\u021bii Na\u021bionale de Reglementare \u00een Domeniul Energiei emite
  urm\u0103torul ordin:\\n\\nArt. 1. \u2014 Se aprob\u0103 bugetul de venituri \u0219i
  cheltuieli rectificat al Autorit\u0103\u021bii Na\u021bionale de Reglementare \u00een
  Domeniul Energiei pe anul 2024, prev\u0103zut \u00een anexa nr. 1.\\n\\nArt. 2.
  \u2014 (1) Cheltuielile totale aferente veniturilor totale \u00eenscrise \u00een
