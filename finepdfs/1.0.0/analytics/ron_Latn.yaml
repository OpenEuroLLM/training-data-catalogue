  general\u0103 final\u0103: 5,90\"", "\"HOT\u0102R\u00c2REA Nr. 9\\ndin 25 aprilie
  2013\\n\\nprivind aprobarea Statului de func\u021bii al aparatului de specialitate\\nal
  primarului comunei Zimbor\\n\\nConsiliul local al comunei Zimbor, jude\u021bul Salaj,
  \u00eentrunit \u00een \u0219edin\u021b\u0103\\nordinar\u0103 de lucru, \u00een exercitarea
  atribu\u021biilor sale legale;\\n\\nAv\u00e2nd \u00een vedere:\\n- Expunerea de
  motive a primarului comunei Zimbor \u00eenregistrat\u0103 sub nr.\\n  1002 din 19.04.2013
  privind aprobarea Statului de func\u021bii ale aparatului de\\n  specialitate al
  primarului comunei Zimbor;\\n- avizul nr. 1003 din 19.04.2013 a comisiei de specialitate
  \u0219i Raportul nr.\\n  1004 din 19.04.2013 al Compartimentului de specialitate
  al Prim\u0103riei comunei\\n  Zimbor;\\n- prevederile Legii 188/1999 privind statutul
  func\u021bionarilor publici,\\n  republicat\u0103;\\n- prevederile art.36, alin.2,
  lit. \u201ea\u201e, alin. 3, lit.,\u201eb\u201d din Legea nr. 215/2001\\n  privind
  administra\u021bia public\u0103 local\u0103, republicat\u0103, cu modific\u0103rile
  \u0219i complet\u0103rile\\n  ulterioare;\\n\\n\u00cen temeiul prevederilor art.
  45, alin.1, din Legea nr. 215/2001 privind\\nadministra\u021bia public\u0103 local\u0103,
  republicat\u0103, cu modific\u0103rile \u0219i complet\u0103rile ulterioare.\\n\\nHOT\u0102R\u0102\u0218TE\\n\\nArt.
  1. Se aprob\u0103 Statul de func\u021bii al aparatului de specialitate al primarului\\ncomunei
  Zimbor, conform anexei, care face parte integrant\u0103 din prezenta\\nhot\u0103r\u00e2re.\\n\\nArt.
  2. Cu ducerea la \u00eendeplinire a prezentei hot\u0103r\u00e2ri se \u00eencredin\u021beaz\u0103\\nprimarul
  \u0219i secretarul comunei Zimbor.\\n\\nArt. 3. Prezenta hot\u0103r\u00e2re se comunic\u0103
  cu:\\n- Institutia Prefectului jud. S\u0103laj.\\n- Agen\u021bia Na\u021bional\u0103
  a Func\u021bionarilor Publici;\\n- Compartimentul contabilitate.\\n- Primarul comunei
  Zimbor.\\n- Monitorul Oficial al jude\u021bului S\u0103laj.\\n- Cet\u0103\u021benii
  comunei Zimbor, prin afi\u0219are.\\n- Dosar hot\u0103r\u00e2ri.\\n\\nPRE\u0218EDINTE
  DE \u0218EDIN\u021a\u0102\\nFLOREA IOAN\\n\\nCONTRASEMNEAZ\u0102\\nSECRETAR COMUN\u0102\\nCOZMA
  MARIANA\"", "\"PROCES VERBAL\\n\u00eencheiat \u00een urma \u0219edin\u021bei ordinar\u0103\\na
  Consiliului Local Municipal T\u00e2rgovi\u0219te\\ndin data de 31.03.2020\\n\\nAceast\u0103
  \u0219edin\u021b\u0103 ordinar\u0103 a Consiliului Local Municipal T\u00e2rgovi\u0219te
  a fost convocat\u0103 de Primarul Municipiului T\u00e2rgovi\u0219te, dl. jr. Daniel-Cristian
  Stan, prin Dispozi\u021bia nr. 814 din data de 25.03.2020.\\n\\nLucr\u0103rile Comisiilor
  de specialitate \u0219i cele ale Consiliului Local al Municipiului T\u00e2rgovi\u0219te
  au fost organizate \u0219i s-au desf\u0103\u0219urat prin utilizarea mijloacelor
  electronice de comunicare, respectiv prin intermediul unei platforme on-line de
  videoconferin\u021b\u0103.\\n\\nLa \u00eenceputul \u0219edin\u021bei s-a f\u0103cut
  prezen\u021ba nominal\u0103 a consilierilor locali, constat\u00e2ndu-se c\u0103
  sunt prezen\u021bi to\u021bi consilierii Municipiului T\u00e2rgovi\u0219te, respectiv
  cei 21 de consilieri \u00een func\u021bie.\\n\\nD-na. jr. Silvia-Elena Stanca, Secretarul
  General al Municipiului T\u00e2rgovi\u0219te, declar\u0103: Se constat\u0103 c\u0103
  sunt \u00eendeplinite condi\u021biile de cvorum pentru ca \u0219edin\u021ba s\u0103
  fie statutat\u0103 conform legii, drept pentru care \u0219edin\u021ba este legal
  constituit\u0103 \u0219i \u00ee\u0219i poate desf\u0103\u0219ura lucr\u0103rile
  \u00een conformitate cu prevederile Codului Administrativ adoptat prin OUG nr. 57/2019.\\n\\n\u0218edin\u021ba
  de ast\u0103zi este condus\u0103 de dna. consilier Boboac\u0103-Mih\u0103escu Doina-Nicoleta,
  aleas\u0103 pre\u0219edinte pentru \u0219edin\u021bele consiliului local din luna
  martie 2020.\\n\\nAv\u00e2nd \u00een vedere prevederile art. 50 \u0219i art. 51
  alin. (1) din Anexa nr. 1 \u2013 \u201dM\u0103suri de prim\u0103 urgen\u021b\u0103
  cu aplicabilitate direct\u0103\u201d din Decretul nr. 195/16.03.2020 privind instituirea
  st\u0103rii de urgen\u021b\u0103 pe teritoriul Rom\u00e2niei, \u0219edin\u021ba
  de ast\u0103zi se desf\u0103\u0219oar\u0103 \u00een conformitate cu procedura de
  desf\u0103\u0219urare a \u0219edin\u021belor consiliului local al municipiului T\u00e2rgovi\u0219te,
  \u00een situa\u021bii exceptionale, aprobat\u0103 prin H.C.L. nr. 77/24.03.2020,
  iar votul pentru fiecare punct va fi deschis, exprimat prin apel nominal.\\n\\nSe
  supune la vot procesul verbal al \u0219edin\u021bei extraordinare din data 16.03.2020.
  Se aprob\u0103 cu 21 voturi \u201epentru\u201d.\\n\\nSe supune la vot procesul verbal
  al \u0219edin\u021bei extraordinare cu convocare de \u00eendat\u0103 din data 24.03.2020.
  Se aprob\u0103 cu 21 voturi \u201epentru\u201d.\\n\\nSe supune la vot ordinea de
  zi a \u0219edin\u021bei de ast\u0103zi. Se aprob\u0103 cu 21 voturi \u201epentru\u201d.\\n\\nLa
  aceast\u0103 \u0219edin\u021b\u0103 directori ai societ\u0103\u021bilor din subordinea
  Consiliului Local, directori \u0219i \u0219efi de servicii din cadrul Aparatului
  de Specialitate al Primarului.\\n\\nSe trece la dezbaterea punctelor \u00eenscrise
  pe ordinea de zi.\\n\\n1. Proiect de hot\u0103r\u00e2re pentru modificarea \u0219i
  completarea HCL nr. 41/27.02.2020 privind desemnarea reprezentan\u021bilor Consiliului
  Local Municipal T\u00e2rgovi\u0219te \u00een consiliile de administra\u021bie ale
  unit\u0103\u021bilor \u0219colare din Municipiul T\u00e2rgovi\u0219te\\n\\nD-na.
  jr. Silvia-Elena Stanca, Secretarul General al Municipiului, prezint\u0103 materialul
  care a stat la baza proiectului de hot\u0103r\u00e2re.\\n\\nSe supune la vot proiectul
  de hot\u0103r\u00e2re. Se aprob\u0103 cu 21 voturi \u201cpentru\u201d, proiectul
  devenind HCL nr. 78.\\n\\n2. Proiect de hot\u0103r\u00e2re privind aprobarea documenta\u021biei
  tehnico-economice faza Documenta\u021bie de avizare a lucr\u0103rilor de interven\u021bie
  (DALI) \u0219i a indicatorilor tehnico-economici pentru obiectivul de investi\u021bii
  \u201cModernizarea \u0219i reabilitarea re\u021belei stradale din Municipiul T\u00e2rgovi\u0219te,
  Jude\u021bul D\u00e2mbovi\u021ba: Str. Major Eugen Brez\u00ee\u0219eanu, Str. Calea
  C\u00e2mpulung, Str. Ana Ip\u0103tescu, Str. Locotenent P\u00e2rvan Popescu, Str.
  Mihai Eminescu, Str. B\u0103r\u0103\u021biei, Str. Ilfovului, Str. Costache Ol\u0103reanu
  \u0219i Str. Porumbeilor\u201d\\n\\nDl. jr. Ciprian St\u0103nescu, director adjunct
  al Direc\u021biei Managementul Proiectelor, prezint\u0103 materialul care a stat
  la baza proiectului de hot\u0103r\u00e2re.\\n\\nSe supune la vot proiectul de hot\u0103r\u00e2re.
  Se aprob\u0103 cu 21 voturi \u201cpentru\u201d, proiectul devenind HCL nr. 79.\\n\\n3.
