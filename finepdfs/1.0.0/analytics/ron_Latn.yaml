  Na\u021bional de Statistic\u0103.\\n\\nArt. 6. \u2013 Se \u00eempunerniceste Primarul
  comunei Mereni, domnul Gurita Dumitru, s\u0103 reprezinte comuna Mereni \u00een
  fa\u021ba notarului public \u0219i sa semneze \u00een vederea autentific\u0103rii
  contractului de superficie.\\n\\nArt. 7.- Toate cheltuielile ocazionate cu perfectarea
  contractului de constituire a dreptului de superficie cu titlu oneros \u00een foem\u0103
  autentic\u0103, vor fi suportate de c\u0103tre superfi\u021bier.\\n\\nArt. 8 - Prezenta
  hot\u0103rare poate fi ata\u00e7at\u0103 \u00een condi\u021biile Legii nr. 554/2004.\\n\\nArt.
  9. - Prezenta hot\u0103rare va fi comunicat\u0103 de c\u0103tre secretarul general
  al comunei Mereni, Institu\u021biei Prefectului Jude\u021bului Constan\u021ba, \u00een
  vederea verific\u0103rii legalit\u0103\u021bii, persoanelor interesate, iar un exemplar
  va fi arhivat la registratura comunei Mereni.\\n\\nPrimar\\nGurita Dumitru\\n\\nAvizat
  pentru legalitate\\n\\nPROIECT DE HOT\u0102R\u00c2RE\\n\\nprivind rectificarea bugetului
