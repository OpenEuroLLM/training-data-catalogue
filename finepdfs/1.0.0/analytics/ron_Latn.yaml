  F. \u0219i al\u021bii prin Cabinetul de avocatur\u0103 Iuga Nicoleta, cu domiciliul
  \u00een Arad, bd. General Vasile Milea, nr.19, ap.12, jud. Arad\\n\\nI.2. Numele,
  domiciliul sau re\u0219edin\u021ba reclamatului\\nI.2.1 Ministerul Internelor \u0219i
  Reformei Administrative, cu sediul \u00een Pia\u021ba Revolu\u021biei, nr.1A, sector
  1\\n\\nII. Obiectul sesiz\u0103rii\\n2.1. Peten\u021bii, prin reprezentant, solicit\u0103
  constatarea existen\u021bei unei situa\u021bii de discriminare sub aspectul stimul\u0103rii
  salariale, \u00eentre poli\u021bi\u0219tii judiciari deta\u0219a\u021bi la DNA \u0219i
  poli\u021bi\u0219tii judiciari care \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea
  \u00een cadrul inspectoratelor jude\u021bene de poli\u021bie\\n\\nIII. Descrierea
  presupusei fapte de discriminare\\n3.1. Petenta consider\u0103 discriminatorie situa\u021bia
  creat\u0103 de c\u0103tre Ministerul Internelor \u0219i Reformei Administrative,
  prin care, \u00een condi\u021bii de munc\u0103 egale, de preg\u0103tire profesional\u0103
  identic\u0103, o parte a poli\u021bi\u0219tilor judiciari, respectiv cei transfera\u021bi
  la DNA beneficiaz\u0103 de avantaje salariale. Dispozi\u021biile art. 28 din OUG\\n\\n43/2002
  privind Parchetul Na\u021bional Anticorup\u021bie, cu modific\u0103rile \u0219i
  complet\u0103rile ulterioare, arat\u0103 c\u0103 ofi\u021berii de poli\u021bie judiciar\u0103
  ce-\u0219i desf\u0103\u0219oar\u0103 activitatea \u00een cadrul \u00een cadrul DNA
  primesc un spor de 30% din salariul de baz\u0103 lunar.\\n\\nIV. Procedura de citare\\n\\n4.1.
  \u00cen temeiul art. 20, alin.4 din O.G. nr.137/2000 privind prevenirea \u0219i
  sanc\u021bionarea tuturor formelor de discriminare, cu modific\u0103rile \u0219i
  complet\u0103rile ulterioare, republicat\u0103, Consiliul Na\u021bional pentru Combaterea
  Discrimin\u0103rii a \u00eendeplinit procedura de citare a p\u0103r\u021bilor.\\n\\n4.2.
  Prin adresa cu nr.2754, din 14.02.2008 a fost citat\u0103 petenta. Prin adresa nr.2752
  din 14.02.2008 a fost citat Ministerul Internelor \u0219i Reformei Administrative,
  prin reprezentant. P\u0103r\u021bile au fost citate pentru termenul stabilit de
  Consiliu, la data de 25.03.2007.\\n\\n4.3. Prin cita\u021bii, Consiliul a solicitat
  p\u0103r\u021bilor s\u0103 \u00ee\u0219i prezinte punctul de vedere precum \u0219i
  orice mijloace de probe referitor la obiectul peti\u021biei, respectiv al sus\u021binerilor.\\n\\nV.
  Sus\u021binerile p\u0103r\u021bilor\\n\\nSus\u021binerile petentului\\n\\n5.1.1.
  Petenta consider\u0103 discriminatorie situa\u021bia creat\u0103 de c\u0103tre Ministerul
  Internelor \u0219i Reformei Administrative, prin care, \u00een condi\u021bii de
  munc\u0103 egale, de preg\u0103tire profesional\u0103 identic\u0103, o parte a poli\u021bi\u0219tilor
  judiciari, respectiv cei transfera\u021bi la DNA beneficiaz\u0103 de avantaje salariale.\\n\\n5.1.2
  Dispozi\u021biile art. 28 din OUG 43/2002 privind Parchetul Na\u021bional Anticorup\u021bie,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare, arat\u0103 c\u0103 ofi\u021berii
  de poli\u021bie judiciar\u0103 ce-\u0219i desf\u0103\u0219oar\u0103 activitatea
  \u00een cadrul \u00een cadrul DNA primesc un spor de 30% din salariul de baz\u0103
  lunar. Petenta consider\u0103 c\u0103 prin acordarea unui spor de 30% numai unei
  anumite categorii dintre ofi\u021berii de poli\u021bie, ace\u0219tia au fost supu\u0219i
  unei discrimin\u0103ri const\u00e2nd \u00eentr-o deosebire pe baza unui criteriu
  ce are drept efect restr\u00e2ngerea exercit\u0103rii, \u00een condi\u021bii de
  egalitate, a drepturilor poli\u021bi\u0219tilor judiciari \u00een domeniul economic,
  respectiv dreptul la salariul egal pentru munc\u0103 egal\u0103.\\n\\nSus\u021binerile
  Ministerului Internelor \u0219i Reformei Administrative\\n\\n5.2.1. Referitor la
  presupusa situa\u021bie discriminatorie instituit\u0103 prin dispozi\u021biile Ordonan\u021bei
  Guvernului nr. 38/2003 privind salarizarea \u0219i alte drepturi ale poli\u021bi\u0219tilor,
  aprobat\u0103 cu modific\u0103ri \u0219i complet\u0103ri prin Legea nr. 353/2003,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare, \u00eentre poli\u021bi\u0219ti
  care desf\u0103\u0219oar\u0103 activit\u0103\u021bi privind prevenirea \u0219i combaterea
  corup\u021biei \u00een r\u00e2ndul personalului M.I.R.A. \u0219i\\n\\ncelal\u021bii
  poli\u021bi\u0219ti, \u00een ceea ce prive\u0219te acordarea sporului de 30%, Ministerul
  Internelor \u0219i Reformei Administrative arat\u0103 urm\u0103toarele:\\n\\n5.2.2.
  Dispozi\u021biile Ordonan\u021bei Guvernului nr. 38/2003 au fost introduse prin
  O.U.G. nr. 120/2005 privind opera\u021bionalizarea Direc\u021biei Generale anticorup\u021bie
  din cadrul Ministerului Internelor \u0219i Reformei Administrative, \u00een considerarea
  Legii nr. 161/2005 privind stabilirea unor m\u0103suri pentru prevenirea \u0219i
  combaterea corup\u021biei \u00een cadrul M.I.R.A., prin care s-a \u00eenfiin\u021bat
  \u00een subordinea acestui minister Direc\u021bia general\u0103 anticorup\u021bie,
  ca structur\u0103 specializat\u0103 pentru prevenirea \u0219i combaterea corup\u021biei
  \u00een r\u00e2ndul personalului propriu, \u0219i prev\u0103d faptul c\u0103 \\\"poli\u021bi\u0219tii
  care desf\u0103\u0219oar\u0103 activit\u0103\u021bi privind prevenirea \u0219i combaterea
  corup\u021biei \u00een r\u00e2ndul personalului M.I.R.A beneficiaz\u0103 de un spor
  de 30% din salariul de baz\u0103\\\". Direc\u021bia general\u0103 anticorup\u021bie
  (DGA) a devenit astfel nu numai un r\u0103spuns la necesitatea unei \\\"cur\u0103\u021benii
  din interior\\\" a institu\u021biei, pe fondul evolu\u021biei democratice a societ\u0103\u021bii
  rom\u00e2ne\u0219ti, dar \u0219i o apropiere evident\u0103 de standardele europene
  anticorup\u021bie.\\n\\n5.2.3. Acordarea unui stimulent financiar pentru personalul
  care urma s\u0103 fac\u0103 parte din noua structur\u0103 \u00eenfiin\u021bat\u0103
  a reprezentat un puternic element care a contribuit \u00een mod efectiv la crearea
  premiselor necesare opera\u021bionaliz\u0103rii DGA, fapt ce a constituit un factor
  definitiv pentru accelerarea luptei \u00eempotriva corup\u021biei \u00een administra\u021bia
  public\u0103. \u00cen cadrul opera\u021bionaliz\u0103rii DGA s-a pus un foarte mare
  accent pe selectarea personalului (din r\u00e2ndul cadrelor M.I.R.A.), urm\u0103rindu-se
  temeinica preg\u0103tire profesional\u0103 a acestuia, integritatea \u0219i cerin\u021ba
  ob\u021binerii de rezultate foarte bune \u00een activitatea desf\u0103\u0219urat\u0103.\\n\\n5.2.4.
  Diferen\u021bierea de tratament aplicat\u0103 poli\u021bi\u0219tilor din cadrul
  DGA are la baz\u0103 criteriul obiectiv principal al specializ\u0103rii activit\u0103\u021bii
  desf\u0103\u0219urate \u00eentr-o nou\u0103 structur\u0103 creat\u0103 \u00een acest
  sens la nivelul M.I.R.A cu atribu\u021bii exclusiv \u00een domeniul prevenirii \u0219i
  combaterei corup\u021biei \u00een r\u00e2ndul personalului propriu, precum \u0219i
  criterii obiective conexe privind preg\u0103tirea profesional\u0103 diferit\u0103,
  specializat\u0103, responsabilitatea diferit\u0103 datorat\u0103 complexit\u0103\u021bii
  activit\u0103\u021bilor desf\u0103\u0219urate \u00een cadrul unei alte structuri
  specializate a Ministerului Internelor \u0219i Reformei Administrative, o formare
  continu\u0103 specific\u0103 pentru activitatea de prevenire \u0219i combatere a
  infrac\u021biunilor de corup\u021bie din r\u00e2ndul personalului propriu, ca \u0219i
  specificul acestor activit\u0103\u021bi, av\u00e2nd \u00een vedere, printre altele,
  \u0219i tipologiile diferite ale cazurilor de corup\u021bie, precum \u0219i persoanele
  implicate \u00een comiterea acestora. Astfel, diferen\u021bierea de tratament la
  acordarea acestui spor este stabilit\u0103 \u00een raport cu situa\u021bia obiectiv\u0103
  diferit\u0103 \u00een care se afl\u0103 personalul care \u00ee\u0219i desf\u0103\u0219oar\u0103
  activitatea \u00een cadrul DGA, ca urmare a modific\u0103rii raportului de serviciu
  al functionarului public cu statutul special, prin mutare de la o alt\u0103 structur\u0103,
  fa\u021b\u0103 de ceilal\u021bi angaja\u021bi ai M.I.R.A., \u00eemprejurare ce justific\u0103
  \u0219i instituirea tratamentului juridic diferit.\\n\\n5.2.5. Acordarea acestui
  spor anumitor poli\u021bi\u0219ti din cadrul Direc\u021biei generale anticorup\u021bie
  nu a fost motivat\u0103 de necesitatea de a asigura incorruptibilitatea acestora,
  ci de specificul mncii pe care ace\u0219tia \u00eei desf\u0103\u0219oar\u0103, respectiv
  activit\u0103\u021bi privind prevenirea \u0219i combaterea corup\u021biei \u00een
  r\u00e2ndul personalului M.I.R.A. Astfel se precizeaz\u0103 faptul c\u0103 structura
  specializat\u0103 a DGA, competen\u021ba specific\u0103 \u00een domeniul prevenirii
  \u0219i combaterei corup\u021biei \u00een r\u00e2ndul\\n\\npersonalului M.I.R.A
  \u0219i activitatea specializat\u0103 \u00een lupta \u00eempotriva corup\u021biei
  din sistemul M.I.R.A. disting acest organ de celelalte structuri aflate \u00een
  subordinea Ministerului Internelor \u0219i Reformei Administrative. Prin urmare,
  poli\u021bi\u0219tii muta\u021bi la DGA \u00ee\u0219i desf\u0103\u0219oar\u0103
  \u00eentreaga activitate definitiv \u00een cadrul unei alte structuri specializate
  create la nivelul M.I.R.A. \u0219i nu al\u0103turi de al\u021bi poli\u021bi\u0219ti
  din cadrul structurilor ministerului mai sus ar\u0103tat.\\n\\n5.2.6. Diferen\u021bierea
  de tratament se justific\u0103 \u00een mod obiectiv \u0219i rezonabil \u0219i datorit\u0103
  unor cauze extrinseci \u0219i intrinseci cu efecte \u0219i consecin\u021be necesare
  \u0219i proportionale cu sursa ca le-a generat. Caracterul necesar al afectelor
  (acordarea unui spor din salariul de baz\u0103) nu le lipse\u0219te de scopul licit.\\n\\n5.2.7.
  Referitor la presupusa situa\u021bie discriminatorie creat\u0103 \u00eentre ofi\u021berii
  \u0219i agen\u021bii de poli\u021bie care constituie poli\u021bia judiciar\u0103
  a Direc\u021biei Na\u021bionale Anticorup\u021bie \u0219i Direc\u021bia de Investigare
  a Infrac\u021biunilor de Criminalitate Organizat\u0103 \u0219i Terorism (D.N.A/D.I.I.C.O.T.)
  fa\u021b\u0103 de de al\u021bi poli\u021bi\u0219ti care nu sunt deta\u0219a\u021bi
  la D.N.A/D.I.I.C.O.T., \u00een ceea ce prive\u0219te acordarea sporului de 30%,
  precum \u0219i stabilirea unui coeficient de multiplicare diferen\u021biat, Ministerul
  Internelor \u0219i Reformei Administrative sus\u021bine urm\u0103toarele:\\n\\n5.2.8.
  Diferen\u021bierea de tratament aplicat\u0103 poli\u021bi\u0219tilor din cadrul
  D.N.A/D.I.I.C.O.T. are la baz\u0103 criteriul obiectiv principal al deta\u0219\u0103rii
  acestora \u00een cadrul unor institu\u021bii care nu fac parte din structura M.I.R.A.,
  respectiv Parchetul de pe l\u00e2ng\u0103 \u00cenalta Curte de Casa\u021bie \u0219i
  Jus\u021bitie, precum \u0219i criteriilor obiective conexe privind preg\u0103tirea
  profesional\u0103 diferit\u0103, specializat\u0103, responsabilitatea diferit\u0103
  datorat\u0103 complexit\u0103\u021bii activit\u0103\u021bilor desf\u0103\u0219urate
  de institu\u021bia \u00een care sunt deta\u0219a\u021bi, o formare anume pentru
  activitatea de urm\u0103rire \u0219i investigare a infrac\u021biunilor de corup\u021bie
  \u0219i criminalitate organizat\u0103 \u0219i terorism, expres prev\u0103zute de
  lege, ca \u0219i specificul acestor activit\u0103\u021bi, av\u00e2nd \u00een vedere,
  printre altele, \u0219i tipologiile diferite ale cazurilor de corup\u021bie. Astfel,
  diferen\u021bierea de tratament la cordarea drepturilor salariale este stabilit\u0103
  \u00een raport cu situa\u021bia obiectiv\u0103 diferit\u0103 \u00een care se afl\u0103
  personalul care \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea \u00een cadrul
  D.N.A/D.I.I.C.O.T. ca urmare a modific\u0103rii raportului de serviciu al func\u021bionarului
  public cu statut special fa\u021b\u0103 de ceila\u0219i angaja\u021bi ai M.I.R.A.,
  \u00eemprejurare ce justific\u0103 \u0219i instituirea tratamentului jurid diferit.\\n\\n5.2.9.
  Stabilirea salariului de baz\u0103, precum \u0219i acordarea unor sporuri \u0219i
  alte drepturi poli\u021bi\u0219tilor din cadrul D.N.A/D.I.I.C.O.T. nu a fost motivat\u0103
  de necesitatea de a asigura incoruptibilitatea acestora ci de specificul muncii
  pe care ace\u0219tia il desf\u0103\u0219oar\u0103, respectiv activit\u0103\u021bi
  privind prevenirea \u0219i combaterea corup\u021biei, respectiv, investigarea anumitor
  infrac\u021biuni de criminalitate organizat\u0103 \u0219i terorism, sub directa
  conducere, supraveghere \u0219i control al procurorilor D.N.A/D.I.I.C.O.T. Ofi\u021berii
  \u0219i agen\u021bii de poli\u021bie judiciar\u0103 deta\u0219a\u021bi la Direc\u021bia
  Na\u021bional\u0103 Anticorup\u021bie \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea
  numai \u00een cadrul acestei institu\u021bii, sub autoritatea exclusiv\u0103 a procurorului
  \u0219ef al acestei direc\u021bii. Ofi\u021berii \u0219i agen\u021bii de poli\u021bie
  judiciar\u0103 afla\u021bi \u00een coordonarea D.I.I.C.O.T., efectueaz\u0103 numai
  acele acte de cercetare penal\u0103 dispuse de procurorii Direc\u021biei de Investigare
  a Infrac\u021biunilor de Criminalitate Organizat\u0103 \u0219i Terorism, sub directa
  coordonare \u0219i controlul nemijlocit al acestora.\\n\\n5.2.10. \u00cen raport
  de calitatea poli\u021bi\u0219tilor deta\u0219a\u021bi la D.N.A/D.I.I.C.O.T., salarizarea
  acestora se face potrivit normelor cuprinse \u00een anexa 4 - privind\\n\\nsalarizarea
  poli\u021bi\u0219tilor care \u00eendeplinesc func\u021bii \u00een afara Ministerului
  Internelor \u0219i Reformei Administrative - din O.G. 38/2003, care la pct. 1 statueaz\u0103
  c\u0103 \\\"poli\u021bi\u0219tii deta\u0219a\u021bi \u00een baza reglement\u0103rilor
  \u00een vigoare s\u0103 \u00eendeplineasc\u0103 func\u021bii \u00een afara Ministerului
  Internelor \u0219i Reformei Administrative beneficiaz\u0103 de urm\u0103toarele
  drepturi salariale:\\n\\na) salariul de baz\u0103 al func\u021biei \u00eendeplinite,
  sporul de vechime \u00een munc\u0103, indemniza\u021bii, premii, sporuri \u0219i
  alte drepturi care se acord\u0103 personalului civil din unitatea unde \u00ee\u0219i
  desf\u0103\u0219oar\u0103 activitatea, potrivit legisla\u021biei care se aplic\u0103
  \u00een unit\u0103\u021bile respective;\\n\\nb) salariul pentru gradul profesional
  \u0219i grad\u0103\u021biile calculate la acesta, potrivit legisla\u021biei care
  se aplic\u0103 poli\u021bi\u0219tilor....\\\".\\n\\nDe altfel, \u00een ceea ce prive\u0219te
  drepturile b\u0103neste cuvenite poli\u021bi\u0219tilor deta\u0219a\u021bi \u00een
  cadrul altor institu\u021bii, Ministerului Internelor \u0219i Reformei Administrative
  \u00eei revin doar obliga\u021bii privind stabilirea \u0219i plata drepturilor de
  pensie, a ajutoarele acordate la \u00eencetarea raporturilor de serviciu \u0219i
  a drepturilor b\u0103neste reprezentate de salariul pentru gradul profesional \u0219i
  grad\u0103\u021biile calculate la cesta (pct.7 anexa 4 a O.G. nr. 38/2003, cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare).\\n\\nVI. Motivele de fapt \u0219i de drept\\n\\nVI.
  Motivele de fapt \u0219i de drept\\n\\n6.1. \u00cen fapt, Colegiul Director re\u021bine
  c\u0103, pe fond, petenta existen\u021ba unei discrimin\u0103ri, sub aspectul salariz\u0103rii,
  \u00eentre poli\u021bi\u0219tii judiciari deta\u0219a\u021bi \u0219i poli\u021bi\u0219tii
  judiciari care \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea \u00een cadrul
  inspectoratelor jude\u021bene de poli\u021bie. Astfel, de\u0219i ofi\u021berii \u0219i
  agen\u021bii de poli\u021bie din cadrul serviciilor operative (poli\u021bia judiciar\u0103-economic,
  judiciar, ordine public, circula\u021bie rutier\u0103), nedeta\u0219a\u021bi \u00een
  structurile D.N.A, D.G.A. \u0219i D.I.I.C.O.T, execut\u0103 activit\u0103\u021bi
  operative similare pentru prevenirea, descoperirea \u0219i cercetarea infrac\u021biunilor,
  specifice linilor proprii de munc\u0103, cu cele executate de poli\u021bi\u0219tii
  deta\u0219a\u021bi \u00een structurile mai sus ar\u0103tate, se aplic\u0103 un tratament
  diferentiat sub aspectul salariz\u0103rii.\\n\\n7.1. \u00cen drept, Colegiul Director,
  \u00een analiza actelor sau faptelor de discriminare, se raporteaz\u0103 la Curtea
  European\u0103 a Drepturilor Omului, care, legat de articolul 14 privind interzicerea
  discrimin\u0103rii, a apreciat c\u0103 diferen\u021ba de tratament devine discriminare,
  \u00een sensul articolului 14 din Conven\u021bie, atunci c\u00e2nd se induc distinc\u021bii
  \u00eentre situa\u021bii analoage \u0219i comparabile f\u0103r\u0103 ca acestea
  s\u0103 se baseze pe o justificare rezonabil\u0103 \u0219i obiectiv\u0103. Instan\u021ba
  european\u0103 a decis \u00een mod constant c\u0103 pentru ca o asemenea \u00eenc\u0103lcare
  s\u0103 se produc\u0103 \u201etrebuie stabilit c\u0103 persoane plasate \u00een
  situa\u021bii analoage sau comparabile, \u00een materie, beneficiaz\u0103 de un
  tratament preferen\u021bial \u0219i c\u0103 aceast\u0103 distinc\u021bie nu-\u0219i
  g\u0103se\u0219te nicio justificare obiectiv\u0103 sau rezonabil\u0103 (vezi CEDH,
  18 februarie 1991, Fredin c/Suede, parag.60, 23 iunie 1993, Hoffman c/Autriche,
  parag.31, 28 septembrie 1995.\\n\\nSpadea et Scalambino c/Italie, 22 octombrie 1996
  Stubbings et autres c/Royaume-Uni, parag.75)\\n\\n7.2. \u00cen acela\u0219i sens,
  Curtea European\u0103 de Justi\u021bie a statutat principiul egalit\u0103\u021bii
  ca unul din principiile generale ale dreptului comunitar. \u00cen sfera dreptului
  comunitar, principiul egalit\u0103\u021bii exclude ca situa\u021biile comparabile
  s\u0103 fie tratate diferit \u0219i situa\u021biile diferite s\u0103 fie tratate
  similar, cu excep\u021bia cazului \u00een care tratamentul este justificat obiectiv.
  (vezi Sermide SpA v. Cassa Conguaglio Zucchero and others, Cauza 106/83. 1984 ECR
  4209, para 28; Koinopraxia Enoseon Georgikon Synetairismon Diacheir iseos Enchorion
  Proionton Syn PE (KYDEP) v. Council of the European Union and Commission of the
  European Communities, Cauza C-146/91, 1994 ECR I-4199; Cauza C-189/01 Jippes and
  others 2001 ECR I-5689, para 129; Cauza C-149/96 Portugal vs. Council 1999 ECR I-8395
  oara.91)\\n\\n7.3. Refin\u00e2nd \u00een coroborare cu aceste aspecte defini\u021bia
  discrimin\u0103rii, astfel cum este reglementat\u0103 prin articolul 2 alin.1 din
  O.G.137/2000 cu modific\u0103rile \u0219i complet\u0103rile ulterioare, republicat\u0103,
  Colegiul Director se raporteaz\u0103 la modul \u00een care sunt \u00eentrunite cumulativ
  elementele constitutive ale articolului 2. Pentru a ne situa \u00een domeniul de
  aplicare al art.2, alin.1 deosebirea, excluderea, restric\u021bia sau preferin\u021ba
  trebuie s\u0103 aib\u0103 la baz\u0103 unul dintre criteriile prev\u0103zute de
  c\u0103tre art. 2, alin. 1, \u0219i trebuie s\u0103 se refere la persoane aflate
  \u00een situa\u021bii comparabile dar care sunt tratate \u00een mod diferit datorit\u0103
  apartenen\u021bei lor la una dintre categoriile prev\u0103zute \u00een textul de
  lege men\u021bionat anterior. A\u0219a cum reiese din motiva\u021bia invocat\u0103
  mai devreme pentru a ne g\u0103si \u00een situa\u021bia unei fapte de discriminare
  trebuie s\u0103 avem dou\u0103 situa\u021bii comparabile la care tratamentul aplicat
  s\u0103 fi fost diferit. Subsecvent, tratamentul diferen\u021biat trebuie s\u0103
  urmareaasc\u0103 sau s\u0103 aib\u0103 ca efect restr\u00e2ngerea ori \u00eenl\u0103turarea
  recunoa\u0219terii, folosin\u021bei sau exercit\u0103rii, \u00een condi\u021bii
  de egalitate, a drepturilor omului \u0219i a libert\u0103\u021bilor fundamentale
  ori a drepturilor recunoscute de lege, \u00een domeniul politic, economic, social
  \u0219i cultural sau \u00een orice alte domenii ale vie\u021bii publice.\\n\\n7.4.
  Curtea European\u0103 a Drepturilor Omului a apreciat prin jurispruden\u021ba sa,
  c\u0103 statele contractante dispun de o anumit\u0103 marj\u0103 de apreciere pentru
  a determina dac\u0103 \u0219i \u00een ce m\u0103sur\u0103 diferen\u021bele \u00eentre
  situa\u021bii analoage sau comparabile sunt de natur\u0103 s\u0103 justifice distinctiile
  de tratament juridic aplicate. (22 octombrie 1996 Stubbings et autres c/Royaume-Uni,
  parag.75)\\n\\n7.5. Av\u00e2nd \u00een vedere aspectele de mai sus precum \u0219i
  peti\u021bia dat\u0103, Colegiul Director al Consiliului Na\u021bional pentru Combaterea
  Discrimin\u0103rii trebuie s\u0103 analizeze \u00een ce m\u0103sur\u0103 obiectul
  peti\u021biei este de natur\u0103 s\u0103 cad\u0103 sub inciden\u021ba art.2 alin.1
  al O.G. nr.137/2000, republicat\u0103.\\n\\n7.6. \u00cen analiza peti\u021biei deduse
  solu\u021bion\u0103rii, trebuie plecat de la premisa ca raportat la obiectul sesiz\u0103rilor,
  Colegiul Director analizeaz\u0103 \u00een ce m\u0103sur\u0103 obiectul acestora
  este de natur\u0103 s\u0103 cad\u0103 sub inciden\u021ba art.2 al O.G. nr.137/2000,
  republicat\u0103, sub aspectul scopului sau efectului creat, care a dat na\u0219tere
  sau nu, unei circumstan\u021be concretizate generic \u00een restric\u021bie, excudere,
  deosebire, preferin\u021b\u0103, \u0219i care circumstan\u021biat la situa\u021bia
  petentei (petentului)/peten\u021bilor (petentelor), ipso facto, poate s\u0103 \u00eembrace
  forma unui tratament diferit, indus \u00eentre persoane care se afl\u0103 \u00een
  situa\u021bii analoage sau comparabile, datorit\u0103 unor criterii\\n\\ndeterminate
  \u0219i care are ca scop sau ca efect restr\u00e2ngerea ori \u00eenl\u0103turarea
  recunoa\u0219terii, folosin\u021bei sau exercit\u0103rii, \u00een condi\u021bii
  de egalitate, a drepturilor omului \u0219i a libert\u0103\u021bilor fundamentale
  ori a drepturilor recunoscute de lege, \u00een domeniul politic, economic, social
  \u0219i cultural sau \u00een orice alte domenii ale vie\u021bii publice.\\n\\n7.7.
  Colegiul Director al Consiliului Na\u021bional pentru Combaterea Discrimin\u0103rii
  nu analizeaz\u0103 modul de stabilire sui generis, prin lege a unor drepturi \u00een
  favoarea unor categorii de persoane \u00een mod diferit fa\u021b\u0103 de alte categorii
  ori nereglementarea de legiuitor a unor aspecte care \u021bin de statutul unei categorii
  de persoane. Din acest punct de vedere, examinarea solu\u021biilor legislative per
  se, alese de c\u0103tre legiuitor \u0219i conformitatea acestora cu principiul egalit\u0103\u021bii
  statuat \u00een Constitu\u021bia Rom\u00e2niei, revine Cur\u021bii Constitu\u021bionale.\\n\\n7.8.
  Re\u021b\u00een\u00eend \u00een coroborare cu aceste aspecte defini\u021bia discrimin\u0103rii,
  astfel cum este reglementat\u0103 prin articolul 2 alin.1 din O.G.137/2000 cu modific\u0103rile
  \u0219i complet\u0103rile ulterioare, republicat\u0103, Colegiul Director se raporteaz\u0103
  la modul \u00een care sunt \u00eentrunite cumulativ elementele constitutive ale
  articolului 2. Din acest punct de vedere Colegiul Director, corelativ obiectului
  peti\u021biei, urmeaz\u0103 a analiza incidenta \u00een c\u00e2mpul unor categorii
  de persoane plasate \u00een situa\u021bii analoage sau comparabile. Curtea European\u0103
  a Drepturilor Omului \u00een analiza raportului de analogie sau comparabilitate
  a unor categorii profesionale a apreciat asem\u0103n\u0103rile sau diferen\u021bele
  ce decurg din statutul profesiilor, condi\u021biile de intrare \u00een profesie,
  natura func\u021biilor \u00eendeplinite, modul de exercitare a func\u021biilor respective
  etc. (vezi cauza VAN DER MUSSELE v. BELGIUM, Application no. 8919/80, JUDGMENT,
  23 November 1983, parag. 46). \u00cen acela\u0219i sens, Consiliul National pentru
  Combaterea Discrimin\u0103rii, \u00een aprecierea raportului de analogie a unor
  categorii profesionale a analizat modalitatea de organizare, admitere \u00een profesie,
  definitivare, mandat, corpul de drepturi \u0219i obliga\u021bii, sfera diferit\u0103
  a activit\u0103\u021bilor desf\u0103\u0219urate, tangen\u021ba cu diferitele ramuri
  de drept, etc. (vezi CNCD, spre exemplu Hot\u0103r\u00e2rea nr. 334 din 08.10.2007,
  Hotararea nr. 333 din 08.10. 2007, Hot\u0103r\u00e2rea nr. 249 din 27.08.2007)\\n\\n7.9.
  Colegiul Director observ\u0103 c\u0103, \u00een cauz\u0103, se invoc\u0103 raportul
  de analogie sau comparabilitate \u00eentre politi\u0219tii judiciari deta\u0219a\u021bi
  \u00een structuri specializate (D.N.A., D.G.A., D.I.I.C.O.T.), angrena\u021bi \u00een
  activit\u0103\u021bile de descoperire \u0219i instrumentare a faptelor de corup\u021bie
  \u0219i politi\u0219tii judiciari care \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea
  \u00een cadrul inspectoratelor jude\u021bene de poli\u021bie.\\n\\n7.10. Or, sub
  acest aspect, Colegiul Director re\u021bine c\u0103 \u00een doctrina de specialitate,
  deta\u0219area este definit\u0103 ca actul prin care se dispune schimbarea temporar\u0103
  a locului de munc\u0103 din dispozi\u021bia angajatorului, la un alt angajator.
  Conjugarea dintre men\u021binerea contractului de munc\u0103 cu angajatorul \u00een
  care salariatul \u00een cauz\u0103 este \u00eencadrat \u0219i cesiunea lui temporar\u0103
  c\u0103tre un al angajator reprezint\u0103 caracteristica esen\u021bial\u0103 a
  deta\u0219\u0103rii, din care decurg celalalte tr\u0103s\u0103turi definitiorii
  ale sale. (Vezi Alexandru Ticlea, Tratat de dreptul muncii, Editia a II a, Universul
  Juridic, Bucure\u0219ti, 2007, pag. 529)\\n\\n7.11. Pe de alt\u0103 parte, Colegiul
  Director re\u021bine c\u0103 modificarea raporturilor de munc\u0103 se poate realiza
  prin intermediul deta\u0219\u0103rii, art. 45 alin.1 din Codul Muncii prev\u0103z\u00e2nd
  c\u0103 \u201eDeta\u0219area este actul prin care se dispune schimbarea\\n\\ntemporar\u0103
  a locului de munc\u0103, din dispozi\u021bia angajatorului, la un alt angajator,
  \u00een scopul execut\u0103rii unor lucr\u0103ri \u00een interesul acestuia\u201d.
  Consecin\u021bele juridice ce decurg din deta\u0219are, \u00een opinia Colegiului
  Director, sunt re\u021binute \u00een raport de obiectivare, acestea fiind, de asemenea
  prev\u0103zute prin lege.\\n\\n7.12. Re\u021bin\u00e2nd prevederile Codului de Procedur\u0103
  Penal\u0103, care definesc organele de cercetare penal\u0103 \u00een art. 201 alin2.
  \u00eentre care la lit. a \u201eorganele de cercetare ale politiei judiciare, Colegiul
  Director observ\u0103 c\u0103 potrivit alin.3: \u201eCa organe de cercetare ale
  politiei judiciare func\u021bioneaz\u0103 lucr\u0103tori specializa\u021bi din Ministerul
  Administra\u021biei \u0219i Internelor, desemna\u021bi nominal de ministrul administra\u021biei
  \u0219i internelor, cu avizul conform al procurorului general al Parchetului de
  pe l\u00e2ng\u0103 \u00cenalta Curte de Casa\u021bie \u0219i Justi\u021bie, \u0219i
  \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea sub autoritatea procurorului
  general al Parchetului de pe l\u00e2ng\u0103 \u00cenalta Curte de Casa\u021bie \u0219i
  Justi\u021bie. Retragerea avizului conform al procurorului general al Parchetului
  de pe l\u00e2ng\u0103 \u00cenalta Curte de Casa\u021bie \u0219i Justi\u021bie conduce
  la \u00eencetarea calit\u0103\u021bii de lucr\u0103tor \u00een cadrul politiei judiciare.
  C\u00e2nd Legea special\u0103 prevede o procedur\u0103 diferit\u0103 de desemnare
  \u0219i func\u021bionare a organelor de poli\u021bie judiciar\u0103, se aplic\u0103
  dispozi\u021biile legii speciale.\\n\\n7.13. Fa\u021b\u0103 de acest ultim aspect,
  \u00een interpretarea acestei prevederi legale, Colegiul Director, este de opinie
  c\u0103 se poate re\u021bine incidenta prevederilor Ordonan\u021bei de Urgen\u021b\u0103
  nr. 63 din 28 iunie 2003 privind organizarea \u0219i func\u021bionarea Ministerului
  Administra\u021biei \u0219i Internelor, respectiv \u00eenfiin\u021barea Direc\u021biei
  general\u0103 anticorup\u021bie, cu modific\u0103rile \u0219i complet\u0103rile
  ulterioare; Legii nr. 508 din 08 din 17 noiembrie 2004, privind \u00eenfiin\u021barea,
  organizarea \u0219i func\u021bionarea \u00een cadrul Ministerului Public a Direc\u021biei
  de Investigare a Infrac\u021biunilor de Criminalitate Organizat\u0103 \u0219i Terorism,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare; Ordonan\u021bei de Urgen\u021b\u0103
  nr. 43 din 4 aprilie 2002 privind Departamentul Na\u021bional Anticorup\u021bie,
  cu modific\u0103rile \u0219i complet\u0103rile ulterioare.\\n\\n7.14. Or, de plano,
  sub aspectul activit\u0103\u021bilor desf\u0103\u0219urate ca organe de cercetare
  ale politiei judiciare, Colegiul director este de opinie c\u0103 se poate re\u021bine
  plasarea \u00eentr-un raport de analogie sau comparabilitate a lucr\u0103torilor
  specializa\u021bi din cadrul Ministerului Internelor. Sub aspectul salariz\u0103rii
  \u00eens\u0103, Colegiul Director este de opinie c\u0103, \u00een spet\u0103, deta\u0219area
  determin\u0103 consecin\u021be juridice diferite, \u00een raport cu ofi\u021berii
  judiciari \u0219i agen\u021bii de poli\u021bie nedeta\u0219a\u021bi fa\u021b\u0103
  de cei deta\u0219a\u021bi, av\u00e2nd \u00een vedere ca efectul generat de aceasta
  prespune, \u00eentre altele, schimbarea locului de munc\u0103 la un alt angajator.
  \u00cen acest sens, Colegiul Director ia act de statuarea Cur\u021bii Constitu\u021bionale
  cu privire la dispozi\u021biile din Codul Muncii referitoare la deta\u0219are prin
  care arat\u0103 c\u0103 acesta sunt \u201e\u00een deplina concordan\u021ba cu prevederile
  art. 16 alin. (1) din Constitu\u021bie, deoarece nu \u00eencalc\u0103 principiul
  egalit\u0103\u021bii cet\u0103\u021benilor \u0219i nu instituie privilegii sau discrimin\u0103ri.
  To\u021bi salaria\u021bii delega\u021bi, deta\u0219a\u021bi sau trecu\u021bi temporar
  \u00een alt\u0103 munc\u0103, \u00een sensul dispozi\u021biilor legale criticate,
  beneficiaz\u0103 de tratament juridic identic. P\u0103strarea de c\u0103tre ace\u0219ti
  salaria\u021bi a func\u021biilor \u0219i a salariilor avute anterior demonstreaz\u0103
  tratamentul lor juridic egal \u0219i \u00een raport cu ceilal\u021bi salaria\u021bi
  care nu au fost delega\u021bi sau deta\u0219a\u021bi, ci men\u021binu\u021bi la
  locul de munc\u0103 ini\u021bial. Curtea nu poate re\u021bine nici \u00eengr\u0103direa
  exerci\u021biului dreptului la protec\u021bia social\u0103 a muncii, \u00eentruc\u00e2t
  p\u0103strarea func\u021biei \u0219i a salariului avute anterior sau chiar plata
  unui salariu mai mare \u00een cazul \u00een care noua munc\u0103 este\\n\\nmai bine
  remunerat\u0103 constituie garan\u021bii legale ale dreptului la protec\u021bia
  social\u0103 a muncii, drept consfin\u021bit \u00een art. 38 alin. (2) din Constitu\u021bie\\\".\\n\\n7.15.
  Din acest punct de vedere, \u00een sensul re\u021binut de Curtea Constitu\u021bional\u0103,
  Colegiul Director este de opinie c\u0103, deta\u0219area, delegarea, mutarea determin\u0103,
  stricto senso, sub aspectul salariz\u0103rii, pozi\u021bionarea diferit\u0103 a
  categoriilor de persoane indicate de peten\u021b\u0103 (categoriile socio-profesionale),
  legiulitorul reglementand expres prin acte normative cu caracter special drepturile
  salariale ale personalului care \u00ee\u0219i desf\u0103\u0219oar\u0103 activitatea
  \u00een structuri specializezate, astfel cum sunt cele indicate de peten\u021b\u0103.
  Colegiul Director ia act, \u00een acest sens, de Decizia nr. 728 din 24 octombrie
  2006 prin care Curtea Constitu\u021bional\u0103 re\u021bine \u201ea\u0219a cum de
  altfel a statuat \u00een numeroase r\u00e2nduri \u00een jurispruden\u021ba sa, c\u0103
  sporurile, adaosurile \u0219i alte drepturi salariale suplimentare nu reprezint\u0103
  drepturi fundamentale. Instituirea \u0219i diminuarea acestora, acordarea \u00eentr-o
  anumit\u0103 perioad\u0103 de timp, modificarea lor ori \u00eencetarea acord\u0103rii,
  stabilirea categoriilor de personal salarizat care beneficiaz\u0103 de acestea,
  ca \u0219i a altor condi\u021bii \u0219i criterii de acordare \u021bin de competen\u021ba
  \u0219i de op\u021biunea exclusiv\u0103 a legiulitorului, cu singura condi\u021bie
  de ordin constitucional ca m\u0103surile dispuse s\u0103 vizeze deopotriv\u0103
  toate categoriile de personal care se afl\u0103 \u00eentr-o situa\u021bie identic\u0103\u201d.\\n\\n7.16.
  Or, din acest punct de vedere, Colegiul Director este de opinie c\u0103 ipso jure,
  raportul de analogie, sub aspectul salariz\u0103rii, se circumstan\u021biaz\u0103
  \u00een mod individualizat doar \u00eentre categoriile de persoane care \u00ee\u0219i
  desf\u0103\u0219oar\u0103 activitatea dup\u0103 caz, \u00een cadrul D.N.A., respectiv
  D.G.A., respectiv D.I.I.COT. Astfel, \u00een privin\u021ba acestor categorii de
  persoane, legiulitorul, prin acte normative diferite, a prev\u0103zut sporuri, adaosuri
  sau alte drepturi salariale, condi\u021bii \u0219i criterii de acordare corelativ
  categoriilor de personal din cadrul structurilor \u00een cauz\u0103. Acestea vizeaz\u0103
  deopotriv\u0103 categorii de personal care se afl\u0103 \u00een situa\u021bie identic\u0103.
  Colegiul Director re\u021bine c\u0103 dispozi\u021biile legale \u00een materia deta\u0219\u0103rii,
  astfel cum sunt prev\u0103zute \u00een Codul Muncii, art. 47 alin.1 prev\u0103d
  c\u0103 \u201eDrepturile cuvenite salariatului deta\u0219at se acord\u0103 de angajatorul
  la care s-a dispus deta\u0219area\u201d. Potrivit alin.2 \u201ePe durata deta\u0219\u0103rii
  salariatul beneficiaz\u0103 de drepturile care \u00eei sunt mai favorabile, fie
  de drepturile de la angajatorul care a dispus deta\u0219area, fie de drepturile
  de la angajatorul la care este deta\u0219at\u201d.\\n\\n7.17. Spre deosebire de
  aceste categorii, ofiterii de poli\u021bie judiciar\u0103 \u0219i agen\u021bii de
  poli\u021bie nedeta\u0219a\u021bi, nedelega\u021bi ori care nu au fost trecu\u021bi
  temporar \u00een alt\u0103 munc\u0103 beneficiaz\u0103 de drepturile salariale prev\u0103zute
  de actele normative incidente situa\u021biei lor corelative, \u00een spet\u0103
  O.G. nr. 38 din 30 ianuarie 2003, privind salarizarea \u0219i alte drepturi ale
  politistilor, cu modific\u0103rile \u0219i complet\u0103rile ulterioare.\\n\\n7.17.
  Aceast\u0103 \u00eemprejurare reprezint\u0103 expresia principiului egalit\u0103\u021bii
  ce nu se opune ca o lege s\u0103 stabileasc\u0103 reguli diferite \u00een raport
  cu persoane care se afl\u0103 \u00een situa\u021bii diferite. (Decizia nr.256 din
  17 iunie 1997, Decizia nr.154/2001, M.Of. nr.387/2001, CDH 2001, p.914\u2013915)
  \u00cen acest sens, sunt admise solu\u021bii legislative diferite pentru situa\u021bii
  diferite. (Decizia nr.113/2001, M.Of. nr.317/2001, CDH 2001, p.757; Decizia nr.139/2001,
  M.Of. nr.330/2001, CDH 2001, p.851) Curtea Constitu\u021bional\u0103 a re\u021binut
  c\u0103 instituirea unor reglement\u0103ri juridice diferen\u021biate \u00een privin\u021ba
  drepturilor \u0219i obliga\u021biilor unor categorii de cet\u0103\u021beni care
  se\\n\\naf\u0103 \u00een situa\u021bii diferite nu este contrar\u0103 art.16 alin
  (1) din Constitu\u021bie. (Decizia nr.294/2001, M.Of.nr.21/2002)\\n\\n7.18. De altfel
  Colegiul Director re\u021bine c\u0103 \u00een privin\u021ba aspectelor sesizate
  \u00een prezenta peti\u021bie, s-a pronun\u021bat anterior, \u00een mai multe r\u00e2nduri,
  constatat\u00e2nd c\u0103 nu se \u00eentunesc cumulativ elementele constitutive
  cuprinse \u00een art.2 din O.G. 137/2000 \u0219i subsecvent nu poate fi re\u021binut\u0103
  existen\u021ba unei situa\u021bii de diferen\u021biere din perspectiva principiului
  egalit\u0103\u021bii \u0219i al nediscrimin\u0103rii. \u00cen acest sens au fost
  adoptate de c\u0103tre Colegiul Director Hot\u0103r\u00e2rea nr. 401/12.11.2007,
  Hot\u0103r\u00e2rea nr. 418/28.11.2007, Hot\u0103r\u00e2rea nr. 419/27.11.2007,
  Hot\u0103r\u00e2rea nr.77/13.02.2008, Hot\u0103r\u00e2rea nr. 118/27.02.2008 \u0219i
  altele.\\n\\nFa\u021b\u0103 de cele de mai sus, \u00een temeiul art. 20 alin. (2)
  din O.G. 137/2000 privind prevenirea \u0219i sanc\u021bionarea tuturor formelor
  de discriminare, republicat\u0103, cu unanimitate de voturi ale membrilor prezen\u021bi
  la \u0219edin\u021b\u0103,\\n\\nCOLEGIUL DIRECTOR\\nHOT\u0102R\u0102\u0218TE:\\n\\n1.
  aspectele sesizate nu constituie acte de discriminare conform Ordonan\u021bei de
  Guvern nr.137/2000, privind prevenirea \u0219i sanc\u021bionarea tuturor formelor
  de discriminare, cu modific\u0103rile \u0219i aprob\u0103rile ulterioare, republicat\u0103;\\n   2.
  clasarea dosarului;\\n   3. o copie a hot\u0103r\u00e2rii se va transmite p\u0103r\u021bilor\\n\\nVII.
  Modalitatea de plat\u0103 a amenzii\\nNu este cazul\\n\\nVIII. Calea de atac \u0219i
  termenul \u00een care se poate exercita\\n\\nPrezenta hot\u0103r\u00e2re poate fi
  atacat\u0103 la instan\u021ba de contencios admsinistrativ, potrivit O.G. 137/2000
