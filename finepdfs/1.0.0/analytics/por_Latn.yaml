  335365.51            |\\n\\nRequerente: SECRETARIA MUNICIPAL DE ADMINISTRA\u00c7\u00c3O
  E CNPJ:13.827.019/0001-58\\nTipo do requerente: Pessoa Jur\u00eddica\\nEndere\u00e7o:
  Pr\u00e7. C\u00f4nego Jos\u00e9 Louren\u00e7o, S/N, Centro, DOM MACEDO COSTA-BA\\nPreposto:
  D\u00c9BORA MARTINS FONSECA CPF: 025.354.425-40\\n\\nS\u00famula do processo\\n\\nSOLICITA
  PRESTA\u00c7\u00c3O DE SERVI\u00c7O DE TRANSPORTE DOS ALUNOS MATRICULADOS NA REDE
  MUNICIPAL E ESTADUAL DE ENSINO DE DOM MACEDO COSTA-BA, INCLUSIVE PORTADORES DE NECESSIDADES
  ESPECIAIS, AT\u00c9 O FINAL DO EXERC\u00cdCIO DE 2013\\\" SENDO FORMALIZADO O DE
  N\u00ba 163/2014.\\n\\nMARCELO OLIVEIRA SANTOS\\nASSISTENTE ADMINISTRATIVO\\n\\nESTADO
  DA BAHIA\\nMunic\u00edpio de Dom Macedo Costa\\nPrefeitura Municipal\\n\\nDom Macedo
  Costa \u2013 Ba, 10 de dezembro de 2016.\\n\\nOf\u00edcio n\u00ba 031/2016.\\n\\nSenhor
  Prefeito,\\n\\nDirijo-me a Vossa Excel\u00eancia para apresentar a necessidade de
  renova\u00e7\u00e3o de contrato n\u00ba 163/2014.\\n\\nConsiderando que foi instaurado
  processo administrativo para atender necessidade de \u201cpresta\u00e7\u00e3o de
  servi\u00e7o de transporte dos alunos matriculados na rede municipal e estadual
  de ensino de Dom Macedo Costa \u2013 BA, inclusive portadores de necessidades especiais\u201d
  sendo formalizado o contrato de n\u00ba 163/2014.\\n\\nConsiderando que foi solicitado
  pelo prefeito eleito, em reuni\u00e3o de transmiss\u00e3o de governo, conforme c\u00f3pia
  da ata que segue anexa, a renova\u00e7\u00e3o do contrato para presta\u00e7\u00e3o
  de servi\u00e7o de transporte escolar. Desta forma, solicito formaliza\u00e7\u00e3o
  de termo aditivo para prorroga\u00e7\u00e3o da vig\u00eancia do contrato 163/2014,
  pelo per\u00edodo de 12 (doze) meses (janeiro \u00e0 dezembro de 2017), perfazendo
  o valor de R$335.365,51 (trezentos e trinta e cinco mil, trezentos e sessenta e
  cinco reais e cinquenta e um centavos).\\n\\nNa oportunidade, solicitamos o encaminhamento
  para o setor respons\u00e1vel para o devido procedimento.\\n\\nAtenciosamente,\\n\\nD\u00e9bora
  Martins Fons\u00eaca\\nSecret\u00e1ria Municipal de Administra\u00e7\u00e3o e Planejamento\\n\\nExmo.
  Sr.\\nJOS\u00c9 DOS SANTOS FR\u00d3ES\\nDD. Prefeito Municipal\\nDom Macedo Costa
  \u2013 Ba.\\n\\nAos cinco dias do m\u00eas de dezembro do ano de dois mil e dezesseis,
  reuniram-se na Sala de Reuni\u00f5es da Prefeitura Municipal de Dom Macedo Costa
  \u2013 Bahia, situada \u00e0 Pra\u00e7a C\u00f4nego Jos\u00e9 Louren\u00e7o, s/n\u00ba
  - Centro \u2013 Dom Macedo Costa, a Comiss\u00e3o de Transmiss\u00e3o de Governo,
  composta atrav\u00e9s do Decreto Municipal n\u00ba 058/2016, de 30 de novembro de
  2016, publicado em Di\u00e1rio Oficial pr\u00f3prio na mesma data, presentes: D\u00e9bora
  Martins Fons\u00eaca - Presidente da Comiss\u00e3o; Maur\u00edcio Ornelas Lemos
  \u2013 OAB/BA 35.465; Lu\u00eds Carlos Lima Sales; Luiz Gomes Ferreira Neto \u2013
  CREA 40892/D; Noelice Rodrigues Souza; Sueli Campos Sobral de Andrade; Jucimary
  Silva Almeida \u2013 CRC-BA 029896/O-1; Andr\u00e9ia Prazeres Bastos de Souza \u2013
  OAB/BA 17.961 (Representante do Prefeito Eleito); Edson Moura Costa \u2013 CRC BA
  009548/0 (Representante do Prefeito Eleito); Clovis Ezequiel dos Santos (Representante
  do Prefeito Eleito); Alex Pereira Piton (Representante do Prefeito Eleito); Paulo
  Ricardo Souza Soares (Representante do Prefeito Eleito); Acson da Silva (Representante
  do Prefeito Eleito); Egnaldo Piton Moura (Prefeito eleito); Manoel Augusto Vieira;
  Leonardo de Jesus Santos; Geraldo Jorge Souza Sales. Inicialmente, foi entregue
  o Of\u00edcio ADM n\u00ba 030/2016, com documenta\u00e7\u00e3o descrita no referido
  expediente, e informando verbalmente que a Lei Or\u00e7ament\u00e1ria Anual para
  o Exerc\u00edcio de 2017, ainda n\u00e3o foi aprovada pelo Legislativo, portanto,
  ser\u00e1 encaminhada t\u00e3o logo esteja aprovada. Neste ato, o Prefeito Eleito
  informa que no Of\u00edcio Transi\u00e7\u00e3o n\u00ba 001/2016, por equ\u00edvoco,
  fez-se constar o nome de Acson dos Santos, quando deveria ter sido Acson da Silva.
  Pelo exposto, requer a retifica\u00e7\u00e3o no Decreto Municipal n\u00ba 058/2016.
  Ato cont\u00ednuo, foi entregue a lista de contatos dos membros que participar\u00e3o
  da transmiss\u00e3o de governo. Foram entregues \u00e0 Presidente da Comiss\u00e3o,
  os Of\u00edcios Transi\u00e7\u00e3o n\u00bas 002/2016; 003/2016; 004/2016; 005/2016;
  006/2016 e 007/2016. A seguir, a Dr\u00aa Andr\u00e9ia solicitou os processos administrativos
  das licita\u00e7\u00f5es dos servi\u00e7os de limpeza p\u00fablica, servi\u00e7os
  de sa\u00fade, transporte escolar e imprensa oficial do munic\u00edpio. Seguindo,
  questionou quanto a ades\u00e3o ao prontu\u00e1rio eletr\u00f4nico, se j\u00e1 est\u00e1
  em andamento no munic\u00edpio, onde Sueli confirmou que j\u00e1 est\u00e1 em desenvolvimento.
  Ato cont\u00ednuo, solicitou posi\u00e7\u00e3o quanto as verbas rescis\u00f3rias
  dos contratos vigentes, como 13\u00ba sal\u00e1rio, f\u00e9rias e 1/3 de f\u00e9rias,
  e rela\u00e7\u00e3o de gestantes que j\u00e1 tem o comunicado do estado grav\u00eddico.
  Dr\u00aa Andr\u00e9ia solicitou ainda os Termos de Ajuste de Conduta, junto ao Minist\u00e9rio
  P\u00fablico e Termos de Ajuste de Gest\u00e3o, firmado junto ao Minist\u00e9rio
  P\u00fablico de Contas, se\\n\\nhouver. A Presidente informou a todos que ir\u00e1
  analisar as solicita\u00e7\u00f5es e encaminhar a documenta\u00e7\u00e3o necess\u00e1ria
  dentro do menor prazo poss\u00edvel. N\u00e3o havendo mais nada a tratar, encerrou-se
  a reuni\u00e3o lavrando-se a presente ata, que depois de lida e achada conforme,
  vai assinada por mim, D\u00e9bora Martins Fons\u00eaca e demais presentes.\\n\\nD\u00e9bora
  Martins Fons\u00eaca\\n\\nMaur\u00edcio Ornelas Lemos \u2013 OAB/BA 35.465\\n\\nLu\u00eds
