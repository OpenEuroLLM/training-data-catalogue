  Estadual: 79.487 315\\n\\nVTE VARZEDO TRANSPORTES LTDA\\nRUA EUJACIO DA SILVA ALMEIDA\\nCENTRO
  - CEP 44565-000\\nVARZEDO - BA\\n\\nI \u2013 RELAT\u00d3RIO\\n\\nTrata-se de consulta
  realizada pelo Munic\u00edpio de Dom Macedo Costa/BA, acerca da possibilidade de
  renova\u00e7\u00e3o do contrato administrativo n\u00ba 163/2014, que tem como objeto
  a \u201ccontrata\u00e7\u00e3o de empresa para presta\u00e7\u00e3o de servi\u00e7os
  de transporte dos alunos matriculados na rede municipal e estadual de ensino de
  Dom Macedo Costa - BA, inclusive portadores de necessidades especiais, at\u00e9
  o final do exerc\u00edcio de 2014\u201d, firmado entre o Consultente e D.M.C.T.
  \u2013 DOM MACEDO COSTA SERVI\u00c7OS E TRANSPORTES LTDA..\\n\\n\u00c9 o necess\u00e1rio
  relat\u00f3rio.\\n\\nII \u2013 DO PARECER\\n\\nO m\u00e9rito do presente opinativo
  deve recair sobre a possibilidade de renova\u00e7\u00e3o do contrato em ep\u00edgrafe.\\n\\nA
  quest\u00e3o referente \u00e0 vig\u00eancia do instrumento encontra-se disposta
  na cl\u00e1usula quarta do pr\u00f3prio, nos seguintes termos:\\n\\nCL\u00c1USULA
  D\u00c9CIMA SEXTA \u2013 DA VIG\u00caNCIA E DA EFIC\u00c1CIA\\n\\nO presente contrato
  vigorar\u00e1 da sua assinatura at\u00e9 o fim do ano letivo ou at\u00e9 31/12/2013.\\n\\nPar\u00e1grafo
  \u00danico - A publica\u00e7\u00e3o resumida do instrumento deste contrato ou de
  seus aditamentos na Imprensa Oficial, que \u00e9 condi\u00e7\u00e3o indispens\u00e1vel
  para sua efic\u00e1cia, ser\u00e1 providenciada pela Contratante at\u00e9 o quinto
  dia \u00fatil do m\u00eas seguinte ao de sua assinatura, para ocorrer no prazo de
  vinte dias daquela data.\\n\\nPor seu turno, o art. 57, II, da Lei n\u00ba 8.666/93
  disp\u00f5e:\\n\\nArt. 57. A dura\u00e7\u00e3o dos contratos regidos por esta Lei
  ficar\u00e1 adstrita \u00e0 vig\u00eancia dos respectivos cr\u00e9ditos or\u00e7ament\u00e1rios,
  exceto quanto aos relativos:\\n(\u2026)\\nII - \u00e0 presta\u00e7\u00e3o de servi\u00e7os
  a serem executados de forma cont\u00ednua, que poder\u00e3o ter a sua dura\u00e7\u00e3o
  prorrogada por iguais e sucessivos per\u00edodos com vistas \u00e0 obten\u00e7\u00e3o
  de pre\u00e7os e condi\u00e7\u00f5es mais vantajosas para a administra\u00e7\u00e3o,
  limitada a sessenta meses; (Reda\u00e7\u00e3o dada pela Lei n\u00ba 9.648, de 1998)\\n\\nAssim,
  podem-se enumerar os seguintes requisitos para a prorroga\u00e7\u00e3o contratual:
  (i) contrato relativo \u00e0 presta\u00e7\u00e3o de servi\u00e7os cont\u00ednuos;
  (ii) obten\u00e7\u00e3o de pre\u00e7os e condi\u00e7\u00f5es mais vantajosas para
  a Administra\u00e7\u00e3o; (iii) prorroga\u00e7\u00e3o, limitada ao total de sessenta
  meses.\\n\\nO professor Mar\u00e7al Justen Filho assim conceitua servi\u00e7os executados
  de forma cont\u00ednua:\\n\\nA identifica\u00e7\u00e3o dos servi\u00e7os de natureza
  cont\u00ednua n\u00e3o se faz a partir do exame propriamente da atividade desenvolvida
  pelos particulares, como execu\u00e7\u00e3o da presta\u00e7\u00e3o contratual. A
  continuidade do servi\u00e7o retrata, na verdade, a perman\u00eancia da necessidade
  p\u00fablica a ser satisfeita. Ou seja, o dispositivo abrange os servi\u00e7os destinados
  a atender necessidades p\u00fablicas permanentes, cujo atendimento n\u00e3o exaure
  presta\u00e7\u00e3o semelhante no futuro.\\n\\nEst\u00e3o abrangidos n\u00e3o apenas
  os servi\u00e7os essenciais, mas tamb\u00e9m compreendidas necessidades p\u00fablicas
  permanentes relacionadas com atividades que n\u00e3o s\u00e3o indispens\u00e1veis.
  O que \u00e9 fundamental \u00e9 a necessidade p\u00fablica permanente e cont\u00ednua
  a ser satisfeita atrav\u00e9s de um servi\u00e7o.\\n\\nNo mesmo sentido, na li\u00e7\u00e3o
  do professor Di\u00f3genes Gasparini:\\n\\n\\\"... \u00e9 o que n\u00e3o pode sofrer
  solu\u00e7\u00e3o de continuidade na presta\u00e7\u00e3o que se alonga no tempo,
  sob pena de causar preju\u00edzos \u00e0 Administra\u00e7\u00e3o P\u00fablica que
  dele necessita. Por ser de necessidade perene para a Administra\u00e7\u00e3o P\u00fablica,
  \u00e9 atividade que n\u00e3o pode ter sua execu\u00e7\u00e3o paralisada, sem acarretar-lhe
  danos. \u00c9, em suma, aquele servi\u00e7o cuja continuidade da execu\u00e7\u00e3o
  a Administra\u00e7\u00e3o P\u00fablica n\u00e3o pode dispor, sob pena de comprometimento
  do interesse p\u00fablico.\\\"\\n\\nESTADO DA BAHIA\\nMunic\u00edpio de Dom Macedo
  Costa\\nPrefeitura Municipal\\n\\nPelas no\u00e7\u00f5es acima trazidas, de logo
  j\u00e1 podemos afirmar que o servi\u00e7o em debate tem natureza cont\u00ednua,
  cumprindo, portanto, com o primeiro requisito legalmente estabelecido.\\n\\nEspecificamente
  em rela\u00e7\u00e3o ao servi\u00e7o de transporte escolar, \u00e9 imperioso destacar
  que h\u00e1 entendimento assente acerca da continuidade do servi\u00e7o, dentro
  os quais poder\u00edamos destacar o posicionamento da Delega\u00e7\u00f5es de Prefeituras
  Municipais, externado na Informa\u00e7\u00e3o n\u00ba 2948, de 22 de dezembro de
  2011, in verbis:\\n\\n2. O posicionamento da Delega\u00e7\u00f5es de Prefeituras
  Municipais \u00e9 no sentido de que o contrato de transporte escolar se enquadra
  na regra do artigo 57, caput, da Lei n\u00ba 8.666/93, uma vez que, em raz\u00e3o
  das f\u00e9rias escolares, o servi\u00e7o necessariamente \u00e9 interrompido.\\n\\nJUSTEN
  FILHO, ao tratar da regra do prazo de vig\u00eancia, traz argumentos que corroboram
  o enquadramento do transporte escolar na situa\u00e7\u00e3o prevista no caput do
  artigo 57 da Lei n\u00ba 8.666/93.\\n\\nA ado\u00e7\u00e3o da regra relaciona-se
  com dois motivos preponderantes. O primeiro consiste na inconveni\u00eancia da suspens\u00e3o
  das atividades de atendimento ao interesse coletivo. A demanda permanente de atua\u00e7\u00e3o
  do particular produziria uma esp\u00e9cie de trauma na transi\u00e7\u00e3o de um
  contrato para outro. Se a contrata\u00e7\u00e3o fosse pactuada por per\u00edodos
  curtos, haveria amplia\u00e7\u00e3o do risco de problemas na contrata\u00e7\u00e3o
  posterior.\\n\\nO transporte escolar configura situa\u00e7\u00e3o inversa \u00e0
  tratada pelo autor no trecho mencionado, uma vez que, no transporte escolar, a Administra\u00e7\u00e3o
  enfrenta in\u00fameros problemas quando da prorroga\u00e7\u00e3o do contrato no
  que tange aos trajetos, trechos e custos da presta\u00e7\u00e3o do servi\u00e7o,
  tendo em vista que os alunos de um ano para o outro mudam de escola, de resid\u00eancia,
  quest\u00f5es que interferem diretamente na presta\u00e7\u00e3o do servi\u00e7o.\\n\\nAssim,
  entende-se que o per\u00edodo m\u00e1ximo da contrata\u00e7\u00e3o do transporte
  escolar \u00e9 o ano letivo no curso de um exerc\u00edcio financeiro. Outros aspectos
  relevantes para a boa execu\u00e7\u00e3o contratual s\u00e3o resultado do enquadramento
  do transporte escolar como um servi\u00e7o restrito ao ano letivo, tais como: a
  adequa\u00e7\u00e3o dos trechos realizados ao planejado na licita\u00e7\u00e3o e
  a menor varia\u00e7\u00e3o da planilha de custos dentro de um exerc\u00edcio financeiro.\\n\\nQuanto
  a necessidade de obten\u00e7\u00e3o de pre\u00e7os e crit\u00e9rios mais vantajosos,
  \u00e9 imperioso esclarecer que a vantagem aqui referida n\u00e3o significa apenas
  o menor pre\u00e7o pago pela Administra\u00e7\u00e3o. Deve-se analisar caso a caso,
  cotejando os interesses da Administra\u00e7\u00e3o com a qualidade e quantidade
  dos servi\u00e7os que ser\u00e3o efetivamente necess\u00e1rios para atender suas
  necessidades.\\n\\nTal situa\u00e7\u00e3o encontra-se devidamente comprovada pela
  documenta\u00e7\u00e3o acostada aos autos, que, por se tratar de crit\u00e9rio inerente
  ao m\u00e9rito administrativo, n\u00e3o carece de an\u00e1lise por este opinativo.\\n\\nESTADO
  DA BAHIA\\nMunic\u00edpio de Dom Macedo Costa\\nPrefeitura Municipal\\n\\nIgualmente,
  o prazo da prorroga\u00e7\u00e3o n\u00e3o extrapola o legalmente estabelecido.\\n\\nPelas
  considera\u00e7\u00f5es tra\u00e7adas acima, temos que a renova\u00e7\u00e3o vindicada
  encontra conformidade na Lei n\u00ba 8.666/93, diploma legal respons\u00e1vel pela
  regula\u00e7\u00e3o de contratos administrativos.\\n\\nIII \u2013 CONCLUS\u00c3O\\n\\nPelo
  exposto, com fulcro na Lei n\u00ba 8.666/93, especialmente no art. 57, II, OPINA
  pela possibilidade de prorroga\u00e7\u00e3o do contrato administrativo acima epigrafado.\\n\\n\u00c9
  o parecer.\\n\\nDom Macedo Costa, 15 de Dezembro de 2016.\\n\\nMaur\u00edcio Ornelas
