sample: '["\"PREFEITURA DA CIDADE DE S\u00c3O PAULO SECRETARIA MUNICIPAL DE EDUCA\u00c7\u00c3O
  COPED / DF \u2013 DIVIS\u00c3O DE FORMA\u00c7\u00c3O PROPOSTA DE FORMA\u00c7\u00c3O
  - EDITAL DF/2024\\n\\nTexto de autoria da \u00e1rea promotora\\n\\nN\u00daMERO DESPACHO
  DE HOMOLOGA\u00c7\u00c3O:  24134\\n\\nN\u00daMERO DA PROPOSTA DE VALIDA\u00c7\u00c3O:   -\\n\\nN\u00daMERO
  DO COMUNICADO:  0\\n\\nTIPO DE FORMA\u00c7\u00c3O: CURSO\\n\\n\u00c1REA PROMOTORA:\\n\\nDRE
  PIRITUBA\\n\\nNOME:\\n\\nACESSIBILIDADE PEDAG\u00d3GICA E COMUNICA\u00c7\u00c3O
  ALTERNATIVA AUMENTATIVA (CAA) PARA A ESTUDANTES COM TEA\\n\\nMODALIDADE: A DIST\u00c2NCIA
  (OBRIGAT\u00d3RIO CONTER O M\u00cdNIMO DE 20% E M\u00c1XIMO DE 40% EM ATIVIDADES
  PRESENCIAIS OU AULAS S\u00cdNCRONAS).\\n\\nCARGA HOR\u00c1RIA TOTAL: 30\\n\\nCARGA
  HOR\u00c1RIA PRESENCIAL: 0\\n\\nCARGA HOR\u00c1RIA DE ATIVIDADES S\u00cdNCRONAS:
  12\\n\\nCARGA HOR\u00c1RIA N\u00c3O PRESENCIAL:  -\\n\\nCARGA HOR\u00c1RIA A DIST\u00c2NCIA:
  18\\n\\nJUSTIFICATIVA:\\n\\nOS \u00cdNDICES DE MATR\u00cdCULA DOS ESTUDANTES COM
  TEA S\u00c3O CRESCENTES, MAIS DE MIL E QUINHENTOS ESTUDANTES MATRICULADOS NO DE
  2023 NA DRE-PJ, E O DESAFIO DI\u00c1RIO SE COLOCA AOS DOCENTES, EXIGINDO APROFUNDAMENTO
  DOS PRINC\u00cdPIOS DA EDUCA\u00c7\u00c3O INCLUSIVA E DAS POSSIBILIDADES DO TRABALHO
  PEDAG\u00d3GICO A SER DESENVOLVIDO, PENSANDO NOVAS PR\u00c1TICAS QUE PROMOVAM A
  ACESSIBILIDADE PARA APRENDIZAGEM, A COMUNICA\u00c7\u00c3O E A INCLUS\u00c3O DESSES
  ESTUDANTES. A IDEIA DE EDUCA\u00c7\u00c3O INCLUSIVA SUSTENTA-SE EM UM MOVIMENTO
  MUNDIAL DE RECONHECIMENTO DA DIVERSIDADE HUMANA E DA NECESSIDADE CONTEMPOR\u00c2NEA
  DE SE CONSTITUIR UMA ESCOLA PARA TODOS. COLOCA-SE ENT\u00c3O, O DESAFIO DE SE PENSAR
  EM ESTRAT\u00c9GIAS E PR\u00c1TICAS QUE PROMOVAM A ELIMINA\u00c7\u00c3O DE BARREIRAS
  NO PROCESSO DE ESCOLARIZA\u00c7\u00c3O, CONSIDERANDO AS NECESSIDADES E POTENCIALIDADES
  DOS ESTUDANTES, ASSEGURANDO A MATR\u00cdCULA, A PERMAN\u00caNCIA, O ACESSO AO CURR\u00cdCULO,
  A APRENDIZAGEM E O DESENVOLVIMENTO EDUCACIONAL DE TODOS.\\n\\nA PR\u00c1TICA EDUCACIONAL
  N\u00c3O PODE LIMITAR-SE A TAREFAS ESCOLARES HOMOG\u00caNEAS E PADRONIZADAS, AS
  QUAIS N\u00c3O CONDIZEM COM A PERSPECTIVA INCLUSIVA. PORTANTO, PARA ENSINAR A TODOS,
  \u00c9 PRECISO QUE SE PENSE EM ESTRAT\u00c9GIAS DIVERSIFICADAS, COMO A TECNOLOGIA
  ASSISTIVA, A COMUNICA\u00c7\u00c3O ALTERNATIVA AUMENTATIVA, ENTRE OUTROS RECURSOS
  QUE PROMOVAM A ACESSIBILIDADE.\\n\\nOBJETIVOS:\\n\\n- REFLETIR SOBRE O HIST\u00d3RICO
  E FUNDAMENTOS QUE CULMINARAM NA CONVEN\u00c7\u00c3O DOS DIREITOS DA PESSOA COM DEFICI\u00caNCIA
  E A POL\u00cdTICA PAULISTANA DE EDUCA\u00c7\u00c3O ESPECIAL NA PERSPECTIVA DA EDUCA\u00c7\u00c3O
  INCLUSIVA (DECRETO N\u00ba 57.379, DE 13 DE OUTUBRO DE 2016) QUE POSSIBILITARAM
  O ACESSO AO ENSINO REGULAR DE ESTUDANTES COM TEA;\\n- CONHECER A CONCEITUA\u00c7\u00c3O,
  O DIAGN\u00d3STICO E CARACTER\u00cdSTICAS PRINCIPAIS DO TRANSTORNO DO ESPECTRO AUTISTA
  E DEFICI\u00caNCIA INTELECTUAL, SEU FUNCIONAMENTO COGNITIVO E AS RELA\u00c7\u00d5ES
  DESSAS CARACTER\u00cdSTICAS COM A ESPECIFICIDADE DOS ESTUDANTES;\\n- CONTRIBUIR
  PARA A CRIA\u00c7\u00c3O DE ESTRAT\u00c9GIAS PEDAG\u00d3GICAS DIVERSIFICADAS, RECURSOS
  E PR\u00c1TICAS QUE FAVORE\u00c7AM O TRABALHO EM SALA REGULAR JUNTO AOS ESTUDANTES
  COM TEA, PROPICIANDO UM AMBIENTE DE APRENDIZAGEM INCLUSIVO;\\n- CONHECER E IMPLEMENTAR
  RECURSOS DE ACESSIBILIDADE COMO A TECNOLOGIA ASSISITIVA (TA) E A COMUNICA\u00c7\u00c3O
  AUMENTATIVA ALTERNATIVA (CAA ) .\\n\\nCONTE\u00daDO PROGRAM\u00c1TICO:\\n\\n- HIST\u00d3RICO
  DOS PARADIGMAS ACERCA DAS DEFICI\u00caNCIAS\\n- DECRETO 53.379 DE 16/10/2016 E PORTARIA
  8764 DE 23/12/2016 \u2013 POL\u00cdTICA PAULISTANA DE EDUCA\u00c7\u00c3O ESPECIAL
  NA PERSPECTIVA INCLUSIVA\\n- CONCEP\u00c7\u00d5ES E CONCEITOS QUE EMBASAM O CURR\u00cdCULO
  DA CIDADE P.16-28\\n- DOCUMENTO DE ORIENTA\u00c7\u00d5ES PARA ATENDIMENTO DE ESTUDANTES
  COM TRANSTORNO DO ESPECTRO DO AUTISMO (SME/SP);\\n- RECURSOS E PR\u00c1TICAS PEDAG\u00d3GICAS
  ESTRUTURADAS QUE AUXILIAM A COMPREENS\u00c3O, O APRENDIZADO E A ACESSIBILIDADE AOS
  ESTUDANTES COM TEA NO AMBIENTE ESCOLAR POR MEIO DE ROTINAS E PISTAS VISUAIS; - TECNOLOGIA
  ASSISTIVA E CAA (COMUNICA\u00c7\u00c3O AUMENTATIVA ALTERNATIVA).\\n\\nPROCEDIMENTOS:\\n\\n-
  APRESENTA\u00c7\u00c3O DIALOGADA DO CONTE\u00daDO;\\n- LEITURA E DISCUSS\u00c3O
  DOS MATERIAIS TE\u00d3RICOS DISPONIBILIZADOS;\\n- DISCUSS\u00c3O COLETIVA DAS BARREIRAS
  DE APRENDIZAGEM DOS ESTUDANTES COM TEA NO AMBIENTE ESCOLAR A PARTIR DA REFLEX\u00c3O
  DE ESTUDOS;\\n- AN\u00c1LISE DAS ESTRAT\u00c9GIAS UTILIZADAS PARTINDO DAS PROPOSTAS
  PR\u00c1TICAS APRESENTADAS;\\n- APRESENTA\u00c7\u00c3O E DISCUSS\u00c3O DE ESTUDO
  DE CASO;\\n- ATIVIDADES SINCRONAS E ASS\u00cdNCRONAS;\\n- REFLEX\u00c3O ESCRITA
  DOS ASPECTOS TRABALHADOS NO CURSO.\\n\\nATIVIDADE OBRIGAT\u00d3RIA:\\n\\nO CURSISTA
  DEVER\u00c1 PROPOR UMA ESTRAT\u00c9GIA DE ACESSIBILIDADE PENSANDO NA PARTICIPA\u00c7\u00c3O
  EFETIVA PARA O ESTUDANTE COM TEA NA UNIDADE ESCOLAR, UTILIZANDO A TECNOLOGIA ASSISTIVA,
  MAIS ESPECIFICAMENTE A CAA (COMUNICA\u00c7\u00c3O AUMENTATIVA ALTERNATIVA), CONTRIBUINDO
  COM A ELIMINA\u00c7\u00c3O DA BARREIRA COMUNICATIVA E POSSIBILITANDO A APRENDIZAGEM
  DO ESTUDANTE.\\n\\nCRONOGRAMA DETALHADO:\\n\\nTURMA 1 - 10/06,17/06, 24/06, 01/07
  - DAS 19H \u00c0S 22H\\n\\nTURMA 2- 05/08, 12/08, 19/08, 26/08 - DAS 19H \u00c0S
  22H\\n\\nAMBIENTE VIRTUAL DE APRENDIZAGEM: PLATAFORMA TEAMS\\n\\nCRIT\u00c9RIOS
  DE AVALIA\u00c7\u00c3O E APROVA\u00c7\u00c3O PARA EXPEDI\u00c7\u00c3O DE CERTIFICADO:
  CONCEITO P OU S PELA PARTICIPA\u00c7\u00c3O E ENVOLVIMENTO, FREQU\u00caNCIA M\u00cdNIMA
  DE 75%, ENTREGA E APROVA\u00c7\u00c3O DE ATIVIDADE OBRIGAT\u00d3RIA\\n\\nBIBLIOGRAFIA:\\n\\nSILVA
