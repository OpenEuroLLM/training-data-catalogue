  certificados: Vice-Presidente - Instituto Polit\u00e9cnico de Coimbra.\\n\\nCHAVE
  M\u00d3VEL\"", "\"BRS VIOLETA\\nNova Cultivar de Uva para Suco e Vinho de Mesa\\n\\nUmberto
  Almeida Camargo\u00b9\\nJo\u00e3o Dimas Garcia Maia\u00b2\\nJair Costa Nachtigal\u00b3\\n\\nIntrodu\u00e7\u00e3o\\n\\nAs
  cultivares de *Vitis labrusca* e seus h\u00edbridos constituem a base da produ\u00e7\u00e3o
  de vinhos de mesa e de suco de uva no Brasil e representam mais de 85% do volume
  de uvas industrializadas no pa\u00eds. A produ\u00e7\u00e3o est\u00e1 concentrada
  na Regi\u00e3o Sul, nos Estados do Rio Grande do Sul e de Santa Catarina, que inclui
  condi\u00e7\u00f5es de clima temperado e subtropical. Entretanto, novos p\u00f3los
  de viticultura voltados \u00e0 elabora\u00e7\u00e3o de vinhos de mesa e de suco
  de uva est\u00e3o surgindo nas regi\u00f5es tropicais do Brasil.\\n\\nAs principais
  cultivares utilizadas para a elabora\u00e7\u00e3o de vinhos de mesa e de suco s\u00e3o
  Isabel, Bord\u00f4 e Concord, entre outras de menor import\u00e2ncia. Estas cultivares
  apresentam boa adapta\u00e7\u00e3o \u00e0s condi\u00e7\u00f5es ambientais do sul
  do Brasil, o que \u00e9 confirmado, principalmente, pela elevada capacidade produtiva
  e baixa susceptibilidade \u00e0s principais doen\u00e7as f\u00fangicas que atacam
  a videira. Ademais, os vinhos elaborados com uvas labruscas, t\u00edpicos pelas
  caracter\u00edsticas de aroma e sabor, t\u00eam a prefer\u00eancia de parcela importante
  dos consumidores brasileiros e o suco destas uvas, al\u00e9m de gozar de bom conceito
  no mercado interno, \u00e9 refer\u00eancia de qualidade no mercado internacional.
  Entretanto, na Regi\u00e3o Sul, estas uvas apresentam limita\u00e7\u00f5es relacionadas
  com a baixa intensidade de cor dos produtos elaborados (\u2018Isabel\u2019) e com
  o baixo teor de a\u00e7\u00facar da uva (\u2018Bord\u00f4\u2019 e \u2018Concord\u2019).
  Por outro lado, as cultivares Bord\u00f4 e Concord n\u00e3o apresentam desempenho
  satisfat\u00f3rio em regi\u00f5es tropicais.\\n\\nO programa de melhoramento gen\u00e9tico
  da Embrapa Uva e Vinho, entre outros objetivos, visa a cria\u00e7\u00e3o de cultivares
  de uva do tipo labrusca, que apresentem elevada\"", "\"GOVERNO DO ESTADO DE MATO
  GROSSO DO SUL SECRETARIA DE ESTADO DE JUSTI\u00c7A E SEGURAN\u00c7A P\u00daBLICA
  DEPARTAMENTO ESTADUAL DE TR\u00c2NSITO DIRETORIA PRESID\u00caNCIA\\n\\nD\\n\\nD\\n\\nE\\n\\nE\\n\\nT\\n\\nT\\n\\nR\\n\\nR\\n\\nA\\n\\nA\\n\\nN\\n\\nN\\n\\n-\\n\\n-\\n\\nM\\n\\nM\\n\\nS\\n\\nS\\n\\nPORTARIA
  DETRAN MS N\u00ba 7367           -            DE 17 DE JULHO DE 2003\\n\\n\\\"Dispensa
  a apresenta\u00e7\u00e3o de CPF de condutores, nos processos de CNH que menciona
  e d\u00e1 outras provid\u00eancias\\\".\\n\\nO Diretor Presidente do Departamento
  Estadual de Tr\u00e2nsito de Mato Grosso do Sul \u2013 DETRAN MS, no uso de suas
  atribui\u00e7\u00f5es ;\\n\\nCONSIDERANDO que a partir de 1998 as Carteiras Nacionais
  de Habilita\u00e7\u00e3o passaram a ser emitidas com o n\u00famero do CPF e a ter
  f\u00e9 p\u00fablica;\\n\\nCONSIDERANDO que as C\u00e9dulas de Identidade j\u00e1
  registram o n\u00famero do CPF e, ainda, que o sistema Renach se acha em processo
  de interliga\u00e7\u00e3o com a Receita Federal;\\n\\nR E S O L V E:\\n\\nArt. 1\u00ba
  - Fica dispensada a exig\u00eancia de apresenta\u00e7\u00e3o de CPF ou a respectiva
  c\u00f3pia para instru\u00e7\u00e3o de processo Renach, em renova\u00e7\u00f5es,
  adi\u00e7\u00f5es, mudan\u00e7a de categoria e emiss\u00e3o de segunda via referentes
  a Carteira Nacional de Habilita\u00e7\u00e3o emitida de acordo com o art. 159 do
  C\u00f3digo de Tr\u00e2nsito Brasileiro, quando:\\n\\nI \u2013 existir em nossos
  arquivos processo Renach, em nome do condutor interessado, de primeira habilita\u00e7\u00e3o
  ou renova\u00e7\u00e3o de CNH emitidas nos moldes previstos no caput, ou,\\n\\nII
  \u2013 apresentar o condutor C\u00e9dula de Identidade com registro do CPF.\\n\\nArt.
  2\u00b0 -  Esta Portaria entra em vigor na data de sua publica\u00e7\u00e3o, revogadas
  as disposi\u00e7\u00f5es em contr\u00e1rio.\\n\\nGILBERTO TADEU VICENTE\\n\\nDiretor
  Presidente\\n\\nPublicado no DOE de 21/07/2003.\"", "\"A hist\u00f3ria da Est\u00f4nia
  pode ser resumida por uma not\u00e1vel e copiosa lista de her\u00f3is obstinados
  em uma longa defesa da autodetermina\u00e7\u00e3o nacional-popular contra invasores
  e culturas estranhas que buscam de modo ou outro corromper sua liberdade em todos
  os dom\u00ednios. Assim \u00e9 exatamente, como veremos, a epopeia do filho de Kalev,
  o Kalevipoeg, o frondoso gigante lobo solit\u00e1rio, um tanto desajeitado e revoltado,
  mas bem-quisto por Tiara e por todos os demais: proteger da natureza, amigo dos
  pequenos animais e do pr\u00f3prio povo. Tal como a Hielat \u00e9 uma alegoria nacional
  para o povo aquareloso levan e conquistador, o Kalevipoeg uma alegoria para o portugu\u00eas
  aventuriero, e a Faust para o erudito germ\u00e2nico, o Kalevipoeg \u00e9 o s\u00edmbolo
  da resist\u00eancia estoniana, que mesmo diante de inimigos sempre mais numerosos,
  n\u00e3o d\u00e1 passos atr\u00e1s, mas sa\u00edra \u00e0 frente; mesmo quando lhe
  falta uma espada, o gigante est\u00f4nio arranca uma \u00e1rvore inteira e a transforma
  numa clara esmagadora; mesmo que os mais poderosos feiticeiros pare\u00e7am invenc\u00edveis,
  n\u00e3o lhes d\u00e1 n\u00e1vidos aos encantamentos, mas subtiliza a sombra e a
  ilus\u00e3o com pensamentos horrores, atos nobres e pontos firmes. Desperca as facilidades
  de varinhas m\u00e1gicas porque prefere fazer tudo com as pr\u00f3prias m\u00e3os
  e m\u00e9rito. Sabe ser ferido em combate, como sabe ser algemar em festas. Tem
  a nozima de uma crian\u00e7a e a sabedoria de um filho dos deuses. N\u00e3o dispensa
  tesouros, mas tamb\u00e9m n\u00e3o os guarda para si; empregar\u00e1 armadas incutidas
  em nome do bem-estar e seguran\u00e7a do diligente trabalhador eston\u00e3o, procurando-se
  em dar-lhe pastos, muraltas, casas e repastos. E vivar\u00e1, ao final, da consequ\u00eancia
  de um erro pelejor (que quer como todo her\u00f3i, Kalevipoeg nunca imperdo\u00e1vel),
  mas como raro experimenta a magreza de arrepentimento! \u00c9 ainda muito celebrado
  pela carta das deusas e agora, pacientemente, pela grande conflagra\u00e7\u00e3o
  final, onde se erguer\u00e1 em defesa de sua terra e sangue.\\n\\nEsta tradu\u00e7\u00e3o
  luxigrata tem por refer\u00eancia o trabalho de William Forsell Kirby (1844-1892)
  not\u00f3rio estonilogista e poliglota ingl\u00eas conhecido pela tradu\u00e7\u00e3o
  do \u00e9pica nacional finland\u00eas Kalevala que, mais tarde, influenciaria a
  forma\u00e7\u00e3o de J. R. R. Tolkien (1892-1973) fil\u00f3logo e autor do famoso
  O Senhor dos An\u00e9is. Em suas anota\u00e7\u00f5es, Kirby pensou encontrar no
  Kalevipoeg estoniano uma simples variante do \u00e9pica finland\u00eas; mas o percebeu
  \\\"t\u00e3o distinta, e ao mesmo tempo t\u00e3o interessante\\\" que decidiu por
  public\u00e1-la num rosto independente completo em prosa, algo in\u00e9dito na l\u00edngua
  inglesa de seu tempo. Privilegia tal que, agora acess\u00edvel em portugu\u00eas,
  fora percebido por contextualiza\u00e7\u00e3o historiogr\u00e1fica e aprecia\u00e7\u00e3o
  cultural do livre pensador J. O. Bilda confirmava a nobreza pr\u00f3pria da na\u00e7\u00e3o
  e cultura da Est\u00f4nia.\\n\\nKALEVIPOEG\\nO \u00c9PICO DA EST\u00d4NIA\\n\\nTRADU\u00c7\u00c3O,
  INTRODU\u00c7\u00c3O E NOTAS\\nJONAS OT\u00c1VIO BILDA\\n\\nA PARTIR DA EDI\u00c7\u00c3O
  DE\\nW. F. KIRBY\\n\\nCopyright \u00a9 Jonas Ot\u00e1vio Bilda\\n\\n1\u00aa Edi\u00e7\u00e3o\\n\\nTodos
