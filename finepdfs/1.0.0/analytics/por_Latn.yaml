  do Mestrado Profissionalizante \u2013 PROFNIT abrir\u00e1 no dia 24/07, e a entrega
  da documenta\u00e7\u00e3o ser\u00e1 nos dias 07 e 08 de agosto.\\n\\nSer\u00e3o
  disponibilizadas 15 vagas por disciplina. Caso tenha interesse em participar como
  aluno(a) especial:\\n\\n1)- (A)O candidato(a) dever\u00e1 solicitar ao Ponto Focal
  UnB, a Guia de Recolhimento da Uni\u00e3o (GRU), referente \u00e0 taxa de solicita\u00e7\u00e3o
  de admiss\u00e3o como aluno(a) especial (o valor desta taxa \u00e9 R$71,00 - setenta
  e um reais).\\n\\n- A solicita\u00e7\u00e3o dever\u00e1 ser feita via e-mail (email@example.com),
  dever\u00e1 ser informado o nome completo, e-mail e o CPF do interessado(a).\\n-
  Esta solicita\u00e7\u00e3o poder\u00e1 ser feita a partir do dia 24/07 at\u00e9
