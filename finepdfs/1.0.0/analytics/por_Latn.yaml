  n. 5.712. Salvador \u2013 Bahia. Segunda-feira, 19/7/2021.\\n\\nJUSTI\u00c7A FEDERAL
  HOJE\\n\\nSIGEC \u00e9 homologado e tem seu uso regulamentado pela DIREF para toda
  a Se\u00e7\u00e3o Judici\u00e1ria\\n\\njeto que envolveu o NUASG, o NUCGE e o NUTEC.\\n\\nA
  Portaria SJBA-DIREF 169/2021, publicada em 6 de junho do corrente ano homologa e
  regulamenta a utiliza\u00e7\u00e3o do SIGEC tornando-o obrigat\u00f3rio o seu uso
  na Justi\u00e7a Federal em todo o Estado.\\n\\nAs modalidades dispon\u00edveis para
  cor\u00ad respond\u00eancias atrav\u00e9s desse Sistema s\u00e3o: \\\"Simples\\\",
  \\\"Registrada\\\", \\\"Registra\u00ad da com AR\\\" e \\\"M\u00e3os Pr\u00f3prias\\\",
  sendo que apenas esses dois \u00faltimos tipos ge\u00ad rar\u00e3o retorno de AR,
  os quais poder\u00e3o ser baixados no pr\u00f3prio sistema pela Unidade. O tipo
  \\\"M\u00e3o Pr\u00f3pria\\\" \u00e9 o mais oneroso para a JFBA. O tr\u00e2nsito
  de Ma\u00ad lotes, envio de Telegrama e SEDEX n\u00e3o s\u00e3o comportados pelo
  Sistema.\\n\\nO Sistema de Gera\u00e7\u00e3o Eletr\u00f4nica de Correspond\u00eancias
  (SIGEC) foi desen\u00ad volvido pelo NUTEC/MG para servir de integra\u00e7\u00e3o
  com o sistema e-CARTA dos Correios, que, por sua vez, \u00e9 o sistema que efetua
  o envio de cartas de forma totalmente informatizada. O SIGEC foi customizado para
  uso na Bahia pelo servidor F\u00e1bio Damasceno em um Pro\u00ad\\n\\nOs Manuais
  de utiliza\u00e7\u00e3o e link de v\u00eddeos do treinamento realizado es\u00ad
  t\u00e3o no PA SEI n\u00famero 001797346.2020.4.01.8004 bem como a Por\u00ad taria
  referenciada acima.\\n\\nA Unidade que ainda n\u00e3o se cadas\u00ad trou nem indicou
  o servidor \\\"gerente\\\" do sistema deve faz\u00ea-lo o mais breve poss\u00ed\u00ad
  vel, via e-SOSTI ao NUTEC.\\n\\nEst\u00e1 mat\u00e9ria est\u00e1 relacionada ao
  ODS 16 (Paz, Justi\u00e7a e Institui\u00e7\u00f5es Eficazes).\\n\\nResolu\u00e7\u00e3o
  CNJ cria procedimentos para tratamento de migrantes privados de liberdade\\n\\nSegundo
  a Resolu\u00e7\u00e3o, entende-se por migrante toda pessoa que se encontra fora
  do territ\u00f3rio de que \u00e9 nacional, inde\u00ad pendentemente da situa\u00e7\u00e3o
  migrat\u00f3ria, inten\u00e7\u00e3o ou dura\u00e7\u00e3o de sua estada ou perman\u00eancia.\\n\\nA
  Resolu\u00e7\u00e3o 405 do Conselho Nacio\u00ad nal de Justi\u00e7a (CNJ), de 06/07/2021,
  estabeleceu  procedimentos para o tra\u00ad tamento das pessoas migrantes custo\u00ad
  diadas, acusadas, r\u00e9s, condenadas ou privadas de liberdade, inclusive em pri\u00ad
  s\u00e3o domiciliar e em outras formas de cumprimento de pena em meio aberto, em
  cumprimento de alternativas penais ou monitora\u00e7\u00e3o eletr\u00f4nica e conferir
  di\u00ad retrizes para assegurar os direitos dessa popula\u00e7\u00e3o no \u00e2mbito
  do Poder Judici\u00e1rio.\\n\\nO conceito de migrante na Resolu\u00e7\u00e3o abrange
  tamb\u00e9m o ap\u00e1trida, entendido como pessoa que n\u00e3o seja considerada
  como nacional por nenhum Estado, se\u00ad gundo a sua legisla\u00e7\u00e3o, nos
  termos da Conven\u00e7\u00e3o sobre o Estatuto dos Ap\u00e1tri\u00ad das, de 1954,
  promulgada pelo Decreto no 4.246/2002.\\n\\nPara conferir a \u00edntegra da Resolu\u00e7\u00e3o,
  acesse: https://atos.cnj.jus.br/atos/deta\u00ad lhar/4030\\n\\nEsta mat\u00e9ria
  est\u00e1 relacionada ao ODS 10 (Redu\u00e7\u00e3o das Desigualdades) e 16 (Paz,
  Justi\u00e7a e Institui\u00e7\u00f5es Eficazes).\\n\\nAniversariantes\\n\\nHoje:
  Advalk Paulo Ferreira (Itabuna) e Samir Jesus de Souza (NUCGP). Amanh\u00e3: Leticia
  dos Santos da Silva (Cejuc), Marcia Silveira Dias (Nuasg), Cristina Furtado da Concei\u00e7\u00e3o
  (21\u00aa Vara) e Francisco Luiz Eug\u00eanio Moreira Silva (Juazeiro).\\n\\n\u00daltimo
  dia para se inscrever no curso da Esmaf sobre Justi\u00e7a Restaurativa\\n\\nHoje  \u00e9
  o \u00faltimo dia para se inscrever no curso on-line in\u00e9dito \\\"Justi\u00e7a
  Restau\u00ad rativa: um novo olhar sobre a Justi\u00e7a\\\", oferecido pela Escola
  de Magistratura Federal da 1\u00aa Regi\u00e3o (Esmaf). Interessa\u00ad dos em participar
  devem se cadastrar por meio do portal da Esmaf no link: https:// ead.trf1.jus.br/esmaf/login/index.php\\n\\nA
  forma\u00e7\u00e3o, destinada a magistrados e magistradas, ocorre de 5 de agosto
  a 4 de setembro e pretende trabalhar a Justi\u00ad \u00e7a Restaurativa (JR) no
  contexto da Cul\u00ad tura de Paz, ressaltando seu papel como pol\u00edtica p\u00fablica
  e abordando a filosofia, o hist\u00f3rico, os fundamentos e as metodo\u00ad logias
  da JR. Tamb\u00e9m ser\u00e3o feitas com\u00ad para\u00e7\u00f5es da JR com outros
  sistemas de Justi\u00e7a vigentes e reflex\u00f5es sobre os seus espa\u00e7os de
  pr\u00e1tica.\\n\\nCom conte\u00fado distribu\u00eddo em cinco m\u00f3dulos, com
  aulas s\u00edncronas, f\u00f3runs de discuss\u00e3o ass\u00edncronos e c\u00edrculos
  de cons\u00ad tru\u00e7\u00e3o de paz, totalizando 28 horas-aula, o curso \u00e9
  credenciado pela Escola Nacio\u00ad nal de Forma\u00e7\u00e3o e Aperfei\u00e7oamento
  de\\n\\nMagistrados (Enfam) e \u00e9 v\u00e1lido para pro\u00ad mo\u00e7\u00e3o
  e vitaliciamento.\\n\\nA pr\u00e1tica da Justi\u00e7a Restaurativa \u00e9 apoiada
  pela Resolu\u00e7\u00e3o 225/2016 do Conselho Nacional de Justi\u00e7a (CNJ). A
  iniciativa da Esmaf visa manter os magis\u00ad trados e magistradas da Justi\u00e7a
  Federal da 1\u00aa Regi\u00e3o atualizados e preparados para esse cen\u00e1rio.\\n\\nPara
  mais informa\u00e7\u00f5es, acesse: ht\u00ad tps://ead.trf1.jus.br/esmaf/blog/index.
  php?entryid=623\\n\\nParab\u00e9ns!\\n\\nEXPEDIENTE: Coordena\u00e7\u00e3o-Geral:
  juiz federal F\u00e1bio Moreira Ramiro, diretor do Foro da Se\u00e7\u00e3o Judici\u00e1ria
  da Bahia. Reda\u00e7\u00e3o, fotos, distribui\u00e7\u00e3o, revis\u00e3o e impress\u00e3o:
  Servi\u00e7o de Comunica\u00e7\u00e3o Social - SERCOM. Diagrama\u00e7\u00e3o: Rodrigo
  Sarmento Silva dos Santos. Telefones: (71) 3617-2616. Endere\u00e7o: Av. Ulysses
  Guimar\u00e3es, 2799 \u2013 CAB. CEP: 41213-000. Site: portal.trf1.jus.br/sjba E-mail:
  firstname.lastname@example.org.\"", "\"Programa de Co-cria\u00e7\u00e3o de Conhecimentos\\n\\n(Com
  Foco em Grupo e Regi\u00e3o)\\n\\nInforma\u00e7\u00f5es Gerais sobre\\n\\nFortalecimento
  de Sa\u00fade Materno-Infantil mediante Atividades de Sa\u00fade P\u00fablica (B)
  Ano Fiscal de 2017\\n\\no\\n\\nN J17-04423 / ID. 1784445\\n\\nPer\u00edodo do Curso
  no Jap\u00e3o: 25 de outubro a 16 de dezembro de 2017\\n\\nAs informa\u00e7\u00f5es
  contidas neste documento integram o Programa de Co-cria\u00e7\u00e3o de Conhecimentos
  da JICA - Japan International Cooperation Agency (com foco em Grupo e Regi\u00e3o)
  , implementando como parte da Assist\u00eancia Oficial para o Desenvolvimento do
  Governo do Jap\u00e3o baseada no acordo bilateral entre os dois Governos.\\n\\nNovo
  come\u00e7o do ''Programa de Co-Cria\u00e7\u00e3o de Conhecimentos (KCC) da JICA''
  No Estatuto de Coopera\u00e7\u00e3o de Desenvolvimento, divulgado pelo Gabinete
  Japon\u00eas em fevereiro de 2015, foi salientado que \\\"na sua coopera\u00e7\u00e3o
  de desenvolvimento, o Jap\u00e3o vem mantendo o esp\u00edrito de criar, em conjunto,
  coisas que v\u00e3o de encontro com os pa\u00edses parceiros, respeitando a sua
  autonomia, as suas inten\u00e7\u00f5es e suas caracter\u00edsticas intr\u00ednsecas
  com base na abordagem orientada \u00e0s necessidades locais, atrav\u00e9s de di\u00e1logo
  e colabora\u00e7\u00e3o. Ele tamb\u00e9m manteve a postura de construir rela\u00e7\u00f5es
  rec\u00edprocas com pa\u00edses em desenvolvimento, onde ambas as partes aprendem
  mutuamente, crescem e se desenvolvem juntos\\\". Acreditamos que este ''Programa
  de Co-Cria\u00e7\u00e3o de Conhecimentos'' servir\u00e1 como um centro do processo
  de aprendizado m\u00fatuo.\\n\\nI. Concep\u00e7\u00e3o\\n\\nAntecedentes\\n\\nEm
  setembro de 2015, as Na\u00e7\u00f5es Unidas estabeleceu os Objetivos de Desenvolvimento
  Sustent\u00e1vel (ODS). Com base nos Objetivos de Desenvolvimento do Mil\u00eanio
  (ODM), cujo prazo se encerrou em 2015, os ODS t\u00eam metas espec\u00edficas a
  serem alcan\u00e7adas at\u00e9 2030. Apesar dos esfor\u00e7os globais, tr\u00eas
  dos oito objetivos dos ODM dos quais s\u00e3o \\\"Reduzir a mortalidade infantil\\\",
  \\\"Melhorar a sa\u00fade materna\\\" e \\\"Combater o HIV/AIDS, a mal\u00e1ria
  e outras doen\u00e7as\\\", n\u00e3o foram concretizados. Esses objetivos foram estendidos
  como parte dos ODS. Ao todo, os ODS incluem treze metas relativas \u00e0 sa\u00fade.
  O 3\u00ba objetivo contempla \\\"Assegurar uma vida saud\u00e1vel e promover o bem-estar
  para todos, em todas as idades\\\". Para atingir tais objetivos s\u00e3o necess\u00e1rios
  esfor\u00e7os globais, tanto dos pa\u00edses em desenvolvimento como dos desenvolvidos.\\n\\nMuitos
  pa\u00edses em desenvolvimento ainda enfrentam dificuldades em oferecer servi\u00e7os
  de sa\u00fade materno-infantil em todas as regi\u00f5es. H\u00e1 muitas raz\u00f5es
  para isso, incluindo car\u00eancia de recursos humanos, financeiros, equipamentos
  e instala\u00e7\u00f5es. As disparidades regionais em rela\u00e7\u00e3o \u00e0s
  infraestruturas, transfer\u00eancias de pacientes e administra\u00e7\u00e3o inadequada
  de sa\u00fade s\u00e3o os principais problemas que precisam ser abordados. Para
  alcan\u00e7ar as metas globais, \u00e9 essencial melhorar os sistemas de sa\u00fade
  nos pa\u00edses em desenvolvimento.\\n\\nEste curso visa proporcionar apoio aos
  respons\u00e1veis pela gest\u00e3o de enfermagem por meio das experi\u00eancias
  de Okinawa e de outras cidades do Jap\u00e3o para desenvolver planos de melhoria
  que poder\u00e3o gerar grandes efeitos \u00e0 sa\u00fade materno-infantil em seus
  pa\u00edses.\\n\\nO governo regional de Okinawa est\u00e1 situado no extremo sul
  do Jap\u00e3o e \u00e9 composto por cerca de 160 ilhas, sendo que muitas delas s\u00e3o
  bastante remotas. H\u00e1 muito tempo, o governo regional esteve focado nas quest\u00f5es
  da sa\u00fade materno-infantil. Grande parte deste motivo se deve \u00e0 decorr\u00eancia
  da reconstru\u00e7\u00e3o ap\u00f3s a Segunda Guerra Mundial, quando os okinawanos
  sofreram situa\u00e7\u00f5es de extrema escassez de assist\u00eancia de sa\u00fade
  com equipes m\u00e9dicas e instala\u00e7\u00f5es inadequadas. Atrav\u00e9s da implementa\u00e7\u00e3o
  de iniciativas destinadas a melhorar os sistemas de sa\u00fade, Okinawa conseguiu
  alcan\u00e7ar a Cobertura Universal de Sa\u00fade.\\n\\nA partir das experi\u00eancias
  bem-sucedidas em Okinawa, este curso visa proporcionar conhecimentos, habilidades
  e estruturas aos participantes para solucionar os problemas de sa\u00fade materno-infantil
  mediante atividades de sa\u00fade p\u00fablica nos seus pa\u00edses de origem.\\n\\nQual
  objetivo?\\n\\nBaseado no sucesso da prov\u00edncia de Okinawa, este programa visa
  proporcionar aos participantes conhecimentos, habilidades e elementos-chaves para
  solucionar as quest\u00f5es relativas \u00e0s medidas de sa\u00fade materno-infantil
  dos pa\u00edses em desenvolvimento.\\n\\nQuem pode participar?\\n\\nEste programa
  \u00e9 destinado para aqueles que atuam na ocupa\u00e7\u00e3o de enfermagem* ou
  para supervisores respons\u00e1veis pelo planejamento, execu\u00e7\u00e3o, avalia\u00e7\u00e3o
  e gest\u00e3o da promo\u00e7\u00e3o de sa\u00fade materno-infantil nos governos
  nacionais ou regionais direcionados para melhorar a sa\u00fade p\u00fablica no atendimento
  prim\u00e1rio.\\n\\n* Ocupa\u00e7\u00e3o de enfermagem: Neste documento, a ocupa\u00e7\u00e3o
  de enfermagem aponta enfermeiros, obstetras e enfermeiros de sa\u00fade p\u00fablica.\\n\\nComo?\\n\\nOs
  participantes ter\u00e3o oportunidades de:\\n\\n1) Analisar fatores de impedimento
  da sa\u00fade materno-infantil no segmento da sa\u00fade p\u00fablica do pr\u00f3prio
  pa\u00eds, comparando com a situa\u00e7\u00e3o de Okinawa e do Jap\u00e3o.\\n2)
  Obter elementos-chaves para melhorar a situa\u00e7\u00e3o atual assimilando as experi\u00eancias
  das medidas adotadas na prov\u00edncia de Okinawa, cujo governo regional que administra
  a sa\u00fade \u00e9 localizado no extremo sul do Jap\u00e3o.\\n\\nII. Descri\u00e7\u00e3o\\n\\n1.
  T\u00edtulo (J-No.)\\n\\nFortalecimento de Sa\u00fade Materno-Infantil mediante
  Atividades de Sa\u00fade P\u00fablica (B)  (J17-04423)\\n\\n2. Per\u00edodo do Curso
  no Jap\u00e3o\\n\\nDe 25 de outubro a 16 de dezembro de 2017.\\n\\n3. Regi\u00f5es
  ou Pa\u00edses-alvo\\n\\nAngola, Brasil, Guin\u00e9-Bissau, Mo\u00e7ambique e S\u00e3o
  Tom\u00e9 e Pr\u00edncipe.\\n\\n4. P\u00fablicos-alvo / Organiza\u00e7\u00f5es-alvo\\n\\nEste
  programa \u00e9 elaborado para os governos nacionais ou regionais que abordam a
  melhoria da sa\u00fade materno-infantil.\\n\\n5. N\u00famero de Vagas (Limite m\u00e1ximo
  de participantes)\\n\\n9 participantes (12)\\n\\n6. Idioma a ser utilizado durante
  o programa\\n\\nPortugu\u00eas\\n\\n7. Objetivo do curso:\\n\\nExecu\u00e7\u00e3o
  de novos planos de melhoria da sa\u00fade materno-infantil pelos oficiais de sa\u00fade
  p\u00fablica do governo nacional ou regional, aplicando os conhecimentos adquiridos
  por meio deste treinamento.\\n\\n8. Objetivo Superior\\n\\nProporcionar servi\u00e7os
  de sa\u00fade materno-infantil, de acordo com as necessidades de cada comunidade.\\n\\n9.
  M\u00f3dulos (Previstos) do Programa e Conte\u00fado:\\n\\nO programa \u00e9 constitu\u00eddo
  pelos m\u00f3dulos abaixo. Os detalhes de cada componente est\u00e3o descritos a
  seguir:\\n\\n1. Fase Preliminar: per\u00edodo preparat\u00f3rio nos pa\u00edses
  de origem dos participantes\\n\\nAs entidades participantes dos seus respectivos
  pa\u00edses far\u00e3o as prepara\u00e7\u00f5es necess\u00e1rias para o programa.\\n\\nM\u00f3dulo
  (previs\u00e3o)\\n\\nAtividades\\n\\n(1) Analisar pontos problem\u00e1ticos da sa\u00fade
  materno-infantil na\\n\\nentidade onde\\n\\ntrabalha ou\\n\\nno\\n\\n\u00e2mbito
  das\\n\\nresponsabilidades do candidato;\\n\\n(2) Ao elaborar o Relat\u00f3rio de
  Trabalho, certifique-se de utilizar o formato anexo;\\n\\n(3) Antes de apresentar
  o relat\u00f3rio, certifique-se de que obteve a autoriza\u00e7\u00e3o de seu superior
  antes da submiss\u00e3o\\n\\ndos documentos.\\n\\n2. Fase principal no Jap\u00e3o\\n\\nOs
  participantes enviados pelas entidades participar\u00e3o do programa no Jap\u00e3o.\\n\\n|
  M\u00f3dulos (Previstos) do Programa | T\u00f3picos / Agendas |\\n|---|---|\\n|
  1. Classificar e relatar as quest\u00f5es problem\u00e1ticas da sa\u00fade materno-infantil
  do pa\u00eds do participante, a fim de compartilhar com os parceiros do curso. |
  (1) Classificar as quest\u00f5es problem\u00e1ticas sobre a sa\u00fade materno-infantil
  do pa\u00eds do participante. (2) Elaborar o relat\u00f3rio de trabalho de forma
  curta e concisa. |\\n| 2. Baseada nas medidas de sa\u00fade materno-infantil, conhecer
  a administra\u00e7\u00e3o da sa\u00fade p\u00fablica do Jap\u00e3o e Okinawa (desde
  o p\u00f3s-Segunda Guerra Mundial at\u00e9 a atualidade), o mecanismo do sistema
  de assist\u00eancia m\u00e9dica e a coopera\u00e7\u00e3o entre as associa\u00e7\u00f5es
  m\u00e9dicas. | (1) Vis\u00e3o geral da administra\u00e7\u00e3o de sa\u00fade p\u00fablica
  do Jap\u00e3o. (2) Vis\u00e3o geral da sa\u00fade p\u00fablica, m\u00e9dica e administra\u00e7\u00e3o
  de bem-estar de Okinawa. (3) Vis\u00e3o geral das atividades de sa\u00fade p\u00fablica
  e assist\u00eancia m\u00e9dica nas ilhas remotas de Okinawa. (4) Servi\u00e7os de
  sa\u00fade materno-infantil nas institui\u00e7\u00f5es hospitalares. (5) Vis\u00e3o
  geral do ensino de enfermagem. (6) Fun\u00e7\u00f5es das associa\u00e7\u00f5es especializadas
  na enfermagem e das organiza\u00e7\u00f5es relacionadas. |\\n\\nPreparar Relat\u00f3rio
  de Trabalho (Job report)\\n\\n| 3. Conhecer e compreender a hist\u00f3ria das atividades
  de sa\u00fade p\u00fablica do Jap\u00e3o e Okinawa, as pr\u00e1ticas (m\u00e9todos
  e t\u00e9cnicas), os sistemas de sa\u00fade e o desenvolvimento de recursos humanos,
  para analisar a possibilidade de execu\u00e7\u00e3o da \u00e1rea de sa\u00fade materno-infantil
  no seu pa\u00eds. | (1) Vis\u00e3o geral do sistema relacionado aos enfermeiros
  de sa\u00fade p\u00fablica nas comunidades. (2) Vis\u00e3o geral de administra\u00e7\u00e3o
  de assuntos de enfermagem e desenvolvimento de recursos humanos em Okinawa. (3)
  Teoria e pr\u00e1tica das atividades de enfermagem da sa\u00fade p\u00fablica. (4)
  Fun\u00e7\u00f5es dos enfermeiros na sa\u00fade escolar. |\\n|---|---|\\n| 4. Preparar
  o \\\"Relat\u00f3rio de Aprendizagem em Okinawa\\\" para apresentar no pa\u00eds
  do participante. Elaborar tamb\u00e9m um plano de a\u00e7\u00e3o vi\u00e1vel para
  melhorar a sa\u00fade materno-infantil ap\u00f3s o retorno ao pa\u00eds de origem.
  | (1) Preparar relat\u00f3rios semanais (2) Preparar e apresentar o \\\"Relat\u00f3rio
  de Aprendizagem em Okinawa\\\" (3) Preparar e apresentar o \\\"Relat\u00f3rio de
  Estudos\\\". |\\n\\n3. Fase de finaliza\u00e7\u00e3o: no pa\u00eds de origem do
  participante\\n\\nAs entidades participantes preparar\u00e3o resultados finais utilizando
  os resultados apresentados pelos participantes. Essa fase marca o fim do programa.\\n\\nM\u00f3dulo
  (previs\u00e3o)\\n\\nAtividades\\n\\n1. Compartilhar com os colegas de trabalho
  o que assimilou mediante ao treinamento no Jap\u00e3o\\n\u30fbOrganizar uma reuni\u00e3o
  ou workshop para a apresenta\u00e7\u00e3o geral do curso e discutir entre os membros
  interessados, incluindo colegas de trabalho, a possibilidade de aplicar no pa\u00eds
  de origem o que assimilou durante o programa de treinamento\\n\\nIII. Requisitos
  e Procedimentos para Inscri\u00e7\u00e3o\\n\\n1. Expectativas com Rela\u00e7\u00e3o
  \u00e0s Entidades Participantes:\\n\\n(1) Este programa \u00e9 destinado principalmente
  \u00e0s entidades que buscam solu\u00e7\u00f5es aos problemas espec\u00edficos identificados
  nas suas opera\u00e7\u00f5es. Espera-se que as entidades participantes coloquem
  os conhecimentos obtidos neste programa para solucionar essas quest\u00f5es espec\u00edficas.\\n(2)
  O programa \u00e9 rico em conte\u00fado especialmente desenvolvido em colabora\u00e7\u00e3o
  com as organiza\u00e7\u00f5es mais proeminentes no Jap\u00e3o. Tais caracter\u00edsticas
  especiais permitem que o projeto atenda aos requisitos espec\u00edficos das entidades
  interessadas e a facilitar a busca efetiva de solu\u00e7\u00f5es \u00e0s suas pr\u00f3prias
  quest\u00f5es.\\n(3) Este programa \u00e9 projetado para facilitar aos participantes
  encontrarem solu\u00e7\u00f5es concretas para os problemas das suas entidades. Espera-se
  que as entidades participantes realizem prepara\u00e7\u00f5es devidas juntamente
  com os participantes antes de envi\u00e1-los ao Jap\u00e3o, realizando atividades
  da fase preliminar descritas no inciso II-9.\\n(4) H\u00e1 tamb\u00e9m a expectativa
  de que as entidades participantes maximizem os resultados obtidos pelos respectivos
  participantes no Jap\u00e3o pelas atividades da Fase Final descritas no inciso II-9.\\n\\n2.
  Requisitos para Participa\u00e7\u00e3o:\\n\\nFica a cargo das entidades interessadas
  selecionar candidatos que dever\u00e3o preencher os seguintes requisitos.\\n\\n(1)
  Requisitos Essenciais\\n\\n1) Cargo ou posi\u00e7\u00e3o atual: estar atuando na
  ocupa\u00e7\u00e3o de enfermagem* ou ser supervisor respons\u00e1vel pelo planejamento,
  implementa\u00e7\u00e3o, avalia\u00e7\u00e3o e gest\u00e3o nos servi\u00e7os de
  enfermagem de sa\u00fade materno-infantil nos governos nacionais ou regionais de
  atendimento prim\u00e1rio interessados em melhorar a sa\u00fade p\u00fablica.\\n2)
  Experi\u00eancia na \u00e1rea relacionada: ter experi\u00eancia de 7 anos ou mais
  na \u00e1rea de sa\u00fade p\u00fablica\\n3) Grau de Escolaridade: ser graduado
  na universidade ou equivalente\\n4) Sa\u00fade: estar bem fisicamente e mentalmente
  para participar do programa no Jap\u00e3o. N\u00e3o \u00e9 recomendada a candidatura
  de gestantes devido a eventuais riscos que possam surgir para a sa\u00fade da m\u00e3e
  e do feto.\\n\\n\uff0aOcupa\u00e7\u00e3o de enfermagem: neste documento, a ocupa\u00e7\u00e3o
  de enfermagem aponta enfermeiros, obstetras e enfermeiros de sa\u00fade p\u00fablica.\\n\\n(2)
  Requisitos Recomendados\\n\\n1) Expectativas em rela\u00e7\u00e3o aos Participantes:
  Recomenda-se a participa\u00e7\u00e3o das pessoas que tenham v\u00ednculos com programas
  de sa\u00fade da JICA.\\n2) Idade:\\n\\nEntre trinta (30) e quarenta e nove (49)
  anos.\\n\\n3. Documentos Necess\u00e1rios para a Inscri\u00e7\u00e3o\\n\\n(1) Formul\u00e1rio
  de Inscri\u00e7\u00e3o: dispon\u00edvel no escrit\u00f3rio da JICA (ou na Embaixada
  do Jap\u00e3o).\\n(2) Fotoc\u00f3pia do passaporte: caso possua o passaporte v\u00e1lido
  apresentar a c\u00f3pia juntamente com o formul\u00e1rio de inscri\u00e7\u00e3o.
  Caso n\u00e3o possua, ser\u00e1 solicitado a apresentar a fotoc\u00f3pia logo ap\u00f3s
  a obten\u00e7\u00e3o do passaporte.\\n* Na fotoc\u00f3pia deve estar inclu\u00edda
  as seguintes informa\u00e7\u00f5es:\\nNome, data de nascimento, Nacionalidade, Sexo,
  N\u00famero do passaporte e Data de validade.\\n(3) Relat\u00f3rio de trabalho (Job
  Report): apresent\u00e1-lo juntamente com o formul\u00e1rio de inscri\u00e7\u00e3o.
  Para mais informa\u00e7\u00f5es vide ANEXO VI.\\n\\n4. Procedimentos para Inscri\u00e7\u00e3o
  e Sele\u00e7\u00e3o\uff1a\\n\\n(1) Apresenta\u00e7\u00e3o dos documentos para inscri\u00e7\u00e3o:\\n\\nPrazo
  final para inscri\u00e7\u00e3o: informe-se no escrit\u00f3rio local da JICA (ou
  na Embaixada do Jap\u00e3o).\\n\\nAp\u00f3s a recep\u00e7\u00e3o dos documentos
  para inscri\u00e7\u00e3o, o escrit\u00f3rio local da JICA (ou a Embaixada do Jap\u00e3o)
  enviar\u00e1 para o Centro da JICA no Jap\u00e3o at\u00e9 25 de agosto de 2017.\\n\\n(2)
  Sele\u00e7\u00e3o:\\n\\nAp\u00f3s a recep\u00e7\u00e3o de documentos por meio dos
  procedimentos administrativos fixados pelos respectivos pa\u00edses, o escrit\u00f3rio
  local da JICA (ou a Embaixada do Jap\u00e3o) far\u00e1 uma pr\u00e9-sele\u00e7\u00e3o,
  encaminhando posteriormente os documentos para o Centro da JICA no Jap\u00e3o. A
  sele\u00e7\u00e3o dos candidatos fica a cargo do Centro da JICA e ser\u00e1 realizada
  mediante consulta com as organiza\u00e7\u00f5es correlacionadas do Jap\u00e3o. O
  interesse das entidades em explorar oportunidades durante o programa ser\u00e1 amplamente
  valorizado no processo de sele\u00e7\u00e3o. A qualifica\u00e7\u00e3o dos interessados
  vinculados a organiza\u00e7\u00f5es militares ou relacionadas e/ou dos alistados
  no ex\u00e9rcito ser\u00e1 examinada caso a caso pelo Governo do Jap\u00e3o, de
  acordo com o Estatuto de Coopera\u00e7\u00e3o de Desenvolvimento do Jap\u00e3o,
  considerando as suas fun\u00e7\u00f5es e a sua posi\u00e7\u00e3o na organiza\u00e7\u00e3o,
  bem como outras informa\u00e7\u00f5es relevantes, de forma abrangente.\\n\\n(3)
  Divulga\u00e7\u00e3o do Resultado\\n\\nOs resultados ser\u00e3o comunicados por
  meio do escrit\u00f3rio da JICA (ou da Embaixada do Jap\u00e3o) at\u00e9 25 de setembro
  de 2017.\\n\\n5. Condi\u00e7\u00f5es para participa\u00e7\u00e3o:\\n\\n(1) Respeitar
  estritamente o cronograma do programa.\\n(2) N\u00e3o \u00e9 permitida a altera\u00e7\u00e3o
  dos temas do programa.\\n(3) N\u00e3o \u00e9 permitida a extens\u00e3o do per\u00edodo
  de perman\u00eancia no Jap\u00e3o.\\n(4) N\u00e3o \u00e9 permitido acompanhamento
  de familiares durante o programa.\\n(5) Ao final do programa, os participantes dever\u00e3o
  retornar aos seus pa\u00edses de origem de acordo com o plano de viagem fixado pela
  JICA.\\n(6) Abster-se de atividades pol\u00edticas ou qualquer outra atividade com
  fins lucrativos.\\n(7) Dever\u00e1 cumprir as leis e os regulamentos vigentes no
  Jap\u00e3o. Caso infrinja alguma legisla\u00e7\u00e3o ou regulamento, dependendo
  da gravidade, os participantes poder\u00e3o ser obrigados a devolver parte ou a
  totalidade das despesas empregadas no treinamento.\\n(8) Dever\u00e1 respeitar as
  normas e os regulamentos do local de hospedagem. N\u00e3o \u00e9 permitida a troca
  do local de acomoda\u00e7\u00e3o designada pela JICA.\\n\\nIV. Disposi\u00e7\u00f5es
  administrativas\\n\\n1. Organiza\u00e7\u00e3o:\\n\\n(1) Nome: Centro Internacional
  da JICA em Okinawa (OIC)\\n\\n(2) Contato:\\n\\nSra. Naoko NAKAMA (E-mail: email@example.com)\\n\\n2.
  Parceira de Execu\u00e7\u00e3o:\\n\\n(1) Nome: Associa\u00e7\u00e3o de Enfermagem
  de Okinawa\\n\\n(2) URL: http://ww w.oki-kango.or.jp\\n\\n3. Viagem ao Jap\u00e3o:\\n\\n(1)
  Passagem A\u00e9rea: de ida e volta entre os aeroportos internacionais designados
  pela JICA e Okinawa ser\u00e3o custeadas pela JICA.\\n(2) Seguro Viagem: ap\u00f3lice
  de seguro v\u00e1lido durante o per\u00edodo entre a chegada e a sa\u00edda do Jap\u00e3o.
  Sendo assim, o per\u00edodo de viagem fora do Jap\u00e3o n\u00e3o ter\u00e1 cobertura.\\n\\n4.
  Acomoda\u00e7\u00e3o no Jap\u00e3o:\\n\\nA JICA providenciar\u00e1 a seguinte acomoda\u00e7\u00e3o
  aos participantes no Jap\u00e3o:\\n\\nCentro Internacional de Okinawa da JICA (OIC)\\n\\nCaixa
  Postal 903-2552\\n\\n1143-1 Aza-Maeda, Urasoe-Shi, Okinawa, Jap\u00e3o\\n\\nTEL:
  +81-98-876-6000  FAX: +81-98-876-6014\\n\\n(\\\"81\\\" \u00e9 o c\u00f3digo da chamada
  do Jap\u00e3o e \\\"98\\\" \u00e9 o c\u00f3digo da regi\u00e3o)\\n\\nCaso n\u00e3o
  haja vagas na JICA Okinawa, a JICA providenciar\u00e1 uma acomoda\u00e7\u00e3o alternativa.\\n\\n5.
  Cobertura de Despesas:\\n\\nAs seguintes despesas ser\u00e3o cobertas pela JICA:\\n\\n(1)
  Despesas de hospedagem, alimenta\u00e7\u00e3o, gastos di\u00e1rios, vestu\u00e1rio
  e despacho (frete).\\n(2) Despesas de viagens para estudos (basicamente custos de
  transporte de trem).\\n(3) Assist\u00eancia m\u00e9dica gratuita para os participantes
  que adoecerem ap\u00f3s a chegada ao Jap\u00e3o (n\u00e3o inclui tratamentos relativos
  a doen\u00e7as preexistentes, gravidez ou tratamento odontol\u00f3gico).\\n(4)\\nDespesas
  de execu\u00e7\u00e3o do programa, inclusive materiais. Para mais informa\u00e7\u00f5es,
  consulte o item \\\"III. Despesas\\\" que consta no Guia para Bolsistas com o t\u00edtulo
  de \\\"KENSHU-IN GUIDE BOOK\\\". Os participantes receber\u00e3o esse guia antes
  da partida ao Jap\u00e3o.\\n\\n6. Orienta\u00e7\u00e3o Pr\u00e9-Viagem:\\n\\nO escrit\u00f3rio
  local da JICA (ou a Embaixada do Jap\u00e3o) realizar\u00e1 uma orienta\u00e7\u00e3o
  antes da partida para fornecer aos participantes detalhes sobre a viagem, condi\u00e7\u00f5es
  para participa\u00e7\u00e3o no programa e outros esclarecimentos.\\n\\nV. Outras
  Informa\u00e7\u00f5es\\n\\n1. Clima de Okinawa\\n\\nA prov\u00edncia de Okinawa
  est\u00e1 localizada na zona subtropical (extremo sul do Jap\u00e3o), por\u00e9m,
  o clima varia de acordo com as esta\u00e7\u00f5es do ano. Embora seja quente e bastante
  \u00famido no ver\u00e3o (junho a outubro), devido ao forte vento do norte, no inverno
  torna-se um pouco frio (dezembro a mar\u00e7o). Recomenda-se aos participantes levarem
  roupas adequadas para enfrentar o clima (para mais informa\u00e7\u00f5es, consulte
  o item 4 abaixo).\\n\\nO diagrama abaixo mostra a varia\u00e7\u00e3o de temperatura
  da cidade de Urasoe, onde o Centro Internacional de Okinawa da JICA (OIC) est\u00e1
  localizado (Fonte: dados fornecidos no site da cidade de Urasoe).\\n\\nDiagrama
  de temperatura da cidade de Urasoe de 2011\\n\\nM\u00e9dia\\nM\u00ednima\\nM\u00e1xima\\n\\n2.
  Principais instala\u00e7\u00f5es da JICA Okinawa\\n\\nA JICA Okinawa (OIC) \u00e9
  equipada com diversas instala\u00e7\u00f5es destinadas para treinamentos e atividades
  de assist\u00eancia social, tais como salas para semin\u00e1rios, biblioteca, sala
  de estudo com computadores, quartos de acomoda\u00e7\u00f5es (para mais informa\u00e7\u00f5es,
  consulte o item 3 abaixo), refeit\u00f3rio, cl\u00ednica para consulta m\u00e9dica,
  academia, quadra de t\u00eanis, piscina (dispon\u00edvel entre maio a outubro),
  sala estilo japon\u00eas para cerim\u00f4nia do ch\u00e1 e salas de recrea\u00e7\u00e3o.\\n\\nO
  refeit\u00f3rio de OIC disp\u00f5e de menus com pratos \\\"HALAL\\\" para refei\u00e7\u00f5es
  mu\u00e7ulmanas e vegetarianas.\\n\\nConex\u00f5es \u00e0 internet estar\u00e3o
  dispon\u00edveis nas acomoda\u00e7\u00f5es e outros pr\u00e9dios (via cabo ou Wi-Fi)\\n\\n3.
  Acomoda\u00e7\u00f5es da JICA Okinawa\\n\\nO pr\u00e9dio que abriga o OIC disp\u00f5e
  de 96 quartos individuais. Todos os quartos est\u00e3o mobiliados com cama, mesa,
  cadeira, estante e arm\u00e1rio. Al\u00e9m disso, cada quarto est\u00e1 equipado
  com uma TV (com canais via sat\u00e9lite), DVD player, cofre, telefone, conector
  de LAN e outros equipamentos.\\n\\nO pr\u00e9dio de OIC disp\u00f5e tamb\u00e9m
  de sal\u00e3o de ch\u00e1, sala para fumantes e lavanderia em cada andar. As m\u00e1quinas
  para lavar roupas e ferros de passar est\u00e3o dispon\u00edveis gratuitamente.
  As toalhas e os artigos de higiene pessoal s\u00e3o providenciados no momento do
  check-in.\\n\\n\u00c9 estritamente proibido cozinhar na acomoda\u00e7\u00e3o do
  OIC.\\n\\n4. Roupas\\n\\nPara usar durante a participa\u00e7\u00e3o do curso em
  Okinawa, recomenda-se levar roupas apropriadas de acordo com o clima previsto para
  a cidade. *Consulte o item \\\"1. Clima de Okinawa\\\".\\n\\nOs participantes poder\u00e3o
  ser requisitados a utilizar roupas formais para a participa\u00e7\u00e3o em eventos
  oficiais como cerim\u00f4nia de abertura e encerramento. Por\u00e9m, poder\u00e3o
  utilizar roupas casuais durante o maior tempo do curso.\\n\\n\u00c9 bastante recomend\u00e1vel
  que levem trajes tradicionais t\u00edpicos do pa\u00eds para us\u00e1-los na cerim\u00f4nia
  de abertura e encerramento ou em outras atividades onde os participantes ter\u00e3o
  oportunidades de participar. N\u00e3o somente isso, como tamb\u00e9m artesanatos
  e artes populares ou folcl\u00f3ricos e artigos que possam ser utilizados para expor
  a sua cultura s\u00e3o bem-vindos. O OIC disp\u00f5e de espa\u00e7o de exposi\u00e7\u00e3o
  para apresentar variadas culturas do mundo aos visitantes.\\n\\nNo caso de programas
  que incluam treinamentos pr\u00e1ticos como visitas \u00e0s f\u00e1bricas ou atividades
  ao ar livre, a JICA ou a entidade a ser visitada providenciar\u00e1 uniformes ou
  roupas apropriados para esses fins.\\n\\n5. Atividades de Conserva\u00e7\u00e3o
  Ambiental na JICA Okinawa\\n\\nO OIC da JICA enfatiza atividades de conserva\u00e7\u00e3o
  ambiental, tais como a redu\u00e7\u00e3o do gasto de energia, separa\u00e7\u00e3o
  e reciclagem de lixo, etc. Os participantes ser\u00e3o convidados a cooperar nessas
  atividades durante a sua estadia. Os detalhes ser\u00e3o informados na chegada do
  local no OIC da JICA.\\n\\nPara o seu conhecimento\\n\\nAs informa\u00e7\u00f5es
  de Okinawa podem ser obtidas nos URLs abaixo.\\n\\n(1) Website da Cidade de Urasoe
  (onde o OIC da JICA est\u00e1 localizado) Cidade de Urasoe:\\nhttp://honyaku.j-server.com/LUCURASOEC/ns/tl.cgi/http%3a//www.city.urasoe.lg.jp/
  ?SLANG=ja&TLANG=en&XMODE=0&XCHARSET=utf-8&XJSID=0\\n\\nAs informa\u00e7\u00f5es
  b\u00e1sicas da cidade de Urasoe est\u00e3o expressas em ingl\u00eas.\\n\\n(2) Website
  da Prov\u00edncia de Okinawa: http://www.pref.okinawa.jp/english/index.html As informa\u00e7\u00f5es
  b\u00e1sicas da Prov\u00edncia de Okinawa est\u00e3o expressas em ingl\u00eas. (Urasoe
  \u00e9 uma das cidades da Prov\u00edncia de Okinawa).\\n(3) Website de Okinawa Convention
  & Visitors Bureau (Funda\u00e7\u00e3o Organizadora de Visitantes de Okinawa): http://www.ocvb.or.jp/en/\\n(4)
  Canal de YouTube da JICA Okinawa: https://www.youtube.com/user/jicaokinawa\\n(5)
  Mais informa\u00e7\u00f5es podem ser obtidas na recep\u00e7\u00e3o da JICA Okinawa.\\n\\nVI.
  ANEXO:\\n\\nProcedimento para Elabora\u00e7\u00e3o do Relat\u00f3rio de Trabalho\\n\\nConforme
  descrito no GI (Informativo Geral), todos os candidatos selecionados para o curso
  dever\u00e3o elaborar um Relat\u00f3rio de Trabalho (Job Report). Este relat\u00f3rio
  ser\u00e1 muito importante para ajudar os organizadores do curso no Jap\u00e3o a
  ficarem cientes dos \\\"conhecimentos que os participantes desejam adquirir com
  o treinamento\\\" e \\\"situa\u00e7\u00f5es do ambiente de trabalho dos participantes\\\".
  Eles providenciar\u00e3o, na medida do poss\u00edvel, um programa que satisfa\u00e7a
  as necessidades dos participantes. Portanto, certifique-se de que o seu relat\u00f3rio
  de trabalho ser\u00e1 elaborado de forma precisa e informativa.\\n\\n\u2160\uff0eApresenta\u00e7\u00e3o
  do Relat\u00f3rio de Trabalho\\n\\nNo in\u00edcio do treinamento no Jap\u00e3o,
  est\u00e1 programado para os participantes apresentarem aos organizadores e professores
  do curso o relat\u00f3rio de trabalho em Microsoft PowerPoint (PPT), apresentando
  o seu pa\u00eds, sua \u00e1rea respons\u00e1vel e a realidade nacional relativa
  \u00e0 sa\u00fade materno-infantil. Cada participante ter\u00e1 cerca de 10 minutos
  para a apresenta\u00e7\u00e3o.\\n\\nTodos os participantes ter\u00e3o de completar
  o Microsoft PowerPoint (PPT) revisando-o no decurso do programa a pedido dos organizadores
  do curso.\\n\\n\u2161\uff0eElabora\u00e7\u00e3o e Entrega do Relat\u00f3rio de Trabalho\\n\\n<
  Elabora\u00e7\u00e3o>\\n\\n Verifique os assuntos que deseja abranger na sua apresenta\u00e7\u00e3o.
  Consulte em \\\"(ANEXO) Formato PPT - Apresenta\u00e7\u00e3o do Relat\u00f3rio de
  Trabalho\\\".\\n Recomenda-se utilizar cerca de 13 slides.\\n Utilizar fotos ser\u00e1
  bastante \u00fatil para sua apresenta\u00e7\u00e3o. Para melhor compreens\u00e3o,
  coloque fotos, tais como suas atividades di\u00e1rias, instala\u00e7\u00f5es de
  sa\u00fade e imagens da vida cotidiana dos habitantes que envolvem a sua \u00e1rea
  respons\u00e1vel.\\n\u203b Al\u00e9m das fotos para o relat\u00f3rio de trabalho,
  traga algumas adicionais relacionadas com atividades de sa\u00fade. Como mencionado
  no item I., podem ser necess\u00e1rias para completar o relat\u00f3rio no Jap\u00e3o.\\n\\n<Entrega>\\n\\n
  As inscri\u00e7\u00f5es sem o relat\u00f3rio de trabalho n\u00e3o ser\u00e3o aceitas.\\n
  A JICA far\u00e1 a tradu\u00e7\u00e3o e o sum\u00e1rio do relat\u00f3rio em japon\u00eas
  para distribuir aos japoneses que participar\u00e3o da apresenta\u00e7\u00e3o. Por
  esta raz\u00e3o, apresente em formato PPT (n\u00e3o \u00e9 aceito manuscrito e nem
  em formato de PDF). N\u00e3o ser\u00e1 admitido revis\u00f5es ou altera\u00e7\u00f5es
  ap\u00f3s a entrega.\\n Caso haja outras d\u00favidas, entre em contato atrav\u00e9s
  do endere\u00e7o de e-mail ''firstname.lastname@example.org''.\\n\\nPara sua Refer\u00eancia\\n\\nA
  JICA e o Desenvolvimento de Habilidades\\n\\nO conceito fundamental que sustenta
  as opera\u00e7\u00f5es da JICA desde a sua funda\u00e7\u00e3o em 1974 \u00e9 a convic\u00e7\u00e3o
  de que o \\\"desenvolvimento de habilidades\\\" \u00e9 um elemento central no desenvolvimento
  socioecon\u00f4mico de um pa\u00eds. Tal conceito n\u00e3o fica condicionado aos
  esquemas operacionais espec\u00edficos a serem implementados, tais como o envio
  de especialistas, o desenvolvimento de projetos, os projetos de estudos de desenvolvimento,
  os programas de treinamento, os programas JOCV (Coopera\u00e7\u00e3o Japonesa dos
  Volunt\u00e1rios no Exterior), etc.\\n\\nDentro dessa ampla gama de projetos, os
  Programas de Co-cria\u00e7\u00e3o de Conhecimentos (treinamentos) t\u00eam desempenhado
  um papel relevante nas opera\u00e7\u00f5es da JICA. Conduzidos no Jap\u00e3o, os
  treinamentos visam oferecer aos pa\u00edses parceiros oportunidades de adquirir
  conhecimentos j\u00e1 praticados dentro da sociedade japonesa. Os participantes
  enviados pelos pa\u00edses parceiros poder\u00e3o encontrar uma gama de conhecimentos
  \u00fateis e ter\u00e3o a oportunidade de recriar os pr\u00f3prios, refor\u00e7ando
  assim as suas pr\u00f3prias habilidades e contribuindo para a capacita\u00e7\u00e3o
  da organiza\u00e7\u00e3o e do pa\u00eds de origem.\\n\\nAproximadamente 460 programas
  pr\u00e9-concebidos abordam uma vasta gama de \u00e1reas profissionais, desde a
  educa\u00e7\u00e3o, sa\u00fade, infraestrutura, energia, com\u00e9rcio e finan\u00e7as,
  agricultura, desenvolvimento rural, integra\u00e7\u00e3o de g\u00eanero e prote\u00e7\u00e3o
  ambiental. Al\u00e9m da variedade, cada programa poder\u00e1 ser adaptado para atender
  \u00e0s necessidades espec\u00edficas das diferentes entidades-alvo, tais como as
  entidades relacionadas \u00e0 cria\u00e7\u00e3o de pol\u00edticas, ao fornecimento
  de servi\u00e7os ou \u00e0 pesquisa e ao ensino. Alguns programas foram concebidos
  de forma a abranger pa\u00edses que enfrentam desafios similares no processo de
  desenvolvimento.\\n\\nA Experi\u00eancia do Desenvolvimento Japon\u00eas\\n\\nO
  Jap\u00e3o foi o primeiro pa\u00eds fora do Ocidente que obteve grande \u00eaxito
  na moderniza\u00e7\u00e3o de sua sociedade e na industrializa\u00e7\u00e3o de sua
  economia. Na ess\u00eancia deste processo que se iniciou h\u00e1 mais de 140 anos,
  pode-se identificar o conceito \\\"adotar e adaptar\\\", ou seja, a importa\u00e7\u00e3o
  de uma vasta gama de t\u00e9cnicas e conhecimentos \u00fateis de pa\u00edses desenvolvidos.
  As t\u00e9cnicas e os conhecimentos adotados foram aperfei\u00e7oados incorporando-se
  \u00e0s habilidades, aos conhecimentos e \u00e0s iniciativas locais, tornando-se
  por fim internalizados na sociedade japonesa para responder \u00e0s necessidades
  e \u00e0s circunst\u00e2ncias locais.\\n\\nDa engenharia aos m\u00e9todos de gest\u00e3o
  da produ\u00e7\u00e3o, a imensa quantidade de know-how que capacitou o Jap\u00e3o
  a ser o que atualmente \u00e9, emana desse processo de \\\"ado\u00e7\u00e3o e adapta\u00e7\u00e3o\\\".
  O processo, obviamente, foi acompanhado de um n\u00famero incont\u00e1vel de fracassos
  e erros por tr\u00e1s de cada hist\u00f3ria de sucesso. N\u00f3s entendemos que
  tais experi\u00eancias, tanto as de \u00eaxito como as de fracasso, s\u00e3o de
  grande valia aos nossos parceiros que enfrentam atualmente os desafios do desenvolvimento.
  Entretanto a tentativa de compartilhar o conjunto das experi\u00eancias japonesas
  de desenvolvimento tem sido um grande desafio. Esse desafio adv\u00e9m em parte
  da dificuldade de explicar um conjunto de \\\"conhecimentos t\u00e1citos\\\", um
  tipo de conhecimento que n\u00e3o pode ser totalmente expressa por meio de n\u00fameros
  ou palavras. Al\u00e9m dessa dificuldade, o sistema sociocultural do Jap\u00e3o,
  largamente diverso daquele existente nos pa\u00edses industrializados do Ocidente,
  ainda permanece desconhecido para muitos pa\u00edses parceiros. Em termos simples,
  a vinda ao Jap\u00e3o representa uma das formas de superar o lapso cultural.\\n\\nA
  JICA deseja convidar o maior n\u00famero poss\u00edvel de l\u00edderes dos pa\u00edses
  parceiros para nos visitar, para ter contato com o povo japon\u00eas e testemunhar
  as vantagens bem como as desvantagens dos sistemas japoneses, de forma que o conjunto
  de descobertas de cada um dos participantes contribua para os atingimentos das metas
  pr\u00f3prias de desenvolvimento.\\n\\nContato\\n\\nPara consultas e mais informa\u00e7\u00f5es,
  entre em contato com o escrit\u00f3rio da JICA ou a Embaixada do Jap\u00e3o. As
  correspond\u00eancias dever\u00e3o ser endere\u00e7adas a:\\n\\nJICA Okinawa International
  Center (JICA OKINAWA)\\n\\nEndere\u00e7o: 1143-1 Aza-Maeda, Urasoe-Shi, Okinawa,
  901-2552, Japan\\n\\nTEL:  +81-98-876-6000  FAX:  +81-98-876-6014\""]'
