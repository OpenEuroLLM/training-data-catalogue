  SR. MINISTRO RELATOR RICARDO LEWANDOWSKI DO SUPREMO TRIBUNAL FEDERAL\\n\\nPROCESSO
  N\u00daMERO:\\n\\nA\u00c7\u00c3O DIRETA DE INCONSTITUCIONALIDADE - ADI N. 6363\\n\\nCONFEDERA\u00c7\u00c3O
  NACIONAL DO TRANSPORTE -\\n\\nCNT, entidade sindical de grau superior reconhecida
  pelo Decreto n\u00ba 34.986/54, inscrita no CNPJ/MF sob o n\u00ba 00.721.183/0001-34,
  com sede na SAUS Quadra 01, Bloco J, Edif\u00edcio CNT \u2013 13\u00ba andar, Entradas
  10 e 20, Bras\u00edlia-DF, CEP 70070-944, por seus advogados infra-assinados, com
  endere\u00e7o profissional na Avenida Ant\u00f4nio Abrah\u00e3o Caran, 728 \u2013
  2\u00ba andar, Bairro S\u00e3o Jos\u00e9 \u2013 Pampulha, Belo Horizonte/MG, CEP
  n\u00ba 31275-000, vem, perante est\u00e1 Suprema Corte, por meio de seus procuradores,
  pedir RECONSIDERA\u00c7\u00c3O do Indeferimento no pedido de AMICUS CURIAE formulado
  \u00e0 fl. (item) 148 (documento n. 21528/2020), mediante as raz\u00f5es a seguir
  expostas.\\n\\nEm decis\u00e3o proferida \u00e0 fl. (item) 213 o pedido de amicus
  curiae formulado pela requerente foi indeferido sob o seguinte fundamento:\\n\\n\\\"A
  admiss\u00e3o de amici curiae configura circunst\u00e2ncia de fundamental import\u00e2ncia,
  por\u00e9m de car\u00e1ter excepcional, e que pressup\u00f5e, al\u00e9m do atendimento
  de determinados requisitos, a demonstra\u00e7\u00e3o da necessidade das contribui\u00e7\u00f5es
  apresentadas. Nesse sentido, cabe ao Relator a an\u00e1lise do bin\u00f4mio relev\u00e2ncia
  - representatividade, juntamente com a avalia\u00e7\u00e3o dos benef\u00edcios potencialmente
  aufer\u00edveis dessa participa\u00e7\u00e3o, bem como a delimita\u00e7\u00e3o de
  seus poderes. Assim, considerando tais premissas e louvando o in-\\n\\nAv. Ant\u00f4nio
  Abrah\u00e3o Caran, 728, Pampulha BH/ MG CEP: 31275-000 \u2013 (31) 4103-0552\\n\\nemail@example.com\\n\\nP\u00e1gina
  1 de 3\\n\\nteresse demonstrado, indefiro a habilita\u00e7\u00e3o das novas interessadas,
  seja pelo elevado n\u00famero de amici curiae j\u00e1 habilitados nos autos, seja
  por entender que os argumentos das entidades cujo ingresso como amicus curiae n\u00e3o
  foi deferido est\u00e3o contemplados nas manifesta\u00e7\u00f5es daquelas admitidas\\\".\\n\\nTodavia,
  entende a requerente que sua participa\u00e7\u00e3o na a\u00e7\u00e3o direta de
  inconstitucionalidade \u00e9 de fundamental import\u00e2ncia na contribui\u00e7\u00e3o
  para o debate e representatividade dos interesses das empresas do seguimento que
  representa.\\n\\nA requerente \u00e9 entidade sindical de grau superior, de \u00e2mbito
  nacional do seguimento do transporte em todas as modalidades, ou seja, sua representatividade
  abarca o transporte a\u00e9reo, rodovi\u00e1rio, ferrovi\u00e1rio e aquavi\u00e1rio.\\n\\nNa
  presente a\u00e7\u00e3o foram deferidos pedidos de amicus curiae \u00e0s seguintes
  entidades: Central \u00danica dos Trabalhadores - CUT; Uni\u00e3o Geral dos Trabalhadores
  \u2013 UGT; Central dos Trabalhadores e Trabalhadoras do Brasil; Forca Sindical;
  Central dos Sindicatos Brasileiros \u2013 CSB; Nova Central Sindical dos Trabalhadores
  \u2013 NCST; Confedera\u00e7\u00e3o Nacional da Ind\u00fastria \u2013 CNI; Associa\u00e7\u00e3o
  Brasileira de Advogados Trabalhistas; Associa\u00e7\u00e3o Nacional dos Magistrados
  da Justi\u00e7a do Trabalho; Sindicato Nacional dos Auditores Fiscais Do Trabalho
  - SINAIT e Confedera\u00e7\u00e3o das Associa\u00e7\u00f5es Comerciais e Empresariais
  do Brasil.\\n\\nComo se observa o seguimento empresarial somente est\u00e1 representado
  pela ind\u00fastria e pelo com\u00e9rcio, estando o transporte alijado da oportunidade
  de fornecer sua contribui\u00e7\u00e3o atrav\u00e9s de sua entidade. Existem v\u00e1rias
  entidades da classe trabalhadora habilitadas como tamb\u00e9m da advocacia, da fiscaliza\u00e7\u00e3o
  e da magistratura em franco desequil\u00edbrio de paridade.\\n\\nA presente a\u00e7\u00e3o
  trata de direitos trabalhistas, especialmente no concernente \u00e0 exig\u00eancia
  ou n\u00e3o de participa\u00e7\u00e3o da entidade classista profissional, para validade
  de acordos individuais. Os setores representados pela\\n\\nAv. Ant\u00f4nio Abrah\u00e3o
  Caran, 728, Pampulha BH/ MG CEP: 31275-000 \u2013 (31) 4103-0552\\n\\nfirstname.lastname@example.org\\n\\nP\u00e1gina
  2 de 3\\n\\nrequerente \u00e9 dos mais vulner\u00e1veis que mais sentem o maior
  impacto da pandemia mundial.\\n\\nDessa forma, atendendo aos requisitos de relev\u00e2ncia
  - representatividade, juntamente com a avalia\u00e7\u00e3o dos benef\u00edcios potencialmente
  aufer\u00edveis dessa participa\u00e7\u00e3o no sentido de preserva\u00e7\u00e3o
  de empresas e de empregos, a requerente roga pela reconsidera\u00e7\u00e3o da decis\u00e3o
  de fl. (item) 213 para deferir o seu pedido de amicus curiae.\\n\\nDO PEDIDO\\n\\nDiante
  de tais fundamentos, a requerente espera e confia na reconsidera\u00e7\u00e3o da
  decis\u00e3o de fl. (item) 213 para deferir a sua admiss\u00e3o na\\n\\nqualidade
  de amicus curiae\\n\\nnos autos do A\u00e7\u00e3o Direta de Inconstitucionalidade\\n\\n\u2013
  ADI n. 6363, nos termos do art. 7\u00ba, \u00a7 2\u00ba, da Lei n\u00ba 9.868/1999,
  no art. 138, do\\n\\nC\u00f3digo de Processo Civil e no art. 323, \u00a7 3\u00ba,
  do Regimento Interno do Supremo\\n\\nTribunal Federal.\\n\\nFinalmente, informa
  e retifica informa\u00e7\u00e3o da peti\u00e7\u00e3o de fl. (item) 148 (documento
  n. 21528/2020) que os seus advogados dever\u00e3o ser intimados na Avenida Ant\u00f4nio
  Abra\u00e3o Caran, n. 728, 2\u00ba andar, bairro S\u00e3o Jos\u00e9 (Pampulha),
