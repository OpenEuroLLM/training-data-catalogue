  155    |\\n\\nINTRODU\u00c7\u00c3O\\n\\nJ. O. Bilda\\n\\n\u201cSehen wir uns ins
  Gesicht.\\nWir sind Hyperboreer \u2013\\nwir wissen gut genug, wie abseits wir leben.\u201d\\n\u2014
  Nietzsche\u00b9\\n\\nA presente tradu\u00e7\u00e3o lus\u00f3grafa tem por refer\u00eancia
  o trabalho\u00b2 singular do not\u00f3rio entomologista e poliglota William Forsell
  Kirby (1844-1912), conhecido pelo seu trabalho de tradu\u00e7\u00e3o do \u00e9pico
  nacional finland\u00eas *Kalevala* que, mais tarde, influenciaria a forma\u00e7\u00e3o
  de J. R. R. Tolkien (1892-1973), o fil\u00f3logo autor do famoso *O Senhor dos An\u00e9is*.
  \u201cQuando comecei a estudar o *Kalevala* e a literatura finlandesa, com a inten\u00e7\u00e3o
  de publicar uma edi\u00e7\u00e3o cr\u00edtica em ingl\u00eas do poema\u201d, escreve
  Kirby em uma nota de seu original de 1895, \u201co ac\u00famulo de materiais necess\u00e1rios
  me levou a examinar tamb\u00e9m a literatura dos pa\u00edses vizinhos\u201d. Pensava
  encontrar no *Kalevipoeg* uma simples variante do \u00e9pico cont\u00edguo, mas
  o encontrou \u201ct\u00e3o diferente, e ao mesmo tempo t\u00e3o interessante\u201d
  que decidiu por publicar um relato independente completo em prosa, algo in\u00e9dito
  na l\u00edngua inglesa da \u00e9poca; hoje, no portugu\u00eas.\\n\\nOs mitos estonianos
  possuem um car\u00e1ter extremamente original. Sua literatura \u00e9 de enorme extens\u00e3o,
  e apenas\\n\\n---\\n\\n\u00b9 \u201cOlhemos-nos face a face. Somos hiperb\u00f3reos
  \u2014 sabemos muito bem qu\u00e3o remota \u00e9 nossa morada\u201d.\\n\\n\u00b2
  KIRBY, W. F. *The Hero of Esthonia: and other studies in the Romantic literature
  of that country*. London, John C. Nimmo, 1895. 2 Vols.\\n\\nparcialmente investigada
  e publicada, mesmo em idioma p\u00e1trio. Com certo fasc\u00ednio, Kirby relembrava
  que regi\u00f5es remotas como a dos Pa\u00edses B\u00e1lticos (do latim balticus
  e baltens, \u201ccintur\u00e3o, faixa\u201d) foram muito tardia e relutantemente
  cristianizadas, o que possibilitou \u00e0 cultura original uma mais \u00edntegra
  e prolongada sobreviv\u00eancia que em outras regi\u00f5es. A publica\u00e7\u00e3o
  deste \u00e9pico, respeitando todos os seus elementos essenciais, segundo assinala
  o estudioso, fornece hoje um exemplo not\u00e1vel \u201cda maneira como a Il\u00edada
  e a Odisseia cresceram entre os gregos\u201d.\\n\\nO livro de Kirby vai al\u00e9m
  de uma simples tradu\u00e7\u00e3o sin\u00f3ptica do \u00e9pico est\u00f4nio. \u00c9
  um comp\u00eandio folcl\u00f3rico comentado de diversas tradi\u00e7\u00f5es que
  se fundem \u00e0 estoniana. No entanto, \u00e9 um volume publicado h\u00e1 mais
  de cem anos; seu estudo geral n\u00e3o trata da religiosidade est\u00f4nia com a
  seriedade exigida, e sua resenha geopol\u00edtica introdut\u00f3ria nos \u00e9 hoje,
  para os fins propostos por este livro, de pouco uso e, na maior parte das vezes,
  cientificamente obsoleta. Assim considerando, sublinhei apenas o de destacada relev\u00e2ncia
  para que a hist\u00f3ria e cultura estonianas deixem de ser um mist\u00e9rio ao
  leitor brasileiro e lhe despertem seu encanto pr\u00f3prio.\\n\\n**UM RETRATO DA
  EST\u00d4NIA**\\n\\nSituada no nordeste da Europa, \u00e9 o mais n\u00f3rdico dos
  tr\u00eas Pa\u00edses B\u00e1lticos, regi\u00e3o banhada pelo Mar B\u00e1ltico a
  oeste e norte, e possuindo a R\u00fassia, Bielorr\u00fasia, Kaliningrado e Pol\u00f4nia
  como fronteiras terrestres \u00e0 leste e sul. A Escandin\u00e1via se avizinha \u00e0
  outra margem do B\u00e1ltico mais ao norte. Geograficamente, os tr\u00eas pa\u00edses,
  Est\u00f4nia, Let\u00f4nia e Litu\u00e2nia, comp\u00f5em um quadro homog\u00eaneo
  premente desde a \u00faltima glacia\u00e7\u00e3o: solo inf\u00e9rtil e escarpado,
  abund\u00e2ncia de \u00e1gua em in\u00fameros lagos e p\u00e2ntanos, baixa altitude
  ilustrada em vastos campos e colinas, e bosques\\n\\nimensos que cobrem cerca de
  40% do territ\u00f3rio. O clima \u00e9 continental e temperado, moderado pelo mar,
  variando entre -5\u00ba e 20\u00baC. O Mar B\u00e1ltico permaneceu afastado das
  grandes navega\u00e7\u00f5es e rotas comerciais, mantendo a regi\u00e3o \u00e0 salvo
  do imperialismo at\u00e9 o Medievo. A popula\u00e7\u00e3o total segundo censos de
  2020 \u00e9 de 6 milh\u00f5es de habitantes, sendo a menor a estoniana, com apenas
  1,3 milh\u00f5es.\\n\\nA economia b\u00e1ltica, quando na qualidade de rep\u00fablica
  sovi\u00e9tica, em compara\u00e7\u00e3o com a da antiga Uni\u00e3o Sovi\u00e9tica
  feita por Crosnier\\\\(^3\\\\) nos anos noventa \u00e9 eloquente quanto ao seu potencial
  intr\u00ednseco: acultura\u00e7\u00e3o europeia, condi\u00e7\u00f5es sociais e materiais
  de alto padr\u00e3o, moradias e terrenos amplos, alta qualifica\u00e7\u00e3o acad\u00eamica
  e profissional, tradicionalismo presente. Em 1988 o consumo de carne, uso de eletrodom\u00e9sticos,
  carros e n\u00famero de m\u00e9dicos eram superiores aos das demais rep\u00fablicas
  sovi\u00e9ticas, conquanto a regi\u00e3o seja pobre em recursos naturais para al\u00e9m
  de min\u00e9rios como fosforita e xistos betuminosos (empregados majoritariamente
  como combust\u00edvel) e s\u00f3 40% do solo seja pr\u00f3prio para cultivo, tendo
  bons rendimentos agr\u00edcolas na produ\u00e7\u00e3o de cereais e batata, e pecu\u00e1rios
  em leite e carne. Os portos mar\u00edtimos de Tallinn e Riga alcan\u00e7avam os
  maiores sal\u00e1rios, superior produtividade e turismo, representando sozinhos
  30% da pesca de toda URSS.\\n\\nPertencem \u00e0 Est\u00f4nia as grandes ilhas de
  Hiiumaa e Saaremaa e sua fronteira russa \u00e9 sulcada pelo grande Lago Peipus.
  Sua capital \u00e9 a mais antiga da Europa Setentrional, Tallinn. Um de seus nomes
  mais antigos (s\u00e9c. XII) j\u00e1 denunciava seu v\u00ednculo espiritual com
  o presente \u00e9pico, Kalevan. O nome Reval, muito\\n\\n---\\n\\n\\\\(^3\\\\) CROSNIER,
  M. A. *Principales donn\u00e9es socio-\u00e9conomiques de l''URSS et des republiques
  sovi\u00e9tiques*. *Le Courrier des Pays de l''Est*, n. 349, abr. 1990.\\n\\nfrequente
  em diversas fontes de pesquisa sobre a regi\u00e3o, surgiu com a conquista dinamarquesa
  de 1219 e s\u00f3 caiu em desuso em 1918, com o batismo em l\u00edngua est\u00f4nia
  de Tallinn, significando \u201ccastelo\u201d ou \u201cfortaleza\u201d em sua mais
  lata interpreta\u00e7\u00e3o.\\n\\nA Est\u00f4nia \u00e9 uma na\u00e7\u00e3o que
  det\u00e9m as mais singulares das curiosidades. Sua capital, Tallinn, \u00e9 a cidade
  medieval mais bem preservada do norte europeu, possui uma cidade subterr\u00e2nea
  que data do s\u00e9culo XVIII, seu transporte p\u00fablico \u00e9 totalmente gratuito
  e o acesso ao sinal de Wi-Fi \u00e9 poss\u00edvel mesmo no interior de florestas.
  Uma vez que 99,9% da popula\u00e7\u00e3o \u00e9 alfabetizada e 93% tem acesso \u00e0
  Internet, 99% dos servi\u00e7os p\u00fablicos \u00e9 feito on-line, incluindo as
  elei\u00e7\u00f5es, e leva-se em m\u00e9dia 18 minutos para se abrir uma empresa.
  Estima-se que 51% do territ\u00f3rio nacional \u00e9 coberto por florestas protegidas,
  com quatro esta\u00e7\u00f5es bem definidas e formid\u00e1veis \u201cnoites brancas\u201d
  no m\u00eas de junho. Tr\u00eas ingredientes resumem a culin\u00e1ria est\u00f4nica:
  batata, porco e sour cream ou creme de nata azedo \u2013 al\u00e9m do expressivo
  consumo de 7 mil toneladas de sorvete por ano. S\u00e3o dois os esportes prediletos
  estonianos: winter swimming ou mergulho no gelo e wife carrying ou carregamento
  de esposas.\\n\\nSegundo observa\u00e7\u00f5es lingu\u00edsticas e liter\u00e1rias
  de Kirby, a l\u00edngua \u00e9 muito pr\u00f3xima do finland\u00eas e possui um
  grande arcabou\u00e7o de literatura oral, parte da qual foi coletada e publicada
  no decorrer do s\u00e9culo XX. No entanto, atraiu muito pouca aten\u00e7\u00e3o
  fora da Est\u00f4nia, exceto na Finl\u00e2ndia e, em certa medida, na Alemanha.
  O estoniano \u00e9 abundante em dialetos, mas h\u00e1 uma forte mistura de palavras
  alem\u00e3s no estoniano, e seus contos, quando exibem tra\u00e7os de influ\u00eancia
  estrangeira, aparentemente os derivaram da Alemanha. Nos contos finlandeses, ao
  contr\u00e1rio, a influ\u00eancia russa \u00e9 com frequ\u00eancia muito mais clara.\\n\\nHIST\u00d3RIA
  DA EST\u00d4NIA\\n\\nA hist\u00f3ria da Est\u00f4nia pode ser resumida por uma not\u00e1vel
  e copiosa lista de her\u00f3is obstinados em uma longa defesa da autodetermina\u00e7\u00e3o
  nacional-popular contra invasores e culturas estranhas que buscam de modo ou outro
  corroer sua liberdade em todos os dom\u00ednios. Assim \u00e9 exatamente, como veremos,
  a epopeia do filho de Kalev, o Kalevipoeg: o frondoso gigante loiro solit\u00e1rio,
  um tanto desajeitado \u00e9 verdade, mas bem-quisto por Taara e por todos os deuses,
  protetor da natureza, amigo dos pequenos animais e do pr\u00f3prio povo. Tal como
  a Il\u00edada \u00e9 uma alegoria nacional para o povo aqueu-heleno jovem e conquistador,
  o Lus\u00edadas uma alegoria para o portugu\u00eas aventureiro, e o Fausto para
  o erudito germ\u00e2nico, o Kalevipoeg \u00e9 o s\u00edmbolo da resist\u00eancia
  estoniana, que mesmo diante de inimigos sempre mais numerosos, n\u00e3o d\u00e1
  passos atr\u00e1s, mas salta \u00e0 frente; mesmo quando lhe falta uma espada, o
  gigante est\u00f4nio arranca uma \u00e1rvore inteira e a transforma numa clava esmagadora;
  mesmo que os mais poderosos feiticeiros pare\u00e7am invenc\u00edveis, n\u00e3o
  lhes d\u00e1 ouvidos aos encantamentos, mas subjuga a sombra e a ilus\u00e3o com
  pensamentos honrados, atos nobres e punhos firmes. Despreza as facilidades de varinhas
  m\u00e1gicas porque prefere fazer tudo com as pr\u00f3prias m\u00e3os e m\u00e9rito.
  Sabe ser feroz em combate, como sabe ser alegre em festas. Tem a inoc\u00eancia
  de uma crian\u00e7a e a sabedoria de um filho dos deuses. N\u00e3o dispensa tesouros,
  mas tamb\u00e9m n\u00e3o os guarda para si: empreende jornadas inusitadas em nome
  do bem-estar e seguran\u00e7a do diligente trabalhador est\u00f4nio, preocupando-se
  em dar-lhe pontes, muralhas, casas e riquezas. E v\u00edtima, ao final, da consequ\u00eancia
  de um erro pr\u00f3prio (pois que como todo her\u00f3i, Kalevipoeg comete imprud\u00eancias,
  mas como raros experimenta o amargor do arrependimento) \u00e9 ainda muito celebrado
  pela corte dos deuses e aguarda, pacientemente, pela grande conflagra\u00e7\u00e3o
  final, onde se erguer\u00e1 em defesa de sua terra e sangue.\\n\\nUma raiz, dois
  caules: fino-\u00fagricos e indo-europeus\\n\\nSegundo a c\u00e9lebre arque\u00f3loga
  lituana Gimbutas\\\\(^4\\\\), registros indicam que os primeiros povoadores da regi\u00e3o,
  os chamados proto-b\u00e1lticos, se instalaram por volta do Nono mil\u00eanio AEC.
  Os est\u00f4nios s\u00e3o tipificados como fino-\u00fagricos mais pela l\u00edngua
  que pela etnia ou ra\u00e7a, de onde se costuma deduzir que sua origem geogr\u00e1fica
  prov\u00e9m dos montes Urais, uma cordilheira que fatia transversalmente a R\u00fassia
  do \u00c1rtico ao Cazaquist\u00e3o, uma vez que o termo \u00fagrico \u00e9 um sin\u00f4nimo
  para ur\u00e1lico por meio de um \u00e9timo comum de dif\u00edcil precis\u00e3o
  entre o magiar antigo e o grego bizantino. A ocupa\u00e7\u00e3o humana na regi\u00e3o
  ur\u00e1lica se perde nas brumas do Paleol\u00edtico e remonta, segundo ind\u00edcios
  de cultura musteriense, ao *Homo neanderthalensis*.\\n\\n\u00c9 a partir do Segundo
  mil\u00eanio AEC, com a chegada de distintas ondas indo-europeias rumando para o
  Oeste, dentre germ\u00e2nicos, celtas, citas e eslavos, que a popula\u00e7\u00e3o
  se transforma pela mistura e parte se desloca para o Nordeste. Assim, conforme real\u00e7ou
  Gimbutas, de modo geral para os b\u00e1lticos, sua origem e desenvolvimento \u201c\u00e9
  insepar\u00e1vel dos outros grupos indo-europeus\u201d, seja na rela\u00e7\u00e3o
  de sua rama ocidental com a cultura tumular centro e norte europeias, ou na oriental
  com demais tribos fino-\u00fagricas da R\u00fassia, cim\u00e9rios e eslavos. Constituiu-se
  assim as tribos b\u00e1lticas primitivas dos latg\u00e1lios, semig\u00e1lios, curos,
  lituanos, liv\u00f4nios, prussianos e, ao extremo norte da regi\u00e3o, estavam
  os primitivos est\u00f4nios.\\\\(^5\\\\)\\n\\n---\\n\\n\\\\(^4\\\\) GIMBUTAS, M.
  *The Balts*. Londres: Thames e Hudson, 1963.\\n\\n\\\\(^5\\\\) Ibid. p. 21.\\n\\nEstrab\u00e3o
  e T\u00e1cito, na passagem do primeiro para o segundo s\u00e9culo, denunciavam a
  obscuridade que reca\u00eda sobre os povos do Norte, a partir das frentes germ\u00e2nicas
  que circundavam ao nascente Imp\u00e9rio. T\u00e1cito, por\u00e9m, foi o primeiro
  a tomar consci\u00eancia da exist\u00eancia destes povos em sua *Germania* com as
  denomina\u00e7\u00f5es *aestii*, *fenni* e *suiones*. Em meu estudo e revis\u00e3o\\\\(^6\\\\)
  da tradu\u00e7\u00e3o deste cl\u00e1ssico etno-historiogr\u00e1fico real\u00e7o
  a hip\u00f3tese dos su\u00edones ou suevos (a partir dos quais T\u00e1cito nomeou
  o mar originalmente como *Mare Suebicum*) constitu\u00edrem um estrato antigo do
  povo escandinavo ulterior, cuja caracteriza\u00e7\u00e3o por T\u00e1cito foi atrelada
  ao antigo mito da Hiperb\u00f3rea em seu 45\u00ba par\u00e1grafo, a mais antiga
  e remota terra do culto solar relacionado ao deus d\u00f3rico Apolo, segundo Her\u00f3doto
  em seu Livro IV, XIII, do *Hist\u00f3ria* (\u201cmais longe ainda vivem os Hiperb\u00f3reos\u201d)
  e P\u00edndaro na sua *P\u00edtica* X, 30 (\u201co caminho maravilhoso para a assembleia
  dos Hiperb\u00f3reos\u201d):\\n\\nPara l\u00e1 dos su\u00edones h\u00e1 outro mar
  [...] a prova disto \u00e9 que o \u00faltimo brilho do sol ao se p\u00f4r continua
  claro at\u00e9 o nascer novamente do sol, de modo que ofusca as estrelas; a cren\u00e7a
  ainda acrescenta que \u00e9 poss\u00edvel ouvir o barulho de\\n\\n---\\n\\n\\\\(^6\\\\)
  Minha edi\u00e7\u00e3o refere-se a: ANDRADE, Maria Cec\u00edlia Albernaz Lins Silva
  de. *A Germania de T\u00e1cito*: tradu\u00e7\u00e3o e coment\u00e1rios. 2011. 118
  f. Disserta\u00e7\u00e3o (Programa de P\u00f3s-Gradua\u00e7\u00e3o em Letras Cl\u00e1ssicas
  do Departamento de Letras Cl\u00e1ssicas e Vern\u00e1culas da Faculdade de Filosofia,
  Letras e Ci\u00eancias Humanas) \u2013 Universidade de S\u00e3o Paulo, S\u00e3o
  Paulo, 2011; e pode ser acessada em: O SENTINELA. A \u201cGerm\u00e2nia\u201d de
  T\u00e1cito: edi\u00e7\u00e3o de J. O. Bilda. Jan. 2021. Dispon\u00edvel em: <https://www.osentinela.org/a-germania-de-tacito-edicao-de-j-o-bilda/>.\\n\\nquando
  ele emerge e ver as imagens dos cavalos e os raios de sua cabe\u00e7a.\\\\textsuperscript{7}\\n\\nDeste
  povo, T\u00e1cito parte para o que se situa no \u201clitoral \u00e0 direita do mar
  dos suevos, onde s\u00e3o banhados os povos \u00e9stios\u201d, terminologia a qual
  dou ainda maior realce em minha citada edi\u00e7\u00e3o, pois que nos diz diretamente
  respeito.\\n\\nO termo latino refere-se literalmente aos povos do extremo leste,
  atualmente \u00e0 por\u00e7\u00e3o setentrional do B\u00e1ltico. Alguns relatos
  indicam que os \u00e9stios seriam antigos prussianos, habitantes da regi\u00e3o
  que hoje compreende a Let\u00f4nia e a Litu\u00e2nia. No entanto esta hip\u00f3tese
  n\u00e3o concorda com a descri\u00e7\u00e3o exata de T\u00e1cito. Por conta da presen\u00e7a
  do \u00e2mbar na regi\u00e3o, a hip\u00f3tese mais concorde identifica este como
  sendo o povo origin\u00e1rio dos atuais est\u00f4nios ao lado dos lap\u00f5es, falantes
  de idioma f\u00ednico e pr\u00f3ximos linguisticamente aos finlandeses. Como tra\u00e7o
  dominante dos \u00e9stios, aponta T\u00e1cito: \u201cCultivam gr\u00e3os e outros
  frutos da terra mais pacientemente que pela costumeira in\u00e9rcia dos germanos\u201d,
  criando assim alguma diferencia\u00e7\u00e3o \u00e9tnica entre os demais germ\u00e2nicos.\\n\\n\\\\textit{O
  B\u00e1ltico como campo de batalha medieval}\\n\\nEstas defini\u00e7\u00f5es s\u00e3o
  as mais recuadas em termos de registros documentais e pesquisa historiogr\u00e1fica
  na determina\u00e7\u00e3o dos povos b\u00e1lticos e, em particular, est\u00f4nios.
  Farei algumas considera\u00e7\u00f5es historiogr\u00e1ficas a seguir tendo por base
  o excelente estudo geopol\u00edtico de Pascal Lorot\\\\textsuperscript{8}.\\n\\n\\\\textsuperscript{7}
  Ibid. p. 54.\\n\\\\textsuperscript{8} LOROT, P. \\\\textit{Los pa\u00edses b\u00e1lticos}.
  Trad. M. A. N. Bigorra. M\u00e9xico: Fondo de Cultura Econ\u00f3mica, 1993.\"",
