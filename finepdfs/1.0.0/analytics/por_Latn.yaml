  elegeu Rodrigo Kede Lima ao cargo de Diretor-presidente,  em conson\u00e2ncia com
  o plano de sucess\u00e3o de La\u00e9rcio Cosentino, fundador da Companhia, que continuar\u00e1
  como Diretor Executivo Chefe (CEO) durante um per\u00edodo de transi\u00e7\u00e3o
  de at\u00e9 3 anos. Tamb\u00e9m nesta data, portanto, La\u00e9rcio Cosentino renunciou
  ao mandato de Diretor-presidente.\\n\\nRodrigo Kede esteve recentemente \u00e0 frente
  da Vice-Presid\u00eancia Mundial de Transforma\u00e7\u00e3o da IBM, atuou como CEO
  da IBM Brasil de 2012 a 2014, per\u00edodo no qual a IBM cresceu de forma sustent\u00e1vel
  no Brasil. Anteriormente foi vice-presidente da divis\u00e3o de Servi\u00e7os de
  Tecnologia, entre 2011 a 2012, diretor Administrativo e Financeiro para a Am\u00e9rica
  Latina (CFO Latam), entre 2009 a 2011, e tamb\u00e9m diretor Administrativo e Financeiro
  para o Brasil (CFO Brasil), de 2006 a 2009.\\n\\nLa\u00e9rcio Cosentino, como CEO,
  focar\u00e1 na defini\u00e7\u00e3o e acompanhamento da estrat\u00e9gia de tecnologia,
  produto e distribui\u00e7\u00e3o, ampliar\u00e1 sua presen\u00e7a junto a clientes.
  Como Diretor-presidente, Rodrigo Kede reportar\u00e1 ao CEO e responder\u00e1 pela
  condu\u00e7\u00e3o da estrat\u00e9gia de crescimento, opera\u00e7\u00e3o, gest\u00e3o
  de pessoas e liderar\u00e1 as vicepresid\u00eancias da Companhia. Rodrigo Kede ren\u00fancia
  ao cargo de membro do Conselho de Administra\u00e7\u00e3o nesta data e passar\u00e1
  a participar das reuni\u00f5es de conselho como membro convidado.\\n\\nUma vez conclu\u00edda
  a referida transi\u00e7\u00e3o, Rodrigo Kede acumular\u00e1 os cargos de Diretor-presidente
  e CEO e La\u00e9rcio Cosentino, que segue como membro do Conselho de Administra\u00e7\u00e3o
  e presidente do Comit\u00ea de Estrat\u00e9gia e Tecnologia, se candidatar\u00e1
  a reassumir a presid\u00eancia do Conselho de Administra\u00e7\u00e3o.\\n\\nS\u00e3o
  Paulo, 15 de junho de 2015.\\n\\nGilsomar Maia Sebasti\u00e3o Diretor de Rela\u00e7\u00f5es
  com Investidores TOTVS S.A. Rela\u00e7\u00f5es com Investidores\\n\\nTel.: (11)
  2099-7105/7097/7773\\n\\nfirstname.lastname@example.org http://ri.totvs.com.br/\"",
  "\"Patrim\u00f4nio cultural em territ\u00f3rio urbano contempor\u00e2neo:\\n\\no
  caso do Circuito Cultural Pra\u00e7a da Liberdade \u2013 Belo Horizonte (MG)\\n\\nCl\u00e9sio
  Barbosa Lemos J\u00fanior Arl\u00eaude Bortolozzi\\n\\nR e s u m o : Acredita-se
  que a leitura da contemporaneidade caracteriza-se pelo confronto de vis\u00f5es
  e ideias diferentes sobre os mesmos fen\u00f4menos. Diante dessa realidade contradit\u00f3ria,
  refletir, de maneira cr\u00edtica, sobre a tem\u00e1tica do patrim\u00f4nio cultural
  nas cidades contempor\u00e2neas \u00e9 o principal objetivo deste artigo. Para tanto,
  este trabalho foi estruturado da seguinte maneira: primeiramente tratou-se hist\u00f3rica
  e conceitualmente o patrim\u00f4nio cultural com destaque para o conceito de identidade.
  Posteriormente, trabalhou-se o territ\u00f3rio urbano focando os processos de \\\"gentrifica\u00e7\u00e3o\\\"
  e \\\"teatraliza\u00e7\u00e3o\\\", caracter\u00edsticos do mundo contempor\u00e2neo.
  O denominado Circuito Cultural Pra\u00e7a da Liberdade, localizado em Belo Horizonte
  (MG), foi o objeto de estudo com o prop\u00f3sito de analisar uma pol\u00edtica
  p\u00fablica urbana.\\n\\nPalavras-chave: patrim\u00f4nio cultural; territ\u00f3rio
  urbano; Circuito Cultural Pra\u00e7a da Liberdade.\\n\\nIntrodu\u00e7\u00e3o\\n\\nA
  contemporaneidade caracteriza-se pelo confronto de vis\u00f5es e ideias diferentes
  sobre os mesmos fen\u00f4menos. Onde uns veem desvantagens outros veem oportunidades,
  quando para alguns o tempo parece terminado, para outros pode estar apenas come\u00e7ando.
  Este artigo foi escrito a partir dessa vis\u00e3o contradit\u00f3ria, trazendo como
  tema o patrim\u00f4nio cultural e o territ\u00f3rio urbano e focando sua aten\u00e7\u00e3o
  na tend\u00eancia contempor\u00e2nea de transformar os bens culturais em um produto
  de consumo. Refletir, de maneira cr\u00edtica, sobre essa tem\u00e1tica levanta
  questionamentos sobre o tratamento que temos dado ao legado cultural deixado pelos
  nossos antecessores e nos faz pensar sobre a gest\u00e3o das cidades, al\u00e9m
  de permitir refor\u00e7ar o quadro de estudos interdisciplinares que envolvem o
  Patrim\u00f4nio Cultural, a Geografia Urbana e a Geografia Cultural.\\n\\nPara a
  estrutura\u00e7\u00e3o do trabalho optou-se, primeiramente, por tratar a contextualiza\u00e7\u00e3o
  hist\u00f3rico-conceitual do patrim\u00f4nio cultural, destacando sua rela\u00e7\u00e3o
  com a identidade individual e coletiva. Posteriormente, olhou-se para o territ\u00f3rio
  urbano a partir da rela\u00e7\u00e3o que estabelece com a cultura, focando a aten\u00e7\u00e3o
  nos processos de \\\"gentrifica\u00e7\u00e3o\\\" e \\\"teatraliza\u00e7\u00e3o das
  cidades\\\", caracter\u00edsticos das interven\u00e7\u00f5es urbanas contempor\u00e2neas.
  O estudo finaliza com a apresenta\u00e7\u00e3o e algumas considera\u00e7\u00f5es\\n\\nacerca
  do Circuito Cultural Pra\u00e7a da Liberdade, localizado em Belo Horizonte e definido
  por Dayane Barbosa (2013) como \\\"o maior complexo cultural do pa\u00eds e o \u00fanico
  do mundo fruto de uma parceria p\u00fablico-privada\\\".\\n\\nProcurou-se lan\u00e7ar
  um olhar e estabelecer um di\u00e1logo diferenciado com os aspectos envolvidos no
  estudo, sem, contudo, ter a pretens\u00e3o de criar conceitos novos ou mesmo esgotar
  o tema aqui abordado, muito pelo contr\u00e1rio, refor\u00e7a-se a necessidade de
  que esse debate seja sempre ampliado e tratado de maneira profunda para que se possa
  buscar uma vis\u00e3o de conjunto com rela\u00e7\u00e3o \u00e0 problem\u00e1tica
  ambiental-urbana.\\n\\nSobre o patrim\u00f4nio cultural \u2013 uma vis\u00e3o ao
  longo das eras\\n\\nOrigin\u00e1rio do latim patrimonium, cujo significado \u00e9
  de heran\u00e7a familiar ou do pater (pai), o ''patriarca'', que, no Imp\u00e9rio
  Romano, como em geral em toda a Antiguidade, detinha o governo ou poder de dispor
  sobre seus ''pertences vivos'' particulares, do cachorro \u00e0 vovozinha, fazendo
  o que bem entendesse, do empr\u00e9stimo e venda \u00e0 morte. (PATRIM\u00d4NIO,
  [s.d.], grifos nossos).\\n\\nA complexidade do conceito de patrim\u00f4nio cultural
  no mundo, ao longo dos \u00faltimos 50 anos, tem sofrido altera\u00e7\u00f5es e
  aumentado de maneira exponencial. Pode-se dizer que passou de um objeto f\u00edsico,
  marcado pelo tempo, para uma forma de express\u00e3o de uma determinada cultura.
  As altera\u00e7\u00f5es socioculturais sofridas pelo termo possuem rela\u00e7\u00e3o
  diretamente proporcional com as altera\u00e7\u00f5es na rela\u00e7\u00e3o do homem
  com o meio ambiente.\\n\\nDo ponto de vista etimol\u00f3gico, a palavra patrim\u00f4nio
  cont\u00e9m dois voc\u00e1bulos: pater e nomos: o primeiro, do latim, relaciona-se
  ao chefe de fam\u00edlia; e o segundo, do grego, relaciona-se aos usos e costumes
  pertinentes \u00e0 origem tanto de uma fam\u00edlia quanto de uma cidade. Por outro
  lado, patrim\u00f4nio est\u00e1 associado \u00e0 ideia de um bem transmitido de
  um indiv\u00edduo para outro. Considerando as variadas escalas de abordagem, o indiv\u00edduo
  pode ser da natureza de uma pessoa, uma fam\u00edlia, uma comunidade, uma na\u00e7\u00e3o
  ou a humanidade. Assim, pode-se dizer que o patrim\u00f4nio est\u00e1 associado
  ao contato permanente com as origens que fundaram uma sociedade e acompanha os seus
  distintos caracteres.\\n\\nAo referenciar os termos patrim\u00f4nio cultural e sociedade,
  torna-se dif\u00edcil dissoci\u00e1-los das express\u00f5es cultura e mem\u00f3ria
  que, por sua vez, remetem diretamente \u00e0 identidade de um determinado povo.
  Conforme nos mostra Mar\u00edlia Machado Rangel (2002, p. 22): \\\"A cultura e mem\u00f3ria
  de um povo s\u00e3o os principais fatores de sua coes\u00e3o e identidade, os respons\u00e1veis
  pelos liames que unem as pessoas em torno de uma no\u00e7\u00e3o comum de compartilhamento
  e identidade, no\u00e7\u00e3o b\u00e1sica para o senso de cidadania\\\".\\n\\nA
  prop\u00f3sito da refer\u00eancia de escala, hoje em dia, devido ao fen\u00f4meno
  da globaliza\u00e7\u00e3o, temos a sociedade contempor\u00e2nea funcionando ao modo
  da escala planet\u00e1ria, assim, o legado cultural a ser transmitido para as gera\u00e7\u00f5es
  futuras deve ser visto como uma representa\u00e7\u00e3o da mem\u00f3ria e da identidade
  coletiva. Diante dessa abordagem, torna-se conveniente apresentar algumas considera\u00e7\u00f5es
  acerca do conceito de identidade, uma vez que ser\u00e1 \u00fatil mais adiante.
  Para tanto, dois expoentes da Sociologia s\u00e3o\\n\\nreferenciados, \u00c9mile
  Durkheim (1858/1917), franc\u00eas, considerado o pai da Sociologia e fundador da
  Escola Francesa; e o alem\u00e3o Norbert Elias (1897/1990), que compilou em uma
  \u00fanica obra cinquenta anos de reflex\u00f5es sobre as rela\u00e7\u00f5es indiv\u00edduo/sociedade.
  Tratamos os conceitos de Elias referenciando sua obra intitulada A sociedade dos
  indiv\u00edduos (1994), no entanto, os estudos de Bernardo Novais da Mata Machado
  (2002) foram relevantes e balizaram as argumenta\u00e7\u00f5es aqui apresentadas.\\n\\n\u00c9mile
  Durkheim disse, em rela\u00e7\u00e3o ao indiv\u00edduo e ao seu processo de socializa\u00e7\u00e3o:
  \\\"a sociedade encontra-se, a cada nova gera\u00e7\u00e3o, na presen\u00e7a de
  uma t\u00e1bua rasa sobre a qual \u00e9 necess\u00e1rio construir novamente\\\"
  (FERRARI, [201?]). A sociedade \u00e9 preexistente ao sujeito individual, uma entidade
  que sintetiza o passado e nos transmite os c\u00f3digos de valores \u00e9ticos,
  morais, religiosos ou comportamentais comuns a um determinado grupo e que nos permite
  sentirmos integrados. Esse fen\u00f4meno de integra\u00e7\u00e3o, ao qual damos
  o nome de acultura\u00e7\u00e3o, coloca-nos numa plataforma comum, criando o sentimento
  de comunidade e de pertencimento de grupo. Qualquer sujeito individual \u00e9, por
  conseguinte, um produto social, pois se relaciona com o mundo tendo por base os
  c\u00f3digos do grupo que comp\u00f5e. Entretanto, seria imposs\u00edvel negar que
  cada indiv\u00edduo se relaciona com o outro de forma \u00fanica e particular, e
  \u00e9 exatamente nessas especificidades ou particularidades que se cria uma din\u00e2mica
  de transforma\u00e7\u00e3o.\\n\\nPor outro lado, os pressupostos tra\u00e7ados por
  Norbert Elias o levaram a definir que o que interessa \u00e9 a rede de rela\u00e7\u00f5es
  entre indiv\u00edduo e sociedade:\\n\\nPara termos uma vis\u00e3o mais detalhada
  desse tipo de inter-rela\u00e7\u00e3o, podemos pensar no objeto de que deriva o
  conceito de rede: a rede de tecido. Nessa rede, ligam-se uns aos outros muitos fios
  isolados. No entanto, nem a totalidade da rede nem a forma assumida por cada um
  de seus fios podem ser compreendidas em termos de um \u00fanico fio, ou mesmo de
  todos eles isoladamente considerados; a rede s\u00f3 \u00e9 compreens\u00edvel em
  termos da maneira como eles se ligam, de sua rela\u00e7\u00e3o rec\u00edproca (ELIAS,
  1994, p. 35).\\n\\nO autor destaca, sobre a historicidade dos indiv\u00edduos e
  da sociedade, que ambos est\u00e3o em constante fluxo e s\u00e3o mut\u00e1veis,
  embora as mudan\u00e7as n\u00e3o sejam sempre lineares ou progressivas. Al\u00e9m
  disso, Elias (1994) estabelece os conceitos de \\\"identidade-eu\\\", \\\"identidade-n\u00f3s\\\"
  e de \\\"balan\u00e7a n\u00f3s-eu\\\":\\n\\nCada pessoa s\u00f3 \u00e9 capaz de
  dizer ''eu'' se e porque pode, ao mesmo tempo, dizer ''n\u00f3s'' [...]. A sociedade
  n\u00e3o \u00e9 externa aos indiv\u00edduos; tampouco \u00e9 simplesmente um ''objeto
  oposto'' ao indiv\u00edduo; ela \u00e9 aquilo que todo indiv\u00edduo quer dizer
  quando diz ''n\u00f3s'' [...]. E esse fato, o de cada eu estar irrevogavelmente
  inserido num ''n\u00f3s'', deixa claro por que a entremea\u00e7\u00e3o dos atos,
  planos e prop\u00f3sitos de muitos ''eus'' origina constantemente algo que n\u00e3o
  foi planejado, pretendido ou criado por nenhum indiv\u00edduo (ELIAS, 1994, p. 57).\\n\\nQuanto
  \u00e0 \\\"balan\u00e7a n\u00f3s-eu\\\", ela representa a maior ou menor inclina\u00e7\u00e3o,
  ao longo da hist\u00f3ria, para um ou outro polo da identidade. Como exemplo, podemos
  dizer que indiv\u00edduos de sociedades primitivas davam mais import\u00e2ncia \u00e0
  vida grupal (identidade-n\u00f3s) devido a sua depend\u00eancia para sobreviver.
  A partir do per\u00edodo renascentista europeu, tivemos o inverso (identidade-eu),
  por ter sido firmada uma tend\u00eancia hist\u00f3rica de individualiza\u00e7\u00e3o
  (MACHADO, 2002, p. 39). Em contrapartida, o autor nos alerta para o momento presente,
  em que a humanidade come\u00e7a a ser \\\"a unidade de sobreviv\u00eancia de todas
  as pessoas como indiv\u00edduos e de todos os subgrupos no interior dela\\\" (ELIAS,
  1994, p. 87). Dessa forma, podemos entender identidade, pelos conceitos de Norbert
  Elias, como uma rede de significados presentes na mem\u00f3ria dos indiv\u00edduos
  de uma determinada sociedade.\\n\\nUma vez referenciada a identidade, mesmo que
  sucintamente, passemos ao tratamento do que se prop\u00f5e esta se\u00e7\u00e3o.\\n\\nObras
  realizadas pelos homens v\u00eam sendo preservadas desde a Antiguidade Cl\u00e1ssica.
  Na Roma Antiga, os edif\u00edcios recebiam o nome de monumentum, possu\u00edam um
  car\u00e1ter mais celebrativo e sua finalidade era evocar e transmitir a mem\u00f3ria
  de eventos ou personagens not\u00e1veis (MENICONI, 1998). Assim, desde Roma at\u00e9
  o s\u00e9culo XVIII, houve uma crescente preocupa\u00e7\u00e3o com os monumentos.
  A partir da hegemonia do cristianismo na Europa, in\u00edcio do s\u00e9culo XV,
  os papas passaram a se preocupar com o patrim\u00f4nio cultural, condenando a destrui\u00e7\u00e3o
  dos monumentos (CHOAY, 2006). Tal postura deu origem a uma preserva\u00e7\u00e3o
  dotada de medidas protetivas e restauradoras.\\n\\nHistoricamente, a discuss\u00e3o
  em torno do tema patrim\u00f4nio surge na Europa Renascentista, mais especificamente
  no Quattrocento, quando se come\u00e7a a reflex\u00e3o sobre a concep\u00e7\u00e3o
  linear do tempo e passa-se a acreditar na ideia de progresso. Estabelecendo uma
  compara\u00e7\u00e3o entre os valores do seu tempo e da \u00e9poca cl\u00e1ssica,
  os pensadores humanistas se conscientizaram da diferen\u00e7a entre os dois per\u00edodos
  e estabeleceram o distanciamento entre o passado e o contempor\u00e2neo, sendo este
  \u00faltimo entendido como uma continuidade do primeiro (FONSECA, 2008). Assim,
  o passado ganha uma identidade pr\u00f3pria, podendo ser analisado como um objeto,
  e os monumentos ganham, enquanto elementos concretos de uma a\u00e7\u00e3o, uma
  natureza de testemunhos do passado, ou seja, adquirem um valor documental, hist\u00f3rico
  e did\u00e1tico que autentica, legitima e confirma o presente.\\n\\nAs ideias pol\u00edticas
  e filos\u00f3ficas iluministas institucionalizaram a preserva\u00e7\u00e3o do patrim\u00f4nio
  cultural, que se transformou numa arma pol\u00edtica poderosa, tornando-se a imagem
  do Estado (CHOAY, 2006). Encontramos um bom exemplo na Revolu\u00e7\u00e3o Francesa
  que, num primeiro momento, seguindo os modelos agressivos das outras revolu\u00e7\u00f5es
  hist\u00f3ricas, destruiu os elementos que fossem representativos da ideologia anterior,
  ent\u00e3o repudiada. As a\u00e7\u00f5es de vandalismo se tornaram uma pr\u00e1tica
  constante, at\u00e9 que surge uma corrente protetora dos bens associados ao antigo
  regime, argumentando que, apesar de simbolizarem ideias recusadas, naquele tempo,
  os monumentos deveriam ser encarados como testemunho hist\u00f3rico. Com tal iniciativa,
  preservando os importantes monumentos associados ao clero e aos aristocratas, os
  valores do novo sistema de governo \u2013 Rep\u00fablica Democr\u00e1tica \u2013
  s\u00e3o refor\u00e7ados e os monumentos passam a funcionar como fundamenta\u00e7\u00e3o
  para a identidade da estrutura social vigente, ganhado com isso um valor nacional.
  Al\u00e9m disso, dois aspectos significantes referentes a esse per\u00edodo s\u00e3o
  dignos de nota: o primeiro diz respeito ao conceito de conserva\u00e7\u00e3o patrimonial,
  que adquire uma avalia\u00e7\u00e3o, uma escolha e uma decis\u00e3o pol\u00edtica,
  o que acarreta, muitas vezes, a perda e/ou destrui\u00e7\u00e3o de algum elemento;
  o segundo refere-se ao fato de que o patrim\u00f4nio passa a ser visto como fonte
  de riqueza, ou seja, pela sua capacidade de gerar receita transforma-se num recurso
  estrat\u00e9gico, ganhando valor econ\u00f4mico. (FONSECA, 2008).\\n\\n\u00c9 preciso
  lembrar que, apesar de transcorridos mais de duzentos anos, a maneira\\n\\nde manifestar
  o descontentamento e a insatisfa\u00e7\u00e3o de muitos indiv\u00edduos continua
  sendo, ainda e infelizmente, o vandalismo com rela\u00e7\u00e3o ao patrim\u00f4nio,
  haja vista as manifesta\u00e7\u00f5es que v\u00eam ocorrendo em nossas cidades desde
  o m\u00eas de junho de 2013.\\n\\nContudo, na transi\u00e7\u00e3o do s\u00e9culo
  XIX para o s\u00e9culo XX, a postura do Estado com rela\u00e7\u00e3o \u00e0s pr\u00e1ticas
  de preserva\u00e7\u00e3o at\u00e9 ent\u00e3o adotadas foi questionada devido a sua
  inefici\u00eancia diante dos interesses e influ\u00eancias mercadol\u00f3gicos.
  Dessa forma, o s\u00e9culo XX ficou caracterizado pelo valor econ\u00f4mico do patrim\u00f4nio,
  que se tornou o grande trunfo das pol\u00edticas de preserva\u00e7\u00e3o. Entretanto,
  conforme destaca Fran\u00e7oise Choay (2006), durante os anos de 1930 ocorreram
  em Atenas duas confer\u00eancias internacionais de interesse para a discuss\u00e3o
  do patrim\u00f4nio cultural e da cidade. A primeira, datada de 1931, abordara pela
  primeira vez em confer\u00eancia internacional a quest\u00e3o da preserva\u00e7\u00e3o
  dos monumentos hist\u00f3ricos e dos problemas das cidades antigas. A segunda, realizada
  em 1933, tratara da promo\u00e7\u00e3o do \\\"novo\\\". Tanto arquitetura quanto
  urbanismo fariam \\\"t\u00e1bula rasa\\\" do passado. Com rela\u00e7\u00e3o ao patrim\u00f4nio
  cultural, a confer\u00eancia de 1933 propunha:\\n\\nN\u00e3o se deviam demolir edif\u00edcios
  ou conjuntos arquitet\u00f4nicos remanescentes de culturas passadas: a) quando s\u00e3o
  realmente representativos de sua \u00e9poca, e como tais, podem ser de interesse
  geral e servir para a educa\u00e7\u00e3o do povo; b) quando sua exist\u00eancia
  n\u00e3o compromete as condi\u00e7\u00f5es de sa\u00fade da popula\u00e7\u00e3o
  que vive na vizinhan\u00e7a; c) quando a presen\u00e7a ou a situa\u00e7\u00e3o desses
  velhos quarteir\u00f5es n\u00e3o interfere com o tra\u00e7ado das principais art\u00e9rias
  do tr\u00e1fego urbano, nem prejudica de alguma sorte o crescimento org\u00e2nico
  da cidade. (CARTA DE ATENAS, 1933 apud PEREIRA, 1998, p. 2).\\n\\nO resultado dessa
  postura \u00e9 bastante conhecido, basta rever as v\u00e1rias interven\u00e7\u00f5es
  urbanas realizadas sob esses princ\u00edpios em v\u00e1rias cidades ao redor do
  mundo, cujos resultados podem ser sintetizados pelo termo \\\"pol\u00edtica do arrasa
  quarteir\u00f5es\\\". Para Choay (1984) apud Pereira (1998, p. 2), essas \\\"[...]
  duas confer\u00eancias de Atenas oferecem o paradigma de uma ambival\u00eancia que
  tem caracterizado nossa \u00e9poca desde a Primeira e, sobretudo, da Segunda Guerra
  Mundial, per\u00edodo durante o qual se tem destru\u00eddo e conservado numa escala
  sem precedente\\\".\\n\\nNa contemporaneidade, com o desenvolvimento de novas t\u00e9cnicas,
  a introdu\u00e7\u00e3o do conceito de sustentabilidade e a democratiza\u00e7\u00e3o
  do saber, foi colocado em discuss\u00e3o o valor econ\u00f4mico do patrim\u00f4nio
  cultural. Para exemplificar essa fase lembraremos a sele\u00e7\u00e3o das \\\"Novas
  Sete Maravilhas do Mundo\\\", um evento de escala planet\u00e1ria, fundado em 1999
  por Bernard Weber e com t\u00e9rmino em 2007, que envolveu a escolha, por meio de
  voto popular via internet, de 7 entre 20 monumentos que supostamente representam
  a humanidade. Curiosamente, 3 desses monumentos encontram-se no Brasil, na China
  e na \u00cdndia, pa\u00edses classificados dentre os mais populosos e considerados
  as \\\"economias emergentes\\\" do mundo. Ironicamente, apesar de toda a sua hist\u00f3ria,
  a Europa teve apenas 1 monumento na lista \u2013 Coliseu (Roma) \u2013; e, convenientemente,
  o Cristo Redentor, constru\u00eddo entre 1931 e 1936 em homenagem ao cristianismo
  e \u00e0 hospitalidade do povo brasileiro, foi considerado com maior valor patrimonial
  do que a Acr\u00f3pole de Atenas (Gr\u00e9cia). Al\u00e9m disso, \u00e9 oportuno
  citar que a China possui um total de 35 bens na lista de patrim\u00f4nio mundial
  entre paisagens e monumentos.\\n\\nSeria \u00f3timo se pud\u00e9ssemos acreditar
  que a crescente valoriza\u00e7\u00e3o do patrim\u00f4nio cultural no mundo se d\u00e1
  em fun\u00e7\u00e3o do reconhecimento do seu verdadeiro significado\\n\\ne em detrimento
  do crescente desenvolvimento da ind\u00fastria tur\u00edstica cultural. No entanto,
  as evid\u00eancias nos confirmam o contr\u00e1rio, visto que at\u00e9 novembro de
  2007 podia ser encontrado no site do Minist\u00e9rio da Cultura do governo brasileiro
  uma chamada que dizia: \\\"Ele (Cristo Redentor) \u00e9 uma maravilha, a elei\u00e7\u00e3o
  do monumento poder\u00e1 representar uma inje\u00e7\u00e3o anual de US$ 89,43 milh\u00f5es
  na economia do Rio, com o aumento da chegada de turistas estrangeiros e [...] prev\u00ea
  a cria\u00e7\u00e3o de cerca de 80 mil novos empregos\\\" (CRISTO, 2007).\\n\\nTal
  abordagem n\u00e3o pretende atribuir maior ou menor valor a este ou \u00e0quele
  patrim\u00f4nio, mas, t\u00e3o somente, destacar que as chamadas \\\"economias em
  desenvolvimento\\\" t\u00eam visto no patrim\u00f4nio cultural uma grande oportunidade
  para a sua afirma\u00e7\u00e3o econ\u00f4mica associada ao turismo cultural, este
  que vem se constituindo como o propiciador da mercantiliza\u00e7\u00e3o das singularidades,
  das identidades, das tradi\u00e7\u00f5es, das express\u00f5es culturais, tudo em
  fun\u00e7\u00e3o de galgar vantagens competitivas no mercado global. Paradoxalmente,
  a mesma atividade econ\u00f4mica que utiliza o patrim\u00f4nio cultural para se
  afirmar o destr\u00f3i, haja vista os centros hist\u00f3ricos da maioria das cidades
  brasileiras que est\u00e3o sendo transformados intensamente, diante dos parcos incentivos
  oferecidos pelo poder p\u00fablico para a conserva\u00e7\u00e3o do patrim\u00f4nio,
  sobretudo o arquitet\u00f4nico, assim como em fun\u00e7\u00e3o dos altos custos
  de manuten\u00e7\u00e3o. As edifica\u00e7\u00f5es hist\u00f3ricas t\u00eam sido
  pressionadas, na melhor das hip\u00f3teses, para \\\"modernizarem-se\\\" visando
  \u00e0s novas normas e padr\u00f5es construtivos, o que configurasse constitui,
  na maioria dos casos, em descaracteriza\u00e7\u00e3o e, na pior das hip\u00f3teses,
  d\u00e1 lugar \u00e0 outra edifica\u00e7\u00e3o concebida em fun\u00e7\u00e3o de
  uma especula\u00e7\u00e3o cujo argumento maior \u00e9 o aproveitamento econ\u00f4mico.\\n\\nO
  patrim\u00f4nio cultural, na atualidade, tem sido entendido pela sociedade e, sobretudo,
  pela classe pol\u00edtica como um gerador de valores monet\u00e1rios encorpados
  provenientes de uma parte supostamente instru\u00edda da popula\u00e7\u00e3o, que
  v\u00ea no turismo cultural uma forma de prest\u00edgio. Ir \u00e0 Atenas e ser
  fotografado ao lado do Parthenon \u00e9 quase que uma obrigatoriedade, contudo,
  quantos dos turistas que assim o fazem compreendem o verdadeiro significado desse
  bem cultural? O bem cultural parece transmitir apenas sua forma e uma imagem criada
  para preencher o imagin\u00e1rio de cada um, perdendo a sua capacidade comunicativa
  de uma mensagem dos nossos antepassados. Conforme define Choay (2006, p. 19), o
  \\\"passado chama a aten\u00e7\u00e3o, interpela no instante, trocando o seu antigo
  estatuto de signo pelo de sinal\\\".\\n\\nSobre o territ\u00f3rio urbano e a cultura
  \u2013 mais uma forma de di\u00e1logo\\n\\n[...] Por toda a Europa, e Portugal n\u00e3o
  \u00e9 excep\u00e7\u00e3o, \u00e9 not\u00f3ria a extraordin\u00e1ria recupera\u00e7\u00e3o
  dos chamados centros hist\u00f3ricos das cidades. Este \u00e9, sem d\u00favida,
  um trabalho muito importante: o da salvaguarda da mem\u00f3ria. No entanto, h\u00e1
  um lado bastante negativo que n\u00e3o deve, nem pode, ser desprezado. A cria\u00e7\u00e3o
  de verdadeiras cidades-museu, preservadas em redomas, imp\u00f5e uma realidade est\u00e1tica,
  parada no tempo [...]. (A MUSEIFICA\u00c7\u00c2O, 2013).\\n\\n\u00c0 guisa de introdu\u00e7\u00e3o,
  salienta-se que a cidade, entendida pela dial\u00e9tica da pr\u00e1tica e do projeto,
  tem suas origens atreladas ao Renascimento, da mesma forma que o patrim\u00f4nio
  cultural. Para Giulio Carlo Argan (2005), o in\u00edcio dessa discuss\u00e3o est\u00e1
  na transi\u00e7\u00e3o da cidade medieval para a renascentista, no entanto, embora
  o tratamento do assunto tenha iniciado nesse per\u00edodo, as transforma\u00e7\u00f5es
  urbanas ocorridas n\u00e3o foram efetivamente suficientes. Lewis Munford (1996)
  aponta a inexist\u00eancia de uma cidade renascentista, uma vez que as transforma\u00e7\u00f5es
  na cidade medieval foram pontuais, apenas alguns espa\u00e7os p\u00fablicos foram
  abertos na imbricada malha urbana medieval. Contudo, existem claras diferen\u00e7as
  entre as cidades medieval e renascentista. A primeira se estabelece por um aglomerado
  de habita\u00e7\u00f5es e oficinas que se disp\u00f5em em torno do pal\u00e1cio
  e da igreja, assim como de uma \u00e1rea comum onde aconteciam as feiras e os mercados.
  O espa\u00e7o urbano medieval n\u00e3o possu\u00eda car\u00e1ter de consci\u00eancia
  pol\u00edtica organizada, j\u00e1 a cidade renascentista, ao contr\u00e1rio, caracterizavase
  por uma organiza\u00e7\u00e3o social bem definida, em que a classe dominante, senhores
  de neg\u00f3cios, distingue-se das outras classes formadas por produtores. Tal distin\u00e7\u00e3o
  pode ser vista na pr\u00f3pria organiza\u00e7\u00e3o espacial urbana que contempla
  ruas principais com espa\u00e7os generosos, que abrigam uma arquitetura concebida
  de acordo com a import\u00e2ncia pol\u00edtica e social dos dirigentes e autoridades
  administrativas. A cidade renascentista reflete o poder de uma elite, formada por
  grandes comerciantes, que assume a dire\u00e7\u00e3o pol\u00edtica e cultural por
  interm\u00e9dio do mecenato 1 .\\n\\nNesse momento, \u00e9 oportuno esclarecer que
  este artigo n\u00e3o comporta relatar toda a evolu\u00e7\u00e3o hist\u00f3rica das
  cidades, mesmo que de forma geral, mas sim refor\u00e7ar o processo hist\u00f3rico
  para o entendimento da cidade contempor\u00e2nea que se apresenta como o objeto
  de maior interesse deste estudo, juntamente com o patrim\u00f4nio cultural.\\n\\nIndubitavelmente,
  na contemporaneidade, as rela\u00e7\u00f5es sociais t\u00eam suas express\u00f5es
  estabelecidas, majoritariamente, nos espa\u00e7os urbanos. O Fundo de Popula\u00e7\u00e3o
  das Na\u00e7\u00f5es Unidas atrav\u00e9s do relat\u00f3rio sobre a situa\u00e7\u00e3o
  da popula\u00e7\u00e3o mundial informa que, at\u00e9 2050, a popula\u00e7\u00e3o
  mundial chegar\u00e1 a 08 bilh\u00f5es e 900 mil indiv\u00edduos, dos quais cerca
  de 60% viver\u00e3o em \u00e1reas urbanizadas (UNFPA, 2011). Tal realidade nos compele
  a interpretar as cidades contempor\u00e2neas como l\u00f3cus da diversidade e multiplicidade.
  Para tal interpreta\u00e7\u00e3o, o tratamento pelo vi\u00e9s da complexidade 2
  se faz necess\u00e1rio, uma vez que as rela\u00e7\u00f5es de causa e efeito, inerentes
  aos sistemas lineares, n\u00e3o d\u00e3o conta de explicar sua complexidade.\\n\\nMuitas
  s\u00e3o as abordagens e estudos sobre o territ\u00f3rio urbano contempor\u00e2neo
  que o tratam como uma rede interconectada. Nesse sentido, Arl\u00eaude Bortolozzi
  nos alerta:\\n\\nA complexidade que envolve o conhecimento do \\\"ambiental urbano\\\",
  hoje no contexto da globaliza\u00e7\u00e3o mundial aponta para a necessidade de
  uma nova leitura do territ\u00f3rio, como forma de compreender a sua din\u00e2mica
  e buscar estrat\u00e9gias de interven\u00e7\u00f5es, mais adequadas \u2013 para
  as cidades contempor\u00e2neas. Essa nova leitura deve ser entendida, como um conhecimento
  integrado da problem\u00e1tica ambiental urbana, onde os processos urbanos e hist\u00f3ricos
  de reconstru\u00e7\u00e3o das cidades possam ser revelados atrav\u00e9s das rela\u00e7\u00f5es
  entre diferentes escalas espaciais e da interdepend\u00eancia entre os diferentes
  aspectos, tais como os f\u00edsicos, econ\u00f4micos, sociais, pol\u00edticos e
  culturais. Assim sendo, essa integra\u00e7\u00e3o sugere uma for\u00e7a, que pode
  significar um combate \u00e0s constantes fragmenta\u00e7\u00f5es do espa\u00e7o
  urbano no que concerne \u00e0s rela\u00e7\u00f5es do seu processo de produ\u00e7\u00e3o,
  tais como sociedade-natureza; rural\u2013urbano; local-global; sujeito-objeto, teoria
  e pr\u00e1tica social. (BORTOLOZZI, 2008).\\n\\nAcredita-se que os territ\u00f3rios
  urbanos devam ser percebidos como grandes estruturas din\u00e2micas constitu\u00eddas
  por subestruturas distintas que interagem entre si de\\n\\n1 Do franc\u00eas m\u00e9c\u00e9nat.
  Prote\u00e7\u00e3o \u00e0s artes e letras, ou aos seus cultores, concedida por homens
  ricos e amantes delas.\\n\\n2 Morin (2003).\\n\\nmaneira n\u00e3o linear, gerando
  vari\u00e1veis que est\u00e3o em constante intera\u00e7\u00e3o e mudan\u00e7a. Contudo,
  para o efeito que se pretende, \u00e9 preciso propor um olhar focado na rela\u00e7\u00e3o
  territ\u00f3rio urbano e cultura, analisando a maneira como esta vem sendo utilizada
  nas interven\u00e7\u00f5es urbanas contempor\u00e2neas. Para Ot\u00edlia Arantes
  (1988), temos visto ser estabelecido em nossas cidades um \\\"culturalismo de mercado\\\",
  reflexo da postura pol\u00edtica neoliberal diante do processo de globaliza\u00e7\u00e3o
  mundial. Da mesma forma, Paola Berenstein Jacques nos diz que:\\n\\nEssa quase esquizofrenia
  dos discursos contempor\u00e2neos sobre a cidade \u2013 preservar o antigo ou construir
  o novo vem surgindo muitas vezes simultaneamente em uma mesma cidade, com propostas
  preservacionistas para os centros hist\u00f3ricos, que se tornam recept\u00e1culos
  de turistas, e com a constru\u00e7\u00e3o de novos bairros ex-nihilo nas \u00e1reas
  de expans\u00e3o perif\u00e9ricas, que se tornam fontes para a especula\u00e7\u00e3o
  imobili\u00e1ria. Muitas vezes, os atores e patrocinadores dessas propostas tamb\u00e9m
  s\u00e3o os mesmos, assim como \u00e9 semelhante a n\u00e3o participa\u00e7\u00e3o
  da popula\u00e7\u00e3o em suas formula\u00e7\u00f5es, e a gentrifica\u00e7\u00e3o
  das \u00e1reas como resultado, demonstrando que as duas correntes antag\u00f4nicas
  s\u00e3o faces de uma mesma moeda a espetaculariza\u00e7\u00e3o mercantil das cidades.
  (JACQUES, 2003, p. 33).\\n\\n\u00c9 comum encontrarmos, hoje em dia, exemplos de
  interven\u00e7\u00f5es urbanas cujos discursos baseiam-se nos valores ligados \u00e0
  cultura, transformando significativamente a morfologia das cidades. Essa pol\u00edtica
  de reforma urbana favorece o processo urbano da \\\"gentrifica\u00e7\u00e3o\\\",
  assim como cria a chamada \\\"teatraliza\u00e7\u00e3o das cidades\\\".\\n\\nPor
  gentrifica\u00e7\u00e3o entende-se o processo de requalifica\u00e7\u00e3o pelo qual
  passa o territ\u00f3rio urbano e que, embora apoiado no suporte cultural, mais especificamente
  no discurso da mem\u00f3ria e da tradi\u00e7\u00e3o, tem seu foco no mercado e sua
  pr\u00e1xis na produ\u00e7\u00e3o de espa\u00e7os que n\u00e3o podem ser usufru\u00eddos
  por toda a popula\u00e7\u00e3o. Segundo Bortolozzi (2008) ao citar Leite (2004):
  \\\"Embora o processo de ''gentrifica\u00e7\u00e3o'' possa resultar igualmente em
  paisagens urbanas estandardizadas e que poderiam ser consumidas por qualquer pessoa,
  a l\u00f3gica da interven\u00e7\u00e3o n\u00e3o se baseia na indistin\u00e7\u00e3o
  de mercadorias voltadas para as massas\\\".\\n\\nDo ponto de vista hist\u00f3rico,
  Ruth Glass, por volta de 1970, utilizou o termo \\\"gentrification\\\" ao se referir
  \u00e0 transforma\u00e7\u00e3o que vinham sofrendo os antigos bairros oper\u00e1rios
  de Londres, de onde se via retirar-se a classe popular em detrimento de uma classe
  m\u00e9dia assalariada. Esta, por sua vez, retornava do sub\u00farbio para onde
  fora, ao longo do s\u00e9culo XIX, em busca de melhor qualidade de vida, de mais
  seguran\u00e7a e de espa\u00e7os mais amplos e arejados. Ao abandonar o Centro da
  cidade para ir em dire\u00e7\u00e3o \u00e0 periferia, a classe m\u00e9dia permitiu
  que a classe popular ocupasse os bairros centrais que, em seguida, viram-se em degrada\u00e7\u00e3o
  f\u00edsica devido \u00e0 falta de investimentos.\\n\\nPara Neil Smith (2006), esse
  processo urbano, identificado inicialmente por Glass, evoluiu rapidamente e chega
  ao s\u00e9culo XXI como uma dimens\u00e3o marcante do urbanismo contempor\u00e2neo
  e como \\\"o motor central da expans\u00e3o econ\u00f4mica da cidade, um setor central
  da economia urbana\\\" (SMITH, 2006, p. 76). Se, em seu in\u00edcio, os estudos
  definiam a gentrifica\u00e7\u00e3o como um fen\u00f4meno associado ao mercado e
  ao comportamento da iniciativa privada, atualmente, muitos autores o reconhecem
  como parte de uma pol\u00edtica p\u00fablica. Para Smith (2006), s\u00e3o definidas
  como \\\"pol\u00edticas oficiais de gentrifica\u00e7\u00e3o\\\".\\n\\nIndependentemente
  de qual seja o origem do fen\u00f4meno, devemos nos atentar\\n\\npara as suas consequ\u00eancias.
  Segundo Smith (2006), a utiliza\u00e7\u00e3o de termos como \\\"regenera\u00e7\u00e3o\\\"
  ou \\\"renova\u00e7\u00e3o\\\" acaba por neutralizar as cr\u00edticas aos projetos
  dessa natureza e permite a vit\u00f3ria das vis\u00f5es neoliberais da cidade. Da
  mesma forma, para Bortolozzi (2008) em refer\u00eancia ao alertado por Leite (2004):\\n\\n[...]
  Tanto na ind\u00fastria cultural como nas pol\u00edticas urbanas de \\\"gentrifica\u00e7\u00e3o\\\",
  os bens art\u00edsticos e o patrim\u00f4nio cultural s\u00e3o tratados como mercadoria,
  portanto sujeitos \u00e0 racionalidade econ\u00f4mica. [...] Este (processo), acaba
  por atuar na elitiza\u00e7\u00e3o do espa\u00e7o, uma vez que suas caracter\u00edsticas
  principais s\u00e3o a forma\u00e7\u00e3o de paisagens de poder; a centralidade e
  a apropria\u00e7\u00e3o de certos espa\u00e7os da cidade [...].\\n\\nAssim sendo,
  Bortolozzi (2008) sintetiza assinalando que esses processos contempor\u00e2neos
  de reconstru\u00e7\u00e3o de \u00e1reas degradadas em territ\u00f3rio urbanizado
  deveriam representar novas pr\u00e1ticas socioespaciais que permitissem integrar
  cultura e gest\u00e3o social, tanto quanto est\u00e9tica e \u00e9tica.\\n\\nQuanto
  \u00e0 \\\"teatraliza\u00e7\u00e3o das cidades\\\", deve-se dizer inicialmente que
  esse termo est\u00e1 associado ao processo de \\\"revitaliza\u00e7\u00e3o urbana\\\"
  pelo qual v\u00eam passando muitas cidades, tendo em vista sua inser\u00e7\u00e3o
  na rede mundial de cidades culturais ou tur\u00edsticas. Esse processo tem como
  foco principal a recupera\u00e7\u00e3o da economia e utiliza, na maioria das vezes,
  o patrim\u00f4nio cultural edificado como instrumento de legitima\u00e7\u00e3o.
  Muitos estudiosos o consideram como um reflexo da economia globalizada neoliberal.\\n\\nEssa
  tend\u00eancia urbana contempor\u00e2nea, baseada na l\u00f3gica da imagem, utiliza
  a cidade como uma mercadoria e chega a forjar um produto, com caracter\u00edsticas
  ideais, para ser consumido por um p\u00fablico internacional. Essa situa\u00e7\u00e3o
  \u00e9 criticada e indagada por Jacques da seguinte forma:\\n\\nO que se vende internacionalmente
  \u00e9, sobretudo, a imagem de marca da cidade e, paradoxalmente, essas imagens
  de marca de cidades distintas, com culturas distintas, se parecem cada vez mais.
  Haveria, ent\u00e3o, um padr\u00e3o internacional de imagem de cidade? Um consenso
  mundial sobre um modelo de criar imagens, logotipos urbanos, ou ainda, de se vender
  cidades? Ou estar\u00edamos diante de um tipo de ''internacionalismo do particularismo''?
  (JACQUES, 2003, p. 33).\\n\\nA \\\"teatraliza\u00e7\u00e3o das cidades\\\" est\u00e1
  associada, na maioria das vezes, \u00e0 cria\u00e7\u00e3o ou adapta\u00e7\u00e3o
  de estruturas arquitet\u00f4nicas visando ao desenvolvimento de atividades culturais.
  Museus e centros culturais s\u00e3o constru\u00eddos e/ou acomodados em marcos hist\u00f3ricos,
  passando a ser o cart\u00e3o de visita e o ingresso das cidades na t\u00e3o almejada
  rede cultural global. Nesse contexto, a institui\u00e7\u00e3o jur\u00eddica do tombamento
  acaba por funcionar como um est\u00edmulo para a \\\"renova\u00e7\u00e3o urbana\\\",
  no entanto, a preserva\u00e7\u00e3o que deveria assumir um car\u00e1ter educativo
  e social passa a ter uma fun\u00e7\u00e3o econ\u00f4mica e os bens culturais se
  tornam grandes cen\u00e1rios de um espet\u00e1culo ao qual a grande maioria n\u00e3o
  tem acesso. Devemos pensar tamb\u00e9m que essa publiciza\u00e7\u00e3o de uma parte
  da cidade em detrimento das outras regi\u00f5es serve como um mascaramento para
  a verdadeira face que se mostra feia diante da falta de educa\u00e7\u00e3o e da
  mis\u00e9ria.\\n\\nDavid Harvey (1996), ao se referir \u00e0s cidades ajustadas
  \u00e0 ordem econ\u00f4mica contempor\u00e2nea, tamb\u00e9m as denominou por mercadorias,
  al\u00e9m de atribuir o termo \\\"empresariamento urbano\\\" \u00e0s iniciativas
  tratadas aqui como \\\"teatraliza\u00e7\u00e3o\\\".\\n\\nOutro vi\u00e9s associado
  a esse tema e que merece nota \u00e9 o estabelecimento das parcerias entre o poder
  p\u00fablico e as empresas privadas para a cria\u00e7\u00e3o e/ou manuten\u00e7\u00e3o
  dos espa\u00e7os culturais, tamb\u00e9m conhecidas como parcerias p\u00fablico-privadas.
  Acredita-se que essa vertente possa ser um dos motivos para a imagem homogeneizada
  e internacional que as cidades contempor\u00e2neas t\u00eam assumido isso porque
  seguem:\\n\\n[...] um modelo internacional extremamente homogeneizador, imposto
  pelos financiadores multinacionais dos grandes projetos de revitaliza\u00e7\u00e3o
  urbana sejam esses ag\u00eancias multilaterais ou outros. Esse modelo visa, basicamente,
  ao turista internacional e n\u00e3o o habitante local e exige um certo padr\u00e3o
  mundial, um espa\u00e7o urbano tipo, padronizado. Como j\u00e1 ocorre com os espa\u00e7os
  padronizados das cadeias dos grandes hot\u00e9is internacionais, ou ainda dos aeroportos,
  das redes de fast food, dos shoppings centers, dos parques tem\u00e1ticos ou dos
  condom\u00ednios fechados, que fazem todas as periferias das grandes cidades mundiais
  se parecerem cada vez mais, como se fossem, todos, uma \u00fanica imagem: paisagens
  urbanas id\u00eanticas, ou talvez, gen\u00e9ricas (KOOLHAAS, 1995 apud JACQUES,
  2003, p. 33).\\n\\nA \\\"cidade espet\u00e1culo\\\" contempor\u00e2nea est\u00e1
  estreitamente ligada ao patrim\u00f4nio cultural, sobretudo ao arquitet\u00f4nico,
  utilizando-o para sua promo\u00e7\u00e3o e propaganda em escala mundial e visando
  tornar-se um marco referencial. Mais que um instrumento de alfabetiza\u00e7\u00e3o
  e desenvolvimento social, a cultura tem sido usada, infelizmente, como um instrumento
  de desenvolvimento econ\u00f4mico.\\n\\nSobre o Circuito Cultural Pra\u00e7a da
  Liberdade \u2013 um estudo de caso\\n\\n[...] o maior complexo cultural do pa\u00eds
  e o \u00fanico do mundo fruto de uma parceria p\u00fablico-privada. (BARBOSA, 2013).\\n\\nOs
  registros apontam que, por volta de 1701, o bandeirante Jo\u00e3o Leite da Silva
  Ortiz, ao chegar \u00e0 regi\u00e3o da ent\u00e3o Serra de Congonhas, resolveu fundar
  uma fazenda para cria\u00e7\u00e3o de gado que ficou conhecida como \\\"Fazenda
  do Cercado\\\". Uma vez que era ponto de passagem de tropeiros, que conduziam gado
  da Bahia para a regi\u00e3o das minas, o progresso do local foi-se acentuando e
  logo se tornou o arraial \\\"Curral del Rei\\\". Com a decad\u00eancia da minera\u00e7\u00e3o
  o arraial se expandiu e chegou \u00e0 condi\u00e7\u00e3o de Freguesia, embora mantivesse
  uma rotina simples e mon\u00f3tona. Somente com a Proclama\u00e7\u00e3o da Rep\u00fablica,
  em 1889, o local se tornou palco de transforma\u00e7\u00f5es, primeiro pela mudan\u00e7a
  do nome para Belo Horizonte e, posteriormente, em 17 de dezembro de 1893, por for\u00e7a
  da Lei N\u00ba 3 da Constitui\u00e7\u00e3o Estadual, que determinava a transfer\u00eancia
  da sede do governo do estado de Ouro Preto para Belo Horizonte. A mesma lei criava
  a \\\"Comiss\u00e3o Construtora\\\", composta por t\u00e9cnicos respons\u00e1veis
  pelo planejamento e execu\u00e7\u00e3o das obras sob a chefia de Aar\u00e3o Leal
  de Carvalho Reis, engenheiro e urbanista.\\n\\nO projeto criado pela Comiss\u00e3o
  Construtora, finalizado em maio de 1895, inspirava-se no modelo das mais modernas
  cidades do mundo, como Paris e Washington. Os planos revelavam algumas preocupa\u00e7\u00f5es
  b\u00e1sicas, como as condi\u00e7\u00f5es de higiene e circula\u00e7\u00e3o humana.
  Dividiram a cidade em tr\u00eas principais zonas: a \u00e1rea central urbana, a
  \u00e1rea suburbana e a \u00e1rea rural. No centro, o tra\u00e7ado geom\u00e9trico
  e regular estabelecia um padr\u00e3o de ruas retas, formando uma esp\u00e9cie de
  quadriculado, Mas largas, as avenidas seriam dispostas em sentido diagonal. Esta
  \u00e1rea receberia toda a estrutura urbana de transportes, educa\u00e7\u00e3o,
  saneamento e assist\u00eancia m\u00e9dica. Abrigaria, tamb\u00e9m, os edif\u00edcios
  p\u00fablicos dos funcion\u00e1rios estaduais. Ali tamb\u00e9m deveriam se instalar
  os estabelecimentos comerciais. Seu limite era a Avenida do Contorno, que naquela
  \u00e9poca se chamava de 17 de Dezembro. (PREFEITURA MUNICIPAL DE BELO HORIZONTE,
  [s.d.]).\\n\\nNesse contexto, foi concebida a Pra\u00e7a da Liberdade, um complexo
  paisag\u00edstico e arquitet\u00f4nico que sintetiza a hist\u00f3ria de Belo Horizonte.
  Localizada entre as atuais avenidas Jo\u00e3o Pinheiro e Crist\u00f3v\u00e3o Colombo
  e as ruas Gon\u00e7alves Dias, Santa Rita Dur\u00e3o e Alvarenga Peixoto, foi constru\u00edda
  na cota mais alta do per\u00edmetro urbano, possui uma \u00e1rea de 35.000 m\u00b2
  com terreno plano e sem desn\u00edveis, seu entorno \u00e9 caracterizado por edif\u00edcios
  com grande variedade estil\u00edstica, com destaque para os ecl\u00e9ticos da virada
  dos s\u00e9culos XIX/XX, que abrigavam as Secretarias de Estado. O prolongamento
  da Avenida Jo\u00e3o Pinheiro divide a pra\u00e7a, longitudinalmente, em duas partes
  ladeadas por palmeiras imperiais; transversalmente, possui duas alamedas que lhe
  d\u00e3o a configura\u00e7\u00e3o de cruz. No centro, encontra-se em destaque o
  coreto em estrutura met\u00e1lica e, espalhados por toda sua extens\u00e3o, pode-se
  encontrar monumentos, bustos e fontes. Atribui-se ao arquiteto paisagista Paul Villon
  o desenho original dos jardins que possu\u00edam caracter\u00edsticas aos moldes
  dos jardins ingleses. Em 1920, por ocasi\u00e3o da visita da fam\u00edlia real belga,
  a linha original inglesa foi substitu\u00edda pelo tra\u00e7ado de inspira\u00e7\u00e3o
  francesa que permanece ainda hoje; a reforma coube ao arquiteto e paisagista Reinaldo
  Dieberger. Em 1969, visando atender \u00e0 reestrutura\u00e7\u00e3o do sistema vi\u00e1rio,
  foi realizada uma nova reforma cuja caracter\u00edstica maior foi a supress\u00e3o
  do tr\u00e1fego na alameda central. Em 02 de junho de 1977 o conjunto arquitet\u00f4nico
  e paisag\u00edstico da Pra\u00e7a da Liberdade foi tombado pelo Instituto Estadual
  do Patrim\u00f4nio Hist\u00f3rico e Art\u00edstico de Minas Gerais (IEPHA/MG), sendo
  formado pelos seguintes bens: Edif\u00edcio Niemeyer, Secretaria de Estado de Defesa
  Social, Secretaria de Estado de Transportes e Obras P\u00fablicas, Edif\u00edcio
  Mape, Edif\u00edcio Sede do IPSEMG, Secretaria de Estado da Fazenda, Secretaria
  de Estado de Educa\u00e7\u00e3o, Reitoria da UEMG, \\\"Rainha da Sucata\\\", Biblioteca
  P\u00fablica Luiz de Bessa, Pal\u00e1cio dos Despachos, Pal\u00e1cio Arquiepiscopal,
  Palacete Dantas, Solar Narbona e \\\"Casa Amarela\\\". No in\u00edcio da d\u00e9cada
  de 1990, atendendo \u00e0s comemora\u00e7\u00f5es do 94\u00ba anivers\u00e1rio de
  Belo Horizonte (1991), a pra\u00e7a foi restaurada, retomandose o tra\u00e7ado de
  1920, os trabalhos ficaram a cargo da equipe da arquiteta Josefina Vasconcelos.
  A partir de 2010, com a transfer\u00eancia da sede do governo do estado para a Cidade
  Administrativa, no Bairro Serra Verde \u2013 regi\u00e3o de Venda Nova \u2013, a
  maioria dos edif\u00edcios do entorno da pra\u00e7a passou a compor o Circuito Cultural
  Pra\u00e7a da Liberdade. Inaugurado no mesmo ano, segundo Maciel (2013), o circuito
  foi criado \\\"com o objetivo de explorar a diversidade cultural\\\" em uma \u00e1rea
  da cidade com \\\"enorme valor simb\u00f3lico, hist\u00f3rico e arquitet\u00f4nico\\\".
  Tal a\u00e7\u00e3o \u00e9 um empreendimento que caracteriza a pol\u00edtica p\u00fablica
  idealizada pelo governo do estado, cuja concep\u00e7\u00e3o foi sintetizada no trecho
  abaixo, extra\u00eddo do Anexo I do Termo de Parceria N\u00ba 032, assinado em 2012
  por Eliane Oliveira, na condi\u00e7\u00e3o de Secret\u00e1ria de Cultura, e por
  Cristiana Miglio Kumaira Pereira, Diretora Presidente do Instituto S\u00e9rgio Magnani
  3 , co-gestor do circuito:\\n\\n3 O Instituto Cultural S\u00e9rgio Magnani (ICSM)
  \u00e9 uma associa\u00e7\u00e3o sem fins lucrativos, qualificada como Organiza\u00e7\u00e3o
  da Sociedade Civil de Interesse P\u00fablico (OSCIP) pelo Governo do Estado de Minas
  Gerais e pelo Governo Federal. Fundado em 2004 por integrantes da comunidade cultural
  mineira, o ICSM tem por objetivos atuar no desenvolvimento e na gest\u00e3o de projetos
  e programas culturais e socioeducativos. Dispon\u00edvel em:< http://www.institutosergiomagnani.org.br>.
  Acesso em: 14 out. 2014.\\n\\nO Circuito Cultural Pra\u00e7a da Liberdade (CCPL)
  est\u00e1 sendo implantado pelo Governo de Minas, por meio da Secretaria de Estado
  de Cultura, para oferecer \u00e0 popula\u00e7\u00e3o novos espa\u00e7os de conhecimento,
  arte, cultura, ci\u00eancia e entretenimento. O Circuito, desenvolvido em parceria
  com a iniciativa privada, restaura e implementa novos usos aos pr\u00e9dios p\u00fablicos
  que circundam a Pra\u00e7a da Liberdade, transformando-os em um riqu\u00edssimo
  conjunto de cultura e informa\u00e7\u00e3o, composto de acervos hist\u00f3ricos,
  art\u00edsticos e tem\u00e1ticos; centros culturais interativos; biblioteca e espa\u00e7os
  para oficinas, cursos e ateli\u00eas abertos; al\u00e9m de planet\u00e1rio, cafeterias,
  restaurantes e lojas. [...] Para abrigar a sede dos futuros espa\u00e7os culturais,
  todas as interven\u00e7\u00f5es de restaura\u00e7\u00e3o e revitaliza\u00e7\u00e3o
  dos edif\u00edcios s\u00e3o supervisionadas pelo Instituto Estadual do Patrim\u00f4nio
  Hist\u00f3rico e Art\u00edstico de Minas Gerais (IEPHA) e tiveram os projetos aprovados
  pelos \u00f3rg\u00e3os respons\u00e1veis como o Conselho Deliberativo do Patrim\u00f4nio
  Cultural do Munic\u00edpio (CDPCM-BH), a Secretaria Municipal de Regula\u00e7\u00e3o
  Urbana (SMARU), o Conselho Estadual do Patrim\u00f4nio (CONEP) e a Secretaria do
  Meio Ambiente (SMAMA). Nos anos iniciais do projeto, o foco principal esteve na
  negocia\u00e7\u00e3o e celebra\u00e7\u00e3o dos conv\u00eanios com as entidades
  p\u00fablicas e privadas que s\u00e3o respons\u00e1veis por alguns dos espa\u00e7os,
  bem como na viabiliza\u00e7\u00e3o da restaura\u00e7\u00e3o dos edif\u00edcios junto
  aos \u00f3rg\u00e3os respons\u00e1veis. Embora ainda existam obras em andamento
  [...], o foco principal passa a ser a configura\u00e7\u00e3o da gest\u00e3o do Circuito
  que dar\u00e1 a ele o car\u00e1ter integrado a que se pretende, dentro de alto padr\u00e3o
  est\u00e9tico e cultural, qualidade t\u00e9cnica e programa\u00e7\u00e3o qualificada.
  O cumprimento da miss\u00e3o (\\\"Ampliar o capital humano atrav\u00e9s da cultura,
  informa\u00e7\u00e3o e educa\u00e7\u00e3o, garantindo espa\u00e7o para a inova\u00e7\u00e3o
  e divulga\u00e7\u00e3o da cultura\\\") e da vis\u00e3o (\\\"Tornar-se o maior complexo
  na \u00e1rea de cultura e informa\u00e7\u00e3o do Brasil, transformando-se em refer\u00eancia
  mundial\\\") propostas depende de uma gest\u00e3o compartilhada entre Estado e parceiros,
  que ser\u00e1 alinhada e fortalecida a partir deste ano. (MINAS GERAIS, 2012, p.
  12).\\n\\nA proposta do circuito tem como objetivo, de acordo com Cristiana Pereira,
  gestora do circuito, reunir, na Pra\u00e7a da Liberdade e vizinhan\u00e7a, \\\"[...]
  12 espa\u00e7os culturais entre museus hist\u00f3ricos, art\u00edsticos e tem\u00e1ticos,
  centros culturais, bibliotecas e espa\u00e7os para oficinas, cursos, ateli\u00eas
  e caf\u00e9s\\\" (CIRCUITO, 2013). Atualmente, encontram-se abertos \u00e0 visita\u00e7\u00e3o:
  (i) Espa\u00e7o TIM UFMG do Conhecimento: implantado em um edif\u00edcio de 5 andares
  de linhas contempor\u00e2neas, cuja autoria \u00e9 da arquiteta Josefina Vasconcelos.
  O espa\u00e7o tem como objetivo principal \\\"promover a divulga\u00e7\u00e3o cient\u00edfica
  e a cultura por meio de recursos tecnol\u00f3gicos e audiovisuais, de maneira l\u00fadica
  e interativa\\\" (CIRCUITO, 2013), possui em sua fachada principal, voltada para
  a Pra\u00e7a da Liberdade, um sistema digital que permite a reprodu\u00e7\u00e3o,
  durante a noite, de cenas ligadas \u00e0s artes e ci\u00eancias. A maior atra\u00e7\u00e3o
  de espa\u00e7o fica por conta do planet\u00e1rio instalado no \u00faltimo andar
  do edif\u00edcio; (ii) o Museu das Minas e do Metal: popularmente conhecido como
  \\\"pr\u00e9dio rosa\\\", o edif\u00edcio come\u00e7ou a ser constru\u00eddo em
  1895 e foi inaugurado em 1897, segue o padr\u00e3o arquitet\u00f4nico estabelecido
  pela \\\"Comiss\u00e3o Construtora da Nova Capital\\\" \u2013 ecl\u00e9tico \u2013;
  inicialmente abrigou a Secretaria do Interior e, posteriormente, a Secretaria de
  Educa\u00e7\u00e3o. Atualmente, resguarda em suas 18 salas um acervo referente \u00e0s
  duas principais atividades econ\u00f4micas de Minas Gerais, a minera\u00e7\u00e3o
  e a metalurgia. O arquiteto Paulo Mendes da Rocha foi o respons\u00e1vel pelos trabalhos
  de arquitetura, a museografia fica a cargo de Marcello Dantas e a restaura\u00e7\u00e3o
  de Maria Regina Reis Ramos; (iii) o Memorial Minas Gerais \u2013 Vale: situa-se
  em um edif\u00edcio ecl\u00e9tico inaugurado em 1897 onde\\n\\nfuncionou a Secretaria
  de Estado da Fazenda. Hoje conta com 31 espa\u00e7os para expo- si\u00e7\u00e3o,
  que re\u00fanem manifesta\u00e7\u00f5es contempor\u00e2neas, populares e folcl\u00f3ricas
  referentes \u00e0 hist\u00f3ria e aos costumes mineiros do passado e presente. Os
  trabalhos de adequa\u00e7\u00e3o do espa\u00e7o para implanta\u00e7\u00e3o do museu
  s\u00e3o de responsabilidade dos arquitetos Carlos Maia, D\u00e9bora Mendes, Eduardo
  Fran\u00e7a, Igor Macedo, Humberto Hermeto e Fl\u00e1vio Grilo; (iv) o Centro de
  Arte Popular-Cemig: localizado nas imedia\u00e7\u00f5es da Pra\u00e7a da Liberdade,
  mais especificamente na Rua Gon\u00e7alves Dias, 1608, o pr\u00e9dio de caracter\u00edsticas
  ecl\u00e9ticas datado de 1920 foi constru\u00eddo para ser uma resid\u00eancia e,
  posteriormente, serviu para o funcionamento do extinto \\\"Hospital S\u00e3o Tarc\u00edsio\\\".
  Recentemente, ap\u00f3s passar por uma interven\u00e7\u00e3o, foi transformado em
  espa\u00e7o cultural que conta com um acervo de obras de arte popular das diferentes
  regi\u00f5es de Minas Gerais. A arquiteta respons\u00e1vel pelo espa\u00e7o foi
  Janete Ferreira da Costa, j\u00e1 o projeto de museografia e a curadoria s\u00e3o
  de Eliane Guglielme e M\u00e1rio Santos; (v) a Biblioteca P\u00fablica Estadual
  Luiz de Bessa: edif\u00edcio em estilo arquitet\u00f4nico modernista projetado pelo
  arquiteto Oscar Niemeyer, localiza-se no n\u00famero 21 da pra\u00e7a e foi inaugurado
  em 1954. O pr\u00e9dio possui um teatro com capacidade para 220 pessoas, salas para
  cursos e galeria de arte, al\u00e9m de um acervo com aproximadamente 260.000 t\u00edtulos
  dentre eles obras raras; (vi) o Arquivo P\u00fablico Mineiro: considerado a institui\u00e7\u00e3o
  cultural mais antiga do estado de Minas Gerais, foi criado em 1895, ainda na antiga
  capital Ouro Preto. Em 1901 foi transferido para Belo Horizonte, ocupando um pr\u00e9dio
  provis\u00f3rio; a partir de 1938 passou a ocupar o atual espa\u00e7o que se encontra
  situado \u00e0 Avenida Jo\u00e3o Pinheiro, 372. A edifica\u00e7\u00e3o caracteriza-se
  pelo estilo ecl\u00e9tico e mant\u00e9m suas caracter\u00edsticas originais. Seu
  acervo conta com aproximadamente 10.500 t\u00edtulos, dentre eles documentos que
  remontam aos per\u00edodos colonial, imperial e republicano, al\u00e9m de um conjunto
  de fotografias, cole\u00e7\u00e3o de mapas produzidos no s\u00e9culo XVIII e o registro
  de diversos personagens da Inconfid\u00eancia Mineira; (vii) o Museu Mineiro: o
  edif\u00edcio que abriga esse museu foi sede do Senado Mineiro e est\u00e1 situado
  \u00e0 Avenida Jo\u00e3o Pinheiro, 342. Suas caracter\u00edsticas arquitet\u00f4nicas
  seguem o mesmo padr\u00e3o dos edif\u00edcios hist\u00f3ricos da Pra\u00e7a da Liberdade,
  seu acervo conta com aproximadamente 2.600 objetos provenientes de 36 cole\u00e7\u00f5es
  distintas de particulares e p\u00fablicas; (viii) o Centro Cultural Banco do Brasil:
  instalado no \\\"pr\u00e9dio amarelo\\\" da pra\u00e7a, o espa\u00e7o de 6 andares
  possui caracter\u00edsticas arquitet\u00f4nicas ecl\u00e9ticas com influ\u00eancias
  art d\u00e9co, foi inaugurado em 1930 e sediou a Secretaria de Seguran\u00e7a e
  Assist\u00eancia P\u00fablica. Atualmente, abriga o CCBB \u2013 Belo Horizonte,
  respons\u00e1vel por promover atividades nas \u00e1reas de artes pl\u00e1sticas,
  artes c\u00eanicas, m\u00fasica e programas educativos. Conta com um teatro com
  capacidade para 270 lugares, salas para exposi\u00e7\u00f5es permanentes, salas
  multiuso para atividades audiovisuais, debates, confer\u00eancias, oficinas e caf\u00e9.
  Coube ao arquiteto restaurador Fl\u00e1vio Grilo a responsabilidade pelos trabalhos
  de restaura\u00e7\u00e3o do edif\u00edcio que foi entregue ao p\u00fablico em 2012;
  (ix) o Pal\u00e1cio da Liberdade: edif\u00edcio de estilo arquitet\u00f4nico ecl\u00e9tico,
  tem sua inaugura\u00e7\u00e3o datada de 1897 e foi sede do governo do estado at\u00e9
  2010. Tombado pelo IEPHA/MG atrav\u00e9s do Decreto N\u00ba 16.956, de 27/01/1975,
  conta em seu interior com decora\u00e7\u00e3o variada, passando do \\\"Estilo Lu\u00eds
  XV\\\" para o \\\"Estilo Art Nouveau\\\". Em 1989/1990 foi realizado o invent\u00e1rio
  do acervo de bens m\u00f3veis do Pal\u00e1cio da Liberdade, que acabaram por ser
  catalogados em trinta e duas categorias, nas quais se incluem pe\u00e7as de mobili\u00e1rio,
  objetos de ilumina\u00e7\u00e3o, esculturas, prataria, rel\u00f3gios, tape\u00e7arias
  e uma rica pinacoteca. Atualmente \u00e9 aberto \u00e0 visita\u00e7\u00e3o p\u00fablica
  guiada aos domingos; (x) a Casa Fiat\\n\\nde Cultura: que vai ocupar o ent\u00e3o
  Pal\u00e1cio dos Despachos, um edif\u00edcio de autoria do arquiteto Luciano Amed\u00e9e
  Peret; com linhas arquitet\u00f4nicas modernas, possui quatro pavimentos com v\u00e3os
  amplos e dimens\u00f5es adequadas para receber grandes exposi\u00e7\u00f5es de artes
  pl\u00e1sticas. Conta, em seu vest\u00edbulo, com um painel de C\u00e2ndido Portinari,
  alusivo \u00e0 Inconfid\u00eancia Mineira, datado de 1954.\\n\\nAl\u00e9m dos referidos
  espa\u00e7os, est\u00e3o em processo de implanta\u00e7\u00e3o: (i) o Inhotim Escola:
  \\\"o Projeto Inhotim Escola tem o objetivo de promover a difus\u00e3o, forma\u00e7\u00e3o
  e fomento de artes visuais e de meio ambiente, a partir de estrat\u00e9gias educativas
  e de inclus\u00e3o social e cidadania\\\" (CIRCUITO, 2013). Essa proposta ser\u00e1
  implantada nos edif\u00edcios do Palacete Dantas e Solar Narbona, ambas originalmente
  destinadas a resid\u00eancias. O Palacete Dantas foi constru\u00eddo em 1915, em
  estilo neocl\u00e1ssico, projetado pelo arquiteto/escultor Luiz Olivieri que integrou
  a Comiss\u00e3o Construtora; sua planta divide-se em dois pavimentos. A edifica\u00e7\u00e3o
  foi adquirida pelo governo estadual em 1981 e, ap\u00f3s sua restaura\u00e7\u00e3o,
  o pr\u00e9dio passou a abrigar a Secretaria de Estado da Cultura. Sobre o Solar
  Narbona, desconhece-se a data exata da constru\u00e7\u00e3o e a autoria do projeto;
  a partir de 1964 passou a pertencer ao estado, dando abrigo \u00e0 Delegacia Geral
  do Estado; em 1967 passou a abrigar a Funda\u00e7\u00e3o Estadual do Bem Estar do
  Menor (FEBEM); e, em 1983, foi cedido \u00e0 Secretaria de Cultura. O Palacete Dantas
  e o Solar Narbona foram tombados pelo IEPHA/MG atrav\u00e9s do Decreto N\u00ba 18.531,
  de 02/06/1977. Quando incorporadas ao circuito as edifica\u00e7\u00f5es contar\u00e3o
  com \\\"programa\u00e7\u00e3o centrada em arte e meio ambiente, abrigando exposi\u00e7\u00f5es
  de arte contempor\u00e2nea, atividades art\u00edsticas e educativas, cursos, oficinas,
  mostras de cinema, v\u00eddeo arte, apresenta\u00e7\u00f5es de m\u00fasica, teatro
  e dan\u00e7a. O local tamb\u00e9m ser\u00e1 equipado com espa\u00e7os de conviv\u00eancia,
  como caf\u00e9, bistr\u00f4, loja, p\u00e1tio/pra\u00e7a e audit\u00f3rio\\\" (CIRCUITO,
  2013); (ii) o Museu do Autom\u00f3vel: ser\u00e1 implantado em um galp\u00e3o de
  2.000 m\u00b2 que faz parte do complexo do Pal\u00e1cio da Liberdade. \\\"O espa\u00e7o
  servia de estacionamento para ve\u00edculos do Gabinete Militar do Governador de
  Minas Gerais. A implanta\u00e7\u00e3o do museu contar\u00e1 com parceria do Veteran
  Car Club do Brasil, que ceder\u00e1 o acervo de raridades para contar a hist\u00f3ria
  dos autom\u00f3veis\\\" (CIRCUITO, 2013). O Circuito Cultural Pra\u00e7a da Liberdade
  contar\u00e1 ainda com o (iii) Centro de Informa\u00e7\u00e3o ao Visitante: antigo
  Centro de Apoio Tur\u00edstico Tancredo Neves (CAT), popularmente conhecido como
  \\\"rainha da sucata\\\". Foi constru\u00eddo no final dos anos 1980, a partir de
  um projeto p\u00f3s-moderno de autoria dos arquitetos \u00c9olo Maia e Sylvio Podest\u00e1.
  Ousado, o projeto suscitou discuss\u00f5es e pol\u00eamicas na \u00e9poca de sua
  constru\u00e7\u00e3o, por\u00e9m, mant\u00e9m a mesma escala e \\\"dialoga\\\" criticamente
  com as outras edifica\u00e7\u00f5es da pra\u00e7a. A \u00e1rea constru\u00edda \u00e9
  de 1.460 metros quadrados, no n\u00edvel t\u00e9rreo h\u00e1 um grande v\u00e3o
  livre com espa\u00e7o para exposi\u00e7\u00f5es, al\u00e9m de um anfiteatro com
  capacidade para 400 pessoas. O espa\u00e7o est\u00e1 sendo recuperado para abrigar
  todas as informa\u00e7\u00f5es sobre o circuito.\\n\\n1 - Centro Cultural Banco
  do Brasil\\n\\n2 - Centro de Arte Popular \u2013 CEMIG\\n\\n3 - Espa\u00e7o TIM
  UFMG do Conhecimento\\n\\n4 - Memorial Minas Gerais \u2013 VALE\\n\\n5 - Museu da
  Minas e do Metal\\n\\n7 - Museu Mineiro\\n\\n9 - Biblioteca P\u00fablica Estadual\\n\\n12
  - Arquivo P\u00fablico Mineiro\\n\\n13 - Casa FIAT de Cultura\\n\\n8 - Inhotim Escola\\n\\nFonte:
  Adaptado de O Circuito (2011).\\n\\nApresentado, tanto pelos \u00f3rg\u00e3os oficiais
  quanto pela imprensa, conforme disse Barbosa (2013), como \\\"o maior complexo cultural
  do pa\u00eds e o \u00fanico do mundo fruto de parceria p\u00fablico-privada\\\"
  (BARBOSA, 2013), os museus/espa\u00e7os s\u00e3o administrados por empresas privadas
  que realizam investimentos na recupera\u00e7\u00e3o do patrim\u00f4nio e na manuten\u00e7\u00e3o
  dos pr\u00e9dios. Nas palavras de Cristiana Pereira, gerente do circuito:\\n\\n[...]
  este modelo de parceria p\u00fablico-privada possibilita que grandes empresas participem
  e contribuam efetivamente com o avan\u00e7o cultural da cidade. Mais que realizarem
  suas atividades fins, os parceiros investem na implanta\u00e7\u00e3o e manuten\u00e7\u00e3o
  de museus, espa\u00e7os de aprendizagem, salas de exposi\u00e7\u00f5es e espet\u00e1culos,
  al\u00e9m de centros de mem\u00f3ria que consolidam a hist\u00f3ria de Minas Gerais,
  apresentando-a de forma gratuita ou a pre\u00e7os populares (CIRCUITO, 2013).\\n\\nNa
  lista de parceiros do governo do estado para a implanta\u00e7\u00e3o do circuito
  destacam-se: o Banco do Brasil, respons\u00e1vel pelo Centro Cultural Banco do Brasil,
  que al\u00e9m de Belo Horizonte conta com mais tr\u00eas unidades: em Bras\u00edlia,
  Rio de Janeiro e S\u00e3o Paulo; a Centrais El\u00e9tricas de Minas Gerais (CEMIG),
  criada pelo ent\u00e3o governador Juscelino Kubitscheck, \u00e9 uma empresa mista
  de capital aberto controlada pelo Governo do Estado. Reconhecida patrocinadora de
  eventos culturais, a CEMIG \u00e9 respons\u00e1vel pelo Centro de Arte Popular;
  a EBX, uma holding que desenvolve neg\u00f3cios em minera\u00e7\u00e3o, energia,
  log\u00edstica, petr\u00f3leo e g\u00e1s, etc; responde pelo Museu das Minas e do
  Metal; a TIM, empresa multinacional da \u00e1rea de telefonia que atua em projetos
  e a\u00e7\u00f5es socioculturais e, no caso do Circuito Cultural Pra\u00e7a da Liberdade,
  atua em parceria com a Universidade Federal de Minas Gerais (UFMG) no Espa\u00e7o
  TIM UFMG do Conhecimento; a VALE, fundada em 1942 em Itabira (MG), \u00e9 hoje a
  segunda maior mineradora diversificada do mundo e a primeira em min\u00e9rio de
  ferro. No cen\u00e1rio do circuito responde pelo Memorial Minas Gerais \u2013 VALE.
  Tamb\u00e9m aparecem como parceiros a FIAT e o Instituto Inhotim, que ser\u00e3o
  respons\u00e1veis pelos espa\u00e7os que levam seus nomes.\\n\\nO governo do estado
  de Minas Gerais, desde o ano de 2002, colocou em pauta o programa de Parceria P\u00fablico-Privada
  (PPP), contudo, somente em 2007 foi efetivamente iniciado com o projeto de explora\u00e7\u00e3o
  da Rodovia MG 050; em 2009 foi assinado um contrato para a constru\u00e7\u00e3o
  de uma unidade de administra\u00e7\u00e3o central do Complexo Penal; em seguida,
  2010, foi a vez da implanta\u00e7\u00e3o, gest\u00e3o, opera\u00e7\u00e3o e manuten\u00e7\u00e3o
  das Unidades de Atendimento Integrado (UAI''s), em seis munic\u00edpios mineiros,
  e da moderniza\u00e7\u00e3o, revitaliza\u00e7\u00e3o e concess\u00e3o do Est\u00e1dio
  Governador Magalh\u00e3es Pinto (Mineir\u00e3o); em 2012, conforme referenciado,
  foi tratado o Circuito Cultural Pra\u00e7a da Liberdade e, em 2013, a opera\u00e7\u00e3o
  e manuten\u00e7\u00e3o do Sistema Rio Manso. Atualmente, dois projetos se encontram
  em licita\u00e7\u00e3o, o de implanta\u00e7\u00e3o e opera\u00e7\u00e3o de UAI''s
  \u2013 (fase 2) e o de tratamento de res\u00edduos s\u00f3lidos urbanos. Sete contratos
  j\u00e1 est\u00e3o com os projetos conclu\u00eddos, submetidos a consulta p\u00fablica
  e t\u00eam suas licita\u00e7\u00f5es previstas para 2014, a saber: o Contorno Metropolitano
  Norte; a Rota Lund; o Aeroporto Regional da Zona da Mata; o Centro Empresarial Gameleira;
  a Unidade de Atendimento Integrado (UAI) \u2013 Pra\u00e7a Sete de Setembro; o transporte
  de passageiros sobre trilhos (metr\u00f4 de BH); e a implanta\u00e7\u00e3o e opera\u00e7\u00e3o
  de rede de \u00e1gua e esgoto no norte de Minas (Copanor 2). Existem ainda cinco
  projetos em elabora\u00e7\u00e3o, cujos tr\u00e2mites dever\u00e3o ocorrer no segundo
  semestre de 2014 ou em 2015, s\u00e3o eles: implanta\u00e7\u00e3o e opera\u00e7\u00e3o
  de infraestrutura de recolhimento de ve\u00edculos irregulares na Regi\u00e3o Metropolitana
  de Belo Horizonte (RMBH); servi\u00e7o de emplacamento de ve\u00edculos do Departamento
  Estadual de Transito de Minas Gerais (DETRAN/MG); implanta\u00e7\u00e3o e opera\u00e7\u00e3o
  da sede pr\u00f3pria do DETRAN/MG; Contorno Metropolitano Leste; e a reforma e opera\u00e7\u00e3o
  do Est\u00e1dio Mineirinho. Para o gerente-executivo do Programa de Parceria P\u00fablico-Privada
  do Estado de Minas Gerais, Marcos Siqueira:\\n\\n[...] o grande diferencial do programa
  de Minas Gerais, que tem ocasionado, inclusive, reconhecimento mundialmente, est\u00e1
  na sua execu\u00e7\u00e3o. No Estado, o programa \u00e9 coordenado pela Unidade
  de PPP, vinculada \u00e0 Secretaria de Desenvolvimento Econ\u00f4mico de Minas Gerais
  (Sede), o que centraliza os projetos. Isso permite que a troca de experi\u00eancias
  de um projeto para outro seja quase instant\u00e2nea, permitindo anteceder aperfei\u00e7oamentos
  no modelo. Com a cria\u00e7\u00e3o desse n\u00facleo central de estabelecimentos
  de projetos foi poss\u00edvel criar uma troca de aprendizado entre os setores envolvidos.
  Cada um compartilhou sua experi\u00eancia e foi poss\u00edvel descartar o que n\u00e3o
  deu certo, arrumar o que poderia melhorar e fixar o que j\u00e1 estava perfeito.
  (BIANCHETTI, 2014)\\n\\nFica bastante claro que as pol\u00edticas p\u00fablicas
  elaboradas pelo estado de Minas Gerais, nas mais variadas \u00e1reas, inclusive
  de cultura, est\u00e3o ancoradas na tend\u00eancia contempor\u00e2nea neoliberal
  da mercantiliza\u00e7\u00e3o. Tal posicionamento exige, daqueles como n\u00f3s que
  se dedicam \u00e0s an\u00e1lises e estudos sobre o territ\u00f3rio urbano, refor\u00e7o
  ao alerta de estudiosos como Harvey, para quem o \\\"empresariamento das cidades\\\"
  \u00e9 uma pol\u00edtica p\u00fablica que tende a mascarar a realidade, desviando
  a aten\u00e7\u00e3o das pessoas dos problemas relacionados ao desenvolvimento urbano
  (HARVEY, 1996.). Da mesma forma, a \\\"espetaculariza\u00e7\u00e3o\\\", como transformador
  de uma realidade diversa, complexa e contradit\u00f3ria em mercadoria, desperta
  o interesse de empreendedores privados que d\u00e3o apoio \u00e0s iniciativas de
  recupera\u00e7\u00e3o de im\u00f3veis hist\u00f3ricos e equipamentos visando ao
  interesse econ\u00f4mico.\\n\\nIniciativas que focam a preserva\u00e7\u00e3o e conserva\u00e7\u00e3o
  de edifica\u00e7\u00f5es hist\u00f3ricas, utilizando o discurso do \\\"novo uso\\\",
  s\u00e3o uma realidade e um sucesso h\u00e1 d\u00e9cadas, basta lembrarmos os exemplos
  do Opera House (Fran\u00e7a/1993); da Pinacoteca do Estado de S\u00e3o Paulo (S\u00e3o
  Paulo/1998); do Reichstag (Alemanha/1999); da Tate Modern (Inglaterra/2000); etc.;
  no entanto, muitas dessas a\u00e7\u00f5es v\u00eam acompanhadas de processos segregacionistas
  danosos \u00e0 sociedade. A Revista Veja BH, publicada em 28 de agosto de 2013,
  trouxe a seguinte manchete em sua capa: \\\"UM ESPET\u00c1CULO - com a inaugura\u00e7\u00e3o
  do Centro Cultural Banco do Brasil, na ter\u00e7a (27), a Pra\u00e7a da Liberdade
  firma-se como o principal p\u00f3lo de entretenimento da cidade\\\" (CARVALHO, 2013).
  Apesar das mais de quatro p\u00e1ginas destinadas ao assunto, infelizmente, a reportagem
  n\u00e3o abordou um simples posicionamento cr\u00edtico: esse entretenimento \u00e9
  para todos?\\n\\nN\u00e3o h\u00e1 d\u00favida de que incrementar e enaltecer os
  aspectos culturais de uma sociedade s\u00e3o a\u00e7\u00f5es de extrema relev\u00e2ncia,
  da mesma forma que a participa\u00e7\u00e3o popular ainda \u00e9 a melhor maneira
  e a mais democr\u00e1tica para melhorar as condi\u00e7\u00f5es de vida de todos.
  Mas, para que se tenha resultados que atendam satisfatoriamente \u00e0 maior parte
  da popula\u00e7\u00e3o, \u00e9 necess\u00e1rio que esta mesma popula\u00e7\u00e3o
  esteja capacitada para opinar, coerentemente, sobre as a\u00e7\u00f5es a serem implantadas.
  Considerando as caracter\u00edsticas da sociedade brasileira, seria conveniente,
  concomitante \u00e0 implanta\u00e7\u00e3o de pol\u00edticas culturais, realizar
  forte incremento nas pol\u00edticas p\u00fablicas de educa\u00e7\u00e3o para que
  a sociedade, de maneira geral, possa verdadeiramente compreender e beneficiar-se
  de sua cultura.\\n\\nCl\u00e9sio Barbosa Lemos J\u00fanior \u00e9 arquiteto e urbanista
