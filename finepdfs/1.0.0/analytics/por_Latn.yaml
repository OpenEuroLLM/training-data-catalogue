  para a \u00e1rea de Contabilidade, Auditoria e Fiscalidade, do Instituto Superior
  de Contabilidade e Administra\u00e7\u00e3o de Coimbra, publicado atrav\u00e9s do
  Aviso n.\u00ba 20724/2019, publicado no Di\u00e1rio da Rep\u00fablica, 2.\u00aa
  s\u00e9rie, n.\u00ba 248 de 26/12/2021 e publicado no site do IPC atrav\u00e9s de
  Edital\\n\\nAos vinte e dois dias do m\u00eas de fevereiro de dois mil e vinte e
  um, pelas dezassete horas, no Instituto Superior de Contabilidade e Administra\u00e7\u00e3o
  de Coimbra, sob a presid\u00eancia da Doutora Maria da Concei\u00e7\u00e3o da Costa
  Marques, Professora Coordenadora do Instituto Superior de Contabilidade e Administra\u00e7\u00e3o
  de Coimbra, reuniu o J\u00fari do concurso em ep\u00edgrafe.\\n\\nEstiveram presentes,
  atrav\u00e9s de videoconfer\u00eancia, face \u00e0 atual situa\u00e7\u00e3o epidemiol\u00f3gica
  da Covid-19, a Doutora Paula Alexandra Rocha Gomes dos Santos, Professora Coordenadora
  do Instituto Polit\u00e9cnico de Lisboa, o Professor Especialista Gabriel Correia
  Alves, Professor Coordenador do Instituto Polit\u00e9cnico de Lisboa, o Doutor Eurico
  Cirne de Lima Basto, Professor Coordenador Aposentado do Instituto Polit\u00e9cnico
  do Porto, a Doutora Augusta da Concei\u00e7\u00e3o Santos Ferreira, Professora Coordenadora
  da Universidade de Aveiro e o Doutor Bruno Jos\u00e9 Machado de Almeida, Professor
  Coordenador com Agrega\u00e7\u00e3o do Instituto Polit\u00e9cnico de Coimbra.\\n\\nAberta
  a sess\u00e3o e verificada a exist\u00eancia de qu\u00f3rum legal, de acordo com
  o n.\u00ba 1 do artigo 14.\u00ba do Regulamento de Concursos para Recrutamento de
  Professores do IPC (RCCPIPC), a Senhora Presidente do J\u00fari deu in\u00edcio
  \u00e0 reuni\u00e3o com a seguinte ordem de trabalhos:\\n\\n1. An\u00e1lise da pron\u00fancia
  da candidata Prof. Dra. Maria Georgina Tamborino Morais, em sede de audi\u00eancia
  de interessados.\\n\\nRealizada a audi\u00eancia pr\u00e9via da interessada, nos
  termos do disposto nos artigos 121\u00ba e 122\u00ba do C\u00f3digo de Procedimento
  Administrativo, em conjuga\u00e7\u00e3o com o artigo 28\u00ba da Portaria n.\u00ba
  125-A/2019, de 30 de abril, o j\u00fari constatou que a candidata aprovada, prescindiu
  do prazo dos 10 dias concedidos para se pronunciar, por concordar com a proposta
  de classifica\u00e7\u00e3o que lhe foi comunicada, conforme e-mail que se anexa
  e se d\u00e1 por integralmente reproduzido, pelo que a classifica\u00e7\u00e3o relativa
  a esta candidata se tornou definitiva:\\n\\n- Maria Georgina da CostaTamborino Morais
