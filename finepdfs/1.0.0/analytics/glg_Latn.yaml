  Senra, 108 - C.P. 15680 - Tel\u00e9fono 981 68 00 02 - Fax 981 68 22 21\"", "\"Intemperiadas,
  correspondencias interartes con Xela Arias \u00e9 un proxecto comisariado por Charo
  Lopes para a Librar\u00eda Numax. Ten como alicerce activar a pegada de Xela Arias:
  a sororidade instintiva, a desobediencia frente un equilibrio inxusto, a creatividade
  e a experimentaci\u00f3n coa palabra son a base para que novas artistas dialoguen
  hoxe coa poeta falecida en 2003. Este \u00e9 o punto de partida. O desaf\u00edo?
  Transformar o est\u00edmulo literario da autora homenaxeada este ano coa celebraci\u00f3n
  do Dia das Letras Galegas en outra cousa. A partir da poes\u00eda, desenvolver cadans\u00faa
  obra-homenaxe, tendo como escenario privilexiado o propio espazo da Librar\u00eda.\\n\\nPara
  isto contaremos con cinco artistas diferentes, en cinco citas entre abril e outubro,
  que desenvolver\u00e1n unha parte do seu proceso creativo no espazo da librar\u00eda,
  en horario de apertura ao p\u00fablico. Un happening a acontecer entre a bibliografia
  b\u00e1sica e complementaria dos andeis de NUMAX, para desenvolver cinco disciplinas
  diferentes: a fotograf\u00eda, a m\u00fasica, a ilustraci\u00f3n, o t\u00e9xtil
  e a cer\u00e1mica.\\n\\nCo apoio da\\n\\nIntemperiadas Correspondencias interartes
  con Xela Arias\\n\\nLibrar\u00eda Numax | Abril-outubro 2021\\n\\nS\u00e1bado 17
  de xullo | 13:30*\\n\\nPAULA PEREIRA galope coraz\u00f3n\\n\\nPAULA PEREIRA (Soutomaior,
  1986)\\n\\nespecializouse como ceramista no Taller Sur e no obradoiro Al\u00e9n
  das olas de Mar\u00edn, entre outros. Ilustrou o libro Xandra a landra que quer\u00eda
  voar (Urco editora), e durante 2012 e 2014 sostivo o espazo art\u00edstico A formiga
  no carreiro. Como ceramista asina coa marca Cavalinho do demo, un proxecto no que
  a natureza \u00e9 estructurante, onde introduce a mitolox\u00eda, mistura personaxes
  entre o animal e o humano, e experimenta entre o realismo m\u00e1xico e formas tradicionais
  da cultura pl\u00e1stica de tradici\u00f3n galega.\\n\\nGalope coraz\u00f3n. Paula
  Pereira xunta para a s\u00faa proposta de Intemperiadas d\u00faas palabras que rompen
  a gram\u00e1tica \u2014como tam\u00e9n fai Xela Arias\u2014 abrindo a novas e m\u00faltiples
  lecturas a combinaci\u00f3n galope coraz\u00f3n. A s\u00faa \u00e9 unha proposta
  escult\u00f3rica, composta por unha peza de cer\u00e1mica circular elaborada coa
  t\u00e9cnica do \\\"belisco\\\" -un tipo de modelado primitivo realizado cos pulgares-.
  Unha peza que a artista decorar\u00e1 finalmente na Librar\u00eda recuperando uns
  dos leitmotiv da homenaxeada este ano coas Letras Galegas, os animais e, en particular,
  os cabalos. O galope do coraz\u00f3n das mam\u00edferas correndo xuntas sincron\u00edzase
  nesta obra, de volume esf\u00e9rico, que combina forza e delicadeza.\"", "\"REGULAMENTO\\n\\nO
  Circuito Galego Xuvenil de Tenis Babolat organizado pola Federaci\u00f3n Galega
  de Tenis, disputarase nas categor\u00edas Alev\u00edn, Infantil e Cadete, masculino
  e feminino. As sedes ser\u00e1n establecidas pola Federaci\u00f3n Galega de Tenis.
  Participar\u00e1n todos os cadros xogadores/as con licenza federativa en vigor pola
  RFET no ano en que se realicen as probas, nas seguintes condici\u00f3ns:\\n\\nO
  Circuito Galego Xuvenil de Tenis Babolat comp\u00f3nse de:\\na) Seis torneos en
  cada categor\u00eda,\\nb) Campionatos Galegos Alev\u00edn, Infantil (Manuel Alonso),
  e Cadete\\nc) Babolat Cup e Master do Circuito\\n\\nENTRADAS\\n1. Os cadros finais
  estar\u00e1n compostos por 32 xogadores/as.\\n   a. 24 aceptados directamente.*\\n      i.
  12 por puntos de circuito\\n      ii. 12 por clasificaci\u00f3n Nacional\\n   b.
  8 procedentes da fase previa.\\n   c. Non se poder\u00e1n conceder prazas de Wild
  Card.\\n\\n2. Os xogadores poder\u00e1n inscribirse en d\u00faas categor\u00edas
  como m\u00e1ximo e deber\u00e1n xogar, se as\u00ed o estima oportuno ou Xu\u00edz
  \u00c1rbitro, os partidos que correspondan a cada categor\u00eda nunha sola xornada.\\n\\n3.
  Non poder\u00e1n inscribirse nos Torneos do Circuito aqueles xogadores/as que na
  mesma semana alg\u00famha das probas do mesmo, est\u00e9n representando \u00e1 nosa
  Comunidade en Campionatos de Espa\u00f1a para os que se clasificaron previamente.\\n\\n4.
  Os xogadores/as que non te\u00f1an licencia da Federaci\u00f3n Galega, poder\u00e1n
  disputar todas as probas do Circuito, excepci\u00f3n feita dos campionatos galegos
  alev\u00edn, infantil e cadete e a Babolat Cup.\\n\\n5. Calquera xogador que xogue
  o Circuito poder\u00e1 solicitar praza de Lucky Loser para o Master. Devanditas
  prazas seguir\u00e1n a orde de clasificaci\u00f3n e as normas establecidas para
  optar a ocupar o posto no caso de non presentaci\u00f3n do xogador ou xogadora clasificado.\\n\\n*
  Na primeira proba os 24 aceptados directamente saen por clasificaci\u00f3n nacional\\n\\nCABEZAS
  DE SERIE\\n1. O n\u00famero de cabezas de serie ser\u00e1 de 8 *\\n   a. Do 1 ao
  8 por puntos do circuito.\\n   b. Do 5 ao 8 por clasificaci\u00f3n nacional.\\n\\n2.
  No caso de que o cadro fina sexa inferior a 24 xogadores o n\u00famero de cabezas
  de serie reduzese de 8 a 4.\\n   a. Do 1 ao 2 por puntos do circuito.\\n   b. Do
  3 ao 4 por clasificaci\u00f3n nacional.\\n\\n* Nos campionatos Galegos e na Babolat
  Cup os cabezas de serie designaos a Federaci\u00f3n Galega de Tenis, a excepci\u00f3n
  do Campionato Galego Cadete que ser\u00e1n por Clasificaci\u00f3n Nacional.\\n\\n*
  Os cabezas de serie da primeira proba ser\u00e1n por Clasificaci\u00f3n Nacional.\\n\\n*
  A Federaci\u00f3n Galega reservease o dereito de facer as modificaci\u00f3ns neste
  artigo se as\u00ed o considera oportuno.\\n\\nSISTEMA DE PUNTUACI\u00d3N\\n1. As
  fases previas e ata 1/8 de final disputaranse o mellor de 3 sets curtos con tie
  break nos dous primeiros e un s\u00faper tie-break para decidir o terceiro set,
  adem\u00e1is:\\n   a. Os \u00bc, semifinais e final mas probas alevins disputaranse
  igualmente con sets curtos, desde 2 iguais e super tie-break no caso de empate a
  sets.\\n   b. Este sistema no ser\u00e1 aplicable na Babolat Cup, e los diferentes
  Campionatos Galegos (Alev\u00edn, Infantil y Cadete) que se disputaran tanto na
  s\u00faa fase previa como na fase final o mellor de 3 sets. con tie-break en todos
  eles.\\n   c. Por decisi\u00f3n do Xu\u00edz \u00c1rbitro e previa consulta al coordinador
  do circu\u00edto, calquera dos partidos do Circuito poder\u00e1 ser disputado baixo
  as condici\u00f3ns citadas no punto 1, por motivos de tempo o meteoroloxicos.\\n\\nARBITRAXE\\n1.
  Os clubs organizadores est\u00e1n obrigados a p\u00f3r xu\u00edces de cadra na s\u00faa
  semifinais en cada unha das probas.\\n   E obrigatorio cumprir os requisitos de
  arbitraxes e de non facelo ser\u00e1n exclu\u00eddos durante os 3 seguintes anos
  do Circuito Xuvenil.\\n\\nSISTEMA DE CLASIFICACI\u00d3N\\n1. Os xogadores/as participantes
  nas probas do Circuito Galego Xuvenil de Tenis Babolat obter\u00e1n puntos circuito:\\n   a.
  A partir de dezaseisavos de final nos Campionatos Galegos Alev\u00edn, Infantil
  Manuel Alonso e Cadete.\\n   b. A partir de oitavos de final nas restantes probas
  do Circuito.\\n   c. Estes puntos ao finalizar o Circuito multiplicanse polo coeficiente
  que oportunamente decida a Federaci\u00f3n\\n   d. A cantidade a repartir \u00e9
  de 8.000\u20ac en vales de material deportivo a trocar en calquera das tendas que
  se indicar\u00e1n ao finalizar o Circuito e antes de come\u00e7ar o M\u00e1ster.\\n   e.
  Para poder optar ao M\u00e1ster e aos premios \u00e9 obrigatorio participar alomenos
  no 50% das probas circuito (3).\\n   f. Para a clasificaci\u00f3n final ser\u00e1n
  descartados os dous proxectos m\u00e1is altos de todo o circuito, inclu\u00edndo
  a non participaci\u00f3n.\\n   g. A finalizaci\u00f3n do Circuito os 16 xogadores/as
  mellor clasificados en cada categor\u00eda, ter\u00e1n a opci\u00f3n de disputar
  o MASTER do Circuito Galego Xuvenil de Tenis Babolat onde se repartir\u00e1n entre
  os participantes 4.000\u20ac (cuatro mil euros) en vales de material deportivo.
  Igualmente recibir\u00e1n os vales de material deportivo correspondentes aos seus
  puntos Circuito.\\n   Para iso deber\u00e1n disputar obrigatoriamente o M\u00e1ster,
  en caso de non facelo e non confirmar a s\u00faa asistencia, o seu posto ser\u00e1
  ocupado polo 1\u00ba suplente e as\u00ed sucesivamente ata completar os 16 xogadores/as.\\n\\nSISTEMA
  DE PENALIZACI\u00d3N\\n1. Os xogadores/as perdedores por WO ser\u00e1n penalizados:\\n   a.
  cos puntos correspondentes a oitavos de final a 1\u00aa vez,\\n   cuartos de final
  a 2\u00aa e exclusi\u00f3n do Circuito por 3\u00aa vez.\\n   Recom\u00e9ndase aos
  diferentes Clubs organizadores das diferentes probas, esixan as inscrici\u00f3ns
  por fax ou e-mail, achegando os datos do xogador/a, como nome, licenza, n\u00ba
  de tel\u00e9fono e Club ao que pertence, e informarlle ao xogador/a de calquera
  anomal\u00eda que puidese xurdir. O coordinador do Circuito Galego Xuvenil de Tenis
  Babolat \u00e9 Cayetano Burrieta. Para posibles consultas o seu n\u00famero de tel\u00e9fono
  \u00e9 667688432.\\n\\nQuero aproveitar este Calendario para presentarme como novo
  Presidente da Federaci\u00f3n Galega de Tenis, agradecer a Babolat que un ano m\u00e1is
  sexa patrocinador do Circuito Xuvenil de Tenis.\\n\\nComo se mostra no regulamento
  o noso Circuito Xuvenil o forman 6 probas, os campionatos galegos e m\u00e1is a
  Babolat Cup e o Master, en todas os desexo sorte para que melloredes o voso nivel
  e consigades estupendos resultados.\\n\\nBenqueridos/as xogadores/as, comeza o II
  CIRCUITO GALEGO XUVENIL DE TENIS BABOLAT. Algunxs de v\u00f3s xa participasteis
  na primeira edici\u00f3n. Os m\u00e1isafortunados ainda puideron trocar os puntos
  ga\u00f1ados no CIRCUITO, por alg\u00fan dos premios BABOLAT nas tendas colaboradoras.\\n\\nTam\u00e9n
  este ano acontecer\u00e1 a II BABOLAT CUP, con participaci\u00f3n destacada dos
  representantes da FGT.\\n\\nDes\u00e9xovos a todos/as sorte neste 2010, e que os
  resultados da competici\u00f3n recompensen o voso traballo diario nas vossas escolas
  de tenis.\\n\\nJose Luis Ameneiro\\nPresidente Federaci\u00f3n Galega de Tenis\\n\\nAlex
