  |\\n| Imprevistos | Orde 29/1/2016. Artigo 33 | Anexo V | Direcci\u00f3n. Prazo
  3 d\u00edas | 24 per\u00edodos lectivos |\\n\\nPermisos para o cumprimento de deberes
  inescusables de car\u00e1cter p\u00fablico ou persoal, de deberes relacionados coa
  conciliaci\u00f3n da vida familiar e laboral e mais de asistencia a consultas e
  revisi\u00f3ns m\u00e9dicas (Artigo 14).\\n\\nIncl\u00faense as enfermidades leves
  non superiores a 3 d\u00edas cando se aporte xusti\ufb01 caci\u00f3n documental\\n\\nEnt\u00e9ndese
  por deber inescusable de car\u00e1cter p\u00fablico ou persoal:\\n\\n* Comparecencia
  obrigatoria por citaci\u00f3ns instadas por \u00f3rganos xudiciais, comisar\u00edas
  ou calquera outro organismo o\ufb01 cial.\\n* Obrigas cuxo incumprimento xeren \u00e1
  persoa interesada unha responsabilidade de orde civil, penal ou administrativa.\\n*
  Cumprimento de deberes cidad\u00e1ns derivados dun proceso electoral.\\n* Asistencia
  a reuni\u00f3ns dos \u00f3rganos de goberno e comisi\u00f3ns dependentes destes
  cando deriven estritamente do cargo electivo de concelleira ou concelleiro, as\u00ed
  como de deputada ou deputado, ou senadora ou senador.\\n* Asistencia como membro
  \u00e1s sesi\u00f3ns dun tribunal de selecci\u00f3n ou provisi\u00f3n, con nomeamento
  da autoridade competente.\\n* A realizaci\u00f3n de visitas dentro dos programas
  europeos.\\n* A asistencias \u00e1s reuni\u00f3ns das comisi\u00f3ns das probas
  de acceso \u00e1 universidade ou an\u00e1logas.\\n* O emprego do tempo necesario
  para facer unha doaz\u00f3n de sangue, medula ou plaquetas, de acordo co disposto
  no Real Decreto 1088/2005, do 16 de setembro.\\n* Asistencia dos deportistas de
  alto nivel a asistir \u00e1s competici\u00f3ns de car\u00e1cter internacional as\u00ed
  como as concentraci\u00f3ns preparatorias desas de acordo co disposto no Real Decreto
  971/2007, do 13 de xullo.\\n* A asistencia a reuni\u00f3ns cando sexa convocado
  ou convocada pola Conseller\u00eda de Cultura, Educaci\u00f3n e Ordenaci\u00f3n
  Universitaria ou polas s\u00faas xefaturas territoriais.\\n\\nEnt\u00e9ndese por
  deberes relacionados coa conciliaci\u00f3n da vida persoal e familiar, entre outros:\\n\\n1.
  O acompa\u00f1amento \u00e1s revisi\u00f3ns ou consultas m\u00e9dicas, aos tratamentos
  de quimioterapia e radioterapia, as\u00ed como \u00e1s intervenci\u00f3ns m\u00e9dicas
  invasivas (biopsias, colonoscopias, gastroscopias e outras de caracter\u00edsticas
  similares),  das \ufb01 llas e \ufb01 llos discapacitados, das \ufb01 llas e dos
  \ufb01 llos menores de idade e das persoas maiores ao seu cargo polo tempo necesario,
  con aviso previo presentado a solicitude de permiso, en que se sinalar\u00e1 a hora
  prevista da consulta.\\n* No caso de solicitar este permiso para acompa\u00f1ar
  \u00e1s \ufb01 llas e \ufb01 llos maiores de idade, ao c\u00f3nxuxe ou \u00e1 parella
  de feito, deberase acreditar que necesitan acompa\u00f1amento.\\n* As\u00ed mesmo,
  para estes efectos consid\u00e9ranse persoas maiores a cargo do persoal funcionario
  os familiares de primeiro grao que, pola s\u00faa idade ou estado de sa\u00fade,
  non se poidan valer por si mesmos para acudir a consulta. Tam\u00e9n ter\u00e1n
  esta consideraci\u00f3n os familiares de segundo grao con enfermidades moi graves
  que necesitan seguimento m\u00e9dico estrito e que non se poden valer por si mesmos
  para ir \u00e1 consulta, no caso de que estean ao coidado directo da persoa funcionaria\\nou
  ao seu cargo e sempre que neste \u00faltimo caso non te\u00f1a familiares de 1\u00ba
  grao ou que estes sexan maiores e non poidan atendelos.\\n* Cando, con car\u00e1cter
  excepcional, este permiso se vaia gozar cunha certa periodicidade, o persoal funcionario
  docente presentar\u00e1 unha \u00fanica solicitude con todos os d\u00edas que previsiblemente
  vai necesitar, acompa\u00f1ada dos documentos xusti\ufb01 cativos pertinentes.\\n*
  Os centros educativos, coa \ufb01 nalidade de evitar a colisi\u00f3n de dereitos
  do profesorado cos do alumnado \u00e1 educaci\u00f3n, adoptar\u00e1n as medidas
  oportunas para a  adecuada atenci\u00f3n do alumnado que en casos excepcionais poder\u00e1
  implicar,  logo de informe da inspecci\u00f3n educativa, o nomeamento de persoal
  docente substituto.\\n2. A asistencia do pai, nai, titor ou titora \u00e1s titor\u00edas
  do centro escolar ao que asisten os seus \ufb01 llos/as ou menores ao seu cargo.\\n3.
  A asistencia do pai, nai, titor ou titora con \ufb01 llas ou \ufb01 llos con discapacidade
  a reuni\u00f3ns de coordinaci\u00f3n do seu centro de educaci\u00f3n especial.\\n\\nPermisos
  por parto, adopci\u00f3n ou acollemento e permiso do outro proxenitor no caso do
  persoal interino e substituto\\n\\nO persoal funcionario interino ou substituto
  docente que non estivese prestando servizos e reunise os requisitos para estar gozando
  dos permisos de parto, adopci\u00f3n ou acollemento o permiso por lactaci\u00f3n
  ou a licenza por risco no embarazo  ter\u00e1 dereito a ser chamado para as interinidades
  e substituci\u00f3ns que lle correspondan, tomando posesi\u00f3n coa \ufb01 nalidade
  de que os servizos que lle corresponder\u00eda prestar lle sexan reco\u00f1ecidos
  para os efectos administrativos e os econ\u00f3micos cando non tivese dereito \u00e1s
  prestaci\u00f3ns correspondentes. No suposto de que no momento da \ufb01 nalizaci\u00f3n
  do permiso estivese vixente o nomeamento de interinidade ou substituci\u00f3n, ter\u00e1
  dereito a optar pola incorporaci\u00f3n \u00e1 praza. No caso contrario cesar\u00e1
  nela tam\u00e9n para os efectos administrativos.\\n\\nPoder\u00e1n, tam\u00e9n,
  tomar posesi\u00f3n coa pretensi\u00f3n de solicitar a excedencia por coidado de
  familiar regulada no artigo 176 da Lei 2/2015, do 29 de abril, do emprego p\u00fablico
  de Galicia.\\n\\nLicenzas\\n\\n| Tipos | Lexislaci\u00f3n | Documentaci\u00f3n |
