  Desenvolvemento dos reflexos necesarios para que na medida do posible o pulso non
  se vexa alterado, interrumpindo o discurso musical. (Interiorizaci\u00f3n do pulso.)\\n-
  Reco\u00f1ecemento das sonoridades dos grupos de  t\u00f3nica, subdominante e dominante.\\n-
  Fomento das capacidades de asimilaci\u00f3n, concentraci\u00f3n e memoria.\\n\\n-
  Asimilaci\u00f3n auditiva do canon e da imitaci\u00f3n.\\n- Afianzamento no an\u00e1lise
  de pequenas pezas musicais.\\n- Pr\u00e1ctica de difrentes cadencias musicais con
  soltura.\\n\\n3. PR\u00c1CTICA INSTRUMENTAL EN CONXUNTO\\n\\n1\u00ba GE\\n\\nObxectivos\\n\\n-
  Ofrecer \u00f3 estudante un repertorio f\u00e1cil e variado, no que te\u00f1an cabida
  t\u00f3dolos x\u00e9neros musicais posibles.\\n- Introducir  materiais  de  pr\u00e1ctica  de  conxunto  que  se  poidan  aprender
  directamente sobre o instrumento, sen necesidade de lectura.\\n- Estimular no estudante
  a percepci\u00f3n estructural e a identificaci\u00f3n de patr\u00f3ns musicais que
  lle faciliten a futura comprensi\u00f3n da sintaxe musical.\\n- Interpretar pezas
  en grupo de xeito l\u00fadico, tomando conciencia da importancia do grupo \u00e1
  hora de facer m\u00fasica, en contraposici\u00f3n \u00e1 interpretaci\u00f3n individual.\\n-
  Desenvolver no estudante a capacidade auditiva para escoitar \u00f3 outro \u00f3
  tempo que toca.\\n- Participar en audici\u00f3ns onde se amose o traballo realizado
  na clase.\\n\\nContidos\\n\\n- Iniciaci\u00f3n na autoescoita como base de toda
  interpretaci\u00f3n musical.\\n- Iniciaci\u00f3n \u00e1 audici\u00f3n activa, como
  medio para comprender e facer comprender a m\u00fasica, tanto \u00f3 int\u00e9rprete
  coma \u00f3 ouvinte.\\n- Adquisici\u00f3n progresiva da capacidade para integrarse
  nun todo.\\n- Control primario da topograf\u00eda do teclado.\\n- Traballo comprensivo
  a trav\u00e9s da execuci\u00f3n de pequenas estructuras musicais.\\n- Realizaci\u00f3n
  de actividades con p\u00fablico.\\n\\n2\u00ba G. E.\\n\\nOxectivos\\n\\n- Ofrecer
  \u00f3 estudante un repertorio f\u00e1cil e variado, no que te\u00f1an cabida t\u00f3dolos
