  do premio fin de grao\\n\\nRevisada a orde do 10 de marzo de 2009 que regula os
  premios fin de grao, dec\u00eddese que a proba correspondente a especialidade de
  Piano sexa a interpretaci\u00f3n de memoria de un recital de al menos 20 minutos
  de duraci\u00f3n, con obras elexidas libremente polos aspirantes. No caso de presentar
