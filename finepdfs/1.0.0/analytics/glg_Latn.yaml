  e non saber asinar, rogo a un que o faga por min. Na dita fregues\u00eda. Febreiro
  dezaseis de mil setecentos cincuenta e tres. \u00d3 rogo, Antonio Rodr\u00edguez.\\n\\nO
  Serradoiro do Cunchido (e IV)\\n\\nO REMATE DA ACTIVIDADE NO SERRADOIRO DO CUNCHIDO\\n\\nO
  que subscribe inda garda na memoria os sons da orquestra \\\"Romero\\\" ensaiando
  o seu amplio repertorio musical no pendello anexo \u00e1 casa de Moncho Albor\u00e9s.
  Son lembranzas duns tempos xa vencidos que inda sendo afastados no tempo perduran
  na memoria de quien compartiu horas de solaz co propietario do serradoiro do Cunchido.\\n\\nCando
  o boom da emigraci\u00f3n a pa\u00edses europeos como Su\u00edza, Alema\u00f1a,
  Reino Unido... al\u00f3 pola d\u00e9cada dos anos 60 do s\u00e9culo pasado a actividade
  dos serradoiros comezou o seu declive. Pura l\u00f3xica pecuniaria, porque os soldos
  que se pagaban \u00f3s traballadores na Serra de Outes e noutras partes de Galicia
  e mesmo de Espa\u00f1a non acababan a cont\u00eda dos que se pagaban no estranxeiro
  e produciuse un \u00e9xodo masivo. Isto, entre outras circunstancias, provocou o
  declive das actividades madeireiras e doutros \u00e1mbitos produtivos. Un empresario
  ten a obriga de ser perspicaz e saber adiantarse \u00e1s situaci\u00f3ns adversas,
  Moncho foi\u00f1o.\\n\\nA actividade empresarial de Moncho Albor\u00e9s era consistente
  e s\u00f3lida, porque despois da aprendizaxe co seu pai e irm\u00e1n rexentara en
  sociedade un serradoiro na Chainza, Noia, \u00f3 que \u00edan traballar homes e
  mulleres que aproveitaban o remate da xornada laboral para carrexar le\u00f1a en
  cabaces cun mulido protector na cabeza para poderen pren-de-lo lume nos seus respectivos
  fogares. No Cunchido suced\u00eda o mesmo. Mais as vendas e todo o demais non colmaban
  as expectativas empresariais e hab\u00eda que explorar outras actividades. Non abondaba
  con espolar pi\u00f1eiros no monte e logo transform\u00e1los en t\u00e1boas. Impo\u00f1iase
  a procura de alternativas.\\n\\nRetrocedendo no tempo at\u00f3pome cun documento
  que traduzi \u00f3 galego respectoada a literalidade do escrito en castel\u00e1n:
  \u201cNa vila da Serra de Outes, a vinte e tres de marzo de mil novecentos cincuenta
  e seis, perante as testemu\u00f1as que se dir\u00e1n, comparecen:\\n\\nRam\u00f3n
  Albor\u00e9s Ramos, vi\u00favo, industrial, veci\u00f1o desta vila, e da outra parte
  Ram\u00f3n Albor\u00e9s Santos \u201cMoncho\u201d, fillo do anterior, casado con
  Mar\u00eda Maceiras Conde, e igualmente industrial e veci\u00f1o do imediatio lugar
  do Cunchido, que fan constar:\\n\\nQue Ram\u00f3n Albor\u00e9s Santos solicita do
  seu pai para atende-las necesidades da s\u00faa industria de serrar madeiras, en
  pr\u00e9stamo, a cantidade de noventa mil pesetas.\\n\\nRam\u00f3n Albor\u00e9s
  Ramos faille entrega nese intre da expresada cantidade da que recibe carta de pagamento
  coas cl\u00e1usulas seguintes:\\n\\nO prazo para a devoluci\u00f3n ser\u00e1 o que
  estime o Sr. Albor\u00e9s Ramos, podendo en calquera momento reclamarllas sempre
  cum mes de antelaci\u00f3n.\\n\\nResponde do cumprimento de devoluci\u00f3n o Sr.
  Albor\u00e9s Santos cos seus bens e dereitos, pohendo como primeira garant\u00eda
  a propiedade do soar e o edificio-vivenda de recente construci\u00f3n que pos\u00fae
  na parroquia de Barro, concello de Noia, adquirida por el mesmo en sociedade conxugal
  coa s\u00faa dona, Mar\u00eda Maceiras Conde segundo documento p\u00fablico outorgado
  perante o notario de Noia, D. Ces\u00e1reo V\u00e1zquez Ulloa, inscrito no protocolo
  deste co n\u00famero cincocentos cincuenta e un.\\n\\nLido todo asinan por duplicado
  os interesados e as testemu\u00f1as, Xos\u00e9 Rodr\u00edguez Caama\u00f1o e Luciano
  Albor\u00e9s Gosende, vec\u00ednos respectivamente do Cunchido e Ribademed. As\u00ed
  mesmo asina o documento en conformidade Mar\u00eda Maceiras Conde\u201d.\\n\\nO
  xuro fixouse no 5% do capital e foi aboadu en dous prazos, o primeiro de 4.500 pesetas
  e o segundo de 2.700.\\n\\nPreviamente e en concreto o doce de xaneiro de mil novecentos
  cincuenta e seis Domingo Albor\u00e9s Ramos, t\u00edo de Moncho, Carmen e Xos\u00e9,
  irm\u00e1ns arrend\u00e1ndole a proporci\u00f3n da que son donos por herdanza no
  serradoiro. O serradoiro, segundo se especifica no documento consta: \u201cDe dous
  pendellos de 20 m de longo e outros tantos de ancho cada un, constru\u00eddos en
  madeira e asentados en columnas, tam\u00e9n un \u201cgaler\u00edn\u201d. Un deles
  destinado a m\u00e1quinas e o outro a almacenamento\u201d. Asemade o documento describe
  pormenorizadamente os \u00fatiles: \u201cUn motor el\u00e9ctrico de vinte e nove
  HP, un aparello de serrar cun di\u00e1metro de un metro e vinte cent\u00edmetros
  con \u201cgaler\u00edn\u201d de preparar, outro dun metro tam\u00e9n con \u201cgaler\u00edn\u201d,
  d\u00faas m\u00e1quinas de serrar de mesa dun metro de di\u00e1metro en volantes,
  unha b\u00e1scula fixa de ata catro mil quilos, un transformador coa s\u00faa correspondente
  caseta, unha arca de caudais \u201cGr\u00fcber\u201d de pequeno tama\u00f1o, outra
  de escribir marca \u201cUnder Wood\u201d. Un autom\u00e1tico de serrar \u201cAmsa\u201d
  e ademais t\u00f3dolos accesorios e terreos destinados \u00f3 secado da madeira
  alg\u00fans deles alugados a Antonia Castro Nieto, Loreto Sacido e Ux\u00edo At\u00e1n\u201d.\\n\\nA
  participaci\u00f3n de cada un dos asinantes resulta se-la seguinte:\\n\\n- Moncho
  Albor\u00e9s, o 57,12%\\n- Carme Albor\u00e9s, o 4,778%\\n- Xos\u00e9 Albor\u00e9s,
  o 4,778%\\n- Domingos Albor\u00e9s Ramos, o 8,332%\\n\\nComo me estou a referir
  a un documento anterior a outro reserado nun n\u00famero anterior desta publicaci\u00f3n,
  o 25% restante pertencella a Manuel Albor\u00e9s, de Ribademed. Por dito arrendamento
  Moncho deber\u00e1 aboar 300 pesetas mensuais ademais dos custos de S.S., contribuci\u00f3ns,
  arrendamento das parcelas, reparaci\u00f3ns e conservaci\u00f3n das instalaci\u00f3ns
  e maquinaria e o melloramento das mesmas. O tempo de duraci\u00f3n do contratado
  fixase en seis anos. No caso de paralizaci\u00f3n da actividade do serradoiro por
  guerra, crise importante ou outras causas de forza maior poder\u00e1 Moncho suspende-lo
  pagamento de renda e continuala aboando unha vez desaparecidas as dificultades.
  Este contrato foi asinado tam\u00e9n polas testemu\u00f1as Xos\u00e9 Rodr\u00edguez
  Caama\u00f1o e Vicente Blanco Ponte.\\n\\nNa relaci\u00f3n de contribuintes da Administraci\u00f3n
  de Rendas P\u00fablicas da provincia da Coru\u00f1a correspondente ao ano 1963 figura
  o serradoiro do Cunchido cos seguintes datos:\\n\\nAntigo serradoiro do Cunchido,
  coas novas instalaci\u00f3ns de G. Castro.\\n\\nN\u00fameros, ord. 535, ind. 184\\nContribuinte:
  Ram\u00f3n Albor\u00e9s Santos (B.)\\nDomicilio: Outes\\nBase impositiva: 15.000\\nCota:
  3.000\\nDeduccions: 0\\nCota l\u00edquida: 3.000\\nIngreso a conta: 2.033\\nCota
  a ingresar: 967\\n\\nO oito de abril dese ano de 1963 Moncho Albor\u00e9s comunicalle
  \u00f3 enxe\u00f1eiro xefe do distrito forestal da Coru\u00f1a autorizaci\u00f3n
  da Delegaci\u00f3n de Traballo para proceder ao peche da empresa, sendo este motivado
  pola dif\u00edcil situaci\u00f3n que naquel momento, na s\u00faa opini\u00f3n, atravesaban
  estas empresas e as dificultades econ\u00f3micas inherentes. Asemade preg\u00e1lle
  un informe sobre se nalgun momento, desaparecida-las dificultades, poder\u00eda
  retoma-la actividade ou se poder\u00eda aluga-las instalaci\u00f3ns. O vinte e dous
  de abril o enxe\u00f1eiro xefe respondeulle que se o peche de actividades no serradoiro
  \u00e9 por tempo inferior a un ano abonda con solicita-lo inicio das actividades
  sen m\u00e1is tr\u00e1mites, pero se \u00e9 superior debe iniciarse un expediente
  de apertura coma se fose de nova instalaci\u00f3n. Tam\u00e9n lle comunica que pode
  aluga-la f\u00e1brica se o solicita previamente da Xefatura e comunicando o certificado
  profesional do alugador. O dezaseis de marzo de 1965 a mesma Xefatura Provincial
  comunicalle que despois das visitas de inspecci\u00f3n realizadas polo persoal facultativo
  do Distrito Forestal da Coru\u00f1a quedou comprobado que nas instalaci\u00f3ns
  do serradoiro non hab\u00eda actividade desde hai m\u00e1is de dous anos. Na Coru\u00f1a
  o tresde xu\u00f1o de 1965 Moncho Albor\u00e9s arr\u00e9ndalle a f\u00e1brica con
  t\u00f3dalas s\u00faas instalaci\u00f3ns e terreos anexos ao vec\u00ed\u00f1o do
  Obre, Noia, Manuel Figueira Guerrero por un per\u00edodo de cinco anos prorrogable
  de com\u00fan acordo polo importe de 700 pts. mensuais, \u00e9 dicir, 8.400 pts.
  anuais a satisfacer no domicilio do arrendador por mensualidades vencidas fixando
  como condici\u00f3n que a conservaci\u00f3n da maquinaria e das instalaci\u00f3ns
  ficar\u00e1 a cargo do arrendatario.\\n\\nPerante a crise que afecta aos serradoiros
  Moncho decide facer unha f\u00e1brica de cer\u00e1mica, idea que desbotou, e logo
  mercar unha f\u00e1brica de conserva de produtos por medio do salgado, unha salgadeira,
  e transformala noutra de conservas en Lira, concello de Carnota:\\n\\nCOMPOSICI\u00d3N.-
  \u201cEn una zona mar\u00edtima del puerto de Lira se encuentra una construcci\u00f3n
  de varias naves destinadas en su d\u00eda a salaz\u00f3n de pescados, pero que en
  la actualidad se encuentran abandonadas por no tener salida esta industria. Se proyecta
  en estas edificaci\u00f3nes hacer una transformaci\u00f3n para poder destinar este
  edificio a la conserva de pescados. Para ello se respetan los muros actuales, las
  cubiertas actuales tratando en lo posible de adaptar todos ellos a esta nueva industria,
  que constar\u00e1 de una planta baja, un entresuelo en la parte anterior del edificio
  destinado a vivienda una parte y la otra a oficinas y a almac\u00e9n de vac\u00edos.
  La planta baja seg\u00fan proyecto se destinar\u00e1 totalmente a la conservaci\u00f3n
  de pescados, con sus correspondientes zonas y utensilios para dicha fabricaci\u00f3n,
  estando adosada al final del edificio, en una edificaci\u00f3n nueva, la caldera.
  Tendr\u00e1 tambi\u00e9n esta planta el correspondiente frigor\u00edfico, comedores
  para personal, aseos-duchas, cocina y comedor-estar de vivienda etc... Presupuesto
  aproximado de estas obras: 325.342,84 pts.\u201d\\n\\nUn accidente dun operario
  veu altera-lo curso das obras. Os gastos que ocasionou eran cuantiosos e a s\u00faa
  dona, Mar\u00eda Maceiras, recorreu \u00e1 axuda e consellos do avogado de Compostela,
  Paz Sueiro, quen lle recomendou a contrataci\u00f3n dun detective que fotografase
  ao obrero traballando a pleno rendemento nunha empresa de construci\u00f3n. E as\u00ed
  o fixo. Foise a xuizo e o traballador perdeu, quedando liberada das cargas econ\u00f3micas
  a familia Albor\u00e9s-Maceiras. Ademais a Direcci\u00f3n Xeral de Industrias Text\u00edles
  e Varias, dependente do Ministerio de Industria denegoulle a Mar\u00eda Maceiras
  -era a nome de quien estaban as instalaci\u00f3ns de Lira- a posta en funcionamento
  da futura f\u00e1brica de conservas de pescado polo baixo \u00edndice de produtividade
  e por non existir base t\u00e9cnica nin econ\u00f3mica que xustifisen esta nova
  instalaci\u00f3n.\\n\\nMoncho incl\u00ednase pola emigraci\u00f3n e marcha a Canad\u00e1,
  onde ti\u00f1a a s\u00faa cu\u00f1ada Aurita, irm\u00e1 de Mar\u00eda, e ali botar\u00eda
  vinte e cinco anos ata a s\u00faa xubilaci\u00f3n. Regresou novamente primeiro \u00e1
  s\u00faa casa de Noia e logo trasladouse \u00f3 piso que mercara en Compostela na
  r\u00faa Fernando III. En Compostela foi precisamente onde faleceron el e a s\u00faa
  dona.\\n\\nMoncho Albor\u00e9s.\\n\\nUn detalle que non quero obviar, porque denota
  a humanidade de Moncho, \u00e9 que nun d\u00eda normal de actividade no serradoiro
  mesmo \u00f3 saber que se declarara un incendio na casa da Buxanteira situada na
  Serra de Abaixo ordenou para-las m\u00e1quinas e enviou os obreros a colaborar na
  extinci\u00f3n das lapas e, posteriormente, puxo en marcha unha campa\u00f1a para
  recadar cartos que axudasen a aquela familia a constru\u00edr unha nova vivenda.
  Isto ch\u00e1mase ser solidario.\\n\\n\\\"Aspera\\\" no cami\u00f1o (I)\\n\\nSantiago
  Llovo Taboada\\n\\nAspera ou Aspera \u00e9 un lugar da parroquia de San Xo\u00e1n
  de Roo, concello de Outes, dependente da aldea de Bendim\u00f3n. O top\u00f3nimo
  \\\"Aspera\\\" probablemente se relaciona cunha ponte sobre un r\u00edo ou regato,
  e en concreto coa espera para cruzalo. O nome actual procede dunha derivaci\u00f3n
  da palabra \\\"Espera\\\", que a fon\u00e9tica local derivou primeiro en \\\"Aspera\\\"
  e posteriormente en \\\"Aspera\\\". Este nome reproducese noutros lugares, como
  a co\u00f1ecida \\\"Ponte da \u00c1spera\\\", no concello de Sarria, provincia de
  Lugo, en pleno Cami\u00f1o Franc\u00e9s a Santiago. Esta referencia levanos a pensar
  que a Aspera outense ten moita m\u00e1is historia ca a que chegou \u00f3s nosos
  d\u00edas, e que o seu significado puidera ter que ver cun posible pont\u00e1dego
  existente no lugar.\\n\\nPara falar sobre a historia desta ponte sobre o r\u00edo
  Roo, ning\u00fan mellor ca un dos seus veci\u00f1os, memoria viva de Aspera e de
  toda a bisbarra, Manuel Castro Blanco, \\\"Manolo de Soria\\\", tam\u00e9n alcumado
  \\\"Manolo do Pulido\\\". O que a seguir se recolle procede maioritariamente das
  lembranzas que atesoura este veterano mari\u00f1eiro e librepensador, unhas protagonizadas
  por el mesmo e outras transmitidas polos seus antepasados.\\n\\nO dato concreto
  m\u00e1is antigo de que disp\u00f3n \u00e9 a propia fundaci\u00f3n da aldea de Bendim\u00f3n
  e do seu anexo, Aspera. Segundo informaci\u00f3n oral dos seus antepasados e documentaci\u00f3n
  que consta no seu poder, Bendim\u00f3n ten a s\u00faa orixe, aproximadamente no
  s\u00e9culo XV, na decisi\u00f3n dos atesourados antepasados do poeta A\u00f1\u00f3n
  de explotar a vi\u00f1edo as terras do arredor, que previamente lle aforara a Igrexa.
  A tal fin trouxo como xornaleiros varios veci\u00f1os do lugar de Banzas, parroquia
  de Santo Ourente de Enti\u00f1os, para quen mandou ergue-la que probablemente fora
  a primeira construcci\u00f3n do lugar. Con posterioridade, co fin de explotar regularmente
  estas terras, potenciaron a s\u00faa colonizaci\u00f3n, erguendo as primeiras vivendas
  as familias Bali\u00f1as, Conde, Montes e Rama.\\n\\nOutro dato de interese que
  transmitiu foi que, por diante da s\u00faa casa en Aspera, onde transcorre o chamado
  Cami\u00f1o Real, pasaron as tropas napole\u00f3nicas. Esta informaci\u00f3n pod\u00e9mola
  dar por certa xa que, tras arrasar Corcubi\u00f3n e Muros na primavera de 1809,
  continuaron cara \u00e1 s\u00faa base de Santiago e das R\u00edas Baixas. O \u00fanico
  cami\u00f1o que daquela exist\u00eda na zona \u00e9 o que transcorre por Bendim\u00f3n,
  entre Roo e o priororado de Sabardes.\\n\\nSe as referencias anteriores poden resultar
  interesantes, o que m\u00e1is nos chamou a atenci\u00f3n foi a afirmaci\u00f3n de
  que na s\u00faa aldea houbo unha capela e un albergue social de peregrinos e pobres.
  A mi\u00f1a ignorancia sobre o asunto non puido ilustrarse con documentaci\u00f3n
  oficial que confirme a existencia do albergue. Malia ese importante contratempo,
  o seu relato, xunto coas pistas que o paso do tempo non desfixo, fannos pensar na
  veracidade de \u00e1mbalas informacions.\\n\\nEsclarecer este pequeno anaco de historia
  na actualidade ten muito sentido, xa que recentemente, no d\u00eda 28 de novembro
  de 2018, representantes dos concellos de Santiago, Ames, Bri\u00f3n, Rois, Lousame,
  Noia, Porto do Son, Outes e Muros, asinaron un convenio para promover la oficializaci\u00f3n
  do Cami\u00f1o pola r\u00eda de Muros e Noia, como Ruta Xacobea. Con ese proxecto
  t\u00e9nse recuperar parte do esplendor que supuxo no pasado esta ruta de peregrinxase
  a Compostela.\\n\\nTanto en Muros como en Noia subsisten innumerables vestixios
  da importancia que tivo no pasado a peregrinaci\u00f3n xacobea para estas vilas.
  Malia o perigo dos piratas e a dificultade das nosas costas para a navegaci\u00f3n,
  o Cami\u00f1o Mar\u00edtimo Ingl\u00e9s era o itinerario a Compostela preferido
  polos peregrinos do norte de Europa, por ser un traxecto m\u00e1is r\u00e1pido e
  econ\u00f3mico ca o terrestre.\\n\\nA\u00ednda non sendo nin Muros nin Noia os portos
  principais de chegada, os peregrinos que desembarcaban ou pasaban por Muros cando
  vi\u00f1an de Fisterra ti\u00f1an d\u00faas opci\u00f3ns para chegaren a Compostela:
  pola \\\"monta\u00f1a\\\" ou pola costa. Se escolllan esta segunda opci\u00f3n,
  na metade do traxecto entre Muros e Noia atop\u00e1base a ponte e aldea de Bendim\u00f3n/Aspera,
  coa s\u00faa fonte, capela e albergue, para dar servizo \u00f3s cami\u00f1antes.
  Xa o C\u00f3dice Calixtino lembraba (en lat\u00edn): \\\"Os peregrinos, tanto pobres
  coma ricos, han de ser caritativamente recibidos e venerados por\\n\\nt\u00f3dalas
  xentes cando van ou ve\u00f1en de Santiago. Pois quenquera que os recibir e dixilcentemente
  os hospedar, non s\u00f3 ter\u00e1 como h\u00f3spede Santiago, sen\u00f3n tam\u00e9n
  o Se\u00f1or\u201d.\\n\\nAs\u00ed como a ponte e a fonte de Bendim\u00f3n podemos
  situalas probablemente na \u00e9poca das peregrinaci\u00f3ns, no que respecta \u00e1
  desaparecida capela de Santo Amaro e o albergue de Aspera, t\u00e9mo-las nosas d\u00favidas.
  Deseguido imos expo\u00f1er toda a informaci\u00f3n, oral e escrita, que atopamos,
  destes catro elementos patrimoniais.\\n\\nPonte\\n\\nPouco se pode dicir desta pontella
  de Bendim\u00f3n, (Foto 2) porque a s\u00faa orixe se perde no tempo en non se atopou
  ning\u00fan documento que nos dea pistas sobre a s\u00faa construci\u00f3n. Pola
  s\u00faa sinxela estrutura p\u00e9nssase que pudo erguerse hai moitos anos. Postos
  en contacto con varios expertos na materia, coinciden en afirmar que o que chegou
  \u00f3s nosos d\u00edas constru\u00eduse no s\u00e9culo XVIII, pero que probablemente
  est\u00e1 asentada sobre outra anterior.\\n\\nA\u00ednda que non est\u00e1 catalogada
  como elemento patrimonial que hai que protexer, como se atopa a menos de 50 metros
  da fonte, que si o est\u00e1, p\u00f3dese considerar que est\u00e1 dentro do seu
  contorno de protecci\u00f3n.\\n\\nFonte\\n\\nA fonte que existe preto da ponte de
  Bendim\u00f3n (Foto 3) \u00e9 o \u00fanico dos catro elementos patrimoniais mencionados
  que est\u00e1 inclu\u00eddo no inventario da Direcci\u00f3n Xeral do Patrimonio
  Cultural da Xunta, e polo tanto goza da protecci\u00f3n que lle outorga. No PXOM
  do Concello de Outes tam\u00e9n est\u00e1 protexido coa clave de identificaci\u00f3n
  CP-15. Non conta con ningunha inscrici\u00f3n que nos axude a data-la s\u00faa construci\u00f3n.
  De vello atop\u00e1base situada m\u00e1is abaixo, cara \u00f3 r\u00edo, pero coa
  actuaci\u00f3n de acondicionamento e asfaltado da pista contigua, por onde discorr\u00eda
  o Cami\u00f1o Real, elevouse e p\u00faxose enriba dunha soleira de formig\u00f3n.
  Na actualidade non d\u00e1 servizo coa auga do manancial orixinal.\\n\\n1. O Cami\u00f1o
  de Santiago cruza esta ponte e dirixe os peregrinos cara \u00e1 s\u00faa seguinte
  parada: Portomar\u00edn. Cons\u00e9rvanse tres arcos da \u00e9poca medieval e est\u00e1
  situado sobre o r\u00edo Celeiro. Foi constru\u00eddo con lousa, ag\u00e1s os arcos
  que son de cantar\u00eda de granito.\\n\\n2. O pont\u00e1deo foi un imposto indirecto,
  pertencente \u00e1 coroa. Igrexa ou a alg\u00fan nobre, que se aboou durante s\u00e9culos
  para poder pasar algunhas pontes. Foi suprimido en 1881.\\n\\n3. Nalgunha fonte
  aparece como r\u00edo de Bendim\u00f3n, pero segundo por onde pase ch\u00e1mase
  dunha maneira distinta. Parece m\u00e1is axeitado chamarlle r\u00edo ou regato Roo,
  xa que atravesa unha boa parte desta parroquia.\\n\\nO sancosmeiro e as matriarcas
  do mar\\n\\nAchegarse \u00e1 historia da embarcaci\u00f3n sancosmeiro sup\u00f3n
  entrar de cheo nun dos episodios mais xenu\u00ednos da rica e extensa etnograf\u00eda
  mari\u00f1a galega. Esta embarcaci\u00f3n nace al\u00f3 entre a primeira e a segunda
  d\u00e9cada do s\u00e9culo XX e comparte o nome de sancosmeiro, en competencia,
  co famoso sombreiro de palla nacido na parroquia de Santo Ourense (concello de Outes).
  O sombreiro ainda ten na actualidade unha reco\u00f1ecida fama como produto artesanal
  e goza do reco\u00f1ecemento como s\u00edmbolo do bo facer da artesan\u00eda local.\\n\\nO
  sombreiro est\u00e1 vivo e presente como supervivente dunha \u00e9poca e dun saber
  facer. Na actualidade, est\u00e1 integrado como un producto con pleno sentido produtivo
  e comercial, mais non ocorre o mesmo co barco orixinario da parroquia de San Cosme,
  no concello de Outes e que, por proximidade co Freixo, gran santuario da construci\u00f3n
  naval en madeira da \u00e9poca, comparte con el a fama dos seus carpinteiros de
  ribeira.\\n\\nCon respecto \u00f3 sombreiro, orixinario da parroquia de Santo Ourense,
  un pensa en que... por que se co\u00f1ece como sancosmeiro? E resultoume verdadeiramente
  curiosa a resposta que me deron: contan que unha manchea de anos atr\u00e1s houbou
  unha exposici\u00f3n nos Estados Unidos da Am\u00e9rica e apareceu por ali o susodito
  sombreiro. O comisario da mostra, que era de produtos artes\u00e1ns, indagou pola
  orixe de tan peculiar obxecto, pois chamoulle moito a atenci\u00f3n a s\u00faa t\u00e9cnica
  de elaboraci\u00f3n. Algun informou de que se trataba dun sombreiro feito na Galiza,
  no concello de Outes, e de que se co\u00f1ec\u00eda co nome de sancosmeiro. Resulta
  evidente que esta resposta non respond\u00eda \u00e1 orixe de tan marabillosa obxecto,
  sen\u00f3n \u00f3 nome con que se co\u00f1ec\u00eda o dito obxecto. Esta denominaci\u00f3n
  respond\u00eda \u00f3 feito de que se vend\u00edan motos para a parroquia de San
  Cosme e de que as s\u00faas mulleres o luc\u00edan con estilo garbo; polo que puiden
  comprobar, non existe hoxe en d\u00eda debate sobre a cuesti\u00f3n da s\u00faa
  orixe.\\n\\nO barco sancosmeiro nace como resposta a unha necesidade concreta nun
  momento hist\u00f3rico determinado e nun contexto social de precariedade extrema.
  Nestas circunstancias este barco supuxo a creaci\u00f3n de proxectos persoais emancipadores,
  en especial no caso das mulleres, xa que era moi com\u00fan que a compa\u00f1\u00eda
  de transporte mari\u00f1o de produtos da horta e outras mercador\u00edas a conformasen
  o matrimonio traballando en conxunto, onde o papel da muller era vital, pasando
  de traballala horta para consumo propio e subsistencia a considerala como negocio
  produtivo e comercial. As\u00ed \u00e9 como nolo conta Adoraci\u00f3n Blanco Rama,
  filla de Xos\u00e9, patr\u00f3n do sancosmeiro Le\u00f3n: que ela, xa ben novi\u00f1a,
  empezou no barco do seu pai a transportar todo o tipo de produtos con que se pod\u00eda
  comerciar, incluindo animais, e \u00edan \u00e1 feira de Noia, \u00f3s xoves e domingos;
  \u00e1 de Esteiro, \u00f3s martes e venres; \u00e1 de Muros, \u00f3s venres. Adoraci\u00f3n
  chegou a patronear o Le\u00f3n en moitas ocasi\u00f3ns e garda na memoria mil e
  unha an\u00e9cdotas daqueles tempos heroicos en que sa\u00edan a navegar ainda que
  as condici\u00f3ns do vento e do mar non fosen as axeitadas, pero era neses d\u00edas
  precisamente cando se pod\u00eda facer mellor negocio.\\n\\nAdoraci\u00f3n ti\u00f1a
  dez t\u00edos, dos cales oito eran patr\u00f3ns e propietarios de sancosmeiros,
  e mesmo se lembra dalgunz dos nomes dos barcos: Umar\u00eda, Moderio, Manuel, Modesto,
  Vamos Indo, Dos Hermanos, e tam\u00e9n de moitos armadores: Lelo de Montes, Modesto
  Blanco, Xaquin de Montes, Ignacio de Alveida, Manuel Rama (o Requeno), Evaristo
  Rama, o Lumbeiro, Ch\u00e9 da Lumbeira etc. A maior\u00eda deles formaban t\u00e1ndem
  coas s\u00faas mulleres, conformando unha econom\u00eda local a pequena escala que
  trouxo prosperidade \u00e1 aldea e que adiv\u00ednamos na faciana de Adoraci\u00f3n
  cando nos fala daqueles anos e do rol de mulleres como Teresa de Higino, Mar\u00eda
  de Nimo ou Dominga da Paxara, aut\u00e9nticas matriarcas que, pola s\u00faa experiencia
  e sabedor\u00eda, eran consideradas polo grupo familiar e pola comunidade como unha
  autoridade para respeitar.\\n\\nO carpinteiro de ribeira foi sinalado historicamente
  polo nobre irmandamento co armador e co mari\u00f1eiro, cos cales, m\u00e1is que
  facer negocio, practicaba unha pol\u00edtica de asesoramento e orientaci\u00f3n:
  non nos resulta dif\u00edcil imaxina-lo mestre carpinteiro de ribeira escoitando
  a problem\u00e1tica das mulleres de San Cosme para vender e idear un medio de transporte
  mari\u00f1o eficaz e que solucionase os problemas de transporte por terra que case
  fac\u00eda invi\u00e1bel o negocio dos produtos das f\u00e9rtiles hortas de San
  Cosme, dada a s\u00faa situaci\u00f3n xeogr\u00e1fica, afastada dos mercados por
  terra, pero pre\u00f1ito deles por mar.\\n\\nNon co\u00f1\u00e9cemo-lo carpinteiro
  de ribeira creador desta tipolox\u00eda, pero si sabemos que foi ali, na parroquia
  de San Cosme, na zona do Riqueixo e na Bujalleira onde se constru\u00edran; nese
  contorno da costa hab\u00eda moitos estaleiros, onde mestres carpinteiros de ribeira
  como Manolo Garc\u00eda, o Rulo, Tom\u00e1s de Guiribaia e outros, andaban atop\u00e1ndose
  en constru\u00edr-los m\u00e1is rudos e potentes sancosmeiros.\\n\\nOs sancosmeiros
  tiveron tam\u00e9n como botes de carga un papel relevante na construci\u00f3n do
  dique de Noia e da presa de Barr\u00edo da Maza, transportando cemento e distintos
  materiais. Inicialmente propuls\u00e1base a remo e a vela, pero chegaron a montar
  motores AYON que se fabricaban na propia vila de Noia. Tam\u00e9n se dedicou \u00f3
  marisqueo ata finais da d\u00e9cada dos anos setenta, cando se inicia o declive
  e pr\u00e1cticamente a desaparici\u00f3n desta tipolox\u00eda, substitu\u00edda
  por outros barcos m\u00e1is eficientes para a motorizaci\u00f3n.\\n\\nO sancosmeiro
  \u00e9 un claro exemplo de simbiose entre o mar e a terra, entre o territorio e
  as xentes, que transformou a subsistencia en progreso econ\u00f3mico e social, e
  forma parte destacada do patrimonio mari\u00f1o flotante galego, co cal estaremos
  en d\u00e9beda mentres non vexamos de novo unha r\u00e9plica do Le\u00f3n navegando
  pola r\u00eda, patroneado por Adoraci\u00f3n.\\n\\nSantiago-Forcarei (52 Km)\\n\\nO
  pasado 4 de maio protagonizamos un episodio m\u00e1is do que vimos denominando \u201crutas
  alternativas\u201d; neste caso arrancamos dende Santiago, punto de sa\u00edda das
  nosas \u00faltimas andainas, e acabamos no concello de Forcarei, en terras pontevedresas.\\n\\nForcarei,
  concello da comarca de Tabeir\u00f3s, Terra de Montes. O de \u201cmontes\u201d \u00e9
  ver\u00eddico, pois as nosas pernas s\u00e1beno de sobra: longas estradas comarcais
  asaltadas con aglomerada cor clara, sen un siti\u00f1o de sombra, coma terras de
  Castela. Pero, iso si, de chan case nada. Picouso para arriba, que por moito que
  andabas non se daba acabado aquela li\u00f1a no espazo\u2026 case infinita. Supo\u00f1o
  que as altas temperaturas tam\u00e9n ter\u00edan parte de culpa nesas sensaci\u00f3ns
  de asfixia temporal transitoria onde descansca a boina.\\n\\nDe primeiro hai que
  dicir que sa\u00edmos da capital arredor das 7:15 da ma\u00f1\u00e1, con paso firme,
  cara a un destino algo incerto (m\u00e1is de un pensabamos... que hai en Forcarei??,
  haber\u00e1 alg\u00fan monumento sacro??, unha capela de renome??... que sei eu!!;
  pois non, hai unha recta de sentido \u00fanico con locais de oferta-demanda variada
  a ambos lados da estrada principal e pouco m\u00e1is; queda visto en dez minutos).\\n\\nEn
  fin, nesta viaxe o quinteto ia composto por Manu Mart\u00ednez, Lolo Prol, a parella
  de Hermi e Marco, ademais do que vos relata. Os mesmos de sempre con gana de que
  volvan incorporarse m\u00e1is de un que en etapas anteriores nos fac\u00edan m\u00e1is
  amenos os quil\u00f3metros: Pelucas, Xo\u00e1n Am\u00e9rico. Esper\u00e1molos!\\n\\nEnfiamos
  cara aos Tilos, coa vista posta na Estrada como fin dunha primeira parte do percorrido,
  mais ainda quedaba moito que roer. Puxemos pernas ao cami\u00f1o, como dixen, arredor
  das 7:15 no Outeiro do Casti\u00f1eiri\u00f1o rumbo a Uceira, seguindo en paralelo
  o rego de Santa Luc\u00eda ata a ponte que cruza a autoestrada Santiago-Ourense.
  Seguindo a v\u00eda de servizo da mesma acabamos no rego Saramo, obrig\u00e1ndonos
  a seguir por Teo, e enlazando de novo a estrada Santiago-Ourense en Lestedo, onde
  fixemos o primeiro alto para tomar un cafe\u00ed\u00f1o nun bar onde o xerente nos
  puxo o caf\u00e9 con non moi boa cara... Sa\u00edmos de novo \u00e1 ruta con vistas
  a Cimadevila, e, cruzando a estrada Pontevea-Ponte Ulla, o couto de Ximonde, onde
  est\u00e1n os vi\u00f1edos de Monteveiga (Mar de Frades). Chegamos ao rego Ulla
  \u00e1 altura da estaci\u00f3n ictiol\u00f3xica e cruz\u00e1molo pola ponte de Ximonde.\\n\\nXa
  en Pontevedra seguimos a car\u00f3n do r\u00edo deixa a ponde de Sarand\u00f3n,
  onde comezou a parte m\u00e1is civilizada da expedici\u00f3n, roendo a maior\u00eda
  das veces pistas asfaltadas. Pasamos por Vilar, Barbude e Moreira. En Ponteli\u00f1ares,
  no cruce que une A Estrada con Chapa, collemos o pan e comemos un pincho de empanada
  de bacallau -con espi\u00f1as e algo salgado para o noso gusto-.\\n\\nSeguimos pola
  Cruxa, O Vilar, San Xurxo e paramos en Quint\u00e1s, nunha pequena carballeira onde
  repuxemos forzas. Logo, na peor horri\u00f1a do d\u00eda, retomamos o cami\u00f1o,
  e as pernas, debido \u00e1s altas temperaturas, xa empezaban a sentirse algo doentes
  e expectantes, pois as peores costas estaban por vir. Subir e subir esas esgotantes
  li\u00f1as de asfalto croara, sen unha misera sombra onde agochar a cabeza, a paisaxe
  parec\u00eda Castela, pero costa arriba... arriba!! Pouco a pouco fomos pasando
  lugares como O Moucho, Fragoso, A Pena, cruzando o alto de Marco Afrende, a uns
  600 m de altitude. Por \u00faltimo baixamos por Meav\u00eda, O Cruceiro e Rozados
  antes de chegar ao noso destino: Forcarei.\\n\\nArredor das 6:45, ou sexa once horas
  dende que sa\u00edramos \u00e1 ma\u00f1anci\u00f1a. De seguido uns poucos exercicios
  de estiramento, e como case sempre conclu\u00edmos tomando unhas cervexas e dispensando
  algunha que outra an\u00e9cdota da viaxe, dando por conclu\u00eddo un episodio m\u00e1is
  do noso andar.\\n\\nEntrevista a...\\n\\nSanti Nieto\\n\\nSantiago Nieto naceu no
  Cruceiro (Santo Ourense) en 1965. Estudou primaria no colexio da Serra, bacharelato
  en Noia e, despois, Filosof\u00eda e Ciencias da Educaci\u00f3n na Universidade
  de Santiago. No ano 2006 mediante un concurso-oposici\u00f3n libre converteuse ent\u00e9cnico
  dinamizador xuvenil e cultural do Concello de Outes, praza que actualmente segue
  ocupando.\\n\\nC\u00f3ntanos como foron os teus inicios no mundo da cultura.\\n\u00d3
  remata-la carreira constitu\u00edmos Anuska Mari\u00f1o, Mar\u00eda V\u00e1zquez,
  e mais eu, que era o presidente, unha asociaci\u00f3n xuvenil e cultural chamada
  Colectivo do Lecer, que ofrec\u00eda \u00f3s concellos da comarca programas de actividade
  sociocultural: reciclaxe de papel, teatro, medioambiente... destinados a diferentes
  colectivos (infantil/xuvenil, mocidade, maiores, mestres/as etc.).\\n\\nAlgunha
  outra experiencia?\\nTam\u00e9n creamos un taller de reciclaxe de papel na Cepa
  (Santo Ourense), chamado D\u2019Papel, no cal elaborabamos carpetas, \u00e1lbums,
  cadernos, convites de vodas, cartas para restaurantes... e que comercializ\u00e1bamos
  por toda a Galiza en tendas de artesan\u00eda.\\n\\nE o teu primeiro traballo como
  t\u00e9cnico de cultura?\\nXurd\u00edme en 1994, para o Concello de Vedra, impartindo
  cursos do Plan de formaci\u00f3n e inserci\u00f3n profesional da Xunta \u2013Plan
  FIP-, que estaba destinado a persoas maiores de 18 anos en paro e interesadas en
  entrar no \u00e1mbito da animaci\u00f3n sociocultural como unha canle para a inserci\u00f3n
  laboral.\\n\\nCando empezaches a traballar para o Concello de Outes?\\nEn 1995 o
  Concello convocou un concurso-oposici\u00f3n para unha praza para implementar educaci\u00f3n
  de persoas adultas, a cal me presentei e, tras ga\u00f1ala, contratouse para dar
  clases a maiores por t\u00f3dalas parroquias.\\n\\nE xa de imediato empezaches como
  t\u00e9cnico de cultura, ou non?\\nPois poder\u00edase dicir que s\u00ed, xa que
  me foron demandando m\u00e1is funci\u00f3ns e, durante varios anos, f\u00f3rmonme
  ampliando os contratos con novas competencias, entre elas a de informaci\u00f3n
  xuvenil. A nosa base de operaci\u00f3ns eran os baixos do centro social, no chamado
  centro xuvenil, onde xa me encargaron dentro das mi\u00f1as funci\u00f3ns actividades
  culturais dirixidas \u00e1 xente m\u00e1is nova, persoas adultas etc., xunto con
  outras de medioambiente, turismo...\\n\\nQue destacarias deses anos ali?\\nTraballabamos
  eu e alg\u00fans persoas que contrataban segundo as necesidades sen infraestrutura
  ningunha (sempr\u00e9 hab\u00eda que traer doutros sitios cadeiras, tarimas, aparatos
  de son...), organizando charlas para a xuventude sobre sa\u00eddas profesionais,
  Letras Galegas, actividades cos colexios, talleres sobre refugallo, campamentos
  f\u00f3ra do concello; tam\u00e9n fac\u00edamos con papel reciclado a sard\u00edna
  para o seu enterru, talleres de escritura, exposici\u00f3ns... Pero o que eu salientar\u00eda
  por riba do resto \u00e9 o Certame de Poes\u00eda Francisco A\u00f1\u00f3n o arranque
  do Outono Teatral.\\n\\nA casa da cultura xa foi outra cousa, non?\\nEfectivamente,
  dende o ano 2000, cando se inaugurou a casa da cultura, xa puidemos dispor de moitas
  e mellores instalaci\u00f3ns, escenario, butacas moi c\u00f3modas, sistema de son,
  espazos para as exposici\u00f3ns \u2013o dispor de salas espec\u00edficas facilita
  poder organizar mostras de maior peso e envergadura-, aula de inform\u00e1tica e
  incluso a biblioteca, que se trouxo para aqu\u00ed dende os baixos do Concello e,
  fundamentalmente, persoal permanente, co cal se pode xa afrontar unha programaci\u00f3n
  para todo o ano, que permite planificar mellor a actividade, organizar cursos e
  consolidar actividades como as das Letras Galegas, o Outono Teatral, o Certame de
  Poes\u00eda Francisco A\u00f1\u00f3n e incluso actividades e talleres polas parroquias.\\n\\nE
  d\u00e9ixanxe liberdade para dese\u00f1a-las actividades?\\nNeste sentido non me
  podo queixar, \u00e1inda que non t\u00f3dalas actividades que prop\u00f3no prosperan.
  Ten\u00edo que dicir que sobre todo o que levo adiante \u00e9 feito dende o meu
  criterio e apenas me limitan ou marcan directrices sobre o que ten\u00edo que facer
  ou dende que perspectiva ten\u00edo que afrontalo. Amais disto algo que valoro moi
  positivamente \u00e9 que, cada ano, vexamos incrementados pouco a pouco os nosos
  orzamentos.\\n\\nExplicanos cales desas actividades che dan m\u00e1is traballo.\\n\u00c9
  un traballo do cal gozo e desfruto, vai isto por diante, pero se ten\u00edo que
  nomear alg\u00fans sen d\u00fabida o Outono Teatral e a organizaci\u00f3n do Francisco
  A\u00f1\u00f3n de Poes\u00eda. O primeiro porque implica ver antes t\u00f3dalas
  obras que se van representar, moitas delas obriganme a desprazamentos ou a visionar
  gravacions sempre fora do meu horario laboral que non sempre resultan \u00fatiles,
  pois a mi\u00fado hai que descartar pezas inadequadas por incomprensibles, faltas
  de ritmo ou mal representadas e ese \u00e9 un traballo tedioso. Amais disto que
  xa tes que ir preparando \u00f3 longo do ano, temos logo un prazo moi limitado para
  solicitalas, xa que n\u00f3s, de momento, s\u00f3 pedimos a trav\u00e9s da Rede
  Cultural da Deputaci\u00f3n da Coru\u00f1a, o que obriga a que te\u00f1as que ter
  todo xa preparado para cando abra que che dea tempo a solicita-lo que queres. Ten\u00edo
  que programar atendendo t\u00f3dalas idades, o que implica que hai que afinar muito
  etc.\\n\\nCo do Francisco A\u00f1\u00f3n de Poes\u00eda, pois todo tramado sup\u00f3n
  contactar co xurado; as lecturas das obras; argalla-las d\u00faas edici\u00f3ns;
  a compilatoria e a separata da persoa ga\u00f1adora de maiores de 18, as probas
  de imprenta; prepara-lo acto do D\u00eda das Letras... Todo a ritmo fren\u00e9tico
  para ter todo listo ese 17 de maio.\\n\\nSon as m\u00e1is laboriosas pero tam\u00e9n
  as que nos fornecen de moita enerx\u00eda para seguirmos adiante. Outras que arrancaron
  hai pouco e que tam\u00e9n te\u00f1en o seu son o campo de traballo internacional,
  a xeira das familias ou os concertos de ver\u00e1n na Horta do Mu\u00ed\u00f1o.
  No tocante \u00f3 teatro, creo que se deber\u00eda cobrar pola entrada.\\n\\nPor
  que cres que se deber\u00eda cobra-la entrada \u00f3 teatro?\\nEstou moi orgulloso
  co \u00e9xito de p\u00fablico e mais de conseguir que se ampliara a temporda teatral
  de setembro \u00f3 Nadal, con algunha fin de semana incluso, s\u00e1bado e domingo,
  con programaci\u00f3n. Pero deber\u00edase cobrar, ainda que fose un prezo simb\u00f3lico
  de 2 ou 3 \u20ac. O primeiro \u00e9 porque v\u00e9n moita xente de f\u00f3ra: de
  sitios onde non hai apenas teatro, ou de sitios onde te\u00f1en que pagar 6 ou 9
  \u20ac ou incluso 12 \u20ac, ou m\u00e1is, e aqu\u00ed te\u00f1eno gratis, co que
  iso sup\u00f3n de completa-la cabida en cada sesi\u00f3n, o que implica que moita
  xente de Outes te\u00f1a que quedar f\u00f3ra por falta de sitio, co conseguimento
  enfado co persoal da casa da cultura, que ten que cumprir estritamente co que marca
  a lei sobre os cabementos en espect\u00e1culos p\u00fablicos. En segundo lugar,
  porque a xente valorar\u00eda m\u00e1is o teatro e n\u00f3s non ter\u00edamos que
  estar en cada sesi\u00f3n chamando a atenci\u00f3n \u00e1s persoas a quien non lle
  interesa a obra e que se po\u00f1en a falar entre elas ou polo m\u00f3bil etc.\\n\\nCap\u00edtulo
  \u00e1 parte \u00e9 o dos campamentos urbanos. C\u00e1ntanos algo.\\nEstes campamentos
  de ver\u00e1n inici\u00e1ronse hai m\u00e1is de 20 anos para nenos e nenas desde
  infantil ata 16 anos durante os 15 d\u00edas previos \u00e1s festas do Santiago\u00f1o
  en horario de ma\u00f1\u00e1 e tarde. Nos \u00faltimos anos atendemos unha media
  que est\u00e1 por debaixo das 200 rapazas e rapaces, pero \u00f3 principio apunt\u00e1banse
  m\u00e1is de 300, xa que apenas hab\u00eda competencia en toda a zona.\\n\\nDebido
  \u00f3 descenso da natalidade, \u00e9 de supo\u00f1er.\\nEu creo que inciden varios
  factores. Hai maior oferta, concellos en que non hab\u00eda propostas deste tipo
  comezaron a implementala. Os horarios, \u00f3 meu xeito de ver, non se axustan \u00f3
  que deber\u00eda se-la conciliaci\u00f3n familiar e laboral. Deber\u00edamos atender
  mellor as necesidades dos pais e nais que te\u00f1en que traballar e non poden trae-los
  nenos ou nenas \u00e1 hora en que n\u00f3s as recibimos; \u00f3 meu xeito de ver,
  deber\u00edase elimina-lo horario de tarde, pois moitas familias levan os/as fillos/as
  \u00e1 praia e xa non os traen aqu\u00ed, e pola contra ampl\u00eda-lo horario de
  ma\u00f1\u00e1, cun servizo que permitisea pais e nais concilia-lo seu horario laboral,
  servizo de madruga e ampl\u00eda-los d\u00edas de campamento: m\u00e1is d\u00edas,
  durante t\u00f3dalas ma\u00f1\u00e1s do mes de xullo, por exemplo.\\n\\nQue outras
  cousas cres que deber\u00edan cambiar?\\nBoto moito de menos unha interacci\u00f3n
  m\u00e1is fluida entre os centros de ensino e a casa da cultura. Parece-me que,
  de establecer unha relaci\u00f3n de colaboraci\u00f3n entre os dous \u00e1mbitos,
  crear\u00edamos unha cidadan\u00eda m\u00e1is comprometida e implicada co seu medio
  e os servizos p\u00fablicos. Gustaria-me que esa relaci\u00f3n entre o ensino e
  o centro sociocultural se estendese m\u00e1is al\u00e1 do horario lectivo; que o
  alumnado soubese que servizos ten \u00f3 seu dispor e que os empregase, participando
  as\u00ed na vida social da colectividade. Creo que a colaboraci\u00f3n deber\u00eda
  ser permanente e intensa, para que as novas xeraci\u00f3ns se interesasen pola cultura
  e, sobre todo, polos servizos p\u00fablicos.\\n\\nPor \u00faltimo, ademais de dese\u00f1ar
  e desenvolver unha intensa actividade cultural, tam\u00e9n escribes, verdade?\\nUn
  pouco si, pero para mim. Publicado non te\u00f1o moito. Varias colaboraci\u00f3ns
  coa vosa revista, co Anuario da gaita da Deputaci\u00f3n de Ourense, a Motora de
  Esteiro e a participaci\u00f3n nun libro sobre A\u00f1\u00f3n xunto con Pilar Sampredo
  e Ram\u00f3n Blanco, dirixido primordialmente \u00f3 mundo escolar, titulado Francisco
  A\u00f1\u00f3n. Aproximaci\u00f3n did\u00e1ctica, editado por Toxosoutos en 2005,
  as\u00ed como a elaboraci\u00f3n da Gu\u00eda da exposici\u00f3n sobre Francisco
  A\u00f1\u00f3n do Concello de Outes en 2004; ou o itinerario literario Polas Terras
  de A\u00f1\u00f3n, que argallamos conxuntamente os tres.\\n\\nTam\u00e9n te\u00f1o
  publicado un relato no libro Relatos para Noia da editorial Toxosoutos, ou unha
  minigu\u00eda do concello de Outes, en 2017, titulada Outes esencial, a modo de
  itinerario tur\u00edstico co m\u00e1is salient\u00e1bel do concello, para unha visita
  de dous d\u00edas pola nosa contorna.\\n\\nCERTAME DE POES\u00cdA FRANCISCO A\u00d1\u00d3N\\nO
  Certame de Poes\u00eda Francisco A\u00f1\u00f3n para n\u00f3s \u00e9 un dos m\u00e1is
  logrados \u00e9xitos do concello de Outes. F\u00e1lanos dos seus inicios.\\nO Certame
  de Poes\u00eda Francisco A\u00f1\u00f3n botou a andar no ano 1997 como unha canle
  dinamizadora que dese pulo a todas aquelas persoas con inquedanzas na poes\u00eda.
  Tin\u00e1mos un autor senlleiro e era o arranque perfecto para reivindic\u00e1-la
  s\u00faa figura e, a trav\u00e9s dela, promove-los novos talentos. Unificar tradici\u00f3n
  coa modernidade e os tempos actuais penso que \u00e9 fundamental para non perde-la
  perspectiva. Nos seus comezos este concurso centrou o seu \u00e1mbito de actuaci\u00f3n
  en escolares do municipio outense, pero tam\u00e9n quer\u00edamos que a comarca
  toda o sentise como seu, e por ese motivo tam\u00e9n intentamos, na medida do posible,
  ir tocando as persoas m\u00e1is pr\u00f3ximas \u00e1 nosa contorna para motiv\u00e1-las
  a participar como xurado do Francisco A\u00f1\u00f3n. As\u00ed foi como fomos tirando
  dos equipos de normalizaci\u00f3n ling\u00fc\u00edstica dos centros escolares que
  formaban parte do premio Leixapr\u00e9n, alg\u00fans membros do profesorado dos
  institutos da educaci\u00f3n secundaria ebacharelato m\u00e1is pr\u00f3ximos a Outes
  ou \u00e1vidos lectores. Por citar alg\u00fans nomes: Xos\u00e9 Agrelo, Pilar Sampredo,
  David P\u00e9rez Iglesias, Valentina Formoso, Carme Martelo, Carlos Mosteiro, Ram\u00f3n
  Blanco, Teresa Seara.\\n\\nQue cousas foron cambiando?\\nXa nos demos conta, despois
  do lanzamento da primeira edici\u00f3n, de que era preciso abrirse \u00e1 comunidade
  galega sen excepci\u00f3n. E as\u00ed foi como se aceptaron traballos escritos en
  lingua galega como \u00fanica condici\u00f3n e dende aquela foi afianz\u00e1ndose
  edici\u00f3n a edici\u00f3n.\\n\\nPor outra parte, pouco a pouco f\u00f3rmonse puindo
  as bases, intentando facelas o m\u00e1is equitativas posible para t\u00f3dalas persoas
  concursantes, acoutando e unificando as categor\u00edas por idades, xuntando as
  que nos \u00edan parecendo m\u00e1is axeitadas \u00e1 hora dunha valoraci\u00f3n
  m\u00e1is ecu\u00e1nime entre as persoas participantes. E as\u00ed se foi desenrando
  un certame \u00fanico, dentro do panorama dos concursos de poes\u00eda galega, que
  recolle participantes dun amplo abano: escolares dende os seis anos, ata maiores
  sen l\u00edmite de idade.\\n\\nDa mesma maneira, \u00f3 constituir un premio de
  \u00e1mbito galego, tivemos que incorporar \u00f3s xurados un maior n\u00famero
  de xente experta diferente, que nos poida dar unha valoraci\u00f3n o m\u00e1is certeira
  posible para premiar as melloras persoas concursantes de cada unha das categor\u00edas.
  Ese \u00e9 o reto ano tras ano, por iso tam\u00e9n a n\u00f3mina de persoas que
  xa formaron parte do xurado nestas 23 edici\u00f3ns leva peso espec\u00edfico dabondo,
  como \u00e9 o caso de Helena Villar, Marta Dacosta, Lupe G\u00f3mez, Yolanda Caama\u00f1o,
  Paco Souto, Pilar Pallar\u00e9s, Marica Campo, Mercedes Queixas, Leticia Costas,
  Ana Romani, Susana S\u00e1nchez Arins, Mart\u00edn Veiga ou Mar\u00eda Reim\u00f3ndez,
  o cal lle confire un peso especial \u00f3 certame.\\n\\nE o certame converteuse
  nun referente da poes\u00eda galega, non cres?\\nAs persoas galardoadas nas diferentes
  edici\u00f3ns f\u00e1mnos sentir orgullo da creaci\u00f3n deste premio que, en principio,
  naceu como plataforma de lanzamento das novas e novos poetas, e est\u00e1lamo logrando
  \u00e1 vista dos resultados que imos obtendo trasas diferentes edici\u00f3ns do
  Francisco A\u00f1\u00f3n. Por citar alg\u00fans nomes, temos entre a n\u00f3mina
  de persoas galardoadas Emma Pedreira, Rosa Enr\u00edquez, Eli R\u00edos, Lara Dopazo,
  Olalla Tu\u00f1as ou Ismael Ramos, entre outras persoas. Algunxs deles comezaron
  no Francisco A\u00f1\u00f3n a abrirse portas no mundo da literatura galega actual
  e hoxe son un referente dentro da literatura galega contempor\u00e1nea.\\n\\nO ADN
  no Centro Social de Outes\\n\\nNo pasado 23 de maio do 2019, clausur\u00e1mo-las
  XIII Xornadas de Informaci\u00f3n Sociosanitaria de Outes. A conferencia-coloquio
  realizouna o Dr. Anxo Carracedo \u00c1lvarez (catedr\u00e1tico de Medicina Legal
  da USC) e levaba por t\u00edtulo \u201cMedidas personalizadas dende a xen\u00f3mica
  e as s\u00faas aplicaci\u00f3ns\u201d. As sorpresas comenzaron cando o profesor
  Carracedo fixo ADN en vivo e en directo: un amorado batido co batedor, Fairy, alcol
  e unha copa estreita. Tod@s asombrad@s, puidemos ver uns f\u00edos que o profesor
  confirmou que eran o ADN do amorado\u2026\\n\\nE cal \u00e9 o ADN das xornadas?
  Lev\u00e1molas realizando en Outes desde hai 24 anos, e vai pola conferencia n\u00famero
  104. A resposta est\u00e1 na xente que acode a este evento e tam\u00e9n en dar \u00e1
  cidadan\u00eda a posibilidade de co\u00f1ecer enfermidades e procesos que nas consultas
  ordinarias de atenci\u00f3n primaria \u00e9 imposible realizar, pola falta de tempo
  e a masificaci\u00f3n das consultas.\\n\\nAs\u00ed llo dixemos \u00f3 xerente da
  Atenci\u00f3n Primaria da \u00c1rea Sanitaria de Compostela, Dr. Felipe Calle (que
  veu a clausura do ciclo): que tal e como est\u00e1 nestes momentos a atenci\u00f3n
  primaria na Galiza, onde a masificaci\u00f3n de pacientes nas consultas \u00e9 evidente,
  onde non se po\u00f1en @s substitut@s que correspondieran e @s compa\u00f1eir@s
  te\u00f1en que face-lo seu traballo e o d@s que faltan, onde as listas de agarda
  para ser visit@ pol@ especialista son excesivas e cada persoa que o vive ben o sabe,
  t\u00e9mo-la posibilidade, no \u00faltimo xoves de mes, nos 8 meses do curso escolar,
  de ter unha persoa pr\u00f3xima, que pode, sen pres\u00e1s, explicarlle lo tema
  do que falamos en cada conferencia-coloquio. Isto \u00faltimo d\u00e1 p\u00e9 a
  que a xente poida interpela-lo relator ou relatora sobre o que considere, e as\u00ed
  poder profundar en temas que, como o do ADN e a xen\u00f3mica, son dif\u00edciles
  de explicar nunha consulta ordinaria de atenci\u00f3n primaria.\\n\\nA xen\u00f3mica
  \u00e9 un campo interdisciplinario da ciencia dentro do campo da biolox\u00eda molecular.
  Un xenoma \u00e9 un conxunto completo de ADN dentro dunha soa c\u00e9lula dun organismo,
  e como tal, a xen\u00f3mica enf\u00f3case na estrutura, funci\u00f3n, evoluci\u00f3n
  e mapa dos xenomas. As principais li\u00f1as de investigaci\u00f3n comprenden a
  xen\u00e9tica forense, poboacional e evolutiva, e a xen\u00e9tica de enfermidades
  complexas, as\u00ed como a mellora continua das tecnolox\u00edas e metodolox\u00edas
  na elaboraci\u00f3n de novos f\u00e1rmacos.\\n\\nQueremos agradecer \u00f3 Concello
  de Outes, \u00f3 centro social, \u00f3 centro de sa\u00fade, a ADISBISMUR (que realiza
  de forma artes\u00e1 unha \u201cPonte do Ruso\u201d, s\u00edmbolo das xornadas e
  que se lle d\u00e1 a cada persoa relatora), \u00e1 Xerencia da Xesti\u00f3n Integrada
  de Compostela e \u00e1 Sociedade Galega de Xerontoxoxia e Xeriatr\u00eda, que colaboran
  con n\u00f3s nesta aventura apaixonante, que permite acerca-los especialistas e
  as especialistas en diferentes materias \u00e1 cidadan\u00eda. Queremos agradecer
  tam\u00e9n a presenza das candidatas \u00e1 alcald\u00eda de Outes (Beatriz Molinos
  e M.\u00aa Xos\u00e9 Suarez: PP e BNG) que nos acompa\u00f1aron na clausura, pois,
  como sabedes, o Concello participa na organizaci\u00f3n deste evento.\\n\\nAs xornadas
  comezaron en 25 de outubro co \u201cUso racional dos medicamentos\u201d, conferencia
  en que nos falou Irene Zarra, xefa do servizo de farmacia do CHUS. Que te\u00f1amos
  co\u00f1ecemento de como usa-los f\u00e1rmacos, as s\u00faas pautas de uso, o tempo
  que temos que utilizalos, os seus efectos secundarios, contraindicaci\u00f3ns, como
  tomalos ou p\u00f3nelos etc \u00e9 algo que parece que todos sabemos, pero sobre
  o cal, cando nos toca ter que facelo, temos d\u00favidas. A inauguraci\u00f3n foi
  por parte de Bego\u00f1a Cobas, subdirectora de procesos sen ingresos da EOXI de
  Compostela e persoa moi vinculada a Outes.\\n\\nNo d\u00eda 29 de novembro, a Dra.
  Luisa Lores, radi\u00f3loga do Hospital de Pontevedra, falou de \u201cOs estudios
  radiol\u00f3xicos e o seu efecto na sa\u00fade\u201d: pensamos que face-las radiograf\u00edas
  que precisamos \u00e9 inocuo e a relatora dixonos que debemos facelas, pero con
  moito cuidado, pois a radiaci\u00f3n a que nos vemos expostos aumenta de forma exponencial
  con cada nova radiograf\u00eda, o que a longo prazo pode ser prejudicial para as
  persoas.\\n\\nNo d\u00eda 13 de decembro falamos coa responsable de sanidade do
  grupo de En Marea no Parlamento galego, Eva Solla, quen falou de \u201cA enfermar\u00eda\\n\\ncomo
  fonte de sa\u00fade\u201d. Sacamos en conclusi\u00f3n que os profesionais do sistema
  sanitario son todos imprescind\u00edbeis. En todos existen problemas parecidos relacionados
  co exceso de traballo pola falta de substituci\u00f3ns, pero realiza-lo traballo
  con profesionalidade \u00e9 a mellor garant\u00eda de calidade.\\n\\nComez\u00e1molo
  ano 2019 e no d\u00eda 31 de xaneiro falamos de \u201cEnfermidades urol\u00f3xicas\u201d:
  o relator foi o Dr. Dios Diz, m\u00e9dico de Outes desde hai 32 anos, quen falou
  das enfermidades urol\u00f3xicas predominantes, tanto en homes coma en mulleres:
  prostatite, incontinencia urinaria, cistite, c\u00e1ncro de pr\u00f3stata etc. Aproveitamos
  este d\u00eda, en que comenmorab\u00e1mo-la conferencia n\u00famero 100, para estar
  coa xente que acode habitualmente \u00e1s charlas, cuns petiscos na cafetar\u00eda
  do centro social.\\n\\nNo d\u00eda 28 de febreiro de 2019, tivemos unha das conferencias
  m\u00e1is valentes que levamos realizado: \u201cEutanasia e o dereito a morrer dignamente\u201d.
  Foi impartida por Miguel Vieito, especialista en dereito sanitario e membro do Comit\u00e9
  de \u00c9tica da \u00c1rea Sanitaria de Compostela. Se a conferencia foi interesante
  e instrutiva, o coloquio posterior foi\u00f1o m\u00e1is. As preguntas que se suscitaron
  co tema de Ram\u00f3n Sampedro e outros casos relacionados lev\u00e1ronnos a ocupar
  m\u00e1is tempo ca a propia conferencia.\\n\\nNo d\u00eda 28 de marzo, falamos de
  algo que segue sendo a materia pendente do estado do benestar: \u2018Lei de dependencia
  na Galiza\u2019. Realizouna Marta Cape\u00e1ns, traballadora social, quen nos veu
  dicir que o que estaba chamado a se-lo 4\u00ba piar do estado do benestar, despois
  da sanidade, a educaci\u00f3n e as pensi\u00f3ns, est\u00e1 falto de financiaci\u00f3n
  e est\u00e1n sen cumprir case ningunha das expectativas que estaban postas nesta
  lei, por parte de moitas familias que ven como a Administraci\u00f3n non cumpre
  o que por lei deber\u00eda cumprir.\\n\\nOutro tema tremendamente importante e por
  desgraza de actualida de t\u00f3dolos d\u00edas, foi o da \u201cViolencia de X\u00e9nero\u201d,
  tema que se tratou no d\u00eda 11 de abril por parte da Dra. Carmen Varela, especialista
  de urxencias do CHUS. Se se dedicase m\u00e1is dixef\u00edo para os plans de actuaci\u00f3n
  neste campo, outra ser\u00eda a historia dun tema que ten inquieta toda unha sociedade.
  Os recursos, a educaci\u00f3n sanitaria e as campa\u00f1as de divulgaci\u00f3n que
  se poidan realizar sempre son poucas para evitar un tema de m\u00e1xima prioridade
  e dramatismo.\\n\\nE no d\u00eda 23 de maio de 2019 foi cando V\u00cdMO-LO ADN EN
  VIVO E EN DIRECTO no centro social de Outes. O profesor Carracedo, futuro Premio
  Nobel de Medicina, disertou sobre un tema moi complexo, pero que con el ata parec\u00eda
  accesible a calquera de n\u00f3s. As aplicaci\u00f3ns da xen\u00f3mica na medicina
  forense, nas enfermidades raras e na elaboraci\u00f3n de novos medicamentos foron
  entendidas de forma clara grazas \u00f3 bo facer e explicar do Dr. Anxo Carracedo.\\n\\nA
  clausura das xornadas realiz\u00e1rona a alcaldesa sa\u00ednte de Outes e o xerente
  da Atenci\u00f3n Primaria da \u00c1rea Sanitaria de Compostela. As s\u00faas palabras
  foron de agradecemento e de compromiso coas xornadas.\\n\\n...E xa estamos preparando
  as XIV Xornadas de Informaci\u00f3n Sociosanitaria de Outes. Temos relator@s, temos
  t\u00edtulos de conferencias e t\u00e9mo-las ganas coma o primeiro d\u00eda de seguir
  nunha aventura (\u00fanica en toda Galiza e probablemente no Estado espa\u00f1ol)
  que, esperemos, dure moitos anos m\u00e1is.\\n\\nAnimamos a t\u00f3dolos colaboradores
  e colaboradoras e asistentes \u00e1s charlas a seguir participando nelas e a mante-la
  mesma ilusi\u00f3n que temos quen as realizamos. Ata outubro de 2019.\\n\\nDr. Felipe
  Calle, Beatriz Molinos, Dr. Jos\u00e9 Dios, Dr. Anxo Carracedo e Dr. Jos\u00e9 M.
  Gaci\u00f1o na clausura das Xornadas.\\n\\nPor unha manchea de votos!!\\n\\nBen,
  ao final pasou... No concello de Outes, despois dunha panchada de anos con goberno
  de dereitas, e alcaldes/desa de m\u00e1is que dubidosa ideolox\u00eda de dereitas...
  pasou. A xente, os outenses parece ser que lle perderon o medo ao cambio, mais o
  resultado final non \u00e9 o que a priori se rumoreaba nos mentideiros orais de
  taberna e celtas curtos... M\u00e1is de un xa se v\u00eda co bast\u00f3n de mando
  e na cadeira de brazos de casti\u00f1eiro; amod\u00ed\u00f1o \u00f3ro, que non \u00e9
  as\u00ed como acabou a pel\u00edcula, que non es tan bo como te cres (est\u00e1
  ben pero ollo, que xogan m\u00e1is ca ti nesta ruleta da fortuna).\\n\\nO do PSOE,
  que saiu de entre as silvas, como quen non quere a cousa, tarde mal e arrastro,
  coma se levasse toda a s\u00faa vida en pol\u00edtica, que o co\u00f1ecen na s\u00faa
  casa de milagre e pouco m\u00e1is. A ansia de querer probar, que sei eu... Ideario
  que te\u00f1en os do PP, grupito de joyitas que pensaban que se \u00edan xubilar
  no posto, pero a realidade \u00e9 ben distinta e agora toca desacomodarse... Que
  carallo!... se tan listos sodes non teredes problemas, pois as amizades son para
  algo... Que hai que pagar moitos favores... supo\u00f1emos!! Pois a cobralos.\\n\\nO
  BNG, pois tam\u00e9n, por unha vez que te\u00f1en un candidato e fan campa\u00f1a,
  sairon ben parados e recompensados; baixo o traballo est\u00e1 todo... e subindo!
  Sempre dende a humildade...\\n\\nE que dicir de CxG. Eles tam\u00e9n sab\u00edan
  que a subida que tiveron nas \u00faltimas votaci\u00f3ns non era un ascenso real
  de por si, pois ao carecer dalgo novo por parte do BNG, os votos correron para eles,
  mais eran votos prestados... E ainda con todo chegaron aos cinco concelleiros, que
  est\u00e1 moi ben, cunha manchea de votos m\u00e1is ca o PP (eses que ti\u00f1an
  a maquinaria, o partido etc.) e, con iso, tendo a opci\u00f3n de gobernar en solitario
  e con pactos puntuais (como eles din) cos outros grupos de esquerdas... Pois vale!
  Ah... unha rese\u00f1a: ollo coas formas! As formas, eses pequenos detall\u00ed\u00f1os...\\n\\nA
  candidata do PP dixo que lle sorprendera a derrota, que ti\u00f1a m\u00e1is que
  claro que la arrasar... Tanta confianza, sacada de non sei onde, pasou factura e
  deixou a m\u00e1is de un coa boca aberta. E agora que?? Pois agora as car\u00ednhas
  dos que pensaban seguir chupando do bote, seguir\u00e1n chupando do bote. Ou para
  que est\u00e1n os chiringuitos, ch\u00e1mense neste caso Deputaci\u00f3ns, pois
  para seguir coa mesma tem\u00e1tica, cobrar dietas por aqu\u00ed, quil\u00f3metros
  por ali, boas n\u00f3minas e todo entre colegas, e punto pelota. Ou para que estamos
  neste mundillo cada vez m\u00e1is clientelista, sendo un pouco fino, chamado pol\u00edtica.
  Eh?? Ir por ir tonter\u00eda!!\\n\\nCon todo isto entra de paso nese mesmo ritual
  xente nova con gana de facer algo bo e distinto. Pois adiante. Mais, iso s\u00ed,
  antes de cr\u00edticalos con criterio, hai que deixalos que fagan cousas, que marquen
  a diferenza coas pol\u00edticas que houbo ata o de agora, e despois xa falaremos.
  Pero primeiro deixar traballar e estar pendentes de se cambia algo, se hai iniciativa
  nesas pequenas cousas que o cidad\u00e1n ve se a cousa cambiou ou \u00e9 a mesma
  lada\u00edna, \u00e9 dicir, o mesmo can con distintio colar! Actitude e capacidade
  de primeiras parece que te\u00f1en de sobra os novos concelleiros de goberno, para
  variar. Mais tempo ao tempo, pois o que sexa de rese\u00f1ar, para ben ou para mal,
  nestas li\u00f1as salir\u00e1 sen a menor d\u00fabida, alto e claro. It\u2019s ok?
  It\u2019s clear!!\\n\\nLusco e Fusco\\n\\nAS\u00cd NON ...\\n\\nSilveirais no centro
  urbano!! Remanente dun goberno caduco.\\n\\nAS\u00cd TAMPOUCO ...\\n\\nUnha vista
  do estado de conservaci\u00f3n do parque da Cruz. Todo a bravo!! Outro remanente.\\n\\nNIN
  DE CO\u00d1A...\\n\\nNa antiga hormigonera de Espi\u00f1eiro: neveras, carcasas
  de tv., rodas, cables, pl\u00e1sticos....un vertedoiro en toda regla, lindando co
  mar. M\u00e1is remanente.\\n\\nDo cambio clim\u00e1tico \u00e1 emergencia clim\u00e1tica\\n\\nAlba
  Calo Blanco\\n\\nFast-Fashion, moda r\u00e1pida.\\n\\nXa dende pequenos estudamos
  na escola que \u00e9 o cambio clim\u00e1tico, que o provoca e cales son as s\u00faas
  consecuencias. Todos o\u00edmos falar do quemento global e da subida das temperaturas,
  da escaseza de auga, do derretemento dos polos e do aumento do nivel do mar, da
  desaparici\u00f3n de certas especies etc. Pero hoxe en d\u00eda \u00e9 moi optimista
  seguir nome\u00e1ndoo \u201ccambio\u201d cando o que estamos vivindo \u00e9 un estado
  de emergencia clim\u00e1tica.\\n\\nAs novas xeraci\u00f3ns xa non sabemos o que
  \u00e9 o tempo est\u00e1bel, s\u00f3anos a chin\u00e9s iso que nos contan nosos
  av\u00f3s de que antes, durante todo o inverno, \u00eda un fr\u00edo extremo e non
  paraba de chover, e que no ver\u00e1n, xa dende xu\u00f1o, sa\u00eda o sol e sub\u00edan
  as temperaturas. Os l\u00edmites entre estaci\u00f3ns son cada vez m\u00e1is difusos.\\n\\nActualmente
  a temperatura do planeta alcanzou unha subida de 1\u00baC. No Acordo de Par\u00eds,
  realizado en 2015, establece\u00edase que o l\u00edmite que tentar\u00edamos acadar
  ser\u00eda de 2\u00baC. O obxectivo actual \u00e9 parar esta subida en 1,5\u00baC.
  Son numeros\u00edsimos os beneficios de mante-la temperatura do planeta medio grao
  m\u00e1is fr\u00edo. S\u00f3 quedan 11 anos ata 2030 para cambia-los nosos h\u00e1bitos,
  as regulaci\u00f3ns das industrias e as pol\u00edticas dos pa\u00edses, ou xa ser\u00e1
  demasiado tarde. En 2030 deber\u00edamos ser capaces de utilizar-la metade de combust\u00edbeis
  f\u00f3siles que queimamos hoxe en d\u00eda, e hai estudos que demostran que para
  2050 poder\u00eda ser pos\u00edbel un mundo cun 100% de enerx\u00edas renov\u00e1beis.\\n\\nXa
  non \u00e9 suficiente s\u00f3 con que reciclemos, pech\u00e9molo a billa da auga
  cando estamos lavando os dentes ou nos duchemos en lugar de ba\u00f1arnos. Fixemos
  oidos xordos do problema e agora ten unha soluci\u00f3n que necesita de m\u00e1is
  esforzo. A cuesti\u00f3n hoxe en d\u00eda \u00e9 producir-la m\u00ednima cantidade
  de residuos pos\u00edbeis por persoa. O movemento zerowaste busca substitu\u00edr
  por completo a inmensa cantidade de pl\u00e1sticos que usamos d\u00eda a d\u00eda
  por alternativas s\u00ednxelas que nun primeiro momento non se nos ocorrer\u00edan,
  porque non queren que nos fixemos nelas, pero que est\u00e1n a\u00ed. Algunxs exemplos
  son substitu\u00edr-las pallas de pl\u00e1stico para tomar bebidas por unhas de
  metal, comprar a granel e reutilizar bolsas de tea, comprar cepillos de dentes de
  bamb\u00fa, non utilizar vaixelas dun s\u00f3 uso, e nese caso utilizar pratos ou
  vasos de papel, investir nunha botella de aceiro reutiliz\u00e1bel, cambia-los tamp\u00f3ns
  por unha copa menstrual etc.\\n\\nReduci-las viaxes en avi\u00f3ns e apostar polos
  trens sempre que sexa pos\u00edbel, votar en partidos pol\u00edticos en cuxos programas
  este apartado sexa un punto esencial e ben desenvolvido, compartir esta informaci\u00f3n
  coas t\u00faas amizades e familiares, manifestarte e apoia-las enerx\u00edas renov\u00e1beis
  son outras maneiras de contribu\u00edr.\\n\\nDebemos apoiar empresas que o estean
  facendo ben, apostando por enerx\u00edas limpas e polos dereitos humanos, e non
  axudar a sosteir outras que te\u00f1en o poder do cambio nas s\u00faas mans pero
  que non fan nada. Aqu\u00ed o poder t\u00e9molo os consumidores, ainda que \u00e1s
  veces non sexamos conscientes. Invitovos a investigar sobre o que \u00e9 a fastfashion,
  como repercute no planeta e na vida das persoas e o poder que empresas como Inditex
  te\u00f1en para frear isto, pero non cambian para seguir ingresando a mesma cantidade
  de mill\u00f3ns que non lle servir\u00e1n de nada se acabamos co planeta, o \u00fanico
  que temos.\\n\\nOs mozos e mozas xogamos un papel moi importante neste asunto, que
  \u00e9 importante para todos e que deber\u00eda estar presente cada d\u00eda nas
  nosas vidas. Temos voz e voto, debemos facer chegar isto \u00e1s outras xeraci\u00f3ns
  e ser conscientes do problema, esforz\u00e1ndonos por mellorar-los nosos h\u00e1bitos
  e por repercutir nas pol\u00edticas e na mentalidade das grandes empresas e industrias.
  Exemplos coma Greta Thunberg, sueca de 16 anos que chegou a dar un discurso na XIV
  Conferencia sobre o Cambio Clim\u00e1tico das Naci\u00f3ns Unidas, demostran que
  as novas xeraci\u00f3ns son claves neste proceso de coidalo-lo planeta. Non quedes
  parado. Fai todo o pos\u00edbel por un cambio real. Non o deixes para ma\u00f1\u00e1
  porque che dea preguiza, estamos a falar de algo tan serio coma o planeta en que
  vivimos. Sen planeta ning\u00fan dos teus problemas coti\u00e1ns ou das t\u00faas
  aspiraci\u00f3ns a longo prazo ter\u00e1n xa importancia. Non hai segundas oportunidades,
  s\u00f3 temos unha Terra, e at\u00e9 agora non fomos m\u00e1is ca o seu peor inimigo,
  ameazando con destru\u00edla.\\n\\nD\u00faas brillantes atletas de Outes\\n\\nNo
  pasado s\u00e1bado 1 de xu\u00f1o, Sara Caama\u00f1o Caama\u00f1o (esquerda), do
  Club Atletismo Outes, quen no pr\u00f3ximo mes de agosto far\u00e1 nove anos, proclamouse
  campioa galega de lanzamento de peso na categor\u00eda benxam\u00edn nas pistas
  luguesas Gregorio P\u00e9rez Rivera, cunha marca de 7.93 m, facendo historia non
  s\u00f3 para o seu club, sen\u00f3n tam\u00e9n para Outes. Na mesma categor\u00eda,
  Marta Sieira Rama (dereita), tam\u00e9n de oito anos, conseguiu a 10.\u00aa posici\u00f3n
  \u00f3 lanza-lo peso a 6.02 m. Parab\u00e9ns para ambas.\\n\\nO f\u00fabol na R\u00eda
  de Muros e Noia. 1968-1971\\n\\nCoincidiendo coa segunda edici\u00f3n do 50\u00ba
  aniversario da Copa R\u00eda de Muros, a comisi\u00f3n decidiu darlle continuidade
  \u00f3s actos iniciados no pasado ano, en marzo do actual, seguindo, pero dun xeito
  rotativo e celebrando competici\u00f3ns nos distintos concellos cuxos equipos participaran
  naqueles eventos. Se o ano pasado lle tocou a Esteiro acolle-la celebraci\u00f3n
  deportiva conmemorativa da primeira edici\u00f3n, nesta a comisi\u00f3n encargada
  dispuxo que sexa Outes o que acolla a segunda celebraci\u00f3n. C\u00f3ntase coa
  aceptaci\u00f3n da SRCD Esteirana e da xunta directiva do Outes, e esperamos que
  o terceiro equipo sexa o de Lira, que fora o campi\u00f3n da segunda edici\u00f3n
  no ano 1969. C\u00f3ntase tam\u00e9n co afecemento xeneroso do presidente da Real
  Federaci\u00f3n Galega de F\u00fatbol e coa asistencia das autoridades locais, cos
  xogadores xa veteran\u00edsimos que participaron nela e con todas aquelas persoas
  afecionadas que nos queiran acompa\u00f1ar no campo do Cunchido, a finais de agosto
  ou primeira semana de setembro. No seu momento darase publicidade \u00f3s actos
  coa colocaci\u00f3n de carteis anunciadores por t\u00f3dolos concellos, e xa vos
  anticip\u00e1moo-las grazas pola vosa m\u00e1is ca segura asistencia.\\n\\nNovas
  do mar\\n\\nXes\u00fas Mato\\n\\nNesta primeira metade do ano as actividades m\u00e1is
  salient\u00e1beis realizadas pola Terra de Outes relacionadas co mar foron as seguintes:\\n\\nNavegaci\u00f3n
  en Muros con discapacitad@s visuais dentro do programa \u201cSenti-lo mar\u201d:
  en realidade, foi a culminaci\u00f3n deste programa que xa fixeramos no inverno
  en moi malas condici\u00f3ns climatol\u00f3xicas, que non permitiron sa\u00edr a
  navegar; neste d\u00eda de primeiros de maio tivemos m\u00e1is sorte, e foi unha
  xornada moi interesante para @s nos@s patr\u00f3ns polas especiais caracter\u00edsticas
  deste colectivo. Participaron coma na anterior ocasi\u00f3n t\u00f3dalas asociaci\u00f3ns
  mari\u00f1eiras da r\u00eda.\\n\\nColaboraci\u00f3n na rodaxe da pel\u00edcula El
  Santa Isabel. A produtora da pel\u00edcula precisaba unha embarcaci\u00f3n que puidese
  facer de bote salvavidas do buque e rodar alg\u00fansas escenas do naufraxio que
  se relata; a nosa nova buceta Donas asumiu este papel. Na praia de Cabanas, un d\u00eda
  fr\u00edo e chuvisco de abril, con ventos racheados do noroeste, dous patr\u00f3ns
  da Terra de Outes, vestidos de \u00e9poca, consegu\u00e9n, non sen esforzo, cumprir
  con t\u00f3dalas esixencias do intr\u00e9pido gui\u00f3n.\\n\\nNavegaci\u00f3n con
  escolares. Por fin este ano logramos levar a termo un proxecto que ti\u00f1amos
  de vello: dar a co\u00f1ecer \u00e1 xente nova o patrimonio mar\u00edtimo e a navegaci\u00f3n
  de vela como actividade de lecer. Na segunda metade do mes de maio, e coa colaboraci\u00f3n
  do Centro N\u00e1utico Municipal Francisco Rama \u201cFuf\u00fa\u201d, fixemos d\u00faas
  xornadas de navegaci\u00f3n: a primeira, co alumnado de 3.\u00ba da ESO do IES Poeta
  A\u00f1\u00f3n, no cal o Departamento de Educaci\u00f3n F\u00edsica recoll\u00eda
  na s\u00faa programaci\u00f3n anual unhas xornadas de navegaci\u00f3n de vela en
  embarcaci\u00f3ns tradicionais, polo cal contactou coa nosa asociaci\u00f3n; e a
  segunda, en que tam\u00e9n participou o Centro N\u00e1utico de Portos\u00edn, co
  alumnado de 1.\u00ba da ESO do IES Praia de Barra\u00f1a, de Boiro, dentro da actividade
  \u201cXogando co mar e o vento\u201d, que organiza o Departamento de Educaci\u00f3n
  F\u00edsica deste centro. O entusiasmo amosado por estes navegantes m\u00faidos
  foi unha ledicia para os patr\u00f3ns. Esperamos darlle no futuro estabilidade a
  este tipo de colaboraci\u00f3n cos centros escolares da contorna, e implicar nestas
  actividades as outras asociaci\u00f3ns de Culturmar da r\u00eda.\\n\\nV Curso de
  Navegaci\u00f3n de Vela en Embarcaci\u00f3ns Tradicionais, coma nos anteriores,
  en colaboraci\u00f3n coa Asociaci\u00f3n Mar de Muros e o Centro N\u00e1utico Municipal.
  Como novidade este ano hab\u00eda unha embarcaci\u00f3n m\u00e1is: a buceta Donas,
  na cal os e as participantes fixeron pr\u00e1cticas no manexo do remo. Inscribir\u00edronse
  no curso m\u00e1is de 20 persoas e algunhas delas xa son agora parte do nosa asociaci\u00f3n.\\n\\nBos
  ventos que ultimamente ve\u00f1en de popa.\\n\\nDe Nixon e China a Boris e o Brexit:
  anotaci\u00f3ns\\n\\nNo mundo anglosax\u00f3n hai un proverbio contempor\u00e1neo
  e moi popular cando se fala de pol\u00edtica: traducido, v\u00e9n dicir que \u201cS\u00f3
  Nixon pod\u00eda viaxar \u00e1 China\u201d. Para aqueles m\u00e1is novos aos que
  o contexto lles poida resultar alleo, dir\u00edamos que Richard Nixon, que foi presidente
  Republicano dos Estados Unidos nos anos 70, foi o que, malia o seu furibundo anticomunismo,
  restableceu relaci\u00f3ns diplom\u00e1ticas coa China Comunista; tal reco\u00f1ecemento
  s\u00f3 pod\u00eda vir da man dun pol\u00edtico das s\u00faas caracter\u00edsticas,
  xa que un Dem\u00f3crata tentando o mesmo atopar\u00edase coa oposici\u00f3n radical
  e inamovible do outro partido, e con acusaci\u00f3ns de complicitude ideol\u00f3xica
  cos \u2018roxos\u2019. O proverbio sintetiza, pois, esa verdade universal de que
  medidas pol\u00edticas audaces e chocantes s\u00f3 as poden levar ao termo os seus
  aparentes detractores e opositores, nun exercicio de pragmatismo e interese de estado
  por riba das ideolox\u00edas e dos sectarismos.\\n\\nCollendo outro proverbio, dic\u00eda
  Marx (n''O 18 Brumario) que a Historia sempre se repite, primeiro como traxedia
  e logo como farsa. Tal parece ser o caso do Brexit, onde Boris Johnson, ben co\u00f1ecido
  como personaxe exc\u00e9ntrico e bufonesco onde os haxa (este curso ainda tiven
  oportunidade de ensinarlle aos meus alumnos o v\u00eddeo de cando ficou c\u00f3micamente
  pendurado dun aramio nun acto de cando era alcalde de Londres) e digno compa\u00f1eiro
  de Trump na escena internacional, parece destinado a converterse no seguinte Primeiro
  Ministro e no piloto do \u00e9xodo brit\u00e1nico da Uni\u00f3n Europea, que, se
  non hai grandes novidades, acontecer\u00e1 no seguinte Samain, data tam\u00e9n acaida
  para sacar aos monstros e pantasmas do armario. Un interesante artigo publicado
  recentemente na revista Pol\u00edtico define a situaci\u00f3n de xeito preciso:
  \u201cBoris \u00e9 o l\u00edder que Gran Breta\u00f1a merece: s\u00f3 un pallaso
  pode consumar o Brexit\u201d.\\n\\nNalg\u00fanha ocasi\u00f3n previa falamos algo
  da complexa causolox\u00eda que est\u00e1 detr\u00e1s da secesi\u00f3n dos ingleses
  do proxecto com\u00fan: nostalgias imperiais, mentalidade e cultura m\u00e1is mercantil,
  libre cambista e menos reguladora e unificadora que a continental (ver a UE como
  s\u00f3 un mercado com\u00fan, e nunca como un x\u00e9rmolo dos EEUU de Europa),
  profunda insatisfacci\u00f3n de amplos sectores das clases obreras medio-baixas
  coas consecuencias negativas da globalizaci\u00f3n e a perda de postos de traballo
  pouco cualificados, que se visualiza e culpabiliza doadamente nas burocrac\u00edas
  da UE e nos seus emigrantes \u00e1s illas. \u00c9 unha enfermidade que non s\u00f3
  lles afecta a eles: os problemas e estancamentos do vello continente est\u00e1n
  a xerar, como \u00e9 ben vis\u00edbel, unha vaga populista, maiormente conservadora,
  con \u00e9xitos de maior ou menor grao en case t\u00f3dolos estados da UE.\\n\\nCando
  a pol\u00edtica racional, se \u00e9 que alg\u00fana vez existiu, salta pola xanela,
  entran pola porta o narcisismo e o espect\u00e1culo, ou unha certa evoluci\u00f3n
  cara ao que os antigos gregos pensaban que era o destino final das democracias:
  a demagox\u00eda (Arist\u00f3teles) e a oclocracia (Polibio).\\n\\nAgora que o Reino
  Unido est\u00e1 a piques de coroar a Boris e de solicitarlle o imposible (que produza
  un Brexit no que poidan crer e co que estar satisfeitos os brit\u00e1nicos), rematemos
  cunha reflexi\u00f3n melanc\u00f3lica, coma a do Ricardo II de Shakespeare cando
  perde a coroa e se laixa en alto das s\u00faas desgrazas (\u201cLet''s talk of graves,
  of worms, of epitaphs\u201d), e que fai de coro \u00e1s dunha Inglaterra actual
  que est\u00e1 frustrada consigo mesma e o seu lugar no mundo, e que decide un tanto
  insensatamente dispararse no p\u00e9 e sa\u00edr nas peores condici\u00f3ns do bloque
  comercial m\u00e1is exitoso da historia moderna. Reflexionemos, porque como dic\u00edamos
  enriba, \u00e1s outras potencias europeas tam\u00e9n se lles aplica a mesma enfermidade
  e os mesmos s\u00edntomas \u2013agardemos que non as mesmas consecuencias\u2013.
  De te fabula narratur!\\n\\nAdeus a come-lo caldo\\n\\nNa reforma das normas oficiais
  da lingua galega do ano 2003 inclu\u00eduse unha novidade aparentemente irrelevante
  que, por\u00e9n, est\u00e1 a provocar a desaparici\u00f3n dunha caracter\u00edstica
  moi propia do noso idioma nas terras de Outes e en toda a Galiza: a chamada variante
  alom\u00f3rfica ou segunda forma do artigo (come-lo caldo, colleremo-lo bus...).
  Tanto antes coma despois de 2003, p\u00f3dese optar por escribir come-lo caldo ou
  comer o caldo. Pero nese ano eliminouse a recomendaci\u00f3n que se fac\u00eda antes
  a prol da forma con -LO/-LA e pasouse a recomendar non escribila. Incluso moita
  xente cre, equivocadamente, que a normativa oficial prohibe agora a s\u00faa escrita,
  e non \u00e9 pouca a que leva a desfeita ata escribir mesmo \u201cpor o\u201d, \u201cpor
  a (ignorando que pola/o, xunto con u/o/a, son os \u00fanicos supostos onde, antes
  e agora, a escrita da segunda forma \u00e9 obrigatoria \u2013os asteriscos marcan
  incorrecci\u00f3ns-)\u201d.\\n\\nEn todo caso, este detalle, un troco en principio
  incocente da recomendaci\u00f3n, levou a que a segunda forma do artigo fose eliminada
  da escrita pr\u00e1cticamente en todas partes: documentos oficiais, organismos p\u00fablicos
  e privados, libros de texto, medios de comunicaci\u00f3n; e mesmo caso que non se
  ensina na escola. O estudantado galego pode hoxe rematar o instituto sen co\u00f1ecela.\\n\\nMoita
  xente tenta xustificarlo alegando que usa-la forma con gui\u00f3n \u00e9 dif\u00edcil
  (ser\u00e1 que somos m\u00e1is torpes ca outros pobos cuixas linguas utilizan gui\u00f3ns
  continuamente?) e que, ademais, a outra forma (comer o caldo) facilita a aprendizaxe
  de neofalantes que venen, principalmente, do castel\u00e1n (sen comentarios). Con
  todo, que tales explicaci\u00f3ns resulten inacept\u00e1beis non quita para reco\u00f1ecermos
  que existen, si, incoherencias, mais precisamente polo contrario, xa que a regra
  de evita-lo gui\u00f3n n\u00e5\u00f1os casos da segunda forma do artigo (\u00e1mbalas,
  l\u00f3idos, trala, malo, pola\u2026) \u00e9 seguramente un erro que produce diverxencias
  innecesarias: ser\u00eda mellor, pois, unifica-lo criterio (amba-las, l\u00f3ido-s,
  tra-la-ma-lo\u2026, incluso po-la-e po-lo\u2026).\\n\\nO final, a situaci\u00f3n
  tras 2003 leva inevitavelmente \u00e1 extinci\u00f3n da forma m\u00e1is enxebre.
  Ainda que, paradoxalmente, a \u00fanica pronuncia recomendada segue a ser colle-lo
  bus, esta pronuncia estase a perder rapidamente a prol da que se corresponde coa
  que todo o mundo escribe agora (coller o bus).\\n\\nEfectivamente, a Academia Galega
  reconece, de xeito asaisado, que (a parte de supostos excepcionais de pausas na
  fala) a chamada segunda forma \u00e9 a forma propia que debemos pronunciar, mais,
  nun exercicio ins\u00f3lito de incoherencia manifesta, recomenda \u00f3 mesmo tempo
  non escribirla. \u00c9 o \u00fanico caso na normativa oficial en que haber\u00eda
  que ler e pronunciar unha letra (/) que non aparece escrita (adem\u00e1s de ignorar
  outra, o, ou, que si aparece). Por suposto, case ning\u00fan o fa: probamos a escotar,
  por exemplo, as locutoras e locutores da televisi\u00f3n ou da radio. E nas escolas,
  a maior\u00eda do profesorado pecha os ollos no que se refire \u00e1 fala: despois
  de ensinar a escribir dunha forma, ser\u00eda perde-lo tempo intentar que o alumnado
  pronuncie outra, pois, en todo o demais, a norma oficial base\u00e1se nunha lectura
  claramente fon\u00e9tica (non \u00e9 o caso do ingl\u00e9s ou do franc\u00e9s).\\n\\nPor
  suposto, non existe, nin pode existir, en ningunha lingua unha concordancia total
  entre a escrita e a fala, pero neste caso tr\u00e1tase dunha decisi\u00f3n arbitraria
  que provoca voluntariamente unha diverxencia que non li\u00f1a por que se producir
  e que \u00e9 absolutamente an\u00f3mala, como acabamos de indicar. Ademais, a segunda
  forma do artigo non \u00e9 realmente unha variaci\u00f3n fon\u00e9tica, unha maneira
  de pronunciar (como ocorre en muifo/moinho, parafa/pra, coa/ca e moitas m\u00e1is),
  sen\u00f3n unha oxinalidade morfol\u00f3xica, muito m\u00e1is importante polo tanto,
  e polo tanto moito m\u00e1is inxustificable a s\u00faa non representaci\u00f3n escrita.\\n\\nNa
  pr\u00e1ctica acaba\u00edse producindo unha castelanizaci\u00f3n m\u00e1is (unha
  soa forma coma no castel\u00e1n, o cal, lamentabelmente, propicia o seu \u00e9xito:
  son indicativas, como xa dixemos, as frecuentes loanzas \u00e1 recomendaci\u00f3n
  normativa por facer m\u00e1is doada a aprendizaxe das persoas castelanflantes),
  malia que a reforma de 2003 neste punto fose impulsada por grupos que presumen de
  loitar contra iso. Indutores tam\u00e9n, tales grupos, da substituci\u00f3n da contracci\u00f3n
  \u00f3 por ao, cunhas consecuencias semellantes: a pronuncia desa contracci\u00f3n
  debe ser sempre, di a normativa, \u00f3 (un o aberto), escriba como se escriba (\u00f3
  ou ao), mais cada vez m\u00e1is xente incl\u00fae abertamente na pronuncia o a,
  por velo as\u00ed escrito (ao).\\n\\nE na representaci\u00f3n escrita da segunda
  forma do artigo est\u00e1 hoxe o destino desta forma que nos acompa\u00f1ou sempre.
  Por riba doutros diversos factores que poden influir, no galego actual, se se escribe,
  conservarsea sen d\u00fabida (superando de paso t\u00f3dalas outras dificultades
  que se opo\u00f1en), e se non se escribe, desaparecer\u00e1 r\u00e1pida e inexorablemente
  (por moita suposta vontade que haxa de que non ocorra tal). E, de desaparecer, perder\u00edamos
  moito. A importancia da segunda forma \u00e9 quizais intanxiabel, mais moito maior
  do que di algunha xente (porque, talvez, nunca a usaron?). As persoas que nos desenvolvemos
  no \u201cbiling\u00fcismo\u201d (en realidade, diglosia) que nos define, sempre
  puidemos percibir, grazas especialmente \u00e1 segunda forma do artigo (e alguns
  outros fen\u00f3menos como o infinitivo conxugado ou o sistema vocalico), que no
  interior do galego hab\u00eda unha forte identidade propia e non era s\u00f3 unha
  sucesi\u00f3n de palabras que se pod\u00edan intercambiar mecanicamente (ben ou
  mal) polas correspondentes do castel\u00e1n.\\n\\n\u00c9 certo tam\u00e9n que a
  nosa lingua ten hoxe outros moitos problemas, mesmo de supervivencia, provocados,
  nos m\u00e1is dos casos, pola presi\u00f3n do castel\u00e1n e a indiferenza da propia
  xente galega. Mais o caso da segunda forma do artigo \u00e9 peculiar, \u00f3 se
  tratar dunha soluci\u00f3n oxinal do galego, \u00fanica dentro das linguas rom\u00e1nicas,
  e que por iso ainda m\u00e1is deber\u00edamos po\u00f1er en valor, ou polo menos
  non facilita-la s\u00faa desaparici\u00f3n como se fixo en 2003.\\n\\nMais precisamente,
  \u00e9 oxinal do galego-portugu\u00e9s medieval e contin\u00faa ata hoxe. Como demostra
  o Atlas ling\u00fc\u00edstico galego, contrariamente \u00f3 que algunha xente pretende
  alegar (e contrariamente tam\u00e9n \u00e1 chamada terceira forma que consistir\u00eda,
  simplificando moito a explicaci\u00f3n, en muda-lo-n velar final de palabra por
  un n alveolar: Son as mozas \u2013pronunciado \u201cSonas mozas\u201d\u2013), a
  segunda forma do artigo abrange pr\u00e1cticamente todo o territorio galego. A s\u00faa
  desaparici\u00f3n das zonas de Portugal onde ainda se usaba non hai moi (principalmente
  do norte, ou seja, do Portugal m\u00e1is galego) \u00e9 unha confirmaci\u00f3n emp\u00edrica
  do que aqu\u00ed estamos a expo\u00f1er: a s\u00faa ausencia na escrita provoca
  irremediablemente, nos tempos actuais en que a xente est\u00e1 alfabetizada, a s\u00faa
  extinci\u00f3n na fala.\\n\\nAdemais, resolver este problema depender\u00eda principalmente
  da vontade das persoas que te\u00f1en competencia na regulaci\u00f3n da s\u00faa
  escrita, polo cal resultar\u00eda moito m\u00e1is simxelo do que, desafortunadamente,
  ocorre na maior\u00eda dos outros estragos (incorrecta colocaci\u00f3n dos pronomes,
  tempos compostos con haber etc. etc.)...\\n\\nDe feito, a evoluci\u00f3n natural
  seguramente non levar\u00eda a que a segunda forma do artigo se extinguise, como
  non o fixo en s\u00e9culos. Polo tanto, podemos dicir que a desaparici\u00f3n desta
  forma xen\u00ednea e milenaria da Galiza non vai ser por morte natural, sen\u00f3n
  por execuci\u00f3n. E as persoas que asinaron a sentenza en 2003 son precisamente
  as responsables de defende-lo galego. Se mirasen de rectificar sen rompe-lo consenso
  acaddado\u201d pode que ainda cheg\u00e1semos a tempo de colleremo-lo bus, e de
  volvermos a come-lo caldo.\\n\\n1. \u00c9 unha forma do artigo, non unha maneira
  de pronunciado; en realidade, o artigo conservouse aqu\u00ed na s\u00faa forma primitiva
  (lo, la, l). Compar\u00e1bel, por exemplo, coas variaci\u00f3ns do pronome atono,
  cuesti\u00f3n igualmente morfol\u00f3xica, mais na cal, na cal, t\u00f3dalas normas
  obrigan \u00e1 s\u00faa representaci\u00f3n escrita (\u201cVou f\u00e1celo esta
  tarde\u201d; \u00e1 ningunha prop\u00f3n escribir \u201cVou f\u00e1celo o esta tarde\u201d).
  Parece que s\u00f3 acept\u00e1ron-as regras que se imponen aos falantes, e non \u00e1s
  formas que se pronuncian. E, por iso, a segunda forma do artigo \u00e9 m\u00e1is
  propiamente noso. Evidentemente, a comparaci\u00f3n exposta ten matices: \u00f3
  m\u00e1is estreita relaci\u00f3n do verbo co pronome atono co ao artigo, as\u00ed
  que na norma oficial se poder\u00eda xustificar que esta leve un gui\u00f3n separador
  (coller-lo bus) e aquela non (collelo).\\n\\n2. As\u00ed a todo, a luta (contra
  as exageraci\u00f3ns) dos grupos implicados mencionados chamados \u00e1s veces reintegracionistas
  de m\u00ednimos, non pode negarse moitos casos. Algun similar podemos dicir sobre
  as regras de pronunciaci\u00f3n (de moitos) exclu\u00eddos do consenso de 2003,
  os cales, m\u00e1is pendentes aqu\u00ed, polo que semella, do estatut portugu\u00e9s
  ca de protexeren unha forma propia, sempre se opuxeron, con moito \u00e9xito, a
  variados, a representaci\u00f3n na escrita a segunda forma do artigo. Parecen non
  querer ve que en realidade este fen\u00f3meno, mesmo na escrita, non \u00e9 unha
  regra, sen\u00f3n unha norma, e a unidade ling\u00fc\u00edstica que defenden: V\u00e1s
  cobh\u00e9-las flores? Si, v\u00f3s cobl\u00e9-las; a regra ser\u00eda universal
  e, como se ve no exemplo, coherente con esa ortograf\u00eda, semellante \u00e1 de
  pronunc (v. a nota anterior), ainda que no artigo s\u00f3 se usara, loxicamente,
  nos lugares onde tal fen\u00f3meno existe, ou sexa, na Galiza. As\u00ed que, miramos
  cara a onde van as reintegracionistas, oficilaiscas e medipontescas, o escenario
  para a segunda forma do artigo resulta desolador.\\n\\n3. Unha susxesti\u00f3n para
  renovalo consenso, ca estes entendemos que o galego xenerio sa\u00edra referido,
  seria a volver recomend\u00e1-la segunda forma escrita \u00f3 mesmo tempo que xeneraliza-los
  sufixos -z\u00f3n e similares (nazon, oroz\u00f3n...), reinvindicaci\u00f3n (reinvindicaci\u00f3n)
  hist\u00f3rica dos grupos mencionados na nota 2.\u00aa e doutra moita xente, que
  consideran que os actualmente oficiais (cisom...) son propios dun galego castelanizado.\\n\\nNENOS\\n\\nA
  sociedade que non sabe coida-los seus pequenos pouco pode agardar do futuro.\\n\\nEstou
  esperto.\\n\\nUnha r\u00faa estreita en penumbra. Xente dun lado para outro. Xente
  an\u00f3nima. Calada. Corpos famentos tirados no chan. Corpos de nenos cos ollos
  moi abertos. Ollar estupefacto. Nenos pedindo imposibles \u00e1 xente que pasa.
  Xente coa expresi\u00f3n ocupada no rostro baleirado\\n\\nUnha r\u00faa ancha con
  moita luz e escaparates luminosos. Xente dun lado para outro. Xente buliciosa que
  non olla. Nenos afastados cos ollos atentos no m\u00f3bil. Ollar febril. Nenos roubados.
  Noutros espazos e tempos que a xente reverencia apampada.\\n\\nEspertei, tristeiro.\\n\\nEloy
  Hervella\\n\\nAntonio Fraguas. Mestre da memoria. Malores Villanueva Gesteira Editorial
  Galaxia, 2019\\n\\nEste ano 2019 e con motivo da festa grande das letras galegas,
  a Real Academia Galega seleccionou a D.Antonio Fraguas Fraguas para ser homenaxeado
  o 17 de maio e enche-lo pa\u00eds de actividades que nos acercan \u00e1 figura deste
  autor.\\n\\nUnha boa maneira de co\u00f1ece-la vida e o legado de Fraguas \u00e9
  a lectura da biograf\u00eda deste polifac\u00e9tico mestre, historiador, xe\u00f3grafo,
  etn\u00f3grafo que \u201cmilita\u201d na defensa da cultura e pol\u00edtica galegas
  e que hoxe recolle esta secci\u00f3n de \u201cLecturas recomendadas\u201d.\\n\\nMalores
  Villanueva escolle para este libro un t\u00edtulo con d\u00faas palabras acertadas
  para nos adentrar no fundamental da vida de D.Antonio: Mestre e Memoria. A inquestion\u00e1bel
  entrega do homenaxeado \u00e1 docencia con m\u00e9todos innovadores (entend\u00eda
  o ensino como \u201caprender a aprender\u201d) as\u00ed como o seu legado a trav\u00e9s
  de ensaios, estudios, publicaci\u00f3ns e demais contribuci\u00f3ns intelectuais
  que ser\u00e1n a memoria etnogr\u00e1fica e cultural da Galiza.\\n\\nMestre da memoria
  \u00e9 a esencia na vida deste galeguista. Da man da autora da biograf\u00eda, e
  cun extenso traballo de investigaci\u00f3n referenciado no libro (cartas, conversas,
  documentaci\u00f3n en arquivos, bibliotecas e hemerotecas), imos percorrer-la vida
  de Fraguas de xeito cronol\u00f3xico que nos leva dende a infancia na s\u00faa Cotobade
  natal, pasa por Pontevedra, onde estuda o bacharelato, ata o final dos seus d\u00edas
  en Santiago (onde viviu e exerceu a maior parte da s\u00faa vida).\\n\\nNeste percorrido
  vital, D. Antonio exerce o maxisterio na Estrada e en Lugo, pero non s\u00f3 impartiu
  docencia, sen\u00f3n que ademais estivo sempre comprometido coa cultura galega e
  mesmo como activista pol\u00edtico, militando no Partido Galeguista e implic\u00e1ndose
  na defensa do Estatuto de Autonom\u00eda. A s\u00faa estad\u00eda como mestre na
  Estrada coincide co levantamento do ex\u00e9rcito fascista no 36. A ditadura truncou
  os so\u00f1os do mestre mozo, apart\u00e1ndoo da docencia. A autora do libro relata
  este episodio nun cap\u00edtulo titulado \u201cOs anos do horror\u201d, intenso
  e minucioso, e cun relato claro fainos part\u00edcipes daquell terror e inxustiza
  en que viv\u00edan Fraguas e outros galeguistas.\\n\\nCanto \u00e1 importancia do
  home impulsor da cultura galega, Malores Villanueva describ\u00e9nlo incans\u00e1bel
  labor cient\u00edfico de D.Antonio. Colabora e traballa nas Irmandades da Fala de
  Santiago, Seminario de Estudos Galegos, Instituto Padre Sarmiento, Padroado Rosal\u00eda
  de Castro, Museo do Pobo Galego, Consello da Cultura Galega...mesmo entra na Real
  Academia Galega ocupando o lugar que deja baleiro Castelao. A immensidade do traballo
  que leva a cabo Fraguas ten como obxectivo a recuperaci\u00f3n e proxecci\u00f3n
  da cultura galega, que \u00e9 unha constante na lectura desta biograf\u00eda.\\n\\nMalores
  Villanueva mostra, con esta biograf\u00eda de lectura moi amena, a viaxe por unha
  vida intensa e emocionante, a do profesor e investigador D. Antonio Fraguas Fraguas,
  para nos acercar tam\u00e9n a unha persoa de trato af\u00e1bel e xentil que tivo
  un novo reco\u00f1ecemento este ano 2019 como homenaxeado das Letras Galegas. Ler
  esta biograf\u00eda tam\u00e9n \u00e9 un acto que celebramos na honra deste home
  galego, bo e xeneroso.\\n\\nLidia Vicente\\n\\nPRANTO POR \u00cdCARO\\n\\nQuen chega
  a Consos polo cami\u00f1o que v\u00e9n de Sambade, bate primeiro coa casa do Ferreiro
  e se cadra estar el na porta ha convidalo a un vi\u00f1o, que o ten moi fresco e
  ledo.\\n\\nO Ferreiro ch\u00e1mase Renato, Renato Tour\u00f3n, dos Tour\u00f3n de
  Sarria. O Ferreiro, se as cuncas e a conversa se prolongan, halle ensina-la forxa.
  Enriba da zafra, unha peza ainda a medio mallar d\u00e9ixase comer lentamente pola
  ferruxe. Tentar\u00e1 un que non se note que olla outra vez as mans desfeitas do
  Ferreiro, e el, animado polo vi\u00f1o e a compa\u00f1\u00eda, seguir\u00e1 co relato
  da s\u00faa desgraza.\\n\\nChegara o Ferreiro a Consos \u00f3 chamamento do marqu\u00e9s
  porque ti\u00f1a a parroquia, que era toda del, falla de quen ama\u00f1ase as rellas,
  as aixadas, os fuc\u00ed\u00f1os. Caeulle en graz\u00e1 \u00f3 marqu\u00e9s, que
  tam\u00e9n era mozo novo, \u201csimp\u00e1tico joven propietario\u201d cham\u00e1balle
  o xornal da comarca, e m\u00e1is dunha botella balearon xuntos na casa da Monfortina,
  \u00e1 parte de ocuparse con algunha das pupilas. O Renato e o Mino, va\u00eda par.\\n\\nPero
  a promiscuidade social rematara coa chegada da Oriana \u00e1s s\u00faas vidas. A
  filla do americano nada quixo saber do marqu\u00e9s e acabou quedando co Ferreiro.
  O marqu\u00e9s non aceptou o convite \u00e1 voda e, no seguinte encontro dos dous
  amigos, saudou o Renato, que o marqu\u00e9s pretend\u00eda non ver:\\n\\n-Ola, Mino.\\n\\n-Don
  Maximino para ti.\\n\\nQuedou a\u00ed a cousa e a tensi\u00f3n pareceu minguar cando
  o marqu\u00e9s casou \u00e1 s\u00faa vez cunha dama da alta burgues\u00eda da Coru\u00f1a,
  sen t\u00edtulo, pero con moito capital.\\n\\nA casa da Oriana e o Renato era de
  fartura pero empec\u00eda a s\u00faa felicidade que a descendencia se malograse
  en sucesivos abortos. Cando por fin chegou o Ignacio, o m\u00e9dico sentenciou que
  non haber\u00eda m\u00e1is. Era abondo. O son do martelo mallando no ferro sum\u00e1base
  os choros e berros de alegr\u00eda do pequeno que no hab\u00eda m\u00e1is para onde
  ir.\\n\\nMedraba o Ignacio forte e intelixente. Cando puido empuxa-lo martelo, aprendeu
  decontado t\u00f3dolos saberes do oficio do pai. Se non estudaba ou axudaba na forxa
  ou na horta, compart\u00eda trasnadas cos outros cativos e cativas da aldea, entre
  quen se contaba a Xulia, a primox\u00e9nita de don Maximino. O marqu\u00e9s rosmaba,
  pero deixaba facer. Son rapaces, dic\u00eda. O tempo pasaba e os fillos dos antigos
  amigos fac\u00edanse insepar\u00e1beis ata o punto de que aquela relaci\u00f3n non
  pod\u00eda prosperar e hab\u00eda que coutala antes de que chegase a m\u00e1is.
  O Ignacio ir\u00eda estudar f\u00f3ra con recomendaci\u00f3ns do marqu\u00e9s e
  coa distancia esquecer\u00eda a Xulia. As\u00ed \u00f3 acordaron. Durante m\u00e1is
  dun ano estivo escribindo, pero as s\u00faas cartas nunca chegaron a mans da moza
  nin as dela a el, coidadosamente eliminadas polo terratenente. As visitas \u00e1
  aldea coincid\u00edan sempre con viaxes da Xulia \u00e1 casa dalg\u00fan parente.\\n\\nPara
  cando rematou os estudos de enxe\u00f1eiro, parec\u00eda que o Ignacio esquecera
  aquel amor xuvenil. Volveu \u00e1 aldea cheo de enerx\u00eda. Tra\u00eda ideas de
  modernidade e liberdade, de ter frecuentado o C\u00edrculo Obrero. Falaba de instalar
  unha turbina no regato para xerar electricidade coa cal traer motores \u00e1 forxa
  e iluminaci\u00f3n. Falaba de facer cooperativas para mellora-la produci\u00f3n
  e vender mellor as colleitas. Organizou un sindicato de xornaleiros que se reun\u00eda
  \u00e1s noites no almac\u00e9n da forxa, cedido con agrado polo Ferreiro. O marqu\u00e9s
  rosmaba. O cura botaba lume nos serm\u00f3ns.\\n\\nE o peor era que nin el esquecera
  a Xulia, nin a Xulia el. V\u00edanse \u00e1s agochadas e amabanse polos currunchos
  verdes se fac\u00eda bo ou no almac\u00e9n, resoante a revoluci\u00f3n social, cando
  non. Lev\u00e1banoo coa m\u00e1xima discreci\u00f3n, pero os seus encontros acabaron
  chegando a o\u00eddos do marqu\u00e9s. Convocou \u00f3 Ferreiro e este comprometeuse
  a tentar disuadi-lo fillo daquela relaci\u00f3n. Falar, falou con el, mais foi como
  pedir que o mar seque. O Renato comprendeu as raz\u00f3ns do Ignacio porque non
  esquec\u00eda cando o seu amor pola Oriana ainda non amansara. As\u00ed, non s\u00f3
  deixou de instalo a abandonar, sen\u00f3n que cubriu os seus encontros secretos.\\n\\nPor\u00e9n,
  non puideron gardar en segredo por moito m\u00e1is tempo o que xa se descubrira.
  E chegou a guerra; e coa guerra a impunidade, e coa impunidade a ocasi\u00f3n de
  vinganza que o marqu\u00e9s levaba case un cuarto de s\u00e9culo agardando. O Ignacio
  atrapar\u00f3no cando acud\u00eda a unha reuni\u00f3n clandestina co que quedaba
  do sindicato. Entre o marqu\u00e9s, un seu capataz e dous mat\u00f3ns que trouxera
  a prop\u00f3sito da vila, mallaron nel toda a noite para acabar peg\u00e1ndolle
  un tiro na cabeza antes de tiralo nun pozo do regato. Despois present\u00e1ronse
  na forxa e quebr\u00e1ronlle os dedos \u00f3 Renato un a un mentres lle contaban
  cada tortura do fillo. A Oriana fixolle as curas como pudo porque o marqu\u00e9s
  prohibira a ning\u00fan m\u00e9dico atendelo. Despois, foise apagando ata deixar
  en pouco tempo o Renato con toda a s\u00faa dor e a s\u00faa soledade.\\n\\nO Ferreiro
  pousar\u00e1 a man desfeita sobre a zafra e rematar\u00e1:\\n- Durante moitos anos,
  dic\u00edame \u201cPoidan estas mans forxa-lo coitelo que dea morte \u00f3 Mino\u201d;
  pero a forza nunca volveu e xa nunca volver\u00e1. Qu\u00e9dame o consolo de que
  a\u00ednda que casou a Xulia cun se\u00f1orito de mans brancas, o neto do marqu\u00e9s
  \u00e9 un Tour\u00f3n.\\n\\nQuen chega a Consos polo cami\u00f1o que v\u00e9n de
  Sambade, sair\u00e1 da casa do Ferreiro xa coa noite asomando os cornos por atr\u00e1s
  das \u00faltimas casas.\\n\\nHenrique \u00c1lvarez\\n\\nAs notas do estudante A\u00f1\u00f3n\\n\\nRam\u00f3n
  Blanco\\n\\nChegado o ver\u00e1n ve\u00f1en canda el as degoxadas vacaci\u00f3ns
  escolares, longas tardes de xogos e troula para os estudantes. Como calquera rapaz,
  o noso poeta sentiu a chamada da natureza \u00e1 hora de xogar, \u201cArgallando
  e brincando n\u2019a pradeira/ Como bravos cabritos montaraces\u201d (\u201cRecordos
  d\u2019a Infancia\u201d, vv. 104-105), e viviu alegres foliadas \u201c(...) n\u2019as
  noites d\u2019o bran \u00f3 libre vento\u201d (\u00eddem, v. 151). Mais o mesmo
  libre\u901a\u98ce estival fai voar, hoxe como daquela, as follas (xa non tan libres)
  dos boletins coas cualificaci\u00f3ns, a mi\u00fado tan temidas. Imos repasar (verbo
  maldito na xerga escolar) neste artigo as etapas estudantis de Francisco A\u00f1\u00f3n.\\n\\nA
  s\u00faa infancia transcorreu a car\u00f3n das bra\u00f1as de Boel, regadas polo
  Tins, no ambiente rural que ainda na actualidade nos \u00e9 algo familiar aos outenses,
  e que naquela altura malamente era perme\u00e1bel ao sistema educativo, tan pouco
  organizado. Ainda as\u00ed, a Igrexa tiu un papel fundamental ao longo do s\u00e9culo
  XIX, ocup\u00e1ndose da educaci\u00f3n nas sancrist\u00edas, nos mosteiros ou nos
  conventos. E este debeu ser o caso do Poeta A\u00f1\u00f3n; sendo como era afiliado
  do cura de San Pedro de Outes, Francisco Ossorio Le\u00f3n, non ser\u00eda estranho
  que fose este quen lle ensinase as primeiras letras, do mesmo xeito (e pod\u00e9molo
  afirmar con m\u00e1is seguridade) que ser\u00eda quen o encami\u00f1ase m\u00e1is
  tarde a estudar no seminario, que naquel tempo era o cauce natural para o ascenso
  social. Podemos imaxinar que lle aprender\u00eda nocions b\u00e1sicas das linguas
  espa\u00f1ola e cl\u00e1sicas, aritm\u00e9tica, doutrina cristi\u00e1... E a\u00ednda
  contamos con testemu\u00f1o epistolar, asinado polo propio poeta, onde reivindica
  como mestre outro cura: Domingo Mart\u00ednez. Non \u00e9 logo casual que os dous
  pertenzan ao clero. Inda que ben puidese ser que o primeiro educador fose un daqueles
  escolantes de ferrado (porque cobraban un ferrado dun produto agr\u00edcola por
  cada alumno ou alumna) que ensinaban nas aldeas, s\u00f3 no inverno, cando o traballo
  do campo era menor e a rapazada pod\u00eda asistir \u00e1s aulas, que en realidade
  eran cubertos, coc\u00ed\u00f1as etc.\\n\\nO conto \u00e9 que xa con dezasete anos
  ingresa, como \u201cpretendente pobre para beca\u201d, no Seminario Conciliar de
  Santiago en 1829 (o mesmo ano no que foi fundado polo arcebispo frei Rafael de V\u00e9lez,
  colaborador de sona coas partidas carlistas de Galiza). En 1828 xa presentara unha
  instancia dirixida ao reitor e ao claustro da Universidade de Santiago de Compostela
  solicitando unha bolsa para estudar no Colexio de San Xerome, aducindo os poucos
  recursos econ\u00f3micos dos pais (lembremos que, ainda que fosen campesi\u00f1os,
  ti\u00f1an unha boa consideraci\u00f3n social e, de por parte, eran compa\u00f1eiros
  dun sacerdote, polo que non debemos descartar que mediasse alg\u00fan tipo de recomendaci\u00f3n;
  de feito, cando pretenda a bolsa de 1829, quen certifica a suposta pobreza dos pais
  \u00e9 \u00absorpresa\u00bb: o propio cura). Mais ser\u00e1 no Seminario Conciliar
  (s\u00edtio por aquel tempo no antigo Colexio Maior de San Clemente) onde comece,
  xa algo grandeiro, a s\u00faa formaci\u00f3n regrada. Xosefina L\u00f3pez de Serantes
  (1986: p. 34) relatanos o que ti\u00f1an que mercar os estudantes cando entraban
  no Seminario: \u201cUn ba\u00fal con chave. Un tinteiro de metal de esta\u00f1o.
  Catro mudas brancas. D\u00faas chaquetas ou chupas e dous pares de calz\u00f3ns
  curtos, todo da cor negra. Catro pares de medias, tam\u00e9n negras. Dous pares
  de zapatos con bot\u00f3n. Tam\u00e9n a Gram\u00e1tica de Carrillo e Nebr\u00edja,
  a Filosof\u00eda de Guevara e a Summa Teol\u00f3xica de Santo Tom\u00e1s\u201d.
  Ali estuda tres cursos de Filosof\u00eda e cinco de Teolox\u00eda.\\n\\nAo concluir
  os cursos de Filosof\u00eda exam\u00ednase na universidade para obter o grao de
  bacharel. Cando remata os estudios de Teolox\u00eda vai comezar, en 1837, a carreira
  de Xurisprudencia na Universidade compostel\u00e1, grazas \u00e1 \u00edntima relaci\u00f3n
  que exist\u00eda daquela entre as universidades e os seminarios conciliares (de
  feito estes quedaban incorporadas a aquelas, en cada territorio correspondente,
  por unha Real Orde de 1824). Ti\u00f1a que completar oito cursos, mais o primeiro
  e o segundo ano conseguiu simultaneart doux, polo que xa obtivo os t\u00edtulos
  de bacharel en Leis e de licenciado en Xurisprudencia en outubro de 1843.\\n\\nQuen
  queira seguir con m\u00e1is rigor os pasos da formaci\u00f3n acad\u00e9mica deste
  escritor far\u00e1 mellor en acudir directamente \u00e1 tese doutoral de Fernando
  Bel Ortega (1991: pp. 41-54, 136-152), de onde n\u00f3s, cal aqueles \u201cvanadantes\u201d
  universitarios que fai figurar A\u00f1\u00f3n para distraeren a leiteira, copiamos
  o que nos conv\u00e9n. Ademais no Arquivo da Universidade de Santiago de Compostela
  e mais no Arquivo Hist\u00f3rico Diocesano poden consultarse a maior\u00eda das
  cualificaci\u00f3ns obtidas. En concreto, no expediente do Seminario as notas avaliativas
  \u201ctalento\u201d, \u201caplicaci\u00f3n\u201d e \u201cconducta\u201d van case
  sempre acompa\u00f1adas, respectivamente, das anotaci\u00f3ns \u201csuperior\u201d,
  \u201cmucha\u201d e \u201cbuenas\u201d. En quinto curso de Teolox\u00eda obtivo
  a cualificaci\u00f3n de sobresaliente. Est\u00e1n, polo tanto, pouco fundadas as
  impresi\u00f3n que pod\u00edamos ter de estarmos ante un seminarista discolo ou
  pouco aplicado. Outra cousa \u00e9 que o cami\u00f1o se torcese e pouco valesen
  as lecci\u00f3ns de Lit\u00farxica e Canto Chan para quen non quixo dedicarse ao
  ministerio dos altares.\"", "\"CVE: IZjz3CtmS2\\n\\nVerificaci\u00f3n: https://sede.xunta.gal/cve\\n\\nRESOLUCI\u00d3N
  da Direcci\u00f3n Xeral de Centros e Recursos Humanos pola que se adxudican de\ufb01ni!vamente
  os des!nos provisionais para o pr\u00f3ximo curso acad\u00e9mico 2021/2022 ao persoal
  docente pertencente ao corpo de catedr\u00e1!cos e profesores de ensino secundario,
  profesores t\u00e9cnicos de formaci\u00f3n profesional, catedr\u00e1!cos e  profesores  de  escolas  o\ufb01ciais  de  idiomas,  catedr\u00e1!cos  e  profesores  de  m\u00fasica  e  artes  esc\u00e9nicas,
  catedr\u00e1!cos e profesores e mestres de taller de artes pl\u00e1s!cas e dese\u00f1o
  que non te\u00f1an des!no de\ufb01ni!vo na Comunidade Aut\u00f3noma de Galicia,
  aos que resultan desprazados por falta de horario, ao persoal ao que se lle conceda
  unha comisi\u00f3n de servizos por concelleira ou concelleiro, por mo!vos de sa\u00fade
  ou por conciliaci\u00f3n da vida familiar e laboral, ao persoal interino e subs!tuto
  e ao persoal funcionario de carreira que solicite o reingreso no servizo ac!vo.\\n\\nMediante
  Resoluci\u00f3n do 16 de xu\u00f1o de 2021 (Diario O\ufb01cial de Galicia n.\u00ba
  121, do 28 de xu\u00f1o), convocouse o concurso de adxudicaci\u00f3n de des\\\"nos
  provisionais para o curso acad\u00e9mico 2021/2022 entre o persoal docente pertencente
  ao corpo de catedr\u00e1\\\"cos e profesores de ensino secundario, profesores t\u00e9cnicos
  de formaci\u00f3n profesional, catedr\u00e1\\\"cos e profesores de escolas o\ufb01ciais
  de idiomas, catedr\u00e1\\\"cos e profesores de m\u00fasica e artes esc\u00e9nicas,
  catedr\u00e1\\\"cos e profesores e mestres de taller de artes pl\u00e1s\\\"cas e
  dese\u00f1o que non te\u00f1an des\\\"no de\ufb01ni\\\"vo na Comunidade Aut\u00f3noma
  de Galicia, aos que resultan desprazados por falta de horario, ao persoal ao que
  se lle conceda unha comisi\u00f3n de servizos por concelleira ou concelleiro, por
  mo\\\"vos de sa\u00fade ou por conciliaci\u00f3n da vida familiar e laboral, ao
  persoal interino e subs\\\"tuto e ao persoal funcionario de carreira que solicite
  o reingreso no servizo ac\\\"vo\\n\\nCon base no disposto no punto oitavo da dita
  resoluci\u00f3n, a Direcci\u00f3n Xeral de Centros e Recursos Humanos,\\n\\nRESOLVE:\\n\\nPrimeiro.
  Adxudicar de\ufb01ni\\\"vamente os des\\\"nos provisionais para o pr\u00f3ximo curso
  acad\u00e9mico 2021/2022 ao profesorado referido anteriormente que \ufb01guran no
  anexo desta resoluci\u00f3n, de acordo coas normas para a adxudicaci\u00f3n de des\\\"no
  provisional establecidas pola Orde do 7 de xu\u00f1o de 2018 (Diario O\ufb01cial
  de Galicia n\u00fam. 113, do 14 de xu\u00f1o).\\n\\nSegundo. Publicar a resoluci\u00f3n
  de\ufb01ni\\\"va do concurso no portal da internet da Conseller\u00eda de Cultura,
  Educaci\u00f3n e Universidade h>p://www.edu.xunta.gal e no Diario O\ufb01cial de
  Galicia.\\n\\nA adxudicaci\u00f3n de\ufb01ni\\\"va ter\u00e1 efec\\\"vidade o d\u00eda
  seguinte ao da s\u00faa publicaci\u00f3n no dito portal da internet desta conseller\u00eda,
  sen prexu\u00edzo de que a toma de posesi\u00f3n se efectuar\u00e1 conforme o disposto
  no ar\\\"go 41 da Orde do 7 de xu\u00f1o de 2018 pola que se ditan normas para a
  adxudicaci\u00f3n de des\\\"nos provisionais\\n\\nTerceiro. De conformidade co disposto
  no citado ar\\\"go 41 da Orde do 7 de xu\u00f1o de 2018, o persoal adxudicatario
  tomar\u00e1 posesi\u00f3n no centro educa\\\"vo de des\\\"no e incorporarase con
  efec\\\"vidade econ\u00f3mica e administra\\\"va da data \ufb01xada para o inicio
  da impar\\\"ci\u00f3n efec\\\"va das clases, o 15 de setembro de 2021, ag\u00e1s
  no suposto de que o nomeamento ou toma de posesi\u00f3n se efect\u00fae con posterioridade.\\n\\nAsinado
  por: ALVAREZ BERTOLO, JESUS MANUEL\\n\\nCargo: Director Xeral\\n\\nData e hora:
  08/09/2021 11:16:42\\n\\nNo caso das comisi\u00f3ns de servizo os efectos ser\u00e1n
  do d\u00eda 15 de setembro de 2021, sen prexu\u00edzo de que as comisi\u00f3ns de
  servizo do profesorado que proceda de f\u00f3ra da Comunidade Aut\u00f3noma e do
  procedente do estranxeiro poder\u00edan ter efec\\\"vidade do 1 de setembro de 2021.\\n\\nPara
  o persoal en pr\u00e1c\\\"cas e o persoal interino sen nomeamento en vigor, os efectos
  econ\u00f3micos e administra\\\"vos ser\u00e1n do d\u00eda 15 de setembro de 2021.\\n\\nSen
  prexu\u00edzo do previsto nos par\u00e1grafos anteriores, para o persoal docente
  interino que \\\"vera nomeamento en vigor a 15 de setembro de 2021, os efectos da
  toma de posesi\u00f3n ser\u00e1n do 16 de setembro de 2021.\\n\\nCuarto. Os nomeamentos
  ser\u00e1n remi\\\"dos ao seu enderezo de correo electr\u00f3nico.\\n\\nQuinto.
  Contra esta resoluci\u00f3n, que lle pon \ufb01n \u00e1 v\u00eda administra\\\"va,
  as persoas interesadas poder\u00e1n formular un recurso potesta\\\"vo de reposici\u00f3n,
  no prazo dun mes, ante a persoa \\\"tular da Direcci\u00f3n Xeral de Centros e\\n\\nRecursos
  Humanos de acordo cos ar\\\"gos 123 e 124 da Lei 39/2015, do 1 de outubro, do procedemento
  administra\\\"vo com\u00fan das administraci\u00f3ns p\u00fablicas, ou directamente,
  no prazo de dous meses contados a\\n\\npar\\\"r  do  d\u00eda  seguinte  ao  da  s\u00faa  publicaci\u00f3n,  recurso  contencioso-administra\\\"vo  ante  o  xulgado  do
  contencioso-administra\\\"vo  que  sexa  competente,  de  conformidade  coa  Lei  29/1988,  do  13  de  xullo,\\n\\nreguladora
  da xurisdici\u00f3n contencioso-administra\\\"va.\\n\\nAsinado electronicamente
  en San\\\"ago de Compostela\\n\\nO director xeral de Centros e Recursos Humanos\\n\\nJes\u00fas
  Manuel \u00c1lvarez B\u00e9rtolo\\n\\nINS\u00cdRASE NO DOG\\n\\nO secretario xeral
  t\u00e9cnico\\n\\nManuel Vila L\u00f3pez\"", "\"BANDO\\n\\nD. JOS\u00c9 PABLO GONZ\u00c1LEZ
  CACHEIRO, ALCALDE DO CONCELLO DE OZA-CESURAS (A CORU\u00d1A), A TODOS OS VECI\u00d1OS
  DO CONCELLO,\\n\\nINFORMA:\\n\\nQue o vindeiro d\u00eda 4 DE XULLO, procederase
  \u00c1 APERTURA DA PISCINA MUNICIPAL, sita no lugar do LOUREIRO, na parroquia de
  SALTO.\\n\\nO horario de apertura ser\u00e1 de 12:30h a 20:00h de luns a domingo.\\n\\nAs\u00ed
  mesmo, na citada piscina municipal impartir\u00e1nse CURSOS DE NATACI\u00d3N\\n\\nOs
  cursos empezar\u00e1n o luns, d\u00eda 6 de xullo, \u00e1s 12:30h, d\u00eda no que
  se acordar\u00e1n os horarios e distribuci\u00f3n dos grupos.\\n\\nTodas as persoas
  interesadas nos ditos cursos de nataci\u00f3n poder\u00e1n informarse nas instalaci\u00f3n
  da piscina, nas oficinas do Concello ou chamando ao tel\u00e9fono 981792000.\\n\\nOza-Cesuras,
  3 de xullo de 2015\\nO Alcalde,\\n\\nJos\u00e9 Pablo Gonz\u00e1lez Cacheiro\"",
  "\"TERCEIRO DE GRAO PROFESIONAL\\n\\nPARTE I\\n\\nPROBA DE SAXOF\u00d3N\\n\\nO alumno
  interpretar\u00e1 tres obras, de diferentes estilos. Elixidas libremente entre as
  que figuran na relaci\u00f3n anterior, ou utilizando outras dun nivel semellante.
  En caso de ser necesario, os aspirantes deber\u00e1n dispor do seu propio pianista
  acompa\u00f1ante.\\n\\nOBRAS ORIENTATIVAS\\n\\nPARTE II\\n\\n1.- PROBA DE LINGUAXE
  MUSICAL\\n\\nEstas probas abranguer\u00e1n os contidos comprendidos nos distintos
  apartados das programaci\u00f3ns de todos os cursos de Linguaxe Musical.\\n\\nCONTIDOS
  DA PROBA\\n\\n- Ditado r\u00edtmico \u2013 mel\u00f3dico: a d\u00faas voces, e ata
  cinco alteraci\u00f3ns, dunha extensi\u00f3n entre 8 e 16 compases. Para a realizaci\u00f3n
  do dictado, dar\u00e1selles aos examinandos o La do diapas\u00f3n, a t\u00f3nica
  da tonalidade a\\n\\nempregar, o La do diapas\u00f3n, os acordes tonais, o La do
  diapas\u00f3n, a primeira nota do ditado e finalmente a velocidade do pulso (nesta
  orde).\\n\\n- Repentizaci\u00f3n r\u00edtmica: con emprego das sete claves.\\n-
  Entoaci\u00f3n: Repentizaci\u00f3n dun exercicio en clave de Sol con acompa\u00f1amento
  pian\u00edstico, que apoie pero que non dobre a melod\u00eda.\\n- Teor\u00eda: Comprender\u00e1
  un exercicio escrito de 10  preguntas.\\n\\nOs exercicios de Teor\u00eda e Ditado,
  realizaranse nunha \u00fanica sesi\u00f3n e ter\u00e1n a duraci\u00f3n m\u00e1xima
  dunha hora e media.\\n\\nPara os exercicios de repentizaci\u00f3n r\u00edtmica e
  mel\u00f3dica, os examinandos dispor\u00e1n de 10 minutos en total para preparar
  en clausura \u00e1mbolos dous exercicios.\\n\\n2.- PROBA DE ORQUESTRA/BANDA\\n\\n1.-
  Interpretar dous solos ou fragmentos dos listados que aparecen a continuaci\u00f3n,
  ou de similar dificultade. Estas obras poder\u00e1n escoitarse na s\u00faa totalidade
  ou parcialmente, segundo o criterio do profesorado.\\n\\nNesta proba, o alumnado
  presentar\u00e1 d\u00faas copias para o tribunal.\\n\\n2.- Ler a primeira vista
  un fragmento de 16 compases a proposta do tribunal, cun nivel m\u00e1ximo do curso
  anterior \u00f3 que opta o alumno.\\n\\nEsta listaxe de obras \u00e9 orientativa,
  polo que poder\u00e1n presentarse obras de similar dificultade. Seg\u00fan o curso
  \u00f3 que se desexe acceder, o alumnado presentar\u00e1 o repertorio dunha agrupaci\u00f3n
  xuvenil ou sinf\u00f3nica, elixindo entre Banda e Orquestra. \u00c9 dicir, non ten
  que presentar o repertorio de d\u00faas agrupaci\u00f3ns, s\u00f3 de unha.\\n\\nACCESO
  DE 2\u00ba a 4\u00ba DO GRAO PROFESIONAL\\n\\nBANDA (XUVENIL)\\n\\nCOMPOSITOR/A
  F. P\u00e9rez Seara A. Waignein J. Ninjs\\n\\nOBRA E OBSERVACI\u00d3NS Banda galega
  Festival suite Concerto dynamico\\n\\nJ. V. P\u00e9rez Planells\\n\\nJ. Horner\\n\\nFina
  Planells\\n\\nThe mask of zorro\\n\\nORQUESTRA (XUVENIL)\\n\\n3.- PROBA DE CONXUNTO\\n\\nAs
  probas de acceso \u00f3s distintos cursos do CONXUNTO DE VENTO MADEIRA consistir\u00e1n
  en:\\n\\n1. - Interpretar d\u00faas obras axeitadas \u00f3 nivel do curso \u00f3
  que se accede. Se interpretar\u00e1 s\u00f3 unha das partes e sen acompa\u00f1antes,
  \u00e9 dicir, a solo.\\n\\nEstas obras poder\u00e1n escoitarse na s\u00faa totalidade
  ou parcialmente, segundo o criterio do profesorado. Nesta proba, o alumnado presentar\u00e1
  d\u00faas copias para o tribunal.\\n\\n2. - Ler a primeira vista a solo un fragmento
  de 16 compases a proposta do tribunal, cun nivel m\u00e1ximo do curso anterior.\\n\\nEsta
  listaxe de obras \u00e9 orientativa, polo que poder\u00e1n presentarse obras de
  similar dificultade.\\n\\nJacques Petit\\n\\nVariations, 7 Pi\u00e8ces (Ed.\\n\\nBillaudot)\\n\\nCuarteto
  de saxof\u00f3ns\\n\\nPierre Vellones\\n\\nValse chromatique (Ed.\\n\\nLemoine)\\n\\nCuarteto
  de saxof\u00f3ns\\n\\nEd. Rubank Instrumental\\n\\nCollection\\n\\nCuarteto de frautas\\n\\nH.
  Voxman Chambermusic. Tres clarinetes.\\n\\nVol. 1 e 2\\n\\nTr\u00edo de clarinetes\\n\\nJ.
  Bouffil\\n\\nTr\u00edos\\n\\nTr\u00edo de clarinetes\\n\\nM. Ravel\\n\\nPavane pour
  une Infante\\n\\nDefunte\\n\\nCoro de clarinetes\\n\\nP. Harvey\\n\\nHappijazz\\n\\nCoro
  de clarinetes\\n\\nE. Grieg/Ch. Hine\\n\\nPeer Gynt\\n\\nCoro de clarinetes\\n\\nJ.
  S. Bach/F.\\n\\nSacci\\n\\nSuite n\u00ba 3\\n\\nCoro de clarinetes\\n\\nPh. Gordon\\n\\nCapriccio\\n\\nCoro
  de clarinetes\\n\\nG. Jacob\\n\\nWind In The Reeds\\n\\nCoro de clarinetes\\n\\nJ.
  Brahms/\\n\\nJ. Halferty\\n\\nDanza H\u00fangara n\u00ba 5\\n\\nCoro de clarinetes\\n\\nJ.
  Bouffil\\n\\nTr\u00edos\\n\\nTr\u00edo de clarinetes\"", "\"Gal\u00e1pago americano
  (Trachemys scripta)\\n\\nNOME COM\u00daN Gal\u00e1pago americano NOME CIENT\u00cdFICO
  Trachemys scripta CLASE R\u00e9ptiles FAMILIA Emydidae\\n\\nDESCRICI\u00d3N\\n\\nTr\u00e1tase
  dunha tartaruga de 20-60 cm que presenta unha destacada mancha de cor vermella,
  alaranxada ou amarela en cada lado da cabeza. Ten unha cuncha negra abombada con
  raias verticais de cor marr\u00f3n. A parte inferior da cuncha \u00e9 amarela, sen
  manchas ou ben cunhas poucas de cor negra.\\n\\nREPRODUCI\u00d3N\\n\\nCando chega
  a \u00e9poca de cr\u00eda, entre abril e xu\u00f1o, a femia cava pequenos buratos
  onde deposita ata 10 ovos. Cada femia pode realizar varias postas en cada tempada.
  A duraci\u00f3n do per\u00edodo de incubaci\u00f3n depende da temperatura; as\u00ed,
  a 30-35 \u00baC neces\u00edtanse uns 60 d\u00edas para a eclosi\u00f3n dos neonatos,
  que ten lugar ao final do ver\u00e1n ou na primavera seguinte coas primeiras chuvias.
  A supervivencia dos xuven\u00eds \u00e9 moi baixa debido aos predadores, mentres
  que os exemplares adultos adoitan vivir moitos anos.\\n\\nALIMENTACI\u00d3N\\n\\nOs
  individuos novos son omn\u00edvoros, consumindo desde pequenos animais ata plantas
  acu\u00e1ticas. Os adultos son principalmente carn\u00edvoros, a\u00ednda que tam\u00e9n
  se alimentan de animais mortos (necr\u00f3fagos) e dalg\u00fans vexetais.\\n\\nH\u00c1BITAT\\n\\nAugas
  lentas ou estancadas, con fondo lamacento e abundante vexetaci\u00f3n mergullada
  ou flotante. De vida acu\u00e1tica, a\u00ednda que sobe axilmente sobre obxectos
  da superficie para asomarse.\\n\\nDISTRIBUCI\u00d3N\\n\\nTr\u00e1tase dun gal\u00e1pago
  orixinario dos Estados Unidos, Am\u00e9rica Central e Sudam\u00e9rica ata Brasil.
  Actualmente at\u00f3pase introducida como especie reprodutora en moitos pa\u00edses
  de \u00c1frica, Asia e Europa. O primeiro rexistro en Espa\u00f1a data de 1983,
  mentres que en Galicia, ligada a medios naturais, co\u00f1\u00e9cese desde comezos
  da d\u00e9cada dos noventa, observ\u00e1ndose en diversos tipos de medios acu\u00e1ticos
  (charcas, r\u00edos, encoros...). Actualmente distrib\u00faese amplamente por toda
  Galicia, e nalgunhas localidades (Pontevedra) confirmouse tam\u00e9n a s\u00faa
  cr\u00eda.\"", "\"PROGRAMAS EDUCATIVOS MUNICIPAIS 2018-2019\\n\\nACTIVIDADES COMPLEMENTARIAS\\n\\nXADREZ
  NAS ESCOLAS\\n\\nPara t\u00f3dolos Centros de Educaci\u00f3n Infantil e Primaria
  do Concello de Ferrol\\n\\nFinanciado pola Conceller\u00eda de Educaci\u00f3n do
  Concello de Ferrol\\n\\nImparte: C\u00edrculo Ferrol\u00e1n de Xadrez\"", "\"O prazo
  de posta en marcha das instalaci\u00f3ns que se autorizan ser\u00e1 de doce meses,
  contados a partir da data da \u00faltima autorizaci\u00f3n administrativa necesaria
  para a s\u00faa execuci\u00f3n.\\n\\nContra esta resoluci\u00f3n poderase interpor
  recurso de alzada ante o vicepresidente primeiro e conselleiro de Econom\u00eda,
  Empresa e Innovaci\u00f3n no prazo dun mes, a partir do d\u00eda seguinte o da notificaci\u00f3n
  ou publicaci\u00f3n desta resoluci\u00f3n; tam\u00e9n se poder\u00e1 interpor calquera
  outro recurso que estime pertinente o seu dereito.\\n\\nLugo, 3 de maio de 2021.-
  O xefe territorial, Gustavo Jos\u00e9 Casasola de Cabo.\\n\\nR. 1563\\n\\nEXCMA.
  DEPUTACI\u00d3N PROVINCIAL DE LUGO\\n\\n\u00c1REA DE R\u00c9XIMEN INTERIOR, PROMOCI\u00d3N
  DO TERRITORIO E TURISMO\\n\\nAnuncio\\n\\nNa Xunta de Goberno da Excma. Deputaci\u00f3n
  Provincial de Lugo de data 28 de maio de 2021, acordouse aprobar e publicar no B.O.P
  de Lugo as bases reguladoras da convocatoria dos Premios \\\"Lugo Cambia ao Turismo
  Lucense\\\" e \\\"...E para comer, Lugo \u00e1 Gastronom\u00eda Lucense\\\" para
  a anualidade 2021. Para dar cumprimento a dito acordo, publ\u00edcase o texto \u00edntegro
  das mesmas.\\n\\nCONVOCATORIA E BASES DOS PREMIOS PROVINCIAIS \\\"LUGO CAMBIA AO
  TURISMO LUCENSE\\\" E \\\"\u2026 E PARA COMER, LUGO \u00c1 GASTRONOM\u00cdA LUCENSE\\\"
  PARA A ANUALIDADE 2021\\n\\nA Deputaci\u00f3n de Lugo, no marco das competencias
  conferidas pola normativa aplicable de R\u00e9xime Local e pola normativa sectorial
  reguladora da actividade tur\u00edstica na Comunidade aut\u00f3noma galega, desenvolve,
  entre outras, actuaci\u00f3ns que te\u00f1en como finalidade a promoci\u00f3n e
  o fomento do turismo no \u00e1mbito provincial.\\n\\nNo contexto destas acci\u00f3ns,
  a finalidade das presentes bases \u00e9 a creaci\u00f3n de reco\u00f1ecementos honor\u00edficos
  na procura dunha posta en valor de persoas, entidades p\u00fablicas e privadas,
  actividades e proxectos sobranceiros no eido do turismo e da gastronom\u00eda como
  elementos socioecon\u00f3micos e culturais fundamentais para a identidade da provincia.\\n\\nPolo
  anteriormente exposto, establ\u00e9cense as seguintes bases:\\n\\nPrimeira: Obxecto\\n\\nAs
  presentes bases te\u00f1en por obxecto a regulaci\u00f3n da concesi\u00f3n, en r\u00e9xime
  de concorrencia competitiva, dos premios \\\"Lugo Cambia ao Turismo Lucense\\\"
  e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda Lucense\\\". Estas distinci\u00f3ns
  te\u00f1en por misi\u00f3n reco\u00f1ecer publicamente a dedicaci\u00f3n de distintas
  empresas, persoas, instituci\u00f3ns ou entidades e os seus m\u00e9ritos polo traballo
  realizado en prol do desenvolvemento, do fomento e da promoci\u00f3n tur\u00edstica,
  a traxectoria profesional e a posta en marcha de actuaci\u00f3ns innovadoras e/ou
  exemplares que te\u00f1an unha repercusi\u00f3n positiva no \u00e1mbito do turismo
  ou da gastronom\u00eda da provincia de Lugo, ben no seu conxunto ou nun \u00e1mbito
  territorial inferior comprendido dentro da provincia.\\n\\nSegunda: Natureza\\n\\nOs
  premios Lugo \\\"Cambia ao Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1
  Gastronom\u00eda Lucense\\\" ter\u00e1n car\u00e1cter honor\u00edfico, sen que a
  s\u00faa concesi\u00f3n supo\u00f1a a adquisici\u00f3n de dereito econ\u00f3mico
  ning\u00fan por parte das entidades ou persoas galardoadas.\\n\\nO premio consistir\u00e1
  nun diploma acreditativo e nun agasallo de car\u00e1cter simb\u00f3lico, que nesta
  anualidade ser\u00e1 unha peza de artesan\u00eda tradicional da provincia de Lugo.\\n\\nAs
  entidades ou persoas galardoadas poder\u00e1n indicar a s\u00faa condici\u00f3n
  de premiadas nas acci\u00f3ns de promoci\u00f3n que realicen para dar a co\u00f1ecer
  a labor que fose obxecto destas distinci\u00f3ns.\\n\\nOs premios obxecto destas
  bases ser\u00e1n entregados en acto p\u00fablico o 27 de setembro, D\u00eda Mundial
  do Turismo.\\n\\nTerceira: Candidaturas\\n\\nPoder\u00e1n optar aos premios as persoas
  f\u00edsicas ou xur\u00eddicas, p\u00fablicas ou privadas, tanto a t\u00edtulo individual
  como colectivo, de \u00e1mbito local, auton\u00f3mico, nacional ou internacional
  que destaquen nalgunha das modalidades establecidas nestas bases e cuxa actuaci\u00f3n
  te\u00f1a ou tivese unha repercusi\u00f3n positiva no turismo ou na gastronom\u00eda
  a nivel provincial ou nunha zona espec\u00edfica de actuaci\u00f3n dentro do territorio
  lucense.\\n\\nCuarta: Modalidades\\n\\nOs premios provinciais obxecto desta convocatoria
  corresponden \u00e1s seguintes d\u00faas modalidades:\\n\\nMODALIDADE A: Premios
  \\\"Lugo Cambia ao turismo lucense\\\"\\n\\nPoder\u00e1n presentarse a esta modalidade:\\n\\n-
  Entidades p\u00fablicas ou aquelas das que na s\u00faa organizaci\u00f3n forme parte
  o sector p\u00fablico.\\n- Empresas, profesionais independentes e traballadores
  e traballadoras do sector tur\u00edstico. Poder\u00e1n concorrer tam\u00e9n persoas
  ou entidades privadas que te\u00f1an realizada unha labor de investigaci\u00f3n
  ou divulgaci\u00f3n da provincia no \u00e1mbito tur\u00edstico con resultados vixentes
  na actualidade ou que te\u00f1an realizado unha aportaci\u00f3n destacada no eido
  do turismo no ano inmediatamente anterior a esta convocatoria.\\n- Colectivos profesionais,
  asociaci\u00f3ns e outras entidades privadas sen \u00e1nimo de lucro que desenvolvan
  unha labor que garde relaci\u00f3n co sector tur\u00edstico.\\n\\nOs m\u00e9ritos
  cos que poder\u00e1n concorrer nesta convocatoria deber\u00e1n estar relacionados
  con alg\u00fan dos seguintes \u00e1mbitos:\\n\\n- A dedicaci\u00f3n e traxectoria
  profesional exemplar.\\n- O desenvolvemento de acci\u00f3ns innovadoras en materia
  de creaci\u00f3n de produtos tur\u00edsticos singulares, novos ou de \u00e9xito.\\n-
  O desenvolvemento de acci\u00f3ns de promoci\u00f3n innovadoras.\\n- O traballo
  en prol da calidade tur\u00edstica.\\n- A creaci\u00f3n ou posta a disposici\u00f3n
  de ferramentas TIC que repercutan positivamente na experiencia das persoas visitantes
  e/ou na xesti\u00f3n das empresas e destinos tur\u00edsticos.\\n- O desenvolvemento
  de iniciativas ligadas ao turismo sostible nas s\u00faas diferentes vertentes (social,
  econ\u00f3mica e medioambiental).\\n- O desenvolvemento de actuaci\u00f3ns que contrib\u00faan
  \u00e1 accesibilidade, f\u00edsica e/ou intelectual, aos recursos e/ou servizos
  tur\u00edsticos da provincia de Lugo.\\n- Acci\u00f3ns en materia de recuperaci\u00f3n
  de bens do patrimonio cultural ou natural e acci\u00f3ns de embelecemento da paisaxe
  ou do medio rural ou urbano que te\u00f1an repercusi\u00f3n no desenvolvemento tur\u00edstico
  do territorio.\\n- Traballos de investigaci\u00f3n tur\u00edstica e/ou publicaci\u00f3ns
  cient\u00edficas ou xornal\u00edsticas, que baseen a s\u00faa tem\u00e1tica nos
  recursos, empresas e/ou servizos tur\u00edsticos da provincia de Lugo e que acheguen
  datos ou conclusi\u00f3ns vixentes no momento da proposta da candidatura. No caso
  de que un traballo de investigaci\u00f3n se desenvolva no contexto dunha titulaci\u00f3n
  acad\u00e9mica deber\u00e1 ter sido cualificado como m\u00ednimo, cunha puntuaci\u00f3n
  de sobresa\u00ednte, para o que se deber\u00e1 achegar o certificado expedido pola
  entidade competente.\\n- O labor que desenvolvan persoas f\u00edsicas en calidade
  de divulgadores tur\u00edsticos da provincia de Lugo no ano inmediatamente anterior
  a esta convocatoria.\\n- O desenvolvemento de pr\u00e1cticas laborais exemplares.\\n\\nAg\u00e1s
  no caso do reco\u00f1ecemento a unha traxectoria profesional exemplar, os proxectos
  concretos nos que, de ser o caso, puidese fundamentarse a candidatura para a recepci\u00f3n
  destes premios deber\u00e1n ter car\u00e1cter actual, desenvolverse no marco dun
  plan vixente no momento da proposta ou ben, como m\u00e1ximo, terse realizado no
  ano inmediatamente anterior a esta convocatoria, pero con vixencia na actualidade.\\n\\nMODALIDADE
  B: Premios \\\"\u2026E para comer, Lugo \u00e1 gastronom\u00eda lucense\\\"\\n\\nPoder\u00e1n
  presentarse a esta modalidade:\\n\\n- Empresas, colectivos e profesionais da gastronom\u00eda
  a t\u00edtulo individual. Poder\u00e1n concorrer tam\u00e9n persoas ou entidades
  privadas que te\u00f1an realizada unha labor de investigaci\u00f3n cient\u00edfica
  ou divulgaci\u00f3n xornal\u00edstica da gastronom\u00eda lucense, ou que te\u00f1an
  realizado unha aportaci\u00f3n destacada no eido da gastronom\u00eda no ano inmediatamente
  anterior a esta convocatoria ou no ano en curso.\\n- Produtores individuais, Consellos
  Reguladores, Indicaci\u00f3ns Xeogr\u00e1ficas Protexidas e asociaci\u00f3ns de
  criadores de razas aut\u00f3ctonas.\\n- Entidades p\u00fablicas ou privadas que
  baseen a s\u00faa candidatura nun evento gastron\u00f3mico ou de exaltaci\u00f3n
  de produtos lucenses reco\u00f1ecido pola s\u00faa repercusi\u00f3n e do que sexan
  organizadoras.\\n\\nOs m\u00e9ritos cos que poder\u00e1n concorrer nesta convocatoria
  deber\u00e1n estar relacionados con alg\u00fan dos seguintes \u00e1mbitos:\\n\\n-
  O traballo ou traxectoria profesional exemplar.\\n- As acci\u00f3ns de promoci\u00f3n
  e fomento do consumo de produtos aut\u00f3ctonos.\\n- Os traballos de investigaci\u00f3n
  ou publicaci\u00f3ns cient\u00edficas ou xornal\u00edsticas baseados na divulgaci\u00f3n
  dos produtos locais, na recuperaci\u00f3n de receitas, usos ou costumes tradicionais
  ligados \u00e1 gastronom\u00eda lucense e na proposta de acci\u00f3ns que exploren
  novas f\u00f3rmulas para a combinaci\u00f3n de tradici\u00f3n e vangarda na preparaci\u00f3n
  dos produtos gastron\u00f3micos aut\u00f3ctonos. Os datos e conclusi\u00f3ns que
  se acheguen nestes estudos ou publicaci\u00f3ns deber\u00e1n revestir, segundo o
  criterio do persoal membro do Consello Provincial de Turismo, car\u00e1cter de actualidade
  na s\u00faa tem\u00e1tica.\\n\\n- As acci\u00f3ns formativas dirixidas a profesionais
  da gastronom\u00eda e baseadas no uso de produtos locais.\\n\\nAg\u00e1s no caso
  do reco\u00f1ecemento a unha traxectoria profesional exemplar, os proxectos concretos
  nos que, de ser o caso, puidese fundamentarse a candidatura para a recepci\u00f3n
  destes premios deber\u00e1n ter car\u00e1cter actual, desenvolverse no marco dun
  plan vixente no momento da proposta ou ben, como m\u00e1ximo, terse realizado no
  ano inmediatamente anterior a esta convocatoria pero con vixencia na actualidade.\\n\\nQuinta:
  Procedemento de presentaci\u00f3n de candidaturas\\n\\n1. Poder\u00e1n optar aos
  premios obxecto desta convocatoria as persoas f\u00edsicas ou xur\u00eddicas, p\u00fablicas
  ou privadas, a t\u00edtulo individual ou colectivo referidas na base terceira que
  destaquen nalgunha das modalidades convocadas.\\n2. A proposta de candidatura para
  a concesi\u00f3n do premio poder\u00e1 realizarse polo propio candidato ou candidata
  ou por un terceiro que, tendo co\u00f1ecemento dos m\u00e9ritos que ostente para
  cada modalidade o posible candidato ou candidata, as\u00ed o estime oportuno. Igualmente,
  os membros do Consello Provincial de Turismo poder\u00e1n presentar candidaturas
  para quen consideren axeitado, sempre e cando nas mesmas concorran as condici\u00f3ns
  necesarias de acordo co establecido nestas bases.\\n3. No caso de que as candidaturas
  sexan presentadas por unha terceira persoa, esta recabar\u00e1 o consentimento expreso
  do candidato ou candidata correspondente, que deber\u00e1 asinar o modelo de declaraci\u00f3n
  responsable que figura no anexo III destas bases, manifestando o cumprimento dos
  requisitos establecidos para optar \u00e1 candidatura.\\n4. S\u00f3 poder\u00e1
  presentarse candidatura baixo unha \u00fanica modalidade das contempladas nestas
  bases.\\n5. As solicitudes dirixiranse \u00e1 Presidencia da Deputaci\u00f3n de
  Lugo e ser\u00e1n presentadas a trav\u00e9s da sede electr\u00f3nica nun prazo de
  trinta d\u00edas naturais a contar dende o d\u00eda seguinte da publicaci\u00f3n
  da convocatoria e das bases no Bolet\u00edn Oficial da Provincia.\\n\\nSexta: Alegaci\u00f3n
  de m\u00e9ritos\\n\\nAs persoas f\u00edsicas ou xur\u00eddicas que presenten candidatura
  propia ou propo\u00f1an a candidatura dun terceiro aos premios en calquera das s\u00faas
  modalidades, deber\u00e1n presentar, xunto coa correspondente solicitude normalizada
  que figura nos Anexos destas bases e que estar\u00e1 a disposici\u00f3n na sede
  electr\u00f3nica da Deputaci\u00f3n de Lugo, unha memoria na que far\u00e1n constar
  os m\u00e9ritos cos que concorran a esta convocatoria. En dita memoria far\u00e1n
  fincap\u00e9 nos resultados das acci\u00f3ns levadas a cabo, sexa dende o punto
  de vista tur\u00edstico ou gastron\u00f3mico, en beneficio da provincia de Lugo
  ou nun \u00e1mbito concreto da mesma e que fundamenten a candidatura.\\n\\nA extensi\u00f3n
  da memoria non superar\u00e1 as 10 p\u00e1xinas (inclu\u00edndo portada e sen contar
  os anexos) a dobre espazo con letra Arial, calibre 12.\\n\\nS\u00e9ptima: Actuaci\u00f3n
  do xurado\\n\\n1. Das candidaturas presentadas, se as houbese, darase conta ao Consello
  Provincial de Turismo, que actuar\u00e1 como xurado dos premios, sendo convocado
  en sesi\u00f3n extraordinaria que ter\u00e1 por orde do d\u00eda o estudo e an\u00e1lise
  das candidaturas presentadas. Esta sesi\u00f3n ter\u00e1 car\u00e1cter reservado
  co fin de que as deliberaci\u00f3ns ou acordos adoptados non afecten \u00e1 intimidade
  dos ou das que presentasen candidatura aos premios. O qu\u00f3rum para poder celebrarse
  esta sesi\u00f3n requirir\u00e1 da presenza, como m\u00ednimo, da Presidencia, da
  Secretar\u00eda e dun terzo dos restantes vogais.\\n2. A valoraci\u00f3n das candidaturas
  basearase nos seguintes criterios xerais:\\na) Aportaci\u00f3n do traballo ou iniciativa
  ao desenvolvemento tur\u00edstico da provincia de Lugo, de acordo coa modalidade
  de premio que corresponda.\\nb) A singularidade da proposta.\\nc) A repercusi\u00f3n
  positiva do traballo ou da iniciativa na contribuci\u00f3n sobre a imaxe da provincia
  de Lugo.\\n3. O Consello de Turismo analizar\u00e1 as candidaturas presentadas e
  cada membro poder\u00e1 propo\u00f1er ata un m\u00e1ximo de 3 ga\u00f1adores/as
  por modalidade, emitindo os seus votos na forma que determine a presidencia. A proposta
  de concesi\u00f3n dos galard\u00f3ns realizarase en base a aquelas candidaturas
  que obtivesen o maior n\u00famero de votos.\\n\\nNo caso de quedar empatadas as
  candidaturas correspondentes a unha modalidade, realizarase unha segunda rolda de
  votaci\u00f3ns na que os membros do Consello poder\u00e1n emitir novamente o seu
  voto sobre as candidaturas empatadas. Se logo desta votaci\u00f3n persiste o empate,
  decidir\u00e1 o voto de calidade da presidencia.\\n\\n4. Poder\u00e1n outorgarse
  un m\u00e1ximo de seis premios nesta convocatoria, a raz\u00f3n de tres por modalidade.
  Potestativamente, o xurado poder\u00e1 propo\u00f1er a concesi\u00f3n dun acc\u00e9sit
  a aquelas candidaturas que non chegasen a ser galardoadas, podendo conceder ata
  un m\u00e1ximo de tres acc\u00e9sits en total nesta convocatoria. Os acc\u00e9sit
  consistir\u00e1n nunha peza de artesan\u00eda da provincia de Lugo e nun diploma.\\n\\n5.
  Ao persoal membro do Consello Provincial de Turismo seranlle de aplicaci\u00f3n
  as causas de abstenci\u00f3n reguladas no artigo 23 da Lei 40/2015, de 1 de outubro,
  de R\u00e9xime Xur\u00eddico do Sector P\u00fablico para a deliberaci\u00f3n e votaci\u00f3n
  sobre as candidaturas aos premios provinciais obxecto destas bases. Igualmente,
  o persoal membro do Consello Provincial de Turismo deber\u00e1 absterse de valorar
  e votar aquelas candidaturas que correspondan aos propios colectivos, entidades
  ou persoas representadas no Consello Provincial de Turismo, cando estes sexan candidatos
  aos premios, no seu caso. Igualmente, os membros do Consello deber\u00e1n absterse
  de valorar e votar aquela modalidade na que presentasen a candidatura dun terceiro,
  se fose o caso.\\n6. En todo caso, o resultado das deliberaci\u00f3ns ser\u00e1
  recollido nunha acta.\\n7. A Xunta de Goberno da Deputaci\u00f3n de Lugo ser\u00e1
  o \u00f3rgano competente para a resoluci\u00f3n da convocatoria dos premios e adoptar\u00e1
  o acordo correspondente para a s\u00faa concesi\u00f3n previa proposta que ser\u00e1
  elevada pola Deputada Delegada de R\u00e9xime Interior, Promoci\u00f3n do Territorio
  e Turismo en base ao informe do Servizo de Turismo e o acordo do Consello Provincial
  de Turismo recollido na correspondente acta.\\n8. O acordo de concesi\u00f3n dos
  premios pola Xunta de Goberno ser\u00e1 adoptado nun prazo m\u00e1ximo de tres meses
  a contar dende o d\u00eda seguinte \u00e1 finalizaci\u00f3n do prazo de presentaci\u00f3n
  das candidaturas. Dito acordo seralles notificado \u00e1s persoas ou entidades galardoadas
  no prazo de dez d\u00edas a contar dende o d\u00eda seguinte \u00e1 s\u00faa aprobaci\u00f3n
  pola Xunta de Goberno e ser\u00e1 publicado no Bolet\u00edn Oficial da Provincia.
  Contra o dito acordo, que esgota a v\u00eda administrativa, poderanse interpo\u00f1er
  os recursos pertinentes de acordo coa lexislaci\u00f3n vixente.\\n\\nOitava: Instruci\u00f3n
  do procedemento\\n\\nA tramitaci\u00f3n do procedemento de concesi\u00f3n dos Premios
  \\\"Lugo Cambia ao Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda
  Lucense\\\" corresponderalle ao Servizo de Turismo da Deputaci\u00f3n de Lugo, resultando
  de aplicaci\u00f3n a Lei 39/2015, de 1 de outubro, do Procedemento Administrativo
  Com\u00fan das Administraci\u00f3ns P\u00fablicas.\\n\\nNovena: Requisitos das candidaturas\\n\\nAs
  persoas f\u00edsicas ou xur\u00eddicas candidatas aos premios \\\"Lugo Cambia ao
  Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda Lucense\\\"
  deber\u00e1n cumprir cos seguintes requisitos:\\n\\na. No caso de persoas f\u00edsicas,
  ser maior de idade.\\nb. Realizar ou ter realizado parte da actividade pola que
  se prop\u00f3n a candidatura no \u00e1mbito territorial da provincia de Lugo.\\nc.
  Estar ao corrente no cumprimento coas obrigas tributarias e da Seguridade Social
  impostas polas disposici\u00f3ns vixentes e non ter d\u00e9bedas coa Deputaci\u00f3n
  Provincial de Lugo.\\nd. Estar ao corrente coas obrigas en materia de prevenci\u00f3n
  de riscos laborais no caso de persoas xur\u00eddicas e co correspondente aboamento
  de salarios.\\ne. Estar ao corrente coas obrigas impostas pola normativa en materia
  de subvenci\u00f3ns, no seu caso.\\nf. Non ter sido sancionado ou sancionada con
  car\u00e1cter firme en materia tur\u00edstica por parte de ning\u00fan organismo
  p\u00fablico.\\ng. Non ter sido condenado ou condenada por sentenza firme por ning\u00fan
  feito delituoso.\\nh. Autorizar \u00e1 Deputaci\u00f3n de Lugo a difusi\u00f3n dos
  datos das persoas, empresas, colectivos, instituci\u00f3ns ou outras entidades galardoadas
  por calquera medio e dos motivos polos que lles foron concedidos os premios.\\nA
  presentaci\u00f3n de candidatura aos premios \\\"Lugo Cambia ao Turismo Lucense\\\"
  e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda Lucense\\\" implica a aceptaci\u00f3n
  directa destas bases, as\u00ed como do premio, no caso de resultar ganador ou ganadora.\\nOs
  candidatos e candidatas ou quen ostente a s\u00faa representaci\u00f3n, no caso
  de instituci\u00f3ns, empresas ou colectivos, ser\u00e1n responsables en exclusiva
  tanto do cumprimento dos requisitos como da veracidade dos datos que figuren nos
  anexos destas bases, compromet\u00e9ndose a probalos documentalmente, no caso de
  que as\u00ed se lles solicite.\\nAs candidaturas que fosen galardoadas cos premios
  \\\"Lugo Cambia ao Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda
  Lucense\\\" non poder\u00e1n volver a presentar candidatura a eles na mesma modalidade
  ata transcorrido un prazo de tres anos dende a concesi\u00f3n do anterior premio.
  No caso de que, transcorrido o citado prazo, resultasen novamente galardoados ou
  galardoadas, os motivos nos que se fundamente a xustificaci\u00f3n da s\u00faa candidatura
  non poder\u00e1n coincidir cos motivos nos que se baseou a concesi\u00f3n do premio
  ou premios anteriores.\\n\\nA Deputaci\u00f3n de Lugo non se fai responsable do
  uso non autorizado por terceiros dos proxectos presentados e/ou premiados, en especial
  da s\u00faa copia, manipulaci\u00f3n, redistribuci\u00f3n ou calquera outra forma
  en contornas non desexadas ou enlaces il\u00edcitos.\\n\\nD\u00e9cima: Revogaci\u00f3n\\n\\nOs
  premios \\\"Lugo Cambia ao Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1
  Gastronom\u00eda Lucense\\\" poder\u00e1n ser revogados, por proposta de calquera
  das persoas membros integrantes do Consello Provincial de Turismo cando se dea algunha
  das seguintes circunstancias nun galardoado ou galardoada:\\n\\n1. Ter sido sancionado
  ou sancionada con car\u00e1cter firme pola Administraci\u00f3n competente en materia
  tur\u00edstica.\\n2. Ter sido condenado ou condenada en sentenza firme pola comisi\u00f3n
  dalg\u00fan feito delituoso.\\n3. Que se detecte o incumprimento dun ou varios requisitos
  establecidos para as persoas candidatas nestas bases.\\n4. Outras circunstancias
  debidamente motivadas que, a xu\u00edzo do persoal membro do Consello Provincial
  de Turismo, se estimen suficientemente significativas para propo\u00f1er a revogaci\u00f3n
  do premio.\\n5. A proposta de revogaci\u00f3n dos premios requirir\u00e1 a adopci\u00f3n
  dun acordo previo por maior\u00eda absoluta por parte do Consello Provincial de
  Turismo. Dito acordo, que se recoller\u00e1 nunha acta, xunto co corresponente informe
  do Servizo de Turismo, servir\u00e1n como motivaci\u00f3n da proposta de revogaci\u00f3n
  que, por parte da Deputada Delegada de R\u00e9xime Interior, Promoci\u00f3n do Territorio
  e Turismo sexa elevada \u00e1 Xunta de Goberno, \u00f3rgano competente para a revogaci\u00f3n
  dos premios.\\n\\nD\u00e9cimo primeira: Outra normativa aplicable\\n\\nOs premios
  \\\"Lugo Cambia ao Turismo Lucense\\\" e \\\"\u2026E para comer, Lugo \u00e1 Gastronom\u00eda
  Lucense\\\" rexeranse no non regulado expresamente nestas disposici\u00f3ns:\\n\\n-
  Pola Lei 39/2015, de 1 de outubro, do procedemento administrativo com\u00fan das
  administraci\u00f3ns p\u00fablicas.\\n- Pola Lei 40/2015, do 1 de outubro, do r\u00e9xime
  xur\u00eddico do sector p\u00fablico\\n- Pola Lei 29/1998, de 13 de xullo, reguladora
  da xurisdici\u00f3n contencioso- administrativa.\\n- Pola Lei org\u00e1nica 3/2018,
  de 5 de decembro, de protecci\u00f3n de datos persoais e garant\u00eda dos dereitos
  dixitais.\\n- Polo Regulamento (UE) 2016/679 do Parlamento europeo e do Consello
  de 27 de abril de 2016, relativo \u00e1 protecci\u00f3n das persoas f\u00edsicas
  no que respecta ao tratamento de datos persoais e \u00e1 libre circulaci\u00f3n
  destes datos e polo que se derroga a Directiva 95/46/CE (Regulamento xeral de protecci\u00f3n
  de datos).\\n- Polo Regulamento do Consello Provincial de Turismo da Provincia de
  Lugo, aprobado en sesi\u00f3n plenaria o 30 de xaneiro de 2018, e publicado no Bolet\u00edn
  Oficial da Provincia n.\u00ba 102 de s\u00e1bado, 5 de maio de 2018.\\n- Pola Lei
  38/2003, de 17 de novembro, Xeral de Subvenci\u00f3ns.\\n- Pola Lei 9/2007, de 13
  de xu\u00f1o, de Subvenci\u00f3ns de Galicia.\\n- Pola Ordenanza Xeral de Subvenci\u00f3ns
  da Deputaci\u00f3n de Lugo.\\n\\nANEXO I (SOLICITUDE DE PRESENTACI\u00d3N DIRECTA
  DE CANDIDATURA)\\n\\n| DATOS DO/A SOLICITANTE |  |\\n|---|---|\\n| NOME E APELIDOS
  OU RAZ\u00d3N SOCIAL | DNI / NIF |\\n| ENDEREZO |  |\\n| LOCALIDADE | PROVINCIA
  |\\n| ENDEREZO DE CORREO ELECTR\u00d3NICO | TEL. |\\n| ACTIVIDADE |  |\\n| DATOS
  DO/A REPRESENTANTE |  |\\n| NOME E APELIDOS | DNI |\\n| ENDEREZO DE CORREO ELECTR\u00d3NICO
  | TEL. |\\n\\nMODALIDADE DE PREMIO AO QUE OPTA COA CANDIDATURA (Marque cun \\\"X\\\"
  a opci\u00f3n axeitada)\\n\\n___ PREMIOSLUGO CAMBIAAO TURISMO LUCENSE.\\n\\n___
  PREMIOS\u2026E PARA COMER,LUGO\u00c1 GASTRONOM\u00cdA LUCENSE.\\n\\nCon relaci\u00f3n
  \u00e1 disposici\u00f3n d\u00e9cimo primeira das bases reguladoras dos premios onde
  se especifica a normativa reguladora do tratamento de datos persoais:\\n\\n(*) Para
  informaci\u00f3n adicional relativa \u00e1 protecci\u00f3n dos seus datos, consulte
  a ligaz\u00f3n seguinte: http://deputacionlugo.gal/rexistro_actividades_tratamento/premios_lugo_cambia_e_para_comer_lugo\\n-
  SI autorizo e consinto que a DEPUTACI\u00d3N DE LUGO utilice os meus datos para
  a solicitude de candidaturas aos premios LUGO CAMBIA AO TURISMO LUCENSE e aos premios
  \u2026E PARA COMER\u2026LUGO \u00c1 GASTRONOM\u00cdA LUCENSE.\\n\\nSOLICITA:\\n\\nPRESENTAR
  CANDIDATURA AOS PREMIOS NA MODALIDADE SINALADA.\\n\\nDECLARA RESPONSABLEMENTE:\\n\\nCUMPRIR
  OS REQUISITOS PARA A PRESENTACI\u00d3N DA CANDIDATURA.\\n\\nAUTORIZA:\\n\\n\u00c1
  Deputaci\u00f3n de Lugo \u00e1 difusi\u00f3n da identidade da persoa ou entidade
  candidata por calquer medio, no marco desta convocatoria, as\u00ed como o motivo
  ou motivos polos que, no seu caso, sexa concedido o premio.\\n\\n(Sinatura dixital
  do/a representante legal da entidade ou persoa f\u00edsica)\\n\\nILMO. SR. PRESIDENTE
  DA EXCMA. DEPUTACI\u00d3N DE LUGO.\""]'
