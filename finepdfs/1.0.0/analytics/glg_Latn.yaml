  no seu caso \u00e1s autoridades que proceda os incumprimentos observados.\\n\\nAdicionalmente,
  atendendo ao contido do  PRTR, comprom\u00e9tese a respectar os principios de econom\u00eda
  circular e evitar impactos negativos significativos no medio ambiente (\u00abDNSH\u00bb
  polas s\u00faas siglas en ingl\u00e9s \u00abdo not significant harm\u00bb) na execuci\u00f3n
  das actuaci\u00f3ns levadas a cabo no marco do devandito Plan, e manifesta que non
  incorre en dobre financiamento e que, no seu caso, non lle consta risco de incompatibilidade
  co r\u00e9xime de axudas de Estado.\\n\\nSINATURA DA PERSOA REPRESENTANTE\\n\\nLugar
