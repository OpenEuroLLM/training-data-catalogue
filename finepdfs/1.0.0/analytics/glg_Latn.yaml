sample: '["\"Direcci\u00f3n Xeral de Educaci\u00f3n, Formaci\u00f3n Profesional e
  Innovaci\u00f3n Educativa REDE DE CONSERVATORIOS DE M\u00daSICA E DANZA DE GALICIA\\n\\nModelo
  MD75PRO01\\n\\nProgramaci\u00f3n de piano\\n\\nCurso 2018-19\\n\\n1\\n\\n\u00cdNDICE:\\n\\n2\\n\\nIntroduci\u00f3n.\\n\\nA
  lei org\u00e1nica 2/2006 do 3 de maio, de educaci\u00f3n, establece no seu artigo
  45 que as ensinanzas art\u00edsticas te\u00f1en coma finalidade proporcionarlle
  ao alumnado unha formaci\u00f3n art\u00edstica de calidade e garantir a cualificaci\u00f3n
  dos futuros profesionais da m\u00fasica.\\n\\nGrao elemental:\\n\\nNo artigo 48
  precept\u00faa que as ensinanzas elementais de m\u00fasica ter\u00e1n as caracter\u00edsticas
  e a organizaci\u00f3n que as administraci\u00f3ns educativas determinen.\\n\\nDitas
  caracter\u00edsticas  ve\u00f1en ditadas no posterior decreto de 27 de setembro
  de 2007.\\n\\nA finalidade do grao elemental das ensinanzas de r\u00e9xime especial
  de m\u00fasica \u00e9 promover a autonom\u00eda do alumnado para que a s\u00faa
  capacidade de expresi\u00f3n musical adquira a calidade art\u00edstica necesaria
  que permita acceder ao grao profesional.\\n\\nGrao profesional: A lei org\u00e1nica
  2/2006 de 3 de maio, establece no seo artigo 6.2 que o goberno fixar\u00e1, en relaci\u00f3n
  cos obxectivos, as competencias b\u00e1sicas, os contidos e os criterios de avaliaci\u00f3n,
  os aspectos b\u00e1sicos do curr\u00edculo que conti\u00f1an as ensinanzas m\u00ednimas.
  Asemade, a citada lei org\u00e1nica no capitulo VI do t\u00edtulo I, fixa as caracter\u00edsticas
  b\u00e1sicas das ensinanzas profesionais de  m\u00fasica, dentro das ensinanzas
  art\u00edsticas. A presente programaci\u00f3n da concreci\u00f3n a dito decreto
  de aula, e ser\u00e1 o documento polo que se desenvolvan os diversos par\u00e1metros
  do traballo de aula dos docentes deste departamento de tecla, no Conservatorio Profesional
  de M\u00fasica de A Coru\u00f1a no curso 2018-2019. A finalidade do grao elemental
  \u00e9 promover a autonom\u00eda do alumnado para que a s\u00faa capacidade de expresi\u00f3n
  adquira a calidade necesaria que permita acceder ao grao profesional. O grao profesional
  ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n art\u00edstica
  de calidade a garantir a cualificaci\u00f3n dos futuros profesionais, e ord\u00e9nase  en  catro  funci\u00f3ns  b\u00e1sicas:  formativa,  orientadora,  profesionalizada  e
  preparatoria para estudos posteriores.\\n\\nMetodolox\u00eda\\n\\nA base metodol\u00f3xica
  dos ensinos art\u00edsticos instrumentais, \u00e9 a do m\u00e9todo individualizado:
  as estratexias pedag\u00f3xicas deben ser flexibles e estruturadas de forma independente
  para cada alumno, de acordo coas s\u00faas caracter\u00edsticas f\u00edsicas, ps\u00edquicas,
  art\u00edsticas  etc. Se os obxectivos e contido b\u00e1sicos son com\u00fans, os
  m\u00e9todos para alcanzalos deben ser dese\u00f1ados en funci\u00f3n d\u00e1 a
  individualidade de cada alumno, e modificados de forma permanente para tentar desenvolver
  o potencial de cada alumno no seu m\u00e1is alto grao, desde un punto de vista instrumental,
  creativo e art\u00edstico.\\n\\n3\\n\\nAtenci\u00f3n a diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo  \u00e1s  necesidades  dun  alumno  ou  grupo  determinado.
  Dependendo das circunstancias que se presentan na aula, o profesor poder\u00e1 plantexar
  as seguintes estratexias:\\n\\n1. Adaptaci\u00f3ns do material did\u00e1ctico, que
  ofrezan unha gama ampl\u00eda de actividades did\u00e1cticas que respondan os diferentes
  graos de aprendizaxe.\\n2. Variaci\u00f3ns da metodolox\u00eda para adaptala \u00e1s
  necesidades de cada alumno.\\n3. Propo\u00f1er actividades de  traballo  diferenciadas.  O  profesor
  far\u00e1  unha  an\u00e1lise  dos contidos da materia e preparar\u00e1 actividades
  con distinto nivel de dificultade que permitan tratar estes mesmos contidos con
  esixencias distintas.\\n4. Organizar o traballo de forma flexible e con ritmos distintos
  de aprendizaxe.\\n5. Acelerar ou frear o ritmo de introduci\u00f3n de novos contidos
  adapt\u00e1ndose ao alumno individualmente.\\n\\nA adaptaci\u00f3n dos obxectivos
  e por tanto dos contidos ter\u00e1 que respectar os m\u00ednimos esixibles fixados
  na programaci\u00f3n.\\n\\nTemas Transversais\\n\\nEducaci\u00f3n en valores\\n\\nA
  educaci\u00f3n no \u00e1mbito musical non debe acabar no simple feito do desenvolvemento
  de destrezas t\u00e9cnicas e un desenrolo da sensibilidade musical. Para unha formaci\u00f3n
  integral do alumnado tam\u00e9n \u00e9 importante o tratamento de contidos transversais.
  Estes contidos que responden \u00e1 realidade da vida coti\u00e1 no \u00e1mbito
  social son esencialmente de car\u00e1cter actitudinal e representan uns elementos
  educativos b\u00e1sicos que deben incorporarse nas diferentes \u00e1reas co fin
  de conseguir unha plena integraci\u00f3n do alumnado na sociedade\\n\\n4\\n\\nactual.
  O tratamento destes contidos debe espertar no alumnado una especial sensibilidade
  cara a dita realidade. O car\u00e1cter participativo e colaborador da pr\u00e1ctica
  musical, facilita a incorporaci\u00f3n destes temas ao aula especialmente na pr\u00e1ctica
  de conxunto. Temas como a igualdade de oportunidades entre sexos, o derrube das
  barreiras raciais, a educaci\u00f3n para a sa\u00fade, compromiso co medio ambiente
  ou educaci\u00f3n para a paz poder\u00e1n ser incorporados tanto na clase individual
  como na de conxunto.\\n\\nTratamento das tecnolox\u00edas da informaci\u00f3n e
  da comunicaci\u00f3n (TIC\u00b4s).\\n\\nA irrupci\u00f3n das tecnolox\u00edas da
  informaci\u00f3n e da comunicaci\u00f3n na nosa vida coti\u00e1 \u00e9 cada d\u00eda
  mais patente, a s\u00faa utilizaci\u00f3n est\u00e9ndese ata \u00e1mbitos insospeitados.
  O estudo da m\u00fasica nos conservatorios c\u00ednguese, na  maior\u00eda  dos
  casos, \u00e1 pr\u00e1ctica interpretativa empregando instrumentos tradicionais.
  Incluso nestas circunstancias que a priori poden parecer pouco dadas ao uso das
  TIC''s p\u00f3dense empregar co fin de complementar e facilitar  o  proceso  de  ensinanza-aprendizaxe.  O  uso  de  materiais  audiovisuais
  relacionados ca materia xa non \u00e9 unha novidade nos tempos que corren, especialmente
  dende a aparici\u00f3n  de plataformas dixitais como  YouTube, Vimeo, Spotify, etc.
  Estas plataformas unidas \u00e1 compartici\u00f3n masiva de material audiovisual
  facilita o seu uso no aula para a exemplificaci\u00f3n das posibilidades sonoras
  e t\u00e9cnicas dos instrumentos e a exploraci\u00f3n de diferentes posibilidades
  interpretativas ante un mesmo texto musical. Por outro lado a facilidade de xerar
  dito material con ferramentas cada vez m\u00e1is accesibles (videoc\u00e1maras,
  gravadoras, tablets, tel\u00e9fonos, etc) permite analizar no aula as propias actuaci\u00f3ns
  ou interpretaci\u00f3ns e as\u00ed aportar un maior grado de obxectividade \u00e1
  percepci\u00f3n de si mesmo que ten o alumno. O material en formato electr\u00f3nico
  (partituras, textos, etc.) tam\u00e9n ser\u00e1 \u00fatil no desenvolvemento das
  diferentes actividades da materia xa que facilita a r\u00e1pida distribuci\u00f3n
  do mesmo entre o alumnado as\u00ed como o seu r\u00e1pido acceso no aula no caso
  de dispo\u00f1er dos dispositivos correspondentes. As plataformas de almacenamento
  como  Dropbox  o  GoogleDrive  permiten  a  creaci\u00f3n  de  espazos  de  compartici\u00f3n  de
  material  electr\u00f3nico  para  os  alumnos  que  poden  ser  controlados  polo  profesor.  Os
  motores de busca tam\u00e9n ser\u00e1n de gran utilidade especialmente \u00e1 hora
  de recompilar informaci\u00f3n referente ao propio instrumento, obras, compositores,
  etc. O uso de todos os materiais relacionados coas TIC''s empregados no aula debe
  respectar en todo momento as leis distribuci\u00f3n e da propiedade intelectual
  dos mesmos.\\n\\n5\\n\\nActividades culturais de de promoci\u00f3n.\\n\\nCada profesor
  programar\u00e1 unha audici\u00f3n de alumnos en cada trimestre. A asistencia a
  estas  audici\u00f3ns  ser\u00eda  recomendable  para  todos  os  alumnos  matriculados  na
  especialidade. No presente curso, tendo en conta as dificultades tanto de orzamento
  como organizativas o departamento non propor\u00e1 ning\u00fan tipo de curso ou
  clase maxistral. Ao longo do curso, poderanse programar clases abertas, audici\u00f3ns
  de clase e audici\u00f3ns colectivas, si os criterios pedag\u00f3xicos do departamento
  est\u00edmano oportuno.\\n\\nSecuenciaci\u00f3n dos cursos:\\n\\nGrao elemental
  1\u00ba curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental e Medio
  dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Elemental parte da base incuestionable
  de que a idade \u00e1 que normalmente se realiza \u00e9 moi tempr\u00e1, iso leva
  a dificultade de adaptar as programaci\u00f3ns a uns alumnos nos que xoga menos
  a consciencia e m\u00e1is a capacidade imitativa. As moitas horas de pr\u00e1ctica
  necesarias para adquirir as m\u00ednimas capacidades e destrezas esixibles neste
  niveis, deben  racionalizarse  tratando  de  presentar  textos  atractivos que  estimulen  o
  co\u00f1ecemento da linguaxe musical dun modo natural, que se apoien na importancia
  da memoria  e  que  aprendan  a  desmitificar  a  actuaci\u00f3n  e  p\u00fablico.  Aprender  a  ler
  correctamente a partitura, prestando atenci\u00f3n a cada un dos signos e indicaci\u00f3ns
  que nela aparezan, \u00e9 un h\u00e1bito que debe adquirirse nesta etapa. Cultivar
  o gusto polo traballo ben feito, por unha execuci\u00f3n de calidade, esteticamente
  coherente e tecnicamente correcta, \u00e9 un obxectivo irrenunciable dende o primeiro
  momento da formaci\u00f3n pian\u00edstica.\\n\\nA finalidade do grao elemental \u00e9
  promover a autonom\u00eda do alumnado para que a s\u00faa capacidade de expresi\u00f3n
  musical adquira a calidade necesaria que permita acceder ao grao profesional.\\n\\nObxectivos\\n\\nGrao
  elemental:\\n\\n- Apreciar a importancia da m\u00fasica como linguaxe art\u00edstica
  e medio de expresi\u00f3n cultural dos pobos e das persoas.\\n- Expresarse  con  sensibilidade  musical  e  est\u00e9tica  para  interpretar  m\u00fasica  de\\n\\n6\\n\\ndiferentes
  \u00e9pocas e estilos, gozar con ela e enriquecer as propias posibilidades de comunicaci\u00f3n
  e de realizaci\u00f3n persoal.\\n- Co\u00f1ecer e valorar a importancia da respiraci\u00f3n
  e o dominio do propio corpo no desenvolvemento da t\u00e9cnica instrumental.\\n-
  Relacionar  os  co\u00f1ecementos  musicais  coas  caracter\u00edsticas  da  escritura  e  da
  literatura  do  instrumento,  coa  finalidade  de  adquirir  as  bases  que  permitan
  desenvolver a interpretaci\u00f3n musical.\\n- Interpretar en p\u00fablico, con
  seguridade en si mesmo, para vivir a m\u00fasica como medio de comunicaci\u00f3n\\n-
  Interpretar m\u00fasica en grupo habitu\u00e1ndose a escoitar outras voces ou instrumentos.\\n-
  Ser consciente do traballo individual e adquirir a capacidade de escoitarse e ser
  cr\u00edtico. Valorar o silencio como elemento indispensable para o desenvolvemento
  da concentraci\u00f3n, a audici\u00f3n interna e o pensamento musical.\\n- Ser consciente
  da importancia dunha escoita activa.\\n- Fomentar a utilizaci\u00f3n do patrimonio
  musical en xeral e do galego en particular, como medio do enriquecemento da persoa
  e da s\u00faa formaci\u00f3n musical.\\n\\nObxectivos do curso\\n\\n- Lograr unha
  posici\u00f3n correcta ao piano.\\n- Lograr  un  aproveitamento  adecuado  das  clases  semanais:  actitude,
  comportamento, regularidade no estudo.\\n- Explorar e reco\u00f1ecer as posibilidades
  sonoras do piano.\\n- Adquirir os movementos b\u00e1sicos da t\u00e9cnica pian\u00edstica.\\n-
  Adquirir sentido del pulso y ritmo b\u00e1sicos. Fluidez na lectura b\u00e1sica.\\n-
  Interpretar un repertorio con car\u00e1cter e estilo adecuados.\\n- Tocar en p\u00fablico.\\n-
  Iniciar e desenvolver un h\u00e1bito de estudo diario.\\n- Alcanzar certo grado
  de autonom\u00eda no estudo.\\n\\nContidos\\n\\n- Consecuci\u00f3n dunha correcta
  posici\u00f3n ante o teclado.\\n- Lectura nas claves de sol e fa en 4\u00aa.\\n-
  Adquisici\u00f3n dun sentido do pulso e ritmo b\u00e1sicos.\\n- Reco\u00f1ecemento
  dos principais signos de din\u00e1mica.\\n\\n7\\n\\n- Reco\u00f1ecemento dos principais
  signos de agogia.\\n- Co\u00f1ecemento da numeraci\u00f3n correspondente a dixitaci\u00f3n.\\n-
  Diferencia do picado e legato.\\n- Inicio na pr\u00e1ctica dos pedais.\\n- Realizaci\u00f3n
  dos primeiros exercicios de memorizaci\u00f3n.\\n- Participaci\u00f3n en audici\u00f3ns
  p\u00fablicas.\\n\\nContidos m\u00ednimos.\\n\\n- O alumno interpretar\u00e1 de
  memoria como m\u00ednimo 2 obras. O n\u00famero total de obras do programa ser\u00e1
  determinadas polo profesor.\\n\\nO  alumno  tocar\u00e1  polo  menos  unha  vez  en  p\u00fablico  durante  o  curso,  sempre  coa
  autorizaci\u00f3n previa do profesor,  actividade que forma parte do proceso de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n1\u00ba Grao elemental\\n\\n-
  O Piano, Tchokov-Gemiu.\\n- Cadernos de Adiana, Garc\u00eda Abril.\\n- Cantos de
  Espa\u00f1a, Nomar.\\n- Piano b\u00e1sico Niveis 1 e 2.\\n- Meu primeiro libro de
  piano, Lemoine.\\n- Estudos Op. 599, Czerny.\\n- Os cinco dedos, Czerny.\\n- Mikrokosmos
  1, Bartok.\\n- Basic Jazz, Manel Camp.\\n- M\u00e9todo de Piano, Bastien.\\n\\nCriterios
  de avaliaci\u00f3n.\\n\\n1er trimestre\\n\\n- Valorarase positivamente que o alumno
  sente correctamente fronte ao teclado.\\n- Valorarase a consecuci\u00f3n de todos
  os contidos reflexados na programaci\u00f3n.\\n\\n8\\n\\n- Ser\u00e1 imprescindible
  que o alumno aprenda a colocaci\u00f3n b\u00e1sica da man sobre o teclado.\\n- Valorarase  positivamente  a  asistencia  continuada  \u00e1s  clases  e  a  actitude  nas
  mesmas.\\n- Ser\u00e1  imprescindible  que  o alumno  toque  polo  menos 10  pezas
  entre  as que figurar\u00e1n estudos t\u00e9cnicos e obras de diferentes autores
  e estilos.\\n- Ser\u00e1 imprescindible que o alumno aprenda \u00e1 lectura das
  notas e figuras. Ritmo e pulso\\n\\n2\u00ba trimestre\\n\\n- Valorarase positivamente
  que o alumno sente correctamente fronte ao teclado, e non presente tensi\u00f3ns
  innecesarias no transcurso da interpretaci\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Ser\u00e1 imprescindible
  que o alumno coloque correctamente a man sobre o teclado do piano.\\n- Valorarase  positivamente  a  asistencia  continuada  \u00e1s  clases  e  a  actitude  nas
  mesmas.\\n- Ser\u00e1  imprescindible  que  o alumno  toque  polo  menos 10  pezas
  entre  as que figurar\u00e1n estudos t\u00e9cnicos e obras de diferentes autores
  e estilos.\\n- Ser\u00e1 imprescindible que o alumnos interprete con correcci\u00f3n
  no referente \u00e1 lectura de notas e figuras. Ritmo e pulso.\\n- Valorarase positivamente
  que o alumno aprenda a diferenciar de forma correcta as indicaci\u00f3ns de legato
  e non legato escritas na partitura.\\n- Ser\u00e1 imprescindible que o alumnos interprete
  diferenciando de forma b\u00e1sica a melod\u00eda do acompa\u00f1amento, en pasaxes
  sinxelas.\\n- Alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er  trimestre\\n\\n-
  Valorarase positivamente que o alumno sente correctamente fronte ao teclado, e non
  presente tensi\u00f3ns innecesarias no transcurso da interpretaci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Ser\u00e1
  imprescindible que o alumno coloque correctamente a man sobre o teclado, e non presente
  tensi\u00f3ns  nos dedos, que dificulten a interpretaci\u00f3n.\\n- Valorarase  positivamente  a  asistencia  continuada  \u00e1s  clases  e  a  actitude  nas
  mesmas.\\n\\n9\\n\\n- Ser\u00e1  imprescindible  que  o alumno  toque  polo  menos
  10  pezas entre  as que figurar\u00e1n estudos t\u00e9cnicos e obras de diferentes
  autores e estilos.\\n- Ser\u00e1 imprescindible que o alumnos interprete con correcci\u00f3n
  no referente \u00e1 lectura de notas e figuras, as\u00ed como as indicaci\u00f3ns
  din\u00e1micas mais sinxelas. Ritmo e pulso.\\n- Valorarase  positivamente  a  realizaci\u00f3n  da  frase  nas  pasaxes  mel\u00f3dicas  m\u00e1is
  sinxelos.\\n- Ser\u00e1 imprescindible que o alumno toque polo menos unha vez en
  p\u00fablico durante o curso.\\n- O alumno interpretar\u00e1 de memoria como m\u00ednimo
  outra obra.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos Graos elemental e profesional,
  os profesores  evaluan aos seus alumnos tendo en conta os obxectivos, contidos e
  os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n e no curr\u00edculo.\\n\\nA
  avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e o profesor
  valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de todo o curso,
  as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaliaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaliaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte\\n\\nao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...\\n\\n10\\n\\n40%.\\n\\n-Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O alumno deber\u00e1
  interpretar o programa de acordo con contidos e obxectivos do curso.\\n2. Avaliarase
  a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas as\u00ed
  como o grao de cumprimento dos obxectivos programados para cada curso.\\n3. No caso
  de que o alumno non tocara en p\u00fablico o n\u00famero de veces esixidos na programaci\u00f3n,
  o far\u00e1 diante de quen o profesor estime oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos
  de recuperaci\u00f3n trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase.
  O profesor fixar\u00e1 unha data para facer o exame de recuperaci\u00f3n cos mesmos
  contidos que os do trimestre non superado.\\n\\nO alumno que ao final do curso non
  consiga acadar unha cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse
  \u00e1s probas extraordinarias de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA
  proba extraordinaria de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o\\n\\ngrao de cumprimento dos obxectivos
  programados no curso.\\n\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n  son
  os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara que
  un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1 que
  ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir as
  distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo  \u00e1s  necesidades  dun  alumno  ou  grupo  determinado.
  Dependendo das circunstancias que se presentan na aula, o profesor poder\u00e1 plantexar
  as seguintes estratexias:\\n\\n1. Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente.\\n\\nA adaptaci\u00f3n dos obxectivos e por tanto dos contidos
  ter\u00e1 que respectar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao
  elemental 2\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental
  e Medio dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Elemental parte da base incuestionable
  de que a idade \u00e1 que normalmente se realiza \u00e9 moi tempr\u00e1, iso leva
  a dificultade de adaptar as programaci\u00f3ns a uns alumnos nos que xoga menos
  a consciencia e m\u00e1is a capacidade imitativa. As moitas horas de pr\u00e1ctica
  necesarias para adquirir as m\u00ednimas capacidades e destrezas esixibles neste
  niveis, deben  racionalizarse  tratando  de  presentar  textos  atractivos que  estimulen  o
  co\u00f1ecemento da linguaxe musical dun modo natural, que se apoien na importancia
  da memoria  e  que  aprendan  a  desmitificar  a  actuaci\u00f3n  en  p\u00fablico.  Aprender  a  ler
  correctamente a partitura, prestando atenci\u00f3n a cada un dos signos e indicaci\u00f3ns
  que nela aparezan, \u00e9 un h\u00e1bito que debe adquirirse nesta etapa. Cultivar
  o gusto polo traballo ben feito, por unha execuci\u00f3n de calidade, est\u00e9ticamente
  coherente e tecnicamente correcta, \u00e9 un obxectivo irrenunciable dende o primeiro
  momento da formaci\u00f3n pian\u00edstica.\\n\\nA finalidade do grao elemental \u00e9
  promover a autonom\u00eda do alumnado para que a s\u00faa capacidade de expresi\u00f3n
  musical adquira a calidade necesaria que permita acceder ao grao profesional.\\n\\nObxectivos\\n\\nGrao
  elemental:\\n\\n- Apreciar a importancia da m\u00fasica como linguaxe art\u00edstica
  e medio de expresi\u00f3n cultural dos pobos e das persoas.\\n\\n- Expresarse  con  sensibilidade  musical  e  est\u00e9tica  para  interpretar  m\u00fasica  de
  diferentes \u00e9pocas e estilos, gozar con ela e enriquecer as propias posibilidades
  de comunicaci\u00f3n e de realizaci\u00f3n persoal.\\n- Co\u00f1ecer e valorar a
  importancia da respiraci\u00f3n e o dominio do propio corpo no desenvolvemento da
  t\u00e9cnica instrumental.\\n- Relacionar  os  co\u00f1ecementos  musicais  coas  caracter\u00edsticas  da  escritura  e  da
  literatura  do  instrumento,  coa  finalidade  de  adquirir  as  bases  que  permitan
  desenvolver a interpretaci\u00f3n musical.\\n- Interpretar en p\u00fablico, con
  seguridade en si mesmo, para vivir a m\u00fasica como medio de comunicaci\u00f3n\\n-
  Interpretar m\u00fasica en grupo, habitu\u00e1ndose a escoitar outras voces ou instrumentos.\\n-
  Ser consciente do traballo individual e adquirir a capacidade de escoitarse e ser
  cr\u00edtico.\\n- Valorar  o  silencio  como  elemento  indispensable  para  o  desenvolvemento  da
  concentraci\u00f3n, a audici\u00f3n interna e o pensamento musical.\\n- Ser consciente
  da importancia dunha escoita activa.\\n- Fomentar a utilizaci\u00f3n do patrimonio
  musical en xeral e a do galego en particular, como medio no enriquecemento da persoa
  e da s\u00faa formaci\u00f3n musical.\\n\\nObxectivos do curso\\n\\n- Lograr unha
  lectura flu\u00edda das claves de sol e fa en 4\u00aa.\\n- Lograr  un  aproveitamento  adecuado  das  clases  semanais:  actitude,
  comportamento, regularidade no estudo.\\n- Adquisici\u00f3n dun sentido do pulso
  e ritmo b\u00e1sicos\\n- Reco\u00f1ecer os signos de din\u00e1mica: pp, mp, ff.\\n-
  Diferenciar o legato, picado e portato.\\n- Exercitar o paso do pulgar: inicio.\\n-
  Diferenciar a posici\u00f3n aberta e pechada da man.\\n- Reco\u00f1ecer os signos
  de agogia.\\n- Exercitar os primeiros fraseos.\\n- Utilizaci\u00f3n dos pedais.\\n-
  Ser capaz de memorizar correctamente.\\n- Tocar en p\u00fablico.\\n\\nContidos\\n\\n-
  Consolidaci\u00f3n dos contidos do curso anterior.\\n- Consecuci\u00f3n duna lectura
  flu\u00edda nas claves de sol e fa en 4\u00aa.\\n- Reco\u00f1ecemento dos signos
  de din\u00e1mica.\\n- Diferenciaci\u00f3n entre legato, picado e portato.\\n- Adquisici\u00f3n
  dun sentido do pulso e ritmo b\u00e1sicos\\n- Execuci\u00f3n do paso do pulgar.
  Preparaci\u00f3n para as escalas.\\n- Diferenciaci\u00f3n entre a posici\u00f3n  aberta
  e pechada da man.\\n- Reco\u00f1ecemento dos distintos signos de ag\u00f3gica.\\n-
  Execuci\u00f3n dos primeiros desprazamentos laterais dos brazos.\\n- Realizaci\u00f3n
  das primeiras ligaduras de fraseo.\\n- Utilizaci\u00f3n dos pedais.\\n- Memorizaci\u00f3n
  de obras de diferentes estilos.\\n- Participaci\u00f3n en audici\u00f3ns p\u00fablicas.\\n\\nContidos
  m\u00ednimos.\\n\\n- O alumno interpretar\u00e1 polo menos 10 obras, e d\u00faas
  delas de memoria.\\n- O alumno tocar\u00e1 polo menos unha vez en p\u00fablico durante
  o curso, sempre coa autorizaci\u00f3n previa do profesor, actividade que forma parte
  do proceso de avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento
  da programaci\u00f3n de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico
  que estime oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n2\u00ba Grao elemental\\n\\n-
  Ana Magdalena Bach.\\n- Estudos Op. 150, Kohler.\\n- Estudos Op. 151, Kohler\\n-
  For Children, Bartok.\\n- Estudos, Burgmuller.\\n- Pezas infant\u00eds, Dur\u00e1n.\\n\\n-
  Sete Xoguetes, Groba.\\n- Metodo Ruso, Nikolaev.\\n- O piano, Tchovov-Gemiu.\\n-
  \u00c1lbum da mocidade, Schumann.\\n- Sonatinas, Diabelli, Clementi, Beethoven etc.\\n-
  Pezas para nenos, Kabalevski.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er trimestre\\n\\nValoraranse
  os seguintes conceptos:\\n\\n* Completa adquisici\u00f3n e desenvolvemento dos obxectivos
  mencionados no curso anterior.\\n* Valorarase a consecuci\u00f3n de todos os contidos
  reflexados na programaci\u00f3n.\\n* Interpretaci\u00f3n clara e correcta da simultaneidade
  de acordes.\\n* Co\u00f1ecemento do emprego dos pedais e as s\u00faas funci\u00f3ns\\n*
  Interpretaci\u00f3n l\u00f3xica e musical das diferentes pezas do repertorio traballadas.\\n*
  A asistencia continuada \u00e1s clases e actitude nas mesmas.\\n* Ser\u00e1 imprescindible
  que o alumno complete o programa correspondente de 4 obras.\\n\\n2\u00ba trimestre\\n\\nValoraranse
  os seguintes conceptos:\\n\\n- Execuci\u00f3n correcta na igualdade do son.\\n-
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n-
  Interpretaci\u00f3n clara e correcta da simultaneidade de acordes e a relaci\u00f3n
  coa s\u00faa funci\u00f3n acompa\u00f1ante respecto da melod\u00eda.\\n- Uso correcto
  dos pedais.\\n- Interpretaci\u00f3n l\u00f3xica e musical das diferentes pezas do
  repertorio traballadas.\\n- A asistencia continuada \u00e1s clases e actitude nas
  mesmas.\\n- Ser\u00e1 imprescindible que o alumno complete o programa correspondente
  de 3 obras.\\n- O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er
  trimestre\\n\\nValoraranse os seguintes conceptos:\\n\\n- Execuci\u00f3n correcta
  e sen defectos na igualdade do son das pasaxes con paso do\\n\\npulgar.\\n\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Interpretaci\u00f3n
  clara e correcta da simultaneidade de acordes e a relaci\u00f3n coa s\u00faa funci\u00f3n  acompa\u00f1ante  respecto  da  melod\u00eda  que  deber\u00e1  diferenciarse
  dinamicamente con claridade: cantabile.\\n- Uso correcto e sen mixturas dos pedais.\\n-
  Interpretaci\u00f3n l\u00f3xica e musical das diferentes pezas do repertorio traballadas.\\n-
  A asistencia continuada \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible
  que o alumno complete o programa correspondente de 3 obras.\\n- O alumno interpretar\u00e1
  de memoria como m\u00ednimo 1 obra.\\n- Ser\u00e1 imprescindible que o alumno toque
  polo menos unha vez en p\u00fablico durante o curso.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos
  Graos elemental e profesional, os profesores  avaliar\u00e1n aos seus alumnos tendo
  en conta os obxectivos, contidos e os criterios de avaliaci\u00f3n establecidos
  na programaci\u00f3n e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaliaci\u00f3n
  continua, os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaliaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final ser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte ao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen decimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as\\n\\ninferiores
  a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios t\u00e9cnicos:\\n\\nT\u00e9cnica,
  resoluci\u00f3n das dificultades, hixiene postural, desenrolo do o\u00eddo interno
  etc...40%. -Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n e co\u00f1ecemento
  dos diferentes estilos, calidade do son en relaci\u00f3n co estilo, creatividade,
  resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPerda da
  avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistir\u00e1 nos seguintes puntos, tendo en conta os
  contidos xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n2. Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n3. No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na programaci\u00f3n, o far\u00e1 diante de quen o profesor estime
  oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre non superado.\\n\\nO alumno que ao final do curso non consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos\\n\\nm\u00ednimos.\\n\\n2)
  Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas
  as\u00ed como o grao de cumprimento dos obxectivos programados no curso.\\n3) Os
  criterios de avaliaci\u00f3n  a  s\u00faa cuantificaci\u00f3n  son os mesmos que
  figuran para os tres trimestres do curso correspondente. (Consultar programaci\u00f3n)\\n\\nMedidas
  de recuperaci\u00f3n para cursos pendentes\\n\\nO alumno que te\u00f1a un curso
  pendente, matricularase do curso seguinte ademais do curso pendente. A recuperaci\u00f3n
  da materia deber\u00e1 realizarse na clase do curso seguinte. Mentres non alcance
  os niveis esixidos e te\u00f1a superado o curso pendente, non poder\u00e1\\n\\nacadar
  unha cualificaci\u00f3n positiva no curso superior.\\n\\nCriterios para a ampliaci\u00f3n
  de matr\u00edcula\\n\\nPara que un alumno lle sexa concedida a ampliaci\u00f3n de
  matr\u00edcula, ter\u00e1 que ser co benepl\u00e1cito de todos os profesores que
  lle est\u00e1n a impartir as distintas materias.\\n\\nNo Departamento de Tecla,
  os profesores titores, informar\u00e1n os demais profesores dentro do primeiro trimestre,
  e faranlles un exame para avaliar os contidos propios do curso a superar. Dito exame
  ser\u00e1 similar ao que aparece no apartado referido a perdida da avaliaci\u00f3n
  continua. O alumno deber\u00e1 demostrar que domina os contidos do curso no que
  se matriculou e ter\u00e1 que mostrar o grao de aptitudes  e capacidade para superar
  o seguinte.\\n\\nAtenci\u00f3n a diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente. A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1
  que respetar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao elemental
  3\u00ba curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental e Medio
  dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Elemental parte da base incuestionable
  de que a idade \u00e1 que normalmente se realiza \u00e9 moi tempr\u00e1, iso leva
  a dificultade de adaptar as programaci\u00f3ns a uns alumnos nos que xoga menos
  a consciencia e m\u00e1is a capacidade imitativa. As moitas horas de pr\u00e1ctica
  necesarias para adquirir as m\u00ednimas capacidades e destrezas esixibles neste
  niveis, deben  racionalizarse  tratando  de  presentar  textos  atractivos que  estimulen  o
  co\u00f1ecemento da linguaxe musical dun modo natural, que se apoien na importancia
  da memoria  e  que  aprendan  a  desmitificar  a  actuaci\u00f3n  e  p\u00fablico.  Aprender  a  ler
  correctamente a partitura, prestando atenci\u00f3n a cada un dos signos e indicaci\u00f3ns
  que nela aparezan, \u00e9 un h\u00e1bito que debe adquirirse nesta etapa. Cultivar
  o gusto polo traballo ben feito, por unha execuci\u00f3n de calidade, esteticamente
  coherente e tecnicamente correcta, \u00e9 un obxectivo irrenunciable dende o primeiro
  momento da formaci\u00f3n pian\u00edstica.\\n\\nA finalidade do grao elemental \u00e9
  promover a autonom\u00eda do alumnado para que a s\u00faa capacidade de expresi\u00f3n
  musical adquira a calidade necesaria que permita acceder ao grao profesional.\\n\\nObxectivos\\n\\nGrao
  elemental:\\n\\n- Apreciar a importancia da m\u00fasica como linguaxe art\u00edstica
  e medio de expresi\u00f3n\\n\\ncultural dos pobos e das persoas.\\n- Expresarse  con  sensibilidade  musical  e  est\u00e9tica  para  interpretar  m\u00fasica  de
  diferentes \u00e9pocas e estilos, gozar con ela e enriquecer as propias posibilidades
  de comunicaci\u00f3n e de realizaci\u00f3n persoal.\\n- Co\u00f1ecer e valorar a
  importancia da respiraci\u00f3n e o dominio do propio corpo no desenvolvemento da
  t\u00e9cnica instrumental.\\n- Relacionar  os  co\u00f1ecementos  musicais  coas  caracter\u00edsticas  da  escritura  e  da
  literatura  do  instrumento,  coa  finalidade  de  adquirir  as  bases  que  permitan
  desenvolver a interpretaci\u00f3n musical.\\n- Interpretar en p\u00fablico, con
  seguridade en si mesmo, para vivir a m\u00fasica como medio de comunicaci\u00f3n\\n-
  Interpretar m\u00fasica en grupo habitu\u00e1ndose a escoitar outras voces ou instrumentos.\\n-
  Ser consciente do traballo individual e adquirir a capacidade de escoitarse e ser
  cr\u00edtico.\\n- Valorar  o  silencio  como  elemento  indispensable  para  o  desenvolvemento  da
  concentraci\u00f3n, a audici\u00f3n interna e o pensamento musical.\\n- Ser consciente
  da importancia dunha escoita activa.\\n- Fomentar a utilizaci\u00f3n do patrimonio
  musical en xeral e do galego en particular, como medio no enriquecemento da persoa
  e da s\u00faa formaci\u00f3n musical.\\n\\nObxectivos do curso\\n\\n- Resolver problemas
  r\u00edtmicos en mans diferentes.\\n- Lograr  un  aproveitamento  adecuado  das  clases  semanais:  actitude,
  comportamento, regularidade no estudo.\\n- Conseguir iniciarse na independencia
  de mans.\\n- Practicar o  paso do pulgar. Escalas. Arpexios.\\n- Practicar arpexios
  e escalas en d\u00faas oitavas.\\n- Estudar polifon\u00eda dentro dunha mesma man.\\n\\n-
  Reco\u00f1ecer todos os signos de ag\u00f3gia.\\n\\n- Afianzar o sentido do pulso
  e ritmo\\n- Reco\u00f1ecer todos os signos de din\u00e1mica.\\n- Diferenciar o picado
  do legato.\\n- Utilizar os pedais\\n- Ser capaz de memorizar correctamente.\\n\\n-
  Tocar en p\u00fablico.\\n\\nContidos.\\n\\n- Consolidaci\u00f3n dos contidos do
  curso anterior.\\n- Resoluci\u00f3n de problemas r\u00edtmicos en mans distintas.\\n-
  Inicio na independencia de mans. Resoluci\u00f3n das dificultades t\u00e9cnicas
  e musicais do repertorio do curso.\\n- P\u00e1ctica  paso de pulgar. Escalas en
  d\u00faas octavas min.\\n- Pr\u00e1ctica de arpexos en d\u00faas oitavas m\u00edn.\\n-
  Estudo da polifon\u00eda dentro duna mesma man.\\n- Reco\u00f1ecemento de todos
  los signos de ag\u00f3gia.\\n- Reco\u00f1ecemento  de todos os signos de din\u00e1mica.\\n-
  Diferenciaci\u00f3n entre picado e legato.\\n- Utilizaci\u00f3n do pedal de acentuaci\u00f3n.\\n-
  Memorizaci\u00f3n de obras de diferentes estilos.\\n- Participaci\u00f3n en audici\u00f3ns
  p\u00fablicas.\\n\\nContidos m\u00ednimos\\n\\n- O alumno deber\u00e1 interpretar
  polo menos 3 estudos, 1 obra barroca, 1 obra cl\u00e1sica, 1 obra rom\u00e1ntica,
  1 obra moderna. Exercicios , escalas e arpexios indicados polo titor.\\n- Polo  menos  interpret\u00e1ranse
  d\u00faas  obras  de  memoria de  diferentes  estilos, podendo  ser  unha  delas  un  s\u00f3  dos  estudos.  Aceptarase  tam\u00e9n  un  s\u00f3  dos
  movementos da Sonatina como obra a memorizar.\\n- O alumno tocar\u00e1 polo menos
  unha vez en p\u00fablico durante o curso, sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientadora do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n3\u00ba Grao elemental\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos Op. 100, Burgmuller.\\n- Estudos Op. 849, Czerny.\\n-
  Estudos Op.100, Bertini.\\n- Estudos Op. 37, Lemoine.\\n\\nObras barrocas:\\n\\n-
  Pequenos preludos, Bach.\\n\\nObras cl\u00e1sicas:\\n\\n- Sonatinas de Beethoven,
  Diabelli, Clementi, etc.\\n\\nObras Rom\u00e1nticas:\\n\\n- \u00c1lbum de nenos,
  Tchaikowsky.\\n- \u00c1lbum da mocidade, Schumann\\n- Valses, Schubert.\\n\\nObras
  modernas:\\n\\n- Pezas infant\u00eds; Shostakovich.\\n- Pezas infant\u00eds, Prokofiev.\\n-
  Pezas infant\u00eds, Casella.\\n- 5 dedos, Stravinsky.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er
  trimestre\\n\\nValoraranse os seguintes aspectos\\n\\n- Que diferencie escoitando
  e executando, obras de diferentes estilos.\\n- Valorarase a consecuci\u00f3n de
  todos os contidos reflexados na programaci\u00f3n.\\n- Que diferencie con claridade
  unha nota do resto do acorde.\\n- Que diferencie dinamicamente as distintas voces
  en pasaxes polif\u00f3nicos.\\n- Que analice as grandes li\u00f1as das diferentes
  obras traballadas.\\n- Que empregue correctamente os pedais.\\n- A asistencia continuada
  \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible que o alumno
  complete o programa correspondente de 3 obras ou estudos t\u00e9cnicos.\\n\\n2\u00ba
  trimestre\\n\\nValoraranse os seguintes aspectos\\n\\n- Que diferencie escoitando
  e executando, obras de diferentes estilos.\\n- Valorarase a consecuci\u00f3n de
  todos os contidos reflexados na programaci\u00f3n.\\n- Que diferencie con claridade
  unha nota do resto do acorde.\\n- Que diferencie dinamicamente as distintas voces
  en pasases polif\u00f3nicos.\\n- Que analice as grandes li\u00f1as das diferentes
  obras traballadas.\\n- Que empregue correctamente os pedais.\\n- A asistencia continuada
  \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible que o alumno
  complete o programa correspondente de 2 obras ou estudos t\u00e9cnicos.\\n- O alumno
  interpretar\u00e1 de memoria e con fluidez como m\u00ednimo 1 obra.\\n\\n3er  trimestre\\n\\nValoraranse
  os seguintes aspectos:\\n\\n- Que diferencie escoitando e executando, obras de diferentes
  estilos.\\n- Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n-
  Que diferencie con claridade unha nota do resto do acorde.\\n- Que diferencie dinamicamente
  as distintas voces en pasaxes polif\u00f3nicos.\\n- Que analice as grandes li\u00f1as
  das diferentes obras traballadas.\\n- Que empregue correctamente os pedais.\\n-
  A asistencia continuada \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible
  que o alumno complete o programa correspondente de 2 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria e con fluidez como m\u00ednimo 1 obra.\\n-
  Ser\u00e1 imprescindible que o alumno toque polo menos unha vez en p\u00fablico
  durante o curso.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos Graos elemental
  e profesional, os profesores  aval\u00edan aos seus alumnos tendo en conta os obxectivos,
  contidos e os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n e no
  curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaliaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaliaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final ser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n o grao de madurez que este leva, para
  facerlle fronte ao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns expresaranse
  mediante a escala num\u00e9rica de 1 a 10 sen decimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...40%. -Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n\\n2. Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n3. No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na programaci\u00f3n, o far\u00e1 diante de quen o profesor estime
  oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre non superado.\\n\\nO alumno que ao final do curso nos consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n  son
  os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos, e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara que
  un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1 que
  ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir as
  distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente. A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1
  que respetar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao elemental
  4\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental e Medio
  dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Elemental parte da base incuestionable
  de que a idade \u00e1 que normalmente se realiza \u00e9 moi tempr\u00e1, iso leva
  a dificultade de adaptar as programaci\u00f3ns a uns alumnos nos que xoga menos
  a consciencia e m\u00e1is a capacidade imitativa. As moitas horas de pr\u00e1ctica
  necesarias para adquirir as m\u00ednimas capacidades e destrezas esixibles neste
  niveis, deben  racionalizarse  tratando  de  presentar  textos  atractivos que  estimulen  o\\n\\nco\u00f1ecemento
  da linguaxe musical dun modo natural, que se apoien na importancia da memoria  e  que  aprendan  a  desmitificar  a  actuaci\u00f3n  en  p\u00fablico.  Aprender  a  ler
  correctamente a partitura, prestando atenci\u00f3n a cada un dos signos e indicaci\u00f3ns
  que nela aparezan, \u00e9 un h\u00e1bito que debe adquirirse nesta etapa. Cultivar
  o gusto polo traballo ben feito, por unha execuci\u00f3n de calidade, estaticamente
  coherente e tecnicamente correcta, \u00e9 un obxectivo irrenunciable dende o primeiro
  momento da formaci\u00f3n pian\u00edstica.\\n\\nA finalidade do grao elemental \u00e9
  promover a autonom\u00eda do alumnado para que a s\u00faa capacidade de expresi\u00f3n
  musical adquira a calidade necesaria que permita acceder ao grao profesional.\\n\\nObxectivos\\n\\nGrao
  elemental:\\n\\n- Apreciar a importancia da m\u00fasica como linguaxe art\u00edstica
  e medio de expresi\u00f3n cultural dos pobos e das persoas.\\n- Expresarse  con  sensibilidade  musical  e  est\u00e9tica  para  interpretar  m\u00fasica  de
  diferentes \u00e9pocas e estilos, gozar con ela e enriquecer as propias posibilidades
  de comunicaci\u00f3n e de realizaci\u00f3n persoal.\\n- Co\u00f1ecer e valorar a
  importancia da respiraci\u00f3n e o dominio do propio corpo no desenvolvemento da
  t\u00e9cnica instrumental.\\n- Relacionar  os  co\u00f1ecementos  musicais  coas  caracter\u00edsticas  da  escritura  e  da
  literatura  do  instrumento,  coa  finalidade  de  adquirir  as  bases  que  permitan
  desenvolver a interpretaci\u00f3n musical.\\n- Interpretar en p\u00fablico, con
  seguridade en si mesmo, para vivir a m\u00fasica como medio de comunicaci\u00f3n\\n-
  Interpretar m\u00fasica en grupo habitu\u00e1ndose a escoitar outras voces ou instrumentos.\\n-
  Ser consciente do traballo individual e adquirir a capacidade de escoitarse e ser
  cr\u00edtico.\\n- Valorar  o  silencio  como  elemento  indispensable  para  o  desenvolvemento  da
  concentraci\u00f3n, a audici\u00f3n interna e o pensamento musical.\\n- Ser consciente
  da importancia dunha escoita activa.\\n- Fomentar a utilizaci\u00f3n do patrimonio
  musical en xeral e a do galego en particular, como medio no enriquecemento da persoa
  e da s\u00faa formaci\u00f3n musical.\\n\\nObxectivos do curso\\n\\n- Reco\u00f1ecer
  o significado de todos os signos que aparecen na partitura.\\n\\n- Lograr  un  aproveitamento  adecuado  das  clases  semanais:  actitude,
  comportamento, concentraci\u00f3n, regularidade no estudo.\\n- Controlar o pedal
  de resonancia e o pedal unha corda.\\n- Lograr maior independencia de mans.\\n-
  Practicar escalas en  tres oitavas. Diferentes ataques e din\u00e1micas.\\n- Practicar
  arpexios en tres oitavas. Diferentes ataques e din\u00e1micas.\\n- Percibir internamente
  a propia relaxaci\u00f3n.\\n- Diferenciar estilos musicais.\\n- Continuar desenvolvendo
  a memoria.\\n- Tocar en p\u00fablico.\\n\\nContidos\\n\\n- Consolidaci\u00f3n dos
  contidos do curso anterior.\\n- Reco\u00f1ecemento do significado de todos os signos
  que aparecen na partitura.\\n- Control do pedal de resonancia e do pedal unha corda.\\n-
  Dominio das dificultades t\u00e9nicas e musicais do repertorio do curso: Igualdade
  e independencia de dedos. Coordinaci\u00f3n entre ambas as mans. Pasaxes con paso
  de pulgar: escalas e arpexios. T\u00e9cnica das notas dobres e xogo polif\u00f3nico.
  T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n- Pr\u00e1ctica de escalas en tres oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades.\\n- Pr\u00e1ctica de arpexios en tres oitavas.
  Co\u00f1ecemento e progresivo dominio de todas as tonalidades.\\n- Percepci\u00f3n
  internamente a propia relaxaci\u00f3n.\\n- Diferenciaci\u00f3n de estilos musicais.\\n-
  Continuar desenvolvendo a memoria.\\n- Participar en audici\u00f3ns p\u00fablicas.\\n\\nContidos
  m\u00ednimos\\n\\n- O alumno deber\u00e1 interpretar polo menos 3 estudos, 1 obra
  barroca, 1 obra cl\u00e1sica, 1 obra rom\u00e1ntica, 1 obra moderna. Exercicios
  , escalas e arpexios indicados polo titor.\\n- Polo  menos  interpret\u00e1ranse
  d\u00faas  obras  de  memoria de  diferentes  estilos,\\n\\npodendo  ser  unha  delas  un  s\u00f3  dos  estudos.  Aceptarase  tam\u00e9n  un  s\u00f3  dos
  movementos da Sonatina como obra a memorizar.\\n\\n- O alumno tocar\u00e1 polo menos
  unha vez en p\u00fablico durante o curso, sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n4\u00ba Grao elemental\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos Op.849, Czerny.\\n- Estudos Op. 636, Czerny.\\n\\nObra
  barrocas:\\n\\n- Invenci\u00f3ns a d\u00faas voces, Bach.\\n- Pequenas fugas BWV
  952, 953, 961, Bach.\\n- Preludos con fuguetta BWV. 902, 902a, 899, 900, 895, Bach.\\n\\nObras
  cl\u00e1sicas:\\n\\n- Sonatinas de Diabelli, Clementi, Dussek, Mozart, Beethoven...\\n-
  Sonatas, Haydn.\\n- Valses, Beethoven.\\n\\nObras rom\u00e1nticas:\\n\\n* \u00c1lbum
  da mocidade, Schumann.\\n* Romanzas sen palabras, Mendelssohn.\\n* Valses, Brahms.\\n*
  Pezas l\u00edricas, Grieg.\\n\\nObras modernas:\\n\\n- Pense\u00e9s Liriques Op.
  40,  Sibelius.\\n- 8 apuntes. Guridi.\\n- Danzas espa\u00f1olas. Granados.\\n- Follas
  de \u00e1lbum, Alb\u00e9niz.\\n\\n- Pequeno negro, Debussy.\\n- Rinc\u00f3n dos
  nenos, 2 e 5, Debussy.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er trimestre\\n\\n
  Por  ser  final  de  grao  elemental  os  criterios  de  avaliaci\u00f3n  d\u00e9bense  ater  \u00e1
  normativa legal vixente:\\n- Ler textos a primeira vista con fluidez e comprensi\u00f3n.\\n-
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n-
  Memorizar e interpretar os textos traballados empregando a medida, articulaci\u00f3n
  e fraseo adecuados a seu contido.\\n\\n- Interpretar as obras traballadas de acordo
  cos criterios estil\u00edsticos.\\n\\n- Describir  con  posterioridade  a  unha  audici\u00f3n  os  trazos  b\u00e1sicos  das  obras
  escoitadas.\\n- Mostrar capacidade de aprendizaxe progresiva nos estudos, obras
  e exercicios traballados do programa.\\n\\n-\\n\\nActuar en conxuntos con capacidade
  de adaptarse ao resto de instrumentos e voces.\\n\\nValorarase a asistencia continuada
  \u00e1s clases e actitude nas mesmas.\\n\\nSer\u00e1 imprescindible que o alumno
  complete o programa correspondente a 3 obras\\n\\n-\\n\\nou estudos t\u00e9cnicos.\\n\\n2\u00ba
  trimestre\\n\\n- Ler textos a primeira vista con fluidez e comprensi\u00f3n.\\n\\n-
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n\\n-\\n\\nMemorizar
  e interpretar os textos traballados empregando a medida, articulaci\u00f3n e fraseo
  adecuados a seu contido.\\n\\n- Interpretar as obras traballadas de acordo cos criterios
  estil\u00edsticos.\\n- Describir  con  posterioridade  a  unha  audici\u00f3n  os  trazos  b\u00e1sicos  das  obras
  escoitadas.\\n\\n-\\n\\nMostrar capacidade de aprendizaxe progresiva nos estudos,
  obras e exercicios traballados do programa.\\n\\n- Actuar en conxuntos con capacidade
  de adaptarse ao resto de instrumentos e voces.\\n\\n- Valorarase a asistencia continuada
  \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible que o alumno
  complete o programa correspondente a 2 obras ou estudos t\u00e9cnicos.\\n- O alumno
  interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n-
  Ler textos a primeira vista con fluidez e comprensi\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Memorizar e interpretar
  os textos traballados empregando a medida, articulaci\u00f3n e fraseo adecuados
  a seu contido.\\n- Interpretar as obras traballadas de acordo cos criterios estil\u00edsticos.\\n-
  Describir  con  posterioridade  a  unha  audici\u00f3n  os  trazos  b\u00e1sicos  das  obras
  escoitadas.\\n- Mostrar capacidade de aprendizaxe progresiva nos estudos, obras
  e exercicios traballados no programa.\\n- Actuar en conxuntos con capacidade de
  adaptarse ao resto de instrumentos e voces.\\n- Valorarase a asistencia continuada
  \u00e1s clases e actitude nas mesmas.\\n- Ser\u00e1 imprescindible que o alumno
  complete o programa correspondente a 2 obras ou estudos t\u00e9cnicos.\\n- O alumno
  interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n- Ser\u00e1 imprescindible
  que o alumno toque polo menos unha vez en p\u00fablico durante o curso.\\n\\nProcedementos
  de avaliaci\u00f3n\\n\\nNos Graos elemental e profesional, os profesores  avaluan
  aos seus alumnos tendo en conta os obxectivos e os criterios de avaliaci\u00f3n
  establecidos na programaci\u00f3n e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaliaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaliaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n\\n[x]
  Audici\u00f3ns. O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns
  ou concertos programados polo departamento.\\n\\nA cualificaci\u00f3n final non
  ser\u00e1 a media das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final
  ser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3ns o grao de madurez que este leva, para
  facerlle fronte ao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns expresaranse
  mediante a escala num\u00e9rica de 1 a 10 sen decimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...40%.\\n\\n-Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n2. Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n3. No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na\\n\\nprogramaci\u00f3n, o far\u00e1 diante de quen o profesor
  estime oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre no superado.\\n\\nO alumno que ao final do curso non consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n  son
  os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nAtenci\u00f3n a diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as\\n\\nseguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente. A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1
  que respectar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao
  Profesional 1\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental
  e Medio dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional \u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe chegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente
  en n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n
  e aproveitamento. A m\u00fasica debe entenderse como un modo de expresar dunha parte
  sentimentos e sensaci\u00f3ns, pero tam\u00e9n, e iso e moi importante, como unha
  linguaxe, cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros
  de temporalidade e especialidade que lle son connaturais. Percibir todo isto, implica
  adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda ser claro
  e posibilitar o ulterior desenvolvemento dunha verdadeira personalidade como interprete.\\n\\nA
  educaci\u00f3n do m\u00fasico, tanto interprete como compositor, debe pasar necesariamente,
  por unha toma de conciencia da necesidade dunha bagaxe cultural interdisciplinar,
  e de moitas horas diarias de dedicaci\u00f3n ao cultivo da t\u00e9cnica. A formaci\u00f3n
  dun pianista non debe ser insensible a esta realidade, e os Graos Elemental e Profesional
  te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO grao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n
  art\u00edstica de calidade e garantir a cualificaci\u00f3n dos futuros profesionais,
  e ord\u00e9nase en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para
  estudos posteriores.\\n\\nGrao profesional:\\n\\n- Habituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n- Desenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n- Analizar e valorar a calidade da m\u00fasica.\\n-
  Co\u00f1ecer os valores da m\u00fasica.\\n- Participar en actividades de animaci\u00f3n
  musical e cultural.\\n- Co\u00f1ecer e empregar con precisi\u00f3n o vocabulario
  espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n- Co\u00f1ecer
  e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico e cultural.\\n-
  Tomar conciencia da importancia dunha escoita activa como base na formaci\u00f3n
  de futuros profesionais.\\n- Fomentar a utilizaci\u00f3n do patrimonio musical en
  xeral e do galego en particular, como medio no enriquecemento da persoa e da s\u00faa
  formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar con dominio
  e capacidade cr\u00edtica os contidos e os obxectivos formulados nas materias que
  compo\u00f1en o curr\u00edculo.\\n\\n- Co\u00f1ecer os elementos b\u00e1sicos das
  linguaxes musicais e as s\u00faas caracter\u00edsticas.\\n\\n- Utilizar o o\u00eddo
  interno como base da afinaci\u00f3n e da interpretaci\u00f3n musical.\\n- Fomentar
  unha imaxe axustada das posibilidades e caracter\u00edsticas musicais de cada un.\\n-
  Compartir vivencias musicais de grupos na aula e fora dela.\\n- Valorar o corpo
  e a mente para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n e na interpretaci\u00f3n.\\n-
  Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na
  interpretaci\u00f3n.\\n- Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n-
  Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  allinguaxes
  musicais.\\n\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos do curso\\n\\n- Desenvolver os ataques en legato,
  picado e portato.\\n- Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo.
  Lograr un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento,
  regularidade no estudo.\\n- Pr\u00e1ctica e co\u00f1ecemento das escalas e arpexios.
  Diferentes ataques, din\u00e1micas e acentuaci\u00f3ns.\\n- Utilizar o peso do brazo.\\n-
  Constatar a importancia da calidade do son.\\n- Continuar o adestramento permanente
  e progresivo da memoria.\\n- Iniciar a pr\u00e1ctica de audici\u00f3ns cr\u00edticas.\\n-
  Tocar en p\u00fablico.\\n\\nContidos\\n\\n- Consolidaci\u00f3n dos contidos do curso
  anterior.\\n- Dominio das dificultades t\u00e9cnicas e musicais do repertorio do
  curso: Igualdade e independencia de dedos. Coordinaci\u00f3n entre ambas as mans.
  Pasaxes con paso de pulgar: escalas e arpexios. T\u00e9cnica das notas dobres e
  xogo polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n- Pr\u00e1ctica de escalas en tres oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades.\\n- Pr\u00e1ctica de arpexios en tres oitavas.
  Co\u00f1ecemento e progresivo dominio de todas as tonalidades.\\n- Desenvolvo dos
  ataques legato, picado e portato.\\n- Utilizaci\u00f3n do peso do brazo.\\n\\n-
  Constataci\u00f3n da importancia da calidade do son.\\n\\n- Continuaci\u00f3n do
  adestramento permanente e progresivo da memoria.\\n- Iniciaci\u00f3n da pr\u00e1ctica
  de audici\u00f3ns cr\u00edticas.\\n- Participaci\u00f3n en audici\u00f3ns p\u00fablicas.\\nAdquisici\u00f3n
  progresiva de h\u00e1bitos correctos de estudio, desenrolo da autocr\u00edtica,\\n-
  autonom\u00eda no estudo e  control auditivo.\\n\\nContidos m\u00ednimos\\n\\n-
  O alumno interpretar\u00e1  polo menos 3 estudos, 1 obra barroca, 1 obra cl\u00e1sica,
  1 obra rom\u00e1ntica e 1 obra moderna. Exercicios, escalas e arpexios indicados
  polo titor.\\n- Polo menos interpretaranse 3 obras de memoria, podendo ser unha
  delas un s\u00f3 dos estudos. Aceptarase tam\u00e9n un s\u00f3 dos movementos da
  Sonata como obra a memorizar.\\n- O alumno tocar\u00e1 polo menos unha vez en p\u00fablico
  durante o curso, sempre coa autorizaci\u00f3n previa do profesor, actividade que
  forma parte do proceso da avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara
  o cumprimento da programaci\u00f3n de cada curso, o profesor poder\u00e1 utilizar
  o material did\u00e1ctico que estime oportuno.\\n\\nLista de obras orientativa do
  nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n interpretarse outras obras de equivalente
  dificultade.\\n\\n1\u00ba Grao profesional\\n\\nObras did\u00e1cticas:\\n\\n- Estudos
  Op.849, Czerny.\\n- Estudos Op.91, Moszkowsky.\\n\\nObras barrocas:\\n\\n- Invenci\u00f3ns
  a d\u00faas voces, Bach\\n\\nObras cl\u00e1sicas:\\n\\n- Sonatas, Haydn, Mozart,
  Beethoven.\\n\\nObras rom\u00e1nticas.\\n\\n- Obras de Schubert, Chopin, Schumann,
  Liszt, etc.\\n\\nObras modernas:\\n\\n- Obras de Debussy, Ravel, Alb\u00e9niz, Falla,
  etc.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er trimestre\\n\\n- Utilizar o esforzo
  muscular edecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n- Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no relativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n- Interpretar os obras esixidas en cada curso segundo o programa.\\n-
  Interpretar de memoria con fluidez, seguridade e control.\\n- Resolver con autonom\u00eda
  os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan presentarse nas partituras:
  dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n- Ser\u00e1 imprescindible que o alumno
  complete 3 obras ou estudos t\u00e9cnicos.\\n- O alumno interpretar\u00e1 de memoria
  como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n- Utilizar o esforzo muscular
  adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n- Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no relativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n- Interpretar os obras esixidas en cada curso segundo o programa.\\n-
  Interpretar de memoria con fluidez, seguridade e control.\\n- Resolver con autonom\u00eda
  os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan presentarse nas partituras:
  dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n- Ser\u00e1 imprescindible que o alumno
  complete 2 obras ou estudos t\u00e9cnicos.\\n- O alumno interpretar\u00e1 de memoria
  como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n* Utilizar o esforzo muscular adecuado
  \u00e1s esixencias da execuci\u00f3n.\\n* Valorarase a consecuci\u00f3n de todos
  os contidos reflexados na programaci\u00f3n.\\n* Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n* Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no\\n\\nrelativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuesti\u00f3ns din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n\\n* Interpretar os obras esixidas en cada curso segundo o
  programa.\\n* Interpretar de memoria con fluidez, seguridade e control.\\n* Resolver
  con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan
  presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n* Ser\u00e1
  imprescindible que o alumno complete  3 estudos t\u00e9cnicos e 4 obras.\\n* O alumno
  interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n*\\n\\nSer\u00e1 imprescindible
  que o alumno toque polo menos unha vez en p\u00fablico durante o curso.\\n\\nProcedementos
  de avaliaci\u00f3n\\n\\nNos Graos elemental e profesional, os profesores  avaluar\u00e1n
  aos seus alumnos tendo en conta os obxectivos e os criterios de avaliaci\u00f3n
  establecidos na programaci\u00f3n e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaluaci\u00f3n
  continua os profesores poder\u00e1n  establecer probas  de avaliaci\u00f3n:\\n\\n[x]
  Avaliaci\u00f3n puntual\\n\\n. O profesor poder\u00e1 realizar exames mensuais,
  trimestrais ou con calquera outra periodicidade como ferramenta de avaliaci\u00f3n.
  Se valorar\u00e1 o\\n\\nrendemento do alumno as\u00ed como a calidade e cantidade
  de traballo presentada.\\n\\n[x] Audici\u00f3ns. O profesor valorar\u00e1 o comportamento
  do alumno nas audici\u00f3ns ou concertos programados polo departamento.\\n\\nA
  cualificaci\u00f3n final non ser\u00e1 a media das cualificaci\u00f3ns parciais.
  Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte\\n\\nao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...40%. -Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n2. Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n3. No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na programaci\u00f3n, o far\u00e1 diante de quen o profesor estime
  oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre no superado.\\n\\nO alumno que ao final do curso nos consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n  son
  os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara que
  un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1 que
  ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir as
  distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como  actividade  de  entremetemento,  por  inercia  dun  grupo  de  amigos,  etc.  Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades\\n\\ndid\u00e1cticas
  que respondan os diferentes graos de aprendizaxe.\\n\\n2. Variaci\u00f3ns da metodolox\u00eda
  para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er actividades
  de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos contidos
  da materia e preparar\u00e1 actividades con distinto nivel de dificultade que permitan
  tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar o traballo
  de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar ou frear
  o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno individualmente.\\n\\nA
  adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1 que respectar
  os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao Profesional 2\u00ba
  Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental e Medio dun ensino
  instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is decisivo da
  educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional \u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe chegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente
  en n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n
  e aproveitamento. A m\u00fasica debe entenderse como un modo de expresar dunha parte
  sentimentos e sensaci\u00f3ns, pero tam\u00e9n, e iso e moi importante, como unha
  linguaxe, cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros
  de temporalidade e especialidade que lle son connaturais. Percibir todo isto, implica
  adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda ser claro
  e posibilitar o ulterior desenvolvemento duna verdadeira personalidade como interprete.\\n\\nA
  educaci\u00f3n do m\u00fasico, tanto int\u00e9rprete como compositor, debe pasar
  necesariamente, por unha toma de conciencia da necesidade dunha bagaxe cultural
  interdisciplinar, e de moitas horas diarias de dedicaci\u00f3n ao cultivo da t\u00e9cnica.
  A formaci\u00f3n dun pianista non debe ser insensible a esta realidade, e os Graos
  Elemental e Profesional te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO grao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n\\n\\nart\u00edstica
  de calidade e garantir a cualificaci\u00f3n dos futuros profesionais, e ord\u00e9nase
  en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para
  estudos posteriores.\\n\\nGrao profesional:\\n\\n- Habituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n- Desenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n- Analizar e valorar a calidade da m\u00fasica.\\n-
  Co\u00f1ecer os valores da m\u00fasica.\\n- Participar en actividades de animaci\u00f3n
  musical e cultural.\\n- Co\u00f1ecer e empregar con precisi\u00f3n o vocabulario
  espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n- Co\u00f1ecer
  e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico e cultural.\\n-
  Tomar conciencia da importancia dunha escoita activa como base na formaci\u00f3n
  de futuros profesionais.\\n- Fomentar a utilizaci\u00f3n do patrimonio musical en
  xeral e do galego en particular, como medio no enriquecemento da persoa e da s\u00faa
  formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar con dominio
  e capacidade cr\u00edtica os contidos e os obxectivos formulados nas materias que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer os elementos b\u00e1sicos das linguaxes
  musicais e as s\u00faas caracter\u00edsticas.\\n- Utilizar o o\u00eddo interno como
  base da afinaci\u00f3n e da interpretaci\u00f3n musical.\\n- Fomentar unha imaxe
  axustada das posibilidades e caracter\u00edsticas musicais de cada un.\\n- Compartir
  vivencias musicais de grupos na aula e fora dela.\\n- Valorar o corpo e a mente
  para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n e na interpretaci\u00f3n.\\n-
  Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na\\n\\ninterpretaci\u00f3n.\\n\\n-
  Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n- Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  as  linguaxes
  musicais.\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos do curso\\n\\n- Desenvolver os ataques en stacatto
  e martellatto.\\n- Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo.
  Lograr un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento,
  regularidade no estudo.\\n- Incrementar a utilizaci\u00f3n do peso do brazo.\\n-
  Mellorar a calidade do son\\n- Continuar o estudo dos pedais nos diferentes estilos.\\n-
  Continuar o adestramento da memoria.\\n- Continuar a pr\u00e1ctica de audici\u00f3ns
  cr\u00edticas.\\n- Tocar en p\u00fablico.\\n\\nContidos\\n\\n- Consolidaci\u00f3n
  dos contidos do curso anterior.\\n- Dominio das dificultades t\u00e9cnicas e musicais
  do repertorio do curso: Igualdade e independencia de dedos. Coordinaci\u00f3n entre
  ambas as mans. Pasaxes con paso de pulgar: escalas e arpexios. T\u00e9cnica das
  notas dobres e xogo polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n- Pr\u00e1ctica de escalas en catro oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Pr\u00e1ctica de arpexos en catro oitavas. Co\u00f1ecemento
  e progresivo dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Desenvolvo os ataques en stacatto e martellatto. Legato
  e legatissimo.\\n- Incremento da utilizaci\u00f3n do peso do brazo.\\n- Mellor\u00eda
  da calidade do son\\n- Continuaci\u00f3n do estudo dos pedais nos diferentes estilos.\\n-
  Continuaci\u00f3n do adestramento da memoria.\\n\\n- Continuaci\u00f3n da pr\u00e1ctica
  de audici\u00f3ns cr\u00edticas.\\n- Participar en audici\u00f3ns p\u00fablicas.\\n-
  Adquisici\u00f3n progresiva de h\u00e1bitos correctos de estudio, desenrolo da autocr\u00edtica,
  autonom\u00eda no estudo e  control auditivo.\\n\\nContidos m\u00ednimos\\n\\n-
  O alumno interpretar\u00e1  polo menos 3 estudos, 1 obra barroca, 1 obra cl\u00e1sica,
  1 obra rom\u00e1ntica e 1 obra moderna. Exercicios , escalas e arpexos indicados
  polo titor.\\n- Polo menos interpretaranse 3 obras de memoria, podendo ser unha
  delas un s\u00f3 dos estudos. Aceptarase tam\u00e9n un s\u00f3 dos movementos da
  Sonata como obra a memorizar.\\n\\n-\\n\\nO alumno tocar\u00e1 polo menos unha vez
  en p\u00fablico durante o curso,  sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de\\n\\navaliaci\u00f3n.\\n\\nRecursos
  did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n de cada curso, o profesor
  poder\u00e1 utilizar o material did\u00e1ctico que estime oportuno.\\n\\nLista de
  obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n interpretarse
  outras obras de equivalente dificultade.\\n\\n2\u00ba Grao profesional\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos Op. 849, 299,337, Czerny\\n\\nObras barrocas:\\n\\n-
  Invenci\u00f3ns a d\u00faas voces ou tres voces, Bach\\n\\nObras cl\u00e1sicas:\\n\\n-
  Sonatas y variaciones, Haydn, Mozart, Clementi, Beethoven...\\n\\nObras rom\u00e1nticas:\\n\\n-
  Obras de Schubert, Chopin, Schumann, Liszt, etc.\\n\\nObras modernas:\\n\\n- Obras
  de Debussy, Ravel, Alb\u00e9niz, Falla, etc.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er
  trimestre\\n\\n- Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n-
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n-
  Demostrar o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuesti\u00f3ns din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar as obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n-
  Ser\u00e1 imprescindible que o alumno complete 3 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuesti\u00f3ns din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar as obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo
  etc.\\n- Ser\u00e1 imprescindible que o alumno complete 2 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n\\n- Interpretar as obras esixidas en cada
  curso segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n-
  Ser\u00e1 imprescindible que o alumno complete 3 estudos t\u00e9cnicos e 4 obras.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n- Ser\u00e1 imprescindible
  que o alumno toque polo menos unha vez en p\u00fablico durante o curso.\\n\\nProcedementos
  de avaliaci\u00f3n\\n\\nNos Graos elemental e profesional, os profesores  avaliaran
  aos seus alumnos tendo en conta os obxectivos e os criterios de avaliaci\u00f3n
  establecidos na programaci\u00f3n e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaluaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaluaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte\\n\\nao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postular,
  desenrolo do o\u00eddo interno etc...\\n\\n-Criterios est\u00e9ticos:\\n\\n48\\n\\n40%.\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistir\u00e1 nos seguintes puntos, tendo en conta os
  contidos xerais  do curso reflectidos na programaci\u00f3n:\\n\\nO alumno deber\u00e1
  interpretar o programa esixido de acordo con contidos e obxectivos do curso.\\n\\nAvaliarase
  a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas as\u00ed
  como o grao de cumprimento dos obxectivos programados para cada curso.\\n\\nNo  caso  de  que  o  alumno  non  tocara  en  p\u00fablico  o  n\u00famero  de  veces  esixidos  na
  programaci\u00f3n, o far\u00e1 diante de quen o profesor estime oportuno. Medidas
  de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n trimestrais\\n\\nFarase
  a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1 unha data para facer
  o exame de recuperaci\u00f3n cos mesmos contidos que os do trimestre non superado.\\n\\nO
  alumno que ao final do curso non consiga acadar unha cualificaci\u00f3n positiva,
  ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias de setembro.\\n\\nProbas
  extraordinarias de setembro\\n\\nA proba extraordinaria de setembro consistir\u00e1:\\n\\n1)
  Os alumnos deber\u00e1 interpretar o programa completo esixido nos contidos m\u00ednimos.\\n2)
  Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas
  as\u00ed como o grao de cumprimento dos obxectivos programados no curso.\\n3) Os
  criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n son os mesmos que
  figuran para os tres trimestres do curso correspondente. (Consultar programaci\u00f3n)\\n\\nOs
  criterios de avaliaci\u00f3n  son os mesmos que figuran para os tres trimestres
  do curso correspondente. (Consultar programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n
  para cursos pendentes\\n\\nO alumno que te\u00f1a un curso pendente, matricularase
  do curso seguinte ademais do curso pendente. A recuperaci\u00f3n da materia deber\u00e1
  realizarse na clase do curso seguinte.\\n\\nMentres non alcance os niveis esixidos
  e te\u00f1a superado o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n
  positiva no curso superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara
  que un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1
  que ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir
  as distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como  actividade  de  entremetemento,  por  inercia  dun  grupo  de  amigos,  etc.  Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n\\n3. Propo\u00f1er
  actividades de traballo diferenciadas. O profesor far\u00e1 unha an\u00e1lise dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente.\\n\\nA adaptaci\u00f3n dos obxectivos e por tanto dos contidos
  ter\u00e1 que respectar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao
  Profesional 3\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental
  e Medio dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional \u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe chegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente
  en n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n
  e aproveitamento. A m\u00fasica debe entenderse como un modo de expresar dunha parte
  sentimentos e sensaci\u00f3ns, pero tam\u00e9n, e iso e moi importante, como unha
  linguaxe, cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros
  de temporalidade e especialidade que lle son connaturais. Percibir todo isto, implica
  adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda ser claro
  e posibilitar o ulterior desenvolvemento duna verdadeira personalidade como int\u00e9rprete.\\n\\nA
  educaci\u00f3n do m\u00fasico, tanto int\u00e9rprete como compositor, debe pasar
  necesariamente, por unha toma de conciencia da necesidade dunha bagaxe cultural
  interdisciplinar, e de moitas horas diarias de dedicaci\u00f3n ao cultivo da t\u00e9cnica.
  A formaci\u00f3n dun pianista non debe ser insensible a esta realidade, e os Graos
  Elemental e Profesional te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO grao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n
  art\u00edstica de calidade e garantir a cualificaci\u00f3n dos futuros profesionais,
  e ord\u00e9nase en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para\\n\\nestudos
  posteriores.\\n\\nGrao profesional:\\n\\n- Habituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n- Desenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n- Analizar e valorar a calidade da m\u00fasica.\\n-
  Co\u00f1ecer os valores da m\u00fasica.\\n- Participar en actividades de animaci\u00f3n
  musical e cultural.\\n- Co\u00f1ecer e empregar con precisi\u00f3n o vocabulario
  espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n- Co\u00f1ecer
  e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico e cultural.\\n-
  Tomar conciencia da importancia dunha escoita activa como base na formaci\u00f3n
  de futuros profesionais.\\n- Fomentar a utilizaci\u00f3n do patrimonio musical en
  xeral e do galego en particular, como medio no enriquecemento da persoa e da s\u00faa
  formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar con dominio
  e capacidade cr\u00edtica os contidos e os obxectivos formulados nas materias que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer os elementos b\u00e1sicos das linguaxes
  musicais e as s\u00faas caracter\u00edsticas.\\n- Utilizar o o\u00eddo interno como
  base da afinaci\u00f3n e da interpretaci\u00f3n musical.\\n- Fomentar unha imaxe
  axustada das posibilidades e caracter\u00edsticas musicais de cada un.\\n- Compartir
  vivencias musicais de grupos na aula e fora dela.\\n- Valorar o corpo e a mente
  para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n e na interpretaci\u00f3n.\\n-
  Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na
  interpretaci\u00f3n.\\n- Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n\\n-
  Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  as  linguaxes
  musicais.\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos do curso\\n\\n- Perfeccionar os ataques  regato, picado
  e portato.\\n- Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo.
  Lograr un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento,
  regularidade no estudo.\\n- Perfeccionar a utilizaci\u00f3n do peso do brazo.\\n-
  Perfeccionar a calidade do son. Escoita consciente.\\n- Continuar o estudo dos pedais
  nos diferentes estilos.\\n- Continuar o adestramento da memoria.\\n- Continuar a
  pr\u00e1ctica de audici\u00f3ns cr\u00edticas.\\n- Tocar en p\u00fablico.\\n\\nContidos\\n\\n*
  Consolidaci\u00f3n dos contidos do curso anterior.\\n* Dominio das dificultades
  t\u00e9cnicas e musicais do repertorio do curso: Igualdade e independencia de dedos.
  Coordinaci\u00f3n entre ambas as mans. Pasaxes con paso de pulgar: escalas e arpexos.
  T\u00e9cnica das notas dobres e xogo polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n* Pr\u00e1ctica de escalas en catro oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n* Pr\u00e1ctica de arpexos en catro oitavas. Co\u00f1ecemento
  e progresivo dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n* Perfeccionamento  dos ataques  legato e legatissimo,
  picado e portato.\\n* Perfeccionamento da utilizaci\u00f3n do peso do brazo.\\n*
  Adquisici\u00f3n progresiva de h\u00e1bitos correctos de estudio, desenrolo da autocr\u00edtica,
  autonom\u00eda no estudo e  control auditivo.\\n* Perfeccionamento da calidade do
  son\\n* Continuaci\u00f3n do estudo dos pedais nos diferentes estilos.\\n* Continuaci\u00f3n
  do adestramento da memoria.\\n* Continuaci\u00f3n da pr\u00e1ctica de audici\u00f3ns
  cr\u00edticas.\\n\\n*\\nParticipar en audici\u00f3ns p\u00fablicas.\\n\\nContidos
  m\u00ednimos\\n\\n- O alumno interpretar\u00e1  polo menos 3 estudos, 1 obra barroca,
  1 obra clavecin\u00edstica (Scarlatti, Couperin, Soler...) 1 obra cl\u00e1sica,
  1 obra rom\u00e1ntica e 1 obra moderna. Exercicios , escalas e arpexos. indicados
  polo titor.\\n- Polo menos interpretaranse 3 obras de memoria, podendo ser unha
  delas un s\u00f3 dos estudos. Aceptarase tam\u00e9n un s\u00f3 dos movementos da
  Sonata como obra a memorizar.\\n- O alumno tocar\u00e1 polo menos unha vez en p\u00fablico
  durante o curso,  sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n3\u00ba Grao profesional\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos Op. 299 e 337, Czerny.\\n\\nObras barrocas:\\n\\n-
  Invenci\u00f3ns a tres voces ou Clave ben temperado, Bach.\\n\\nObras clavecin\u00edsticas:\\n\\n-
  Sonatas, Soler.\\n- Sonatas, Scarlatti.\\n\\nObras cl\u00e1sicas:\\n\\n- Sonatas
  y variaci\u00f3ns, Haydn, Mozart, Clementi, Beethoven.\\n\\nObras rom\u00e1nticas.\\n\\n-
  Obras de Schubert, Chopin, Schumann, Liszt, etc.\\n\\nObras modernas:\\n\\n- Obras
  de Debussy, Ravel, Prokofiev, Alb\u00e9niz, Falla, etc.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er
  trimestre\\n\\n- Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n-
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n-
  Demostrar o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar os obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n-
  Ser\u00e1 imprescindible que o alumno complete 3 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar os obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo
  etc.\\n- Ser\u00e1 imprescindible que o alumno complete 2 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n\\n- Interpretar os obras esixidas en cada
  curso segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.
  calidade do son...\\n- Ser\u00e1 imprescindible que o alumno complete 3 estudos
  t\u00e9cnicos e 5 obras.\\n- O alumno interpretar\u00e1 de memoria como m\u00ednimo
  1 obra.\\n- Ser\u00e1 imprescindible que o alumno toque polo menos unha vez en p\u00fablico
  durante o curso.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos Graos elemental
  e profesional, os profesores  aval\u00edan aos seus alumnos tendo en conta os obxectivos
  e os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n e no curr\u00edculo.\\n\\nA
  avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e o profesor
  valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de todo o curso,
  as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaluaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaluaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n o grao de madurez que este leva, para
  facerlle fronte ao\\n\\ncurso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postular,
  desenrolo do o\u00eddo interno etc...\\n\\n-Criterios est\u00e9ticos:\\n\\n56\\n\\n40%.\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n1. O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n2. Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n3. No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na programaci\u00f3n, o far\u00e1 diante de quen o profesor estime
  oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre non superado.\\n\\nO alumno que ao final do curso non consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os alumnos deber\u00e1 interpretar o programa
  completo esixido nos contidos m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica
  e estil\u00edstica das obras interpretadas as\u00ed como o grao de cumprimento dos
  obxectivos programados no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa
  cuantificaci\u00f3n son os mesmos que figuran para\\n\\nos tres trimestres do curso
  correspondente. (Consultar programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n
  para cursos pendentes\\n\\nO alumno que te\u00f1a un curso pendente, matricularase
  do curso seguinte ademais do curso pendente. A recuperaci\u00f3n da materia deber\u00e1
  realizarse na clase do curso seguinte.\\n\\nMentres non alcance os niveis esixidos
  e te\u00f1a superado o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n
  positiva no curso superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara
  que un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1
  que ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir
  as distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como  actividade  de  entremetemento,  por  inercia  dun  grupo  de  amigos,  etc.  Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos\\n\\ncontidos
  da materia e preparar\u00e1 actividades con distinto nivel de dificultade que permitan
  tratar estes mesmos contidos con esixencias distintas.\\n\\n4. Organizar o traballo
  de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar ou frear
  o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno individualmente.
  A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1 que respectar
  os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao Profesional 4\u00ba
  Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental e Medio dun ensino
  instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is decisivo da
  educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional \u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe chegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente
  en n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n
  e aproveitamento. A m\u00fasica debe entenderse como un modo de expresar dunha parte
  sentimentos e sensaci\u00f3ns, pero tam\u00e9n, e iso e moi importante, como unha
  linguaxe, cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros
  de temporalidade e especialidade que lle son connaturais. Percibir todo isto, implica
  adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda ser claro
  e posibilitar o ulterior desenvolvemento duna verdadeira personalidade como interprete.\\n\\nA
  educaci\u00f3n do m\u00fasico, tanto interprete como compositor, debe pasar necesariamente,
  por unha toma de conciencia da necesidade dunha bagaxe cultural interdisciplinar,
  e de moitas horas diarias de dedicaci\u00f3n ao cultivo da t\u00e9cnica. A formaci\u00f3n
  dun pianista non debe ser insensible a esta realidade, e os Graos Elemental e Profesional
  te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO grao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n
  art\u00edstica de calidade e garantir a cualificaci\u00f3n dos futuros profesionais,
  e ord\u00e9nase en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para
  estudos posteriores.\\n\\nGrao profesional:\\n\\n* Habituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n* Desenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n* Analizar e valorar a calidade da m\u00fasica.\\n*
  Co\u00f1ecer os valores da m\u00fasica.\\n* Participar en actividades de animaci\u00f3n
  musical e cultural.\\n* Co\u00f1ecer e empregar con precisi\u00f3n o vocabulario
  espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n* Co\u00f1ecer
  e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico e cultural.\\n*
  Tomar conciencia da importancia dunha escoita activa como base na formaci\u00f3n
  de futuros profesionais.\\n* Fomentar a utilizaci\u00f3n do patrimonio musical en
  xeral e a do galego en particular, como medio no enriquecemento da persoa e da s\u00faa
  formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar con dominio
  e capacidade cr\u00edtica os contidos e os obxectivos formulados nas materias que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer os elementos b\u00e1sicos das linguaxes
  musicais e as s\u00faas caracter\u00edsticas.\\n- Utilizar o o\u00eddo interno como
  base da afinaci\u00f3n e da interpretaci\u00f3n musical.\\n- Fomentar unha imaxe
  axustada das posibilidades e caracter\u00edsticas musicais de cada un.\\n- Compartir
  vivencias musicais de grupos na aula e fora dela.\\n- Valorar o corpo e a mente
  para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n e na interpretaci\u00f3n.\\n-
  Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na
  interpretaci\u00f3n.\\n- Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n-
  Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  as  linguaxes
  musicais.\\n\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos do curso\\n\\n- Perfeccionar os ataques en stacatto
  e martelatto.\\n- Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo.
  Lograr un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento,
  regularidade no estudo.\\n- Perfeccionar os estudos dos pedais en todos os per\u00edodos.
  Escoita consciente,\\n- Incrementar o adestramento da memoria.\\n- Profundar nas
  audici\u00f3ns cr\u00edticas.\\n- Tocar en p\u00fablico.\\n\\nContidos\\n\\n* Consolidaci\u00f3n
  dos contidos do curso anterior.\\n* Dominio das dificultades t\u00e9cnicas e musicais
  do repertorio do curso: Igualdade e independencia de dedos. Coordinaci\u00f3n entre
  ambas as mans. Pasaxes con paso de pulgar: escalas e arpexos. T\u00e9cnica das notas
  dobres e xogo polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n* Pr\u00e1ctica de escalas en catro oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n* Pr\u00e1ctica de arpexos. en catro oitavas. Co\u00f1ecemento
  e progresivo dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n* Perfeccionamento dos ataques en stacatto e martellatto.
  Legato e legatissimo.\\n* Adquisici\u00f3n progresiva de h\u00e1bitos correctos
  de estudio, desenrolo da autocr\u00edtica, autonom\u00eda no estudo e  control auditivo.\\n*
  Perfeccionamento dos estudos dos pedais en todos os per\u00edodos.\\n* Incremento
  do adestramento da memoria.\\n* Profundizaci\u00f3n das audici\u00f3ns cr\u00edticas.\\n*
  Participaci\u00f3n en audici\u00f3ns p\u00fablicas.\\n* Contidos m\u00ednimos\\n*
  O alumno interpretar\u00e1  polo menos 3 estudos, 1 obra barroca, 1 obra clavecin\u00edstica
  (Scarlatti, Couperin, Soler...) 1 obra cl\u00e1sica, 1 obra rom\u00e1ntica e 1 obra
  moderna. Exercicios , escalas e arpexos. indicados polo titor.\\n* Polo menos interpretaranse
  3 obras de memoria, podendo ser unha delas un s\u00f3\\n\\ndos estudos. Aceptarase
  tam\u00e9n un s\u00f3 dos movementos da Sonata como obra a memorizar.\\n\\n* O alumno
  tocar\u00e1 polo menos unha vez en p\u00fablico durante o curso, sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n4\u00ba Grao profesional\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos Op.337 e 740, Czerny.\\n- Gradus ad Parnassum, Clementi\\n\\nObras
  barrocas:\\n\\n- Clave ben temperado, Bach.\\n\\nObras clavecin\u00edsticas:\\n\\n-
  Sonatas, Soler.\\n- Sonatas, Scarlatti.\\n\\nObras cl\u00e1sicas:\\n\\n- Sonatas
  e Variaci\u00f3ns, Haydn, Mozart, Beethoven.\\n\\nObras rom\u00e1nticas.\\n\\n-
  Obras de Schubert, Chopin, Schumann, Liszt, etc.\\n\\nObras modernas:\\n\\n- Obras
  de Debussy, Ravel, Alb\u00e9niz, Falla, etc.\\n\\nCriterios de avaliaci\u00f3n\\n\\n1er
  trimestre\\n\\n* Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n*
  Valorarase a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n*
  Demostrar o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n*
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones\\n\\ndin\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n\\n* Interpretar os obras esixidas en cada
  curso segundo o programa.\\n* Interpretar de memoria con fluidez, seguridade e control.\\n*
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.\\n*
  Ser\u00e1 imprescindible que o alumno complete 3 obras ou estudos t\u00e9cnicos.\\n*
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar os obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo
  etc.\\n- Ser\u00e1 imprescindible que o alumno complete 2 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar os obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.
  calidade do son...\\n- Ser\u00e1 imprescindible que o alumno complete 3 estudos
  t\u00e9cnicos e 5 obras.\\n- O alumno interpretar\u00e1 de memoria como m\u00ednimo
  1 obra.\\n\\n-\\n\\nSer\u00e1 imprescindible que o alumno toque polo menos unha
  vez en p\u00fablico durante o curso.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos
  Graos elemental e profesional, os profesores  aval\u00edan aos seus alumnos tendo
  en conta os obxectivos e os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n
  e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e\\n\\nactitude.\\n\\nPartindo
  da avaluaci\u00f3n continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x]
  Avaliaci\u00f3n puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais
  ou con calquera outra periodicidade como ferramenta de avaluaci\u00f3n. Se valorar\u00e1
  o rendemento do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x]
  Audici\u00f3ns. O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns
  ou concertos programados polo departamento.\\n\\nA cualificaci\u00f3n final non
  ser\u00e1 a media das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3ns o grao de madurez que este leva, para
  facerlle fronte\\n\\nao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc... 40%.\\n\\n-Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026\\n\\n40
  %.\\n\\n-Criterios actitudinais:\\n\\nActitude,  interese, comportamento...etc..
  20%.\\n\\nPara ter opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1
  acadar un 5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\nO alumno deber\u00e1 interpretar
  o programa esixido de acordo con contidos e obxectivos do curso. Avaliarase a correcci\u00f3n
  t\u00e9cnica e estil\u00edstica das obras interpretadas as\u00ed como o grao de
  cumprimento dos obxectivos programados para cada curso.\\n\\nNo  caso  de  que  o  alumno  non  tocara  en  p\u00fablico  o  n\u00famero  de  veces  esixidos  na
  programaci\u00f3n, o far\u00e1 diante de quen o profesor estime oportuno.\\n\\nMedidas
  de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n trimestrais\\n\\nFarase
  a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1 unha data para facer
  o exame de recuperaci\u00f3n cos mesmos contidos que os do trimestre no superado.\\n\\nO
  alumno que ao final do curso nos consiga acadar unha cualificaci\u00f3n positiva,
  ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias de setembro.\\n\\nProbas
  extraordinarias de setembro\\n\\nA proba extraordinaria de setembro consistir\u00e1:\\n\\n1)
  Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n
  son os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara que
  un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1 que
  ser co benepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir as
  distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como  actividade  de  entremetemento,  por  inercia  dun  grupo  de  amigos,  etc.  Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente.\\n\\nA adaptaci\u00f3n dos obxectivos e por tanto dos contidos
  ter\u00e1 que respectar os m\u00ednimos\\n\\nesixibles fixados na programaci\u00f3n.\\n\\nGrao
  profesional 5\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental
  e Medio dun ensino instrumental ha de cubrir o per\u00edodo de formaci\u00f3n m\u00e1is
  decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional \u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe chegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente
  en n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n
  e aproveitamento. A m\u00fasica debe entenderse como un modo de expresar dunha parte
  sentimentos e sensaci\u00f3ns, pero tam\u00e9n, e iso e moi importante, como unha
  linguaxe, cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros
  de temporalidade e especialidade que lle son connaturais. Percibir todo isto, implica
  adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda ser claro
  e posibilitar o ulterior desenvolvemento duna verdadeira personalidade como interprete.\\n\\nA
  educaci\u00f3n do m\u00fasico, tanto interprete como compositor, debe pasar necesariamente,
  por unha toma de conciencia da necesidade dunha bagaxe cultural interdisciplinar,
  e de moitas horas diarias de dedicaci\u00f3n ao cultivo da t\u00e9cnica. A formaci\u00f3n
  dun pianista non debe ser insensible a esta realidade, e os Graos Elemental e Profesional
  te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO grao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n
  art\u00edstica de calidade e garantir a cualificaci\u00f3n dos futuros profesionais,
  e ord\u00e9nase en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para
  estudos posteriores.\\n\\nGrao profesional:\\n\\n- Habituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n- Desenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n\\n- Analizar e valorar a calidade da m\u00fasica.\\n-
  Co\u00f1ecer os valores da m\u00fasica.\\n- Participar en actividades de animaci\u00f3n
  musical e cultural.\\n- Co\u00f1ecer e empregar con precisi\u00f3n o vocabulario
  espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n- Co\u00f1ecer
  e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico e cultural.\\n-
  Tomar conciencia da importancia dunha escoita activa como base na formaci\u00f3n
  de futuros profesionais.\\n- Fomentar a utilizaci\u00f3n do patrimonio musical en
  xeral e a do galego en particular, como medio no enriquecemento da persoa e da s\u00faa
  formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar  con  dominio  e  capacidade  cr\u00edtica  os  contendidos  e  os  obxectivos
  formulados nas materias que compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer os
  elementos b\u00e1sicos das linguaxes musicais e as s\u00faas caracter\u00edsticas.\\n-
  Utilizar o o\u00eddo interno como base da afinaci\u00f3n e da interpretaci\u00f3n
  musical.\\n- Fomentar unha imaxe axustada das posibilidades e caracter\u00edsticas
  musicais de cada un.\\n- Compartir vivencias musicais de grupos na aula e fora dela.\\n-
  Valorar o corpo e a mente para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n
  e na interpretaci\u00f3n.\\n- Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na
  interpretaci\u00f3n.\\n- Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n-
  Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  as  linguaxes
  musicais.\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos do curso\\n\\n- Perfeccionar todos os tipos de ataques.\\n\\n-
  Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo. Lograr
  un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento, regularidade
  no estudo.\\n- Perfeccionar os estudos dos pedais en todos os per\u00edodos.\\n-
  Incrementar o adestramento da memoria.\\n- Profundar nas audici\u00f3ns cr\u00edticas.\\n-
  Tocar en p\u00fablico.\\n\\nContidos\\n\\n- Consolidaci\u00f3n dos contidos do curso
  anterior.\\n- Dominio das dificultades t\u00e9cnicas e musicais do repertorio do
  curso: Igualdade e independencia de dedos. Coordinaci\u00f3n entre ambas as mans.
  Pasaxes con paso de pulgar: escalas e arpexos. T\u00e9cnica das notas dobres e xogo
  polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n- Pr\u00e1ctica de escalas en catro oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Pr\u00e1ctica de arpexos. en catro oitavas. Co\u00f1ecemento
  e progresivo dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Perfeccionamento de todos os tipos de ataques.\\n-
  Adquisici\u00f3n progresiva de h\u00e1bitos correctos de estudio, desenrolo da autocr\u00edtica,
  autonom\u00eda no estudo e  control auditivo.\\n- Perfeccionamento dos estudos dos
  pedais en todos os per\u00edodos.\\n- Incremento do adestramento da memoria.\\n-
  Profundizaci\u00f3n das audici\u00f3ns cr\u00edticas.\\n- Participaci\u00f3n en
  audici\u00f3ns p\u00fablicas.\\n\\nContidos m\u00ednimos\\n\\n- O alumno interpretar\u00e1  polo
  menos 3 estudos, 1 obra barroca, 1 obra clavecin\u00edstica (Scarlatti, Couperin,
  Soler...) 1 obra cl\u00e1sica, 1 obra rom\u00e1ntica e 1 obra moderna. Exercicios
  , escalas e arpexos. indicados polo titor.\\n- Polo menos interpretaranse 3 obras
  de memoria, podendo ser unha delas un s\u00f3 dos estudos. Aceptarase tam\u00e9n
  un s\u00f3 dos movementos da Sonata como obra a memorizar.\\n- O alumno tocar\u00e1
  polo menos unha vez en p\u00fablico durante o curso,  sempre coa\\n\\nautorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da programaci\u00f3n
  de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico que estime
  oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n5\u00ba Grao profesional\\n\\nObras
  did\u00e1cticas.\\n\\n- Estudos Op. 740 e 365, Czerny.\\n- Gradas ad Parnassum,
  Clementi.\\n\\nObras barrocas.\\n\\n- Clave ben temperado, Bach.\\n- Suites, Bach\\n\\nObras
  clavecin\u00edsticas:\\n\\n- Sonatas, Soler.\\n- Sonatas, Scarlatti.\\n\\nObras
  cl\u00e1sicas:\\n\\n- Sonatas y variaci\u00f3ns, Haydn, Mozart, Beethoven.\\n\\nObras
  rom\u00e1nticas.\\n\\n- Obras de Schubert, Chopin, Schumann, Liszt, etc.\\n\\nObras
  modernas:\\n\\n- Obras de Debussy, Ravel, Alb\u00e9niz, Falla, Groba etc.\\n\\nCriterios
  de avaliaci\u00f3n\\n\\n1er trimestre\\n\\n* Utilizar o esforzo muscular adecuado
  \u00e1s esixencias da execuci\u00f3n.\\n* Valorarase a consecuci\u00f3n de todos
  os contidos reflexados na programaci\u00f3n.\\n* Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n* Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no relativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n* Interpretar os obras esixidas en cada curso segundo o programa.\\n\\n*
  Interpretar de memoria con fluidez, seguridade e control.\\n* Resolver con autonom\u00eda
  os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan presentarse nas partituras:
  dixitaci\u00f3n, pedalizaci\u00f3n, fraseo, control do son.\\n* Ser\u00e1 imprescindible
  que o alumno complete 3 obras ou estudos t\u00e9cnicos.\\n* O alumno interpretar\u00e1
  de memoria como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n- Utilizar o esforzo
  muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n- Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no relativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n- Interpretar os obras esixidas en cada curso segundo o programa.\\n-
  Interpretar de memoria con fluidez, seguridade e control.\\n- Resolver con autonom\u00eda
  os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan presentarse nas partituras:
  dixitaci\u00f3n, pedalizaci\u00f3n, fraseo etc.\\n- Ser\u00e1 imprescindible que
  o alumno complete 2 obras ou estudos t\u00e9cnicos.\\n- O alumno interpretar\u00e1
  de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n- Utilizar o esforzo
  muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase a consecuci\u00f3n
  de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n- Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no relativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n- Interpretar os obras esixidas en cada curso segundo o programa.\\n-
  Interpretar de memoria con fluidez, seguridade e control.\\n- Resolver con autonom\u00eda
  os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan presentarse nas partituras:
  dixitaci\u00f3n, pedalizaci\u00f3n, fraseo. calidade do son...\\n- Ser\u00e1 imprescindible
  que o alumno complete 3 estudos t\u00e9cnicos e 5 obras.\\n- O alumno interpretar\u00e1
  de memoria como m\u00ednimo 1 obra.\\n- Ser\u00e1 imprescindible que o alumno toque
  polo menos unha vez en p\u00fablico durante o curso.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos
  Graos elemental e profesional, os profesores  avaluan aos seus alumnos tendo en
  conta os obxectivos e os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n
  e no curr\u00edculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaluaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaluaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final ser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte ao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen decimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...40%.\\n\\n-Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordou que o
  n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na asignatura
  de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\n* O  alumno  deber\u00e1  interpretar  o  programa  esixido  de  acordo  con  contidos  e
  obxectivos do curso.\\n* Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  para cada curso.\\n* No caso de que o alumno non tocara en p\u00fablico o n\u00famero
  de veces esixidos na programaci\u00f3n, o far\u00e1 diante de quen o profesor estime
  oportuno.\\n\\nMedidas de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n
  trimestrais\\n\\nFarase a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1
  unha data para facer o exame de recuperaci\u00f3n cos mesmos contidos que os do
  trimestre no superado.\\n\\nO alumno que ao final do curso non consiga acadar unha
  cualificaci\u00f3n positiva, ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias
  de setembro.\\n\\nProbas extraordinarias de setembro\\n\\nA proba extraordinaria
  de setembro consistir\u00e1:\\n\\n1) Os  alumnos  deber\u00e1n  interpretar  o  programa  completo  esixido  nos  contidos
  m\u00ednimos.\\n2) Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica
  das obras interpretadas as\u00ed como o grao de cumprimento dos obxectivos programados
  no curso.\\n3) Os criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n
  son os mesmos que figuran para os tres trimestres do curso correspondente. (Consultar
  programaci\u00f3n)\\n\\nMedidas de recuperaci\u00f3n para cursos pendentes\\n\\nO
  alumno que te\u00f1a un curso pendente, matricularase do curso seguinte ademais
  do curso pendente. A recuperaci\u00f3n da materia deber\u00e1 realizarse na clase
  do curso seguinte.\\n\\nMentres non alcance os niveis esixidos e te\u00f1a superado
  o curso pendente, non poder\u00e1 acadar unha cualificaci\u00f3n positiva no curso
  superior.\\n\\nCriterios para a ampliaci\u00f3n de matr\u00edcula\\n\\nPara que
  un alumno lle sexa concedida a ampliaci\u00f3n de matr\u00edcula, ter\u00e1 que
  ser co\\n\\nbenepl\u00e1cito de todos os profesores que lle est\u00e1n a impartir
  as distintas materias.\\n\\nNo Departamento de Tecla, os profesores titores, informar\u00e1n
  os demais profesores dentro do primeiro trimestre, e faranlles un exame para avaliar
  os contidos propios do curso a superar. Dito exame ser\u00e1 similar ao que aparece
  no apartado referido a perdida da avaliaci\u00f3n continua. O alumno deber\u00e1
  demostrar que domina os contidos do curso no que se matriculou e ter\u00e1 que mostrar
  o grao de aptitudes  e capacidade para superar o seguinte.\\n\\nAtenci\u00f3n a
  diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como  actividade  de  entremetemento,  por  inercia  dun  grupo  de  amigos,  etc.  Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo.  \u00e1s
  necesidades dun  alumno  ou  grupo  determinado. Dependendo das circunstancias que
  se presentan na aula, o profesor poder\u00e1 plantexar as seguintes estratexias:\\n\\n1.
  Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente. A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1
  que respectar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nGrao
  profesional 6\u00ba Curso\\n\\nO dese\u00f1o dos curr\u00edculos dos Graos Elemental
  e Medio dun ensino instrumental ha de\\n\\ncubrir o per\u00edodo de formaci\u00f3n
  m\u00e1is decisivo da educaci\u00f3n dun int\u00e9rprete. No caso do piano,  tanto  o  car\u00e1cter  de  solista  que  \u00e9  propio  do  instrumento  como  o  abundante
  repertorio de gran factura que esixe o seu estudo, fan a\u00ednda m\u00e1is palpable
  a evidencia desta afirmaci\u00f3n.\\n\\nO Grao Profesional\\n\\n\u00e9 o per\u00edodo
  onde o dominio da t\u00e9cnica instrumental debe quedar practicamente resolto, as\u00ed
  mesmo, o desenvolvemento das capacidades est\u00e9ticas, debe\\n\\nchegar a discernir
  con claridade \u00e9pocas, autores e estilos b\u00e1sicos dentro dos convenios interpretativos
  ao uso. \u00c9 tam\u00e9n o momento de desenvolver un h\u00e1bito de estudo suficiente\\n\\nen
  n\u00famero de horas, e eficiente en canto \u00e1 s\u00faa distribuci\u00f3n e aproveitamento.
  A m\u00fasica debe entenderse como un modo de expresar dunha parte sentimentos e
  sensaci\u00f3ns, pero\\n\\ntam\u00e9n, e iso e moi importante, como unha linguaxe,
  cunha est\u00e9tica e caracter\u00edsticas propias, dentro dos par\u00e1metros de
  temporalidade e especialidade que lle son connaturais.\\n\\nPercibir todo isto,
  implica adoptar un compromiso art\u00edstico que, ao termo desa fase, deber\u00eda
  ser claro e posibilitar o ulterior desenvolvemento duna verdadeira personalidade\\n\\ncomo
  interprete.\\n\\nA educaci\u00f3n do m\u00fasico, tanto interprete como compositor,
  debe pasar necesariamente, por unha toma de conciencia da necesidade dunha bagaxe
  cultural interdisciplinar, e de moitas horas diarias de dedicaci\u00f3n ao cultivo
  da t\u00e9cnica. A formaci\u00f3n dun pianista non debe ser insensible a esta realidade,
  e os Graos Elemental e Profesional te\u00f1en como obxectivo  conseguir,  en  \u00faltima  instancia,  sentar  as  bases  s\u00f3lidas  para  posibilitar  a
  profundizaci\u00f3n art\u00edstica que se reserva ao Grao Superior.\\n\\nO\\n\\ngrao
  profesional ten como finalidade proporcionarlle ao alumnado unha formaci\u00f3n\\n\\nart\u00edstica
  de calidade e garantir a cualificaci\u00f3n dos futuros profesionais, e ord\u00e9nase
  en catro  funci\u00f3ns b\u00e1sicas:  formativa,  orientadora,  profesionalizadora  e  preparatoria  para\\n\\nestudos
  posteriores.\\n\\nGrao profesional:\\n\\n-\\n\\nHabituarse  a  escoitar  m\u00fasica  e  establecer  un  concepto  est\u00e9tico  que  permita
  fundamentar  e desenvolver os propios criterios interpretativos.\\n\\nDesenvolver
  a sensibilidade art\u00edstica e o criterio est\u00e9tico como fonte de formaci\u00f3n
  e enriquecemento persoal.\\n\\n- Analizar e valorar a calidade da m\u00fasica.\\n\\n-
  Co\u00f1ecer os valores da m\u00fasica.\\n\\n- Participar en actividades de animaci\u00f3n
  musical e cultural.\\n\\n75\\n\\n-\\n\\n- Co\u00f1ecer e empregar con precisi\u00f3n
  o vocabulario espec\u00edfico relativo aos conceptos cient\u00edficos da m\u00fasica.\\n-
  Co\u00f1ecer e valorar o patrimonio musical, como parte do patrimonio hist\u00f3rico
  e cultural.\\n- Tomar conciencia da importancia dunha escoita activa como base na
  formaci\u00f3n de futuros profesionais.\\n- Fomentar a utilizaci\u00f3n do patrimonio
  musical en xeral e a do galego en particular, como medio no enriquecemento da persoa
  e da s\u00faa formaci\u00f3n musical.\\n\\nObxectivos espec\u00edficos:\\n\\n- Superar  con  dominio  e  capacidade  cr\u00edtica  os  contendidos  e  os  obxectivos
  formulados nas materias que compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer os
  elementos b\u00e1sicos das linguaxes musicais e as s\u00faas caracter\u00edsticas.\\n-
  Utilizar o o\u00eddo interno como base da afinaci\u00f3n e da interpretaci\u00f3n
  musical.\\n- Fomentar unha imaxe axustada das posibilidades e caracter\u00edsticas
  musicais de cada un.\\n- Compartir vivencias musicais de grupos na aula e fora dela.\\n-
  Valorar o corpo e a mente para utilizar a t\u00e9cnica e concentrarse na audici\u00f3n
  e na interpretaci\u00f3n.\\n- Relacionar  e  aplicar  os  co\u00f1ecementos  adquiridos  en  todas  as  materias  que
  compo\u00f1en o curr\u00edculo.\\n- Co\u00f1ecer e aplicar as t\u00e9cnicas do instrumento.\\n-
  Adquirir   e  aplicar  os  reflexos  necesarios  para  resolver  eventualidades  na
  interpretaci\u00f3n.\\n- Cultivar a improvisaci\u00f3n e a transposici\u00f3n.\\n-
  Interpretar  individualmente  ou  en  grupo  obras  escritas  en  todas  as  linguaxes
  musicais.\\n- Actuar en p\u00fablico con autocontrol, dominio da memoria e capacidade
  comunicativa.\\n\\nObxectivos\\n\\n- Perfeccionar todos os tipos de ataques.\\n-
  Desenvolver h\u00e1bitos de  estudo  correctos. Regularidade  no  traballo. Lograr
  un aproveitamento  adecuado  das  clases  semanais:  actitude,  comportamento, regularidade
  no estudo.\\n- Perfeccionar os estudos dos pedais en todos os per\u00edodos.\\n\\n-
  Incrementar o adestramento da memoria.\\n- Profundar nas audici\u00f3ns cr\u00edticas.\\n-
  Tocar en p\u00fablico.\\n\\nContidos\\n\\n- Consolidaci\u00f3n dos contidos do curso
  anterior.\\n- Dominio das dificultades t\u00e9cnicas e musicais do repertorio do
  curso: Igualdade e independencia de dedos. Coordinaci\u00f3n entre ambas as mans.
  Pasaxes con paso de pulgar: escalas e arpexos. T\u00e9cnica das notas dobres e xogo
  polif\u00f3nico. T\u00e9cnica de  extensi\u00f3n.  Uso  da  mu\u00f1eca,  antebrazo  e  brazo:  execuci\u00f3n  de  acordes.
  Articulaci\u00f3ns, fraseo, control din\u00e1mico , elementos b\u00e1sicos do estilo
  etc.\\n- Pr\u00e1ctica de escalas en catro oitavas. Co\u00f1ecemento e progresivo
  dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Pr\u00e1ctica de arpexos. en catro oitavas. Co\u00f1ecemento
  e progresivo dominio de todas as tonalidades, maiores e menores. Diferentes articulaci\u00f3ns,
  ataques, din\u00e1micas.\\n- Perfeccionamento de todos os tipos de ataques.\\n-
  Perfeccionamento dos estudos dos pedais en todos os per\u00edodos.\\n- Adquisici\u00f3n
  progresiva de h\u00e1bitos correctos de estudio, desenrolo da autocr\u00edtica,
  autonom\u00eda no estudo e  control auditivo.\\n- Consolidaci\u00f3n dun nivel de
  madurez t\u00e9cnico e musical que permita abordar estudos de grao superior.\\n-
  Incremento do adestramento da memoria.\\n- Profundizaci\u00f3n das audici\u00f3ns
  cr\u00edticas.\\n- Participaci\u00f3n en audici\u00f3ns p\u00fablicas.\\n\\nContidos
  m\u00ednimos\\n\\n- O alumno interpretar\u00e1  polo menos 3 estudos, 1 obra barroca,
  1 obra cl\u00e1sica, 1 obra rom\u00e1ntica e 1 obra moderna. Exercicios , escalas
  e arpexos. indicados polo titor.\\n- Polo menos interpretaranse 3 obras de memoria,
  podendo ser unha delas un s\u00f3 dos estudos.\\n- O alumno tocar\u00e1 polo menos
  unha vez en p\u00fablico durante o curso,  sempre coa autorizaci\u00f3n  previa  do  profesor,  actividade  que  forma  parte  do  proceso  de
  avaliaci\u00f3n.\\n- Por ser o \u00faltimo curso de Grao medio os alumnos ofrecer\u00e1n
  un recital de\\n\\nmemoria, de media hora de duraci\u00f3n, con polo menos 3 obras
  do repertorio do curso.\\n\\nRecursos did\u00e1cticos\\n\\nPara o cumprimento da
  programaci\u00f3n de cada curso, o profesor poder\u00e1 utilizar o material did\u00e1ctico
  que estime oportuno.\\n\\nLista de obras orientativa do nivel esixido\\n\\nImportante:\\n\\nPoder\u00e1n
  interpretarse outras obras de equivalente dificultade.\\n\\n6\u00ba Grao profesional\\n\\nObras
  did\u00e1cticas:\\n\\n- Estudos de virtuosismo e estudos para a man esquerda, Moszkowsky.\\n-
  Estudos sobre Paganini, Schumann.\\n- Estudos Op.740 e 365, Czerny.\\n- Estudos,
  Casella.\\n- Estudos, Chopin\\n- Gradus ad Parnassum, Clementi.\\n- Estudos, Scriabin.\\n\\nObras
  barrocas:\\n\\n- Clave ben temperado, ou Suites,  Bach.\\n- Suites, Haendel.\\n\\nObras
  cl\u00e1sicas:\\n\\n- Sonatas y variaciones, Haydn, Mozart, Beethoven.\\n\\nObras
  rom\u00e1nticas:\\n\\n- Obras de Schubert, Chopin, Schumann, Liszt, etc.\\n\\nObras
  modernas:\\n\\n- Obras de Debussy, Ravel, Alb\u00e9niz, Falla, Groba, Bartok etc.\\n\\nCriterios
  de avaliaci\u00f3n\\n\\n1er trimestre\\n\\n- Utilizar o esforzo muscular adecuado
  \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase a consecuci\u00f3n de todos
  os contidos reflexados na programaci\u00f3n.\\n- Demostrar o dominio t\u00e9cnico
  e musical na execuci\u00f3n do repertorio traballado.\\n- Demostrar sensibilidade
  auditiva no uso das posibilidades sonoras do piano no\\n\\nrelativo a modos de ataque
  e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas, con atenci\u00f3n
  a calidade do son.\\n\\n- Interpretar os obras esixidas en cada curso segundo o
  programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n- Resolver
  con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n que poidan
  presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n fraseo.\\n- Ser\u00e1
  imprescindible que o alumno complete 3 obras ou estudos t\u00e9cnicos.\\n- O alumno
  interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n2\u00ba trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar os obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo
  etc.\\n- Ser\u00e1 imprescindible que o alumno complete 2 obras ou estudos t\u00e9cnicos.\\n-
  O alumno interpretar\u00e1 de memoria como m\u00ednimo 1 obra.\\n\\n3er trimestre\\n\\n-
  Utilizar o esforzo muscular adecuado \u00e1s esixencias da execuci\u00f3n.\\n- Valorarase
  a consecuci\u00f3n de todos os contidos reflexados na programaci\u00f3n.\\n- Demostrar
  o dominio t\u00e9cnico e musical na execuci\u00f3n do repertorio traballado.\\n-
  Demostrar sensibilidade auditiva no uso das posibilidades sonoras do piano no relativo
  a modos de ataque e execuci\u00f3n, e no uso do pedal e nas cuestiones din\u00e1micas,
  con atenci\u00f3n a calidade do son.\\n- Interpretar as obras esixidas en cada curso
  segundo o programa.\\n- Interpretar de memoria con fluidez, seguridade e control.\\n-
  Resolver con autonom\u00eda os problemas t\u00e9cnicos e de interpretaci\u00f3n
  que poidan presentarse nas partituras: dixitaci\u00f3n, pedalizaci\u00f3n, fraseo.
  calidade do son...\\n\\n- Ser\u00e1 imprescindible que o alumno complete 3 estudos
  t\u00e9cnicos e 4 obras.\\n- O alumno interpretar\u00e1 de memoria como m\u00ednimo
  1 obra.\\n- Ser\u00e1 imprescindible que o alumno toque polo menos unha vez en p\u00fablico
  durante o curso.\\n- Demostrar autonom\u00eda no emprego dos recursos t\u00e9cnicos
  adquiridos en cursos anteriores.\\n- Demostrar criterios de interpretaci\u00f3n
  persoais en coherencia co estilo e a \u00e9poca.\\n- Afrontar un recital como solista.\\n-
  Ser capaz de efectuar unha autocr\u00edtica madura do propio rendemento interpretativo
  en funci\u00f3n do esforzo realizado e do estudo.\\n- Prepararse para facer unha
  posible proba de acceso ao Grao Superior.\\n\\nProcedementos de avaliaci\u00f3n\\n\\nNos
  Graos elemental e profesional, os profesores  aval\u00edan aos seus alumnos tendo
  en conta os obxectivos e os criterios de avaliaci\u00f3n establecidos na programaci\u00f3n
  e no curriculo.\\n\\nA avaliaci\u00f3n  ser\u00e1  continua,  cualitativa  e  integradora  e
  o profesor valorar\u00e1  de  forma constante o progreso dos alumnos ao longo de
  todo o curso, as\u00ed como a s\u00faa asistencia e actitude.\\n\\nPartindo da avaluaci\u00f3n
  continua os profesores poden  establecer probas  de avaliaci\u00f3n:\\n\\n[x] Avaliaci\u00f3n
  puntual. O profesor poder\u00e1 realizar exames mensuais, trimestrais ou con calquera
  outra periodicidade como ferramenta de avaluaci\u00f3n. Se valorar\u00e1 o rendemento
  do alumno as\u00ed como a calidade e cantidade de traballo presentada.\\n[x] Audici\u00f3ns.
  O profesor valorar\u00e1 o comportamento do alumno nas audici\u00f3ns ou concertos
  programados polo departamento.\\n\\nA cualificaci\u00f3n final non ser\u00e1 a media
  das cualificaci\u00f3ns parciais. Esta cualificaci\u00f3n final\\n\\nser\u00e1  a  que  te\u00f1a  en  conta  o  desenrolo  da  capacidade  do  alumno  durante  o  curso,
  significar\u00e1 o nivel de preparaci\u00f3n e o grao de madurez que este leva,
  para facerlle fronte\\n\\nao curso seguinte.\\n\\nOs resultados das  avaliaci\u00f3ns
  expresaranse mediante a escala num\u00e9rica de 1 a 10 sen\\n\\ndecimais.\\n\\nConsid\u00e9ranse  positivas  as  cualificaci\u00f3ns  iguais  ou  superiores  a  5,  e  negativas,  as
  inferiores a 5.\\n\\nCriterios de cuantificaci\u00f3n e calibraci\u00f3n\\n\\n-Criterios
  t\u00e9cnicos:\\n\\nT\u00e9cnica, resoluci\u00f3n das dificultades, hixiene postural,
  desenrolo do o\u00eddo interno etc...40%. -Criterios est\u00e9ticos:\\n\\nInterpretaci\u00f3n
  e co\u00f1ecemento dos diferentes estilos, calidade do son en relaci\u00f3n co estilo,
  creatividade, resultado musical, capacidade de comunicaci\u00f3n..etc\u2026 40 %.\\n\\n-Criterios
  actitudinais:\\n\\nActitude,  interese, comportamento...etc.. 20%.\\n\\nPara ter
  opci\u00f3n a facer media, e polo tanto, aprobar, o alumno deber\u00e1 acadar un
  5 en cada un  dos apartados sinalados.\\n\\nPerda da avaliaci\u00f3n continua\\n\\nO  proceso  de  aprendizaxe  art\u00edstico  nos  niveis  elemental  e  profesional  require  un
  seguimento constante por parte do profesor e polo tanto a asistencia regular \u00e1s
  clases.\\n\\nA comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica acordo\u00fa que
  o n\u00famero m\u00e1ximo de faltas sen xustificar ser\u00e1n de catro clases na
  asignatura de Piano, que levar\u00e1 \u00e1 perda do dereito a avaliaci\u00f3n continua.\\n\\nOs
  alumnos que perdan dito dereito, ter\u00e1n que someterse a un exame, ao que ser\u00e1
  convocado polo profesor. Consistira nos seguintes puntos, tendo en conta os contidos
  xerais  do curso reflectidos na programaci\u00f3n:\\n\\nO alumno deber\u00e1 interpretar
  o programa esixido de acordo con contidos e obxectivos do curso.\\n\\nAvaliarase
  a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas as\u00ed
  como o grao de cumprimento dos obxectivos programados para cada curso.\\n\\nNo  caso  de  que  o  alumno  non  tocara  en  p\u00fablico  o  n\u00famero  de  veces  esixidos  na
  programaci\u00f3n, o far\u00e1 diante de quen o profesor estime oportuno.\\n\\nMedidas
  de recuperaci\u00f3n\\n\\nProcedementos de recuperaci\u00f3n trimestrais\\n\\nFarase
  a recuperaci\u00f3n na propia clase. O profesor fixar\u00e1 unha data para facer
  o exame de recuperaci\u00f3n cos mesmos contidos que os do trimestre no superado.\\n\\nO
  alumno que ao final do curso nos consiga acadar unha cualificaci\u00f3n positiva,
  ter\u00e1 dereito a presentarse \u00e1s probas extraordinarias de setembro.\\n\\nProbas
  extraordinarias de setembro\\n\\nA proba extraordinaria de setembro consistir\u00e1:\\n\\n1)
  Os alumnos deber\u00e1 interpretar o programa completo esixido nos contidos m\u00ednimos.\\n\\n2)
  Avaliarase a correcci\u00f3n t\u00e9cnica e estil\u00edstica das obras interpretadas
  as\u00ed como o grao de cumprimento dos obxectivos programados no curso.\\n3) Os
  criterios de avaliaci\u00f3n e a s\u00faa cuantificaci\u00f3n son os mesmos que
  figuran para os tres trimestres do curso correspondente. (Consultar programaci\u00f3n)\\n\\nMedidas
  de recuperaci\u00f3n para cursos pendentes\\n\\nO alumno que te\u00f1a un curso
  pendente, matricularase do curso seguinte ademais do curso pendente. A recuperaci\u00f3n
  da materia deber\u00e1 realizarse na clase do curso seguinte. Mentres non alcance
  os niveis esixidos e te\u00f1a superado o curso pendente, non poder\u00e1 acadar
  unha cualificaci\u00f3n positiva no curso superior.\\n\\nAtenci\u00f3n a diversidade\\n\\nO  alumnado  do  Conservatorio  habitualmente  est\u00e1  dentro  dun  nivel  sociocultural  e
  econ\u00f3mico medio alto, cunha grande capacidade de traballo pois ten que compaxinar
  os estudos  de  m\u00fasica  cos  de  ensinanzas  xerais.  As  motivaci\u00f3ns  para  estudar  no
  Conservatorio son distintas e poden variar conforme se suceden os cursos. Os motivos
  polos que inician os estudos musicais poden ser por iniciativa dos pais, por vocaci\u00f3n,
  como actividade de entretenemento, por inercia dun grupo de amigos, etc. Ent\u00f3n,
  teremos un alumnado diferente en canto a motivaci\u00f3ns, aptitudes e ritmos de
  traballo polo que ser\u00e1 de vital importancia a atenci\u00f3n \u00e1 diversidade
  do alumnado para adaptarse \u00e1s s\u00faas necesidades e realizar unha acci\u00f3n
  educativa eficaz.\\n\\nA v\u00eda para o tratamento da diversidade \u00e9 a Adaptaci\u00f3n
  Curricular, conxunto de acci\u00f3ns dirixidas  a  adecuar  o  curr\u00edculo  \u00e1s  necesidades  dun  alumno  ou  grupo  determinado.
  Dependendo das circunstancias que se presentan na aula, o profesor poder\u00e1 plantexar
  as seguintes estratexias:\\n\\n1. Adaptaci\u00f3ns do  material  did\u00e1ctico,  que  ofrezan  unha  gama  ampla  de  actividades
  did\u00e1cticas que respondan os diferentes graos de aprendizaxe.\\n2. Variaci\u00f3ns
  da metodolox\u00eda para adaptala \u00e1s necesidades de cada alumno.\\n3. Propo\u00f1er
  actividades de  traballo  diferenciadas.  O  profesor far\u00e1  unha  an\u00e1lise  dos
  contidos da materia e preparar\u00e1 actividades con distinto nivel de dificultade
  que permitan tratar estes mesmos contidos con esixencias distintas.\\n4. Organizar
  o traballo de forma flexible e con ritmos distintos de aprendizaxe.\\n5. Acelerar
  ou frear o ritmo de introduci\u00f3n de novos contidos adapt\u00e1ndose ao alumno
  individualmente. A adaptaci\u00f3n dos obxectivos e por tanto dos contidos ter\u00e1
  que respectar os m\u00ednimos esixibles fixados na programaci\u00f3n.\\n\\nProcedementos
  de avaliaci\u00f3n e seguimento da programaci\u00f3n.\\n\\nAo longo do curso,  nas
  reuni\u00f3ns do departamento, os profesores  revisar\u00e1n de forma permanente
  o grao de cumprimento da programaci\u00f3n as\u00ed os resultados acad\u00e9micos
  dos alumnos,  tendo  en  conta  tanto  os  obxectivos  e  contidos  propostos,  como  as
  caracter\u00edsticas individuais de cada un dos alumnos: avaliaci\u00f3n inicial,
  atenci\u00f3n nas clases, tempo dedicado ao instrumento, condici\u00f3ns, talento,
  capacidades, etc.\\n\\nOs profesores informar\u00e1n  aos alumnos e aos seus pais
  do grao de cumprimento dos m\u00ednimos esixidos, dos criterios cos que van ser
  avaliados e da s\u00faa evoluci\u00f3n.\\n\\nAs\u00ed mesmo, tentarase manter un
  contacto continuo co resto dos departamentos para ter unha visi\u00f3n global do
  desenvolvemento de cada alumno.\\n\\nProcedementos para a avaliaci\u00f3n interna
  do departamento.\\n\\nAs reuni\u00f3ns do departamento son o foro onde se realizar\u00e1
  de forma permanente, a avaliaci\u00f3n interna das estratexias metodol\u00f3xicas
  do departamento, valorando o grao de cumprimento da programaci\u00f3n, os resultados
  acad\u00e9micos, os resultados art\u00edsticos etc. Todo iso, tendo en conta a idiosincrasia
  propia do instrumento, as\u00ed como a individualidade de cada un dos alumnos: o
  seu grao de compromiso co estudo, facultades, talento, esforzo, interese no estudo
  do instrumento, etc.\\n\\nComent\u00e1sense  regularmente  as  audici\u00f3ns  realizadas  polos  alumnos,  os  resultados
  globais  de  cada  avaliaci\u00f3n  e  calquera  cuesti\u00f3n  que  os  membros  do  departamento
  consideren oportuna. Trasladaranse \u00e1 comisi\u00f3n de coordinaci\u00f3n pedag\u00f3xica  os
  puntos que os profesores estimen necesarios. Finalmente revisaranse as porcentaxes
  finais de aprobados e  suspensos e unificando  criterios para  obter o  \u00f3ptimo  desenvolvemento
  musical, art\u00edstico e instrumental dos alumnos.\\n\\nPor  outra  banda,  dentro  desta  avaliaci\u00f3n  interna,  terase  en  conta  e  de  forma  moi
  destacada,   os  medios  f\u00edsicos  e  humanos  cos  que  conta  o  departamento:  material
  impreso: partituras, libros de consulta, revistas especializadas, instrumentos e
  o seu estado (pianos  de cola en n\u00famero suficiente e aulas con dous pianos
  ), mobiliario adecuado, orzamento para actividades, cursos, clases maxistrais,  dispo\u00f1ibilidade
  de aulas para clases de apoio, n\u00famero de profesores axeitado en relaci\u00f3n
  coa demanda, cursos de formaci\u00f3n espec\u00edficos para o profesorado e flexibilidade
  para a s\u00faa reciclaxe, flexibilidade para a realizaci\u00f3n de proxectos art\u00edsticos
  por parte dos profesores etc ... En definitiva os medios  b\u00e1sicos para alcanzar
  un ensino profesional de calidade, e que\\n\\npermita aos profesores e alumnos levar
  a cabo, de forma real os obxectivos que a programaci\u00f3n exp\u00f3n soamente
  de forma te\u00f3rica. Desta banda a avaluaci\u00f3n incluir\u00e1  no so o an\u00e1lise
  dos resultados, e da consecuci\u00f3n dos obxectivos programados, si non tam\u00e9n
  o an\u00e1lise  do grao de compromiso, implicaci\u00f3n e di\u00e1logo cos profesores,
  dos responsables do centro en xeral e de a administraci\u00f3n en particular,  no
  proceso educativo dos  alumnos deste departamento.\\n\\nA clase colectiva\\n\\nPuntos
  b\u00e1sico a desenrolar.\\n\\n1. Sintaxe musical. Memorizaci\u00f3n e an\u00e1lise\\n2.
  Pr\u00e1ctica instrumental en conxunto\\n3. Desenvolvemento da creatividade\\n4.
  Conciencia corporal\\n5. Formaci\u00f3n do o\u00eddo\\n\\n1. LECTURA\\n\\n1\u00ba
  GE\\n\\nObxectivos\\n\\n- Iniciar a pr\u00e1ctica da lectura a vista, tanto en textos
  homof\u00f3nicos como polif\u00f3nicos.\\n- Adaptarse a ter ante si dous pentagramas
  con d\u00faas claves distintas.\\n- Desenvolver a capacidade de s\u00edntese e automatismos.\\n-
  Iniciar a pr\u00e1ctica da lectura interv\u00e1lica.\\n- Tomar conciencia do pulso
  interior.\\n- Desenvolver progresivamente o h\u00e1bito de tocar os textos musicais
  de forma continua.\\n\\nContidos\\n\\n- Familiarizaci\u00f3n coas figuras b\u00e1sicas
  redonda, branca, negra e corchea e os seus respectivos silencios.\\n- Utilizaci\u00f3n
  dos compases de subdivisi\u00f3n binaria mais frecuentes: 2/4, \u00be e 4/4.\\n-
  Inclusi\u00f3n das indicaci\u00f3ns din\u00e1micas: F e P\\n- Pr\u00e1ctica de diferentes
  articulaci\u00f3ns: legato e non legato.\\n- Iniciaci\u00f3n da lectura interv\u00e1lica
  con distancias de 2\u00aa, 3\u00aa, 4\u00aa e 5\u00aa, mantendo a man en posici\u00f3n
  fixa.\\n\\n- Lectura con progresivo grado de dificultade de exerc\u00edcios r\u00edtmicos,
  ostinatos, c\u00e1nones e exercicios mel\u00f3dicos en posici\u00f3n fixa en relaci\u00f3n
  cos contidos anteriores.\\n\\nMaterial orientativo:\\n\\n- \\\"Paso a paso I\\\",
  de Sebasti\u00e1n Marin\u00e9.\\n- \\\"Premi\u00e8res lectures pour le piano\\\",
  de Jaques Capuis\\n- \\\"20 \\\"quarts d\u00b4heure\\\" de lecture \u00e0 vue au
  piano\\\" de Albert Jeanneret.\\n- \\\"El piano a primeira vista. Elemental. 1er
  curso\\\" de Benjam\u00edn Santacana\\n- \\\"Clase colectiva de piano vol. 1\\\"
  de Eva Mal\u00eda\\n\\n2\u00ba GE\\n\\nObxectivos\\n\\n- Continuar desenvolvendo
  o h\u00e1bito de ler a vista, tanto textos homof\u00f3nicos como polif\u00f3nicos.\\n-
  Familiarizarse coa pr\u00e1ctica da lectura simult\u00e1nea a d\u00faas claves distintas.\\n-
  Continuar mellorando a capacidade de s\u00edntese e automatismos.\\n- Afianzar a
  pr\u00e1ctica da lectura interv\u00e1lica.\\n- Tomar conciencia do pulso interior.\\n-
  Desenvolver progresivamente o h\u00e1bito de tocar os textos musicais de forma cont\u00ednua.\\n\\nContidos\\n\\nPresupose
  o traballo dos contidos do curso anterior e eng\u00e1dense os seguintes:\\n\\n-
  Familiarizaci\u00f3n cos ritmos: d\u00faas corcheas, tres, negra con punto, negra-corchea\\n-
  Utilizaci\u00f3n dos compases de subdivisi\u00f3n ternaria mais frecuentes: 3/8
  e 6/8.\\n- Inclusi\u00f3n das indicaci\u00f3ns din\u00e1micas: mf e mp.\\n- Pr\u00e1ctica
  de diferentes articulaci\u00f3ns.\\n\\n- Ampliaci\u00f3n da interv\u00e1lica de
  lectura ata a 6\u00aa.\\n\\n- Lectura con progresivo grado de dificultade de exercicios
  r\u00edtmicos, ostinatos, c\u00e1nones e exercicios mel\u00f3dicos, en posici\u00f3n
  fixa en relaci\u00f3n cos contidos anteriores.\\n\\nMaterial orientativo:\\n\\n-
  \\\"Paso a paso II\\\", de Sebasti\u00e1n Marin\u00e9.\\n- \\\"Premi\u00e8res lectures
  pour le piano\\\", de Jaques Capuis\\n- \\\"20 \\\"quarts d\u00b4heure\\\" de lecture
  \u00e0 vue au piano\\\" de Albert Jeanneret.\\n\\n- \\\"El piano a primera vista.
  Elemental. 2\u00ba curso\\\" de Benjam\u00edn Santacana\\n- \\\"Clase colectiva
  de piano vol. 2\\\" de Eva Mal\u00eda\\n\\n3\u00ba GE\\n\\nObxectivos\\n\\n- Afianzar
  a soltura no h\u00e1bito de ler a vista, tanto textos homof\u00f3nicos como polif\u00f3nicos.\\n-
  Adquirir un certo grado de soltura na lectura simult\u00e1nea a d\u00faas claves
  distintas.\\n- Continuar desenvolvendo a capacidade de s\u00edntese e automatismos.\\n-
  Consolidar a pr\u00e1ctica da lectura interv\u00e1lica.\\n- Afianzar o sentido r\u00edtmico
  interno.\\n- Realizar os exercicios de lectura a vista mantendo a continuidade do
  discurso.\\n\\nContidos\\n\\nPresuponse o traballo dos contidos dos cursos anteriores,
  engad\u00edndose os seguintes:\\n\\n- Familiarizaci\u00f3n cos ritmos: corchea-negra-corchea,
  silencio corchea-corchea, semicorcheas, s\u00edncopas e contratempos.\\n- Utilizaci\u00f3n
  de todos os compases de subdivisi\u00f3n binaria e ternaria.\\n- Inclusi\u00f3n
  do crescendo e o diminuendo.\\n- Pr\u00e1ctica de esforzandos e acentos.\\n- Ampliaci\u00f3n
  da interv\u00e1lica de lectura ata a 7\u00aa e a 8\u00aa.\\n- Lectura con progresivo
  grado de dificultade de exercicios r\u00edtmicos, ostinatos, c\u00e1nones e exercicios
  mel\u00f3dicos , en posici\u00f3n fixa en relaci\u00f3n cos contidos anteriores.\\n\\nMaterial
  orientativo:\\n\\n- \\\"Paso a paso III\\\", de Sebasti\u00e1n Marin\u00e9.\\n-
  \\\"El piano a primera vista. Elemental. 3\u00ba curso\\\" de Benjam\u00edn Santacana\\n-
  \\\"Clase colectiva de piano vol. 3\\\" de Eva Mal\u00eda\\n- \\\"Ejerc\u00edcios
  de repentizaci\u00f3n y transporte\\\"\\n\\n4\u00ba GE\\n\\nObxectivos\\n\\n- Consolidar
  a soltura no h\u00e1bito de ler a vista, tanto textos homof\u00f3nicos como polif\u00f3nicos.\\n-
  Afianzar a soltura na lectura a d\u00faas claves distintas.\\n\\n- Continuar desenvolvendo
  a capacidade de s\u00edntese e automatismos.\\n- Consolidar a pr\u00e1ctica da lectura
  interv\u00e1lica.\\n- Afianzar o sentido r\u00edtmico interno.\\n- Realizar os exercicios
  de lectura a vista mantendo a continuidade do discurso.\\n\\nContidos\\n\\nPresuponse
  o traballo dos contidos dos cursos anteriores, engad\u00edndose os seguintes:\\n\\n-
  Familiarizaci\u00f3n cos grupos de valoraci\u00f3n especial: tresillo. Combinaci\u00f3n
  cos elementos anteriores.\\n- Utilizaci\u00f3n de todos os compases de subdivisi\u00f3n
  binaria e ternaria.\\n- Inclusi\u00f3n de todas as indicaci\u00f3ns din\u00e1micas.\\n-
  Pr\u00e1ctica de acentos e esforzandos.\\n\\n- Familiarizaci\u00f3n cos cambios
  de posici\u00f3n na lectura a vista.\\n\\n- Pr\u00e1ctica de cambios de comp\u00e1s
  dentro do mesmo exercicio.\\n- Lectura con progresivo grado de dificultade de exercicios
  r\u00edtmicos, ostinatos, c\u00e1nones e exercicios mel\u00f3dicos, en posici\u00f3n
  fixa en relaci\u00f3n cos contidos anteriores.\\n\\nMaterial orientativo:\\n\\n-
  \\\"Paso a paso IV\\\", de Sebasti\u00e1n Marin\u00e9.\\n- \\\"El piano a primera
  vista. Elemental. 4\u00ba curso\\\" de Benjam\u00edn Santacana\\n- \\\"Clase colectiva
  de piano vol. 4\\\" de Eva Mal\u00eda\\n- \\\"Ejerc\u00edcios de repentizaci\u00f3n
  y transporte\\\"\\n\\n2. SINTAXE MUSICAL. MEMORIZACI\u00d3N E AN\u00c1LISE\\n\\n1\u00ba
  GE\\n\\nObxectivos\\n\\n- Tomar conciencia do pulso e asimilalo.\\n- Desenvolver
  a sensibilidade tonal, comezando co intervalo de 5\u00aa e seguindo polo de 3\u00aa.\\n-
  Asociar as distancias no teclado coas distancias sonoras.\\n- Comprender e levar
  \u00e1 pr\u00e1ctica o concepto de dominante e t\u00f3nica.\\n- Conseguir unha aprendizaxe
  significativa nos seguintes aspectos musicais: tonalidade, modalidade, pentacordio,
  imitaci\u00f3n, pregunta - resposta e canon.\\n- Identificar as frases e as semifrases
  do discurso musical.\\n\\n- Presentar a cadencia perfecta.\\n\\nContidos\\n\\n-
  Desenvolvemento dos reflexos necesarios para que na medida do posible o pulso non
  se vexa alterado, interrumpindo o discurso musical. (Interiorizaci\u00f3n do pulso.)\\n-
  Reco\u00f1ecemento das sonoridades de t\u00f3nica e dominante.\\n- Fomento das capacidades
  de asimilaci\u00f3n, concentraci\u00f3n e memoria.\\n- Asimilaci\u00f3n auditiva
  do canon e da imitaci\u00f3n.\\n- An\u00e1lise de pequenas pezas musicais.\\n- Pr\u00e1ctica
  da cadencia perfecta.\\n\\nMetodolox\u00eda\\n\\nPartir sempre da sensaci\u00f3n
  auditiva e da imitaci\u00f3n antes que da lectura.\\n\\n2\u00ba GE\\n\\nObxectivos\\n\\n-
  Continuar traballando a conciencia do pulso e asimilalo.\\n- Desenvolver a sensibilidade
  tonal, en todos os intervalos.\\n- Superar o \u00e1mbito da posici\u00f3n dos 5
  dedos.\\n- Traballar o concepto de dominante e t\u00f3nica con diferentes patrones
  de acompa\u00f1amento. Engadir o IV grao.\\n- Conseguir unha aprendizaxe significativa
  nos seguintes aspectos musicais: tonalidade, modalidade, pentacordio, imitaci\u00f3n,
  pregunta resposta e canon.\\n- Identificar as frases e as semifrases do discurso
  musical.\\n- Presentar a cadencia plagal e consolidar a perfecta.\\n\\nContidos\\n\\n-
  Desenvolvemento dos reflexos necesarios para que na medida do posible o pulso non
  se vexa alterado, interrumpindo o discurso musical. (Interiorizaci\u00f3n do pulso.)\\n-
  Reco\u00f1ecemento das sonoridades de t\u00f3nica e dominante.\\n- Fomento das capacidades
  de asimilaci\u00f3n, concentraci\u00f3n e memoria.\\n- Asimilaci\u00f3n auditiva
  do canon e da imitaci\u00f3n.\\n- An\u00e1lise de pequenas pezas musicais.\\n- Pr\u00e1ctica
  das cadencias perfectas e plagais.\\n\\n3\u00ba GE\\n\\nObxectivos\\n\\n- Tomar
  conciencia do pulso e asimilalo.\\n- Desenvolver a sensibilidade tonal, comezando
  co intervalo de 5\u00aa e seguindo polo de 3\u00aa.\\n- Comprender e levar \u00e1
  pr\u00e1ctica o concepto de dominante, subdominante e t\u00f3nica.\\n- Conseguir
  unha aprendizaxe significativa nos seguintes aspectos musicais: tonalidade, modalidade,
  pentacordio, imitaci\u00f3n, pregunta resposta e canon.\\n- Identificar as frases
  e as semifrases do discurso musical.\\n- Presentar a cadencia rota e a semicadencia.
  Afianzar as perfectas e as plagais.\\n\\nContidos\\n\\n- Desenvolvemento dos reflexos
  necesarios para que na medida do posible o pulso non se vexa alterado, interrumpindo
  o discurso musical. (Interiorizaci\u00f3n do pulso.)\\n- Reco\u00f1ecemento das
  sonoridades de t\u00f3nica, subdominante e dominante.\\n- Fomento das capacidades
  de asimilaci\u00f3n, concentraci\u00f3n e memoria.\\n- Asimilaci\u00f3n auditiva
  do canon e da imitaci\u00f3n.\\n- An\u00e1lise de pequenas pezas musicais de dificultade
  crecente.\\n- Pr\u00e1ctica das cadencias: perfecta, plagal, semicadencia e rota.\\n\\n4\u00ba
  GE\\n\\nObxectivos\\n\\n- Tomar conciencia do pulso e asimilalo.\\n- Desenvolver
  a sensibilidade tonal, comezando co intervalo de 5\u00aa e seguindo polo de 3\u00aa.\\n-
  Comprender e levar \u00e1 pr\u00e1ctica o concepto de dominante e t\u00f3nica.\\n-\\nConseguir
  unha aprendizaxe significativa nos seguintes aspectos musicais: tonalidade, modalidade,
  pentacordio, imitaci\u00f3n, pregunta resposta e canon.\\n- Identificar as frases
